":150,"text":"How would you tell the difference between?","zh":"你怎么能区分它们呢？","start":1539.8,"end":1541.14},{"id":151,"text":"Yeah, so you run with different k.","zh":"是的，所以你可以用不同的k值进行尝试。","start":1541.72,"end":1543.0},{"id":152,"text":"So I have my solution with k equals 1, k equals 2.","zh":"所以我有k等于1和k等于2的解。","start":1543.18,"end":1546.04},{"id":153,"text":"And by the way, if I run k equals 2 some number of times,","zh":"顺便说一句，如果我用k等于2运行多次，","start":1546.2,"end":1549.12},{"id":154,"text":"I may also get different answers,","zh":"我可能会得到不同的结果，","start":1549.24,"end":1550.34},{"id":155,"text":"because we talked about the initialization matters","zh":"因为我们讨论过初始化的问题","start":1550.46,"end":1552.68},{"id":156,"text":"where I randomly initialize.","zh":"其中我随机初始化。","start":1552.68,"end":1553.78},{"id":157,"text":"So now how do I decide which one of those are good?","zh":"那么现在我该如何决定哪一个才是好的呢？","start":1554.14,"end":1556.36},{"id":158,"text":"The answers are good or bad? You could take the average cost function.","zh":"这些答案是好还是坏？你可以取平均成本函数。","start":1556.36,"end":1561.94},{"id":159,"text":"What challenge with the average cost function can you imagine comparing across values of k?","zh":"你能想象出在比较不同k值时，平均成本函数有什么挑战吗？","start":1562.1,"end":1567.44},{"id":160,"text":"Awesome. Yeah, exactly right. As you increase k, you're getting back to this.","zh":"太棒了。没错，正如你所说。随着k的增加，你会回到这种情况。","start":1569.44,"end":1573.1},{"id":161,"text":"You're getting finer and finer clusters. But is it really better? I don't know.","zh":"你会得到越来越细的聚类。但真的更好吗？我不确定。","start":1573.18,"end":1577.22},{"id":162,"text":"Please. So is it safe to say that with the choice of K, it's fundamentally motivated by a modeling question, but the number of resulting clusters that you get out of that with respect to whatever you're trying to model is also a modeling question based on what answers you were trying to get. Exactly right. The question, I'm sure it's clear, but I'm trying to say in this example, perhaps if I were to say, oh, there are two, if I ran the two clusters here,","zh":"请。因此，我们可以安全地说，选择K本质上是由建模问题驱动的，但你从该选择中得到的聚类数量，相对于你试图建模的内容，也是基于你想要得到的答案的建模问题。没错。这个问题，我相信是清楚的，但我想在这一个例子中说明，也许如果我说，哦，这里有两类，如果我在这些数据上运行两个聚类，","start":1578.55,"end":1606.25},{"id":163,"text":"There might be an interpretation of that, but it's fundamentally based off of other principles and models that are . Exactly right. And we'll see an example that comes up like this later. But you're exactly right that when you say what's going on in K, there are two clusters. You're implicitly saying something about the state of the world.","zh":"可能会有这种解释，但本质上是基于其他原理和模型的。没错。我们之后会看到一个类似的例子。但你完全正确，当你在K中说有两类时，你实际上是在隐含地表达对世界状态的看法。","start":1606.8,"end":1624.16},{"id":164,"text":"you're translating that into K. Oh, there are places where the event happens and where they","zh":"你将这种看法转化为K。哦，有些地方事件发生，而其他地方则","start":1624.52,"end":1628.72},{"id":165,"text":"don't happen, and I want to bring them together. Or you're saying something like, I know there are","zh":"这些情况不会发生，我想把它们放在一起。或者说，你知道有五个数据源，你想对这五个数据源进行聚类。我恰好知道整体情况。","start":1628.72,"end":1632.58},{"id":166,"text":"five sources of data, and I want to cluster those five sources. I happen to know that overall.","zh":"或者你是在说，我不知道，回到关于探索K的问题，我想在不同的K值下看看哪种情况可能更合适。","start":1632.58,"end":1637.2},{"id":167,"text":"Or you're saying, I don't know, back to the question about exploring K,","zh":"所有这些都是这个算法的合理用途。正如我所说，这就是为什么使用它在概念上变得稍微有些挑战性，因为它不像运行线性侵略者并拟合直线那样直接。","start":1637.66,"end":1641.1},{"id":168,"text":"and I want to see under different K what might actually fit.","zh":"我想看看在不同的 K 值下，什么模型实际上可能适合。","start":1641.26,"end":1644.22},{"id":169,"text":"All those are reasonable uses for this algorithm. And as I said, that's why it becomes a little bit","zh":"这些都是这个算法的合理用途。正如我所说，这就是为什么它会变得有点","start":1644.46,"end":1649.88},{"id":170,"text":"more conceptually challenging to use it's not as straightforward as run the linear aggressor and","zh":"拟合直线，好的，很棒的问题，这些真的非常好，其他人，好的，请你能做点什么，当你增加K值时，你知道的，高K值会得到，你知道的，有更多的","start":1649.88,"end":1654.62},{"id":171,"text":"fit the line okay awesome questions these are really great others all right oh please can you","zh":"K值越多，你知道的，高K值会得到，你知道的，有更多的","start":1654.62,"end":1665.66},{"id":172,"text":"do something where the more k you add you know the the high k gets the you know there's more","zh":"做某些事情，当你增加 K 值时，你知道高 K 值会得到，你知道随着 K 值增加，会有更多","start":1665.66,"end":1672.82},{"id":173,"text":"the distances of each point. But can you not say plot something with that cost against it and look","zh":"每个点的距离。但你不能说用这个成本与之绘制图表并观察吗？","start":1672.82,"end":1679.4},{"id":174,"text":"for inflection or something? Wonderful idea. So the idea is,","zh":"寻找拐点或其他东西？好主意。所以这个想法是，","start":1679.4,"end":1683.18},{"id":175,"text":"you're telling me there's nothing you can do and it has to all be like slaughter a goat and look at","zh":"你告诉我你什么都做不了，必须像宰杀山羊一样，只看血液。而我在告诉你这是事实。但你在问，还有其他度量方式吗？","start":1683.26,"end":1688.36},{"id":176,"text":"the blood. And I'm telling you that's the truth. But you're asking, are there other measures?","zh":"对于 k-means，实际上并没有其他很好的度量方式，因为你需要一些其他的结构。","start":1688.36,"end":1692.62},{"id":177,"text":"For k-means, there aren't really great other measures because you need some other structure.","zh":"我们马上会看到高斯混合模型会加载一个概率结构","start":1692.86,"end":1696.96},{"id":178,"text":"We're going to see something Gaussian mixture in a second that loads up a probabilistic structure","zh":"结构到它上面，让你能够谈论似然性以及其他你完全可以开始的","start":1697.22,"end":1701.94},{"id":179,"text":"structure onto it that allows you to talk about likelihoods and other kinds of things you can certainly start to","zh":"事情。基本上你的直觉是正确的，那就是还有其他次要特征吗？","start":1701.94,"end":1706.96},{"id":180,"text":"basically what your intuition which is dead on is aren't there other secondary characteristics","zh":"基本上你的直觉是正确的，但还有其他次要特征","start":1707.4,"end":1711.4},{"id":181,"text":"of goodness of fit and i would say goodness of fit that just depends on the same model parameters","zh" ext":"All right. So here's the picture that I want to draw.","zh":"好的，所以我想画出这张图。","start":1810.94,"end":1814.52},{"id":203,"text":"Okay, so this is a toy example. I looked this up a couple years ago because there's some friends. This is like looking at, I looked into the literature and I tried to find what are good examples of using mixture of Gaussians that I thought were fun and interesting.","zh":"好的，这是一个玩具例子。我大约两年前查过这个，因为有一些朋友。这类似于查看，我查阅了文献，试图找到一些使用高斯混合的好例子，我认为它们有趣且引人入胜。","start":1816.01,"end":1829.99},{"id":204,"text":"This was from some friends at the University of Washington. And they were looking for quasars and stars. They're both sources of light. And the idea here is that these quasars and stars are shooting off light. Those photons are coming. They're hitting us. And we're counting the number of photons. And so at a particular time point, we're going to observe a bunch of photons. I'm trying to draw this picture so it makes a little bit of sense. And then maybe there's something.","zh":"这是来自华盛顿大学的一些朋友的。他们正在寻找类星体和恒星。它们都是光源。这里的想法是，这些类星体和恒星会发出光。这些光子会到达我们这里。我们统计光子的数量。因此，在特定的时间点，我们会观察到一堆光子。我试图画出这张图，让它有点意义。然后可能还有其他东西。","start":1830.63,"end":1858.8},{"id":205,"text":"Every cross x here is supposed to be a photon that we observe. So this is what we're given. And then what we like to do is we like to understand the sources of data. And these sources may have different shapes. I don't know anything about the underlying physics. So let's just say these are quasars for the moment. That sounds good. These tight bundles, the idea is that they're going to shoot a ton of photons. They'll have high density, but they don't have a ton of spread.","zh":"这里的每一个叉号x都代表我们观察到的一个光子。所以这就是我们所给定的。然后我们喜欢做的事情是理解数据的来源。这些来源可能有不同的形状。我对底层的物理知识一无所知。所以暂且说这些是类星体。这听起来不错。这些紧密的束，想法是它们会发射大量的光子。它们会有高密度，但不会有太多的分散。","start":1860.79,"end":1889.55}],"notes":["本段讨论了K-Means算法的局限性，指出在没有先验知识的情况下，难以验证聚类结果是否合理。讲者提到PCA中存在一种与K-Means相似的检验方法，该方法基于特征值表，用于衡量数据中解释的方差比例。然而，讲者认为这些检验方法在实际应用中并不特别有用。","讲者随后转向介绍混合高斯模型，指出其与K-Means在行为上相似，但使用了贝叶斯规则进行估计。混合高斯模型将数据视为多个高斯分布的混合，而不是简单的聚类。","讲者通过一个玩具示例来说明混合高斯模型的应用，该示例来源于华盛顿大学的研究人员，他们试图区分类星体和恒星。类星体和恒星都会发出光子，但它们的光子分布可能具有不同的形状。","在示例中，每个交叉点代表一个观测到的光子。讲者强调，我们希望理解数据的来源，并且这些来源可能具有不同的分布形状。讲者指出，对于类星体，光子的密度较高，但分布较为集中，没有很大的方差。","讲者提到，虽然混合高斯模型在理论上可以处理更复杂的分布，但在实际应用中，仍需考虑如何选择合适的模型参数和先验分布。","最后，讲者指出，混合高斯模型与K-Means在行为上相似，但使用了更复杂的数学工具，如贝叶斯规则，来估计数据的分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1715.78,"end":1889.55,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":1715.78,"text":"you have may not be as helpful as auxiliary sources of information that could tell you"},{"start":1720.34,"text":"that's a really good fit right you're like oh i know that the clusters should all be"},{"start":1724.54,"text":"tightly i have some spatial knowledge they should all form crescents when i'm done with them that"},{"start":1728.94,"text":"may be an idea that helps you validate the clusters just as well and so i tend to fall"},{"start":1733.66,"text":"in that camp. We'll see next lecture a different thing called PCA. And in PCA, there actually is"},{"start":1739.68,"text":"a test that has a goodness of fit that's almost exactly what you're describing, which says it has"},{"start":1744.32,"text":"to do with the eigenvalue table. It will make sense when we come to it, but then says, this"},{"start":1748.12,"text":"is how much variance I'm explaining underneath the data from the goodness of fit. Here, we just"},{"start":1752.7,"text":"don't really have the structure. That said, there are tests in the literature that are along the"},{"start":1756.78,"text":"lines of what you're saying. I'm just telling you intuitively, I haven't found them to be"},{"start":1759.76,"text":"particularly useful in my own work yeah awesome questions others all right"},{"start":1771.3,"text":"okay"},{"start":1775.18,"text":"yeah yeah so this is just making the point that you all made for me i i i made these points"},{"start": e tight bundles, the idea is that they're going to shoot a ton of photons. They'll have high density, but they don't have a ton of spread."}],"speech_gaps":[],"frame":"../frames/v040/011.webp","frame_time":1727.78},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":206,"text":"There are other objects in the sky that are going to have large spreads, potentially. They're going to have some distortion. They're going to shoot like a disk. And they may have corresponding less intensity. These are the types of objects that we're considering for the moment. Go ahead. What are the axes here? Oh, this is spatial. This is x and y in space. Imagine it's a photon plate. I've taken a picture of some region of the sky, and this is the plate where the photons are hitting me. Yeah, thanks. Sorry for that.","zh":"天空中还有其他物体可能会有较大的分布范围，潜在地。它们可能会有某种扭曲，像一个盘子一样发射出来，并且可能对应的强度较低。这些是我们目前考虑的物体类型。继续，这里的坐标轴是什么？哦，这是空间坐标。这是空间中的x和y。想象一下，这是一块光子板。我拍摄了天空中某个区域的照片，这就是光子撞击我的板子。是的，谢谢。抱歉刚才的混乱。","start":1890.36,"end":1919.42},{"id":207,"text":"Okay, so the point that I wanted to make here is what we're going to do is we're going to assign each photon to a light source, but we're going to have a probability of assigning to source J. So we're going to compare this with the k-means. Instead of saying it's exactly in this cluster, making a hard threshold, remember we were worried about these points that were on the border? We're going to allow ourselves to say 60% in cluster 1, 60% in cluster 2.","zh":"好的，我想在这里强调的是，我们将为每个光子分配一个光源，但我们将有一个概率来分配到源J。我们将这与k-means进行比较。我们不再说它确切地属于这个聚类，而是做一个硬阈值。还记得我们担心那些位于边界上的点吗？我们现在允许自己说60%属于聚类1，60%属于聚类2。","start":1921.16,"end":1943.99},{"id":208,"text":"Here, the terminology instead of cluster I'm going to use is from a source. This idea here is you say like, oh, these are very likely to be from one source. This is very likely one source. This is very likely one source. These characters here, I'm not sure which source they're from. That I can express through this probability vector. So the sources are fixed, but the probabilities are what I have in line. I don't have to do a hard assignment to a cluster. Clear now?","zh":"在这里，我将不再使用聚类这个术语，而是使用源。这个想法是，你可以说，哦，这些很可能来自一个源。这很可能是一个源。这很可能是一个源。这些字符，我不确定它们来自哪个源。我可以借助这个概率向量来表达。因此，源是固定的，但概率是我需要考虑的内容。我不必做一个硬分配到聚类。清楚了吗？","start":1944.41,"end":1969.75},{"id":209,"text":"All right, so that's what this pzi equals j. If you do look on the online notes, there's a pretty nice diagram that I drew. So the takeaway of this is, as I said, hard assignment is what we were doing before, but now we're going to do these probabilistic assignment. And so the probabilistic assignment, as I showed you, is hopefully you remember how the Gaussians look.","zh":"好的，这就是这里的pzi等于j。如果你查看在线笔记，我画了一个相当不错的示意图。因此，要点是，正如我所说，硬分配是我们之前所做的，但现在我们将进行概率分配。因此，概率分配，正如我展示的那样，希望你还记得高斯分布的样子。","start":1974.22,"end":1995.16},{"id":210,"text":"They have this like, you know, kind of shapes, either kind of circles or long ellipses. They're ellipses that we can put and rotate, right? That's how Gaussians look. And that's going to allow us to say from that center, the same as that mean, it's going to allow us to assign how likely every point is. All right. All good. Okay. Okay. All right. All right. So here are the challenges, okay? So what are the challenges? There are many sources that are possible.","zh":"它们有这种形状，你知道，要么是圆形，要么是长椭圆。这些椭圆可以放置并旋转，对吧？这就是高斯分布的样子。这将允许我们从中心，也就是均值，来分配每个点的可能性。好的。没问题。好的。好的。那么这里有几个挑战，对吧？那么这些挑战是什么？有很多可能的来源。","start":1995.84,"end":2030.08},{"id":211,"text":"We're going to assume we know the number of sources k, just as we assumed before. You know that you're going to assume for this run of the algorithm, you know the number of sources. The sources can have different intensity and shapes. You may have some that are shaped like this, some that are shaped like this, all the Gaussian shapes. They're all going to be Gaussian. The shapes are going to be modeled by, remember they're mean, and then their covariance, their sigma. Here's sigma squared, because I'm going to do things in 1D for the next couple slides.","zh":"我们将假设已知来源的数量 k，就像我们之前所做的那样。你知道，在这次算法运行中，你将假设已知来源的数量。这些来源可以有不同的强度和形状。你可能会有一些像这样的形状，一些像这样的形状，所有都是高斯形状。它们都将都是高斯分布。形状将由它们的均值和协方差来建模，这里的协方差是方差，因为接下来的几张幻灯片我将只在1D情况下进行讲解。","start":2031.11,"end":2059.15}],"notes":["本段讲授了K-Means与混合高斯模型之间的区别，强调了概率分配的重要性。在K-Means中，每个点被硬性分配到一个簇，而在混合高斯模型中，每个点被赋予属于某个源的概率，允许存在模糊性。例如，一个点可能有60%的概率属于簇1，60%的概率属于簇2。","讲者提到使用‘源’代替‘簇’，并指出每个点的归属可以通过概率向量来表达。这种概率分配方式避免了硬性分类，使得模型能够处理边界点的问题。","讲者提到混合高斯模型中的高斯分布具有椭圆形的形状，可以旋转和调整，这与高斯分布的均值和协方差有关。这种形状允许模型对每个点的归属概率进行估计。","讲者指出混合高斯模型面临的主要挑战之一是源的数量可能很多，但假设已知源的数量k。此外，每个源可能具有不同的强度和形状，但所有源都被建模为高斯分布。","讲者提到高斯分布的形状由均值和协方差决定，并在接下来的幻灯片中将使用一维情况来展示。这表明模型在处理多维数据时，可以通过调整协方差矩阵来适应不同的形状。","讲者强调了混合高斯模型与K-Means之间的关键区别在于概率分配，而不是硬性分类。这种概率分配方式使得模型能够更灵活地处理数据中的不确定性。"],"formulas":[{"latex":"p(z_i = j)\\text{ 表示第i个点属于第j个源的概率}","symbols":"p(z_i = j) 表示第i个点属于第j个源的概率","explanation":"公式正确，表示第i个点属于第j个源的概率，符合概率论中的条件概率定义。","evidence":"Okay, so the point that I wanted to make here is what we're going to do is we're going to assign each photon to a light source, but we're going to have a probability of assigning to source J. So we're going to compare this with the k-means. Instead of saying it's exactly in this cluster, making a hard threshold, remember we were worried about these points that were on the border? We're going to allow ourselves to say 60% in cluster 1, 60% in cluster 2."}],"uncertainties":["可能听不清的术语或公式，如‘sigma squared’是否指协方差矩阵的方差部分，或是否指协方差矩阵的对角线元素。"],"diagram":"none","start":1890.36,"end":2059.15,"asr_flags":[],"math_clarifications":["公式p(z_i = j)和p(x|z_i = j)在上下文中是合理的，用于描述点与源之间的概率关系。Cov(X)在上下文中未被具体定义，但作为协方差的符号是正确的。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1890.36,"text":"There are other objects in the sky that are going to have large spreads, potentially. They're going to have some distortion. They're going to shoot like a disk. And they may have corresponding less intensity. These are the types of objects that we're considering for the moment. Go ahead. What are the axes here? Oh, this is spatial. This is x and y in space. Imagine it's a photon plate. I've taken a picture of some region of the sky, and this is the plate where the photons are hitting me. Yeah, thanks. Sorry for that."},{"start":1921.16,"text":"Okay, so the point that I wanted to make here is what we're going to do is we're going to assign each photon to a light source, but we're going to have a probability of assigning to source J. So we're going to compare this with the k-means. Instead of saying it's exactly in this cluster, making a hard threshold, remember we were worried about these points that were on the border? We're going to allow ourselves to say 60% in cluster 1, 60% in cluster 2."},{"start":1944.41,"text":"Here, the terminology instead of cluster I'm going to use is from a source. This idea here is you say like, oh, these are very likely to be from one source. This is very likely one source. This is very likely one source. These characters here, I'm not sure which source they're from. That I can express through this probability vector. So the sources are fixed, but the probabilities are what I have in line. I don't have to do a hard assignment to a cluster. Clear now?"},{"start":1974.22,"text":"All right, so that's what this pzi equals j. If you do look on the online notes, there's a pretty nice diagram that I drew. So the takeaway of this is, as I said, hard assignment is what we were doing before, but now we're going to do these probabilistic assignment. And so the probabilistic assignment, as I showed you, is hopefully you remember how the Gaussians look."},{"start":1995.84,"text":"They have this like, you know, kind of shapes, either kind of circles or long ellipses. They're ellipses that we can put and rotate, right? That's how Gaussians look. And that's going to allow us to say from that center, the same as that mean, it's going to allow us to assign how likely every point is. All right. All good. Okay. Okay. All right. All right. So here are the challenges, okay? So what are the challenges? There are many sources that are possible."},{"start":2031.11,"text":"We're going to assume we know the number of sources k, just as we assumed before. You know that you're going to assume for this run of the algorithm, you know the number of sources. The sources can have different intensity and shapes. You may have some that are shaped like this, some that are shaped like this, all the Gaussian shapes. They're all going to be Gaussian. The shapes are going to be modeled by, remember they're mean, and then their covariance, their sigma. Here's sigma squared, because I'm going to do things in 1D for the next couple slides."}],"speech_gaps":[],"frame":"../frames/v040/012.webp","frame_time":1902.36},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":212,"text":"We also do not assume we know the number of points for each source. So it could be that there's one source that puts out a huge number of points, and another source that puts out a very small number of points, and we're going to try and learn that also from the data. Having that information would be nice. If you knew that the pulsars were putting out some number of points, or quasars, that would be really useful. In this application, you don't. So far, so good. Any questions about the assumptions, what they mean?","zh":"我们也不假设已知每个来源的点数。因此，可能存在一个来源产生大量点，而另一个来源仅产生少量点的情况，我们也将尝试从数据中学习这一点。拥有这些信息会很有帮助。如果你知道脉冲星产生了多少个点，或者类星体产生了多少个点，那将非常有用。在本应用中，我们并不知道。到目前为止，一切顺利。有关假设及其含义的任何问题吗？","start":2060.64,"end":2094.09},{"id":213,"text":"We know what the shapes are. So think about mentally, we're putting down shapes. We can rotate them. We can make them different sizes. They have different means and different variances. But we don't assume we know the number of points in every source. Okay, cool. All right. Oh, this one made it through. I was very happy to make it through, I guess. And so here you see the shapes of Gaussian. So remember, you have sphericals, you have diagonals, and you have kind of the full meal deal. Okay, all right.","zh":"我们知道形状是什么样的。想象一下，我们在脑海中放置形状。我们可以旋转它们，可以调整它们的大小，它们有不同的均值和不同的方差。但我们不假设知道每个来源的点数。好的，不错。嗯，这个内容通过了。我非常高兴它能通过，我想。在这里你可以看到高斯分布的形状。请记住，你有球形、对角形，以及更全面的形状。好的，好的。","start":2094.59,"end":2125.43},{"id":214,"text":"Please. We don't know the number of points assigned to each cluster, to each source, but we know the number of sources. What happens in the case where no points get assigned? Wonderful question. Let's come back to that in a minute. The question is,","zh":"请。我们不知道每个聚类、每个来源的点数，但我们知道来源的数量。如果没有任何点被分配，会发生什么？这是一个非常好的问题。我们稍后再回到这个问题。问题是，","start":2125.66,"end":2141.76},{"id":215,"text":"What happens if I pick a number of sources and that number of sources is incorrect? One way it could be incorrect is that I think there are too many sources or there's a source rather that I don't measure, that I think is in my dataset, but I don't measure, I don't assign something to it. When we run through the arithmetic, you're going to see exactly what happens. There's going to be some support that's there that will cause this to be an interesting phenomenon. You'll see how it degrades at that point. But this is a wonderful, exactly the right way to think about this. Other questions? All right.","zh":"如果我选择的来源数量是错误的，会发生什么？一种可能是我认为来源数量过多，或者存在一个我没有测量的来源，我以为它在我的数据集中，但没有测量，也没有分配任何点给它。当我们进行计算时，你将看到具体会发生什么。会有一些支持点导致这种情况变得有趣。你会看到它在那个点如何退化。但这是思考这个问题的绝佳方式，正是正确的思考方式。还有其他问题吗？好的。","start":2142.37,"end":2172.84},{"id":216,"text":"Okay, so let's do a 1D version of the problem so that I can talk to you through one of the technical issues. So here's the model that we have. So this is, remember, there's always a forward model. And we have, in this little setup, I'm going to give myself two means. So imagine there's one mean here, and there's another mean here. Okay, this is mu2, and this is mu1.","zh":"好的，那么让我们做一个一维版本的问题，这样我就可以和你们讨论其中一个技术问题。所以这里是我们所拥有的模型。记住，总是存在一个前向模型。在这个小的设置中，我将给自己两个均值。想象一下，这里有一个均值，另一个均值在这里。好的，这里是mu2，这里是mu1。","start":2174.89,"end":2203.6},{"id":217,"text":"Now, what happens when we sample from these is that we get a bunch of points. Some points here, here, here. And the way that these happen is if you think about it, there's some proportion of how often we're going to sample from each one. So we flip a coin, say that's 60% in one and 40% in two. We flip that coin.","zh":"当我们从这些均值中进行采样时，我们会得到一堆点。一些点在这里，这里，这里。这些点的产生方式是，如果你仔细想想，我们从每个均值中进行采样的频率有一定的比例。比如说，我们抛一枚硬币，假设其中一个是60%，另一个是40%。我们抛这个硬币。","start":2208.91,"end":2228.31}],"notes":["本段讲授了混合高斯模型的基本假设，即我们不知道每个源的点数，但知道源的数量。这与K-Means不同，K-Means假设每个簇的点数已知。讲者提到，如果知道某些天体（如脉冲星或类星体）的点数，将对分析非常有用，但在当前应用中并不知道这些信息。","讲者进一步解释了混合高斯模型中不同形状的分布，包括球形、对角形和全协方差矩阵的分布。这些形状由不同的均值和方差决定，但源的数量是已知的。讲者还提到，如果没有任何点被分配到某个源，这是一个值得探讨的问题。","讲者讨论了在源数量不正确的情况下会发生什么，例如认为源的数量过多或遗漏了某些源。这种情况下，模型的性能可能会下降，但这是理解模型行为的正确方式。","讲者通过一个一维问题来展示技术细节，包括两个均值的设定。他提到，从这些均值中采样会得到一些点，并且这些点的分布取决于从每个源中采样的比例，例如60%和40%。","讲者强调了模型的前向过程，即如何从源中生成数据点。这种过程涉及随机选择源，并根据比例进行采样，从而形成最终的数据分布。","讲者通过具体的例子说明了混合高斯模型的构建过程，包括均值的设定和采样比例的分配。这些例子帮助学生理解模型如何从源中生成数据，并如何处理不同源之间的分布差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2060.64,"end":2228.31,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2060.64,"text":"We also do not assume we know the number of points for each source. So it could be that there's one source that puts out a huge number of points, and another source that puts out a very small number of points, and we're going to try and learn that also from the data. Having that information would be nice. If you knew that the pulsars were putting out some number of points, or quasars, that would be really useful. In this application, you don't. So far, so good. Any questions about the assumptions, what they mean?"},{"start":2094.59,"text":"We know what the shapes are. So think about mentally, we're putting down shapes. We can rotate them. We can make them different sizes. They have different means and different variances. But we don't assume we know the number of points in every source. Okay, cool. All right. Oh, this one made it through. I was very happy to make it through, I guess. And so here you see the shapes of Gaussian. So remember, you have sphericals, you have diagonals, and you have kind of the full meal deal. Okay, all right."},{"start":2125.66,"text":"Please. We don't know the number of points assigned to each cluster, to each source, but we know the number of sources. What happens in the case where no points get assigned? Wonderful question. Let's come back to that in a minute. The question is,"},{"start":2142.37,"text":"What happens if I pick a number of sources and that number of sources is incorrect? One way it could be incorrect is that I think there are too many sources or there's a source rather that I don't measure, that I think is in my dataset, but I don't measure, I don't assign something to it. When we run through the arithmetic, you're going to see exactly what happens. There's going to be some support that's there that will cause this to be an interesting phenomenon. You'll see how it degrades at that point. But this is a wonderful, exactly the right way to think about this. Other questions? All right."},{"start":2174.89,"text":"Okay, so let's do a 1D version of the problem so that I can talk to you through one of the technical issues. So here's the model that we have. So this is, remember, there's always a forward model. And we have, in this little setup, I'm going to give myself two means. So imagine there's one mean here, and there's another mean here. Okay, this is mu2, and this is mu1."},{"start":2208.91,"text":"Now, what happens when we sample from these is that we get a bunch of points. Some points here, here, here. And the way that these happen is if you think about it, there's some proportion of how often we're going to sample from each one. So we flip a coin, say that's 60% in one and 40% in two. We flip that coin."}],"speech_gaps":[],"frame":"../frames/v040/013.webp","frame_time":2072.64},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":218,"text":"We then go to the right mean, and then we sample according to that Gaussian. And so I'm drawing them like they're in order, but they're really not in order. They're just like points that are sampled from each one of these. Now, when we look at these points, you would probably be tempted to say these points here are probably from this source, and these points here are from this source. But we could also have points that are right on the boundary here, where they're kind of unclear.","zh":"然后我们转向右边的均值，并根据该高斯分布进行采样。因此，我画出它们时像是按顺序排列的，但实际上它们并不是按顺序排列的。它们只是从这些分布中采样的点。当我们观察这些点时，你可能会倾向于说这些点可能来自这个来源，而这些点则来自另一个来源。但我们也可能有位于边界上的点，这些点的归属就不太明确了。","start":2228.96,"end":2254.77},{"id":219,"text":"Where did it come from? Now, if we knew the sampling process, we could say this point maybe came from one or two. But all we observe is the bottom line and the points that are on it. We just observe the line, which I would normally love to copy-paste and have a big reveal. We just see this. This is all we're given. We don't get to see any of this stuff, which defines the model. We're going to try and learn that. Now, if we knew the labels,","zh":"这些点是从哪里来的呢？如果我们知道采样过程，我们可以说这个点可能来自一个或两个来源。但我们现在只观察到底线以及位于其上的点。我们通常会很乐意复制粘贴这条线并进行大揭秘，但我们只看到这一点。这就是我们所得到的一切。我们无法看到定义模型的其他内容。我们将尝试学习这些内容。如果我们知道标签，","start":2256.14,"end":2286.3},{"id":220,"text":"This is a really interesting, easy problem. If I told you, oh, this one is blue and blue and blue and blue, and oh, this questionable one, that's also blue. Red, red, red, red, red. Well, this gets you back to your favorite GDA. And so it will turn out, effectively, what we're going to try and do is we're going to try and, as you imagine, guess the labels and then run something which looks just like GDA.","zh":"这是一个非常有趣且简单的问题。如果我告诉你，哦，这个是蓝色，蓝色，蓝色，蓝色，而这个有疑问的点也是蓝色。红色，红色，红色，红色，红色。那么这就会让你回到你最喜欢的高斯判别分析（GDA）。因此，实际上，我们将尝试做的事情是，正如你所想象的那样，猜测标签，然后运行一个看起来像GDA的算法。","start":2287.37,"end":2315.7},{"id":221,"text":"So if you remember GDA, what you would do is you would try to fit to those points. You had two class labels, red and blue. You would try and get the best fit for Gaussians for each of them. That was what we did two weeks back. We'll derive it again. Don't worry if you don't remember it. But the key challenge is we don't have those labels. So just intuitively, how do you think you solve that challenge of not having the labels?","zh":"所以如果你还记得GDA，你所做的就是尝试拟合这些点。你有两个类别标签，红色和蓝色。你试图为每个类别拟合最佳的高斯分布。这就是我们两周前所做的。我们将再次推导它。如果你不记得也没关系。但关键的挑战是我们没有这些标签。因此，直观地，你认为如何解决没有标签的挑战？","start":2317.9,"end":2341.62},{"id":222,"text":"Yeah, so one idea is to randomly assign them.","zh":"是的，一个想法是随机分配它们。","start":2345.58,"end":2347.62},{"id":223,"text":"So we're going to try and maybe first we randomly assign them.","zh":"我们将尝试可能首先随机分配它们。","start":2347.7,"end":2350.0},{"id":224,"text":"Then how do you imagine the iteration would go?","zh":"那么你如何想象迭代过程会进行？","start":2350.08,"end":2351.66},{"id":225,"text":"Okay, that's not that well.","zh":"好吧，这并不是很好。","start":2355.9,"end":2357.44},{"id":226,"text":"It's a great answer.","zh":"这是一个很好的答案。","start":2357.56,"end":2358.64},{"id":227,"text":"Yeah, not that well.","zh":"是的，不是特别好。","start":2358.68,"end":2359.24},{"id":228,"text":"I like that answer.","zh":"我喜欢这个答案。","start":2359.24,"end":2359.86},{"id":229,"text":"Do you assign it to the cluster?","zh":"你把它分配到哪个簇里？","start":2360.56,"end":2362.4},{"id":230,"text":"Yeah, so one example is you have some guess of where these clusters are.","zh":"是的，举个例子，你有一些关于这些簇位置的猜测。","start":2363.2,"end":2367.28},{"id":231,"text":"You first label them as if they're kind of closer in that cluster with some probability.","zh":"你首先将它们标记为在某个簇中，有一定的概率。","start":2367.56,"end":2371.92},{"id":232,"text":"You have some guess of the sampling.","zh":"你有一些关于采样的猜测。","start":2372.1,"end":2373.2},{"id":233,"text":"and then you see now instead of how close they are in space you see how likely they are you","zh":"然后你看到的不是它们在空间中的接近程度，而是它们被分配的可能性。","start":2373.2,"end":2380.24},{"id":234,"text":"update each point right to say is it likely how likely is it to be in each cluster and then you","zh":"更新每个点，说明它属于每个聚类的可能性有多大，然后你","start":2380.24,"end":2386.4},{"id":235,"text":"resolve the means back and forth that's what to keep in your head I'm gonna put some math on but","zh":"在均值之间来回调整，这就是你需要记住的要点。我会加上一些数学内容，但","start":2386.4,"end":2391.1},{"id":236,"text":"that's the intuitions that intuition makes sense we'll see the math if it's not crystal clear what","zh":"这就是直觉，这种直觉是有道理的。我们将会看到数学内容，如果它不是非常清晰，你","start":2391.1,"end":2395.06},{"id":237,"text":"to do but at least the template should look a lot like k-means please what's the same shared","zh":"至少应该知道它和 K-Means 的结构很相似。请告诉我，这里我们有什么相同的共享","start":2395.06,"end":2401.92},{"id":238,"text":"variance that we have gda here oh wonderful point so yeah so you don't need to have the same shared","zh":"方差？哦，非常好的问题。是的，你不需要有相同的共享","start":2401.92,"end":2407.26}],"notes":["本段讲解了在没有标签的情况下，如何通过随机分配和迭代更新来解决聚类问题。讲者提到，可以像K-Means一样，先随机分配点到簇，然后根据每个点属于各个簇的概率进行更新，最终调整簇中心。这种思路与高斯判别分析（GDA）类似，但不需要显式标签。","讲者强调，虽然没有标签，但可以通过概率模型来估计每个点属于各个簇的可能性，从而迭代优化簇中心。这种思想与K-Means相似，但更灵活，因为允许不同簇有不同的协方差结构。","讲者提到，如果已知标签，问题就变得简单，可以像GDA那样直接拟合高斯分布。但实际情况下，标签是未知的，因此需要通过迭代方法进行估计。","讲者指出，一种可能的解决方法是随机分配标签，然后根据点与簇中心的距离或概率进行更新。这种迭代过程类似于K-Means，但更复杂，因为它考虑了概率和不确定性。","讲者提到，虽然没有标签，但可以通过概率模型来估计每个点属于各个簇的可能性，从而调整簇中心。这种思想是混合高斯模型的核心，即每个点属于某个簇的概率是未知的，需要通过迭代优化。","讲者最后提到，混合高斯模型与K-Means有相似之处，但更复杂，因为它允许不同簇有不同的协方差结构。这种模型在没有标签的情况下，可以通过迭代优化来估计参数。"],"formulas":[],"uncertainties":["and then you see now instead of how close they are in space you see how likely they are you","update each point right to say is it likely how likely is it to be in each cluster and then you","resolve the means back and forth that's what to keep in your head I'm gonna put some math on but","that's the intuitions that intuition makes sense we'll see the math if it's not crystal clear what","to do but at least the template should look a lot like k-means please what's the same shared","variance that we have gda here oh wonderful point so yeah so you don't need to have the same shared"],"diagram":"none","start":2228.96,"end":2407.26,"asr_flags":[220],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":2228.96,"text":"We then go to the right mean, and then we sample according to that Gaussian. And so I'm drawing them like they're in order, but they're really not in order. They're just like points that are sampled from each one of these. Now, when we look at these points, you would probably be tempted to say these points here are probably from this source, and these points here are from this source. But we could also have points that are right on the boundary here, where they're kind of unclear."},{"start":2256.14,"text":"Where did it come from? Now, if we knew the sampling process, we could say this point maybe came from one or two. But all we observe is the bottom line and the points that are on it. We just observe the line, which I would normally love to copy-paste and have a big reveal. We just see this. This is all we're given. We don't get to see any of this stuff, which defines the model. We're going to try and learn that. Now, if we knew the labels,"},{"start":2287.37,"text":"This is a really interesting, easy problem. If I told you, oh, this one is blue and blue and blue and blue, and oh, this questionable one, that's also blue. Red, red, red, red, red. Well, this gets you back to your favorite GDA. And so it will turn out, effectively, what we're going to try and do is we're going to try and, as you imagine, guess the labels and then run something which looks just like GDA."},{"start":2317.9,"text":"So if you remember GDA, what you would do is you would try to fit to those points. You had two class labels, red and blue. You would try and get the best fit for Gaussians for each of them. That was what we did two weeks back. We'll derive it again. Don't worry if you don't remember it. But the key challenge is we don't have those labels. So just intuitively, how do you think you solve that challenge of not having the labels?"},{"start":2345.58,"text":"Yeah, so one idea is to randomly assign them."},{"start":2347.7,"text":"So we're going to try and maybe first we randomly assign them."},{"start":2350.08,"text":"Then how do you imagine the iteration would go?"},{"start":2355.9,"text":"Okay, that's not that well."},{"start":2357.56,"text":"It's a great answer."},{"start":2358.68,"text":"Yeah, not that well."},{"start":2359.24,"text":"I like that answer."},{"start":2360.56,"text":"Do you assign it to the cluster?"},{"start":2363.2,"text":"Yeah, so one example is you have some guess of where these clusters are."},{"start":2367.56,"text":"You first label them as if they're kind of closer in that cluster with some probability."},{"start":2372.1,"text":"You have some guess of the sampling."},{"start":2373.2,"text":"and then you see now instead of how close they are in space you see how likely they are you"},{"start":2380.24,"text":"update each point right to say is it likely how likely is it to be in each cluster and then you"},{"start":2386.4,"text":"resolve the means back and forth that's what to keep in your head I'm gonna put some math on but"},{"start":2391.1,"text":"that's the intuitions that intuition makes sense we'll see the math if it's not crystal clear what"},{"start":2395.06,"text":"to do but at least the template should look a lot like k-means please what's the same shared"},{"start":2401.92,"text":"variance that we have gda here oh wonderful point so yeah so you don't need to have the same shared"}],"speech_gaps":[],"frame":"../frames/v040/014.webp","frame_time":2240.96},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":239,"text":"variance that you had in GDA here the shapes are going to be different across all of them and we","zh":"这里的方差会导致每个簇的形状都不同，我们","start":2407.26,"end":2412.02},{"id":240,"text":"talked about you know that that as well last time so you can solve that the GDA was meant more as an","zh":"之前也讨论过这一点，所以你可以解决这个问题，GDA更多的是作为一个类比，我们将会在不依赖GDA的情况下解决这个问题，我只是想让你注意","start":2412.02,"end":2415.96},{"id":241,"text":"analog we're going to solve this without having to know GDA I just want to highlight for you the","zh":"新内容的部分。新内容的部分是没有簇标签。你实际上在之前的某次讲座中已经有效地看到了这个算法的每一个部分。这个变化就是这一点。","start":2415.96,"end":2420.34},{"id":242,"text":"piece that's new. And the piece that's new is no cluster labels. You've actually seen every piece","zh":"我们将从头推导整个过程。你不需要建立那种联系，但","start":2420.34,"end":2425.36},{"id":243,"text":"of this algorithm effectively in some previous lecture. This is the twist, just this piece.","zh":"只是为了让你区分什么是新的，什么是已有的。好的，让我们更正式一点。","start":2425.36,"end":2429.6},{"id":244,"text":"We'll derive it all from scratch. You don't have to make that association, but just","zh":"在这里，我们将在一维版本中这样做。我们被给出x1到xn，这些数据点位于R","start":2431.18,"end":2434.54},{"id":245,"text":"so you're trying to isolate what's new and what's not. All right, let's be a little bit more formal.","zh":"中。","start":2434.54,"end":2440.22},{"id":246,"text":"So here's how we're going to do it in this 1D version. We're given x1 to xn that are in R","zh":"那么我们将在这一维版本中这样做。我们给出的x1到xn位于R中","start":2441.58,"end":2447.54},{"id":247,"text":"and a positive integer k. This is what we're given as input to the problem.","zh":"以及一个正整数 k。这是我们作为问题输入所给定的内容。","start":2448.6,"end":2451.88},{"id":248,"text":"Our job is to find this function p, that for each data point i, 1 to n,","zh":"我们的任务是找到这个函数 p，对于每个数据点 i，从 1 到 n，","start":2453.1,"end":2457.54},{"id":249,"text":"and each source j from 1 to k, we find a soft assignment of the following form.","zh":"以及每个源 j 从 1 到 k，我们找到如下形式的软分配。","start":2457.66,"end":2462.26},{"id":250,"text":"So rather than doing the hard assignment, we say the probability that xi comes from source j","zh":"因此，我们不进行硬分配，而是说数据点 xi 来自源 j 的概率","start":2462.78,"end":2467.32},{"id":251,"text":"is exactly this. This is just a table of numbers. For every point, imagine there's a k vector","zh":"就是这个值。这只是一个数字表。对于每个点，想象有一个 k 维向量","start":2467.32,"end":2472.52},{"id":252,"text":"that says exactly where they come from. That's the way to think about it.","zh":"说明它们来自哪里。这就是这样思考的方式。","start":2472.52,"end":2476.76},{"id":253,"text":"Now this probability, if it were just wild, it's not really clear how to assign anything. So we","zh":"现在，如果这个概率只是随意的，那么如何分配任何东西都不清楚。因此，","start":2479.02,"end":2486.0},{"id":254,"text":"need a model, a forward model. And I showed you that forward model on the last slide. Now I'm","zh":"我们需要一个模型，一个前向模型。我在上一张幻灯片中向你们展示了这个前向模型。现在我","start":2486.0,"end":2489.86},{"id":255,"text":"going to write it mathematically. Intuitively, it should pick which cluster it's from with some","zh":"我将把它用数学方式写出来。直观上，它应该以某种概率选择它所属的簇，然后从该簇的概率分布中进行采样。","start":2489.86,"end":2494.74},{"id":256,"text":"probability, and then it should sample from that cluster probability. So let's write that down and","zh":"因此，让我们把它写下来，并","start":2494.74,"end":2499.26},{"id":257,"text":"and see exactly how that works.","zh":"看看它是如何具体工作的。","start":2499.26,"end":2500.36},{"id":258,"text":"There it is.","zh":"就是这样。","start":2502.12,"end":2502.84},{"id":259,"text":"It says the probability of x and zi","zh":"它表示 x 和 zi 的概率","start":2503.66,"end":2505.84},{"id":260,"text":"is going to factor by Bayes' rule.","zh":"将通过贝叶斯规则进行分解。","start":2505.84,"end":2507.28},{"id":261,"text":"That's not a controversial statement.","zh":"这不是一个有争议的陈述。","start":2507.76,"end":2509.84},{"id":262,"text":"The zis are basically going to be selected","zh":"这些 zi 基本上会被选择","start":2510.86,"end":2515.02},{"id":263,"text":"as a mixture of sources.","zh":"作为一种来源的混合。","start":2515.02,"end":2516.22},{"id":264,"text":"So what it's going to say is it's multinomial.","zh":"所以它会说这是多项分布。","start":2517.34,"end":2519.54},{"id":265,"text":"This is where we don't know the probability.","zh":"这里我们不知道概率。","start":2519.72,"end":2521.48},{"id":266,"text":"But imagine you had a fixed probability.","zh":"但想象你有一个固定的概率。","start":2521.76,"end":2522.96},{"id":267,"text":"So you say it's 60% here, 40% there.","zh":"你说这里是60%，那里是40%。","start":2523.24,"end":2525.1},{"id":268,"text":"You're going to pick 60% cluster 1, 40% cluster 2.","zh":"你会选择60%属于簇1，40%属于簇2。","start":2525.3,"end":2528.62},{"id":269,"text":"You flip a coin with that bias. That gives you a cluster that you're looking at.","zh":"你用这个偏差抛硬币。这会给你一个你正在观察的簇。","start":2528.62,"end":2533.08},{"id":270,"text":"And then, as was highlighted earlier, which was wonderful,","zh":"正如之前强调的，这一点非常棒，","start":2533.6,"end":2536.14},{"id":271,"text":"given that you know which cluster you're in, you're in cluster J,","zh":"已知你处于哪一个聚类中，你处于聚类 J 中，","start":2536.64,"end":2538.96},{"id":272,"text":"you have a different mean and a different variance that you look up in your table","zh":"你有一个不同的均值和一个不同的方差，这些值你可以在你的表格中查找","start":2539.4,"end":2543.78},{"id":273,"text":"and you produce Xi. And so I'm sorry if the colors are hard for you.","zh":"然后你生成 Xi。因此，如果颜色对你来说很难分辨，我表示抱歉。","start":2544.48,"end":2547.58},{"id":274,"text":"But these things that are in blue, that are highlighted here,","zh":"但这里用蓝色突出显示的这些内容，","start":2547.76,"end":2550.52},{"id":275,"text":"that are just a little bit different, those are the parameters that we're trying to estimate.","zh":"只是略微不同，这些就是我们试图估计的参数。","start":2550.6,"end":2553.84},{"id":276,"text":"So we call Zi the hidden or latent variable. These latent variable models are quite common. They're more sophisticated. We'll see more of them. It's where we assume there's some structure. It's latent or hidden because we don't observe it. We don't get to directly measure this. But we hypothesize that it's there, even though it's not directly observed, and it defines this. So if we knew which cluster it is, then it would tell us the mean and the variance. But of course, this is also a random sample.","zh":"因此，我们将 Zi 称为隐藏变量或潜在变量。这些潜在变量模型非常常见。它们更为复杂。我们之后还会看到更多相关内容。这是假设存在某种结构的地方。它是潜在的或隐藏的，因为我们没有观测到它。我们无法直接测量这一点。但我们假设它存在，即使它没有被直接观测到，它也定义了这些内容。因此，如果我们知道它属于哪一个聚类，那么它就会告诉我们均值和方差。当然，这也是一个随机样本。","start":2558.61,"end":2586.43}],"notes":["本段介绍了混合高斯模型（GMM）的基本概念，强调其与K-Means的不同之处在于使用软分配而非硬分配。讲者指出，GMM的模型结构包括隐变量（Zi），这些变量决定了数据点属于哪个簇，并且每个簇有其对应的均值和方差。"],"formulas":[{"latex":"p(x, z_i) = p(z_i) p(x | z_i)","symbols":"p(x, z_i) 表示数据点 x 和隐变量 z_i 的联合概率分布，p(z_i) 是隐变量的先验概率，p(x | z_i) 是给定隐变量 z_i 下数据点 x 的条件概率。","explanation":"公式正确，符合贝叶斯规则，联合概率分解为先验和条件概率的乘积。","evidence":"is going to factor by Bayes' rule. That's not a controversial statement. The zis are basically going to be selected as a mixture of sources. So what it's going to say is it's multinomial. This is where we don't know the probability. But imagine you had a fixed probability. So you say it's 60% here, 40% there. You're going to pick 60% cluster 1, 40% cluster 2. You flip a coin with that bias. That gives you a cluster that you're looking at. And then, as was highlighted earlier, which was wonderful, given that you know which cluster you're in, you're in cluster J, you have a different mean and a different variance that you look up in your table and you produce Xi. And so I'm sorry if the colors are hard for you. But these things that are in blue, that are highlighted here, that are just a little bit different, those are the parameters that we're trying to estimate. So we call Zi the hidden or latent variable. These latent variable models are quite common. They're more sophisticated. We'll see more of them. It's where we assume there's some structure. It's latent or hidden because we don't observe it. We don't get to directly measure this. But we hypothesize that it's there, even though it's not directly observed, and it defines this. So if we knew which cluster it is, then it would tell us the mean and the variance. But of course, this is also a random sample."}],"uncertainties":[],"diagram":"none","start":2407.26,"end":2586.43,"asr_flags":[],"math_clarifications":["公式正确，符合贝叶斯规则，联合概率分解为先验和条件概率的乘积。"],"boards":[],"translation_complete":true,"translated_segments":38,"raw_segments":[{"start":2407.26,"text":"variance that you had in gda here the shapes are going to be different across all of them and we"},{"start":2412.02,"text":"talked about you know that that as well last time so you can solve that the gda was meant more as an"},{"start":2415.96,"text":"analog we're going to solve this without having to know gda i just want to highlight for you the"},{"start":2420.34,"text":"piece that's new. And the piece that's new is no cluster labels. You've actually seen every piece"},{"start":2425.36,"text":"of this algorithm effectively in some previous lecture. This is the twist, just this piece."},{"start":2431.18,"text":"We'll derive it all from scratch. You don't have to make that association, but just"},{"start":2434.54,"text":"so you're trying to isolate what's new and what's not. All right, let's be a little bit more formal."},{"start":2441.58,"text":"So here's how we're going to do it in this 1D version. We're given x1 to xn that are in R"},{"start":2448.6,"text":"and a positive integer k. This is what we're given as input to the problem."},{"start":2453.1,"text":"Our job is to find this function p, that for each data point i, 1 to n,"},{"start":2457.66,"text":"and each source j from 1 to k, we find a soft assignment of the following form."},{"start":2462.78,"text":"So rather than doing the hard assignment, we say the probability that xi comes from source j"},{"start":2467.32,"text":"is exactly this. This is just a table of numbers. For every point, imagine there's a k vector"},{"start":2472.52,"text":"that says exactly where they come from. That's the way to think about it."},{"start":2479.02,"text":"Now this probability, if it were just wild, it's not really clear how to assign anything. So we"},{"start":2486.0,"text":"need a model, a forward model. And I showed you that forward model on the last slide. Now I'm"},{"start":2489.86,"text":"going to write it mathematically. Intuitively, it should pick which cluster it's from with some"},{"start":2494.74,"text":"probability, and then it should sample from that cluster probability. So let's write that down and"},{"start":2499.26,"text":"and see exactly how that works."},{"start":2502.12,"text":"There it is."},{"start":2503.66,"text":"It says the probability of x and zi"},{"start":2505.84,"text":"is going to factor by Bayes' rule."},{"start":2507.76,"text":"That's not a controversial statement."},{"start":2510.86,"text":"The zis are basically going to be selected"},{"start":2515.02,"text":"as a mixture of sources."},{"start":2517.34,"text":"So what it's going to say is it's multinomial."},{"start":2519.72,"text":"This is where we don't know the probability."},{"start":2521.76,"text":"But imagine you had a fixed probability."},{"start":2523.24,"text":"So you say it's 60% here, 40% there."},{"start":2525.3,"text":"You're going to pick 60% cluster 1, 40% cluster 2."},{"start":2528.62,"text":"You flip a coin with that bias. That gives you a cluster that you're looking at."},{"start":2533.6,"text":"And then, as was highlighted earlier, which was wonderful,"},{"start":2536.64,"text":"given that you know which cluster you're in, you're in cluster J,"},{"start":2539.4,"text":"you have a different mean and a different variance that you look up in your table"},{"start":2544.48,"text":"and you produce Xi. And so I'm sorry if the colors are hard for you."},{"start":2547.76,"text":"But these things that are in blue, that are highlighted here,"},{"start":2550.6,"text":"that are just a little bit different, those are the parameters that we're trying to estimate."},{"start":2558.61,"text":"So we call Zi the hidden or latent variable. These latent variable models are quite common. They're more sophisticated. We'll see more of them. It's where we assume there's some structure. It's latent or hidden because we don't observe it. We don't get to directly measure this. But we hypothesize that it's there, even though it's not directly observed, and it defines this. So if we knew which cluster it is, then it would tell us the mean and the variance. But of course, this is also a random sample."}],"speech_gaps":[],"frame":"../frames/v040/015.webp","frame_time":2419.26},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":277,"text":"which is somewhere in the space. Is it clear how the forward model works? Please. Yeah, great question. So how should I think about how phi, this multinomial, actually changes?","zh":"它位于空间中的某个位置。大家清楚前向模型是如何工作的吗？请。是的，非常好的问题。那么我应该如何思考这个phi，这个多项式分布，实际上是如何变化的呢？","start":2586.79,"end":2604.61},{"id":278,"text":"If you knew phi, that would correspond to knowing, let's say you have a phi that says 90 and 10, 90% in cluster one, 10% in cluster two. Then once you did that, you wouldn't need to do this kind of sample if you like at all. You'd be trying to learn this 90-10 weighted by this. We'll see where that comes out in the math. Here, we're actually going to be able to learn phi as well. So it's not really a prior. A prior would be if I told you the 90-10, but we're actually going to learn it. So it's not a prior. It's actually something we're going to estimate from the data.","zh":"如果你知道phi，这就相当于知道，比如说你有一个phi，它表示90和10，即90%在第一个聚类中，10%在第二个聚类中。一旦你这样做，你就完全不需要进行这种采样了。你会试图学习这个90-10的加权分布。我们会在数学中看到这一点。在这里，我们实际上能够学习phi。因此，它并不是一个先验分布。如果我告诉你这个90-10的分布，那才是一个先验分布，但我们实际上是要从数据中学习它。因此，它并不是一个先验分布，而是我们要从数据中估计的东西。","start":2605.18,"end":2636.13},{"id":279,"text":"It's a totally reasonable thing to put in, little bits. Fantastic. OK. So we went through this. I'll just draw it out one more time just because I think it's illustrative and to stall a little bit for questions. So we had our mu. Oops, that's a terrible looking Gaussian, but you'll excuse it because you're very kind people. So how does it work? Again, back to it. I select zi with some probability. I guess I picked 0.7 and 0.3 here.","zh":"把它放入模型中是一个完全合理的事情，一点点地进行。太棒了。好的，我们已经讨论过这个。我再画一次，因为我觉得这有助于理解，也可以稍微停顿一下，以便大家提问。我们有我们的mu。哦，这个高斯分布看起来很糟糕，但请原谅，因为你们是非常善良的人。那么它是如何工作的呢？再次回到这个话题。我以某种概率选择zi。我这里猜测是0.7和0.3。","start":2636.8,"end":2674.66},{"id":280,"text":"I call that zi for this point that I'm generating. Let's say that I picked this particular cluster, then I sample from this unit normal, and I are this normal distribution, and I get this point. That's the forward generating process, and I do that for every single point. That's how I generate all xn points. Pick this way or this way, then sample. Clear enough how it works? Okay, cool.","zh":"我称这个zi为我生成的这个点。比如说，我选择了这个特定的聚类，然后从这个单位正态分布中进行采样，得到这个点。这就是前向生成过程，我会对每一个点都这样做。这就是我生成所有xn点的方式。选择这种方式或那种方式，然后进行采样。清楚它是如何工作的吗？好的，很好。","start":2675.36,"end":2699.26},{"id":281,"text":"All right, so just to recap this to make sure it's super clear, given a set of parameters, we're going to assess how likely X1 and Xn are according to the GMM model. From that description I told you, one of the things is I can now write the probability of those points under various different parameters. So you give me two sets of parameters, I can score how likely the data are.","zh":"好的，为了确保它非常清楚，给定一组参数，我们将评估X1和Xn在GMM模型下的可能性。根据我刚才的描述，我可以现在写出这些点在不同参数下的概率。因此，你给我两组参数，我可以评分数据的可能性有多大。","start":2704.55,"end":2725.96},{"id":282,"text":"and conceptually also get the likelihood function. That's what we were after before.","zh":"从概念上也可以得到似然函数。这就是我们之前所追求的。","start":2726.64,"end":2730.56},{"id":283,"text":"Once we have a likelihood function, we kind of get back into the same framework.","zh":"一旦我们有了似然函数，我们就会回到相同的框架中。","start":2730.72,"end":2734.1},{"id":284,"text":"So the likelihood model, the GMM, is enough for us to estimate those parameters directly","zh":"因此，似然模型，即高斯混合模型（GMM），足以让我们直接从观测数据中估计这些参数","start":2735.22,"end":2739.32},{"id":285,"text":"from the observed data. That's what we're going to try and figure out how to do.","zh":"从观测数据中估计这些参数。这就是我们接下来要尝试弄清楚如何做到的事情。","start":2739.32,"end":2742.94},{"id":286,"text":"The twist here is that Zi is our first example of a latent model. We do not","zh":"这里的转折点在于，Zi是我们第一个例子中的隐变量模型。我们并不","start":2743.58,"end":2747.74},{"id":287,"text":"observe the value of Zi, but we know something about it. This is equivalent,","zh":"观察Zi的值，但我们知道一些关于它的信息。这在道德上等价于","start":2747.74,"end":2751.76},{"id":288,"text":"really morally to there exist k clusters. That zi, although we don't","zh":"存在k个聚类。虽然我们不观察Zi，但它表示存在这些k个来源，然后我们从每个来源中进行采样。","start":2751.76,"end":2756.26},{"id":289,"text":"observe it, says there exist these k sources and then we're going to sample","zh":"清楚它是如何运作的吗？让我们来看一个算法。它就是","start":2756.26,"end":2759.62},{"id":290,"text":"from each of them. Clear enough how it works? Let's see an algorithm. It's","zh":"从它们之中。清楚它是如何运作的吗？让我们看看一个算法。它","start":2759.62,"end":2766.04}],"notes":["本段讲解了混合高斯模型（GMM）中的隐变量（Zi）概念，指出Zi是未观测的，但代表了数据点属于不同聚类的概率。讲者强调，Zi的存在意味着数据点来源于多个潜在的分布，而这些分布的参数（如均值和方差）需要从数据中估计。","讲者通过一个具体的例子说明了如何从参数生成数据点的过程：首先根据Zi的概率选择聚类，然后从对应的高斯分布中采样得到数据点。这一过程是生成模型的核心，用于理解数据是如何从潜在分布中产生的。","讲者提到，GMM模型允许我们直接从观测数据中估计参数，而不需要像贝叶斯方法那样引入先验分布。这与传统的EM算法不同，因为这里没有显式的先验假设，而是通过最大化似然函数来估计参数。","讲者指出，Zi作为隐变量，是第一个例子，说明了隐变量模型的基本思想。隐变量的存在使得模型能够捕捉数据中的潜在结构，例如多个聚类或分布源。","讲者强调，GMM模型的似然函数是估计参数的基础，通过最大化似然函数可以找到最可能的参数值。这一过程与传统的参数估计方法类似，但需要处理隐变量带来的复杂性。","讲者最后提到，接下来将介绍一个算法，用于估计GMM模型的参数。这表明课程将进入实际的算法实现部分，可能涉及优化方法或迭代过程。"],"formulas":[],"uncertainties":["I are this normal distribution"],"diagram":"none","start":2586.79,"end":2766.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":2586.79,"text":"which is somewhere in the space. Is it clear how the forward model works? Please. Yeah, great question. So how should I think about how phi, this multinomial, actually changes?"},{"start":2605.18,"text":"If you knew phi, that would correspond to knowing, let's say you have a phi that says 90 and 10, 90% in cluster one, 10% in cluster two. Then once you did that, you wouldn't need to do this kind of sample if you like at all. You'd be trying to learn this 90-10 weighted by this. We'll see where that comes out in the math. Here, we're actually going to be able to learn phi as well. So it's not really a prior. A prior would be if I told you the 90-10, but we're actually going to learn it. So it's not a prior. It's actually something we're going to estimate from the data. Other questions?"},{"start":2636.8,"text":"It's a totally reasonable thing to put in, little bits. Fantastic. OK. So we went through this. I'll just draw it out one more time just because I think it's illustrative and to stall a little bit for questions. So we had our mu. Oops, that's a terrible looking Gaussian, but you'll excuse it because you're very kind people. So how does it work? Again, back to it. I select zi with some probability. I guess I picked 0.7 and 0.3 here."},{"start":2675.36,"text":"I call that zi for this point that I'm generating. Let's say that I picked this particular cluster, then I sample from this unit normal, and I are this normal distribution, and I get this point. That's the forward generating process, and I do that for every single point. That's how I generate all xn points. Pick this way or this way, then sample. Clear enough how it works? Okay, cool."},{"start":2704.55,"text":"All right, so just to recap this to make sure it's super clear, given a set of parameters, we're going to assess how likely X1 and Xn are according to the GMM model. From that description I told you, one of the things is I can now write the probability of those points under various different parameters. So you give me two sets of parameters, I can score how likely the data are."},{"start":2726.64,"text":"and conceptually also get the likelihood function. That's what we were after before."},{"start":2730.72,"text":"Once we have a likelihood function, we kind of get back into the same framework."},{"start":2735.22,"text":"So the likelihood model, the GMM, is enough for us to estimate those parameters directly"},{"start":2739.32,"text":"from the observed data. That's what we're going to try and figure out how to do."},{"start":2743.58,"text":"The twist here is that Zi is our first example of a latent model. We do not"},{"start":2747.74,"text":"observe the value of Zi, but we know something about it. This is equivalent,"},{"start":2751.76,"text":"really morally to there exist k clusters. That zi, although we don't"},{"start":2756.26,"text":"observe it, says there exist these k sources and then we're going to sample"},{"start":2759.62,"text":"from each of them. Clear enough how it works? Let's see an algorithm. It's"}],"speech_gaps":[],"frame":"../frames/v040/016.webp","frame_time":2598.79},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":291,"text":"going to look like k-means but it's going to have a lot more math and then","zh":"看起来会像K-Means，但它会包含更多的数学内容，然后","start":2766.04,"end":2768.78},{"id":292,"text":"in later lectures, maybe like Wednesday, I'm going to show you how it's actually","zh":"在后面的课程中，比如星期三，我会向你们展示它实际上","start":2768.78,"end":2773.22},{"id":293,"text":"an MLE algorithm in disguise. So it is actually an instance of your old","zh":"是一种最大似然估计（MLE）算法的伪装。因此，它实际上是你们旧","start":2773.22,"end":2776.52},{"id":294,"text":"framework.","zh":"框架的一个实例。","start":2776.52,"end":2776.84},{"id":295,"text":"Wonderful question. All right, so let's go back. So the question is, how does this change? I think","zh":"非常好的问题。好的，那么我们回到原来的话题。问题是，这会如何改变？我想","start":2789.66,"end":2793.76},{"id":296,"text":"you're asking, how does this change the estimation procedure? Let me get back, see if I have a","zh":"你在问，这会如何改变估计过程？让我回到原来的内容，看看我有没有一张","start":2793.76,"end":2798.08},{"id":297,"text":"drawing. Sorry, I have to scroll so far back. All right, actually I'll just use this picture. All","zh":"图表。抱歉，我需要滚动回去这么远。好的，实际上我将直接使用这张图片。所有","start":2798.08,"end":2802.92},{"id":298,"text":"All right. Give me one more second to look. If I can't find it, I will just draw it again.","zh":"好的。给我再一秒钟时间看一下。如果找不到，我将重新画一张。","start":2802.92,"end":2809.86},{"id":299,"text":"Okay. Here it is. This character. Okay. Let's go back and see how the phi might intuitively","zh":"好的。这里它就是。这个字符。好的。让我们回到原来的地方，看看phi如何直观地扩展我们的推理。","start":2810.38,"end":2815.76},{"id":300,"text":"expand our reasoning. And then when we do the math, I want you to check that this actually","zh":"然后当我们进行数学推导时，我希望你们检查一下这实际上是否有效。我不会欺骗你们。所以让我们想象你有mu1和mu2，还有这个点。","start":2815.76,"end":2819.42},{"id":301,"text":"works. I'm not lying to you. So let's imagine you have mu1 and mu2, and you have this one.","zh":"有效。我没有骗你们。那么，假设你有 mu1 和 mu2，还有这个。","start":2819.42,"end":2824.16},{"id":302,"text":"And let's imagine I picked it exactly where the points cross. Then it seems like a coin flip.","zh":"这个点应该分配到聚类二还是聚类一？","start":2824.28,"end":2829.16},{"id":303,"text":"Should this point go to cluster two or should it go to cluster one?","zh":"如果你知道聚类二生成的数据是聚类一的100倍多，你会更倾向于认为这个点来自聚类二还是聚类一？聚类二，对吧？因为你会想，哦，实际上，聚类二正在产生点。在其他条件相同的情况下，这相对罕见。你刚刚做的这个推理就是贝叶斯规则。","start":2829.16,"end":2833.26},{"id":304,"text":"If you knew cluster 2 generated 100 times more data than cluster 1, would you be more likely to say this came from cluster 2 or cluster 1? Cluster 2, right? Because you would say, oh, actually, cluster 2 is spitting off points. It's relatively rare, all things being equal. That inference you just did is Bayes' rule. And we're going to come to that exactly when we do this, that the phi is allowing us to do exactly that, to tell us that the observed counts are there. Please.","zh":"如果你知道聚类 2 生成的数据是聚类 1 的 100 倍，你会更倾向于认为这个数据来自聚类 2 还是聚类 1？聚类 2，对吧？因为你会想，哦，实际上，聚类 2 正在产生数据点。在其他条件相同的情况下，这相对罕见。你刚才做的这个推断就是贝叶斯规则。我们会在之后讨论这个，当我们将 phi 引入时，它正是允许我们做到这一点，告诉我们观察到的计数存在。请。","start":2835.48,"end":2860.9},{"id":305,"text":"In this example, it only has to be a scalar because there are two, and it's determined. The last component is determined. If you have m outcomes, you only have to have m minus 1 because they sum. But in general, yes, it would be a vector, a multinomial vector. Yeah, great points. Please. Can you do the slide 27? Probably not. Yes, I'll do my best. Sure. I think this is 27. Is this 27?","zh":"在这个例子中，它只需要是一个标量，因为有两个，而且它是确定的。最后一个分量是确定的。如果你有m个结果，你只需要有m减1个，因为它们相加。但一般来说，是的，它会是一个向量，一个多项式向量。是的，很好的问题。请。你能做幻灯片27吗？可能不能。是的，我会尽我所能。当然。我想这是27。这是27吗？","start":2861.26,"end":2889.64},{"id":306,"text":"Yeah.","zh":"是的。","start":2890.4,"end":2890.7},{"id":307,"text":"Good.","zh":"好的。","start":2890.82,"end":2891.22},{"id":308,"text":"I was just wondering, so if you get the joint probability","zh":"我只是想确认一下，如果你得到 xi 和 zi 的联合概率","start":2891.38,"end":2894.04},{"id":309,"text":"of xi and zi, and you just take one specific xi,","zh":"并且你只取一个特定的 xi，","start":2894.04,"end":2898.02},{"id":310,"text":"sum over all the possible classes,","zh":"对所有可能的类别求和，","start":2899.48,"end":2901.66},{"id":311,"text":"would that add up to equal one ?","zh":"那这个总和会等于一吗？","start":2903.0,"end":2905.74},{"id":312,"text":"It is a probability, yes.","zh":"是的，这是一个概率。","start":2906.58,"end":2907.9},{"id":313,"text":"So let's come to that in just one minute","zh":"我们稍后来看这一点，","start":2909.0,"end":2910.8},{"id":314,"text":"to see actually how these are operating on them.","zh":"以实际了解它们是如何作用于这些变量的。","start":2910.8,"end":2913.86},{"id":315,"text":"them. All this is saying is the probability distribution for xi, how","zh":"它们。所有这些都是在说，xi的概率分布，即xi的可能性如何","start":2913.86,"end":2921.52},{"id":316,"text":"likely xi is, is factors as, which this is a tautology, says if you tell me what","zh":"是怎样的，这其实是一个同义反复，意思是如果你告诉我属于哪个聚类，并且你有一个聚类的分布，那么你会根据这个分布进行加权","start":2921.52,"end":2926.54},{"id":317,"text":"the cluster is and you have a distribution over clusters, you weight","zh":"，然后在该聚类条件下进行计算。也就是说，如果你处于这个聚类中，这就是我赋予你的似然","start":2926.54,"end":2929.3},{"id":318,"text":"that, condition on that says if you're in this cluster, this is the likelihood I","zh":"。对所有xi可能性的积分等于1，因为这是条件概率，这就是加权的方式。","start":2929.3,"end":2932.8},{"id":319,"text":"assign to you. That integration over all the possibilities of xi is one because","zh":"我理解这一点，但比如说，Zi的概率","start":2932.8,"end":2936.36},{"id":320,"text":"because it's a conditional probability, and that's the weighting.","zh":"，是怎样的呢？","start":2936.36,"end":2938.7},{"id":321,"text":"I understand that, but is the probability of ZI, let's say,","zh":"我理解这一点，但比如说，Zi的概率","start":2938.88,"end":2941.88}],"notes":["本段主要讨论了K-Means算法与混合高斯模型之间的关系，指出混合高斯模型实际上是最大似然估计（MLE）算法的一种形式。讲者提到，混合高斯模型在后续课程中会展示其作为MLE算法的隐藏形式，并强调其与之前框架的联系。","讲者通过一个具体的例子，说明了如何利用phi参数来调整不同聚类的权重。当一个聚类生成的数据量远多于另一个聚类时，该点更可能属于生成更多数据的聚类。这体现了贝叶斯规则的应用，即通过先验概率调整后验概率。","讲者进一步解释了phi参数的结构，指出在有两个聚类的情况下，phi可以是标量，而在有m个聚类时，phi是一个向量，遵循多项式分布的性质。这说明了phi参数在不同情况下的表示方式。","讲者讨论了联合概率分布的性质，指出对于给定的xi和zi，对所有可能的类别求和时，概率总和应为1。这体现了条件概率的基本性质，即所有可能情况的概率总和为1。","讲者还提到，概率分布的分解方式，即先验分布与条件分布的乘积，这在贝叶斯推理中是关键的一步。通过这种方式，可以将数据点的分布分解为聚类的先验和条件分布。","最后，讲者提出了一个关于Zi概率的问题，暗示后续课程将深入探讨这一主题，强调了对概率分布和条件概率的理解在混合高斯模型中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2766.04,"end":2941.88,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":2766.04,"text":"going to look like k-means but it's going to have a lot more math and then"},{"start":2768.78,"text":"in later lectures, maybe like Wednesday, I'm going to show you how it's actually"},{"start":2773.22,"text":"an MLE algorithm in disguise. So it is actually an instance of your old"},{"start":2776.52,"text":"framework."},{"start":2789.66,"text":"Wonderful question. All right, so let's go back. So the question is, how does this change? I think"},{"start":2793.76,"text":"you're asking, how does this change the estimation procedure? Let me get back, see if I have a"},{"start":2798.08,"text":"drawing. Sorry, I have to scroll so far back. All right, actually I'll just use this picture. All"},{"start":2802.92,"text":"All right. Give me one more second to look. If I can't find it, I will just draw it again."},{"start":2810.38,"text":"Okay. Here it is. This character. Okay. Let's go back and see how the phi might intuitively"},{"start":2815.76,"text":"expand our reasoning. And then when we do the math, I want you to check that this actually"},{"start":2819.42,"text":"works. I'm not lying to you. So let's imagine you have mu1 and mu2, and you have this one."},{"start":2824.28,"text":"And let's imagine I picked it exactly where the points cross. Then it seems like a coin flip."},{"start":2829.16,"text":"Should this point go to cluster two or should it go to cluster one?"},{"start":2835.48,"text":"If you knew cluster 2 generated 100 times more data than cluster 1, would you be more likely to say this came from cluster 2 or cluster 1? Cluster 2, right? Because you would say, oh, actually, cluster 2 is spitting off points. It's relatively rare, all things being equal. That inference you just did is Bayes' rule. And we're going to come to that exactly when we do this, that the phi is allowing us to do exactly that, to tell us that the observed counts are there. Please."},{"start":2861.26,"text":"In this example, it only has to be a scalar because there are two, and it's determined. The last component is determined. If you have m outcomes, you only have to have m minus 1 because they sum. But in general, yes, it would be a vector, a multinomial vector. Yeah, great points. Please. Can you do the slide 27? Probably not. Yes, I'll do my best. Sure. I think this is 27. Is this 27?"},{"start":2890.4,"text":"Yeah."},{"start":2890.82,"text":"Good."},{"start":2891.38,"text":"I was just wondering, so if you get the joint probability"},{"start":2894.04,"text":"of xi and zi, and you just take one specific xi,"},{"start":2899.48,"text":"sum over all the possible classes,"},{"start":2903.0,"text":"would that add up to equal one ?"},{"start":2906.58,"text":"It is a probability, yes."},{"start":2909.0,"text":"So let's come to that in just one minute"},{"start":2910.8,"text":"to see actually how these are operating on them."},{"start":2913.86,"text":"them. All this is saying is the probability distribution for xi, how"},{"start":2921.52,"text":"likely xi is, is factors as, which this is a tautology, says if you tell me what"},{"start":2926.54,"text":"the cluster is and you have a distribution over clusters, you weight"},{"start":2929.3,"text":"that, condition on that says if you're in this cluster, this is the likelihood I"},{"start":2932.8,"text":"assign to you. That integration over all the possibilities of xi is one because"},{"start":2936.36,"text":"because it's a conditional probability, and that's the weighting."},{"start":2938.88,"text":"I understand that, but is the probability of ZI, let's say,"}],"speech_gaps":[{"start":2779.344,"end":2788.944}],"frame":"../frames/v040/017.webp","frame_time":2778.04},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":322,"text":"is 0.7, 0.3, and then you're further diluting that with the normal,","zh":"是 0.7、0.3，然后你再用正态分布进一步稀释这个值，","start":2941.88,"end":2947.02},{"id":323,"text":"and that's the probability of a specific combination of ZI and ZI,","zh":"这就是 ZI 和 ZI 的特定组合的概率，","start":2947.16,"end":2950.38},{"id":324,"text":"or something like that?","zh":"或者类似这样的问题？","start":2950.56,"end":2952.12},{"id":325,"text":"Yeah, so what is confusing to you about this is these are total probabilities","zh":"是的，你感到困惑的地方在于这些是总概率","start":2952.54,"end":2960.2},{"id":326,"text":"that are here, that are there.","zh":"它们在这里、那里出现。","start":2960.2,"end":2961.96},{"id":327,"text":"So you're going to have to sum over all of the ZIs that come into this,","zh":"因此，你需要对所有进入这个过程的 ZI 进行求和，","start":2962.12,"end":2966.18},{"id":328,"text":"and integrate over all the xi's that come into this. That would be the same that you would do","zh":"并对所有进入这个过程的 xi 进行积分。这和这里所做的是一样的","start":2966.18,"end":2971.16},{"id":329,"text":"here. It's a joint probability. Yeah, so that sums to one. They don't individually sum to one in the","zh":"这是一个联合概率。是的，这些概率加起来为 1。它们单独加起来并不为 1","start":2971.16,"end":2976.96},{"id":330,"text":"way that like if you just fixed one value and did the rest. Yeah, great point, great point.","zh":"以一种方式，就像你固定了一个值然后做其余的事情。是的，非常好的观点，非常好的观点。","start":2976.96,"end":2981.68},{"id":331,"text":"Okay, oh yeah, so there's a math coming. Okay, I believe we're here. You tell me if I'm wrong.","zh":"好的，哦对了，这里有一个数学内容。好的，我相信我们到了这里。你告诉我如果我错了的话。","start":2984.56,"end":2993.14},{"id":332,"text":"All right, yeah, we're here.","zh":"好的，是的，我们到了这里。","start":2995.04,"end":2995.98},{"id":333,"text":"Okay, cool.","zh":"好的，很酷。","start":2996.12,"end":2996.66},{"id":334,"text":"These are phenomenal questions.","zh":"这些问题非常棒。","start":2997.4,"end":2998.42},{"id":335,"text":"Please keep asking, right?","zh":"请继续提问，对吧？","start":2998.6,"end":2999.7},{"id":336,"text":"We are in no rush to cover them.","zh":"我们不着急覆盖这些内容。","start":2999.96,"end":3001.34},{"id":337,"text":"By all means, it's more important. All right. So here's how EM works. We talked about it at a high level. We're now going to go one little click down. So the E step, which I am highlighting for later, that terminology will make more sense later, but I want to build to it. We're going to guess the latent value for Zi. So for each point i1 to n, we're going to get a probability over which source it's likely to have come from.","zh":"总之，这更为重要。好的。那么EM是如何工作的呢？我们之前已经从高层次讨论过。现在我们将再深入一步。E步，我稍后会强调这个术语，稍后这个术语会更有意义，但我想逐步引导到那里。我们将猜测每个点Zi的潜在值。对于每个点i从1到n，我们将得到一个概率，表示它可能来自哪个源。","start":3002.23,"end":3025.01},{"id":338,"text":"The M-step, given that estimation, we're then going to update all the parameters, all the mus and the sigmas and the phis. And that's going to tell us that's the step where we're consolidating the cluster means. This is where we're doing estimation instead of cluster means. And then we're going to try and use that to estimate, given where we think the clusters are, how likely each point is. Back and forth, back and forth. So let's do each step in detail. Schema of the algorithm should look a lot like K-means.","zh":"在完成估计之后，M步将更新所有参数，包括所有均值μ、方差σ和概率φ。这一步将告诉我们，这是巩固聚类均值的步骤。在这里，我们进行的是对聚类均值的估计，而不是仅仅进行聚类。然后，我们将尝试利用这些信息，根据我们认为的聚类位置，估计每个点的可能性。反复进行，反复进行。现在，让我们详细地进行每一步。该算法的框架应该与K-means非常相似。","start":3027.39,"end":3055.12},{"id":339,"text":"Right? It's kind of the same thing that's going on, just with this more probabilistic take. So let's walk through what they are, and hopefully this will become clear. So what you're given in the E-step, you're given x1 to xn, and then you're given some current estimate of your parameters. So the parameters are telling you how likely every bump is, every source is. The means and the variances, picture the circles.","zh":"对吧？这与K-means类似，只是这里采用的是更概率化的视角。现在让我们来详细解释这些步骤，希望这会变得清晰。在E步中，你将得到x₁到xₙ的数据点，以及当前对参数的一些估计。这些参数告诉你每个数据点或每个源点的可能性。均值和方差，可以想象成圆圈。","start":3055.91,"end":3078.55},{"id":340,"text":"And then the idea is for each data point and each cluster, you're going to try and estimate how likely the probability that's there. And so you're going to write wij in terms of all the parameters that are there. So far so good? Okay. So how does that happen? So this is what we're after. How does this happen? So we're going to decompose it with Bayes' rule.","zh":"然后，对于每个数据点和每个聚类，你将尝试估计该点属于该聚类的概率。因此，你会用所有存在的参数来表示wij。到目前为止，这样理解对吗？好的。那么，这如何实现呢？这就是我们想要了解的。这如何实现呢？我们将使用贝叶斯规则来分解这一过程。","start":3079.64,"end":3108.18}],"notes":["本段讨论了概率分布的组合问题，讲者提到0.7和0.3的数值，然后进一步用正态分布进行稀释，这可能是指在混合高斯模型中，不同成分的概率权重。讲者提到‘specific combination of ZI and ZI’，这可能是指对ZI的某种组合概率，但具体含义需要结合上下文进一步明确。","讲者指出，这些概率是总概率，而不是单独某个值的概率。这说明在混合高斯模型中，每个数据点属于某个簇的概率是联合概率，需要对所有可能的ZI进行求和，对所有可能的xi进行积分。","讲者强调，这些概率并不像固定一个值后求其他值那样单独求和，而是整体上满足概率总和为1的条件。这说明在混合高斯模型中，每个数据点的归属概率是联合分布的一部分，需要整体考虑。","讲者提到EM算法的E步和M步，E步是估计潜在变量Zi的概率，M步是更新参数如均值、方差和混合权重。这说明EM算法的两个步骤分别负责估计潜在变量和更新模型参数。","讲者指出，EM算法的E步和M步是交替进行的，类似于K-means算法，但更具有概率性。这说明EM算法在结构上与K-means相似，但通过概率方法进行更精细的聚类。","讲者提到使用贝叶斯规则来分解概率，这表明在E步中，需要利用贝叶斯定理来计算每个数据点属于各个簇的概率。"],"formulas":[],"uncertainties":["ZI的组合概率具体含义不明确","‘diluting that with the normal’的具体数学含义不明确","‘specific combination of ZI and ZI’的重复可能为笔误"],"diagram":"none","start":2941.88,"end":3108.18,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":2941.88,"text":"is 0.7, 0.3, and then you're further diluting that with the normal,"},{"start":2947.16,"text":"and that's the probability of a specific combination of ZI and ZI,"},{"start":2950.56,"text":"or something like that?"},{"start":2952.54,"text":"Yeah, so what is confusing to you about this is these are total probabilities"},{"start":2960.2,"text":"that are here, that are there."},{"start":2962.12,"text":"So you're going to have to sum over all of the ZIs that come into this,"},{"start":2966.18,"text":"and integrate over all the xi's that come into this. That would be the same that you would do"},{"start":2971.16,"text":"here. It's a joint probability. Yeah, so that sums to one. They don't individually sum to one in the"},{"start":2976.96,"text":"way that like if you just fixed one value and did the rest. Yeah, great point, great point."},{"start":2984.56,"text":"Okay, oh yeah, so there's a math coming. Okay, I believe we're here. You tell me if I'm wrong."},{"start":2995.04,"text":"All right, yeah, we're here."},{"start":2996.12,"text":"Okay, cool."},{"start":2997.4,"text":"These are phenomenal questions."},{"start":2998.6,"text":"Please keep asking, right?"},{"start":2999.96,"text":"We are in no rush to cover them."},{"start":3002.23,"text":"By all means, it's more important. All right. So here's how EM works. We talked about it at a high level. We're now going to go one little click down. So the E step, which I am highlighting for later, that terminology will make more sense later, but I want to build to it. We're going to guess the latent value for Zi. So for each point i1 to n, we're going to get a probability over which source it's likely to have come from."},{"start":3027.39,"text":"The M-step, given that estimation, we're then going to update all the parameters, all the mus and the sigmas and the phis. And that's going to tell us that's the step where we're consolidating the cluster means. This is where we're doing estimation instead of cluster means. And then we're going to try and use that to estimate, given where we think the clusters are, how likely each point is. Back and forth, back and forth. So let's do each step in detail. Schema of the algorithm should look a lot like K-means."},{"start":3055.91,"text":"Right? It's kind of the same thing that's going on, just with this more probabilistic take. So let's walk through what they are, and hopefully this will become clear. So what you're given in the E-step, you're given x1 to xn, and then you're given some current estimate of your parameters. So the parameters are telling you how likely every bump is, every source is. The means and the variances, picture the circles."},{"start":3079.64,"text":"And then the idea is for each data point and each cluster, you're going to try and estimate how likely the probability that's there. And so you're going to write wij in terms of all the parameters that are there. So far so good? Okay. So how does that happen? So this is what we're after. How does this happen? So we're going to decompose it with Bayes' rule."}],"speech_gaps":[],"frame":"../frames/v040/018.webp","frame_time":2953.88},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":341,"text":"This basically says this conditional probability, we're going to look at the joint total probability of xi and zi conditioned on all these parameters. So far, we haven't done anything. This is pure syntax. We're then going to split conditionally on z. So we're basically trying to, what's going on here intuitively is, we have a model that goes in the other direction, if you like, where we have one that's z conditioned on x, and we're going to try and go to x conditioned on z. That's all that's happening in these slides.","zh":"这基本上是在说这个条件概率，我们将查看xi和zi在所有这些参数下的联合总概率。到目前为止，我们什么也没做。这只是纯粹的语法。然后我们将有条件地拆分z。因此，我们基本上是在尝试理解这里发生了什么，直观地说，我们有一个模型是反向的，也就是说，我们有一个z在x的条件下，我们将尝试得到x在z的条件下。这些幻灯片中发生的一切就是如此。","start":3109.16,"end":3138.02},{"id":342,"text":"This is kind of a standard argument. It seems weird the first time you're seeing it. I appreciate that. But this is all we're going to do. We have a model that's forward. We want to invert it conceptually so that we can go estimate the parameters. And then we apply Bayes' rule one more time. We sum over all the possible clusters.","zh":"这基本上是一个标准的论点。第一次看到它时似乎很奇怪，我理解这一点。但这就是我们所要做的全部。我们有一个正向的模型。我们想要在概念上将其反转，以便我们可以估计参数。然后我们再应用一次贝叶斯规则。我们对所有可能的聚类求和。","start":3138.43,"end":3158.48},{"id":343,"text":"So we're looking at one particular clustering, which is for some point I in cluster J. And we say, how likely is this cluster? Or what is this Wij? Well, we just normalize by looking at all the probabilities across all of them and expand over all. This is summing over all the possible clusters. That's what L is doing here. All right. Now, the key point is all of these terms are computable directly from the parameters we saw on the last slide.","zh":"我们现在关注的是一个特定的聚类，即对于某个点I在聚类J中。我们问，这个聚类有多大可能？或者这个Wij是什么？我们只需通过对所有可能的聚类的概率进行归一化，并对所有情况进行扩展。这就是L在这里所做的。好的，关键点是，所有这些项都可以直接从上一张幻灯片中看到的参数中计算出来。","start":3159.62,"end":3188.56},{"id":344,"text":"Now that we've done the decomposition, it's in the model framework. These conditional probabilities in this form are all just going to be these normals. So you know exactly how to write that out. I could write out x of this and all the rest. You know how to do that. The probability here, you know this. You just substitute in the natural parameter, and that will give you these numbers here. So the point is, the point that you should be hopefully convinced by is, this Wij is nothing more than rewriting it directly in the model with a couple applications of Bayes' rule.","zh":"现在我们已经完成了分解，它就处于模型框架中。这种形式的条件概率都是这些正态分布。因此，你知道如何写出这些表达式。我可以写出这个x的表达式以及所有其他内容。你知道如何做到这一点。这里的概率，你知道这一点。你只需代入自然参数，就会得到这些数值。因此，你应该被说服的要点是，这个Wij不过是在模型中直接重写，并应用了几次贝叶斯规则。","start":3189.12,"end":3218.2},{"id":345,"text":"It really is the estimation. And this may seem mysterious because there's all this terrible notation everywhere. But when we were informally reasoning earlier about how likely a point is, I'm like, this is Bayes' rule. This is what we're doing. We just inverted it. Cool. All right. At that point, we now have an estimate in the M-step for how likely every point is to belong to a cluster, given our current guess.","zh":"这确实是估计过程。这可能看起来有些神秘，因为到处都是令人困惑的符号。但当我们之前非正式地推理关于一个点属于某个类别的可能性时，我觉得这就是贝叶斯规则。这就是我们在做的事情。我们只是将其倒置了。很酷。好了，在这一点上，我们现在有了一个在M步中对每个点属于某个聚类的可能性的估计。","start":3219.28,"end":3247.81},{"id":346,"text":"of everything, the phi's, the means, everything, all the shapes. Now what we're going to do is same thing we did in k-means. What do we do in k-means? We then try to compute the new mean based on what we thought was in the cluster. Now we have a likelihood, so it's a softer version, but we have to then go ahead and compute where's the mean of that thing? What is the fraction of elements that are present? That's the phi. So what is the fraction of elements from source j? Well,","zh":"对于所有内容，包括phi值、均值，以及所有形状，我们现在要做的事情和k均值中的一样。我们在k均值中做了什么？我们尝试根据我们认为在聚类中的内容来计算新的均值。现在我们有了一个似然值，因此这是一个更柔和的版本，但我们仍然需要继续计算这个分布的均值在哪里？有多少元素存在？这就是phi值。那么，来自源j的元素占比是多少呢？","start":3248.46,"end":3276.22}],"notes":["本段讲解了如何通过条件概率和贝叶斯规则来推导混合高斯模型中的参数估计。讲者提到，我们从一个模型出发，该模型是基于数据点x来预测隐变量z，现在需要反过来，从z来预测x。这涉及到对联合概率的分解，并通过条件概率进行拆分。","讲者指出，这种推导过程虽然在第一次接触时看起来奇怪，但实际上是标准的数学推导。通过应用贝叶斯规则，我们对所有可能的聚类进行求和，从而得到最终的后验概率。这一步是模型推导的关键。","在具体计算中，讲者提到Wij表示某个点属于某个聚类的概率，这需要通过对所有聚类的概率进行归一化处理。所有这些计算都可以直接从上一张幻灯片中提到的参数中得出。","讲者进一步说明，这些条件概率在模型中可以表示为高斯分布，因此可以直接写出具体的概率表达式。通过代入自然参数，可以得到具体的数值结果。","讲者强调，这种推导过程虽然涉及大量符号，但本质上是贝叶斯规则的应用。通过这种推导，我们可以得到每个点属于各个聚类的概率估计。","最后，讲者提到在M步中，我们需要根据当前的估计来计算新的均值。这类似于K-means算法中的步骤，但在这里是基于概率的软分配，而不是硬分配。"],"formulas":[],"uncertainties":["of everything,
