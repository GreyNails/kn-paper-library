 the phi's, the means, everything, all the shapes."],"diagram":"none","start":3109.16,"end":3276.22,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3109.16,"text":"This basically says this conditional probability, we're going to look at the joint total probability of xi and zi conditioned on all these parameters. So far, we haven't done anything. This is pure syntax. We're then going to split conditionally on z. So we're basically trying to, what's going on here intuitively is, we have a model that goes in the other direction, if you like, where we have one that's z conditioned on x, and we're going to try and go to x conditioned on z. That's all that's happening in these slides."},{"start":3138.43,"text":"This is kind of a standard argument. It seems weird the first time you're seeing it. I appreciate that. But this is all we're going to do. We have a model that's forward. We want to invert it conceptually so that we can go estimate the parameters. And then we apply Bayes' rule one more time. We sum over all the possible clusters."},{"start":3159.62,"text":"So we're looking at one particular clustering, which is for some point I in cluster J. And we say, how likely is this cluster? Or what is this Wij? Well, we just normalize by looking at all the probabilities across all of them and expand over all. This is summing over all the possible clusters. That's what L is doing here. All right. Now, the key point is all of these terms are computable directly from the parameters we saw on the last slide."},{"start":3189.12,"text":"Now that we've done the decomposition, it's in the model framework. These conditional probabilities in this form are all just going to be these normals. So you know exactly how to write that out. I could write out x of this and all the rest. You know how to do that. The probability here, you know this. You just substitute in the natural parameter, and that will give you these numbers here. So the point is, the point that you should be hopefully convinced by is, this Wij is nothing more than rewriting it directly in the model with a couple applications of Bayes' rule."},{"start":3219.28,"text":"It really is the estimation. And this may seem mysterious because there's all this terrible notation everywhere. But when we were informally reasoning earlier about how likely a point is, I'm like, this is Bayes' rule. This is what we're doing. We just inverted it. Cool. All right. At that point, we now have an estimate in the M-step for how likely every point is to belong to a cluster, given our current guess."},{"start":3248.46,"text":"of everything, the phi's, the means, everything, all the shapes. Now what we're going to do is same thing we did in k-means. What do we do in k-means? We then try to compute the new mean based on what we thought was in the cluster. Now we have a likelihood, so it's a softer version, but we have to then go ahead and compute where's the mean of that thing? What is the fraction of elements that are present? That's the phi. So what is the fraction of elements from source j? Well,"}],"speech_gaps":[],"frame":"../frames/v040/019.webp","frame_time":3121.16},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":347,"text":"It's the expected value. Now, this may seem ad hoc to you or may seem natural to you. We will derive why it's that estimate. But intuitively, you're estimating this mean or the fraction. What it's saying is this says","zh":"这是期望值。这可能对你来说似乎有些随意，也可能对你来说很自然。我们将推导为什么这是这个估计值。但直观上，你是在估计这个均值或这个比例。它所表达的意思是，","start":3277.96,"end":3293.45},{"id":348,"text":"How many points are in J? If it were 0 or 1, this would be actually the fraction of points that are in there, right? If you knew precisely every single point in which cluster it was, this would be the exact fraction of points. But because we only know it probabilistically, so we know that it's in cluster 1 and cluster 2, but it's definitely not in cluster 3. So we know 1 and 2, 50%, it counts a half to one cluster and a half to another. That's the difference from K-mean. That's all it's saying.","zh":"集合J中有多少个点？如果它是0或1，那么这实际上就是处于其中的点的比例，对吧？如果你确切知道每个点属于哪个聚类，那么这将是精确的比例。但因为我们只是概率性地知道它属于哪个聚类，所以我们知道它一定不属于聚类3，但属于聚类1和聚类2。我们知道1和2，各占50%，它对一个聚类算一半，对另一个聚类也算一半。这就是与K均值的不同之处。这就是它所表达的意思。","start":3294.47,"end":3320.38},{"id":349,"text":"Then when we compute the means, because we also don't know perfectly which points are there, we compute them in a weighted way by exactly those weights and probabilities. So before, if we had, for example, those two points that were uncertain, it computes kind of half to one cluster and half in the other. And then we normalize so that we get, this is the sum, over all the weights that are there. So we get a proper mean, a weighted mean.","zh":"然后当我们计算均值时，因为我们也不确定哪些点属于其中，我们通过这些权重和概率以加权的方式进行计算。例如，之前如果有两个不确定的点，它会计算一半属于一个聚类，一半属于另一个聚类。然后我们进行归一化，使得我们得到所有权重的总和。因此，我们得到一个正确的均值，即加权均值。","start":3323.02,"end":3351.05},{"id":350,"text":"If all these were zeros and ones, this would look exactly like k-means, right? This would be your mean assignments that we had from before. We didn't have to estimate the fraction in k-means, but now we do. If these were zero, one, convince yourself that this would exactly be the same mean that we were computing in k-mean, the centroid that we were doing. Awesome. Okay. So on that, how does this work? Okay. So any questions, please? Yeah.","zh":"如果所有这些都是0和1，那么这看起来就和K均值完全一样，对吧？这将是之前我们计算的均值分配。在K均值中，我们不需要估计比例，但现在我们需要。如果这些是0和1，说服你自己，这将与我们在K均值中计算的均值完全相同，即我们计算的质心。太棒了。那么，它是如何工作的？好的。那么，有任何问题吗？是的。","start":3351.44,"end":3390.07},{"id":351,"text":"Oh yeah, sigma is updated here too. We will come back to the actual form to estimate sigma, but it's exactly the empirical way that you would imagine to do it. I just didn't derive it here. I may derive it a little bit later. But yeah, so the question was, you hit all these sigmas for me. We also have to estimate the sigmas. And intuitively, they will follow exactly this framework of you're going to look at the outer products of the xi's, weighted, and you're going to take their average. We'll talk exactly about how to do that estimation.","zh":"哦，是的，这里的σ也会被更新。我们将回到实际形式来估计σ，但它正是你想象中会做的经验方法。我只是没有在这里推导它。我可能会稍后推导它一点。但是的，问题是，你让我计算所有这些σ。我们还需要估计σ。直观上，它们将遵循你查看xi的外积，加权后取平均值的框架。我们将确切地讨论如何进行这种估计。","start":3392.33,"end":3420.99},{"id":352,"text":"Very good catch. All of these parameters need to be estimated. Then what do we do? After we do the E step, we do the M step, then what happens? We do the E step again. We do the M step again. We iterate, we iterate, and we iterate. It looks a lot like k-means if you think about it. So far so good? There is an example in the notes of running these particular points.","zh":"非常好的发现。所有这些参数都需要进行估计。那么我们接下来该怎么做呢？在完成E步之后，我们进行M步，之后又会发生什么呢？我们再次进行E步。我们再次进行M步。我们不断迭代，不断迭代，不断迭代。如果你仔细想想，这看起来非常像k-means算法。到目前为止还顺利吗？笔记中有一个例子，展示了如何对这些特定的点运行这些步骤。","start":3421.87,"end":3452.7}],"notes":["本段讲解了在混合高斯模型中，如何通过概率权重来计算均值。与K-Means不同，这里不是直接分配每个点到某个簇，而是根据概率来计算每个簇的加权均值。例如，如果一个点有50%的概率属于簇1和50%的概率属于簇2，那么它对这两个簇的均值都会产生贡献，这种加权方式使得模型能够处理不确定性。","在计算均值时，需要对所有点的权重进行归一化，以确保得到的是一个有效的加权均值。这与K-Means中的硬分配不同，K-Means中每个点只能属于一个簇，而这里则是软分配，每个点可以属于多个簇。","当所有权重都是0或1时，混合高斯模型的计算方式会退化为K-Means。此时，每个点被明确分配到某个簇，均值的计算方式与K-Means相同，即计算每个簇中所有点的平均值。","在混合高斯模型中，除了均值外，还需要估计方差（sigma）。这通常通过计算加权的外积的平均值来实现，类似于K-Means中计算簇内点的方差。","在参数估计过程中，需要交替进行E步和M步。E步负责计算后验概率，M步负责最大化似然函数，从而更新参数。这个过程会不断迭代，直到参数收敛。","混合高斯模型与K-Means在结构上相似，但前者能够处理不确定性，而后者则是硬分配。这种软分配的特性使得混合高斯模型在处理复杂数据时更具灵活性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3277.96,"end":3452.7,"asr_flags":[],"math_clarifications":["公式$E[\\frac{1}{N}\\sum_{i=1}^{N} w_i x_i]$中未明确随机变量的定义，权重$w_i$的分布或计算方式也未说明，因此无法确定其数学含义，需移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3277.96,"text":"It's the expected value. Now, this may seem ad hoc to you or may seem natural to you. We will derive why it's that estimate. But intuitively, you're estimating this mean or the fraction. What it's saying is this says"},{"start":3294.47,"text":"How many points are in J? If it were 0 or 1, this would be actually the fraction of points that are in there, right? If you knew precisely every single point in which cluster it was, this would be the exact fraction of points. But because we only know it probabilistically, so we know that it's in cluster 1 and cluster 2, but it's definitely not in cluster 3. So we know 1 and 2, 50%, it counts a half to one cluster and a half to another. That's the difference from K-mean. That's all it's saying."},{"start":3323.02,"text":"Then when we compute the means, because we also don't know perfectly which points are there, we compute them in a weighted way by exactly those weights and probabilities. So before, if we had, for example, those two points that were uncertain, it computes kind of half to one cluster and half in the other. And then we normalize so that we get, this is the sum, over all the weights that are there. So we get a proper mean, a weighted mean."},{"start":3351.44,"text":"If all these were zeros and ones, this would look exactly like k-means, right? This would be your mean assignments that we had from before. We didn't have to estimate the fraction in k-means, but now we do. If these were zero, one, convince yourself that this would exactly be the same mean that we were computing in k-mean, the centroid that we were doing. Awesome. Okay. So on that, how does this work? Okay. So any questions, please? Yeah."},{"start":3392.33,"text":"Oh yeah, sigma is updated here too. We will come back to the actual form to estimate sigma, but it's exactly the empirical way that you would imagine to do it. I just didn't derive it here. I may derive it a little bit later. But yeah, so the question was, you hit all these sigmas for me. We also have to estimate the sigmas. And intuitively, they will follow exactly this framework of you're going to look at the outer products of the xi's, weighted, and you're going to take their average. We'll talk exactly about how to do that estimation."},{"start":3421.87,"text":"Very good catch. All of these parameters need to be estimated. Then what do we do? After we do the E step, we do the M step, then what happens? We do the E step again. We do the M step again. We iterate, we iterate, and we iterate. It looks a lot like k-means if you think about it. So far so good? There is an example in the notes of running these particular points."}],"speech_gaps":[],"frame":"../frames/v040/020.webp","frame_time":3289.96},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":353,"text":"and how they look in E steps and M steps that are in the notes, but they didn't render here because of my mistake. And so there's a whole diagram that's in here that I would advise you to look at. I would say the content, intellectual content is not very high. It looks just like the other things. You start with the centers. You move the centers and which points are there.","zh":"以及它们在笔记中的E步和M步中的样子，但由于我的错误，它们没有在这里渲染出来。因此，这里有一个完整的图表，我建议你查看一下。我认为内容，智力内容并不是很高。看起来和其他内容一样。你从中心开始，移动中心，以及哪些点在那里。","start":3454.2,"end":3474.3},{"id":354,"text":"then what happens that's different in k-means is you... I'll just draw this piece because it's probably better than gesturing in my hands. So let's say that you had a bunch of points over here, and I'm drawing them in red because I'm saying you thought that these were the points that are really likely to be red and blue and so on. And this guy is kind of purple, right? When you go to compute the means for this, you're going to compute the means, and as I was just pointing out, you're going to compute the sigmas. You're going to compute the shape of these points and their center.","zh":"在k-means中，发生的不同之处是你……我将画出这一部分，因为它可能比用手比划更好。假设你这边有一堆点，我用红色画出它们，因为我表示你认为这些点很可能是红色和蓝色等。而这个人有点紫色，对吧？当你计算这些点的均值时，你会计算均值，正如我刚才指出的，你还会计算标准差。你会计算这些点的形状及其中心。","start":3474.86,"end":3503.94},{"id":355,"text":"from the given set of points that you tell me are red, and with what probability, in that weighted way. And so if you picture it as it's going, it's figuring out the shapes and the locations of all the sources on every iteration, then uses those shapes and iterations to rescore all the points. The next iteration, it's probably going to say, oh, that's pretty likely that this is actually from there. If, however,","zh":"从你告诉我的这些红色点的集合，以及它们的概率，以加权的方式。因此，如果你想象它在进行，它是在确定所有源的形状和位置，然后使用这些形状和迭代来重新评分所有点。下一次迭代，它可能会说，哦，这很可能是从那里来的。然而，","start":3504.57,"end":3525.71},{"id":356,"text":"this red thing had been super long, okay? All these points are in red and this is what it thought. And it thought it was a very narrow thing so that this distance became meaningful, right? So that it's an exponential with a very tight variance in one direction. Then at some point that variance gets so tight that this thing gets kicked over there. Clear enough how it works? Please ask a question. That was kind of an ad hoc on-the-fly explanation. I'm sure it left a lot to be desired. All right.","zh":"如果这个红色的东西非常长，对吧？所有这些点都是红色，这就是它所认为的。它认为它是一个非常狭窄的东西，因此这个距离变得有意义，对吧？因此，它是一个在某一方向具有非常紧致方差的指数分布。然后在某个时候，这个方差变得如此紧致，以至于这个东西被移到了那边。清楚它是如何工作的吗？请提问。那是一个相当临时的即兴解释。我确信它留下了诸多不足。好的。","start":3526.69,"end":3556.8},{"id":357,"text":"Feel free to ask me. Okay. All right. Okay. So at this stage.","zh":"随时可以问我。好的。好的。好的。在这一阶段。","start":3557.96,"end":3565.9},{"id":358,"text":"What am I going to do next? So what I'm going to do next is I'm going to tell you about this little detour through something called Jensen's inequality and remind you about convexity. And the reason I'm going to remind you about convexity is we're going to use it in one key step of the proof that otherwise seems to cause a lot of confusion. It is literally the definition of convexity that we're going to use, and that's going to allow us to do the entire estimation procedure for what we're doing.","zh":"接下来我要做什么？所以接下来我要做的是，我要带你们走一段关于称为Jensen不等式的弯路，并提醒你们关于凸性的内容。我要提醒你们凸性的原因是我们将在证明过程中一个关键步骤中使用它，否则这个步骤似乎会造成很多混淆。我们将使用凸性的定义，这将使我们能够完成我们正在做的整个估计过程。","start":3567.77,"end":3589.47},{"id":359,"text":"So what's happening as we do that back and forth and back and forth that we're doing,","zh":"当我们来回进行这些操作时，","start":3589.94,"end":3593.8},{"id":360,"text":"the question is, kind of should be looking in your head is, what does that likelihood or","zh":"问题是，你脑海中应该在想的是，我们所操作的这个似然函数或","start":3593.94,"end":3597.3},{"id":361,"text":"functional look like that we're kind of operating on? What are we actually minimizing underneath?","zh":"函数看起来是什么样子的？我们实际上是在最小化什么？","start":3597.3,"end":3601.3},{"id":362,"text":"Remember before there was this kind of least squares loss. Now the loss is more complicated.","zh":"记得之前我们有这种平方误差损失。现在损失函数更加复杂。","start":3601.52,"end":3605.38},{"id":363,"text":"It's this likelihood and probability thing. What we're going to do is we're going to use","zh":"它就是这个似然和概率的问题。我们将要做的是，我们将使用一个凸性估计，允许我们进行一个称为Jensen不等式的不等式，这将把期望值移入内部，从而允许我们","start":3605.56,"end":3609.72},{"id":364,"text":"a convex estimate where we're going to allow ourselves to do this one inequality called","zh":"进行操作。","start":3609.72,"end":3613.54},{"id":365,"text":"Jensen's inequality that's going to move basically an expectation inside that's going to allow us to","zh":"Jensen不等式，它将基本上把期望移到里面，这将允许我们","start":3613.54,"end":3618.82},{"id":366,"text":"could go from something that's hard to compute to something that's an easier surrogate to compute.","zh":"可以从一个难以计算的问题转化为一个更容易计算的替代问题。","start":3618.82,"end":3622.48},{"id":367,"text":"That's going to be the whole game. Before we get there, I'm going to show you Jensen's inequality","zh":"这将是整个讨论的重点。在我们到达那里之前，我将向你展示 Jensen 不等式","start":3623.4,"end":3628.4},{"id":368,"text":"so that it's really clear in your mind what the trade-off is. Hopefully, it's a nice geometric","zh":"以便你能够清楚地理解其中的权衡。希望这是一个很好的几何解释","start":3628.84,"end":3632.64}],"notes":["本段主要讲解K-Means算法的工作原理，通过举例说明如何根据给定的点集计算均值和方差，并指出在每次迭代中如何重新评估所有点的归属。讲者提到，K-Means算法通过计算点的形状和中心位置，逐步调整聚类中心，从而优化聚类效果。","讲者进一步解释了K-Means算法中如何处理不同颜色的点，例如红色和蓝色，以及如何通过计算方差来判断点的分布情况。他提到，当方差非常小时，点的分布会变得非常集中，从而影响聚类结果。","在讲解完K-Means算法后，讲者转向了Jensen不等式和凸性，这是后续证明过程中的关键步骤。他强调凸性在证明中的重要性，并指出这是整个估计过程的基础。","讲者提到，Jensen不等式允许我们将期望值内部化，从而将难以计算的复杂问题转化为更容易计算的替代问题。这为后续的优化过程提供了理论支持。","讲者还指出，之前的损失函数是平方误差损失，而现在的问题涉及似然和概率，需要使用凸估计来处理。这表明问题的复杂性有所增加。","最后，讲者提到将展示Jensen不等式，以帮助学生理解其在优化过程中的作用，并希望学生能够清晰地理解其中的权衡关系。"],"formulas":[],"uncertainties":["Jensen's inequality的具体形式未明确表达","凸性在证明中的具体应用未明确","似然和概率的具体形式未明确"],"diagram":"none","start":3454.2,"end":3632.64,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":3454.2,"text":"and how they look in E steps and M steps that are in the notes, but they didn't render here because of my mistake. And so there's a whole diagram that's in here that I would advise you to look at. I would say the content, intellectual content is not very high. It looks just like the other things. You start with the centers. You move the centers and which points are there."},{"start":3474.86,"text":"then what happens that's different in k-means is you... I'll just draw this piece because it's probably better than gesturing in my hands. So let's say that you had a bunch of points over here, and I'm drawing them in red because I'm saying you thought that these were the points that are really likely to be red and blue and so on. And this guy is kind of purple, right? When you go to compute the means for this, you're going to compute the means, and as I was just pointing out, you're going to compute the sigmas. You're going to compute the shape of these points and their center."},{"start":3504.57,"text":"from the given set of points that you tell me are red, and with what probability, in that weighted way. And so if you picture it as it's going, it's figuring out the shapes and the locations of all the sources on every iteration, then uses those shapes and iterations to rescore all the points. The next iteration, it's probably going to say, oh, that's pretty likely that this is actually from there. If, however,"},{"start":3526.69,"text":"this red thing had been super long, okay? All these points are in red and this is what it thought. And it thought it was a very narrow thing so that this distance became meaningful, right? So that it's an exponential with a very tight variance in one direction. Then at some point that variance gets so tight that this thing gets kicked over there. Clear enough how it works? Please ask a question. That was kind of an ad hoc on-the-fly explanation. I'm sure it left a lot to be desired. All right."},{"start":3557.96,"text":"Feel free to ask me. Okay. All right. Okay. So at this stage."},{"start":3567.77,"text":"What am I going to do next? So what I'm going to do next is I'm going to tell you about this little detour through something called Jensen's inequality and remind you about convexity. And the reason I'm going to remind you about convexity is we're going to use it in one key step of the proof that otherwise seems to cause a lot of confusion. It is literally the definition of convexity that we're going to use, and that's going to allow us to do the entire estimation procedure for what we're doing."},{"start":3589.94,"text":"So what's happening as we do that back and forth and back and forth that we're doing,"},{"start":3593.94,"text":"the question is, kind of should be looking in your head is, what does that likelihood or"},{"start":3597.3,"text":"functional look like that we're kind of operating on? What are we actually minimizing underneath?"},{"start":3601.52,"text":"Remember before there was this kind of least squares loss. Now the loss is more complicated."},{"start":3605.56,"text":"It's this likelihood and probability thing. What we're going to do is we're going to use"},{"start":3609.72,"text":"a convex estimate where we're going to allow ourselves to do this one inequality called"},{"start":3613.54,"text":"Jensen's inequality that's going to move basically an expectation inside that's going to allow us to"},{"start":3618.82,"text":"could go from something that's hard to compute to something that's an easier surrogate to compute."},{"start":3623.4,"text":"That's going to be the whole game. Before we get there, I'm going to show you Jensen's inequality"},{"start":3628.84,"text":"so that it's really clear in your mind what the trade-off is. Hopefully, it's a nice geometric"}],"speech_gaps":[],"frame":"../frames/v040/021.webp","frame_time":3466.2},{"title":"凸性与凸函数","segments":[{"id":369,"text":"picture. It's going to take me a little bit to set up, so we'll go through that over the next","zh":"图片。它需要我花一点时间来设置，所以我们将在接下来的时间里逐步进行。","start":3632.64,"end":3637.08},{"id":370,"text":"little bit. So what is convexity? If you've already seen this, don't worry about it.","zh":"一点点。那么什么是凸性？如果你已经了解过这个概念，不用担心。","start":3637.08,"end":3644.3},{"id":371,"text":"All good.","zh":"一切安好。","start":3644.92,"end":3645.58},{"id":372,"text":"If you haven't seen this, hopefully my presentation doesn't have to do it.","zh":"如果你还没有了解过这个概念，希望我的讲解不需要你去重新学习。","start":3645.86,"end":3649.24},{"id":373,"text":"So imagine that's a real circle, not one weird thing that I've drawn, okay?","zh":"想象一下，这是一张真实的圆形，而不是我画的什么奇怪的东西，好吗？","start":3649.3,"end":3652.8},{"id":374,"text":"Here are two shapes.","zh":"这里有两个形状。","start":3652.92,"end":3653.92},{"id":375,"text":"This one is going to be convex.","zh":"这个是凸的。","start":3655.4,"end":3657.76},{"id":376,"text":"This one is non-convex.","zh":"这个是非凸的。","start":3661.38,"end":3662.66},{"id":377,"text":"What does this mean?","zh":"这是什么意思？","start":3664.58,"end":3665.5},{"id":378,"text":"Well, it means, this math says, if you pick an A and a B,","zh":"嗯，这意味着，这数学告诉我们，如果你选择一个A和一个B，","start":3665.66,"end":3670.48},{"id":379,"text":"the line between them is always contained inside. No matter how I pick A","zh":"它们之间的线段总是包含在内部。无论我如何选择A","start":3671.54,"end":3676.28},{"id":380,"text":"and B. This term here is just the line. This is the set omega. So far so good?","zh":"和B。这里的术语只是指这条线段。这是集合omega。到目前为止还好吗？","start":3676.28,"end":3682.38},{"id":381,"text":"This one is non-convex. But now notice that A and B here, that's inside, that's","zh":"这个是凹的。但现在请注意这里的A和B，那是在内部，那就不够好。","start":3683.5,"end":3690.18},{"id":382,"text":"not good enough. It has to be for all of them. This is non-convex because of this","zh":"它必须对所有情况都成立。这是因为这个原因，它是非凸的","start":3690.18,"end":3696.12},{"id":383,"text":"Here's A and B. So far so good? All right.","zh":"这里有个A和B。到目前为止还好吗？好的。","start":3696.12,"end":3701.32},{"id":384,"text":"Now, that's convex as sets. What we care about are convex functions, and what we care about here is the graph that they're on. Now, those two things that I just drew, which seem kind of ad hoc, actually are nice canonical things. So the canonical convex function is a nice bowl-shaped function like x squared, okay? So here, I have some point z, I have some point a, I have some point b. This is my f, this character is f of z, okay?","zh":"现在，这是作为集合的凸性。我们关心的是凸函数，以及它们所处的图形。我刚才画的那两个东西，看起来有点随意，实际上是非常标准的典型例子。所以典型的凸函数是一个像x平方这样的碗状函数，对吧？在这里，我有一个点z，有一个点a，有一个点b。这是我的f，这个字符是f(z)，对吧？","start":3703.75,"end":3733.05},{"id":385,"text":"here, or f , since I picked z as a point. We hope that this function is convex. And in fact, if I color this properly, this thing here, this set as a graph, the function is convex if that set as a graph is convex.","zh":"在这里，或者说是f，因为我选z作为一点。我们希望这个函数是凸的。事实上，如果我正确地着色，这个图中的集合，如果这个图中的集合是凸的，那么这个函数就是凸的。","start":3733.56,"end":3766.64},{"id":386,"text":"What does it say about the chord between them? Well, it's got to go through the set, right? And so that means that this chord is above the rest of what happens. So far, so good? So in symbols, it's just saying this, which reduces to that. Okay? So geometrically, hopefully it's clear. There's a point here. If I take two points on the curve and connect the line between them,","zh":"这两点之间的弦意味着什么？它必须穿过这个集合，对吧？因此，这意味着这条弦位于其余部分的上方。到目前为止，这样理解对吗？用符号表示，它只是表达这个，这可以简化为那个。明白吗？从几何上看，希望这是清晰的。这里有一个点。如果我在曲线上取两个点，并连接它们之间的线，","start":3767.38,"end":3796.18}],"notes":["本段讲解了凸集和凸函数的基本概念。凸集的定义是，对于集合中的任意两点，连接这两点的线段完全包含在集合内。而凸函数的定义是，其图像（即函数的图形）本身是一个凸集。讲者通过图形和符号解释了凸函数的几何意义，即连接函数图像上任意两点的线段位于函数图像的上方。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3632.64,"end":3796.18,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":3632.64,"text":"picture. It's going to take me a little bit to set up, so we'll go through that over the next"},{"start":3637.08,"text":"little bit. So what is convexity? If you've already seen this, don't worry about it."},{"start":3644.92,"text":"All good."},{"start":3645.86,"text":"If you haven't seen this, hopefully my presentation doesn't have to do it."},{"start":3649.3,"text":"So imagine that's a real circle, not one weird thing that I've drawn, okay?"},{"start":3652.92,"text":"Here are two shapes."},{"start":3655.4,"text":"This one is going to be convex."},{"start":3661.38,"text":"This one is non-convex."},{"start":3664.58,"text":"What does this mean?"},{"start":3665.66,"text":"Well, it means, this math says, if you pick an A and a B,"},{"start":3671.54,"text":"the line between them is always contained inside. No matter how I pick A"},{"start":3676.28,"text":"and B. This term here is just the line. This is the set omega. So far so good?"},{"start":3683.5,"text":"This one is non-convex. But now notice that A and B here, that's inside, that's"},{"start":3690.18,"text":"not good enough. It has to be for all of them. This is non-convex because of this"},{"start":3696.12,"text":"line. Here's A and B. So far so good? All right."},{"start":3703.75,"text":"Now, that's convex as sets. What we care about are convex functions, and what we care about here is the graph that they're on. Now, those two things that I just drew, which seem kind of ad hoc, actually are nice canonical things. So the canonical convex function is a nice bowl-shaped function like x squared, okay? So here, I have some point z, I have some point a, I have some point b. This is my f, this character is f of z, okay?"},{"start":3733.56,"text":"here, or f , since I picked z as a point. We hope that this function is convex. And in fact, if I color this properly, this thing here, this set as a graph, the function is convex if that set as a graph is convex. Now, what does that mean? In symbols, if I take a point here and a point here,"},{"start":3767.38,"text":"What does it say about the chord between them? Well, it's got to go through the set, right? And so that means that this chord is above the rest of what happens. So far, so good? So in symbols, it's just saying this, which reduces to that. Okay? So geometrically, hopefully it's clear. There's a point here. If I take two points on the curve and connect the line between them,"}],"speech_gaps":[],"frame":"../frames/v040/022.webp","frame_time":3644.64},{"title":"凸函数与非凸函数的定义与性质","segments":[{"id":387,"text":"The function graph is going to go underneath it because those things are going to go in the graph, which is the part of the set that's above the function value. That's what the graph means here. Y is bigger than f of x. This is what the graph, I'm trying to draw the graph of x squared. Whether I succeeded or not, I mean, certainly I didn't succeed exactly, but if I'm close enough. Here's another function, some quartic or something, that's not convex.","zh":"函数图像会位于其下方，因为这些点会出现在图像中，而图像指的是集合中位于函数值上方的部分。这就是这里的图像含义。Y 大于 f(x)。这就是图像，我试图画出 x 平方的图像。无论我是否成功，我的确没有完全成功，但如果足够接近。这里还有一个函数，可能是四次函数或其他，它不是凸函数。","start":3797.5,"end":3824.32},{"id":388,"text":"And the reason is exactly as we talked about. Its graph goes below. Clear enough? This is non-convex. Okay. All good. Now, any questions about this? Everybody's happy? Please. Yeah, any z between a and b would certify that it's not present. Wonderful question. Okay, cool. Now, here's a nice characterization of convex and one that we will actually use. If f is twice differentiable,","zh":"原因和我们之前讨论的一样。它的图像会位于下方。清楚吗？这是非凸函数。好的。现在，有任何关于这个的问题吗？大家都满意吗？请。是的，任何 z 在 a 和 b 之间的点都可以证明它不存在。好问题。好的，很酷。现在，这里有一个凸函数的很好描述，我们之后会用到。如果 f 是二阶可导的，","start":3825.18,"end":3859.04},{"id":389,"text":"And for all x, f prime of x is greater than or equal to 0, then f is convex.","zh":"并且对于所有 x，f 的导数 f' 的值大于或等于 0，那么 f 是凸函数。","start":3861.17,"end":3866.27},{"id":390,"text":"Now, why is that?","zh":"为什么是这样？","start":3868.23,"end":3869.63},{"id":391,"text":"Well, use Taylor theorem with remainder.","zh":"嗯，使用带有余项的泰勒定理。","start":3871.35,"end":3873.33},{"id":392,"text":"Look right out the definition.","zh":"直接看定义。","start":3875.87,"end":3877.47},{"id":393,"text":"And notice that you get out this nice c here that's greater than or equal to 0","zh":"并注意到你会得到一个大于或等于 0 的漂亮常数 c，","start":3877.87,"end":3883.57},{"id":394,"text":"because it's a square.","zh":"因为它是一个平方。","start":3883.57,"end":3884.55},{"id":395,"text":"That's all that's going on.","zh":"这就是全部内容。","start":3886.29,"end":3887.47},{"id":396,"text":"So these bowl-shaped functions, these","zh":"这些碗状函数，这些","start":3888.33,"end":3890.53},{"id":397,"text":"These are the convex functions.","zh":"这些都是凸函数。","start":3890.53,"end":3891.49},{"id":398,"text":"That's all we're saying here.","zh":"这就是我们在这里要说的全部。","start":3892.65,"end":3894.51},{"id":399,"text":"And that's going to allow us, when we use before,","zh":"这将允许我们在之前使用时，","start":3894.85,"end":3897.59},{"id":400,"text":"we're going to use the fact that this chord, we're actually","zh":"我们将使用这条弦，我们实际上","start":3897.95,"end":3900.15},{"id":401,"text":"going to use it on concave functions.","zh":"将在凹函数上使用它。","start":3900.15,"end":3901.19},{"id":402,"text":"But this is going to provide us with some nice geometry","zh":"这将为我们提供一些优美的几何性质","start":3901.35,"end":3904.37},{"id":403,"text":"about what kind of estimate we have.","zh":"关于我们拥有哪种估计。","start":3904.37,"end":3906.25},{"id":404,"text":"OK.","zh":"好的。","start":3907.23,"end":3907.59},{"id":405,"text":"Awesome.","zh":"太棒了。","start":3907.73,"end":3908.09},{"id":406,"text":"All right.","zh":"好极了。","start":3912.59,"end":3913.07},{"id":407,"text":"Now, in fact, we'll also worry about these things which","zh":"事实上，我们也会关注这些事物，","start":3913.19,"end":3915.35},{"id":408,"text":"are strongly convex if it's strictly greater than 0.","zh":"如果它严格大于0，则是强凸的。","start":3915.35,"end":3919.05},{"id":409,"text":"And that's just terminology, okay?","zh":"这只是术语，对吧？","start":3920.53,"end":3922.55},{"id":410,"text":"Please.","zh":"请。","start":3923.57,"end":3924.05},{"id":411,"text":"Oh, yeah, great question.","zh":"哦，是的，非常好的问题。","start":3927.77,"end":3929.85},{"id":412,"text":"Okay, so basically all I did here is I took this function z","zh":"好的，所以基本上我在这里所做的就是取这个函数 z","start":3929.95,"end":3934.67},{"id":413,"text":"and I looked at, I subtracted out both sides","zh":"并检查了两边，就像我查看这两个部分一样。","start":3934.67,"end":3939.79},{"id":414,"text":"just as I was looking at the two pieces.","zh":"我只是在查看这两个部分。","start":3939.79,"end":3941.43},{"id":415,"text":"That's going to subtract off the first terms.","zh":"这将减去第一项。","start":3941.53,"end":3943.33},{"id":416,"text":"Then I'm going to get this nice kind of convex relaxation","zh":"然后我将从这里得到一个很好的凸松弛","start":3943.45,"end":3946.95},{"id":417,"text":"from this term here, right,","zh":"来自这里的项，对吧，","start":3946.95,"end":3949.01},{"id":418,"text":"by putting this piece down here. I'm just taking the terms that are associated with f'. And then","zh":"通过将这部分放在这里。我只是取与 f' 相关的项，然后","start":3949.01,"end":3954.93},{"id":419,"text":"what I'm claiming here is I want to claim that this line, these guys are above z, and my point","zh":"我现在想说的是，我想声称这条线上的这些点都在z之上，我的观点是","start":3954.93,"end":3959.37},{"id":420,"text":"is when I do that, any mixture of those values, those convex mixture of those values, it's going","zh":"当我这样做时，任何这些值的混合，也就是这些值的凸混合，都会等于这里的这个字符。","start":3959.37,"end":3964.25},{"id":421,"text":"to be equal to this character here. f is this character here plus some c which is positive","zh":"f 是这里的这个字符加上一个正数或非负数的常数c，因此我有这个函数是凸函数。","start":3964.25,"end":3970.43},{"id":422,"text":"or non-negative, and so I have that this function is convex.","zh":"请。","start":3970.43,"end":3973.17},{"id":423,"text":"Please.","zh":"请。","start":3973.39,"end":3973.61}],"notes":["本段主要讲解了凸函数的定义和性质，特别是通过导数的非负性来判断函数是否为凸函数。讲者提到，如果一个函数在所有点上的一阶导数非负，那么该函数是凸函数。这是凸函数的一个重要特征。","讲者还提到，凸函数的图像类似于碗形，且其图像上的任意弦都在函数图像的上方。这是凸函数的一个几何特征，有助于理解凸函数的性质。","讲者进一步指出，如果函数的二阶导数在所有点上非负，那么该函数是凸函数。这是通过泰勒定理和余项来证明的，其中余项中的项是非负的，从而保证了函数的凸性。","讲者还提到，强凸函数是指二阶导数严格大于零的函数，这只是一个术语，用于描述函数的更强凸性。","讲者通过一个具体的例子，说明了如何通过函数的导数和余项来判断函数是否为凸函数。他提到，通过将函数的导数和余项结合起来，可以得出函数的凸性。","讲者还提到，凸函数的性质在后续的讨论中将被使用，特别是在处理非凸函数和混合高斯模型时，这些性质将提供重要的几何信息。"],"formulas":[],"uncertainties":["在讲者提到的函数图像和余项的讨论中，部分术语和表达可能存在歧义，例如 'this character here' 的具体含义需要进一步澄清。","讲者提到的 'convex relaxation' 和 'mixture of those values' 的具体数学含义需要更详细的解释，以确保理解的准确性。"],"diagram":"none","start":3797.5,"end":3973.61,"asr_flags":[],"math_clarifications":["原始片段中提到的凸函数条件是基于一阶导数非负，但未明确指出这是凸函数的充分条件。根据数学定义，凸函数的充分条件是二阶导数非负（对于可微函数）。因此，原始片段中的公式未准确反映凸函数的数学定义，需修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":37,"raw_segments":[{"start":3797.5,"text":"The function graph is going to go underneath it because those things are going to go in the graph, which is the part of the set that's above the function value. That's what the graph means here. Y is bigger than f of x. This is what the graph, I'm trying to draw the graph of x squared. Whether I succeeded or not, I mean, certainly I didn't succeed exactly, but if I'm close enough. Here's another function, some quartic or something, that's not convex."},{"start":3825.18,"text":"And the reason is exactly as we talked about. Its graph goes below. Clear enough? This is non-convex. Okay. All good. Now, any questions about this? Everybody's happy? Please. Yeah, any z between a and b would certify that it's not present. Wonderful question. Okay, cool. Now, here's a nice characterization of convex and one that we will actually use. If f is twice differentiable,"},{"start":3861.17,"text":"And for all x, f prime of x is greater than or equal to 0, then f is convex."},{"start":3868.23,"text":"Now, why is that?"},{"start":3871.35,"text":"Well, use Taylor theorem with remainder."},{"start":3875.87,"text":"Look right out the definition."},{"start":3877.87,"text":"And notice that you get out this nice c here that's greater than or equal to 0"},{"start":3883.57,"text":"because it's a square."},{"start":3886.29,"text":"That's all that's going on."},{"start":3888.33,"text":"So these bowl-shaped functions, these"},{"start":3890.53,"text":"These are the convex functions."},{"start":3892.65,"text":"That's all we're saying here."},{"start":3894.85,"text":"And that's going to allow us, when we use before,"},{"start":3897.95,"text":"we're going to use the fact that this chord, we're actually"},{"start":3900.15,"text":"going to use it on concave functions."},{"start":3901.35,"text":"But this is going to provide us with some nice geometry"},{"start":3904.37,"text":"about what kind of estimate we have."},{"start":3907.23,"text":"OK."},{"start":3907.73,"text":"Awesome."},{"start":3912.59,"text":"All right."},{"start":3913.19,"text":"Now, in fact, we'll also worry about these things which"},{"start":3915.35,"text":"are strongly convex if it's strictly greater than 0."},{"start":3920.53,"text":"And that's just terminology, okay?"},{"start":3923.57,"text":"Please."},{"start":3927.77,"text":"Oh, yeah, great question."},{"start":3929.95,"text":"Okay, so basically all I did here is I took this function z"},{"start":3934.67,"text":"and I looked at, I subtracted out both sides"},{"start":3939.79,"text":"just as I was looking at the two pieces."},{"start":3941.53,"text":"That's going to subtract off the first terms."},{"start":3943.45,"text":"Then I'm going to get this nice kind of convex relaxation"},{"start":3946.95,"text":"from this term here, right,"},{"start":3949.01,"text":"by putting this piece down here. I'm just taking the terms that are associated with f'. And then"},{"start":3954.93,"text":"what I'm claiming here is I want to claim that this line, these guys are above z, and my point"},{"start":3959.37,"text":"is when I do that, any mixture of those values, those convex mixture of those values, it's going"},{"start":3964.25,"text":"to be equal to this character here. f is this character here plus some c which is positive"},{"start":3970.43,"text":"or non-negative, and so I have that this function is convex."},{"start":3973.39,"text":"Please."}],"speech_gaps":[],"frame":"../frames/v040/023.webp","frame_time":3809.5},{"title":"K-Means 与混合高斯模型中的数学细节","segments":[{"id":424,"text":"Why is it true that the function is using a one-half here?","zh":"为什么这个函数这里使用了二分之一？","start":3974.05,"end":3977.59},{"id":425,"text":"Oh, because it, so the error term here, so the error term,","zh":"哦，因为这里，所以这个误差项，所以这个误差项，","start":3978.55,"end":3982.89},{"id":426,"text":"you're right that there should be a one-half here, so that is definitely an error,","zh":"你说得对，这里应该有一个二分之一，所以这 definitely 是一个错误，","start":3982.91,"end":3985.93},{"id":427,"text":"that this should be over 2 because it should be the whole thing.","zh":"这里应该除以 2，因为它应该包含整个项。","start":3986.47,"end":3988.99},{"id":428,"text":"The part here is that in the error terms, I'm just picking some a to a's and a to b's,","zh":"这里的关键在于误差项，我只是在 a 到 a 的之间和 a 到 b 的之间选择了一些点，","start":3989.29,"end":3994.29},{"id":429,"text":"and that's the way the error term works.","zh":"这就是误差项的工作方式。","start":3994.39,"end":3995.97},{"id":430,"text":"But you're 100% right that there should be a one-half here, normalizing it.","zh":"你说得 100% 正确，这里应该有一个二分之一来进行归一化。","start":3996.05,"end":3999.55},{"id":431,"text":"Wonderful point. Good catch. Awesome. Okay, and the point is that you're then getting this mixture,","zh":"非常好的问题。你抓到了关键点。太棒了。好的，这个点是说你最终会得到这样一个混合分布，","start":4000.29,"end":4010.65},{"id":432,"text":"no matter where I get the mixture of F and A, anywhere on that line, that's the line between","zh":"无论我在F和A的混合中得到的是线上的哪个点，这条线就是它们之间的线，我基本上总是得到一个非负的C的和。好的。好的。不错。","start":4010.83,"end":4015.23},{"id":433,"text":"them, I'm basically always getting this sum of a C which is non-negative. Okay. All right. Cool.","zh":"不错，好的，到目前为止一切顺利。","start":4015.23,"end":4023.83},{"id":434,"text":"Cool, okay, so far so good.","zh":"这就是我们真正关心的内容。","start":4023.83,"end":4026.91},{"id":435,"text":"This is what we actually care about.","zh":"对于Jensen不等式，我们关心的是f(x)的期望值","start":4027.01,"end":4028.15},{"id":436,"text":"For Jensen, we care about that the expected value of f of x","zh":"大于或等于f的期望值。","start":4029.19,"end":4034.87},{"id":437,"text":"is greater than or equal to f of the expected value.","zh":"这就是当我能够将某物推入某物时所指的意思","start":4035.53,"end":4038.15},{"id":438,"text":"This is what I mean when we're able to push something","zh":"东西和","start":4038.31,"end":4040.49},{"id":439,"text":"thing and","zh":"东西和","start":4040.49,"end":4040.69},{"id":440,"text":"if you like. So let's look at a simple example here where x takes the value a with probability lambda and b with probability 1 minus lambda. Then the expected value of x is exactly this mixture, which we just talked about on the previous slide. But f of this mixture is exactly z. Jensen's inequality is the definition of convexity. Sometimes it's presented as some mysterious consequence. It is the definition of convexity.","zh":"如果你想的话。那么让我们来看一个简单的例子，其中x以概率lambda取值a，以概率1减去lambda取值b。那么x的期望值正是这种混合，我们在上一张幻灯片中刚刚讨论过。但f这个混合值正好是z。Jensen不等式就是凸性的定义。有时它被呈现为某种神秘的后果。它就是凸性的定义。","start":4041.46,"end":4070.73},{"id":441,"text":"It's like the whole reason we're after it. Now, this piece here, you could say, well, you only proved it for two points or something. OK. Two, you can do induction. Induction can get you to the continuous case. This is it. No more. OK? All right. All good. OK. So far, good? So all that you care about is this notion here, this direction goes exactly the same as you would expect for convexity. That's all we're going to use. That we can move this inside, and we're going to get some slop.","zh":"这正是我们追求的目标。现在，这一部分，你可以说，好吧，你只证明了两点的情况。好的。两点，你可以用归纳法。归纳法可以让你推广到连续的情况。这就是了。没有更多了。好吗？好的。到目前为止，还好吗？你所关心的只是这个概念，这个方向与凸性所预期的完全一样。这就是我们要用的。我们可以将它移入内部，我们会得到一些误差。","start":4071.53,"end":4100.08},{"id":442,"text":"All right, we say that a function is concave if negative that is convex. Does anyone remember what the canonical concave function is? Negative x squared would be a good one, but also logs. We're going to use logs a lot. This is going to be really important for us because we apply this function to logs of probabilities, right? That's what we're going to do again and again. So we're going to use these concave functions all over the place, okay?","zh":"好的，我们说一个函数是凹函数，如果它的负函数是凸函数。有没有人记得什么是典型的凹函数？负的x平方是一个很好的例子，对数函数也是。我们会大量使用对数函数。这对我们将非常重要，因为我们把这个函数应用在概率的对数上，对吧？我们将会反复这样做。因此，我们会到处使用这些凹函数，好吗？","start":4101.07,"end":4133.67}],"notes":["本段讨论了在误差项中使用1/2的原因，指出这是为了归一化。讲者承认这是一个错误，并强调了归一化的重要性。同时，讲者提到无论混合分布如何，总和都是非负的。","接着，讲者引入了Jensen不等式，指出这是凸函数的定义。讲者强调了Jensen不等式在凸函数中的核心地位，并提到它有时被误认为是某种神秘的结论，但实际上它是凸函数的定义。","讲者还提到，Jensen不等式最初仅在两点上证明，但可以通过归纳法推广到连续情况。这表明了数学证明的递归性质。","最后，讲者讨论了凹函数的概念，指出凹函数是凸函数的负函数。讲者提到负二次函数和对数函数是常见的凹函数，并强调对数函数在概率计算中的重要性，特别是在处理概率对数时。","讲者还提到，对数函数将被频繁使用，特别是在处理概率分布时，这为后续内容（如混合高斯模型）奠定了基础。","整个段落强调了数学推导的严谨性，特别是在处理误差项和凸函数时，必须注意归一化和定义的准确性。"],"formulas":[{"latex":"E[f(x)] \\geq f(E[x])","symbols":"期望值的函数大于等于函数的期望值","explanation":"公式正确表达了Jensen不等式，即对于凸函数f，E[f(x)] ≥ f(E[x])。","evidence":"For Jensen, we care about that the expected value of f of x is greater than or equal to f of the expected value. This is what I mean when we're able to push something thing and if you like. So let's look at a simple example here where x takes the value a with probability lambda and b with probability 1 minus lambda. Then the expected value of x is exactly this mixture, which we just talked about on the previous slide. But f of this mixture is exactly z. Jensen's inequality is the definition of convexity. Sometimes it's presented as some mysterious consequence. It is the definition of convexity."},{"latex":"f(x) \\text{ is concave if } -f(x) \\text{ is convex}","symbols":"函数是凹函数当且仅当其负函数是凸函数","explanation":"公式正确表达了凹函数与凸函数的关系，即凹函数的负函数是凸函数。","evidence":"All right, we say that a function is concave if negative that is convex. Does anyone remember what the canonical concave function is? Negative x squared would be a good one, but also logs. We're going to use logs a lot. This is going to be really important for us because we apply this function to logs of probabilities, right? That's what we're going to do again and again. So we're going to use these concave functions all over the place, okay?"}],"uncertainties":["在段落438和439中，'thing and'可能为'and then'的误识别，但未影响整体理解。"],"diagram":"none","start":3974.05,"end":4133.67,"asr_flags":[439],"math_clarifications":["原始文本中提到的'one-half'问题与公式无关，因此无需在公式中进行修正。"],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3974.05,"text":"Why is it true that the function is using a one-half here?"},{"start":3978.55,"text":"Oh, because it, so the error term here, so the error term,"},{"start":3982.91,"text":"you're right that there should be a one-half here, so that is definitely an error,"},{"start":3986.47,"text":"that this should be over 2 because it should be the whole thing."},{"start":3989.29,"text":"The part here is that in the error terms, I'm just picking some a to a's and a to b's,"},{"start":3994.39,"text":"and that's the way the error term works."},{"start":3996.05,"text":"But you're 100% right that there should be a one-half here, normalizing it."},{"start":4000.29,"text":"Wonderful point. Good catch. Awesome. Okay, and the point is that you're then getting this mixture,"},{"start":4010.83,"text":"no matter where I get the mixture of F and A, anywhere on that line, that's the line between"},{"start":4015.23,"text":"them, I'm basically always getting this sum of a C which is non-negative. Okay. All right. Cool."},{"start":4023.83,"text":"Cool, okay, so far so good."},{"start":4027.01,"text":"This is what we actually care about."},{"start":4029.19,"text":"For Jensen, we care about that the expected value of f of x"},{"start":4035.53,"text":"is greater than or equal to f of the expected value."},{"start":4038.31,"text":"This is what I mean when we're able to push something"},{"start":4040.49,"text":"thing and"},{"start":4041.46,"text":"if you like. So let's look at a simple example here where x takes the value a with probability lambda and b with probability 1 minus lambda. Then the expected value of x is exactly this mixture, which we just talked about on the previous slide. But f of this mixture is exactly z. Jensen's inequality is the definition of convexity. Sometimes it's presented as some mysterious consequence. It is the definition of convexity."},{"start":4071.53,"text":"It's like the whole reason we're after it. Now, this piece here, you could say, well, you only proved it for two points or something. OK. Two, you can do induction. Induction can get you to the continuous case. This is it. No more. OK? All right. All good. OK. So far, good? So all that you care about is this notion here, this direction goes exactly the same as you would expect for convexity. That's all we're going to use. That we can move this inside, and we're going to get some slop."},{"start":4101.07,"text":"All right, we say that a function is concave if negative that is convex. Does anyone remember what the canonical concave function is? Negative x squared would be a good one, but also logs. We're going to use logs a lot. This is going to be really important for us because we apply this function to logs of probabilities, right? That's what we're going to do again and again. So we're going to use these concave functions all over the place, okay?"}],"speech_gaps":[],"frame":"../frames/v040/024.webp","frame_time":3986.05},{"title":"Jensen不等式与EM算法的引入","segments":[{"id":443,"text":"And in that case, Jensen's inequality has the sign reversed. This is what we're actually going to use. Now, if it were linear, it's concave and convex because the derivative is exactly zero. That's pretty nice. Linear functions are great, right? And in that case, this is inequality, right? That's linearity of expectation. You should expect that. Just a sanity check. Okay, so hopefully that extremely fast detour through convex analysis in Jensen's","start":4135.47,"end":4165.61},{"id":444,"text":"at least warmed you up when we go through here. And what the flag is, if it doesn't make intuitive sense to you, that's totally okay. But at least you know where to look. Okay, so let's look at the algorithm as maximum likelihood. So here's what we're going to do. We have a likelihood function which says given all of our parameters, there's some likelihood on the data. Standard thing we've been doing forever. How come I can write this as a sum? What am I assuming here?","start":4166.64,"end":4193.21},{"id":445,"text":"Some iid-ness. It's always iid. Just say iid. Even if you don't know, just iid. You can say that kind of stuff. Sounds smart. Anyway, it happens to be correct. You're 100% correct. I don't want to distract you. So you took a log and you summed it up. Now, we assume that px of theta has this form. Now, I'm going to make the latent variable here discrete. You can do everything that I'm doing here with integrals. It'll feel kind of nice. I like writing those integral signs. It's in the notes that way.","start":4194.27,"end":4219.77},{"id":446,"text":"But it doesn't seem to confuse people on the fly. So I'm going to do it with sums. So just imagine the latent variable is discrete. Here, this phi is bundling all the parameters. So it really should be a semicolon here. It's all the parameters. Mus and sigmas, all the ones I forget. Phis, they're all bundled somewhere inside that data. So let's give a generic algorithm to maximize the likelihood for these latent variable models. And these latent variable models come up all over the place.","start":4220.43,"end":4245.92},{"id":447,"text":"Okay, because they're basically a way that you assume there's some structure. We assumed clustering. We assumed that they were Gaussian point sources. You now know a whole library of things you can assume about the model. They're all going to be solved the same way. Okay. All right. So let's get to the picture of EM. Ooh, more drawing for me. All right, let's do it. All right, so here's our function. This is going to be L of theta. Here's the general idea of how we're going to solve this thing.","start":4246.73,"end":4277.76},{"id":448,"text":"Okay? We are going to start with, I guess, theta zero. This is going to be L of theta zero. Okay. Now, what we're going to do is we're going to figure out some surrogate, which we'll talk about in one second, which is going to have a very nice property and is going to come about because of our use of Jensen's inequality, which we're going to call LT of theta. Okay? And this is going to be L zero of theta. Let's just call it L zero of theta.","start":4279.08,"end":4313.22}],"notes":["本段主要讲解Jensen不等式在凸分析中的应用，以及如何通过该不等式来构建EM算法的替代函数。讲者指出，当函数是线性时，Jensen不等式中的符号会反转，这是EM算法中使用的关键点。同时，讲者提到线性函数的性质，如凸性和凹性，以及期望的线性性质，这些是理解后续内容的基础。","讲者强调在处理最大似然估计时，假设数据是独立同分布的（iid），这是构建似然函数的前提。同时，讲者指出，即使在不知道具体分布的情况下，也可以使用iid假设，这在实际应用中非常常见。","讲者提到在处理隐变量模型时，可以使用积分或求和的方式，但更倾向于使用求和，因为这样更直观。同时，讲者指出，参数（如均值和方差）和隐变量的分布（如phi）是捆绑在一起的，这在模型构建中非常重要。","讲者进一步说明，隐变量模型是机器学习中常见的结构，可以用于假设数据的结构，如聚类或高斯点源。这些模型的求解方法是相似的，因此可以使用统一的框架来处理。","讲者引入EM算法的概念，指出其核心思想是通过构建一个替代函数（surrogate function）来最大化似然函数。这个替代函数的构建依赖于Jensen不等式，并且在后续的步骤中会详细讨论。","讲者提到EM算法的第一步是初始化参数（theta零），并计算初始的似然函数值。接下来，将讨论如何构建替代函数（LT of theta），并利用其性质来优化目标函数。"],"formulas":[{"latex":"Jensen's inequality","symbols":"Jensen不等式","explanation":"保持原样，Jensen不等式是凸分析中的基本概念，无需修改。","evidence":"And in that case, Jensen's inequality has the sign reversed. This is what we're actually going to use. Now, if it were linear, it's concave and convex because the derivative is exactly zero. That's pretty nice. Linear functions are great, right? And in that case, this is inequality, right? That's linearity of expectation. You should expect that. Just a sanity check. Okay, so hopefully that extremely fast detour through convex analysis in Jensen's"},{"latex":"L(\\theta)","symbols":"似然函数","explanation":"保持原样，L(θ)表示似然函数，符合常规记号。","evidence":"Okay, because they're basically a way that you assume there's some structure. We assumed clustering. We assumed that they were Gaussian point sources. You now know a whole library of things you can assume about the model. They're all going to be solved the same way. Okay. All right. So let's get to the picture of EM. Ooh, more drawing for me. All right, let's do it. All right, so here's our function. This is going to be L of theta. Here's the general idea of how we're going to solve this thing."},{"latex":"L_0(\\theta)","symbols":"替代函数","explanation":"保持原样，L_0(θ)表示替代函数，符合上下文中的定义。","evidence":"Okay? We are going to start with, I guess, theta zero. This is going to be L of theta zero. Okay. Now, what we're going to do is we're going to figure out some surrogate, which we'll talk about in one second, which is going to have a very nice property and is going to come about because of our use of Jensen's inequality, which we're going to call LT of theta. Okay? And this is going to be L zero of theta. Let's just call it L zero of theta."}],"uncertainties":[],"diagram":"none","start":4135.47,"end":4313.22,"asr_flags":[],"math_clarifications":["Jensen不等式在凸函数和期望的上下文中使用，需确保其应用条件符合凸性或凹性。"],"boards":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4135.47,"text":"And in that case, Jensen's inequality has the sign reversed. This is what we're actually going to use. Now, if it were linear, it's concave and convex because the derivative is exactly zero. That's pretty nice. Linear functions are great, right? And in that case, this is inequality, right? That's linearity of expectation. You should expect that. Just a sanity check. Okay, so hopefully that extremely fast detour through convex analysis in Jensen's"},{"start":4166.64,"text":"at least warmed you up when we go through here. And what the flag is, if it doesn't make intuitive sense to you, that's totally okay. But at least you know where to look. Okay, so let's look at the algorithm as maximum likelihood. So here's what we're going to do. We have a likelihood function which says given all of our parameters, there's some likelihood on the data. Standard thing we've been doing forever. How come I can write this as a sum? What am I assuming here?"},{"start":4194.27,"text":"Some iid-ness. It's always iid. Just say iid. Even if you don't know, just iid. You can say that kind of stuff. Sounds smart. Anyway, it happens to be correct. You're 100% correct. I don't want to distract you. So you took a log and you summed it up. Now, we assume that px of theta has this form. Now, I'm going to make the latent variable here discrete. You can do everything that I'm doing here with integrals. It'll feel kind of nice. I like writing those integral signs. It's in the notes that way."},{"start":4220.43,"text":"But it doesn't seem to confuse people on the fly. So I'm going to do it with sums. So just imagine the latent variable is discrete. Here, this phi is bundling all the parameters. So it really should be a semicolon here. It's all the parameters. Mus and sigmas, all the ones I forget. Phis, they're all bundled somewhere inside that data. So let's give a generic algorithm to maximize the likelihood for these latent variable models. And these latent variable models come up all over the place."},{"start":4246.73,"text":"Okay, because they're basically a way that you assume there's some structure. We assumed clustering. We assumed that they were Gaussian point sources. You now know a whole library of things you can assume about the model. They're all going to be solved the same way. Okay. All right. So let's get to the picture of EM. Ooh, more drawing for me. All right, let's do it. All right, so here's our function. This is going to be L of theta. Here's the general idea of how we're going to solve this thing."},{"start":4279.08,"text":"Okay? We are going to start with, I guess, theta zero. This is going to be L of theta zero. Okay. Now, what we're going to do is we're going to figure out some surrogate, which we'll talk about in one second, which is going to have a very nice property and is going to come about because of our use of Jensen's inequality, which we're going to call LT of theta. Okay? And this is going to be L zero of theta. Let's just call it L zero of theta."}],"speech_gaps":[],"frame":"../frames/v040/025.webp","frame_time":4147.47},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":449,"text":"Okay, now this function is a function of theta confusingly. So just make sure the notation is kind of written awfully. Let me write this a little bit less awfully. Well, it'll be debatable if it's less awful, but it will be written differently. Okay, so l theta, and the idea here is that it's going to have this curve, l theta, so it's a function of theta, and it lives, it's an underestimate of the green curve. Moreover, it meets the original function exactly at theta zero.","zh":"好的，现在这个函数是关于theta的，有点令人困惑。所以请确保记号写得有点糟糕。让我把它写得稍微好一点。好吧，这是否更不糟糕可能有争议，但它会被写成不同的形式。好的，所以是l theta，这里的思路是它将具有这条曲线，l theta，它是theta的函数，它位于绿色曲线的下方。此外，它在theta零处与原始函数完全吻合。","start":4313.65,"end":4342.86},{"id":450,"text":"Okay? So let me write those properties, and I'll give you a time to digest this. It's kind of a weird thing. Now, what's going to be nice about L theta, this character here, is that it's going to be easier to optimize. We're going to optimize it locally. Okay? And so it has this nice convex, concave, sorry, shape, because it's facing downward. And that's going to let us run a nice estimation procedure, and we're going to be able to find the top of it. And we're going to use that as our next guess. That's going to be theta 1. Okay? Okay.","zh":"好的？让我写下这些性质，然后给你一点时间消化一下。这是一件很奇怪的事情。现在，关于L theta，这个字符的好处是它将更容易优化。我们将对其进行局部优化。好的？因此，它具有这种良好的凸性或凹性，抱歉，形状，因为它向下开口。这将使我们能够运行一个良好的估计过程，并找到它的顶部。我们将使用它作为下一个猜测，即theta 1。好的？好的。","start":4343.45,"end":4372.48},{"id":451,"text":"So I'm going to come back to that as I write the property. So L of t of theta is going to always be less than L of theta, okay? It's a lower bound. And it's tight in the sense that L of t of theta of L of t equals L of theta t. Whoops. Sound good? That's just the picture, right? Now, when I optimize this character, I'm going to get a new theta 1.","zh":"在我写下这些性质时，我会回到这一点。所以L of t of theta将始终小于L of theta，好的？它是下界。并且它在意义上是紧的，即L of t of theta of L of t等于L of theta t。哎呀。听起来不错？这仅仅是图像，对吧？现在，当我优化这个字符时，我将得到一个新的theta 1。","start":4372.97,"end":4403.93},{"id":452,"text":"This is supposed to be the local max that I just drew. It's debatable, but I'm going to claim it is. Then what do I do with theta1? I do the same process again. I go back up here. I construct a new character, which I'll call l1. Maybe I'll draw it even. I'll use even a different color. Here. And then I optimize this character. And again and again I go. Okay? And these are the alternating steps that we're going to do. And our hope","zh":"这应该就是我刚刚画出的局部最大值。这可能有争议，但我声称它是。那么我该如何处理theta1？我再次进行同样的过程。我回到这里。我构造一个新的字符，我称之为l1。也许我会画出来。我会使用一种不同的颜色。在这里。然后我优化这个字符。然后一遍又一遍地重复。好的？这些就是我们将进行的交替步骤。我们的希望","start":4404.8,"end":4438.22},{"id":453,"text":"To be really clear, our hope, which right now is nothing more than hope, is that LT of theta is easier somehow to compute argmax. Compute argmax theta LT theta, which is going to be here theta t plus 1 unless I've messed up the notation badly, but you'll correct me. So far so good? Okay? Now, the E step is given theta t.","zh":"为了非常清楚，我们的希望，目前仅仅是希望，是LT of theta在某种程度上更容易计算argmax。计算argmax theta LT theta，这将在这里是theta t加1，除非我严重弄错了记号，但你会纠正我。到目前为止都还好吗？好的？现在，E步是在给定theta t的情况下进行的。","start":4438.69,"end":4479.97},{"id":454,"text":"That is, all the parameters, all the cluster sizes, the mus, the sigmas,","zh":"也就是说，所有参数，所有聚类大小，均值mu，方差sigma，","start":4481.48,"end":4486.56},{"id":455,"text":"it finds L of t theta, which seems like a weird way to think about it now,","zh":"它找到了L关于t theta的导数，现在看起来这是一种奇怪的方式来思考这个问题，","start":4487.68,"end":4491.92}],"notes":["本段讲解了在优化过程中使用下界函数L(theta)来近似原目标函数，该下界函数在theta零处与原函数相等，并且在其他点处始终小于等于原函数。这种构造使得优化过程更加容易，因为L(theta)具有凸性，可以使用局部优化方法找到最大值。","接下来，课程提到通过迭代优化L(theta)来更新参数theta，每次迭代生成新的下界函数L1(theta)，并重复这一过程。这种交替优化步骤是算法的核心，但目前仅作为希望存在，尚未证明其收敛性。","在E步中，给定当前参数theta_t，算法会计算L(theta_t)，这一步骤涉及所有参数，包括聚类大小、均值和协方差矩阵。虽然这看起来有些奇怪，但这是构造下界函数的一部分。","课程强调，这种下界函数的构造是为了简化优化过程，但其有效性依赖于是否能够准确地找到最大值。因此，虽然方法在理论上可行，但实际应用中仍需验证其收敛性和稳定性。","此外，课程提到在每次迭代中，参数theta会被更新为theta1，然后重复这一过程。这种迭代过程是算法的关键，但需要进一步的数学分析来证明其收敛性。","最后，课程指出，虽然当前的构造方法在理论上是可行的，但其有效性仍需进一步验证，特别是在实际应用中如何确保收敛性和稳定性。"],"formulas":[],"uncertainties":["L of t of theta of L of t equals L of theta t","LT of theta is easier somehow to compute argmax"],"diagram":"none","start":4313.65,"end":4491.92,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4313.65,"text":"Okay, now this function is a function of theta confusingly. So just make sure the notation is kind of written awfully. Let me write this a little bit less awfully. Well, it'll be debatable if it's less awful, but it will be written differently. Okay, so l theta, and the idea here is that it's going to have this curve, l theta, so it's a function of theta, and it lives, it's an underestimate of the green curve. Moreover, it meets the original function exactly at theta zero."},{"start":4343.45,"text":"Okay? So let me write those properties, and I'll give you a time to digest this. It's kind of a weird thing. Now, what's going to be nice about L theta, this character here, is that it's going to be easier to optimize. We're going to optimize it locally. Okay? And so it has this nice convex, concave, sorry, shape, because it's facing downward. And that's going to let us run a nice estimation procedure, and we're going to be able to find the top of it. And we're going to use that as our next guess. That's going to be theta 1. Okay? Okay."},{"start":4372.97,"text":"So I'm going to come back to that as I write the property. So L of t of theta is going to always be less than L of theta, okay? It's a lower bound. And it's tight in the sense that L of t of theta of L of t equals L of theta t. Whoops. Sound good? That's just the picture, right? Now, when I optimize this character, I'm going to get a new theta 1."},{"start":4404.8,"text":"This is supposed to be the local max that I just drew. It's debatable, but I'm going to claim it is. Then what do I do with theta1? I do the same process again. I go back up here. I construct a new character, which I'll call l1. Maybe I'll draw it even. I'll use even a different color. Here. And then I optimize this character. And again and again I go. Okay? And these are the alternating steps that we're going to do. And our hope"},{"start":4438.69,"text":"To be really clear, our hope, which right now is nothing more than hope, is that LT of theta is easier somehow to compute argmax. Compute argmax theta LT theta, which is going to be here theta t plus 1 unless I've messed up the notation badly, but you'll correct me. So far so good? Okay? Now, the E step is given theta t."},{"start":4481.48,"text":"That is, all the parameters, all the cluster sizes, the mus, the sigmas,"},{"start":4487.68,"text":"it finds L of t theta, which seems like a weird way to think about it now,"}],"speech_gaps":[],"frame":"../frames/v040/026.webp","frame_time":4325.65},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":456,"text":"but it's finding that curve, that likelihood curve, right?","zh":"但它是在寻找那条曲线，那条似然曲线，对吧？","start":4492.02,"end":4494.3},{"id":457,"text":"So L of theta, it's the likelihood that given those parameters are all there.","zh":"所以 L of theta，它是给定这些参数存在的条件下，似然值。","start":4494.44,"end":4498.0},{"id":458,"text":"And then the M step, what does it do?","zh":"然后 M 步骤，它会做什么？","start":4498.32,"end":4500.24},{"id":459,"text":"It then uses that L of t in the other direction, says given L of t,","zh":"它接着使用那个 L of t 在另一个方向上，说给定 L of t，","start":4500.8,"end":4503.92},{"id":460,"text":"it does this, finds theta t plus 1.","zh":"它会这样做，找到 theta t 加 1。","start":4505.52,"end":4508.28},{"id":461,"text":"And it alternates that and the picture goes up until it finds something. Now,","zh":"它交替进行这些步骤，图像会一直上升，直到找到某个结果。现在，","start":4508.28,"end":4515.38},{"id":462,"text":"there's some things you can trust about my picture and it will hopefully lead you things.","zh":"有一些你可以信任的东西在我的图像中，它应该会引导你得到一些东西。","start":4518.14,"end":4521.9},{"id":463,"text":"Do you think this algorithm finds a global minimum or global maximum? I guess we're","zh":"你们认为这个算法能找到全局最小值或全局最大值吗？我想我们","start":4523.12,"end":4529.12},{"id":464,"text":"doing maximum. No, most certainly not. This is hinted at here. Maybe this character goes way","zh":"在做最大化。不，肯定不是。这里已经暗示了。也许这个角色会飞得很远","start":4529.12,"end":4533.18},{"id":465,"text":"off into the sky, right? But also, you wouldn't expect it to because when we reduce it to that","zh":"飞到天空中去，对吧？但你也想不到它会这样，因为在我们将其简化为0, 1情况时，我们已经看到这是k-means的问题。因此，我们期望同样的事情也会在这里发生","start":4533.18,"end":4538.54},{"id":466,"text":"0, 1 case, we saw that was a problem for k-means. So we would expect the same thing should happen","zh":"0, 1 情况，我们看到这是 k-means 的一个问题。因此，我们预计同样的情况也应该会发生","start":4538.54,"end":4542.1},{"id":467,"text":"here. All right. Now, what we're going to see next time is we're going to come back to exactly","zh":"这个故事是……我不好意思把这堂课说得这么平淡。它将会","start":4542.1,"end":4551.22},{"id":468,"text":"this picture, hopefully drawn a little bit better. But here we are where we are. We're going to come","zh":"非常精彩。","start":4551.22,"end":4556.6},{"id":469,"text":"back to this on Wednesday, and we're going to start to see the entire derivation for how this","zh":"我们将在周三回到这个问题，并开始看到整个推导过程，说明该算法是如何在这个 EM 框架下工作的。这将告诉我们它究竟是如何收敛的","start":4556.6,"end":4560.24},{"id":470,"text":"algorithm works in terms of this EM framework. And that's going to tell us exactly how it converges.","zh":"并且这个故事是……我不好意思如此强烈地贬低这堂课。它将会是","start":4560.24,"end":4565.72},{"id":471,"text":"And the story is... I hate to undersell the lecture so dramatically. It's going to be","zh":"并且这个故事是……我不好意思如此强烈地贬低这堂课。它将会是","start":4565.78,"end":4570.96},{"id":472,"text":"hopefully totally transparent. You do the estimation, then you do what looks like a","zh":"希望完全透明。你进行估计，然后进行看起来像一点梯度下降或梯度规则的操作。","start":4570.96,"end":4576.04},{"id":473,"text":"little bit of a gradient descent or a gradient rule. You fix the parameters back and forth,","zh":"你来回调整参数，来回调整，你就得到了一个估计值。","start":4576.04,"end":4579.92},{"id":474,"text":"back and forth, and you have yourself an estimate. Thanks so much. I'll see you guys on Wednesday.","zh":"非常感谢。我周三再见到你们。","start":4579.92,"end":4584.0}],"notes":["本段讨论了最大似然函数 L(theta) 的定义，即在给定参数的情况下，数据的似然性。讲者指出，L(theta) 是在参数已知时，数据出现的概率。这为后续的 M 步骤提供了基础，即在 E 步骤中计算出的后验概率用于更新参数。","讲者提到 M 步骤的作用是利用 L(theta) 来找到新的参数估计 theta_{t+1}，并指出算法通过交替进行 E 步骤和 M 步骤来逐步优化参数。这种交替过程会持续进行，直到算法收敛。","讲者强调了该算法不会找到全局最小值或最大值，而是可能陷入局部最优。这一点在 K-Means 中已经观察到，因此在混合高斯模型中也应存在类似问题。","讲者提到下一次课程将回到这个图像，并详细推导该算法在 EM 框架下的工作原理，这将解释算法如何收敛。这表明课程将深入探讨 EM 算法的数学基础。","讲者最后提到，虽然课程内容可能看起来有些抽象，但希望讲解能够清晰透明，通过估计和梯度下降等步骤，逐步得到参数估计。","讲者以感谢结束，并预告下一次课程的时间，表明课程安排有计划性，且内容逐步推进。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4492.02,"end":4584.0,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":4492.02,"text":"but it's finding that curve, that likelihood curve, right?"},{"start":4494.44,"text":"So L of t theta, it's the likelihood that given those parameters are all there."},{"start":4498.32,"text":"And then the M step, what does it do?"},{"start":4500.8,"text":"It then uses that L of t in the other direction, says given L of t,"},{"start":4505.52,"text":"it does this, finds theta t plus 1."},{"start":4508.28,"text":"And it alternates that and the picture goes up until it finds something. Now,"},{"start":4518.14,"text":"there's some things you can trust about my picture and it will hopefully lead you things."},{"start":4523.12,"text":"Do you think this algorithm finds a global minimum or global maximum? I guess we're"},{"start":4529.12,"text":"doing maximum. No, most certainly not. This is hinted at here. Maybe this character goes way"},{"start":4533.18,"text":"off into the sky, right? But also, you wouldn't expect it to because when we reduce it to that"},{"start":4538.54,"text":"0, 1 case, we saw that was a problem for k-means. So we would expect the same thing should happen"},{"start":4542.1,"text":"here. All right. Now, what we're going to see next time is we're going to come back to exactly"},{"start":4551.22,"text":"this picture, hopefully drawn a little bit better. But here we are where we are. We're going to come"},{"start":4556.6,"text":"back to this on Wednesday, and we're going to start to see the entire derivation for how this"},{"start":4560.24,"text":"algorithm works in terms of this EM framework. And that's going to tell us exactly how it converges."},{"start":4565.78,"text":"And the story is... I hate to undersell the lecture so dramatically. It's going to be"},{"start":4570.96,"text":"hopefully totally transparent. You do the estimation, then you do what looks like a"},{"start":4576.04,"text":"little bit of a gradient descent or a gradient rule. You fix the parameters back and forth,"},{"start":4579.92,"text":"back and forth, and you have yourself an estimate. Thanks so much. I'll see you guys on Wednesday."}],"speech_gaps":[],"frame":"../frames/v040/027.webp","frame_time":4504.02}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v040.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
