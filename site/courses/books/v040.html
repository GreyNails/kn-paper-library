</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】K-Means 与混合高斯模型（非 EM） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v040.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v040","title":"【斯坦福CS229】K-Means 与混合高斯模型（非 EM）","course":"机器学习","pages":[{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":0,"text":"Hello. Welcome to 2.29. This is Lecture 9. We're going to talk about a couple of unsupervised algorithms.","zh":"你好。欢迎来到2.29。这是第9讲。我们将讨论几种无监督算法。","start":5.17,"end":12.65},{"id":1,"text":"Most of the focus for this week is going to be about algorithms where we don't actually have any labels, but we still want to do a bunch of machine learning. As we talked about before, this direction of using weaker labels or unlabeled data and understanding structure has uncorked a whole bunch of applications in machine learning over time. We're going to see two of the most common unsupervised algorithms, or popular, which are very closely related, which are k-means and the Gaussian mixture model. These are just kind of the canonical set. That's why","zh":"本周的重点将放在那些我们实际上没有任何标签，但仍想进行大量机器学习的算法上。正如我们之前讨论的，这种使用较弱标签或未标记数据并理解结构的方法，随着时间的推移，已经在机器学习领域催生了许多应用。我们将看到两种最常见的无监督算法，或者说是流行算法，它们非常密切相关，分别是k-means和高斯混合模型。这些只是典型的集合，这就是我们为什么要讲它们的原因。","start":13.92,"end":43.14},{"id":2,"text":"that we're going to go over them. Now, hopefully, as we go through these two, we're going to learn this idea of expectation maximization, this EM algorithm. I will tell you EM in general is kind of an algorithm you run not as a last resort, but you run it typically because you have only a very weak knowledge of the structure. Often, and for some of these problems, you can find another method to solve them if you know more about it or are willing to make stronger assumptions.","zh":"希望在我们讨论这两种算法的过程中，我们能够学习到期望最大化（EM）算法这一概念。一般来说，EM算法并不是作为最后的选择来运行的，而是通常在我们对结构仅有非常弱的理解时运行。很多时候，对于某些问题，如果你对它有更多的了解或愿意做出更强的假设，你就可以找到另一种方法来解决它们。","start":43.21,"end":68.71},{"id":3,"text":"We're going to see it because it's like a classical algorithm. One of my graduate students was just writing for his submission next week. He's going to write what's called an ELBO. If you don't know what an ELBO is, you'll learn soon for his particular diffusion style estimator. Now, we're going to talk about k-means and its probabilistic analog, GMM. K-means is going to be hopefully intuitive to think about. It's going to be out-hawked, though, in the way we think about it. Then we'll see Gaussian mixture models, which are a softer version of this clustering.","zh":"我们将看到它，因为它是一种经典的算法。我的一位研究生下周要提交他的论文，他将写一个称为ELBO的内容。如果你不知道什么是ELBO，你很快就会在他在特定扩散风格估计器中的论文中学习到。现在，我们将讨论k-means及其概率类比，即高斯混合模型（GMM）。k-means将希望直观地进行思考，但在我们思考它的方式上，它可能会被超越。然后我们将看到高斯混合模型，它是一种更柔和的聚类版本。","start":69.62,"end":97.06},{"id":4,"text":"And those are going to be kind of the duality. Now, the techniques and ideas here are pretty useful on their own. As I mentioned to you, unsupervised algorithms have had a renaissance over the last 10 years. But more than anything, the reason pedagogically I like this section and the section that we're going into is it forces you to wrestle with some pretty basic questions in machine learning.","zh":"这些将大致构成一种对偶关系。这些技术和思想本身就有很大的用处。正如我之前告诉你们的，无监督算法在过去十年中经历了一次复兴。但更重要的是，从教学的角度来看，我之所以喜欢这一部分以及我们即将进入的部分，是因为它迫使你面对机器学习中一些相当基本的问题。","start":97.47,"end":117.57},{"id":5,"text":"What are we modeling? How are we putting structure into our models? What are we pulling out of it? And so we'll get a taste of that. And that's really the pedagogical goal. Like the algorithms, you could just look up in five minutes. But why we think about these algorithms, why we pick them, that's what I want you thinking about during this lecture and next. All right. So here is kind of the picture that should go in your head. Very, very basic kind of picture. Let me get this guy going. So you have some axis.","zh":"我们是在建模什么？我们是如何在模型中引入结构的？我们是从中提取出什么？我们将对此有所体会。这正是教学目标。比如这些算法，你可以在五分钟内查阅到。但为什么我们要思考这些算法，为什么我们要选择它们，这就是我希望你们在这节课和下一节课中思考的问题。好的。那么，这里有一个应该在你脑海中形成的图景。非常、非常基础的图景。让我开始演示。你有一些坐标轴。","start":118.33,"end":148.5},{"id":6,"text":"In supervised learning, how did it work? Well, we had some points here, and then maybe we had some positive points there, and then maybe we had some negative characters over here, and our goal was draw some line that separated them. So this is the supervised world is what I'm talking about. And here we had these labels, the positive and the negative were our labels. Now in the unsupervised,","zh":"在监督学习中，它是如何工作的？我们有一些点在这里，然后可能有一些正样本在那里，然后可能有一些负样本在这里，我们的目标是画出一条能够将它们分开的线。这就是我所说的监督学习的世界。在这里，我们有这些标签，正样本和负样本就是我们的标签。现在在无监督学习中，","start":149.55,"end":180.94}],"notes":["本段介绍了本节课的主要内容，即讨论无监督学习中的两个常见算法：K-Means 和混合高斯模型（GMM）。课程强调了这些算法与期望最大化（EM）算法的关系，并指出EM算法通常用于结构知识较弱的情况。此外，还提到学生将学习ELBO（证据下界）的概念，这在扩散模型中尤为重要。","课程提到K-Means算法虽然直观，但在某些情况下可能不如其他方法有效，而GMM则提供了一种更柔和的聚类方式。这些算法的对比和联系是本段的重点。","本段还强调了无监督学习的重要性，特别是在过去十年中，无监督算法经历了复兴。课程的目标是让学生思考如何建模、如何在模型中引入结构以及如何从数据中提取信息。","课程指出，虽然这些算法可以快速查找，但理解为什么选择这些算法以及它们的适用性才是学习的重点。这有助于学生深入理解算法背后的原理。","在讲解过程中，教师通过对比监督学习和无监督学习的差异，帮助学生建立对两种学习范式的理解。监督学习中使用标签进行分类，而无监督学习则没有标签，需要从数据中发现结构。","最后，教师提到将通过一个简单的图示来帮助学生理解这些概念，这有助于学生形成直观的认识。"],"formulas":[],"uncertainties":["out-hawked"],"diagram":"none","start":5.17,"end":180.94,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.17,"text":"Hello. Welcome to 2.29. This is Lecture 9. We're going to talk about a couple of unsupervised algorithms."},{"start":13.92,"text":"Most of the focus for this week is going to be about algorithms where we don't actually have any labels, but we still want to do a bunch of machine learning. As we talked about before, this direction of using weaker labels or unlabeled data and understanding structure has uncorked a whole bunch of applications in machine learning over time. We're going to see two of the most common unsupervised algorithms, or popular, which are very closely related, which are k-means and the Gaussian mixture model. These are just kind of the canonical set. That's why"},{"start":43.21,"text":"that we're going to go over them. Now, hopefully, as we go through these two, we're going to learn this idea of expectation maximization, this EM algorithm. I will tell you EM in general is kind of an algorithm you run not as a last resort, but you run it typically because you have only a very weak knowledge of the structure. Often, and for some of these problems, you can find another method to solve them if you know more about it or are willing to make stronger assumptions."},{"start":69.62,"text":"We're going to see it because it's like a classical algorithm. One of my graduate students was just writing for his submission next week. He's going to write what's called an ELBO. If you don't know what an ELBO is, you'll learn soon for his particular diffusion style estimator. Now, we're going to talk about k-means and its probabilistic analog, GMM. K-means is going to be hopefully intuitive to think about. It's going to be out-hawked, though, in the way we think about it. Then we'll see Gaussian mixture models, which are a softer version of this clustering."},{"start":97.47,"text":"And those are going to be kind of the duality. Now, the techniques and ideas here are pretty useful on their own. As I mentioned to you, unsupervised algorithms have had a renaissance over the last 10 years. But more than anything, the reason pedagogically I like this section and the section that we're going into is it forces you to wrestle with some pretty basic questions in machine learning."},{"start":118.33,"text":"What are we modeling? How are we putting structure into our models? What are we pulling out of it? And so we'll get a taste of that. And that's really the pedagogical goal. Like the algorithms, you could just look up in five minutes. But why we think about these algorithms, why we pick them, that's what I want you thinking about during this lecture and next. All right. So here is kind of the picture that should go in your head. Very, very basic kind of picture. Let me get this guy going. So you have some axis."},{"start":149.55,"text":"In supervised learning, how did it work? Well, we had some points here, and then maybe we had some positive points there, and then maybe we had some negative characters over here, and our goal was draw some line that separated them. So this is the supervised world is what I'm talking about. And here we had these labels, the positive and the negative were our labels. Now in the unsupervised,"}],"speech_gaps":[],"frame":"../frames/v040/001.webp","frame_time":17.17},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":7,"text":"we're going to get rid of the labels. Here's the same dataset, roughly speaking. I should have drawn them to be isomorphic, just me being a terrible drawer. There'll be a lot of drawing in this lecture because I used to give this on the whiteboard and I like doing it. I'm not sure that it's super effective, so we'll see. I don't know. This is unsupervised. There are no labels.","zh":"我们将去掉标签。这是大致相同的 dataset，我本应该画得是同构的，只是我画得不好。这堂课会有很多绘图，因为我以前是在白板上讲这个内容的，我喜欢这样做。我不确定这是否非常有效，我们看看吧。我不知道。这是无监督学习。没有标签。","start":185.25,"end":204.88},{"id":8,"text":"That bit of structure, that label, the fact that we had pluses and minuses here, let us actually give a pretty strong characterization of what we were after, right? We wanted something that would exactly separate the sets. There was kind of one canonical version of what we were after. In this unsupervised regime,","zh":"那部分结构，那个标签，我们在这里有正负号的事实，实际上让我们能够对我们的目标有一个相当强的描述，对吧？我们想要的是能够精确分割集合的东西。这里有一种我们想要的东西的某种标准版本。在这个无监督学习的框架下，","start":210.91,"end":227.33},{"id":9,"text":"It's not clear what a model means. We talked about a little bit in GDA where we remember in GDA, you had two different labels and you tried to learn a model of the labels. Here somehow we want to learn a model that describes the dataset, the clusters that are inside it, some qualitative structure of it that could help us classify. The point that I'm making is that's a pretty unstructured problem, and so we're going to have to make","zh":"不清楚模型意味着什么。我们在 GDA 中讨论过一些，我们在 GDA 中记得，你有两类标签，你试图学习一个标签的模型。在这里，我们却想要学习一个描述 dataset 的模型，它内部的聚类，它的一些定性结构，这可以帮助我们进行分类。我想表达的是，这是一个相当无结构的问题，因此我们必须做出","start":228.2,"end":251.38},{"id":10,"text":"accept weaker guarantees. We're not going to be able to say things about the perfect line that does it. So we're going to have to think a lot about modeling. And we're going to have to make potentially stronger assumptions to say, oh, our data is generated by this process. And so we could potentially recover it if we saw it in some way. And the assumptions we have to make there are just intuitively going to be a lot stronger.","zh":"接受较弱的保证。我们无法谈论那个完美的线，它能够做到这一点。因此我们必须在建模上花很多心思。我们可能需要做出更强的假设，比如说，我们的数据是由这个过程生成的。因此如果我们以某种方式看到它，我们有可能恢复它。我们必须做出的假设只是直观上会更强。","start":252.43,"end":274.44},{"id":11,"text":"The unsupervised learning here is going to be harder than the supervised, and so we'll make stronger assumptions and accept weaker guarantees. All right. So far, so good. All right. Please.","zh":"这里的无监督学习将比有监督学习更难，因此我们将做出更强的假设并接受较弱的保证。好的。到目前为止，一切顺利。好的。请。","start":276.5,"end":286.18},{"id":12,"text":"It's possible that some of the things, in fact, the algorithm that we're going to point to today, actually finding the optimum will be harder. I meant in a more qualitative sense. So harder in the fact that actually getting the optimum for k-means will be NP-hard. And so in a formal sense, it is actually more challenging computationally. It doesn't mean that every instance of how we solve it is going to take more time.","zh":"有可能某些事情，事实上，我们今天要指出的算法，实际上找到最优解会更难。我指的是在更定性的意义上。因此更难的是实际上得到 k-means 的最优解是 NP 难的。因此从形式上讲，它在计算上实际上更具挑战性。这并不意味着我们解决每一个实例所需的时间都会更长。","start":289.28,"end":309.72},{"id":13,"text":"That's not the case. But intuitively, it will be more challenging. That's what I want to get across to you. Because we've dropped some assumptions. We've dropped some very important structure. We don't know the positive and the negative class. We don't know the class labels. Good question. Awesome. Are there others?","zh":"情况并非如此。但直观上，这会更具挑战性。这就是我想传达给你们的。因为我们已经放弃了一些假设。我们已经放弃了一些非常重要的结构。我们不知道正类和负类。我们不知道类别标签。好问题。太棒了。还有其他人吗？","start":310.03,"end":327.41},{"id":14,"text":"All right. Now, by the way, I should also say, if you really miss my hand drawings, a better version of them should be online in the notes so you can actually see what I'm intending to draw. And then you can laugh about what's in the notes and then what shows up when I scribble it here. So what we're going to do today, we are going to talk about the k-means algorithm, which will be hopefully intuitive. It should be, if I do my job right, you'll kind of understand how it works. It may feel a little ad hoc. It may feel a little bit heuristic, but we'll see. We'll talk about a probabilistic method for the Gaussian","zh":"好了。顺便说一句，如果你们真的想念我的手绘图，那么这些图的一个更好版本应该已经在笔记中在线提供，这样你们就可以实际看到我打算画什么。然后你们可以嘲笑笔记中的内容，以及我在这里潦草画出的内容。今天我们要讨论的是k-means算法，希望它会直观易懂。如果我做得好，你们应该会大致理解它是如何工作的。它可能会感觉有点随意。它可能会感觉有点启发式，但我们会看到。我们会讨论一种用于高斯分布的概率方法","start":328.27,"end":357.73}],"notes":["本段讨论了无监督学习与监督学习之间的区别，指出无监督学习的问题更加复杂，因为没有标签，因此需要做出更强的假设并接受较弱的保证。讲者提到，K-Means 算法在寻找最优解时是 NP 难的，这意味着在计算上更具挑战性，但并不意味着每个实例的求解时间都会增加。","讲者强调了在无监督学习中，我们无法像监督学习那样明确地定义正负类，因此需要通过其他方式来建模数据的结构。这导致了对数据生成过程的假设必须更加直观和强烈，以便能够从数据中恢复出这些结构。","讲者提到 K-Means 算法的优化过程是 NP 难的，这表明在理论上，找到最优解是计算上困难的。然而，这并不意味着所有实例的求解时间都会增加，只是在形式上更具挑战性。","讲者指出，由于我们失去了监督学习中的结构，因此需要接受更弱的保证。这意味着我们无法保证找到完美的分割线，而是需要在建模过程中做出更强的假设。","讲者提到，K-Means 算法可能看起来有些随意或启发式，但会通过概率方法（如混合高斯模型）来提供更直观的理解。","讲者最后提到，如果学生对他的手绘图感兴趣，可以查看课程笔记中的更清晰版本，以便更好地理解他所讲的内容。"],"formulas":[],"uncertainties":[],"diagram":"none","start":185.25,"end":357.73,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":185.25,"text":"we're going to get rid of the labels. Here's the same dataset, roughly speaking. I should have drawn them to be isomorphic, just me being a terrible drawer. There'll be a lot of drawing in this lecture because I used to give this on the whiteboard and I like doing it. I'm not sure that it's super effective, so we'll see. I don't know. This is unsupervised. There are no labels."},{"start":210.91,"text":"That bit of structure, that label, the fact that we had pluses and minuses here, let us actually give a pretty strong characterization of what we were after, right? We wanted something that would exactly separate the sets. There was kind of one canonical version of what we were after. In this unsupervised regime,"},{"start":228.2,"text":"It's not clear what a model means. We talked about a little bit in GDA where we remember in GDA, you had two different labels and you tried to learn a model of the labels. Here somehow we want to learn a model that describes the dataset, the clusters that are inside it, some qualitative structure of it that could help us classify. The point that I'm making is that's a pretty unstructured problem, and so we're going to have to make"},{"start":252.43,"text":"accept weaker guarantees. We're not going to be able to say things about the perfect line that does it. So we're going to have to think a lot about modeling. And we're going to have to make potentially stronger assumptions to say, oh, our data is generated by this process. And so we could potentially recover it if we saw it in some way. And the assumptions we have to make there are just intuitively going to be a lot stronger."},{"start":276.5,"text":"The unsupervised learning here is going to be harder than the supervised, and so we'll make stronger assumptions and accept weaker guarantees. All right. So far, so good. All right. Please."},{"start":289.28,"text":"Yeah, so it's possible that some of the things, in fact, the algorithm that we're going to point to today, actually finding the optimum will be harder. I meant in a more qualitative sense. So harder in the fact that actually getting the optimum for k-means will be NP-hard. And so in a formal sense, it is actually more challenging computationally. It doesn't mean that every instance of how we solve it is going to take more time."},{"start":310.03,"text":"That's not the case. But intuitively, it will be more challenging. That's what I want to get across to you. Because we've dropped some assumptions. We've dropped some very important structure. We don't know the positive and the negative class. We don't know the class labels. Good question. Awesome. Are there others?"},{"start":328.27,"text":"All right. Now, by the way, I should also say, if you really miss my hand drawings, a better version of them should be online in the notes so you can actually see what I'm intending to draw. And then you can laugh about what's in the notes and then what shows up when I scribble it here. So what we're going to do today, we are going to talk about the k-means algorithm, which will be hopefully intuitive. It should be, if I do my job right, you'll kind of understand how it works. It may feel a little ad hoc. It may feel a little bit heuristic, but we'll see. We'll talk about a probabilistic method for the Gaussian"}],"speech_gaps":[],"frame":"../frames/v040/002.webp","frame_time":197.25},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":15,"text":"and mixture models, which we talked about will be this nice relaxation. And then I probably, if we have time, will talk about Jensen's inequality in pictures. By show of hands, who knows Jensen's inequality? OK, about half. All right, fantastic. You'll see it in pictures in a nice, hopefully simple way that it will click in your head. The reason those pictures are important is that turns out to be the core of this algorithm, EM, that we're going to see in the last half of the lecture and into the next lecture. That's our structure.","zh":"以及混合模型，我们之前谈到的将是一个很好的放松。然后，如果时间允许，我会用图像来讲解詹森不等式。举手示意，谁知道詹森不等式？好的，大约有一半的人知道。很好，太棒了。你们将看到图像中以一种希望是简单的方式展示詹森不等式，这会让你们在脑海中产生顿悟。这些图像之所以重要，是因为它们实际上是这个算法，即EM算法的核心，我们将在本讲座的后半部分以及下一次讲座中看到。这就是我们的结构。","start":357.87,"end":385.55},{"id":16,"text":"Okay, so let's get to k-means. All right, so in k-means, we're going to have this k equals 2. So what are we given in this setup? So here we have some data. So this is what we're given. There's our data. And just as we talked about before, there are some points. And I've drawn the points here.","zh":"好的，那么我们开始讲k-means。好的，所以在k-means中，我们将有k等于2。那么在这个设置中，我们被给予什么？这里我们有一些数据。这就是我们被给予的。这就是我们的数据。正如我们之前讨论的那样，有一些点。我在这里画出了这些点。","start":386.26,"end":408.31},{"id":17,"text":"Now, what the k equals two is talking for, that's what this k is, says that I want two clusters. So you could ask, why two clusters? Why not four clusters? That'll turn out to be a modeling parameter. For now, just imagine that two is the thing that we're after. What we want to do somehow is, and I would say the best two clusters, and we'll talk about what best means in a second. Maybe these characters are a nice cluster, and these characters over here are a nice cluster.","zh":"现在，k等于2意味着什么，这就是k的含义，表示我想将数据分成两个簇。你可以问，为什么是两个簇？为什么不是四个簇？这将被证明是一个建模参数。目前，只需想象我们想要的是两个簇。我们想要做的是，也许这些字符是一个很好的簇，而这些字符在这里也是一个很好的簇。","start":409.16,"end":438.34},{"id":18,"text":"Now, you can think about what that means, that these points are a nice cluster. One way to do it, one thing that we want to do it is, we're going to be given these integer k and these points. This is x1, for example. This is say x1, this is x2.","zh":"现在，你可以思考一下，这些点形成一个好簇意味着什么。一种方法是，我们想要做的是，我们被给予这些整数k和这些点。例如，这是x1，这是x1，这是x2。","start":440.28,"end":458.88},{"id":19,"text":"And we're going to assign each of them mathematically to one of the k clusters. So that's what this ci equals j is going to mean. It says point i goes to cluster j. So all these points here are going to cluster 1, and all these points here are going to cluster 2. So that's what we are given in the do. We're given the points without any labels, and our job is to come up with this assignment, which I've drawn and scribbled with my blue and my pinkish orangish color on there.","zh":"然后，我们将数学上地将它们分配到其中一个k簇中。这就是ci等于j的含义。它表示点i被分配到簇j。因此，这些点将被分配到簇1，而这些点将被分配到簇2。这就是我们在do中被给予的内容。我们被给予没有标签的数据点，我们的任务是提出这种分配，我在这里用蓝色和粉橙色画了出来。","start":459.75,"end":483.45},{"id":20,"text":"But really, mathematically, it's going to do here. And I don't actually know. So I'll make C2 should be over here. So I'm going to change the label. I'll make this guy C4 to align with this. And I'll move X2 over here to align with this. Clear enough with the mapping mates? OK, cool.","zh":"但说实话，从数学上讲，它会在这里进行。而我实际上并不确定。所以我将把C2移到这里。我将更改标签，让这个家伙成为C4，以与这个对齐。我将把X2移到这里，以与这个对齐。这样映射清楚了吗，伙计们？好的，酷。","start":484.2,"end":504.03},{"id":21,"text":"All right, so how do we find these clusters? We're going to give one particular algorithm to do it, and it's going to be an iterative algorithm, as you've seen many times in the course. So how do we do this? All right, so this will be a little painful without copy-paste, but we'll make do with it. So we have these three points, and what we do is we initialize randomly some center mu1 and some center mu2.","zh":"好的，那么我们如何找到这些聚类？我们将提供一个特定的算法来实现，它将是一个迭代算法，正如你在本课程中见过的许多次一样。那么我们如何做到这一点？好的，这在没有复制粘贴的情况下会有点痛苦，但我们将会应付过来。我们有这三个点，我们所做的就是随机初始化一些中心mu1和一些中心mu2。","start":505.58,"end":534.15}],"notes":["本段介绍了课程的结构，包括K-Means算法和混合高斯模型，以及Jensen不等式的重要性。Jensen不等式是EM算法的核心，将在后续课程中详细讲解。","接下来的段落讨论了K-Means算法的基本概念，即给定数据点，通过随机初始化中心点来划分成k个簇。这里k被设定为2，但k的值可以是其他数值，作为建模参数。","在K-Means中，目标是将数据点分配到不同的簇中，这里的“最佳”簇需要后续定义。教师通过举例说明了如何将数据点分配到不同的簇中。","教师提到，每个数据点会被分配到一个簇中，用ci = j表示，其中i是数据点，j是簇。教师还提到，数据点没有标签，需要通过算法来分配。","在讲解过程中，教师通过改变标签和移动数据点来演示如何进行分配，并询问学生是否理解这种映射关系。","最后，教师提到K-Means算法是一个迭代算法，将通过初始化随机中心点来开始算法过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":357.87,"end":534.15,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":357.87,"text":"and mixture models, which we talked about will be this nice relaxation. And then I probably, if we have time, will talk about Jensen's inequality in pictures. By show of hands, who knows Jensen's inequality? OK, about half. All right, fantastic. You'll see it in pictures in a nice, hopefully simple way that it will click in your head. The reason those pictures are important is that turns out to be the core of this algorithm, EM, that we're going to see in the last half of the lecture and into the next lecture. That's our structure."},{"start":386.26,"text":"Okay, so let's get to k-means. All right, so in k-means, we're going to have this k equals 2. So what are we given in this setup? So here we have some data. So this is what we're given. There's our data. And just as we talked about before, there are some points. And I've drawn the points here."},{"start":409.16,"text":"Now, what the k equals two is talking for, that's what this k is, says that I want two clusters. So you could ask, why two clusters? Why not four clusters? That'll turn out to be a modeling parameter. For now, just imagine that two is the thing that we're after. What we want to do somehow is, and I would say the best two clusters, and we'll talk about what best means in a second. Maybe these characters are a nice cluster, and these characters over here are a nice cluster."},{"start":440.28,"text":"Now, you can think about what that means, that these points are a nice cluster. One way to do it, one thing that we want to do it is, we're going to be given these integer k and these points. This is x1, for example. This is say x1, this is x2."},{"start":459.75,"text":"And we're going to assign each of them mathematically to one of the k clusters. So that's what this ci equals j is going to mean. It says point i goes to cluster j. So all these points here are going to cluster 1, and all these points here are going to cluster 2. So that's what we are given in the do. We're given the points without any labels, and our job is to come up with this assignment, which I've drawn and scribbled with my blue and my pinkish orangish color on there."},{"start":484.2,"text":"But really, mathematically, it's going to do here. And I don't actually know. So I'll make C2 should be over here. So I'm going to change the label. I'll make this guy C4 to align with this. And I'll move X2 over here to align with this. Clear enough with the mapping mates? OK, cool."},{"start":505.58,"text":"All right, so how do we find these clusters? We're going to give one particular algorithm to do it, and it's going to be an iterative algorithm, as you've seen many times in the course. So how do we do this? All right, so this will be a little painful without copy-paste, but we'll make do with it. So we have these three points, and what we do is we initialize randomly some center mu1 and some center mu2."}],"speech_gaps":[],"frame":"../frames/v040/003.webp","frame_time":369.87},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":22,"text":"Now, when I said that we're going to get out this assignment, I just introduced this new notion, which are these cluster centers. They're going to be points in the space, and the idea is that for every point that I'm going to say is in cluster 1, if it's closer to mu1, then it's closer to mu2. And I'm going to try and move these points.","zh":"现在，当我提到我们要完成这个任务时，我刚刚引入了一个新的概念，即这些聚类中心。它们是空间中的点，想法是，对于每一个我所说的属于聚类1的点，如果它更接近mu1，那么它就更接近mu2。我要尝试移动这些点。","start":535.62,"end":553.66},{"id":23,"text":"so that they're at the cluster center. And so the means here refers to the mean of their cluster. So if I were to give you all the points in the cluster, say this point here, you'd expect the mean is right there. That's where mu2 should end up. And the mean of this cluster, mu1, should end up right in their middle. Intuitively clear what we're after? That's the object that we're going to solve for. That's how we're going to get to the clustering. So far so good? Okay. So now what I've just described,","zh":"使得它们位于聚类中心。因此这里的均值指的是它们聚类的均值。如果我给你这个聚类中的所有点，比如说这个点，你期望的均值就在那里。那就是mu2应该最终所在的位置。而这个聚类的均值mu1应该最终位于它们的中间。我们想要的是什么，直观上清楚吗？这就是我们要解决的目标。这就是我们如何得到聚类的方法。到目前为止，没问题吧？好的。现在我刚刚描述的，","start":554.67,"end":583.94},{"id":24,"text":"I'm going to try copy paste again because I'm a glutton for punishment. It should work. It worked earlier. Let's try it. Copy. Oh, so tempting. No, does not work. All right. Awesome. Okay. We will then put all these up here and I will draw it one more illustrative time to do this. I don't know why it doesn't work in this mode now. All right. So how does this work? So I'm going to take those points. Here's my very critically drawn thing.","zh":"我要再次复制粘贴，因为我喜欢受苦。它应该能工作。它之前是有效的。让我们试一下。复制。哦，真诱人。不，这不起作用。好的。太棒了。好的。我们之后会把这些都放在这里，我会再画一次示意图来完成这个过程。我不知道为什么现在这个模式不起作用。好的。那么它是如何工作的？我要取这些点。这是我的非常关键地绘制的图。","start":584.49,"end":612.08},{"id":25,"text":"I'm going to have my current guess of the mui. So here, I probably switched colors. I apologize if I did that. Shouldn't really matter. But I'm not going to be consistent about that, I guess. Here's my points. The first thing I do is I compute. This is the line I set out on. For every point, I figure out which one is closer to. So this point is closer to mu1 than it's closer to mu2. So this is going to be a mu1. So let me color that character blue.","zh":"我要有当前对mui的猜测。在这里，我可能换了颜色。如果我这样做，请原谅。其实这并不重要。但我想不一致地这么做。这里是我的点。我首先要做的是计算。这是我要开始的步骤。对于每一个点，我确定它更接近哪一个。这个点比它更接近mu2更接近mu1。因此，这个点将属于mu1。让我把这个字符涂成蓝色。","start":613.86,"end":641.24},{"id":26,"text":"Okay, this point looks to me to be closer to mu1 than mu2, just barely. This one, I don't know, kind of seems a little closer to mu2. Clear what I'm doing? I'm comparing this distance and this distance. All right, now in this way, I go through and I start to compare all of them. Maybe I'll make this character closer to mu1, right? Okay, so this is me implementing this line right here.","zh":"好的，这个点看起来对我来说比mu2更接近mu1，只是略微一点。这个点，我不确定，似乎有点更接近mu2。清楚我在做什么吗？我是在比较这两个距离。好的，以这种方式，我遍历所有点并开始比较它们。也许我会让这个字符更接近mu1，对吧？好的，这就是我实现这一步骤的方式。","start":644.29,"end":674.33},{"id":27,"text":"When I say closer, I'm looking at the distance. You could say, does it matter that it's squared? Not really, but I'll use the square later in a convenience because it's just a minimum, right? Just saying which points am I closer to. Don't let the square bother you. Euclidean distance. Cool. All right. Now, when I do this, I have to do the second point. I have to compute new cluster center. So what's my algorithm going to be? I start with guesses. And hopefully, as we said, mu1 is going to migrate down here and mu2 is going to go up there.","zh":"当我提到更近的时候，我是在看距离。你可以问，为什么用平方？其实并不重要，但我会在后面用平方来简化计算，因为只是找最小值而已，对吧？只是说明我更接近哪一个点。不要被平方困扰。这就是欧几里得距离。很好。那么，当我这样做时，我必须处理第二个点。我必须计算新的聚类中心。那么我的算法会是什么样的呢？我从初始猜测开始。希望如我们所说，mu1会迁移到这里，而mu2会移动到那里。","start":674.83,"end":705.32}],"notes":["本段介绍了K-Means算法的基本思想，即通过计算每个数据点到各个聚类中心的距离，将数据点分配到最近的聚类中心，并通过迭代更新聚类中心的位置来优化聚类效果。讲者提到，聚类中心是空间中的点，每个数据点被分配到离它最近的聚类中心，而聚类中心的位置会根据数据点的分布进行调整。","讲者强调了聚类中心的计算方式，即每个聚类中心是其所属数据点的均值。例如，如果给定一个聚类中的所有数据点，聚类中心应该位于这些点的中间位置。这为后续的算法实现提供了直观的理解。","讲者提到在实现过程中可能会遇到一些技术问题，例如复制粘贴操作失败，但表示会重新绘制示意图以帮助理解。这表明在实际操作中可能会遇到一些挑战，但通过反复尝试可以解决。","讲者详细描述了算法的执行步骤，包括计算每个数据点到各个聚类中心的距离，并根据距离将数据点分配到最近的聚类中心。同时，讲者提到在比较距离时，虽然使用了平方距离，但并不影响最终的聚类结果，因为只需要确定最近的聚类中心。","讲者进一步说明了算法的迭代过程，即在每次迭代中，首先根据当前的聚类中心分配数据点，然后重新计算聚类中心的位置。这一过程会不断重复，直到聚类中心不再显著变化为止。","讲者提到在算法实现中，聚类中心的更新是基于所有分配到该聚类的数据点的均值。这表明算法的核心思想是通过不断优化聚类中心的位置来最小化聚类误差，从而达到最佳的聚类效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":535.62,"end":705.32,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":535.62,"text":"Now, when I said that we're going to get out this assignment, I just introduced this new notion, which are these cluster centers. They're going to be points in the space, and the idea is that for every point that I'm going to say is in cluster 1, if it's closer to mu1, then it's closer to mu2. And I'm going to try and move these points."},{"start":554.67,"text":"so that they're at the cluster center. And so the means here refers to the mean of their cluster. So if I were to give you all the points in the cluster, say this point here, you'd expect the mean is right there. That's where mu2 should end up. And the mean of this cluster, mu1, should end up right in their middle. Intuitively clear what we're after? That's the object that we're going to solve for. That's how we're going to get to the clustering. So far so good? Okay. So now what I've just described,"},{"start":584.49,"text":"I'm going to try copy paste again because I'm a glutton for punishment. It should work. It worked earlier. Let's try it. Copy. Oh, so tempting. No, does not work. All right. Awesome. Okay. We will then put all these up here and I will draw it one more illustrative time to do this. I don't know why it doesn't work in this mode now. All right. So how does this work? So I'm going to take those points. Here's my very critically drawn thing."},{"start":613.86,"text":"I'm going to have my current guess of the mui. So here, I probably switched colors. I apologize if I did that. Shouldn't really matter. But I'm not going to be consistent about that, I guess. Here's my points. The first thing I do is I compute. This is the line I set out on. For every point, I figure out which one is closer to. So this point is closer to mu1 than it's closer to mu2. So this is going to be a mu1. So let me color that character blue."},{"start":644.29,"text":"Okay, this point looks to me to be closer to mu1 than mu2, just barely. This one, I don't know, kind of seems a little closer to mu2. Clear what I'm doing? I'm comparing this distance and this distance. All right, now in this way, I go through and I start to compare all of them. Maybe I'll make this character closer to mu1, right? Okay, so this is me implementing this line right here."},{"start":674.83,"text":"When I say closer, I'm looking at the distance. You could say, does it matter that it's squared? Not really, but I'll use the square later in a convenience because it's just a minimum, right? Just saying which points am I closer to. Don't let the square bother you. Euclidean distance. Cool. All right. Now, when I do this, I have to do the second point. I have to compute new cluster center. So what's my algorithm going to be? I start with guesses. And hopefully, as we said, mu1 is going to migrate down here and mu2 is going to go up there."}],"speech_gaps":[],"frame":"../frames/v040/004.webp","frame_time":547.62},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":28,"text":"Now, what if, by the way, this is a thing. What if mu2 migrated over here and mu1 migrated over there? Would that be bad or good or indifferent? Please. It wouldn't matter. And this is the key point in unsupervised. I don't know which cluster is mu1 or which cluster is mu2. There are no labels. What I care about is that I got centers that were at the right spot, whatever their labels are. Okay? All right. Excellent. Oops. Monkey. All right.","zh":"现在，顺便问一句，如果这是个事情。如果mu2迁移到这里，而mu1迁移到那里，这会是坏的、好的还是无关紧要的？请。这不会有什么差别。这是无监督学习中的关键点。我不知道哪个聚类是mu1，哪个是mu2。没有标签。我关心的是我得到了位于正确位置的中心，无论它们的标签是什么。明白吗？好的。太好了。哎呀。猴子。好的。","start":705.99,"end":735.92},{"id":29,"text":"I've got to stop drawing in weird ways. All right, we'll get there. Okay, so now the next part of my iteration is this character. I want to compute the new cluster centers. So what I'll do is I'll look at all these points, let's say for the blue characters, and I'll compute their mean. And so their mean probably lives somewhere right there. This is going to be mu1 at time 2, I'm going to call it. Clear enough? It's the average of these points, computed however visually crudely.","zh":"我必须停止以奇怪的方式作图。好的，我们会到达那一步的。好的，现在我迭代过程的下一部分是这个角色。我想计算新的聚类中心。所以我将做的是，我会查看所有这些点，比如说蓝色的字符，然后计算它们的平均值。因此它们的平均值可能位于这里。我会称它为时间2的mu1。清楚吗？这是这些点的平均值，无论视觉上多么粗略地计算。","start":736.62,"end":767.32},{"id":30,"text":"Right? How do I compute it? Well, I just add all of them and divide by the number that are there. It is really their arithmetic average. Mu2, we'll get a similar one. Now, if I did my job correctly, that's all a big if. Now, notice mu2, I'll put two here to denote it. These characters have all gotten closer. Now, when I do this, I then have to loop back. It's an iterative algorithm.","zh":"对吧？我是如何计算它的？我只是把它们全部加起来，然后除以存在的数量。它确实是这些点的算术平均值。mu2，我们会得到一个类似的。现在，如果我正确地完成了我的工作，那这都是一个大前提。现在，注意mu2，我会用两个来表示它。这些字符都变得更近了。当我这样做时，我必须返回循环。这是一个迭代算法。","start":768.11,"end":799.03},{"id":31,"text":"Now if I look here, all of these three points are now closer to the mu character and all three of these are closer to the mu character. So all of these would be blue and all of these would be red. And then where is their mean? Right where I claim they should be after I run the next step. How do I know at the next time to stop? Exactly right. If I run this algorithm again and I get exactly the same information, the cluster assignments are the same across time step,","zh":"现在，如果我在这里看，这三个点现在都更接近mu字符，而这三个点也都更接近mu字符。因此，这些都会是蓝色，而这些都会是红色。那么它们的平均值在哪里？就在我声称在下一步运行后应该出现的位置。如何知道在下一步何时停止？完全正确。如果我再次运行这个算法，并且得到完全相同的信息，聚类分配在时间步之间相同，","start":800.04,"end":833.82},{"id":32,"text":"then it's not going to change the center. So this algorithm would just loop forever if I continue to run it, so I'll stop it then. That's the cluster that I got out of this. Is that intuitively clear? Awesome. So now you know k-means. Now, a couple of questions. Does it terminate? It's actually not obvious, but guesses. Please.","zh":"那么它不会改变中心。因此，如果我继续运行这个算法，这个算法会永远循环下去，所以我会在那时停止。这就是我从这个聚类中得到的结果。这是否直观清晰？太棒了。现在，你们已经知道了k-means。现在，有几个问题。它是否会终止？实际上并不明显，但请猜测。","start":834.54,"end":867.0}],"notes":["本段讨论了K-Means算法中聚类中心迁移的问题，指出在无监督学习中，聚类中心的标签并不重要，关键在于它们是否位于正确的位置。讲者强调，即使聚类中心的位置发生变化，只要它们处于正确的位置，结果仍然是有效的。","讲者进一步解释了如何计算新的聚类中心，即对属于同一簇的所有点取其算术平均值。这一步骤是K-Means算法的核心，通过不断迭代更新聚类中心，直到收敛。","讲者提到，当聚类中心不再变化时，算法会停止。这是判断算法是否收敛的标准，即如果再次运行算法后，聚类分配没有变化，则中心也不会变化，算法终止。","讲者最后提出一个问题，即K-Means算法是否一定会终止。这表明算法的终止性是一个需要进一步思考的问题，尽管在实际应用中，算法通常会收敛。","讲者通过举例说明了算法的迭代过程，强调了聚类中心的更新和聚类分配的循环过程，以及如何判断算法是否达到稳定状态。","讲者在讲解过程中使用了直观的图示和例子，帮助学生理解K-Means算法的运作机制，包括聚类中心的迁移、计算平均值的过程以及算法的终止条件。"],"formulas":[],"uncertainties":[],"diagram":"none","start":705.99,"end":867.0,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":705.99,"text":"Now, what if, by the way, this is a thing. What if mu2 migrated over here and mu1 migrated over there? Would that be bad or good or indifferent? Please. It wouldn't matter. And this is the key point in unsupervised. I don't know which cluster is mu1 or which cluster is mu2. There are no labels. What I care about is that I got centers that were at the right spot, whatever their labels are. Okay? All right. Excellent. Oops. Monkey. All right."},{"start":736.62,"text":"I've got to stop drawing in weird ways. All right, we'll get there. Okay, so now the next part of my iteration is this character. I want to compute the new cluster centers. So what I'll do is I'll look at all these points, let's say for the blue characters, and I'll compute their mean. And so their mean probably lives somewhere right there. This is going to be mu1 at time 2, I'm going to call it. Clear enough? It's the average of these points, computed however visually crudely."},{"start":768.11,"text":"Right? How do I compute it? Well, I just add all of them and divide by the number that are there. It is really their arithmetic average. Mu2, we'll get a similar one. Now, if I did my job correctly, that's all a big if. Now, notice mu2, I'll put two here to denote it. These characters have all gotten closer. Now, when I do this, I then have to loop back. It's an iterative algorithm."},{"start":800.04,"text":"Now if I look here, all of these three points are now closer to the mu character and all three of these are closer to the mu character. So all of these would be blue and all of these would be red. And then where is their mean? Right where I claim they should be after I run the next step. How do I know at the next time to stop? Exactly right. If I run this algorithm again and I get exactly the same information, the cluster assignments are the same across time step,"},{"start":834.54,"text":"then it's not going to change the center. So this algorithm would just loop forever if I continue to run it, so I'll stop it then. That's the cluster that I got out of this. Is that intuitively clear? Awesome. So now you know k-means. Now, a couple of questions. Does it terminate? It's actually not obvious, but guesses. Please."}],"speech_gaps":[],"frame":"../frames/v040/005.webp","frame_time":717.99},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":33,"text":"Yeah, great, good intuition. So the intuition is, hey, the underlying clustering is deterministic. And so potentially, you could just only explore all of them after some point in time. The challenge with that is it could oscillate back and forth. So I think you're thinking in the right way. But you were going to say? I was going to ask, what if you have a situation in which you have a ridiculously scattered amount of data, and it's very difficult to assign any kind of cluster or boundary? Awesome question. Are you just going to end up in a sequence of...","zh":"是的，很好，很好的直觉。所以这个直觉是，嘿，底层的聚类是确定性的。因此，潜在地，你可以在某个时间点之后只探索所有这些聚类。挑战在于，这可能会在之间来回震荡。所以我认为你是在正确的思考方向上。但你打算说？我本来打算问，如果你有一个数据点分布极其分散的情况，很难分配任何种类的聚类或边界，那会怎样？非常好的问题。你最终会陷入一系列...","start":873.65,"end":901.25},{"id":34,"text":"constantly changing the view to deliver some value yeah wonderful question so both of you are thinking about this in exactly a very interesting way and i think you both have kind of the right intuition so the question is what if i have points just to kind of go as you said what if there doesn't really exist a good clustering","zh":"不断改变视角以提供一些价值，是的，非常好的问题。所以你们两个都在以非常有趣的方式思考这个问题，我认为你们两个都有正确的直觉。问题是，如果我有数据点，正如你所说，如果实际上不存在一个好的聚类，会怎样？","start":901.31,"end":914.53},{"id":35,"text":"We're going to come back to that in just one minute. So I want to come back to that. It's a really important point that you're making. The second one, when I think about, and that's the right example to think about, what would happen in kind of the bad case of what would bounce around with the Muse. Now, the thing that would really unsettle the Muse is somehow if they weren't kind of making incremental progress in some way. So if they're just flipping values.","zh":"我们会在下一分钟回到这一点。所以我想回到这一点。你提出的这个观点非常重要。第二个，当我思考时，这也是正确的例子，考虑一下在什么样的坏情况下，Muse会来回震荡。现在，真正会让Muse不安的是，如果它们在某种意义上没有逐步取得进展。所以如果它们只是在翻转值的话。","start":914.8,"end":935.52},{"id":36,"text":"That's kind of too discrete progress. That could actually oscillate forever. It turns out that underneath the covers, which is kind of amazing, is this functional, this least squares functional, this is actually monotonically decreasing. So it means over time, if you think about why, you should go through the arguments in the notes. Over time, that average, that L2 distance is shrinking. But it doesn't say the rate at which it's shrinking.","zh":"这基本上是太离散的进展了。实际上可能会永远震荡下去。结果发现，底层的机制，这非常令人惊讶，是这个函数，这个最小二乘函数，实际上它是单调递减的。因此，随着时间的推移，如果你思考为什么，你应该在笔记中回顾相关论证。随着时间的推移，这个平均值，这个L2距离会逐渐缩小。但它并没有说明它缩小的速度。","start":937.33,"end":962.62},{"id":37,"text":"It could shrink very slowly. And both of these examples are really good ones. If you have something which is really spread out, maybe it's just kind of fighting about one point, right? There's these points which like when I move the centers, like there's a big mass and then there's these things around the edge. The worry would be that those, you know, kind of points that are very distant are kind of pulling the cluster centers and they're kind of fighting about this point, but the mass doesn't let them, you know, cleanly solve it on each iteration. That's the picture. And this says, that really doesn't happen. It actually still goes cleanly. Now,","zh":"它可能会非常缓慢地收缩。而这两个例子都是非常好的例子。如果你有一个非常分散的数据，也许它只是在争夺一个点，对吧？这些点就像当我移动中心时，有一个大的聚集区域，然后还有一些在边缘的点。担心的是，这些非常遥远的点可能会拉扯聚类中心，它们在争夺这个点，但大质量的聚集区域阻止了它们在每次迭代中干净地解决这个问题。这就是这个情况。而这句话说，这种情况实际上并不会发生。它实际上仍然可以干净地进行。现在，","start":964.36,"end":993.04},{"id":38,"text":"It could go really, really slowly. It doesn't say anything about the rate. Here's another question. Does it find the global minimum? It is an NP-hard problem. So it'd be super suspicious. So one of two things would have to be true. Either it would decrease so slowly, because it's an NP-hard problem, that it would take an exponential number of steps. Or it could find not the right answer. Both of those are possible from the first thing.","zh":"它可能会非常、非常缓慢地进行。它并没有说明速率的问题。这里还有一个问题：它能找到全局最小值吗？这是一个NP难的问题。所以这会让人非常怀疑。因此，必须满足两种情况之一。要么它会因为这是一个NP难的问题而下降得如此缓慢，以至于需要指数级的步骤；要么它可能找不到正确的答案。这两种情况都可能从第一点得出。","start":993.77,"end":1025.91}],"notes":["本段讨论了K-Means算法在面对数据分布不明确时的挑战，特别是当数据点非常分散且难以划分聚类时的情况。讲者指出，这种情况下算法可能会在不同聚类之间反复切换，导致无法稳定收敛。同时，讲者提到，K-Means的损失函数实际上是单调递减的，这意味着平均L2距离会随着时间推移而减少，但并未说明减少的速度。","讲者进一步解释了当数据点分布非常广泛时，算法可能会在某些点上反复调整聚类中心，导致无法清晰地解决每个迭代步骤中的问题。然而，讲者指出，这种现象实际上不会发生，算法仍然能够稳定地进行。","讲者还提到，K-Means算法的收敛速度可能非常缓慢，但并未说明具体的速度。此外，讲者指出，由于K-Means是一个NP难问题，因此无法保证找到全局最优解，可能需要指数级的步骤，或者可能无法找到正确的答案。","讲者通过这些例子强调了K-Means算法在实际应用中的局限性，特别是在数据分布复杂或难以划分聚类的情况下。同时，讲者也指出，尽管存在这些挑战，算法仍然能够稳定地进行，但可能需要较长的时间才能收敛。","讲者还提到，K-Means的损失函数是单调递减的，这意味着算法在迭代过程中会不断减少误差，但无法保证找到全局最优解。这与NP难问题的性质相关，因此需要权衡算法的收敛速度和结果的准确性。","最后，讲者通过这些讨论强调了K-Means算法在实际应用中的重要性，同时也指出了其局限性，特别是在处理复杂数据分布时的挑战。"],"formulas":[],"uncertainties":["the Muse"],"diagram":"none","start":873.65,"end":1025.91,"asr_flags":[],"math_clarifications":["原始片段中未提供具体的数学公式，仅提及了L2距离的概念，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":873.65,"text":"Yeah, great, good intuition. So the intuition is, hey, the underlying clustering is deterministic. And so potentially, you could just only explore all of them after some point in time. The challenge with that is it could oscillate back and forth. So I think you're thinking in the right way. But you were going to say? I was going to ask, what if you have a situation in which you have a ridiculously scattered amount of data, and it's very difficult to assign any kind of cluster or boundary? Awesome question. Are you just going to end up in a sequence of..."},{"start":901.31,"text":"constantly changing the view to deliver some value yeah wonderful question so both of you are thinking about this in exactly a very interesting way and i think you both have kind of the right intuition so the question is what if i have points just to kind of go as you said what if there doesn't really exist a good clustering"},{"start":914.8,"text":"We're going to come back to that in just one minute. So I want to come back to that. It's a really important point that you're making. The second one, when I think about, and that's the right example to think about, what would happen in kind of the bad case of what would bounce around with the Muse. Now, the thing that would really unsettle the Muse is somehow if they weren't kind of making incremental progress in some way. So if they're just flipping values."},{"start":937.33,"text":"That's kind of too discrete progress. That could actually oscillate forever. It turns out that underneath the covers, which is kind of amazing, is this functional, this least squares functional, this is actually monotonically decreasing. So it means over time, if you think about why, you should go through the arguments in the notes. Over time, that average, that L2 distance is shrinking. But it doesn't say the rate at which it's shrinking."},{"start":964.36,"text":"it could shrink very slowly. And both of these examples are really good ones. If you have something which is really spread out, maybe it's just kind of fighting about one point, right? There's these points which like when I move the centers, like there's a big mass and then there's these things around the edge. The worry would be that those, you know, kind of points that are very distant are kind of pulling the cluster centers and they're kind of fighting about this point, but the mass doesn't let them, you know, cleanly solve it on each iteration. That's the picture. And this says, that really doesn't happen. It actually still goes cleanly. Now,"},{"start":993.77,"text":"It could go really, really slowly. It doesn't say anything about the rate. Here's another question. Does it find the global minimum? It is an NP-hard problem. So it'd be super suspicious. So one of two things would have to be true. Either it would decrease so slowly, because it's an NP-hard problem, that it would take an exponential number of steps. Or it could find not the right answer. Both of those are possible from the first thing."}],"speech_gaps":[],"frame":"../frames/v040/006.webp","frame_time":885.65},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":39,"text":"It picks not the right answer. We'll come back to that in a second. There's another question. What is an NP-hard problem? Oh, sorry. So NP-hard problem is a notion from complexity. You don't need to know it for this class. It means that it's expected that a problem is easy to verify in polynomial time, but takes potentially much longer to get the right answer. So it's a notion of being a computationally hard problem. It just means something that's unlikely to have a simple, efficient solution. Great question. Sorry about that.","zh":"它选择的并不是正确的答案。我们稍后会再回到这一点。还有一个问题：什么是NP难问题？哦，抱歉。NP难问题是一个来自复杂度理论的概念。你们不需要为这门课了解它。它的意思是，一个问题预计容易在多项式时间内验证，但得到正确答案可能需要耗费大量时间。因此，它指的是计算上困难的问题。它仅仅意味着一个不太可能拥有简单、高效解的问题。非常好的问题。抱歉让大家困惑了。","start":1026.38,"end":1054.4},{"id":40,"text":"The NP-hard problem gives you some clue that this thing won't have a minimum,","zh":"NP难问题给了我们一些线索，表明这个事物不会有一个最小值，","start":1055.66,"end":1059.08},{"id":41,"text":"and indeed it does not. Please, you had another question.","zh":"事实上确实如此。请，你们还有另一个问题。","start":1060.38,"end":1064.86},{"id":42,"text":"Awesome question, yeah. Are there multiple local minima? So because it converges,","zh":"非常好的问题，是的。是否存在多个局部极小值？因为算法会收敛，","start":1066.52,"end":1070.64},{"id":43,"text":"and because you have that it's not finding a global minimum, you suspect that in fact there","zh":"并且因为无法找到全局极小值，你怀疑事实上存在这些局部极小值，算法可能会陷入其中，而且确实可能存在多个这样的极小值。","start":1070.64,"end":1074.5},{"id":44,"text":"are these local minima that it can get locked into, and indeed there can be multiple of them.","zh":"在这里可能发生的情况就是我们刚才谈到的那种情况，","start":1074.5,"end":1078.4},{"id":45,"text":"And sort of what can happen here is this kind of thing that we're talking about that","zh":"但事实上，是的，存在多个局部极小值。","start":1078.6,"end":1081.56},{"id":46,"text":"But indeed, yes, there are multiple local minima.","zh":"但确实如此，是的，存在多个局部极小值。","start":1081.56,"end":1084.08},{"id":47,"text":"And it's not well-defined.","zh":"并且它没有明确定义。","start":1084.12,"end":1085.5},{"id":48,"text":"Go ahead.","zh":"继续。","start":1085.72,"end":1086.0},{"id":49,"text":"Yeah.","zh":"是的。","start":1086.12,"end":1086.26},{"id":50,"text":"Jump around to start from different starting points.","zh":"从不同的起始点开始跳跃。","start":1086.72,"end":1089.78},{"id":51,"text":"Exactly right.","zh":"完全正确。","start":1089.78,"end":1090.36},{"id":52,"text":"At the end of the lower local minima.","zh":"在下部局部极小值的末端。","start":1090.44,"end":1092.3},{"id":53,"text":"Exactly right.","zh":"完全正确。","start":1092.6,"end":1093.42},{"id":54,"text":"So the intuition is, because you have these local minima,","zh":"所以直觉是，因为你有这些局部极小值，","start":1093.5,"end":1096.72},{"id":55,"text":"the initialization matters quite a bit.","zh":"初始化非常重要。","start":1096.82,"end":1098.76},{"id":56,"text":"Because if you looked, you say, if you think, OK,","zh":"因为如果你仔细想想，你会说，如果你认为，","start":1098.92,"end":1101.58},{"id":57,"text":"it's potentially going to end in a different solution.","zh":"它可能会收敛到不同的解。","start":1101.7,"end":1103.78},{"id":58,"text":"But every step we had in the algorithm, let it go back,","zh":"但是我们在算法中的每一步，让它回溯，","start":1103.98,"end":1107.24},{"id":59,"text":"was deterministic.","zh":"都是确定性的。","start":1107.44,"end":1108.24},{"id":60,"text":"So how is it ending up somewhere else?","zh":"那么它是如何收敛到其他地方的呢？","start":1109.26,"end":1110.94},{"id":61,"text":"Well, there's one thing that we didn't talk about, which is this part here.","zh":"好吧，有一个我们没有讨论的部分，就是这里。","start":1110.94,"end":1114.92},{"id":62,"text":"Randomly initialize the centers. That point of where you start the mu1s and the mu2s can have","zh":"随机初始化中心点。你开始的 mu1 和 mu2 的位置可能会有","start":1118.18,"end":1123.7},{"id":63,"text":"a difference on what kind of solution you get at the end. Perfect. You guys have this intuition","zh":"你最终得到的解的类型存在差异。很好。你们有这种直觉","start":1123.7,"end":1127.0},{"id":64,"text":"exactly right. All right. Now, it turns out that a while back, there were some great folks from","zh":"完全正确。好了。事实上，有一段时间，斯坦福大学的一些优秀人士","start":1127.0,"end":1132.92},{"id":65,"text":"Stanford, folks. They were graduate students at Stanford. And they came up with this algorithm","zh":"来自斯坦福大学，他们是斯坦福的研究生。他们提出了一个算法","start":1132.92,"end":1136.14},{"id":66,"text":"algorithm that they called K-Means++.","zh":"他们称之为 K-Means++ 的算法。","start":1136.14,"end":1137.64},{"id":67,"text":"And it's one of my favorite kind of algorithms.","zh":"这是我最喜欢的一类算法之一。","start":1137.92,"end":1139.6},{"id":68,"text":"And they basically showed that they could get a great approximation ratio by weighting where you started those points. So they could show that there was an initialization that no matter what your data is, they would do a pretty good job. Because with NP-hard, they couldn't prove that you would get an optimal solution, but they proved that starting with that right solution...","zh":"他们基本上证明了，通过在初始点上进行加权，他们可以获得一个很好的近似比。因此，他们能够证明存在一种初始化方法，无论你的数据是什么，都能做得相当好。由于问题是 NP 难的，他们无法证明你能得到最优解，但他们证明了，如果以正确的初始化方法开始……","start":1140.46,"end":1160.82},{"id":69,"text":"that would be actually the way to do it. And interestingly enough, if you use this package, which is like a very common Python package for traditional machine learning called sklearn, it's actually implemented there, and it is actually the default now. And they, you know, Vasily did it when they were grad students, and there's a little Wikipedia page about it, which doesn't render too well. Please. Yeah, so an approximation ratio means, basically, I'm going to tell you that my solution...","zh":"就能真正实现这一点。有趣的是，如果你使用这个包，它是一个非常常见的传统机器学习 Python 包，叫做 sklearn，它实际上已经实现了这个方法，并且现在是默认设置。他们是在研究生时期由 Vasily 实现的，还有一个关于它的维基百科页面，但渲染效果不太好。请。是的，近似比意味着，我将告诉你我的解……","start":1161.92,"end":1186.0},{"id":70,"text":"has some fraction, some ratio to the true solution.","zh":"与真实解之间存在某种比例，某种分数。","start":1186.45,"end":1189.35},{"id":71,"text":"So the optimal has some cost, if you like.","zh":"因此，最优解具有某种成本，如果你感兴趣的话。","start":1189.47,"end":1193.41},{"id":72,"text":"And an approximation ratio means I can bound what that cost is.","zh":"近似比意味着我可以对这个成本进行界估计。","start":1193.55,"end":1196.85},{"id":73,"text":"It just means that.","zh":"它仅仅意味着这一点。","start":1196.97,"end":1197.71},{"id":74,"text":"Now you could say, why do I care about the cost?","zh":"你现在可能会问，为什么我要关心这个成本？","start":1197.75,"end":1200.15},{"id":75,"text":"That's a separate issue, right?","zh":"这是一个独立的问题，对吧？","start":1200.45,"end":1201.75},{"id":76,"text":"Like the cost may not be a meaningful structure.","zh":"比如，这个成本可能并不反映有意义的结构。","start":1201.89,"end":1203.63}],"notes":["本段讨论了K-Means算法中局部极小值的问题，指出由于算法收敛性，可能存在多个局部极小值，而初始化点的选择会影响最终结果。这说明了K-Means算法对初始中心点的敏感性，以及为何需要随机初始化或使用改进的初始化方法如K-Means++。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1026.38,"end":1203.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":38,"raw_segments":[{"start":1026.38,"text":"It picks not the right answer. We'll come back to that in a second. There's another question. What is an NP-hard problem? Oh, sorry. So NP-hard problem is a notion from complexity. You don't need to know it for this class. It means that it's expected that a problem is easy to verify in polynomial time, but takes potentially much longer to get the right answer. So it's a notion of being a computationally hard problem. It just means something that's unlikely to have a simple, efficient solution. Great question. Sorry about that."},{"start":1055.66,"text":"The NP-hard problem gives you some clue that this thing won't have a minimum,"},{"start":1060.38,"text":"and indeed it does not. Please, you had another question."},{"start":1066.52,"text":"Awesome question, yeah. Are there multiple local minima? So because it converges,"},{"start":1070.64,"text":"and because you have that it's not finding a global minimum, you suspect that in fact there"},{"start":1074.5,"text":"are these local minima that it can get locked into, and indeed there can be multiple of them."},{"start":1078.6,"text":"And sort of what can happen here is this kind of thing that we're talking about that"},{"start":1081.56,"text":"But indeed, yes, there are multiple local minima."},{"start":1084.12,"text":"And it's not well-defined."},{"start":1085.72,"text":"Go ahead."},{"start":1086.12,"text":"Yeah."},{"start":1086.72,"text":"Jump around to start from different starting points."},{"start":1089.78,"text":"Exactly right."},{"start":1090.44,"text":"At the end of the lower local minima."},{"start":1092.6,"text":"Exactly right."},{"start":1093.5,"text":"So the intuition is, because you have these local minima,"},{"start":1096.82,"text":"the initialization matters quite a bit."},{"start":1098.92,"text":"Because if you looked, you say, if you think, OK,"},{"start":1101.7,"text":"it's potentially going to end in a different solution."},{"start":1103.98,"text":"But every step we had in the algorithm, let it go back,"},{"start":1107.44,"text":"was deterministic."},{"start":1109.26,"text":"So how is it ending up somewhere else?"},{"start":1110.94,"text":"Well, there's one thing that we didn't talk about, which is this part here."},{"start":1118.18,"text":"Randomly initialize the centers. That point of where you start the mu1s and the mu2s can have"},{"start":1123.7,"text":"a difference on what kind of solution you get at the end. Perfect. You guys have this intuition"},{"start":1127.0,"text":"exactly right. All right. Now, it turns out that a while back, there were some great folks from"},{"start":1132.92,"text":"Stanford, folks. They were graduate students at Stanford. And they came up with this algorithm"},{"start":1136.14,"text":"algorithm that they called K-Means++."},{"start":1137.92,"text":"And it's one of my favorite kind of algorithms."},{"start":1140.46,"text":"And they basically showed that they could get a great approximation ratio by weighting where you started those points. So they could show that there was an initialization that no matter what your data is, they would do a pretty good job. Because with NP-hard, they couldn't prove that you would get an optimal solution, but they proved that starting with that right solution..."},{"start":1161.92,"text":"that would be actually the way to do it. And interestingly enough, if you use this package, which is like a very common Python package for traditional machine learning called sklearn, it's actually implemented there, and it is actually the default now. And they, you know, Vasily did it when they were grad students, and there's a little Wikipedia page about it, which doesn't render too well. Please. Yeah, so an approximation ratio means, basically, I'm going to tell you that my solution..."},{"start":1186.45,"text":"has some fraction, some ratio to the true solution."},{"start":1189.47,"text":"So the optimal has some cost, if you like."},{"start":1193.55,"text":"And an approximation ratio means I can bound what that cost is."},{"start":1196.97,"text":"It just means that."},{"start":1197.75,"text":"Now you could say, why do I care about the cost?"},{"start":1200.45,"text":"That's a separate issue, right?"},{"start":1201.89,"text":"Like the cost may not be a meaningful structure."}],"speech_gaps":[],"frame":"../frames/v040/007.webp","frame_time":1038.38},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":77,"text":"What it really says qualitatively is initialization matters.","zh":"它实际上在质上说的是初始化很重要。","start":1203.95,"end":1207.45},{"id":78,"text":"And there's a smart way to do it.","zh":"有一种聪明的方法可以做到这一点。","start":1207.81,"end":1209.45},{"id":79,"text":"And some wonderful, smart Stanford people like you","zh":"还有一些非常聪明的斯坦福人，比如你","start":1209.53,"end":1211.51},{"id":80,"text":"who took some precursor to 229 or 229 itself figured out how to solve it.","zh":"像你们这样的聪明的斯坦福人，或者你们之前修过229或正在修229的人，已经想出了如何解决这个问题。","start":1211.51,"end":1215.75},{"id":81,"text":"That's what I cared to get across. Awesome questions. Please.","zh":"这就是我想传达的重点。很棒的问题。请继续。","start":1215.75,"end":1219.51},{"id":82,"text":"At the bottom of the previous slide, you said repeat. Can you explain exactly what's going on?","zh":"在上一张幻灯片的底部，你说重复。你能详细解释一下到底发生了什么吗？","start":1220.57,"end":1226.97},{"id":83,"text":"Oh, yeah. So this repeat until the cluster stayed the same? This is what we talked about verbally. So","zh":"哦，对。所以这个重复直到聚类不再变化？这就是我们之前口头讨论的内容。所以","start":1227.61,"end":1233.43},{"id":84,"text":"there's no additional content. But as we talked about these two steps, assign to a cluster and","zh":"没有额外的内容。但当我们讨论这两个步骤时，即分配到聚类和","start":1233.43,"end":1238.99},{"id":85,"text":"compute a new cluster, we're going to iterate again and again. And what we thought about is","zh":"计算一个新的聚类，我们将反复迭代。我们想到的是","start":1238.99,"end":1243.15},{"id":86,"text":"is there's nothing in here that says to stop iterating.","zh":"这里没有任何内容说明要停止迭代。","start":1243.15,"end":1246.41},{"id":87,"text":"But there's a natural condition to stop iterating.","zh":"但有一个自然的停止迭代的条件。","start":1246.77,"end":1249.13},{"id":88,"text":"There's one natural condition, actually,","zh":"实际上，有一个自然的停止条件，","start":1249.57,"end":1251.21},{"id":89,"text":"which we use in practice.","zh":"我们在实践中会使用它。","start":1251.25,"end":1251.97},{"id":90,"text":"Run some number of steps and call it a day.","zh":"运行一定数量的步骤后就停止。","start":1252.67,"end":1254.35},{"id":91,"text":"You're all familiar with this condition.","zh":"你们都熟悉这个条件。","start":1254.51,"end":1256.15},{"id":92,"text":"A second one that is traditionally run","zh":"另一个传统上会运行的条件","start":1256.67,"end":1258.85},{"id":93,"text":"is, well, the clusters are eventually going to get fixed.","zh":"也就是说，最终聚类结果会趋于稳定。","start":1258.85,"end":1261.55},{"id":94,"text":"You're getting stuck at a minimum.","zh":"你可能会卡在一个局部最小值。","start":1262.17,"end":1264.01},{"id":95,"text":"And then you just stop when the assignments are there.","zh":"当分配结果确定时，你就会停止。","start":1264.41,"end":1267.11},{"id":96,"text":"So we're not repeating that initialize.","zh":"所以我们不会重复进行初始化。","start":1267.59,"end":1270.17},{"id":97,"text":"We're using the cluster.","zh":"我们是在使用聚类。","start":1270.17,"end":1270.87},{"id":98,"text":"Exactly right.","zh":"完全正确。","start":1270.87,"end":1271.45},{"id":99,"text":"Yeah.","zh":"是的。","start":1271.51,"end":1271.61},{"id":100,"text":"Yeah, this part is the part from the, yeah, as you said, that you're initializing.","zh":"是的，这部分就是你所说的初始化部分。","start":1271.61,"end":1275.11},{"id":101,"text":"We're not reinitializing on every step.","zh":"我们并不是在每一步都重新初始化。","start":1275.19,"end":1276.77},{"id":102,"text":"Wonderful questions.","zh":"非常好的问题。","start":1276.93,"end":1277.59},{"id":103,"text":"Please.","zh":"请。","start":1278.47,"end":1278.99},{"id":104,"text":"Some lectures ago, we got this intuition that in very high dimensions,","zh":"在一些讲座之前，我们得到了这样一个直觉：在非常高维的情况下，","start":1279.29,"end":1285.43},{"id":105,"text":"it's kind of hard to think about non-complex, non-complexities.","zh":"很难去思考非复杂、非复杂性的问题。","start":1286.23,"end":1290.85},{"id":106,"text":"So does it apply here?","zh":"这是否适用于这里？","start":1291.15,"end":1292.59},{"id":107,"text":"If you have many dimensions, it would be probably easier to have a...","zh":"如果你有很多维度，可能更容易拥有一个……","start":1292.75,"end":1296.51},{"id":108,"text":"This is a phenomenal, phenomenal question.","zh":"这是一个非凡、非凡的问题。","start":1296.51,"end":1298.67},{"id":109,"text":"question. Let me see if I have it on the next piece. No, no. Okay. So the question, there's","zh":"问题。让我看看我是否在下一段中理解了。不，不。好的。所以问题是，这里我想解决两个问题。","start":1298.67,"end":1305.45},{"id":110,"text":"two questions that I want to get to here. So the kind of repeating as you went back","zh":"你回到之前讨论过的内容时，重复出现的一个问题是，你对高维空间中点的行为的直觉有点奇怪，对吧？","start":1305.45,"end":1309.09},{"id":111,"text":"to is one of the things we discussed earlier is that your intuition about what happens","zh":"它看起来不像三维空间。因此，在高维空间中，随机点可能会发生一些奇怪的事情，比如最近邻和最远邻之间的距离差不多，诸如此类的情况。","start":1309.09,"end":1313.11},{"id":112,"text":"with points in high dimensions is a little bit weird, right? It doesn't look like three","zh":"例如，如果你从球面上采样，你会得到类似壳层的结构，你知道的，如果你从球体内部采样，就会出现类似的情况。","start":1313.11,"end":1316.55},{"id":113,"text":"dimensions. And so weird things can happen in high dimensions with random points, your","zh":"像如果你从球面上采样，你会得到类似壳层的结构，你知道的，如果你从球体内部采样，就会出现类似的情况。","start":1316.55,"end":1320.21},{"id":114,"text":"nearest neighbor and your farthest neighbor about the same distance, stuff like that.","zh":"最近的邻居和最远的邻居距离差不多，类似这样的情况。","start":1320.21,"end":1323.53},{"id":115,"text":"Like if you sample from the sphere, you get like the shell, you know, if you sample inside","zh":"比如如果你从球体上采样，你会得到类似壳层的东西，你知道的，如果你在球体内部采样","start":1323.59,"end":1327.05},{"id":116,"text":"the sphere kind of thing.","zh":"就有点像那种情况。","start":1327.05,"end":1327.79},{"id":117,"text":"Okay, so this relates back to your point about this random scattered data that's out there. If your data has no structure in it and it's random, then running k-means on it is kind of a bizarre thing to do.","zh":"好的，这和你刚才提到的那些随机散布的数据有关。如果你的数据没有任何结构，而且是随机的，那么在这样的数据上运行k-means聚类其实是一件很奇怪的事情。","start":1328.11,"end":1338.91},{"id":118,"text":"And the reason it's bizarre is what k-means has to have underneath it is some meaningful structure. And this is exactly, you're both thinking exactly the same way. If your data has latent clusters, you believe it has latent clusters. I was at a talk earlier today where someone was talking about clusters in gene type, different gene types for different expression.","zh":"之所以奇怪，是因为k-means背后需要有一些有意义的结构。你和我想到的是一样的。如果你的数据存在潜在的聚类，你相信它存在潜在的聚类。我今天早上参加了一个讲座，有人在谈论基因类型中的聚类，不同基因类型的表达差异。","start":1339.4,"end":1358.46}],"notes":["本段讨论了K-Means算法中迭代停止的条件。讲者指出，虽然算法中没有明确的停止条件，但实践中通常会设定一个迭代次数上限，或者当聚类结果不再变化时停止。此外，还提到当算法陷入局部最优解时，也会停止迭代。","讲者进一步探讨了高维数据对K-Means算法的影响。他指出，在高维空间中，数据点之间的距离变得难以区分，这可能导致算法表现不佳。这种现象与之前提到的高维数据的‘诅咒’有关，即在高维空间中，最近邻和最远邻的距离可能非常接近。","讲者提到，当数据没有结构时，运行K-Means算法可能并不合适。这是因为K-Means依赖于数据中潜在的聚类结构。如果数据是随机的，没有明显的聚类，那么K-Means的结果可能没有实际意义。","讲者还提到，他之前在讨论中提到过，高维数据中随机点的性质可能导致一些奇怪的现象，例如最近邻和最远邻的距离相近。这种现象在高维空间中尤为明显，因为数据点的分布变得稀疏。","讲者以基因类型为例，说明了数据中潜在结构的重要性。他提到，如果数据中存在潜在的聚类（如不同基因类型的表达模式），那么K-Means算法可能有效；但如果数据是随机的，那么算法可能无法提供有意义的结果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1203.95,"end":1358.46,"asr_flags":[99],"boards":[],"translation_complete":true,"translated_segments":42,"raw_segments":[{"start":1203.95,"text":"What it really says qualitatively is initialization matters."},{"start":1207.81,"text":"And there's a smart way to do it."},{"start":1209.53,"text":"And some wonderful, smart Stanford people like you"},{"start":1211.51,"text":"who took some precursor to 229 or 229 itself figured out how to solve it."},{"start":1215.75,"text":"That's what I cared to get across. Awesome questions. Please."},{"start":1220.57,"text":"At the bottom of the previous slide, you said repeat. Can you explain exactly what's going on?"},{"start":1227.61,"text":"Oh, yeah. So this repeat until the cluster stayed the same? This is what we talked about verbally. So"},{"start":1233.43,"text":"there's no additional content. But as we talked about these two steps, assign to a cluster and"},{"start":1238.99,"text":"compute a new cluster, we're going to iterate again and again. And what we thought about is"},{"start":1243.15,"text":"is there's nothing in here that says to stop iterating."},{"start":1246.77,"text":"But there's a natural condition to stop iterating."},{"start":1249.57,"text":"There's one natural condition, actually,"},{"start":1251.25,"text":"which we use in practice."},{"start":1252.67,"text":"Run some number of steps and call it a day."},{"start":1254.51,"text":"You're all familiar with this condition."},{"start":1256.67,"text":"A second one that is traditionally run"},{"start":1258.85,"text":"is, well, the clusters are eventually going to get fixed."},{"start":1262.17,"text":"You're getting stuck at a minimum."},{"start":1264.41,"text":"And then you just stop when the assignments are there."},{"start":1267.59,"text":"So we're not repeating that initialize."},{"start":1270.17,"text":"We're using the cluster."},{"start":1270.87,"text":"Exactly right."},{"start":1271.51,"text":"Yeah."},{"start":1271.61,"text":"Yeah, this part is the part from the, yeah, as you said, that you're initializing."},{"start":1275.19,"text":"We're not reinitializing on every step."},{"start":1276.93,"text":"Wonderful questions."},{"start":1278.47,"text":"Please."},{"start":1279.29,"text":"Some lectures ago, we got this intuition that in very high dimensions,"},{"start":1286.23,"text":"it's kind of hard to think about non-complex, non-complexities."},{"start":1291.15,"text":"So does it apply here?"},{"start":1292.75,"text":"If you have many dimensions, it would be probably easier to have a..."},{"start":1296.51,"text":"This is a phenomenal, phenomenal question."},{"start":1298.67,"text":"question. Let me see if I have it on the next piece. No, no. Okay. So the question, there's"},{"start":1305.45,"text":"two questions that I want to get to here. So the kind of repeating as you went back"},{"start":1309.09,"text":"to is one of the things we discussed earlier is that your intuition about what happens"},{"start":1313.11,"text":"with points in high dimensions is a little bit weird, right? It doesn't look like three"},{"start":1316.55,"text":"dimensions. And so weird things can happen in high dimensions with random points, your"},{"start":1320.21,"text":"nearest neighbor and your farthest neighbor about the same distance, stuff like that."},{"start":1323.59,"text":"Like if you sample from the sphere, you get like the shell, you know, if you sample inside"},{"start":1327.05,"text":"the sphere kind of thing."},{"start":1328.11,"text":"Okay, so this relates back to your point about this random scattered data that's out there. If your data has no structure in it and it's random, then running k-means on it is kind of a bizarre thing to do."},{"start":1339.4,"text":"And the reason it's bizarre is what k-means has to have underneath it is some meaningful structure. And this is exactly, you're both thinking exactly the same way. If your data has latent clusters, you believe it has latent clusters. I was at a talk earlier today where someone was talking about clusters in gene type, different gene types for different expression."}],"speech_gaps":[],"frame":"../frames/v040/008.webp","frame_time":1215.95},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":119,"text":"The clusters we believe are meaningful, we believe there are homologues, we believe there are genes that look kind of the same and they should actually cluster. K-means is designed to say if the data look like that, we should be able to pull it up, and even if it looks like that, we may not be able to pull it out because of all the caveats that I put here. But that's the intuition if it makes sense. So it has to be some structure, and in general, this structure is quite rare as you were thinking about before. If you have a spray of points that have no structure to them, k-means will return something.","zh":"我们认为有意义的聚类，我们认为存在同源性，我们认为存在看起来相似的基因，它们实际上应该被聚类。K-means 的设计目的是说，如果数据看起来像这样，我们应该能够将其分离出来，即使看起来像这样，由于我之前提到的所有注意事项，我们可能也无法将其分离出来。但这只是如果它有意义时的直觉。因此，它必须具有某种结构，而一般来说，这种结构相当罕见，正如你们之前所想的那样。如果你有一组没有结构的点，K-means 会返回一些结果。","start":1359.47,"end":1388.6},{"id":120,"text":"But it won't be meaningful. And so this type of algorithm, these unsupervised, which you guys are phenomenal, you got right away, they really only make sense if you take that data in this incarnation and actually examine it or check it in some other way. And so a lot of the places where you use unsupervised algorithms are to get a descriptive feel of your data, or if you know there actually are clusters inside it and that this is something that's meaningful to pull out, like in the biology example.","zh":"但这些结果不会是有意义的。因此，这类算法，这些无监督算法，你们都很擅长，你们立刻就理解了，它们只有在你以这种形式处理数据并实际检查它或以其他方式验证它时才有意义。因此，你们在使用无监督算法的很多地方，是为了获得数据的描述性感觉，或者如果你知道数据中确实存在聚类，并且这是有意义的、值得提取的东西，例如在生物学的例子中。","start":1389.24,"end":1414.0},{"id":121,"text":"We'll see another one later, maybe it's the next lecture, where people are looking for data from particular stars. And the stars have various different emission patterns. And so they know that that data is meaningful, and they have a different way of checking it. But that's kind of the mental model of how you use it. And you have to see there's a lot of just raw modeling. Another one which people always ask rightly is, how do you pick K?","zh":"我们稍后会看到另一个例子，可能是在下一次讲座中，人们在寻找特定恒星的数据。这些恒星有不同的发射模式。因此，他们知道这些数据是有意义的，并且他们有其他方式来验证它。但这就是你如何使用它的心理模型。你必须看到，这其中有大量原始建模。另一个人们总是正确提问的问题是，如何选择 K？","start":1414.52,"end":1441.02},{"id":122,"text":"So we talked about K being equal to 2. But this conversation, as we talked about, you could make K 5, 10, 20. How do you pick it? Well, it turns out that when you pick K, you are making another modeling assumption. You have to have some intuition about how many K are actually in your data set, how many clusters are in your data set. If we go back and look, I'll draw this picture. So let's say that I have these points. How many different clusters are here?","zh":"我们讨论过 K 等于 2 的情况。但正如我们所讨论的，你也可以让 K 等于 5、10、20。如何选择它？事实上，当你选择 K 时，你是在做出另一个建模假设。你必须对数据集中实际有多少个 K、数据集中有多少个聚类有一些直觉。如果我们回过头来看，我会画出这张图。假设我有这些点。这里有多少个不同的聚类？","start":1442.03,"end":1475.23},{"id":123,"text":"Well, you could say maybe there's two.","zh":"你可以说，也许有两个。","start":1475.78,"end":1477.08},{"id":124,"text":"You say, no, no, I think there's four.","zh":"你说，不，不，我认为有四个。","start":1478.94,"end":1480.16},{"id":125,"text":"Both of those are kind of correct.","zh":"这两种说法都大致正确。","start":1484.1,"end":1485.64},{"id":126,"text":"Three gets a little wonky, right?","zh":"三个聚类则有点奇怪，对吧？","start":1486.26,"end":1488.14},{"id":127,"text":"Three, if you try and think about what it looks like,","zh":"三，如果你试着想想它看起来是什么样子，","start":1488.3,"end":1490.02},{"id":128,"text":"you're like, which three do I pick, right?","zh":"你会想，我应该选哪三个呢，对吧？","start":1490.06,"end":1491.86},{"id":129,"text":"Maybe I pick two and one, I don't know.","zh":"也许我选两个和一个，我不确定。","start":1491.9,"end":1493.14},{"id":130,"text":"Maybe I pick these two.","zh":"也许我选这两个。","start":1493.22,"end":1494.08},{"id":131,"text":"The point is that this is actually very underspecified.","zh":"关键是，这实际上是一个非常欠指定的问题。","start":1495.76,"end":1499.1},{"id":132,"text":"And so at first, the reason I like this so much is","zh":"因此，最初我喜欢它的原因","start":1499.7,"end":1502.34},{"id":133,"text":"it's a simple enough algorithm to think through","zh":"是它足够简单，可以有效地思考所有这些问题。","start":1502.34,"end":1504.24},{"id":134,"text":"effectively all of these issues. That's like one of the real challenges when you","zh":"这就像其中一个真正的挑战，当你","start":1504.24,"end":1508.26},{"id":135,"text":"start to do more unsupervised modeling is that it forced you to think about","zh":"开始进行更多无监督建模的一个原因是它迫使你思考","start":1508.26,"end":1511.52},{"id":136,"text":"modeling challenges because otherwise the answer doesn't make sense. Which","zh":"建模挑战，否则答案是没有意义的。","start":1511.52,"end":1514.96},{"id":137,"text":"sometimes if you're doing kind of a linear model, you don't think as much","zh":"有时候如果你在做某种线性模型，你不会那么多地思考","start":1514.96,"end":1518.24},{"id":138,"text":"about what the modeling assumptions you're making are, but they're still","zh":"你所做出的建模假设，但它们仍然存在。","start":1518.24,"end":1521.54},{"id":139,"text":"there. Machine learning only works under assumptions. That's the trade.","zh":"机器学习只有在假设下才能工作。这就是权衡。","start":1521.54,"end":1525.94},{"id":140,"text":"That's the idea.","zh":"这就是这个想法。","start":1526.1,"end":1526.84},{"id":141,"text":"Yeah.","zh":"是的。","start":1526.84,"end":1526.92},{"id":142,"text":"Fantastic.","zh":"太棒了。","start":1527.76,"end":1528.16},{"id":143,"text":"Please.","zh":"请。","start":1528.26,"end":1528.44},{"id":144,"text":"Can you just run these with different k-means?","zh":"你能用不同的 k-means 运行吗？","start":1528.76,"end":1530.78},{"id":145,"text":"But also have original.","zh":"但也要保留原始数据。","start":1531.8,"end":1532.98},{"id":146,"text":"Yeah, yeah.","zh":"是的，是的。","start":1533.3,"end":1533.82},{"id":147,"text":"So the question is, can you run k-means","zh":"问题是，你能运行 k-means","start":1533.84,"end":1535.94},{"id":148,"text":"with different random initializations","zh":"使用不同的随机初始化吗","start":1535.94,"end":1538.72}],"notes":["本段讨论了K-means算法的适用条件和局限性，强调了数据中必须存在某种结构才能有效聚类。讲者指出，K-means算法在数据没有结构时可能返回无意义的结果，因此需要结合其他方法进行验证。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1359.47,"end":1538.72,"asr_flags":[141],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":1359.47,"text":"the clusters we believe are meaningful we believe there are homologues we believe there are genes that look kind of the same and they should actually cluster k-means is designed to say if the data look like that we should be able to pull it up and even if it looks like that we may not be able to pull it out because of all the caveats that i put here but that's the intuition if it makes sense so it ha there has to be some structure and in general this structure is quite rare as you were thinking about before if you have a spray of points that have no structure to them k-means will return something"},{"start":1389.24,"text":"but it won't be meaningful. And so this type of algorithm, these unsupervised, which you guys are phenomenal, you got right away, they really only make sense if you take that data in this incarnation and actually examine it or check it in some other way. And so a lot of the places where you use unsupervised algorithms are to get a descriptive feel of your data, or if you know there actually are clusters inside it and that this is something that's meaningful to pull out, like in the biology example."},{"start":1414.52,"text":"We'll see another one later, maybe it's the next lecture, where people are looking for data from particular stars. And the stars have various different emission patterns. And so they know that that data is meaningful, and they have a different way of checking it. But that's kind of the mental model of how you use it. And you have to see there's a lot of just raw modeling. Another one which people always ask rightly is, how do you pick K?"},{"start":1442.03,"text":"So we talked about k being equal to 2. But this conversation, as we talked about, you could make k 5, 10, 20. How do you pick it? Well, it turns out that when you pick k, you are making another modeling assumption. You have to have some intuition about how many k are actually in your data set, how many clusters are in your data set. If we go back and look, I'll draw this picture. So let's say that I have these points. How many different clusters are here?"},{"start":1475.78,"text":"Well, you could say maybe there's two."},{"start":1478.94,"text":"You say, no, no, I think there's four."},{"start":1484.1,"text":"Both of those are kind of correct."},{"start":1486.26,"text":"Three gets a little wonky, right?"},{"start":1488.3,"text":"Three, if you try and think about what it looks like,"},{"start":1490.06,"text":"you're like, which three do I pick, right?"},{"start":1491.9,"text":"Maybe I pick two and one, I don't know."},{"start":1493.22,"text":"Maybe I pick these two."},{"start":1495.76,"text":"The point is that this is actually very underspecified."},{"start":1499.7,"text":"And so at first, the reason I like this so much is"},{"start":1502.34,"text":"it's a simple enough algorithm to think through"},{"start":1504.24,"text":"effectively all of these issues. That's like one of the real challenges when you"},{"start":1508.26,"text":"start to do more unsupervised modeling is that it forced you to think about"},{"start":1511.52,"text":"modeling challenges because otherwise the answer doesn't make sense. Which"},{"start":1514.96,"text":"sometimes if you're doing kind of a linear model, you don't think as much"},{"start":1518.24,"text":"about what the modeling assumptions you're making are, but they're still"},{"start":1521.54,"text":"there. Machine learning only works under assumptions. That's the trade."},{"start":1526.1,"text":"That's the idea."},{"start":1526.84,"text":"Yeah."},{"start":1527.76,"text":"Fantastic."},{"start":1528.26,"text":"Please."},{"start":1528.76,"text":"Can you just run these with different k-means?"},{"start":1531.8,"text":"But also have original."},{"start":1533.3,"text":"Yeah, yeah."},{"start":1533.84,"text":"So the question is, can you run k-means"},{"start":1535.94,"text":"with different random initializations"}],"speech_gaps":[],"frame":"../frames/v040/009.webp","frame_time":1371.47},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":149,"text":"and see what you get?","zh":"然后看看你会得到什么？","start":1538.72,"end":1539.64},{"id
