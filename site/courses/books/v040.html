 i know that the clusters should all be","start":1720.34,"end":1724.54},{"id":184,"text":"tightly i have some spatial knowledge they should all form crescents when i'm done with them that","start":1724.54,"end":1728.94},{"id":185,"text":"may be an idea that helps you validate the clusters just as well and so i tend to fall","start":1728.94,"end":1733.66},{"id":186,"text":"in that camp. We'll see next lecture a different thing called PCA. And in PCA, there actually is","start":1733.66,"end":1739.68},{"id":187,"text":"a test that has a goodness of fit that's almost exactly what you're describing, which says it has","start":1739.68,"end":1744.32},{"id":188,"text":"to do with the eigenvalue table. It will make sense when we come to it, but then says, this","start":1744.32,"end":1748.12},{"id":189,"text":"is how much variance I'm explaining underneath the data from the goodness of fit. Here, we just","start":1748.12,"end":1752.7},{"id":190,"text":"don't really have the structure. That said, there are tests in the literature that are along the","start":1752.7,"end":1756.78},{"id":191,"text":"lines of what you're saying. I'm just telling you intuitively, I haven't found them to be","start":1756.78,"end":1759.76},{"id":192,"text":"particularly useful in my own work yeah awesome questions others all right","start":1759.76,"end":1769.26},{"id":193,"text":"okay","start":1771.3,"end":1771.7},{"id":194,"text":"yeah yeah so this is just making the point that you all made for me i i i made these points","start":1775.18,"end":1779.46},{"id":195,"text":"earlier and they're in the notes and you already made the point about random restarts and everything","start":1779.46,"end":1783.04},{"id":196,"text":"else that's all that slide i skipped class okay now to uh now to our second character","start":1783.04,"end":1788.46},{"id":197,"text":"today. And this will have a little bit more math. This is basically going to be k-means","start":1788.92,"end":1793.94},{"id":198,"text":"with a little bit of annoying math and Bayes' rule.","start":1794.6,"end":1797.1},{"id":199,"text":"I want you to think intuitively it's k-means, but we're going to estimate everything we","start":1797.54,"end":1801.56},{"id":200,"text":"do with math and Bayes' rule. But it's really doing fundamentally the same behavior. And","start":1801.56,"end":1807.68},{"id":201,"text":"instead of having clusters, we're going to have mixtures of these Gaussians.","start":1807.68,"end":1810.94},{"id":202,"text":"All right. So here's the picture that I want to draw.","start":1810.94,"end":1814.52},{"id":203,"text":"Okay, so this is a toy example. I looked this up a couple years ago because there's some friends. This is like looking at, I looked into the literature and I tried to find what are good examples of using mixture of Gaussians that I thought were fun and interesting.","start":1816.01,"end":1829.99},{"id":204,"text":"This was from some friends at the University of Washington. And they were looking for quasars and stars. They're both sources of light. And the idea here is that these quasars and stars are shooting off light. Those photons are coming. They're hitting us. And we're counting the number of photons. And so at a particular time point, we're going to observe a bunch of photons. I'm trying to draw this picture so it makes a little bit of sense. And then maybe there's something.","start":1830.63,"end":1858.8},{"id":205,"text":"Every cross x here is supposed to be a photon that we observe. So this is what we're given. And then what we like to do is we like to understand the sources of data. And these sources may have different shapes. I don't know anything about the underlying physics. So let's just say these are quasars for the moment. That sounds good. These tight bundles, the idea is that they're going to shoot a ton of photons. They'll have high density, but they don't have a ton of spread.","start":1860.79,"end":1889.55}],"notes":["本段讨论了K-Means算法的局限性，指出在没有先验知识的情况下，难以验证聚类结果是否合理。讲者提到PCA中存在一种与K-Means相似的检验方法，该方法基于特征值表，用于衡量数据中解释的方差比例。然而，讲者认为这些检验方法在实际应用中并不特别有用。","讲者随后转向介绍混合高斯模型，指出其与K-Means在行为上相似，但使用了贝叶斯规则进行估计。混合高斯模型将数据视为多个高斯分布的混合，而不是简单的聚类。","讲者通过一个玩具示例来说明混合高斯模型的应用，该示例来源于华盛顿大学的研究人员，他们试图区分类星体和恒星。类星体和恒星都会发出光子，但它们的光子分布可能具有不同的形状。","在示例中，每个交叉点代表一个观测到的光子。讲者强调，我们希望理解数据的来源，并且这些来源可能具有不同的分布形状。讲者指出，对于类星体，光子的密度较高，但分布较为集中，没有很大的方差。","讲者提到，虽然混合高斯模型在理论上可以处理更复杂的分布，但在实际应用中，仍需考虑如何选择合适的模型参数和先验分布。","最后，讲者指出，混合高斯模型与K-Means在行为上相似，但使用了更复杂的数学工具，如贝叶斯规则，来估计数据的分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1715.78,"end":1889.55,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1715.78,"text":"you have may not be as helpful as auxiliary sources of information that could tell you"},{"start":1720.34,"text":"that's a really good fit right you're like oh i know that the clusters should all be"},{"start":1724.54,"text":"tightly i have some spatial knowledge they should all form crescents when i'm done with them that"},{"start":1728.94,"text":"may be an idea that helps you validate the clusters just as well and so i tend to fall"},{"start":1733.66,"text":"in that camp. We'll see next lecture a different thing called PCA. And in PCA, there actually is"},{"start":1739.68,"text":"a test that has a goodness of fit that's almost exactly what you're describing, which says it has"},{"start":1744.32,"text":"to do with the eigenvalue table. It will make sense when we come to it, but then says, this"},{"start":1748.12,"text":"is how much variance I'm explaining underneath the data from the goodness of fit. Here, we just"},{"start":1752.7,"text":"don't really have the structure. That said, there are tests in the literature that are along the"},{"start":1756.78,"text":"lines of what you're saying. I'm just telling you intuitively, I haven't found them to be"},{"start":1759.76,"text":"particularly useful in my own work yeah awesome questions others all right"},{"start":1771.3,"text":"okay"},{"start":1775.18,"text":"yeah yeah so this is just making the point that you all made for me i i i made these points"},{"start":1779.46,"text":"earlier and they're in the notes and you already made the point about random restarts and everything"},{"start":1783.04,"text":"else that's all that slide i skipped class okay now to uh now to our second character"},{"start":1788.92,"text":"today. And this will have a little bit more math. This is basically going to be k-means"},{"start":1794.6,"text":"with a little bit of annoying math and Bayes' rule."},{"start":1797.54,"text":"I want you to think intuitively it's k-means, but we're going to estimate everything we"},{"start":1801.56,"text":"do with math and Bayes' rule. But it's really doing fundamentally the same behavior. And"},{"start":1807.68,"text":"instead of having clusters, we're going to have mixtures of these Gaussians."},{"start":1810.94,"text":"All right. So here's the picture that I want to draw."},{"start":1816.01,"text":"Okay, so this is a toy example. I looked this up a couple years ago because there's some friends. This is like looking at, I looked into the literature and I tried to find what are good examples of using mixture of Gaussians that I thought were fun and interesting."},{"start":1830.63,"text":"This was from some friends at the University of Washington. And they were looking for quasars and stars. They're both sources of light. And the idea here is that these quasars and stars are shooting off light. Those photons are coming. They're hitting us. And we're counting the number of photons. And so at a particular time point, we're going to observe a bunch of photons. I'm trying to draw this picture so it makes a little bit of sense. And then maybe there's something."},{"start":1860.79,"text":"Every cross x here is supposed to be a photon that we observe. So this is what we're given. And then what we like to do is we like to understand the sources of data. And these sources may have different shapes. I don't know anything about the underlying physics. So let's just say these are quasars for the moment. That sounds good. These tight bundles, the idea is that they're going to shoot a ton of photons. They'll have high density, but they don't have a ton of spread."}],"speech_gaps":[],"frame":"../frames/v040/011.webp","frame_time":1727.78},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":206,"text":"There are other objects in the sky that are going to have large spreads, potentially. They're going to have some distortion. They're going to shoot like a disk. And they may have corresponding less intensity. These are the types of objects that we're considering for the moment. Go ahead. What are the axes here? Oh, this is spatial. This is x and y in space. Imagine it's a photon plate. I've taken a picture of some region of the sky, and this is the plate where the photons are hitting me. Yeah, thanks. Sorry for that.","start":1890.36,"end":1919.42},{"id":207,"text":"Okay, so the point that I wanted to make here is what we're going to do is we're going to assign each photon to a light source, but we're going to have a probability of assigning to source J. So we're going to compare this with the k-means. Instead of saying it's exactly in this cluster, making a hard threshold, remember we were worried about these points that were on the border? We're going to allow ourselves to say 60% in cluster 1, 60% in cluster 2.","start":1921.16,"end":1943.99},{"id":208,"text":"Here, the terminology instead of cluster I'm going to use is from a source. This idea here is you say like, oh, these are very likely to be from one source. This is very likely one source. This is very likely one source. These characters here, I'm not sure which source they're from. That I can express through this probability vector. So the sources are fixed, but the probabilities are what I have in line. I don't have to do a hard assignment to a cluster. Clear now?","start":1944.41,"end":1969.75},{"id":209,"text":"All right, so that's what this pzi equals j. If you do look on the online notes, there's a pretty nice diagram that I drew. So the takeaway of this is, as I said, hard assignment is what we were doing before, but now we're going to do these probabilistic assignment. And so the probabilistic assignment, as I showed you, is hopefully you remember how the Gaussians look.","start":1974.22,"end":1995.16},{"id":210,"text":"They have this like, you know, kind of shapes, either kind of circles or long ellipses. They're ellipses that we can put and rotate, right? That's how Gaussians look. And that's going to allow us to say from that center, the same as that mean, it's going to allow us to assign how likely every point is. All right. All good. Okay. Okay. All right. All right. So here are the challenges, okay? So what are the challenges? There are many sources that are possible.","start":1995.84,"end":2030.08},{"id":211,"text":"We're going to assume we know the number of sources k, just as we assumed before. You know that you're going to assume for this run of the algorithm, you know the number of sources. The sources can have different intensity and shapes. You may have some that are shaped like this, some that are shaped like this, all the Gaussian shapes. They're all going to be Gaussian. The shapes are going to be modeled by, remember they're mean, and then their covariance, their sigma. Here's sigma squared, because I'm going to do things in 1D for the next couple slides.","start":2031.11,"end":2059.15}],"notes":["本段讲授了K-Means与混合高斯模型之间的区别，强调了概率分配的重要性。在K-Means中，每个点被硬性分配到一个簇，而在混合高斯模型中，每个点被赋予属于某个源的概率，允许存在模糊性。例如，一个点可能有60%的概率属于簇1，60%的概率属于簇2。","讲者提到使用‘源’代替‘簇’，并指出每个点的归属可以通过概率向量来表达。这种概率分配方式避免了硬性分类，使得模型能够处理边界点的问题。","讲者提到混合高斯模型中的高斯分布具有椭圆形的形状，可以旋转和调整，这与高斯分布的均值和协方差有关。这种形状允许模型对每个点的归属概率进行估计。","讲者指出混合高斯模型面临的主要挑战之一是源的数量可能很多，但假设已知源的数量k。此外，每个源可能具有不同的强度和形状，但所有源都被建模为高斯分布。","讲者提到高斯分布的形状由均值和协方差决定，并在接下来的幻灯片中将使用一维情况来展示。这表明模型在处理多维数据时，可以通过调整协方差矩阵来适应不同的形状。","讲者强调了混合高斯模型与K-Means之间的关键区别在于概率分配，而不是硬性分类。这种概率分配方式使得模型能够更灵活地处理数据中的不确定性。"],"formulas":[{"latex":"p(z_i = j)\\text{ 表示第i个点属于第j个源的概率}","symbols":"p(z_i = j) 表示第i个点属于第j个源的概率","explanation":"公式正确，表示第i个点属于第j个源的概率，符合概率论中的条件概率定义。","evidence":"Okay, so the point that I wanted to make here is what we're going to do is we're going to assign each photon to a light source, but we're going to have a probability of assigning to source J. So we're going to compare this with the k-means. Instead of saying it's exactly in this cluster, making a hard threshold, remember we were worried about these points that were on the border? We're going to allow ourselves to say 60% in cluster 1, 60% in cluster 2."}],"uncertainties":["可能听不清的术语或公式，如‘sigma squared’是否指协方差矩阵的方差部分，或是否指协方差矩阵的对角线元素。"],"diagram":"none","start":1890.36,"end":2059.15,"asr_flags":[],"math_clarifications":["公式p(z_i = j)和p(x|z_i = j)在上下文中是合理的，用于描述点与源之间的概率关系。Cov(X)在上下文中未被具体定义，但作为协方差的符号是正确的。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1890.36,"text":"There are other objects in the sky that are going to have large spreads, potentially. They're going to have some distortion. They're going to shoot like a disk. And they may have corresponding less intensity. These are the types of objects that we're considering for the moment. Go ahead. What are the axes here? Oh, this is spatial. This is x and y in space. Imagine it's a photon plate. I've taken a picture of some region of the sky, and this is the plate where the photons are hitting me. Yeah, thanks. Sorry for that."},{"start":1921.16,"text":"Okay, so the point that I wanted to make here is what we're going to do is we're going to assign each photon to a light source, but we're going to have a probability of assigning to source J. So we're going to compare this with the k-means. Instead of saying it's exactly in this cluster, making a hard threshold, remember we were worried about these points that were on the border? We're going to allow ourselves to say 60% in cluster 1, 60% in cluster 2."},{"start":1944.41,"text":"Here, the terminology instead of cluster I'm going to use is from a source. This idea here is you say like, oh, these are very likely to be from one source. This is very likely one source. This is very likely one source. These characters here, I'm not sure which source they're from. That I can express through this probability vector. So the sources are fixed, but the probabilities are what I have in line. I don't have to do a hard assignment to a cluster. Clear now?"},{"start":1974.22,"text":"All right, so that's what this pzi equals j. If you do look on the online notes, there's a pretty nice diagram that I drew. So the takeaway of this is, as I said, hard assignment is what we were doing before, but now we're going to do these probabilistic assignment. And so the probabilistic assignment, as I showed you, is hopefully you remember how the Gaussians look."},{"start":1995.84,"text":"They have this like, you know, kind of shapes, either kind of circles or long ellipses. They're ellipses that we can put and rotate, right? That's how Gaussians look. And that's going to allow us to say from that center, the same as that mean, it's going to allow us to assign how likely every point is. All right. All good. Okay. Okay. All right. All right. So here are the challenges, okay? So what are the challenges? There are many sources that are possible."},{"start":2031.11,"text":"We're going to assume we know the number of sources k, just as we assumed before. You know that you're going to assume for this run of the algorithm, you know the number of sources. The sources can have different intensity and shapes. You may have some that are shaped like this, some that are shaped like this, all the Gaussian shapes. They're all going to be Gaussian. The shapes are going to be modeled by, remember they're mean, and then their covariance, their sigma. Here's sigma squared, because I'm going to do things in 1D for the next couple slides."}],"speech_gaps":[],"frame":"../frames/v040/012.webp","frame_time":1902.36},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":212,"text":"We also do not assume we know the number of points for each source. So it could be that there's one source that puts out a huge number of points, and another source that puts out a very small number of points, and we're going to try and learn that also from the data. Having that information would be nice. If you knew that the pulsars were putting out some number of points, or quasars, that would be really useful. In this application, you don't. So far, so good. Any questions about the assumptions, what they mean?","start":2060.64,"end":2094.09},{"id":213,"text":"We know what the shapes are. So think about mentally, we're putting down shapes. We can rotate them. We can make them different sizes. They have different means and different variances. But we don't assume we know the number of points in every source. Okay, cool. All right. Oh, this one made it through. I was very happy to make it through, I guess. And so here you see the shapes of Gaussian. So remember, you have sphericals, you have diagonals, and you have kind of the full meal deal. Okay, all right.","start":2094.59,"end":2125.43},{"id":214,"text":"Please. We don't know the number of points assigned to each cluster, to each source, but we know the number of sources. What happens in the case where no points get assigned? Wonderful question. Let's come back to that in a minute. The question is,","start":2125.66,"end":2141.76},{"id":215,"text":"What happens if I pick a number of sources and that number of sources is incorrect? One way it could be incorrect is that I think there are too many sources or there's a source rather that I don't measure, that I think is in my dataset, but I don't measure, I don't assign something to it. When we run through the arithmetic, you're going to see exactly what happens. There's going to be some support that's there that will cause this to be an interesting phenomenon. You'll see how it degrades at that point. But this is a wonderful, exactly the right way to think about this. Other questions? All right.","start":2142.37,"end":2172.84},{"id":216,"text":"Okay, so let's do a 1D version of the problem so that I can talk to you through one of the technical issues. So here's the model that we have. So this is, remember, there's always a forward model. And we have, in this little setup, I'm going to give myself two means. So imagine there's one mean here, and there's another mean here. Okay, this is mu2, and this is mu1.","start":2174.89,"end":2203.6},{"id":217,"text":"Now, what happens when we sample from these is that we get a bunch of points. Some points here, here, here. And the way that these happen is if you think about it, there's some proportion of how often we're going to sample from each one. So we flip a coin, say that's 60% in one and 40% in two. We flip that coin.","start":2208.91,"end":2228.31}],"notes":["本段讲授了混合高斯模型的基本假设，即我们不知道每个源的点数，但知道源的数量。这与K-Means不同，K-Means假设每个簇的点数已知。讲者提到，如果知道某些天体（如脉冲星或类星体）的点数，将对分析非常有用，但在当前应用中并不知道这些信息。","讲者进一步解释了混合高斯模型中不同形状的分布，包括球形、对角形和全协方差矩阵的分布。这些形状由不同的均值和方差决定，但源的数量是已知的。讲者还提到，如果没有任何点被分配到某个源，这是一个值得探讨的问题。","讲者讨论了在源数量不正确的情况下会发生什么，例如认为源的数量过多或遗漏了某些源。这种情况下，模型的性能可能会下降，但这是理解模型行为的正确方式。","讲者通过一个一维问题来展示技术细节，包括两个均值的设定。他提到，从这些均值中采样会得到一些点，并且这些点的分布取决于从每个源中采样的比例，例如60%和40%。","讲者强调了模型的前向过程，即如何从源中生成数据点。这种过程涉及随机选择源，并根据比例进行采样，从而形成最终的数据分布。","讲者通过具体的例子说明了混合高斯模型的构建过程，包括均值的设定和采样比例的分配。这些例子帮助学生理解模型如何从源中生成数据，并如何处理不同源之间的分布差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2060.64,"end":2228.31,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2060.64,"text":"We also do not assume we know the number of points for each source. So it could be that there's one source that puts out a huge number of points, and another source that puts out a very small number of points, and we're going to try and learn that also from the data. Having that information would be nice. If you knew that the pulsars were putting out some number of points, or quasars, that would be really useful. In this application, you don't. So far, so good. Any questions about the assumptions, what they mean?"},{"start":2094.59,"text":"We know what the shapes are. So think about mentally, we're putting down shapes. We can rotate them. We can make them different sizes. They have different means and different variances. But we don't assume we know the number of points in every source. Okay, cool. All right. Oh, this one made it through. I was very happy to make it through, I guess. And so here you see the shapes of Gaussian. So remember, you have sphericals, you have diagonals, and you have kind of the full meal deal. Okay, all right."},{"start":2125.66,"text":"Please. We don't know the number of points assigned to each cluster, to each source, but we know the number of sources. What happens in the case where no points get assigned? Wonderful question. Let's come back to that in a minute. The question is,"},{"start":2142.37,"text":"What happens if I pick a number of sources and that number of sources is incorrect? One way it could be incorrect is that I think there are too many sources or there's a source rather that I don't measure, that I think is in my dataset, but I don't measure, I don't assign something to it. When we run through the arithmetic, you're going to see exactly what happens. There's going to be some support that's there that will cause this to be an interesting phenomenon. You'll see how it degrades at that point. But this is a wonderful, exactly the right way to think about this. Other questions? All right."},{"start":2174.89,"text":"Okay, so let's do a 1D version of the problem so that I can talk to you through one of the technical issues. So here's the model that we have. So this is, remember, there's always a forward model. And we have, in this little setup, I'm going to give myself two means. So imagine there's one mean here, and there's another mean here. Okay, this is mu2, and this is mu1."},{"start":2208.91,"text":"Now, what happens when we sample from these is that we get a bunch of points. Some points here, here, here. And the way that these happen is if you think about it, there's some proportion of how often we're going to sample from each one. So we flip a coin, say that's 60% in one and 40% in two. We flip that coin."}],"speech_gaps":[],"frame":"../frames/v040/013.webp","frame_time":2072.64},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":218,"text":"We then go to the right mean, and then we sample according to that Gaussian. And so I'm drawing them like they're in order, but they're really not in order. They're just like points that are sampled from each one of these. Now, when we look at these points, you would probably be tempted to say these points here are probably from this source, and these points here are from this source. But we could also have points that are right on the boundary here, where they're kind of unclear.","start":2228.96,"end":2254.77},{"id":219,"text":"Where did it come from? Now, if we knew the sampling process, we could say this point maybe came from one or two. But all we observe is the bottom line and the points that are on it. We just observe the line, which I would normally love to copy-paste and have a big reveal. We just see this. This is all we're given. We don't get to see any of this stuff, which defines the model. We're going to try and learn that. Now, if we knew the labels,","start":2256.14,"end":2286.3},{"id":220,"text":"This is a really interesting, easy problem. If I told you, oh, this one is blue and blue and blue and blue, and oh, this questionable one, that's also blue. Red, red, red, red, red. Well, this gets you back to your favorite GDA. And so it will turn out, effectively, what we're going to try and do is we're going to try and, as you imagine, guess the labels and then run something which looks just like GDA.","start":2287.37,"end":2315.7},{"id":221,"text":"So if you remember GDA, what you would do is you would try to fit to those points. You had two class labels, red and blue. You would try and get the best fit for Gaussians for each of them. That was what we did two weeks back. We'll derive it again. Don't worry if you don't remember it. But the key challenge is we don't have those labels. So just intuitively, how do you think you solve that challenge of not having the labels?","start":2317.9,"end":2341.62},{"id":222,"text":"Yeah, so one idea is to randomly assign them.","start":2345.58,"end":2347.62},{"id":223,"text":"So we're going to try and maybe first we randomly assign them.","start":2347.7,"end":2350.0},{"id":224,"text":"Then how do you imagine the iteration would go?","start":2350.08,"end":2351.66},{"id":225,"text":"Okay, that's not that well.","start":2355.9,"end":2357.44},{"id":226,"text":"It's a great answer.","start":2357.56,"end":2358.64},{"id":227,"text":"Yeah, not that well.","start":2358.68,"end":2359.24},{"id":228,"text":"I like that answer.","start":2359.24,"end":2359.86},{"id":229,"text":"Do you assign it to the cluster?","start":2360.56,"end":2362.4},{"id":230,"text":"Yeah, so one example is you have some guess of where these clusters are.","start":2363.2,"end":2367.28},{"id":231,"text":"You first label them as if they're kind of closer in that cluster with some probability.","start":2367.56,"end":2371.92},{"id":232,"text":"You have some guess of the sampling.","start":2372.1,"end":2373.2},{"id":233,"text":"and then you see now instead of how close they are in space you see how likely they are you","start":2373.2,"end":2380.24},{"id":234,"text":"update each point right to say is it likely how likely is it to be in each cluster and then you","start":2380.24,"end":2386.4},{"id":235,"text":"resolve the means back and forth that's what to keep in your head I'm gonna put some math on but","start":2386.4,"end":2391.1},{"id":236,"text":"that's the intuitions that intuition makes sense we'll see the math if it's not crystal clear what","start":2391.1,"end":2395.06},{"id":237,"text":"to do but at least the template should look a lot like k-means please what's the same shared","start":2395.06,"end":2401.92},{"id":238,"text":"variance that we have gda here oh wonderful point so yeah so you don't need to have the same shared","start":2401.92,"end":2407.26}],"notes":["本段讲解了在没有标签的情况下，如何通过随机分配和迭代更新来解决聚类问题。讲者提到，可以像K-Means一样，先随机分配点到簇，然后根据每个点属于各个簇的概率进行更新，最终调整簇中心。这种思路与高斯判别分析（GDA）类似，但不需要显式标签。","讲者强调，虽然没有标签，但可以通过概率模型来估计每个点属于各个簇的可能性，从而迭代优化簇中心。这种思想与K-Means相似，但更灵活，因为允许不同簇有不同的协方差结构。","讲者提到，如果已知标签，问题就变得简单，可以像GDA那样直接拟合高斯分布。但实际情况下，标签是未知的，因此需要通过迭代方法进行估计。","讲者指出，一种可能的解决方法是随机分配标签，然后根据点与簇中心的距离或概率进行更新。这种迭代过程类似于K-Means，但更复杂，因为它考虑了概率和不确定性。","讲者提到，虽然没有标签，但可以通过概率模型来估计每个点属于各个簇的可能性，从而调整簇中心。这种思想是混合高斯模型的核心，即每个点属于某个簇的概率是未知的，需要通过迭代优化。","讲者最后提到，混合高斯模型与K-Means有相似之处，但更复杂，因为它允许不同簇有不同的协方差结构。这种模型在没有标签的情况下，可以通过迭代优化来估计参数。"],"formulas":[],"uncertainties":["and then you see now instead of how close they are in space you see how likely they are you","update each point right to say is it likely how likely is it to be in each cluster and then you","resolve the means back and forth that's what to keep in your head I'm gonna put some math on but","that's the intuitions that intuition makes sense we'll see the math if it's not crystal clear what","to do but at least the template should look a lot like k-means please what's the same shared","variance that we have gda here oh wonderful point so yeah so you don't need to have the same shared"],"diagram":"none","start":2228.96,"end":2407.26,"asr_flags":[220],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2228.96,"text":"We then go to the right mean, and then we sample according to that Gaussian. And so I'm drawing them like they're in order, but they're really not in order. They're just like points that are sampled from each one of these. Now, when we look at these points, tch. You don't have to make that association, but just","start":2431.18,"end":2434.54},{"id":245,"text":"so you're trying to isolate what's new and what's not. All right, let's be a little bit more formal.","start":2434.54,"end":2440.22},{"id":246,"text":"So here's how we're going to do it in this 1D version. We're given x1 to xn that are in R","start":2441.58,"end":2447.54},{"id":247,"text":"and a positive integer k. This is what we're given as input to the problem.","start":2448.6,"end":2451.88},{"id":248,"text":"Our job is to find this function p, that for each data point i, 1 to n,","start":2453.1,"end":2457.54},{"id":249,"text":"and each source j from 1 to k, we find a soft assignment of the following form.","start":2457.66,"end":2462.26},{"id":250,"text":"So rather than doing the hard assignment, we say the probability that xi comes from source j","start":2462.78,"end":2467.32},{"id":251,"text":"is exactly this. This is just a table of numbers. For every point, imagine there's a k vector","start":2467.32,"end":2472.52},{"id":252,"text":"that says exactly where they come from. That's the way to think about it.","start":2472.52,"end":2476.76},{"id":253,"text":"Now this probability, if it were just wild, it's not really clear how to assign anything. So we","start":2479.02,"end":2486.0},{"id":254,"text":"need a model, a forward model. And I showed you that forward model on the last slide. Now I'm","start":2486.0,"end":2489.86},{"id":255,"text":"going to write it mathematically. Intuitively, it should pick which cluster it's from with some","start":2489.86,"end":2494.74},{"id":256,"text":"probability, and then it should sample from that cluster probability. So let's write that down and","start":2494.74,"end":2499.26},{"id":257,"text":"and see exactly how that works.","start":2499.26,"end":2500.36},{"id":258,"text":"There it is.","start":2502.12,"end":2502.84},{"id":259,"text":"It says the probability of x and zi","start":2503.66,"end":2505.84},{"id":260,"text":"is going to factor by Bayes' rule.","start":2505.84,"end":2507.28},{"id":261,"text":"That's not a controversial statement.","start":2507.76,"end":2509.84},{"id":262,"text":"The zis are basically going to be selected","start":2510.86,"end":2515.02},{"id":263,"text":"as a mixture of sources.","start":2515.02,"end":2516.22},{"id":264,"text":"So what it's going to say is it's multinomial.","start":2517.34,"end":2519.54},{"id":265,"text":"This is where we don't know the probability.","start":2519.72,"end":2521.48},{"id":266,"text":"But imagine you had a fixed probability.","start":2521.76,"end":2522.96},{"id":267,"text":"So you say it's 60% here, 40% there.","start":2523.24,"end":2525.1},{"id":268,"text":"You're going to pick 60% cluster 1, 40% cluster 2.","start":2525.3,"end":2528.62},{"id":269,"text":"You flip a coin with that bias. That gives you a cluster that you're looking at.","start":2528.62,"end":2533.08},{"id":270,"text":"And then, as was highlighted earlier, which was wonderful,","start":2533.6,"end":2536.14},{"id":271,"text":"given that you know which cluster you're in, you're in cluster J,","start":2536.64,"end":2538.96},{"id":272,"text":"you have a different mean and a different variance that you look up in your table","start":2539.4,"end":2543.78},{"id":273,"text":"and you produce Xi. And so I'm sorry if the colors are hard for you.","start":2544.48,"end":2547.58},{"id":274,"text":"But these things that are in blue, that are highlighted here,","start":2547.76,"end":2550.52},{"id":275,"text":"that are just a little bit different, those are the parameters that we're trying to estimate.","start":2550.6,"end":2553.84},{"id":276,"text":"So we call Zi the hidden or latent variable. These latent variable models are quite common. They're more sophisticated. We'll see more of them. It's where we assume there's some structure. It's latent or hidden because we don't observe it. We don't get to directly measure this. But we hypothesize that it's there, even though it's not directly observed, and it defines this. So if we knew which cluster it is, then it would tell us the mean and the variance. But of course, this is also a random sample.","start":2558.61,"end":2586.43}],"notes":["本段介绍了混合高斯模型（GMM）的基本概念，强调其与K-Means的不同之处在于使用软分配而非硬分配。讲者指出，GMM的模型结构包括隐变量（Zi），这些变量决定了数据点属于哪个簇，并且每个簇有其对应的均值和方差。"],"formulas":[{"latex":"p(x, z_i) = p(z_i) p(x | z_i)","symbols":"p(x, z_i) 表示数据点 x 和隐变量 z_i 的联合概率分布，p(z_i) 是隐变量的先验概率，p(x | z_i) 是给定隐变量 z_i 下数据点 x 的条件概率。","explanation":"公式正确，符合贝叶斯规则，联合概率分解为先验和条件概率的乘积。","evidence":"is going to factor by Bayes' rule. That's not a controversial statement. The zis are basically going to be selected as a mixture of sources. So what it's going to say is it's multinomial. This is where we don't know the probability. But imagine you had a fixed probability. So you say it's 60% here, 40% there. You're going to pick 60% cluster 1, 40% cluster 2. You flip a coin with that bias. That gives you a cluster that you're looking at. And then, as was highlighted earlier, which was wonderful, given that you know which cluster you're in, you're in cluster J, you have a different mean and a different variance that you look up in your table and you produce Xi. And so I'm sorry if the colors are hard for you. But these things that are in blue, that are highlighted here, that are just a little bit different, those are the parameters that we're trying to estimate. So we call Zi the hidden or latent variable. These latent variable models are quite common. They're more sophisticated. We'll see more of them. It's where we assume there's some structure. It's latent or hidden because we don't observe it. We don't get to directly measure this. But we hypothesize that it's there, even though it's not directly observed, and it defines this. So if we knew which cluster it is, then it would tell us the mean and the variance. But of course, this is also a random sample."}],"uncertainties":[],"diagram":"none","start":2407.26,"end":2586.43,"asr_flags":[] art":2489.86,"text":"going to write it mathematically. Intuitively, it should pick which cluster it's from with some"},{"start":2494.74,"text":"probability, and then it should sample from that cluster probability. So let's write that down and"},{"start":2499.26,"text":"and see exactly how that works."},{"start":2502.12,"text":"There it is."},{"start":2503.66,"text":"It says the probability of x and zi"},{"start":2505.84,"text":"is going to factor by Bayes' rule."},{"start":2507.76,"text":"That's not a controversial statement."},{"start":2510.86,"text":"The zis are basically going to be selected"},{"start":2515.02,"text":"as a mixture of sources."},{"start":2517.34,"text":"So what it's going to say is it's multinomial."},{"start":2519.72,"text":"This is where we don't know the probability."},{"start":2521.76,"text":"But imagine you had a fixed probability."},{"start":2523.24,"text":"So you say it's 60% here, 40% there."},{"start":2525.3,"text":"You're going to pick 60% cluster 1, 40% cluster 2."},{"start":2528.62,"text":"You flip a coin with that bias. That gives you a cluster that you're looking at."},{"start":2533.6,"text":"And then, as was highlighted earlier, which was wonderful,"},{"start":2536.64,"text":"given that you know which cluster you're in, you're in cluster J,"},{"start":2539.4,"text":"you have a different mean and a different variance that you look up in your table"},{"start":2544.48,"text":"and you produce Xi. And so I'm sorry if the colors are hard for you."},{"start":2547.76,"text":"But these things that are in blue, that are highlighted here,"},{"start":2550.6,"text":"that are just a little bit different, those are the parameters that we're trying to estimate."},{"start":2558.61,"text":"So we call Zi the hidden or latent variable. These latent variable models are quite common. They're more sophisticated. We'll see more of them. It's where we assume there's some structure. It's latent or hidden because we don't observe it. We don't get to directly measure this. But we hypothesize that it's there, even though it's not directly observed, and it defines this. So if we knew which cluster it is, then it would tell us the mean and the variance. But of course, this is also a random sample."}],"speech_gaps":[],"frame":"../frames/v040/015.webp","frame_time":2419.26},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":277,"text":"which is somewhere in the space. Is it clear how the forward model works? Please. Yeah, great question. So how should I think about how phi, this multinomial, actually changes?","start":2586.79,"end":2604.61},{"id":278,"text":"If you knew phi, that would correspond to knowing, let's say you have a phi that says 90 and 10, 90% in cluster one, 10% in cluster two. Then once you did that, you wouldn't need to do this kind of sample if you like at all. You'd be trying to learn this 90-10 weighted by this. We'll see where that comes out in the math. Here, we're actually going to be able to learn phi as well. So it's not really a prior. A prior would be if I told you the 90-10, but we're actually going to learn it. So it's not a prior. It's actually something we're going to estimate from the data.","start":2605.18,"end":2636.13},{"id":279,"text":"It's a totally reasonable thing to put in, little bits. Fantastic. OK. So we went through this. I'll just draw it out one more time just because I think it's illustrative and to stall a little bit for questions. So we had our mu. Oops, that's a terrible looking Gaussian, but you'll excuse it because you're very kind people. So how does it work? Again, back to it. I select zi with some probability. I guess I picked 0.7 and 0.3 here.","start":2636.8,"end":2674.66},{"id":280,"text":"I call that zi for this point that I'm generating. Let's say that I picked this particular cluster, then I sample from this unit normal, and I are this normal distribution, and I get this point. That's the forward generating process, and I do that for every single point. That's how I generate all xn points. Pick this way or this way, then sample. Clear enough how it works? Okay, cool.","start":2675.36,"end":2699.26},{"id":281,"text":"All right, so just to recap this to make sure it's super clear, given a set of parameters, we're going to assess how likely X1 and Xn are according to the GMM model. From that description I told you, one of the things is I can now write the probability of those points under various different parameters. So you give me two sets of parameters, I can score how likely the data are.","start":2704.55,"end":2725.96},{"id":282,"text":"and conceptually also get the likelihood function. That's what we were after before.","start":2726.64,"end":2730.56},{"id":283,"text":"Once we have a likelihood function, we kind of get back into the same framework.","start":2730.72,"end":2734.1},{"id":284,"text":"So the likelihood model, the GMM, is enough for us to estimate those parameters directly","start":2735.22,"end":2739.32},{"id":285,"text":"from the observed data. That's what we're going to try and figure out how to do.","start":2739.32,"end":2742.94},{"id":286,"text":"The twist here is that Zi is our first example of a latent model. We do not","start":2743.58,"end":2747.74},{"id":287,"text":"observe the value of Zi, but we know something about it. This is equivalent,","start":2747.74,"end":2751.76},{"id":288,"text":"really morally to there exist k clusters. That zi, although we don't","start":2751.76,"end":2756.26},{"id":289,"text":"observe it, says there exist these k sources and then we're going to sample","start":2756.26,"end":2759.62},{"id":290,"text":"from each of them. Clear enough how it works? Let's see an algorithm. It's","start":2759.62,"end":2766.04}],"notes":["本段讲解了混合高斯模型（GMM）中的隐变量（Zi）概念，指出Zi是未观测的，但代表了数据点属于不同聚类的概率。讲者强调，Zi的存在意味着数据点来源于多个潜在的分布，而这些分布的参数（如均值和方差）需要从数据中估计。","讲者通过一个具体的例子说明了如何从参数生成数据点的过程：首先根据Zi的概率选择聚类，然后从对应的高斯分布中采样得到数据点。这一过程是生成模型的核心，用于理解数据是如何从潜在分布中产生的。","讲者提到，GMM模型允许我们直接从观测数据中估计参数，而不需要像贝叶斯方法那样引入先验分布。这与传统的EM算法不同， ，并强调其与之前框架的联系。","讲者通过一个具体的例子，说明了如何利用phi参数来调整不同聚类的权重。当一个聚类生成的数据量远多于另一个聚类时，该点更可能属于生成更多数据的聚类。这体现了贝叶斯规则的应用，即通过先验概率调整后验概率。","讲者进一步解释了phi参数的结构，指出在有两个聚类的情况下，phi可以是标量，而在有m个聚类时，phi是一个向量，遵循多项式分布的性质。这说明了phi参数在不同情况下的表示方式。","讲者讨论了联合概率分布的性质，指出对于给定的xi和zi，对所有可能的类别求和时，概率总和应为1。这体现了条件概率的基本性质，即所有可能情况的概率总和为1。","讲者还提到，概率分布的分解方式，即先验分布与条件分布的乘积，这在贝叶斯推理中是关键的一步。通过这种方式，可以将数据点的分布分解为聚类的先验和条件分布。","最后，讲者提出了一个关于Zi概率的问题，暗示后续课程将深入探讨这一主题，强调了对概率分布和条件概率的理解在混合高斯模型中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2766.04,"end":2941.88,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2766.04,"text":"going to look like k-means but it's going to have a lot more math and then"},{"start":2768.78,"text":"in later lectures, maybe like Wednesday, I'm going to show you how it's actually"},{"start":2773.22,"text":"an MLE algorithm in disguise. So it is actually an instance of your old"},{"start":2776.52,"text":"framework."},{"start":2789.66,"text":"Wonderful question. All right, so let's go back. So the question is, how does this change? I think"},{"start":2793.76,"text":"you're asking, how does this change the estimation procedure? Let me get back, see if I have a"},{"start":2798.08,"text":"drawing. Sorry, I have to scroll so far back. All right, actually I'll just use this picture. All"},{"start":2802.92,"text":"All right. Give me one more second to look. If I can't find it, I will just draw it again."},{"start":2810.38,"text":"Okay. Here it is. This character. Okay. Let's go back and see how the phi might intuitively"},{"start":2815.76,"text":"expand our reasoning. And then when we do the math, I want you to check that this actually"},{"start":2819.42,"text":"works. I'm not lying to you. So let's imagine you have mu1 and mu2, and you have this one."},{"start":2824.28,"text":"And let's imagine I picked it exactly where the points cross. Then it seems like a coin flip."},{"start":2829.16,"text":"Should this point go to cluster two or should it go to cluster one?"},{"start":2835.48,"text":"If you knew cluster 2 generated 100 times more data than cluster 1, would you be more likely to say this came from cluster 2 or cluster 1? Cluster 2, right? Because you would say, oh, actually, cluster 2 is spitting off points. It's relatively rare, all things being equal. That inference you just did is Bayes' rule. And we're going to come to that exactly when we do this, that the phi is allowing us to do exactly that, to tell us that the observed counts are there. Please."},{"start":2861.26,"text":"In this example, it only has to be a scalar because there are two, and it's determined. The last component is determined. If you have m outcomes, you only have to have m minus 1 because they sum. But in general, yes, it would be a vector, a multinomial vector. Yeah, great points. Please. Can you do the slide 27? Probably not. Yes, I'll do my best. Sure. I think this is 27. Is this 27?"},{"start":2890.4,"text":"Yeah."},{"start":2890.82,"text":"Good."},{"start":2891.38,"text":"I was just wondering, so if you get the joint probability"},{"start":2894.04,"text":"of xi and zi, and you just take one specific xi,"},{"start":2899.48,"text":"sum over all the possible classes,"},{"start":2903.0,"text":"would that add up to equal one ?"},{"start":2906.58,"text":"It is a probability, yes."},{"start":2909.0,"text":"So let's come to that in just one minute"},{"start":2910.8,"text":"to see actually how these are operating on them."},{"start":2913.86,"text":"them. All this is saying is the probability distribution for xi, how"},{"start":2921.52,"text":"likely xi is, is factors as, which this is a tautology, says if you tell me what"},{"start":2926.54,"text":"the cluster is and you have a distribution over clusters, you weight"},{"start":2929.3,"text":"that, condition on that says if you're in this cluster, this is the likelihood I"},{"start":2932.8,"text":"assign to you. That integration over all the possibilities of xi is one because"},{"start":2936.36,"text":"because it's a conditional probability, and that's the weighting."},{"start":2938.88,"text":"I understand that, but is the probability of ZI, let's say,"}],"speech_gaps":[{"start":2779.344,"end":2788.944}],"frame":"../frames/v040/017.webp","frame_time":2778.04},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":322,"text":"is 0.7, 0.3, and then you're further diluting that with the normal,","start":2941.88,"end":2947.02},{"id":323,"text":"and that's the probability of a specific combination of ZI and ZI,","start":2947.16,"end":2950.38},{"id":324,"text":"or something like that?","start":2950.56,"end":2952.12},{"id":325,"text":"Yeah, so what is confusing to you about this is these are total probabilities","start":2952.54,"end":2960.2},{"id":326,"text":"that are here, that are there.","start":2960.2,"end":2961.96},{"id":327,"text":"So you're going to have to sum over all of the ZIs that come into this,","start":2962.12,"end":2966.18},{"id":328,"text":"and integrate over all the xi's that come into this. That would be the same that you would do","start":2966.18,"end":2971.16},{"id":329,"text":"here. It's a joint probability. Yeah, so that sums to one. They don't individually sum to one in the","start":2971.16,"end":2976.96},{"id":330,"text":"way that like if you just fixed one value and did the rest. Yeah, great point, great point.","start":2976.96,"end":2981.68},{"id":331,"text":"Okay, oh yeah, so there's a math coming. Okay, I believe we're here. You tell me if I'm wrong.","start":2984.56,"end":2993.14},{"id":332,"text":"All right, yeah, we're here.","start":2995.04,"end":2995.98},{"id":333,"text":"Okay, cool.","start":2996.12,"end":2996.66},{"id":334,"text":"These are phenomenal questions.","start":2997.4,"end":2998.42},{"id":335,"text":"Please keep asking, right?","start":2998.6,"end":2999.7},{"id":336,"text":"We are in no rush to cover them.","start":2999.96,"end":3001.34},{"id":337,"text":"By all means, it's more important. All right. So here's how EM works. We talked about it at a high level. We're now going to go one little click down. So the E step, which I am highlighting for later, that terminology will make more sense later, but I want to build to it. We're going to guess the latent value for Zi. So for each point i1 to n, we're going to get a probability over which source it's likely to have come from.","start":3002.23,"end":3025.01},{"id":338,"text":"The M-step, given that estimation, we're then going to update all the parameters, all the mus and the sigmas and the phis. And that's going to tell us that's the step where we're consolidating the cluster means. This is where we're doing estimation instead of cluster means. And then we're going to try and use that to estimate, given where we think the clusters are, how likely each point is. Back and forth, back and forth. So let's do each step in detail. Schema of the algorithm should look a lot like K-means.","start":3027.39,"end":3055.12},{"id":339,"text":"Right? It's kind of the same thing that's going on, just with this more probabilistic take. So let's walk through what they are, and hopefully this will become clear. So what you're given in the E-step, you're given x1 to xn, and then you're given some current estimate of your parameters. So the parameters are telling you how likely every bump is, every source is. The means and the variances, picture the circles.","start":3055.91,"end":3078.55},{"id":340,"text":"And then the idea is for each data point and each cluster, you're going to try and estimate how likely the probability that's there. And so you're going to write wij in terms of all the parameters that are there. So far so good? Okay. So how does that happen? So this is what we're after. How does this happen? So we're going to decompose it with Bayes' rule.","start":3079.64,"end":3108.18}],"notes":["本段讨论了概率分布的组合问题，讲者提到0.7和0.3的数值，然后进一步用正态分布进行稀释，这可能是指在混合高斯模型中，不同成分的概率权重。讲者提到‘specific combination of ZI and ZI’，这可能是指对ZI的某种组合概率，但具体含义需要结合上下文进一步明确。","讲者指出，这些概率是总概率，而不是单独某个值的概率。这说明在混合高斯模型中，每个数据点属于某个簇的概率是联合概率，需要对所有可能的ZI进行求和，对所有可能的xi进行积分。","讲者强调，这些概率并不像固定一个值后求其他值那样单独求和，而是整体上满足概率总和为1的条件。这说明在混合高斯模型中，每个数据点的归属概率是联合分布的一部分，需要整体考虑。","讲者提到EM算法的E步和M步，E步是估计潜在变量Zi的概率，M步是更新参数如均值、方差和混合权重。这说明EM算法的两个步骤分别负责估计潜在变量和更新模型参数。","讲者指出，EM算法的E步和M步是交替进行的，类似于K-means算法，但更具有概率性。这说明EM算法在结构上与K-means相似，但通过概率方法进行更精细的聚类。","讲者提到使用贝叶斯规则来分解概率，这表明在E步中，需要利用贝叶斯定理来计算每个数据点属于各个簇的概率。"],"formulas":[],"uncertainties":["ZI的组合概率具体含义不明确","‘diluting that with the normal’的具体数学含义不明确","‘specific combination of ZI and ZI’的重复可能为笔误"],"diagram":"none","start":2941.88,"end":3108.18,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2941.88,"text":"is 0.7, 0.3, and then you're further diluting that with the normal,"},{"start":2947.16,"text":"and that's the probability of a specific combination of ZI and ZI,"},{"start":2950.56,"text":"or something like that?"},{"start":2952.54,"text":"Yeah, so what is confusing to you about this is these are total probabilities"},{"start":2960.2,"text":"that are here, that are there."},{"start":2962.12,"text":"So you're going to have to sum over all of the ZIs that come into this,"},{"start":2966.18,"text":"and integrate over all the xi's that come into this. That would be the same that you would do"},{"start":2971.16,"text":"here. It's a joint probability. Yeah, so that sums to one. They don't individually sum to one in the"},{"start":2976.96,"text":"way that like if you just fixed one value and did the rest. Yeah, great point, great point."},{"start":2984.56,"text":"Okay, oh yeah, so there's a math coming. Okay, I believe we're here. You tell me if I'm wrong."},{"start":2995.04,"text":"All right, yeah, we're here."},{"start":2996.12,"text":"Okay, cool."},{"start":2997.4,"text":"These are phenomenal questions."},{"start":2998.6,"text":"Please keep asking, right?"},{"start":2999.96,"text":"We are in no rush to cover them."},{"start":3002.23,"text":"By all means, it's more important. All right. So here's how EM works. We talked about it at a high level. We're now going to go one little click down. So the E step, which I am highlighting for later, that terminology will make more sense later, but I want to build to it. We're going to guess the latent value for Zi. So for each point i1 to n, we're going to get a probability over which source it's likely to have come from."},{"start":3027.39,"text":"The M-step, given that estimation, we're then going to update all the parameters, all the mus and the sigmas and the phis. And that's going to tell us that's the step where we're consolidating the cluster means. This is where we're doing estimation instead of cluster means. And then we're going to try and use that to estimate, given where we think the clusters are, how likely each point is. Back and forth, back and forth. So let's do each step in detail. Schema of the algorithm should look a lot like K-means."},{"start":3055.91,"text":"Right? It's kind of the same thing that's going on, just with this more probabilistic take. So let's walk through what they are, and hopefully this will become clear. So what you're given in the E-step, you're given x1 to xn, and then you're given some current estimate of your parameters. So the parameters are telling you how likely every bump is, every source is. The means and the variances, picture the circles."},{"start":3079.64,"text":"And then the idea is for each data point and each cluster, you're going to try and estimate how likely the probability that's there. And so you're going to write wij in terms of all the parameters that are there. So far so good? Okay. So how does that happen? So this is what we're after. How does this happen? So we're going to decompose it with Bayes' rule."}],"speech_gaps":[],"frame":"../frames/v040/018.webp","frame_time":2953.88},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":341,"text":"This basically says this conditional probability, we're going to look at the joint total probability of xi and zi conditioned on all these parameters. So far, we haven't done anything. This is pure syntax. We're then going to split conditionally on z. So we're basically trying to, what's going on here intuitively is, we have a model that goes in the other direction, if you like, where we have one that's z conditioned on x, and we're going to try and go to x conditioned on z. That's all that's happening in these slides.","start":3109.16,"end":3138.02},{"id":342,"text":"This is kind of a standard argument. It seems weird the first time you're seeing it. I appreciate that. But this is all we're going to do. We have a model that's forward. We want to invert it conceptually so that we can go estimate the parameters. And then we apply Bayes' rule one more time. We sum over all the possible clusters.","start":3138.43,"end":3158.48},{"id":343,"text":"So we're looking at one particular clustering, which is for some point I in cluster J. And we say, how likely is this cluster? Or what is this Wij? Well, we just normalize by looking at all the probabilities across all of them and expand over all. This is summing over all the possible clusters. That's what L is doing here. All right. Now, the key point is all of these terms are computable directly from the parameters we saw on the last slide.","start":3159.62,"end":3188.56},{"id":344,"text":"Now that we've done the decomposition, it's in the model framework. These conditional probabilities in this form are all just going to be these normals. So you know exactly how to write that out. I could write out x of this and all the rest. You know how to do that. The probability here, you know this. You just substitute in the natural parameter, and that will give you these numbers here. So the point is, the point that you should be hopefully convinced by is, this Wij is nothing more than rewriting it directly in the model with a couple applications of Bayes' rule.","start":3189.12,"end":3218.2},{"id":345,"text":"It really is the estimation. And this may seem mysterious because there's all this terrible notation everywhere. But when we were informally reasoning earlier about how likely a point is, I'm like, this is Bayes' rule. This is what we're doing. We just inverted it. Cool. All right. At that point, we now have an estimate in the M-step for how likely every point is to belong to a cluster, given our current guess.","start":3219.28,"end":3247.81},{"id":346,"text":"of everything, the phi's, the means, everything, all the shapes. Now what we're going to do is same thing we did in k-means. What do we do in k-means? We then try to compute the new mean based on what we thought was in the cluster. Now we have a likelihood, so it's a softer version, but we have to then go ahead and compute where's the mean of that thing? What is the fraction of elements that are present? That's the phi. So what is the fraction of elements from source j? Well,","start":3248.46,"end":3276.22}],"notes":["本段讲解了如何通过条件概率和贝叶斯规则来推导混合高斯模型中的参数估计。讲者提到，我们从一个模型出发，该模型是基于数据点x来预测隐变量z，现在需要反过来，从z来预测x。这涉及到对联合概率的分解，并通过条件概率进行拆分。","讲者指出，这种推导过程虽然在第一次接触时看起来奇怪，但实际上是标准的数学推导。通过应用贝叶斯规则，我们对所有可能的聚类进行求和，从而得到最终的后验概率。这一步是模型推导的关键。","在具体计算中，讲者提到Wij表示某个点属于某个聚类的概率，这需要通过对所有聚类的概率进行归一化处理。所有这些计算都可以直接从上一张幻灯片中提到的参数中得出。","讲者进一步说明，这些条件概率在模型中可以表示为高斯分布，因此可以直接写出具体的概率表达式。通过代入自然参数，可以得到具体的数值结果。","讲者强调，这种推导过程虽然涉及大量符号，但本质上是贝叶斯规则的应用。通过这种推导，我们可以得到每个点属于各个聚类的概率估计。","最后，讲者提到在M步中，我们需要根据当前的估计来计算新的均值。这类似于K-means算法中的步骤，但在这里是基于概率的软分配，而不是硬分配。"],"formulas":[],"uncertainties":["of everything, the phi's, the means, everything, all the shapes."],"diagram":"none","start":3109.16,"end":3276.22,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3109.16,"text":"This basically says this conditional probability, we're going to look at the joint total probability of xi and zi conditioned on all these parameters. So far, we haven't done anything. This is pure syntax. We're then going to split conditionally on z. So we're basically trying to, what's going on here intuitively is, we have a model that goes in the other direction, if you like, where we have one that's z conditioned on x, and we're going to try and go to x conditioned on z. That's all that's happening in these slides."},{"start":3138.43,"text":"This is kind of a standard argument. It seems weird the first time you're seeing it. I appreciate that. But this is all we're going to do. We have a model that's forward. We want to invert it conceptually so that we can go estimate the parameters. And then we apply Bayes' rule one more time. We sum over all the possible clusters."},{"start":3159.62,"text":"So we're looking at one particular clustering, which is for some point I in cluster J. And we say, how likely is this cluster? Or what is this Wij? Well, we just normalize by looking at all the probabilities across all of them and expand over all. This is summing over all the possible clusters. That's what L is doing here. All right. Now, the key point is all of these terms are computable directly from the parameters we saw on the last slide."},{"start":3189.12,"text":"Now that we've done the decomposition, it's in the model framework. These conditional probabilities in this form are all just going to be these normals. So you know exactly how to write that out. I could write out x of this and all the rest. You know how to do that. The probability here, you know this. You just substitute in the natural parameter, and that will give you these numbers here. So the point is, the point that you should be hopefully convinced by is, this Wij is nothing more than rewriting it directly in the model with a couple applications of Bayes' rule."},{"start":3219.28,"text":"It really is the estimation. And this may seem mysterious because there's all this terrible notation everywhere. But when we were informally reasoning earlier about how likely a point is, I'm like, this is Bayes' rule. This is what we're doing. We just inverted it. Cool. All right. At that point, we now have an estimate in the M-step for how likely every point is to belong to a cluster, given our current guess."},{"start":3248.46,"text":"of everything, the phi's, the means, everything, all the shapes. Now what we're going to do is same thing we did in k-means. What do we do in k-means? We then try to compute the new mean based on what we thought was in the cluster. Now we have a likelihood, so it's a softer version, but we have to then go ahead and compute where's the mean of that thing? What is the fraction of elements that are present? That's the phi. So what is the fraction of elements from source j? Well,"}],"speech_gaps":[],"frame":"../frames/v040/019.webp","frame_time":3121.16},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":347,"text":"It's the expected value. Now, this may seem ad hoc to you or may seem natural to you. We will derive why it's that estimate. But intuitively, you're estimating this mean or the fraction. What it's saying is this says","start":3277.96,"end":3293.45},{"id":348,"text":"How many points are in J? If it were 0 or 1, this would be actually the fraction of points that are in there, right? If you knew precisely every single point in which cluster it was, this would be the exact fraction of points. But because we only know it probabilistically, so we know that it's in cluster 1 and cluster 2, but it's definitely not in cluster 3. So we know 1 and 2, 50%, it counts a half to one cluster and a half to another. That's the difference from K-mean. That's all it's saying.","start":3294.47,"end":3320.38},{"id":349,"text":"Then when we compute the means, because we also don't know perfectly which points are there, we compute them in a weighted way by exactly those weights and probabilities. So before, if we had, for example, those two points that were uncertain, it computes kind of half to one cluster and half in the other. And then we normalize so that we get, this is the sum, over all the weights that are there. So we get a proper mean, a weighted mean.","start":3323.02,"end":3351.05},{"id":350,"text":"If all these were zeros and ones, this would look exactly like k-means, right? This would be your mean assignments that we had from before. We didn't have to estimate the fraction in k-means, but now we do. If these were zero, one, convince yourself that this would exactly be the same mean that we were computing in k-mean, the centroid that we were doing. Awesome. Okay. So on that, how does this work? Okay. So any questions, please? Yeah.","start":3351.44,"end":3390.07},{"id":351,"text":"Oh yeah, sigma is updated here too. We will come back to the actual form to estimate sigma, but it's exactly the empirical way that you would imagine to do it. I just didn't derive it here. I may derive it a little bit later. But yeah, so the question was, you hit all these sigmas for me. We also have to estimate the sigmas. And intuitively, they will follow exactly this framework of you're going to look at the outer products of the xi's, weighted, and you're going to take their average. We'll talk exactly about how to do that estimation.","start":3392.33,"end":3420.99},{"id":352,"text":"Very good catch. All of these parameters need to be estimated. Then what do we do? After we do the E step, we do the M step, then what happens? We do the E step again. We do the M step again. We iterate, we iterate, and we iterate. It looks a lot like k-means if you think about it. So far so good? There is an example in the notes of running these particular points.","start":3421.87,"end":3452.7}],"notes":["本段讲解了在混合高斯模型中，如何通过概率权重来计算均值。与K-Means不同，这里不是直接分配每个点到某个簇，而是根据概率来计算每个簇的加权均值。例如，如果一个点有50%的概率属于簇1和50%的概率属于簇2，那么它对这两个簇的均值都会产生贡献，这种加权方式使得模型能够处理不确定性。","在计算均值时，需要对所有点的权重进行归一化，以确保得到的是一个有效的加权均值。这与K-Means中的硬分配不同，K-Means中每个点只能属于一个簇，而这里则是软分配，每个点可以属于多个簇。","当所有权重都是0或1时，混合高斯模型的计算方式会退化为K-Means。此时，每个点被明确分配到某个簇，均值的计算方式与K-Means相同，即计算每个簇中所有点的平均值。","在混合高斯模型中，除了均值外，还需要估计方差（sigma）。这通常通过计算加权的外积的平均值来实现，类似于K-Means中计算簇内点的方差。","在参数估计过程中，需要交替进行E步和M步。E步负责计算后验概率，M步负责最大化似然函数，从而更新参数。这个过程会不断迭代，直到参数收敛。","混合高斯模型与K-Means在结构上相似，但前者能够处理不确定性，而后者则是硬分配。这种软分配的特性使得混合高斯模型在处理复杂数据时更具灵活性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3277.96,"end":3452.7,"asr_flags":[],"math_clarifications":["公式$E[\\frac{1}{N}\\sum_{i=1}^{N} w_i x_i]$中未明确随机变量的定义，权重$w_i$的分布或计算方式也未说明，因此无法确定其数学含义，需移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3277.96,"text":"It's the expected value. Now, this may seem ad hoc to you or may seem natural to you. We will derive why it's that estimate. But intuitively, you're estimating this mean or the fraction. What it's saying is this says"},{"start":3294.47,"text":"How many points are in J? If it were 0 or 1, this would be actually the fraction of points that are in there, right? If you knew precisely every single point in which cluster it was, this would be the exact fraction of points. But because we only know it probabilistically, so we know that it's in cluster 1 and cluster 2, but it's definitely not in cluster 3. So we know 1 and 2, 50%, it counts a half to one cluster and a half to another. That's the difference from K-mean. That's all it's saying."},{"start":3323.02,"text":"Then when we compute the means, because we also don't know perfectly which points are there, we compute them in a weighted way by exactly those weights and probabilities. So before, if we had, for example, those two points that were uncertain, it computes kind of half to one cluster and half in the other. And then we normalize so that we get, this is the sum, over all the weights that are there. So we get a proper mean, a weighted mean."},{"start":3351.44,"text":"If all these were zeros and ones, this would look exactly like k-means, right? This would be your mean assignments that we had from before. We didn't have to estimate the fraction in k-means, but now we do. If these were zero, one, convince yourself that this would exactly be the same mean that we were computing in k-mean, the centroid that we were doing. Awesome. Okay. So on that, how does this work? Okay. So any questions, please? Yeah."},{"start":3392.33,"text":"Oh yeah, sigma is updated here too. We will come back to the actual form to estimate sigma, but it's exactly the empirical way that you would imagine to do it. I just didn't derive it here. I may derive it a little bit later. But yeah, so the question was, you hit all these sigmas for me. We also have to estimate the sigmas. And intuitively, they will follow exactly this framework of you're going to look at the outer products of the xi's, weighted, and you're going to take their average. We'll talk exactly about how to do that estimation."},{"start":3421.87,"text":"Very good catch. All of these parameters need to be estimated. Then what do we do? After we do the E step, we do the M step, then what happens? We do the E step again. We do the M step again. We iterate, we iterate, and we iterate. It looks a lot like k-means if you think about it. So far so good? There is an example in the notes of running these particular points."}],"speech_gaps":[],"frame":"../frames/v040/020.webp","frame_time":3289.96},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":353,"text":"and how they look in E steps and M steps that are in the notes, but they didn't render here because of my mistake. And so there's a whole diagram that's in here that I would advise you to look at. I would say the content, intellectual content is not very high. It looks just like the other things. You start with the centers. You move the centers and which points are there.","start":3454.2,"end":3474.3},{"id":354,"text":"then what happens that's different in k-means is you... I'll just draw this piece because it's probably better than gesturing in my hands. So let's say that you had a bunch of points over here, and I'm drawing them in red because I'm saying you thought that these were the points that are really likely to be red and blue and so on. And this guy is kind of purple, right? When you go to compute the means for this, you're going to compute the means, and as I was just pointing out, you're going to compute the sigmas. You're going to compute the shape of these points and their center.","start":3474.86,"end":3503.94},{"id":355,"text":"from the given set of points that you tell me are red, and with what probability, in that weighted way. And so if you picture it as it's going, it's figuring out the shapes and the locations of all the sources on every iteration, then uses those shapes and iterations to rescore all the points. The next iteration, it's probably going to say, oh, that's pretty likely that this is actually from there. If, however,","start":3504.57,"end":3525.71},{"id":356,"text":"this red thing had been super long, okay? All these points are in red and this is what it thought. And it thought it was a very narrow thing so that this distance became meaningful, right? So that it's an exponential with a very tight variance in one direction. Then at some point that variance gets so tight that this thing gets kicked over there. Clear enough how it works? Please ask a question. That was kind of an ad hoc on-the-fly explanation. I'm sure it left a lot to be desired. All right.","start":3526.69,"end":3556.8},{"id":357,"text":"Feel free to ask me. Okay. All right. Okay. So at this stage.","start":3557.96,"end":3565.9},{"id":358,"text":"What am I going to do next? So what I'm going to do next is I'm going to tell you about this little detour through something called Jensen's inequality and remind you about convexity. And the reason I'm going to remind you about convexity is we're going to use it in one key step of the proof that otherwise seems to cause a lot of confusion. It is literally the definition of convexity that we're going to use, and that's going to allow us to do the entire estimation procedure for what we're doing.","start":3567.77,"end":3589.47},{"id":359,"  going to use that as our next guess. That's going to be theta 1. Okay? Okay."},{"start":4372.97,"text":"So I'm going to come back to that as I write the property. So L of t of theta is going to always be less than L of theta, okay? It's a lower bound. And it's tight in the sense that L of t of theta of L of t equals L of theta t. Whoops. Sound good? That's just the picture, right? Now, when I optimize this character, I'm going to get a new theta 1."},{"start":4404.8,"text":"This is supposed to be the local max that I just drew. It's debatable, but I'm going to claim it is. Then what do I do with theta1? I do the same process again. I go back up here. I construct a new character, which I'll call l1. Maybe I'll draw it even. I'll use even a different color. Here. And then I optimize this character. And again and again I go. Okay? And these are the alternating steps that we're going to do. And our hope"},{"start":4438.69,"text":"To be really clear, our hope, which right now is nothing more than hope, is that LT of theta is easier somehow to compute argmax. Compute argmax theta LT theta, which is going to be here theta t plus 1 unless I've messed up the notation badly, but you'll correct me. So far so good? Okay? Now, the E step is given theta t."},{"start":4481.48,"text":"That is, all the parameters, all the cluster sizes, the mus, the sigmas,"},{"start":4487.68,"text":"it finds L of t theta, which seems like a weird way to think about it now,"}],"speech_gaps":[],"frame":"../frames/v040/026.webp","frame_time":4325.65},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":456,"text":"but it's finding that curve, that likelihood curve, right?","start":4492.02,"end":4494.3},{"id":457,"text":"So L of theta, it's the likelihood that given those parameters are all there.","start":4494.44,"end":4498.0},{"id":458,"text":"And then the M step, what does it do?","start":4498.32,"end":4500.24},{"id":459,"text":"It then uses that L of t in the other direction, says given L of t,","start":4500.8,"end":4503.92},{"id":460,"text":"it does this, finds theta t plus 1.","start":4505.52,"end":4508.28},{"id":461,"text":"And it alternates that and the picture goes up until it finds something. Now,","start":4508.28,"end":4515.38},{"id":462,"text":"there's some things you can trust about my picture and it will hopefully lead you things.","start":4518.14,"end":4521.9},{"id":463,"text":"Do you think this algorithm finds a global minimum or global maximum? I guess we're","start":4523.12,"end":4529.12},{"id":464,"text":"doing maximum. No, most certainly not. This is hinted at here. Maybe this character goes way","start":4529.12,"end":4533.18},{"id":465,"text":"off into the sky, right? But also, you wouldn't expect it to because when we reduce it to that","start":4533.18,"end":4538.54},{"id":466,"text":"0, 1 case, we saw that was a problem for k-means. So we would expect the same thing should happen","start":4538.54,"end":4542.1},{"id":467,"text":"here. All right. Now, what we're going to see next time is we're going to come back to exactly","start":4542.1,"end":4551.22},{"id":468,"text":"this picture, hopefully drawn a little bit better. But here we are where we are. We're going to come","start":4551.22,"end":4556.6},{"id":469,"text":"back to this on Wednesday, and we're going to start to see the entire derivation for how this","start":4556.6,"end":4560.24},{"id":470,"text":"algorithm works in terms of this EM framework. And that's going to tell us exactly how it converges.","start":4560.24,"end":4565.72},{"id":471,"text":"And the story is... I hate to undersell the lecture so dramatically. It's going to be","start":4565.78,"end":4570.96},{"id":472,"text":"hopefully totally transparent. You do the estimation, then you do what looks like a","start":4570.96,"end":4576.04},{"id":473,"text":"little bit of a gradient descent or a gradient rule. You fix the parameters back and forth,","start":4576.04,"end":4579.92},{"id":474,"text":"back and forth, and you have yourself an estimate. Thanks so much. I'll see you guys on Wednesday.","start":4579.92,"end":4584.0}],"notes":["本段讨论了最大似然函数 L(theta) 的定义，即在给定参数的情况下，数据的似然性。讲者指出，L(theta) 是在参数已知时，数据出现的概率。这为后续的 M 步骤提供了基础，即在 E 步骤中计算出的后验概率用于更新参数。","讲者提到 M 步骤的作用是利用 L(theta) 来找到新的参数估计 theta_{t+1}，并指出算法通过交替进行 E 步骤和 M 步骤来逐步优化参数。这种交替过程会持续进行，直到算法收敛。","讲者强调了该算法不会找到全局最小值或最大值，而是可能陷入局部最优。这一点在 K-Means 中已经观察到，因此在混合高斯模型中也应存在类似问题。","讲者提到下一次课程将回到这个图像，并详细推导该算法在 EM 框架下的工作原理，这将解释算法如何收敛。这表明课程将深入探讨 EM 算法的数学基础。","讲者最后提到，虽然课程内容可能看起来有些抽象，但希望讲解能够清晰透明，通过估计和梯度下降等步骤，逐步得到参数估计。","讲者以感谢结束，并预告下一次课程的时间，表明课程安排有计划性，且内容逐步推进。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4492.02,"end":4584.0,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4492.02,"text":"but it's finding that curve, that likelihood curve, right?"},{"start":4494.44,"text":"So L of t theta, it's the likelihood that given those parameters are all there."},{"start":4498.32,"text":"And then the M step, what does it do?"},{"start":4500.8,"text":"It then uses that L of t in the other direction, says given L of t,"},{"start":4505.52,"text":"it does this, finds theta t plus 1."},{"start":4508.28,"text":"And it alternates that and the picture goes up until it finds something. Now,"},{"start":4518.14,"text":"there's some things you can trust about my picture and it will hopefully lead you things."},{"start":4523.12,"text":"Do you think this algorithm finds a global minimum or global maximum? I guess we're"},{"start":4529.12,"text":"doing maximum. No, most certainly not. This is hinted at here. Maybe this character goes way"},{"start":4533.18,"text":"off into the sky, right? But also, you wouldn't expect it to because when we reduce it to that"},{"start":4538.54,"text":"0, 1 case, we saw that was a problem for k-means. So we would expect the same thing should happen"},{"start":4542.1,"text":"here. All right. Now, what we're going to see next time is we're going to come back to exactly"},{"start":4551.22,"text":"this picture, hopefully drawn a little bit better. But here we are where we are. We're going to come"},{"start":4556.6,"text":"back to this on Wednesday, and we're going to start to see the entire derivation for how this"},{"start":4560.24,"text":"algorithm works in terms of this EM framework. And that's going to tell us exactly how it converges."},{"start":4565.78,"text":"And the story is... I hate to undersell the lecture so dramatically. It's going to be"},{"start":4570.96,"text":"hopefully totally transparent. You do the estimation, then you do what looks like a"},{"start":4576.04,"text":"little bit of a gradient descent or a gradient rule. You fix the parameters back and forth,"},{"start":4579.92,"text":"back and forth, and you have yourself an estimate. Thanks so much. I'll see you guys on Wednesday."}],"speech_gaps":[],"frame":"../frames/v040/027.webp","frame_time":4504.02}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
