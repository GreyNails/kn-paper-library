a?","zh":"因此，你是在尝试估计一个比pi beta更好的策略pi的价值v pi。因此，你实际上是故意高估v pi beta。问题是，因为我们将在逐步改进策略，是否应该逐步降低lambda？","start":3834.85,"end":3859.34},{"id":316,"text":"So we're not actually collecting data from our policy. And so all the data is coming from our offline data set. And in that case, it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy. Now, if you did in principle actually do...","zh":"我们实际上并不是从我们的策略中收集数据。因此，所有的数据都来自我们的离线数据集。在这种情况下，保持lambda恒定是有意义的，因为你总是希望比行为策略好一个固定量。现在，如果你实际上进行数据收集，","start":3860.28,"end":3877.06},{"id":317,"text":"start collecting some online data, then things will change a little bit because then you'll actually be skewing your data set to a better policy. And in that case, it actually might make sense potentially to bring Lambda closer to 0, or sorry, closer to 0.5, because you'll then have data from a better policy, a policy better than your behavior policy.","zh":"那么情况会有一些变化，因为那时你实际上会将数据集偏向于一个更好的策略。在这种情况下，实际上可能有意义的是将lambda更接近0，或者抱歉，更接近0.5，因为你将拥有一个比行为策略更好的策略的数据。","start":3877.64,"end":3898.74},{"id":318,"text":"So pros of this algorithm, we don't need to query out of distribution actions. The policy is still only trained on actions in the data. And we're decoupling actor and critic training. So we just do this, this critic training. We're fitting a value function and a Q function on our data. And then once we're done with that, and that's kind of converged or we've done enough training, then we train our policy. Cool. This is an algorithm called the implicit Q learning.","zh":"所以这个算法的优点是我们不需要查询分布外的动作。策略仍然只在数据中的动作上进行训练。我们还解耦了演员和评论家的训练。因此我们只需进行这种评论家的训练。我们在数据上拟合一个价值函数和一个Q函数。一旦完成这些，或者训练足够多之后，我们再训练我们的策略。很好。这个算法叫做隐式Q学习。","start":3900.53,"end":3927.5}],"notes":["本段讨论了离线强化学习中价值函数和Q函数的拟合方法，使用了期望损失（expectile loss）来拟合价值函数。接着，通过Q函数和价值函数的差值估计优势函数，并使用AWR方法生成策略，其中权重由Q减去V的指数形式决定。","讲者指出，该算法不会输入不在数据集中的动作，这是之前过估计的一个主要来源。因此，该算法在离线设置中避免了过估计的问题。","讲者提到，lambda的设置会影响过估计的程度。如果lambda设为0，可能会导致过估计。通常选择0.2或0.3这样的中间值，以避免过度估计。这是因为算法试图估计比行为策略更好的策略的价值函数。","讲者进一步说明，由于策略会逐步改进，是否应该逐步减小lambda值得探讨。如果使用在线数据，可能会改变数据集的分布，此时lambda可能需要调整到0.5附近。","讲者总结了该算法的优点，包括不需要查询分布外的动作，策略仅基于数据集中的动作进行训练，并且将演员（actor）和评论家（critic）的训练过程解耦。","最后，讲者提到该算法被称为隐式Q学习（implicit Q learning），强调了其在离线强化学习中的应用价值。"],"formulas":[],"uncertainties":["expeditiated Q minus V（可能为'expected Q minus V'的误听）","lambda的设置（可能为'lambda'的误听）"],"diagram":"none","start":3762.38,"end":3927.5,"asr_flags":[],"math_clarifications":["优势函数A通常定义为Q(s, a) - V(s)，其中Q(s, a)是状态-动作对(s, a)的预期回报，V(s)是状态s的价值。但此处未明确说明A是针对特定动作a的，且未提及期望或条件，因此公式不完整。","价值函数v_π通常定义为从状态s开始，遵循策略π的累积折扣奖励的期望值，即v_π(s) = \\mathbb{E}_{\\pi} [\\sum_{t=0}^{\\infty} \\gamma^t r_t | s_0 = s]。但此处未明确说明是累积奖励还是单步奖励，且未提及折扣因子γ，因此公式不完整。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3762.38,"text":"So we'll be fitting both a value function and a Q function, and we'll just be using this expectile loss for fitting the value function. And then once we have our Q function and value function, then we could estimate the advantage as Q minus V and use the same kind of AWR method to get a policy where we're weighting the likelihoods by the expeditiated Q minus V."},{"start":3790.54,"text":"Yeah, so the question is, will we be overestimating the value in this case? So one thing to note about this algorithm is we're never going to be passing as input actions that are not in the data. And that was one of the major sources of overestimation before."},{"start":3806.36,"text":"Now, depending on how you set lambda, if you set lambda to be like zero, then you will overestimate probably. And there is a, typically you'll choose some value that's kind of maybe 0.2 or 0.3, something like that's more in the middle that's not so aggressive. And you will be getting an overestimate of the pi beta. And the reason for that is you're actually trying to estimate the value of a policy that's better than pi beta."},{"start":3834.85,"text":"So you're trying to estimate v pi for a policy pi that's better than pi beta. So you're kind of purposefully overestimating v pi beta. The question is, because we're going to be gradually improving our policy, would it make sense to gradually decrease lambda?"},{"start":3860.28,"text":"So we're not actually collecting data from our policy. And so all the data is coming from our offline data set. And in that case, it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy. Now, if you did in principle actually do..."},{"start":3877.64,"text":"start collecting some online data, then things will change a little bit because then you'll actually be skewing your data set to a better policy. And in that case, it actually might make sense potentially to bring Lambda closer to 0, or sorry, closer to 0.5, because you'll then have data from a better policy, a policy better than your behavior policy."},{"start":3900.53,"text":"So pros of this algorithm, we don't need to query out of distribution actions. The policy is still only trained on actions in the data. And we're decoupling actor and critic training. So we just do this, this critic training. We're fitting a value function and a Q function on our data. And then once we're done with that, and that's kind of converged or we've done enough training, then we train our policy. Cool. This is an algorithm called the implicit Q learning."}],"speech_gaps":[],"frame":"../frames/v034/023.webp","frame_time":3774.38},{"title":"离线强化学习（Offline RL）","segments":[{"id":319,"text":"Yeah, so the question is, where are we fitting Q? So we could also use Monte Carlo returns with this and use the expectile objective with this term. It's nice to use Q because Q is lower variance than this sum of rewards right here. And we can fit a Q function using the bootstrapped backups.","zh":"是的，所以问题是，我们是在哪里拟合Q函数？我们也可以使用蒙特卡洛回报与这个项结合，并使用期望目标函数。使用Q函数很好，因为Q函数的方差比这里的奖励总和要低。我们可以通过引导备份来拟合Q函数。","start":3928.14,"end":3952.38},{"id":320,"text":"So all these ideas are applicable to Monte Carlo as well. But using Q functions, like when you can use this sort of bootstrapped objective, which you could only do with Q functions, then you'll get a lower variance target. And then I guess to summarize kind of the point of offline URL. So online data is really expensive because we have to recollect it every time we run our algorithm. And it's really, really useful to reuse offline data.","zh":"所有这些想法同样适用于蒙特卡洛方法。但使用Q函数，比如当你可以使用这种引导目标函数时，这只能通过Q函数实现，这样你就能得到一个更低方差的目标。然后我想总结一下离线强化学习的核心要点。在线数据非常昂贵，因为我们每次运行算法都需要重新收集数据。而重用离线数据是非常有用的。","start":3953.03,"end":3976.46},{"id":321,"text":"One of the big challenges with offline URL is this shift between your behavior policy and your learn policy. And we talked about a filtered or weighted imitation learning method as a baseline. And we talked about how we can actually explicitly constrain the policy to the behavior policy by only supervising the policy on actions in your data. And so that allowed us to kind of get rid of or move away from this distribution shift problem.","zh":"离线强化学习的一个重大挑战是你的行为策略和学习策略之间的分布转移。我们讨论过一种过滤或加权的模仿学习方法作为基准。我们也讨论过如何通过仅在数据中的动作上监督策略，来显式地约束策略到行为策略。这样就允许我们摆脱或远离这种分布转移问题。","start":3978.13,"end":4003.19},{"id":322,"text":"And then this sort of trajectory stitching idea that we talked about before allows us to improve over vanilla imitation learning. This example application is for the algorithm we didn't cover. If you want to train offline, filter behavior cloning and implicit Q-learning are both good approaches. But implicit Q-learning is going to probably work better, especially if you have a broader data set.","zh":"然后我们之前讨论过的这种轨迹拼接的想法，允许我们在普通的模仿学习上进行改进。这个例子应用是针对我们未讲解的算法。如果你想进行离线训练，行为克隆和隐式Q学习都是很好的方法。但隐式Q学习可能会表现得更好，特别是当你拥有更广泛的数据集时。","start":4005.16,"end":4029.49},{"id":323,"text":"And if you want to do offline pre-training and online fine-tuning, IQL is actually a very good algorithm for doing that. It can also be used with online data collection quite effectively, and it works quite well there. There's also a variant of IQL called IDQL that uses diffusion policies for your policy class right here.","zh":"如果你想进行离线预训练和在线微调，IQL实际上是一个非常好的算法。它也可以有效地用于在线数据收集，并且在那方面表现很好。此外，还有一种称为IDQL的IQL变体，它在这里使用扩散策略作为策略类。","start":4030.19,"end":4050.27},{"id":324,"text":"And it also works quite well. And so if you're interested in diving more into IQL-like algorithms, I would encourage you to check out IDQL. It is actually, beyond using diffusion, it also is a bit different in terms of how this update is done.","zh":"它也表现得非常好。因此，如果你对IQL类的算法感兴趣，我鼓励你去了解一下IDQL。它不仅仅是在使用扩散策略，它在更新方式上也略有不同。","start":4051.01,"end":4064.03}],"notes":["本段讨论了在离线强化学习中使用Q函数的优势，特别是通过使用bootstrapped backups来降低方差。Q函数相较于直接使用奖励总和具有更低的方差，这使得Q函数成为一种更稳定的估计方法。","离线强化学习的一个主要挑战是行为策略与学习策略之间的分布偏移问题。通过仅在数据中存在的动作上监督策略，可以显式地约束策略到行为策略，从而缓解分布偏移问题。","轨迹拼接（trajectory stitching）是一种改进普通模仿学习的方法，它允许在离线数据上进行更有效的策略学习。对于未覆盖的算法，过滤行为克隆和隐式Q学习都是可行的方法，而隐式Q学习在数据集更广泛时表现更好。","IQL（Implicit Q-Learning）是一种适用于离线预训练和在线微调的算法，它在在线数据收集上也表现良好。IDQL是IQL的一个变体，它使用扩散策略作为策略类，这使得其在某些情况下可能表现更优。","IDQL不仅使用了扩散策略，还在更新方式上与IQL有所不同，这使得它在某些应用场景下可能具有更好的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3928.14,"end":4064.03,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3928.14,"text":"Yeah, so the question is, where are we fitting Q? So we could also use Monte Carlo returns with this and use the expectile objective with this term. It's nice to use Q because Q is lower variance than this sum of rewards right here. And we can fit a Q function using the bootstrapped backups."},{"start":3953.03,"text":"So all these ideas are applicable to Monte Carlo as well. But using Q functions, like when you can use this sort of bootstrapped objective, which you could only do with Q functions, then you'll get a lower variance target. And then I guess to summarize kind of the point of offline URL. So online data is really expensive because we have to recollect it every time we run our algorithm. And it's really, really useful to reuse offline data."},{"start":3978.13,"text":"One of the big challenges with offline URL is this shift between your behavior policy and your learn policy. And we talked about a filtered or weighted imitation learning method as a baseline. And we talked about how we can actually explicitly constrain the policy to the behavior policy by only supervising the policy on actions in your data. And so that allowed us to kind of get rid of or move away from this distribution shift problem."},{"start":4005.16,"text":"And then this sort of trajectory stitching idea that we talked about before allows us to improve over vanilla imitation learning. This example application is for the algorithm we didn't cover. If you want to train offline, filter behavior cloning and implicit Q-learning are both good approaches. But implicit Q-learning is going to probably work better, especially if you have a broader data set."},{"start":4030.19,"text":"And if you want to do offline pre-training and online fine-tuning, IQL is actually a very good algorithm for doing that. It can also be used with online data collection quite effectively, and it works quite well there. There's also a variant of IQL called IDQL that uses diffusion policies for your policy class right here."},{"start":4051.01,"text":"And it also works quite well. And so if you're interested in diving more into IQL-like algorithms, I would encourage you to check out IDQL. It is actually, beyond using diffusion, it also is a bit different in terms of how this update is done."}],"speech_gaps":[],"frame":"../frames/v034/024.webp","frame_time":3940.14}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
