ding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 7 离线强化学习（Offline RL） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v034","title":"Lecture 7 离线强化学习（Offline RL）","course":"强化学习","pages":[{"title":"离线强化学习（Offline RL）概述","segments":[{"id":0,"text":"Okay, let's get started. Okay, so now let's talk a bit about a recap of the online URL methods that we've talked about so far. So we started with talking about policy gradients, where our goal was to collect data from our policy, then increase the likelihood on...","zh":"好的，我们开始吧。好的，现在让我们稍微回顾一下到目前为止我们讨论过的在线URL方法。我们一开始讨论了策略梯度，我们的目标是从策略中收集数据，然后增加那些导致高于平均水平结果的动作的似然性。","start":5.23,"end":23.35},{"id":1,"text":"actions that led to above average outcomes. So encouraging the policy to do more of the stuff that led to good outcomes, less of the stuff that led to bad outcomes. And then we started introducing this notion of a value function, which can then estimate, we can use a value function to estimate how good an action is. And then when we fit a value function, we can use that to then encourage the policy to do more of what you estimated to be good.","zh":"所以鼓励策略多做那些导致良好结果的事情，少做那些导致不良结果的事情。然后我们开始引入价值函数的概念，这可以用来估计一个动作的好坏。当我们拟合价值函数时，可以利用它来鼓励策略多做你估计为好的事情，少做你估计为不好的事情。","start":24.07,"end":52.91},{"id":2,"text":"and less of what you estimated to be bad. And we saw a couple algorithms like PPO and SAC that use this sort of actor-critic approach. We also talked about a few different ways for fitting value functions. And I want to quickly go through these different ways again, because it's actually going to play a pretty important role in today's lecture. So the first thing we talked about is if you have","zh":"我们看到了像PPO和SAC这样的算法，它们使用这种actor-critic方法。我们也讨论了几种不同的价值函数拟合方式。我想快速回顾这些不同的方式，因为这实际上将在今天的讲座中扮演相当重要的角色。我们首先讨论的是，如果你有一些状态在你的数据中，并且你想估计该状态的价值。","start":53.23,"end":82.26},{"id":3,"text":"some state in your data and you want to estimate the value of that state. One way to do that is to take the sum of the rewards over the trajectory in the future and estimate the value that way. So the target would be trying to fit some v pi of s.","zh":"一种方法是取未来轨迹中奖励的总和，以此方式估计该状态的价值。因此，目标是尝试拟合某个v_pi(s)。","start":82.73,"end":107.01},{"id":4,"text":"And your target would be the sum of rewards from that state onward. So you'd be trying to contrast this with the sum of rewards at future time steps, from future time steps from t to t. And then your objective for your value function would look something like this.","zh":"你的目标是从该状态开始的奖励总和。因此，你试图将这个与从t到t的未来时间步的奖励总和进行对比。你的价值函数的目标函数看起来会像这样。","start":107.6,"end":136.94},{"id":5,"text":"where you're then trying to minimize this over the states and actions in your data set. So that was the first simplest way that we saw to estimate a value function. And then we saw a way to potentially get a better estimate, because instead of just summing all the rewards, you could actually look at your estimate of the value at an intermediate state. So say that this is...","zh":"你试图在你的数据集中所有状态和动作上最小化这个目标。这是我们看到的估计价值函数的第一种最简单的方法。然后我们看到了一种可能获得更好估计的方法，因为与其仅仅总和所有奖励，你实际上可以查看你在中间状态的估计价值。例如，这个是……","start":137.36,"end":166.45}],"notes":["本段主要回顾了在线强化学习中的策略梯度方法，强调了通过收集数据并提升导致良好结果的动作概率来优化策略。同时，介绍了价值函数的概念，用于评估动作的好坏，并通过拟合价值函数来指导策略的更新。","课堂中提到的PPO和SAC是使用actor-critic方法的算法，它们通过价值函数来优化策略。此外，还讨论了价值函数的拟合方法，包括直接计算轨迹上的奖励总和，以及通过中间状态的价值估计来改进估计。","在价值函数的估计中，第一种方法是计算从当前状态开始的未来奖励总和，作为目标。这种方法简单，但可能不够准确。课堂中提到，可以通过考虑中间状态的价值估计来获得更精确的估计。","课堂中提到的优化目标是通过最小化损失函数来拟合价值函数，该损失函数基于数据集中的状态和动作。这为后续的离线强化学习方法奠定了基础。","课堂中还提到，通过引入中间状态的价值估计，可以改进价值函数的估计方法，这可能涉及更复杂的算法设计，如使用动态规划或函数逼近方法。","这些方法的讨论为理解离线强化学习中的价值函数估计提供了基础，也为后续的算法设计和优化策略提供了理论支持。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":166.45,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5.23,"text":"Okay, let's get started. Okay, so now let's talk a bit about a recap of the online URL methods that we've talked about so far. So we started with talking about policy gradients, where our goal was to collect data from our policy, then increase the likelihood on..."},{"start":24.07,"text":"actions that led to above average outcomes. So encouraging the policy to do more of the stuff that led to good outcomes, less of the stuff that led to bad outcomes. And then we started introducing this notion of a value function, which can then estimate, we can use a value function to estimate how good an action is. And then when we fit a value function, we can use that to then encourage the policy to do more of what you estimated to be good."},{"start":53.23,"text":"and less of what you estimated to be bad. And we saw a couple algorithms like PPO and SAC that use this sort of actor-critic approach. We also talked about a few different ways for fitting value functions. And I want to quickly go through these different ways again, because it's actually going to play a pretty important role in today's lecture. So the first thing we talked about is if you have"},{"start":82.73,"text":"some state in your data and you want to estimate the value of that state. One way to do that is to take the sum of the rewards over the trajectory in the future and estimate the value that way. So the target would be trying to fit some v pi of s."},{"start":107.6,"text":"And your target would be the sum of rewards from that state onward. So you'd be trying to contrast this with the sum of rewards at future time steps, from future time steps from t to t. And then your objective for your value function would look something like this."},{"start":137.36,"text":"where you're then trying to minimize this over the states and actions in your data set. So that was the first simplest way that we saw to estimate a value function. And then we saw a way to potentially get a better estimate, because instead of just summing all the rewards, you could actually look at your estimate of the value at an intermediate state. So say that this is..."}],"speech_gaps":[],"frame":"../frames/v034/001.webp","frame_time":17.23},{"title":"离线强化学习中的价值函数估计方法","segments":[{"id":6,"text":"S prime is your next state right here. Instead of looking at the sum of rewards from there, instead you could look at what is the reward at the next time step plus the value, my estimate for the value at the next time step. And use that as your target where instead of being the sum of rewards, the target would be the reward at the current time step plus the value.","zh":"S prime 是你当前的下一个状态。与其查看从那里开始的奖励总和，不如查看下一个时间步的奖励加上我对下一个时间步价值的估计。并将这个作为目标，而不是奖励总和，目标将是当前时间步的奖励加上价值。","start":167.01,"end":193.29},{"id":7,"text":"at the estimated value at the next time step. And this is an alternative target for fitting a value function. And so the full objective would be something like this. And we're trying to minimize this over our data set. We could say our value function has parameters 5.","zh":"在下一个时间步的估计价值上。这是一种用于拟合价值函数的替代目标。因此，完整的优化目标会是这样的。我们试图在数据集中最小化这个目标。我们可以说明我们的价值函数有参数 5。","start":194.6,"end":232.08},{"id":8,"text":"We called this kind of bootstrapping or TD updates, temporal difference updates.","zh":"我们将这种类型的自举或 TD 更新称为时间差分更新。","start":233.73,"end":237.55},{"id":9,"text":"So that was the second way that we saw for estimating a value function.","zh":"这就是我们看到的第二种估计价值函数的方法。","start":238.87,"end":241.89},{"id":10,"text":"And then we also saw a third way.","zh":"然后我们还看到了第三种方法。","start":242.75,"end":244.73},{"id":11,"text":"So in these two scenarios, the data set is sampled from your policy.","zh":"在这两种情况下，数据集是从你的策略中采样的。","start":244.91,"end":253.59},{"id":12,"text":"These were on policy methods for estimating the value of a policy.","zh":"这些是用于估计策略价值的在策略方法。","start":253.69,"end":257.45},{"id":13,"text":"So, these were scenarios where your dataset was sampled from the policy that you're trying","zh":"这些是你的数据集是从你试图","start":258.21,"end":265.97},{"id":14,"text":"to evaluate.","zh":"进行评估。","start":265.97,"end":266.63},{"id":15,"text":"And we then started to look at a scenario where, what if your dataset is sampled from","zh":"然后我们开始考虑一种场景，即如果数据集是从一些旧策略的混合中采样的，","start":268.79,"end":275.83},{"id":16,"text":"some mixture of old policies?","zh":"我们能否利用这些数据来拟合一个价值函数？","start":276.61,"end":279.07},{"id":17,"text":"Could we use that data in order to fit a value function?","zh":"函数。为了做到这一点，我们开始关注Q函数。使用Q函数，我们","start":279.89,"end":283.73},{"id":18,"text":"function. And to do that, we started looking at Q functions. And with Q functions, we can","zh":"可以再次使用类似抽样（bootstrapping）的方法，原则上，我们可以使用类似","start":283.73,"end":296.91},{"id":19,"text":"again use something like bootstrapping, where in principle, we could use something like","zh":"Q hat pi of phi of STAT。我们正在尝试估计这个值。然后我们也可以将这个","start":296.91,"end":301.41},{"id":20,"text":"Q hat pi of phi of STAT. We're trying to estimate this. And then we could also use this as our","zh":"作为我们的目标，但需要注意的是，这个价值函数是","start":302.29,"end":310.59},{"id":21,"text":"our target with the caveat that this value function is","zh":"我们的目标，但需注意这个价值函数是","start":310.59,"end":315.47},{"id":22,"text":"going to be for the policy and the data","zh":"这将用于策略和数据","start":315.47,"end":317.63},{"id":23,"text":"and not for the policy that we're trying to learn","zh":"而不是用于我们试图学习的策略","start":317.63,"end":323.45},{"id":24,"text":"and the policy that we're trying to learn a value function for.","zh":"以及我们试图估计其价值函数的策略。","start":323.45,"end":325.83},{"id":25,"text":"And so what we did instead is we changed our target","zh":"因此，我们采取了另一种方法，改变了我们的目标","start":326.25,"end":331.03},{"id":26,"text":"to use the Q function.","zh":"使用Q函数。","start":331.77,"end":333.23},{"id":27,"text":"So we had the target as ST plus 1, AT plus 1.","zh":"所以我们把目标设为ST+1，AT+1。","start":334.99,"end":342.73}],"notes":["本段讲解了离线强化学习中价值函数估计的几种方法。首先，介绍了使用TD更新（Temporal Difference updates）的方法，即通过当前状态和下一个状态的奖励与价值估计来更新价值函数。接着，讨论了在数据集来自当前策略的情况下，如何使用这些数据进行价值函数估计，即所谓的on-policy方法。然后，转向了更复杂的情况，即数据集可能来自多个旧策略的混合，这种情况下需要使用Q函数来估计价值函数，而不是直接使用当前策略的价值函数。"],"formulas":[],"uncertainties":["Q hat pi of phi of STAT","ST plus 1, AT plus 1"],"diagram":"none","start":167.01,"end":342.73,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":167.01,"text":"S prime is your next state right here. Instead of looking at the sum of rewards from there, instead you could look at what is the reward at the next time step plus the value, my estimate for the value at the next time step. And use that as your target where instead of being the sum of rewards, the target would be the reward at the current time step plus the value."},{"start":194.6,"text":"at the estimated value at the next time step. And this is an alternative target for fitting a value function. And so the full objective would be something like this. And we're trying to minimize this over our data set. We could say our value function has parameters 5."},{"start":233.73,"text":"We called this kind of bootstrapping or TD updates, temporal difference updates."},{"start":238.87,"text":"So that was the second way that we saw for estimating a value function."},{"start":242.75,"text":"And then we also saw a third way."},{"start":244.91,"text":"So in these two scenarios, the data set is sampled from your policy."},{"start":253.69,"text":"These were on policy methods for estimating the value of a policy."},{"start":258.21,"text":"So, these were scenarios where your dataset was sampled from the policy that you're trying"},{"start":265.97,"text":"to evaluate."},{"start":268.79,"text":"And we then started to look at a scenario where, what if your dataset is sampled from"},{"start":276.61,"text":"some mixture of old policies?"},{"start":279.89,"text":"Could we use that data in order to fit a value function?"},{"start":283.73,"text":"function. And to do that, we started looking at Q functions. And with Q functions, we can"},{"start":296.91,"text":"again use something like bootstrapping, where in principle, we could use something like"},{"start":302.29,"text":"Q hat pi of phi of STAT. We're trying to estimate this. And then we could also use this as our"},{"start":310.59,"text":"our target with the caveat that this value function is"},{"start":315.47,"text":"going to be for the policy and the data"},{"start":317.63,"text":"and not for the policy that we're trying to learn"},{"start":323.45,"text":"and the policy that we're trying to learn a value function for."},{"start":326.25,"text":"And so what we did instead is we changed our target"},{"start":331.77,"text":"to use the Q function."},{"start":334.99,"text":"So we had the target as ST plus 1, AT plus 1."}],"speech_gaps":[],"frame":"../frames/v034/002.webp","frame_time":179.01},{"title":"离线强化学习（Offline RL）","segments":[{"id":28,"text":"The key difference here was that S and A and ST plus 1 are sampled from the data set, but AT plus 1 is going to be sampled from the policy that we're trying to learn a value function for. Cool. So that's a quick recap of some of the things that we talked about. And these are the different ways of estimating.","zh":"这里的关键区别在于，S和A以及ST加1是从数据集中采样的，但AT加1将是从我们试图学习其价值函数的策略中采样的。很好。所以这是对我们之前讨论的一些内容的快速回顾。这些都是不同的估计方法。","start":347.38,"end":377.72},{"id":29,"text":"value functions with the key difference of this last one being something that we can use data from old policies for. Now one really important aspect of this last one is that because we're bootstrapping and using our own estimate of the value function at a given state as the label, we need this Q function to be trained","zh":"价值函数，其中最后一个方法的关键区别在于我们可以使用旧策略的数据。现在，这个方法的一个非常重要的方面是，因为我们进行的是自举（bootstrapping）并使用我们在某个状态下对价值函数的估计作为标签，我们需要这个Q函数在那些实际上会与我们评估它时所采取的动作相似的动作上进行训练。因此，如果我们的策略与我们拥有的旧策略差异很大，那么这个标签将不准确，我们也就无法学习到一个准确的Q函数。因此，它需要在动作上有良好的覆盖。很好。然后","start":378.31,"end":403.65},{"id":30,"text":"on actions that actually would resemble the actions that we're going to be evaluating it on. And so if our policy is very different from our set of old policies, this label will not be accurate. And then we won't be able to learn an accurate Q function. So it needs good coverage over action. Cool. And then","zh":"这些都是学习价值函数的不同方法。完整的离策略actor-critic方法看起来像这样，我们从我们的策略中获取数据，存储在一个缓冲区中，该缓冲区包含多个过去策略的数据，从该缓冲区中采样一些数据，使用这些目标更新我们的Q函数，然后更新我们的策略以鼓励其增加在具有高Q值的动作上的可能性。","start":404.99,"end":426.98},{"id":31,"text":"Those were the different ways of learning value functions. The full off-policy actor critic method looked something like this, where we took data from our policy, stored that in a buffer that had data from a number of past policies, sampled some data from that buffer, updated our Q function with these targets, and then updated our policy to encourage it to increase the likelihood on actions that had a high Q value.","zh":"然后我们可以重复这个过程。好的。因此，今天我们将基于一些这些想法进行扩展。我们将具体讨论离线强化学习。在离线强化学习中，我们试图从一个被提供给我们的数据集中学习，而不是由我们自己的策略收集的数据。","start":427.82,"end":455.58},{"id":32,"text":"And then we can repeat that process. Okay. So for today, we're going to be building on some of those ideas. And specifically, we're going to be talking about offline reinforcement learning. And in offline reinforcement learning, we're trying to learn from a data set that was given to us, not collected by our own policy.","zh":"然后我们可以重复这个过程。好的。所以今天，我们将基于一些这些想法进行构建。我们将具体讨论离线强化学习。在离线强化学习中，我们试图从一个被提供给我们的数据集中学习，而不是由我们自己的策略收集的数据。","start":456.25,"end":477.72},{"id":33,"text":"And we'll then talk about two different methods or two different classes of methods for doing offline reinforcement learning.","zh":"我们将尝试了解的关键点是，我提到的第一个，离线强化学习中出现的关键挑战。","start":478.36,"end":483.84},{"id":34,"text":"And the key things that we'll try to see is, so I talked about is first, the key challenge that arises in offline RL.","zh":"第二个，两种不同的离线强化学习方法及其为何有效。","start":484.24,"end":490.26},{"id":35,"text":"Second, two different approaches for offline RL and why they work.","zh":"第二，离线强化学习的两种不同方法及其为何有效。","start":490.62,"end":494.26},{"id":36,"text":"And lastly, how offline reinforcement learning can improve over just imitation learning, which is another way to learn from offline data sets.","zh":"最后，离线强化学习如何在仅仅通过模仿学习（imitation learning）的基础上进行改进，模仿学习是另一种从离线数据集中学习的方法。","start":494.68,"end":501.18},{"id":37,"text":"The question is, is this Q-learning?","zh":"问题是，这是否是Q学习（Q-learning）？","start":502.02,"end":503.3},{"id":38,"text":"This is actually two lectures ago.","zh":"实际上，这是两节课前的内容。","start":503.5,"end":505.72},{"id":39,"text":"This is like soft actor critic.","zh":"这类似于软演员评论家（soft actor critic）。","start":505.9,"end":507.38},{"id":40,"text":"So in Q-learning, there is one last change to this.","zh":"因此，在Q学习中，对此还有一个最后的改动。","start":508.36,"end":514.1},{"id":41,"text":"So in this case, we're trying to learn Q function for the policy that we're learning.","zh":"在这种情况下，我们试图学习正在学习的策略的Q函数。","start":514.42,"end":519.74},{"id":42,"text":"The difference that we saw in Q-learning was we were actually trying to learn the Q function for the optimal policy.","zh":"我们在Q学习中看到的区别是，我们实际上是在尝试学习最优策略的Q函数。","start":520.22,"end":526.54}],"notes":["本段讨论了在离线强化学习中，Q函数的训练需要覆盖实际评估动作的分布，否则标签不准确，导致无法学习到准确的Q函数。这强调了数据覆盖的重要性。","在离线强化学习中，全策略演员-评论家方法通过从多个旧策略的数据中采样，更新Q函数并优化策略，以鼓励选择高Q值的动作。这种方法依赖于数据集的多样性。","本段提到Q-learning与当前讨论的离线强化学习方法的区别在于，Q-learning的目标是学习最优策略的Q函数，而当前方法则是针对正在学习的策略。","课程中提到的两种方法分别对应于离线强化学习的不同类别，但具体方法未展开，仅提及了挑战、方法和与模仿学习的对比。","课程指出，离线强化学习可以改进模仿学习，但具体如何改进未详细说明，仅提到这是讨论的第三个重点。","课程中提到的Q-learning是两节课前的内容，而当前讨论的是软演员-评论家方法，这表明课程在回顾和对比不同方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":347.38,"end":526.54,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":347.38,"text":"The key difference here was that S and A and ST plus 1 are sampled from the data set, but AT plus 1 is going to be sampled from the policy that we're trying to learn a value function for. Cool. So that's a quick recap of some of the things that we talked about. And these are the different ways of estimating."},{"start":378.31,"text":"value functions with the key difference of this last one being something that we can use data from old policies for. Now one really important aspect of this last one is that because we're bootstrapping and using our own estimate of the value function at a given state as the label, we need this Q function to be trained"},{"start":404.99,"text":"on actions that actually would resemble the actions that we're going to be evaluating it on. And so if our policy is very different from our set of old policies, this label will not be accurate. And then we won't be able to learn an accurate Q function. So it needs good coverage over action. Cool. And then"},{"start":427.82,"text":"Those were the different ways of learning value functions. The full off-policy actor critic method looked something like this, where we took data from our policy, stored that in a buffer that had data from a number of past policies, sampled some data from that buffer, updated our Q function with these targets, and then updated our policy to encourage it to increase the likelihood on actions that had a high Q value."},{"start":456.25,"text":"And then we can repeat that process. Okay. So for today, we're going to be building on some of those ideas. And specifically, we're going to be talking about offline reinforcement learning. And in offline reinforcement learning, we're trying to learn from a data set that was given to us, not collected by our own policy."},{"start":478.36,"text":"And we'll then talk about two different methods or two different classes of methods for doing offline reinforcement learning."},{"start":484.24,"text":"And the key things that we'll try to see is, so I talked about is first, the key challenge that arises in offline RL."},{"start":490.62,"text":"Second, two different approaches for offline RL and why they work."},{"start":494.68,"text":"And lastly, how offline reinforcement learning can improve over just imitation learning, which is another way to learn from offline data sets."},{"start":502.02,"text":"The question is, is this Q-learning?"},{"start":503.5,"text":"This is actually two lectures ago."},{"start":505.9,"text":"This is like soft actor critic."},{"start":508.36,"text":"So in Q-learning, there is one last change to this."},{"start":514.42,"text":"So in this case, we're trying to learn Q function for the policy that we're learning."},{"start":520.22,"text":"The difference that we saw in Q-learning was we were actually trying to learn the Q function for the optimal policy."}],"speech_gaps":[],"frame":"../frames/v034/003.webp","frame_time":359.38},{"title":"离线强化学习（Offline RL）的概念与应用场景","segments":[{"id":43,"text":"And in Q-learning, this red marker is not great.","zh":"在Q学习中，这个红色标记并不是很好的选择。","start":526.96,"end":536.74},{"id":44,"text":"Our target was instead of sampling from the policy that we're trying to learn a value function for,","zh":"我们的目标不是从我们试图学习其价值函数的策略中进行采样，","start":538.36,"end":544.26},{"id":45,"text":"we tried to pick an action that was the best action according to that Q function.","zh":"而是尝试选择根据该Q函数被认为是最佳的动作。","start":544.4,"end":549.36},{"id":46,"text":"And so our target was R of S, A, T plus gamma.","zh":"因此，我们的目标是R(S, A, T)加上gamma。","start":549.64,"end":557.72},{"id":47,"text":"And then we were taking a max over the next action","zh":"然后我们对下一个动作进行取最大值，","start":557.88,"end":563.4},{"id":48,"text":"so that we are actually trying to, and our goal here was to try to learn the Q function for the optimal policy.","zh":"这样我们实际上是在尝试，我们的目标是尝试学习最优策略的Q函数。","start":563.4,"end":576.38},{"id":49,"text":"And this is also something that can be done off policy, like without data from the optimal policy,","zh":"这也是可以在离策略下完成的事情，比如不需要最优策略的数据，","start":578.26,"end":583.66},{"id":50,"text":"as long as your estimates have good coverage.","zh":"只要你的估计具有良好的覆盖范围。","start":583.76,"end":586.74},{"id":51,"text":"So in offline reinforcement learning, actually, first, why offline reinforcement learning? So the process for online reinforcement learning is you collect data, then you update the policy, either using the latest data or the data so far, and then you repeat that process. With offline RL, you're actually just given the data set in advance, and then you want to train a policy on that provided data set. So you're not actually iteratively collecting data.","zh":"因此，在离线强化学习中，首先，为什么需要离线强化学习？在线强化学习的过程是，你收集数据，然后更新策略，使用最新数据或迄今为止的所有数据，然后重复这个过程。而在离线RL中，你实际上只是提前获得数据集，然后你希望在这个提供的数据集上训练策略。因此，你实际上并不是迭代地收集数据。","start":587.97,"end":617.57},{"id":52,"text":"And there's a number of circumstances where offline reinforcement learning might be more useful than online reinforcement learning. The first is that when you're trying to approach a problem, you might already have a data set that was collected by an existing system or by people. And collecting data from your current policy might be risky or might be unsafe.","zh":"在一些情况下，离线强化学习可能比在线强化学习更有用。第一种情况是，当你试图解决一个问题时，你可能已经有一个由现有系统或人们收集的数据集。从当前策略中收集数据可能是有风险的，或者可能是不安全的。","start":619.61,"end":642.81},{"id":53,"text":"So, for example, if you're trying to learn a policy for controlling a car to drive on roads, you might have a lot of data of people driving that could be very useful for learning a good policy for driving. And it might be unsafe to actually try to deploy your policy, especially a policy that is not very good at driving.","zh":"例如，如果你试图学习一个控制汽车在道路上行驶的策略，你可能有很多人们驾驶的数据，这些数据对于学习一个良好的驾驶策略可能非常有用。而实际上部署你的策略，尤其是那些驾驶能力不强的策略，可能是不安全的。","start":643.68,"end":665.9},{"id":54,"text":"In other circumstances, people have looked at using reinforcement learning for figuring out good ways to treat people in medical scenarios. So, for example, there was a really cool project on a seizure prevention use case where you're trying to learn a policy for figuring out how to prevent seizures. This is a scenario where...","zh":"在其他情况下，人们已经考虑使用强化学习来找出在医疗场景中对人们进行良好治疗的方法。例如，有一个非常酷的项目是关于癫痫预防的应用案例，你试图学习一个策略来找出如何预防癫痫。这是一个……","start":666.86,"end":688.88},{"id":55,"text":"If you have an offline method of some existing system, then you could use that to learn a policy without having to collect data from a policy that is not good in the first place. And then the last point, which is actually a little bit more nuanced, is that...","zh":"如果你有一个现有系统的离线方法，那么你可以使用它来学习策略，而无需首先从一个表现不佳的策略中收集数据。最后一点，实际上更加微妙的是……","start":689.2,"end":706.05}],"notes":["本段首先回顾了Q-learning的基本思想，即通过选择根据Q函数最优的动作来更新目标值，而不是从当前策略中采样。这表明Q-learning的目标是学习最优策略的Q函数，而不是直接学习策略本身。","接着，课程介绍了离线强化学习（Offline RL）的基本概念，即在训练过程中不进行数据收集，而是直接使用已有的数据集进行训练。这与在线强化学习形成对比，后者需要不断收集数据并更新策略。","课程进一步指出，离线强化学习在某些场景下更有优势，例如当已有数据集存在时，或者当从当前策略收集数据可能带来风险或不安全时。例如，在自动驾驶或医疗场景中，使用已有数据训练策略可以避免潜在的危险。","此外，课程提到离线强化学习在医疗场景中的应用，如癫痫预防项目，说明了在某些情况下，使用已有数据训练策略比从新策略中收集数据更安全、更有效。","最后，课程提到离线强化学习的最后一个优势是其更复杂的特性，这可能涉及对数据分布的更深入理解或对策略优化的更精细控制。","整体上，本段强调了离线强化学习的适用场景和优势，特别是在数据收集受限或存在安全风险的情况下，离线方法可以提供更可靠和安全的策略学习方式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":526.96,"end":706.05,"asr_flags":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":526.96,"text":"And in Q-learning, this red marker is not great."},{"start":538.36,"text":"Our target was instead of sampling from the policy that we're trying to learn a value function for,"},{"start":544.4,"text":"we tried to pick an action that was the best action according to that Q function."},{"start":549.64,"text":"And so our target was R of STAT plus gamma."},{"start":557.88,"text":"And then we were taking a max over the next action"},{"start":563.4,"text":"so that we are actually trying to, and our goal here was to try to learn the Q function for the optimal policy."},{"start":578.26,"text":"And this is also something that can be done off policy, like without data from the optimal policy,"},{"start":583.76,"text":"as long as your estimates have good coverage."},{"start":587.97,"text":"So in offline reinforcement learning, actually, first, why offline reinforcement learning? So the process for online reinforcement learning is you collect data, then you update the policy, either using the latest data or the data so far, and then you repeat that process. With offline RL, you're actually just given the data set in advance, and then you want to train a policy on that provided data set. So you're not actually iteratively collecting data."},{"start":619.61,"text":"And there's a number of circumstances where offline reinforcement learning might be more useful than online reinforcement learning. The first is that when you're trying to approach a problem, you might already have a data set that was collected by an existing system or by people. And collecting data from your current policy might be risky or might be unsafe."},{"start":643.68,"text":"So, for example, if you're trying to learn a policy for controlling a car to drive on roads, you might have a lot of data of people driving that could be very useful for learning a good policy for driving. And it might be unsafe to actually try to deploy your policy, especially a policy that is not very good at driving."},{"start":666.86,"text":"In other circumstances, people have looked at using reinforcement learning for figuring out good ways to treat people in medical scenarios. So, for example, there was a really cool project on a seizure prevention use case where you're trying to learn a policy for figuring out how to prevent seizures. This is a scenario where..."},{"start":689.2,"text":"If you have an offline method of some existing system, then you could use that to learn a policy without having to collect data from a policy that is not good in the first place. And then the last point, which is actually a little bit more nuanced, is that..."}],"speech_gaps":[],"frame":"../frames/v034/004.webp","frame_time":538.96},{"title":"离线强化学习（Offline RL）的基本概念","segments":[{"id":56,"text":"If you actually run online around multiple times, you might actually already have a data set from your policies. And it'd be really nice to reuse that data set rather than trying to recollect data every single time you try to run an experiment.","zh":"如果你实际上多次在线运行，你可能已经拥有了来自你策略的数据集。而且，比起每次运行实验时都重新收集数据，重用这个数据集会更加理想。","start":707.33,"end":723.17},{"id":57,"text":"If, for example, you're training a robot to do something and you want it to learn how to grasp something, then if you have a pure online URL method, it means that every single time you need to run your algorithm, you need to recollect data from your policy.","zh":"例如，如果你正在训练一个机器人执行某个任务，并希望它学会如何抓取物体，那么如果你使用纯粹的在线方法，意味着每次你需要运行你的算法时，都需要重新从你的策略中收集数据。","start":724.17,"end":736.53},{"id":58,"text":"And that can be pretty inefficient because probably the first time you run the algorithm, you still have room for iteration on the algorithm itself.","zh":"这可能相当低效，因为第一次运行算法时，你仍然有改进算法本身的余地。","start":737.53,"end":746.35},{"id":59,"text":"itself. And generally, online data is more expensive than offline data for that reason,","zh":"它本身。由于这个原因，在线数据通常比离线数据更昂贵，","start":746.35,"end":752.33},{"id":60,"text":"because offline data you can reuse many times. Also worth noting that you can blend offline","zh":"因为离线数据可以被多次重用。也值得注意的是，你可以将离线强化学习和在线强化学习结合起来，","start":752.37,"end":758.81},{"id":61,"text":"RL and online RL where you have some existing data set, like in autonomous driving, you have","zh":"当你有一些现有的数据集时，例如在自动驾驶中，你拥有人们驾驶的数据集，","start":758.81,"end":762.93},{"id":62,"text":"a data set of people driving, and then you train a policy on that, and then you try to improve it","zh":"然后你在这个数据集上训练一个策略，之后你可能通过一些在线数据收集来改进它，或许借助安全驾驶员，","start":762.93,"end":768.35},{"id":63,"text":"with some online data collection, perhaps with a safety driver, after you have a policy that's","zh":"在你已经有一个策略之后。","start":768.35,"end":773.91},{"id":64,"text":"pretty good. And there's a number of real world use cases where you will want to blend it because","zh":"很好。在许多实际应用中，你可能希望将其混合使用，因为","start":773.91,"end":780.31},{"id":65,"text":"if you actually are deploying your policy, then it's great to be able to improve it after you","zh":"如果你实际上正在部署你的策略，那么在部署之后能够对其进行改进是非常有益的","start":780.31,"end":784.73},{"id":66,"text":"deploy your policy. Yeah, so the question is, can you view offline URL as a special case of online","zh":"部署你的策略。是的，所以问题是，你能把离线强化学习视为在线强化学习的一个特例吗","start":784.73,"end":790.27},{"id":67,"text":"but off policy URL, but where you don't know the data? And in certain, in like, that's like","zh":"但是离策略的URL，但是你不知道数据呢？在某些情况下，就像这样","start":790.27,"end":796.61},{"id":68,"text":"definitely one like very, like, it's sort of a correct way to view it. One thing that is like","zh":"肯定有一种像非常、像这样的，这是一种正确看待它的方法。有一件事是像","start":796.61,"end":802.97},{"id":69,"text":"One thing that is like a very strict requirement in offline RL, in pure offline RL, is that you have no ability to collect more data.","zh":"在纯粹的离线强化学习中，有一个非常严格的要求，就是你无法再收集更多的数据。","start":802.97,"end":807.13},{"id":70,"text":"to collect more data.","zh":"为了收集更多数据。","start":807.13,"end":808.23},{"id":71,"text":"And in that sense, it's not really a special case of online RL, because in online off-policy RL, you can collect more data.","zh":"从这个意义上说，它并不是在线强化学习的一个特殊情况，因为在在线离策略强化学习中，你可以收集更多的数据。","start":808.53,"end":813.01},{"id":72,"text":"That said, we'll see that some of the techniques will kind of draw upon some of these off-policy techniques from an algorithm standpoint.","zh":"也就是说，我们将看到一些技术在算法层面会借鉴一些离策略技术。","start":813.01,"end":814.97},{"id":73,"text":"That said, we'll see that some of the techniques will kind of draw upon some of these off-policy","zh":"也就是说，我们将看到一些技术在算法层面会借鉴一些离策略","start":815.53,"end":821.47},{"id":74,"text":"techniques from an algorithm standpoint.","zh":"技术。","start":821.47,"end":823.07},{"id":75,"text":"In these scenarios, you're able to use data from old policies, and that's very useful when you have an offline data set from some policy that you don't know.","zh":"在这些场景中，你可以使用旧策略的数据，当你有一些来自未知策略的离线数据集时，这非常有用。","start":824.75,"end":833.55},{"id":76,"text":"Okay, so now let's talk about this a little bit more formally.","zh":"好的，现在让我们更正式地讨论一下这个问题。","start":835.37,"end":838.03},{"id":77,"text":"So say that you're given some data set, and the data set maybe has some trajectories in it.","zh":"假设你被提供了一些数据集，这个数据集可能包含一些轨迹。","start":838.41,"end":852.69},{"id":78,"text":"Maybe if it's a driving scenario, then you have some car and you have data sets of people driving in a number of different ways, in a number of different places, with a number of different cars.","zh":"例如，在驾驶场景中，你有一辆汽车，并且有不同方式、不同地点、不同汽车驾驶的数据集。","start":852.69,"end":865.87},{"id":79,"text":"And we're going to say that this kind of constitutes some data set that we're given.","zh":"我们将说这种数据集构成了我们被提供的数据。","start":867.79,"end":876.09},{"id":80,"text":"And it's helpful to formally think about the policy that collected this data.","zh":"而且，正式地思考收集这些数据的策略是有帮助的。","start":878.91,"end":884.15},{"id":81,"text":"Now, we don't know the underlying policy.","zh":"现在，我们不知道底层的策略。","start":884.43,"end":886.47}],"notes":["本段讲解了离线强化学习（Offline RL）的基本概念，强调了其与在线强化学习（Online RL）的关键区别。在线强化学习需要不断收集新数据，而离线强化学习则基于已有的数据集进行训练，且不允许再收集更多数据。这种限制使得离线强化学习在某些场景下更加高效，尤其是在数据收集成本高昂或存在安全风险的情况下。","讲者提到，离线强化学习的一个严格要求是不能收集更多数据，这与在线离线策略（online off-policy RL）不同，后者允许在训练过程中继续收集数据。这种区别是理解离线强化学习核心挑战的关键。","讲者还指出，尽管离线强化学习不能像在线强化学习那样收集新数据，但某些算法技术仍然可以借鉴在线离线策略中的方法。这表明，虽然离线强化学习有其独特限制，但仍然可以利用一些通用的强化学习技术。","讲者进一步说明，离线强化学习的数据集通常包含多个轨迹（trajectories），这些轨迹可能来自不同的环境、不同的车辆或不同的驾驶方式。这种多样性使得离线强化学习能够处理复杂和多变的现实场景。","讲者强调，离线强化学习的一个重要挑战是，我们通常不知道数据集背后的策略（policy）。这意味着在训练过程中，我们需要在不知道数据来源的情况下，对策略进行优化，这增加了算法设计的难度。","最后，讲者提到，离线强化学习的一个重要应用场景是自动驾驶，其中可以利用已有的人类驾驶数据来训练和改进自动驾驶策略。这种混合使用在线和离线数据的方法在实际应用中非常有价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":707.33,"end":886.47,"asr_flags":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":707.33,"text":"If you actually run online around multiple times, you might actually already have a data set from your policies. And it'd be really nice to reuse that data set rather than trying to recollect data every single time you try to run an experiment."},{"start":724.17,"text":"If, for example, you're training a robot to do something and you want it to learn how to grasp something, then if you have a pure online URL method, it means that every single time you need to run your algorithm, you need to recollect data from your policy."},{"start":737.53,"text":"And that can be pretty inefficient because probably the first time you run the algorithm, you still have room for iteration on the algorithm itself."},{"start":746.35,"text":"itself. And generally, online data is more expensive than offline data for that reason,"},{"start":752.37,"text":"because offline data you can reuse many times. Also worth noting that you can blend offline"},{"start":758.81,"text":"RL and online RL where you have some existing data set, like in autonomous driving, you have"},{"start":762.93,"text":"a data set of people driving, and then you train a policy on that, and then you try to improve it"},{"start":768.35,"text":"with some online data collection, perhaps with a safety driver, after you have a policy that's"},{"start":773.91,"text":"pretty good. And there's a number of real world use cases where you will want to blend it because"},{"start":780.31,"text":"if you actually are deploying your policy, then it's great to be able to improve it after you"},{"start":784.73,"text":"deploy your policy. Yeah, so the question is, can you view offline URL as a special case of online"},{"start":790.27,"text":"but off policy URL, but where you don't know the data? And in certain, in like, that's like"},{"start":796.61,"text":"definitely one like very, like, it's sort of a correct way to view it. One thing that is like"},{"start":802.97,"text":"a very strict requirement in offline RL, in pure offline RL, is that you have no ability"},{"start":807.13,"text":"to collect more data."},{"start":808.53,"text":"And in that sense, it's not really a special case of online RL, because in online off-policy"},{"start":813.01,"text":"RL, you can collect more data."},{"start":815.53,"text":"That said, we'll see that some of the techniques will kind of draw upon some of these off-policy"},{"start":821.47,"text":"techniques from an algorithm standpoint."},{"start":824.75,"text":"In these scenarios, you're able to use data from old policies, and that's very useful when you have an offline data set from some policy that you don't know."},{"start":835.37,"text":"Okay, so now let's talk about this a little bit more formally."},{"start":838.41,"text":"So say that you're given some data set, and the data set maybe has some trajectories in it."},{"start":852.69,"text":"Maybe if it's a driving scenario, then you have some car and you have data sets of people driving in a number of different ways, in a number of different places, with a number of different cars."},{"start":867.79,"text":"And we're going to say that this kind of constitutes some data set that we're given."},{"start":878.91,"text":"And it's helpful to formally think about the policy that collected this data."},{"start":884.43,"text":"Now, we don't know the underlying policy."}],"speech_gaps":[{"start":876.976,"end":878.51}],"frame":"../frames/v034/005.webp","frame_time":719.33},{"title":"离线强化学习中的数据集与目标","segments":[{"id":82,"text":"So, for example, if this was collected by people, we don't know what...","zh":"因此，例如，如果这些数据是由人们收集的，我们就不知道……","start":886.67,"end":891.37},{"id":83,"text":"Well, first, if it was collected by multiple people, then it's sort of multiple policies.","zh":"首先，如果这些数据是由多个人收集的，那么它就类似于多个策略。","start":891.37,"end":894.51},{"id":84,"text":"We also just don't directly have access to that.","zh":"我们也不直接拥有这些数据的访问权限。","start":894.99,"end":896.97},{"id":85,"text":"But it's useful to think about that policy just from a kind of a mathematical standpoint.","zh":"但从数学的角度来思考这个策略是有用的。","start":897.71,"end":902.19},{"id":86,"text":"And so we'll say that this data set was collected by running some policy that we'll refer to as the behavior policy or pi beta.","zh":"因此，我们将说这些数据集是通过运行某个策略收集的，我们将这个策略称为行为策略或πβ。","start":902.19,"end":913.95},{"id":87,"text":"And if it's collected by multiple policies, then you can think of pi beta as a mixture of policies.","zh":"如果这些数据是由多个策略收集的，那么你可以将πβ视为多个策略的混合。","start":917.45,"end":923.61},{"id":88,"text":"And you can kind of define that mixture as some like kind of average or weighted sum over some constituent policy.","zh":"你可以将这种混合定义为一些构成策略的平均值或加权和。","start":923.61,"end":934.33},{"id":89,"text":"So we don't lose any generality by saying that it's collected by a single policy. Cool. So that's the data set. Sample from some unknown policy. Maybe a mixture of policies. If we were to think about the kind of distribution over this data, we could think of it having some underlying state distribution corresponding to this policy.","zh":"因此，说这些数据是由单一策略收集的并不会损失一般性。好，这就是数据集。从某个未知策略中采样。可能是多个策略的混合。如果我们考虑这些数据的分布，我们可以认为它对应于该策略的某种底层状态分布。","start":935.67,"end":961.42},{"id":90,"text":"an action distribution, dynamics, a reward function. And then our goal is to learn a good policy that maximizes reward. And so ideally, we would be able to take this data set and be able to learn some policy that can control the car. And ideally, it's like...","zh":"一个动作分布，动力学，一个奖励函数。然后我们的目标是学习一个能够最大化奖励的好策略。理想情况下，我们能够利用这个数据集来学习一个能够控制汽车的策略。理想情况下，它可能是……","start":962.8,"end":989.46},{"id":91,"text":"maybe a pretty good policy. Maybe some of the time it does merge into another lane. But generally, we want a policy that will refer to as pi theta. And we want to be able to ultimately maximize an objective corresponding to the sum of rewards for how good this policy is. And so you can think about that as maximizing the parameters of this policy and trying to maximize","zh":"也许是一个相当好的策略。也许有时候它会合并到另一个车道。但总体而言，我们想要一个被称为πθ的策略。我们希望最终最大化一个与该策略的奖励总和对应的指标。因此，你可以将这视为最大化该策略的参数，并尝试最大化","start":989.72,"end":1017.48},{"id":92,"text":"for trajectories sampled from this policy maximizing the sum of rewards. I guess I'll write it as our objectory where this is kind of the sum of rewards for individual states in that trajectory. Now one thing to note here is that this objective is","zh":"从该策略中采样的轨迹的奖励总和。我想我会把它写成我们的目标函数，其中这是该轨迹中各个状态的奖励总和。需要注意的一点是，这个目标函数是","start":1018.07,"end":1050.94}],"notes":["本段讲授了离线强化学习中数据集的来源和性质。数据集是由某种行为策略（behavior policy）收集的，可能是一个单一策略或多个策略的混合。讲者指出，即使数据集来自多个策略，也可以将其视为一个混合策略，即多个策略的加权平均。这种混合策略的定义是通过某种方式对构成策略进行加权求和。","讲者进一步说明，即使数据集来自多个策略，也可以假设其由单一策略收集，这不会损失一般性。这为后续分析提供了基础，即可以将数据集视为由单一策略生成的样本。","接下来，讲者讨论了数据集的分布特性，包括状态分布、动作分布、动力学和奖励函数。这些分布是理解数据集生成过程的关键因素。","讲者的目标是学习一个能够最大化奖励的策略，即目标策略（target policy）。目标策略通常表示为πθ，其参数θ需要通过优化目标函数来确定。","目标函数是最大化轨迹中奖励的总和，这可以视为对策略参数的优化问题。讲者提到，目标函数可以表示为轨迹中每个状态的奖励之和。","最后，讲者指出，目标函数的性质是关键，因为它决定了如何优化策略参数以达到最大化奖励的目标。"],"formulas":[],"uncertainties":["objectory"],"diagram":"none","start":886.67,"end":1050.94,"asr_flags":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":886.67,"text":"So, for example, if this was collected by people, we don't know what..."},{"start":891.37,"text":"Well, first, if it was collected by multiple people, then it's sort of multiple policies."},{"start":894.99,"text":"We also just don't directly have access to that."},{"start":897.71,"text":"But it's useful to think about that policy just from a kind of a mathematical standpoint."},{"start":902.19,"text":"And so we'll say that this data set was collected by running some policy that we'll refer to as the behavior policy or pi beta."},{"start":917.45,"text":"And if it's collected by multiple policies, then you can think of pi beta as a mixture of policies."},{"start":923.61,"text":"And you can kind of define that mixture as some like kind of average or weighted sum over some constituent policy."},{"start":935.67,"text":"So we don't lose any generality by saying that it's collected by a single policy. Cool. So that's the data set. Sample from some unknown policy. Maybe a mixture of policies. If we were to think about the kind of distribution over this data, we could think of it having some underlying state distribution corresponding to this policy."},{"start":962.8,"text":"an action distribution, dynamics, a reward function. And then our goal is to learn a good policy that maximizes reward. And so ideally, we would be able to take this data set and be able to learn some policy that can control the car. And ideally, it's like..."},{"start":989.72,"text":"maybe a pretty good policy. Maybe some of the time it does merge into another lane. But generally, we want a policy that will refer to as pi theta. And we want to be able to ultimately maximize an objective corresponding to the sum of rewards for how good this policy is. And so you can think about that as maximizing the parameters of this policy and trying to maximize"},{"start":1018.07,"text":"for trajectories sampled from this policy maximizing the sum of rewards. I guess I'll write it as our objectory where this is kind of the sum of rewards for individual states in that trajectory. Now one thing to note here is that this objective is"}],"speech_gaps":[{"start":914.864,"end":916.448}],"frame":"../frames/v034/006.webp","frame_time":898.67},{"title":"离线强化学习中的分布偏移与策略差异","segments":[{"id":93,"text":"an expectation over this policy, whereas our data was collected by a different policy. And so we can think about this as there being some distribution shift between the policy that collected the data and the policy that we're deploying. And we don't actually get to sample from that policy. And so that's one of the big challenges in offline reinforcement learning.","zh":"我们对这个策略的期望，而我们的数据是由不同的策略收集的。因此，我们可以认为存在一些分布偏移，即数据收集策略与部署策略之间存在差异。而且，我们实际上无法从该策略中进行采样。因此，这是离线强化学习中的一个重大挑战。","start":1051.88,"end":1074.01},{"id":94,"text":"So there's kind of this distribution shift because this expectation is under the learned policy rather than under the policy that collected the data. And then it's worth mentioning that the dynamics of the environment are going to be constant between the data and the learned policy. So the distribution shift for these trajectories is only caused by the shift in the policy.","zh":"因此，这种分布偏移是因为这个期望是在学习策略下进行的，而不是在数据收集策略下进行的。值得一提的是，环境的动力学在数据和学习策略之间是恒定的。因此，这些轨迹的分布偏移仅由策略的偏移引起。","start":1075.98,"end":1098.96},{"id":95,"text":"The question is, if the data set is comprehensive enough, can it turn out that the learn policy and the behavior policy distribution are identical? Generally, that's extremely rare. Generally, that doesn't happen. And the reason is that the usually, well, first,","zh":"问题是，如果数据集足够全面，是否会出现学习策略和行为策略分布完全相同的情况？一般来说，这种情况极为罕见。通常，这种情况不会发生。原因在于，通常，首先，","start":1099.88,"end":1121.75},{"id":96,"text":"You often want to improve over your data set and learn something that's better than the average driver. And so in that case, you might actually end up with a narrower distribution here than your original policy. In the case where your original policy is very good, then you're somewhat more in an imitation learning-like setting, and you might still diverge and kind of drift away from the distribution in the data set.","zh":"你通常希望改进你的数据集，学习出比平均驾驶员更好的策略。在这种情况下，你实际上可能会得到比原始策略更狭窄的分布。在原始策略非常优秀的情况下，你则更接近模仿学习的场景，但仍有可能偏离数据集中的分布。","start":1123.36,"end":1150.92},{"id":97,"text":"Where does the data come from? It can be human-collected from some hand-designed system or controller.","zh":"数据是从哪里来的？它可以是来自某些手工设计的系统或控制器的人工收集数据。","start":1152.1,"end":1156.72},{"id":98,"text":"It could also be from previous reinforcement learning runs that you want to reuse.","zh":"它也可以来自你想要重用的先前强化学习运行。","start":1157.84,"end":1162.02},{"id":99,"text":"It could be a mixture of these sources. Lots of different places the data could come from.","zh":"它可能是这些来源的混合。数据可能来自许多不同的地方。","start":1162.22,"end":1166.72},{"id":100,"text":"Okay, now there were some comments about how this offline reinforcement learning relates to off-policy reinforcement learning.","zh":"好的，现在有人评论了离线强化学习与离策略强化学习之间的关系。","start":1169.9,"end":1176.08},{"id":101,"text":"And one natural question is, maybe we could just reuse an off-policy algorithm and just run that off-policy algorithm, but using the offline data set rather than recollecting data with our new policy.","zh":"还有一个自然的问题是，也许我们可以直接复用一个离策略算法，并且用这个离策略算法，但使用的是离线数据集，而不是用我们的新策略重新收集数据。","start":1176.08,"end":1196.54},{"id":102,"text":"policy. Does anyone have thoughts on what will happen if you use an off-policy algorithm","zh":"policy. 有人对如果使用离策略算法，比如Softactor Critic在离线数据集上会有什么结果有什么想法吗？","start":1196.54,"end":1203.06},{"id":103,"text":"like Softactor Critic on an offline dataset?","zh":"比如在离线数据集上使用Soft Actor-Critic？","start":1203.6,"end":1208.16},{"id":104,"text":"Yeah, so the thought there was that we're evaluating our Q estimate on actions sampled","zh":"是的，那里的想法是我们正在对从我们的策略中采样的动作进行Q估计的评估","start":1209.04,"end":1219.5},{"id":105,"text":"from our policy. And our policy is also trying to increase likelihood on","zh":"而我们的策略也在试图增加这些动作的概率","start":1219.5,"end":1223.66}],"notes":["本段讨论了离线强化学习中的分布偏移问题，即数据集是由一个策略收集的，而学习的策略可能不同，导致分布偏移。这种偏移是由于策略之间的差异造成的，而不是环境动态的变化。","讲者指出，即使数据集足够全面，学习策略和行为策略的分布通常也不会完全相同，因为通常学习策略会尝试改进数据集中的表现，从而导致分布的差异。","讲者提到，当原始策略表现很好时，学习策略可能会更接近模仿学习的设定，但仍可能偏离数据集的分布。","讲者还提到，离线强化学习与非策略（off-policy）强化学习之间的关系，即是否可以直接使用非策略算法在离线数据集上运行。","讲者询问了使用SoftActor-Critic等非策略算法在离线数据集上的效果，并指出在评估Q估计时，会使用当前策略采样的动作。","讲者提到，策略在尝试增加似然性时，可能会导致与数据集分布的偏差，这需要特别注意。"],"formulas":[],"uncertainties":["learn policy"],"diagram":"none","start":1051.88,"end":1223.66,"asr_flags":[101],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":1051.88,"text":"an expectation over this policy, whereas our data was collected by a different policy. And so we can think about this as there being some distribution shift between the policy that collected the data and the policy that we're deploying. And we don't actually get to sample from that policy. And so that's one of the big challenges in offline reinforcement learning."},{"start":1075.98,"text":"So there's kind of this distribution shift because this expectation is under the learned policy rather than under the policy that collected the data. And then it's worth mentioning that the dynamics of the environment are going to be constant between the data and the learned policy. So the distribution shift for these trajectories is only caused by the shift in the policy."},{"start":1099.88,"text":"The question is, if the data set is comprehensive enough, can it turn out that the learn policy and the behavior policy distribution are identical? Generally, that's extremely rare. Generally, that doesn't happen. And the reason is that the usually, well, first,"},{"start":1123.36,"text":"You often want to improve over your data set and learn something that's better than the average driver. And so in that case, you might actually end up with a narrower distribution here than your original policy. In the case where your original policy is very good, then you're somewhat more in an imitation learning-like setting, and you might still diverge and kind of drift away from the distribution in the data set."},{"start":1152.1,"text":"Where does the data come from? It can be human-collected from some hand-designed system or controller."},{"start":1157.84,"text":"It could also be from previous reinforcement learning runs that you want to reuse."},{"start":1162.22,"text":"It could be a mixture of these sources. Lots of different places the data could come from."},{"start":1169.9,"text":"Okay, now there were some comments about how this offline reinforcement learning relates to off-policy reinforcement learning."},{"start":1176.08,"text":"And one natural question is, maybe we could just reuse an off-policy algorithm and just run that off-policy algorithm, but using the offline data set rather than recollecting data with our new policy."},{"start":1196.54,"text":"policy. Does anyone have thoughts on what will happen if you use an off-policy algorithm"},{"start":1203.6,"text":"like Softactor Critic on an offline dataset?"},{"start":1209.04,"text":"Yeah, so the thought there was that we're evaluating our Q estimate on actions sampled"},{"start":1219.5,"text":"from our policy. And our policy is also trying to increase likelihood on"}],"speech_gaps":[],"frame":"../frames/v034/007.webp","frame_time":1063.88},{"title":"离线强化学习中的Q函数估计问题","segments":[{"id":106,"text":"actions that have high Q values. And if we have an offline data set and we're learning a policy that's different from the policy that collected the data, then this Q estimate that we're using to supervise our Q function may not be accurate because it didn't actually necessarily see actions in the data that come from the policy we're learning.","zh":"采取具有高Q值的动作。如果我们有一个离线数据集，并且我们正在学习的策略与收集数据的策略不同，那么我们用来监督Q函数的Q估计可能不准确，因为它实际上并没有看到来自我们正在学习的策略的动作。","start":1226.18,"end":1251.1},{"id":107,"text":"And so we might actually end up learning an accurate Q function. And if we don't learn an accurate Q function, then we might get a bad policy as a result. And so to walk through that a little bit more, let's say that we maybe again have a little bit of space here. So let's say that we have our...","zh":"因此，我们可能会最终学习到一个准确的Q函数。如果我们没有学习到一个准确的Q函数，那么我们可能会得到一个糟糕的策略。为了更详细地说明这一点，让我们再假设我们这里有一些空间。例如，我们有我们的数据集。其中一些数据，这里有一些数据中的动作，比如这个","start":1252.14,"end":1274.43},{"id":108,"text":"our data set. And some of the data, here are a few of the actions in the data, like maybe this","zh":"是A1，这个是A2，这个是A3。还有其他动作，汽车可以采取但不在数据集中的动作。例如，也许汽车可以在这里冒险。也许这就是A4。","start":1276.01,"end":1281.55},{"id":109,"text":"is A1, this is A2, this is A3. And there's other actions that the car could take that's not in the","zh":"是A1，这是A2，这是A3。汽车还可以执行数据集中没有的动作","start":1281.55,"end":1289.47},{"id":110,"text":"data set. So for example, maybe the car could go on an adventure over here. Maybe that's A4.","zh":"例如，汽车可能可以在这里冒险。也许这就是A4。","start":1289.47,"end":1295.85},{"id":111,"text":"The car could also like make a U-turn. That's A5. The car could also go backwards. Maybe that's A6.","zh":"汽车还可以像做U型转弯。这是A5。汽车还可以倒车。也许这就是A6。","start":1296.95,"end":1304.81},{"id":112,"text":"So there's all sorts of actions that the car could do.","zh":"汽车可以执行各种各样的动作。","start":1305.49,"end":1307.71},{"id":113,"text":"And at the beginning of training,","zh":"在训练开始时,","start":1309.71,"end":1311.51},{"id":114,"text":"we're going to be randomly initializing our Q function.","zh":"我们将随机初始化我们的Q函数。","start":1311.61,"end":1315.67},{"id":115,"text":"And so if you think about some, like,","zh":"所以如果你想想一些，比如，","start":1316.59,"end":1319.33},{"id":116,"text":"randomly initialized Q function for a given state,","zh":"对于给定状态的随机初始化Q函数，","start":1319.97,"end":1323.37},{"id":117,"text":"maybe it kind of looks somewhat random.","zh":"可能看起来有点随机。","start":1324.87,"end":1328.39},{"id":118,"text":"And this is for different actions.","zh":"并且这是针对不同动作的。","start":1332.37,"end":1334.49},{"id":119,"text":"then","zh":"然后","start":1338.51,"end":1339.07},{"id":120,"text":"only some of these actions are present in the data","zh":"这些动作中只有部分存在于数据中","start":1339.85,"end":1342.21},{"id":121,"text":"and so maybe A1, A2","zh":"所以也许A1, A2","start":1342.21,"end":1346.21},{"id":122,"text":"and A3, maybe they're all kind of","zh":"and A3，也许它们都差不多","start":1346.21,"end":1348.59},{"id":123,"text":"within this range","zh":"在这个范围内","start":1348.59,"end":1350.99},{"id":124,"text":"so this is kind of","zh":"所以这在某种程度上","start":1350.99,"end":1354.67},{"id":125,"text":"what's in distribution in the data","zh":"数据中分布是什么","start":1354.67,"end":1357.29},{"id":126,"text":"and then outside of that your Q function is somewhat","zh":"然后在那个范围之外，你的Q函数是某种程度上","start":1357.29,"end":1361.21},{"id":127,"text":"arbitrary and you don't actually see any","zh":"任意的，你实际上看不到任何","start":1361.21,"end":1364.25},{"id":128,"text":"data for outside that. And then when you do a policy update, your policy is going to say,","zh":"用于外部的数据。然后当你进行策略更新时，你的策略将会说，","start":1364.25,"end":1369.93},{"id":129,"text":"oh, maybe let's try to increase the likelihood on actions that have a high Q value. This is","zh":"哦，也许我们可以尝试增加那些具有高Q值的动作的似然性。这是","start":1369.99,"end":1377.99},{"id":130,"text":"actions A, Q of S comma A. Then what it will do is it'll say, okay, for this randomly initialized","zh":"动作 A，Q 函数在状态 S 和动作 A 上。然后它会做的是，它会说，好的，对于这个随机初始化的 Q 值，也许像这样看起来不错。","start":1381.21,"end":1387.07},{"id":131,"text":"Q value, maybe something like this looks good. And then if that's outside your data,","zh":"如果这个值超出了你的数据范围，","start":1387.07,"end":1392.67}],"notes":["本段讨论了在离线强化学习中，当学习的策略与数据收集策略不同时，Q函数估计可能不准确的问题。讲者指出，如果Q函数估计不准确，可能会导致学习到的策略效果不佳。","讲者通过一个例子说明，数据集中包含了一些动作（如A1、A2、A3），但还有其他未在数据集中出现的动作（如A4、A5、A6）。这些未在数据中出现的动作可能在训练过程中被策略选择，从而导致Q函数估计不准确。","在训练开始时，Q函数会被随机初始化，这可能导致某些动作的Q值估计与实际数据中的Q值不一致。如果这些动作不在数据集中，那么Q函数的估计可能不准确。","当进行策略更新时，策略会倾向于选择具有高Q值的动作。然而，如果这些动作不在数据集中，那么Q函数的估计可能无法正确反映这些动作的真实价值，从而影响策略的性能。","讲者强调了Q函数估计的准确性对策略学习的重要性，并指出在离线强化学习中，如何处理未在数据集中出现的动作是一个关键问题。","讲者通过描述Q函数的初始化和策略更新过程，说明了离线强化学习中可能遇到的挑战，即如何在没有新数据的情况下，确保Q函数的估计准确，从而避免学习到不好的策略。"],"formulas":[],"uncertainties":["Q of S comma A"],"diagram":"none","start":1226.18,"end":1392.67,"asr_flags":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":1226.18,"text":"actions that have high Q values. And if we have an offline data set and we're learning a policy that's different from the policy that collected the data, then this Q estimate that we're using to supervise our Q function may not be accurate because it didn't actually necessarily see actions in the data that come from the policy we're learning."},{"start":1252.14,"text":"And so we might actually end up learning an accurate Q function. And if we don't learn an accurate Q function, then we might get a bad policy as a result. And so to walk through that a little bit more, let's say that we maybe again have a little bit of space here. So let's say that we have our..."},{"start":1276.01,"text":"our data set. And some of the data, here are a few of the actions in the data, like maybe this"},{"start":1281.55,"text":"is A1, this is A2, this is A3. And there's other actions that the car could take that's not in the"},{"start":1289.47,"text":"data set. So for example, maybe the car could go on an adventure over here. Maybe that's A4."},{"start":1296.95,"text":"The car could also like make a U-turn. That's A5. The car could also go backwards. Maybe that's A6."},{"start":1305.49,"text":"So there's all sorts of actions that the car could do."},{"start":1309.71,"text":"And at the beginning of training,"},{"start":1311.61,"text":"we're going to be randomly initializing our Q function."},{"start":1316.59,"text":"And so if you think about some, like,"},{"start":1319.97,"text":"randomly initialized Q function for a given state,"},{"start":1324.87,"text":"maybe it kind of looks somewhat random."},{"start":1332.37,"text":"And this is for different actions."},{"start":1338.51,"text":"then"},{"start":1339.85,"text":"only some of these actions are present in the data"},{"start":1342.21,"text":"and so maybe A1, A2"},{"start":1346.21,"text":"and A3, maybe they're all kind of"},{"start":1348.59,"text":"within this range"},{"start":1350.99,"text":"so this is kind of"},{"start":1354.67,"text":"what's in distribution in the data"},{"start":1357.29,"text":"and then outside of that your Q function is somewhat"},{"start":1361.21,"text":"arbitrary and you don't actually see any"},{"start":1364.25,"text":"data for outside that. And then when you do a policy update, your policy is going to say,"},{"start":1369.99,"text":"oh, maybe let's try to increase the likelihood on actions that have a high key value. This is"},{"start":1381.21,"text":"actions A, Q of S comma A. Then what it will do is it'll say, okay, for this randomly initialized"},{"start":1387.07,"text":"key value, maybe something like this looks good. And then if that's outside your data,"}],"speech_gaps":[{"start":1378.672,"end":1380.368}],"frame":"../frames/v034/008.webp","frame_time":1238.18},{"title":"离线强化学习中的分布外动作问题","segments":[{"id":132,"text":"then it will still continue to think that that's a good action because it'll never actually know what the proper Q value for that action is. And so walking through that, basically everything... Maybe another way to think about this is that here's your data. Here are some of the actions that are out of distribution, including like A4, A5. It never saw...","zh":"那么它仍然会认为那是好的动作，因为它永远不会真正知道该动作的正确Q值是什么。因此，通过这个例子，基本上所有事情……也许另一种思考方式是，这里是你拥有的数据。其中包括一些分布外的动作，比如A4、A5。它从未见过……","start":1393.34,"end":1421.75},{"id":133,"text":"a car that, for example, makes a U-turn on the highway, and so the key value is randomly initialized for that. Some of those actions that are out of distribution will arbitrarily have higher key values, some will have lower because it's randomly initialized, and then your policy will exploit those inaccuracies on the out-of-distribution actions.","zh":"例如，一辆汽车在高速公路上进行U型转弯，而该动作的关键值会被随机初始化。一些分布外的动作可能会被随机初始化为更高的关键值，另一些则可能被初始化为更低的值，然后你的策略会利用这些分布外动作中的不准确性。","start":1423.69,"end":1450.42},{"id":134,"text":"When you evaluate this Q function on A prime that's not in the data set, if you have some randomly initialized Q function for that state and your data support only covers part of that, then on the out-of-distribution actions, your Q function will be unreliable. And then when you do your policy update, that's going to seek out actions where the Q function is over-optimistic. And then after the policy update, these Q values will be...","zh":"当你在分布外的动作A'上评估这个Q函数时，如果你对该状态有一个随机初始化的Q函数，而你的数据支持只覆盖了其中的一部分，那么在分布外的动作上，你的Q函数将不可靠。然后当你进行策略更新时，它会寻找Q函数过于乐观的动作。策略更新之后，这些Q值将……","start":1451.91,"end":1479.03},{"id":135,"text":"overestimated because now you're going to keep on reinforcing that that was good behavior even when it's not in your data. Another perspective on this is that this will happen in scenarios where your learned policy is deviating too much from your behavior policy. Because these are the distribution actions, these are things that are very different from what the behavior policy did. If we stayed closer to the behavior policy, then we wouldn't have this issue.","zh":"被高估，因为现在你会持续强化这种行为是好的，即使它并不在你的数据中。从另一个角度来看，这种情况会在你的学习策略偏离行为策略太远时发生。因为这些是分布外的动作，它们与行为策略执行的动作非常不同。如果我们更接近行为策略，就不会出现这个问题。","start":1480.3,"end":1505.21},{"id":136,"text":"The question is, what happens if you have a discrete action space? So basically everything will be the same. It's possible that your data set, if in all the states in your data set, it has full coverage of the actions, then you won't have this problem because everything will be in distribution.","zh":"问题是，如果你有一个离散动作空间，那么基本上一切都会相同。如果在你数据集中的所有状态中，都有所有动作的完整覆盖，那么你就不会遇到这个问题，因为所有事情都会在分布内。","start":1506.09,"end":1527.13},{"id":137,"text":"But in practice, usually there will be states where you don't have full coverage of all actions. You can still see overestimation in those states.","zh":"但在实践中，通常会有一些状态，你并没有所有动作的完整覆盖。你仍然可以在这些状态中看到高估现象。","start":1527.98,"end":1535.48},{"id":138,"text":"Yeah, so the question is, can you just exclude out-of-distribution actions when you're updating your Q function? Yeah, and there are approaches for doing that. Now, the unfortunate thing is we don't actually know what's in distribution and out-of-distribution. So we have just samples of states and actions. And for a given state, you might have one state that then chooses A1.","zh":"是的，问题是，当你在更新Q函数时，能否直接排除分布外的动作？是的，有一些方法可以做到这一点。不幸的是，我们实际上并不知道哪些动作是分布内的，哪些是分布外的。我们只有状态和动作的样本。对于某个状态，你可能会有一个状态选择A1。","start":1536.43,"end":1559.55},{"id":139,"text":"Then you might have another state that's not exactly the same but very similar, and that takes A2.","zh":"然后你可能会有另一个状态，它并不完全相同，但非常相似，并且采取了A2。","start":1560.09,"end":1564.45},{"id":140,"text":"And so in that case, A2 might technically not be seen for the first state,","zh":"在这种情况下，A2可能在第一个状态下技术上没有被观察到，","start":1564.71,"end":1571.47}],"notes":["本段讨论了离线强化学习中分布外动作（out-of-distribution actions）的问题。当Q函数在未在数据集中出现的动作上进行评估时，由于Q值被随机初始化，可能导致Q值的不准确。这种不准确会被策略利用，从而导致策略对这些动作的过度乐观估计。","讲者指出，当学习策略与行为策略偏离过大时，这种问题会更加严重。因为行为策略所覆盖的动作分布与学习策略所选择的动作分布存在差异，导致Q函数在分布外动作上的不可靠。","在离散动作空间中，如果数据集在所有状态中都覆盖了所有动作，那么就不会出现分布外动作的问题。然而，在实际应用中，通常存在某些状态没有完全覆盖所有动作，因此仍可能出现Q值的高估。","讲者提到，可以尝试排除分布外动作来更新Q函数，但实际中无法明确区分哪些动作是分布外的。因此，只能基于样本状态和动作进行判断，这可能导致某些动作被误判为分布外。","在不同状态之间，即使状态相似，所采取的动作也可能不同。例如，一个状态可能采取A1，而另一个非常相似的状态可能采取A2。这种情况下，A2可能在第一个状态中未被观察到，从而被误判为分布外动作。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1393.34,"end":1571.47,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":1393.34,"text":"then it will still continue to think that that's a good action because it'll never actually know what the proper Q value for that action is. And so walking through that, basically everything... Maybe another way to think about this is that here's your data. Here are some of the actions that are out of distribution, including like A4, A5. It never saw..."},{"start":1423.69,"text":"a car that, for example, makes a U-turn on the highway, and so the key value is randomly initialized for that. Some of those actions that are out of distribution will arbitrarily have higher key values, some will have lower because it's randomly initialized, and then your policy will exploit those inaccuracies on the out-of-distribution actions. So on the slides, we have this term right here."},{"start":1451.91,"text":"When you evaluate this Q function on A prime that's not in the data set, if you have some randomly initialized Q function for that state and your data support only covers part of that, then on the out-of-distribution actions, your Q function will be unreliable. And then when you do your policy update, that's going to seek out actions where the Q function is over-optimistic. And then after the policy update, these Q values will be..."},{"start":1480.3,"text":"overestimated because now you're going to keep on reinforcing that that was good behavior even when it's not in your data. Another perspective on this is that this will happen in scenarios where your learned policy is deviating too much from your behavior policy. Because these are the distribution actions, these are things that are very different from what the behavior policy did. If we stayed closer to the behavior policy, then we wouldn't have this issue."},{"start":1506.09,"text":"The question is, what happens if you have a discrete action space? So basically everything will be the same. It's possible that your data set, if in all the states in your data set, it has full coverage of the actions, then you won't have this problem because everything will be in distribution."},{"start":1527.98,"text":"But in practice, usually there will be states where you don't have full coverage of all actions. You can still see overestimation in those states."},{"start":1536.43,"text":"Yeah, so the question is, can you just exclude out-of-distribution actions when you're updating your Q function? Yeah, and there are approaches for doing that. Now, the unfortunate thing is we don't actually know what's in distribution and out-of-distribution. So we have just samples of states and actions. And for a given state, you might have one state that then chooses A1."},{"start":1560.09,"text":"Then you might have another state that's not exactly the same but very similar, and that takes A2."},{"start":1564.71,"text":"And so in that case, A2 might technically not be seen for the first state,"}],"speech_gaps":[],"frame":"../frames/v034/009.webp","frame_time":1405.34},{"title":"离线强化学习中的过估计与行为策略偏差","segments":[{"id":141,"text":"but you don't necessarily know, like you don't know for a given state what's in distribution and what's out of distribution.","zh":"但你并不一定知道，比如你不知道对于给定的状态，哪些行为是分布内的，哪些是分布外的。","start":1571.61,"end":1576.21},{"id":142,"text":"And yeah, we'll basically see, basically a key idea behind offline RL methods is trying to avoid,","zh":"是的，我们基本上会看到，离线强化学习方法背后的一个关键思想是试图避免，","start":1578.55,"end":1584.75},{"id":143,"text":"well, first trying to think about how we deviate not too much from the behavior policy.","zh":"首先，尝试思考如何不过度偏离行为策略。","start":1585.17,"end":1589.23},{"id":144,"text":"and second, can we avoid out of distribution actions? Okay, so let's talk about mitigating","zh":"其次，我们能否避免分布外的动作？好的，那么让我们谈谈如何缓解","start":1589.23,"end":1597.81},{"id":145,"text":"overestimation. This is really the core goal behind offline RL methods. So the one approach","zh":"过估计。这是离线强化学习方法背后的核心目标。因此，一种离线强化学习的方法基本上是进行模仿学习。","start":1597.81,"end":1608.51},{"id":146,"text":"to offline RL is basically to do imitation learning. And the reason why imitation learning","zh":"模仿学习之所以有效，是因为你只用数据中出现的动作进行监督。","start":1608.51,"end":1615.43},{"id":147,"text":"works is that you're only supervising with actions that are seen in the data.","zh":"因此，任何使用模仿学习的方法都将避免","start":1615.43,"end":1620.31},{"id":148,"text":"And so any sort of approach that uses imitation learning is going to be avoiding","zh":"分布外的动作。","start":1620.73,"end":1625.07},{"id":149,"text":"out-of-distribution actions somewhat implicitly because you're only going to be supervising with","zh":"out-of-distribution actions 有些隐式地被处理，因为你的监督仅限于数据中的动作。","start":1625.07,"end":1631.07},{"id":150,"text":"actions that are in the data. Now, we don't necessarily want to use vanilla imitation","zh":"现在，我们并不一定想要使用普通的模仿学习，因为离线数据可能并不是最优的。","start":1631.07,"end":1636.43},{"id":151,"text":"learning because the offline data may not be optimal. There might be human drivers in your","zh":"例如，你的数据集中可能包含人类驾驶员，他们驾驶的方式可能与你希望自动驾驶汽车驾驶的方式不同。","start":1636.43,"end":1641.73},{"id":152,"text":"data set, for example, that don't drive in the way that you want your","zh":"并且","start":1641.73,"end":1645.69},{"id":153,"text":"autonomous vehicle to drive. And","zh":"离线URL方法应该提供一种方式，","start":1645.69,"end":1649.31},{"id":154,"text":"offline URL methods should provide a way to","zh":"通过利用奖励和...","start":1649.31,"end":1653.09},{"id":155,"text":"be better than the policy that underlies the data by leveraging","zh":"来超越数据背后策略的表现。","start":1653.09,"end":1657.71},{"id":156,"text":"reward and...","zh":"奖励和...","start":1657.71,"end":1658.33},{"id":157,"text":"by leveraging the fact that maybe you can kind of go through your data set and say that this was a behavior that was good, and maybe this was a behavior that was not as good. And that reward information can allow you to get a better policy. And then, yeah, vanilla imitation learning can't outperform the expert or what's provided in the data. The other thing that I'll mention is that I'm not sure if there's an analogous situation","zh":"通过利用这样一个事实，也许你可以遍历你的数据集，并说这个行为是好的，而另一个行为可能不是那么好。并且奖励信息可以让你得到一个更好的策略。然后，是的，普通的模仿学习无法超越专家或数据中提供的内容。另外我要提到的是，我不确定是否存在类似的情况。","start":1659.54,"end":1688.64},{"id":158,"text":"There is actually probably some analogous situation in driving, but a good offline URL method can also stitch together good behaviors. So if you have, where to put this? Say you have, maybe let's put it over here. So say you have some trajectory in your offline data set that looks something like this, and another trajectory in your data set that maybe looks something like this.","zh":"实际上在驾驶中可能确实存在类似的情况，但一个好的离线URL方法也可以将好的行为拼接起来。所以如果你有，应该把这放在哪里？比如说，你有离线数据集中的一条轨迹看起来像这样，而另一条轨迹可能看起来像这样。","start":1689.92,"end":1720.78},{"id":159,"text":"and say that this one got a good reward at the end and this one got a negative reward at the end, then a good offline URL method should realize that this is a good behavior and also the first part of this trajectory, if you continue along the green trajectory at the end, can be a good behavior. And a good offline URL method should realize that","zh":"并说这个轨迹在最后得到了一个好的奖励，而另一个轨迹在最后得到了一个负奖励，那么一个好的离线URL方法应该意识到这是一个好的行为，同时如果继续沿着绿色轨迹，这个轨迹的前半部分也可以是一个好的行为。一个好的离线URL方法应该意识到这一点。","start":1721.32,"end":1746.98}],"notes":["本段主要讲解离线强化学习（Offline RL）中的核心问题，即如何避免对行为策略的过度偏离以及如何避免采取分布外（out-of-distribution）的动作。这是离线强化学习方法的关键思想之一。","课程提到，一种常见的方法是模仿学习（imitation learning），其原理是仅使用数据中出现的动作进行监督。这种方法在一定程度上隐式地避免了分布外动作，因为只监督数据中存在的动作。","然而，课程指出，直接使用原始的模仿学习（vanilla imitation learning）可能无法达到最优，因为离线数据可能不是最优的。例如，数据中可能包含人类驾驶员的行为，而这些行为可能不符合自主车辆的期望。","因此，离线强化学习方法需要利用奖励信息来改进策略，从而超越数据中隐含的行为策略。课程还提到，可能存在类似的情况，例如在驾驶中，好的离线强化学习方法可以将多个好的行为组合起来。","最后，课程通过一个例子说明，如果两个轨迹分别获得了正负奖励，那么好的离线强化学习方法应该能够识别出其中的优秀行为，并将这些行为组合起来以形成更好的策略。","课程强调，离线强化学习的目标是避免过估计（overestimation），这是其核心目标之一。"],"formulas":[],"uncertainties":["URL methods should provide a way to"],"diagram":"none","start":1571.61,"end":1746.98,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":1571.61,"text":"but you don't necessarily know, like you don't know for a given state what's in distribution and what's out of distribution."},{"start":1578.55,"text":"And yeah, we'll basically see, basically a key idea behind offline RL methods is trying to avoid,"},{"start":1585.17,"text":"well, first trying to think about how we deviate not too much from the behavior policy."},{"start":1589.23,"text":"and second, can we avoid out of distribution actions? Okay, so let's talk about mitigating"},{"start":1597.81,"text":"overestimation. This is really the core goal behind offline RL methods. So the one approach"},{"start":1608.51,"text":"to offline RL is basically to do imitation learning. And the reason why imitation learning"},{"start":1615.43,"text":"works is that you're only supervising with actions that are seen in the data."},{"start":1620.73,"text":"And so any sort of approach that uses imitation learning is going to be avoiding"},{"start":1625.07,"text":"out-of-distribution actions somewhat implicitly because you're only going to be supervising with"},{"start":1631.07,"text":"actions that are in the data. Now, we don't necessarily want to use vanilla imitation"},{"start":1636.43,"text":"learning because the offline data may not be optimal. There might be human drivers in your"},{"start":1641.73,"text":"data set, for example, that don't drive in the way that you want your"},{"start":1645.69,"text":"autonomous vehicle to drive. And"},{"start":1649.31,"text":"offline URL methods should provide a way to"},{"start":1653.09,"text":"be better than the policy that underlies the data by leveraging"},{"start":1657.71,"text":"reward and..."},{"start":1659.54,"text":"by leveraging the fact that maybe you can kind of go through your data set and say that this was a behavior that was good, and maybe this was a behavior that was not as good. And that reward information can allow you to get a better policy. And then, yeah, vanilla imitation learning can't outperform the expert or what's provided in the data. The other thing that I'll mention is that I'm not sure if there's an analogous situation"},{"start":1689.92,"text":"There is actually probably some analogous situation in driving, but a good offline URL method can also stitch together good behaviors. So if you have, where to put this? Say you have, maybe let's put it over here. So say you have some trajectory in your offline data set that looks something like this, and another trajectory in your data set that maybe looks something like this."},{"start":1721.32,"text":"and say that this one got a good reward at the end and this one got a negative reward at the end, then a good offline URL method should realize that this is a good behavior and also the first part of this trajectory, if you continue along the green trajectory at the end, can be a good behavior. And a good offline URL method should realize that"}],"speech_gaps":[{"start":1576.61,"end":1578.15}],"frame":"../frames/v034/010.webp","frame_time":1583.61},{"title":"离线强化学习中的轨迹选择与基线方法","segments":[{"id":160,"text":"that when you're in these states, you should essentially be able to stitch together the first part of this trajectory and the second part of the green trajectory. And if you use vanilla imitation learning, you won't get that kind of behavior. Instead, what it will do is it will, in this state, it will take the average between these two action distributions.","zh":"当你处于这些状态时，你应该基本上能够将这条轨迹的第一部分和绿色轨迹的第二部分拼接起来。而如果你使用普通的模仿学习，你不会得到这种行为。相反，它会在这个状态下，在这两个动作分布之间取平均值。","start":1748.76,"end":1777.2},{"id":161,"text":"So what this could look like is if you have a couple trajectories like this, then we know that S1 to S3 is good behavior. We know S7 to S9 is good behavior. And so offline reinforcement learning methods, in principle, can actually learn how to get a policy that goes from S1 to S9, whereas imitation learning methods won't be able to do that.","zh":"这可能看起来像这样：如果你有一些这样的轨迹，那么我们知道从 S1 到 S3 是良好的行为。我们知道从 S7 到 S9 也是良好的行为。因此，离线强化学习方法原则上可以学习如何获得一个从 S1 到 S9 的策略，而模仿学习方法则无法做到这一点。","start":1777.61,"end":1807.5},{"id":162,"text":"So one idea is if you have an offline data set, you could also just take the trajectories that have high rewards and only imitate the stuff that is good and don't imitate the stuff that's bad. And that seems like a reasonable method. You have some offline data set that contains a variety of trajectories.","zh":"因此，一个想法是，如果你有一个离线数据集，你也可以只选择那些奖励较高的轨迹，并且只模仿好的部分，而不模仿坏的部分。这似乎是一个合理的方法。你有一个包含多种轨迹的离线数据集。","start":1810.12,"end":1835.45},{"id":163,"text":"then what you could do is you could define a new dataset that has only trajectories that have a high reward. And so what this new dataset would look like is it would be all of the trajectories in your original dataset.","zh":"然后你可以定义一个新的数据集，其中只包含奖励较高的轨迹。因此，这个新数据集看起来会是原始数据集中所有轨迹。","start":1836.58,"end":1851.94},{"id":164,"text":"except conditioned on the reward of that trajectory being greater than some threshold. And that threshold could be some percentile of the rewards in your data set, like the 70th percentile, for example, like only taking the top 30% of trajectories. And then from there, you could learn a policy that maximizes the...","zh":"但前提是这些轨迹的奖励高于某个阈值。这个阈值可以是数据集中奖励的某个百分位数，例如第 70 百分位数，比如只取前 30% 的轨迹。然后，你可以从那里学习一个策略，以最大化……","start":1853.33,"end":1879.31},{"id":165,"text":"likelihood of the actions in this modified data set. So that would look like taking the states and actions in this modified data set and maximizing the log probability of the actions given the state. So this is the typical imitation learning objective. Cool. So this is perhaps our first offline or all method, I guess. Very, very basic.","zh":"修改后数据集中动作的似然性。因此，这看起来像是取修改后的数据集中的状态和动作，并最大化给定状态下的动作的对数概率。因此，这就是典型的模仿学习目标。很好。因此，这可能是我们第一个离线或全部方法，我想。非常、非常基础。","start":1880.25,"end":1908.75}],"notes":["本段讲授了离线强化学习（Offline RL）与模仿学习（Imitation Learning）之间的区别。在离线强化学习中，模型可以将不同轨迹的片段组合起来，从而学习到从S1到S9的策略，而模仿学习则无法做到这一点。这是因为模仿学习会简单地对两个动作分布取平均，无法实现轨迹的拼接。","接下来，课程介绍了离线强化学习的一个简单基线方法，即通过选择高奖励的轨迹来构建新的数据集。这种方法的思路是只模仿那些表现良好的轨迹，忽略表现差的轨迹。这在实际中是合理的，因为高奖励的轨迹通常代表了更优的行为。","在构建新数据集时，需要对原始数据集中的轨迹进行筛选，只保留奖励高于某个阈值的轨迹。这个阈值可以是奖励分布的某个百分位数，例如70百分位，这样就能保留最顶端的30%的轨迹。","在构建完新数据集后，可以基于这些轨迹学习一个策略，该策略的目标是最大化修改后的数据集中动作的对数概率。这实际上是模仿学习的标准目标函数，即最大化给定状态下的动作的对数概率。","这种方法虽然简单，但它是离线强化学习的一个基础方法，为后续更复杂的算法提供了参考。它强调了在离线数据集中选择高质量轨迹的重要性，以提高策略的性能。","课程还提到，这种方法是“first offline or all method”，表明这是离线强化学习中的一种初步方法，为后续更复杂的算法奠定了基础。"],"formulas":[{"latex":"P(a|s)\\text{ 给定状态 }s\\text{ 下动作 }a\\text{ 的概率}","symbols":"给定状态s下动作a的概率","explanation":"公式P(a|s)表示在状态s下动作a的概率，符合概率论中条件概率的定义，无需修改。","evidence":"likelihood of the actions in this modified data set. So that would look like taking the states and actions in this modified data set and maximizing the log probability of the actions given the state. So this is the typical imitation learning objective. Cool. So this is perhaps our first offline or all method, I guess. Very, very basic."}],"uncertainties":[],"diagram":"none","start":1748.76,"end":1908.75,"asr_flags":[],"math_clarifications":["原文未涉及复杂的数学公式，仅提及P(a|s)作为条件概率，符合上下文描述的模仿学习目标。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1748.76,"text":"that when you're in these states, you should essentially be able to stitch together the first part of this trajectory and the second part of the green trajectory. And if you use vanilla imitation learning, you won't get that kind of behavior. Instead, what it will do is it will, in this state, it will take the average between these two action distributions. So what this could look like is if you have a couple trajectories like this,"},{"start":1777.61,"text":"then we know that S1 to S3 is good behavior. We know S7 to S9 is good behavior. And so offline reinforcement learning methods, in principle, can actually learn how to get a policy that goes from S1 to S9, whereas imitation learning methods won't be able to do that. Okay. So before we get into methods that can do that kind of stitching, let's first talk about a very simple baseline method."},{"start":1810.12,"text":"So one idea is if you have a offline data set, you could also just take the trajectories that have high rewards and only imitate the stuff that is good and don't imitate the stuff that's bad. And that seems like a reasonable method. You have some offline data set that contains a variety of trajectories."},{"start":1836.58,"text":"then what you could do is you could define a new dataset that has only trajectories that have a high reward. And so what this new dataset would look like is it would be all of the trajectories in your original dataset."},{"start":1853.33,"text":"except conditioned on the
