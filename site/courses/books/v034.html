particular objective. And I'll mention that on the slides. We won't go through the derivation, but if you're interested, we can see if we can post it after lecture."}],"speech_gaps":[{"start":2046.256,"end":2047.824}],"frame":"../frames/v034/012.webp","frame_time":1922.43},{"title":"离线强化学习中的优势函数与行为策略约束","segments":[{"id":182,"text":"In terms of this objective, if we have a good advantage function and we go back to the stitching example, for this particular state right here, we know that the advantage of this action is high, right? Because the value, the Q value of this is one. The Q value for going this way, at least in the data, is zero.","start":2076.26,"end":2105.51},{"id":183,"text":"And the value of this state will be the average of those two outcomes. And so the advantage for this one will be positive, and the advantage for going this direction will be negative. And so when we then take our imitation learning objective and weight it by the advantages, we're going to be telling our policy that in that state, it should go to the good outcome rather than going to the bad outcome.","start":2106.09,"end":2130.87},{"id":184,"text":"And so this objective, if you have a good advantage estimate, is capable of kind of stitching together good behaviors in an offline data set. So in terms of the derivation, you can show that this advantage-weighted imitation learning objective is approximating","start":2131.71,"end":2147.54},{"id":185,"text":"a KL constraint objective, where you can show that it's maximizing the future rewards as measured by your Q value,","start":2149.17,"end":2159.41},{"id":186,"text":"subject to the constraint that you're staying close to your behavior policy.","start":2159.57,"end":2164.51},{"id":187,"text":"And this is a pretty reasonable objective for offline RL, because if you're too far from your behavior policy,","start":2164.99,"end":2171.99},{"id":188,"text":"then you won't be able to, you won't be able to actually get good information about how to","start":2171.99,"end":2181.41},{"id":189,"text":"improve your policy. Okay, so before we talk about how we estimate the advantage and what","start":2181.41,"end":2191.79},{"id":190,"text":"this advantage will be, any questions on what this objective looks like? Yeah, so the question is,","start":2191.79,"end":2197.57},{"id":191,"text":"for this to improve over imitation learning, do we need to assume that our trajectories have","start":2197.57,"end":2202.43},{"id":192,"text":"intersecting states? And the brief answer is that no, we generally don't have to assume that. And","start":2203.17,"end":2211.05},{"id":193,"text":"in this diagram, I actually tried to have S7 and S3 not be exactly the same state.","start":2211.05,"end":2216.17},{"id":194,"text":"And the reason why we don't need them to be exactly the same is that if we're using a neural","start":2216.73,"end":2221.57},{"id":195,"text":"network to represent the policy and the advantage function, then it will naturally... States and","start":2221.57,"end":2230.53},{"id":196,"text":"actions that are very similar to each other will naturally have similar outputs from that neural","start":2230.53,"end":2234.91},{"id":197,"text":"network. And so it should be able to generalize if the states are similar to each other, but not","start":2234.91,"end":2242.93},{"id":198,"text":"exactly intersecting. Now, the degree to how well this works will depend on how close those states","start":2242.93,"end":2250.03},{"id":199,"text":"are and how large the data set is such that it can learn a representation that is","start":2250.03,"end":2254.69}],"notes":["本段讲解了离线强化学习中优势函数的应用，通过优势函数对模仿学习目标进行加权，使得策略能够选择更优的动作。优势函数的估计对于将不同状态下的行为进行连接（stitching）至关重要。","在推导过程中，优势加权的模仿学习目标可以近似为一个KL约束目标，即在保持与行为策略接近的前提下最大化未来奖励。这种目标在离线强化学习中是合理的，因为远离行为策略会导致无法获取有效的策略改进信息。","关于是否需要轨迹状态相交的问题，讲者指出不需要假设状态完全相同，因为神经网络可以自然地对相似状态和动作进行泛化，从而实现策略的改进。","状态相似性与数据集的大小会影响这种方法的效果，数据集越大，越有可能学习到有效的表示。"],"formulas":[],"uncertainties":["在公式推导中，'approximating a KL constraint objective'的具体形式未明确，可能涉及更复杂的数学关系。"],"diagram":"none","start":2076.26,"end":2254.69,"asr_flags":[],"math_clarifications":["原始文本中未提及变分推断或生成模型，因此ELBO和KL散度公式与上下文无关，应被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2076.26,"text":"In terms of this objective, if we have a good advantage function and we go back to the stitching example, for this particular state right here, we know that the advantage of this action is high, right? Because the value, the Q value of this is one. The Q value for going this way, at least in the data, is zero."},{"start":2106.09,"text":"And the value of this state will be the average of those two outcomes. And so the advantage for this one will be positive, and the advantage for going this direction will be negative. And so when we then take our imitation learning objective and weight it by the advantages, we're going to be telling our policy that in that state, it should go to the good outcome rather than going to the bad outcome."},{"start":2131.71,"text":"And so this objective, if you have a good advantage estimate, is capable of kind of stitching together good behaviors in an offline data set. So in terms of the derivation, you can show that this advantage-weighted imitation learning objective is approximating"},{"start":2149.17,"text":"a KL constraint objective, where you can show that it's maximizing the future rewards as measured by your Q value,"},{"start":2159.57,"text":"subject to the constraint that you're staying close to your behavior policy."},{"start":2164.99,"text":"And this is a pretty reasonable objective for offline RL, because if you're too far from your behavior policy,"},{"start":2171.99,"text":"then you won't be able to, you won't be able to actually get good information about how to"},{"start":2181.41,"text":"improve your policy. Okay, so before we talk about how we estimate the advantage and what"},{"start":2191.79,"text":"this advantage will be, any questions on what this objective looks like? Yeah, so the question is,"},{"start":2197.57,"text":"for this to improve over imitation learning, do we need to assume that our trajectories have"},{"start":2203.17,"text":"intersecting states? And the brief answer is that no, we generally don't have to assume that. And"},{"start":2211.05,"text":"in this diagram, I actually tried to have S7 and S3 not be exactly the same state."},{"start":2216.73,"text":"And the reason why we don't need them to be exactly the same is that if we're using a neural"},{"start":2221.57,"text":"network to represent the policy and the advantage function, then it will naturally... States and"},{"start":2230.53,"text":"actions that are very similar to each other will naturally have similar outputs from that neural"},{"start":2234.91,"text":"network. And so it should be able to generalize if the states are similar to each other, but not"},{"start":2242.93,"text":"exactly intersecting. Now, the degree to how well this works will depend on how close those states"},{"start":2250.03,"text":"are and how large the data set is such that it can learn a representation that is"}],"speech_gaps":[],"frame":"../frames/v034/013.webp","frame_time":2088.26},{"title":"离线强化学习中的优势函数与策略关联","segments":[{"id":200,"text":"collapsing those representations to something that looks similar.","start":2255.35,"end":2258.15},{"id":201,"text":"The question is, in practice, do we need to worry about the exponential term exploding? When we look at a practical implementation of this, we will actually add a hyperparameter that corresponds to the temperature of this. And so the practical algorithm will have","start":2259.16,"end":2276.34},{"id":202,"text":"like a one over alpha times the advantage, and that can help prevent this from getting","start":2277.99,"end":2286.33},{"id":203,"text":"extremely large. Yeah, and then I guess it depends a bit...","start":2286.33,"end":2293.19},{"id":204,"text":"Maybe we'll talk about it also a bit more when we get into fitting advantages.","start":2296.03,"end":2299.65},{"id":205,"text":"Yeah, I knew this question would come up. So when we talked about actor-critic methods,","start":2300.53,"end":2304.93},{"id":206,"text":"we just had the advantage here. The other key difference was that here we're sampling","start":2304.93,"end":2309.65},{"id":207,"text":"from our offline data set and in the actor critic objectives, the action, well, there's","start":2309.73,"end":2313.83},{"id":208,"text":"different versions, but we're sampling from an online data set typically. And in the,","start":2313.83,"end":2322.27},{"id":209,"text":"in soft actor critic, this action actually comes from your policy, not from the data","start":2322.27,"end":2326.81},{"id":210,"text":"set. There isn't a very quick way to derive where those differences come from. I don't want to","start":2328.07,"end":2332.59},{"id":211,"text":"confuse you, but one way of thinking about this is oftentimes offline, online URL objectives will","start":2332.59,"end":2347.11},{"id":212,"text":"be optimizing a reverse KL objective and offline are looking more at a forward KL objective. But","start":2347.11,"end":2356.05},{"id":213,"text":"be optimizing a reverse KL objective and offline are looking more at a forward KL objective. But","start":2356.05,"end":2361.21},{"id":214,"text":"But it's a longer explanation.","start":2361.21,"end":2364.53},{"id":215,"text":"Yeah.","start":2364.87,"end":2365.09},{"id":216,"text":"Okay.","start":2365.87,"end":2366.51},{"id":217,"text":"And there's also some references here as well.","start":2367.61,"end":2370.35},{"id":218,"text":"Okay.","start":2371.89,"end":2372.53},{"id":219,"text":"So we've talked about this advantage.","start":2372.57,"end":2374.09},{"id":220,"text":"Now, advantages actually have some policy associated with them.","start":2374.47,"end":2380.15},{"id":221,"text":"It's not...","start":2380.23,"end":2381.13},{"id":222,"text":"It's the advantage of taking action A in state S and then following some policy. And so the first question is, which policy are we trying to estimate the advantage for? For now, we can try to estimate the advantage of the behavior policy. And then a key question comes up is, how do we want to estimate this advantage function? And ideally, in a way that prevents the overestimation that we saw before.","start":2381.75,"end":2410.89}],"notes":["本段讨论了在离线强化学习中，优势函数的估计与策略之间的关系。讲者提到，优势函数与特定策略相关联，例如行为策略。在估计优势函数时，需要考虑如何避免之前提到的过估计问题。此外，讲者还提到，离线和在线目标函数在优化目标上存在差异，离线目标通常更关注前向KL散度，而在线目标则可能涉及反向KL散度。","讲者指出，在离线强化学习中，优势函数的估计需要考虑策略的选择，例如行为策略。同时，讲者提到，优势函数的估计方法需要避免过估计问题，这与之前讨论的策略梯度方法中的问题类似。","讲者还提到，离线和在线目标函数在实现上存在差异，例如在线目标通常从在线数据集中采样，而离线目标则从离线数据集中采样。此外，在软演员-评论家方法中，动作来自策略而非数据集。","讲者提到，离线目标函数通常优化前向KL散度，而在线目标函数可能涉及反向KL散度。这种差异反映了两种方法在优化目标上的不同，但讲者也指出，这种解释较为复杂，需要更深入的讨论。","讲者强调，优势函数的估计需要考虑策略的选择，并且需要避免过估计问题。这与之前讨论的策略梯度方法中的问题类似，但离线强化学习中的优势函数估计更加复杂。","讲者提到，优势函数与策略相关联，因此在估计优势函数时，需要明确所使用的策略。例如，行为策略的估计可能需要不同的方法，以避免过估计问题。"],"formulas":[{"latex":"KL(q \\| p)","symbols":"KL散度","explanation":"KL散度的符号正确，表示从分布q到分布p的Kullback-Leibler散度，适用于概率分布之间的差异度量。","evidence":"confuse you, but one way of thinking about this is oftentimes offline, online URL objectives will"}],"uncertainties":["URL可能为误识别，实际应为'objective'或'objectives'。","在讲者提到'offline, online URL objectives'时，'URL'可能是误识别，实际应为'objectives'。","在讲者提到'forward KL objective'和'reverse KL objective'时，'forward'和'reverse'是否准确对应前向和反向KL散度需要进一步确认。"],"diagram":"none","start":2255.35,"end":2410.89,"asr_flags":[],"math_clarifications":["原始文本中未出现数学公式，因此无需进行数学修复。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2255.35,"text":"collapsing those representations to something that looks similar."},{"start":2259.16,"text":"The question is, in practice, do we need to worry about the exponential term exploding? When we look at a practical implementation of this, we will actually add a hyperparameter that corresponds to the temperature of this. And so the practical algorithm will have"},{"start":2277.99,"text":"like a one over alpha times the advantage, and that can help prevent this from getting"},{"start":2286.33,"text":"extremely large. Yeah, and then I guess it depends a bit..."},{"start":2296.03,"text":"Maybe we'll talk about it also a bit more when we get into fitting advantages."},{"start":2300.53,"text":"Yeah, I knew this question would come up. So when we talked about actor-critic methods,"},{"start":2304.93,"text":"methods, the objective looked like kind of similar to this, except instead of exponentiating,"},{"start":2309.73,"text":"we just had the advantage here. The other key difference was that here we're sampling"},{"start":2313.83,"text":"from our offline data set and in the actor critic objectives, the action, well, there's"},{"start":2322.27,"text":"different versions, but we're sampling from an online data set typically. And in the,"},{"start":2328.07,"text":"in soft actor critic, this action actually comes from your policy, not from the data"},{"start":2332.59,"text":"set. There isn't a very quick way to derive where those differences come from. I don't want to"},{"start":2347.11,"text":"confuse you, but one way of thinking about this is oftentimes offline, online URL objectives will"},{"start":2356.05,"text":"be optimizing a reverse KL objective and offline are looking more at a forward KL objective. But"},{"start":2361.21,"text":"But it's a longer explanation."},{"start":2364.87,"text":"Yeah."},{"start":2365.87,"text":"Okay."},{"start":2367.61,"text":"And there's also some references here as well."},{"start":2371.89,"text":"Okay."},{"start":2372.57,"text":"So we've talked about this advantage."},{"start":2374.47,"text":"Now, advantages actually have some policy associated with them."},{"start":2380.23,"text":"It's not..."},{"start":2381.75,"text":"It's the advantage of taking action A in state S and then following some policy. And so the first question is, which policy are we trying to estimate the advantage for? For now, we can try to estimate the advantage of the behavior policy. And then a key question comes up is, how do we want to estimate this advantage function? And ideally, in a way that prevents the overestimation that we saw before."}],"speech_gaps":[],"frame":"../frames/v034/014.webp","frame_time":2267.35},{"title":"离线强化学习中的优势函数估计","segments":[{"id":223,"text":"So the first way that we can estimate the advantage function, I mean, generally it will look very similar to what we saw before. We'd estimate the advantage function, but there's a couple other considerations. So let's say version, maybe I'll do this in a new color. So let's say version one, oh, it's v1. Version one, we're going to,","start":2415.42,"end":2445.58},{"id":224,"text":"Use the simplest thing that we had before, which is to use Monte Carlo returns. So we can first fit a value function. And because we're fitting the value function for the behavior policy, we don't need to... The data is coming from the policy that we're trying to evaluate a value function for. So if we want to fit a value function with Monte Carlo returns, then our objective...","start":2446.43,"end":2475.82},{"id":225,"text":"looks... we're trying to regress to the sum of future rewards. So our objective looks something like this. This is something that can basically supervise learning to the future rewards. And then once we do this, which is fairly straightforward, then the question is how do we get the advantage out of this?","start":2477.68,"end":2505.64},{"id":226,"text":"There's a couple ways you could do this. In the first time that we saw this, the way that we got the advantage function for a given state in action was to use the reward plus the value function at the next time step minus the value function at the current time step. And these are all the value function.","start":2506.65,"end":2537.12},{"id":227,"text":"that we just estimated. So you could use this. The one alternative, well, so you could use this. This is going to rely on having a value function that is fairly accurate because you're doing this kind of one step kind of temporal difference between the reward plus the value here minus the value at the current state. And so one alternative thing that you could do is instead of using","start":2538.38,"end":2566.39}],"notes":["本段讨论了在离线强化学习中如何估计优势函数。讲者提到，优势函数的估计方法与之前类似，但需要考虑一些额外因素。讲者首先提到使用蒙特卡洛回报来拟合价值函数，因为数据来自行为策略，因此不需要额外的调整。接着讲者指出，优势函数可以通过奖励加上下一时刻的价值函数减去当前时刻的价值函数来计算，这需要价值函数的估计足够准确。","讲者进一步说明，这种方法依赖于价值函数的准确性，因为这是基于一步的时间差分方法。讲者还提到，另一种方法是不使用价值函数，而是直接估计优势函数，但具体方法未明确说明。讲者强调，优势函数的估计需要考虑价值函数的准确性，以及如何从价值函数中推导出优势函数。"],"formulas":[{"latex":"A(s, a) = r + V(s') - V(s)","symbols":"优势函数等于奖励加上下一状态的价值函数减去当前状态的价值函数","explanation":"公式正确表达了优势函数的定义，其中r表示即时奖励，V(s')和V(s)分别表示下一状态和当前状态的价值函数。该公式适用于基于价值函数的策略评估方法，如TD学习。","evidence":"There's a couple ways you could do this. In the first time that we saw this, the way that we got the advantage function for a given state in action was to use the reward plus the value function at the next time step minus the value function at the current time step. And these are all the value function."}],"uncertainties":["可能听不清的公式细节，如是否包含折扣因子或是否为期望值"],"diagram":"none","start":2415.42,"end":2566.39,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型正确，没有发现明显的转写或整理错误。优势函数的定义符合强化学习中的标准定义，即A(s, a) = r + γV(s') - V(s)，其中γ是折扣因子。此处未包含γ，可能需要根据上下文确认是否需要添加。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2415.42,"text":"So the first way that we can estimate the advantage function, I mean, generally it will look very similar to what we saw before. We'd estimate the advantage function, but there's a couple other considerations. So let's say version, maybe I'll do this in a new color. So let's say version one, oh, it's v1. Version one, we're going to,"},{"start":2446.43,"text":"Use the simplest thing that we had before, which is to use Monte Carlo returns. So we can first fit a value function. And because we're fitting the value function for the behavior policy, we don't need to... The data is coming from the policy that we're trying to evaluate a value function for. So if we want to fit a value function with Monte Carlo returns, then our objective..."},{"start":2477.68,"text":"looks... we're trying to regress to the sum of future rewards. So our objective looks something like this. This is something that can basically supervise learning to the future rewards. And then once we do this, which is fairly straightforward, then the question is how do we get the advantage out of this?"},{"start":2506.65,"text":"There's a couple ways you could do this. In the first time that we saw this, the way that we got the advantage function for a given state in action was to use the reward plus the value function at the next time step minus the value function at the current time step. And these are all the value function."},{"start":2538.38,"text":"that we just estimated. So you could use this. The one alternative, well, so you could use this. This is going to rely on having a value function that is fairly accurate because you're doing this kind of one step kind of temporal difference between the reward plus the value here minus the value at the current state. And so one alternative thing that you could do is instead of using"}],"speech_gaps":[],"frame":"../frames/v034/015.webp","frame_time":2427.42},{"title":"离线强化学习中的价值函数与优势函数估计","segments":[{"id":228,"text":"this estimated, this reward plus value, which is basically the estimate, the estimated future rewards. If you start state T and take action A minus your current value is instead you could simply use the empirical sum of rewards into the future. And so this could simply be the","start":2569.31,"end":2597.2},{"id":229,"text":"And this is going to be a little bit simpler and doesn't rely on having a good kind of temporal difference between the two.","start":2610.06,"end":2619.38},{"id":230,"text":"And so specifically, we can first estimate the value function by trying to minimize the difference between our value estimate and the sum of rewards.","start":2620.7,"end":2628.78},{"id":231,"text":"rewards. And then to estimate the advantage function, we can take the sum of rewards for","start":2628.78,"end":2637.88},{"id":232,"text":"that trajectory and subtract the value. In terms of this particular advantage estimate","start":2637.88,"end":2647.42},{"id":233,"text":"corresponds to a fairly simple and fairly popular algorithm called advantage weighted","start":2647.42,"end":2653.32},{"id":234,"text":"weighted regression. I should emphasize that the way that we did it previously, where you","start":2653.32,"end":2665.0},{"id":235,"text":"use r plus v of s t plus 1, is also valid. This simply corresponds to a method that is","start":2665.0,"end":2671.1},{"id":236,"text":"used pretty commonly and seems to work well in practice when you have an offline dataset.","start":2671.1,"end":2675.84},{"id":237,"text":"The question was, we talked about before how this is somewhat high variance and GAE is","start":2677.08,"end":2681.8},{"id":238,"text":"better. You could also use GAE here, definitely. This is going to be a little bit simpler,","start":2681.8,"end":2688.34},{"id":239,"text":"but you could also use generalized advantage estimation.","start":2689.3,"end":2693.42},{"id":240,"text":"Yeah, that's a good question. So the question is, are we bringing up this Monte Carlo because with an offline data set, we have enough data that sum of rewards is more accurate and we don't have the variance issues that we saw before. That's definitely one reason. When you have a large offline data set, variance is a bit less of a concern. And these are more accurate. That said, a big part of it is also just simplicity. And it's nice.","start":2694.5,"end":2721.84},{"id":241,"text":"Yeah, it's very nice to have an algorithm where you're doing kind of supervised learning to fit the value function and then you're doing weighted supervised learning to fit the policy.","start":2723.57,"end":2730.57},{"id":242,"text":"And it's just a very, very simple algorithm.","start":2730.75,"end":2732.77},{"id":243,"text":"Next, we'll talk about slightly more complicated algorithms that then kind of this version one right here that can also do a bit better.","start":2733.97,"end":2744.19}],"notes":["本段主要讲解了在离线强化学习中，如何通过估计价值函数和优势函数来构建策略。价值函数的估计是通过最小化估计值与未来奖励总和之间的差异，而优势函数则是通过从轨迹中获取奖励总和并减去价值函数来计算。这种方法被称为优势加权回归，是一种简单且流行的算法。","讲者强调了两种方法的对比：一种是使用奖励加上下一状态的价值函数（r + V(s_{t+1}）），另一种是使用蒙特卡洛方法直接计算奖励总和。前者在离线数据集中表现良好，但存在较高的方差，而后者虽然更准确，但计算复杂度更高。","讲者提到，使用蒙特卡洛方法的原因之一是，当离线数据集足够大时，奖励总和的估计更加准确，且方差问题相对较小。此外，这种方法的实现较为简单，因此在实际应用中更受欢迎。","讲者还指出，虽然蒙特卡洛方法在某些情况下更优，但也可以使用广义优势估计（GAE）来减少方差。GAE是一种在离线强化学习中常用的改进方法，能够平衡方差和偏差。","讲者进一步说明，使用监督学习来拟合价值函数和加权监督学习来拟合策略是一种非常直观且有效的策略。这种方法的实现非常简单，适合初学者理解和应用。","最后，讲者提到接下来将介绍更复杂的算法，这些算法在某些情况下可以比当前讨论的简单方法表现得更好。这表明离线强化学习中存在多种方法，每种方法都有其适用场景和优缺点。"],"formulas":[],"uncertainties":["r plus v of s t plus 1","sum of rewards is more accurate"],"diagram":"none","start":2569.31,"end":2744.19,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2569.31,"text":"this estimated, this reward plus value, which is basically the estimate, the estimated future rewards. If you start state T and take action A minus your current value is instead you could simply use the empirical sum of rewards into the future. And so this could simply be the,"},{"start":2610.06,"text":"And this is going to be a little bit simpler and doesn't rely on having a good kind of temporal difference between the two."},{"start":2620.7,"text":"And so specifically, we can first estimate the value function by trying to minimize the difference between our value estimate and the sum of rewards."},{"start":2628.78,"text":"rewards. And then to estimate the advantage function, we can take the sum of rewards for"},{"start":2637.88,"text":"that trajectory and subtract the value. In terms of this particular advantage estimate"},{"start":2647.42,"text":"corresponds to a fairly simple and fairly popular algorithm called advantage weighted"},{"start":2653.32,"text":"weighted regression. I should emphasize that the way that we did it previously, where you"},{"start":2665.0,"text":"use r plus v of s t plus 1, is also valid. This simply corresponds to a method that is"},{"start":2671.1,"text":"used pretty commonly and seems to work well in practice when you have an offline dataset."},{"start":2677.08,"text":"The question was, we talked about before how this is somewhat high variance and GAE is"},{"start":2681.8,"text":"better. You could also use GAE here, definitely. This is going to be a little bit simpler,"},{"start":2689.3,"text":"but you could also use generalized advantage estimation."},{"start":2694.5,"text":"Yeah, that's a good question. So the question is, are we bringing up this Monte Carlo because with an offline data set, we have enough data that sum of rewards is more accurate and we don't have the variance issues that we saw before. That's definitely one reason. When you have a large offline data set, variance is a bit less of a concern. And these are more accurate. That said, a big part of it is also just simplicity. And it's nice."},{"start":2723.57,"text":"Yeah, it's very nice to have an algorithm where you're doing kind of supervised learning to fit the value function and then you're doing weighted supervised learning to fit the policy."},{"start":2730.75,"text":"And it's just a very, very simple algorithm."},{"start":2733.97,"text":"Next, we'll talk about slightly more complicated algorithms that then kind of this version one right here that can also do a bit better."}],"speech_gaps":[],"frame":"../frames/v034/016.webp","frame_time":2581.31},{"title":"离线强化学习中的优势估计与策略偏差","segments":[{"id":244,"text":"So it's still even when you have an offline data set, there is like variance, more variance in this estimate than other estimates that we'll see in a minute.","start":2744.29,"end":2751.95},{"id":245,"text":"Now, one question that just to get your brains thinking a little bit.","start":2753.63,"end":2759.83},{"id":246,"text":"So the question is, if you did this for a deterministic data set or a policy that was deterministic underlying the data set, what do you actually learn?","start":2759.97,"end":2772.43},{"id":247,"text":"And so as an example, let's say that we have the car again. And maybe the car, if it's in some lanes,","start":2772.43,"end":2791.91},{"id":248,"text":"maybe it just always goes straight and you never actually see it turn left or turn right. My","start":2792.05,"end":2798.69},{"id":249,"text":"My question for you is, yeah, if you were to run this algorithm where you are fitting your advantages in this way on the data set, what advantages will you learn?","start":2798.69,"end":2811.41},{"id":250,"text":"And I'll let you talk about this for like two minutes and then we'll come back to talk about this with your neighbor.","start":2811.73,"end":2817.11},{"id":251,"text":"OK, let's come back. Does anyone want to share what you just?","start":2822.43,"end":2826.35},{"id":252,"text":"Yeah, so what was said is that if you're always taking the same action, then the sum of rewards will be the same as V because you don't actually see any kind of variability in your actions. And that means that your advantage estimates will all be zero.","start":2828.0,"end":2842.9},{"id":253,"text":"And then taking that one step further, if you then plug this into this equation, if all your advantage estimates are 0, then this exponential term is going to be 1. And then you actually just get back kind of vanilla imitation learning. And it's kind of nice that you get that back because it means that for this sort of policy,","start":2843.7,"end":2862.9},{"id":254,"text":"you actually can't really do better than the behavior policy in that scenario because you don't see any variability in different actions you can take. And so this algorithm then kind of falls back on imitation learning in that scenario. Yeah, so the question is, when collecting data from offline RL, does this mean that you should kind of sometimes deviate from the expert policy just to see more example actions? And yeah, generally having more diverse...","start":2863.84,"end":2888.42},{"id":255,"text":"actions represented in your offline data set is good for offline RL, especially if you think that your expert is not the optimal thing to do, then you definitely want variability because then you can actually have the potential to outperform the expert in your data.","start":2890.2,"end":2902.62}],"notes":["本段讨论了在离线强化学习中，当数据集中没有动作多样性时，优势估计会如何变化。讲者通过一个汽车的例子说明，如果数据集中只包含一直直行的动作，那么优势估计会全部为零，因为没有动作的差异性。","讲者进一步指出，当优势估计为零时，算法会退化为模仿学习，这意味着在这种情况下，无法超越行为策略的表现。这表明数据集的多样性对于离线强化学习非常重要。","讲者提出，为了提高离线强化学习的效果，应该在数据集中包含更多样化的动作。如果认为专家策略并非最优，那么数据集的多样性可以提供改进的潜力。","讲者强调，数据集的多样性是离线强化学习成功的关键因素之一，尤其是在专家策略可能不是最优的情况下，多样性可以带来更好的策略学习。","讲者通过一个具体的例子说明了优势估计的计算过程，以及当数据集中没有动作变化时，优势估计会如何影响最终的策略学习。","讲者最后提出一个开放性问题，即在收集离线数据时，是否应该有时偏离专家策略以获取更多样化的动作示例，这引发了对数据集多样性的进一步思考。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2744.29,"end":2902.62,"asr_flags":[247],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2744.29,"text":"So it's still even when you have an offline data set, there is like variance, more variance in this estimate than other estimates that we'll see in a minute."},{"start":2753.63,"text":"Now, one question that just to get your brains thinking a little bit."},{"start":2759.97,"text":"So the question is, if you did this for a deterministic data set or a policy that was deterministic underlying the data set, what do you actually learn?"},{"start":2772.43,"text":"And so as an example, let's say that we have the car again. And maybe the car, if it's in some lanes,"},{"start":2792.05,"text":"maybe it just always goes straight and you never actually see it turn left or turn right. My"},{"start":2798.69,"text":"My question for you is, yeah, if you were to run this algorithm where you are fitting your advantages in this way on the data set, what advantages will you learn?"},{"start":2811.73,"text":"And I'll let you talk about this for like two minutes and then we'll come back to talk about this with your neighbor."},{"start":2822.43,"text":"OK, let's come back. Does anyone want to share what you just?"},{"start":2828.0,"text":"Yeah, so what was said is that if you're always taking the same action, then the sum of rewards will be the same as V because you don't actually see any kind of variability in your actions. And that means that your advantage estimates will all be zero."},{"start":2843.7,"text":"And then taking that one step further, if you then plug this into this equation, if all your advantage estimates are 0, then this exponential term is going to be 1. And then you actually just get back kind of vanilla imitation learning. And it's kind of nice that you get that back because it means that for this sort of policy,"},{"start":2863.84,"text":"you actually can't really do better than the behavior policy in that scenario because you don't see any variability in different actions you can take. And so this algorithm then kind of falls back on imitation learning in that scenario. Yeah, so the question is, when collecting data from offline RL, does this mean that you should kind of sometimes deviate from the expert policy just to see more example actions? And yeah, generally having more diverse..."},{"start":2890.2,"text":"actions represented in your offline data set is good for offline RL, especially if you think that your expert is not the optimal thing to do, then you definitely want variability because then you can actually have the potential to outperform the expert in your data."}],"speech_gaps":[],"frame":"../frames/v034/017.webp","frame_time":2756.29},{"title":"离线强化学习中的优势函数与价值函数估计","segments":[{"id":256,"text":"Yeah, so the question is, does this happen very often in practice where your estimates are zero? So the true advantage function for this policy is not zero for other actions. It's just that we don't see those other actions in the data. And in practice, if you have variability in the actions, then you will get advantages that are very different from zero. And so, yeah, you will actually see a good amount of variability. It really depends on how broad your data set is.","start":2903.45,"end":2931.73},{"id":257,"text":"Yeah, so the question is, what would the advanced function do on actions that are not in the data set? So in this objective, we're actually only evaluating it on actions in the data set. And so you don't have any issues with kind of going outside the support. Now, if you did evaluate it on actions outside the data set for a different reason, then it would be not.","start":2932.49,"end":2956.63},{"id":258,"text":"accurate. It'll just be whatever was the result of the neural network optimization. If it's close to the data, it might be reasonable. If it's far from the data, it might be arbitrarily incorrect. So the full algorithm is we first fit a value function using Monte Carlo regression.","start":2958.46,"end":2975.6},{"id":259,"text":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be.","start":2976.41,"end":3005.35},{"id":260,"text":"One of the upsides of this is this algorithm is very, very simple. It's probably the simplest thing that you could implement that has the possibility of improving over filtered imitation learning. It also avoids querying or training on any auto-distribution actions, which makes it more stable. That said, Monte Carlo estimation can be noisy, and we're learning an advantage estimate for...","start":3006.99,"end":3032.75},{"id":261,"text":"the behavior policy, not for the policy that we're learning. And so this is going to be like we can only improve so much over the data set as a result.","start":3033.26,"end":3044.24},{"id":262,"text":"Yeah, so the question is, is this always close to zero, and why not? Because you're trying to fit your value function to the empirical sum of rewards, and then we're taking the sum of rewards and subtracting the value from it. Now, the reason why, if you have a broad data set, that it won't always be zero is that from an individual state, you will see diverse actions.","start":3045.13,"end":3070.13}],"notes":["本段讨论了在离线强化学习中，优势函数估计的准确性问题。当数据集中没有包含某些动作时，优势函数估计可能不准确，其结果取决于神经网络优化的结果。如果估计值接近数据，可能合理；如果远离数据，可能产生任意错误。因此，算法首先使用蒙特卡洛回归拟合价值函数，然后训练策略，通过指数化优势估计值来加权动作的概率。","在训练策略时，优势估计值由奖励总和减去价值函数得到，且存在一个超参数控制温度或分布的尖锐程度。该算法的优点是简单，可能比过滤模仿学习有改进，且避免了对自动分布动作的查询或训练，从而更稳定。但蒙特卡洛估计可能有噪声，且优势估计是针对行为策略而非学习策略的，因此改进有限。","当数据集较广时，优势函数估计不会总是接近零，因为从单个状态中可以看到多样化的动作。这表明，优势函数估计的准确性依赖于数据集的覆盖范围，而不仅仅是数据集中已有的动作。","在离线强化学习中，优势函数估计的准确性受到数据集覆盖范围的影响。如果数据集不够广泛，优势函数估计可能无法准确反映真实的优势，从而影响策略的优化效果。","该算法通过蒙特卡洛回归拟合价值函数，并利用优势估计值来加权策略的学习过程。这种设计使得算法在保持简单性的同时，能够对行为策略进行一定程度的改进。","优势函数估计的准确性直接影响策略的优化效果。如果估计值偏离真实值，可能导致策略性能下降。因此，确保数据集的广泛性和优势估计的准确性是离线强化学习中的关键问题。"],"formulas":[{"latex":"A(s, a) = \\text{sum of rewards} - V(s)","symbols":"优势函数估计值为奖励总和减去价值函数","explanation":"公式正确，优势函数定义为奖励总和减去价值函数，符合强化学习中优势函数的定义。","evidence":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be."},{"latex":"P(a|s) \\text{ is weighted by } \\text{exp}(A(s, a))","symbols":"策略中动作的概率由指数化的优势估计值加权","explanation":"公式正确，策略中动作的概率由指数化的优势估计值加权，符合策略梯度方法中使用优势函数进行策略优化的常见做法。","evidence":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be."}],"uncertainties":["the behavior policy, not for the policy that we're learning"],"diagram":"none","start":2903.45,"end":3070.13,"asr_flags":[],"math_clarifications":["优势函数 $ A(s, a) $ 的定义为奖励总和减去价值函数 $ V(s) $，这是强化学习中常见的定义方式。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2903.45,"text":"Yeah, so the question is, does this happen very often in practice where your estimates are zero? So the true advantage function for this policy is not zero for other actions. It's just that we don't see those other actions in the data. And in practice, if you have variability in the actions, then you will get advantages that are very different from zero. And so, yeah, you will actually see a good amount of variability. It really depends on how broad your data set is."},{"start":2932.49,"text":"Yeah, so the question is, what would the advanced function do on actions that are not in the data set? So in this objective, we're actually only evaluating it on actions in the data set. And so you don't have any issues with kind of going outside the support. Now, if you did evaluate it on actions outside the data set for a different reason, then it would be not."},{"start":2958.46,"text":"accurate. It'll just be whatever was the result of the neural network optimization. If it's close to the data, it might be reasonable. If it's far from the data, it might be arbitrarily incorrect. So the full algorithm is we first fit a value function using Monte Carlo regression."},{"start":2976.41,"text":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be."},{"start":3006.99,"text":"One of the upsides of this is this algorithm is very, very simple. It's probably the simplest thing that you could implement that has the possibility of improving over filtered imitation learning. It also avoids querying or training on any auto-distribution actions, which makes it more stable. That said, Monte Carlo estimation can be noisy, and we're learning an advantage estimate for..."},{"start":3033.26,"text":"the behavior policy, not for the policy that we're learning. And so this is going to be like we can only improve so much over the data set as a result."},{"start":3045.13,"text":"Yeah, so the question is, is this always close to zero, and why not? Because you're trying to fit your value function to the empirical sum of rewards, and then we're taking the sum of rewards and subtracting the value from it. Now, the reason why, if you have a broad data set, that it won't always be zero is that from an individual state, you will see diverse actions."}],"speech_gaps":[],"frame":"../frames/v034/018.webp","frame_time":2915.45},{"title":"离线强化学习中的优势函数与策略改进","segments":[{"id":263,"text":"And your value function is going to be, maybe say this gets like plus 10, this gets plus 1, this gets like minus 5. Your value function for this estimate is going to be the average of these numbers. So that is 3, I think. And the sum of rewards for taking this action is going to be 10. And so then the sum of rewards minus your value estimate will be 7.","start":3070.87,"end":3097.64},{"id":264,"text":"For this action, a is equal to 7. For this one, a is equal to negative 2. And for this one, a is equal to negative 8. And so when you have variability from a state or a state that's very similar to states in your data set, that's where you see kind of differences in outcomes. And that's where your advantage functions will differ. Cool.","start":3099.68,"end":3126.35},{"id":265,"text":"It'd be really nice to be able to not just use Monte Carlo and be able to use TD updates or use bootstrapped updates without having to query Q on out of distribution actions. And the issue that we saw with our previous objective right here was we were querying the actions, querying the Q function out of distribution actions right here. Now, one very simple thing that we could do is instead of...","start":3127.93,"end":3155.36},{"id":266,"text":"querying action sampled from the policy that we're learning, we could just sample A prime from our data set. And this is a very simple modification. And this will prevent, this will make sure that the A prime that we're seeing is actually always seen in the data. And we will actually have supervision targets for this S prime A prime. So this is a very,","start":3156.37,"end":3182.43},{"id":267,"text":"simple modification to this objective. And if you estimate the advantage function in this way, or estimate the Q function and then use that to estimate your advantage, you get an algorithm called advantage-weighted actor critic. Now note this is getting rid of one of the weaknesses of the original advantage-weighted regression algorithm, which is that we're able to use bootstrapping, but we're still going to be estimating the value function for pi beta.","start":3184.06,"end":3213.3},{"id":268,"text":"and not for the policy that we're learning. That's still one downside with this approach. From here, it'd be good to think about if we can estimate a Q for a policy that's better than the behavior policy. One of the ways to think about this is that when we're trying to minimize this bootstrapped objective, this target right here, this is a sample from","start":3213.84,"end":3242.11}],"notes":["本段讲解了价值函数的计算方式，通过平均奖励值来估计价值函数，并指出在不同动作下奖励值的差异。例如，一个动作的奖励值为10，而价值函数估计为3，因此奖励值与价值函数的差值为7。这说明在强化学习中，价值函数的估计是基于历史数据的平均值，而奖励值的总和则用于评估动作的总体表现。","本段讨论了在不同状态下，由于数据集中的状态相似性，可能会出现不同的结果。这种差异体现在优势函数上，即优势函数会因状态的不同而变化。这表明在离线强化学习中，优势函数的估计需要考虑状态的分布和数据集的特性。","本段提到，为了在不查询分布外动作的情况下使用TD更新或自举更新，可以考虑从数据集中采样动作。这种修改可以确保采样的动作在数据集中存在，从而避免分布外动作带来的问题。这说明在离线强化学习中，策略的改进需要依赖于数据集中的已有信息。","本段指出，虽然通过这种修改可以避免查询分布外动作，但仍然存在一个缺点，即价值函数的估计仍然是针对行为策略（behavior policy）而不是当前学习的策略。这表明在离线强化学习中，策略的改进需要进一步考虑如何估计目标策略的价值函数。","本段提到，可以考虑估计一个比行为策略更好的策略的Q函数。这表明在离线强化学习中，策略的改进不仅需要考虑当前策略的表现，还需要探索更优的策略。通过最小化自举目标，可以逐步优化策略，使其更接近最优策略。","本段最后提到，当尝试最小化自举目标时，目标值是一个样本。这说明在离线强化学习中，目标值的估计是基于数据集中的样本，而不是通过分布外动作进行预测。这种基于样本的估计方法有助于提高策略的稳定性和泛化能力。"],"formulas":[],"uncertainties":["可能听不清的公式部分，如'pi beta'的具体含义"],"diagram":"none","start":3070.87,"end":3242.11,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型不明确，未明确说明是平均值还是总和，且未明确n的定义，无法核定","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3070.87,"text":"And your value function is going to be, maybe say this gets like plus 10, this gets plus 1, this gets like minus 5. Your value function for this estimate is going to be the average of these numbers. So that is 3, I think. And the sum of rewards for taking this action is going to be 10. And so then the sum of rewards minus your value estimate will be 7."},{"start":3099.68,"text":"For this action, a is equal to 7. For this one, a is equal to negative 2. And for this one, a is equal to negative 8. And so when you have variability from a state or a state that's very similar to states in your data set, that's where you see kind of differences in outcomes. And that's where your advantage functions will differ. Cool."},{"start":3127.93,"text":"It'd be really nice to be able to not just use Monte Carlo and be able to use TD updates or use bootstrapped updates without having to query Q on out of distribution actions. And the issue that we saw with our previous objective right here was we were querying the actions, querying the Q function out of distribution actions right h ue. So the L2 loss right here is giving us that value. Now the VS for the policy, the best policy in the support of the data is going to be right here."}],"speech_gaps":[],"frame":"../frames/v034/020.webp","frame_time":3255.01},{"title":"使用非对称损失函数改进策略","segments":[{"id":275,"text":"And so maybe there's some way to try to use a different loss function other than the L2 loss to get a better policy.","start":3416.14,"end":3424.46},{"id":276,"text":"Now, an idea for how to do this.","start":3428.42,"end":3430.48},{"id":277,"text":"So when we use an L2 loss, we have some error. And so this is the error plotted on the x-axis.","start":3430.48,"end":3452.38},{"id":278,"text":"And then an L2 loss, we have something like this, right? Where maybe let's call this E.","start":3452.54,"end":3458.94},{"id":279,"text":"this is e squared. And if we instead wanted to get, if we instead wanted to try to get a value","start":3458.94,"end":3472.92},{"id":280,"text":"estimate for this, what we could do is if we instead of having this kind of symmetric loss,","start":3472.92,"end":3477.74},{"id":281,"text":"that is symmetric if you're less than 0 and greater than 0, you could instead use a loss","start":3477.74,"end":3493.24},{"id":282,"text":"function that looks like this. And you could actually show that loss functions like this","start":3493.24,"end":3499.42},{"id":283,"text":"will actually instead try... basically you'll be penalized less for making errors in a particular","start":3499.42,"end":3506.18},{"id":284,"text":"direction. And this will actually give you a value function that looks more like this.","start":3506.18,"end":3515.94},{"id":285,"text":"That's actually better than your behavior policy. Now, specifically what this looks like is if you","start":3515.98,"end":3523.82},{"id":286,"text":"think about you have some loss function, we'll call this, there'll be some, maybe let's say","start":3523.82,"end":3533.5},{"id":287,"text":"this is respect to error. This loss function is going to behave differently if the error is less","start":3533.5,"end":3540.24},{"id":288,"text":"than zero versus if the error is greater than zero. And let me just remember what the direction","start":3540.24,"end":3550.64},{"id":289,"text":"is. So if it's less than zero, so we will have...","start":3550.64,"end":3553.92},{"id":290,"text":"And the base case is just x squared or e squared. Then we'll have some hyperparameter that weights our loss by some value. And if lambda is 0.5, then this is the typical L2 objective because it'll be e squared both less than 0 and above 0. And if lambda is less than 0.5, then it will be","start":3556.33,"end":3581.68}],"notes":["本段讨论了使用非对称损失函数来改进策略的可能方法。讲者指出，传统的L2损失函数对正负误差的惩罚是对称的，而通过引入一个超参数λ，可以调整损失函数对不同方向误差的惩罚程度，从而得到更优的策略。"],"formulas":[],"uncertainties":["损失函数的具体形式和超参数β的数学表达式存在不确定性，因为讲者没有明确说明β的具体作用和损失函数的完整形式。","损失函数的对称性调整是否完全由β控制，或者是否还涉及其他因素，讲者没有明确说明。"],"diagram":"none","start":3416.14,"end":3581.68,"asr_flags":[281],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3416.14,"text":"And so maybe there's some way to try to use a different loss function other than the L2 loss to get a better policy."},{"start":3428.42,"text":"Now, an idea for how to do this."},{"start":3430.48,"text":"So when we use an L2 loss, we have some error. And so this is the error plotted on the x-axis."},{"start":3452.54,"text":"And then an L2 loss, we have something like this, right? Where maybe let's call this E."},{"start":3458.94,"text":"this is e squared. And if we instead wanted to get, if we instead wanted to try to get a value"},{"start":3472.92,"text":"estimate for this, what we could do is if we instead of having this kind of symmetric loss,"},{"start":3477.74,"text":"that is symmetric if you're less than 0 and greater than 0, you could instead use a loss"},{"start":3493.24,"text":"function that looks like this. And you could actually show that loss functions like this"},{"start":3499.42,"text":"will actually instead try... basically you'll be penalized less for making errors in a particular"},{"start":3506.18,"text":"direction. And this will actually give you a value function that looks more like this."},{"start":3515.98,"text":"That's actually better than your behavior policy. Now, specifically what this looks like is if you"},{"start":3523.82,"text":"think about you have some loss function, we'll call this, there'll be some, maybe let's say"},{"start":3533.5,"text":"this is respect to error. This loss function is going to behave differently if the error is less"},{"start":3540.24,"text":"than zero versus if the error is greater than zero. And let me just remember what the direction"},{"start":3550.64,"text":"is. So if it's less than zero, so we will have..."},{"start":3556.33,"text":"And the base case is just x squared or e squared. Then we'll have some hyperparameter that weights our loss by some value. And if lambda is 0.5, then this is the typical L2 objective because it'll be e squared both less than 0 and above 0. And if lambda is less than 0.5, then it will be"}],"speech_gaps":[],"frame":"../frames/v034/021.webp","frame_time":3428.14},{"title":"期望分位数回归与离线强化学习中的损失函数设计","segments":[{"id":291,"text":"kind of down-weighting the loss when it's greater than 0 and up-weighting it when it's above 0 and up-weighting it when it's less than 0. And the reverse will be true when lambda is greater than 0.5.","start":3583.45,"end":3601.15},{"id":292,"text":"So what this looks like is instead of, I guess I drew it slightly wrong there, instead of using a loss function that looks like this, you can use an asymmetric loss function that is penalizing errors less in one direction. This is called the expectile regression. It's kind of a cool trick. You can think about it in terms of rather than just errors, some arbitrary random variable x.","start":3605.22,"end":3630.97},{"id":293,"text":"And if you define different values of this lambda term,","start":3631.74,"end":3636.38},{"id":294,"text":"then you get these asymmetric losses that look like this,","start":3636.56,"end":3641.04},{"id":295,"text":"where if, again, if lambda is greater than 0.5,","start":3641.22,"end":3645.16},{"id":296,"text":"then you see it as asymmetric in this direction,","start":3645.3,"end":3647.78},{"id":297,"text":"versus if it's less, you see it asymmetric","start":3647.9,"end":3649.38},{"id":298,"text":"in the other direction.","start":3649.38,"end":3650.34},{"id":299,"text":"And here's kind of another visualization","start":3653.6,"end":3655.24},{"id":300,"text":"where if you're trying to, the mean of this random variable","start":3655.24,"end":3659.66},{"id":301,"text":"is shown in the red curve, but then you can get different expectiles with different values of","start":3659.66,"end":3665.42},{"id":302,"text":"lambda. So then coming back to our algorithms, if we want to fit our value function, we can use","start":3665.42,"end":3678.12},{"id":303,"text":"this expectile loss and basically fit a value function that is trying to estimate a value","start":3678.12,"end":3686.98},{"id":304,"text":"function for a policy that's better than a behavior policy. And this will be penalizing","start":3686.98,"end":3692.68},{"id":305,"text":"you for overestimating and underestimating, but it won't be penalizing you as much if you","start":3692.68,"end":3697.4},{"id":306,"text":"overestimate a little bit, basically, or if you're off by a little bit. And this means that when you","start":3697.4,"end":3701.84},{"id":307,"text":"have these different outcomes and these different kind of outcomes right here, if you get the mean,","start":3701.84,"end":3709.48},{"id":308,"text":"you get three. Whereas if you have... I haven't written down exactly what the optimum would be,","start":3709.48,"end":3717.64},{"id":309,"text":"but for some value of lambda, it'll be optimal instead of outputting the mean, it'll be more","start":3717.68,"end":3727.46},{"id":310,"text":"optimal to output something like six, for example, where you're penalized less for...","start":3727.46,"end":3733.28},{"id":311,"text":"for kind of overestimating this value. And yeah, the outcome of the loss function when you sum things together will be something that's higher than the mean. So in particular for this algorithm, we'll use the expect how loss to fit the value function. We'll actually also fit a Q function with the typical mean squared error loss. And we'll actually use the value function as the target.","start":3734.64,"end":3761.38}],"notes":["本段讲解了期望分位数回归（expectile regression）的概念，这是一种通过调整损失函数的不对称性来估计随机变量的期望分位数的方法。讲者提到，当lambda大于0.5时，损失函数会更重视低估，而当lambda小于0.5时，则更重视高估。这种不对称性可以通过调整lambda的值来实现。"],"formulas":[],"uncertainties":["expect how loss"],"diagram":"none","start":3583.45,"end":3761.38,"asr_flags":[],"math_clarifications":["原公式中的损失函数定义存在逻辑错误。当y > ̂y时，损失函数应为λ(y - ̂y)^2；当y \u003c ̂y时，损失函数应为(1 - λ)(̂y - y)^2。原公式中当y = ̂y时损失函数为0，这与期望分位数损失函数的定义不符。因此，该公式需要修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3583.45,"text":"kind of down-weighting the loss when it's greater than 0 and up-weighting it when it's above 0 and up-weighting it when it's less than 0. And the reverse will be true when lambda is greater than 0.5."},{"start":3605.22,"text":"So what this looks like is instead of, I guess I drew it slightly wrong there, instead of using a loss function that looks like this, you can use an asymmetric loss function that is penalizing errors less in one direction. This is called the expectile regression. It's kind of a cool trick. You can think about it in terms of rather than just errors, some arbitrary random variable x."},{"start":3631.74,"text":"And if you define different values of this lambda term,"},{"start":3636.56,"text":"then you get these asymmetric losses that look like this,"},{"start":3641.22,"text":"where if, again, if lambda is greater than 0.5,"},{"start":3645.3,"text":"then you see it as asymmetric in this direction,"},{"start":3647.9,"text":"versus if it's less, you see it asymmetric"},{"start":3649.38,"text":"in the other direction."},{"start":3653.6,"text":"And here's kind of another visualization"},{"start":3655.24,"text":"where if you're trying to, the mean of this random variable"},{"start":3659.66,"text":"is shown in the red curve, but then you can get different expectiles with different values of"},{"start":3665.42,"text":"lambda. So then coming back to our algorithms, if we want to fit our value function, we can use"},{"start":3678.12,"text":"this expectile loss and basically fit a value function that is trying to estimate a value"},{"start":3686.98,"text":"function for a policy that's better than a behavior policy. And this will be penalizing"},{"start":3692.68,"text":"you for overestimating and underestimating, but it won't be penalizing you as much if you"},{"start":3697.4,"text":"overestimate a little bit, basically, or if you're off by a little bit. And this means that when you"},{"start":3701.84,"text":"have these different outcomes and these different kind of outcomes right here, if you get the mean,"},{"start":3709.48,"text":"you get three. Whereas if you have... I haven't written down exactly what the optimum would be,"},{"start":3717.68,"text":"but for some value of lambda, it'll be optimal instead of outputting the mean, it'll be more"},{"start":3727.46,"text":"optimal to output something like six, for example, where you're penalized less for..."},{"start":3734.64,"text":"for kind of overestimating this value. And yeah, the outcome of the loss function when you sum things together will be something that's higher than the mean. So in particular for this algorithm, we'll use the expect how loss to fit the value function. We'll actually also fit a Q function with the typical mean squared error loss. And we'll actually use the value function as the target."}],"speech_gaps":[],"frame":"../frames/v034/022.webp","frame_time":3595.45},{"title":"离线强化学习中的价值函数与策略优化","segments":[{"id":312,"text":"So we'll be fitting both a value function and a Q function, and we'll just be using this expectile loss for fitting the value function. And then once we have our Q function and value function, then we could estimate the advantage as Q minus V and use the same kind of AWR method to get a policy where we're weighting the likelihoods by the expeditiated Q minus V.","start":3762.38,"end":3789.15},{"id":313,"text":"Yeah, so the question is, will we be overestimating the value in this case? So one thing to note about this algorithm is we're never going to be passing as input actions that are not in the data. And that was one of the major sources of overestimation before.","start":3790.54,"end":3805.32},{"id":314,"text":"Now, depending on how you set lambda, if you set lambda to be like zero, then you will overestimate probably. And there is a, typically you'll choose some value that's kind of maybe 0.2 or 0.3, something like that's more in the middle that's not so aggressive. And you will be getting an overestimate of the pi beta. And the reason for that is you're actually trying to estimate the value of a policy that's better than pi beta.","start":3806.36,"end":3834.36},{"id":315,"text":"So you're trying to estimate v pi for a policy pi that's better than pi beta. So you're kind of purposefully overestimating v pi beta. The question is, because we're going to be gradually improving our policy, would it make sense to gradually decrease lambda?","start":3834.85,"end":3859.34},{"id":316,"text":"So we're not actually collecting data from our policy. And so all the data is coming from our offline data set. And in that case, it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy. Now, if you did in principle actually do...","start":3860.28,"end":3877.06},{"id":317,"text":"start collecting some online data, then things will change a little bit because then you'll actually be skewing your data set to a better policy. And in that case, it actually might make sense potentially to bring Lambda closer to 0, or sorry, closer to 0.5, because you'll then have data from a better policy, a policy better than your behavior policy.","start":3877.64,"end":3898.74},{"id":318,"text":"So pros of this algorithm, we don't need to query out of distribution actions. The policy is still only trained on actions in the data. And we're decoupling actor and critic training. So we just do this, this critic training. We're fitting a value function and a Q function on our data. And then once we're done with that, and that's kind of converged or we've done enough training, then we train our policy. Cool. This is an algorithm called the implicit Q learning.","start":3900.53,"end":3927.5}],"notes":["本段讨论了离线强化学习中价值函数和Q函数的拟合方法，使用了期望损失（expectile loss）来拟合价值函数。接着，通过Q函数和价值函数的差值估计优势函数，并使用AWR方法生成策略，其中权重由Q减去V的指数形式决定。","讲者指出，该算法不会输入不在数据集中的动作，这是之前过估计的一个主要来源。因此，该算法在离线设置中避免了过估计的问题。","讲者提到，lambda的设置会影响过估计的程度。如果lambda设为0，可能会导致过估计。通常选择0.2或0.3这样的中间值，以避免过度估计。这是因为算法试图估计比行为策略更好的策略的价值函数。","讲者进一步说明，由于策略会逐步改进，是否应该逐步减小lambda值得探讨。如果使用在线数据，可能会改变数据集的分布，此时lambda可能需要调整到0.5附近。","讲者总结了该算法的优点，包括不需要查询分布外的动作，策略仅基于数据集中的动作进行训练，并且将演员（actor）和评论家（critic）的训练过程解耦。","最后，讲者提到该算法被称为隐式Q学习（implicit Q learning），强调了其在离线强化学习中的应用价值。"],"formulas":[],"uncertainties":["expeditiated Q minus V（可能为'expected Q minus V'的误听）","lambda的设置（可能为'lambda'的误听）"],"diagram":"none","start":3762.38,"end":3927.5,"asr_flags":[],"math_clarifications":["优势函数A通常定义为Q(s, a) - V(s)，其中Q(s, a)是状态-动作对(s, a)的预期回报，V(s)是状态s的价值。但此处未明确说明A是针对特定动作a的，且未提及期望或条件，因此公式不完整。","价值函数v_π通常定义为从状态s开始，遵循策略π的累积折扣奖励的期望值，即v_π(s) = \\mathbb{E}_{\\pi} [\\sum_{t=0}^{\\infty} \\gamma^t r_t | s_0 = s]。但此处未明确说明是累积奖励还是单步奖励，且未提及折扣因子γ，因此公式不完整。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3762.38,"text":"So we'll be fitting both a value function and a Q function, and we'll just be using this expectile loss for fitting the value function. And then once we have our Q function and value function, then we could estimate the advantage as Q minus V and use the same kind of AWR method to get a policy where we're weighting the likelihoods by the expeditiated Q minus V."},{"start":3790.54,"text":"Yeah, so the question is, will we be overestimating the value in this case? So one thing to note about this algorithm is we're never going to be passing as input actions that are not in the data. And that was one of the major sources of overestimation before."},{"start":3806.36,"text":"Now, depending on how you set lambda, if you set lambda to be like zero, then you will overestimate probably. And there is a, typically you'll choose some value that's kind of maybe 0.2 or 0.3, something like that's more in the middle that's not so aggressive. And you will be getting an overestimate of the pi beta. And the reason for that is you're actually trying to estimate the value of a policy that's better than pi beta."},{"start":3834.85,"text":"So you're trying to estimate v pi for a policy pi that's better than pi beta. So you're kind of purposefully overestimating v pi beta. The question is, because we're going to be gradually improving our policy, would it make sense to gradually decrease lambda?"},{"start":3860.28,"text":"So we're not actually collecting data from our policy. And so all the data is coming from our offline data set. And in that case, it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy. Now, if you did in principle actually do..."},{"start":3877.64,"text":"start collecting some online data, then things will change a little bit because then you'll actually be skewing your data set to a better policy. And in that case, it actually might make sense potentially to bring Lambda closer to 0, or sorry, closer to 0.5, because you'll then have data from a better policy, a policy better than your behavior policy."},{"start":3900.53,"text":"So pros of this algorithm, we don't need to query out of distribution actions. The policy is still only trained on actions in the data. And we're decoupling actor and critic training. So we just do this, this critic training. We're fitting a value function and a Q function on our data. And then once we're done with that, and that's kind of converged or we've done enough training, then we train our policy. Cool. This is an algorithm called the implicit Q learning."}],"speech_gaps":[],"frame":"../frames/v034/023.webp","frame_time":3774.38},{"title":"离线强化学习（Offline RL）","segments":[{"id":319,"text":"Yeah, so the question is, where are we fitting Q? So we could also use Monte Carlo returns with this and use the expectile objective with this term. It's nice to use Q because Q is lower variance than this sum of rewards right here. And we can fit a Q function using the bootstrapped backups.","start":3928.14,"end":3952.38},{"id":320,"text":"So all these ideas are applicable to Monte Carlo as well. But using Q functions, like when you can use this sort of bootstrapped objective, which you could only do with Q functions, then you'll get a lower variance target. And then I guess to summarize kind of the point of offline URL. So online data is really expensive because we have to recollect it every time we run our algorithm. And it's really, really useful to reuse offline data.","start":3953.03,"end":3976.46},{"id":321,"text":"One of the big challenges with offline URL is this shift between your behavior policy and your learn policy. And we talked about a filtered or weighted imitation learning method as a baseline. And we talked about how we can actually explicitly constrain the policy to the behavior policy by only supervising the policy on actions in your data. And so that allowed us to kind of get rid of or move away from this distribution shift problem.","start":3978.13,"end":4003.19},{"id":322,"text":"And then this sort of trajectory stitching idea that we talked about before allows us to improve over vanilla imitation learning. This example application is for the algorithm we didn't cover. If you want to train offline, filter behavior cloning and implicit Q-learning are both good approaches. But implicit Q-learning is going to probably work better, especially if you have a broader data set.","start":4005.16,"end":4029.49},{"id":323,"text":"And if you want to do offline pre-training and online fine-tuning, IQL is actually a very good algorithm for doing that. It can also be used with online data collection quite effectively, and it works quite well there. There's also a variant of IQL called IDQL that uses diffusion policies for your policy class right here.","start":4030.19,"end":4050.27},{"id":324,"text":"And it also works quite well. And so if you're interested in diving more into IQL-like algorithms, I would encourage you to check out IDQL. It is actually, beyond using diffusion, it also is a bit different in terms of how this update is done.","start":4051.01,"end":4064.03}],"notes":["本段讨论了在离线强化学习中使用Q函数的优势，特别是通过使用bootstrapped backups来降低方差。Q函数相较于直接使用奖励总和具有更低的方差，这使得Q函数成为一种更稳定的估计方法。","离线强化学习的一个主要挑战是行为策略与学习策略之间的分布偏移问题。通过仅在数据中存在的动作上监督策略，可以显式地约束策略到行为策略，从而缓解分布偏移问题。","轨迹拼接（trajectory stitching）是一种改进普通模仿学习的方法，它允许在离线数据上进行更有效的策略学习。对于未覆盖的算法，过滤行为克隆和隐式Q学习都是可行的方法，而隐式Q学习在数据集更广泛时表现更好。","IQL（Implicit Q-Learning）是一种适用于离线预训练和在线微调的算法，它在在线数据收集上也表现良好。IDQL是IQL的一个变体，它使用扩散策略作为策略类，这使得其在某些情况下可能表现更优。","IDQL不仅使用了扩散策略，还在更新方式上与IQL有所不同，这使得它在某些应用场景下可能具有更好的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3928.14,"end":4064.03,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3928.14,"text":"Yeah, so the question is, where are we fitting Q? So we could also use Monte Carlo returns with this and use the expectile objective with this term. It's nice to use Q because Q is lower variance than this sum of rewards right here. And we can fit a Q function using the bootstrapped backups."},{"start":3953.03,"text":"So all these ideas are applicable to Monte Carlo as well. But using Q functions, like when you can use this sort of bootstrapped objective, which you could only do with Q functions, then you'll get a lower variance target. And then I guess to summarize kind of the point of offline URL. So online data is really expensive because we have to recollect it every time we run our algorithm. And it's really, really useful to reuse offline data."},{"start":3978.13,"text":"One of the big challenges with offline URL is this shift between your behavior policy and your learn policy. And we talked about a filtered or weighted imitation learning method as a baseline. And we talked about how we can actually explicitly constrain the policy to the behavior policy by only supervising the policy on actions in your data. And so that allowed us to kind of get rid of or move away from this distribution shift problem."},{"start":4005.16,"text":"And then this sort of trajectory stitching idea that we talked about before allows us to improve over vanilla imitation learning. This example application is for the algorithm we didn't cover. If you want to train offline, filter behavior cloning and implicit Q-learning are both good approaches. But implicit Q-learning is going to probably work better, especially if you have a broader data set."},{"start":4030.19,"text":"And if you want to do offline pre-training and online fine-tuning, IQL is actually a very good algorithm for doing that. It can also be used with online data collection quite effectively, and it works quite well there. There's also a variant of IQL called IDQL that uses diffusion policies for your policy class right here."},{"start":4051.01,"text":"And it also works quite well. And so if you're interested in diving more into IQL-like algorithms, I would encourage you to check out IDQL. It is actually, beyond using diffusion, it also is a bit different in terms of how this update is done."}],"speech_gaps":[],"frame":"../frames/v034/024.webp","frame_time":3940.14}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
