 reward of that trajectory being greater than some threshold. And that threshold could be some percentile of the rewards in your data set, like the 70th percentile, for example, like only taking the top 30% of trajectories. And then from there, you could learn a policy that maximizes the..."},{"start":1880.25,"text":"likelihood of the actions in this modified data set. So that would look like taking the states and actions in this modified data set and maximizing the log probability of the actions given the state. So this is the typical imitation learning objective. Cool. So this is perhaps our first offline or all method, I guess. Very, very basic."}],"speech_gaps":[],"frame":"../frames/v034/011.webp","frame_time":1760.76},{"title":"离线强化学习中的模仿学习与奖励加权","segments":[{"id":166,"text":"filter the dataset to do the top k% of data, and then imitate the filtered dataset. This is a very primitive approach for using reward information, and it's worth noting that it's not able to do this kind of stitching behavior, because what it will do is if this is a bad trajectory, it might just filter out that trajectory entirely, and it won't actually learn how to take this good behavior and this good behavior and figure out how to get from here to here.","zh":"过滤数据集，只保留前k%的数据，然后模仿过滤后的数据集。这是一种利用奖励信息的非常原始的方法，值得注意的是，它无法实现这种拼接行为，因为它所做的可能是，如果这条轨迹是坏的，它可能会直接过滤掉这条轨迹，而不会真正学习如何从好的行为中推导出如何从这里到那里。","start":1910.43,"end":1934.73},{"id":167,"text":"That said, it's a good baseline, so if you're going to be trying out any offline URL method, it's good to try this first and see how well it does and use that as a benchmark and ideally try to make sure that your offline URL method is doing better than this.","zh":"尽管如此，它仍然是一个不错的基线方法，因此如果你打算尝试任何离线强化学习方法，最好先尝试这个方法，看看它表现如何，并将其作为基准，理想情况下要确保你的离线强化学习方法表现得比它更好。","start":1936.81,"end":1952.89},{"id":168,"text":"Okay. Now, one of the reasons why I introduced this is that arguably some of the best offline","zh":"好的，我之所以介绍这个方法，是因为可以说，一些最好的离线强化学习方法实际上所做的与这个方法并没有太大的不同，","start":1954.05,"end":1959.87},{"id":169,"text":"URL methods are actually doing something that's not all that different from this in that they","zh":"它们在某种程度上也包含了一个模仿学习的组件。","start":1959.87,"end":1965.09},{"id":170,"text":"do have an imitation learning component to them. And the idea here is that instead of just taking","zh":"这个想法是，我们不仅仅只是选取好的轨迹，而是可以模仿数据，但根据该状态转移中动作的好坏来加权我们的模仿学习目标。","start":1965.09,"end":1974.77},{"id":171,"text":"the good trajectories, we could imitate the data but weight our imitation learning objective based","zh":"现在，如果你还记得我们之前讨论的价值函数和优势函数的相关内容，","start":1974.77,"end":1981.61},{"id":172,"text":"based on how good the action was in that transition.","zh":"那么这里的思路是，根据该状态转移中动作的好坏来加权我们的模仿学习目标。","start":1981.61,"end":1986.73},{"id":173,"text":"Now, if you remember what we talked about with regard to value functions and advantage","zh":"现在，如果你还记得我们之前讨论的价值函数和优势函数的相关内容，","start":1990.23,"end":1995.65},{"id":174,"text":"functions where the advantage function is how much better is AT compared to what your","zh":"函数中，优势函数表示AT比你的策略做得更好多少","start":1995.65,"end":2001.55},{"id":175,"text":"policy does, this advantage function suggests that if we weighted our imitation learning","zh":"这个优势函数表明，如果我们用优势函数对任何目标进行加权，那么我们可以得到一个衡量该动作好坏的指标","start":2002.43,"end":2008.55},{"id":176,"text":"any objective by the advantage function, then we could get some measure of how good that action is","zh":"并得到一个能够有效学习的策略。这将大致形成我们第一个离线强化学习方法的目标","start":2008.55,"end":2013.41},{"id":177,"text":"and get a policy that is able to learn effectively. And this will kind of form the objective of our","zh":"并且，我们将具体做的是最大化一个目标，该目标针对一个策略，该策略将采用标准的模仿学习目标，但只是用指数形式进行加权","start":2013.41,"end":2021.87},{"id":178,"text":"first offline RL method. And in particular, what we'll do is we will maximize an objective for a","zh":"并且，这将是对我们数据集中每个状态和动作的求和。关于选择对它们进行指数化的做法，实际上有一种方法可以推导出这个特定的目标。我会在幻灯片中提到这一点。我们不会进行推导，但如果你感兴趣，我们可以在课后看看是否可以将推导过程发布出来。","start":2021.87,"end":2033.39},{"id":179,"text":"a policy that will be taking the standard imitation learning objective, but just weighting","zh":"并且，这将是对我们数据集中每个状态和动作的求和。关于选择对它们进行指数化的做法，实际上有一种方法可以推导出这个特定的目标。我会在幻灯片中提到这一点。我们不会进行推导，但如果你感兴趣，我们可以在课后看看是否可以将推导过程发布出来。","start":2033.39,"end":2040.49},{"id":180,"text":"it by the exponentiated...","zh":"并且，这将是对我们数据集中每个状态和动作的求和。关于选择对它们进行指数化的做法，实际上有一种方法可以推导出这个特定的目标。我会在幻灯片中提到这一点。我们不会进行推导，但如果你感兴趣，我们可以在课后看看是否可以将推导过程发布出来。","start":2040.49,"end":2045.77},{"id":181,"text":"And this will be a sum over states and actions in our data set. In terms of the choice to exponentiate them, there's actually a way to derive this particular objective. And I'll mention that on the slides. We won't go through the derivation, but if you're interested, we can see if we can post it after lecture.","zh":"并且，这将是对我们数据集中每个状态和动作的求和。关于选择对它们进行指数化的做法，实际上有一种方法可以推导出这个特定的目标。我会在幻灯片中提到这一点。我们不会进行推导，但如果你感兴趣，我们可以在课后看看是否可以将推导过程发布出来。","start":2050.22,"end":2073.25}],"notes":["本段介绍了离线强化学习中一种基础的模仿学习方法，即通过筛选数据集中前k%的轨迹来训练策略。这种方法虽然简单，但无法处理轨迹之间的衔接问题，因为它会直接过滤掉不好的轨迹，而不会学习如何从好的行为中推导出有效的策略。","讲者指出，尽管这种方法较为原始，但它可以作为离线强化学习方法的基线，用于比较其他方法的性能。如果尝试任何离线强化学习方法，建议首先尝试这种方法，并以此作为基准。","讲者进一步说明，一些当前最好的离线强化学习方法实际上包含模仿学习的组件，它们与上述方法有相似之处，但会根据动作的质量对模仿学习目标进行加权。","讲者提到，这种加权方法可以借鉴优势函数的概念，即通过优势函数衡量动作相对于当前策略的优劣，从而对模仿学习目标进行加权，以获得更有效的策略。","讲者指出，这种加权方法将形成离线强化学习方法的第一个目标，即最大化一个基于标准模仿学习目标但根据优势函数加权的目标函数。","最后，讲者提到，这种目标函数可以通过数学推导得到，并在幻灯片中提及，但推导过程不会在课堂上详细讲解，有兴趣的学生可以在课后查看相关材料。"],"formulas":[],"uncertainties":["exponentiated"],"diagram":"none","start":1910.43,"end":2073.25,"asr_flags":[],"math_clarifications":["原始片段中提到使用优势函数来加权模仿学习目标，但未提供具体的数学表达式。公式中的目标函数形式与上下文不符，因此无法确认其正确性，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":1910.43,"text":"filter the dataset to do the top k% of data, and then imitate the filtered dataset. This is a very primitive approach for using reward information, and it's worth noting that it's not able to do this kind of stitching behavior, because what it will do is if this is a bad trajectory, it might just filter out that trajectory entirely, and it won't actually learn how to take this good behavior and this good behavior and figure out how to get from here to here."},{"start":1936.81,"text":"That said, it's a good baseline, so if you're going to be trying out any offline URL method, it's good to try this first and see how well it does and use that as a benchmark and ideally try to make sure that your offline URL method is doing better than this."},{"start":1954.05,"text":"Okay. Now, one of the reasons why I introduced this is that arguably some of the best offline"},{"start":1959.87,"text":"URL methods are actually doing something that's not all that different from this in that they"},{"start":1965.09,"text":"do have an imitation learning component to them. And the idea here is that instead of just taking"},{"start":1974.77,"text":"the good trajectories, we could imitate the data but weight our imitation learning objective based"},{"start":1981.61,"text":"based on how good the action was in that transition."},{"start":1990.23,"text":"Now, if you remember what we talked about with regard to value functions and advantage"},{"start":1995.65,"text":"functions where the advantage function is how much better is AT compared to what your"},{"start":2002.43,"text":"policy does, this advantage function suggests that if we weighted our imitation learning"},{"start":2008.55,"text":"any objective by the advantage function, then we could get some measure of how good that action is"},{"start":2013.41,"text":"and get a policy that is able to learn effectively. And this will kind of form the objective of our"},{"start":2021.87,"text":"first offline RL method. And in particular, what we'll do is we will maximize an objective for a"},{"start":2033.39,"text":"a policy that will be taking the standard imitation learning objective, but just weighting"},{"start":2040.49,"text":"it by the exponentiated..."},{"start":2050.22,"text":"And this will be a sum over states and actions in our data set. In terms of the choice to exponentiate them, there's actually a way to derive this particular objective. And I'll mention that on the slides. We won't go through the derivation, but if you're interested, we can see if we can post it after lecture."}],"speech_gaps":[{"start":2046.256,"end":2047.824}],"frame":"../frames/v034/012.webp","frame_time":1922.43},{"title":"离线强化学习中的优势函数与行为策略约束","segments":[{"id":182,"text":"In terms of this objective, if we have a good advantage function and we go back to the stitching example, for this particular state right here, we know that the advantage of this action is high, right? Because the value, the Q value of this is one. The Q value for going this way, at least in the data, is zero.","zh":"就这个目标而言，如果我们有一个好的优势函数，并回到缝合的例子中，对于这个特定的状态，我们知道这个动作的优势很高，对吧？因为这个状态的值，也就是Q值是1。而通过这个方向的Q值，在数据中至少是0。","start":2076.26,"end":2105.51},{"id":183,"text":"And the value of this state will be the average of those two outcomes. And so the advantage for this one will be positive, and the advantage for going this direction will be negative. And so when we then take our imitation learning objective and weight it by the advantages, we're going to be telling our policy that in that state, it should go to the good outcome rather than going to the bad outcome.","zh":"这个状态的值将是这两个结果的平均值。因此，这个动作的优势将是正的，而通过这个方向的动作的优势将是负的。因此，当我们使用模仿学习目标并根据优势进行加权时，我们告诉策略在该状态下应该选择好的结果而不是坏的结果。","start":2106.09,"end":2130.87},{"id":184,"text":"And so this objective, if you have a good advantage estimate, is capable of kind of stitching together good behaviors in an offline data set. So in terms of the derivation, you can show that this advantage-weighted imitation learning objective is approximating","zh":"因此，如果有一个好的优势估计，这个目标能够将离线数据集中的良好行为缝合起来。就推导而言，你可以证明这个优势加权的模仿学习目标是在近似","start":2131.71,"end":2147.54},{"id":185,"text":"a KL constraint objective, where you can show that it's maximizing the future rewards as measured by your Q value,","zh":"一个KL约束目标，其中你可以证明它是在最大化由你的Q值衡量的未来奖励，","start":2149.17,"end":2159.41},{"id":186,"text":"subject to the constraint that you're staying close to your behavior policy.","zh":"在满足你保持接近行为策略的约束条件下。","start":2159.57,"end":2164.51},{"id":187,"text":"And this is a pretty reasonable objective for offline RL, because if you're too far from your behavior policy,","zh":"这对于离线强化学习来说是一个相当合理的优化目标，因为如果你离行为策略太远，","start":2164.99,"end":2171.99},{"id":188,"text":"then you won't be able to, you won't be able to actually get good information about how to","zh":"你就无法获得如何改进策略的有用信息。","start":2171.99,"end":2181.41},{"id":189,"text":"improve your policy. Okay, so before we talk about how we estimate the advantage and what","zh":"那么在我们讨论如何估计优势以及什么","start":2181.41,"end":2191.79},{"id":190,"text":"this advantage will be, any questions on what this objective looks like? Yeah, so the question is,","zh":"这种优势将会是，有关这个目标函数的任何问题吗？是的，问题是，","start":2191.79,"end":2197.57},{"id":191,"text":"for this to improve over imitation learning, do we need to assume that our trajectories have","zh":"为了在模仿学习上有所改进，我们需要假设我们的轨迹具有","start":2197.57,"end":2202.43},{"id":192,"text":"intersecting states? And the brief answer is that no, we generally don't have to assume that. And","zh":"相交的状态吗？简短的回答是，我们通常不需要做这样的假设。并且","start":2203.17,"end":2211.05},{"id":193,"text":"in this diagram, I actually tried to have S7 and S3 not be exactly the same state.","zh":"在这张图中，我实际上尝试让 S7 和 S3 不是完全相同的状态。","start":2211.05,"end":2216.17},{"id":194,"text":"And the reason why we don't need them to be exactly the same is that if we're using a neural","zh":"我们不需要它们完全相同的原因是，如果我们使用神经网络来表示策略和优势函数，那么它会自然地……状态和","start":2216.73,"end":2221.57},{"id":195,"text":"network to represent the policy and the advantage function, then it will naturally... States and","zh":"彼此非常相似的动作会自然地从该神经网络产生相似的输出。因此，如果状态彼此相似，它应该能够进行泛化，但不","start":2221.57,"end":2230.53},{"id":196,"text":"actions that are very similar to each other will naturally have similar outputs from that neural","zh":"需要它们完全相同。","start":2230.53,"end":2234.91},{"id":197,"text":"network. And so it should be able to generalize if the states are similar to each other, but not","zh":"网络。因此，如果状态彼此相似，它应该能够进行泛化，但并非","start":2234.91,"end":2242.93},{"id":198,"text":"exactly intersecting. Now, the degree to how well this works will depend on how close those states","zh":"精确相交。现在，这种效果的好坏程度将取决于这些状态有多接近","start":2242.93,"end":2250.03},{"id":199,"text":"are and how large the data set is such that it can learn a representation that is","zh":"以及数据集的大小，使得它能够学习到一个表示","start":2250.03,"end":2254.69}],"notes":["本段讲解了离线强化学习中优势函数的应用，通过优势函数对模仿学习目标进行加权，使得策略能够选择更优的动作。优势函数的估计对于将不同状态下的行为进行连接（stitching）至关重要。","在推导过程中，优势加权的模仿学习目标可以近似为一个KL约束目标，即在保持与行为策略接近的前提下最大化未来奖励。这种目标在离线强化学习中是合理的，因为远离行为策略会导致无法获取有效的策略改进信息。","关于是否需要轨迹状态相交的问题，讲者指出不需要假设状态完全相同，因为神经网络可以自然地对相似状态和动作进行泛化，从而实现策略的改进。","状态相似性与数据集的大小会影响这种方法的效果，数据集越大，越有可能学习到有效的表示。"],"formulas":[],"uncertainties":["在公式推导中，'approximating a KL constraint objective'的具体形式未明确，可能涉及更复杂的数学关系。"],"diagram":"none","start":2076.26,"end":2254.69,"asr_flags":[],"math_clarifications":["原始文本中未提及变分推断或生成模型，因此ELBO和KL散度公式与上下文无关，应被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":2076.26,"text":"In terms of this objective, if we have a good advantage function and we go back to the stitching example, for this particular state right here, we know that the advantage of this action is high, right? Because the value, the Q value of this is one. The Q value for going this way, at least in the data, is zero."},{"start":2106.09,"text":"And the value of this state will be the average of those two outcomes. And so the advantage for this one will be positive, and the advantage for going this direction will be negative. And so when we then take our imitation learning objective and weight it by the advantages, we're going to be telling our policy that in that state, it should go to the good outcome rather than going to the bad outcome."},{"start":2131.71,"text":"And so this objective, if you have a good advantage estimate, is capable of kind of stitching together good behaviors in an offline data set. So in terms of the derivation, you can show that this advantage-weighted imitation learning objective is approximating"},{"start":2149.17,"text":"a KL constraint objective, where you can show that it's maximizing the future rewards as measured by your Q value,"},{"start":2159.57,"text":"subject to the constraint that you're staying close to your behavior policy."},{"start":2164.99,"text":"And this is a pretty reasonable objective for offline RL, because if you're too far from your behavior policy,"},{"start":2171.99,"text":"then you won't be able to, you won't be able to actually get good information about how to"},{"start":2181.41,"text":"improve your policy. Okay, so before we talk about how we estimate the advantage and what"},{"start":2191.79,"text":"this advantage will be, any questions on what this objective looks like? Yeah, so the question is,"},{"start":2197.57,"text":"for this to improve over imitation learning, do we need to assume that our trajectories have"},{"start":2203.17,"text":"intersecting states? And the brief answer is that no, we generally don't have to assume that. And"},{"start":2211.05,"text":"in this diagram, I actually tried to have S7 and S3 not be exactly the same state."},{"start":2216.73,"text":"And the reason why we don't need them to be exactly the same is that if we're using a neural"},{"start":2221.57,"text":"network to represent the policy and the advantage function, then it will naturally... States and"},{"start":2230.53,"text":"actions that are very similar to each other will naturally have similar outputs from that neural"},{"start":2234.91,"text":"network. And so it should be able to generalize if the states are similar to each other, but not"},{"start":2242.93,"text":"exactly intersecting. Now, the degree to how well this works will depend on how close those states"},{"start":2250.03,"text":"are and how large the data set is such that it can learn a representation that is"}],"speech_gaps":[],"frame":"../frames/v034/013.webp","frame_time":2088.26},{"title":"离线强化学习中的优势函数与策略关联","segments":[{"id":200,"text":"collapsing those representations to something that looks similar.","zh":"将这些表示压缩成看起来相似的东西。","start":2255.35,"end":2258.15},{"id":201,"text":"The question is, in practice, do we need to worry about the exponential term exploding? When we look at a practical implementation of this, we will actually add a hyperparameter that corresponds to the temperature of this. And so the practical algorithm will have","zh":"问题是，在实践中，我们是否需要担心指数项爆炸？当我们实际实现这个方法时，我们会添加一个超参数，对应于此处的温度。因此，实际的算法将具有","start":2259.16,"end":2276.34},{"id":202,"text":"like a one over alpha times the advantage, and that can help prevent this from getting","zh":"类似 1 除以 α 乘以优势，这可以帮助防止其变得","start":2277.99,"end":2286.33},{"id":203,"text":"extremely large. Yeah, and then I guess it depends a bit...","zh":"非常大。是的，然后我想这取决于一点...","start":2286.33,"end":2293.19},{"id":204,"text":"Maybe we'll talk about it also a bit more when we get into fitting advantages.","zh":"也许当我们讨论拟合优势时，我们也会更详细地谈谈这个。","start":2296.03,"end":2299.65},{"id":205,"text":"Yeah, I knew this question would come up. So when we talked about actor-critic methods,","zh":"是的，我知道这个问题会提出来。当我们讨论 actor-critic 方法时，","start":2300.53,"end":2304.93},{"id":206,"text":"we just had the advantage here. The other key difference was that here we're sampling","zh":"我们这里只有优势。另一个关键区别是，这里我们是从离线数据集中进行采样，而在 actor critic 目标中，动作，嗯，那里有","start":2304.93,"end":2309.65},{"id":207,"text":"from our offline data set and in the actor critic objectives, the action, well, there's","zh":"从我们的离线数据集中进行采样，而在 actor critic 目标中，动作，嗯，那里有","start":2309.73,"end":2313.83},{"id":208,"text":"different versions, but we're sampling from an online data set typically. And in the,","zh":"有不同版本，但我们通常是从一个在线数据集中进行采样。并且在","start":2313.83,"end":2322.27},{"id":209,"text":"in soft actor critic, this action actually comes from your policy, not from the data","zh":"在软演员评论算法中，这个动作实际上来自于你的策略，而不是来自于数据","start":2322.27,"end":2326.81},{"id":210,"text":"set. There isn't a very quick way to derive where those differences come from. I don't want to","zh":"集。没有非常快速的方法可以推导出这些差异的来源。我不想","start":2328.07,"end":2332.59},{"id":211,"text":"confuse you, but one way of thinking about this is oftentimes offline, online URL objectives will","zh":"让你感到困惑，但一种思考方式通常是，离线和在线的URL目标函数","start":2332.59,"end":2347.11},{"id":212,"text":"be optimizing a reverse KL objective and offline are looking more at a forward KL objective. But","zh":"会优化一个反向KL目标函数，而离线则更多地关注正向KL目标函数。但","start":2347.11,"end":2356.05},{"id":213,"text":"be optimizing a reverse KL objective and offline are looking more at a forward KL objective. But","zh":"会优化一个反向KL目标函数，而离线则更多地关注正向KL目标函数。但","start":2356.05,"end":2361.21},{"id":214,"text":"But it's a longer explanation.","zh":"但这是一个更长的解释。","start":2361.21,"end":2364.53},{"id":215,"text":"Yeah.","zh":"是的。","start":2364.87,"end":2365.09},{"id":216,"text":"Okay.","zh":"好的。","start":2365.87,"end":2366.51},{"id":217,"text":"And there's also some references here as well.","zh":"这里也有一些参考文献。","start":2367.61,"end":2370.35},{"id":218,"text":"Okay.","zh":"好的。","start":2371.89,"end":2372.53},{"id":219,"text":"So we've talked about this advantage.","zh":"我们已经讨论了这个优势。","start":2372.57,"end":2374.09},{"id":220,"text":"Now, advantages actually have some policy associated with them.","zh":"实际上，优势函数与某个策略相关联。","start":2374.47,"end":2380.15},{"id":221,"text":"It's not...","zh":"它不是……","start":2380.23,"end":2381.13},{"id":222,"text":"It's the advantage of taking action A in state S and then following some policy. And so the first question is, which policy are we trying to estimate the advantage for? For now, we can try to estimate the advantage of the behavior policy. And then a key question comes up is, how do we want to estimate this advantage function? And ideally, in a way that prevents the overestimation that we saw before.","zh":"它是采取动作 A 在状态 S 后，遵循某个策略的优势。因此，第一个问题是，我们试图估计的是哪个策略的优势？目前，我们可以尝试估计行为策略的优势。随之而来的一个关键问题是，我们如何想要估计这个优势函数？理想情况下，我们要以一种防止之前看到的高估现象的方式进行估计。","start":2381.75,"end":2410.89}],"notes":["本段讨论了在离线强化学习中，优势函数的估计与策略之间的关系。讲者提到，优势函数与特定策略相关联，例如行为策略。在估计优势函数时，需要考虑如何避免之前提到的过估计问题。此外，讲者还提到，离线和在线目标函数在优化目标上存在差异，离线目标通常更关注前向KL散度，而在线目标则可能涉及反向KL散度。","讲者指出，在离线强化学习中，优势函数的估计需要考虑策略的选择，例如行为策略。同时，讲者提到，优势函数的估计方法需要避免过估计问题，这与之前讨论的策略梯度方法中的问题类似。","讲者还提到，离线和在线目标函数在实现上存在差异，例如在线目标通常从在线数据集中采样，而离线目标则从离线数据集中采样。此外，在软演员-评论家方法中，动作来自策略而非数据集。","讲者提到，离线目标函数通常优化前向KL散度，而在线目标函数可能涉及反向KL散度。这种差异反映了两种方法在优化目标上的不同，但讲者也指出，这种解释较为复杂，需要更深入的讨论。","讲者强调，优势函数的估计需要考虑策略的选择，并且需要避免过估计问题。这与之前讨论的策略梯度方法中的问题类似，但离线强化学习中的优势函数估计更加复杂。","讲者提到，优势函数与策略相关联，因此在估计优势函数时，需要明确所使用的策略。例如，行为策略的估计可能需要不同的方法，以避免过估计问题。"],"formulas":[{"latex":"KL(q \\| p)","symbols":"KL散度","explanation":"KL散度的符号正确，表示从分布q到分布p的Kullback-Leibler散度，适用于概率分布之间的差异度量。","evidence":"confuse you, but one way of thinking about this is oftentimes offline, online URL objectives will"}],"uncertainties":["URL可能为误识别，实际应为'objective'或'objectives'。","在讲者提到'offline, online URL objectives'时，'URL'可能是误识别，实际应为'objectives'。","在讲者提到'forward KL objective'和'reverse KL objective'时，'forward'和'reverse'是否准确对应前向和反向KL散度需要进一步确认。"],"diagram":"none","start":2255.35,"end":2410.89,"asr_flags":[],"math_clarifications":["原始文本中未出现数学公式，因此无需进行数学修复。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":2255.35,"text":"collapsing those representations to something that looks similar."},{"start":2259.16,"text":"The question is, in practice, do we need to worry about the exponential term exploding? When we look at a practical implementation of this, we will actually add a hyperparameter that corresponds to the temperature of this. And so the practical algorithm will have"},{"start":2277.99,"text":"like a one over alpha times the advantage, and that can help prevent this from getting"},{"start":2286.33,"text":"extremely large. Yeah, and then I guess it depends a bit..."},{"start":2296.03,"text":"Maybe we'll talk about it also a bit more when we get into fitting advantages."},{"start":2300.53,"text":"Yeah, I knew this question would come up. So when we talked about actor-critic methods,"},{"start":2304.93,"text":"methods, the objective looked like kind of similar to this, except instead of exponentiating,"},{"start":2309.73,"text":"we just had the advantage here. The other key difference was that here we're sampling"},{"start":2313.83,"text":"from our offline data set and in the actor critic objectives, the action, well, there's"},{"start":2322.27,"text":"different versions, but we're sampling from an online data set typically. And in the,"},{"start":2328.07,"text":"in soft actor critic, this action actually comes from your policy, not from the data"},{"start":2332.59,"text":"set. There isn't a very quick way to derive where those differences come from. I don't want to"},{"start":2347.11,"text":"confuse you, but one way of thinking about this is oftentimes offline, online URL objectives will"},{"start":2356.05,"text":"be optimizing a reverse KL objective and offline are looking more at a forward KL objective. But"},{"start":2361.21,"text":"But it's a longer explanation."},{"start":2364.87,"text":"Yeah."},{"start":2365.87,"text":"Okay."},{"start":2367.61,"text":"And there's also some references here as well."},{"start":2371.89,"text":"Okay."},{"start":2372.57,"text":"So we've talked about this advantage."},{"start":2374.47,"text":"Now, advantages actually have some policy associated with them."},{"start":2380.23,"text":"It's not..."},{"start":2381.75,"text":"It's the advantage of taking action A in state S and then following some policy. And so the first question is, which policy are we trying to estimate the advantage for? For now, we can try to estimate the advantage of the behavior policy. And then a key question comes up is, how do we want to estimate this advantage function? And ideally, in a way that prevents the overestimation that we saw before."}],"speech_gaps":[],"frame":"../frames/v034/014.webp","frame_time":2267.35},{"title":"离线强化学习中的优势函数估计","segments":[{"id":223,"text":"So the first way that we can estimate the advantage function, I mean, generally it will look very similar to what we saw before. We'd estimate the advantage function, but there's a couple other considerations. So let's say version, maybe I'll do this in a new color. So let's say version one, oh, it's v1. Version one, we're going to,","zh":"所以，我们估计优势函数的第一种方法，我的意思是，一般来说，它看起来会和我们之前看到的非常相似。我们会估计优势函数，但还有一些其他需要考虑的因素。比如说版本，也许我会用一种新的颜色来表示。比如说版本一，哦，是v1。版本一，我们将要","start":2415.42,"end":2445.58},{"id":224,"text":"Use the simplest thing that we had before, which is to use Monte Carlo returns. So we can first fit a value function. And because we're fitting the value function for the behavior policy, we don't need to... The data is coming from the policy that we're trying to evaluate a value function for. So if we want to fit a value function with Monte Carlo returns, then our objective...","zh":"使用我们之前拥有的最简单的方法，也就是使用蒙特卡洛回报。因此，我们首先可以拟合一个价值函数。由于我们是在行为策略上拟合价值函数，因此我们不需要……数据来自于我们试图评估价值函数的策略。因此，如果我们想要使用蒙特卡洛回报来拟合一个价值函数，那么我们的目标……","start":2446.43,"end":2475.82},{"id":225,"text":"looks... we're trying to regress to the sum of future rewards. So our objective looks something like this. This is something that can basically supervise learning to the future rewards. And then once we do this, which is fairly straightforward, then the question is how do we get the advantage out of this?","zh":"看起来……我们试图回归到未来奖励的总和。因此，我们的目标看起来大致是这样的。这基本上可以监督学习未来奖励的过程。一旦我们完成了这个相对直接的步骤，那么问题就变成：我们如何从这个过程中得到优势函数呢？","start":2477.68,"end":2505.64},{"id":226,"text":"There's a couple ways you could do this. In the first time that we saw this, the way that we got the advantage function for a given state in action was to use the reward plus the value function at the next time step minus the value function at the current time step. And these are all the value function.","zh":"有几种方法可以做到这一点。在我们第一次看到这种方法时，我们通过使用奖励加上下一时间步的价值函数减去当前时间步的价值函数来得到给定状态和动作的优势函数。这些都是我们刚刚估计的价值函数。因此，你可以使用这种方法。另一种选择是，你也可以使用这种方法。这将依赖于拥有一个相当准确的价值函数，因为你是在进行这种一步的时间差分计算，即奖励加上此处的价值减去当前状态的价值。因此，另一种可以做的事情是，而不是使用","start":2506.65,"end":2537.12},{"id":227,"text":"that we just estimated. So you could use this. The one alternative, well, so you could use this. This is going to rely on having a value function that is fairly accurate because you're doing this kind of one step kind of temporal difference between the reward plus the value here minus the value at the current state. And so one alternative thing that you could do is instead of using","zh":"我们刚刚估计的那个。因此你可以使用这个。另一种选择是，你也可以使用这个。这将依赖于有一个相当准确的价值函数，因为你在这里进行的是这种一步的时间差分，即奖励加上这里的价值减去当前状态的价值。因此，另一种可以选择的做法是，而不是使用","start":2538.38,"end":2566.39}],"notes":["本段讨论了在离线强化学习中如何估计优势函数。讲者提到，优势函数的估计方法与之前类似，但需要考虑一些额外因素。讲者首先提到使用蒙特卡洛回报来拟合价值函数，因为数据来自行为策略，因此不需要额外的调整。接着讲者指出，优势函数可以通过奖励加上下一时刻的价值函数减去当前时刻的价值函数来计算，这需要价值函数的估计足够准确。","讲者进一步说明，这种方法依赖于价值函数的准确性，因为这是基于一步的时间差分方法。讲者还提到，另一种方法是不使用价值函数，而是直接估计优势函数，但具体方法未明确说明。讲者强调，优势函数的估计需要考虑价值函数的准确性，以及如何从价值函数中推导出优势函数。"],"formulas":[{"latex":"A(s, a) = r + V(s') - V(s)","symbols":"优势函数等于奖励加上下一状态的价值函数减去当前状态的价值函数","explanation":"公式正确表达了优势函数的定义，其中r表示即时奖励，V(s')和V(s)分别表示下一状态和当前状态的价值函数。该公式适用于基于价值函数的策略评估方法，如TD学习。","evidence":"There's a couple ways you could do this. In the first time that we saw this, the way that we got the advantage function for a given state in action was to use the reward plus the value function at the next time step minus the value function at the current time step. And these are all the value function."}],"uncertainties":["可能听不清的公式细节，如是否包含折扣因子或是否为期望值"],"diagram":"none","start":2415.42,"end":2566.39,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型正确，没有发现明显的转写或整理错误。优势函数的定义符合强化学习中的标准定义，即A(s, a) = r + γV(s') - V(s)，其中γ是折扣因子。此处未包含γ，可能需要根据上下文确认是否需要添加。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2415.42,"text":"So the first way that we can estimate the advantage function, I mean, generally it will look very similar to what we saw before. We'd estimate the advantage function, but there's a couple other considerations. So let's say version, maybe I'll do this in a new color. So let's say version one, oh, it's v1. Version one, we're going to,"},{"start":2446.43,"text":"Use the simplest thing that we had before, which is to use Monte Carlo returns. So we can first fit a value function. And because we're fitting the value function for the behavior policy, we don't need to... The data is coming from the policy that we're trying to evaluate a value function for. So if we want to fit a value function with Monte Carlo returns, then our objective..."},{"start":2477.68,"text":"looks... we're trying to regress to the sum of future rewards. So our objective looks something like this. This is something that can basically supervise learning to the future rewards. And then once we do this, which is fairly straightforward, then the question is how do we get the advantage out of this?"},{"start":2506.65,"text":"There's a couple ways you could do this. In the first time that we saw this, the way that we got the advantage function for a given state in action was to use the reward plus the value function at the next time step minus the value function at the current time step. And these are all the value function."},{"start":2538.38,"text":"that we just estimated. So you could use this. The one alternative, well, so you could use this. This is going to rely on having a value function that is fairly accurate because you're doing this kind of one step kind of temporal difference between the reward plus the value here minus the value at the current state. And so one alternative thing that you could do is instead of using"}],"speech_gaps":[],"frame":"../frames/v034/015.webp","frame_time":2427.42},{"title":"离线强化学习中的价值函数与优势函数估计","segments":[{"id":228,"text":"this estimated, this reward plus value, which is basically the estimate, the estimated future rewards. If you start state T and take action A minus your current value is instead you could simply use the empirical sum of rewards into the future. And so this could simply be the","zh":"这个估计，这个奖励加上价值，基本上就是估计的未来奖励。如果你从状态 T 开始并采取动作 A，减去你当前的价值，你也可以简单地使用未来奖励的实证总和。因此，这可以简单地是","start":2569.31,"end":2597.2},{"id":229,"text":"And this is going to be a little bit simpler and doesn't rely on having a good kind of temporal difference between the two.","zh":"这种方法会更简单一些，并且不依赖于两个时间点之间有良好的时间差分。","start":2610.06,"end":2619.38},{"id":230,"text":"And so specifically, we can first estimate the value function by trying to minimize the difference between our value estimate and the sum of rewards.","zh":"因此，我们可以首先通过尝试最小化我们的价值估计与奖励总和之间的差异来估计价值函数。","start":2620.7,"end":2628.78},{"id":231,"text":"rewards. And then to estimate the advantage function, we can take the sum of rewards for","zh":"奖励。然后，为了估计优势函数，我们可以取该轨迹的奖励总和","start":2628.78,"end":2637.88},{"id":232,"text":"that trajectory and subtract the value. In terms of this particular advantage estimate","zh":"并减去价值。就这种特定的优势估计而言","start":2637.88,"end":2647.42},{"id":233,"text":"corresponds to a fairly simple and fairly popular algorithm called advantage weighted","zh":"对应于一种相当简单且相当流行的算法，称为优势加权回归。我应该强调，我们之前的方法，即使用 r 加上 v(s_{t+1})，也是有效的。这仅仅对应于一种方法","start":2647.42,"end":2653.32},{"id":234,"text":"weighted regression. I should emphasize that the way that we did it previously, where you","zh":"加权回归。我应该强调，我们之前采用的方法，即使用 r 加上 v of s t plus 1，也是有效的。","start":2653.32,"end":2665.0},{"id":235,"text":"use r plus v of s t plus 1, is also valid. This simply corresponds to a method that is","zh":"这仅仅对应于一种方法，即","start":2665.0,"end":2671.1},{"id":236,"text":"used pretty commonly and seems to work well in practice when you have an offline dataset.","zh":"这种方法在实践中使用得相当普遍，当你有一个离线数据集时，它似乎表现得非常好。","start":2671.1,"end":2675.84},{"id":237,"text":"The question was, we talked about before how this is somewhat high variance and GAE is","zh":"问题是，我们之前讨论过，这种方法方差较高，而GAE（广义优势估计）则更好。","start":2677.08,"end":2681.8},{"id":238,"text":"better. You could also use GAE here, definitely. This is going to be a little bit simpler,","zh":"你也可以在这里使用GAE，当然可以。这将会稍微简单一些，","start":2681.8,"end":2688.34},{"id":239,"text":"but you could also use generalized advantage estimation.","zh":"但你也可以使用广义优势估计。","start":2689.3,"end":2693.42},{"id":240,"text":"Yeah, that's a good question. So the question is, are we bringing up this Monte Carlo because with an offline data set, we have enough data that sum of rewards is more accurate and we don't have the variance issues that we saw before. That's definitely one reason. When you have a large offline data set, variance is a bit less of a concern. And these are more accurate. That said, a big part of it is also just simplicity. And it's nice.","zh":"是的，这是一个好问题。问题是，我们为何提到蒙特卡洛方法？因为在离线数据集中，我们拥有足够的数据，使得奖励的总和更加准确，而且我们不会像之前那样遇到方差问题。这肯定是一个原因。当你拥有一个大型离线数据集时，方差就不是那么重要的问题了。而且这些方法更加准确。不过，其中很大一部分原因也是因为简单性。而且这很讨人喜欢。","start":2694.5,"end":2721.84},{"id":241,"text":"Yeah, it's very nice to have an algorithm where you're doing kind of supervised learning to fit the value function and then you're doing weighted supervised learning to fit the policy.","zh":"是的，拥有一种算法，你既进行监督学习来拟合价值函数，又进行加权监督学习来拟合策略，这非常棒。","start":2723.57,"end":2730.57},{"id":242,"text":"And it's just a very, very simple algorithm.","zh":"而且这只是一个非常、非常简单的算法。","start":2730.75,"end":2732.77},{"id":243,"text":"Next, we'll talk about slightly more complicated algorithms that then kind of this version one right here that can also do a bit better.","zh":"接下来，我们将讨论稍微复杂一些的算法，这些算法在某种程度上可以比这个版本做得更好。","start":2733.97,"end":2744.19}],"notes":["本段主要讲解了在离线强化学习中，如何通过估计价值函数和优势函数来构建策略。价值函数的估计是通过最小化估计值与未来奖励总和之间的差异，而优势函数则是通过从轨迹中获取奖励总和并减去价值函数来计算。这种方法被称为优势加权回归，是一种简单且流行的算法。","讲者强调了两种方法的对比：一种是使用奖励加上下一状态的价值函数（r + V(s_{t+1}）），另一种是使用蒙特卡洛方法直接计算奖励总和。前者在离线数据集中表现良好，但存在较高的方差，而后者虽然更准确，但计算复杂度更高。","讲者提到，使用蒙特卡洛方法的原因之一是，当离线数据集足够大时，奖励总和的估计更加准确，且方差问题相对较小。此外，这种方法的实现较为简单，因此在实际应用中更受欢迎。","讲者还指出，虽然蒙特卡洛方法在某些情况下更优，但也可以使用广义优势估计（GAE）来减少方差。GAE是一种在离线强化学习中常用的改进方法，能够平衡方差和偏差。","讲者进一步说明，使用监督学习来拟合价值函数和加权监督学习来拟合策略是一种非常直观且有效的策略。这种方法的实现非常简单，适合初学者理解和应用。","最后，讲者提到接下来将介绍更复杂的算法，这些算法在某些情况下可以比当前讨论的简单方法表现得更好。这表明离线强化学习中存在多种方法，每种方法都有其适用场景和优缺点。"],"formulas":[],"uncertainties":["r plus v of s t plus 1","sum of rewards is more accurate"],"diagram":"none","start":2569.31,"end":2744.19,"asr_flags":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":2569.31,"text":"this estimated, this reward plus value, which is basically the estimate, the estimated future rewards. If you start state T and take action A minus your current value is instead you could simply use the empirical sum of rewards into the future. And so this could simply be the,"},{"start":2610.06,"text":"And this is going to be a little bit simpler and doesn't rely on having a good kind of temporal difference between the two."},{"start":2620.7,"text":"And so specifically, we can first estimate the value function by trying to minimize the difference between our value estimate and the sum of rewards."},{"start":2628.78,"text":"rewards. And then to estimate the advantage function, we can take the sum of rewards for"},{"start":2637.88,"text":"that trajectory and subtract the value. In terms of this particular advantage estimate"},{"start":2647.42,"text":"corresponds to a fairly simple and fairly popular algorithm called advantage weighted"},{"start":2653.32,"text":"weighted regression. I should emphasize that the way that we did it previously, where you"},{"start":2665.0,"text":"use r plus v of s t plus 1, is also valid. This simply corresponds to a method that is"},{"start":2671.1,"text":"used pretty commonly and seems to work well in practice when you have an offline dataset."},{"start":2677.08,"text":"The question was, we talked about before how this is somewhat high variance and GAE is"},{"start":2681.8,"text":"better. You could also use GAE here, definitely. This is going to be a little bit simpler,"},{"start":2689.3,"text":"but you could also use generalized advantage estimation."},{"start":2694.5,"text":"Yeah, that's a good question. So the question is, are we bringing up this Monte Carlo because with an offline data set, we have enough data that sum of rewards is more accurate and we don't have the variance issues that we saw before. That's definitely one reason. When you have a large offline data set, variance is a bit less of a concern. And these are more accurate. That said, a big part of it is also just simplicity. And it's nice."},{"start":2723.57,"text":"Yeah, it's very nice to have an algorithm where you're doing kind of supervised learning to fit the value function and then you're doing weighted supervised learning to fit the policy."},{"start":2730.75,"text":"And it's just a very, very simple algorithm."},{"start":2733.97,"text":"Next, we'll talk about slightly more complicated algorithms that then kind of this version one right here that can also do a bit better."}],"speech_gaps":[],"frame":"../frames/v034/016.webp","frame_time":2581.31},{"title":"离线强化学习中的优势估计与策略偏差","segments":[{"id":244,"text":"So it's still even when you have an offline data set, there is like variance, more variance in this estimate than other estimates that we'll see in a minute.","zh":"因此，即使你有一个离线数据集，这个估计的方差仍然存在，而且比我们稍后将看到的其他估计的方差更大。","start":2744.29,"end":2751.95},{"id":245,"text":"Now, one question that just to get your brains thinking a little bit.","zh":"现在，有一个问题，只是为了让你的大脑稍微思考一下。","start":2753.63,"end":2759.83},{"id":246,"text":"So the question is, if you did this for a deterministic data set or a policy that was deterministic underlying the data set, what do you actually learn?","zh":"问题是，如果你对一个确定性的数据集或一个在数据集背后具有确定性策略的情况进行这样的处理，你实际上会学到什么？","start":2759.97,"end":2772.43},{"id":247,"text":"And so as an example, let's say that we have the car again. And maybe the car, if it's in some lanes,","zh":"举个例子，假设我们再次有这辆车。也许这辆车如果处于某些车道，","start":2772.43,"end":2791.91},{"id":248,"text":"maybe it just always goes straight and you never actually see it turn left or turn right. My","zh":"也许它总是直行，你实际上从不会看到它左转或右转。我","start":2792.05,"end":2798.69},{"id":249,"text":"My question for you is, yeah, if you were to run this algorithm where you are fitting your advantages in this way on the data set, what advantages will you learn?","zh":"我的问题是，如果你运行这样一个算法，在这种数据集上拟合你的优势值，你会学到什么样的优势值？","start":2798.69,"end":2811.41},{"id":250,"text":"And I'll let you talk about this for like two minutes and then we'll come back to talk about this with your neighbor.","zh":"我会让你讨论这个问题大约两分钟，然后我们回来和你的邻居一起讨论这个问题。","start":2811.73,"end":2817.11},{"id":251,"text":"OK, let's come back. Does anyone want to share what you just?","zh":"好的，我们回来。有没有人想分享你刚才的想法？","start":2822.43,"end":2826.35},{"id":252,"text":"Yeah, so what was said is that if you're always taking the same action, then the sum of rewards will be the same as V because you don't actually see any kind of variability in your actions. And that means that your advantage estimates will all be zero.","zh":"是的，刚才说的要点是，如果你总是采取同一个动作，那么奖励的总和就会和V相同，因为你实际上没有在动作上看到任何变化。这意味着你的优势估计值都会是零。","start":2828.0,"end":2842.9},{"id":253,"text":"And then taking that one step further, if you then plug this into this equation, if all your advantage estimates are 0, then this exponential term is going to be 1. And then you actually just get back kind of vanilla imitation learning. And it's kind of nice that you get that back because it means that for this sort of policy,","zh":"进一步来说，如果你将这个结果代入这个公式，如果所有的优势估计值都是0，那么这个指数项就会是1。然后你实际上就回到了一种普通的模仿学习。这有点好，因为它意味着对于这种策略，","start":2843.7,"end":2862.9},{"id":254,"text":"you actually can't really do better than the behavior policy in that scenario because you don't see any variability in different actions you can take. And so this algorithm then kind of falls back on imitation learning in that scenario. Yeah, so the question is, when collecting data from offline RL, does this mean that you should kind of sometimes deviate from the expert policy just to see more example actions? And yeah, generally having more diverse...","zh":"你实际上无法在那种情况下比行为策略表现得更好，因为你没有看到可以采取的不同动作的多样性。因此，该算法在这种情况下会退回到模仿学习。是的，所以问题是，当从离线强化学习中收集数据时，这意味着你应该有时偏离专家策略，以看到更多的示例动作吗？是的，一般来说，你的离线数据集中包含更多样化的动作是有利于离线强化学习的，尤其是如果你认为专家策略并不是最优的，那么你肯定希望有这种多样性，因为这样你实际上就有潜力在数据中超越专家策略。","start":2863.84,"end":2888.42},{"id":255,"text":"actions represented in your offline data set is good for offline RL, especially if you think that your expert is not the optimal thing to do, then you definitely want variability because then you can actually have the potential to outperform the expert in your data.","zh":"你实际上可以在那种情况下比行为策略表现得更好，因为你没有看到可以采取的不同动作的多样性。因此，该算法在这种情况下会退回到模仿学习。是的，所以问题是，当从离线强化学习中收集数据时，这意味着你应该有时偏离专家策略，以看到更多的示例动作吗？是的，一般来说，你的离线数据集中包含更多样化的动作是有利于离线强化学习的，尤其是如果你认为专家策略并不是最优的，那么你肯定希望有这种多样性，因为这样你实际上就有潜力在数据中超越专家策略。","start":2890.2,"end":2902.62}],"notes":["本段讨论了在离线强化学习中，当数据集中没有动作多样性时，优势估计会如何变化。讲者通过一个汽车的例子说明，如果数据集中只包含一直直行的动作，那么优势估计会全部为零，因为没有动作的差异性。","讲者进一步指出，当优势估计为零时，算法会退化为模仿学习，这意味着在这种情况下，无法超越行为策略的表现。这表明数据集的多样性对于离线强化学习非常重要。","讲者提出，为了提高离线强化学习的效果，应该在数据集中包含更多样化的动作。如果认为专家策略并非最优，那么数据集的多样性可以提供改进的潜力。","讲者强调，数据集的多样性是离线强化学习成功的关键因素之一，尤其是在专家策略可能不是最优的情况下，多样性可以带来更好的策略学习。","讲者通过一个具体的例子说明了优势估计的计算过程，以及当数据集中没有动作变化时，优势估计会如何影响最终的策略学习。","讲者最后提出一个开放性问题，即在收集离线数据时，是否应该有时偏离专家策略以获取更多样化的动作示例，这引发了对数据集多样性的进一步思考。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2744.29,"end":2902.62,"asr_flags":[247],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":2744.29,"text":"So it's still even when you have an offline data set, there is like variance, more variance in this estimate than other estimates that we'll see in a minute."},{"start":2753.63,"text":"Now, one question that just to get your brains thinking a little bit."},{"start":2759.97,"text":"So the question is, if you did this for a deterministic data set or a policy that was deterministic underlying the data set, what do you actually learn?"},{"start":2772.43,"text":"And so as an example, let's say that we have the car again. And maybe the car, if it's in some lanes,"},{"start":2792.05,"text":"maybe it just always goes straight and you never actually see it turn left or turn right. My"},{"start":2798.69,"text":"My question for you is, yeah, if you were to run this algorithm where you are fitting your advantages in this way on the data set, what advantages will you learn?"},{"start":2811.73,"text":"And I'll let you talk about this for like two minutes and then we'll come back to talk about this with your neighbor."},{"start":2822.43,"text":"OK, let's come back. Does anyone want to share what you just?"},{"start":2828.0,"text":"Yeah, so what was said is that if you're always taking the same action, then the sum of rewards will be the same as V because you don't actually see any kind of variability in your actions. And that means that your advantage estimates will all be zero."},{"start":2843.7,"text":"And then taking that one step further, if you then plug this into this equation, if all your advantage estimates are 0, then this exponential term is going to be 1. And then you actually just get back kind of vanilla imitation learning. And it's kind of nice that you get that back because it means that for this sort of policy,"},{"start":2863.84,"text":"you actually can't really do better than the behavior policy in that scenario because you don't see any variability in different actions you can take. And so this algorithm then kind of falls back on imitation learning in that scenario. Yeah, so the question is, when collecting data from offline RL, does this mean that you should kind of sometimes deviate from the expert policy just to see more example actions? And yeah, generally having more diverse..."},{"start":2890.2,"text":"actions represented in your offline data set is good for offline RL, especially if you think that your expert is not the optimal thing to do, then you definitely want variability because then you can actually have the potential to outperform the expert in your data."}],"speech_gaps":[],"frame":"../frames/v034/017.webp","frame_time":2756.29},{"title":"离线强化学习中的优势函数与价值函数估计","segments":[{"id":256,"text":"Yeah, so the question is, does this happen very often in practice where your estimates are zero? So the true advantage function for this policy is not zero for other actions. It's just that we don't see those other actions in the data. And in practice, if you have variability in the actions, then you will get advantages that are very different from zero. And so, yeah, you will actually see a good amount of variability. It really depends on how broad your data set is.","zh":"是的，问题是，这种情况在实践中是否经常发生，即你的估计值为零？对于这个策略，真正的优势函数在其他动作上并不是零。只是我们没有在数据中看到这些其他动作。实际上，如果你的动作有变化性，那么你得到的优势值会与零有很大差异。因此，你会实际看到相当多的变异性。这真的取决于你的数据集有多广泛。","start":2903.45,"end":2931.73},{"id":257,"text":"Yeah, so the question is, what would the advanced function do on actions that are not in the data set? So in this objective, we're actually only evaluating it on actions in the data set. And so you don't have any issues with kind of going outside the support. Now, if you did evaluate it on actions outside the data set for a different reason, then it would be not.","zh":"是的，问题是，这个优势函数在数据集中没有的动作上会怎么做？在这个目标函数中，我们实际上只在数据集中的动作上进行评估。因此，你不会遇到超出支持范围的问题。如果出于其他原因你评估了数据集外的动作，那么它就不准确了。","start":2932.49,"end":2956.63},{"id":258,"text":"accurate. It'll just be whatever was the result of the neural network optimization. If it's close to the data, it might be reasonable. If it's far from the data, it might be arbitrarily incorrect. So the full algorithm is we first fit a value function using Monte Carlo regression.","zh":"它将只是神经网络优化的结果。如果它接近数据，可能合理；如果远离数据，可能会有任意错误。因此，完整的算法是，我们首先使用蒙特卡洛回归拟合一个价值函数。","start":2958.46,"end":2975.6},{"id":259,"text":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be.","zh":"然后我们训练一个策略，其中我们通过指数化的优势估计值来加权采取某个动作的概率或似然目标，其中优势估计值由奖励的总和减去价值函数给出。我们这里有一个超参数，它控制温度或这个分布的尖锐程度。","start":2976.41,"end":3005.35},{"id":260,"text":"One of the upsides of this is this algorithm is very, very simple. It's probably the simplest thing that you could implement that has the possibility of improving over filtered imitation learning. It also avoids querying or training on any auto-distribution actions, which makes it more stable. That said, Monte Carlo estimation can be noisy, and we're learning an advantage estimate for...","zh":"这种方法的一个优点是，这个算法非常、非常简单。它可能是你能实现的最简单的算法，具有改进过滤模仿学习的可能性。它还避免了查询或训练任何自动分布动作，这使其更加稳定。不过，蒙特卡洛估计可能会有噪声，而我们学习的是行为策略的优势估计，而不是我们正在学习的策略的优势估计。因此，我们只能在数据集的基础上改进到一定程度。","start":3006.99,"end":3032.75},{"id":261,"text":"the behavior policy, not for the policy that we're learning. And so this is going to be like we can only improve so much over the data set as a result.","zh":"行为策略，而不是我们正在学习的策略。因此，我们只能在数据集的基础上改进到一定程度。","start":3033.26,"end":3044.24},{"id":262,"text":"Yeah, so the question is, is this always close to zero, and why not? Because you're trying to fit your value function to the empirical sum of rewards, and then we're taking the sum of rewards and subtracting the value from it. Now, the reason why, if you have a broad data set, that it won't always be zero is that from an individual state, you will see diverse actions.","zh":"是的，所以问题是，这是否总是接近于零，为什么不是呢？因为你试图将价值函数拟合到奖励的实证总和上，然后我们对奖励总和减去价值函数。现在，如果你有一个广泛的数据集，它并不总是为零的原因是，从单个状态中，你会看到多样化的动作。","start":3045.13,"end":3070.13}],"notes":["本段讨论了在离线强化学习中，优势函数估计的准确性问题。当数据集中没有包含某些动作时，优势函数估计可能不准确，其结果取决于神经网络优化的结果。如果估计值接近数据，可能合理；如果远离数据，可能产生任意错误。因此，算法首先使用蒙特卡洛回归拟合价值函数，然后训练策略，通过指数化优势估计值来加权动作的概率。","在训练策略时，优势估计值由奖励总和减去价值函数得到，且存在一个超参数控制温度或分布的尖锐程度。该算法的优点是简单，可能比过滤模仿学习有改进，且避免了对自动分布动作的查询或训练，从而更稳定。但蒙特卡洛估计可能有噪声，且优势估计是针对行为策略而非学习策略的，因此改进有限。","当数据集较广时，优势函数估计不会总是接近零，因为从单个状态中可以看到多样化的动作。这表明，优势函数估计的准确性依赖于数据集的覆盖范围，而不仅仅是数据集中已有的动作。","在离线强化学习中，优势函数估计的准确性受到数据集覆盖范围的影响。如果数据集不够广泛，优势函数估计可能无法准确反映真实的优势，从而影响策略的优化效果。","该算法通过蒙特卡洛回归拟合价值函数，并利用优势估计值来加权策略的学习过程。这种设计使得算法在保持简单性的同时，能够对行为策略进行一定程度的改进。","优势函数估计的准确性直接影响策略的优化效果。如果估计值偏离真实值，可能导致策略性能下降。因此，确保数据集的广泛性和优势估计的准确性是离线强化学习中的关键问题。"],"formulas":[{"latex":"A(s, a) = \\text{sum of rewards} - V(s)","symbols":"优势函数估计值为奖励总和减去价值函数","explanation":"公式正确，优势函数定义为奖励总和减去价值函数，符合强化学习中优势函数的定义。","evidence":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be."},{"latex":"P(a|s) \\text{ is weighted by } \\text{exp}(A(s, a))","symbols":"策略中动作的概率由指数化的优势估计值加权","explanation":"公式正确，策略中动作的概率由指数化的优势估计值加权，符合策略梯度方法中使用优势函数进行策略优化的常见做法。","evidence":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be."}],"uncertainties":["the behavior policy, not for the policy that we're learning"],"diagram":"none","start":2903.45,"end":3070.13,"asr_flags":[],"math_clarifications":["优势函数 $ A(s, a) $ 的定义为奖励总和减去价值函数 $ V(s) $，这是强化学习中常见的定义方式。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2903.45,"text":"Yeah, so the question is, does this happen very often in practice where your estimates are zero? So the true advantage function for this policy is not zero for other actions. It's just that we don't see those other actions in the data. And in practice, if you have variability in the actions, then you will get advantages that are very different from zero. And so, yeah, you will actually see a good amount of variability. It really depends on how broad your data set is."},{"start":2932.49,"text":"Yeah, so the question is, what would the advanced function do on actions that are not in the data set? So in this objective, we're actually only evaluating it on actions in the data set. And so you don't have any issues with kind of going outside the support. Now, if you did evaluate it on actions outside the data set for a different reason, then it would be not."},{"start":2958.46,"text":"accurate. It'll just be whatever was the result of the neural network optimization. If it's close to the data, it might be reasonable. If it's far from the data, it might be arbitrarily incorrect. So the full algorithm is we first fit a value function using Monte Carlo regression."},{"start":2976.41,"text":"And then we train a policy where we weight the probability of taking an action or the likelihood objective by the exponentiated advantage estimate, where the advantage estimate is given by the sum of rewards minus the value function. And we have this hyperparameter here that kind of controls the temperature or how spiky this distribution will be."},{"start":3006.99,"text":"One of the upsides of this is this algorithm is very, very simple. It's probably the simplest thing that you could implement that has the possibility of improving over filtered imitation learning. It also avoids querying or training on any auto-distribution actions, which makes it more stable. That said, Monte Carlo estimation can be noisy, and we're learning an advantage estimate for..."},{"start":3033.26,"text":"the behavior policy, not for the policy that we're learning. And so this is going to be like we can only improve so much over the data set as a result."},{"start":3045.13,"text":"Yeah, so the question is, is this always close to zero, and why not? Because you're trying to fit your value function to the empirical sum of rewards, and then we're taking the sum of rewards and subtracting the value from it. Now, the reason why, if you have a broad data set, that it won't always be zero is that from an individual state, you will see diverse actions."}],"speech_gaps":[],"frame":"../frames/v034/018.webp","frame_time":2915.45},{"title":"离线强化学习中的优势函数与策略改进","segments":[{"id":263,"text":"And your value function is going to be, maybe say this gets like plus 10, this gets plus 1, this gets like minus 5. Your value function for this estimate is going to be the average of these numbers. So that is 3, I think. And the sum of rewards for taking this action is going to be 10. And so then the sum of rewards minus your value estimate will be 7.","zh":"你的价值函数将是，比如说，这个得到加10，这个得到加1，这个得到大约减5。你对这个估计的价值函数将是这些数字的平均值。因此，我认为是3。而采取这个动作的奖励总和将是10。因此，奖励总和减去你的价值估计将是7。","start":3070.87,"end":3097.64},{"id":264,"text":"For this action, a is equal to 7. For this one, a is equal to negative 2. And for this one, a is equal to negative 8. And so when you have variability from a state or a state that's very similar to states in your data set, that's where you see kind of differences in outcomes. And that's where your advantage functions will differ. Cool.","zh":"对于这个动作，a等于7。对于这个动作，a等于负2。对于这个动作，a等于负8。因此，当你从一个状态或一个与数据集中状态非常相似的状态中出现差异时，你会看到结果上的差异。这也是你的优势函数会有所不同之处。酷。","start":3099.68,"end":3126.35},{"id":265,"text":"It'd be really nice to be able to not just use Monte Carlo and be able to use TD updates or use bootstrapped updates without having to query Q on out of distribution actions. And the issue that we saw with our previous objective right here was we were querying the actions, querying the Q function out of distribution actions right here. Now, one very simple thing that we could do is instead of...","zh":"如果能够不仅使用蒙特卡洛方法，还能使用TD更新或使用自举更新，而无需查询超出分布的动作的Q值，那就太好了。我们之前目标中出现的问题是我们在这里查询了超出分布的动作的Q函数。现在，我们可以做的一件非常简单的事情是，而不是查询从我们正在学习的策略中采样的动作，我们可以直接从我们的数据集中采样A prime。这是一个非常简单的修改。这将确保我们看到的A prime实际上在数据中总是存在的。我们实际上会为这个S prime A prime拥有监督目标。因此，这是一个非常","start":3127.93,"end":3155.36},{"id":266,"text":"querying action sampled from the policy that we're learning, we could just sample A prime from our data set. And this is a very simple modification. And this will prevent, this will make sure that the A prime that we're seeing is actually always seen in the data. And we will actually have supervision targets for this S prime A prime. So this is a very,","zh":"简单的对这个目标的修改。如果你以这种方式估计优势函数，或者估计Q函数然后用它来估计你的优势函数，你将得到一个叫做优势加权演员评论家的算法。请注意，这消除了原始优势加权回归算法的一个弱点，即我们能够使用自举，但我们仍然会为pi beta估计价值函数。","start":3156.37,"end":3182.43},{"id":267,"text":"simple modification to this objective. And if you estimate the advantage function in this way, or estimate the Q function and then use that to estimate your advantage, you get an algorithm called advantage-weighted actor critic. Now note this is getting rid of one of the weaknesses of the original advantage-weighted regression algorithm, which is that we're able to use bootstrapping, but we're still going to be estimating the value function for pi beta.","zh":"简单的对这个目标的修改。如果你以这种方式估计优势函数，或者估计Q函数然后用它来估计你的优势函数，你将得到一个叫做优势加权演员评论家的算法。请注意，这消除了原始优势加权回归算法的一个弱点，即我们能够使用自举，但我们仍然会为pi beta估计价值函数。","start":3184.06,"end":3213.3},{"id":268,"text":"and not for the policy that we're learning. That's still one downside with this approach. From here, it'd be good to think about if we can estimate a Q for a policy that's better than the behavior policy. One of the ways to think about this is that when we're trying to minimize this bootstrapped objective, this target right here, this is a sample from","zh":"并且不是针对我们正在学习的策略。这仍然是这种方法的一个缺点。从这里开始，思考如果我们能够估计一个比行为策略更好的策略的Q值会怎样。一种思考方式是，当我们试图最小化这个自举目标时，这里的这个目标，这是一个样本来自","start":3213.84,"end":3242.11}],"notes":["本段讲解了价值函数的计算方式，通过平均奖励值来估计价值函数，并指出在不同动作下奖励值的差异。例如，一个动作的奖励值为10，而价值函数估计为3，因此奖励值与价值函数的差值为7。这说明在强化学习中，价值函数的估计是基于历史数据的平均值，而奖励值的总和则用于评估动作的总体表现。","本段讨论了在不同状态下，由于数据集中的状态相似性，可能会出现不同的结果。这种差异体现在优势函数上，即优势函数会因状态的不同而变化。这表明在离线强化学习中，优势函数的估计需要考虑状态的分布和数据集的特性。","本段提到，为了在不查询分布外动作的情况下使用TD更新或自举更新，可以考虑从数据集中采样动作。这种修改可以确保采样的动作在数据集中存在，从而避免分布外动作带来的问题。这说明在离线强化学习中，策略的改进需要依赖于数据集中的已有信息。","本段指出，虽然通过这种修改可以避免查询分布外动作，但仍然存在一个缺点，即价值函数的估计仍然是针对行为策略（behavior policy）而不是当前学习的策略。这表明在离线强化学习中，策略的改进需要进一步考虑如何估计目标策略的价值函数。","本段提到，可以考虑估计一个比行为策略更好的策略的Q函数。这表明在离线强化学习中，策略的改进不仅需要考虑当前策略的表现，还需要探索更优的策略。通过最小化自举目标，可以逐步优化策略，使其更接近最优策略。","本段最后提到，当尝试最小化自举目标时，目标值是一个样本。这说明在离线强化学习中，目标值的估计是基于数据集中的样本，而不是通过分布外动作进行预测。这种基于样本的估计方法有助于提高策略的稳定性和泛化能力。"],"formulas":[],"uncertainties":["可能听不清的公式部分，如'pi beta'的具体含义"],"diagram":"none","start":3070.87,"end":3242.11,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型不明确，未明确说明是平均值还是总和，且未明确n的定义，无法核定","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3070.87,"text":"And your value function is going to be, maybe say this gets like plus 10, this gets plus 1, this gets like minus 5. Your value function for this estimate is going to be the average of these numbers. So that is 3, I think. And the sum of rewards for taking this action is going to be 10. And so then the sum of rewards minus your value estimate will be 7."},{"start":3099.68,"text":"For this action, a is equal to 7. For this one, a is equal to negative 2. And for this one, a is equal to negative 8. And so when you have variability from a state or a state that's very similar to states in your data set, that's where you see kind of differences in outcomes. And that's where your advantage functions will differ. Cool."},{"start":3127.93,"text":"It'd be really nice to be able to not just use Monte Carlo and be able to use TD updates or use bootstrapped updates without having to query Q on out of distribution actions. And the issue that we saw with our previous objective right here was we were querying the actions, querying the Q function out of distribution actions right here. Now, one very simple thing that we could do is instead of..."},{"start":3156.37,"text":"querying action sampled from the policy that we're learning, we could just sample A prime from our data set. And this is a very simple modification. And this will prevent, this will make sure that the A prime that we're seeing is actually always seen in the data. And we will actually have supervision targets for this S prime A prime. So this is a very,"},{"start":3184.06,"text":"simple modification to this objective. And if you estimate the advantage function in this way, or estimate the Q function and then use that to estimate your advantage, you get an algorithm called advantage-weighted actor critic. Now note this is getting rid of one of the weaknesses of the original advantage-weighted regression algorithm, which is that we're able to use bootstrapping, but we're still going to be estimating the value function for pi beta."},{"start":3213.84,"text":"and not for the policy that we're learning. That's still one downside with this approach. From here, it'd be good to think about if we can estimate a Q for a policy that's better than the behavior policy. One of the ways to think about this is that when we're trying to minimize this bootstrapped objective, this target right here, this is a sample from"}],"speech_gaps":[],"frame":"../frames/v034/019.webp","frame_time":3082.87},{"title":"价值函数的分布与蒙特卡洛回归","segments":[{"id":269,"text":"v of s prime. So like we saw here, v of s prime, we're estimating the mean, the average of the outcomes, the average of the expected future rewards. But actually, there's a distribution of outcomes that's represented in the data. And so if we think about that distribution, so we have our value function.","zh":"s'的价值。就像我们在这里看到的，s'的价值，我们是在估计结果的均值，也就是预期未来奖励的平均值。但实际上，数据中表示的是结果的一个分布。因此，如果我们考虑这个分布，我们就有我们的价值函数。","start":3243.01,"end":3271.0},{"id":270,"text":"And if we thought about the value function for a given state, when you are taking different actions, you see different sums of rewards. And so there's actually kind of some underlying distribution in your data for a given state. So maybe a bunch of states see a reward that...","zh":"如果我们考虑某个状态下的价值函数，当你采取不同的动作时，你会看到不同的奖励总和。因此，实际上在你的数据中，对于某个状态，存在某种潜在的分布。也许一些状态看到的奖励……","start":3273.29,"end":3303.92},{"id":271,"text":"that's at this value, maybe a smaller number, have a higher sum of rewards in them, and so forth. And then when we do Monte Carlo regression, if this distribution has a mean maybe right here, then this is what when we're trying to fit the Monte Carlo estimate of","zh":"处于这个值，也许是一个较小的数值，它们的奖励总和更高，依此类推。当我们进行蒙特卡洛回归时，如果这个分布的均值可能在这里，那么这就是我们试图拟合蒙特卡洛估计值时所得到的平均值。","start":3305.53,"end":3327.69},{"id":272,"text":"for our behavior policy, then we get this average right here. We're kind of averaging over the rewards that we're seeing. Now, if we wanted to try to learn a value function for a policy that's better than pi beta, we could think about maybe instead of trying to fit the mean of the outcomes that we see, maybe we could try to fit some other percentile. So this is like the","zh":"我们是在对看到的奖励进行平均。如果我们想要学习一个比πβ策略更好的策略的价值函数，我们可以考虑不再拟合我们看到的结果的均值，而是尝试拟合其他百分位数。这类似于","start":3329.47,"end":3358.53},{"id":273,"text":"But maybe if instead we could try to fit the 70th percentile or something like that, then maybe we could actually get a value function for a policy that is better than our behavior policy. So how do we do that? Maybe let's go through this on the slide. So when we're trying to estimate rewards plus feature key functions, there's a sample of...","zh":"但也许如果我们尝试拟合70百分位数或其他类似数值，那么我们实际上可以得到一个比我们的行为策略更好的策略的价值函数。那么我们如何做到这一点呢？也许让我们在幻灯片上进行演示。当我们试图估计奖励加上特征键函数时，存在一个值的样本。","start":3360.62,"end":3389.32},{"id":274,"text":"the values. And if we think about a histogram of the values for a given state, when we are using this target, we're using an average of the value. So the L2 loss right here is giving us that value.","zh":"如果我们考虑某个状态的值的直方图，当我们使用这个目标时，我们是在使用值的平均值。因此，这里的L2损失函数给出了这个值。","start":3390.12,"end":3414.47}],"notes":["本段讨论了在离线强化学习中，价值函数的分布特性。讲者指出，对于给定状态，不同动作会导致不同的奖励总和，因此数据中存在某种潜在的分布。价值函数的估计需要考虑这些分布的特性，而不仅仅是平均值。","讲者提到，蒙特卡洛回归方法通过平均奖励来估计价值函数，但也可以考虑其他分位数（如70百分位）来学习更优策略的价值函数。这表明，传统的平均估计可能不足以捕捉到更优策略的潜在价值。","讲者进一步说明，当使用目标函数时，我们通常使用平均值来估计价值函数，而L2损失函数在此过程中起到了关键作用，它提供了对平均值的估计。","讲者提到，数据支持的最优策略的价值函数位于某个特定位置，这表明在离线强化学习中，策略的优化需要基于数据分布的特性进行。"],"formulas":[],"uncertainties":["the 70th percentile or something like that"],"diagram":"none","start":3243.01,"end":3414.47,"asr_flags":[],"math_clarifications":["原文未提供足够的数学上下文来确认公式中的符号和数学对象，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3243.01,"text":"v of s prime. So like we saw here, v of s prime, we're estimating the mean, the average of the outcomes, the average of the expected future rewards. But actually, there's a distribution of outcomes that's represented in the data. And so if we think about that distribution, so we have our value function."},{"start":3273.29,"text":"And if we thought about the value function for a given state, when you are taking different actions, you see different sums of rewards. And so there's actually kind of some underlying distribution in your data for a given state. So maybe a bunch of states see a reward that..."},{"start":3305.53,"text":"that's at this value, maybe a smaller number, have a higher sum of rewards in them, and so forth. And then when we do Monte Carlo regression, if this distribution has a mean maybe right here, then this is what when we're trying to fit the Monte Carlo estimate of"},{"start":3329.47,"text":"for our behavior policy, then we get this average right here. We're kind of averaging over the rewards that we're seeing. Now, if we wanted to try to learn a value function for a policy that's better than pi beta, we could think about maybe instead of trying to fit the mean of the outcomes that we see, maybe we could try to fit some other percentile. So this is like the"},{"start":3360.62,"text":"But maybe if instead we could try to fit the 70th percentile or something like that, then maybe we could actually get a value function for a policy that is better than our behavior policy. So how do we do that? Maybe let's go through this on the slide. So when we're trying to estimate rewards plus feature key functions, there's a sample of..."},{"start":3390.12,"text":"the values. And if we think about a histogram of the values for a given state, when we are using this target, we're using an average of the value. So the L2 loss right here is giving us that value. Now the VS for the policy, the best policy in the support of the data is going to be right here."}],"speech_gaps":[],"frame":"../frames/v034/020.webp","frame_time":3255.01},{"title":"使用非对称损失函数改进策略","segments":[{"id":275,"text":"And so maybe there's some way to try to use a different loss function other than the L2 loss to get a better policy.","zh":"因此，也许有一种方法可以尝试使用不同于L2损失函数的其他损失函数，以获得更好的策略。","start":3416.14,"end":3424.46},{"id":276,"text":"Now, an idea for how to do this.","zh":"现在，一个实现这一目标的想法。","start":3428.42,"end":3430.48},{"id":277,"text":"So when we use an L2 loss, we have some error. And so this is the error plotted on the x-axis.","zh":"当我们使用L2损失函数时，我们会有一些误差。而这误差被绘制在x轴上。","start":3430.48,"end":3452.38},{"id":278,"text":"And then an L2 loss, we have something like this, right? Where maybe let's call this E.","zh":"然后，对于L2损失函数，我们有类似这样的情况，对吧？也许我们可以称这个为E。","start":3452.54,"end":3458.94},{"id":279,"text":"this is e squared. And if we instead wanted to get, if we instead wanted to try to get a value","zh":"这是e的平方。如果我们想要获得这个值的估计，我们可以这样做：如果我们不再使用这种对称的损失函数，","start":3458.94,"end":3472.92},{"id":280,"text":"estimate for this, what we could do is if we instead of having this kind of symmetric loss,","zh":"即无论你小于0还是大于0，这种损失函数都是对称的，我们可以改用一种看起来像这样的损失函数。","start":3472.92,"end":3477.74},{"id":281,"text":"that is symmetric if you're less than 0 and greater than 0, you could instead use a loss","zh":"如果在小于0和大于0时对称，你可以改用一个损失函数","start":3477.74,"end":3493.24},{"id":282,"text":"function that looks like this. And you could actually show that loss functions like this","zh":"能够实现这一目标。","start":3493.24,"end":3499.42},{"id":283,"text":"will actually instead try... basically you'll be penalized less for making errors in a particular","zh":"实际上，我们将会尝试……基本上，你在某个方向上犯错误会被惩罚得更少","start":3499.42,"end":3506.18},{"id":284,"text":"direction. And this will actually give you a value function that looks more like this.","zh":"这实际上会给你一个看起来像这样的价值函数","start":3506.18,"end":3515.94},{"id":285,"text":"That's actually better than your behavior policy. Now, specifically what this looks like is if you","zh":"这实际上比你的行为策略更好。现在，具体来说，这种情形是如果你考虑你有一些损失函数，我们将称其为……","start":3515.98,"end":3523.82},{"id":286,"text":"think about you have some loss function, we'll call this, there'll be some, maybe let's say","zh":"这里会有一些，也许让我们说，这是相对于误差而言的。这个损失函数在误差小于零和误差大于零时会有不同的表现","start":3523.82,"end":3533.5},{"id":287,"text":"this is respect to error. This loss function is going to behave differently if the error is less","zh":"并且让我记住方向是什么。所以如果它小于零，那么我们会……","start":3533.5,"end":3540.24},{"id":288,"text":"than zero versus if the error is greater than zero. And let me just remember what the direction","zh":"基础情况只是x平方或e平方。然后我们会有一些超参数，用某个值来加权我们的损失。如果lambda是0.5，那么这就是典型的L2目标，因为它在小于零和大于零时都会是e平方。如果lambda小于0.5，那么它会是","start":3540.24,"end":3550.64},{"id":289,"text":"is. So if it's less than zero, so we will have...","zh":"是。所以如果它小于零，那么我们将有……","start":3550.64,"end":3553.92},{"id":290,"text":"And the base case is just x squared or e squared. Then we'll have some hyperparameter that weights our loss by some value. And if lambda is 0.5, then this is the typical L2 objective because it'll be e squared both less than 0 and above 0. And if lambda is less than 0.5, then it will be","zh":"基本情况只是x平方或e平方。然后我们会有一个超参数，用某个值来加权我们的损失。如果lambda是0.5，那么这就是典型的L2目标，因为它在小于0和大于0时都会是e平方。如果lambda小于0.5，那么它将会是","start":3556.33,"end":3581.68}],"notes":["本段讨论了使用非对称损失函数来改进策略的可能方法。讲者指出，传统的L2损失函数对正负误差的惩罚是对称的，而通过引入一个超参数λ，可以调整损失函数对不同方向误差的惩罚程度，从而得到更优的策略。"],"formulas":[],"uncertainties":["损失函数的具体形式和超参数β的数学表达式存在不确定性，因为讲者没有明确说明β的具体作用和损失函数的完整形式。","损失函数的对称性调整是否完全由β控制，或者是否还涉及其他因素，讲者没有明确说明。"],"diagram":"none","start":3416.14,"end":3581.68,"asr_flags":[281],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":3416.14,"text":"And so maybe there's some way to try to use a different loss function other than the L2 loss to get a better policy."},{"start":3428.42,"text":"Now, an idea for how to do this."},{"start":3430.48,"text":"So when we use an L2 loss, we have some error. And so this is the error plotted on the x-axis."},{"start":3452.54,"text":"And then an L2 loss, we have something like this, right? Where maybe let's call this E."},{"start":3458.94,"text":"this is e squared. And if we instead wanted to get, if we instead wanted to try to get a value"},{"start":3472.92,"text":"estimate for this, what we could do is if we instead of having this kind of symmetric loss,"},{"start":3477.74,"text":"that is symmetric if you're less than 0 and greater than 0, you could instead use a loss"},{"start":3493.24,"text":"function that looks like this. And you could actually show that loss functions like this"},{"start":3499.42,"text":"will actually instead try... basically you'll be penalized less for making errors in a particular"},{"start":3506.18,"text":"direction. And this will actually give you a value function that looks more like this."},{"start":3515.98,"text":"That's actually better than your behavior policy. Now, specifically what this looks like is if you"},{"start":3523.82,"text":"think about you have some loss function, we'll call this, there'll be some, maybe let's say"},{"start":3533.5,"text":"this is respect to error. This loss function is going to behave differently if the error is less"},{"start":3540.24,"text":"than zero versus if the error is greater than zero. And let me just remember what the direction"},{"start":3550.64,"text":"is. So if it's less than zero, so we will have..."},{"start":3556.33,"text":"And the base case is just x squared or e squared. Then we'll have some hyperparameter that weights our loss by some value. And if lambda is 0.5, then this is the typical L2 objective because it'll be e squared both less than 0 and above 0. And if lambda is less than 0.5, then it will be"}],"speech_gaps":[],"frame":"../frames/v034/021.webp","frame_time":3428.14},{"title":"期望分位数回归与离线强化学习中的损失函数设计","segments":[{"id":291,"text":"kind of down-weighting the loss when it's greater than 0 and up-weighting it when it's above 0 and up-weighting it when it's less than 0. And the reverse will be true when lambda is greater than 0.5.","zh":"当损失大于0时，会稍微降低其权重，而当损失在0以上或以下时，会增加其权重。当lambda大于0.5时，情况则相反。","start":3583.45,"end":3601.15},{"id":292,"text":"So what this looks like is instead of, I guess I drew it slightly wrong there, instead of using a loss function that looks like this, you can use an asymmetric loss function that is penalizing errors less in one direction. This is called the expectile regression. It's kind of a cool trick. You can think about it in terms of rather than just errors, some arbitrary random variable x.","zh":"所以，这看起来更像是，我之前画得有点错误，而不是使用这种损失函数，你可以使用一种不对称的损失函数，它在某一方向上对误差的惩罚更小。这种方法称为期望分位数回归。这有点酷。你可以把它看作是，而不是仅仅考虑误差，而是考虑一个任意的随机变量x。","start":3605.22,"end":3630.97},{"id":293,"text":"And if you define different values of this lambda term,","zh":"如果你定义这个lambda项的不同值，","start":3631.74,"end":3636.38},{"id":294,"text":"then you get these asymmetric losses that look like this,","zh":"那么你会得到这些不对称的损失函数，看起来像这样，","start":3636.56,"end":3641.04},{"id":295,"text":"where if, again, if lambda is greater than 0.5,","zh":"其中，如果lambda大于0.5，","start":3641.22,"end":3645.16},{"id":296,"text":"then you see it as asymmetric in this direction,","zh":"你会看到它在这一方向上不对称，","start":3645.3,"end":3647.78},{"id":297,"text":"versus if it's less, you see it asymmetric","zh":"而如果它小于0.5，你会看到它在另一方向上不对称。","start":3647.9,"end":3649.38},{"id":298,"text":"in the other direction.","zh":"在另一方向上不对称。","start":3649.38,"end":3650.34},{"id":299,"text":"And here's kind of another visualization","zh":"这里还有一个可视化的例子","start":3653.6,"end":3655.24},{"id":300,"text":"where if you're trying to, the mean of this random variable","zh":"如果你试图估计这个随机变量的均值","start":3655.24,"end":3659.66},{"id":301,"text":"is shown in the red curve, but then you can get different expectiles with different values of","zh":"则均值会以红色曲线显示，但你可以通过不同的lambda值获得不同的期望分位数","start":3659.66,"end":3665.42},{"id":302,"text":"lambda. So then coming back to our algorithms, if we want to fit our value function, we can use","zh":"因此，回到我们的算法，如果我们想要拟合价值函数，我们可以使用","start":3665.42,"end":3678.12},{"id":303,"text":"this expectile loss and basically fit a value function that is trying to estimate a value","zh":"这个期望分位数损失，并且拟合一个价值函数，该价值函数试图估计一个比行为策略更好的策略的价值函数","start":3678.12,"end":3686.98},{"id":304,"text":"function for a policy that's better than a behavior policy. And this will be penalizing","zh":"并且这会对你高估和低估进行惩罚","start":3686.98,"end":3692.68},{"id":305,"text":"you for overestimating and underestimating, but it won't be penalizing you as much if you","zh":"但如果你稍微高估一点，或者稍微偏离一点，惩罚就不会那么严重","start":3692.68,"end":3697.4},{"id":306,"text":"overestimate a little bit, basically, or if you're off by a little bit. And this means that when you","zh":"这意味着当你","start":3697.4,"end":3701.84},{"id":307,"text":"have these different outcomes and these different kind of outcomes right here, if you get the mean,","zh":"这里会有这些不同的结果和这些不同种类的结果，如果你得到的是均值，","start":3701.84,"end":3709.48},{"id":308,"text":"you get three. Whereas if you have... I haven't written down exactly what the optimum would be,","zh":"你会得到三个。而如果你有……我还没有写下最优值具体是什么，","start":3709.48,"end":3717.64},{"id":309,"text":"but for some value of lambda, it'll be optimal instead of outputting the mean, it'll be more","zh":"但对于某个lambda值，它会比输出均值更优，","start":3717.68,"end":3727.46},{"id":310,"text":"optimal to output something like six, for example, where you're penalized less for...","zh":"例如，输出像六这样的值会更优，因为在某种程度上高估这个值的惩罚会更少，","start":3727.46,"end":3733.28},{"id":311,"text":"for kind of overestimating this value. And yeah, the outcome of the loss function when you sum things together will be something that's higher than the mean. So in particular for this algorithm, we'll use the expect how loss to fit the value function. We'll actually also fit a Q function with the typical mean squared error loss. And we'll actually use the value function as the target.","zh":"而损失函数的总和结果会比均值更高。因此，对于这个算法，我们将使用期望损失来拟合价值函数。我们还将使用典型的均方误差损失来拟合Q函数，并且我们将使用价值函数作为目标。","start":3734.64,"end":3761.38}],"notes":["本段讲解了期望分位数回归（expectile regression）的概念，这是一种通过调整损失函数的不对称性来估计随机变量的期望分位数的方法。讲者提到，当lambda大于0.5时，损失函数会更重视低估，而当lambda小于0.5时，则更重视高估。这种不对称性可以通过调整lambda的值来实现。"],"formulas":[],"uncertainties":["expect how loss"],"diagram":"none","start":3583.45,"end":3761.38,"asr_flags":[],"math_clarifications":["原公式中的损失函数定义存在逻辑错误。当y > ̂y时，损失函数应为λ(y - ̂y)^2；当y \u003c ̂y时，损失函数应为(1 - λ)(̂y - y)^2。原公式中当y = ̂y时损失函数为0，这与期望分位数损失函数的定义不符。因此，该公式需要修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":3583.45,"text":"kind of down-weighting the loss when it's greater than 0 and up-weighting it when it's above 0 and up-weighting it when it's less than 0. And the reverse will be true when lambda is greater than 0.5."},{"start":3605.22,"text":"So what this looks like is instead of, I guess I drew it slightly wrong there, instead of using a loss function that looks like this, you can use an asymmetric loss function that is penalizing errors less in one direction. This is called the expectile regression. It's kind of a cool trick. You can think about it in terms of rather than just errors, some arbitrary random variable x."},{"start":3631.74,"text":"And if you define different values of this lambda term,"},{"start":3636.56,"text":"then you get these asymmetric losses that look like this,"},{"start":3641.22,"text":"where if, again, if lambda is greater than 0.5,"},{"start":3645.3,"text":"then you see it as asymmetric in this direction,"},{"start":3647.9,"text":"versus if it's less, you see it asymmetric"},{"start":3649.38,"text":"in the other direction."},{"start":3653.6,"text":"And here's kind of another visualization"},{"start":3655.24,"text":"where if you're trying to, the mean of this random variable"},{"start":3659.66,"text":"is shown in the red curve, but then you can get different expectiles with different values of"},{"start":3665.42,"text":"lambda. So then coming back to our algorithms, if we want to fit our value function, we can use"},{"start":3678.12,"text":"this expectile loss and basically fit a value function that is trying to estimate a value"},{"start":3686.98,"text":"function for a policy that's better than a behavior policy. And this will be penalizing"},{"start":3692.68,"text":"you for overestimating and underestimating, but it won't be penalizing you as much if you"},{"start":3697.4,"text":"overestimate a little bit, basically, or if you're off by a little bit. And this means that when you"},{"start":3701.84,"text":"have these different outcomes and these different kind of outcomes right here, if you get the mean,"},{"start":3709.48,"text":"you get three. Whereas if you have... I haven't written down exactly what the optimum would be,"},{"start":3717.68,"text":"but for some value of lambda, it'll be optimal instead of outputting the mean, it'll be more"},{"start":3727.46,"text":"optimal to output something like six, for example, where you're penalized less for..."},{"start":3734.64,"text":"for kind of overestimating this value. And yeah, the outcome of the loss function when you sum things together will be something that's higher than the mean. So in particular for this algorithm, we'll use the expect how loss to fit the value function. We'll actually also fit a Q function with the typical mean squared error loss. And we'll actually use the value function as the target."}],"speech_gaps":[],"frame":"../frames/v034/022.webp","frame_time":3595.45},{"title":"离线强化学习中的价值函数与策略优化","segments":[{"id":312,"text":"So we'll be fitting both a value function and a Q function, and we'll just be using this expectile loss for fitting the value function. And then once we have our Q function and value function, then we could estimate the advantage as Q minus V and use the same kind of AWR method to get a policy where we're weighting the likelihoods by the expeditiated Q minus V.","zh":"因此，我们将同时拟合一个价值函数和一个Q函数，并且我们将仅使用这种期望损失来拟合价值函数。一旦我们有了Q函数和价值函数，我们就可以估计优势值为Q减去V，并使用相同的AWR方法来获得一个策略，其中我们将似然性按指数化的Q减去V进行加权。","start":3762.38,"end":3789.15},{"id":313,"text":"Yeah, so the question is, will we be overestimating the value in this case? So one thing to note about this algorithm is we're never going to be passing as input actions that are not in the data. And that was one of the major sources of overestimation before.","zh":"是的，问题是，我们会在这个情况下高估价值吗？需要注意的是，这个算法的一个特点是，我们永远不会将不在数据中的动作作为输入。而这之前是高估的一个主要来源。","start":3790.54,"end":3805.32},{"id":314,"text":"Now, depending on how you set lambda, if you set lambda to be like zero, then you will overestimate probably. And there is a, typically you'll choose some value that's kind of maybe 0.2 or 0.3, something like that's more in the middle that's not so aggressive. And you will be getting an overestimate of the pi beta. And the reason for that is you're actually trying to estimate the value of a policy that's better than pi beta.","zh":"现在，根据你如何设置lambda，如果你将lambda设置为零，那么你可能会高估。通常你会选择一个值，大概是0.2或0.3，这样的值在中间，不会那么激进。你将得到pi beta的高估。原因是你实际上是在估计一个比pi beta更好的策略的价值。","start":3806.36,"end":3834.36},{"id":315,"text":"So you're trying to estimate v pi for a policy pi that's better than pi beta. So you're kind of purposefully overestimating v pi beta. The question is, because we're going to be gradually improving our policy, would it make sense to gradually decrease lambd
