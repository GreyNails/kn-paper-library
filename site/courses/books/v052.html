t minus one given xt."},{"start":273.35,"text":"So, and"},{"start":277.49,"text":"minus KL between q xt"},{"start":282.51,"text":"given"},{"start":288.51,"text":"given 0, p theta xt plus expectation log p theta x0 given x1 to t."},{"start":314.13,"text":"so last time we only focused"},{"start":316.05,"text":"we only had time to discuss this term"},{"start":317.91,"text":"this is a KL between two Gaussian distributions"},{"start":320.33,"text":"one of the Gaussian distributions is this one"},{"start":322.77,"text":"and the other Gaussian distribution I think"},{"start":326.69,"text":"probably if you recall"},{"start":327.73,"text":"the other Gaussian distribution is xt minus 1"},{"start":330.43,"text":"given xt x0"},{"start":333.81,"text":"this distribution is equal to"},{"start":338.05,"text":"to mu tilde t x t x zero"},{"start":345.95,"text":"with covariance beta t, beta tilde t."}],"speech_gaps":[],"frame":"../frames/v052/002.webp","frame_time":192.91},{"title":"表示学习中的KL散度与损失函数","segments":[{"id":38,"text":"And then we discussed that at the end of the last lecture, these are two Gaussian distributions. If you look at KL, it's actually just comparing the mean. Actually, we chose the variance to match. And that's why the KL between two Gaussian distributions is really just comparing the mean of the two distributions. So that's why if you call this term, I think notation we use is LT minus 1."},{"id":39,"text":"there's different t's and we say this is the iot minus one and iot minus one is equals to basically comparing the mean of these two distributions is some expectation of one over two beta t tilde and you look at the mean the difference of the mean this is the mean for the q and the mean for the p theta is mu theta xt t"},{"id":40,"text":"And you do L2 norm squared. And this expectation is over Q, meaning that, strictly speaking, you are generating, because Xt is a random variable, you are generating Xt from Q. And for every realization or instantiation of Xt, you have"},{"id":41,"text":"two numbers, you compare them, you take the square and you average over the choice of x . So that's the loss function we derived formally from this lower bound. That's only one term or one sequence of terms. That's the term for L . And let's also discuss these two other terms very briefly. So this term is actually just zero because if you"},{"id":42,"text":"I guess I need to throw away this so that I don't get confused. So this term is just 0."},{"id":43,"text":"because we assume that t is going to infinity and recall that pt, the distribution of pt assumes to be an entity, the standard normal distribution with mean zero and variance identity. And we established that when t goes to infinity, x t given x zero is also standard normal Gaussian because you add too much noise so that the noise just washes out the signal."},{"id":44,"text":"So that's why both of these are the standard normal Gaussian. They have the same distribution, and the KL is 0. So this is 0. Circuit-speaking, this is converging 0 as t goes to infinity. So we just assume it's 0. And this term is often, in literature, denoted as L1, because it actually does have almost the same term as all the other LT terms, even though"}],"notes":["本段讲解了KL散度在高斯分布之间的计算方式，指出KL散度仅比较两个分布的均值，而方差被设定为匹配。这表明在表示学习中，KL散度的计算主要关注均值差异，而非方差差异。","接着，讲者提到在计算KL散度时，需要考虑不同时间步t的差异，并指出该过程涉及对均值差异的期望计算，其中包含对1/(2β̃t)的期望。这表明KL散度的计算不仅涉及均值比较，还涉及时间步t的参数调整。","随后，讲者解释了L2范数平方的使用，强调该期望是基于分布Q的，意味着Xt是一个随机变量，需要从Q中生成。对于每个Xt的实现，都会计算均值差异的平方，并对所有Xt的实现进行平均，从而得到损失函数。","讲者还提到，当t趋于无穷大时，假设pt是标准正态分布，且Xt在给定X0的情况下也趋于标准正态分布，因为噪声的累积会“淹没”信号。这表明在表示学习中，随着时间步的增加，分布趋于平稳。","最后，讲者指出，当两个分布均为标准正态分布时，KL散度为0，因此该项可以忽略。同时，该项在文献中通常被标记为L1，因为它与其它LT项具有相似的结构，尽管在细节上可能有所不同。","这些内容展示了表示学习中如何通过KL散度和损失函数来建模分布之间的差异，并通过时间步的调整和噪声的累积来实现分布的收敛。"],"formulas":[],"uncertainties":["iot minus one","beta t tilde","circuit-speaking"],"diagram":"none","start":350.68,"end":512.44,"asr_flags":[],"math_clarifications":["KL散度不能仅通过比较均值来计算，应涉及对数概率密度函数的期望。原文中KL散度的计算方式不准确，需修正。","损失函数L的定义需更明确，包括其与KL散度的关系及具体分布条件。","当t趋于无穷大时，Xt|X0为标准正态分布，但未明确说明pt的分布，且未提及具体条件或假设。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":350.68,"text":"And then we discussed that at the end of the last lecture, these are two Gaussian distributions. If you look at KL, it's actually just comparing the mean. Actually, we chose the variance to match. And that's why the KL between two Gaussian distributions is really just comparing the mean of the two distributions. So that's why if you call this term, I think notation we use is LT minus 1."},{"start":375.1,"text":"there's different t's and we say this is the iot minus one and iot minus one is equals to basically comparing the mean of these two distributions is some expectation of one over two beta t tilde and you look at the mean the difference of the mean this is the mean for the q and the mean for the p theta is mu theta xt t"},{"start":406.34,"text":"And you do L2 norm squared. And this expectation is over Q, meaning that, strictly speaking, you are generating, because Xt is a random variable, you are generating Xt from Q. And for every realization or instantiation of Xt, you have"},{"start":429.84,"text":"two numbers, you compare them, you take the square and you average over the choice of x . So that's the loss function we derived formally from this lower bound. That's only one term or one sequence of terms. That's the term for L . And let's also discuss these two other terms very briefly. So this term is actually just zero because if you"},{"start":455.59,"text":"I guess I need to throw away this so that I don't get confused. So this term is just 0."},{"start":466.24,"text":"because we assume that t is going to infinity and recall that pt, the distribution of pt assumes to be an entity, the standard normal distribution with mean zero and variance identity. And we established that when t goes to infinity, x t given x zero is also standard normal Gaussian because you add too much noise so that the noise just washes out the signal."},{"start":489.05,"text":"So that's why both of these are the standard normal Gaussian. They have the same distribution, and the KL is 0. So this is 0. Circuit-speaking, this is converging 0 as t goes to infinity. So we just assume it's 0. And this term is often, in literature, denoted as L1, because it actually does have almost the same term as all the other LT terms, even though"}],"speech_gaps":[],"frame":"../frames/v052/003.webp","frame_time":362.68},{"title":"表示学习中的概率建模","segments":[{"id":45,"text":"like, on the surface, it looks different. But actually, they have the same form of the same formula. So I think I will probably not go through all the details. But maybe let me show you a rough idea on how to derive this term. So sometimes, it's kind of like, eventually, you'll find out that it's almost the same as the LT minus 1 term. So basically, the first thing to deal with, so this is for L1."},{"id":46,"text":"So for L1, the first thing to realize is that P theta X0 given X1 to T, right? So this thing is the same as P0, PX0, P theta X0 given X1 because of the Markov property. You don't have to even look at any of the X2 up to XT if you condition X1. So that's what the Markov property tells us. And this..."},{"id":47,"text":"And then you can just choose. We haven't actually even specified the distribution p theta for x0 and x1. We have specified it for a larger t, but for x0 and x1, we haven't discussed it. We can just write this. We can make the same assumption. Let's say this is an"},{"id":48,"text":"mu theta x1 1, say, sigma 1 squared. I think sigma 1 squared here is the virus."},{"id":49,"text":"you know that you are just looking at the log likelihood of a Gaussian distribution. A log likelihood of a Gaussian distribution is pretty much just you take the log of the Gaussian distribution that has exponential in it. Once you take the log, it's just really what's inside exponential. So log of the density is really something like 1 o  this. You take the gradient of this, and you update your parameter after that. And if you look at most of the materials, they actually don't even write epsilon t hat t, because in some sense, the indices doesn't really make any"},{"start":1736.36,"text":"additional differentiation power. So because you can just even just write, you just sample epsilon. And the notation doesn't have to even have the index. So that's why in most of the materials, you just say epsilon is sample from this, and then you add epsilon to this, and then this is epsilon. Because anyway, it's a random variable. It doesn't really matter how you name it. So that's the training algorithm."},{"start":1767.78,"text":"And then after you turn this, you get this model, which is the model that is trying to reconstruct the noise. And then the way that you apply it to generate is just that you run this p theta from the right-hand side to the left-hand side. So basically, sampling just means that you first sample xt from the noise."},{"start":1801.17,"text":"And then for each step, you first compute. You already have the theta, right? You compute epsilon theta on xtt. And then you try to decode xt minus 1 using a formula that you just add back the noise. So let me see whether there's a, sorry, I'm missing one step."}],"speech_gaps":[],"frame":"../frames/v052/011.webp","frame_time":1689.85},{"title":"表示学习中的扩散模型","segments":[{"id":137,"text":"So you compute this, and then you compute the mu theta using the formula that we had. So mu theta is just a linear combination of x, t, and epsilon."},{"id":138,"text":"I guess I'm still rewriting that equation. And you get a mu theta, which is your prediction for the Xt minus 1, the mean of the prediction of Xt minus 1. And then you just say, I'm going to take Xt minus 1 is equals to the mean plus some noise. Because even the reverse process still has some noise, where the noise is sample from 0 and 0."},{"id":139,"text":"I guess sigma t is the variance you chose. I think in our cases, we chose sigma t to be square root beta tilde t. We already chose that. So strictly speaking here, I should write square root. If I already chose that, I would choose this to be square root beta tilde. Sounds good. Any questions? I think we have discussed why diffusion model works better. They are not kind of like a..."},{"id":140,"text":"very strong theory to prove everything. But generally speaking, I think the main intuition is that one thing is that in one direction of this process is known. It's a fixed noising function so that you don't have to parametrize both the forward and backward. So that seems to make the optimization and everything much easier because before people have tried to"},{"id":141,"text":"use parametric functions for both sides. Of course, the cost is that you have to stretch the timeline to be longer. So the t is actually big. So beginning is 1,000. But I think that actually has a benefit because when you stretch the timeline,"},{"id":142,"text":"the reconstruction becomes locally easy. Each step, you just have to remove a little bit of noise. So basically, at the beginning, you just have a purely white noise image. And then you just have to remove slightly noise to make it slightly, like have some kind of slight signal. And then you try to make it sharper and sharper."}],"notes":["本段讲解了扩散模型中如何通过逆过程进行图像重建。在逆过程中，每个步骤都从噪声中逐步去除，以恢复原始图像。模型通过将噪声逐步减少，使得每一步的重建变得相对容易。","讲者提到，在扩散模型中，噪声的方差σ_t通常被设定为β_t的平方根。这表明在模型设计中，噪声的引入和去除是通过特定的参数化方式来实现的，而不是随机选择。","讲者指出，扩散模型的一个关键优势是其单向过程的确定性。由于前向过程是固定的，因此不需要同时参数化正向和反向过程，这简化了优化问题。","讲者提到，为了使重建过程更容易，通常会将时间步t设置得较大，例如从1000开始。这使得每一步的噪声去除更加平滑，从而提高重建质量。","在逆过程中，初始状态是一个纯白噪声图像，随后通过逐步去除噪声，逐步恢复图像的细节。这种逐步去噪的过程使得模型能够逐步增强图像的清晰度。","讲者强调，扩散模型的直观理解是其在逆过程中的确定性，这使得模型在优化和实现上更加高效，尽管目前尚无完整的理论证明其有效性。"],"formulas":[],"uncertainties":["beta tilde t 的具体定义和使用方式未明确说明","在讲者提到的 'stretch the timeline' 中，具体如何影响模型性能未详细说明"],"diagram":"none","start":1840.49,"end":2001.34,"asr_flags":[],"math_clarifications":["原文中提到的噪声分布和方差未明确，且未说明噪 then you try to make it sharper and sharper."}],"speech_gaps":[],"frame":"../frames/v052/012.webp","frame_time":1852.49},{"title":"表示学习与网络表示","segments":[{"id":143,"text":"At the beginning, probably, you only have to get the contour and the rough idea of the image. And then gradually, you sharpen, so on and so forth. So in some sense, you add more and more details through this process. And each of the local steps is somewhat easier to learn. And that's how you make it kind of like, eventually, everything is about how easy it is to learn this. Fundamentally,"},{"id":144,"text":"You should be able to use networks to represent everything. But how do you represent still matters. And how do you learn matters. And this is a way to decompose the big generation task into smaller steps so you can learn more efficiently. OK, great. So if there's no other questions, I'm going to use the rest of the lectures to talk about as a kind of overview for some of the foundation model stuff."},{"id":145,"text":"So, um, sure, of course."},{"id":146,"text":"Oh I didn't write it explicitly so yeah so that's a good question so basically once I define a loss function everything is computed right so computable so I have a new network this is known this is unknown and I can apply it and define it in PyTorch and then you you compute the gradient of this and you take one step one gradient step update you can you can use item you know gradient descent so on and so forth yep any other questions"},{"id":147,"text":"For this lecture, yes. I think in some of the other lectures, we spend more time on how to compute the gradient, for example. So there's one lecture that is entirely about how to compute a gradient. You have to apply those back propagation, auto differentiation here, because how to compute a gradient here, you have to apply the same thing. And I think in Chris' lectures, I think he talked about SGD, and I think I also mentioned some of the SGD stuff. So those are..."},{"id":148,"text":"Yeah, those are also needed. It's a whole stack. There are so many components. And yes, if you have a new application, a new algorithm, then often it's on the loss level. But you could also innovate on the optimizer level, say replacing SGD by some other optimizer, so on and so forth. And then those changes are often universal. You can apply it for..."}],"notes":["本段主要讲解了如何通过定义损失函数来构建网络，并通过梯度下降进行参数更新。讲者提到，一旦定义了损失函数，整个计算过程就变得可计算，可以使用PyTorch等工具进行实现。同时，讲者指出，梯度的计算需要应用反向传播和自动微分技术，这在后续的课程中会更详细地讲解。","讲者还提到，梯度下降（SGD）是常用的优化方法，但也可以替换为其他优化器。这些优化方法的改进通常具有通用性，可以应用于不同的任务和算法中。","在讲解过程中，讲者强调了损失函数的重要性，指出在新应用或新算法中，通常是在损失函数层面进行创新，但优化器层面的改进同样重要。","讲者提到，整个流程涉及多个组件，包括损失函数、优化器等，这些组件构成了一个完整的堆栈。因此，理解每个组件的作用对于构建有效的模型至关重要。","此外，讲者还提到，梯度的计算需要应用反向传播和自动微分技术，这在后续的课程中会更详细地讲解。","最后，讲者指出，这些技术的改进通常具有通用性，可以应用于不同的任务和算法中，因此理解这些基础概念对于掌握表示学习至关重要。"],"formulas":[],"uncertainties":["item"],"diagram":"none","start":2001.96,"end":2171.79,"asr_flags":[],"math_clarifications":["原文中提及的梯度下降、反向传播和自动微分均为概念性描述，未提供具体数学公式，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2001.96,"text":"At the beginning, probably, you only have to get the contour and the rough idea of the image. And then gradually, you sharpen, so on and so forth. So in some sense, you add more and more details through this process. And each of the local steps is somewhat easier to learn. And that's how you make it kind of like, eventually, everything is about how easy it is to learn this. Fundamentally,"},{"start":2026.22,"text":"You should be able to use networks to represent everything. But how do you represent still matters. And how do you learn matters. And this is a way to decompose the big generation task into smaller steps so you can learn more efficiently. OK, great. So if there's no other questions, I'm going to use the rest of the lectures to talk about as a kind of overview for some of the foundation model stuff."},{"start":2064.42,"text":"So, um, sure, of course."},{"start":2086.59,"text":"oh i didn't write it explicitly so yeah so that's a good question so basically once i define a loss function everything is computed right so computable so i have a new network this is known this is unknown and i can apply it and define it in pytorch and then you you compute the gradient of this and you take one step one gradient step update you can you can use item you know gradient descent so on and so forth yep any other questions"},{"start":2120.76,"text":"For this lecture, yes. I think in some of the other lectures, we spend more time on how to compute the gradient, for example. So there's one lecture that is entirely about how to compute a gradient. You have to apply those back propagation, auto differentiation here, because how to compute a gradient here, you have to apply the same thing. And I think in Chris' lectures, I think he talked about SGD, and I think I also mentioned some of the SGD stuff. So those are..."},{"start":2146.65,"text":"Yeah, those are also needed. It's a whole stack. There are so many components. And yes, if you have a new application, a new algorithm, then often it's on the loss level. But you could also innovate on the optimizer level, say replacing SGD by some other optimizer, so on and so forth. And then those changes are often universal. You can apply it for..."}],"speech_gaps":[{"start":2070.8,"end":2072.304},{"start":2073.264,"end":2076.336},{"start":2079.664,"end":2082.96},{"start":2114.736,"end":2118.992}],"frame":"../frames/v052/013.webp","frame_time":2013.96},{"title":"表示学习与基础模型","segments":[{"id":149,"text":"If you change the optimizer, you can do it for diffusion models. You can do it for large-language models. You can do it for maybe linear regression as well. So those are on a different layer. But generally, I think for the rest of the lectures, we are mostly talking about the data, the architecture, the loss function, and the training procedure, not much anymore about computing gradients and how to update gradients. You just assume once you define a loss function, you can optimize it."},{"id":150,"text":"Cool. So I think now let's talk about a foundation model. I think this is a term that actually is a term that is kind of coined by one of the papers that many of the Stanford people wrote about now probably about like five years ago, maybe four or five years ago."},{"id":151,"text":"some of the faculties in SAIL were very excited about it. I think we discussed a lot about this. Actually, I've seen so many faculty actually sitting in one room and playing with the OpenAI playground. At that moment, OpenAI doesn't even..."},{"id":152,"text":"It's not ChatGPT. It's just a playground with one text box. And what you write and what model genre is actually written in the same text box. And actually, you can choose some kind of hyperparameters there, like in the temperature, so on and so forth. So on the right-hand side, you can choose the model with a drop-down menu, those kind of things. And we'll play with it. And I think many people are very excited about it. And then I think Percy Leung, so he"},{"id":153,"text":"he led his team to study this new paradigm because we realized that this is a new paradigm of machine learning that is quite different from the deep learning wave. And we wrote a survey paper, and we call it Foundation Model. And in that paper, I just checked yesterday. I think in the abstract,"},{"id":154,"text":"it's written something like this is an emergent paradigm. And I look at my notes. In my lecture notes, I also call it emergent paradigm. But I think after three years, we probably should just not call it emergent paradigm. It's the new paradigm. It's the new paradigm. And also, this paradigm also, there are many variances in some sense. Like five years ago, when we talked about a paradigm, we actually"}],"notes":["本段介绍了基础模型（foundation model）这一术语的起源，指出它是由斯坦福大学的研究人员在大约四到五年前提出的。当时，研究人员对GP3（可能指某种模型或论文）表现出极大的兴趣，并在SAIL（斯坦福人工智能实验室）内部进行了大量讨论。他们甚至看到许多教授在一个房间里使用OpenAI的playground进行实验，尽管当时OpenAI还没有推出ChatGPT。","OpenAI playground是一个简单的文本框界面，用户可以在其中输入文本，并选择不同的模型类型和超参数，如温度参数。这一工具让研究人员能够直观地探索不同模型的行为。Percy Leung领导的团队意识到，这种新的范式与传统的深度学习方法有显著不同，因此他们撰写了一篇综述论文，将这种范式称为‘基础模型’。","在论文的摘要中，作者提到这是一种‘新兴范式’（emergent paradigm），但作者认为，经过三年的发展，这一术语已经不再准确，应该直接称为‘新范式’。此外，这一范式具有多种变体，与五年前讨论的范式有所不同。","本段强调了基础模型作为机器学习领域的一个新范式，其核心在于通过大规模数据和复杂模型实现更强大的表示学习能力。这一范式与传统的深度学习方法在目标和实现方式上有显著差异，因此需要新的理论和实践框架来支持其发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2172.08,"end":2330.04,"asr_flags":[],"raw_segments":[{"start":2172.08,"text":"If you change the optimizer, you can do it for diffusion models. You can do it for large-language models. You can do it for maybe linear regression as well. So those are on a different layer. But generally, I think for the rest of the lectures, we are mostly talking about the data, the architecture, the loss function, and the training procedure, not much anymore about computing gradients and how to update gradients. You just assume once you define a loss function, you can optimize it."},{"start":2210.7,"text":"Cool. So I think now let's talk about a foundation model. I think this is a term that actually is a term that is kind of coined by one of the papers that many of the Stanford people wrote about now probably about like five years ago, maybe four or five years ago. So I think the story was that I think after GP3 came out, I think that's 2020 summer. I remember."},{"start":2238.48,"text":"some of the faculties in SAIL were very excited about it. I think we discussed a lot about this. Actually, I've seen so many faculty actually sitting in one room and playing with the OpenAI playground. At that moment, OpenAI doesn't even..."},{"start":2254.12,"text":"It's not ChatGPT. It's just a playground with one text box. And what you write and what model genre is actually written in the same text box. And actually, you can choose some kind of hyperparameters there, like in the temperature, so on and so forth. So on the right-hand side, you can choose the model with a drop-down menu, those kind of things. And we'll play with it. And I think many people are very excited about it. And then I think Percy Leung, so he"},{"start":2283.5,"text":"he led his team to study this new paradigm because we realized that this is a new paradigm of machine learning that is quite different from the deep learning wave. And we wrote a survey paper, and we call it Foundation Model. And in that paper, I just checked yesterday. I think in the abstract,"},{"start":2304.84,"text":"it's written something like this is an emergent paradigm. And I look at my notes. In my lecture notes, I also call it emergent paradigm. But I think after three years, we probably should just not call it emergent paradigm. It's the new paradigm. It's the new paradigm. And also, this paradigm also, there are many variances in some sense. Like five years ago, when we talked about a paradigm, we actually"}],"speech_gaps":[],"frame":"../frames/v052/014.webp","frame_time":2184.08},{"title":"表示学习中的预训练与适应阶段","segments":[{"id":155,"text":"including actually a broader set of techniques in some sense. And now some of those are a little out of date to some degree. And we are converging to even a smaller paradigm to some degree. But nevertheless, I'm still going to talk about some of the techniques that were popular around 2019 to 2022, let's say, before ChatGP came out for one or two lectures. And then we're going to talk about things that are..."},{"id":156,"text":"the dominating approach after 2022, let's say."},{"id":157,"text":"I think the key kind of like a word here is the so-called pre-training. Probably you have heard a lot. And now there's a new work called post-training, which we'll discuss in later lectures. So in some sense, this foundation model paradigm, I think in the paper, in the survey paper, we discussed there are two phases. In some sense, the first phase is the pre-training. The second phase is the adaptation. And adaptation phase. And what happens is that"},{"id":158,"text":"pre-training, the real difference here, there are many different aspects. But probably the most important thing is that it's often using massive unlabeled data. And often several magnitudes higher than what people have done before. And massive unlabeled data and also your"},{"id":159,"text":"This is also somewhat general purpose. You don't really actually just only focus on one type of data. Your data is very diverse. You just try to download everything from the internet. And you don't necessarily care about even data quality that much. Of course, it matters. But at the beginning, people just download."},{"id":160,"text":"very brute force from internet. And some of the data, actually, we look into it, it's not even, you have a hundred slash n consecutively in some of the documents that's even possible. But that's fine. So eventually, the first few versions, the data, you know, they are turned on, it's actually pretty messy. And eventually, people clean up, clean up the data, and it's better and better."},{"id":161,"text":"So the gist is that you have as much data as possible. At the beginning, you don't even care about the quality that much. You just get massive unlabeled data. And you don't care about the labels. You just download documents. And some of these are HTML files, which all the HTML text in it. And some of these are Word documents. Some of these are other kind of documents. Everything is fine. And then in the adaptation phase, you adapt to"}],"notes":["本段主要讲解表示学习中的预训练和适应阶段。预训练阶段使用大量未标记数据，这些数据通常来自互联网，种类多样，质量初期并不严格要求，但随着技术发展，数据会逐步清理和优化。","预训练阶段的核心在于利用大规模未标记数据，这与传统方法不同，传统方法通常依赖标记数据。预训练的目的是让模型学习通用的特征表示，以便在后续的适应阶段中更好地处理特定任务。","适应阶段是预训练之后的步骤，模型会根据具体任务调整其参数，以适应新的数据或任务。适应阶段可能包括微调、迁移学习等技术。","在预训练阶段，数据的多样性非常重要，模型会从各种来源下载数据，包括HTML文件、Word文档等，这些数据可能包含大量噪声，但随着数据处理的优化，质量会逐步提升。","预训练和适应阶段的结合构成了基础模型范式，这种范式在2019年至2022年间非常流行，之后随着新方法如post-training的出现，逐渐被新的技术所补充。","预训练阶段的挑战在于如何处理大规模未标记数据，以及如何在数据质量较低的情况下训练出有效的模型。随着技术的发展，数据清洗和预处理技术得到了显著改进。"],"formulas":[],"uncertainties":["you have a hundred slash n consecutively in some of the documents that's even possible"],"diagram":"none","start":2331.69,"end":2486.63,"asr_flags":[],"raw_segments":[{"start":2331.69,"text":"including actually a broader set of techniques in some sense. And now some of those are a little out of date to some degree. And we are converging to even a smaller paradigm to some degree. But nevertheless, I'm still going to talk about some of the techniques that were popular around 2019 to 2022, let's say, before ChatGP came out for one or two lectures. And then we're going to talk about things that are..."},{"start":2359.05,"text":"the dominating approach after 2022, let's say."},{"start":2363.9,"text":"I think the key kind of like a word here is the so-called pre-training. Probably you have heard a lot. And now there's a new work called post-training, which we'll discuss in later lectures. So in some sense, this foundation model paradigm, I think in the paper, in the survey paper, we discussed there are two phases. In some sense, the first phase is the pre-training. The second phase is the adaptation. And adaptation phase. And what happens is that"},{"start":2393.84,"text":"pre-training, the real difference here, there are many different aspects. But probably the most important thing is that it's often using massive unlabeled data. And often several magnitudes higher than what people have done before. And massive unlabeled data and also your"},{"start":2423.66,"text":"This is also somewhat general purpose. You don't really actually just only focus on one type of data. Your data is very diverse. You just try to download everything from the internet. And you don't necessarily care about even data quality that much. Of course, it matters. But at the beginning, people just download."},{"start":2441.19,"text":"very brute force from internet. And some of the data, actually, we look into it, it's not even, you have a hundred slash n consecutively in some of the documents that's even possible. But that's fine. So eventually, the first few versions, the data, you know, they are turned on, it's actually pretty messy. And eventually, people clean up, clean up the data, and it's better and better."},{"start":2463.15,"text":"So the gist is that you have as much data as possible. At the beginning, you don't even care about the quality that much. You just get massive unlabeled data. And you don't care about the labels. You just download documents. And some of these are HTML files, which all the HTML text in it. And some of these are Word documents. Some of these are other kind of documents. Everything is fine. And then in the adaptation phase, you adapt to"}],"speech_gaps":[],"frame":"../frames/v052/015.webp","frame_time":2343.69},{"title":"表示学习中的基础模型与适应","segments":[{"id":162,"text":"um you can adapt to many tasks, adapt to a wide window to a wide range of tasks, so so in some sense the key thing is that you you start with a very very you know i think that's the reason why it's called foundation model so you start with a very good foundation and then you can kind of like adapt to different tasks uh you never just directly go deal with one task before this mostly people are just say yeah i have image classification i just turn on image classification if i care about"},{"id":163,"text":"object detection, I just turn on object detection."},{"id":164,"text":"And some people actually do multitask."},{"id":165,"text":"They say, I have three tasks, object detection, image classification,"},{"id":166,"text":"maybe bounding box detection, all of this."},{"id":167,"text":"And I turn these three tasks by only three."},{"id":168,"text":"Here, the number of tasks is unlimited in some sense."},{"id":169,"text":"Even the GPT paper probably have 100 tasks in the evaluation,"},{"id":170,"text":"and sometimes even more than that."},{"id":171,"text":"And now, it's even crazier."},{"id":172,"text":"like you don't even have the sometimes notion of tasks is even you define just because you have so"},{"id":173,"text":"many of them like you cannot even just distinguish what is the task what is not what is kind of like"},{"id":174,"text":"a domain in some sense just basically like the number of tasks is just a way um too many um"},{"id":175,"text":"okay and um and uh so and for the adaptation phase you know in 2021 i think we discussed a lot about"},{"id":176,"text":"like you know there are several different settings for um actually there are also different type of"},{"id":177,"text":"of pre-training algorithms."},{"id":178,"text":"We'll discuss a few of them."},{"id":179,"text":"Of course, the most obvious one is the next-world prediction"},{"id":180,"text":"laws with the large-language models."},{"id":181,"text":"But today, I think we're going to discuss a little more"},{"id":182,"text":"about adaptation first."},{"id":183,"text":"So for adaptation, the type signature"},{"id":184,"text":"is that there are two things you should discuss."},{"id":185,"text":"One thing is how much data I have to adapt to a new task"},{"id":186,"text":"and what type of data."},{"id":187,"text":"And another thing is what's the technology to adapt."},{"id":188,"text":"to adapt so maybe let's talk about data part right so the adaptation phase um"},{"id":189,"text":"in 2021 2022 i think people still care a lot about like this kind of like a you have a"},{"id":190,"text":"labeled data set a label downstream task downstream data set so you have like something like x task 1"},{"id":191,"text":"1, y, like you have these pairs, so you have n of these data points."},{"id":192,"text":"And they are labeled."},{"id":193,"text":"Why is the label?"},{"id":194,"text":"Actually, it's the inputs."},{"id":195,"text":"And if n is small, let's say 5 to 10 maybe,"},{"id":196,"text":"Then you call this few-shot."}],"notes":["本段主要讲解了基础模型的概念，即通过一个强大的基础模型，可以适应多种任务。讲者提到，基础模型的优势在于可以适应广泛的任务范围，而无需为每个任务单独训练模型。此外，还提到一些实际应用，如图像分类和目标检测，以及多任务学习的情况。"],"formulas":[],"uncertainties":["few-shot"],"diagram":"none","start":2487.09,"end":2657.06,"asr_flags":[191],"raw_segments":[{"start":2487.09,"text":"um you can adapt to many tasks adapt to a wide window to a wide range of tasks so so in some sense the key thing is that you you start with a very very you know i think that's the reason why it's called foundation model so you start with a very good foundation and then you can kind of like adapt to different tasks uh you never just directly go deal with one task before this mostly people are just say yeah i have image classification i just turn on image classification if i care about"},{"start":2517.28,"text":"object detection, I just turn on object detection."},{"start":2520.64,"text":"And some people actually do multitask."},{"start":2522.58,"text":"They say, I have three tasks, object detection, image classification,"},{"start":2526.22,"text":"maybe bounding box detection, all of this."},{"start":2529.14,"text":"And I turn these three tasks by only three."},{"start":2532.14,"text":"Here, the number of tasks is unlimited in some sense."},{"start":2535.98,"text":"Even the GPT paper probably have 100 tasks in the evaluation,"},{"start":2540.78,"text":"and sometimes even more than that."},{"start":2542.44,"text":"And now, it's even crazier."},{"start":2544.4,"text":"like you don't even have the sometimes notion of tasks is even you define just because you have so"},{"start":2549.26,"text":"many of them like you cannot even just distinguish what is the task what is not what is kind of like"},{"start":2553.88,"text":"a domain in some sense just basically like the number of tasks is just a way um too many um"},{"start":2561.72,"text":"okay and um and uh so and for the adaptation phase you know in 2021 i think we discussed a lot about"},{"start":2570.06,"text":"like you know there are several different settings for um actually there are also different type of"},{"start":2574.12,"text":"of pre-training algorithms."},{"start":2576.68,"text":"We'll discuss a few of them."},{"start":2578.64,"text":"Of course, the most obvious one is the next-world prediction"},{"start":2581.44,"text":"laws with the large-language models."},{"start":2584.54,"text":"But today, I think we're going to discuss a little more"},{"start":2586.52,"text":"about adaptation first."},{"start":2588.02,"text":"So for adaptation, the type signature"},{"start":2590.58,"text":"is that there are two things you should discuss."},{"start":2592.5,"text":"One thing is how much data I have to adapt to a new task"},{"start":2597.24,"text":"and what type of data."},{"start":2598.94,"text":"And another thing is what's the technology to adapt."},{"start":2602.12,"text":"to adapt so maybe let's talk about data part right so the adaptation phase um"},{"start":2609.36,"text":"in 2021 2022 i think people still care a lot about like this kind of like a you have a"},{"start":2616.3,"text":"labeled data set a label downstream task downstream data set so you have like something like x task 1"},{"start":2627.96,"text":"1, y, like you have these pairs, so you have n of these data points."},{"start":2643.14,"text":"And they are labeled."},{"start":2644.28,"text":"Why is the label?"},{"start":2644.98,"text":"Actually, it's the inputs."},{"start":2648.02,"text":"And if n is small, let's say 5 to 10 maybe,"},{"start":2655.92,"text":"Then you call this few-shot."}],"speech_gaps":[{"start":2646.08,"end":2647.62}],"frame":"../frames/v052/016.webp","frame_time":2499.09},{"title":"表示学习与零样本学习","segments":[{"id":197,"text":"So, and one of the real breakthroughs for GPT-3 is kind of like you don't have to actually do even a few shots sometimes. You can even do zero shot. So, and now at this moment, I think people mostly think about zero shot. You know, almost nobody collects in your downstream."},{"id":198,"text":"labels anymore to adapt your model."},{"id":199,"text":"You just do zero-shot."},{"id":200,"text":"Basically, zero-shot just means you don't even have to adapt."},{"id":201,"text":"In some sense, you just describe your tasks."},{"id":202,"text":"You say, this is my task, please solve it."},{"id":203,"text":"You don't have to collect any new data"},{"id":204,"text":"for the tasks, for the downstream tasks."},{"id":205,"text":"But in 2021, 2022, or maybe 2019, this is a few-shot,"},{"id":206,"text":"or maybe even more labeled downstream task"},{"id":207,"text":"is the more dominating approach."},{"id":208,"text":"So for example, you train a model,"},{"id":209,"text":"And then you say, I want to apply it"},{"id":210,"text":"to sentiment classification."},{"id":211,"text":"And then you collect a small data set, sentiment"},{"id":212,"text":"classification data set."},{"id":213,"text":"And then you fine-tune, or you haven't already defined"},{"id":214,"text":"fine-tune, but you fine-tune on this small data set,"},{"id":215,"text":"let's say sentiment classification data set."},{"id":216,"text":"And then your model can work on sentiment classification."},{"id":217,"text":"So that's the definition of few-shot learning."},{"id":218,"text":"learning."},{"id":219,"text":"And if you have any zero, then it's called zero-shot."},{"id":220,"text":"And then another thing is that, so whether in this adaptation,"},{"id":221,"text":"how do you update your parameters or not?"},{"id":222,"text":"So in this lecture and next lecture,"},{"id":223,"text":"I think I'm going to discuss those ideas where you actually"},{"id":224,"text":"do update the parameters with the data."},{"id":225,"text":"And later on, we're going to talk about those cases"},{"id":226,"text":"is where you don't have to even adapt to change your parameters."},{"id":227,"text":"You just prompt the model to adapt to the new tasks."},{"id":228,"text":"OK, so that's the high-level overview."},{"id":229,"text":"No, it's actually very simple, nothing complicated."},{"id":230,"text":"And you can try to formalize this,"},{"id":231,"text":"but it's kind of actually pretty trivial"},{"id":232,"text":"to write down some equations."},{"id":233,"text":"Basically, your pre-training, you have a loss function,"},{"id":234,"text":"maybe something like a pre-training loss function."},{"id":235,"text":"And for each data point, maybe you have data point i,"},{"id":236,"text":"you have some parameter theta, and your loss function"},{"id":237,"text":"is just the sum of the loss functions with the average."},{"id":238,"text":"The only thing is that for pre-training,"},{"id":239,"text":"there's no label."},{"id":240,"text":"And also, you have a very, very big in a pre-training."},{"id":241,"text":"And we're going to discuss what are the loss functions later."},{"id":242,"text":"later. So. Okay. Any questions so far? This is supposed to be a very high level and nothing"}],"notes":["本段主要讲解了表示学习中的零样本学习（zero-shot learning）和少样本学习（few-shot learning）的概念。零样本学习指的是在没有额外标注数据的情况下，直接让模型完成任务，而少样本学习则需要少量标注数据进行微调。课程中提到，GPT-3等模型在某些情况下可以实现零样本学习，即无需任何额外数据即可完成任务。","课程中还提到，在2019年到2022年之间，少样本学习是更主流的方法，即通过微调少量标注数据来适应新任务。例如，训练一个模型后，收集一个小型的情感分类数据集，并在该数据集上进行微调，使模型能够完成情感分类任务。","此外，课程还讨论了在适应过程中是否需要更新模型参数的问题。在接下来的课程中，将讨论需要更新参数的情况，而另一类情况则是不需要更新参数，而是通过提示（prompt）让模型直接适应新任务。","课程最后提到，表示学习的基本思想非常简单，可以通过一些简单的公式来形式化。例如，预训练阶段有一个损失函数，通常是一个预训练损失函数，每个数据点都有参数θ，损失函数是所有数据点损失函数的平均值。","预训练阶段通常没有标签，而且数据量非常大。课程还提到，将在后续讨论具体的损失函数形式。","最后，课程询问了学生是否有问题，强调了这些概念的高阶性和简单性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2661.88,"end":2833.03,"asr_flags":[218,220],"raw_segments":[{"start":2661.88,"text":"So, and one of the real breakthrough for GPT-3 is kind of like you don't have to actually do even a few shots sometimes. You can even do zero shot. So, and now at this moment, I think people mostly think about zero shot. You know, almost nobody collects in your downstream."},{"start":2678.97,"text":"labels anymore to adapt your model."},{"start":2681.51,"text":"You just do zero-shot."},{"start":2682.43,"text":"Basically, zero-shot just means you don't even have to adapt."},{"start":2684.75,"text":"In some sense, you just describe your tasks."},{"start":2687.73,"text":"You say, this is my task, please solve it."},{"start":2690.09,"text":"You don't have to collect any new data"},{"start":2693.03,"text":"for the tasks, for the downstream tasks."},{"start":2695.49,"text":"But in 2021, 2022, or maybe 2019, this is a few-shot,"},{"start":2700.45,"text":"or maybe even more labeled downstream task"},{"start":2702.69,"text":"is the more dominating approach."},{"start":2704.39,"text":"So for example, you train a model,"},{"start":2705.59,"text":"And then you say, I want to apply it"},{"start":2706.99,"text":"to sentiment classification."},{"start":2709.99,"text":"And then you collect a small data set, sentiment"},{"start":2713.23,"text":"classification data set."},{"start":2714.53,"text":"And then you fine-tune, or you haven't already defined"},{"start":2718.47,"text":"fine-tune, but you fine-tune on this small data set,"},{"start":2722.69,"text":"let's say sentiment classification data set."},{"start":2724.31,"text":"And then your model can work on sentiment classification."},{"start":2730.35,"text":"So that's the definition of few-shot learning."},{"start":2732.13,"text":"learning."},{"start":2732.39,"text":"And if you have any zero, then it's called zero-shot."},{"start":2736.31,"text":"And then another thing is that, so whether in this adaptation,"},{"start":2746.03,"text":"how do you update your parameters or not?"},{"start":2749.07,"text":"So in this lecture and next lecture,"},{"start":2752.41,"text":"I think I'm going to discuss those ideas where you actually"},{"start":2754.73,"text":"do update the parameters with the data."},{"start":2757.53,"text":"And later on, we're going to talk about those cases"},{"start":2759.97,"text":"is where you don't have to even adapt to change your parameters."},{"start":2763.39,"text":"You just prompt the model to adapt to the new tasks."},{"start":2769.19,"text":"OK, so that's the high-level overview."},{"start":2773.39,"text":"No, it's actually very simple, nothing complicated."},{"start":2779.07,"text":"And you can try to formalize this,"},{"start":2780.95,"text":"but it's kind of actually pretty trivial"},{"start":2783.93,"text":"to write down some equations."},{"start":2786.09,"text":"Basically, your pre-training, you have a loss function,"},{"start":2787.91,"text":"maybe something like a pre-training loss function."},{"start":2790.99,"text":"And for each data point, maybe you have data point i,"},{"start":2794.57,"text":"you have some parameter theta, and your loss function"},{"start":2796.79,"text":"is just the sum of the loss functions with the average."},{"start":2800.19,"text":"The only thing is that for pre-training,"},{"start":2802.85,"text":"there's no label."},{"start":2803.95,"text":"And also, you have a very, very big in a pre-training."},{"start":2810.99,"text":"And we're going to discuss what are the loss functions later."},{"start":2814.91,"text":"later. So. Okay. Any questions so far? This is supposed to be a very high level and nothing"}],"speech_gaps":[{"start":2728.336,"end":2729.95},{"start":2776.35,"end":2778.67}],"frame":"../frames/v052/017.webp","frame_time":2673.88},{"title":"表示学习的概念与应用","segments":[{"id":243,"text":"deep at all. So, but, yeah. Okay. So, and next, I'm going to discuss some of the somewhat"},{"id":244,"text":"generic way of doing the adaptation. So, especially with a label dataset. So, if you have a label"},{"id":245,"text":"data set, downstream data sets was the typical way to do that adaptation. And to introduce some"},{"id":246,"text":"of these ideas, we probably have to introduce this idea called representation learning,"},{"id":247,"text":"which is still kind of relevant in many cases right now. So representation learning is in some"},{"id":248,"text":"sense a special type of pre-training where you pre-train a representation."},{"id":249,"text":"You are portraying a model that represents the data."},{"id":250,"text":"So what that means is that your model is called phi,"},{"id":251,"text":"So what that means is that your model is called phi,"},{"id":252,"text":"So this maps the data into some m-dimensional vector."},{"id":253,"text":"And this vector, so I guess let's write this."},{"id":254,"text":"And this vector, so I guess let's write this."},{"id":255,"text":"and it outputs a vector in m-dimensional space. And this vector is called either representation,"},{"id":256,"text":"sometimes it's called feature, sometimes it's called embedding."},{"id":257,"text":"And you can design lots of functions that tune this kind of like representations,"},{"id":258,"text":"And you can design lots of functions that tune this kind of like representations,"},{"id":259,"text":"which we'll discuss next lecture."},{"id":260,"text":"And once you get this representation,"},{"id":261,"text":"you do some training where you get some,"},{"id":262,"text":"say you minimize some loss function."},{"id":263,"text":"Often the loss function is still like something like this,"},{"id":264,"text":"you know, some loss"},{"id":265,"text":"for the data point xi and theta."},{"id":266,"text":"And then this will give you some theta hat,"},{"id":267,"text":"which is a parameter that you obtain"},{"id":268,"text":"10 after the training. And then this theta hat will define a representation function,"},{"id":269,"text":"phi theta hat, which you can apply to get a vector out of any data point."},{"id":270,"text":"So, and then once you have the theta hat, which is a trained representation,"},{"id":271,"text":"then you can use it to solve a downstream task with linear hat."},{"id":272,"text":"So this is the concept of so-called linear probing."}],"notes":["本段介绍了表示学习的基本概念，即通过预训练模型来学习数据的表示。表示学习是一种特殊的预训练方式，其中模型将数据映射到一个m维向量空间中，这个向量被称为表示、特征或嵌入。"],"formulas":[],"uncertainties":["10 after the training"],"diagram":"none","start":2833.03,"end":3008.03,"asr_flags":[243],"raw_segments":[{"start":2833.03,"text":"deep at all. So, but, yeah. Okay. So, and next, I'm going to discuss some of the somewhat"},{"start":2854.53,"text":"generic way of doing the adaptation. So, especially with a label dataset. So, if you have a label"},{"start":2862.31,"text":"data set, downstream data sets was the typical way to do that adaptation. And to introduce some"},{"start":2870.83,"text":"of these ideas, we probably have to introduce this idea called representation learning,"},{"start":2879.33,"text":"which is still kind of relevant in many cases right now. So representation learning is in some"},{"start":2886.33,"text":"sense a special type of pre-training where you pre-train a representation."},{"start":2889.71,"text":"So you're not portraying a checked model like a checked GBT."},{"start":2894.05,"text":"You are portraying a model that represents the data."},{"start":2897.51,"text":"So what that means is that your model is called phi,"},{"start":2903.03,"text":"which is parametric by theta."},{"start":2904.73,"text":"So this maps the data into some m-dimensional vector."},{"start":2913.17,"text":"And this vector, so I guess let's write this."},{"start":2918.65,"text":"So you have a data point x, you tune a model, and this model is parametrized by some theta,"},{"start":2925.21,"text":"and it outputs a vector in m-dimensional space. And this vector is called either representation,"},{"start":2935.23,"text":"sometimes it's called feature, sometimes it's called embedding."},{"start":2944.01,"text":"And you can design lots of functions that tune this kind of like representations,"},{"start":2947.85,"text":"which we'll discuss next lecture."},{"start":2950.23,"text":"And once you get this representation,"},{"start":2952.41,"text":"you do some training where you get some,"},{"start":2955.07,"text":"say you minimize some loss function."},{"start":2962.15,"text":"Often the loss function is still like something like this,"},{"start":2964.59,"text":"you know, some loss"},{"start":2969.89,"text":"for the data point xi and theta."},{"start":2972.29,"text":"And then this will give you some theta hat,"},{"start":2975.17,"text":"which is a parameter that you obtain"},{"start":2976.91,"text":"10 after the training. And then this theta hat will define a representation function,"},{"start":2982.43,"text":"phi theta hat, which you can apply to get a vector out of any data point."},{"start":2988.75,"text":"So, and then once you have the theta hat, which is a trained representation,"},{"start":2992.97,"text":"then you can use it to solve a downstream task with linear hat."},{"start":3005.59,"text":"So this is the concept of so-called linear probing."}],"speech_gaps":[{"start":2958.72,"end":2961.712}],"frame":"../frames/v052/018.webp","frame_time":2845.03},{"title":"表示学习中的线性探针技术","segments":[{"id":273,"text":"And this is still a useful technique for mechanistic interpretability of large-language models. Even if you don't use it for solving the tasks, you can still use this as a way to interpret or understand to some degree how the large-language model works. But in the context of representation learning, linear probing is a way to even solve some downstream tasks. So what it means is that once you have this fixed embedding model or representation model, this is a vector."},{"id":274,"text":"And then you have a new so-called linear head. So the linear head is a vector w in the same space. And you take the inner product of the linear head with the so-called feature or the representation. And this is your prediction. And maybe sometimes you have to do a softmax if your prediction is classification. But this is the core model. So basically, you are just doing a linear model on top of a fixed representation."},{"id":275,"text":"And then you can just say, you know, if it's a regression, then you can just minimize, for example, say minimize over the linear head. You do one over and let's say you have n task number of examples for the downstream task. And you do a simple regression task, regression loss. Of course, you can also define analogously some of the other classification loss as well."},{"id":276,"text":"So here the theta hat is fixed, and this is a fixed vector. The only variables here is the w. You just want to learn w that fits your data as much as possible. So basically, this is just a very simple regression task once you are approaching the model. And people have realized that this is much better than just training."},{"id":277,"text":"hand crafting some features or just training a linear model on top of X task because the representation is actually a very good representation that captures some semantic information in the data. So basically, with data transformation,"},{"id":278,"text":"your y is not a linear function of the x. But now you transform it in a way such that you capture the important information linearly so that you can linearly combine your new features or representations and this prediction for y can be much more accurate. Yeah, of course. The representation. Yeah, I think that's a different, you know, I'll talk about it next time."}],"notes":["本段讲解了表示学习中线性探针技术的应用，强调了该技术在理解大型语言模型工作机制中的作用，即使不用于解决具体任务，也可以作为解释工具。同时，线性探针也被用于解决下游任务，通过在固定表示模型上添加线性头进行预测。","线性头是一个向量w，与表示空间中的特征或表示进行内积运算，得到预测结果。在分类任务中，可能需要使用softmax函数。整个模型的核心是在线性模型上进行训练，而表示模型是固定的。","在回归任务中，可以通过最小化线性头的损失函数来优化模型。对于分类任务，也可以定义类似的损失函数。这种技术比手动构建特征或直接在原始数据上训练线性模型更有效。","表示模型能够捕捉数据中的语义信息，因此通过数据转换，可以将非线性关系转化为线性关系，从而提高预测的准确性。这种转换使得线性组合的新特征或表示能够更准确地预测目标变量。","本段提到，表示模型的这种能力使得线性探针技术在表示学习中具有重要价值，但该技术的进一步讨论将在下节课中进行。","线性探针技术的核心在于利用已有的表示模型，通过简单的线性模型进行预测，从而在保持模型结构不变的情况下，提高模型的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3012.38,"end":3180.1,"asr_flags":[],"raw_segments":[{"start":3012.38,"text":"And this is still a useful technique for mechanistic interpretability of large-language models. Even if you don't use it for solving the tasks, you can still use this as a way to interpret or understand to some degree how the large-language model works. But in the context of representation learning, linear probing is a way to even solve some downstream tasks. So what it means is that once you have this fixed embedding model or representation model, this is a vector."},{"start":3041.58,"text":"And then you have a new so-called linear head. So the linear head is a vector w in the same space. And you take the inner product of the linear head with the so-called feature or the representation. And this is your prediction. And maybe sometimes you have to do a soft max if your prediction is classification. But this is the core model. So basically, you are just doing a linear model on top of a fixed representation."},{"start":3070.54,"text":"And then you can just say, you know, if it's a regression, then you can just minimize, for example, say minimize over the linear head. You do one over and let's say you have n task number of examples for the downstream task. And you do a simple regression task, regression loss. Of course, you can also define analogously some of the other classification loss as well."},{"start":3114.53,"text":"So here the theta hat is fixed, and this is a fixed vector. The only variables here is the w. You just want to learn w that fits your data as much as possible. So basically, this is just a very simple regression task once you are approaching the model. And people have realized that this is much better than just training."},{"start":3134.31,"text":"hand crafting some features or just training a linear model on top of X task because the representation is actually a very good representation that captures some semantic information in the data. So basically, with data transformation,"},{"start":3149.15,"text":"your y is not a linear function of the x. But now you transform it in a way such that you capture the important information linearly so that you can linearly combine your new features or representations and this prediction for y can be much more accurate. Yeah, of course. The representation. Yeah, I think that's a different, you know, I'll talk about it next time."}],"speech_gaps":[],"frame":"../frames/v052/019.webp","frame_time":3024.38},{"title":"表示学习的多模态与模型统一","segments":[{"id":279,"text":"Are the foundational models made for different domains? Things are changing over time. Three or four years ago, I think people have different techniques for different domains to some degree. But for vision, you learn the representations in one way, and for language, you learn the representation in another way. But now, more and more people are trying to get multi-model."},{"id":280,"text":"capabilities. So you want one model to be able to deal with both vision, language, maybe even videos. So then, in some sense, you have to have a unified approach. So I think in 2026, many of the models are, I think, people call it omni-model or multi-model model, which just means that you try to take in both the images and the text out of those in one model. What we're going to discuss"},{"id":281,"text":"uh we are still somewhat you know at least for one or two lectures we're still going to be domain specific i think in this kind of like this kind of thing probably happens more for um this representation learning happens more for vision domains um where you learn the visual representation first and then you apply your linear classification i think people are still using this for maybe uh medical imaging you first get the representation and then you apply"},{"id":282,"text":"the linear classification for many many different types of medical imaging tasks. You have a small data set for each of the imaging tasks and then you train a small linear head on top of that. But for the Frontier models and Frontier Labs, I think it's also a universal model that takes in everything. Does that make sense? One other way to adapt to a new task is so-called fine-tuning."},{"id":283,"text":"And the difference between linear probing and fine tuning in this context is just very simple. So here, you optimize only w, but not theta. But you can also optimize theta. So what you do is you say, I'm going to do the same thing. Maybe I'll just save some time to not rewrite the same equation. Let's say, let's use the color to change the, so you just do this, minimizing over."},{"id":284,"text":"the variable theta and then you say here this is not a fixed theta it's actually a variable theta"},{"id":285,"text":"you can you can vary and you also initialize your theta to say the hat so the initialized hat what"},{"id":286,"text":"you obtained before is your initializer and now and then after that you optimize both w and theta"},{"id":287,"text":"and and what is w initialized w is often initialized somewhat randomly um um you know"},{"id":288,"text":"And of course, there are still some variants about how"},{"id":289,"text":"do you exactly initialize it."}],"notes":["本段主要讨论表示学习在不同领域中的应用，以及多模态模型的发展趋势。讲者指出，过去不同领域使用不同的技术，但现在越来越多的研究者尝试构建能够处理多种模态（如视觉、语言、视频）的统一模型。这种模型被称为omni-model或multi-model model，其核心思想是将图像和文本等信息整合到一个模型中。","讲者提到，尽管多模态模型正在兴起，但在某些领域（如医学影像）仍然使用领域特定的方法。例如，先学习视觉表示，再在上面应用线性分类器。这种做法在医学影像任务中仍然被广泛使用，因为每个任务的数据集较小，且可以训练一个小型的线性头部。","在模型适应新任务的方法上，讲者区分了线性探针（linear probing）和微调（fine-tuning）。线性探针仅优化权重w，而微调则可以同时优化权重w和参数θ。讲者还提到，θ可以初始化为之前获得的值，然后在后续步骤中同时优化w和θ。","讲者指出，权重w通常被随机初始化，但具体的初始化方法仍有变体。这表明在实际应用中，初始化策略的选择对模型性能有重要影响。","讲者强调，尽管多模态模型是当前研究的热点，但领域特定的方法在某些情况下仍然有效。这反映了表示学习在不同应用场景中的灵活性和多样性。","最后，讲者提到初始化方法的变体，这表明在实际应用中，如何初始化模型参数是一个需要仔细考虑的问题。"],"formulas":[],"uncertainties":["the variable theta and then you say here this is not a fixed theta it's actually a variable theta","you can you can vary and you also initialize your theta to say the hat so the initialized hat what"],"diagram":"none","start":3181.5,"end":3355.62,"asr_flags":[],"raw_segments":[{"start":3181.5,"text":"Are the foundational models made for different domains? Things are changing over time. Three or four years ago, I think people have different techniques for different domains to some degree. But for vision, you learn the representations in one way, and for language, you learn the representatio 数和梯度占用更多内存，且其存储量可能是一个常数倍，如12或6倍。这表明在优化器中，动量的存储对内存使用有重要影响。"],"formulas":[],"uncertainties":["12","6","some constant factor"],"diagram":"none","start":4230.84,"end":4406.19,"asr_flags":[462],"raw_segments":[{"start":4230.84,"text":"So I guess just for some context,"},{"start":4233.46,"text":"what do you have to put in your memory"},{"start":4235.18,"text":"when you do gradient descent?"},{"start":4236.44,"text":"set."},{"start":4236.78,"text":"You have to put your parameters in the memory."},{"start":4239.66,"text":"You have to put a gradient in the memory, most likely."},{"start":4242.18,"text":"You have to put the momentum of the gradient in the memory."},{"start":4245.88,"text":"I guess we didn't discuss the momentum, which"},{"start":4248.28,"text":"is something that you have to keep track of in your optimizer."},{"start":4256.58,"text":"And typically, the gradient and the momentum"},{"start":4258.74,"text":"actually cost much more than the number of parameters."},{"start":4261.04,"text":"I think it's a factor of 12 or something."},{"start":4263.06,"text":"So basically, if your model weights cost D numbers,"},{"start":4268.8,"text":"then your gradient in the optimizer state on the momentum"},{"start":4273.22,"text":"is probably something like, is it really 12?"},{"start":4275.6,"text":"I forgot."},{"start":4275.98,"text":"Maybe 6, some constant factor, large enough constant factor"},{"start":4279.2,"text":"for you to care about."},{"start":4281.0,"text":"So yes, so for those things, you don't"},{"start":4283.32,"text":"have to save the momentum of the gradient for W0."},{"start":4285.76,"text":"You only have to save the momentum for AB."},{"start":4287.3,"text":"So that's why you save."},{"start":4292.2,"text":"However, the momentum and gradient, you know, I guess this is a level of our system."},{"start":4296.64,"text":"I think I don't expect everyone knows that."},{"start":4300.41,"text":"the gradient and momentum always sharded across GPUs for some scale when you have more than one GPU. So you never save the full gradient or the full momentum on each of the GPUs. So in this kind of parallelism, a typical kind of parallelism is called FSDP, data parallelism, where the"},{"start":4329.31,"text":"Model parameters are duplicated across GPU cards, but the gradient and the momentum are not duplicated across all GPU cards. The gradient and momentum, because they're too big, actually, you have to kind of like shard them. Shard them means like you store different blocks of..."},{"start":4347.69,"text":"on gradients on different GPUs."},{"start":4350.87,"text":"So in some sense, those are not always the bottleneck anyway."},{"start":4355.23,"text":"They are already sharded."},{"start":4356.43,"text":"So the saving here is, there are some saving,"},{"start":4361.05,"text":"but it's not like a day and night to some degree."},{"start":4366.51,"text":"So and what else?"},{"start":4370.55,"text":"I guess we talked about the compute, the memory,"},{"start":4375.57,"text":"memory, and also this depends on whether you are doing training"},{"start":4379.39,"text":"or inference."},{"start":4380.95,"text":"But I think all of the arguments are still largely true,"},{"start":4384.13,"text":"even for inference and training."},{"start":4386.51,"text":"In my opinion, one of the major savings for LoRa"},{"start":4390.27,"text":"is that there's one very most typical case"},{"start":4395.29,"text":"is that you just barely have enough memory to do this."},{"start":4404.29,"text":"so that any saving helps sometimes."}],"speech_gaps":[{"start":4289.04,"end":4291.8},{"start":4298.5,"end":4300.01},{"start":4364.304,"end":4366.11}],"frame":"../frames/v052/026.webp","frame_time":4242.84},{"title":"表示学习中的低秩适配（LoRa）","segments":[{"id":464,"text":"Because for example, sometimes you are very tight in memory."},{"id":465,"text":"And if you save even 10%, you actually"},{"id":466,"text":"can use one GPU as opposed to two GPUs."},{"id":467,"text":"That's one case that is really, really important."},{"id":468,"text":"But those are only when you have a very limited number of GPUs."},{"id":469,"text":"And another one that I think is very important case"},{"id":470,"text":"is that when you have this LoRa, you"},{"id":471,"text":"you can let multiple users to share the W0."},{"id":472,"text":"and save many many copies of the low rank part and this is in my opinion probably the main reason"},{"id":473,"text":"why for example if you look at the fine tuning services GPT and Gemini offers they only offer"},{"id":474,"text":"you fine tune for LoRa. So what that means is that you have like every user have like the shared W0"},{"id":475,"text":"this is probably GPT-4 right and then I go to chat GPT you know I go to GPT API and I say I"},{"id":476,"text":"I want to fine-tune."},{"id":477,"text":"And then GPT says, I'm going to do a low-rank update for me."},{"id":478,"text":"And then each of you actually have your own low-rank updates."},{"id":479,"text":"You have A2, B2, up to AK, BK."},{"id":480,"text":"And now the saving here matters because this part is shared."},{"id":481,"text":"Everyone has shared the same part."},{"id":482,"text":"And if each of us only costs another 100 million parameters,"},{"id":483,"text":"then maybe we can serve 1,000 of these users"},{"id":484,"text":"And it's still only probably 10 billion parameters."},{"id":485,"text":"But if each of us have to have a full matrix W,"},{"id":486,"text":"then it's too much memory."},{"id":487,"text":"So basically, this allows you to have multiple users low rank"},{"id":488,"text":"updates adapter in the same memory"},{"id":489,"text":"so that you can serve multiple users."},{"id":490,"text":"And you can actually swap between them very fast."},{"id":491,"text":"So in the inference time, you just say,"},{"id":492,"text":"If this user comes, I'm going to use this A1, B1. And if another user comes, I'm going to use A2, B2. I'm going to preload all of the users. Maybe not all of the users. I'm going to preload a large fraction of the user's adapters in the GPU so that I can swap between them very fast. And even if I don't preload them in the GPU memory, I can still load them from CPU."},{"id":493,"text":"And loading a small matrix, a low rank matrix, is much faster than loading the full matrix. So in my opinion, that's probably the major benefit of LoRa, which you can serve many, many users."}],"notes":["本段主要讲解了LoRa（低秩适配）在表示学习中的应用，特别是其在节省内存和允许多个用户共享基础权重W0方面的优势。讲者提到，通过仅存储低秩更新部分，可以显著减少内存占用，从而支持更多用户同时使用模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4406.37,"end":4550.72,"asr_flags":[],"raw_segments":[{"start":4406.37,"text":"Because for example, sometimes you are very tight in memory."},{"start":4411.81,"text":"And if you save even 10%, you actually"},{"start":4414.03,"text":"can use one GPU as opposed to two GPUs."},{"start":4415.93,"text":"That's one case that is really, really important."},{"start":4418.43,"text":"But those are only when you have a very limited number of GPUs."},{"start":4421.69,"text":"And another one that I think is very important case"},{"start":4424.91,"text":"is that when you have this LoRa, you"},{"start":4429.51,"text":"can let multiple users to share the W0."},{"start":4433.73,"text":"and save many many copies of the low rank part and this is in my opinion probably the main reason"},{"start":4439.93,"text":"why for example if you look at the fine tuning services GPT and Gemini offers they only offer"},{"start":4447.21,"text":"you fine tune for LoRa. So what that means is that you have like every user have like the shared W0"},{"start":4454.49,"text":"this is probably GPT-4 right and then I go to chat GPT you know I go to GPT API and I say I"},{"start":4463.09,"text":"I want to fine-tune."},{"start":4463.81,"text":"And then GPT says, I'm going to do a low-rank update for me."},{"start":4468.35,"text":"And then each of you actually have your own low-rank updates."},{"start":4471.09,"text":"You have ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
