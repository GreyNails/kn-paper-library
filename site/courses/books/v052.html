们将讨论大语言模型的后训练强化学习相关内容。这可能是一系列四到五节课的内容。在中间，我们还将","start":40.11,"end":61.43},{"id":3,"text":"talk about some of the RL stuff because you need the RL basics to even discuss how to use RL for large language models. Maybe in the meantime, we're going to talk about some of the robotics applications along the way as we define RL. That's pretty much the rest of the lectures. I think we have probably like another maybe like a...","zh":"讨论一些强化学习的内容，因为要讨论如何使用强化学习来处理大语言模型，你需要掌握强化学习的基础知识。同时，在我们定义强化学习的过程中，我们可能会讨论一些机器人应用。这基本上就是接下来的课程内容。我认为我们还有大概七、八节课。在中间，我认为会有一节课从系统视角来看待机器学习，这涉及如何使用GPU，以及如何思考这些问题。实际上，细节非常复杂。我们甚至无法全部涵盖。我认为即使一整门课程也不够。但我们有一节嘉宾讲座，讲述如何从系统视角来思考这些问题，这实际上非常重要，因为所有这些都涉及大规模系统。","start":61.85,"end":79.38},{"id":4,"text":"seven, eight lectures. And in the middle, I think there will be one lecture on the system perspective of machine learning, which is about how to use GPUs, how do you think about it. Actually, the details is very complicated. There is no way we can even. I think even one course is not enough. But we have a guest lecture on how to think about some of the system perspectives, which is actually quite important because all of these are massive scale.","zh":"七、八次讲座。在中间，我想会有一讲关于机器学习的系统视角，这讲是关于如何使用GPU，你怎么看待这个问题。实际上，细节是非常复杂的。我们甚至无法全部涵盖。我认为即使一整门课程也不够。但我们有一场特邀讲座，讲解如何思考一些系统视角的问题，这实际上非常重要，因为所有这些都是大规模的。","start":79.72,"end":106.88},{"id":5,"text":"I think we have like, I think you see, so Sarah, I think he's gonna, she's gonna give a guest lecture, yeah. So I think, right, so I think so far,","zh":"好的，所以这就是接下来课程的计划。好的，那么我们从扩散模型开始吧。我认为我们先回顾一下上周的内容。我们定义了扩散模型，正向和反向过程，对吧？所以正向过程大致是，你从一张干净的图像开始。正向过程是一系列添加噪声的步骤。你得到X1，X2，一直到 Xt，这将是一个从……","start":110.46,"end":128.28},{"id":6,"text":"Okay, so that's the plan for the rest of the lectures. Okay, so let's start with diffusion model. I think let's recall what we have done last week. We have defined the diffusion model, the forward and backwards, right? So the forward is kind of like, so you start from a clean image. The forward is kind of a bunch of like noising steps. You get X1, X2, up to Xt, which is going to be just something from...","zh":"好的，那么这就是接下来讲座的计划。好的，那么让我们从扩散模型开始。我想我们先回顾一下上周的内容。我们已经定义了扩散模型，包括前向和反向过程，对吧？所以前向过程有点像，你从一张干净的图像开始。前向过程就像是很多添加噪声的步骤。你得到X1，X2，一直到 Xt，这将是一个从……","start":130.56,"end":156.88},{"id":7,"text":"Standard normal Gaussian, and this direction is q, x1 given x0, q, xt given xt minus 1.","zh":"标准正态高斯分布，这个方向是 q，给定 x0 的 x1，给定 xt-1 的 xt。","start":157.77,"end":167.63},{"id":8,"text":"And we have a model that we parametrize for the reverse direction, which is p, theta, xt, minus 1 given xt.","zh":"我们有一个模型用于反向方向，即 p_theta 给定 xt 的 xt-1。","start":168.15,"end":178.17},{"id":9,"text":"And this is parametrized by a new artwork.","zh":"这个模型由一个新的艺术品参数化。","start":178.53,"end":180.91}],"notes":["本段提到扩散模型的反向过程由一个参数化模型pθ(xt-1|xt)进行建模，该模型通过新的艺术作品进行参数化。这里可能存在术语错误，'new artwork'可能应为'neural network'或其他相关术语，但无法确定具体含义，因此保留原词。"],"formulas":[],"uncertainties":["new artwork"],"diagram":"none","start":5.17,"end":180.91,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":5.17,"text":"Today, we are going to finish our discussion about diffusion models. And then we're going to move on to a sequence of lectures on foundation models, large-language model stuff. So today, we are going to talk about"},{"start":23.11,"text":"some of the general kind of like framework, the change of the paradigm, and some of the pre-ChatGPT or pre-GPT kind of like technology to some degree. We're gonna spend probably one lecture about what happened before GPT."},{"start":40.11,"text":"becomes the most popular, the dominating approach. And then we're going to talk about how do we train the autoregressive large language model, which is what GPT is about. And then we're going to talk about some of the post-training RL stuff for large language models. So this is probably a sequence of four or five lectures. And in the middle, we are also going to"},{"start":61.85,"text":"talk a aussian with some mu tilde t uh xt sorry not muted mu theta t","start":187.95,"end":195.55},{"id":12,"text":"mu theta","start":197.95,"end":198.43},{"id":13,"text":"xt t uh and with some covariance um","start":201.19,"end":207.37},{"id":14,"text":"Let me see whether I have, I think the covariance is assumed to be beta tilde t identity, right?","start":212.95,"end":220.59},{"id":15,"text":"So this is the parametrization for the reverse directions.","start":220.67,"end":224.11},{"id":16,"text":"And we also have established that if you maximize the log likelihood of p theta x0,","start":224.43,"end":232.23},{"id":17,"text":"which is the marginal distribution of x0 under the parametrization theta under the distribution p theta,","start":233.27,"end":240.43},{"id":18,"text":"you define through this process.","start":240.91,"end":242.31},{"id":19,"text":"And then there's an elbow lower bound, which is to simplify.","start":242.95,"end":247.55},{"id":20,"text":"So we skipped the details, but we got this.","start":247.87,"end":251.45},{"id":21,"text":"T free from 2 to T, KL between Q, xt minus 1 given xt, x0,","start":252.19,"end":266.23},{"id":22,"text":"and p theta xt minus one given xt.","start":266.23,"end":271.31},{"id":23,"text":"So, and","start":273.35,"end":274.47},{"id":24,"text":"minus KL between q xt","start":277.49,"end":282.51},{"id":25,"text":"given","start":282.51,"end":285.15},{"id":26,"text":"given 0, p theta xt plus expectation log p theta x0 given x1 to t.","start":288.51,"end":312.55},{"id":27,"text":"so last time we only focused","start":314.13,"end":316.05},{"id":28,"text":"we only had time to discuss this term","start":316.05,"end":317.91},{"id":29,"text":"this is a KL between two Gaussian distributions","start":317.91,"end":320.33},{"id":30,"text":"one of the Gaussian distributions is this one","start":320.33,"end":322.77},{"id":31,"text":"and the other Gaussian distribution I think","start":322.77,"end":324.75},{"id":32,"text":"probably if you recall","start":326.69,"end":327.73},{"id":33,"text":"the other Gaussian distribution is xt minus 1","start":327.73,"end":330.43},{"id":34,"text":"given xt x0","start":330.43,"end":333.25},{"id":35,"text":"this distribution is equal to","start":333.81,"end":338.05},{"id":36,"text":"to mu tilde t x t x zero","start":338.05,"end":345.31},{"id":37,"text":"with covariance beta t, beta tilde t.","start":345.95,"end":348.75}],"notes":["本段主要讲解了表示学习中模型的参数化方式，包括均值和协方差的设定。讲者提到均值为 mu theta t，协方差为 beta tilde t identity，这表明模型假设了高斯分布的参数形式。","讲者进一步说明了在反向方向的参数化方式，并提到通过最大化 log likelihood 来定义模型。这表明模型的训练目标是最大化数据的边缘分布的对数似然。","讲者提到 ELBO（证据下界）的简化形式，但跳过了细节。这表明 ELBO 是一个用于优化的下界，但具体推导过程未展开。","讲者讨论了 KL 散度在模型中的应用，特别是两个高斯分布之间的 KL 散度。这表明模型的训练过程涉及对 KL 散度的计算。","讲者提到 KL 散度的计算涉及两个高斯分布，其中一个是 mu tilde t xt x0，另一个是 xt-1 给定 xt x0。这表明模型的参数化方式与高斯分布的条件分布有关。","讲者提到协方差为 beta t 和 beta tilde t，这表明模型的协方差矩阵可能包含多个参数，用于描述不同时间步的分布特性。"],"formulas":[],"uncertainties":["mu tilde t xt x zero","beta t, beta tilde t"],"diagram":"none","start":180.91,"end":348.75,"asr_flags":[21,26],"math_clarifications":["KL散度的公式不完整，缺少了第二个分布的定义，且未明确说明其在条件分布下的形式，无法核定。","高斯分布的归一化形式未明确归一化常数的具体形式，且未说明 β_t 是协方差矩阵还是其逆，无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":180.91,"text":"work um i think precisely this model um i think the parameterization we had was something like"},{"start":187.95,"text":"n uh gaussian with some mu tilde t uh xt sorry not muted mu theta t"},{"start":197.95,"text":"mu theta"},{"start":201.19,"text":"xt t uh and with some covariance um"},{"start":212.95,"text":"Let me see whether I have, I think the covariance is assumed to be beta tilde t identity, right?"},{"start":220.67,"text":"So this is the parametrization for the reverse directions."},{"start":224.43,"text":"And we also have established that if you maximize the log likelihood of p theta x0,"},{"start":233.27,"text":"which is the marginal distribution of x0 under the parametrization theta under the distribution p theta,"},{"start":240.91,"text":"you define through this process."},{"start":242.95,"text":"And then there's an elbow lower bound, which is to simplify."},{"start":247.87,"text":"So we skipped the details, but we got this."},{"start":252.19,"text":"T free from 2 to T, KL between Q, xt minus 1 given xt, x0,"},{"start":266.23,"text":"and p theta xt minus one given xt."},{"start":273.35,"text":"So, and"},{"start":277.49,"text":"minus KL between q xt"},{"start":282.51,"text":"given"},{"start":288.51,"text":"given 0, p theta xt plus expectation log p theta x0 given x1 to t."},{"start":314.13,"text":"so last time we only focused"},{"start":316.05,"text":"we only had time to discuss this term"},{"start":317.91,"text":"this is a KL between two Gaussian distributions"},{"start":320.33,"text":"one of the Gaussian distributions is this one"},{"start":322.77,"text":"and the other Gaussian distribution I think"},{"start":326.69,"text":"probably if you recall"},{"start":327.73,"text":"the other Gaussian distribution is xt minus 1"},{"start":330.43,"text":"given xt x0"},{"start":333.81,"text":"this distribution is equal to"},{"start":338.05,"text":"to mu tilde t x t x zero"},{"start":345.95,"text":"with covariance beta t, beta tilde t."}],"speech_gaps":[],"frame":"../frames/v052/002.webp","frame_time":192.91},{"title":"表示学习中的KL散度与损失函数","segments":[{"id":38,"text":"And then we discussed that at the end of the last lecture, these are two Gaussian distributions. If you look at KL, it's actually just comparing the mean. Actually, we chose the variance to match. And that's why the KL between two Gaussian distributions is really just comparing the mean of the two distributions. So that's why if you call this term, I think notation we use is LT minus 1.","zh":"然后我们讨论了上一节课的结尾，这些是两个高斯分布。如果你看一下KL散度，实际上它只是在比较均值。实际上，我们选择方差来匹配。这就是为什么两个高斯分布之间的KL散度实际上只是在比较这两个分布的均值。这就是为什么如果你称这个项，我认为我们使用的记号是LT减1。","start":350.68,"end":373.58},{"id":39,"text":"there's different t's and we say this is the iot minus one and iot minus one is equals to basically comparing the mean of these two distributions is some expectation of one over two beta t tilde and you look at the mean the difference of the mean this is the mean for the q and the mean for the p theta is mu theta xt t","zh":"存在不同的t值，我们说这是iot减1，iot减1等于基本上比较这两个分布的均值，是某个关于一个二分之一beta t tilde的期望，你观察均值的差异，这是q分布的均值和p theta分布的均值mu theta xt t。","start":375.1,"end":404.75},{"id":40,"text":"And you do L2 norm squared. And this expectation is over Q, meaning that, strictly speaking, you are generating, because Xt is a random variable, you are generating Xt from Q. And for every realization or instantiation of Xt, you have","zh":"你计算L2范数的平方。并且这个期望是关于Q的，也就是说，严格来说，你在生成，因为Xt是一个随机变量，你从Q中生成Xt。并且对于每一个Xt的实现或实例，你都有","start":406.34,"end":429.39},{"id":41,"text":"two numbers, you compare them, you take the square and you average over the choice of x . So that's the loss function we derived formally from this lower bound. That's only one term or one sequence of terms. That's the term for L . And let's also discuss these two other terms very briefly. So this term is actually just zero because if you","zh":"两个数值，你比较它们，你取平方，然后在x的选择上进行平均。这就是我们从这个下界形式化推导出的损失函数。这只是其中一个项或一个项序列。这是L项。我们还简要讨论这两个其他项。这个项实际上只是0，因为如果你","start":429.84,"end":454.2},{"id":42,"text":"I guess I need to throw away this so that I don't get confused. So this term is just 0.","zh":"我想我需要扔掉这个，以免混淆。这个项只是0。","start":455.59,"end":464.66},{"id":43,"text":"because we assume that t is going to infinity and recall that pt, the distribution of pt assumes to be an entity, the standard normal distribution with mean zero and variance identity. And we established that when t goes to infinity, x t given x zero is also standard normal Gaussian because you add too much noise so that the noise just washes out the signal.","zh":"因为我们假设t趋于无穷大，并且回忆一下pt的分布，假设为一个实体，标准正态分布，均值为0，方差为单位矩阵。并且我们已经建立当t趋于无穷大时，给定x0的xt也是标准正态高斯分布，因为你添加了太多的噪声，使得噪声将信号完全掩盖。","start":466.24,"end":488.48},{"id":44,"text":"So that's why both of these are the standard normal Gaussian. They have the same distribution, and the KL is 0. So this is 0. Circuit-speaking, this is converging 0 as t goes to infinity. So we just assume it's 0. And this term is often, in literature, denoted as L1, because it actually does have almost the same term as all the other LT terms, even though","zh":"这就是为什么这两个都是标准正态高斯分布。它们具有相同的分布，KL散度为0。因此这个是0。从电路的角度来说，当t趋于无穷大时，它收敛于0。因此我们假设它是0。这个项在文献中通常记作L1，因为它实际上几乎与所有其他LT项具有相同的项，尽管","start":489.05,"end":512.44}],"notes":["本段讲解了KL散度在高斯分布之间的计算方式，指出KL散度仅比较两个分布的均值，而方差被设定为匹配。这表明在表示学习中，KL散度的计算主要关注均值差异，而非方差差异。","接着，讲者提到在计算KL散度时，需要考虑不同时间步t的差异，并指出该过程涉及对均值差异的期望计算，其中包含对1/(2β̃t)的期望。这表明KL散度的计算不仅涉及均值比较，还涉及时间步t的参数调整。","随后，讲者解释了L2范数平方的使用，强调该期望是基于分布Q的，意味着Xt是一个随机变量，需要从Q中生成。对于每个Xt的实现，都会计算均值差异的平方，并对所有Xt的实现进行平均，从而得到损失函数。","讲者还提到，当t趋于无穷大时，假设pt是标准正态分布，且Xt在给定X0的情况下也趋于标准正态分布，因为噪声的累积会“淹没”信号。这表明在表示学习中，随着时间步的增加，分布趋于平稳。","最后，讲者指出，当两个分布均为标准正态分布时，KL散度为0，因此该项可以忽略。同时，该项在文献中通常被标记为L1，因为它与其它LT项具有相似的结构，尽管在细节上可能有所不同。","这些内容展示了表示学习中如何通过KL散度和损失函数来建模分布之间的差异，并通过时间步的调整和噪声的累积来实现分布的收敛。"],"formulas":[],"uncertainties":["iot minus one","beta t tilde","circuit-speaking"],"diagram":"none","start":350.68,"end":512.44,"asr_flags":[],"math_clarifications":["KL散度不能仅通过比较均值来计算，应涉及对数概率密度函数的期望。原文中KL散度的计算方式不准确，需修正。","损失函数L的定义需更明确，包括其与KL散度的关系及具体分布条件。","当t趋于无穷大时，Xt|X0为标准正态分布，但未明确说明pt的分布，且未提及具体条件或假设。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":350.68,"text":"And then we discussed that at the end of the last lecture, these are two Gaussian distributions. If you look at KL, it's actually just comparing the mean. Actually, we chose the variance to match. And that's why the KL between two Gaussian distributions is really just comparing the mean of the two distributions. So that's why if you call this term, I think notation we use is LT minus 1."},{"start":375.1,"text":"there's different t's and we say this is the iot minus ula. So I think I will probably not go through all the details. But maybe let me show you a rough idea on how to derive this term. So sometimes, it's kind of like, eventually, you'll find out that it's almost the same as the LT minus 1 term. So basically, the first thing to deal with, so this is for L1.","zh":"比如，表面上看起来不同。但实际上，它们具有相同的公式形式。因此，我想可能不会详细讲解所有细节。但也许我可以向你们展示一个大致的思路，说明如何推导这个术语。有时候，你会发现它几乎与LT减1项相同。基本上，首先要处理的问题，这是针对L1的。","start":513.37,"end":540.19},{"id":46,"text":"So for L1, the first thing to realize is that P theta X0 given X1 to T, right? So this thing is the same as P0, PX0, P theta X0 given X1 because of the Markov property. You don't have to even look at any of the X2 up to XT if you condition X1. So that's what the Markov property tells us. And this...","zh":"因此，对于L1，首先要认识到的是P theta X0给定X1到T，对吧？这个东西等同于P0，PX0，因为P theta X0给定X1，这是由于马尔可夫性质。如果你已经条件在X1上，就不需要再考虑X2到XT了。这就是马尔可夫性质告诉我们的。而且这个……","start":541.75,"end":570.33},{"id":47,"text":"And then you can just choose. We haven't actually even specified the distribution p theta for x0 and x1. We have specified it for a larger t, but for x0 and x1, we haven't discussed it. We can just write this. We can make the same assumption. Let's say this is an","zh":"然后你就可以选择。我们实际上还没有明确指定x0和x1的分布p theta。我们已经为更大的t指定了分布，但对于x0和x1，我们还没有讨论过。我们只需写出这个。我们可以做出相同的假设。比如说，这是","start":570.8,"end":593.28},{"id":48,"text":"mu theta x1 1, say, sigma 1 squared. I think sigma 1 squared here is the virus.","zh":"mu theta x1 1，比如说，sigma 1平方。我认为这里的sigma 1平方是病毒。","start":593.85,"end":606.09},{"id":49,"text":"you know that you are just looking at the log likelihood of a Gaussian distribution. A log likelihood of a Gaussian distribution is pretty much just you take the log of the Gaussian distribution that has exponential in it. Once you take the log, it's just really what's inside exponential. So log of the density is really something like 1 over 2 sigma 1 squared x0 minus","zh":"你知道你只是在查看高斯分布的对数似然。高斯分布的对数似然是基本上取高斯分布的指数形式的对数。一旦你取对数，它就只是指数内部的内容。因此，密度的对数基本上是像1除以2 sigma 1平方乘以x0减去","start":608.08,"end":637.58},{"id":50,"text":"mu theta x1, 1 squared. And plus some constant term. This is just because if you take the exponential of this, it's the Gaussian density. And you take the log, this is the log. And you can see this term, and what is x0? So it turns out that if you do some calculation, you will find out that actually x0 is","zh":"mu theta x1，1的平方。再加上一个常数项。这仅仅是因为如果你取这个的指数，它就是高斯密度。然后你取对数，这就是对数。你可以看到这个项，x0是什么？结果发现，如果你做一些计算，你会发现实际上x0是","start":638.58,"end":663.81}],"notes":["本段讲解了在表示学习中，如何通过概率建模来处理时间序列数据。讲者提到，对于L1的情况，利用马尔可夫性质，可以将条件概率P(theta X0|X1到T)简化为P(theta X0|X1)，因为X1之后的变量X2到XT在条件X1下可以忽略。这体现了马尔可夫性质在时间序列建模中的重要性。","讲者进一步说明，虽然尚未明确指定x0和x1的分布p(theta)，但可以假设其服从高斯分布，其中mu(theta x1, 1)是均值，sigma1平方是方差。这里提到的sigma1平方被误认为是病毒，可能是听写错误，应为方差。","接着，讲者讨论了高斯分布的对数似然函数。对数似然函数是将高斯密度函数取对数后的结果，其形式为1/(2σ²)乘以(x0 - μ)^2加上常数项。这一步是推导过程中关键的数学转换。","讲者指出，对数似然函数中的关键项是(x0 - μ)^2，而x0的值需要通过进一步的计算来确定。这表明在表示学习中，变量之间的关系需要通过数学推导来明确。","整个过程展示了如何通过概率建模和数学推导来构建表示学习模型，特别是在处理时间序列数据时，如何利用马尔可夫性质和高斯分布的特性进行建模。","讲者强调了在表示学习中，对数似然函数的推导过程，以及如何通过数学转换来简化复杂的概率表达式。这为后续的模型训练和优化奠定了基础。"],"formulas":[],"uncertainties":["sigma 1 squared here is the virus"],"diagram":"none","start":513.37,"end":663.81,"asr_flags":[],"math_clarifications":["公式中的 'sigma 1 squared here is the virus' 表达不清晰，无法确定其数学含义。'mu theta x1 1' 的写法不规范，应为 \\mu_{\\theta}(x_1)。公式中未明确说明常数项 C 的来源，且未提及分布的归一化常数。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":513.37,"text":"like, on the surface, it looks different. But actually, they have the same form of the same formula. So I think I will probably not go through all the details. But maybe let me show you a rough idea on how to derive this term. So sometimes, it's kind of like, eventually, you'll find out that it's almost the same as the LT minus 1 term. So basically, the first thing to deal with, so this is for L1."},{"start":541.75,"text":"So for L1, the first thing to rea it is. So yeah. Any questions? So this is a fully implementable algorithm in a sense that you can just sample.","zh":"用 Xt 来重建 Xt-1。你希望你的重建能够匹配这一点。这基本上就是它的运作方式。所以是的。有没有问题？所以这是一个可以完全实现的算法，你只需要进行采样。","start":1066.92,"end":1092.98},{"id":89,"text":"So this expectation is over the randomness of Xt. So Xt is sample from Q. Sample Xt by choosing, by applying the noisy function, the noising process for t steps. And you get some Xt. And then you compute this, which is the linear combination of Xt and X0 by using this formula. And then you apply on your artwork and get this. You can call it the loss function. And you do back propagation. And you minimize the loss.","zh":"这个期望是针对 Xt 的随机性。Xt 是从 Q 中采样的。通过选择，通过应用噪声函数，进行 t 步的噪声过程，你会得到某个 Xt。然后你计算这个，即使用这个公式进行 Xt 和 X0 的线性组合。然后你将其应用在你的作品上，得到这个。你可以称之为损失函数。然后你进行反向传播，并最小化损失。","start":1094.75,"end":1121.49},{"id":90,"text":"So that's how you train this.","zh":"这就是如何训练这个模型的。","start":1123.4,"end":1126.98},{"id":91,"text":"And then next, I'm going to spend probably another five","zh":"接下来，我可能会花另外五分钟","start":1128.26,"end":1131.06},{"id":92,"text":"minutes to talk about how actually people do it","zh":"来谈谈实际上人们是如何进行这个过程的，只是对这个方法做了一点小小的修改。","start":1131.06,"end":1140.16},{"id":93,"text":"in practice with a slight modification of this.","zh":"在实践中进行这个过程的。","start":1140.16,"end":1143.12},{"id":94,"text":"So in practice, people actually also","zh":"所以实际上，在实践中，人们也会","start":1143.32,"end":1147.26},{"id":95,"text":"re-parameterize this a little bit.","zh":"对这个进行一点重新参数化。","start":1149.46,"end":1151.02},{"id":96,"text":"that, just to simplify the formula.","zh":"只是为了简化公式。","start":1151.02,"end":1154.1},{"id":97,"text":"So the trick is that, so this is probably what you see from most of the materials.","zh":"所以这个技巧是，这可能是你从大多数资料中看到的。","start":1154.56,"end":1162.8},{"id":98,"text":"So you can, actually I already gave that, I'm not sure whether I review it too fast.","zh":"所以你可以，实际上我之前已经讲过这个，我不确定我是不是讲得太快了。","start":1163.48,"end":1172.6},{"id":99,"text": nd the"},{"start":1066.92,"text":"Xt to reconstruct Xt-1. And you want your reconstruction to match that. And that's pretty much what it is. So yeah. Any questions? So this is a fully implementable algorithm in a sense that you can just sample."},{"start":1094.75,"text":"So this expectation is over the randomness of Xt. So Xt is sample from Q. Sample Xt by choosing, by applying the noisy function, the noising process for t steps. And you get some Xt. And then you compute this, which is the linear combination of Xt and X0 by using this formula. And then you apply on your artwork and get this. You can call it the loss function. And you do back propagation. And you minimize the loss."},{"start":1123.4,"text":"So that's how you train this."},{"start":1128.26,"text":"And then next, I'm going to spend probably another five"},{"start":1131.06,"text":"minutes to talk about how actually people do it"},{"start":1140.16,"text":"in practice with a slight modification of this."},{"start":1143.32,"text":"So in practice, people actually also"},{"start":1149.46,"text":"re-parameterize this a little bit."},{"start":1151.02,"text":"that, just to simplify the formula."},{"start":1154.56,"text":"So the trick is that, so this is probably what you see from most of the materials."},{"start":1163.48,"text":"So you can, actually I already gave that, I'm not sure whether I review it too fast."},{"start":1182.5,"text":"It's a little bit challenging because I think I need to remember exactly what we gave."}],"speech_gaps":[{"start":1175.408,"end":1177.36}],"frame":"../frames/v052/007.webp","frame_time":1021.42},{"title":"表示学习中的高斯条件分布推导","segments":[{"id":100,"text":"And with some repetition, I need to repeat some of the previous lectures, but not repeating","zh":"并且通过一些重复，我需要重复一些之前的课程内容，但不是全部重复","start":1187.12,"end":1191.54},{"id":101,"text":"everything.","zh":"所以这就是为什么有点令人困惑的原因","start":1191.54,"end":1191.84},{"id":102,"text":"So that's why it's a bit confusing.","zh":"因此，我认为我之前已经写过那里","start":1192.12,"end":1194.24},{"id":103,"text":"So I think I already wrote there.","zh":"那里","start":1194.7,"end":1196.62},{"id":104,"text":"there.","zh":"但是也许只是为了回忆，我认为上一次","start":1196.62,"end":1196.78},{"id":105,"text":"But maybe just to recall, I think last time,","zh":"我们肯定给出了这个 mu t tilde 的版本","start":1196.96,"end":1200.42},{"id":106,"text":"we definitely give this version of the mu t tilde.","zh":"所以我们给出的版本是，","start":1201.78,"end":1207.54},{"id":107,"text":"So the version that we give is that,","zh":"因此，我们给出的版本是，","start":1208.0,"end":1210.64},{"id":108,"text":"or maybe we didn't discuss this, I think, last time.","zh":"或者也许我们上次没有讨论过这个。","start":1211.2,"end":1213.54},{"id":109,"text":"OK, so maybe that's some of the people's confusion, right?","zh":"好的，所以也许这就是一些人的困惑所在，对吧？","start":1216.74,"end":1222.94},{"id":110,"text":"So how did we derive this formula for mu t tilde?","zh":"那么我们是如何推导出这个 mu t tilde 的公式的？","start":1222.94,"end":1225.74},{"id":111,"text":"So maybe let's discuss that a little bit.","zh":"所以也许我们可以稍微讨论一下这个问题。","start":1226.32,"end":1228.02},{"id":112,"text":"So how do we get this q x t minus 1 given x t and x 0?","zh":"那么我们是如何根据 x t 和 x 0 得到这个 q x t 减 1 的？","start":1229.08,"end":1234.64},{"id":113,"text":"So why this is a Gaussian, and how do we derive this?","zh":"那么为什么这是高斯分布，我们又是如何推导出这个的？","start":1235.48,"end":1237.68},{"id":114,"text":"The fundamental, the main reason is that","zh":"根本原因，主要原因在于","start":1240.28,"end":1242.1},{"id":115,"text":"Xt given X0 is Gaussian. And jointly Xt-1 given Xt given X0 is also Gaussian.","zh":"Xt 在 X0 的条件下是高斯分布的。并且 Xt-1 在 Xt 的条件下，同时在 X0 的条件下也是高斯分布的。","start":1242.96,"end":1252.33},{"id":116,"text":"And Xt minus 1 given X0 is also Gaussian. So everything given X0 is Gaussian. So in some sense, you just assume condition. You always condition your X0. Then Xt, the joint distribution, the marginal distribution, everything is Gaussian. So when everything is Gaussian, then all the conditional is also Gaussian. So basically, if the joint is Gaussian, then any conditional is Gaussian. So that's why both Xt minus 1 given Xt or Xt minus 1 are both Gaussian.","zh":"Xt-1给定X0也是高斯分布。因此，所有变量给定X0都是高斯分布。从某种意义上说，你只需假设条件。你总是以X0为条件。然后，Xt的联合分布、边缘分布，一切都是高斯分布。当一切都是高斯分布时，所有的条件分布也都是高斯分布。因此，如果联合分布是高斯分布，那么任何条件分布也都是高斯分布。这就是为什么Xt-1给定Xt或Xt-1都是高斯分布的原因。","start":1253.75,"end":1279.23},{"id":117,"text":"And you can actually, I think in election notes, we have some formulas for this. So basically, if you know A and B are jointly Gaussian,","zh":"实际上，我认为在讲义中，我们有一些关于这个的公式。基本上，如果你知道A和B是联合高斯分布的，","start":1279.57,"end":1286.05},{"id":118,"text":"And then you can have formulas for A given B and B given A. And what's the mean and variance for both of them? And you can just plug in that. So that's how you compute the mean and variance of this Q X T minus 1 given X T and X 0. So basically, you just say A is equal to this and B is equal to this. And you know A and B jointly is Gaussian. And you can plug in a formula for both of the two conditionals.","zh":"那么你就可以得到A给定B和B给定A的公式。它们的均值和方差是什么？你只需要代入这些公式即可。这就是你计算Q Xt-1给定Xt和X0的均值和方差的方法。基本上，你只需说A等于这个，B等于这个，并且你知道A和B是联合高斯分布的，然后你就可以代入两个条件分布的公式。","start":1288.12,"end":1313.76},{"id":119,"text":"And that's how we got the formula for mu t tilde x t x0. And it turns out that the formula is very simple. It's something like some linear combination of","zh":"这就是我们得到mu t tilde x t x0公式的途径。结果发现这个公式非常简单。它类似于某个关于","start":1314.85,"end":1330.24}],"notes":["本段讲解了在表示学习中，如何推导出条件分布q(x_{t-1} | x_t, x_0)的公式。讲者指出，由于X_t给定X_0是高斯分布，且X_{t-1}给定X_t和X_0也是高斯分布，因此所有条件分布都是高斯分布。这是因为在联合高斯分布下，任何条件分布也保持高斯性。","讲者进一步说明，当两个变量A和B是联合高斯分布时，可以通过已知的条件分布公式计算A给定B和B给定A的均值和方差。这为计算q(x_{t-1} | x_t, x_0)的均值和方差提供了理论依据。","讲者提到，在选举笔记中可能有相关的公式，可以用于计算条件分布的均值和方差。这表明在实际推导过程中，需要将变量A和B分别对应到x_{t-1}、x_t和x_0，并应用相应的条件分布公式。","讲者强调，所有条件分布的高斯性源于联合分布的高斯性，这在表示学习中是一个关键假设。因此，只要联合分布是高斯分布，所有条件分布也自然保持高斯性。","讲者指出，推导过程的关键在于理解条件分布的性质，并利用已知的条件分布公式进行计算。这为后续的表示学习模型设计提供了理论基础。","讲者最后提到，推导出的公式非常简单，是某些变量的线性组合。这表明在实际应用中，可以通过简单的线性运算得到条件分布的均值和方差。"],"formulas":[{"latex":"X_t | X_0 \\text{ is Gaussian}","symbols":"X_t给定X_0是高斯分布","explanation":"该公式正确描述了X_t在给定X_0时服从高斯分布，符合联合高斯分布的条件。","evidence":"Xt given X0 is Gaussian. And jointly Xt-1 given Xt given X0 is also Gaussian."},{"latex":"X_{t-1} | X_t, X_0 \\text{ is Gaussian}","symbols":"X_{t-1}给定X_t和X_0是高斯分布","explanation":"该公式正确描述了X_{t-1}在给定X_t和X_0时服从高斯分布，符合联合高斯分布的条件。","evidence":"Xt given X0 is Gaussian. And jointly Xt-1 given Xt given X0 is also Gaussian."},{"latex":"X_{t-1} | X_0 \\text{ is Gaussian}","symbols":"X_{t-1}给定X_0是高斯分布","explanation":"该公式正确描述了X_{t-1}在给定X_0时服从高斯分布，符合联合高斯分布的条件。","evidence":"Xt given X0 is Gaussian. And jointly Xt-1 given Xt given X0 is also Gaussian."},{"latex":"A \\text{ and } B \\text{ are jointly Gaussian}","symbols":"A和B是联合高斯分布","explanation":"该公式正确描述了A和B是联合高斯分布，符合联合高斯分布的条件。","evidence":"And you can actually, I think in election notes, we have some formulas for this. So basically, if you know A and B are jointly Gaussian,"},{"latex":"q(x_{t-1} | x_t, x_0) \\text{ is Gaussian}","symbols":"q(x_{t-1} | x_t, x_0)是高斯分布","explanation":"该公式正确描述了q(x_{t-1} | x_t, x_0)是高斯分布，符合联合高斯分布的条件。","evidence":"So how do we get this q x t minus 1 given x t and x 0? So why this is a Gaussian, and how do we derive this? The fundamental, the main reason is that Xt given X0 is Gaussian. And jointly Xt-1 given Xt given X0 is also Gaussian. And Xt minus 1 given X0 is also Gaussian. So everything given X0 is Gaussian. So in some sense, you just assume condition. You always condition your X0. Then Xt, the joint distribution, the marginal distribution, everything is Gaussian. So when everything is Gaussian, then all the conditional is also Gaussian. So basically, if the joint is Gaussian, then any conditional is Gaussian. So that's why both Xt minus 1 given Xt or Xt minus 1 are both Gaussian."}],"uncertainties":["election notes"],"diagram":"none","start":1187.12,"end":1330.24,"asr_flags":[],"math_clarifications":["所有公式均正确描述了高斯分布的条件，符合联合高斯分布的性质。"],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":1187.12,"text":"And with some repetition, I need to repeat some of the previous lectures, but not repeating"},{"start":1191.54,"text":"everything."},{"start":1192.12,"text":"So that's why it's a bit confusing."},{"start":1194.7,"text":"So I think I already wrote there."},{"start":1196.62,"text":"there."},{"start":1196.96,"text":"But maybe just to recall, I think last time,"},{"start":1201.78,"text":"we definitely give this version of the mu t tilde."},{"start":1208.0,"text":"So the version that we give is that,"},{"start":1211.2,"text":"or maybe we didn't discuss this, I think, last time."},{"start":1216.74,"text":"OK, so maybe that's some of the people's confusion, right?"},{"start":1222.94,"text":"So how did we derive this formula for mu t tilde?"},{"start":1226.32,"text":"So maybe let's discuss that a little bit."},{"start":1229.08,"text":"So how do we get this q x t minus 1 given x t and x 0?"},{"start":1235.48,"text":"So why this is a Gaussian, and how do we derive this?"},{"start":1240.28,"text":"The fundamental, the main reason is that"},{"start":1242.96,"text":"Xt given X0 is Gaussian. And jointly Xt-1 given Xt given X0 is also Gaussian."},{"start":1253.75,"text":"And Xt minus 1 given X0 is also Gaussian. So everything given X0 is Gaussian. So in some sense, you just assume condition. You always condition your X0. Then Xt, the joint distribution, the marginal distribution, everything is Gaussian. So when everything is Gaussian, then all the conditional is also Gaussian. So basically, if the joint is Gaussian, then any conditional is Gaussian. So that's why both Xt minus 1 given Xt or Xt minus 1 are both Gaussian."},{"start":1279.57,"text":"And you can actually, I think in election notes, we have some formulas for this. So basically, if you know A and B are jointly Gaussian,"},{"start":1288.12,"text":"And then you can have formulas for A given B and B given A. And what's the mean and variance for both of them? And you can just plug in that. So that's how you compute the mean and variance of this Q X T minus 1 given X T and X 0. So basically, you just say A is equal to this and B is equal to this. And you know A and B jointly is Gaussian. And you can plug in a formula for both of the two conditionals."},{"start":1314.85,"text":"And that's how we got the formula for mu t tilde x t x0. And it turns out that the formula is very simple. It's something like some linear combination of"}],"speech_gaps":[{"start":1238.08,"end":1239.88}],"frame":"../frames/v052/008.webp","frame_time":1199.12},{"title":"表示学习中的噪声建模与网络参数化","segments":[{"id":120,"text":"The coefficient is kind of complicated, but that's just some coefficient, some scalar. But fundamentally, it's just a linear combination of x0 and xt. And we recall that xt is, in our formula, xt is alpha bar t x0 plus 1 minus alpha bar t, or maybe beta bar t. I think we use 1 minus alpha bar t, plus 1 minus alpha bar t.","zh":"这个系数有点复杂，但只是某个系数，某个标量。但本质上，它只是x0和xt的线性组合。我们回忆一下，在我们的公式中，xt是alpha bar t乘以x0加上1减去alpha bar t，或者可能是beta bar t。我认为我们使用的是1减去alpha bar t，加上1减去alpha bar t。","start":1343.57,"end":1374.36},{"id":121,"text":"epsilon t hat. So you can, I think if you remember, we can rule out all of the noise so that we can add up all of the noise so that we add all the noise into one noise vector. And so then xt equals to some scaling of the original data plus a noise vector. And then you can plug in this to this so you can","zh":"epsilon t hat。因此，如果你记得，我们可以排除所有的噪声，使得我们可以将所有的噪声相加，从而将所有噪声合并成一个噪声向量。然后xt等于原始数据的某种缩放加上一个噪声向量。然后你可以将这个代入，从而","start":1375.37,"end":1395.29},{"id":122,"text":"basically replace Xt by, you can replace X0 by Xt because they're all linearly related so that you can get rid of X0 and you can get that formula. So you can get, if you plug this in and you can get this is equals to 1 over square root alpha t Xt minus beta t square root 1 minus alpha t bar epsilon t hat. And recall that epsilon t hat has this standard normal distribution.","zh":"基本上用Xt替换X0，因为它们都是线性相关的，因此你可以去掉X0，从而得到那个公式。因此，如果你代入这个表达式，你可以得到这个等于1除以根号alpha t乘以Xt减去beta t乘以根号1减去alpha t bar乘以epsilon t hat。并且我们回忆到epsilon t hat服从标准正态分布。","start":1395.84,"end":1433.6},{"id":123,"text":"is for different t, the epsilon t hat are not IAD, but they are correlated. But each of them has marginal distribution. So basically, this is my mu t hat, mu t tilde. We'll have some formula that only depends on x t, but not x0. It depends on x t and epsilon t. And then in practice, what people do is that people say, let me also parametrize my new right work, because x t is null. So in some sense,","zh":"对于不同的t，epsilon t hat不是独立同分布的，但它们是相关的。但每个都有边缘分布。因此，这基本上是我的mu t hat，mu t tilde。我们将有一些仅依赖于xt但不依赖于x0的公式。它依赖于xt和epsilon t。在实践中，人们会说，让我也参数化我的新网络，因为xt是空的。在某种意义上，","start":1435.36,"end":1459.6},{"id":124,"text":"Like, one option is I can just parametrize my, I can try to light my new network to directly predict this. That's what we are doing, right? But the RXT part is already known. So why not parametrize your network to also incorporate the part that you already knew? So that's why people say, oh, let me parametrize my new network with the same formula so that I...","zh":"比如，一个选择是，我可以直接参数化我的新网络来预测这个。这就是我们正在做的事情，对吧？但RXT部分已经是已知的。所以为什么不参数化你的网络来也包含你已经知道的部分呢？这就是为什么人们说，哦，让我用相同的公式参数化我的新网络，这样我……","start":1460.47,"end":1482.91},{"id":125,"text":"I don't have to match the part I already know. I just hard code the part I already know. So in your parameterization, you write the same thing. So 1 over alpha square alpha t xt minus beta t 1 over square root alpha t bar times epsilon theta xtt.","zh":"我不必匹配我已知的部分。我只需硬编码我已知的部分。因此，在你的参数化中，你写出同样的内容。即1除以alpha t的平方乘以xt减去beta t乘以1除以根号alpha t bar乘以epsilon theta xtt。","start":1483.44,"end":1502.88}],"notes":["本段讲解了表示学习中噪声建模的基本思想，即通过将所有噪声合并为一个噪声向量，从而简化模型。讲者提到xt是x0和噪声的线性组合，其中xt的表达式涉及alpha bar t和1减去alpha bar t的项，这表明噪声的引入是通过某种加权方式实现的。","讲者进一步说明，通过将xt与x0线性相关性进行替换，可以消除x0，从而得到一个仅依赖于xt和噪声的公式。该公式中，xt被缩放并加上一个噪声向量，而噪声向量服从标准正态分布。","讲者指出，不同时间步的噪声项虽然不是独立同分布的，但它们具有边际分布。这表明噪声的建模需要考虑时间相关性，但每个时间步的噪声仍具有独立的分布特性。","在实际应用中，讲者提到人们会尝试对网络进行参数化，以直接预测目标变量。但讲者强调，可以利用已知的部分（如RXT）来简化网络设计，避免重复建模。","讲者进一步说明，可以通过将网络参数化为与已知部分相同的公式，从而避免重复匹配已知部分。这种做法允许将已知部分硬编码到网络中，从而提高模型的效率。","最后，讲者给出一个具体的参数化公式，其中涉及1除以alpha t的平方根，以及beta t和1减去alpha bar t的项。该公式表明，网络的参数化需要考虑时间步t的特定参数，以确保模型的正确性。"],"formulas":[],"uncertainties":["1 over square root alpha t xt minus beta t 1 over square root alpha t bar times epsilon theta xtt"],"diagram":"none","start":1343.57,"end":1502.88,"asr_flags":[],"math_clarifications":["公式中未明确噪声项的分布，且符号如 \\tilde{\\boldsymbol{\\theta}}_t 未在上下文中定义，无法确认其含义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1343.57,"text":"The coefficient is kind of complicated, but that's just some coefficient, some scalar. But fundamentally, it's just a linear combination of x0 and xt. And we recall that xt is, in our formula, xt is alpha bar t x0 plus 1 minus alpha bar t, or maybe beta bar t. I think we use 1 minus alpha bar t, plus 1 minus alpha bar t."},{"start":1375.37,"text":"epsilon t hat. So you can, I think if you remember, we can rule out all of the noise so that we can add up all of the noise so that we add all the noise into one noise vector. And so then xt equals to some scaling of the original data plus a noise vector. And then you can plug in this to this so you can"},{"start":1395.84,"text":"basically replace Xt by, you can replace X0 by Xt because they're all linearly related so that you can get rid of X0 and you can get that formula. So you can get, if you plug this in and you can get this is equals to 1 over square root alpha t Xt minus beta t square root 1 minus alpha t bar epsilon t hat. And recall that epsilon t hat has this standard normal distribution."},{"start":1435.36,"text":"is for different t, the epsilon t hat are not IAD, but they are correlated. But each of them has marginal distribution. So basically, this is my mu t hat, mu t tilde. We'll have some formula that only depends on x t, but not x0. It depends on x t and epsilon t. And then in practice, what people do is that people say, let me also parametrize my new right work, because x t is null. So in some sense,"},{"start":1460.47,"text":"Like, one option is I can just parametrize my, I can try to light my new network to directly predict this. That's what we are doing, right? But the RXT part is already known. So why not parametrize your network to also incorporate the part that you already knew? So that's why people say, oh, let me parametrize my new network with the same formula so that I..."},{"start":1483.44,"text":"I don't have to match the part I already know. I just hard code the part I already know. So in your parameterization, you write the same thing. So 1 over alpha square alpha t xt minus beta t 1 over square root alpha t bar times epsilon theta xtt."}],"speech_gaps":[],"frame":"../frames/v052/009.webp","frame_time":1355.57},{"title":"表示学习中的噪声预测","segments":[{"id":126,"text":"So this is my new artwork. And then my mu theta is another composition of my new artworks with some other formulas, which is known. So I know this. I know this. So I'm just going to hard code it in my formula. And only the part I don't know, I'm going to use the new artwork to predict. And if you read parametrics this way, then you can see that mu tilde t xt x0 minus mu theta xt t, this loss function that we care about,","zh":"所以这是我新的艺术品。然后我的 mu theta 是由我的新艺术品和其他一些已知公式组成的另一个组合。我知道这一点。我知道这一点。所以我只是在我的公式中硬编码这部分。而我所不知道的部分，我将使用新的艺术品来进行预测。如果你这样理解参数化，那么你就能看到我们所关心的这个损失函数：mu tilde t 乘以 x0 减去 mu theta 乘以 xt t，","start":1504.36,"end":1534.21},{"id":127,"text":"if you subtract these two, you're going to cancel out everything. The only thing that you have is some scalar times the difference between the two epsilons. So this will be some scalar coefficient, which is beta t squared 2 beta t tilde 1 minus alpha t bar alpha t times the expectation.","zh":"如果你将这两个相减，你将会抵消掉所有内容。你唯一剩下的就是某个标量乘以两个 epsilon 的差值。因此，这将是一个标量系数，即 beta t 平方乘以 2 beta t tilde 1 减去 alpha t bar alpha t 的期望值。","start":1535.02,"end":1556.74},{"id":128,"text":"So basically, you're just comparing whether you can reconstruct a noise. Recall that what is epsilon hat t? This is the noise you added to get xt in the first place. And now you are saying, I'm going to use this new artwork to predict what was the noise I added in the first place. And if they can match, then you get perfect reconstruction.","zh":"基本上，你只是在比较是否能够重建噪声。回想一下，什么是 epsilon hat t？这是你在最初得到 xt 时所添加的噪声。现在你正在说，我要用这个新的艺术品来预测我最初添加的噪声是什么。如果它们能够匹配，那么你就能得到完美的重建。","start":1567.6,"end":1585.4},{"id":129,"text":"Yeah, so maybe noise kind of prediction. So basically, you turn this reconstruction into a noise prediction problem. And then people drop these coefficients and only focus on this. So it's a very clean formula. You just look at what is the noise you added, and then you try to use the network to predict the noise. And so basically, the algorithm eventually is simply the following.","zh":"是的，所以也许这就是噪声的预测。基本上，你将这种重建转化为一个噪声预测问题。然后人们会忽略这些系数，只关注这一点。因此，这是一个非常干净的公式。你只需查看你添加的噪声是什么，然后尝试用网络来预测噪声。因此，算法最终就是以下步骤。","start":1586.73,"end":1617.61},{"id":130,"text":"So finally, the training algorithm is just that your first sub 1, you sample some x0 from the data set, from training set. And then you sample t, a time step t, say uniformly from 1 to t.","zh":"最后，训练算法就是：你的第一个子步骤 1，你从数据集中，从训练集中采样一些 x0。然后你采样一个时间步 t，均匀地从 1 到 T 中选取。","start":1621.87,"end":1650.13},{"id":131,"text":"because you have a sum over all of these terms. So you sample one of the terms. It's kind of sarcastic. You really object to the sum of the T terms, capital T terms, and you sample one term. And when you sample one term, maybe this is the term you sampled. And then what you do is you say, I'm going to get epsilon high t from standard normal Gaussian. This is the noise I get. And then I construct Xt by this formula.","zh":"因为你对所有这些项求和。因此，你采样其中一个项。这有点讽刺意味。你真的反对对 T 项求和，大写 T 项，而你只采样一个项。当你采样一个项时，也许这就是你采样的那个项。然后你所做的就是，你说，我要从标准正态高斯分布中获取 epsilon high t。这是你得到的噪声。然后你通过这个公式构造 Xt。","start":1651.16,"end":1677.1}],"notes":["本段讲解了表示学习中噪声预测的核心思想，即通过网络预测添加的噪声来实现对数据的重建。讲者提到，通过比较预测的噪声与原始噪声，可以判断模型是否能够完美重建数据。"],"formulas":[],"uncertainties":["beta t squared 2 beta t tilde 1 minus alpha t bar alpha t"],"diagram":"none","start":1504.36,"end":1677.1,"asr_flags":[],"math_clarifications":["原始文本中提到的公式存在明显的转写错误，包括符号不一致、数学表达不清晰以及缺少必要的运算符。例如，'beta t squared 2 beta t tilde 1 minus alpha t bar alpha t' 中的 '2 beta t tilde 1' 和 'alpha t bar alpha t' 部分无法明确其数学含义，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1504.36,"text":"So this is my new artwork. And then my mu theta is another composition of my new artworks with some other formulas, which is known. So I know this. I know this. So I'm just going to hard code it in my formula. And only the part I don't know, I'm going to use the new artwork to predict. And if you read parametrics this way, then you can see that mu tilde t xt x0 minus mu theta xt t, this loss function that we care about,"},{"start":1535.02,"text":"if you subtract these two, you're going to cancel out everything. The only thing that you have is some scalar times the difference between the two epsilons. So this will be some scalar coefficient, which is beta t squared 2 beta t tilde 1 minus alpha t bar alpha t times the expectation."},{"start":1567.6,"text":"So basically, you're just comparing whether you can reconstruct a noise. Recall that what is epsilon hat t? This is the noise you added to get xt in the first place. And now you are saying, I'm going to use this new artwork to predict what was the noise I added in the first place. And if they can match, then you get perfect reconstruction."},{"start":1586.73,"text":"Yeah, so maybe noise kind of prediction. So basically, you turn this reconstruction into a noise prediction problem. And then people drop these coefficients and only focus on this. So it's a very clean formula. You just look at what is the noise you added, and then you try to use the network to predict the noise. And so basically, the algorithm eventually is simply the following."},{"start":1621.87,"text":"So finally, the training algorithm is just that your first sub 1, you sample some x0 from the data set, from training set. And then you sample t, a time step t, say uniformly from 1 to t."},{"start":1651.16,"text":"because you have a sum over all of these terms. So you sample one of the terms. It's kind of sarcastic. You really object to the sum of the T terms, capital T terms, and you sample one term. And when you sample one term, maybe this is the term you sampled. And then what you do is you say, I'm going to get epsilon high t from standard normal Gaussian. This is the noise I get. And then I construct Xt by this formula."}],"speech_gaps":[],"frame":"../frames/v052/010.webp","frame_time":1516.36},{"title":"表示学习中的噪声建模与训练算法","segments":[{"id":132,"text":"or consider the formula we had, which is a linear combination of x0 and the noise vector. And then I have a new artwork. So this is a new artwork, epsilon theta xtt. You apply a new artwork on your data. And then you define a loss function. The loss function, lt theta, is equals to.","zh":"或者考虑我们之前得到的公式，这是一个x0和噪声向量的线性组合。然后我有一个新的艺术品。所以这是一个新的艺术品，epsilon theta xtt。你将这个新的艺术品应用到你的数据上。然后你定义一个损失函数。损失函数，lt theta，等于。","start":1677.85,"end":1706.58},{"id":133,"text":"is epsilon hat t minus epsilon theta xt t. And then you minimize this. You take the gradient of this, and you update your parameter after that. And if you look at most of the materials, they actually don't even write epsilon t hat t, because in some sense, the indices doesn't really make any","zh":"是epsilon hat t减去epsilon theta xt t。然后你最小化这个。你对这个求梯度，然后在之后更新你的参数。如果你看一下大多数材料，他们实际上甚至不写epsilon t hat t，因为在某种意义上，索引并不会带来任何额外的区分能力。所以因为你可以直接写，你只需要采样epsilon。并且记号甚至不需要有索引。这就是为什么在大多数材料中，你只是说epsilon是从这个分布中采样的，然后你把这个epsilon加到这个数据上，然后这就是epsilon。因为无论如何，它是一个随机变量。你如何命名它并不重要。这就是训练算法。","start":1707.36,"end":1734.75},{"id":134,"text":"additional differentiation power. So because you can just even just write, you just sample epsilon. And the notation doesn't have to even have the index. So that's why in most of the materials, you just say epsilon is sample from this, and then you add epsilon to this, and then this is epsilon. Because anyway, it's a random variable. It doesn't really matter how you name it. So that's the training algorithm.","zh":"然后在你完成这个之后，你会得到这个模型，这个模型试图重建噪声。然后你将其应用于生成的方式就是你从右边的p theta运行到左边。基本上，采样意味着你首先从噪声中采样xt。","start":1736.36,"end":1761.25},{"id":135,"text":"And then after you turn this, you get this model, which is the model that is trying to reconstruct the noise. And then the way that you apply it to generate is just that you run this p theta from the right-hand side to the left-hand side. So basically, sampling just means that you first sample xt from the noise.","zh":"然后对于每一步，你首先计算。你已经有了theta，对吧？你计算epsilon theta在xtt上的值。然后你尝试使用一个公式来解码xt减1，这个公式就是你将噪声加回去。让我看看是否有一个，抱歉，我漏掉了一步。","start":1767.78,"end":1799.66},{"id":136,"text":"And then for each step, you first compute. You already have the theta, right? You compute epsilon theta on xtt. And then you try to decode xt minus 1 using a formula that you just add back the noise. So let me see whether there's a, sorry, I'm missing one step.","zh":"然后对于每一步，你首先进行计算。你已经有了theta，对吧？你计算epsilon乘以theta作用在xt上。然后你尝试使用一个公式来解码xt减1，这个公式就是你刚刚添加回去的噪声。让我看看是否有一个，抱歉，我漏掉了一步。","start":1801.17,"end":1839.13}],"notes":["本段讲解了表示学习中噪声建模的基本思想，即通过线性组合原始数据和噪声向量来构建模型。讲者提到，训练过程中会定义一个损失函数，该函数基于预测的噪声与真实噪声之间的差异。在实际操作中，由于索引并不增加额外的区分能力，因此通常省略索引，直接使用随机变量的名称进行表示。","讲者进一步说明了训练算法的步骤，包括计算梯度、更新参数以及如何通过采样噪声来生成数据。模型的目标是重构噪声，因此在生成过程中，需要从噪声分布中采样，并通过反向过程逐步恢复数据。","在具体实现中，讲者提到在每一步都需要计算噪声项，并使用该噪声项来解码前一步的数据。然而，讲者似乎在最后一步中遗漏了一个步骤，这可能涉及到如何从噪声中恢复数据的具体细节。","讲者强调了在表示学习中，噪声的建模和采样是关键步骤，因为噪声的引入和重构能够帮助模型学习数据的潜在结构。同时，讲者指出，由于噪声是随机变量，其名称并不影响模型的训练过程。","此外，讲者还提到，在大多数材料中，噪声的索引通常被省略，因为其名称并不影响模型的训练效果。这种简化有助于提高模型的可读性和实现的便捷性。","最后，讲者指出，生成过程的核心在于从噪声分布中采样，并通过反向过程逐步恢复数据。这一过程需要精确的数学建模和实现，以确保生成的数据能够准确反映原始数据的结构。"],"formulas":[],"uncertainties":["epsilon hat t","epsilon theta xtt","epsilon theta on xtt"],"diagram":"none","start":1677.85,"end":1839.13,"asr_flags":[],"math_clarifications":["损失函数L_t(θ)应明确其形式，如均方误差，且符号应统一为\\hat{\\epsilon}_t和\\epsilon_\\theta(x_{tt})。","解码过程应通过添加噪声来恢复前一步数据，而非直接减去噪声，因此公式应为x_{t-1} = x_t + \\epsilon_\\theta(x_{tt})。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1677.85,"text":"or consider the formula we had, which is a linear combination of x0 and the noise vector. And then I have a new artwork. So this is a new artwork, epsilon theta xtt. You apply a new artwork on your data. And then you define a loss function. The loss function, lt theta, is equals to."},{"start":1707.36,"text":"is epsilon hat t minus epsilon theta xt t. And then you minimize this. You take the gradient of this, and you update your parameter after that. And if you look at most of the materials, they actually don't even write epsilon t hat t, because in some sense, the indices doesn't really make any"},{"start":1736.36,"text":"additional differentiation power. So because you can just even just write, you just sample epsilon. And the notation doesn't have to even have the index. So that's why in most of the materials, you just say epsilon is sample from this, and then you add epsilon to this, and then this is epsilon. Because anyway, it's a random variable. It doesn't really matter how you name it. So that's the training algorithm."},{"start":1767.78,"text":"And then after you turn this, you get this model, which is the model that is trying to reconstruct the noise. And then the way that you apply it to generate is just that you run this p theta from the right-hand side to the left-hand side. So basically, sampling just means that you first sample xt from the noise."},{"start":1801.17,"text":"And then for each step, you first compute. You already have the theta, right? You compute epsilon theta on xtt. And then you try to decode xt minus 1 using a formula that you just add back the noise. So let me see whether there's a, sorry, I'm missing one step."}],"speech_gaps":[],"frame":"../frames/v052/011.webp","frame_time":1689.85},{"title":"表示学习中的扩散模型","segments":[{"id":137,"text":"So you compute this, and then you compute the mu theta using the formula that we had. So mu theta is just a linear combination of x, t, and epsilon.","zh":"因此，你计算这个值，然后使用我们之前得到的公式计算 mu theta。所以 mu theta 只是 x、t 和 epsilon 的线性组合。","start":1840.49,"end":1864.59},{"id":138,"text":"I guess I'm still rewriting that equation. And you get a mu theta, which is your prediction for the Xt minus 1, the mean of the prediction of Xt minus 1. And then you just say, I'm going to take Xt minus 1 is equals to the mean plus some noise. Because even the reverse process still has some noise, where the noise is sample from 0 and 0.","zh":"我想我仍在重写这个方程。你得到一个 mu theta，这是你对 Xt 减 1 的预测的均值。然后你只需说，我将 Xt 减 1 等于均值加上一些噪声。因为即使反向过程仍然有一些噪声，其中噪声是从 0 和 0 中采样的。","start":1868.01,"end":1893.03},{"id":139,"text":"I guess sigma t is the variance you chose. I think in our cases, we chose sigma t to be square root beta tilde t. We already chose that. So strictly speaking here, I should write square root. If I already chose that, I would choose this to be square root beta tilde. Sounds good. Any questions? I think we have discussed why diffusion model works better. They are not kind of like a...","zh":"我想 sigma t 是你选择的方差。我认为在我们的案例中，我们选择 sigma t 为根号 beta tilde t。我们已经选择了这一点。严格来说，这里我应该写根号。如果我已经选择了这一点，我会选择这个为根号 beta tilde。听起来不错。有问题吗？我想我们已经讨论过为什么扩散模型表现更好。它们并不是一种……","start":1894.6,"end":1942.86},{"id":140,"text":"very strong theory to prove everything. But generally speaking, I think the main intuition is that one thing is that in one direction of this process is known. It's a fixed noising function so that you don't have to parametrize both the forward and backward. So that seems to make the optimization and everything much easier because before people have tried to","zh":"非常强的理论来证明一切。但总的来说，我认为主要的直觉是，这个过程的一个方向是已知的。它是一个固定的加噪函数，因此你不需要同时参数化正向和反向过程。这似乎使优化和一切变得更容易，因为在以前人们尝试使用参数化函数来处理两边。当然，代价是你必须将时间线拉长。因此，t 实际上很大。开始是 1,000。但我想这实际上是有好处的，因为当你拉长时间线，","start":1943.21,"end":1966.99},{"id":141,"text":"use parametric functions for both sides. Of course, the cost is that you have to stretch the timeline to be longer. So the t is actually big. So beginning is 1,000. But I think that actually has a benefit because when you stretch the timeline,","zh":"使用参数化函数来处理两边。当然，代价是你必须将时间线拉长。因此，t 实际上很大。开始时是 1,000。但我认为这实际上是有好处的，因为当你拉长时间线时，","start":1967.31,"end":1981.01},{"id":142,"text":"the reconstruction becomes locally easy. Each step, you just have to remove a little bit of noise. So basically, at the beginning, you just have a purely white noise image. And then you just have to remove slightly noise to make it slightly, like have some kind of slight signal. And then you try to make it sharper and sharper.","zh":"重建过程变得局部上更容易。每一步，你只需要去除一点点噪声。基本上，在开始时，你只是一个纯白噪声图像。然后你只需要去除一点点噪声，使其稍微具有某种信号。然后你尝试让它越来越清晰。","start":1982.36,"end":2001.34}],"notes":["本段讲解了扩散模型中如何通过逆过程进行图像重建。在逆过程中，每个步骤都从噪声中逐步去除，以恢复原始图像。模型通过将噪声逐步减少，使得每一步的重建变得相对容易。","讲者提到，在扩散模型中，噪声的方差σ_t通常被设定为β_t的平方根。这表明在模型设计中，噪声的引入和去除是通过特定的参数化方式来实现的，而不是随机选择。","讲者指出，扩散模型的一个关键优势是其单向过程的确定性。由于前向过程是固定的，因此不需要同时参数化正向和反向过程，这简化了优化问题。","讲者提到，为了使重建过程更容易，通常会将时间步t设置得较大，例如从1000开始。这使得每一步的噪声去除更加平滑，从而提高重建质量。","在逆过程中，初始状态是一个纯白噪声图像，随后通过逐步去除噪声，逐步恢复图像的细节。这种逐步去噪的过程使得模型能够逐步增强图像的清晰度。","讲者强调，扩散模型的直观理解是其在逆过程中的确定性，这使得模型在优化和实现上更加高效，尽管目前尚无完整的理论证明其有效性。"],"formulas":[],"uncertainties":["beta tilde t 的具体定义和使用方式未明确说明","在讲者提到的 'stretch the timeline' 中，具体如何影响模型性能未详细说明"],"diagram":"none","start":1840.49,"end":2001.34,"asr_flags":[],"math_clarifications":["原文中提到的噪声分布和方差未明确，且未说明噪声的生成方式，因此无法核定公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1840.49,"text":"So you compute this, and then you compute the mu theta using the formula that we had. So mu theta is just a linear combination of x, t, and epsilon."},{"start":1868.01,"text":"I guess I'm still rewriting that equation. And you get a mu theta, which is your prediction for the Xt minus 1, the mean of the prediction of Xt minus 1. And then you just say, I'm going to take Xt minus 1 is equals to the mean plus some noise. Because even the reverse process still has some noise, where the noise is sample from 0 and 0."},{"start":1894.6,"text":"I guess sigma t is the variance you chose. I think in our cases, we chose sigma t to be square root beta tilde t. We already chose that. So strictly speaking here, I should write square root. If I already chose that, I would choose this to be square root beta tilde. Sounds good. Any questions? I think we have discussed why diffusion model works better. They are not kind of like a..."},{"start":1943.21,"text":"very strong theory to prove everything. But generally speaking, I think the main intuition is that one thing is that in one direction of this process is known. It's a fixed noising function so that you don't have to parametrize both the forward and backward. So that seems to make the optimization and everything much easier because before people have tried to"},{"start":1967.31,"text":"use parametric functions for both sides. Of course, the cost is that you have to stretch the timeline to be longer. So the t is actually big. So beginning is 1,000. But I think that actually has a benefit because when you stretch the timeline,"},{"start":1982.36,"text":"the reconstruction becomes locally easy. Each step, you just have to remove a little bit of noise. So basically, at the beginning, you just have a purely white noise image. And then you just have to remove slightly noise to make it slightly, like have some kind of slight signal. And then you try to make it sharper and sharper."}],"speech_gaps":[],"frame":"../frames/v052/012.webp","frame_time":1852.49},{"title":"表示学习与网络表示","segments":[{"id":143,"text":"At the beginning, probably, you only have to get the contour and the rough idea of the image. And then gradually, you sharpen, so on and so forth. So in some sense, you add more and more details through this process. And each of the local steps is somewhat easier to learn. And that's how you make it kind of like, eventually, everything is about how easy it is to learn this. Fundamentally,","zh":"一开始，你可能只需要获取图像的轮廓和大致想法。然后逐渐地，你细化，如此这般。因此，在某种意义上，你通过这个过程逐步添加更多的细节。而每一个局部步骤的学习都相对更容易。这就是你最终让一切变得容易学习的方式。从根本上来说，","start":2001.96,"end":2025.4},{"id":144,"text":"You should be able to use networks to represent everything. But how do you represent still matters. And how do you learn matters. And this is a way to decompose the big generation task into smaller steps so you can learn more efficiently. OK, great. So if there's no other questions, I'm going to use the rest of the lectures to talk about as a kind of overview for some of the foundation model stuff.","zh":"你应该能够用网络来表示一切。但如何表示仍然很重要。而如何学习也同样重要。这是一种将大生成任务分解为更小步骤的方法，以便更高效地学习。好的，很好。如果没有其他问题，我将用剩下的讲座时间来介绍一些基础模型内容的概述。","start":2026.22,"end":2062.5},{"id":145,"text":"So, um, sure, of course.","zh":"嗯，当然，当然。","start":2064.42,"end":2068.27},{"id":146,"text":"Oh I didn't write it explicitly so yeah so that's a good question so basically once I define a loss function everything is computed right so computable so I have a new network this is known this is unknown and I can apply it and define it in PyTorch and then you you compute the gradient of this and you take one step one gradient step update you can you can use item you know gradient descent so on and so forth yep any other questions","zh":"哦，我没有明确写出这一点，是的，所以这是一个好问题。基本上，一旦我定义了一个损失函数，一切都可以计算出来，因此是可计算的。我有一个新的网络，这是已知的，这是未知的，我可以应用它并在PyTorch中定义它，然后你计算这个的梯度，进行一次梯度更新，你可以使用梯度下降等方法，如此等等。是的，还有其他问题吗？","start":2086.59,"end":2113.74},{"id":147,"text":"For this lecture, yes. I think in some of the other lectures, we spend more time on how to compute the gradient, for example. So there's one lecture that is entirely about how to compute a gradient. You have to apply those back propagation, auto differentiation here, because how to compute a gradient here, you have to apply the same thing. And I think in Chris' lectures, I think he talked about SGD, and I think I also mentioned some of the SGD stuff. So those are...","zh":"对于这节课，是的。我想在一些其他课程中，我们花更多时间在如何计算梯度上，例如。有一节课完全是关于如何计算梯度的。你必须应用反向传播和自动微分，因为在这里如何计算梯度，你必须应用同样的方法。我想在Chris的课程中，他谈到了随机梯度下降（SGD），我想我也提到了一些SGD的内容。所以这些是……","start":2120.76,"end":2145.52},{"id":148,"text":"Yeah, those are also needed. It's a whole stack. There are so many components. And yes, if you have a new application, a new algorithm, then often it's on the loss level. But you could also innovate on the optimizer level, say replacing SGD by some other optimizer, so on and so forth. And then those changes are often universal. You can apply it for...","zh":"是的，这些也是需要的。这是一个完整的堆栈。有如此多的组件。是的，如果你有一个新的应用或新算法，通常是在损失层上进行创新。但你也可以在优化器层上进行创新，例如用其他优化器替代SGD，如此等等。然后这些变化通常是通用的。你可以应用它在……","start":2146.65,"end":2171.79}],"notes":["本段主要讲解了如何通过定义损失函数来构建网络，并通过梯度下降进行参数更新。讲者提到，一旦定义了损失函数，整个计算过程就变得可计算，可以使用PyTorch等工具进行实现。同时，讲者指出，梯度的计算需要应用反向传播和自动微分技术，这在后续的课程中会更详细地讲解。","讲者还提到，梯度下降（SGD）是常用的优化方法，但也可以替换为其他优化器。这些优化方法的改进通常具有通用性，可以应用于不同的任务和算法中。","在讲解过程中，讲者强调了损失函数的重要性，指出在新应用或新算法中，通常是在损失函数层面进行创新，但优化器层面的改进同样重要。","讲者提到，整个流程涉及多个组件，包括损失函数、优化器等，这些组件构成了一个完整的堆栈。因此，理解每个组件的作用对于构建有效的模型至关重要。","此外，讲者还提到，梯度的计算需要应用反向传播和自动微分技术，这在后续的课程中会更详细地讲解。","最后，讲者指出，这些技术的改进通常具有通用性，可以应用于不同的任务和算法中，因此理解这些基础概念对于掌握表示学习至关重要。"],"formulas":[],"uncertainties":["item"],"diagram":"none","start":2001.96,"end":2171.79,"asr_flags":[],"math_clarifications":["原文中提及的梯度下降、反向传播和自动微分均为概念性描述，未提供具体数学公式，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2001.96,"text":"At the beginning, probably, you only have to get the contour and the rough idea of the image. And then gradually, you sharpen, so on and so forth. So in some sense, you add more and more details through this process. And each of the local steps is somewhat easier to learn. And that's how you make it kind of like, eventually, everything is about how easy it is to learn this. Fundamentally,"},{"start":2026.22,"text":"You should be able to use networks to represent everything. But how do you represent still matters. And how do you learn matters. And this is a way to decompose the big generation task into smaller steps so you can learn more efficiently. OK, great. So if there's no other questions, I'm going to use the rest of the lectures to talk about as a kind of overview for some of the foundation model stuff."},{"start":2064.42,"text":"So, um, sure, of course."},{"start":2086.59,"text":"oh i didn't write it explicitly so yeah so that's a good question so basically once i define a loss function everything is computed right so computable so i have a new network this is known this is unknown and i can apply it and define it in pytorch and then you you compute the gradient of this and you take one step one gradient step update you can you can use item you know gradient descent so on and so forth yep any other questions"},{"start":2120.76,"text":"For this lecture, yes. I think in some of the other lectures, we spend more time on how to compute the gradient, for example. So there's one lecture that is entirely about how to compute a gradient. You have to apply those back propagation, auto differentiation here, because how to compute a gradient here, you have to apply the same thing. And I think in Chris' lectures, I think he talked about SGD, and I think I also mentioned some of the SGD stuff. So those are..."},{"start":2146.65,"text":"Yeah, those are also needed. It's a whole stack. There are so many components. And yes, if you have a new application, a new algorithm, then often it's on the loss level. But you could also innovate on the optimizer level, say replacing SGD by some other optimizer, so on and so forth. And then those changes are often universal. You can apply it for..."}],"speech_gaps":[{"start":2070.8,"end":2072.304},{"start":2073.264,"end":2076.336},{"start":2079.664,"end":2082.96},{"start":2114.736,"end":2118.992}],"frame":"../frames/v052/013.webp","frame_time":2013.96},{"title":"表示学习与基础模型","segments":[{"id":149,"text":"If you change the optimizer, you can do it for diffusion models. You can do it for large-language models. You can do it for maybe linear regression as well. So those are on a different layer. But generally, I think for the rest of the lectures, we are mostly talking about the data, the architecture, the loss function, and the training procedure, not much anymore about computing gradients and how to update gradients. You just assume once you define a loss function, you can optimize it.","zh":"如果你更换优化器，你可以在扩散模型中这么做。你也可以在大型语言模型中这么做。你甚至可能在线性回归中这么做。因此，这些属于不同的层次。但总的来说，我认为在接下来的课程中，我们主要讨论的是数据、架构、损失函数和训练过程，不再过多涉及计算梯度和如何更新梯度。你只需假设一旦定义了损失函数，就可以对其进行优化。","start":2172.08,"end":2209.76},{"id":150,"text":"Cool. So I think now let's talk about a foundation model. I think this is a term that actually is a term that is kind of coined by one of the papers that many of the Stanford people wrote about now probably about like five years ago, maybe four or five years ago.","zh":"很好。我认为现在让我们谈谈基础模型。我认为这是一个术语，实际上是由一些论文中提出的，这些论文可能是斯坦福的一些人五年前左右写的，可能四到五年前。","start":2210.7,"end":2235.88},{"id":151,"text":"some of the faculties in SAIL were very excited about it. I think we discussed a lot about this. Actually, I've seen so many faculty actually sitting in one room and playing with the OpenAI playground. At that moment, OpenAI doesn't even...","zh":"SAIL的一些教职员工对此非常兴奋。我认为我们讨论了很多。实际上，我看到很多教职员工坐在一个房间里，使用OpenAI的playground。在那时，OpenAI甚至……","start":2238.48,"end":2253.32},{"id":152,"text":"It's not ChatGPT. It's just a playground with one text box. And what you write and what model genre is actually written in the same text box. And actually, you can choose some kind of hyperparameters there, like in the temperature, so on and so forth. So on the right-hand side, you can choose the model with a drop-down menu, those kind of things. And we'll play with it. And I think many people are very excited about it. And then I think Percy Leung, so he","zh":"它不是ChatGPT。它只是一个带有文本框的playground。你输入的内容和模型类型都写在同一个文本框中。实际上，你可以在那里选择一些超参数，比如温度参数等等。在右侧，你可以通过下拉菜单选择模型，这些就是那样的东西。我们将一起尝试使用它。我认为很多人对此非常兴奋。然后我认为Percy Leung，他","start":2254.12,"end":2283.0},{"id":153,"text":"he led his team to study this new paradigm because we realized that this is a new paradigm of machine learning that is quite different from the deep learning wave. And we wrote a survey paper, and we call it Foundation Model. And in that paper, I just checked yesterday. I think in the abstract,","zh":"他带领他的团队研究了这一新范式，因为我们意识到这与深度学习浪潮是相当不同的机器学习新范式。我们写了一篇综述论文，并称之为基础模型。在那篇论文中，我昨天刚刚检查过。我认为在摘要中，","start":2283.5,"end":2303.34},{"id":154,"text":"it's written something like this is an emergent paradigm. And I look at my notes. In my lecture notes, I also call it emergent paradigm. But I think after three years, we probably should just not call it emergent paradigm. It's the new paradigm. It's the new paradigm. And also, this paradigm also, there are many variances in some sense. Like five years ago, when we talked about a paradigm, we actually","zh":"它写道，这类似于一种新兴的范式。我查看我的笔记。在我的讲义中，我也称之为新兴范式。但我想在三年后，我们可能应该不再称之为新兴范式。这是新的范式。这是新的范式。此外，这一范式在某种程度上也存在很多变体。五年前，当我们谈论范式时，我们实际上","start":2304.84,"end":2330.04}],"notes":["本段介绍了基础模型（foundation model）这一术语的起源，指出它是由斯坦福大学的研究人员在大约四到五年前提出的。当时，研究人员对GP3（可能指某种模型或论文）表现出极大的兴趣，并在SAIL（斯坦福人工智能实验室）内部进行了大量讨论。他们甚至看到许多教授在一个房间里使用OpenAI的playground进行实验，尽管当时OpenAI还没有推出ChatGPT。","OpenAI playground是一个简单的文本框界面，用户可以在其中输入文本，并选择不同的模型类型和超参数，如温度参数。这一工具让研究人员能够直观地探索不同模型的行为。Percy Leung领导的团队意识到，这种新的范式与传统的深度学习方法有显著不同，因此他们撰写了一篇综述论文，将这种范式称为‘基础模型’。","在论文的摘要中，作者提到这是一种‘新兴范式’（emergent paradigm），但作者认为，经过三年的发展，这一术语已经不再准确，应该直接称为‘新范式’。此外，这一范式具有多种变体，与五年前讨论的范式有所不同。","本段强调了基础模型作为机器学习领域的一个新范式，其核心在于通过大规模数据和复杂模型实现更强大的表示学习能力。这一范式与传统的深度学习方法在目标和实现方式上有显著差异，因此需要新的理论和实践框架来支持其发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2172.08,"end":2330.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2172.08,"text":"If you change the optimizer, you can do it for diffusion models. You can do it for large-language models. You can do it for maybe linear regression as well. So those are on a different layer. But generally, I think for the rest of the lectures, we are mostly talking about the data, the architecture, the loss function, and the training procedure, not much anymore about computing gradients and how to update gradients. You just assume once you define a loss function, you can optimize it."},{"start":2210.7,"text":"Cool. So I think now let's talk about a foundation model. I think this is a term that actually is a term that is kind of coined by one of the papers that many of the Stanford people wrote about now probably about like five years ago, maybe four or five years ago. So I think the story was that I think after GP3 came out, I think that's 2020 summer. I remember."},{"start":2238.48,"text":"some of the faculties in SAIL were very excited about it. I think we discussed a lot about this. Actually, I've seen so many faculty actually sitting in one room and playing with the OpenAI playground. At that moment, OpenAI doesn't even..."},{"start":2254.12,"text":"It's not ChatGPT. It's just a playground with one text box. And what you write and what model genre is actually written in the same text box. And actually, you can choose some kind of hyperparameters there, like in the temperature, so on and so forth. So on the right-hand side, you can choose the model with a drop-down menu, those kind of things. And we'll play with it. And I think many people are very excited about it. And then I think Percy Leung, so he"},{"start":2283.5,"text":"he led his team to study this new paradigm because we realized that this is a new paradigm of machine learning that is quite different from the deep learning wave. And we wrote a survey paper, and we call it Foundation Model. And in that paper, I just checked yesterday. I think in the abstract,"},{"start":2304.84,"text":"it's written something like this is an emergent paradigm. And I look at my notes. In my lecture notes, I also call it emergent paradigm. But I think after three years, we probably should just not call it emergent paradigm. It's the new paradigm. It's the new paradigm. And also, this paradigm also, there are many variances in some sense. Like five years ago, when we talked about a paradigm, we actually"}],"speech_gaps":[],"frame":"../frames/v052/014.webp","frame_time":2184.08},{"title":"表示学习中的预训练与适应阶段","segments":[{"id":155,"text":"including actually a broader set of techniques in some sense. And now some of those are a little out of date to some degree. And we are converging to even a smaller paradigm to some degree. But nevertheless, I'm still going to talk about some of the techniques that were popular around 2019 to 2022, let's say, before ChatGP came out for one or two lectures. And then we're going to talk about things that are...","zh":"包括实际上在某种意义上更广泛的一组技术。现在其中一些技术在某种程度上已经过时了。我们正在逐渐收敛到一个更小的范式。但无论如何，我仍然会讲一些在2019到2022年间流行的技术，比如说，在ChatGP出现之前的一到两节课中。然后我们会讲一些……","start":2331.69,"end":2358.37},{"id":156,"text":"the dominating approach after 2022, let's say.","zh":"2022年之后占主导地位的方法，比如说。","start":2359.05,"end":2362.55},{"id":157,"text":"I think the key kind of like a word here is the so-called pre-training. Probably you have heard a lot. And now there's a new work called post-training, which we'll discuss in later lectures. So in some sense, this foundation model paradigm, I think in the paper, in the survey paper, we discussed there are two phases. In some sense, the first phase is the pre-training. The second phase is the adaptation. And adaptation phase. And what happens is that","zh":"我认为这里的关键词是所谓的预训练。你可能已经听过很多了。现在有一种新方法叫做后训练，我们会在后面的课程中讨论。因此，在某种意义上，这种基础模型范式，我认为在论文中，在综述论文中，我们讨论过有两个阶段。在某种意义上，第一个阶段是预训练。第二个阶段是适应阶段。适应阶段。而发生的事情是","start":2363.9,"end":2393.27},{"id":158,"text":"pre-training, the real difference here, there are many different aspects. But probably the most important thing is that it's often using massive unlabeled data. And often several magnitudes higher than what people have done before. And massive unlabeled data and also your","zh":"预训练，这里的真正区别在于，有许多不同的方面。但可能最重要的是，它通常使用大量未标记的数据。而且通常比之前人们所做的数据量大几个数量级。大量未标记的数据，以及你的","start":2393.84,"end":2420.15},{"id":159,"text":"This is also somewhat general purpose. You don't really actually just only focus on one type of data. Your data is very diverse. You just try to download everything from the internet. And you don't necessarily care about even data quality that much. Of course, it matters. But at the beginning, people just download.","zh":"这也具有某种程度的通用性。你并不真的只专注于一种类型的数据。你的数据非常多样。你只是尝试从互联网上下载一切。你并不一定非常关心数据质量。当然，这很重要。但在最初，人们只是下载。","start":2423.66,"end":2440.68},{"id":160,"text":"very brute force from internet. And some of the data, actually, we look into it, it's not even, you have a hundred slash n consecutively in some of the documents that's even possible. But that's fine. So eventually, the first few versions, the data, you know, they are turned on, it's actually pretty messy. And eventually, people clean up, clean up the data, and it's better and better.","zh":"从互联网上非常粗暴地获取数据。实际上，一些数据，当我们查看时，甚至在某些文档中会出现连续的100个斜杠n，这甚至可能发生。但这没关系。因此，最初的几个版本，数据你知道，它们实际上是相当混乱的。最终，人们清理数据，清理数据，数据变得越来越好。","start":2441.19,"end":2461.15},{"id":161,"text":"So the gist is that you have as much data as possible. At the beginning, you don't even care about the quality that much. You just get massive unlabeled data. And you don't care about the labels. You just download documents. And some of these are HTML files, which all the HTML text in it. And some of these are Word documents. Some of these are other kind of documents. Everything is fine. And then in the adaptation phase, you adapt to","zh":"所以核心思想是，你拥有的数据越多越好。一开始，你甚至不太在意数据的质量。你只是获取大量的无标签数据。你并不关心这些数据的标签。你只是下载文档。其中一些是HTML文件，包含其中所有的HTML文本。一些是Word文档。一些是其他类型的文档。一切都没问题。然后在适应阶段，你适应于","start":2463.15,"end":2486.63}],"notes":["本段主要讲解表示学习中的预训练和适应阶段。预训练阶段使用大量未标记数据，这些数据通常来自互联网，种类多样，质量初期并不严格要求，但随着技术发展，数据会逐步清理和优化。","预训练阶段的核心在于利用大规模未标记数据，这与传统方法不同，传统方法通常依赖标记数据。预训练的目的是让模型学习通用的特征表示，以便在后续的适应阶段中更好地处理特定任务。","适应阶段是预训练之后的步骤，模型会根据具体任务调整其参数，以适应新的数据或任务。适应阶段可能包括微调、迁移学习等技术。","在预训练阶段，数据的多样性非常重要，模型会从各种来源下载数据，包括HTML文件、Word文档等，这些数据可能包含大量噪声，但随着数据处理的优化，质量会逐步提升。","预训练和适应阶段的结合构成了基础模型范式，这种范式在2019年至2022年间非常流行，之后随着新方法如post-training的出现，逐渐被新的技术所补充。","预训练阶段的挑战在于如何处理大规模未标记数据，以及如何在数据质量较低的情况下训练出有效的模型。随着技术的发展，数据清洗和预处理技术得到了显著改进。"],"formulas":[],"uncertainties":["you have a hundred slash n consecutively in some of the documents that's even possible"],"diagram":"none","start":2331.69,"end":2486.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2331.69,"text":"including actually a broader set of techniques in some sense. And now some of those are a little out of date to some degree. And we are converging to even a smaller paradigm to some degree. But nevertheless, I'm still going to talk about some of the techniques that were popular around 2019 to 2022, let's say, before ChatGP came out for one or two lectures. And then we're going to talk about things that are..."},{"start":2359.05,"text":"the dominating approach after 2022, let's say."},{"start":2363.9,"text":"I think the key kind of like a word here is the so-called pre-training. Probably you have heard a lot. And now there's a new work called post-training, which we'll discuss in later lectures. So in some sense, this foundation model paradigm, I think in the paper, in the survey paper, we discussed there are two phases. In some sense, the first phase is the pre-training. The second phase is the adaptation. And adaptation phase. And what happens is that"},{"start":2393.84,"text":"pre-training, the real difference here, there are many different aspects. But probably the most important thing is that it's often using massive unlabeled data. And often several magnitudes higher than what people have done before. And massive unlabeled data and also your"},{"start":2423.66,"text":"This is also somewhat general purpose. You don't really actually just only focus on one type of data. Your data is very diverse. You just try to download everything from the internet. And you don't necessarily care about even data quality that much. Of course, it matters. But at the beginning, people just download."},{"start":2441.19,"text":"very brute force from internet. And some of the data, actually, we look into it, it's not even, you have a hundred slash n consecutively in some of the documents that's even possible. But that's fine. So eventually, the first few versions, the data, you know, they are turned on, it's actually pretty messy. And eventually, people clean up, clean up the data, and it's better and better."},{"start":2463.15,"text":"So the gist is that you have as much data as possible. At the beginning, you don't even care about the quality that much. You just get massive unlabeled data. And you don't care about the labels. You just download documents. And some of these are HTML files, which all the HTML text in it. And some of these are Word documents. Some of these are other kind of documents. Everything is fine. And then in the adaptation phase, you adapt to"}],"speech_gaps":[],"frame":"../frames/v052/015.webp","frame_time":2343.69},{"title":"表示学习中的基础模型与适应","segments":[{"id":162,"text":"um you can adapt to many tasks, adapt to a wide window to a wide range of tasks, so so in some sense the key thing is that you you start with a very very you know i think that's the reason why it's called foundation model so you start with a very good foundation and then you can kind of like adapt to different tasks uh you never just directly go deal with one task before this mostly people are just say yeah i have image classification i just turn on image classification if i care about","zh":"嗯，你可以适应很多任务，适应一个很宽的窗口，适应很广泛的任务范围，所以从某种意义上说，关键之处在于你一开始有一个非常非常好的基础，所以这就是为什么它被称为基础模型，你从一个非常好的基础开始，然后你可以像这样适应不同的任务，你从不直接去处理一个任务，之前大多数人只是说，我有图像分类，我只需要打开图像分类，如果我关心的话","start":2487.09,"end":2516.94},{"id":163,"text":"object detection, I just turn on object detection.","zh":"目标检测，我只需要打开目标检测。","start":2517.28,"end":2520.36},{"id":164,"text":"And some people actually do multitask.","zh":"有些人实际上确实进行多任务处理。","start":2520.64,"end":2522.5},{"id":165,"text":"They say, I have three tasks, object detection, image classification,","zh":"他们说，我有三个任务，目标检测，图像分类，","start":2522.58,"end":2525.62},{"id":166,"text":"maybe bounding box detection, all of this.","zh":"也许边界框检测，所有这些。","start":2526.22,"end":2528.98},{"id":167,"text":"And I turn these three tasks by only three.","zh":"然后我只需要用三个参数来处理这三个任务。","start":2529.14,"end":2531.62},{"id":168,"text":"Here, the number of tasks is unlimited in some sense.","zh":"在这里，任务的数量在某种意义上是无限的。","start":2532.14,"end":2535.08},{"id":169,"text":"Even the GPT paper probably have 100 tasks in the evaluation,","zh":"甚至GPT论文的评估中可能有100个任务。","start":2535.98,"end":2540.54},{"id":170,"text":"and sometimes even more than that.","zh":"而且有时候甚至更多。","start":2540.78,"end":2541.78},{"id":171,"text":"And now, it's even crazier.","zh":"现在，情况甚至更疯狂。","start":2542.44,"end":2544.4},{"id":172,"text":"like you don't even have the sometimes notion of tasks is even you define just because you have so","zh":"比如，你甚至没有任务的概念，因为任务的定义仅仅是因为你拥有如此多的任务，","start":2544.4,"end":2549.26},{"id":173,"text":"many of them like you cannot even just distinguish what is the task what is not what is kind of like","zh":"以至于你甚至无法区分什么是任务，什么是不是任务，什么是某种意义上的领域，","start":2549.26,"end":2553.88},{"id":174,"text":"a domain in some sense just basically like the number of tasks is just a way um too many um","zh":"基本上来说，任务的数量只是一个过于庞大的概念。","start":2553.88,"end":2560.86},{"id":175,"text":"okay and um and uh so and for the adaptation phase you know in 2021 i think we discussed a lot about","zh":"好的，嗯，嗯，所以在适应阶段，你知道在2021年，我想我们讨论了很多关于","start":2561.72,"end":2570.06},{"id":176,"text":"like you know there are several different settings for um actually there are also different type of","zh":"比如，你知道实际上存在几种不同的设置，而且还有不同类型的","start":2570.06,"end":2574.12},{"id":177,"text":"of pre-training algorithms.","zh":"预训练算法。","start":2574.12,"end":2575.78},{"id":178,"text":"We'll discuss a few of them.","zh":"我们将讨论其中的一些。","start":2576.68,"end":2578.06},{"id":179,"text":"Of course, the most obvious one is the next-world prediction","zh":"当然，最明显的一个是下一个世界的预测","start":2578.64,"end":2581.44},{"id":180,"text":"laws with the large-language models.","zh":"与大语言模型的定律。","start":2581.44,"end":2583.22},{"id":181,"text":"But today, I think we're going to discuss a little more","zh":"但今天，我想我们先讨论一点","start":2584.54,"end":2586.52},{"id":182,"text":"about adaptation first.","zh":"关于适应的内容。","start":2586.52,"end":2587.68},{"id":183,"text":"So for adaptation, the type signature","zh":"因此，对于适应，类型签名","start":2588.02,"end":2590.58},{"id":184,"text":"is that there are two things you should discuss.","zh":"是应该讨论的两件事情。","start":2590.58,"end":2592.38},{"id":185,"text":"One thing is how much data I have to adapt to a new task","zh":"一件是我要适应新任务需要多少数据","start":2592.5,"end":2596.56},{"id":186,"text":"and what type of data.","zh":"以及数据的类型。","start":2597.24,"end":2598.62},{"id":187,"text":"And another thing is what's the technology to adapt.","zh":"另一个问题是使用什么技术来进行适应。","start":2598.94,"end":2602.12},{"id":188,"text":"to adapt so maybe let's talk about data part right so the adaptation phase um","zh":"为了适应，也许我们先谈谈数据部分。因此，在适应阶段，嗯","start":2602.12,"end":2607.58},{"id":189,"text":"in 2021 2022 i think people still care a lot about like this kind of like a you have a","zh":"在2021年和2022年，我认为人们仍然非常关注这种类型的，比如你有一个","start":2609.36,"end":2616.3},{"id":190,"text":"labeled data set a label downstream task downstream data set so you have like something like x task 1","zh":"带标签的数据集，一个下游任务和下游数据集，因此你有类似x任务1","start":2616.3,"end":2627.96},{"id":191,"text":"1, y, like you have these pairs, so you have n of these data points.","zh":"1，y，你有这些配对，因此你有n个这样的数据点。","start":2627.96,"end":2642.62},{"id":192,"text":"And they are labeled.","zh":"并且它们是带标签的。","start":2643.14,"end":2644.16},{"id":193,"text":"Why is the label?","zh":"为什么需要标签？","start":2644.28,"end":2644.92},{"id":194,"text":"Actually, it's the inputs.","zh":"实际上，是输入。","start":2644.98,"end":2645.68},{"id":195,"text":"And if n is small, let's say 5 to 10 maybe,","zh":"如果n很小，比如说5到10个左右，","start":2648.02,"end":2655.38},{"id":196,"text":"Then you call this few-shot.","zh":"那么你称之为少样本。","start":2655.92,"end":2657.06}],"notes":["本段主要讲解了基础模型的概念，即通过一个强大的基础模型，可以适应多种任务。讲者提到，基础模型的优势在于可以适应广泛的任务范围，而无需为每个任务单独训练模型。此外，还提到一些实际应用，如图像分类和目标检测，以及多任务学习的情况。"],"formulas":[],"uncertainties":["few-shot"],"diagram":"none","start":2487.09,"end":2657.06,"asr_flags":[191],"boards":[],"translation_complete":true,"translated_segments":35,"raw_segments":[{"start":2487.09,"text":"um you can adapt to many tasks adapt to a wide window to a wide range of tasks so so in some sense the key thing is that you you start with a very very you know i think that's the reason why it's called foundation model so you start with a very good foundation and then you can kind of like adapt to different tasks uh you never just directly go deal with one task before this mostly people are just say yeah i have image classification i just turn on image classification if i care about"},{"start":2517.28,"text":"object detection, I just turn on object detection."},{"start":2520.64,"text":"And some people actually do multitask."},{"start":2522.58,"text":"They say, I have three tasks, object detection, image classification,"},{"start":2526.22,"text":"maybe bounding box detection, all of this."},{"start":25
