 A times B. If W is like this matrix, and you say, I have a W plus."},{"start":3903.49,"text":"A and B like this. And its inner rank is R, which is low rank. So which is small."},{"start":3911.7,"text":"So basically, a and b has much fewer number of degree of freedom than the whole matrix because if you think about it, suppose you have a n by d by d matrix. Before, you have d squared degree of freedom. And now you have dr, 2dr degree of freedom. If r is much smaller than d, maybe d is like 1,000 and r is only 10, then 2dr is much smaller than d squared. So you say, I'm going to only"},{"start":3934.19,"text":"restrict my update to be a plus b, obviously a times b of this form. And this restricts the degree of freedom in my change. So in some sense, it's kind of like, as opposed to you minimize the loss of w, right? So this is what you do before. I say, in adaptation, now you say, I'm going to minimize l of w plus ab."},{"start":3961.93,"text":"where w, maybe let's say this is w0, and then you minimize over a, b. So before you are minimizing over w, your w"},{"start":3969.33,"text":"So in this case, I say u. So maybe let's say. So you say w is initialized to be w0, which is what you trained before. And then you minimize w. That's the typical fine tuning. And now you say, I'm going to fix w0, and I'm going to minimize over a and b. And I can initialize a to be 0 and b to be some random matrix so that initialization is the same. Because if a is 0, then w0 is the same as w0 here at the initialization. And then you only minimize over the two variables a and b."},{"start":3998.19,"text":"So that's called low rank adaptation."},{"start":4020.76,"text":"Yes, yes. So, you know, if you just have one matrix, then it's d squared degree of freedom again. So that's why you have the slow rank parametrization to make the degree of freedom much smaller. But then we are also adding some bias, kind of symmetry bias. Because we are doing a cross pattern there. That, I don't think so. That, I don't think so. Because a and b are not equal, right? So in some sense, you're just saying it's low rank. I'm not sure there's additional symmetry there."}],"speech_gaps":[{"start":4003.19,"end":4005.408},{"start":4007.088,"end":4013.936},{"start":4013.936,"end":4015.856},{"start":4015.856,"end":4020.36}],"frame":"../frames/v052/024.webp","frame_time":3886.59},{"title":"表示学习中的计算与内存优化","segments":[{"id":393,"text":"It's just low rank. But low rank is a bias. So I think the question is why we are doing this. So you restricted the degree of freedom you are changing. So do you save something here? Maybe let's examine one by one. So what do you really care about? So do you save the compute?","zh":"这只是一个低秩结构。但低秩是一种偏差。因此，我认为问题在于我们为什么要这样做。你限制了你正在改变的自由度。那么在这里你是否节省了什么？也许我们逐个来分析。你真正关心的是什么？你是否节省了计算资源？","start":4051.3,"end":4081.57},{"id":394,"text":"It is faster to optimize this. So it's less number of parameters. That's true. The less number of parameters to optimize, but it's not necessarily faster because you still have to use the w0. The forward path, you have to compute w0. So maybe let's just go on.","zh":"优化这个结构会更快。因此参数数量更少。这是正确的。参数数量越少，但并不一定更快，因为你仍然需要使用 w0。在前向传播路径中，你仍然需要计算 w0。因此，也许我们继续讨论下去吧。","start":4082.22,"end":4107.2},{"id":395,"text":"So in the forward path, you still compute w0 plus ab. And maybe you multiply this with a vector x, something like this. And then you have many, many layers like this. So you still have to compute w0 times x. There is no way to save that compute. And that is the bottleneck.","zh":"在前向传播路径中，你仍然需要计算 w0 加上 ab。也许你将这个结果与一个向量 x 相乘，类似这样的操作。然后你有许多这样的层。因此，你仍然需要计算 w0 乘以 x。没有方法可以节省这部分计算。这就是瓶颈。","start":4111.01,"end":4127.25},{"id":396,"text":"This A plus B, this part is cheap, but this part is still the bottleneck. And when you do the backward, you still have to compute W0 transpose. Remember that the forward path is W. The backward path is actually some kind of matrix. You multiply the transpose of the matrix. So that still has to be done. So largely speaking, your compute don't really change much. There is some nuances about how do you update.","zh":"A 加上 B 的部分计算成本较低，但这一部分仍然是瓶颈。在反向传播过程中，你仍然需要计算 W0 的转置。记住，前向传播路径是 W。反向传播路径实际上是某种矩阵。你需要计算矩阵的转置。因此，这部分仍然必须完成。总的来说，你的计算量并没有发生太大变化。关于如何更新，有一些细微差别。","start":4128.27,"end":4152.01},{"id":397,"text":"Like, how do you compute the gradient of the weights?","zh":"例如，你是如何计算权重的梯度的？","start":4152.6,"end":4154.38},{"id":398,"text":"That part, you actually, the derivative with respect","zh":"这部分，你实际上需要计算关于","start":4154.86,"end":4159.08},{"id":399,"text":"to weights.","zh":"权重的导数。","start":4159.08,"end":4159.34},{"id":400,"text":"I'm not sure whether you remember,","zh":"我不确定你是否还记得，","start":4159.5,"end":4160.54},{"id":401,"text":"like in backpropagation, there is","zh":"像在反向传播中一样，存在","start":4160.7,"end":4162.0},{"id":402,"text":"a derivative with respect to the activations","zh":"对激活值的导数","start":4162.0,"end":4164.68},{"id":403,"text":"and derivative with respect to weights.","zh":"以及对权重的导数。","start":4164.68,"end":4166.1},{"id":404,"text":"These are two semi-parallel type of computations","zh":"这些是两种半并行类型的计算","start":4166.32,"end":4170.28},{"id":405,"text":"you need to do.","zh":"你需要进行的。","start":4170.28,"end":4170.76},{"id":406,"text":"For the derivative with respect to activations,","zh":"对于对激活值的导数，","start":4171.02,"end":4173.1},{"id":407,"text":"you don't save anything at all.","zh":"你根本不需要保存任何内容。","start":4173.26,"end":4174.82},{"id":408,"text":"And for derivative with respect to weights,","zh":"而对于对权重的导数，","start":4175.14,"end":4176.66},{"id":409,"text":"you do save a little bit, because your weights","zh":"你确实能省一点，因为你的权重","start":4176.8,"end":4179.14},{"id":410,"text":"are smaller. And by weights, I mean the parameters. So your parameters are smaller.","zh":"更小。这里的权重指的是参数。因此，你的参数更少。","start":4179.14,"end":4184.98},{"id":411,"text":"You have smaller number of parameters, so your gradient is smaller. But largely speaking,","zh":"你拥有的参数数量更少，因此梯度也更小。但总体来说，","start":4185.2,"end":4189.82},{"id":412,"text":"you don't save much for compute. So compute, we don't save much. For memory, do we save?","zh":"你在计算上并没有省很多。那么对于内存，我们是否节省了呢？","start":4189.98,"end":4196.92},{"id":413,"text":"So it's not exactly. I saw it. Thanks. But it's not exactly in the sense that you still have to","zh":"所以并不是完全如此。我看到了。谢谢。但并不是在这样的意义上，你仍然需要","start":4198.88,"end":4208.5},{"id":414,"text":"to put w0 in your memory, right?","zh":"将w0存入内存，对吧？","start":4208.5,"end":4211.56},{"id":415,"text":"Your memory for the parameters is smaller,","zh":"你用于参数的内存更小，","start":4213.58,"end":4217.2},{"id":416,"text":"but you still have to put this frozen weights in the memory.","zh":"但你仍然需要将这些冻结的权重存入内存。","start":4217.42,"end":4220.96},{"id":417,"text":"But if you're using, for example,","zh":"但如果你正在使用，例如","start":4221.42,"end":4222.82},{"id":418,"text":"add a multi-rider, you have to keep track of some momentum","zh":"添加一个多人骑手，你必须跟踪所有内容的参数动量","start":4222.88,"end":4225.86},{"id":419,"text":"of the parameters on all the stuff,","zh":"的一些动量","start":4225.86,"end":4227.58},{"id":420,"text":"things a lot of space.","zh":"这会占用很多空间。","start":4227.62,"end":4228.38},{"id":421,"text":"Exactly.","zh":"没错。","start":4228.82,"end":4229.22},{"id":422,"text":"That's great.","zh":"这很好。","start":4229.26,"end":4229.6}],"notes":["本段讨论了表示学习中使用低秩近似对计算和内存的影响。讲者指出，虽然低秩近似减少了参数数量，但计算量并未显著减少，因为仍然需要计算w0和其转置。此外，梯度计算中，对激活值的导数无法节省计算，而对权重的导数由于参数数量减少，可以略微节省一些计算。","讲者进一步指出，虽然参数数量减少，但内存占用并未显著减少，因为仍然需要存储冻结的权重。此外，使用如动量等优化方法时，会增加内存需求。","讲者强调，尽管低秩近似在某些方面可能带来优化，但整体上对计算和内存的节省并不明显，特别是在涉及复杂优化方法时，内存需求可能反而增加。","讲者通过具体例子说明了低秩近似在计算和内存上的局限性，指出即使参数减少，仍然需要存储和计算某些关键部分，如w0及其转置，这限制了实际的优化效果。","讲者还提到，梯度计算中对权重的导数虽然可以略微节省计算，但整体上对计算的节省并不显著，这表明低秩近似在实际应用中可能带来的优化有限。","最后，讲者指出，虽然低秩近似可能在某些情况下带来优化，但其效果取决于具体的实现方式和优化方法，不能一概而论。"],"formulas":[],"uncertainties":["multi-rider","things a lot of space"],"diagram":"none","start":4051.3,"end":4229.6,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":4051.3,"text":"It's just low rank. But low rank is a bias. So I think the question is why we are doing this. So you restricted the degree of freedom you are changing. So do you save something here? Maybe let's examine one by one. So what do you really care about? So do you save the compute?"},{"start":4082.22,"text":"It is faster to optimize this. So it's less number of parameters. That's true. The less number of parameters to optimize, but it's not necessarily faster because you still have to use the w0. The forward path, you have to compute w0. So maybe let's just go on."},{"start":4111.01,"text":"So in the forward path, you still compute w0 plus ab. And maybe you multiply this with a vector x, something like this. And then you have many, many layers like this. So you still have to compute w0 times x. There is no way to save that compute. And that is the bottleneck."},{"start":4128.27,"text":"This A plus B, this part is cheap, but this part is still the bottleneck. And when you do the backward, you still have to compute W0 transpose. Remember that the forward path is W. The backward path is actually some kind of matrix. You multiply the transpose of the matrix. So that still has to be done. So largely speaking, your compute don't really change much. There is some nuances about how do you update."},{"start":4152.6,"text":"Like, how do you compute the gradient of the weights?"},{"start":4154.86,"text":"That part, you actually, the derivative with respect"},{"start":4159.08,"text":"to weights."},{"start":4159.5,"text":"I'm not sure whether you remember,"},{"start":4160.7,"text":"like in backpropagation, there is"},{"start":4162.0,"text":"a derivative with respect to the activations"},{"start":4164.68,"text":"and derivative with respect to weights."},{"start":4166.32,"text":"These are two semi-parallel type of computations"},{"start":4170.28,"text":"you need to do."},{"start":4171.02,"text":"For the derivative with respect to activations,"},{"start":4173.26,"text":"you don't save anything at all."},{"start":4175.14,"text":"And for derivative with respect to weights,"},{"start":4176.8,"text":"you do save a little bit, because your weights"},{"start":4179.14,"text":"are smaller. And by weights, I mean the parameters. So your parameters are smaller."},{"start":4185.2,"text":"You have smaller number of parameters, so your gradient is smaller. But largely speaking,"},{"start":4189.98,"text":"you don't save much for compute. So compute, we don't save much. For memory, do we save?"},{"start":4198.88,"text":"So it's not exactly. I saw it. Thanks. But it's not exactly in the sense that you still have to"},{"start":4208.5,"text":"to put w0 in your memory, right?"},{"start":4213.58,"text":"Your memory for the parameters is smaller,"},{"start":4217.42,"text":"but you still have to put this frozen weights in the memory."},{"start":4221.42,"text":"But if you're using, for example,"},{"start":4222.88,"text":"add a multi-rider, you have to keep track of some momentum"},{"start":4225.86,"text":"of the parameters on all the stuff,"},{"start":4227.62,"text":"things a lot of space."},{"start":4228.82,"text":"Exactly."},{"start":4229.26,"text":"That's great."}],"speech_gaps":[],"frame":"../frames/v052/025.webp","frame_time":4063.3},{"title":"梯度下降与内存使用","segments":[{"id":423,"text":"So I guess just for some context,","zh":"所以我想先提供一些背景信息","start":4230.84,"end":4233.02},{"id":424,"text":"what do you have to put in your memory","zh":"当你进行梯度下降时，你必须将什么内容存储在内存中","start":4233.46,"end":4235.18},{"id":425,"text":"when you do gradient descent?","zh":"当你进行梯度下降时？","start":4235.18,"end":4236.44},{"id":426,"text":"set.","zh":"你必须将参数存储在内存中。","start":4236.44,"end":4236.54},{"id":427,"text":"You have to put your parameters in the memory.","zh":"你很可能必须将梯度存储在内存中。","start":4236.78,"end":4239.06},{"id":428,"text":"You have to put a gradient in the memory, most likely.","zh":"你必须将梯度的动量存储在内存中。","start":4239.66,"end":4241.92},{"id":429,"text":"You have to put the momentum of the gradient in the memory.","zh":"我想我们没有讨论动量，这","start":4242.18,"end":4245.72},{"id":430,"text":"I guess we didn't discuss the momentum, which","zh":"我想我们没有讨论动量，这","start":4245.88,"end":4248.28},{"id":431,"text":"is something that you have to keep track of in your optimizer.","zh":"这是你在优化器中必须跟踪的东西。","start":4248.28,"end":4254.76},{"id":432,"text":"And typically, the gradient and the momentum","zh":"通常，梯度和动量","start":4256.58,"end":4258.74},{"id":433,"text":"actually cost much more than the number of parameters.","zh":"实际上消耗的资源比参数数量要多得多。","start":4258.74,"end":4260.86},{"id":434,"text":"I think it's a factor of 12 or something.","zh":"我想这是一个12倍左右的因素。","start":4261.04,"end":4263.06},{"id":435,"text":"So basically, if your model weights cost D numbers,","zh":"基本上，如果你的模型权重消耗D个数值，","start":4263.06,"end":4268.54},{"id":436,"text":"then your gradient in the optimizer state on the momentum","zh":"那么你在优化器状态中的动量梯度","start":4268.8,"end":4273.22},{"id":437,"text":"is probably something like, is it really 12?","zh":"大概是，这真的是12倍吗？","start":4273.22,"end":4275.44},{"id":438,"text":"I forgot.","zh":"我忘了。","start":4275.6,"end":4275.82},{"id":439,"text":"Maybe 6, some constant factor, large enough constant factor","zh":"也许6，某个常数因子，足够大的常数因子","start":4275.98,"end":4279.2},{"id":440,"text":"for you to care about.","zh":"对你来说可能不重要。","start":4279.2,"end":4279.96},{"id":441,"text":"So yes, so for those things, you don't","zh":"所以是的，对于这些事情，你不需要","start":4281.0,"end":4283.32},{"id":442,"text":"You only have to save the momentum for AB.","zh":"你只需要为AB保存动量。","start":4283.32,"end":4285.68},{"id":443,"text":"You only have to save the momentum for AB.","zh":"你只需要为AB保存动量。","start":4285.76,"end":4287.08},{"id":444,"text":"However, the momentum and gradient, you know, I guess this is a level of our system.","zh":"然而，动量和梯度，你知道的，我想这属于我们系统的一个层面。","start":4287.3,"end":4288.64},{"id":445,"text":"However, the momentum and gradient, you know, I guess this is a level of our system.","zh":"然而，动量和梯度，你知道的，我想这属于我们系统的一个层面。","start":4292.2,"end":4296.54},{"id":446,"text":"I think I don't expect everyone knows that.","zh":"我想我不指望每个人都了解这一点。","start":4296.64,"end":4298.1},{"id":447,"text":"the gradient and momentum always sharded across GPUs for some scale when you have more than one GPU. So you never save the full gradient or the full momentum on each of the GPUs. So in this kind of parallelism, a typical kind of parallelism is called FSDP, data parallelism, where the","zh":"当使用多个GPU时，在某些规模下，梯度和动量总是会被分片存储在不同的GPU上。因此，每个GPU上都不会保存完整的梯度或完整的动量。在这种类型的并行化中，一种典型的并行化方式称为FSDP（Fully Sharded Data Parallelism），即数据并行化，其中","start":4300.41,"end":4328.35},{"id":448,"text":"Model parameters are duplicated across GPU cards, but the gradient and the momentum are not duplicated across all GPU cards. The gradient and momentum, because they're too big, actually, you have to kind of like shard them. Shard them means like you store different blocks of...","zh":"模型参数会在GPU卡之间复制，但梯度和动量不会在所有GPU卡之间复制。由于梯度和动量太大，实际上你必须对其进行分片存储。分片意味着你存储不同的块...","start":4329.31,"end":4347.09},{"id":449,"text":"So in this kind of parallelism, a typical kind of parallelism is called FSDP, data parallelism, where the","zh":"在这种类型的并行化中，一种典型的并行化方式称为FSDP（Fully Sharded Data Parallelism），即数据并行化，其中","start":4347.69,"end":4350.71},{"id":450,"text":"So in some sense, those are not always the bottleneck anyway.","zh":"从某种意义上说，这些并不总是瓶颈。","start":4350.87,"end":4355.07},{"id":451,"text":"The gradient and momentum, because they're too big, actually, you have to kind of like shard them.","zh":"由于梯度和动量太大，实际上你必须对其进行分片存储。","start":4355.23,"end":4356.19},{"id":452,"text":"Shard them means like you store different blocks of...","zh":"分片意味着你存储不同的块...","start":4356.43,"end":4360.95},{"id":453,"text":"but it's not like a day and night to some degree.","zh":"但某种程度上并不是非此即彼的关系。","start":4361.05,"end":4363.11},{"id":454,"text":"So in some sense, those are not always the bottleneck anyway.","zh":"从某种意义上说，这些并不总是瓶颈。","start":4366.51,"end":4370.09},{"id":455,"text":"I guess we talked about the compute, the memory,","zh":"我想我们谈到了计算和内存，","start":4370.55,"end":4375.57},{"id":456,"text":"So the saving here is, there are some saving,","zh":"所以这里的节省是，有一些节省，","start":4375.57,"end":4379.39},{"id":457,"text":"but it's not like a day and night to some degree.","zh":"但并不是在某种程度上天壤之别。","start":4379.39,"end":4379.87},{"id":458,"text":"But I think all of the arguments are still largely true,","zh":"但我认为所有的论点仍然大致成立，","start":4380.95,"end":4383.99},{"id":459,"text":"I think all of the arguments are still largely true,","zh":"我想所有的论点仍然大致成立，","start":4384.13,"end":4385.31},{"id":460,"text":"even for inference and training.","zh":"即使对于推理和训练也是如此。","start":4386.51,"end":4390.27},{"id":461,"text":"In my opinion, one of the major savings for LoRa","zh":"在我看来，LoRa的一个主要节省","start":4390.27,"end":4395.29},{"id":462,"text":"is that there's one very most typical case","zh":"是存在一个非常典型的案例","start":4395.29,"end":4404.29},{"id":463,"text":"is that you just barely have enough memory to do this.","zh":"就是说你刚好有足够的内存来执行这个操作。","start":4404.29,"end":4406.19}],"notes":["本段讨论了在进行梯度下降时，需要存储在内存中的内容，包括参数、梯度和动量。动量通常比参数和梯度占用更多内存，且其存储量可能是一个常数倍，如12或6倍。这表明在优化器中，动量的存储对内存使用有重要影响。"],"formulas":[],"uncertainties":["12","6","some constant factor"],"diagram":"none","start":4230.84,"end":4406.19,"asr_flags":[462],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":4230.84,"text":"So I guess just for some context,"},{"start":4233.46,"text":"what do you have to put in your memory"},{"start":4235.18,"text":"when you do gradient descent?"},{"start":4236.44,"text":"set."},{"start":4236.78,"text":"You have to put your parameters in the memory."},{"start":4239.66,"text":"You have to put a gradient in the memory, most likely."},{"start":4242.18,"text":"You have to put the momentum of the gradient in the memory."},{"start":4245.88,"text":"I guess we didn't discuss the momentum, which"},{"start":4248.28,"text":"is something that you have to keep track of in your optimizer."},{"start":4256.58,"text":"And typically, the gradient and the momentum"},{"start":4258.74,"text":"actually cost much more than the number of parameters."},{"start":4261.04,"text":"I think it's a factor of 12 or something."},{"start":4263.06,"text":"So basically, if your model weights cost D numbers,"},{"start":4268.8,"text":"then your gradient in the optimizer state on the momentum"},{"start":4273.22,"text":"is probably something like, is it really 12?"},{"start":4275.6,"text":"I forgot."},{"start":4275.98,"text":"Maybe 6, some constant factor, large enough constant factor"},{"start":4279.2,"text":"for you to care about."},{"start":4281.0,"text":"So yes, so for those things, you don't"},{"start":4283.32,"text":"have to save the momentum of the gradient for W0."},{"start":4285.76,"text":"You only have to save the momentum for AB."},{"start":4287.3,"text":"So that's why you save."},{"start":4292.2,"text":"However, the momentum and gradient, you know, I guess this is a level of our system."},{"start":4296.64,"text":"I think I don't expect everyone knows that."},{"start":4300.41,"text":"the gradient and momentum always sharded across GPUs for some scale when you have more than one GPU. So you never save the full gradient or the full momentum on each of the GPUs. So in this kind of parallelism, a typical kind of parallelism is called FSDP, data parallelism, where the"},{"start":4329.31,"text":"Model parameters are duplicated across GPU cards, but the gradient and the momentum are not duplicated across all GPU cards. The gradient and momentum, because they're too big, actually, you have to kind of like shard them. Shard them means like you store different blocks of..."},{"start":4347.69,"text":"on gradients on different GPUs."},{"start":4350.87,"text":"So in some sense, those are not always the bottleneck anyway."},{"start":4355.23,"text":"They are already sharded."},{"start":4356.43,"text":"So the saving here is, there are some saving,"},{"start":4361.05,"text":"but it's not like a day and night to some degree."},{"start":4366.51,"text":"So and what else?"},{"start":4370.55,"text":"I guess we talked about the compute, the memory,"},{"start":4375.57,"text":"memory, and also this depends on whether you are doing training"},{"start":4379.39,"text":"or inference."},{"start":4380.95,"text":"But I think all of the arguments are still largely true,"},{"start":4384.13,"text":"even for inference and training."},{"start":4386.51,"text":"In my opinion, one of the major savings for LoRa"},{"start":4390.27,"text":"is that there's one very most typical case"},{"start":4395.29,"text":"is that you just barely have enough memory to do this."},{"start":4404.29,"text":"so that any saving helps sometimes."}],"speech_gaps":[{"start":4289.04,"end":4291.8},{"start":4298.5,"end":4300.01},{"start":4364.304,"end":4366.11}],"frame":"../frames/v052/026.webp","frame_time":4242.84},{"title":"表示学习中的低秩适配（LoRa）","segments":[{"id":464,"text":"Because for example, sometimes you are very tight in memory.","zh":"例如，有时候你内存非常紧张。","start":4406.37,"end":4411.69},{"id":465,"text":"And if you save even 10%, you actually","zh":"如果你能节省哪怕10%，你","start":4411.81,"end":4414.03},{"id":466,"text":"can use one GPU as opposed to two GPUs.","zh":"实际上就可以用一个GPU而不是两个GPU。","start":4414.03,"end":4415.91},{"id":467,"text":"That's one case that is really, really important.","zh":"这是一个非常、非常重要的情况。","start":4415.93,"end":4417.71},{"id":468,"text":"But those are only when you have a very limited number of GPUs.","zh":"但这些情况只适用于你拥有非常有限数量的GPU时。","start":4418.43,"end":4421.47},{"id":469,"text":"And another one that I think is very important case","zh":"另一个我认为非常重要的情况是","start":4421.69,"end":4424.91},{"id":470,"text":"is that when you have this LoRa, you","zh":"当你使用LoRa时，你","start":4424.91,"end":4429.51},{"id":471,"text":"you can let multiple users to share the W0.","zh":"可以让多个用户共享W0。","start":4429.51,"end":4433.73},{"id":472,"text":"and save many many copies of the low rank part and this is in my opinion probably the main reason","zh":"并且保存许多许多的低秩部分，这在我看来可能是主要原因","start":4433.73,"end":4439.93},{"id":473,"text":"why for example if you look at the fine tuning services GPT and Gemini offers they only offer","zh":"例如，如果你查看微调服务，如GPT和Gemini提供的服务，它们只提供","start":4439.93,"end":4447.21},{"id":474,"text":"you fine tune for LoRa. So what that means is that you have like every user have like the shared W0","zh":"你针对LoRa进行微调。这意味着每个用户都有一个共享的W0","start":4447.21,"end":4454.49},{"id":475,"text":"this is probably GPT-4 right and then I go to chat GPT you know I go to GPT API and I say I","zh":"这可能是GPT-4，然后我前往Chat GPT，你知道的，我前往GPT API并说","start":4454.49,"end":4463.09},{"id":476,"text":"I want to fine-tune.","zh":"我想进行微调。","start":4463.09,"end":4463.65},{"id":477,"text":"And then GPT says, I'm going to do a low-rank update for me.","zh":"然后GPT会说，我要为你进行一个低秩更新。","start":4463.81,"end":4468.03},{"id":478,"text":"And then each of you actually have your own low-rank updates.","zh":"然后你们每个人实际上都有自己的低秩更新。","start":4468.35,"end":4470.91},{"id":479,"text":"You have A2, B2, up to AK, BK.","zh":"你们有A2, B2，一直到AK, BK。","start":4471.09,"end":4474.25},{"id":480,"text":"And now the saving here matters because this part is shared.","zh":"现在这里的节省是有意义的，因为这一部分是共享的。","start":4475.97,"end":4480.69},{"id":481,"text":"Everyone has shared the same part.","zh":"每个人都有共享的同一部分。","start":4481.17,"end":4482.51},{"id":482,"text":"And if each of us only costs another 100 million parameters,","zh":"如果每个人只增加另外100百万个参数，","start":4484.43,"end":4488.43},{"id":483,"text":"then maybe we can serve 1,000 of these users","zh":"那么也许我们可以服务1000个这样的用户","start":4488.67,"end":4491.07},{"id":484,"text":"And it's still only probably 10 billion parameters.","zh":"而且这仍然可能只有100亿个参数。","start":4491.07,"end":4493.37},{"id":485,"text":"But if each of us have to have a full matrix W,","zh":"但如果每个人都需要一个完整的矩阵W，","start":4495.35,"end":4498.31},{"id":486,"text":"then it's too much memory.","zh":"那么内存就太不够用了。","start":4498.43,"end":4499.73},{"id":487,"text":"So basically, this allows you to have multiple users low rank","zh":"所以基本上，这允许你为多个用户进行低秩适配","start":4500.25,"end":4504.21},{"id":488,"text":"updates adapter in the same memory","zh":"在相同的内存中更新适配器","start":4504.21,"end":4508.21},{"id":489,"text":"so that you can serve multiple users.","zh":"这样你就可以服务多个用户。","start":4510.27,"end":4513.79},{"id":490,"text":"And you can actually swap between them very fast.","zh":"并且你可以在它们之间非常快速地切换。","start":4513.99,"end":4515.73},{"id":491,"text":"So in the inference time, you just say,","zh":"所以在推理时间，你只需说，","start":4515.95,"end":4518.11},{"id":492,"text":"If this user comes, I'm going to use this A1, B1. And if another user comes, I'm going to use A2, B2. I'm going to preload all of the users. Maybe not all of the users. I'm going to preload a large fraction of the user's adapters in the GPU so that I can swap between them very fast. And even if I don't preload them in the GPU memory, I can still load them from CPU.","zh":"如果这个用户来了，我就使用A1, B1。如果另一个用户来了，我就使用A2, B2。我会预加载所有用户的适配器。也许不是所有用户。我会在GPU中预加载大量用户的适配器，以便在它们之间快速切换。即使没有在GPU内存中预加载，我仍然可以从CPU加载它们。","start":4519.72,"end":4537.92},{"id":493,"text":"And loading a small matrix, a low rank matrix, is much faster than loading the full matrix. So in my opinion, that's probably the major benefit of LoRa, which you can serve many, many users.","zh":"加载一个小矩阵，一个低秩矩阵，比加载完整矩阵要快得多。因此在我看来，这可能是LoRa的主要优势，即你可以服务许多许多用户。","start":4539.38,"end":4550.72}],"notes":["本段主要讲解了LoRa（低秩适配）在表示学习中的应用，特别是其在节省内存和允许多个用户共享基础权重W0方面的优势。讲者提到，通过仅存储低秩更新部分，可以显著减少内存占用，从而支持更多用户同时使用模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4406.37,"end":4550.72,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":4406.37,"text":"Because for example, sometimes you are very tight in memory."},{"start":4411.81,"text":"And if you save even 10%, you actually"},{"start":4414.03,"text":"can use one GPU as opposed to two GPUs."},{"start":4415.93,"text":"That's one case that is really, really important."},{"start":4418.43,"text":"But those are only when you have a very limited number of GPUs."},{"start":4421.69,"text":"And another one that I think is very important case"},{"start":4424.91,"text":"is that when you have this LoRa, you"},{"start":4429.51,"text":"can let multiple users to share the W0."},{"start":4433.73,"text":"and save many many copies of the low rank part and this is in my opinion probably the main reason"},{"start":4439.93,"text":"why for example if you look at the fine tuning services GPT and Gemini offers they only offer"},{"start":4447.21,"text":"you fine tune for LoRa. So what that means is that you have like every user have like the shared W0"},{"start":4454.49,"text":"this is probably GPT-4 right and then I go to chat GPT you know I go to GPT API and I say I"},{"start":4463.09,"text":"I want to fine-tune."},{"start":4463.81,"text":"And then GPT says, I'm going to do a low-rank update for me."},{"start":4468.35,"text":"And then each of you actually have your own low-rank updates."},{"start":4471.09,"text":"You have A2, B2, up to AK, BK."},{"start":4475.97,"text":"And now the saving here matters because this part is shared."},{"start":4481.17,"text":"Everyone has shared the same part."},{"start":4484.43,"text":"And if each of us only costs another 100 million parameters,"},{"start":4488.67,"text":"then maybe we can serve 1,000 of these users"},{"start":4491.07,"text":"And it's still only probably 10 billion parameters."},{"start":4495.35,"text":"But if each of us have to have a full matrix W,"},{"start":4498.43,"text":"then it's too much memory."},{"start":4500.25,"text":"So basically, this allows you to have multiple users low rank"},{"start":4504.21,"text":"updates adapter in the same memory"},{"start":4510.27,"text":"so that you can serve multiple users."},{"start":4513.99,"text":"And you can actually swap between them very fast."},{"start":4515.95,"text":"So in the inference time, you just say,"},{"start":4519.72,"text":"If this user comes, I'm going to use this A1, B1. And if another user comes, I'm going to use A2, B2. I'm going to preload all of the users. Maybe not all of the users. I'm going to preload a large fraction of the user's adapters in the GPU so that I can swap between them very fast. And even if I don't preload them in the GPU memory, I can still load them from CPU."},{"start":4539.38,"text":"And loading a small matrix, a low rank matrix, is much faster than loading the full matrix. So in my opinion, that's probably the major benefit of LoRa, which you can serve many, many users."}],"speech_gaps":[],"frame":"../frames/v052/027.webp","frame_time":4418.37}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v052.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
