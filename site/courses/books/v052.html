29.14,"text":"And I turn these three tasks by only three."},{"start":2532.14,"text":"Here, the number of tasks is unlimited in some sense."},{"start":2535.98,"text":"Even the GPT paper probably have 100 tasks in the evaluation,"},{"start":2540.78,"text":"and sometimes even more than that."},{"start":2542.44,"text":"And now, it's even crazier."},{"start":2544.4,"text":"like you don't even have the sometimes notion of tasks is even you define just because you have so"},{"start":2549.26,"text":"many of them like you cannot even just distinguish what is the task what is not what is kind of like"},{"start":2553.88,"text":"a domain in some sense just basically like the number of tasks is just a way um too many um"},{"start":2561.72,"text":"okay and um and uh so and for the adaptation phase you know in 2021 i think we discussed a lot about"},{"start":2570.06,"text":"like you know there are several different settings for um actually there are also different type of"},{"start":2574.12,"text":"of pre-training algorithms."},{"start":2576.68,"text":"We'll discuss a few of them."},{"start":2578.64,"text":"Of course, the most obvious one is the next-world prediction"},{"start":2581.44,"text":"laws with the large-language models."},{"start":2584.54,"text":"But today, I think we're going to discuss a little more"},{"start":2586.52,"text":"about adaptation first."},{"start":2588.02,"text":"So for adaptation, the type signature"},{"start":2590.58,"text":"is that there are two things you should discuss."},{"start":2592.5,"text":"One thing is how much data I have to adapt to a new task"},{"start":2597.24,"text":"and what type of data."},{"start":2598.94,"text":"And another thing is what's the technology to adapt."},{"start":2602.12,"text":"to adapt so maybe let's talk about data part right so the adaptation phase um"},{"start":2609.36,"text":"in 2021 2022 i think people still care a lot about like this kind of like a you have a"},{"start":2616.3,"text":"labeled data set a label downstream task downstream data set so you have like something like x task 1"},{"start":2627.96,"text":"1, y, like you have these pairs, so you have n of these data points."},{"start":2643.14,"text":"And they are labeled."},{"start":2644.28,"text":"Why is the label?"},{"start":2644.98,"text":"Actually, it's the inputs."},{"start":2648.02,"text":"And if n is small, let's say 5 to 10 maybe,"},{"start":2655.92,"text":"Then you call this few-shot."}],"speech_gaps":[{"start":2646.08,"end":2647.62}],"frame":"../frames/v052/016.webp","frame_time":2499.09},{"title":"表示学习与零样本学习","segments":[{"id":197,"text":"So, and one of the real breakthroughs for GPT-3 is kind of like you don't have to actually do even a few shots sometimes. You can even do zero shot. So, and now at this moment, I think people mostly think about zero shot. You know, almost nobody collects in your downstream.","zh":"因此，GPT-3 的一个真正突破在于，有时你甚至不需要进行几次示例。你甚至可以进行零样本学习。因此，此刻我认为人们大多考虑的是零样本学习。你知道，几乎没有人再收集下游任务的标签来适应你的模型。","start":2661.88,"end":2678.0},{"id":198,"text":"labels anymore to adapt your model.","zh":"你不再需要收集任何标签来适应你的模型。","start":2678.97,"end":2681.37},{"id":199,"text":"You just do zero-shot.","zh":"你只需进行零样本学习。","start":2681.51,"end":2682.25},{"id":200,"text":"Basically, zero-shot just means you don't even have to adapt.","zh":"基本上，零样本学习意味着你甚至不需要进行任何适应。","start":2682.43,"end":2684.53},{"id":201,"text":"In some sense, you just describe your tasks.","zh":"某种意义上说，你只需描述你的任务。","start":2684.75,"end":2687.19},{"id":202,"text":"You say, this is my task, please solve it.","zh":"你说，这是我的任务，请解决它。","start":2687.73,"end":2689.99},{"id":203,"text":"You don't have to collect any new data","zh":"你不需要为这些任务收集任何新数据","start":2690.09,"end":2693.03},{"id":204,"text":"for the tasks, for the downstream tasks.","zh":"用于下游任务。","start":2693.03,"end":2694.91},{"id":205,"text":"But in 2021, 2022, or maybe 2019, this is a few-shot,","zh":"但在2021年、2022年，或者也许在2019年，这属于少量样本学习，","start":2695.49,"end":2700.33},{"id":206,"text":"or maybe even more labeled downstream task","zh":"或者甚至更多标记的下游任务","start":2700.45,"end":2702.69},{"id":207,"text":"is the more dominating approach.","zh":"是更为主导的方法。","start":2702.69,"end":2704.05},{"id":208,"text":"So for example, you train a model,","zh":"例如，你训练一个模型，","start":2704.39,"end":2705.59},{"id":209,"text":"And then you say, I want to apply it","zh":"然后你说，我想将其应用于","start":2705.59,"end":2706.99},{"id":210,"text":"to sentiment classification.","zh":"情感分类任务。","start":2706.99,"end":2709.13},{"id":211,"text":"And then you collect a small data set, sentiment","zh":"然后你收集一个小的数据集，情感","start":2709.99,"end":2713.23},{"id":212,"text":"classification data set.","zh":"分类数据集。","start":2713.23,"end":2714.33},{"id":213,"text":"And then you fine-tune, or you haven't already defined","zh":"然后你进行微调，或者你还没有定义","start":2714.53,"end":2718.47},{"id":214,"text":"fine-tune, but you fine-tune on this small data set,","zh":"微调，但你是在这个小数据集上进行微调，","start":2718.47,"end":2722.57},{"id":215,"text":"let's say sentiment classification data set.","zh":"比如说情感分类数据集。","start":2722.69,"end":2724.13},{"id":216,"text":"And then your model can work on sentiment classification.","zh":"然后你的模型就可以用于情感分类。","start":2724.31,"end":2726.61},{"id":217,"text":"So that's the definition of few-shot learning.","zh":"这就是少样本学习的定义。","start":2730.35,"end":2732.13},{"id":218,"text":"learning.","zh":"学习。","start":2732.13,"end":2732.25},{"id":219,"text":"And if you have any zero, then it's called zero-shot.","zh":"如果你有任何零样本，那么它被称为零样本。","start":2732.39,"end":2734.73},{"id":220,"text":"And then another thing is that, so whether in this adaptation,","zh":"然后另一个问题是，在这种适应过程中，","start":2736.31,"end":2745.71},{"id":221,"text":"how do you update your parameters or not?","zh":"你是如何更新你的参数或者不更新的？","start":2746.03,"end":2748.35},{"id":222,"text":"So in this lecture and next lecture,","zh":"所以在这堂课和下堂课里，","start":2749.07,"end":2752.19},{"id":223,"text":"I think I'm going to discuss those ideas where you actually","zh":"我想我会讨论那些你实际上","start":2752.41,"end":2754.73},{"id":224,"text":"do update the parameters with the data.","zh":"用数据来更新参数的情况。","start":2754.73,"end":2757.33},{"id":225,"text":"And later on, we're going to talk about those cases","zh":"之后，我们将讨论那些情况","start":2757.53,"end":2759.97},{"id":226,"text":"is where you don't have to even adapt to change your parameters.","zh":"你甚至不需要调整你的参数。","start":2759.97,"end":2763.27},{"id":227,"text":"You just prompt the model to adapt to the new tasks.","zh":"你只需提示模型适应新的任务。","start":2763.39,"end":2767.13},{"id":228,"text":"OK, so that's the high-level overview.","zh":"好的，这就是一个高层次的概述。","start":2769.19,"end":2772.75},{"id":229,"text":"No, it's actually very simple, nothing complicated.","zh":"不，实际上非常简单，没有复杂之处。","start":2773.39,"end":2775.95},{"id":230,"text":"And you can try to formalize this,","zh":"你可以尝试形式化这个概念，","start":2779.07,"end":2780.87},{"id":231,"text":"but it's kind of actually pretty trivial","zh":"但实际上相当 trivial（平凡）","start":2780.95,"end":2783.93},{"id":232,"text":"to write down some equations.","zh":"写出一些方程。","start":2783.93,"end":2785.69},{"id":233,"text":"Basically, your pre-training, you have a loss function,","zh":"基本上，你的预训练中，你有一个损失函数，","start":2786.09,"end":2787.91},{"id":234,"text":"maybe something like a pre-training loss function.","zh":"可能像一个预训练损失函数。","start":2787.91,"end":2789.83},{"id":235,"text":"And for each data point, maybe you have data point i,","zh":"对于每个数据点，可能你有数据点 i，","start":2790.99,"end":2794.35},{"id":236,"text":"you have some parameter theta, and your loss function","zh":"你有一些参数 theta，以及你的损失函数","start":2794.57,"end":2796.79},{"id":237,"text":"is just the sum of the loss functions with the average.","zh":"这仅仅是损失函数的总和，取平均值。","start":2796.79,"end":2799.81},{"id":238,"text":"The only thing is that for pre-training,","zh":"唯一需要注意的是在预训练阶段，","start":2800.19,"end":2801.77},{"id":239,"text":"there's no label.","zh":"没有标签。","start":2802.85,"end":2803.71},{"id":240,"text":"And also, you have a very, very big in a pre-training.","zh":"此外，预训练时数据量非常非常大。","start":2803.95,"end":2807.05},{"id":241,"text":"And we're going to discuss what are the loss functions later.","zh":"我们之后会讨论损失函数是什么。","start":2810.99,"end":2814.91},{"id":242,"text":"later. So. Okay. Any questions so far? This is supposed to be a very high level and nothing","zh":"之后再说。所以，好了，到目前为止有问题吗？这应该是一个非常高层次的概述，没有任何","start":2814.91,"end":2833.03}],"notes":["本段主要讲解了表示学习中的零样本学习（zero-shot learning）和少样本学习（few-shot learning）的概念。零样本学习指的是在没有额外标注数据的情况下，直接让模型完成任务，而少样本学习则需要少量标注数据进行微调。课程中提到，GPT-3等模型在某些情况下可以实现零样本学习，即无需任何额外数据即可完成任务。","课程中还提到，在2019年到2022年之间，少样本学习是更主流的方法，即通过微调少量标注数据来适应新任务。例如，训练一个模型后，收集一个小型的情感分类数据集，并在该数据集上进行微调，使模型能够完成情感分类任务。","此外，课程还讨论了在适应过程中是否需要更新模型参数的问题。在接下来的课程中，将讨论需要更新参数的情况，而另一类情况则是不需要更新参数，而是通过提示（prompt）让模型直接适应新任务。","课程最后提到，表示学习的基本思想非常简单，可以通过一些简单的公式来形式化。例如，预训练阶段有一个损失函数，通常是一个预训练损失函数，每个数据点都有参数θ，损失函数是所有数据点损失函数的平均值。","预训练阶段通常没有标签，而且数据量非常大。课程还提到，将在后续讨论具体的损失函数形式。","最后，课程询问了学生是否有问题，强调了这些概念的高阶性和简单性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2661.88,"end":2833.03,"asr_flags":[218,220],"boards":[],"translation_complete":true,"translated_segments":46,"raw_segments":[{"start":2661.88,"text":"So, and one of the real breakthrough for GPT-3 is kind of like you don't have to actually do even a few shots sometimes. You can even do zero shot. So, and now at this moment, I think people mostly think about zero shot. You know, almost nobody collects in your downstream."},{"start":2678.97,"text":"labels anymore to adapt your model."},{"start":2681.51,"text":"You just do zero-shot."},{"start":2682.43,"text":"Basically, zero-shot just means you don't even have to adapt."},{"start":2684.75,"text":"In some sense, you just describe your tasks."},{"start":2687.73,"text":"You say, this is my task, please solve it."},{"start":2690.09,"text":"You don't have to collect any new data"},{"start":2693.03,"text":"for the tasks, for the downstream tasks."},{"start":2695.49,"text":"But in 2021, 2022, or maybe 2019, this is a few-shot,"},{"start":2700.45,"text":"or maybe even more labeled downstream task"},{"start":2702.69,"text":"is the more dominating approach."},{"start":2704.39,"text":"So for example, you train a model,"},{"start":2705.59,"text":"And then you say, I want to apply it"},{"start":2706.99,"text":"to sentiment classification."},{"start":2709.99,"text":"And then you collect a small data set, sentiment"},{"start":2713.23,"text":"classification data set."},{"start":2714.53,"text":"And then you fine-tune, or you haven't already defined"},{"start":2718.47,"text":"fine-tune, but you fine-tune on this small data set,"},{"start":2722.69,"text":"let's say sentiment classification data set."},{"start":2724.31,"text":"And then your model can work on sentiment classification."},{"start":2730.35,"text":"So that's the definition of few-shot learning."},{"start":2732.13,"text":"learning."},{"start":2732.39,"text":"And if you have any zero, then it's called zero-shot."},{"start":2736.31,"text":"And then another thing is that, so whether in this adaptation,"},{"start":2746.03,"text":"how do you update your parameters or not?"},{"start":2749.07,"text":"So in this lecture and next lecture,"},{"start":2752.41,"text":"I think I'm going to discuss those ideas where you actually"},{"start":2754.73,"text":"do update the parameters with the data."},{"start":2757.53,"text":"And later on, we're going to talk about those cases"},{"start":2759.97,"text":"is where you don't have to even adapt to change your parameters."},{"start":2763.39,"text":"You just prompt the model to adapt to the new tasks."},{"start":2769.19,"text":"OK, so that's the high-level overview."},{"start":2773.39,"text":"No, it's actually very simple, nothing complicated."},{"start":2779.07,"text":"And you can try to formalize this,"},{"start":2780.95,"text":"but it's kind of actually pretty trivial"},{"start":2783.93,"text":"to write down some equations."},{"start":2786.09,"text":"Basically, your pre-training, you have a loss function,"},{"start":2787.91,"text":"maybe something like a pre-training loss function."},{"start":2790.99,"text":"And for each data point, maybe you have data point i,"},{"start":2794.57,"text":"you have some parameter theta, and your loss function"},{"start":2796.79,"text":"is just the sum of the loss functions with the average."},{"start":2800.19,"text":"The only thing is that for pre-training,"},{"start":2802.85,"text":"there's no label."},{"start":2803.95,"text":"And also, you have a very, very big in a pre-training."},{"start":2810.99,"text":"And we're going to discuss what are the loss functions later."},{"start":2814.91,"text":"later. So. Okay. Any questions so far? This is supposed to be a very high level and nothing"}],"speech_gaps":[{"start":2728.336,"end":2729.95},{"start":2776.35,"end":2778.67}],"frame":"../frames/v052/017.webp","frame_time":2673.88},{"title":"表示学习的概念与应用","segments":[{"id":243,"text":"deep at all. So, but, yeah. Okay. So, and next, I'm going to discuss some of the somewhat","zh":"深奥。所以，但是，是的。好的。那么，接下来，我将讨论一些较为通用的适应方法。","start":2833.03,"end":2850.85},{"id":244,"text":"generic way of doing the adaptation. So, especially with a label dataset. So, if you have a label","zh":"特别是使用带标签的数据集。因此，如果你有一个带标签的数据集，下游数据集是进行这种适应的典型方式。","start":2854.53,"end":2862.31},{"id":245,"text":"data set, downstream data sets was the typical way to do that adaptation. And to introduce some","zh":"为了引入这些概念，我们可能需要引入一个叫做表示学习的概念，","start":2862.31,"end":2870.83},{"id":246,"text":"of these ideas, we probably have to introduce this idea called representation learning,","zh":"这在许多情况下仍然具有一定的相关性。因此，表示学习在某种意义上是一种特殊的预训练方式，你预先训练一个表示。","start":2870.83,"end":2875.25},{"id":247,"text":"which is still kind of relevant in many cases right now. So representation learning is in some","zh":"你构建一个模型，该模型能够表示数据。","start":2879.33,"end":2886.33},{"id":248,"text":"sense a special type of pre-training where you pre-train a representation.","zh":"这意味着你的模型被称为 phi，","start":2886.33,"end":2889.71},{"id":249,"text":"You are portraying a model that represents the data.","zh":"你展示了一个能够表示数据的模型。","start":2889.71,"end":2893.97},{"id":250,"text":"So what that means is that your model is called phi,","zh":"所以这意味着你的模型被称为 phi，","start":2894.05,"end":2896.99},{"id":251,"text":"So what that means is that your model is called phi,","zh":"这意味着你的模型被称为 phi","start":2897.51,"end":2902.83},{"id":252,"text":"So this maps the data into some m-dimensional vector.","zh":"这将数据映射到一个 m 维的向量中","start":2903.03,"end":2904.39},{"id":253,"text":"And this vector, so I guess let's write this.","zh":"并且这个向量，我想我们来写一下","start":2904.73,"end":2912.75},{"id":254,"text":"And this vector, so I guess let's write this.","zh":"并且这个向量，我想我们来写一下","start":2913.17,"end":2918.65},{"id":255,"text":"and it outputs a vector in m-dimensional space. And this vector is called either representation,","zh":"它输出一个 m 维空间中的向量。这个向量被称为表示","start":2918.65,"end":2924.05},{"id":256,"text":"sometimes it's called feature, sometimes it's called embedding.","zh":"有时也被称为特征，有时也被称为嵌入","start":2925.21,"end":2932.87},{"id":257,"text":"And you can design lots of functions that tune this kind of like representations,","zh":"你可以设计很多函数来调整这种表示","start":2935.23,"end":2939.11},{"id":258,"text":"And you can design lots of functions that tune this kind of like representations,","zh":"你可以设计很多函数来调整这种表示","start":2944.01,"end":2947.85},{"id":259,"text":"which we'll discuss next lecture.","zh":"我们将在下节课讨论。","start":2947.85,"end":2949.35},{"id":260,"text":"And once you get this representation,","zh":"一旦你得到了这种表示，","start":2950.23,"end":2951.99},{"id":261,"text":"you do some training where you get some,","zh":"你就会进行一些训练，从而得到一些，","start":2952.41,"end":2954.21},{"id":262,"text":"say you minimize some loss function.","zh":"比如说，你最小化某个损失函数。","start":2955.07,"end":2958.07},{"id":263,"text":"Often the loss function is still like something like this,","zh":"通常这个损失函数仍然是类似这样的，","start":2962.15,"end":2964.45},{"id":264,"text":"you know, some loss","zh":"你知道的，某种损失","start":2964.59,"end":2967.11},{"id":265,"text":"for the data point xi and theta.","zh":"对于数据点xi和theta。","start":2969.89,"end":2971.81},{"id":266,"text":"And then this will give you some theta hat,","zh":"然后这将给你一个theta hat，","start":2972.29,"end":2974.39},{"id":267,"text":"which is a parameter that you obtain","zh":"这是一个你在训练之后获得的参数","start":2975.17,"end":2976.91},{"id":268,"text":"10 after the training. And then this theta hat will define a representation function,","zh":"10。然后这个theta帽将定义一个表示函数,","start":2976.91,"end":2981.61},{"id":269,"text":"phi theta hat, which you can apply to get a vector out of any data point.","zh":"phi theta帽，你可以将其应用于从任何数据点中得到一个向量。","start":2982.43,"end":2987.95},{"id":270,"text":"So, and then once you have the theta hat, which is a trained representation,","zh":"因此，一旦你有了这个theta帽，即一个训练好的表示，","start":2988.75,"end":2992.25},{"id":271,"text":"then you can use it to solve a downstream task with linear hat.","zh":"你就可以用它来使用线性帽解决下游任务。","start":2992.97,"end":2997.59},{"id":272,"text":"So this is the concept of so-called linear probing.","zh":"这就是所谓的线性探针的概念。","start":3005.59,"end":3008.03}],"notes":["本段介绍了表示学习的基本概念，即通过预训练模型来学习数据的表示。表示学习是一种特殊的预训练方式，其中模型将数据映射到一个m维向量空间中，这个向量被称为表示、特征或嵌入。"],"formulas":[],"uncertainties":["10 after the training"],"diagram":"none","start":2833.03,"end":3008.03,"asr_flags":[243],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":2833.03,"text":"deep at all. So, but, yeah. Okay. So, and next, I'm going to discuss some of the somewhat"},{"start":2854.53,"text":"generic way of doing the adaptation. So, especially with a label dataset. So, if you have a label"},{"start":2862.31,"text":"data set, downstream data sets was the typical way to do that adaptation. And to introduce some"},{"start":2870.83,"text":"of these ideas, we probably have to introduce this idea called representation learning,"},{"start":2879.33,"text":"which is still kind of relevant in many cases right now. So representation learning is in some"},{"start":2886.33,"text":"sense a special type of pre-training where you pre-train a representation."},{"start":2889.71,"text":"So you're not portraying a checked model like a checked GBT."},{"start":2894.05,"text":"You are portraying a model that represents the data."},{"start":2897.51,"text":"So what that means is that your model is called phi,"},{"start":2903.03,"text":"which is parametric by theta."},{"start":2904.73,"text":"So this maps the data into some m-dimensional vector."},{"start":2913.17,"text":"And this vector, so I guess let's write this."},{"start":2918.65,"text":"So you have a data point x, you tune a model, and this model is parametrized by some theta,"},{"start":2925.21,"text":"and it outputs a vector in m-dimensional space. And this vector is called either representation,"},{"start":2935.23,"text":"sometimes it's called feature, sometimes it's called embedding."},{"start":2944.01,"text":"And you can design lots of functions that tune this kind of like representations,"},{"start":2947.85,"text":"which we'll discuss next lecture."},{"start":2950.23,"text":"And once you get this representation,"},{"start":2952.41,"text":"you do some training where you get some,"},{"start":2955.07,"text":"say you minimize some loss function."},{"start":2962.15,"text":"Often the loss function is still like something like this,"},{"start":2964.59,"text":"you know, some loss"},{"start":2969.89,"text":"for the data point xi and theta."},{"start":2972.29,"text":"And then this will give you some theta hat,"},{"start":2975.17,"text":"which is a parameter that you obtain"},{"start":2976.91,"text":"10 after the training. And then this theta hat will define a representation function,"},{"start":2982.43,"text":"phi theta hat, which you can apply to get a vector out of any data point."},{"start":2988.75,"text":"So, and then once you have the theta hat, which is a trained representation,"},{"start":2992.97,"text":"then you can use it to solve a downstream task with linear hat."},{"start":3005.59,"text":"So this is the concept of so-called linear probing."}],"speech_gaps":[{"start":2958.72,"end":2961.712}],"frame":"../frames/v052/018.webp","frame_time":2845.03},{"title":"表示学习中的线性探针技术","segments":[{"id":273,"text":"And this is still a useful technique for mechanistic interpretability of large-language models. Even if you don't use it for solving the tasks, you can still use this as a way to interpret or understand to some degree how the large-language model works. But in the context of representation learning, linear probing is a way to even solve some downstream tasks. So what it means is that once you have this fixed embedding model or representation model, this is a vector.","zh":"这种方法仍然是理解大型语言模型机制可解释性的一个有用技术。即使你不使用它来解决任务，你也可以用它作为一种方式来解释或在某种程度上理解大型语言模型是如何工作的。但在表示学习的背景下，线性探针是一种甚至可以解决某些下游任务的方法。这意味着一旦你有了这个固定的嵌入模型或表示模型，它就是一个向量。","start":3012.38,"end":3041.4},{"id":274,"text":"And then you have a new so-called linear head. So the linear head is a vector w in the same space. And you take the inner product of the linear head with the so-called feature or the representation. And this is your prediction. And maybe sometimes you have to do a softmax if your prediction is classification. But this is the core model. So basically, you are just doing a linear model on top of a fixed representation.","zh":"然后你有一个新的所谓的线性头部。线性头部是一个与该空间相同的向量 w。你将线性头部与所谓的特征或表示进行内积，这就是你的预测。有时你可能需要进行 softmax，如果你的预测是分类任务。但这是核心模型。基本上，你只是在固定的表示之上进行一个线性模型。","start":3041.58,"end":3069.18},{"id":275,"text":"And then you can just say, you know, if it's a regression, then you can just minimize, for example, say minimize over the linear head. You do one over and let's say you have n task number of examples for the downstream task. And you do a simple regression task, regression loss. Of course, you can also define analogously some of the other classification loss as well.","zh":"然后你可以说，如果是回归任务，你就可以最小化线性头部。例如，你对下游任务的 n 个示例进行最小化。你进行一个简单的回归任务，回归损失。当然，你也可以类似地定义其他分类损失。","start":3070.54,"end":3100.35},{"id":276,"text":"So here the theta hat is fixed, and this is a fixed vector. The only variables here is the w. You just want to learn w that fits your data as much as possible. So basically, this is just a very simple regression task once you are approaching the model. And people have realized that this is much better than just training.","zh":"在这里，θ̂ 是固定的，这是一个固定的向量。这里的唯一变量是 w。你只需要学习 w，使其尽可能拟合你的数据。基本上，一旦你接近模型，这只是一个非常简单的回归任务。人们已经意识到这比手工设计特征或仅仅在 X 任务上训练一个线性模型要好得多。","start":3114.53,"end":3133.56},{"id":277,"text":"hand crafting some features or just training a linear model on top of X task because the representation is actually a very good representation that captures some semantic information in the data. So basically, with data transformation,","zh":"因为表示实际上是一个非常好的表示，它捕捉了数据中的一些语义信息。因此，基本上，通过数据转换，","start":3134.31,"end":3148.23},{"id":278,"text":"your y is not a linear function of the x. But now you transform it in a way such that you capture the important information linearly so that you can linearly combine your new features or representations and this prediction for y can be much more accurate. Yeah, of course. The representation. Yeah, I think that's a different, you know, I'll talk about it next time.","zh":"你的 y 并不是 x 的线性函数。但现在你以一种方式转换它，使得你可以线性地捕捉重要信息，从而可以线性地组合你的新特征或表示，使得对 y 的预测更加准确。当然，表示。是的，我想这是不同的，我会在下次讲到它。","start":3149.15,"end":3180.1}],"notes":["本段讲解了表示学习中线性探针技术的应用，强调了该技术在理解大型语言模型工作机制中的作用，即使不用于解决具体任务，也可以作为解释工具。同时，线性探针也被用于解决下游任务，通过在固定表示模型上添加线性头进行预测。","线性头是一个向量w，与表示空间中的特征或表示进行内积运算，得到预测结果。在分类任务中，可能需要使用softmax函数。整个模型的核心是在线性模型上进行训练，而表示模型是固定的。","在回归任务中，可以通过最小化线性头的损失函数来优化模型。对于分类任务，也可以定义类似的损失函数。这种技术比手动构建特征或直接在原始数据上训练线性模型更有效。","表示模型能够捕捉数据中的语义信息，因此通过数据转换，可以将非线性关系转化为线性关系，从而提高预测的准确性。这种转换使得线性组合的新特征或表示能够更准确地预测目标变量。","本段提到，表示模型的这种能力使得线性探针技术在表示学习中具有重要价值，但该技术的进一步讨论将在下节课中进行。","线性探针技术的核心在于利用已有的表示模型，通过简单的线性模型进行预测，从而在保持模型结构不变的情况下，提高模型的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3012.38,"end":3180.1,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3012.38,"text":"And this is still a useful technique for mechanistic interpretability of large-language models. Even if you don't use it for solving the tasks, you can still use this as a way to interpret or understand to some degree how the large-language model works. But in the context of representation learning, linear probing is a way to even solve some downstream tasks. So what it means is that once you have this fixed embedding model or representation model, this is a vector."},{"start":3041.58,"text":"And then you have a new so-called linear head. So the linear head is a vector w in the same space. And you take the inner product of the linear head with the so-called feature or the representation. And this is your prediction. And maybe sometimes you have to do a soft max if your prediction is classification. But this is the core model. So basically, you are just doing a linear model on top of a fixed representation."},{"start":3070.54,"text":"And then you can just say, you know, if it's a regression, then you can just minimize, for example, say minimize over the linear head. You do one over and let's say you have n task number of examples for the downstream task. And you do a simple regression task, regression loss. Of course, you can also define analogously some of the other classification loss as well."},{"start":3114.53,"text":"So here the theta hat is fixed, and this is a fixed vector. The only variables here is the w. You just want to learn w that fits your data as much as possible. So basically, this is just a very simple regression task once you are approaching the model. And people have realized that this is much better than just training."},{"start":3134.31,"text":"hand crafting some features or just training a linear model on top of X task because the representation is actually a very good representation that captures some semantic information in the data. So basically, with data transformation,"},{"start":3149.15,"text":"your y is not a linear function of the x. But now you transform it in a way such that you capture the important information linearly so that you can linearly combine your new features or representations and this prediction for y can be much more accurate. Yeah, of course. The representation. Yeah, I think that's a different, you know, I'll talk about it next time."}],"speech_gaps":[],"frame":"../frames/v052/019.webp","frame_time":3024.38},{"title":"表示学习的多模态与模型统一","segments":[{"id":279,"text":"Are the foundational models made for different domains? Things are changing over time. Three or four years ago, I think people have different techniques for different domains to some degree. But for vision, you learn the representations in one way, and for language, you learn the representation in another way. But now, more and more people are trying to get multi-model.","zh":"基础模型是为不同领域专门设计的吗？事情随着时间在变化。三到四年前，我认为人们在某种程度上为不同领域使用不同的技术。但对于视觉，你以一种方式学习表示，而对于语言，你以另一种方式学习表示。但现在，越来越多的人试图实现多模态。","start":3181.5,"end":3210.0},{"id":280,"text":"capabilities. So you want one model to be able to deal with both vision, language, maybe even videos. So then, in some sense, you have to have a unified approach. So I think in 2026, many of the models are, I think, people call it omni-model or multi-model model, which just means that you try to take in both the images and the text out of those in one model. What we're going to discuss","zh":"能力。因此，你希望一个模型能够处理视觉、语言，甚至视频。因此，在某种意义上，你必须采用统一的方法。我认为在2026年，许多模型被称为omni-model或multi-model模型，这仅仅意味着你在一个模型中同时处理图像和文本。我们接下来要讨论","start":3210.35,"end":3238.59},{"id":281,"text":"uh we are still somewhat you know at least for one or two lectures we're still going to be domain specific i think in this kind of like this kind of thing probably happens more for um this representation learning happens more for vision domains um where you learn the visual representation first and then you apply your linear classification i think people are still using this for maybe uh medical imaging you first get the representation and then you apply","zh":"嗯，我们仍然在某种程度上，至少在一到两节课中，仍然会是领域特定的。我认为这种表示学习在视觉领域发生得更多，你首先学习视觉表示，然后应用线性分类。我认为人们仍然在使用这种方法，例如在医学影像中，你首先获得表示，然后应用","start":3239.21,"end":3264.11},{"id":282,"text":"the linear classification for many many different types of medical imaging tasks. You have a small data set for each of the imaging tasks and then you train a small linear head on top of that. But for the Frontier models and Frontier Labs, I think it's also a universal model that takes in everything. Does that make sense? One other way to adapt to a new task is so-called fine-tuning.","zh":"线性分类用于许多不同类型的医学影像任务。每个影像任务都有一个小数据集，然后你在其上训练一个小的线性头部。但对于前沿模型和前沿实验室，我认为它也是一个通用模型，可以处理所有内容。这有意义吗？另一种适应新任务的方法是所谓的微调。","start":3264.71,"end":3296.83},{"id":283,"text":"And the difference between linear probing and fine tuning in this context is just very simple. So here, you optimize only w, but not theta. But you can also optimize theta. So what you do is you say, I'm going to do the same thing. Maybe I'll just save some time to not rewrite the same equation. Let's say, let's use the color to change the, so you just do this, minimizing over.","zh":"在这个上下文中，线性探针和微调之间的区别非常简单。在这里，你只优化w，而不优化theta。但你也可以优化theta。你所做的就是，我将做同样的事情。也许我只需节省一些时间，不重写同样的方程。让我们假设，我们用颜色来改变，所以你只需这样做，最小化关于","start":3297.65,"end":3322.6},{"id":284,"text":"the variable theta and then you say here this is not a fixed theta it's actually a variable theta","zh":"变量theta，并且你说这里这不是一个固定的theta，实际上是一个变量theta","start":3323.24,"end":3328.68},{"id":285,"text":"you can you can vary and you also initialize your theta to say the hat so the initialized hat what","zh":"你可以改变它，你也可以将theta初始化为hat，所以初始化的hat是什么","start":3328.68,"end":3336.8},{"id":286,"text":"you obtained before is your initializer and now and then after that you optimize both w and theta","zh":"你之前得到的是你的初始化参数，之后你还会同时优化w和theta","start":3336.8,"end":3342.24},{"id":287,"text":"and and what is w initialized w is often initialized somewhat randomly um um you know","zh":"而w的初始化通常是随机地进行的，嗯，嗯，你知道的","start":3342.24,"end":3349.92},{"id":288,"text":"And of course, there are still some variants about how","zh":"当然，关于如何初始化它，仍然存在一些变体","start":3349.92,"end":3354.0},{"id":289,"text":"do you exactly initialize it.","zh":"你究竟如何精确地初始化它","start":3354.0,"end":3355.62}],"notes":["本段主要讨论表示学习在不同领域中的应用，以及多模态模型的发展趋势。讲者指出，过去不同领域使用不同的技术，但现在越来越多的研究者尝试构建能够处理多种模态（如视觉、语言、视频）的统一模型。这种模型被称为omni-model或multi-model model，其核心思想是将图像和文本等信息整合到一个模型中。","讲者提到，尽管多模态模型正在兴起，但在某些领域（如医学影像）仍然使用领域特定的方法。例如，先学习视觉表示，再在上面应用线性分类器。这种做法在医学影像任务中仍然被广泛使用，因为每个任务的数据集较小，且可以训练一个小型的线性头部。","在模型适应新任务的方法上，讲者区分了线性探针（linear probing）和微调（fine-tuning）。线性探针仅优化权重w，而微调则可以同时优化权重w和参数θ。讲者还提到，θ可以初始化为之前获得的值，然后在后续步骤中同时优化w和θ。","讲者指出，权重w通常被随机初始化，但具体的初始化方法仍有变体。这表明在实际应用中，初始化策略的选择对模型性能有重要影响。","讲者强调，尽管多模态模型是当前研究的热点，但领域特定的方法在某些情况下仍然有效。这反映了表示学习在不同应用场景中的灵活性和多样性。","最后，讲者提到初始化方法的变体，这表明在实际应用中，如何初始化模型参数是一个需要仔细考虑的问题。"],"formulas":[],"uncertainties":["the variable theta and then you say here this is not a fixed theta it's actually a variable theta","you can you can vary and you also initialize your theta to say the hat so the initialized hat what"],"diagram":"none","start":3181.5,"end":3355.62,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":3181.5,"text":"Are the foundational models made for different domains? Things are changing over time. Three or four years ago, I think people have different techniques for different domains to some degree. But for vision, you learn the representations in one way, and for language, you learn the representation in another way. But now, more and more people are trying to get multi-model."},{"start":3210.35,"text":"capabilities. So you want one model to be able to deal with both vision, language, maybe even videos. So then, in some sense, you have to have a unified approach. So I think in 2026, many of the models are, I think, people call it omni-model or multi-model model, which just means that you try to take in both the images and the text out of those in one model. What we're going to discuss"},{"start":3239.21,"text":"uh we are still somewhat you know at least for one or two lectures we're still going to be domain specific i think in this kind of like this kind of thing probably happens more for um this representation learning happens more for vision domains um where you learn the visual representation first and then you apply your linear classification i think people are still using this for maybe uh medical imaging you first get the representation and then you apply"},{"start":3264.71,"text":"the linear classification for many many different types of medical imaging tasks. You have a small data set for each of the imaging tasks and then you train a small linear head on top of that. But for the Frontier models and Frontier Labs, I think it's also a universal model that takes in everything. Does that make sense? One other way to adapt to a new task is so-called fine-tuning."},{"start":3297.65,"text":"And the difference between linear probing and fine tuning in this context is just very simple. So here, you optimize only w, but not theta. But you can also optimize theta. So what you do is you say, I'm going to do the same thing. Maybe I'll just save some time to not rewrite the same equation. Let's say, let's use the color to change the, so you just do this, minimizing over."},{"start":3323.24,"text":"the variable theta and then you say here this is not a fixed theta it's actually a variable theta"},{"start":3328.68,"text":"you can you can vary and you also initialize your theta to say the hat so the initialized hat what"},{"start":3336.8,"text":"you obtained before is your initializer and now and then after that you optimize both w and theta"},{"start":3342.24,"text":"and and what is w initialized w is often initialized somewhat randomly um um you know"},{"start":3349.92,"text":"And of course, there are still some variants about how"},{"start":3354.0,"text":"do you exactly initialize it."}],"speech_gaps":[],"frame":"../frames/v052/020.webp","frame_time":3193.5},{"title":"表示学习中的初始化与损失函数","segments":[{"id":290,"text":"And then you optimize both theta and the w afterwards.","zh":"然后你再对 theta 和 w 进行优化。","start":3357.68,"end":3361.92},{"id":291,"text":"So in some sense, if you think about this,","zh":"所以从某种意义上说，","start":3362.44,"end":3364.78},{"id":292,"text":"the interesting part about this is","zh":"这个方法有趣的地方在于","start":3364.98,"end":3366.6},{"id":293,"text":"that the final loss function you are choosing here,","zh":"你在这里选择的最终损失函数是","start":3366.6,"end":3368.88},{"id":294,"text":"that in some sense, the loss function","zh":"从某种意义上说，","start":3370.24,"end":3371.68},{"id":295,"text":"itself doesn't have anything to do with the pre-training.","zh":"这个损失函数本身与预训练没有任何关系。","start":3371.68,"end":3378.82},{"id":296,"text":"Like you could imagine that I can just optimize the same loss function with random w and random","zh":"比如你可以想象，我可以在随机的 w 和随机的 theta 作为起点的情况下，直接优化相同的损失函数，","start":3378.82,"end":3386.58},{"id":297,"text":"theta as the beginning, and then there's nothing to do with pre-training.","zh":"而预训练则与之毫无关系。","start":3386.58,"end":3389.86},{"id":298,"text":"You are just training from scratch, optimizing a gigantic model for both of the two parameters.","zh":"你只是从头开始训练，同时优化这两个参数的巨型模型。","start":3390.04,"end":3394.36},{"id":299,"text":"However, somehow, if you initialize this parallel variable with a pre-trained model, you get","zh":"然而，某种方式下，如果你用一个预训练模型来初始化这个并行变量，你会得到","start":3395.04,"end":3399.7},{"id":300,"text":"much better results.","zh":"更好的结果。","start":3399.7,"end":3400.38},{"id":301,"text":"So if you think about that, it's kind of interesting because it's the same loss function, just","zh":"所以如果你仔细想想，这有点有趣，因为它是相同的损失函数，只是","start":3401.66,"end":3405.4},{"id":302,"text":"the initialization are different.","zh":"初始化方式不同。","start":3405.4,"end":3406.36},{"id":303,"text":"So somehow in tradition,","zh":"所以某种方式下，在传统中，","start":3407.08,"end":3408.06},{"id":304,"text":"affects your final global minimum. And that's actual proof that this loss function has a lot","zh":"会影响你最终的全局最小值。而这实际上是证明这个损失函数有很多","start":3408.96,"end":3413.98},{"id":305,"text":"of global minimum. You can find maybe millions of global minimum and not all of them are the same.","zh":"全局最小值。你可能会找到数百万个全局最小值，而它们并不都相同。","start":3413.98,"end":3419.38},{"id":306,"text":"If you use training from scratch, you start from somewhere,","zh":"如果你从头开始训练，你会从某个地方开始，","start":3419.8,"end":3422.26},{"id":307,"text":"like some random place, and you find one global minimum, which is not very good.","zh":"比如某个随机的位置，并找到一个全局最小值，但这个最小值并不是很好。","start":3422.72,"end":3426.06},{"id":308,"text":"Or you can use another initialization and you can find another global minimum,","zh":"或者你可以使用另一种初始化方法，找到另一个全局最小值，","start":3427.66,"end":3432.76},{"id":309,"text":"and that one is better. Of course, better or worse also needs to be clarified.","zh":"而那个最小值更好。当然，更好或更差也需要明确。","start":3432.86,"end":3437.76},{"id":310,"text":"because here, by better or worse, I mean the test performance.","zh":"在这里，所谓的好或坏，指的是测试性能。","start":3437.76,"end":3441.94},{"id":311,"text":"In terms of the training performance,","zh":"从训练性能的角度来看，","start":3442.4,"end":3444.1},{"id":312,"text":"I think you always get to zero almost","zh":"我认为你几乎总能得到零，","start":3444.46,"end":3445.78},{"id":313,"text":"because you don't have a lot of data here.","zh":"因为这里你并没有很多数据。","start":3445.78,"end":3447.16},{"id":314,"text":"there are multiple global minimum","zh":"存在多个全局最小值","start":3448.3,"end":3450.32},{"id":315,"text":"of this loss function.","zh":"对于这个损失函数。","start":3450.32,"end":3451.24},{"id":316,"text":"And in terms of the training loss, they're all zero.","zh":"在训练损失方面，它们都是零。","start":3452.58,"end":3456.26},{"id":317,"text":"But in terms of test performance,","zh":"但在测试性能方面，","start":3457.28,"end":3458.64},{"id":318,"text":"some of them is much better than the others.","zh":"其中一些表现明显优于其他。","start":3458.8,"end":3460.26},{"id":319,"text":"And how do you find the better ones?","zh":"你如何找到这些更好的解？","start":3460.58,"end":3461.8},{"id":320,"text":"You have to start with a good initialization.","zh":"你必须从一个良好的初始化开始。","start":3461.88,"end":3463.12},{"id":321,"text":"We are learning a function, we are learning a parameter theta. So basically the deliverable","zh":"我们是在学习一个函数，我们是在学习一个参数 theta。因此，基本上交付物是","start":3477.2,"end":3482.46},{"id":322,"text":"here is the theta hat, which is a concrete set of numbers under this architecture.","zh":"这里是θ帽，这是在该架构下的一组具体数值。","start":3482.46,"end":3488.2},{"id":323,"text":"architecture, yeah.","zh":"架构，是的。","start":3488.2,"end":3488.58},{"id":324,"text":"the way that we are using","zh":"我们使用的方式","start":3489.14,"end":3491.68},{"id":325,"text":"to represent x.","zh":"来表示x。","start":3491.68,"end":3493.12},{"id":326,"text":"That is the kind of modeling that we need.","zh":"这就是我们需要的建模方式。","start":3493.3,"end":3495.46},{"id":327,"text":"Yeah.","zh":"是的。","start":3496.4,"end":3496.7},{"id":328,"text":"Yeah.","zh":"是的。","start":3496.76,"end":3496.84},{"id":329,"text":"So there, yeah.","zh":"所以，是的。","start":3496.84,"end":3497.58},{"id":330,"text":"Yeah.","zh":"是的。","start":3497.68,"end":3498.02},{"id":331,"text":"Yeah.","zh":"是的。","start":3498.16,"end":3498.56},{"id":332,"text":"It can be any, yeah.","zh":"它可以是任何的，是的。","start":3498.62,"end":3499.82},{"id":333,"text":"So you still have to use the same model.","zh":"你仍然必须使用同一个模型。","start":3499.94,"end":3501.66},{"id":334,"text":"You cannot interpret and say that the numbers","zh":"你不能解释并说这些数字","start":3501.94,"end":3503.94},{"id":335,"text":"in a different way.","zh":"以不同的方式。","start":3503.94,"end":3505.28},{"id":336,"text":"It's still the same architecture.","zh":"它仍然是同一个架构。","start":3505.38,"end":3506.26},{"id":337,"text":"The architecture, which is ?","zh":"这个架构是？","start":3507.7,"end":3509.58},{"id":338,"text":"I mean the structure of the new .","zh":"我是说新结构的。","start":3509.58,"end":3511.92},{"id":339,"text":"Right.","zh":"对的。","start":3512.32,"end":3512.72},{"id":340,"text":"OK.","zh":"好的。","start":3512.74,"end":3513.02},{"id":341,"text":"Yeah.","zh":"是的。","start":3513.16,"end":3513.32},{"id":342,"text":"So you first pre-define a structure for the network.","zh":"因此，你首先需要为网络预定义一个结构。","start":3513.4,"end":3515.66},{"id":343,"text":"And then, but you don't know what the parameters are.","zh":"然后，但你并不知道参数是什么。","start":3516.04,"end":3518.1},{"id":344,"text":"you only know the structure, and then you try to find out a parameter and then use that","zh":"你只知道结构，然后尝试找出参数，并使用这些学习到的参数来计算表示。","start":3518.2,"end":3522.82},{"id":345,"text":"learned parameters to compute the representation.","zh":"学习到的参数来计算表示。","start":3523.62,"end":3527.94}],"notes":["本段讨论了表示学习中初始化对最终损失函数全局最小值的影响。讲者指出，即使使用相同的损失函数，不同的初始化会导致不同的全局最小值，而这些最小值在测试性能上可能有显著差异。","讲者强调，初始化对最终结果有重要影响，因为损失函数可能有多个全局最小值，而训练过程从随机初始化开始可能找到较差的最小值，而使用预训练模型的初始化则可能找到更好的最小值。","讲者提到，训练性能可能接近零，因为数据量有限，但测试性能可能因不同的全局最小值而有显著差异。因此，选择好的初始化是找到更好模型的关键。","讲者指出，表示学习的目标是学习一个函数，即参数θ，最终交付的是一个具体的参数集合，这些参数在特定架构下用于表示输入x。","讲者提到，模型的结构是预先定义的，但参数是未知的，需要通过训练来找到。学习的参数用于计算表示，而模型的结构保持不变。"],"formulas":[],"uncertainties":["affects your final global minimum. And that's actual proof that this loss function has a lot","of global minimum. You can find maybe millions of global minimum and not all of them are the same.","I think you always get to zero almost","there are multiple global minimum","they're all zero.","some of them is much better than the others.","the way that we are using","to represent x.","the structure of the new ."],"diagram":"none","start":3357.68,"end":3527.94,"asr_flags":[295,303,323,328],"boards":[],"translation_complete":true,"translated_segments":56,"raw_segments":[{"start":3357.68,"text":"And then you optimize both theta and the w afterwards."},{"start":3362.44,"text":"So in some sense, if you think about this,"},{"start":3364.98,"text":"the interesting part about this is"},{"start":3366.6,"text":"that the final loss function you are choosing here,"},{"start":3370.24,"text":"that in some sense, the loss function"},{"start":3371.68,"text":"itself doesn't have anything to do with the pre-training."},{"start":3378.82,"text":"Like you could imagine that I can just optimize the same loss function with random w and random"},{"start":3386.58,"text":"theta as the beginning, and then there's nothing to do with pre-training."},{"start":3390.04,"text":"You are just training from scratch, optimizing a gigantic model for both of the two parameters."},{"start":3395.04,"text":"However, somehow, if you initialize this parallel variable with a pre-trained model, you get"},{"start":3399.7,"text":"much better results."},{"start":3401.66,"text":"So if you think about that, it's kind of interesting because it's the same loss function, just"},{"start":3405.4,"text":"the initialization are different."},{"start":3407.08,"text":"So somehow in tradition,"},{"start":3408.96,"text":"affects your final global minimum. And that's actual proof that this loss function has a lot"},{"start":3413.98,"text":"of global minimum. You can find maybe millions of global minimum and not all of them are the same."},{"start":3419.8,"text":"If you use training from scratch, you start from somewhere,"},{"start":3422.72,"text":"like some random place, and you find one global minimum, which is not very good."},{"start":3427.66,"text":"Or you can use another initialization and you can find another global minimum,"},{"start":3432.86,"text":"and that one is better. Of course, better or worse also needs to be clarified."},{"start":3437.76,"text":"because here, by better or worse, I mean the test performance."},{"start":3442.4,"text":"In terms of the training performance,"},{"start":3444.46,"text":"I think you always get to zero almost"},{"start":3445.78,"text":"because you don't have a lot of data here."},{"start":3448.3,"text":"So basically, there are multiple global minimum"},{"start":3450.32,"text":"of this loss function."},{"start":3452.58,"text":"And in terms of the training loss, they're all zero."},{"start":3457.28,"text":"But in terms of test performance,"},{"start":3458.8,"text":"some of them is much better than the others."},{"start":3460.58,"text":"And how do you find the better ones?"},{"start":3461.88,"text":"You have to start with a good initialization."},{"start":3477.2,"text":"We are learning a function, we are learning a parameter theta. So basically the deliverable"},{"start":3482.46,"text":"here is the theta hat, which is a concrete set of numbers under this architecture."},{"start":3488.2,"text":"architecture, yeah."},{"start":3489.14,"text":"And this is the way that we are using"},{"start":3491.68,"text":"to represent x."},{"start":3493.3,"text":"That is the kind of modeling that we need."},{"start":3496.4,"text":"Yeah."},{"start":3496.76,"text":"Yeah."},{"start":3496.84,"text":"So there, yeah."},{"start":3497.68,"text":"Yeah."},{"start":3498.16,"text":"Yeah."},{"start":3498.62,"text":"It can be any, yeah."},{"start":3499.94,"text":"So you still have to use the same model."},{"start":3501.94,"text":"You cannot interpret and say that the numbers"},{"start":3503.94,"text":"in a different way."},{"start":3505.38,"text":"It's still the same architecture."},{"start":3507.7,"text":"The architecture, which is ?"},{"start":3509.58,"text":"I mean the structure of the new ."},{"start":3512.32,"text":"Right."},{"start":3512.74,"text":"OK."},{"start":3513.16,"text":"Yeah."},{"start":3513.4,"text":"So you first pre-define a structure for the network."},{"start":3516.04,"text":"And then, but you don't know what the parameters are."},{"start":3518.2,"text":"you only know the structure, and then you try to find out a parameter and then use that"},{"start":3523.62,"text":"learned parameters to compute the representation."}],"speech_gaps":[{"start":3466.96,"end":3469.52},{"start":3471.696,"end":3474.032}],"frame":"../frames/v052/021.webp","frame_time":3369.68},{"title":"表示学习中的线性探针与微调","segments":[{"id":346,"text":"So when we're applying the representation for a specific task, why is there a reasonable question that the","zh":"当我们应用表示来执行特定任务时，为什么会有这样一个合理的问题：","start":3534.9,"end":3540.98},{"id":347,"text":"the dependence on the representation is linear?","zh":"表示的依赖关系是线性的？","start":3540.98,"end":3542.88},{"id":348,"text":"There is no.","zh":"没有。","start":3543.9,"end":3544.88},{"id":349,"text":"That's a great question.","zh":"这是一个非常好的问题。","start":3546.1,"end":3548.48},{"id":350,"text":"It's not exactly an assumption, because when you pre-train,","zh":"这并不是一个假设，因为在预训练时，","start":3549.06,"end":3554.36},{"id":351,"text":"we haven't discussed this yet.","zh":"我们还没有讨论过这一点。","start":3554.54,"end":3556.42},{"id":352,"text":"When you are training these models,","zh":"当你在训练这些模型时，","start":3556.86,"end":3558.22},{"id":353,"text":"actually you try to make the representation linear.","zh":"实际上你试图让表示变得线性。","start":3558.86,"end":3560.92},{"id":354,"text":"Like the loss function, I didn't tell you","zh":"和损失函数一样，我还没有告诉你们","start":3561.78,"end":3564.36},{"id":355,"text":"what a loss function is.","zh":"什么是损失函数。","start":3564.36,"end":3565.12},{"id":356,"text":"So next, I shall tell you one example.","zh":"所以接下来，我将告诉你们一个例子。","start":3565.34,"end":3568.04},{"id":357,"text":"And you can see it's kind of like you","zh":"你可以看到它有点像你","start":3568.24,"end":3569.6},{"id":358,"text":"are trying to make it linear. So at least you're trying to make it usable in a linear fashion.","zh":"试图让它变得线性。所以至少你是在尝试以线性的方式使用它。","start":3569.6,"end":3576.8},{"id":359,"text":"So that's why it's somewhat linear.","zh":"这就是为什么它有点线性。","start":3577.14,"end":3580.9},{"id":360,"text":"So are we minimizing it together?","zh":"我们一起来最小化它吗？","start":3583.76,"end":3586.12},{"id":361,"text":"That's right. So in a linear probe, you only have one variable. There's no","zh":"没错。所以在一个线性探针中，你只有一个变量。没有","start":3593.86,"end":3599.2},{"id":362,"text":"There's no alternative anyway.","zh":"无论如何，没有其他选择。","start":3599.2,"end":3599.82},{"id":363,"text":"It's linear.","zh":"它是线性的。","start":3599.98,"end":3600.32},{"id":364,"text":"And then when you do fine-tuning,","zh":"然后当你进行微调时，","start":3600.56,"end":3601.76},{"id":365,"text":"you jointly train both of them.","zh":"你会同时训练这两个部分。","start":3601.88,"end":3603.58},{"id":366,"text":"So it's not linear anymore.","zh":"因此，它就不再是线性的了。","start":3603.98,"end":3605.26},{"id":367,"text":"And actually, there is also a technique called LPFT,","zh":"实际上，还有一种叫做LPFT的技术，","start":3607.6,"end":3611.98},{"id":368,"text":"which is actually probably the dominating approach right now","zh":"这可能是目前占主导地位的方法","start":3612.28,"end":3615.58},{"id":369,"text":"if you really want to go with this route.","zh":"如果你想走这条路的话。","start":3615.58,"end":3616.8},{"id":370,"text":"Of course, there are many other routes, but locally here,","zh":"当然，还有许多其他方法，但在这里局部来说，","start":3617.86,"end":3620.58},{"id":371,"text":"this is a good idea, which is the following.","zh":"这是一个不错的主意，具体如下。","start":3620.7,"end":3622.56},{"id":372,"text":"So LPFT means that you first do linear probe.","zh":"因此，LPFT意味着你首先进行线性探针。","start":3622.76,"end":3625.14},{"id":373,"text":"as the name suggests, is a linear probe and then fine-tuning.","zh":"正如名称所示，它是一个线性探针，然后进行微调。","start":3625.14,"end":3631.22},{"id":374,"text":"What that means is that you first do linear probe","zh":"这意味着你首先进行线性探针","start":3631.6,"end":3636.0},{"id":375,"text":"by only optimizing .","zh":"仅通过优化 .","start":3636.7,"end":3637.48},{"id":376,"text":"So let's say maybe this is a loss function, lw theta. Let's say just let's denote this to lw theta. The first thing is you minimize over w, and you put the theta part to be the initialization of the representation. So this is the lp part. And then maybe you get maybe this will give you maybe w.","zh":"所以，假设这可能是一个损失函数，lw theta。让我们假设只是将它记作 lw theta。第一步是你对 w 进行最小化，并将 theta 部分作为表示的初始化。因此，这就是 lp 部分。然后，也许这会给你也许 w。","start":3638.22,"end":3659.18},{"id":377,"text":"Let's say 0 and theta hat. Theta hat didn't change. And you get a new W0, which is the neutralization. And then you do Ft. So basically, you just keep minimizing both W and theta, this thing. But initialize here, initialize with the W0 and theta hat. So why this works better, I think it's a little bit hard to explain.","zh":"假设是 0 和 theta hat。theta hat 没有变化。然后你得到一个新的 W0，这是中性化。然后你进行 Ft。基本上，你只是继续同时最小化 W 和 theta，这个东西。但在这里初始化，初始化为 W0 和 theta hat。所以为什么这种方法更好，我想解释起来有点困难。","start":3661.84,"end":3686.85},{"id":378,"text":"We don't know exactly either. There are some theories about it. But roughly speaking, I think if you use a random vector in fine tuning,","zh":"我们并不确切知道。有一些理论涉及这一点。但大致来说，我认为如果你在微调中使用一个随机向量，","start":3688.74,"end":3698.66}],"notes":["本段讨论了表示学习中表示依赖线性的问题。讲者指出，虽然这不是一个明确的假设，但在预训练过程中，实际上会尝试使表示线性化。这可能是因为线性表示更容易在后续任务中使用，例如线性探针。","讲者提到，线性探针（linear probe）仅使用一个变量，而微调（fine-tuning）则会同时训练表示和任务参数，因此不再是线性的。这表明线性探针是一种简化的方法，而微调则更全面。","讲者还提到LPFT（Linear Probe and Fine-tuning）是一种当前主流的方法，它结合了线性探针和微调。这种方法的原理是先进行线性探针，使用初始化的表示参数，然后进行微调，同时优化表示和任务参数。","讲者指出，虽然LPFT为何有效尚无明确解释，但有一些理论支持。这表明该方法虽然有效，但其理论基础仍需进一步研究。","讲者提到在微调过程中使用随机向量可能有助于提高性能，但具体原因尚不明确。这表明在实际应用中，可能需要通过实验来验证不同方法的效果。","讲者强调，虽然线性探针是一种简化的方法，但微调能够更全面地优化表示和任务参数，因此在实际应用中可能更优。"],"formulas":[],"uncertainties":["在段落375中，'by only optimizing .' 的内容不完整，无法确定具体优化的目标。","在段落376中，'Let's say maybe this is a loss function, lw theta. Let's say just let's denote this to lw theta.' 的表述不清晰，无法确定损失函数的具体形式。","在段落377中，'So this is the lp part. And then maybe you get maybe this will give you maybe w.' 的表述不完整，无法确定具体的优化过程和结果。"],"diagram":"none","start":3534.9,"end":3698.66,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":33,"raw_segments":[{"start":3534.9,"text":"So when we're applying the representation for a specific task, why is there a reasonable question that the"},{"start":3540.98,"text":"the dependence on the representation is linear?"},{"start":3543.9,"text":"There is no."},{"start":3546.1,"text":"That's a great question."},{"start":3549.06,"text":"It's not exactly an assumption, because when you pre-train,"},{"start":3554.54,"text":"we haven't discussed this yet."},{"start":3556.86,"text":"When you are training these models,"},{"start":3558.86,"text":"actually you try to make the representation linear."},{"start":3561.78,"text":"Like the loss function, I didn't tell you"},{"start":3564.36,"text":"what a loss function is."},{"start":3565.34,"text":"So next, I shall tell you one example."},{"start":3568.24,"text":"And you can see it's kind of like you"},{"start":3569.6,"text":"are trying to make it linear. So at least you're trying to make it usable in a linear fashion."},{"start":3577.14,"text":"So that's why it's somewhat linear."},{"start":3583.76,"text":"So are we minimizing it together?"},{"start":3593.86,"text":"That's right. So in a linear probe, you only have one variable. There's no"},{"start":3599.2,"text":"There's no alternative anyway."},{"start":3599.98,"text":"It's linear."},{"start":3600.56,"text":"And then when you do fine-tuning,"},{"start":3601.88,"text":"you jointly train both of them."},{"start":3603.98,"text":"So it's not linear anymore."},{"start":3607.6,"text":"And actually, there is also a technique called LPFT,"},{"start":3612.28,"text":"which is actually probably the dominating approach right now"},{"start":3615.58,"text":"if you really want to go with this route."},{"start":3617.86,"text":"Of course, there are many other routes, but locally here,"},{"start":3620.7,"text":"this is a good idea, which is the following."},{"start":3622.76,"text":"So LPFT means that you first do linear probe."},{"start":3625.14,"text":"as the name suggests, is a linear probe and then fine-tuning."},{"start":3631.6,"text":"What that means is that you first do linear probe"},{"start":3636.7,"text":"by only optimizing ."},{"start":3638.22,"text":"So let's say maybe this is a loss function, lw theta. Let's say just let's denote this to lw theta. The first thing is you minimize over w, and you put the theta part to be the initialization of the representation. So this is the lp part. And then maybe you get maybe this will give you maybe w."},{"start":3661.84,"text":"Let's say 0 and theta hat. Theta hat didn't change. And you get a new W0, which is the neutralization. And then you do Ft. So basically, you just keep minimizing both W and theta, this thing. But initialize here, initialize with the W0 and theta hat. So why this works better, I think it's a little bit hard to explain."},{"start":3688.74,"text":"We don't know exactly either. There are some theories about it. But roughly speaking, I think if you use a random vector in fine tuning,"}],"speech_gaps":[{"start":3587.072,"end":3590.928}],"frame":"../frames/v052/022.webp","frame_time":3546.9},{"title":"表示学习中的参数调整方法","segments":[{"id":379,"text":"You have both w. And w is random, and theta is fixed. Theta is kind of like an appraisal model. Sometimes the random w will destroy the representation a little bit. So it's better probably to just first fix it ahead and then do some. You first make the w and the theta fit together, and then you optimize both. When you optimize both, you do change the representation. But the change of the representation after the LP step is smaller.","zh":"你同时拥有 w。并且 w 是随机的，而 theta 是固定的。Theta 好像是一种评估模型。有时候随机的 w 会稍微破坏表示。因此，可能更好的做法是先固定它，然后再进行一些操作。你首先让 w 和 theta 相互适应，然后你再同时优化两者。当你同时优化两者时，你会改变表示。但 LP 步骤之后表示的变化会更小。","start":3699.84,"end":3727.34},{"id":380,"text":"compared to you just use the random weights. Anyway, so that's another approach. Let me see. I have 10 minutes. Let me see. So maybe in the next 10 minutes, let me discuss another generic adaptation technique, which is called Laura.","zh":"与你仅仅使用随机权重相比，无论如何，这又是另一种方法。让我看看。我有 10 分钟。让我看看。也许在接下来的 10 分钟里，我将讨论另一种通用的适应技术，称为 Laura。","start":3728.18,"end":3760.46},{"id":381,"text":"I think this is something you probably should notice, even though it's probably only useful for certain cases. So it's called lower or low rank adaptation. And this idea is kind of like an agnostic to exactly how you adapt, as long as you are minimizing some","zh":"我认为这可能是你应该注意的事情，尽管它可能只在某些情况下有用。因此，它被称为低秩适应。这个想法基本上是与你如何适应无关，只要你在适应过程中最小化某些损失函数，你就不只是进行零样本学习，那么你就可以应用低秩适应。","start":3770.1,"end":3794.23},{"id":382,"text":"loss functions in adaptation, you are not just doing zero-shot, then you can apply the lower. So basically, the idea is that when you, for example, when you do this fine-tuning, you are changing the theta, all the parameters in theta. So the theta often is kind of like a very gigantic model. The approaching model is also very big. But you only have a small number of factors.","zh":"基本上，这个想法是，当你例如进行微调时，你是在改变 theta 中的所有参数。因此，theta 通常像一个非常庞大的模型。接近的模型也是非常大的。但你只拥有少量的因子。","start":3794.86,"end":3816.51},{"id":383,"text":"you are not really trying to change your preaching model by a lot, in some sense, because the preaching model is very powerful. You are only adapting it a little bit, as the name suggests. Adapting means you don't have to change much. So in some sense, it's questionable why you have to change so many billions of parameters to do your task. Maybe you just have to change a little bit. There is no need to change everything. And also, if you change every parameters, maybe it's kind of like,","zh":"你并不是真的试图大幅改变你的预训练模型，从某种意义上说，因为预训练模型非常强大。你只是稍微地对其进行适应，正如名称所暗示的那样。适应意味着你不需要改变很多。因此，从某种意义上说，为什么你需要改变数十亿个参数来完成你的任务是值得怀疑的。也许你只需要稍微改变一点。没有必要改变所有内容。而且，如果你改变所有参数，可能就像，","start":3817.11,"end":3845.61},{"id":384,"text":"you are more vulnerable to overfitting, so on and so forth. And at least it's kind of like overkill to some degree. So that's why people say, oh, maybe let's not change all the parameters, or at least not use all the degree of freedom. It's very hard to say, oh, I'm only changing a subset of parameters, because you don't know which subset you should change, actually. It's all matrices. And so that's why the solution is that you say, I'm not going to change. I'm going to","zh":"你更容易过拟合，所以如此等等。而且至少在某种程度上来说，这有点过度了。这就是为什么人们会说，哦，也许我们不要改变所有的参数，或者至少不要使用所有的自由度。很难说，哦，我只改变参数的一个子集，因为你实际上并不知道应该改变哪个子集。一切都是矩阵。因此，解决方案是，你说，我不会改变。我要","start":3846.95,"end":3873.29}],"notes":["本段讨论了在表示学习中，参数调整的必要性。讲者指出，当模型已经非常强大时，不需要对所有参数进行大规模调整，因为这可能导致过拟合。因此，提出了一种更高效的方法，即只调整部分参数，而不是全部参数。","讲者提到，调整参数时，如果模型本身已经非常强大，那么只需要对参数进行小幅度的调整即可完成任务。这避免了对所有参数进行大规模修改，从而减少了过拟合的风险。","讲者进一步指出，调整参数时，如果对所有参数进行修改，可能会导致模型变得过于复杂，从而增加过拟合的可能性。因此，提出了一种更合理的做法，即只调整部分参数，而不是全部参数。","讲者强调，由于参数调整的复杂性，很难确定应该调整哪些参数。因此，提出了一种解决方案，即不调整所有参数，而是只调整部分参数，以减少计算负担和过拟合的风险。","讲者提到，调整参数时，如果模型本身已经非常强大，那么只需要对参数进行小幅度的调整即可完成任务。这避免了对所有参数进行大规模修改，从而减少了过拟合的风险。","讲者指出，调整参数时，如果对所有参数进行修改，可能会导致模型变得过于复杂，从而增加过拟合的可能性。因此，提出了一种更合理的做法，即只调整部分参数，而不是全部参数。"],"formulas":[],"uncertainties":["preaching model（可能为pretrained model的误听）","degree of freedom（可能为degrees of freedom的误听）"],"diagram":"none","start":3699.84,"end":3873.29,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3699.84,"text":"You have both w. And w is random, and theta is fixed. Theta is kind of like an appraisal model. Sometimes the random w will destroy the representation a little bit. So it's better probably to just first fix it ahead and then do some. You first make the w and the theta fit together, and then you optimize both. When you optimize both, you do change the representation. But the change of the representation after the LP step is smaller."},{"start":3728.18,"text":"compared to you just use the random weights. Anyway, so that's another approach. Let me see. I have 10 minutes. Let me see. So maybe in the next 10 minutes, let me discuss another generic adaptation technique, which is called Laura."},{"start":3770.1,"text":"I think this is something you probably should notice, even though it's probably only useful for certain cases. So it's called lower or low rank adaptation. And this idea is kind of like an agnostic to exactly how you adapt, as long as you are minimizing some"},{"start":3794.86,"text":"loss functions in adaptation, you are not just doing zero-shot, then you can apply the lower. So basically, the idea is that when you, for example, when you do this fine-tuning, you are changing the theta, all the parameters in theta. So the theta often is kind of like a very gigantic model. The approaching model is also very big. But you only have a small number of factors."},{"start":3817.11,"text":"downstream data points. And you are not really trying to change your preaching model by a lot, in some sense, because the preaching model is very powerful. You are only adapting it a little bit, as the name suggests. Adapting means you don't have to change much. So in some sense, it's questionable why you have to change so many billions of parameters to do your task. Maybe you just have to change a little bit. There is no need to change everything. And also, if you change every parameters, maybe it's kind of like,"},{"start":3846.95,"text":"you are more vulnerable to overfitting, so on and so forth. And at least it's kind of like overkill to some degree. So that's why people say, oh, maybe let's not change all the parameters, or at least not use all the degree of freedom. It's very hard to say, oh, I'm only changing a subset of parameters, because you don't know which subset you should change, actually. It's all matrices. And so that's why the solution is that you say, I'm not going to change. I'm going to"}],"speech_gaps":[],"frame":"../frames/v052/023.webp","frame_time":3711.84},{"title":"低秩适应（Low-Rank Adaptation）","segments":[{"id":385,"text":"I had a low rank update. I'm going to restrict the degree of freedom, even though I changed all the parameters, but I restricted the degree of freedom in my change. So in some sense, it's kind of like if you have a matrix W, right? So if you fine-tune it, you're going to change all the parameters here, right? But now you say, I'm going to reparameterize this model to be W plus A times B. If W is like this matrix, and you say, I have a W plus.","zh":"我进行了一次低秩更新。我将限制自由度，尽管我改变了所有参数，但我是在我的变化中限制了自由度。所以从某种意义上说，这有点像如果你有一个矩阵W，对吧？所以如果你进行微调，你将在这里改变所有参数，对吧？但现在你说，我要重新参数化这个模型为W加上A乘以B。如果W是这样的矩阵，你说，我有W加上。","start":3874.59,"end":3902.39},{"id":386,"text":"A and B like this. And its inner rank is R, which is low rank. So which is small.","zh":"A和B像这样。它的内秩是R，这是一个低秩。所以R是小的。","start":3903.49,"end":3911.23},{"id":387,"text":"So basically, a and b has much fewer number of degree of freedom than the whole matrix because if you think about it, suppose you have a n by d by d matrix. Before, you have d squared degree of freedom. And now you have dr, 2dr degree of freedom. If r is much smaller than d, maybe d is like 1,000 and r is only 10, then 2dr is much smaller than d squared. So you say, I'm going to only","zh":"所以基本上，a和b的自由度数量比整个矩阵要少得多。如果你想想，假设你有一个n乘d乘d的矩阵。之前，你有d平方个自由度。现在你有dr，2dr个自由度。如果r比d小很多，比如d是1,000，而r只有10，那么2dr会比d平方小很多。所以你说，我要只","start":3911.7,"end":3932.84},{"id":388,"text":"restrict my update to be a plus b, obviously a times b of this form. And this restricts the degree of freedom in my change. So in some sense, it's kind of like, as opposed to you minimize the loss of w, right? So this is what you do before. I say, in adaptation, now you say, I'm going to minimize l of w plus ab.","zh":"限制我的更新为a加上b，显然这是这种形式的a乘以b。这限制了我在变化中的自由度。所以从某种意义上说，这与你最小化w的损失相反，对吧？这就是你之前所做的。现在你说，在适应中，你将最小化l的w加上ab。","start":3934.19,"end":3960.47},{"id":389,"text":"where w, maybe let's say this is w0, and then you minimize over a, b. So before you are minimizing over w, your w","zh":"其中w，也许我们说这是w0，然后你最小化a和b。之前你是在最小化w，你的w","start":3961.93,"end":3968.29},{"id":390,"text":"So in this case, I say u. So maybe let's say. So you say w is initialized to be w0, which is what you trained before. And then you minimize w. That's the typical fine tuning. And now you say, I'm going to fix w0, and I'm going to minimize over a and b. And I can initialize a to be 0 and b to be some random matrix so that initialization is the same. Because if a is 0, then w0 is the same as w0 here at the initialization. And then you only minimize over the two variables a and b.","zh":"所以在这种情况下，我说u。也许我们说。所以你说w被初始化为w0，这是你之前训练的。然后你最小化w。这是典型的微调。现在你说，我要固定w0，然后最小化a和b。我可以将a初始化为0，b初始化为某个随机矩阵，使得初始化相同。因为如果a是0，那么w0在这里的初始化与w0相同。然后你只最小化两个变量a和b。","start":3969.33,"end":3997.39},{"id":391,"text":"So that's called low rank adaptation.","zh":"这就是所谓的低秩适应。","start":3998.19,"end":4002.79},{"id":392,"text":"Yes, yes. So, you know, if you just have one matrix, then it's d squared degree of freedom again. So that's why you have the low rank parametrization to make the degree of freedom much smaller. But then we are also adding some bias, kind of symmetry bias. Because we are doing a cross pattern there. That, I don't think so. That, I don't think so. Because a and b are not equal, right? So in some sense, you're just saying it's low rank. I'm not sure there's additional symmetry there.","zh":"是的，是的。所以，如果你只有一个矩阵，那么它仍然是d平方的自由度。这就是为什么你需要低秩参数化来使自由度大大减少。但是，我们也在添加一些偏置，某种对称性偏置。因为在那儿我们做的是交叉模式。那，我不这么认为。那，我不这么认为。因为a和b并不相等，对吧？从某种意义上说，你只是在说它是低秩的。我不确定那里还有额外的对称性。","start":4020.76,"end":4050.64}],"notes":["本段讲解了低秩适应（Low-Rank Adaptation）的概念，即通过将模型参数重新参数化为低秩矩阵的形式，以减少自由度。讲者提到，传统的微调（fine-tuning）是直接调整所有参数，而低秩适应则通过引入两个低秩矩阵A和B，使得更新仅发生在A和B上，从而减少自由度。","讲者通过一个具体的例子说明了低秩适应的优势：假设原始矩阵是d×d的，自由度为d²；而通过低秩参数化，自由度变为2dr，其中r是低秩的秩。当r远小于d时，自由度显著减少，例如当d=1000，r=10时，2dr=20000，远小于d²=1,000,000。","讲者进一步说明了低秩适应的实现方式：初始化W为之前训练的参数w0，然后通过调整A和B来更新模型。初始化时，A设为0，B设为随机矩阵，这样初始化后的W仍为w0，之后仅对A和B进行优化。","讲者指出，虽然低秩参数化引入了某种对称性（如交叉模式），但A和B并不相等，因此这种对称性并不明显。讲者最后强调，低秩适应的核心在于减少自由度，而不是引入额外的对称性。","讲者提到，低秩适应适用于矩阵参数，其自由度由d²减少为2dr，这使得模型在保持性能的同时，减少了计算和存储需求。这种技术在模型微调中被广泛应用，尤其是在参数量较大的模型中。","讲者还提到，低秩适应的实现需要考虑初始化策略，例如将A初始化为0，B初始化为随机矩阵，以确保模型在优化前的初始状态与传统微调一致。这种策略有助于保持模型的稳定性，并减少训练过程中的偏差。"],"formulas":[{"latex":"d^{2}","symbols":"原始矩阵的自由度","explanation":"表示原始矩阵的自由度为 $ d^2 $，其中 $ d $ 是矩阵的维度。","evidence":"So basically, a and b has much fewer number of degree of freedom than the whole matrix because if you think about it, suppose you have a n by d by d matrix. Before, you have
