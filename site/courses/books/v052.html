p theta xt minus one given xt."},{"start":273.35,"text":"So, and"},{"start":277.49,"text":"minus KL between q xt"},{"start":282.51,"text":"given"},{"start":288.51,"text":"given 0, p theta xt plus expectation log p theta x0 given x1 to t."},{"start":314.13,"text":"so last time we only focused"},{"start":316.05,"text":"we only had time to discuss this term"},{"start":317.91,"text":"this is a KL between two Gaussian distributions"},{"start":320.33,"text":"one of the Gaussian distributions is this one"},{"start":322.77,"text":"and the other Gaussian distribution I think"},{"start":326.69,"text":"probably if you recall"},{"start":327.73,"text":"the other Gaussian distribution is xt minus 1"},{"start":330.43,"text":"given xt x0"},{"start":333.81,"text":"this distribution is equal to"},{"start":338.05,"text":"to mu tilde t x t x zero"},{"start":345.95,"text":"with covariance beta t, beta tilde t."}],"speech_gaps":[],"frame":"../frames/v052/002.webp","frame_time":192.91},{"title":"表示学习中的KL散度与损失函数","segments":[{"id":38,"text":"And then we discussed that at the end of the last lecture, these are two Gaussian distributions. If you look at KL, it's actually just comparing the mean. Actually, we chose the variance to match. And that's why the KL between two Gaussian distributions is really just comparing the mean of the two distributions. So that's why if you call this term, I think notation we use is LT minus 1."},{"id":39,"text":"there's different t's and we say this is the iot minus one and iot minus one is equals to basically comparing the mean of these two distributions is some expectation of one over two beta t tilde and you look at the mean the difference of the mean this is the mean for the q and the mean for the p theta is mu theta xt t"},{"id":40,"text":"And you do L2 norm squared. And this expectation is over Q, meaning that, strictly speaking, you are generating, because Xt is a random variable, you are generating Xt from Q. And for every realization or instantiation of Xt, you have"},{"id":41,"text":"two numbers, you compare them, you take the square and you average over the choice of x . So that's the loss function we derived formally from this lower bound. That's only one term or one sequence of terms. That's the term for L . And let's also discuss these two other terms very briefly. So this term is actually just zero because if you"},{"id":42,"text":"I guess I need to throw away this so that I don't get confused. So this term is just 0."},{"id":43,"text":"because we assume that t is going to infinity and recall that pt, the distribution of pt assumes to be an entity, the standard normal distribution with mean zero and variance identity. And we established that when t goes to infinity, x t given x zero is also standard normal Gaussian because you add too much noise so that the noise just washes out the signal."},{"id":44,"text":"So that's why both of these are the standard normal Gaussian. They have the same distribution, and the KL is 0. So this is 0. Circuit-speaking, this is converging 0 as t goes to infinity. So we just assume it's 0. And this term is often, in literature, denoted as L1, because it actually does have almost the same term as all the other LT terms, even though"}],"notes":["本段讲解了KL散度在高斯分布之间的计算方式，指出KL散度仅比较两个分布的均值，而方差被设定为匹配。这表明在表示学习中，KL散度的计算主要关注均值差异，而非方差差异。","接着，讲者提到在计算KL散度时，需要考虑不同时间步t的差异，并指出该过程涉及对均值差异的期望计算，其中包含对1/(2β̃t)的期望。这表明KL散度的计算不仅涉及均值比较，还涉及时间步t的参数调整。","随后，讲者解释了L2范数平方的使用，强调该期望是基于分布Q的，意味着Xt是一个随机变量，需要从Q中生成。对于每个Xt的实现，都会计算均值差异的平方，并对所有Xt的实现进行平均，从而得到损失函数。","讲者还提到，当t趋于无穷大时，假设pt是标准正态分布，且Xt在给定X0的情况下也趋于标准正态分布，因为噪声的累积会“淹没”信号。这表明在表示学习中，随着时间步的增加，分布趋于平稳。","最后，讲者指出，当两个分布均为标准正态分布时，KL散度为0，因此该项可以忽略。同时，该项在文献中通常被标记为L1，因为它与其它LT项具有相似的结构，尽管在细节上可能有所不同。","这些内容展示了表示学习中如何通过KL散度和损失函数来建模分布之间的差异，并通过时间步的调整和噪声的累积来实现分布的收敛。"],"formulas":[],"uncertainties":["iot minus one","beta t tilde","circuit-speaking"],"diagram":"none","start":350.68,"end":512.44,"asr_flags":[],"math_clarifications":["KL散度不能仅通过比较均值来计算，应涉及对数概率密度函数的期望。原文中KL散度的计算方式不准确，需修正。","损失函数L的定义需更明确，包括其与KL散度的关系及具体分布条件。","当t趋于无穷大时，Xt|X0为标准正态分布，但未明确说明pt的分布，且未提及具体条件或假设。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":350.68,"text":"And then we discussed that at the end of the last lecture, these are two Gaussian distributions. If you look at KL, it's actually just comparing the mean. Actually, we chose the variance to match. And that's why the KL between two Gaussian distributions is really just comparing the mean of the two distributions. So that's why if you call this term, I think notation we use is LT minus 1."},{"start":375.1,"text":"there's different t's and we say this is the iot minus one and iot minus one is equals to basically comparing the mean of these two distributions is some expectation of one over two beta t tilde and you look at the mean the difference of the mean this is the mean for the q and the mean for the p theta is mu theta xt t"},{"start":406.34,"text":"And you do L2 norm squared. And this expectation is over Q, meaning that, strictly speaking, you are generating, because Xt is a random variable, you are generating Xt from Q. And for every realization or instantiation of Xt, you have"},{"start":429.84,"text":"two numbers, you compare them, you take the square and you average over the choice of x . So that's the loss function we derived formally from this lower bound. That's only one term or one sequence of terms. That's the term for L . And let's also discuss these two other terms very briefly. So this term is actually just zero because if you"},{"start":455.59,"text":"I guess I need to throw away this so that I don't get confused. So this term is just 0."},{"start":466.24,"text":"because we assume that t is going to infinity and recall that pt, the distribution of pt assumes to be an entity, the standard normal distribution with mean zero and variance identity. And we established that when t goes to infinity, x t given x zero is also standard normal Gaussian because you add too much noise so that the noise just washes out the signal."},{"start":489.05,"text":"So that's why both of these are the standard normal Gaussian. They have the same distribution, and the KL is 0. So this is 0. Circuit-speaking, this is converging 0 as t goes to infinity. So we just assume it's 0. And this term is often, in literature, denoted as L1, because it actually does have almost the same term as all the other LT terms, even though"}],"speech_gaps":[],"frame":"../frames/v052/003.webp","frame_time":362.68},{"title":"表示学习中的概率建模","segments":[{"id":45,"text":"like, on the surface, it looks different. But actually, they have the same form of the same formula. So I think I will probably not go through all the details. But maybe let me show you a rough idea on how to derive this term. So sometimes, it's kind of like, eventually, you'll find out that it's almost the same as the LT minus 1 term. So basically, the first thing to deal with, so this is for L1."},{"id":46,"text":"So for L1, the first thing to realize is that P theta X0 given X1 to T, right? So this thing is the same as P0, PX0, P theta X0 given X1 because of the Markov property. You don't have to even look at any of the X2 up to XT if you condition X1. So that's what the Markov property tells us. And this..."},{"id":47,"text":"And then you can just choose. We haven't actually even specified the distribution p theta for x0 and x1. We have specified it for a larger t, but for x0 and x1, we haven't discussed it. We can just write this. We can make the same assumption. Let's say this is an"},{"id":48,"text":"mu theta x1 1, say, sigma 1 squared. I think sigma 1 squared here is the virus."},{"id":49,"text":"you know that you are just looking at the log likelihood of a Gaussian distribution. A log likelihood of a Gaussian distribution is pretty much just you take the log of the Gaussian distribution that has exponential in it. Once you take the log, it's just really what's inside exponential. So log of the density is really something function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
