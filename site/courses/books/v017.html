66}],"notes":["本段讲解了CVX工具如何将优化问题转换为可解形式，并通过多次简化后传递给求解器。讲者强调了求解器的多样性，如SCS、OSQP等并非内点法，而ECOS、Claribel等则多为内点法或障碍法。这表明求解器的选择会影响求解过程。","讲者指出，求解器主要执行线性代数操作，尤其是利用稀疏性来加速计算。这说明优化问题的结构对求解效率有重要影响。","讲者提到内点法和障碍法之间的区别不大，认为障碍法是较早的术语，而内点法是当前更常用的称呼。这表明术语的演变反映了算法的发展。","讲者以一个具有10,000个变量和5,000个约束的线性规划问题为例，说明现代求解器可以在20次迭代中达到极高的精度。这展示了优化算法在处理大规模问题上的强大能力。","讲者强调了优化问题求解过程的透明性，即从问题输入到求解器执行的整个流程已被理解，这有助于学生掌握实际应用中的技术细节。","讲者通过实际例子说明了优化算法在现实中的应用价值，如高频交易中的快速求解器实现，这表明课程内容与实际工程问题密切相关。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2352.81,"end":2511.66,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2352.81,"text":"If you end up at a high frequency trading firm or something like that, and you're going to implement a tiny QP or LP solver that should solve in like 50 microseconds, now you know that you can do it and it's not a big deal. So that was the sole reason to do this part of the course, but I think it's actually kind of important. Okay. Any questions about it? It's kind of cool. So actually now the whole stack is demystified for you."},{"start":2379.41,"text":"Because here's what it does. When you type in CVX pi, CVX pi does, forms a sequence of equivalent problems. It starts with your problem. It does a reduction, makes it a completely equivalent problem with a retrieval method, right? Then reduces it again and again, maybe 12, 15, 20 reductions later, it looks up and it says, I have a form that one of my solvers can solve. Everybody following this? Then,"},{"start":2408.83,"text":"It passes it off to the solver. They are not all interior point methods. SCS, for example, is not. OSQP is not. But many others are. So ECOS, Claribel, commercial ones are almost entirely. In fact, I guess almost entirely. They are barrier and interior point methods, right? And now you know at least a little bit of the details of those. If you go down, drill down deeper."},{"start":2436.25,"text":"What you know is if you profile one of these things, it is only doing the following. Linear algebra. Absolutely nothing else. The linear algebra it's doing is actually mostly just exploiting sparsity. And that's it. So now, in a weird way, you kind of know everything. At least the full stack from what happens when you type in my prob dot solve."},{"start":2461.52,"text":"And now you kind of know. So, yeah. Is there a difference between saying interior point methods or barrier methods? Yeah, let's see. No, not really. So barrier method, I think, is kind of an older term. I kind of like it because it's kind of a cool retro term. Yeah, it's usually pretty much the same. So, yeah. So interior point, I think, is what most people would call it these days. So, yeah, I mean."},{"start":2490.58,"text":"It's still, you have to admit, it's pretty stunning that you can solve an LP with like 10,000 variables and 5,000 constraints, you know, in 20 iterations. And that's to like extremely high precision, right? That's very weird, right? Because basically you want to find a particular vertex in this polyhedron."}],"speech_gaps":[],"frame":"../frames/v017/015.webp","frame_time":2364.81},{"title":"凸优化中的问题转换与简化方法","segments":[{"id":121,"text":"of which there's a number equal to the number of subatomic particles in the universe, including dark matter, right? And what it does is it basically stops and asks for directions 20 times. That's, to me, very weird. I mean, it's cool. We're all very lucky because we're beneficiaries of it. But it's very cool, right? I still don't get it. There are people who...","zh":"其中有一个数量等于宇宙中基本粒子的数量，包括暗物质，对吧？它所做的基本上是停下来并20次请求方向。这对我来说非常奇怪。我是说，这很酷。我们都很幸运，因为我们是受益者。但这是非常酷的，对吧？我仍然不理解。有这样的人……","start":2512.13,"end":2539.08},{"id":122,"text":"claim to understand why this works, but I don't believe them. So, or at least I didn't get the word. Yes. Can you give an example of how CDX5 reduces the problem or comes up with? Sure. It's actually, so we did a lot. We did that very early on. I don't know if you remember we did that.","zh":"声称理解为什么它起作用，但我并不相信他们。所以，或者至少我没有理解这个词。是的。你能举一个CDX5如何简化问题或得出结论的例子吗？当然可以。实际上，我们做了很多。我们很早就做了这件事。我不知道你是否记得我们做过。","start":2539.6,"end":2557.98},{"id":123,"text":"You don't have to think about anything. That's a much more interesting reduction. All of those you would know about. Most of the reductions are actually really dumb. They're really boring. Here's one. You want to maximize an objective. Well, no solver solves that problem. Here's an equivalent problem. Ready? Minimize minus the objective. There you go.","zh":"你不需要考虑任何事情。这是一次更有趣的简化。你都会知道这些。大多数的简化实际上都是非常无聊的。它们真的很无聊。举个例子，你想最大化一个目标函数。好吧，没有求解器能解决这个问题。这里有一个等价的问题。准备好了吗？最小化负的目标函数。就是这样。","start":2558.78,"end":2585.95},{"id":124,"text":"I mean, that's a reduction. It's kind of dumb, right? And then the retrieval method is simple. The retrieval method is that you just replicate x, the solution, but you change the optimal value by flipping the sign. So these reductions range between, most of them are deeply boring, like the one I just said, and a handful of them are actually kind of interesting.","zh":"我是说，这就是一种简化。它有点无聊，对吧？然后检索方法很简单。检索方法就是你复制x，即解，但通过改变符号来改变最优值。因此，这些简化方法从大多数非常无聊的，比如我刚才说的那个，到少数几个实际上有点有趣的，范围不一。","start":2586.32,"end":2613.98},{"id":125,"text":"I mean, that's a reduction. It's kind of dumb, right? And then the retrieval method is simple. The retrieval method is that you just replicate x, the solution, but you change the optimal value by flipping the sign. So these reductions range between, most of them are deeply boring, like the one I just said, and a handful of them are actually kind of interesting.","zh":"我是说，这就是一种简化。它有点无聊，对吧？然后检索方法很简单。检索方法就是你复制x，即解，但通过改变符号来改变最优值。因此，这些简化方法从大多数非常无聊的，比如我刚才说的那个，到少数几个实际上有点有趣的，范围不一。","start":2614.46,"end":2637.32},{"id":126,"text":"That was kind of a non-answer, but you have seen these in maybe week four of the course.","zh":"这有点像一个没有回答的问题，但你可能在课程的第四周已经见过这些。","start":2639.28,"end":2644.06},{"id":127,"text":"Ah, okay. Well, now that's another story, right? So it actually finds a shortest path in the graph, right? So it takes a problem. It estimates what is the most specific. I mean, this is just because you asked, right? It looks at your problem and says, I could compile that to a QP and a second order cone program or something like that. Then it looks among your solvers, unless you specified one, it looks for the one that's most specific.","zh":"啊，明白了。那么，这就完全是另一回事了，对吧？所以它实际上是在图中寻找最短路径，对吧？所以它处理一个问题。它估计什么是最具体的。我是说，这仅仅是因为你提出了问题，对吧？它查看你的问题，并说，我可以将它编译成一个二次规划问题和一个二次锥规划问题之类的。然后它在你的求解器中查找，除非你指定了某个求解器，否则它会寻找最具体的那个。","start":2648.3,"end":2675.6}],"notes":["本段主要讲解了凸优化中问题转换（reduction）的概念，强调了大多数转换方法较为简单和无聊，但也有少数较为有趣和复杂的转换。例如，将最大化问题转换为最小化负目标函数的问题，这种转换方法虽然简单，但却是实际应用中常见的技巧。","讲者提到，问题转换的目的是将原始问题转化为更容易求解的标准形式，例如二次规划（QP）或二阶锥规划（SOCP）。这种转换方法依赖于对问题结构的理解，并且在实际应用中，优化求解器会自动选择最合适的转换方式。","讲者还提到，问题转换的范围从非常基础的转换（如最大化问题转换为最小化负目标函数）到较为复杂的转换（如处理向量中最大3.5个元素的和），后者属于凸函数，并且在CVX中可以通过特定函数实现。","讲者指出，虽然大多数问题转换方法较为简单，但它们在实际应用中仍然非常重要，因为它们能够将复杂问题简化为标准形式，从而利用现有的优化求解器进行求解。","此外，讲者还提到，问题转换的实现依赖于对问题结构的深入理解，例如在处理图问题时，可以将其转换为最短路径问题，从而利用现有的图算法进行求解。","最后，讲者指出，问题转换是凸优化中的一个重要概念，它不仅能够简化问题，还能提高求解效率，是实际应用中不可或缺的工具。"],"formulas":[{"latex":"minimize -f(x)","symbols":"将最大化问题转换为最小化负目标函数","explanation":"该公式正确地将最大化问题转换为最小化负目标函数，这是优化问题中常见的转换方法。","evidence":"What happens is you actually don't do a lot of those now because it's done for you. The reduction would be like introduction of a slack variable, right? It would be, I mean, the interesting ones would be how to handle, I mean, an interesting one would be how do we handle the sum of the 3.5 largest entries of a vector? That's a convex function. It's in CVX pi, sum largest, x comma 3.5."}],"uncertainties":["sum largest, x comma 3.5"],"diagram":"none","start":2512.13,"end":2675.6,"asr_flags":[],"math_clarifications":["原始文本中提到的CDX5和相关优化问题的讨论未包含具体的数学公式，因此无法进一步核对。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2512.13,"text":"of which there's a number equal to the number of subatomic particles in the universe, including dark matter, right? And what it does is it basically stops and asks for directions 20 times. That's, to me, very weird. I mean, it's cool. We're all very lucky because we're beneficiaries of it. But it's very cool, right? I still don't get it. There are people who..."},{"start":2539.6,"text":"claim to understand why this works, but I don't believe them. So, or at least I didn't get the word. Yes. Can you give an example of how CDX5 reduces the problem or comes up with? Sure. It's actually, so we did a lot. We did that very early on. I don't know if you remember we did that."},{"start":2558.78,"text":"What happens is you actually don't do a lot of those now because it's done for you. The reduction would be like introduction of a slack variable, right? It would be, I mean, the interesting ones would be how to handle, I mean, an interesting one would be how do we handle the sum of the 3.5 largest entries of a vector? That's a convex function. It's in CVX pi, sum largest, x comma 3.5."},{"start":2586.32,"text":"You don't have to think about anything. That's a much more interesting reduction. All of those you would know about. Most of the reductions are actually really dumb. They're really boring. Here's one. You want to maximize an objective. Well, no solver solves that problem. Here's an equivalent problem. Ready? Minimize minus the objective. There you go."},{"start":2614.46,"text":"I mean, that's a reduction. It's kind of dumb, right? And then the retrieval method is simple. The retrieval method is that you just replicate x, the solution, but you change the optimal value by flipping the sign. So these reductions range between, most of them are deeply boring, like the one I just said, and a handful of them are actually kind of interesting."},{"start":2639.28,"text":"That was kind of a non-answer, but you have seen these in maybe week four of the course."},{"start":2648.3,"text":"Ah, okay. Well, now that's another story, right? So it actually finds a shortest path in the graph, right? So it takes a problem. It estimates what is the most specific. I mean, this is just because you asked, right? It looks at your problem and says, I could compile that to a QP and a second order cone program or something like that. Then it looks among your solvers, unless you specified one, it looks for the one that's most specific."}],"speech_gaps":[],"frame":"../frames/v017/016.webp","frame_time":2524.13},{"title":"凸优化中的L1范数与稀疏性","segments":[{"id":128,"text":"In that case, it might pick the QP or something like that. So then it actually has a shortest path. It tries to figure out, is there a sequence of transformations that will take this problem to a QP? So that's roughly what it does. Cool. Okay, so weirdly, I think now everything is demystified. I mean, maybe not every detail, but if you were to start reading about it, everything would be completely familiar.","zh":"在这种情况下，它可能会选择二次规划（QP）或类似的方法。因此，它实际上会找到最短路径。它试图弄清楚，是否存在一系列变换可以将这个问题转化为QP？这就是它大致所做的。很好。好的，所以奇怪的是，我想现在一切都被解开了。我是说，也许不是每一个细节，但如果你开始阅读相关内容，一切都会完全熟悉。","start":2676.44,"end":2704.23},{"id":129,"text":"Okay, so could do two things. We could either jump into our last topic, which I think is actually, I think actually that's what we're going to do. I just made the decision for us. There we go. So here's what we're going to do. Okay, so this is what we hold in reserve. So if we finish a bit early, which is typical, like we just did, then we're able to go back and look at some other cool material.","zh":"好的，我们可以做两件事。我们既可以跳入我们最后的话题，我认为实际上这就是我们要做的。我刚刚为我们做出了决定。好了，那么我们接下来要做什么。好的，这就是我们保留的内容。所以如果我们提前完成，这在典型情况下会发生，比如我们刚刚做的那样，那么我们就能够回过头来查看一些其他有趣的内容。","start":2705.5,"end":2737.47},{"id":130,"text":"So what we're going to do is look at L1 norm methods for convex cardinality problems. And I'll explain that in a minute. You already know, I think, about the connection between L1 norms and sparsity, right? And you may also have seen this in maybe a statistics class or something like that.","zh":"我们将要研究用于凸基数问题的L1范数方法。我稍后会解释这一点。我想你们已经知道L1范数与稀疏性之间的联系了，对吧？你们可能也在统计学课程或其他类似课程中见过这一点。","start":2739.05,"end":2760.72},{"id":131,"text":"So I'm not sure where else it would come up, but that's one place where it would come up. So we'll just go a bit more into depth here, and it'll be, actually there's some interesting stuff, and you'll actually see some cool connections that will actually give you stuff that's better than merely saying, you want that sparse? Here. And then you type out a problem with an L1 norm. You'll see that actually you can actually do better than that. Okay.","zh":"我不确定它还会在其他什么地方出现，但这是它出现的一个地方。我们将更深入地探讨这一点，实际上有一些有趣的内容，你们会看到一些有趣的联系，这些联系实际上会提供比仅仅说‘你想要稀疏性’更好的东西。这里。然后你写出一个带有L1范数的问题。你会看到实际上你可以做得比这更好。好的。","start":2761.12,"end":2785.58},{"id":132,"text":"So here's the idea, um, so cardinality, by the way, is simply the number of non-zeros of a vector.","zh":"这个想法是，顺便说一句，基数仅仅是向量中非零元素的数量。","start":2786.01,"end":2792.65},{"id":133,"text":"And uh, and in fact, it's a really, it's a separable function, right, so it actually is based on this.","zh":"事实上，它是一个可分函数，对吧，所以它实际上就是基于这一点的。","start":2792.65,"end":2800.15},{"id":134,"text":"It's based on uh, so it's the cardinality, this is for a scalar of let's say a, it's equal to either.","zh":"它是基于这一点的，所以对于一个标量a来说，它等于。","start":2800.15,"end":2809.27},{"id":135,"text":"One if a is not zero and zero if a equals zero, okay, so that's uh, and if you.","zh":"如果a不为零则为1，如果a等于零则为0，好的，所以这就是，如果你。","start":2809.27,"end":2816.93},{"id":136,"text":"Sum this function over all the coefficients of a vector you get the.","zh":"对向量的所有系数求和，你会得到这个函数的值。","start":2816.93,"end":2822.89},{"id":137,"text":"Cardinality, which is the number, right, so and this function obviously is not.","zh":"基数，也就是数量，对吧，所以这个函数显然不是。","start":2822.89,"end":2826.83},{"id":138,"text":"Convex, that's I guess that's kind of obvious, it looks like this, that's empty.","zh":"凸函数，我想这有点显而易见，它看起来像这样，这是空的。","start":2826.83,"end":2831.59},{"id":139,"text":"And that whoop yeah whoops okay looks like this and then this is looks like.","zh":"而且那个，嗯，好的，看起来像这样，然后这个看起来像。","start":2831.59,"end":2837.77},{"id":140,"text":"It's this point and wait no no no here it's this and then that so this is or if you like i'll i'll.","zh":"这是这个点，等等，不，不，不，这里这是这个，然后那个，所以这个是，或者如果你喜欢的话，我会以一种非常奇怪的方式让它看起来像这样，对吧。","start":2837.77,"end":2845.85},{"id":141,"text":"Make it look like that in a very weird way right so this is that's the cardinality function okay.","zh":"这就是基数函数，好的。","start":2845.85,"end":2850.51}],"notes":["本段讲解了凸优化中L1范数与稀疏性之间的关系，指出L1范数可以用于解决凸卡数问题。卡数是指向量中非零元素的数量，它是一个非凸函数，但可以通过L1范数进行近似。","讲者提到L1范数与稀疏性之间的联系，这是统计学和信号处理中的常见主题。L1范数的最小化可以导致稀疏解，即解中大部分元素为零。","讲者指出，虽然卡数函数本身是非凸的，但通过L1范数可以近似处理，从而将问题转化为凸优化问题。","讲者提到，使用L1范数可以得到比单纯说“想要稀疏”更好的结果，因为L1范数的最小化可以提供更精确的稀疏解。","讲者还提到，卡数函数对于标量来说，当值不为零时为1，为零时为0，对向量的每个元素进行求和即可得到卡数。","讲者指出，卡数函数不是凸函数，这在图形上可以直观地看出，但可以通过L1范数进行近似处理，从而将问题转化为凸优化问题。"],"formulas":[],"uncertainties":["cardinality function 的图形描述存在断句和不清晰之处，无法准确判断其形状。","讲者提到的“this is looks like”和“make it look like that in a very weird way”等描述无法准确转化为数学公式。"],"diagram":"none","start":2676.44,"end":2850.51,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":2676.44,"text":"In that case, it might pick the QP or something like that. So then it actually has a shortest path. It tries to figure out, is there a sequence of transformations that will take this problem to a QP? So that's roughly what it does. Cool. Okay, so weirdly, I think now everything is demystified. I mean, maybe not every detail, but if you were to start reading about it, everything would be completely familiar."},{"start":2705.5,"text":"Okay, so could do two things. We could either jump into our last topic, which I think is actually, I think actually that's what we're going to do. I just made the decision for us. There we go. So here's what we're going to do. Okay, so this is what we hold in reserve. So if we finish a bit early, which is typical, like we just did, then we're able to go back and look at some other cool material."},{"start":2739.05,"text":"So what we're going to do is look at L1 norm methods for convex cardinality problems. And I'll explain that in a minute. You already know, I think, about the connection between L1 norms and sparsity, right? And you may also have seen this in maybe a statistics class or something like that."},{"start":2761.12,"text":"So I'm not sure where else it would come up, but that's one place where it would come up. So we'll just go a bit more into depth here, and it'll be, actually there's some interesting stuff, and you'll actually see some cool connections that will actually give you stuff that's better than merely saying, you want that sparse? Here. And then you type out a problem with an L1 norm. You'll see that actually you can actually do better than that. Okay."},{"start":2786.01,"text":"so here's the idea um so a cardinality by the way is simply the number of non-zeros of a vector"},{"start":2792.65,"text":"and uh and in fact it's a really it's a separable function right so it actually is based on this"},{"start":2800.15,"text":"it's based on uh so it's the cardinality this is for a scalar of let's say a it's equal to either"},{"start":2809.27,"text":"one if a is not zero and zero if a equals zero okay so that's uh and if you"},{"start":2816.93,"text":"sum this function over all the coefficients of a vector you get the"},{"start":2822.89,"text":"cardinality which is the number right so and this function obviously is not"},{"start":2826.83,"text":"convex that's I guess that's kind of obvious it looks like this that's empty"},{"start":2831.59,"text":"and that whoop yeah whoops okay looks like this and then this is looks like"},{"start":2837.77,"text":"it's this point and wait no no no here it's this and then that so this is or if you like i'll i'll"},{"start":2845.85,"text":"make it look like that in a very weird way right so this is that's the cardinality function okay"}],"speech_gaps":[],"frame":"../frames/v017/017.webp","frame_time":2688.44},{"title":"凸优化在结构设计中的应用","segments":[{"id":142,"text":"um not obviously not convex right okay um so this the the history if this goes back it way","zh":"嗯，这显然不是凸的，对吧？好的，那么这个话题的历史可以追溯到至少50年代，甚至可能更早，嗯，但它被应用于各种","start":2850.51,"end":2860.15},{"id":143,"text":"it goes back into the 50s at the least and maybe even earlier uh but it's used in all sorts of","zh":"它至少可以追溯到50年代，甚至可能更早，但被用于各种","start":2860.15,"end":2866.67},{"id":144,"text":"cool things like in sparse design is one so um a very interesting example of that is is actually","zh":"在航空航天领域用于结构设计的，特别是在1950年代和1960年代。让我解释一下它是如何工作的","start":2866.67,"end":2874.39},{"id":145,"text":"used in aerospace in design of structures in the 1950s and 60s so let me explain how that works","zh":"1950年代和60年代在航空航天领域用于结构设计，让我解释一下它是如何工作的","start":2874.39,"end":2881.37},{"id":146,"text":"you're going to build a structure and you put in all these uh bars that connect two nodes right so","zh":"这是一个空间框架或者其他类似的东西。嗯，有多少人知道我在说什么","start":2881.99,"end":2887.67},{"id":147,"text":"it's a space frame or something like that um by the how many people know what i'm talking about","zh":"因为如果有一两个人知道就可以了，其余的人应该大致","start":2887.67,"end":2892.53},{"id":148,"text":"because if a couple okay that's good enough and the rest should just kind of","zh":"就能抓住这个意思了。我有一大堆节点，我正在","start":2892.53,"end":2896.67},{"id":149,"text":"just pick up the flavor of it right so I have a whole bunch of nodes and I'm","zh":"做些什么，对吧？","start":2896.67,"end":2900.09},{"id":150,"text":"gonna put in bars right and my variables actually are the cross-sectional areas","zh":"我打算在右边放置杆件，我的变量实际上是杆件的横截面积","start":2900.09,"end":2904.25},{"id":151,"text":"of the bar","zh":"杆件的横截面积","start":2904.25,"end":2904.73},{"id":152,"text":"Okay, that's the variables. But what you do is, the bars, you put in a gazillion bars. You have absolutely no intention to use a million bars in your space frame, right? This could be, for example, the wing of an airplane, right? Or some structure like that. Or some structure in a spacecraft, right? Okay, so what you do then is you...","zh":"好的，这就是变量。但你所做的，是放置大量的杆件。你完全没有打算在你的空间框架中使用一百万根杆件，对吧？这可能例如是飞机的机翼，对吧？或者类似的结构。或者航天器中的某种结构，对吧？好的，那么你接下来所做的就是，","start":2905.6,"end":2929.6},{"id":153,"text":"You actually put an L1 norm on the cross-sectional areas. What's the L1 norm of a non-negative vector? Thank you. Okay, fine. So you could actually, what's weird about that is you could look in some of those papers for L1 norm, and you're like, I don't see any L1 norm here. And the reason is the things that you're computing an L1 norm of are non-negative, so it's just a sum. Okay, fine. All right.","zh":"你实际上在杆件的横截面积上施加L1范数。非负向量的L1范数是什么？谢谢。好的，明白了。所以你实际上可以，这种奇怪的地方在于，你可以在一些论文中寻找L1范数，但你却看不到任何L1范数。原因是你所计算L1范数的对象是非负的，因此它只是一个总和。好的，明白了。好的。","start":2930.48,"end":2962.53},{"id":154,"text":"So what happens is you solve this, and the constraints are, you'd have a limit on weight. You have a limit. What you also have is a whole bunch of constraints, which are performance related. And it basically says, if I take this structure and I put various forces on various places, can it withstand it? I might have a maximum stress limit in each bar or something. So there's a whole bunch of constraints. The comment is strong enough to handle boost, take off, whatever, re-entry. I don't care, whatever this is, right?","zh":"所以发生的是，你解决这个问题，约束条件是你对重量有一个限制。你有一个限制。你还有许多与性能相关的约束条件。它基本上表示，如果你对结构施加各种力，它是否能够承受？我可能对每根杆件有一个最大应力限制。因此有许多约束条件。评论是结构足够坚固，能够应对加速、起飞、无论什么情况，再入大气层。我不在乎，无论这是什么，对吧？","start":2962.88,"end":2992.2},{"id":155,"text":"or rough turbulence, all that kind of stuff. Everybody following this? So that's a whole bunch of constraints. Anyway, when you solve this problem, you offered it the option of using, they didn't do a million in the 60s, okay, but now they do a million, right? So you offered it the choice of a million bars, and what happens is, you know, 322 turn out to be positive, and the rest are zero.","zh":"或者剧烈湍流，所有这些情况。大家跟上了吗？这就是许多约束条件。不管怎样，当你解决这个问题时，你提供了使用一百万根杆件的选择，他们在60年代没有这么做，对吧？但现在他们这么做，对吧？所以你提供了使用一百万根杆件的选择，结果是，有322根杆件的横截面积为正，其余为零。","start":2992.59,"end":3015.77}],"notes":["本段讲授了凸优化在结构设计中的应用，特别是稀疏设计中的L1范数使用。讲者提到在1950年代和1960年代，凸优化被用于航空航天结构设计，如飞机机翼和航天器结构。通过使用L1范数，可以实现结构的稀疏性，即只使用少量的杆件，而其余杆件的截面积为零。","讲者解释了结构设计中的变量是杆件的截面积，并提到在设计过程中，会考虑重量限制和性能约束，如最大应力限制。这些约束确保结构能够承受各种载荷，如起飞、再入和湍流。","讲者指出，虽然在1960年代设计时可能不会使用百万个杆件，但现代技术允许使用大量杆件，并通过优化算法选择出最优的杆件配置，使得只有部分杆件具有非零截面积，其余为零。","讲者提到L1范数在非负向量中的计算方式是求和，这与通常的L1范数定义不同，因为非负性使得绝对值符号可以省略。这种特性使得L1范数在稀疏优化中非常有用。","讲者强调了凸优化在实际工程中的重要性，特别是在处理大规模结构设计问题时，通过优化算法可以高效地找到满足所有约束条件的最优解。","讲者还提到，虽然在优化过程中会考虑大量杆件，但最终的解通常只包含少量非零杆件，这体现了凸优化在稀疏性方面的优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2850.51,"end":3015.77,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":2850.51,"text":"um not obviously not convex right okay um so this the the history if this goes back it way"},{"start":2860.15,"text":"it goes back into the 50s at the least and maybe even earlier uh but it's used in all sorts of"},{"start":2866.67,"text":"cool things like in sparse design is one so um a very interesting example of that is is actually"},{"start":2874.39,"text":"used in aerospace in design of structures in the 1950s and 60s so let me explain how that works"},{"start":2881.99,"text":"you're going to build a structure and you put in all these uh bars that connect two nodes right so"},{"start":2887.67,"text":"it's a space frame or something like that um by the how many people know what i'm talking about"},{"start":2892.53,"text":"because if a couple okay that's good enough and the rest should just kind of"},{"start":2896.67,"text":"just pick up the flavor of it right so I have a whole bunch of nodes and I'm"},{"start":2900.09,"text":"gonna put in bars right and my variables actually are the cross-sectional areas"},{"start":2904.25,"text":"of the bar"},{"start":2905.6,"text":"Okay, that's the variables. But what you do is, the bars, you put in a gazillion bars. You have absolutely no intention to use a million bars in your space frame, right? This could be, for example, the wing of an airplane, right? Or some structure like that. Or some structure in a spacecraft, right? Okay, so what you do then is you..."},{"start":2930.48,"text":"You actually put an L1 norm on the cross-sectional areas. What's the L1 norm of a non-negative vector? Thank you. Okay, fine. So you could actually, what's weird about that is you could look in some of those papers for L1 norm, and you're like, I don't see any L1 norm here. And the reason is the things that you're computing an L1 norm of are non-negative, so it's just a sum. Okay, fine. All right."},{"start":2962.88,"text":"So what happens is you solve this, and the constraints are, you'd have a limit on weight. You have a limit. What you also have is a whole bunch of constraints, which are performance related. And it basically says, if I take this structure and I put various forces on various places, can it withstand it? I might have a maximum stress limit in each bar or something. So there's a whole bunch of constraints. The comment is strong enough to handle boost, take off, whatever, re-entry. I don't care, whatever this is, right?"},{"start":2992.59,"text":"or rough turbulence, all that kind of stuff. Everybody following this? So that's a whole bunch of constraints. Anyway, when you solve this problem, you offered it the option of using, they didn't do a million in the 60s, okay, but now they do a million, right? So you offered it the choice of a million bars, and what happens is, you know, 322 turn out to be positive, and the rest are zero."}],"speech_gaps":[],"frame":"../frames/v017/018.webp","frame_time":2862.51},{"title":"凸优化中的启发式方法与稀疏性应用","segments":[{"id":156,"text":"Everybody got this? And then it's kind of cool because someone said, what did you just do? And you say, I just designed the structure. You know, it's a cool structure. You see all these like bars connecting various points and stuff like that. And if your specs were right, it would be a completely reasonable structure. And someone said, that sounds like a combinatorial problem, right? Because you did not, here's what you did not solve. You didn't say, I want 322 bars from my","zh":"大家明白了吗？然后这很酷，因为有人会问，你刚才做了什么？你会说，我刚刚设计了结构。你知道，这是一个很酷的结构。你会看到所有这些连接各个点的杆子和其他东西。如果你的规格是正确的，那这将是一个完全合理的结构。然后有人会说，这听起来像是一个组合问题，对吧？因为你没有解决这个问题，这里是你没有解决的。你没有说，我想从我提供的110万种选择中选出322种，对吧？因为从110万中选择322是一个非常大的数字，对吧？所以你没有解决这个问题。所以这是一个启发式方法，但这就是会发生的事情。大家明白了吗？所以早在60年代人们就已经在做这个，这有点酷。","start":3016.19,"end":3044.01},{"id":157,"text":"what I'm offering you, which is 1.1 million, right? Because 1.1 million choose 322 is a super big number, right? So you did not solve that problem. So this is a heuristic, but that's what happens. Everybody got that? So that's already in the 60s people were doing this, which is kind of cool.","zh":"我给你们的，也就是110万美元，对吧？因为从110万美元中选择322个是超级大的数字，对吧？所以你们并没有解决这个问题。所以这是一个启发式方法，但这就是会发生的事情。大家明白了吗？所以这已经在60年代的人们就开始这么做了，这有点酷。","start":3044.68,"end":3061.66},{"id":158,"text":"I know that there was a great example in, they do it in circuits. That's a good one. So in circuit design, you're going to build yourself a filter. You might, you're going to build, let's say, an FIR filter. So I'm speaking dialect, but it's okay. So you're going to build yourself, find an impulse response filter, which is a set of a bunch of sums and stuff like that. And you design the coefficients. Here, the coefficients can be negative.","zh":"这里引入了L1范数，你会说，我想设计一个满足以下规格的滤波器，但我也希望系数是稀疏的。所以你添加一个L1项，它变得稀疏，这非常酷，因为当你准备生成它的硬件时，当一个系数为零时，这意味着你实际硬件电路中的那个小模块，你根本不需要。因为我知道如何，我不是硬件设计师，但我知道如何合成一个乘以零并将其加到结果中的硬件。","start":3062.36,"end":3087.92},{"id":159,"text":"There's an L1 norm put in, and you say, I want a filter that has the following specs, but I also want the coefficients to be sparse. So you add an L1 term, it's sparse, and it's very cool because then when you're going to emit the hardware for it, when a coefficient is zero, it means that little block in your actual hardware circuit, you don't even need it. Because I know how to, I'm not a hardware designer, but I do know how to synthesize hardware that multiplies by zero and adds it to the result.","zh":"对，我能做到这一点，对吧？答案就是根本没有硬件。大家大概都跟上了吗？然后，当然，我想你们很多人在统计学中见过这个，实际上至少有两个不同的用途。第一个是用于稀疏特征，即特征选择，对吧？你会说，这里是我的……","start":3088.94,"end":3117.5},{"id":160,"text":"Right, that I can do, right? And the answer is just no hardware at all. Everybody kind of following these? And then, of course, I think many of you have seen this in sort of statistics, actually for two different purposes, at least two. The first is for sparse features, is feature selection, right? So you'd say, here's my...","zh":"对，我能做到，对吧？答案就是完全没有硬件。大家基本上都在跟着这样做吗？当然，我想你们很多人都在统计学中见过这个，实际上至少有两个不同的用途。第一个是用于稀疏特征，也就是特征选择，对吧？所以你会说，这里是我的……","start":3118.08,"end":3139.82},{"id":161,"text":"Here's a bunch of data. I have 500 patients, you know, 250 have one type of cancer, 250 like don't or something like that. Here's gene activation data. So I give you, I don't know, you know, 80,000 gene expression levels. And then if you put L1, if you put an L1 regularizer on, let's say just logistic regression to classify the two, then it's going to go in and choose like, you know, 22 genes.","zh":"这里有一组数据。我有500名患者，你知道的，250名患有某种癌症，另外250名则没有或者类似的情况。这是基因激活数据。所以我给你，比如说，80,000个基因表达水平。然后如果你在逻辑回归中使用L1正则化器来对这两种情况进行分类，它就会选择大约22个基因。","start":3141.57,"end":3168.45},{"id":162,"text":"Right. Everybody. So by the way, how many people have seen that or something like that in some class? Where was it in like stat 315 or something? 206. 206? Good. I was kind of hoping for more people to raise their hands on that one. These are like super cool things, right? So like everybody should have seen these things. But anyway.","zh":"对的，大家都是这样。顺便问一句，有多少人曾在某些课程中见过类似的情况？比如在统计学315之类的课程里？206人。206人？很好。我原本希望有更多人举手。这些是非常酷的事情，对吧？所以每个人都应该见过这些。不过没关系。","start":3169.02,"end":3191.7}],"notes":["本段讲授了凸优化中的启发式方法，通过结构设计的例子说明了如何在不解决组合优化问题的情况下进行近似设计。讲者提到，虽然设计的结构可能包含大量可能的连接方式，但实际设计时并不需要穷举所有可能性，而是通过启发式方法进行近似。","讲者进一步以电路设计为例，说明了如何通过L1范数实现稀疏性。在设计滤波器时，通过引入L1正则化项，可以使得滤波器的系数变得稀疏，从而减少硬件实现所需的资源。","在统计学中，L1正则化被用于特征选择，即从大量特征中选择出对分类任务有帮助的少数关键特征。讲者以基因表达数据为例，说明了通过L1正则化可以选出少量关键基因，从而简化模型。","讲者还提到，L1正则化在统计学中被广泛应用于特征选择和模型压缩，这表明稀疏性在实际应用中具有重要的价值。","讲者通过提问的方式，确认了学生是否了解这些概念，并指出这些方法在实际应用中非常有用，但可能不是所有学生都熟悉。","讲者最后提到，这些方法在统计学课程中被广泛教授，但可能不是所有学生都参与过相关课程，因此需要进一步强调其重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3016.19,"end":3191.7,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3016.19,"text":"Everybody got this? And then it's kind of cool because someone said, what did you just do? And you say, I just designed the structure. You know, it's a cool structure. You see all these like bars connecting various points and stuff like that. And if your specs were right, it would be a completely reasonable structure. And someone said, that sounds like a combinatorial problem, right? Because you did not, here's what you did not solve. You didn't say, I want 322 bars from my"},{"start":3044.68,"text":"what I'm offering you, which is 1.1 million, right? Because 1.1 million choose 322 is a super big number, right? So you did not solve that problem. So this is a heuristic, but that's what happens. Everybody got that? So that's already in the 60s people were doing this, which is kind of cool."},{"start":3062.36,"text":"I know that there was a great example in, they do it in circuits. That's a good one. So in circuit design, you're going to build yourself a filter. You might, you're going to build, let's say, an FIR filter. So I'm speaking dialect, but it's okay. So you're going to build yourself, find an impulse response filter, which is a set of a bunch of sums and stuff like that. And you design the coefficients. Here, the coefficients can be negative."},{"start":3088.94,"text":"There's an L1 norm put in, and you say, I want a filter that has the following specs, but I also want the coefficients to be sparse. So you add an L1 term, it's sparse, and it's very cool because then when you're going to emit the hardware for it, when a coefficient is zero, it means that little block in your actual hardware circuit, you don't even need it. Because I know how to, I'm not a hardware designer, but I do know how to synthesize hardware that multiplies by zero and adds it to the result."},{"start":3118.08,"text":"Right, that I can do, right? And the answer is just no hardware at all. Everybody kind of following these? And then, of course, I think many of you have seen this in sort of statistics, actually for two different purposes, at least two. The first is for sparse features, is feature selection, right? So you'd say, here's my..."},{"start":3141.57,"text":"Here's a bunch of data. I have 500 patients, you know, 250 have one type of cancer, 250 like don't or something like that. Here's gene activation data. So I give you, I don't know, you know, 80,000 gene expression levels. And then if you put L1, if you put an L1 regularizer on, let's say just logistic regression to classify the two, then it's going to go in and choose like, you know, 22 genes."},{"start":3169.02,"text":"Right. Everybody. So by the way, how many people have seen that or something like that in some class? Where was it in like stat 315 or something? 206. 206? Good. I was kind of hoping for more people to raise their hands on that one. These are like super cool things, right? So like everybody should have seen these things. But anyway."}],"speech_gaps":[],"frame":"../frames/v017/019.webp","frame_time":3028.19},{"title":"凸优化中的稀疏性与应用","segments":[{"id":163,"text":"You know what they do? I have biologist friends. You know what they do with that? So I have a biologist friend who hates math, doesn't trust it. He says it's stupid. It doesn't work. I caught him actually running one of those things. I was like, you're so busted. And he's like, he said, no, I don't trust it. He said, what I do is I take the 22 genes.","zh":"你知道他们是怎么做的吗？我有生物学家朋友。你知道他们怎么处理这些数据吗？我有一个生物学家朋友，他讨厌数学，不信任它。他说它很愚蠢，行不通。我看到他实际上在运行那些东西。我心想，你被发现了。他说，不，我不信任它。他说，我所做的就是选取22个基因。","start":3192.64,"end":3208.58},{"id":164,"text":"I look at the first 10 and go like, duh, like, of course they're related to this pathway because he actually knows biology. He said, of course, that's obviously related to the pathway for X, Y, and Z. And he looks at two others and he says, that has nothing to do with, like, that's ridiculous. And he looks at three others and he goes like, hmm. These are people who know genes by, you know, by name, right? He looks at them and he goes like, hmm.","zh":"我看看前10个，心想，当然，这些和这个通路有关，因为他确实了解生物学。他说，当然，这显然和X、Y、Z通路有关。他看看另外两个，说，这和什么都没关系，很荒谬。他看看另外三个，说，嗯。这些人是通过名字来认识基因的，对吧？他看看它们，说，嗯。","start":3209.95,"end":3229.82},{"id":165,"text":"That's interesting. That actually could be related. That could be. And then I said, well, what do you do then? He said, well, then I just call my lab. He said he makes his postdocs go in and knock out those genes and see if something happens. And then the next morning, maybe it happens, maybe it doesn't, or whenever the experiment's over. So that's fine.","zh":"这很有趣。这实际上可能有关联。可能有关联。然后我说，那你是怎么处理的呢？他说，那我就打电话给我的实验室。他说他让他的博士后去敲除这些基因，看看会发生什么。然后第二天早上，可能发生了，也可能没发生，或者等到实验结束。这就可以了。","start":3230.69,"end":3249.83},{"id":166,"text":"Okay. Okay. Let's see some other examples of it. Oh, it comes up in, oh, in a lot of image processing, signal processing, geophysics from the 70s.","zh":"好的。好的。让我们看看其他一些例子。哦，它在很多图像处理、信号处理、地球物理领域中出现，比如70年代的。","start":3251.02,"end":3261.0},{"id":167,"text":"Oh, there's a total variation reconstruction. We've already seen that. That's actually basically an L1 norm applied to a derivative, either a first difference or, for example, in an image, it might be to a gradient, a space gradient in an image. Okay, so these are... And, yeah, that's a bit old. I mean, yeah, there's some theoretical results that guarantee the method works. I mean, I think it's kind of cool, but...","zh":"哦，总变分重建。我们已经见过这个了。实际上，这基本上是在对导数应用L1范数，无论是第一次差分，还是在图像中，可能是对梯度，即图像中的空间梯度。好的，所以这些是……而且，是的，这有点老了。我的意思是，有一些理论结果可以保证这种方法有效。我的意思是，我觉得这有点酷，但……","start":3261.82,"end":3287.54},{"id":168,"text":"Whatever, it's fine. They work without these methods anyway. Okay. So what we're going to do now is look at this and go through this stuff a bit more carefully. So the cardinality is the function I just plotted over here. It looks like that.","zh":"随便吧，不管怎样，这些方法本来就可以工作。好的。现在我们要做的就是仔细看看这些内容。所以，基数是刚才我在这里绘制的函数。看起来像这样。","start":3288.15,"end":3306.07},{"id":169,"text":"It's quasi concave, but I mean who cares because that's not something that tells you congratulations","zh":"它是拟凹函数，但我的意思是，谁在乎呢，因为这不是告诉你恭喜你的东西","start":3307.45,"end":3312.57},{"id":170,"text":"You can maximize the cardinality of a vector. That's which is kind of silly","zh":"你可以最大化向量的基数。这有点傻","start":3312.57,"end":3316.73},{"id":171,"text":"Otherwise, you know, it has no convexity properties, right?","zh":"否则，你知道的，它没有凸性性质，对吧？","start":3318.21,"end":3321.13},{"id":172,"text":"You have lots of interesting problems like a convex cardinality problem. Here's one that looks like this","zh":"你有很多有趣的问题，比如凸基数问题。这里有一个看起来像这样的问题","start":3322.79,"end":3328.47},{"id":173,"text":"so this says here's a set of convex here's a convex set say and","zh":"这里说，这里有一个凸集，这里有一个凸集，说","start":3329.19,"end":3333.95},{"id":174,"text":"And what you're going to do is you say, please find in this set the point with the smallest number of non-zeros.","zh":"然后你所做的就是，要求在这个集合中找到非零元素个数最少的点。","start":3333.95,"end":3342.43},{"id":175,"text":"This is general, but we're going to look at specific examples.","zh":"这是一个一般性的问题，但我们将会看一些具体的例子。","start":3342.85,"end":3346.31},{"id":176,"text":"You'll see this is a super interesting problem.","zh":"你会看到这是一个非常有趣的问题。","start":3346.45,"end":3348.17},{"id":177,"text":"Or you could do things like this.","zh":"或者你可以这样做。","start":3348.79,"end":3350.27},{"id":178,"text":"I could have a standard convex problem here, but I could add a constraint that says you can only use k non-zeros.","zh":"我可以在这里有一个标准的凸问题，但我可以添加一个约束，要求只能使用k个非零元素。","start":3350.35,"end":3358.91},{"id":179,"text":"right so I mean in like statistics or machine learning this would be you know","zh":"所以，我意思是，在统计学或机器学习中，这会是你要做的，你知道的","start":3358.91,"end":3365.81},{"id":180,"text":"maximize my log likelihood subject to some constraints that are required then","zh":"在一些必须满足的约束条件下最大化我的对数似然","start":3365.81,"end":3372.01}],"notes":["本段讲授了凸优化中稀疏性问题的应用，通过生物学家的例子说明了如何通过实验验证基因之间的关系，以及在图像处理、信号处理和地球物理等领域中稀疏性方法的使用。"],"formulas":[],"uncertainties":["It's quasi concave, but I mean who cares because that's not something that tells you congratulations","You can maximize the cardinality of a vector. That's which is kind of silly"],"diagram":"none","start":3192.64,"end":3372.01,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":3192.64,"text":"You know what they do? I have biologist friends. You know what they do with that? So I have a biologist friend who hates math, doesn't trust it. He says it's stupid. It doesn't work. I caught him actually running one of those things. I was like, you're so busted. And he's like, he said, no, I don't trust it. He said, what I do is I take the 22 genes."},{"start":3209.95,"text":"I look at the first 10 and go like, duh, like, of course they're related to this pathway because he actually knows biology. He said, of course, that's obviously related to the pathway for X, Y, and Z. And he looks at two others and he says, that has nothing to do with, like, that's ridiculous. And he looks at three others and he goes like, hmm. These are people who know genes by, you know, by name, right? He looks at them and he goes like, hmm."},{"start":3230.69,"text":"That's interesting. That actually could be related. That could be. And then I said, well, what do you do then? He said, well, then I just call my lab. He said he makes his postdocs go in and knock out those genes and see if something happens. And then the next morning, maybe it happens, maybe it doesn't, or whenever the experiment's over. So that's fine."},{"start":3251.02,"text":"Okay. Okay. Let's see some other examples of it. Oh, it comes up in, oh, in a lot of image processing, signal processing, geophysics from the 70s."},{"start":3261.82,"text":"Oh, there's a total variation reconstruction. We've already seen that. That's actually basically an L1 norm applied to a derivative, either a first difference or, for example, in an image, it might be to a gradient, a space gradient in an image. Okay, so these are... And, yeah, that's a bit old. I mean, yeah, there's some theoretical results that guarantee the method works. I mean, I think it's kind of cool, but..."},{"start":3288.15,"text":"Whatever, it's fine. They work without these methods anyway. Okay. So what we're going to do now is look at this and go through this stuff a bit more carefully. So the cardinality is the function I just plotted over here. It looks like that."},{"start":3307.45,"text":"It's quasi concave, but I mean who cares because that's not something that tells you congratulations"},{"start":3312.57,"text":"You can maximize the cardinality of a vector. That's which is kind of silly"},{"start":3318.21,"text":"Otherwise, you know, it has no convexity properties, right?"},{"start":3322.79,"text":"You have lots of interesting problems like a convex cardinality problem. Here's one that looks like this"},{"start":3329.19,"text":"so this says here's a set of convex here's a convex set say and"},{"start":3333.95,"text":"And what you're going to do is you say, please find in this set the point with the smallest number of non-zeros."},{"start":3342.85,"text":"This is general, but we're going to look at specific examples."},{"start":3346.45,"text":"You'll see this is a super interesting problem."},{"start":3348.79,"text":"Or you could do things like this."},{"start":3350.35,"text":"I could have a standard convex problem here, but I could add a constraint that says you can only use k non-zeros."},{"start":3358.91,"text":"right so I mean in like statistics or machine learning this would be you know"},{"start":3365.81,"text":"maximize my log likelihood subject to some constraints that are required then"}],"speech_gaps":[],"frame":"../frames/v017/020.webp","frame_time":3204.64},{"title":"特征选择与凸优化问题","segments":[{"id":181,"text":"also Oh PS you're only allowed to use you can't use more than 22 features and","zh":"另外啊，PS，你们只能使用不超过22个特征，","start":3372.01,"end":3378.09},{"id":182,"text":"I'm giving you a million right so that would be that right and that there it's","zh":"我给你们一百万个，这样就对了，对吧，这样就完成了，","start":3378.09,"end":3382.35},{"id":183,"text":"called like feature selection we'll get to that okay so just a couple of you","zh":"这叫做特征选择，我们之后会讲到，好的，所以只是几个关于这个的观察点","start":3382.35,"end":3388.01},{"id":184,"text":"you know, observations about this.","zh":"你们知道，关于这个。","start":3388.01,"end":3389.63},{"id":185,"text":"So the first one is if you fix the sparsity pattern,","zh":"第一个观察点是，如果你固定稀疏模式，","start":3390.33,"end":3394.03},{"id":186,"text":"then you just get a convex problem, right?","zh":"那么你就会得到一个凸问题，对吧？","start":3394.27,"end":3396.51},{"id":187,"text":"So if I tell you, you know, fit my model,","zh":"所以如果我告诉你们，你们知道，拟合我的模型，","start":3396.57,"end":3399.87},{"id":188,"text":"and you go, okay, you say I have a million features,","zh":"你们会说，好的，你说你有一百万个特征，","start":3399.97,"end":3402.75},{"id":189,"text":"you say, oh, but only these 22 are allowed to be non-zero,","zh":"你说，哦，但只有这22个可以是非零的，","start":3402.91,"end":3405.75},{"id":190,"text":"and all the rest are zero, then you're like, okay,","zh":"其余的都是零，那么你就会想，好吧，","start":3405.87,"end":3408.19},{"id":191,"text":"because then it's just a problem with 22 variables.","zh":"因为这样的话，它就只是一个具有22个变量的问题了。","start":3408.47,"end":3410.17},{"id":192,"text":"Everybody got this?","zh":"大家明白了吗？","start":3410.39,"end":3411.67},{"id":193,"text":"So this is kind of obvious.","zh":"所以这有点显而易见。","start":3411.71,"end":3412.59},{"id":194,"text":"That means that","zh":"这意味着","start":3414.01,"end":3415.07},{"id":195,"text":"You could solve 2 to the n convex problems to solve these, right? If n is like 1,000, it's not. I mean, if n is, sorry, n is 100, n is less than 10, this might not be insane, right? So, yeah, so that's one.","zh":"你可以通过解决2的n次方个凸问题来解决这些问题，对吧？如果n是像1000这样的数，那就不行。我的意思是，如果n是100，n小于10，这可能还不是很疯狂，对吧？所以，是的，这就是一种方法。","start":3415.66,"end":3433.5},{"id":196,"text":"But this kind of brute force search doesn't work for, you know, obviously for bigger problems. It's extremely easy to show that the whole thing, that this general problem is NP-hard. I think we'll do that in a minute. And you could solve it globally by what are called branch-and-bound methods. And there's also branch-and-cut methods. There's all sorts of names for this. It's a whole area, I guess people would call it, like mixed integer convex programming.","zh":"但是这种暴力搜索方法对于更大的问题显然行不通。很容易就能证明整个问题，也就是这个一般性问题，是NP难的。我想我们一会儿就会这么做。你可以通过所谓的分支定界方法来全局求解这个问题。还有分支切割方法。这类方法有各种各样的名称。这整个领域，我想人们会称之为混合整数凸规划。","start":3435.84,"end":3460.0},{"id":197,"text":"They might. These things can work. Some of them can work spectacularly. I'm not going to talk about those. But anyway, this is just general ideas about how you would solve these problems. So you can actually express Boolean LP as a cardinality problem like that. And I think you've actually done a couple of problems on your wrist. First of all, getting computing bounds.","zh":"它们可能会。这些方法可以起作用。其中一些方法可以非常出色地起作用。我不会谈论那些方法。但无论如何，这只是关于如何解决这些问题的一些一般性想法。因此，你实际上可以把布尔线性规划表达成像这样的基数问题。我认为你们实际上已经在手腕上做过几个这样的问题了。首先，获得计算界限。","start":3461.42,"end":3488.85},{"id":198,"text":"for Boolean LPs, and then also for heuristics for actually approximately solving them. I believe you had that in some homework, right? So the way that works is you want to solve this problem. Now, by the way, solving a set of linear inequalities with Boolean variables is basically like all...","zh":"对于布尔线性规划，以及对于实际近似求解它们的启发式方法，我相信你们在某些作业中见过这些内容，对吧？其工作方式是，你想要解决这个问题。顺便说一句，解决一组带有布尔变量的线性不等式基本上就是所有……","start":3489.57,"end":3510.19},{"id":199,"text":"kind of all of these problems in computer science. So everything is that, right? It's things like 3SAT. It's the traveling salesman problem. I can write down very short descriptions with 0, 1 variables. And you just write it this way, and it's a cardinality problem, and it just looks like this. It's actually the cardinality of x stacked on 1 minus x is less than or equal to n, right?","zh":"计算机科学中的所有这些问题。所以一切都是这样，对吧？比如3SAT问题，旅行商问题。我可以使用0、1变量写出非常简短的描述。你只需这样写出问题，它就是一个基数问题，看起来就像这样。实际上，x堆叠在1减x上的基数小于或等于n，对吧？","start":3510.67,"end":3532.82}],"notes":["本段讲授了特征选择问题，即在给定的特征中选择一部分非零特征进行建模。当固定稀疏模式时，问题转化为一个凸问题，因为变量数量减少到22个。这种情况下，问题变得容易求解。","讲者指出，如果特征数量很大（如1000个），那么穷举所有可能的稀疏模式（2^n个）是不可行的，因为计算量太大。因此，需要更高效的算法，如分支定界法或分支切割法。","讲者提到，布尔线性规划（Boolean LP）可以转化为一个稀疏性问题，即通过限制非零变量的数量来建模。这种转化在计算机科学中非常常见，例如3SAT和旅行商问题。","讲者指出，布尔变量的线性不等式问题可以转化为稀疏性问题，即通过计算变量x和1-x的稀疏性来限制非零变量的数量。这种转化是通过将问题转化为一个关于稀疏性的约束来实现的。","讲者强调，虽然穷举法在小规模问题中可行，但在大规模问题中不可行，因此需要更高效的算法。这些算法包括分支定界法、分支切割法等，它们属于混合整数凸优化的范畴。","讲者提到，学生在作业中已经接触过布尔线性规划的计算界限和启发式方法，这些方法用于近似求解这类问题。"],"formulas":[],"uncertainties":["cardinality of x stacked on 1 minus x is less than or equal to n"],"diagram":"none","start":3372.01,"end":3532.82,"asr_flags":[],"math_clarifications":["原文未提供足够的数学背景来核定公式2^n和cardinality(x) + cardinality(1 - x) ≤ n的正确性，因此这两个公式被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3372.01,"text":"also Oh PS you're only allowed to use you can't use more than 22 features and"},{"start":3378.09,"text":"I'm giving you a million right so that would be that right and that there it's"},{"start":3382.35,"text":"called like feature selection we'll get to that okay so just a couple of you"},{"start":3388.01,"text":"you know, observations about this."},{"start":3390.33,"text":"So the first one is if you fix the sparsity pattern,"},{"start":3394.27,"text":"then you just get a convex problem, right?"},{"start":3396.57,"text":"So if I tell you, you know, fit my model,"},{"start":3399.97,"text":"and you go, okay, you say I have a million features,"},{"start":3402.91,"text":"you say, oh, but only these 22 are allowed to be non-zero,"},{"start":3405.87,"text":"and all the rest are zero, then you're like, okay,"},{"start":3408.47,"text":"because then it's just a problem with 22 variables."},{"start":3410.39,"text":"Everybody got this?"},{"start":3411.71,"text":"So this is kind of obvious."},{"start":3414.01,"text":"That means that"},{"start":3415.66,"text":"You could solve 2 to the n convex problems to solve these, right? If n is like 1,000, it's not. I mean, if n is, sorry, n is 100, n is less than 10, this might not be insane, right? So, yeah, so that's one."},{"start":3435.84,"text":"But this kind of brute force search doesn't work for, you know, obviously for bigger problems. It's extremely easy to show that the whole thing, that this general problem is NP-hard. I think we'll do that in a minute. And you could solve it globally by what are called branch-and-bound methods. And there's also branch-and-cut methods. There's all sorts of names for this. It's a whole area, I guess people would call it, like mixed integer convex programming."},{"start":3461.42,"text":"They might. These things can work. Some of them can work spectacularly. I'm not going to talk about those. But anyway, this is just general ideas about how you would solve these problems. So you can actually express Boolean LP as a cardinality problem like that. And I think you've actually done a couple of problems on your wrist. First of all, getting computing bounds."},{"start":3489.57,"text":"for Boolean LPs, and then also for heuristics for actually approximately solving them. I believe you had that in some homework, right? So the way that works is you want to solve this problem. Now, by the way, solving a set of linear inequalities with Boolean variables is basically like all..."},{"start":3510.67,"text":"kind of all of these problems in computer science. So everything is that, right? It's things like 3SAT. It's the traveling salesman problem. I can write down very short descriptions with 0, 1 variables. And you just write it this way, and it's a cardinality problem, and it just looks like this. It's actually the cardinality of x stacked on 1 minus x is less than or equal to n, right?"}],"speech_gaps":[],"frame":"../frames/v017/021.webp","frame_time":3384.01},{"title":"凸优化中的稀疏性与应用","segments":[{"id":200,"text":"This thing tells you the number of entries of x that are non-zero. This tells you the number of entries of x that are not 1, right? And so if you add those two together, the smallest that could be is n, and that would be if every x is either 0 or 1. If you throw in an x that's 3.6, then that's going to come out to be n plus 1 or something like that. That's sum, right?","zh":"这个东西告诉你x中有多少个非零元素。这告诉你x中有多少个元素不等于1，对吧？所以如果你把这两个加起来，最小的可能值是n，这只有在x中的每个元素都是0或1的情况下才会出现。如果你加入一个值为3.6的x，那么结果就会是n加1或者类似的情况。这就是求和，对吧？","start":3535.21,"end":3557.63},{"id":201,"text":"Okay, so that immediately establishes that solving convex cardinality problems is like NP-hard, right? So, okay. Okay, so now we'll look at some examples before we get into the methods because they're kind of very, very cool. Yeah, so sparse design is...","zh":"好的，所以这就立刻说明解决凸基数问题就像NP难问题一样，对吧？好的，好的，现在我们在深入方法之前先看一些例子，因为它们非常、非常有趣。是的，稀疏设计是……","start":3558.38,"end":3578.64},{"id":202,"text":"C is a set of things that give you your specifications. It says here's what x has to satisfy. And then you simply want the sparsest x that satisfies your conditions, right? And the idea there is presumably a zero value of x simplifies the design, right? Or generally, it can actually...","zh":"C是一组让你满足规格要求的事物。它在这里说明了x必须满足的条件。然后你只需要找到满足这些条件的最稀疏的x，对吧？其中的想法可能是x的零值简化了设计，对吧？或者一般来说，它实际上……","start":3579.09,"end":3599.57},{"id":203,"text":"be components that don't even for example i think we already talked about a truss design and a zero coefficient is it says you should attach a bar between this node and that one and what's the cross-sectional area zero and you're like okay as in no bar right for an fir filter if you're designing a filter it says there's whole blocks that you just don't need in the hardware right so that's what that is","zh":"可以是那些甚至不需要的组件，比如我想我们已经讨论过桁架设计，一个零系数表示你应该在该节点和那个节点之间安装一根杆，而横截面积为零，你就像是说没有杆，对吧？对于一个滤波器设计，如果你在设计一个滤波器，它说有一些整个块在硬件中是不需要的，对吧？这就是它的意思。","start":3600.03,"end":3621.69},{"id":204,"text":"Oh, it's used in wire sizing, which is actually really cool. So I've seen people use this for circuit design and wire sizing, where they're, let's say, generating, let's say, you're synthesizing, which is their word for optimizing, a power distribution network on a chip, right? So what you do is you put in a whole bunch of wires. It's like you put, in fact, an entire mesh in.","zh":"哦，它还用于电线尺寸设计，这实际上真的很酷。我见过有人用这个来进行电路设计和电线尺寸设计，比如他们生成，比如说，你在芯片上合成，也就是他们所说的优化，一个电源分布网络。你所做的就是输入大量的电线。事实上，你甚至会输入一个完整的网格。","start":3623.13,"end":3649.57},{"id":205,"text":"right you have no intention of actually implementing a mesh because it's going to be too expensive so you do that you write down the conditions it's all pretty straightforward right there's total amounts of of current that have to be go various places and all anyway so you do that that's going to be c and then your variables are the actually weirdly that's also it's the width of the wires they have a constant height so it's also the cross basically the cross-sectional area and then when you do that what you'll find","zh":"你没有打算实际实现一个网格，因为这会太昂贵，所以你这样做，你写下条件，这都很直接，对吧？总共有一定量的电流需要流向各个地方，不管怎样，你这样做，那就是c，然后你的变量是实际的，奇怪的是，这也是导线的宽度，它们有恒定的高度，所以这也是横截面积，当你这样做时，你会发现","start":3649.95,"end":3676.27},{"id":206,"text":"is it'll synthesize, it'll actually choose which wires to use. So you start it with a big mesh and then you'll end up with something. It has to be connected because otherwise you probably wouldn't end up, you wouldn't meet your specs, right? Because one of your specs is that you power up every module on your circuit. So how many people know about that kind of stuff? I think I do. Giving examples that no one gets, but that's okay. I mean, the basic idea though is pretty straightforward.","zh":"它会综合，它实际上会选择使用哪些导线。所以你从一个大的网格开始，然后你会得到一个结果。它必须是连通的，否则你可能不会满足规格，对吧？因为其中一个规格是你必须为电路上的每个模块供电。有多少人了解这种东西？我想我知道。举一些没人能理解的例子，但没关系。我的意思是，基本思想还是很直接的。","start":3676.73,"end":3707.26}],"notes":["本段讲授了稀疏性在优化问题中的应用，特别是稀疏设计的概念。稀疏性指的是变量中非零元素的数量，这在设计中可以简化结构，例如在滤波器设计中，某些部分不需要硬件实现。","讲者提到稀疏性问题通常与NP难问题相关，这表明在凸优化中，稀疏性问题的求解具有计算复杂性。同时，讲者通过例子说明稀疏性在实际工程中的应用，如电路设计中的布线问题。","在布线问题中，讲者提到使用网格结构进行设计，但实际中不会实现完整的网格，而是通过优化选择需要的布线。这涉及变量如导线宽度和截面积，这些变量需要满足电流分布等条件。","讲者强调了稀疏性在实际应用中的重要性，例如在滤波器设计中，某些部分可以被省略，从而减少硬件需求。这说明稀疏性不仅是一个数学概念，也是工程设计中的实用工具。","讲者通过具体例子说明了稀疏性如何影响设计的复杂性和成本，例如在芯片设计中，通过优化选择导线，可以降低制造成本并满足性能要求。","最后，讲者提到稀疏性问题的求解方法虽然复杂，但基本思想是清晰的，即通过优化选择关键部分，从而简化设计并满足约束条件。"],"formulas":[],"uncertainties":["be components that don't even for example i think we already talked about a truss design and a zero coefficient is it says you should attach a bar between this node and that one and what's the cross-sectional area zero and you're like okay as in no bar right for an fir filter if you're designing a filter it says there's whole blocks that you just don't need in the hardware right so that's what that is","right you have no intention of actually implementing a mesh because it's going to be too expensive so you do that you write down the conditions it's all pretty straightforward right there's total amounts of of current that have to be go various places and all anyway so you do that that's going to be c and then your variables are the actually weirdly that's also it's the width of the wires they have a constant height so it's also the cross basically the cross-sectional area and then when you do that what you'll find"],"diagram":"none","start":3535.21,"end":3707.26,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3535.21,"text":"This thing tells you the number of entries of x that are non-zero. This tells you the number of entries of x that are not 1, right? And so if you add those two together, the smallest that could be is n, and that would be if every x is either 0 or 1. If you throw in an x that's 3.6, then that's going to come out to be n plus 1 or something like that. That's sum, right?"},{"start":3558.38,"text":"Okay, so that immediately establishes that solving convex cardinality problems is like NP-hard, right? So, okay. Okay, so now we'll look at some examples before we get into the methods because they're kind of very, very cool. Yeah, so sparse design is..."},{"start":3579.09,"text":"C is a set of things that give you your specifications. It says here's what x has to satisfy. And then you simply want the sparsest x that satisfies your conditions, right? And the idea there is presumably a zero value of x simplifies the design, right? Or generally, it can actually..."},{"start":3600.03,"text":"be components that don't even for example i think we already talked about a truss design and a zero coefficient is it says you should attach a bar between this node and that one and what's the cross-sectional area zero and you're like okay as in no bar right for an fir filter if you're designing a filter it says there's whole blocks that you just don't need in the hardware right so that's what that is"},{"start":3623.13,"text":"Oh, it's used in wire sizing, which is actually really cool. So I've seen people use this for circuit design and wire sizing, where they're, let's say, generating, let's say, you're synthesizing, which is their word for optimizing, a power distribution network on a chip, right? So what you do is you put in a whole bunch of wires. It's like you put, in fact, an entire mesh in."},{"start":3649.95,"text":"right you have no intention of actually implementing a mesh because it's going to be too expensive so you do that you write down the conditions it's all pretty straightforward right there's total amounts of of current that have to be go various places and all anyway so you do that that's going to be c and then your variables are the actually weirdly that's also it's the width of the wires they have a constant height so it's also the cross basically the cross-sectional area and then when you do that what you'll find"},{"start":3676.73,"text":"is it'll synthesize, it'll actually choose which wires to use. So you start it with a big mesh and then you'll end up with something. It has to be connected because otherwise you probably wouldn't end up, you wouldn't meet your specs, right? Because one of your specs is that you power up every module on your circuit. So how many people know about that kind of stuff? I think I do. Giving examples that no one gets, but that's okay. I mean, the basic idea though is pretty straightforward."}],"speech_gaps":[],"frame":"../frames/v017/022.webp","frame_time":3547.21},{"title":"稀疏建模与回归选择","segments":[{"id":207,"text":"So these are examples of these things. Now we get to machine learning and statistics. You have sparse modeling and regressor selection. So here, I mean, this is not the notation that someone in statistics or machine learning would use, but too bad. So here, x, which someone else might call theta or beta, depends on what you...","zh":"这些都是这些事物的例子。现在我们进入机器学习和统计学领域。你有稀疏建模和回归器选择。这里，我指的是，这不是统计学或机器学习领域的人会使用的符号，但太糟糕了。所以，这里的x，其他人可能会称为theta或beta，取决于你……","start":3708.84,"end":3735.34},{"id":208,"text":"What your statistics identity is or machine learning identity is? But here you're simply saying Please it says please select K out of the number of features. I guess M. Is that right? Nope N so Please choose K features to use to fit the model, right? So by the way, that's it's very strong and pretty good regularizer or something like that, right?","zh":"你的统计学身份或机器学习身份是什么？但在这里，你只是简单地说，请从特征数量中选择K个。我猜是M。对吗？不，是N。所以请选择K个特征来拟合模型，对吧？顺便说一句，这是一件非常强大且相当好的正则化器，或者类似的东西，对吧？","start":3735.86,"end":3760.02},{"id":209,"text":"Okay. And I mean, you could do this by trying all, you know, N choose K choices and lots of examples. You know, people have things like you could write it as a penalized form. You could find the sparsest model that gives you a certain performance. I guess this would be on your training data.","zh":"好的。我的意思是，你可以通过尝试所有，你知道的，从N个特征中选择K个的组合，并且有很多例子。你知道的，人们会有像将它写成惩罚形式这样的方法。你可以找到一个最稀疏的模型，以达到一定的性能。我想这应该是在你的训练数据上进行的。","start":3761.13,"end":3783.87},{"id":210,"text":"Everybody got that? So that'd be, find me the sparsest thing that actually gives me the following pre-specified performance on the training data, right? So, okay. So this is the sparse modeling and regressor selection. Sparse signal reconstruction, this is a...","zh":"大家都明白了吗？所以，这就是找到一个最稀疏的东西，它实际上在训练数据上达到预设的性能，对吧？好的。所以这就是稀疏建模和回归器选择。稀疏信号重建，这是一件……","start":3784.35,"end":3800.81},{"id":211,"text":"a big deal, maybe fading a little bit, but maybe 90s through the maybe five years ago was kind of a big deal. And the typical thing there was this, is you'd say a measure, what you want to do is estimate something like x. So I'll switch to their dialect, right? So a would be a basis, which drives the columns of a would be a basis for the signals.","zh":"非常重要的事情，可能正在逐渐淡出，但可能从90年代到大约五年前，曾经相当重要。那里的典型做法是，你会说一个度量，你想要做的事情是估计像x这样的东西。所以我将切换到他们的术语，对吧？所以a是一个基，驱动a的列是信号的基。","start":3801.48,"end":3828.96},{"id":212,"text":"Except that, I don't know, since 1820, everyone agreed what a basis was. And people in signal processing decided that they would use their own meaning for it. And they just dropped the fact that they were independent. I couldn't make this stuff up. And then if people challenged them, they'd say, oh, no, you're misunderstanding. This is an overcomplete basis. Right. Which, by the way.","zh":"不过，我并不知道，自1820年以来，大家已经一致同意什么是基。而信号处理领域的人决定他们要用自己的意思来定义它。他们只是忽略了它们的独立性。我不能编造这些内容。然后如果有人挑战他们，他们会说，哦，不，你误解了。这是一个过完备基。对了。","start":3830.49,"end":3853.38},{"id":213,"text":"You want to know how you describe an overcomplete basis? It's a set of vectors. That's what it is. It has no other properties. Anyway, don't get me started on that. But they would say, so the columns of A would be, they would call that their basis, right? Even though if they said that to any normal person, not in that particular sub, sub, sub field, they would interpret that. They'd say, oh, that's cool. It's a basis. Great. Meaning they're linearly independent and span, it doesn't matter. So do that.","zh":"你想知道如何描述一个过完备基吗？它就是一个向量集合。这就是它的定义。它没有其他性质。总之，我就不多说了。但他们会说，矩阵A的列就是他们的基，对吧？即使他们对一个不在该特定子、子、子领域的一般人说这句话，那个人也会理解。他们会说，哦，这很酷。这是一个基。很好。意思是它们线性无关并且张成空间，不管怎样，就这样做。","start":3854.41,"end":3883.23}],"notes":["本段讲授了稀疏建模和回归选择的概念，强调了在机器学习和统计学中选择K个特征以拟合模型的重要性。讲者指出，这种选择可以被视为一种强大的正则化方法，有助于提高模型的泛化能力。","讲者提到，稀疏建模的目标是找到最稀疏的模型，使其在训练数据上达到预设的性能。这通常通过尝试所有可能的特征组合或使用惩罚形式来实现。","讲者还讨论了稀疏信号重建的重要性，指出它在90年代到五年前是一个重要的研究领域。他提到，通常会使用基（basis）来表示信号，但信号处理领域对基的定义与传统数学定义有所不同。","讲者指出，信号处理领域中所谓的“过完备基”实际上只是向量的集合，没有其他属性。他批评了这种定义方式，认为它忽略了线性独立性这一关键特性。","讲者强调，虽然信号处理领域使用了不同的术语，但普通人在理解这些概念时可能会误解，认为基意味着线性独立且能张成空间。","讲者最后指出，这种术语的混淆可能导致对稀疏建模和回归选择的理解偏差，因此需要明确区分不同领域的定义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3708.84,"end":3883.23,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3708.84,"text":"So these are examples of these things. Now we get to machine learning and statistics. You have sparse modeling and regressor selection. So here, I mean, this is not the notation that someone in statistics or machine learning would use, but too bad. So here, x, which someone else might call theta or beta, depends on what you..."},{"start":3735.86,"text":"What your statistics identity is or machine learning identity is? But here you're simply saying Please it says please select K out of the number of features. I guess M. Is that right? Nope N so Please choose K features to use to fit the model, right? So by the way, that's it's very strong and pretty good regularizer or something like that, right?"},{"start":3761.13,"text":"Okay. And I mean, you could do this by trying all, you know, N choose K choices and lots of examples. You know, people have things like you could write it as a penalized form. You could find the sparsest model that gives you a certain performance. I guess this would be on your training data."},{"start":3784.35,"text":"Everybody got that? So that'd be, find me the sparsest thing that actually gives me the following pre-specified performance on the training data, right? So, okay. So this is the sparse modeling and regressor selection. Sparse signal reconstruction, this is a..."},{"start":3801.48,"text":"a big deal, maybe fading a little bit, but maybe 90s through the maybe five years ago was kind of a big deal. And the typical thing there was this, is you'd say a measure, what you want to do is estimate something like x. So I'll switch to their dialect, right? So a would be a basis, which drives the columns of a would be a basis for the signals."},{"start":3830.49,"text":"Except that, I don't know, since 1820, everyone agreed what a basis was. And people in signal processing decided that they would use their own meaning for it. And they just dropped the fact that they were independent. I couldn't make this stuff up. And then if people challenged them, they'd say, oh, no, you're misunderstanding. This is an overcomplete basis. Right. Which, by the way."},{"start":3854.41,"text":"You want to know how you describe an overcomplete basis? It's a set of vectors. That's what it is. It has no other properties. Anyway, don't get me started on that. But they would say, so the columns of A would be, they would call that their basis, right? Even though if they said that to any normal person, not in that particular sub, sub, sub field, they would interpret that. They'd say, oh, that's cool. It's a basis. Great. Meaning they're linearly independent and span, it doesn't matter. So do that."}],"speech_gaps":[],"frame":"../frames/v017/023.webp","frame_time":3720.84},{"title":"稀疏性与异常值处理","segments":[{"id":214,"text":"And then they would say, the thing I'm looking for is sparse in that basis. So you'd hear things like this. You'd say, well, I think that the MRI image I want to recover is sparse in this wavelet basis. That would be the typical kind of thing they would say. Right? And that's fine. Anyway, so you'd end up with things that would look like this. And these are generally things like sparse signal reconstruction. So, okay.","zh":"然后他们会说，我寻找的是在该基底下稀疏的信号。所以你会听到这样的话。你会说，我想恢复的MRI图像是在这个小波基底下稀疏的。这通常是他们所说的典型情况。对吧？这没问题。总之，你会得到一些看起来像这样的结果。这些通常是稀疏信号重建之类的问题。好的。","start":3883.71,"end":3912.45},{"id":215,"text":"Another one, which is actually very interesting, this is less often spoken of, I think, is handling outliers, right? This actually kind of makes sense, right? What you should have in your mind by now, and I imagine already do, is that when I say something like L1,","zh":"另一个，实际上非常有趣，这不太常被提及，对吧？处理异常值，这其实很有道理，对吧？到目前为止，你应该已经想到，当我提到像L1这样的内容时，一些不同的东西应该浮现出来，对吧？你应该在脑海中浮现出一幅画面。它应该被看作是一种稀疏化工具。那么，它为什么具有稀疏性呢？就是那个底部的点。因为大致来说，发生的情况是，将某些值推向零的压力会持续，直到它们变为零。","start":3915.23,"end":3937.13},{"id":216,"text":"different things should come up, right? A picture in your mind should come up. It should come up as, let's say, a sparsifier. And what's sparsifying about it? That point at the bottom. Because roughly speaking, what happens is the pressure to move something to zero keeps up until you're zero.","zh":"对吧？L1还有一个特性。你也知道，当它作为惩罚项时，它是一种稳健的工具，对吧？因为发生的情况是，对于大值，它增长得非常缓慢。它以凸惩罚项所能达到的最慢速度增长，对吧？","start":3938.22,"end":3955.0},{"id":217,"text":"Right? There's another property of L1. You also know that when it's a penalty, it's something that's robust, right? Because what happens is that means that for large values, it grows slowly. It grows as slowly as a convex penalty can, right?","zh":"你会用它来做稀疏化之类的事情。你可以使用Huber惩罚项，对吧？它一开始是平方的，然后过渡到线性，对吧？所以它看起来像是对大值的一种L1。当你的数据中存在非常大的异常值时，这会表现得非常好，对吧？所以这些是你到目前为止应该已经想到的内容，我希望如此。","start":3956.01,"end":3974.05},{"id":218,"text":"And that you would use to do things like to do sparse stuff. You could have a Huber penalty, right? Where it starts out as a square and then transitions to linear, right? So it looks like sort of an L1 for large things. And then that's going to play really well when there are really big outliers in your data, right? So these are things you should have in your mind by now, I hope.","zh":"因此，处理异常值的问题与这种基数问题相关联，这不应该令人感到意外。这里有一个测量模型。它说我要测量一些东西。它们是我想猜测的变量x的线性函数，加上一个高斯噪声。这没问题。","start":3974.62,"end":3998.52},{"id":219,"text":"So it shouldn't be too surprising that the problem of handling outliers is related to this cardinality thing. So here's the measurement model. It says I'm going to measure some things. They are linear functions of the thing I want to guess, which is x, plus a Gaussian. That's fine.","zh":"所以，处理异常值的问题与这种基数问题相关联，这不应该令人感到意外。这里有一个测量模型。它说我要测量一些东西。它们是我想猜测的变量x的线性函数，加上一个高斯噪声。这没问题。","start":4000.27,"end":4022.53},{"id":220,"text":"and then plus wi wi is simply assumed to be sparse now what this means otherwise that we have no i i say nothing about the size of ai i have no statistical model for wi sorry i have no statistical model nothing i just say it's sparse oh and it has only k non-zeros and what this really means is that k up to k of these measurements are completely wrong because wi can be anything we didn't say what wi could be","zh":"然后加上 wi wi 被简单地假设为稀疏的。现在这意味着什么呢？否则，我并没有对 ai 的大小说任何事情，我对 wi 没有任何统计模型，抱歉，我没有任何统计模型，我只说它稀疏。哦，而且它只有 k 个非零元素。而这实际上意味着，最多有 k 个这些测量值是完全错误的，因为 wi 可以是任何东西，我们没有说 wi 可以是什么","start":4023.07,"end":4050.17}],"notes":["本段讨论了在处理异常值时，假设噪声向量wi是稀疏的。这意味着在测量模型中，只有k个测量值可能是完全错误的，而其他测量值是正确的。这种稀疏性假设允许在存在异常值的情况下进行鲁棒估计。","讲者提到，当使用L1范数作为惩罚项时，它具有鲁棒性，因为对于大值，其增长速度较慢。这种性质使得L1范数在处理异常值时非常有用。","讲者还提到，Huber惩罚函数在大值时类似于L1范数，这使得它在存在大异常值的数据中表现良好。","在测量模型中，讲者假设测量值是线性函数的输出加上高斯噪声。然而，对于噪声向量wi，讲者仅假设其稀疏性，而没有提供统计模型。","讲者指出，由于wi是稀疏的，最多有k个测量值是错误的，而其他测量值是正确的。这种假设允许在存在异常值的情况下进行稀疏信号重建。","讲者强调，处理异常值与稀疏性之间存在联系，因为稀疏性假设允许在存在异常值的情况下进行鲁棒估计。"],"formulas":[{"latex":"\\|w_i\\|_1","symbols":"L1 范数用于衡量噪声向量的稀疏性","explanation":"L1 范数用于衡量噪声向量的稀疏性是正确的，但需要明确 w_i 是稀疏的噪声向量，且其稀疏性意味着只有 k 个非零元素。","evidence":"Another one, which is actually very interesting, this is less often spoken of, I think, is handling outliers, right? This actually kind of makes sense, right? What you should have in your mind by now, and I imagine already do, is that when I say something like L1,"}],"uncertainties":["wi can be anything we didn't say what wi could be"],"diagram":"none","start":3883.71,"end":4050.17,"asr_flags":[],"math_clarifications":["公式 x = A x + w_i 是不正确的，因为 x 是要估计的信号，而 A x 应该是测量矩阵与信号的乘积，而不是 x 自身。正确的形式应为 y = A x + w_i，其中 y 是测量数据。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3883.71,"text":"And then they would say, the thing I'm looking for is sparse in that basis. So you'd hear things like this. You'd say, well, I think that the MRI image I want to recover is sparse in this wavelet basis. That would be the typical kind of thing they would say. Right? And that's fine. Anyway, so you'd end up with things that would look like this. And these are generally things like sparse signal reconstruction. So, okay."},{"start":3915.23,"text":"Another one, which is actually very interesting, this is less often spoken of, I think, is handling outliers, right? This actually kind of makes sense, right? What you should have in your mind by now, and I imagine already do, is that when I say something like L1,"},{"start":3938.22,"text":"different things should come up, right? A picture in your mind should come up. It should come up as, let's say, a sparsifier. And what's sparsifying about it? That point at the bottom. Because roughly speaking, what happens is the pressure to move something to zero keeps up until you're zero."},{"start":3956.01,"text":"Right? There's another property of L1. You also know that when it's a penalty, it's something that's robust, right? Because what happens is that means that for large values, it grows slowly. It grows as slowly as a convex penalty can, right?"},{"start":3974.62,"text":"And that you would use to do things like to do sparse stuff. You could have a Huber penalty, right? Where it starts out as a square and then transitions to linear, right? So it looks like sort of an L1 for large things. And then that's going to play really well when there are really big outliers in your data, right? So these are things you should have in your mind by now, I hope."},{"start":4000.27,"text":"So it shouldn't be too surprising that the problem of handling outliers is related to this cardinality thing. So here's the measurement model. It says I'm going to measure some things. They are linear functions of the thing I want to guess, which is x, plus a Gaussian. That's fine."},{"start":4023.07,"text":"and then plus wi wi is simply assumed to be sparse now what this means otherwise that we have no i i say nothing about the size of ai i have no statistical model for wi sorry i have no statistical model nothing i just say it's sparse oh and it has only k non-zeros and what this really means is that k up to k of these measurements are completely wrong because wi can be anything we didn't say what wi could be"}],"speech_gaps":[],"frame":"../frames/v017/024.webp","frame_time":3895.71},{"title":"处理异常值的优化问题","segments":[{"id":221,"text":"So it basically says, I'm going to give you a bunch of measurements. I'll give you M measurements. I will tell you the following. K of them can be completely wrong. And then you'd say, please fit a model. Everybody following this? So that's a very strong outlier formulation, handling an outlier. But it's a perfectly good one, right? And you could write this lots of ways. One way is you could write it this way. It says that you are going to select.","zh":"所以基本上是说，我会给你一组测量值。我会告诉你以下内容：其中K个可能是完全错误的。然后你会说，请拟合一个模型。大家明白了吗？这是一种非常强的异常值处理方式，处理异常值。但这是一个完全合理的做法，对吧？你可以用很多种方式来表达这一点。其中一种方式就是你可以说，你将选择。","start":4050.62,"end":4078.4},{"id":222,"text":"you're going to select the measurements, and you're going to select a set of measurements to ignore. So you're going to say, thank you for your M measurements. In my opinion, I think that the 11th, the 22nd, the 48th, and the 137th, I think they're complete nonsense. I don't believe them. So you take that.","zh":"你将选择测量值，并选择一组要忽略的测量值。所以你会说，谢谢你的M个测量值。在我看来，我认为第11个、第22个、第48个和第137个，我认为它们完全是胡说八道。我不相信它们。所以你把这些拿走。","start":4079.81,"end":4103.09},{"id":223,"text":"And then you would toss them out and solve the least squares problem. And you can rewrite that immediately as just a simple cardinality constraint. It looks like this, right? So let's walk through this. W is, other than this, it's not constrained at all. So if a Wi is non-zero, this Wi can be anything you like. And I can actually choose that Wi to equal this residual here. In which case...","zh":"然后你会把它们丢弃，并解决一个最小二乘问题。你可以立即将其重写为一个简单的基数约束。它看起来像这样，对吧？让我们来走一遍这个过程。W除了这个之外，没有任何约束。所以如果Wi不为零，这个Wi可以是任何你喜欢的值。实际上，我可以选择让这个Wi等于这里的残差。在这种情况下……","start":4103.5,"end":4131.89},{"id":224,"text":"That means Y is AX, right? So if you work out what this is, it's exactly the same as that. Does that make sense there? So that's the idea there. Okay. Fascinating area has to do with, we talked a little bit about this when we talked about phase one methods, is minimum number of violations. So I give you a set of convex constraints like M specifications for something.","zh":"这意味着Y等于AX，对吧？所以如果你计算出这个表达式，它就和那个完全一样。这在那儿有意义吗？这就是这个想法。好的。一个引人入胜的领域与我们之前讨论的相位一方法有关，即最小化违反次数。我会给你一组凸约束，比如某物的M个规范。","start":4132.21,"end":4161.14},{"id":225,"text":"And if they're all feasible, great. If they're not all feasible, then I might want to say something like this. Please find an x that violates as few as possible. Make sense? So that would be the picture. You could put weights on it. It doesn't matter. But here, just violate them as few as possible. And so that you could write down this way. I introduce a slack variable t. If t is zero, then it means...","zh":"如果它们全部可行，那就太好了。如果它们并非全部可行，那么我可能会想要说，找到一个x，使得违反的约束尽可能少。这有意义吗？所以这就是这个图景。你可以给它加权，这并不重要。但在这里，只需尽可能少地违反它们。因此你可以这样写下来。我引入了一个松弛变量t。如果t等于零，那么这意味着……","start":4162.72,"end":4191.48},{"id":226,"text":"you've actually satisfied the i-th inequality. But if t is positive, it means you might not have, right? And of course, if you're minimizing the cardinality, if you did satisfy it, you'd take t equals zero here, right? So this does exactly what you're asked to do, right? Does this make sense? So this would be that. Yeah. And we'll see all sorts of cool things happen. Yes.","zh":"你实际上已经满足了第i个不等式。但如果t是正的，这意味着你可能没有满足，对吧？当然，如果你是在最小化基数，如果你确实满足了这个条件，你会在这里取t等于零，对吧？所以这正是你被要求做的事情，对吧？这有意义吗？所以这就是那个情况。是的。我们会看到各种有趣的事情发生。是的。","start":4192.22,"end":4216.21}],"notes":["本段讲解了如何处理含有异常值的测量数据。讲者指出，当给定M个测量值时，其中K个可能是完全错误的，需要构建一个模型来拟合这些数据。这种处理方式被称为异常值处理，是一种非常强的模型，能够有效应对异常值问题。","讲者进一步说明，可以通过选择性地忽略某些测量值来构建模型。例如，讲者提到可以忽略第11、22、48和137个测量值，因为这些值被认为是无意义的。然后，通过剔除这些异常值，解决最小二乘问题。","讲者提到，这种处理方式可以转化为一个简单的基数约束问题。通过引入变量W，可以将问题重新表述为一个约束优化问题，其中W的非零值对应于残差。这种转换使得问题更容易处理。","讲者还提到，这种处理方式与最小违反次数的概念相关。当给定一组凸约束时，如果所有约束都可行，那么问题就解决了；否则，需要找到一个x，使得违反的约束尽可能少。","讲者引入了一个松弛变量t，用于表示是否满足第i个不等式。如果t为零，表示满足该不等式；如果t为正，则表示不满足。通过最小化基数，可以确保尽可能少地违反约束。","最后，讲者指出，这种处理方式能够有效地解决异常值问题，并且在后续的课程中会看到更多有趣的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4050.62,"end":4216.21,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4050.62,"text":"So it basically says, I'm going to give you a bunch of measurements. I'll give you M measurements. I will tell you the following. K of them can be completely wrong. And then you'd say, please fit a model. Everybody following this? So that's a very strong outlier formulation, handling an outlier. But it's a perfectly good one, right? And you could write this lots of ways. One way is you could write it this way. It says that you are going to select."},{"start":4079.81,"text":"you're going to select the measurements, and you're going to select a set of measurements to ignore. So you're going to say, thank you for your M measurements. In my opinion, I think that the 11th, the 22nd, the 48th, and the 137th, I think they're complete nonsense. I don't believe them. So you take that."},{"start":4103.5,"text":"And then you would toss them out and solve the least squares problem. And you can rewrite that immediately as just a simple cardinality constraint. It looks like this, right? So let's walk through this. W is, other than this, it's not constrained at all. So if a Wi is non-zero, this Wi can be anything you like. And I can actually choose that Wi to equal this residual here. In which case..."},{"start":4132.21,"text":"That means Y is AX, right? So if you work out what this is, it's exactly the same as that. Does that make sense there? So that's the idea there. Okay. Fascinating area has to do with, we talked a little bit about this when we talked about phase one methods, is minimum number of violations. So I give you a set of convex constraints like M specifications for something."},{"start":4162.72,"text":"And if they're all feasible, great. If they're not all feasible, then I might want to say something like this. Please find an x that violates as few as possible. Make sense? So that would be the picture. You could put weights on it. It doesn't matter. But here, just violate them as few as possible. And so that you could write down this way. I introduce a slack variable t. If t is zero, then it means..."},{"start":4192.22,"text":"you've actually satisfied the i-th inequality. But if t is positive, it means you might not have, right? And of course, if you're minimizing the cardinality, if you did satisfy it, you'd take t e
