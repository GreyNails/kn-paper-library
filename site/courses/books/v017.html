 A would be, they would call that their basis, right? Even though if they said that to any normal person, not in that particular sub, sub, sub field, they would interpret that. They'd say, oh, that's cool. It's a basis. Great. Meaning they're linearly independent and span, it doesn't matter. So do that."}],"speech_gaps":[],"frame":"../frames/v017/023.webp","frame_time":3720.84},{"title":"稀疏性与异常值处理","segments":[{"id":214,"text":"And then they would say, the thing I'm looking for is sparse in that basis. So you'd hear things like this. You'd say, well, I think that the MRI image I want to recover is sparse in this wavelet basis. That would be the typical kind of thing they would say. Right? And that's fine. Anyway, so you'd end up with things that would look like this. And these are generally things like sparse signal reconstruction. So, okay."},{"id":215,"text":"Another one, which is actually very interesting, this is less often spoken of, I think, is handling outliers, right? This actually kind of makes sense, right? What you should have in your mind by now, and I imagine already do, is that when I say something like L1,"},{"id":216,"text":"different things should come up, right? A picture in your mind should come up. It should come up as, let's say, a sparsifier. And what's sparsifying about it? That point at the bottom. Because roughly speaking, what happens is the pressure to move something to zero keeps up until you're zero."},{"id":217,"text":"Right? There's another property of L1. You also know that when it's a penalty, it's something that's robust, right? Because what happens is that means that for large values, it grows slowly. It grows as slowly as a convex penalty can, right?"},{"id":218,"text":"And that you would use to do things like to do sparse stuff. You could have a Huber penalty, right? Where it starts out as a square and then transitions to linear, right? So it looks like sort of an L1 for large things. And then that's going to play really well when there are really big outliers in your data, right? So these are things you should have in your mind by now, I hope."},{"id":219,"text":"So it shouldn't be too surprising that the problem of handling outliers is related to this cardinality thing. So here's the measurement model. It says I'm going to measure some things. They are linear functions of the thing I want to guess, which is x, plus a Gaussian. That's fine."},{"id":220,"text":"and then plus wi wi is simply assumed to be sparse now what this means otherwise that we have no i i say nothing about the size of ai i have no statistical model for wi sorry i have no statistical model nothing i just say it's sparse oh and it has only k non-zeros and what this really means is that k up to k of these measurements are completely wrong because wi can be anything we didn't say what wi could be"}],"notes":["本段讨论了在处理异常值时，假设噪声向量wi是稀疏的。这意味着在测量模型中，只有k个测量值可能是完全错误的，而其他测量值是正确的。这种稀疏性假设允许在存在异常值的情况下进行鲁棒估计。","讲者提到，当使用L1范数作为惩罚项时，它具有鲁棒性，因为对于大值，其增长速度较慢。这种性质使得L1范数在处理异常值时非常有用。","讲者还提到，Huber惩罚函数在大值时类似于L1范数，这使得它在存在大异常值的数据中表现良好。","在测量模型中，讲者假设测量值是线性函数的输出加上高斯噪声。然而，对于噪声向量wi，讲者仅假设其稀疏性，而没有提供统计模型。","讲者指出，由于wi是稀疏的，最多有k个测量值是错误的，而其他测量值是正确的。这种假设允许在存在异常值的情况下进行稀疏信号重建。","讲者强调，处理异常值与稀疏性之间存在联系，因为稀疏性假设允许在存在异常值的情况下进行鲁棒估计。"],"formulas":[{"latex":"\\|w_i\\|_1","symbols":"L1 范数用于衡量噪声向量的稀疏性","explanation":"L1 范数用于衡量噪声向量的稀疏性是正确的，但需要明确 w_i 是稀疏的噪声向量，且其稀疏性意味着只有 k 个非零元素。","evidence":"Another one, which is actually very interesting, this is less often spoken of, I think, is handling outliers, right? This actually kind of makes sense, right? What you should have in your mind by now, and I imagine already do, is that when I say something like L1,"}],"uncertainties":["wi can be anything we didn't say what wi could be"],"diagram":"none","start":3883.71,"end":4050.17,"asr_flags":[],"math_clarifications":["公式 x = A x + w_i 是不正确的，因为 x 是要估计的信号，而 A x 应该是测量矩阵与信号的乘积，而不是 x 自身。正确的形式应为 y = A x + w_i，其中 y 是测量数据。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3883.71,"text":"And then they would say, the thing I'm looking for is sparse in that basis. So you'd hear things like this. You'd say, well, I think that the MRI image I want to recover is sparse in this wavelet basis. That would be the typical kind of thing they would say. Right? And that's fine. Anyway, so you'd end up with things that would look like this. And these are generally things like sparse signal reconstruction. So, okay."},{"start":3915.23,"text":"Another one, which is actually very interesting, this is less often spoken of, I think, is handling outliers, right? This actually kind of makes sense, right? What you should have in your mind by now, and I imagine already do, is that when I say something like L1,"},{"start":3938.22,"text":"different things should come up, right? A picture in your mind should come up. It should come up as, let's say, a sparsifier. And what's sparsifying about it? That point at the bottom. Because roughly speaking, what happens is the pressure to move something to zero keeps up until you're zero."},{"start":3956.01,"text":"Right? There's another property of L1. You also know that when it's a penalty, it's something that's robust, right? Because what happens is that means that for large values, it grows slowly. It grows as slowly as a convex penalty can, right?"},{"start":3974.62,"text":"And that you would use to do things like to do sparse stuff. You could have a Huber penalty, right? Where it starts out as a square and then transitions to linear, right? So it looks like sort of an L1 for large things. And then that's going to play really well when there are really big outliers in your data, right? So these are things you should have in your mind by now, I hope."},{"start":4000.27,"text":"So it shouldn't be too surprising that the problem of handling outliers is related to this cardinality thing. So here's the measurement model. It says I'm going to measure some things. They are linear functions of the thing I want to guess, which is x, plus a Gaussian. That's fine."},{"start":4023.07,"text":"and then plus wi wi is simply assumed to be sparse now what this means otherwise that we have no i i say nothing about the size of ai i have no statistical model for wi sorry i have no statistical model nothing i just say it's sparse oh and it has only k non-zeros and what this really means is that k up to k of these measurements are completely wrong because wi can be anything we didn't say what wi could be"}],"speech_gaps":[],"frame":"../frames/v017/024.webp","frame_time":3895.71},{"title":"处理异常值的优化问题","segments":[{"id":221,"text":"So it basically says, I'm going to give you a bunch of measurements. I'll give you M measurements. I will tell you the following. K of them can be completely wrong. And then you'd say, please fit a model. Everybody following this? So that's a very strong outlier formulation, handling an outlier. But it's a perfectly good one, right? And you could write this lots of ways. One way is you could write it this way. It says that you are going to select."},{"id":222,"text":"you're going to select the measurements, and you're going to select a set of measurements to ignore. So you're going to say, thank you for your M measurements. In my opinion, I think that the 11th, the 22nd, the 48th, and the 137th, I think they're complete nonsense. I don't believe them. So you take that."},{"id":223,"text":"And then you would toss them out and solve the least squares problem. And you can rewrite that immediately as just a simple cardinality constraint. It looks like this, right? So let's walk through this. W is, other than this, it's not constrained at all. So if a Wi is non-zero, this Wi can be anything you like. And I can actually choose that Wi to equal this residual here. In which case..."},{"id":224,"text":"That means Y is AX, right? So if you work out what this is, it's exactly the same as that. Does that make sense there? So that's the idea there. Okay. Fascinating area has to do with, we talked a little bit about this when we talked about phase one methods, is minimum number of violations. So I give you a set of convex constraints like M specifications for something."},{"id":225,"text":"And if they're all feasible, great. If they're not all feasible, then I might want to say something like this. Please find an x that violates as few as possible. Make sense? So that would be the picture. You could put weights on it. It doesn't matter. But here, just violate them as few as possible. And so that you could write down this way. I introduce a slack variable t. If t is zero, then it means..."},{"id":226,"text":"you've actually satisfied the i-th inequality. But if t is positive, it means you might not have, right? And of course, if you're minimizing the cardinality, if you did satisfy it, you'd take t equals zero here, right? So this does exactly what you're asked to do, right? Does this make sense? So this would be that. Yeah. And we'll see all sorts of cool things happen. Yes."}],"notes":["本段讲解了如何处理含有异常值的测量数据。讲者指出，当给定M个测量值时，其中K个可能是完全错误的，需要构建一个模型来拟合这些数据。这种处理方式被称为异常值处理，是一种非常强的模型，能够有效应对异常值问题。","讲者进一步说明，可以通过选择性地忽略某些测量值来构建模型。例如，讲者提到可以忽略第11、22、48和137个测量值，因为这些值被认为是无意义的。然后，通过剔除这些异常值，解决最小二乘问题。","讲者提到，这种处理方式可以转化为一个简单的基数约束问题。通过引入变量W，可以将问题重新表述为一个约束优化问题，其中W的非零值对应于残差。这种转换使得问题更容易处理。","讲者还提到，这种处理方式与最小违反次数的概念相关。当给定一组凸约束时，如果所有约束都可行，那么问题就解决了；否则，需要找到一个x，使得违反的约束尽可能少。","讲者引入了一个松弛变量t，用于表示是否满足第i个不等式。如果t为零，表示满足该不等式；如果t为正，则表示不满足。通过最小化基数，可以确保尽可能少地违反约束。","最后，讲者指出，这种处理方式能够有效地解决异常值问题，并且在后续的课程中会看到更多有趣的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4050.62,"end":4216.21,"asr_flags":[],"raw_segments":[{"start":4050.62,"text":"So it basically says, I'm going to give you a bunch of measurements. I'll give you M measurements. I will tell you the following. K of them can be completely wrong. And then you'd say, please fit a model. Everybody following this? So that's a very strong outlier formulation, handling an outlier. But it's a perfectly good one, right? And you could write this lots of ways. One way is you could write it this way. It says that you are going to select."},{"start":4079.81,"text":"you're going to select the measurements, and you're going to select a set of measurements to ignore. So you're going to say, thank you for your M measurements. In my opinion, I think that the 11th, the 22nd, the 48th, and the 137th, I think they're complete nonsense. I don't believe them. So you take that."},{"start":4103.5,"text":"And then you would toss them out and solve the least squares problem. And you can rewrite that immediately as just a simple cardinality constraint. It looks like this, right? So let's walk through this. W is, other than this, it's not constrained at all. So if a Wi is non-zero, this Wi can be anything you like. And I can actually choose that Wi to equal this residual here. In which case..."},{"start":4132.21,"text":"That means Y is AX, right? So if you work out what this is, it's exactly the same as that. Does that make sense there? So that's the idea there. Okay. Fascinating area has to do with, we talked a little bit about this when we talked about phase one methods, is minimum number of violations. So I give you a set of convex constraints like M specifications for something."},{"start":4162.72,"text":"And if they're all feasible, great. If they're not all feasible, then I might want to say something like this. Please find an x that violates as few as possible. Make sense? So that would be the picture. You could put weights on it. It doesn't matter. But here, just violate them as few as possible. And so that you could write down this way. I introduce a slack variable t. If t is zero, then it means..."},{"start":4192.22,"text":"you've actually satisfied the i-th inequality. But if t is positive, it means you might not have, right? And of course, if you're minimizing the cardinality, if you did satisfy it, you'd take t equals zero here, right? So this does exactly what you're asked to do, right? Does this make sense? So this would be that. Yeah. And we'll see all sorts of cool things happen. Yes."}],"speech_gaps":[],"frame":"../frames/v017/025.webp","frame_time":4062.62},{"title":"凸优化中的启发式方法与分类器示例","segments":[{"id":227,"text":"Wasn't this like the feasibility thing we did? We had like one transpose S. Yes. We could solve that one, right? Yes, you can. Okay, you have to be very careful. You can quote, solve, unquote it, if that's what you mean. But I guess here, the right way to say it that's official would be to say we have a powerful heuristic for approximately solving that problem, comma, based on convex optimization. That would be the true statement. You can't solve this problem."},{"id":228,"text":"Okay. Right. Well, you can if there's like, you know, 10 inequalities, right? But other than that, you can't, if there's 100 inequalities, you can't solve that problem. I just misremembered. I thought that was, that's what we were doing when we had like the one transpose S. Nope. The, nope. The one transpose S on the slack. That was simply a heuristic for approximately solving that problem. But you don't solve that problem."},{"id":229,"text":"Yeah, I mean you might solve it, but you won't know you've solved it, but that's another way to say it right Yeah, in fact in many cases you probably do right Yeah, so and yes, they're gonna be related to this right Okay, so good example is like a linear classifier, so I give you a whole bunch of points With labels right say with a boolean label yi and"},{"id":230,"text":"You know, what you want is you want to find W and V. Yeah, so this says that you want this to look like that, right? You want all these to be less than or equal to zero or bigger than or equal to zero. It wouldn't matter whatever your convention is, right? And so then you can rewrite this. If you want the classifier that makes the fewest number of mistakes, it's going to be one of these convex cardinal. It's going to be this one, right? By the way,"},{"id":231,"text":"When we do our magic or approximation or whatever it is, and we make this into an L1 problem, what do you imagine this is going to turn into? Roughly. It's going to turn into a support vector machine, roughly. Right. So, in fact, if I add L2 regularization, that's exactly what it is. So, okay. Here's another weird one, which is not the same. So, the story starts the same way."},{"id":232,"text":"I have a set of infeasible inequalities. In the previous story, which is kind of a weird positive one, it would basically say, ignore the fewest number of inequalities to make that feasible. And you go, cool. Of your 22 inequalities, if I just toss out these five, then the rest I can make feasible. Everybody, that's what we're doing. This one says to identify what is the essence of the mutual infeasibility."}],"notes":["本段讨论了凸优化中启发式方法的使用，强调了在处理不等式约束时，当约束数量较多时，无法直接求解，而只能通过启发式方法进行近似求解。讲者指出，当有10个不等式时，可能可以求解，但当有100个不等式时，就无法直接求解。这说明了在实际应用中，启发式方法的重要性。","讲者通过线性分类器的例子，说明了如何将分类问题转化为凸优化问题。他提到，目标是找到权重W和V，使得分类器的输出满足一定的不等式约束。这与支持向量机（SVM）的优化问题相关，当使用L1正则化时，可以近似得到SVM的解。","讲者进一步指出，当面对不相容的不等式约束时，可以采用不同的策略。一种是忽略最少数量的不等式以使问题变得可行，另一种是识别不相容性的本质。这说明了在处理不相容问题时，需要根据具体情况选择不同的方法。","在讨论支持向量机时，讲者提到，当将问题转化为L1正则化问题时，可以得到近似解，而添加L2正则化则可以得到精确的SVM解。这说明了不同正则化方法对优化问题的影响。","讲者还提到，当处理不相容的不等式约束时，可以采用不同的策略，例如忽略最少数量的不等式以使问题变得可行，或者识别不相容性的本质。这说明了在处理不相容问题时，需要根据具体情况选择不同的方法。","讲者通过多个例子说明了凸优化在实际问题中的应用，包括分类器设计和不相容问题的处理。这些例子帮助学生理解如何将实际问题转化为凸优化问题，并使用启发式方法进行求解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4216.94,"end":4395.18,"asr_flags":[],"raw_segments":[{"start":4216.94,"text":"Wasn't this like the feasibility thing we did? We had like one transpose S. Yes. We could solve that one, right? Yes, you can. Okay, you have to be very careful. You can quote, solve, unquote it, if that's what you mean. But I guess here, the right way to say it that's official would be to say we have a powerful heuristic for approximately solving that problem, comma, based on convex optimization. That would be the true statement. You can't solve this problem."},{"start":4247.61,"text":"Okay. Right. Well, you can if there's like, you know, 10 inequalities, right? But other than that, you can't, if there's 100 inequalities, you can't solve that problem. I just misremembered. I thought that was, that's what we were doing when we had like the one transpose S. Nope. The, nope. The one transpose S on the slack. That was simply a heuristic for approximately solving that problem. But you don't solve that problem."},{"start":4274.7,"text":"Yeah, I mean you might solve it, but you won't know you've solved it, but that's another way to say it right Yeah, in fact in many cases you probably do right Yeah, so and yes, they're gonna be related to this right Okay, so good example is like a linear classifier, so I give you a whole bunch of points With labels right say with a boolean label yi and"},{"start":4305.76,"text":"You know, what you want is you want to find W and V. Yeah, so this says that you want this to look like that, right? You want all these to be less than or equal to zero or bigger than or equal to zero. It wouldn't matter whatever your convention is, right? And so then you can rewrite this. If you want the classifier that makes the fewest number of mistakes, it's going to be one of these convex cardinal. It's going to be this one, right? By the way,"},{"start":4335.18,"text":"When we do our magic or approximation or whatever it is, and we make this into an L1 problem, what do you imagine this is going to turn into? Roughly. It's going to turn into a support vector machine, roughly. Right. So, in fact, if I add L2 regularization, that's exactly what it is. So, okay. Here's another weird one, which is not the same. So, the story starts the same way."},{"start":4367.88,"text":"I have a set of infeasible inequalities. In the previous story, which is kind of a weird positive one, it would basically say, ignore the fewest number of inequalities to make that feasible. And you go, cool. Of your 22 inequalities, if I just toss out these five, then the rest I can make feasible. Everybody, that's what we're doing. This one says to identify what is the essence of the mutual infeasibility."}],"speech_gaps":[],"frame":"../frames/v017/026.webp","frame_time":4228.94},{"title":"凸优化中的不可行性证书与最小化子集","segments":[{"id":233,"text":"So what you're going to do is take the original 22, they're mutually infeasible, and I want to get a subset of like, let's say, ideal would be like three. I could say the fifth, tenth, and eleventh. Those three together are infeasible. That means you can forget about the other 19."},{"id":234,"text":"Right? Because it says that's where you're, it's somewhere in these three. And then you kind of negotiate and you go back and you find, you look at these three inequalities that are the bottleneck and you try to figure out some way to either expand, you know, whatever, to go and negotiate for a bigger right-hand side inequality or something, bigger budget. Okay. So that's it. So this also is going to work that way as well. So if,"},{"id":235,"text":"Here, if you work out the certificate of infeasibility, it basically says that if the inf over x, this is the dual function, if that's bigger than or equal to 1, actually all you need is to be positive, but it's homogeneous, so that's good enough. If lambda is positive and this infima is bigger than 1, then this collection here..."},{"id":236,"text":"of inequalities is mutually infeasible. And so now what you're going to do is you simply minimize the cardinality. So you'd put a comment next to these things. You'd put a comment here that said, this is a certificate proving that these inequalities are mutually infeasible. And if you minimize the cardinality, you will get the smallest group subset of mutually infeasible inequalities, right?"},{"id":237,"text":"So, which is actually very cool, right? I mean, could be quite useful. Okay. We'll give one more example and then we'll come back next time and talk about what to do about these, right? You also get things in, I mean, here's an example from finance. That doesn't apply to big hedge funds, but it does apply to..."},{"id":238,"text":"people, right? This actually comes up in crypto trading. It's the same story. What happens is the following. You have a trading fee which might be proportional, first of all, to the amount that you buy or sell. That's normal."},{"id":239,"text":"But you also have one that says that is actually if you buy or sell at all, I'm going to charge you $3 or $9 or something like that. And I forget what this is called in crypto trading, but you have to provide like a gas fee or something. I don't know. Something like that. Right. And that's what it would be. So you see if you propose to trade at all, you pay a simple fee to request the trade."},{"id":240,"text":"In that case, there would be no, this alpha would be zero or something like that. Okay. And your budget constraint might look like this, right? That one transpose X."}],"notes":["本段讲解了如何通过寻找不可行性证书来识别一组不可行的约束条件。讲者提到，如果原始问题有22个约束条件，且它们是相互不可行的，那么可以从中选出一个最小的子集（如3个）来证明不可行性。这有助于简化问题，因为可以忽略其他19个约束条件。","讲者进一步说明，找到不可行性证书后，可以通过最小化子集的大小来确定最小的不可行约束子集。这一步骤类似于在优化问题中寻找瓶颈约束，从而减少计算复杂度。","讲者提到，不可行性证书的数学基础是通过计算对偶函数的下确界。如果该下确界大于1（或正数），则说明这些约束条件是相互不可行的。这涉及到对偶问题的构造和分析。","讲者举了一个金融领域的例子，说明不可行性证书在实际中的应用。例如，在加密货币交易中，交易费用可能包括与交易量成比例的费用，以及无论交易量如何都必须支付的固定费用（如gas费）。这种情况下，交易费用的结构可能影响约束条件的可行性。","讲者还提到，当交易费用为零时，预算约束可能简化为某种形式，例如一个向量与变量的乘积。这表明在某些情况下，约束条件的结构可以被简化，从而更容易分析其可行性。","最后，讲者指出，这种不可行性证书的方法在优化问题中非常有用，尤其是在处理大规模问题时，可以显著减少计算负担。但讲者也提到，后续课程将讨论如何处理这些不可行性问题。"],"formulas":[],"uncertainties":["lambda is positive and this infima is bigger than 1","this alpha would be zero or something like that"],"diagram":"none","start":4395.72,"end":4566.21,"asr_flags":[],"math_clarifications":["公式中的对偶函数定义和上下文未在原文中明确给出，因此无法核定其正确性。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4395.72,"text":"So what you're going to do is take the original 22, they're mutually infeasible, and I want to get a subset of like, let's say, ideal would be like three. I could say the fifth, tenth, and eleventh. Those three together are infeasible. That means you can forget about the other 19."},{"start":4413.21,"text":"Right? Because it says that's where you're, it's somewhere in these three. And then you kind of negotiate and you go back and you find, you look at these three inequalities that are the bottleneck and you try to figure out some way to either expand, you know, whatever, to go and negotiate for a bigger right-hand side inequality or something, bigger budget. Okay. So that's it. So this also is going to work that way as well. So if,"},{"start":4443.28,"text":"Here, if you work out the certificate of infeasibility, it basically says that if the inf over x, this is the dual function, if that's bigger than or equal to 1, actually all you need is to be positive, but it's homogeneous, so that's good enough. If lambda is positive and this infima is bigger than 1, then this collection here..."},{"start":4463.63,"text":"of inequalities is mutually infeasible. And so now what you're going to do is you simply minimize the cardinality. So you'd put a comment next to these things. You'd put a comment here that said, this is a certificate proving that these inequalities are mutually infeasible. And if you minimize the cardinality, you will get the smallest group subset of mutually infeasible inequalities, right?"},{"start":4492.62,"text":"So, which is actually very cool, right? I mean, could be quite useful. Okay. We'll give one more example and then we'll come back next time and talk about what to do about these, right? You also get things in, I mean, here's an example from finance. That doesn't apply to big hedge funds, but it does apply to..."},{"start":4514.29,"text":"people, right? This actually comes up in crypto trading. It's the same story. What happens is the following. You have a trading fee which might be proportional, first of all, to the amount that you buy or sell. That's normal."},{"start":4532.19,"text":"But you also have one that says that is actually if you buy or sell at all, I'm going to charge you $3 or $9 or something like that. And I forget what this is called in crypto trading, but you have to provide like a gas fee or something. I don't know. Something like that. Right. And that's what it would be. So you see if you propose to trade at all, you pay a simple fee to request the trade."},{"start":4557.71,"text":"In that case, there would be no, this alpha would be zero or something like that. Okay. And your budget constraint might look like this, right? That one transpose X."}],"speech_gaps":[],"frame":"../frames/v017/027.webp","frame_time":4407.72},{"title":"线性成本与凸性","segments":[{"id":241,"text":"So here x is either positive or negative, right? Or here, I guess we're going to purchase some dollar amount, so it's all positive. So that's the gross cost of what you're going to buy. This would be the so-called linear cost here. And then this part would be the charge for simply, if you buy 14 things, you're going to buy 14 times whatever some fixed charge is. And then you'd end up with a problem that looks like that."},{"id":242,"text":"Right. So without this, it's convex, of course. Right. Without that. So without that, it's convex. That's an example. OK, so I think we're going to quit here for today. Next time, we'll finish this up and that'll maybe go until Tuesday. And then I'll reserve some time for us to wrap up the whole course as well."}],"notes":["本段讲解了线性成本函数的结构，其中x可以是正或负，但在购买金额的情况下，x应为正。线性成本指的是购买数量乘以固定单价，而固定单价是常数。这种结构是凸函数的一个例子，因为线性函数本身是凸的。","讲者指出，如果没有非凸项，整个函数将是凸的。这说明了凸函数的性质，即在没有非凸项的情况下，函数保持凸性。这种例子有助于理解凸优化问题的构建。","讲者提到课程将在下一次继续，可能持续到周二，并预留时间总结整个课程。这表明课程安排和教学进度的规划。","讲者通过实际例子（如购买14件物品）来说明线性成本的计算方式，这有助于学生理解如何将实际问题转化为数学模型。","讲者强调了凸函数在优化问题中的重要性，因为凸函数的最小值点是全局最优解，这与非凸函数的局部最优解形成对比。","讲者通过讨论线性成本和凸性的关系，引导学生思考如何构建和分析凸优化问题，这为后续课程内容奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4568.18,"end":4618.33,"asr_flags":[],"raw_segments":[{"start":4568.18,"text":"So here x is either positive or negative, right? Or here, I guess we're going to purchase some dollar amount, so it's all positive. So that's the gross cost of what you're going to buy. This would be the so-called linear cost here. And then this part would be the charge for simply, if you buy 14 things, you're going to buy 14 times whatever some fixed charge is. And then you'd end up with a problem that looks like that."},{"start":4597.29,"text":"Right. So without this, it's convex, of course. Right. Without that. So without that, it's convex. That's an example. OK, so I think we're going to quit here for today. Next time, we'll finish this up and that'll maybe go until Tuesday. And then I'll reserve some time for us to wrap up the whole course as well."}],"speech_gaps":[],"frame":"../frames/v017/028.webp","frame_time":4580.18}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
