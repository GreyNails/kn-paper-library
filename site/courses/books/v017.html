y, you keep increasing t until m over t,"},{"id":10,"text":"which is the gap, is less than whatever your desired threshold is, right? So that's the method."},{"id":11,"text":"I think we talked about that last time. This is a homotopy method. It's kind of a special one because general homotopy methods are much more complex because paths can just stop or they can bifurcate or they can just start in the middle of nowhere. Here, that's false. No matter where you are, you can always get back to the central path. It may cost you a bunch of Newton steps, but you can always do it. Okay, that's the barrier method. And what we're going to do now is look at..."},{"id":12,"text":"we're going to look at the complexity analysis of it. I think I mentioned last time that according to the classical analysis, the upper bound on the number of Newton steps grows as T increases, right? And so that, if you sort of believe that that upper bound had any meaning,"},{"id":13,"text":"you might shy away from even attempting this because you'd say, well, sure, as t gets bigger and bigger, the problems we solved by Newton's method get harder and harder. It takes more and more iterations and so on and so forth. And then you get into some kind of doom spiral there or whatever. This actually kind of happened in the 60s, weirdly. I don't know why."},{"id":14,"text":"Okay, so it turns out that's not true. You could have guessed that because you've already seen empirical results for how well a barrier method works, which is, by the way, just unbelievably well. So basically, and it's got a very weird interpretation, right? The one interpretation of it's working so well is that it takes between 20, and you solve between 20 and 50 least squares problems to solve a convex optimization problem."}],"notes":["本段主要讲解了障碍方法的基本原理和其在凸优化中的应用。障碍方法通过在可行域内引入一个障碍函数，使得优化问题在可行域内进行，从而避免直接处理不等式约束。方法的核心是找到中心路径上的点，使用牛顿法进行迭代，并逐步增加障碍参数t，以减小目标函数与约束之间的差距。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":177.43,"asr_flags":[],"raw_segments":[{"start":5.26,"text":"So what we'll do today is finish up the discussion of barrier methods, maybe start on these L1"},{"start":14.02,"text":"convex cardinality type things. So let's take a look at that. So just to remind you what it was,"},{"start":21.64,"text":"we are going to look at using a barrier method. Barrier method is a pretty simple thing."},{"start":28.14,"text":"it's uh let me go find it let me there we there we go so um it simply says uh we we find a point"},{"start":36.02,"text":"on the central path uh you use newton's method to do that then then you increment this barrier"},{"start":42.58,"text":"parameter t that controls the gap and you compute the new point and you keep doing this right and"},{"start":48.72,"text":"you know at some point actually every time you center you end up with two things strictly"},{"start":54.8,"text":"strictly feasible primal point, that's x, you also end up with strictly feasible dual point,"},{"start":61.86,"text":"and you have a gap, that means. And the gap is precisely m over t. t is that parameter that"},{"start":67.64,"text":"controls the level of approximation. So basically, you keep increasing t until m over t,"},{"start":75.38,"text":"which is the gap, is less than whatever your desired threshold is, right? So that's the method."},{"start":81.98,"text":"I think we talked about that last time. This is a homotopy method. It's kind of a special one because general homotopy methods are much more complex because paths can just stop or they can bifurcate or they can just start in the middle of nowhere. Here, that's false. No matter where you are, you can always get back to the central path. It may cost you a bunch of Newton steps, but you can always do it. Okay, that's the barrier method. And what we're going to do now is look at..."},{"start":110.86,"text":"we're going to look at the complexity analysis of it. I think I mentioned last time that according to the classical analysis, the upper bound on the number of Newton steps grows as T increases, right? And so that, if you sort of believe that that upper bound had any meaning,"},{"start":130.06,"text":"you might shy away from even attempting this because you'd say, well, sure, as t gets bigger and bigger, the problems we solved by Newton's method get harder and harder. It takes more and more iterations and so on and so forth. And then you get into some kind of doom spiral there or whatever. This actually kind of happened in the 60s, weirdly. I don't know why."},{"start":152.37,"text":"Okay, so it turns out that's not true. You could have guessed that because you've already seen empirical results for how well a barrier method works, which is, by the way, just unbelievably well. So basically, and it's got a very weird interpretation, right? The one interpretation of it's working so well is that it takes between 20, and you solve between 20 and 50 least squares problems to solve a convex optimization problem."}],"speech_gaps":[],"frame":"../frames/v017/001.webp","frame_time":17.259999999999998},{"title":"凸优化中的自洽性分析与牛顿步数","segments":[{"id":15,"text":"with inequality constraints, all that kind of stuff. It's crazy, right? Why do I say you solve least squares problems? It's because you do between 20 and 50 Newton steps total, but a Newton step is actually solving a set of linear KKT systems, which is precisely solving a least squares problem. It's exactly the same as solving a least squares problem with equality constraints, right? So it's actually kind of cool. So you can, it says basically you can,"},{"id":16,"text":"solve any convex problem by solving between 20 and 50 least squares problems that have the same structure and so on. So that's actually kind of, I mean, I find that kind of interesting. And by the way, also, well, let's see."},{"id":17,"text":"If people had been awake in the 60s, people would have noticed this, right? So this wasn't mainstream until the 90s or something like that. But before then, this would have been just completely radical and unheard of. Okay, that's the background. Now what we're going to do is let's see if we can get the theory to catch up with the practice."},{"id":18,"text":"The objective is self-concordant. And that's true for actually a whole bunch of the things that we actually care about, like logs."},{"id":19,"text":"The objective is self-concordant. And that's true for actually a whole bunch of the things that we actually care about, like logs. And then this is basically all of it. This is also the densest chain of inequalities, I think, that have appeared in lecture slides that I'm aware of. I couldn't follow it, so I had to work it out myself this morning. So we will go through this together now a bit. I mean, eventually I followed it."},{"id":20,"text":"So we're going to do a step of the barrier method, which is to use Newton's method to go from here to here. Okay, so that's what we're going to analyze. What we're going to try to do is bound the number of steps it takes to do that, the number of Newton steps, right?"},{"id":21,"text":"Okay, so we're going to do a step of the barrier method, which is to use Newton's method to go from here to here. Okay, so that's what we're going to analyze. What we're going to try to do is bound the number of steps it takes to do that, the number of Newton steps, right? Okay, so we go back to self-concordance analysis and we ask, well, how many Newton steps does it take to compute this thing?"}],"notes":["本段主要讲解了自洽性分析在凸优化中的应用，特别是如何通过自洽性来分析牛顿步数。讲者提到，自洽性是一个重要的性质，它适用于许多我们关心的函数，如对数函数。通过自洽性分析，可以推导出计算特定问题所需的牛顿步数上限。","讲者指出，自洽性分析是理解牛顿方法在凸优化中效率的关键。他提到，自洽性分析的推导过程非常复杂，甚至需要自己重新推导，这表明该分析的难度较高。","在讲解过程中，讲者提到中心路径和障碍方法，其中障碍方法使用牛顿法从一个点移动到另一个点。他强调了分析牛顿步数的重要性，因为这关系到算法的效率。","讲者还提到，自洽性分析的推导过程是讲座中出现的最密集的不等式链之一，这表明该部分内容在理论推导上具有较高的复杂性。","讲者通过自己的经历说明，即使对于专家来说，理解自洽性分析的推导过程也需要时间和努力，这反映了该主题的深度和挑战性。","最后，讲者指出，自洽性分析的目标是确定计算特定问题所需的牛顿步数上限，这为实际应用提供了理论支持。"],"formulas":[],"uncertainties":[],"diagram":"none","start":178.09,"end":340.66,"asr_flags":[],"math_clarifications":["公式中的符号不一致，x_{\\mu t} 表示参数为 μt 的点，而 x_plus 应该表示通过增加 t 得到的新点，因此该公式需要移除以避免混淆。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":178.09,"text":"with inequality constraints, all that kind of stuff. It's crazy, right? Why do I say you solve least squares problems? It's because you do between 20 and 50 Newton steps total, but a Newton step is actually solving a set of linear KKT systems, which is precisely solving a least squares problem. It's exactly the same as solving a least squares problem with equality constraints, right? So it's actually kind of cool. So you can, it says basically you can,"},{"start":208.53,"text":"solve any convex problem by solving between 20 and 50 least squares problems that have the same structure and so on. So that's actually kind of, I mean, I find that kind of interesting. And by the way, also, well, let's see."},{"start":224.61,"text":"If people had been awake in the 60s, people would have noticed this, right? So this wasn't mainstream until the 90s or something like that. But before then, this would have been just completely radical and unheard of. Okay, that's the background. Now what we're going to do is let's see if we can get the theory to catch up with the practice."},{"start":246.5,"text":"And that comes via self-concordance analysis. So what we're going to do is we're going to simply assume that the centering problem"},{"start":255.86,"text":"The objective is self-concordant. And that's true for actually a whole bunch of the things that we actually care about, like logs. And then this is basically all of it. This is also the densest chain of inequalities, I think, that have appeared in lecture slides that I'm aware of. I couldn't follow it, so I had to work it out myself this morning. So we will go through this together now a bit. I mean, eventually I followed it."},{"start":284.05,"text":"So let's remember what s, the number of Newton steps is less than or equal to the function value where you start."},{"id":25,"text":"minus the function value where you end, which is its optimal value, and then multiplied by a constant. And you could either use our lazy constant as like you divide by 365 or something like that, or maybe you multiply by 365. And then you add something that looks like log log 1 over epsilon, which we just call 5 or 6, and that's fine. Everybody got that? So that's the c over there, right? So this is the function value at x of t."},{"id":26,"text":"That's x, which we're just going to call x over here. That's this guy here. And then this is going to be the function value when you finish. Because x plus minimizes this thing subject to the equality constraints, right? So that's what that is. Okay, so..."},{"id":27,"text":"That's the number of Newton iterations, and our job is to get an upper bound on this big thing here. Forget the C for the moment, and let's just take a look at this thing. And now we go kind of very slowly. I'll expand various things, right?"}],"notes":["本段讲授了自洽理论中牛顿迭代次数的上界估计。讲者指出，当参数t增加时，新的优化问题应与前一个问题相对接近，从而减少所需的牛顿迭代次数。这是自洽理论的核心思想之一。","讲者提到，牛顿迭代次数的上界与初始函数值和最终最优值之间的差值有关，并乘以一个常数。这个常数可以是任意的，例如365，或者通过其他方式确定。此外，还涉及一个与ε相关的对数项，通常被简化为5或6。","讲者强调，x_plus是满足等式约束条件下的最小化点，即x_plus是优化问题的解。因此，最终的函数值是该问题的最优值。","讲者指出，我们的目标是为这个大项（即牛顿迭代次数的上界）提供一个上界估计。为了简化分析，暂时忽略常数C，并专注于分析该大项的结构。","讲者提到，接下来将逐步展开分析，包括对各项的展开和解释，以更清晰地理解整个理论框架。","本段内容涉及自洽理论中的关键概念，包括函数值的差值、常数项、对数项以及牛顿迭代次数的上界估计。这些内容为后续的理论分析和算法设计提供了基础。"],"formulas":[],"uncertainties":["mu t f zero of x plus sum um and this is over i","the lazy constant as like you divide by 365 or something like that, or maybe you multiply by 365"],"diagram":"none","start":341.71,"end":496.05,"asr_flags":[],"math_clarifications":["原始片段中提到的自洽理论中的迭代次数上界表达式不完整，缺少乘以常数项和对数项的描述，无法准确表达完整的数学关系。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":341.71,"text":"starting from here right and the answer is you look at the function  I can minimize"},{"start":1170.03,"text":"it over mu, which you can do. I mean, it's not that hard to do. You don't do it exactly because"},{"start":1174.05,"text":"all of this is sloppy and it's all silly because this is all upper bounds and all that kind of"},{"start":1177.55,"text":"stuff. But if you do, what you'll find out is that you would like to choose mu to be on the order"}],"speech_gaps":[],"frame":"../frames/v017/007.webp","frame_time":1016.45},{"title":"凸优化中的步长选择与理论与实践的同步","segments":[{"id":58,"text":"something like that. That's very close in order to what the minimizer would be. If you plug that"},{"id":59,"text":"back in you get something amazing it says that the number of steps is uh it's on the order of"},{"id":60,"text":"the square root of m and then there's a log m term i ignore that i guess if you're a complexity"},{"id":61,"text":"theory theorist you don't right the log m so it's squared m log m is the complexity i think people"},{"id":62,"text":"just quote it as square root m right so so um it's pretty good uh so i mean in fact most people"},{"id":63,"text":"would choose don't yet choose Muse that are much larger and in fact people"},{"id":64,"text":"people refer to methods that have small mu they refer to those as short step"},{"id":65,"text":"methods and then ones where you actually are much more aggressive in it in"},{"id":66,"text":"adapting mu are called long step methods you might see this if you start looking"},{"id":67,"text":"at some of the papers from the 90s and the aughts and all that kind of stuff"},{"id":68,"text":"you you would actually see this in titles of papers like you know a long"},{"id":69,"text":"long-step primal dual method, blah, blah, blah, something like that."},{"id":70,"text":"Okay, so this is actually like, I think it's pretty cool."},{"id":71,"text":"I mean, this is sort of how the theory and the practice are approximately consistent."},{"id":72,"text":"But what I should tell you, I mean, I'll explain this later. What I should tell you, though, is that there's been a kind of a leapfrog thing where people working on practical implementations of interior point methods or barrier methods actually will do something not justified by the theory. And it will work better. And they will run it on test suites of thousands of problems and blah, blah, blah, release something maybe commercially or whatever."},{"id":73,"text":"What will happen then typically is five years later, the theorists will catch up and show that a simplified variation of that method actually is like polynomial time or something. And then by then, the people actually working on the methods will come up with something else and extend it. So there are periods like every couple of years when the theory and the practice are in sync, but it doesn't last very long as soon as that happens. So that's actually the story. OK."},{"id":74,"text":"Oh, first of all, any questions about this? It's kind of cool stuff. If not, we'll move on. You probably guessed that the way everything was set up, the exact same methods are going to work for generalized inequalities, right? And you're right. And this is how you'd solve SOCPs, semi-definite programs, things like that, of which you've solved a whole bunch."}],"notes":["本段讲解了凸优化中步长选择对算法复杂度的影响，提到步长选择与算法性能之间的关系。讲者指出，步长选择会影响迭代次数，通常迭代次数与√m和log m有关，但实际应用中人们可能忽略log m项，直接引用√m作为复杂度。此外，讲者还区分了短步法和长步法，短步法使用较小的步长，而长步法则更激进地调整步长。","讲者提到，理论与实践之间存在一种‘跳蛙’现象，即实际应用中人们可能会采用未经理论证明的方法，但这些方法在实践中表现更好。随后，理论研究者会在几年后证明这些方法的理论复杂度，如多项式时间。这种理论与实践的同步状态不会持续太久，每隔几年就会出现一次。","讲者最后提到，对于广义不等式，与之前讨论的凸优化方法类似，相同的算法可以应用于解决二次约束规划（SOCP）和半正定规划（SDP）等问题，这些方法已经被广泛使用。","讲者强调，实际应用中人们可能会忽略理论中的某些细节，如log m项，直接采用简化版本的复杂度分析。这种做法在实践中可能更有效，但需要理论研究者的后续验证。"],"formulas":[],"uncertainties":["Muse","mu"],"diagram":"none","start":1182.99,"end":1346.74,"asr_flags":[],"raw_segments":[{"start":1182.99,"text":"something like that. That's very close in order to what the minimizer would be. If you plug that"},{"start":1188.01,"text":"back in you get  actually is like polynomial time or something. And then by then, the people actually working on the methods will come up with something else and extend it. So there are periods like every couple of years when the theory and the practice are in sync, but it doesn't last very long as soon as that happens. So that's actually the story. OK."},{"start":1318.21,"text":"Oh, first of all, any questions about this? It's kind of cool stuff. If not, we'll move on. You probably guessed that the way everything was set up, the exact same methods are going to work for generalized inequalities, right? And you're right. And this is how you'd solve SOCPs, semi-definite programs, things like that, of which you've solved a whole bunch."}],"speech_gaps":[],"frame":"../frames/v017/008.webp","frame_time":1194.99},{"title":"锥约束与广义对数函数","segments":[{"id":75,"text":"already. So, well, sorry, you didn't, but CVXPy, you typed in CVXPy, CVXPy compiled your problem to some standard form, and then called one of some number of solvers. So, you have solved a bunch of SDPs in that spirit. So, okay. So, here, what we're going to do is we're going to look at these"},{"id":76,"text":"We're going to have cone constraints like this, right? So fi is a vector. And, you know, the most interesting one is going to be things like SOCP and SDPs, right? So if you think about it, we have to just go back and generalize everything. Now, before we had fi of x. fi of x was a number."},{"id":77,"text":"Right? Minus fi of x we thought as a margin. And minus log minus fi of x was this barrier function. It was convex. And, you know, as you got to the boundary, the boundary being fi equals zero, this thing would go to plus infinity. So that was our barrier. But now, I mean, let's suppose I have some cone. Let's imagine it's like the semi-definite cone or something like that. You need to have something that's going to be the same as a logarithm. So you need the idea of a logarithm on a cone."},{"id":78,"text":"So what you do is you generalize this to have, you say that a generalized logarithm, it's a function that is, its domain is the interior, so that makes perfect sense. It's concave, it's strictly concave. That's what the second term means. And in fact, this is actually concave in the,"},{"id":79,"text":"They'll just say it's concave, right? And then it has to actually kind of agree with a logarithm on any ray, right? And so it's got to look like this. If you multiply phi with some scalar s here, phi of sy, that's going to be phi of y plus theta log s. So it has to look exactly like a log on any ray. Okay."},{"id":80,"text":"So you do get things like this. Oh, and this number, theta, is called the degree of that logarithm, right? So here, like if you have the non-negative orthon, if you use this, you just end up with the same barrier we had before, right? This is the log of the non-negative orthon. The log of a vector is this thing, right? Something like, it's a generalized logarithm."},{"id":81,"text":"What's interesting is much more interesting is what happens on like a semi-definite cone. There, surprise, surprise, our friend log determinant, which goes back, whatever, to week two of the class. Not surprisingly, that's a generalized logarithm on the positive definite cone."}],"notes":["本段讲解了锥约束在凸优化中的应用，特别是SOCP和SDP。讲者提到，之前讨论的fi(x)是一个标量，现在需要将其推广到向量形式，以处理更复杂的约束条件。","讲者指出，当处理锥约束时，需要引入广义对数函数的概念。这种函数的定义域是锥的内部，且是严格凹函数，这与传统的对数函数在性质上相似。","广义对数函数需要满足在任何射线上与对数函数一致的性质。具体来说，如果将函数φ作用于标量s乘以向量y，结果应等于φ(y)加上θ乘以log s，其中θ称为对数的次数。","讲者提到，对于非负正交向量，广义对数函数会退化为之前讨论的障碍函数，这表明广义对数函数是传统对数函数的自然推广。","在半正定锥的情况下，对数行列式函数被指出是一个广义对数函数。这与课程早期讨论的对数函数概念相呼应，说明了对数函数在不同锥结构中的普遍性。","本段强调了广义对数函数在处理锥约束时的重要性，特别是在构建障碍函数和优化问题中，它提供了一种统一的数学工具。"],"formulas":[{"latex":"\\phi(sy) = \\phi(y) + \\theta \\log s","symbols":"\\phi: 广义对数函数，s: 标量，y: 向量，\\theta: 对数的次数","explanation":"公式正确，描述了广义对数函数在标量乘法下的性质，符合数学定义。","evidence":"They'll just say it's concave, right? And then it has to actually kind of agree with a logarithm on any ray, right? And so it's got to look like this. If you multiply phi with some scalar s here, phi of sy, that's going to be phi of y plus theta log s. So it has to look exactly like a log on any ray. Okay."}],"uncertainties":[],"diagram":"none","start":1347.28,"end":1512.66,"asr_flags":[],"math_clarifications":["公式中的\\phi(sy) = \\phi(y) + \\theta \\log s 是对广义对数函数在标量乘法下的性质的正确描述，符合数学定义。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1347.28,"text":"already. So, well, sorry, you didn't, but CVXPy, you typed in CVXPy, CVXPy compiled your problem to some standard form, and then called one of some number of solvers. So, you have solved a bunch of SDPs in that spirit. So, okay. So, here, what we're going to do is we're going to look at these"},{"start":1370.67,"text":"We're going to have cone constraints like this, right? So fi is a vector. And, you know, the most interesting one is going to be things like SOCP and SDPs, right? So if you think about it, we have to just go back and generalize everything. Now, before we had fi of x. fi of x was a number."},{"start":1394.66,"text":"Right? Minus fi of x we thought as a margin. And minus log minus fi of x was this barrier function. It was convex. And, you know, as you got to the boundary, the boundary being fi equals zero, this thing would go to plus infinity. So that was our barrier. But now, I mean, let's suppose I have some cone. Let's imagine it's like the semi-definite cone or something like that. You need to have something that's going to be the same as a logarithm. So you need the idea of a logarithm on a cone."},{"start":1425.8,"text":"So what you do is you generalize this to have, you say that a generalized logarithm, it's a function that is, its domain is the interior, so that makes perfect sense. It's concave, it's strictly concave. That's what the second term means. And in fact, this is actually concave in the,"},{"start":1448.51,"text":"They'll just say it's concave, right? And then it has to actually kind of agree with a logarithm on any ray, right? And so it's got to look like this. If you multiply phi with some scalar s here, phi of sy, that's going to be phi of y plus theta log s. So it has to look exactly like a log on any ray. Okay."},{"start":1470.29,"text":"So you do get things like this. Oh, and this number, theta, is called the degree of that logarithm, right? So here, like if you have the non-negative orthon, if you use this, you just end up with the same barrier we had before, right? This is the log of the non-negative orthon. The log of a vector is this thing, right? Something like, it's a generalized logarithm."},{"start":1496.48,"text":"What's interesting is much more interesting is what happens on like a semi-definite cone. There, surprise, surprise, our friend log determinant, which goes back, whatever, to week two of the class. Not surprisingly, that's a generalized logarithm on the positive definite cone."}],"speech_gaps":[],"frame":"../frames/v017/009.webp","frame_time":1359.28},{"title":"对数障碍函数的定义与性质","segments":[{"id":82,"text":"So it's got a lot of the things you would like on it. It's also correct. If you go an array of matrices, we already saw that. That's actually how we prove concavity. This thing looks exactly like a logarithm. So that's it. And here, the so-called degree is n. And for a second-order cone, you get something that looks like this. It's not totally obvious that that's concave, but it is. Actually, I don't think it's that hard to show."},{"id":83,"text":"The only one that would be tricky would be this part. So, okay. Sorry, the others. All right. So there's a bunch of properties. If you have a generalized logarithm, you can figure out like what happens, right? One is that the gradient is non-negative in the dual cone. If you have y transpose times the gradient of the logarithm, you just get theta. It's just a constant. And, you know, so for a non-negative orphan, if you want to check,"},{"id":84,"text":"that the gradient is going to be this. I guess you've seen that, right? And then if you take y transpose times this gradient, you just get n because you take y times 1 over y and so on, y1 times 1 over y1 and so on. So you just get this. Okay, and for positive semi-definite cone, it's actually super interesting. The gradient of the log determinant is the inverse matrix, right? You have to interpret that super carefully."},{"id":85,"text":"That's what it is. That's inverse. And the inner product between two symmetric matrices is the trace of the product, right? Because that's actually the inner product. It's the sum of the products of the corresponding entries, right? And so that, of course, is n because trace of y times y inverse is the trace of i, which is n. Okay? So these things work. Second order cone, you know, same story if you work out what this is. Okay. So, all right. So that's your..."},{"id":86,"text":"That's this property of the logarithmic, of the generalized logarithm. Armed with that, we can actually define a logarithmic barrier. So the log barrier is going to be this. I have a bunch of cone inequalities, but they are, sorry, I have a bunch of inequalities, but they're respect to some cone here, like your k1 and up to k sub m, right? So we form this thing. That's going to be the log barrier. And this is exactly like..."},{"id":87,"text":"in the case when the inequalities were scalars. It's identical, right? Or at least the form is identical, right? It's a bit more complicated, right? These are vectors now."}],"notes":["本段讲解了对数障碍函数的定义及其与锥约束的关系。首先，讲者指出对数障碍函数的构造基于锥不等式，这些不等式需要满足特定的锥结构，如非负锥或半正定锥。接着，讲者提到对数障碍函数的形式与标量不等式情况类似，但需要考虑向量的情况，这增加了复杂性。","讲者进一步解释了对数障碍函数的梯度性质，特别是在不同锥结构下的表现。例如，在非负锥中，梯度是正的；在半正定锥中，梯度是逆矩阵。这些性质对于理解对数障碍函数的构造和应用至关重要。","讲者还提到对数障碍函数的内积计算，即两个对称矩阵的内积等于它们乘积的迹。这一性质在计算对数障碍函数的梯度时非常重要，因为它涉及到矩阵的迹运算。","此外，讲者指出对数障碍函数的构造需要考虑所有锥不等式，并将它们转化为对数障碍函数的形式。这一过程类似于标量不等式的情况，但需要处理向量和矩阵的运算。","最后，讲者强调了对数障碍函数在凸优化中的重要性，特别是在处理锥约束问题时，对数障碍函数能够有效地将不等式约束转化为可优化的目标函数。"],"formulas":[],"uncertainties":["non-negative orphan"],"diagram":"none","start":1513.7,"end":1665.12,"asr_flags":[],"math_clarifications":["所有公式均无法核定，因为缺少上下文信息，无法验证其数学意义和适用条件。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1513.7,"text":"So it's got a lot of the things you would like on it. It's also correct. If you go an array of matrices, we already saw that. That's actually how we prove concavity. This thing looks exactly like a logarithm. So that's it. And here, the so-called degree is n. And for a second-order cone, you get something that looks like this. It's not totally obvious that that's concave, but it is. Actually, I don't think it's that hard to show."},{"start":1543.76,"text":"The only one that would be tricky would be this part. So, okay. Sorry, the others. All right. So there's a bunch of properties. If you have a generalized logarithm, you can figure out like what happens, right? One is that the gradient is non-negative in the dual cone. If you have y transpose times the gradient of the logarithm, you just get theta. It's just a constant. And, you know, so for a non-negative orphan, if you want to check,"},{"start":1574.94,"text":"that the gradient is going to be this. I guess you've seen that, right? And then if you take y transpose times this gradient, you just get n because you take y times 1 over y and so on, y1 times 1 over y1 and so on. So you just get this. Okay, and for positive semi-definite cone, it's actually super interesting. The gradient of the log determinant is the inverse matrix, right? You have to interpret that super carefully."},{"start":1600.68,"text":"That's what it is. That's inverse. And the inner product between two symmetric matrices is the trace of the product, right? Because that's actually the inner product. It's the sum of the products of the corresponding entries, right? And so that, of course, is n because trace of y times y inverse is the trace of i, which is n. Okay? So these things work. Second order cone, you know, same story if you work out what this is. Okay. So, all right. So that's your..."},{"start":1629.75,"text":"That's this property of the logarithmic, of the generalized logarithm. Armed with that, we can actually define a logarithmic barrier. So the log barrier is going to be this. I have a bunch of cone inequalities, but they are, sorry, I have a bunch of inequalities, but they're respect to some cone here, like your k1 and up to k sub m, right? So we form this thing. That's going to be the log barrier. And this is exactly like..."},{"start":1655.82,"text":"in the case when the inequalities were scalars. It's identical, right? Or at least the form is identical, right? It's a bit more complicated, right? These are vectors now."}],"speech_gaps":[],"frame":"../frames/v017/010.webp","frame_time":1525.7},{"title":"凸优化中的中心路径与障碍函数","segments":[{"id":88,"text":"And this thing is convex. It's twice continuously differentiable. And this allows us to talk about a central path. But now we can talk about things like the central path for a semi-definite program or a second-order cone program. And it's actually identical, right? x star of t is the minimum of this thing. And the only difference is we have generalized phi to handle generalized inequalities for the constraints. So the barrier has just changed. That's the only thing that ever changed."},{"id":89,"text":"Make sense? So, okay. Everything else is going to work, right? If you minimize the function t times the function plus a barrier, then you will get this thing called x star of t. That's a point on the central path associated with the parameter value t. And if you work out the optimality condition, it just looks like this."},{"id":90,"text":"And when you work this out, it's identical. It says that if this holds, then it turns out XRT also minimizes the Lagrangian with this particular choice of lambda I of T and nu of T. And if you look back at what it was for the scalar case, it's just exactly the same. It's the same. Okay. And we know that this is going to be non-negative in the dual."},{"id":91,"text":"norm, right? And then it turns out the gap is the same. This used to be, you can think about this for the types of things, if you had, if the constraints do not involve generalized or vector inequalities, each of these is one, right? And so this term is just m over t. That's the term we were just looking at. It's the m over t from over there. But now instead of m, you replace m, not the number of constraints, but actually the sum of the degree, the total sum of degrees, right?"},{"id":92,"text":"which is actually kind of not obvious, right? Because if I give you a single semi-definite constraint with a 10 by 10 matrix, how many, you know, and I ask you how many constraints is that? It's not clear. It's a single vector constraint, right, where it's a positive semi-definite matrix. Or you could say, well, it's like n, n plus 1 over 2 constraints because that's the number of scalars in a symmetric 10 by 10 matrix, right?"},{"id":93,"text":"But 55 is not right either, because I think that's what you'd get. And what this says is, for this purposes, it's 10. It acts as if a semi-definite inequality with a 10 by 10 matrix is roughly equivalent to 10 scalar inequalities. That's what this is saying here. OK. So now you get cool stuff. You get semi-definite programming."}],"notes":["本段讲解了凸优化中中心路径的概念，以及障碍函数在半定规划和二阶锥规划中的应用。中心路径是通过在目标函数中加入障碍函数来定义的，其核心思想是通过调整参数t来逼近原始问题的最优解。障碍函数的引入使得我们可以处理广义不等式约束，而不仅仅是标量不等式。","在处理中心路径时，需要考虑优化条件，即通过求解拉格朗日函数的最优条件来确定中心路径上的点。对于标量情况，这一条件与半定规划和二阶锥规划中的情况是相同的，这表明了中心路径的通用性。","在计算中心路径上的点时，需要考虑约束条件的类型。如果约束不涉及广义不等式，那么每个约束对应一个标量不等式，此时间隙项为m/t，其中m是约束的数量。然而，当约束是半定不等式时，需要计算矩阵的总度数，而不是直接使用约束的数量。","对于半定不等式约束，例如一个10x10的正定矩阵，其对应的约束数量并不是显而易见的。虽然可以将其视为n(n+1)/2个标量约束，但实际应用中，通常将其视为等效于10个标量约束。这种等效性使得半定规划在处理大规模问题时更加高效。","通过这种等效性，我们可以将半定规划视为一种特殊的凸优化问题，从而利用现有的凸优化理论和算法进行求解。这种转换不仅简化了问题的处理，还为实际应用提供了更大的灵活性。","本段强调了中心路径和障碍函数在处理广义不等式约束时的重要性，以及如何通过调整参数t来逼近最优解。这些概念为后续的半定规划和二阶锥规划提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1667.59,"end":1827.9,"asr_flags":[],"math_clarifications":["所有公式均重复且未提供具体数学内容，无法核对","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1667.59,"text":"And this thing is convex. It's twice continuously differentiable. And this allows us to talk about a central path. But now we can talk about things like the central path for a semi-definite program or a second-order cone program. And it's actually identical, right? x star of t is the minimum of this thing. And the only difference is we have generalized phi to handle generalized inequalities for the constraints. So the barrier has just changed. That's the only thing that ever changed."},{"start":1696.61,"text":"Make sense? So, okay. Everything else is going to work, right? If you minimize the function t times the function plus a barrier, then you will get this thing called x star of t. That's a point on the central path associated with the parameter value t. And if you work out the optimality condition, it just looks like this."},{"start":1721.77,"text":"And when you work this out, it's identical. It says that if this holds, then it turns out XRT also minimizes the Lagrangian with this particular choice of lambda I of T and nu of T. And if you look back at what it was for the scalar case, it's just exactly the same. It's the same. Okay. And we know that this is going to be non-negative in the dual."},{"start":1749.42,"text":"norm, right? And then it turns out the gap is the same. This used to be, you can think about this for the types of things, if you had, if the constraints do not involve generalized or vector inequalities, each of these is one, right? And so this term is just m over t. That's the term we were just looking at. It's the m over t from over there. But now instead of m, you replace m, not the number of constraints, but actually the sum of the degree, the total sum of degrees, right?"},{"start":1777.87,"text":"which is actually kind of not obvious, right? Because if I give you a single semi-definite constraint with a 10 by 10 matrix, how many, you know, and I ask you how many constraints is that? It's not clear. It's a single vector constraint, right, where it's a positive semi-definite matrix. Or you could say, well, it's like n, n plus 1 over 2 constraints because that's the number of scalars in a symmetric 10 by 10 matrix, right?"},{"start":1802.49,"text":"But 55 is not right either, because I think that's what you'd get. And what this says is, for this purposes, it's 10. It acts as if a semi-definite inequality with a 10 by 10 matrix is roughly equivalent to 10 scalar inequalities. That's what this is saying here. OK. So now you get cool stuff. You get semi-definite programming."}],"speech_gaps":[],"frame":"../frames/v017/011.webp","frame_time":1679.59},{"title":"对数障碍函数与半定规划的对偶性","segments":[{"id":94,"text":"You know, you work out what the log barrier is. You work out what it is on the central path. It's this. You get dual points is this thing. And this is the dual of this semi-definite program. And the duality gap is exactly P over T. P is equal to the size of these matrices, right? Because that's the degree of the logarithm on the positive definite cone. Okay."},{"id":95,"text":"Well, now you have the barrier method. Here it is. You look at it for a minute, and here's what you'll find out. Nothing changed, at least in form. Nothing changed. Oh, the only thing was you had to replace m. This used to be m, and now it's the sum of the theta i's over t, right? So in something like Julia, it would mean that your code from before would actually probably just work, literally just work."},{"id":96,"text":"I mean, you go back and you have to make sure that a logarithm is defined correctly and all that, but it would just work. And you can see it's just exactly the same. And you get the same, the complexity analysis just applies like just immediately. It just works. Except wherever I said m over here, you replace it with some theta i. Okay, so this is pretty cool."},{"id":97,"text":"And, I mean, maybe more important, at least certainly more important to me, is that it actually works super well in practice. So what's kind of crazy is if you look at these things, they look exactly like the ones we saw before for linear programs, quadratic programs, geometric programs. They look kind of the same, right? That, you know, everything's over in somewhere between 20 and 50 steps if you choose mu reasonably."},{"id":98,"text":"You see all sorts of stuff. I mean, you couldn't tell any difference between these. These look exactly like they did for solving an LP, right? So it's just the same. And the fancier methods, I'll talk about them briefly, but they would come in between 20 and 50 just always. That's how that works, right?"},{"id":99,"text":"By the way, this is pretty cool because I started using semi-definite programming for problems in control actually before the advent of these methods. And we used very complicated methods that would take 10 minutes to solve a semi-definite program with a handful of matrix inequalities that were like 10 by 10. And we were happy. And we liked the results."},{"id":100,"text":"absolutely no idea that within a couple of years there would be methods there would be methods that would be 20x shorter the code and be 100x or 1000x faster just did not like it was a anyway people now they just don't they don't they don't care as a matter of fact most people don't even care how these things are solved they just call a solve you know a solver"}],"notes":["本段讲解了对数障碍函数在中心路径上的应用，以及它如何与半定规划的对偶性相关联。讲者指出，对偶间隙等于P除以T，其中P是矩阵的大小，这与正定锥上的对数次数有关。","讲者介绍了障碍方法，强调了其与原始方法在形式上的相似性，但需要将m替换为theta_i的总和。这使得代码在某些语言如Julia中可以直接使用，无需重大修改。","讲者提到，尽管需要确保对数的定义正确，但障碍方法在实践中表现良好，与线性规划、二次规划和几何规划的求解过程相似，通常在20到50步内完成。","讲者指出，即使使用更复杂的求解方法，求解时间仍然在20到50步之间，这表明障碍方法在实际应用中非常高效。","讲者回顾了自己在控制问题中使用半定规划的历史，指出早期方法需要较长时间，而现代方法在速度和效率上有了显著提升。","最后，讲者提到现代求解器的普及使得人们不再关心具体的求解过程，只需调用求解器即可。"],"formulas":[],"uncertainties":["absolutely no idea that within a couple of years there would be methods there would be methods that would be 20x shorter the code and be 100x or 1000x faster just did not like it was a anyway people now they just don't they don't they don't care as a matter of fact most people don't even care how these things are solved they just call a solve you know a solver"],"diagram":"none","start":1829.97,"end":2008.0,"asr_flags":[],"math_clarifications":["对偶间隙和P的定义缺乏明确的数学公式和上下文支持，无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1829.97,"text":"You know, you work out what the log barrier is. You work out what it is on the central path. It's this. You get dual points is this thing. And this is the dual of this semi-definite program. And the duality gap is exactly P over T. P is equal to the size of these matrices, right? Because that's the degree of the logarithm on the positive definite cone. Okay."},{"start":1859.5,"text":"Well, now you have the barrier method. Here it is. You look at it for a minute, and here's what you'll find out. Nothing changed, at least in form. Nothing changed. Oh, the only thing was you had to replace m. This used to be m, and now it's the sum of the theta i's over t, right? So in something like Julia, it would mean that your code from before would actually probably just work, literally just work."},{"start":1885.24,"text":"I mean, you go back and you have to make sure that a logarithm is defined correctly and all that, but it would just work. And you can see it's just exactly the same. And you get the same, the complexity analysis just applies like just immediately. It just works. Except wherever I said m over here, you replace it with some theta i. Okay, so this is pretty cool."},{"start":1908.8,"text":"And, I mean, maybe more important, at least certainly more important to me, is that it actually works super well in practice. So what's kind of crazy is if you look at these things, they look exactly like the ones we saw before for linear programs, quadratic programs, geometric programs. They look kind of the same, right? That, you know, everything's over in somewhere between 20 and 50 steps if you choose mu reasonably."},{"start":1936.4,"text":"You see all sorts of stuff. I mean, you couldn't tell any difference between these. These look exactly like they did for solving an LP, right? So it's just the same. And the fancier methods, I'll talk about them briefly, but they would come in between 20 and 50 just always. That's how that works, right?"},{"start":1961.48,"text":"By the way, this is pretty cool because I started using semi-definite programming for problems in control actually before the advent of these methods. And we used very complicated methods that would take 10 minutes to solve a semi-definite program with a handful of matrix inequalities that were like 10 by 10. And we were happy. And we liked the results."},{"start":1986.73,"text":"absolutely no idea that within a couple of years there would be methods there would be methods that would be 20x shorter the code and be 100x or 1000x faster just did not like it was a anyway people now they just don't they don't they don't care as a matter of fact most people don't even care how these things are solved they just call a solve you know a solver"}],"speech_gaps":[],"frame":"../frames/v017/012.webp","frame_time":1841.97},{"title":"凸优化中的内点法与求解器实现","segments":[{"id":101,"text":"Or for that matter, a higher level of ignorance, which is totally cool and fine, is you just use CVXPy and call the solve method, and you have absolutely no idea what's being done on your behalf at the far end, which is just fine. That's the way it's supposed to be, right? So, okay. So this shows you that this kind of works. There's like just the same story. This takes between 20 and 50 steps. Okay."},{"id":102,"text":"So I do want to mention something, which is that the barrier method is just sort of a simple first cut. I think yours is probably going to come in at around 50 lines order magnitude. If you put a bunch of comments in there, it might be 70 or something. If you were to double that length, you could actually get something that would actually be competitive. So if you went to 100 lines or something like that."},{"id":103,"text":"People don't really use the barrier method that you've put together, but what is used, for example, in ECOS or in any of these things and all these commercial tools as well, what are used are what are called primal dual interior point methods. I'll just say a little bit about them, just so you know what they are. So they actually update the primal dual variables at each iteration, and you don't have the distinction between inner and, you don't have inner, you're not going all the way back to the central path."},{"id":104,"text":"Right. What you'll find out is if you actually look at some of these codes, you will find out that you're still solving a KKT system at every step. So that part is exactly the same. And let's see, I should say that they do use something like what you're using because your centering method."},{"id":105,"text":"is actually an infeasible start. These also use infeasible start. They use something called the primal dual homogeneous embedding. We're not going to talk about it, but it's actually very cool. It's actually a Stanford development. It's from NUEA, right? Maybe 20 years ago. It is now used for all solvers, commercial, non-commercial, everywhere. That is what's used. And what it does is it actually solves the primal and the dual simultaneously."},{"id":106,"text":"It handles things like infeasibility and it handles unboundedness. Just by solving one problem, you look at two scalar variables. From them, you figure out if one is one or something like that. If one is positive, it means you found a primal dual solution. If the other is positive, it means it's either unbounded or, you know, and it will actually get the certificate. It'll either give you a ray that..."},{"id":107,"text":"establishes that it is unbounded below, or it'll give you a certificate showing that the original problem is infeasible. So that's what that is. I'm just saying this is if you're interested in this. I mean, it's not, you know, some small fraction of you might actually be if you ended up implementing something like this."}],"notes":["本段主要讲解了凸优化中常用的内点法，特别是对偶内点法。与屏障方法不同，对偶内点法同时更新原始变量和对偶变量，并且不涉及中心路径的回溯。这种方法在实际求解器中被广泛应用，如ECOS和商业工具。","在对偶内点法中，每一步迭代仍然需要解KKT系统，这与屏障方法的中心化方法有相似之处。然而，对偶内点法使用了所谓的不可行起始点，这使得算法在处理不可行或无界问题时更加灵活。","对偶内点法中使用了一种称为原始对偶同质嵌入的方法，这是一种斯坦福大学的开发成果，已有20年的历史。该方法通过同时求解原始问题和对偶问题，能够处理不可行性和无界性问题。","通过解决一个单一的问题，该方法可以判断原始问题是否可行或无界。如果其中一个标量变量为正，则表示找到了原始对偶解；如果另一个为正，则表示问题可能是无界的，或者原始问题不可行，并且可以提供相应的证明。","虽然屏障方法在教学中被用来演示凸优化的基本思想，但在实际应用中，对偶内点法因其效率和鲁棒性而被广泛采用。这种方法在商业和非商业求解器中都有广泛应用。","本段还提到，虽然对偶内点法的实现可能较为复杂，但其在实际优化问题中的应用非常广泛，是当前凸优化求解器的核心技术之一。"],"formulas":[{"latex":"\\text{KKT}","symbols":"KKT条件","explanation":"KKT条件保持原样，无需修改，适用于优化问题的必要条件。","evidence":"Right. What you'll find out is if you actually look at some of these codes, you will find out that you're still solving a KKT system at every step. So that part is exactly the same. And let's see, I should say that they do use something like what you're using because your centering method."},{"latex":"\\text{primal dual}","symbols":"原始对偶","explanation":"原始对偶保持原样，无需修改，用于描述优化问题的原始和对偶变量。","evidence":"People don't really use the barrier method that you've put together, but what is used, for example, in ECOS or in any of these things and all these commercial tools as well, what are used are what are called primal dual interior point methods. I'll just say a little bit about them, just so you know what they are. So they actually update the primal dual variables at each iteration, and you don't have the distinction between inner and, you don't have inner, you're not going all the way back to the central path. d below, or it'll give you a certificate showing that the original problem is infeasible. So that's what that is. I'm just saying this is if you're interested in this. I mean, it's not, you know, some small fraction of you might actually be if you ended up implementing something like this."}],"speech_gaps":[],"frame":"../frames/v017/013.webp","frame_time":2020.71},{"title":"凸优化方法的普及与实际应用","segments":[{"id":108,"text":"You might not. You might not. But I'm just saying, if you were to read the papers, everything else would be complete. You'd see everything. You'd see log barriers. You'd hear self-concordance. You'd look at the KKT systems that are being solved. You'd see we're going to do it by reduction or we're going to do it by just using a primal dual. Sorry."},{"id":109,"text":"an LDL transpose factorization. So you would be highly familiar. You are now ready to start reading. You could read all. I mean, I'm not recommending this, right? But at this point, you could look at any of these things. You could actually look at the codes and everything would be very, very familiar. So, okay. So I'll quit here on this. And let me just finish by saying, I mean, well, I don't know, unless maybe there's some questions about this or not. Okay."},{"id":110,"text":"Yeah, so I guess in the ensuing 30 years, basically, these methods have taken over. They're now the default commercial solvers. So all solvers basically kind of do this. There are some holdovers for linear programming. It's a little bit special, and so there's holdovers for that. But for everything else, it's just this. I mean, it's these primal dual interior point methods, right? Okay."},{"id":111,"text":"Let me finish by just saying one thing. The reason we just did the last two and a half weeks of the class and you are doing this homework was purely to demystify these methods, to show they're not as complicated as they might sound if you just jump in and start reading the papers or you start looking at codes."},{"id":112,"text":"if they're open source, right? They're just not as complicated as they sound. And so it seems like a good thing to understand that actually an LP solver is not that complicated. Solving a small, you know, solving semidefinite program is not that complicated, right? It's also, I mean, whether or not you would have to actually do any of this, it depends what you do."},{"id":113,"text":"If you're actually involved in weird real-time or super large-scale implementations, real-time would be probably more closer to actually a realistic thing. Let's suppose you're flying a drone, and it turns out you need to solve a small semi-definite program, I don't know, 100 times a second. It's actually very difficult to take a commercial solver and embed it."},{"id":114,"text":"Because the commercial solver is going to do all sorts of crazy stuff like, well, for one thing, it's actually going to do things like actually ask to allocate memory, which doesn't work super well when you're in the air. And you have a 10 millisecond deadline. So anyway, I'm just saying."}],"notes":["本段主要讲解了凸优化方法在实际应用中的普及情况，指出这些方法已经成为商业求解器的默认选择。尽管对于线性规划有一些遗留的实现方式，但大多数情况下，这些方法都是通过原始对偶内点法实现的。","课程中强调了学习这些方法的重要性，是为了消除对它们的误解，表明它们并不像初看那样复杂。通过学习和实践，学生可以理解这些方法的实现过程，而不仅仅是阅读论文或查看代码。","讲者提到，虽然这些方法在理论上并不复杂，但在实际应用中，特别是在实时或大规模系统中，使用商业求解器可能会遇到挑战，例如内存分配和时间限制的问题。","讲者以无人机为例，说明在需要快速求解半定规划问题的场景下，商业求解器可能无法满足实时性要求，因此需要更高效的实现方式。","本段还指出，是否需要实际实现这些方法取决于具体的应用场景，对于某些特定领域，如实时系统，可能需要更定制化的解决方案。","最后，讲者强调了理解这些方法的实际意义，特别是在工程和实际应用中的重要性，而不仅仅是理论上的掌握。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2188.24,"end":2352.24,"asr_flags":[],"raw_segments":[{"start":2188.24,"text":"You might not. You might not. But I'm just saying, if you were to read the papers, everything else would be complete. You'd see everything. You'd see log barriers. You'd hear self-concordance. You'd look at the KKT systems that are being solved. You'd see we're going to do it by reduction or we're going to do it by just using a primal dual. Sorry."},{"start":2210.28,"text":"an LDL transpose factorization. So you would be highly familiar. You are now ready to start reading. You could read all. I mean, I'm not recommending this, right? But at this point, you could look at any of these things. You could actually look at the codes and everything would be very, very familiar. So, okay. So I'll quit here on this. And let me just finish by saying, I mean, well, I don't know, unless maybe there's some questions about this or not. Okay."},{"start":2244.23,"text":"Yeah, so I guess in the ensuing 30 years, basically, these methods have taken over. They're now the default commercial solvers. So all solvers basically kind of do this. There are some holdovers for linear programming. It's a little bit special, and so there's holdovers for that. But for everything else, it's just this. I mean, it's these primal dual interior point methods, right? Okay."},{"start":2268.46,"text":"Let me finish by just saying one thing. The reason we just did the last two and a half weeks of the class and you are doing this homework was purely to demystify these methods, to show they're not as complicated as they might sound if you just jump in and start reading the papers or you start looking at codes."},{"start":2289.42,"text":"if they're open source, right? They're just not as complicated as they sound. And so it seems like a good thing to understand that actually an LP solver is not that complicated. Solving a small, you know, solving semidefinite program is not that complicated, right? It's also, I mean, whether or not you would have to actually do any of this, it depends what you do."},{"start":2311.5,"text":"If you're actually involved in weird real-time or super large-scale implementations, real-time would be probably more closer to actually a realistic thing. Let's suppose you're flying a drone, and it turns out you need to solve a small semi-definite program, I don't know, 100 times a second. It's actually very difficult to take a commercial solver and embed it."},{"start":2334.66,"text":"Because the commercial solver is going to do all sorts of crazy stuff like, well, for one thing, it's actually going to do things like actually ask to allocate memory, which doesn't work super well when you're in the air. And you have a 10 millisecond deadline. So anyway, I'm just saying."}],"speech_gaps":[],"frame":"../frames/v017/014.webp","frame_time":2200.24},{"title":"凸优化课程中关于求解器与算法的讲解","segments":[{"id":115,"text":"If you end up at a high frequency trading firm or something like that, and you're going to implement a tiny QP or LP solver that should solve in like 50 microseconds, now you know that you can do it and it's not a big deal. So that was the sole reason to do this part of the course, but I think it's actually kind of important. Okay. Any questions about it? It's kind of cool. So actually now the whole stack is demystified for you."},{"id":116,"text":"Because here's what it does. When you type in CVX pi, CVX pi does, forms a sequence of equivalent problems. It starts with your problem. It does a reduction, makes it a completely equivalent problem with a retrieval method, right? Then reduces it again and again, maybe 12, 15, 20 reductions later, it looks up and it says, I have a form that one of my solvers can solve. Everybody following this? Then,"},{"id":117,"text":"It passes it off to the solver. They are not all interior point methods. SCS, for example, is not. OSQP is not. But many others are. So ECOS, Claribel, commercial ones are almost entirely. In fact, I guess almost entirely. They are barrier and interior point methods, right? And now you know at least a little bit of the details of those. If you go down, drill down deeper."},{"id":118,"text":"What you know is if you profile one of these things, it is only doing the following. Linear algebra. Absolutely nothing else. The linear algebra it's doing is actually mostly just exploiting sparsity. And that's it. So now, in a weird way, you kind of know everything. At least the full stack from what happens when you type in my prob dot solve."},{"id":119,"text":"And now you kind of know. So, yeah. Is there a difference between saying interior point methods or barrier methods? Yeah, let's see. No, not really. So barrier method, I think, is kind of an older term. I kind of like it because it's kind of a cool retro term. Yeah, it's usually pretty much the same. So, yeah. So interior point, I think, is what most people would call it these days. So, yeah, I mean."},{"id":120,"text":"It's still, you have to admit, it's pretty stunning that you can solve an LP with like 10,000 variables and 5,000 constraints, you know, in 20 iterations. And that's to like extremely high precision, right? That's very weird, right? Because basically you want to find a particular vertex in this polyhedron."}],"notes":["本段讲解了CVX工具如何将优化问题转换为可解形式，并通过多次简化后传递给求解器。讲者强调了求解器的多样性，如SCS、OSQP等并非内点法，而ECOS、Claribel等则多为内点法或障碍法。这表明求解器的选择会影响求解过程。","讲者指出，求解器主要执行线性代数操作，尤其是利用稀疏性来加速计算。这说明优化问题的结构对求解效率有重要影响。","讲者提到内点法和障碍法之间的区别不大，认为障碍法是较早的术语，而内点法是当前更常用的称呼。这表明术语的演变反映了算法的发展。","讲者以一个具有10,000个变量和5,000个约束的线性规划问题为例，说明现代求解器可以在20次迭代中达到极高的精度。这展示了优化算法在处理大规模问题上的强大能力。","讲者强调了优化问题求解过程的透明性，即从问题输入到求解器执行的整个流程已被理解，这有助于学生掌握实际应用中的技术细节。","讲者通过实际例子说明了优化算法在现实中的应用价值，如高频交易中的快速求解器实现，这表明课程内容与实际工程问题密切相关。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2352.81,"end":2511.66,"asr_flags":[],"raw_segments":[{"start":2352.81,"text":"If you end up at a high frequency trading firm or something like that, and you're going to implement a tiny QP or LP solver that should solve in like 50 microseconds, now you know that you can do it and it's not a big deal. So that was the sole reason to do this part of the course, but I think it's actually kind of important. Okay. Any questions about it? It's kind of cool. So actually now the whole stack is demystified for you."},{"start":2379.41,"text":"Because here's what it does. When you type in CVX pi, CVX pi does, forms a sequence of equivalent problems. It starts with your problem. It does a reduction, makes it a completely equivalent problem with a retrieval method, right? Then reduces it again and again, maybe 12, 15, 20 reductions later, it looks up and it says, I have a form that one of my solvers can solve. Everybody following this? Then,"},{"start":2408.83,"text":"It passes it off to the solver. They are not all interior point methods. SCS, for example, is not. OSQP is not. But many others are. So ECOS, Claribel, commercial ones are almost entirely. In fact, I guess almost entirely. They are barrier and interior point methods, right? And now you know at least a little bit of the details of those. If you go down, drill down deeper."},{"start":2436.25,"text":"What you know is if you profile one of these things, it is only doing the following. Linear algebra. Absolutely nothing else. The linear algebra it's doing is actually mostly just exploiting sparsity. And that's it. So now, in a weird way, you kind of know everything. At least the full stack from what happens when you type in my prob dot solve."},{"start":2461.52,"text":"And now you kind of know. So, yeah. Is there a difference between saying interior point methods or barrier methods? Yeah, let's see. No, not really. So barrier method, I think, is kind of an older term. I kind of like it because it's kind of a cool retro term. Yeah, it's usually pretty much the same. So, yeah. So interior point, I think, is what most people would call it these days. So, yeah, I mean."},{"start":2490.58,"text":"It's still, you have to admit, it's pretty stunning that you can solve an LP with like 10,000 variables and 5,000 constraints, you know, in 20 iterations. And that's to like extremely high precision, right? That's very weird, right? Because basically you want to find a particular vertex in this polyhedron."}],"speech_gaps":[],"frame":"../frames/v017/015.webp","frame_time":2364.81},{"title":"凸优化中的问题转换与简化方法","segments":[{"id":121,"text":"of which t s a shortest path in the graph, right? So it takes a problem. It estimates what is the most specific. I mean, this is just because you asked, right? It looks at your problem and says, I could compile that to a QP and a second order cone program or something like that. Then it looks among your solvers, unless you specified one, it looks for the one that's most specific."}],"notes":["本段主要讲解了凸优化中问题转换（reduction）的概念，强调了大多数转换方法较为简单和无聊，但也有少数较为有趣和复杂的转换。例如，将最大化问题转换为最小化负目标函数的问题，这种转换方法虽然简单，但却是实际应用中常见的技巧。","讲者提到，问题转换的目的是将原始问题转化为更容易求解的标准形式，例如二次规划（QP）或二阶锥规划（SOCP）。这种转换方法依赖于对问题结构的理解，并且在实际应用中，优化求解器会自动选择最合适的转换方式。","讲者还提到，问题转换的范围从非常基础的转换（如最大化问题转换为最小化负目标函数）到较为复杂的转换（如处理向量中最大3.5个元素的和），后者属于凸函数，并且在CVX中可以通过特定函数实现。","讲者指出，虽然大多数问题转换方法较为简单，但它们在实际应用中仍然非常重要，因为它们能够将复杂问题简化为标准形式，从而利用现有的优化求解器进行求解。","此外，讲者还提到，问题转换的实现依赖于对问题结构的深入理解，例如在处理图问题时，可以将其转换为最短路径问题，从而利用现有的图算法进行求解。","最后，讲者指出，问题转换是凸优化中的一个重要概念，它不仅能够简化问题，还能提高求解效率，是实际应用中不可或缺的工具。"],"formulas":[{"latex":"minimize -f(x)","symbols":"将最大化问题转换为最小化负目标函数","explanation":"该公式正确地将最大化问题转换为最小化负目标函数，这是优化问题中常见的转换方法。","evidence":"What happens is you actually don't do a lot of those now because it's done for you. The reduction would be like introduction of a slack variable, right? It would be, I mean, the interesting ones would be how to handle, I mean, an interesting one would be how do we handle the sum of the 3.5 largest entries of a vector? That's a convex function. It's in CVX pi, sum largest, x comma 3.5."}],"uncertainties":["sum largest, x comma 3.5"],"diagram":"none","start":2512.13,"end":2675.6,"asr_flags":[],"math_clarifications":["原始文本中提到的CDX5和相关优化问题的讨论未包含具体的数学公式，因此无法进一步核对。"],"raw_segments":[{"start":2512.13,"text":"of which there's a number equal to the number of subatomic particles in the universe, including dark matter, right? And what it does is it basically stops and asks for directions 20 times. That's, to me, very weird. I mean, it's cool. We're all very lucky because we're beneficiaries of it. But it's very cool, right? I still don't get it. There ous places, can it withstand it? I might have a maximum stress limit in each bar or something. So there's a whole bunch of constraints. The comment is strong enough to handle boost, take off, whatever, re-entry. I don't care, whatever this is, right?"},{"start":2992.59,"text":"or rough turbulence, all that kind of stuff. Everybody following this? So that's a whole bunch of constraints. Anyway, when you solve this problem, you offered it the option of using, they didn't do a million in the 60s, okay, but now they do a million, right? So you offered it the choice of a million bars, and what happens is, you know, 322 turn out to be positive, and the rest are zero."}],"speech_gaps":[],"frame":"../frames/v017/018.webp","frame_time":2862.51},{"title":"凸优化中的启发式方法与稀疏性应用","segments":[{"id":156,"text":"Everybody got this? And then it's kind of cool because someone said, what did you just do? And you say, I just designed the structure. You know, it's a cool structure. You see all these like bars connecting various points and stuff like that. And if your specs were right, it would be a completely reasonable structure. And someone said, that sounds like a combinatorial problem, right? Because you did not, here's what you did not solve. You didn't say, I want 322 bars from my"},{"id":157,"text":"what I'm offering you, which is 1.1 million, right? Because 1.1 million choose 322 is a super big number, right? So you did not solve that problem. So this is a heuristic, but that's what happens. Everybody got that? So that's already in the 60s people were doing this, which is kind of cool."},{"id":158,"text":"I know that there was a great example in, they do it in circuits. That's a good one. So in circuit design, you're going to build yourself a filter. You might, you're going to build, let's say, an FIR filter. So I'm speaking dialect, but it's okay. So you're going to build yourself, find an impulse response filter, which is a set of a bunch of sums and stuff like that. And you desig  you could do things like this."},{"start":3350.35,"text":"I could have a standard convex problem here, but I could add a constraint that says you can only use k non-zeros."},{"start":3358.91,"text":"right so I mean in like statistics or machine learning this would be you know"},{"start":3365.81,"text":"maximize my log likelihood subject to some constraints that are required then"}],"speech_gaps":[],"frame":"../frames/v017/020.webp","frame_time":3204.64},{"title":"特征选择与凸优化问题","segments":[{"id":181,"text":"also Oh PS you're only allowed to use you can't use more than 22 features and"},{"id":182,"text":"I'm giving you a million right so that would be that right and that there it's"},{"id":183,"text":"called like feature selection we'll get to that okay so just a couple of you"},{"id":184,"text":"you know, observations about this."},{"id":185,"text":"So the first one is if you fix the sparsity pattern,"},{"id":186,"text":"then you just get a convex problem, right?"},{"id":187,"text":"So if I tell you, you know, fit my model,"},{"id":188,"text":"and you go, okay, you say I have a million features,"},{"id":189,"text":"you say, oh, but only these 22 are allowed to be non-zero,"},{"id":190,"text":"and all the rest are zero, then you're like, okay,"},{"id":191,"text":"because then it's just a problem with 22 variables."},{"id":192,"text":"Everybody got this?"},{"id":193,"text":"So this is kind of obvious."},{"id":194,"text":"That means that"},{"id":195,"text":"You could solve 2 to the n convex problems to solve these, right? If n is like 1,000, it's not. I mean, if n is, sorry, n is 100, n is less than 10, this might not be insane, right? So, yeah, so that's one."},{"id":196,"text":"But this kind of brute force search doesn't work for, you know, obviously for bigger problems. It's extremely easy to show that the whole thing, that this general problem is NP-hard. I think we'll do that in a minute. And you could solve it globally by what are called branch-and-bound methods. And there's also branch-and-cut methods. There's all sorts of names for this. It's a whole area, I guess people would call it, like mixed integer convex programming."},{"id":197,"text":"They might. These things can work. Some of them can work spectacularly. I'm not going to talk about those. But anyway, this is just general ideas about how you would solve these problems. So you can actually express Boolean LP as a cardinality problem like that. And I think you've actually done a couple of problems on your wrist. First of all, getting computing bounds."},{"id":198,"text":"for Boolean LPs, and then also for heuristics for actually approximately solving them. I believe you had that in some homework, right? So the way that works is you want to solve this problem. Now, by the way, solving a set of linear inequalities with Boolean variables is basically like all..."},{"id":199,"text":"kind of all of these problems in computer science. So everything is that, right? It's things like 3SAT. It's the traveling salesman problem. I can write down very short descriptions with 0, 1 variables. And you just write it this way, and it's a cardinality problem, and it just looks like this. It's actually the cardinality of x stacked on 1 minus x is less than or equal to n, right?"}],"notes":["本段讲授了特征选择问题，即在给定的特征中选择一部分非零特征进行建模。当固定稀疏模式时，问题转化为一个凸问题，因为变量数量减少到22个。这种情况下，问题变得容易求解。","讲者指出，如果特征数量很大（如1000个），那么穷举所有可能的稀疏模式（2^n个）是不可行的，因为计算量太大。因此，需要更高效的算法，如分支定界法或分支切割法。","讲者提到，布尔线性规划（Boolean LP）可以转化为一个稀疏性问题，即通过限制非零变量的数量来建模。这种转化在计算机科学中非常常见，例如3SAT和旅行商问题。","讲者指出，布尔变量的线性不等式问题可以转化为稀疏性问题，即通过计算变量x和1-x的稀疏性来限制非零变量的数量。这种转化是通过将问题转化为一个关于稀疏性的约束来实现的。","讲者强调，虽然穷举法在小规模问题中可行，但在大规模问题中不可行，因此需要更高效的算法。这些算法包括分支定界法、分支切割法等，它们属于混合整数凸优化的范畴。","讲者提到，学生在作业中已经接触过布尔线性规划的计算界限和启发式方法，这些方法用于近似求解这类问题。"],"formulas":[],"uncertainties":["cardinality of x stacked on 1 minus x is less than or equal to n"],"diagram":"none","start":3372.01,"end":3532.82,"asr_flags":[],"math_clarifications":["原文未提供足够的数学背景来核定公式2^n和cardinality(x) + cardinality(1 -
