</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">17 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 17 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v017.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v017","title":"17 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 17","course":"凸优化","pages":[{"title":"障碍方法与复杂度分析","segments":[{"id":0,"text":"So what we'll do today is finish up the discussion of barrier methods, maybe start on these L1","zh":"那么今天我们将会结束对障碍方法的讨论，也许开始讲这些L1凸基数类型的内容。那么让我们来看一下。首先提醒一下，我们将使用障碍方法。障碍方法是一个相当简单的东西。","start":5.26,"end":14.02},{"id":1,"text":"convex cardinality type things. So let's take a look at that. So just to remind you what it was,","zh":"它嗯让我找一下让我那里我们那里好了所以嗯它简单地说我们找到中心路径上的一个点，然后你使用牛顿法来做这件事，然后你增加这个障碍参数t，它控制间隙，你计算新的点，然后不断重复这个过程，对吧？","start":14.02,"end":20.54},{"id":2,"text":"we are going to look at using a barrier method. Barrier method is a pretty simple thing.","zh":"你知道在每次中心化的过程中，实际上你最终会得到两个严格可行的原始点，也就是x，你也会得到严格可行的对偶点，","start":21.64,"end":28.14},{"id":3,"text":"it's uh let me go find it let me there we there we go so um it simply says uh we we find a point","zh":"你也会得到严格可行的对偶点，","start":28.14,"end":36.02},{"id":4,"text":"on the central path uh you use newton's method to do that then then you increment this barrier","zh":"你使用牛顿法来做这件事，然后你增加这个障碍参数t，它控制间隙，你计算新的点，然后不断重复这个过程，对吧？","start":36.02,"end":42.58},{"id":5,"text":"parameter t that controls the gap and you compute the new point and you keep doing this right and","zh":"你知道在每次中心化的过程中，实际上你最终会得到两个严格可行的原始点，也就是x，你也会得到严格可行的对偶点，","start":42.58,"end":48.72},{"id":6,"text":"you know at some point actually every time you center you end up with two things strictly","zh":"你也会得到严格可行的对偶点，","start":48.72,"end":54.12},{"id":7,"text":"strictly feasible primal point, that's x, you also end up with strictly feasible dual point,","zh":"严格可行的原始点，即x，你最终也会得到严格可行的对偶点，","start":54.8,"end":61.7},{"id":8,"text":"and you have a gap, that means. And the gap is precisely m over t. t is that parameter that","zh":"你有一个差距，这意味着。这个差距就是 m 除以 t。t 是控制近似程度的那个参数。","start":61.86,"end":67.64},{"id":9,"text":"controls the level of approximation. So basically, you keep increasing t until m over t,","zh":"基本上，你不断增大 t，直到这个差距 m/t 小于你所期望的阈值，对吧？这就是这个方法。","start":67.64,"end":75.26},{"id":10,"text":"which is the gap, is less than whatever your desired threshold is, right? So that's the method.","zh":"我想我们上次已经讨论过这个。这是一种同伦方法。它有点特别，因为一般的同伦方法要复杂得多，因为路径可能会停止，或者分叉，或者从无处开始。在这里，这是不成立的。无论你在哪里，你总能回到中心路径。这可能需要很多牛顿步，但你总是可以做到的。好的，这就是障碍方法。现在我们要看一下……","start":75.38,"end":81.48},{"id":11,"text":"I think we talked about that last time. This is a homotopy method. It's kind of a special one because general homotopy methods are much more complex because paths can just stop or they can bifurcate or they can just start in the middle of nowhere. Here, that's false. No matter where you are, you can always get back to the central path. It may cost you a bunch of Newton steps, but you can always do it. Okay, that's the barrier method. And what we're going to do now is look at...","zh":"我想我们上次已经讨论过这个问题。这是一种同伦方法。它有点特别，因为一般的同伦方法要复杂得多，因为路径可能会停止，或者发生分歧，或者从完全无处开始。在这里，这种情况是不成立的。无论你处于什么位置，你总能回到中心路径。这可能会花费你大量的牛顿步，但你总是可以做到这一点。好的，这就是障碍方法。现在我们要做的是看看……","start":81.98,"end":109.93},{"id":12,"text":"we're going to look at the complexity analysis of it. I think I mentioned last time that according to the classical analysis, the upper bound on the number of Newton steps grows as T increases, right? And so that, if you sort of believe that that upper bound had any meaning,","zh":"你可能会避免甚至尝试这个方法，因为你可能会说，好吧，随着 t 越来越大，用牛顿法解决的问题会变得越来越难，需要的迭代次数也越来越多，如此等等。然后你就会陷入某种灾难性的螺旋中，或者什么的。实际上，这种情况在 60 年代就曾发生过，奇怪的是，我不知为什么。","start":110.86,"end":129.64},{"id":13,"text":"you might shy away from even attempting this because you'd say, well, sure, as t gets bigger and bigger, the problems we solved by Newton's method get harder and harder. It takes more and more iterations and so on and so forth. And then you get into some kind of doom spiral there or whatever. This actually kind of happened in the 60s, weirdly. I don't know why.","zh":"你可能会因为尝试这个而退缩，因为你可能会说，好吧，随着t变得越来越大，我们用牛顿方法解决的问题会变得越来越难，需要的迭代次数也越来越多，如此等等。然后你就会陷入某种灾难性的螺旋中。实际上，这种情况在60年代就曾发生过，很奇怪。我不知道为什么。","start":130.06,"end":150.36},{"id":14,"text":"Okay, so it turns out that's not true. You could have guessed that because you've already seen empirical results for how well a barrier method works, which is, by the way, just unbelievably well. So basically, and it's got a very weird interpretation, right? The one interpretation of it's working so well is that it takes between 20, and you solve between 20 and 50 least squares problems to solve a convex optimization problem.","zh":"好的，结果发现这并不是真的。你可能已经猜到了，因为你已经看到了障碍方法表现如何的实证结果，顺便说一句，它的表现好得令人难以置信。基本上，它有一个非常奇怪的解释，对吧？它表现这么好的一个解释是，它需要在20到50次最小二乘问题之间进行求解，以解决一个凸优化问题。","start":152.37,"end":177.43}],"notes":["本段主要讲解了障碍方法的基本原理和其在凸优化中的应用。障碍方法通过在可行域内引入一个障碍函数，使得优化问题在可行域内进行，从而避免直接处理不等式约束。方法的核心是找到中心路径上的点，使用牛顿法进行迭代，并逐步增加障碍参数t，以减小目标函数与约束之间的差距。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":177.43,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":5.26,"text":"So what we'll do today is finish up the discussion of barrier methods, maybe start on these L1"},{"start":14.02,"text":"convex cardinality type things. So let's take a look at that. So just to remind you what it was,"},{"start":21.64,"text":"we are going to look at using a barrier method. Barrier method is a pretty simple thing."},{"start":28.14,"text":"it's uh let me go find it let me there we there we go so um it simply says uh we we find a point"},{"start":36.02,"text":"on the central path uh you use newton's method to do that then then you increment this barrier"},{"start":42.58,"text":"parameter t that controls the gap and you compute the new point and you keep doing this right and"},{"start":48.72,"text":"you know at some point actually every time you center you end up with two things strictly"},{"start":54.8,"text":"strictly feasible primal point, that's x, you also end up with strictly feasible dual point,"},{"start":61.86,"text":"and you have a gap, that means. And the gap is precisely m over t. t is that parameter that"},{"start":67.64,"text":"controls the level of approximation. So basically, you keep increasing t until m over t,"},{"start":75.38,"text":"which is the gap, is less than whatever your desired threshold is, right? So that's the method."},{"start":81.98,"text":"I think we talked about that last time. This is a homotopy method. It's kind of a special one because general homotopy methods are much more complex because paths can just stop or they can bifurcate or they can just start in the middle of nowhere. Here, that's false. No matter where you are, you can always get back to the central path. It may cost you a bunch of Newton steps, but you can always do it. Okay, that's the barrier method. And what we're going to do now is look at..."},{"start":110.86,"text":"we're going to look at the complexity analysis of it. I think I mentioned last time that according to the classical analysis, the upper bound on the number of Newton steps grows as T increases, right? And so that, if you sort of believe that that upper bound had any meaning,"},{"start":130.06,"text":"you might shy away from even attempting this because you'd say, well, sure, as t gets bigger and bigger, the problems we solved by Newton's method get harder and harder. It takes more and more iterations and so on and so forth. And then you get into some kind of doom spiral there or whatever. This actually kind of happened in the 60s, weirdly. I don't know why."},{"start":152.37,"text":"Okay, so it turns out that's not true. You could have guessed that because you've already seen empirical results for how well a barrier method works, which is, by the way, just unbelievably well. So basically, and it's got a very weird interpretation, right? The one interpretation of it's working so well is that it takes between 20, and you solve between 20 and 50 least squares problems to solve a convex optimization problem."}],"speech_gaps":[],"frame":"../frames/v017/001.webp","frame_time":17.259999999999998},{"title":"凸优化中的自洽性分析与牛顿步数","segments":[{"id":15,"text":"with inequality constraints, all that kind of stuff. It's crazy, right? Why do I say you solve least squares problems? It's because you do between 20 and 50 Newton steps total, but a Newton step is actually solving a set of linear KKT systems, which is precisely solving a least squares problem. It's exactly the same as solving a least squares problem with equality constraints, right? So it's actually kind of cool. So you can, it says basically you can,","zh":"带有不等式约束，所有这些内容。这很疯狂，对吧？为什么我说你要解最小二乘问题？这是因为你总共大约进行20到50次牛顿步，但一次牛顿步实际上是在解一组线性KKT系统，这正是在解一个最小二乘问题。这和解带有等式约束的最小二乘问题完全一样，对吧？所以这实际上相当酷。所以你可以，它基本上说你可以，","start":178.09,"end":207.31},{"id":16,"text":"solve any convex problem by solving between 20 and 50 least squares problems that have the same structure and so on. So that's actually kind of, I mean, I find that kind of interesting. And by the way, also, well, let's see.","zh":"通过解20到50个具有相同结构的最小二乘问题来解决任何凸问题。所以这实际上相当有趣。顺便说一句，还有，嗯，让我们看看。","start":208.53,"end":223.46},{"id":17,"text":"If people had been awake in the 60s, people would have noticed this, right? So this wasn't mainstream until the 90s or something like that. But before then, this would have been just completely radical and unheard of. Okay, that's the background. Now what we're going to do is let's see if we can get the theory to catch up with the practice.","zh":"如果人们在60年代保持清醒，人们就会注意到这一点，对吧？所以直到90年代或类似的时候，这才成为主流。在此之前，这将完全是一种激进且前所未有的想法。好的，这是背景。现在我们要做的是看看能否让理论跟上实践。","start":224.61,"end":244.01},{"id":18,"text":"The objective is self-concordant. And that's true for actually a whole bunch of the things that we actually care about, like logs.","zh":"目标函数是自洽的。实际上，这适用于我们真正关心的许多事物，比如对数。","start":246.5,"end":255.24},{"id":19,"text":"The objective is self-concordant. And that's true for actually a whole bunch of the things that we actually care about, like logs. And then this is basically all of it. This is also the densest chain of inequalities, I think, that have appeared in lecture slides that I'm aware of. I couldn't follow it, so I had to work it out myself this morning. So we will go through this together now a bit. I mean, eventually I followed it.","zh":"目标函数是自洽的。实际上，这适用于我们真正关心的许多事物，比如对数。然后这基本上就是全部内容。这也是我所知道的在讲义幻灯片中出现的最密集的不等式链。我无法理解，所以我今天早上不得不自己推导出来。现在我们将一起走一遍这个过程。我的意思是，最终我理解了。","start":255.86,"end":281.32},{"id":20,"text":"So we're going to do a step of the barrier method, which is to use Newton's method to go from here to here. Okay, so that's what we're going to analyze. What we're going to try to do is bound the number of steps it takes to do that, the number of Newton steps, right?","zh":"我们现在要进行的是障碍方法的一个步骤，即使用牛顿法从这里到那里。好的，所以这就是我们要分析的内容。我们要尝试做的是限制完成这个过程所需的步骤数，即牛顿步的数量，对吧？","start":284.05,"end":311.06},{"id":21,"text":"Okay, so we're going to do a step of the barrier method, which is to use Newton's method to go from here to here. Okay, so that's what we're going to analyze. What we're going to try to do is bound the number of steps it takes to do that, the number of Newton steps, right? Okay, so we go back to self-concordance analysis and we ask, well, how many Newton steps does it take to compute this thing?","zh":"好的，我们现在要进行障碍方法的一个步骤，也就是使用牛顿法从这里到那里。好的，这就是我们要分析的内容。我们要尝试做的是，确定完成这个过程所需的步骤数量，也就是牛顿步数，对吧？好的，所以我们回到自洽性分析，并问，计算这个东西需要多少次牛顿步？","start":311.47,"end":340.66}],"notes":["本段主要讲解了自洽性分析在凸优化中的应用，特别是如何通过自洽性来分析牛顿步数。讲者提到，自洽性是一个重要的性质，它适用于许多我们关心的函数，如对数函数。通过自洽性分析，可以推导出计算特定问题所需的牛顿步数上限。","讲者指出，自洽性分析是理解牛顿方法在凸优化中效率的关键。他提到，自洽性分析的推导过程非常复杂，甚至需要自己重新推导，这表明该分析的难度较高。","在讲解过程中，讲者提到中心路径和障碍方法，其中障碍方法使用牛顿法从一个点移动到另一个点。他强调了分析牛顿步数的重要性，因为这关系到算法的效率。","讲者还提到，自洽性分析的推导过程是讲座中出现的最密集的不等式链之一，这表明该部分内容在理论推导上具有较高的复杂性。","讲者通过自己的经历说明，即使对于专家来说，理解自洽性分析的推导过程也需要时间和努力，这反映了该主题的深度和挑战性。","最后，讲者指出，自洽性分析的目标是确定计算特定问题所需的牛顿步数上限，这为实际应用提供了理论支持。"],"formulas":[],"uncertainties":[],"diagram":"none","start":178.09,"end":340.66,"asr_flags":[],"math_clarifications":["公式中的符号不一致，x_{\\mu t} 表示参数为 μt 的点，而 x_plus 应该表示通过增加 t 得到的新点，因此该公式需要移除以避免混淆。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":178.09,"text":"with inequality constraints, all that kind of stuff. It's crazy, right? Why do I say you solve least squares problems? It's because you do between 20 and 50 Newton steps total, but a Newton step is actually solving a set of linear KKT systems, which is precisely solving a least squares problem. It's exactly the same as solving a least squares problem with equality constraints, right? So it's actually kind of cool. So you can, it says basically you can,"},{"start":208.53,"text":"solve any convex problem by solving between 20 and 50 least squares problems that have the same structure and so on. So that's actually kind of, I mean, I find that kind of interesting. And by the way, also, well, let's see."},{"start":224.61,"text":"If people had been awake in the 60s, people would have noticed this, right? So this wasn't mainstream until the 90s or something like that. But before then, this would have been just completely radical and unheard of. Okay, that's the background. Now what we're going to do is let's see if we can get the theory to catch up with the practice."},{"start":246.5,"text":"And that comes via self-concordance analysis. So what we're going to do is we're going to simply assume that the centering problem"},{"start":255.86,"text":"The objective is self-concordant. And that's true for actually a whole bunch of the things that we actually care about, like logs. And then this is basically all of it. This is also the densest chain of inequalities, I think, that have appeared in lecture slides that I'm aware of. I couldn't follow it, so I had to work it out myself this morning. So we will go through this together now a bit. I mean, eventually I followed it."},{"start":284.05,"text":"So let's remember what we're doing. We're on the central path at a point. I'll draw a central path. So here's the central path. Here's the optimal point. Here we are. So we're at x of t. And then we're going to increase t by mu. We're going to have t times equals mu. And this is going to be x of mu t. And we're going to call this guy x plus, like that."},{"start":311.47,"text":"Okay, so we're going to do a step of the barrier method, which is to use Newton's method to go from here to here. Okay, so that's what we're going to analyze. What we're going to try to do is bound the number of steps it takes to do that, the number of Newton steps, right? Okay, so we go back to self-concordance analysis and we ask, well, how many Newton steps does it take to compute this thing?"}],"speech_gaps":[{"start":244.41,"end":246.1},{"start":281.72,"end":283.344}],"frame":"../frames/v017/002.webp","frame_time":190.09},{"title":"自洽理论与牛顿迭代次数的上界","segments":[{"id":22,"text":"starting from here right and the answer is you look at the function you're minimizing uh which is uh it's this it's it's mu t so we start uh when you let's see let me write down what this is so x plus is the arg min right of t mu or as mu t f zero of x plus sum um and this is over i","zh":"从这里开始，右边的答案是，你观察你正在最小化的函数，它是 mu t，所以我们开始的时候，让我写下这是什么，x 加是 arg min 右边的 t mu 或者 mu t f 零的 x 加上总和，这个是关于 i 的","start":341.71,"end":371.27},{"id":23,"text":"of this is the barriers, right? And then plus the indicator function, I guess we write it as ax equals b. Looks like that, okay? So you're basically minimizing this function subject to these equality constraints, right? So that's literally the definition of what x plus is, right? If I remove this, this is the definition of x.","zh":"这个是障碍函数，对吧？然后加上指示函数，我想我们写成 ax 等于 b。看起来就是这样，对吧？所以你基本上是在这些等式约束下最小化这个函数，对吧？所以这就是 x 加的定义，对吧？如果去掉这个，这就是 x 的定义。","start":371.92,"end":401.7},{"id":24,"text":"So, and in fact, that's kind of the point, right? The whole point here is that we just computed this. Now we increase t. And so the idea is this problem is very, should be relatively close to the previous one. And that hopefully will save us some Newton steps or something like that. That's the hope here. So this is the minimizer. Okay. So the general self-concordant theory says that the number of steps, the number of Newton steps is less than or equal to the function value where you start.","zh":"所以，事实上，这就是重点，对吧？这里的整个重点是我们刚刚计算了这个。现在我们增加 t。所以这个想法是，这个问题应该与之前的问题非常接近。希望这能节省我们一些牛顿步骤，或者类似的东西。这就是我们的希望。所以这就是最小化器。好的。一般来说，自洽理论说，步骤的数量，即牛顿步骤的数量，小于或等于你开始时的函数值。","start":402.38,"end":431.3},{"id":25,"text":"minus the function value where you end, which is its optimal value, and then multiplied by a constant. And you could either use our lazy constant as like you divide by 365 or something like that, or maybe you multiply by 365. And then you add something that looks like log log 1 over epsilon, which we just call 5 or 6, and that's fine. Everybody got that? So that's the c over there, right? So this is the function value at x of t.","zh":"减去你结束时的函数值，也就是它的最优值，然后乘以一个常数。你可以使用我们懒惰的常数，比如你除以 365 或者类似的东西，或者也许你乘以 365。然后你加上一个看起来像 log log 1/epsilon 的东西，我们称之为 5 或 6，这样就可以了。大家明白了吗？所以这就是那个 c，对吧？所以这就是 x 的 t 处的函数值。","start":432.12,"end":460.53},{"id":26,"text":"That's x, which we're just going to call x over here. That's this guy here. And then this is going to be the function value when you finish. Because x plus minimizes this thing subject to the equality constraints, right? So that's what that is. Okay, so...","zh":"这就是 x，我们在这里只是称之为 x。这就是这个家伙。然后这个将是你完成时的函数值，因为 x 加是在这些等式约束下最小化这个东西的，对吧？所以这就是它的含义。好的，所以……","start":461.15,"end":479.13},{"id":27,"text":"That's the number of Newton iterations, and our job is to get an upper bound on this big thing here. Forget the C for the moment, and let's just take a look at this thing. And now we go kind of very slowly. I'll expand various things, right?","zh":"这就是牛顿迭代次数，我们的任务是为这个大东西得到一个上界。暂时忘记 C，我们只看一下这个东西。现在我们慢慢地进行，我会展开各种内容，对吧？","start":480.19,"end":496.05}],"notes":["本段讲授了自洽理论中牛顿迭代次数的上界估计。讲者指出，当参数t增加时，新的优化问题应与前一个问题相对接近，从而减少所需的牛顿迭代次数。这是自洽理论的核心思想之一。","讲者提到，牛顿迭代次数的上界与初始函数值和最终最优值之间的差值有关，并乘以一个常数。这个常数可以是任意的，例如365，或者通过其他方式确定。此外，还涉及一个与ε相关的对数项，通常被简化为5或6。","讲者强调，x_plus是满足等式约束条件下的最小化点，即x_plus是优化问题的解。因此，最终的函数值是该问题的最优值。","讲者指出，我们的目标是为这个大项（即牛顿迭代次数的上界）提供一个上界估计。为了简化分析，暂时忽略常数C，并专注于分析该大项的结构。","讲者提到，接下来将逐步展开分析，包括对各项的展开和解释，以更清晰地理解整个理论框架。","本段内容涉及自洽理论中的关键概念，包括函数值的差值、常数项、对数项以及牛顿迭代次数的上界估计。这些内容为后续的理论分析和算法设计提供了基础。"],"formulas":[],"uncertainties":["mu t f zero of x plus sum um and this is over i","the lazy constant as like you divide by 365 or something like that, or maybe you multiply by 365"],"diagram":"none","start":341.71,"end":496.05,"asr_flags":[],"math_clarifications":["原始片段中提到的自洽理论中的迭代次数上界表达式不完整，缺少乘以常数项和对数项的描述，无法准确表达完整的数学关系。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":341.71,"text":"starting from here right and the answer is you look at the function you're minimizing uh which is uh it's this it's it's mu t so we start uh when you let's see let me write down what this is so x plus is the arg min right of t mu or as mu t f zero of x plus sum um and this is over i"},{"start":371.92,"te  first question is how on earth do you get, how do you go from this line to this line? And that's an equality constraint. And so I think that is written here. We use the fact that phi of x minus phi of x plus. So phi of x is the sum of the, it's minus the sum of the log of minus fi of x, right? This is the same thing evaluated at x plus. So this difference looks like that.","zh":"那么第一个问题是，你怎么从这一行到这一行？这是一个等式约束。我认为这里已经写出来了。我们利用了phi(x)减去phi(x+)。phi(x)是负的log的和，对吧？这是在x处的相同表达式。这个差看起来像这样。","start":497.91,"end":526.77},{"id":29,"text":"It doesn't look like it. It's equal to it, right? So this is the difference, right? It's the log of this ratio. I leave the minus signs there, just, I don't know. Of course, you could get rid of them. They're both negative, both fi of x and fi of x plus, because they're both strictly feasible. Okay, now we're going to use the following. Lambda i, these are the dual variables associated with the inequality constraints.","zh":"看起来不像。它等于它，对吧？所以这是差，对吧？它是这个比率的log。我保留了负号，只是，我不知道。当然，你可以去掉它们。因为它们都是负的，fi(x)和fi(x+)都是严格可行的。好的，现在我们将使用以下内容。lambda_i，这些是与不等式约束相关的对偶变量。","start":527.47,"end":553.21},{"id":30,"text":"associated with computing as a point of the central path. That's equal to this. And you realize that, hey, this kind of looks like that, right? So it says 1 over minus fi of x, that's the denominator here, is equal to t lambda i. So I plug t lambda i in instead of that, and I get this, okay? So that, I think, that makes sense. Okay, and I do that. And then what I'm going to do, very weirdly,","zh":"与计算中心路径上的点相关。这等于这个。你意识到，嘿，这看起来有点像那个，对吧？所以它说1除以负的fi(x)，这是分母，等于t lambda_i。所以我用t lambda_i代替它，得到这个，对吧？所以我认为这有道理。好的，我这样做。然后我接下来要做的事情，非常奇怪的是，","start":554.05,"end":583.5},{"id":31,"text":"is I'm going to do the following, if you don't mind. I'm going to put a mu here and then go minus log, let's see, minus, I'm going to put a mu in there and then I'm going to say maybe plus log mu. I think I got that right, right? Because here I...","zh":"是如果你们不介意的话，我会在这里放一个m f mu t starting from x of t. These are two points on the central path, right? And that's the bound. And it's actually kind of cool. What it does is it does say that as mu gets bigger and bigger, the bound goes up. But it does say that if you take like really small steps, it's not going to take much at all. Actually, at that point, the 5 or the 6, which is our way to say log log 1 over epsilon, is going to dominate, right? So, okay. Okay.","zh":"x of mu t从x of t开始，这两个点是在中心路径上的，对吧？这就是这个上界。而且实际上这有点酷。它说的是，当mu变得越来越大时，这个上界也会增加。但它也说明，如果你采取非常小的步长，所需的步数其实并不多。实际上，在这一点上，5或6，也就是我们所说的log log 1 over epsilon，会占主导地位，对吧？所以，好的。好的。","start":949.71,"end":977.63},{"id":46,"text":"Now you simply assemble things. You say, well, the number of Newton steps, remember, is this is exactly the number of outer steps you'll take because you'll start with an initial gap. This is basically the initial gap and then divided by log mu. So if mu is like really small, you'll take a whole bunch of steps, but you'll make small, you'll make a progress, which is exactly a factor of mu and duality gap each step.","zh":"现在你只需要把东西组合起来。你说，牛顿步数的数量，记住，这正是你要进行的外层步数的数量，因为你将从初始间隙开始。这基本上就是初始间隙，然后除以log mu。所以如果mu非常小，你将进行很多步，但每次的进展是一个mu和对偶间隙的因子。","start":979.92,"end":1003.4}],"notes":["本段讨论了在凸优化中，对数障碍函数的构造及其与牛顿步数的上界关系。讲者提到，当使用障碍方法时，参数mu的大小会影响所需的牛顿步数。通过分析mu与初始间隙的关系，可以推导出一个关于牛顿步数的上界表达式。","讲者指出，当mu增大时，所需的牛顿步数上界也会增加，但若mu非常小，则所需的步数会减少，但每次迭代的进展会更小。这表明，mu的选择需要在计算效率和收敛速度之间进行权衡。","讲者还提到，通过将mu与初始间隙结合，可以得到一个关于牛顿步数的上界表达式，该表达式包含log log(1/ε)项，这表明在某些情况下，步数的上界与对数项相关。","在分析过程中，讲者强调了对数障碍函数的导数和二阶导数的性质，这有助于理解其形状和行为。例如，当mu大于1时，函数在mu=1处的导数为0，二阶导数为1，这表明该点附近函数的行为类似于一个平方函数。","讲者还提到，通过将这些分析结果组合起来，可以得到一个关于牛顿步数的上界表达式，该表达式结合了初始间隙和log mu项，这为实际计算提供了理论依据。","最后，讲者指出，当mu非常小时，所需的牛顿步数会增加，但每次迭代的进展会更小，这表明在实际应用中需要根据具体问题选择合适的mu值。"],"formulas":[{"latex":"mu - 1 - \\text{log} \\mu","symbols":"mu 减去 1 再减去 mu 的对数","explanation":"公式正确，表示一个关于 mu 的函数，用于分析牛顿步数的上界。","evidence":"Yeah. Okay. All right. So what does mu minus 1 minus log mu look like? So let me draw that. nd":1083.6},{"id":50,"text":"So it's about 30. And then I think actually you get something, you know, it's, it's actually instead of 0.1 point, you know, Oh two, it's something like 1.3, which is at least less ridiculous, but it doesn't matter. It looks the same. Right. Right. So, Oh, and also you can notice the number of, you know, you can look at the theory here and it will say, it will say the good news is that the total number of iterations is less than 8,000. There, there you go.","zh":"所以大约是30。然后我想实际上你会得到一个结果，你知道的，它不是0.1点，你知道的，哦两，而是像1.3，这至少不那么荒谬，但没关系。看起来是一样的。对吧。对吧。哦，还有，你也可以注意到牛顿步数的数量，你知道的，你可以看一下这里的理论，它会说，好消息是总迭代次数小于8,000。在那里，就是这样。","start":1084.19,"end":1112.18},{"id":51,"text":"Okay. So, but I mean, we all know that as an empirical fact, it takes between 20 and 80 steps, like always, like there's never been any experience otherwise. Everybody got this. So I guess it's not so bad. If you take 8,000 and divided by 36, which is the ratio of the lazy bound to the other one, you get something that's much more reasonable, I think. But anyway. Okay.","zh":"好的。但我想我们都知道这是一个经验事实，它需要在20到80步之间，总是如此，从未有过其他经验。大家都知道这一点。所以我猜这并不太糟糕。如果你将8,000除以36，即懒惰上界与其他上界的比率，你会得到一个更合理的数值，我认为。但无论如何。好的。","start":1112.72,"end":1134.78},{"id":52,"text":"So that's pretty cool. So actually, I mean, these two slides would have been like completely radical in the year, I don't know, you know, 1990 or something like that. So, and in fact, something not too dissimilar ended up on the cover of the New York, you know, the front page of the New York Times, right? So, which is another story, but it's a weird one. Okay. So, okay.","zh":"所以这真的很酷。实际上，我意思是，这两张幻灯片在1990年左右的年代会完全颠覆人们的认知。事实上，后来有一个类似的故事登上了《纽约时报》的头版，对吧？这是另一个故事，但很奇怪。好的，好的。","start":1137.03,"end":1158.66},{"id":53,"text":"Now, if you want to go all the way on this, what you do is you say, well, I can take this","zh":"如果你想深入探讨这个问题，你所做的就是说，好吧，我可以使用这里的函数，这是我对总牛顿步数的上界，我可以对μ进行最小化。","start":1160.31,"end":1166.03},{"id":54,"text":"function here, which is my upper bound on the total number of Newton steps, and I can minimize","zh":"这并不是很难做到。你不会精确地这么做，因为所有这些内容都很粗糙，也很愚蠢，因为这些都是上界之类的东西。","start":1166.03,"end":1170.03},{"id":55,"text":"it over mu, which you can do. I mean, it's not that hard to do. You don't do it exactly because","zh":"但如果你这么做，你会发现你希望选择μ的量级","start":1170.03,"end":1174.05},{"id":56,"text":"all of this is sloppy and it's all silly because this is all upper bounds and all that kind of","zh":"在某种程度上，这些内容都是上界，所有这些事情都是如此。","start":1174.05,"end":1177.55},{"id":57,"text":"stuff. But if you do, what you'll find out is that you would like to choose mu to be on the order","zh":"但如果你这么做，你会发现你希望选择μ的量级","start":1177.55,"end":1182.99}],"notes":["本段主要讨论了牛顿法在优化问题中的应用，特别是关于计算步骤数的上界。讲者提到，通过使用懒惰界（lazy bound）和更精确的俄罗斯界（Russian bound），可以对μ的选择进行优化，从而平衡外迭代次数和目标函数值的变化。"],"formulas":[],"uncertainties":["divided by 36"],"diagram":"none","start":1004.45,"end":1182.99,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":1004.45,"text":"And then this is the number of, that's our bound on the number of, the upper bound on the number of Newton steps to compute x at mu t given you've just computed it at x t, right? And so now when you multiply these two things together, you get something that looks like this. It's actually really cool. And here I'm using our lazy numbers, right? Our lazy numbers in the bound, I forget what they were. They were, I think it's 365."},{"start":1031.98,"text":"times the difference in objective value plus six or something. And you get something that looks like this, right? And this is very, very cool. What it does is it says there is indeed a trade-off of mu. If you take mu too small, then you're going to be, this term is going to give you a lot of, you're going to have to do many, many outer iterations, right? If you take mu too big, it says this term is going to start dominating."},{"start":1057.74,"text":"And it'll look like that. And this says that somewher 个概念","start":1231.31,"end":1235.51},{"id":67,"text":"at some of the papers from the 90s and the aughts and all that kind of stuff","zh":"在90年代的一些论文以及后来的那些东西中","start":1235.51,"end":1239.07},{"id":68,"text":"you you would actually see this in titles of papers like you know a long","zh":"你你实际上会在一些论文的标题中看到类似的内容，比如你懂的，『长步对偶方法』","start":1239.07,"end":1242.97},{"id":69,"text":"long-step primal dual method, blah, blah, blah, something like that.","zh":"长步对偶方法， blah, blah, blah, 类似这样的内容","start":1242.97,"end":1245.67},{"id":70,"text":"Okay, so this is actually like, I think it's pretty cool.","zh":"好的，所以这实际上是很酷的","start":1245.95,"end":1252.67},{"id":71,"text":"I mean, this is sort of how the theory and the practice are approximately consistent.","zh":"我的意思是，这在某种程度上体现了理论和实践大致是一致的","start":1252.83,"end":1261.13},{"id":72,"text":"But what I should tell you, I mean, I'll explain this later. What I should tell you, though, is that there's been a kind of a leapfrog thing where people working on practical implementations of interior point methods or barrier methods actually will do something not justified by the theory. And it will work better. And they will run it on test suites of thousands of problems and blah, blah, blah, release something maybe commercially or whatever.","zh":"但我要告诉你们的是，我稍后会解释这一点。不过我要告诉你们的是，有一种『蛙跳式』的发展：从事内点法或障碍法实用实现的人们实际上会做一些理论没有支持的事情，但效果更好。他们会用成千上万个问题的测试集运行这些方法，然后可能发布一些商业产品或类似的东西","start":1262.86,"end":1288.02},{"id":73,"text":"What will happen then typically is five years later, the theorists will catch up and show that a simplified variation of that method actually is like polynomial time or something. And then by then, the people actually working on the methods will come up with something else and extend it. So there are periods like every couple of years when the theory and the practice are in sync, but it doesn't last very long as soon as that happens. So that's actually the story. OK.","zh":"然后通常会发生的是，五年后，理论家们会追上并证明，这种方法的一个简化版本实际上具有多项式时间复杂度或其他类似性质。而到那时，实际从事这些方法的人们又会提出新的东西并扩展它。因此，每隔几年就会出现理论和实践同步的时期，但这种同步不会持续很久，一旦出现就很快就会变化。这就是整个故事。好的。","start":1290.24,"end":1315.98},{"id":74,"text":"Oh, first of all, any questions about this? It's kind of cool stuff. If not, we'll move on. You probably guessed that the way everything was set up, the exact same methods are going to work for generalized inequalities, right? And you're right. And this is how you'd solve SOCPs, semi-definite programs, things like that, of which you've solved a whole bunch.","zh":"哦，首先，大家对这个有没有问题？这内容还挺有意思的。如果没有问题的话，我们继续往下讲。你们大概已经猜到了，根据前面的设置，同样的方法也会适用于广义不等式，对吧？你们是对的。这就是如何求解二次约束规划（SOCP）、半正定规划（SDP）之类的问题，你们已经解决了很多这样的问题。","start":1318.21,"end":1346.74}],"notes":["本段讲解了凸优化中步长选择对算法复杂度的影响，提到步长选择与算法性能之间的关系。讲者指出，步长选择会影响迭代次数，通常迭代次数与√m和log m有关，但实际应用中人们可能忽略log m项，直接引用√m作为复杂度。此外，讲者还区分了短步法和长步法，短步法使用较小的步长，而长步法则更激进地调整步长。","讲者提到，理论与实践之间存在一种‘跳蛙’现象，即实际应用中人们可能会采用未经理论证明的方法，但这些方法在实践中表现更好。随后，理论研究者会在几年后证明这些方法的理论复杂度，如多项式时间。这种理论与实践的同步状态不会持续太久，每隔几年就会出现一次。","讲者最后提到，对于广义不等式，与之前讨论的凸优化方法类似，相同的算法可以应用于解决二次约束规划（SOCP）和半正定规划（SDP）等问题，这些方法已经被广泛使用。","讲者强调，实际应用中人们可能会忽略理论中的某些细节，如log m项，直接采用简化版本的复杂度分析。这种做法在实践中可能更有效，但需要理论研究者的后续验证。"],"formulas":[],"uncertainties":["Muse","mu"],"diagram":"none","start":1182.99,"end":1346.74,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":1182.99,"text":"something like that. That's very close in order to what the minimizer would be. If you plug that"},{"start":1188.01,"text":"back in you get something amazing it says that the number of steps is uh it's on the order of"},{"start":1193.47,"text":"the square root of m and then there's a log m term i ignore that i guess if you're a complexity"},{"start":1199.03,"text":"theory theorist you don't right the log m so it's squared m log m is the complexity i think people"},{"start":1205.93,"text":"just quote it as square root m right so so um it's pretty good uh so i mean in fact most people"},{"start":1214.99,"text":"would choose don't yet choose Muse that are much larger and in fact people"},{"start":1220.15,"text":"people refer to methods that have small mu they refer to those as short step"},{"start":1225.71,"text":"methods and then ones where you actually are much more aggressive in it in"},{"start":1231.31,"text":"adapting mu are called long step methods you might see this if you start looking"},{"start":1235.51,"text":"at some of the papers from the 90s and the aughts and all that kind of stuff"},{"start":1239.07,"text":"you you would actually see this in titles of papers like you know a long"},{"start":1242.97,"text":"long-step primal dual method, blah, blah, blah, something like that."},{"start":1245.95,"text":"Okay, so this is actually like, I think it's pretty cool."},{"start":1252.83,"text":"I mean, this is sort of how the theory and the practice are approximately consistent."},{"start":1262.86,"text":"But what I should tell you, I mean, I'll explain this later. What I should tell you, though, is that there's been a kind of a leapfrog thing where people working on practical implementations of interior point methods or barrier methods actually will do something not justified by the theory. And it will work better. And they will run it on test suites of thousands of problems and blah, blah, blah, release something maybe commercially or whatever."},{"start":1290.24,"text":"What will happen then typically is five years later, the theorists will catch up and show that a simplified variation of that method actually is like polynomial time or something. And then by then, the people actually working on the methods will come up with something else and extend it. So there are periods like every couple of years when the theory and the practice are in sync, but it doesn't last very long as soon as that happens. So that's actually the story. OK."},{"start":1318.21,"text":"Oh, first of all, any questions about this? It's kind of cool stuff. If not, we'll move on. You probably guessed that the way everything was set up, the exact same methods are going to work for generalized inequalities, right? And you're right. And this is how you'd solve SOCPs, semi-definite programs, things like that, of which you've solved a whole bunch."}],"speech_gaps":[],"frame":"../frames/v017/008.webp","frame_time":1194.99},{"title":"锥约束与广义对数函数","segments":[{"id":75,"text":"already. So, well, sorry, you didn't, but CVXPy, you typed in CVXPy, CVXPy compiled your problem to some standard form, and then called one of some number of solvers. So, you have solved a bunch of SDPs in that spirit. So, okay. So, here, what we're going to do is we're going to look at these","zh":"已经。所以，嗯，抱歉，你没有这样做，但CVXPy，你输入了CVXPy，CVXPy将你的问题编译成某种标准形式，然后调用了一些求解器中的一个。所以，你以这种方式解决了很多SDPs。所以，好的。在这里，我们将要做的事情是，我们将要看看这些","start":1347.28,"end":1368.54},{"id":76,"text":"We're going to have cone constraints like this, right? So fi is a vector. And, you know, the most interesting one is going to be things like SOCP and SDPs, right? So if you think about it, we have to just go back and generalize everything. Now, before we had fi of x. fi of x was a number.","zh":"我们将要处理这样的锥约束，对吧？所以fi是一个向量。而且，最有趣的一个将是像SOCP和SDPs这样的内容，对吧？所以如果你仔细想想，我们必须回到之前的内容并进行一般化。之前我们有fi of x。fi of x是一个数。","start":1370.67,"end":1394.13},{"id":77,"text":"Right? Minus fi of x we thought as a margin. And minus log minus fi of x was this barrier function. It was convex. And, you know, as you got to the boundary, the boundary being fi equals zero, this thing would go to plus infinity. So that was our barrier. But now, I mean, let's suppose I have some cone. Let's imagine it's like the semi-definite cone or something like that. You need to have something that's going to be the same as a logarithm. So you need the idea of a logarithm on a cone.","zh":"对吧？我们把减去fi of x看作是一个边界。而减去log减去fi of x则是这个障碍函数。它是凸的。而且，当你接近边界，边界是fi等于零时，这个函数会趋向于正无穷。所以这就是我们的障碍。但现在，我想假设我有一个锥。让我们想象它是半正定锥或者其他类似的锥。你需要有一个类似于对数的东西。因此，你需要在锥上定义对数的概念。","start":1394.66,"end":1423.64},{"id":78,"text":"So what you do is you generalize this to have, you say that a generalized logarithm, it's a function that is, its domain is the interior, so that makes perfect sense. It's concave, it's strictly concave. That's what the second term means. And in fact, this is actually concave in the,","zh":"所以你所做的就是将这个一般化，你说一个广义对数是一个函数，它的定义域是内部，这完全合乎逻辑。它是凹的，而且是严格凹的。这就是第二个术语的意思。事实上，这实际上是在这个意义上的凹函数，","start":1425.8,"end":1447.71},{"id":79,"text":"They'll just say it's concave, right? And then it has to actually kind of agree with a logarithm on any ray, right? And so it's got to look like this. If you multiply phi with some scalar s here, phi of sy, that's going to be phi of y plus theta log s. So it has to look exactly like a log on any ray. Okay.","zh":"他们只会说它是凹的，对吧？而且它必须在任何射线上与对数一致，对吧？因此，它必须看起来像这样。如果你将phi乘以某个标量s在这里，phi of sy，这将是phi of y加上theta log s。因此，它必须在任何射线上看起来完全像一个对数。好的。","start":1448.51,"end":1469.87},{"id":80,"text":"So you do get things like this. Oh, and this number, theta, is called the degree of that logarithm, right? So here, like if you have the non-negative orthon, if you use this, you just end up with the same barrier we had before, right? This is the log of the non-negative orthon. The log of a vector is this thing, right? Something like, it's a generalized logarithm.","zh":"因此，你会得到这样的东西。哦，而且这个数theta被称为这个对数的次数，对吧？所以在这里，比如如果你有非负正交锥，如果你使用这个，你最终会得到和之前一样的障碍函数，对吧？这是非负正交锥的对数。向量的对数就是这个东西，对吧？类似于，它是一个广义对数。","start":1470.29,"end":1495.51},{"id":81,"text":"What's interesting is much more interesting is what happens on like a semi-definite cone. There, surprise, surprise, our friend log determinant, which goes back, whatever, to week two of the class. Not surprisingly, that's a generalized logarithm on the positive definite cone.","zh":"有趣的是，更有趣的是在半正定锥上会发生什么。在那里，令人惊讶的是，令人惊讶的是，我们的好朋友对数行列式，这可以追溯到课程的第二周。不出所料，这在正定锥上是一个广义对数。","start":1496.48,"end":1512.66}],"notes":["本段讲解了锥约束在凸优化中的应用，特别是SOCP和SDP。讲者提到，之前讨论的fi(x)是一个标量，现在需要将其推广到向量形式，以处理更复杂的约束条件。","讲者指出，当处理锥约束时，需要引入广义对数函数的概念。这种函数的定义域是锥的内部，且是严格凹函数，这与传统的对数函数在性质上相似。","广义对数函数需要满足在任何射线上与对数函数一致的性质。具体来说，如果将函数φ作用于标量s乘以向量y，结果应等于φ(y)加上θ乘以log s，其中θ称为对数的次数。","讲者提到，对于非负正交向量，广义对数函数会退化为之前讨论的障碍函数，这表明广义对数函数是传统对数函数的自然推广。","在半正定锥的情况下，对数行列式函数被指出是一个广义对数函数。这与课程早期讨论的对数函数概念相呼应，说明了对数函数在不同锥结构中的普遍性。","本段强调了广义对数函数在处理锥约束时的重要性，特别是在构建障碍函数和优化问题中，它提供了一种统一的数学工具。"],"formulas":[{"latex":"\\phi(sy) = \\phi(y) + \\theta \\log s","symbols":"\\phi: 广义对数函数，s: 标量，y: 向量，\\theta: 对数的次数","explanation":"公式正确，描述了广义对数函数在标量乘法下的性质，符合数学定义。","evidence":"They'll just say it's concave, right? And then it has to actually kind of agree with a logarithm on any ray, right? And so it's got to look like this. If you multiply phi with some scalar s here, phi of sy, that's going to be phi of y plus theta log s. So it has to look exactly like a log on any ray. Okay."}],"uncertainties":[],"diagram":"none","start":1347.28,"end":1512.66,"asr_flags":[],"math_clarifications":["公式中的\\phi(sy) = \\phi(y) + \\theta \\log s 是对广义对数函数在标量乘法下的性质的正确描述，符合数学定义。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1347.28,"text":"already. So, well, sorry, you didn't, but CVXPy, you typed in CVXPy, CVXPy compiled your problem to some standard form, and then called one of some number of solvers. So, you have solved a bunch of SDPs in that spirit. So, okay. So, here, what we're going to do is we're going to look at these"},{"start":1370.67,"text":"We're going to have cone constraints like this, right? So fi is a vector. And, you know, the most interesting one is going to be things like SOCP and SDPs, right? So if you think about it, we have to just go back and generalize everything. Now, before we had fi of x. fi of x was a number."},{"start":1394.66,"text":"Right? Minus fi of x we thought as a margin. And minus log minus fi of x was this barrier function. It was convex. And, you know, as you got to the boundary, the boundary being fi equals zero, this thing would go to plus infinity. So that was  if you work out what this is. Okay. So, all right. So that's your...","zh":"这就是它的定义。这就是逆矩阵。两个对称矩阵之间的内积是乘积的迹，对吧？因为这实际上就是内积。它是对应项乘积的和，对吧？因此，当然，这是n，因为y乘以y逆的迹是i的迹，即n。好的？所以这些特性是有效的。二阶锥，你知道的，如果你计算出这个是什么，故事是一样的。好的。所以，好的。这就是你的...","start":1600.68,"end":1628.22},{"id":86,"text":"That's this property of the logarithmic, of the generalized logarithm. Armed with that, we can actually define a logarithmic barrier. So the log barrier is going to be this. I have a bunch of cone inequalities, but they are, sorry, I have a bunch of inequalities, but they're respect to some cone here, like your k1 and up to k sub m, right? So we form this thing. That's going to be the log barrier. And this is exactly like...","zh":"这就是广义对数的这个特性。有了这个，我们实际上可以定义一个对数障碍函数。所以对数障碍函数将会是这个。我有一系列锥不等式，但它们是，抱歉，我有一系列不等式，但它们是相对于某个锥的，比如你的k1到k_m，对吧？所以我们形成这个东西。这就是对数障碍函数。这和...","start":1629.75,"end":1655.54},{"id":87,"text":"in the case when the inequalities were scalars. It's identical, right? Or at least the form is identical, right? It's a bit more complicated, right? These are vectors now.","zh":"在不等式为标量的情况下。它是一样的，对吧？或者至少形式是一样的，对吧？它稍微复杂一点，对吧？现在这些是向量了。","start":1655.82,"end":1665.12}],"notes":["本段讲解了对数障碍函数的定义及其与锥约束的关系。首先，讲者指出对数障碍函数的构造基于锥不等式，这些不等式需要满足特定的锥结构，如非负锥或半正定锥。接着，讲者提到对数障碍函数的形式与标量不等式情况类似，但需要考虑向量的情况，这增加了复杂性。","讲者进一步解释了对数障碍函数的梯度性质，特别是在不同锥结构下的表现。例如，在非负锥中，梯度是正的；在半正定锥中，梯度是逆矩阵。这些性质对于理解对数障碍函数的构造和应用至关重要。","讲者还提到对数障碍函数的内积计算，即两个对称矩阵的内积等于它们乘积的迹。这一性质在计算对数障碍函数的梯度时非常重要，因为它涉及到矩阵的迹运算。","此外，讲者指出对数障碍函数的构造需要考虑所有锥不等式，并将它们转化为对数障碍函数的形式。这一过程类似于标量不等式的情况，但需要处理向量和矩阵的运算。","最后，讲者强调了对数障碍函数在凸优化中的重要性，特别是在处理锥约束问题时，对数障碍函数能够有效地将不等式约束转化为可优化的目标函数。"],"formulas":[],"uncertainties":["non-negative orphan"],"diagram":"none","start":1513.7,"end":1665.12,"asr_flags":[],"math_clarifications":["所有公式均无法核定，因为缺少上下文信息，无法验证其数学意义和适用条件。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1513.7,"text":"So it's got a lot of the things you would like on it. It's also correct. If you go an array of matrices, we already saw that. That's actually how we prove concavity. This thing looks exactly like a logarithm. So that's it. And here, the so-called degree is n. And for a second-order cone, you get something that looks like this. It's not totally obvious that that's concave, but it is. Actually, I don't think it's that hard to show."},{"start":1543.76,"text":"The only one that would be tricky would be this part. So, okay. Sorry, the others. All right. So there's a bunch of properties. If you have a generalized logarithm, you can figure out like what happens, right? One is that the gradient is non-negative in the dual cone. If you have y transpose times the gradient of the logarithm, you just get theta. It's just a constant. And, you know, so for a non-negative orphan, if you want to check,"},{"start":1574.94,"text":"that the gradient is going to be this. I guess you've seen that, right? And then if you take y transpose times this gradient, you just get n because you take y times 1 over y and so on, y1 times 1 over y1 and so on. So you just get this. Okay, and for positive semi-definite cone, it's actually super interesting. The gradient of the log determinant is the inverse matrix, right? You have to interpret that super carefully."},{"start":1600.68,"text":"That's what it is. That's inverse. And the inner product between two symmetric matrices is the trace of the product, right? Because that's actually the inner product. It's the sum of the products of the corresponding entries, right? And so that, of course, is n because trace of y times y inverse is the trace of i, which is n. Okay? So these things work. Second order cone, you know, same story if you work out what this is. Okay. So, all right. So that's your..."},{"start":1629.75,"text":"That's this property of the logarithmic, of the generalized logarithm. Armed with that, we can actually define a logarithmic barrier. So the log barrier is going to be this. I have a bunch of cone inequalities, but they are, sorry, I have a bunch of inequalities, but they're respect to some cone here, like your k1 and up to k sub m, right? So we form this thing. That's going to be the log barrier. And this is exactly like..."},{"start":1655.82,"text":"in the case when the inequalities were scalars. It's identical, right? Or at least the form is identical, right? It's a bit more complicated, right? These are vectors now."}],"speech_gaps":[],"frame":"../frames/v017/010.webp","frame_time":1525.7},{"title":"凸优化中的中心路径与障碍函数","segments":[{"id":88,"text":"And this thing is convex. It's twice continuously differentiable. And this allows us to talk about a central path. But now we can talk about things like the central path for a semi-definite program or a second-order cone program. And it's actually identical, right? x star of t is the minimum of this thing. And the only difference is we have generalized phi to handle generalized inequalities for the constraints. So the barrier has just changed. That's the only thing that ever changed.","zh":"这个函数是凸的。它是二阶连续可微的。这使我们能够谈论中心路径。现在我们可以谈论像半正定规划或二阶锥规划的中心路径这样的问题。实际上，它是完全一样的，对吧？x星t是这个函数的最小值。唯一的不同是我们将phi推广以处理约束中的广义不等式。因此，障碍函数只是发生了变化。这就是唯一发生变化的地方。","start":1667.59,"end":1695.52},{"id":89,"text":"Make sense? So, okay. Everything else is going to work, right? If you minimize the function t times the function plus a barrier, then you will get this thing called x star of t. That's a point on the central path associated with the parameter value t. And if you work out the optimality condition, it just looks like this.","zh":"明白了吗？所以，好吧。其他一切都会正常工作，对吧？如果你最小化函数t乘以函数加上障碍函数，那么你会得到一个称为x星t的点。这是与参数值t相关的中心路径上的一个点。如果你推导出最优性条件，它看起来就如下面这样。","start":1696.61,"end":1721.19},{"id":90,"text":"And when you work this out, it's identical. It says that if this holds, then it turns out XRT also minimizes the Lagrangian with this particular choice of lambda I of T and nu of T. And if you look back at what it was for the scalar case, it's just exactly the same. It's the same. Okay. And we know that this is going to be non-negative in the dual.","zh":"当你推导出这个条件时，它也是完全一样的。它表示如果这个条件成立，那么XRT也会在特定的lambda I of T和nu of T选择下最小化拉格朗日函数。如果你回顾一下标量情况下的情况，它就是完全一样的。它是一样的。好的。我们知道这在对偶问题中将是非负的。","start":1721.77,"end":1748.65},{"id":91,"text":"norm, right? And then it turns out the gap is the same. This used to be, you can think about this for the types of things, if you had, if the constraints do not involve generalized or vector inequalities, each of these is one, right? And so this term is just m over t. That's the term we were just looking at. It's the m over t from over there. But now instead of m, you replace m, not the number of constraints, but actually the sum of the degree, the total sum of degrees, right?","zh":"范数，对吧？然后你会发现差距是相同的。这可以这样思考，如果你的约束不涉及广义或向量不等式，每个这样的项都是1，对吧？因此，这个项就是m除以t。这是我们刚刚看到的项。它是从那边来的m除以t。但现在，我们不是用m，而是用约束的总数，即度数的总和，对吧？","start":1749.42,"end":1777.43},{"id":92,"text":"which is actually kind of not obvious, right? Because if I give you a single semi-definite constraint with a 10 by 10 matrix, how many, you know, and I ask you how many constraints is that? It's not clear. It's a single vector constraint, right, where it's a positive semi-definite matrix. Or you could say, well, it's like n, n plus 1 over 2 constraints because that's the number of scalars in a symmetric 10 by 10 matrix, right?","zh":"这实际上并不明显，对吧？如果我给你一个10乘10的矩阵的单个半正定约束，你如何知道有多少个约束？这并不清楚。它是一个单一的向量约束，对吧？其中它是一个半正定矩阵。或者你可以说，这相当于n，n加1除以2个约束，因为这是对称10乘10矩阵中的标量数量，对吧？","start":1777.87,"end":1801.93},{"id":93,"text":"But 55 is not right either, because I think that's what you'd get. And what this says is, for this purposes, it's 10. It acts as if a semi-definite inequality with a 10 by 10 matrix is roughly equivalent to 10 scalar inequalities. That's what this is saying here. OK. So now you get cool stuff. You get semi-definite programming.","zh":"但是55也不对，因为我想这就是你得到的结果。而这里说的是，对于这个目的来说，它等于10。它似乎将一个10乘10的半正定不等式等价于10个标量不等式。这就是这里所表达的意思。好的。现在你就能得到一些有趣的东西。你就能得到半正定规划。","start":1802.49,"end":1827.9}],"notes":["本段讲解了凸优化中中心路径的概念，以及障碍函数在半定规划和二阶锥规划中的应用。中心路径是通过在目标函数中加入障碍函数来定义的，其核心思想是通过调整参数t来逼近原始问题的最优解。障碍函数的引入使得我们可以处理广义不等式约束，而不仅仅是标量不等式。","在处理中心路径时，需要考虑优化条件，即通过求解拉格朗日函数的最优条件来确定中心路径上的点。对于标量情况，这一条件与半定规划和二阶锥规划中的情况是相同的，这表明了中心路径的通用性。","在计算中心路径上的点时，需要考虑约束条件的类型。如果约束不涉及广义不等式，那么每个约束对应一个标量不等式，此时间隙项为m/t，其中m是约束的数量。然而，当约束是半定不等式时，需要计算矩阵的总度数，而不是直接使用约束的数量。","对于半定不等式约束，例如一个10x10的正定矩阵，其对应的约束数量并不是显而易见的。虽然可以将其视为n(n+1)/2个标量约束，但实际应用中，通常将其视为等效于10个标量约束。这种等效性使得半定规划在处理大规模问题时更加高效。","通过这种等效性，我们可以将半定规划视为一种特殊的凸优化问题，从而利用现有的凸优化理论和算法进行求解。这种转换不仅简化了问题的处理，还为实际应用提供了更大的灵活性。","本段强调了中心路径和障碍函数在处理广义不等式约束时的重要性，以及如何通过调整参数t来逼近最优解。这些概念为后续的半定规划和二阶锥规划提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1667.59,"end":1827.9,"asr_flags":[],"math_clarifications":["所有公式均重复且未提供具体数学内容，无法核对","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1667.59,"text":"And this thing is convex. It's twice continuously differentiable. And this allows us to talk about a central path. But now we can talk about things like the central path for a semi-definite program or a second-order cone program. And it's actually identical, right? x star of t is the minimum of this thing. And the only difference is we have generalized phi to handle generalized inequalities for the constraints. So the barrier has just changed. That's the only thing that ever changed."},{"start":1696.61,"text":"Make sense? So, okay. Everything else is going to work, right? If you minimize the function t times the function plus a barrier, then you will get this thing called x star of t. That's a point on the central path associated with the parameter value t. And if you work out the optimality condition, it just looks like this."},{"start":1721.77,"text":"And when you work this out, it's identical. It says that if this holds, then it turns out XRT also minimizes the Lagrangian with this particular choice of lambda I of T and nu of T. And if you look back at what it was for the scalar case, it's just exactly the same. It's the same. Okay. And we know that this is going to be non-negative in the dual."},{"start":1749.42,"text":"norm, right? And then it turns out the gap is the same. This used to be, you can think about this for the types of things, if you had, if the constraints do not involve generalized or vector inequalities, each of these is one, right? And so this term is just m over t. That's the term we were just looking at. It's the m over t from over there. But now instead of m, you replace m, not the number of constraints, but actually the sum of the degree, the total sum of degrees, right?"},{"start":1777.87,"text":"which is actually kind of not obvious, right? Because if I give you a single semi-definite constraint with a 10 by 10 matrix, how many, you know, and I ask you how many constraints is that? It's not clear. It's a single vector constraint, right, where it's a positive semi-definite matrix. Or you could say, well, it's like n, n plus 1 over 2 constraints because that's the number of scalars in a symmetric 10 by 10 matrix, right?"},{"start":1802.49,"text":"But 55 is not right either, because I think that's what you'd get. And what this says is, for this purposes, it's 10. It acts as if a semi-definite inequality with a 10 by 10 matrix is roughly equivalent to 10 scalar inequalities. That's what this is saying here. OK. So now you get cool stuff. You get semi-definite programming."}],"speech_gaps":[],"frame":"../frames/v017/011.webp","frame_time":1679.59},{"title":"对数障碍函数与半定规划的对偶性","segments":[{"id":94,"text":"You know, you work out what the log barrier is. You work out what it is on the central path. It's this. You get dual points is this thing. And this is the dual of this semi-definite program. And the duality gap is exactly P over T. P is equal to the size of these matrices, right? Because that's the degree of the logarithm on the positive definite cone. Okay.","zh":"你知道吗，你得算出对数障碍函数是什么。你得算出它在中心路径上的形式。这就是。你得到的对偶点就是这个东西。而这就是这个半定规划的对偶。对偶间隙正好是 P 除以 T。P 等于这些矩阵的大小，对吧？因为这就是在正定锥上对数的次数。好的。","start":1829.97,"end":1858.26},{"id":95,"text":"Well, now you have the barrier method. Here it is. You look at it for a minute, and here's what you'll find out. Nothing changed, at least in form. Nothing changed. Oh, the only thing was you had to replace m. This used to be m, and now it's the sum of the theta i's over t, right? So in something like Julia, it would mean that your code from before would actually probably just work, literally just work.","zh":"现在你有了障碍方法。这里就是。你花一分钟看看，你会发现什么。至少在形式上没有变化。没有变化。哦，唯一的变化是你需要替换 m。这以前是 m，现在变成了 theta i 的和除以 t，对吧？所以在像 Julia 这样的语言中，你之前的代码实际上可能只是直接就能工作，字面意义上直接就能工作。","start":1859.5,"end":1884.77},{"id":96,"text":"I mean, you go back and you have to make sure that a logarithm is defined correctly and all that, but it would just work. And you can see it's just exactly the same. And you get the same, the complexity analysis just applies like just immediately. It just works. Except wherever I said m over here, you replace it with some theta i. Okay, so this is pretty cool.","zh":"我的意思是，你回去后必须确保对数被正确地定义，等等，但它只是直接就能工作。你可以看到它完全一样。你得到的复杂度分析也立即适用。它只是直接就能工作。除了我在这里说的 m，你需要把它替换成某个 theta i。好的，这真的很酷。","start":1885.24,"end":1907.9},{"id":97,"text":"And, I mean, maybe more important, at least certainly more important to me, is that it actually works super well in practice. So what's kind of crazy is if you look at these things, they look exactly like the ones we saw before for linear programs, quadratic programs, geometric programs. They look kind of the same, right? That, you know, everything's over in somewhere between 20 and 50 steps if you choose mu reasonably.","zh":"而且，我的意思是，也许更重要的是，至少对我来说，它在实践中实际表现得非常好。所以有点疯狂的是，如果你看看这些，它们看起来和我们之前在解决线性规划、二次规划、几何规划时看到的完全一样。它们看起来有点相似，对吧？你知道，如果你合理地选择 mu，所有事情都在 20 到 50 步之间完成。","start":1908.8,"end":1935.22},{"id":98,"text":"You see all sorts of stuff. I mean, you couldn't tell any difference between these. These look exactly like they did for solving an LP, right? So it's just the same. And the fancier methods, I'll talk about them briefly, but they would come in between 20 and 50 just always. That's how that works, right?","zh":"你会看到各种各样的东西。我的意思是，你无法分辨这些和之前解决线性规划时的有什么不同。这些看起来和之前一模一样，对吧？所以它就是一样的。更高级的方法，我会简要地谈谈，但它们总是会在 20 到 50 步之间。这就是它的运作方式，对吧？","start":1936.4,"end":1960.3},{"id":99,"text":"By the way, this is pretty cool because I started using semi-definite programming for problems in control actually before the advent of these methods. And we used very complicated methods that would take 10 minutes to solve a semi-definite program with a handful of matrix inequalities that were like 10 by 10. And we were happy. And we liked the results.","zh":"顺便说一下，这真的很酷，因为我在这些方法出现之前就开始用半定规划来解决控制领域的问题了。当时我们使用的是非常复杂的方法，解决一个包含少量10x10矩阵不等式的半定规划问题需要10分钟，而我们对此感到很满意，并且喜欢得到的结果。","start":1961.48,"end":1984.96},{"id":100,"text":"absolutely no idea that within a couple of years there would be methods there would be methods that would be 20x shorter the code and be 100x or 1000x faster just did not like it was a anyway people now they just don't they don't they don't care as a matter of fact most people don't even care how these things are solved they just call a solve you know a solver","zh":"当时完全没想到，在几年内会出现方法，这些方法代码会短20倍，速度会快100倍甚至1000倍。现在人们根本不关心这些事情，事实上，大多数人甚至不关心这些问题是如何被解决的，他们只是调用一个求解器。","start":1986.73,"end":2008.0}],"notes":["本段讲解了对数障碍函数在中心路径上的应用，以及它如何与半定规划的对偶性相关联。讲者指出，对偶间隙等于P除以T，其中P是矩阵的大小，这与正定锥上的对数次数有关。","讲者介绍了障碍方法，强调了其与原始方法在形式上的相似性，但需要将m替换为theta_i的总和。这使得代码在某些语言如Julia中可以直接使用，无需重大修改。","讲者提到，尽管需要确保对数的定义正确，但障碍方法在实践中表现良好，与线性规划、二次规划和几何规划的求解过程相似，通常在20到50步内完成。","讲者指出，即使使用更复杂的求解方法，求解时间仍然在20到50步之间，这表明障碍方法在实际应用中非常高效。","讲者回顾了自己在控制问题中使用半定规划的历史，指出早期方法需要较长时间，而现代方法在速度和效率上有了显著提升。","最后，讲者提到现代求解器的普及使得人们不再关心具体的求解过程，只需调用求解器即可。"],"formulas":[],"uncertainties":["absolutely no idea that within a couple of years there would be methods there would be methods that would be 20x shorter the code and be 100x or 1000x faster just did not like it was a anyway people now they just don't they don't they don't care as a matter of fact most people don't even care how these things are solved they just call a solve you know a solver"],"diagram":"none","start":1829.97,"end":2008.0,"asr_flags":[],"math_clarifications":["对偶间隙和P的定义缺乏明确的数学公式和上下文支持，无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1829.97,"text":"You know, you work out what the log barrier is. You work out what it is on the central path. It's this. You get dual points is this thing. And this is the dual of this semi-definite program. And the duality gap is exactly P over T. P is equal to the size of these matrices, right? Because that's the degree of the logarithm on the positive definite cone. Okay."},{"start":1859.5,"text":"Well, now you have the barrier method. Here it is. You look at it for a minute, and here's what you'll find out. Nothing changed, at least in form. Nothing changed. Oh, the only thing was you had to replace m. This used to be m, and now it's the sum of the theta i's over t, right? So in something like Julia, it would mean that your code from before would actually probably just work, literally just work."},{"start":1885.24,"text":"I mean, you go back and you have to make sure that a logarithm is defined correctly and all that, but it would just work. And you can see it's just exactly the same. And you get the same, the complexity analysis just applies like just immediately. It just works. Except wherever I said m over here, you replace it with some theta i. Okay, so this is pretty cool."},{"start":1908.8,"text":"And, I mean, maybe more important, at least certainly more important to me, is that it actually works super well in practice. So what's kind of crazy is if you look at these things, they look exactly like the ones we saw before for linear programs, quadratic programs, geometric programs. They look kind of the same, right? That, you know, everything's over in somewhere between 20 and 50 steps if you choose mu reasonably."},{"start":1936.4,"text":"You see all sorts of stuff. I mean, you couldn't tell any difference between these. These look exactly like they did for solving an LP, right? So it's just the same. And the fancier methods, I'll talk about them briefly, but they would come in between 20 and 50 just always. That's how that works, right?"},{"start":1961.48,"text":"By the way, this is pretty cool because I started using semi-definite programming for problems in control actually before the advent of these methods. And we used very complicated methods that would take 10 minutes to solve a semi-definite program with a handful of matrix inequalities that were like 10 by 10. And we were happy. And we liked the results."},{"start":1986.73,"text":"absolutely no idea that within a couple of years there would be methods there would be methods that would be 20x shorter the code and be 100x or 1000x faster just did not like it was a anyway people now they just don't they don't they don't care as a matter of fact most people don't even care how these things are solved they just call a solve you know a solver"}],"speech_gaps":[],"frame":"../frames/v017/012.webp","frame_time":1841.97},{"title":"凸优化中的内点法与求解器实现","segments":[{"id":101,"text":"Or for that matter, a higher level of ignorance, which is totally cool and fine, is you just use CVXPy and call the solve method, and you have absolutely no idea what's being done on your behalf at the far end, which is just fine. That's the way it's supposed to be, right? So, okay. So this shows you that this kind of works. There's like just the same story. This takes between 20 and 50 steps. Okay.","zh":"或者，更高层次的无知，也就是完全没问题的，就是你直接使用CVXPy并调用solve方法，而你完全不知道在后台到底发生了什么，这也没关系。这本来就是应该这样，对吧？所以，好的。这表明这种方法大致可行。故事也是一样的。这需要大约20到50步。好的。","start":2008.71,"end":2034.13},{"id":102,"text":"So I do want to mention something, which is that the barrier method is just sort of a simple first cut. I think yours is probably going to come in at around 50 lines order magnitude. If you put a bunch of comments in there, it might be 70 or something. If you were to double that length, you could actually get something that would actually be competitive. So if you went to 100 lines or something like that.","zh":"我想提一下，障碍方法只是简单的一个初步尝试。你写的可能大概在50行的数量级。如果你在里面加很多注释，可能会达到70行左右。如果你将长度翻倍，你实际上可以得到一个具有竞争力的实现。所以如果你达到100行左右的话。","start":2035.82,"end":2062.06},{"id":103,"text":"People don't really use the barrier method that you've put together, but what is used, for example, in ECOS or in any of these things and all these commercial tools as well, what are used are what are called primal dual interior point methods. I'll just say a little bit about them, just so you know what they are. So they actually update the primal dual variables at each iteration, and you don't have the distinction between inner and, you don't have inner, you're not going all the way back to the central path.","zh":"人们并不真正使用你所编写的障碍方法，但例如在ECOS或这些工具以及所有商业工具中所使用的，是所谓的对偶内点方法。我只简单说一点，让你知道它们是什么。它们实际上在每次迭代中更新原始对偶变量，你不需要区分内部和中心路径，你不会回到中心路径。","start":2063.73,"end":2092.83},{"id":104,"text":"Right. What you'll find out is if you actually look at some of these codes, you will find out that you're still solving a KKT system at every step. So that part is exactly the same. And let's see, I should say that they do use something like what you're using because your centering method.","zh":"对了，你会发现如果你实际查看一些这些代码，你仍然在每一步解决一个KKT系统。这部分完全一样。让我补充一下，它们确实使用了类似你所使用的方法，因为你的中心化方法。","start":2093.46,"end":2114.44},{"id":105,"text":"is actually an infeasible start. These also use infeasible start. They use something called the primal dual homogeneous embedding. We're not going to talk about it, but it's actually very cool. It's actually a Stanford development. It's from NUEA, right? Maybe 20 years ago. It is now used for all solvers, commercial, non-commercial, everywhere. That is what's used. And what it does is it actually solves the primal and the dual simultaneously.","zh":"实际上这是一种不可行初始点方法。这些方法也使用不可行初始点。它们使用一种称为原始对偶同质嵌入的方法。我们不会深入讨论它，但它实际上非常酷。这是斯坦福大学的成果，来自NUEA，大概20年前。现在它被所有求解器，无论是商业的还是非商业的，都广泛使用。这就是被使用的。它所做的就是同时求解原始问题和对偶问题。","start":2115.03,"end":2142.83},{"id":106,"text":"It handles things like infeasibility and it handles unboundedness. Just by solving one problem, you look at two scalar variables. From them, you figure out if one is one or something like that. If one is positive, it means you found a primal dual solution. If the other is positive, it means it's either unbounded or, you know, and it will actually get the certificate. It'll either give you a ray that...","zh":"它处理诸如不可行性以及无界性等问题。只需解决一个问题，你就会观察两个标量变量。通过它们，你可以判断其中一个是否为1或类似的情况。如果其中一个为正，则意味着你找到了一个对偶解。如果另一个为正，则意味着可能是无界或，你懂的，它实际上会获得证明。它要么给你一个射线……","start":2143.85,"end":2168.51},{"id":107,"text":"establishes that it is unbounded below, or it'll give you a certificate showing that the original problem is infeasible. So that's what that is. I'm just saying this is if you're interested in this. I mean, it's not, you know, some small fraction of you might actually be if you ended up implementing something like this.","zh":"该射线将证明它是无下界的，或者它会给你一个证明，表明原始问题不可行。这就是它的作用。我只是说，如果你对此感兴趣的话。我的意思是，这并不是，你知道的，你中有一小部分人可能会真正实现这样的东西。","start":2169.2,"end":2187.46}],"notes":["本段主要讲解了凸优化中常用的内点法，特别是对偶内点法。与屏障方法不同，对偶内点法同时更新原始变量和对偶变量，并且不涉及中心路径的回溯。这种方法在实际求解器中被广泛应用，如ECOS和商业工具。","在对偶内点法中，每一步迭代仍然需要解KKT系统，这与屏障方法的中心化方法有相似之处。然而，对偶内点法使用了所谓的不可行起始点，这使得算法在处理不可行或无界问题时更加灵活。","对偶内点法中使用了一种称为原始对偶同质嵌入的方法，这是一种斯坦福大学的开发成果，已有20年的历史。该方法通过同时求解原始问题和对偶问题，能够处理不可行性和无界性问题。","通过解决一个单一的问题，该方法可以判断原始问题是否可行或无界。如果其中一个标量变量为正，则表示找到了原始对偶解；如果另一个为正，则表示问题可能是无界的，或者原始问题不可行，并且可以提供相应的证明。","虽然屏障方法在教学中被用来演示凸优化的基本思想，但在实际应用中，对偶内点法因其效率和鲁棒性而被广泛采用。这种方法在商业和非商业求解器中都有广泛应用。","本段还提到，虽然对偶内点法的实现可能较为复杂，但其在实际优化问题中的应用非常广泛，是当前凸优化求解器的核心技术之一。"],"formulas":[{"latex":"\\text{KKT}","symbols":"KKT条件","explanation":"KKT条件保持原样，无需修改，适用于优化问题的必要条件。","evidence":"Right. What you'll find out is if you actually look at some of these codes, you will find out that you're still solving a KKT system at every step. So that part is exactly the same. And let's see, I should say that they do use something like what you're using because your centering method."},{"latex":"\\text{primal dual}","symbols":"原始对偶","explanation":"原始对偶保持原样，无需修改，用于描述优化问题的原始和对偶变量。","evidence":"People don't really use the barrier method that you've put together, but what is used, for example, in ECOS or in any of these things and all these commercial tools as well, what are used are what are called primal dual interior point methods. I'll just say a little bit about them, just so you know what they are. So they actually update the primal dual variables at each iteration, and you don't have the distinction between inner and, you don't have inner, you're not going all the way back to the central path."},{"latex":"\\text{infeasible start}","symbols":"不可行起始点","explanation":"不可行起始点保持原样，无需修改，用于描述初始点不满足约束条件的情况。","evidence":"is actually an infeasible start. These also use infeasible start. They use something called the primal dual homogeneous embedding. We're not going to talk about it, but it's actually very cool. It's actually a Stanford development. It's from NUEA, right? Maybe 20 years ago. It is now used for all solvers, commercial, non-commercial, everywhere. That is what's used. And what it does is it actually solves the primal and the dual simultaneously."},{"latex":"\\text{primal dual homogeneous embedding}","symbols":"原始对偶同质嵌入","explanation":"原始对偶同质嵌入保持原样，无需修改，用于描述一种同时处理原始和对偶问题的嵌入方法。","evidence":"is actually an infeasible start. These also use infeasible start. They use something called the primal dual homogeneous embedding. We're not going to talk about it, but it's actually very cool. It's actually a Stanford development. It's from NUEA, right? Maybe 20 years ago. It is now used for all solvers, commercial, non-commercial, everywhere. That is what's used. And what it does is it actually solves the primal and the dual simultaneously."}],"uncertainties":["NUEA"],"diagram":"none","start":2008.71,"end":2187.46,"asr_flags":[],"math_clarifications":["所有公式均未发现数学错误，保持原样。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2008.71,"text":"Or for that matter, a higher level of ignorance, which is totally cool and fine, is you just use CVXPy and call the solve method, and you have absolutely no idea what's being done on your behalf at the far end, which is just fine. That's the way it's supposed to be, right? So, okay. So this shows you that this kind of works. There's like just the same story. This takes between 20 and 50 steps. Okay."},{"start":2035.82,"text":"So I do want to mention something, which is that the barrier method is just sort of a simple first cut. I think yours is probably going to come in at around 50 lines order magnitude. If you put a bunch of comments in there, it might be 70 or something. If you were to double that length, you could actually get something that would actually be competitive. So if you went to 100 lines or something like that."},{"start":2063.73,"text":"People don't really use the barrier method that you've put together, but what is used, for example, in ECOS or in any of these things and all these commercial tools as well, what are used are what are called primal dual interior point methods. I'll just say a little bit about them, just so you know what they are. So they actually update the primal dual variables at each iteration, and you don't have the distinction between inner and, you don't have inner, you're not going all the way back to the central path."},{"start":2093.46,"text":"Right. What you'll find out is if you actually look at some of these codes, you will find out that you're still solving a KKT system at every step. So that part is exactly the same. And let's see, I should say that they do use something like what you're using because your centering method."},{"start":2115.03,"text":"is actually an infeasible start. These also use infeasible start. They use something called the primal dual homogeneous embedding. We're not going to talk about it, but it's actually very cool. It's actually a Stanford development. It's from NUEA, right? Maybe 20 years ago. It is now used for all solvers, commercial, non-commercial, everywhere. That is what's used. And what it does is it actually solves the primal and the dual simultaneously."},{"start":2143.85,"text":"It handles things like infeasibility and it handles unboundedness. Just by solving one problem, you look at two scalar variables. From them, you figure out if one is one or something like that. If one is positive, it means you found a primal dual solution. If the other is positive, it means it's either unbounded or, you know, and it will actually get the certificate. It'll either give you a ray that..."},{"start":2169.2,"text":"establishes that it is unbounded below, or it'll give you a certificate showing that the original problem is infeasible. So that's what that is. I'm just saying this is if you're interested in this. I mean, it's not, you know, some small fraction of you might actually be if you ended up implementing something like this."}],"speech_gaps":[],"frame":"../frames/v017/013.webp","frame_time":2020.71},{"title":"凸优化方法的普及与实际应用","segments":[{"id":108,"text":"You might not. You might not. But I'm just saying, if you were to read the papers, everything else would be complete. You'd see everything. You'd see log barriers. You'd hear self-concordance. You'd look at the KKT systems that are being solved. You'd see we're going to do it by reduction or we're going to do it by just using a primal dual. Sorry.","zh":"你可能不会。你可能不会。但我想说的是，如果你去读论文，一切都会完整。你会看到一切。你会看到对数障碍法。你会听到自和谐性。你会看到正在被求解的KKT系统。你会看到我们会通过降维来做，或者直接使用原始对偶法。抱歉。","start":2188.24,"end":2209.16},{"id":109,"text":"an LDL transpose factorization. So you would be highly familiar. You are now ready to start reading. You could read all. I mean, I'm not recommending this, right? But at this point, you could look at any of these things. You could actually look at the codes and everything would be very, very familiar. So, okay. So I'll quit here on this. And let me just finish by saying, I mean, well, I don't know, unless maybe there's some questions about this or not. Okay.","zh":"LDL转置分解。所以你会非常熟悉。你现在已经准备好开始阅读了。你可以读所有内容。我是说，我并不是在推荐这样做，对吧？但到了这个阶段，你可以查看任何这些内容。你甚至可以查看代码，一切都会非常、非常熟悉。所以，好吧。那我就在这里结束吧。让我再补充一句，我是说，好吧，我不知道，除非有人对这个有疑问或者没有疑问。好的。","start":2210.28,"end":2242.77},{"id":110,"text":"Yeah, so I guess in the ensuing 30 years, basically, these methods have taken over. They're now the default commercial solvers. So all solvers basically kind of do this. There are some holdovers for linear programming. It's a little bit special, and so there's holdovers for that. But for everything else, it's just this. I mean, it's these primal dual interior point methods, right? Okay.","zh":"是的，所以我想在接下来的30年里，基本上这些方法已经占据了主导地位。它们现在是默认的商业求解器。所以所有求解器基本上都是这样做的。有一些线性规划的遗留方法，它有点特别，因此有一些遗留方法。但对于其他一切，就是这些方法。我是说，就是这些原始对偶内点法，对吧？好的。","start":2244.23,"end":2266.39},{"id":111,"text":"Let me finish by just saying one thing. The reason we just did the last two and a half weeks of the class and you are doing this homework was purely to demystify these methods, to show they're not as complicated as they might sound if you just jump in and start reading the papers or you start looking at codes.","zh":"让我再补充一句，我们刚刚用了这节课的最后两周时间，你们也做了这个作业，纯粹是为了揭开这些方法的神秘面纱，展示它们并不像听起来那么复杂，如果你直接跳入论文或查看代码的话。","start":2268.46,"end":2288.36},{"id":112,"text":"if they're open source, right? They're just not as complicated as they sound. And so it seems like a good thing to understand that actually an LP solver is not that complicated. Solving a small, you know, solving semidefinite program is not that complicated, right? It's also, I mean, whether or not you would have to actually do any of this, it depends what you do.","zh":"如果它们是开源的，对吧？它们并不像听起来那么复杂。因此，理解实际上一个线性规划求解器并不那么复杂似乎是个好主意。求解一个小的，你知道的，求解半正定规划并不那么复杂，对吧？它也是，我是说，你是否需要实际做这些，取决于你做什么。","start":2289.42,"end":2309.78},{"id":113,"text":"If you're actually involved in weird real-time or super large-scale implementations, real-time would be probably more closer to actually a realistic thing. Let's suppose you're flying a drone, and it turns out you need to solve a small semi-definite program, I don't know, 100 times a second. It's actually very difficult to take a commercial solver and embed it.","zh":"如果你真的参与了奇怪的实时或超大规模的实现，实时性可能更接近实际的情况。假设你正在飞无人机，结果你需要每秒解决一个小型的半正定规划问题，比如100次。实际上，将商用求解器嵌入到这种场景中是非常困难的。","start":2311.5,"end":2334.2},{"id":114,"text":"Because the commercial solver is going to do all sorts of crazy stuff like, well, for one thing, it's actually going to do things like actually ask to allocate memory, which doesn't work super well when you're in the air. And you have a 10 millisecond deadline. So anyway, I'm just saying.","zh":"因为商用求解器会做各种奇怪的事情，比如，首先，它实际上会请求分配内存，而当你在空中时，这种操作并不太好。而且你有一个10毫秒的截止时间。总之，我只是在说这些。","start":2334.66,"end":2352.24}],"notes":["本段主要讲解了凸优化方法在实际应用中的普及情况，指出这些方法已经成为商业求解器的默认选择。尽管对于线性规划有一些遗留的实现方式，但大多数情况下，这些方法都是通过原始对偶内点法实现的。","课程中强调了学习这些方法的重要性，是为了消除对它们的误解，表明它们并不像初看那样复杂。通过学习和实践，学生可以理解这些方法的实现过程，而不仅仅是阅读论文或查看代码。","讲者提到，虽然这些方法在理论上并不复杂，但在实际应用中，特别是在实时或大规模系统中，使用商业求解器可能会遇到挑战，例如内存分配和时间限制的问题。","讲者以无人机为例，说明在需要快速求解半定规划问题的场景下，商业求解器可能无法满足实时性要求，因此需要更高效的实现方式。","本段还指出，是否需要实际实现这些方法取决于具体的应用场景，对于某些特定领域，如实时系统，可能需要更定制化的解决方案。","最后，讲者强调了理解这些方法的实际意义，特别是在工程和实际应用中的重要性，而不仅仅是理论上的掌握。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2188.24,"end":2352.24,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2188.24,"text":"You might not. You might not. But I'm just saying, if you were to read the papers, everything else would be complete. You'd see everything. You'd see log barriers. You'd hear self-concordance. You'd look at the KKT systems that are being solved. You'd see we're going to do it by reduction or we're going to do it by just using a primal dual. Sorry."},{"start":2210.28,"text":"an LDL transpose factorization. So you would be highly familiar. You are now ready to start reading. You could read all. I mean, I'm not recommending this, right? But at this point, you could look at any of these things. You could actually look at the codes and everything would be very, very familiar. So, okay. So I'll quit here on this. And let me just finish by saying, I mean, well, I don't know, unless maybe there's some questions about this or not. Okay."},{"start":2244.23,"text":"Yeah, so I guess in the ensuing 30 years, basically, these methods have taken over. They're now the default commercial solvers. So all solvers basically kind of do this. There are some holdovers for linear programming. It's a little bit special, and so there's holdovers for that. But for everything else, it's just this. I mean, it's these primal dual interior point methods, right? Okay."},{"start":2268.46,"text":"Let me finish by just saying one thing. The reason we just did the last two and a half weeks of the class and you are doing this homework was purely to demystify these methods, to show they're not as complicated as they might sound if you just jump in and start reading the papers or you start looking at codes."},{"start":2289.42,"text":"if they're open source, right? They're just not as complicated as they sound. And so it seems like a good thing to understand that actually an LP solver is not that complicated. Solving a small, you know, solving semidefinite program is not that complicated, right? It's also, I mean, whether or not you would have to actually do any of this, it depends what you do."},{"start":2311.5,"text":"If you're actually involved in weird real-time or super large-scale implementations, real-time would be probably more closer to actually a realistic thing. Let's suppose you're flying a drone, and it turns out you need to solve a small semi-definite program, I don't know, 100 times a second. It's actually very difficult to take a commercial solver and embed it."},{"start":2334.66,"text":"Because the commercial solver is going to do all sorts of crazy stuff like, well, for one thing, it's actually going to do things like actually ask to allocate memory, which doesn't work super well when you're in the air. And you have a 10 millisecond deadline. So anyway, I'm just saying."}],"speech_gaps":[],"frame":"../frames/v017/014.webp","frame_time":2200.24},{"title":"凸优化课程中关于求解器与算法的讲解","segments":[{"id":115,"text":"If you end up at a high frequency trading firm or something like that, and you're going to implement a tiny QP or LP solver that should solve in like 50 microseconds, now you know that you can do it and it's not a big deal. So that was the sole reason to do this part of the course, but I think it's actually kind of important. Okay. Any questions about it? It's kind of cool. So actually now the whole stack is demystified for you.","zh":"如果你最终进入高频交易公司或者其他类似的地方，并且你要实现一个非常小的QP或LP求解器，它应该能在大约50微秒内求解，现在你知道这是可以做到的，而且并不是什么大不了的事。因此，这就是我们做这门课程这一部分的唯一原因，但我认为实际上这还是很重要的。好的。对此有任何问题吗？这还挺酷的。所以实际上现在你已经对整个技术栈有了更深入的理解。","start":2352.81,"end":2378.89},{"id":116,"text":"Because here's what it does. When you type in CVX pi, CVX pi does, forms a sequence of equivalent problems. It starts with your problem. It does a reduction, makes it a completely equivalent problem with a retrieval method, right? Then reduces it again and again, maybe 12, 15, 20 reductions later, it looks up and it says, I have a form that one of my solvers can solve. Everybody following this? Then,","zh":"因为这就是它所做的。当你输入CVX pi时，CVX pi会生成一系列等价的问题。它从你的原始问题开始，进行一次转换，将其转换为一个完全等价的问题，并使用检索方法，对吧？然后它会再次进行转换，可能经过12、15、20次转换后，它会查看并说：我找到了一种可以被我的求解器解决的形式。大家都能跟上吗？然后，","start":2379.41,"end":2408.25},{"id":117,"text":"It passes it off to the solver. They are not all interior point methods. SCS, for example, is not. OSQP is not. But many others are. So ECOS, Claribel, commercial ones are almost entirely. In fact, I guess almost entirely. They are barrier and interior point methods, right? And now you know at least a little bit of the details of those. If you go down, drill down deeper.","zh":"它会将问题交给求解器。并不是所有的求解器都是内点法。例如，SCS就不是，OSQP也不是。但许多其他的求解器是。例如ECOS、Claribel以及商业求解器几乎全部都是。事实上，我猜几乎全部都是。它们都是障碍法和内点法，对吧？现在你至少对这些方法的细节有一些了解了。如果你继续深入下去，进一步探究。","start":2408.83,"end":2435.65},{"id":118,"text":"What you know is if you profile one of these things, it is only doing the following. Linear algebra. Absolutely nothing else. The linear algebra it's doing is actually mostly just exploiting sparsity. And that's it. So now, in a weird way, you kind of know everything. At least the full stack from what happens when you type in my prob dot solve.","zh":"你所知道的是，如果你对这些求解器进行性能分析，它所做的就只有以下几件事。线性代数运算。除此之外别无他事。它所进行的线性代数运算实际上主要是利用稀疏性。就是这样。因此，现在以一种奇怪的方式，你似乎已经了解了一切。至少，你知道当你输入my prob dot solve时，整个技术栈发生了什么。","start":2436.25,"end":2460.91},{"id":119,"text":"And now you kind of know. So, yeah. Is there a difference between saying interior point methods or barrier methods? Yeah, let's see. No, not really. So barrier method, I think, is kind of an older term. I kind of like it because it's kind of a cool retro term. Yeah, it's usually pretty much the same. So, yeah. So interior point, I think, is what most people would call it these days. So, yeah, I mean.","zh":"现在你已经了解了。所以，是的。说内点法和障碍法之间有区别吗？是的，让我们看看。不，其实差别不大。我认为障碍法是一个比较旧的术语。我挺喜欢这个术语的，因为它有点酷，有点复古的感觉。是的，它通常和内点法几乎是一样的。所以，是的。我认为现在大多数人会称之为内点法。所以，是的，我的意思是。","start":2461.52,"end":2489.74},{"id":120,"text":"It's still, you have to admit, it's pretty stunning that you can solve an LP with like 10,000 variables and 5,000 constraints, you know, in 20 iterations. And that's to like extremely high precision, right? That's very weird, right? Because basically you want to find a particular vertex in this polyhedron.","zh":"你必须承认，能够用大约20次迭代解决一个拥有10,000个变量和5,000个约束的线性规划问题，而且达到极高的精度，这还是很令人惊叹的。这很奇怪，对吧？因为基本上你想要在这个多面体中找到一个特定的顶点。","start":2490.58,"end":2511.
