</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">15 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 15 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v015.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v015","title":"15 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 15","course":"凸优化","pages":[{"title":"自协调性与牛顿法收敛性分析","segments":[{"id":0,"text":"So let me, I just wanted to quickly review self-concordance just to make sure that the whole thing at a high level is clear. The basic idea is to make an analysis of convergence of Newton's method that is, like Newton's method, independent of affine changes of coordinates, right? So that's, and this is to correct this embarrassment that the...","zh":"所以让我，我只是想快速回顾一下自协调性，以确保整体上概念是清晰的。基本的想法是进行牛顿法收敛性的分析，就像牛顿法本身一样，与仿射坐标变换无关，对吧？这就是，而且这是为了纠正这种尴尬的情况，即……","start":5.01,"end":30.04},{"id":1,"text":"that the actual algorithm and the implementation is actually more sophisticated than the, well, was more sophisticated than the existing mathematical analyses of convergence, right? So, and what you'll recall last time is that it all comes down to this. As you know, the analysis of Newton's method comes down to how big is the third derivative? Because that's what it depends on. Third derivative is zero.","zh":"实际的算法和实现实际上比现有的收敛性数学分析更为复杂，对吧？所以，正如你们上次回忆的那样，一切最终都归结为这一点。你们知道，牛顿法的分析最终归结为第三导数有多大，因为这取决于它。第三导数为零。","start":30.46,"end":56.34},{"id":2,"text":"then Newton's method converges in one step, right? If it's small, that's what tells you it's going to work pretty well or something like that. It basically says how fast does the Hessian change as you move around, right? That's what it is. Okay, the classical analysis just uses that. It uses the most obvious measure of the size of the third derivative. If it was on for n equals 1, it would just be f prime prime prime absolute value.","zh":"那么牛顿法在一步内就会收敛，对吧？如果它很小，这就告诉你它会工作得很好，或者类似的情况。它基本上说明了当我们在空间中移动时，Hessian矩阵变化有多快，对吧？这就是它的含义。好的，经典分析只是使用了这一点。它使用了第三导数大小的最直观的度量。如果是在n等于1的情况下，它就只是三阶导数的绝对值。","start":58.05,"end":84.23},{"id":3,"text":"which is like if someone walks up to the street and says, give me a measure of the size of the third derivative, that should be the first thing you say. Minor problem with that is that that is not independent. That is not independent of changes of coordinates. And so if you're given the homework exercise of...","zh":"这就像有人走到街上说，给我一个第三导数大小的度量，你首先应该说的就是这个。这个度量的微小问题在于，它并不独立于坐标变换。因此，如果你被布置了一个作业题……","start":84.65,"end":100.49},{"id":4,"text":"figure out a way to say that the third derivative is small, that will be independent of an affine change of coordinates. In other words, when you do this, it's going to lead you to basically comparing the absolute value of the third derivative to the three-halves power of the second derivative, like period. And you could put another number for two there, you could divide it and call it something else, whatever you like, but this is...","zh":"找出一种方法来说明第三导数很小，这种说法应该与仿射坐标变换无关。换句话说，当你这样做时，它将引导你基本上将第三导数的绝对值与二阶导数的三分之三次方进行比较，就像这样。你也可以在那个位置放另一个数字，你可以除以它并称它为其他东西，无论你喜欢什么，但这就是……","start":100.84,"end":127.72},{"id":5,"text":"From that point of view, otherwise this looks like entirely mysterious, like where did that come from? But that's all it is, right? What happens when you adopt this way to say that the Hessian varies smoothly or not much is weird stuff happens. So a lot of functions that we actually work with actually satisfy this property, this so-called self-concordant property, right?","zh":"从这个角度来看，否则这看起来完全神秘，就像这是从哪里来的？但其实它就是这么简单。当你采用这种方式来说明Hessian矩阵平滑变化或变化不大时，会发生一些奇怪的事情。实际上，我们经常处理的很多函数都满足这个性质，也就是所谓的自协调性质，对吧？","start":128.14,"end":157.28},{"id":6,"text":"And I'm not going to go into this, and you can actually look into how you would show this. Not all convex functions, in fact, not all convex functions that we are interested in are self-concordant, but a whole lot are. When you repeat the analysis, an amazing thing comes out. Basically, what comes out is something that I am unable to make fun of.","zh":"我不会深入讲解这一点，你也可以实际看看如何证明这一点。事实上，并不是所有的凸函数，甚至不是我们感兴趣的所有的凸函数都是自协调的，但有很多都是。当你重复分析时，会得出一个令人惊讶的结果。基本上，得出的结果是我无法嘲笑的。","start":159.61,"end":182.05}],"notes":["本段主要讲解自协调性（self-concordance）的概念及其在牛顿法收敛性分析中的作用。自协调性是一种用于衡量函数的性质，使得牛顿法的收敛性分析可以独立于仿射坐标变换。这解决了传统分析中对坐标变换依赖的问题。","牛顿法的收敛性分析依赖于三阶导数的大小，因为三阶导数决定了Hessian矩阵的变化速度。当三阶导数为零时，牛顿法在一步内收敛。三阶导数的大小反映了Hessian矩阵的变化率，这在分析中是一个关键因素。","传统方法中，三阶导数的绝对值被用作衡量其大小的标准，但这种方法依赖于坐标变换。因此，需要找到一种独立于仿射变换的衡量方式，即通过将三阶导数与二阶导数的3/2次方进行比较。","自协调性是一种重要的性质，许多实际工作中使用的函数满足这一性质。这使得牛顿法的收敛性分析更加稳健，不依赖于具体的坐标系。","并非所有凸函数都是自协调的，但很多我们感兴趣的凸函数满足这一性质。当重复分析时，会发现一些令人惊讶的结果，这些结果与自协调性密切相关。","自协调性使得牛顿法的收敛性分析更加通用，适用于不同的坐标系。这在优化问题中具有重要的实际意义，因为它允许我们使用更灵活的分析方法。"],"formulas":[{"latex":"\\frac{\\left|f^{\\prime \\prime \\prime}(x)\\right|}{\\left|f^{\\prime \\prime}(x)\\right|^{3/2}}","symbols":"三阶导数与二阶导数的3/2次方的比值","explanation":"原始片段中提到的三阶导数与二阶导数的3/2次方的比值在数学上是合理的，且符合自洽性条件，因此保留。","evidence":"that the actual algorithm and the implementation is actually more sophisticated than the, well, was more sophisticated than the existing mathematical analyses of convergence, right? So, and what you'll recall last time is that it all comes down to this. As you know, the analysis of Newton's method comes down to how big is the third derivative? Because that's what it depends on. Third derivative is zero. then Newton's method converges in one step, right? If it's small, that's what tells you it's going to work pretty well or something like that. It basically says how fast does the Hessian change as you move around, right? That's what it is. Okay, the classical analysis just uses that. It uses the most obvious measure of the size of the third derivative. If it was on for n equals 1, it would just be f prime prime prime absolute value. which is like if someone walks up to the street and says, give me a measure of the size of the third derivative, that should be the first thing you say. Minor problem with that is that that is not independent. That is not independent of changes of coordinates. And so if you're given the homework exercise of... figure out a way to say that the third derivative is small, that will be independent of an affine change of coordinates. In other words, when you do this, it's going to lead you to basically comparing the absolute value of the third derivative to the three-halves power of the second derivative, like period. And you could put another number for two there, you could divide it and call it something else, whatever you like, but this is... From that point of view, otherwise this looks like entirely mysterious, like where did that come from? But that's all it is, right? What happens when you adopt this way to say that the Hessian varies smoothly or not much is weird stuff happens. So a lot of functions that we actually work with actually satisfy this property, this so-called self-concordant property, right? And I'm not going to go into this, and you can actually look into how you would show this. Not all convex functions, in fact, not all convex functions that we are interested in are self-concordant, but a whole lot are. When you repeat the analysis, an amazing thing comes out. Basically, what comes out is something that I am unable to make fun of."}],"uncertainties":[],"diagram":"none","start":5.01,"end":182.05,"asr_flags":[],"math_clarifications":["原始片段中提到的三阶导数的绝对值和三阶导数与二阶导数的3/2次方的比值在数学上是合理的，但根据规则，不能将概率分布/密度等于其均值，因此需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.01,"text":"So let me, I just wanted to quickly review self-concordance just to make sure that the whole thing at a high level is clear. The basic idea is to make an analysis of convergence of Newton's method that is, like Newton's method, independent of affine changes of coordinates, right? So that's, and this is to correct this embarrassment that the..."},{"start":30.46,"text":"that the actual algorithm and the implementation is actually more sophisticated than the, well, was more sophisticated than the existing mathematical analyses of convergence, right? So, and what you'll recall last time is that it all comes down to this. As you know, the analysis of Newton's method comes down to how big is the third derivative? Because that's what it depends on. Third derivative is zero."},{"start":58.05,"text":"then Newton's method converges in one step, right? If it's small, that's what tells you it's going to work pretty well or something like that. It basically says how fast does the Hessian change as you move around, right? That's what it is. Okay, the classical analysis just uses that. It uses the most obvious measure of the size of the third derivative. If it was on for n equals 1, it would just be f prime prime prime absolute value."},{"start":84.65,"text":"which is like if someone walks up to the street and says, give me a measure of the size of the third derivative, that should be the first thing you say. Minor problem with that is that that is not independent. That is not independent of changes of coordinates. And so if you're given the homework exercise of..."},{"start":100.84,"text":"figure out a way to say that the third derivative is small, that will be independent of an affine change of coordinates. In other words, when you do this, it's going to lead you to basically comparing the absolute value of the third derivative to the three-halves power of the second derivative, like period. And you could put another number for two there, you could divide it and call it something else, whatever you like, but this is..."},{"start":128.14,"text":"From that point of view, otherwise this looks like entirely mysterious, like where did that come from? But that's all it is, right? What happens when you adopt this way to say that the Hessian varies smoothly or not much is weird stuff happens. So a lot of functions that we actually work with actually satisfy this property, this so-called self-concordant property, right?"},{"start":159.61,"text":"And I'm not going to go into this, and you can actually look into how you would show this. Not all convex functions, in fact, not all convex functions that we are interested in are self-concordant, but a whole lot are. When you repeat the analysis, an amazing thing comes out. Basically, what comes out is something that I am unable to make fun of."}],"speech_gaps":[],"frame":"../frames/v015/001.webp","frame_time":17.009999999999998},{"title":"收敛分析的对比与简化","segments":[{"id":7,"text":"Because the way I make fun of a typical convergence analysis is, here's my prototype convergence analysis. If, and then a long list of things that you could never possibly verify or know. Hold. Then, and then it gives a silly conclusion which is also weak and pathetic and doesn't really even say anything. So that's my model of what I see a convergence analysis looking like. This.","zh":"因为我嘲笑典型的收敛分析的方式是，这里是我的原型收敛分析。如果，然后是一长串你永远不可能验证或知道的事情。停。然后，它给出一个愚蠢的结论，这个结论也是弱的、可怜的，甚至什么都没说。这就是我看到的收敛分析的样子。这个。","start":182.61,"end":208.2},{"id":8,"text":"This I can't make fun of because it basically starts by, there's nothing unknown in the hypotheses, right? It's just if it's self-concordant, that's it. And we know for a whole bunch of functions that we actually care about, it is. And then there are parameters in the analysis. The analysis is very simple, right? It simply looks like this. It says, oh, and by the way, it's measured by lambda, which you'll remember is the gradient.","zh":"我不能嘲笑这个，因为它基本上从一开始就没有任何未知的假设，对吧？它只是如果它是自共轭的，那就完了。而且我们知道对于我们真正关心的一系列函数，它确实是这样的。然后分析中有一些参数。这个分析非常简单，对吧？它看起来就像这样。它说，哦，顺便提一下，它是用λ来衡量的，而你记得λ是梯度。","start":208.92,"end":234.12},{"id":9,"text":"times the Hessian inverse times the gradient, it's actually the square root of that or something, that is actually a measure of the gradient, which is independent of an affine change of coordinates, right? So if you have this beautiful algorithm and then the last thing you have in your code is a convergence thing that looks like norm of the gradient, congratulations, it's now dependent, weakly dependent on changes of coordinates, right? So, okay.","zh":"梯度乘以Hessian逆矩阵再乘以梯度，实际上是这个的平方根或类似的东西，这实际上是梯度的度量，它与仿射坐标变换无关，对吧？所以如果你有一个漂亮的算法，然后你在代码中的最后一步是收敛性检查，看起来像梯度的范数，恭喜你，它现在弱地依赖于坐标变换，对吧？所以，好吧。","start":234.76,"end":263.44},{"id":10,"text":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know.","zh":"它看起来是一样的。它基本上说，在一段时间内，你被保证函数值有γ的保证下降。一旦你小于这个临界值η对于λ，你实际上会得到二次收敛。缺失的是所有这些疯狂的东西，比如m和l，这些你通常不会知道。","start":264.23,"end":290.71},{"id":11,"text":"I mean, there would be isolated cases where I would know M and L, but mostly you would not. So then you get a complexity bound that looks like this, and what's amazing is that it's everything here you know. I mean, oh, one minor, we still have the embarrassment of P star here. We will talk about that. We'll see this. This will come up maybe next week in interior point methods. We'll take care of that.","zh":"我的意思是，会有孤立的情况，我会知道M和L，但大多数情况下你不会。因此你会得到一个复杂度界限，看起来像这样，令人惊讶的是，这里的所有东西你都知道。我的意思是，哦，有一点小问题，我们仍然有P星的尴尬之处。我们会谈到这一点。我们会看到这一点。这可能下周在内点法中出现。我们会处理这个问题。","start":291.31,"end":315.23},{"id":12,"text":"You can still make fun of it that way, but it's fine. Because if I replace P star with any lower bound on P star, then I still get an upper bound on the number of steps. Yeah, so that's the idea. Okay. Yeah, and if you work this out, this is a sloppy analysis that, you know, leaving an idea, you get something like 375 times the difference. So...","zh":"你仍然可以用这种方式开玩笑，但没关系。因为如果我把P星替换成P星的任何下界，我仍然能得到步骤数的上界。是的，这就是这个想法。好的。是的，如果你仔细推导一下，这其实是一个粗略的分析，你大概会得到一个类似375倍差异的结果。所以...","start":317.06,"end":342.7}],"notes":["本段讨论了收敛分析的两种不同风格。第一种是典型的收敛分析，它包含大量无法验证或已知的假设，并得出一个弱而无意义的结论。第二种分析则更加简洁，假设函数是自洽的，且已知许多实际关心的函数满足这一条件。这种分析中，参数如lambda（梯度）被用来衡量收敛性，但其依赖于坐标变换，因此可能不够鲁棒。","在第二种分析中，作者指出，当函数值的下降量小于某个临界值eta时，可以实现二次收敛。然而，这种分析忽略了像m和l这样的复杂参数，这些参数通常无法直接获得。尽管如此，这种分析仍然具有实用性，因为它基于已知的参数，如P star（最优值）。","作者提到，即使P star（最优值）仍然存在，但可以通过用P star的下界来替代，从而得到步骤数的上界。这表明，即使在某些情况下存在不确定性，这种分析仍然可以提供有用的上界。","作者还指出，这种分析虽然粗糙，但可以提供一个大致的步骤数估计，例如375倍的差异。这说明，尽管分析可能不够精确，但它仍然可以作为实际应用中的指导。","在讨论中，作者强调了收敛分析中参数选择的重要性，特别是lambda（梯度）和Hessian逆矩阵的乘积，这可以作为梯度的度量。然而，这种度量依赖于坐标变换，因此可能不够稳定。","最后，作者提到，这种分析虽然简单，但仍然可以用于实际应用，尤其是在内部点方法中，P star的问题可能会被进一步讨论和解决。"],"formulas":[{"latex":"\\|\\nabla f\\|","symbols":"梯度的范数","explanation":"梯度的范数是标准的数学表达，符合数学规范。","evidence":"times the Hessian inverse times the gradient, it's actually the square root of that or something, that is actually a measure of the gradient, which is independent of an affine change of coordinates, right? So if you have this beautiful algorithm and then the last thing you have in your code is a convergence thing that looks like norm of the gradient, congratulations, it's now dependent, weakly dependent on changes of coordinates, right? So, okay."},{"latex":"\\gamma","symbols":"函数值的下降量","explanation":"γ 通常用于表示函数值的下降量，符合数学规范。","evidence":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."},{"latex":"\\eta","symbols":"临界值","explanation":"η 通常用于表示临界值，符合数学规范。","evidence":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."}],"uncertainties":["lambda = \\sqrt{\\nabla f^T H^{-1} \\nabla f} 的具体形式是否准确，因为原句中提到 'it's actually the square root of that or something'，可能存在模糊性。"],"diagram":"none","start":182.61,"end":342.7,"asr_flags":[],"math_clarifications":["λ 未明确其定义，且未与梯度建立数学关系，无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":182.61,"text":"Because the way I make fun of a typical convergence analysis is, here's my prototype convergence analysis. If, and then a long list of things that you could never possibly verify or know. Hold. Then, and then it gives a silly conclusion which is also weak and pathetic and doesn't really even say anything. So that's my model of what I see a convergence analysis looking like. This."},{"start":208.92,"text":"This I can't make fun of because it basically starts by, there's nothing unknown in the hypotheses, right? It's just if it's self-concordant, that's it. And we know for a whole bunch of functions that we actually care about, it is. And then there are parameters in the analysis. The analysis is very simple, right? It simply looks like this. It says, oh, and by the way, it's measured by lambda, which you'll remember is the gradient."},{"start":234.76,"text":"times the Hessian inverse times the gradient, it's actually the square root of that or something, that is actually a measure of the gradient, which is independent of an affine change of coordinates, right? So if you have this beautiful algorithm and then the last thing you have in your code is a convergence thing that looks like norm of the gradient, congratulations, it's now dependent, weakly dependent on changes of coordinates, right? So, okay."},{"start":264.23,"text":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."},{"start":291.31,"text":"I mean, there would be isolated cases where I would know M and L, but mostly you would not. So then you get a complexity bound that looks like this, and what's amazing is that it's everything here you know. I mean, oh, one minor, we still have the embarrassment of P star here. We will talk about that. We'll see this. This will come up maybe next week in interior point methods. We'll take care of that."},{"start":317.06,"text":"You can still make fun of it that way, but it's fine. Because if I replace P star with any lower bound on P star, then I still get an upper bound on the number of steps. Yeah, so that's the idea. Okay. Yeah, and if you work this out, this is a sloppy analysis that, you know, leaving an idea, you get something like 375 times the difference. So..."}],"speech_gaps":[],"frame":"../frames/v015/002.webp","frame_time":194.61},{"title":"自协调函数的应用与实现","segments":[{"id":13,"text":"In fact, if you do a more careful analysis, you can get like 11. I think that's the one that Nesterov and Nemirovsky came up with. What's interesting is that that actually does kind of give you the behavior, right? This looks like it, I mean, maybe there's a better lower bound that has this slope. We could work out what that slope is. But ours is just like a straight, almost a straight line going up. And 11, yeah, 11 would be, it's still, it's only off by a factor of 10. Because it looks like if you take,","start":344.14,"end":373.38},{"id":14,"text":"You know, if you took C equals, I don't know, we could take a look at this, what that slope is, but maybe it's like two or something like that, that would probably be a pretty good estimate of it. Okay, so just to finish up the discussion of self-concordance, you...","start":373.89,"end":395.08},{"id":15,"text":"Mostly it's used by people to to a step to prove convergence of, for example, interior point methods, which will be our our next topic.","start":395.65,"end":402.29},{"id":16,"text":"Right. So that's what it's usually used for. People have observed that formulations that involve self-concordant functions actually do work better in practice.","start":402.43,"end":410.75},{"id":17,"text":"But I think no one would claim anything strong about that.","start":411.37,"end":415.25},{"id":18,"text":"Like like and for sure, if you were implementing a method and something wasn't self-concordant and it worked well against, you know, carefully against a whole bunch of test problems and things like that.","start":415.33,"end":424.83},{"id":19,"text":"no one would worry about it one bit. So, just to make sure that the whole story on","start":424.83,"end":433.83},{"id":20,"text":"consultant coordinates is clear. Okay, now we get to something much more important,","start":433.83,"end":437.19},{"id":21,"text":"which is actually the implementation, right? So, you know, basically it comes down to forming this","start":438.77,"end":446.47},{"id":22,"text":"Hessian here, and the gradient, and then solving this set of equations, which is linear algebra,","start":446.47,"end":451.01},{"id":23,"text":"algebra. In fact, you could even say, if someone says, what are you doing? You say, I'm minimizing","start":451.01,"end":456.91},{"id":24,"text":"a smooth function. How are you doing it? And you say, well, I'm solving a sequence of quadratic","start":456.91,"end":462.33},{"id":25,"text":"minimization problems. And they go, OK, and? And you go, ah, quadratic minimization, that's","start":463.23,"end":470.11},{"id":26,"text":"linear algebra. So we've reduced minimizing a smooth convex function to minimizing a sequence","start":470.11,"end":477.63},{"id":27,"text":"of, I don't know, some tens or whatever, of quadratic minimizations, each of which is","start":477.63,"end":484.39},{"id":28,"text":"actually just linear algebra, right? So, by the way, that means that you can import all","start":484.39,"end":488.39},{"id":29,"text":"the stuff you know about linear algebra with structure and banded and sparse and all that","start":488.39,"end":492.53},{"id":30,"text":"kind of stuff and it all just slots right in here.","start":492.53,"end":494.95},{"id":31,"text":"If there's no structure of any kind, that's just going to be like n-cubed blobs for an unstructured system. If H were sparse or banded, it's actually going to be a lot faster to solve, if you know what you're doing. Actually, there's many mistakes people can make. One would be forming H and having it be dense.","start":497.23,"end":519.97}],"notes":["本段主要讨论自协调函数的应用，特别是其在证明内点方法收敛性中的作用。Boyd提到，自协调函数在实践中表现更好，但没有人会声称其有很强的理论保证。","在实现方面，Boyd强调了形成Hessian矩阵和梯度，并求解线性方程组的重要性。他指出，最小化光滑凸函数可以归结为一系列二次最小化问题，而这些问题本质上是线性代数问题。","Boyd还提到，线性代数中的结构（如带状或稀疏矩阵）可以显著提高计算效率。如果Hessian矩阵是稠密的，这将是一个常见的错误。","他进一步指出，对于无结构的系统，计算复杂度会达到n³，而稀疏或带状矩阵可以显著减少计算时间。","Boyd强调了在实现过程中需要注意的常见错误，特别是形成稠密的Hessian矩阵的问题。","最后，他指出，将线性代数中的结构知识应用到优化问题中，可以显著提高计算效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":344.14,"end":519.97,"asr_flags":[],"boards":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":344.14,"text":"In fact, if you do a more careful analysis, you can get like 11. I think that's the one that Nesterov and Nemirovsky came up with. What's interesting is that that actually does kind of give you the behavior, right? This looks like it, I mean, maybe there's a better lower bound that has this slope. We could work out what that slope is. But ours is just like a straight, almost a straight line going up. And 11, yeah, 11 would be, it's still, it's only off by a factor of 10. Because it looks like if you take,"},{"start":373.89,"text":"You know, if you took C equals, I don't know, we could take a look at this, what that slope is, but maybe it's like two or something like that, that would probably be a pretty good estimate of it. Okay, so just to finish up the discussion of self-concordance, you..."},{"start":395.65,"text":"Mostly it's used by people to to a step to prove convergence of, for example, interior point methods, which will be our our next topic."},{"start":402.43,"text":"Right. So that's what it's usually used for. People have observed that formulations that involve self-concordant functions actually do work better in practice."},{"start":411.37,"text":"But I think no one would claim anything strong about that."},{"start":415.33,"text":"Like like and for sure, if you were implementing a method and something wasn't self-concordant and it worked well against, you know, carefully against a whole bunch of test problems and things like that."},{"start":424.83,"text":"no one would worry about it one bit. So, just to make sure that the whole story on"},{"start":433.83,"text":"consultant coordinates is clear. Okay, now we get to something much more important,"},{"start":438.77,"text":"which is actually the implementation, right? So, you know, basically it comes down to forming this"},{"start":446.47,"text":"Hessian here, and the gradient, and then solving this set of equations, which is linear algebra,"},{"start":451.01,"text":"algebra. In fact, you could even say, if someone says, what are you doing? You say, I'm minimizing"},{"start":456.91,"text":"a smooth function. How are you doing it? And you say, well, I'm solving a sequence of quadratic"},{"start":463.23,"text":"minimization problems. And they go, OK, and? And you go, ah, quadratic minimization, that's"},{"start":470.11,"text":"linear algebra. So we've reduced minimizing a smooth convex function to minimizing a sequence"},{"start":477.63,"text":"of, I don't know, some tens or whatever, of quadratic minimizations, each of which is"},{"start":484.39,"text":"actually just linear algebra, right? So, by the way, that means that you can import all"},{"start":488.39,"text":"the stuff you know about linear algebra with structure and banded and sparse and all that"},{"start":492.53,"text":"kind of stuff and it all just slots right in here."},{"start":497.23,"text":"If there's no structure of any kind, that's just going to be like n-cubed blobs for an unstructured system. If H were sparse or banded, it's actually going to be a lot faster to solve, if you know what you're doing. Actually, there's many mistakes people can make. One would be forming H and having it be dense."}],"speech_gaps":[],"frame":"../frames/v015/003.webp","frame_time":356.14},{"title":"Hessian结构与优化应用","segments":[{"id":32,"text":"Even if there's zeros all over it, I mean, you should kind of check that, but even if there's zeros all over it, it's not going to, some numerical method is not going to exploit that necessarily. Okay, so, all right. Let's see. What you're going to want to do is actually make a map in your head so you know what kind of applications involve a Hessian that has structure, right?","zh":"即使它到处都是零，我的意思是，你应该检查一下，但即使到处都是零，某些数值方法也不一定会利用这一点。好的，那么，我们想要做的是在脑海中建立一个地图，让你知道哪些应用涉及具有结构的Hessian矩阵，对吧？","start":521.49,"end":549.28},{"id":33,"text":"Here's a very common one that occurs, is that a function here is going to be, it's separable, so it's a function, these are functions of one variable, right? These xi's are the components, right? So it's separable, so it's a separable function, plus a function of an affine function of your variables, right?","zh":"这里有一个非常常见的例子，就是这个函数是可分的，因此它是一个函数，这些是单变量的函数，对吧？这些xi是分量，对吧？所以它是可分的，因此它是一个可分函数，加上一个关于你变量的仿射函数，对吧？","start":551.64,"end":572.48},{"id":34,"text":"So this is extremely common form that's going to come up. In fact, I guess we're going to see it in just a couple minutes in some applications, right? So here, if you work out what the Hessian of this is, the Hessian of a separable function is diagonal. I mean, in fact, that's kind of if and only if, right? If your Hessian is diagonal, then it's a sum, it's a separable function, right? Because it basically means cross derivatives are zero. Like partial xi, partial xj of f is zero.","zh":"所以这是一种极其常见的形式，它将在接下来的几分钟内出现在一些应用中，对吧？在这里，如果你计算这个函数的Hessian矩阵，可分函数的Hessian矩阵是对角的。我的意思是，实际上这是充要条件，对吧？如果你的Hessian矩阵是对角的，那么它就是一个可分函数，对吧？因为这基本上意味着交叉导数为零。例如，f关于xi和xj的偏导数为零。","start":572.98,"end":602.48},{"id":35,"text":"And so that's going to tell you that it looks like this. Okay. Now, the Hessian of this, you can work it out, but it's actually this. It's A transpose. So here we're assuming A is wide. It is going to be A transpose, then H, which is the Hessian of this thing, H0, and then times A, right? So if you look at this long enough, you realize like, oh my God, that is diagonal plus low rank.","zh":"因此，这将告诉你它看起来像这样。好的，这个函数的Hessian矩阵，你可以计算出来，但它实际上是这样的。它是A的转置。在这里我们假设A是宽的。它将是A的转置，然后是H，即这个函数的Hessian矩阵H0，然后乘以A，对吧？所以如果你仔细观察，你会意识到，哦我的天，这实际上是对角加上低秩的。","start":602.88,"end":631.26},{"id":36,"text":"Right. And so once again, you know, once you're once your linear algebra structure center of your brain is all up to speed, that should be like that should be blinking saying you can solve this faster. OK. And that that's the right. Right. That's correct. Right. So if you just ignore that and form an N by N matrix, then call it Cholesky factorization, then each Newton step is going to cost you order N cubed. Right. So that that's going to be the naive implementation. Right.","zh":"对的。再次，一旦你的线性代数结构在脑海中运转起来，这应该会像闪光灯一样告诉你你可以更快地解决这个问题。好的。这就是正确的做法。对的。这是正确的。对的。如果你忽略这一点，直接形成一个N乘N的矩阵，然后称之为Cholesky分解，那么每次牛顿步将花费你O(N³)的计算量。对的。这就是朴素的实现方式。对的。","start":631.74,"end":661.13},{"id":37,"text":"But if you know that it's diagonal plus low rank, you can exploit that, and that might look something like this. First, you would do a Cholesky factorization. This is a p-cubed operation here. Then you would write out the Newton system as this. You'd actually literally introduce a new variable, w, right?","zh":"但如果已知它是对角线加上低秩结构，就可以利用这一点，这可能看起来像这样。首先，你会进行Cholesky分解。这里这是一个p的三次方的操作。然后你会将牛顿系统写成这样的形式。实际上，你会引入一个新的变量w，对吧？","start":662.49,"end":681.67}],"notes":["本段讲解了Hessian矩阵的结构在优化问题中的重要性，特别是当Hessian具有特定结构（如对角线或低秩）时，可以显著提高计算效率。讲者指出，如果Hessian是对角线形式，那么函数是可分的，这意味着交叉导数为零，这在优化中是一个关键性质。","讲者提到，当Hessian是可分函数的Hessian时，它会是稀疏的，即对角线形式。这种结构在实际应用中非常常见，例如在处理具有多个变量的函数时，如果函数可以分解为各个变量的函数之和，那么Hessian矩阵将是对角线形式。","讲者进一步指出，当Hessian矩阵是低秩加上对角线形式时，可以利用这种结构来加速计算。例如，通过Cholesky分解，可以将计算复杂度从O(N³)降低到O(p³)，其中p是低秩部分的维度。","讲者强调，理解Hessian矩阵的结构对于优化问题的求解至关重要。如果忽略这种结构，直接使用标准的Cholesky分解方法，计算复杂度会很高，而利用结构信息可以显著提高效率。","讲者还提到，在处理具有低秩结构的Hessian矩阵时，可以引入新的变量w，从而将问题转化为更简单的形式，这有助于进一步优化计算过程。","本段内容强调了在优化问题中，Hessian矩阵的结构分析对于设计高效算法的重要性，特别是在处理大规模问题时，利用结构信息可以显著减少计算成本。"],"formulas":[{"latex":"H_{ij} = \\frac{\\text{d}^2 f}{\\text{d}x_i \\text{d}x_j} = 0 \\text{ for } i \\neq j","symbols":"Hessian 矩阵的非对角线元素为零，表示函数是可分的","explanation":"公式正确表达了可分函数的 Hessian 矩阵的性质，即非对角线元素为零。","evidence":"So this is extremely common form that's going to come up. In fact, I guess we're going to see it in just a couple minutes in some applications, right? So here, if you work out what the Hessian of this is, the Hessian of a separable function is diagonal. I mean, in fact, that's kind of if and only if, right? If your Hessian is diagonal, then it's a sum, it's a separable function, right? Because it basically means cross derivatives are zero. Like partial xi, partial xj of f is zero."}],"uncertainties":["可能的术语错误：'linear algebra structure center of your brain' 可能应为 'linear algebra structure in your brain'，但根据上下文，原意可能是强调线性代数结构的理解。","可能的术语错误：'that that's the right' 可能是重复或口误，但根据上下文，原意可能是 'that's the right way' 或 'that's correct'。"],"diagram":"none","start":521.49,"end":681.67,"asr_flags":[],"math_clarifications":["公式 H = A^T H_0 A 缺少对 A 和 H0 的具体定义，且未说明 A 是宽矩阵的假设，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":521.49,"text":"Even if there's zeros all over it, I mean, you should kind of check that, but even if there's zeros all over it, it's not going to, some numerical method is not going to exploit that necessarily. Okay, so, all right. Let's see. What you're going to want to do is actually make a map in your head so you know what kind of applications involve a Hessian that has structure, right?"},{"start":551.64,"text":"Here's a very common one that occurs, is that a function here is going to be, it's separable, so it's a function, these are functions of one variable, right? These xi's are the components, right? So it's separable, so it's a separable function, plus a function of an affine function of your variables, right?"},{"start":572.98,"text":"So this is extremely common form that's going to come up. In fact, I guess we're going to see it in just a couple minutes in some applications, right? So here, if you work out what the Hessian of this is, the Hessian of a separable function is diagonal. I mean, in fact, that's kind of if and only if, right? If your Hessian is diagonal, then it's a sum, it's a separable function, right? Because it basically means cross derivatives are zero. Like partial xi, partial xj of f is zero."},{"start":602.88,"text":"And so that's going to tell you that it looks like this. Okay. Now, the Hessian of this, you can work it out, but it's actually this. It's A transpose. So here we're assuming A is wide. It is going to be A transpose, then H, which is the Hessian of this thing, H0, and then times A, right? So if you look at this long enough, you realize like, oh my God, that is diagonal plus low rank."},{"start":631.74,"text":"Right. And so once again, you know, once you're once your linear algebra structure center of your brain is all up to speed, that should be like that should be blinking saying you can solve this faster. OK. And that that's the right. Right. That's correct. Right. So if you just ignore that and form an N by N matrix, then call it Cholesky factorization, then each Newton step is going to cost you order N cubed. Right. So that that's going to be the naive implementation. Right."},{"start":662.49,"text":"But if you know that it's diagonal plus low rank, you can exploit that, and that might look something like this. First, you would do a Cholesky factorization. This is a p-cubed operation here. Then you would write out the Newton system as this. You'd actually literally introduce a new variable, w, right?"}],"speech_gaps":[],"frame":"../frames/v015/004.webp","frame_time":533.49},{"title":"稀疏性和带状Hessian矩阵的计算优势","segments":[{"id":38,"text":"Then you eliminate delta x from it, and you'd end up with this, and you'd recognize these things as sure complements of various things. And then, you know, you can work out what everything happens here. I'm not going to go into the details of this, but it turns out actually just forming this matrix here is the dominant factor, and that's 2p squared n. This is to be compared to n cubed, right? So if p is like 1 100th of n,","zh":"然后你从其中消去delta x，你会得到这个结果，并且你会认识到这些项是各种事物的确定补集。然后，你知道，你可以推导出这里发生的一切。我不会深入讨论这些细节，但事实上，仅仅形成这个矩阵就是主要因素，其复杂度是2p²n。这要与n³进行比较，对吧？所以如果p是n的1/100，","start":682.47,"end":708.91},{"id":39,"text":"then you just saved yourself 10,000x. Everybody following this? Right? So, anyway, so this is the kind of thing you're, so when you see things like this, and, you know, I could, we could do things like this. What would, what does the Hessian, what does it mean for the Hessian to be banded? How about that? They're just in words. Like, what does that mean? Any suggestion? It just means that...","zh":"你就节省了10,000倍的计算量。大家跟上了吗？对吧？总之，这就是你看到这类情况时所要考虑的。当你看到这样的内容时，你知道，我们也可以做类似的事情。那么，什么是Hessian矩阵的带状结构？那又意味着什么呢？它们只是用词来说的。比如，这到底意味着什么？有什么建议吗？它仅仅意味着……","start":709.43,"end":742.08},{"id":40,"text":"that there are no, I'm going to call, when I take a function, I go partial squared f, partial xi, partial xj. If that's not zero, I'm going to call it an interaction between i and j, right? So what this says is interactions are local. It says that those are zero unless i minus j is really small, like less than half the bandwidth. So that's what it means, right? It does a lot of applications, right? That would be things like control, signal processing. I could go on and on.","zh":"当我在一个函数上取偏导数时，我计算∂²f/∂xi∂xj。如果这个值不为零，我会称其为i和j之间的相互作用，对吧？所以这说明相互作用是局部的。它说明除非i和j的差非常小，比如小于带宽的一半，否则这些值为零。这就是它的意思，对吧？它在很多应用中都有用，对吧？比如控制、信号处理。我可以一直说下去。","start":742.42,"end":770.58},{"id":41,"text":"I mean, these are entire fields would have that structure. And, by the way, if the Hessian is banded, how fast can I compute a Newton step in n if it's banded? It's just order n, right? Because the factorization is going to be...","zh":"我的意思是，这些整个领域都会具有这种结构。顺便说一句，如果Hessian矩阵是带状的，那么在n维情况下，我最快能在多快的时间内计算一个牛顿步？它只是与n成线性关系，对吧？因为分解过程会是……","start":771.2,"end":797.74},{"id":42,"text":"you know, well, it's going to actually look exactly like this here. It's going to be this thing, right? So what that says is, I don't know, I mean, just for fun, if I had to solve an optimal control problem with, I don't know, a couple thousand steps by Newton's method, someone would want to make a quick guess as to how long that might take. Well, let's say the state dimension is 10, and I don't know, there's like five inputs. It doesn't matter. It's some optimal control problem.","zh":"你知道，它实际上会看起来就和这里一样。它会是这个样子，对吧？所以这说明，我也不知道，只是为了好玩，如果我要用牛顿法解决一个最优控制问题，比如有几千个步骤，有人会想快速猜测一下这可能需要多长时间。假设状态维度是10，我不知道，有五个输入。没关系，这是一个最优控制问题。","start":798.09,"end":826.47},{"id":43,"text":"Yeah. So I, if you just wrote it out, it might take a second or two, but if you knew what you were doing, it would be sub millisecond. Okay. So, and this is actually how a lot of things work. So, okay. So this is the key to everything. These are super important things to know. You know, you just, you just have to know these period. Right. So, okay. Yeah.","zh":"是的。所以如果你把它写出来，可能需要一两秒，但如果你知道该怎么做，那就只需要不到一毫秒。好的。所以，实际上，很多东西都是这样运作的。好的。所以，这就是一切的关键。这些是非常重要的知识点。你知道的，你只需要知道这些就行了。对吧。好的。是的。","start":828.42,"end":853.28}],"notes":["本段主要讲解了稀疏性在优化问题中的重要性，特别是当问题规模较大时，稀疏性可以显著减少计算量。例如，当参数p是n的1/100时，计算复杂度从n³降低到2p²n，从而节省了10,000倍的计算时间。这说明了在实际应用中，稀疏性可以带来巨大的计算优势。","接着，讲者引入了带状Hessian矩阵的概念，并解释了其含义。带状Hessian矩阵意味着函数的二阶导数（即交互项）仅在变量i和j之间距离较小时非零，这表明交互项是局部的。这种结构在控制和信号处理等领域有广泛应用。","讲者进一步讨论了带状Hessian矩阵对计算效率的影响。由于带状矩阵的特殊结构，计算牛顿步的复杂度可以降低到O(n)，这比一般情况下的O(n³)要高效得多。这种高效性在解决大规模优化问题时尤为重要。","最后，讲者通过一个最优控制问题的例子，说明了带状Hessian矩阵在实际应用中的价值。即使问题规模较大，如包含数千个步骤，利用带状结构的优化方法可以在毫秒级别内完成计算，这展示了带状结构在实际工程中的重要性。","讲者强调了这些概念在凸优化中的核心地位，指出了解这些概念对于理解和应用凸优化方法至关重要。这些知识不仅适用于理论分析，也广泛应用于实际工程问题中。","通过这些讲解，讲者帮助学生理解了稀疏性和带状结构在优化问题中的重要性，并展示了它们如何在实际计算中带来显著的效率提升。"],"formulas":[],"uncertainties":[],"diagram":"none","start":682.47,"end":853.28,"asr_flags":[],"math_clarifications":["原始文本中提到的'2p squared n'和'O(n)'没有明确的数学表达式或上下文支持，无法确定其数学含义或正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":682.47,"text":"Then you eliminate delta x from it, and you'd end up with this, and you'd recognize these things as sure complements of various things. And then, you know, you can work out what everything happens here. I'm not going to go into the details of this, but it turns out actually just forming this matrix here is the dominant factor, and that's 2p squared n. This is to be compared to n cubed, right? So if p is like 1 100th of n,"},{"start":709.43,"text":"then you just saved yourself 10,000x. Everybody following this? Right? So, anyway, so this is the kind of thing you're, so when you see things like this, and, you know, I could, we could do things like this. What would, what does the Hessian, what does it mean for the Hessian to be banded? How about that? They're just in words. Like, what does that mean? Any suggestion? It just means that..."},{"start":742.42,"text":"that there are no, I'm going to call, when I take a function, I go partial squared f, partial xi, partial xj. If that's not zero, I'm going to call it an interaction between i and j, right? So what this says is interactions are local. It says that those are zero unless i minus j is really small, like less than half the bandwidth. So that's what it means, right? It does a lot of applications, right? That would be things like control, signal processing. I could go on and on."},{"start":771.2,"text":"I mean, these are entire fields would have that structure. And, by the way, if the Hessian is banded, how fast can I compute a Newton step in n if it's banded? It's just order n, right? Because the factorization is going to be..."},{"start":798.09,"text":"you know, well, it's going to actually look exactly like this here. It's going to be this thing, right? So what that says is, I don't know, I mean, just for fun, if I had to solve an optimal control problem with, I don't know, a couple thousand steps by Newton's method, someone would want to make a quick guess as to how long that might take. Well, let's say the state dimension is 10, and I don't know, there's like five inputs. It doesn't matter. It's some optimal control problem."},{"start":828.42,"text":"Yeah. So I, if you just wrote it out, it might take a second or two, but if you knew what you were doing, it would be sub millisecond. Okay. So, and this is actually how a lot of things work. So, okay. So this is the key to everything. These are super important things to know. You know, you just, you just have to know these period. Right. So, okay. Yeah."}],"speech_gaps":[],"frame":"../frames/v015/005.webp","frame_time":694.47},{"title":"KKT条件与二次优化问题","segments":[{"id":44,"text":"What happened when you introduced the W here? Or what was the motivation for that? Oh, this is simply just doing it by, I mean, you could go back and we can call it all sorts of things. W is unelimination, if you like. Right? Yeah, that's one way. Or this is actually just doing, this is exploiting, you know, diagonal plus low rank or whatever. Once you expand it, that's what happens. Yeah. So that's all this is. Okay.","zh":"当你在这里引入W时发生了什么？或者引入W的动机是什么？哦，这仅仅是通过某种方式来做，我的意思是，你可以回过头来，我们也可以称之为各种各样的东西。W是不可消除的，如果你喜欢的话。对吧？是的，这就是一种方式。或者这实际上是利用了，你知道的，对角线加上低秩或者其他什么。一旦你展开它，就会发生这种情况。是的。所以这就是全部。好的。","start":854.79,"end":881.06},{"id":45,"text":"Okay, so next up, and this is material that you will need to do this homework thing. Actually, we're probably not going to be, I'll say a few things about it, but you actually are definitely going to have to read the book carefully. It's just a couple of pages to get the details of this method. Okay, so let's look at a quality constraint minimization. So basic problem is we have a smooth, you know, twice continuously differentiable convex function here.","zh":"好的，接下来，这是你们需要完成这次作业的内容。实际上，我们可能不会详细讲很多，但你们肯定必须仔细阅读这本书。只需要几页就能了解这个方法的细节。好的，那么让我们来看一个带约束的最小化问题。基本问题是，我们有一个光滑的、两次连续可微的凸函数。","start":885.17,"end":913.17},{"id":46,"text":"And we're going to minimize here F subject to AX equals B. And, you know, this basically says these optimality conditions are necessary and sufficient, right? It says that when, you know, when the gradient is in the range of A transpose and you're primal feasible, then that's optimal. And that's if and only if, right? So there's no, there's nothing else here. It's just that no qualifications or anything like that. It's assuming F is...","zh":"我们将在这里最小化F，使得AX等于B。你知道，这基本上说明这些最优性条件是必要且充分的，对吧？它说明当梯度在A转置的范围内，并且满足原始可行性时，这就是最优的。而且这是当且仅当的情况，对吧？所以这里没有其他东西。它只是假设F是……","start":913.64,"end":942.06},{"id":47,"text":"convex, right? Okay. Okay. So here's a classic example is quadratic. So here's an equality constrained quadratic minimization problem. Looks like this, right? And the optimality condition now, the Hessian is just p. The gradient is going to be px plus q or something like that. That's the gradient. And then the optimality condition, you can write out this way.","zh":"凸的，对吧？好的。好的。这里的一个经典例子是二次的。这里是一个等式约束的二次最小化问题。看起来像这样，对吧？而现在的最优性条件，Hessian矩阵就是p。梯度将是px加上q或者其他类似的东西。这就是梯度。然后最优性条件可以这样写出。","start":942.51,"end":971.74},{"id":48,"text":"Okay? So that's what it is, right? This is, you know, the... Yeah, anyway, these are the optimality conditions. These are literally these two equations here. Here. The difference is this equation... These are linear, actually, right? That's a set of linear equations. That's linear. And if f is quadratic, its gradient is an affine function. And so the KKT conditions become a set of linear equations. And once again, it's just linear algebra. So that's right, which...","zh":"好的？这就是它的样子，对吧？这就是，你知道的，……是的，无论如何，这些就是最优性条件。这些就是这里这两个方程。这里。区别在于这个方程……实际上，这些是线性的，对吧？这是一组线性方程。这是线性的。如果f是二次的，它的梯度是一个仿射函数。因此，KKT条件变成一组线性方程。再次，这仅仅是线性代数的问题。所以这是对的，这……","start":972.2,"end":1001.54},{"id":49,"text":"Good. Okay. So when you set it up, it looks like this. This is a very famous matrix. It's actually called the KKT matrix. And it comes up in pretty much every field I can imagine. It's in mechanics. Certainly it's in electrical engineering. It's in lots and lots and lots of fields. Okay. So let's see. Oh, you can work out. This thing is going to be...","zh":"好的。好的。当你设置这个问题时，它看起来像这样。这是一个非常著名的矩阵。它实际上被称为KKT矩阵。它几乎出现在我所能想象到的每一个领域中。它出现在力学中。当然，它也出现在电气工程中。它出现在大量的领域中。好的。那么我们来看看。哦，你可以计算出来。这个矩阵将会是……","start":1002.63,"end":1030.98}],"notes":["本段讨论了引入W矩阵的动机，指出W矩阵可以被视为一种未消除的变量，或者可以被解释为对角线加上低秩结构的利用。这表明在优化问题中，矩阵的结构可能对问题的求解方式产生影响。","接下来的段落强调了KKT条件在优化问题中的重要性，特别是当目标函数是凸函数且存在等式约束时，KKT条件是必要且充分的。这表明在满足一定条件时，KKT条件可以用来判断最优解。","在二次优化问题中，KKT条件转化为一组线性方程，这使得问题可以通过线性代数的方法求解。这表明当目标函数是二次函数时，KKT条件的结构会简化，从而更容易求解。","KKT矩阵是一个非常重要的矩阵，它在多个领域中都有应用，如力学和电气工程。这表明KKT矩阵的结构和性质在不同学科中具有普遍性。","在讨论KKT矩阵时，讲者提到它在各种领域中都会出现，这表明KKT矩阵的结构和应用范围非常广泛，是优化问题中的一个核心概念。","讲者提到KKT矩阵的结构可以通过推导得出，这表明KKT矩阵的构造和性质是可以通过数学推导来理解的，而不是凭空猜测。"],"formulas":[],"uncertainties":[],"diagram":"none","start":854.79,"end":1030.98,"asr_flags":[],"math_clarifications":["所有公式均未提供完整的数学表达形式，缺少必要的上下文和符号定义，无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":854.79,"text":"What happened when you introduced the W here? Or what was the motivation for that? Oh, this is simply just doing it by, I mean, you could go back and we can call it all sorts of things. W is unelimination, if you like. Right? Yeah, that's one way. Or this is actually just doing, this is exploiting, you know, diagonal plus low rank or whatever. Once you expand it, that's what happens. Yeah. So that's all this is. Okay."},{"start":885.17,"text":"Okay, so next up, and this is material that you will need to do this homework thing. Actually, we're probably not going to be, I'll say a few things about it, but you actually are definitely going to have to read the book carefully. It's just a couple of pages to get the details of this method. Okay, so let's look at a quality constraint minimization. So basic problem is we have a smooth, you know, twice continuously differentiable convex function here."},{"start":913.64,"text":"And we're going to minimize here F subject to AX equals B. And, you know, this basically says these optimality conditions are necessary and sufficient, right? It says that when, you know, when the gradient is in the range of A transpose and you're primal feasible, then that's optimal. And that's if and only if, right? So there's no, there's nothing else here. It's just that no qualifications or anything like that. It's assuming F is..."},{"start":942.51,"text":"convex, right? Okay. Okay. So here's a classic example is quadratic. So here's an equality constrained quadratic minimization problem. Looks like this, right? And the optimality condition now, the Hessian is just p. The gradient is going to be px plus q or something like that. That's the gradient. And then the optimality condition, you can write out this way."},{"start":972.2,"text":"Okay? So that's what it is, right? This is, you know, the... Yeah, anyway, these are the optimality conditions. These are literally these two equations here. Here. The difference is this equation... These are linear, actually, right? That's a set of linear equations. That's linear. And if f is quadratic, its gradient is an affine function. And so the KKT conditions become a set of linear equations. And once again, it's just linear algebra. So that's right, which..."},{"start":1002.63,"text":"Good. Okay. So when you set it up, it looks like this. This is a very famous matrix. It's actually called the KKT matrix. And it comes up in pretty much every field I can imagine. It's in mechanics. Certainly it's in electrical engineering. It's in lots and lots and lots of fields. Okay. So let's see. Oh, you can work out. This thing is going to be..."}],"speech_gaps":[],"frame":"../frames/v015/006.webp","frame_time":866.79},{"title":"KKT矩阵的可逆性与约束消除","segments":[{"id":50,"text":"non-singular, it is certainly not positive definite. In fact, it's what people call quasi-semi-definite. So this KKT matrix here is invertible if and only if, roughly speaking, there's nothing, the null space of A does not intersect the null space of P. So if there's a common vector that both satisfies AX equals zero and PX equals zero,","zh":"非奇异的，它当然不是正定的。事实上，人们称之为拟半正定。因此，这里的KKT矩阵可逆当且仅当，粗略地说，没有任何东西，A的零空间与P的零空间不相交。所以如果存在一个同时满足AX等于零和PX等于零的向量，那么这个矩阵就是奇异的，对吧？这就是充要条件。好的。表达这一点的方式有很多，很多，很多。你可能根本不需要太担心这一点，对吧？但这就是它的含义。好的。","start":1031.46,"end":1058.82},{"id":51,"text":"then this thing is singular, right? So that's, and that's if and only if. Okay. And there's many, many, many ways to express that. And you probably don't even have to worry about that too much, right? But that's what that is. Okay.","zh":"顺便说一下，要评估这一点，要解决这个问题，我们会看到有很多方法可以使用。一种方法是你可以用LDL转置分解。这是一种带有不同符号的Cholesky分解。当你这样做时，这就是一种完全可行的方法。还有其他方法，我们之后会谈到。好的。首先，我不确定你是否记得，但基本上就像在第二周，我们……","start":1059.38,"end":1076.92},{"id":52,"text":"So, by the way, to evaluate this, to solve that, we'll see that there's a lot of options you could use. One is you could use an LDL transpose factorization. That's a Cholesky factorization, but with different signs. And when you do that, that's one perfectly good way. And there's others we will be able to talk about later. Okay. So the first thing, I don't know if you remember, but basically like in week two, we...","zh":"我指出过，你实际上可以消除等式约束。你根本不需要它们，对吧？我的意思是，它们实际上并不带来任何，我们可以随意去掉它们，把它们拉回来。这不会有任何区别。你这样做方式是，如果你有一个等式约束AX等于B，那么你可以将其参数化为仿射函数的像，对吧？这需要你找到一个特解，比如说X帽。然后你找到一个矩阵F，其列空间是A的零空间。","start":1079.76,"end":1109.69},{"id":53,"text":"I pointed out, you could actually eliminate equality constraints. You just don't need them, right? I mean, they don't actually bring any, like we can just get rid of them arbitrarily, pull them back. It doesn't make any difference. And the way you do that is if you have an equality constraint AX equals B, then you parameterize it as the image of an affine function, right? And that requires you to find a particular solution, say X hat. And then you find a matrix F whose range is the null space.","zh":"对吧？所以实际上你只需要这些。而且有非常简单的方法可以做到这一点。你可以对A转置进行QR分解，或者其他类似的操作。这仅仅是线性代数的问题。好的，这就是这个想法。然后你做的是，它说这是一个参数，这是一个自由参数参数化这个集合，这个集合是一个仿射集合，由约束描述。","start":1110.12,"end":1139.28},{"id":54,"text":"of A, right? So that's actually all you need. And there's very simple ways to do that. You could do a QR factorization on A transpose or something. This is just linear algebra at that point. Okay, and that's the idea. Then what you do, it says that this is a parameter, this is a, you'd call this a free parameter parameterization of this set, which is affine set, which is described by constraints.","zh":"对吧？所以实际上你只需要这些。而且有非常简单的方法可以做到这一点。你可以对A转置进行QR分解，或者其他类似的操作。这仅仅是线性代数的问题。好的，这就是这个想法。然后你做的是，它说这是一个参数，这是一个自由参数参数化这个集合，这个集合是一个仿射集合，由约束描述。","start":1140.03,"end":1167.21},{"id":55,"text":"Right, so that's how you describe that. Okay, then you just solve this problem, right? Because everything that satisfies AX equals B has exactly this form. And now this thing is just, that's an unconstrained problem with some variable Z. I could do all sorts of things. I could actually, oh, once I know, by the way, Z star, I can reconstruct X star and even new star as well, right?","zh":"对，就是这样描述的。好的，那么你只需要解决这个问题，对吧？因为所有满足AX等于B的情况都恰好具有这种形式。现在这个问题就变成了一个关于变量Z的无约束问题。我可以做各种事情。实际上，一旦我知道Z星，我就可以重建X星，甚至新的星，对吧？","start":1168.22,"end":1194.83}],"notes":["本段主要讲解KKT矩阵的可逆性条件，指出当矩阵A的零空间与矩阵P的零空间有交集时，KKT矩阵是奇异的。这表明约束条件之间存在某种依赖关系，导致矩阵不可逆。此外，还提到可以通过LDL转置分解等方法来求解KKT矩阵，这属于数值线性代数中的方法。","讲者提到可以通过消除等式约束来简化问题，具体方法是将等式约束参数化为仿射函数的像。这需要找到一个特解和一个矩阵，其列空间为A的零空间。这种方法属于线性代数中的基本操作，通过参数化将约束问题转化为无约束问题。","讲者进一步说明，参数化后的变量Z可以用于求解问题，而一旦找到Z的最优解Z星，就可以通过它重构原始变量X星。这表明参数化方法不仅简化了问题，还保留了原始变量的信息。","讲者强调，消除等式约束并不影响问题的解，因为所有满足等式约束的解都可以表示为参数化形式。这说明参数化方法在保持问题等价性的同时，提供了更灵活的求解方式。","讲者提到，参数化后的变量Z可以用于求解问题，而一旦找到Z的最优解Z星，就可以通过它重构原始变量X星。这表明参数化方法不仅简化了问题，还保留了原始变量的信息。","讲者最后指出，参数化方法是处理约束优化问题的一种有效手段，通过将约束条件转化为参数化形式，可以将问题转化为无约束问题，从而利用各种优化算法进行求解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1031.46,"end":1194.83,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1031.46,"text":"non-singular, it is certainly not positive definite. In fact, it's what people call quasi-semi-definite. So this KKT matrix here is invertible if and only if, roughly speaking, there's nothing, the null space of A does not intersect the null space of P. So if there's a common vector that both satisfies AX equals zero and PX equals zero,"},{"start":1059.38,"text":"then this thing is singular, right? So that's, and that's if and only if. Okay. And there's many, many, many ways to express that. And you probably don't even have to worry about that too much, right? But that's what that is. Okay."},{"start":1079.76,"text":"So, by the way, to evaluate this, to solve that, we'll see that there's a lot of options you could use. One is you could use an LDL transpose factorization. That's a Cholesky factorization, but with different signs. And when you do that, that's one perfectly good way. And there's others we will be able to talk about later. Okay. So the first thing, I don't know if you remember, but basically like in week two, we..."},{"start":1110.12,"text":"I pointed out, you could actually eliminate equality constraints. You just don't need them, right? I mean, they don't actually bring any, like we can just get rid of them arbitrarily, pull them back. It doesn't make any difference. And the way you do that is if you have an equality constraint AX equals B, then you parameterize it as the image of an affine function, right? And that requires you to find a particular solution, say X hat. And then you find a matrix F whose range is the null space."},{"start":1140.03,"text":"of A, right? So that's actually all you need. And there's very simple ways to do that. You could do a QR factorization on A transpose or something. This is just linear algebra at that point. Okay, and that's the idea. Then what you do, it says that this is a parameter, this is a, you'd call this a free parameter parameterization of this set, which is affine set, which is described by constraints."},{"start":1168.22,"text":"Right, so that's how you describe that. Okay, then you just solve this problem, right? Because everything that satisfies AX equals B has exactly this form. And now this thing is just, that's an unconstrained problem with some variable Z. I could do all sorts of things. I could actually, oh, once I know, by the way, Z star, I can reconstruct X star and even new star as well, right?"}],"speech_gaps":[],"frame":"../frames/v015/007.webp","frame_time":1043.46},{"title":"凸优化中的资源分配问题与Hessian矩阵分析","segments":[{"id":56,"text":"by these methods, right? Okay, so that's an equivalent problem. And this just works by Newton's method, right? So we just use Newton's method to solve that. And I'll just give you a quick example. Here's a famous problem. It's resource allocation, right? So x1 up to xn are a bunch of resources that I am going to... Those are the resources allocated to agents 1 through n.","zh":"通过这些方法，对吧？好的，所以这是一个等价的问题。而这仅仅通过牛顿法来实现，对吧？所以我们只需要用牛顿法来解决这个问题。我将给你一个快速的例子。这是一个著名的问题。它是资源分配，对吧？所以x1到xn是一组资源，我将把这些资源分配给代理1到n。","start":1195.25,"end":1225.2},{"id":57,"text":"That's what the XIs are. B is my total budget. That's how much of my resource I'm going to allocate across here. You can make the Xs non-negative. It wouldn't make any difference. And then I have a cost function for each of my agents. Like F1 of X1 is the cost if I allocate X1 to agent 1. So that's how that works. So this is sort of the total cost. And you have this equality constraint.","zh":"这就是XIs所代表的内容。B是我的总预算。这就是我要在这里分配的资源总量。你可以让Xs非负，这不会有任何差别。然后我为每个代理有一个成本函数。例如，F1 of X1是当我将X1分配给代理1时的成本。这就是它的运作方式。所以这是总成本。并且你有一个等式约束。","start":1225.63,"end":1248.03},{"id":58,"text":"One way to eliminate it, I mean this is easy, is what you do is you leave x1 through xn minus 1 alone, right? They're going to be, we just keep them. But we write xn as b minus them, we just remove this. Then you put a function that looks like this. So here my z's are really just x1 through xn minus 1. When I multiply by f,","zh":"消除它的一种方法，我的意思是这很容易，就是你让x1到xn-1保持不变，对吧？它们将被保留下来。但我们把xn写成b减去它们，我们只是去掉这个。然后你写一个看起来像这样的函数。所以这里的z实际上是x1到xn-1。当我乘以f，","start":1250.33,"end":1272.15},{"id":59,"text":"I mean, you can check that this thing is a basis. I mean, by construction, this works, right? You can check that the range of this matrix is exactly the null space of this matrix. That matrix is just a ones vector transposed, right? So that's what that is in AX equals B. Okay, so then you end up with this reduced problem. There you go. Oh, any comments about that function? Anything you like about it?","zh":"我的意思是，你可以检查这个东西是否是一个基。我的意思是，通过构造，这会起作用，对吧？你可以检查这个矩阵的范围正好是这个矩阵的零空间。这个矩阵只是一个转置的全一向量，对吧？所以这就是AX等于B中的内容。好的，那么你最终会得到这个简化的问题。好了，有任何关于这个函数的评论吗？有什么你喜欢的地方吗？","start":1273.05,"end":1301.3},{"id":60,"text":"Can we all visualize its Hessian, please? What is the Hessian of this function? What is it? It's what? You know, it's not arrow. It's very close. If you were to do one elimination, it would be arrow. But it's very close to arrow. It's not arrow. This is dense. It's completely dense. But what is it? What's the Hessian of this part? Diagonal. Okay. How about the Hessian of this? What is it? It's rank one.","zh":"我们都能可视化这个函数的Hessian吗？请告诉我这个函数的Hessian是什么？它是怎样的？它是怎样的？你知道的，它不是箭头矩阵。它非常接近。如果你进行一次消元，它就会是箭头矩阵。但它不是箭头矩阵。这是密集的。它是完全密集的。但它是怎样的？这个部分的Hessian是什么？对角线。好的，那这个的Hessian是什么？它是秩一的。","start":1301.74,"end":1334.33},{"id":61,"text":"You can just check. It's going to be, actually it's literally the matrix of ones. It's actually ones, ones, transpose times a number. That's what it is. I realize you're just seeing this all now, but this is the important thing. This is what you need to do. To actually be able to recognize these things in the wild. You're going to want to be able to see things like this. This is diagonal plus rank one. When you see this,","zh":"你可以直接检查。实际上，它就是全1矩阵。它实际上是全1向量转置乘以一个数。这就是它的样子。我明白你现在才看到这些，但这是重要的事情。这是你需要做到的。为了真正能够在实际中识别这些情况。你想要能够看到这样的东西。这就是对角线加上秩一的矩阵。当你看到这样的时候，","start":1335.24,"end":1362.86}],"notes":["本段讲解了资源分配问题的建模方法，其中x1到xn代表分配给不同代理的资源，B是总预算。通过将xn表示为总预算减去其他资源，可以消除约束条件，从而简化问题。"],"formulas":[],"uncertainties":["Hessian矩阵的具体形式可能因问题而异，但本段强调其为对角矩阵加上秩一矩阵"],"diagram":"none","start":1195.25,"end":1362.86,"asr_flags":[],"math_clarifications":["公式中的求和符号使用了正确的LaTeX格式，且变量定义清晰。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1195.25,"text":"by these methods, right? Okay, so that's an equivalent problem. And this just works by Newton's method, right? So we just use Newton's method to solve that. And I'll just give you a quick example. Here's a famous problem. It's resource allocation, right? So x1 up to xn are a bunch of resources that I am going to... Those are the resources allocated to agents 1 through n."},{"start":1225.63,"text":"That's what the XIs are. B is my total budget. That's how much of my resource I'm going to allocate across here. You can make the Xs non-negative. It wouldn't make any difference. And then I have a cost function for each of my agents. Like F1 of X1 is the cost if I allocate X1 to agent 1. So that's how that works. So this is sort of the total cost. And you have this equality constraint."},{"start":1250.33,"text":"One way to eliminate it, I mean this is easy, is what you do is you leave x1 through xn minus 1 alone, right? They're going to be, we just keep them. But we write xn as b minus them, we just remove this. Then you put a function that looks like this. So here my z's are really just x1 through xn minus 1. When I multiply by f,"},{"start":1273.05,"text":"I mean, you can check that this thing is a basis. I mean, by construction, this works, right? You can check that the range of this matrix is exactly the null space of this matrix. That matrix is just a ones vector transposed, right? So that's what that is in AX equals B. Okay, so then you end up with this reduced problem. There you go. Oh, any comments about that function? Anything you like about it?"},{"start":1301.74,"text":"Can we all visualize its Hessian, please? What is the Hessian of this function? What is it? It's what? You know, it's not arrow. It's very close. If you were to do one elimination, it would be arrow. But it's very close to arrow. It's not arrow. This is dense. It's completely dense. But what is it? What's the Hessian of this part? Diagonal. Okay. How about the Hessian of this? What is it? It's rank one."},{"start":1335.24,"text":"You can just check. It's going to be, actually it's literally the matrix of ones. It's actually ones, ones, transpose times a number. That's what it is. I realize you're just seeing this all now, but this is the important thing. This is what you need to do. To actually be able to recognize these things in the wild. You're going to want to be able to see things like this. This is diagonal plus rank one. When you see this,"}],"speech_gaps":[],"frame":"../frames/v015/008.webp","frame_time":1207.25},{"title":"牛顿步与KKT系统","segments":[{"id":62,"text":"You should be able to look at that and say to someone, I can solve that in linear time. And they would say, wow, how do you do that? I thought Newton, I'm using like, you know, SGD because it's too big or I don't blah, blah, blah. And you're like, no, no, they go, but I have a million variables. And you're like, too bad, I can do it on my phone. Okay, everyone following this? So these are extremely good things to know about, right? So, because...","zh":"你应该能够看着这个并告诉别人，我可以在线性时间内解决这个问题。他们会说，哇，你是怎么做到的？我以为牛顿法，我用的是像SGD这样的方法，因为它太大了或者我什么的，什么的。而你会说，不，不，他们会说，但我有百万个变量。而你会说，太糟糕了，我可以在手机上完成。好的，大家跟上了吗？所以，这些是非常重要的知识点，对吧？所以，因为……","start":1363.3,"end":1390.18},{"id":63,"text":"I don't know, every day there's people who don't know these things making the wrong conclusion, arriving somewhere and saying, oh, I tried like NumPy and it was too slow or something. Yes? Sorry, what is the point of the f matrix? Because I don't see it in the refuse problem. Oh, it is here. What I've written here, this is actually, this is literally, you know, it's the original f of then capital F z plus x hat.","zh":"我不知道，每天都有人不知道这些事情，得出错误的结论，到达某个地方并说，哦，我试过NumPy，但它太慢了或者什么的。是吗？抱歉，这个f矩阵的用途是什么？因为我在这个拒绝问题中没有看到它。哦，它在这里。我在这里写的内容，实际上，这实际上是原来的f，也就是大写的F z加上x帽。","start":1390.6,"end":1418.51},{"id":64,"text":"So, I'm just writing it out in its more natural form. But that's exactly what it is, right? In fact, you can sort of see that, right? Here, with this one. The f has an i stacked on top of a minus ones. Here's the minus ones. And here's, like, the i. That's an n by 1 by n minus 1 i. n minus 1 by n minus 1, yeah. Okay, okay, cool. This is, okay. So, the Newton step.","zh":"所以我只是把它写成更自然的形式。但这就是它的确切含义，对吧？事实上，你可以大致看到这一点，对吧？在这里，这个f上面有一个i，接着是一个负一的堆叠。这里是负一。这里是i，这是一个n乘1乘n减1的i。n减1乘n减1，对吧。好的，好的，酷。这就是，好的。所以，牛顿步。","start":1419.23,"end":1449.44},{"id":65,"text":"You can also directly get, you can actually directly get the Newton step from the KKT system, not by doing this reduction, right? And so to do that, you form this system. And this is just literally, this is the definition of the Newton step. And it's lots of cool interpretations of it. One is this, you'd say, well, I want to minimize this smooth function subject to AX equals B. And someone says, cool.","zh":"你也可以直接得到，实际上可以直接从KKT系统得到牛顿步，而不需要进行这种降维，对吧？因此，为了做到这一点，你形成这个系统。而这正是牛顿步的定义。它有很多精彩的解释。其中一个解释是，你会说，我想最小化这个光滑函数，满足AX等于B。有人会说，酷。","start":1451.11,"end":1476.03},{"id":66,"text":"Please take your function f and make a second order Taylor expansion, which is going to be a constant plus a linear term plus a quadratic, convex quadratic. And then you say you want to minimize that subject to ax equals b. But that matches something you have a solver for. It's called linear out. It's called use form a KKT system and solve it. Right. So that's that's one interpretation of what this is. Another interpretation is pretty cool is that the so-called this Newton step here.","zh":"请拿你的函数f，并做一个二阶泰勒展开，这将是一个常数项加上一个线性项加上一个二次项，即凸二次项。然后你会说，我想在满足ax等于b的条件下最小化这个。但这就对应了你有一个求解器可以处理的问题。它被称为线性输出。它被称为形成一个KKT系统并求解它。对的。所以这就是这个的其中一个解释。另一个解释相当酷，就是所谓的这个牛顿步。","start":1476.73,"end":1506.41},{"id":67,"text":"actually comes from linearizing the optimality conditions. So one of the optimality conditions is already linear. So no linearization is needed here. It's already just a set of linear equations. This one is going to have to be approximated. So we'll approximate this by its first order expansion of the gradient.","zh":"实际上来自于对最优性条件进行线性化。因此，其中一个最优性条件已经是线性的。因此这里不需要进行线性化。它已经是一组线性方程。这个需要进行近似。我们将通过梯度的一阶展开来近似它。","start":1507.24,"end":1534.28}],"notes":["本段主要讲解牛顿步与KKT系统的关系，强调牛顿步可以通过直接求解KKT系统得到，而不需要进行其他形式的简化。讲者提到，牛顿步的定义是通过构造KKT系统来实现的，这为后续的优化问题提供了理论基础。","讲者进一步解释了牛顿步的另一种理解方式，即通过将目标函数进行二阶泰勒展开，并将其最小化，同时满足约束条件。这种做法与KKT系统求解方法相呼应，说明了牛顿步在优化问题中的实际应用。","讲者还提到，某些最优性条件已经是线性的，因此不需要进行线性化处理，而另一些条件则需要通过梯度的一阶展开进行近似。这说明了牛顿步在处理不同类型的约束条件时的灵活性。","讲者通过举例说明，当目标函数是光滑函数且存在线性约束时，牛顿步可以通过构造KKT系统直接求解，这为实际应用提供了明确的步骤。","讲者强调了牛顿步在优化问题中的重要性，特别是在处理大规模问题时，牛顿步的高效性使其成为一种重要的求解方法。","讲者还提到，使用NumPy等工具进行计算时，如果效率低下，可能是因为没有正确应用牛顿步等优化方法，这提醒学习者在实际应用中要注意选择合适的算法。"],"formulas":[],"uncertainties":["f of then capital F z plus x hat"],"diagram":"none","start":1363.3,"end":1534.28,"asr_flags":[],"math_clarifications":["原文中提到的公式是目标函数的二阶泰勒展开式，但未明确其适用条件或上下文，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1363.3,"text":"You should be able to look at that and say to someone, I can solve that in linear time. And they would say, wow, how do you do that? I thought Newton, I'm using like, you know, SGD because it's too big or I don't blah, blah, blah. And you're like, no, no, they go, but I have a million variables. And you're like, too bad, I can do it on my phone. Okay, everyone following this? So these are extremely good things to know about, right? So, because..."},{"start":1390.6,"text":"I don't know, every day there's people who don't know these things making the wrong conclusion, arriving somewhere and saying, oh, I tried like NumPy and it was too slow or something. Yes? Sorry, what is the point of the f matrix? Because I don't see it in the refuse problem. Oh, it is here. What I've written here, this is actually, this is literally, you know, it's the original f of then capital F z plus x hat."},{"start":1419.23,"text":"So, I'm just writing it out in its more natural form. But that's exactly what it is, right? In fact, you can sort of see that, right? Here, with this one. The f has an i stacked on top of a minus ones. Here's the minus ones. And here's, like, the i. That's an n by 1 by n minus 1 i. n minus 1 by n minus 1, yeah. Okay, okay, cool. This is, okay. So, the Newton step."},{"start":1451.11,"text":"You can also directly get, you can actually directly get the Newton step from the KKT system, not by doing this reduction, right? And so to do that, you form this system. And this is just literally, this is the definition of the Newton step. And it's lots of cool interpretations of it. One is this, you'd say, well, I want to minimize this smooth function subject to AX equals B. And someone says, cool."},{"start":1476.73,"text":"Please take your function f and make a second order Taylor expansion, which is going to be a constant plus a linear term plus a quadratic, convex quadratic. And then you say you want to minimize that subject to ax equals b. But that matches something you have a solver for. It's called linear out. It's called use form a KKT system and solve it. Right. So that's that's one interpretation of what this is. Another interpretation is pretty cool is that the so-called this Newton step here."},{"start":1507.24,"text":"actually comes from linearizing the optimality conditions. So one of the optimality conditions is already linear. So no linearization is needed here. It's already just a set of linear equations. This one is going to have to be approximated. So we'll approximate this by its first order expansion of the gradient."}],"speech_gaps":[],"frame":"../frames/v015/009.webp","frame_time":1375.3},{"title":"牛顿法与可行性下降方法","segments":[{"id":68,"text":"which is, of course, related to the second-order expansion of the function, and we get something like this, right? So you can say that the Newton step is something like this. It's a delta x and a w, for which, if you were to take that step, and if your original function was quadratic, that would actually just be the optimal solution, right? That would just be the solution. Everybody?","zh":"这当然与函数的二阶展开有关，我们得到类似这样的结果，对吧？因此，你可以这样说，牛顿步长就是这样的形式。它是一个delta x和一个w，如果你采取这一步，并且原来的函数是二次的，那么这实际上就是最优解，对吧？这就是解。大家明白吗？","start":1534.86,"end":1561.14},{"id":69,"text":"Got this? So this is the Newton step. Okay. The Newton decrement, we saw this before in the unconstrained case, right? And it turns out you can write it lots of different ways, but it is the norm of the Newton step in the metric given by the Hessian. But maybe a better way is this. It basically says it's the one half lambda squared.","zh":"明白了？所以这就是牛顿步长。好的。牛顿减量，我们在无约束情况下之前见过，对吧？结果发现你可以用很多不同的方式来表示它，但它是在Hessian矩阵定义的度量下的牛顿步长的范数。但也许更好的方式是这样的。它基本上表示的是1/2乘以lambda的平方。","start":1562.08,"end":1590.31},{"id":70,"text":"is actually the predicted decrease in f if you took the Newton step and if the function were quadratic, so that it was exact. So it's actually, as a practical matter, a very good approximation of how far from suboptimal you are.","zh":"实际上，这是如果你采取牛顿步长并且函数是二次的（即精确的），那么函数值的预测下降量。因此，从实际应用的角度来看，它是一个非常好的近似值，用来衡量你离最优解有多远。","start":1591.05,"end":1611.61},{"id":71,"text":"And now we get Newton's method. So here it is. You start with something that's feasible. So AX equals B and X is in the domain. And you compute the Newton step and decrement. You stop. Otherwise, you do a line search by backtracking and then you update. Actually, you might ask, how is this algorithm different from Newton's method without equality constraints? Reasonable question. The answer is, it's not. They're identical. It's just the same.","zh":"现在我们得到了牛顿法。这里就是它的形式。你从一个可行点开始，即满足AX等于B且X在可行域内。然后你计算牛顿步长和减量。你停止。否则，你通过回溯法进行线搜索，然后更新。实际上，你可能会问，这个算法与没有等式约束的牛顿法有什么不同？这是个合理的问题。答案是，没有不同。它们是完全相同的。","start":1613.1,"end":1641.22},{"id":72,"text":"What's different is, for example, when you compute the Newton step, if you have equality constraints, you're actually solving that KKT system, not just with the Hessian. But it's just exactly the same, right? So that's the idea. And this is a so-called feasible descent method. What happens is XK, of course, X0 is feasible because you have to start it with AX, something that satisfies AX equals B, and it's in the domain. You're always in the domain, always have AX equals B.","zh":"不同的地方在于，例如，当你计算牛顿步长时，如果你有等式约束，你实际上是在求解KKT系统，而不仅仅是Hessian矩阵。但本质上是一样的，对吧？这就是这个想法。这种方法被称为可行下降法。发生的情况是，Xk当然，X0是可行的，因为你必须从满足AX等于B且在可行域内的点开始。你始终在可行域内，始终满足AX等于B。","start":1641.86,"end":1670.75},{"id":73,"text":"And in fact, not only that, but the function value goes down. And this algorithm is affine invariant. So if you change coordinates or rescale the variables, at least to first, it doesn't make any difference at all. You get exactly the same number of iterates, the same iterates. Okay, so that's Newton's method. What's cool is that we don't need any more, we don't need no more analysis of it. And the reason is this. It turns out...","zh":"事实上，不仅如此，函数值还会下降。并且这个算法是仿射不变的。因此，如果你改变坐标或重新缩放变量，至少在第一阶上，它没有任何区别。你得到的迭代次数和迭代步骤完全相同。好的，所以这就是牛顿法。有趣的是，我们不需要再对它进行更多的分析。原因在于，事实上...","start":1672.26,"end":1698.42}],"notes":["本段讲解了牛顿法中的牛顿减量（Newton decrement）概念，它表示在二次函数情况下，牛顿步所预测的函数值下降量。牛顿减量可以表示为牛顿步在Hessian矩阵定义的度量下的范数，或者更简洁地表示为半lambda平方。这为判断当前点与最优解的距离提供了实用的近似值。","接下来，课程介绍了牛顿法的实现过程，强调了在有等式约束的情况下，牛顿步需要求解KKT系统，而不是仅仅使用Hessian矩阵。尽管如此，有约束和无约束的牛顿法在本质上是相同的，只是在计算过程中需要考虑约束条件。","课程进一步指出，牛顿法是一种可行下降方法（feasible descent method），即在每次迭代中保持可行性，即满足约束条件AX = B且在可行域内。初始点必须是可行的，且在后续迭代中始终保持可行性。","此外，课程提到牛顿法具有仿射不变性（affine invariance），即在坐标变换或变量缩放后，迭代次数和迭代点保持不变。这表明牛顿法在不同坐标系下具有良好的鲁棒性。","最后，课程指出，牛顿法不需要进一步的分析，因为其收敛性和性质已经被充分研究，无需额外的理论支持。这为后续的优化算法分析奠定了基础。","课程通过牛顿法的实现细节，强调了在有约束优化问题中，如何将牛顿法与KKT条件结合，以及如何保持算法的可行性与收敛性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1534.86,"end":1698.42,"asr_flags":[],"math_clarifications":["原始文本中未明确提及任何具体的数学公式，因此无法核对或修正任何公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1534.86,"text":"which is, of course, related to the second-order expansion of the function, and we get something like this, right? So you can say that the Newton step is something like this. It's a delta x and a w, for which, if you were to take that step, and if your original function was quadratic, that would actually just be the optimal solution, right? That would just be the solution. Everybody?"},{"start":1562.08,"text":"Got this? So this is the Newton step. Okay. The Newton decrement, we saw this before in the unconstrained case, right? And it turns out you can write it lots of different ways, but it is the norm of the Newton step in the metric given by the Hessian. But maybe a better way is this. It basically says it's the one half lambda squared."},{"start":1591.05,"text":"is actually the predicted decrease in f if you took the Newton step and if the function were quadratic, so that it was exact. So it's actually, as a practical matter, a very good approximation of how far from suboptimal you are. Okay, so this is the Newton decrement."},{"start":1613.1,"text":"And now we get Newton's method. So here it is. You start with something that's feasible. So AX equals B and X is in the domain. And you compute the Newton step and decrement. You stop. Otherwise, you do a line search by backtracking and then you update. Actually, you might ask, how is this algorithm different from Newton's method without equality constraints? Reasonable question. The answer is, it's not. They're identical. It's just the same."},{"start":1641.86,"text":"What's different is, for example, when you compute the Newton step, if you have equality constraints, you're actually solving that KKT system, not just with the Hessian. But it's just exactly the same, right? So that's the idea. And this is a so-called feasible descent method. What happens is XK, of course, X0 is feasible because you have to start it with AX, something that satisfies AX equals B, and it's in the domain. You're always in the domain, always have AX equals B."},{"start":1672.26,"text":"And in fact, not only that, but the function value goes down. And this algorithm is affine invariant. So if you change coordinates or rescale the variables, at least to first, it doesn't make any difference at all. You get exactly the same number of iterates, the same iterates. Okay, so that's Newton's method. What's cool is that we don't need any more, we don't need no more analysis of it. And the reason is this. It turns out..."}],"speech_gaps":[],"frame":"../frames/v015/010.webp","frame_time":1546.86},{"title":"牛顿法与约束消除的等价性","segments":[{"id":74,"text":"If you apply Newton's method to this, where you eliminate the equality constraints like this, if you work out what it is, it turns out it is identical to just running Newton's method, right? So it's actually just exactly the same thing, right?","zh":"如果你将牛顿法应用到这个问题中，并像这样消除等式约束，当你计算出结果时，你会发现它实际上等同于直接运行牛顿法，对吧？所以它实际上就是完全相同的事情，对吧？","start":1698.66,"end":1717.94},{"id":75,"text":"Everything is the same. The iterates are identical, the primal iterates, the dual iterates. The stopping, the lambda is the same. So it basically, that means we need, we can actually pull in the proof of convergence from whatever, last lecture, right? So that's all we need. Okay, so we don't ever have to, we're not going to talk about, like, does it converge and all that kind of stuff. The answer is yeah, it does.","zh":"一切都是一样的。迭代过程是相同的，原问题的迭代和对偶问题的迭代也是如此。停止条件和λ也是相同的。这意味着我们实际上可以从上一节课的收敛性证明中直接引用，对吧？所以这就是我们所需要的一切。好的，所以我们永远不需要，也不会讨论诸如是否收敛之类的问题。答案是肯定的，它确实会收敛。","start":1718.87,"end":1743.19},{"id":76,"text":"And we'll see, then you'd say, well, what would be the difference between these two, right? And this gets you into the usual thing, right? If you, in this case, you say, well, I'm eliminating, and so I'm solving, let's say you have 1,000 variables and 100 constraints, right? Then you'd say, someone would say, what are you doing? You'd say, well, I'm solving, I've eliminated the equality constraint, so I'm solving a problem with 900 variables. Everybody following this?","zh":"然后我们会看到，你可能会问，这两者之间有什么区别呢？对吧？这就涉及到通常的情况，对吧？在这种情况下，你说，我正在消除约束，因此我正在求解，比如说，你有1,000个变量和100个约束，对吧？然后你可能会说，你在做什么？你会回答，我在求解，我已经消除了等式约束，因此我正在求解一个有900个变量的问题。大家都能跟上吗？","start":1744.51,"end":1769.07},{"id":77,"text":"And you'd say, well, what are you doing? And you go, yeah, I'm solving a problem with 1,100 variables. Everybody got this, right? So that's if you solve the KKT system, right? Because it's a 1,000 by 1,000 block stacked on top of a 100 by 1,000 A matrix, okay? So someone else would look at them and say, but wait a minute. Last time I checked, 1,100 cubed is bigger than 900 cubed.","zh":"你可能会问，你在做什么？你会回答，是的，我正在解决一个具有1,100个变量的问题。大家明白了吗？对吧？所以这就是如果你解决KKT系统的情况，对吧？因为这是一个1,000乘1,000的块矩阵叠加在一个100乘1,000的A矩阵上，对吧？所以另一个人可能会看着它们并说，等等。上次我检查的时候，1,100的立方比900的立方更大。","start":1770.16,"end":1797.98},{"id":78,"text":"And you'd say, it is, you're right. But what we'll find is actually that it's almost always better to solve the bigger system, right? So this is the other thing. If someone comes up to you, I mean, the matrices have no structure at all. Obviously, you'd prefer to solve a smaller system of equations. But when there's structure, this is generally speaking completely false, right? So, and it's not intuitive. So, okay.","zh":"你会说，是的，你说得对。但我们会发现，实际上通常解决更大的系统会更好，对吧？这就是另一个问题。如果有人过来对你说，这些矩阵没有任何结构。显然，你更倾向于解决一个更小的方程组。但当存在结构时，这通常完全不成立，对吧？而且这并不直观。好的。","start":1798.5,"end":1826.1},{"id":79,"text":"Okay. Aha. So now we're getting to something which is related to something you'll do in your homework, is the so-called infeasible start Newton method, right? And what it does is it's actually a simple extension. Before, we assumed that x was feasible, and so ax minus b was zero, right? Then this just says, well, suppose you're not zero. What is the Newton step, right?","zh":"好的。啊，现在我们谈到的内容与你们将在作业中完成的内容相关，也就是所谓的不可行初始点牛顿法，对吧？它的做法实际上是简单的扩展。之前我们假设x是可行的，因此ax减b等于零，对吧？那么现在就提出一个问题：假设你不是零，那么牛顿步是什么，对吧？","start":1828.15,"end":1857.78}],"notes":["本段讨论了牛顿法在处理带有等式约束的优化问题时，通过消除约束条件后与直接应用牛顿法的等价性。讲者指出，当消除约束后，虽然变量数量减少，但实际求解的系统规模可能更大，这取决于问题的结构。","讲者通过一个具体的例子说明，当有1000个变量和100个约束时，消除约束后的问题变量数为900，但若考虑KKT系统，则变量数为1100。这表明，虽然变量数减少，但实际求解的系统规模可能更大。","讲者进一步指出，
