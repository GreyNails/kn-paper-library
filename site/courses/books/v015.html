存储完整的矩阵。"],"formulas":[{"latex":"L = D - A","symbols":"L表示Laplacian矩阵，D是对角线矩阵，A是邻接矩阵","explanation":"公式正确，Laplacian矩阵定义为度数矩阵D减去邻接矩阵A，符合图论中的标准定义。","evidence":"we will do some elimination here. And you'll end up computing, forming this matrix here. By the way, this matrix is, if you've heard of it, it's a Laplacian matrix, right? So in circuits, this would be literally the conductance matrix. Again, that's how you'd say it in EE. But in other fields, it's got other names, right? So this is a conductance matrix, or a Laplacian. Laplacian means the diagonals are positive, the off diagonals,"},{"latex":"\\sum_{j} L_{ij} = 0","symbols":"Laplacian矩阵的每行元素之和为零","explanation":"公式正确，Laplacian矩阵的每行元素之和为零是其基本性质之一，符合图论中的定义。","evidence":"are non-positive, and the sum of each row is going to be zero. That's if we don't do the reduced one, but that's fine. Actually, if we do the reduced one, it's fine too. Everybody got that? By the way, this thing here, solving so-called Laplacian equations like this, that's like a whole sub-industry, mostly theoretical computer science."}],"uncertainties":["Schur complement的定义是否完整"],"diagram":"none","start":3517.15,"end":3682.65,"asr_flags":[],"math_clarifications":["公式1缺少非对角线元素的描述，且符号不完整，无法正确表达Laplacian矩阵的性质。公式3缺少上下文和必要的条件，无法准确判断其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3517.15,"text":"And they'd say, yeah, but I have like a million X's and 10 million. I have a million nodes and in my power network and I have, you know, 10 million edges. Really? And you go, yeah. They'll say, are you going to use a gradient method? And you're like, no, dude, we're going full Newton on this. Right. And they're like, how could you do it? You see what I'm saying? Right. There's still people stuck in this mindset. Actually, I'd say the vast majority would not know this. Right. So anyway."},{"start":3544.15,"text":"And you'd say, yeah. They'd say, well, how can you do that? You can't even form the Hessian. And you're right. You'd say, yeah, you're right. I'm not going to form the Hessian. I'm going to solve a KKT system. I'm going to exploit the structure, and I'll be able to do it fast, and that's how. Okay. Okay. So here it is. That's our diagonal part of the Hessian."},{"start":3567.44,"text":"we will do some elimination here. And you'll end up computing, forming this matrix here. By the way, this matrix is, if you've heard of it, it's a Laplacian matrix, right? So in circuits, this would be literally the conductance matrix. Again, that's how you'd say it in EE. But in other fields, it's got other names, right? So this is a conductance matrix, or a Laplacian. Laplacian means the diagonals are positive, the off diagonals,"},{"start":3596.62,"text":"are non-positive, and the sum of each row is going to be zero. That's if we don't do the reduced one, but that's fine. Actually, if we do the reduced one, it's fine too. Everybody got that? By the way, this thing here, solving so-called Laplacian equations like this, that's like a whole sub-industry, mostly theoretical computer science."},{"start":3626.14,"text":"If you type that into Google, you'll find lots of stuff. Mostly, to be perfectly bluntly honest about it, completely and utterly useless. There are very good methods to do it that are not those. Okay, so let's see. You can even say this thing, this Laplacian matrix, is actually, we know the sparsity pattern of it immediately, which is really cool. It's basically this."},{"start":3654.55,"text":"This is, it's basically nodes by nodes. So if I had, you know, a million nodes, this would be a million by million matrix. But what it says is that nodes I and J, it's only if they're connected by an arc, would it be true that this matrix here, the Schur complement, is going to have a non-zero. Okay? So if I told you my original power network had 10 million nodes, a million nodes, 10 million edges,"}],"speech_gaps":[],"frame":"../frames/v015/022.webp","frame_time":3529.15},{"title":"稀疏矩阵与大规模优化问题","segments":[{"id":163,"text":"Suppose I told you that there weren't weird things where there's not one thing with 50,000 edges adjacent to it. If I said, look, the degree of a node varies between 2 and 50, then that tells you that the number of non-zeros in this matrix per row is between 10 and 50. Everybody following this? That's going to qualify as a sparse matrix.","zh":"假设我告诉你，在没有一个节点有50,000条边相连的地方，情况并不奇怪。如果我说，一个节点的度数在2到50之间变化，那么这就告诉你，这个矩阵每行的非零元素数量在10到50之间。大家跟得上吗？这将被归类为一个稀疏矩阵。","start":3683.93,"end":3710.49},{"id":164,"text":"Everybody following this? So what it means is that you can solve network flow optimization problems for, I don't know, very large problems if you want and if you know how to do it. Did all that make sense? Yeah.","zh":"大家跟得上吗？这意味着，如果你想要并知道如何操作，你可以解决非常大的网络流优化问题。刚才说的这些都讲得通吗？是的。","start":3713.28,"end":3735.71},{"id":165,"text":"Okay, we'll look at something, this is a little bit more esoteric, but just to show you that the ideas, I mean, you just use these ideas whenever you can, right? So on any specific problem, you work out what they are. So here's one where our variable is actually a matrix capital X, right? Which is, it's n by n, my matrix, right? So...","zh":"好的，我们将看一下一些东西，这稍微有点晦涩，但只是为了展示这些想法，我的意思是，你只要在能用的时候就使用这些想法，对吧？所以在任何具体的问题上，你都要计算出这些内容。这里有一个例子，我们的变量实际上是一个矩阵大X，对吧？它是一个n乘n的矩阵，对吧？所以……","start":3739.26,"end":3761.46},{"id":166,"text":"one option for this would be to string out all the entries of x. x is symmetric, so there would be n(n plus 1)/2 entries if I vectorized x, right? Because that's the number of distinct elements in a symmetric matrix, right? So then I could compute the Hessian, which would be an n(n plus 1)/2 by n(n plus 1)/2 matrix. Everybody following this? So that's got n to the fourth entries in it.","zh":"一种选择是将x的所有元素展开。x是对称的，因此如果我将x向量化，就会有n(n加1)/2个元素，对吧？因为这是对称矩阵中不同元素的数量，对吧？然后我可以计算Hessian矩阵，它将是一个n(n加1)/2乘n(n加1)/2的矩阵。大家跟得上吗？所以这个矩阵中有n的四次方个元素。","start":3762.79,"end":3791.55},{"id":167,"text":"right? Then if I just naively, well, then I stack A on top of it, right? I'd form a KKT system, right? Anyway, I'd end up with a giant matrix that was basically n to the fourth by n to the fourth. Everybody following this? So, you know, something n equals 200 is going to be a kind of a showstopper or something like that, right? Because it's just going to be too big.","zh":"对吧？然后如果我简单地将A堆叠在上面，对吧？我会形成一个KKT系统，对吧？不管怎样，我最终会得到一个巨大的矩阵，其规模大约是n的四次方乘n的四次方。大家跟得上吗？所以，比如n等于200的情况，将会是一个难以处理的问题，对吧？因为这将太大了。","start":3792.74,"end":3818.4},{"id":168,"text":"Right? But in theory it would work. You could actually do this, run this, and then reassemble x into a matrix and all that. So it turns out we'll do a lot better than that. By the way, each Newton step there would cost you n to the sixth. Here's why.","zh":"对吧？但在理论上这是可行的。你实际上可以这么做，运行这个过程，然后重新将x组装成一个矩阵。结果发现，我们能做得比这好得多。顺便说一句，每个牛顿步将需要你n的六次方的计算量。这是为什么。","start":3819.18,"end":3835.06},{"id":169,"text":"the number of variables is really n squared, right? Because I used n to say x is n by n. It's n squared over two, roughly, right? Then if I form this matrix, my storage is going to be n to the fourth, and the computation per iteration is going to be what would normally be, it's the size of the matrix cubed, but if that's n squared, that's going to be n to the sixth. Everybody following this? So, okay, that would be bad. By the way, you might ask, you know, who uses this kind of stuff? This comes up.","zh":"变量的数量真的会是n的平方，对吧？因为我在说x是n乘n的矩阵。大概来说，是n平方除以二，对吧？然后如果我构造这个矩阵，我的存储量将会是n的四次方，而每次迭代的计算量将会是通常的矩阵大小的立方，但如果这个矩阵的大小是n平方，那计算量就会变成n的六次方。大家都能跟上吗？所以，这样显然是不好的。顺便说一句，你们可能会问，谁会用这种东西？这种情况确实会出现。","start":3835.96,"end":3861.86}],"notes":["本段讨论了稀疏矩阵的概念，指出如果一个矩阵的每行非零元素数量在10到50之间，那么它就可以被视为稀疏矩阵。这在解决大规模网络流优化问题时非常重要，因为稀疏矩阵可以显著减少计算复杂度。","接着，讲者提到在处理大规模优化问题时，如果直接使用传统方法，如将矩阵展开为向量并计算Hessian矩阵，会导致存储和计算复杂度急剧上升，例如存储需求为n^4，计算复杂度为n^6，这在n=200时会变得不可行。","讲者进一步指出，虽然理论上可以这样做，但实际应用中会采用更高效的方法，例如利用对称性减少变量数量，从而降低计算和存储需求。","此外，讲者提到，虽然直接展开矩阵的方法在理论上可行，但在实际应用中，由于计算和存储的限制，这种方法并不实用，因此需要寻找更高效的替代方案。","最后，讲者提到，尽管这种方法在某些情况下可能被使用，但通常会采用更优化的方法来处理大规模问题，例如利用稀疏性或结构化方法。","整个段落强调了稀疏矩阵在优化问题中的重要性，以及直接展开矩阵方法的局限性，同时指出实际应用中需要更高效的算法来处理大规模问题。"],"formulas":[{"latex":"\\frac{n(n + 1)}{2}","symbols":"对称矩阵的非零元素数量","explanation":"该公式正确计算了对称矩阵中独立元素的数量，即n(n+1)/2，适用于n×n对称矩阵。","evidence":"one option for this would be to string out all the entries of x. x is symmetric, so there would be n n plus 1 over 2 entries if I vectorized x, right? Because that's the number of distinct elements in a symmetric matrix, right? So then I could compute the Hessian, which would be an n n plus 1 over 2 by n n plus 1 over 2 matrix. Everybody following this? So that's got n to the fourth entries in it."},{"latex":"n^4","symbols":"存储需求","explanation":"该公式正确表示了存储对称矩阵向量化后的向量长度，即n(n+1)/2，但原文中提到存储需求为n^4，这可能是指存储整个矩阵的大小，因此保留。","evidence":"right? Then if I just naively, well, then I stack A on top of it, right? I'd form a KKT system, right? Anyway, I'd end up with a giant matrix that was basically n to the fourth by n to the fourth. Everybody following this? So, you know, something n equals 200 is going to be a kind of a showstopper or something like that, right? Because it's just going to be too big."},{"latex":"n^6","symbols":"计算复杂度","explanation":"该公式正确表示了计算复杂度，即矩阵的立方，适用于n^2大小的矩阵，因此保留。","evidence":"Right? But in theory it would work. You could actually do this, run this, and then reassemble x into a matrix and all that. So it turns out we'll do a lot better than that. By the way, each Newton step there would cost you n to the sixth. Here's why."}],"uncertainties":[],"diagram":"none","start":3683.93,"end":3861.86,"asr_flags":[],"math_clarifications":["原文中提到的存储需求为n^4，可能是指存储整个矩阵的大小，而非向量化后的向量长度。计算复杂度n^6是基于矩阵大小为n^2的假设，因此保留。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3683.93,"text":"Suppose I told you that there weren't weird things where there's not one thing with 50,000 edges adjacent to it. If I said, look, the degree of a node varies between 2 and 50, then that tells you that the number of non-zeros in this matrix per row is between 10 and 50. Everybody following this? That's going to qualify as a sparse matrix."},{"start":3713.28,"text":"Everybody following this? So what it means is that you can solve network flow optimization problems for, I don't know, very large problems if you want and if you know how to do it. Did all that make sense? Yeah."},{"start":3739.26,"text":"Okay, we'll look at something, this is a little bit more esoteric, but just to show you that the ideas, I mean, you just use these ideas whenever you can, right? So on any specific problem, you work out what they are. So here's one where our variable is actually a matrix capital X, right? Which is, it's n by n, my matrix, right? So..."},{"start":3762.79,"text":"one option for this would be to string out all the entries of x. x is symmetric, so there would be n n plus 1 over 2 entries if I vectorized x, right? Because that's the number of distinct elements in a symmetric matrix, right? So then I could compute the Hessian, which would be an n n plus 1 over 2 by n n plus 1 over 2 matrix. Everybody following this? So that's got n to the fourth entries in it."},{"start":3792.74,"text":"right? Then if I just naively, well, then I stack A on top of it, right? I'd form a KKT system, right? Anyway, I'd end up with a giant matrix that was basically n to the fourth by n to the fourth. Everybody following this? So, you know, something n equals 200 is going to be a kind of a showstopper or something like that, right? Because it's just going to be too big."},{"start":3819.18,"text":"Right? But in theory it would work. You could actually do this, run this, and then reassemble x into a matrix and all that. So it turns out we'll do a lot better than that. By the way, each Newton step there would cost you n to the sixth. Here's why."},{"start":3835.96,"text":"the number of variables is really n squared, right? Because I used n to say x is n by n. It's n squared over two, roughly, right? Then if I form this matrix, my storage is going to be n to the fourth, and the computation per iteration is going to be what would normally be, it's the size of the matrix cubed, but if that's n squared, that's going to be n to the sixth. Everybody following this? So, okay, that would be bad. By the way, you might ask, you know, who uses this kind of stuff? This comes up."}],"speech_gaps":[],"frame":"../frames/v015/023.webp","frame_time":3695.93},{"title":"矩阵求逆的优化条件与牛顿方法","segments":[{"id":170,"text":"Oh, I could give an interpretation of that in probability and stochastic processes. I could, this in control, things like this come up all the time. This has, but it comes up. So things like this, people actually do solve. Okay, now we'll do it the right way. So the right way is to write down the optimality conditions here for this problem. Oh, and the truth is you don't want to calculate the Hessian of the determinant of the inverse of a matrix, right?","zh":"哦，我可以从概率和随机过程的角度来解释这一点。我也可以在控制领域，像这样的问题经常出现。这确实会出现，人们实际上确实会解决这些问题。好的，现在我们用正确的方法来做。正确的方法是为这个问题写出最优性条件。哦，事实上，你不想计算矩阵逆的行列式的Hessian矩阵，对吧？","start":3862.3,"end":3891.58},{"id":171,"text":"I can tell you what it is, but you do not want to write it out, right? Actually, you can't. You can write it out as an abstract linear operator pretty easily. But let's look how this works. So the conditions are that, I mean, it's got to be positive definite, otherwise this makes no sense, right? And then the gradient of this I'm not too afraid of because that's minus x inverse, right? So that's the gradient. The Hessian is not too bad either.","zh":"我可以告诉你它是什么，但你不想把它写出来，对吧？实际上，你无法写出它的具体形式。你可以把它写成一个抽象的线性算子，这相对容易。但让我们看看它是如何工作的。这些条件是，我指的是，它必须是正定的，否则这没有意义，对吧？然后这个函数的梯度我并不太害怕，因为它是负的x逆，对吧？这就是梯度。Hessian矩阵也不太糟糕。","start":3893.07,"end":3921.49},{"id":172,"text":"But, okay, so I write this out like this. And so these are the equations I really want to solve. And in fact, what the Newton method is doing is it's actually just linearizing.","zh":"不过，好的，我这样写出这些方程。这些就是我真正想解决的方程。事实上，牛顿方法所做的就是对其进行线性化。","start":3923.74,"end":3937.34},{"id":173,"text":"These are linear. They don't need to be linearized, right? These are not linear because of this, and you just linearize that. When you linearize this, you end up with that. That's the derivative of the inverse of a matrix. And it makes sense, right? Because minus 1 over x, if you take the derivative of that, is 1 over x squared. That's for scalars. For matrices, it's hardly... Then the only question is, how do you say x?","zh":"这些是线性的。它们不需要被线性化，对吧？这些不是线性的，因为有这个项，你只需要对这个项进行线性化。当你对这个进行线性化时，你会得到那个结果。这就是矩阵逆的导数。这在逻辑上是合理的，对吧？因为对于标量，-1/x 的导数是 1/x²。对于矩阵来说，情况就复杂得多。那么唯一的问题是，如何表达矩阵中的 x²？","start":3937.94,"end":3966.03},{"id":174,"text":"whatever x squared in matrices, right? There were too many ways, but this is the way to do it, okay? So you get that. So we have to solve these equations here. And remember, we're going to try to find this matrix delta x, and we're going to try to find these dual variables wj, right? Okay, so this is the idea. And you have a bunch of variables. You have basically n squared variables.","zh":"不管怎样，矩阵中的 x² 有太多方式，但这是正确的方法，对吧？所以你会得到这个结果。因此，我们必须解决这些方程。请记住，我们要找的是这个矩阵 delta x，以及这些对偶变量 wj，对吧？好的，这就是这个想法。你有一组变量，基本上有 n² 个变量。","start":3966.81,"end":3996.32},{"id":175,"text":"And all we're doing is like, this is just block elimination, but doing it manually for this particular problem. So what you do is you eliminate delta x from the first equation by multiplying. You go back over here. You multiply this equation by x on the left and the right. And you'll get like an x and x over here. This will become x, and this will become delta x over here.","zh":"我们所做的只是块消元，但这是针对这个问题手动进行的。你所做的就是通过乘法消去第一个方程中的delta x。你回到这里，将这个方程在左右两边都乘以x。这样你会在这里得到一个x和一个x，这会变成x，而这里会变成delta x。","start":3996.89,"end":4026.03},{"id":176,"text":"And you end up with this equation here. Then you substitute that in the second equation and you get this system of equations here. And that's a dense positive definite system of linear equations which you then solve. But if you work out the whole thing...","zh":"你最终会得到这里的方程。然后你将它代入第二个方程，得到这里的方程组。这是一个密集的正定线性方程组，你随后解决它。但如果你把整个过程算出来……","start":4026.57,"end":4041.77}],"notes":["本段讲授了如何通过优化条件来求解矩阵逆的问题，特别是涉及牛顿方法的应用。讲者指出，直接计算矩阵逆的Hessian矩阵是不现实的，因为其复杂度很高，但可以通过抽象线性算子来表示。同时，讲者强调了正定性的重要性，因为这是优化问题成立的前提条件。","讲者提到梯度的计算相对简单，因为它是矩阵的逆，而Hessian矩阵虽然复杂，但可以通过线性化处理。这表明在处理矩阵优化问题时，梯度和Hessian的计算是关键步骤。","牛顿方法的核心思想是线性化非线性方程，从而将问题转化为线性系统。讲者指出，虽然这些方程本身不是线性的，但通过线性化可以得到一个线性系统，进而求解。","在处理矩阵的导数时，讲者以标量的导数为例，说明了如何推广到矩阵的情况。这表明矩阵导数的计算需要特别注意其定义和性质，不能简单地套用标量的规则。","讲者提到，求解这些方程需要引入变量delta x和dual variables wj，这表明这是一个涉及多个变量的优化问题，且变量数量可能达到n²的规模。","最后，讲者介绍了如何通过块消元法手动求解这些方程，具体步骤包括通过乘以矩阵x来消除delta x，并代入第二个方程，从而得到一个稠密的正定线性系统。这表明在实际操作中，需要系统地处理这些方程，以找到最优解。"],"formulas":[],"uncertainties":["在讲者提到矩阵导数时，'whatever x squared in matrices'的具体含义不明确，可能是对矩阵平方的某种定义，但未明确说明。"],"diagram":"none","start":3862.3,"end":4041.77,"asr_flags":[],"math_clarifications":["公式0和1未明确梯度是标量还是矩阵的梯度，且在矩阵情况下缺少上下文。公式2在一般情况下不成立，除非矩阵满足特定条件。所有公式均需进一步澄清或补充信息。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3862.3,"text":"Oh, I could give an interpretation of that in probability and stochastic processes. I could, this in control, things like this come up all the time. This has, but it comes up. So things like this, people actually do solve. Okay, now we'll do it the right way. So the right way is to write down the optimality conditions here for this problem. Oh, and the truth is you don't want to calculate the Hessian of the determinant of the inverse of a matrix, right?"},{"start":3893.07,"text":"I can tell you what it is, but you do not want to write it out, right? Actually, you can't. You can write it out as an abstract linear operator pretty easily. But let's look how this works. So the conditions are that, I mean, it's got to be positive definite, otherwise this makes no sense, right? And then the gradient of this I'm not too afraid of because that's minus x inverse, right? So that's the gradient. The Hessian is not too bad either."},{"start":3923.74,"text":"But, okay, so I write this out like this. And so these are the equations I really want to solve. And in fact, what the Newton method is doing is it's actually just linearizing."},{"start":3937.94,"text":"These are linear. They don't need to be linearized, right? These are not linear because of this, and you just linearize that. When you linearize this, you end up with that. That's the derivative of the inverse of a matrix. And it makes sense, right? Because minus 1 over x, if you take the derivative of that, is 1 over x squared. That's for scalars. For matrices, it's hardly... Then the only question is, how do you say x?"},{"start":3966.81,"text":"whatever x squared in matrices, right? There were too many ways, but this is the way to do it, okay? So you get that. So we have to solve these equations here. And remember, we're going to try to find this matrix delta x, and we're going to try to find these dual variables wj, right? Okay, so this is the idea. And you have a bunch of variables. You have basically n squared variables."},{"start":3996.89,"text":"And all we're doing is like, this is just block elimination, but doing it manually for this particular problem. So what you do is you eliminate delta x from the first equation by multiplying. You go back over here. You multiply this equation by x on the left and the right. And you'll get like an x and x over here. This will become x, and this will become delta x over here."},{"start":4026.57,"text":"And you end up with this equation here. Then you substitute that in the second equation and you get this system of equations here. And that's a dense positive definite system of linear equations which you then solve. But if you work out the whole thing..."}],"speech_gaps":[],"frame":"../frames/v015/024.webp","frame_time":3874.3},{"title":"凸优化中的计算复杂度与SDP求解器","segments":[{"id":177,"text":"what's going to happen is you have various things here. p is small, right? But the main thing that's going to cost you is going to be the piece like p squared, n squared, or p n cubed, this kind of thing. And notice that the entire thing is now quadratic in n, whereas the super naive method was the sixth power in n.","zh":"接下来会发生的是，你这里有很多不同的情况。p 很小，对吧？但真正会花费你时间的是像 p 平方、n 平方，或者 p n 立方这样的部分。请注意，整个问题现在是关于 n 的二次方，而超级朴素的方法则是关于 n 的六次方。","start":4042.11,"end":4068.39},{"id":178,"text":"right, so that that's the same as going from like, you know sort of n cubed to n going from the Cubic to linear and that that's what's happened here. Once again Except the number of variables is like n squared over 2. So that's the same thing It went from n to the sixth to n squared That's a that's a that's a big difference, right?","zh":"对，所以这就相当于从大约 n 立方到 n 的变化，也就是从立方复杂度降到线性复杂度。这就是这里发生的情况。再一次强调，变量的数量大约是 n 平方除以 2。所以这相当于从 n 的六次方降到 n 平方，这确实是一个巨大的差异，对吧？","start":4069.14,"end":4096.6},{"id":179,"text":"this is what was going on in the solver, right? You don't need to know it, but that's, which is kind of the point. Okay, so this finishes up that equality constraint minimization. You will do a homework problem on it. Oh, I was going to say, it's worthwhile, you know, spend some time on it, but I would hope if you, you know, at some point, if you've been working on it for two, three hours and still debugging,","zh":"这就是求解器中发生的事情，对吧？你不需要知道这些细节，但这就是重点。好的，所以这就结束了关于等式约束最小化的内容。你将会在课后作业中处理这个问题。哦，我本来想说，这值得花一些时间去研究，但希望如果你已经花了两个小时、三个小时还在调试代码，","start":4097.86,"end":4126.89},{"id":180,"text":"you should have the sense to just step away from the keyboard, right? Hold your hands up where other people can see it and then just walk away. I just say this because I've even had people come and say, I've been working on this for hours. We'll look at the code together and I can't figure out what's wrong.","zh":"你应该有意识地离开键盘，对吧？把双手举起来让其他人看到，然后离开。我只是说这个，因为我甚至遇到过有人来跟我说，我已经在这上面花了好几个小时了。我们一起看看代码，但我还是无法找出哪里出错了。","start":4127.5,"end":4145.3},{"id":181,"text":"So, this is just slightly over the threshold where you're not writing a 10-line script. Actually, in the end, it's probably going to be like 15 lines. But it's just entirely possible that, I don't know, something... So, I'm just saying, by all means, try. But somewhere around the second or third hour, feel free to quit. That's right.","zh":"所以，这已经略微超过了你写一个 10 行脚本的范围。实际上，最后它可能大概只有 15 行。但完全有可能，我不知道，有什么地方出错了。所以，我只是说，不妨尝试一下。但大概在第二或第三个小时的时候，你可以自由地放弃。没错。","start":4146.36,"end":4170.05},{"id":182,"text":"No, just because there's no real good reason to sit there debugging something. And what you're looking for is you're looking for that quadratic conversion. When you see an error curve that goes like this and then accelerates, then you're done. Maybe. You're already seeing that, but there's some other suspicious things in your implementation, right? So, yeah. Okay, everybody cool? Okay.","zh":"不，因为没有真正好的理由让你坐在那里调试代码。你所寻找的是这种二次转换。当你看到一个误差曲线像这样，然后加速上升，你就完成了。也许吧。你已经看到了这一点，但你的实现中还有一些可疑的地方，对吧？所以，是的。好的，大家都明白了吗？好的。","start":4171.01,"end":4195.24},{"id":183,"text":"now we're going to the last uh section um so actually we're building a hierarchy uh we and we went we we went from the very low level right low levels linear algebra right um interestingly linear algebra is how you saw is how you solve quadratic optimization sir you know equality constrained quadratic minimization problems right so linear algebra you could just call it","zh":"现在我们要进入最后一个部分嗯，实际上我们正在构建一个层次结构嗯，我们已经从非常底层的线性代数开始，对吧，有趣的是，线性代数就是你解决二次优化问题的方式，你知道的，就是带有等式约束的二次最小化问题，对吧，所以线性代数你可以直接称之为","start":4197.1,"end":4219.1}],"notes":["本段主要讲解了凸优化中计算复杂度的变化，特别是从高次幂到低次幂的转变。讲者指出，当处理具有约束的二次优化问题时，计算复杂度从n的六次方降低到n的平方，这表明求解器在处理此类问题时有显著的效率提升。此外，讲者提到，这种优化过程在求解半定规划（SDP）时已经自动完成，无需用户手动干预。","讲者强调了在调试代码时的策略，建议在长时间调试无果后应暂停工作，寻求他人帮助。这反映了在实际编程中，面对复杂问题时，团队协作和及时休息的重要性。讲者还提到，当错误曲线呈现加速趋势时，可能意味着问题已解决，但需注意代码中可能存在的其他问题。","讲者提到，编写代码的复杂度可能在10到15行之间，但  not writing a 10-line script. Actually, in the end, it's probably going to be like 15 lines. But it's just entirely possible that, I don't know, something... So, I'm just saying, by all means, try. But somewhere around the second or third hour, feel free to quit. That's right."},{"start":4171.01,"text":"No, just because there's no real good reason to sit there debugging something. And what you're looking for is you're looking for that quadratic conversion. When you see an error curve that goes like this and then accelerates, then you're done. Maybe. You're already seeing that, but there's some other suspicious things in your implementation, right? So, yeah. Okay, everybody cool? Okay."},{"start":4197.1,"text":"now we're going to the last uh section um so actually we're building a hierarchy uh we and we went we we went from the very low level right low levels linear algebra right um interestingly linear algebra is how you saw is how you solve quadratic optimization sir you know equality constrained quadratic minimization problems right so linear algebra you could just call it"}],"speech_gaps":[],"frame":"../frames/v015/025.webp","frame_time":4054.11},{"title":"处理不等式约束的优化问题","segments":[{"id":184,"text":"minimizing, it's effective methods for solving, for minimizing convex quadratics subject to linear equality constraints, right? Then you say, well, now I'm showing you a method for minimizing smooth functions subject to equality constraints. Someone says, how do you do that? You go, I approximate the smooth function as a quadratic in 22 steps. That's what I do.","zh":"最小化，这是解决在等式约束下最小化凸二次问题的有效方法，对吧？然后你说，现在我正在向你展示一种在等式约束下最小化光滑函数的方法。有人问，你是怎么做到的？你会说，我将光滑函数近似为一个二次函数，分22个步骤进行。这就是我所做的。","start":4220.42,"end":4243.8},{"id":185,"text":"And you go, well, then what happens? And you go, well, each step is basically minimizing a quadratic function under an equality constraint, which is linear algebra. Everybody following this? Okay, so, all right. Next in the hierarchy is we're , and we'll continue the discussion on Friday. This story starts this way. Someone says, well, you know, I'd like to apply Newton's method, but I have this function that's zero and then goes up to plus infinity. So it's not continuous, it's not differentiable. And so there's a lot of things you could do. One thing you can actually do is just like apply Newton's method to this. How well would that work? Not well, right? In fact, it wouldn't work at all, right?","zh":"这个故事是这样开始的，我们将在周五继续讨论。这个故事是这样开始的。有人会说，嗯，我想应用牛顿法，但我有一个函数，它在零点处为零，然后上升到正无穷。因此，这个函数不连续，也不可导。所以有很多事情可以做。实际上，你可以直接对这个函数应用牛顿法。这样做效果如何？效果不好，对吧？事实上，它根本无法工作，对吧？","start":4558.61,"end":4587.51},{"id":198,"text":"And someone would say, well, it didn't work because you need a smooth function, right? So you'd say, fine, I'll just make a smooth function. I'll make a function that looks like this, right? Roughly, right? You know, it's a barrier function. That's a thing, right? It's smooth, goes to infinity, and so on. I can apply Newton's method to that, right? And so that's actually how we're going to start here.","zh":"有人会说，它之所以不工作，是因为你需要一个光滑的函数，对吧？所以你会说，好吧，我会构造一个光滑的函数。我会构造一个看起来像这样的函数，对吧？大致如此，对吧？你知道的，这是一个障碍函数。这是一个常见的做法，对吧？它是光滑的，趋向于无穷大，等等。我可以对这个函数应用牛顿法，对吧？因此，实际上我们就是从这里开始的。","start":4588.06,"end":4613.64},{"id":199,"text":"So we'll quit. I think we'll quit for today and then we'll continue this. Good luck on your implementing your Newton solver.","zh":"所以我们今天就到这里吧。我认为我们今天就到这里，然后我们再继续这个话题。祝你们在实现自己的牛顿求解器时好运。","start":4614.29,"end":4621.55}],"notes":["本段讨论了牛顿法在非光滑函数上的应用问题。讲者指出，当函数不连续且不可微时，直接应用牛顿法无法有效工作。这引出了对光滑函数的需求，以及如何通过构造光滑函数（如障碍函数）来解决这一问题。","讲者提到，障碍函数是一种常见的光滑函数，它在原函数的边界处趋向于无穷大，从而避免了非光滑性带来的问题。这种函数可以用于替代原始的非光滑函数，使得牛顿法能够被应用。","讲者强调，虽然直接应用牛顿法在非光滑函数上可能失败，但通过构造合适的光滑函数，可以绕过这一限制。这为后续课程中讨论的优化方法提供了基础。","讲者提到，障碍函数的构造是优化问题中的一种常见策略，特别是在处理约束优化问题时。这种函数的光滑性使得数值方法（如牛顿法）能够被有效应用。","讲者指出，障碍函数的构造需要满足一定的数学性质，例如在边界处趋向于无穷大，同时保持光滑性。这为后续讨论光滑函数的性质和应用奠定了基础。","讲者最后提到，课程将从障碍函数的构造开始，这表明后续内容将围绕如何通过光滑函数来处理非光滑优化问题展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4558.61,"end":4621.55,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":3,"raw_segments":[{"start":4558.61,"text":"This story starts this way, and we'll continue the discussion on Friday. This story starts this way. Someone says, well, you know, I'd like to apply Newton's method, but I have this function that's zero and then goes up to plus infinity. So it's not continuous, it's not differential. And so there's a lot of things you could do. One thing you can actually do is just like apply Newton's method to this. How well would that work? Not well, right? In fact, it wouldn't work at all, right?"},{"start":4588.06,"text":"And someone would say, well, it didn't work because you need a smooth function, right? So you'd say, fine, I'll just make a smooth function. I'll make a function that looks like this, right? Roughly, right? You know, it's a barrier function. That's a thing, right? It's smooth, goes to infinity, and so on. I can apply Newton's method to that, right? And so that's actually how we're going to start here."},{"start":4614.29,"text":"So we'll quit. I think we'll quit for today and then we'll continue this. Good luck on your implementing your Newton solver."}],"speech_gaps":[],"frame":"../frames/v015/028.webp","frame_time":4570.61}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v015.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
