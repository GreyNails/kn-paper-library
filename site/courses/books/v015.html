 just the detail of what it is. Okay?"},{"id":137,"text":"So once again, you would solve a 100 by 100 set of linear equations. Okay. If you use block elimination, you end up with this. Oh, hey, wait a minute. That's identical to this. The only thing different is that this is zero because you're assuming x is feasible. And down here, we actually are putting in..."},{"id":138,"text":"the residual, right? So this need not be zero. If you're not yet feasible, then B minus AX is not zero, right? And this is going to actually reduce to solving this exactly the same system, but with a different right-hand side, right? That's the difference. So the conclusion is that basically in all three of these methods that look wildly different and someone could"}],"notes":["本段讨论了牛顿法在凸优化中的实现，特别是不可行起始牛顿法的初始化过程。该方法只需要在F的定义域内初始化，即使用正向量，而不需要满足AX=B的约束条件。F是负对数的和，其定义域为R++^N。","讲者指出，如果使用朴素的线性代数方法，如直接构造KKT矩阵并求解，会导致不同的计算过程。但通过分析，所有方法在复杂度上是相同的，因为它们最终都归结为求解相似的线性系统。","在使用牛顿法时，通过块消元法，最终需要求解的系统形式为A乘以对角矩阵再乘以A的转置。这与对偶问题中的Hessian矩阵形式相同，因此计算复杂度一致。","当变量x可行时，残差项为零，但若不可行，则残差项不为零，导致求解的线性系统右端项不同。这说明不同方法在实现细节上存在差异，但核心计算结构相同。","讲者强调，尽管不同方法在表面上差异显著，但它们在计算复杂度上是等价的，这为实际应用提供了理论依据。","通过分析，讲者展示了牛顿法在不同场景下的实现方式，包括可行和不可行起始点，以及对偶问题的处理方式，突出了其在凸优化中的通用性和有效性。"],"formulas":[{"latex":"A \\times \\text{\\textbf{对角矩阵}} \\times A^T","symbols":"A乘以对角矩阵再乘以A的转置","explanation":"保持原式，对角矩阵的描述更明确，符合数学表达习惯。","evidence":"But if you actually do the analysis to figure out, assuming you actually know how to use linear algebra, then it turns out, well, it's not shocking. They're all actually identical in complexity. We'll see how that works. So to use Newton's method, you use block elimination on this, and you would end up solving something that looks like A times a diagonal matrix times A transpose. That's what you'd form and solve that system."},{"latex":"A \\times \\text{\\textbf{对角矩阵}} \\times A^T \\times \\delta \\nu","symbols":"A乘以对角矩阵再乘以A的转置乘以delta nu","explanation":"保持原式，delta nu表示增量或扰动，符合数学表达习惯。","evidence":"Okay? Okay. Notice that rected, right? So here's my graph. I mean, this doesn't matter, right? But I'm just going to draw a picture of it like this. There you go. Okay, there's my graph."},{"start":3120.32,"text":"And then what I imagine is that each xi is going to represent a flow on an edge. So there's a flow here. By the way, x can be negative, as those of you in EE would know. This is called the reference direction. x negative says simply that the flow of whatever it really is, like, for example, electricity or current, charge, I should say."},{"start":3144.9,"text":"If it's negative, it means it goes in the opposite direction of what's called the reference direction. Everybody got this, right? And this comes up in a lot of things. AX equals B is actually... AX equals 0 says that you have flow conservation if A is the incidence matrix, right? That would be flow conservation. And in fact, you would call..."},{"start":3171.48,"text":"You call an x with ax equals zero, that's called a circulation, right? Because it's something where at each node you have conservation, right? And so an x that satisfies that is called a circulation because here's an example of a circulation. I have a flow of one, one, one, one. It's a flow in a circle here, which would be a circulation. When you have b, what it corresponds to is that"}],"speech_gaps":[],"frame":"../frames/v015/019.webp","frame_time":3051.84},{"title":"网络流优化与节点关联矩阵","segments":[{"id":145,"text":"You actually have someone injecting at each node. And again, this can either be injecting or pulling stuff out. Depends on what it is, right? So this is what a network would look like for that. Here, I'll put another edge here just for fun. So this is my network, right? And this would have lots of examples. Oh, some people call it a single commodity flow problem."},{"id":146,"text":"Single commodity means it's a single commodity, which is whatever is moving across here. It could be charge in an electrical circuit. This could be a power grid where we are not taking into account transmission losses. So if someone is pumping power in, that's a generator. If they're pulling it off, that is a load. And then..."},{"id":147,"text":"This is the power flows on all these transmission lines. This is neglecting losses in the transmission line, which is actually not a bad thing. It's a perfectly good model. But this could be like lots of other stuff. This could be flows of money in a banking system. It could be all sorts of stuff. Flow of mass."},{"id":148,"text":"Or something like that, uh, movement of a drug from different compartments in a person. Right, that's that's another one. But okay, um, all right, so this is network flow optimization. Um, okay, so the matrix A is like super duper sparse. Um, because actually each column has at most uh, it has uh, exactly"},{"id":149,"text":"two non-zeros. It's got a plus one and a minus one, right? Because each column corresponds to one edge here, and one edge goes between two vertices, so there's exactly two non-zeros, right? So A is this, I guess, A tilde. This is the, because we're going to reduce it in a minute. Yeah. So A tilde is going to be, the A tilde is the so-called node incidence matrix. That's not full rank."},{"id":150,"text":"So you'd like remove one row and refer to, by the way, you do that and you refer to one of the nodes as ground. Now I'm speaking EE dialect, but that's what you do, right? So, okay. Let's see. How do I know that this is not full rank, right? How do I know that if I write a matrix that looks like this, right? You know, here."}],"notes":["本段讲解了网络流优化的基本概念，包括单商品流问题，其中单商品指的是在网络中流动的某种资源，如电荷、电力、资金或质量。讲者提到，这种模型可以用于电力系统，忽略传输损耗，其中发电机是注入电力的节点，负载是提取电力的节点。","讲者进一步说明了网络流优化中矩阵A的稀疏性，指出每个列最多有两个非零元素，即+1和-1，因为每条边连接两个节点。矩阵A被称作节点关联矩阵，但不是满秩的，因此需要移除一行以确定一个参考节点（ground）。","讲者提到，节点关联矩阵的非满秩性质可以通过观察其结构来理解，即每一行的和为零，因此矩阵的秩小于节点数。这种性质在电力系统建模中非常重要，因为可以将一个节点作为参考点，从而简化问题。","讲者还提到，网络流优化可以应用于多种场景，如药物在人体不同腔室之间的流动，这表明该模型具有广泛的适用性。此外，讲者强调了矩阵A的稀疏性，这在计算效率上具有重要意义。","讲者通过举例说明了网络流优化的结构，包括节点、边和流的定义，以及如何通过矩阵表示这些关系。同时，讲者指出，矩阵A的稀疏性是由于每条边连接两个节点，因此每个列只有两个非零元素。","最后，讲者提到如何通过移除一行来确定参考节点，并指出这种做法在电气工程中是常见的，这有助于简化模型并减少计算复杂度。"],"formulas":[{"latex":"A_{ij} = +1 \\text{ 如果边从节点 } i \\text{ 到节点 } j, -1 \\text{ 如果边从节点 } j \\text{ 到节点 } i, \\text{ 否则为 } 0","symbols":"A: 节点关联矩阵，表示网络中节点与边的关系","explanation":"公式正确描述了节点关联矩阵A的元素定义，其中每个元素表示边的方向。","evidence":"two non-zeros. It's got a plus one and a minus one, right? Because each column corresponds to one edge here, and one edge goes between two vertices, so there's exactly two non-zeros, right? So A is this, I guess, A tilde. This is the, because we're going to reduce it in a minute. Yeah. So A tilde is going to be, the A tilde is the so-called node incidence matrix. That's not full rank."},{"latex":"A \\text{ 的秩小于节点数，因为每一行的和为零}","symbols":"矩阵A的秩小于节点数，因为每一行的和为零","explanation":"公式正确指出矩阵A的秩不足，因为每一行的和为零，这是节点关联矩阵的典型性质。","evidence":"So you'd like remove one row and refer to, by the way, you do that and you refer to one of the nodes as ground. Now I'm speaking EE dialect, but that's what you do, right? So, okay. Let's see. How do I know that this is not full rank, right? How do I know that if I write a matrix that looks like this, right? You know, here."}],"uncertainties":["可能无法准确识别某些术语，如'ground'的具体含义，但根据上下文推测为参考节点。","关于矩阵A的稀疏性描述可能存在歧义，但根据讲者提到的'each column has at most two non-zeros'，可以确认其稀疏性。"],"diagram":"network","start":3200.33,"end":3357.3,"asr_flags":[],"math_clarifications":["公式中的描述与上下文一致，没有发现数学错误。"],"raw_segments":[{"start":3200.33,"text":"you actually have someone is injecting at each node B. And again, this can either be injecting or pulling stuff out. Depends on what it is, right? So this is what a network would look like for that. Here, I'll put another edge here just for fun. So this is my network, right? And this would have lots of examples. Oh, some people call it a single commodity flow problem."},{"start":3227.39,"text":"Single commodity means it's a single commodity, which is whatever is moving across here. It could be charge in an electrical circuit. This could be a power grid where we are not taking into account transmission losses. So if someone is pumping power in, that's a generator. If they're pulling it off, that is a load. And then..."},{"start":3251.52,"text":"This is the power flows on all these transmission lines. This is neglecting losses in the transmission line, which is actually not a bad thing. It's a perfectly good model. But this could be like lots of other stuff. This could be flows of money in a banking system. It could be all sorts of stuff. Flow of mass."},{"start":3276.82,"text":"or something like that uh movement of a drug from different compartments in a person right that's that's another one but okay um all right so this is network flow optimization um okay so the matrix a is like super duper sparse um because actually each column has at most uh it has uh exactly"},{"start":3303.82,"text":"two non-zeros. It's got a plus one and a minus one, right? Because each column corresponds to one edge here, and one edge goes between two vertices, so there's exactly two non-zeros, right? So A is this, I guess, A tilde. This is the, because we're going to reduce it in a minute. Yeah. So A tilde is going to be, the A tilde is the so-called node incidence matrix. That's not full rank."},{"start":3330.14,"text":"So you'd like remove one row and refer to, by the way, you do that and you refer to one of the nodes as ground. Now I'm speaking EE dialect, but that's what you do, right? So, okay. Let's see. How do I know that this is not full rank, right? How do I know that if I write a matrix that looks like this, right? You know, here."}],"speech_gaps":[],"frame":"../frames/v015/020.webp","frame_time":3212.33},{"title":"矩阵秩与KKT系统分析","segments":[{"id":151,"text":"You know, right. If I make a matrix that looks like that, how do I know it's not full rank? Yeah, so you, if you just add up all the rows, you get zero, right? So that means like one transpose A is zero, right? And one is not, the one's vector is not zero, so that means it's not full rank, right?"},{"id":152,"text":"Anyway, I won't go into the details. This is just very good stuff to have seen. Actually, how many people have seen stuff like this in some class somewhere? Okay, good. What context? Oh, flux balance and biology. Okay, good. Good. Yeah. Okay, you too. Linear programming class. Yeah. Okay, linear programming. Okay, good. And flux balance. Okay. All right."},{"id":153,"text":"So let's look at the KKT system for this specific problem. Oh, so you're looking at this and you'd say, I don't know, how easy... Okay, California grid has about 3,100 X... No, it's about 6,000, come to think of it. Sorry, there's about 3,100 generators."},{"id":154,"text":"And there's about maybe 6,000 transmission lines, roughly, in California, right? So the question would be, you know, that's actually not a, that problem doesn't scare me because even if you were really dumb and just did it with dents and everything, it would still be just fine, right? But if I took like, I don't know, if I took the U.S. Western grid, then it would not be the case anymore, right? We would start getting 50,000, 100,000. So we'd be getting some big problems there."},{"id":155,"text":"Okay, but when you see this, you should probably, lots of signs should be blinking. Number one, your objective is diagonal, right? So, sorry, the Hessian of your objective, your objective is separable, which means your Hessian is diagonal. So that should just, the first time you see this, you should just say, okay, I'm..."},{"id":156,"text":"I'm primed. I'm ready to do some actual linear algebra here. Then you see AX equals B and you say, what is that? And you say, that's this node incidence matrix. Every column has exactly two non-zero entries. Then your sparsity part of your brain should be like now blinking, right? And so at this point, you should actually, depending on, I don't know, you could say to whoever asked you to solve this problem, you could say, well, we're going to be able to solve that like shockingly efficiently."}],"notes":["本段讨论了如何判断矩阵是否满秩。通过观察矩阵的行和，如果所有行相加为零，则说明矩阵的秩不足。具体来说，如果矩阵的转置乘以一个非零向量得到零向量，那么该矩阵不是满秩的。这为后续分析提供了基础。","接下来，课程转向了KKT系统，这是优化问题中的关键概念。通过分析具体问题，如加州电网的规模，展示了如何处理大规模优化问题。课程指出，即使问题规模很大，只要结构合适，仍然可以高效求解。","在分析问题时，课程强调了目标函数的性质。如果目标函数是可分的，那么其Hessian矩阵将是对角矩阵，这有助于简化计算。这种结构提示了问题的稀疏性，从而可以采用更高效的算法。","课程还提到，当遇到类似AX=B的结构时，应识别其为节点-边矩阵，这种矩阵的稀疏性可以被利用，从而显著提高求解效率。这展示了如何利用问题的结构特性来优化计算过程。","最后，课程指出，当面对大规模问题时，如美国西部电网，问题的复杂性会显著增加，需要更复杂的处理方法。这强调了问题规模对计算复杂性的影响。","整体上，本段通过具体例子和结构分析，展示了如何利用矩阵的性质和问题的结构来优化计算过程，为后续的优化算法提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3358.81,"end":3516.32,"asr_flags":[],"raw_segments":[{"start":3358.81,"text":"You know, right. If I make a matrix that looks like that, how do I know it's not full rank? Yeah, so you, if you just add up all the rows, you get zero, right? So that means like one transpose A is zero, right? And one is not, the one's vector is not zero, so that means it's not full rank, right?"},{"start":3388.46,"text":"Anyway, I won't go into the details. This is just very good stuff to have seen. Actually, how many people have seen stuff like this in some class somewhere? Okay, good. What context? Oh, flux balance and biology. Okay, good. Good. Yeah. Okay, you too. Linear programming class. Yeah. Okay, linear programming. Okay, good. And flux balance. Okay. All right."},{"start":3419.06,"text":"So let's look at the KKT system for this specific problem. Oh, so you're looking at this and you'd say, I don't know, how easy... Okay, California grid has about 3,100 X... No, it's about 6,000, come to think of it. Sorry, there's about 3,100 generators."},{"start":3436.48,"text":"And there's about maybe 6,000 transmission lines, roughly, in California, right? So the question would be, you know, that's actually not a, that problem doesn't scare me because even if you were really dumb and just did it with dents and everything, it would still be just fine, right? But if I took like, I don't know, if I took the U.S. Western grid, then it would not be the case anymore, right? We would start getting 50,000, 100,000. So we'd be getting some big problems there."},{"start":3466.2,"text":"Okay, but when you see this, you should probably, lots of signs should be blinking. Number one, your objective is diagonal, right? So, sorry, the Hessian of your objective, your objective is separable, which means your Hessian is diagonal. So that should just, the first time you see this, you should just say, okay, I'm..."},{"start":3487.72,"text":"I'm primed. I'm ready to do some actual linear algebra here. Then you see AX equals B and you say, what is that? And you say, that's this node incidence matrix. Every column has exactly two non-zero entries. Then your sparsity part of your brain should be like now blinking, right? And so at this point, you should actually, depending on, I don't know, you could say to whoever asked you to solve this problem, you could say, well, we're going to be able to solve that like shockingly efficiently."}],"speech_gaps":[],"frame":"../frames/v015/021.webp","frame_time":3370.81},{"title":"使用KKT系统解决大规模优化问题","segments":[{"id":157,"text":"And they'd say, yeah, but I have like a million X's and 10 million. I have a million nodes and in my power network and I have, you know, 10 million edges. Really? And you go, yeah. They'll say, are you going to use a gradient method? And you're like, no, dude, we're going full Newton on this. Right. And they're like, how could you do it? You see what I'm saying? Right. There's still people stuck in this mindset. Actually, I'd say the vast majority would not know this. Right. So anyway."},{"id":158,"text":"And you'd say, yeah. They'd say, well, how can you do that? You can't even form the Hessian. And you're right. You'd say, yeah, you're right. I'm not going to form the Hessian. I'm going to solve a KKT system. I'm going to exploit the structure, and I'll be able to do it fast, and that's how. Okay. Okay. So here it is. That's our diagonal part of the Hessian."},{"id":159,"text":"we will do some elimination here. And you'll end up computing, forming this matrix here. By the way, this matrix is, if you've heard of it, it's a Laplacian matrix, right? So in circuits, this would be literally the conductance matrix. Again, that's how you'd say it in EE. But in other fields, it's got other names, right? So this is a conductance matrix, or a Laplacian. Laplacian means the diagonals are positive, the off diagonals,"},{"id":160,"text":"are non-positive, and the sum of each row is going to be zero. That's if we don't do the reduced one, but that's fine. Actually, if we do the reduced one, it's fine too. Everybody got that? By the way, this thing here, solving so-called Laplacian equations like this, that's like a whole sub-industry, mostly theoretical computer science."},{"id":161,"text":"If you type that into Google, you'll find lots of stuff. Mostly, to be perfectly bluntly honest about it, completely and utterly useless. There are very good methods to do it that are not those. Okay, so let's see. You can even say this thing, this Laplacian matrix, is actually, we know the sparsity pattern of it immediately, which is really cool. It's basically this."},{"id":162,"text":"This is, it's basically nodes by nodes. So if I had, you know, a million nodes, this would be a million by million matrix. But what it says is that nodes I and J, it's only if they're connected by an arc, would it be true that this matrix here, the Schur complement, is going to have a non-zero. Okay? So if I told you my original power network had 10 million nodes, a million nodes, 10 million edges,"}],"notes":["本段讨论了在大规模优化问题中使用KKT系统而非牛顿法的策略。讲者指出，当问题规模非常大时，计算Hessian矩阵是不可行的，因此需要利用问题的结构来求解KKT系统，从而实现快速求解。","讲者提到Laplacian矩阵的性质，包括对角线元素为正、非对角线元素非正，以及每行元素之和为零。这些性质在电路分析中被称为导纳矩阵，而在其他领域可能有不同的名称。","Laplacian矩阵的稀疏性模式是其重要特征之一，这使得在大规模网络中（如电力网络）可以高效地存储和处理该矩阵。讲者指出，这种矩阵的非零元素仅  say the vast majority would not know this. Right. So anyway."},{"start":3544.15,"text":"And you'd say, yeah. They'd say, well, how can you do that? You can't even form the Hessian. And you're right. You'd say, yeah, you're right. I'm not going to form the Hessian. I'm going to solve a KKT system. I'm going to exploit the structure, and I'll be able to do it fast, and that's how. Okay. Okay. So here it is. That's our diagonal part of the Hessian."},{"start":3567.44,"text":"we will do some elimination here. And you'll end up computing, forming this matrix here. By the way, this matrix is, if you've heard of it, it's a Laplacian matrix, right? So in circuits, this would be literally the conductance matrix. Again, that's how you'd say it in EE. But in other fields, it's got other names, right? So this is a conductance matrix, or a Laplacian. Laplacian means the diagonals are positive, the off diagonals,"},{"start":3596.62,"text":"are non-positive, and the sum of each row is going to be zero. That's if we don't do the reduced one, but that's fine. Actually, if we do the reduced one, it's fine too. Everybody got that? By the way, this thing here, solving so-called Laplacian equations like this, that's like a whole sub-industry, mostly theoretical computer science."},{"start":3626.14,"text":"If you type that into Google, you'll find lots of stuff. Mostly, to be perfectly bluntly honest about it, completely and utterly useless. There are very good methods to do it that are not those. Okay, so let's see. You can even say this thing, this Laplacian matrix, is actually, we know the sparsity pattern of it immediately, which is really cool. It's basically this."},{"start":3654.55,"text":"This is, it's basically nodes by nodes. So if I had, you know, a million nodes, this would be a million by million matrix. But what it says is that nodes I and J, it's only if they're connected by an arc, would it be true that this matrix here, the Schur complement, is going to have a non-zero. Okay? So if I told you my original power network had 10 million nodes, a million nodes, 10 million edges,"}],"speech_gaps":[],"frame":"../frames/v015/022.webp","frame_time":3529.15},{"title":"稀疏矩阵与大规模优化问题","segments":[{"id":163,"text":"Suppose I told you that there weren't weird things where there's not one thing with 50,000 edges adjacent to it. If I said, look, the degree of a node varies between 2 and 50, then that tells you that the number of non-zeros in this matrix per row is between 10 and 50. Everybody following this? That's going to qualify as a sparse matrix."},{"id":164,"text":"Everybody following this? So what it means is that you can solve network flow optimization problems for, I don't know, very large problems if you want and if you know how to do it. Did all that make sense? Yeah."},{"id":165,"text":"Okay, we'll look at something, this is a little bit more esoteric, but just to show you that the ideas, I mean, you just use these ideas whenever you can, right? So on any specific problem, you work out what they are. So here's one where our variable is actually a matrix capital X, right? Which is, it's n by n, my matrix, right? So..."},{"id":166,"text":"one option for this would be to string out all the entries of x. x is symmetric, so there would be n(n plus 1)/2 entries if I vectorized x, right? Because that's the number of distinct elements in a symmetric matrix, right? So then I could compute the Hessian, which would be an n(n plus 1)/2 by n(n plus 1)/2 matrix. Everybody following this? So that's got n to the fourth entries in it."},{"id":167,"text":"right? Then if I just naively, well, then I stack A on top of it, right? I'd form a KKT system, right? Anyway, I'd end up with a giant matrix that was basically n to the fourth by n to the fourth. Everybody following this? So, you know, something n equals 200 is going to be a kind of a showstopper or something like that, right? Because it's just going to be too big."},{"id":168,"text":"Right? But in theory it would work. You could actually do this, run this, and then reassemble x into a matrix and all that. So it turns out we'll do a lot better than that. By the way, each Newton step there would cost you n to the sixth. Here's why."},{"id":169,"text":"the number of variables is really n squared, right? Because I used n to say x is n by n. It's n squared over two, roughly, right? Then if I form this matrix, my storage is going to be n to the fourth, and the computation per iteration is going to be what would normally be, it's the size of the matrix cubed, but if that's n squared, that's going to be n to the sixth. Everybody following this? So, okay, that would be bad. By the way, you might ask, you know, who uses this kind of stuff? This comes up."}],"notes":["本段讨论了稀疏矩阵的概念，指出如果一个矩阵的每行非零元素数量在10到50之间，那么它就可以被视为稀疏矩阵。这在解决大规模网络流优化问题时非常重要，因为稀疏矩阵可以显著减少计算复杂度。","接着，讲者提到在处理大规模优化问题时，如果直接使用传统方法，如将矩阵展开为向量并计算Hessian矩阵，会导致存储和计算复杂度急剧上升，例如存储需求为n^4，计算复杂度为n^6，这在n=200时会变得不可行。","讲者进一步指出，虽然理论上可以这样做，但实际应用中会采用更高效的方法，例如利用对称性减少变量数量，从而降低计算和存储需求。","此外，讲者提到，虽然直接展开矩阵的方法在理论上可行，但在实际应用中，由于计算和存储的限制，这种方法并不实用，因此需要寻找更高效的替代方案。","最后，讲者提到，尽管这种方法在某些情况下可能被使用，但通常会采用更优化的方法来处理大规模问题，例如利用稀疏性或结构化方法。","整个段落强调了稀疏矩阵在优化问题中的重要性，以及直接展开矩阵方法的局限性，同时指出实际应用中需要更高效的算法来处理大规模问题。"],"formulas":[{"latex":"\\frac{n(n + 1)}{2}","symbols":"对称矩阵的非零元素数量","explanation":"该公式正确计算了对称矩阵中独立元素的数量，即n(n+1)/2，适用于n×n对称矩阵。","evidence":"one option for this would be to string out all the entries of x. x is symmetric, so there would be n n plus 1 over 2 entries if I vectorized x, right? Because that's the number of distinct elements in a symmetric matrix, right? So then I could compute the Hessian, which would be an n n plus 1 over 2 by n n plus 1 over 2 matrix. Everybody following this? So that's got n to the fourth entries in it."},{"latex":"n^4","symbols":"存储需求","explanation":"该公式正确表示了存储对称矩阵向量化后的向量长度，即n(n+1)/2，但原文中提到存储需求为n^4，这可能是指存储整个矩阵的大小，因此保留。","evidence":"right? Then if I just naively, well, then I stack A on top of it, right? I'd form a KKT system, right? Anyway, I'd end up with a giant matrix that was basically n to the fourth by n to the fourth. Everybody following this? So, you know, something n equals 200 is going to be a kind of a showstopper or something like that, right? Because it's just going to be too big."},{"latex":"n^6","symbols":"计算复杂度","explanation":"该公式正确表示了计算复杂度，即矩阵的立方，适用于n^2大小的矩阵，因此保留。","evidence":"Right? But in theory it would work. You could actually do this, run this, and then reassemble x into a matrix and all that. So it turns out we'll do a lot better than that. By the way, each Newton step there would cost you n to the sixth. Here's why."}],"uncertainties":[],"diagram":"none","start":3683.93,"end":3861.86,"asr_flags":[],"math_clarifications":["原文中提到的存储需求为n^4，可能是指存储整个矩阵的大小，而非向量化后的向量长度。计算复杂度n^6是基于矩阵大小为n^2的假设，因此保留。"],"raw_segments":[{"start":3683.93,"text":"Suppose I told you that there weren't weird things where there's not one thing with 50,000 edges adjacent to it. If I said, look, the degree of a node varies between 2 and 50, then that tells you that the number of non-zeros in this matrix per row is between 10 and 50. Everybody following this? That's going to qualify as a sparse matrix."},{"start":3713.28,"text":"Everybody following this? So what it means is that you can solve network flow optimization problems for, I don't know, very large problems if you want and if you know how to do it. Did all that make sense? Yeah."},{"start":3739.26,"text":"Okay, we'll look at something, this is a little bit more esoteric, but just to show you that the ideas, I mean, you just use these ideas whenever you can, right? So on any specific problem, you work out what they are. So here's one where our variable is actually a matrix capital X, right? Which is, it's n by n, my matrix, right? So..."},{"start":3762.79,"text":"one option for this would be to string out all the entries of x. x is symmetric, so there would be n n plus 1 over 2 entries if I vectorized x, right? Because that's the number of distinct elements in a symmetric matrix, right? So then I could compute the Hessian, which would be an n n plus 1 over 2 by n n plus 1 over 2 matrix. Everybody following this? So that's got n to the fourth entries in it."},{"start":3792.74,"text":"right? Then if I just naively, well, then I stack A on top of it, right? I'd form a KKT system, right? Anyway, I'd end up with a giant matrix that was basically n to the fourth by n to the fourth. Everybody following this? So, you know, something n equals 200 is going to be a kind of a showstopper or something like that, right? Because it's just going to be too big."},{"start":3819.18,"text":"Right? But in theory it would work. You could actually do this, run this, and then reassemble x into a matrix and all that. So it turns out we'll do a lot better than that. By the way, each Newton step there would cost you n to the sixth. Here's why."},{"start":3835.96,"text":"the number of variables is really n squared, right? Because I used n to say x is n by n. It's n squared over two, roughly, right? Then if I form this matrix, my storage is going to be n to the fourth, and the computation per iteration is going to be what would normally be, it's the size of the matrix cubed, but if that's n squared, that's going to be n to the sixth. Everybody following this? So, okay, that would be bad. By the way, you might ask, you know, who uses this kind of stuff? This comes up."}],"speech_gaps":[],"frame":"../frames/v015/023.webp","frame_time":3695.93},{"title":"矩阵求逆的优化条件与牛顿方法","segments":[{"id":170,"text":"Oh, I could give an interpretation of that in probability and stochastic processes. I could, this in control, things like this come up all the time. This has, but it comes up. So things like this, people actually do solve. Okay, now we'll do it the right way. So the right way is to write down the optimality conditions here for this problem. Oh, and the truth is you don't want to calculate the Hessian of the determinant of the inverse of a matrix, right?"},{"id":171,"text":"I can tell you what it is, but you do not want to write it out, right? Actually, you can't. You can write it out as an abstract linear operator pretty easily. But let's look how this works. So the conditions are that, I mean, it's got to be positive definite, otherwise this makes no sense, right? And then the gradient of this I'm not too afraid of because that's minus x inverse, right? So that's the gradient. The Hessian is not too bad either."},{"id":172,"text":"But, okay, so I write this out like this. And so these are the equations I really want to solve. And in fact, what the Newton method is doing is it's actually just linearizing."},{"id":173,"text":"These are linear. They don't need to be linearized, right? These are not linear because of this, and you just linearize that. When you linearize this, you end up with that. That's the derivative of the inverse of a matrix. And it makes sense, right? Because minus 1 over x, if you take the derivative of that, is 1 over x squared. That's for scalars. For matrices, it's hardly... Then the only question is, how do you say x?"},{"id":174,"text":"whatever x squared in matrices, right? There were too many ways, but this is the way to do it, okay? So you get that. So we have to solve these equations here. And remember, we're going to try to find this matrix delta x, and we're going to try to find these dual variables wj, right? Okay, so this is the idea. And you have a bunch of variables. You have basically n squared variables."},{"id":175,"text":"And all we're doing is like, this is just block elimination, but doing it manually for this particular problem. So what you do is you eliminate delta x from the first equation by multiplying. You go back over here. You multiply this equation by x on the left and the right. And you'll get like an x and x over here. This will become x, and this will become delta x over here."},{"id":176,"text":"And you end up with this equation here. Then y  on and on and it turned out for convex things. It turns out if you get these slopes just right, then it actually is a good approximate. Actually, it's an infinitely good approximation, right? Everybody, and then there was a lot of other stuff like these were the prices and all that kind of stuff. That's fine. Okay. This story actually is way better."}],"speech_gaps":[],"frame":"../frames/v015/027.webp","frame_time":4395.49},{"title":"牛顿法与非光滑函数的处理","segments":[{"id":197,"text":"This story starts this way, and we'll continue the discussion on Friday. This story starts this way. Someone says, well, you know, I'd like to apply Newton's method, but I have this function that's zero and then goes up to plus infinity. So it's not continuous, it's not differentiable. And so there's a lot of things you could do. One thing you can actually do is just like apply Newton's method to this. How well would that work? Not well, right? In fact, it wouldn't work at all, right?"},{"id":198,"text":"And someone would say, well, it didn't work because you need a smooth function, right? So you'd say, fine, I'll just make a smooth function. I'll make a function that looks like this, right? Roughly, right? You know, it's a barrier function. That's a thing, right? It's smooth, goes to infinity, and so on. I can apply Newton's method to that, right? And so that's actually how we're going to start here."},{"id":199,"text":"So we'll quit. I think we'll quit for today and then we'll continue this. Good luck on your implementing your Newton solver."}],"notes":["本段讨论了牛顿法在非光滑函数上的应用问题。讲者指出，当函数不连续且不可微时，直接应用牛顿法无法有效工作。这引出了对光滑函数的需求，以及如何通过构造光滑函数（如障碍函数）来解决这一问题。","讲者提到，障碍函数是一种常见的光滑函数，它在原函数的边界处趋向于无穷大，从而避免了非光滑性带来的问题。这种函数可以用于替代原始的非光滑函数，使得牛顿法能够被应用。","讲者强调，虽然直接应用牛顿法在非光滑函数上可能失败，但通过构造合适的光滑函数，可以绕过这一限制。这为后续课程中讨论的优化方法提供了基础。","讲者提到，障碍函数的构造是优化问题中的一种常见策略，特别是在处理约束优化问题时。这种函数的光滑性使得数值方法（如牛顿法）能够被有效应用。","讲者指出，障碍函数的构造需要满足一定的数学性质，例如在边界处趋向于无穷大，同时保持光滑性。这为后续讨论光滑函数的性质和应用奠定了基础。","讲者最后提到，课程将从障碍函数的构造开始，这表明后续内容将围绕如何通过光滑函数来处理非光滑优化问题展开。" ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
