当矩阵没有结构时，求解较小的系统更优，但当存在结构时，求解更大的系统可能更有效。这与直觉相反，因此需要特别注意。","讲者提到，这种现象与后续作业中涉及的“不可行起点牛顿法”相关，该方法允许初始点不满足约束条件，从而扩展了牛顿法的应用范围。","在不可行起点牛顿法中，假设初始点不满足约束条件，即ax - b ≠ 0，此时需要计算牛顿步，以逐步逼近可行解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1698.66,"end":1857.78,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1698.66,"text":"If you apply Newton's method to this, where you eliminate the equality constraints like this, if you work out what it is, it turns out it is identical to just running Newton's method, right? So it's actually just exactly the same thing, right?"},{"start":1718.87,"text":"Everything is the same. The iterates are identical, the primal iterates, the dual iterates. The stopping, the lambda is the same. So it basically, that means we need, we can actually pull in the proof of convergence from whatever, last lecture, right? So that's all we need. Okay, so we don't ever have to, we're not going to talk about, like, does it converge and all that kind of stuff. The answer is yeah, it does."},{"start":1744.51,"text":"And we'll see, then you'd say, well, what would be the difference between these two, right? And this gets you into the usual thing, right? If you, in this case, you say, well, I'm eliminating, and so I'm solving, let's say you have 1,000 variables and 100 constraints, right? Then you'd say, someone would say, what are you doing? You'd say, well, I'm solving, I've eliminated the equality constraint, so I'm solving a problem with 900 variables. Everybody following this?"},{"start":1770.16,"text":"And you'd say, well, what are you doing? And you go, yeah, I'm solving a problem with 1,100 variables. Everybody got this, right? So that's if you solve the KKT system, right? Because it's a 1,000 by 1,000 block stacked on top of a 100 by 1,000 A matrix, okay? So someone else would look at them and say, but wait a minute. Last time I checked, 1,100 cubed is bigger than 900 cubed."},{"start":1798.5,"text":"And you'd say, it is, you're right. But what we'll find is actually that it's almost always better to solve the bigger system, right? So this is the other thing. If someone comes up to you, I mean, the matrices have no structure at all. Obviously, you'd prefer to solve a smaller system of equations. But when there's structure, this is generally speaking completely false, right? So, and it's not intuitive. So, okay."},{"start":1828.15,"text":"Okay. Aha. So now we're getting to something which is related to something you'll do in your homework, is the so-called infeasible start Newton method, right? And what it does is it's actually a simple extension. Before, we assumed that x was feasible, and so ax minus b was zero, right? Then this just says, well, suppose you're not zero. What is the Newton step, right?"}],"speech_gaps":[],"frame":"../frames/v015/011.webp","frame_time":1710.66},{"title":"不可行起点牛顿法","segments":[{"id":80,"text":"And it's defined by this here. And you can write out all sorts of cool things about it, right? It's linearizing the, if you write the residual as, well, two things here, we can have the, if you write out this thing, if you have AX equals, if AX equals B and this residual should be about zero, you get these things. And the solution of this is called the infeasible Newton step.","zh":"并且它由这里定义。你可以写出关于它的各种有趣的内容，对吧？如果你将残差写成这样，这里有两个部分，我们可以有，如果你写出这个表达式，如果你有 AX 等于 B，而这个残差应该接近零，你就会得到这些内容。这个解被称为不可行初始点牛顿步。","start":1858.17,"end":1885.53},{"id":81,"text":"Right. And so this is this is basically 90, 95 percent of what people actually use. Right. So or actually, since you've been solving lots of problems, it's what ECOS and all sorts of other things have been using on your behalf. Right. You didn't know it, but that's that's what it was doing. OK, you'll know all the details by maybe next lecture or something like that. OK, so this is this is the infeasible start Newton method.","zh":"对的。因此，这基本上是人们实际使用的内容的 90%、95%。对的。或者实际上，因为你已经解决了许多问题，ECOS 和各种其他工具都在为你使用这种方法。对的。你可能并不知道，但这就是它在做的事情。好的，你可能会在下一次课或者类似的时候了解所有细节。好的，这就是不可行初始点牛顿法。","start":1886.4,"end":1912.27},{"id":82,"text":"There are some very interesting things about it. First, if you take a step of size 1, then","zh":"关于它有一些非常有趣的内容。首先，如果你迈出大小为 1 的一步，那么","start":1912.88,"end":1919.74},{"id":83,"text":"the equality constraints will hold, you will be feasible if you take a step of 1, and you'll","zh":"等式约束将被满足，如果你迈出大小为 1 的一步，你将变得可行，并且","start":1921.18,"end":1926.84},{"id":84,"text":"always be feasible thereafter. Because once you take a step of 1, and once x is feasible,","zh":"之后你将始终可行。因为一旦你迈出大小为 1 的一步，且一旦 x 变得可行，","start":1926.84,"end":1934.32},{"id":85,"text":"this is 0, and it actually becomes, except for the line search and the stopping criterion,","zh":"这个残差将为 0，实际上它除了线搜索和停止准则外，","start":1934.44,"end":1941.32},{"id":86,"text":"it's basically identical to","zh":"基本上与","start":1942.1,"end":1943.78},{"id":87,"text":"Newton's method with equality constraints","zh":"带有等式约束的牛顿法是相同的","start":1943.78,"end":1945.6},{"id":88,"text":"that's why it's called infeasible start","zh":"这就是为什么它被称为不可行起点牛顿法","start":1945.6,"end":1946.86},{"id":89,"text":"we'll see why","zh":"我们稍后会看到原因","start":1948.74,"end":1949.48},{"id":90,"text":"you might want to use this there's some very good","zh":"你可能想要使用这个，有一些非常好的","start":1949.48,"end":1951.58},{"id":91,"text":"reasons I'll get to in a minute","zh":"理由，我稍后会讲到","start":1951.58,"end":1953.0},{"id":92,"text":"yeah","zh":"是的","start":1953.0,"end":1953.44},{"id":93,"text":"you may not be allowed","zh":"你可能不允许","start":1960.02,"end":1965.72},{"id":94,"text":"to take a step of one","zh":"进行一步","start":1965.72,"end":1966.74},{"id":95,"text":"so actually what I'm about to say","zh":"实际上，我接下来要说的","start":1968.22,"end":1969.7},{"id":96,"text":"is highly relevant for the homework you're going to do in the next couple of days.","zh":"这对你接下来几天要做的作业是非常相关的。","start":1969.7,"end":1973.08},{"id":97,"text":"You may not be able to take us because, for example, a step of one might take you outside","zh":"你可能无法跟随我们，例如，一步可能将你带出","start":1974.26,"end":1978.76},{"id":98,"text":"the domain event.","zh":"领域事件。","start":1978.76,"end":1979.64},{"id":99,"text":"Okay, then you may not, that's one reason. We'll look at the line search for the infeasible start Newton method actually works with, instead of working with the function value, it actually works with the norm of the residual, right? So it actually works with the norm of the residual. So you'd look at, I'll call it Z, right? You would look at this. Z is going to be like.","zh":"好的，那么你可能无法做到，这是其中一个原因。我们将看一下不可行初始点牛顿法中的线搜索实际上是如何工作的，而不是使用函数值，它实际上使用的是残差的范数，对吧？所以它实际上使用的是残差的范数。你会看一下，我称之为Z，对吧？你会看一下这个。Z将会是类似","start":1981.58,"end":2008.33},{"id":100,"text":"x stacked on top of nu, right? So, in fact, people call z the primal dual variable because it's basically top of it is the primal variable and the bottom is the dual variable, right? So, okay. So, and I think, let's see. So, here's the infeasible start Newton method. You will implement this, so I would strongly recommend listening. You also want to look at the book and stuff like that to read a couple pages about this. So,","zh":"x堆叠在nu上面，对吧？事实上，人们称z为原始对偶变量，因为它基本上上面是原始变量，下面是对偶变量，对吧？所以，好的。所以，我想，让我们看看。这里是不可行初始点牛顿法。你将会实现这个，所以我强烈建议你认真听讲。你还需要查看书籍和相关资料，阅读几页关于这个内容。所以，","start":2008.84,"end":2036.16}],"notes":["本段讲解了不可行起点牛顿法的基本概念，指出该方法在实际应用中占90%到95%。该方法通过将残差线性化来求解问题，被称为不可行牛顿步。"],"formulas":[],"uncertainties":["domain event"],"diagram":"none","start":1858.17,"end":2036.16,"asr_flags":[93],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":1858.17,"text":"And it's defined by this here. And you can write out all sorts of cool things about it, right? It's linearizing the, if you write the residual as, well, two things here, we can have the, if you write out this thing, if you have AX equals, if AX equals B and this residual should be about zero, you get these things. And the solution of this is called the infeasible Newton step."},{"start":1886.4,"text":"Right. And so this is this is basically 90, 95 percent of what people actually use. Right. So or actually, since you've been solving lots of problems, it's what ECOS and all sorts of other things have been using on your behalf. Right. You didn't know it, but that's that's what it was doing. OK, you'll know all the details by maybe next lecture or something like that. OK, so this is this is the infeasible start Newton method."},{"start":1912.88,"text":"There are some very interesting things about it. First, if you take a step of size 1, then"},{"start":1921.18,"text":"the equality constraints will hold, you will be feasible if you take a step of 1, and you'll"},{"start":1926.84,"text":"always be feasible thereafter. Because once you take a step of 1, and once x is feasible,"},{"start":1934.44,"text":"this is 0, and it actually becomes, except for the line search and the stopping criterion,"},{"start":1942.1,"text":"it's basically identical to"},{"start":1943.78,"text":"Newton's method with equality constraints"},{"start":1945.6,"text":"that's why it's called infeasible start"},{"start":1948.74,"text":"we'll see why"},{"start":1949.48,"text":"you might want to use this there's some very good"},{"start":1951.58,"text":"reasons I'll get to in a minute"},{"start":1953.0,"text":"yeah"},{"start":1960.02,"text":"you may not be allowed"},{"start":1965.72,"text":"to take a step of one"},{"start":1968.22,"text":"so actually what I'm about to say"},{"start":1969.7,"text":"is highly relevant for the homework you're going to do in the next couple of days."},{"start":1974.26,"text":"You may not be able to take us because, for example, a step of one might take you outside"},{"start":1978.76,"text":"the domain event."},{"start":1981.58,"text":"Okay, then you may not, that's one reason. We'll look at the line search for the infeasible start Newton method actually works with, instead of working with the function value, it actually works with the norm of the residual, right? So it actually works with the norm of the residual. So you'd look at, I'll call it Z, right? You would look at this. Z is going to be like."},{"start":2008.84,"text":"x stacked on top of nu, right? So, in fact, people call z the primal dual variable because it's basically top of it is the primal variable and the bottom is the dual variable, right? So, okay. So, and I think, let's see. So, here's the infeasible start Newton method. You will implement this, so I would strongly recommend listening. You also want to look at the book and stuff like that to read a couple pages about this. So,"}],"speech_gaps":[{"start":1954.416,"end":1959.62}],"frame":"../frames/v015/012.webp","frame_time":1870.17},{"title":"凸优化中的初始化与牛顿步长调整","segments":[{"id":101,"text":"Here, the initial point does not have to satisfy ax equals b, period. Does not have to. It must be in the domain of your function, right? So if your function was something like minus the sum of the logs of the components, can someone want to suggest a reasonable starting point? If I say, give me a function, give me a number that's in the domain of negative log x, what's the first one that comes to your head?","zh":"在这里，初始点不需要满足ax等于b，根本不需要。它必须位于你的函数的定义域内，对吧？所以如果你的函数是类似负的各个分量对数之和，有人能建议一个合理的起始点吗？如果我说，给我一个函数，给我一个在负对数x的定义域内的数，第一个浮现在你脑海中的是什么？","start":2036.76,"end":2069.81},{"id":102,"text":"There you go, one. Good, I like it. The truth is you could have said any positive number and I couldn't have said anything about it. Okay, so that's the initialization. So you compute the primal and dual Newton steps. The backtracking search is actually on the norm of the residual, right? And we have to look at this equation pretty, we have to look at this sort of pseudocode pretty carefully here.","zh":"没错，一。很好，我喜欢。事实上，你可以说任何正数，我无法对此做出任何评论。好的，这就是初始化。所以你计算原始变量和对偶变量的牛顿步。回溯搜索实际上是在残差的范数上进行的，对吧？我们必须仔细审视这个方程，我们必须仔细审视这段伪代码。","start":2070.45,"end":2093.83},{"id":103,"text":"This says that if this norm does not go down by some amount like that, right, then you have to multiply t by beta. Beta is this number, like typically it's a half or something like that. Actually, people use all sorts of things, but they would never, you could use a half, a quarter, some people use 0.1, doesn't matter, it turns out. Okay, very important thing here is one of the requirements is that","zh":"这段话的意思是，如果这个范数没有下降到某个程度，对吧，那么你就必须将t乘以beta。beta是这个数，通常它是一个半或者类似的东西。实际上，人们使用各种各样的方法，但你永远不会，你可以使用半、四分之一，有些人使用0.1，其实没关系。这里非常重要的一个要求是","start":2094.76,"end":2120.8},{"id":104,"text":"x plus tx newton has to be in the domain of f, right? So let's suppose the domain of f was r plus plus to the n. That's what it's going to be for your homework problem, right? You calculate a newton step, okay? Here's what you do. You don't just take x plus t delta x and then evaluate the gradient in Hessian, right? Because...","zh":"x加上t乘以牛顿步必须位于f的定义域内，对吧？让我们假设f的定义域是r的正数的n维空间。这将是你们作业问题中的情况，对吧？你计算一个牛顿步，对吧？这里你要做的就是，你不能直接取x加上t乘以delta x然后评估梯度和海森矩阵，对吧？因为……","start":2121.27,"end":2146.98},{"id":105,"text":"If x is outside the domain, so an entry of x is negative, for example, or zero, then the gradient... Actually, you're really going to be messed up, especially if you had formulas like the gradient is minus 1 over x and the Hessian is 1 over x squared. Unfortunately, those things will evaluate correctly to a number, even if x is negative. Everybody following this?","zh":"如果x不在定义域内，例如，x的一个分量是负数或零，那么梯度……实际上，你将会遇到麻烦，特别是如果你有像梯度是负的1除以x，海森矩阵是1除以x平方这样的公式。不幸的是，这些表达式即使x是负数也会正确地计算出一个数值。大家都能跟上吗？","start":2147.3,"end":2170.57},{"id":106,"text":"But nothing good is going to happen after that. Absolutely nothing good is going to happen. Your algorithm will not work. It's complete. Nothing will happen, right? So that's why I almost wish that they had in math libraries, you could simply say the domain of... Actually, no, you'll evaluate... If you were to evaluate... So these are interesting because you'd actually don't evaluate F anywhere here. But if you did, you'd know you're in trouble.","zh":"但是，在那之后不会发生任何好事。绝对没有任何好事会发生。你的算法将无法工作。它完全无效。什么都不会发生，对吧？这就是为什么我几乎希望在数学库中，你可以直接指定域……实际上不是，你会进行评估……如果你进行评估……这些情况很有趣，因为实际上你在这里不会评估F。但如果你进行评估，你就会知道自己陷入麻烦了。","start":2171.23,"end":2195.43}],"notes":["本段主要讲解凸优化中初始化点的选择和牛顿步长调整的机制。首先，初始化点不需要满足约束条件ax = b，但必须在目标函数的定义域内。例如，对于负对数函数，合理的初始点可以是正数，如1。接着，讲解了回溯搜索方法，该方法基于残差范数的下降情况调整步长参数t，通常乘以一个介于0和1之间的beta值，如0.5或0.1。"],"formulas":[],"uncertainties":["r plus plus to the n"],"diagram":"none","start":2036.76,"end":2195.43,"asr_flags":[],"math_clarifications":["原始文本中未明确提及任何具体的数学公式，因此无法确认其正确性。所有提到的公式均未在上下文中得到支持，因此被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2036.76,"text":"Here, the initial point does not have to satisfy ax equals b, period. Does not have to. It must be in the domain of your function, right? So if your function was something like minus the sum of the logs of the components, can someone want to suggest a reasonable starting point? If I say, give me a function, give me a number that's in the domain of negative log x, what's the first one that comes to your head?"},{"start":2070.45,"text":"There you go, one. Good, I like it. The truth is you could have said any positive number and I couldn't have said anything about it. Okay, so that's the initialization. So you compute the primal and dual Newton steps. The backtracking search is actually on the norm of the residual, right? And we have to look at this equation pretty, we have to look at this sort of pseudocode pretty carefully here."},{"start":2094.76,"text":"This says that if this norm does not go down by some amount like that, right, then you have to multiply t by beta. Beta is this number, like typically it's a half or something like that. Actually, people use all sorts of things, but they would never, you could use a half, a quarter, some people use 0.1, doesn't matter, it turns out. Okay, very important thing here is one of the requirements is that"},{"start":2121.27,"text":"x plus tx newton has to be in the domain of f, right? So let's suppose the domain of f was r plus plus to the n. That's what it's going to be for your homework problem, right? You calculate a newton step, okay? Here's what you do. You don't just take x plus t delta x and then evaluate the gradient in Hessian, right? Because..."},{"start":2147.3,"text":"If x is outside the domain, so an entry of x is negative, for example, or zero, then the gradient... Actually, you're really going to be messed up, especially if you had formulas like the gradient is minus 1 over x and the Hessian is 1 over x squared. Unfortunately, those things will evaluate correctly to a number, even if x is negative. Everybody following this?"},{"start":2171.23,"text":"But nothing good is going to happen after that. Absolutely nothing good is going to happen. Your algorithm will not work. It's complete. Nothing will happen, right? So that's why I almost wish that they had in math libraries, you could simply say the domain of... Actually, no, you'll evaluate... If you were to evaluate... So these are interesting because you'd actually don't evaluate F anywhere here. But if you did, you'd know you're in trouble."}],"speech_gaps":[],"frame":"../frames/v015/013.webp","frame_time":2048.76},{"title":"处理非正数的对数问题与方向导数的几何解释","segments":[{"id":107,"text":"Because you'd get an error saying, hey, you're trying to evaluate the log of a negative number, right? Or zero. And that's not going to go very well. Unless you have a complex library or something like that, right? Okay. So the way to do this then, so what that means is, if this is not in the domain, this isn't even defined. This just means it's infinity. So you would take a t, check if x plus t delta x is positive.","zh":"因为你会得到一个错误提示，说嘿，你试图计算一个负数的对数，对吧？或者零。这不会很顺利。除非你有复数库或者其他类似的东西，对吧？好的。那么，要做到这一点，这意味着，如果这个不在定义域内，这甚至没有定义。这仅仅意味着它是无穷大。所以你会取一个t，检查x加上t delta x是否为正。","start":2196.03,"end":2221.61},{"id":108,"text":"If it is not positive, don't evaluate this, right? Just times t times equals beta. And you keep doing that until you're actually in the domain, which means it's positive, then you can evaluate this. Okay, so I don't know if that was clear, but maybe to those working on this already, it is. Okay, so I think you'll, that was enough of a hint, but it's an important one. Right, so, okay.","zh":"如果不是正数，就不要计算这个，对吧？直接乘以t等于beta。然后你一直这样做，直到你真正处于定义域内，也就是说它是正数，然后你就可以计算这个。好的，我不知道是否清楚，但也许对那些已经在处理这个问题的人来说，是清楚的。好的，我想你们已经得到了足够的提示，但这是一个重要的提示。对，好的，好的。","start":2222.34,"end":2249.96},{"id":109,"text":"So this is it. And the basic idea of this is that the directional derivative is, in fact, also equal to minus the norm of the residual. So what that says is, if you're doing a line search, it's pretty cool. It looks like this. This is t. I'm going to plot here the norm of the residual. So at t equals 0, it's at your current point. And what it says is that the slope of this curve is exactly minus 1.","zh":"这就是全部了。这个的基本思想是，方向导数实际上也等于残差的范数的负数。这意味着，如果你在进行线搜索，这非常酷。看起来像这样。这是t。我在这里绘制残差的范数。在t等于0时，它处于你的当前点。它说的是，这条曲线的斜率正好是负1。","start":2252.01,"end":2281.26},{"id":110,"text":"Right. So if you're going to make that that step backtracking or our Miho step or whatever you call it, it's going to look like this. What it really it's going to it's just going to look like that. Right. And so you you will degrade this by alpha and you will take the first time you get something that is below that curve. And you absolutely have to because if T is small enough, it's got to happen. So, OK, you actually did this, even though yours isn't quite.","zh":"对。所以如果你要进行那一步回溯或者我们的Miho步或者其他你称之为的步骤，它看起来会像这样。它实际上只是看起来像这样。对。因此你会将这个降低到alpha，并且你会取第一个使得结果低于该曲线的时间。你绝对必须这样做，因为如果t足够小，它一定会发生。好的，你实际上已经做了，尽管你的还不太准确。","start":2281.84,"end":2309.67},{"id":111,"text":"There's some questions as to whether or not it's working. I think I made this error. Okay, well, sorry. That's what you get for doing it. We should have done, yeah, anyway, that's the timing. That's right. That's a good experience. It's a good life experience to have. Everybody should have, should actually once in their life write a Newton thing or something like that where they were not, they were too cavalier about domains and nothing, and it was bad. Right, so, okay. All right.","zh":"有一些问题，关于它是否有效。我想我犯了这个错误。好的，抱歉。这就是你做这件事所得到的。我们本应该做，是的，不管怎样，这就是时间。对的，这是个好经验。每个人都应该有一次在自己的生活中编写一个牛顿方法或者类似的东西，当时他们对定义域过于轻率，结果导致了问题。对，好的，好的。","start":2310.71,"end":2338.85},{"id":112,"text":"So, you'll be implementing this for the homework. Okay, let's talk about how you solve the KKT system, right? Well, one obvious thing, which is, by the way, not bad at all, is actually just doing LDL transpose factorization. So, here's good news about LDL transpose factorization, is if you use a good sparse package, then you're, I mean, I'm assuming H and A are sparse.","zh":"所以，你们将在作业中实现这一点。好的，让我们谈谈你们如何求解KKT系统，对吧？嗯，一个显而易见的事情，顺便说一句，这其实相当不错，就是直接进行LDL转置分解。LDL转置分解的一个好消息是，如果使用一个好的稀疏包，那么你们，我的意思是，我假设H和A都是稀疏的。","start":2339.85,"end":2368.4}],"notes":["本段主要讲解了在优化过程中如何处理对数函数的定义域问题。当计算对数时，如果输入值为负数或零，会导致错误。因此，需要检查变量是否在定义域内，即是否为正数。如果不在定义域内，则不进行计算，而是直接设置为无穷大。这一过程通过逐步调整参数t来实现，直到变量进入定义域。","接下来，讲者解释了方向导数与残差范数之间的关系。方向导数等于残差范数的负数，这在进行线搜索时非常有用。通过绘制残差范数随参数t变化的曲线，可以直观地看到其斜率为-1，这有助于确定步长的调整。","讲者提到在实现优化算法时，需要特别注意定义域的问题。如果忽略这一点，可能会导致计算错误。因此，必须在每次迭代中检查变量是否在定义域内，并进行相应的调整。","最后，讲者提到在作业中需要实现这些方法，并讨论了如何求解KKT系统。其中提到使用LDL转置分解方法，这是一种有效的求解方法，尤其适用于稀疏矩阵的情况。","讲者还提到在实际编程中，由于对定义域的忽视，可能会导致严重的错误。因此，必须谨慎处理这些细节，以确保算法的正确性和稳定性。","整个讲解强调了在优化过程中对定义域的检查和调整的重要性，以及如何通过方向导数和残差范数来指导步长的选择。这些概念对于理解优化算法的实现和调试具有重要意义。"],"formulas":[],"uncertainties":["Miho step"],"diagram":"none","start":2196.03,"end":2368.4,"asr_flags":[],"math_clarifications":["公式中的方向导数与残差范数之间的关系不成立，需移除该公式并进行更准确的数学描述。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2196.03,"text":"Because you'd get an error saying, hey, you're trying to evaluate the log of a negative number, right? Or zero. And that's not going to go very well. Unless you have a complex library or something like that, right? Okay. So the way to do this then, so what that means is, if this is not in the domain, this isn't even defined. This just means it's infinity. So you would take a t, check if x plus t delta x is positive."},{"start":2222.34,"text":"If it is not positive, don't evaluate this, right? Just times t times equals beta. And you keep doing that until you're actually in the domain, which means it's positive, then you can evaluate this. Okay, so I don't know if that was clear, but maybe to those working on this already, it is. Okay, so I think you'll, that was enough of a hint, but it's an important one. Right, so, okay."},{"start":2252.01,"text":"So this is it. And the basic idea of this is that the directional derivative is, in fact, also equal to minus the norm of the residual. So what that says is, if you're doing a line search, it's pretty cool. It looks like this. This is t. I'm going to plot here the norm of the residual. So at t equals 0, it's at your current point. And what it says is that the slope of this curve is exactly minus 1."},{"start":2281.84,"text":"Right. So if you're going to make that that step backtracking or our Miho step or whatever you call it, it's going to look like this. What it really it's going to it's just going to look like that. Right. And so you you will degrade this by alpha and you will take the first time you get something that is below that curve. And you absolutely have to because if T is small enough, it's got to happen. So, OK, you actually did this, even though yours isn't quite."},{"start":2310.71,"text":"There's some questions as to whether or not it's working. I think I made this error. Okay, well, sorry. That's what you get for doing it. We should have done, yeah, anyway, that's the timing. That's right. That's a good experience. It's a good life experience to have. Everybody should have, should actually once in their life write a Newton thing or something like that where they were not, they were too cavalier about domains and nothing, and it was bad. Right, so, okay. All right."},{"start":2339.85,"text":"So, you'll be implementing this for the homework. Okay, let's talk about how you solve the KKT system, right? Well, one obvious thing, which is, by the way, not bad at all, is actually just doing LDL transpose factorization. So, here's good news about LDL transpose factorization, is if you use a good sparse package, then you're, I mean, I'm assuming H and A are sparse."}],"speech_gaps":[],"frame":"../frames/v015/014.webp","frame_time":2208.03},{"title":"消除与带状矩阵","segments":[{"id":113,"text":"then it's actually going to exploit a lot of structure there, right? More even than you know about, right? So you could do this for a control problem, signal process, all sorts of stuff. You could just do this, right? You can do elimination. This is often done if H is diagonal, right? So if the Hessian is diagonal, like, for example, if the function is separable, right? It's separable, but they're coupled.","zh":"那么它实际上会利用很多结构，对吧？甚至比你所知道的还要多，对吧？你可以在控制问题、信号处理等各种问题中使用这种方法。你只需要这样做，对吧？你可以进行消元。这通常在H是对角线的时候进行，对吧？所以如果Hessian矩阵是对角线的，例如，如果函数是可分离的，对吧？它是可分离的，但它们是耦合的。","start":2368.99,"end":2396.73},{"id":114,"text":"by the equality constraints, right? Then H will be diagonal. And in that point, that's tempting enough for you to do elimination on it, right? So you would eliminate, because we know the inverse. H could be banded, same story, right? So, I mean, here's an example of a banded one. Optimal control with a constraint that, some constraints that couple states far apart. For example, you're making a tour. You say, make me a little drone tour.","zh":"通过等式约束，对吧？那么H将会是对角线的。在这一点上，这足以让你对其进行消元，对吧？因此你会进行消元，因为我们知道逆矩阵。H可能是带状的，同样的情况，对吧？所以，这里有一个带状矩阵的例子。带有约束的最优控制问题，其中某些约束会耦合远离的状态。例如，你让我做一个小型无人机的巡游路线。","start":2397.24,"end":2426.38},{"id":115,"text":"And it's got to start and end at the same place, right? Well, okay, so when I hear that, when I hear optimal control, I visualize immediately a banded system. I know immediately the banded system is going to drop down somewhere deep in the linear algebra. I'm going to solve a banded system, can do that super fast. But when I say something like, you have to be back at the same place.","zh":"它必须从起点和终点相同的地方开始，对吧？嗯，当我听到这一点，当我听到最优控制时，我立刻会想象出一个带状系统。我知道带状系统会立即出现在线性代数的深处。我要解一个带状系统，这可以非常快速地完成。但当我提到像必须回到相同位置这样的要求时，","start":2426.92,"end":2446.68},{"id":116,"text":"that actually couples like the beginning position and the final position. And that's actually one of these, that's going to be an equality constraint that breaks the bandedness, right? But I'll also note that I can do that super fast. So in other words, that's just a non-problem. Okay. All right. So to eliminate...","zh":"实际上会将起始位置和最终位置耦合在一起。而这实际上就是一种等式约束，会破坏带状性，对吧？但我也要指出的是，我可以非常快速地完成这一点。换句话说，这只是一个非问题。好的。那么，为了消元……","start":2447.54,"end":2467.92},{"id":117,"text":"H inverse, and usually this is done when H is something like diagonal. So you would just do a block elimination here, and you'd end up with something looking like that. So you would form this matrix, then factorize it, then solve.","zh":"H的逆矩阵，通常在H是某种对角线矩阵时进行这种操作。因此你只需要在这里进行块消元，最终得到一个看起来像这样的矩阵。因此你会形成这个矩阵，然后进行因式分解，然后求解。","start":2469.5,"end":2489.74},{"id":118,"text":"And H inverse, you shouldn't even worry about because it's diagonal. So it's kind of a silly thing, right? And then you'd end up with something like that, right? So this is, once you form, this would allow you to solve for W. Once you solve for W, you solve for V over here, right? And that's cheap. Well, it's silly. H is diagonal. So that would be, that's the idea. Okay. All right. Okay. So we're looking.","zh":"H的逆矩阵，你甚至不需要担心，因为它是对角线的。这其实是一个很傻的做法，对吧？然后你会得到一个看起来像这样的结果，对吧？因此一旦你形成这个矩阵，它将允许你求解W。一旦求解了W，你就可以在这里求解V，对吧？而且这很便宜。嗯，这很傻。H是对角线的。这就是这个想法。好的。好的。我们正在观察。","start":2492.08,"end":2520.98},{"id":119,"text":"So actually what's weird about all these things is that they're all kind of the same, all these different. So now you have lots of different methods, right? By the way, this is shockingly close to what you will be solving in your homework. So again, you might want to listen up as to how all this works, right? So we now have all sorts of different ways.","zh":"实际上，这些事物之所以奇怪，是因为它们看起来都差不多，尽管彼此不同。现在你拥有了许多不同的方法，对吧？顺便说一句，这与你将在作业中解决的问题惊人地相似。因此，你可能需要仔细听讲，了解这一切是如何运作的，对吧？现在我们拥有了各种各样的方法。","start":2522.44,"end":2543.08}],"notes":["本段主要讲解了在优化问题中，如何利用矩阵的结构（如对角矩阵或带状矩阵）来简化计算。当Hessian矩阵H是对角矩阵时，可以通过消元法来简化问题，因为对角矩阵的逆容易计算。此外，当H是带状矩阵时，同样可以利用其结构进行快速求解。","在最优控制问题中，如果存在约束条件，例如要求无人机的路径起点和终点相同，这种约束会破坏带状矩阵的结构，从而增加计算复杂度。但即使在这种情况下，仍然可以通过快速算法来处理。","当Hessian矩阵是对角矩阵时，可以直接进行块消元，从而得到简化后的矩阵形式。这种情况下，计算H的逆矩阵变得非常简单，因为对角矩阵的逆只需要对每个对角线元素取倒数。","在实际应用中，这些方法非常实用，尤其是在处理大规模优化问题时。例如，课程中提到的作业问题就与这些方法密切相关，因此学生需要仔细理解这些概念。","通过这些方法，可以有效地处理各种优化问题，包括控制问题和信号处理问题。这些方法的核心思想是利用矩阵的结构特性来简化计算过程。","课程强调了这些方法的实际应用价值，特别是在处理带状矩阵和对角矩阵时，能够显著提高计算效率。因此，学生需要掌握这些方法的基本原理和应用场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2368.99,"end":2543.08,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2368.99,"text":"then it's actually going to exploit a lot of structure there, right? More even than you know about, right? So you could do this for a control problem, signal process, all sorts of stuff. You could just do this, right? You can do elimination. This is often done if H is diagonal, right? So if the Hessian is diagonal, like, for example, if the function is separable, right? It's separable, but they're coupled."},{"start":2397.24,"text":"by the equality constraints, right? Then H will be diagonal. And in that point, that's tempting enough for you to do elimination on it, right? So you would eliminate, because we know the inverse. H could be banded, same story, right? So, I mean, here's an example of a banded one. Optimal control with a constraint that, some constraints that couple states far apart. For example, you're making a tour. You say, make me a little drone tour."},{"start":2426.92,"text":"And it's got to start and end at the same place, right? Well, okay, so when I hear that, when I hear optimal control, I visualize immediately a banded system. I know immediately the banded system is going to drop down somewhere deep in the linear algebra. I'm going to solve a banded system, can do that super fast. But when I say something like, you have to be back at the same place."},{"start":2447.54,"text":"that actually couples like the beginning position and the final position. And that's actually one of these, that's going to be an equality constraint that breaks the bandedness, right? But I'll also note that I can do that super fast. So in other words, that's just a non-problem. Okay. All right. So to eliminate..."},{"start":2469.5,"text":"H inverse, and usually this is done when H is something like diagonal. So you would just do a block elimination here, and you'd end up with something looking like that. So you would form this matrix, then factorize it, then solve."},{"start":2492.08,"text":"And H inverse, you shouldn't even worry about because it's diagonal. So it's kind of a silly thing, right? And then you'd end up with something like that, right? So this is, once you form, this would allow you to solve for W. Once you solve for W, you solve for V over here, right? And that's cheap. Well, it's silly. H is diagonal. So that would be, that's the idea. Okay. All right. Okay. So we're looking."},{"start":2522.44,"text":"So actually what's weird about all these things is that they're all kind of the same, all these different. So now you have lots of different methods, right? By the way, this is shockingly close to what you will be solving in your homework. So again, you might want to listen up as to how all this works, right? So we now have all sorts of different ways."}],"speech_gaps":[],"frame":"../frames/v015/015.webp","frame_time":2380.99},{"title":"凸优化中的对偶问题与初始化要求","segments":[{"id":120,"text":"So you could say, yeah, I could solve that. It's a smooth problem. And you could say, oh, I could solve the dual here. And in this case, you could reconstruct the solution of the primal from the dual. It's not always true, but it is if the objective is strictly convex, which it is here. So you could do this. All right, so let's just do the simple thing.","zh":"所以你可以这么说，是的，我可以解决这个问题。这是一个光滑的问题。你也可以这么说，哦，我可以在这里求解对偶问题。在这种情况下，你可以从对偶问题中重构原始问题的解。这并不是总成立的，但如果目标函数是严格凸的，这就成立，而在这里目标函数就是严格凸的。所以你可以这么做。好的，那我们就做简单的事情。","start":2544.49,"end":2568.85},{"id":121,"text":"Actually, here's what's interesting. They all have different initialization requirements. And actually, that's actually what's going to actually be the... You're going to see all these methods are going to turn out to be essentially the same. They're not the same, but in spirit, the work you do per iteration, if you know what you're doing, is the same. So there's just no difference between any of them. So, except the initialization. So, if we just do Newton method with equality constraints, that says someone has got to come up with an X.","zh":"实际上，有趣的是，它们都有不同的初始化要求。实际上，这将是……你会看到所有这些方法最终都会被证明本质上是相同的。它们并不完全相同，但在精神上，如果你知道该怎么做，每次迭代所做的工作是相同的。因此，它们之间没有任何区别。所以，除了初始化之外。因此，如果我们只是用等式约束下的牛顿法，这就意味着有人必须提供一个X。","start":2570.3,"end":2598.86},{"id":122,"text":"uh, that is positive, strictly positive and satisfies AX equals B. If these are just general A's, if this is just a general A and B, how would you find such an X? You'd, I guess you'd have to solve, in general, you'd have to solve an LP, right? To, to do that. So, and this is bad because this is, you know, maybe simpler than an LP and it's a general rule that you should not have a subroutine that's more complicated than just solving the problem itself, right? So, so,","zh":"嗯，这个X必须是正的，严格正的，并且满足AX等于B。如果这些只是普通的A和B，如果这只是一个一般的A和B，你如何找到这样的X？你大概必须解决一个线性规划问题，对吧？为了做到这一点。所以，这很糟糕，因为这可能比一个线性规划问题更简单，而有一个常规的规则是你不应该有一个比仅仅解决自身问题更复杂的子程序，对吧？所以，所以，","start":2599.39,"end":2629.33},{"id":123,"text":"On the other hand, sometimes it is easy to come up with a, even though there's an equality constraint, sometimes it's easy to do. How about resource allocation? Where, here's the constraint. Ready? The sum of the X's is equal, I'm going to make my budget, B. There you go. Sum of the X's is equal to B.","zh":"另一方面，有时候很容易找到一个满足等式约束的正向量，即使存在等式约束，有时候也容易做到。比如资源分配问题？这里有一个约束。准备好了吗？X的和等于我的预算B。就是这样。X的和等于B。","start":2630.01,"end":2647.31},{"id":124,"text":"Can someone suggest, and suppose that all of the, well, let's see, suppose all of the functions that I want to minimize, actually you'd call this log utility, which is actually widely used. So this would be log utility allocation of resources or something like that. Someone got a suggestion for, can you think of a positive vector?","zh":"有人能建议一下，假设所有我想要最小化的函数，实际上你称之为对数效用，这实际上被广泛使用。所以这将是资源的对数效用分配，或者类似的东西。有人有建议吗？你能想出一个正向量吗？","start":2647.89,"end":2670.99},{"id":125,"text":"So B is a scalar for us now, right? It's some XI equals B, that's the budget. So I'm deciding how much IO bandwidth or something like that a bunch of processes get. Okay, so somebody, how would you, what's an initial resource allocation? What? Perfect, uniform. Yeah, you just do each XI is B over N, and you put a comment in the code that says we initialize with uniform allocation. Done. So then you can do this. Okay.","zh":"所以B对我们来说是一个标量，对吧？它是XI等于B，这是预算。所以我正在决定一组进程能获得多少IO带宽或者其他类似资源。好的，那么有人，你怎么进行初始资源分配？什么？完美，均匀分配。是的，你只需要让每个XI等于B除以N，并在代码中添加一个注释说明我们使用均匀分配进行初始化。完成。然后你就可以这样做。好的。","start":2671.69,"end":2702.11}],"notes":["本段讨论了凸优化中对偶问题的求解方法，指出在某些情况下，可以通过对偶问题来重构原始问题的解。但这一性质只有在目标函数严格凸时才成立。此外，还提到不同优化方法在迭代过程中所做的工作相似，但初始化要求不同。","讲者指出，当存在等式约束时，找到满足约束条件的初始点可能需要求解线性规划（LP），这在某些情况下可能比直接求解原问题更复杂。因此，应避免使用比直接求解原问题更复杂的子程序。","在资源分配的例子中，讲者提到约束条件是所有变量的和等于预算B，并且使用对数效用函数进行资源分配。这种情况下，一个简单的初始化方法是将资源均匀分配。","讲者进一步说明，均匀分配是一种有效的初始化策略，因为它简单且容易实现，可以在代码中通过注释说明。这种初始化方法在资源分配问题中是可行的。","本段还强调了凸优化方法在实际应用中的重要性，特别是在处理等式约束和资源分配问题时，初始化策略的选择对算法的收敛性和效率有重要影响。","讲者通过具体的例子说明了如何在实际问题中应用凸优化方法，包括如何构造初始点和如何选择合适的优化算法。这些例子帮助学生理解理论在实际中的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2544.49,"end":2702.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2544.49,"text":"So you could say, yeah, I could solve that. It's a smooth problem. And you could say, oh, I could solve the dual here. And in this case, you could reconstruct the solution of the primal from the dual. It's not always true, but it is if the objective is strictly convex, which it is here. So you could do this. All right, so let's just do the simple thing."},{"start":2570.3,"text":"Actually, here's what's interesting. They all have different initialization requirements. And actually, that's actually what's going to actually be the... You're going to see all these methods are going to turn out to be essentially the same. They're not the same, but in spirit, the work you do per iteration, if you know what you're doing, is the same. So there's just no difference between any of them. So, except the initialization. So, if we just do Newton method with equality constraints, that says someone has got to come up with an X."},{"start":2599.39,"text":"uh, that is positive, strictly positive and satisfies AX equals B. If these are just general A's, if this is just a general A and B, how would you find such an X? You'd, I guess you'd have to solve, in general, you'd have to solve an LP, right? To, to do that. So, and this is bad because this is, you know, maybe simpler than an LP and it's a general rule that you should not have a subroutine that's more complicated than just solving the problem itself, right? So, so,"},{"start":2630.01,"text":"On the other hand, sometimes it is easy to come up with a, even though there's an equality constraint, sometimes it's easy to do. How about resource allocation? Where, here's the constraint. Ready? The sum of the X's is equal, I'm going to make my budget, B. There you go. Sum of the X's is equal to B."},{"start":2647.89,"text":"Can someone suggest, and suppose that all of the, well, let's see, suppose all of the functions that I want to minimize, actually you'd call this log utility, which is actually widely used. So this would be log utility allocation of resources or something like that. Someone got a suggestion for, can you think of a positive vector?"},{"start":2671.69,"text":"So B is a scalar for us now, right? It's some XI equals B, that's the budget. So I'm deciding how much IO bandwidth or something like that a bunch of processes get. Okay, so somebody, how would you, what's an initial resource allocation? What? Perfect, uniform. Yeah, you just do each XI is B over N, and you put a comment in the code that says we initialize with uniform allocation. Done. So then you can do this. Okay."}],"speech_gaps":[],"frame":"../frames/v015/016.webp","frame_time":2556.49},{"title":"牛顿法与对偶问题的误解","segments":[{"id":126,"text":"All right, so here's what happens if you run this. I think this is just run from several different initial conditions. And, you know, you see your classic Newton thing. This is what you're looking for, right? This is a log plot, and this is linear. This is a semi-log plot, and you're looking for this acceleration, right? That's when you declare success. That's Newton's. That's how you know you actually have an implementation of Newton's method. Okay? So, okay, and you have that. Okay, that's one.","zh":"好的，那么如果你运行这个，我想这仅仅是来自几个不同的初始条件。你就会看到经典的牛顿法现象。这就是你所寻找的，对吧？这是一个对数图，这是一个线性图。这是一个半对数图，你所寻找的就是这种加速现象，对吧？这就是你宣告成功的时刻。这就是牛顿法。这就是你真正实现牛顿法的标志。明白吗？所以，好的，你有这个。好的，这是第一个。","start":2702.71,"end":2731.23},{"id":127,"text":"we could actually apply Newton's method to the dual, right? And let's actually see. I think, let's see, did I say what the, oh, I did say what the numbers were. Aha, okay. So here I said that there's 100 equality constraints and 500 variables, right? So in this problem, yeah, we're, this is, you know, we have basically 500 variables, right?","zh":"我们实际上可以将牛顿法应用于对偶问题，对吧？让我们实际看一下。我想，让我看看，我是否说过这些数字，哦，我确实说过这些数字。啊，好的。在这里我说有100个等式约束和500个变量，对吧？所以在这个问题中，是的，我们基本上有500个变量，对吧？","start":2734.08,"end":2758.64},{"id":128,"text":"But then someone says, oh, no, no, I learned about this dual. It's really awesome. Plus, it sounds fancy, and so you can impress your friends if they're gullible or whatever. And you can say, oh, no, no, to solve that resource allocation, I'm going to solve the dual resource allocation. And if you say it the right way, it sounds really sophisticated. And then someone say, you could even then say things like, actually, what I'm doing, mine is a price discovery method because the dual variables are, in fact, precisely.","zh":"但接着有人会说，哦，不，不，我学过这个对偶问题。它真的很棒。而且听起来很高级，这样你就可以用它来唬住那些容易上当的朋友或者随便什么人。你可以说，哦，不，不，为了解决这个资源分配问题，我要解决对偶的资源分配问题。如果你说得恰到好处，听起来就非常有深度。然后有人会说，你甚至可以说，实际上，我所做的，我的方法是一种价格发现方法，因为对偶变量实际上就是精确的边际效用。","start":2760.4,"end":2786.94},{"id":129,"text":"You know, in a resource allocation, they are precisely the marginal utilities, right, of the thing. So you'd say, oh, no, I'm using, I'm solving the dual problem. And you could blabber on and on. And you'd say, also, plus, I only have 100 variables. Whoever was solving the Newton thing, they had 500. And last time I checked, 100 is smaller than 500. So should be.","zh":"你知道，在资源分配中，它们就是精确的边际效用，对吧？所以你会说，哦，不，我是在使用，我是在解决对偶问题。你可以喋喋不休地讲下去。你还可以补充说，另外，我只有100个变量。而那些在解决牛顿法问题的人，他们有500个变量。上一次我检查的时候，100比500小。所以应该如此。","start":2787.81,"end":2809.18},{"id":130,"text":"should be, you know, I should be a factor of five cubed better. I should be 100x faster. Everybody following this? This is what someone might say, and actually people say this all the time, is completely wrong, of course, right? Okay, so we'll solve this method, and then you get down and you say, oh, look, you started from a couple of different things. Oh, by the way, this requires, you have to have something feasible for the dual, and that's basically, I have to find a vector.","zh":"应该，你知道的，我应该要好五的三次方，也就是100倍更快。大家跟得上吗？这就是某人可能会说的话，实际上人们经常这么说，但当然这是完全错误的，对吧？好的，那么我们来解决这个问题，然后你就会发现，哦，看，你从几个不同的起点开始。哦，顺便说一句，这需要你有一个对偶问题的可行解，而这基本上就是我必须找到一个向量。","start":2810.07,"end":2834.66},{"id":131,"text":"with A transpose nu positive. Once again, how do you find such a, well, it depends. In some cases, it's easy. In the simple resource allocation, it's easy. In others, it's not. Okay, everybody following this? Then they'd say, oh, look, I had nine iterations. That was fewer.","zh":"使得A的转置乘以nu是正定的。再一次，你怎么找到这样的一个向量呢？这取决于具体情况。在一些情况下，这很容易。在简单的资源分配问题中，这很容易。在其他情况下，这并不容易。大家跟得上吗？然后他们会说，哦，看，我只用了九次迭代。那更少。","start":2835.26,"end":2854.44},{"id":132,"text":"than you did with Newton's method. Newton's method took 14 iterations, plus you have 500 variables. I have 100 variables and I did nine. Everybody following this? So I have heard people say this to each other or put this in slides. It's just, it turns out it's all so wrong and so stupid, it's not even funny. So, okay, so.","zh":"比你用牛顿法所用的次数少。牛顿法用了14次迭代，而且你还得处理500个变量。我只有100个变量，却只用了九次。大家跟得上吗？所以，我听过人们之间这么说，或者把这种说法放在幻灯片上。结果发现，这全是错误和愚蠢的，甚至不值得笑。所以，好的，那么。","start":2855.0,"end":2874.07}],"notes":["本段讨论了牛顿法在对偶问题中的应用，以及人们在实际应用中可能存在的误解。讲者指出，虽然对偶问题可能具有更少的变量，但并不意味着其计算效率一定更高。讲者强调，这种说法是错误的，因为对偶问题的可行性条件和迭代次数并不一定比原问题更优。","讲者提到，对偶变量在资源分配问题中对应边际效用，这使得对偶问题在某些情况下可以被解释为价格发现方法。然而，这种解释并不改变对偶问题的计算复杂性，讲者指出这种说法是误导性的。","讲者指出，虽然对偶问题可能具有更少的变量，但实际计算中，对偶问题的迭代次数和计算复杂性并不一定更优。例如，讲者提到，对偶问题可能只需要9次迭代，而牛顿法需要14次迭代，但这并不意味着对偶问题更高效。","讲者强调，对偶问题的可行性条件（如A^T ν > 0）可能并不容易满足，这取决于具体问题的结构。因此，对偶问题的求解并不总是比原问题更容易。","讲者指出，人们常常错误地认为对偶问题的变量更少，因此计算效率更高，但实际上这种说法并不成立。讲者认为这种误解是普遍存在的，并且是错误的。","讲者最后指出，这种误解在学术和工程实践中非常常见，但实际上是错误的。讲者认为，这种错误的观念不仅不正确，而且令人啼笑皆非。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2702.71,"end":2874.07,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2702.71,"text":"All right, so here's what happens if you run this. I think this is just run from several different initial conditions. And, you know, you see your classic Newton thing. This is what you're looking for, right? This is a log plot, and this is linear. This is a semi-log plot, and you're looking for this acceleration, right? That's when you declare success. That's Newton's. That's how you know you actually have an implementation of Newton's method. Okay? So, okay, and you have that. Okay, that's one."},{"start":2734.08,"text":"we could actually apply Newton's method to the dual, right? And let's actually see. I think, let's see, did I say what the, oh, I did say what the numbers were. Aha, okay. So here I said that there's 100 equality constraints and 500 variables, right? So in this problem, yeah, we're, this is, you know, we have basically 500 variables, right?"},{"start":2760.4,"text":"But then someone says, oh, no, no, I learned about this dual. It's really awesome. Plus, it sounds fancy, and so you can impress your friends if they're gullible or whatever. And you can say, oh, no, no, to solve that resource allocation, I'm going to solve the dual resource allocation. And if you say it the right way, it sounds really sophisticated. And then someone say, you could even then say things like, actually, what I'm doing, mine is a price discovery method because the dual variables are, in fact, precisely."},{"start":2787.81,"text":"You know, in a resource allocation, they are precisely the marginal utilities, right, of the thing. So you'd say, oh, no, I'm using, I'm solving the dual problem. And you could blabber on and on. And you'd say, also, plus, I only have 100 variables. Whoever was solving the Newton thing, they had 500. And last time I checked, 100 is smaller than 500. So should be."},{"start":2810.07,"text":"should be, you know, I should be a factor of five cubed better. I should be 100x faster. Everybody following this? This is what someone might say, and actually people say this all the time, is completely wrong, of course, right? Okay, so we'll solve this method, and then you get down and you say, oh, look, you started from a couple of different things. Oh, by the way, this requires, you have to have something feasible for the dual, and that's basically, I have to find a vector."},{"start":2835.26,"text":"with A transpose nu positive. Once again, how do you find such a, well, it depends. In some cases, it's easy. In the simple resource allocation, it's easy. In others, it's not. Okay, everybody following this? Then they'd say, oh, look, I had nine iterations. That was fewer."},{"start":2855.0,"text":"than you did with Newton's method. Newton's method took 14 iterations, plus you have 500 variables. I have 100 variables and I did nine. Everybody following this? So I have heard people say this to each other or put this in slides. It's just, it turns out it's all so wrong and so stupid, it's not even funny. So, okay, so."}],"speech_gaps":[],"frame":"../frames/v015/017.webp","frame_time":2714.71},{"title":"牛顿法在凸优化中的实现与复杂度分析","segments":[{"id":133,"text":"We'll get to that. That's a fun part in the end. Then you'd say, well, there's the infeasible start Newton method. This is the only one that has an extremely simple initialization. You don't have to satisfy AX equals B. You only have to satisfy that you're in the domain of F. F is the sum of negative logs. The domain is R++ to the N. So you initialize with ones or your favorite other positive vector, and you're done.","zh":"我们会讲到这一点。这是最后很有趣的一部分。然后你会说，嗯，这里有不可行初始点牛顿法。这是唯一一个具有极其简单初始化方法的算法。你不需要满足AX等于B。你只需要满足你处于F的定义域内。F是负对数的和。定义域是R++的N维空间。因此，你可以用全1向量或你最喜欢的其他正向量进行初始化，然后就完成了。","start":2875.06,"end":2901.37},{"id":134,"text":"And you'd say, look, here's what it is. And they'd say, oh, you're doing 22 steps. Anyway, this is all just silly. Let's look a little bit more closely at what happens. By the way, these methods would be wildly different if you used naive linear algebra. If you used naive numerical linear algebra, if you actually formed a KKT matrix or whatever, the full thing and solved it, this would be different.","zh":"你会说，看，这就是它的样子。他们会说，哦，你只用了22步。不管怎样，这都只是些无聊的事情。让我们更仔细地看一下会发生什么。顺便说一句，如果你使用朴素的线性代数，这些方法会完全不同。如果你使用朴素的数值线性代数，如果你实际上构造了一个KKT矩阵或任何完整的矩阵并求解它，结果就会不同。","start":2901.87,"end":2930.19},{"id":135,"text":"But if you actually do the analysis to figure out, assuming you actually know how to use linear algebra, then it turns out, well, it's not shocking. They're all actually identical in complexity. We'll see how that works. So to use Newton's method, you use block elimination on this, and you would end up solving something that looks like A times a diagonal matrix times A transpose. That's what you'd form and solve that system.","zh":"但如果你实际进行分析，以确定如何使用线性代数，结果会发现，这并不令人惊讶。它们在复杂度上实际上是完全相同的。我们会看到这是如何实现的。因此，使用牛顿法，你对这个进行块消元，最终会求解一个看起来像A乘以一个对角矩阵再乘以A转置的问题。这就是你构造并求解的系统。","start":2930.91,"end":2959.37},{"id":136,"text":"Okay? Okay. Notice that this is the smaller one. That's the 100 by 100 linear system, right? If you wanted to do the dual, you'd actually have to work out what is the Hessian of the dual objective, right? And it turns out that it's going to be identical. You're going to solve something that looks like A times a diagonal matrix, positive matrix times A transpose times delta nu. And, you know, this is just the detail of what it is. Okay?","zh":"明白了吗？明白了吗。请注意，这是较小的那个。这是100乘100的线性系统，对吧？如果你想做对偶问题，你实际上需要计算对偶目标函数的Hessian矩阵，对吧？结果发现它会是相同的。你会求解一个看起来像A乘以一个对角矩阵、正矩阵再乘以A转置乘以delta nu的问题。这只是它具体形式的细节。明白了吗？","start":2960.01,"end":2989.77},{"id":137,"text":"So once again, you would solve a 100 by 100 set of linear equations. Okay. If you use block elimination, you end up with this. Oh, hey, wait a minute. That's identical to this. The only thing different is that this is zero because you're assuming x is feasible. And down here, we actually are putting in...","zh":"再一次，你会求解一个100乘100的线性方程组。明白了吗。如果你使用块消元法，你会得到这个结果。哦，等等，这和上面的是一样的。唯一不同的是，这里为零，因为你假设x是可行的。而在下面，我们实际上输入了……","start":2990.33,"end":3010.73},{"id":138,"text":"the residual, right? So this need not be zero. If you're not yet feasible, then B minus AX is not zero, right? And this is going to actually reduce to solving this exactly the same system, but with a different right-hand side, right? That's the difference. So the conclusion is that basically in all three of these methods that look wildly different and someone could","zh":"残差，对吧？所以这不需要为零。如果你尚未可行，那么B减去A乘以X就不为零，对吧？而这实际上会减少为求解完全相同的系统，只是右边的常数项不同，对吧？这就是区别。因此结论是，基本上在这三种看起来截然不同的方法中，有人可能会","start":3011.07,"end":3039.03}],"notes":["本段讨论了牛顿法在凸优化中的实现，特别是不可行起始牛顿法的初始化过程。该方法只需要在F的定义域内初始化，即使用正向量，而不需要满足AX=B的约束条件。F是负对数的和，其定义域为R++^N。","讲者指出，如果使用朴素的线性代数方法，如直接构造KKT矩阵并求解，会导致不同的计算过程。但通过分析，所有方法在复杂度上是相同的，因为它们最终都归结为求解相似的线性系统。","在使用牛顿法时，通过块消元法，最终需要求解的系统形式为A乘以对角矩阵再乘以A的转置。这与对偶问题中的Hessian矩阵形式相同，因此计算复杂度一致。","当变量x可行时，残差项为零，但若不可行，则残差项不为零，导致求解的线性系统右端项不同。这说明不同方法在实现细节上存在差异，但核心计算结构相同。","讲者强调，尽管不同方法在表面上差异显著，但它们在计算复杂度上是等价的，这为实际应用提供了理论依据。","通过分析，讲者展示了牛顿法在不同场景下的实现方式，包括可行和不可行起始点，以及对偶问题的处理方式，突出了其在凸优化中的通用性和有效性。"],"formulas":[{"latex":"A \\times \\text{\\textbf{对角矩阵}} \\times A^T","symbols":"A乘以对角矩阵再乘以A的转置","explanation":"保持原式，对角矩阵的描述更明确，符合数学表达习惯。","evidence":"But if you actually do the analysis to figure out, assuming you actually know how to use linear algebra, then it turns out, well, it's not shocking. They're all actually identical in complexity. We'll see how that works. So to use Newton's method, you use block elimination on this, and you would end up solving something that looks like A times a diagonal matrix times A transpose. That's what you'd form and solve that system."},{"latex":"A \\times \\text{\\textbf{对角矩阵}} \\times A^T \\times \\delta \\nu","symbols":"A乘以对角矩阵再乘以A的转置乘以delta nu","explanation":"保持原式，delta nu表示增量或扰动，符合数学表达习惯。","evidence":"Okay? Okay. Notice that this is the smaller one. That's the 100 by 100 linear system, right? If you wanted to do the dual, you'd actually have to work out what is the Hessian of the dual objective, right? And it turns out that it's going to be identical. You're going to solve something that looks like A times a diagonal matrix, positive matrix times A transpose times delta nu. And, you know, this is just the detail of what it is. Okay?"},{"latex":"B - A X","symbols":"残差项","explanation":"保持原式，B - A X 表示残差项，符合数学表达习惯。","evidence":"So once again, you would solve a 100 by 100 set of linear equations. Okay. If you use block elimination, you end up with this. Oh, hey, wait a minute. That's identical to this. The only thing different is that this is zero because you're assuming x is feasible. And down here, we actually are putting in..."}],"uncertainties":[],"diagram":"none","start":2875.06,"end":3039.03,"asr_flags":[],"math_clarifications":["所有公式均符合数学表达习惯，无需进一步修改。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2875.06,"text":"We'll get to that. That's a fun part in the end. Then you'd say, well, there's the infeasible start Newton method. This is the only one that has an extremely simple initialization. You don't have to satisfy AX equals B. You only have to satisfy that you're in the domain of F. F is the sum of negative logs. The domain is R++ to the N. So you initialize with ones or your favorite other positive vector, and you're done."},{"start":2901.87,"text":"And you'd say, look, here's what it is. And they'd say, oh, you're doing 22 steps. Anyway, this is all just silly. Let's look a little bit more closely at what happens. By the way, these methods would be wildly different if you used naive linear algebra. If you used naive numerical linear algebra, if you actually formed a KKT matrix or whatever, the full thing and solved it, this would be different."},{"start":2930.91,"text":"But if you actually do the analysis to figure out, assuming you actually know how to use linear algebra, then it turns out, well, it's not shocking. They're all actually identical in complexity. We'll see how that works. So to use Newton's method, you use block elimination on this, and you would end up solving something that looks like A times a diagonal matrix times A transpose. That's what you'd form and solve that system."},{"start":2960.01,"text":"Okay? Okay. Notice that this is the smaller one. That's the 100 by 100 linear system, right? If you wanted to do the dual, you'd actually have to work out what is the Hessian of the dual objective, right? And it turns out that it's going to be identical. You're going to solve something that looks like A times a diagonal matrix, positive matrix times A transpose times delta nu. And, you know, this is just the detail of what it is. Okay?"},{"start":2990.33,"text":"So once again, you would solve a 100 by 100 set of linear equations. Okay. If you use block elimination, you end up with this. Oh, hey, wait a minute. That's identical to this. The only thing different is that this is zero because you're assuming x is feasible. And down here, we actually are putting in..."},{"start":3011.07,"text":"the residual, right? So this need not be zero. If you're not yet feasible, then B minus AX is not zero, right? And this is going to actually reduce to solving this exactly the same system, but with a different right-hand side, right? That's the difference. So the conclusion is that basically in all three of these methods that look wildly different and someone could"}],"speech_gaps":[],"frame":"../frames/v015/018.webp","frame_time":2887.06},{"title":"对偶性与牛顿法的比较","segments":[{"id":139,"text":"try to argue they were wildly different, right? It's all the same, right? By the way, this is the same generally for duality, right? That if someone says, oh, you know, especially for Newton's method and things like that, they say, well, no, I'm going to use this to solve the dual or something. For methods like this, they're no different.","zh":"试着争论它们完全不同，对吧？其实都是一样的，对吧？顺便说一句，这在对偶性中也是一样的，对吧？如果有人说，哦，你知道的，特别是对于牛顿法之类的方法，他们会说，不，我要用这个来解决对偶问题或者其他什么。对于这些方法来说，它们并没有不同。","start":3039.84,"end":3059.22},{"id":140,"text":"if you use smart linear algebra. If you use naive linear algebra, they're very different. There are reasons to solve a dual instead of a primal, but much more advanced has to do with, if you want a distributed method or something like that, then it can start making a difference. But for a lot of these, there's no difference at all.","zh":"如果你使用聪明的线性代数，它们没有区别。如果你使用原始的线性代数，它们则非常不同。有理由选择解对偶问题而不是原问题，但更高级的考虑则涉及，如果你想要一个分布式方法或者其他类似的东西，那么这可能会开始产生差异。但对很多这些情况来说，根本没有区别。","start":3059.69,"end":3090.11},{"id":141,"text":"It's, I guess, flow utility maximization, right? So it looks like this. I have a graph, right? So I have some vertices, right? And I'll make it directed, right? So here's my graph. I mean, this doesn't matter, right? But I'm just going to draw a picture of it like this. There you go. Okay, there's my graph.","zh":"我想这就是流量效用最大化，对吧？所以看起来是这样的。我有一个图，对吧？所以我有一些顶点，对吧？我会把它设为有向的，对吧？这是我的图。我的意思是，这并不重要，对吧？我只是这样画出它的图。好了，这就是我的图。","start":3091.85,"end":3119.51},{"id":142,"text":"And then what I imagine is that each xi is going to represent a flow on an edge. So there's a flow here. By the way, x can be negative, as those of you in EE would know. This is called the reference direction. x negative says simply that the flow of whatever it really is, like, for example, electricity or current, charge, I should say.","zh":"然后我想象的是，每个 xi 将代表一条边上的流量。所以这里有一个流量。顺便说一句，x 可以是负数，正如你们中在电气工程领域的人所知道的。这被称为参考方向。x 为负数仅仅表示实际的流量，比如电流、电荷等，方向与参考方向相反。","start":3120.32,"end":3144.38},{"id":143,"text":"If it's negative, it means it goes in the opposite direction of what's called the reference direction. Everybody got this, right? And this comes up in a lot of things. AX equals B is actually... AX equals 0 says that you have flow conservation if A is the incidence matrix, right? That would be flow conservation. And in fact, you would call...","zh":"如果它是负数，这意味着它与所谓的参考方向相反。大家明白这一点，对吧？这在很多事物中都会出现。AX 等于 B 实际上……AX 等于 0 表示如果你 A 是关联矩阵，那么你有流量守恒，对吧？这就是流量守恒。事实上，你会称之为……","start":3144.9,"end":3170.82},{"id":144,"text":"You call an x with ax equals zero, that's called a circulation, right? Because it's something where at each node you have conservation, right? And so an x that satisfies that is called a circulation because here's an example of a circulation. I have a flow of one, one, one, one. It's a flow in a circle here, which would be a circulation. When you have b, what it corresponds to is that","zh":"你会称之为满足 AX 等于 0 的 x，这被称为循环流，对吧？因为这是在每个节点上都满足守恒的某种情况，对吧？所以满足这个条件的 x 被称为循环流，因为这里有一个循环流的例子。我有一个流量为 1、1、1、1 的情况。这是一个环形的流量，这就是循环流。当你有 b 时，它所对应的是……","start":3171.48,"end":3199.97}],"notes":["本段讨论了对偶问题与原始问题在求解方法上的差异，指出使用智能线性代数技术时，两者在计算上没有显著区别，但使用朴素线性代数时差异较大。这表明在实际应用中，选择合适的线性代数方法对计算效率有重要影响。","讲者提到在分布式方法中，求解对偶问题可能更有优势，这表明对偶问题在分布式优化中具有潜在的应用价值。然而，对于大多数情况，原始问题和对偶问题在计算上是等价的。","讲者通过流效用最大化问题作为例子，说明了流网络中的流量表示和参考方向的概念。负流量表示与参考方向相反的流动，这在电路分析等实际问题中具有重要意义。","讲者提到流守恒的条件，即当A是关联矩阵时，AX=0表示流守恒。这表明在流网络中，流守恒是基本的物理约束，而满足该条件的解被称为循环（circulation）。","讲者指出，当存在非零的B时，AX=B表示流的平衡条件，这与流守恒的概念相关。这表明在流网络中，流的分布需要满足特定的平衡条件。","讲者通过一个具体的例子说明了循环的定义，即在环形网络中，每个边的流量相等，形成一个闭合的循环。这表明循环是流网络中的一种特殊解，具有重要的理论和应用价值。"],"formulas":[{"latex":"\\mathrm{A}X = 0","symbols":"A 是关联矩阵，X 是流量向量，表示流守恒","explanation":"公式正确，表示流守恒条件，即流量在每个节点上保持平衡。","evidence":"If it's negative, it means it goes in the opposite direction of what's called the reference direction. Everybody got this, right? And this comes up in a lot of things. AX equals B is actually... AX equals 0 says that you have flow conservation if A is the incidence matrix, right? That would be flow conservation. And in fact, you would call..."}],"uncertainties":[],"diagram":"none","start":3039.84,"end":3199.97,"asr_flags":[],"math_clarifications":["公式AX = 0和AX = B在数学上是正确的，分别表示流守恒和流的平衡条件。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3039.84,"text":"try to argue they were wildly different, right? It's all the same, right? By the way, this is the same generally for duality, right? That if someone says, oh, you know, especially for Newton's method and things like that, they say, well, no, I'm going to use this to solve the dual or something. For methods like this, they're no different."},{"start":3059.69,"text":"if you use smart linear algebra. If you use naive linear algebra, they're very different. There are reasons to solve a dual instead of a primal, but much more advanced has to do with, if you want a distributed method or something like that, then it can start making a difference. But for a lot of these, there's no difference at all. Okay. Let's look at, this is actually a real and cool example. So let me just show you what it is."},{"start":3091.85,"text":"It's, I guess, flow utility maximization, right? So it looks like this. I have a graph, right? So I have some vertices, right? And I'll make it directed, right? So here's my graph. I mean, this doesn't matter, right? But I'm just going to draw a picture of it like this. There you go. Okay, there's my graph."},{"start":3120.32,"text":"And then what I imagine is that each xi is going to represent a flow on an edge. So there's a flow here. By the way, x can be negative, as those of you in EE would know. This is called the reference direction. x negative says simply that the flow of whatever it really is, like, for example, electricity or current, charge, I should say."},{"start":3144.9,"text":"If it's negative, it means it goes in the opposite direction of what's called the reference direction. Everybody got this, right? And this comes up in a lot of things. AX equals B is actually... AX equals 0 says that you have flow conservation if A is the incidence matrix, right? That would be flow conservation. And in fact, you would call..."},{"start":3171.48,"text":"You call an x with ax equals zero, that's called a circulation, right? Because it's something where at each node you have conservation, right? And so an x that satisfies that is called a circulation because here's an example of a circulation. I have a flow of one, one, one, one. It's a flow in a circle here, which would be a circulation. When you have b, what it corresponds to is that"}],"speech_gaps":[],"frame":"../frames/v015/019.webp","frame_time":3051.84},{"title":"网络流优化与节点关联矩阵","segments":[{"id":145,"text":"You actually have someone injecting at each node. And again, this can either be injecting or pulling stuff out. Depends on what it is, right? So this is what a network would look like for that. Here, I'll put another edge here just for fun. So this is my network, right? And this would have lots of examples. Oh, some people call it a single commodity flow problem.","zh":"你实际上在每个节点都有人注入东西。同样，这既可以是注入也可以是取出东西，这取决于具体是什么，对吧？这就是这种网络的样子。在这里，我再添加一条边，只是为了好玩。这就是我的网络，对吧？这会有许多例子。哦，有些人称之为单商品流问题。","start":3200.33,"end":3226.58},{"id":146,"text":"Single commodity means it's a single commodity, which is whatever is moving across here. It could be charge in an electrical circuit. This could be a power grid where we are not taking into account transmission losses. So if someone is pumping power in, that's a generator. If they're pulling it off, that is a load. And then...","zh":"单商品意味着只有一个商品，也就是在这里流动的东西。它可以是电路中的电荷。这也可以是一个电力网络，我们不考虑输电损耗。如果有人在注入电力，那就是一个发电机；如果他们取出电力，那就是一个负载。然后……","start":3227.39,"end":3251.15},{"id":147,"text":"This is the power flows on all these transmission lines. This is neglecting losses in the transmission line, which is actually not a bad thing. It's a perfectly good model. But this could be like lots of other stuff. This could be flows of money in a banking system. It could be all sorts of stuff. Flow of mass.","zh":"这是所有这些输电线路中的电力流动。这忽略了输电线路上的损耗，实际上并不是一个坏事情。这是一个非常好的模型。但这也可以是其他许多东西。这可以是银行系统中的资金流动，也可以是各种各样的东西。质量的流动。","start":3251.52,"end":3276.08},{"id":148,"text":"Or something like that, uh, movement of a drug from different compartments in a person. Right, that's that's another one. But okay, um, all right, so this is network flow optimization. Um, okay, so the matrix A is like super duper sparse. Um, because actually each column has at most uh, it has uh, exactly","zh":"或者像这样，比如药物在人体不同隔室之间的移动。对，这也是另一个例子。不过，嗯，好吧，这就是网络流优化。嗯，好的，所以矩阵 A 非常稀疏。嗯，因为实际上每一列最多只有，嗯，它有，嗯，恰好","start":3276.82,"end":3302.38},{"id":149,"text":"two non-zeros. It's got a plus one and a minus one, right? Because each column corresponds to one edge here, and one edge goes between two vertices, so there's exactly two non-zeros, right? So A is this, I guess, A tilde. This is the, because we're going to reduce it in a minute. Yeah. So A tilde is going to be, the A tilde is the so-called node incidence matrix. That's not full rank.","zh":"两个非零元素。它有一个加一和一个减一，对吧？因为每一列对应这里的一条边，而一条边连接两个顶点，所以恰好有两个非零元素，对吧？所以 A 是这样的，我想，A 带波浪线。这就是，因为我们马上就要对其进行降维。是的。所以 A 带波浪线是所谓的节点关联矩阵。这不是满秩的。","start":3303.82,"end":3329.48},{"id":150,"text":"So you'd like remove one row and refer to, by the way, you do that and you refer to one of the nodes as ground. Now I'm speaking EE dialect, but that's what you do, right? So, okay. Let's see. How do I know that this is not full rank, right? How do I know that if I write a matrix that looks like this, right? You know, here.","zh":"所以你希望删除一行，并将其中一个节点称为地。现在我是在用电气工程术语说话，但这就是你所做的，对吧？所以，好的。那么我怎么知道这个矩阵不是满秩的，对吧？我怎么知道如果我写出一个看起来像这样的矩阵，对吧？你知道，在这里。","start":3330.14,"end":3357.3}],"notes":["本段讲解了网络流优化的基本概念，包括单商品流问题，其中单商品指的是在网络中流动的某种资源，如电荷、电力、资金或质量。讲者提到，这种模型可以用于电力系统，忽略传输损耗，其中发电机是注入电力的节点，负载是提取电力的节点。","讲者进一步说明了网络流优化中矩阵A的稀疏性，指出每个列最多有两个非零元素，即+1和-1，因为每条边连接两个节点。矩阵A被称作节点关联矩阵，但不是满秩的，因此需要移除一行以确定一个参考节点（ground）。","讲者提到，节点关联矩阵的非满秩性质可以通过观察其结构来理解，即每一行的和为零，因此矩阵的秩小于节点数。这种性质在电力系统建模中非常重要，因为可以将一个节点作为参考点，从而简化问题。","讲者还提到，网络流优化可以应用于多种场景，如药物在人体不同腔室之间的流动，这表明该模型具有广泛的适用性。此外，讲者强调了矩阵A的稀疏性，这在计算效率上具有重要意义。","讲者通过举例说明了网络流优化的结构，包括节点、边和流的定义，以及如何通过矩阵表示这些关系。同时，讲者指出，矩阵A的稀疏性是由于每条边连接两个节点，因此每个列只有两个非零元素。","最后，讲者提到如何通过移除一行来确定参考节点，并指出这种做法在电气工程中是常见的，这有助于简化模型并减少计算复杂度。"],"formulas":[{"latex":"A_{ij} = +1 \\text{ 如果边从节点 } i \\text{ 到节点 } j, -1 \\text{ 如果边从节点 } j \\text{ 到节点 } i, \\text{ 否则为 } 0","symbols":"A: 节点关联矩阵，表示网络中节点与边的关系","explanation":"公式正确描述了节点关联矩阵A的元素定义，其中每个元素表示边的方向。","evidence":"two non-zeros. It's got a plus one and a minus one, right? Because each column corresponds to one edge here, and one edge goes between two vertices, so there's exactly two non-zeros, right? So A is this, I guess, A tilde. This is the, because we're going to reduce it in a minute. Yeah. So A tilde is going to be, the A tilde is the so-called node incidence matrix. That's not full rank."},{"latex":"A \\text{ 的秩小于节点数，因为每一行的和为零}","symbols":"矩阵A的秩小于节点数，因为每一行的和为零","explanation":"公式正确指出矩阵A的秩不足，因为每一行的和为零，这是节点关联矩阵的典型性质。","evidence":"So you'd like remove one row and refer to, by the way, you do that and you refer to one of the nodes as ground. Now I'm speaking EE dialect, but that's what you do, right? So, okay. Let's see. How do I know that this is not full rank, right? How do I know that if I write a matrix that looks like this, right? You know, here."}],"uncertainties":["可能无法准确识别某些术语，如'ground'的具体含义，但根据上下文推测为参考节点。","关于矩阵A的稀疏性描述可能存在歧义，但根据讲者提到的'each column has at most two non-zeros'，可以确认其稀疏性。"],"diagram":"network","start":3200.33,"end":3357.3,"asr_flags":[],"math_clarifications":["公式中的描述与上下文一致，没有发现数学错误。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3200.33,"text":"you actually have someone is injecting at each node B. And again, this can either be injecting or pulling stuff out. Depends on what it is, right? So this is what a network would look like for that. Here, I'll put another edge here just for fun. So this is my network, right? And this would have lots of examples. Oh, some people call it a single commodity flow problem."},{"start":3227.39,"text":"Single commodity means it's a single commodity, which is whatever is moving across here. It could be charge in an electrical circuit. This could be a power grid where we are not taking into account transmission losses. So if someone is pumping power in, that's a generator. If they're pulling it off, that is a load. And then..."},{"start":3251.52,"text":"This is the power flows on all these transmission lines. This is neglecting losses in the transmission line, which is actually not a bad thing. It's a perfectly good model. But this could be like lots of other stuff. This could be flows of money in a banking system. It could be all sorts of stuff. Flow of mass."},{"start":3276.82,"text":"or something like that uh movement of a drug from different compartments in a person right that's that's another one but okay um all right so this is network flow optimization um okay so the matrix a is like super duper sparse um because actually each column has at most uh it has uh exactly"},{"start":3303.82,"text":"two non-zeros. It's got a plus one and a minus one, right? Because each column corresponds to one edge here, and one edge goes between two vertices, so there's exactly two non-zeros, right? So A is this, I guess, A tilde. This is the, because we're going to reduce it in a minute. Yeah. So A tilde is going to be, the A tilde is the so-called node incidence matrix. That's not full rank."},{"start":3330.14,"text":"So you'd like remove one row and refer to, by the way, you do that and you refer to one of the nodes as ground. Now I'm speaking EE dialect, but that's what you do, right? So, okay. Let's see. How do I know that this is not full rank, right? How do I know that if I write a matrix that looks like this, right? You know, here."}],"speech_gaps":[],"frame":"../frames/v015/020.webp","frame_time":3212.33},{"title":"矩阵秩与KKT系统分析","segments":[{"id":151,"text":"You know, right. If I make a matrix that looks like that, how do I know it's not full rank? Yeah, so you, if you just add up all the rows, you get zero, right? So that means like one transpose A is zero, right? And one is not, the one's vector is not zero, so that means it's not full rank, right?","zh":"你知道吧。如果我构造一个看起来像那样的矩阵，我怎么知道它不是满秩的？是的，所以如果你只是把所有行相加，就会得到零，对吧？这意味着A的转置乘以一个向量等于零，对吧？而这个向量本身不为零，所以这意味着它不是满秩的，对吧？","start":3358.81,"end":3387.21},{"id":152,"text":"Anyway, I won't go into the details. This is just very good stuff to have seen. Actually, how many people have seen stuff like this in some class somewhere? Okay, good. What context? Oh, flux balance and biology. Okay, good. Good. Yeah. Okay, you too. Linear programming class. Yeah. Okay, linear programming. Okay, good. And flux balance. Okay. All right.","zh":"总之，我不会深入细节。这只是非常值得一看的内容。实际上，有多少人曾在某个课程中见过类似的内容？好的。什么背景？哦，通量平衡和生物学。好的。好的。是的。好的，你也是。线性规划课程。是的。好的，线性规划。好的。通量平衡。好的。好吧。","start":3388.46,"end":3418.35},{"id":153,"text":"So let's look at the KKT system for this specific problem. Oh, so you're looking at this and you'd say, I don't know, how easy... Okay, California grid has about 3,100 X... No, it's about 6,000, come to think of it. Sorry, there's about 3,100 generators.","zh":"那么让我们来看这个问题的KKT系统。哦，当你看到这个时，你会说，我不知道，这有多容易……好吧，加州电网大约有3,100个……不，仔细想想，大概是6,000个。抱歉，大约有3,100个发电机。","start":3419.06,"end":3435.76},{"id":154,"text":"And there's about maybe 6,000 transmission lines, roughly, in California, right? So the question would be, you know, that's actually not a, that problem doesn't scare me because even if you were really dumb and just did it with dents and everything, it would still be just fine, right? But if I took like, I don't know, if I took the U.S. Western grid, then it would not be the case anymore, right? We would start getting 50,000, 100,000. So we'd be getting some big problems there.","zh":"加州大约有6,000条输电线路，对吧？那么问题是，你知道，实际上这不是一个问题，因为即使你真的很笨，只是用一些简单的办法来处理，它仍然会很顺利，对吧？但如果我拿美国西部电网来考虑，情况就不同了，对吧？我们会开始得到50,000，甚至100,000这样的数字。我们会遇到一些大问题。","start":3436.48,"end":3465.84},{"id":155,"text":"Okay, but when you see this, you should probably, lots of signs should be blinking. Number one, your objective is diagonal, right? So, sorry, the Hessian of your objective, your objective is separable, which means your Hessian is diagonal. So that should just, the first time you see this, you should just say, okay, I'm...","zh":"好的，但当你看到这个时，你应该会注意到很多信号在闪烁。第一点，你的目标函数是对角的，对吧？抱歉，你的目标函数的Hessian矩阵是对角的，因为你的目标函数是可分的。这意味着你的Hessian矩阵是对角的。所以第一次看到这个时，你应该只是说，好吧，我……","start":3466.2,"end":3487.44},{"id":156,"text":"I'm primed. I'm ready to do some actual linear algebra here. Then you see AX equals B and you say, what is that? And you say, that's this node incidence matrix. Every column has exactly two non-zero entries. Then your sparsity part of your brain should be like now blinking, right? And so at this point, you should actually, depending on, I don't know, you could say to whoever asked you to solve this problem, you could say, well, we're going to be able to solve that like shockingly efficiently.","zh":"我准备好了。我要在这里做一些实际的线性代数。然后你看到AX等于B，你会想，这是什么？你会说，这是一个节点关联矩阵。每一列恰好有两个非零元素。这时，你大脑中关于稀疏性的部分应该会亮起来，对吧？到了这个时候，你应该根据具体情况，比如说，你可以对要求你解决这个问题的人说，我们能够以惊人的效率来解决这个问题。","start":3487.72,"end":3516.32}],"notes":["本段讨论了如何判断矩阵是否满秩。通过观察矩阵的行和，如果所有行相加为零，则说明矩阵的秩不足。具体来说，如果矩阵的转置乘以一个非零向量得到零向量，那么该矩阵不是满秩的。这为后续分析提供了基础。","接下来，课程转向了KKT系统，这是优化问题中的关键概念。通过分析具体问题，如加州电网的规模，展示了如何处理大规模优化问题。课程指出，即使问题规模很大，只要结构合适，仍然可以高效求解。","在分析问题时，课程强调了目标函数的性质。如果目标函数是可分的，那么其Hessian矩阵将是对角矩阵，这有助于简化计算。这种结构提示了问题的稀疏性，从而可以采用更高效的算法。","课程还提到，当遇到类似AX=B的结构时，应识别其为节点-边矩阵，这种矩阵的稀疏性可以被利用，从而显著提高求解效率。这展示了如何利用问题的结构特性来优化计算过程。","最后，课程指出，当面对大规模问题时，如美国西部电网，问题的复杂性会显著增加，需要更复杂的处理方法。这强调了问题规模对计算复杂性的影响。","整体上，本段通过具体例子和结构分析，展示了如何利用矩阵的性质和问题的结构来优化计算过程，为后续的优化算法提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3358.81,"end":3516.32,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3358.81,"text":"You know, right. If I make a matrix that looks like that, how do I know it's not full rank? Yeah, so you, if you just add up all the rows, you get zero, right? So that means like one transpose A is zero, right? And one is not, the one's vector is not zero, so that means it's not full rank, right?"},{"start":3388.46,"text":"Anyway, I won't go into the details. This is just very good stuff to have seen. Actually, how many people have seen stuff like this in some class somewhere? Okay, good. What context? Oh, flux balance and biology. Okay, good. Good. Yeah. Okay, you too. Linear programming class. Yeah. Okay, linear programming. Okay, good. And flux balance. Okay. All right."},{"start":3419.06,"text":"So let's look at the KKT system for this specific problem. Oh, so you're looking at this and you'd say, I don't know, how easy... Okay, California grid has about 3,100 X... No, it's about 6,000, come to think of it. Sorry, there's about 3,100 generators."},{"start":3436.48,"text":"And there's about maybe 6,000 transmission lines, roughly, in California, right? So the question would be, you know, that's actually not a, that problem doesn't scare me because even if you were really dumb and just did it with dents and everything, it would still be just fine, right? But if I took like, I don't know, if I took the U.S. Western grid, then it would not be the case anymore, right? We would start getting 50,000, 100,000. So we'd be getting some big problems there."},{"start":3466.2,"text":"Okay, but when you see this, you should probably, lots of signs should be blinking. Number one, your objective is diagonal, right? So, sorry, the Hessian of your objective, your objective is separable, which means your Hessian is diagonal. So that should just, the first time you see this, you should just say, okay, I'm..."},{"start":3487.72,"text":"I'm primed. I'm ready to do some actual linear algebra here. Then you see AX equals B and you say, what is that? And you say, that's this node incidence matrix. Every column has exactly two non-zero entries. Then your sparsity part of your brain should be like now blinking, right? And so at this point, you should actually, depending on, I don't know, you could say to whoever asked you to solve this problem, you could say, well, we're going to be able to solve that like shockingly efficiently."}],"speech_gaps":[],"frame":"../frames/v015/021.webp","frame_time":3370.81},{"title":"使用KKT系统解决大规模优化问题","segments":[{"id":157,"text":"And they'd say, yeah, but I have like a million X's and 10 million. I have a million nodes and in my power network and I have, you know, 10 million edges. Really? And you go, yeah. They'll say, are you going to use a gradient method? And you're like, no, dude, we're going full Newton on this. Right. And they're like, how could you do it? You see what I'm saying? Right. There's still people stuck in this mindset. Actually, I'd say the vast majority would not know this. Right. So anyway.","zh":"他们会说，是啊，但我有百万个X，还有1000万。我在电力网络中有百万个节点，还有1000万条边。真的吗？然后你会说，是的。他们接着问，你打算用梯度法吗？你会回答，不，伙计，我们在这上面要全用牛顿法。对吧。他们就会问，你怎么能做到呢？你明白我的意思吧。对吧。仍然有很多人被困在这种思维模式里。实际上，我敢说绝大多数人并不知道这一点。对吧。所以不管怎样。","start":3517.15,"end":3543.32},{"id":158,"text":"And you'd say, yeah. They'd say, well, how can you do that? You can't even form the Hessian. And you're right. You'd say, yeah, you're right. I'm not going to form the Hessian. I'm going to solve a KKT system. I'm going to exploit the structure, and I'll be able to do it fast, and that's how. Okay. Okay. So here it is. That's our diagonal part of the Hessian.","zh":"你会说，是的。他们会问，那你怎么做到的？你甚至无法形成Hessian矩阵。你说得对。你会说，是的，你说得对。我不会形成Hessian矩阵。我要解一个KKT系统。我要利用结构，这样我就能快速完成，就是这样。好的。好的。所以这就是我们的Hessian矩阵的对角部分。","start":3544.15,"end":3566.59},{"id":159,"text":"we will do some elimination here. And you'll end up computing, forming this matrix here. By the way, this matrix is, if you've heard of it, it's a Laplacian matrix, right? So in circuits, this would be literally the conductance matrix. Again, that's how you'd say it in EE. But in other fields, it's got other names, right? So this is a conductance matrix, or a Laplacian. Laplacian means the diagonals are positive, the off diagonals,","zh":"我们会在这里做一些消元。你最终会计算并形成这个矩阵。顺便说一句，如果你听说过这个矩阵，它被称为拉普拉斯矩阵，对吧？在电路中，这实际上是导纳矩阵。再次强调，在电子工程中你会这样称呼它。但在其他领域，它有其他名称，对吧？所以这可以称为导纳矩阵，或者拉普拉斯矩阵。拉普拉斯矩阵的对角线元素是正的，非对角线元素是非正的，","start":3567.44,"end":3596.26},{"id":160,"text":"are non-positive, and the sum of each row is going to be zero. That's if we don't do the reduced one, but that's fine. Actually, if we do the reduced one, it's fine too. Everybody got that? By the way, this thing here, solving so-called Laplacian equations like this, that's like a whole sub-industry, mostly theoretical computer science.","zh":"每一行的总和将是零。这是在不进行约简的情况下，但没关系。实际上，即使进行约简，也没关系。大家明白了吗？顺便说一句，解决这种所谓的拉普拉斯方程，是一个完整的子行业，主要属于理论计算机科学领域。","start":3596.62,"end":3623.66},{"id":161,"text":"If you type that into Google, you'll find lots of stuff. Mostly, to be perfectly bluntly honest about it, completely and utterly useless. There are very good methods to do it that are not those. Okay, so let's see. You can even say this thing, this Laplacian matrix, is actually, we know the sparsity pattern of it immediately, which is really cool. It's basically this.","zh":"如果你在谷歌上搜索这个内容，你会发现很多资料。坦白说，大部分内容完全无用。存在非常好的方法来解决这个问题，而这些方法并不是那些所谓的拉普拉斯方法。好的，那么让我们看看。你甚至可以说，这个拉普拉斯矩阵，我们立刻就知道它的稀疏模式，这真的很棒。它基本上就是这个样子。","start":3626.14,"end":3652.26},{"id":162,"text":"This is, it's basically nodes by nodes. So if I had, you know, a million nodes, this would be a million by million matrix. But what it says is that nodes I and J, it's only if they're connected by an arc, would it be true that this matrix here, the Schur complement, is going to have a non-zero. Okay? So if I told you my original power network had 10 million nodes, a million nodes, 10 million edges,","zh":"这是，基本上是按节点来处理。所以如果我有，比如说，一百万个节点，这就将是一个一百万乘一百万的矩阵。但这里说的是，节点i和节点j，只有当它们之间有弧连接时，这里的矩阵，也就是Schur补，才会有一个非零元素。明白吗？所以如果我告诉你我的原始电力网络有1000万个节点，一百万个节点，1000万条边，","start":3654.55,"end":3682.65}],"notes":["本段讨论了在大规模优化问题中使用KKT系统而非牛顿法的策略。讲者指出，当问题规模非常大时，计算Hessian矩阵是不可行的，因此需要利用问题的结构来求解KKT系统，从而实现快速求解。","讲者提到Laplacian矩阵的性质，包括对角线元素为正、非对角线元素非正，以及每行元素之和为零。这些性质在电路分析中被称为导纳矩阵，而在其他领域可能有不同的名称。","Laplacian矩阵的稀疏性模式是其重要特征之一，这使得在大规模网络中（如电力网络）可以高效地存储和处理该矩阵。讲者指出，这种矩阵的非零元素仅出现在节点之间有连接的位置。","讲者提到，虽然Laplacian方程在理论计算机科学中是一个重要的研究领域，但许多相关方法在实际应用中可能并不实用，因此需要寻找更有效的求解方法。","讲者强调，通过利用问题的结构，可以避免显式计算Hessian矩阵，从而在大规模优化问题中实现高效的求解。","讲者提到，对于具有100万个节点和1000万条边的电力网络，Laplacian矩阵的稀疏性模式使得可以高效地处理该问题，而无需
