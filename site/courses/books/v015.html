<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 15</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">15 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 15 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v015","title":"15 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 15","course":"凸优化","pages":[{"title":"自协调性与牛顿法收敛性分析","segments":[{"id":0,"text":"So let me, I just wanted to quickly review self-concordance just to make sure that the whole thing at a high level is clear. The basic idea is to make an analysis of convergence of Newton's method that is, like Newton's method, independent of affine changes of coordinates, right? So that's, and this is to correct this embarrassment that the..."},{"id":1,"text":"that the actual algorithm and the implementation is actually more sophisticated than the, well, was more sophisticated than the existing mathematical analyses of convergence, right? So, and what you'll recall last time is that it all comes down to this. As you know, the analysis of Newton's method comes down to how big is the third derivative? Because that's what it depends on. Third derivative is zero."},{"id":2,"text":"then Newton's method converges in one step, right? If it's small, that's what tells you it's going to work pretty well or something like that. It basically says how fast does the Hessian change as you move around, right? That's what it is. Okay, the classical analysis just uses that. It uses the most obvious measure of the size of the third derivative. If it was on for n equals 1, it would just be f prime prime prime absolute value."},{"id":3,"text":"which is like if someone walks up to the street and says, give me a measure of the size of the third derivative, that should be the first thing you say. Minor problem with that is that that is not independent. That is not independent of changes of coordinates. And so if you're given the homework exercise of..."},{"id":4,"text":"figure out a way to say that the third derivative is small, that will be independent of an affine change of coordinates. In other words, when you do this, it's going to lead you to basically comparing the absolute value of the third derivative to the three-halves power of the second derivative, like period. And you could put another number for two there, you could divide it and call it something else, whatever you like, but this is..."},{"id":5,"text":"From that point of view, otherwise this looks like entirely mysterious, like where did that come from? But that's all it is, right? What happens when you adopt this way to say that the Hessian varies smoothly or not much is weird stuff happens. So a lot of functions that we actually work with actually satisfy this property, this so-called self-concordant property, right?"},{"id":6,"text":"And I'm not going to go into this, and you can actually look into how you would show this. Not all convex functions, in fact, not all convex functions that we are interested in are self-concordant, but a whole lot are. When you repeat the analysis, an amazing thing comes out. Basically, what comes out is something that I am unable to make fun of."}],"notes":["本段主要讲解自协调性（self-concordance）的概念及其在牛顿法收敛性分析中的作用。自协调性是一种用于衡量函数的性质，使得牛顿法的收敛性分析可以独立于仿射坐标变换。这解决了传统分析中对坐标变换依赖的问题。","牛顿法的收敛性分析依赖于三阶导数的大小，因为三阶导数决定了Hessian矩阵的变化速度。当三阶导数为零时，牛顿法在一步内收敛。三阶导数的大小反映了Hessian矩阵的变化率，这在分析中是一个关键因素。","传统方法中，三阶导数的绝对值被用作衡量其大小的标准，但这种方法依赖于坐标变换。因此，需要找到一种独立于仿射变换的衡量方式，即通过将三阶导数与二阶导数的3/2次方进行比较。","自协调性是一种重要的性质，许多实际工作中使用的函数满足这一性质。这使得牛顿法的收敛性分析更加稳健，不依赖于具体的坐标系。","并非所有凸函数都是自协调的，但很多我们感兴趣的凸函数满足这一性质。当重复分析时，会发现一些令人惊讶的结果，这些结果与自协调性密切相关。","自协调性使得牛顿法的收敛性分析更加通用，适用于不同的坐标系。这在优化问题中具有重要的实际意义，因为它允许我们使用更灵活的分析方法。"],"formulas":[{"latex":"\\frac{\\left|f^{\\prime \\prime \\prime}(x)\\right|}{\\left|f^{\\prime \\prime}(x)\\right|^{3/2}}","symbols":"三阶导数与二阶导数的3/2次方的比值","explanation":"原始片段中提到的三阶导数与二阶导数的3/2次方的比值在数学上是合理的，且符合自洽性条件，因此保留。","evidence":"that the actual algorithm and the implementation is actually more sophisticated than the, well, was more sophisticated than the existing mathematical analyses of convergence, right? So, and what you'll recall last time is that it all comes down to this. As you know, the analysis of Newton's method comes down to how big is the third derivative? Because that's what it depends on. Third derivative is zero. then Newton's method converges in one step, right? If it's small, that's what tells you it's going to work pretty well or something like that. It basically says how fast does the Hessian change as you move around, right? That's what it is. Okay, the classical analysis just uses that. It uses the most obvious measure of the size of the third derivative. If it was on for n equals 1, it would just be f prime prime prime absolute value. which is like if someone walks up to the street and says, give me a measure of the size of the third derivative, that should be the first thing you say. Minor problem with that is that that is not independent. That is not independent of changes of coordinates. And so if you're given the homework exercise of... figure out a way to say that the third derivative is small, that will be independent of an affine change of coordinates. In other words, when you do this, it's going to lead you to basically comparing the absolute value of the third derivative to the three-halves power of the second derivative, like period. And you could put another number for two there, you could divide it and call it something else, whatever you like, but this is... From that point of view, otherwise this looks like entirely mysterious, like where did that come from? But that's all it is, right? What happens when you adopt this way to say that the Hessian varies smoothly or not much is weird stuff happens. So a lot of functions that we actually work with actually satisfy this property, this so-called self-concordant property, right? And I'm not going to go into this, and you can actually look into how you would show this. Not all convex functions, in fact, not all convex functions that we are interested in are self-concordant, but a whole lot are. When you repeat the analysis, an amazing thing comes out. Basically, what comes out is something that I am unable to make fun of."}],"uncertainties":[],"diagram":"none","start":5.01,"end":182.05,"asr_flags":[],"math_clarifications":["原始片段中提到的三阶导数的绝对值和三阶导数与二阶导数的3/2次方的比值在数学上是合理的，但根据规则，不能将概率分布/密度等于其均值，因此需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":5.01,"text":"So let me, I just wanted to quickly review self-concordance just to make sure that the whole thing at a high level is clear. The basic idea is to make an analysis of convergence of Newton's method that is, like Newton's method, independent of affine changes of coordinates, right? So that's, and this is to correct this embarrassment that the..."},{"start":30.46,"text":"that the actual algorithm and the implementation is actually more sophisticated than the, well, was more sophisticated than the existing mathematical analyses of convergence, right? So, and what you'll recall last time is that it all comes down to this. As you know, the analysis of Newton's method comes down to how big is the third derivative? Because that's what it depends on. Third derivative is zero."},{"start":58.05,"text":"then Newton's method converges in one step, right? If it's small, that's what tells you it's going to work pretty well or something like that. It basically says how fast does the Hessian change as you move around, right? That's what it is. Okay, the classical analysis just uses that. It uses the most obvious measure of the size of the third derivative. If it was on for n equals 1, it would just be f prime prime prime absolute value."},{"start":84.65,"text":"which is like if someone walks up to the street and says, give me a measure of the size of the third derivative, that should be the first thing you say. Minor problem with that is that that is not independent. That is not independent of changes of coordinates. And so if you're given the homework exercise of..."},{"start":100.84,"text":"figure out a way to say that the third derivative is small, that will be independent of an affine change of coordinates. In other words, when you do this, it's going to lead you to basically comparing the absolute value of the third derivative to the three-halves power of the second derivative, like period. And you could put another number for two there, you could divide it and call it something else, whatever you like, but this is..."},{"start":128.14,"text":"From that point of view, otherwise this looks like entirely mysterious, like where did that come from? But that's all it is, right? What happens when you adopt this way to say that the Hessian varies smoothly or not much is weird stuff happens. So a lot of functions that we actually work with actually satisfy this property, this so-called self-concordant property, right?"},{"start":159.61,"text":"And I'm not going to go into this, and you can actually look into how you would show this. Not all convex functions, in fact, not all convex functions that we are interested in are self-concordant, but a whole lot are. When you repeat the analysis, an amazing thing comes out. Basically, what comes out is something that I am unable to make fun of."}],"speech_gaps":[],"frame":"../frames/v015/001.webp","frame_time":17.009999999999998},{"title":"收敛分析的对比与简化","segments":[{"id":7,"text":"Because the way I make fun of a typical convergence analysis is, here's my prototype convergence analysis. If, and then a long list of things that you could never possibly verify or know. Hold. Then, and then it gives a silly conclusion which is also weak and pathetic and doesn't really even say anything. So that's my model of what I see a convergence analysis looking like. This."},{"id":8,"text":"This I can't make fun of because it basically starts by, there's nothing unknown in the hypotheses, right? It's just if it's self-concordant, that's it. And we know for a whole bunch of functions that we actually care about, it is. And then there are parameters in the analysis. The analysis is very simple, right? It simply looks like this. It says, oh, and by the way, it's measured by lambda, which you'll remember is the gradient."},{"id":9,"text":"times the Hessian inverse times the gradient, it's actually the square root of that or something, that is actually a measure of the gradient, which is independent of an affine change of coordinates, right? So if you have this beautiful algorithm and then the last thing you have in your code is a convergence thing that looks like norm of the gradient, congratulations, it's now dependent, weakly dependent on changes of coordinates, right? So, okay."},{"id":10,"text":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."},{"id":11,"text":"I mean, there would be isolated cases where I would know M and L, but mostly you would not. So then you get a complexity bound that looks like this, and what's amazing is that it's everything here you know. I mean, oh, one minor, we still have the embarrassment of P star here. We will talk about that. We'll see this. This will come up maybe next week in interior point methods. We'll take care of that."},{"id":12,"text":"You can still make fun of it that way, but it's fine. Because if I replace P star with any lower bound on P star, then I still get an upper bound on the number of steps. Yeah, so that's the idea. Okay. Yeah, and if you work this out, this is a sloppy analysis that, you know, leaving an idea, you get something like 375 times the difference. So..."}],"notes":["本段讨论了收敛分析的两种不同风格。第一种是典型的收敛分析，它包含大量无法验证或已知的假设，并得出一个弱而无意义的结论。第二种分析则更加简洁，假设函数是自洽的，且已知许多实际关心的函数满足这一条件。这种分析中，参数如lambda（梯度）被用来衡量收敛性，但其依赖于坐标变换，因此可能不够鲁棒。","在第二种分析中，作者指出，当函数值的下降量小于某个临界值eta时，可以实现二次收敛。然而，这种分析忽略了像m和l这样的复杂参数，这些参数通常无法直接获得。尽管如此，这种分析仍然具有实用性，因为它基于已知的参数，如P star（最优值）。","作者提到，即使P star（最优值）仍然存在，但可以通过用P star的下界来替代，从而得到步骤数的上界。这表明，即使在某些情况下存在不确定性，这种分析仍然可以提供有用的上界。","作者还指出，这种分析虽然粗糙，但可以提供一个大致的步骤数估计，例如375倍的差异。这说明，尽管分析可能不够精确，但它仍然可以作为实际应用中的指导。","在讨论中，作者强调了收敛分析中参数选择的重要性，特别是lambda（梯度）和Hessian逆矩阵的乘积，这可以作为梯度的度量。然而，这种度量依赖于坐标变换，因此可能不够稳定。","最后，作者提到，这种分析虽然简单，但仍然可以用于实际应用，尤其是在内部点方法中，P star的问题可能会被进一步讨论和解决。"],"formulas":[{"latex":"\\|\\nabla f\\|","symbols":"梯度的范数","explanation":"梯度的范数是标准的数学表达，符合数学规范。","evidence":"times the Hessian inverse times the gradient, it's actually the square root of that or something, that is actually a measure of the gradient, which is independent of an affine change of coordinates, right? So if you have this beautiful algorithm and then the last thing you have in your code is a convergence thing that looks like norm of the gradient, congratulations, it's now dependent, weakly dependent on changes of coordinates, right? So, okay."},{"latex":"\\gamma","symbols":"函数值的下降量","explanation":"γ 通常用于表示函数值的下降量，符合数学规范。","evidence":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."},{"latex":"\\eta","symbols":"临界值","explanation":"η 通常用于表示临界值，符合数学规范。","evidence":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."}],"uncertainties":["lambda = \\sqrt{\\nabla f^T H^{-1} \\nabla f} 的具体形式是否准确，因为原句中提到 'it's actually the square root of that or something'，可能存在模糊性。"],"diagram":"none","start":182.61,"end":342.7,"asr_flags":[],"math_clarifications":["λ 未明确其定义，且未与梯度建立数学关系，无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":182.61,"text":"Because the way I make fun of a typical convergence analysis is, here's my prototype convergence analysis. If, and then a long list of things that you could never possibly verify or know. Hold. Then, and then it gives a silly conclusion which is also weak and pathetic and doesn't really even say anything. So that's my model of what I see a convergence analysis looking like. This."},{"start":208.92,"text":"This I can't make fun of because it basically starts by, there's nothing unknown in the hypotheses, right? It's just if it's self-concordant, that's it. And we know for a whole bunch of functions that we actually care about, it is. And then there are parameters in the analysis. The analysis is very simple, right? It simply looks like this. It says, oh, and by the way, it's measured by lambda, which you'll remember is the gradient."},{"start":234.76,"text":"times the Hessian inverse times the gradient, it's actually the square root of that or something, that is actually a measure of the gradient, which is independent of an affine change of coordinates, right? So if you have this beautiful algorithm and then the last thing you have in your code is a convergence thing that looks like norm of the gradient, congratulations, it's now dependent, weakly dependent on changes of coordinates, right? So, okay."},{"start":264.23,"text":"And it looks the same. It basically says that for a while, you are guaranteed that there's a guaranteed decrease of gamma in the function value. And then once you're less than this critical value eta for lambda, then in fact you get this quadratic convergence. What's missing are all those crazy things like m and l, which you would not normally know."},{"start":291.31,"text":"I mean, there would be isolated cases where I would know M and L, but mostly you would not. So then you get a complexity bound that looks like this, and what's amazing is that it's everything here you know. I mean, oh, one minor, we still have the embarrassment of P star here. We will talk about that. We'll see this. This will come up maybe next week in interior point methods. We'll take care of that."},{"start":317.06,"text":"You can still make fun of it that way, but it's fine. Because if I replace P star with any lower bound on P star, then I still get an upper bound on the number of steps. Yeah, so that's the idea. Okay. Yeah, and if you work this out, this is a sloppy analysis that, you know, leaving an idea, you get something like 375 times the difference. So..."}],"speech_gaps":[],"frame":"../frames/v015/002.webp","frame_time":194.61},{"title":"自协调函数的应用与实现","segments":[{"id":13,"text":"In fact, if you do a more careful analysis, you can get like 11. I think that's the one that Nesterov and Nemirovsky came up with. What's interesting is that that actually does kind of give you the behavior, right? This looks like it, I mean, maybe there's a better lower bound that has this slope. We could work out what that slope is. But ours is just like a straight, almost a straight line going up. And 11, yeah, 11 would be, it's still, it's only off by a factor of 10. Because it looks like if you take,"},{"id":14,"text":"You know, if you took C equals, I don't know, we could take a look at this, what that slope is, but maybe it's like two or something like that, that would probably be a pretty good estimate of it. Okay, so just to finish up the discussion of self-concordance, you..."},{"id":15,"text":"Mostly it's used by people to to a step to prove convergence of, for example, interior point methods, which will be our our next topic."},{"id":16,"text":"Right. So that's what it's usually used for. People have observed that formulations that involve self-concordant functions actually do work better in practice."},{"id":17,"text":"But I think no one would claim anything strong about that."},{"id":18,"text":"Like like and for sure, if you were implementing a method and something wasn't self-concordant and it worked well against, you know, carefully against a whole bunch of test problems and things like that."},{"id":19,"text":"no one would worry about it one bit. So, just to make sure that the whole story on"},{"id":20,"text":"consultant coordinates is clear. Okay, now we get to something much more important,"},{"id":21,"text":"which is actually the implementation, right? So, you know, basically it comes down to forming this"},{"id":22,"text":"Hessian here, and the gradient, and then solving this set of equations, which is linear algebra,"},{"id":23,"text":"algebra. In fact, you could even say, if someone says, what are you doing? You say, I'm minimizing"},{"id":24,"text":"a smooth function. How are you doing it? And you say, well, I'm solving a sequence of quadratic"},{"id":25,"text":"minimization problems. And they go, OK, and? And you go, ah, quadratic minimization, that's"},{"id":26,"text":"linear algebra. So we've reduced minimizing a smooth convex function to minimizing a sequence"},{"id":27,"text":"of, I don't know, some tens or whatever, of quadratic minimizations, each of which is"},{"id":28,"text":"actually just linear algebra, right? So, by the way, that means that you can import all"},{"id":29,"text":"the stuff you know about linear algebra with structure and banded and sparse and all that"},{"id":30,"text":"kind of stuff and it all just slots right in here."},{"id":31,"text":"If there's no structure of any kind, that's just going to be like n-cubed blobs for an unstructured system. If H were sparse or banded, it's actually going to be a lot faster to solve, if you know what you're doing. Actually, there's many mistakes people can make. One would be forming H and having it be dense."}],"notes":["本段主要讨论自协调函数的应用，特别是其在证明内点方法收敛性中的作用。Boyd提到，自协调函数在实践中表现更好，但没有人会声称其有很强的理论保证。","在实现方面，Boyd强调了形成Hessian矩阵和梯度，并求解线性方程组的重要性。他指出，最小化光滑凸函数可以归结为一系列二次最小化问题，而这些问题本质上是线性代数问题。","Boyd还提到，线性代数中的结构（如带状或稀疏矩阵）可以显著提高计算效率。如果Hessian矩阵是稠密的，这将是一个常见的错误。","他进一步指出，对于无结构的系统，计算复杂度会达到n³，而稀疏或带状矩阵可以显著减少计算时间。","Boyd强调了在实现过程中需要注意的常见错误，特别是形成稠密的Hessian矩阵的问题。","最后，他指出，将线性代数中的结构知识应用到优化问题中，可以显著提高计算效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":344.14,"end":519.97,"asr_flags":[],"raw_segments":[{"start":344.14,"text":"In fact, if you do a more careful analysis, you can get like 11. I think that's the one that Nesterov and Nemirovsky came up with. What's interesting is that that actually does kind of give you the behavior, right? This looks like it, I mean, maybe there's a better lower bound that has this slope. We could work out what that slope is. But ours is just like a straight, almost a straight line going up. And 11, yeah, 11 would be, it's still, it's only off by a factor of 10. Because it looks like if you take,"},{"start":373.89,"text":"You know, if you took C equals, I don't know, we could take a look at this, what that slope is, but maybe it's like two or something like that, that would probably be a pretty good estimate of it. Okay, so just to finish up the discussion of self-concordance, you..."},{"start":395.65,"text":"Mostly it's used by people to to a step to prove convergence of, for example, interior point methods, which will be our our next topic."},{"start":402.43,"text":"Right. So that's what it's usually used for. People have observed that formulations that involve self-concordant functions actually do work better in practice."},{"start":411.37,"text":"But I think no one would claim anything strong about that."},{"start":415.33,"text":"Like like and for sure, if you were implementing a method and something wasn't self-concordant and it worked well against, you know, carefully against a whole bunch of test problems and things like that."},{"start":424.83,"text":"no one would worry about it one bit. So, just to make sure that the whole story on"},{"start":433.83,"text":"consultant coordinates is clear. Okay, now we get to something much more important,"},{"start":438.77,"text":"which is actually the implementation, right? So, you know, basically it comes down to forming this"},{"start":446.47,"text":"Hessian here, and the gradient, and then solving this set of equations, which is linear algebra,"},{"start":451.01,"text":"algebra. In fact, you could even say, if someone says, what are you doing? You say, I'm minimizing"},{"start":456.91,"text":"a smooth function. How are you doing it? And you say, well, I'm solving a sequence of quadratic"},{"start":463.23,"text":"minimization problems. And they go, OK, and? And you go, ah, quadratic minimization, that's"},{"start":470.11,"text":"linear algebra. So we've reduced minimizing a smooth convex function to minimizing a sequence"},{"start":477.63,"text":"of, I don't know, some tens or whatever, of quadratic minimizations, each of which is"},{"start":484.39,"text":"actually just linear algebra, right? So, by the way, that means that you can import all"},{"start":488.39,"text":"the stuff you know about linear algebra with structure and banded and sparse and all that"},{"start":492.53,"text":"kind of stuff and it all just slots right in here."},{"start":497.23,"text":"If there's no structure of any kind, that's just going to be like n-cubed blobs for an unstructured system. If H were sparse or banded, it's actually going to be a lot faster to solve, if you know what you're doing. Actually, there's many mistakes people can make. One would be forming H and having it be dense."}],"speech_gaps":[],"frame":"../frames/v015/003.webp","frame_time":356.14},{"title":"Hessian结构与优化应用","segments":[{"id":32,"text":"Even if there's zeros all over it, I mean, you should kind of check that, but even if there's zeros all over it, it's not going to, some numerical method is not going to exploit that necessarily. Okay, so, all right. Let's see. What you're going to want to do is actually make a map in your head so you know what kind of applications involve a Hessian that has structure, right?"},{"id":33,"text":"Here's a very common one that occurs, is that a function here is going to be, it's separable, so it's a function, these are functions of one variable, right? These xi's are the components, right? So it's separable, so it's a separable function, plus a function of an affine function of your variables, right?"},{"id":34,"text":"So this is extremely common form that's going to come up. In fact, I guess we're going to see it in just a couple minutes in some applications, right? So here, if you work out what the Hessian of this is, the Hessian of a separable function is diagonal. I mean, in fact, that's kind of if and only if, right? If your Hessian is diagonal, then it's a sum, it's a separable function, right? Because it basically means cross derivatives are zero. Like partial xi, partial xj of f is zero."},{"id":35,"text":"And so that's going to tell you that it looks like this. Okay. Now, the Hessian of this, you can work it out, but it's actually this. It's A transpose. So here we're assuming A is wide. It is going to be A transpose, then H, which is the Hessian of this thing, H0, and then times A, right? So if you look at this long enough, you realize like, oh my God, that is diagonal plus low rank."},{"id":36,"text":"Right. And so once again, you know, once you're once your linear algebra structure center of your brain is all up to speed, that should be like that should be blinking saying you can solve this faster. OK. And that that's the right. Right. That's correct. Right. So if you just ignore that and form an N by N matrix, then call it Cholesky factorization, then each Newton step is going to cost you order N cubed. Right. So that that's going to be the naive implementation. Right."},{"id":37,"text":"But if you know that it's diagonal plus low rank, you can exploit that, and that might look something like this. First, you would do a Cholesky factorization. This is a p-cubed operation here. Then you would write out the Newton system as this. You'd actually literally introduce a new variable, w, right?"}],"notes":["本段讲解了Hessian矩阵的结构在优化问题中的重要性，特别是当Hessian具有特定结构（如对角线或低秩）时，可以显著提高计算效率。讲者指出，如果Hessian是对角线形式，那么函数是可分的，这意味着交叉导数为零，这在优化中是一个关键性质。","讲者提到，当Hessian是可分函数的Hessian时，它会是稀疏的，即对角线形式。这种结构在实际应用中非常常见，例如在处理具有多个变量的函数时，如果函数可以分解为各个变量的函数之和，那么Hessian矩阵将是对角线形式。","讲者进一步指出，当Hessian矩阵是低秩加上对角线形式时，可以利用这种结构来加速计算。例如，通过Cholesky分解，可以将计算复杂度从O(N³)降低到O(p³)，其中p是低秩部分的维度。","讲者强调，理解Hessian矩阵的结构对于优化问题的求解至关重要。如果忽略这种结构，直接使用标准的Cholesky分解方法，计算复杂度会很高，而利用结构信息可以显著提高效率。","讲者还提到，在处理具有低秩结构的Hessian矩阵时，可以引入新的变量w，从而将问题转化为更简单的形式，这有助于进一步优化计算过程。","本段内容强调了在优化问题中，Hessian矩阵的结构分析对于设计高效算法的重要性，特别是在处理大规模问题时，利用结构信息可以显著减少计算成本。"],"formulas":[{"latex":"H_{ij} = \\frac{\\text{d}^2 f}{\\text{d}x_i \\text{d}x_j} = 0 \\text{ for } i \\neq j","symbols":"Hessian 矩阵的非对角线元素为零，表示函数是可分的","explanation":"公式正确表达了可分函数的 Hessian 矩阵的性质，即非对角线元素为零。","evidence":"So this is extremely common form that's going to come up. In fact, I guess we're going to see it in just a couple minutes in some applications, right? So here, if you work out what the Hessian of this is, the Hessian of a separable function is diagonal. I mean, in fact, that's kind of if and only if, right? If your Hessian is diagonal, then it's a sum, it's a separable function, right? Because it basically means cross derivatives are zero. Like partial xi, partial xj of f is zero."}],"uncertainties":["可能的术语错误：'linear algebra structure center of your brain' 可能应为 'linear algebra structure in your brain'，但根据上下文，原意可能是强调线性代数结构的理解。","可能的术语错误：'that that's the right' 可能是重复或口误，但根据上下文，原意可能是 'that's the right way' 或 'that's correct'。"],"diagram":"none","start":521.49,"end":681.67,"asr_flags":[],"math_clarifications":["公式 H = A^T H_0 A 缺少对 A 和 H0 的具体定义，且未说明 A 是宽矩阵的假设，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":521.49,"text":"Even if there's zeros all over it, I mean, you should kind of check that, but even if there's zeros all over it, it's not going to, some numerical method is not going to exploit that necessarily. Okay, so, all right. Let's see. What you're going to want to do is actually make a map in your head so you know what kind of applications involve a Hessian that has structure, right?"},{"start":551.64,"text":"Here's a very common one that occurs, is that a function here is going to be, it's separable, so it's a function, these are functions of one variable, right? These xi's are the components, right? So it's separable, so it's a separable function, plus a function of an affine function of your variables, right?"},{"start":572.98,"text":"So this is extremely common form that's going to come up. In fact, I guess we're going to see it in just a couple minutes in some applications, right? So here, if you work out what the Hessian of this is, the Hessian of a separable function is diagonal. I mean, in fact, that's kind of if and only if, right? If your Hessian is diagonal, then it's a sum, it's a separable function, right? Because it basically means cross derivatives are zero. Like partial xi, partial xj of f is zero."},{"start":602.88,"text":"And so that's going to tell you that it looks like this. Okay. Now, the Hessian of this, you can work it out, but it's actually this. It's A transpose. So here we're assuming A is wide. It is going to be A transpose, then H, which is the Hessian of this thing, H0, and then times A, right? So if you look at this long enough, you realize like, oh my God, that is diagonal plus low rank."},{"start":631.74,"text":"Right. And so once again, you know, once you're once your linear algebra structure center of your brain is all up to speed, that should be like that should be blinking saying you can solve this faster. OK. And that that's the right. Right. That's correct. Right. So if you just ignore that and form an N by N matrix, then call it Cholesky factorization, then each Newton step is going to cost you order N cubed. Right. So that that's going to be the naive implementation. Right."},{"start":662.49,"text":"But if you know that it's diagonal plus low rank, you can exploit that, and that might look something like this. First, you would do a Cholesky factorization. This is a p-cubed operation here. Then you would write out the Newton system as this. You'd actually literally introduce a new variable, w, right?"}],"speech_gaps":[],"frame":"../frames/v015/004.webp","frame_time":533.49},{"title":"稀疏性和带状Hessian矩阵的计算优势","segments":[{"id":38,"text":"Then you eliminate delta x from it, and you'd end up with this, and you'd recognize these things as sure complements of various things. And then, you know, you can work out what everything happens here. I'm not going to go into the details of this, but it turns out actually just forming this matrix here is the dominant factor, and that's 2p squared n. This is to be compared to n cubed, right? So if p is like 1 100th of n,"},{"id":39,"text":"then you just saved yourself 10,000x. Everybody following this? Right? So, anyway, so this is the kind of thing you're, so when you see things like this, and, you know, I could, we could do things like this. What would, what does the Hessian, what does it mean for the Hessian to be banded? How about that? They're just in words. Like, what does that mean? Any suggestion? It just means that..."},{"id":40,"text":"that there are no, I'm going to call, when I take a function, I go partial squared f, partial xi, partial xj. If that's not zero, I'm going to call it an interaction between i and j, right? So what this says is interactions are local. It says that those are zero unless i minus j is really small, like less than half the bandwidth. So that's what it means, right? It does a lot of applications, right? That would be things like control, signal processing. I could go on and on."},{"id":41,"text":"I mean, these are entire fields would have that structure. And, by the way, if the Hessian is banded, how fast can I compute a Newton step in n if it's banded? It's just order n, right? Because the factorization is going to be..."},{"id":42,"text":"you know, well, it's going to actually look exactly like this here. It's going to be this thing, right? So what that says is, I don't know, I mean, just for fun, if I had to solve an optimal control problem with, I don't know, a couple thousand steps by Newton's method, someone would want to make a quick guess as to how long that might take. Well, let's say the state dimension is 10, and I don't know, there's like five inputs. It doesn't matter. It's some optimal control problem."},{"id":43,"text":"Yeah. So I, if you just wrote it out, it might take a second or two, but if you knew what you were doing, it would be sub millisecond. Okay. So, and this is actually how a lot of things work. So, okay. So this is the key to everything. These are super important things to know. You know, you just, you just have to know these period. Right. So, okay. Yeah."}],"notes":["本段主要讲解了稀疏性在优化问题中的重要性，特别是当问题规模较大时，稀疏性可以显著减少计算量。例如，当参数p是n的1/100时，计算复杂度从n³降低到2p²n，从而节省了10,000倍的计算时间。这说明了在实际应用中，稀疏性可以带来巨大的计算优势。","接着，讲者引入了带状Hessian矩阵的概念，并解释了其含义。带状Hessian矩阵意味着函数的二阶导数（即交互项）仅在变量i和j之间距离较小时非零，这表明交互项是局部的。这种结构在控制和信号处理等领域有广泛应用。","讲者进一步讨论了带状Hessian矩阵对计算效率的影响。由于带状矩阵的特殊结构，计算牛顿步的复杂度可以降低到O(n)，这比一般情况下的O(n³)要高效得多。这种高效性在解决大规模优化问题时尤为重要。","最后，讲者通过一个最优控制问题的例子，说明了带状Hessian矩阵在实际应用中的价值。即使问题规模较大，如包含数千个步骤，利用带状结构的优化方法可以在毫秒级别内完成计算，这展示了带状结构在实际工程中的重要性。","讲者强调了这些概念在凸优化中的核心地位，指出了解这些概念对于理解和应用凸优化方法至关重要。这些知识不仅适用于理论分析，也广泛应用于实际工程问题中。","通过这些讲解，讲者帮助学生理解了稀疏性和带状结构在优化问题中的重要性，并展示了它们如何在实际计算中带来显著的效率提升。"],"formulas":[],"uncertainties":[],"diagram":"none","start":682.47,"end":853.28,"asr_flags":[],"math_clarifications":["原始文本中提到的'2p squared n'和'O(n)'没有明确的数学表达式或上下文支持，无法确定其数学含义或正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":682.47,"text":"Then you eliminate delta x from it, and you'd end up with this, and you'd recognize these things as sure complements of various things. And then, you know, you can work out what everything happens here. I'm not going to go into the details of this, but it turns out actually just forming this matrix here is the dominant factor, and that's 2p squared n. This is to be compared to n cubed, right? So if p is like 1 100th of n,"},{"start":709.43,"text":"then you just saved yourself 10,000x. Everybody following this? Right? So, anyway, so this is the kind of thing you're, so when you see things like this, and, you know, I could, we could do things like this. What would, what does the Hessian, what does it mean for the Hessian to be banded? How about that? They're just in words. Like, what does that mean? Any suggestion? It just means that..."},{"start":742.42,"text":"that there are no, I'm going to call, when I take a function, I go partial squared f, partial xi, partial xj. If that's not zero, I'm going to call it an interaction between i and j, right? So what this says is interactions are local. It says that those are zero unless i minus j is really small, like less than half the bandwidth. So that's what it means, right? It does a lot of applications, right? That would be things like control, signal processing. I could go on and on."},{"start":771.2,"text":"I mean, these are entire fields would have that structure. And, by the way, if the Hessian is banded, how fast can I compute a Newton step in n if it's banded? It's just order n, right? Because the factorization is going to be..."},{"start":798.09,"text":"you know, well, it's going to actually look exactly like this here. It's going to be this thing, right? So what that says is, I don't know, I mean, just for fun, if I had to solve an optimal control problem with, I don't know, a couple thousand steps by Newton's method, someone would want to make a quick guess as to how long that might take. Well, let's say the state dimension is 10, and I don't know, there's like five inputs. It doesn't matter. It's some optimal control problem."},{"start":828.42,"text":"Yeah. So I, if you just wrote it out, it might take a second or two, but if you knew what you were doing, it would be sub millisecond. Okay. So, and this is actually how a lot of things work. So, okay. So this is the key to everything. These are super important things to know. You know, you just, you just have to know these period. Right. So, okay. Yeah."}],"speech_gaps":[],"frame":"../frames/v015/005.webp","frame_time":694.47},{"title":"KKT条件与二次优化问题","segments":[{"id":44,"text":"What happened when you introduced the W here? Or what was the motivation for that? Oh, this is simply just doing it by, I mean, you could go back and we can call it all sorts of things. W is unelimination, if you like. Right? Yeah, that's one way. Or this is actually just doing, this is exploiting, you know, diagonal plus low rank or whatever. Once you expand it, that's what happens. Yeah. So that's all this is. Okay."},{"id":45,"text":"Okay, so next up, and this is material that you will need to do this homework thing. Actually, we're probably not going to be, I'll say a few things about it, but you actually are definitely going to have to read the book carefully. It's just a couple of pages to get the details of this method. Okay, so let's look at a quality constraint minimization. So basic problem is we have a smooth, you know, twice continuously differentiable convex function here."},{"id":46,"text":"And we're going to minimize here F subject to AX equals B. And, you know, this basically says these optimality conditions are necessary and sufficient, right? It says that when, you know, when the gradient is in the range of A transpose and you're primal feasible, then that's optimal. And that's if and only if, right? So there's no, there's nothing else here. It's just that no qualifications or anything like that. It's assuming F is..."},{"id":47,"text":"convex, right? Okay. Okay. So here's a classic example is quadratic. So here's an equality constrained quadratic minimization problem. Looks like this, right? And the optimality condition now, the Hessian is just p. The gradient is going to be px plus q or something like that. That's the gradient. And then the optimality condition, you can write out this way."},{"id":48,"text":"Okay? So that's what it is, right? This is, you know, the... Yeah, anyway, these are the optimality conditions. These are literally these two equations here. Here. The difference is this equation... These are linear, actually, right? That's a set of linear equations. That's linear. And if f is quadratic, its gradient is an affine function. And so the KKT conditions become a set of linear equations. And once again, it's just linear algebra. So that's right, which..."},{"id":49,"text":"Good. Okay. So when you set it up, it looks like this. This is a very famous matrix. It's actually called the KKT matrix. And it comes up in pretty much every field I can imagine. It's in mechanics. Certainly it's in electrical engineering. It's in lots and lots and lots of fields. Okay. So let's see. Oh, you can work out. This thing is going to be..."}],"notes":["本段讨论了引入W矩阵的动机，指出W矩阵可以被视为一种未消除的变量，或者可以被解释为对角线加上低秩结构的利用。这表明在优化问题中，矩阵的结构可能对问题的求解方式产生影响。","接下来的段落强调了KKT条件在优化问题中的重要性，特别是当目标函数是凸函数且存在等式约束时，KKT条件是必要且充分的。这表明在满足一定条件时，KKT条件可以用来判断最优解。","在二次优化问题中，KKT条件转化为一组线性方程，这使得问题可以通过线性代数的方法求解。这表明当目标函数是二次函数时，KKT条件的结构会简化，从而更容易求解。","KKT矩阵是一个非常重要的矩阵，它在多个领域中都有应用，如力学和电气工程。这表明KKT矩阵的结构和性质在不同学科中具有普遍性。","在讨论KKT矩阵时，讲者提到它在各种领域中都会出现，这表明KKT矩阵的结构和应用范围非常广泛，是优化问题中的一个核心概念。","讲者提到KKT矩阵的结构可以通过推导得出，这表明KKT矩阵的构造和性质是可以通过数学推导来理解的，而不是凭空猜测。"],"formulas":[],"uncertainties":[],"diagram":"none","start":854.79,"end":1030.98,"asr_flags":[],"math_clarifications":["所有公式均未提供完整的数学表达形式，缺少必要的上下文和符号定义，无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":854.79,"text":"What happened when you introduced the W here? Or what was the motivation for that? Oh, this is simply just doing it by, I mean, you could go back and we can call it all sorts of things. W is unelimination, if you like. Right? Yeah, that's one way. Or this is actually just doing, this is exploiting, you know, diagonal plus low rank or whatever. Once you expand it, that's what happens. Yeah. So that's all this is. Okay."},{"start":885.17,"text":"Okay, so next up, and this is material that you will need to do this homework thing. Actually, we're probably not going to be, I'll say a few things about it, but you actually are definitely going to have to read the book carefully. It's just a couple of pages to get the details of this method. Okay, so let's look at a quality constraint minimization. So basic problem is we have a smooth, you know, twice continuously differentiable convex function here."},{"start":913.64,"text":"And we're going to minimize here F subject to AX equals B. And, you know, this basically says these optimality conditions are necessary and sufficient, right? It says that when, you know, when the gradient is in the range of A transpose and you're primal feasible, then that's optimal. And that's if and only if, right? So there's no, there's nothing else here. It's just that no qualifications or anything like that. It's assuming F is..."},{"start":942.51,"text":"convex, right? Okay. Okay. So here's a classic example is quadratic. So here's an equality constrained quadratic minimization problem. Looks like this, right? And the optimality condition now, the Hessian is just p. The gradient is going to be px plus q or something like that. That's the gradient. And then the optimality condition, you can write out this way."},{"start":972.2,"text":"Okay? So that's what it is, right? This is, you know, the... Yeah, anyway, these are the optimality conditions. These are literally these two equations here. Here. The difference is this equation... These are linear, actually, right? That's a set of linear equations. That's linear. And if f is quadratic, its gradient is an affine function. And so the KKT conditions become a set of linear equations. And once again, it's just linear algebra. So that's right, which..."},{"start":1002.63,"text":"Good. Okay. So when you set it up, it looks like this. This is a very famous matrix. It's actually called the KKT matrix. And it comes up in pretty much every field I can imagine. It's in mechanics. Certainly it's in electrical engineering. It's in lots and lots and lots of fields. Okay. So let's see. Oh, you can work out. This thing is going to be..."}],"speech_gaps":[],"frame":"../frames/v015/006.webp","frame_time":866.79},{"title":"KKT矩阵的可逆性与约束消除","segments":[{"id":50,"text":"non-singular, it is certainly not positive definite. In fact, it's what people call quasi-semi-definite. So this KKT matrix here is invertible if and only if, roughly speaking, there's nothing, the null space of A does not intersect the null space of P. So if there's a common vector that both satisfies AX equals zero and PX equals zero,"},{"id":51,"text":"then this thing is singular, right? So that's, and that's if and only if. Okay. And there's many, many, many ways to express that. And you probably don't even have to worry about that too much, right? But that's what that is. Okay."},{"id":52,"text":"So, by the way, to evaluate this, to solve that, we'll see that there's a lot of options you could use. One is you could use an LDL transpose factorization. That's a Cholesky factorization, but with different signs. And when you do that, that's one perfectly good way. And there's others we will be able to talk about later. Okay. So the first thing, I don't know if you remember, but basically like in week two, we..."},{"id":53,"text":"I pointed out, you could actually eliminate equality constraints. You just don't need them, right? I mean, they don't actually bring any, like we can just get rid of them arbitrarily, pull them back. It doesn't make any difference. And the way you do that is if you have an equality constraint AX equals B, then you parameterize it as the image of an affine function, right? And that requires you to find a particular solution, say X hat. And then you find a matrix F whose range is the null space."},{"id":54,"text":"of A, right? So that's actually all you need. And there's very simple ways to do that. You could do a QR factorization on A transpose or something. This is just linear algebra at that point. Okay, and that's the idea. Then what you do, it says that this is a parameter, this is a, you'd call this a free parameter parameterization of this set, which is affine set, which is described by constraints."},{"id":55,"text":"Right, so that's how you describe that. Okay, then you just solve this problem, right? Because everything that satisfies AX equals B has exactly this form. And now this thing is just, that's an unconstrained problem with some variable Z. I could do all sorts of things. I could actually, oh, once I know, by the way, Z star, I can reconstruct X star and even new star as well, right?"}],"notes":["本段主要讲解KKT矩阵的可逆性条件，指出当矩阵A的零空间与矩阵P的零空间有交集时，KKT矩阵是奇异的。这表明约束条件之间存在某种依赖关系，导致矩阵不可逆。此外，还提到可以通过LDL转置分解等方法来求解KKT矩阵，这属于数值线性代数中的方法。","讲者提到可以通过消除等式约束来简化问题，具体方法是将等式约束参数化为仿射函数的像。这需要找到一个特解和一个矩阵，其列空间为A的零空间。这种方法属于线性代数中的基本操作，通过参数化将约束问题转化为无约束问题。","讲者进一步说明，参数化后的变量Z可以用于求解问题，而一旦找到Z的最优解Z星，就可以通过它重构原始变量X星。这表明参数化方法不仅简化了问题，还保留了原始变量的信息。","讲者强调，消除等式约束并不影响问题的解，因为所有满足等式约束的解都可以表示为参数化形式。这说明参数化方法在保持问题等价性的同时，提供了更灵活的求解方式。","讲者提到，参数化后的变量Z可以用于求解问题，而一旦找到Z的最优解Z星，就可以通过它重构原始变量X星。这表明参数化方法不仅简化了问题，还保留了原始变量的信息。","讲者最后指出，参数化方法是处理约束优化问题的一种有效手段，通过将约束条件转化为参数化形式，可以将问题转化为无约束问题，从而利用各种优化算法进行求解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1031.46,"end":1194.83,"asr_flags":[],"raw_segments":[{"start":1031.46,"text":"non-singular, it is certainly not positive definite. In fact, it's what people call quasi-semi-definite. So this KKT matrix here is invertible if and only if, roughly speaking, there's nothing, the null space of A does not intersect the null space of P. So if there's a common vector that both satisfies AX equals zero and PX equals zero,"},{"start":1059.38,"text":"then this thing is singular, right? So that's, and that's if and only if. Okay. And there's many, many, many ways to express that. And you probably don't even have to worry about that too much, right? But that's what that is. Okay."},{"start":1079.76,"text":"So, by the way, to evaluate this, to solve that, we'll see that there's a lot of options you could use. One is you could use an LDL transpose factorization. That's a Cholesky factorization, but with different signs. And when you do that, that's one perfectly good way. And there's others we will be able to talk about later. Okay. So the first thing, I don't know if you remember, but basically like in week two, we..."},{"start":1110.12,"text":"I pointed out, you could actually eliminate equality constraints. You just don't need them, right? I mean, they don't actually bring any, like we can just get rid of them arbitrarily, pull them back. It doesn't make any difference. And the way you do that is if you have an equality constraint AX equals B, then you parameterize it as the image of an affine function, right? And that requires you to find a particular solution, say X hat. And then you find a matrix F whose range is the null space."},{"start":1140.03,"text":"of A, right? So that's actually all you need. And there's very simple ways to do that. You could do a QR factorization on A transpose or something. This is just linear algebra at that point. Okay, and that's the idea. Then what you do, it says that this is a parameter, this is a, you'd call this a free parameter parameterization of this set, which is affine set, which is described by constraints."},{"start":1168.22,"text":"Right, so that's how you describe that. Okay, then you just solve this problem, right? Because everything that satisfies AX equals B has exactly this form. And now this thing is just, that's an unconstrained problem with some variable Z. I could do all sorts of things. I could actually, oh, once I know, by the way, Z star, I can reconstruct X star and even new star as well, right?"}],"speech_gaps":[],"frame":"../frames/v015/007.webp","frame_time":1043.46},{"title":"凸优化中的资源分配问题与Hessian矩阵分析","segments":[{"id":56,"text":"by these methods, right? Okay, so that's an equivalent problem. And this just works by Newton's method, right? So we just use Newton's method to solve that. And I'll just give you a quick example. Here's a famous problem. It's resource allocation, right? So x1 up to xn are a bunch of resources that I am going to... Those are the resources allocated to agents 1 through n."},{"id":57,"text":"That's what the XIs are. B is my total budget. That's how much of my resource I'm going to allocate across here. You can make the Xs non-negative. It wouldn't make any difference. And then I have a cost function for each of my agents. Like F1 of X1 is the cost if I allocate X1 to agent 1. So that's how that works. So this is sort of the total cost. And you have this equality constraint."},{"id":58,"text":"One way to eliminate it, I mean this is easy, is what you do is you leave x1 through xn minus 1 alone, right? They're going to be, we just keep them. But we write xn as b minus them, we just remove this. Then you put a function that looks like this. So here my z's are really just x1 through xn minus 1. When I multiply by f,"},{"id":59,"text":"I mean, you can check that this thing is a basis. I mean, by construction, this works, right? You can check that the range of this matrix is exactly the null space of this matrix. That matrix is just a ones vector transposed, right? So that's what that is in AX equals B. Okay, so then you end up with this reduced problem. There you go. Oh, any comments about that function? Anything you like about it?"},{"id":60,"text":"Can we all visualize its Hessian, please? What is the Hessian of this function? What is it? It's what? You know, it's not arrow. It's very close. If you were to do one elimination, it would be arrow. But it's very close to arrow. It's not arrow. This is dense. It's completely dense. But what is it? What's the Hessian of this part? Diagonal. Okay. How about the Hessian of this? What is it? It's rank one."},{"id":61,"text":"You can just check. It's going to be, actually it's literally the matrix of ones. It's actually ones, ones, transpose times a number. That's what it is. I realize you're just seeing this all now, but this is the important thing. This is what you need to do. To actually be able to recognize these things in the wild. You're going to want to be able to see things like this. This is diagonal plus rank one. When you see this,"}],"notes":["本段讲解了资源分配问题的建模方法，其中x1到xn代表分配给不同代理的资源，B是总预算。通过将xn表示为总预算减去其他资源，可以消除约束条件，从而简化问题。"],"formulas":[],"uncertainties":["Hessian矩阵的具体形式可能因问题而异，但本段强调其为对角矩阵加上秩一矩阵"],"diagram":"none","start":1195.25,"end":1362.86,"asr_flags":[],"math_clarifications":["公式中的求和符号使用了正确的LaTeX格式，且变量定义清晰。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1195.25,"text":"by these methods, right? Okay, so that's an equivalent problem. And this just works by Newton's method, right? So we just use Newton's method to solve that. And I'll just give you a quick example. Here's a famous problem. It's resource allocation, right? So x1 up to xn are a bunch of resources that I am going to... Those are the resources allocated to agents 1 through n."},{"start":1225.63,"text":"That's what the XIs are. B is my total budget. That's how much of my resource I'm going to allocate across here. You can make the Xs non-negative. It wouldn't make any difference. And then I have a cost function for each of my agents. Like F1 of X1 is the cost if I allocate X1 to agent 1. So that's how that works. So this is sort of the total cost. And you have this equality constraint."},{"start":1250.33,"text":"One way to eliminate it, I mean this is easy, is what you do is you leave x1 through xn minus 1 alone, right? They're going to be, we just keep them. But we write xn as b minus them, we just remove this. Then you put a function that looks like this. So here my z's are really just x1 through xn minus 1. When I multiply by f,"},{"start":1273.05,"text":"I mean, you can check that this thing is a basis. I mean, by construction, this works, right? You can check that the range of this matrix is exactly the null space of this matrix. That matrix is just a ones vector transposed, right? So that's what that is in AX equals B. Okay, so then you end up with this reduced problem. There you go. Oh, any comments about that function? Anything you like about it?"},{"start":1301.74,"text":"Can we all visualize its Hessian, please? What is the Hessian of this function? What is it? It's what? You know, it's not arrow. It's very close. If you were to do one elimination, it would be arrow. But it's very close to arrow. It's not arrow. This is dense. It's completely dense. But what is it? What's the Hessian of this part? Diagonal. Okay. How about the Hessian of this? What is it? It's rank one."},{"start":1335.24,"text":"You can just check. It's going to be, actually it's literally the matrix of ones. It's actually ones, ones, transpose times a number. That's what it is. I realize you're just seeing this all now, but this is the important thing. This is what you need to do. To actually be able to recognize these things in the wild. You're going to want to be able to see things like this. This is diagonal plus rank one. When you see this,"}],"speech_gaps":[],"frame":"../frames/v015/008.webp","frame_time":1207.25},{"title":"牛顿步与KKT系统","segments":[{"id":62,"text":"You should be able to look at that and say to someone, I can solve that in linear time. And they would say, wow, how do you do that? I thought Newton, I'm using like, you know, SGD because it's too big or I don't blah, blah, blah. And you're like, no, no, they go, but I have a million variables. And you're like, too bad, I can do it on my phone. Okay, everyone following this? So these are extremely good things to know about, right? So, because..."},{"id":63,"text":"I don't know, every day there's people who don't know these things making the wrong conclusion, arriving somewhere and saying, oh, I tried like NumPy and it was too slow or something. Yes? Sorry, what is the point of the f matrix? Because I don't see it in the refuse problem. Oh, it is here. What I've written here, this is actually, this is literally, you know, it's the original f of then capital F z plus x hat."},{"id":64,"text":"So, I'm just writing it out in its more natural form. But that's exactly what it is, right? In fact, you can sort of see that, right? Here, with this one. The f has an i stacked on top of a minus ones. Here's the minus ones. And here's, like, the i. That's an n by 1 by n minus 1 i. n minus 1 by n minus 1, yeah. Okay, okay, cool. This is, okay. So, the Newton step."},{"id":65,"text":"You can also directly get, you can actually directly get the Newton step from the KKT system, not by doing this reduction, right? And so to do that, you form this system. And this is just literally, this is the definition of the Newton step. And it's lots of cool interpretations of it. One is this, you'd say, well, I want to minimize this smooth function subject to AX equals B. And someone says, cool."},{"id":66,"text":"Please take your function f and make a second order Taylor expa g to have to be approximated. So we'll approximate this by its first order expansion of the gradient."}],"speech_gaps":[],"frame":"../frames/v015/009.webp","frame_time":1375.3},{"title":"牛顿法与可行性下降方法","segments":[{"id":68,"text":"which is, of course, related to the second-order expansion of the function, and we get something like this, right? So you can say that the Newton step is something like this. It's a delta x and a w, for which, if you were to take that step, and if your original function was quadratic, that would actually just be the optimal solution, right? That would just be the solution. Everybody?"},{"id":69,"text":"Got this? So this is the Newton step. Okay. The Newton decrement, we saw this before in the unconstrained case, right? And it turns out you can write it lots of different ways, but it is the norm of the Newton step in the metric given by the Hessian. But maybe a better way is this. It basically says it's the one half lambda squared."},{"id":70,"text":"is actually the predicted decrease in f if you took the Newton step and if the function were quadratic, so that it was exact. So it's actually, as a practical matter, a very good approximation of how far from suboptimal you are."},{"id":71,"text":"And now we get Newton's method. So here it is. You start with something that's feasible. So AX equals B and X is in the domain. And you compute the Newton step and decrement. You stop. Otherwise, you do a line search by backtracking and then you update. Actually, you might ask, how is this algorithm different from Newton's method without equality constraints? Reasonable question. The answer is, it's not. They're identical. It's just the same."},{"id":72,"text":"What's different is, for example, when you compute the Newton step, if you have equality constraints, you're actually solving that KKT system, not just with the Hessian. But it's just exactly the same, right? So that's the idea. And this is a so-called feasible descent method. What happens is XK, of course, X0 is feasible because you have to start it with AX, something that satisfies AX equals B, and it's in the domain. You're always in the domain, always have AX equals B."},{"id":73,"text":"And in fact, not only that, but the function value goes down. And this algorithm is affine invariant. So if you change coordinates or rescale the variables, at least to first, it doesn't make any difference at all. You get exactly the same number of iterates, the same iterates. Okay, so that's Newton's method. What's cool is that we don't need any more, we don't need no more analysis of it. And the reason is this. It turns out..."}],"notes":["本段讲解了牛顿法中的牛顿减量（Newton decrement）概念，它表示在二次函数情况下，牛顿步所预测的函数值下降量。牛顿减量可以表示为牛顿步在Hessian矩阵定义的度量下的范数，或者更简洁地表示为半lambda平方。这为判断当前点与最优解的距离提供了实用的近似值。","接下来，课程介绍了牛顿法的实现过程，强调了在有等式约束的情况下，牛顿步需要求解KKT系统，而不是仅仅使用Hessian矩阵。尽管如此，有约束和无约束的牛顿法在本质上是相同的，只是在计算过程中需要考虑约束条件。","课程进一步指出，牛顿法是一种可行下降方法（feasible descent method），即在每次迭代中保持可行性，即满足约束条件AX = B且在可行域内。初始点必须是可行的，且在后续迭代中始终保持可行性。","此外，课程提到牛顿法具有仿射不变性（affine invariance），即在坐标变换或变量缩放后，迭代次数和迭代点保持不变。这表明牛顿法在不同坐标系下具有良好的鲁棒性。","最后，课程指出，牛顿法不需要进一步的分析，因为其收敛性和性质已经被充分研究，无需额外的理论支持。这为后续的优化算法分析奠定了基础。","课程通过牛顿法的实现细节，强调了在有约束优化问题中，如何将牛顿法与KKT条件结合，以及如何保持算法的可行性与收敛性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1534.86,"end":1698.42,"asr_flags":[],"math_clarifications":["原始文本中未明确提及任何具体的数学公式，因此无法核对或修正任何公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1534.86,"text":"which is, of course, related to the second-order expansion of the function, and we get something like this, right? So you can say that the Newton step is something like this. It's a delta x and a w, for which, if you were to take that step, and if your original function was quadratic, that would actually just be the optimal solution, right? That would just be the solution. Everybody?"},{"start":1562.08,"text":"Got this? So this is the Newton step. Okay. The Newton decrement, we saw this before in the unconstrained case, right? And it turns out you can write it lots of different ways, but it is the norm of the Newton step in the metric given by the Hessian. But maybe a better way is this. It basically says it's the one half lambda squared."},{"start":1591.05,"text":"is actually the predicted decrease in f if you took the Newton step and if the function were quadratic, so that it was exact. So it's actually, as a practical matter, a very good approximation of how far from suboptimal you are. Okay, so this is the Newton decrement."},{"start":1613.1,"text":"And now we get Newton's method. So here it is. You start with something that's feasible. So AX equals B and X is in the domain. And you compute the Newton step and decrement. You stop. Otherwise, you do a line search by backtracking and then you update. Actually, you might ask, how is this algorithm different from Newton's method without equality constraints? Reasonable question. The answer is, it's not. They're identical. It's just the same."},{"start":1641.86,"text":"What's different is, for example, when you compute the Newton step, if you have equality constraints, you're actually solving that KKT system, not just with the Hessian. But it's just exactly the same, right? So that's the idea. And this is a so-called feasible descent method. What happens is XK, of course, X0 is feasible because you have to start it with AX, something that satisfies AX equals B, and it's in the domain. You're always in the domain, always have AX equals B."},{"start":1672.26,"text":"And in fact, not only that, but the function value goes down. And this algorithm is affine invariant. So if you change coordinates or rescale the variables, at least to first, it doesn't make any difference at all. You get exactly the same number of iterates, the same iterates. Okay, so that's Newton's method. What's cool is that we don't need any more, we don't need no more analysis of it. And the reason is this. It turns out..."}],"speech_gaps":[],"frame":"../frames/v015/010.webp","frame_time":1546.86},{"title":"牛顿法与约束消除的等价性","segments":[{"id":74,"text":"If you apply Newton's method to this, where you eliminate the equality constraints like this, if you work out what it is, it turns out it is identical to just running Newton's method, right? So it's actually just exactly the same thing, right?"},{"id":75,"text":"Everything is the same. The iterates are identical, the primal iterates, the dual iterates. The stopping, the lambda is the same. So it basically, that means we need, we can actually pull in the proof of convergence from whatever, last lecture, right? So that's all we need. Okay, so we don't ever have to, we're not going to talk about, like, does it converge and all that kind of stuff. The answer is yeah, it does."},{"id":76,"text":"And we'll see, then you'd say, well, what would be the difference between these two, right? And this gets you into the usual thing, right? If you, in this case, you say, well, I'm eliminating, and so I'm solving, let's say you have 1,000 variables and 100 constraints, right? Then you'd say, someone would say, what are you doing? You'd say, well, I'm solving, I've eliminated the equality constraint, so I'm solving a problem with 900 variables. Everybody following this?"},{"id":77,"text":"And you'd say, well, what are you doing? And you go, yeah, I'm solving a problem with 1,100 variables. Everybody got this, right? So that's if you solve the KKT system, right? Because it's a 1,000 by 1,000 block stacked on top of a 100 by 1,000 A matrix, okay? So someone else would look at them and say, but wait a minute. Last time I checked, 1,100 cubed is bigger than 900 cubed."},{"id":78,"text":"And you'd say, it is, you're right. But what we'll find is actually that it's almost always better to solve the bigger system, right? So this is the other thing. If someone comes up to you, I mean, the matrices have no structure at all. Obviously, you'd prefer to solve a smaller system of equations. But when there's structure, this is generally speaking completely false, right? So, and it's not intuitive. So, okay."},{"id":79,"text":"Okay. Aha. So now we're getting to something which is related to something you'll do in your homework, is the so-called infeasible start Newton method, right? And what it does is it's actually a simple extension. Before, we assumed that x was feasible, and so ax minus b was zero, right? Then this just says, well, suppose you're not zero. What is the Newton step, right?"}],"notes":["本段讨论了牛顿法在处理带有等式约束的优化问题时，通过消除约束条件后与直接应用牛顿法的等价性。讲者指出，当消除约束后，虽然变量数量减少，但实际求解的系统规模可能更大，这取决于问题的结构。","讲者通过一个具体的例子说明，当有1000个变量和100个约束时，消除约束后的问题变量数为900，但若考虑KKT系统，则变量数为1100。这表明，虽然变量数减少，但实际求解的系统规模可能更大。","讲者进一步指出，当矩阵没有结构时，求解较小的系统更优，但当存在结构时，求解更大的系统可能更有效。这与直觉相反，因此需要特别注意。","讲者提到，这种现象与后续作业中涉及的“不可行起点牛顿法”相关，该方法允许初始点不满足约束条件，从而扩展了牛顿法的应用范围。","在不可行起点牛顿法中，假设初始点不满足约束条件，即ax - b ≠ 0，此时需要计算牛顿步，以逐步逼近可行解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1698.66,"end":1857.78,"asr_flags":[],"raw_segments":[{"start":1698.66,"text":"If you apply Newton's method to this, where you eliminate the equality constraints like this, if you work out what it is, it turns out it is identical to just running Newton's method, right? So it's actually just exactly the same thing, right?"},{"start":1718.87,"text":"Everything is the same. The iterates are identical, the primal iterates, the dual iterates. The stopping, the lambda is the same. So it basically, that means we need, we can actually pull in the proof of convergence from whatever, last lecture, right? So that's all we need. Okay, so we don't ever have to, we're not going to talk about, like, does it converge and all that kind of stuff. The answer is yeah, it does."},{"start":1744.51,"text":"And we'll see, then you'd say, well, what would be the difference between these two, right? And this gets you into the usual thing, right? If you, in this case, you say, well, I'm eliminating, and so I'm solving, let's say you have 1,000 variables and 100 constraints, right? Then you'd say, someone would say, what are you doing? You'd say, well, I'm solving, I've eliminated the equality constraint, so I'm solving a problem with 900 variables. Everybody following this?"},{"start":1770.16,"text":"And you'd say, well, what are you doing? And you go, yeah, I'm solving a problem with 1,100 variables. Everybody got this, right? So that's if you solve the KKT system, right? Because it's a 1,000 by 1,000 block stacked on top of a 100 by 1,000 A matrix, okay? So someone else would look at them and say, but wait a minute. Last time I checked, 1,100 cubed is bigger than 900 cubed."},{"start":1798.5,"text":"And you'd say, it is, you're right. But what we'll find is actually that it's almost always better to solve the bigger system, right? So this is the other thing. If someone comes up to you, I mean, the matrices have no structure at all. Obviously, you'd prefer to solve a smaller system of equations. But when there's structure, this is generally speaking completely false, right? So, and it's not intuitive. So, okay."},{"start":1828.15,"text":"Okay. Aha. So now we're getting to something which is related to something you'll do in your homework, is the so-called infeasible start Newton method, right? And what it does is it's actually a simple extension. Before, we assumed that x was feasible, and so ax minus b was zero, right? Then this just says, well, suppose you're not zero. What is the Newton step, right?"}],"speech_gaps":[],"frame":"../frames/v015/011.webp","frame_time":1710.66},{"title":"不可行起点牛顿法","segments":[{"id":80,"text":"And it's defined by this here. And you can write out all sorts of cool things about it, right? It's linearizing the, if you write the residual as, well, two things here, we can have the, if you write out this thing, if you have AX equals, if AX equals B and this residual should be about zero, you get these things. And the solution of this is called the infeasible Newton step."},{"id":81,"text":"Right. And so this is this is b u, right? So, in fact, people call z the primal dual variable because it's basically top of it is the primal variable and the bottom is the dual variable, right? So, okay. So, and I think, let's see. So, here's the infeasible start Newton method. You will implement this, so I would strongly recommend listening. You also want to look at the book and stuff like that to read a couple pages about this. So,"}],"notes":["本段讲解了不可行起点牛顿法的基本概念，指出该方法在实际应用中占90%到95%。该方法通过将残差线性化来求解问题，被称为不可行牛顿步。"],"formulas":[],"uncertainties":["domain event"],"diagram":"none","start":1858.17,"end":2036.16,"asr_flags":[93],"raw_segments":[{"start":1858.17,"text":"And it's defined by this here. And you can write out all sorts of cool things about it, right? It's linearizing the, if you write the residual as, well, two things here, we can have the, if you write out this thing, if you have AX equals, if AX equals B and this residual should be about zero, you get these things. And the solution of this is called the infeasible Newton step."},{"start":1886.4,"text":"Right. And so this is this is basically 90, 95 percent of what people actually use. Right. So or actually, since you've been solving lots of problems, it's what ECOS and all sorts of other things have been using on your behalf. Right. You didn't know it, but that's that's what it was doing. OK, you'll know all the details by maybe next lecture or something like that. OK, so this is this is the infeasible start Newton method."},{"start":1912.88,"text":"There are some very interesting things about it. First, if you take a step of size 1, then"},{"start":1921.18,"text":"the equality constraints will hold, you will be feasible if you take a step of 1, and you'll"},{"start":1926.84,"text":"always be feasible thereafter. Because once you take a step of 1, and once x is feasible,"},{"start":1934.44,"text":"this is 0, and it actually becomes, except for the line search and the stopping criterion,"},{"start":1942.1,"text":"it's basically identical to"},{"start":1943.78,"text":"Newton's method with equality constraints"},{"start":1945.6,"text":"that's why it's called infeasible start"},{"start":1948.74,"text":"we'll see why"},{"start":1949.48,"text":"you might want to use this there's some very good"},{"start":1951.58,"text":"reasons I'll get to in a minute"},{"start":1953.0,"text":"yeah"},{"start":1960.02,"text":"you may not be allowed"},{"start":1965.72,"text":"to take a step of one"},{"start":1968.22,"text":"so actually what I'm about to say"},{"start":1969.7,"text":"is highly relevant for the homework you're going to do in the next couple of days."},{"start":1974.26,"text":"You may not be able to take us because, for example, a step of one might take you outside"},{"start":1978.76,"text":"the domain event."},{"start":1981.58,"text":"Okay, then you may not, that's one reason. We'll look at the line search for the infeasible start Newton method actually works with, instead of working with the function value, it actually works with the norm of the residual, right? So it actually works with the norm of the residual. So you'd look at, I'll call it Z, right? You would look at this. Z is going to be like."},{"start":2008.84,"text":"x stacked on top of nu, right? So, in fact, people call z the primal dual variable because it's basically top of it is the primal variable and the bottom is the dual variable, right? So, okay. So, and I think, let's see. So, here's the infeasible start Newton method. You will implement this, so I would strongly recommend listening. You also want to look at the book and stuff like that to read a couple pages about this. So,"}],"speech_gaps":[{"start":1954.416,"end":1959.62}],"frame":"../frames/v015/012.webp","frame_time":1870.17},{"title":"凸优化中的初始化与牛顿步长调整","segments":[{"id":101,"text":"Here, the initial point does not have to satisfy ax equals b, period. Does not have to. It must be in the domain of your function, right? So if your function was something like minus the sum of the logs of  if that was clear, but maybe to those working on this already, it is. Okay, so I think you'll, that was enough of a hint, but it's an important one. Right, so, okay."},{"id":109,"text":"So this is it. And the basic idea of this is that the directional derivative is, in fact, also equal to minus the norm of the residual. So what that says is, if you're doing a line search, it's pretty cool. It looks like this. This is t. I'm going to plot here the norm of the residual. So at t equals 0, it's at your current point. And what it says is that the slope of this curve is exactly minus 1."},{"id":110,"text":"Right. So if you're going to make that that step backtracking or our Miho step or whatever you call it, it's going to look like this. What it really it's going to it's just going to look like that. Right. And so you you will degrade this by alpha and you will take the first time you get something that is below that curve. And you absolutely have to because if T is small enough, it's got to happen. So, OK, you actually did this, even though yours isn't quite."},{"id":111,"text":"There's some questions as to whether or not it's working. I think I made this error. Okay, well, sorry. That's what you get for doing it. We should have done, yeah, anyway, that's the timing. That's right. That's a good experience. It's a good life experience to have. Everybody should have, should actually once in their life write a Newton thing or something like that where they were not, they were too cavalier about domains and nothing, and it was bad. Right, so, okay. All right."},{"id":112,"text":"So, you'll be implementing this for the homework. Okay, let's talk about how you solve the KKT system, right? Well, one obvious thing, which is, by the way, not bad at all, is actually just doing LDL transpose factorization. So, here's good news about LDL transpose factorization, is if you use a good sparse package, then you're, I mean, I'm assuming H and A are sparse."}],"notes":["本段主要讲解了在优化过程中如何处理 s of different methods, right? By the way, this is shockingly close to what you will be solving in your homework. So again, you might want to listen up as to how all this works, right? So we now have all sorts of different ways."}],"notes":["本段主要讲解了在优化问题中，如何利用矩阵的结构（如对角矩阵或带状矩阵）来简化计算。当Hessian矩阵H是对角矩阵时，可以通过消元法来简化问题，因为对角矩阵的逆容易计算。此外，当H是带状矩阵时，同样可以利用其结构进行快速求解。","在最优控制问题中，如果存在约束条件，例如要求无人机的路径起点和终点相同，这种约束会破坏带状矩阵的结构，从而增加计算复杂度。但即使在这种情况下，仍然可以通过快速算法来处理。","当Hessian矩阵是对角矩阵时，可以直接进行块消元，从而得到简化后的矩阵形式。这种情况下，计算H的逆矩阵变得非常简单，因为对角矩阵的逆只需要对每个对角线元素取倒数。","在实际应用中，这些方法非常实用，尤其是在处理大规模优化问题时。例如，课程中提到的作业问题就与这些方法密切相关，因此学生需要仔细理解这些概念。","通过这些方法，可以有效地处理各种优化问题，包括控制问题和信号处理问题。这些方法的核心思想是利用矩阵的结构特性来简化计算过程。","课程强调了这些方法的实际应用价值，特别是在处理带状矩阵和对角矩阵时，能够显著提高计算效率。因此，学生需要掌握这些方法的基本原理和应用场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2368.99,"end":2543.08,"asr_flags":[],"raw_segments":[{"start":2368.99,"text":"then it's actually going to exploit a lot of structure there, right? More even than you know about, right? So you could do this for a control problem, signal process, all sorts of stuff. You could just do this, right? You can do elimination. This is often done if H is diagonal, right? So if the Hessian is diagonal, like, for example, if the function is separable, right? It's separable, but they're coupled."},{"start":2397.24,"text":"by the equality constraints, right? Then H will be diagonal. And in that point, that's tempting enough for you to do elimination on it, right? So you would eliminate, because we know the inverse. H could be banded, same story, right? So, I mean, here's an example of a banded one. Optimal control with a constraint that, some constraints that couple states far apart. For example, you're making a tour. You say, make me a little drone tour."},{"start":2426.92,"text":"And it's got to start and end at the same place, right? Well, okay, so when I hear that, when I hear optimal control, I visualize immediately a banded system. I know immediately the banded system is going to drop down somewhere deep in the linear algebra. I'm going to solve a banded system, can do that super fast. But when I say something like, you have to be back at the same place."},{"start":2447.54,"text":"that actually couples like the beginning position and the final position. And that's actually one of these, that's going to be an equality constraint that breaks the bandedness, right? But I'll also note that I can do that super fast. So in other words, that's just a non-problem. Okay. All right. So to eliminate..."},{"start":2469.5,"text":"H inverse, and usually this is done when H is something like diagonal. So you would just do a block elimination here, and you'd end up with something looking like that. So you would form this matrix, then factorize it, then solve."},{"start":2492.08,"text":"And H inverse, you shouldn't even worry about because it's diagonal. So it's kind of a silly thing, right? And then you'd end up with something like that, right? So this is, once you form, this would allow you to solve for W. Once you solve for W, you solve for V over here, right? And that's cheap. Well, it's silly. H is diagonal. So that would be, that's the idea. Okay. All right. Okay. So we're looking."},{"start":2522.44,"text":"So actually what's weird about all these things is that they're all kind of the same, all these different. So now you have lots of different methods, right? By the way, this is shockingly close to what you will be solving in your homework. So again, you might want to listen up as to how all this works, right? So we now have all sorts of different ways."}],"speech_gaps":[],"frame":"../frames/v015/015.webp","frame_time":2380.99},{"title":"凸优化中的对偶问题与初始化要求","segments":[{"id":120,"text":"So you could say, yeah, I could solve that. It's a smooth problem. And you could say, oh, I could solve the dual here. And in this case, you could reconstruct the solution of the primal from the dual. It's not always true, but it is if the objective is strictly convex, which it
