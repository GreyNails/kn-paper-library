:"That's the same thing here, except that instead of using a Euclidean norm,","zh":"这里的情况是相同的，只是不再使用欧几里得范数，","start":2090.06,"end":2093.92},{"id":181,"text":"you might use a, you know, a different norm, right?","zh":"你可能会使用一种不同的范数，对吧？","start":2094.04,"end":2096.58},{"id":182,"text":"So, for example, I'll just write down some of these things.","zh":"例如，我将写下一些这些内容。","start":2096.68,"end":2100.04},{"id":183,"text":"the infinity norm of, I'll just do a two vector, right?","zh":"无穷范数，我将用一个二维向量来举例，对吧？","start":2100.04,"end":2105.06},{"id":184,"text":"This is the max of x1 and x2, right?","zh":"这是x1和x2中的最大值，对吧？","start":2105.16,"end":2110.52},{"id":185,"text":"Looks like that, okay?","zh":"看起来就是这样，对吧？","start":2110.96,"end":2112.6},{"id":186,"text":"And so...","zh":"因此...","start":2113.22,"end":2114.66},{"id":187,"text":"That is, we would call that, you would say that's an L-infinity norm ball. That would be the dialect. That's not really a dialect. That's high standard BBC mathematics. Anyone who knows any math would understand exactly what you're saying completely unambiguously. So, technically, that's not a dialect. Okay?","zh":"也就是说，我们会称其为L-无穷范数球。那是一种方言。其实那并不是一种方言。那是高标准的BBC数学。任何了解数学的人都会完全清楚你所说的，没有任何歧义。因此，从技术上讲，那并不是一种方言。明白了吗？","start":2116.54,"end":2138.43},{"id":188,"text":"That is, we would call that, you would say that's an L-infinity norm ball. That would be the dialect. That's not really a dialect. That's high standard BBC mathematics. Anyone who knows any math would understand exactly what you're saying completely unambiguously. So, technically, that's not a dialect. Okay? So, and this would look, you know, something like this, right? Here's the .11. And then you would have a set that looks like that.","zh":"也就是说，我们会称其为L-无穷范数球。那是一种方言。其实那并不是一种方言。那是高标准的BBC数学。任何了解数学的人都会完全清楚你所说的，没有任何歧义。因此，从技术上讲，那并不是一种方言。明白了吗？所以，这看起来，你知道，像这样，对吧？这里有一个.11。然后你会有一个看起来像这样的集合。","start":2138.93,"end":2165.19},{"id":189,"text":"And that would be a so-called L-infinity norm ball. Okay? Does that make sense? Okay. So, okay. Now we can also look at things like norm cones. This is super interesting. It's actually going to be kind of a theme in the class, is that we're going to be looking, a lot of times when we're looking at sets in dimension n, we will actually look at...","zh":"这将被称为L-无穷范数球。好吗？这有意义吗？好的。那么，我们也可以看看像范数锥这样的东西。这非常有趣。实际上，这将是本课程的一个主题，即当我们查看n维空间中的集合时，我们经常会查看Rn+1，其中有一个额外的元素。事实上，你们对此已经很熟悉了，因为当你们谈论函数的图像时，这就是你们所做的。例如，如果你有一个R2上的函数，你会想到它的图像，而它的图像存在于R3中，由形如x1, x2, f(x1, x2)的点组成。","start":2165.77,"end":2189.75},{"id":190,"text":"we'll actually look at Rn plus 1 where there's an additional thing and in fact you're used to this because this is like when you talk about the graph of a function that's what you're doing right you if you have a function on R2 you think of its graph well its graph is something that lives in R3 and it consists of points that look like this x1 x2 comma","zh":"我们将实际考察 Rⁿ⁺¹，其中包含一个额外的元素，实际上你已经很熟悉这种情况，因为这就是当你谈论函数图像时所做的事情。如果你有一个定义在 R² 上的函数，你会将其图像视为存在于 R³ 中的点集，这些点的形式是 x₁, x₂, f(x₁, x₂)。","start":2190.27,"end":2209.79},{"id":191,"text":"f of x1, x2, and that's the graph, right? So this is going to be a common thing. So here, the set of xt, t is a scalar, x is a vector, for which the norm of x is less than t, that's actually a norm cone. By the way, you have to show that, right? If it's a cone, it says I can multiply the pair xt by 7, for example, and it's still in the cone. And that would be true here, because if I multiply x by 7, the norm goes up by 7, but so does t, so everything's cool.","zh":"f of x1, x2，这就是图像，对吧？所以这会是一个常见的概念。在这里，集合 xt，其中 t 是一个标量，x 是一个向量，满足 x 的范数小于 t，这实际上是一个范数锥。顺便说一下，你必须证明这一点，对吧？如果这是一个锥，那么它表示我可以将 xt 这对乘以 7，例如，它仍然在锥内。在这里，这将是正确的，因为如果我将 x 乘以 7，范数也会增加 7 倍，t 同样也会增加 7 倍，所以一切都没问题。","start":2210.43,"end":2239.23}],"notes":["本段讲解了范数的基本定义和范数球的概念。范数是一个满足特定条件的函数，用于衡量向量的大小。在讨论范数球时，教授提到可以使用不同的范数，如无穷范数，其定义为向量各分量的最大值。教授还指出，使用L-无穷范数球时，应使用标准的数学表达方式，而不是方言。","教授进一步说明了范数锥的概念，指出范数锥是将向量和其范数的标量组合起来的集合。范数锥的定义是，对于向量x和标量t，满足范数(x) \u003c t的点构成的集合。教授强调，范数锥需要满足锥的性质，即可以将点乘以任意正数后仍属于该集合。","教授提到，范数锥是课程中的一个重要主题，经常在处理n维集合时出现。他以函数图像为例，说明了如何将函数的定义域和值域组合成更高维的集合，如将R²上的函数图像视为R³中的点集。","教授指出，范数锥的定义需要验证其是否满足锥的性质，即对于任意正数λ，点(λx, λt)仍属于该集合。他以乘以7为例，说明了范数和标量t同时扩大7倍，因此满足锥的性质。","教授强调了数学表达的严谨性，指出L-无穷范数球的表达方式应使用标准的数学术语，而不是方言。这有助于确保所有数学表达的清晰性和一致性。","教授通过具体的例子，如无穷范数和范数锥，展示了如何在凸优化中使用不同的范数来定义集合。这些例子帮助学生理解范数在不同场景下的应用和意义。"],"formulas":[{"latex":"\\|x\\|_\\infty = \\max(x_1, x_2)","symbols":"无穷范数","explanation":"正确地定义了无穷范数，表示向量中最大绝对值的元素。","evidence":"This is the max of x1 and x2, right?"},{"latex":"\\|x\\| \u003c t","symbols":"范数锥定义","explanation":"正确地定义了范数锥，表示所有满足范数小于某个标量t的向量集合。","evidence":"f of x1, x2, and that's the graph, right? So this is going to be a common thing. So here, the set of xt, t is a scalar, x is a vector, for which the norm of x is less than t, that's actually a norm cone. By the way, you have to show that, right? If it's a cone, it says I can multiply the pair xt by 7, for example, and it's still in the cone. And that would be true here, because if I multiply x by 7, the norm goes up by 7, but so does t, so everything's cool."}],"uncertainties":["188中的'.11'可能是误识别，实际应为'11'或'1'。"],"diagram":"none","start":2059.38,"end":2239.23,"asr_flags":[],"math_clarifications":["公式中的符号和定义符合数学规范，无需进一步修正。"],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":2059.38,"text":"mathematical notation. A norm is just a norm. It's just, it's any function that satisfies these"},{"start":2064.88,"text":"three things, period, right? And if we want to indicate a particular norm, we'll put a mnemonic"},{"start":2072.02,"text":"or some kind of symbol below it to tell you what norm it is, right?"},{"start":2076.6,"text":"So, yeah, so we'll do stuff like that."},{"start":2080.08,"text":"And there'll be some interesting ones, right?"},{"start":2084.68,"text":"Okay, let's see."},{"start":2086.64,"text":"We could look at a norm ball."},{"start":2090.06,"text":"That's the same thing here, except that instead of using a Euclidean norm,"},{"start":2094.04,"text":"you might use a, you know, a different norm, right?"},{"start":2096.68,"text":"So, for example, I'll just write down some of these things."},{"start":2100.04,"text":"the infinity norm of, I'll just do a two vector, right?"},{"start":2105.16,"text":"This is the max of x1 and x2, right?"},{"start":2110.96,"text":"Looks like that, okay?"},{"start":2113.22,"text":"And so..."},{"start":2116.54,"text":"Euclidean, so if I write, let's see if I have some, did I introduce a notation for that? No, I didn't. That's fine. Okay, so if I write down this, right, the set of x, right, for which, you know, x minus here, you know, 1, 1, you know, infinity is less than a half, right?"},{"start":2138.93,"text":"That is, we would call that, you would say that's an L-infinity norm ball. That would be the dialect. That's not really a dialect. That's high standard BBC mathematics. Anyone who knows any math would understand exactly what you're saying completely unambiguously. So, technically, that's not a dialect. Okay? So, and this would look, you know, something like this, right? Here's the .11. And then you would have a set that looks like that."},{"start":2165.77,"text":"And that would be a so-called L-infinity norm ball. Okay? Does that make sense? Okay. So, okay. Now we can also look at things like norm cones. This is super interesting. It's actually going to be kind of a theme in the class, is that we're going to be looking, a lot of times when we're looking at sets in dimension n, we will actually look at..."},{"start":2190.27,"text":"we'll actually look at Rn plus 1 where there's an additional thing and in fact you're used to this because this is like when you talk about the graph of a function that's what you're doing right you if you have a function on R2 you think of its graph well its graph is something that lives in R3 and it consists of points that look like this x1 x2 comma"},{"start":2210.43,"text":"f of x1, x2, and that's the graph, right? So this is going to be a common thing. So here, the set of xt, t is a scalar, x is a vector, for which the norm of x is less than t, that's actually a norm cone. By the way, you have to show that, right? If it's a cone, it says I can multiply the pair xt by 7, for example, and it's still in the cone. And that would be true here, because if I multiply x by 7, the norm goes up by 7, but so does t, so everything's cool."}],"speech_gaps":[],"frame":"../frames/v002/013.webp","frame_time":2071.38},{"title":"凸集与多面体","segments":[{"id":192,"text":"And then an example would be, this is what people call the Euclidean norm cone. It's got all sorts of other names. It's also called the second order cone. That's a good way to say it. Other names are, here's a cool one. It's the Lorentzian cone because it's the inequality that comes up in special relativity.","zh":"然后一个例子就是，人们称之为欧几里得范数锥。它还有许多其他名称。它也被称为二阶锥，这是个很好的说法。其他名称是，这里有一个很酷的名称。它被称为洛伦兹锥，因为它出现在狭义相对论中的不等式。","start":2239.71,"end":2260.69},{"id":193,"text":"Although, actually, to be honest with you, the Lorentzian cone has actually got the bottom part too, which we don't do. But it's half of a Lorentzian cone, or people would just call that a Lorentzian cone. And then somebody at some point tried to propagate people referring to this as an ice cream cone, and I'm extremely happy to report it did not take. So that's another name for this cone.","zh":"虽然，实际上，坦白说，洛伦兹锥实际上还包括底部的部分，而我们并没有包含这部分。但它是洛伦兹锥的一半，或者人们会直接称其为洛伦兹锥。然后有人曾试图让人们称这个锥体为冰淇淋锥，但我非常高兴地报告说，这个说法并没有被广泛接受。因此，这也是这个锥体的另一个名称。","start":2261.42,"end":2287.35},{"id":194,"text":"Okay, so these are, and this just, we're just going over like here's some common convex sets. Next up, polyhedra and also polytopes. I'll say something about that. So here's some notation that we're going to use throughout the class. So that's a vector AX, and that's a vector. So I have a weird squiggly inequality between vectors, right?","zh":"好的，这些就是，我们只是在这里列举一些常见的凸集。接下来是多面体和多面体。我会说一些相关内容。所以这里有一些我们将在整个课程中使用的符号。所以这是向量 AX，这是一个向量。我有一个奇怪的不等式符号在向量之间，对吧？","start":2289.69,"end":2312.75},{"id":195,"text":"And this is going to be element-wise inequality between vectors, right? It means that every entry of one vector is less than or equal to every entry of the other one. That's what it means, okay? So ax less than b, if you think of it row by row, each row is a single linear inequality.","zh":"这将是在向量之间的逐元素不等式，对吧？这意味着一个向量中的每个元素都小于或等于另一个向量中的每个元素。这就是它的意思，对吧？所以 ax 小于 b，如果你逐行考虑，每一行都是一个单线性不等式。","start":2313.26,"end":2332.0},{"id":196,"text":"So that's one way to think of it. And in fact, here, these AIs, these AI transpose are the rows of A. So basically, AX less than B says, well, A1 transpose X has to be less than B1. But that's a half space. That's everybody who lives on this side of this hyperplane. And that's the outward normal.","zh":"所以这是其中一种思考方式。事实上，这里的 A 的转置就是矩阵 A 的行。因此，AX 小于 B 表示，A1 的转置乘以 X 必须小于 B1。但这只是一个半空间，即所有位于这个超平面这一侧的点。这也是外法向量。","start":2332.89,"end":2357.77},{"id":197,"text":"But also, A2 transpose X has to be less than B2, and that's everybody that lives on this side, right? But we have to satisfy all of those, so that's basically taking the intersection of these half spaces, and we get a set that looks like that. And that's called a polyhedron. So it's literally the solution set of a set of linear inequalities. Okay, that's what a polyhedron is. And there's several, some people call these polytopes.","zh":"此外，A2 的转置乘以 X 必须小于 B2，这表示所有位于这一侧的点，对吧？但我们必须满足所有这些条件，因此这实际上是这些半空间的交集，得到的集合看起来像这样。这个集合被称为多面体。因此，它实际上是线性不等式集合的解集。好的，这就是多面体的定义。还有一些人称这些为多面体。","start":2359.0,"end":2387.46},{"id":198,"text":"Then to make it more confusing, some authors, and actually weirdly it's reversed and not consistent, some authors say that if a polyhedron is bounded, it's a polytope, and some have the exact opposite convention. So just, and it turns out for us it's not even going to matter, so just for us they're going to be kind of the same. But just to warn you, you might be reading something somewhere, and that author might have in their mind some idea that one of these two is bounded and whatever.","zh":"然后，为了更让人困惑，一些作者，实际上奇怪的是，这个定义是反过来的且不一致的，一些作者认为如果一个多面体是有界的，那么它就是一个多面体（polytope），而另一些作者则采用了完全相反的约定。所以，对我们来说，这甚至不会产生影响，因此对我们而言，它们基本上是相同的。但只是要提醒你，你可能在某个地方读到一些内容，而那位作者可能在脑海中有一个想法，认为这两个概念中有一个是有界的，而另一个则不是。","start":2388.0,"end":2417.34}],"notes":["本段介绍了凸集的几个例子，包括欧几里得范数锥（也称为二阶锥和洛伦兹锥），并提到它在相对论中的应用。同时，还提到冰激凌锥这一名称并未被广泛接受。","接下来，课程讨论了多面体和多面体（polytopes）的概念，并介绍了向量不等式（element-wise inequality）的定义，即每个向量的对应分量都满足不等式。","课程进一步解释了如何通过多个半空间的交集来定义多面体，即每个半空间对应一个线性不等式，所有不等式共同定义了一个凸集。","最后，课程提到多面体和多面体（polytopes）的定义在不同作者之间存在不一致，有些作者认为有界的多面体才是多面体，而有些则相反。但课程中指出，这种区别在本课程中并不重要。","这些内容帮助学生理解凸集的基本结构，以及如何通过线性不等式来定义和描述多面体等凸集。","课程还强调了术语的不一致性，提醒学生在阅读不同资料时注意作者可能采用的定义方式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2239.71,"end":2417.34,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2239.71,"text":"And then an example would be, this is what people call the Euclidean norm cone. It's got all sorts of other names. It's also called the second order cone. That's a good way to say it. Other names are, here's a cool one. It's the Lorentzian cone because it's the inequality that comes up in special relativity."},{"start":2261.42,"text":"Although, actually, to be honest with you, the Lorentzian cone has actually got the bottom part too, which we don't do. But it's half of a Lorentzian cone, or people would just call that a Lorentzian cone. And then somebody at some point tried to propagate people referring to this as an ice cream cone, and I'm extremely happy to report it did not take. So that's another name for this cone."},{"start":2289.69,"text":"Okay, so these are, and this just, we're just going over like here's some common convex sets. Next up, polyhedra and also polytopes. I'll say something about that. So here's some notation that we're going to use throughout the class. So that's a vector AX, and that's a vector. So I have a weird squiggly inequality between vectors, right?"},{"start":2313.26,"text":"And this is going to be element-wise inequality between vectors, right? It means that every entry of one vector is less than or equal to every entry of the other one. That's what it means, okay? So ax less than b, if you think of it row by row, each row is a single linear inequality."},{"start":2332.89,"text":"So that's one way to think of it. And in fact, here, these AIs, these AI transpose are the rows of A. So basically, AX less than B says, well, A1 transpose X has to be less than B1. But that's a half space. That's everybody who lives on this side of this hyperplane. And that's the outward normal."},{"start":2359.0,"text":"But also, A2 transpose X has to be less than B2, and that's everybody that lives on this side, right? But we have to satisfy all of those, so that's basically taking the intersection of these half spaces, and we get a set that looks like that. And that's called a polyhedron. So it's literally the solution set of a set of linear inequalities. Okay, that's what a polyhedron is. And there's several, some people call these polytopes."},{"start":2388.0,"text":"Then to make it more confusing, some authors, and actually weirdly it's reversed and not consistent, some authors say that if a polyhedron is bounded, it's a polytope, and some have the exact opposite convention. So just, and it turns out for us it's not even going to matter, so just for us they're going to be kind of the same. But just to warn you, you might be reading something somewhere, and that author might have in their mind some idea that one of these two is bounded and whatever."}],"speech_gaps":[],"frame":"../frames/v002/014.webp","frame_time":2251.71},{"title":"对称矩阵与正半定性","segments":[{"id":199,"text":"Okay, so, and this is, these are convex, right? So, okay. Here's an interesting cone. It's going to come up a lot. So, I already mentioned this. Sn is a set of symmetric n by n matrices. By the way, what's the dimension of that set? We've got n squared numbers in it, right? So, what's the dimension? What's that?","zh":"好的，所以这些是凸的，对吧？所以，好的。这里有一个有趣的锥体，它会经常出现。我之前已经提到了。Sn 是一个对称的 n 阶 n 矩阵的集合。顺便问一句，这个集合的维度是多少？我们有 n 平方个数字，对吧？所以，这个维度是多少？","start":2417.9,"end":2446.64},{"id":200,"text":"Yeah, it's n times n plus 1. It's n times n plus 1 divided by 2, right? And the reason is, you know, there's n squared numbers, but the upper half is the same as the bottom half, so it's redundant, okay? So that's a vector space of dimension n, n plus 1 over 2. Okay.","zh":"是的，它是 n 乘 n 加 1。是 n 乘 n 加 1 除以 2，对吧？原因在于，你有 n 平方个数字，但上半部分和下半部分是相同的，所以是冗余的，对吧？所以这是一个维度为 n(n+1)/2 的向量空间。好的。","start":2449.08,"end":2466.62},{"id":201,"text":"When we put a plus there, it's the set of things which are positive semi-definite. Now here, we are doing something here. We are overloading the squiggly inequality symbol, right? So you saw it on the previous slide between vectors, in which case it means element-wise inequality. Now it appears between symmetric matrices, and here it means it's positive semi-definite. Actually, we'll get into that a bit later today, but that's the picture, right?","zh":"当我们在这里加上一个加号时，它就是指那些正半定的矩阵集合。现在，我们在这里做了一件事，就是重载了波浪号不等式符号，对吧？你之前在上一张幻灯片中看到它在向量之间使用，此时它表示逐元素不等式。现在它出现在对称矩阵之间，此时它表示正半定。实际上，我们稍后会更详细地讨论这一点，但这就是这个概念的图示，对吧？","start":2467.98,"end":2496.49},{"id":202,"text":"Is that called polymorphism? Or what's it called when the semantics of a symbol depends on the syntactic context? Or is that just overloading? Doesn't matter. Somebody knows here. Come on. There's got to be some CS people here. Fine. Okay. That's the idea. Okay. So, I mean, here's a quick example. I mean, this is silly, but here's a two-by-two matrix.","zh":"这被称为多态性吗？或者当符号的语义依赖于语法上下文时，它叫什么？或者这只是重载？没关系。这里应该有人知道。来吧。这里肯定有计算机科学的人。好了。这就是这个想法。好的。所以，我意思是，这里有一个快速的例子。我意思是，这很傻，但这里有一个二阶矩阵。","start":2497.4,"end":2524.17},{"id":203,"text":"And we want to know, and so a general 2 by 2 symmetric matrix looks like x, y, y, z, because this has got to equal that, right? And the question is, when is that positive semi-definite? And you kind of know the answer, right? The answer is, this has got to be non-negative. That's got to be non-negative. And then the determinant has to be positive, right? And that says that x, z is bigger than y squared, okay? So that's the last inequality. And then, you know, here we've drawn it.","zh":"我们想知道，一般的 2 阶 2 矩阵看起来像 x, y, y, z，因为这个必须等于那个，对吧？问题是，什么时候这个矩阵是正半定的？你大概知道答案，对吧？答案是，这个必须是非负的。这个也必须是非负的。然后行列式必须是正的，对吧？这表示 x 和 z 的乘积必须大于 y 的平方，对吧？这就是最后一个不等式。然后，你知道，我们在这里画出了这个图。","start":2525.5,"end":2554.18},{"id":204,"text":"for x, y, and z. And what it is is it's the interior of this, which we don't show or something, but that's the boundary of it. Actually, you want to know something weird? If you twist your head just the right way, it turns out that is exactly the same as a second-order cone, but kind of just rotated. But it doesn't matter. This is what it is, right? So, okay.","zh":"对于x、y和z。它实际上是这个区域的内部，我们没有展示出来，但这是它的边界。实际上，你想知道一些奇怪的事情吗？如果你把头以正确的方式转动，你会发现这实际上和一个二阶锥完全一样，只是被旋转了一下。但这没关系。这就是它是什么，对吧？所以，好的。","start":2555.57,"end":2577.15}],"notes":["本段讲解了对称矩阵的维度计算，指出n×n对称矩阵的维度为n(n+1)/2，因为上三角部分与下三角部分对称，因此存在冗余。这为后续讨论正半定矩阵的性质奠定了基础。","讲者提到在对称矩阵之间使用不等号时，其含义为正半定性，这与向量之间的元素不等号不同，属于符号的重载。这种符号的重载在编程语言中常见，但在此处用于数学表达。","通过一个2×2对称矩阵的例子，讲者解释了正半定矩阵的条件：主对角线元素非负，且行列式大于零。这表明正半定矩阵的判定需要满足多个条件。","讲者进一步指出，正半定矩阵的集合可以视为一个锥体，其边界由行列式等于零的条件定义。这种几何解释有助于理解正半定矩阵的结构。","讲者提到，正半定矩阵的集合在某种旋转下可以视为二阶锥，这表明不同类型的锥体在某些情况下可以相互转换，但其本质仍保持不变。","本段内容强调了对称矩阵的维度计算、正半定性的定义、符号重载的概念以及正半定矩阵的几何性质，为后续讨论凸优化中的锥体和正半定性奠定了基础。"],"formulas":[{"latex":"\\frac{n(n+1)}{2}","symbols":"对称矩阵的维度","explanation":"公式正确，表示对称矩阵的维度为n(n+1)/2，符合数学定义。","evidence":"Yeah, it's n times n plus 1. It's n times n plus 1 divided by 2, right? And the reason is, you know, there's n squared numbers, but the upper half is the same as the bottom half, so it's redundant, okay? So that's a vector space of dimension n, n plus 1 over 2. Okay."}],"uncertainties":[],"diagram":"none","start":2417.9,"end":2577.15,"asr_flags":[],"math_clarifications":["公式'x, z > y^2'不完整且不准确，正半定矩阵的条件应为x > 0且x*z - y^2 ≥ 0。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2417.9,"text":"Okay, so, and this is, these are convex, right? So, okay. Here's an interesting cone. It's going to come up a lot. So, I already mentioned this. Sn is a set of symmetric n by n matrices. By the way, what's the dimension of that set? We've got n squared numbers in it, right? So, what's the dimension? What's that?"},{"start":2449.08,"text":"Yeah, it's n times n plus 1. It's n times n plus 1 divided by 2, right? And the reason is, you know, there's n squared numbers, but the upper half is the same as the bottom half, so it's redundant, okay? So that's a vector space of dimension n, n plus 1 over 2. Okay."},{"start":2467.98,"text":"When we put a plus there, it's the set of things which are positive semi-definite. Now here, we are doing something here. We are overloading the squiggly inequality symbol, right? So you saw it on the previous slide between vectors, in which case it means element-wise inequality. Now it appears between symmetric matrices, and here it means it's positive semi-definite. Actually, we'll get into that a bit later today, but that's the picture, right?"},{"start":2497.4,"text":"Is that called polymorphism? Or what's it called when the semantics of a symbol depends on the syntactic context? Or is that just overloading? Doesn't matter. Somebody knows here. Come on. There's got to be some CS people here. Fine. Okay. That's the idea. Okay. So, I mean, here's a quick example. I mean, this is silly, but here's a two-by-two matrix."},{"start":2525.5,"text":"And we want to know, and so a general 2 by 2 symmetric matrix looks like x, y, y, z, because this has got to equal that, right? And the question is, when is that positive semi-definite? And you kind of know the answer, right? The answer is, this has got to be non-negative. That's got to be non-negative. And then the determinant has to be positive, right? And that says that x, z is bigger than y squared, okay? So that's the last inequality. And then, you know, here we've drawn it."},{"start":2555.57,"text":"for x, y, and z. And what it is is it's the interior of this, which we don't show or something, but that's the boundary of it. Actually, you want to know something weird? If you twist your head just the right way, it turns out that is exactly the same as a second-order cone, but kind of just rotated. But it doesn't matter. This is what it is, right? So, okay."}],"speech_gaps":[],"frame":"../frames/v002/015.webp","frame_time":2429.9},{"title":"凸优化中的凸集与凸性验证","segments":[{"id":205,"text":"And, you know, look, positive semi-definite matrices are going to come up in many fields that I hope many of you have seen. Obvious one is they are covariance matrices, just to start, right? They describe ellipsoids, right? That's if you do stuff that's geometrical and you want to describe ellipsoids, they're parameterized by, at some point, in various different ways, but they're parameterized by positive semi-definite matrices. So positive semi-definite matrices come up in a ton of different fields, right? Okay, so...","zh":"而且，你知道的，正半定矩阵会在很多领域出现，我希望你们很多人都已经见过。最明显的例子就是它们是协方差矩阵，对吧？它们描述椭球体，对吧？如果你做几何方面的内容，并且想要描述椭球体，它们以不同的方式参数化，但它们被正半定矩阵参数化。因此，正半定矩阵会在大量的不同领域中出现，对吧？好的，所以……","start":2579.13,"end":2605.65},{"id":206,"text":"So that's the so-called PSD cone. That's what people would say. So we could go on, and I could show you all sorts of entertaining convex sets. But in fact, now we're going to get to how this actually really is going to work. So the way it's really going to work is we're actually going to do this using a calculus. And so let's stop and talk about what calculus is. So calculus is...","zh":"这就是所谓的PSD锥。这就是人们所说的。我们还可以继续，我可以向你们展示各种有趣的凸集。但事实上，我们现在要讲的是这实际上是如何运作的。所以，它真正运作的方式是，我们将使用一种微积分的方法。因此，让我们停下来谈谈什么是微积分。微积分是……","start":2607.03,"end":2636.32},{"id":207,"text":"I mean, it's outmoded and silly, and I can't imagine that they force people to take it, but they still do. It's fine.","zh":"我的意思是，它已经过时了，而且很傻，我无法想象他们还会强迫人们去学习它，但它们仍然这么做。这没关系。","start":2637.07,"end":2642.27},{"id":208,"text":"And what it is, is if you think about it, it's actually a really good way to be able to calculate derivatives of things, for example, right? And so I tell you about some basic things like, you know, powers and sine and log. And then I tell you some rules like, you know, the derivative of a product, right? Or I don't know, you know, it's fancy rules too. It doesn't matter. So I tell you these rules. And then what you do is you take your basic things, which we're going to call atoms.","zh":"它实际上是计算各种事物导数的一种非常好的方法，对吧？因此，我会向你们介绍一些基本的东西，比如，幂函数、正弦函数和对数函数。然后我会告诉你们一些规则，比如，乘积的导数，或者我不知道，一些复杂的规则。这并不重要。我会告诉你们这些规则。然后你们所做的就是，将你们的基本元素，我们称之为原子。","start":2643.36,"end":2668.52},{"id":209,"text":"which you know, like, oh, the derivative of sine is cosine, okay, right? And then, you know, you put it, and then you know a couple of rules, and with a couple of rules and knowing, you know, 30, 40 atoms, you're kind of in good shape, right? You can actually calculate, you know, you know the chain rule, and you can actually calculate the, you know, the gradient of some logistic, you know, multinomial logistic loss or something like that, right? Okay, so we're going to do actually something extremely similar. In spirit, identical.","zh":"比如，你知道的，正弦函数的导数是余弦函数，对吧？然后，你知道的，你把这些组合起来，再加上一些规则，知道一些30到40个原子，你基本上就准备好了，对吧？你实际上可以计算，你知道的，链式法则，你实际上可以计算，你知道的，某些逻辑斯蒂损失函数，比如多元逻辑斯蒂损失函数的梯度，对吧？好的，我们将做非常类似的事情。在精神上，完全相同。","start":2669.23,"end":2696.39},{"id":210,"text":"So we are channeling the 17th century here, or maybe 18th or something, to be fair. So you've seen some basic convex sets, and then we're going to look at some methods that preserve convexity. And then you will show, and a very effective method to know that a set is convex is to actually construct it using these rules. So another way to say that is we're going to have...","zh":"因此，我们在这里借鉴了17世纪，或者可能是18世纪，公平地说。你们已经见过一些基本的凸集，接下来我们将探讨一些保持凸性的方法。然后你们将展示，判断一个集合是否为凸集的一种非常有效的方法是使用这些规则来构造它。换句话说，我们将……","start":2697.01,"end":2722.77},{"id":211,"text":"syntactic verification of convexity of a set, right? So what it means is you start by saying like, well, you know, that's an ellipsoid. That's an ellipsoid. Those are convex. That's a half space. That's a polyhedron. Then I intersect them or something. That's convex, right? And stuff like that, right? So, okay. But let's back up because that's the correct way to do it. But I'll say something about other ways, right? If a person walks up to you in the street and says, is this set convex or not, right?","zh":"对一个集合的凸性进行语法验证，对吧？这意味着你从说，比如，好吧，这是一个椭球体。这是一个椭球体。这些是凸的。这是一个半空间。这是一个多面体。然后我将它们相交，或者类似的操作。这也是凸的，对吧？还有类似的事情，对吧？所以，好的。但让我们后退一步，因为这是正确的方法。不过我会说一些其他方法，对吧？如果一个人在街上走到你面前，问你，这个集合是凸的还是不凸的，对吧？","start":2725.91,"end":2752.65}],"notes":["本段主要介绍了正半定矩阵在多个领域中的应用，特别是作为协方差矩阵和椭球体的参数化工具。正半定矩阵在几何学中用于描述椭球体，这是凸优化中的重要概念。","接下来，课程转向了如何通过微积分的方法来处理凸集。微积分被描述为一种计算导数的工具，通过基本函数和规则（如乘积法则、链式法则）来构建复杂的导数计算。","课程提到，通过构建基本的“原子”函数并应用规则，可以计算出复杂的梯度，例如多分类逻辑损失函数的梯度。这与凸集的构造方法在精神上是相同的。","课程进一步指出，凸集的验证可以通过构造方法进行，即通过基本的凸集（如椭球体、半空间、多面体）并应用交集等操作来构建新的凸集。","最后，课程提到，虽然构造方法是验证凸集的正确方式，但也会提到其他方法，例如在街头遇到他人询问某个集合是否为凸集时，如何快速判断。","这些内容为后续的凸优化方法奠定了基础，强调了凸集的构造和验证在凸优化中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2579.13,"end":2752.65,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2579.13,"text":"And, you know, look, positive semi-definite matrices are going to come up in many fields that I hope many of you have seen. Obvious one is they are covariance matrices, just to start, right? They describe ellipsoids, right? That's if you do stuff that's geometrical and you want to describe ellipsoids, they're parameterized by, at some point, in various different ways, but they're parameterized by positive semi-definite matrices. So positive semi-definite matrices come up in a ton of different fields, right? Okay, so..."},{"start":2607.03,"text":"So that's the so-called PSD cone. That's what people would say. So we could go on, and I could show you all sorts of entertaining convex sets. But in fact, now we're going to get to how this actually really is going to work. So the way it's really going to work is we're actually going to do this using a calculus. And so let's stop and talk about what calculus is. So calculus is..."},{"start":2637.07,"text":"I mean, it's outmoded and silly, and I can't imagine that they force people to take it, but they still do. It's fine."},{"start":2643.36,"text":"And what it is, is if you think about it, it's actually a really good way to be able to calculate derivatives of things, for example, right? And so I tell you about some basic things like, you know, powers and sine and log. And then I tell you some rules like, you know, the derivative of a product, right? Or I don't know, you know, it's fancy rules too. It doesn't matter. So I tell you these rules. And then what you do is you take your basic things, which we're going to call atoms."},{"start":2669.23,"text":"which you know, like, oh, the derivative of sine is cosine, okay, right? And then, you know, you put it, and then you know a couple of rules, and with a couple of rules and knowing, you know, 30, 40 atoms, you're kind of in good shape, right? You can actually calculate, you know, you know the chain rule, and you can actually calculate the, you know, the gradient of some logistic, you know, multinomial logistic loss or something like that, right? Okay, so we're going to do actually something extremely similar. In spirit, identical."},{"start":2697.01,"text":"So we are channeling the 17th century here, or maybe 18th or something, to be fair. So you've seen some basic convex sets, and then we're going to look at some methods that preserve convexity. And then you will show, and a very effective method to know that a set is convex is to actually construct it using these rules. So another way to say that is we're going to have..."},{"start":2725.91,"text":"syntactic verification of convexity of a set, right? So what it means is you start by saying like, well, you know, that's an ellipsoid. That's an ellipsoid. Those are convex. That's a half space. That's a polyhedron. Then I intersect them or something. That's convex, right? And stuff like that, right? So, okay. But let's back up because that's the correct way to do it. But I'll say something about other ways, right? If a person walks up to you in the street and says, is this set convex or not, right?"}],"speech_gaps":[],"frame":"../frames/v002/016.webp","frame_time":2591.13},{"title":"凸集的验证方法","segments":[{"id":212,"text":"That happens, by the way. It actually did happen to me once, which is weird. But I was in New York. It was very weird. Okay, anyway, it actually happened. So, okay, fine. I think it happened because they'd seen me talk about this. And then they thought, well, hey, there he is. I'm going to go. Anyway, fine. So, okay. So, you know, how do you show a set is convex, right? Well...","zh":"顺便提一下，这种情况确实发生过。有一次，这对我来说很奇怪。但我当时在纽约，那真的很奇怪。好吧，不管怎样，它确实发生了。所以，好吧，没问题。我想这是因为他们看到我谈论过这个。然后他们想，嘿，他在这里。我要去。不管怎样，好吧。所以，好吧。你知道吗，如何证明一个集合是凸的呢？嗯……","start":2754.31,"end":2779.31},{"id":213,"text":"Okay, so one way is just to roll up your sleeves and go, okay, let x1 be any point in the set, let x2 be any point in the set, let theta be between 0 and 1, and then just argue that this point, this mixture or convex combination of x1 and 2 is in the set, right? Now, that's the right thing to do almost never. I mean, every now and then you may have to fall back to that, but it should be the absolute last resort.","zh":"好吧，一种方法就是卷起你的袖子，然后说，让x1是集合中的任意一点，让x2是集合中的任意一点，让theta在0和1之间，然后仅仅论证这个点，也就是x1和x2的凸组合在集合中，对吧？现在，这几乎从来都不是正确的方法。我的意思是，每隔一段时间你可能不得不回到这种方法，但它应该是最后的手段。","start":2779.74,"end":2806.65},{"id":214,"text":"right? So you don't want to do that, right? Oh, well, let me tell you, okay, so the way we're going to do it is actually going to be constructive or syntactic or by a calculus. And the way that's going to happen is what we're going to do is we're going to take a set C and we're going to represent it as a bunch of operations applied to","zh":"对吧？你不想这么做，对吧？哦，好吧，让我告诉你，我们实际上要做的是一种构造性或语法性或通过微积分的方法。要做到这一点的方式是，我们将取一个集合C，并将其表示为对一些已知凸集合进行操作的结果。","start":2807.66,"end":2829.67},{"id":215,"text":"Sets already known to be convex. A small number, the ones you've just seen already. Half spaces, polyhedra, norm balls, norm cones. That's it. That's what we're going to do. Now, some of these things are obvious, like intersection affine functions. You will see later today some things that are not obvious at all. There's something else I didn't put on here. It's actually like method... It could be method 3 or method 0.","zh":"这些集合已经知道是凸的。数量不多，你刚刚看到的那些。半空间、多面体、范数球、范数锥。就是这些。这就是我们要做的。现在，其中一些东西很明显，比如交集的仿射函数。你今天稍后会看到一些显然不明显的东西。还有我在这里没有提到的另一种方法。实际上，这可能类似于方法3或方法0。","start":2830.68,"end":2857.44},{"id":216,"text":"I didn't want it on the slides for the reasons that will become clear when I tell you what it is. So here's another method. Here's a street fighting method for figuring out if something is convex. What you do is you write, I'm assuming you have some code that will tell you if a point is in the set C. Let's assume that, right? Then here's what you do. Also, you have some way of generating, let's say random, but just points inside C.","zh":"我不希望在幻灯片上展示它，因为当我告诉你它是什么时，原因会变得清楚。所以这里还有另一种方法。这里有一种街头斗士的方法，用来判断某物是否是凸的。你所做的就是，假设你有一些代码可以告诉你一个点是否在集合C中。让我们假设这一点，对吧？然后你所做的就是，你还有某种方法生成一些点，比如说随机的，但只是在C内部的点。","start":2858.26,"end":2882.44},{"id":217,"text":"So here's what you do. You write a code that does this. It generates two points inside C. It picks a theta at random between 0 and 1, forms this thing, and then checks if it's in C. Everybody got my method? OK. Now you go to lunch. Everybody, this is critical. This is a very important part of this. You go to lunch now, OK? And you come back. And by the way, you make it halt the first time it finds a violation, right?","zh":"所以，你们要这么做。你们编写一段代码来执行这个操作。这段代码会在集合C内部生成两个点。它随机选择一个介于0和1之间的theta值，生成这个点，然后检查它是否在C中。大家明白我的方法了吗？好的。现在你们去吃午饭。大家，这非常关键。这是本节课非常重要的一部分。现在你们去吃午饭，好吗？回来的时候，顺便说一下，当它第一次发现违反条件时，就让程序停止运行，对吧？","start":2882.99,"end":2910.72}],"notes":["本段讲解了如何验证一个集合是否为凸集，强调了直接使用凸组合定义的方法虽然正确，但应作为最后的手段。教授指出，更有效的方法是通过构造性或语法性的方法，利用已知的凸集进行操作，如半空间、多面体、范数球和范数锥等。","教授提到，虽然有些凸集的验证是显而易见的，如交集的仿射函数，但也会遇到一些不明显的例子。此外，教授还提到一种‘街头斗殴’的方法，即编写代码来随机生成两个点并检查它们的凸组合是否在集合中。","这种方法的关键在于编写代码，生成两个点，随机选择一个介于0和1之间的θ值，形成凸组合，并检查该点是否在集合中。教授强调，这种方法需要在午餐后继续运行，直到发现第一个违反凸性的例子为止。","教授特别指出，这种方法的目的是为了验证集合是否为凸集，而不是直接证明。这种方法在实际应用中非常有用，因为它可以快速发现非凸性，而无需进行复杂的数学推导。","教授还提到，这种方法的实现需要一些前提条件，例如能够判断一个点是否在集合中，以及能够生成集合内的随机点。这些条件在实际编程中是必须的。","最后，教授强调了这种方法的重要性，并提醒学生在实际应用中要确保代码的正确性，以便能够准确地检测到凸性的违反情况。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2754.31,"end":2910.72,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2754.31,"text":"That happens, by the way. It actually did happen to me once, which is weird. But I was in New York. It was very weird. Okay, anyway, it actually happened. So, okay, fine. I think it happened because they'd seen me talk about this. And then they thought, well, hey, there he is. I'm going to go. Anyway, fine. So, okay. So, you know, how do you show a set is convex, right? Well..."},{"start":2779.74,"text":"Okay, so one way is just to roll up your sleeves and go, okay, let x1 be any point in the set, let x2 be any point in the set, let theta be between 0 and 1, and then just argue that this point, this mixture or convex combination of x1 and 2 is in the set, right? Now, that's the right thing to do almost never. I mean, every now and then you may have to fall back to that, but it should be the absolute last resort."},{"start":2807.66,"text":"right? So you don't want to do that, right? Oh, well, let me tell you, okay, so the way we're going to do it is actually going to be constructive or syntactic or by a calculus. And the way that's going to happen is what we're going to do is we're going to take a set C and we're going to represent it as a bunch of operations applied to"},{"start":2830.68,"text":"Sets already known to be convex. A small number, the ones you've just seen already. Half spaces, polyhedra, norm balls, norm cones. That's it. That's what we're going to do. Now, some of these things are obvious, like intersection affine functions. You will see later today some things that are not obvious at all. There's something else I didn't put on here. It's actually like method... It could be method 3 or method 0."},{"start":2858.26,"text":"I didn't want it on the slides for the reasons that will become clear when I tell you what it is. So here's another method. Here's a street fighting method for figuring out if something is convex. What you do is you write, I'm assuming you have some code that will tell you if a point is in the set C. Let's assume that, right? Then here's what you do. Also, you have some way of generating, let's say random, but just points inside C."},{"start":2882.99,"text":"So here's what you do. You write a code that does this. It generates two points inside C. It picks a theta at random between 0 and 1, forms this thing, and then checks if it's in C. Everybody got my method? OK. Now you go to lunch. Everybody, this is critical. This is a very important part of this. You go to lunch now, OK? And you come back. And by the way, you make it halt the first time it finds a violation, right?"}],"speech_gaps":[],"frame":"../frames/v002/017.webp","frame_time":2766.31},{"title":"凸集与凸性的直观判断","segments":[{"id":218,"text":"In which case, you know for sure it's not convex because it just produced an x1 and an x2 and a theta between 0 and 1, and the convex combination is not x1 and x2 are in C. The convex combination is not. Everybody got that? In which case, you immediately remove all evidence that you ever did this. You remove the script, so it's gone.","zh":"在这种情况下，你确定它不是凸集，因为它只是生成了一个x1和x2以及一个在0到1之间的theta，而凸组合并不包含x1和x2在C中。凸组合并不成立。大家明白了吗？在这种情况下，你会立刻删除所有你曾经做过这件事的证据。你删除脚本，这样它就消失了。","start":2911.82,"end":2937.36},{"id":219,"text":"Like don't push it or anything to github or just it's just gone right then Then what happens is when you're hanging out with your friends or something somebody says I don't know Hey, do you think like the set of measures that blah blah blah this that anything some complicated thing and you'd go like of course That's not convex That's which and they go Really, how did you know that and you go like uh? Intuition right, so that's what you do. Okay, everybody following this, okay?","zh":"比如，不要把它推送到github或者什么的，它就在那时就消失了。然后发生的事情是，当你和朋友在一起的时候，有人可能会说，嘿，你认为像那些关于度量的集合之类的复杂的东西是不是凸集？你会回答，当然不是，那是哪一个？他们会说，你怎么知道的？你会说，直觉对吧？这就是你该做的事。大家明白了吗？","start":2938.44,"end":2965.84},{"id":220,"text":"Now suppose you come back from lunch and it is looked at a hundred million different pairs x1 and x2 and it has not yet found a convex combination is not in the set everybody following this What precisely do you know at that time? No, you know nothing whatsoever. Okay. Okay this by the way This is still fine because now you could then you can try to show it","zh":"现在假设你从午餐回来，查看了上百亿对不同的x1和x2，但还没有找到一个凸组合不在集合中的例子。大家明白这个时候你到底知道什么吗？不，你什么都不知道。好的。顺便说一句，这仍然没问题，因为现在你可以尝试证明它是凸集。","start":2966.54,"end":2989.65},{"id":221,"text":"And then in your next paper, you can say, well, look, this is convex. It's not totally obvious, but here's a paragraph derivation. You could do that. But if you fail, you still win. You go to the next conference. You hang out with your friends. And they say things like, wow, is the set of blah, blah, blah, you think that's convex? And you'd go, I think, I guess so. And they would say, how could you guess that? And you'd say.","zh":"然后在你下一篇文章中，你可以说，好吧，看，这是凸集。它并不完全明显，但这里有一个段落推导。你可以这么做。但如果你失败了，你仍然赢了。你去下一个会议，和朋友们一起，他们会说像，哇，那个关于 blah, blah, blah 的集合，你觉得它是凸集吗？你会说，我想是的。他们会问，你怎么能猜到的？你会说。","start":2990.05,"end":3016.78},{"id":222,"text":"intuition right right and then usually if you're what will happen is you know two months later uh somebody i don't know maybe a russian grad student at the conference or something will post something on archive showing that it isn't kind in which case you'll say like i knew that right which is a lie but okay so fine all right","zh":"直觉对吧，对吧。通常如果你是这样做的，那么两个月后，可能某个在会议上遇到的俄罗斯研究生会发布一个存档内容，显示它不是凸集。在这种情况下，你会说，我知道的，对吧，这其实是个谎言，但没关系，好的，就这样。","start":3018.02,"end":3035.92},{"id":223,"text":"So that's off the record. That was your method. But, you know, it's actually not at all a bad thing to do. Like, I would not judge some... I mean, I would if it was something where, like, in three lines you could see it's convex. But if it's not obvious, I would totally... I personally... I'll go ahead and admit it right here in public. I've done that. Okay?","zh":"所以这是私下说的。那是你的方法。但你知道吗，实际上这样做并不是一件坏事。比如，我不会评判某些……我的意思是，如果在三行内就能看出它是凸的，我可能会评判。但如果不是很明显，我完全……我个人……我现在就在这里公开承认，我做过这样的事。好的？","start":3036.68,"end":3057.9},{"id":224,"text":"And then I go right to my Russian friends and say, is this convex? And then we have a notion, if I send an email to Yuri Nesterov, there's a delay. And then three days later, he says, I am not sure. That's the equivalent of like, it's unknown. It's probably the equivalent of it's unknowable, actually. So anyway, that's how I do it. Anyway, so that's, okay, fine.","zh":"然后我直接去找我的俄罗斯朋友，问：‘这个是凸的吗？’然后我们有一个概念，如果我给尤里·内斯特罗夫发一封邮件，会有延迟。然后三天后，他说：‘我不确定。’这相当于说‘未知’。实际上，这可能相当于‘不可知’。总之，这就是我的做法。总之，好吧，就这样。","start":3058.82,"end":3082.85}],"notes":["本段讲授了如何通过凸组合来判断一个集合是否为凸集。当一个集合中存在两个点，其凸组合不在该集合中时，该集合就不是凸集。讲者强调了这种判断方法的直观性，并指出在实际研究中，有时需要依赖直觉来判断凸性。","讲者提到，当一个人在研究中发现某个集合可能不是凸集时，会立即删除相关证据，以避免误导他人。这种做法虽然看似不负责任，但有时是出于对研究结果的保护。","当一个人在研究中无法找到反例时，他仍然无法确定该集合是否为凸集。这种情况下，他可能会尝试通过数学推导来证明其凸性，但若失败，他仍然可以继续研究。","讲者指出，有时在学术交流中，人们会通过直觉来判断某个集合是否为凸集。这种直觉可能来源于对问题的熟悉程度，但有时也会被质疑。","讲者提到，有时在学术会议中，其他研究者可能会指出某个集合不是凸集，而讲者可能会声称自己早就知道这一点，但实际上这是谎言。这种现象反映了学术交流中的不确定性。","最后，讲者提到，当遇到不确定的凸性问题时，可以向专家请教，但有时专家也无法确定答案。这种情况下，问题可能被认为是不可知的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2911.82,"end":3082.85,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2911.82,"text":"In which case, you know for sure it's not convex because it just produced an x1 and an x2 and a theta between 0 and 1, and the convex combination is not x1 and x2 are in C. The convex combination is not. Everybody got that? In which case, you immediately remove all evidence that you ever did this. You remove the script, so it's gone."},{"start":2938.44,"text":"Like don't push it or anything to github or just it's just gone right then Then what happens is when you're hanging out with your friends or something somebody says I don't know Hey, do you think like the set of measures that blah blah blah this that anything some complicated thing and you'd go like of course That's not convex That's which and they go Really, how did you know that and you go like uh? Intuition right, so that's what you do. Okay, everybody following this, okay?"},{"start":2966.54,"text":"Now suppose you come back from lunch and it is looked at a hundred million different pairs x1 and x2 and it has not yet found a convex combination is not in the set everybody following this What precisely do you know at that time? No, you know nothing whatsoever. Okay. Okay this by the way This is still fine because now you could then you can try to show it"},{"start":2990.05,"text":"And then in your next paper, you can say, well, look, this is convex. It's not totally obvious, but here's a paragraph derivation. You could do that. But if you fail, you still win. You go to the next conference. You hang out with your friends. And they say things like, wow, is the set of blah, blah, blah, you think that's convex? And you'd go, I think, I guess so. And they would say, how could you guess that? And you'd say."},{"start":3018.02,"text":"intuition right right and then usually if you're what will happen is you know two months later uh somebody i don't know maybe a russian grad student at the conference or something will post something on archive showing that it isn't kind in which case you'll say like i knew that right which is a lie but okay so fine all right"},{"start":3036.68,"text":"So that's off the record. That was your method. But, you know, it's actually not at all a bad thing to do. Like, I would not judge some... I mean, I would if it was something where, like, in three lines you could see it's convex. But if it's not obvious, I would totally... I personally... I'll go ahead and admit it right here in public. I've done that. Okay?"},{"start":3058.82,"text":"And then I go right to my Russian friends and say, is this convex? And then we have a notion, if I send an email to Yuri Nesterov, there's a delay. And then three days later, he says, I am not sure. That's the equivalent of like, it's unknown. It's probably the equivalent of it's unknowable, actually. So anyway, that's how I do it. Anyway, so that's, okay, fine."}],"speech_gaps":[],"frame":"../frames/v002/018.webp","frame_time":2923.82},{"title":"凸集的交集与示例","segments":[{"id":225,"text":"Let's move on. We have the idea of intersection. This is kind of obvious. This is geometrically very obvious. Here's a convex set. Here's another one. The intersection is this thing.","zh":"我们继续。我们有交集的概念。这有点显而易见。从几何上看也非常明显。这里是一个凸集。这里是另一个。它们的交集就是这个集合。","start":3083.63,"end":3105.06},{"id":226,"text":"And, you know, look, your eyeball tells you it's convex. And, by the way, a three-line proof would tell you that it's convex, too. Okay? So the intersection of convex sets is convex. Actually, the intersection can be even an infinite number of things can be half. So we can talk about things like an infinite number, the intersection of an infinite number of half spaces is convex.","zh":"而且，你知道的，你的眼睛会告诉你这是凸的。顺便说一句，一个三步证明也会告诉你这是凸的。好吗？凸集的交集是凸的。实际上，交集甚至可以是无限多个集合的交集，所以我们可以谈论像无限多个半空间的交集这样的问题，它仍然是凸的。","start":3105.49,"end":3133.85},{"id":227,"text":"So here's my set S. This is called a trigonometric polynomial, right? So it comes up in lots of fields, right? Like in signal processing, for example, or whatever. But there it is. It's a linear combination of these functions, which is cosine, cosine 2g, and blah, blah, blah. I mean, I guess you could also call it an even Fourier series or truncated. Lots of people, you could call it lots of things, right? Fine.","zh":"这里是我的集合 S。这被称为三角多项式，对吧？它在很多领域都会出现，对吧？比如在信号处理中，或者随便什么领域。但这就是它。它是这些函数的线性组合，包括余弦、余弦 2g，以及其他的。我的意思是，你也可以称它为偶傅里叶级数或截断的傅里叶级数。很多人，你可以称它为很多种东西，对吧？好吧。","start":3134.31,"end":3159.73},{"id":228,"text":"Okay, then my set S is the set of coefficients for which this function is less than 1 as long for all t, absolute value t less than, but this is symmetric, right? If I plug in minus t, it's the same thing. So I just, it's basically t between 0 and, you know, pi over 3, right? So everybody got it?","zh":"那么，我的集合 S 是这样的系数集合，使得这个函数在所有 t 的绝对值小于某个值时都小于 1。不过这个函数是对称的，对吧？如果我代入 -t，结果是一样的。所以我只需要考虑 t 在 0 到 π/3 之间的情况，对吧？大家明白了吗？","start":3160.29,"end":3182.07},{"id":229,"text":"So that's it. That's my set. And look, if you were in EE or something, you could say, oh, these are the things that satisfy some filter that does something and blah, blah, blah. That's fine. OK. So the question, is it convex? I mean, it is. Otherwise, it wouldn't be as an example in the lecture. But the question is, how do you show that? And in fact, it's not too hard to actually just","zh":"这就是我的集合。你看，如果你在电子工程领域，你可以说，哦，这些是满足某种滤波器条件的东西，等等。这没问题。好的。问题是，这个集合是否是凸的？我的意思是，它确实是。否则它就不会作为本节课的例子出现。但问题是，你怎么证明这一点？事实上，实际上直接暴力证明并不太难。","start":3182.46,"end":3210.49},{"id":230,"text":"go brute force on this, right? And so to go brute force, what you'd do is you'd say, well, suppose I had two, two entries, two members of this set, right? So like, here's one, and I'm going to draw, not the coefficients, but I'll draw the actual trigonometric polynomial. So here's one. And sure enough, look, it's between plus minus one out to pi over three. So here's one and here's another one. Okay. Like that.","zh":"对吧？所以，要暴力证明的话，你可以说，假设我有两个属于这个集合的元素，对吧？比如，这里有一个，我会画出实际的三角多项式，而不是系数。这里有一个，确实，它在 π/3 以内都在 ±1 之间。这里有一个，这里还有一个。好的，就是这样。","start":3211.01,"end":3236.7}],"notes":["本段讲解了凸集的交集性质，指出交集仍然是凸集，并且可以是无限多个半空间的交集。这为后续讨论凸集的构造和性质奠定了基础。","接着，课程通过一个具体的例子来说明凸集的构造，即一个由三角多项式定义的集合。该集合由一系列余弦函数的线性组合构成，且满足在特定区间内函数值不超过1。","该例子中，函数的定义域是对称的，因此只需考虑从0到π/3的区间。这简化了分析过程，同时保持了函数的凸性。","课程进一步提出问题，即如何证明该集合是凸的。虽然直观上可能认为是凸的，但需要通过严格的数学证明来确认。","为了证明，课程建议采用暴力方法，即取两个属于该集合的元素，验证它们的凸组合是否也属于该集合。这体现了凸集的基本定义。","通过绘制具体的三角多项式，课程展示了如何直观地验证凸性，强调了数学证明与直观理解的结合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3083.63,"end":3236.7,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3083.63,"text":"Let's move on. We have the idea of intersection. This is kind of obvious. This is geometrically very obvious. Here's a convex set. Here's another one. The intersection is this thing."},{"start":3105.49,"text":"And, you know, look, your eyeball tells you it's convex. And, by the way, a three-line proof would tell you that it's convex, too. Okay? So the intersection of convex sets is convex. Actually, the intersection can be even an infinite number of things can be half. So we can talk about things like an infinite number, the intersection of an infinite number of half spaces is convex. Okay? So here's an example. It's quasi-practical or something. It goes like this."},{"start":3134.31,"text":"So here's my set S. This is called a trigonometric polynomial, right? So it comes up in lots of fields, right? Like in signal processing, for example, or whatever. But there it is. It's a linear combination of these functions, which is cosine, cosine 2g, and blah, blah, blah. I mean, I guess you could also call it an even Fourier series or truncated. Lots of people, you could call it lots of things, right? Fine."},{"start":3160.29,"text":"Okay, then my set S is the set of coefficients for which this function is less than 1 as long for all t, absolute value t less than, but this is symmetric, right? If I plug in minus t, it's the same thing. So I just, it's basically t between 0 and, you know, pi over 3, right? So everybody got it?"},{"start":3182.46,"text":"So that's it. That's my set. And look, if you were in EE or something, you could say, oh, these are the things that satisfy some filter that does something and blah, blah, blah. That's fine. OK. So the question, is it convex? I mean, it is. Otherwise, it wouldn't be as an example in the lecture. But the question is, how do you show that? And in fact, it's not too hard to actually just"},{"start":3211.01,"text":"go brute force on this, right? And so to go brute force, what you'd do is you'd say, well, suppose I had two, two entries, two members of this set, right? So like, here's one, and I'm going to draw, not the coefficients, but I'll draw the actual trigonometric polynomial. So here's one. And sure enough, look, it's between plus minus one out to pi over three. So here's one and here's another one. Okay. Like that."}],"speech_gaps":[],"frame":"../frames/v002/019.webp","frame_time":3095.63},{"title":"凸集与半空间的交集","segments":[{"id":231,"text":"right? Then what I would do in my head, and you could just start with the average because, you know, if it doesn't hold for the average, anyway, that's, so then you ask yourself if I form the average of those two. Now, technically, I'm forming the average of the coefficients. But when I form the average of the coefficients, I get the average, I literally just average these two functions. And I get this dotted curve here like that. And then we ask ourselves the question, if a function is between plus and minus one over this little boundary,","zh":"对吧？然后我在心里会这么做，你可以从平均值开始，因为，你知道的，如果它对平均值不成立，那也没关系，所以你问自己，如果我形成这两个的平均值。技术上，我是在形成系数的平均值。但当我形成系数的平均值时，我就得到了平均值，我实际上只是将这两个函数平均。然后我得到了这条虚线曲线。然后我们问自己，如果一个函数在正负1之间的这个小边界内，","start":3237.62,"end":3264.58},{"id":232,"text":"Right? And so is another one. And then I form the average of those two functions. Is it between plus and minus one over that? The answer is, yeah, of course it is. Yeah. So it's convex. There's a derivation of it. But we can also think it's a really cool way to think of S as an infinite intersection. So I'm going to write that down because it's actually kind of interesting. It goes like this. It's the...","zh":"对吧？还有另一个。然后我形成这两个函数的平均值。它是否在正负1之间？答案是，当然了。是的。所以它是凸的。有它的推导过程。但我们也可以认为这是一种非常酷的方式来思考S作为无限交集。所以我把它写下来，因为它实际上挺有趣的。它看起来是这样的。它是……","start":3265.3,"end":3293.02},{"id":233,"text":"It's the set of x for which, and then it's, here, I'll just write, it's less than 1 for t in, you know, 0, you know, pi over 3, right? So it looks like that, right? So I'm going to ask you a question. Let's say I need a number between 0 and pi over 3. Here it is, 0.6, okay? So I would like you to tell me...","zh":"它是满足条件的x的集合，这里我会直接写，它是小于1，对于t在0到π/3之间，对吧？看起来是这样的，对吧？所以我问你一个问题。假设我需要一个在0到π/3之间的数。这里它就是0.6，对吧？我希望你告诉我……","start":3294.33,"end":3320.25},{"id":234,"text":"What does this look like? In fact, describe this geometrically. We haven't given a name for it yet. Whoa, whoa, whoa. Very wrong, wrong. There you go. And this is for t equals 0.6. There. OK? Everybody got that? OK? So the question is, what does this look like? It's a subset. It's what? A subset. Which set? A subset, the second one. It's a subset?","zh":"这看起来是什么样子？事实上，用几何的方式描述一下。我们还没有给它起名字。哇，哇，哇。非常错误，错了。就是这样。这是对于t等于0.6的情况。好了？大家明白了吗？好了？所以问题是，这看起来是什么样子？它是一个子集。它是哪一个子集？一个子集，第二个子集。它是子集吗？","start":3320.65,"end":3355.23},{"id":235,"text":"it's a half space is that what yeah okay so actually this that's a half space in x right so the the set of coefficients of trigonometric polynomials so that at evaluated at 0.6 is less than 1 that's a half space in coefficient space you know what so is this one that's a half space","zh":"它是一个半空间，对吧？是的，所以实际上这就是一个半空间，x空间中的半空间。也就是说，所有三角多项式的系数集合，使得在0.6处的值小于1，这是系数空间中的一个半空间。你知道吗，这个也是半空间","start":3358.4,"end":3384.94},{"id":236,"text":"So it's the intersection of two half-spaces. That's a polyhedron. Matter of fact, the two half-spaces are just shifted, right? And if I ask you, what's the set of x for which, you know, let's say a transpose x, you know, yeah, that's fine. I'll just do this, right, is less than b, right? Note the absolute value here. That's actually a really cool thing. It looks like this, right? It's actually a slab. Here's a, and here's minus a.","zh":"所以这是两个半空间的交集。这是一个多面体。实际上，这两个半空间只是平移过的，对吧？如果你问我，什么样的x满足，比如说，a的转置乘以x，你知道的，这没问题。我只需要这样做，对吧，就是小于b，对吧？注意这里的绝对值。这其实是一个很酷的事情。看起来像这样，对吧？实际上这是一个板状区域。这里有一个a，这里还有一个负的a。","start":3385.62,"end":3412.05}],"notes":["本段讲解了凸集与半空间的交集概念。讲者通过一个具体的例子，即三角多项式的系数集合，说明了如何通过半空间的交集来定义凸集。讲者指出，当一个函数在某个点的值小于1时，它所对应的系数集合是一个半空间。","讲者进一步说明，两个半空间的交集构成一个凸集，即多面体。这种结构在优化问题中非常重要，因为许多凸优化问题的可行域都可以表示为半空间的交集。","讲者还提到，当考虑一个线性不等式约束，如 $ a^T x \u003c b $ 时，其对应的几何结构是一个半空间。如果考虑绝对值形式的约束，如 $ |a^T x| \u003c b $，则对应的几何结构是一个 slab（平板），即两个平行半空间之间的区域。","讲者通过具体的例子，如 $ t = 0.6 $，来说明如何将函数值的约束转化为系数空间中的半空间约束。这种转换是凸优化中的关键步骤，因为它允许将问题转化为线性约束形式。","讲者强调，半空间的交集是凸集的典型例子，而多面体是半空间交集的特例。这种结构在凸优化中具有广泛的应用，例如在支持向量机、线性规划等问题中。","讲者还指出，当考虑多个线性不等式约束时，这些约束的交集构成一个凸集，而每个不等式对应一个半空间。这种结构使得凸优化问题可以被有效地求解。"],"formulas":[{"latex":"a^T x \u003c b","symbols":"a^T x \u003c b 表示一个半空间","explanation":"该公式正确表示了一个半空间，其中向量a与向量x的点积小于标量b。","evidence":"So it's the intersection of two half-spaces. That's a polyhedron. Matter of fact, the two half-spaces are just shifted, right? And if I ask you, what's the set of x for which, you know, let's say a transpose x, you know, yeah, that's fine. I'll just do this, right, is less than b, right? Note the absolute value here. That's actually a really cool thing. It looks like this, right? It's actually a slab. Here's a, and here's minus a."},{"latex":"\\left|a^T x\\right| \u003c b","symbols":"|a^T x| \u003c b 表示一个 slab（平板）","explanation":"该公式正确表示了一个平板，其中向量a与向量x的点积的绝对值小于标量b。","evidence":"So it's the intersection of two half-spaces. That's a polyhedron. Matter of fact, the two half-spaces are just shifted, right? And if I ask you, what's the set of x for which, you know, let's say a transpose x, you know, yeah, that's fine. I'll just do this, right, is less than b, right? Note the absolute value here. That's actually a really cool thing. It looks like this, right? It's actually a slab. Here's a, and here's minus a."}],"uncertainties":["the the set of coefficients of trigonometric polynomials so that at evaluated at 0.6 is less than 1 that's a half space in coefficient space you know what so is this one that's a half space"],"diagram":"none","start":3237.62,"end":3412.05,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均正确，没有发现需要修正的错误。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3237.62,"text":"right? Then what I would do in my head, and you could just start with the average because, you know, if it doesn't hold for the average, anyway, that's, so then you ask yourself if I form the average of those two. Now, technically, I'm forming the average of the coefficients. But when I form the average of the coefficients, I get the average, I literally just average these two functions. And I get this dotted curve here like that. And then we ask ourselves the question, if a function is between plus and minus one over this little boundary,"},{"start":3265.3,"text":"Right? And so is another one. And then I form the average of those two functions. Is it between plus and minus one over that? The answer is, yeah, of course it is. Yeah. So it's convex. There's a derivation of it. But we can also think it's a really cool way to think of S as an infinite intersection. So I'm going to write that down because it's actually kind of interesting. It goes like this. It's the..."},{"start":3294.33,"text":"It's the set of x for which, and then it's, here, I'll just write, it's less than 1 for t in, you know, 0, you know, pi over 3, right? So it looks like that, right? So I'm going to ask you a question. Let's say I need a number between 0 and pi over 3. Here it is, 0.6, okay? So I would like you to tell me..."},{"start":3320.65,"text":"What does this look like? In fact, describe this geometrically. We haven't given a name for it yet. Whoa, whoa, whoa. Very wrong, wrong. There you go. And this is for t equals 0.6. There. OK? Everybody got that? OK? So the question is, what does this look like? It's a subset. It's what? A subset. Which set? A subset, the second one. It's a subset?"},{"start":3358.4,"text":"it's a half space is that what yeah okay so actually this that's a half space in x right so the the set of coefficients of trigonometric polynomials so that at evaluated at 0.6 is less than 1 that's a half space in coefficient space you know what so is this one that's a half space"},{"start":3385.62,"text":"So it's the intersection of two half-spaces. That's a polyhedron. Matter of fact, the two half-spaces are just shifted, right? And if I ask you, what's the set of x for which, you know, let's say a transpose x, you know, yeah, that's fine. I'll just do this, right, is less than b, right? Note the absolute value here. That's actually a really cool thing. It looks like this, right? It's actually a slab. Here's a, and here's minus a."}],"speech_gaps":[],"frame":"../frames/v002/020.webp","frame_time":3249.62},{"title":"凸集与仿射函数","segments":[{"id":237,"text":"You can check me on that. So a really good name for this is it's a slab, right? And it's convex. It's the intersection of two half spaces, so it's convex, right? And so I'm going to think of this thing as, this thing is the intersection over all t in 0 pi over 3 of, I'm going to call this, I'm going to call it slab, s sub t is going to be the slab.","zh":"你可以检查我的说法。所以，给这个一个很好的名字就是它是一个板状区域，对吧？而且它是凸的。它是两个半空间的交集，所以它是凸的，对吧？因此，我会把这个东西看作，这个东西是所有 t 在 0 到 π/3 的交集，我会称它为板状区域，s 下标 t 将会是这个板状区域。","start":3413.23,"end":3440.22},{"id":238,"text":"So this set, whatever it is, it's an intersection of slabs. But it's an infinite intersection of slabs. It's one for every value of t. Everybody got this, right? So over here, what you can see is what these are, what these lines here, is each one corresponds to a t between 0 and pi over 3. And there are going to be two parallel lines here, two parallel lines. And basically, everything in between, that slab,","zh":"所以这个集合，不管它是什么，它是板状区域的交集。但它是一个无限的板状区域交集。它是每个 t 值对应的一个板状区域。大家明白这一点吗？所以在这里，你可以看到这些是什么，这些线对应的是 t 在 0 到 π/3 之间的值。这里会有两条平行线，两条平行线。基本上，中间的所有点，就是这个板状区域，","start":3440.95,"end":3468.54},{"id":239,"text":"Those are the points for which that trigonometric polynomial at that point t is less than 1 in absolute value. Everybody got that? And so basically, if you're in all of these, you're cool. And you can see, actually, it's curved. You know, the set is curved and weird stuff, but that's it. So does this make sense? Okay. Now we get to affine functions.","zh":"这些点满足在该点 t 处的三角多项式绝对值小于 1。大家明白这一点吗？因此，如果你在所有这些区域中，你就没问题了。你可以看到，实际上，这个集合是弯曲的。你知道的，这个集合是弯曲的，有些奇怪的东西，但就是这样。这有没有道理？好的。现在我们进入仿射函数。","start":3469.23,"end":3494.61},{"id":240,"text":"An affine function is basically a linear function plus a constant. By the way, there's a lot of confusion about that. People talk about a linear model and a linear function when they mean affine. It doesn't bother me as long as I know that they know what they're talking about. But it does bother me when I know that they don't know what they're talking about. So you're allowed to confuse affine and linear.","zh":"一个仿射函数基本上是一个线性函数加上一个常数。顺便说一句，关于这一点有很多混淆。人们谈到线性模型和线性函数时，实际上指的是仿射函数。只要我知道他们知道自己在说什么，这不会困扰我。但当我知道他们不知道自己在说什么时，这就会困扰我。因此，你被允许混淆仿射和线性。","start":3496.75,"end":3522.09},{"id":241,"text":"Only if you absolutely for sure know the difference, right? So for a while I'll try to be good and I'll just say affine when I mean affine, right? So it would be like you'd say piecewise linear function, right? You know what you really mean? You really mean piecewise affine. But it sounds weird. People call it piecewise linear and you sound like kind of a jerk if you say things like, oh, I'm sorry, did you mean piecewise affine? And they're like...","zh":"只有当你绝对确定知道它们的区别时才行，对吧？所以一段时间内我会尽量做到好，当我指的是仿射函数时，我就说仿射函数，对吧？比如，你会说分段线性函数，对吧？你知道你真正想表达的是什么吗？你真正想表达的是分段仿射函数。但听起来很奇怪。人们称之为分段线性函数，如果你说像‘哦，抱歉，你是说分段仿射函数吗？’，听起来你像个混蛋。他们就会像……","start":3523.32,"end":3549.02},{"id":242,"text":"Whatever, dude. Right, so that's, okay, fine. So that's an affine function. Okay, so affine functions preserve convex sets. Basically, going forward, that's called the image, and actually pulling back, it's called the inverse image. So what it says is the image, if you have a convex set and I apply an affine function to it,","zh":"随便啦，伙计。对，所以那是，好吧，没问题。所以那是仿射函数。好的，所以仿射函数保持凸集。基本上，向前看，这被称为像，而实际上拉回的话，它被称为逆像。所以它的意思是，像，如果你有一个凸集，而我对它应用一个仿射函数，","start":3549.25,"end":3576.09}],"notes":["本段讲授了凸集的定义和性质，特别是通过两个半空间的交集来构造凸集。教授提到，这种结构被称为slab（板），并且是凸的。接着，教授进一步说明了无限多个slab的交集，每个slab对应一个t值，范围在0到π/3之间。这些slab由两条平行线构成，中间的区域即为slab。教授还指出，这些点满足某个三角多项式在该点t处的绝对值小于1。","教授强调了affine函数的定义，即线性函数加上一个常数。他指出，人们常常混淆affine和linear的概念，但只要清楚两者的区别即可。教授还提到，在实际使用中，人们通常会说piecewise linear，而实际上应称为piecewise affine。","教授进一步说明了affine函数的性质，即affine函数保持凸集的性质。他提到，affine函数的图像称为image，而逆像称为inverse image。教授指出，如果有一个凸集并应用affine函数，其图像仍然是凸的。","教授在讲解过程中，通过具体的例子和语言表达，强调了数学概念的准确性和术语的使用。他指出，虽然术语可能存在混淆，但只要理解其本质区别即可。","教授还提到，affine函数在凸优化中的重要性，特别是在保持凸集的性质方面。他指出，affine函数的图像和逆像都是凸的，这是凸优化中的一个关键性质。","教授在讲解过程中，通过具体的例子和语言表达，强调了数学概念的准确性和术语的使用。他指出，虽然术语可能存在混淆，但只要理解其本质区别即可。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3413.23,"end":3576.09,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3413.23,"text":"You can check me on that. So a really good name for this is it's a slab, right? And it's convex. It's the intersection of two half spaces, so it's convex, right? And so I'm going to think of this thing as, this thing is the intersection over all t in 0 pi over 3 of, I'm going to call this, I'm going to call it slab, s sub t is going to be the slab."},{"start":3440.95,"text":"So this set, whatever it is, it's an intersection of slabs. But it's an infinite intersection of slabs. It's one for every value of t. Everybody got this, right? So over here, what you can see is what these are, what these lines here, is each one corresponds to a t between 0 and pi over 3. And there are going to be two parallel lines here, two parallel lines. And basically, everything in between, that slab,"},{"start":3469.23,"text":"Those are the points for which that trigonometric polynomial at that point t is less than 1 in absolute value. Everybody got that? And so basically, if you're in all of these, you're cool. And you can see, actually, it's curved. You know, the set is curved and weird stuff, but that's it. So does this make sense? Okay. Now we get to affine functions."},{"start":3496.75,"text":"An affine function is basically a linear function plus a constant. By the way, there's a lot of confusion about that. People talk about a linear model and a linear function when they mean affine. It doesn't bother me as long as I know that they know what they're talking about. But it does bother me when I know that they don't know what they're talking about. So you're allowed to confuse affine and linear."},{"start":3523.32,"text":"Only if you absolutely for sure know the difference, right? So for a while I'll try to be good and I'll just say affine when I mean affine, right? So it would be like you'd say piecewise linear function, right? You know what you really mean? You really mean piecewise affine. But it sounds weird. People call it piecewise linear and you sound like kind of a jerk if you say things like, oh, I'm sorry, did you mean piecewise affine? And they're like..."},{"start":3549.25,"text":"Whatever, dude. Right, so that's, okay, fine. So that's an affine function. Okay, so affine functions preserve convex sets. Basically, going forward, that's called the image, and actually pulling back, it's called the inverse image. So what it says is the image, if you have a convex set and I apply an affine function to it,"}],"speech_gaps":[],"frame":"../frames/v002/021.webp","frame_time":3425.23},{"title":"逆像集与凸集的保持性","segments":[{"id":243,"text":"then, and I look at all, which means I apply the affine function to every element in this set, then that set is going to be convex, okay? And these are just, you know, straightforward to show. So is the inverse image. Now here, I have to talk about this for a minute. Everybody knows f is a function, and f inverse has a definition, right? So the standard definition is that that's the inverse function. And so you wouldn't write f inverse unless f were invertible.","zh":"那么，我查看所有元素，这意味着我对这个集合中的每一个元素应用仿射函数，那么这个集合就会是凸集，对吧？这些只是很直接的证明。逆像集也是如此。现在，我需要花一点时间来讨论这个问题。大家都知道 f 是一个函数，而 f 的逆也有定义，对吧？所以标准的定义是，这就是逆函数。因此，除非 f 是可逆的，否则你不会写 f 的逆。","start":3577.5,"end":3606.38},{"id":244,"text":"But there's another completely standard use in mathematics of F inverse.","zh":"但在数学中，F 的逆还有另一种完全标准的用法。","start":3607.31,"end":3612.47},{"id":245,"text":"And it is not a function, for sure.","zh":"它肯定不是一个函数。","start":3612.93,"end":3615.69},{"id":246,"text":"It means this.","zh":"它的意思是这个。","start":3615.87,"end":3616.83},{"id":247,"text":"It's called the inverse image.","zh":"它被称为逆像集。","start":3617.05,"end":3618.41},{"id":248,"text":"That's the way you say it.","zh":"这就是它的说法方式。","start":3618.61,"end":3619.59},{"id":249,"text":"And it's the set.","zh":"它是一个集合。","start":3619.83,"end":3621.51},{"id":250,"text":"So F inverse of a set is all of the things that get mapped into C.","zh":"因此，F 的逆像集是所有被映射到 C 中的元素。","start":3621.75,"end":3627.79},{"id":251,"text":"So that's the inverse image.","zh":"所以这就是逆像集。","start":3628.13,"end":3629.89},{"id":252,"text":"Okay?","zh":"明白了？","start":3630.79,"end":3630.83},{"id":253,"text":"And it's absolutely completely standard.","zh":"这完全是标准的定义。","start":3630.93,"end":3633.51},{"id":254,"text":"standard. By the way, if f is an invertible function, then there's a connection between","zh":"顺便说一句，如果 f 是一个可逆函数，那么这种记号与其他记号之间存在联系。但这是全世界通用的标准定义。任何使用数学的人都会知道这一点。","start":3633.51,"end":3641.21},{"id":255,"text":"this notation and the other one. But this is the absolute standard worldwide. Anybody","zh":"所以这就是逆像集。这两种操作都保持凸性，这里举个例子，比如某种投影，我就可以回到这里，并说这里有一个，这里有一个","start":3641.21,"end":3648.31},{"id":256,"text":"using math would know this. So that's the inverse image. Both of these operations preserve","zh":"凸性保持的例子，比如某种投影，我就可以回到这里，并说这里有一个，这里有一个","start":3649.09,"end":3654.73},{"id":257,"text":"convexity right so here's an example would be like you know some kind of","zh":"凸性，所以这里有一个例子，比如某种类型的","start":3654.73,"end":3662.71},{"id":258,"text":"projection right so I could go back here and I could say here's a here's a","zh":"投影，所以我可以回到这里，并说这里有一个，这里有一个","start":3662.71,"end":3669.85},{"id":259,"text":"beautiful one let's have trigonometric polynomials of degree 5 that satisfy","zh":"漂亮的一个例子，让我们考虑满足条件的五次三角多项式","start":3669.85,"end":3676.81},{"id":260,"text":"this here's my linear mapping I will simply take the first two coefficients","zh":"这里是我的线性映射，我将简单地取前两个系数","start":3676.81,"end":3682.83},{"id":261,"text":"coefficients. So I take x1 to x5, and I return x1, x2. That's obviously a linear mapping,","zh":"系数。所以我将x1到x5映射到x1, x2。这显然是一个线性映射，","start":3682.83,"end":3687.67},{"id":262,"text":"right? And now I'll look at the inverse image of that convex set under that mapping, and then I'll","zh":"对吧？现在我将考虑该凸集在该映射下的逆像，并且我会","start":3688.23,"end":3694.37},{"id":263,"text":"say precisely what it is. It is the set, and I'll make it sound all fancy, but, you know,","zh":"精确地说明它是什么。它是集合，我会把它说得听起来很花哨，但你知道的，","start":3694.37,"end":3699.61},{"id":264,"text":"but it's not. I would say it's the set of all first two coefficients of a trigonometric polynomial","zh":"但其实并不是。我会说它是所有可以扩展为满足该条件的三角多项式的前两个系数的集合","start":3699.65,"end":3705.19},{"id":265,"text":"that can be completed to a trigonometric polynomial that satisfies this.","zh":"的集合。","start":3706.01,"end":3711.71},{"id":266,"text":"Everybody get that? I mean, it's getting weird and esoteric now, but still. Don't worry.","zh":"大家明白了吗？我的意思是，现在变得奇怪和深奥了，但还是可以理解的。别担心。","start":3712.85,"end":3716.75},{"id":267,"text":"Okay, so, okay, so that's, these are, these are, those types of things. And now we're going to get good to one weird one, and it's something you didn't know. And, or, sorry, you didn't know and isn't obvious. And so this is it. Good. Because I hate, I hate the thought of having a whole lecture where everything is kind of like, duh, right? Or, well, I didn't say, you know, it's, this is basic, right? Okay, here it is. This is interesting. So,","zh":"好的，所以，这些就是，这些就是，那些类型的东西。现在我们要讲一个很奇怪的，而且是你不知道的。或者，抱歉，是你不知道而且不明显的。所以这就是它。很好。因为我不喜欢，我讨厌有一整节课，里面的内容都是那种，嗯，很明显，对吧？或者，好吧，我没说，你知道的，这很基础，对吧？好的，这里它来了。这很有趣。所以，","start":3718.49,"end":3744.97}],"notes":["本段主要讲解了逆像集的概念及其与凸集保持性的关系。教授首先指出，当对一个凸集应用仿射函数时，结果仍然是凸集。接着，他解释了逆像集的定义，即函数f将集合C映射到的元素的集合。教授强调，逆像集与逆函数不同，它是一个集合，而不是函数。此外，教授还提到，如果函数f是可逆的，那么逆像集的定义与逆函数之间存在联系，但逆像集是数学中广泛使用的标准概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3577.5,"end":3744.97,"asr_flags":[252],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":3577.5,"text":"then, and I look at all, which means I apply the affine function to every element in this set, then that set is going to be convex, okay? And these are just, you know, straightforward to show. So is the inverse image. Now here, I have to talk about this for a minute. Everybody knows f is a function, and f inverse has a definition, right? So the standard definition is that that's the inverse function. And so you wouldn't write f inverse unless f were invertible."},{"start":3607.31,"text":"But there's another completely standard use in mathematics of F inverse."},{"start":3612.93,"text":"And it is not a function, for sure."},{"start":3615.87,"text":"It means this."},{"start":3617.05,"text":"It's called the inverse image."},{"start":3618.61,"text":"That's the way you say it."},{"start":3619.83,"text":"And it's the set."},{"start":3621.75,"text":"So F inverse of a set is all of the things that get mapped into C."},{"start":3628.13,"text":"So that's the inverse image."},{"start":3630.79,"text":"Okay?"},{"start":3630.93,"text":"And it's absolutely completely standard."},{"start":3633.51,"text":"standard. By the way, if f is an invertible function, then there's a connection between"},{"start":3641.21,"text":"this notation and the other one. But this is the absolute standard worldwide. Anybody"},{"start":3649.09,"text":"using math would know this. So that's the inverse image. Both of these operations preserve"},{"start":3654.73,"text":"convexity right so here's an example would be like you know some kind of"},{"start":3662.71,"text":"projection right so I could go back here and I could say here's a here's a"},{"start":3669.85,"text":"beautiful one let's have trigonometric polynomials of degree 5 that satisfy"},{"start":3676.81,"text":"this here's my linear mapping I will simply take the first two coefficients"},{"start":3682.83,"text":"coefficients. So I take x1 to x5, and I return x1, x2. That's obviously a linear mapping,"},{"start":3688.23,"text":"right? And now I'll look at the inverse image of that convex set under that mapping, and then I'll"},{"start":3694.37,"text":"say precisely what it is. It is the set, and I'll make it sound all fancy, but, you know,"},{"start":3699.65,"text":"but it's not. I would say it's the set of all first two coefficients of a trigonometric polynomial"},{"start":3706.01,"text":"that can be completed to a trigonometric polynomial that satisfies this."},{"start":3712.85,"text":"Everybody get that? I mean, it's getting weird and esoteric now, but still. Don't worry."},{"start":3718.49,"text":"Okay, so, okay, so that's, these are, these are, those types of things. And now we're going to get good to one weird one, and it's something you didn't know. And, or, sorry, you didn't know and isn't obvious. And so this is it. Good. Because I hate, I hate the thought of having a whole lecture where everything is kind of like, duh, right? Or, well, I didn't say, you know, it's, this is basic, right? Okay, here it is. This is interesting. So,"}],"speech_gaps":[],"frame":"../frames/v002/022.webp","frame_time":3589.5},{"title":"透视函数与线性分式函数","segments":[{"id":268,"text":"The perspective function takes an n plus 1 vector, which we break up into a vector, an n vector, and a scalar, which we call x and t, and it simply divides by the last one, last entry. By the way, if you work in vision or...","zh":"透视函数接受一个n加1维的向量，我们将它分解为一个向量、一个n维向量和一个标量，我们称之为x和t，它只是将该向量除以最后一个元素。顺便说一句，如果你从事视觉领域或...","start":3745.64,"end":3765.79},{"id":269,"text":"Some people do crazy affine transformations. They do weird transformations this way. Like, I don't know, some people who do robotics do that. Anyway, so you might be familiar with this. Okay, so this is called a perspective function. It is, of course, not linear, not remotely. Well, I mean, if you fix t, it's linear in x. But it is definitely not linear in t, okay? So that's a perspective function.","zh":"有些人会进行疯狂的仿射变换。他们以这种方式进行奇怪的变换。比如，我不清楚，有些从事机器人领域的人会这么做。总之，你可能已经熟悉这个概念了。好的，这个被称为透视函数。当然，它不是线性的，远非如此。我的意思是，如果你固定t，它在x上是线性的。但它在t上绝对不是线性的，对吧？所以这就是一个透视函数。","start":3766.43,"end":3795.22},{"id":270,"text":"And it turns out images and inverse images of convex sets are preserved under perspective functions. And that is not obvious, I think, remotely. And here's a good example. So if I combine this with a linear mapping, I get a so-called linear fractional function. So that's an affine. No, you should call it affine fractional, but whatever. So here, that's an affine function, and you divide.","zh":"事实上，凸集的像和原像在透视函数下被保持。这并不明显，我想。这里有一个很好的例子。所以如果我们把这个与一个线性映射结合起来，我们就得到了所谓的线性分式函数。所以这是一个仿射函数。不，你应该称之为仿射分式函数，但不管怎样。在这里，这是一个仿射函数，然后进行除法。","start":3795.9,"end":3825.3},{"id":271,"text":"by the way our our rule here is the domain is this thing's going to be positive right so that's a linear fractional function they come up in a ton of applications they come up actually this is things like if you're conditioning in probability","zh":"顺便说一下，我们这里的规则是定义域是这个东西的正数，因此这是一个线性分式函数，它们在许多应用中都会出现。实际上，这类似于在概率中进行条件处理的情况。","start":3825.99,"end":3845.01},{"id":272,"text":"Conditioning is actually nothing but a linear fractional function on a probability mass function. For example, it comes up in vision all the time. For example, if I see a 3D thing and I want to know what is the image on my retina, let's pretend my retina is flat. If I say, what is it? The answer is, it's a linear fractional function.","zh":"条件处理实际上就是对概率质量函数的一个线性分式函数。例如，它在视觉领域经常出现。例如，当我看到一个三维物体，并想知道它在我的视网膜上的图像是什么时，假设我的视网膜是平坦的。如果我说，这是什么？答案是，它是一个线性分式函数。","start":3847.83,"end":3872.83},{"id":273,"text":"that's what it is right and you know this right like because look if i if i hold this like this and i look at it um i mean you kind of know what what's happening here right i mean let's make it this is good enough here i'll i'll uh","zh":"这就是它的本质，对吧？你明白这一点，对吧？比如，如果我这样拿着它，然后看它，嗯，我的意思是，你大概知道这里发生了什么，对吧？我的意思是，这里已经足够好了，我会，我会，呃","start":3873.4,"end":3887.3},{"id":274,"text":"Yeah, so obviously this is closer, so that's actually kind of bigger. Now, our brains have evolved to handle that, and that's a cue that this is closer than that. But whatever the image is, like in a photograph or on my retina, it's definitely not a linear mapping, right? So that's a linear fractional function. So if you want to believe this, it's in the book. You could read it. It's like, you know, whatever, half a page to prove it. It's not hard.","zh":"是的，所以显然这个更接近，所以实际上它更大一些。我们的大脑进化出了处理这种感知的能力，这也是一个提示，说明这个比那个更近。但无论图像是什么，比如在照片中或在我的视网膜上，它肯定不是线性映射，对吧？所以这就是一个线性分式函数。如果你想相信这一点，书里有解释。你可以去读一读。它就像，你知道的，只需要半页纸来证明。并不难。","start":3888.25,"end":3914.91}],"notes":["本段讲解了透视函数的定义及其性质，指出透视函数不是线性的，但当固定t时，它在x上是线性的。同时，它还提到透视函数保持凸集的像和原像，这是非显而易见的性质。","接着，讲者介绍了线性分式函数的概念，它是由透视函数与线性映射结合而成。线性分式函数在概率论中出现，例如在条件概率中，它被用来描述图像在视网膜上的投影。","讲者通过一个例子说明，当观察三维物体时，视网膜上的图像实际上是线性分式函数的结果，而不是线性映射。这表明人类大脑已经进化出处理这种非线性映射的能力。","最后，讲者提到线性分式函数在许多应用中出现，如计算机视觉和概率论，并建议读者查阅教材以获得更详细的证明。","讲者强调，虽然线性分式函数的定义和性质可能看起来复杂，但其证明并不困难，只需半页纸即可完成。","讲者还提到，线性分式函数在图像处理中非常重要，因为它能够准确描述物体在不同距离下的投影效果。"],"formulas":[],"uncertainties":["by the way our our rule here is the domain is this thing's going to be positive right so that's a linear fractional function they come up in a ton of applications they come up actually this is things like if you're conditioning in probability","that's what it is right and you know this right like because look if i if i hold this like this and i look at it um i mean you kind of know what what's happening here right i mean let's make it this is good enough here i'll i'll uh"],"diagram":"none","start":3745.64,"end":3914.91,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3745.64,"text":"The perspective function takes an n plus 1 vector, which we break up into a vector, an n vector, and a scalar, which we call x and t, and it simply divides by the last one, last entry. By the way, if you work in vision or..."},{"start":3766.43,"text":"Some people do crazy affine transformations. They do weird transformations this way. Like, I don't know, some people who do robotics do that. Anyway, so you might be familiar with this. Okay, so this is called a perspective function. It is, of course, not linear, not remotely. Well, I mean, if you fix t, it's linear in x. But it is definitely not linear in t, okay? So that's a perspective function."},{"start":3795.9,"text":"And it turns out images and inverse images of convex sets are preserved under perspective functions. And that is not obvious, I think, remotely. And here's a good example. So if I combine this with a linear mapping, I get a so-called linear fractional function. So that's an affine. No, you should call it affine fractional, but whatever. So here, that's an affin
