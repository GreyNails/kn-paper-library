}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">02 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 2 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v002","title":"02 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 2","course":"凸优化","pages":[{"title":"课程介绍与凸优化历史背景","segments":[{"id":0,"text":"I'm just going to finish up one quick thing from this intro, and then we're going to launch in. Now, just to remind you, I warned you last time, but I'll do it again right now. We're going in deep today and next week. So it's just going to be math, and it's going to be disconnected from anything. If you don't have the feeling..."},{"id":1,"text":"why did all these people recommend this class sometime like next week maybe even today maybe while you're doing homework one which by the way is assigned then I mean it that's completely normal right so what I do promise you though that everything we see here you will see in the context of applications later in the course and actually so that means something about how you might how I would suggest that you learn the material so"},{"id":2,"text":"You can't just, I mean, I don't know. It depends on, I mean, okay, I'll just speak for myself. It's hard for me just to like hear some math and then think about it and go, okay, cool, I'm done. I have to see how people use it and stuff like that. So what I would suggest is you just get the basic ideas right now. Big picture. I mean, you'll do some homework. That'll help. There'll be sections, all that sort of stuff. Then what's going to happen is you don't have to have perfect mastery of the material we're going to cover in the next two weeks."},{"id":3,"text":"You don't have to have that before we move on. If you get like 70% mastery, you're cool. That's fine. And the reason is what's going to happen is after that, then we're going to look at applications and we'll be doing statistics and we'll be doing control and signal. We're doing all sorts of stuff. We'll use it and you'll look up and you go, okay, now I know what the conjugate is. Okay, or something like that. But for right now, it's just going to be weird abstract. That's just what it is. Okay, so."},{"id":4,"text":"All right. OK, so we'll go ahead and start. Actually, what I did want to do is say just a little bit about the brief history of convex optimism, just to give some historical background. So the first thing is that as a mathematical field, it's at least 120 years old, right? So people were writing down inequalities that we would now say, hey, that's convex. That's convexity. They were writing this down in the late 19th century."},{"id":5,"text":"That was codified right around the turn of the last century. So, well, I guess whatever, a century and 1.2 centuries ago. So that was codified and someone said, look, we keep seeing the same stupid inequality all the time. Let's give it a name. And that's when the name became basically convexity. So as a mathematical field, it was really already quite well developed in the 20s, 50s. By the 70s, I would just say it was done."},{"id":6,"text":"There was a beautiful book written on convex analysis. If you do math and are interested in math, you could read it. It's a beautiful book. And that's just it. Have people done stuff since then? Yeah, sure. But basically, that was it. It was just clean, wrapped up. I mean, it doesn't say anything about what you do with it."}],"notes":["本段主要介绍了课程的结构和学习建议。讲师强调，虽然课程内容会深入且抽象，但后续会结合应用来讲解，因此学生不需要一开始就完全掌握所有内容。建议学生先理解基本概念，通过作业和课堂内容逐步掌握，之后在应用部分再加深理解。","讲师提到，课程内容在接下来的两周会非常密集，但不需要学生在开始前就完全掌握。70%的掌握程度就足够，因为后续会通过应用来加深理解。这表明课程设计注重逐步深入，而不是一开始就要求学生掌握所有细节。","课程内容将涉及统计、控制和信号处理等多个领域，这些应用会帮助学生理解抽象的凸优化概念。例如，学生会在应用中看到共轭函数等概念，从而加深对理论的理解。","讲师还简要回顾了凸优化的历史背景，指出该领域至少有120年的历史，从19世纪末开始，人们就开始研究凸性相关的不等式。20世纪初，这一领域被系统化，形成了凸分析的理论基础。","在20世纪20年代和50年代，凸优化理论已经相当成熟，到了70年代，该领域被认为已经基本完成。这表明凸优化是一个已经发展成熟的数学领域，但仍在不断扩展和应用。","尽管凸优化理论已经非常成熟，但讲师指出，该领域仍在不断发展，有新的研究和应用出现。这表明课程不仅教授经典理论，还关注最新的发展和应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.3,"end":183.77,"asr_flags":[],"raw_segments":[{"start":5.3,"text":"I'm just going to finish up one quick thing from this intro, and then we're going to launch in. Now, just to remind you, I warned you last time, but I'll do it again right now. We're going in deep today and next week. So it's just going to be math, and it's going to be disconnected from anything. If you don't have the feeling..."},{"start":28.11,"text":"why did all these people recommend this class sometime like next week maybe even today maybe while you're doing homework one which by the way is assigned then I mean it that's completely normal right so what I do promise you though that everything we see here you will see in the context of applications later in the course and actually so that means something about how you might how I would suggest that you learn the material so"},{"start":56.34,"text":"You can't just, I mean, I don't know. It depends on, I mean, okay, I'll just speak for myself. It's hard for me just to like hear some math and then think about it and go, okay, cool, I'm done. I have to see how people use it and stuff like that. So what I would suggest is you just get the basic ideas right now. Big picture. I mean, you'll do some homework. That'll help. There'll be sections, all that sort of stuff. Then what's going to happen is you don't have to have perfect mastery of the material we're going to cover in the next two weeks."},{"start":84.96,"text":"You don't have to have that before we move on. If you get like 70% mastery, you're cool. That's fine. And the reason is what's going to happen is after that, then we're going to look at applications and we'll be doing statistics and we'll be doing control and signal. We're doing all sorts of stuff. We'll use it and you'll look up and you go, okay, now I know what the conjugate is. Okay, or something like that. But for right now, it's just going to be weird abstract. That's just what it is. Okay, so."},{"start":111.34,"text":"All right. OK, so we'll go ahead and start. Actually, what I did want to do is say just a little bit about the brief history of convex optimism, just to give some historical background. So the first thing is that as a mathematical field, it's at least 120 years old, right? So people were writing down inequalities that we would now say, hey, that's convex. That's convexity. They were writing this down in the late 19th century."},{"start":138.32,"text":"That was codified right around the turn of the last century. So, well, I guess whatever, a century and 1.2 centuries ago. So that was codified and someone said, look, we keep seeing the same stupid inequality all the time. Let's give it a name. And that's when the name became basically convexity. So as a mathematical field, it was really already quite well developed in the 20s, 50s. By the 70s, I would just say it was done."},{"start":165.39,"text":"There was a beautiful book written on convex analysis. If you do math and are interested in math, you could read it. It's a beautiful book. And that's just it. Have people done stuff since then? Yeah, sure. But basically, that was it. It was just clean, wrapped up. I mean, it doesn't say anything about what you do with it."}],"speech_gaps":[],"frame":"../frames/v002/001.webp","frame_time":17.3},{"title":"凸优化的历史与应用","segments":[{"id":7,"text":"How do you apply it? How do you actually do algorithmic things with it? Like, how do you actually solve these problems? But just as a mathematical field, it's super, it's interesting. And I'd even encourage you to poke through that book if you have that proclivity, right? The math proclivity, right? I would actually suggest looking at it. Okay. So, you know, when it really takes off, I mean, and this is not, you know, this is kind of, you know, roughly somewhere around, you know, the 1940s. Now,"},{"id":8,"text":"This is it's not accidental that that coincides with the development basically of the computer. Right. So, you know, because I mean, to me, the exciting part is we can actually do all this. Like everything in this class is actionable."},{"id":9,"text":"And that's very different from just taking a math class, right? Where it's all super interesting, but who knows what fraction of it is actionable? Everything we do is actionable. So for us, the real interesting history starts around then, the development of computers, right? And right around then, people were developing the simplex algorithm. That's a very famous algorithm for linear programming. There's a strong Stanford connection. Actually, one of the people who popularized that was George Danzig. He was a professor here."},{"id":10,"text":"So there was a big burst of work. I will refer to it a whole bunch of times. And honestly, a lot of the work that goes beyond linear programming occurred in the Soviet Union, in the 60s through basically through the 70s and 80s, right?"},{"id":11,"text":"So there was a lot of work there. We'll get to some of that later. And of course, since about the 2000s, a lot of it was picked up by people in statistics and machine learning and things like that. So there was a lot of stuff done after that. I think the applications are actually sort of interesting. So the applications go back to the 1940s and 50s. We'll actually look at some of them, which is actually kind of fun because they're just historical examples of things."},{"id":12,"text":"But actually, already in the 1950s, people in aerospace were designing extremely light structures, the lightest possible structure that would handle the required loads, dynamic and static loads. So that was already, and it should be totally obvious, that's unbelievably important in aerospace, right? Because everything you have in your frame or whatever just takes away from your payload, period."},{"id":13,"text":"So that's an example, very early, of people doing this. In electrical engineering, people were designing FIR filters, again, in the 60s. So you would find little bits and pieces, but I would say that the floodgates kind of opened."}],"notes":["本段介绍了凸优化的发展历史，指出其在计算机发展后才真正开始广泛应用。讲者提到线性规划的单纯形算法在1940年代左右发展，与计算机的发展时间吻合，强调凸优化的实用性。","讲者提到苏联在1960年代至1980年代期间在凸优化领域做出了大量贡献，这些工作超出了线性规划的范畴。随后，自2000年代起，统计学和机器学习领域的人士开始广泛采用这些方法。","讲者举了航空航天和电气工程中的实际应用例子，如1950年代航空航天中设计最轻的结构，以及1960年代电气工程中设计FIR滤波器，说明凸优化在实际工程中的重要性。","讲者强调凸优化与传统数学课程的不同之处在于其所有内容都是可操作的，即可以实际应用于解决具体问题，这与传统数学课程中许多理论无法直接应用的情况形成对比。","讲者指出，凸优化的应用历史可以追溯到1940年代和1950年代，例如航空航天和电气工程中的实际案例，这些案例展示了凸优化在工程实践中的重要性。","讲者提到，尽管凸优化在早期发展缓慢，但随着计算机的发展，其应用逐渐扩展，并在2000年代后被统计学和机器学习领域广泛采用，说明其在现代技术中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":184.28,"end":347.38,"asr_flags":[],"raw_segments":[{"start":184.28,"text":"How do you apply it? How do you actually do algorithmic things with it? Like, how do you actually solve these problems? But just as a mathematical field, it's super, it's interesting. And I'd even encourage you to poke through that book if you have that proclivity, right? The math proclivity, right? I would actually suggest looking at it. Okay. So, you know, when it really takes off, I mean, and this is not, you know, this is kind of, you know, roughly somewhere around, you know, the 1940s. Now,"},{"start":213.76,"text":"This is it's not accidental that that coincides with the development basically of the computer. Right. So, you know, because I mean, to me, the exciting part is we can actually do all this. Like everything in this class is actionable."},{"start":226.96,"text":"And that's very different from just taking a math class, right? Where it's all super interesting, but who knows what fraction of it is actionable? Everything we do is actionable. So for us, the real interesting history starts around then, the development of computers, right? And right around then, people were developing the simplex algorithm. That's a very famous algorithm for linear programming. There's a strong Stanford connection. Actually, one of the people who popularized that was George Danzig. He was a professor here."},{"start":256.69,"text":"So that's kind of the early part of it. Now, there was a big burst of work. I will refer to it a whole bunch of times. And honestly, a lot of the work that goes beyond linear programming occurred in the Soviet Union, in the 60s through basically through the 70s and 80s, right?"},{"start":277.11,"text":"So there was a lot of work there. We'll get to some of that later. And of course, since about the 2000s, a lot of it was picked up by people in statistics and machine learning and things like that. So there was a lot of stuff done after that. I think the applications are actually sort of interesting. So the applications go back to the 1940s and 50s. We'll actually look at some of them, which is actually kind of fun because they're just historical examples of things."},{"start":304.38,"text":"But actually, already in the 1950s, people in aerospace were designing extremely light structures, the lightest possible structure that would handle the required loads, dynamic and static loads. So that was already, and it should be totally obvious, that's unbelievably important in aerospace, right? Because everything you have in your frame or whatever just takes away from your payload, period."},{"start":331.84,"text":"So that's an example, very early, of people doing this. In electrical engineering, people were designing FIR filters, again, in the 60s. So you would find little bits and pieces, but I would say that the floodgates kind of opened."}],"speech_gaps":[],"frame":"../frames/v002/002.webp","frame_time":196.28},{"title":"凸优化课程概述与基本概念","segments":[{"id":14,"text":"the late 90s early 2000s right and that there was a lot of stuff in control and signal processing communications that that that sort of happened right around that time right and people figured out that if you're trying to allocate power to a bunch of wireless systems then a lot of these problems they're just convex okay and so those are and those are actually those methods are actually kind of used okay and like I said a lot of stuff was was done"},{"id":15,"text":"in maybe, let's see, maybe the heyday was about 10 years ago when people were looking at models and statistics and machine learning that involved convex optimization problems. We'll look at a lot of those. These would be like things like logistic regression, support vector machines and things like that, right? So, and that's a good, I mean."},{"id":16,"text":"Good news, people worked on various methods that we're not going to cover, sub-gradient type methods, right? So we're not going to cover those methods. And then those turned out to be the methods that are actually the ones used today on non-convex things like training neural networks. Okay, so there's your big picture. Okay, so at this point, unless there's questions, we're jumping in and this is the deep end. So this is not..."},{"id":17,"text":"We're not in the, we're just going to jump right in. Okay. So the, and again, to remind you what the whole point of all this is, is there's not a class about math."},{"id":18,"text":"It's a class about actually applying these methods. And so when you apply these methods, you arrive at a startup or an internship or something like that, or your research, and there's a practical problem you want to solve. I mean, that's the setting we're talking about here. And then you have to sort through and try to figure out, I mean, if it's convex. I mean, which parts of it are convex? These kinds of things."},{"id":19,"text":"Absolutely critical is to be able to recognize things like a convex set and a convex function. We'll talk about convex sets today, convex functions next week. So that's the actual practical skill that we are after. I mean, it is interesting theory, and it's interesting as theory, and it's just fine, but the point is that's the skill we're after."},{"id":20,"text":"Okay, so what we'll do is we're gonna I'm gonna start with like super basic and it's gonna accelerate after that So let's start go back way to the beginning. So at the beginning it goes like this"},{"id":21,"text":"I just have two vectors, x1 and x2, and n-dimensional space or something like that. And what I do is let's suppose that they are not equal to each other, and I'm going to form this specific linear combination here. So that linear combination has got two coefficients, theta and 1 minus theta. They're sort of interesting because they add up to 1. So that's critical."}],"notes":["本段介绍了凸优化在控制、信号处理和通信领域的应用历史，特别是在90年代末到2000年代初，人们发现许多无线系统功率分配问题本质上是凸优化问题，这些方法被广泛应用于机器学习领域，如逻辑回归和支持向量机。"],"formulas":[],"uncertainties":[],"diagram":"none","start":347.93,"end":519.66,"asr_flags":[],"raw_segments":[{"start":347.93,"text":"the late 90s early 2000s right and that there was a lot of stuff in control and signal processing communications that that that sort of happened right around that time right and people figured out that if you're trying to allocate power to a bunch of wireless systems then a lot of these problems they're just convex okay and so those are and those are actually those methods are actually kind of used okay and like I said a lot of stuff was was done"},{"start":375.58,"text":"in maybe, let's see, maybe the heyday was about 10 years ago when people were looking at models and statistics and machine learning that involved convex optimization problems. We'll look at a lot of those. These would be like things like logistic regression, support vector machines and things like that, right? So, and that's a good, I mean."},{"start":394.39,"text":"Good news, people worked on various methods that we're not going to cover, sub-gradient type methods, right? So we're not going to cover those methods. And then those turned out to be the methods that are actually the ones used today on non-convex things like training neural networks. Okay, so there's your big picture. Okay, so at this point, unless there's questions, we're jumping in and this is the deep end. So this is not..."},{"start":421.96,"text":"We're not in the, we're just going to jump right in. Okay. So the, and again, to remind you what the whole point of all this is, is there's not a class about math."},{"start":434.49,"text":"It's a class about actually applying these methods. And so when you apply these methods, you arrive at a startup or an internship or something like that, or your research, and there's a practical problem you want to solve. I mean, that's the setting we're talking about here. And then you have to sort through and try to figure out, I mean, if it's convex. I mean, which parts of it are convex? These kinds of things."},{"start":461.27,"text":"Absolutely critical is to be able to recognize things like a convex set and a convex function. We'll talk about convex sets today, convex functions next week. So that's the actual practical skill that we are after. I mean, it is interesting theory, and it's interesting as theory, and it's just fine, but the point is that's the skill we're after."},{"start":483.29,"text":"Okay, so what we'll do is we're gonna I'm gonna start with like super basic and it's gonna accelerate after that So let's start go back way to the beginning. So at the beginning it goes like this"},{"start":495.76,"text":"I just have two vectors, x1 and x2, and n-dimensional space or something like that. And what I do is let's suppose that they are not equal to each other, and I'm going to form this specific linear combination here. So that linear combination has got two coefficients, theta and 1 minus theta. They're sort of interesting because they add up to 1. So that's critical."}],"speech_gaps":[],"frame":"../frames/v002/003.webp","frame_time":359.93},{"title":"仿射组合与仿射集","segments":[{"id":22,"text":"What, geometrically, what this is, is this, as you vary theta, this sketches out the line in this space that passes through x1 and x2. So that's what that is. In fact, you would call this a parameterization of the line. It's parameterized by theta. Right, so theta equals zero means that you're at x2. Theta equals one means you're at x1. Theta equals a half means you're at kind of the midpoint between x1 and x2."},{"id":23,"text":"Okay, so this is the, again, it's, you know, it's all just to go back to the beginning and make sure everybody's on the same page. Okay, so this is called an affine combination. So a linear combination is, well, you know what a linear combination is. It's a sum of vectors multiplied by some coefficients, right? But when those coefficients add up to one, that's special, and that's called an affine combination. Okay, so that's an affine combination."},{"id":24,"text":"So this is, you know, the simplest affine combination you could possibly have. Okay. All right. Now, an affine set is then defined to be a set. It contains the line through any two distinct points in the set. In other words, I mean, you might say informally something like this. It's closed under forming a line or something like that. So in other words, if two points are in the set, the entire line is in the set."},{"id":25,"text":"Okay, so that's an affine set. And you'll see lots of examples, but a famous one would be this. The solution set of a set of linear inequalities. So the set of x for which ax equals b is going to be an affine set. And by the way, you can check, I mean, a lot of 进一步说明了范数锥的概念，指出范数锥是将向量和其范数的标量组合起来的集合。范数锥的定义是，对于向量x和标量t，满足范数(x) \u003c t的点构成的集合。教授强调，范数锥需要满足锥的性质，即可以将点乘以任意正数后仍属于该集合。","教授提到，范数锥是课程中的一个重要主题，经常在处理n维集合时出现。他以函数图像为例，说明了如何将函数的定义域和值域组合成更高维的集合，如将R²上的函数图像视为R³中的点集。","教授指出，范数锥的定义需要验证其是否满足锥的性质，即对于任意正数λ，点(λx, λt)仍属于该集合。他以乘以7为例，说明了范数和标量t同时扩大7倍，因此满足锥的性质。","教授强调了数学表达的严谨性，指出L-无穷范数球的表达方式应使用标准的数学术语，而不是方言。这有助于确保所有数学表达的清晰性和一致性。","教授通过具体的例子，如无穷范数和范数锥，展示了如何在凸优化中使用不同的范数来定义集合。这些例子帮助学生理解范数在不同场景下的应用和意义。"],"formulas":[{"latex":"\\|x\\|_\\infty = \\max(x_1, x_2)","symbols":"无穷范数","explanation":"正确地定义了无穷范数，表示向量中最大绝对值的元素。","evidence":"This is the max of x1 and x2, right?"},{"latex":"\\|x\\| \u003c t","symbols":"范数锥定义","explanation":"正确地定义了范数锥，表示所有满足范数小于某个标量t的向量集合。","evidence":"f of x1, x2, and that's the graph, right? So this is going to be a common thing. So here, the set of xt, t is a scalar, x is a vector, for which the norm of x is less than t, that's actually a norm cone. By the way, you have to show that, right? If it's a cone, it says I can multiply the pair xt by 7, for example, and it's still in the cone. And that would be true here, because if I multiply x by 7, the norm goes up by 7, but so does t, so everything's cool."}],"uncertainties":["188中的'.11'可能是误识别，实际应为'11'或'1'。"],"diagram":"none","start":2059.38,"end":2239.23,"asr_flags":[],"math_clarifications":["公式中的符号和定义符合数学规范，无需进一步修正。"],"raw_segments":[{"start":2059.38,"text":"mathematical notation. A norm is just a norm. It's just, it's any function that satisfies these"},{"start":2064.88,"text":"three things, period, right? And if we want to indicate a particular norm, we'll put a mnemonic"},{"start":2072.02,"text":"or some kind of symbol below it to tell you what norm it is, right?"},{"start":2076.6,"text":"So, yeah, so we'll do stuff like that."},{"start":2080.08,"text":"And there'll be some interesting ones, right?"},{"start":2084.68,"text":"Okay, let's see."},{"start":2086.64,"text":"We could look at a norm ball."},{"start":2090.06,"text":"That's the same thing here, except that instead of using a Euclidean norm,"},{"start":2094.04,"text":"you might use a, you know, a different norm, right?"},{"start":2096.68,"text":"So, for example, I'll just write down some of these things."},{"start":2100.04,"text":"the infinity norm of, I'll just do a two vector, right?"},{"start":2105.16,"text":"This is the max of x1 and x2, right?"},{"start":2110.96,"text":"Looks like that, okay?"},{"start":2113.22,"text":"And so..."},{"start":2116.54,"text":"Euclidean, so if I write, let's see if I have some, did I introduce a notation for that? No, I didn't. That's fine. Okay, so if I write down this, right, the set of x, right, for which, you know, x minus here, you know, 1, 1, you know, infinity is less than a half, right?"},{"start":2138.93,"text":"That is, we would call that, you would say that's an L-infinity norm ball. That would be the dialect. That's not really a dialect. That's high standard BBC mathematics. Anyone who knows any math would understand exactly what you're saying completely unambiguously. So, technically, that's not a dialect. Okay? So, and this would look, you know, something like this, right? Here's the .11. And then you would have a set that looks like that."},{"start":2165.77,"text":"And that would be a so-called L-infinity norm ball. Okay? Does that make sense? Okay. So, okay. Now we can also look at things like norm cones. This is super interesting. It's actually going to be kind of a theme in the class, is that we're going to be looking, a lot of times when we're looking at sets in dimension n, we will actually look at..."},{"start":2190.27,"text":"we'll actually look at Rn plus 1 where there's an additional thing and in fact you're used to this because this is like when you talk about the graph of a function that's what you're doing right you if you have a function on R2 you think of its graph well its graph is something that lives in R3 and it consists of points that look like this x1 x2 comma"},{"start":2210.43,"text":"f of x1, x2, and that's the graph, right? So this is going to be a common thing. So here, the set of xt, t is a scalar, x is a vector, for which the norm of x is less than t, that's actually a norm cone. By the way, you have to show that, right? If it's a cone, it says I can multiply the pair xt by 7, for example, and it's still in the cone. And that would be true here, because if I multiply x by 7, the norm goes up by 7, but so does t, so everything's cool."}],"speech_gaps":[],"frame":"../frames/v002/013.webp","frame_time":2071.38},{"title":"凸集与多面体","segments":[{"id":192,"text":"And then an example would be, this is what people call the Euclidean norm cone. It's got all sorts of other names. It's also called the second order cone. That's a good way to say it. Other names are, here's a cool one. It's the Lorentzian cone because it's the inequality that comes up in special relativity."},{"id":193,"text":"Although, actually, to be honest with you, the Lorentzian cone has actually got the bottom part too, which we don't do. But it's half of a Lorentzian cone, or people would just call that a Lorentzian cone. And then somebody at some point tried to propagate people referring to this as an ice cream cone, and I'm extremely happy to report it did not take. So that's another name for this cone."},{"id":194,"text":"Okay, so these are, and this just, we're just going over like here's some common convex sets. Next up, polyhedra and also polytopes. I'll say something about that. So here's some notation that we're going to use throughout the class. So that's a vector AX, and that's a vector. So I have a weird squiggly inequality between vectors, right?"},{"id":195,"text":"And this is going to be element-wise inequality between vectors, right? It means that every entry of one vector is less than or equal to every entry of the other one. That's what it means, okay? So ax less than b, if you think of it row by row, each row is a single linear inequality."},{"id":196,"text":"So that's one way to think of it. And in fact, here, these AIs, these AI transpose are the rows of A. So basically, AX less than B says, well, A1 transpose X has to be less than B1. But that's a half space. That's everybody who lives on this side of this hyperplane. And that's the outward normal."},{"id":197,"text":"But also, A2 transpose X has to be less than B2, and that's everybody that lives on this side, right? But we have to satisfy all of those, so that's basically taking the intersection of these half spaces, and we get a set that looks like that. And that's called a polyhedron. So it's literally the solution set of a set of linear inequalities. Okay, that's what a polyhedron is. And there's several, some people call these polytopes."},{"id":198,"text":"Then to make it more confusing, some authors, and actually weirdly it's reversed and not consistent, some authors say that if a polyhedron is bounded, it's a polytope, and some have the exact opposite convention. So just, and it turns out for us it's not even going to matter, so just for us they're going to be kind of the same. But just to warn you, you might be reading something somewhere, and that author might have in their mind some idea that one of these two is bounded and whatever."}],"notes":["本段介绍了凸集的几个例子，包括欧几里得范数锥（也称为二阶锥和洛伦兹锥），并提到它在相对论中的应用。同时，还提到冰激凌锥这一名称并未被广泛接受。","接下来，课程讨论了多面体和多面体（polytopes）的概念，并介绍了向量不等式（element-wise inequality）的定义，即每个向量的对应分量都满足不等式。","课程进一步解释了如何通过多个半空间的交集来定义多面体，即每个半空间对应一个线性不等式，所有不等式共同定义了一个凸集。","最后，课程提到多面体和多面体（polytopes）的定义在不同作者之间存在不一致，有些作者认为有界的多面体才是多面体，而有些则相反。但课程中指出，这种区别在本课程中并不重要。","这些内容帮助学生理解凸集的基本结构，以及如何通过线性不等式来定义和描述多面体等凸集。","课程还强调了术语的不一致性，提醒学生在阅读不同资料时注意作者可能采用的定义方式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2239.71,"end":2417.34,"asr_flags":[],"raw_segments":[{"start":2239.71,"text":"And then an example would be, this is what people call the Euclidean norm cone. It's got all sorts of other names. It's also called the second order cone. That's a good way to say it. Other names are, here's a cool one. It's the Lorentzian cone because it's the inequality that comes up in special relativity."},{"start":2261.42,"text":"Although, actually, to be honest with you, the Lorentzian cone has actually got the bottom part too, which we don't do. But it's half of a Lorentzian cone, or people would just call that a Lorentzian cone. And then somebody at some point tried to propagate people referring to this as an ice cream cone, and I'm extremely happy to report it did not take. So that's another name for this cone."},{"start":2289.69,"text":"Okay, so these are, and this just, we're just going over like here's some common convex sets. Next up, polyhedra and also polytopes. I'll say something about that. So here's some notation that we're going to use throughout the class. So that's a vector AX, and that's a vector. So I have a weird squiggly inequality between vectors, right?"},{"start":2313.26,"text":"And this is going to be element-wise inequality between vectors, right? It means that every entry of one vector is less than or equal to every entry of the other one. That's what it means, okay? So ax less than b, if you think of it row by row, each row is a single linear inequality."},{"start":2332.89,"text":"So that's one way to think of it. And in fact, here, these AIs, these AI transpose are the rows of A. So basically, AX less than B says, well, A1 transpose X has to be less than B1. But that's a half space. That's everybody who lives on this side of this hyperplane. And that's the outward normal."},{"start":2359.0,"text":"But also, A2 transpose X has to be less than B2, and that's everybody that lives on this side, right? But we have to satisfy all of those, so that's basically taking the intersection of these half spaces, and we get a set that looks like that. And that's called a polyhedron. So it's literally the solution set of a set of linear inequalities. Okay, that's what a polyhedron is. And there's several, some people call these polytopes."},{"start":2388.0,"text":"Then to make it more confusing, some authors, and actually weirdly it's reversed and not consistent, some authors say that if a polyhedron is bounded, it's a polytope, and some have the exact opposite convention. So just, and it turns out for us it's not even going to matter, so just for us they're going to be kind of the same. But just to warn you, you might be reading something somewhere, and that author might have in their mind some idea that one of these two is bounded and whatever."}],"speech_gaps":[],"frame":"../frames/v002/014.webp","frame_time":2251.71},{"title":"对称矩阵与正半定性","segments":[{"id":199,"text":"Okay, so, and this is, these are convex, right? So, okay. Here's an interesting cone. It's going to come up a lot. So, I already mentioned this. Sn is a set of symmetric n by n matrices. By the way, what's the dimension of that set? We've got n squared numbers in it, right? So, what's the dimension? What's that?"},{"id":200,"text":"Yeah, it's n times n plus 1. It's n times n plus 1 divided by 2, right? And the reason is, you know, there's n squared numbers, but the upper half is the same as the bottom half, so it's redundant, okay? So that's a vector space of dimension n, n plus 1 over 2. Okay."},{"id":201,"text":"When we put a plus there, it's the set of things which are positive semi-definite. Now here, we are doing something here. We are overloading the squiggly inequality symbol, right? So you saw it on the previous slide between vectors, in which case it means element-wise inequality. Now it appears between symmetric matrices, and here it means it's positive semi-definite. Actually, we'll get into that a bit later today, but that's the picture, right?"},{"id":202,"text":"Is that called polymorphism? Or what's it called when the semantics of a symbol depends on the syntactic context? Or is that just overloading? Doesn't matter. Somebody knows here. Come on. There's got to be some CS people here. Fine. Okay. That's the idea. Okay. So, I mean, here's a quick example. I mean, this is silly, but here's a two-by-two matrix."},{"id":203,"text":"And we want to know, and so a general 2 by 2 symmetric matrix looks like x, y, y, z, because this has got to equal that, right? And the question is, when is that positive semi-definite? And you kind of know the answer, right? The answer is, this has got to be non-negative. That's got to be non-negative. And then the determinant has to be positive, right? And that says that x, z is bigger than y squared, okay? So that's the last inequality. And then, you know, here we've drawn it."},{"id":204,"text":"for x, y, and z. And what it is is it's the interior of this, which we don't show or something, but that's the boundary of it. Actually, you want to know something weird? If you twist your head just the right way, it turns out that is exactly the same as a second-order cone, but kind of just rotated. But it doesn't matter. This is what it is, right? So, okay."}],"notes":["本段讲解了对称矩阵的维度计算，指出n×n对称矩阵的维度为n(n+1)/2，因为上三角部分与下三角部分对称，因此存在冗余。这为后续讨论正半定矩阵的性质奠定了基础。","讲者提到在对称矩阵之间使用不等号时，其含义为正半定性，这与向量之间的元素不等号不同，属于符号的重载。这种符号的重载在编程语言中常见，但在此处用于数学表达。","通过一个2×2对称矩阵的例子，讲者解释了正半定矩阵的条件：主对角线元素非负，且行列式大于零。这表明正半定矩阵的判定需要满足多个条件。","讲者进一步指出，正半定矩阵的集合可以视为一个锥体，其边界由行列式等于零的条件定义。这种几何解释有助于理解正半定矩阵的结构。","讲者提到，正半定矩阵的集合在某种旋转下可以视为二阶锥，这表明不同类型的锥体在某些情况下可以相互转换，但其本质仍保持不变。","本段内容强调了对称矩阵的维度计算、正半定性的定义、符号重载的概念以及正半定矩阵的几何性质，为后续讨论凸优化中的锥体和正半定性奠定了基础。"],"formulas":[{"latex":"\\frac{n(n+1)}{2}","symbols":"对称矩阵的维度","explanation":"公式正确，表示对称矩阵的维度为n(n+1)/2，符合数学定义。","evidence":"Yeah, it's n times n plus 1. It's n times n plus 1 divided by 2, right? And the reason is, you know, there's n squared numbers, but the upper half is the same as the bottom half, so it's redundant, okay? So that's a vector space of dimension n, n plus 1 over 2. Okay."}],"uncertainties":[],"diagram":"none","start":2417.9,"end":2577.15,"asr_flags":[],"math_clarifications":["公式'x, z > y^2'不完整且不准确，正半定矩阵的条件应为x > 0且x*z - y^2 ≥ 0。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2417.9,"text":"Okay, so, and this is, these are convex, right? So, okay. Here's an interesting cone. It's going to come up a lot. So, I already mentioned this. Sn is a set of symmetric n by n matrices. By the way, what's the dimension of that set? We've got n squared numbers in it, right? So, what's the dimension? What's that?"},{"start":2449.08,"text":"Yeah, it's n times n plus 1. It's n times n plus 1 divided by 2, right? And the reason is, you know, there's n squared numbers, but the upper half is the same as the bottom half, so it's redundant, okay? So that's a vector space of dimension n, n plus 1 over 2. Okay."},{"start":2467.98,"text":"When we put a plus there, it's the set of things which are positive semi-definite. Now here, we are doing something here. We are overloading the squiggly inequality symbol, right? So you saw it on the previous slide between vectors, in which case it means element-wise inequality. Now it appears between symmetric matrices, and here it means it's positive semi-definite. Actually, we'll get into that a bit later today, but that's the picture, right?"},{"start":2497.4,"text":"Is that called polymorphism? Or what's it called when the semantics of a symbol depends on the syntactic context? Or is that just overloading? Doesn't matter. Somebody knows here. Come on. There's got to be some CS people here. Fine. Okay. That's the idea. Okay. So, I mean, here's a quick example. I mean, this is silly, but here's a two-by-two matrix."},{"start":2525.5,"text":"And we want to know, and so a general 2 by 2 symmetric matrix looks like x, y, y, z, because this has got to equal that, right? And the question is, when is that positive semi-definite? And you kind of know the answer, right? The answer is, this has got to be non-negative. That's got to be non-negative. And then the determinant has to be positive, right? And that says that x, z is bigger than y squared, okay? So that's the last inequality. And then, you know, here we've drawn it."},{"start":2555.57,"text":"for x, y, and z. And what it is is it's the interior of this, which we don't show or something, but that's the boundary of it. Actually, you want to know something weird? If you twist your head just the right way, it turns out that is exactly the same as a second-order cone, but kind of just rotated. But it doesn't matter. This is what it is, right? So, okay."}],"speech_gaps":[],"frame":"../frames/v002/015.webp","frame_time":2429.9},{"title":"凸优化中的凸集与凸性验证","segments":[{"id":205,"text":"And, you know, look, positive semi-definite matrices are going to come up in many fields that I hope many of you have seen. Obvious one is they are covariance matrices, just to start, right? They describe ellipsoids, right? That's if you do stuff that's geometrical and you want to describe ellipsoids, they're parameterized by, at some point, in various different ways, but they're parameterized by positive semi-definite matrices. So positive semi-definite matrices come up in a ton of different fields, right? Okay, so..."},{"id":206,"text":"So that's the so-called PSD cone. That's what people would say. So we could go on, and I could show you all sorts of entertaining convex sets. But in fact, now we're going to get to how this actually really is going to work. So the way it's really going to work is we're actually going to do this using a calculus. And so let's stop and talk about what calculus is. So calculus is..."},{"id":207,"text":"I mean, it's outmoded and silly, and I can't imagine that they force people to take it, but they still do. It's fine."},{"id":208,"text":"And what it is, is if you think about it, it's actually a really good way to be able to calculate derivatives of things, for example, right? And so I tell you about some basic things like, you know, powers and sine and log. And then I tell you some rules like, you know, the derivative of a product, right? Or I don't know, you know, it's fancy rules too. It doesn't matter. So I tell you these rules. And then what you do is you take your basic things, which we're going to call atoms."},{"id":209,"text":"which you know, like, oh, the derivative of sine is cosine, okay, right? And then, you know, you put it, and then you know a couple of rules, and with a couple of rules and knowing, you know, 30, 40 atoms, you're kind of in good shape, right? You can actually calculate, you know, you know the chain rule, and you can actually calculate the, you know, the gradient of some logistic, you know, multinomial logistic loss or something like that, right? Okay, so we're going to do actually something extremely similar. In spirit, identical."},{"id":210,"text":"So we are channeling the 17th century here, or maybe 18th or something, to be fair. So you've seen some basic convex sets, and then we're going to look at some methods that preserve convexity. And then you will show, and a very effective method to know that a set is convex is to actually construct it using these rules. So another way to say that is we're going to have..."},{"id":211,"text":"syntactic verification of convexity of a set, right? So what it means is you start by saying like, well, you know, that's an ellipsoid. That's an ellipsoid. Those are convex. That's a half space. That's a polyhedron. Then I intersect them or something. That's convex, right? And stuff like that, right? So, okay. But let's back up because that's the correct way to do it. But I'll say something about other ways, right? If a person walks up to you in the street and says, is this set convex or not, right?"}],"notes":["本段主要介绍了正半定矩阵在多个领域中的应用，特别是作为协方差矩阵和椭球体的参数化工具。正半定矩阵在几何学中用于描述椭球体，这是凸优化中的重要概念。","接下来，课程转向了如何通过微积分的方法来处理凸集。微积分被描述为一种计算导数的工具，通过基本函数和规则（如乘积法则、链式法则）来构建复杂的导数计算。","课程提到，通过构建基本的“原子”函数并应用规则，可以计算出复杂的梯度，例如多分类逻辑损失函数的梯度。这与凸集的构造方法在精神上是相同的。","课程进一步指出，凸集的验证可以通过构造方法进行，即通过基本的凸集（如椭球体、半空间、多面体）并应用交集等操作来构建新的凸集。","最后，课程提到，虽然构造方法是验证凸集的正确方式，但也会提到其他方法，例如在街头遇到他人询问某个集合是否为凸集时，如何快速判断。","这些内容为后续的凸优化方法奠定了基础，强调了凸集的构造和验证在凸优化中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2579.13,"end":2752.65,"asr_flags":[],"raw_segments":[{"start":2579.13,"text":"And, you know, look, positive semi-definite matrices are going to come up in many fields that I hope many of you have seen. Obvious one is they are covariance matrices, just to start, right? They describe ellipsoids, right? That's if you do stuff that's geometrical and you want to describe ellipsoids, they're parameterized by, at some point, in various different ways, but they're parameterized by positive semi-definite matrices. So positive semi-definite matrices come up in a ton of different fields, right? Okay, so..."},{"start":2607.03,"text":"So that's the so-called PSD cone. That's what people would say. So we could go on, and I could show you all sorts of entertaining convex sets. But in fact, now we're going to get to how this actually really is going to work. So the way it's really going to work is we're actually going to do this using a calculus. And so let's stop and talk about what calculus is. So calculus is..."},{"start":2637.07,"text":"I mean, it's outmoded and silly, and I can't imagine that they force people to take it, but they still do. It's fine."},{"start":2643.36,"text":"And what it is, is if you think about it, it's actually a really good way to be able to calculate derivatives of things, for example, right? And so I tell you about some basic things like, you know, powers and sine and log. And then I tell you some rules like, you know, the derivative of a product, right? Or I don't know, you know, it's fancy rules too. It doesn't matter. So I tell you these rules. And then what you do is you take your basic things, which we're going to call atoms."},{"start":2669.23,"text":"which you know, like, oh, the derivative of sine is cosine, okay, right? And then, you know, you put it, and then you know a couple of rules, and with a couple of rules and knowing, you know, 30, 40 atoms, you're kind of in good shape, right? You can actually calculate, you know, you know the chain rule, and you can actually calculate the, you know, the gradient of some logistic, you know, multinomial logistic loss or something like that, right? Okay, so we're going to do actually something extremely similar. In spirit, identical."},{"start":2697.01,"text":"So we are channeling the 17th century here, or maybe 18th or something, to be fair. So you've seen some basic convex sets, and then we're going to look at some methods that preserve convexity. And then you will show, and a very effective method to know that a set is convex is to actually construct it using these rules. So another way to say that is we're going to have..."},{"start":2725.91,"text":"syntactic verification of convexity of a set, right? So what it means is you start by saying like, well, you know, that's an ellipsoid. That's an ellipsoid. Those are convex. That's a half space. That's a polyhedron. Then I intersect them or something. That's convex, right? And stuff like that, right? So, okay. But let's back up because that's the correct way to do it. But I'll say something about other ways, right? If a person walks up to you in the street and says, is this set convex or not, right?"}],"speech_gaps":[],"frame":"../frames/v002/016.webp","frame_time":2591.13},{"title":"凸集的验证方法","segments":[{"id":212,"text":"That happens, by the way. It actually did happen to me once, which is weird. But I was in New York. It was very weird. Okay, anyway, it actually happened. So, okay, fine. I think it happened because they'd seen me talk about this. And then they thought, well, hey, there he is. I'm going to go. Anyway, fine. So, okay. So, you know, how do you show a set is convex, right? Well..."},{"id":213,"text":"Okay, so one way is just to roll up your sleeves and go, okay, let x1 be any point in the set, let x2 be any point in the set, let theta be between 0 and 1, and then just argue that this point, this mixture or convex combination of x1 and 2 is in the set, right? Now, that's the right thing to do almost never. I mean, every now and then you may have to fall back to that, but it should be the absolute last resort."},{"id":214,"text":"right? So you don't want to do that, right? Oh, well, let me tell you, okay, so the way we're going to do it is actually going to be constructive or syntactic or by a calculus. And the way that's going to happen is what we're going to do is we're going to take a set C and we're going to represent it as a bunch of operations applied to"},{"id":215,"text":"Sets already known to be convex. A small number, the ones you've just seen already. Half spaces, polyhedra, norm balls, norm cones. That's it. That's what we're going to do. Now, some of these things are obvious, like intersection affine functions. You will see later today some things that are not obvious at all. There's something else I didn't put on here. It's actually like method... It could be method 3 or method 0."},{"id":216,"text":"I didn't want it on the slides for the reasons that will become clear when I tell you what it is. So here's another method. Here's a street fighting method for figuring out if something is convex. What you do is you write, I'm assuming you have some code that will tell you if a point is in the set C. Let's assume that, right? Then here's what you do. Also, you have some way of generating, let's say random, but just points inside C."},{"id":217,"text":"So here's what you do. You write a code that does this. It generates two points inside C. It picks a theta at random between 0 and 1, forms this thing, and then checks if it's in C. Everybody got my method? OK. Now you go to lunch. Everybody, this is critical. This is a very important part of this. You go to lunch now, OK? And you come back. And by the way, you make it halt the first time it finds a violation, right?"}],"notes":["本段讲解了如何验证一个集合是否为凸集，强调了直接使用凸组合定义的方法虽然正确，但应作为最后的手段。教授指出，更有效的方法是通过构造性或语法性的方法，利用已知的凸集进行操作，如半空间、多面体、范数球和范数锥等。","教授提到，虽然有些凸集的验证是显而易见的，如交集的仿射函数，但也会遇到一些不明显的例子。此外，教授还提到一种‘街头斗殴’的方法，即编写代码来随机生成两个点并检查它们的凸组合是否在集合中。","这种方法的关键在于编写代码，生成两个点，随机选择一个介于0和1之间的θ值，形成凸组合，并检查该点是否在集合中。教授强调，这种方法需要在午餐后继续运行，直到发现第一个违反凸性的例子为止。","教授特别指出，这种方法的目的是为了验证集合是否为凸集，而不是直接证明。这种方法在实际应用中非常有用，因为它可以快速发现非凸性，而无需进行复杂的数学推导。","教授还提到，这种方法的实现需要一些前提条件，例如能够判断一个点是否在集合中，以及能够生成集合内的随机点。这些条件在实际编程中是必须的。","最后，教授强调了这种方法的重要性，并提醒学生在实际应用中要确保代码的正确性，以便能够准确地检测到凸性的违反情况。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2754.31,"end":2910.72,"asr_flags":[],"raw_segments":[{"start":2754.31,"text":"That happens, by the way. It actually did happen to me once, which is weird. But I was in New York. It was very weird. Okay, anyway, it actually happened. So, okay, fine. I think it happened because they'd seen me talk about this. And then they thought, well, hey, there he is. I'm going to go. Anyway, fine. So, okay. So, you know, how do you show a set is convex, right? Well..."},{"start":2779.74,"text":"Okay, so one way is just to roll up your sleeves and go, okay, let x1 be any point in the set, let x2 be any point in the set, let theta be between 0 and 1, and then just argue that this point, this mixture or convex combination of x1 and 2 is in the set, right? Now, that's the right thing to do almost never. I mean, every now and then you may have to fall back to that, but it should be the absolute last resort."},{"start":2807.66,"text":"right? So you don't want to do that, right? Oh, well, let me tell you, okay, so the way we're going to do it is actually going to be constructive or syntactic or by a calculus. And the way that's going to happen is what we're going to do is we're going to take a set C and we're going to represent it as a bunch of operations applied to"},{"start":2830.68,"text":"Sets already known to be convex. A small number, the ones you've just seen already. Half spaces, polyhedra, norm balls, norm cones. That's it. That's what we're going to do. Now, some of these things are obvious, like intersection affine functions. You will see later today some things that are not obvious at all. There's something else I didn't put on here. It's actually like method... It could be method 3 or method 0."},{"start":2858.26,"text":"I didn't want it on the slides for the reasons that will become clear when I tell you what it is. So here's another method. Here's a street fighting method for figuring out if something is convex. What you do is you write, I'm assuming you have some code that will tell you if a point is in the set C. Let's assume that, right? Then here's what you do. Also, you have some way of generating, let's say random, but just points inside C."},{"start":2882.99,"text":"So here's what you do. You write a code that does this. It generates two points inside C. It picks a theta at random between 0 and 1, forms this thing, and then checks if it's in C. Everybody got my method? OK. Now you go to lunch. Everybody, this is critical. This is a very important part of this. You go to lunch now, OK? And you come back. And by the way, you make it halt the first time it finds a violation, right?"}],"speech_gaps":[],"frame":"../frames/v002/017.webp","frame_time":2766.31},{"title":"凸集与凸性的直观判断","segments":[{"id":218,"text":"In which case, you know for sure it's not convex because it just produced an x1 and an x2 and a theta between 0 and 1, and the convex combination is not x1 and x2 are in C. The convex combination is not. Everybody got that? In which case, you immediately remove all evidence that you ever did this. You remove the script, so it's gone."},{"id":219,"text":"Like don't push it or anything to github or just it's just gone right then Then what happens is when you're hanging out with your friends or something somebody says I don't know Hey, do you think like the set of measures that blah blah blah this that anything some complicated thing and you'd go like of course That's not convex That's which and they go Really, how did you know that and you go like uh? Intuition right, so that's what you do. Okay, everybody following this, okay?"},{"id":220,"text":"Now suppose you come back from lunch and it is looked at a hundred million different pairs x1 and x2 and it has not yet found a convex combination is not in the set everybody following this What precisely do you know at that time? No, you know nothing whatsoever. Okay. Okay this by the way This is still fine because now you could then you can try to show it"},{"id":221,"text":"And then in your next paper, you can say, well, look, this is convex. It's not totally obvious, but here's a paragraph derivation. You could do that. But if you fail, you still win. You go to the next conference. You hang out with your friends. And they say things like, wow, is the set of blah, blah, blah, you think that's convex? And you'd go, I think, I guess so. And they would say, how could you guess that? And you'd say."},{"id":222,"text":"intuition right right and then usually if you're what will happen is you know two months later uh somebody i don't know maybe a russian grad student at the conference or something will post something on archive showing that it isn't kind in which case you'll say like i knew that right which is a lie but okay so fine all right"},{"id":223,"text":"So that's off the record. That was your method. But, you know, it's actually not at all a bad thing to do. Like, I would not judge some... I mean, I would if it was something where, like, in three lines you could see it's convex. But if it's not obvious, I would totally... I personally... I'll go ahead and admit it right here in public. I've done that. Okay?"},{"id":224,"text":"And then I go right to my Russian friends and say, is this convex? And then we have a notion, if I send an email to Yuri Nesterov, there's a delay. And then three days later, he says, I am not sure. That's the equivalent of like, it's unknown. It's probably the equivalent of it's unknowable, actually. So anyway, that's how I do it. Anyway, so that's, okay, fine."}],"notes":["本段讲授了如何通过凸组合来判断一个集合是否为凸集。当一个集合中存在两个点，其凸组合不在该集合中时，该集合就不是凸集。讲者强调了这种判断方法的直观性，并指出在实际研究中，有时需要依赖直觉来判断凸性。","讲者提到，当一个人在研究中发现某个集合可能不是凸集时，会立即删除相关证据，以避免误导他人。这种做法虽然看似不负责任，但有时是出于对研究结果的保护。","当一个人在研究中无法找到反例时，他仍然无法确定该集合是否为凸集。这种情况下，他可能会尝试通过数学推导来证明其凸性，但若失败，他仍然可以继续研究。","讲者指出，有时在学术交流中，人们会通过直觉来判断某个集合是否为凸集。这种直觉可能来源于对问题的熟悉程度，但有时也会被质疑。","讲者提到，有时在学术会议中，其他研究者可能会指出某个集合不是凸集，而讲者可能会声称自己早就知道这一点，但实际上这是谎言。这种现象反映了学术交流中的不确定性。","最后，讲者提到，当遇到不确定的凸性问题时，可以向专家请教，但有时专家也无法确定答案。这种情况下，问题可能被认为是不可知的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2911.82,"end":3082.85,"asr_flags":[],"raw_segments":[{"start":2911.82,"text":"In which case, you know for sure it's not convex because it just produced an x1 and an x2 and a theta between 0 and 1, and the convex combination is not x1 and x2 are in C. The convex combination is not. Everybody got that? In which case, you immediately remove all evidence that you ever did this. You remove the script, so it's gone."},{"start":2938.44,"text":"Like don't push it or anything to github or just it's just gone right then Then what happens is when you're hanging out with your friends or something somebody says I don't know Hey, do you think like the set of measures that blah blah blah this that anything some complicated thing and you'd go like of course That's not convex That's which and they go Really, how did you know that and you go like uh? Intuition right, so that's what you do. Okay, everybody following this, okay?"},{"start":2966.54,"text":"Now suppose you come back from lunch and it is looked at a hundred million different pairs x1 and x2 and it has not yet found a convex combination is not in the set everybody following this What precisely do you know at that time? No, you know nothing whatsoever. Okay. Okay this by the way This is still fine because now you could then you can try to show it"},{"start":2990.05,"text":"And then in your next paper, you can say, well, look, this is convex. It's not totally obvious, but here's a paragraph derivation. You could do that. But if you fail, you still win. You go to the next conference. You hang out with your friends. And they say things like, wow, is the set of blah, blah, blah, you think that's convex? And you'd go, I think, I guess so. And they would say, how could you guess that? And you'd say."},{"start":3018.02,"text":"intuition right right and then usually if you're what will happen is you know two months later uh somebody i don't know maybe a russian grad student at the conference or something will post something on archive showing that it isn't kind in which case you'll say like i knew that right which is a lie but okay so fine all right"},{"start":3036.68,"text":"So that's off the record. That was your method. But, you know, it's actually not at all a bad thing to do. Like, I would not judge some... I mean, I would if it was something where, like, in three lines you could see it's convex. But if it's not obvious, I would totally... I personally... I'll go ahead and admit it right here in public. I've done that. Okay?"},{"start":3058.82,"text":"And then I go right to my Russian friends and say, is this convex? And then we have a notion, if I send an email to Yuri Nesterov, there's a delay. And then three days later, he says, I am not sure. That's the equivalent of like, it's unknown. It's probably the equivalent of it's unknowable, actually. So anyway, that's how I do it. Anyway, so that's, okay, fine."}],"speech_gaps":[],"frame":"../frames/v002/018.webp","frame_time":2923.82},{"title":"凸集的交集与示例","segments":[{"id":225,"text":"Let's move on. We have the idea of intersection. This is kind of obvious. This is geometrically very obvious. Here's a convex set. Here's another one. The intersection is this thing."},{"id":226,"text":"And, you know, look, your eyeball tells you it's convex. And, by the way, a three-line proof would tell you that it's convex, too. Okay? So the intersection of convex sets is convex. Actually, the intersection can be even an infinite number of things can be half. So we can talk about things like an infinite number, the intersection of an infinite number of half spaces is convex."},{"id":227,"text":"So here's my set S. This is called a trigonometric polynomial, right? So it comes up in lots of fields, right? Like in signal processing, for example, or whatever. But there it is. It's a linear combination of these functions, which is cosine, cosine 2g, and blah, blah, blah. I mean, I guess you could also call it an even Fourier series or truncated. Lots of people, you could call it lots of things, right? Fine."},{"id":228,"text":"Okay, then my set S is the set of coefficients for which this function is less than 1 as long for all t, absolute value t less than, but this is symmetric, right? If I plug in minus t, it's the same thing. So I just, it's basically t between 0 and, you know, pi over 3, right? So everybody got it?"},{"id":229,"text":"So that's it. That's my set. And look, if you were in EE or something, you could say, oh, these are the things that satisfy some filter that does something and blah, blah, blah. That's fine. OK. So the question, is it convex? I mean, it is. Otherwise, it wouldn't be as an example in the lecture. But the question is, how do you show that? And in fact, it's not too hard to actually just"},{"id":230,"text":"go brute force on this, right? And so to go brute force, what you'd do is you'd say, well, suppose I had two, two entries, two members of this set, right? So like, here's one, and I'm going to draw, not the coefficients, but I'll draw the actual trigonometric polynomial. So here's one. And sure enough, look, it's between plus minus one out to pi over three. So here's one and here's another one. Okay. Like that."}],"notes":["本段讲解了凸集的交集性质，指出交集仍然是凸集，并且可以是无限多个半空间的交集。这为后续讨论凸集的构造和性质奠定了基础。","接着，课程通过一个具体的例子来说明凸集的构造，即一个由三角多项式定义的集合。该集合由一系列余弦函数的线性组合构成，且满足在特定区间内函数值不超过1。","该例子中，函数的定义域是对称的，因此只需考虑从0到π/3的区间。这简化了分析过程，同时保持了函数的凸性。","课程进一步提出问题，即如何证明该集合是凸的。虽然直观上可能认为是凸的，但需要通过严格的数学证明来确认。","为了证明，课程建议采用暴力方法，即取两个属于该集合的元素，验证它们的凸组合是否也属于该集合。这体现了凸集的基本定义。","通过绘制具体的三角多项式，课程展示了如何直观地验证凸性，强调了数学证明与直观理解的结合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3083.63,"end":3236.7,"asr_flags":[],"raw_segments":[{"start":3083.63,"text":"Let's move on. We have the idea of intersection. This is kind of obvious. This is geometrically very obvious. Here's a convex set. Here's another one. The intersection is this thing."},{"start":3105.49,"text":"And, you know, look, your eyeball tells you it's convex. And, by the way, a three-line proof would tell you that it's convex, too. Okay? So the intersection of convex sets is convex. Actually, the intersection can be even an infinite number of things can be half. So we can talk about things like an infinite number, the intersection of an infinite number of half spaces is convex. Okay? So here's an example. It's quasi-practical or something. It goes like this."},{"start":3134.31,"text":"So here's my set S. This is called a trigonometric polynomial, right? So it comes up in lots of fields, right? Like in signal processing, for example, or whatever. But there it is. It's a linear combination of these functions, which is cosine, cosine 2g, and blah, blah, blah. I mean, I guess you could also call it an even Fourier series or truncated. Lots of people, you could call it lots of things, right? Fine."},{"start":3160.29,"text":"Okay, then my set S is the set of coefficients for which this function is less than 1 as long for all t, absolute value t less than, but this is symmetric, right? If I plug in minus t, it's the same thing. So I just, it's basically t between 0 and, you know, pi over 3, right? So everybody got it?"},{"start":3182.46,"text":"So that's it. That's my set. And look, if you were in EE or something, you could say, oh, these are the things that satisfy some filter that does something and blah, blah, blah. That's fine. OK. So the question, is it convex? I mean, it is. Otherwise, it wouldn't be as an example in the lecture. But the question is, how do you show that? And in fact, it's not too hard to actually just"},{"start":3211.01,"text":"go brute force on this, right? And so to go brute force, what you'd do is you'd say, well, suppose I had two, two entries, two members of this set, right? So like, here's one, and I'm going to draw, not the coefficients, but I'll draw the actual trigonometric polynomial. So here's one. And sure enough, look, it's between plus minus one out to pi over three. So here's one and here's another one. Okay. Like that."}],"speech_gaps":[],"frame":"../frames/v002/019.webp","frame_time":3095.63},{"title":"凸集与半空间的交集","segments":[{"id":231,"text":"right? Then what I would do in my head, and you could just start with the average because, you know, if it doesn't hold for the average, anyway, that's, so then you ask yourself if I form the average of those two. Now, technically, I'm forming the average of the coefficients. But when I form the average of the coefficients, I get the average, I literally just average these two functions. And I get this dotted curve here like that. And then we ask ourselves the question, if a function is between plus and minus one over this little boundary,"},{"id":232,"text":"Right? And so is another one. And then I form the average of those two functions. Is it between plus and minus one over that? The answer is, yeah, of course it is. Yeah. So it's convex. There's a derivation of it. But we can also think it's a really cool way to think of S as an infinite intersection. So I'm going to write that down because it's actually kind of interesting. It goes like this. It's the..."},{"id":233,"text":"It's the set of x for which, and then it's, here, I'll just write, it's less than 1 for t in, you know, 0, you know, pi over 3, right? So it looks like that, right? So I'm going to ask you a question. Let's say I need a number between 0 and pi over 3. Here it is, 0.6, okay? So I would like you to tell me..."},{"id":234,"text":"What does this look like? In fact, describe this geometrically. We haven't given a name for it yet. Whoa, whoa, whoa. Very wrong, wrong. There you go. And this is for t equals 0.6. There. OK? Everybody got that? OK? So the question is, what does this look like? It's a subset. It's what? A subset. Which set? A subset, the second one. It's a subset?"},{"id":235,"text":"it's a half space is that what yeah okay so actually this that's a half space in x right so the the set of coefficients of trigonometric polynomials so that at evaluated at 0.6 is less than 1 that's a half space in coefficient space you know what so is this one that's a half space"},{"id":236,"text":"So it's the intersection of two half-spaces. That's a polyhedron. Matter of fact, the two half-spaces are just shifted, right? And if I ask you, what's the set of x for which, you know, let's say a transpose x, you know, yeah, that's fine. I'll just do this, right, is less than b, right? Note the absolute value here. That's actually a really cool thing. It looks like this, right? It's actually a slab. Here's a, and here's minus a."}],"notes":["本段讲解了凸集与半空间的交集概念。讲者通过一个具体的例子，即三角多项式的系数集合，说明了如何通过半空间的交集来定义凸集。讲者指出，当一个函数在某个点的值小于1时，它所对应的系数集合是一个半空间。","讲者进一步说明，两个半空间的交集构成一个凸集，即多面体。这种结构在优化问题中非常重要，因为许多凸优化问题的可行域都可以表示为半空间的交集。","讲者还提到，当考虑一个线性不等式约束，如 $ a^T x \u003c b $ 时，其对应的几何结构是一个半空间。如果考虑绝对值形式的约束，如 $ |a^T x| \u003c b $，则对应的几何结构是一个 slab（平板），即两个平行半空间之间的区域。","讲者通过具体的例子，如 $ t = 0.6 $，来说明如何将函数值的约束转化为系数空间中的半空间约束。这种转换是凸优化中的关键步骤，因为它允许将问题转化为线性约束形式。","讲者强调，半空间的交集是凸集的典型例子，而多面体是半空间交集的特例。这种结构在凸优化中具有广泛的应用，例如在支持向量机、线性规划等问题中。","讲者还指出，当考虑多个线性不等式约束时，这些约束的交集构成一个凸集，而每个不等式对应一个半空间。这种结构使得凸优化问题可以被有效地求解。"],"formulas":[{"latex":"a^T x \u003c b","symbols":"a^T x \u003c b 表示一个半空间","explanation":"该公式正确表示了一个半空间，其中向量a与向量x的点积小于标量b。","evidence":"So it's the intersection of two half-spaces. That's a polyhedron. Matter of fact, the two half-spaces are just shifted, right? And if I ask you, what's the set of x for which, you know, let's say a transpose x, you know, yeah, that's fin  be completely intuitive and geometric, but I'm going to argue that line segments get mapped to line segments."},{"id":276,"text":"That's and that's good enough because then if I if my function is convex and I know that every line segment You know that you that that's in your set, you know gets mapped to one then that that that's good enough Okay, so then the question is this here's a line segment and I look at it Okay, so I look at my and I and I then we ask what does it look like on my retina? The answer is it's a line segment. Do we agree? It's that into in two dimensions, right?"},{"id":277,"text":"Okay, now I'm going to ask you a question just to make sure we're not fooling ourselves here. The midpoint of this thing maps to a point on my retina. Is it the midpoint of the line segment on my retina? No, it is not. Okay, so that tells you you're not... Oh, by the way, unless I'm like way, way far away and that's an approximation of... That's an approximation, right? If you have a telephoto lens, that image mapping, image formation, it's pretty much linear, right?"},{"id":278,"text":"But not if you're up close. So that's my visual argument that uses a pencil to argue that perspective mappings preserve convexity. Here's just a quick example to see what this looks like. So here's a linear fractional function. It's x divided by, you just scale x wherever you are."},{"id":279,"text":"How you scale it depends on this denominator, which is x1 plus x2 plus 1. We assume that's positive, so that says that you live over here. This is like the netherworld. We don't go there, right? But this is where it's positive. And this coefficient here, right over here, it's gigantic, right? And it gets smaller and smaller and smaller the farther you go away. So if this is the set C, this is the image under F of C. And it's this bump right here that translates over to there."},{"id":280,"text":"Okay, and you know a good way to understand this is take this thing Put it on the ground like that and now fly a drone over it and look down and you get get close enough That I mean, I think the word is for sure. It's for shortening, right? So you get close enough then in fact, this thing is closer to you So it looks all big looks like and that's what it's gonna look like So that's why these these things look very familiar to us because well, hey, it's how our eyes work, right? So everybody"}],"notes":["本段主要讨论凸函数的几何直观，通过线性映射和透视变换来解释凸性保持的性质。讲者指出，线段在映射后仍然保持为线段，这是凸函数的一个重要性质。然而，中点在映射后不一定保持为中点，除非在远距离的情况下，这种映射可以近似为线性。这说明了凸函数在几何变换下的不变性，但需要考虑具体条件。","讲者通过一个线性分式函数的例子来说明凸性在映射下的保持。该函数的分母为x1 + x2 + 1，假设其为正，因此定义域为某个区域。系数随着距离的增加而减小，这导致了图像的变形。这种变形在远距离时可以近似为线性，而在近距离时则不成立。","讲者进一步通过一个实际例子来说明这种映射的直观效果。他提到将物体放在地面上，然后用无人机从上方观察，当距离足够近时，物体看起来更大，这与人眼的成像方式一致。这说明了凸性在实际观察中的表现，以及透视变换对凸性的影响。","讲者强调，虽然透视变换可以近似为线性，但并非所有情况下都成立。因此，在讨论凸性保持时，必须明确映射的条件和距离的影响。这为后续讨论凸函数的性质和应用提供了基础。","讲者通过视觉和实际例子的结合，帮助学生理解凸函数在几何变换下的行为。这种直观的解释有助于学生建立对凸函数性质的深刻理解，同时提醒他们在实际应用中注意条件的限制。","本段内容涉及凸函数的几何直观、线性映射的性质以及透视变换的影响。这些概念为后续讨论凸优化问题的几何解释和应用奠定了基础。"],"formulas":[],"uncertainties":["x1 plus x2 plus 1","this coefficient here, right over here, it's gigantic, right? And it gets smaller and smaller and smaller the farther you go away"],"diagram":"none","start":3916.62,"end":4068.41,"asr_flags":[],"raw_segments":[{"start":3916.62,"text":"But, you know, a good way to think of it intuitively is this. What I'll show you, I'll argue, this is going to be completely intuitive and geometric, but I'm going to argue that line segments get mapped to line segments."},{"start":3932.29,"text":"That's and that's good enough because then if I if my function is convex and I know that every line segment You know that you that that's in your set, you know gets mapped to one then that that that's good enough Okay, so then the question is this here's a line segment and I look at it Okay, so I look at my and I and I then we ask what does it look like on my retina? The answer is it's a line segment. Do we agree? It's that into in two dimensions, right?"},{"start":3959.24,"text":"Okay, now I'm going to ask you a question just to make sure we're not fooling ourselves here. The midpoint of this thing maps to a point on my retina. Is it the midpoint of the line segment on my retina? No, it is not. Okay, so that tells you you're not... Oh, by the way, unless I'm like way, way far away and that's an approximation of... That's an approximation, right? If you have a telephoto lens, that image mapping, image formation, it's pretty much linear, right?"},{"start":3986.62,"text":"But not if you're up close. So that's my visual argument that uses a pencil to argue that perspective mappings preserve convexity. Here's just a quick example to see what this looks like. So here's a linear fractional function. It's x divided by, you just scale x wherever you are."},{"start":4011.29,"text":"How you scale it depends on this denominator, which is x1 plus x2 plus 1. We assume that's positive, so that says that you live over here. This is like the netherworld. We don't go there, right? But this is where it's positive. And this coefficient here, right over here, it's gigantic, right? And it gets smaller and smaller and smaller the farther you go away. So if this is the set C, this is the image under F of C. And it's this bump right here that translates over to there."},{"start":4040.27,"text":"Okay, and you know a good way to understand this is take this thing Put it on the ground like that and now fly a drone over it and look down and you get get close enough That I mean, I think the word is for sure. It's for shortening, right? So you get close enough then in fact, this thing is closer to you So it looks all big looks like and that's what it's gonna look like So that's why these these things look very familiar to us because well, hey, it's how our eyes work, right? So everybody"}],"speech_gaps":[],"frame":"../frames/v002/024.webp","frame_time":3928.62},{"title":"凸优化中的广义不等式","segments":[{"id":281,"text":"Got this? And it is not remotely obvious that these preserve convexity, but they do. And we'll see some crazy consequences of this later in various practical settings. It's going to be super interesting. Okay, next topic is generalized inequalities. So we've actually already seen two, and we've already seen the two most important ones. So let me explain what it is."},{"id":282,"text":"Suppose I have a convex cone. It's a proper cone if it's closed, so it contains limits or whatever. Again, that's analysis and we don't have to worry about it. It's solid. That's a technical term that means it has non-empty interior. It's pointed, which means it contains no line. Again, I think these are really good. I don't know who chose these words."},{"id":283,"text":"It's the non-negative orthant. That's a famous one, right? It's going to come up a lot. You know, non-negative orthant, I mean, it looks like, it's kind of a weird name, right? In 2D, it's just this thing, right? In 3D, there's eight orthants, and it's one of them."},{"id":284,"text":"It's like orthant number one. I don't know how people name those, right? In fact, I don't even know what this is. Is this quadrant two or quadrant? Anyway, whatever your quadrant labeling method is, this is a quadrant, right? So why you would call it orthant in higher dimensions, I don't know, but it's what stuck, okay? So language is weird."},{"id":285,"text":"And it's just, so it's a set of non-negative vectors, right? Positive semi-definite cone, we already saw that. But it turns out, you know, it's closed, right? And it's solid. In other words, there is no matrix that is positive semi-definite. And it's negative as positive semi-definite. Oh, except zero. That's the only one, right? So that's what it means to be pointed, okay?"},{"id":286,"text":"And, you know, you get weird stuff like the set of coefficients of polynomials that are non-negative on some interval, right? I'm just mentioning this because there's some just weird ones, right? So these are called, these are going to be called proper cones. And let me explain, let me show you some improper cones in R2 just to make it clear. So, oh, here's a cone. Oh, by the way, this is just called a ray, right? So it's all points that go."}],"notes":["本段讲解了广义不等式中的凸锥概念，特别是正锥（proper cone）的定义和性质。讲者提到正锥需要满足闭合性、实心性（非空内部）和尖点性（不含直线）。这些条件确保了锥的结构能够支持不等式分析。","讲者以非负正交（non-negative orthant）为例，说明了在二维和三维空间中正锥的结构。在二维中，非负正交是第一象限；在三维中，正交被扩展为八个正交区域。讲者指出，尽管名称可能显得奇怪，但这是数学界广泛接受的术语。","讲者进一步解释了正锥的尖点性，即正锥中没有直线，这与正定矩阵的性质相关。正定矩阵的集合是闭合且实心的，但只有零矩阵是负的正定矩阵，这体现了正锥的尖点性。","讲者还提到，正锥可以用于描述多项式在某些区间上非负的系数集合，这展示了正锥在实际问题中的应用。这些正锥被称为正锥（proper cone），而其他不符合条件的锥则被称为非正锥（improper cone）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4069.48,"end":4224.0,"asr_flags":[],"raw_segments":[{"start":4069.48,"text":"Got this? And it is not remotely obvious that these preserve convexity, but they do. And we'll see some crazy consequences of this later in various practical settings. It's going to be super interesting. Okay, next topic is generalized inequalities. So we've actually already seen two, and we've already seen the two most important ones. So let me explain what it is."},{"start":4099.79,"text":"Suppose I have a convex cone. It's a proper cone if it's closed, so it contains limits or whatever. Again, that's analysis and we don't have to worry about it. It's solid. That's a technical term that means it has non-empty interior. It's pointed, which means it contains no line. Again, I think these are really good. I don't know who chose these words."},{"start":4126.56,"text":"Excellent choice, I think, right? Because they're completely evocative. Okay, so here's an example. It's the non-negative orphan. That's a famous one, right? It's going to come up a lot. You know, non-negative orphan, I mean, it looks like, it's kind of a weird name, right? In 2D, it's just this thing, right? In 3D, there's eight orphans, and it's one of them."},{"start":4147.45,"text":"It's like orthant number one. I don't know how people name those, right? In fact, I don't even know what this is. Is this quadrant two or quadrant? Anyway, whatever your quadrant labeling method is, this is a quadrant, right? So why you would call it orthant in higher dimensions, I don't know, but it's what stuck, okay? So language is weird."},{"start":4170.34,"text":"And it's just, so it's a set of non-negative vectors, right? Positive semi-definite cone, we already saw that. But it turns out, you know, it's closed, right? And it's solid. In other words, there is no matrix that is positive semi-definite. And it's negative as positive semi-definite. Oh, except zero. That's the only one, right? So that's what it means to be pointed, okay?"},{"start":4194.83,"text":"And, you know, you get weird stuff like the set of coefficients of polynomials that are non-negative on some interval, right? I'm just mentioning this because there's some just weird ones, right? So these are called, these are going to be called proper cones. And let me explain, let me show you some improper cones in R2 just to make it clear. So, oh, here's a cone. Oh, by the way, this is just called a ray, right? So it's all points that go."}],"speech_gaps":[],"frame":"../frames/v002/025.webp","frame_time":4081.48},{"title":"凸锥与广义不等式","segments":[{"id":287,"text":"that are multiples of this vector and just go off that way. That's called a ray. It's a cone. It's a convex cone. Where does it fail? What does it fail there? What does it violate? It's not solid. That's right. So solid means it's got to have some interior. Here's a cone. It's a half space. That's totally a cone in R2. How does it fail?"},{"id":288,"text":"It's not pointed. Why? Because look at this. Here's a point. You know, here's a line that is contained in that cone. And that violates the idea that it's pointed. Okay? So how about this? How about this cone? How about that one? That's good. Right? That's pointed. Solid. Whatever. It's a cone. Okay? All right. Fine. Okay."},{"id":289,"text":"prope
