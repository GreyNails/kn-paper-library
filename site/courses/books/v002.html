<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 2</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">02 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 2 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v002.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v002","title":"02 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 2","course":"凸优化","pages":[{"title":"课程介绍与凸优化历史背景","segments":[{"id":0,"text":"I'm just going to finish up one quick thing from this intro, and then we're going to launch in. Now, just to remind you, I warned you last time, but I'll do it again right now. We're going in deep today and next week. So it's just going to be math, and it's going to be disconnected from anything. If you don't have the feeling...","zh":"我只需要完成一个快速的事情，然后我们就开始正式上课。现在，只是提醒一下，我上次已经警告过你们，但我现在再重复一遍。今天和下周我们将深入讲解内容。所以接下来的内容将全是数学，而且和任何实际应用都无关。如果你没有那种感觉……","start":5.3,"end":27.18},{"id":1,"text":"why did all these people recommend this class sometime like next week maybe even today maybe while you're doing homework one which by the way is assigned then I mean it that's completely normal right so what I do promise you though that everything we see here you will see in the context of applications later in the course and actually so that means something about how you might how I would suggest that you learn the material so","zh":"为什么所有这些人都在某个时候推荐这门课，比如下周，甚至可能今天，当你在做作业的时候？顺便说一句，作业是已经布置的，我是认真的，这完全正常。不过，我向你们承诺的是，我们在这里看到的一切内容，你们会在课程后面的实践中看到其应用。实际上，这意味着一些关于你们应该如何学习这些内容的建议。","start":28.11,"end":55.05},{"id":2,"text":"You can't just, I mean, I don't know. It depends on, I mean, okay, I'll just speak for myself. It's hard for me just to like hear some math and then think about it and go, okay, cool, I'm done. I have to see how people use it and stuff like that. So what I would suggest is you just get the basic ideas right now. Big picture. I mean, you'll do some homework. That'll help. There'll be sections, all that sort of stuff. Then what's going to happen is you don't have to have perfect mastery of the material we're going to cover in the next two weeks.","zh":"你们不能只是……我意思是，我不知道。这取决于，我意思是，好吧，我只代表我自己说。对我来说，只是听到一些数学内容然后思考一下，说‘哦，挺好的，我搞定了’，这很难。我必须看到人们如何使用这些内容，以及类似的事情。因此，我建议你们现在先掌握基本概念。把握大图。我意思是，你们会做一些作业。这会有所帮助。会有章节，各种各样的内容。接下来会发生的是，你们不需要在我们继续之前完全掌握接下来两周要讲的内容。","start":56.34,"end":84.38},{"id":3,"text":"You don't have to have that before we move on. If you get like 70% mastery, you're cool. That's fine. And the reason is what's going to happen is after that, then we're going to look at applications and we'll be doing statistics and we'll be doing control and signal. We're doing all sorts of stuff. We'll use it and you'll look up and you go, okay, now I know what the conjugate is. Okay, or something like that. But for right now, it's just going to be weird abstract. That's just what it is. Okay, so.","zh":"你们不需要在我们继续之前完全掌握这些内容。如果你们达到70%的掌握程度，那就够了。这没问题。原因是什么呢？接下来会发生的是，我们会看看这些内容的应用，我们会做统计学，我们会做控制和信号处理。我们会做各种各样的事情。我们会使用这些内容，你们会抬头一看，说‘哦，现在我知道共轭是什么了。’或者类似的事情。但就现在而言，这将只是奇怪的抽象概念。这就是它本来的样子。好吧，就这样。","start":84.96,"end":110.48},{"id":4,"text":"All right. OK, so we'll go ahead and start. Actually, what I did want to do is say just a little bit about the brief history of convex optimism, just to give some historical background. So the first thing is that as a mathematical field, it's at least 120 years old, right? So people were writing down inequalities that we would now say, hey, that's convex. That's convexity. They were writing this down in the late 19th century.","zh":"好的。嗯，那我们就开始吧。其实，我本来是想简单讲一下凸优化的历史背景，以提供一些历史背景。首先，作为一个数学领域，它至少有120年的历史了，对吧？人们在19世纪末就开始写下我们现在称之为凸的不等式。","start":111.34,"end":137.78},{"id":5,"text":"That was codified right around the turn of the last century. So, well, I guess whatever, a century and 1.2 centuries ago. So that was codified and someone said, look, we keep seeing the same stupid inequality all the time. Let's give it a name. And that's when the name became basically convexity. So as a mathematical field, it was really already quite well developed in the 20s, 50s. By the 70s, I would just say it was done.","zh":"这些内容在上一个世纪末左右被系统化。所以，嗯，大概一个世纪甚至1.2个世纪以前。那时有人说道，我们总是反复看到同样的愚蠢不等式。让我们给它起个名字。于是，这个名字就变成了凸性。作为一个数学领域，它在20年代和50年代已经相当成熟了。到了70年代，我只能说它已经完成了。","start":138.32,"end":164.98},{"id":6,"text":"There was a beautiful book written on convex analysis. If you do math and are interested in math, you could read it. It's a beautiful book. And that's just it. Have people done stuff since then? Yeah, sure. But basically, that was it. It was just clean, wrapped up. I mean, it doesn't say anything about what you do with it.","zh":"有一本关于凸分析的美丽书籍被写了出来。如果你做数学并对数学感兴趣，你可以阅读它。这是一本美丽的书。而且，这也就是全部内容了。人们之后有没有做过其他事情？当然有。但基本上，这就是全部了。它已经很清晰，已经收尾了。我的意思是，它并没有说你如何使用它。","start":165.39,"end":183.77}],"notes":["本段主要介绍了课程的结构和学习建议。讲师强调，虽然课程内容会深入且抽象，但后续会结合应用来讲解，因此学生不需要一开始就完全掌握所有内容。建议学生先理解基本概念，通过作业和课堂内容逐步掌握，之后在应用部分再加深理解。","讲师提到，课程内容在接下来的两周会非常密集，但不需要学生在开始前就完全掌握。70%的掌握程度就足够，因为后续会通过应用来加深理解。这表明课程设计注重逐步深入，而不是一开始就要求学生掌握所有细节。","课程内容将涉及统计、控制和信号处理等多个领域，这些应用会帮助学生理解抽象的凸优化概念。例如，学生会在应用中看到共轭函数等概念，从而加深对理论的理解。","讲师还简要回顾了凸优化的历史背景，指出该领域至少有120年的历史，从19世纪末开始，人们就开始研究凸性相关的不等式。20世纪初，这一领域被系统化，形成了凸分析的理论基础。","在20世纪20年代和50年代，凸优化理论已经相当成熟，到了70年代，该领域被认为已经基本完成。这表明凸优化是一个已经发展成熟的数学领域，但仍在不断扩展和应用。","尽管凸优化理论已经非常成熟，但讲师指出，该领域仍在不断发展，有新的研究和应用出现。这表明课程不仅教授经典理论，还关注最新的发展和应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.3,"end":183.77,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.3,"text":"I'm just going to finish up one quick thing from this intro, and then we're going to launch in. Now, just to remind you, I warned you last time, but I'll do it again right now. We're going in deep today and next week. So it's just going to be math, and it's going to be disconnected from anything. If you don't have the feeling..."},{"start":28.11,"text":"why did all these people recommend this class sometime like next week maybe even today maybe while you're doing homework one which by the way is assigned then I mean it that's completely normal right so what I do promise you though that everything we see here you will see in the context of applications later in the course and actually so that means something about how you might how I would suggest that you learn the material so"},{"start":56.34,"text":"You can't just, I mean, I don't know. It depends on, I mean, okay, I'll just speak for myself. It's hard for me just to like hear some math and then think about it and go, okay, cool, I'm done. I have to see how people use it and stuff like that. So what I would suggest is you just get the basic ideas right now. Big picture. I mean, you'll do some homework. That'll help. There'll be sections, all that sort of stuff. Then what's going to happen is you don't have to have perfect mastery of the material we're going to cover in the next two weeks."},{"start":84.96,"text":"You don't have to have that before we move on. If you get like 70% mastery, you're cool. That's fine. And the reason is what's going to happen is after that, then we're going to look at applications and we'll be doing statistics and we'll be doing control and signal. We're doing all sorts of stuff. We'll use it and you'll look up and you go, okay, now I know what the conjugate is. Okay, or something like that. But for right now, it's just going to be weird abstract. That's just what it is. Okay, so."},{"start":111.34,"text":"All right. OK, so we'll go ahead and start. Actually, what I did want to do is say just a little bit about the brief history of convex optimism, just to give some historical background. So the first thing is that as a mathematical field, it's at least 120 years old, right? So people were writing down inequalities that we would now say, hey, that's convex. That's convexity. They were writing this down in the late 19th century."},{"start":138.32,"text":"That was codified right around the turn of the last century. So, well, I guess whatever, a century and 1.2 centuries ago. So that was codified and someone said, look, we keep seeing the same stupid inequality all the time. Let's give it a name. And that's when the name became basically convexity. So as a mathematical field, it was really already quite well developed in the 20s, 50s. By the 70s, I would just say it was done."},{"start":165.39,"text":"There was a beautiful book written on convex analysis. If you do math and are interested in math, you could read it. It's a beautiful book. And that's just it. Have people done stuff since then? Yeah, sure. But basically, that was it. It was just clean, wrapped up. I mean, it doesn't say anything about what you do with it."}],"speech_gaps":[],"frame":"../frames/v002/001.webp","frame_time":17.3},{"title":"凸优化的历史与应用","segments":[{"id":7,"text":"How do you apply it? How do you actually do algorithmic things with it? Like, how do you actually solve these problems? But just as a mathematical field, it's super, it's interesting. And I'd even encourage you to poke through that book if you have that proclivity, right? The math proclivity, right? I would actually suggest looking at it. Okay. So, you know, when it really takes off, I mean, and this is not, you know, this is kind of, you know, roughly somewhere around, you know, the 1940s. Now,","zh":"你怎么应用它？你实际上是如何用它来做算法的？比如，你实际上是如何解决这些问题的？但就作为一个数学领域来说，它非常有趣。我甚至鼓励你如果有这种倾向的话去翻翻那本书，对吧？数学的倾向，对吧？我实际上建议你去读一读。好的。所以，你知道，当它真正兴起的时候，我的意思是，这并不是说，你知道，这大概是在，你知道，1940年代左右。现在，","start":184.28,"end":213.08},{"id":8,"text":"This is it's not accidental that that coincides with the development basically of the computer. Right. So, you know, because I mean, to me, the exciting part is we can actually do all this. Like everything in this class is actionable.","zh":"这和计算机的发展基本上同时期，这并不是偶然的。对吧？所以，你知道，对我来说，令人兴奋的部分是我们实际上可以做所有这些事情。就像这门课里的所有内容都是可以实际操作的。","start":213.76,"end":226.22},{"id":9,"text":"And that's very different from just taking a math class, right? Where it's all super interesting, but who knows what fraction of it is actionable? Everything we do is actionable. So for us, the real interesting history starts around then, the development of computers, right? And right around then, people were developing the simplex algorithm. That's a very famous algorithm for linear programming. There's a strong Stanford connection. Actually, one of the people who popularized that was George Danzig. He was a professor here.","zh":"这和仅仅上一门数学课是非常不同的，对吧？那里面虽然都很有趣，但谁知道其中有多少是实际可操作的呢？我们做的一切都是可以实际操作的。因此，对我们来说，真正有趣的历史始于那时，计算机的发展，对吧？而就在那时，人们正在开发单纯形算法。这是一个用于线性规划的非常著名的算法。这与斯坦福大学有很强的联系。实际上，推广这个算法的人之一是乔治·丹齐格。他曾经是这里的教授。","start":226.96,"end":254.26},{"id":10,"text":"So there was a big burst of work. I will refer to it a whole bunch of times. And honestly, a lot of the work that goes beyond linear programming occurred in the Soviet Union, in the 60s through basically through the 70s and 80s, right?","zh":"因此，有一大批工作涌现出来。我会多次提到它。说实话，很多超出线性规划范围的工作是在苏联进行的，从60年代一直到基本上70年代和80年代，对吧？","start":256.69,"end":276.59},{"id":11,"text":"So there was a lot of work there. We'll get to some of that later. And of course, since about the 2000s, a lot of it was picked up by people in statistics and machine learning and things like that. So there was a lot of stuff done after that. I think the applications are actually sort of interesting. So the applications go back to the 1940s and 50s. We'll actually look at some of them, which is actually kind of fun because they're just historical examples of things.","zh":"因此，那里有很多工作。我们之后会谈到其中的一些。当然，从大约2000年起，这些内容被统计学和机器学习等领域的人们所继承和发展。因此，在那之后有很多工作被完成。我认为这些应用实际上很有趣。这些应用可以追溯到1940年代和50年代。我们实际上会看看其中的一些，这其实很有趣，因为它们只是历史上的例子。","start":277.11,"end":302.97},{"id":12,"text":"But actually, already in the 1950s, people in aerospace were designing extremely light structures, the lightest possible structure that would handle the required loads, dynamic and static loads. So that was already, and it should be totally obvious, that's unbelievably important in aerospace, right? Because everything you have in your frame or whatever just takes away from your payload, period.","zh":"但实际上，早在1950年代，航空航天领域的研究人员就已经在设计极其轻便的结构，即能够承受所需载荷（包括动态和静态载荷）的最轻结构。因此，这显然是极其重要的，对吧？因为在你的框架或任何其他结构中，任何额外的重量都会直接减少有效载荷。","start":304.38,"end":330.32},{"id":13,"text":"So that's an example, very early, of people doing this. In electrical engineering, people were designing FIR filters, again, in the 60s. So you would find little bits and pieces, but I would say that the floodgates kind of opened.","zh":"这就是一个非常早期的例子，人们已经开始进行这样的设计。在电气工程领域，人们在20世纪60年代也在设计FIR滤波器。因此，你会看到一些零星的案例，但我想说的是，真正的大规模应用才刚刚开始。","start":331.84,"end":347.38}],"notes":["本段介绍了凸优化的发展历史，指出其在计算机发展后才真正开始广泛应用。讲者提到线性规划的单纯形算法在1940年代左右发展，与计算机的发展时间吻合，强调凸优化的实用性。","讲者提到苏联在1960年代至1980年代期间在凸优化领域做出了大量贡献，这些工作超出了线性规划的范畴。随后，自2000年代起，统计学和机器学习领域的人士开始广泛采用这些方法。","讲者举了航空航天和电气工程中的实际应用例子，如1950年代航空航天中设计最轻的结构，以及1960年代电气工程中设计FIR滤波器，说明凸优化在实际工程中的重要性。","讲者强调凸优化与传统数学课程的不同之处在于其所有内容都是可操作的，即可以实际应用于解决具体问题，这与传统数学课程中许多理论无法直接应用的情况形成对比。","讲者指出，凸优化的应用历史可以追溯到1940年代和1950年代，例如航空航天和电气工程中的实际案例，这些案例展示了凸优化在工程实践中的重要性。","讲者提到，尽管凸优化在早期发展缓慢，但随着计算机的发展，其应用逐渐扩展，并在2000年代后被统计学和机器学习领域广泛采用，说明其在现代技术中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":184.28,"end":347.38,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":184.28,"text":"How do you apply it? How do you actually do algorithmic things with it? Like, how do you actually solve these problems? But just as a mathematical field, it's super, it's interesting. And I'd even encourage you to poke through that book if you have that proclivity, right? The math proclivity, right? I would actually suggest looking at it. Okay. So, you know, when it really takes off, I mean, and this is not, you know, this is kind of, you know, roughly somewhere around, you know, the 1940s. Now,"},{"start":213.76,"text":"This is it's not accidental that that coincides with the development basically of the computer. Right. So, you know, because I mean, to me, the exciting part is we can actually do all this. Like everything in this class is actionable."},{"start":226.96,"text":"And that's very different from just taking a math class, right? Where it's all super interesting, but who knows what fraction of it is actionable? Everything we do is actionable. So for us, the real interesting history starts around then, the development of computers, right? And right around then, people were developing the simplex algorithm. That's a very famous algorithm for linear programming. There's a strong Stanford connection. Actually, one of the people who popularized that was George Danzig. He was a professor here."},{"start":256.69,"text":"So that's kind of the early part of it. Now, there was a big burst of work. I will refer to it a whole bunch of times. And honestly, a lot of the work that goes beyond linear programming occurred in the Soviet Union, in the 60s through basically through the 70s and 80s, right?"},{"start":277.11,"text":"So there was a lot of work there. We'll get to some of that later. And of course, since about the 2000s, a lot of it was picked up by people in statistics and machine learning and things like that. So there was a lot of stuff done after that. I think the applications are actually sort of interesting. So the applications go back to the 1940s and 50s. We'll actually look at some of them, which is actually kind of fun because they're just historical examples of things."},{"start":304.38,"text":"But actually, already in the 1950s, people in aerospace were designing extremely light structures, the lightest possible structure that would handle the required loads, dynamic and static loads. So that was already, and it should be totally obvious, that's unbelievably important in aerospace, right? Because everything you have in your frame or whatever just takes away from your payload, period."},{"start":331.84,"text":"So that's an example, very early, of people doing this. In electrical engineering, people were designing FIR filters, again, in the 60s. So you would find little bits and pieces, but I would say that the floodgates kind of opened."}],"speech_gaps":[],"frame":"../frames/v002/002.webp","frame_time":196.28},{"title":"凸优化课程概述与基本概念","segments":[{"id":14,"text":"the late 90s early 2000s right and that there was a lot of stuff in control and signal processing communications that that that sort of happened right around that time right and people figured out that if you're trying to allocate power to a bunch of wireless systems then a lot of these problems they're just convex okay and so those are and those are actually those methods are actually kind of used okay and like I said a lot of stuff was was done","zh":"20世纪90年代末到2000年代初，那时在控制、信号处理和通信领域有很多事情发生，大约就在那个时候。人们发现，如果你试图为一组无线系统分配功率，那么很多这些问题都是凸的，对吧？所以这些方法实际上被使用了。正如我所说，当时有很多工作被做了。","start":347.93,"end":373.63},{"id":15,"text":"in maybe, let's see, maybe the heyday was about 10 years ago when people were looking at models and statistics and machine learning that involved convex optimization problems. We'll look at a lot of those. These would be like things like logistic regression, support vector machines and things like that, right? So, and that's a good, I mean.","zh":"也许，让我们看看，也许鼎盛时期是在大约十年前，当时人们在研究涉及凸优化问题的模型、统计和机器学习。我们会看到很多这些内容。这些包括逻辑回归、支持向量机之类的东西，对吧？所以，这是一个很好的，我的意思是。","start":375.58,"end":393.76},{"id":16,"text":"Good news, people worked on various methods that we're not going to cover, sub-gradient type methods, right? So we're not going to cover those methods. And then those turned out to be the methods that are actually the ones used today on non-convex things like training neural networks. Okay, so there's your big picture. Okay, so at this point, unless there's questions, we're jumping in and this is the deep end. So this is not...","zh":"好消息是，人们研究了各种我们不会讲的方法，比如次梯度方法，对吧？所以我们不会讲这些方法。而这些方法后来被用于非凸问题，比如训练神经网络。好的，所以这就是你所看到的大图景。好的，所以在这一点上，除非有问题，我们就要跳入深水区了。所以这不是……","start":394.39,"end":421.57},{"id":17,"text":"We're not in the, we're just going to jump right in. Okay. So the, and again, to remind you what the whole point of all this is, is there's not a class about math.","zh":"我们不处于那种状态，我们直接跳进去。好的。所以，再次提醒你，我们在这里讨论的所有内容的目的是什么，这不是一个关于数学的课程。","start":421.96,"end":433.82},{"id":18,"text":"It's a class about actually applying these methods. And so when you apply these methods, you arrive at a startup or an internship or something like that, or your research, and there's a practical problem you want to solve. I mean, that's the setting we're talking about here. And then you have to sort through and try to figure out, I mean, if it's convex. I mean, which parts of it are convex? These kinds of things.","zh":"这是一门关于实际应用这些方法的课程。因此，当你应用这些方法时，你可能会进入一家初创公司或实习，或者你的研究，有一个实际的问题需要解决。我的意思是，这就是我们在这里讨论的场景。然后你必须仔细分析并尝试弄清楚，我的意思是，这个问题是否是凸的？我的意思是，其中哪些部分是凸的？这些事情。","start":434.49,"end":460.07},{"id":19,"text":"Absolutely critical is to be able to recognize things like a convex set and a convex function. We'll talk about convex sets today, convex functions next week. So that's the actual practical skill that we are after. I mean, it is interesting theory, and it's interesting as theory, and it's just fine, but the point is that's the skill we're after.","zh":"绝对关键的是能够识别像凸集和凸函数这样的概念。今天我们会讨论凸集，下周会讨论凸函数。这就是我们实际追求的实用技能。我的意思是，这理论很有趣，作为理论也很有趣，这很好，但重点是我们要追求的技能。","start":461.27,"end":481.09},{"id":20,"text":"Okay, so what we'll do is we're gonna I'm gonna start with like super basic and it's gonna accelerate after that So let's start go back way to the beginning. So at the beginning it goes like this","zh":"好的，那我们接下来要做的就是，我会从非常基础的内容开始，之后内容会逐渐加快。那我们先回到最开始的地方。所以一开始的情况是这样的","start":483.29,"end":495.01},{"id":21,"text":"I just have two vectors, x1 and x2, and n-dimensional space or something like that. And what I do is let's suppose that they are not equal to each other, and I'm going to form this specific linear combination here. So that linear combination has got two coefficients, theta and 1 minus theta. They're sort of interesting because they add up to 1. So that's critical.","zh":"我只有两个向量，x1和x2，它们处于n维空间中或者类似的空间里。我的做法是假设这两个向量不相等，然后我会形成这样一个特定的线性组合。这个线性组合有两个系数，theta和1减去theta。它们有点有趣，因为它们的和等于1。这一点非常关键。","start":495.76,"end":519.66}],"notes":["本段介绍了凸优化在控制、信号处理和通信领域的应用历史，特别是在90年代末到2000年代初，人们发现许多无线系统功率分配问题本质上是凸优化问题，这些方法被广泛应用于机器学习领域，如逻辑回归和支持向量机。"],"formulas":[],"uncertainties":[],"diagram":"none","start":347.93,"end":519.66,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":347.93,"text":"the late 90s early 2000s right and that there was a lot of stuff in control and signal processing communications that that that sort of happened right around that time right and people figured out that if you're trying to allocate power to a bunch of wireless systems then a lot of these problems they're just convex okay and so those are and those are actually those methods are actually kind of used okay and like I said a lot of stuff was was done"},{"start":375.58,"text":"in maybe, let's see, maybe the heyday was about 10 years ago when people were looking at models and statistics and machine learning that involved convex optimization problems. We'll look at a lot of those. These would be like things like logistic regression, support vector machines and things like that, right? So, and that's a good, I mean."},{"start":394.39,"text":"Good news, people worked on various methods that we're not going to cover, sub-gradient type methods, right? So we're not going to cover those methods. And then those turned out to be the methods that are actually the ones used today on non-convex things like training neural networks. Okay, so there's your big picture. Okay, so at this point, unless there's questions, we're jumping in and this is the deep end. So this is not..."},{"start":421.96,"text":"We're not in the, we're just going to jump right in. Okay. So the, and again, to remind you what the whole point of all this is, is there's not a class about math."},{"start":434.49,"text":"It's a class about actually applying these methods. And so when you apply these methods, you arrive at a startup or an internship or something like that, or your research, and there's a practical problem you want to solve. I mean, that's the setting we're talking about here. And then you have to sort through and try to figure out, I mean, if it's convex. I mean, which parts of it are convex? These kinds of things."},{"start":461.27,"text":"Absolutely critical is to be able to recognize things like a convex set and a convex function. We'll talk about convex sets today, convex functions next week. So that's the actual practical skill that we are after. I mean, it is interesting theory, and it's interesting as theory, and it's just fine, but the point is that's the skill we're after."},{"start":483.29,"text":"Okay, so what we'll do is we're gonna I'm gonna start with like super basic and it's gonna accelerate after that So let's start go back way to the beginning. So at the beginning it goes like this"},{"start":495.76,"text":"I just have two vectors, x1 and x2, and n-dimensional space or something like that. And what I do is let's suppose that they are not equal to each other, and I'm going to form this specific linear combination here. So that linear combination has got two coefficients, theta and 1 minus theta. They're sort of interesting because they add up to 1. So that's critical."}],"speech_gaps":[],"frame":"../frames/v002/003.webp","frame_time":359.93},{"title":"仿射组合与仿射集","segments":[{"id":22,"text":"What, geometrically, what this is, is this, as you vary theta, this sketches out the line in this space that passes through x1 and x2. So that's what that is. In fact, you would call this a parameterization of the line. It's parameterized by theta. Right, so theta equals zero means that you're at x2. Theta equals one means you're at x1. Theta equals a half means you're at kind of the midpoint between x1 and x2.","zh":"从几何上看，当theta变化时，这会描绘出穿过x1和x2的这条线在这个空间中的轨迹。这就是它的含义。实际上，你会称这个为这条线的参数化。它由theta参数化。对吧，theta等于零意味着你在x2处，theta等于一意味着你在x1处，theta等于一半意味着你在x1和x2之间的中点附近。","start":521.89,"end":547.31},{"id":23,"text":"Okay, so this is the, again, it's, you know, it's all just to go back to the beginning and make sure everybody's on the same page. Okay, so this is called an affine combination. So a linear combination is, well, you know what a linear combination is. It's a sum of vectors multiplied by some coefficients, right? But when those coefficients add up to one, that's special, and that's called an affine combination. Okay, so that's an affine combination.","zh":"好的，所以这是再次回到起点，确保大家在同一页面上。好的，这被称为仿射组合。线性组合就是，你知道的，就是向量的和乘以一些系数，对吧？但当这些系数相加等于一的时候，这就特别了，这被称为仿射组合。好的，这就是仿射组合。","start":547.68,"end":575.98},{"id":24,"text":"So this is, you know, the simplest affine combination you could possibly have. Okay. All right. Now, an affine set is then defined to be a set. It contains the line through any two distinct points in the set. In other words, I mean, you might say informally something like this. It's closed under forming a line or something like that. So in other words, if two points are in the set, the entire line is in the set.","zh":"所以这是你可能拥有的最简单的仿射组合。好的。那么，仿射集被定义为一个集合。它包含集合中任意两个不同点之间的直线。换句话说，你可以非正式地说，它在形成直线时是封闭的。换句话说，如果两个点在集合中，那么整条直线也在集合中。","start":576.53,"end":604.05},{"id":25,"text":"Okay, so that's an affine set. And you'll see lots of examples, but a famous one would be this. The solution set of a set of linear inequalities. So the set of x for which ax equals b is going to be an affine set. And by the way, you can check, I mean, a lot of things I'm going to say.","zh":"好的，这就是仿射集。你会看到很多例子，但一个著名的例子就是这个。线性不等式组的解集。满足ax等于b的x的集合将是一个仿射集。顺便说一句，你可以检查，我将会说的很多事情。","start":604.42,"end":622.44},{"id":26,"text":"honestly, you might want to do something weird, like just with probability 0.1, audit that, right? Which means try to show it. So in this case, what you'd do is you'd have to say, well, let's see if this is an affine set. To do that, you would say, well, let's suppose x1 and x2 are both solutions of ax equals b.","zh":"说实话，你可能会想做一些奇怪的事情，比如以0.1的概率审计一下，对吧？这意味着尝试证明它。在这种情况下，你所做的就是，你必须说，让我们看看这是否是一个仿射集。为此，你会说，假设x1和x2都是ax等于b的解。","start":623.38,"end":642.16},{"id":27,"text":"right? So that's the first step. Then you'd say, let's let theta be any number at all. And then you'd form theta x1 plus 1 minus theta x2. And you'd want to show that that point also satisfies ax equals b. I mean, it's quite straightforward. I'm not going to do it. But I would recommend that you, you know, I'll say stuff. And you just sit there and you go, cool, yeah, I mean, it's probably true if I say it, right? So you can trust me. But I would actually kind of suggest that you audit it.","zh":"对吧？所以这是第一步。然后你会说，让我们让 theta 是任意一个数。接着你会形成 theta x1 加上 1 减去 theta x2。你想要证明这个点也满足 ax 等于 b。我的意思是，这非常直接。我不会去做这个证明。但我会说一些话，而你只需要坐在那里想，嗯，对的，我的意思是，如果我说它是对的，那应该就是对的，对吧？所以你可以信任我。但其实我建议你最好自己检查一下。","start":642.77,"end":670.43},{"id":28,"text":"Like every, you know, every tenth thing, you just say, I'm going to show that. Right? Because I will say stuff without many, most of what I'm going to say, I'm not going to justify. Okay? Okay. Now, it turns out this is not just a good example. It's generic. So, every affine set is the solution set of a set of linear inequalities. Okay? And again, I'm not going to show that. Okay. But this brings us to convex set. So,","zh":"就像每十件事中的一件，你只需要说，我要证明这一点。对吧？因为我会说一些话，而其中大部分我不会去证明。明白吗？明白。事实上，这不仅仅是一个好的例子。它是通用的。所以，每一个仿射集都是一个线性不等式组的解集。明白吗？而我又不会去证明这一点。明白吗。但这引出了凸集的概念。所以，","start":670.67,"end":696.1}],"notes":["本段讲解了仿射组合的几何意义，即通过参数θ在x1和x2之间形成一条直线。θ=0时位于x2，θ=1时位于x1，θ=0.5时位于两者中间。这说明了仿射组合的参数化方式。","接着，课程引入了仿射集的概念，即包含任意两点之间连线的集合。仿射集的定义强调了其对线性组合的封闭性，即如果两个点在集合中，那么它们之间的所有点也必须在集合中。","课程还提到仿射集的一个典型例子是线性方程组的解集，即满足ax = b的所有x的集合。这说明了仿射集与线性约束之间的关系。","为了验证一个集合是否为仿射集，课程建议通过具体例子进行验证，例如假设x1和x2是ax = b的解，然后验证θx1 + (1 - θ)x2是否也满足该方程。这展示了仿射集的验证方法。","课程还提到，仿射集的定义是通用的，即每个仿射集都可以表示为一组线性不等式的解集。这说明了仿射集的广泛适用性。","最后，课程引出了凸集的概念，为后续内容做铺垫。这表明课程在讲解仿射集后，将转向更复杂的凸集概念。"],"formulas":[{"latex":"x = \\theta x_1 + (1 - \\theta) x_2","symbols":"x表示由x1和x2通过参数θ形成的点","explanation":"公式正确，表示通过参数θ在x1和x2之间形成点的线性组合，符合仿射组合的定义。","evidence":"What, geometrically, what this is, is this, as you vary theta, this sketches out the line in this space that passes through x1 and x2. So that's what that is. In fact, you would call this a parameterization of the line. It's parameterized by theta. Right, so theta equals zero means that you're at x2. Theta equals one means you're at x1. Theta equals a half means you're at kind of the midpoint between x1 and x2."},{"latex":"ax = b","symbols":"ax = b表示线性方程组的解集","explanation":"公式正确，表示线性方程组的解集，符合仿射集的定义。","evidence":"Okay, so that's an affine set. And you'll see lots of examples, but a famous one would be this. The solution set of a set of linear inequalities. So the set of x for which ax equals b is going to be an affine set. And by the way, you can check, I mean, a lot of things I'm going to say."}],"uncertainties":[],"diagram":"none","start":521.89,"end":696.1,"asr_flags":[],"math_clarifications":["公式0和公式1均正确，符合仿射组合和仿射集的定义，无需进一步修改。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":521.89,"text":"What, geometrically, what this is, is this, as you vary theta, this sketches out the line in this space that passes through x1 and x2. So that's what that is. In fact, you would call this a parameterization of the line. It's parameterized by theta. Right, so theta equals zero means that you're at x2. Theta equals one means you're at x1. Theta equals a half means you're at kind of the midpoint between x1 and x2."},{"start":547.68,"text":"Okay, so this is the, again, it's, you know, it's all just to go back to the beginning and make sure everybody's on the same page. Okay, so this is called an affine combination. So a linear combination is, well, you know what a linear combination is. It's a sum of vectors multiplied by some coefficients, right? But when those coefficients add up to one, that's special, and that's called an affine combination. Okay, so that's an affine combination."},{"start":576.53,"text":"So this is, you know, the simplest affine combination you could possibly have. Okay. All right. Now, an affine set is then defined to be a set. It contains the line through any two distinct points in the set. In other words, I mean, you might say informally something like this. It's closed under forming a line or something like that. So in other words, if two points are in the set, the entire line is in the set."},{"start":604.42,"text":"Okay, so that's an affine set. And you'll see lots of examples, but a famous one would be this. The solution set of a set of linear inequalities. So the set of x for which ax equals b is going to be an affine set. And by the way, you can check, I mean, a lot of things I'm going to say."},{"start":623.38,"text":"honestly, you might want to do something weird, like just with probability 0.1, audit that, right? Which means try to show it. So in this case, what you'd do is you'd have to say, well, let's see if this is an affine set. To do that, you would say, well, let's suppose x1 and x2 are both solutions of ax equals b."},{"start":642.77,"text":"right? So that's the first step. Then you'd say, let's let theta be any number at all. And then you'd form theta x1 plus 1 minus theta x2. And you'd want to show that that point also satisfies ax equals b. I mean, it's quite straightforward. I'm not going to do it. But I would recommend that you, you know, I'll say stuff. And you just sit there and you go, cool, yeah, I mean, it's probably true if I say it, right? So you can trust me. But I would actually kind of suggest that you audit it."},{"start":670.67,"text":"Like every, you know, every tenth thing, you just say, I'm going to show that. Right? Because I will say stuff without many, most of what I'm going to say, I'm not going to justify. Okay? Okay. Now, it turns out this is not just a good example. It's generic. So, every affine set is the solution set of a set of linear inequalities. Okay? And again, I'm not going to show that. Okay. But this brings us to convex set. So,"}],"speech_gaps":[],"frame":"../frames/v002/004.webp","frame_time":533.89},{"title":"凸集与凸组合","segments":[{"id":29,"text":"If theta in this affine combination, if theta is between 0 and 1, then this traces out the line segment between x1 and x2, right? And by the way, some people actually write it this way. I mean, and I'm totally okay with that. They write x1, x2 like that. Perfectly okay. Now, I mean, we all know and agree on what that means if x1 and x2 are numbers.","zh":"如果这个仿射组合中的θ在0到1之间，那么它会描绘出x1和x2之间的线段，对吧？顺便说一句，有些人确实这样写。我的意思是，我完全接受这种写法。他们写x1、x2像这样。完全没问题。我的意思是，我们都清楚并同意，如果x1和x2是数字的话，这意味着什么。","start":697.15,"end":722.43},{"id":30,"text":"I mean, assuming in that case it's conventional for x2 to be bigger than x1. But nevertheless, we know what this means. But this is for vectors. This would be the line segment. This is not standard notation. By the way, in this case, this is called either a convex combination of x1 and x2. But you're going to find other names and other things. And some of them are quite descriptive. Here's one. It's a mixture.","zh":"我的意思是，假设在这种情况下，x2通常比x1大是惯例。但不管怎样，我们知道这是什么意思。但这是针对向量的。这会是线段。这不是标准的记号。顺便说一句，在这种情况下，这被称为x1和x2的凸组合。但你会发现其他名称和其他东西。其中一些名称相当描述性。这里有一个：它是一种混合。","start":723.05,"end":747.03},{"id":31,"text":"So it's just it's a mixture of excellent. It's like everyone gets it and so then you'd say well It's 22% of that and 78% of that right so it's a mixture right and there's other names, too And I'm forgetting what they are, but you in different fields you'd find different names for a convex combination, okay?","zh":"所以它只是优秀的一种混合。每个人都明白这一点，所以你会说，比如，这是其中的22%和其中的78%，对吧？所以这是一种混合，对吧？还有其他名称，我也忘记了它们是什么，但在不同领域，你会找到不同的凸组合的名称，好的？","start":748.47,"end":775.99},{"id":32,"text":"Any two points in the set have a clear line of sight to each other, right? That's what it says, okay? And so, you know, here's some, I mean, these are silly examples, but, you know, here's like a little convex set. It's dark here. That means it contains its boundary. And this is convex, and we can kind of check, right? Because what you'd do is you'd say, well, look, if I take any two points, here's one, and here's the other.","zh":"集合中的任意两点都有清晰的视线彼此可见，对吧？这就是它说的，好的？所以，这里有一些，我的意思是，这些是愚蠢的例子，但你知道，这里有一个小小的凸集。这里是暗色的，这意味着它包含其边界。并且这是凸的，我们可以大致检查一下，对吧？因为你会说，比如，如果我取任意两点，这里有一个，这里还有一个。","start":776.77,"end":801.96},{"id":33,"text":"and then i would simply visualize the segment in between them sure enough it's inside the set it's all cool right um this one is not convex right and i have a counter example right here which is there's a point in the set there's a point in the set this is the line segment and you can see it goes outside the set okay so that's that that one this one is also not convex","zh":"然后我会简单地可视化它们之间的线段，确实，它在集合内部，一切都很顺利，对吧？而这个不是凸的，对吧？我这里有一个反例，集合中有一个点，集合中还有一个点，这是线段，你可以看到它会超出集合，好的，这就是那个，这个也是不凸的。","start":802.43,"end":826.39},{"id":34,"text":"But because it's weird. I don't know if you can see, but there are gaps in the boundary here. And I could have two points on the boundary here. They're both in the set, but the line segment is not entirely in the set. OK, so so this is all this. This is kind of this is at the center of the course. Right. So there's something there's going to be something special about convex sets. OK, now, if you have.","zh":"但是因为看起来很奇怪。我不知道你们是否能看出来，但这里的边界上有一些间隙。我可以在这边界上有两个点。它们都在集合中，但连接这两个点的线段并不完全包含在集合中。好的，所以这就是全部了。这就是这门课的核心内容。对吧。所以凸集有一些特别之处。好的，现在，如果你有。","start":827.04,"end":852.74},{"id":35,"text":"If you have an affine combination with all the coefficients non-negative, right? So that's going to look like this. So x is a linear combination of x1 through xk. These are vectors, right? Number one, it's a linear combination. Number two, the coefficients add up to one. That makes it an affine combination.","zh":"如果你有一个仿射组合，其中所有的系数都是非负的，对吧？所以这就看起来像这样。x 是 x1 到 xk 的线性组合。这些都是向量，对吧？第一点，它是线性组合。第二点，系数的和为一。这就使得它成为一个仿射组合。","start":853.28,"end":872.52}],"notes":["本段讲解了凸组合的概念，指出凸组合是两个点之间的线性组合，且系数在0到1之间。同时提到凸组合也被称为混合，不同领域可能有不同的名称。凸集的定义是任意两点之间的线段都在集合内，这可以通过可视化来验证。","讲者通过举例说明了凸集的特性，指出凸集包含其边界，并且任意两点之间的线段都在集合内。非凸集则存在线段超出集合的情况，例如边界存在缺口。","讲者提到凸集是本课程的核心内容，强调了凸集在优化问题中的重要性。凸组合的系数非负且和为1，这与线性组合不同，线性组合的系数和不一定为1。","讲者通过对比凸组合和线性组合，指出凸组合是特殊的线性组合，其系数和为1。这种组合在凸集的定义中起着关键作用，因为线段的端点之间的所有点都可以表示为凸组合。","讲者强调了凸集的直观意义，即任意两点之间有“清晰的视线”，这与几何上的线段完全包含在集合内相对应。这种性质使得凸集在优化问题中具有良好的数学性质。","讲者通过反例说明了非凸集的特征，指出即使两个点都在集合中，它们之间的线段可能并不完全包含在集合内，这与凸集的定义相违背。"],"formulas":[{"latex":"x = \\theta x_1 + (1 - \\theta) x_2","symbols":"x 是 x1 和 x2 的凸组合，θ 在 0 到 1 之间","explanation":"公式正确表达了凸组合的定义，θ 在 0 到 1 之间，符合凸组合的条件。","evidence":"If theta in this affine combination, if theta is between 0 and 1, then this traces out the line segment between x1 and x2, right? And by the way, some people actually write it this way. I mean, and I'm totally okay with that. They write x1, x2 like that. Perfectly ok ? So you take it for intellectual self-defense. That's why you take it.","zh":"是的，这就是原因。你可能会问，哦，我会用到这些材料吗？不会，你永远用不到，好吗？它非常有趣，对吧？但关于它的一个特点是你修读分析学，主要是为了某些人的需要。在这里的数学领域，你修读它是因为你必须修。或者说，你想要修，对吧？或者有什么不对劲，对吧？所以你修读它是为了智力上的自我保护。这就是你修读它的原因。","start":1339.8,"end":1365.78}],"notes":["本段讨论了凸集的定义，指出0向量总是任何向量集合的锥组合，但空集除外。对于凸组合，系数必须加和为1，不能使用两个0系数。凸包是否包含其边界的问题被提出，但答案是否定的，说明凸包不一定包含其边界。","讲者强调，即使不了解分析学，学生也能在课程中表现良好，因为课程会提供术语的通俗解释。对于从事需要使用数学的博士生，建议学习分析学，因为它是进行数学推理的必要工具。","讲者解释了学习分析学的原因，指出虽然课程中不会直接使用分析学的内容，但它是进行数学推理的自我保护手段，有助于理解更复杂的数学概念。"],"formulas":[],"uncertainties":["部分句子的断句和语法结构存在不确定性，如'you can if you if you actually are interested in the math and you want'，可能需要进一步澄清。","句子'you know what the limits of that and all that kind of stuff you you would speak'存在语法不清晰的问题，可能需要重新断句。"],"diagram":"none","start":1206.43,"end":1365.78,"asr_flags":[89],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":1206.43,"text":"0. So 0 is always a conic combination of any set of vectors, except empty set, but that's"},{"start":1216.61,"text":"silly, right? So you're not allowed to do that. For convex, the coefficients have to"},{"start":1222.65,"text":"add up to 1, and you can't say 0, 0. You can say 0, 1. You can say 1 third, 2 thirds, but"},{"start":1228.51,"text":"But you cannot say 0, 0."},{"start":1229.63,"text":"Make sense?"},{"start":1230.91,"text":"OK, cool."},{"start":1232.43,"text":"Yes?"},{"start":1233.17,"text":"Does the convex hull necessarily contain its boundary?"},{"start":1238.65,"text":"Does it necessarily contain its boundary?"},{"start":1244.33,"text":"It doesn't necessarily?"},{"start":1245.91,"text":"Yeah."},{"start":1246.69,"text":"Oh, also, maybe I'll mention something."},{"start":1253.63,"text":"So you're getting close to analysis, which is fine."},{"start":1258.51,"text":"I think it's great. I mean, I was trained in math, you know, so, but we're not going to focus in this"},{"start":1266.53,"text":"class on the analysis. And I mean, by the way, questions like that, by all means ask. But if"},{"start":1271.91,"text":"you start asking like very esoteric, weird questions that only people who speak the dialect"},{"start":1276.59,"text":"of analysis know, I'll just say, we'll talk about it later. Okay. So, so this, this, this was below"},{"start":1284.15,"text":"that threshold and a great question but in general right and you can do that"},{"start":1288.17,"text":"right so you can if you if you actually are interested in the math and you want"},{"start":1291.59,"text":"to know about you know does this work if that's closed and blah blah blah and you"},{"start":1295.33,"text":"know what the limits of that and all that kind of stuff you you would speak"},{"start":1298.77,"text":"to the TAS or me but we'll only do it in we won't do it in public though because"},{"start":1304.49,"text":"because you're not you shouldn't you shouldn't talk about detailed me wait"},{"start":1307.47,"text":"you're just not supposed to speak a weird dialect in public when no one"},{"start":1309.97,"text":"understand."},{"start":1311.77,"text":"If you don't know analysis, you're actually going to be just fine in the class. So you'll be just fine. So there'll be some terms. We will give you the colloquial translation of the term, and you will be just fine. So don't worry about that. By the way, if you're doing a PhD in a field where people use math, even incidentally, I would strongly recommend you do take analysis. Shall I explain why?"},{"start":1339.8,"text":"Yeah, so here's why. You might ask, oh, will I use the material? No, you'll never use it, okay? It's super interesting, right? But the thing about it, you take analysis for mostly, at least for some set of people. Here in math, you take it because you have to. Well, you want to, I should say, right? Or something's wrong, right? So you take it for intellectual self-defense. That's why you take it."}],"speech_gaps":[{"start":1241.85,"end":1243.93}],"frame":"../frames/v002/008.webp","frame_time":1218.43},{"title":"分析课程的重要性与凸组合的定义","segments":[{"id":92,"text":"If you don't take it, let's suppose you do a PhD in statistics or something, right? Something, you know, that's math adjacent, right? So you're at a conference someday, five years from now, and you give a perfectly good paper. Everything that you said is right. It's interesting. Some jerk in the back raises the hand and says, oh, you know, is that?","zh":"如果你不选这门课，假设你读统计学博士或者其他什么，对吧？比如说，一些与数学相关但不完全相同的领域，对吧？所以有一天，五年后，你在会议上发表了一篇非常好的论文。你说的每句话都是正确的。它很有趣。但后面有个混蛋举手问，哦，你知道的，这是弱星紧致的吗？","start":1366.75,"end":1389.31},{"id":93,"text":"Is that weak star compact? And if you've had analysis, then you look at them and you go, number one, yes. Number two, totally irrelevant. If you haven't had analysis, you'll go like, oh, I don't know. And you'll have a crisis and all that. So I'm just saying that's why it's worth a 10-week investment taking analysis. I mean, like for math adjacent courses, like suppose you do robotics, right? And by the way, there are these people out there. I know them.","zh":"如果你学过分析，那你看着他，会想，第一，是的。第二，完全不相关。如果你没学过分析，你就会想，哦，我不知道。然后你就会陷入危机，诸如此类。所以我想说的是，这就是为什么花十周时间学习分析是值得的。我是说，对于与数学相关的课程，比如你做机器人学，对吧？顺便说一句，我知道这些人。","start":1389.78,"end":1418.64},{"id":94,"text":"The other thing, okay, on that same topic, another one is this. For people who do know analysis, some of them, you will be judged. If you have a hick mathematical dialect and you're not, if you know what you're talking about but not quite using the right word, yeah, people in the room who know analysis will exchange glances and nothing needs to be said.","zh":"另外，就这个话题而言，还有另一件事。对于那些学过分析的人，有些人会被评判。如果你有地方口音的数学表达方式，但你并不是在使用正确的术语，即使你知道你在说什么，人们在房间里懂分析的人也会交换眼神，什么都不需要说。","start":1420.57,"end":1444.38},{"id":95,"text":"So that's the origin of where that... So in a convex combination, it is simply part of the definition that they add up to one. So it's literally by definition or by fiat or whatever. Yeah. Okay. Cool.","zh":"这就是凸组合的起源。在凸组合中，它们加起来等于一，这是定义的一部分。所以这实际上是定义本身，或者说是通过规定来实现的，不管怎样。是的。好的。","start":1445.04,"end":1468.58},{"id":96,"text":"So that's the origin of where that... So in a convex combination, it is simply part of the definition that they add up to one. So it's literally by definition or by fiat or whatever. Yeah. Okay. Cool.","zh":"这就是凸组合的起源。在凸组合中，它们加起来等于一，这是定义的一部分。所以这实际上是定义本身，或者说是通过规定来实现的，不管怎样。是的。好的。","start":1469.21,"end":1484.64},{"id":97,"text":"That's what a hyperplane is, right? And you know what a hyperplane looks like. You know, in two dimensions, you know, it looks like this. Here's a hyperplane there. Everything on that line, right, satisfies a two-dimensional equation. I mean, sorry, a single equation in two variables, right? So that's what it means. You know, and in three space, it's actually literally a hyperplane. It's a plane, right? And then in higher dimensions, it's what people call a hyperplane, okay? So that's that.","zh":"这就是超平面是什么，对吧？你知道超平面是什么样子的。你知道，在二维情况下，你知道，它看起来像这样。这里有一个超平面。这条线上的所有东西，对吧，都满足一个二维方程。我是说，抱歉，是两个变量中的一个方程，对吧？这就是它的意思。你知道，在三维空间中，它实际上是真正的超平面。它是一平面，对吧？而在更高维度中，人们称之为超平面，对吧？这就是这个概念。","start":1486.12,"end":1509.44},{"id":98,"text":"That's what a hyperplane is, right? And you know what a hyperplane looks like. You know, in two dimensions, you know, it looks like this. Here's a hyperplane there. Everything on that line, right, satisfies a two-dimensional equation. I mean, sorry, a single equation in two variables, right? So that's what it means. You know, and in three space, it's actually literally a hyperplane. It's a plane, right? And then in higher dimensions, it's what people call a hyperplane, okay? So that's that.","zh":"这就是超平面是什么，对吧？你们都知道超平面长什么样。比如说，在二维空间中，你们知道它看起来像这样。这里有一个超平面。这条线上的所有点，对吧，都满足一个二维方程。我的意思是，抱歉，是一个包含两个变量的单一方程，对吧？这就是它的意思。你们知道，在三维空间中，它实际上就是实实在在的超平面，也就是一个平面，对吧？而在更高维空间中，人们称之为超平面，明白了吗？","start":1510.17,"end":1537.69}],"notes":["本段首先强调了分析课程的重要性，指出即使在数学相关领域，如统计学或机器人学，掌握分析知识对于在学术会议中有效交流和避免误解是必要的。讲者提到，如果一个人在学术会议上被问及与分析相关的术语，如弱*紧性，而没有相关知识，可能会感到困惑甚至产生危机。因此，讲者建议投入时间学习分析课程。","接下来，讲者讨论了凸组合的定义，指出凸组合的定义要求系数之和为1，而锥组合则不需要这一条件。这是通过定义直接规定的，而不是通过其他数学性质推导出来的。讲者强调了这一点，以区分凸组合和锥组合的不同之处。","随后，讲者转向了超平面的定义，指出超平面是单个非零线性方程的解集。在二维空间中，超平面表现为一条直线；在三维空间中，它表现为一个平面；而在更高维度中，它被称为超平面。讲者通过举例说明了不同维度下超平面的表现形式，帮助听众理解这一概念。","讲者还提到，虽然凸组合和锥组合在定义上有明显区别，但它们在数学优化和几何分析中都有重要应用。例如，凸组合用于描述凸集的性质，而锥组合则用于描述锥体的结构。这些概念在后续的课程内容中将被进一步探讨。","此外，讲者指出，理解这些数学概念不仅有助于学术交流，还能帮助学生在实际问题中正确应用相关理论。例如，在优化问题中，超平面常用于定义可行域或目标函数的约束条件。因此，掌握这些基础概念对于深入学习凸优化至关重要。","最后，讲者提到，虽然当前课程内容可能部分为复习，但后续内容将涉及更深入的数学理论和应用，包括超平面的性质及其在优化问题中的作用。这表明课程内容将逐步深入，从基础概念过渡到更复杂的数学工具和方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1366.75,"end":1537.69,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1366.75,"text":"If you don't take it, let's suppose you do a PhD in statistics or something, right? Something, you know, that's math adjacent, right? So you're at a conference someday, five years from now, and you give a perfectly good paper. Everything that you said is right. It's interesting. Some jerk in the back raises the hand and says, oh, you know, is that?"},{"start":1389.78,"text":"Is that weak star compact? And if you've had analysis, then you look at them and you go, number one, yes. Number two, totally irrelevant. If you haven't had analysis, you'll go like, oh, I don't know. And you'll have a crisis and all that. So I'm just saying that's why it's worth a 10-week investment taking analysis. I mean, like for math adjacent courses, like suppose you do robotics, right? And by the way, there are these people out there. I know them."},{"start":1420.57,"text":"The other thing, okay, on that same topic, another one is this. For people who do know analysis, some of them, you will be judged. If you have a hick mathematical dialect and you're not, if you know what you're talking about but not quite using the right word, yeah, people in the room who know analysis will exchange glances and nothing needs to be said."},{"start":1445.04,"text":"You are being judged. Okay. So anyway, fine. That's my pitch for taking analysis. Right. So, okay. It was weird. Yes. Why don't they need to sum to one? Well, this is just a definition. So it is simply by fiat and by definition that a conic combination, they don't have to add up to one. Right. So."},{"start":1469.21,"text":"So that's the origin of where that... So in a convex combination, it is simply part of the definition that they add up to one. So it's literally by definition or by fiat or whatever. Yeah. Okay. Cool."},{"start":1486.12,"text":"Okay, so now we'll get to some stuff that people, I mean, hopefully a lot of this so far is reviews. I mean, some of it will not be review later. We'll get to some interesting stuff soon. But, okay, so first one is, you know, everyone knows what a hyperplane is. So a hyperplane is, it's the set, actually it's the solution set of a single non-zero linear equation."},{"start":1510.17,"text":"That's what a hyperplane is, right? And you know what a hyperplane looks like. You know, in two dimensions, you know, it looks like this. Here's a hyperplane there. Everything on that line, right, satisfies a two-dimensional equation. I mean, sorry, a single equation in two variables, right? So that's what it means. You know, and in three space, it's actually literally a hyperplane. It's a plane, right? And then in higher dimensions, it's what people call a hyperplane, okay? So that's that."}],"speech_gaps":[],"frame":"../frames/v002/009.webp","frame_time":1378.75},{"title":"凸集与半空间","segments":[{"id":99,"text":"That's just like, you know, kind of linear in algebra. Now let's make it interesting and make it, let's make it asymmetric, right? So this is called a half space. So what happens is if it's the set of points, not that have A transpose X equals B, but A transpose X is less than or equal to B. So that's a, so it's actually the solution set of a single non-zero linear inequality.","zh":"这就像你在代数中所知道的那样，有点线性。现在让我们让它变得有趣一些，让它不对称，对吧？这就是所谓的半空间。所以发生的情况是，如果它是点的集合，不是满足 A 乘以 X 等于 B，而是满足 A 乘以 X 小于等于 B。因此，这实际上是单个非零线性不等式的解集。","start":1539.21,"end":1562.59},{"id":100,"text":"Okay that's what you would call this right and that's a half space and it looks like this you","zh":"好的，这就是你所说的这个，这就是半空间，看起来像这样你","start":1563.59,"end":1568.99},{"id":101,"text":"know roughly speaking you know this this is the these are all the points where a transpose x","zh":"粗略地说，你知道，这些是所有满足 A 乘以 x 的点","start":1568.99,"end":1573.91},{"id":102,"text":"equals b these are all the points where a transpose x is bigger than b and here's where","zh":"这些是所有满足 A 乘以 x 大于 b 的点，而这里","start":1573.91,"end":1579.93},{"id":103,"text":"a transpose x is less than or equal to b so that that's the idea and there's a lot of ways to think","zh":"是 A 乘以 x 小于等于 b 的点，所以这就是这个想法，有很多方法可以思考","start":1579.93,"end":1585.55},{"id":104,"text":"think of it geometrically. One way is to say, so here A is the outward normal of that half","zh":"从几何上思考它。一种方法是说，这里 A 是该半空间的外法向量。这就是人们所说的。法向量意味着它垂直于超平面。外向意味着它指向外面。好的？因此它是有方向的，对吧？你不会有像外向这样的概念","start":1585.55,"end":1594.27},{"id":105,"text":"space. That's what people say. Normal means it's perpendicular to the hyperplane. Outward","zh":"意味着它垂直于超平面。外向意味着它指向外面。好的？因此它是有方向的，对吧？你不会有像外向这样的概念","start":1594.27,"end":1600.71},{"id":106,"text":"means it points out. Okay? So it's oriented, right? And you don't have concepts like outward","zh":"意味着它垂直于超平面。外向意味着它指向外面。好的？因此它是有方向的，对吧？你不会有像外向这样的概念","start":1600.71,"end":1605.67},{"id":107,"text":"in linear algebra, right? You just have equality constraints and subspaces, affine sets. Yes?","zh":"这是线性代数的内容，对吧？你只需要等式约束和子空间，仿射集。对吗？","start":1605.67,"end":1611.63},{"id":108,"text":"A has to be, like, one to be a monometer.","zh":"A 必须是，比如说，一个单位矩阵。","start":1611.63,"end":1618.21},{"id":109,"text":"Say that again, what?","zh":"再说一遍，什么？","start":1618.73,"end":1619.67},{"id":110,"text":"Like, it's a magnitude of A has to be one.","zh":"比如说，A 的模必须为一。","start":1619.83,"end":1622.53},{"id":111,"text":"No, no.","zh":"不，不。","start":1622.79,"end":1623.87},{"id":112,"text":"So, like, if it's not one, you have to go back home.","zh":"所以，如果它不是一，你就必须回去。","start":1624.11,"end":1627.43},{"id":113,"text":"No, if something like that is required, I'm going to tell you.","zh":"不，如果像这样的条件被要求，我会告诉你。","start":1628.13,"end":1632.13},{"id":114,"text":"I'm kind of a full disclosure person, right?","zh":"我有点倾向于完全披露，对吧？","start":1632.41,"end":1635.25},{"id":115,"text":"So there's not going to be anything hidden here, like, oh, I didn't tell you A is non-negative or something.","zh":"所以这里不会有隐藏的内容，比如，哦，我没有告诉你A是非负的或者什么的。","start":1635.35,"end":1640.35},{"id":116,"text":"thing so no a is completely general coefficients the norm can be anything you like doesn't matter","zh":"东西所以a是完全一般的系数，范数可以是任何你喜欢的，没关系","start":1640.35,"end":1645.13},{"id":117,"text":"right okay um okay so hyperplanes um they're they're affine sets oh by the way any affine","zh":"对，好的，嗯，好的，超平面，它们是仿射集，顺便说一句，任何仿射","start":1645.13,"end":1653.55},{"id":118,"text":"set is convex right um half spaces are convex right i mean it's i mean it's getting don't","zh":"集都是凸的，对吧，嗯，半空间是凸的，对吧，我是说，我是说，它开始","start":1653.55,"end":1661.37},{"id":119,"text":"worry it starts this can start slow but trust me by the end of the day we're going to get to some","zh":"别担心，这可以慢慢开始，但相信我，到一天结束的时候，我们会得到一些","start":1661.37,"end":1665.23},{"id":120,"text":"some weird stuff, okay, that you didn't know, I bet, okay?","zh":"一些奇怪的东西，好的，你可能不知道，对吧，好的？","start":1665.23,"end":1669.51},{"id":121,"text":"So, okay, next up are Euclidean balls and ellipsoids, right?","zh":"所以，好的，接下来是欧几里得球体和椭球体，对吧？","start":1669.63,"end":1675.77},{"id":122,"text":"So in this class, it's a step up mathematically. So we use the standard notation is that when we have a norm, if it's a sub 2, that means the Euclidean norm. It's a square to the sum of the squares. If it doesn't have a 2 there, it's a generic norm. It's any norm. We'll get to that in a minute. But that's how we're going to, that's the notation, which is completely standard notation. So that's what we're going to do.","zh":"所以在本课程中，数学上是一个提升。所以我们使用标准符号，当我们有一个范数，如果它是下标2，这意味着欧几里得范数。它是平方的和。如果没有2，那就是通用范数。是任何范数。我们稍后会讲到这一点。但这就是我们所使用的符号，这是完全标准的符号。这就是我们要做的。","start":1678.68,"end":1699.24},{"id":123,"text":"So this is what a ball is. A ball is the set of points where the norm of x minus a given vector called xc, the center, is less than or equal to r, where r is a positive number called the radius.","zh":"所以这就是一个球的定义。球是指所有满足向量x与给定向量xc（称为中心）的范数之差小于或等于r的点的集合，其中r是一个正数，称为半径。","start":1699.94,"end":1712.18}],"notes":["本段讲解了凸集的基本概念，特别是半空间的定义。半空间是通过一个线性不等式定义的集合，即A^T x ≤ b。这种集合是凸集，因为任何两点之间的线段都包含在集合中。","讲者提到半空间的几何解释，其中A是超平面的外法向量，即与超平面垂直并指向外部。这与线性代数中的概念不同，线性代数中只有等式约束和子空间。","讲者提到超平面是仿射集，而仿射集是凸集。这为后续讨论凸集的性质奠定了基础。","讲者提到课程内容将逐步深入，从基础概念开始，最终会涉及一些较为复杂的概念，如欧几里得球体和椭球体。","讲者介绍了欧几里得球体的定义，即所有到中心点的距离小于等于半径r的点的集合。这与范数的定义密切相关，特别是欧几里得范数。"],"formulas":[{"latex":"A^T x \\leq b","symbols":"A^T x ≤ b","explanation":"保持原式，符号和条件正确，无需修改。","evidence":"a transpose x is less than or equal to b so that that's the idea and there's a lot of ways to think"},{"latex":"\\|x - x_c\\| \\leq r","symbols":"||x - x_c|| ≤ r","explanation":"保持原式，符号和条件正确，无需修改。","evidence":"So this is what a ball is. A ball is the set of points where the norm of x minus a given vector called xc, the center, is less than or equal to r, where r is a positive number called the radius."}],"uncertainties":["monometer"],"diagram":"none","start":1539.21,"end":1712.18,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复。"],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":1539.21,"text":"That's just like, you know, kind of linear in algebra. Now let's make it interesting and make it, let's make it asymmetric, right? So this is called a half space. So what happens is if it's the set of points, not that have A transpose X equals B, but A transpose X is less than or equal to B. So that's a, so it's actually the solution set of a single non-zero linear inequality."},{"start":1563.59,"text":"okay that's what you would call this right and that's a half space and it looks like this you"},{"start":1568.99,"text":"know roughly speaking you know this this is the these are all the points where a transpose x"},{"start":1573.91,"text":"equals b these are all the points where a transpose x is bigger than b and here's where"},{"start":1579.93,"text":"a transpose x is less than or equal to b so that that's the idea and there's a lot of ways to think"},{"start":1585.55,"text":"think of it geometrically. One way is to say, so here A is the outward normal of that half"},{"start":1594.27,"text":"space. That's what people say. Normal means it's perpendicular to the hyperplane. Outward"},{"start":1600.71,"text":"means it points out. Okay? So it's oriented, right? And you don't have concepts like outward"},{"start":1605.67,"text":"in linear algebra, right? You just have equality constraints and subspaces, affine sets. Yes?"},{"start":1611.63,"text":"A has to be, like, one to be a monometer."},{"start":1618.73,"text":"Say that again, what?"},{"start":1619.83,"text":"Like, it's a magnitude of A has to be one."},{"start":1622.79,"text":"No, no."},{"start":1624.11,"text":"So, like, if it's not one, you have to go back home."},{"start":1628.13,"text":"No, if something like that is required, I'm going to tell you."},{"start":1632.41,"text":"I'm kind of a full disclosure person, right?"},{"start":1635.35,"text":"So there's not going to be anything hidden here, like, oh, I didn't tell you A is non-negative or something."},{"start":1640.35,"text":"thing so no a is completely general coefficients the norm can be anything you like doesn't matter"},{"start":1645.13,"text":"right okay um okay so hyperplanes um they're they're affine sets oh by the way any affine"},{"start":1653.55,"text":"set is convex right um half spaces are convex right i mean it's i mean it's getting don't"},{"start":1661.37,"text":"worry it starts this can start slow but trust me by the end of the day we're going to get to some"},{"start":1665.23,"text":"some weird stuff, okay, that you didn't know, I bet, okay?"},{"start":1669.63,"text":"So, okay, next up are Euclidean balls and ellipsoids, right?"},{"start":1678.68,"text":"So in this class, it's a step up mathematically. So we use the standard notation is that when we have a norm, if it's a sub 2, that means the Euclidean norm. It's a square to the sum of the squares. If it doesn't have a 2 there, it's a generic norm. It's any norm. We'll get to that in a minute. But that's how we're going to, that's the notation, which is completely standard notation. So that's what we're going to do."},{"start":1699.94,"text":"So this is what a ball is. A ball is the set of points where the norm of x minus a given vector called xc, the center, is less than or equal to r, where r is a positive number called the radius."}],"speech_gaps":[],"frame":"../frames/v002/010.webp","frame_time":1551.21},{"title":"椭球体与凸集","segments":[{"id":124,"text":"So that's what a Euclidean ball with center xc and radius r is.","zh":"这就是以中心 xc 和半径 r 为特征的欧几里得球体。","start":1713.32,"end":1720.48},{"id":125,"text":"So that's what that is.","zh":"这就是那个意思。","start":1720.86,"end":1722.86},{"id":126,"text":"And these are convex. I mean, you'd want to show that.","zh":"这些集合是凸的。我的意思是，你可能会想要证明这一点。","start":1725.36,"end":1729.3},{"id":127,"text":"that. It's actually not too hard. Probably some Cauchy-Schwartz thing or something would come in","zh":"其实并不太难。可能需要用到柯西-施瓦茨不等式或者其他类似的东西，一切都会很顺利。","start":1729.3,"end":1733.4},{"id":128,"text":"and everything would be fine. Let's see. An ellipsoid, that's something I'm sure everyone","zh":"椭球体，我相信大家在某个领域或另一个领域都见过，或者应该见过，对吧？","start":1733.4,"end":1740.1},{"id":129,"text":"has seen in one field or another or should have, right? And so that's a set that looks, and there's","zh":"这是一种看起来像这样的集合，而且椭球体有多种写法，这其实相当有趣。","start":1740.1,"end":1747.86},{"id":130,"text":"lots of ways to write ellipsoids, which is actually kind of interesting. And later in the class, about","zh":"在课程大约五周后，我们会做一些事情，比如在椭球体上进行优化。我们会做一些事情","start":1747.86,"end":1751.0},{"id":131,"text":"five weeks in, we're going to be doing things like optimizing over ellipsoids. We'll be doing things","zh":": 在椭球体上进行优化。我们会做一些事情","start":1751.0,"end":1755.1},{"id":132,"text":"like finding the maximum volume ellipsoid that fits inside something or the minimum volume","zh":"比如寻找能够放入某个物体内的最大体积椭球体，或是覆盖某个物体的最小体积椭球体，我们将实际使用椭球体的不同参数化形式来解决这些问题。","start":1755.1,"end":1759.62},{"id":133,"text":"ellipsoid that covers something and we'll actually use different parameterizations of ellipsoids to","zh":"来解决这些问题，所以有很多不同的方式来表达它们，好的，一种方式是","start":1759.62,"end":1765.58},{"id":134,"text":"to solve those problems right so there's lots of different ways to write them okay so one way is","zh":"你说这是所有满足这个二次型的点的集合，当你说到x减去xc的转置乘以p的逆乘以x减去xc小于等于一的时候，顺便说一句，如果p等于单位矩阵，也就是所谓的单位矩阵，如果它被称为小r乘以单位矩阵，那么这就与那个完全相同。","start":1765.58,"end":1771.28},{"id":135,"text":"this is you say it's a set of all points where this is a quadratic form when you say x minus xc","zh":"它实际上等同于一个欧几里得球体，对吧？但椭球体允许它在不同方向上有不同的直径，大致如此。我想你可能已经见过这些了，对吧？这里有一些符号。粗体SN将表示对称的n乘n矩阵的集合。这是一个仿射集。它是一个向量空间。当我们加上双加号时，这意味着它是","start":1771.28,"end":1777.88},{"id":136,"text":"transpose p inverse x minus xc is less than or equal to one by the way if p is equal to the you","zh":"正定的。因此，这些是对称正定矩阵，对吧？而加一个加号时，它是半正定的。好的，所以这就是我们的符号，对吧？还有，这里有一个椭球体。我的意思是，这并不太令人兴奋。这里有一个替代的表示方法，对吧，这很有趣，对吧？因此，当你进行这种操作时，真正需要考虑的是，我的意思是，你可以想象，你知道，不同方式的转换","start":1777.88,"end":1783.92},{"id":137,"text":"you know, the identity, I guess if it's called, if it's little r times the identity, this is identical with that.","zh":"你知道的，单位矩阵，我想如果它被称为小r乘以单位矩阵，这就和那个是一样的。","start":1783.92,"end":1790.84},{"id":138,"text":"It's the same as a Euclidean ball, right? But the ellipsoid allows it to have different, it has different, you know, diameters in different directions, roughly. And I think you've probably seen these things, right? Here's some notation. So bold SN is going to be the set of symmetric n by n matrices. That's an affine set. It's a vector space. When we put a sub plus plus, it means it's","zh":"你可能已经见过这些了，对吧？这里有一些符号。粗体SN将表示对称的n乘n矩阵的集合。这是一个仿射集。它是一个向量空间。当我们加上双加号时，这意味着它是正定的。因此，这些是对称正定矩阵，对吧？而加一个加号时，它是半正定的。好的，所以这就是我们的符号，对吧？还有，这里有一个椭球体。我的意思是，这并不太令人兴奋。这里有一个替代的表示方法，对吧，这很有趣，对吧？因此，当你进行这种操作时，真正需要考虑的是，我的意思是，你可以想象，你知道，不同方式的转换","start":1791.46,"end":1819.05},{"id":139,"text":"positive definite. So these are symmetric positive definite matrices, right? And with a plus, it's positive semi-definite. Okay, so that's going to be our notation, right? And, you know, here's an ellipsoid. I mean, it's not that exciting. Here's an alternate representation, right, which is interesting, right? And so what you really want to think about when you do this is, I mean, you could imagine, you know, different ways to translate between","zh":"正定的。因此，这些都是对称正定矩阵，对吧？而带有加号的则是半正定的。好的，所以这就是我们的记号，对吧？而且，这里有一个椭球体。我的意思是，它并不太令人兴奋。这里有一个替代的表示方法，对吧，这很有趣，对吧？因此，当你进行这种操作时，真正需要思考的是，你可以想象，你知道的，不同方式在它们之间进行转换。","start":1819.53,"end":1848.49},{"id":140,"text":"the different representations or parameterization of an ellipsoid, right? Or, and for example, you might even think in an object or anything, you might actually say, like, you might have to implement the equals equals method. The equals equals method says, when is one ellipsoid equal to another? Okay? So, and that's kind of interesting, the answer. It's not totally straightforward. If the, if it is, if you represent an ellipsoid this way, can someone tell me what the equals equals method is?","zh":"椭球体的不同表示或参数化方式，对吧？或者，比如，你可能会想到一个物体或任何东西，你实际上可能会说，比如，你可能不得不实现equals方法。equals方法会说，什么时候一个椭球体等于另一个椭球体？明白吗？所以，这有点有趣，答案并不是完全直接的。如果它是这样表示的椭球体，有人能告诉我equals方法是什么吗？","start":1849.29,"end":1878.48}],"notes":["本段讲授了椭球体的定义及其与欧几里得球体的关系。椭球体是凸集，可以通过二次型表示，当矩阵P为单位矩阵时，椭球体退化为欧几里得球体。椭球体允许在不同方向上具有不同的直径，这与球体的各向同性不同。"],"formulas":[],"uncertainties":["the equals equals method"],"diagram":"none","start":1713.32,"end":1878.48,"asr_flags":[],"math_clarifications":["公式 $ P = r^2 I $ 不正确，因为椭球体的参数化中，矩阵 $ P $ 应该是一个对称正定矩阵，而不是直接等于半径的平方乘以单位矩阵。正确的表达式应为 $ (x - x_c)^T P^{-1} (x - x_c) \text{ 与 } 1 $ 的关系，而不是直接定义 $ P $ 为 $ r^2 I $。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":1713.32,"text":"So that's what a Euclidean ball with center xc and radius r is."},{"start":1720.86,"text":"So that's what that is."},{"start":1725.36,"text":"And these are convex. I mean, you'd want to show that."},{"start":1729.3,"text":"that. It's actually not too hard. Probably some Cauchy-Schwartz thing or something would come in"},{"start":1733.4,"text":"and everything would be fine. Let's see. An ellipsoid, that's something I'm sure everyone"},{"start":1740.1,"text":"has seen in one field or another or should have, right? And so that's a set that looks, and there's"},{"start":1747.86,"text":"lots of ways to write ellipsoids, which is actually kind of interesting. And later in the class, about"},{"start":1751.0,"text":"five weeks in, we're going to be doing things like optimizing over ellipsoids. We'll be doing things"},{"start":1755.1,"text":"like finding the maximum volume ellipsoid that fits inside something or the minimum volume"},{"start":1759.62,"text":"ellipsoid that covers something and we'll actually use different parameterizations of ellipsoids to"},{"start":1765.58,"text":"to solve those problems right so there's lots of different ways to write them okay so one way is"},{"start":1771.28,"text":"this is you say it's a set of all points where this is a quadratic form when you say x minus xc"},{"start":1777.88,"text":"transpose p inverse x minus xc is less than or equal to one by the way if p is equal to the you"},{"start":1783.92,"text":"you know, the identity, I guess if it's called, if it's little r times the identity, this is identical with that."},{"start":1791.46,"text":"It's the same as a Euclidean ball, right? But the ellipsoid allows it to have different, it has different, you know, diameters in different directions, roughly. And I think you've probably seen these things, right? Here's some notation. So bold SN is going to be the set of symmetric n by n matrices. That's an affine set. It's a vector space. When we put a sub plus plus, it means it's"},{"start":1819.53,"text":"positive definite. So these are symmetric positive definite matrices, right? And with a plus, it's positive semi-definite. Okay, so that's going to be our notation, right? And, you know, here's an ellipsoid. I mean, it's not that exciting. Here's an alternate representation, right, which is interesting, right? And so what you really want to think about when you do this is, I mean, you could imagine, you know, different ways to translate between"},{"start":1849.29,"text":"the different representations or parameterization of an ellipsoid, right? Or, and for example, you might even think in an object or anything, you might actually say, like, you might have to implement the equals equals method. The equals equals method says, when is one ellipsoid equal to another? Okay? So, and that's kind of interesting, the answer. It's not totally straightforward. If the, if it is, if you represent an ellipsoid this way, can someone tell me what the equals equals method is?"}],"speech_gaps":[],"frame":"../frames/v002/011.webp","frame_time":1725.32},{"title":"椭球与范数球的定义与性质","segments":[{"id":141,"text":"When are two ellipsoids equal? When parameterized in terms of p and xc. Yeah, they're equal. xc has to equal xc prime and p has to equal p prime. That's exactly right. How about this one? Yeah, that's right. So the two a's have to be related by a rotation. And how would you figure that out? Well, linear algebra. I mean, we're not going to go into it. So I'm just saying in that case, the equals equals method.","zh":"当两个椭球相等时是什么情况？当用参数p和xc来参数化时。是的，它们是相等的。xc必须等于xc'，p必须等于p'。没错。那这个呢？是的，没错。这两个a必须通过旋转相关联。你如何得出这个结论呢？嗯，线性代数。我的意思是，我们不会深入讨论这个。我只是说在这种情况下，使用等于等于的方法。","start":1879.63,"end":1918.11},{"id":142,"text":"right, is not that simple to implement, right? It's not as straightforward. Okay, so these are","zh":"对，实现起来并不简单，对吧？不像那么直接。好的，这些是","start":1918.76,"end":1923.24},{"id":143,"text":"Euclidean balls and ellipsoids. And these are, so what we're doing is we're actually going through","zh":"欧几里得球体和椭球体。而我们正在做的，实际上是通过","start":1923.24,"end":1926.6},{"id":144,"text":"and looking at some very common convex sets, right? So you will, you'll never, again, next","zh":"并观察一些非常常见的凸集，对吧？所以你以后再看到椭球体或半空间时，就会知道它们是凸的。有一个问题。","start":1926.6,"end":1934.0},{"id":145,"text":"time you see an ellipsoid or a half space, you'll just know it's convex. There's a question.","zh":"为什么这里的定义是P的逆矩阵而不是P？这只是个标记吗？","start":1934.0,"end":1939.1},{"id":146,"text":"Why is, why the definition of P inverse here instead of P? Is that just a signifier?","zh":"你也可以使用，所以问题是为什么这里用P的逆矩阵而不是P","start":1939.66,"end":1944.5},{"id":147,"text":"You could use yeah, so the question is why P inverse here and not P","zh":"事实是你可以使用其中任何一个，因为对称正定矩阵的逆矩阵仍然是正定的","start":1944.5,"end":1947.86},{"id":148,"text":"The truth is you could use either because the inverse of a symmetric positive definite matrix is positive definite","zh":"事实是你可以使用其中任何一个，因为对称正定矩阵的逆矩阵仍然是正定的","start":1947.86,"end":1953.74},{"id":149,"text":"So and people do sometimes it's convenient to make that not P, but P inverse","zh":"所以，人们有时会方便地将它设为不是 P，而是 P 的逆","start":1953.74,"end":1959.7},{"id":150,"text":"Sorry, you know what I meant, right? So not P inverse but P or something like that. Yeah, so good good question","zh":"抱歉，你知道我的意思，对吧？所以不是 P 的逆，而是 P 或者类似的东西。是的，很好的问题","start":1961.04,"end":1966.94},{"id":151,"text":"Yes","zh":"是的","start":1967.46,"end":1967.94},{"id":152,"text":"happening about, about A? Oh, uh, this one. So I can, if I want to make A, I could insist that A","zh":"关于 A 的事情？哦，那个。所以，如果我想构造 A，我可以坚持让 A","start":1974.8,"end":1982.26},{"id":153,"text":"is symmetric positive definite. So every representation of this form has one with A","zh":"是对称正定的。因此，这种形式的每一个表示都有一个对称正定的 A","start":1982.26,"end":1989.38},{"id":154,"text":"symmetric positive definite. And then, then the equals equals method is very simple.","zh":"然后，等式的方法非常简单。","start":1989.38,"end":1993.96},{"id":155,"text":"Right. So, okay. So we'll, we'll move on. Okay. Then we have the idea of norm balls. So here I","zh":"对的。所以，好的。我们将继续。好的。然后我们有范数球的概念。所以这里我","start":1994.72,"end":2004.2},{"id":156,"text":"I just have a general norm.","zh":"我只有一般范数。","start":2004.2,"end":2005.7},{"id":157,"text":"And again, I'm going to review the fact that you're at a level of mathematical sophistication","zh":"再次，我要回顾的是你已经处于一个数学成熟度的水平","start":2005.84,"end":2010.62},{"id":158,"text":"where you might as well just use the standard for what it means to be a norm, right?","zh":"在这里，你可以直接使用标准来定义什么是范数，对吧？","start":2010.62,"end":2015.28},{"id":159,"text":"So a norm is just a function.","zh":"范数只是一个函数。","start":2015.52,"end":2016.64},{"id":160,"text":"it's written by convention with this weird infix form.","zh":"它按照惯例以这种奇怪的中缀形式书写。","start":2017.3,"end":2021.6},{"id":161,"text":"In other words, you put the argument in the middle","zh":"换句话说，你把参数放在中间","start":2021.8,"end":2024.2},{"id":162,"text":"and you put these double bars.","zh":"并且用这两个竖线表示。","start":2024.2,"end":2025.06},{"id":163,"text":"And the double bars, right, are supposed to suggest to you","zh":"而这两个竖线，对吧，是为了提示你","start":2025.12,"end":2028.42},{"id":164,"text":"that this is a generalization of the absolute value for reals, right?","zh":"这是一般化了实数的绝对值的概念，对吧？","start":2028.42,"end":2032.64},{"id":165,"text":"I mean, you probably knew all this,","zh":"我的意思是，你可能早就知道这些了","start":2032.76,"end":2034.48},{"id":166,"text":"and I'm sure you've seen this, right?","zh":"我确信你见过这个，对吧？","start":2034.5,"end":2035.84},{"id":167,"text":"But a norm is any function that is non-negative.","zh":"但范数是任何非负的函数","start":2036.26,"end":2039.4},{"id":168,"text":"This is called definite.","zh":"这被称为正定","start":2039.46,"end":2040.3},{"id":169,"text":"It says that it is zero only if the norm is zero, right?","zh":"它表示只有当范数为零时，它才为零，对吧？","start":2040.52,"end":2045.44},{"id":170,"text":"right? And it's homogeneous of degree one. That's what this says. And it satisfies the triangle","zh":"对吧？并且它是次数为一的齐次函数。这就是它所说的。并且它满足三角不等式，对吧？","start":2045.44,"end":2051.16},{"id":171,"text":"inequality, right? And there's a bunch of, you know, this, well, there's a lot of norms, right?","zh":"对吧？而且有很多这样的范数，对吧？","start":2051.16,"end":2055.28},{"id":172,"text":"In this class, when we write down, I mean, this is just completely standard","zh":"在这门课中，当我们写下这些时，我的意思是，这完全是标准的","start":2056.06,"end":2059.38}],"notes":["本段讨论了椭球的定义与相等条件，指出两个椭球相等当且仅当它们的中心和形状参数完全相同。此外，还提到椭球可以通过旋转来变换，这需要线性代数的知识。"],"formulas":[{"latex":"A \\text{ is symmetric positive definite}","symbols":"A 是对称正定矩阵","explanation":"该公式正确描述了矩阵A的性质，即对称正定性，符合数学定义。","evidence":"happening about, about A? Oh, uh, this one. So I can, if I want to make A, I could insist that A is symmetric positive definite. So every representation of this form has one with A"}],"uncertainties":["在讨论 P 和 P^{-1} 的使用时，部分句子的连贯性可能存在问题，例如 'You could use yeah' 可能是 'You could use, yeah' 的误识别。"],"diagram":"none","start":1879.63,"end":2059.38,"asr_flags":[],"math_clarifications":["原始片段中未明确提及矩阵A的具体定义或上下文，但根据上下文推测，A可能与椭球体的参数相关，因此保持原公式。"],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":1879.63,"text":"When are two ellipsoids equal? When parameterized in terms of p and xc. Yeah, they're equal. xc has to equal xc prime and p has to equal p prime. That's exactly right. How about this one? Yeah, that's right. So the two a's have to be related by a rotation. And how would you figure that out? Well, linear algebra. I mean, we're not going to go into it. So I'm just saying in that case, the equals equals method."},{"start":1918.76,"text":"right, is not that simple to implement, right? It's not as straightforward. Okay, so these are"},{"start":1923.24,"text":"Euclidean balls and ellipsoids. And these are, so what we're doing is we're actually going through"},{"start":1926.6,"text":"and looking at some very common convex sets, right? So you will, you'll never, again, next"},{"start":1934.0,"text":"time you see an ellipsoid or a half space, you'll just know it's convex. There's a question."},{"start":1939.66,"text":"Why is, why the definition of P inverse here instead of P? Is that just a signifier?"},{"start":1944.5,"text":"You could use yeah, so the question is why P inverse here and not P"},{"start":1947.86,"text":"The truth is you could use either because the inverse of a symmetric positive definite matrix is positive definite"},{"start":1953.74,"text":"So and people do sometimes it's convenient to make that not P, but P inverse"},{"start":1961.04,"text":"Sorry, you know what I meant, right? So not P inverse but P or something like that. Yeah, so good good question"},{"start":1967.46,"text":"Yes"},{"start":1974.8,"text":"happening about, about A? Oh, uh, this one. So I can, if I want to make A, I could insist that A"},{"start":1982.26,"text":"is symmetric positive definite. So every representation of this form has one with A"},{"start":1989.38,"text":"symmetric positive definite. And then, then the equals equals method is very simple."},{"start":1994.72,"text":"Right. So, okay. So we'll, we'll move on. Okay. Then we have the idea of norm balls. So here I"},{"start":2004.2,"text":"I just have a general norm."},{"start":2005.84,"text":"And again, I'm going to review the fact that you're at a level of mathematical sophistication"},{"start":2010.62,"text":"where you might as well just use the standard for what it means to be a norm, right?"},{"start":2015.52,"text":"So a norm is just a function."},{"start":2017.3,"text":"it's written by convention with this weird infix form."},{"start":2021.8,"text":"In other words, you put the argument in the middle"},{"start":2024.2,"text":"and you put these double bars."},{"start":2025.12,"text":"And the double bars, right, are supposed to suggest to you"},{"start":2028.42,"text":"that this is a generalization of the absolute value for reals, right?"},{"start":2032.76,"text":"I mean, you probably knew all this,"},{"start":2034.5,"text":"and I'm sure you've seen this, right?"},{"start":2036.26,"text":"But a norm is any function that is non-negative."},{"start":2039.46,"text":"This is called definite."},{"start":2040.52,"text":"It says that it is zero only if the norm is zero, right?"},{"start":2045.44,"text":"right? And it's homogeneous of degree one. That's what this says. And it satisfies the triangle"},{"start":2051.16,"text":"inequality, right? And there's a bunch of, you know, this, well, there's a lot of norms, right?"},{"start":2056.06,"text":"In this class, when we write down, I mean, this is just completely standard"}],"speech_gaps":[{"start":1968.34,"end":1970.784},{"start":1970.784,"end":1974.4}],"frame":"../frames/v002/012.webp","frame_time":1891.63},{"title":"范数与范数球","segments":[{"id":173,"text":"mathematical notation. A norm is just a norm. It's just, it's any function that satisfies these","zh":"数学符号。范数就是一种范数。它只是任何满足这些条件的函数，对吧？","start":2059.38,"end":2064.88},{"id":174,"text":"three things, period, right? And if we want to indicate a particular norm, we'll put a mnemonic","zh":"如果我们想要表示一个特定的范数，我们会在其下方加上一个助记符或某种符号来告诉你这是哪种范数，对吧？","start":2064.88,"end":2072.02},{"id":175,"text":"or some kind of symbol below it to tell you what norm it is, right?","zh":"所以，我们会这样做。","start":2072.02,"end":2075.22},{"id":176,"text":"So, yeah, so we'll do stuff like that.","zh":"是的，我们会这样做。","start":2076.6,"end":2080.0},{"id":177,"text":"And there'll be some interesting ones, right?","zh":"将会有一些有趣的范数，对吧？","start":2080.08,"end":2081.56},{"id":178,"text":"Okay, let's see.","zh":"好的，我们来看看。","start":2084.68,"end":2085.62},{"id":179,"text":"We could look at a norm ball.","zh":"我们可以看一下范数球。","start":2086.64,"end":2089.72},{"id":180,"text"
