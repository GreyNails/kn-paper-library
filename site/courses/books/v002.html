 were going to change the book, I'd probably not use the squiggly for that. But it doesn't matter. And the same is true for matrix inequality. These are so common that we drop this. So basically, from now on, you see a squiggly inequality between vectors. It means element-wise. You see a squiggly inequality between two symmetric matrices. It means..."}],"speech_gaps":[],"frame":"../frames/v002/026.webp","frame_time":4236.97},{"title":"不等式与符号设计","segments":[{"id":293,"text":"Some people call it the loner ordering. It's very fancy ways to say it. It means the difference is positive semi-definite. That's what it means. So that's how that works. Now it turns out, when you're making a notation, and there's an inequality, the whole point of making notation is, so the idea of notation is you want it to evoke something that you already know about."},{"id":294,"text":"Everybody here knows about inequality between numbers. Everybody here. So it's like a norm, an absolute value. The notation is close. It's supposed to evoke that. Now, it can't be just that, or then it's silly. It's not a generalization. But the difference, so what you really want is you want, whenever you see something like this where we're going to overload or extend some symbol in a more sophisticated setting,"},{"id":295,"text":"You're supposed to import your intuition, right? So you'd say, yeah, well, you know, A is less than B and C is less than D, then I think A plus B should be less than C plus D. Most of those things you think are true and some are false."},{"id":296,"text":"So you've got to be on your toes to know which is correct and which is not. And that's your job. But that's what good notation is for. That's like, think about matrices. What are you doing? You say, seriously? You're multiplying three numbers? And they're like, no, dude. That's a 10,000 by 1,000 matrix. That's a vector. That's blah, blah, blah. You see what I'm saying? But the notation looks super innocent. So that's kind of the idea behind good notation design. OK."},{"id":297,"text":"Okay, so what is the main difference with vectors? Well, it's kind of obvious, right? If your base model for what an inequality is is inequality on R, then that's got a property which is extremely important. It's called a total ordering. And that means that for any two numbers, either one's less than the other or the other way around, period. That's what it means to be a linear ordering or total ordering. Those would be the fancy names in math, you would say. Okay? Now..."},{"id":298,"text":"For vectors, that's just not the case, right? So that's interesting, right? So, I mean, for example, I mean, let's just do a couple of examples. Let's look at the inequality that looks like this, right?"}],"notes":["本段讲解了不等式符号的设计原则，强调符号应唤起已知的概念，如数值不等式、范数和绝对值。同时指出，符号不能仅停留在简单层面，否则无法构成有效的泛化。","讲者提到，当在更复杂的背景下重载或扩展符号时，应导入已有的直觉。例如，若A \u003c B且C \u003c D，则A + B \u003c C + D可能成立，但并非总是如此，需要谨慎判断。","讲者通过矩阵乘法的例子说明，符号设计应直观且易于理解，即使面对高维数据或复杂结构，符号也应保持简洁和清晰。","讲者指出，数值不等式具有全序性质，即任意两个数之间存在明确的大小关系，而向量不等式不具备这一性质，因此需要不同的处理方式。","讲者提到，向量不等式可能涉及正半定性等概念，这与数值不等式的全序性质形成对比，强调了符号设计在不同数学结构中的重要性。","最后，讲者提到将通过具体例子进一步说明向量不等式的特性，但当前段落未给出具体例子，仅强调了符号设计和不等式性质的对比。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4397.37,"end":4545.83,"asr_flags":[],"raw_segments":[{"start":4397.37,"text":"Some people call it the loner ordering. It's very fancy ways to say it. It means the difference is positive semi-definite. That's what it means. So that's how that works. Now it turns out, when you're making a notation, and there's an inequality, the whole point of making notation is, so the idea of notation is you want it to evoke something that you already know about."},{"start":4425.39,"text":"Everybody here knows about inequality between numbers. Everybody here. So it's like a norm, an absolute value. The notation is close. It's supposed to evoke that. Now, it can't be just that, or then it's silly. It's not a generalization. But the difference, so what you really want is you want, whenever you see something like this where we're going to overload or extend some symbol in a more sophisticated setting,"},{"start":4456.19,"text":"You're supposed to import your intuition, right? So you'd say, yeah, well, you know, A is less than B and C is less than D, then I think A plus B should be less than C plus D. Most of those things you think are true and some are false."},{"start":4470.77,"text":"So you've got to be on your toes to know which is correct and which is not. And that's your job. But that's what good notation is for. That's like, think about matrices. What are you doing? You say, seriously? You're multiplying three numbers? And they're like, no, dude. That's a 10,000 by 1,000 matrix. That's a vector. That's blah, blah, blah. You see what I'm saying? But the notation looks super innocent. So that's kind of the idea behind good notation design. OK."},{"start":4499.85,"text":"Okay, so what is the main difference with vectors? Well, it's kind of obvious, right? If your base model for what an inequality is is inequality on R, then that's got a property which is extremely important. It's called a total ordering. And that means that for any two numbers, either one's less than the other or the other way around, period. That's what it means to be a linear ordering or total ordering. Those would be the fancy names in math, you would say. Okay? Now..."},{"start":4528.22,"text":"For vectors, that's just not the case, right? So that's interesting, right? So, I mean, for example, I mean, let's just do a couple of examples. Let's look at the inequality that looks like this, right?"}],"speech_gaps":[],"frame":"../frames/v002/027.webp","frame_time":4409.37},{"title":"向量比较与最小值概念","segments":[{"id":299,"text":"This says this two vector is less than or equal to that one. What it means is that x is less than u and y is less than v. So it's extremely easy to find two points where neither two vectors, where it is false that one is less than the other and the other way around. It's not a linear ordering. I mean, this is kind of obvious. And this is going to come up later when, for example, these become multiple objectives that we want small."},{"id":300,"text":"Like, you know, I want to have a good fit on, you know, I want to have good training data fit. And I also want the complexity of the model to be low, right? Then these are just going to be two different things. And then you're going to have, you will have incomparable designs, right? That it will neither be true that one is bigger than the other. So what happens now is you have, from your intuition about numbers, you have ideas involving minimum."},{"id":301,"text":"Right? Like you can talk about the minimum of a bunch of numbers. Guess what? You cannot talk about the minimum. But you can talk about the minimum of a set of vectors, but it's a very specific thing. What happens is, because it's not a linear order, a bunch of ideas that were the same on R, they bifurcate. And now it turns out that all your intuition about minimum, all this kind of stuff in R, now there's going to be two concepts. And actually they are minimum and minimal."},{"id":302,"text":"Okay, so this is the this is the picture and again, this is like weird and abstract right now All of this is going to have a lot of applications later. Okay, so So here's the definition. No minimum is super strong. It basically says This is a minimum element means everything else in the set is comparable to me and bigger Period okay, that's that's so for example in the minimum and the minimum element of"},{"id":303,"text":"of a set in let's say an r2 with respect to the second order cone this is a this is a perfect example s1 has a minimum point and it's this one right because everything in this set is comparable to this point and bigger in the in the vector sense right so that that's minimal and it's easy to see you can have a set that doesn't have a minimal point there's just sorry minimum"},{"id"  what happens now is you have, from your intuition about numbers, you have ideas involving minimum."},{"start":4608.33,"text":"Right? Like you can talk about the minimum of a bunch of numbers. Guess what? You cannot talk about the minimum. But you can talk about the minimum of a set of vectors, but it's a very specific thing. What happens is, because it's not a linear order, a bunch of ideas that were the same on R, they bifurcate. And now it turns out that all your intuition about minimum, all this kind of stuff in R, now there's going to be two concepts. And actually they are minimum and minimal."},{"start":4637.07,"text":"Okay, so this is the this is the picture and again, this is like weird and abstract right now All of this is going to have a lot of applications later. Okay, so So here's the definition. No minimum is super strong. It basically says This is a minimum element means everything else in the set is comparable to me and bigger Period okay, that's that's so for example in the minimum and the minimum element of"},{"start":4666.89,"text":"of a set in let's say an r2 with respect to the second order cone this is a this is a perfect example s1 has a minimum point and it's this one right because everything in this set is comparable to this point and bigger in the in the vector sense right so that that's minimal and it's easy to see you can have a set that doesn't have a minimal point there's just sorry minimum"},{"start":4697.1,"text":"Minimum point. Doesn't have a minimum point. Now, minimal is a weaker term. And it says this. A point is minimal if any point which is in the set and better than or equal or less than or equal to u, then it's u. So there's no point in the set that is less than or equal to u except u."},{"start":4722.7,"text":"there that's that's that's the right way to say it right and so here's a picture here and"}],"speech_gaps":[],"frame":"../frames/v002/028.webp","frame_time":4562.64},{"title":"比较性与不可比较点","segments":[{"id":306,"text":"geo function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
