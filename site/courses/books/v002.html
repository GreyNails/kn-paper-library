e function, and you divide."},{"start":3825.99,"text":"by this a scalar affine function this is called this is called linear fractional function looks like that and by the way our our rule here is the domain is this thing's going to be positive right so that's a linear fractional function they come up in a ton of applications they come up actually this is things like if you're conditioning in probability"},{"start":3847.83,"text":"Conditioning is actually nothing but a linear fractional function on a probability mass function. For example, it comes up in vision all the time. For example, if I see a 3D thing and I want to know what is the image on my retina, let's pretend my retina is flat. If I say, what is it? The answer is, it's a linear fractional function."},{"start":3873.4,"text":"that's what it is right and you know this right like because look if i if i hold this like this and i look at it um i mean you kind of know what what's happening here right i mean let's make it this is good enough here i'll i'll uh"},{"start":3888.25,"text":"Yeah, so obviously this is closer, so that's actually kind of bigger. Now, our brains have evolved to handle that, and that's a cue that this is closer than that. But whatever the image is, like in a photograph or on my retina, it's definitely not a linear mapping, right? So that's a linear fractional function. So if you want to believe this, it's in the book. You could read it. It's like, you know, whatever, half a page to prove it. It's not hard."}],"speech_gaps":[],"frame":"../frames/v002/023.webp","frame_time":3757.64},{"title":"凸函数的几何直观与线性映射","segments":[{"id":275,"text":"But, you know, a good way to think of it intuitively is this. What I'll show you, I'll argue, this is going to be completely intuitive and geometric, but I'm going to argue that line segments get mapped to line segments.","zh":"但你知道，一个很好的直观思考方式是这样的。我要向你展示的，我会论证，这将完全直观且几何化，但我将论证线段会被映射为线段。","start":3916.62,"end":3930.64},{"id":276,"text":"That's and that's good enough because then if I if my function is convex and I know that every line segment You know that you that that's in your set, you know gets mapped to one then that that that's good enough Okay, so then the question is this here's a line segment and I look at it Okay, so I look at my and I and I then we ask what does it look like on my retina? The answer is it's a line segment. Do we agree? It's that into in two dimensions, right?","zh":"这已经足够好了，因为如果我的函数是凸的，并且我知道每一个线段，你知道，你在集合中的线段，你知道会被映射为一个线段，那么这就足够了。好的，那么问题是这样的，这里有一个线段，我观察它。好的，我观察我的，然后我们问它在我的视网膜上看起来是什么样子？答案是它是一个线段。我们同意吗？这是二维空间中的情况，对吧？","start":3932.29,"end":3958.85},{"id":277,"text":"Okay, now I'm going to ask you a question just to make sure we're not fooling ourselves here. The midpoint of this thing maps to a point on my retina. Is it the midpoint of the line segment on my retina? No, it is not. Okay, so that tells you you're not... Oh, by the way, unless I'm like way, way far away and that's an approximation of... That's an approximation, right? If you have a telephoto lens, that image mapping, image formation, it's pretty much linear, right?","zh":"好的，我现在要问你一个问题，以确保我们没有欺骗自己。这个线段的中点映射到我的视网膜上是一个点。这个点是否是视网膜上线段的中点？不是，它不是。好的，这告诉你你不是……顺便说一句，除非我离得非常远，而这是……这是近似，对吧？如果你有一个长焦镜头，图像映射，图像形成，基本上是线性的，对吧？","start":3959.24,"end":3986.12},{"id":278,"text":"But not if you're up close. So that's my visual argument that uses a pencil to argue that perspective mappings preserve convexity. Here's just a quick example to see what this looks like. So here's a linear fractional function. It's x divided by, you just scale x wherever you are.","zh":"但如果你离得近，就不是这样。因此，这是我的视觉论点，用铅笔来论证透视映射保持凸性。这里有一个快速的例子，来看看这看起来是什么样子。这里有一个线性分式函数。它是 x 除以，你只是在你所在的位置缩放 x。","start":3986.62,"end":4010.69},{"id":279,"text":"How you scale it depends on this denominator, which is x1 plus x2 plus 1. We assume that's positive, so that says that you live over here. This is like the netherworld. We don't go there, right? But this is where it's positive. And this coefficient here, right over here, it's gigantic, right? And it gets smaller and smaller and smaller the farther you go away. So if this is the set C, this is the image under F of C. And it's this bump right here that translates over to there.","zh":"你如何缩放它取决于这个分母，即 x1 加上 x2 加上 1。我们假设它是正的，因此这说明你生活在这里。这是类似异界的地方。我们不去那里，对吧？但这是它为正的地方。而这里的这个系数，就在右边，它是巨大的，对吧？并且它随着你离得越远就越小。因此，如果这是集合 C，这是 F 在 C 上的像。这是这个凸起，它被映射到那里。","start":4011.29,"end":4039.79},{"id":280,"text":"Okay, and you know a good way to understand this is take this thing Put it on the ground like that and now fly a drone over it and look down and you get get close enough That I mean, I think the word is for sure. It's for shortening, right? So you get close enough then in fact, this thing is closer to you So it looks all big looks like and that's what it's gonna look like So that's why these these things look very familiar to us because well, hey, it's how our eyes work, right? So everybody","zh":"好的，你们知道一个理解这个问题的好方法是把这个物体放在地上像这样，然后飞一架无人机在它上方飞行并向下看，靠近到足够近的距离。我的意思是，我想这个词肯定是对的。它是用来缩短距离的，对吧？所以当你足够靠近时，实际上这个物体就离你更近了，看起来更大，看起来就是这样。这就是为什么这些物体对我们来说看起来非常熟悉，因为，嘿，这正是我们眼睛的工作方式，对吧？所以每个人","start":4040.27,"end":4068.41}],"notes":["本段主要讨论凸函数的几何直观，通过线性映射和透视变换来解释凸性保持的性质。讲者指出，线段在映射后仍然保持为线段，这是凸函数的一个重要性质。然而，中点在映射后不一定保持为中点，除非在远距离的情况下，这种映射可以近似为线性。这说明了凸函数在几何变换下的不变性，但需要考虑具体条件。","讲者通过一个线性分式函数的例子来说明凸性在映射下的保持。该函数的分母为x1 + x2 + 1，假设其为正，因此定义域为某个区域。系数随着距离的增加而减小，这导致了图像的变形。这种变形在远距离时可以近似为线性，而在近距离时则不成立。","讲者进一步通过一个实际例子来说明这种映射的直观效果。他提到将物体放在地面上，然后用无人机从上方观察，当距离足够近时，物体看起来更大，这与人眼的成像方式一致。这说明了凸性在实际观察中的表现，以及透视变换对凸性的影响。","讲者强调，虽然透视变换可以近似为线性，但并非所有情况下都成立。因此，在讨论凸性保持时，必须明确映射的条件和距离的影响。这为后续讨论凸函数的性质和应用提供了基础。","讲者通过视觉和实际例子的结合，帮助学生理解凸函数在几何变换下的行为。这种直观的解释有助于学生建立对凸函数性质的深刻理解，同时提醒他们在实际应用中注意条件的限制。","本段内容涉及凸函数的几何直观、线性映射的性质以及透视变换的影响。这些概念为后续讨论凸优化问题的几何解释和应用奠定了基础。"],"formulas":[],"uncertainties":["x1 plus x2 plus 1","this coefficient here, right over here, it's gigantic, right? And it gets smaller and smaller and smaller the farther you go away"],"diagram":"none","start":3916.62,"end":4068.41,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3916.62,"text":"But, you know, a good way to think of it intuitively is this. What I'll show you, I'll argue, this is going to be completely intuitive and geometric, but I'm going to argue that line segments get mapped to line segments."},{"start":3932.29,"text":"That's and that's good enough because then if I if my function is convex and I know that every line segment You know that you that that's in your set, you know gets mapped to one then that that that's good enough Okay, so then the question is this here's a line segment and I look at it Okay, so I look at my and I and I then we ask what does it look like on my retina? The answer is it's a line segment. Do we agree? It's that into in two dimensions, right?"},{"start":3959.24,"text":"Okay, now I'm going to ask you a question just to make sure we're not fooling ourselves here. The midpoint of this thing maps to a point on my retina. Is it the midpoint of the line segment on my retina? No, it is not. Okay, so that tells you you're not... Oh, by the way, unless I'm like way, way far away and that's an approximation of... That's an approximation, right? If you have a telephoto lens, that image mapping, image formation, it's pretty much linear, right?"},{"start":3986.62,"text":"But not if you're up close. So that's my visual argument that uses a pencil to argue that perspective mappings preserve convexity. Here's just a quick example to see what this looks like. So here's a linear fractional function. It's x divided by, you just scale x wherever you are."},{"start":4011.29,"text":"How you scale it depends on this denominator, which is x1 plus x2 plus 1. We assume that's positive, so that says that you live over here. This is like the netherworld. We don't go there, right? But this is where it's positive. And this coefficient here, right over here, it's gigantic, right? And it gets smaller and smaller and smaller the farther you go away. So if this is the set C, this is the image under F of C. And it's this bump right here that translates over to there."},{"start":4040.27,"text":"Okay, and you know a good way to understand this is take this thing Put it on the ground like that and now fly a drone over it and look down and you get get close enough That I mean, I think the word is for sure. It's for shortening, right? So you get close enough then in fact, this thing is closer to you So it looks all big looks like and that's what it's gonna look like So that's why these these things look very familiar to us because well, hey, it's how our eyes work, right? So everybody"}],"speech_gaps":[],"frame":"../frames/v002/024.webp","frame_time":3928.62},{"title":"凸优化中的广义不等式","segments":[{"id":281,"text":"Got this? And it is not remotely obvious that these preserve convexity, but they do. And we'll see some crazy consequences of this later in various practical settings. It's going to be super interesting. Okay, next topic is generalized inequalities. So we've actually already seen two, and we've already seen the two most important ones. So let me explain what it is.","zh":"明白了吗？而且这些保持凸性这一点并不明显，但它们确实如此。我们之后会在各种实际场景中看到这些特性带来的奇怪后果。这将会非常有趣。好的，下一个主题是广义不等式。实际上我们已经看到了两个，而且已经看到了最重要的两个。让我来解释一下这是什么。","start":4069.48,"end":4098.27},{"id":282,"text":"Suppose I have a convex cone. It's a proper cone if it's closed, so it contains limits or whatever. Again, that's analysis and we don't have to worry about it. It's solid. That's a technical term that means it has non-empty interior. It's pointed, which means it contains no line. Again, I think these are really good. I don't know who chose these words.","zh":"假设我有一个凸锥。如果它是闭合的，那么它就是一个正则锥，也就是说它包含极限或任何其他东西。再次强调，这是分析学的内容，我们不需要担心。它是实心的，这是一个技术术语，意思是它有非空的内部。它是尖的，这意味着它不包含任何直线。再次，我认为这些术语真的很棒。我不知道是谁选择了这些词。","start":4099.79,"end":4125.51},{"id":283,"text":"It's the non-negative orthant. That's a famous one, right? It's going to come up a lot. You know, non-negative orthant, I mean, it looks like, it's kind of a weird name, right? In 2D, it's just this thing, right? In 3D, there's eight orthants, and it's one of them.","zh":"它是一个非负正交锥。这是一个著名的例子，对吧？它会经常出现。你知道，非负正交锥，我的意思是，它看起来有点奇怪，对吧？在二维情况下，它只是这样一个区域，对吧？在三维情况下，有八个正交锥，而它就是其中之一。","start":4126.56,"end":4147.06},{"id":284,"text":"It's like orthant number one. I don't know how people name those, right? In fact, I don't even know what this is. Is this quadrant two or quadrant? Anyway, whatever your quadrant labeling method is, this is a quadrant, right? So why you would call it orthant in higher dimensions, I don't know, but it's what stuck, okay? So language is weird.","zh":"它就像是正交锥的第一个。我不知道人们是怎么给这些命名的，对吧？事实上，我甚至不知道这个是什么。这是第二象限还是第一象限？不管你的象限标记方法是什么，这都是一个象限，对吧？所以为什么在高维空间中要称它为正交锥，我就不知道了，但这就是约定俗成的，好吧？语言真的很奇怪。","start":4147.45,"end":4169.85},{"id":285,"text":"And it's just, so it's a set of non-negative vectors, right? Positive semi-definite cone, we already saw that. But it turns out, you know, it's closed, right? And it's solid. In other words, there is no matrix that is positive semi-definite. And it's negative as positive semi-definite. Oh, except zero. That's the only one, right? So that's what it means to be pointed, okay?","zh":"它只是一个非负向量的集合，对吧？正半定锥，我们已经见过这个了。但事实上，你知道吗，它是闭合的，对吧？而且它是实心的。换句话说，不存在正半定的矩阵。它和正半定相反。哦，除了零矩阵，这是唯一的例外，对吧？这就是尖的含义，对吧？","start":4170.34,"end":4193.48},{"id":286,"text":"And, you know, you get weird stuff like the set of coefficients of polynomials that are non-negative on some interval, right? I'm just mentioning this because there's some just weird ones, right? So these are called, these are going to be called proper cones. And let me explain, let me show you some improper cones in R2 just to make it clear. So, oh, here's a cone. Oh, by the way, this is just called a ray, right? So it's all points that go.","zh":"而且，你会遇到一些奇怪的东西，比如在某个区间上非负的多项式的系数集合，对吧？我只是提到这个，因为有一些非常奇怪的例子，对吧？这些被称为正则锥。让我解释一下，让我在二维空间中展示一些不正则的锥，以明确这个概念。哦，这里有一个锥。顺便说一句，这只是一个射线，对吧？它包含所有沿着这个方向延伸的点。","start":4194.83,"end":4224.0}],"notes":["本段讲解了广义不等式中的凸锥概念，特别是正锥（proper cone）的定义和性质。讲者提到正锥需要满足闭合性、实心性（非空内部）和尖点性（不含直线）。这些条件确保了锥的结构能够支持不等式分析。","讲者以非负正交（non-negative orthant）为例，说明了在二维和三维空间中正锥的结构。在二维中，非负正交是第一象限；在三维中，正交被扩展为八个正交区域。讲者指出，尽管名称可能显得奇怪，但这是数学界广泛接受的术语。","讲者进一步解释了正锥的尖点性，即正锥中没有直线，这与正定矩阵的性质相关。正定矩阵的集合是闭合且实心的，但只有零矩阵是负的正定矩阵，这体现了正锥的尖点性。","讲者还提到，正锥可以用于描述多项式在某些区间上非负的系数集合，这展示了正锥在实际问题中的应用。这些正锥被称为正锥（proper cone），而其他不符合条件的锥则被称为非正锥（improper cone）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4069.48,"end":4224.0,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4069.48,"text":"Got this? And it is not remotely obvious that these preserve convexity, but they do. And we'll see some crazy consequences of this later in various practical settings. It's going to be super interesting. Okay, next topic is generalized inequalities. So we've actually already seen two, and we've already seen the two most important ones. So let me explain what it is."},{"start":4099.79,"text":"Suppose I have a convex cone. It's a proper cone if it's closed, so it contains limits or whatever. Again, that's analysis and we don't have to worry about it. It's solid. That's a technical term that means it has non-empty interior. It's pointed, which means it contains no line. Again, I think these are really good. I don't know who chose these words."},{"start":4126.56,"text":"Excellent choice, I think, right? Because they're completely evocative. Okay, so here's an example. It's the non-negative orphan. That's a famous one, right? It's going to come up a lot. You know, non-negative orphan, I mean, it looks like, it's kind of a weird name, right? In 2D, it's just this thing, right? In 3D, there's eight orphans, and it's one of them."},{"start":4147.45,"text":"It's like orthant number one. I don't know how people name those, right? In fact, I don't even know what this is. Is this quadrant two or quadrant? Anyway, whatever your quadrant labeling method is, this is a quadrant, right? So why you would call it orthant in higher dimensions, I don't know, but it's what stuck, okay? So language is weird."},{"start":4170.34,"text":"And it's just, so it's a set of non-negative vectors, right? Positive semi-definite cone, we already saw that. But it turns out, you know, it's closed, right? And it's solid. In other words, there is no matrix that is positive semi-definite. And it's negative as positive semi-definite. Oh, except zero. That's the only one, right? So that's what it means to be pointed, okay?"},{"start":4194.83,"text":"And, you know, you get weird stuff like the set of coefficients of polynomials that are non-negative on some interval, right? I'm just mentioning this because there's some just weird ones, right? So these are called, these are going to be called proper cones. And let me explain, let me show you some improper cones in R2 just to make it clear. So, oh, here's a cone. Oh, by the way, this is just called a ray, right? So it's all points that go."}],"speech_gaps":[],"frame":"../frames/v002/025.webp","frame_time":4081.48},{"title":"凸锥与广义不等式","segments":[{"id":287,"text":"that are multiples of this vector and just go off that way. That's called a ray. It's a cone. It's a convex cone. Where does it fail? What does it fail there? What does it violate? It's not solid. That's right. So solid means it's got to have some interior. Here's a cone. It's a half space. That's totally a cone in R2. How does it fail?","zh":"这些是该向量的倍数，并朝那个方向延伸。这被称为射线。它是一个锥体。它是一个凸锥体。它哪里不符合呢？它在那里违反了什么？它没有实心性。没错。实心意味着它必须具有内部。这里有一个锥体。它是一个半空间。这在R2中完全是一个锥体。它是如何不符合的呢？","start":4224.97,"end":4252.77},{"id":288,"text":"It's not pointed. Why? Because look at this. Here's a point. You know, here's a line that is contained in that cone. And that violates the idea that it's pointed. Okay? So how about this? How about this cone? How about that one? That's good. Right? That's pointed. Solid. Whatever. It's a cone. Okay? All right. Fine. Okay.","zh":"它不是尖的。为什么？因为看这里。这里有一个点。这里有一条线，它包含在这个锥体中。这违反了它尖的这个概念。明白吗？那么这个锥体呢？那个锥体呢？那个是好的。对吧？它是尖的。实心的。随便怎样。它是一个锥体。明白吗？好吧。好的。","start":4254.08,"end":4291.11},{"id":289,"text":"proper cones to define a generalized inequality among vectors right and so the way you do that is we'll just say when you say x is less than y you would pronounce this if you're being super fancy you'd say x is less than y with respect to the cone k that'd be how you'd say it okay but all it means is that y minus x is in the cone","zh":"正则锥用于在向量之间定义广义不等式。你这样做的方式是，当我们说x小于y时，如果你非常讲究，你会说x小于y相对于锥体k。这就是你会这样表达的方式。明白吗？但所有它意味着的是y减去x在锥体中。","start":4292.36,"end":4317.01},{"id":290,"text":"And look, you already do this. If you know one symmetric matrix is bigger than another, if this is your estimation covariance, and this is someone else's estimation covariance, and yours is bigger than theirs, then theirs is better than yours. But this has no judgment here. So that's what that means.","zh":"你看，你已经这样做了。如果你知道一个对称矩阵比另一个大，如果这是你的估计协方差，而这是别人的估计协方差，而你的更大，那么别人的更好。但这里没有判断。这就是它的意思。","start":4317.5,"end":4341.2},{"id":291,"text":"Lots of things. If you do this with the cone, the non-negative orthant, this inequality turns into just ordinary element-wise inequality. By the way, most people actually write that these days. You just write it this way. It's polite for the next 10, 15, 20 years before the language converges to at first use of this to say where the inequality means element-wise.","zh":"有很多情况。如果你用这个锥体，即非负正交锥，这个不等式就变成了普通的逐元素不等式。顺便说一句，现在大多数人实际上这样写。你只需这样写。在语言收敛到首次使用这种表达方式之前，这是对接下来10、15、20年的一种礼貌。","start":4344.85,"end":4368.17},{"id":292,"text":"But we'll use the squiggly here. I mean, I don't know why. If I were going to change the book, I'd probably not use the squiggly for that. But it doesn't matter. And the same is true for matrix inequality. These are so common that we drop this. So basically, from now on, you see a squiggly inequality between vectors. It means element-wise. You see a squiggly inequality between two symmetric matrices. It means...","zh":"但我们将会使用波浪线符号。我是说，我不知道为什么。如果我要修改这本书，我可能会不使用波浪线来表示这个。但这没关系。同样，对于矩阵不等式也是如此。这些是如此常见，以至于我们省略了这个符号。因此，从现在起，你看到两个向量之间的波浪线不等式，它意味着逐元素不等式。你看到两个对称矩阵之间的波浪线不等式，它意味着……","start":4369.55,"end":4396.99}],"notes":["本段讲解了凸锥的定义及其性质，特别是关于锥是否为'pointed'（尖锥）和'solid'（实心）的判断。锥的尖锥性意味着锥中不能包含一条直线，而实心性则要求锥具有内部点。这些性质是定义广义不等式的基础。","讲者提到使用'proper cones'（规范锥）来定义向量之间的广义不等式，即当x \u003c y时，意味着y - x属于该锥。这种定义方式与传统的元素-wise不等式类似，但更一般化。","讲者通过举例说明了如何将非负正交锥（non-negative orthant）与元素-wise不等式联系起来，指出在实际应用中，这种不等式已经被广泛接受并使用。","讲者提到使用波浪号（squiggly）符号表示不等式，这种符号在向量和矩阵之间都有特定含义，即表示元素-wise不等式。这种符号的使用是为了简化表达。","讲者强调了广义不等式在实际应用中的重要性，例如在估计协方差矩阵时，较大的协方差矩阵意味着更差的估计性能，但这种判断是基于不等式本身的定义，而非主观判断。","讲者还提到语言习惯的变化，指出随着时间推移，人们会逐渐接受使用波浪号符号表示不等式，而不是每次都明确说明其含义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4224.97,"end":4396.99,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4224.97,"text":"that are multiples of this vector and just go off that way. That's called a ray. It's a cone. It's a convex cone. Where does it fail? What does it fail there? What does it violate? It's not solid. That's right. So solid means it's got to have some interior. Here's a cone. It's a half space. That's totally a cone in R2. How does it fail?"},{"start":4254.08,"text":"It's not pointed. Why? Because look at this. Here's a point. You know, here's a line that is contained in that cone. And that violates the idea that it's pointed. Okay? So how about this? How about this cone? How about that one? That's good. Right? That's pointed. Solid. Whatever. It's a cone. Okay? All right. Fine. Okay. So we will use..."},{"start":4292.36,"text":"proper cones to define a generalized inequality among vectors right and so the way you do that is we'll just say when you say x is less than y you would pronounce this if you're being super fancy you'd say x is less than y with respect to the cone k that'd be how you'd say it okay but all it means is that y minus x is in the cone"},{"start":4317.5,"text":"And look, you already do this. If you know one symmetric matrix is bigger than another, if this is your estimation covariance, and this is someone else's estimation covariance, and yours is bigger than theirs, then theirs is better than yours. But this has no judgment here. So that's what that means."},{"start":4344.85,"text":"Lots of things. If you do this with the cone, the non-negative orthant, this inequality turns into just ordinary element-wise inequality. By the way, most people actually write that these days. You just write it this way. It's polite for the next 10, 15, 20 years before the language converges to at first use of this to say where the inequality means element-wise."},{"start":4369.55,"text":"But we'll use the squiggly here. I mean, I don't know why. If I were going to change the book, I'd probably not use the squiggly for that. But it doesn't matter. And the same is true for matrix inequality. These are so common that we drop this. So basically, from now on, you see a squiggly inequality between vectors. It means element-wise. You see a squiggly inequality between two symmetric matrices. It means..."}],"speech_gaps":[],"frame":"../frames/v002/026.webp","frame_time":4236.97},{"title":"不等式与符号设计","segments":[{"id":293,"text":"Some people call it the loner ordering. It's very fancy ways to say it. It means the difference is positive semi-definite. That's what it means. So that's how that works. Now it turns out, when you're making a notation, and there's an inequality, the whole point of making notation is, so the idea of notation is you want it to evoke something that you already know about.","zh":"有些人称它为孤独者排序。这是一种非常花哨的说法。它意味着差值是半正定的。这就是它的意思。所以这就是它的运作方式。事实上，当你在设计符号时，如果存在不等式，设计符号的整个目的就是让你的符号唤起你已经知道的东西。","start":4397.37,"end":4424.63},{"id":294,"text":"Everybody here knows about inequality between numbers. Everybody here. So it's like a norm, an absolute value. The notation is close. It's supposed to evoke that. Now, it can't be just that, or then it's silly. It's not a generalization. But the difference, so what you really want is you want, whenever you see something like this where we're going to overload or extend some symbol in a more sophisticated setting,","zh":"在座的每个人都知道数字之间的不等式。在座的每个人。所以它类似于范数，绝对值。这个符号是接近的，它应该唤起这些概念。然而，它不能仅仅是这样，否则就显得很傻。它不是一个泛化。但差值，所以你真正想要的是，当你看到像这样的符号，你打算在一个更复杂的环境中重载或扩展某个符号时，","start":4425.39,"end":4454.09},{"id":295,"text":"You're supposed to import your intuition, right? So you'd say, yeah, well, you know, A is less than B and C is less than D, then I think A plus B should be less than C plus D. Most of those things you think are true and some are false.","zh":"你应该导入你的直觉，对吧？所以你会说，是的，好吧，你知道，A 小于 B，C 小于 D，那么我认为 A 加 B 应该小于 C 加 D。大多数这些想法你认为是正确的，有些是错误的。","start":4456.19,"end":4469.73},{"id":296,"text":"So you've got to be on your toes to know which is correct and which is not. And that's your job. But that's what good notation is for. That's like, think about matrices. What are you doing? You say, seriously? You're multiplying three numbers? And they're like, no, dude. That's a 10,000 by 1,000 matrix. That's a vector. That's blah, blah, blah. You see what I'm saying? But the notation looks super innocent. So that's kind of the idea behind good notation design. OK.","zh":"因此，你必须保持警惕，以知道哪些是正确的，哪些是不正确的。这是你的任务。但这就是好符号的作用。就像考虑矩阵。你在做什么？你会说，真的？你在乘三个数字？他们说，不，伙计。这是一个 10,000 乘 1,000 的矩阵。这是一个向量。这是 blah, blah, blah。你明白我的意思吗？但符号看起来非常无辜。这就是好符号设计背后的想法。好的。","start":4470.77,"end":4498.19},{"id":297,"text":"Okay, so what is the main difference with vectors? Well, it's kind of obvious, right? If your base model for what an inequality is is inequality on R, then that's got a property which is extremely important. It's called a total ordering. And that means that for any two numbers, either one's less than the other or the other way around, period. That's what it means to be a linear ordering or total ordering. Those would be the fancy names in math, you would say. Okay? Now...","zh":"好的，那么向量的主要区别是什么呢？嗯，这有点明显，对吧？如果你对不等式的基本模型是实数上的不等式，那么它具有一个极其重要的性质。它被称为全序。这意味着对于任意两个数，要么一个比另一个小，要么反过来，没有其他可能。这就是线性顺序或全序的含义。在数学中，这些会被称为花哨的名称。明白吗？现在……","start":4499.85,"end":4527.72},{"id":298,"text":"For vectors, that's just not the case, right? So that's interesting, right? So, I mean, for example, I mean, let's just do a couple of examples. Let's look at the inequality that looks like this, right?","zh":"对于向量来说，情况就不是这样了，对吧？这很有趣，对吧？我的意思是，举几个例子。让我们看一下像这样的不等式，对吧？","start":4528.22,"end":4545.83}],"notes":["本段讲解了不等式符号的设计原则，强调符号应唤起已知的概念，如数值不等式、范数和绝对值。同时指出，符号不能仅停留在简单层面，否则无法构成有效的泛化。","讲者提到，当在更复杂的背景下重载或扩展符号时，应导入已有的直觉。例如，若A \u003c B且C \u003c D，则A + B \u003c C + D可能成立，但并非总是如此，需要谨慎判断。","讲者通过矩阵乘法的例子说明，符号设计应直观且易于理解，即使面对高维数据或复杂结构，符号也应保持简洁和清晰。","讲者指出，数值不等式具有全序性质，即任意两个数之间存在明确的大小关系，而向量不等式不具备这一性质，因此需要不同的处理方式。","讲者提到，向量不等式可能涉及正半定性等概念，这与数值不等式的全序性质形成对比，强调了符号设计在不同数学结构中的重要性。","最后，讲者提到将通过具体例子进一步说明向量不等式的特性，但当前段落未给出具体例子，仅强调了符号设计和不等式性质的对比。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4397.37,"end":4545.83,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4397.37,"text":"Some people call it the loner ordering. It's very fancy ways to say it. It means the difference is positive semi-definite. That's what it means. So that's how that works. Now it turns out, when you're making a notation, and there's an inequality, the whole point of making notation is, so the idea of notation is you want it to evoke something that you already know about."},{"start":4425.39,"text":"Everybody here knows about inequality between numbers. Everybody here. So it's like a norm, an absolute value. The notation is close. It's supposed to evoke that. Now, it can't be just that, or then it's silly. It's not a generalization. But the difference, so what you really want is you want, whenever you see something like this where we're going to overload or extend some symbol in a more sophisticated setting,"},{"start":4456.19,"text":"You're supposed to import your intuition, right? So you'd say, yeah, well, you know, A is less than B and C is less than D, then I think A plus B should be less than C plus D. Most of those things you think are true and some are false."},{"start":4470.77,"text":"So you've got to be on your toes to know which is correct and which is not. And that's your job. But that's what good notation is for. That's like, think about matrices. What are you doing? You say, seriously? You're multiplying three numbers? And they're like, no, dude. That's a 10,000 by 1,000 matrix. That's a vector. That's blah, blah, blah. You see what I'm saying? But the notation looks super innocent. So that's kind of the idea behind good notation design. OK."},{"start":4499.85,"text":"Okay, so what is the main difference with vectors? Well, it's kind of obvious, right? If your base model for what an inequality is is inequality on R, then that's got a property which is extremely important. It's called a total ordering. And that means that for any two numbers, either one's less than the other or the other way around, period. That's what it means to be a linear ordering or total ordering. Those would be the fancy names in math, you would say. Okay? Now..."},{"start":4528.22,"text":"For vectors, that's just not the case, right? So that's interesting, right? So, I mean, for example, I mean, let's just do a couple of examples. Let's look at the inequality that looks like this, right?"}],"speech_gaps":[],"frame":"../frames/v002/027.webp","frame_time":4409.37},{"title":"向量比较与最小值概念","segments":[{"id":299,"text":"This says this two vector is less than or equal to that one. What it means is that x is less than u and y is less than v. So it's extremely easy to find two points where neither two vectors, where it is false that one is less than the other and the other way around. It's not a linear ordering. I mean, this is kind of obvious. And this is going to come up later when, for example, these become multiple objectives that we want small.","zh":"这表示这两个向量是小于或等于那个向量的。它的意思是说，x 小于 u 且 y 小于 v。因此，很容易找到两个点，其中两个向量之间既不满足一个小于另一个，也不满足反过来的情况。这不是一个线性顺序。我的意思是，这有点显而易见。而且这将在以后出现，例如，当这些成为我们想要最小化的多个目标时。","start":4550.64,"end":4577.62},{"id":300,"text":"Like, you know, I want to have a good fit on, you know, I want to have good training data fit. And I also want the complexity of the model to be low, right? Then these are just going to be two different things. And then you're going to have, you will have incomparable designs, right? That it will neither be true that one is bigger than the other. So what happens now is you have, from your intuition about numbers, you have ideas involving minimum.","zh":"比如，你知道的，我想要在训练数据上有一个良好的拟合。我也想要模型的复杂度较低，对吧？那么这些只是两个不同的方面。然后你将会遇到不可比较的设计，即既不成立一个比另一个大的情况。现在，根据你对数字的直觉，你会有一些涉及最小值的想法。","start":4579.27,"end":4607.31},{"id":301,"text":"Right? Like you can talk about the minimum of a bunch of numbers. Guess what? You cannot talk about the minimum. But you can talk about the minimum of a set of vectors, but it's a very specific thing. What happens is, because it's not a linear order, a bunch of ideas that were the same on R, they bifurcate. And now it turns out that all your intuition about minimum, all this kind of stuff in R, now there's going to be two concepts. And actually they are minimum and minimal.","zh":"对吧？比如，你可以谈论一组数字的最小值。猜猜看？你不能谈论最小值。但你可以谈论一组向量的最小值，但这是一个非常特定的概念。发生的情况是，由于这不是一个线性顺序，一些在实数上相同的概念会分裂开来。现在，你会发现你对最小值的所有直觉，以及在实数中所有这类东西，现在会有两个概念。实际上，它们是最小值和极小值。","start":4608.33,"end":4636.1},{"id":302,"text":"Okay, so this is the this is the picture and again, this is like weird and abstract right now All of this is going to have a lot of applications later. Okay, so So here's the definition. No minimum is super strong. It basically says This is a minimum element means everything else in the set is comparable to me and bigger Period okay, that's that's so for example in the minimum and the minimum element of","zh":"好的，所以这就是这个图景，再次，这现在看起来很奇怪和抽象。所有这些内容将在以后有很多应用。好的，所以这里有一个定义。没有最小值是非常强的。它基本上意味着，这个集合中的所有其他元素都与我可比较且更大。好的，这就是最小元素的定义。例如，在一个集合中，比如在 R² 中相对于二阶锥，这个就是完美的例子。s1 有一个最小点，就是这个点，因为集合中的所有点都与这个点可比较且在向量意义上更大。因此，这就是极小值，很容易看出，你可以有一个集合没有极小点，只是抱歉，最小值","start":4637.07,"end":4665.99},{"id":303,"text":"of a set in let's say an r2 with respect to the second order cone this is a this is a perfect example s1 has a minimum point and it's this one right because everything in this set is comparable to this point and bigger in the in the vector sense right so that that's minimal and it's easy to see you can have a set that doesn't have a minimal point there's just sorry minimum","zh":"的集合在 R² 中相对于二阶锥，这就是一个完美的例子。s1 有一个最小点，就是这个点，因为集合中的所有点都与这个点可比较且在向量意义上更大。因此，这就是极小值，很容易看出，你可以有一个集合没有极小点，只是抱歉，最小值","start":4666.89,"end":4694.77},{"id":304,"text":"Minimum point. Doesn't have a minimum point. Now, minimal is a weaker term. And it says this. A point is minimal if any point which is in the set and better than or equal or less than or equal to u, then it's u. So there's no point in the set that is less than or equal to u except u.","zh":"最小点。没有最小点。现在，最小值是一个较弱的概念。它表示：如果集合中的任意一点都不比u更好或更差或相等，那么该点就是u。换句话说，集合中除了u之外，没有其他点小于或等于u。","start":4697.1,"end":4722.06},{"id":305,"text":"there that's that's that's the right way to say it right and so here's a picture here and","zh":"那里，这就是正确的说法。这里有一个图示。","start":4722.7,"end":4726.62}],"notes":["本段讲解了向量比较与最小值概念的差异。在向量空间中，比较关系不是线性顺序，因此无法像实数那样定义最小值。讲者指出，最小值（minimum）是一个更强的概念，要求集合中所有其他元素都与它可比较且更大，而最小值（minimal）则是一个较弱的概念，只要没有其他元素小于或等于它即可。","讲者通过举例说明了最小值和最小值之间的区别。例如，在二维空间中，一个集合可能有一个最小值点，但可能没有最小值点。这说明了在向量空间中，最小值和最小值是两个不同的概念，需要根据具体定义来区分。","讲者提到，由于向量比较不是线性顺序，因此许多在实数中成立的关于最小值的直觉概念会分裂为两个不同的概念：最小值和最小值。这为后续讨论多目标优化问题奠定了基础。","讲者强调了最小值和最小值的定义差异。最小值要求所有其他元素都与它可比较且更大，而最小值只要求没有其他元素小于或等于它。这种区别在优化问题中非常重要，尤其是在处理多目标优化时。","讲者指出，虽然在实数中可以定义最小值，但在向量空间中，由于比较关系的非线性，无法直接定义最小值。因此，需要引入最小值和最小值两个概念来描述集合中的极值点。","讲者提到，这些概念将在后续课程中用于处理多目标优化问题，例如在设计模型时，需要同时考虑拟合数据和模型复杂度，这种情况下，不同的设计可能无法直接比较，因此需要使用最小值和最小值的概念来分析。"],"formulas":[],"uncertainties":["r2 with respect to the second order cone"],"diagram":"none","start":4550.6 function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
