 is a great subtitle, it's called Homotopy Methods, and the subtitle is Pathways to Solutions, right? Which is like, wow, that's like almost poetic. That's what it is, right? So the idea of a homotopy method is you start with T equals zero, you know the solution already, right? Then you crank T up a little bit, and you attempt to solve the problem."},{"start":2220.59,"text":"And if you solve it, and this isn't a general case, right? If you solve it, good for you, then you crank up t again and you keep going. And when you get to t equals one, you solved your problem. Oh, and what you would typically do is, let's say you're using Newton's method each time, each time you would start Newton's method from where you were before. That's the key. Everybody got this, right? So matter of fact, this is exactly how SPICE, for those of you who, actually how many people,"},{"start":2250.36,"text":"No, but Spicer have used it or so. Okay, so fine. So some. That's precisely how it computes an equilibrium point. So here. Okay, so if you don't mind, for everyone else, you probably get some of this, but I am going to go into dialect a little bit for a while. If you have a circuit, suppose I have a circuit with a bunch of devices. These are all nonlinear, right? So all you want to do is solve a set of one billion nonlinear..."},{"start":2274.6,"text":"equations. And those equations are things like KCL, KVL, and the device. And I guess you have to satisfy the device equations. I think this is fine for everybody to understand. So basically, it has to satisfy physics and the devices. Physics is linear, by the way. It's just actually conservation of current and all that kind of stuff. That's fine. It's the device equations that are nonlinear."},{"start":2302.83,"text":"Okay. So, I don't know, someone who knows circuits, do you want to guess a homo... So I give you a circuit. It doesn't have to be a billion. It's an op-amp. I got, you know, whatever, 15 device transistors in it or, you know, devices. And I'd say, please find me the equilibrium or bias. That's dialect. Bias for the equilibrium point. Everybody got this? Okay. Somebody want to... Can someone guess a homotopy parameter?"},{"start":2331.18,"text":"This is just for people who know about circuits and circuit design. Okay, I'll tell you what it is. It's a supply voltage. If I take a circuit and I set the supply voltage to zero, your specialty could be genetics, and I think you could probably say what the solution is, right? In other words, if I take a circuit and I don't apply power to it, then here's the solution. Ready?"}],"speech_gaps":[],"frame":"../frames/v016/014.webp","frame_time":2203.66},{"title":"同伦方法与路径跟踪","segments":[{"id":120,"text":"All voltages are zero. All potentials are zero. All currents are zero. And that will actually satisfy the equations. Everybody following this? So now I crank up the supply voltage. And again, sorry, this is going to be only for people who know about circuits. Yeah, the supply voltage is like two volts. I set it up to 50 millivolts, and I attempt to solve again for an equilibrium point, right? So, I mean..."},{"id":121,"text":"What does any chip look like when I put VDD, when I put the supply voltage to 50 millivolts? It looks like it's a resistor, right? Because you don't have enough voltage to actually turn any transistors on. Everybody, I mean, okay, if you know devices, you know what I'm talking about, right? Okay, it's linear, but that means we can probably, we can solve it in like one or two Newton steps. In fact, the tradition is one, okay? Then you set it to, you know,"},{"id":122,"text":"These are homotopy methods. This is super cool to know about. It okay, this is a homotopy method, but there's a big difference. Um, here I can get to any point on that path from anywhere, which is false, and in a general homotopy method, you have all this logic about what happens if you fail. Right, let's talk about that."},{"id":123,"text":"Suppose T was 0.05, and now I set it to 0.1, and I tried Newton's method, and it just completely failed. What would you suggest? 0.075. Perfect. 0.075. I totally agree. That's exactly what you do. It means you were too aggressive."},{"id":124,"text":"Right. And you move too far. And the problem got so different that from where you are, you couldn't get to this to this thing. Right. OK. So that's exactly how those were. Also, in the general case, all sorts of sick things can happen. Like they're called bifurcate. So two very bad things can happen, which is if you're following a path. This is in the general case, which is not ours. So here's a path. And one bad thing that can happen is it can so-called bifurcate and go like this. Right. So."},{"id":125,"text":"That's one. Another one is a path can just look like this and just stop. And that's it, right? You know, there may be another one that goes all the way to the solution here, right? So these issues you don't have here because we have a single path. We can get back to it from anywhere we like. The only question is how much effort, how many Newton steps it's going to take. So I don't know if that made sense, but that is the idea. Okay, so now..."}],"notes":["本段讲解了同伦方法的基本概念，强调了其在路径跟踪中的应用。同伦方法通过逐步调整参数，从一个已知的简单问题出发，逐步逼近目标问题的解。这种方法在电路分析中特别有用，因为可以逐步增加电源电压，从零开始，逐步达到目标电压，从而避免直接求解复杂非线性方程组的困难。","在同伦方法中，路径的连续性是一个关键点。如果路径在某个点发生分叉（bifurcate），则可能导致求解失败。这种分叉现象在一般情况下可能发生，但在本课程讨论的特定问题中，由于路径是单一且连续的，因此不会出现这种问题。","当使用牛顿法进行求解时，如果步长过大，可能会导致求解失败。因此，需要选择适当的步长，以确保每一步的更新都能保持在路径上。这通常通过逐步增加步长或使用更保守的步长策略来实现。","在一般情况下，同伦方法可能会遇到各种问题，如路径的分叉或路径的突然终止。这些情况需要额外的逻辑和处理方法，但在本课程讨论的特定问题中，由于路径是单一且连续的，因此不需要处理这些问题。","同伦方法的一个重要优势是，即使从任意点开始，也可以沿着路径回到目标点。然而，这需要付出一定的计算代价，即需要进行多次牛顿迭代。因此，选择合适的步长和迭代策略对于提高求解效率至关重要。","本段还提到，当路径发生分叉或终止时，可能存在其他路径可以到达目标解。因此，在实际应用中，需要仔细分析路径的行为，以确保能够找到正确的解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2355.56,"end":2510.1,"asr_flags":[],"raw_segments":[{"start":2355.56,"text":"All voltages are zero. All potentials are zero. All currents are zero. And that will actually satisfy the equations. Everybody following this? So now I crank up the supply voltage. And again, sorry, this is going to be only for people who know about circuits. Yeah, the supply voltage is like two volts. I set it up to 50 millivolts, and I attempt to solve again for an equilibrium point, right? So, I mean..."},{"start":2379.04,"text":"What does any chip look like when I put VDD, when I put the supply voltage to 50 millivolts? It looks like it's a resistor, right? Because you don't have enough voltage to actually turn any transistors on. Everybody, I mean, okay, if you know devices, you know what I'm talking about, right? Okay, it's linear, but that means we can probably, we can solve it in like one or two Newton steps. In fact, the tradition is one, okay? Then you set it to, you know,"},{"start":2405.23,"text":"100 millivolts right and you keep going until you get to whatever two volts and then you say that's that's that's where i have it everybody got this so okay so these are homotopy methods this is super cool to know about it okay this is a homotopy method but there's a big difference um here i can get to any point on that path from anywhere which is false and in a general homotopy method you have all this logic about what happens if you fail right oh let's talk about that"},{"start":2432.74,"text":"Suppose T was 0.05, and now I set it to 0.1, and I tried Newton's method, and it just completely failed. What would you suggest? 0.075. Perfect. 0.075. I totally agree. That's exactly what you do. It means you were too aggressive."},{"start":2452.45,"text":"Right. And you move too far. And the problem got so different that from where you are, you couldn't get to this to this thing. Right. OK. So that's exactly how those were. Also, in the general case, all sorts of sick things can happen. Like they're called bifurcate. So two very bad things can happen, which is if you're following a path. This is in the general case, which is not ours. So here's a path. And one bad thing that can happen is it can so-called bifurcate and go like this. Right. So."},{"start":2482.81,"text":"That's one. Another one is a path can just look like this and just stop. And that's it, right? You know, there may be another one that goes all the way to the solution here, right? So these issues you don't have here because we have a single path. We can get back to it from anywhere we like. The only question is how much effort, how many Newton steps it's going to take. So I don't know if that made sense, but that is the idea. Okay, so now..."}],"speech_gaps":[],"frame":"../frames/v016/015.webp","frame_time":2367.56},{"title":"同伦方法与参数调整","segments":[{"id":126,"text":"you will recognize this as a homotopy method. So here it is. It says you pick some t and you compute x to r of t. That's Newton's method. Then what you do, you quit if m over t is less than epsilon. That's fine. Otherwise, you increase t. This is a very simple method. There's much more sophisticated methods, but this is the way you do it. You just increase t by mu, right? And so mu is this number that tells you"},{"id":127,"text":"how much you, actually since the gap is m over t, mu actually is telling you how much are you going to tighten the gap requirement in the next step. That's what it tells. So if mu is like 1.05, I mean, basically the argument would be you just calculated the analytic center at this point. When you increase t by 5%,"},{"id":128,"text":"It hasn't moved very far. Another way to say it is you're just about to solve a problem that's very similar to the one you just solved. And in fact, it's going to take one or two Newton steps. And in fact, I think there are some methods that increment t in such a way that it's so small, the increment, that one Newton step is all you need. So you do..."},{"id":129,"text":"You do one Newton step and increase t, then one Newton step and so on. So that's one way. Those are called short step methods, I think. Okay, everybody got this? Okay. The luxury we have is the following. This algorithm cannot fail for us. I mean, it might fail for numerical reasons, but in theory, it cannot fail. It always works. So it just does."},{"id":130,"text":"Because no matter how aggressively you update it, Newton's method is going to solve this smooth problem. It may take a lot of iterations, but it's going to do it. Okay, so this is the idea. Okay, so it turns out, you know, actually it depends."},{"id":131,"text":"If you talk to the theorists, mu is going to be really small. Like it's going to literally be like 1 plus 1 over m or something like that. And I have no problem with that. Turns out in practice, people will choose things like 10, 20, 50, or 100. Something like that. Really quite large values, right? Okay. And there's plenty of heuristics for choosing t0 and stuff like that. Okay."}],"notes":["本段讲解了同伦方法中参数t的调整策略，其中mu用于控制每次迭代中对间隙（gap）要求的收紧程度。当mu为1.05时，意味着每次迭代中t的增加幅度为5%，从而使得问题在每次迭代中保持高度相似，仅需少量牛顿步即可求解。","讲者提到，理论上该算法不会失败，因为牛顿法能够解决光滑问题，尽管可能需要大量迭代。然而，在实际应用中，mu的取值会根据问题的规模和需求进行调整，理论上的mu可能非常小（如1 + 1/m），而实际应用中人们倾向于选择较大的mu值（如10、20等）。","讲者还提到，存在一些方法可以以极小的增量调整t，使得每次迭代只需一次牛顿步，这些方法被称为短步方法（short step methods）。这表明在实际应用中，可以通过调整mu的大小来优化计算效率。","讲者强调，该算法在理论上是可靠的，不会失败，但可能因数值计算问题而失败。这表明算法的鲁棒性在理论上有保障，但在实际实现中仍需注意数值稳定性。","讲者提到，对于理论研究者来说，mu的取值通常非常小，而实际应用中人们倾向于选择较大的mu值，这表明在实际应用中，mu的选择需要在计算效率和精度之间进行权衡。","最后，讲者提到存在许多启发式方法用于选择初始参数t0，这表明在实际应用中，参数的选择是一个重要的优化问题，需要结合具体问题进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2510.57,"end":2663.43,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏明确的数学定义和上下文，无法进行有效的数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2510.57,"text":"you will recognize this as a homotopy method. So here it is. It says you pick some t and you compute x to r of t. That's Newton's method. Then what you do, you quit if m over t is less than epsilon. That's fine. Otherwise, you increase t. This is a very simple method. There's much more sophisticated methods, but this is the way you do it. You just increase t by mu, right? And so mu is this number that tells you"},{"start":2541.82,"text":"how much you, actually since the gap is m over t, mu actually is telling you how much are you going to tighten the gap requirement in the next step. That's what it tells. So if mu is like 1.05, I mean, basically the argument would be you just calculated the analytic center at this point. When you increase t by 5%,"},{"start":2566.92,"text":"It hasn't moved very far. Another way to say it is you're just about to solve a problem that's very similar to the one you just solved. And in fact, it's going to take one or two Newton steps. And in fact, I think there are some methods that increment t in such a way that it's so small, the increment, that one Newton step is all you need. So you do..."},{"start":2591.02,"text":"You do one Newton step and increase t, then one Newton step and so on. So that's one way. Those are called short step methods, I think. Okay, everybody got this? Okay. The luxury we have is the following. This algorithm cannot fail for us. I mean, it might fail for numerical reasons, but in theory, it cannot fail. It always works. So it just does."},{"start":2614.76,"text":"Because no matter how aggressively you update it, Newton's method is going to solve this smooth problem. It may take a lot of iterations, but it's going to do it. Okay, so this is the idea. Okay, so it turns out, you know, actually it depends."},{"start":2635.95,"text":"If you talk to the theorists, mu is going to be really small. Like it's going to literally be like 1 plus 1 over m or something like that. And I have no problem with that. Turns out in practice, people will choose things like 10, 20, 50, or 100. Something like that. Really quite large values, right? Okay. And there's plenty of heuristics for choosing t0 and stuff like that. Okay."}],"speech_gaps":[],"frame":"../frames/v016/016.webp","frame_time":2522.57},{"title":"障碍方法与收敛分析","segments":[{"id":132,"text":"So that's it. This is the barrier method. Okay. The convergence analysis is actually kind of interesting. So it works like this, right? Every time you recompute a new point on the central path, the new gap went down by a factor of mu. Because actually, mu is just controlling how much you tighten your gap each time."},{"id":133,"text":"So what's interesting about this is there's no surprise after the end of an iteration what your gap is, right? Your gap is this provable distance between how far you are and the optimal value is. And a lot of algorithms go like this. You finish all your calculation, then there's a drum roll, and someone, you evaluate the..."},{"id":134,"text":"So that says that the number of iterations it's going to take is like an original gap divided by log mu, right? And so that's going to be the, that's the number of iterations you take, right? Now the centering, but then remember, you have to do the centering, right? And the real measure is like, let's say we could use how many Newton steps do you actually end up performing, right? That would be one way to do this. And if you do the classical analysis,"},{"id":135,"text":"So that says that the number of iterations it's going to take is like an original gap divided by log mu, right? And so that's going to be the, that's the number of iterations you take, right? Now the centering, but then remember, you have to do the centering, right? And the real measure is like, let's say we could use how many Newton steps do you actually end up performing, right? That would be one way to do this. And if you do the classical analysis,"},{"id":136,"text":"What you get is something very weird. It goes like this. The classical analysis says, oh yeah, yeah, I can minimize this for you. No problem. I can minimize that. And you get a Lipschitz constant and a strong convexity and blah, blah, blah, and you do this. But what the classical analysis will predict is that as t gets bigger and bigger, the classical analysis will tell you that the number of Newton steps will grow. And in fact, it'll grow like alarmingly fast. Okay?"},{"id":137,"text":"And then when you work this out, you realize it just doesn't... I mean, if you're a theorist and you assemble all these things together, you'll find out it's going to grow really fast, right? And it won't get you what you want, which is like a polynomial time method. Yes? What happens if you don't always solve the minimization problem fully? Because it does need a better point, right? Yeah, so that's exactly right. So when you're centering, for sure the last two Newton steps were completely a waste of time."}],"notes":["本段主要讲解障碍方法的收敛分析，强调每次迭代中间隙（gap）的减少与参数mu的关系。障碍方法通过每次重新计算中心路径上的新点，使间隙按mu的比例减少，从而逐步逼近最优解。","在迭代过程中，间隙的大小是可证明的，即当前解与最优解之间的距离。许多优化算法都采用类似策略，即在完成所有计算后，通过评估对偶函数（dual function）来确定当前解的下界，从而判断解的质量。","障碍方法的一个关键特性是，每次中心化操作都会减少间隙，因此迭代次数与初始间隙和log(mu)有关。然而，经典分析表明，随着参数t的增大，所需的牛顿步数会指数级增长，这与实际应用中的多项式时间方法目标相悖。","当不完全解决最小化问题时，最后几步牛顿迭代可能变得冗余，这表明在实际应用中需要权衡计算精度与迭代次数。","本段还提到，经典分析预测的牛顿步数增长速度令人担忧，这表明需要更高效的算法设计，以避免计算资源的浪费。","障碍方法通过调整mu来控制间隙的减少速度，从而在保证收敛性的同时，尽可能减少迭代次数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2664.11,"end":2826.95,"asr_flags":[],"math_clarifications":["公式中的'original gap'和'mu'没有明确的数学定义，且'log(mu)'的使用缺乏上下文支持。此外，'iterations'的表达方式不符合数学公式规范，应使用更精确的数学符号表示。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2664.11,"text":"So that's it. This is the barrier method. Okay. The convergence analysis is actually kind of interesting. So it works like this, right? Every time you recompute a new point on the central path, the new gap went down by a factor of mu. Because actually, mu is just controlling how much you tighten your gap each time."},{"start":2691.88,"text":"So what's interesting about this is there's no surprise after the end of an iteration what your gap is, right? Your gap is this provable distance between how far you are and the optimal value is. And a lot of algorithms go like this. You finish all your calculation, then there's a drum roll, and someone, you evaluate the..."},{"start":2708.75,"text":"the dual function, which is a lower bound. And then you look up and go like, oh my God, that's awesome. I'm already 1%. I'm provably 1% suboptimal. And I've only done, you know, blah, blah, blah, 22 iterations. So that's how usually. Here, there's no surprise. The gap will be period, M over T. So you basically dial in the gap. That's how that works. Okay. So what that says is that every time you do a centering, you reduce the gap by a factor mu."},{"start":2737.56,"text":"So that says that the number of iterations it's going to take is like an original gap divided by log mu, right? And so that's going to be the, that's the number of iterations you take, right? Now the centering, but then remember, you have to do the centering, right? And the real measure is like, let's say we could use how many Newton steps do you actually end up performing, right? That would be one way to do this. And if you do the classical analysis,"},{"start":2768.07,"text":"What you get is something very weird. It goes like this. The classical analysis says, oh yeah, yeah, I can minimize this for you. No problem. I can minimize that. And you get a Lipschitz constant and a strong convexity and blah, blah, blah, and you do this. But what the classical analysis will predict is that as t gets bigger and bigger, the classical analysis will tell you that the number of Newton steps will grow. And in fact, it'll grow like alarmingly fast. Okay?"},{"start":2798.24,"text":"And then when you work this out, you realize it just doesn't... I mean, if you're a theorist and you assemble all these things together, you'll find out it's going to grow really fast, right? And it won't get you what you want, which is like a polynomial time method. Yes? What happens if you don't always solve the minimization problem fully? Because it does need a better point, right? Yeah, so that's exactly right. So when you're centering, for sure the last two Newton steps were completely a waste of time."}],"speech_gaps":[],"frame":"../frames/v016/017.webp","frame_time":2676.11},{"title":"中心路径与牛顿法的收敛性","segments":[{"id":138,"text":"Right? So, and in fact, real methods don't do that. You never solve it directly. By the time, as a matter of fact, what they do is by the time you're in the region of quadratic convergence, t gets updated then. Right? Well, it's silly because let's draw that picture, right? So that picture looks like this, right? You know, here's the central path, right? You're here. You're going here. Here's your Newton steps, right? First you go like here."},{"id":139,"text":"you know, here, I'll make it take a couple more steps. Here's what, you know, it goes like that. But then you get close, right? And now you do two more steps that we can't see here on the board, right? And so, you know, these are a complete waste of time if you think about it. Because someone says, what are you doing? You go, well, I'm going back to the path because I want to be on the path with double precision accuracy. And someone's like, dude, what is the path?"},{"id":140,"text":"I asked you to solve like, you know, an SOCP or a quadratic program. So what is this path thing? And why should I care? And the answer is you shouldn't care because the path is just a construct for us to figure out a way to get to the solution, which is over here, right? So in fact, all the analyses work. And in fact, if you have fancy methods, they will not do this, right? But in this method, you do that and you're completely right. The last step or two or three are just completely wasted."},{"id":141,"text":"So, okay. There was a question. In practice, how much of a game does this centering give you rather than just starting with a very large team and solving it with that? It's usually infinity in practice."},{"id":142,"text":"In theory, it's not infinity. It's just unbelievably large. And the reason is, in practice, what happens is, if I say solve by LP to six significant digits or something, then you go, no problem, t equals 1e plus 7 or something like that."},{"id":143,"text":"Now, in theory, Newton, you could just do it in one step, right? You just solve that one, just run Newton's method now. What's going to happen then is you're going to get into numerical issues, and it's just not going to work, right? And even if it did work, it would take a gazillion iterations. Yeah, so in practice, it's very considerable. Yeah, so, yeah."},{"id":144,"text":"I'm understanding this offset of m over t correctly. So does that mean that if you only cared about what p star is, you could just solve the problem for 1t and just add the constant? That's correct. Right. That's what I call the UMT method, unconstrained minimization technique. That's completely correct. Yeah, that's right. What this says, I guess that question was what happens if you do that, but then someone says, I want 1e minus 7 accuracy."}],"notes":["本段讨论了中心路径在优化算法中的作用，特别是牛顿法在接近解时的收敛行为。讲者指出，中心路径是一种用于逐步逼近解的构造性方法，而不是直接求解。在实际应用中，中心路径的参数t通常非常大，但随着迭代的进行，t会逐渐减小，从而使得算法在接近解时的收敛速度加快。","讲者提到，虽然理论上可以通过一次牛顿迭代直接求解，但在实际中由于数值稳定性问题，这种方法不可行。因此，实际应用中通常采用逐步减小t的策略，以确保数值计算的稳定性。","讲者还提到，如果只关心最终的最优解p*，可以通过忽略中心路径的偏移项，直接求解问题并加上一个常数项。这种方法被称为UMT方法（无约束最小化技术），在理论上是正确的。","讲者进一步指出，如果需要更高的精度（如1e-7），则需要更精细的调整，这涉及到对中心路径的进一步优化和迭代。","讲者强调，中心路径的构造是为了帮助算法逐步逼近最优解，而不是直接求解。因此，虽然中心路径在理论上是重要的，但在实际应用中，它更多地作为一种辅助工具。","讲者还提到，实际应用中，中心路径的参数t通常非常大，但随着迭代的进行，t会逐渐减小，从而使得算法在接近解时的收敛速度加快。"],"formulas":[],"uncertainties":["1e plus 7","1e minus 7"],"diagram":"none","start":2827.48,"end":2991.9,"asr_flags":[],"math_clarifications":["原文中未出现任何数学公式，仅包含对优化方法和数值计算过程的描述，因此无法进行数学公式核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2827.48,"text":"Right? So, and in fact, real methods don't do that. You never solve it directly. By the time, as a matter of fact, what they do is by the time you're in the region of quadratic convergence, t gets updated then. Right? Well, it's silly because let's draw that picture, right? So that picture looks like this, right? You know, here's the central path, right? You're here. You're going here. Here's your Newton steps, right? First you go like here."},{"start":2857.29,"text":"you know, here, I'll make it take a couple more steps. Here's what, you know, it goes like that. But then you get close, right? And now you do two more steps that we can't see here on the board, right? And so, you know, these are a complete waste of time if you think about it. Because someone says, what are you doing? You go, well, I'm going back to the path because I want to be on the path with double precision accuracy. And someone's like, dude, what is the path?"},{"start":2881.32,"text":"I asked you to solve like, you know, an SOCP or a quadratic program. So what is this path thing? And why should I care? And the answer is you shouldn't care because the path is just a construct for us to figure out a way to get to the solution, which is over here, right? So in fact, all the analyses work. And in fact, if you have fancy methods, they will not do this, right? But in this method, you do that and you're completely right. The last step or two or three are just completely wasted."},{"start":2911.16,"text":"So, okay. There was a question. In practice, how much of a game does this centering give you rather than just starting with a very large team and solving it with that? It's usually infinity in practice."},{"start":2925.46,"text":"In theory, it's not infinity. It's just unbelievably large. And the reason is, in practice, what happens is, if I say solve by LP to six significant digits or something, then you go, no problem, t equals 1e plus 7 or something like that."},{"start":2941.92,"text":"Now, in theory, Newton, you could just do it in one step, right? You just solve that one, just run Newton's method now. What's going to happen then is you're going to get into numerical issues, and it's just not going to work, right? And even if it did work, it would take a gazillion iterations. Yeah, so in practice, it's very considerable. Yeah, so, yeah."},{"start":2964.57,"text":"I'm understanding this offset of m over t correctly. So does that mean that if you only cared about what p star is, you could just solve the problem for 1t and just add the constant? That's correct. Right. That's what I call the UMT method, unconstrained minimization technique. That's completely correct. Yeah, that's right. What this says, I guess that question was what happens if you do that, but then someone says, I want 1e minus 7 accuracy."}],"speech_gaps":[],"frame":"../frames/v016/018.webp","frame_time":2839.48},{"title":"凸优化中的自洽性与数值稳定性","segments":[{"id":145,"text":"And so they go, no problem, t equals 1e plus 9. It will work in theory, but numerically at that point it's not going to. I mean, that corresponds to the person who comes over here, takes this thing, right? I mean, t equals 1e plus 9 corresponds to basically someone who just says, give me some sandpaper, sands off this rough corner and says, done. It's smooth. Go ahead. Use your Newton method. Everybody following this?"},{"id":146,"text":"We know now the theory is that that will work, but it will take a lot of iterations. And the practice is that it will take, number one, it will take a gazillion iterations or most likely just fail. Right, so, okay. Okay, everybody got this? So the classical analysis actually tells you that as t gets bigger and bigger, it's going to take you more and more Newton steps to get..."},{"id":147,"text":"to recenter, right? And the reason is pretty clear because what's going to happen is t gets bigger and bigger, both that Lipschitz constant and, you know, that strong convexity constant are going to scale up. And so, but I mean, that's silly because that's someone saying your algorithm doesn't, if someone said your algorithm doesn't work, you'd say, why? And you'd go, well, because my analysis predicts an upper bound on the number of steps that's growing, right? And the point is the analysis turns out to be just wrong."},{"id":148,"text":"So empirically, it's found that the number steps don't grow as t gets bigger and bigger. Again, it's critical you start from the previous value. So that's the critical part. And we'll see that self-concordance actually verifies that completely. So we'll see that in a minute. Okay. So let's look at some examples. So this is just an LP. As a matter of fact, you are going to implement exactly this."},{"id":149,"text":"by a week from tomorrow, right? So, okay, so let's take, this is the duality gap. That's the gap between the primal value you found and the dual value. So this produces both also, not just a primal value, but dual, of course, as well, right? And so these are the staircase plots, and let me explain what they are. This is Newton steps. This, the width of the tread in the staircase,"},{"id":150,"text":"is the number of Newton steps per centering. The drop is precisely dividing the gap by a factor of mu. So on a semi-log plot, those stairs have a constant rise, each one. And the rise is precisely..."},{"id":151,"text":"1 over mu, right? Or something like that. In other words, you reduce the gap by a factor mu, okay? So we can look and we can see all sorts of cool things here. Like, let's take the mu equals 50 one. Mu equals 50 says you are aggressively updating t each step."}],"notes":["本段讨论了在凸优化中，当参数t变得非常大时，算法的理论分析与实际表现之间的差异。理论分析预测随着t的增大，所需的牛顿迭代次数会增加，但实际中却发现迭代次数并不会显著增加。这表明理论分析可能存在错误，或者需要更精确的模型来描述实际行为。","讲者通过一个比喻来说明t非常大的情况，即使用砂纸去除粗糙的角落，使表面变得光滑，从而暗示算法在数值上可能变得不稳定。这表明在实际应用中，即使理论分析表明算法有效，但数值实现中仍可能遇到困难。","讲者提到，自洽性（self-concordance）可以验证这种现象，即随着t的增大，迭代次数不会显著增加。这表明自洽性是一个重要的性质，能够帮助理解算法的数值行为。","讲者还提到，当mu（一个与算法更新步长相关的参数）较大时，算法会更积极地更新t，这可能意味着算法在某些情况下会更快地收敛。","讲者通过一个例子说明了对偶间隙（duality gap）的概念，即原始问题解与对偶问题解之间的差距。这表明在优化过程中，对偶间隙的减少是衡量算法性能的一个重要指标。","讲者提到，通过绘制阶梯图（staircase plots），可以直观地观察到对偶间隙的减少情况。这表明在实际应用中，可视化工具可以帮助理解算法的收敛过程。"],"formulas":[],"uncertainties":["1e plus 9 可能是 1e9 的误识别，但根据上下文，它表示一个非常大的数值，因此保留原识别结果。","1 over mu 可能是 1/mu 的误识别，但根据上下文，它表示对偶间隙减少的因子，因此保留原识别结果。"],"diagram":"none","start":2992.6,"end":3166.02,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏明确的数学定义或上下文条件，无法进行数学复核，因此决定移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2992.6,"text":"And so they go, no problem, t equals 1e plus 9. It will work in theory, but numerically at that point it's not going to. I mean, that corresponds to the person who comes over here, takes this thing, right? I mean, t equals 1e plus 9 corresponds to basically someone who just says, give me some sandpaper, sands off this rough corner and says, done. It's smooth. Go ahead. Use your Newton method. Everybody following this?"},{"start":3020.01,"text":"We know now the theory is that that will work, but it will take a lot of iterations. And the practice is that it will take, number one, it will take a gazillion iterations or most likely just fail. Right, so, okay. Okay, everybody got this? So the classical analysis actually tells you that as t gets bigger and bigger, it's going to take you more and more Newton steps to get..."},{"start":3044.57,"text":"to recenter, right? And the reason is pretty clear because what's going to happen is t gets bigger and bigger, both that Lipschitz constant and, you know, that strong convexity constant are going to scale up. And so, but I mean, that's silly because that's someone saying your algorithm doesn't, if someone said your algorithm doesn't work, you'd say, why? And you'd go, well, because my analysis predicts an upper bound on the number of steps that's growing, right? And the point is the analysis turns out to be just wrong."},{"start":3071.99,"text":"So empirically, it's found that the number steps don't grow as t gets bigger and bigger. Again, it's critical you start from the previous value. So that's the critical part. And we'll see that self-concordance actually verifies that completely. So we'll see that in a minute. Okay. So let's look at some examples. So this is just an LP. As a matter of fact, you are going to implement exactly this."},{"start":3100.45,"text":"by a week from tomorrow, right? So, okay, so let's take, this is the duality gap. That's the gap between the primal value you found and the dual value. So this produces both also, not just a primal value, but dual, of course, as well, right? And so these are the staircase plots, and let me explain what they are. This is Newton steps. This, the width of the tread in the staircase,"},{"start":3129.31,"text":"is the number of Newton steps per centering. The drop is precisely dividing the gap by a factor of mu. So on a semi-log plot, those stairs have a constant rise, each one. And the rise is precisely..."},{"start":3147.44,"text":"1 over mu, right? Or something like that. In other words, you reduce the gap by a factor mu, okay? So we can look and we can see all sorts of cool things here. Like, let's take the mu equals 50 one. Mu equals 50 says you are aggressively updating t each step."}],"speech_gaps":[],"frame":"../frames/v016/019.webp","frame_time":3004.6},{"title":"牛顿法迭代次数与参数mu的关系","segments":[{"id":152,"text":"And sure enough, look at that. It takes you all of, ooh, you know, 11 iterations to do the first centering. The next one takes also like 10 or 11. Everybody see that? That's the width of those stairs. Now, when you do center, the gap goes down by 50x, which is pretty decent. Everybody, right? You can, here's like little mousy steps. Mu equals two, right? Actually, it'll be hilarious because the..."},{"id":153,"text":"Theory will be calling for mu equals 1.0001, but that's another story, right? But if you look at mu equals 2, again, what you see are the treads are shorter. They're shorter because the Newton problems you're solving are easier. Basically, what's happening is you've computed a point like here, and when it's 50x, it's like way over here. You're going to actually have to do some work."},{"id":154,"text":"But when it's 2, it's just over here, and it's going to be like 2, 3 Newton steps and game over. Everybody see this? So you get that. This is mu equals 150. So this shows you the number of Newton iterations versus how you choose that parameter mu. And by the way, if you made mu bigger, it would start to go up again. But what you see is something actually... So first of all, let's talk about how weird this is."},{"id":155,"text":"So basically, if you kept going, obviously, this would get to 10 to the minus 8. But let's take that as an acceptable amount to reduce your gap, right? Well, we just reduced our gap by a factor of 10 to the 8. And we did the whole thing in, I don't know, let's look at this one, 37 Newton steps. Everybody? So actually, that takes just some thought to sit there and think about what this means, right? So an LP..."},{"id":156,"text":"is, you know, you have 50 variables, 100 constraints. When you picture this, it's this polyhedron in R50 with 100 faces. The number of vertices it has is just astronomical. One of those is the solution. Everybody following this, right? So, and what this shows is like extremely embarrassing is that in 30 odd Newton steps,"},{"id":157,"text":"you actually get an extremely high accuracy solution. Let me make that clearer, right? By the way, you get the exact same plots look like this when the dimensions go up. They look exactly the same, right? So, but even here, it's amazing. Like R50 is a pretty, you know what? Yeah, let's, you would get exactly the same plot if this was, you know, 10,000 inequalities and whatever, 5,000, it wouldn't matter. It'd be the same, right?"}],"notes":["本段主要讲解了牛顿法在优化问题中的迭代次数与参数mu之间的关系。通过具体例子说明，当mu取不同值时，迭代次数和收敛速度的变化。例如，当mu=2时，迭代次数较少，而当mu=1.0001时，理论上的迭代次数会更多。这表明mu的选择对算法效率有重要影响。","讲者提到，当mu增大时，虽然初始的迭代次数可能减少，但随着迭代的进行，牛顿法的迭代次数会再次增加。这说明mu的选择需要在收敛速度和计算成本之间进行权衡。","讲者还通过一个具体的例子说明了在高维空间中，如R50，即使有大量约束条件，牛顿法仍然能够快速收敛到高精度的解。这展示了牛顿法在处理大规模优化问题时的高效性。","讲者指出，即使在高维空间中，如R50，牛顿法的收敛行为与低维空间中的表现类似。这表明牛顿法的收敛特性具有一定的普适性，不受维度的影响。","讲者强调，虽然牛顿法在高维空间中表现良好，但其收敛速度仍然依赖于参数mu的选择。因此，在实际应用中，需要根据具体问题选择合适的mu值。","最后，讲者通过一个具体的例子说明了在高维空间中，即使有大量约束条件，牛顿法仍然能够快速收敛到高精度的解。这展示了牛顿法在处理大规模优化问题时的高效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3166.5,"end":3332.34,"asr_flags":[],"raw_segments":[{"start":3166.5,"text":"And sure enough, look at that. It takes you all of, ooh, you know, 11 iterations to do the first centering. The next one takes also like 10 or 11. Everybody see that? That's the width of those stairs. Now, when you do center, the gap goes down by 50x, which is pretty decent. Everybody, right? You can, here's like little mousy steps. Mu equals two, right? Actually, it'll be hilarious because the..."},{"start":3194.27,"text":"Theory will be calling for mu equals 1.0001, but that's another story, right? But if you look at mu equals 2, again, what you see are the treads are shorter. They're shorter because the Newton problems you're solving are easier. Basically, what's happening is you've computed a point like here, and when it's 50x, it's like way over here. You're going to actually have to do some work."},{"start":3219.99,"text":"But when it's 2, it's just over here, and it's going to be like 2, 3 Newton steps and game over. Everybody see this? So you get that. This is mu equals 150. So this shows you the number of Newton iterations versus how you choose that parameter mu. And by the way, if you made mu bigger, it would start to go up again. But what you see is something actually... So first of all, let's talk about how weird this is."},{"start":3250.16,"text":"So basically, if you kept going, obviously, this would get to 10 to the minus 8. But let's take that as an acceptable amount to reduce your gap, right? Well, we just reduced our gap by a factor of 10 to the 8. And we did the whole thing in, I don't know, let's look at this one, 37 Newton steps. Everybody? So actually, that takes just some thought to sit there and think about what this means, right? So an LP..."},{"start":3277.96,"text":"is, you know, you have 50 variables, 100 constraints. When you picture this, it's this polyhedron in R50 with 100 faces. The number of vertices it has is just astronomical. One of those is the solution. Everybody following this, right? So, and what this shows is like extremely embarrassing is that in 30 odd Newton steps,"},{"start":3304.46,"text":"you actually get an extremely high accuracy solution. Let me make that clearer, right? By the way, you get the exact same plots look like this when the dimensions go up. They look exactly the same, right? So, but even here, it's amazing. Like R50 is a pretty, you know what? Yeah, let's, you would get exactly the same plot if this was, you know, 10,000 inequalities and whatever, 5,000, it wouldn't matter. It'd be the same, right?"}],"speech_gaps":[],"frame":"../frames/v016/020.webp","frame_time":3178.5},{"title":"牛顿法在大规模优化中的效率","segments":[{"id":158,"text":"But what this says is actually very, very weird. What it says is, if you think about it, you actually do 50 Newton steps. So what that means is, in solving this LP, you start at some point. Literally, you ask for directions. You calculate things involving these barrier functions and things like that and the equality constraint. Actually, you know exactly what you do. You solve a linear KKT system, and you get a direction. Everybody got that? Then on that direction, you do a line search."},{"id":159,"text":"Right? Then you stop. That's iteration one. You're at the new point. You ask for directions again, which is you just query the constraints and the objective and you construct some KKT matrix and get a new direction and go again. Everybody got this? So let's pretend that that was in 5,000 variables, right? So that's in 5,000 dimensions. You basically stop and ask for directions 35 times. Everybody..."},{"id":160,"text":"Getting this? This is, I find it impressive, right? Like R5000 is a really big place,"},{"id":161,"text":"right? And so the idea that you actually can do this in like a mere 30 Newton steps or 30 steps,"},{"id":162,"text":"right? I think is just stunning. Okay. So yeah. In the plot on the right, why are there these"},{"id":163,"text":"little like jumps, for example, at 140, it's just, they're just, I don't know, but they're"},{"id":164,"text":"They're just random perturbations of, you know, because you can accidentally land somewhere"},{"id":165,"text":"where instead of taking some number of Newton steps, you take a lot less."},{"id":166,"text":"That's a dumb luck phenomenon."},{"id":167,"text":"So could be that."},{"id":168,"text":"I don't know."},{"id":169,"text":"Yeah."},{"id":170,"text":"I mean, this is presumably on a single instance, right?"},{"id":171,"text":"If we averaged over a bunch, I can't imagine that those bumps would stay there, right?"},{"id":172,"text":"So, okay."},{"id":173,"text":"This is also extremely important."},{"id":174,"text":"And what it says is bizarre."},{"id":175,"text":"are if you think about what mu does mu is the aggressiveness by which you update your homotopy"},{"id":176,"text":"parameter or if you like it's it's the it's the it's a parameter that tells you how aggressively"},{"id":177,"text":"each step you decrease the target gap in fact it's it is literally that number right so then"},{"id":178,"text":"there's a trade-off right we we discuss it several times right if mu is small like 1.05 you're taking"},{"id":179,"text":"little baby steps it's going to take one newton step or two to to recenter right but you're only"},{"id":180,"text":"making five percent progress each step or you could take you know mu equals ten good news is"},{"id":181,"text":"you're making you're going to divide your gap by a factor of ten when you finish bad news is it's"},{"id":182,"text":"going to be harder for the they're going to take more newton steps everybody following this okay"},{"id":183,"text":"so what this tells you and this is confirmed in lots and lots and lots of other cases is these"},{"id":184,"text":"two effects basically balance each other and that is super good because the last thing you want what"},{"id":185,"text":"What it says is the choice of mute"},{"id":186,"text":"doesn't make any difference at all."},{"id":187,"text":"I mean, as long as it's within a factor of 100"}],"notes":["本段讨论了牛顿法在大规模优化问题中的效率，特别是当问题维度很高时，例如5000维的情况下，仅需30次牛顿步骤即可完成优化。这表明牛顿法在处理大规模问题时具有显著的效率优势。"],"formulas":[],"uncertainties":["mu is the aggressiveness by which you update your homotopy parameter","it's the it's the it's a parameter that tells you how aggressively","the last thing you want what"],"diagram":"none","start":3333.25,"end":3512.6,"asr_flags":[],"math_clarifications":["原始文本讨论的是内点法和KKT系统，但未提及牛顿法、KKT系统的具体形式或参数mu的数学表达式。因此，所有公式均与上下文不符，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3333.25,"text":"But what this says is actually very, very weird. What it says is, if you think about it, you actually do 50 Newton steps. So what that means is, in solving this LP, you start at some point. Literally, you ask for directions. You calculate things involving these barrier functions and things like that and the equality constraint. Actually, you know exactly what you do. You solve a linear KKT system, and you get a direction. Everybody got that? Then on that direction, you do a line search."},{"start":3362.4,"text":"Right? Then you stop. That's iteration one. You're at the new point. You ask for directions again, which is you just query the constraints and the objective and you construct some KKT matrix and get a new direction and go again. Everybody got this? So let's pretend that that was in 5,000 variables, right? So that's in 5,000 dimensions. You basically stop and ask for directions 35 times. Everybody..."},{"start":3392.34,"text":"Getting this? This is, I find it impressive, right? Like R5000 is a really big place,"},{"start":3400.12,"text":"right? And so the idea that you actually can do this in like a mere 30 Newton steps or 30 steps,"},{"start":3406.3,"text":"right? I think is just stunning. Okay. So yeah. In the plot on the right, why are there these"},{"start":3415.92,"text":"little like jumps, for example, at 140, it's just, they're just, I don't know, but they're"},{"start":3421.64,"text":"They're just random perturbations of, you know, because you can accidentally land somewhere"},{"start":3426.34,"text":"where instead of taking some number of Newton steps, you take a lot less."},{"start":3429.82,"text":"That's a dumb luck phenomenon."},{"start":3431.4,"text":"So could be that."},{"start":3432.66,"text":"I don't know."},{"start":3433.86,"text":"Yeah."},{"start":3434.36,"text":"I mean, this is presumably on a single instance, right?"},{"start":3436.36,"text":"If we averaged over a bunch, I can't imagine that those bumps would stay there, right?"},{"start":3442.32,"text":"So, okay."},{"start":3444.36,"text":"This is also extremely important."},{"start":3447.5,"text":"And what it says is bizarre."},{"start":3449.42,"text":"are if you think about what mu does mu is the aggressiveness by which you update your homotopy"},{"start":3454.88,"text":"parameter or if you like it's it's the it's the it's a parameter that tells you how aggressively"},{"start":3459.98,"text":"each step you decrease the target gap in fact it's it is literally that number right so then"},{"start":3468.02,"text":"there's a trade-off right we we discuss it several times right if mu is small like 1.05 you're taking"},{"start":3473.78,"text":"little baby steps it's going to take one newton step or two to to recenter right but you're only"},{"start":3478.84,"text":"making five percent progress each step or you could take you know mu equals ten good news is"},{"start":3485.32,"text":"you're making you're going to divide your gap by a factor of ten when you finish bad news is it's"},{"start":3491.8,"text":"going to be harder for the they're going to take more newton steps everybody following this okay"},{"start":3495.34,"text":"so what this tells you and this is confirmed in lots and lots and lots of other cases is these"},{"start":3500.74,"text":"two effects basically balance each other and that is super good because the last thing you want what"},{"start":3506.84,"text":"What it says is the choice of mute"},{"start":3508.64,"text":"doesn't make any difference at all."},{"start":3509.98,"text":"I mean, as long as it's within a factor of 100"}],"speech_gaps":[],"frame":"../frames/v016/021.webp","frame_time":3345.25},{"title":"凸优化中的对数障碍方法迭代次数分析","segments":[{"id":188,"text":"of some reasonable value."},{"id":189,"text":"Everybody see this?"},{"id":190,"text":"So, it's very cool."},{"id":191,"text":"Okay, so this is what that looks like."},{"id":192,"text":"I find it pretty spooky, right, that this works. I mean, here's a GP. And again, these are small ones, but nevertheless, that's pretty cool. Here it is. And it takes 20 to whatever. Again, it takes like 30-something iterations, right?"},{"id":193,"text":"Yeah, by the way, something like this would be 25 years ago would just be like utterly unknown. People were still publishing papers on fancy custom methods to solve GPs. So this is maybe 30 years ago. Right. So still pretty cool. But they all these things all just start looking the same. Right. So here's what it looks like when you just take this is actually literally this is the one you're going to do for your homework. You're going to implement this and."},{"id":194,"text":"Here, we have a bunch of values of m, and we are going to solve like 100 different things. What's cool is you look, this is the problem size, right? And this is the number of steps. The first thing you should notice is that it ranges between like 20 and 25, you know, with the absolute maximum being 30."},{"id":195,"text":"And by the way, if you look at the output when you, you know, when you call the solve method in CVXPy, it's going to call... It's going to call some solver. But if it's something like ECOS or something like that, it will actually report, it'll actually tell you how many iterations it is. And it's typically between 20 and 50, right? So in fact, I don't think it's ever more than 50."},{"id":196,"text":"So, you know, first people said, oh, yeah, you know, it's like, I think it's like the square root. And someone said, I think it grows like the log and whatever. And then finally, what has become clear as an empirical fact is that the growth is O of one. In other words, barrier methods take between 20 and 50 steps, period. And that's just what they do in any dimension."},{"id":197,"text":"Oh, by the way, those steps are Newton steps. So what that means is you're solving a linear KKT system, right? So you're solving literally an H, A transpose, A, 0 set of linear equations, right? That's what it is. Now, of course, as the problem gets bigger, that numerical step, that's going to take you more time, obviously, right?"}],"notes":["本段主要讨论了凸优化中对数障碍方法的迭代次数。讲者指出，对于小规模问题，迭代次数通常在20到50次之间，且在不同维度下表现一致。这表明对数障碍方法在实际应用中具有较高的效率。","讲者提到，早期的优化方法需要复杂的自定义方法来解决几何规划（GP）问题，而现代方法如对数障碍方法则通过迭代求解线性KKT系统，使得问题变得简单且高效。","讲者指出，对数障碍方法的迭代次数在实践中表现出O(1)的复杂度，即迭代次数与问题规模无关，这在实际应用中是一个重要的发现。","讲者强调，虽然迭代次数在不同问题中可能略有不同，但通常在20到50次之间，这表明对数障碍方法在实际计算中具有良好的稳定性。","讲者提到，每次迭代实际上是在求解一个线性KKT系统，这涉及到Hessian矩阵和约束矩阵的计算，但随着问题规模的增加，计算时间会相应增加。","讲者还指出，对数障碍方法的迭代次数在实践中被广泛验证，这表明该方法在凸优化领域具有重要的应用价值。"],"formulas":[{"latex":"O(1)","symbols":"大O符号，表示迭代次数与问题规模无关","explanation":"O(1) 表示迭代次数为常数，与问题规模无关，符合原文中提到的迭代次数在20到50之间，且与维度无关的描述。","evidence":"So, you know, first people said, oh, yeah, you know, it's like, I think it's like the square root. And someone said, I think it grows like the log and whatever. And then finally, what has become clear as an empirical fact is that the growth is O of one. In other words, barrier methods take between 20 and 50 steps, period. And that's just what they do in any dimension. So, and this is, yeah, it's been borne out pretty well. Yeah, so I have a..."},{"latex":"H, A^T, A, 0","symbols":"Hessian矩阵、约束矩阵和零向量组成的线性方程组","explanation":"H, A^T, A, 0 表示求解线性KKT系统时的矩阵形式，符合原文中提到的求解Hessian矩阵、约束矩阵和零向量组成的线性方程组的描述。","evidence":"Oh, by the way, those steps are Newton steps. So what that means is you're solving a linear KKT system, right? So you're solving literally an H, A transpose, A, 0 set of linear equations, right? That's what it is. Now, of course, as the problem gets bigger, that numerical step, that's going to take you more time, obviously, right?"}],"uncertainties":[],"diagram":"none","start":3512.6,"end":3678.95,"asr_flags":[],"math_clarifications":["原文中提到的迭代次数为常数（O(1)）与问题规模无关，符合优化算法中某些方法的特性，如内点法（barrier methods）的迭代次数通常为常数。"],"raw_segments":[{"start":3512.6,"text":"of some reasonable value."},{"start":3514.22,"text":"Everybody see this?"},{"start":3515.76,"text":"So, it's very cool."},{"start":3518.84,"text":"Okay, so this is what that looks like."},{"start":3524.44,"text":"I find it pretty spooky, right, that this works. I mean, here's a GP. And again, these are small ones, but nevertheless, that's pretty cool. Here it is. And it takes 20 to whatever. Again, it takes like 30-something iterations, right?"},{"start":3547.18,"text":"Yeah, by the way, something like this would be 25 years ago would just be like utterly unknown. People were still publishing papers on fancy custom methods to solve GPs. So this is maybe 30 years ago. Right. So still pretty cool. But they all these things all just start looking the same. Right. So here's what it looks like when you just take this is actually literally this is the one you're going to do for your homework. You're going to implement this and."},{"start":3577.35,"text":"Here, we have a bunch of values of m, and we are going to solve like 100 different things. What's cool is you look, this is the problem size, right? And this is the number of steps. The first thing you should notice is that it ranges between like 20 and 25, you know, with the absolute maximum being 30. And by the way, if you look at t  fancy algorithm, because they're basically perfect now. They're more sophisticated than what I'm showing you, but they're very, very close. So actually, all the advances are in linear algebra. So that's what that's about. OK, so this just shows you how this works. OK, so what we're going to talk about now. So anyway, I think this is just sort of like amazing stuff."},{"start":3839.51,"text":"uh as i said so i'll tell you a little bit about the history of some of this so um there are"},{"start":3847.43,"text":"precursors of this in the 60s including all the way up to developing like codes algorithms ones"},{"start":3853.07,"text":"extremely similar to this right in the 60s they fell out of fashion or were ignored or were"}],"speech_gaps":[],"frame":"../frames/v016/023.webp","frame_time":3691.47},{"title":"凸优化课程中关于历史背景与可行性方法的讨论","segments":[{"id":207,"text":"unknown right like for example deacon's work right just completely unknown right so um what"},{"id":208,"text":"What happened was, in the late 80s, early 90s,"},{"id":209,"text":"it was rediscovered."},{"id":210,"text":"Of course, when it was rediscovered,"},{"id":211,"text":"it was much more complicated, obviously."},{"id":212,"text":"And so anyway, so people were writing papers."},{"id":213,"text":"And it was just getting very weird."},{"id":214,"text":"And it actually ended up on the front cover of The New York"},{"id":215,"text":"Times, because it was actually, this"},{"id":216,"text":"was the method used to show that linear programs can"},{"id":217,"text":"be solved in polynomial time, which had no,"},{"id":218,"text":"it had precisely zero practical consequences,"},{"id":219,"text":"because at that point, people who actually solved LPs"},{"id":220,"text":"had been solving them for 40 years at that point"},{"id":221,"text":"using the simplex method, which worked unbelievably well, thank you."},{"id":222,"text":"So it had no practical, but it was very funny"},{"id":223,"text":"because it was actually on the front page of the New York Times"},{"id":224,"text":"and it hinted, it said that vast numbers of scheduling problems"},{"id":225,"text":"and allocation problems can now be solved."},{"id":226,"text":"And it was like just completely wrong."},{"id":227,"text":"Anyway, but it's kind of cool because to see, I don't know,"},{"id":228,"text":"people I know have, you know, occurring on the front cover of the New York Times. Anyway,"},{"id":229,"text":"that's it. So, yeah, by the way, later, some 10 years later, people went back, found the history,"},{"id":230,"text":"pulled up these things from the 60s. Someone even took some crazy Fortran code from the 1960s."},{"id":231,"text":"untouched, which was on cards, read it in, updated it to whatever it was at the time, to F90 or something like that, updated it, and it was hilariously competitive with the best solvers at that time. By the way, it tells you something about academics and things like that, which is there are fashions, and there's all sorts of stuff that works perfectly well, but people just ignore it and move on."},{"id":232,"text":"out of snobbery or ignorance or something anyway. I thought that was very embarrassing for the field. That's it. What we're going to talk about now is feasibility in Phase 1 methods."},{"id":233,"text":"required actually a strictly feasible point, right? What I will say is that the methods people actually use don't, they use something that does phase one and phase two all together and all that kind of stuff."},{"id":234,"text":"By the way, if we had one more week of this class, you would actually implement that. Because it would be about, I don't know, five more lines than what you're going to write. And that one would actually scale, handle feasibility, unboundness, everything just all at once. But nevertheless, this is actually very good to know about because it's got a lot of uses just by itself. So here it is."}],"notes":["本段讨论了凸优化方法在20世纪80年代和90年代被重新发现的历史背景，强调了当时虽然理论上有突破，但实际应用价值有限。讲者 t":3915.35,"text":"and allocation problems can now be solved."},{"start":3917.79,"text":"And it was like just completely wrong."},{"start":3919.47,"text":"Anyway, but it's kind of cool because to see, I don't know,"},{"start":3924.63,"text":"people I know have, you know, occurring on the front cover of the New York Times. Anyway,"},{"start":3928.49,"text":"that's it. So, yeah, by the way, later, some 10 years later, people went back, found the history,"},{"start":3934.99,"text":"pulled up these things from the 60s. Someone even took some crazy Fortran code from the 1960s."},{"start":3942.67,"text":"untouched, which was on cards, read it in, updated it to whatever it was at the time, to F90 or something like that, updated it, and it was hilariously competitive with the best solvers at that time. By the way, it tells you something about academics and things like that, which is there are fashions, and there's all sorts of stuff that works perfectly well, but people just ignore it and move on."},{"start":3968.15,"text":"out of snobbery or ignorance or something anyway. I thought that was very embarrassing for the field. That's it. What we're going to talk about now is feasibility in Phase 1 methods."},{"start":3989.76,"text":"required actually a strictly feasible point, right? What I will say is that the methods people actually use don't, they use something that does phase one and phase two all together and all that kind of stuff."},{"start":4003.82,"text":"By the way, if we had one more week of this class, you would actually implement that. Because it would be about, I don't know, five more lines than what you're going to write. And that one would actually scale, handle feasibility, unboundness, everything just all at once. But nevertheless, this is actually very good to know about because it's got a lot of uses just by itself. So here it is."}],"speech_gaps":[],"frame":"../frames/v016/024.webp","frame_time":3870.71},{"title":"可行性问题与相位一相位二方法","segments":[{"id":235,"text":"So the feasibility problem is, you know, find an X that satisfies a bunch of inequalities and maybe some linear equality constraints, right? And so the classical method, they call it a phase one, phase two method. So phase one, find a feasible point. Phase two, you know, run an algorithm to find an optimal point. And this is kind of old school, but it's not, you might someday encounter."},{"id":236,"text":"people who were trained in old school stuff. And then if you drop, I mean, if you say it around, a lot of people today, if you say phase one, phase two, they're like, what are you talking about? But it's possible you'll meet some of these people sometime. And the ideas are very interesting."},{"id":237,"text":"Okay, so here's what you do. What we do is we put here a slack variable S. Right? And we want to minimize over x and s this s. Now what we do is we stop, we terminate this. The minute we produce something with s negative, we quit. Because at that point, what you've done is you've computed a strictly feasible point and then you jump back to the barrier method. Or actually, you can apply the barrier method to this. Because here I know a feasible point. It's like you pick your favorite point x that satisfies ax equals b. Okay, it has to be in the domain of the FIs, but whatever."},{"id":238,"text":"What I do is I evaluate fi of x, all of them. I take the max of that, those numbers, plus one, and that's my initial s. It's feasible, right? And so this would just work. Okay, so that's that. But let me ask you a couple of questions. So let me ask what happens if these inequalities are not feasible."},{"id":239,"text":"So let me ask you a couple of questions. So let me ask what happens if these inequalities are not feasible."},{"id":240,"text":"then what's going to happen is when you solve this problem, you're going to get S equals like,"},{"id":241,"text":"you know, 1.3. And that has a beautiful interpretation. It says, it basically says"},{"id":242,"text":"your inequalities are not mutually feasible because they're all Fi less than zero. But if"},{"id":243,"text":"you relax those and everyone looks like Fi of X is less than 1.3, I got a point for you. Everybody"},{"id":244,"text":"following this? And so, so you're kind of, basically you can interpret this, this basic"},{"id":245,"text":"phase one method is minimizing the maximum constraint violation, right? And I'm going"},{"id":246,"text":"to ask you a question. Suppose a set of inequalities is not feasible. And here's what I want to know."},{"id":247,"text":"I run this. S star turns out to be 1.3, let's say. I want you to tell me about what do you"},{"id":248,"text":"think the FIs look like? This is just a guess, right? I mean, what do you imagine?"},{"id":249,"text":"that's exactly right"},{"id":250,"text":"basically"}],"notes":["本段讲解了凸优化中的可行性问题，即寻找满足一系列不等式和可能的线性等式约束的点。传统方法被称为相位一和相位二方法，其中相位一用于找到可行点，相位二用于寻找最优解。这种方法虽然较为传统，但在某些情况下仍然有用。","讲者提到，虽然现代人可能对相位一和相位二方法不熟悉，但仍然有可能在某些场合遇到这些方法。这种方法的核心思想是通过引入松弛变量来处理不等式约束。","在相位一方法中，讲者介绍了如何通过最小化最大约束违反量来找到可行点。具体来说，通过引入松弛变量S，并计算所有约束函数的值，取最大值并加一作为初始的S值。","当不等式不可行时，通过求解问题得到的S值（如1.3）表示约束的违反程度。这表明约束条件需要被放松，使得所有约束函数的值小于某个阈值（如1.3）。","讲者进一步询问，如果约束不可行，S值为1.3时，约束函数Fi可能的形状是什么。这引导学生思考约束函数的性质和如何通过调整约束来找到可行解。","讲者指出，相位一方法的核心思想是通过最小化最大约束违反量来找到可行点，这为后续的优化方法（如障碍方法）提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4024.67,"end":4203.73,"asr_flags":[],"raw_segments":[{"start":4024.67,"text":"So the feasibility problem is, you know, find an X that satisfies a bunch of inequalities and maybe some linear equality constraints, right? And so the classical method, they call it a phase one, phase two method. So phase one, find a feasible point. Phase two, you know, run an algorithm to find an optimal point. And this is kind of old school, but it's not, you might someday encounter."},{"start":4053.17,"text":"people who were trained in old school stuff. And then if you drop, I mean, if you say it around, a lot of people today, if you say phase one, phase two, they're like, what are you talking about? But it's possible you'll meet some of these people sometime. And the ideas are very interesting. Okay, so here's what you do. What we do is we put here a slack variable S."},{"start":4078.33,"text":"Right? And we want to minimize over x and s this s. Now what we do is we stop, we terminate this. The minute we produce something with s negative, we quit. Because at that point, what you've done is you've computed a strictly feasible point and then you jump back to the barrier method. Or actually, you can apply the barrier method to this. Because here I know a feasible point. It's like you pick your favorite point x that satisfies ax equals b. Okay, it has to be in the domain of the FIs, but whatever."},{"start":4109.99,"text":"What I do is I evaluate fi of x, all of them. I take the max of that, those numbers, plus one, and that's my initial s. It's feasible, right? And so this would just work. Okay, so that's that. But let me ask you a couple of questions. So let me ask what happens if these inequalities are not feasible."},{"start":4136.29,"text":"then what's going to happen is when you solve this problem, you're going to get S equals like,"},{"start":4140.83,"text":"you know, 1.3. And that has a beautiful interpretation. It says, it basically says"},{"start":4145.97,"text":"your inequalities are not mutually feasible because they're all Fi less than zero. But if"},{"start":4153.35,"text":"you relax those and everyone looks like Fi of X is less than 1.3, I got a point for you. Everybody"},{"start":4159.49,"text":"following this? And so, so you're kind of, basically you can interpret this, this basic"},{"start":4164.07,"text":"phase one method is minimizing the maximum constraint violation, right? And I'm going"},{"start":4169.79,"text":"to ask you a question. Suppose a set of inequalities is not feasible. And here's what I want to know."},{"start":4176.83,"text":"I run this. S star turns out to be 1.3, let's say. I want you to tell me about what do you"},{"start":4182.95,"text":"think the FIs look like? This is just a guess, right? I mean, what do you imagine?"},{"start":4198.11,"text":"that's exactly right"},{"start":4199.91,"text":"basically"},{"start":4201.73,"text":"if you're anthropomorphizing this"}],"speech_gaps":[],"frame":"../frames/v016/025.webp","frame_time":4036.67},{"title":"约束违反的最小化方法","segments":[{"id":251,"text":"you have all these functions"},{"id":252,"text":"here, you want them all to be"},{"id":253,"text":"less than zero, so what you do is"},{"id":254,"text":"you just put a big old flat thing on top of it"},{"id":255,"text":"that's s, and you just push down"},{"id":256,"text":"you push down"},{"id":257,"text":"until it locks, and it's pushing back"},{"id":258,"text":"harder than you can push"},{"id":259,"text":"in fact with infinite things, so you can actually make a mechanical"},{"id":260,"text":"interpretation if you wanted"},{"id":261,"text":"right? Everybody, everybody see this? Now, when, when you stop, when, when this thing locks and"},{"id":262,"text":"you can't push it down any farther, there's going to be at least several, and in general,"},{"id":263,"text":"a whole bunch of constraints violated by 1.3. Everybody got that? So, and that, you know,"},{"id":264,"text":"there are applications where that might be of interest, right? You'd say, I have a whole bunch"},{"id":265,"text":"of constraints and you'd say, well, I got good news and bad news. Bad news is no one, there is"},{"id":266,"text":"no x that satisfies all your constraints. There's no design that meets all your specs."},{"id":267,"text":"Good news is if I only relax all of them by like, you know, 0.3, then it's feasible. Everybody see this? Right? Okay, so that's the idea there. So if you do, then we go to the next one, which is a sum of infeasibilities method. And so the previous one you should think of as kind of roughly analogous to an L-infinity norm. We were minimizing the maximum
