 right and so this actually starts getting super interesting right"},{"start":4356.84,"text":"because what it is is you say i'm trying to design this you know this thing and you gave me 50 specs"},{"start":4362.66,"text":"and you go bad news can't be done can't it's not achievable and i can prove it by the way"},{"start":4367.16,"text":"right because you can produce a certificate or a theorem of the alternatives a certificate showing"},{"start":4371.44,"text":"showing it. And you'd say, and they'd say, yeah, but I got to do, we got to do something. We got"},{"start":4375.9,"text":"to build this product. And he'd say, that's fine. Here's what I did. I did find, I did find"}],"speech_gaps":[],"frame":"../frames/v016/026.webp","frame_time":4215.73},{"title":"约束松弛与可行性分析","segments":[{"id":277,"text":"something that satisfies 47 of your 50 constraints. Everybody got that? So, and that, that's what you"},{"id":278,"text":"would see here, which is really cool. And here's a, here's a picture. We can, we can take a look"},{"id":279,"text":"at this. Oh, here's an example. This is, this is, this is the, this is actually the margin"},{"id":280,"text":"in your constraint. So you want to push this to be above zero. This failed. It's infeasible. You"},{"id":281,"text":"stop there. And just as we guessed, a whole bunch of them are lined up at this worst point, which"},{"id":282,"text":"is minus 0.2 or I don't know, whatever it is, 0.2, right? Okay. That's the, this is what happens"},{"id":283,"text":"when you do a sum of infeasibilities. And it's really cool. What it says is, you know, I don't"},{"id":284,"text":"So 55 of your FIs are tight."},{"id":285,"text":"Actually, these are all ones that are just slack, right?"},{"id":286,"text":"Whatever Fi of X is actually negative for these."},{"id":287,"text":"And then you have a handful here which you can't satisfy, right?"},{"id":288,"text":"And so, again, this is just our old friend, the L1 sparsifier here."},{"id":289,"text":"It's kind of cool, right, this thing?"},{"id":290,"text":"And these are also already quite useful in various applications that I've seen."},{"id":291,"text":"Make sense? So here's an example. So you have just a family of linear inequality. So it's a polyhedron. But I have a delta, a gamma, sorry, a parameter gamma. And it's chosen so that when gamma equals zero, the polyhedron collapses and has zero volume. When gamma is negative,"},{"id":292,"text":"or less than or equal to zero, well, when it's negative, it's infeasible, and when it's positive, it's feasible, and you're just scaling the right-hand side, so the polyhedron is just growing, right? And now what we can do is we can use the basic phase one and stuff like that, and look at the number of steps it takes to either find a point, right, in the first case, so here's what it looks like. It's actually super interesting."},{"id":293,"text":"So it looks like it takes like 40 steps unless you're right at the boundary of between feasible and infeasible. And that's the only, in fact, you have to adjust the data very carefully to get more than, you know, whatever, 30, 40 steps to do this, to solve this phase one problem. But you can do it. I mean, but what it says in practice, it just doesn't happen, right? Oh, this is showing you the zoomed in version. Actually, these are sort of interesting, right?"}],"notes":["本段主要讲解了约束松弛与可行性分析的概念。讲者提到，当有50个约束时，满足其中47个约束的情况是可能的，这说明了在优化问题中，某些约束可能被违反，而其他约束则被满足。讲者还提到，当约束的松弛量（margin）为负时，问题不可行，此时需要停止计算。此外，讲者还提到，当约束的松弛量为零时，约束是紧的（tight），而当松弛量为正时，约束是松的（slack）。"],"formulas":[],"uncertainties":["Fi of X"],"diagram":"none","start":4381.9,"end":4540.9,"asr_flags":[],"raw_segments":[{"start":4381.9,"text":"something that satisfies 47 of your 50 constraints. Everybody got that? So, and that, that's what you"},{"start":4388.96,"text":"would see here, which is really cool. And here's a, here's a picture. We can, we can take a look"},{"start":4393.5,"text":"at this. Oh, here's an example. This is, this is, this is the, this is actually the margin"},{"start":4399.58,"text":"in your constraint. So you want to push this to be above zero. This failed. It's infeasible. You"},{"start":4405.4,"text":"stop there. And just as we guessed, a whole bunch of them are lined up at this worst point, which"},{"start":4409.92,"text":"is minus 0.2 or I don't know, whatever it is, 0.2, right? Okay. That's the, this is what happens"},{"start":4415.76,"text":"when you do a sum of infeasibilities. And it's really cool. What it says is, you know, I don't"},{"start":4421.46,"text":"So 55 of your FIs are tight."},{"start":4425.82,"text":"Actually, these are all ones that are just slack, right?"},{"start":4432.28,"text":"Whatever Fi of X is actually negative for these."},{"start":4434.84,"text":"And then you have a handful here which you can't satisfy, right?"},{"start":4438.94,"text":"And so, again, this is just our old friend, the L1 sparsifier here."},{"start":4444.12,"text":"It's kind of cool, right, this thing?"},{"start":4445.94,"text":"And these are also already quite useful in various applications that I've seen."},{"start":4455.15,"text":"Make sense? So here's an example. So you have just a family of linear inequality. So it's a polyhedron. But I have a delta, a gamma, sorry, a parameter gamma. And it's chosen so that when gamma equals zero, the polyhedron collapses and has zero volume. When gamma is negative,"},{"start":4485.93,"text":"or less than or equal to zero, well, when it's negative, it's infeasible, and when it's positive, it's feasible, and you're just scaling the right-hand side, so the polyhedron is just growing, right? And now what we can do is we can use the basic phase one and stuff like that, and look at the number of steps it takes to either find a point, right, in the first case, so here's what it looks like. It's actually super interesting."},{"start":4513.42,"text":"So it looks like it takes like 40 steps unless you're right at the boundary of between feasible and infeasible. And that's the only, in fact, you have to adjust the data very carefully to get more than, you know, whatever, 30, 40 steps to do this, to solve this phase one problem. But you can do it. I mean, but what it says in practice, it just doesn't happen, right? Oh, this is showing you the zoomed in version. Actually, these are sort of interesting, right? Because..."}],"speech_gaps":[],"frame":"../frames/v016/027.webp","frame_time":4393.9},{"title":"自洽障碍函数的理论与实践","segments":[{"id":294,"text":"Over on the left, you would say, this is taking only 30 steps. You'd say, why? Because it's infeasible, but there's a lot of certificates of infeasibility. It's easy, so it doesn't take many steps to prove infeasibility. This is like the polyhedron is over here on the right. The polyhedron is so big, it doesn't take very long to find a feasible point."},{"id":295,"text":"And then the only time this increases is when you get right between the boundary of what's feasible and not feasible, right? So that's where it goes up like that. That's what it looks like. So, okay. So that's a picture of that. We'll just start talking about this and we'll finish this up next week. But it's actually really quite cool."},{"id":296,"text":"So we're going to assume that F0 is going to be, and the FIs are going to be, well, actually, it's actually the barrier. I want T F0 plus phi to be self-concordant, right? So that's the requirement. And there might be some, like, here's a minimum, here's a maximum entropy problem."},{"id":297,"text":"with inequality constraints. And it turns out that's not self-concordant. Again, you don't have to know this, but when you put in the x bigger than or equal to zero, you add a log barrier, then it becomes, that's a redundant constraint, that x bigger than or equal to zero. That's completely redundant because this objective, its domain, is x has to be bigger than or equal to zero. So this is completely redundant. But when you add that redundant constraint and you work out the log barrier, which is just negative sum log xi,"},{"id":298,"text":"then that function becomes self-concordant, right? But what I should do is I should preface all of this by saying what you're going to see is super cool, but it is not at all clear what its practical implications are, right? That is not clear at all. Its theoretical implications are very clear. Practical ones, not so much. So, and it's very weird, you know, most..."},{"id":299,"text":"So, you know, actually it'll change every couple of years, right? People will implement solvers which are actually use self-concordant barriers and all that kind of stuff and actually agree with the theory. But then they'll find something that just makes it a lot faster and they're like, we don't care. Then the theorist will catch up a few years later and write something about it. Anyway, so there's just this oscillation where it kind of goes like that. But it's not at all clear, you know. But I have met weird people who've said things like,"}],"notes":["本段讲解了自洽障碍函数（self-concordant barrier）的概念及其在优化问题中的应用。讲者指出，当在目标函数中加入对数障碍项（log barrier）时，原本不自洽的约束条件会变得自洽。这在处理不等式约束时尤为重要，例如在最大熵问题中，通过添加对数障碍项可以使得函数满足自洽性要求。","讲者强调了自洽障碍函数的理论价值，但指出其在实际应用中的意义尚不明确。虽然理论上的推导清晰，但实际应用中可能因为更高效的算法而被忽略，导致理论与实践之间存在一定的脱节。","讲者提到，自洽障碍函数的理论发展与实际应用之间存在一种周期性的互动。理论研究者会提出新的方法，而实际应用者则可能因为发现更高效的算法而忽略这些理论成果，这种互动导致了理论与实践之间的不断调整。","讲者还提到，某些人可能会对自洽障碍函数的理论价值提出质疑，认为其在实际应用中并不重要。这反映了在优化领域中，理论与实践之间可能存在一定的分歧。","讲者指出，自洽障碍函数的理论发展可能随着技术的进步而发生变化，新的算法可能会取代旧的理论成果，这表明该领域的研究具有一定的动态性和不确定性。","讲者最后提到，虽然自洽障碍函数的理论意义明确，但其实际应用的前景尚不清晰，这表明该领域仍需进一步的研究和探索。"],"formulas":[],"uncertainties":["T F0 plus phi"],"diagram":"none","start":4543.11,"end":4699.62,"asr_flags":[],"math_clarifications":["原文中提到的公式无法核定其数学类型和符号含义，缺乏上下文支持，因此决定移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4543.11,"text":"Over on the left, you would say, this is taking only 30 steps. You'd say, why? Because it's infeasible, but there's a lot of certificates of infeasibility. It's easy, so it doesn't take many steps to prove infeasibility. This is like the polyhedron is over here on the right. The polyhedron is so big, it doesn't take very long to find a feasible point."},{"start":4564.75,"text":"And then the only time this increases is when you get right between the boundary of what's feasible and not feasible, right? So that's where it goes up like that. That's what it looks like. So, okay. So that's a picture of that. We'll just start talking about this and we'll finish this up next week. But it's actually really quite cool."},{"start":4594.24,"text":"So we're going to assume that F0 is going to be, and the FIs are going to be, well, actually, it's actually the barrier. I want T F0 plus phi to be self-concordant, right? So that's the requirement. And there might be some, like, here's a minimum, here's a maximum entropy problem."},{"start":4616.46,"text":"with inequality constraints. And it turns out that's not self-concordant. Again, you don't have to know this, but when you put in the x bigger than or equal to zero, you add a log barrier, then it becomes, that's a redundant constraint, that x bigger than or equal to zero. That's completely redundant because this objective, its domain, is x has to be bigger than or equal to zero. So this is completely redundant. But when you add that redundant constraint and you work out the log barrier, which is just negative sum log xi,"},{"start":4644.48,"text":"then that function becomes self-concordant, right? But what I should do is I should preface all of this by saying what you're going to see is super cool, but it is not at all clear what its practical implications are, right? That is not clear at all. Its theoretical implications are very clear. Practical ones, not so much. So, and it's very weird, you know, most..."},{"start":4670.8,"text":"So, you know, actually it'll change every couple of years, right? People will implement solvers which are actually use self-concordant barriers and all that kind of stuff and actually agree with the theory. But then they'll find something that just makes it a lot faster and they're like, we don't care. Then the theorist will catch up a few years later and write something about it. Anyway, so there's just this oscillation where it kind of goes like that. But it's not at all clear, you know. But I have met weird people who've said things like,"}],"speech_gaps":[],"frame":"../frames/v016/028.webp","frame_time":4555.11},{"title":"自洽函数与牛顿步数的分析","segments":[{"id":300,"text":"They said, what barrier are you using? And you'd write it down and someone would say like, oh my God, that's not self-concordant. You're like, I mean, the algorithm complexity police aren't here, right? So is there an algorithm complexity warrant for your arrest? What are you worried about, right? Anyway, but nevertheless, it's very cool, the analysis. Okay, so let's take a look at it. It's actually just completely..."},{"id":301,"text":"insane. It goes like this, right? So remember what it is. There's two terms, right? There's basically the number of centering steps, but that's just like log 1 over mu."},{"id":302,"text":"Like, that's what it has to do with, right? Mu is this, this is how aggressively you walk along this central path, right? So that's your, in fact, people call that the homotopy parameter, right? It's how fast you increase your homotopy parameter, right? Okay, so the question is, how many Newton steps does it take if I'm on the central path, I increase t by a factor mu, and I have to calculate the new point, right? That is the..."},{"id":303,"text":"Once we know what that, if we bound that number, that's the number of Newton steps. That's the maximum number of Newton steps you can take in one of these centering steps, and you multiply that by basically log 1 over mu, and you get your total number, your total count. Everybody got this? Okay, so if you remember what that looked like, it looked like this, and this sounded kind of weird. Basically, the number of steps looks like something like f of, let's say, you know, x0."},{"id":304,"text":"Everybody got this? Okay, so if you remember what that looked like, it looked like this, and this sounded kind of weird. Basically, the number of steps looks like something like f of, let's say, you know, x0. minus the f of x star, like this, divided by some number. Did I write it out here or something? Yeah, I called it gamma there, right? And then plus a constant, right? It's not really a constant. The constant is really like a log log something or other, but basically it's fine. It's five or something, or not even five, right?"},{"id":305,"text":"If a function is self-concordant, actually, the classical analysis gives you the same thing. It's just that C and gamma depend on all sorts of things that you would never know and are not affinely independent. But if F is self-concordant, we actually know numbers that are valid for this."},{"id":306,"text":"Now, there is this embarrassing thing, which is someone says, what's the maximum number of Newton steps it's going to take? And you go, well, it's this. and you go yeah but how do you know this right and so you get your it's very embarrassing because you'd say oh yeah no problem to bound the number of newton steps all you have to do is first solve it using newton's method then you know this then you subtract this and divide and add that right and you're like dude what i just solved it i know the exact number of newton steps now so i don't need your stupid bound anymore is everyone following this right so i mean it's reasonable right um but"}],"notes":["本段讨论了自洽函数在牛顿法中的应用，特别是自洽函数如何影响牛顿步数的分析。讲者提到，自洽函数的分析与非自洽函数的分析在形式上是相似的，但参数C和gamma的取值依赖于函数的性质，这些性质通常难以直接确定。","讲者指出，当函数是自洽时，我们可以知道具体的数值来确定牛顿步数的上界。然而，这种分析在实际操作中可能显得尴尬，因为如果已经通过牛顿法求解了问题，那么精确的步数已经知道，不需要再依赖上界。","讲者还提到，牛顿步数的上界通常与中心路径上的步长参数mu有关，通过乘以log(1/mu)来得到总的步数。这表明，mu的取值对算法的复杂度有直接影响。","在分析中，讲者提到一个公式，该公式类似于f(x0) - f(x*)除以某个常数gamma，再加上一个常数项。这个公式用于估计牛顿步数的上界，但常数项可能涉及对数项，如log log等。 xt":"Once we know what that, if we bound that number, that's the number of Newton steps. That's the maximum number of Newton steps you can take in one of these centering steps, and you multiply that by basically log 1 over mu, and you get your total number, your total count. Everybody got this? Okay, so if you remember what that looked like, it looked like this, and this sounded kind of weird. Basically, the number of steps looks like something like f of, let's say, you know, x0."},{"start":4797.57,"text":"minus the f of x star, like this, divided by some number. Did I write it out here or something? Yeah, I called it gamma there, right? And then plus a constant, right? It's not really a constant. The constant is really like a log log something or other, but basically it's fine. It's five or something, or not even five, right? So I don't know if you remember this, but this is the..."},{"start":4822.03,"text":"If a function is self-concordant, actually, the classical analysis gives you the same thing. It's just that C and gamma depend on all sorts of things that you would never know and are not affinely independent. But if F is self-concordant, we actually know numbers that are valid for this. Now, there is this embarrassing thing, which is someone says, what's the maximum number of Newton steps it's going to take? And you go, well, it's this."},{"start":4849.18,"text":"and you go yeah but how do you know this right and so you get your it's very embarrassing because you'd say oh yeah no problem to bound the number of newton steps all you have to do is first solve it using newton's method then you know this then you subtract this and divide and add that right and you're like dude what i just solved it i know the exact number of newton steps now so i don't need your stupid bound anymore is everyone following this right so i mean it's reasonable right um but"}],"speech_gaps":[],"frame":"../frames/v016/029.webp","frame_time":4712.34},{"title":"对偶性与下界","segments":[{"id":3 else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}

else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
