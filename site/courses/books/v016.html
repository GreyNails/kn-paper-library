en think about what would happen, right? What if I shoved an inequality here and here and I put a whole bunch over here, right? Each of those is producing a force. Now, they're not inside here to, you know, but it's going to feel this. Suppose I put like 10 constraints right here. Someone tell me, what do you think the central path is going to look like then?"},{"start":1836.11,"text":"But it's going to still sneak up to the solution, right? Because there's all these repulsive forces this way, so it's going to actually do something weird like go along this way, right? But the same story is going to happen. It's going to converge to the solution. Okay, so again, this is just for interpretation so you understand how these things work."}],"speech_gaps":[],"frame":"../frames/v016/011.webp","frame_time":1689.59},{"title":"历史方法与无约束最小化技术","segments":[{"id":101,"text":"Actually, when we get to actually see how they work, no one understands how they work. But if you want to pretend to understand how they work, this is a good picture to do that with. Okay, so this brings us to the barrier method. Actually, before I do this, I'm going to talk about another method before that. And it's historical. By the way, some of the history is that a lot of this was worked out.","zh":"实际上，当我们真正看到它们是如何运作的时候，没有人真正理解它们是如何运作的。但如果你想假装自己理解它们是如何运作的，这是一张很好的图片来做到这一点。好的，这带我们进入了障碍方法。实际上，在我这样做之前，我想先谈谈之前的一种方法。而且这是历史性的。顺便说一句，一些历史事实是，很多这些内容已经被研究出来了。","start":1855.91,"end":1886.2},{"id":102,"text":"Actually, in the 1960s, it had names like barrier method. Actually, the famous method is something called SUMT, S-U-M-T, is sequential unconstrained minimization technique. It's from the 60s. It was discovered that someone named Deacon in the Soviet Union had worked out actually a completely modern algorithm for all this in 1967. And I guess my friends in Moscow said it was hardly known.","zh":"实际上，在1960年代，这种方法被称为障碍方法。实际上，著名的算法叫做SUMT，即序列无约束最小化技术。它来自60年代。人们发现，苏联有一位名叫Deacon的人在1967年实际上已经开发出了一种完全现代的算法来处理所有这些问题。我想我的莫斯科朋友们说，这个方法当时几乎不为人所知。","start":1886.64,"end":1915.7},{"id":103,"text":"Or he said it was ignored by people in Moscow. He said, and unknown in the West. That was, anyway, it was actually everything that, you know, two decades later was going to be, was going to make it to the front page of the New York Times was in this 1967 paper by some guy in some Hick province or way off somewhere. I don't know where it was. Okay. So, all right. So then.","zh":"或者他说，莫斯科的人们忽略了他。他说，这在西方也是不为人知的。无论如何，这实际上就是后来二十年里，即将登上《纽约时报》头版的内容，出现在1967年由某位来自某个偏远省份或遥远地方的人所写的论文中。我不知道它在哪里。好的。那么，好了。那么接下来。","start":1916.26,"end":1942.16},{"id":104,"text":"In the U.S., there were people, Fiacco and McCormick, had come up with these things called the sequential unconstraintization technique. So let me explain what it is. Let's go back. Actually, I guess you already know all the story, but it goes like this. Now that we know, you know how to solve that problem up there. It's just Newton's method. You know how to do it. When you do it, actually, not only will you...","zh":"在美国，有Fiacco和McCormick等人提出了这些被称为序贯无约束化技术的方法。让我解释一下这是什么。让我们回到过去。实际上，我想你已经知道整个故事了，但它是这样的。现在我们知道，如何解决上面的那个问题。它只是牛顿法。你知道如何做。当你这样做时，实际上，你不仅会……","start":1943.22,"end":1969.07},{"id":105,"text":"When you solve that problem, you'll get an approximate solution of the original problem. But with a very strong approximation, you're going to get both a primal and a dual solution, you know, candidates. And the associated gap is going to be exactly M over T, right? So in some sense, you're just done. Like, that's done. You just say, did you want to solve an LP?","zh":"当你解决这个问题时，你会得到原始问题的一个近似解。但有一个非常强的近似，你会同时得到一个原始解和一个对偶解，也就是候选解。并且相关的间隙将是正好M除以T，对吧？所以在某种意义上，你已经完成了。就像，这就是完成的。你只需要说，你想解决一个线性规划问题吗？","start":1969.42,"end":1991.95},{"id":106,"text":"Then I'd say, to what accuracy do you want to solve it? And someone says, you know, 1e minus 5. And I go, cool. Then what's your m? And now I choose t. And it's an approximation that comes back with a certificate certifying its accuracy. Everybody got this? And that doesn't have a name, but I would call it UMT for Unconstrained Minimization Technique.","zh":"然后我会问，你想以什么精度来求解这个问题？有人回答说，你知道的，1e-5。我说，很好。然后你的m是多少？现在我选择t。这是一个带有证书的近似方法，该证书证明了其精度。大家明白了吗？这个方法没有特定的名称，但我会称它为UMT，即无约束最小化技术。","start":1992.93,"end":2015.86}],"notes":["本段介绍了凸优化中的一些历史方法，特别是屏障方法（barrier method）和序列无约束最小化技术（SUMT）。这些方法在1960年代被提出，其中SUMT是由Deacon在苏联于1967年提出的，但当时在莫斯科和西方都被忽视。","在1960年代，Fiacco和McCormick在美国提出了类似的无约束最小化技术，称为序列无约束最小化技术（sequential unconstraintization technique）。这种方法通过将约束问题转化为无约束问题来求解。","当使用牛顿法求解无约束问题时，可以得到原始问题和对偶问题的近似解，且解之间的差距为M/T。这种近似解具有很强的准确性，并且可以提供一个证书来证明其精度。","在实际应用中，用户需要指定求解的精度，例如1e-5。然后根据这个精度选择参数t，从而得到一个具有精度保证的近似解。","虽然这些方法在当时没有被广泛认可，但它们为后来的凸优化理论奠定了基础，并且在现代优化算法中仍然具有重要地位。","这些方法的提出和应用展示了凸优化理论的发展历程，以及如何通过历史方法来解决实际问题。"],"formulas":[],"uncertainties":["Hick province"],"diagram":"none","start":1855.91,"end":2015.86,"asr_flags":[],"math_clarifications":["公式中的差距（gap）被定义为M/T，但没有提供M和T的具体定义或上下文，无法确认其数学意义和正确性。因此，该公式需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1855.91,"text":"Actually, when we get to actually see how they work, no one understands how they work. But if you want to pretend to understand how they work, this is a good picture to do that with. Okay, so this brings us to the barrier method. Actually, before I do this, I'm going to talk about another method before that. And it's historical. By the way, some of the history is that a lot of this was worked out."},{"start":1886.64,"text":"Actually, in the 1960s, it had names like barrier method. Actually, the famous method is something called SUMT, S-U-M-T, is sequential unconstrained minimization technique. It's from the 60s. It was discovered that someone named Deacon in the Soviet Union had worked out actually a completely modern algorithm for all this in 1967. And I guess my friends in Moscow said it was hardly known."},{"start":1916.26,"text":"Or he said it was ignored by people in Moscow. He said, and unknown in the West. That was, anyway, it was actually everything that, you know, two decades later was going to be, was going to make it to the front page of the New York Times was in this 1967 paper by some guy in some Hick province or way off somewhere. I don't know where it was. Okay. So, all right. So then."},{"start":1943.22,"text":"In the U.S., there were people, Fiacco and McCormick, had come up with these things called the sequential unconstraintization technique. So let me explain what it is. Let's go back. Actually, I guess you already know all the story, but it goes like this. Now that we know, you know how to solve that problem up there. It's just Newton's method. You know how to do it. When you do it, actually, not only will you..."},{"start":1969.42,"text":"When you solve that problem, you'll get an approximate solution of the original problem. But with a very strong approximation, you're going to get both a primal and a dual solution, you know, candidates. And the associated gap is going to be exactly M over T, right? So in some sense, you're just done. Like, that's done. You just say, did you want to solve an LP?"},{"start":1992.93,"text":"Then I'd say, to what accuracy do you want to solve it? And someone says, you know, 1e minus 5. And I go, cool. Then what's your m? And now I choose t. And it's an approximation that comes back with a certificate certifying its accuracy. Everybody got this? And that doesn't have a name, but I would call it UMT for Unconstrained Minimization Technique."}],"speech_gaps":[],"frame":"../frames/v016/012.webp","frame_time":1867.91},{"title":"对偶可行性与近似方法","segments":[{"id":107,"text":"And all it means is you approximated, I mean, it's basically back to that story originally where we approximated this indicator function here with something smooth, then we applied Newton's method. But the nice part is we got a lot of cool stuff there where we know if you use log barrier and all that kind of stuff, you're actually going to get dual feasible points and you get a gap and you know exactly what the gap is. Everybody see this?","zh":"这仅仅意味着你进行了近似，我的意思是，这基本上又回到了最初的故事，我们在那里用一个平滑的函数近似了这个指示函数，然后应用了牛顿法。但好的一点是我们得到了很多有趣的东西，我们知道如果你使用对数障碍函数之类的东西，你实际上会得到对偶可行点，并且你会得到一个间隙，而且你知道这个间隙到底是什么。大家明白这一点吗？","start":2016.22,"end":2039.94},{"id":108,"text":"Actually, hilariously, that method is perfectly good for tons of practical problems. Just so you know. Of course, it's not generic. You have to choose the t very carefully. And everything you think about it is right, that if you choose t too large, the larger t is, the better approximation you get. But also, the larger the number of Newton steps it's going to take to solve it and all that kind of stuff. Everybody got that? So that's UMT.","zh":"实际上，有趣的是，这种方法对于大量的实际问题来说是非常有效的。你们要知道。当然，它并不是通用的。你必须非常小心地选择参数t。你所想的都对，即如果你选择的t太大，t越大，近似效果越好。但同时，求解它所需的牛顿步数也会越多，以及其他相关的问题。大家明白这一点吗？所以这就是UMT。","start":2041.41,"end":2067.3},{"id":109,"text":"All right, so if you ask for high accuracy or even modest accuracy on something like an LP, then the problem is it's going to take a couple of hundred Newton steps or thousands or something like that. And not only that, probably with numerical errors, it's probably not even going to converge, right? But if you did it with infinite precision, it would, right? Everybody following this? Okay. Okay, so then...","zh":"好的，如果你对像线性规划这样的问题要求高精度甚至中等精度，那么问题就是它将需要几百次甚至几千次牛顿步数。不仅如此，由于数值误差，它可能甚至无法收敛，对吧？但如果使用无限精度，它就会收敛，对吧？大家跟上这个思路了吗？好的。好的，那么……","start":2069.36,"end":2092.06},{"id":110,"text":"Then I have to tell you about something else, which is the background. There's a whole class of problems in applied math and computation called homotopy methods. I don't know if people heard about this before, somewhere. Okay, this is an awesome thing. Everybody should know about this. It's a very, very cool idea. It's this.","zh":"那么我必须告诉你们另一件事，那就是背景知识。在应用数学和计算中，有一类称为同伦方法的问题。我不确定大家之前有没有听说过这个，可能在某个地方。好的，这是一个了不起的东西。每个人都应该知道这个。这是一个非常、非常酷的想法。这就是它。","start":2092.65,"end":2112.44},{"id":111,"text":"You have a problem you want to solve, which is either like an optimization problem, but typically it's actually just solving a set of nonlinear equations. Here's an example, right? You're doing a spice simulation, and you want to find an equilibrium point of the circuit, which is, you know, got some, the DC, whatever. I'm sorry, I'm speaking dialect now, but that's what you want to do, right? So that's a perfect example, right, of this. But it comes up in tons of other stuff, right? So just, okay. So here's how it works.","zh":"你有一个想要解决的问题，这可能是优化问题，但通常它实际上只是求解一组非线性方程。举个例子，对吧？你在进行SPICE仿真，想要找到电路的平衡点，也就是直流或其他什么情况。抱歉，我现在说的是方言，但这就是你想做的事情，对吧？这就是这个的一个完美例子，对吧？但它还会出现在很多其他事情中，对吧？所以，好吧。那么它是如何工作的呢？","start":2112.9,"end":2140.6},{"id":112,"text":"You have your problem, and you introduce a parameter. They usually call it maybe theta or something, but they have different kappa as another train of... Anyway, but here it's T. You introduce a parameter. In fact, in the classical version, you introduce a parameter with the following thing that perturbs or simplifies or smooths out your original problem. And when you turn that knob, the traditional range is 0 to 1. I'll still use the...","zh":"你有一个问题，然后你引入一个参数。他们通常称之为也许 theta 或者其他什么，但他们会用不同的 kappa 作为另一个思路……总之，这里用的是 T。你引入一个参数。实际上，在经典版本中，你引入一个参数，其作用是扰动、简化或平滑你的原始问题。当你转动这个旋钮时，传统的范围是 0 到 1。我仍然会使用……","start":2141.44,"end":2170.54},{"id":113,"text":"I'll use the parameter t, right? When t equals zero, when t equals one, you get the problem you really want to solve, right? That's the one you really want to solve. When t equals zero, you get a problem that you know the solution to, right? Everybody following this? Now you do the following. Oh, and then...","zh":"我会使用参数 t，对吧？当 t 等于零时，当 t 等于一的时候，你会得到你真正想要解决的问题，对吧？这就是你真正想要解决的问题。当 t 等于零时，你会得到一个你知道解的问题，对吧？大家都能跟上吗？现在你做以下事情。哦，然后……","start":2170.96,"end":2190.92}],"notes":["本段主要讲解了使用对数障碍方法进行凸优化时的特性，包括得到对偶可行点和间隙的计算。讲者指出，虽然这种方法在实际问题中非常有效，但需要谨慎选择参数t，因为t越大，近似效果越好，但计算所需的牛顿迭代次数也会增加。","讲者提到，对于线性规划等需要高精度或中等精度的问题，牛顿法可能需要数百甚至数千次迭代，且在有限精度下可能无法收敛。然而，在无限精度下，牛顿法可以保证收敛。","接下来，讲者引入了同伦方法（homotopy methods）的概念，这是一种在应用数学和计算中广泛应用的求解非线性方程组的方法。这种方法通过引入参数t，从一个已知解的问题逐步过渡到目标问题。","讲者以电路仿真为例，说明同伦方法的应用。当t=0时，问题具有已知解；当t=1时，问题变为需要求解的目标问题。通过调整参数t，可以逐步逼近目标问题的解。","讲者提到，同伦方法中参数t的取值范围通常为0到1，其中t=0对应已知解的问题，t=1对应目标问题。这种方法在许多实际问题中都有广泛应用。","讲者强调，同伦方法是一种非常强大的工具，适用于解决各种非线性方程组的问题，其核心思想是通过参数的连续变化，将已知解的问题逐步转化为目标问题。"],"formulas":[],"uncertainties":["kappa as another train of..."],"diagram":"none","start":2016.22,"end":2190.92,"asr_flags":[],"math_clarifications":["原始文本中未提供具体的数学表达式，仅提到'log barrier function'和't'作为参数，无法核定其数学形式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2016.22,"text":"And all it means is you approximated, I mean, it's basically back to that story originally where we approximated this indicator function here with something smooth, then we applied Newton's method. But the nice part is we got a lot of cool stuff there where we know if you use log barrier and all that kind of stuff, you're actually going to get dual feasible points and you get a gap and you know exactly what the gap is. Everybody see this?"},{"start":2041.41,"text":"Actually, hilariously, that method is perfectly good for tons of practical problems. Just so you know. Of course, it's not generic. You have to choose the t very carefully. And everything you think about it is right, that if you choose t too large, the larger t is, the better approximation you get. But also, the larger the number of Newton steps it's going to take to solve it and all that kind of stuff. Everybody got that? So that's UMT. Okay."},{"start":2069.36,"text":"All right, so if you ask for high accuracy or even modest accuracy on something like an LP, then the problem is it's going to take a couple of hundred Newton steps or thousands or something like that. And not only that, probably with numerical errors, it's probably not even going to converge, right? But if you did it with infinite precision, it would, right? Everybody following this? Okay. Okay, so then..."},{"start":2092.65,"text":"Then I have to tell you about something else, which is the background. There's a whole class of problems in applied math and computation called homotopy methods. I don't know if people heard about this before, somewhere. Okay, this is an awesome thing. Everybody should know about this. It's a very, very cool idea. It's this."},{"start":2112.9,"text":"You have a problem you want to solve, which is either like an optimization problem, but typically it's actually just solving a set of nonlinear equations. Here's an example, right? You're doing a spice simulation, and you want to find an equilibrium point of the circuit, which is, you know, got some, the DC, whatever. I'm sorry, I'm speaking dialect now, but that's what you want to do, right? So that's a perfect example, right, of this. But it comes up in tons of other stuff, right? So just, okay. So here's how it works."},{"start":2141.44,"text":"You have your problem, and you introduce a parameter. They usually call it maybe theta or something, but they have different kappa as another train of... Anyway, but here it's T. You introduce a parameter. In fact, in the classical version, you introduce a parameter with the following thing that perturbs or simplifies or smooths out your original problem. And when you turn that knob, the traditional range is 0 to 1. I'll still use the..."},{"start":2170.96,"text":"I'll use the parameter t, right? When t equals zero, when t equals one, you get the problem you really want to solve, right? That's the one you really want to solve. When t equals zero, you get a problem that you know the solution to, right? Everybody following this? Now you do the following. Oh, and then..."}],"speech_gaps":[],"frame":"../frames/v016/013.webp","frame_time":2028.22},{"title":"同伦方法与电路均衡点求解","segments":[{"id":114,"text":"What you do is you attempt to solve the problem for Ts, and you're going to march along this path. And by the way, the subtitle of a book on this is called, this is a great subtitle, it's called Homotopy Methods, and the subtitle is Pathways to Solutions, right? Which is like, wow, that's like almost poetic. That's what it is, right? So the idea of a homotopy method is you start with T equals zero, you know the solution already, right? Then you crank T up a little bit, and you attempt to solve the problem.","zh":"你所做的就是尝试为Ts求解问题，并沿着这条路径前进。顺便说一句，关于这本书的副标题叫做『同伦方法』，副标题是『通往解的路径』，对吧？这简直就像一首诗。这就是它的意思，对吧？同伦方法的思路是，你从T等于零开始，你已经知道解了，对吧？然后你稍微增加T的值，尝试求解问题。","start":2191.66,"end":2219.78},{"id":115,"text":"And if you solve it, and this isn't a general case, right? If you solve it, good for you, then you crank up t again and you keep going. And when you get to t equals one, you solved your problem. Oh, and what you would typically do is, let's say you're using Newton's method each time, each time you would start Newton's method from where you were before. That's the key. Everybody got this, right? So matter of fact, this is exactly how SPICE, for those of you who, actually how many people,","zh":"如果你成功求解了，这并不是一般情况，对吧？如果你成功了，那很好，然后你再次增加t的值，继续前进。当你到达t等于一的时候，你就解决了你的问题。通常你会怎么做呢？比如说，每次你都会使用牛顿法，每次都会从之前的位置开始牛顿法。这是关键。大家明白了吗？事实上，这就是SPICE的工作方式，对于那些了解电路的人来说，实际上有多少人……","start":2220.59,"end":2249.55},{"id":116,"text":"So some. That's precisely how it computes an equilibrium point. So here. Okay, so if you don't mind, for everyone else, you probably get some of this, but I am going to go into dialect a little bit for a while. If you have a circuit, suppose I have a circuit with a bunch of devices. These are all nonlinear, right? So all you want to do is solve a set of one billion nonlinear...","zh":"有些。这就是它如何计算平衡点的方式。在这里。好吧，如果你不介意，对于其他人来说，你们可能已经理解了其中的一部分，但我要稍微用一些术语来讲解一会儿。如果你有一个电路，假设我有一个包含许多器件的电路。这些器件都是非线性的，对吧？所以你所做的就是求解一组一亿个非线性……","start":2250.36,"end":2273.74},{"id":117,"text":"equations. And those equations are things like KCL, KVL, and the device. And I guess you have to satisfy the device equations. I think this is fine for everybody to understand. So basically, it has to satisfy physics and the devices. Physics is linear, by the way. It's just actually conservation of current and all that kind of stuff. That's fine. It's the device equations that are nonlinear.","zh":"方程。这些方程包括KCL、KVL和器件方程。我想你必须满足器件方程。我认为这对大家来说都很容易理解。基本上，它必须满足物理定律和器件特性。顺便说一句，物理定律是线性的。它实际上只是电流守恒之类的东西。这没问题。真正非线性的就是器件方程。","start":2274.6,"end":2301.28},{"id":118,"text":"Okay. So, I don't know, someone who knows circuits, do you want to guess a homo... So I give you a circuit. It doesn't have to be a billion. It's an op-amp. I got, you know, whatever, 15 device transistors in it or, you know, devices. And I'd say, please find me the equilibrium or bias. That's dialect. Bias for the equilibrium point. Everybody got this? Okay. Somebody want to... Can someone guess a homotopy parameter?","zh":"好吧，我不确定，了解电路的人，你们想猜一个同伦……所以我会给你一个电路。它不一定要是一亿个器件。它是一个运算放大器。我有，你知道的，里面可能有15个晶体管或者其他器件。我会说，请找到我这个电路的平衡点或偏置点。这是术语。偏置点就是平衡点。大家明白了吗？好的。有人想……有人能猜出一个同伦参数吗？","start":2302.83,"end":2328.77},{"id":119,"text":"This is just for people who know about circuits and circuit design. Okay, I'll tell you what it is. It's a supply voltage. If I take a circuit and I set the supply voltage to zero, your specialty could be genetics, and I think you could probably say what the solution is, right? In other words, if I take a circuit and I don't apply power to it, then here's the solution. Ready?","zh":"这仅仅是为了那些了解电路和电路设计的人。好的，我会告诉你这是什么。这是一个供电电压。如果我拿一个电路，并将供电电压设为零，你的专业可能是遗传学，我想你大概可以说出解是什么，对吧？换句话说，如果我拿一个电路，并不给它供电，那么这就是解。准备好了吗？","start":2331.18,"end":2354.86}],"notes":["本段讲解了同伦方法的基本思想，即从已知解出发，逐步调整参数以求解目标问题。通过逐步增加参数T的值，从T=0开始，最终达到T=1，从而得到原问题的解。这种方法的关键在于每次迭代时使用牛顿法，并从上一步的解开始，以提高收敛速度。","课堂中提到同伦方法在电路分析中的应用，特别是用于求解电路的平衡点（bias point）。电路中的非线性元件（如晶体管）导致需要求解大量非线性方程，而同伦方法提供了一种系统化的方法来处理这类问题。","在电路分析中，物理定律（如基尔霍夫电流定律和电压定律）是线性的，而元件的特性方程（如晶体管的电流-电压关系）是非线性的。因此，求解电路的平衡点需要同时满足线性和非线性条件。","课堂中通过一个具体的例子（运算放大器电路）来说明同伦方法的应用。通过将电源电压作为同伦参数，从零电压开始逐步增加，从而找到电路的平衡点。这种方法在电路设计中非常常见。","课堂中还提到，同伦方法的名称来源于“路径”（path），即通过参数变化的路径逐步逼近解。这种方法在优化和工程问题中都有广泛应用。","最后，课堂通过一个假设性问题引导学生思考同伦参数的选择，强调了同伦方法在实际问题中的灵活性和实用性。"],"formulas":[],"uncertainties":["homotopy parameter"],"diagram":"none","start":2191.66,"end":2354.86,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2191.66,"text":"What you do is you attempt to solve the problem for Ts, and you're going to march along this path. And by the way, the subtitle of a book on this is called, this is a great subtitle, it's called Homotopy Methods, and the subtitle is Pathways to Solutions, right? Which is like, wow, that's like almost poetic. That's what it is, right? So the idea of a homotopy method is you start with T equals zero, you know the solution already, right? Then you crank T up a little bit, and you attempt to solve the problem."},{"start":2220.59,"text":"And if you solve it, and this isn't a general case, right? If you solve it, good for you, then you crank up t again and you keep going. And when you get to t equals one, you solved your problem. Oh, and what you would typically do is, let's say you're using Newton's method each time, each time you would start Newton's method from where you were before. That's the key. Everybody got this, right? So matter of fact, this is exactly how SPICE, for those of you who, actually how many people,"},{"start":2250.36,"text":"No, but Spicer have used it or so. Okay, so fine. So some. That's precisely how it computes an equilibrium point. So here. Okay, so if you don't mind, for everyone else, you probably get some of this, but I am going to go into dialect a little bit for a while. If you have a circuit, suppose I have a circuit with a bunch of devices. These are all nonlinear, right? So all you want to do is solve a set of one billion nonlinear..."},{"start":2274.6,"text":"equations. And those equations are things like KCL, KVL, and the device. And I guess you have to satisfy the device equations. I think this is fine for everybody to understand. So basically, it has to satisfy physics and the devices. Physics is linear, by the way. It's just actually conservation of current and all that kind of stuff. That's fine. It's the device equations that are nonlinear."},{"start":2302.83,"text":"Okay. So, I don't know, someone who knows circuits, do you want to guess a homo... So I give you a circuit. It doesn't have to be a billion. It's an op-amp. I got, you know, whatever, 15 device transistors in it or, you know, devices. And I'd say, please find me the equilibrium or bias. That's dialect. Bias for the equilibrium point. Everybody got this? Okay. Somebody want to... Can someone guess a homotopy parameter?"},{"start":2331.18,"text":"This is just for people who know about circuits and circuit design. Okay, I'll tell you what it is. It's a supply voltage. If I take a circuit and I set the supply voltage to zero, your specialty could be genetics, and I think you could probably say what the solution is, right? In other words, if I take a circuit and I don't apply power to it, then here's the solution. Ready?"}],"speech_gaps":[],"frame":"../frames/v016/014.webp","frame_time":2203.66},{"title":"同伦方法与路径跟踪","segments":[{"id":120,"text":"All voltages are zero. All potentials are zero. All currents are zero. And that will actually satisfy the equations. Everybody following this? So now I crank up the supply voltage. And again, sorry, this is going to be only for people who know about circuits. Yeah, the supply voltage is like two volts. I set it up to 50 millivolts, and I attempt to solve again for an equilibrium point, right? So, I mean...","zh":"所有电压都是零。所有电势都是零。所有电流都是零。而这实际上会满足方程。大家都能跟上吗？现在我将电源电压调高。再次抱歉，这只会对了解电路的人有意义。是的，电源电压就像两伏特。我把它设置为50毫伏，然后再次尝试求解一个平衡点，对吧？所以，我的意思是……","start":2355.56,"end":2378.76},{"id":121,"text":"What does any chip look like when I put VDD, when I put the supply voltage to 50 millivolts? It looks like it's a resistor, right? Because you don't have enough voltage to actually turn any transistors on. Everybody, I mean, okay, if you know devices, you know what I'm talking about, right? Okay, it's linear, but that means we can probably, we can solve it in like one or two Newton steps. In fact, the tradition is one, okay? Then you set it to, you know,","zh":"当我把VDD（电源电压）设置为50毫伏时，芯片看起来像什么？它看起来像一个电阻，对吧？因为你没有足够的电压来实际开启任何晶体管。大家，我的意思是，如果你了解器件，你就会明白我在说什么，对吧？好的，它是线性的，这意味着我们可能只需要一到两次牛顿迭代就能求解。事实上，传统上是一次，对吧？然后你把它设置为，你知道的，","start":2379.04,"end":2404.81},{"id":122,"text":"These are homotopy methods. This is super cool to know about. It okay, this is a homotopy method, but there's a big difference. Um, here I can get to any point on that path from anywhere, which is false, and in a general homotopy method, you have all this logic about what happens if you fail. Right, let's talk about that.","zh":"这些都是同伦方法。了解这一点非常酷。嗯，这是一个同伦方法，但有一个很大的区别。在这里，我可以从任何地方到达该路径上的任何一点，这是错误的，在一般的同伦方法中，如果你失败了，会有所有关于会发生什么的逻辑。对，我们来谈谈这个。","start":2405.23,"end":2431.99},{"id":123,"text":"Suppose T was 0.05, and now I set it to 0.1, and I tried Newton's method, and it just completely failed. What would you suggest? 0.075. Perfect. 0.075. I totally agree. That's exactly what you do. It means you were too aggressive.","zh":"假设T是0.05，现在我把T设置为0.1，并尝试使用牛顿法，结果完全失败了。你会建议什么？0.075。完美。0.075。我完全同意。这就是你所做的。这意味着你过于激进了。","start":2432.74,"end":2451.52},{"id":124,"text":"Right. And you move too far. And the problem got so different that from where you are, you couldn't get to this to this thing. Right. OK. So that's exactly how those were. Also, in the general case, all sorts of sick things can happen. Like they're called bifurcate. So two very bad things can happen, which is if you're following a path. This is in the general case, which is not ours. So here's a path. And one bad thing that can happen is it can so-called bifurcate and go like this. Right. So.","zh":"对。你走得太远了。问题变得如此不同，以至于从你所在的位置，你无法到达这个目标。对。好的，这正是那些情况的原理。此外，在一般情况下，各种糟糕的事情可能发生。它们被称为分岔。所以，如果沿着路径进行，会发生两件非常糟糕的事情，这在一般情况下发生，而我们的案例不是这种情况。这里有一条路径。可能发生的一件坏事情是它会所谓的分岔并像这样发展。对。所以。","start":2452.45,"end":2481.25},{"id":125,"text":"That's one. Another one is a path can just look like this and just stop. And that's it, right? You know, there may be another one that goes all the way to the solution here, right? So these issues you don't have here because we have a single path. We can get back to it from anywhere we like. The only question is how much effort, how many Newton steps it's going to take. So I don't know if that made sense, but that is the idea. Okay, so now...","zh":"这是其中一个。另一个情况是路径可能看起来像这样，然后就停止了。就是这样，对吧？你知道，这里可能还有另一条路径会一直追踪到解，对吧？所以在这种情况下，你不会遇到这些问题，因为我们只有一条路径。我们可以从任何地方回到这条路径。唯一的问题是需要多少努力，需要多少次牛顿迭代步骤。我不确定这是否讲清楚了，但这就是这个想法。好的，那么现在...","start":2482.81,"end":2510.1}],"notes":["本段讲解了同伦方法的基本概念，强调了其在路径跟踪中的应用。同伦方法通过逐步调整参数，从一个已知的简单问题出发，逐步逼近目标问题的解。这种方法在电路分析中特别有用，因为可以逐步增加电源电压，从零开始，逐步达到目标电压，从而避免直接求解复杂非线性方程组的困难。","在同伦方法中，路径的连续性是一个关键点。如果路径在某个点发生分叉（bifurcate），则可能导致求解失败。这种分叉现象在一般情况下可能发生，但在本课程讨论的特定问题中，由于路径是单一且连续的，因此不会出现这种问题。","当使用牛顿法进行求解时，如果步长过大，可能会导致求解失败。因此，需要选择适当的步长，以确保每一步的更新都能保持在路径上。这通常通过逐步增加步长或使用更保守的步长策略来实现。","在一般情况下，同伦方法可能会遇到各种问题，如路径的分叉或路径的突然终止。这些情况需要额外的逻辑和处理方法，但在本课程讨论的特定问题中，由于路径是单一且连续的，因此不需要处理这些问题。","同伦方法的一个重要优势是，即使从任意点开始，也可以沿着路径回到目标点。然而，这需要付出一定的计算代价，即需要进行多次牛顿迭代。因此，选择合适的步长和迭代策略对于提高求解效率至关重要。","本段还提到，当路径发生分叉或终止时，可能存在其他路径可以到达目标解。因此，在实际应用中，需要仔细分析路径的行为，以确保能够找到正确的解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2355.56,"end":2510.1,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2355.56,"text":"All voltages are zero. All potentials are zero. All currents are zero. And that will actually satisfy the equations. Everybody following this? So now I crank up the supply voltage. And again, sorry, this is going to be only for people who know about circuits. Yeah, the supply voltage is like two volts. I set it up to 50 millivolts, and I attempt to solve again for an equilibrium point, right? So, I mean..."},{"start":2379.04,"text":"What does any chip look like when I put VDD, when I put the supply voltage to 50 millivolts? It looks like it's a resistor, right? Because you don't have enough voltage to actually turn any transistors on. Everybody, I mean, okay, if you know devices, you know what I'm talking about, right? Okay, it's linear, but that means we can probably, we can solve it in like one or two Newton steps. In fact, the tradition is one, okay? Then you set it to, you know,"},{"start":2405.23,"text":"100 millivolts right and you keep going until you get to whatever two volts and then you say that's that's that's where i have it everybody got this so okay so these are homotopy methods this is super cool to know about it okay this is a homotopy method but there's a big difference um here i can get to any point on that path from anywhere which is false and in a general homotopy method you have all this logic about what happens if you fail right oh let's talk about that"},{"start":2432.74,"text":"Suppose T was 0.05, and now I set it to 0.1, and I tried Newton's method, and it just completely failed. What would you suggest? 0.075. Perfect. 0.075. I totally agree. That's exactly what you do. It means you were too aggressive."},{"start":2452.45,"text":"Right. And you move too far. And the problem got so different that from where you are, you couldn't get to this to this thing. Right. OK. So that's exactly how those were. Also, in the general case, all sorts of sick things can happen. Like they're called bifurcate. So two very bad things can happen, which is if you're following a path. This is in the general case, which is not ours. So here's a path. And one bad thing that can happen is it can so-called bifurcate and go like this. Right. So."},{"start":2482.81,"text":"That's one. Another one is a path can just look like this and just stop. And that's it, right? You know, there may be another one that goes all the way to the solution here, right? So these issues you don't have here because we have a single path. We can get back to it from anywhere we like. The only question is how much effort, how many Newton steps it's going to take. So I don't know if that made sense, but that is the idea. Okay, so now..."}],"speech_gaps":[],"frame":"../frames/v016/015.webp","frame_time":2367.56},{"title":"同伦方法与参数调整","segments":[{"id":126,"text":"you will recognize this as a homotopy method. So here it is. It says you pick some t and you compute x to r of t. That's Newton's method. Then what you do, you quit if m over t is less than epsilon. That's fine. Otherwise, you increase t. This is a very simple method. There's much more sophisticated methods, but this is the way you do it. You just increase t by mu, right? And so mu is this number that tells you","zh":"你会认出这是同伦方法。所以这里它就是。它说你选择某个 t 并计算 x 到 r 的 t。这是牛顿法。然后你做的事情是，如果 m 除以 t 小于 epsilon，就停止。这没问题。否则，你增加 t。这是一个非常简单的方法。有很多更复杂的办法，但这就是你这么做。你只是将 t 增加 mu，对吧？而 mu 是这个告诉你","start":2510.57,"end":2541.2},{"id":127,"text":"how much you, actually since the gap is m over t, mu actually is telling you how much are you going to tighten the gap requirement in the next step. That's what it tells. So if mu is like 1.05, I mean, basically the argument would be you just calculated the analytic center at this point. When you increase t by 5%,","zh":"你实际要收紧的差距要求的量。这就是它告诉你的。所以如果 mu 是 1.05，我的意思是，基本的论点是你刚刚在这个点计算了解析中心。当你将 t 增加 5% 时，","start":2541.82,"end":2565.95},{"id":128,"text":"It hasn't moved very far. Another way to say it is you're just about to solve a problem that's very similar to the one you just solved. And in fact, it's going to take one or two Newton steps. And in fact, I think there are some methods that increment t in such a way that it's so small, the increment, that one Newton step is all you need. So you do...","zh":"它并没有移动很远。另一种说法是，你即将解决的问题与你刚刚解决的问题非常相似。事实上，它将需要一到两个牛顿步骤。事实上，我认为有一些方法会以如此小的增量来增加 t，以至于只需要一个牛顿步骤。所以你做……","start":2566.92,"end":2590.68},{"id":129,"text":"You do one Newton step and increase t, then one Newton step and so on. So that's one way. Those are called short step methods, I think. Okay, everybody got this? Okay. The luxury we have is the following. This algorithm cannot fail for us. I mean, it might fail for numerical reasons, but in theory, it cannot fail. It always works. So it just does.","zh":"你做一次牛顿步骤并增加 t，然后一次牛顿步骤并如此继续。这就是一种方法。这些方法被称为短步方法，我想。好的，大家明白了吗？好的。我们拥有的奢侈是以下这个。这个算法对我们来说不会失败。我的意思是，它可能因为数值原因而失败，但在理论上，它不会失败。它总是有效。所以它就这样工作。","start":2591.02,"end":2614.17},{"id":130,"text":"Because no matter how aggressively you update it, Newton's method is going to solve this smooth problem. It may take a lot of iterations, but it's going to do it. Okay, so this is the idea. Okay, so it turns out, you know, actually it depends.","zh":"无论你多么激进地更新它，牛顿法都将解决这个光滑的问题。它可能需要很多次迭代，但它会完成。好的，所以这就是这个想法。好的，所以实际上，你会发现，这取决于。","start":2614.76,"end":2635.4},{"id":131,"text":"If you talk to the theorists, mu is going to be really small. Like it's going to literally be like 1 plus 1 over m or something like that. And I have no problem with that. Turns out in practice, people will choose things like 10, 20, 50, or 100. Something like that. Really quite large values, right? Okay. And there's plenty of heuristics for choosing t0 and stuff like that. Okay.","zh":"如果你和理论家交谈，mu 将会非常小。比如，它会像 1 加上 1 除以 m 或者类似的东西。我对这一点没有问题。实际上，在实践中，人们会选择像 10、20、50 或 100 这样的数值。像这样的相当大的值，对吧？好的。而且有很多启发式方法来选择 t0 这样的东西。好的。","start":2635.95,"end":2663.43}],"notes":["本段讲解了同伦方法中参数t的调整策略，其中mu用于控制每次迭代中对间隙（gap）要求的收紧程度。当mu为1.05时，意味着每次迭代中t的增加幅度为5%，从而使得问题在每次迭代中保持高度相似，仅需少量牛顿步即可求解。","讲者提到，理论上该算法不会失败，因为牛顿法能够解决光滑问题，尽管可能需要大量迭代。然而，在实际应用中，mu的取值会根据问题的规模和需求进行调整，理论上的mu可能非常小（如1 + 1/m），而实际应用中人们倾向于选择较大的mu值（如10、20等）。","讲者还提到，存在一些方法可以以极小的增量调整t，使得每次迭代只需一次牛顿步，这些方法被称为短步方法（short step methods）。这表明在实际应用中，可以通过调整mu的大小来优化计算效率。","讲者强调，该算法在理论上是可靠的，不会失败，但可能因数值计算问题而失败。这表明算法的鲁棒性在理论上有保障，但在实际实现中仍需注意数值稳定性。","讲者提到，对于理论研究者来说，mu的取值通常非常小，而实际应用中人们倾向于选择较大的mu值，这表明在实际应用中，mu的选择需要在计算效率和精度之间进行权衡。","最后，讲者提到存在许多启发式方法用于选择初始参数t0，这表明在实际应用中，参数的选择是一个重要的优化问题，需要结合具体问题进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2510.57,"end":2663.43,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏明确的数学定义和上下文，无法进行有效的数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2510.57,"text":"you will recognize this as a homotopy method. So here it is. It says you pick some t and you compute x to r of t. That's Newton's method. Then what you do, you quit if m over t is less than epsilon. That's fine. Otherwise, you increase t. This is a very simple method. There's much more sophisticated methods, but this is the way you do it. You just increase t by mu, right? And so mu is this number that tells you"},{"start":2541.82,"text":"how much you, actually since the gap is m over t, mu actually is telling you how much are you going to tighten the gap requirement in the next step. That's what it tells. So if mu is like 1.05, I mean, basically the argument would be you just calculated the analytic center at this point. When you increase t by 5%,"},{"start":2566.92,"text":"It hasn't moved very far. Another way to say it is you're just about to solve a problem that's very similar to the one you just solved. And in fact, it's going to take one or two Newton steps. And in fact, I think there are some methods that increment t in such a way that it's so small, the increment, that one Newton step is all you need. So you do..."},{"start":2591.02,"text":"You do one Newton step and increase t, then one Newton step and so on. So that's one way. Those are called short step methods, I think. Okay, everybody got this? Okay. The luxury we have is the following. This algorithm cannot fail for us. I mean, it might fail for numerical reasons, but in theory, it cannot fail. It always works. So it just does."},{"start":2614.76,"text":"Because no matter how aggressively you update it, Newton's method is going to solve this smooth problem. It may take a lot of iterations, but it's going to do it. Okay, so this is the idea. Okay, so it turns out, you know, actually it depends."},{"start":2635.95,"text":"If you talk to the theorists, mu is going to be really small. Like it's going to literally be like 1 plus 1 over m or something like that. And I have no problem with that. Turns out in practice, people will choose things like 10, 20, 50, or 100. Something like that. Really quite large values, right? Okay. And there's plenty of heuristics for choosing t0 and stuff like that. Okay."}],"speech_gaps":[],"frame":"../frames/v016/016.webp","frame_time":2522.57},{"title":"障碍方法与收敛分析","segments":[{"id":132,"text":"So that's it. This is the barrier method. Okay. The convergence analysis is actually kind of interesting. So it works like this, right? Every time you recompute a new point on the central path, the new gap went down by a factor of mu. Because actually, mu is just controlling how much you tighten your gap each time.","zh":"所以这就是全部。这就是障碍方法。好的。收敛分析其实相当有趣。它是这样运作的，对吧？每次你重新计算中央路径上的一个新点时，新的间隙会减少一个mu因子。实际上，mu只是控制每次你收紧间隙的程度。","start":2664.11,"end":2691.51},{"id":133,"text":"So what's interesting about this is there's no surprise after the end of an iteration what your gap is, right? Your gap is this provable distance between how far you are and the optimal value is. And a lot of algorithms go like this. You finish all your calculation, then there's a drum roll, and someone, you evaluate the...","zh":"这有趣的地方在于，在一次迭代结束之后，你不会对间隙感到意外，对吧？你的间隙是你与最优值之间的可证明距离。很多算法都是这样运作的。你完成所有计算后，就会有一个鼓点，然后有人，你会评估……","start":2691.88,"end":2708.46},{"id":134,"text":"So that says that the number of iterations it's going to take is like an original gap divided by log mu, right? And so that's going to be the, that's the number of iterations you take, right? Now the centering, but then remember, you have to do the centering, right? And the real measure is like, let's say we could use how many Newton steps do you actually end up performing, right? That would be one way to do this. And if you do the classical analysis,","zh":"这说明所需的迭代次数大致等于原始间隙除以log mu，对吧？因此，这就是你所进行的迭代次数，对吧？现在是中心化，但请记住，你必须进行中心化，对吧？而真正的衡量标准是，比如说，你实际上执行了多少次牛顿步，对吧？这就是一种方法。如果你进行经典分析，","start":2708.75,"end":2737.05},{"id":135,"text":"So that says that the number of iterations it's going to take is like an original gap divided by log mu, right? And so that's going to be the, that's the number of iterations you take, right? Now the centering, but then remember, you have to do the centering, right? And the real measure is like, let's say we could use how many Newton steps do you actually end up performing, right? That would be one way to do this. And if you do the classical analysis,","zh":"这说明所需的迭代次数大致等于原始间隙除以log mu，对吧？因此，这就是你所进行的迭代次数，对吧？现在是中心化，但请记住，你必须进行中心化，对吧？而真正的衡量标准是，比如说，你实际上执行了多少次牛顿步，对吧？这就是一种方法。如果你进行经典分析，","start":2737.56,"end":2767.11},{"id":136,"text":"What you get is something very weird. It goes like this. The classical analysis says, oh yeah, yeah, I can minimize this for you. No problem. I can minimize that. And you get a Lipschitz constant and a strong convexity and blah, blah, blah, and you do this. But what the classical analysis will predict is that as t gets bigger and bigger, the classical analysis will tell you that the number of Newton steps will grow. And in fact, it'll grow like alarmingly fast. Okay?","zh":"你得到的是非常奇怪的结果。它是这样运作的。经典分析会说，哦，是的，是的，我可以为你最小化这个。没问题。我可以最小化那个。你会得到一个Lipschitz常数和强凸性，等等，等等，然后你这样做。但经典分析预测的是，当t变得越来越大时，经典分析会告诉你牛顿步数会增加。事实上，它会以令人震惊的速度增加。好的？","start":2768.07,"end":2797.56},{"id":137,"text":"And then when you work this out, you realize it just doesn't... I mean, if you're a theorist and you assemble all these things together, you'll find out it's going to grow really fast, right? And it won't get you what you want, which is like a polynomial time method. Yes? What happens if you don't always solve the minimization problem fully? Because it does need a better point, right? Yeah, so that's exactly right. So when you're centering, for sure the last two Newton steps were completely a waste of time.","zh":"然后当你计算出来后，你会发现它根本就……我的意思是，如果你是一个理论家，把所有这些内容组合在一起，你会发现它会增长得非常快，对吧？而这不会给你想要的东西，也就是一个多项式时间的方法。对吧？如果你不总是完全解决最小化问题，会发生什么？因为确实需要一个更好的点，对吧？是的，这完全正确。所以在进行中心化时，肯定最后两次牛顿迭代完全是浪费时间。","start":2798.24,"end":2826.95}],"notes":["本段主要讲解障碍方法的收敛分析，强调每次迭代中间隙（gap）的减少与参数mu的关系。障碍方法通过每次重新计算中心路径上的新点，使间隙按mu的比例减少，从而逐步逼近最优解。","在迭代过程中，间隙的大小是可证明的，即当前解与最优解之间的距离。许多优化算法都采用类似策略，即在完成所有计算后，通过评估对偶函数（dual function）来确定当前解的下界，从而判断解的质量。","障碍方法的一个关键特性是，每次中心化操作都会减少间隙，因此迭代次数与初始间隙和log(mu)有关。然而，经典分析表明，随着参数t的增大，所需的牛顿步数会指数级增长，这与实际应用中的多项式时间方法目标相悖。","当不完全解决最小化问题时，最后几步牛顿迭代可能变得冗余，这表明在实际应用中需要权衡计算精度与迭代次数。","本段还提到，经典分析预测的牛顿步数增长速度令人担忧，这表明需要更高效的算法设计，以避免计算资源的浪费。","障碍方法通过调整mu来控制间隙的减少速度，从而在保证收敛性的同时，尽可能减少迭代次数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2664.11,"end":2826.95,"asr_flags":[],"math_clarifications":["公式中的'original gap'和'mu'没有明确的数学定义，且'log(mu)'的使用缺乏上下文支持。此外，'iterations'的表达方式不符合数学公式规范，应使用更精确的数学符号表示。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2664.11,"text":"So that's it. This is the barrier method. Okay. The convergence analysis is actually kind of interesting. So it works like this, right? Every time you recompute a new point on the central path, the new gap went down by a factor of mu. Because actually, mu is just controlling how much you tighten your gap each time."},{"start":2691.88,"text":"So what's interesting about this is there's no surprise after the end of an iteration what your gap is, right? Your gap is this provable distance between how far you are and the optimal value is. And a lot of algorithms go like this. You finish all your calculation, then there's a drum roll, and someone, you evaluate the..."},{"start":2708.75,"text":"the dual function, which is a lower bound. And then you look up and go like, oh my God, that's awesome. I'm already 1%. I'm provably 1% suboptimal. And I've only done, you know, blah, blah, blah, 22 iterations. So that's how usually. Here, there's no surprise. The gap will be period, M over T. So you basically dial in the gap. That's how that works. Okay. So what that says is that every time you do a centering, you reduce the gap by a factor mu."},{"start":2737.56,"text":"So that says that the number of iterations it's going to take is like an original gap divided by log mu, right? And so that's going to be the, that's the number of iterations you take, right? Now the centering, but then remember, you have to do the centering, right? And the real measure is like, let's say we could use how many Newton steps do you actually end up performing, right? That would be one way to do this. And if you do the classical analysis,"},{"start":2768.07,"text":"What you get is something very weird. It goes like this. The classical analysis says, oh yeah, yeah, I can minimize this for you. No problem. I can minimize that. And you get a Lipschitz constant and a strong convexity and blah, blah, blah, and you do this. But what the classical analysis will predict is that as t gets bigger and bigger, the classical analysis will tell you that the number of Newton steps will grow. And in fact, it'll grow like alarmingly fast. Okay?"},{"start":2798.24,"text":"And then when you work this out, you realize it just doesn't... I mean, if you're a theorist and you assemble all these things together, you'll find out it's going to grow really fast, right? And it won't get you what you want, which is like a polynomial time method. Yes? What happens if you don't always solve the minimization problem fully? Because it does need a better point, right? Yeah, so that's exactly right. So when you're centering, for sure the last two Newton steps were completely a waste of time."}],"speech_gaps":[],"frame":"../frames/v016/017.webp","frame_time":2676.11},{"title":"中心路径与牛顿法的收敛性","segments":[{"id":138,"text":"Right? So, and in fact, real methods don't do that. You never solve it directly. By the time, as a matter of fact, what they do is by the time you're in the region of quadratic convergence, t gets updated then. Right? Well, it's silly because let's draw that picture, right? So that picture looks like this, right? You know, here's the central path, right? You're here. You're going here. Here's your Newton steps, right? First you go like here.","zh":"对吧？实际上，实际的方法不会这样做。你从不直接求解它。事实上，当你处于二次收敛区域时，t 会被更新。对吧？这很傻，因为让我们画个图，对吧？所以这个图看起来像这样，对吧？你知道，这里是中心路径，对吧？你在这里。你走向这里。这里是你的牛顿步，对吧？首先你走到这里。","start":2827.48,"end":2856.71},{"id":139,"text":"you know, here, I'll make it take a couple more steps. Here's what, you know, it goes like that. But then you get close, right? And now you do two more steps that we can't see here on the board, right? And so, you know, these are a complete waste of time if you think about it. Because someone says, what are you doing? You go, well, I'm going back to the path because I want to be on the path with double precision accuracy. And someone's like, dude, what is the path?","zh":"你知道，我在这里让它再走几步。这就是，你知道的，它会像这样走。但当你接近时，对吧？然后你再走两步，这些步骤在黑板上是看不到的，对吧？所以，你知道的，如果仔细想想，这些步骤完全是浪费时间。因为有人会问，你在做什么？你会回答，我正在回到路径上，因为我希望以双精度精度位于路径上。而另一个人会说，哥们，什么是路径？","start":2857.29,"end":2880.83},{"id":140,"text":"I asked you to solve like, you know, an SOCP or a quadratic program. So what is this path thing? And why should I care? And the answer is you shouldn't care because the path is just a construct for us to figure out a way to get to the solution, which is over here, right? So in fact, all the analyses work. And in fact, if you have fancy methods, they will not do this, right? But in this method, you do that and you're completely right. The last step or two or three are just completely wasted.","zh":"我让你解像，你知道的，一个SOCP或二次规划问题。那么，什么是这个路径？为什么我应该关心？答案是你不应该关心，因为路径只是我们用来找到解的一种构造，这个解在这里，对吧？事实上，所有的分析都是有效的。事实上，如果你有高级方法，它们不会这样做，对吧？但在这种方法中，你会这样做，而且你是完全正确的。最后一步或两步或三步完全是浪费的。","start":2881.32,"end":2910.48},{"id":141,"text":"So, okay. There was a question. In practice, how much of a game does this centering give you rather than just starting with a very large team and solving it with that? It's usually infinity in practice.","zh":"所以，好的。有一个问题。在实践中，这种中心化能给你多少优势，而不是直接从一个非常大的团队开始并用它来求解？在实践中，通常是无穷大。","start":2911.16,"end":2924.88},{"id":142,"text":"In theory, it's not infinity. It's just unbelievably large. And the reason is, in practice, what happens is, if I say solve by LP to six significant digits or something, then you go, no problem, t equals 1e plus 7 or something like that.","zh":"在理论上，它不是无穷大。它只是极其巨大。原因在于，实际上，如果你说用线性规划求解到六位有效数字，那么你会说，没问题，t 等于 1e7 或类似这样的数值。","start":2925.46,"end":2941.18},{"id":143,"text":"Now, in theory, Newton, you could just do it in one step, right? You just solve that one, just run Newton's method now. What's going to happen then is you're going to get into numerical issues, and it's just not going to work, right? And even if it did work, it would take a gazillion iterations. Yeah, so in practice, it's very considerable. Yeah, so, yeah.","zh":"现在，从理论上讲，牛顿法，你只需要一步就能完成，对吧？你只需要解这个问题，现在就运行牛顿法。那么接下来会发生的是，你会遇到数值问题，这种方法根本行不通，对吧？即使它真的能起作用，也需要大量的迭代次数。是的，所以在实践中，这非常不可行。是的，是的。","start":2941.92,"end":2963.17},{"id":144,"text":"I'm understanding this offset of m over t correctly. So does that mean that if you only cared about what p star is, you could just solve the problem for 1t and just add the constant? That's correct. Right. That's what I call the UMT method, unconstrained minimization technique. That's completely correct. Yeah, that's right. What this says, I guess that question was what happens if you do that, but then someone says, I want 1e minus 7 accuracy.","zh":"我正确地理解了这个偏移量m/t。所以这意味着，如果你只关心p星是什么，你只需要为1/t求解这个问题，然后加上一个常数，对吗？这是正确的。对的。我称之为UMT方法，即无约束最小化技术。这完全正确。是的，没错。这个问题大概是问如果你这样做会发生什么，但接着有人会说，我想要1e-7的精度。","start":2964.57,"end":2991.9}],"notes":["本段讨论了中心路径在优化算法中的作用，特别是牛顿法在接近解时的收敛行为。讲者指出，中心路径是一种用于逐步逼近解的构造性方法，而不是直接求解。在实际应用中，中心路径的参数t通常非常大，但随着迭代的进行，t会逐渐减小，从而使得算法在接近解时的收敛速度加快。","讲者提到，虽然理论上可以通过一次牛顿迭代直接求解，但在实际中由于数值稳定性问题，这种方法不可行。因此，实际应用中通常采用逐步减小t的策略，以确保数值计算的稳定性。","讲者还提到，如果只关心最终的最优解p*，可以通过忽略中心路径的偏移项，直接求解问题并加上一个常数项。这种方法被称为UMT方法（无约束最小化技术），在理论上是正确的。","讲者进一步指出，如果需要更高的精度（如1e-7），则需要更精细的调整，这涉及到对中心路径的进一步优化和迭代。","讲者强调，中心路径的构造是为了帮助算法逐步逼近最优解，而不是直接求解。因此，虽然中心路径在理论上是重要的，但在实际应用中，它更多地作为一种辅助工具。","讲者还提到，实际应用中，中心路径的参数t通常非常大，但随着迭代的进行，t会逐渐减小，从而使得算法在接近解时的收敛速度加快。"],"formulas":[],"uncertainties":["1e plus 7","1e minus 7"],"diagram":"none","start":2827.48,"end":2991.9,"asr_flags":[],"math_clarifications":["原文中未出现任何数学公式，仅包含对优化方法和数值计算过程的描述，因此无法进行数学公式核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2827.48,"text":"Right? So, and in fact, real methods don't do that. You never solve it directly. By the time, as a matter of fact, what they do is by the time you're in the region of quadratic convergence, t gets updated then. Right? Well, it's silly because let's draw that picture, right? So that picture looks like this, right? You know, here's the central path, right? You're here. You're going here. Here's your Newton steps, right? First you go like here."},{"start":2857.29,"text":"you know, here, I'll make it take a couple more steps. Here's what, you know, it goes like that. But then you get close, right? And now you do two more steps that we can't see here on the board, right? And so, you know, these are a complete waste of time if you think about it. Because someone says, what are you doing? You go, well, I'm going back to the path because I want to be on the path with double precision accuracy. And someone's like, dude, what is the path?"},{"start":2881.32,"text":"I asked you to solve like, you know, an SOCP or a quadratic program. So what is this path thing? And why should I care? And the answer is you shouldn't care because the path is just a construct for us to figure out a way to get to the solution, which is over here, right? So in fact, all the analyses work. And in fact, if you have fancy methods, they will not do this, right? But in this method, you do that and you're completely right. The last step or two or three are just completely wasted."},{"start":2911.16,"text":"So, okay. There was a question. In practice, how much of a game does this centering give you rather than just starting with a very large team and solving it with that? It's usually infinity in practice."},{"start":2925.46,"text":"In theory, it's not infinity. It's just unbelievably large. And the reason is, in practice, what happens is, if I say solve by LP to six significant digits or something, then you go, no problem, t equals 1e plus 7 or something like that."},{"start":2941.92,"text":"Now, in theory, Newton, you could just do it in one step, right? You just solve that one, just run Newton's method now. What's going to happen then is you're going to get into numerical issues, and it's just not going to work, right? And even if it did work, it would take a gazillion iterations. Yeah, so in practice, it's very considerable. Yeah, so, yeah."},{"start":2964.57,"text":"I'm understanding this offset of m over t correctly. So does that mean that if you only cared about what p star is, you could just solve the problem for 1t and just add the constant? That's correct. Right. That's what I call the UMT method, unconstrained minimization technique. That's completely correct. Yeah, that's right. What this says, I guess that question was what happens if you do that, but then someone says, I want 1e minus 7 accuracy."}],"speech_gaps":[],"frame":"../frames/v016/018.webp","frame_time":2839.48},{"title":"凸优化中的自洽性与数值稳定性","segments":[{"id":145,"text":"And so they go, no problem, t equals 1e plus 9. It will work in theory, but numerically at that point it's not going to. I mean, that corresponds to the person who comes over here, takes this thing, right? I mean, t equals 1e plus 9 corresponds to basically someone who just says, give me some sandpaper, sands off this rough corner and says, done. It's smooth. Go ahead. Use your Newton method. Everybody following this?","zh":"他们就这样继续下去，没有问题，t等于1e9。从理论上讲，这会起作用，但在数值上却不会。我的意思是，这对应于一个人来到这里，拿起这个东西，对吧？我的意思是，t等于1e9对应于基本上某人说，给我一些砂纸，把那个粗糙的角落磨掉，然后说，完成了。它变得光滑了。继续吧，使用你的牛顿方法。大家跟上了吗？","start":2992.6,"end":3018.22},{"id":146,"text":"We know now the theory is that that will work, but it will take a lot of iterations. And the practice is that it will take, number one, it will take a gazillion iterations or most likely just fail. Right, so, okay. Okay, everybody got this? So the classical analysis actually tells you that as t gets bigger and bigger, it's going to take you more and more Newton steps to get...","zh":"我们现在知道理论是这会起作用，但需要很多次迭代。而实践是，它需要，第一，需要大量的迭代次数，或者更可能直接失败。对吧，所以，好的。大家明白了吗？所以经典的分析实际上告诉你，当t变得越来越大时，你需要越来越多的牛顿步骤来重新中心化，对吧？","start":3020.01,"end":3044.2},{"id":147,"text":"to recenter, right? And the reason is pretty clear because what's going to happen is t gets bigger and bigger, both that Lipschitz constant and, you know, that strong convexity constant are going to scale up. And so, but I mean, that's silly because that's someone saying your algorithm doesn't, if someone said your algorithm doesn't work, you'd say, why? And you'd go, well, because my analysis predicts an upper bound on the number of steps that's growing, right? And the point is the analysis turns out to be just wrong.","zh":"原因很明显，因为会发生的是，t变得越来越大，同时Lipschitz常数和强凸性常数都会随之增大。我的意思是，这很荒谬，因为如果有人说你的算法不起作用，你会问为什么？你会说，因为我的分析预测了步骤数的上界在增长，对吧？而重点是，分析结果实际上是错误的。","start":3044.57,"end":3071.59},{"id":148,"text":"So empirically, it's found that the number steps don't grow as t gets bigger and bigger. Again, it's critical you start from the previous value. So that's the critical part. And we'll see that self-concordance actually verifies that completely. So we'll see that in a minute. Okay. So let's look at some examples. So this is just an LP. As a matter of fact, you are going to implement exactly this.","zh":"从经验上发现，随着t变得越来越大，所需的步骤数并不会增长。再次强调，关键是你必须从之前的值开始。这就是关键部分。我们将看到自洽性实际上完全验证了这一点。我们稍后会看到这一点。好的，那么让我们来看一些例子。这只是一个线性规划问题。事实上，你们将在一周后实现这个。","start":3071.99,"end":3099.89},{"id":149,"text":"by a week from tomorrow, right? So, okay, so let's take, this is the duality gap. That's the gap between the primal value you found and the dual value. So this produces both also, not just a primal value, but dual, of course, as well, right? And so these are the staircase plots, and let me explain what they are. This is Newton steps. This, the width of the tread in the staircase,","zh":"从明天开始，对吧？所以，好的，让我们来看，这是对偶间隙。这是你找到的原始值和对偶值之间的差距。这也会产生，不仅仅是原始值，还有对偶值，对吧？这些是阶梯图，让我解释一下它们是什么。这是牛顿步骤，这个，阶梯图中台阶的宽度，","start":3100.45,"end":3128.58},{"id":150,"text":"is the number of Newton steps per centering. The drop is precisely dividing the gap by a factor of mu. So on a semi-log plot, those stairs have a constant rise, each one. And the rise is precisely...","zh":"这是每次中心化所需的牛顿步数。下降量正是将间隙除以一个因子 mu。因此，在半对数图上，这些台阶具有恒定的上升量，每个台阶都是如此。而上升量正是……","start":3129.31,"end":3146.29},{"id":151,"text":"1 over mu, right? Or something like that. In other words, you reduce the gap by a factor mu, okay? So we can look and we can see all sorts of cool things here. Like, let's take the mu equals 50 one. Mu equals 50 says you are aggressively updating t each step.","zh":"1 除以 mu，对吧？或者类似这样的。换句话说，你每次步骤都将间隙减少一个因子 mu，对吧？因此，我们可以观察并看到这里有许多有趣的现象。例如，让我们以 mu 等于 50 的情况为例。mu 等于 50 表示你在每一步都积极地更新 t。","start":3147.44,"end":3166.02}],"notes":["本段讨论了在凸优化中，当参数t变得非常大时，算法的理论分析与实际表现之间的差异。理论分析预测随着t的增大，所需的牛顿迭代次数会增加，但实际中却发现迭代次数并不会显著增加。这表明理论分析可能存在错误，或者需要更精确的模型来描述实际行为。","讲者通过一个比喻来说明t非常大的情况，即使用砂纸去除粗糙的角落，使表面变得光滑，从而暗示算法在数值上可能变得不稳定。这表明在实际应用中，即使理论分析表明算法有效，但数值实现中仍可能遇到困难。","讲者提到，自洽性（self-concordance）可以验证这种现象，即随着t的增大，迭代次数不会显著增加。这表明自洽性是一个重要的性质，能够帮助理解算法的数值行为。","讲者还提到，当mu（一个与算法更新步长相关的参数）较大时，算法会更积极地更新t，这可能意味着算法在某些情况下会更快地收敛。","讲者通过一个例子说明了对偶间隙（duality gap）的概念，即原始问题解与对偶问题解之间的差距。这表明在优化过程中，对偶间隙的减少是衡量算法性能的一个重要指标。","讲者提到，通过绘制阶梯图（staircase plots），可以直观地观察到对偶间隙的减少情况。这表明在实际应用中，可视化工具可以帮助理解算法的收敛过程。"],"formulas":[],"uncertainties":["1e plus 9 可能是 1e9 的误识别，但根据上下文，它表示一个非常大的数值，因此保留原识别结果。","1 over mu 可能是 1/mu 的误识别，但根据上下文，它表示对偶间隙减少的因子，因此保留原识别结果。"],"diagram":"none","start":2992.6,"end":3166.02,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏明确的数学定义或上下文条件，无法进行数学复核，因此决定移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2992.6,"text":"And so they go, no problem, t equals 1e plus 9. It will work in theory, but numerically at that point it's not going to. I mean, that corresponds to the person who comes over here, takes this thing, right? I mean, t equals 1e plus 9 corresponds to basically someone who just says, give me some sandpaper, sands off this rough corner and says, done. It's smooth. Go ahead. Use your Newton method. Everybody following this?"},{"start":3020.01,"text":"We know now the theory is that that will work, but it will take a lot of iterations. And the practice is that it will take, number one, it will take a gazillion iterations or most likely just fail. Right, so, okay. Okay, everybody got this? So the classical analysis actually tells you that as t gets bigger and bigger, it's going to take you more and more Newton steps to get..."},{"start":3044.57,"text":"to recenter, right? And the reason is pretty clear because what's going to happen is t gets bigger and bigger, both that Lipschitz constant and, you know, that strong convexity constant are going to scale up. And so, but I mean, that's silly because that's someone saying your algorithm doesn't, if someone said your algorithm doesn't work, you'd say, why? And you'd go, well, because my analysis predicts an upper bound on the number of steps that's growing, right? And the point is the analysis turns out to be just wrong."},{"start":3071.99,"text":"So empirically, it's found that the number steps don't grow as t gets bigger and bigger. Again, it's critical you start from the previous value. So that's the critical part. And we'll see that self-concordance actually verifies that completely. So we'll see that in a minute. Okay. So let's look at some examples. So this is just an LP. As a matter of fact, you are going to implement exactly this."},{"start":3100.45,"text":"by a week from tomorrow, right? So, okay, so let's take, this is the duality gap. That's the gap between the primal value you found and the dual value. So this produces both also, not just a primal value, but dual, of course, as well, right? And so these are the staircase plots, and let me explain what they are. This is Newton steps. This, the width of the tread in the staircase,"},{"start":3129.31,"text":"is the number of Newton steps per centering. The drop is precisely dividing the gap by a factor of mu. So on a semi-log plot, those stairs have a constant rise, each one. And the rise is precisely..."},{"start":3147.44,"text":"1 over mu, right? Or something like that. In other words, you reduce the gap by a factor mu, okay? So we can look and we can see all sorts of cool things here. Like, let's take the mu equals 50 one. Mu equals 50 says you are aggressively updating t each step."}],"speech_gaps":[],"frame":"../frames/v016/019.webp","frame_time":3004.6},{"title":"牛顿法迭代次数与参数mu的关系","segments":[{"id":152,"text":"And sure enough, look at that. It takes you all of, ooh, you know, 11 iterations to do the first centering. The next one takes also like 10 or 11. Everybody see that? That's the width of those stairs. Now, when you do center, the gap goes down by 50x, which is pretty decent. Everybody, right? You can, here's like little mousy steps. Mu equals two, right? Actually, it'll be hilarious because the...","zh":"确实如此，看看这个。它需要你进行大约11次迭代来完成第一次中心化。下一次也需要大约10次或11次。大家看到了吗？这就是这些台阶的宽度。当你进行中心化时，间隙会减少50倍，这相当不错。大家明白吗？这里是一些微小的步骤。mu等于2，对吧？实际上，这会很有趣，因为……","start":3166.5,"end":3193.52},{"id":153,"text":"Theory will be calling for mu equals 1.0001, but that's another story, right? But if you look at mu equals 2, again, what you see are the treads are shorter. They're shorter because the Newton problems you're solving are easier. Basically, what's happening is you've computed a point like here, and when it's 50x, it's like way over here. You're going to actually have to do some work.","zh":"理论会要求mu等于1.0001，但这又是另一个故事，对吧？但如果你看一下mu等于2，你会发现这些台阶更短。它们更短是因为你所解决的牛顿问题更容易。基本上，发生的情况是你计算了一个点，当它减少50倍时，它会远远地移动到这里。你实际上需要做一些工作。","start":3194.27,"end":3219.23},{"id":154,"text":"But when it's 2, it's just over here, and it's going to be like 2, 3 Newton steps and game over. Everybody see this? So you get that. This is mu equals 150. So this shows you the number of Newton iterations versus how you choose that parameter mu. And by the way, if you made mu bigger, it would start to go up again. But what you see is something actually... So first of all, let's talk about how weird this is.","zh":"但当mu等于2时，它只是移动到这里，只需要2到3次牛顿步骤就可以完成。大家看到了吗？所以你得到了这个结果。这是mu等于150的情况。这展示了牛顿迭代次数与你选择的参数mu之间的关系。顺便说一句，如果你让mu更大，它又会开始增加。但你看到的是某种实际上……首先，让我们谈谈这有多奇怪。","start":3219.99,"end":3247.69},{"id":155,"text":"So basically, if you kept going, obviously, this would get to 10 to the minus 8. But let's take that as an acceptable amount to reduce your gap, right? Well, we just reduced our gap by a factor of 10 to the 8. And we did the whole thing in, I don't know, let's look at this one, 37 Newton steps. Everybody? So actually, that takes just some thought to sit there and think about what this means, right? So an LP...","zh":"基本上，如果你继续下去，显然，它会减少到10的负8次方。但让我们把这当作减少间隙的一个可接受的量，对吧？我们刚刚将间隙减少了10的8次方倍。我们整个过程用了大约37次牛顿步骤。大家明白吗？实际上，这需要一些思考才能理解这意味着什么，对吧？一个线性规划问题……","start":3250.16,"end":3277.34},{"id":156,"text":"is, you know, you have 50 variables, 100 constraints. When you picture this, it's this polyhedron in R50 with 100 faces. The number of vertices it has is just astronomical. One of those is the solution. Everybody following this, right? So, and what this shows is like extremely embarrassing is that in 30 odd Newton steps,","zh":"你知道的，你有50个变量，100个约束。当你想象这个时，它是在R50中的一个棱锥体，有100个面。它拥有的顶点数量是天文数字。其中一个就是解。大家跟上这个思路了吗？所以，这展示出极其尴尬的是，在大约30次牛顿步骤中，","start":3277.96,"end":3303.64},{"id":157,"text":"you actually get an extremely high accuracy solution. Let me make that clearer, right? By the way, you get the exact same plots look like this when the dimensions go up. They look exactly the same, right? So, but even here, it's amazing. Like R50 is a pretty, you know what? Yeah, let's, you would get exactly the same plot if this was, you know, 10,000 inequalities and whatever, 5,000, it wouldn't matter. It'd be the same, right?","zh":"你实际上会得到一个极高精度的解。让我更清楚地说明一下，对吧？顺便说一句，当维度增加时，你得到的图看起来也是一样的。它们看起来完全一样，对吧？所以在这种情况下，这也令人惊讶。比如R50是一个相当大的数值，你知道吗？是的，如果你这里不是50个不等式，而是比如说10,000个不等式，或者其他任何数量，比如5,000个，这都不会有关系。它看起来也是一样的，对吧？","start":3304.46,"end":3332.34}],"notes":["本段主要讲解了牛顿法在优化问题中的迭代次数与参数mu之间的关系。通过具体例子说明，当mu取不同值时，迭代次数和收敛速度的变化。例如，当mu=2时，迭代次数较少，而当mu=1.0001时，理论上的迭代次数会更多。这表明mu的选择对算法效率有重要影响。","讲者提到，当mu增大时，虽然初始的迭代次数可能减少，但随着迭代的进行，牛顿法的迭代次数会再次增加。这说明mu的选择需要在收敛速度和计算成本之间进行权衡。","讲者还通过一个具体的例子说明了在高维空间中，如R50，即使有大量约束条件，牛顿法仍然能够快速收敛到高精度的解。这展示了牛顿法在处理大规模优化问题时的高效性。","讲者指出，即使在高维空间中，如R50，牛顿法的收敛行为与低维空间中的表现类似。这表明牛顿法的收敛特性具有一定的普适性，不受维度的影响。","讲者强调，虽然牛顿法在高维空间中表现良好，但其收敛速度仍然依赖于参数mu的选择。因此，在实际应用中，需要根据具体问题选择合适的mu值。","最后，讲者通过一个具体的例子说明了在高维空间中，即使有大量约束条件，牛顿法仍然能够快速收敛到高精度的解。这展示了牛顿法在处理大规模优化问题时的高效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3166.5,"end":3332.34,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3166.5,"text":"And sure enough, look at that. It takes you all of, ooh, you know, 11 iterations to do the first centering. The next one takes also like 10 or 11. Everybody see that? That's the width of those stairs. Now, when you do center, the gap goes down by 50x, which is pretty decent. Everybody, right? You can, here's like little mousy steps. Mu equals two, right? Actually, it'll be hilarious because the..."},{"start":3194.27,"text":"Theory will be calling for mu equals 1.0001, but that's another story, right? But if you look at mu equals 2, again, what you see are the treads are shorter. They're shorter because the Newton problems you're solving are easier. Basically, what's happening is you've computed a point like here, and when it's 50x, it's like way over here. You're going to actually have to do some work."},{"start":3219.99,"text":"But when it's 2, it's just over here, and it's going to be like 2, 3 Newton steps and game over. Everybody see this? So you get that. This is mu equals 150. So this shows you the number of Newton iterations versus how you choose that parameter mu. And by the way, if you made mu bigger, it would start to go up again. But what you see is something actually... So first of all, let's talk about how weird this is."},{"start":3250.16,"text":"So basically, if you kept going, obviously, this would get to 10 to the minus 8. But let's take that as an acceptable amount to reduce your gap, right? Well, we just reduced our gap by a factor of 10 to the 8. And we did the whole thing in, I don't know, let's look at this one, 37 Newton steps. Everybody? So actually, that takes just some thought to sit there and think about what this means, right? So an LP..."},{"start":3277.96,"text":"is, you know, you have 50 variables, 100 constraints. When you picture this, it's this polyhedron in R50 with 100 faces. The number of vertices it has is just astronomical. One of those is the solution. Everybody following this, right? So, and what this shows is like extremely embarrassing is that in 30 odd Newton steps,"},{"start":3304.46,"text":"you actually get an extremely high accuracy solution. Let me make that clearer, right? By the way, you get the exact same plots look like this when the dimensions go up. They look exactly the same, right? So, but even here, it's amazing. Like R50 is a pretty, you know what? Yeah, let's, you would get exactly the same plot if this was, you know, 10,000 inequalities and whatever, 5,000, it wouldn't matter. It'd be the same, right?"}],"speech_gaps":[],"frame":"../frames/v016/020.webp","frame_time":3178.5},{"title":"牛顿法在大规模优化中的效率","segments":[{"id":158,"text":"But what this says is actually very, very weird. What it says is, if you think about it, you actually do 50 Newton steps. So what that means is, in solving this LP, you start at some point. Literally, you ask for directions. You calculate things involving these barrier functions and things like that and the equality constraint. Actually, you know exactly what you do. You solve a linear KKT system, and you get a direction. Everybody got that? Then on that direction, you do a line search.","zh":"但这实际上说的是非常、非常奇怪的事情。仔细想想，它实际上意味着你做了50次牛顿迭代。这意味着，在求解这个线性规划问题时，你从某个点开始。实际上，你是在询问方向。你计算涉及这些障碍函数和等式约束的相关内容。实际上，你知道自己在做什么。你解一个线性KKT系统，得到一个方向。大家明白了吗？然后在这个方向上，你进行线搜索。","start":3333.25,"end":3361.75},{"id":159,"text":"Right? Then you stop. That's iteration one. You're at the new point. You ask for directions again, which is you just query the constraints and the objective and you construct some KKT matrix and get a new direction and go again. Everybody got this? So let's pretend that that was in 5,000 variables, right? So that's in 5,000 dimensions. You basically stop and ask for directions 35 times. Everybody...","zh":"对吧？然后你停止。这是第一次迭代。你到了新的点。你再次询问方向，也就是你只需查询约束和目标函数，并构造一个KKT矩阵，得到新的方向，然后继续。大家明白了吗？让我们假设这个过程是在5000个变量中进行的，对吧？也就是说，是在5000维空间中。你基本上停止并询问方向35次。大家……","start":3362.4,"end":3391.78},{"id":160,"text":"Getting this? This is, I find it impressive, right? Like R5000 is a really big place,","zh":"明白了吗？我觉得这很令人印象深刻，对吧？比如R5000是一个非常大的空间，","start":3392.34,"end":3399.96},{"id":161,"text":"right? And so the idea that you actually can do this in like a mere 30 Newton steps or 30 steps,","zh":"对吧？所以，实际上能在仅仅30次牛顿迭代或30次步骤中完成这个想法，","start":3400.12,"end":3406.1},{"id":162,"text":"right? I think is just stunning. Okay. So yeah. In the plot on the right, why are there these","zh":"对吧？我认为这非常令人惊叹。好的。所以是的。在右边的图中，为什么会有这些","start":3406.3,"end":3415.92},{"id":163,"text":"little like jumps, for example, at 140, it's just, they're just, I don't know, but they're","zh":"小的跳跃，例如在140处，它只是……它们只是……我不知道，但它们是","start":3415.92,"end":3421.64},{"id":164,"text":"They're just random perturbations of, you know, because you can accidentally land somewhere","zh":"它们只是随机扰动，你知道的，因为你可能会偶然落在某个地方","start":3421.64,"end":3426.34},{"id":165,"text":"where instead of taking some number of Newton steps, you take a lot less.","zh":"而不是进行一定数量的牛顿步骤，而是进行很多更少的步骤。","start":3426.34,"end":3429.54},{"id":166,"text":"That's a dumb luck phenomenon.","zh":"这是一种碰运气的现象。","start":3429.82,"end":3431.14},{"id":167,"text":"So could be that.","zh":"所以可能是这样。","start":3431.4,"end":3432.56},{"id":168,"text":"I don't know.","zh":"我不知道。","start":3432.66,"end":3433.38},{"id":169,"text":"Yeah.","zh":"是的。","start":3433.86,"end":3434.3},{"id":170,"text":"I mean, this is presumably on a single instance, right?","zh":"我的意思是，这应该是在单个实例上的表现，对吧？","start":3434.36,"end":3436.28},{"id":171,"text":"If we averaged over a bunch, I can't imagine that those bumps would stay there, right?","zh":"如果我们对很多实例进行平均，我很难想象这些波动还会存在，对吧？","start":3436.36,"end":3442.06},{"id":172,"text":"So, okay.","zh":"所以，好吧。","start":3442.32,"end":3444.22},{"id":173,"text":"This is also extremely important.","zh":"这也极其重要。","start":3444.36,"end":3447.38},{"id":174,"text":"And what it says is bizarre.","zh":"它所说的非常奇怪。","start":3447.5,"end":3449.42},{"id":175,"text":"are if you think about what mu does mu is the aggressiveness by which you update your homotopy","zh":"如果你想想μ的作用，μ是你更新同伦参数的激进程度","start":3449.42,"end":3454.88},{"id":176,"text":"parameter or if you like it's it's the it's the it's a parameter that tells you how aggressively","zh":"或者说，它是一个参数，告诉你每一步你减少目标差距的激进程度","start":3454.88,"end":3459.98},{"id":177,"text":"each step you decrease the target gap in fact it's it is literally that number right so then","zh":"事实上，它就是那个数字，对吧？所以","start":3459.98,"end":3468.02},{"id":178,"text":"there's a trade-off right we we discuss it several times right if mu is small like 1.05 you're taking","zh":"这里存在一个权衡，我们多次讨论过，对吧？如果μ很小，比如1.05，你采取的步长很小","start":3468.02,"end":3473.78},{"id":179,"text":"little baby steps it's going to take one newton step or two to to recenter right but you're only","zh":"你可能需要一次或两次牛顿步才能重新中心化，但每一步你只取得百分之五的进展","start":3473.78,"end":3478.84},{"id":180,"text":"making five percent progress each step or you could take you know mu equals ten good news is","zh":"或者你可以取μ等于十，好消息是","start":3478.84,"end":3485.32},{"id":181,"text":"you're making you're going to divide your gap by a factor of ten when you finish bad news is it's","zh":"你每一步都会将差距除以十，坏消息是它会","start":3485.32,"end":3491.8},{"id":182,"text":"going to be harder for the they're going to take more newton steps everybody following this okay","zh":"这会变得更困难，他们需要进行更多的牛顿步，大家跟上来了吗，好的","start":3491.8,"end":3495.34},{"id":183,"text":"so what this tells you and this is confirmed in lots and lots and lots of other cases is these","zh":"这告诉你的，而且在很多很多其他情况下都得到了证实，是这两个效应基本上会相互抵消，这非常好，因为最后你最不希望看到的是","start":3495.34,"end":3500.74},{"id":184,"text":"two effects basically balance each other and that is super good because the last thing you want what","zh":"它所表达的是选择静默","start":3500.74,"end":3506.84},{"id":185,"text":"What it says is the choice of mute","zh":"完全没有任何区别。","start":3506.84,"end":3508.64},{"id":186,"text":"doesn't make any difference at all.","zh":"我的意思是，只要它在100倍的范围内","start":3508.64,"end":3509.84},{"id":187,"text":"I mean, as long as it's within a factor of 100","zh":"我的意思是，只要它在100倍的范围内","start":3509.98,"end":3512.6}],"notes":["本段讨论了牛顿法在大规模优化问题中的效率，特别是当问题维度很高时，例如5000维的情况下，仅需30次牛顿步骤即可完成优化。这表明牛顿法在处理大规模问题时具有显著的效率优势。"],"formulas":[],"uncertainties":["mu is the aggressiveness by which you update your homotopy parameter","it's the it's the it's a parameter that tells you how aggressively","the last thing you want what"],"diagram":"none","start":3333.25,"end":3512.6,"asr_flags":[],"math_clarifications":["原始文本讨论的是内点法和KKT系统，但未提及牛顿法、KKT系统的具体形式或参数mu的数学表达式。因此，所有公式均与上下文不符，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":3333.25,"text":"But what this says is actually very, very weird. What it says is, if you think about it, you actually do 50 Newton steps. So what that means is, in solving this LP, you start at some point. Literally, you ask for directions. You calculate things involving these barrier functions and things like that and the equality constraint. Actually, you know exactly what you do. You solve a linear KKT system, and you get a direction. Everybody got that? Then on that direction, you do a line search."},{"start":3362.4,"text":"Right? Then you stop. That's iteration one. You're at the new point. You ask for directions again, which is you just query the constraints and the objective and you construct some KKT matrix and get a new direction and go again. Everybody got this? So let's pretend that that was in 5,000 variables, right? So that's in 5,000 dimensions. You basically stop and ask for directions 35 times. Everybody..."},{"start":3392.34,"text":"Getting this? This is, I find it impressive, right? Like R5000 is a really big place,"},{"start":3400.12,"text":"right? And so the idea that you actually can do this in like a mere 30 Newton steps or 30 steps,"},{"start":3406.3,"text":"right? I think is just stunning. Okay. So yeah. In the plot on the right, why are there these"},{"start":3415.92,"text":"little like jumps, for example, at 140, it's just, they're just, I don't know, but they're"},{"start":3421.64,"text":"They're just random perturbations of, you know, because you can accidentally land somewhere"},{"start":3426.34,"text":"where instead of taking some number of Newton steps, you take a lot less."},{"start":3429.82,"text":"That's a dumb luck phenomenon."},{"start":3431.4,"text":"So could be that."},{"start":3432.66,"text":"I don't know."},{"start":3433.86,"text":"Yeah."},{"start":3434.36,"text":"I mean, this is presumably on a single instance, right?"},{"start":3436.36,"text":"If we averaged over a bunch, I can't imagine that those bumps would stay there, right?"},{"start":3442.32,"text":"So, okay."},{"start":3444.36,"text":"This is also extremely important."},{"start":3447.5,"text":"And what it says is bizarre."},{"start":3449.42,"text":"are if you think about what mu does mu is the aggressiveness by which you update your homotopy"},{"start":3454.88,"text":"parameter or if you like it's it's the it's the it's a parameter that tells you how aggressively"},{"start":3459.98,"text":"each step you decrease the target gap in fact it's it is literally that number right so then"},{"start":3468.02,"text":"there's a trade-off right we we discuss it several times right if mu is small like 1.05 you're taking"},{"start":3473.78,"text":"little baby steps it's going to take one newton step or two to to recenter right but you're only"},{"start":3478.84,"text":"making five percent progress each step or you could take you know mu equals ten good news is"},{"start":3485.32,"text":"you're making you're going to divide your gap by a factor of ten when you finish bad news is it's"},{"start":3491.8,"text":"going to be harder for the they're going to take more newton steps everybody following this okay"},{"start":3495.34,"text":"so what this tells you and this is confirmed in lots and lots and lots of other cases is these"},{"start":3500.74,"text":"two effects basically balance each other and that is super good because the last thing you want what"},{"start":3506.84,"text":"What it says is the choice of mute"},{"start":3508.64,"text":"doesn't make any difference at all."},{"start":3509.98,"text":"I mean, as long as it's within a factor of 100"}],"speech_gaps":[],"frame":"../frames/v016/021.webp","frame_time":3345.25},{"title":"凸优化中的对数障碍方法迭代次数分析","segments":[{"id":188,"text":"of some reasonable value.","zh":"某个合理值的。","start":3512.6,"end":3514.1},{"id":189,"text":"Everybody see this?","zh":"大家看到这个了吗？","start":3514.22,"end":3514.74},{"id":190,"text":"So, it's very cool.","zh":"所以，这非常酷。","start":3515.76,"end":3516.96},{"id":191,"text":"Okay, so this is what that looks like.","zh":"好的，这就是它看起来的样子。","start":3518.84,"end":3521.46},{"id":192,"text":"I find it pretty spooky, right, that this works. I mean, here's a GP. And again, these are small ones, but nevertheless, that's pretty cool. Here it is. And it takes 20 to whatever. Again, it takes like 30-something iterations, right?","zh":"我觉得这很神奇，对吧？这里有一个GP。而且这些是小规模的，但无论如何，这真的很酷。这里就是。它需要20到任意数量。同样，它需要大约30多次迭代，对吧？","start":3524.44,"end":3545.45},{"id":193,"text":"Yeah, by the way, something like this would be 25 years ago would just be like utterly unknown. People were still publishing papers on fancy custom methods to solve GPs. So this is maybe 30 years ago. Right. So still pretty cool. But they all these things all just start looking the same. Right. So here's what it looks like when you just take this is actually literally this is the one you're going to do for your homework. You're going to implement this and.","zh":"顺便说一下，25年前，类似的东西还完全不为人知。人们还在发表论文，介绍各种复杂的自定义方法来解决GP。所以这可能是在30年前。对吧？所以仍然很酷。但所有这些方法看起来都差不多了。对吧？这就是当你只是采用这种方法时的样子，实际上，这就是你将在作业中执行的。你将实现这个方法并。","start":3547.18,"end":3575.37},{"id":194,"text":"Here, we have a bunch of values of m, and we are going to solve like 100 different things. What's cool is you look, this is the problem size, right? And this is the number of steps. The first thing you should notice is that it ranges between like 20 and 25, you know, with the absolute maximum being 30.","zh":"在这里，我们有一组m的值，我们将解决100个不同的问题。有趣的是，你看到这个，这是问题的规模，对吧？而这是步骤的数量。你首先应该注意到的是，它在20到25之间，你知道的，最大值是30。","start":3577.35,"end":3604.15},{"id":195,"text":"And by the way, if you look at the output when you, you know, when you call the solve method in CVXPy, it's going to call... It's going to call some solver. But if it's something like ECOS or something like that, it will actually report, it'll actually tell you how many iterations it is. And it's typically between 20 and 50, right? So in fact, I don't think it's ever more than 50.","zh":"顺便说一下，如果你查看当你调用CVXPy中的solve方法时的输出，它会调用……它会调用某个求解器。但如果它是像ECOS这样的求解器，它实际上会报告，它会告诉你迭代次数是多少。通常在20到50之间，对吧？事实上，我认为它从不超过50次。","start":3604.43,"end":3624.22},{"id":196,"text":"So, you know, first people said, oh, yeah, you know, it's like, I think it's like the square root. And someone said, I think it grows like the log and whatever. And then finally, what has become clear as an empirical fact is that the growth is O of one. In other words, barrier methods take between 20 and 50 steps, period. And that's just what they do in any dimension.","zh":"所以，你知道，一开始人们说，哦，对了，你知道，它大概是平方根级别的。然后有人提出，我认为它增长得像对数那样。最后，作为一个经验事实变得清晰的是，增长是O(1)的。换句话说，障碍方法在20到50步之间，不管维度如何。","start":3626.4,"end":3655.53},{"id":197,"text":"Oh, by the way, those steps are Newton steps. So what that means is you're solving a linear KKT system, right? So you're solving literally an H, A transpose, A, 0 set of linear equations, right? That's what it is. Now, of course, as the problem gets bigger, that numerical step, that's going to take you more time, obviously, right?","zh":"顺便提一下，这些步骤是牛顿步骤。这意味着你在解一个线性KKT系统，对吧？你实际上是在解一个H、A转置、A、0的线性方程组，对吧？当然，随着问题规模变大，这个数值步骤显然会花费更多时间。","start":3655.85,"end":3678.95}],"notes":["本段主要讨论了凸优化中对数障碍方法的迭代次数。讲者指出，对于小规模问题，迭代次数通常在20到50次之间，且在不同维度下表现一致。这表明对数障碍方法在实际应用中具有较高的效率。","讲者提到，早期的优化方法需要复杂的自定义方法来解决几何规划（GP）问题，而现代方法如对数障碍方法则通过迭代求解线性KKT系统，使得问题变得简单且高效。","讲者指出，对数障碍方法的迭代次数在实践中表现出O(1)的复杂度，即迭代次数与问题规模无关，这在实际应用中是一个重要的发现。","讲者强调，虽然迭代次数在不同问题中可能略有不同，但通常在20到50次之间，这表明对数障碍方法在实际计算中具有良好的稳定性。","讲者提到，每次迭代实际上是在求解一个线性KKT系统，这涉及到Hessian矩阵和约束矩阵的计算，但随着问题规模的增加，计算时间会相应增加。","讲者还指出，对数障碍方法的迭代次数在实践中被广泛验证，这表明该方法在凸优化领域具有重要的应用价值。"],"formulas":[{"latex":"O(1)","symbols":"大O符号，表示迭代次数与问题规模无关","explanation":"O(1) 表示迭代次数为常数，与问题规模无关，符合原文中提到的迭代次数在20到50之间，且与维度无关的描述。","evidence":"So, you know, first people said, oh, yeah, you know, it's like, I think it's like the square root. And someone said, I think it grows like the log and whatever. And then finally, what has become clear as an empirical fact is that the growth is O
