<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 16</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">16 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 16 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v016","title":"16 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 16","course":"凸优化","pages":[{"title":"线搜索先检查定义域，再检查残差","start":5.26,"end":157.76,"segments":[{"id":0,"text":"Good. Well, we'll go ahead and start. Actually, I just wanted to repeat something I mentioned last lecture, but maybe some of you hadn't started the homework problem where you implement an infeasible start Newton method. So I'm just going to repeat it because it's actually super important. It's this, that the gradient and Hessian, you just write out simple formulas for them like, you know,"},{"id":1,"text":"whatever, the gradient is a vector that looks like entrywise 1 over x, right? And the Hessian is diag of like 1 over xi squared or something like that. So the problem is that those make sense when the xi's are negative, those expressions, right? They actually, they parse. I mean, if you're unlucky enough to have one of the xi's zero, then both of those are going to give you some trouble. But they're going to make sense. They are completely wrong and have no meaning whatsoever in this problem, right? Because for us,"},{"id":2,"text":"the function is defined on x positive, period, right? So what that means is in your line search, you're going to want to first make sure that x plus t v is positive. And you keep reducing or you have t times equals beta until that becomes true."},{"id":3,"text":"then you check the residual. Unfortunately, if you go ahead and check the residual, it's very likely to actually make sense, and everything will be wrong, nothing good is going to happen after that, and it's going to be a disaster. So, okay, I feel like I've said it enough. Okay, the other thing I was going to say is, if you get it to work and you have some extra time, probably you don't, but..."},{"id":4,"text":"It wouldn't be very hard for you to then make a new version that uses sparse linear algebra. You can't do that in NumPy. You're going to do that in SciPy. And this is just for fun. This is just if you wanted to. Actually, by the end of next week, it means you'll have implemented an LP solver that will solve 10,000 variable problems, which is kind of cool, I think. So anyway, that would not be very hard to do. I know a bunch of people are interested in this. If you are, this would be a great..."},{"id":5,"text":"practice to do that would be to implement a sparse-friendly version. And the only difference is that A is sparse then, right? The matrix A. And then the only other thing is you just go through the code and replace the numpy. You could actually do a direct KKT factorization with an LDL transpose. You could do all these sorts of stuff. But this is only if you want. So, okay. Any..."}],"notes":["讲者先提醒实现“不可行初始点牛顿法”时最容易出现的定义域错误：梯度或 Hessian 的代数表达式能够算出一个数，并不代表它在当前优化问题中有意义。这里函数只在各分量严格为正时定义；即使某些含 1/xᵢ 或 1/xᵢ² 的表达式在负数处也能数值计算，也不能把这些数当成本问题的合法导数。零分量还会直接触发除零问题。","因此，回溯线搜索必须先检查候选点 x+tv 是否仍在定义域内。如果存在非正分量，就继续缩小步长；通过定义域检查后，才计算并检查残差。若顺序反过来，程序可能对一个非法点算出看似正常的残差，从而让后续迭代失去意义。“不可行初始点”不能被理解为允许越出函数的定义域。","下面的图解用一维例子 x=1、搜索方向 v=−2 展示这个问题。它是补充教学示意：t≥0.5 时，候选点已经到达零边界或进入负半轴；必须缩小 t，才能重新满足严格正的定义域要求。实际多维问题需要同时检查所有坐标。","讲者还建议，有余力的同学可以把实现改为适合稀疏矩阵的版本：使用 SciPy 的稀疏线性代数，而不只是 NumPy 的稠密运算；矩阵 A 采用稀疏形式，并相应替换代码中的线性代数操作。还可以考虑直接求解 KKT 系统以及 LDLᵀ 分解。这是可选练习，目的在于理解求解器的实现及计算规模。"],"formulas":[{"latex":"x+t v\\succ 0\\quad\\Longleftrightarrow\\quad x_i+t v_i>0\\ \\text{for every }i","symbols":"x：当前点；v：搜索方向；t：步长。向量严格为正表示每个分量都大于零。","explanation":"这是本段要求优先检查的定义域条件，通过后才继续检查残差。","evidence":"the function is defined on x positive, period, right? So what that means is in your line search, you're going to want to first make sure that x plus t v is positive. And you keep reducing or you have t times equals beta until that becomes true."},{"latex":"t\\leftarrow\\beta t,\\qquad 0\u003c\\beta\u003c1","symbols":"β：缩小步长的比例。区间 (0,1) 是使步长逐次缩小的选择条件。","explanation":"若候选点不在定义域内，就重复缩小步长，再重新检查定义域。","evidence":"the function is defined on x positive, period, right? So what that means is in your line search, you're going to want to first make sure that x plus t v is positive. And you keep reducing or you have t times equals beta until that becomes true."}],"diagram":"domain","uncertainties":[],"asr_flags":[],"raw_segments":[{"start":5.26,"text":"Good. Well, we'll go ahead and start. Actually, I just wanted to repeat something I mentioned last lecture, but maybe some of you hadn't started the homework problem where you implement an infeasible start Newton method. So I'm just going to repeat it because it's actually super important. It's this, that the gradient and Hessian, you just write out simple formulas for them like, you know,"},{"start":30.34,"text":"whatever, the gradient is a vector that looks like entrywise 1 over x, right? And the Hessian is diag of like 1 over xi squared or something like that. So the problem is that those make sense when the xi's are negative, those expressions, right? They actually, they parse. I mean, if you're unlucky enough to have one of the xi's zero, then both of those are going to give you some trouble. But they're going to make sense. They are completely wrong and have no meaning whatsoever in this problem, right? Because for us,"},{"start":59.96,"text":"the function is defined on x positive, period, right? So what that means is in your line search, you're going to want to first make sure that x plus t v is positive. And you keep reducing or you have t times equals beta until that becomes true."},{"start":80.42,"text":"then you check the residual. Unfortunately, if you go ahead and check the residual, it's very likely to actually make sense, and everything will be wrong, nothing good is going to happen after that, and it's going to be a disaster. So, okay, I feel like I've said it enough. Okay, the other thing I was going to say is, if you get it to work and you have some extra time, probably you don't, but..."},{"start":104.62,"text":"It wouldn't be very hard for you to then make a new version that uses sparse linear algebra. You can't do that in NumPy. You're going to do that in SciPy. And this is just for fun. This is just if you wanted to. Actually, by the end of next week, it means you'll have implemented an LP solver that will solve 10,000 variable problems, which is kind of cool, I think. So anyway, that would not be very hard to do. I know a bunch of people are interested in this. If you are, this would be a great..."},{"start":132.8,"text":"practice to do that would be to implement a sparse-friendly version. And the only difference is that A is sparse then, right? The matrix A. And then the only other thing is you just go through the code and replace the numpy. You could actually do a direct KKT factorization with an LDL transpose. You could do all these sorts of stuff. But this is only if you want. So, okay. Any..."}],"speech_gaps":[],"frame":"../frames/v016/001.webp","frame_time":17.259999999999998},{"title":"处理不等式约束的方法","segments":[{"id":6,"text":"Any questions? How many people here have actually attempted it so far? And how many actually have it working? Awesome. Okay. And for the rest of you, anyway, I think that the number one bug is the one I just mentioned, is the domain issue. Okay. Oh, and the other thing is, of course, I think I mentioned this last time, but..."},{"id":7,"text":"Please have the sense that if you get into the three-hour thing, three, four hours of attempting to debug this, unless it just becomes like a weird obsession and matter of personal pride, which it kind of should, but barring that, you should have the sense to quit at some point because the point of the class is not to debug optimization scripts anyway."},{"id":8,"text":"Actually, the main point of this is to demystify how these things work. So by next week, using the things we're going to talk about today, you're actually going to end up implementing a full LP solver, right? Which is kind of cool. And that way, I don't know. I don't know how many people can say they've implemented an LP solver from scratch. That actually is not so bad. So, okay."},{"id":9,"text":"Let's continue. Where we were last time was we said, let's take a look at how to handle... So we do know, we're going to assume all the functions involved... Whoops, that's no good. We're going to assume that all of the functions involved are going to be smooth. So we have a problem that looks like this, right? And without these, we know how to solve this problem."},{"id":10,"text":"So the question is, roughly speaking, how do you extend it to handle these inequality constraints? So that's one way to do it. And what you could do is you could do something like put it in the objective. I forget, I guess we typically have M. And this is the I."},{"id":11,"text":"indicator function of f i of x less than zero. This returns plus infinity if this is positive and zero otherwise. So this would be one version of this. And here's this function i right here. It's the indicator function of negative numbers. So let's actually talk about methods you might do this."}],"notes":["本段讨论了如何将牛顿法扩展到处理不等式约束的问题。讲者提到，可以通过将不等式约束转化为目标函数的一部分来实现，例如使用指示函数（indicator function）来表示约束条件。","讲者提到，指示函数在约束条件不满足时返回正无穷大，而在满足时返回零。这种做法可以将不等式约束纳入优化问题中，从而使用现有的优化方法进行求解。","讲者还提到，这种处理方式是处理不等式约束的一种方法，但需要进一步讨论具体的实现方法。","讲者强调，处理不等式约束是优化问题中的一个关键点，特别是在实际应用中，许多问题都包含不等式约束，因此需要掌握相应的处理技巧。","讲者提到，通过将不等式约束转化为目标函数的一部分，可以将问题转化为一个标准的优化问题，从而使用牛顿法等方法进行求解。","讲者指出，这种方法虽然有效，但需要仔细处理，特别是在处理约束条件的边界情况时，需要特别注意函数的连续性和可微性。"],"formulas":[],"uncertainties":["indicator function of f i of x less than zero"],"diagram":"none","start":159.91,"end":325.78,"asr_flags":[],"raw_segments":[{"start":159.91,"text":"Any questions? How many people here have actually attempted it so far? And how many actually have it working? Awesome. Okay. And for the rest of you, anyway, I think that the number one bug is the one I just mentioned, is the domain issue. Okay. Oh, and the other thing is, of course, I think I mentioned this last time, but..."},{"start":188.65,"text":"Please have the sense that if you get into the three-hour thing, three, four hours of attempting to debug this, unless it just becomes like a weird obsession and matter of personal pride, which it kind of should, but barring that, you should have the sense to quit at some point because the point of the class is not to debug optimization scripts anyway."},{"start":215.59,"text":"Actually, the main point of this is to demystify how these things work. So by next week, using the things we're going to talk about today, you're actually going to end up implementing a full LP solver, right? Which is kind of cool. And that way, I don't know. I don't know how many people can say they've implemented an LP solver from scratch. That actually is not so bad. So, okay."},{"start":242.38,"text":"Let's continue. Where we were last time was we said, let's take a look at how to handle... So we do know, we're going to assume all the functions involved... Whoops, that's no good. We're going to assume that all of the functions involved are going to be smooth. So we have a problem that looks like this, right? And without these, we know how to solve this problem."},{"start":270.92,"text":"So this we would just apply Newton's method. And you know several variations of Newton's method, as a matter of fact, to solve this. So the question is, roughly speaking, how do you extend it to handle these inequality constraints? So that's one way to do it. And what you could do is you could do something like put it in the objective. I forget, I guess we typically have M. And this is the I."},{"start":299.28,"text":"indicator function of f i of x less than zero. This returns plus infinity if this is positive and zero otherwise. So this would be one version of this. And here's this function i right here. It's the indicator function of negative numbers. So let's actually talk about methods you might do this."}],"speech_gaps":[],"frame":"../frames/v016/002.webp","frame_time":171.91},{"title":"凸优化中的非光滑问题与光滑近似","segments":[{"id":12,"text":"Here's one. And I could tell the story. I could make it pretty persuasive, the story I'm about to give, right? And it goes like this. You finish, you debug your Newton solver for this thing here, right? You get a debug. And then someone says, yeah, add this in because I want to also handle constraints. And you go, cool. So here's a method I'm going to propose. Ready? You just apply Newton's method to this, okay? And someone said, but wait."},{"id":13,"text":"This is not smooth. Everybody following this? Right? And then you'd say, well, yeah, you know, that's just mathematicians. That doesn't matter. I mean, come on. Let's just try this anyway. Everyone see what I'm saying?"},{"id":14,"text":"Anyway, that will fail absolutely miserably. It will not work at all. So this is one of those cases where it's not just a question of mathematicians. It's that there's a real problem there. So that won't work at all, right? I mean, not to mention what happens if you end up at a point that's like infeasible. Anyway, it won't work. Okay. Now the next variation on it is, I'll explain it also. Here would be the street fighting method to do it. If someone says, what's your problem? And you go, well, I would like to incorporate this function here."},{"id":15,"text":"But it's not smooth, right? So I can't use Newton's method. Once this is smooth, I can use Newton's method. Someone says, I got it. You get some sandpaper and you come over here and you just sand off the corner here, okay? And now what I mean by that is I can make a completely smooth approximation of that function. And you go, there, I'm good with the convergence police."},{"id":16,"text":"I mean, everything is cool now. Everybody following this? And guess what? It would work. It's just that Newton's method would take, you know, 100 gazillion iterations to converge. Why is that? Someone explain why. It doesn't look very quadratic. That's a good point. So, yeah, that has a really big third derivative. It doesn't look quadratic and all that kind of... So, basically, the smoother it is..."},{"id":17,"text":"kind of the better Newton's method is going to work. This is kind of just intuitive, but that's the idea. And that's exactly right. Okay, so this story starts that way, but it's actually instead going to have a happy ending. So the specific approximation that's going to be used is something called the logarithmic barrier. And we can, yeah, it's going to look like this. It's these functions. So here's the actual function."},{"id":18,"text":"this indicator function, and then this is basically minus one over T log minus one over, they all go through zero here at minus one, right? They get slightly negative here, and then they go up to plus infinity as you approach this boundary, okay? So this thing,"}],"notes":["本段讲授了在非光滑问题中使用牛顿法的困难，以及如何通过光滑近似来解决这个问题。讲者用了一个比喻，即用砂纸打磨函数的尖角，使其变得光滑，从而可以应用牛顿法。然而，即使函数变得光滑，牛顿法的收敛速度也可能非常慢，因为函数的高阶导数较大，导致函数不像二次函数那样平滑。","讲者指出，函数的光滑程度直接影响牛顿法的收敛效果。函数越光滑，牛顿法的收敛效果越好。这是基于直观的理解，但也是正确的。讲者还提到，虽然这种方法看似可行，但实际应用中可能需要大量的迭代次数才能收敛。","接下来，讲者介绍了用于解决非光滑问题的一种具体方法，即对数障碍函数（logarithmic barrier）。这种函数在接近约束边界时趋向于正无穷，而在内部区域则保持有限值。这种函数的形状类似于一个指针，穿过零点，并在边界处迅速上升。","对数障碍函数的构造基于一个指标函数，该函数在约束区域内为零，而在边界处趋向于正无穷。通过引入一个参数T，可以调整函数的平滑程度。当T较小时，函数的平滑程度较高，但接近边界时的上升速度更快。","讲者提到，这种光滑近似方法虽然在理论上可行，但在实际应用中需要权衡平滑程度和收敛速度。因此，选择合适的参数T对于实现有效的优化方法至关重要。","最后，讲者指出，虽然这种方法在理论上是可行的，但在实际应用中可能需要大量的计算资源，因为牛顿法的收敛速度可能非常慢。因此，这种方法通常用于理论分析，而不是实际计算。"],"formulas":[],"uncertainties":["gazillion"],"diagram":"none","start":327.45,"end":506.3,"asr_flags":[],"math_clarifications":["公式中的对数障碍函数表达式不完整，缺少了约束条件的定义，且未明确说明其在边界处的行为。此外，对数函数的定义域需要明确，以确保数学表达的严谨性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":327.45,"text":"Here's one. And I could tell the story. I could make it pretty persuasive, the story I'm about to give, right? And it goes like this. You finish, you debug your Newton solver for this thing here, right? You get a debug. And then someone says, yeah, add this in because I want to also handle constraints. And you go, cool. So here's a method I'm going to propose. Ready? You just apply Newton's method to this, okay? And someone said, but wait."},{"start":357.36,"text":"This is not smooth. Everybody following this? Right? And then you'd say, well, yeah, you know, that's just mathematicians. That doesn't matter. I mean, come on. Let's just try this anyway. Everyone see what I'm saying?"},{"start":372.06,"text":"Anyway, that will fail absolutely miserably. It will not work at all. So this is one of those cases where it's not just a question of mathematicians. It's that there's a real problem there. So that won't work at all, right? I mean, not to mention what happens if you end up at a point that's like infeasible. Anyway, it won't work. Okay. Now the next variation on it is, I'll explain it also. Here would be the street fighting method to do it. If someone says, what's your problem? And you go, well, I would like to incorporate this function here."},{"start":401.6,"text":"But it's not smooth, right? So I can't use Newton's method. Once this is smooth, I can use Newton's method. Someone says, I got it. You get some sandpaper and you come over here and you just sand off the corner here, okay? And now what I mean by that is I can make a completely smooth approximation of that function. And you go, there, I'm good with the convergence police."},{"start":427.95,"text":"I mean, everything is cool now. Everybody following this? And guess what? It would work. It's just that Newton's method would take, you know, 100 gazillion iterations to converge. Why is that? Someone explain why. It doesn't look very quadratic. That's a good point. So, yeah, that has a really big third derivative. It doesn't look quadratic and all that kind of... So, basically, the smoother it is..."},{"start":457.53,"text":"kind of the better Newton's method is going to work. This is kind of just intuitive, but that's the idea. And that's exactly right. Okay, so this story starts that way, but it's actually instead going to have a happy ending. So the specific approximation that's going to be used is something called the logarithmic barrier. And we can, yeah, it's going to look like this. It's these functions. So here's the actual function."},{"start":487.13,"text":"this indicator function, and then this is basically minus one over T log minus one over, they all go through zero here at minus one, right? They get slightly negative here, and then they go up to plus infinity as you approach this boundary, okay? So this thing,"}],"speech_gaps":[],"frame":"../frames/v016/003.webp","frame_time":339.45},{"title":"凸优化中的近似方法与牛顿法","segments":[{"id":19,"text":"is that's like Newton-ready. That's a smooth problem. Smooth objective, equality constraints. The code you're going to implement will just solve it. It literally will solve something very close to this in your homework. So that works. So the idea is this is an approximation of this indicator function. And what's clear is t is like a parameter, which tells me..."},{"id":20,"text":"how good an approximation I make. If t is really big, I get something that looks like this, right? And intuition suggests that then I would get a really good approximation of letely clear. Yeah? What's the difference between doing it this way and just starting by taking the Lagrangian of the original problem and doing it from there? Yeah, that's a great question. So for many problems, LP would be a perfect example, right? If you just pick random dual variables and you evaluate the dual function, you get minus infinity. Because, for example, for an LP, and actually for many problems, the dual function is..."},{"id":55,"text":"minus infinity, unless some very specific things happen, like equality constraints hold, right? So if I say, here's my LP, and you say, oh, fine, I'm going to form a Lagrangian, then how do you pick your dual variables, right? The answer is, if you're doing it randomly or something, you're just going to get, congratulations, your lower bound is minus infinity. This is very cool, because this says, first, you solve a smooth equality constraint problem, and then"},{"id":56,"text":"out of that is going to come some dual variables that are guaranteed to be dual feasible. Not only will you get a non-trivial, in other words, a not minus infinity lower bound, you're going to get one that's actually the value you get minus m over t. I don't know if that made sense. So here you are finding the dual variables inadvertently by minimizing this barrier function, right?"},{"id":57,"text":"There are problems where, you know, if the domain of G is everything, where you can just update the dual variables and stuff like that, right? So actually those are often called price, either price-directed methods, that's in economics, that's what they're referred to, right? But it doesn't work for most problems. If you have an LP or something, it doesn't work at all. Because those, roughly speaking, those prices have to satisfy extremely specific properties, right? Okay, good."},{"id":58,"text":"Okay, now we can also interpret this via KKT conditions, right? So let's see how that works. Okay, so if you look at x star of t, that's the thing you  gap is going to be m over t. So if t goes to infinity now, you solve the problem."},{"start":1192.77,"text":"And that's completely clear. Yeah? What's the difference between doing it this way and just starting by taking the Lagrangian of the original problem and doing it from there? Yeah, that's a great question. So for many problems, LP would be a perfect example, right? If you just pick random dual variables and you evaluate the dual function, you get minus infinity. Because, for example, for an LP, and actually for many problems, the dual function is..."},{"start":1221.39,"text":"minus infinity, unless some very specific things happen, like equality constraints hold, right? So if I say, here's my LP, and you say, oh, fine, I'm going to form a Lagrangian, then how do you pick your dual variables, right? The answer is, if you're doing it randomly or something, you're just going to get, congratulations, your lower bound is minus infinity. This is very cool, because this says, first, you solve a smooth equality constraint problem, and then"},{"start":1248.27,"text":"out of that is going to come some dual variables that are guaranteed to be dual feasible. Not only will you get a non-trivial, in other words, a not minus infinity lower bound, you're going to get one that's actually the value you get minus m over t. I don't know if that made sense. So here you are finding the dual variables inadvertently by minimizing this barrier function, right?"},{"start":1271.97,"text":"There are problems where, you know, if the domain of G is everything, where you can just update the dual variables and stuff like that, right? So actually those are often called price, either price-directed methods, that's in economics, that's what they're referred to, right? But it doesn't work for most problems. If you have an LP or something, it doesn't work at all. Because those, roughly speaking, those prices have to satisfy extremely specific properties, right? Okay, good."},{"start":1302.1,"text":"Okay, now we can also interpret this via KKT conditions, right? So let's see how that works. Okay, so if you look at x star of t, that's the thing you compute by Newton's method. Well, in fact, I think the verb you would use is you have centered, you've actually centered, or you've computed a point on the central path, right? You've computed x star of t."}],"speech_gaps":[],"frame":"../frames/v016/008.webp","frame_time":1174.63},{"title":"对偶问题与KKT条件的近似","segments":[{"id":59,"text":"Here um and then from that we get these lambda stars right these one over t times the margins and blah blah blah right so I get I get those um and they are also functions of t um I think yeah that's fine so we do that and um now this is a primal dual pair and let's see what what they satisfy well uh not only do they satisfy this they're these are actually satisfied with a strict inequality right because you have this log barrier so you can't even be zero"},{"id":60,"text":"right so so primal feasibility works the ax equals b comes for free because you solve the problem with the constraint x equals b so that's free um your dual constraints are well that's these are definitely b and equal zeros matter of fact they're positive if you look what those numbers are they're one over the margins times t right and t is positive and the margin is positive and all that so in fact uh this inequality and this one hold with strict they're strict but this is all we"},{"id":61,"text":"we really want here. If you go through and work out, well, this is actually by definition, remember that we define lambda i to be one over minus t fi of x, right? And so I express that this way. And then the final part is the gradient of the Lagrangian, you know, is zero, right? So, you know, that's fine."},{"id":62,"text":"If you stare at this and say, what's the difference between this and the KKT conditions of the original problem? There's only one difference, and it's really small. It's right here. This is the compl  is the repulsive force from this constraint This is the repulsive force from this constraint here Right. This is the repulsive force from this constraint, right?"}],"notes":["本段讲授了如何将线性规划问题中的约束和目标函数类比为物理中的力场。讲者提到，约束对应于一种排斥力，这种力随着距离的减小而增强，而目标函数则对应于一个常数力场，引导优化方向。","在约束条件中，力场的强度与距离成反比，这表明当点接近约束边界时，力会变得更强，从而推动点远离约束区域。","讲者还提到，目标函数的力场是常数，意味着它在整个优化域内方向一致，引导优化过程朝着目标方向移动。","讲者通过一个具体的例子，说明了如何将线性规划问题中的约束和目标函数转化为力场模型，并通过力的平衡来求解问题。","讲者强调，这种物理类比有助于理解优化问题的几何结构，但同时也指出，这种类比只是帮助理解的工具，不一定是实际的物理过程。"],"formulas":[{"latex":"F = -\\nabla \\text{potential}","symbols":"力场是势函数的负梯度","explanation":"公式正确，力场定义为势函数的负梯度，符合物理学定义。","evidence":"A force field is the negative gradient of a potential, right?"}],"uncertainties":["T times","minus c"],"diagram":"none","start":1504.53,"end":1677.17,"asr_flags":[],"math_clarifications":["公式1未明确约束条件或变量定义，无法核定。公式2和公式3缺少明确的数学表达，无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1504.53,"text":"And then what I do is I have a,"},{"start":1509.53,"text":"so this thing is going to be the potential"},{"start":1511.71,"text":"of some force field."},{"start":1513.23,"text":"A force field is the negative gradient of a potential, right?"},{"start":1516.87,"text":"So what I do is this is my, that's my force field."},{"start":1521.29,"text":"And then here I have a, that's the potential of a force field associated with each constraint, right?"},{"start":1528.75,"text":"And at this central point, the force fields, all the forces balance, right?"},{"start":1535.75,"text":"It just means the gradients sum up to zero, right?"},{"start":1537.99,"text":"So that's the picture."},{"start":1538.85,"text":"and let me show you what we'll show you I'll just show you some pictures about"},{"start":1542.21,"text":"how you can look at that so here's an LP and the way we're going to solve it is"},{"start":1549.69,"text":"this well we'll introduce a force field which is just minus T times"},{"start":1556.72,"text":"So it just means it's a constant force field. It' it out. I mean, it's true. All of these forces balance at this point on the central path. And so now you can see all sorts of cool, you can actually kind of visualize what happens when I increase T. When I increase T, this force here, I multiply it by three, it gets three times stronger, pushing you in this direction."},{"id":96,"text":"And so it settles to a new equilibrium, which is there. I mean, you can see it along the central path, and everything makes sense. You move this way, and as you did, you got closer to this, and then this got bigger, right? You got closer to this one, this got bigger, and then whatever it is, these things, these six force vectors are going to add to zero. So I don't know if this is helpful or not for people, but for me, I think it's a very good way to see this. Okay, let me ask a question about it."},{"id":97,"text":"What if I add a redundant constraint to an LP? So I add a new vector A, A transpose X less than or equal to B, and it's redundant, meaning that visually it means it's over here. It says please stay on that side, but everything already in here is on that side. Everybody got that? So here's my question for you. Does it change the central path?"},{"id":98,"text":"Oh, here's another way to say this. Do redundant inequalities have an effect on the central path? That's my question. What do you think? No. Okay. What's your argument? They're redundant. They're redundant. I like that argument. Okay, so here's this. I like your argument. Okay, it's brief, so that's always a plus. Let's see. Okay. It does have one disadvantage, also brief."},{"id":99,"text":"It's false, right? But it sounds good and, you know, it's good. Okay, so look, here's what would happen. I mean, let's even think about what would happen, right? What if I shoved an inequality here and here and I put a whole bunch over here, right? Each of those is producing a force. Now, they're not inside here to, you know, but it's going to feel this. Suppose I put like 10 constraints right here. Someone tell me, what do you think the central path is going to look like then?"},{"id":100,"text":"But it's going to still sneak up to the solution, right? Because there's all these repulsive forces this way, so it's going to actually do something weird like go along this way, right? But the same story is going to happen. It's going to converge to the solution. Okay, so again, this is just for interpretation so you understand how these things work."}],"notes":["本段主要讨论了中心路径上的力平衡现象，以及增加T值对路径的影响。当T增加时，某些力会增强，从而推动系统向新的平衡点移动。这种可视化方法有助于理解中心路径的动态变化。","接着，讲者提出了一个关于线性规划中添加冗余约束的问题。冗余约束意味着该约束对当前可行域没有影响，但讲者询问这种约束是否会影响中心路径。","讲者进一步解释了冗余约束的定义，并指出冗余约束不会改变中心路径。尽管这一结论可能听起来有道理，但讲者也指出其可能存在的问题。","随后，讲者通过举例说明，即使添加多个冗余约束，中心路径仍然会收敛到解。这表明冗余约束不会改变路径的最终行为，但可能影响路径的形状。","讲者强调，这种可视化方法有助于理解中心路径的动态特性，但最终的收敛性不受冗余约束的影响。","最后，讲者总结了冗余约束对中心路径的影响，指出虽然冗余约束不会改变路径的最终结果，但它们可能对路径的形状产生影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1677.59,"end":1854.15,"asr_flags":[],"raw_segments":[{"start":1677.59,"text":"And then, I don't know, you can work it out. I mean, it's true. All of these forces balance at this point on the central path. And so now you can see all sorts of cool, you can actually kind of visualize what happens when I increase T. When I increase T, this force here, I multiply it by three, it gets three times stronger, pushing you in this direction."},{"start":1698.71,"text":"And so it settles to a new equilibrium, which is there. I mean, you can see it along the central path, and everything makes sense. You move this way, and as you did, you got closer to this, and then this got bigger, right? You got closer to this one, this got bigger, and then whatever it is, these things, these six force vectors are going to add to zero. So I don't know if this is helpful or not for people, but for me, I think it's a very good way to see this. Okay, let me ask a question about it."},{"start":1729.15,"text":"What if I add a redundant constraint to an LP? So I add a new vector A, A transpose X less than or equal to B, and it's redundant, meaning that visually it means it's over here. It says please stay on that side, but everything already in here is on that side. Everybody got that? So here's my question for you. Does it change the central path?"},{"start":1766.94,"text":"Oh, here's another way to say this. Do redundant inequalities have an effect on the central path? That's my question. What do you think? No. Okay. What's your argument? They're redundant. They're redundant. I like that argument. Okay, so here's this. I like your argument. Okay, it's brief, so that's always a plus. Let's see. Okay. It does have one disadvantage, also brief."},{"start":1802.8,"text":"It's false, right? But it sounds good and, you know, it's good. Okay, so look, here's what would happen. I mean, let's even think about what would happen, right? What if I shoved an inequality here and here and I put a whole bunch over here, right? Each of those is producing a force. Now, they're not inside here to, you know, but it's going to feel this. Suppose I put like 10 constraints right here. Someone tell me, what do you think the central path is going to look like then?"},{"start":1836.11,"text":"But it's going to still sneak up to the solution, right? Because there's all these repulsive forces this way, so it's going to actually do something weird like go along this way, right? But the same story is going to happen. It's going to converge to the solution. Okay, so again, this is just for interpretation so you understand how these things work."}],"speech_gaps":[],"frame":"../frames/v016/011.webp","frame_time":1689.59},{"title":"历史方法与无约束最小化技术","segments":[{"id":101,"text":"Actually, when we get to actually see how they work, no one understands how they work. But if you want to pretend to understand how they work, this is a good picture to do that with. Okay, so this brings us to the barrier method. Actually, before I do this, I'm going to talk about another method before that. And it's historical. By the way, some of the history is that a lot of this was worked out."},{"id":102,"text":"Actually, in the 1960s, it had names like barrier method. Actually, the famous method is something called SUMT, S-U-M-T, is sequential unconstrained minimization technique. It's from the 60s. It was discovered that someone named Deacon in the Soviet Union had worked out actually a completely modern algorithm for all this in 1967. And I guess my friends in Moscow said it was hardly known."},{"id":103,"text":"Or he said it was ignored by people in Moscow. He said, and unknown in the West. That was, anyway, it was actually everything that, you know, two decades later was going to be, was going to make it to the front page of the New York Times was in this 1967 paper by some guy in some Hick province or way off somewhere. I don't know where it was. Okay. So, all right. So then."},{"id":104,"text":"In the U.S., there were people, Fiacco and McCormick, had come up with these things called the sequential unconstraintization technique. So let me explain what it is. Let's go back. Actually, I guess you already know all the story, but it goes like this. Now that we know, you know how to solve that problem up there. It's just Newton's method. You know how to do it. When you do it, actually, not only will you..."},{"id":105,"text":"When you solve that problem, you'll get an approximate solution of the original problem. But with a very strong approximation, you're going to get both a primal and a dual solution, you know, candidates. And the associated gap is going to be exactly M over T, right? So in some sense, you're just done. Like, that's done. You just say, did you want to solve an LP?"},{"id":106,"text":"Then I'd say, to what accuracy do you want to solve it? And someone says, you know, 1e minus 5. And I go, cool. Then what's your m? And now I choose t. And it's an approximation that comes back with a certificate certifying its accuracy. Everybody got this? And that doesn't have a name, but I would call it UMT for Unconstrained Minimization Technique."}],"notes":["本段介绍了凸优化中的一些历史方法，特别是屏障方法（barrier method）和序列无约束最小化技术（SUMT）。这些方法在1960年代被提出，其中SUMT是由Deacon在苏联于1967年提出的，但当时在莫斯科和西方都被忽视。","在1960年代，Fiacco和McCormick在美国提出了类似的无约束最小化技术，称为序列无约束最小化技术（sequential unconstraintization technique）。这种方法通过将约束问题转化为无约束问题来求解。","当使用牛顿法求解无约束问题时，可以得到原始问题和对偶问题的近似解，且解之间的差距为M/T。这种近似解具有很强的准确性，并且可以提供一个证书来证明其精度。","在实际应用中，用户需要指定求解的精度，例如1e-5。然后根据这个精度选择参数t，从而得到一个具有精度保证的近似解。","虽然这些方法在当时没有被广泛认可，但它们为后来的凸优化理论奠定了基础，并且在现代优化算法中仍然具有重要地位。","这些方法的提出和应用展示了凸优化理论的发展历程，以及如何通过历史方法来解决实际问题。"],"formulas":[],"uncertainties":["Hick province"],"diagram":"none","start":1855.91,"end":2015.86,"asr_flags":[],"math_clarifications":["公式中的差距（gap）被定义为M/T，但没有提供M和T的具体定义或上下文，无法确认其数学意义和正确性。因此，该公式需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1855.91,"text":"Actually, when we get to actually see how they work, no one understands how they work. But if you want to pretend to understand how they work, this is a good picture to do that with. Okay, so this brings us to the barrier method. Actually, before I do this, I'm going to talk about another method before that. And it's historical. By the way, some of the history is that a lot of this was worked out."},{"start":1886.64,"text":"Actually, in the 1960s, it had names like barrier method. Actually, the famous method is something called SUMT, S-U-M-T, is sequential unconstrained minimization technique. It's from the 60s. It was discovered that someone named Deacon in the Soviet Union had worked out actually a completely modern algorithm for all this in 1967. And I guess my friends in Moscow said it was hardly known."},{"start":1916.26,"text":"Or he said it was ignored by people in Moscow. He said, and unknown in the West. That was, anyway, it was actually everything that, you know, two decades later was going to be, was going to make it to the front page of the New York Times was in this 1967 paper by some guy in some Hick province or way off somewhere. I don't know where it was. Okay. So, all right. So then."},{"start":1943.22,"text":"In the U.S., there were people, Fiacco and McCormick, had come up with these things called the sequential unconstraintization technique. So let me explain what it is. Let's go back. Actually, I guess you already know all the story, but it goes like this. Now that we know, you know how to solve that problem up there. It's just Newton's method. You know how to do it. When you do it, actually, not only will you..."},{"start":1969.42,"text":"When you solve that problem, you'll get an approximate solution of the original problem. But with a very strong approximation, you're going to get both a primal and a dual solution, you know, candidates. And the associated gap is going to be exactly M over T, right? So in some sense, you're just done. Like, that's done. You just say, did you want to solve an LP?"},{"start":1992.93,"text":"Then I'd say, to what accuracy do you want to solve it? And someone says, you know, 1e minus 5. And I go, cool. Then what's your m? And now I choose t. And it's an approximation that comes back with a certificate certifying its accuracy. Everybody got this? And that doesn't have a name, but I would call it UMT for Unconstrained Minimization Technique."}],"speech_gaps":[],"frame":"../frames/v016/012.webp","frame_time":1867.91},{"title":"对偶可行性与近似方法","segments":[{"id":107,"text":"And all it means is you approximated, I mean, it's basically back to that story originally where we approximated this indicator function here with something smooth, then we applied Newton's method. But the nice part is we got a lot of cool stuff there where we know if you use log barrier and all that kind of stuff, you're actually going to get dual feasible points and you get a gap and you know exactly what the gap is. Everybody see this?"},{"id":108,"text":"Actually, hilariously, that method is perfectly good for tons of practical problems. Just so you know. Of course, it's not generic. You have to choose the t very carefully. And everything you think about it is right, that if you choose t too large, the larger t is, the better approximation you get. But also, the larger the number of Newton steps it's going to take to solve it and all that kind of stuff. Everybody got that? So that's UMT."},{"id":109,"text":"All right, so if you ask for high accuracy or even modest accuracy on something like an LP, then the problem is it's going to take a couple of hundred Newton steps or thousands or something like that. And not only that, probably with numerical errors, it's probably not even going to converge, right? But if you did it with infinite precision, it would, right? Everybody following this? Okay. Okay, so then..."},{"id":110,"text":"Then I have to tell you about something else, which is the background. There's a whole class of problems in applied math and computation called homotopy methods. I don't know if people heard about this before, somewhere. Okay, this is an awesome thing. Everybody should know about this. It's a very, very cool idea. It's this."},{"id":111,"text":"You have a problem you want to solve, which is either like an optimization problem, but typically it's actually just solving a set of nonlinear equations. Here's an example, right? You're doing a spice simulation, and you want to find an equilibrium point of the circuit, which is, you know, got some, the DC, whatever. I'm sorry, I'm speaking dialect now, but that's what you want to do, right? So that's a perfect example, right, of this. But it comes up in tons of other stuff, right? So just, okay. So here's how it works."},{"id":112,"text":"You have your problem, and you introduce a parameter. They usually call it maybe theta or something, but they have different kappa as another train of... Anyway, but here it's T. You introduce a parameter. In fact, in the classical version, you introduce a parameter with the following thing that perturbs or
