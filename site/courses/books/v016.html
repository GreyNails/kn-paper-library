of one. In other words, barrier methods take between 20 and 50 steps, period. And that's just what they do in any dimension. So, and this is, yeah, it's been borne out pretty well. Yeah, so I have a..."},{"latex":"H, A^T, A, 0","symbols":"Hessian矩阵、约束矩阵和零向量组成的线性方程组","explanation":"H, A^T, A, 0 表示求解线性KKT系统时的矩阵形式，符合原文中提到的求解Hessian矩阵、约束矩阵和零向量组成的线性方程组的描述。","evidence":"Oh, by the way, those steps are Newton steps. So what that means is you're solving a linear KKT system, right? So you're solving literally an H, A transpose, A, 0 set of linear equations, right? That's what it is. Now, of course, as the problem gets bigger, that numerical step, that's going to take you more time, obviously, right?"}],"uncertainties":[],"diagram":"none","start":3512.6,"end":3678.95,"asr_flags":[],"math_clarifications":["原文中提到的迭代次数为常数（O(1)）与问题规模无关，符合优化算法中某些方法的特性，如内点法（barrier methods）的迭代次数通常为常数。"],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":3512.6,"text":"of some reasonable value."},{"start":3514.22,"text":"Everybody see this?"},{"start":3515.76,"text":"So, it's very cool."},{"start":3518.84,"text":"Okay, so this is what that looks like."},{"start":3524.44,"text":"I find it pretty spooky, right, that this works. I mean, here's a GP. And again, these are small ones, but nevertheless, that's pretty cool. Here it is. And it takes 20 to whatever. Again, it takes like 30-something iterations, right?"},{"start":3547.18,"text":"Yeah, by the way, something like this would be 25 years ago would just be like utterly unknown. People were still publishing papers on fancy custom methods to solve GPs. So this is maybe 30 years ago. Right. So still pretty cool. But they all these things all just start looking the same. Right. So here's what it looks like when you just take this is actually literally this is the one you're going to do for your homework. You're going to implement this and."},{"start":3577.35,"text":"Here, we have a bunch of values of m, and we are going to solve like 100 different things. What's cool is you look, this is the problem size, right? And this is the number of steps. The first thing you should notice is that it ranges between like 20 and 25, you know, with the absolute maximum being 30. And by the way, if you look at the output when you, you know, when you call the solve method in CVXPy, it's going to call..."},{"start":3604.43,"text":"It's going to call some solver. But if it's something like ECOS or something like that, it will actually report, it'll actually tell you how many iterations it is. And it's typically between 20 and 50, right? So in fact, I don't think it's ever more than 50. But this is like kind of stunning, right? This, right? And this confused a lot of people."},{"start":3626.4,"text":"So, you know, first people said, oh, yeah, you know, it's like, I think it's like the square root. And someone said, I think it grows like the log and whatever. And then finally, what has become clear as an empirical fact is that the growth is O of one. In other words, barrier methods take between 20 and 50 steps, period. And that's just what they do in any dimension. So, and this is, yeah, it's been borne out pretty well. Yeah, so I have a..."},{"start":3655.85,"text":"Oh, by the way, those steps are Newton steps. So what that means is you're solving a linear KKT system, right? So you're solving literally an H, A transpose, A, 0 set of linear equations, right? That's what it is. Now, of course, as the problem gets bigger, that numerical step, that's going to take you more time, obviously, right?"}],"speech_gaps":[],"frame":"../frames/v016/022.webp","frame_time":3524.6},{"title":"迭代次数与计算成本的独立性","segments":[{"id":198,"text":"So I'm not saying that it takes the same amount of time to solve a hundred variable problem as a million variable problem. What I am saying is that the number of iterations are the same. So I have a friend in Edinburgh who decided to solve some LP with a basic barrier method. And I asked him, like, how many variables do you have? And he said, well, I think we have about, I think it was something like two billion variables. And it was like half a billion constraints.","zh":"所以，我并不是说解决一个包含一百个变量的问题和一个包含一千万个变量的问题所需的时间是一样的。我说的是迭代次数是一样的。我有一个朋友在爱丁堡，他决定用基本障碍方法解决一个线性规划问题。我问他，你有多少个变量？他说，我想我们大概有大约两十亿个变量。而且约束条件大概有五十亿个。","start":3679.47,"end":3707.89},{"id":199,"text":"Right. And I was like, well, how do you do that? And he had some gigantic computers, a supercomputer somewhere to do all this. Right. I mean, this is a while ago, so I'm sure now it wouldn't be that big a deal. But anyway, and I was like, wow, that's awesome. Like, so I asked him, how many iterations does it take? He said, it's the same as, you know, for, you know, real smaller dimensions. I was like, what? He goes like 22, 23, always. I was like, oh.","zh":"对的。我当时问，你是怎么做到的？他有一些巨大的计算机，在某个超级计算机上运行所有这些计算。对了，这已经是一段时间以前的事了，所以现在我确信这不会是一个太大的问题。不过，无论如何，我当时觉得，哇，这太棒了。于是我问他，需要多少次迭代？他说，和你在现实中小得多的维度中进行的迭代次数是一样的。我问，什么？他说大概是22、23次，总是这样。我听了之后说，哦。","start":3709.21,"end":3733.51},{"id":200,"text":"So, by the way, I asked him, how much does an iteration cost? And he's like, each iteration, I think, costs something like, you know, 25 minutes, right? And I added to the story that each iteration, when each iteration starts, the lights in Edinburgh dim, right? But that part is not true, of course. But anyway, so that was the story. So this picture continues as far as anybody knows forever.","zh":"顺便问一下，我问他每次迭代的成本是多少？他说，每次迭代大概需要25分钟，对吧？我还补充了一个故事，每次迭代开始时，爱丁堡的灯光会变暗，对吧？当然，这部分是不真实的。不过，无论如何，这就是那个故事。所以这个画面会一直持续下去，至少目前所知如此。","start":3734.21,"end":3759.55},{"id":201,"text":"Right, so this is the number. It's one of these weird, just magic things that practical problems are solved in O of 1. Iterations, but the iterations are going to scale. Actually, you know what? The implication of all this is amazing because it basically says you're going to solve 20 odd Newton steps. A Newton step is minimizing a convex quadratic.","zh":"对了，这就是数字。这是其中一种奇怪的、魔术般的事情，即实际问题可以在O(1)次迭代中解决。但这些迭代次数会随着问题规模而扩展。实际上，你知道吗？所有这些的含义非常惊人，因为它基本上意味着你只需要进行20次左右的牛顿迭代。一次牛顿迭代就是最小化一个凸二次函数。","start":3760.16,"end":3787.04},{"id":202,"text":"subject to equality constraint. It is nothing more than that. It also says, since the number of it is between 20 and 50, like for all problems across all fields and all sizes of problems and all that kind of stuff, that just doesn't change. What it tells you is everything comes down to the linear algebra. So that's where... So when you do well...","zh":"受等式约束。它不过如此而已。它还意味着，由于迭代次数在20到50次之间，对于所有领域、所有规模的问题，这个数字都不会改变。它告诉你的就是一切最终都归结为线性代数。所以，当你做得好时，","start":3788.54,"end":3809.96},{"id":203,"text":"It's not because you have a fancy algorithm, because they're basically perfect now. They're more sophisticated than what I'm showing you, but they're very, very close. So actually, all the advances are in linear algebra. So that's what that's about. OK, so this just shows you how this works.","zh":"并不是因为你有一个花哨的算法，因为它们现在基本上已经是完美的了。它们比我现在展示给你的要更复杂，但它们非常、非常接近。所以实际上，所有的进展都体现在线性代数上。这就是这个话题的内容。好的，所以这仅仅是为了向你展示它是如何运作的。","start":3810.34,"end":3838.43},{"id":204,"text":"uh as i said so i'll tell you a little bit about the history of some of this so um there are","zh":"正如我之前所说的，我会向你稍微讲一点这些内容的历史。嗯，有一些前身是在20世纪60年代出现的，包括一直到开发出类似这种算法的代码","start":3839.51,"end":3847.43},{"id":205,"text":"precursors of this in the 60s including all the way up to developing like codes algorithms ones","zh":"在20世纪60年代就已经出现了与现在极其相似的算法","start":3847.43,"end":3853.07},{"id":206,"text":"extremely similar to this right in the 60s they fell out of fashion or were ignored or were","zh":"与这个非常相似，早在60年代它们就不再流行，或者被忽视，或者被","start":3853.07,"end":3858.71}],"notes":["本段讨论了凸优化中迭代次数与问题规模之间的关系。讲者指出，尽管问题规模可能从数百变量增加到数百万甚至数十亿变量，但迭代次数通常保持在20到50次之间，这表明计算成本主要取决于线性代数操作，而非算法复杂度。","讲者通过一个朋友的例子说明，即使在处理大规模问题时，迭代次数仍然保持稳定，这表明实际应用中，优化算法的效率主要依赖于线性代数的实现，而非算法本身的复杂性。","讲者提到，现代优化算法已经非常成熟，几乎接近完美，因此进一步的改进主要集中在提升线性代数计算的效率上，而不是算法设计本身。","讲者还提到，尽管在60年代已有类似算法的雏形，但这些方法后来被忽视或不再流行，这可能是因为当时计算资源的限制。","讲者强调，凸优化的实际应用中，迭代次数的稳定性是其强大之处，这使得即使在处理大规模问题时，计算成本仍然可控。","讲者最后提到，他将讲述这些方法的历史背景，这表明课程内容将扩展到优化算法的发展历程，而不仅仅是当前的实现细节。"],"formulas":[{"latex":"O(1)","symbols":"大O符号表示时间复杂度","explanation":"保持原公式，O(1)表示常数时间复杂度，符合上下文中的迭代次数为常数的描述。","evidence":"Right, so this is the number. It's one of these weird, just magic things that practical problems are solved in O of 1. Iterations, but the iterations are going to scale. Actually, you know what? The implication of all this is amazing because it basically says you're going to solve 20 odd Newton steps. A Newton step is minimizing a convex quadratic."},{"latex":"20 \\text{ to } 50","symbols":"迭代次数范围","explanation":"保持原公式，表示迭代次数在20到50之间，符合上下文中的描述。","evidence":"subject to equality constraint. It is nothing more than that. It also says, since the number of it is between 20 and 50, like for all problems across all fields and all sizes of problems and all that kind of stuff, that just doesn't change. What it tells you is everything comes down to the linear algebra. So that's where... So when you do well..."}],"uncertainties":["precursors of this in the 60s including all the way up to developing like codes algorithms ones"],"diagram":"none","start":3679.47,"end":3858.71,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复。"],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":3679.47,"text":"So I'm not saying that it takes the same amount of time to solve a hundred variable problem as a million variable problem. What I am saying is that the number of iterations are the same. So I have a friend in Edinburgh who decided to solve some LP with a basic barrier method. And I asked him, like, how many variables do you have? And he said, well, I think we have about, I think it was something like two billion variables. And it was like half a billion constraints."},{"start":3709.21,"text":"Right. And I was like, well, how do you do that? And he had some gigantic computers, a supercomputer somewhere to do all this. Right. I mean, this is a while ago, so I'm sure now it wouldn't be that big a deal. But anyway, and I was like, wow, that's awesome. Like, so I asked him, how many iterations does it take? He said, it's the same as, you know, for, you know, real smaller dimensions. I was like, what? He goes like 22, 23, always. I was like, oh."},{"start":3734.21,"text":"So, by the way, I asked him, how much does an iteration cost? And he's like, each iteration, I think, costs something like, you know, 25 minutes, right? And I added to the story that each iteration, when each iteration starts, the lights in Edinburgh dim, right? But that part is not true, of course. But anyway, so that was the story. So this picture continues as far as anybody knows forever."},{"start":3760.16,"text":"Right, so this is the number. It's one of these weird, just magic things that practical problems are solved in O of 1. Iterations, but the iterations are going to scale. Actually, you know what? The implication of all this is amazing because it basically says you're going to solve 20 odd Newton steps. A Newton step is minimizing a convex quadratic."},{"start":3788.54,"text":"subject to equality constraint. It is nothing more than that. It also says, since the number of it is between 20 and 50, like for all problems across all fields and all sizes of problems and all that kind of stuff, that just doesn't change. What it tells you is everything comes down to the linear algebra. So that's where... So when you do well..."},{"start":3810.34,"text":"It's not because you have a fancy algorithm, because they're basically perfect now. They're more sophisticated than what I'm showing you, but they're very, very close. So actually, all the advances are in linear algebra. So that's what that's about. OK, so this just shows you how this works. OK, so what we're going to talk about now. So anyway, I think this is just sort of like amazing stuff."},{"start":3839.51,"text":"uh as i said so i'll tell you a little bit about the history of some of this so um there are"},{"start":3847.43,"text":"precursors of this in the 60s including all the way up to developing like codes algorithms ones"},{"start":3853.07,"text":"extremely similar to this right in the 60s they fell out of fashion or were ignored or were"}],"speech_gaps":[],"frame":"../frames/v016/023.webp","frame_time":3691.47},{"title":"凸优化课程中关于历史背景与可行性方法的讨论","segments":[{"id":207,"text":"unknown right like for example deacon's work right just completely unknown right so um what","zh":"未知的右方，比如像Deacon的工作，完全未知，对吧，所以嗯，那是什么","start":3858.71,"end":3865.95},{"id":208,"text":"What happened was, in the late 80s, early 90s,","zh":"发生的事情是，在80年代末、90年代初，","start":3865.95,"end":3868.99},{"id":209,"text":"it was rediscovered.","zh":"它被重新发现了。","start":3869.01,"end":3870.01},{"id":210,"text":"Of course, when it was rediscovered,","zh":"当然，当它被重新发现的时候，","start":3870.01,"end":3871.37},{"id":211,"text":"it was much more complicated, obviously.","zh":"显然，它要复杂得多。","start":3871.37,"end":3873.95},{"id":212,"text":"And so anyway, so people were writing papers.","zh":"因此，无论如何，人们开始写论文。","start":3874.55,"end":3877.61},{"id":213,"text":"And it was just getting very weird.","zh":"而且情况变得越来越奇怪。","start":3877.75,"end":3879.79},{"id":214,"text":"And it actually ended up on the front cover of The New York","zh":"它实际上登上了《纽约客》的封面。","start":3879.91,"end":3882.39},{"id":215,"text":"Times, because it was actually, this","zh":"Times，因为实际上，这个","start":3882.39,"end":3884.63},{"id":216,"text":"was the method used to show that linear programs can","zh":"是用于证明线性规划问题可以","start":3884.63,"end":3887.37},{"id":217,"text":"be solved in polynomial time, which had no,","zh":"在多项式时间内求解的方法，这没有任何，","start":3887.37,"end":3891.43},{"id":218,"text":"it had precisely zero practical consequences,","zh":"它实际上没有任何实际应用价值，","start":3891.67,"end":3895.23},{"id":219,"text":"because at that point, people who actually solved LPs","zh":"因为在那时，真正解决线性规划问题的人","start":3895.23,"end":3898.89},{"id":220,"text":"had been solving them for 40 years at that point","zh":"已经用单纯形法解决这些问题40年了，","start":3898.89,"end":3901.93},{"id":221,"text":"using the simplex method, which worked unbelievably well, thank you.","zh":"单纯形法的效果令人难以置信，谢谢。","start":3902.63,"end":3906.45},{"id":222,"text":"So it had no practical, but it was very funny","zh":"因此它没有实际应用价值，但非常有趣","start":3906.57,"end":3909.07},{"id":223,"text":"because it was actually on the front page of the New York Times","zh":"因为它实际上登上了《纽约时报》的头版","start":3909.07,"end":3910.71},{"id":224,"text":"and it hinted, it said that vast numbers of scheduling problems","zh":"并且它暗示了，它提到大量的调度问题","start":3910.71,"end":3915.35},{"id":225,"text":"and allocation problems can now be solved.","zh":"和分配问题现在都可以被解决了。","start":3915.35,"end":3917.67},{"id":226,"text":"And it was like just completely wrong.","zh":"而且它就像是完全错误的。","start":3917.79,"end":3919.33},{"id":227,"text":"Anyway, but it's kind of cool because to see, I don't know,","zh":"总之，但这是很酷的，因为能看到，我不知道，","start":3919.47,"end":3924.63},{"id":228,"text":"people I know have, you know, occurring on the front cover of the New York Times. Anyway,","zh":"我认识的人竟然出现在《纽约时报》的封面上。总之，","start":3924.63,"end":3928.45},{"id":229,"text":"that's it. So, yeah, by the way, later, some 10 years later, people went back, found the history,","zh":"就是这样。所以，顺便说一句，后来大约十年后，人们回去，发现了历史，","start":3928.49,"end":3934.23},{"id":230,"text":"pulled up these things from the 60s. Someone even took some crazy Fortran code from the 1960s.","zh":"从60年代拉出了这些资料。有人甚至从1960年代拿出了些疯狂的Fortran代码。","start":3934.99,"end":3941.55},{"id":231,"text":"untouched, which was on cards, read it in, updated it to whatever it was at the time, to F90 or something like that, updated it, and it was hilariously competitive with the best solvers at that time. By the way, it tells you something about academics and things like that, which is there are fashions, and there's all sorts of stuff that works perfectly well, but people just ignore it and move on.","zh":"未被修改的版本，它是在卡片上写的，读入后根据当时的情况更新为F90或其他类似版本，更新后，它与当时最好的求解器竞争得非常激烈。顺便说一句，这说明了学术界的一些情况，即存在一些时尚潮流，有很多东西可以完美地工作，但人们却忽视它们并继续前进。","start":3942.67,"end":3967.71},{"id":232,"text":"out of snobbery or ignorance or something anyway. I thought that was very embarrassing for the field. That's it. What we're going to talk about now is feasibility in Phase 1 methods.","zh":"出于偏见、无知或其他原因。我认为这对该领域来说是非常尴尬的。好了，我们现在要讨论的是Phase 1方法中的可行性问题。","start":3968.15,"end":3988.94},{"id":233,"text":"required actually a strictly feasible point, right? What I will say is that the methods people actually use don't, they use something that does phase one and phase two all together and all that kind of stuff.","zh":"实际上需要一个严格可行的点，对吧？我想说的是，人们实际使用的算法并不这样做，他们使用的是将Phase 1和Phase 2一起处理的算法，以及类似的东西。","start":3989.76,"end":4002.46},{"id":234,"text":"By the way, if we had one more week of this class, you would actually implement that. Because it would be about, I don't know, five more lines than what you're going to write. And that one would actually scale, handle feasibility, unboundness, everything just all at once. But nevertheless, this is actually very good to know about because it's got a lot of uses just by itself. So here it is.","zh":"顺便说一句，如果我们再上一周的课，你们实际上会实现这个。因为这只需要大约五行代码，比你们现在要写的代码多不了多少。而且这个方法实际上可以扩展，处理可行性、无界性，所有问题一并解决。但无论如何，了解这一点是非常有用的，因为它本身就有许多应用。所以这里它就是。","start":4003.82,"end":4023.88}],"notes":["本段讨论了凸优化方法在20世纪80年代和90年代被重新发现的历史背景，强调了当时虽然理论上有突破，但实际应用价值有限。讲者提到线性规划（LP）的多项式时间算法被《纽约时报》报道，但当时人们仍然使用单纯形法，这种方法在实践中非常有效。","讲者指出，尽管理论上有进展，但学术界有时会忽视已有有效的方法，转而追求新的趋势。这种现象在学术界中是常见的，反映了学术时尚和对旧方法的忽视。","讲者提到，后来人们重新审视了60年代的代码，并将其更新到现代语言，结果发现这些旧方法在当时仍然具有竞争力，这说明了某些方法虽然被忽视，但依然有效。","本段最后转向了课程内容，即关于可行性（feasibility）在Phase 1方法中的讨论。讲者指出，Phase 1方法需要一个严格可行的点，但实际中人们使用的是将Phase 1和Phase 2结合的方法。","讲者提到，如果课程时间允许，学生可以实现这种结合Phase 1和Phase 2的方法，因为它能够处理可行性、无界性等问题，并且在实践中具有实用性。","讲者强调，虽然这种方法在理论上重要，但实际应用中仍然需要考虑其可扩展性和效率，这反映了理论与实践之间的平衡。"],"formulas":[],"uncertainties":["deacon's work","Fortran code from the 1960s"],"diagram":"none","start":3858.71,"end":4023.88,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":3858.71,"text":"unknown right like for example deacon's work right just completely unknown right so um what"},{"start":3865.95,"text":"What happened was, in the late 80s, early 90s,"},{"start":3869.01,"text":"it was rediscovered."},{"start":3870.01,"text":"Of course, when it was rediscovered,"},{"start":3871.37,"text":"it was much more complicated, obviously."},{"start":3874.55,"text":"And so anyway, so people were writing papers."},{"start":3877.75,"text":"And it was just getting very weird."},{"start":3879.91,"text":"And it actually ended up on the front cover of The New York"},{"start":3882.39,"text":"Times, because it was actually, this"},{"start":3884.63,"text":"was the method used to show that linear programs can"},{"start":3887.37,"text":"be solved in polynomial time, which had no,"},{"start":3891.67,"text":"it had precisely zero practical consequences,"},{"start":3895.23,"text":"because at that point, people who actually solved LPs"},{"start":3898.89,"text":"had been solving them for 40 years at that point"},{"start":3902.63,"text":"using the simplex method, which worked unbelievably well, thank you."},{"start":3906.57,"text":"So it had no practical, but it was very funny"},{"start":3909.07,"text":"because it was actually on the front page of the New York Times"},{"start":3910.71,"text":"and it hinted, it said that vast numbers of scheduling problems"},{"start":3915.35,"text":"and allocation problems can now be solved."},{"start":3917.79,"text":"And it was like just completely wrong."},{"start":3919.47,"text":"Anyway, but it's kind of cool because to see, I don't know,"},{"start":3924.63,"text":"people I know have, you know, occurring on the front cover of the New York Times. Anyway,"},{"start":3928.49,"text":"that's it. So, yeah, by the way, later, some 10 years later, people went back, found the history,"},{"start":3934.99,"text":"pulled up these things from the 60s. Someone even took some crazy Fortran code from the 1960s."},{"start":3942.67,"text":"untouched, which was on cards, read it in, updated it to whatever it was at the time, to F90 or something like that, updated it, and it was hilariously competitive with the best solvers at that time. By the way, it tells you something about academics and things like that, which is there are fashions, and there's all sorts of stuff that works perfectly well, but people just ignore it and move on."},{"start":3968.15,"text":"out of snobbery or ignorance or something anyway. I thought that was very embarrassing for the field. That's it. What we're going to talk about now is feasibility in Phase 1 methods."},{"start":3989.76,"text":"required actually a strictly feasible point, right? What I will say is that the methods people actually use don't, they use something that does phase one and phase two all together and all that kind of stuff."},{"start":4003.82,"text":"By the way, if we had one more week of this class, you would actually implement that. Because it would be about, I don't know, five more lines than what you're going to write. And that one would actually scale, handle feasibility, unboundness, everything just all at once. But nevertheless, this is actually very good to know about because it's got a lot of uses just by itself. So here it is."}],"speech_gaps":[],"frame":"../frames/v016/024.webp","frame_time":3870.71},{"title":"可行性问题与相位一相位二方法","segments":[{"id":235,"text":"So the feasibility problem is, you know, find an X that satisfies a bunch of inequalities and maybe some linear equality constraints, right? And so the classical method, they call it a phase one, phase two method. So phase one, find a feasible point. Phase two, you know, run an algorithm to find an optimal point. And this is kind of old school, but it's not, you might someday encounter.","zh":"所以可行性问题是，你知道的，找到一个满足一系列不等式和可能的一些线性等式约束的X，对吧？因此，经典的算法，他们称之为相位一和相位二方法。相位一，找到一个可行点。相位二，你知道的，运行一个算法来找到一个最优解。这种方法有点老派，但你可能会有一天遇到。","start":4024.67,"end":4051.35},{"id":236,"text":"people who were trained in old school stuff. And then if you drop, I mean, if you say it around, a lot of people today, if you say phase one, phase two, they're like, what are you talking about? But it's possible you'll meet some of these people sometime. And the ideas are very interesting.","zh":"那些受过老派方法训练的人。然后如果你说，比如说，相位一、相位二，很多人今天会问你在说什么。但你可能会在某一天遇到一些这些人。这些想法非常有趣。","start":4053.17,"end":4077.65},{"id":237,"text":"Okay, so here's what you do. What we do is we put here a slack variable S. Right? And we want to minimize over x and s this s. Now what we do is we stop, we terminate this. The minute we produce something with s negative, we quit. Because at that point, what you've done is you've computed a strictly feasible point and then you jump back to the barrier method. Or actually, you can apply the barrier method to this. Because here I know a feasible point. It's like you pick your favorite point x that satisfies ax equals b. Okay, it has to be in the domain of the FIs, but whatever.","zh":"好的，那么你该怎么做呢？我们在这里引入一个松弛变量S。对吧？然后我们想要在x和s上最小化这个s。现在我们停下来，终止这个过程。只要我们得到一个s为负数的结果，我们就停止。因为在那时，你已经计算出一个严格可行点，并跳回到障碍方法。或者实际上，你可以将障碍方法应用到这个问题上。因为这里我知道一个可行点。你选择一个你喜欢的点x，满足ax等于b。好的，它必须在FIs的定义域内，但不管怎样。","start":4078.33,"end":4108.76},{"id":238,"text":"What I do is I evaluate fi of x, all of them. I take the max of that, those numbers, plus one, and that's my initial s. It's feasible, right? And so this would just work. Okay, so that's that. But let me ask you a couple of questions. So let me ask what happens if these inequalities are not feasible.","zh":"我所做的就是评估x的fi值，所有的值。我取这些数值的最大值，再加上一，这就是我的初始s。它是可行的，对吧？所以这会正常工作。好的，所以这就是这部分内容。但让我问你们几个问题。让我问，如果这些不等式不可行会发生什么？","start":4109.99,"end":4134.88},{"id":239,"text":"So let me ask you a couple of questions. So let me ask what happens if these inequalities are not feasible.","zh":"让我问你们几个问题。让我问，如果这些不等式不可行会发生什么？","start":4136.29,"end":4140.77},{"id":240,"text":"then what's going to happen is when you solve this problem, you're going to get S equals like,","zh":"那么当你解决这个问题时，你会得到S等于，比如说，","start":4140.83,"end":4145.97},{"id":241,"text":"you know, 1.3. And that has a beautiful interpretation. It says, it basically says","zh":"你知道的，1.3。这有一个美妙的解释。它基本上说明","start":4145.97,"end":4153.35},{"id":242,"text":"your inequalities are not mutually feasible because they're all Fi less than zero. But if","zh":"你的不等式是不可行的，因为它们都是Fi小于零。但如果","start":4153.35,"end":4159.49},{"id":243,"text":"you relax those and everyone looks like Fi of X is less than 1.3, I got a point for you. Everybody","zh":"你放松那些约束，每个人看起来都像是Fi of X小于1.3，我给你加分。大家","start":4159.49,"end":4164.07},{"id":244,"text":"following this? And so, so you're kind of, basically you can interpret this, this basic","zh":"跟得上吗？因此，你基本上可以将这种基本的","start":4164.07,"end":4169.79},{"id":245,"text":"phase one method is minimizing the maximum constraint violation, right? And I'm going","zh":"相位一方法解释为最小化最大约束违反程度，对吧？我要","start":4169.79,"end":4176.55},{"id":246,"text":"to ask you a question. Suppose a set of inequalities is not feasible. And here's what I want to know.","zh":"问你们一个问题。假设一组不等式不可行。这里我想知道的是。","start":4176.83,"end":4182.95},{"id":247,"text":"I run this. S star turns out to be 1.3, let's say. I want you to tell me about what do you","zh":"我运行这个方法，S星结果是1.3，比如说。我想知道你们认为Fi会是什么样子？这只是个猜测，对吧？我的意思是，你们想象一下？","start":4182.95,"end":4193.25},{"id":248,"text":"think the FIs look like? This is just a guess, right? I mean, what do you imagine?","zh":"这完全正确","start":4198.11,"end":4199.31},{"id":249,"text":"that's exactly right","zh":"基本上","start":4199.91,"end":4200.39},{"id":250,"text":"basically","zh":"基本上","start":4201.73,"end":4203.73}],"notes":["本段讲解了凸优化中的可行性问题，即寻找满足一系列不等式和可能的线性等式约束的点。传统方法被称为相位一和相位二方法，其中相位一用于找到可行点，相位二用于寻找最优解。这种方法虽然较为传统，但在某些情况下仍然有用。","讲者提到，虽然现代人可能对相位一和相位二方法不熟悉，但仍然有可能在某些场合遇到这些方法。这种方法的核心思想是通过引入松弛变量来处理不等式约束。","在相位一方法中，讲者介绍了如何通过最小化最大约束违反量来找到可行点。具体来说，通过引入松弛变量S，并计算所有约束函数的值，取最大值并加一作为初始的S值。","当不等式不可行时，通过求解问题得到的S值（如1.3）表示约束的违反程度。这表明约束条件需要被放松，使得所有约束函数的值小于某个阈值（如1.3）。","讲者进一步询问，如果约束不可行，S值为1.3时，约束函数Fi可能的形状是什么。这引导学生思考约束函数的性质和如何通过调整约束来找到可行解。","讲者指出，相位一方法的核心思想是通过最小化最大约束违反量来找到可行点，这为后续的优化方法（如障碍方法）提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4024.67,"end":4203.73,"asr_flags":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":4024.67,"text":"So the feasibility problem is, you know, find an X that satisfies a bunch of inequalities and maybe some linear equality constraints, right? And so the classical method, they call it a phase one, phase two method. So phase one, find a feasible point. Phase two, you know, run an algorithm to find an optimal point. And this is kind of old school, but it's not, you might someday encounter."},{"start":4053.17,"text":"people who were trained in old school stuff. And then if you drop, I mean, if you say it around, a lot of people today, if you say phase one, phase two, they're like, what are you talking about? But it's possible you'll meet some of these people sometime. And the ideas are very interesting. Okay, so here's what you do. What we do is we put here a slack variable S."},{"start":4078.33,"text":"Right? And we want to minimize over x and s this s. Now what we do is we stop, we terminate this. The minute we produce something with s negative, we quit. Because at that point, what you've done is you've computed a strictly feasible point and then you jump back to the barrier method. Or actually, you can apply the barrier method to this. Because here I know a feasible point. It's like you pick your favorite point x that satisfies ax equals b. Okay, it has to be in the domain of the FIs, but whatever."},{"start":4109.99,"text":"What I do is I evaluate fi of x, all of them. I take the max of that, those numbers, plus one, and that's my initial s. It's feasible, right? And so this would just work. Okay, so that's that. But let me ask you a couple of questions. So let me ask what happens if these inequalities are not feasible."},{"start":4136.29,"text":"then what's going to happen is when you solve this problem, you're going to get S equals like,"},{"start":4140.83,"text":"you know, 1.3. And that has a beautiful interpretation. It says, it basically says"},{"start":4145.97,"text":"your inequalities are not mutually feasible because they're all Fi less than zero. But if"},{"start":4153.35,"text":"you relax those and everyone looks like Fi of X is less than 1.3, I got a point for you. Everybody"},{"start":4159.49,"text":"following this? And so, so you're kind of, basically you can interpret this, this basic"},{"start":4164.07,"text":"phase one method is minimizing the maximum constraint violation, right? And I'm going"},{"start":4169.79,"text":"to ask you a question. Suppose a set of inequalities is not feasible. And here's what I want to know."},{"start":4176.83,"text":"I run this. S star turns out to be 1.3, let's say. I want you to tell me about what do you"},{"start":4182.95,"text":"think the FIs look like? This is just a guess, right? I mean, what do you imagine?"},{"start":4198.11,"text":"that's exactly right"},{"start":4199.91,"text":"basically"},{"start":4201.73,"text":"if you're anthropomorphizing this"}],"speech_gaps":[],"frame":"../frames/v016/025.webp","frame_time":4036.67},{"title":"约束违反的最小化方法","segments":[{"id":251,"text":"you have all these functions","zh":"你有所有这些函数","start":4203.73,"end":4205.97},{"id":252,"text":"here, you want them all to be","zh":"在这里，你希望它们全部都","start":4205.97,"end":4207.91},{"id":253,"text":"less than zero, so what you do is","zh":"小于零，所以你所做的就是","start":4207.91,"end":4209.87},{"id":254,"text":"you just put a big old flat thing on top of it","zh":"你只是在上面放一个大而平坦的东西","start":4209.87,"end":4211.85},{"id":255,"text":"that's s, and you just push down","zh":"这就是 s，然后你只是向下压","start":4211.85,"end":4213.83},{"id":256,"text":"you push down","zh":"你向下压","start":4213.83,"end":4215.03},{"id":257,"text":"until it locks, and it's pushing back","zh":"直到它锁定，而它正在反向推回","start":4215.57,"end":4218.01},{"id":258,"text":"harder than you can push","zh":"比你能压的还要用力","start":4218.01,"end":4219.19},{"id":259,"text":"in fact with infinite things, so you can actually make a mechanical","zh":"事实上，对于无限多的事物，你实际上可以做一个机械的解释","start":4219.19,"end":4222.09},{"id":260,"text":"interpretation if you wanted","zh":"如果你想的话","start":4222.09,"end":4223.41},{"id":261,"text":"right? Everybody, everybody see this? Now, when, when you stop, when, when this thing locks and","zh":"对吧？大家，大家都能看到这一点吗？现在，当你停止的时候，当这个东西锁住，","start":4223.41,"end":4228.53},{"id":262,"text":"you can't push it down any farther, there's going to be at least several, and in general,","zh":"你无法再把它往下推了，这时候至少会违反几个约束，通常情况下，","start":4228.53,"end":4233.25},{"id":263,"text":"a whole bunch of constraints violated by 1.3. Everybody got that? So, and that, you know,","zh":"有一大堆约束被违反了1.3。大家明白了吗？所以，还有，你知道的，","start":4233.27,"end":4238.99},{"id":264,"text":"there are applications where that might be of interest, right? You'd say, I have a whole bunch","zh":"有一些应用中这可能很有意思，对吧？你会说，我有一大堆约束，你会说，好吧，我有好消息和坏消息。坏消息是，没有任何一个x能满足所有的约束，","start":4238.99,"end":4243.85},{"id":265,"text":"of constraints and you'd say, well, I got good news and bad news. Bad news is no one, there is","zh":"没有任何设计能满足所有的规格。","start":4243.85,"end":4250.07},{"id":266,"text":"no x that satisfies all your constraints. There's no design that meets all your specs.","zh":"不存在满足所有约束的x。没有设计能符合所有规格。","start":4250.07,"end":4253.17},{"id":267,"text":"Good news is if I only relax all of them by like, you know, 0.3, then it's feasible. Everybody see this? Right? Okay, so that's the idea there. So if you do, then we go to the next one, which is a sum of infeasibilities method. And so the previous one you should think of as kind of roughly analogous to an L-infinity norm. We were minimizing the maximum constraint violation.","zh":"好消息是，如果我将所有约束松弛大约0.3，那么它就是可行的。大家明白这一点吗？对吧？好的，这就是这个想法。所以如果你这样做，那么我们接下来要处理的是一个约束违反量的总和方法。之前的那个方法你应该把它看作类似于L-无穷范数。我们是在最小化最大约束违反量。","start":4254.06,"end":4284.16},{"id":268,"text":"Now I'm going to minimize the sum of the constraint violation. The constraint violation is actually defined as this. It's fi of x sub plus, right? If that's zero, it means you satisfy that thing. Otherwise, this is the amount by which you have violated the constraint, right? And so what this says is, what we originally did was we did this. We minimized.","zh":"现在我要最小化约束违反量的总和。约束违反量实际上是这样定义的。它是fi(x)的正值，对吧？如果这个值为零，意味着你满足了这个约束。否则，这就是你违反约束的程度，对吧？因此，这说明我们最初所做的，是我们最小化了这些值的最大值。","start":4285.8,"end":4313.7},{"id":269,"text":"the max over i of these. I mean, this didn't matter, right? Now we're going to do the following. We're going to do the sum. And before we even do this, I want to know, I want some guesses about various things. Oh, these are non-negative numbers. A sum of non-negative numbers is basically the L1 norm, right? I mean, this is obvious, right?","zh":"我指的是这些值的最大值。我的意思是，这并不重要，对吧？现在我们要做的是总和。在我们甚至开始之前，我想知道一些关于各种事情的猜测。哦，这些是非负数。非负数的总和基本上就是L1范数，对吧？我的意思是，这很明显，对吧？","start":4314.1,"end":4342.2},{"id":270,"text":"and when i minimize an l1 norm what typically happens","zh":"当我最小化一个L1范数时，通常会发生什么","start":4343.7,"end":4346.74},{"id":271,"text":"you're going to get sparsity right and so this actually starts getting super interesting right","zh":"你会得到稀疏性，对吧？因此，这实际上开始变得非常有趣了","start":4351.44,"end":4356.84},{"id":272,"text":"because what it is is you say i'm trying to design this you know this thing and you gave me 50 specs","zh":"因为这实际上是说，我正在设计这个东西，你知道，这个东西，你给了我50个规格","start":4356.84,"end":4362.12},{"id":273,"text":"and you go bad news can't be done can't it's not achievable and i can prove it by the way","zh":"然后你就会说坏消息，做不到，不能实现，对吧？而且我可以用一种方式来证明","start":4362.66,"end":4367.16},{"id":274,"text":"right because you can produce a certificate or a theorem of the alternatives a certificate showing","zh":"对，因为你可以提供一个证书或一个替代定理的证明，一个证书来展示","start":4367.16,"end":4371.44},{"id":275,"text":"showing it. And you'd say, and they'd say, yeah, but I got to do, we got to do something. We got","zh":"展示它。你可能会说，他们会说，是的，但我们必须做点什么。我们必须开发这个产品。他会说，这没问题。我做了以下事情。我确实找到了，我确实找到了","start":4371.44,"end":4375.9},{"id":276,"text":"to build this product. And he'd say, that's fine. Here's what I did. I did find, I did find","zh":"我确实找到了","start":4375.9,"end":4381.9}],"notes":["本段讲解了约束违反的最小化方法，包括最大约束违反（L-infinity范数）和总约束违反（L1范数）两种方法。最大约束违反方法类似于机械系统中通过施加力直到系统锁定，而总约束违反方法则通过求和来最小化所有约束的违反程度。"],"formulas":[{"latex":"f_i(x^+)","symbols":"f_i(x^+) 表示第i个约束的违反程度","explanation":"符号f_i(x^+)表示第i个约束的违反程度，符合数学表达习惯。","evidence":"Now I'm going to minimize the sum of the constraint violation. The constraint violation is actually defined as this. It's fi of x sub plus, right? If that's zero, it means you satisfy that thing. Otherwise, this is the amount by which you have violated the constraint, right? And so what this says is, what we originally did was we did this. We minimized."},{"latex":"min_{x} \\text{max}_i f_i(x^+)","symbols":"min_{x} \text{max}_i f_i(x^+) 表示最小化最大约束违反","explanation":"公式min_{x} \text{max}_i f_i(x^+)表示最小化最大约束违反，符合数学表达习惯。","evidence":"Good news is if I only relax all of them by like, you know, 0.3, then it's feasible. Everybody see this? Right? Okay, so that's the idea there. So if you do, then we go to the next one, which is a sum of infeasibilities method. And so the previous one you should think of as kind of roughly analogous to an L-infinity norm. We were minimizing the maximum constraint violation."},{"latex":"min_{x} \\text{sum}_i f_i(x^+)","symbols":"min_{x} \text{sum}_i f_i(x^+) 表示最小化总约束违反","explanation":"公式min_{x} \text{sum}_i f_i(x^+)表示最小化总约束违反，符合数学表达习惯。","evidence":"Now I'm going to minimize the sum of the constraint violation. The constraint violation is actually defined as this. It's fi of x sub plus, right? If that's zero, it means you satisfy that thing. Otherwise, this is the amount by which you have violated the constraint, right? And so what this says is, what we originally did was we did this. We minimized."}],"uncertainties":["l1 norm"],"diagram":"none","start":4203.73,"end":4381.9,"asr_flags":[],"math_clarifications":["所有公式均符合数学表达习惯，未发现明显错误。"],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":4203.73,"text":"you have all these functions"},{"start":4205.97,"text":"here, you want them all to be"},{"start":4207.91,"text":"less than zero, so what you do is"},{"start":4209.87,"text":"you just put a big old flat thing on top of it"},{"start":4211.85,"text":"that's s, and you just push down"},{"start":4213.83,"text":"you push down"},{"start":4215.57,"text":"until it locks, and it's pushing back"},{"start":4218.01,"text":"harder than you can push"},{"start":4219.19,"text":"in fact with infinite things, so you can actually make a mechanical"},{"start":4222.09,"text":"interpretation if you wanted"},{"start":4223.41,"text":"right? Everybody, everybody see this? Now, when, when you stop, when, when this thing locks and"},{"start":4228.53,"text":"you can't push it down any farther, there's going to be at least several, and in general,"},{"start":4233.27,"text":"a whole bunch of constraints violated by 1.3. Everybody got that? So, and that, you know,"},{"start":4238.99,"text":"there are applications where that might be of interest, right? You'd say, I have a whole bunch"},{"start":4243.85,"text":"of constraints and you'd say, well, I got good news and bad news. Bad news is no one, there is"},{"start":4250.07,"text":"no x that satisfies all your constraints. There's no design that meets all your specs."},{"start":4254.06,"text":"Good news is if I only relax all of them by like, you know, 0.3, then it's feasible. Everybody see this? Right? Okay, so that's the idea there. So if you do, then we go to the next one, which is a sum of infeasibilities method. And so the previous one you should think of as kind of roughly analogous to an L-infinity norm. We were minimizing the maximum constraint violation."},{"start":4285.8,"text":"Now I'm going to minimize the sum of the constraint violation. The constraint violation is actually defined as this. It's fi of x sub plus, right? If that's zero, it means you satisfy that thing. Otherwise, this is the amount by which you have violated the constraint, right? And so what this says is, what we originally did was we did this. We minimized."},{"start":4314.1,"text":"the max over i of these. I mean, this didn't matter, right? Now we're going to do the following. We're going to do the sum. And before we even do this, I want to know, I want some guesses about various things. Oh, these are non-negative numbers. A sum of non-negative numbers is basically the L1 norm, right? I mean, this is obvious, right?"},{"start":4343.7,"text":"and when i minimize an l1 norm what typically happens"},{"start":4351.44,"text":"you're going to get sparsity right and so this actually starts getting super interesting right"},{"start":4356.84,"text":"because what it is is you say i'm trying to design this you know this thing and you gave me 50 specs"},{"start":4362.66,"text":"and you go bad news can't be done can't it's not achievable and i can prove it by the way"},{"start":4367.16,"text":"right because you can produce a certificate or a theorem of the alternatives a certificate showing"},{"start":4371.44,"text":"showing it. And you'd say, and they'd say, yeah, but I got to do, we got to do something. We got"},{"start":4375.9,"text":"to build this product. And he'd say, that's fine. Here's what I did. I did find, I did find"}],"speech_gaps":[],"frame":"../frames/v016/026.webp","frame_time":4215.73},{"title":"约束松弛与可行性分析","segments":[{"id":277,"text":"something that satisfies 47 of your 50 constraints. Everybody got that? So, and that, that's what you","zh":"某种满足你50个约束中的47个的情况。大家明白了吗？所以，这就是你们在这里会看到的，这真的很酷。","start":4381.9,"end":4388.96},{"id":278,"text":"would see here, which is really cool. And here's a, here's a picture. We can, we can take a look","zh":"这里有一张图。我们可以看看这个。哦，这里有一个例子。这是，这是，这是你的约束中的边界。","start":4388.96,"end":4393.5},{"id":279,"text":"at this. Oh, here's an example. This is, this is, this is the, this is actually the margin","zh":"你希望把这个推高到零以上。这个失败了。它是不可行的。你就在那里停下来。","start":4393.5,"end":4399.58},{"id":280,"text":"in your constraint. So you want to push this to be above zero. This failed. It's infeasible. You","zh":"正如我们猜测的那样，很多点都排列在这个最差的点上，这个点是-0.2或者我不知道，不管是什么，0.2，对吧？","start":4399.58,"end":4405.4},{"id":281,"text":"stop there. And just as we guessed, a whole bunch of them are lined up at this worst point, which","zh":"好吧，这就是当你进行不可行性的总和时会发生的情况。这真的很酷。它说的是，你知道的，我并不","start":4405.4,"end":4409.92},{"id":282,"text":"is minus 0.2 or I don't know, whatever it is, 0.2, right? Okay. That's the, this is what happens","zh":"是负0.2，或者我不知道，不管它是多少，就是0.2，对吧？好的。这就是会发生的情况","start":4409.92,"end":4415.76},{"id":283,"text":"when you do a sum of infeasibilities. And it's really cool. What it says is, you know, I don't","zh":"所以你有55个FIs是紧的。","start":4415.76,"end":4421.46},{"id":284,"text":"So 55 of your FIs are tight.","zh":"所以你的55个FIs是紧的。","start":4421.46,"end":4424.64},{"id":285,"text":"Actually, these are all ones that are just slack, right?","zh":"实际上，这些都是仅仅松弛的约束，对吧？","start":4425.82,"end":4431.24},{"id":286,"text":"Whatever Fi of X is actually negative for these.","zh":"无论Fi(X)实际上对于这些约束来说都是负的。","start":4432.28,"end":4434.68},{"id":287,"text":"And then you have a handful here which you can't satisfy, right?","zh":"然后你有一些约束是无法满足的，对吧？","start":4434.84,"end":4438.88},{"id":288,"text":"And so, again, this is just our old friend, the L1 sparsifier here.","zh":"因此，这又回到了我们熟悉的L1稀疏化方法。","start":4438.94,"end":4443.9},{"id":289,"text":"It's kind of cool, right, this thing?","zh":"这东西有点酷，对吧？","start":4444.12,"end":4445.94},{"id":290,"text":"And these are also already quite useful in various applications that I've seen.","zh":"这些在各种应用中也已经相当有用。","start":4445.94,"end":4453.42},{"id":291,"text":"Make sense? So here's an example. So you have just a family of linear inequality. So it's a polyhedron. But I have a delta, a gamma, sorry, a parameter gamma. And it's chosen so that when gamma equals zero, the polyhedron collapses and has zero volume. When gamma is negative,","zh":"明白吗？举个例子。你有一个线性不等式族，所以这是一个多面体。但我有一个参数gamma，当gamma等于零时，这个多面体坍缩并体积为零。当gamma为负数，","start":4455.15,"end":4484.51},{"id":292,"text":"or less than or equal to zero, well, when it's negative, it's infeasible, and when it's positive, it's feasible, and you're just scaling the right-hand side, so the polyhedron is just growing, right? And now what we can do is we can use the basic phase one and stuff like that, and look at the number of steps it takes to either find a point, right, in the first case, so here's what it looks like. It's actually super interesting.","zh":"或者小于等于零时，当它为负数时，问题不可行；当它为正数时，问题可行，你只是在缩放右边的常数项，因此多面体只是在扩大，对吧？现在我们可以使用基本的相位一方法以及类似的方法，观察找到一个点所需的步骤数量，对吧？在第一种情况下，这就是它的样子。实际上，这非常有趣。","start":4485.93,"end":4512.48},{"id":293,"text":"So it looks like it takes like 40 steps unless you're right at the boundary of between feasible and infeasible. And that's the only, in fact, you have to adjust the data very carefully to get more than, you know, whatever, 30, 40 steps to do this, to solve this phase one problem. But you can do it. I mean, but what it says in practice, it just doesn't happen, right? Oh, this is showing you the zoomed in version. Actually, these are sort of interesting, right?","zh":"看起来它需要大约40步，除非你正好处于可行与不可行之间的边界。实际上，你必须非常仔细地调整数据，才能得到超过30、40步来完成这个任务，解决这个第一阶段的问题。但你可以做到。我的意思是，但在实践中，这种情况并不会发生，对吧？哦，这显示的是放大后的版本。实际上，这些结果有点有趣，对吧？","start":4513.42,"end":4540.9}],"notes":["本段主要讲解了约束松弛与可行性分析的概念。讲者提到，当有50个约束时，满足其中47个约束的情况是可能的，这说明了在优化问题中，某些约束可能被违反，而其他约束则被满足。讲者还提到，当约束的松弛量（margin）为负时，问题不可行，此时需要停止计算。此外，讲者还提到，当约束的松弛量为零时，约束是紧的（tight），而当松弛量为正时，约束是松的（slack）。"],"formulas":[],"uncertainties":["Fi of X"],"diagram":"none","start":4381.9,"end":4540.9,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":4381.9,"text":"something that satisfies 47 of your 50 constraints. Everybody got that? So, and that, that's what you"},{"start":4388.96,"text":"would see here, which is really cool. And here's a, here's a picture. We can, we can take a look"},{"start":4393.5,"text":"at this. Oh, here's an example. This is, this is, this is the, this is actually the margin"},{"start":4399.58,"text":"in your constraint. So you want to push this to be above zero. This failed. It's infeasible. You"},{"start":4405.4,"text":"stop there. And just as we guessed, a whole bunch of them are lined up at this worst point, which"},{"start":4409.92,"text":"is minus 0.2 or I don't know, whatever it is, 0.2, right? Okay. That's the, this is what happens"},{"start":4415.76,"text":"when you do a sum of infeasibilities. And it's really cool. What it says is, you know, I don't"},{"start":4421.46,"text":"So 55 of your FIs are tight."},{"start":4425.82,"text":"Actually, these are all ones that are just slack, right?"},{"start":4432.28,"text":"Whatever Fi of X is actually negative for these."},{"start":4434.84,"text":"And then you have a handful here which you can't satisfy, right?"},{"start":4438.94,"text":"And so, again, this is just our old friend, the L1 sparsifier here."},{"start":4444.12,"text":"It's kind of cool, right, this thing?"},{"start":4445.94,"text":"And these are also already quite useful in various applications that I've seen."},{"start":4455.15,"text":"Make sense? So here's an example. So you have just a family of linear inequality. So it's a polyhedron. But I have a delta, a gamma, sorry, a parameter gamma. And it's chosen so that when gamma equals zero, the polyhedron collapses and has zero volume. When gamma is negative,"},{"start":4485.93,"text":"or less than or equal to zero, well, when it's negative, it's infeasible, and when it's positive, it's feasible, and you're just scaling the right-hand side, so the polyhedron is just growing, right? And now what we can do is we can use the basic phase one and stuff like that, and look at the number of steps it takes to either find a point, right, in the first case, so here's what it looks like. It's actually super interesting."},{"start":4513.42,"text":"So it looks like it takes like 40 steps unless you're right at the boundary of between feasible and infeasible. And that's the only, in fact, you have to adjust the data very carefully to get more than, you know, whatever, 30, 40 steps to do this, to solve this phase one problem. But you can do it. I mean, but what it says in practice, it just doesn't happen, right? Oh, this is showing you the zoomed in version. Actually, these are sort of interesting, right? Because..."}],"speech_gaps":[],"frame":"../frames/v016/027.webp","frame_time":4393.9},{"title":"自洽障碍函数的理论与实践","segments":[{"id":294,"text":"Over on the left, you would say, this is taking only 30 steps. You'd say, why? Because it's infeasible, but there's a lot of certificates of infeasibility. It's easy, so it doesn't take many steps to prove infeasibility. This is like the polyhedron is over here on the right. The polyhedron is so big, it doesn't take very long to find a feasible point.","zh":"在左边，你会说，这只需要30步。你会说，为什么？因为它是不可行的，但有很多不可行性的证明。它很容易，所以不需要很多步骤就能证明不可行性。这就像多面体在右边。这个多面体非常大，找到一个可行点不需要很长的时间。","start":4543.11,"end":4564.17},{"id":295,"text":"And then the only time this increases is when you get right between the boundary of what's feasible and not feasible, right? So that's where it goes up like that. That's what it looks like. So, okay. So that's a picture of that. We'll just start talking about this and we'll finish this up next week. But it's actually really quite cool.","zh":"然后，只有当你处于可行域和不可行域之间的边界时，这个数值才会增加，对吧？所以它会像这样上升。这就是它的样子。所以，好的。这就是这个情况的图像。我们接下来会开始讨论这个话题，并在下周结束。但实际上，这真的很酷。","start":4564.75,"end":4593.26},{"id":296,"text":"So we're going to assume that F0 is going to be, and the FIs are going to be, well, actually, it's actually the barrier. I want T F0 plus phi to be self-concordant, right? So that's the requirement. And there might be some, like, here's a minimum, here's a maximum entropy problem.","zh":"我们将假设F0以及FIs将是，实际上，它是障碍函数。我希望T F0加上phi是自洽的，对吧？这就是要求。可能会有一些，比如这里有一个最小值，这里有一个最大熵问题。","start":4594.24,"end":4615.02},{"id":297,"text":"with inequality constraints. And it turns out that's not self-concordant. Again, you don't have to know this, but when you put in the x bigger than or equal to zero, you add a log barrier, then it becomes, that's a redundant constraint, that x bigger than or equal to zero. That's completely redundant because this objective, its domain, is x has to be bigger than or equal to zero. So this is completely redundant. But when you add that redundant constraint and you work out the log barrier, which is just negative sum log xi,","zh":"带有不等式约束。结果发现这不是自洽的。再次强调，你不需要知道这一点，但当你加入x大于等于零的约束时，你会添加一个对数障碍，然后它就变成了一个冗余的约束，即x大于等于零。这是因为这个目标函数的定义域要求x必须大于等于零。因此，这个约束是完全冗余的。但当你添加这个冗余约束并计算对数障碍，即负的对数和xi之和，","start":4616.46,"end":4643.68},{"id":298,"text":"then that function becomes self-concordant, right? But what I should do is I should preface all of this by saying what you're going to see is super cool, but it is not at all clear what its practical implications are, right? That is not clear at all. Its theoretical implications are very clear. Practical ones, not so much. So, and it's very weird, you know, most...","zh":"那么这个函数就会变得自洽，对吧？但我要说的是，在开始这些内容之前，你将会看到的是超级酷的东西，但它的实际应用意义并不明确，对吧？这完全不清楚。它的理论意义是非常明确的，但实际应用意义则不那么明显。所以，这很奇怪，你知道的，大多数...","start":4644.48,"end":4669.86},{"id":299,"text":"So, you know, actually it'll change every couple of years, right? People will implement solvers which are actually use self-concordant barriers and all that kind of stuff and actually agree with the theory. But then they'll find something that just makes it a lot faster and they're like, we don't care. Then the theorist will catch up a few years later and write something about it. Anyway, so there's just this oscillation where it kind of goes like that. But it's not at all clear, you know. But I have met weird people who've said things like,","zh":"所以，你知道的，实际上它每隔几年就会发生变化，对吧？人们会实现使用自洽障碍函数的求解器，以及所有那些东西，并且实际上与理论一致。但随后他们会发现一些东西，使得它快得多，然后他们会说，我们不关心了。然后理论家会在几年后追上并对此进行写作。总之，就存在这种震荡，它大致如此。但其实一点也不清楚，你知道的。但我也遇到过一些奇怪的人，他们说过类似这样的话，","start":4670.8,"end":4699.62}],"notes":["本段讲解了自洽障碍函数（self-concordant barrier）的概念及其在优化问题中的应用。讲者指出，当在目标函数中加入对数障碍项（log barrier）时，原本不自洽的约束条件会变得自洽。这在处理不等式约束时尤为重要，例如在最大熵问题中，通过添加对数障碍项可以使得函数满足自洽性要求。","讲者强调了自洽障碍函数的理论价值，但指出其在实际应用中的意义尚不明确。虽然理论上的推导清晰，但实际应用中可能因为更高效的算法而被忽略，导致理论与实践之间存在一定的脱节。","讲者提到，自洽障碍函数的理论发展与实际应用之间存在一种周期性的互动。理论研究者会提出新的方法，而实际应用者则可能因为发现更高效的算法而忽略这些理论成果，这种互动导致了理论与实践之间的不断调整。","讲者还提到，某些人可能会对自洽障碍函数的理论价值提出质疑，认为其在实际应用中并不重要。这反映了在优化领域中，理论与实践之间可能存在一定的分歧。","讲者指出，自洽障碍函数的理论发展可能随着技术的进步而发生变化，新的算法可能会取代旧的理论成果，这表明该领域的研究具有一定的动态性和不确定性。","讲者最后提到，虽然自洽障碍函数的理论意义明确，但其实际应用的前景尚不清晰，这表明该领域仍需进一步的研究和探索。"],"formulas":[],"uncertainties":["T F0 plus phi"],"diagram":"none","start":4543.11,"end":4699.62,"asr_flags":[],"math_clarifications":["原文中提到的公式无法核定其数学类型和符号含义，缺乏上下文支持，因此决定移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4543.11,"text":"Over on the left, you would say, this is taking only 30 steps. You'd say, why? Because it's infeasible, but there's a lot of certificates of infeasibility. It's easy, so it doesn't take many steps to prove infeasibility. This is like the polyhedron is over here on the right. The polyhedron is so big, it doesn't take very long to find a feasible point."},{"start":4564.75,"text":"And then the only time this increases is when you get right between the boundary of what's feasible and not feasible, right? So that's where it goes up like that. That's what it looks like. So, okay. So that's a picture of that. We'll just start talking about this and we'll finish this up next week. But it's actually really quite cool."},{"start":4594.24,"text":"So we're going to assume that F0 is going to be, and the FIs are going to be, well, actually, it's actually the barrier. I want T F0 plus phi to be self-concordant, right? So that's the requirement. And there might be some, like, here's a minimum, here's a maximum entropy problem."},{"start":4616.46,"text":"with inequality constraints. And it turns out that's not self-concordant. Again, you don't have to know this, but when you put in the x bigger than or equal to zero, you add a log barrier, then it becomes, that's a redundant constraint, that x bigger than or equal to zero. That's completely redundant because this objective, its domain, is x has to be bigger than or equal to zero. So this is completely redundant. But when you add that redundant constraint and you work out the log barrier, which is just negative sum log xi,"},{"start":4644.48,"text":"then that function becomes self-concordant, right? But what I should do is I should preface all of this by saying what you're going to see is super cool, but it is not at all clear what its practical implications are, right? That is not clear at all. Its theoretical implications are very clear. Practical ones, not so much. So, and it's very weird, you know, most..."},{"start":4670.8,"text":"So, you know, actually it'll change every couple of years, right? People will implement solvers which are actually use self-concordant barriers and all that kind of stuff and actually agree with the theory. But then they'll find something that just makes it a lot faster and they're like, we don't care. Then the theorist will catch up a few years later and write something about it. Anyway, so there's just this oscillation where it kind of goes like that. But it's not at all clear, you know. But I have met weird people who've said things like,"}],"speech_gaps":[],"frame":"../frames/v016/028.webp","frame_time":4555.11},{"title":"自洽函数与牛顿步数的分析","segments":[{"id":300,"text":"They said, what barrier are you using? And you'd write it down and someone would say like, oh my God, that's not self-concordant. You're like, I mean, the algorithm complexity police aren't here, right? So is there an algorithm complexity warrant for your arrest? What are you worried about, right? Anyway, but nevertheless, it's very cool, the analysis. Okay, so let's take a look at it. It's actually just completely...","zh":"他们问，你使用的是什么障碍函数？你会把它写下来，然后有人会说，哦我的天，这不是自洽函数。你会说，我的意思是，算法复杂度的警察不在这里，对吧？那么，有没有算法复杂度的逮捕令来逮捕你？你担心什么呢，对吧？不管怎样，但无论如何，这个分析真的很酷。好的，让我们来看看。它实际上完全……","start":4700.34,"end":4728.88},{"id":301,"text":"insane. It goes like this, right? So remember what it is. There's two terms, right? There's basically the number of centering steps, but that's just like log 1 over mu.","zh":"疯狂。它就是这样运作的，对吧？所以记得它是什么。有两个项，对吧？基本上是中心化步骤的数量，但那只是像 log 1 over mu。","start":4729.18,"end":4744.22},{"id":302,"text":"Like, that's what it has to do with, right? Mu is this, this is how aggressively you walk along this central path, right? So that's your, in fact, people call that the homotopy parameter, right? It's how fast you increase your homotopy parameter, right? Okay, so the question is, how many Newton steps does it take if I'm on the central path, I increase t by a factor mu, and I have to calculate the new point, right? That is the...","zh":"就像，这就是它与之相关的地方，对吧？mu 是这个，这是你沿着这条中心路径行走的激进程度，对吧？所以这就是你的，事实上，人们称之为同伦参数，对吧？这是你增加同伦参数的速度，对吧？好的，所以问题是，如果我在中心路径上，我将 t 增加一个 mu 倍数，我需要计算新的点，对吧？这就是……","start":4744.66,"end":4771.73},{"id":303,"text":"Once we know what that, if we bound that number, that's the number of Newton steps. That's the maximum number of Newton steps you can take in one of these centering steps, and you multiply that by basically log 1 over mu, and you get your total number, your total count. Everybody got this? Okay, so if you remember what that looked like, it looked like this, and this sounded kind of weird. Basically, the number of steps looks like something like f of, let's say, you know, x0.","zh":"一旦我们知道这个数量，如果我们对它进行上界估计，这就是牛顿步数的数量。这是你在这些中心化步骤中可以采取的最大牛顿步数，然后你将其乘以基本上 log 1 over mu，从而得到你的总数，你的总步数。大家明白了吗？好的，如果你记得它看起来是什么样子，它看起来像这样，这听起来有点奇怪。基本上，步数的数量看起来像某种像 f of，比如说，你知道的，x0。","start":4772.22,"end":4796.64},{"id":304,"text":"Everybody got this? Okay, so if you remember what that looked like, it looked like this, and this sounded kind of weird. Basically, the number of steps looks like something like f of, let's say, you know, x0. minus the f of x star, like this, divided by some number. Did I write it out here or something? Yeah, I called it gamma there, right? And then plus a constant, right? It's not really a constant. The constant is really like a log log something or other, but basically it's fine. It's five or something, or not even five, right?","zh":"大家明白了吗？好的，如果你记得它看起来是什么样子，它看起来像这样，这听起来有点奇怪。基本上，步数的数量看起来像某种像 f of，比如说，你知道的，x0。减去 f of x star，像这样，除以某个数。我在这里写出来了吗？是的，我称之为 gamma，对吧？然后再加上一个常数，对吧？其实它并不是一个常数。这个常数实际上是像 log log 某个东西，但基本上没关系。它大概是五，或者甚至不是五，对吧？","start":4797.57,"end":4821.15},{"id":305,"text":"If a function is self-concordant, actually, the classical analysis gives you the same thing. It's just that C and gamma depend on all sorts of things that you would never know and are not affinely independent. But if F is self-concordant, we actually know numbers that are valid for this.","zh":"如果一个函数是自洽的，实际上，经典分析会给出相同的结果。只是C和gamma依赖于你永远不会知道且并非仿射独立的各种因素。但如果F是自洽的，我们实际上知道适用于这个情况的具体数值。","start":4822.03,"end":4848.51},{"id":306,"text":"Now, there is this embarrassing thing, which is someone says, what's the maximum number of Newton steps it's going to take? And you go, well, it's this. and you go yeah but how do you know this right and so you get your it's very embarrassing because you'd say oh yeah no problem to bound the number of newton steps all you have to do is first solve it using newton's method then you know this then you subtract this and divide and add that right and you're like dude what i just solved it i know the exact number of newton steps now so i don't need your stupid bound anymore is everyone following this right so i mean it's reasonable right um but","zh":"现在，有一个令人尴尬的问题，就是有人会问，它最多需要多少次牛顿步？你回答，就是这个。然后你又说，但你怎么知道这个呢？于是你得到一个很尴尬的情况，因为你会说，哦，没问题，要限制牛顿步数，你只需要先用牛顿法求解，然后你就知道这个数值，再减去这个数值，进行除法和加法运算就可以了。然后你会说，哥们，我刚刚已经求解了它，我现在就知道牛顿步数的确切数值了，我再也不需要你们这些愚蠢的界限了。大家明白这个吗？我意思是，这很合理，对吧？嗯，但","start":4849.18,"end":4878.33}],"notes":["本段讨论了自洽函数在牛顿法中的应用，特别是自洽函数如何影响牛顿步数的分析。讲者提到，自洽函数的分析与非自洽函数的分析在形式上是相似的，但参数C和gamma的取值依赖于函数的性质，这些性质通常难以直接确定。","讲者指出，当函数是自洽时，我们可以知道具体的数值来确定牛顿步数的上界。然而，这种分析在实际操作中可能显得尴尬，因为如果已经通过牛顿法求解了问题，那么精确的步数已经知道，不需要再依赖上界。","讲者还提到，牛顿步数的上界通常与中心路径上的步长参数mu有关，通过乘以log(1/mu)来得到总的步数。这表明，mu的取值对算法的复杂度有直接影响。","在分析中，讲者提到一个公式，该公式类似于f(x0) - f(x*)除以某个常数gamma，再加上一个常数项。这个公式用于估计牛顿步数的上界，但常数项可能涉及对数项，如log log等。","讲者强调，虽然自洽函数的分析提供了具体的数值，但这些数值的确定依赖于函数的某些性质，这些性质在实际应用中可能并不容易获得。","最后，讲者指出，虽然理论上可以使用牛顿法直接求解问题并得到精确的步数，但在实际应用中，使用上界分析仍然是有必要的，因为这可以提供一种理论上的保证。"],"formulas":[],"uncertainties":["log log something or other","how do you know this right and so you get your it's very embarrassing because you'd say oh yeah no problem to bound the number of newton steps all you have to do is first solve it using newton's method then you know this then you subtract this and divide and add that right and you're like dude what i just solved it i know the exact number of newton steps now so i don't need your stupid bound anymore is everyone following this right so i mean it's reasonable right um but"],"diagram":"none","start":4700.34,"end":4878.33,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏必要的上下文信息，如函数定义、参数含义及数学条件，无法进行有效的数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4700.34,"text":"They said, what barrier are you using? And you'd write it down and someone would say like, oh my God, that's not self-concordant. You're like, I mean, the algorithm complexity police aren't here, right? So is there an algorithm complexity warrant for your arrest? What are you worried about, right? Anyway, but nevertheless, it's very cool, the analysis. Okay, so let's take a look at it. It's actually just completely..."},{"start":4729.18,"text":"insane. It goes like this, right? So remember what it is. There's two terms, right? There's basically the number of centering steps, but that's just like log 1 over mu."},{"start":4744.66,"text":"Like, that's what it has to do with, right? Mu is this, this is how aggressively you walk along this central path, right? So that's your, in fact, people call that the homotopy parameter, right? It's how fast you increase your homotopy parameter, right? Okay, so the question is, how many Newton steps does it take if I'm on the central path, I increase t by a factor mu, and I have to calculate the new point, right? That is the..."},{"start":4772.22,"text":"Once we know what that, if we bound that number, that's the number of Newton steps. That's the maximum number of Newton steps you can take in one of these centering steps, and you multiply that by basically log 1 over mu, and you get your total number, your total count. Everybody got this? Okay, so if you remember what that looked like, it looked like this, and this sounded kind of weird. Basically, the number of steps looks like something like f of, let's say, you know, x0."},{"start":4797.57,"text":"minus the f of x star, like this, divided by some number. Did I write it out here or something? Yeah, I called it gamma there, right? And then plus a constant, right? It's not really a constant. The constant is really like a log log something or other, but basically it's fine. It's five or something, or not even five, right? So I don't know if you remember this, but this is the..."},{"start":4822.03,"text":"If a function is self-concordant, actually, the classical analysis gives you the same thing. It's just that C and gamma depend on all sorts of things that you would never know and are not affinely independent. But if F is self-concordant, we actually know numbers that are valid for this. Now, there is this embarrassing thing, which is someone says, what's the maximum number of Newton steps it's going to take? And you go, well, it's this."},{"start":4849.18,"text":"and you go yeah but how do you know this right and so you get your it's very embarrassing because you'd say oh yeah no problem to bound the number of newton steps all you have to do is first solve it using newton's method then you know this then you subtract this and divide and add that right and you're like dude what i just solved it i know the exact number of newton steps now so i don't need your stupid bound anymore is everyone following this right so i mean it's reasonable right um but"}],"speech_gaps":[],"frame":"../frames/v016/029.webp","frame_time":4712.34},{"title":"对偶性与下界","segments":[{"id":307,"text":"You can even imagine what's going to help us here. Because this bound is a bound if you had a lower bound on that. So do you think we have a lower bound? Where do you imagine a lower bound on the optimum value something is going to come from before you've actually solved it? So should we say it all in unison or whatever? But you get one guess. Go ahead.","zh":"你甚至可以想象什么会帮助我们在这里。因为这个界是一个界，如果你对那个量有一个下界的话。那么你认为我们有没有下界？在你实际求解之前，你想象哪里会有一个最优值的下界呢？我们应该一起说还是怎样？但你只能猜一次。你先说。","start":4880.52,"end":4903.32},{"id":308,"text":"duality. Okay, so that's the highlight of the story, and we'll complete this next time.","zh":"对偶性。好的，这就是故事的重点，我们下次再完成。","start":4905.46,"end":4911.22}],"notes":["本段讨论了在优化问题中使用下界来建立界限的重要性。讲者指出，如果能够找到一个下界，那么这个下界可以作为对最优值的估计。讲者进一步提问，是否在尚未求解问题之前，我们已经有办法找到这个下界，这引导学生思考下界可能的来源。","讲者提到‘duality’（对偶性）是本节课的重点，并暗示将在下节课继续讲解。这表明对偶性在优化问题中扮演着关键角色，可能涉及对偶问题的构造、对偶变量的引入以及对偶性的应用。","讲者通过提问的方式引导学生思考下界可能的来源，这表明在优化问题中，下界可能来自问题的结构、约束条件或某些已知的理论结果，例如对偶性理论。","讲者提到‘you get one guess’，这表明课堂上可能进行互动，让学生尝试猜测下界可能的来源，从而加深对优化问题中下界概念的理解。","讲者在结尾提到‘we'll complete this next time’，说明本节课的内容尚未结束，对偶性的讨论将在下节课继续展开，这表明对偶性是一个重要的主题，需要进一步深入讲解。","本段内容强调了在优化问题中使用下界的重要性，并通过提问引导学生思考下界可能的来源，同时指出对偶性是本节课的重点，将在下节课继续讲解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4880.52,"end":4911.22,"asr_flags":[],"translation_complete":true,"translated_segments":2,"raw_segments":[{"start":4880.52,"text":"You can even imagine what's going to help us here. Because this bound is a bound if you had a lower bound on that. So do you think we have a lower bound? Where do you imagine a lower bound on the optimum value something is going to come from before you've actually solved it? So should we say it all in unison or whatever? But you get one guess. Go ahead."},{"start":4905.46,"text":"duality. Okay, so that's the highlight of the story, and we'll complete this next time."}],"speech_gaps":[],"frame":"../frames/v016/030.webp","frame_time":4892.52}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v016.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
