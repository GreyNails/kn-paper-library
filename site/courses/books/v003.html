art":1690.08,"text":"It can have zero curvature, right? Then there would be like an affine function. But convexity means non-negative curvature. Or you could even say this. You'd say all convexity is we're talking about the sine of the second derivative. We'll get to that. But roughly speaking, that's what it means, right? Okay. So, and we say a function is concave if minus f is convex, right? That means it curves down."}],"speech_gaps":[],"frame":"../frames/v003/010.webp","frame_time":1547.94},{"title":"凸函数的定义与例子","segments":[{"id":95,"text":"And a function is strictly convex if this inequality here holds strictly as long as theta is strictly between 0 and 1. So one way you can think of it is, lots of ways. This says f of the mixture is less than or equal to the mixture of f. So it tells you that when you compose a mixture and a function, you get an inequality that always holds. So that's a very good way to think of it.","zh":"如果对于所有严格介于0和1之间的θ，这里的不等式严格成立，那么函数就是严格凸的。你可以这样理解，有很多方式。这说明函数的混合值小于或等于混合后的函数值。这告诉你，当你将混合和函数组合时，总会得到一个恒成立的不等式。这是一种非常好的理解方式。","start":1716.37,"end":1741.96},{"id":96,"text":"Okay, so this is what a convex function is. Let's look at some examples. First, we'll just look at examples on R. Yeah, by the way, how do you check if a function on R is convex? You plot it, like in your head, basically. I mean, at some point, somebody would, I don't know, if you're...","zh":"好的，这就是凸函数的定义。让我们来看一些例子。首先，我们只看实数域上的例子。顺便问一下，如何判断一个实数域上的函数是否是凸函数？你基本上要在脑海中画图。我的意思是，总有人会，我不知道，如果你……","start":1743.02,"end":1760.61},{"id":97,"text":"being deposed by a group of surly mathematicians, I suppose you'd actually have to show it, and you can't draw a picture. But the point is, for an R, you just visualize it, and you can say, right? So the graph of ax plus b, it's a line, right? And it's actually true that if you take the chord between any points on a line, I mean, it's silly, it's on it. Actually, what happens is, in that case, this holds with equality, right?","zh":"被一群脾气不好的数学家罢免，我想你实际上必须证明它，而且你不能画图。但重点是，对于实数域，你只需在脑海中可视化它，然后就能说，对吧？直线ax + b的图像是一条直线，对吧？实际上，如果你在直线上取任意两点之间的弦，它其实就是这条线本身。在这种情况下，这个不等式是等号成立的，对吧？","start":1760.94,"end":1786.36},{"id":98,"text":"So, okay. Here's one exponential. And that's with a positive or negative thing. And, you know, we'll soon see ways you could actually, you know, prove this. But it's kind of silly. You just draw a picture and you say, look, here. I'll just draw you some functions. Ready? Here's one. And here's another. Okay? This is like e to the x. That shouldn't go below zero. That's e to the minus 2x. I don't know. I made it up. But it looks like that. Right? And they clearly have non-negative curvature. Right? So those are examples.","zh":"好的。这里有一个指数函数。它带有正或负的参数。很快我们会看到一些实际证明的方法。但其实很傻，你只需画个图，然后说，看，这里。我给你画几个函数。准备好了吗？这里有一个。这里还有一个。好吗？这是e的x次方。它不应该低于零。这是e的-2x次方。我不知道，我随便编的。但看起来就是这样。对吧？它们显然具有非负曲率。对吧？这些都是例子。","start":1788.0,"end":1814.58},{"id":99,"text":"Powers. Well, a power is bigger than one. And then powers that are negative work too, right? Because a power that's negative might look like this, right? Here's 1 over x, and it goes like that, okay? And then that's going to be convex, okay? Let's see. Negative entropy, right? So x log x, if I take a minus, that's the negative entropy.","zh":"幂函数。幂大于1的情况。负的幂也适用，对吧？因为负的幂可能看起来像这样，对吧？这里是1/x，它像这样变化，对吧？然后它就是凸的，对吧？让我们看看。负熵，对吧？所以x log x，如果取负号，那就是负熵。","start":1816.89,"end":1840.27},{"id":100,"text":"And that is a function that looks like this. Here's zero. Here's one where it's zero. It's very steep there and then goes up like that. And it's convex. Or if you like, you could think of it this way. Entropy, which is minus x log x, is concave. And these are the kind of things when we start doing some statistics and other stuff, this is going to be very natural.","zh":"这就是一个看起来像这样的函数。这里是零。这里是零点处的函数值。那里非常陡峭，然后像这样上升。并且它是凸函数。或者，如果你喜欢，你可以这样想。熵，即负x乘以log x，是凹函数。当我们开始做一些统计学和其他内容时，这类函数会非常自然地出现。","start":1841.64,"end":1870.14}],"notes":["本段首先定义了严格凸函数，指出当θ严格介于0和1之间时，不等式严格成立。接着，讲者提到凸函数的一个重要性质是：函数的混合值小于等于混合后的函数值，这说明了凸函数在组合操作下的不等式性质。","讲者通过举例说明如何判断实数域上的凸函数，指出可以通过图像直观判断，但有时需要数学证明。例如，线性函数的图像是一条直线，其任意两点之间的弦与函数图像重合，因此满足凸函数的定义。","讲者提到指数函数的例子，如e^x和e^{-2x}，并指出这些函数具有非负曲率，因此是凸函数。这说明了凸函数的几何特性，即图像向上弯曲。","讲者讨论了幂函数的凸性，指出当幂指数大于1或小于0时，函数是凸的。例如，1/x是一个凸函数，其图像在x轴两侧分别向上弯曲。同时，负熵函数x log x是凸函数，而熵函数是凹函数，这在统计学中具有重要意义。","讲者强调了凸函数在统计学中的应用，如熵函数的凹性在信息论和概率论中非常自然，这为后续课程内容奠定了基础。","讲者通过图像和数学定义的结合，帮助学生理解凸函数的直观和数学特性，同时指出某些情况下需要数学证明而非仅凭图像判断。"],"formulas":[{"latex":"f(\\theta x + (1 - \\theta)y) \\leq \\theta f(x) + (1 - \\theta)f(y)","symbols":"凸函数的定义：函数在任意两点之间的线性组合的值小于等于该组合的函数值的线性组合","explanation":"该公式正确描述了凸函数的定义，即对于任意两点x和y，以及0 \u003c θ \u003c 1，函数在两点之间的线性组合的值小于等于该组合的函数值的线性组合。","evidence":"And a function is strictly convex if this inequality here holds strictly as long as theta is strictly between 0 and 1. So one way you can think of it lots of ways. This says f of the mixture is less than or equal to the mixture of f. So it tells you that when you commute a mixture and a function, you get an inequality always holds. So that's a very good way to think of it."},{"latex":"f(x) = x^p, p > 1","symbols":"幂函数的凸性：当指数p大于1时，函数是凸的","explanation":"该公式正确描述了幂函数的凸性，当指数p大于1时，函数是凸的。","evidence":"Powers. Well, a power is bigger than one work. And then powers that are negative work too, right? Because a power that's negative might look like this, right? Here's 1 over x, and it goes like that, okay? And then that's going to be convex, okay? Let's see. Negative entropy, right? So x log x, if I take a minus, that's the negative entropy."},{"latex":"f(x) = -x \\log x","symbols":"负熵函数：x log x是凸函数，其负值是凹函数","explanation":"该公式正确描述了负熵函数，x log x是凸函数，其负值是凹函数。","evidence":"And that is a function that looks like this. Here's zero. Here's one where it's zero. It's very steep there and then goes up like that. And it's convex. Or if you like, you could think of it this way. Entropy, which is minus x log x, is concave. And these are the kind of things when we start doing some statistics and other stuff, this is going to be very natural."}],"uncertainties":["在段落98中，讲者提到“e to the minus 2x”，但未明确说明其具体形式，可能存在识别错误。","在段落99中，讲者提到“powers that are negative work too”，但未明确说明具体形式，可能存在识别错误。"],"diagram":"none","start":1716.37,"end":1870.14,"asr_flags":[],"math_clarifications":["公式1描述的是线性函数的情况，但严格凸函数的定义要求不等式严格成立，除非θ为0或1。因此，该公式不能作为严格凸函数的定义，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1716.37,"text":"And a function is strictly convex if this inequality here holds strictly as long as theta is strictly between 0 and 1. So one way you can think of it lots of ways. This says f of the mixture is less than or equal to the mixture of f. So it tells you that when you commute a mixture and a function, you get an inequality always holds. So that's a very good way to think of it."},{"start":1743.02,"text":"Okay, so this is what a convex function is. Let's look at some examples. First, we'll just look at examples on R. Yeah, by the way, how do you check if a function on R is convex? You plot it, like in your head, basically. I mean, at some point, somebody would, I don't know, if you're..."},{"start":1760.94,"text":"being deposed by a group of surly mathematicians, I suppose you'd actually have to show it, and you can't draw a picture. But the point is, for an r, you just visualize it, and you can say, right? So the graph of ax plus b, it's a line, right? And it's actually true that if you take the chord between any points on a line, I mean, it's silly, it's on it. Actually, what happens is, in that case, this holds with equality, right?"},{"start":1788.0,"text":"So, okay. Here's one exponential. And that's with a positive or negative thing. And, you know, we'll soon see ways you could actually, you know, prove this. But it's kind of silly. You just draw a picture and you say, look, here. I'll just draw you some functions. Ready? Here's one. And here's another. Okay? This is like e to the x. That shouldn't go below zero. That's e to the minus 2x. I don't know. I made it up. But it looks like that. Right? And they clearly have non-negative curvature. Right? So those are examples."},{"start":1816.89,"text":"Powers. Well, a power is bigger than one work. And then powers that are negative work too, right? Because a power that's negative might look like this, right? Here's 1 over x, and it goes like that, okay? And then that's going to be convex, okay? Let's see. Negative entropy, right? So x log x, if I take a minus, that's the negative entropy."},{"start":1841.64,"text":"And that is a function that looks like this. Here's zero. Here's one where it's zero. It's very steep there and then goes up like that. And it's convex. Or if you like, you could think of it this way. Entropy, which is minus x log x, is concave. And these are the kind of things when we start doing some statistics and other stuff, this is going to be very natural."}],"speech_gaps":[],"frame":"../frames/v003/011.webp","frame_time":1728.37},{"title":"凸函数与凹函数的示例","segments":[{"id":101,"text":"So these are just simple examples. For concave, you'd have like the square root. There's your canonical concave power, right? But so is the 0.7 power. And the log, that's another famous one, right, is going to be log. Okay, and don't worry, these are obvious, but we will soon get to ones that are not obvious. Okay, now we can have some examples on Rn.","zh":"这些都是简单的例子。对于凹函数，你会有像平方根这样的函数。这就是经典的凹幂函数，对吧？但0.7次幂也是凹函数。对数函数，这也是另一个著名的例子，对吧，就是对数。好的，这些可能看起来很明显，但很快我们会看到一些不那么明显的例子。好的，现在我们可以有一些在Rn上的例子。","start":1871.29,"end":1899.08},{"id":102,"text":"So if you have an affine function, so here the variable is a vector, right? And this is an affine function. And it turns out that's actually both convex and concave. Because it, well, I mean, I think of it this way. Convexity means non-negative curvature. Concave means non-positive curvature. If you're zero curvature, otherwise known as affine, right? Then you're in both, you're right on the boundary. You satisfy both.","zh":"如果你有一个仿射函数，这里的变量是一个向量，对吧？这是一个仿射函数。事实上，它既是凸函数又是凹函数。因为，嗯，我想这样理解。凸性意味着非负曲率，凹性意味着非正曲率。如果你是零曲率，也就是仿射函数，对吧？那么你同时满足凸性和凹性，你就在边界上。","start":1900.09,"end":1926.93},{"id":103,"text":"Any norm in Rn, any norm at all, but for example, the p-norm would be one, right? And if you haven't seen the p-norm before, it's time. And if you have, that's great. You probably, I mean, certainly everyone here has seen the two-norm or Euclidean norm, which is the square root of the sum of the squares, but you might not have heard about the three-norm, which is the cube root of the sum of the cubes of the absolute values, right?","zh":"在Rn中的任何范数，任何范数都可以，例如p范数就是一个例子，对吧？如果你之前没有见过p范数，现在就是时候了解了。如果你已经见过，那很好。我想大家一定都见过二范数，也就是欧几里得范数，它是平方和的平方根，但你可能没有听说过三范数，它是绝对值的立方和的立方根，对吧？","start":1928.46,"end":1954.62},{"id":104,"text":"You might ask, what do you use that for? And the answer is, I don't know. But the one norm, that's reasonable. The one norm is the sum of the absolute values. That makes sense in a lot of applications, actually. And then the infinity norm is defined to be the maximum. But the point is, these are convex functions. That's actually the point. Somebody has to show that. And I mean, we'll quickly see ways to do it later that are...","zh":"你可能会问，这有什么用呢？答案是，我不知道。但一范数是合理的。一范数是绝对值的和。这在很多应用中都有意义。然后无穷范数被定义为最大值。但关键是，这些都是凸函数。实际上，这就是重点。有人必须证明这一点。我想，我们很快就会看到一些快速且简单的方法，但技术上来说，有人必须证明这一点，对吧？嗯，好的，现在我们也会看一下定义在矩阵上的函数，这意味着函数的参数是一个矩阵，对吧？例如，一个方矩阵的行列式，或者矩阵的迹，或者其他类似的东西。我们会看一下这些，或者实际上矩阵的范数，对吧？嗯","start":1955.66,"end":1984.22},{"id":105,"text":"quick and painless but you know technically somebody has to show this right um okay now we'll also look at functions sometimes on matrices so that means that the arg that the argument of a function is a matrix right like for example the determinant of you know a square matrix right or the trace of a matrix or something like that so we're going to look at things like that or actually the norm of a matrix okay so um","zh":"你可能会问，这有什么用呢？答案是，我不知道。但一范数是合理的。一范数是绝对值的和。这在很多应用中都有意义。然后无穷范数被定义为最大值。但关键是，这些都是凸函数。实际上，这就是重点。有人必须证明这一点。我想，我们很快就会看到一些快速且简单的方法，但技术上来说，有人必须证明这一点，对吧？嗯，好的，现在我们也会看一下定义在矩阵上的函数，这意味着函数的参数是一个矩阵，对吧？例如，一个方矩阵的行列式，或者矩阵的迹，或者其他类似的东西。我们会看一下这些，或者实际上矩阵的范数，对吧？嗯","start":1984.49,"end":2010.29},{"id":106,"text":"And here, it's interesting to know what does an affine function on a matrix look like, right? Well, you know that an affine function on a vector looks like this. There exists a vector A and a scalar B for which the function has the form A transpose X plus B, right? Well, the analog of that for matrices is actually really interesting. It's this. I mean, if you look at this and you wrote out the formula for that, you'd see that they're kind of the same. It's a sum, a weighted sum of the coefficients. That's a linear function plus a constant, right?","zh":"在这里，了解一个矩阵上的仿射函数是什么样子是很有趣的，对吧？你已经知道一个向量上的仿射函数是这样的：存在一个向量A和一个标量B，使得该函数的形式为A的转置乘以X加上B，对吧？那么，对于矩阵的仿射函数，其对应的形式其实非常有趣。它是这样的。我的意思是，如果你写出这个形式的公式，你会看到它们在本质上是相似的。它是一个系数的加权和，也就是一个线性函数加上一个常数，对吧？","start":2010.92,"end":2040.14}],"notes":["本段讲解了凸函数和凹函数的基本概念，并通过一些简单的例子进行说明。例如，平方根函数、0.7次幂函数和对数函数都是常见的凹函数。同时，也提到凸函数和凹函数的边界情况，即仿射函数，它同时满足凸性和凹性。","在讨论凸函数时，提到了范数函数，包括p-范数、1-范数和无穷范数。这些范数都是凸函数，但需要证明。1-范数是绝对值的和，而无穷范数是最大值，这些范数在实际应用中非常常见。","课程还提到，函数的定义域可以是向量空间，也可以是矩阵空间。例如，矩阵的行列式、迹以及矩阵的范数都是研究对象。这表明凸优化不仅适用于向量，也适用于矩阵。","在讨论矩阵上的仿射函数时，指出其形式与向量上的仿射函数类似，即线性函数加上常数项。这表明矩阵上的仿射函数具有与向量空间相似的结构。","课程强调，虽然这些概念看似简单，但后续会涉及更复杂的例子和证明，需要学生理解基本概念后再深入学习。"],"formulas":[{"latex":"f(x) = \\text{norm}(x)","symbols":"范数","explanation":"保持原式，范数是向量空间中的标准函数，无需修改。","evidence":"Any norm in Rn, any norm at all, but for example, the p-norm would be one, right? And if you haven't seen the p-norm before, it's time. And if you have, that's great. You probably, I mean, certainly everyone here has seen the two-norm or Euclidean norm, which is the square root of the sum of the squares, but you might not have heard about the three-norm, which is the cube root of the sum of the cubes of the absolute values, right?"},{"latex":"f(x) = \\text{trace}(X)","symbols":"矩阵的迹","explanation":"保持原式，迹是矩阵的对角线元素之和，无需修改。","evidence":"quick and painless but you know technically somebody has to show this right um okay now we'll also look at functions sometimes on matrices so that means that the arg that the argument of a function is a matrix right like for example the determinant of you know a square matrix right or the trace of a matrix or something like that so we're going to look at things like that or actually the norm of a matrix okay so um"},{"latex":"f(x) = \\text{det}(X)","symbols":"矩阵的行列式","explanation":"保持原式，行列式是矩阵的特定函数，无需修改。","evidence":"quick and painless but you know technically somebody has to show this right um okay now we'll also look at functions sometimes on matrices so that means that the arg that the argument of a function is a matrix right like for example the determinant of you know a square matrix right or the trace of a matrix or something like that so we're going to look at things like that or actually the norm of a matrix okay so um"},{"latex":"f(x) = a^T x + b","symbols":"仿射函数","explanation":"保持原式，仿射函数是线性函数加上常数项，无需修改。","evidence":"So if you have an affine function, so here the variable is a vector, right? And this is an affine function. And it turns out that's actually both convex and concave. Because it, well, I mean, I think of it this way. Convexity means non-negative curvature. Concave means non-positive curvature. If you're zero curvature, otherwise known as affine, right? Then you're in both, you're right on the boundary. You satisfy both."}],"uncertainties":["在段落105中，关于矩阵的范数和函数的定义存在一定的模糊性，需要进一步澄清。"],"diagram":"none","start":1871.29,"end":2040.14,"asr_flags":[],"math_clarifications":["所有公式均符合数学定义，无需进一步修改。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1871.29,"text":"So these are just simple examples. For concave, you'd have like the square root. There's your canonical concave power, right? But so is the 0.7 power. And the log, that's another famous one, right, is going to be log. Okay, and don't worry, these are obvious, but we will soon get to ones that are not obvious. Okay, now we can have some examples on Rn."},{"start":1900.09,"text":"So if you have an affine function, so here the variable is a vector, right? And this is an affine function. And it turns out that's actually both convex and concave. Because it, well, I mean, I think of it this way. Convexity means non-negative curvature. Concave means non-positive curvature. If you're zero curvature, otherwise known as affine, right? Then you're in both, you're right on the boundary. You satisfy both."},{"start":1928.46,"text":"Any norm in Rn, any norm at all, but for example, the p-norm would be one, right? And if you haven't seen the p-norm before, it's time. And if you have, that's great. You probably, I mean, certainly everyone here has seen the two-norm or Euclidean norm, which is the square root of the sum of the squares, but you might not have heard about the three-norm, which is the cube root of the sum of the cubes of the absolute values, right?"},{"start":1955.66,"text":"You might ask, what do you use that for? And the answer is, I don't know. But the one norm, that's reasonable. The one norm is the sum of the absolute values. That makes sense in a lot of applications, actually. And then the infinity norm is defined to be the maximum. But the point is, these are convex functions. That's actually the point. Somebody has to show that. And I mean, we'll quickly see ways to do it later that are..."},{"start":1984.49,"text":"quick and painless but you know technically somebody has to show this right um okay now we'll also look at functions sometimes on matrices so that means that the arg that the argument of a function is a matrix right like for example the determinant of you know a square matrix right or the trace of a matrix or something like that so we're going to look at things like that or actually the norm of a matrix okay so um"},{"start":2010.92,"text":"And here, it's interesting to know what does an affine function on a matrix look like, right? Well, you know that an affine function on a vector looks like this. There exists a vector A and a scalar B for which the function has the form A transpose X plus B, right? Well, the analog of that for matrices is actually really interesting. It's this. I mean, if you look at this and you wrote out the formula for that, you'd see that they're kind of the same. It's a sum, a weighted sum of the coefficients. That's a linear function plus a constant, right?"}],"speech_gaps":[],"frame":"../frames/v003/012.webp","frame_time":1883.29},{"title":"矩阵迹与凸函数的性质","segments":[{"id":107,"text":"And you can write that in fancy compact matrix notation this way. Trace of a matrix is the sum of the diagonal entries. And you can just check the trace of A transpose X. So when you see trace of A transpose X from now on, it's not some weird matrix formula. It's actually the inner product between two matrices. Should we just check that? Let's just check that.","zh":"你可以用一种优雅的紧凑矩阵符号来表示这一点。矩阵的迹是矩阵对角线元素的和。你可以检查矩阵A转置与矩阵X的迹。因此，从现在开始，当你看到A转置与X的迹时，它并不是什么奇怪的矩阵公式。实际上，它是两个矩阵之间的内积。我们是否应该检查一下？让我们检查一下。","start":2040.6,"end":2067.28},{"id":108,"text":"If I have a matrix A and a matrix B and I form this thing, trace, what I have to do is I have to add up the entries on the diagonal.","zh":"如果我有一个矩阵A和一个矩阵B，并形成这个迹，我需要做的是将对角线上的元素相加。","start":2068.47,"end":2079.19},{"id":109,"text":"Okay, so let's look at the 1-1 entry of this matrix. Well, the 1-1 entry of this matrix is going to be, it's the row of A transpose interproducted with, if that's a verb, interproducted with, it doesn't sound good as a verb, anyway, with the first column of B. So, I'm going to write A is like, well, it doesn't, I'll do that, yeah, is, I'll write it out in its, I'll leave the, the,","zh":"好的，让我们看一下这个矩阵的1-1元素。这个矩阵的1-1元素将是A转置的行与B的第一列的乘积。虽然“interproducted”听起来不太像动词，但不管怎样，就是这个意思。我会写出A的结构，是的，我会把它写出来，我会保留一些，那个，","start":2079.72,"end":2105.79},{"id":110,"text":"Yeah, here, I'll just make these both n by n to make this simple. Right? So it looks like that. So the 1, 1 entry of this matrix is actually A1 transpose B1. Okay? So that's what that is, right? Yeah, because it's the first row of A transpose, which is the first column of A. Right? Interproducted with the first column of B. Right? So this thing is going to be, you know, A1 transpose B1.","zh":"在这里，我会让这两个矩阵都是n乘n的，这样更简单。对吧？看起来就是这样。这个矩阵的1,1元素实际上是A1转置与B1的乘积。对吧？所以这就是它的意思，对吧？是的，因为它是A转置的第一行，也就是A的第一列。对吧？与B的第一列相乘。对吧？所以这个东西就是A1转置与B1的乘积。","start":2107.49,"end":2134.72},{"id":111,"text":"and then I'm going to add up all the way to here, and I'm going to get that, right? And I can write this out entry-wise. This is simply sum over i and j, aij, bij, and that sure looks like an inner product to me, right? Or if you like to say another way people might write it, is you might write it's vec of a transpose vec of b. This is not standard mathematical notation.","zh":"然后我会一直加到那里，我会得到这个结果，对吧？我可以逐项写出这个表达式。这实际上是i和j的求和，aij乘以bij，这看起来像是一个内积，对吧？或者用另一种方式说，人们可能会写成vec(a转置)与vec(b)的内积。这不是标准的数学符号。","start":2135.44,"end":2161.46},{"id":112,"text":"But most people would know what you're talking about. Vec is some mapping that strings out the entries of your matrix in some specified order. Or even worse, you could write this. And I don't know what that is, but it's evocative of certain languages I'm not even going to mention. But everybody got that? So these are just things you'll see before. So here...","zh":"但大多数人会明白你的意思。vec是一种映射，它按照某种指定的顺序将矩阵的元素展开成一个向量。或者更糟糕的是，你也可以这样写。我不知道那是什么，但它让人联想到某些我不打算提及的语言。但大家明白了吗？这些都是你之前会看到的东西。所以这里...","start":2162.12,"end":2187.29},{"id":113,"text":"Here's a function that's convex. Actually, any norm is convex. It follows just from the properties of a norm. But the spectral norm, or otherwise called the 2-norm, induced 2-norm, and it's this. It's the maximum singular value of that matrix. That's a convex function. By the way, you can't write this out analytically. If any dimension of x is bigger than 5, you cannot write out a formula for it.","zh":"这里是一个凸函数。实际上，任何范数都是凸的。这是由范数的性质直接得出的。但谱范数，或者也称为2-范数、诱导2-范数，就是这个。它是该矩阵的最大奇异值。这是一个凸函数。顺便说一下，你无法用解析式写出这个表达式。如果x的任何维度大于5，你就无法写出它的公式。","start":2187.99,"end":2212.97}],"notes":["本段主要讲解了矩阵迹的定义及其与矩阵内积的关系。讲者指出，矩阵迹是矩阵对角线元素之和，并通过具体例子说明了如何计算两个矩阵的迹。同时，讲者提到迹可以视为两个矩阵的内积，并通过矩阵的行和列的乘积来解释这一概念。","讲者进一步说明了如何通过矩阵的行和列的乘积来计算迹，并指出迹的计算可以扩展到所有对角线元素。此外，讲者还提到迹的另一种表示方式，即使用向量化的形式，但指出这种表示方式并非标准数学符号。","在讲解过程中，讲者强调了矩阵迹的计算方法，并通过具体的例子说明了如何将迹转化为矩阵的内积。同时，讲者提到，虽然迹的计算方式可以表示为向量化的形式，但这种形式并不常见，且可能引起混淆。","讲者还提到，矩阵迹的计算可以用于表示矩阵的内积，并指出这种表示方式在数学中是常见的。此外，讲者还提到，虽然迹的计算方式可以表示为向量化的形式，但这种形式并不标准，且可能引起误解。","在讲解过程中，讲者还提到，矩阵迹的计算可以用于表示矩阵的内积，并指出这种表示方式在数学中是常见的。此外，讲者还提到，虽然迹的计算方式可以表示为向量化的形式，但这种形式并不标准，且可能引起误解。","最后，讲者提到，矩阵迹的计算可以用于表示矩阵的内积，并指出这种表示方式在数学中是常见的。此外，讲者还提到，虽然迹的计算方式可以表示为向量化的形式，但这种形式并不标准，且可能引起误解。"],"formulas":[{"latex":"\\text{trace}(A^T X)","symbols":"矩阵迹","explanation":"正确表示矩阵迹，即矩阵对角线元素之和，适用于任意矩阵 $ A $ 和 $ X $ 的乘积。","evidence":"And you can write that in fancy compact matrix notation this way. Trace of a matrix is the sum of the diagonal entries. And you can just check the trace of A transpose X. So when you see trace of A transpose X from now on, it's not some weird matrix formula. It's actually the inner product between two matrices. Should we just check that? Let's just check that."}],"uncertainties":["interproducted"],"diagram":"none","start":2040.6,"end":2212.97,"asr_flags":[],"math_clarifications":["原文中提到的 $ A_i^T B_i $ 并非矩阵迹的正确表达方式，矩阵迹应为所有对角线元素之和，即 $ \\text{trace}(A^T X) $。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2040.6,"text":"And you can write that in fancy compact matrix notation this way. Trace of a matrix is the sum of the diagonal entries. And you can just check the trace of A transpose X. So when you see trace of A transpose X from now on, it's not some weird matrix formula. It's actually the inner product between two matrices. Should we just check that? Let's just check that."},{"start":2068.47,"text":"If I have a matrix A and a matrix B and I form this thing, trace, what I have to do is I have to add up the entries on the diagonal."},{"start":2079.72,"text":"Okay, so let's look at the 1-1 entry of this matrix. Well, the 1-1 entry of this matrix is going to be, it's the row of A transpose interproducted with, if that's a verb, interproducted with, it doesn't sound good as a verb, anyway, with the first column of B. So, I'm going to write A is like, well, it doesn't, I'll do that, yeah, is, I'll write it out in its, I'll leave the, the,"},{"start":2107.49,"text":"Yeah, here, I'll just make these both n by n to make this simple. Right? So it looks like that. So the 1, 1 entry of this matrix is actually A1 transpose B1. Okay? So that's what that is, right? Yeah, because it's the first row of A transpose, which is the first column of A. Right? Interproducted with the first column of B. Right? So this thing is going to be, you know, A1 transpose B1."},{"start":2135.44,"text":"and then I'm going to add up all the way to here, and I'm going to get that, right? And I can write this out entry-wise. This is simply sum over i and j, aij, bij, and that sure looks like an inner product to me, right? Or if you like to say another way people might write it, is you might write it's vec of a transpose vec of b. This is not standard mathematical notation."},{"start":2162.12,"text":"But most people would know what you're talking about. Vec is some mapping that strings out the entries of your matrix in some specified order. Or even worse, you could write this. And I don't know what that is, but it's evocative of certain languages I'm not even going to mention. But everybody got that? So these are just things you'll see before. So here..."},{"start":2187.99,"text":"Here's a function that's convex. Actually, any norm is convex. It follows just from the properties of a norm. But the spectral norm, or otherwise called the 2-norm, induced 2-norm, and it's this. It's the maximum singular value of that matrix. That's a convex function. By the way, you can't write this out analytically. If any dimension of x is bigger than 5, you cannot write out a formula for it."}],"speech_gaps":[],"frame":"../frames/v003/013.webp","frame_time":2052.6},{"title":"凸函数的线性约束与对数行列式函数","segments":[{"id":114,"text":"Because, you know, you'd have to find, you know, determinant of x transpose x, you know, minus lambda i, that's a polynomial of degree at least 5, and there's no formula for the roots of that, right? Nevertheless, that doesn't stop people from using the 2-norm all the time, right? But the point is, that function is really complicated and it's convex, okay? So, you'll see some others pretty soon. Okay.","zh":"因为，你知道的，你得找到，你知道的，x转置x的行列式，你知道的，减去lambda i，这是一个至少五次的多项式，而这个多项式的根是没有公式的，对吧？然而，这并没有阻止人们一直使用2范数，对吧？但重点是，这个函数真的很复杂，但它却是凸的，对吧？所以，你很快就会看到其他的例子。好的。","start":2213.54,"end":2238.02},{"id":115,"text":"So here's a general method. It's useful sometimes for checking convexity. It says the following. If I have a convex function and I restrict it to a line, now restricting it to a line means I'm only going to look at its values along the line, right? A line in Rn. Then the restricted function is convex. Not only that, it's a function of a single variable. You could plot it and just take...","zh":"这里有一个通用的方法。它有时用于检查凸性。它说的是以下内容。如果我有一个凸函数，并且将其限制在一条直线上，现在限制在一条直线上意味着我只关注该函数在直线上的值，对吧？在Rn中的直线。那么，限制后的函数是凸的。不仅如此，它还是一个单变量函数。你可以画出来，然后只需查看……","start":2239.91,"end":2264.41},{"id":116,"text":"Look at it with your eyeballs and see that it goes up, right? So by the way, this gives you a completely reasonable way to check if a function is convex. If the methods we're going to talk about later today and next lecture don't work, then real simple, you generate random lines.","zh":"用你的眼睛看一下，看看它是否上升，对吧？所以，顺便说一下，这给了你一个完全合理的方式来检查一个函数是否是凸的。如果我们在今天和下节课中要讨论的方法不起作用，那么很简单，你生成随机的直线。","start":2264.66,"end":2284.22},{"id":117,"text":"and then you plot the function restricted. And if every time that comes up, it's got positive curvature, you hit carriage return and go to the next one. I mean, this is not a very good way to do it. But if you ever see anything where it's got even the slightest non-convexity,","zh":"然后你画出限制后的函数。如果每次出现时，它都有正曲率，你就按回车键进入下一个。我的意思是，这不是一个非常好的方法。但如果你看到任何地方存在哪怕最轻微的非凸性，","start":2285.17,"end":2300.79},{"id":118,"text":"then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy.","zh":"你就停止并宣布这个函数不是凸的，对吧？好的，所以基本上说的是，一个函数是凸的，当且仅当它在任何直线上限制后的函数都是凸的。这里有一个这个例子。这是一个很酷的例子。人们已经知道超过100年，正定矩阵的行列式的对数是凹的。好的，这很疯狂。","start":2301.46,"end":2322.75},{"id":119,"text":"And it's a really complicated function if you think about it, right? It's the log of some crazy polynomial with n factorial terms in it. Everybody following this? It's just like, how on earth would you know what that... Now, of course, we don't compute the log of the determinant that way, so that's silly. By the way, how do we compute the log of the determinant? I mean, this is... We'll talk about numerical stuff later in the class, but how do you compute the log of the determinant of a matrix? I'm open to suggestions. Write out what the determinant is.","zh":"如果你仔细想想，这其实是一个非常复杂的函数，对吧？它是某个包含n个阶乘项的疯狂多项式的对数。大家都能跟上吗？就像是，你怎么可能知道这个……当然，我们不会用这种方式计算行列式的对数，所以这样想是愚蠢的。顺便问一句，我们是如何计算行列式的对数的？我的意思是，这……我们会在课上之后讨论数值计算的内容，但你如何计算一个矩阵的行列式的对数？我欢迎大家提出建议。写出行列式的表达式。","start":2323.31,"end":2354.58},{"id":120,"text":"No, that has n factorial terms in it. Okay, so which? How do you do this? Yeah, sure. Okay, you can compute its eigenvalues and then sum the log of the eigenvalues. Okay, and suppose you wanted an exact method that didn't involve eigenvalues. What would you do? This is just for fun. I mean, we'll talk about these things later in the class. You don't have to know it now.","zh":"不，它里面包含n个阶乘项。好的，那怎么办呢？你怎么做这个？是的，当然可以。你可以计算它的特征值，然后对特征值取对数并求和。好的，假设你想用一个不涉及特征值的精确方法，你会怎么做？这只是为了好玩。我的意思是，我们会在课上之后讨论这些内容。你现在不需要知道。","start":2356.15,"end":2379.17}],"notes":["本段讲授了凸函数的一个重要性质：如果一个函数在所有直线上都是凸的，那么该函数整体上是凸的。这是判断凸函数的一种方法，即通过限制函数到直线上的行为来验证其凸性。这种方法虽然不适用于所有情况，但在某些情况下可以作为辅助手段。","讲者提到，对于一个凸函数，如果将其限制在一条直线上，那么该函数在该直线上仍然是凸的。这种限制后的函数是一个单变量函数，可以通过绘制图像来直观判断其凸性。","讲者进一步指出，这种方法虽然不是非常高效，但在某些情况下可以作为一种快速判断工具。如果在任何一条直线上发现非凸性，就可以立即判断该函数不是凸函数。","讲者举了一个例子，即对数行列式函数（log of determinant）在正定矩阵上是凹函数。这个例子说明了即使函数形式复杂，也可以通过数学性质判断其凸性。","讲者提到，对数行列式函数虽然形式复杂，但可以通过计算矩阵的特征值并求其对数之和来计算。这展示了如何在实际中处理这种复杂的函数。","最后，讲者提到，虽然可以通过特征值计算对数行列式，但也可以考虑其他方法，如不涉及特征值的精确计算方法。这些方法将在后续课程中讨论。"],"formulas":[{"latex":"f(x) \\text{ 是凸函数当且仅当 } f|_L \\text{ 是凸函数，对于所有直线 } L \\text{ 在 } \\mathbb{R}^n","symbols":"f(x) 是凸函数当且仅当其在所有直线 L 上的限制函数 f|_L 是凸函数","explanation":"公式正确描述了凸函数的性质，即函数在所有直线上的限制函数也是凸函数。","evidence":"So here's a general method. It's useful sometimes for checking convexity. It says the following. If I have a convex function and I restrict it to a line, now restricting it to a line means I'm only going to look at its values along the line, right? A line in Rn. Then the restricted function is convex. Not only that, it's a function of a single variable. You could plot it and just take... Look at it with your eyeballs and see that it goes up, right? So by the way, this gives you a completely reasonable way to check if a function is convex. If the methods we're going to talk about later today and next lecture don't work, then real simple, you generate random lines. and then you plot the function restricted. And if every time that comes up, it's got positive curvature, you hit carriage return and go to the next one. I mean, this is not a very good way to do it. But if you ever see anything where it's got even the slightest non-convexity, then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"latex":"f(x) = \\text{log}(\\text{det}(X))","symbols":"对数行列式函数 f(x) = log(det(X))","explanation":"公式正确表达了对数行列式函数的定义，即对矩阵 X 的行列式取对数。","evidence":"then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"latex":"f(x) = \\text{log}(\\text{det}(X)) = \\text{tr}(\\text{log}(X))","symbols":"对数行列式函数可以通过矩阵的特征值之和来计算，即 f(x) = log(det(X)) = tr(log(X))","explanation":"公式正确表达了对数行列式函数的另一种计算方式，即通过矩阵对数的迹来计算。","evidence":"And it's a really complicated function if you think about it, right? It's the log of some crazy polynomial with n factorial terms in it. Everybody following this? It's just like, how on earth would you know what that... Now, of course, we don't compute the log of the determinant that way, so that's silly. By the way, how do we compute the log of the determinant? I mean, this is... We'll talk about numerical stuff later in the class, but how do you compute the log of the determinant of a matrix? I'm open to suggestions. Write out what the determinant is. No, that has n factorial terms in it. Okay, so which? How do you do this? Yeah, sure. Okay, you can compute its eigenvalues and then sum the log of the eigenvalues. Okay, and suppose you wanted an exact method that didn't involve eigenvalues. What would you do? This is just for fun. I mean, we'll talk about these things later in the class. You don't have to know it now."}],"uncertainties":[],"diagram":"none","start":2213.54,"end":2379.17,"asr_flags":[],"math_clarifications":["公式 0 正确描述了凸函数的性质，即函数在所有直线上的限制函数也是凸函数。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2213.54,"text":"Because, you know, you'd have to find, you know, determinant of x transpose x, you know, minus lambda i, that's a polynomial of degree at least 5, and there's no formula for the roots of that, right? Nevertheless, that doesn't stop people from using the 2-norm all the time, right? But the point is, that function is really complicated and it's convex, okay? So, you'll see some others pretty soon. Okay."},{"start":2239.91,"text":"So here's a general method. It's useful sometimes for checking convexity. It says the following. If I have a convex function and I restrict it to a line, now restricting it to a line means I'm only going to look at its values along the line, right? A line in Rn. Then the restricted function is convex. Not only that, it's a function of a single variable. You could plot it and just take..."},{"start":2264.66,"text":"Look at it with your eyeballs and see that it goes up, right? So by the way, this gives you a completely reasonable way to check if a function is convex. If the methods we're going to talk about later today and next lecture don't work, then real simple, you generate random lines."},{"start":2285.17,"text":"and then you plot the function restricted. And if every time that comes up, it's got positive curvature, you hit carriage return and go to the next one. I mean, this is not a very good way to do it. But if you ever see anything where it's got even the slightest non-convexity,"},{"start":2301.46,"text":"then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"start":2323.31,"text":"And it's a really complicated function if you think about it, right? It's the log of some crazy polynomial with n factorial terms in it. Everybody following this? It's just like, how on earth would you know what that... Now, of course, we don't compute the log of the determinant that way, so that's silly. By the way, how do we compute the log of the determinant? I mean, this is... We'll talk about numerical stuff later in the class, but how do you compute the log of the determinant of a matrix? I'm open to suggestions. Write out what the determinant is."},{"start":2356.15,"text":"No, that has n factorial terms in it. Okay, so which? How do you do this? Yeah, sure. Okay, you can compute its eigenvalues and then sum the log of the eigenvalues. Okay, and suppose you wanted an exact method that didn't involve eigenvalues. What would you do? This is just for fun. I mean, we'll talk about these things later in the class. You don't have to know it now."}],"speech_gaps":[],"frame":"../frames/v003/014.webp","frame_time":2225.54},{"title":"凸函数的证明与历史背景","segments":[{"id":121,"text":"you'd take a Cholesky factorization of the matrix, and then you'd take the sum of the log of the entries on the diagonal. And that's an order n cubed operation as opposed to n factorial. And just for the record, n cubed is a lot better than n factorial.","zh":"你会对矩阵进行Cholesky分解，然后取对角线上元素的对数之和。这是一种时间复杂度为n³的操作，而不是n!。顺便说一句，n³比n!要好得多。","start":2381.32,"end":2397.96},{"id":122,"text":"So that was an aside. Didn't have to do with anything. Okay. So let's see that. So this is actually saying something that's, I mean, you have to get some respect for that. That's like a really complicated function, right? And yet it's concave. Not only that, they knew this in like 1905. Okay. So where the, in fact, I think the term convex had only come in 10 or 15 years ago, like at all. So, okay.","zh":"所以那只是一个附带的说明，和我们讨论的内容无关。好的。那么我们来看一下。实际上，这说明了一个非常复杂的问题，对吧？而它却是一个凹函数。不仅如此，早在1905年人们就已经知道这一点了。好的。事实上，我觉得‘凸’这个词直到10或15年前才被引入，甚至可能更晚。好的。","start":2399.5,"end":2424.04},{"id":123,"text":"So here's how you'd show that. So to show this, what I'll do... Now, by the way, if you knew information theory, you could show this because you'd say...","zh":"那么这里是如何证明的。为了证明这一点，我会这样做……顺便说一句，如果你了解信息论，你也可以用这种方法，因为你会说……","start":2424.75,"end":2435.49},{"id":124,"text":"Well, I mean, that's the entropy of a Gaussian variable or something like that. And then you'd take two things. It'd be a mixture of Gaussian variables. There'd be some information theory inequality, famous inequality that would tell you this, right? But that's kind of weird and complicated for normal people, right? But so here's how you do this. You take a matrix here. I'm going to pick an arbitrary point X, which is going to be capital X because it's a matrix.","zh":"我的意思是，这就像高斯变量的熵，或者类似的东西。然后你会考虑两个事物。它会是高斯变量的混合。会有某个信息论中的著名不等式，会告诉你这一点，对吧？但这对普通人来说有点奇怪和复杂，对吧？所以这里是如何做的。你会选择一个矩阵。我会选择一个任意的点X，它会是大写的X，因为它是一个矩阵。","start":2436.05,"end":2463.05},{"id":125,"text":"That's going to be in the domain. And then an arbitrary direction V, which is symmetric, but not necessarily positive semi-definite, positive definite, right? So this, if I take X plus TV, I actually, that describes a line in matrix, in symmetric matrix space. Everybody agree? So that's, I mean, we can pretend to visualize it, but that's what it is, right? So there's a line of, you know, like a line of covariance matrices or whatever, however you want to think of it. Okay. And so we want to find out, you know, is this convex with respect to T?","zh":"这个点X会在定义域内。然后选择一个任意的方向V，它是对称的，但不一定正定或半正定，对吧？所以，如果我取X加上TV，实际上，这在矩阵空间中描述了一条直线。大家同意吗？我的意思是，我们可以假装可视化它，但这就是它的样子，对吧？所以，这是一条由协方差矩阵或其他你想要的任何方式来理解的直线。好的。因此，我们想知道，这是否关于T是凸的？","start":2463.61,"end":2493.61},{"id":126,"text":"Well, we can plot it, you know, and that'll come up. It's correct. It's concave. Sorry, it's concave. And so the way you do this is here, I just take this matrix expression. I take x to the one half outside, x to the minus half outside here. I pull it out both sides. This becomes an i. This becomes t times x to the minus one half v x to the minus one half. That's this thing. So I get this. Then the two other terms I get.","zh":"嗯，我们可以画出来，你知道的，这会浮现出来。它是正确的。它是凹函数。抱歉，它是凹函数。那么你这样做的方法是，这里，我只取这个矩阵表达式。我将x的1/2次方移到外面，x的-1/2次方也移到外面。我把它们从两边提出来。这变成了i。这变成了t乘以x的-1/2次方乘以v乘以x的-1/2次方。这就是这个东西。所以我得到了这个。然后另外两个项我得到了。","start":2494.13,"end":2522.51},{"id":127,"text":"two terms which look like log det x to the one half, each of which is one half log det x, okay? So I end up with this expression here, okay? Now I go to eigenvalues and I say, well, I can write this thing out.","zh":"另外两个项看起来像log det x的1/2次方，每个都是1/2 log det x，对吧？所以我得到了这里的表达式，对吧？现在我转向特征值，并说，嗯，我可以把这个东西展开出来。","start":2522.91,"end":2539.03}],"notes":["本段主要讨论如何证明一个函数是凸函数，通过矩阵表达式和特征值分析。讲者提到，可以通过将矩阵分解为对角线元素的对数和，来证明其凹性。这种方法比计算阶乘更高效，因为其复杂度为O(n³)。","讲者提到，虽然信息论可以用来证明这一性质，但这种方法对于普通人来说可能过于复杂。因此，他选择使用矩阵分析的方法，通过构造一个线性路径并分析其在参数T上的行为来证明函数的凹性。","在证明过程中，讲者将矩阵表达式分解为多个部分，包括对角线元素的对数和特征值的分析。他提到，通过将矩阵分解为对角线元素的平方根和逆平方根，可以简化表达式。","讲者还提到，通过将矩阵表达式转换为特征值的形式，可以进一步分析其凹性。这种方法需要对矩阵的特征值进行计算和分析，从而得出最终的结论。","讲者提到，虽然信息论可以提供一种证明方法，但这种方法可能过于复杂，因此他选择使用矩阵分析的方法。这种方法更直观，也更容易理解。","讲者还提到，虽然凸函数的概念在1905年之前就已经存在，但“凸”这一术语直到10到15年前才被引入。这说明了凸函数理论的发展历史。"],"formulas":[],"uncertainties":["x to the one half outside, x to the minus half outside here"],"diagram":"none","start":2381.32,"end":2539.03,"asr_flags":[],"math_clarifications":["原文中讨论了矩阵的Cholesky分解、对数行列式以及矩阵的凸性，但未明确给出具体的数学公式或表达式，因此无法核定相关公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2381.32,"text":"you'd take a Cholesky factorization of the matrix, and then you'd take the sum of the log of the entries on the diagonal. And that's an order n cubed operation as opposed to n factorial. And just for the record, n cubed is a lot better than n factorial."},{"start":2399.5,"text
