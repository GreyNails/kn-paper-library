an plot it, you know, and that'll come up. It's correct. It's concave. Sorry, it's concave. And so the way you do this is here, I just take this matrix expression. I take x to the one half outside, x to the minus half outside here. I pull it out both sides. This becomes an i. This becomes t times x to the minus one half v x to the minus one half. That's this thing. So I get this. Then the two other terms I get."},{"start":2522.91,"text":"two terms which look like log det x to the one half, each of which is one half log det x, okay? So I end up with this expression here, okay? Now I go to eigenvalues and I say, well, I can write this thing out."}],"speech_gaps":[],"frame":"../frames/v003/015.webp","frame_time":2393.32},{"title":"凸函数的扩展与定义域处理","segments":[{"id":128,"text":"If I knew the eigenvalues of this matrix, right? And if lambda are the eigenvalues of this matrix, this matrix is symmetric, but it is not necessarily positive semi-definite, right? So anyway, I end up with an expression that looks like this. This is as a function of t. Now we're cool, because we can quickly convince ourselves that log of 1 plus t lambda is concave."},{"id":129,"text":"for any, you know, no matter what lambda is, right? It's concave, right? And then this is a sum of concave functions. We'll get to that. That's going to be concave. And that's how you do it, right? So that would be that. So, but this is already a not totally obvious thing, right? So, and in fact, I guess in a lot of classes, people would end up showing this by some very long convoluted thing or something like that. It's fine. Okay."},{"id":130,"text":"Okay, one more thing we want to talk about with convex functions is they actually extend very gracefully. There's a way to handle the domain very gracefully. And the way that works is this. What we do is you have a convex function f, and what we do, and let's just talk about f for a minute. So I have a convex function f. If I call, I'm going to use a dialect of maybe kind of..."},{"id":131,"text":"street fighting computer science or something. But if I call F with an argument X that's in its domain, I get a number, like minus 11. And that's what it is, right? That's cool. If I call F at a point outside the domain, well, it depends on who implemented the function, right? But, you know, maybe everything dumps core or something like that. But what should happen is you should get a return value that's like OOD, which means out of domain, right? But if you call it a couple of times, you should get..."},{"id":132,"text":"O-O-D and then a nasty message, which is like, you're on, uh, watch out. You do that 10 more"},{"id":133,"text":"times and your privileges for, you know, evaluating this function are revoked, right? That's, that's"},{"id":134,"text":"how that should work, right? So you should get something like out of domain, right? Or N-A or"},{"id":135,"text":"nan or whatever you like, right? Okay. Um, so it turns out what you do instead is I'm going to"},{"id":136,"text":"define a new function, F tilde. It's going to be defined for everything. And I just, I just,"},{"id":137,"text":"if you're out of the domain you just call yourself infinity that's it and actually what you're going"},{"id":138,"text":"to find out is that in that inequality works you can figure that out in your head um and it all"},{"id":139,"text":"everything just works right uh with this and actually it's kind of nice because it means a"},{"id":140,"text":"lot of times we'll we'll work with functions that can have values of plus infinity and those are"},{"id":141,"text":"just like that that's a way to uh we'll see to express constraints right that's how that's going"},{"id":142,"text":"going to work. So, okay. So it all, I mean, it's just bookkeeping, but it kind of, it does,"},{"id":143,"text":"it does work. I don't think like, you know, whatever IEEE 488 thing, I don't think it"},{"id":144,"text":"supports this. Actually, I should check if it, I mean, it actually does. They do have things like"}],"notes":["本段讨论了凸函数在定义域外的处理方式，提出了一种通过将函数值设为无穷大来扩展函数定义域的方法。这种方法允许函数在定义域外仍然保持数学上的合理性，便于处理约束条件。","讲者提到，当函数在定义域外被调用时，应返回一个表示“超出定义域”的值，如“OOD”或“NaN”，但为了简化处理，可以将这些情况统一设为无穷大。这种方法在数学上是合理的，因为它允许在不改变函数凸性的情况下处理扩展定义域的问题。","讲者还提到，这种扩展方式在处理优化问题时非常有用，因为可以将约束条件自然地融入到函数中，而无需额外的处理步骤。","讲者指出，虽然这种方法在数学上是合理的，但实际实现时可能需要考虑计算平台（如IEEE标准）是否支持这种处理方式。讲者表示需要进一步确认这一点。","讲者强调，这种扩展方式是一种“簿记”操作，即在不改变函数本质的情况下，通过定义域的扩展来简化问题处理。","讲者最后提到，这种方法在处理凸函数时非常有用，因为它允许函数在定义域外仍然保持数学上的合理性，从而简化了优化问题的处理。"],"formulas":[],"uncertainties":["IEEE 488 thing","They do have things like"],"diagram":"none","start":2539.61,"end":2718.15,"asr_flags":[],"raw_segments":[{"start":2539.61,"text":"If I knew the eigenvalues of this matrix, right? And if lambda are the eigenvalues of this matrix, this matrix is symmetric, but it is not necessarily positive semi-definite, right? So anyway, I end up with an expression that looks like this. This is as a function of t. Now we're cool, because we can quickly convince ourselves that log of 1 plus t lambda is concave."},{"start":2566.45,"text":"for any, you know, no matter what lambda is, right? It's concave, right? And then this is a sum of concave functions. We'll get to that. That's going to be concave. And that's how you do it, right? So that would be that. So, but this is already a not totally obvious thing, right? So, and in fact, I guess in a lot of classes, people would end up showing this by some very long convoluted thing or something like that. It's fine. Okay."},{"start":2593.31,"text":"Okay, one more thing we want to talk about with convex functions is they actually extend very gracefully. There's a way to handle the domain very gracefully. And the way that works is this. What we do is you have a convex function f, and what we do, and let's just talk about f for a minute. So I have a convex function f. If I call, I'm going to use a dialect of maybe kind of..."},{"start":2619.85,"text":"street fighting computer science or something. But if I call F with an argument X that's in its domain, I get a number, like minus 11. And that's what it is, right? That's cool. If I call F at a point outside the domain, well, it depends on who implemented the function, right? But, you know, maybe everything dumps core or something like that. But what should happen is you should get a return value that's like OOD, which means out of domain, right? But if you call it a couple of times, you should get..."},{"start":2649.23,"text":"O-O-D and then a nasty message, which is like, you're on, uh, watch out. You do that 10 more"},{"start":2655.29,"text":"times and your privileges for, you know, evaluating this function are revoked, right? That's, that's"},{"start":2660.47,"text":"how that should work, right? So you should get something like out of domain, right? Or N-A or"},{"start":2664.85,"text":"nan or whatever you like, right? Okay. Um, so it turns out what you do instead is I'm going to"},{"start":2671.25,"text":"define a new function, F tilde. It's going to be defined for everything. And I just, I just,"},{"start":2675.19,"text":"if you're out of the domain you just call yourself infinity that's it and actually what you're going"},{"start":2681.29,"text":"to find out is that in that inequality works you can figure that out in your head um and it all"},{"start":2686.63,"text":"everything just works right uh with this and actually it's kind of nice because it means a"},{"start":2691.19,"text":"lot of times we'll we'll work with functions that can have values of plus infinity and those are"},{"start":2695.87,"text":"just like that that's a way to uh we'll see to express constraints right that's how that's going"},{"start":2701.95,"text":"going to work. So, okay. So it all, I mean, it's just bookkeeping, but it kind of, it does,"},{"start":2708.37,"text":"it does work. I don't think like, you know, whatever IEEE 488 thing, I don't think it"},{"start":2713.61,"text":"supports this. Actually, I should check if it, I mean, it actually does. They do have things like"}],"speech_gaps":[],"frame":"../frames/v003/016.webp","frame_time":2551.61},{"title":"梯度与向量表示","segments":[{"id":145,"text":"plus inf and minus inf and stuff like that. Whether or not people, when they write stuff"},{"id":146,"text":"for convex functions actually support those things, it's another question. I don't really"},{"id":147,"text":"know but okay so all right so that's the extended value extension okay now we get to um some some"},{"id":148,"text":"conditions these are the traditional ones and they're based on you know tradition which is"},{"id":149,"text":"our multi here our multi-hundred year tradition of calculus right and so it's actually super"},{"id":150,"text":"interesting like you know the gradient of a function by the way this construction here a"},{"id":151,"text":"lot of people use different notation which i despise i don't i use just one fixed notation"},{"id":152,"text":"and to write a vector you have exactly two choices. You can write it like this"},{"id":153,"text":"Right? A, B, C. That's like a vertical stack. Or you can write it this way. Right? So for me, the parentheses and the comma is the constructor for a vector. Yeah? Is the gradient a column vector? That's correct. That's a column vector. That's right. That's exactly right. Right. Right. Okay. So that's the gradient."},{"id":154,"text":"By the way, people write all sorts of... I mean, the problem is people are programming in lots of different languages, and they start writing things like this, right? And they start writing, I don't know, right? And they start writing all sorts of weird stuff. I understand what they're saying, but I judge them. So I just make a little note. And even worse, like in the same paper or talk, you'll find these two, and then they really get judged. Like, okay."},{"id":155,"text":"Okay, so that was just a quick notation comment. Okay, so the gradient is just basically the set of all partial derivatives. And you should recognize this as the first order Taylor approximation of f developed at the point x. Okay, and what that means is this function here is affine. It is. It's linear plus a constant, number one. And number two."},{"id":156,"text":"At the point x, it's actually correct. This thing, which you might call f hat, is actually equal to f when you plug in y equals x. That goes away, and that's just f of x. So what calculus tells you is this. It says that this function here is really close to this function if y is close to x. But when I say really close, I mean like close squared."},{"id":157,"text":"Right? That's what I meant when I said that, right? So it wasn't just the English intensifier, right? Okay, so what this says is actually super interesting. It says, and this picture actually is related basically to kind of the entire course. What this says is that the first-order Taylor expansion for a convex function, it's from calculus, right, in 1770."}],"notes":["本段主要讨论了向量的表示方式以及梯度的定义。教授指出，向量有两种表示方式：一种是垂直排列的元素，另一种是使用括号和逗号来构造向量。教授强调了梯度是一个列向量，并指出梯度是函数所有偏导数的集合。","教授还提到，由于编程语言的不同，人们在书写向量时可能会使用不同的符号，这导致了混乱。他批评了这种不一致的写法，并指出在同一篇论文或演讲中，这种不一致的写法会受到批评。","教授进一步解释了梯度的定义，指出梯度是函数的一阶泰勒展开，即函数在某一点的线性近似。这种近似是仿射函数，即线性函数加上一个常数项。","教授还提到，当点y接近点x时，泰勒展开的函数与原函数非常接近，这里的“非常接近”指的是平方误差的最小化。","最后，教授指出，一阶泰勒展开对于凸函数来说非常重要，它与整个课程内容密切相关，并提到这种展开方法起源于1770年的微积分。"],"formulas":[{"latex":"f(x + h) \\text{ is approximately } f(x) + \\nabla f(x)^T h","symbols":"f(x + h) ≈ f(x) + ∇f(x)^T h","explanation":"公式正确，表示函数在点x处的泰勒展开式的一阶近似。使用了梯度符号∇，并正确表示了向量点积形式。","evidence":"Okay, so that was just a quick notation comment. Okay, so the gradient is just basically the set of all partial derivatives. And you should recognize this as the first order Taylor approximation of f developed at the point x. Okay, and what that means is this function here is affine. It is. It's linear plus a constant, number one. And number two."},{"latex":"f(x + h) \\text{ is close to } f(x) \\text{ when } h \\text{ is small}","symbols":"当h很小时，f(x + h) ≈ f(x)","explanation":"公式正确，表示当h很小时，函数值f(x + h)与f(x)接近。这是泰勒展开的直观解释，符合数学惯例。","evidence":"At the point x, it's actually correct. This thing, which you might call f hat, is actually equal to f when you plug in y equals x. That goes away, and that's just f of x. So what calculus tells you is this. It says that this function here is really close to this function if y is close to x. But when I say really close, I mean like close squared."}],"uncertainties":[],"diagram":"none","start":2718.15,"end":2892.53,"asr_flags":[],"math_clarifications":["公式1正确地表示了函数在点x处的一阶泰勒展开式，使用了标准的梯度符号和向量点积形式。公式2未明确说明仿射函数的定义，因此无法核定，需移除。公式3正确地描述了泰勒展开的近似性质，符合数学惯例。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2718.15,"text":"plus inf and minus inf and stuff like that. Whether or not people, when they write stuff"},{"start":2722.75,"text":"for convex functions actually support those things, it's another question. I don't really"},{"start":2725.97,"text":"know but okay so all right so that's the extended value extension okay now we get to um some some"},{"start":2733.85,"text":"conditions these are the traditional ones and they're based on you know tradition which is"},{"start":2738.23,"text":"our multi here our multi-hundred year tradition of calculus right and so it's actually super"},{"start":2744.01,"text":"interesting like you know the gradient of a function by the way this construction here a"},{"start":2748.17,"text":"lot of people use different notation which i despise i don't i use just one fixed notation"},{"start":2753.45,"text":"and to write a vector you have exactly two choices. You can write it like this"},{"start":2760.21,"text":"Right? A, B, C. That's like a vertical stack. Or you can write it this way. Right? So for me, the parentheses and the comma is the constructor for a vector. Yeah? Is the gradient a column vector? That's correct. That's a column vector. That's right. That's exactly right. Right. Right. Okay. So that's the gradient."},{"start":2786.8,"text":"By the way, people write all sorts of... I mean, the problem is people are programming in lots of different languages, and they start writing things like this, right? And they start writing, I don't know, right? And they start writing all sorts of weird stuff. I understand what they're saying, but I judge them. So I just make a little note. And even worse, like in the same paper or talk, you'll find these two, and then they really get judged. Like, okay."},{"start":2813.9,"text":"Okay, so that was just a quick notation comment. Okay, so the gradient is just basically the set of all partial derivatives. And you should recognize this as the first order Taylor approximation of f developed at the point x. Okay, and what that means is this function here is affine. It is. It's linear plus a constant, number one. And number two."},{"start":2840.54,"text":"At the point x, it's actually correct. This thing, which you might call f hat, is actually equal to f when you plug in y equals x. That goes away, and that's just f of x. So what calculus tells you is this. It says that this function here is really close to this function if y is close to x. But when I say really close, I mean like close squared."},{"start":2866.84,"text":"Right? That's what I meant when I said that, right? So it wasn't just the English intensifier, right? Okay, so what this says is actually super interesting. It says, and this picture actually is related basically to kind of the entire course. What this says is that the first-order Taylor expansion for a convex function, it's from calculus, right, in 1770."}],"speech_gaps":[],"frame":"../frames/v003/017.webp","frame_time":2730.15},{"title":"凸函数的全局性质与局部信息","segments":[{"id":158,"text":"We knew, I mean the notation would be different, we'd probably be writing in Latin, but we knew that the Taylor approximation was really close if the argument of the, if you're nearby the point at which you develop the expansion, right? That's what you know in 1770, right? But what we know is actually really cool. It says that basically it is a global lower bound or underestimator."},{"id":159,"text":"Okay, so that's what it tells you, right? And I think this picture, if you have this picture in your mind, you're good to go. And I've had like, and in fact, in some weird way, like the entire, all the weird stuff in the class comes down to this one picture, which is really dumb, right? So what it says that, you know, so if you think about calculus, calculus gives you a, it's a local statement. It says this approximation is really close to this thing if you're nearby."},{"id":160,"text":"And then you start saying, like, well, how close do you need to be? And you go, oh, that depends, and blah, blah, blah. Okay, and it gets complicated and vague. Everybody, that's my, that's calculus, right? This is different. This says, no, we have just a global lower bound. It's always that way, right? And so, actually, this is going to come, because I remember once I was talking to somebody about, okay, it was circuit design. We were talking about something, and I said, well, I mean, that's the best circuit design. The person looked at me and he said,"},{"id":161,"text":"How could you possibly know that? It's ridiculous. How could you possibly know that? What kind of hubris? What would make you say that? I was like, because it's true, man. It's just true. And then he looked at me and he said, why? How could you say that? And actually, it just comes down to this. So what it says is that when you have convexity, you can make global statements."},{"id":162,"text":"In calculus, you make local statements, right? If I'm minimizing a function and the gradient is zero or something like that, I can say, yeah, totally. If you move a small amount in any direction, the function is going to go up or something like that. You see what I'm saying? But you have no idea that there's not some other neighborhood you haven't ever seen before where the function is smaller, right? For  about it, because you'll have optimized a problem with a couple thousand variables. And I've got news for you."}],"speech_gaps":[],"frame":"../frames/v003/018.webp","frame_time":2905.21},{"title":"凸函数的二阶条件","segments":[{"id":164,"text":"Our couple thousand is a really big place. And that's a very strong statement when you say, yeah, I just minimized it. And the optimal objective 3.1, someone says, what does that mean? You go, it means any other X you pick that's feasible, it's going to have an objective function greater than 3.1. That's what it's saying. And you know, if you think about it, that's a crazy statement. And someone would say, like, how could you say that? Anyway, it's just because of this. You'd have to, you could mumble something about, well, you know, for convex functions."},{"id":165,"text":"From local statements, we can actually assert global things about things. Okay, I'll stop because it's just getting weird and ranting. Okay, so we'll just move on. Okay, next topic."},{"id":166,"text":"Second order conditions, right? So if a function's twice differentiable, then its Hessian is a symmetric matrix, which is the set of all partial derivatives, right? And it turns out, and this makes kind of, it's really, these are very simple things to show. It turns out a function is convex if and only if, assuming it's twice differentiable, assuming that, then its Hessian has to be positive semi-definite."},{"id":167,"text":"at all points. And this kind of makes total sense, right? Roughly speaking, if n was 1, you'd say if a function is differentiable, f prime prime is non-negative, right? So that's how you could, you know, now you could do things like someone walks up the street and says, show me that the..."},{"id":168,"text":"entropy is minus x log x is concave, right? So you differentiate it twice and you get something and say there, see? It's always non-positive. And you say therefore it's concave. So everybody got that? So this is okay. Yeah. Okay, so this is the idea of... And it kind of fits. It makes perfect sense. Oh, and by the way, the Hessian is a measure of the curvature of a function, right? So this is kind of... It's cool. It kind of tells you..."},{"id":169,"text":"So it's kind of cool. It tells you that if I give a matrix or whatever, you could be pedantic and call it a two tensor or something. And someone says, well, what do you mean the function curves up? And you may know its curvature is non-negative. And if you had to make something up about what that means, it means that. So that's the picture. Again, these are actually really easy to show."},{"id":170,"text":"I'm not going to do that, but it's a good way to just sort of start thinking about these things. Okay, so let's look at some examples. The first one, here's a quadratic function. So here, I have a symmetric, this is a quadratic form, right? It's x transpose px, where p is symmetric matrix, right? By the way, if p is not symmetric, I can replace it with its symmetric part, which is p plus p transpose divided by 2, and now it's symmetric, right?"}],"notes":["本段讲授了凸函数的二阶条件，即如果函数是二阶可微的，那么其Hessian矩阵必须是半正定的。这是判断函数是否为凸函数的一个重要条件。讲者通过一维情况（f''(x) ≥ 0）来类比，说明Hessian矩阵的半正定性是凸函数的二阶条件。","讲者提到熵函数 -x log x 是凹函数，通过求二阶导数得到其为非正，从而证明其凹性。这说明二阶导数的符号可以用来判断函数的凸性或凹性。","Hessian矩阵被描述为函数的曲率度量，这表明函数的曲率非负是凸函数的一个特征。讲者还提到，如果函数的曲率非负，那么函数在所有点上都是“向上弯曲”的。","讲者指出，对于二次函数 x^T p x，如果 p 不是对称矩阵，可以通过将其替换为对称部分（p + p^T)/2）来确保其为对称矩阵。这说明对称性在二次函数的凸性判断中是重要的。","讲者强调，这些概念的证明其实非常简单，但需要理解Hessian矩阵的性质以及其与函数凸性的关系。","讲者通过举例说明，凸函数的二阶条件是判断函数是否为凸函数的重要工具，这为后续的优化问题提供了理论基础。"],"formulas":[{"latex":"f''(x) \\text{ 是非负的}","symbols":"二阶导数非负","explanation":"该公式正确描述了凸函数的二阶导数非负性质，适用于一维情况。","evidence":"at all points. And this kind of makes total sense, right? Roughly speaking, if n was 1, you'd say if a function is differentiable, f prime prime is non-negative, right? So that's how you could, you know, now you could do things like someone walks up the street and says, show me that the..."},{"latex":"H(x) \\text{ ht? And then the Hessian is 2A transpose A, positive semi-definite. So it's done. Okay? So these are just good things to know. Now we get to a fun one. So this is the simplest convex function."},{"id":175,"text":"that most people are utterly unaware of, right? If I walk up to a person, okay, it depends on the neighborhood, but if I walk up to a person on the street and say, hey, is x convex? They're like, duh, of course it is, right? I mean, because you just draw the picture in your head. You know, people, most people, people would know that like a norm is convex because it's kind of like the triangle inequality, right? These are kind of obvious, right? Here's a super simple one. The function x squared over y, two variables, y is positive, okay? So that's it."},{"id":176,"text":"And it's not obvious that that... Oh, there are some obvious things here. If I fix y, it's convex in x because it's a positive multiple of x squared. If I fix x, it's convex in y because it's a constant 1 over y and it looks like this, right? So it's convex, right? This says much more. This says it's actually jointly convex in x and y. Okay?"},{"id":177,"text":"So, and you know, you can check, I mean, but here's a quick one. I just, I worked out the Hessian for you and expressed it as a rank one positive semi-definite matrix. That's what this is, right? By the way, the interesting part about the function is because it has rank one, that means that wherever you are on the surface, it's actually got one direction where it's flat and one where it's curving. But there was a question. If a function is jointly convex, does that mean the individual variables are also convex?"}],"notes":["本段讲解了二次函数的基本性质，包括其梯度和Hessian矩阵。二次函数的Hessian矩阵是常数矩阵，表示其具有恒定曲率。当矩阵P是半正定矩阵时，二次函数是凸函数，这是凸优化中的一个关键性质。","接着，课程讨论了最小二乘目标函数，其中矩阵A和向量B构成目标函数。展开后，梯度与正常方程相关，Hessian矩阵为2A^T A，且为半正定矩阵。这表明最小二乘问题是一个凸优化问题。","随后，课程引入了一个看似简单的凸函数：x²/y，其中y为正数。虽然固定其中一个变量时函数在另一个变量上是凸的，但该函数在两个变量上是联合凸的。这表明联合凸性并不一定意味着每个变量单独凸。","课程进一步指出，该函数的Hessian矩阵是一个秩为1的 e're going to do this is we're going to do this like a, it's going to be a calculus, right? Oh, and by the way, it's not just the right way to think of it mathematically. It's going to turn out, this is also what makes this 100% actionable in code. So everything we're about to say is math, but it's going to be, it's actually going to be backed up in code, and it's actually going to be the key to a whole lot of stuff. Okay, so."},{"id":255,"text":"You know, how do you find out if a function is convex? Well, you know, every now and then, extremely rarely, and you should do this only if you're absolutely pushed, if you have no other option, it's basically, okay, let x be in the domain, let y be in the domain, let theta be between 0 and 1, f of theta x plus 1 minus theta y, and then, you know, a lot of math and argument and stuff like that. So don't do that if you can avoid that, okay?"},{"id":256,"text":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"id":257,"text":"of the log determinant with respect to a matrix. Everybody following this? Well, okay, matrix already has two entries, two indices. It's indexed by i and j. The Hessian is indexed by four. That's i, j, k, l. Now, in my experience, the only people who are actually able to actually work with tensors, like things with four indices, are people in mechanical engineering. So they can do it. These are like weird stress-strain tensors. Some physicists can do it."},{"id":258,"text":"Or at least they say they can do it. But honestly, normal people can't do that, right? And how on earth would you write down some crazy... I said, well, show me my 100 by 100 matrix is positive. You go, let's work out the Hessian. There's 5,000 entries, so it's a 5,000 by 5... Anyway, it just gets very unattractive. Everybody following this? So, okay. All right. Okay. This is the right way to do it. And it's a calculus. And the way you do that is..."},{"id":259,"text":"We will have a bunch of atoms, things that we know are convex functions. Here's one. You know, log is concave. Exp is convex. Log sum exp is convex. Log determinant is concave, right? So you're going to have these things. You're going to have, there's not that many of them, right? 20, 30, 50, I don't know. It's not that many. You will know all of them."},{"id":260,"text":"I mean, you'll know a bunch of them, right? And then you're going to learn calculus rules, which is how you combine these things, right? And so, you know, some of these are going to be mind-numbingly simple, like here's one."}],"notes":["本段主要讲解了如何判断一个函数是否为凸函数。教授指出，直接通过定义来判断（即验证函数在任意两点之间的线段上是否始终位于函数图像的上方）是一种极端罕见的方法，仅在没有其他选择时才应使用。这种方法需要验证函数在任意两点之间的线性组合是否满足凸性条件，这在实际操作中非常繁琐。","教授进一步指出，对于二阶可导的函数，可以通过计算Hessian矩阵来判断凸性。然而，这种方法通常不推荐使用，除非函数非常简单。例如，对于对数行列式函数，计算其Hessian矩阵是判断其凹性的有效方法。","教授提到，Hessian矩阵的计算对于矩阵函数来说会变得非常复杂，因为矩阵本身具有两个索引，而Hessian矩阵则需要四个索引。这种高维张量的处理通常只有机械工程和部分物理学家能够胜任，普通人在实际操作中难以处理。","教授强调，直接计算Hessian矩阵对于大型矩阵（如100x100矩阵）来说是不现实的，因为这会涉及大量的计算和存储需求。因此，教授建议使用更高效的方法来判断凸性。","教授指出，凸优化中有一些基本的凸函数，如对数函数（凹）、指数函数（凸）、对数和指数函数（凸）以及对数行列式函数（凹）。这些基本函数构成了凸优化的基础。","最后，教授提到，学习凸优化需要掌握这些基本函数以及如何通过计算规则将它们组合起来。这些规则可能非常简单，但却是构建复杂凸优化问题的关键。"],"formulas":[{"latex":"\\text{Hessian}","symbols":"Hessian 矩阵","explanation":"Hessian 矩阵是二阶导数矩阵，用于判断函数的凸性，但原始文本中未给出具体定义，因此保留。","evidence":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"latex":"\\text{log determinant}","symbols":"对数行列式","explanation":"对数行列式是一个常见的数学对象，用于描述矩阵的性质，保留。","evidence":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"latex":"\\text{log, exp, log sum exp, log determinant}","symbols":"对数、指数、对数和指数、对数行列式","explanation":"这些是常见的凸函数或凹函数，用于构建凸函数的集合，保留。","evidence":"We will have a bunch of atoms, things that we know are convex functions. Here's one. You know, log is concave. Exp is convex. Log sum exp is convex. Log determinant is concave, right? So you're going to have these things. You're going to have, there's not that many of them, right? 20, 30, 50, I don't know. It's not that many. You will know all of them."}],"uncertainties":["Hessian of log determinant 的具体形式和计算方法未明确说明，可能需要进一步澄清。","log sum exp 的具体定义和性质未详细展开，可能需要进一步说明。"],"diagram":"none","start":4407.49,"end":4581.14,"asr_flags":[],"math_clarifications":["公式0描述的是凸函数的定义，但原始文本中未明确给出函数的凸性判断条件，因此无法确定其正确性，故移除。公式3描述的是对数行列式的 Hessian 矩阵，但原始文本中未明确给出定义，因此无法核定，移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4407.49,"text":"No, it wouldn't actually, but anyway. So, okay, so here's, so the way we're going to do this is we're going to do this like a, it's going to be a calculus, right? Oh, and by the way, it's not just the right way to think of it mathematically. It's going to turn out, this is also what makes this 100% actionable in code. So everything we're about to say is math, but it's going to be, it's actually going to be backed up in code, and it's actually going to be the key to a whole lot of stuff. Okay, so."},{"start":4435.74,"text":"Okay, so let's go over these things. You know, how do you find out if a function is convex? Well, you know, every now and then, extremely rarely, and you should do this only if you're absolutely pushed, if you have no other option, it's basically, okay, let x be in the domain, let y be in the domain, let theta be between 0 and 1, f of theta x plus 1 minus theta y, and then, you know, a lot of math and argument and stuff like that. So don't do that if you can avoid that, okay?"},{"start":4465.34,"text":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"start":4494.41,"text":"of the log determinant with respect to a matrix. Everybody following this? Well, okay, matrix already has two entries, two indices. It's indexed by i and j. The Hessian is indexed by four. That's i, j, k, l. Now, in my experience, the only people who are actually able to actually work with tensors, like things with four indices, are people in mechanical engineering. So they can do it. These are like weird stress-strain tensors. Some physicists can do it."},{"start":4523.48,"text":"Or at least they say they can do it. But honestly, normal people can't do that, right? And how on earth would you write down some crazy... I said, well, show me my 100 by 100 matrix is positive. You go, let's work out the Hessian. There's 5,000 entries, so it's a 5,000 by 5... Anyway, it just gets very unattractive. Everybody following this? So, okay. All right. Okay. This is the right way to do it. And it's a calculus. And the way you do that is..."},{"start":4550.41,"text":"We will have a bunch of atoms, things that we know are convex functions. Here's one. You know, log is concave. Exp is convex. Log sum exp is convex. Log determinant is concave, right? So you're going to have these things. You're going to have, there's not that many of them, right? 20, 30, 50, I don't know. It's not that many. You will know all of them."},{"start":4568.36,"text":"I mean, you'll know a bunch of them, right? And then you're going to learn calculus rules, which is how you combine these things, right? And so, you know, some of these are going to be mind-numbingly simple, like here's one."}],"speech_gaps":[],"frame":"../frames/v003/027.webp","frame_time":4419.49},{"title":"凸函数的性质与构造性分析","segments":[{"id":261,"text":"The sum of two convex functions is convex. Well, I mean, first of all, it's obvious. Draw a picture in your head, draw a function that goes up, another one goes up, add them together, it still curves up. Like, hello, of course, right? So, anyway, that's one. But, you know, some of these are going to be, we're going to see some very interesting ones that are not obvious in some of these rules. Not only that, it's going to turn out that at least all these four, which we teach as separate rules, it turns out, weirdly, they're all the same rule, which we'll get to."},{"id":262,"text":"Not only that, it's the main rule behind constructing code where you can verify a function is convex or concave, which we will get to later, and you will be doing in about two weeks. This is the program. It's constructive convexity analysis. That's what this is. No gradients are harmed in the proving of convexity, which you don't want to do anyway."},{"id":263,"text":"Right. And, you know, no one is going to like, you're not going to go back to the basic definition. OK, so we'll look at a couple of these and then we'll quit for today. But this is kind of this is that this is the point at which it'll start transitioning to something that you can actually that's actionable. Right. So, OK, so we'll start simple. Right. You know, here, you know, here's one, you know, 3.7 times a convex function. That's convex."},{"id":264,"text":"Well, okay, whatever. Like the curvature just went up by 3.7. It was non-negative before, and now it's even more non-negative, if that makes any sense, right? Which it doesn't, but okay, that's fine. Okay, the sum, sum of two convex, and by the way, you know, somebody has to prove these. They're, you know, these are like one-liners. I'll tell you when a couple that aren't one-liners, but these are one-liners, right? Here's one."},{"id":265,"text":"Pre-composition with an affine function. So if I have an affine function, that's ax plus b, and I take that, and then I pump it into a convex function, this is a function of x, and it's also convex. And that's not hard to show. I mean, it kind of makes sense, right? Okay, let's look at some examples, okay? So this function is going to come up later in the class."},{"id":266,"text":"It's called the log barrier. Its domain is all x's for which all of these numbers are positive. I mean, otherwise the log doesn't mean anything, right? Oh, in this class, the domain of log is R++, right? So if you're taking a class on complex analysis, that's not true, right? So just depends on the social context. But here, when I write, you know, log determinant, log, that's what it means, okay? So, okay."}],"notes":["本段讲授了凸函数的基本性质，即两个凸函数的和仍然是凸函数。讲者指出这一性质是显而易见的，可以通过图像直观理解。同时，讲者提到虽然这些性质看似简单，但有些规则在后续课程中会显得更加重要，并且这些规则本质上是同一规则的不同表现形式。","讲者强调了构造性凸性分析的重要性，这是课程中一个关键的程序。通过这一规则，学生可以编写代码来验证函数是否为凸函数或凹函数。讲者还指出，证明凸性时不需要使用梯度，这与传统的证明方法不同。","讲者提到，虽然这些性质看似简单，但有些证明需要更深入的分析。例如，3.7倍的凸函数仍然是凸函数，因为其曲率非负，且乘以正数后曲率仍然非负。讲者指出，这些证明通常是简短的，但有些可能需要更复杂的推导。","讲者介绍了预组合（pre-composition）与仿射函数的关系，即仿射函数与凸函数的组合仍然是凸函数。这一性质可以通过简单的数学推导来证明，但讲者指出，这需要一定的理解。","讲者提到一个重要的例子——对数障碍函数（log barrier），其定义域是所有正数。讲者指出，在本课程中，对数函数的定义域是正实数（R++），这与复分析中的定义不同，但取决于上下文。","讲者强调了课程中对数函数的定义域是正实数，这在后续的课程内容中会频繁出现，例如对数行列式（log determinant）等概念。讲者指出，这一定义是课程中约定俗成的，与其它数学领域可能有所不同。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4581.93,"end":4740.77,"asr_flags":[],"raw_segments":[{"start":4581.93,"text":"the sum of two convex functions is convex. Well, I mean, first of all, it's obvious. Draw a picture in your head, draw a function that goes up, another one goes up, add them together, it still curves up. Like, hello, of course, right? So, anyway, that's one. But, you know, some of these are going to be, we're going to see some very interesting ones that are not obvious in some of these rules. Not only that, it's going to turn out that at least all these four, which we teach as separate rules, it turns out, weirdly, they're all the same rule, which we'll get to."},{"start":4611.76,"text":"Not only that, it's the main rule behind constructing code where you can verify a function is convex or concave, which we will get to later, and you will be doing in about two weeks. This is the program. It's constructive convexity analysis. That's what this is. No gradients are harmed in the proving of convexity, which you don't want to do anyway."},{"start":4640.97,"text":"Right. And, you know, no one is going to like, you're not going to go back to the basic definition. OK, so we'll look at a couple of these and then we'll quit for today. But this is kind of this is that this is the point at which it'll start transitioning to something that you can actually that's actionable. Right. So, OK, so we'll start simple. Right. You know, here, you know, here's one, you know, 3.7 times a convex function. That's convex."},{"start":4670.12,"text":"Well, okay, whatever. Like the curvature just went up by 3.7. It was non-negative before, and now it's even more non-negative, if that makes any sense, right? Which it doesn't, but okay, that's fine. Okay, the sum, sum of two convex, and by the way, you know, somebody has to prove these. They're, you know, these are like one-liners. I'll tell you when a couple that aren't one-liners, but these are one-liners, right? Here's one."},{"start":4692.34,"text":"pre-composition with an affine function. So if I have an affine function, that's ax plus b, and I take that, and then I pump it into a convex function, this is a function of x, and it's also convex. And that's not hard to show. I mean, it kind of makes sense, right? Okay, let's look at some examples, okay? So this function is going to come up later in the class."},{"start":4715.77,"text":"It's called the log barrier. Its domain is all x's for which all of these numbers are positive. I mean, otherwise the log doesn't mean anything, right? Oh, in this class, the domain of log is R++, right? So if you're taking a class on complex analysis, that's not true, right? So just depends on the social context. But here, when I write, you know, log determinant, log, that's what it means, okay? So, okay."}],"speech_gaps":[],"frame":"../frames/v003/028.webp","frame_time":4593.93},{"title":"对数障碍函数的凸性","segments":[{"id":267,"text":"Okay, so here, this is the so-called log barrier of a set of linear inequalities, right? And all the inequalities have to be strict. In other words, you better have a_i transpose x less than b. Otherwise, this thing, this log doesn't even make sense, right? And so that's the log barrier. And it turns out that's going to be convex. It's got a minus in front."},{"id":268,"text":"Why? And you know the rule would go something like this. Well, let's see. This is an affine function with a concave function, right? And then concave of affine, I'm saying it the way you will say it, and you will think it by week three. This is the way you will think. You'll say concave of affine is concave, okay? Then sum of concave is concave."},{"id":269,"text":"Minus converts concave to convex. Everybody following this? You will be doing this without even thinking. It's going to be like parsing English syntax. This is how it's going to work. We're going to talk at very high levels and you're going to say things like that and that's the way it's going to work. I think what we'll do is we'll quit here. We'll finish this off next time. By the end of next lecture, by the end of this week, you will have survived. Maybe."},{"id":270,"text":"We'll see."}],"notes":["本段讲解了对数障碍函数的概念，它用于处理线性不等式约束，所有不等式必须严格成立，即 a_i^T x \u003c b。如果等式成立，则对数函数无定义。对数障碍函数是凸函数，其形式为 -Σ log(b_i - a_i^T x)。","讲者解释了对数障碍函数的凸性推导过程。首先，每个项是凹函数（因为对数函数是凹的），而线性函数是仿射函数。凹函数与仿射函数的复合仍然是凹函数。多个凹函数的和仍然是凹函数。然后，负号将凹函数转换为凸函数。","讲者强调，这种推理方式会在后续课程中自然形成，类似于英语语法的解析。学生需要在高层面理解这些概念，并在后续课程中熟练应用。","讲者提到课程将在本节课结束，相关内容将在下节课继续讲解。学生将在本周末掌握这些内容，但讲者也表示这可能只是推测。","本段内容涉及凸优化中的对数障碍函数及其凸性证明，是凸优化课程中的重要概念。"],"formulas":[{"latex":"f(x) = -\\log(b_i - a_i^T x)","symbols":"对数障碍函数","explanation":"公式正确，表示对数障碍函数，其中 $ b_i - a_i^T x $ 是严格正的，以确保对数定义域有效。","evidence":"Okay, so here, this is the so-called log barrier of a set of linear inequalities, right? And all the inequalities have to be strict. In other words, you better have a i transpose x less than b. Otherwise, this thing, this log doesn't even make sense, right? And so that's the log barrier. And it turns out that's going to be convex. It's got a minus in front."}],"uncertainties":[],"diagram":"none","start":4742.25,"end":4821.25,"asr_flags":[],"math_clarifications":["公式中的对数障碍函数 $ f(x) = -\\log(b_i - a_i^T x) $ 是凸函数，因为它是凹函数（对数函数）的负数，而凹函数的负数是凸函数。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4742.25,"text":"Okay, so here, this is the so-called log barrier of a set of linear inequalities, right? And all the inequalities have to be strict. In other words, you better have a i transpose x less than b. Otherwise, this thing, this log doesn't even make sense, right? And so that's the log barrier. And it turns out that's going to be convex. It's got a minus in front."},{"start":4765.77,"text":"Why? And you know the rule would go something like this. Well, let's see. This is an affine function with a concave function, right? And then concave of affine, I'm saying it the way you will say it, and you will think it by week three. This is the way you will think. You'll say concave of affine is concave, okay? Then sum of concave is concave."},{"start":4791.94,"text":"Minus converts concave to convex. Everybody following this? You will be doing this without even thinking. It's going to be like parsing English syntax. This is how it's going to work. We're going to talk at very high levels and you're going to say things like that and that's the way it's going to work. I think what we'll do is we'll quit here. We'll finish this off next time. By the end of next lecture, by the end of this week, you will have survived. Maybe."},{"start":4820.91,"text":"We'll see."}],"speech_gaps":[],"frame":"../frames/v003/029.webp","frame_time":4754.25}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
