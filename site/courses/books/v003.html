minus one half v x to the minus one half. That's this thing. So I get this. Then the two other terms I get."},{"start":2522.91,"text":"two terms which look like log det x to the one half, each of which is one half log det x, okay? So I end up with this expression here, okay? Now I go to eigenvalues and I say, well, I can write this thing out."}],"speech_gaps":[],"frame":"../frames/v003/015.webp","frame_time":2393.32},{"title":"凸函数的扩展与定义域处理","segments":[{"id":128,"text":"If I knew the eigenvalues of this matrix, right? And if lambda are the eigenvalues of this matrix, this matrix is symmetric, but it is not necessarily positive semi-definite, right? So anyway, I end up with an expression that looks like this. This is as a function of t. Now we're cool, because we can quickly convince ourselves that log of 1 plus t lambda is concave.","zh":"如果我知道这个矩阵的特征值，对吧？如果λ是这个矩阵的特征值，这个矩阵是对称的，但它不一定是半正定的，对吧？无论如何，我最终得到了一个看起来像这样的表达式。这是关于t的函数。现在我们很放心，因为我们可以很快说服自己，log(1 + tλ) 是凹函数。","start":2539.61,"end":2565.39},{"id":129,"text":"for any, you know, no matter what lambda is, right? It's concave, right? And then this is a sum of concave functions. We'll get to that. That's going to be concave. And that's how you do it, right? So that would be that. So, but this is already a not totally obvious thing, right? So, and in fact, I guess in a lot of classes, people would end up showing this by some very long convoluted thing or something like that. It's fine. Okay.","zh":"对于任何，你知道的，不管λ是什么，对吧？它是凹函数，对吧？然后这是凹函数的和。我们会到那一步。那将会是凹函数。这就是怎么做，对吧？所以，但这一点已经不是完全显而易见的，对吧？事实上，我想在很多课程中，人们会通过一些非常冗长复杂的步骤来证明这一点。没关系。好的。","start":2566.45,"end":2591.99},{"id":130,"text":"Okay, one more thing we want to talk about with convex functions is they actually extend very gracefully. There's a way to handle the domain very gracefully. And the way that works is this. What we do is you have a convex function f, and what we do, and let's just talk about f for a minute. So I have a convex function f. If I call, I'm going to use a dialect of maybe kind of...","zh":"好的，我们还想再谈一下凸函数，它们实际上可以非常优雅地扩展。有一种非常优雅的方式来处理定义域。其工作方式是这样的。我们有一个凸函数f，我们所做的，让我们暂时只谈论f。所以我有一个凸函数f。如果我调用F，并传入一个在其定义域内的参数X，我会得到一个数字，比如-11。这就是它的样子，对吧？这很酷。如果我在定义域外调用F，那取决于谁实现了这个函数，对吧？但你知道的，也许一切都崩溃了，或者类似的情况。但应该发生的是，你应该得到一个返回值，比如OOD，意思是超出定义域，对吧？但如果你多次调用它，你应该得到……","start":2593.31,"end":2619.65},{"id":131,"text":"street fighting computer science or something. But if I call F with an argument X that's in its domain, I get a number, like minus 11. And that's what it is, right? That's cool. If I call F at a point outside the domain, well, it depends on who implemented the function, right? But, you know, maybe everything dumps core or something like that. But what should happen is you should get a return value that's like OOD, which means out of domain, right? But if you call it a couple of times, you should get...","zh":"街头格斗计算机科学或者别的什么。但如果我在函数F的定义域内传入一个参数X，我会得到一个数字，比如-11。这就是它本来的样子，对吧？这很酷。如果我在定义域外调用F，那就要看是谁实现了这个函数，对吧？不过，你知道的，也许一切都会崩溃或者类似的情况。但应该发生的是，你应该得到一个返回值，比如OOD，意思是超出定义域，对吧？但如果你多次调用它，你应该得到……","start":2619.85,"end":2649.13},{"id":132,"text":"O-O-D and then a nasty message, which is like, you're on, uh, watch out. You do that 10 more","zh":"OOD然后是一个糟糕的消息，比如，你得小心。你再这样做10次","start":2649.23,"end":2655.29},{"id":133,"text":"times and your privileges for, you know, evaluating this function are revoked, right? That's, that's","zh":"nan或你喜欢的任何东西，对吧？好的。嗯，结果发现，你实际上应该做的是，我会","start":2655.29,"end":2660.47},{"id":134,"text":"how that should work, right? So you should get something like out of domain, right? Or N-A or","zh":"去","start":2660.47,"end":2664.85},{"id":135,"text":"nan or whatever you like, right? Okay. Um, so it turns out what you do instead is I'm going to","zh":"做","start":2664.85,"end":2671.25},{"id":136,"text":"define a new function, F tilde. It's going to be defined for everything. And I just, I just,","zh":"定义一个新的函数，F 带波浪线。它将被定义在所有域上。而且我只是，我只是，","start":2671.25,"end":2675.19},{"id":137,"text":"if you're out of the domain you just call yourself infinity that's it and actually what you're going","zh":"如果你不在定义域内，你就把自己称为无穷大，就是这样，实际上你会发现，在那个不等式中，你可以在脑海中推导出这一点，","start":2675.19,"end":2681.29},{"id":138,"text":"to find out is that in that inequality works you can figure that out in your head um and it all","zh":"一切都会，嗯，与这个函数一起正常工作。实际上，这有点好，因为它意味着很多情况下我们会处理可以取正无穷值的函数，","start":2681.29,"end":2686.63},{"id":139,"text":"everything just works right uh with this and actually it's kind of nice because it means a","zh":"就是这样，这是一种方式，我们将会看到如何表达约束条件，这就是它的工作方式。所以，好的。所以一切，我的意思是，这只是记账，但它确实，它确实，","start":2686.63,"end":2691.19},{"id":140,"text":"lot of times we'll we'll work with functions that can have values of plus infinity and those are","zh":"起作用。我不认为像，你知道的，什么IEEE 488之类的东西，我不认为它","start":2691.19,"end":2695.87},{"id":141,"text":"just like that that's a way to uh we'll see to express constraints right that's how that's going","zh":"会这样。","start":2695.87,"end":2701.95},{"id":142,"text":"going to work. So, okay. So it all, I mean, it's just bookkeeping, but it kind of, it does,","zh":"它确实起作用。我不认为像，你知道的，什么IEEE 488之类的东西，我不认为它","start":2701.95,"end":2708.33},{"id":143,"text":"it does work. I don't think like, you know, whatever IEEE 488 thing, I don't think it","zh":"这有效。我不认为像，你知道的， whatever IEEE 488 的事情，我不这么认为","start":2708.37,"end":2713.61},{"id":144,"text":"supports this. Actually, I should check if it, I mean, it actually does. They do have things like","zh":"支持这一点。实际上，我应该检查一下，我的意思是，它实际上确实如此。他们确实有一些类似的东西","start":2713.61,"end":2718.15}],"notes":["本段讨论了凸函数在定义域外的处理方式，提出了一种通过将函数值设为无穷大来扩展函数定义域的方法。这种方法允许函数在定义域外仍然保持数学上的合理性，便于处理约束条件。","讲者提到，当函数在定义域外被调用时，应返回一个表示“超出定义域”的值，如“OOD”或“NaN”，但为了简化处理，可以将这些情况统一设为无穷大。这种方法在数学上是合理的，因为它允许在不改变函数凸性的情况下处理扩展定义域的问题。","讲者还提到，这种扩展方式在处理优化问题时非常有用，因为可以将约束条件自然地融入到函数中，而无需额外的处理步骤。","讲者指出，虽然这种方法在数学上是合理的，但实际实现时可能需要考虑计算平台（如IEEE标准）是否支持这种处理方式。讲者表示需要进一步确认这一点。","讲者强调，这种扩展方式是一种“簿记”操作，即在不改变函数本质的情况下，通过定义域的扩展来简化问题处理。","讲者最后提到，这种方法在处理凸函数时非常有用，因为它允许函数在定义域外仍然保持数学上的合理性，从而简化了优化问题的处理。"],"formulas":[],"uncertainties":["IEEE 488 thing","They do have things like"],"diagram":"none","start":2539.61,"end":2718.15,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":2539.61,"text":"If I knew the eigenvalues of this matrix, right? And if lambda are the eigenvalues of this matrix, this matrix is symmetric, but it is not necessarily positive semi-definite, right? So anyway, I end up with an expression that looks like this. This is as a function of t. Now we're cool, because we can quickly convince ourselves that log of 1 plus t lambda is concave."},{"start":2566.45,"text":"for any, you know, no matter what lambda is, right? It's concave, right? And then this is a sum of concave functions. We'll get to that. That's going to be concave. And that's how you do it, right? So that would be that. So, but this is already a not totally obvious thing, right? So, and in fact, I guess in a lot of classes, people would end up showing this by some very long convoluted thing or something like that. It's fine. Okay."},{"start":2593.31,"text":"Okay, one more thing we want to talk about with convex functions is they actually extend very gracefully. There's a way to handle the domain very gracefully. And the way that works is this. What we do is you have a convex function f, and what we do, and let's just talk about f for a minute. So I have a convex function f. If I call, I'm going to use a dialect of maybe kind of..."},{"start":2619.85,"text":"street fighting computer science or something. But if I call F with an argument X that's in its domain, I get a number, like minus 11. And that's what it is, right? That's cool. If I call F at a point outside the domain, well, it depends on who implemented the function, right? But, you know, maybe everything dumps core or something like that. But what should happen is you should get a return value that's like OOD, which means out of domain, right? But if you call it a couple of times, you should get..."},{"start":2649.23,"text":"O-O-D and then a nasty message, which is like, you're on, uh, watch out. You do that 10 more"},{"start":2655.29,"text":"times and your privileges for, you know, evaluating this function are revoked, right? That's, that's"},{"start":2660.47,"text":"how that should work, right? So you should get something like out of domain, right? Or N-A or"},{"start":2664.85,"text":"nan or whatever you like, right? Okay. Um, so it turns out what you do instead is I'm going to"},{"start":2671.25,"text":"define a new function, F tilde. It's going to be defined for everything. And I just, I just,"},{"start":2675.19,"text":"if you're out of the domain you just call yourself infinity that's it and actually what you're going"},{"start":2681.29,"text":"to find out is that in that inequality works you can figure that out in your head um and it all"},{"start":2686.63,"text":"everything just works right uh with this and actually it's kind of nice because it means a"},{"start":2691.19,"text":"lot of times we'll we'll work with functions that can have values of plus infinity and those are"},{"start":2695.87,"text":"just like that that's a way to uh we'll see to express constraints right that's how that's going"},{"start":2701.95,"text":"going to work. So, okay. So it all, I mean, it's just bookkeeping, but it kind of, it does,"},{"start":2708.37,"text":"it does work. I don't think like, you know, whatever IEEE 488 thing, I don't think it"},{"start":2713.61,"text":"supports this. Actually, I should check if it, I mean, it actually does. They do have things like"}],"speech_gaps":[],"frame":"../frames/v003/016.webp","frame_time":2551.61},{"title":"梯度与向量表示","segments":[{"id":145,"text":"plus inf and minus inf and stuff like that. Whether or not people, when they write stuff","zh":"加上正无穷和负无穷之类的东西。人们在写这些东西时，是否真的支持这些情况，这是另一个问题。我不太确定，但好吧，那么这就是扩展值扩展，现在我们谈到一些条件，这些是传统的条件，它们基于我们这里一个多世纪的传统，也就是微积分的传统。","start":2718.15,"end":2722.75},{"id":146,"text":"for convex functions actually support those things, it's another question. I don't really","zh":"对于凸函数，实际上是否支持这些情况，这是另一个问题。我不太确定，但好吧，那么这就是扩展值扩展，现在我们谈到一些条件，这些是传统的条件，它们基于我们这里一个多世纪的传统，也就是微积分的传统。","start":2722.75,"end":2725.97},{"id":147,"text":"know but okay so all right so that's the extended value extension okay now we get to um some some","zh":"这些是传统的条件，它们基于我们这里一个多世纪的传统，也就是微积分的传统。实际上，这非常有趣，比如函数的梯度，顺便说一句，这里的构造，很多人使用不同的符号，我非常讨厌这种做法，我不使用，我只使用一种固定的符号。","start":2725.97,"end":2733.85},{"id":148,"text":"conditions these are the traditional ones and they're based on you know tradition which is","zh":"要写出一个向量，你只有两种选择。你可以这样写","start":2733.85,"end":2738.23},{"id":149,"text":"our multi here our multi-hundred year tradition of calculus right and so it's actually super","zh":"这些是传统的条件，它们基于我们这里一个多世纪的传统，也就是微积分的传统。实际上，这非常有趣，比如函数的梯度，顺便说一句，这里的构造，很多人使用不同的符号，我非常讨厌这种做法，我不使用，我只使用一种固定的符号。","start":2738.23,"end":2744.01},{"id":150,"text":"interesting like you know the gradient of a function by the way this construction here a","zh":"要写出一个向量，你只有两种选择。你可以这样写","start":2744.01,"end":2748.17},{"id":151,"text":"lot of people use different notation which i despise i don't i use just one fixed notation","zh":"很多人使用不同的符号，我非常讨厌这种做法，我不使用，我只使用一种固定的符号。","start":2748.17,"end":2753.45},{"id":152,"text":"and to write a vector you have exactly two choices. You can write it like this","zh":"要写出一个向量，你只有两种选择。你可以这样写","start":2753.45,"end":2759.49},{"id":153,"text":"Right? A, B, C. That's like a vertical stack. Or you can write it this way. Right? So for me, the parentheses and the comma is the constructor for a vector. Yeah? Is the gradient a column vector? That's correct. That's a column vector. That's right. That's exactly right. Right. Right. Okay. So that's the gradient.","zh":"对吧？A、B、C。这像是一个垂直堆叠。或者你可以这样写。对吧？对我来说，括号和逗号是向量的构造器。对吗？梯度是不是列向量？这是正确的。这是一个列向量。对的。完全正确。对。对。好的。所以这就是梯度。","start":2760.21,"end":2786.33},{"id":154,"text":"By the way, people write all sorts of... I mean, the problem is people are programming in lots of different languages, and they start writing things like this, right? And they start writing, I don't know, right? And they start writing all sorts of weird stuff. I understand what they're saying, but I judge them. So I just make a little note. And even worse, like in the same paper or talk, you'll find these two, and then they really get judged. Like, okay.","zh":"顺便说一句，人们写各种各样的……我的意思是，问题在于人们用很多不同的语言编程，他们开始写像这样的东西，对吧？他们开始写，我不知道，对吧？他们开始写各种奇怪的东西。我明白他们在说什么，但我评判他们。所以我只是做一点小笔记。更糟糕的是，在同一篇论文或演讲中，你会发现这两种写法，然后他们真的会被评判。比如，好的。","start":2786.8,"end":2813.44},{"id":155,"text":"Okay, so that was just a quick notation comment. Okay, so the gradient is just basically the set of all partial derivatives. And you should recognize this as the first order Taylor approximation of f developed at the point x. Okay, and what that means is this function here is affine. It is. It's linear plus a constant, number one. And number two.","zh":"好的，刚才只是快速的符号评论。好的，梯度基本上就是所有偏导数的集合。你应该认识到这是在点x处的f的一阶泰勒展开近似。好的，这意味着这里的函数是仿射的。是的。它是线性加上一个常数，第一点。第二点。","start":2813.9,"end":2839.94},{"id":156,"text":"At the point x, it's actually correct. This thing, which you might call f hat, is actually equal to f when you plug in y equals x. That goes away, and that's just f of x. So what calculus tells you is this. It says that this function here is really close to this function if y is close to x. But when I say really close, I mean like close squared.","zh":"在点x处，这是正确的。你可能称之为f帽的这个东西，实际上在你代入y等于x时，等于f。这个项就消失了，只剩下f的x。所以微积分告诉你的就是这个。它说这里的函数如果y接近x，那么这个函数实际上非常接近这个函数。但当我说到非常接近时，我的意思是接近的平方。","start":2840.54,"end":2865.86},{"id":157,"text":"Right? That's what I meant when I said that, right? So it wasn't just the English intensifier, right? Okay, so what this says is actually super interesting. It says, and this picture actually is related basically to kind of the entire course. What this says is that the first-order Taylor expansion for a convex function, it's from calculus, right, in 1770.","zh":"对吧？这就是我之前说的那个意思，对吧？所以它不只是一个英语的强调词，对吧？好的，这实际上是非常有趣的。它说，而且这张图实际上基本上和整个课程有关。它说的是凸函数的一阶泰勒展开，这是微积分，对吧，在1770年左右。","start":2866.84,"end":2892.53}],"notes":["本段主要讨论了向量的表示方式以及梯度的定义。教授指出，向量有两种表示方式：一种是垂直排列的元素，另一种是使用括号和逗号来构造向量。教授强调了梯度是一个列向量，并指出梯度是函数所有偏导数的集合。","教授还提到，由于编程语言的不同，人们在书写向量时可能会使用不同的符号，这导致了混乱。他批评了这种不一致的写法，并指出在同一篇论文或演讲中，这种不一致的写法会受到批评。","教授进一步解释了梯度的定义，指出梯度是函数的一阶泰勒展开，即函数在某一点的线性近似。这种近似是仿射函数，即线性函数加上一个常数项。","教授还提到，当点y接近点x时，泰勒展开的函数与原函数非常接近，这里的“非常接近”指的是平方误差的最小化。","最后，教授指出，一阶泰勒展开对于凸函数来说非常重要，它与整个课程内容密切相关，并提到这种展开方法起源于1770年的微积分。"],"formulas":[{"latex":"f(x + h) \\text{ is approximately } f(x) + \\nabla f(x)^T h","symbols":"f(x + h) ≈ f(x) + ∇f(x)^T h","explanation":"公式正确，表示函数在点x处的泰勒展开式的一阶近似。使用了梯度符号∇，并正确表示了向量点积形式。","evidence":"Okay, so that was just a quick notation comment. Okay, so the gradient is just basically the set of all partial derivatives. And you should recognize this as the first order Taylor approximation of f developed at the point x. Okay, and what that means is this function here is affine. It is. It's linear plus a constant, number one. And number two."},{"latex":"f(x + h) \\text{ is close to } f(x) \\text{ when } h \\text{ is small}","symbols":"当h很小时，f(x + h) ≈ f(x)","explanation":"公式正确，表示当h很小时，函数值f(x + h)与f(x)接近。这是泰勒展开的直观解释，符合数学惯例。","evidence":"At the point x, it's actually correct. This thing, which you might call f hat, is actually equal to f when you plug in y equals x. That goes away, and that's just f of x. So what calculus tells you is this. It says that this function here is really close to this function if y is close to x. But when I say really close, I mean like close squared."}],"uncertainties":[],"diagram":"none","start":2718.15,"end":2892.53,"asr_flags":[],"math_clarifications":["公式1正确地表示了函数在点x处的一阶泰勒展开式，使用了标准的梯度符号和向量点积形式。公式2未明确说明仿射函数的定义，因此无法核定，需移除。公式3正确地描述了泰勒展开的近似性质，符合数学惯例。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":2718.15,"text":"plus inf and minus inf and stuff like that. Whether or not people, when they write stuff"},{"start":2722.75,"text":"for convex functions actually support those things, it's another question. I don't really"},{"start":2725.97,"text":"know but okay so all right so that's the extended value extension okay now we get to um some some"},{"start":2733.85,"text":"conditions these are the traditional ones and they're based on you know tradition which is"},{"start":2738.23,"text":"our multi here our multi-hundred year tradition of calculus right and so it's actually super"},{"start":2744.01,"text":"interesting like you know the gradient of a function by the way this construction here a"},{"start":2748.17,"text":"lot of people use different notation which i despise i don't i use just one fixed notation"},{"start":2753.45,"text":"and to write a vector you have exactly two choices. You can write it like this"},{"start":2760.21,"text":"Right? A, B, C. That's like a vertical stack. Or you can write it this way. Right? So for me, the parentheses and the comma is the constructor for a vector. Yeah? Is the gradient a column vector? That's correct. That's a column vector. That's right. That's exactly right. Right. Right. Okay. So that's the gradient."},{"start":2786.8,"text":"By the way, people write all sorts of... I mean, the problem is people are programming in lots of different languages, and they start writing things like this, right? And they start writing, I don't know, right? And they start writing all sorts of weird stuff. I understand what they're saying, but I judge them. So I just make a little note. And even worse, like in the same paper or talk, you'll find these two, and then they really get judged. Like, okay."},{"start":2813.9,"text":"Okay, so that was just a quick notation comment. Okay, so the gradient is just basically the set of all partial derivatives. And you should recognize this as the first order Taylor approximation of f developed at the point x. Okay, and what that means is this function here is affine. It is. It's linear plus a constant, number one. And number two."},{"start":2840.54,"text":"At the point x, it's actually correct. This thing, which you might call f hat, is actually equal to f when you plug in y equals x. That goes away, and that's just f of x. So what calculus tells you is this. It says that this function here is really close to this function if y is close to x. But when I say really close, I mean like close squared."},{"start":2866.84,"text":"Right? That's what I meant when I said that, right? So it wasn't just the English intensifier, right? Okay, so what this says is actually super interesting. It says, and this picture actually is related basically to kind of the entire course. What this says is that the first-order Taylor expansion for a convex function, it's from calculus, right, in 1770."}],"speech_gaps":[],"frame":"../frames/v003/017.webp","frame_time":2730.15},{"title":"凸函数的全局性质与局部信息","segments":[{"id":158,"text":"We knew, I mean the notation would be different, we'd probably be writing in Latin, but we knew that the Taylor approximation was really close if the argument of the, if you're nearby the point at which you develop the expansion, right? That's what you know in 1770, right? But what we know is actually really cool. It says that basically it is a global lower bound or underestimator.","zh":"我们知道，我的意思是记号会不同，我们可能会用拉丁字母来写，但我们知道，如果在展开点附近，泰勒近似值会非常接近原函数，对吧？这就是1770年时人们所知道的，对吧？但我们现在知道的是实际上非常酷的。它说明基本上这是一个全局下界或低估函数。","start":2893.21,"end":2917.81},{"id":159,"text":"Okay, so that's what it tells you, right? And I think this picture, if you have this picture in your mind, you're good to go. And I've had like, and in fact, in some weird way, like the entire, all the weird stuff in the class comes down to this one picture, which is really dumb, right? So what it says that, you know, so if you think about calculus, calculus gives you a, it's a local statement. It says this approximation is really close to this thing if you're nearby.","zh":"好的，所以这就是它告诉你的内容，对吧？我想如果你脑海中有了这张图，你就准备好了。事实上，以某种奇怪的方式，整个课堂上所有奇怪的内容都归结到这张图，这真的很简单，对吧？它说的是，你知道的，如果你考虑微积分，微积分给你的是一个局部陈述。它说，如果你在附近，这个近似值会非常接近这个函数。","start":2918.79,"end":2943.09},{"id":160,"text":"And then you start saying, like, well, how close do you need to be? And you go, oh, that depends, and blah, blah, blah. Okay, and it gets complicated and vague. Everybody, that's my, that's calculus, right? This is different. This says, no, we have just a global lower bound. It's always that way, right? And so, actually, this is going to come, because I remember once I was talking to somebody about, okay, it was circuit design. We were talking about something, and I said, well, I mean, that's the best circuit design. The person looked at me and he said,","zh":"然后你开始问，比如，你需要多接近呢？你回答，哦，这取决于，等等，等等。好的，它变得复杂和模糊。每个人，这就是我的微积分，对吧？这不同。它说，不，我们有一个全局下界。它总是这样，对吧？因此，实际上，这会来，因为我记得有一次我跟某人谈论电路设计。我们在谈论某件事，我说，嗯，我的意思是，这就是最好的电路设计。那个人看着我说，你怎么可能知道这一点？这很荒谬。你怎么可能知道这一点？什么傲慢？什么会让你这么说？我回答说，因为这是真的，伙计。它就是真的。然后他看着我说，为什么？你怎么能这么说？实际上，这仅仅归结到这一点。所以它说的是，当你有凸性时，你可以做出全局陈述。","start":2943.77,"end":2970.35},{"id":161,"text":"How could you possibly know that? It's ridiculous. How could you possibly know that? What kind of hubris? What would make you say that? I was like, because it's true, man. It's just true. And then he looked at me and he said, why? How could you say that? And actually, it just comes down to this. So what it says is that when you have convexity, you can make global statements.","zh":"好的，所以这就是它告诉你的内容，对吧？我想如果你脑海中有了这张图，你就准备好了。事实上，以某种奇怪的方式，整个课堂上所有奇怪的内容都归结到这张图，这真的很简单，对吧？它说的是，你知道的，如果你考虑微积分，微积分给你的是一个局部陈述。它说，如果你在附近，这个近似值会非常接近这个函数。","start":2971.6,"end":2997.58},{"id":162,"text":"In calculus, you make local statements, right? If I'm minimizing a function and the gradient is zero or something like that, I can say, yeah, totally. If you move a small amount in any direction, the function is going to go up or something like that. You see what I'm saying? But you have no idea that there's not some other neighborhood you haven't ever seen before where the function is smaller, right? For convex functions, that can't happen. Everybody got this? So roughly speaking, it says that...","zh":"在微积分中，你做出的是局部陈述，对吧？如果我在最小化一个函数，而梯度为零或者类似的情况，我可以说，是的，完全正确。如果你在任何方向上移动一个小量，函数值都会增加或者类似的情况。你明白我的意思吗？但是你并不知道是否存在某个你从未见过的邻域，那里的函数值更小，对吧？对于凸函数，这种情况不会发生。大家明白了吗？所以粗略地说，它说明了……","start":2998.32,"end":3025.4},{"id":163,"text":"From local information, you actually get global inequalities. I know it sounds like I'm making a big deal out of it, but to be perfectly honest, this is the point of the whole class. Not that you care about this, but you will later... I don't know, by the sixth week, you'll be solving problems and saying, yeah, that's the best. And you don't even think about it, because you'll have optimized a problem with a couple thousand variables. And I've got news for you.","zh":"通过局部信息，你实际上可以获得全局不等式。我知道这听起来像是我夸大其词，但说实话，这就是这门课的重点。不是说你关心这个，但你以后会关心……我不知道，到了第六周，你就会在解决问题时说，是的，这就是最好的。你甚至不会去想它，因为你已经优化了一个包含几千个变量的问题。我有个消息要告诉你。","start":3025.76,"end":3053.36}],"notes":["本段讲授了凸函数的一个核心性质，即通过局部信息可以推导出全局不等式。这与传统的微积分方法形成对比，后者只能提供局部信息。凸函数的这种特性使得在优化问题中可以做出全局性的判断，而无需考虑其他未被观察到的区域。","讲者通过一个关于电路设计的对话例子，说明了凸函数的全局性质如何在实际问题中发挥作用。他指出，当一个函数是凸函数时，可以确定其最小值的全局性质，而无需依赖于局部信息。","讲者强调了凸函数与非凸函数在信息利用上的根本区别。对于非凸函数，即使在局部区域找到极小值，也无法保证这是全局最小值，而凸函数则可以确保这一点。","讲者提到，这种从局部信息推导出全局性质的能力是本课程的核心内容之一。这种能力在后续的学习中会变得非常重要，尤其是在处理大规模优化问题时。","讲者还指出，这种全局性质使得在优化过程中可以更加自信地做出决策，而无需担心存在其他更优的解。这种性质在实际应用中非常有用，尤其是在处理高维优化问题时。","最后，讲者提到，这种能力在第六周的学习中会变得非常重要，学生将能够熟练地应用这些概念来解决实际问题，而无需过多思考其背后的理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2893.21,"end":3053.36,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2893.21,"text":"We knew, I mean the notation would be different, we'd probably be writing in Latin, but we knew that the Taylor approximation was really close if the argument of the, if you're nearby the point at which you develop the expansion, right? That's what you know in 1770, right? But what we know is actually really cool. It says that basically it is a global lower bound or underestimator."},{"start":2918.79,"text":"Okay, so that's what it tells you, right? And I think this picture, if you have this picture in your mind, you're good to go. And I've had like, and in fact, in some weird way, like the entire, all the weird stuff in the class comes down to this one picture, which is really dumb, right? So what it says that, you know, so if you think about calculus, calculus gives you a, it's a local statement. It says this approximation is really close to this thing if you're nearby."},{"start":2943.77,"text":"And then you start saying, like, well, how close do you need to be? And you go, oh, that depends, and blah, blah, blah. Okay, and it gets complicated and vague. Everybody, that's my, that's calculus, right? This is different. This says, no, we have just a global lower bound. It's always that way, right? And so, actually, this is going to come, because I remember once I was talking to somebody about, okay, it was circuit design. We were talking about something, and I said, well, I mean, that's the best circuit design. The person looked at me and he said,"},{"start":2971.6,"text":"How could you possibly know that? It's ridiculous. How could you possibly know that? What kind of hubris? What would make you say that? I was like, because it's true, man. It's just true. And then he looked at me and he said, why? How could you say that? And actually, it just comes down to this. So what it says is that when you have convexity, you can make global statements."},{"start":2998.32,"text":"In calculus, you make local statements, right? If I'm minimizing a function and the gradient is zero or something like that, I can say, yeah, totally. If you move a small amount in any direction, the function is going to go up or something like that. You see what I'm saying? But you have no idea that there's not some other neighborhood you haven't ever seen before where the function is smaller, right? For convex functions, that can't happen. Everybody got this? So roughly speaking, it says that..."},{"start":3025.76,"text":"From local information, you actually get global inequalities. I know it sounds like I'm making a big deal out of it, but to be perfectly honest, this is the point of the whole class. Not that you care about this, but you will later... I don't know, by the sixth week, you'll be solving problems and saying, yeah, that's the best. And you don't even think about it, because you'll have optimized a problem with a couple thousand variables. And I've got news for you."}],"speech_gaps":[],"frame":"../frames/v003/018.webp","frame_time":2905.21},{"title":"凸函数的二阶条件","segments":[{"id":164,"text":"Our couple thousand is a really big place. And that's a very strong statement when you say, yeah, I just minimized it. And the optimal objective 3.1, someone says, what does that mean? You go, it means any other X you pick that's feasible, it's going to have an objective function greater than 3.1. That's what it's saying. And you know, if you think about it, that's a crazy statement. And someone would say, like, how could you say that? Anyway, it's just because of this. You'd have to, you could mumble something about, well, you know, for convex functions.","zh":"我们的几千个是真的很庞大的地方。当你说到，是的，我刚刚最小化了它，这是一个非常强烈的声明。而最优目标值3.1，有人会问，这到底是什么意思？你回答，这意味着你选择的任何其他可行的X，其目标函数值都会大于3.1。这就是它的意思。你知道吗，如果你仔细想想，这其实是一个疯狂的声明。有人会说，你怎么能这么说呢？不管怎样，这仅仅是因为这个原因。你得，你可以说点什么，比如，嗯，你知道的，对于凸函数来说。","start":3053.79,"end":3079.07},{"id":165,"text":"From local statements, we can actually assert global things about things. Okay, I'll stop because it's just getting weird and ranting. Okay, so we'll just move on. Okay, next topic.","zh":"从局部的陈述中，我们实际上可以对整体做出一些断言。好的，我停下来吧，因为这变得有点奇怪和发牢骚了。好的，我们就这样继续下去。好的，下一个主题。","start":3080.06,"end":3092.37},{"id":166,"text":"Second order conditions, right? So if a function's twice differentiable, then its Hessian is a symmetric matrix, which is the set of all partial derivatives, right? And it turns out, and this makes kind of, it's really, these are very simple things to show. It turns out a function is convex if and only if, assuming it's twice differentiable, assuming that, then its Hessian has to be positive semi-definite.","zh":"二阶条件，对吧？如果一个函数是二阶可导的，那么它的Hessian矩阵是一个对称矩阵，包含了所有的偏导数，对吧？事实上，这其实是非常简单的事情，可以证明。结果发现，一个函数是凸的，当且仅当，假设它是二阶可导的，那么它的Hessian矩阵必须是半正定的。","start":3093.51,"end":3121.51},{"id":167,"text":"at all points. And this kind of makes total sense, right? Roughly speaking, if n was 1, you'd say if a function is differentiable, f prime prime is non-negative, right? So that's how you could, you know, now you could do things like someone walks up the street and says, show me that the...","zh":"在所有点上。这在某种程度上是完全合理的，对吧？粗略地说，如果n是1，你会说，如果一个函数是可导的，那么它的二阶导数是非负的，对吧？所以你可以做这样的事情，比如有人走上街说，展示给我看……","start":3122.23,"end":3139.57},{"id":168,"text":"entropy is minus x log x is concave, right? So you differentiate it twice and you get something and say there, see? It's always non-positive. And you say therefore it's concave. So everybody got that? So this is okay. Yeah. Okay, so this is the idea of... And it kind of fits. It makes perfect sense. Oh, and by the way, the Hessian is a measure of the curvature of a function, right? So this is kind of... It's cool. It kind of tells you...","zh":"熵是负x乘以log x，这是一个凹函数，对吧？所以你对它进行两次求导，得到一个结果，并说，看，它总是非正的。然后你说因此它是凹的。大家都明白了吗？所以这样是可以的。是的。好的，这就是这个想法。它在某种程度上是符合的。它完全合情合理。顺便说一句，Hessian矩阵是函数曲率的度量，对吧？所以这在某种程度上……它很酷。它在某种程度上告诉你……","start":3140.76,"end":3167.77},{"id":169,"text":"So it's kind of cool. It tells you that if I give a matrix or whatever, you could be pedantic and call it a two tensor or something. And someone says, well, what do you mean the function curves up? And you may know its curvature is non-negative. And if you had to make something up about what that means, it means that. So that's the picture. Again, these are actually really easy to show.","zh":"所以这有点酷。它告诉你，如果你给我一个矩阵或者任何东西，你也可以很挑剔地称它为一个二阶张量。有人可能会问，你所说的函数曲率向上是什么意思？你可能知道它的曲率是非负的。如果你需要编造一些关于这意味着什么的说法，那它就是这个意思。这就是图像。再次强调，这些其实非常容易证明。","start":3168.33,"end":3194.59},{"id":170,"text":"I'm not going to do that, but it's a good way to just sort of start thinking about these things. Okay, so let's look at some examples. The first one, here's a quadratic function. So here, I have a symmetric, this is a quadratic form, right? It's x transpose px, where p is symmetric matrix, right? By the way, if p is not symmetric, I can replace it with its symmetric part, which is p plus p transpose divided by 2, and now it's symmetric, right?","zh":"我不会这么做，但这是一个很好的方式，开始思考这些问题。好的，让我们来看一些例子。第一个例子，这里有一个二次函数。所以这里，我有一个对称矩阵，这是一个二次型，对吧？它是x转置乘以p乘以x，其中p是对称矩阵，对吧？顺便说一句，如果p不是对称的，我可以将其替换为它的对称部分，即p加上p转置除以2，这样它就变成对称的了，对吧？","start":3195.77,"end":3220.61}],"notes":["本段讲授了凸函数的二阶条件，即如果函数是二阶可微的，那么其Hessian矩阵必须是半正定的。这是判断函数是否为凸函数的一个重要条件。讲者通过一维情况（f''(x) ≥ 0）来类比，说明Hessian矩阵的半正定性是凸函数的二阶条件。","讲者提到熵函数 -x log x 是凹函数，通过求二阶导数得到其为非正，从而证明其凹性。这说明二阶导数的符号可以用来判断函数的凸性或凹性。","Hessian矩阵被描述为函数的曲率度量，这表明函数的曲率非负是凸函数的一个特征。讲者还提到，如果函数的曲率非负，那么函数在所有点上都是“向上弯曲”的。","讲者指出，对于二次函数 x^T p x，如果 p 不是对称矩阵，可以通过将其替换为对称部分（p + p^T)/2）来确保其为对称矩阵。这说明对称性在二次函数的凸性判断中是重要的。","讲者强调，这些概念的证明其实非常简单，但需要理解Hessian矩阵的性质以及其与函数凸性的关系。","讲者通过举例说明，凸函数的二阶条件是判断函数是否为凸函数的重要工具，这为后续的优化问题提供了理论基础。"],"formulas":[{"latex":"f''(x) \\text{ 是非负的}","symbols":"二阶导数非负","explanation":"该公式正确描述了凸函数的二阶导数非负性质，适用于一维情况。","evidence":"at all points. And this kind of makes total sense, right? Roughly speaking, if n was 1, you'd say if a function is differentiable, f prime prime is non-negative, right? So that's how you could, you know, now you could do things like someone walks up the street and says, show me that the..."},{"latex":"H(x) \\text{ 是半正定的}","symbols":"Hessian矩阵半正定","explanation":"该公式正确描述了凸函数的Hessian矩阵半正定性质，适用于多维情况。","evidence":"Second order conditions, right? So if a function's twice differentiable, then its Hessian is a symmetric matrix, which is the set of all partial derivatives, right? And it turns out, and this makes kind of, it's really, these are very simple things to show. It turns out a function is convex if and only if, assuming it's twice differentiable, assuming that, then its Hessian has to be positive semi-definite."},{"latex":"x^T p x","symbols":"二次型","explanation":"该公式正确表示了二次型，适用于对称矩阵 $ p $ 的情况。","evidence":"I'm not going to do that, but it's a good way to just sort of start thinking about these things. Okay, so let's look at some examples. The first one, here's a quadratic function. So here, I have a symmetric, this is a quadratic form, right? It's x transpose px, where p is symmetric matrix, right? By the way, if p is not symmetric, I can replace it with its symmetric part, which is p plus p transpose divided by 2, and now it's symmetric, right?"},{"latex":"p_{\\text{symmetric}} = \\frac{p + p^T}{2}","symbols":"对称矩阵的构造","explanation":"该公式正确表示了如何将非对称矩阵转换为对称矩阵，适用于二次型的构造。","evidence":"I'm not going to do that, but it's a good way to just sort of start thinking about these things. Okay, so let's look at some examples. The first one, here's a quadratic function. So here, I have a symmetric, this is a quadratic form, right? It's x transpose px, where p is symmetric matrix, right? By the way, if p is not symmetric, I can replace it with its symmetric part, which is p plus p transpose divided by 2, and now it's symmetric, right?"}],"uncertainties":["our couple thousand is a really big place"],"diagram":"none","start":3053.79,"end":3220.61,"asr_flags":[],"math_clarifications":["所有公式均基于原文内容，未发现数学错误或需要进一步核对的数学表达。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3053.79,"text":"our couple thousand is a really big place. And that's a very strong statement when you say, yeah, I just minimized it. And the optimal objective 3.1, someone says, what does that mean? You go, it means any other X you pick that's feasible, it's going to have an objective function greater than 3.1. That's what it's saying. And you know, if you think about it, that's a crazy statement. And someone would say, like, how could you say that? Anyway, it's just because of this. You'd have to, you could mumble something about, well, you know, for convex functions."},{"start":3080.06,"text":"From local statements, we can actually assert global things about things. Okay, I'll stop because it's just getting weird and ranting. Okay, so we'll just move on. Okay, next topic."},{"start":3093.51,"text":"Second order conditions, right? So if a function's twice differentiable, then its Hessian is a symmetric matrix, which is the set of all partial derivatives, right? And it turns out, and this makes kind of, it's really, these are very simple things to show. It turns out a function is convex if and only if, assuming it's twice differentiable, assuming that, then its Hessian has to be positive semi-definite."},{"start":3122.23,"text":"at all points. And this kind of makes total sense, right? Roughly speaking, if n was 1, you'd say if a function is differentiable, f prime prime is non-negative, right? So that's how you could, you know, now you could do things like someone walks up the street and says, show me that the..."},{"start":3140.76,"text":"entropy is minus x log x is concave, right? So you differentiate it twice and you get something and say there, see? It's always non-positive. And you say therefore it's concave. So everybody got that? So this is okay. Yeah. Okay, so this is the idea of... And it kind of fits. It makes perfect sense. Oh, and by the way, the Hessian is a measure of the curvature of a function, right? So this is kind of... It's cool. It kind of tells you..."},{"start":3168.33,"text":"So it's kind of cool. It tells you that if I give a matrix or whatever, you could be pedantic and call it a two tensor or something. And someone says, well, what do you mean the function curves up? And you may know its curvature is non-negative. And if you had to make something up about what that means, it means that. So that's the picture. Again, these are actually really easy to show."},{"start":3195.77,"text":"I'm not going to do that, but it's a good way to just sort of start thinking about these things. Okay, so let's look at some examples. The first one, here's a quadratic function. So here, I have a symmetric, this is a quadratic form, right? It's x transpose px, where p is symmetric matrix, right? By the way, if p is not symmetric, I can replace it with its symmetric part, which is p plus p transpose divided by 2, and now it's symmetric, right?"}],"speech_gaps":[],"frame":"../frames/v003/019.webp","frame_time":3065.79},{"title":"二次函数与凸函数的性质","segments":[{"id":171,"text":"and it doesn't change this function, right? So that's a quadratic form. If you add to a quadratic form a linear term and a constant, you get a quadratic function, right? So, you know, this is the analog of like, you know, basically p over 2x squared plus qx plus r in dimension 1, right? So that's what this is, okay? Well, the gradient turns out to be px plus q.","zh":"而且它不会改变这个函数，对吧？所以这就是一个二次型。如果你在二次型上加上一个线性项和一个常数项，你就会得到一个二次函数，对吧？所以，你知道的，这类似于在一维情况下，像 p/2 x² + qx + r 这样的形式，对吧？所以这就是这个函数，好吧？那么梯度会是 px + q。","start":3221.17,"end":3245.49},{"id":172,"text":"And then it turns out that the Hessian is just P. It's constant. It has constant curvature. So you'd say, well, I mean, it's silly. You'd say, oh, you know.","zh":"然后你会发现，Hessian 矩阵就是 P。它是常数。它具有恒定的曲率。所以你会说，嗯，这很傻。你会说，哦，你知道的。","start":3246.26,"end":3254.42},{"id":173,"text":"A quadratic function has constant curvature. Well, like, duh. That's kind of what it means, right? And then it turns out if this matrix P is positive semi-definite, this thing is convex. And that's if and only if, right? Here's one. Least squares objective, right? So here I have a matrix A. It doesn't matter its dimensions, except this has to make sense, and a vector B.","zh":"二次函数具有恒定的曲率。嗯，这不是很明显吗？这基本上就是它的意思，对吧？然后你会发现，如果这个矩阵 P 是半正定的，那么这个函数就是凸的。而且这是充要条件，对吧？这里有一个例子，最小二乘目标函数，对吧？所以这里我有一个矩阵 A。它的维度无关紧要，只要这个表达式有意义，并且有一个向量 B。","start":3254.8,"end":3276.88},{"id":174,"text":"I form this thing, and if I expand it out, you know, the gradient is this thing, right? This is part, this is what you'd see in the normal equations, so-called, right? And then the Hessian is 2A transpose A, positive semi-definite. So it's done. Okay? So these are just good things to know. Now we get to a fun one. So this is the simplest convex function.","zh":"我构造这个表达式，如果我把它展开，你知道的，梯度就是这个表达式，对吧？这是所谓的正规方程的一部分，对吧？然后 Hessian 是 2A^T A，它是半正定的。所以这就完成了。好吧？这些是值得知道的好东西。现在我们来到一个有趣的情况。所以这是最简单的凸函数。","start":3277.72,"end":3300.04},{"id":175,"text":"that most people are utterly unaware of, right? If I walk up to a person, okay, it depends on the neighborhood, but if I walk up to a person on the street and say, hey, is x convex? They're like, duh, of course it is, right? I mean, because you just draw the picture in your head. You know, people, most people, people would know that like a norm is convex because it's kind of like the triangle inequality, right? These are kind of obvious, right? Here's a super simple one. The function x squared over y, two variables, y is positive, okay? So that's it.","zh":"大多数人对此完全不知情，对吧？如果我走到一个人面前，好吧，这取决于邻域，但如果我走到街上的人面前，说，嘿，x 是凸的吗？他们会说，当然，对吧？我的意思是，因为你可以在脑海中画出图像。你知道的，人们，大多数人，人们会知道像范数是凸的，因为它类似于三角不等式，对吧？这些都很明显，对吧？这里有一个超级简单的例子。函数是 x²/y，两个变量，y 是正的，对吧？所以这就是它。","start":3300.68,"end":3328.22},{"id":176,"text":"And it's not obvious that that... Oh, there are some obvious things here. If I fix y, it's convex in x because it's a positive multiple of x squared. If I fix x, it's convex in y because it's a constant 1 over y and it looks like this, right? So it's convex, right? This says much more. This says it's actually jointly convex in x and y. Okay?","zh":"而且不明显的是这个……哦，这里有一些明显的事情。如果我固定 y，它在 x 上是凸的，因为它是一个正的 x² 的倍数。如果我固定 x，它在 y 上是凸的，因为它是一个常数 1/y，看起来像这样，对吧？所以它是凸的，对吧？这说明了更多。这说明它实际上在 x 和 y 上是联合凸的。好吧？","start":3330.32,"end":3356.4},{"id":177,"text":"So, and you know, you can check, I mean, but here's a quick one. I just, I worked out the Hessian for you and expressed it as a rank one positive semi-definite matrix. That's what this is, right? By the way, the interesting part about the function is because it has rank one, that means that wherever you are on the surface, it's actually got one direction where it's flat and one where it's curving. But there was a question. If a function is jointly convex, does that mean the individual variables are also convex?","zh":"所以，你可以检查一下，我的意思是，但这里有一个快速的方法。我刚刚为你计算了Hessian矩阵，并将其表示为一个秩为一的半正定矩阵。这就是这个函数的性质，对吧？顺便说一句，这个函数有趣的地方在于，由于它的秩为一，这意味着无论你在曲面上的哪个位置，它实际上都有一个方向是平坦的，另一个方向是弯曲的。不过有一个问题：如果一个函数是联合凸的，是否意味着各个变量本身也是凸的？","start":3356.84,"end":3387.57}],"notes":["本段讲解了二次函数的基本性质，包括其梯度和Hessian矩阵。二次函数的Hessian矩阵是常数矩阵，表示其具有恒定曲率。当矩阵P是半正定矩阵时，二次函数是凸函数，这是凸优化中的一个关键性质。","接着，课程讨论了最小二乘目标函数，其中矩阵A和向量B构成目标函数。展开后，梯度与正常方程相关，Hessian矩阵为2A^T A，且为半正定矩阵。这表明最小二乘问题是一个凸优化问题。","随后，课程引入了一个看似简单的凸函数：x²/y，其中y为正数。虽然固定其中一个变量时函数在另一个变量上是凸的，但该函数在两个变量上是联合凸的。这表明联合凸性并不一定意味着每个变量单独凸。","课程进一步指出，该函数的Hessian矩阵是一个秩为1的半正定矩阵，这意味着在表面上有一个方向是平坦的，另一个方向是弯曲的。这展示了凸函数的几何特性。","最后，课程提出了一个关于联合凸性的问题：如果一个函数是联合凸的，是否意味着每个变量单独也是凸的？这引导学生思考凸函数的性质及其在不同变量上的表现。","这些内容帮助学生理解凸函数的基本概念、梯度和Hessian矩阵的性质，以及联合凸性与单独凸性之间的关系。"],"formulas":[{"latex":"f(x) = \\frac{x^2}{y}","symbols":"f(x) 是一个关于 x 和 y 的函数，其中 y 是正数","explanation":"公式正确，表示一个关于 x 和 y 的函数，其中 y 是正数。","evidence":"that most people are utterly unaware of, right? If I walk up to a person, okay, it depends on the neighborhood, but if I walk up to a person on the street and say, hey, is x convex? They're like, duh, of course it is, right? I mean, because you just draw the picture in your head. You know, people, most people, people would know that like a norm is convex because it's kind of like the triangle inequality, right? These are kind of obvious, right? Here's a super simple one. The function x squared over y, two variables, y is positive, okay? So that's it."},{"latex":"H = 2A^T A","symbols":"H 是 Hessian 矩阵，表示最小二乘目标函数的曲率","explanation":"公式正确，表示最小二乘目标函数的 Hessian 矩阵为 2A^T A，其中 A 是矩阵，A^T 是其转置。","evidence":"I form this thing, and if I expand it out, you know, the gradient is this thing, right? This is part, this is what you'd see in the normal equations, so-called, right? And then the Hessian is 2A transpose A, positive semi-definite. So it's done. Okay? So these are just good things to know. Now we get to a fun one. So this is the simplest convex function."}],"uncertainties":[],"diagram":"none","start":3221.17,"end":3387.57,"asr_flags":[],"math_clarifications":["在公式 f(x) = x^2/y 中，y 是正数的条件需要明确，以确保函数的凸性。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3221.17,"text":"and it doesn't change this function, right? So that's a quadratic form. If you add to a quadratic form a linear term and a constant, you get a quadratic function, right? So, you know, this is the analog of like, you know, basically p over 2x squared plus qx plus r in dimension 1, right? So that's what this is, okay? Well, the gradient turns out to be px plus q."},{"start":3246.26,"text":"And then it turns out that the Hessian is just P. It's constant. It has constant curvature. So you'd say, well, I mean, it's silly. You'd say, oh, you know."},{"start":3254.8,"text":"A quadratic function has constant curvature. Well, like, duh. That's kind of what it means, right? And then it turns out if this matrix P is positive semi-definite, this thing is convex. And that's if and only if, right? Here's one. Least squares objective, right? So here I have a matrix A. It doesn't matter its dimensions, except this has to make sense, and a vector B."},{"start":3277.72,"text":"I form this thing, and if I expand it out, you know, the gradient is this thing, right? This is part, this is what you'd see in the normal equations, so-called, right? And then the Hessian is 2A transpose A, positive semi-definite. So it's done. Okay? So these are just good things to know. Now we get to a fun one. So this is the simplest convex function."},{"start":3300.68,"text":"that most people are utterly unaware of, right? If I walk up to a person, okay, it depends on the neighborhood, but if I walk up to a person on the street and say, hey, is x convex? They're like, duh, of course it is, right? I mean, because you just draw the picture in your head. You know, people, most people, people would know that like a norm is convex because it's kind of like the triangle inequality, right? These are kind of obvious, right? Here's a super simple one. The function x squared over y, two variables, y is positive, okay? So that's it."},{"start":3330.32,"text":"And it's not obvious that that... Oh, there are some obvious things here. If I fix y, it's convex in x because it's a positive multiple of x squared. If I fix x, it's convex in y because it's a constant 1 over y and it looks like this, right? So it's convex, right? This says much more. This says it's actually jointly convex in x and y. Okay?"},{"start":3356.84,"text":"So, and you know, you can check, I mean, but here's a quick one. I just, I worked out the Hessian for you and expressed it as a rank one positive semi-definite matrix. That's what this is, right? By the way, the interesting part about the function is because it has rank one, that means that wherever you are on the surface, it's actually got one direction where it's flat and one where it's curving. But there was a question. If a function is jointly convex, does that mean the individual variables are also convex?"}],"speech_gaps":[],"frame":"../frames/v003/020.webp","frame_time":3233.17},{"title":"凸函数在变量固定时的性质","segments":[{"id":178,"text":"Yes, but let me be very careful to make sure. So there is something in there that's false and very important, so let's get to that. If a function of two variables is convex, it is definitely convex, in fact, by our thing, by restricting it to a line. One line is just that the first variable changes and the second doesn't. So yes, if a function of two variables is convex, then if you fix one variable, it's convex in the other one, and vice versa.","zh":"是的，但让我非常小心地确认一下。因为在那里面有一个非常重要的错误，所以我们来探讨一下。如果一个关于两个变量的函数是凸函数，那么它肯定是凸函数，事实上，通过限制到一条线上，我们可以得到这一点。一条线就是第一个变量变化而第二个变量保持不变。因此，是的，如果一个关于两个变量的函数是凸函数，那么当你固定其中一个变量时，它在另一个变量上是凸函数，反之亦然。","start":3388.4,"end":3417.52},{"id":179,"text":"The converse of that statement is false. It is not true. A function can be convex in each variable when the other is fixed. Right? Somebody want to give me an example? Like simple? Okay, a saddle. Yeah, here. Okay. Yeah, that'll do the trick. But let me, you know, maybe it depends which directions you move in a saddle. But roughly, here's one. Ready? Here's a function of two variables. Ready? That's the product.","zh":"这个陈述的逆命题是错误的。这并不正确。一个函数可以在固定另一个变量时在每个变量上都是凸函数。对吧？有人能给我举个例子吗？像简单的例子？好的，一个鞍形函数。对，这里。好的，这就可以了。但让我想想，也许这取决于你在鞍形函数中移动的方向。但大致来说，这里有一个例子。准备好了吗？这里是一个关于两个变量的函数。准备好了吗？这就是乘积。","start":3417.93,"end":3454.12},{"id":180,"text":"That's a quadratic form, right? This is equal to, right? Well, okay, that's equal to xy transpose times maybe 1 half and 1100. Everybody agree with that? Okay, so that's my function. Okay, now, in your mind, please fix y and tell me if this is convex in x. It's linear. Now, in your mind, fix x, please, and tell me what is the curvature in y.","zh":"这是一个二次型，对吧？这等于，对吧？嗯，好吧，这等于x乘以y的转置，可能乘以1/2和1100。大家同意吗？好的，这就是我的函数。好的，现在，请在你脑海中固定y，告诉我这个函数在x上是否是凸函数。它是线性的。现在，请在你脑海中固定x，告诉我y的曲率是什么。","start":3455.18,"end":3482.8},{"id":181,"text":"It's linear. So it's convex. It's both convex and concave, right? Is the function convex? Well, its graph is a saddle. I think you'd suggested that, right? So that's how you know it's not. But the other thing is, well, wait, we just looked at this. I mean, the question is whether this matrix is positive semi-definite. Is that matrix positive semi-definite? No. I sense that our intuition about positive semi-definite matrices is not well enough formed.","zh":"它是线性的。因此它是凸函数。它既是凸函数又是凹函数，对吧？这个函数是凸函数吗？它的图像是一个鞍形。我想你已经提出了这个观点，对吧？所以这就是我们如何知道它不是凸函数的原因。但另一方面，等等，我们刚刚看了这个。我的意思是，问题是这个矩阵是否是半正定的。这个矩阵是否是半正定的？不是。我感觉我们对半正定矩阵的直觉还不够清晰。","start":3483.7,"end":3516.71},{"id":182,"text":"I just have a sense here.","zh":"我在这里有一种感觉。","start":3517.42,"end":3518.88},{"id":183,"text":"How would I look at this and know","zh":"我如何通过观察来知道","start":3519.38,"end":3521.06},{"id":184,"text":"that that's not positive semi-definite?","zh":"这个矩阵不是半正定的？","start":3521.64,"end":3523.44},{"id":185,"text":"Why?","zh":"为什么？","start":3524.74,"end":3525.1},{"id":186,"text":"Yeah, okay, we can do eigenvalues.","zh":"是的，好的，我们可以讨论特征值。","start":3527.22,"end":3529.22},{"id":187,"text":"I mean, I happen to know the eigenvalues of that matrix.","zh":"我的意思是，我知道那个矩阵的特征值。","start":3529.66,"end":3531.62},{"id":188,"text":"Do you?","zh":"你知道吗？","start":3531.72,"end":3531.98},{"id":189,"text":"Minus one, I think, as well.","zh":"我想也是负一。","start":3532.56,"end":3533.7},{"id":190,"text":"Okay, minus one and one, and it's game over with minus one.","zh":"好的，负一和一，负一就结束了。","start":3533.74,"end":3536.2},{"id":191,"text":"There was a suggestion back there?","zh":"之前有提到一个建议吗？","start":3536.36,"end":3537.54},{"id":192,"text":"I actually can't read that matrix from back here.","zh":"我实际上从后面看不清那个矩阵了。","start":3537.8,"end":3540.0},{"id":193,"text":"Oh, I'm sorry.","zh":"哦，我道歉。","start":3540.38,"end":3541.52},{"id":194,"text":"Yeah, that would make it very difficult.","zh":"是的，这会变得非常困难。","start":3543.18,"end":3544.86},{"id":195,"text":"Yeah, you know what?","zh":"是的，你知道吗？","start":3544.98,"end":3545.7},{"id":196,"text":"I'm looking at it now.","zh":"我现在正在看它。","start":3545.78,"end":3546.52},{"id":197,"text":"thank you for bringing that oh by the way also if you can't hear me back there then let me know","zh":"谢谢你的提醒，顺便说一句，如果你那边听不到我的话，请告诉我","start":3546.52,"end":3551.28},{"id":198,"text":"because i i can be loud okay you're right i don't know what so that's thank you for some","zh":"因为我在那边可能会很吵，好吧，你说得对，我不知道是什么情况，所以谢谢你的反馈","start":3551.28,"end":3555.96},{"id":199,"text":"feedback there let me just read i'll i will now write it legibly right","zh":"让我现在读一遍，我会把它写得清晰一些","start":3555.96,"end":3560.2}],"notes":["本段讨论了凸函数在固定一个变量时是否保持凸性的问题。教授指出，虽然一个函数在两个变量上是凸的，但反过来不一定成立，即一个函数在固定一个变量时在另一个变量上是凸的，并不意味着整个函数是凸的。教授通过一个鞍形函数的例子来说明这一点，该函数在每个变量上是线性的，因此是凸的，但整体上不是凸函数。","教授进一步指出，判断一个函数是否为凸函数的关键在于其对应的Hessian矩阵是否为半正定矩阵。对于鞍形函数，其Hessian矩阵的特征值包含负值，因此不是半正定矩阵，从而说明该函数不是凸函数。","教授提到，判断Hessian矩阵是否为半正定矩阵的一种方法是计算其特征值。如果存在负特征值，则矩阵不是半正定的，函数也不是凸函数。","教授还提到，由于听众在后方可能听不清，因此他承诺会更清晰地书写矩阵，以便所有听众都能理解。","教授在课堂上强调了凸函数的性质和判断方法，特别是通过Hessian矩阵的正定性来判断函数的凸性。这有助于学生理解凸函数的定义和相关性质。","教授通过实际例子和互动方式，帮助学生理解凸函数的性质和判断方法，强调了在固定一个变量时函数的凸性并不一定意味着整个函数是凸的。"],"formulas":[],"uncertainties":["1100","xy transpose times maybe 1 half and 1100"],"diagram":"none","start":3388.4,"end":3560.2,"asr_flags":[],"math_clarifications":["原片段中提到的函数 $ f(x, y) $ 是一个二次型，但其表达式 $ x y^T $ 不符合标准二次型的定义。正确的二次型应包含一个矩阵乘法，如 $ f(x, y) = x^T A y $，其中 $ A $ 是一个对称矩阵。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":3388.4,"text":"Yes, but let me be very careful to make sure. So there is something in there that's false and very important, so let's get to that. If a function of two variables is convex, it is definitely convex, in fact, by our thing, by restricting it to a line. One line is just that the first variable changes and the second doesn't. So yes, if a function of two variables is convex, then if you fix one variable, it's convex in the other one, and vice versa."},{"start":3417.93,"text":"The converse of that statement is false. It is not true. A function can be convex in each variable when the other is fixed. Right? Somebody want to give me an example? Like simple? Okay, a saddle. Yeah, here. Okay. Yeah, that'll do the trick. But let me, you know, maybe it depends which directions you move in a saddle. But roughly, here's one. Ready? Here's a function of two variables. Ready? That's the product."},{"start":3455.18,"text":"That's a quadratic form, right? This is equal to, right? Well, okay, that's equal to xy transpose times maybe 1 half and 1100. Everybody agree with that? Okay, so that's my function. Okay, now, in your mind, please fix y and tell me if this is convex in x. It's linear. Now, in your mind, fix x, please, and tell me what is the curvature in y."},{"start":3483.7,"text":"It's linear. So it's convex. It's both convex and concave, right? Is the function convex? Well, its graph is a saddle. I think you'd suggested that, right? So that's how you know it's not. But the other thing is, well, wait, we just looked at this. I mean, the question is whether this matrix is positive semi-definite. Is that matrix positive semi-definite? No. I sense that our intuition about positive semi-definite matrices is not well enough formed."},{"start":3517.42,"text":"I just have a sense here."},{"start":3519.38,"text":"How would I look at this and know"},{"start":3521.64,"text":"that that's not positive semi-definite?"},{"start":3524.74,"text":"Why?"},{"start":3527.22,"text":"Yeah, okay, we can do eigenvalues."},{"start":3529.66,"text":"I mean, I happen to know the eigenvalues of that matrix."},{"start":3531.72,"text":"Do you?"},{"start":3532.56,"text":"Minus one, I think, as well."},{"start":3533.74,"text":"Okay, minus one and one, and it's game over with minus one."},{"start":3536.36,"text":"There was a suggestion back there?"},{"start":3537.8,"text":"I actually can't read that matrix from back here."},{"start":3540.38,"text":"Oh, I'm sorry."},{"start":3543.18,"text":"Yeah, that would make it very difficult."},{"start":3544.98,"text":"Yeah, you know what?"},{"start":3545.78,"text":"I'm looking at it now."},{"start":3546.52,"text":"thank you for bringing that oh by the way also if you can't hear me back there then let me know"},{"start":3551.28,"text":"because i i can be loud okay you're right i don't know what so that's thank you for some"},{"start":3555.96,"text":"feedback there let me just read i'll i will now write yway so this is that's kind of it it's an interesting","zh":"认为我们之前说过无论如何，这就是大致内容，这是一个有趣的","start":3624.56,"end":3627.0},{"id":218,"text":"function there's the there's a graph of it over there okay log sum X this is an","zh":"函数，那边有它的图像，好的，对数求和函数，这是其中一个","start":3627.0,"end":3633.26},{"id":219,"text":"interesting one this comes up in tons of fields with completely different names","zh":"有趣的一个，它在众多领域中出现，有着完全不同的名称","start":3633.26,"end":3637.0},{"id":220,"text":"every field thinks they invented it so I think it's called softmax in some fields","zh":"函数，那里有它的图像，好的，对数求和函数，这是一个","start":3637.0,"end":3641.98},{"id":221,"text":"it's got okay somebody give me some other names and there's some weird","zh":"有趣的函数，它在许多领域中出现，有不同的名称","start":3641.98,"end":3646.68},{"id":222,"text":"esoteric ones when you're a weird esoteric one okay and this is in full","zh":"每个领域都觉得自己发明了它，所以我想在某些领域它被称为softmax","start":3646.68,"end":3651.64},{"id":223,"text":"dial","zh":"它还有，有人给我一些其他名称，还有一些奇怪的","start":3651.64,"end":3651.88},{"id":224,"text":"What is it? There you go, Boltzmann function. I didn't know that. The Boltzmann what? Okay, great. I mean, that's highly pedantic. Okay, so this function, here's one in a strong dialect. This is the dB combining formula.","zh":"这是什么？哦，是玻尔兹曼函数。我之前不知道。玻尔兹曼什么？好吧，很好。我是说，这非常讲究。好的，所以这个函数，这里有一个强烈的方言版本。这是dB组合公式。","start":3653.45,"end":3674.36},{"id":225,"text":"That's from EE. You may have friends or you may eventually, you may at some point in your life have friends who are in EE. So probably worth your while to speak a little bit of dialect or at least recognize when people are speaking it. So decibel is some weird thing from the 1920s. It's like the 220 times log base 10 of a function. Anyway, so it turns out...","zh":"那是从电子工程（EE）来的。你可能有朋友，或者最终你会在你的一生中遇到一些在电子工程领域的人。因此，花点时间学习一点方言或者至少能够识别别人在说这种方言，可能是值得的。分贝是一个来自1920年代的奇怪概念。它类似于220乘以以10为底的某个函数的对数。无论如何，结果发现...","start":3675.6,"end":3697.0},{"id":226,"text":"that's the formula. So I will, if you don't mind, I'm going
