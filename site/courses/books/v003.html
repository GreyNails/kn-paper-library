凸函数，你知道，我不会深入细节，但你知道，你之所以要弄清楚这个的原因，实际上是它有一个有趣的推导。它是这样推导的。你计算Hessian矩阵。它由两个项的和组成，然后你看看这里。","start":3723.91,"end":3751.56},{"id":228,"text":"And you'd say, well, let's see, it's kind of, you know, it's, so Z is this X, so these are non-negative, right? You'd say, well, I don't know, that's a positive semi-definite matrix. And then what you're hoping, the simple thing would be.","zh":"你会说，好吧，让我们看看，它有点像，你知道的，它是Z等于X，所以这些是非负的，对吧？你会说，好吧，我不知道，那是一个正半定矩阵。然后你希望简单的事情就是。","start":3752.06,"end":3765.22},{"id":229,"text":"The Hessian is one positive semi-definite matrix plus another. And then you'd say the sum of two positive semi-definite matrices. But it's not to be. There's a minus sign here. And this is this rank one thing. It still is positive semi-definite. You just have to show it, which I'm not going to go into the details here about how you do that. But anyway, so this is, and it's a very cool function. It's actually basically like, I think, I like softmax. I don't know who invented that, but maybe.","zh":"Hessian矩阵是一个正半定矩阵加上另一个。然后你会说，两个正半定矩阵的和。但事实并非如此。这里有一个负号。而且这是秩为一的情况。它仍然是正半定的。你只需要证明这一点，但我在这里不会深入细节说明你是如何证明的。无论如何，这就是，而且它是一个非常酷的函数。实际上，我觉得，我喜欢softmax。我不知道是谁发明的，但可能是。","start":3765.74,"end":3790.92},{"id":230,"text":"I don't know. Maybe people in machine learning. I don't know. So I like that's my preferred term for it. Softmax means it's kind of a smooth approximation of the max. Right. Like, I mean, if you've seen this before, I mean, you'll have seen this before somewhere. Yeah. So, OK. So, you know, it's like.","zh":"我不知道。也许是在机器学习领域的人。我不知道。所以我觉得这是我对它的首选术语。Softmax意味着它是一种对最大值的平滑近似。对吧。比如，如果你之前见过这个，那你一定在某个地方见过。是的。所以，好的。你知道的，它就像。","start":3791.62,"end":3809.6},{"id":231,"text":"So if one of the x's is, let's say, a factor, not a factor, but let's say one x is bigger than all the others by, let's say, a gap of three, right? Then when you exponentiate them, it means that that one is now more than e cubed bigger than all the others. So when you add up the others, I mean, it depends. I'm just being very rough here. Most of it comes from that one term.","zh":"所以如果其中一个x的值比其他所有值大，比如说，差距为三，对吧？那么当你对它们进行指数运算时，这意味着那个值现在比其他所有值大e的三次方。当你把其他值加起来时，我意思是，这取决于具体情况。我只是在这里非常粗略地描述。大部分结果都来自于那个项。","start":3810.18,"end":3832.92},{"id":232,"text":"Right, and then you add them up you take the log put you back on the other scale and you get that so, okay Here's another one is the geometric mean in many variables. So the nth root of A bunch of positive numbers or non-negative numbers. That's a concave function and you'd have a similar thing, right? So, okay so let me Briefly mention the connection between convex sets and come because right now you have the convexity","zh":"对的，然后你把它们加起来，取对数，再转换回原来的尺度，你就得到了这一点。好的，这里还有一个例子，就是多变量下的几何平均数。即多个正数或非负数的n次根。这是一个凹函数，你也会有类似的情况，对吧？好的，让我简要提及凸集和凸函数之间的联系，因为现在你已经有了凸集的凸性","start":3833.44,"end":3862.14},{"id":233,"text":"now applies to two things. You have convexity of a set and you have convexity of a function, right? And so, you know, obviously people would not have used the same term if there was not a connection, right? The connection might not be quite what you think it is. Oh, by the way, we have concave functions. We don't have concave sets. No such thing. I mean, you could say that, but it would be weird, right?","zh":"现在适用于两件事。你有集合的凸性，你也有函数的凸性，对吧？所以，显然，如果两者之间没有联系，人们就不会使用相同的术语，对吧？这种联系可能并不完全是你所想的那样。顺便说一句，我们有凹函数，但没有凹集。不存在这样的概念。我是说，你可以说有，但这样会很奇怪，对吧？","start":3862.9,"end":3888.86}],"notes":["本段主要讨论凸函数的性质，特别是通过Hessian矩阵来判断函数是否为凸函数。讲者提到，Hessian矩阵是两个正半定矩阵的和，但由于存在负号，需要进一步证明其正半定性。此外，讲者还提到softmax函数作为凸函数的示例，并解释了其作为最大值的平滑近似的特点。","讲者通过一个具体的例子说明softmax函数的性质：当其中一个变量比其他变量大三个单位时，其指数值会比其他变量大e³倍，因此在求和后，该变量对结果的贡献最大。接着，讲者提到几何平均数作为另一个例子，指出它是一个凹函数，并与凸函数的性质形成对比。","讲者进一步讨论了凸集和凸函数之间的联系，指出虽然两者都使用了“凸”这一术语，但它们的定义和性质是不同的。凸集是指集合的凸性，而凸函数是指函数的凸性。讲者强调，虽然术语相同，但它们的定义和应用领域是不同的。","讲者还指出，虽然可以定义凹函数，但凹集这一概念并不存在，因为凹集的定义与凸集相反，而凸集的定义在数学中是标准的。因此，凹集并不是一个标准的数学概念。","讲者通过这些例子和解释，帮助学生理解凸函数和凸集之间的区别与联系，以及它们在优化问题中的重要性。这些内容为后续讨论凸优化问题奠定了基础。","讲者强调，虽然凸函数和凸集都使用了“凸”这一术语，但它们的定义和性质是不同的。凸函数的凸性是通过Hessian矩阵的正半定性来判断的，而凸集的凸性则是通过集合的定义来判断的。这些概念在优化理论中具有重要的应用价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3723.91,"end":3888.86,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3723.91,"text":"Okay, did you grow up speaking it like at home or something or what? You did. Okay, okay, fine. Okay, so I can, I know other dialects. I can try that. I can, okay, fine. Okay, so it's actually a really cool function. Okay, number one, it's convex, which, you know, I'm not going to go into the details, but you know, the reason to, you figure that out is, actually, it's an interesting derivation. It goes like this. You work out the Hessian. It's a sum of two terms, and you look over here."},{"start":3752.06,"text":"And you'd say, well, let's see, it's kind of, you know, it's, so Z is this X, so these are non-negative, right? You'd say, well, I don't know, that's a positive semi-definite matrix. And then what you're hoping, the simple thing would be."},{"start":3765.74,"text":"The Hessian is one positive semi-definite matrix plus another. And then you'd say the sum of two positive semi-definite matrices. But it's not to be. There's a minus sign here. And this is this rank one thing. It still is positive semi-definite. You just have to show it, which I'm not going to go into the details here about how you do that. But anyway, so this is, and it's a very cool function. It's actually basically like, I think, I like softmax. I don't know who invented that, but maybe."},{"start":3791.62,"text":"I don't know. Maybe people in machine learning. I don't know. So I like that's my preferred term for it. Softmax means it's kind of a smooth approximation of the max. Right. Like, I mean, if you've seen this before, I mean, you'll have seen this before somewhere. Yeah. So, OK. So, you know, it's like."},{"start":3810.18,"text":"So if one of the x's is, let's say, a factor, not a factor, but let's say one x is bigger than all the others by, let's say, a gap of three, right? Then when you exponentiate them, it means that that one is now more than e cubed bigger than all the others. So when you add up the others, I mean, it depends. I'm just being very rough here. Most of it comes from that one term."},{"start":3833.44,"text":"Right, and then you add them up you take the log put you back on the other scale and you get that so, okay Here's another one is the geometric mean in many variables. So the nth root of A bunch of positive numbers or non-negative numbers. That's a concave function and you'd have a similar thing, right? So, okay so let me Briefly mention the connection between convex sets and come because right now you have the convexity"},{"start":3862.9,"text":"now applies to two things. You have convexity of a set and you have convexity of a function, right? And so, you know, obviously people would not have used the same term if there was not a connection, right? The connection might not be quite what you think it is. Oh, by the way, we have concave functions. We don't have concave sets. No such thing. I mean, you could say that, but it would be weird, right?"}],"speech_gaps":[],"frame":"../frames/v003/023.webp","frame_time":3735.91},{"title":"凸函数与次级集的定义及其与凸集的关系","segments":[{"id":234,"text":"I'm not even sure what it would be, but maybe the complement of a convex set. Actually, I don't know what it would be. So don't say that because it has no meaning. Okay, so there's a connection between these things. So the very important one is the concept of a sublevel set. Now, a sublevel set of a function is the set of all points.","zh":"我甚至不确定它会是什么，但也许是一个凸集的补集。实际上，我不知道它会是什么。所以不要说这个，因为它没有意义。好的，这些事物之间是有联系的。非常重要的一个概念是次级集。现在，一个函数的次级集是所有点的集合。","start":3890.89,"end":3913.49},{"id":235,"text":"So there's a connection between these things. So the very important one is the concept of a sublevel set. Now, a sublevel set of a function is the set of all points where the function value is less than alpha. That's actually super interesting, right? When f becomes an objective in an optimization problem, this is basically, these are all the things that perform at the level alpha and better, right? Because I'm minimizing f, let's say. Okay, so that's the sublevel set. It makes perfect sense, right? Or it could have like the superlevel set, you know, something like that, right?","zh":"这些事物之间是有联系的。非常重要的一个概念是次级集。现在，一个函数的次级集是所有函数值小于 alpha 的点的集合。这实际上非常有趣，对吧？当 f 成为一个优化问题中的目标函数时，这些就是所有在 alpha 水平或更好表现的点，对吧？因为我在最小化 f。好的，这就是次级集。这完全合乎逻辑，对吧？或者它也可能是超级集，你知道的，类似这样的东西，对吧？","start":3914.01,"end":3938.93},{"id":236,"text":"Okay, now it turns out that the sublevel sets of convex functions are convex. Okay, so if you have a convex function and I look at the sublevel set, it's going to be convex, right? So, okay. Let's see. The real connection is this, is through the so-called epigraph. Epi means above, graph means, I guess, you know, just graph, right? Which means a drawing or whatever. And so remember that if I have a function on Rn,","zh":"好的，现在事实证明，凸函数的次级集是凸的。好的，如果你有一个凸函数，当我查看次级集时，它将是凸的，对吧？所以，好的。让我们看看。真正的联系是通过所谓的上图（epigraph）。Epi 意思是上面，graph 意思是，我想，就是图，对吧？也就是绘图或任何东西。因此，请记住，如果我在 Rn 上有一个函数，","start":3940.19,"end":3966.61},{"id":237,"text":"It's in, you know, well, here n is 1, so it's in R2. And the epigraph is this shaded thing. That's the epigraph, okay? And it's kind of interesting. It's everything that's bigger than or equal to the function value at that point, right? So that's the epigraph. And it turns out a function is convex if and only if epi f is a convex set. So that's actually the connection between the two, the concepts of convexity of a set and convexity of a function.","zh":"它位于，你知道的，这里 n 是 1，所以它位于 R2 中。上图是这个阴影区域。这就是上图，对吧？这有点意思。它包括所有大于或等于该点函数值的点，对吧？这就是上图。事实证明，一个函数是凸的，当且仅当 epi f 是一个凸集。所以这实际上是两个概念之间的联系，即集合的凸性和函数的凸性。","start":3967.01,"end":3988.79},{"id":238,"text":"It's in, you know, well, here n is 1, so it's in R2. And the epigraph is this shaded thing. That's the epigraph, okay? And it's kind of interesting. It's everything that's bigger than or equal to the function value at that point, right? So that's the epigraph. And it turns out a function is convex if and only if epi f is a convex set. So that's actually the connection between the two, the concepts of convexity of a set and convexity of a function.","zh":"它在，你明白的，这里n是1，所以它在R2中。上境是这个阴影区域。这就是上境，对吧？这有点意思。它包括所有大于或等于该点函数值的点，对吧？这就是上境。事实上，一个函数是凸函数当且仅当它的上境是一个凸集。这就是这两个概念之间的联系，即集合的凸性和函数的凸性。","start":3989.75,"end":4018.65},{"id":239,"text":"Okay, so it's not that much here. But yeah, I mean, we're already getting close to interesting things. So let's fit a statistical model by minimizing the negative. If you understand what I'm saying, fine. If you don't, that's cool too. We'll do this later. Let's fit a statistical model.","zh":"这里的内容不多。但说实话，我们已经接近有趣的内容了。所以让我们通过最小化负对数似然来拟合一个统计模型。如果你明白我在说什么，很好。如果你不明白，也没关系。我们之后再做。让我们拟合一个统计模型。","start":4019.33,"end":4037.75},{"id":240,"text":"x is going to be the set of parameters in your model, and I want to minimize the negative log likelihood. Everybody following me? I mean, it's fine if you don't, right? So, okay. And you would get something, and that would be like the, whatever, the maximum likelihood estimate of those parameters. Everybody cool? Okay. But then I could look at the sub-level sets of the negative log likelihood, or if you like, the super-level sets of the log likelihood.","zh":"x将是模型中的参数集合，我想最小化负对数似然。大家跟上了吗？我的意思是，如果你跟不上也没关系，对吧？好的。然后你会得到一些结果，这将是这些参数的最大似然估计。大家觉得怎么样？好的。但之后我可以查看负对数似然的次级集，或者如果你喜欢的话，可以查看对数似然的超级集。","start":4038.29,"end":4063.73}],"notes":["本段首先讨论了凸集的补集是否具有凸性，但指出其没有明确意义，因此不建议使用。接着引入了次级集（sublevel set）的概念，即函数值小于某个阈值α的所有点的集合。次级集在优化问题中非常重要，因为当f作为目标函数时，次级集包含了所有在该阈值及以下的点，即性能优于或等于该阈值的点。","讲者指出，凸函数的次级集是凸集，这是凸函数的一个重要性质。同时，讲者引入了上图（epigraph）的概念，即函数图像上方的所有点的集合。函数的凸性等价于其上图是凸集，这建立了函数凸性和集合凸性之间的联系。","讲者提到，次级集和上图是理解凸函数性质的关键工具。通过这些概念，可以将函数的凸性转化为集合的凸性，从而利用集合的凸性理论来分析函数的性质。","最后，讲者提到在统计建模中，可以通过最小化负对数似然函数来估计参数，这涉及到次级集和上图的应用。次级集用于分析负对数似然函数的性质，而上图则用于判断函数的凸性。"],"formulas":[{"latex":"sublevel\\ set\\ =\\ \\{x\\ \\vert\\ f(x)\\ \\leq\\ \\alpha\\}","symbols":"次级集是函数值小于等于α的所有点的集合","explanation":"公式正确，定义了次级集为函数值小于等于α的所有点的集合，符合数学定义。","evidence":"where the function value is less than alpha. That's actually super interesting, right? When f becomes an objective in an optimization problem, this is basically, these are all the things that perform at the level alpha and better, right? Because I'm minimizing f, let's say. Okay, so that's the sublevel set. It makes perfect sense, right? Or it could have like the superlevel set, you know, something like that, right?"},{"latex":"epigraph\\ =\\ \\{\\ (x,\\ t)\\ \\vert\\ f(x)\\ \\leq\\ t\\ \\}","symbols":"上图是函数图像上方的所有点的集合","explanation":"公式正确，定义了上图是函数图像上方的所有点的集合，符合数学定义。","evidence":"Its graph is a set in Rn plus 1. It's a set of all points of the form xt, where, well, x is in the domain, and f of x equals t. That's actually the graph, right? The epigraph is everything that lies above the graph. And so this is a function f. This dark curve is what we'd call its graph."},{"latex":"f\\ is\\ convex\\ \\iff\\ epi\\ f\\ is\\ convex","symbols":"函数f是凸函数当且仅当其上图是凸集","explanation":"公式正确，表达了函数凸性与上图凸性的等价关系，符合数学定义。","evidence":"Its graph is a set in Rn plus 1. It's a set of all points of the form xt, where, well, x is in the domain, and f of x equals t. That's actually the graph, right? The epigraph is everything that lies above the graph. And so this is a function f. This dark curve is what we'd call its graph."}],"uncertainties":[],"diagram":"none","start":3890.89,"end":4063.73,"asr_flags":[],"math_clarifications":["所有公式均符合数学定义，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3890.89,"text":"I'm not even sure what it would be, but maybe the complement of a convex set. Actually, I don't know what it would be. So don't say that because it has no meaning. Okay, so there's a connection between these things. So the very important one is the concept of a sublevel set. Now, a sublevel set of a function is the set of all points."},{"start":3914.01,"text":"where the function value is less than alpha. That's actually super interesting, right? When f becomes an objective in an optimization problem, this is basically, these are all the things that perform at the level alpha and better, right? Because I'm minimizing f, let's say. Okay, so that's the sublevel set. It makes perfect sense, right? Or it could have like the superlevel set, you know, something like that, right?"},{"start":3940.19,"text":"Okay, now it turns out that the sublevel sets of convex functions are convex. Okay, so if you have a convex function and I look at the sublevel set, it's going to be convex, right? So, okay. Let's see. The real connection is this, is through the so-called epigraph. Epi means above, graph means, I guess, you know, just graph, right? Which means a drawing or whatever. And so remember that if I have a function on Rn,"},{"start":3967.01,"text":"Its graph is a set in Rn plus 1. It's a set of all points of the form xt, where, well, x is in the domain, and f of x equals t. That's actually the graph, right? The epigraph is everything that lies above the graph. And so this is a function f. This dark curve is what we'd call its graph."},{"start":3989.75,"text":"It's in, you know, well, here n is 1, so it's in R2. And the epigraph is this shaded thing. That's the epigraph, okay? And it's kind of interesting. It's everything that's bigger than or equal to the function value at that point, right? So that's the epigraph. And it turns out a function is convex if and only if epi f is a convex set. So that's actually the connection between the two, the concepts of convexity of a set and convexity of a function."},{"start":4019.33,"text":"Okay, so it's not that much here. But yeah, I mean, we're already getting close to interesting things. So let's fit a statistical model by minimizing the negative. If you understand what I'm saying, fine. If you don't, that's cool too. We'll do this later. Let's fit a statistical model."},{"start":4038.29,"text":"x is going to be the set of parameters in your model, and I want to minimize the negative log likelihood. Everybody following me? I mean, it's fine if you don't, right? So, okay. And you would get something, and that would be like the, whatever, the maximum likelihood estimate of those parameters. Everybody cool? Okay. But then I could look at the sub-level sets of the negative log likelihood, or if you like, the super-level sets of the log likelihood."}],"speech_gaps":[],"frame":"../frames/v003/024.webp","frame_time":3902.89},{"title":"最大似然估计与Jensen不等式","segments":[{"id":241,"text":"Again, if you're trained in statistics or probability, if you know what I'm talking about, that's fine. Those are actually super interesting things, right? Those are the sets of parameters for which your log likelihood exceeds some minimum value. And if that's near the top, right? So you would get something like this, right? There's a log likelihood, right? This would be the...","zh":"再次，如果你接受过统计学或概率论的训练，如果你明白我在说什么，那也没关系。这些实际上是非常有趣的概念，对吧？这些是使得你的对数似然值超过某个最小值的参数集合。而且如果这个值接近顶部，对吧？所以你会得到类似这样的结果，对吧？这里有一个对数似然值，对吧？这就是所谓的...","start":4064.44,"end":4087.76},{"id":242,"text":"maximum likelihood point. The super level sets are super interesting. Like, it's these points here. And they would have a beautiful statistical interpretation. Because if you're close to the maximum likelihood, then it would be very hard for someone to say your model is different. In fact, if you were to actually try to figure out which hypothesis was correct, is it this? Or is it that point?","zh":"最大似然点。这些超水平集是非常有趣的。比如，这些就是这些点。它们会有美妙的统计学解释。因为如果你接近最大似然点，那么别人很难说你的模型与之不同。事实上，如果你试图确定哪个假设是正确的，是这个还是那个点？","start":4088.21,"end":4114.33},{"id":243,"text":"um, you, you could actually talk about how, how, how close they would be. Okay. So, so it's already getting kind of, by the way, what, what are the, if you, if you take a, this is just for fun since I started on this weird thing, but that's the maximum likelihood point. If you just back off tiny bit from the maximum likelihood, what do those, what do those super level sets look like? That's for fun. If you're in statistics and I know there's people in statistics here. So, and you should even know this if you're not in statistics. So what do they look like?","zh":"嗯，你实际上可以谈论它们有多接近。好的。所以，顺便说一句，如果你，如果你取一个，这只是为了好玩，因为我开始讲这个奇怪的东西，但这就是最大似然点。如果你只是稍微远离最大似然点一点，这些超水平集会是什么样子？这也是为了好玩。如果你在统计学领域，我知道这里有一些统计学的人。所以，即使你不是统计学专业的，你也应该知道这一点。那么它们会是什么样子？","start":4114.96,"end":4142.0},{"id":244,"text":"What are the sets of parameter values that are almost maximum likelihood? Yeah. They're what? Yeah, they're confidence intervals. Yeah, but I'm talking about in many dimensions. What's their shape? They look like ellipsoids. They are indeed confidence intervals. They look like ellipsoids. And in fact, the curvature is given by the Fisher information matrix.","zh":"哪些参数值几乎达到最大似然？是的。它们是什么？是的，它们就是置信区间。是的，但我在多维空间中谈论这些。它们的形状是什么样的？它们看起来像椭球体。它们确实是置信区间。它们看起来像椭球体。事实上，曲率由费舍尔信息矩阵给出。","start":4143.05,"end":4167.84},{"id":245,"text":"Sorry, that was too weird. I shouldn't have done... This stuff is so boring and dry at this point in the class, I can't help myself, so I apologize. That was just a weird thing. Okay, so, fine. We'll get back to that later, don't worry. Okay, so, Jensen's inequality. Jensen was a mathematician who kind of popularized the concept of convexity about 120 years ago. I mean, basically, actually, people had had all these sort of inequalities known, and they used them to prove all sorts of things.","zh":"抱歉，刚才太奇怪了。我不应该这样做……在课堂的这个阶段，这些内容如此枯燥乏味，我忍不住了，所以请原谅。刚才只是个奇怪的东西。好的，那么，没关系，我们稍后再回到这个话题。好的，那么，詹森不等式。詹森是一位数学家，大约120年前他推广了凸性的概念。我的意思是，实际上，人们早就知道各种各样的不等式，并用它们来证明各种各样的事情。","start":4169.6,"end":4198.23},{"id":246,"text":"All he did was kind of codify it. He said, hey, I just realized that these 14 different people are using the same argument, and so I'm going to introduce a concept called convexity and an inequality. So here's Jensen's inequality. Jensen's inequality is just the inequality that defines a convex function. It says a function at the mixture is less than or equal to the mixture of the function values. This is so-called Jensen's inequality. Well, the extension...","zh":"他所做的只是将这些内容进行了归纳。他说，嘿，我刚刚意识到这14个不同的人都在使用相同的论点，因此我要引入一个叫做凸性的概念和一个不等式。这就是Jensen不等式。Jensen不等式只是定义凸函数的一个不等式。它表示函数在混合值处的值小于或等于函数值的混合。这就是所谓的Jensen不等式。那么，这个不等式的扩展……","start":4198.9,"end":4225.88},{"id":247,"text":"You can extend this all the way to expectation, and it would go like this, right? Suppose z is a random variable. Then it's f of expectation.","zh":"你可以将这个不等式扩展到期望值，它会是这样的，对吧？假设z是一个随机变量，那么它就是f的期望值。","start":4226.44,"end":4235.94}],"notes":["本段讨论了最大似然估计中的超水平集，这些集合表示参数值使得对数似然超过某个最小值。当接近最大似然点时，这些集合具有统计意义，因为模型差异难以被检测到。这些集合在多维情况下呈现椭球形状，其曲率由Fisher信息矩阵决定。","讲者提到超水平集在统计学中被称为置信区间，但强调这是在多维情况下的概念。置信区间的形状为椭球，这与Fisher信息矩阵的结构有关。","讲者随后转向Jensen不等式，指出这是凸函数的定义。Jensen不等式表明，函数在混合点的值小于等于函数值的混合。讲者提到Jensen在120年前推广了凸性的概念，将多个已知不等式统一为一个概念。","Jensen不等式可以推广到期望值，即函数在随机变量期望处的值小于等于函数值的期望。这是凸函数的一个重要性质，广泛应用于概率和优化领域。","讲者提到Jensen不等式的应用，包括在统计学和优化中的重要性。该不等式是凸函数的核心性质，用于证明许多统计和优化结果。","讲者强调Jensen不等式的推广到期望值，这是凸函数的一个关键性质，有助于理解凸函数在随机变量上的行为。"],"formulas":[{"latex":"f(E[Z]) \\text{ is less than or equal to } E[f(Z)]","symbols":"f(E[Z]) ≤ E[f(Z)]","explanation":"该公式正确表达了Jensen不等式，即凸函数在期望值处的函数值小于等于函数值的期望。适用于随机变量Z和凸函数f，且保持了原始文本中的数学表达。","evidence":"You can extend this all the way to expectation, and it would go like this, right? Suppose z is a random variable. Then it's f of expectation."}],"uncertainties":[],"diagram":"none","start":4064.44,"end":4235.94,"asr_flags":[],"math_clarifications":["原始文本中提到的Jensen不等式是凸函数的基本性质，公式正确表达了这一关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4064.44,"text":"Again, if you're trained in statistics or probability, if you know what I'm talking about, that's fine. Those are actually super interesting things, right? Those are the sets of parameters for which your log likelihood exceeds some minimum value. And if that's near the top, right? So you would get something like this, right? There's a log likelihood, right? This would be the..."},{"start":4088.21,"text":"maximum likelihood point. The super level sets are super interesting. Like, it's these points here. And they would have a beautiful statistical interpretation. Because if you're close to the maximum likelihood, then it would be very hard for someone to say your model is different. In fact, if you were to actually try to figure out which hypothesis was correct, is it this? Or is it that point?"},{"start":4114.96,"text":"um, you, you could actually talk about how, how, how close they would be. Okay. So, so it's already getting kind of, by the way, what, what are the, if you, if you take a, this is just for fun since I started on this weird thing, but that's the maximum likelihood point. If you just back off tiny bit from the maximum likelihood, what do those, what do those super level sets look like? That's for fun. If you're in statistics and I know there's people in statistics here. So, and you should even know this if you're not in statistics. So what do they look like?"},{"start":4143.05,"text":"What are the sets of parameter values that are almost maximum likelihood? Yeah. They're what? Yeah, they're confidence intervals. Yeah, but I'm talking about in many dimensions. What's their shape? They look like ellipsoids. They are indeed confidence intervals. They look like ellipsoids. And in fact, the curvature is given by the Fisher information matrix."},{"start":4169.6,"text":"Sorry, that was too weird. I shouldn't have done... This stuff is so boring and dry at this point in the class, I can't help myself, so I apologize. That was just a weird thing. Okay, so, fine. We'll get back to that later, don't worry. Okay, so Jensen's inequality. Jensen was a mathematician who kind of popularized the concept of convexity about 120 years ago. I mean, basically, actually, people had had all these sort of inequalities known, and they used them to prove all sorts of things."},{"start":4198.9,"text":"All he did was kind of codify it. He said, hey, I just realized that these 14 different people are using the same argument, and so I'm going to introduce a concept called convexity and an inequality. So here's Jensen's inequality. Jensen's inequality is just the inequality that defines a convex function. It says a function at the mixture is less than or equal to the mixture of the function values. This is so-called Jensen's inequality. Well, the extension..."},{"start":4226.44,"text":"You can extend this all the way to expectation, and it would go like this, right? Suppose z is a random variable. Then it's f of expectation."}],"speech_gaps":[],"frame":"../frames/v003/025.webp","frame_time":4076.44},{"title":"Jensen不等式与凸函数的直观理解","segments":[{"id":248,"text":"is less than or equal to the expectation of f of z, right? For any random variable. And by the way, this is a special case of this where I just have the probability, I just have z is concentrated on two points. It's either x or it's y with probability theta and one minus theta respectively, right? So that's Jensen's inequality. And actually, it's a super interesting thing. It basically tells you, let's see. Okay, so I might think of it this way. You could say that dithering,","zh":"小于或等于f(z)的期望值，对吧？对于任何随机变量来说都是如此。顺便说一下，这是其中的一个特例，我只需要考虑概率，我只需要z集中在两个点上。它要么是x，要么是y，概率分别为theta和1减去theta，对吧？这就是Jensen不等式。实际上，这是一件非常有趣的事情。它基本上告诉你，让我想想。嗯，我可能会这样想。你可以称之为抖动，","start":4236.78,"end":4265.38},{"id":249,"text":"or actually risk Hertz. So let me just draw a picture of that. And this will get clear later in the class when we do other stuff, but let's just try this out. So yeah, so here's a convex function, right? And then I make a little probability distribution that looks like that there. This is on, this is X here. There's my little probability distribution. And I want to know,","zh":"或者实际上风险赫兹。让我先画一个图。这将在我们之后的课程中变得清晰，但现在让我们先尝试一下。是的，这里有一个凸函数，对吧？然后我创建一个小的概率分布，看起来像这样。这是在X上，这是我的小概率分布。我想知道，","start":4267.87,"end":4292.67},{"id":250,"text":"What happens over here to the, you know, if this is x and this is like, let's say, y equals f of x, right? I get a new distribution on y, right? Looks like, I don't know, looks like that, right? Okay? And now I want to, let's do some calculations here. What it says, let's suppose that x is actually this nominal value plus something that's zero mean, that wiggles like that, right? Well, what you do is you, if this were affine,","zh":"在这里，当这个是x，而这个是像y等于f(x)时，会发生什么？我得到一个新的y上的分布，对吧？看起来像，我不知道，看起来像那样，对吧？好？现在我想进行一些计算。它说的是，假设x实际上是这个名义值加上一个零均值的项，它像这样波动，对吧？那么你所做的就是，如果这是一个仿射函数，","start":4293.2,"end":4322.82},{"id":251,"text":"like that, we all know what happens to a random variable when you pass it through an affine function, right? Like variance maps the right way. But the super interesting thing here is now what we're doing is sometimes we're above, sometimes we're below this value. But what convexity says, or at least if you understand what it means locally, it says that if you're above or below, I mean, there's the affine estimate of what happens to you, but you're always worse. Well, again, you're always larger than that.","zh":"像这样，我们都知道当把一个随机变量通过仿射函数时会发生什么，对吧？比如方差会以正确的方式映射。但在这里超级有趣的是，我们现在所做的有时在该值之上，有时在该值之下。但凸性所说明的，或者说如果你理解它在局部的意义，它说明如果你在之上或之下，我的意思是，这里有你所经历的仿射估计，但你总是更差。再次，你总是大于这个值。","start":4323.33,"end":4352.28},{"id":252,"text":"right and so what that's that makes perfect that then this thing makes perfect sense right that that you have this value but you wiggle around sometimes and that says you have this value here but you you wiggle you you also wiggle around that but the uh when you wiggle around like that actually it always it always goes up because even if you go if you go down here you're above this line and if you go up you're above it too okay so maybe that","zh":"右边，所以这很完美，然后这个东西就完全合情合理了，对吧？你有这个值，但有时候你会波动，这说明你在这里有这个值，但你也会波动，你也会在那边波动，但当你这样波动的时候，实际上它总是上升的，因为即使你往下走，你也在这条线之上，即使你往上走，你也在这条线之上，对吧？","start":4352.57,"end":4378.83},{"id":253,"text":"Didn't make any sense, but that's just my interpretation of this. So this is just a very basic thing. It's Jensen's inequality. Okay, so at this point, let me explain a few things about how this is all going to go down. And this is actually sort of the beginning of how we move towards something reasonable, right? If this were a math course, we could just go for the rest of the quarter, and I could show you interesting convex sets and go off on weird tangents and stuff like that, which would be fine.","zh":"这之前没有任何意义，但这只是我对这个的理解。所以这只是非常基础的东西。这就是Jensen不等式。好的，那么在这一点上，让我解释一下接下来的内容会如何展开。实际上，这正是我们走向合理理解的开始，对吧？如果这是一门数学课，我们就可以一直讲下去，我可以向你们展示有趣的凸集，并且跑题到一些奇怪的方向，这也没关系。","start":4379.36,"end":4406.77}],"notes":["本段主要讲解Jensen不等式的基本概念及其在凸函数中的应用。讲者提到，Jensen不等式指出，对于任意随机变量，凸函数的期望值大于等于该随机变量的期望值经过凸函数后的结果。这是Jensen不等式的一个特例，其中随机变量z集中在两个点x和y上，概率分别为θ和1-θ。","讲者进一步通过图像解释了凸函数的性质。他提到，当随机变量x具有零均值的扰动时，凸函数在x处的值会围绕其期望值波动。由于凸函数的性质，无论扰动是向上还是向下，结果总是大于或等于线性估计值。","讲者强调，凸函数的这种性质使得Jensen不等式在概率论和优化问题中具有重要意义。他指出，即使在扰动的情况下，凸函数的期望值始终高于线性估计值，这体现了凸函数的“上凸”特性。","讲者还提到，这种直观理解将在后续课程中进一步展开，特别是在讨论其他相关概念时会更加清晰。他提到，这种理解对于后续的优化问题和概率分析具有基础性作用。","讲者最后提到，如果这是一门数学课程，他可能会继续深入讨论凸集和其他相关概念，但当前课程的重点是通过Jensen不等式引出凸函数的性质。","讲者在讲解过程中多次提到“凸函数”、“随机变量”、“期望值”、“扰动”等关键词，这些概念构成了Jensen不等式的核心内容。"],"formulas":[{"latex":"Var(aX + b) = a^2 Var(X)","symbols":"方差的线性变换性质","explanation":"公式正确，方差的线性变换性质保持不变，即Var(aX + b) = a²Var(X)。","evidence":"What happens over here to the, you know, if this is x and this is like, let's say, y equals f of x, right? I get a new distribution on y, right? Looks like, I don't know, looks like that, right? Okay? And now I want to, let's do some calculations here. What it says, let's suppose that x is actually this nominal value plus something that's zero mean, that wiggles like that, right? Well, what you do is you, if this were affine,"}],"un es we're below this value. But what convexity says, or at least if you understand what it means locally, it says that if you're above or below, I mean, there's the affine estimate of what happens to you, but you're always worse. Well, again, you're always larger than that."},{"start":4352.57,"text":"right and so what that's that makes perfect that then this thing makes perfect sense right that that you have this value but you wiggle around sometimes and that says you have this value here but you you wiggle you you also wiggle around that but the uh when you wiggle around like that actually it always it always goes up because even if you go if you go down here you're above this line and if you go up you're above it too okay so maybe that"},{"start":4379.36,"text":"Didn't make any sense, but that's just my interpretation of this. So this is just a very basic thing. It's Jensen's inequality. Okay, so at this point, let me explain a few things about how this is all going to go down. And this is actually sort of the beginning of how we move towards something reasonable, right? If this were a math course, we could just go for the rest of the quarter, and I could show you interesting convex sets and go off on weird tangents and stuff like that, which would be fine."}],"speech_gaps":[],"frame":"../frames/v003/026.webp","frame_time":4248.78},{"title":"凸函数的定义与计算方法","segments":[{"id":254,"text":"No, it wouldn't actually, but anyway. So, okay, so here's, so the way we're going to do this is we're going to do this like a, it's going to be a calculus, right? Oh, and by the way, it's not just the right way to think of it mathematically. It's going to turn out, this is also what makes this 100% actionable in code. So everything we're about to say is math, but it's going to be, it's actually going to be backed up in code, and it's actually going to be the key to a whole lot of stuff. Okay, so.","zh":"不，实际上不会，不过没关系。所以，好的，我们接下来要怎么做呢？我们会用一种类似微积分的方法来做，对吧？顺便说一句，这不仅是数学上正确的思维方式，它还会使我们在代码中实现变得100%可行。我们接下来要说的一切都是数学内容，但它们实际上会在代码中得到支持，并且是很多内容的关键。好的，所以。","start":4407.49,"end":4434.86},{"id":255,"text":"You know, how do you find out if a function is convex? Well, you know, every now and then, extremely rarely, and you should do this only if you're absolutely pushed, if you have no other option, it's basically, okay, let x be in the domain, let y be in the domain, let theta be between 0 and 1, f of theta x plus 1 minus theta y, and then, you know, a lot of math and argument and stuff like that. So don't do that if you can avoid that, okay?","zh":"你知道吗，如何判断一个函数是否是凸函数？嗯，偶尔，极其罕见的情况下，如果你别无选择，才应该这么做。基本上，设x在定义域内，y在定义域内，θ在0和1之间，计算f(θx + (1 - θ)y)，然后进行大量的数学推导和论证之类的事情。所以，如果可以避免，就不要这么做，好吗？","start":4435.74,"end":4464.72},{"id":256,"text":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian.","zh":"如果函数是二阶可导的，你可以计算Hessian矩阵。你知道吗？也不要这么做。除非是超级简单的情况。但一般来说，这不是正确的方法。它适用于展示对数行列式。抱歉，这是个不好的例子。对数行列式是一个非常好的例子。如果有人说要证明对数行列式是凹函数，你可以说，这不成问题。我只需要计算Hessian矩阵就可以了。","start":4465.34,"end":4493.55},{"id":257,"text":"of the log determinant with respect to a matrix. Everybody following this? Well, okay, matrix already has two entries, two indices. It's indexed by i and j. The Hessian is indexed by four. That's i, j, k, l. Now, in my experience, the only people who are actually able to actually work with tensors, like things with four indices, are people in mechanical engineering. So they can do it. These are like weird stress-strain tensors. Some physicists can do it.","zh":"关于矩阵的对数行列式的Hessian矩阵。大家跟上了吗？好吧，矩阵本身已经有两个元素，两个索引。它是用i和j来索引的。而Hessian矩阵则是用四个索引，即i、j、k、l。在我的经验中，真正能够处理具有四个索引的张量的人，通常是机械工程领域的人员。他们可以做到这一点。这些是像奇怪的应力-应变张量之类的。一些物理学家也可以做到这一点。","start":4494.41,"end":4522.99},{"id":258,"text":"Or at least they say they can do it. But honestly, normal people can't do that, right? And how on earth would you write down some crazy... I said, well, show me my 100 by 100 matrix is positive. You go, let's work out the Hessian. There's 5,000 entries, so it's a 5,000 by 5... Anyway, it just gets very unattractive. Everybody following this? So, okay. All right. Okay. This is the right way to do it. And it's a calculus. And the way you do that is...","zh":"或者至少他们说他们能做到。但说实话，普通人是做不到的，对吧？那你怎么可能写出一些疯狂的……我说，好吧，给我展示我的100乘100矩阵是正定的。你去算一下Hessian矩阵。里面有5000个元素，所以是5000乘以5……总之，这变得非常不吸引人。大家跟上了吗？所以，好的。好吧。好的。这才是正确的方法。这是一种微积分的方法。而你这样做方式是……","start":4523.48,"end":4550.02},{"id":259,"text":"We will have a bunch of atoms, things that we know are convex functions. Here's one. You know, log is concave. Exp is convex. Log sum exp is convex. Log determinant is concave, right? So you're going to have these things. You're going to have, there's not that many of them, right? 20, 30, 50, I don't know. It's not that many. You will know all of them.","zh":"我们将有一系列基本函数，也就是我们已知是凸函数的事物。这里有一个。你知道，对数是凹函数，指数是凸函数，对数求和指数是凸函数，对数行列式是凹函数，对吧？所以你会有这些函数。你会有，种类并不多，对吧？20、30、50，我不知道。并不是很多。你都会知道它们。","start":4550.41,"end":4567.93},{"id":260,"text":"I mean, you'll know a bunch of them, right? And then you're going to learn calculus rules, which is how you combine these things, right? And so, you know, some of these are going to be mind-numbingly simple, like here's one.","zh":"我的意思是，你会知道一些，对吧？然后你将学习一些微积分规则，这些规则告诉你如何将这些函数组合起来，对吧？因此，你知道，其中一些规则会非常简单，比如这里有一个。","start":4568.36,"end":4581.14}],"notes":["本段主要讲解了如何判断一个函数是否为凸函数。教授指出，直接通过定义来判断（即验证函数在任意两点之间的线段上是否始终位于函数图像的上方）是一种极端罕见的方法，仅在没有其他选择时才应使用。这种方法需要验证函数在任意两点之间的线性组合是否满足凸性条件，这在实际操作中非常繁琐。","教授进一步指出，对于二阶可导的函数，可以通过计算Hessian矩阵来判断凸性。然而，这种方法通常不推荐使用，除非函数非常简单。例如，对于对数行列式函数，计算其Hessian矩阵是判断其凹性的有效方法。","教授提到，Hessian矩阵的计算对于矩阵函数来说会变得非常复杂，因为矩阵本身具有两个索引，而Hessian矩阵则需要四个索引。这种高维张量的处理通常只有机械工程和部分物理学家能够胜任，普通人在实际操作中难以处理。","教授强调，直接计算Hessian矩阵对于大型矩阵（如100x100矩阵）来说是不现实的，因为这会涉及大量的计算和存储需求。因此，教授建议使用更高效的方法来判断凸性。","教授指出，凸优化中有一些基本的凸函数，如对数函数（凹）、指数函数（凸）、对数和指数函数（凸）以及对数行列式函数（凹）。这些基本函数构成了凸优化的基础。","最后，教授提到，学习凸优化需要掌握这些基本函数以及如何通过计算规则将它们组合起来。这些规则可能非常简单，但却是构建复杂凸优化问题的关键。"],"formulas":[{"latex":"\\text{Hessian}","symbols":"Hessian 矩阵","explanation":"Hessian 矩阵是二阶导数矩阵，用于判断函数的凸性，但原始文本中未给出具体定义，因此保留。","evidence":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"latex":"\\text{log determinant}","symbols":"对数行列式","explanation":"对数行列式是一个常见的数学对象，用于描述矩阵的性质，保留。","evidence":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"latex":"\\text{log, exp, log sum exp, log determinant}","symbols":"对数、指数、对数和指数、对数行列式","explanation":"这些是常见的凸函数或凹函数，用于构建凸函数的集合，保留。","evidence":"We will have a bunch of atoms, things that we know are convex functions. Here's one. You know, log is concave. Exp is convex. Log sum exp is convex. Log determinant is concave, right? So you're going to have these things. You're going to have, there's not that many of them, right? 20, 30, 50, I don't know. It's not that many. You will know all of them."}],"uncertainties":["Hessian of log determinant 的具体形式和计算方法未明确说明，可能需要进一步澄清。","log sum exp 的具体定义和性质未详细展开，可能需要进一步说明。"],"diagram":"none","start":4407.49,"end":4581.14,"asr_flags":[],"math_clarifications":["公式0描述的是凸函数的定义，但原始文本中未明确给出函数的凸性判断条件，因此无法确定其正确性，故移除。公式3描述的是对数行列式的 Hessian 矩阵，但原始文本中未明确给出定义，因此无法核定，移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4407.49,"text":"No, it wouldn't actually, but anyway. So, okay, so here's, so the way we're going to do this is we're going to do this like a, it's going to be a calculus, right? Oh, and by the way, it's not just the right way to think of it mathematically. It's going to turn out, this is also what makes this 100% actionable in code. So everything we're about to say is math, but it's going to be, it's actually going to be backed up in code, and it's actually going to be the key to a whole lot of stuff. Okay, so."},{"start":4435.74,"text":"Okay, so let's go over these things. You know, how do you find out if a function is convex? Well, you know, every now and then, extremely rarely, and you should do this only if you're absolutely pushed, if you have no other option, it's basically, okay, let x be in the domain, let y be in the domain, let theta be between 0 and 1, f of theta x plus 1 minus theta y, and then, you know, a lot of math and argument and stuff like that. So don't do that if you can avoid that, okay?"},{"start":4465.34,"text":"If it's twice differentiable, you can compute the Hessian. You know what? Don't do that either. Unless it's something super simple. But generally speaking, that's not the right way to do it. It is for showing log determinant. Sorry, that's a bad example. Log determinant is a really good example. If someone says show log determinant is concave, you go, not a problem. All I have to do is calculate the Hessian."},{"start":4494.41,"text":"of the log determinant with respect to a matrix. Everybody following this? Well, okay, matrix already has two entries, two indices. It's indexed by i and j. The Hessian is indexed by four. That's i, j, k, l. Now, in my experience, the only people who are actually able to actually work with tensors, like things with four indices, are people in mechanical engineering. So they can do it. These are like weird stress-strain tensors. Some physicists can do it."},{"start":4523.48,"text":"Or at least they say they can do it. But honestly, normal people can't do that, right? And how on earth would you write down some crazy... I said, well, show me my 100 by 100 matrix is positive. You go, let's work out the Hessian. There's 5,000 entries, so it's a 5,000 by 5... Anyway, it just gets very unattractive. Everybody following this? So, okay. All right. Okay. This is the right way to do it. And it's a calculus. And the way you do that is..."},{"start":4550.41,"text":"We will have a bunch of atoms, things that we know are convex functions. Here's one. You know, log is concave. Exp is convex. Log sum exp is convex. Log determinant is concave, right? So you're going to have these things. You're going to have, there's not that many of them, right? 20, 30, 50, I don't know. It's not that many. You will know all of them."},{"start":4568.36,"text":"I mean, you'll know a bunch of them, right? And then you're going to learn calculus rules, which is how you combine these things, right? And so, you know, some of these are going to be mind-numbingly simple, like here's one."}],"speech_gaps":[],"frame":"../frames/v003/027.webp","frame_time":4419.49},{"title":"凸函数的性质与构造性分析","segments":[{"id":261,"text":"The sum of two convex functions is convex. Well, I mean, first of all, it's obvious. Draw a picture in your head, draw a function that goes up, another one goes up, add them together, it still curves up. Like, hello, of course, right? So, anyway, that's one. But, you know, some of these are going to be, we're going to see some very interesting ones that are not obvious in some of these rules. Not only that, it's going to turn out that at least all these four, which we teach as separate rules, it turns out, weirdly, they're all the same rule, which we'll get to.","zh":"两个凸函数的和仍然是凸函数。嗯，我的意思是，这很明显。在脑海中画一个图，画一个上升的函数，另一个也是上升的，把它们加在一起，它仍然向上弯曲。比如，你好，当然，对吧？所以，不管怎样，这是其中一条。但是，你知道的，有些这些规则会很有趣，它们在某些规则中并不明显。不仅如此，结果会发现，至少这四个，我们教作不同的规则，结果发现，奇怪的是，它们其实都是同一个规则，我们之后会讲到。","start":4581.93,"end":4611.21},{"id":262,"text":"Not only that, it's the main rule behind constructing code where you can verify a function is convex or concave, which we will get to later, and you will be doing in about two weeks. This is the program. It's constructive convexity analysis. That's what this is. No gradients are harmed in the proving of convexity, which you don't want to do anyway.","zh":"不仅如此，这是构建代码以验证函数是否为凸函数或凹函数的主要规则，我们之后会讲到，你们大约在两周后会做这个。这就是程序。这是构造性凸性分析。这就是这个主题。证明凸性时不会伤害梯度，而你本来就不想这么做。","start":4611.76,"end":4639.21},{"id":263,"text":"Right. And, you know, no one is going to like, you're not going to go back to the basic definition. OK, so we'll look at a couple of these and then we'll quit for today. But this is kind of this is that this is the point at which it'll start transitioning to something that you can actually that's actionable. Right. So, OK, so we'll start simple. Right. You know, here, you know, here's one, you know, 3.7 times a convex function. That's convex.","zh":"对的。而且，没有人会喜欢回到基本定义。好的，所以我们看看几个这些例子，然后今天就结束。但这是这个点，它会开始过渡到你可以实际操作的东西。对的。所以，好的，我们从简单开始。对的。你知道的，这里有一个，你知道的，3.7乘以一个凸函数。这也是凸函数。","start":4640.97,"end":4669.07},{"id":264,"text":"Well, okay, whatever. Like the curvature just went up by 3.7. It was non-negative before, and now it's even more non-negative, if that makes any sense, right? Which it doesn't, but okay, that's fine. Okay, the sum, sum of two convex, and by the way, you know, somebody has to prove these. They're, you know, these are like one-liners. I'll tell you when a couple that aren't one-liners, but these are one-liners, right? Here's one.","zh":"好吧，不管怎样。比如，曲率只是增加了3.7。它之前是非负的，现在甚至更加非负，如果这有任何意义的话，对吧？这其实没有意义，但没关系。好的，和，两个凸函数的和，顺便说一句，你知道的，有人必须证明这些。它们，你知道的，这些就像一句话就能说明白的。我会告诉你一些不是一句话就能说明白的例子，但这些是一句话就能说明白的，对吧？这里有一个。","start":4670.12,"end":4691.88},{"id":265,"text":"Pre-composition with an affine function. So if I have an affine function, that's ax plus b, and I take that, and then I pump it into a convex function, this is a function of x, and it's also convex. And that's not hard to show. I mean, it kind of makes sense, right? Okay, let's look at some examples, okay? So this function is going to come up later in the class.","zh":"与仿射函数的预合成。如果你有一个仿射函数，即ax加b，然后你把这个函数输入到一个凸函数中，这是关于x的函数，它也是凸函数。这并不难证明。我的意思是，这在某种程度上是合理的，对吧？好的，我们来看一些例子，好吗？这个函数会在课上后面出现。","start":4692.34,"end":4714.66},{"id":266,"text":"It's called the log barrier. Its domain is all x's for which all of these numbers are positive. I mean, otherwise the log doesn't mean anything, right? Oh, in this class, the domain of log is R++, right? So if you're taking a class on complex analysis, that's not true, right? So just depends on the social context. But here, when I write, you know, log determinant, log, that's what it means, okay? So, okay.","zh":"这被称为对数障碍函数。它的定义域是所有这些数都为正的x值。我的意思是，否则对数就没有意义了，对吧？哦，在这门课中，对数的定义域是正实数R++，对吧？所以如果你上的是复分析课，那就不对了，对吧？所以这取决于社会背景。但在这里，当我写对数行列式、对数的时候，就是这个意思，明白了吗？好的，好的。","start":4715.77,"end":4740.77}],"notes":["本段讲授了凸函数的基本性质，即两个凸函数的和仍然是凸函数。讲者指出这一性质是显而易见的，可以通过图像直观理解。同时，讲者提到虽然这些性质看似简单，但有些规则在后续课程中会显得更加重要，并且这些规则本质上是同一规则的不同表现形式。","讲者强调了构造性凸性分析的重要性，这是课程中一个关键的程序。通过这一规则，学生可以编写代码来验证函数是否为凸函数或凹函数。讲者还指出，证明凸性时不需要使用梯度，这与传统的证明方法不同。","讲者提到，虽然这些性质看似简单，但有些证明需要更深入的分析。例如，3.7倍的凸函数仍然是凸函数，因为其曲率非负，且乘以正数后曲率仍然非负。讲者指出，这些证明通常是简短的，但有些可能需要更复杂的推导。","讲者介绍了预组合（pre-composition）与仿射函数的关系，即仿射函数与凸函数的组合仍然是凸函数。这一性质可以通过简单的数学推导来证明，但讲者指出，这需要一定的理解。","讲者提到一个重要的例子——对数障碍函数（log barrier），其定义域是所有正数。讲者指出，在本课程中，对数函数的定义域是正实数（R++），这与复分析中的定义不同，但取决于上下文。","讲者强调了课程中对数函数的定义域是正实数，这在后续的课程内容中会频繁出现，例如对数行列式（log determinant）等概念。讲者指出，这一定义是课程中约定俗成的，与其它数学领域可能有所不同。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4581.93,"end":4740.77,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4581.93,"text":"the sum of two convex functions is convex. Well, I mean, first of all, it's obvious. Draw a picture in your head, draw a function that goes up, another one goes up, add them together, it still curves up. Like, hello, of course, right? So, anyway, that's one. But, you know, some of these are going to be, we're going to see some very interesting ones that are not obvious in some of these rules. Not only that, it's going to turn out that at least all these four, which we teach as separate rules, it turns out, weirdly, they're all the same rule, which we'll get to."},{"start":4611.76,"text":"Not only that, it's the main rule behind constructing code where you can verify a function is convex or concave, which we will get to later, and you will be doing in about two weeks. This is the program. It's constructive convexity analysis. That's what this is. No gradients are harmed in the proving of convexity, which you don't want to do anyway."},{"start":4640.97,"text":"Right. And, you know, no one is going to like, you're not going to go back to the basic definition. OK, so we'll look at a couple of these and then we'll quit for today. But this is kind of this is that this is the point at which it'll start transitioning to something that you can actually that's actionable. Right. So, OK, so we'll start simple. Right. You know, here, you know, here's one, you know, 3.7 times a convex function. That's convex."},{"start":4670.12,"text":"Well, okay, whatever. Like the curvature just went up by 3.7. It was non-negative before, and now it's even more non-negative, if that makes any sense, right? Which it doesn't, but okay, that's fine. Okay, the sum, sum of two convex, and by the way, you know, somebody has to prove these. They're, you know, these are like one-liners. I'll tell you when a couple that aren't one-liners, but these are one-liners, right? Here's one."},{"start":4692.34,"text":"pre-composition with an affine function. So if I have an affine function, that's ax plus b, and I take that, and then I pump it into a convex function, this is a function of x, and it's also convex. And that's not hard to show. I mean, it kind of makes sense, right? Okay, let's look at some examples, okay? So this function is going to come up later in the class."},{"start":4715.77,"text":"It's called the log barrier. Its domain is all x's for which all of these numbers are positive. I mean, otherwise the log doesn't mean anything, right? Oh, in this class, the domain of log is R++, right? So if you're taking a class on complex analysis, that's not true, right? So just depends on the social context. But here, when I write, you know, log determinant, log, that's what it means, okay? So, okay."}],"speech_gaps":[],"frame":"../frames/v003/028.webp","frame_time":4593.93},{"title":"对数障碍函数的凸性","segments":[{"id":267,"text":"Okay, so here, this is the so-called log barrier of a set of linear inequalities, right? And all the inequalities have to be strict. In other words, you better have a_i transpose x less than b. Otherwise, this thing, this log doesn't even make sense, right? And so that's the log barrier. And it turns out that's going to be convex. It's got a minus in front.","zh":"好的，这里所说的是一种称为线性不等式集合的对数障碍函数，对吧？而且所有的不等式都必须是严格的。换句话说，你最好满足a_i转置x小于b。否则，这个对数函数就没有意义了，对吧？这就是所谓的对数障碍函数。结果发现它将是凸函数，前面有一个负号。","start":4742.25,"end":4765.3},{"id":268,"text":"Why? And you know the rule would go something like this. Well, let's see. This is an affine function with a concave function, right? And then concave of affine, I'm saying it the way you will say it, and you will think it by week three. This is the way you will think. You'll say concave of affine is concave, okay? Then sum of concave is concave.","zh":"为什么？你大概会这样想：这是一个仿射函数与一个凹函数的组合，对吧？然后凹函数作用于仿射函数，我会这样表达，你到第三周就会这样思考。这就是你将要思考的方式。你会说凹函数作用于仿射函数是凹的，对吧？然后凹函数的和仍然是凹的。","start":4765.77,"end":4789.93},{"id":269,"text":"Minus converts concave to convex. Everybody following this? You will be doing this without even thinking. It's going to be like parsing English syntax. This is how it's going to work. We're going to talk at very high levels and you're going to say things like that and that's the way it's going to work. I think what we'll do is we'll quit here. We'll finish this off next time. By the end of next lecture, by the end of this week, you will have survived. Maybe.","zh":"负号会将凹函数转换为凸函数。大家跟上了吗？你们会不假思索地这样做。这会像解析英语语法一样自然。这就是它的工作方式。我们会以非常高的层次进行讨论，你们会说出这样的话，这就是它的工作方式。我想我们在这里就停下来吧。我们下次再继续。到下一次课结束，到本周结束时，你们就会存活下来了。也许吧。","start":4791.94,"end":4819.74},{"id":270,"text":"We'll see.","zh":"我们看看吧。","start":4820.91,"end":4821.25}],"notes":["本段讲解了对数障碍函数的概念，它用于处理线性不等式约束，所有不等式必须严格成立，即 a_i^T x \u003c b。如果等式成立，则对数函数无定义。对数障碍函数是凸函数，其形式为 -Σ log(b_i - a_i^T x)。","讲者解释了对数障碍函数的凸性推导过程。首先，每个项是凹函数（因为对数函数是凹的），而线性函数是仿射函数。凹函数与仿射函数的复合仍然是凹函数。多个凹函数的和仍然是凹函数。然后，负号将凹函数转换为凸函数。","讲者强调，这种推理方式会在后续课程中自然形成，类似于英语语法的解析。学生需要在高层面理解这些概念，并在后续课程中熟练应用。","讲者提到课程将在本节课结束，相关内容将在下节课继续讲解。学生将在本周末掌握这些内容，但讲者也表示这可能只是推测。","本段内容涉及凸优化中的对数障碍函数及其凸性证明，是凸优化课程中的重要概念。"],"formulas":[{"latex":"f(x) = -\\log(b_i - a_i^T x)","symbols":"对数障碍函数","explanation":"公式正确，表示对数障碍函数，其中 $ b_i - a_i^T x $ 是严格正的，以确保对数定义域有效。","evidence":"Okay, so here, this is the so-called log barrier of a set of linear inequalities, right? And all the inequalities have to be strict. In other words, you better have a i transpose x less than b. Otherwise, this thing, this log doesn't even make sense, right? And so that's the log barrier. And it turns out that's going to be convex. It's got a minus in front."}],"uncertainties":[],"diagram":"none","start":4742.25,"end":4821.25,"asr_flags":[],"math_clarifications":["公式中的对数障碍函数 $ f(x) = -\\log(b_i - a_i^T x) $ 是凸函数，因为它是凹函数（对数函数）的负数，而凹函数的负数是凸函数。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":4742.25,"text":"Okay, so here, this is the so-called log barrier of a set of linear inequalities, right? And all the inequalities have to be strict. In other words, you better have a i transpose x less than b. Otherwise, this thing, this log doesn't even make sense, right? And so that's the log barrier. And it turns out that's going to be convex. It's got a minus in front."},{"start":4765.77,"text":"Why? And you know the rule would go something like this. Well, let's see. This is an affine function with a concave function, right? And then concave of affine, I'm saying it the way you will say it, and you will think it by week three. This is the way you will think. You'll say concave of affine is concave, okay? Then sum of concave is concave."},{"start":4791.94,"text":"Minus converts concave to convex. Everybody following this? You will be doing this without even thinking. It's going to be like parsing English syntax. This is how it's going to work. We're going to talk at very high levels and you're going to say things like that and that's the way it's going to work. I think what we'll do is we'll quit here. We'll finish this off next time. By the end of next lecture, by the end of this week, you will have survived. Maybe."},{"start":4820.91,"text":"We'll see."}],"speech_gaps":[],"frame":"../frames/v003/029.webp","frame_time":4754.25}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v003.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>${point.visual_source?.verified?'原PPT提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p>${point.visual_source?.verified?`<section class="ppt-source"><h3>原PPT对照 · ${esc(point.visual_source.slide_number)}</h3><a href="${esc(point.visual_source.slide_image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.visual_source.slide_image)}" style="width:100%;border:1px solid #ccd9dd;border-radius:8px" alt="原PPT第${esc(point.visual_source.slide_number)}页"></a><p class="muted">已对照本讲视频 ${stamp(point.visual_source.video_time)} 的画面。<a href="${esc(point.visual_source.source_url)}" target="_blank" rel="noopener">原始讲义 PDF</a> · PDF 第 ${point.visual_source.pdf_page} 页</p><p><b>从原页提取：</b>${point.visual_source.items.map(esc).join('；')}</p></section>`:''}<div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(f=>'<p class="muted">'+esc(f.origin||'讲者讲述与既有整理')+'</p>'+formula(f)).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
