 night homeworks, just to let you know."},{"start":39.36,"text":"I like to think of it, you want to savor it."},{"start":43.24,"text":"So, I mean, actually, quite seriously, I do want to say that, you know, for homework one, it's pretty challenging."},{"start":51.62,"text":"I mean, there are at least some parts that are actually quite challenging."},{"start":54.84,"text":"And I'm sort of hoping you'd have the sense to not bang your head on a wall for several hours on one problem or something like that."},{"start":61.98,"text":"and just at some point just to walk away that perfectly that's totally totally"},{"start":66.02,"text":"okay to do right so yeah so that's it and especially at this point in the"},{"start":72.12,"text":"class where this is just background material it's completely and utterly"},{"start":76.8,"text":"unmotivated at this point but what's gonna happen is you will be using all of"},{"start":82.12,"text":"these things for the rest of the quarter and so what's funny is people who I"},{"start":87.66,"text":"mean I remember talking to people who said I remember doing like homework one"},{"start":90.62,"text":"and homework two and having just no idea like no idea what was going on"},{"start":93.8,"text":"and then by homework eight and nine when they've actually used it to you know fit"},{"start":97.56,"text":"models or optimize uh you know flow on some network"},{"start":101.46,"text":"or something like that then they were like okay now i get it"},{"start":104.94,"text":"all so anyway so just that that's sort of just"},{"start":108.44,"text":"Let's see, any questions about last time? Otherwise, we'll continue on. May I remind you, this week is continuing our slog through the math. It will finish pretty much on Friday. So already next week, you know, the sun is going to come out. And if you've survived, it'll start getting actually very interesting. Okay, any..."},{"start":133.63,"text":"No question? So in that case, what I'll do is I'll just, let me just say, remind you where we were. Last time we talked about the idea of defining an inequality in terms of a cone, a proper cone, right? And so that's a general construction. The truth is we really mostly do this only with two specific cones. One is a non-negative orthant, and that allows us to compare two vectors."},{"start":156.55,"text":"And basically, one vector is less than another when element-wise, the corresponding entries are less than the other. And the other one is the positive semi-definite cone. And that allows us to compare two symmetric matrices. And you say that one is bigger than another if the difference is positive semi-definite. And I'm presuming you've seen this somewhere. So I don't think these are too, you know, these shouldn't be completely brand new."}],"speech_gaps":[],"frame":"../frames/v003/001.webp","frame_time":17.23},{"title":"向量不等式与最小值概念的扩展","segments":[{"id":20,"text":"So what I mentioned at the end of last time is something quite interesting, right? That the idea of when you generalize an inequality, I mean, just the fact that the symbol we're using and the name we're using, which is inequality, like all powerful notation, it should remind you of inequalities among real numbers, right? That's sort of the idea, right? I mean, it's the same way when you write down AX equals B, where that's a matrix equation, and somebody looks at it and said..."},{"id":21,"text":"wait, I solved problems like that in third grade. The response is, yeah, but that's a 2,000 by 1,000 matrix there, right? Or something like that, right? So it's the same idea. And the idea of this generalization is that many things you know are true, many things, sorry, many things you know in the old context remain true and some don't. If everything remained true, then it's really not even a generalization. It's just, you're just saying it now applies to more things, right? And so the main thing that does not,"},{"id":22,"text":"that you don't have when you are looking at vector inequalities is it's not a linear or total ordering. And what that means is you can have two things and it is false that this one is less than that and the other way around. Now, for real numbers, that's impossible, right? Because either one real number is either less than or equal to the other or the other way around, period, right? And so that's called a linear or total ordering."},{"id":23,"text":"And you don't have that with vectors, right?"},{"id":24,"text":"And, you know, this is kind of obvious."},{"id":25,"text":"Actually, we're going to see later that this actually has a lot of interesting practical implications that we will get to."},{"id":26,"text":"Okay, so one thing that happens then is, you know, everyone knows what the minimum is, right, of a bunch of numbers."},{"id":27,"text":"And by the way, I might as well mention it now."},{"id":28,"text":"When you have an infinite set of numbers, the min is replaced with something called the infimum."},{"id":29,"text":"If you know about this, that's fine."},{"id":30,"text":"If you don't, think of it as the min."},{"id":31,"text":"It is just the min, but it applies to infinite sets, okay?"},{"id":32,"text":"So that's really pretty much all you need to know."},{"id":33,"text":"Okay, so what happens with a vector here, when vector inequalities,"},{"id":34,"text":"is that the idea of min, or infimum, or minimum, or maximum for that matter,"},{"id":35,"text":"actually splits into two concepts, which are very different."},{"id":36,"text":"one is still called the minimum and the other one is still called is called"},{"id":37,"text":"actually minimal and so these are just two different ideas right and we'll see"},{"id":38,"text":"actually later that they this is going to come up in all sorts of in various"},{"id":39,"text":"applications and be kind of interesting right so minimum means that it's a point"},{"id":40,"text":"in the set with the following property that everything else in that set is"}],"notes":["本段讲解了向量不等式与标量不等式之间的区别，特别是向量不等式不具有线性或全序的性质。在标量中，任意两个数之间都有明确的大小关系，但在向量中，这种关系可能不存在，即无法确定一个向量是否小于另一个向量。","接着，课程提到在处理无限集合时，最小值的概念被替换为下确界（infimum）。下确界是集合中所有元素的下界中最大的那个，它可能并不在集合中，但它是集合的一个极限概念。","随后，课程指出在向量不等式的背景下，最小值和极小值这两个概念被区分开来。最小值指的是集合中满足某种性质的点，而极小值则是一个更弱的概念，它仅要求该点在集合中没有其他点比它更小。","这些概念的区分在后续的优化问题中非常重要，尤其是在处理凸集和凸函数时，最小值和极小值的差异会影响优化算法的设计和收敛性分析。","课程还提到，这些概念将在后续的课程中被进一步探讨，并在各种应用中出现，例如在凸优化问题中寻找最优解时，需要区分最小值和极小值的概念。","最后，课程强调了这些概念的实际意义，特别是在处理向量不等式和优化问题时，理解最小值和极小值的区别对于正确应用优化理论至关重要。"],"formulas":[],"uncertainties":["the other one is still called is called","they this is going to come up in all sorts of in various"],"diagram":"none","start":185.5,"end":349.22,"asr_flags":[],"raw_segments":[{"start":185.5,"text":"So what I mentioned at the end of last time is something quite interesting, right? That the idea of when you generalize an inequality, I mean, just the fact that the symbol we're using and the name we're using, which is inequality, like all powerful notation, it should remind you of inequalities among real numbers, right? That's sort of the idea, right? I mean, it's the same way when you write down AX equals B, where that's a matrix equation, and somebody looks at it and said..."},{"start":212.31,"text":"wait, I solved problems like that in third grade. The response is, yeah, but that's a 2,000 by 1,000 matrix there, right? Or something like that, right? So it's the same idea. And the idea of this generalization is that many things you know are true, many things, sorry, many things you know in the old context remain true and some don't. If everything remained true, then it's really not even a generalization. It's just, you're just saying it now applies to more things, right? And so the main thing that does not,"},{"start":241.64,"text":"that you don't have when you are looking at vector inequalities is it's not a linear or total ordering. And what that means is you can have two things and it is false that this one is less than that and the other way around. Now, for real numbers, that's impossible, right? Because either one real number is either less than or equal to the other or the other way around, period, right? And so that's called a linear or total ordering."},{"start":265.62,"text":"And you don't have that with vectors, right?"},{"start":267.72,"text":"And, you know, this is kind of obvious."},{"start":269.44,"text":"Actually, we're going to see later that this actually has a lot of interesting practical implications that we will get to."},{"start":274.66,"text":"Okay, so one thing that happens then is, you know, everyone knows what the minimum is, right, of a bunch of numbers."},{"start":282.16,"text":"And by the way, I might as well mention it now."},{"start":285.9,"text":"When you have an infinite set of numbers, the min is replaced with something called the infimum."},{"start":291.48,"text":"If you know about this, that's fine."},{"start":293.12,"text":"If you don't, think of it as the min."},{"start":295.62,"text":"It is just the min, but it applies to infinite sets, okay?"},{"start":298.62,"text":"So that's really pretty much all you need to know."},{"start":302.22,"text":"Okay, so what happens with a vector here, when vector inequalities,"},{"start":311.5,"text":"is that the idea of min, or infimum, or minimum, or maximum for that matter,"},{"start":318.08,"text":"actually splits into two concepts, which are very different."},{"start":322.28,"text":"one is still called the minimum and the other one is still called is called"},{"start":328.82,"text":"actually minimal and so these are just two different ideas right and we'll see"},{"start":333.96,"text":"actually later that they this is going to come up in all sorts of in various"},{"start":338.16,"text":"applications and be kind of interesting right so minimum means that it's a point"},{"start":343.82,"text":"in the set with the following property that everything else in that set is"}],"speech_gaps":[],"frame":"../frames/v003/002.webp","frame_time":197.5},{"title":"最小值与极小元的概 al to this point with respect to this cone. And that basically looks like this. Let's see if I can do this right. It's going to be all these points here, right? And then we want to intersect that set with the set S, which is here, right?"},{"id":47,"text":"and find out if the only point is this point. And it is. So with respect to that cone, that point x2 is still minimal. Okay. Now we'll get to something called the separating hyperplane theorem. It's actually super famous."}],"notes":["本段讲解了最小值（minimum）和极小元（minimal element）的概念。最小值指的是在某个集合中，存在一个点，使得所有其他点都大于或等于它，且这个点是唯一的。而极小元则是一个点，使得在集合中没有其他点小于或等于它，除了它本身。"],"formulas":[],"uncertainties":[],"diagram":"none","start":350.38,"end":521.79,"asr_flags":[],"raw_segments":[{"start":350.38,"text":"and larger than or equal to you, with respect to that inequality. That's what minimum is, right? You know, it's not hard to show that there's a unique minimum, in that you can't have two different points, which are both, well, before you show it, you'd have to say a minimum, and then after you show it, you're allowed to say the minimum."},{"start":370.7,"text":"Then there's the idea of a minimal element. And a minimal element is one, like here's an example, x2 is minimal for this set S2, and you'd say with respect to the non-negative orthant. And what that means is, very roughly speaking, it means that there's no point in this set here which is less than or equal to x2 except itself."},{"start":397.47,"text":"And so that's sort of shown visually here. You can also see that all of these points are minimal. Everything on this line is minimal. How about like a point there?"},{"start":409.97,"text":"It's not minimal, right? Because there would be points which are comparable, that are in the set, comparable, and less than or equal to, and not equal to that point. Okay, so that's one thing. And this, you'll just have to go to a quiet place and think about this, and you'll get lots of chances throughout the course to get this straight. This is a question. Yes, so when we talk about minimum and minimal, it is always with respect to a specific cone."},{"start":441.61,"text":"Yeah, no, then it would not be this, right? Like, so if I had a different cone, like, let me just draw down a different cone, right? In R2. This is in R2, right? So here's a different cone. Like, it's this little thing here. That's a cone, right? In R2. And then we could ask, is that point minimal with respect to that cone? Do you want to make a guess? Oh, it is."},{"start":472.14,"text":"Yeah, because I'll just reproduce that set a bit here. It looks like this, right? This set looks kind of like that. Here's the point. And what you want to do is you want to look at all the points that are less than or equal to this point with respect to this cone. And that basically looks like this. Let's see if I can do this right. It's going to be all these points here, right? And then we want to intersect that set with the set S, which is here, right?"},{"start":500.53,"text":"and find out if the only point is this point. And it is. So with respect to that cone, that point x2 is still minimal. Okay. Now we'll get to something called the separating hyperplane theorem. It's actually super famous."}],"speech_gaps":[],"frame":"../frames/v003/003.webp","frame_time":362.38},{"title":"分离超平面与凸集的分离","segments":[{"id":48,"text":"I mean, it looks kind of innocent. And you can actually make a reasonable argument that everything we're going to do is based only on this. So it's not bad to have a single visual picture that tells you everything you need to know. And what it says is this. It says that if I have two convex sets, which do not intersect, that's what it means to be disjoint. So I have disjoint convex sets. Then it says..."},{"id":49,"text":"Very roughly speaking, I can stick a hyperplane between. I can separate them by hyperplane, right? And you may have seen this in some machine learning class where you were talking about, you know, two different sets of points being linearly separable. That's how people would say it there. I mean, if you haven't, that's fine too. But so this is the picture, right? If there's a set C and a set D, then there is some non-zero vector A."},{"id":50,"text":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any..."},{"id":51,"text":"the context or anything like that. But we'll see later, it's related to a lot of stuff we're going to see by about week five, right? I mean, it is the basis, for example, of a lot of economics, like period, right? Because this is basically, you'll see later, this will correspond, you'll say something like, well, there's no arbitrage. And that's going to turn out to be a picture like this. I mean, not in two dimensions, but nevertheless, that's what it's going to be. So we're going to see, we'll see that stuff like this, although right now it has no context, it's going to come up over and over again."},{"id":52,"text":"Okay, there's a gazillion variations on this, like, you know, when is this true with these strict, when the inequalities are strict? And then you say they're strictly separated. And it gets complicated and all that sort of stuff. You would see maybe one or two variations in the book, but you actually don't even, I don't think you need to know. You just need to have this picture in your head, right? Now, showing this is actually not too hard. We're not going to do it. I mean, it's sort of like an exercise."},{"id":53,"text":"we'll see things kind of more sophisticated anyway. So that's a separating hyperplane. Yes? What would a singleton be? Oh, a singleton. Yeah. Oh, by the way, thank you for asking. Please ask about anything that's not clear. I try. But that is high BBC mathematics. It means a set with exactly one thing in it. Right? So that's a singleton."}],"notes":["本段讲授了凸集分离定理的基本概念，即两个不相交的凸集可以通过一个超平面分离。讲者提到，这种分离在机器学习中常用于线性可分性，例如不同类别的点集。同时，讲者指出，这种分离定理在经济学中也有应用，如无套利原则，这与分离超平面的图像相对应。","讲者进一步说明了分离超平面的具体形式，即存在一个非零向量a和一个数b，使得一个凸集C完全位于a^T x \u003c b的半空间中，而另一个凸集D完全位于a^T x ≥ b的半空间中。这种分离方式是凸优化中的核心概念，为后续内容奠定了基础。","讲者提到，分离定理在后续课程中会多次出现，特别是在第五周的内容中，涉及经济学、机器学习等多个领域。同时，讲者指出，虽然分离定理本身看似简单，但其应用和变体（如严格分离）会涉及更复杂的数学分析。","讲者强调，理解分离超平面的关键在于掌握其几何图像，而不需要深入证明。此外，讲者还提到，单元素集合（singleton）在数学中表示仅包含一个元素的集合，这是分离定理中的一个基本概念。","讲者鼓励学生在遇到不明确的地方时提问，并指出高阶数学（如分离定理）需要深入理解，但核心思想是通过超平面将不相交的凸集分开，这在多个学科中都有广泛应用。","讲者最后提到，虽然分离定理的证明可能较为复杂，但其核心思想是直观的，即通过超平面将两个集合分开，这种思想在后续课程中会不断出现，并与更多实际问题相关联。"],"formulas":[{"latex":"a^T x \u003c b","symbols":"a^T x \u003c b 表示向量a与点x的点积小于b，定义了半空间","explanation":"公式正确，表示一个半空间的定义，符合凸集分离定理的描述。","evidence":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any..."}],"uncertainties":[],"diagram":"none","start":522.58,"end":686.89,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":522.58,"text":"I mean, it looks kind of innocent. And you can actually make a reasonable argument that everything we're going to do is based only on this. So it's not bad to have a single visual picture that tells you everything you need to know. And what it says is this. It says that if I have two convex sets, which do not intersect, that's what it means to be disjoint. So I have disjoint convex sets. Then it says..."},{"start":551.15,"text":"Very roughly speaking, I can stick a hyperplane between. I can separate them by hyperplane, right? And you may have seen this in some machine learning class where you were talking about, you know, two different sets of points being linearly separable. That's how people would say it there. I mean, if you haven't, that's fine too. But so this is the picture, right? If there's a set C and a set D, then there is some non-zero vector A."},{"start":577.28,"text":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any..."},{"start":604.76,"text":"the context or anything like that. But we'll see later, it's related to a lot of stuff we're going to see by about week five, right? I mean, it is the basis, for example, of a lot of economics, like period, right? Because this is basically, you'll see later, this will correspond, you'll say something like, well, there's no arbitrage. And that's going to turn out to be a picture like this. I mean, not in two dimensions, but nevertheless, that's what it's going to be. So we're going to see, we'll see that stuff like this, although right now it has no context, it's going to come up over and over again."},{"start":633.96,"text":"Okay, there's a gazillion variations on this, like, you know, when is this true with these strict, when the inequalities are strict? And then you say they're strictly separated. And it gets complicated and all that sort of stuff. You would see maybe one or two variations in the book, but you actually don't even, I don't think you need to know. You just need to have this picture in your head, right? Now, showing this is actually not too hard. We're not going to do it. I mean, it's sort of like an exercise."},{"start":663.96,"text":"we'll see things kind of more sophisticated anyway. So that's a separating hyperplane. Yes? What would a singleton be? Oh, a singleton. Yeah. Oh, by the way, thank you for asking. Please ask about anything that's not clear. I try. But that is high BBC mathematics. It means a set with exactly one thing in it. Right? So that's a singleton."}],"speech_gaps":[],"frame":"../frames/v003/004.webp","frame_time":534.58},{"title":"支持超平面与凸集的性质","segments":[{"id":54,"text":"And that's completely standard, right? So, I mean, maybe not in different fields, but in high BBC math. That's why everyone should speak a little bit of fancy high BBC math. You should understand a little bit. You should recognize it and actually speak some, right? I mean, if you're accent-free, that's awesome. Then you can, I don't know, then you can hang out with mathematicians or something. But, I mean, if that's a good thing, I don't know. Anyway, okay."},{"id":55,"text":"And there's variations on it. And this is an important concept. We'll get to this later as well. There's the supporting hyperplane theorem. So first I have to say what a supporting hyperplane is. So a supporting hyperplane is I have a set. It doesn't have to be convex. And I have a point on the boundary of the set here."},{"id":56,"text":"And if you don't know what the boundary is, we could just take that to be a completely informal... Your eyeball will tell you what's on the boundary. So that's the point on the boundary. And then a supporting hyperplane is a hyperplane that, very roughly speaking, is tangent to the set here. And what it means is it passes through this point, but everything in this hap space is not in this set. Or another way to say it is everything..."},{"id":57,"text":"This hyperplane tells you that the set is in one of the half spaces. That's what it tells you. That's the supporting hyperplane. And what it says is if you have a convex set, then there exists a supporting hyperplane at every point. And that's not too... I mean, it's kind of intuitive that this would be the case. The picture would be something like this. Here's a convex set. See?"},{"id":58,"text":"And let's see, let's look at some boundary points. So if you take a point there, there is indeed a supporting hyperplane, and it's basically just tangent to this set, right? By the way, what happens if I go to a corner? Suppose there's a corner there. Let's talk about supporting hyperplanes. Are there some? Is there more than one? Precisely, that's it, right? So when you have a kink..."},{"id":59,"text":"In a set, there's one. Is there a supporting hyperplane to this set at this point? No, no. So that's what it means, yeah, is that there's no hyperplane at that point that supports it at that point and has the set on one side of it, right? But by the way, the opposite, the converse is also true. If a set has a supporting hyperplane at every point of its boundary, then it's convex."},{"id":60,"text":"But again, you know, if you care about these things, that's fine. But it's, you know, a lot of it is just, I think you should think of this intuitively. And these things are just going to come up over and over in applications, which will be really cool. Okay. Okay. Next weird, totally non-motivated thing we're going to do this week is dual cones and generalized inequality."}],"notes":["本段讲授了支持超平面的基本概念，指出支持超平面是与集合相切的超平面，并且通过该超平面可以判断集合位于某个半空间内。支持超平面的定义适用于任意集合，但特别强调了凸集的性质，即凸集在边界上的每个点都存在支持超平面。","支持超平面的定义需要明确集合和边界点的概念。对于非凸集合，可能在某些边界点上不存在支持超平面，而凸集则保证每个边界点都有支持超平面。这为后续的凸优化理论奠定了基础。","在讨论支持超平面时，讲者通过举例说明了在集合的角落或拐点处可能不存在支持超平面，这进一步强调了凸集的特性。同时，讲者指出支持超平面的存在性与集合的凸性之间存在互为充要条件的关系。","讲者提到支持超平面在实际应用中会频繁出现，这表明该概念在优化问题中具有重要价值。此外，讲者还预告了接下来将讨论对偶锥和广义不等式，这些内容与支持超平面密切相关。","讲者在讲解过程中使用了直观的图像描述，帮助学生理解支持超平面的几何意义。同时，讲者也提醒学生注意支持超平面的定义和性质，避免混淆非凸集合和凸集合之间的区别。","支持超平面的概念是凸优化中的核心内容之一，它不仅用于描述凸集的几何性质，还在优化问题的对偶理论中扮演重要角色。因此，理解支持超平面的定义和性质对于掌握凸优化理论至关重要。"],"formulas":[],"uncertainties":["hap space"],"diagram":"none","start":687.34,"end":864.49,"asr_flags":[],"raw_segments":[{"start":687.34,"text":"And that's completely standard, right? So, I mean, maybe not in different fields, but in high BBC math. That's why everyone should speak a little bit of fancy high BBC math. You should understand a little bit. You should recognize it and actually speak some, right? I mean, if you're accent-free, that's awesome. Then you can, I don't know, then you can hang out with mathematicians or something. But, I mean, if that's a good thing, I don't know. Anyway, okay."},{"start":712.1,"text":"And there's variations on it. And this is an important concept. We'll get to this later as well. There's the supporting hyperplane theorem. So first I have to say what a supporting hyperplane is. So a supporting hyperplane is I have a set. It doesn't have to be convex. And I have a point on the boundary of the set here."},{"start":730.56,"text":"And if you don't know what the boundary is, we could just take that to be a completely informal... Your eyeball will tell you what's on the boundary. So that's the point on the boundary. And then a supporting hyperplane is a hyperplane that, very roughly speaking, is tangent to the set here. And what it means is it passes through this point, but everything in this hap space is not in this set. Or another way to say it is everything..."},{"start":756.48,"text":"This hyperplane tells you that the set is in one of the half spaces. That's what it tells you. That's the supporting hyperplane. And what it says is if you have a convex set, then there exists a supporting hyperplane at every point. And that's not too... I mean, it's kind of intuitive that this would be the case. The picture would be something like this. Here's a convex set. See?"},{"start":787.34,"text":"And let's see, let's look at some boundary points. So if you take a point there, there is indeed a supporting hyperplane, and it's basically just tangent to this set, right? By the way, what happens if I go to a corner? Suppose there's a corner there. Let's talk about supporting hyperplanes. Are there some? Is there more than one? Precisely, that's it, right? So when you have a kink..."},{"start":814.65,"text":"In a set, there's one. Is there a supporting hyperplane to this set at this point? No, no. So that's what it means, yeah, is that there's no hyperplane at that point that supports it at that point and has the set on one side of it, right? But by the way, the opposite, the converse is also true. If a set has a supporting hyperplane at every point of its boundary, then it's convex."},{"start":842.68,"text":"But again, you know, if you care about these things, that's fine. But it's, you know, a lot of it is just, I think you should think of this intuitively. And these things are just going to come up over and over in applications, which will be really cool. Okay. Okay. Next weird, totally non-motivated thing we're going to do this week is dual cones and generalized inequality."}],"speech_gaps":[],"frame":"../frames/v003/005.webp","frame_time":699.34},{"title":"对偶锥的概念与例子","segments":[{"id":61,"text":"The first is, so actually, let me just start, let me explain what this is a generalization of, right? So you may know in linear algebra, if that's a subspace, then you have V perp. That's how you pronounce this, right? And that's the set of all, you know, x."},{"id":62,"text":"for which y transpose x equals zero for all, you know, y in v, right? So that's it. So that's a useful concept. It's a set of all things orthogonal to everything in your subspace, right? So that's what, and, you know, it kind of means, it's also called the orthogonal complement is another name for this. It's got a bunch of names, okay?"},{"id":63,"text":"And you probably, you may even know how to, you know, compute a basis for it. If I gave you a basis for like, let's say V or something, right? Okay. So this is the same concept, except now with inequalities. Makes it, in fact, that's kind of, in some sense, that's all we're doing mathematically is we're doing linear algebra with asymmetries. So we replace equalities with inequalities. That's actually all we're doing, right? So, okay. So let's look at what it means to be a dual cone."},{"id":64,"text":"All right, sorry that I switched x and y over there and here, but that's fine. So let's actually just draw some pictures because I think that's really the best way to understand this. Okay, so let me write down the definition. So we have it, which is k star equals... I mean, it's perfectly okay for me not to do this to get it right. This is..."},{"id":65,"text":"for all x in k. There you go. Okay? So it says you have to make a non-negative inner product with every entry of the cone. Cool? Okay. So I'll just do a couple, and then we quit, and I'll let you go off and do this yourself. All right? So let's write down some cones. Oh, look, here's a cone. Ready? Hey, it's a singleton. There we go. So that's a cone. It's a stupid cone, but it's a cone."},{"id":66,"text":"You tell me, what is the dual cone of this? What is it? It's R2. Yeah, because we're doing this in R2 so I can draw it on the board, right? So it's actually everything. Because actually, this is actually, it says, you know, what are the set of vectors so that when you take an inner product with a zero vector, you're bigger than or equal to zero. The answer is like anything, okay? So in this case, you would write it this way."},{"id":67,"text":"This is R2, right? Which is a cone. R2 is a cone. I mean, it's silly. It's also subspecific, but it's a cone. Oh, by the way, this is something you're going to see that's kind of interesting. When you have a dual cone, if the cone itself is kind of small, that's as small as cones get, right? Then your dual cone is big."}],"notes":["本段讲解了对偶锥的概念，它是正交补集的推广，将等式替换为不等式。对偶锥的定义是所有与锥体中每个元素的内积非负的向量集合。讲者提到，当锥体本身很小（如单元素锥）时，其对偶锥会很大，这体现了对偶关系的特性。","讲者通过举例说明了对偶锥的计算方法，例如单元素锥的对偶锥是整个空间R²，因为任何向量与零向量的内积都非负。这展示了对偶锥的定义在不同情况下的应用。","讲者强调了对偶锥在凸优化中的重要性，它与线性代数中的正交补集概念类似，但适用于不等式约束的情况。这种推广使得对偶锥成为处理凸优化问题的重要工具。","讲者提到，对偶锥的定义需要满足所有锥体元素的非负内积条件，这与正交补集的定义有相似之处，但扩展到了更一般的不等式约束。","讲者指出，当锥体非常小时，其对偶锥会变得很大，这说明了对偶关系的非对称性。这种特性在凸优化中具有重要意义，因为它影响了对偶问题的结构和解的性质。","讲者通过简单的例子（如单元素锥）来说明对偶锥的计算方法，这有助于学生理解对偶锥的定义和应用。这种直观的例子有助于学生掌握抽象概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":867.07,"end":1046.33,"asr_flags":[],"raw_segments":[{"start":867.07,"text":"The first is, so actually, let me just start, let me explain what this is a generalization of, right? So you may know in linear algebra, if that's a subspace, then you have V perp. That's how you pronounce this, right? And that's the set of all, you know, x."},{"start":889.02,"text":"for which y transpose x equals zero for all, you know, y in v, right? So that's it. So that's a useful concept. It's a set of all things orthogonal to everything in your subspace, right? So that's what, and, you know, it kind of means, it's also called the orthogonal complement is another name for this. It's got a bunch of names, okay?"},{"start":911.06,"text":"And you probably, you may even know how to, you know, compute a basis for it. If I gave you a basis for like, let's say V or something, right? Okay. So this is the same concept, except now with inequalities. Makes it, in fact, that's kind of, in some sense, that's all we're doing mathematically is we're doing linear algebra with asymmetries. So we replace equalities with inequalities. That's actually all we're doing, right? So, okay. So let's look at what it means to be a dual cone."},{"start":940.33,"text":"All right, sorry that I switched x and y over there and here, but that's fine. So let's actually just draw some pictures because I think that's really the best way to understand this. Okay, so let me write down the definition. So we have it, which is k star equals... I mean, it's perfectly okay for me not to do this to get it right. This is..."},{"start":969.17,"text":"for all x in k. There you go. Okay? So it says you have to make a non-negative inner product with every entry of nd they're not totally straightforward. They involve like, you know, Cauchy-Schwartz inequality or something like that. But, you know, we could, and these are probably best done, you know, in either homework exercises or something like that. But, you know, the things you'd have to show. For example, let's say k equals r plus to the n, non-negative orthon. And when I say the dual of that turns out to be, well, let's just do it in r2. How about that? We'll do it in r2 and then..."},{"id":77,"text":"That'll give you a visual on it, and then you'll know that it actually generalizes. So here's my cone K, right? And now I just ask questions like, who's in the dual cone, right? And I ask a question like, is that in the dual cone? No, because look, here's a point over here in the cone, and it's got a negative inner product with this thing, okay? So this is not, okay? Is this in the dual cone? Let's go slow. What I'm asking is, does this vector..."},{"id":78,"text":"have a non-negative inner product"},{"id":79,"text":"Is it plus or minus 90? Is it within 90 degrees of every vector here? And the answer is, it is. And what you figure out pretty quickly is that the dual cone is going to be, it's basically itself. And then that has a fancy name that's called a self-dual cone. Okay? So this is the picture. Now, by the way, I don't think that you could get all of it now. So if you didn't get it all, not a problem. You will have many, many chances to get this later. Okay."},{"id":80,"text":"Now it turns out this connections between minimum minimal and dual cones and things like that And this is actually going to end up being super Important and in a lot of practical stuff that we'll see later actually a lot of times you've seen you've already seen it, right? so in in other contexts, right, so If a set over here, that's s has a minimum point in this case. It's it's X, right? Then it's a minimum element"}],"notes":["本段主要讲解对偶锥的概念，通过几何直观来理解。对偶锥是原锥的对偶空间，例如一个射线的对偶锥是一个半空间。射线可以看作是一个非常尖锐的锥体 uestions like, who's in the dual cone, right? And I ask a question like, is that in the dual cone? No, because look, here's a point over here in the cone, and it's got a negative inner product with this thing, okay? So this is not, okay? Is this in the dual cone? Let's go slow. What I'm asking is, does this vector..."},{"start":1311.82,"text":"have a non-negative inner product"},{"start":1314.67,"text":"Is it plus or minus 90? Is it within 90 degrees of every vector here? And the answer is, it is. And what you figure out pretty quickly is that the dual cone is going to be, it's basically itself. And then that has a fancy name that's called a self-dual cone. Okay? So this is the picture. Now, by the way, I don't think that you could get all of it now. So if you didn't get it all, not a problem. You will have many, many chances to get this later. Okay."},{"start":1344.08,"text":"Now it turns out this connections between minimum minimal and dual cones and things like that And this is actually going to end up being super Important and in a lot of practical stuff that we'll see later actually a lot of times you've seen you've already seen it, right? so in in other contexts, right, so If a set over here, that's s has a minimum point in this case. It's it's X, right? Then it's a minimum element"}],"speech_gaps":[],"frame":"../frames/v003/008.webp","frame_time":1218.56},{"title":"对偶锥与最小化问题的等价性","segments":[{"id":81,"text":"If and only if, whenever you minimize lambda transpose z over s, for any lambda in the dual cone, you get actually x. It says x is the unique minimizer of this, right? So that's, I mean, it's actually kind of interesting."},{"id":82,"text":"that the cone is the non-negative orthant, right? Then what this says is actually really interesting. If you are a minimum point of a set with respect to the non-negative orthant, it says that pick any positive weights, that's lambda, form this linear combination, minimize, and you always get the same thing. You always arrive at this minimum element, right?"},{"id":83,"text":"So that's what that means. It means independent of these weights. However you weight them, doesn't matter. You always get this minimum element, which kind of makes sense, right? Minimal elements, you can find these actually very nicely. This says you simply take any weight that is positive in the dual cone."},{"id":84,"text":"And then you minimize this linear function over z. And what happens then is you are guaranteed to get a minimal point. Now, you've seen this in other contexts. This is like, you know, when you're doing multi-criterion optimization and you make a weighted combination and you minimize a non-negative weighted combination, you get something that's, you know, Pareto optimal, which we'll talk about all this stuff later. There's a question. What is what?"},{"id":85,"text":"What is, I'm sorry. V. Sorry. Z. Is there some Z? Z is a dummy variable, right? So if I say, this is a function, which is F of Z equals lambda transpose Z. So Z is a dummy variable, right? It has no meaning. You can change it to your favorite character. Yeah."},{"id":86,"text":"Well, lambda itself doesn't... Lambda is anything that is positive in the dual inequality. Right? So it's any vector in the positive dual inequality. That's what it means. Okay? So, again, this is kind of weird and out of context, so I wouldn't worry too much about it, but it's something we will see over and over again. Okay."},{"id":87,"text":"And our first like, you know, baby childish application from economics goes like this. I mean, this is silly, but so I have to produce a product. Right. And I have a production set and a production set in general tells you and you have different ways of producing it. Right. And a production set in general tells you it tells you what are all the choices that parameterize your production set."}],"notes":["本段讲解了对偶锥与最小化问题之间的等价性。当且仅当对于任何属于对偶锥的向量λ，最小化λ^T z的结果是x时，x才是该问题的唯一最小化点。这表明，无论选择怎样的正权重λ，只要满足对偶锥的条件，都能得到相同的最小点。这种性质在多目标优化中也有所体现，例如通过加权组合得到帕累托最优解。","讲者提到，当锥是正象限（non-negative orthant）时，这种性质变得特别有意义。此时，无论选择怎样的正权重λ，对z进行线性组合并最小化，都能得到相同的最小点。这说明了最小点的稳定性，即无论权重如何变化，结果保持一致。","讲者进一步解释了Z是一个哑变量（dummy variable），在函数F(Z) = λ^T Z中，Z没有实际意义，可以替换为任何其他符号。这表明在数学表达中，变量的选择是灵活的，只要满足问题的结构要求。","讲者提到λ是满足对偶不等式的正向量，即任何属于正对偶锥的向量。这表明λ的选择必须满足特定的约束条件，以确保最小化问题的正确性。","最后，讲者提到一个来自经济学的简单应用，即生产集（production set）的概念。生产集描述了所有可能的生产方式，通过参数化这些选择，可以分析生产过程中的不同可能性。","讲者强调，虽然这些概念在数学上可能显得抽象，但在实际应用中（如经济学）会反复出现，因此需要理解其背后的逻辑和结构。"],"formulas":[{"latex":"F(Z) = \\lambda^T Z","symbols":"F(Z) 是一个线性函数，其中 Z 是哑变量，表示任何满足条件的变量。","explanation":"公式正确，表示 F(Z) 是一个线性函数，其中 Z 是哑变量，表示任何满足条件的变量。","evidence":"What is, I'm sorry. V. Sorry. Z. Is there some Z? Z is a dummy variable, right? So if I say, this is a function, which is F of Z equals lambda transpose Z. So Z is a dummy variable, right? It has no meaning. You can change it to your favorite character. Yeah."}],"uncertainties":["lambda itself doesn't..."],"diagram":"none","start":1373.09,"end":1535.36,"asr_flags":[],"math_clarifications":["原始公式存在语法错误，'argmin' 后的条件和表达式不完整，需要修复。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1373.09,"text":"If and only if, whenever you minimize lambda transpose z over s, for any lambda in the dual cone, you get actually x. It says x is the unique minimizer of this, right? So that's, I mean, it's actually kind of interesting. Let's suppose that..."},{"start":1391.6,"text":"that the cone is the non-negative orthant, right? Then what this says is actually really interesting. If you are a minimum point of a set with respect to the non-negative orthant, it says that pick any positive weights, that's lambda, form this linear combination, minimize, and you always get the same thing. You always arrive at this minimum element, right?"},{"start":1416.13,"text":"So that's what that means. It means independent of these weights. However you weight them, doesn't matter. You always get this minimum element, which kind of makes sense, right? Minimal elements, you can find these actually very nicely. This says you simply take any weight that is positive in the dual cone."},{"start":1433.41,"text":"And then you minimize this linear function over z. And what happens then is you are guaranteed to get a minimal point. Now, you've seen this in other contexts. This is like, you know, when you're doing multi-criterion optimization and you make a weighted combination and you minimize a non-negative weighted combination, you get something that's, you know, Pareto optimal, which we'll talk about all this stuff later. There's a question. What is what?"},{"start":1462.67,"text":"What is, I'm sorry. V. Sorry. Z. Is there some Z? Z is a dummy variable, right? So if I say, this is a function, which is F of Z equals lambda transpose Z. So Z is a dummy variable, right? It has no meaning. You can change it to your favorite character. Yeah."},{"start":1487.74,"text":"Well, lambda itself doesn't... Lambda is anything that is positive in the dual inequality. Right? So it's any vector in the positive dual inequality. That's what it means. Okay? So, again, this is kind of weird and out of context, so I wouldn't worry too much about it, but it's something we will see over and over again. Okay."},{"start":1509.46,"text":"And our first like, you know, baby childish application from economics goes like this. I mean, this is silly, but so I have to produce a product. Right. And I have a production set and a production set in general tells you and you have different ways of producing it. Right. And a production set in general tells you it tells you what are all the choices that parameterize your production set."}],"speech_gaps":[],"frame":"../frames/v003/009.webp","frame_time":1385.09},{"title":"凸函数的定义与性质","segments":[{"id":88,"text":"which is feasible. Right. And so this is just a made up thing with like, you know, fuel and labor. I mean, it's silly, but there it is. And it said we can make we can get away. We can produce what we need to any point in with any point in here. And I mean, we're getting a little bit ahead of ourselves, but we can talk. We could talk about this if we decide that. I mean, here I'd call them fuel and labor, but it doesn't matter if we decide that each of these sort of has value."},{"id":89,"text":"Positive value, not negative value. Now, what that tells you is kind of everything down and to the left is better. Because, for example, yeah, let's see. If you took this point and you said, you say, thank you for your order. Here's how I'm going to run my business. Okay, and you take this point. Anybody have a comment about that? What?"},{"id":90,"text":"Yeah, I heard the word. It's good. We'll get to it later. It's not efficient. Or I'll tell you, the technical term for that is, that would be a stupid choice. That's the technical term. Because you'd say, why would you run it like that? Like, excuse me, but this is silly. If you're going to do that, why not do this? And I can make the exact same stuff, and I'll use less fuel and less labor. And some would, I don't know what they would say about that, and they'd say,"},{"id":91,"text":"Yeah, but how do you know it's better? I haven't told you the price of fuel and labor. And you go, dude, as long as they're positive, this is better. OK, everybody got this? So we'll get to all this. And you can see that these are just concepts of efficiency and minimal points. And one name for this is Pareto optimal. And again, we'll come back to this later in quite a lot of detail. But this is things you've seen, I think, or things you've heard of. OK, now we're going to jump into convex functions."},{"id":92,"text":"And, you know, first I'll just say what a convex function is. So a convex function is a function from Rn to R. It's got a domain. That means that's all the points for which F is defined. That's the domain. Okay?"},{"id":93,"text":"And the domain has to be convex. And then it has to satisfy this inequality. And what that inequality says is, I mean, there's some weird terms, but I forget what people call this. But this is the graph of the function here. And I think, oh, this is called a chord, I think. That's like some ancient, you know, comes from ancient Greek or something. So that's a chord of the function. And what it says is the chord lies above the graph, right? Or I like to think of it, it has non-negative curvature, right?"},{"id":94,"text":"It can have zero curvature, right? Then there would be like an affine function. But convexity means non-negative curvature. Or you could even say this. You'd say all convexity is we're talking about the sine of the second derivative. We'll get to that. But roughly speaking, that's what it means, right? Okay. So, and we say a function is concave if minus f is convex, right? That means it curves down."}],"notes":["本段讲解了凸函数的定义，强调了定义域必须是凸集，并且函数图像上的任意弦必须位于图像上方。这是凸函数的核心性质之一。","讲者提到凸函数的几何直观，即非负曲率，这与二阶导数的符号有关。虽然讲者提到‘sine of the second derivative’，但可能是指二阶导数的符号，而非正弦函数。","讲者还指出，如果一个函数是凸函数，那么其负函数就是凹函数，这为后续讨论凹函数提供了基础。","讲者通过举例说明了凸函数的直观意义，即在定义域内任意两点之间的线段上的函数值不大于该线段连接的函数值，这与弦位于图像上方的性质一致。","讲者提到‘chord’这一术语，可能来自古希腊语，但具体来源未详细说明，这表明该术语在数学中已有悠久历史。","讲者强调了凸函数与凹函数之间的关系，即凹函数是凸函数的负函数，这为后续讨论凸优化问题中的目标函数和约束函数提供了理论基础。"],"formulas":[],"uncertainties":["sine of the second derivative"],"diagram":"none","start":1535.94,"end":1714.86,"asr_flags":[],"math_clarifications":["原文未提及二阶导数或曲率的概念，因此无法核定该公式是否适用。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1535.94,"text":"which is feasible. Right. And so this is just a made up thing with like, you know, fuel and labor. I mean, it's silly, but there it is. And it said we can make we can get away. We can produce what we need to any point in with any point in here. And I mean, we're getting a little bit ahead of ourselves, but we can talk. We could talk about this if we decide that. I mean, here I'd call them fuel and labor, but it doesn't matter if we decide that each of these sort of has value."},{"start":1561.1,"text":"Positive value, not negative value. Now, what that tells you is kind of everything down and to the left is better. Because, for example, yeah, let's see. If you took this point and you said, you say, thank you for your order. Here's how I'm going to run my business. Okay, and you take this point. Anybody have a comment about that? What?"},{"start":1587.29,"text":"Yeah, I heard the word. It's good. We'll get to it later. It's not efficient. Or I'll tell you, the technical term for that is, that would be a stupid choice. That's the technical term. Because you'd say, why would you run it like that? Like, excuse me, but this is silly. If you're going to do that, why not do this? And I can make the exact same stuff, and I'll use less fuel and less labor. And some would, I don't know what they would say about that, and they'd say,"},{"start":1613.72,"text":"Yeah, but how do you know it's better? I haven't told you the price of fuel and labor. And you go, dude, as long as they're positive, this is better. OK, everybody got this? So we'll get to all this. And you can see that these are just concepts of efficiency and minimal points. And one name for this is Pareto optimal. And again, we'll come back to this later in quite a lot of detail. But this is things you've seen, I think, or things you've heard of. OK, now we're going to jump into convex functions."},{"start":1645.34,"text":"And, you know, first I'll just say what a convex function is. So a convex function is a function from Rn to R. It's got a domain. That means that's all the points for which F is defined. That's the domain. Okay?"},{"start":1660.92,"text":"And the domain has to be convex. And then it has to satisfy this inequality. And what that inequality says is, I mean, there's some weird terms, but I forget what people call this. But this is the graph of the function here. And I think, oh, this is called a chord, I think. That's like some ancient, you know, comes from ancient Greek or something. So that's a chord of the function. And what it says is the chord lies above the graph, right? Or I like to think of it, it has non-negative curvature, right?"},{"start":1690.08,"text":"It can have zero curvature, right? Then there would be like an affine function. But convexity means non-negative curvature. Or you could even say this. You'd say all convexity is we're talking about the sine of the second derivative. We'll get to that. But roughly speaking, that's what it means, right? Okay. So, and we say a function is concave if minus f is convex, right? That means it curves down."}],"speech_gaps":[],"frame":"../frames/v003/010.webp","frame_time":1547.94},{"title":"凸函数的定义与例子","segments":[{"id":95,"text":"And a function is strictly convex if this inequality here holds strictly as long as theta is strictly between 0 and 1. So one way you can think of it is, lots of ways. This says f of the mixture is less than or equal to the mixture of f. So it tells you that when you compose a mixture and a function, you get an inequality that always holds. So that's a very good way to think of it."},{"id":96,"text":"Okay, so this is what a convex function is. Let's look at some examples. First, we'll just look at examples on R. Yeah, by the way, how do you check if a function on R is convex? You plot it, like in your head, basically. I mean, at some point, somebody would, I don't know, if you're..."},{"id":97,"text":"being deposed by a group of surly mathematicians, I suppose you'd actually have to show it, and you can't draw a picture. But the point is, for an R, you just visualize it, and you can say, right? So the graph of ax plus b, it's a line, right? And it's actually true that if you take the chord between any points on a line, I mean, it's silly, it's on it. Actually, what happens is, in that case, this holds with equality, right?"},{"id":98,"text":"So, okay. Here's one exponential. And that's with a positive or negative thing. And, you know, we'll soon see ways you could actually, you know, prove this. But it's kind of silly. You just draw a picture and you say, look, here. I'll just draw you some functions. Ready? Here's one. And here's another. Okay? This is like e to the x. That shouldn't go below zero. That's e to the minus 2x. I don't know. I made it up. But it looks like that. Right? And they clearly have non-negative curvature. Right? So those are examples."},{"id":99,"text":"Powers. Well, a power is bigger than one. And then powers that are negative work too, right? Because a power that's negative might look like this, right? Here's 1 over x, and it goes like that, okay? And then that's going to be convex, okay? Let's see. Negative entropy, right? So x log x, if I take a minus, that's the negative entropy."},{"id":100,"text":"And that is a function that looks like this. Here's zero. Here's one where it's zero. It's very steep there and then goes up like that. And it's convex. Or if you like, you could think of it this way. Entropy, which is minus x log x, is concave. And these are the kind of things when we start doing some statistics and other stuff, this is going to be very natural."}],"notes":["本段首先定义了严格凸函数，指出当θ严格介于0和1之间时，不等式严格成立。接着，讲者提到凸函数的一个重要性质是：函数的混合值小于等于混合后的函数值，这说明了凸函数在组合操作下的不等式性质。","讲者通过举例说明如何判断实数域上的凸函数，指出可以通过图像直观判断，但有时需要数学证明。例如，线性函数的图像是一条直线，其任意两点之间的弦与函数图像重合，因此满足凸函数的定义。","讲者提到指数函数的例子，如e^x和e^{-2x}，并指出这些函数具有非负曲率，因此是凸函数。这说明了凸函数的几何特性，即图像向上弯曲。","讲者讨论了幂函数的凸性，指出当幂指数大于1或小于0时，函数是凸的。例如，1/x是一个凸函数，其图像在x轴两侧分别向上弯曲。同时，负熵函数x log x是凸函数，而熵函数是凹函数，这在统计学中具有重要意义。","讲者强调了凸函数在统计学中的应用，如熵函数的凹性在信息论和概率论中非常自然，这为后续课程内容奠定了基础。","讲者通过图像和数学定义的结合，帮助学生理解凸函数的直观和数学特性，同时指出某些情况下需要数学证明而非仅凭图像判断。"],"formulas":[{"latex":"f(\\theta x + (1 - \\theta)y) \\leq \\theta f(x) + (1 - \\theta)f(y)","symbols":"凸函数的定义：函数在任意两点之间的线性组合的值小于等于该组合的函数值的线性组合","explanation":"该公式正确描述了凸函数的定义，即对于任意两点x和y，以及0 \u003c θ \u003c 1，函数在两点之间的线性组合的值小于等于该组合的函数值的线性组合。","evidence":"And a function is strictly convex if this inequality here holds strictly as long as theta is strictly between 0 and 1. So one way you can think of it lots of ways. This says f of the mixture is less than or equal to the mixture of f. So it tells you that when you commute a mixture and a function, you get an inequality always holds. So that's a very good way to think of it."},{"latex":"f(x) = x^p, p > 1","symbols":"幂函数的凸性：当指数p大于1时，函数是凸的","explanation":"该公式正确描述了幂函数的凸性，当指数p大于1时，函数是凸的。","evidence":"Powers. Well, a power is bigger than one work. And then powers that are negative work too, right? Because a power that's negative might look like this, right? Here's 1 over x, and it goes like that, okay? And then that's going to be convex, okay? Let's see. Negative entropy, right? So x log x, if I take a minus, that's the negative entropy."},{"latex":"f(x) = -x \\log x","symbols":"负熵函数：x log x是凸函数，其负值是凹函数","explanation":"该公式正确描述了负熵函数，x log x是凸函数，其负值是凹函数。","evidence":"And that is a function that looks like this. Here's zero. Here's one where it's zero. It's very steep there and then goes up like that. And it's convex. Or if you like, you could think of it this way. Entropy, which is minus x log x, is concave. And these are the kind of things when we start doing some statistics and other stuff, this is going to be very natural."}],"uncertainties":["在段落98中，讲者提到“e to the minus 2x”，但未明确说明其具体形式，可能存在识别错误。","在段落99中，讲者提到“powers that are negative work too”，但未明确说明具体形式，可能存在识别错误。"],"diagram":"none","start":1716.37,"end":1870.14,"asr_flags":[],"math_clarifications":["公式1描述的是线性函数的情况，但严格凸函数的定义要求不等式严格成立，除非θ为0或1。因此，该公式不能作为严格凸函数的定义，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1716.37,"text":"And a function is strictly convex if this inequality here holds strictly as long as theta is strictly between 0 and 1. So one way you can think of it lots of ways. This says f of the mixture is less than or equal to the mixture of f. So it tells you that when you commute a mixture and a function, you get an inequality always holds. So that's a very good way to think of it."},{"start":1743.02,"text":"Okay, so th d other stuff, this is going to be very natural."}],"speech_gaps":[],"frame":"../frames/v003/011.webp","frame_time":1728.37},{"title":"凸函数与凹函数的示例","segments":[{"id":101,"text":"So these are just simple examples. For concave, you'd have like the square root. There's your canonical concave power, right? But so is the 0.7 power. And the log, that's another famous one, right, is going to be log. Okay, and don't worry, these are obvious, but we will soon get to ones that are not obvious. Okay, now we can have some examples on Rn."},{"id":102,"text":"So if you have an affine function, so here the variable is a vector, right? And this is an affine function. And it turns out that's actually both convex and concave. Because it, well, I mean, I think of it this way. Convexity means non-negative curvature. Concave means non-positive curvature. If you're zero curvature, otherwise known as affine, right? Then you're in both, you're right on the boundary. You satisfy both."},{"id":103,"text":"Any norm in Rn, any norm at all, but for example, the p-norm would be one, right? And if you haven't seen the p-norm before, it's time. And if you have, that's great. You probably, I mean, certainly everyone here has seen the two-norm or Euclidean norm, which is the square root of the sum of the squares, but you might not have heard about the three-norm, which is the cube root of the sum of the cubes of the absolute values, right?"},{"id":104,"text":"You might ask, what do you use that for? And the answer is, I don't know. But the one norm, that's reasonable. The one norm is the sum of the absolute values. That makes sense in a lot of applications, actually. And then the infinity norm is defined to be the maximum. But the point is, these are convex functions. That's actually the point. Somebody has to show that. And I mean, we'll quickly see ways to do it later that are..."},{"id":105,"text":"quick and painless but you know technically somebody has to show this right um okay now we'll also look at functions sometimes on matrices so that means that the arg that the argument of a function is a matrix right like for example the determinant of you know a square matrix right or the trace of a matrix or something like that so we're going to look at things like that or actually the norm of a matrix okay so um"},{"id":106,"text":"And here, it's interesting to know what does an affine function on a matrix look like, right? Well, you know that an affine function on a vector looks like this. There exists a vector A and a scalar B for which the function has the form A transpose X plus B, right? Well, the analog of that for matrices is actually really interesting. It's this. I mean, if you look at this and you wrote out the formula for that, you'd see that they're kind of the same. It's a sum, a weighted sum of the coefficients. That's a linear function plus a constant, right?"}],"notes":["本段讲解了凸函数和凹函数的基本概念，并通过一些简单的例子进行说明。例如，平方根函数、0.7次幂函数和对数函数都是常见的凹函数。同时，也提到凸函数和凹函数的边界情况，即仿射函数，它同时满足凸性和凹性。","在讨论凸函数时，提到了范数函数，包括p-范数、1-范数和无穷范数。这些范数都是凸函数，但需要证明。1-范数是绝对值的和，而无穷范数是最大值，这些范数在实际应用中非常常见。","课程还提到，函数的定义域可以是向量空间，也可以是矩阵空间。例如，矩阵的行列式、迹以及矩阵的范数都是研究对象。这表明凸优化不仅适用于向量，也适用于矩阵。","在讨论矩阵上的仿射函数时，指出其形式与向量上的仿射函数类似，即线性函数加上常数项。这表明矩阵上的仿射函数具有与向量空间相似的结构。","课程强调，虽然这些概念看似简单，但后续会涉及更复杂的例子和证明，需要学生理解基本概念后再深入学习。"],"formulas":[{"latex":"f(x) = \\text{norm}(x)","symbols":"范数","explanation":"保持原式，范数是向量空间中的标准函数，无需修改。","evidence":"Any norm in Rn, any norm at all, but for example, the p-norm would be one, right? And if you haven't seen the p-norm before, it's time. And if you have, that's great. You probably, I mean, certainly everyone here has seen the two-norm or Euclidean norm, which is the square root of the sum of the squares, but you might not have heard about the three-norm, which is the cube root of the sum of the cubes of the absolute values, right?"},{"latex":"f(x) = \\text{trace}(X)","symbols":"矩阵的迹","explanation":"保持原式，迹是矩阵的对角线元素之和，无需修改。","evidence":"quick and painless but you know technically somebody o by the way, this gives you a completely reasonable way to check if a function is convex. If the methods we're going to talk about later today and next lecture don't work, then real simple, you generate random lines."},{"id":117,"text":"and then you plot the function restricted. And if every time that comes up, it's got positive curvature, you hit carriage return and go to the next one. I mean, this is not a very good way to do it. But if you ever see anything where it's got even the slightest non-convexity,"},{"id":118,"text":"then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"id":119,"text":"And it's a really complicated function if you think about it, right? It's the log of some crazy polynomial with n factorial terms in it. Everybody following this? It's just like, how on earth would you know what that... Now, of course, we don't compute the log of the determinant that way, so that's silly. By the way, how do we compute the log of the determinant? I mean, this is... We'll talk about numerical stuff later in the class, but how do you compute the log of the determinant of a matrix? I'm open to suggestions. Write out what the determinant is."},{"id":120,"text":"No, that has n factorial terms in it. Okay, so which? How do you do this? Yeah, sure. Okay, you can compute its eigenvalues and then sum the log of the eigenvalues. Okay, and suppose you wanted an exact method that didn't involve eigenvalues. What would you do? This is just for fun. I mean, we'll talk about these things later in the class. You don't have to know it now."}],"notes":["本段讲授了凸函数的一个重要性质：如果一个函数在所有直线上都是凸的，那么该函数整体上是凸的。这是判断凸函数的一种方法，即通过限制函数到直线上的行为来验证其凸性。这种方法虽然不适用于所有情况，但在某些情况下可以作为辅助手段。","讲者提到，对于一个凸函数，如果将其限制在一条直线上，那么该函数在该直线上仍然是凸的。这种限制后的函数是一个单变量函数，可以通过绘制图像来直观判断其凸性。","讲者进一步指出，这种方法虽然不是非常高效，但在某些情况下可以作为一种快速判断工具。如果在任何一条直线上发现非凸性，就可以立即判断该函数不是凸函数。","讲者举了一个例子，即对数行列式函数（log of determinant）在正定矩阵上是凹函数。这个例子说明了即使函数形式复杂，也可以通过数学性质判断其凸性。","讲者提到，对数行列式函数虽然形式复杂，但可以通过计算矩阵的特征值并求其对数之和来计算。这展示了如何在实际中处理这种复杂的函数。","最后，讲者提到，虽然可以通过特征值计算对数行列式，但也可以考虑其他方法，如不涉及特征值的精确计算方法。这些方法将在后续课程中讨论。"],"formulas":[{"latex":"f(x) \\text{ 是凸函数当且仅当 } f|_L \\text{ 是凸函数，对于所有直线 } L \\text{ 在 } \\mathbb{R}^n","symbols":"f(x) 是凸函数当且仅当其在所有直线 L 上的限制函数 f|_L 是凸函数","explanation":"公式正确描述了凸函数的性质，即函数在所有直线上的限制函数也是凸函数。","evidence":"So here's a general method. It's useful sometimes for checking convexity. It says the following. If I have a convex function and I restrict it to a line, now restricting it to a line means I'm only going to look at its values along the line, right? A line in Rn. Then the restricted function is convex. Not only that, it's a function of a single variable. You could plot it and just take... Look at it with your eyeballs and see that it goes up, right? So by the way, this gives you a completely reasonable way to check if a function is convex. If the methods we're going to talk about later today and next lecture don't work, then real simple, you generate random lines. and then you plot the function restricted. And if every time that comes up, it's got positive curvature, you hit carriage return and go to the next one. I mean, this is not a very good way to do it. But if you ever see anything where it's got even the slightest non-convexity, then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"latex":"f(x) = \\text{log}(\\text{det}(X))","symbols":"对数行列式函数 f(x) = log(det(X))","explanation":"公式正确表达了对数行列式函数的定义，即对矩阵 X 的行列式取对数。","evidence":"then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"latex":"f(x) = \\text{log}(\\text{det}(X)) = \\text{tr}(\\text{log}(X))","symbols":"对数行列式函数可以通过矩阵的特征值之和来计算，即 f(x) = log(det(X)) = tr(log(X))","explanation":"公式正确表达了对数行列式函数的另一种计算方式，即通过矩阵对数的迹来计算。","evidence":"And it's a really complicated function if you think about it, right? It's the log of some crazy polynomial with n factorial terms in it. Everybody following this? It's just like, how on earth would you know what that... Now, of course, we don't compute the log of the determinant that way, so that's silly. By the way, how do we compute the log of the determinant? I mean, this is... We'll talk about numerical stuff later in the class, but how do you compute the log of the determinant of a matrix? I'm open to suggestions. Write out what the determinant is. No, that has n factorial terms in it. Okay, so which? How do you do this? Yeah, sure. Okay, you can compute its eigenvalues and then sum the log of the eigenvalues. Okay, and suppose you wanted an exact method that didn't involve eigenvalues. What would you do? This is just for fun. I mean, we'll talk about these things later in the class. You don't have to know it now."}],"uncertainties":[],"diagram":"none","start":2213.54,"end":2379.17,"asr_flags":[],"math_clarifications":["公式 0 正确描述了凸函数的性质，即函数在所有直线上的限制函数也是凸函数。"],"raw_segments":[{"start":2213.54,"text":"Because, you know, you'd have to find, you know, determinant of x transpose x, you know, minus lambda i, that's a polynomial of degree at least 5, and there's no formula for the roots of that, right? Nevertheless, that doesn't stop people from using the 2-norm all the time, right? But the point is, that function is really complicated and it's convex, okay? So, you'll see some others pretty soon. Okay."},{"start":2239.91,"text":"So here's a general method. It's useful sometimes for checking convexity. It says the following. If I have a convex function and I restrict it to a line, now restricting it to a line means I'm only going to look at its values along the line, right? A line in Rn. Then the restricted function is convex. Not only that, it's a function of a single variable. You could plot it and just take..."},{"start":2264.66,"text":"Look at it with your eyeballs and see that it goes up, right? So by the way, this gives you a completely reasonable way to check if a function is convex. If the methods we're going to talk about later today and next lecture don't work, then real simple, you generate random lines."},{"start":2285.17,"text":"and then you plot the function restricted. And if every time that comes up, it's got positive curvature, you hit carriage return and go to the next one. I mean, this is not a very good way to do it. But if you ever see anything where it's got even the slightest non-convexity,"},{"start":2301.46,"text":"then you stop and you announce that function is not convex, right? Okay, so basically says it's convex if and only if it is convex when restricted to any line. And here's an example of this. This is a cool example. It has been known for more than 100 years that the log of the determinant of a positive definite matrix is concave. Okay, which is crazy."},{"start":2323.31,"text":"And it's a really complicated function if you think about it, right? It's the log of some crazy polynomial with n factorial terms in it. Everybody following this? It's just like, how on earth would you know what that... Now, of course, we don't compute the log of the determinant that way, so that's silly. By the way, how do we compute the log of the determinant? I mean, this is... We'll talk about numerical stuff later in the class, but how do you compute the log of the determinant of a matrix? I'm open to suggestions. Write out what the determinant is."},{"start":2356.15,"text":"No, that has n factorial terms in it. Okay, so which? How do you do this? Yeah, sure. Okay, you can compute its eigenvalues and then sum the log of the eigenvalues. Okay, and suppose you wanted an exact method that didn't involve eigenvalues. What would you do? This is just for fun. I mean, we'll talk about these things later in the class. You don't have to know it now."}],"speech_gaps":[],"frame":"../frames/v003/014.webp","frame_time":2225.54},{"title":"凸函数的证明与历史背景","segments":[{"id":121,"text":"you'd take a Cholesky factorization of the matrix, and then you'd take the sum of the log of the entries on the diagonal. And that's an order n cubed operation as opposed to n factorial. And just for the record, n cubed is a lot better than n factorial."},{"id":122,"text":"So that was an aside. Didn't have to do with anything. Okay. So let's see that. So this is actually saying something that's, I mean, you have to get some respect for that. That's like a really complicated function, right? And yet it's concave. Not only that, they knew this in like 1905. Okay. So where the, in fact, I think the term convex had only come in 10 or 15 years ago, like at all. So, okay."},{"id":123,"text":"So here's how you'd show that. So to show this, what I'll do... Now, by the way, if you knew information theory, you could show this because you'd say..."},{"id":124,"text":"Well, I mean, that's the entropy of a Gaussian variable or something like that. And then you'd take two things. It'd be a mixture of Gaussian variables. There'd be some information theory inequality, famous inequality that would tell you this, right? But that's kind of weird and complicated for normal people, right? But so here's how you do this. You take a matrix here. I'm going to pick an arbitrary point X, which is going to be capital X because it's a matrix."},{"id":125,"text":"That's going to be in the domain. And then an arbitrary direction V, which is symmetric, but not necessarily positive semi-definite, positive definite, right? So this, if I take X plus TV, I actually, that describes a line in matrix, in symmetric matrix space. Everybody agree? So that's, I mean, we can pretend to visualize it, but that's what it is, right? So there's a line of, you know, like a line of covariance matrices or whatever, however you want to think of it. Okay. And so we want to find out, you know, is this convex with respect to T?"},{"id":126,"text":"Well, we can plot it, you know, and that'll come up. It's correct. It's concave. Sorry, it's concave. And so the way you do this is here, I just take this matrix expression. I take x to the one half outside, x to the minus half outside here. I pull it out both sides. This becomes an i. This becomes t times x to the minus one half v x to the minus one half. That's this thing. So I get this. Then the two other terms I get."},{"id":127,"text":"two terms which look like log det x to the one half, each of which is one half log det x, okay? So I end up with this expression here, okay? Now I go to eigenvalues and I say, well, I can write this thing out."}],"notes":["本段主要讨论如何证明一个函数是凸函数，通过矩阵表达式和特征值分析。讲者提到，可以通过将矩阵分解为对角线元素的对数和，来证明其凹性。这种方法比计算阶乘更高效，因为其复杂度为O(n³)。","讲者提到，虽然信息论可以用来证明这一性质，但这种方法对于普通人来说可能过于复杂。因此，他选择使用矩阵分析的方法，通过构造一个线性路径并分析其在参数T上的行为来证明函数的凹性。","在证明过程中，讲者将矩阵表达式分解为多个部分，包括对角线元素的对数和特征值的分析。他提到，通过将矩阵分解为对角线元素的平方根和逆平方根，可以简化表达式。","讲者还提到，通过将矩阵表达式转换为特征值的形式，可以进一步分析其凹性。这种方法需要对矩阵的特征值进行计算和分析，从而得出最终的结论。","讲者提到，虽然信息论可以提供一种证明方法，但这种方法可能过于复杂，因此他选择使用矩阵分析的方法。这种方法更直观，也更容易理解。","讲者还提到，虽然凸函数的概念在1905年之前就已经存在，但“凸”这一术语直到10到15年前才被引入。这说明了凸函数理论的发展历史。"],"formulas":[],"uncertainties":["x to the one half outside, x to the minus half outside here"],"diagram":"none","start":2381.32,"end":2539.03,"asr_flags":[],"math_clarifications":["原文中讨论了矩阵的Cholesky分解、对数行列式以及矩阵的凸性，但未明确给出具体的数学公式或表达式，因此无法核定相关公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segmen
