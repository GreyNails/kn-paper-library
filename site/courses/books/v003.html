</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">03 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 3 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v003.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v003","title":"03 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 3","course":"凸优化","pages":[{"title":"课程安排与作业挑战","segments":[{"id":0,"text":"Our plan, which we don't always achieve, but we do try, is to have each the homework due on Friday would use material up to Tuesday's lecture. That would be today's lecture. Right. So I do I do know that we had some people look at the homework and like, I can't do that. And yes, that's fine. So and I'd also I assume I know I talked to a handful of people who'd already started on on homework one.","zh":"我们的计划是，虽然我们并不总是能做到，但我们会尽力做到，让每周五交的作业使用到周二的课程内容。也就是今天的课程内容。对的。我知道有些人看了作业后说，我做不了。是的，这很正常。我也假设我知道，我跟一些已经开始做第一份作业的人聊过。","start":5.23,"end":31.99},{"id":1,"text":"Yeah, this is not one of those do it Thursday night homeworks, just to let you know.","zh":"是的，这不是那种周四晚上才做的作业，只是让你知道一下。","start":33.54,"end":38.2},{"id":2,"text":"I like to think of it, you want to savor it.","zh":"我想，你应该把它当作一种享受。","start":39.36,"end":41.48},{"id":3,"text":"So, I mean, actually, quite seriously, I do want to say that, you know, for homework one, it's pretty challenging.","zh":"说实话，我想说的是，第一份作业相当具有挑战性。","start":43.24,"end":51.56},{"id":4,"text":"I mean, there are at least some parts that are actually quite challenging.","zh":"我的意思是，至少有些部分实际上相当具有挑战性。","start":51.62,"end":54.68},{"id":5,"text":"And I'm sort of hoping you'd have the sense to not bang your head on a wall for several hours on one problem or something like that.","zh":"我希望你们能有这种判断力，不要在一个问题上耗费好几个小时，像撞墙一样。","start":54.84,"end":61.98},{"id":6,"text":"and just at some point just to walk away that perfectly that's totally totally","zh":"在某个时候，只是离开，这完全没问题，完全没问题。","start":61.98,"end":66.02},{"id":7,"text":"okay to do right so yeah so that's it and especially at this point in the","zh":"做对了，是的，就是这样，尤其在这一点上。","start":66.02,"end":72.12},{"id":8,"text":"class where this is just background material it's completely and utterly","zh":"在这一节课中，这些内容只是背景材料，目前完全没有任何动机","start":72.12,"end":76.8},{"id":9,"text":"unmotivated at this point but what's gonna happen is you will be using all of","zh":"但接下来会发生的是，你们会在整个学期内使用所有这些内容，所以有趣的是，我遇到的一些人","start":76.8,"end":82.12},{"id":10,"text":"these things for the rest of the quarter and so what's funny is people who I","zh":"意思是，我记得和一些人交谈，他们说他们记得做过作业一和作业二，当时完全不知道发生了什么","start":82.12,"end":87.66},{"id":11,"text":"mean I remember talking to people who said I remember doing like homework one","zh":"直到做作业八和九时，他们实际上用这些内容来拟合模型或优化网络上的流量等","start":87.66,"end":90.62},{"id":12,"text":"and homework two and having just no idea like no idea what was going on","zh":"他们才说：哦，现在我明白了","start":90.62,"end":93.8},{"id":13,"text":"and then by homework eight and nine when they've actually used it to you know fit","zh":"或者类似的事情，然后他们才说：哦，现在我明白了","start":93.8,"end":97.56},{"id":14,"text":"models or optimize uh you know flow on some network","zh":"模型或优化你所说的网络上的流","start":97.56,"end":101.46},{"id":15,"text":"or something like that then they were like okay now i get it","zh":"或者类似的东西，然后他们说，哦，现在我明白了","start":101.46,"end":104.94},{"id":16,"text":"all so anyway so just that that's sort of just","zh":"所有这些，总之，总之就是这个意思","start":104.94,"end":107.36},{"id":17,"text":"No question? So in that case, what I'll do is I'll just, let me just say, remind you where we were. Last time we talked about the idea of defining an inequality in terms of a cone, a proper cone, right? And so that's a general construction. The truth is we really mostly do this only with two specific cones. One is a non-negative orthant, and that allows us to compare two vectors.","zh":"有没有问题？在这种情况下，我将做的是，让我简单提醒一下我们之前讨论的内容。上一次我们讨论了用锥体来定义不等式的想法，一个正则锥，对吧？这是一个通用的构造。事实上，我们大多数情况下只使用两个特定的锥体。一个是非负正交锥，它允许我们比较两个向量。","start":108.44,"end":133.26},{"id":18,"text":"And basically, one vector is less than another when element-wise, the corresponding entries are less than the other. And the other one is the positive semi-definite cone. And that allows us to compare two symmetric matrices. And you say that one is bigger than another if the difference is positive semi-definite. And I'm presuming you've seen this somewhere. So I don't think these are too, you know, these shouldn't be completely brand new.","zh":"基本上，一个向量小于另一个向量，当且仅当对应元素逐个小于另一个向量。另一个是半正定锥体，它允许我们比较两个对称矩阵。你可以说一个矩阵比另一个大，如果它们的差是半正定的。我假设你们在别处见过这个概念。因此，我认为这些内容不应该完全陌生。","start":133.63,"end":156.03},{"id":19,"text":"And basically, one vector is less than another when element-wise, the corresponding entries are less than the other. And the other one is the positive semi-definite cone. And that allows us to compare two symmetric matrices. And you say that one is bigger than another if the difference is positive semi-definite. And I'm presuming you've seen this somewhere. So I don't think these are too, you know, these shouldn't be completely brand new.","zh":"基本上，一个向量小于另一个向量，当且仅当对应元素逐个小于另一个向量。另一个是半正定锥体，它允许我们比较两个对称矩阵。你可以说一个矩阵比另一个大，如果它们的差是半正定的。我假设你们在别处见过这个概念。因此，我认为这些内容不应该完全陌生。","start":156.55,"end":184.33}],"notes":["教授提到，学生在完成前几份作业时可能感到困惑，但随着课程的推进，特别是在后续作业中应用这些知识时，他们会逐渐理解这些概念。这表明，课程内容的逐步深入和实际应用是理解这些抽象概念的关键。","教授提醒学生，本周将继续深入数学内容，但下周课程将变得更有意思。这表明课程内容的难度会逐步提升，学生需要保持耐心和持续的努力。","教授回顾了上节课的内容，即通过锥体定义不等式，特别是非负正交锥和半正定锥的应用。这表明课程内容涉及数学中的基本概念，如向量和矩阵的比较，这些是凸优化的基础。","教授提到，学生可能已经接触过这些概念，但需要进一步巩固和应用。这表明课程内容的安排旨在帮助学生将理论知识与实际问题相结合。","教授强调，课程内容虽然基础，但其重要性在于后续应用。这表明，学生需要理解这些基础概念，以便在后续学习中能够灵活运用。"],"formulas":[],"uncertainties":["walk away that perfectly that's totally totally","class where this is just background material it's completely and utterly","Let's see, any questions about last time? Otherwise, we'll continue on. May I remind you, this week is continuing our slog through the math. It will finish pretty much on Friday. So already next week, you know, the sun is going to come out. And if you've survived, it'll start getting actually very interesting. Okay, any...","No question? So in that case, what I'll do is I'll just, let me just say, remind you where we were. Last time we talked about the idea of defining an inequality in terms of a cone, a proper cone, right? And so that's a general construction. The truth is we really mostly do this only with two specific cones. One is a non-negative orthant, and that allows us to compare two vectors."],"diagram":"none","start":5.23,"end":184.33,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":5.23,"text":"Our plan, which we don't always achieve, but we do try, is to have each the homework due on Friday would use material up to Tuesday's lecture. That would be today's lecture. Right. So I do I do know that we had some people look at the homework and like, I can't do that. And yes, that's fine. So and I'd also I assume I know I talked to a handful of people who'd already started on on homework one."},{"start":33.54,"text":"Yeah, this is not one of those do it Thursday night homeworks, just to let you know."},{"start":39.36,"text":"I like to think of it, you want to savor it."},{"start":43.24,"text":"So, I mean, actually, quite seriously, I do want to say that, you know, for homework one, it's pretty challenging."},{"start":51.62,"text":"I mean, there are at least some parts that are actually quite challenging."},{"start":54.84,"text":"And I'm sort of hoping you'd have the sense to not bang your head on a wall for several hours on one problem or something like that."},{"start":61.98,"text":"and just at some point just to walk away that perfectly that's totally totally"},{"start":66.02,"text":"okay to do right so yeah so that's it and especially at this point in the"},{"start":72.12,"text":"class where this is just background material it's completely and utterly"},{"start":76.8,"text":"unmotivated at this point but what's gonna happen is you will be using all of"},{"start":82.12,"text":"these things for the rest of the quarter and so what's funny is people who I"},{"start":87.66,"text":"mean I remember talking to people who said I remember doing like homework one"},{"start":90.62,"text":"and homework two and having just no idea like no idea what was going on"},{"start":93.8,"text":"and then by homework eight and nine when they've actually used it to you know fit"},{"start":97.56,"text":"models or optimize uh you know flow on some network"},{"start":101.46,"text":"or something like that then they were like okay now i get it"},{"start":104.94,"text":"all so anyway so just that that's sort of just"},{"start":108.44,"text":"Let's see, any questions about last time? Otherwise, we'll continue on. May I remind you, this week is continuing our slog through the math. It will finish pretty much on Friday. So already next week, you know, the sun is going to come out. And if you've survived, it'll start getting actually very interesting. Okay, any..."},{"start":133.63,"text":"No question? So in that case, what I'll do is I'll just, let me just say, remind you where we were. Last time we talked about the idea of defining an inequality in terms of a cone, a proper cone, right? And so that's a general construction. The truth is we really mostly do this only with two specific cones. One is a non-negative orthant, and that allows us to compare two vectors."},{"start":156.55,"text":"And basically, one vector is less than another when element-wise, the corresponding entries are less than the other. And the other one is the positive semi-definite cone. And that allows us to compare two symmetric matrices. And you say that one is bigger than another if the difference is positive semi-definite. And I'm presuming you've seen this somewhere. So I don't think these are too, you know, these shouldn't be completely brand new."}],"speech_gaps":[],"frame":"../frames/v003/001.webp","frame_time":17.23},{"title":"向量不等式与最小值概念的扩展","segments":[{"id":20,"text":"So what I mentioned at the end of last time is something quite interesting, right? That the idea of when you generalize an inequality, I mean, just the fact that the symbol we're using and the name we're using, which is inequality, like all powerful notation, it should remind you of inequalities among real numbers, right? That's sort of the idea, right? I mean, it's the same way when you write down AX equals B, where that's a matrix equation, and somebody looks at it and said...","zh":"所以我在上节课末尾提到的是一件相当有趣的事情，对吧？当你推广一个不等式时，我指的是我们使用的符号和名称，即不等式，这种强大的符号应该让你联想到实数之间的不等式，对吧？这就是这个想法，对吧？我的意思是，它和你写下 AX 等于 B 时是一样的，其中这是一个矩阵方程，有人看到它后会说……","start":185.5,"end":211.68},{"id":21,"text":"wait, I solved problems like that in third grade. The response is, yeah, but that's a 2,000 by 1,000 matrix there, right? Or something like that, right? So it's the same idea. And the idea of this generalization is that many things you know are true, many things, sorry, many things you know in the old context remain true and some don't. If everything remained true, then it's really not even a generalization. It's just, you're just saying it now applies to more things, right? And so the main thing that does not,","zh":"等等，我在三年级的时候就解决过类似的问题了。回应是，是的，但那里是一个 2,000 乘 1,000 的矩阵，对吧？或者类似这样的，对吧？所以这是同样的想法。这种推广的想法是，你知道的许多事情在旧的上下文中是正确的，许多事情，抱歉，许多事情你在旧的上下文中知道的仍然正确，而有些则不正确。如果所有事情都仍然正确，那么它实际上并不是一个推广。它只是你现在说它适用于更多事物，对吧？因此，最主要的是，","start":212.31,"end":240.97},{"id":22,"text":"that you don't have when you are looking at vector inequalities is it's not a linear or total ordering. And what that means is you can have two things and it is false that this one is less than that and the other way around. Now, for real numbers, that's impossible, right? Because either one real number is either less than or equal to the other or the other way around, period, right? And so that's called a linear or total ordering.","zh":"当你在查看向量不等式时，你没有的是它不是一个线性或全序。这意味着你可以有两个事物，并且这个事物小于那个事物是假的，反过来也一样。对于实数来说，这是不可能的，对吧？因为一个实数要么小于或等于另一个，要么反过来，对吧？这就是所谓的线性或全序。","start":241.64,"end":264.78},{"id":23,"text":"And you don't have that with vectors, right?","zh":"而在向量中，你没有这个。","start":265.62,"end":267.6},{"id":24,"text":"And, you know, this is kind of obvious.","zh":"而且，这其实是很明显的。","start":267.72,"end":269.14},{"id":25,"text":"Actually, we're going to see later that this actually has a lot of interesting practical implications that we will get to.","zh":"实际上，我们稍后会看到，这实际上在实践中有很多有趣的实际含义，我们会接触到的。","start":269.44,"end":274.54},{"id":26,"text":"Okay, so one thing that happens then is, you know, everyone knows what the minimum is, right, of a bunch of numbers.","zh":"好的，那么接下来发生的一件事是，你知道，每个人都知道一堆数字的最小值是什么。","start":274.66,"end":280.88},{"id":27,"text":"And by the way, I might as well mention it now.","zh":"顺便说一句，我现在就可以提一下。","start":282.16,"end":285.26},{"id":28,"text":"When you have an infinite set of numbers, the min is replaced with something called the infimum.","zh":"当你有一组无限多个数时，最小值会被替换成一个叫做下确界的量。","start":285.9,"end":291.38},{"id":29,"text":"If you know about this, that's fine.","zh":"如果你已经了解这个概念，那就可以了。","start":291.48,"end":292.98},{"id":30,"text":"If you don't, think of it as the min.","zh":"如果你还不了解，可以把它想象成最小值。","start":293.12,"end":295.3},{"id":31,"text":"It is just the min, but it applies to infinite sets, okay?","zh":"它其实就是最小值，但适用于无限集合，明白吗？","start":295.62,"end":298.54},{"id":32,"text":"So that's really pretty much all you need to know.","zh":"所以，这基本上就是你需要知道的所有内容。","start":298.62,"end":301.1},{"id":33,"text":"Okay, so what happens with a vector here, when vector inequalities,","zh":"好的，那么当涉及到向量时，向量不等式会怎样呢，","start":302.22,"end":310.98},{"id":34,"text":"is that the idea of min, or infimum, or minimum, or maximum for that matter,","zh":"最小值、下确界、最小值或最大值这些概念，","start":311.5,"end":317.98},{"id":35,"text":"actually splits into two concepts, which are very different.","zh":"实际上会分裂成两个非常不同的概念。","start":318.08,"end":322.28},{"id":36,"text":"one is still called the minimum and the other one is still called is called","zh":"一个仍然被称为最小值，另一个仍然被称为被称为","start":322.28,"end":328.82},{"id":37,"text":"actually minimal and so these are just two different ideas right and we'll see","zh":"实际上是最小的，因此这些只是两个不同的概念，对吧，我们之后会看到","start":328.82,"end":333.96},{"id":38,"text":"actually later that they this is going to come up in all sorts of in various","zh":"实际上后来这些会在各种不同的应用中出现，并且会有点有趣，对吧","start":333.96,"end":338.16},{"id":39,"text":"applications and be kind of interesting right so minimum means that it's a point","zh":"所以最小值意味着它是一个集合中的点，具有以下性质：该集合中的其他所有元素","start":338.16,"end":343.82},{"id":40,"text":"in the set with the following property that everything else in that set is","zh":"都","start":343.82,"end":349.22}],"notes":["本段讲解了向量不等式与标量不等式之间的区别，特别是向量不等式不具有线性或全序的性质。在标量中，任意两个数之间都有明确的大小关系，但在向量中，这种关系可能不存在，即无法确定一个向量是否小于另一个向量。","接着，课程提到在处理无限集合时，最小值的概念被替换为下确界（infimum）。下确界是集合中所有元素的下界中最大的那个，它可能并不在集合中，但它是集合的一个极限概念。","随后，课程指出在向量不等式的背景下，最小值和极小值这两个概念被区分开来。最小值指的是集合中满足某种性质的点，而极小值则是一个更弱的概念，它仅要求该点在集合中没有其他点比它更小。","这些概念的区分在后续的优化问题中非常重要，尤其是在处理凸集和凸函数时，最小值和极小值的差异会影响优化算法的设计和收敛性分析。","课程还提到，这些概念将在后续的课程中被进一步探讨，并在各种应用中出现，例如在凸优化问题中寻找最优解时，需要区分最小值和极小值的概念。","最后，课程强调了这些概念的实际意义，特别是在处理向量不等式和优化问题时，理解最小值和极小值的区别对于正确应用优化理论至关重要。"],"formulas":[],"uncertainties":["the other one is still called is called","they this is going to come up in all sorts of in various"],"diagram":"none","start":185.5,"end":349.22,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":185.5,"text":"So what I mentioned at the end of last time is something quite interesting, right? That the idea of when you generalize an inequality, I mean, just the fact that the symbol we're using and the name we're using, which is inequality, like all powerful notation, it should remind you of inequalities among real numbers, right? That's sort of the idea, right? I mean, it's the same way when you write down AX equals B, where that's a matrix equation, and somebody looks at it and said..."},{"start":212.31,"text":"wait, I solved problems like that in third grade. The response is, yeah, but that's a 2,000 by 1,000 matrix there, right? Or something like that, right? So it's the same idea. And the idea of this generalization is that many things you know are true, many things, sorry, many things you know in the old context remain true and some don't. If everything remained true, then it's really not even a generalization. It's just, you're just saying it now applies to more things, right? And so the main thing that does not,"},{"start":241.64,"text":"that you don't have when you are looking at vector inequalities is it's not a linear or total ordering. And what that means is you can have two things and it is false that this one is less than that and the other way around. Now, for real numbers, that's impossible, right? Because either one real number is either less than or equal to the other or the other way around, period, right? And so that's called a linear or total ordering."},{"start":265.62,"text":"And you don't have that with vectors, right?"},{"start":267.72,"text":"And, you know, this is kind of obvious."},{"start":269.44,"text":"Actually, we're going to see later that this actually has a lot of interesting practical implications that we will get to."},{"start":274.66,"text":"Okay, so one thing that happens then is, you know, everyone knows what the minimum is, right, of a bunch of numbers."},{"start":282.16,"text":"And by the way, I might as well mention it now."},{"start":285.9,"text":"When you have an infinite set of numbers, the min is replaced with something called the infimum."},{"start":291.48,"text":"If you know about this, that's fine."},{"start":293.12,"text":"If you don't, think of it as the min."},{"start":295.62,"text":"It is just the min, but it applies to infinite sets, okay?"},{"start":298.62,"text":"So that's really pretty much all you need to know."},{"start":302.22,"text":"Okay, so what happens with a vector here, when vector inequalities,"},{"start":311.5,"text":"is that the idea of min, or infimum, or minimum, or maximum for that matter,"},{"start":318.08,"text":"actually splits into two concepts, which are very different."},{"start":322.28,"text":"one is still called the minimum and the other one is still called is called"},{"start":328.82,"text":"actually minimal and so these are just two different ideas right and we'll see"},{"start":333.96,"text":"actually later that they this is going to come up in all sorts of in various"},{"start":338.16,"text":"applications and be kind of interesting right so minimum means that it's a point"},{"start":343.82,"text":"in the set with the following property that everything else in that set is"}],"speech_gaps":[],"frame":"../frames/v003/002.webp","frame_time":197.5},{"title":"最小值与极小元的概念","segments":[{"id":41,"text":"and larger than or equal to you, with respect to that inequality. That's what minimum is, right? You know, it's not hard to show that there's a unique minimum, in that you can't have two different points, which are both, well, before you show it, you'd have to say a minimum, and then after you show it, you're allowed to say the minimum.","zh":"并且大于或等于你，关于这个不等式。这就是最小值的概念，对吧？你知道，不难证明存在一个唯一的最小值，在这一点上你不能有两个不同的点，它们都满足，嗯，在你证明之前，你得说这是一个最小值，而在你证明之后，你就可以说这个最小值。","start":350.38,"end":370.28},{"id":42,"text":"Then there's the idea of a minimal element. And a minimal element is one, like here's an example, x2 is minimal for this set S2, and you'd say with respect to the non-negative orthant. And what that means is, very roughly speaking, it means that there's no point in this set here which is less than or equal to x2 except itself.","zh":"然后还有极小元的概念。极小元是指，比如这里有一个例子，x2是这个集合S2的极小元，并且你可以说它是相对于非负正锥而言的。它的意思是，粗略地说，这个集合中没有其他点小于或等于x2，除了它本身。","start":370.7,"end":396.9},{"id":43,"text":"And so that's sort of shown visually here. You can also see that all of these points are minimal. Everything on this line is minimal. How about like a point there?","zh":"所以这里用视觉方式展示了一下。你也可以看到，所有这些点都是极小元。这条线上的每一个点都是极小元。那像这里的一个点呢？","start":397.47,"end":408.89},{"id":44,"text":"It's not minimal, right? Because there would be points which are comparable, that are in the set, comparable, and less than or equal to, and not equal to that point. Okay, so that's one thing. And this, you'll just have to go to a quiet place and think about this, and you'll get lots of chances throughout the course to get this straight. This is a question. Yes, so when we talk about minimum and minimal, it is always with respect to a specific cone.","zh":"它不是极小元，对吧？因为会有在集合中可比较的点，这些点小于或等于它，但不等于这个点。好的，这就是其中一点。你只需要去一个安静的地方好好想想，这在课程中你会有很多机会弄清楚。这是一个问题。是的，当我们谈论最小值和极小元时，总是相对于一个特定的锥。","start":409.97,"end":438.6},{"id":45,"text":"Yeah, no, then it would not be this, right? Like, so if I had a different cone, like, let me just draw down a different cone, right? In R2. This is in R2, right? So here's a different cone. Like, it's this little thing here. That's a cone, right? In R2. And then we could ask, is that point minimal with respect to that cone? Do you want to make a guess? Oh, it is.","zh":"是的，否则就不会是这个了，对吧？比如，如果我有一个不同的锥，让我在这里画一个不同的锥，对吧？这是在R2中，对吧？这里有一个不同的锥。像这个小东西。这是在R2中的一个锥，对吧？然后我们可以问，这个点相对于这个锥是否是极小元？你想猜一下吗？哦，它是。","start":441.61,"end":471.35},{"id":46,"text":"Yeah, because I'll just reproduce that set a bit here. It looks like this, right? This set looks kind of like that. Here's the point. And what you want to do is you want to look at all the points that are less than or equal to this point with respect to this cone. And that basically looks like this. Let's see if I can do this right. It's going to be all these points here, right? And then we want to intersect that set with the set S, which is here, right?","zh":"是的，因为我会在这里重新绘制这个集合。看起来像这样，对吧？这个集合看起来有点像这样。这里是那个点。你想要做的就是查看所有相对于这个锥小于或等于这个点的点。这基本上看起来像这样。让我看看我能不能正确地做到这一点。它会是这些点，对吧？然后我们想要将这个集合与集合S相交，而集合S在这里，对吧？","start":472.14,"end":499.14},{"id":47,"text":"and find out if the only point is this point. And it is. So with respect to that cone, that point x2 is still minimal. Okay. Now we'll get to something called the separating hyperplane theorem. It's actually super famous.","zh":"并确定唯一的点是否就是这个点。确实是这样。因此，相对于这个锥体，点x2仍然是最小值点。好的。接下来我们将接触到一个叫做分离超平面定理的概念。实际上，这是一个非常著名的定理。","start":500.53,"end":521.79}],"notes":["本段讲解了最小值（minimum）和极小元（minimal element）的概念。最小值指的是在某个集合中，存在一个点，使得所有其他点都大于或等于它，且这个点是唯一的。而极小元则是一个点，使得在集合中没有其他点小于或等于它，除了它本身。"],"formulas":[],"uncertainties":[],"diagram":"none","start":350.38,"end":521.79,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":350.38,"text":"and larger than or equal to you, with respect to that inequality. That's what minimum is, right? You know, it's not hard to show that there's a unique minimum, in that you can't have two different points, which are both, well, before you show it, you'd have to say a minimum, and then after you show it, you're allowed to say the minimum."},{"start":370.7,"text":"Then there's the idea of a minimal element. And a minimal element is one, like here's an example, x2 is minimal for this set S2, and you'd say with respect to the non-negative orthant. And what that means is, very roughly speaking, it means that there's no point in this set here which is less than or equal to x2 except itself."},{"start":397.47,"text":"And so that's sort of shown visually here. You can also see that all of these points are minimal. Everything on this line is minimal. How about like a point there?"},{"start":409.97,"text":"It's not minimal, right? Because there would be points which are comparable, that are in the set, comparable, and less than or equal to, and not equal to that point. Okay, so that's one thing. And this, you'll just have to go to a quiet place and think about this, and you'll get lots of chances throughout the course to get this straight. This is a question. Yes, so when we talk about minimum and minimal, it is always with respect to a specific cone."},{"start":441.61,"text":"Yeah, no, then it would not be this, right? Like, so if I had a different cone, like, let me just draw down a different cone, right? In R2. This is in R2, right? So here's a different cone. Like, it's this little thing here. That's a cone, right? In R2. And then we could ask, is that point minimal with respect to that cone? Do you want to make a guess? Oh, it is."},{"start":472.14,"text":"Yeah, because I'll just reproduce that set a bit here. It looks like this, right? This set looks kind of like that. Here's the point. And what you want to do is you want to look at all the points that are less than or equal to this point with respect to this cone. And that basically looks like this. Let's see if I can do this right. It's going to be all these points here, right? And then we want to intersect that set with the set S, which is here, right?"},{"start":500.53,"text":"and find out if the only point is this point. And it is. So with respect to that cone, that point x2 is still minimal. Okay. Now we'll get to something called the separating hyperplane theorem. It's actually super famous."}],"speech_gaps":[],"frame":"../frames/v003/003.webp","frame_time":362.38},{"title":"分离超平面与凸集的分离","segments":[{"id":48,"text":"I mean, it looks kind of innocent. And you can actually make a reasonable argument that everything we're going to do is based only on this. So it's not bad to have a single visual picture that tells you everything you need to know. And what it says is this. It says that if I have two convex sets, which do not intersect, that's what it means to be disjoint. So I have disjoint convex sets. Then it says...","zh":"我的意思是，看起来这似乎很无辜。实际上，你可以提出一个合理的论点，认为我们接下来要做的所有事情都只基于这一点。因此，拥有一个能告诉你所有需要知道内容的单一视觉图像并不是坏事。它所表达的意思是这样的：它表示，如果我有两个不相交的凸集，这就是不相交的含义。因此，我有两个不相交的凸集。然后它说……","start":522.58,"end":550.88},{"id":49,"text":"Very roughly speaking, I can stick a hyperplane between. I can separate them by hyperplane, right? And you may have seen this in some machine learning class where you were talking about, you know, two different sets of points being linearly separable. That's how people would say it there. I mean, if you haven't, that's fine too. But so this is the picture, right? If there's a set C and a set D, then there is some non-zero vector A.","zh":"粗略地说，我可以在这两个集合之间插入一个超平面。我可以使用超平面将它们分开，对吧？你可能在某些机器学习课程中见过这一点，当时你在讨论两组点是否线性可分。那里人们会这样表述。我的意思是，如果你没有见过，也没关系。但这就是这个图像，对吧？如果存在一个集合C和一个集合D，那么存在一个非零向量A。","start":551.15,"end":576.57},{"id":50,"text":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any...","zh":"以及一个数b，使得如果a指向这个方向，它表示这个半空间中所有满足a的转置乘以x小于b的位置，而C完全包含在这个集合中。这个半空间中所有满足a的转置乘以x大于或等于b的位置，而D完全包含在这个集合中。明白吗？这就是这个想法。现在，目前这个概念没有任何……我的意思是，它没有任何……","start":577.28,"end":603.68},{"id":51,"text":"the context or anything like that. But we'll see later, it's related to a lot of stuff we're going to see by about week five, right? I mean, it is the basis, for example, of a lot of economics, like period, right? Because this is basically, you'll see later, this will correspond, you'll say something like, well, there's no arbitrage. And that's going to turn out to be a picture like this. I mean, not in two dimensions, but nevertheless, that's what it's going to be. So we're going to see, we'll see that stuff like this, although right now it has no context, it's going to come up over and over again.","zh":"上下文或任何类似的东西。但我们会看到，它与我们将在大约第五周看到的许多内容相关，对吧？我的意思是，它是许多经济学内容的基础，比如，对吧？因为这基本上，你将会看到，它将对应于你所说的，比如，不存在套利机会。而这将被表现为这样的图像。我的意思是，不是在二维空间中，但无论如何，这就是它的表现形式。我们将看到，我们将看到这样的内容，尽管目前它没有任何上下文，它将反复出现。","start":604.76,"end":633.6},{"id":52,"text":"Okay, there's a gazillion variations on this, like, you know, when is this true with these strict, when the inequalities are strict? And then you say they're strictly separated. And it gets complicated and all that sort of stuff. You would see maybe one or two variations in the book, but you actually don't even, I don't think you need to know. You just need to have this picture in your head, right? Now, showing this is actually not too hard. We're not going to do it. I mean, it's sort of like an exercise.","zh":"好的，这种情形有很多变体，比如，你知道的，什么时候这些不等式是严格的呢？然后你就会说它们是严格分离的。这变得复杂起来，诸如此类的事情。你可能会在书里看到一到两个变体，但实际上，我觉得你甚至不需要知道。你只需要在脑海中有一个这样的图像，对吧？现在，展示这一点其实并不太难。我们不会去做。我是说，这有点像一个练习题。","start":633.96,"end":663.18},{"id":53,"text":"we'll see things kind of more sophisticated anyway. So that's a separating hyperplane. Yes? What would a singleton be? Oh, a singleton. Yeah. Oh, by the way, thank you for asking. Please ask about anything that's not clear. I try. But that is high BBC mathematics. It means a set with exactly one thing in it. Right? So that's a singleton.","zh":"无论如何，我们会看到更复杂的情况。所以这就是一个分离超平面。对吗？一个单元素集合是什么样的？哦，单元素集合。对的。哦，顺便说一句，谢谢你提问。请随时提问任何不清楚的地方。我会尽力。但这已经是高阶的BBC数学了。它指的是一个只包含一个元素的集合。对吧？这就是一个单元素集合。","start":663.96,"end":686.89}],"notes":["本段讲授了凸集分离定理的基本概念，即两个不相交的凸集可以通过一个超平面分离。讲者提到，这种分离在机器学习中常用于线性可分性，例如不同类别的点集。同时，讲者指出，这种分离定理在经济学中也有应用，如无套利原则，这与分离超平面的图像相对应。","讲者进一步说明了分离超平面的具体形式，即存在一个非零向量a和一个数b，使得一个凸集C完全位于a^T x \u003c b的半空间中，而另一个凸集D完全位于a^T x ≥ b的半空间中。这种分离方式是凸优化中的核心概念，为后续内容奠定了基础。","讲者提到，分离定理在后续课程中会多次出现，特别是在第五周的内容中，涉及经济学、机器学习等多个领域。同时，讲者指出，虽然分离定理本身看似简单，但其应用和变体（如严格分离）会涉及更复杂的数学分析。","讲者强调，理解分离超平面的关键在于掌握其几何图像，而不需要深入证明。此外，讲者还提到，单元素集合（singleton）在数学中表示仅包含一个元素的集合，这是分离定理中的一个基本概念。","讲者鼓励学生在遇到不明确的地方时提问，并指出高阶数学（如分离定理）需要深入理解，但核心思想是通过超平面将不相交的凸集分开，这在多个学科中都有广泛应用。","讲者最后提到，虽然分离定理的证明可能较为复杂，但其核心思想是直观的，即通过超平面将两个集合分开，这种思想在后续课程中会不断出现，并与更多实际问题相关联。"],"formulas":[{"latex":"a^T x \u003c b","symbols":"a^T x \u003c b 表示向量a与点x的点积小于b，定义了半空间","explanation":"公式正确，表示一个半空间的定义，符合凸集分离定理的描述。","evidence":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any..."}],"uncertainties":[],"diagram":"none","start":522.58,"end":686.89,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[{"title":"凸集分离定理的基本概念","summary":"本知识点介绍凸集分离定理，即两个不相交的凸集可以通过一个超平面分离。该定理在机器学习和经济学中都有重要应用，如线性可分性和无套利原则。","relation":"推导顺序","conditions":"两个凸集不相交","pitfall":"需注意分离超平面的严格性与非严格性区别","note_indices":[0,1,2,3,4,5],"formula_indices":[0],"source_ids":[48,49,50,51,52,53],"steps":["两个不相交的凸集存在分离超平面","超平面将两个凸集分别置于不同的半空间","分离超平面由非零向量a和数b定义"],"nodes":[{"title":"凸集分离","text":"两个不相交的凸集可以通过超平面分离"},{"title":"超平面定义","text":"超平面由非零向量a和数b定义，将空间分为两个半空间"},{"title":"半空间划分","text":"一个凸集位于a^T x \u003c b的半空间，另一个位于a^T x ≥ b的半空间"},{"title":"应用领域","text":"分离定理在机器学习和经济学中均有广泛应用"},{"title":"严格分离","text":"当不等式严格时，表示严格分离，涉及更复杂的数学分析"}],"id":"v003-004-1","start":522.58,"end":686.89,"formulas":[{"latex":"a^T x \u003c b","symbols":"a^T x \u003c b 表示向量a与点x的点积小于b，定义了半空间","evidence":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any...","explanation":"公式正确，表示一个半空间的定义，符合凸集分离定理的描述。"}],"formula_candidates_removed":0,"frame":"../board-frames/v003/004-1.webp","frame_time":589.78}],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":522.58,"text":"I mean, it looks kind of innocent. And you can actually make a reasonable argument that everything we're going to do is based only on this. So it's not bad to have a single visual picture that tells you everything you need to know. And what it says is this. It says that if I have two convex sets, which do not intersect, that's what it means to be disjoint. So I have disjoint convex sets. Then it says..."},{"start":551.15,"text":"Very roughly speaking, I can stick a hyperplane between. I can separate them by hyperplane, right? And you may have seen this in some machine learning class where you were talking about, you know, two different sets of points being linearly separable. That's how people would say it there. I mean, if you haven't, that's fine too. But so this is the picture, right? If there's a set C and a set D, then there is some non-zero vector A."},{"start":577.28,"text":"and a number b, so that if a is pointing this way, it says that this half space here is everywhere where a transpose x is less than b, and c is entirely in that set. This half space here is everywhere where a transpose x is bigger than or equal to b over here, and d lies entirely in that set. Okay? So that's the idea. Now, right now, this has no... I mean, this doesn't have any..."},{"start":604.76,"text":"the context or anything like that. But we'll see later, it's related to a lot of stuff we're going to see by about week five, right? I mean, it is the basis, for example, of a lot of economics, like period, right? Because this is basically, you'll see later, this will correspond, you'll say something like, well, there's no arbitrage. And that's going to turn out to be a picture like this. I mean, not in two dimensions, but nevertheless, that's what it's going to be. So we're going to see, we'll see that stuff like this, although right now it has no context, it's going to come up over and over again."},{"start":633.96,"text":"Okay, there's a gazillion variations on this, like, you know, when is this true with these strict, when the inequalities are strict? And then you say they're strictly separated. And it gets complicated and all that sort of stuff. You would see maybe one or two variations in the book, but you actually don't even, I don't think you need to know. You just need to have this picture in your head, right? Now, showing this is actually not too hard. We're not going to do it. I mean, it's sort of like an exercise."},{"start":663.96,"text":"we'll see things kind of more sophisticated anyway. So that's a separating hyperplane. Yes? What would a singleton be? Oh, a singleton. Yeah. Oh, by the way, thank you for asking. Please ask about anything that's not clear. I try. But that is high BBC mathematics. It means a set with exactly one thing in it. Right? So that's a singleton."}],"speech_gaps":[],"frame":"../frames/v003/004.webp","frame_time":534.58},{"title":"支持超平面与凸集的性质","segments":[{"id":54,"text":"And that's completely standard, right? So, I mean, maybe not in different fields, but in high BBC math. That's why everyone should speak a little bit of fancy high BBC math. You should understand a little bit. You should recognize it and actually speak some, right? I mean, if you're accent-free, that's awesome. Then you can, I don't know, then you can hang out with mathematicians or something. But, I mean, if that's a good thing, I don't know. Anyway, okay.","zh":"这完全是一个标准的概念，对吧？我的意思是，可能在不同的领域有所不同，但在高级BBC数学中就是这样。这就是为什么每个人都应该掌握一点高级BBC数学。你应该理解一点，你应该能够识别它并实际使用一些术语，对吧？我的意思是，如果你没有口音，那就太棒了。然后你就可以，我不知道，和数学家们一起待着。但我的意思是，如果这是好事，我也不确定。总之，好吧。","start":687.34,"end":709.92},{"id":55,"text":"And there's variations on it. And this is an important concept. We'll get to this later as well. There's the supporting hyperplane theorem. So first I have to say what a supporting hyperplane is. So a supporting hyperplane is I have a set. It doesn't have to be convex. And I have a point on the boundary of the set here.","zh":"还有它的变体。这是一个重要的概念。我们之后也会讲到。有支持超平面定理。所以首先我需要解释什么是支持超平面。支持超平面是指我有一个集合，它不一定是凸集。并且我有一个点在这个集合的边界上。","start":712.1,"end":728.92},{"id":56,"text":"And if you don't know what the boundary is, we could just take that to be a completely informal... Your eyeball will tell you what's on the boundary. So that's the point on the boundary. And then a supporting hyperplane is a hyperplane that, very roughly speaking, is tangent to the set here. And what it means is it passes through this point, but everything in this hap space is not in this set. Or another way to say it is everything...","zh":"如果你不知道什么是边界，我们可以把它当作一个完全非正式的定义……你的眼睛会告诉你什么在边界上。这就是边界上的点。然后支持超平面是一个超平面，粗略地说，它是与这个集合相切的。它的意思是它经过这个点，但这个超平面空间中的所有点都不在这个集合中。或者说，所有……","start":730.56,"end":755.48},{"id":57,"text":"This hyperplane tells you that the set is in one of the half spaces. That's what it tells you. That's the supporting hyperplane. And what it says is if you have a convex set, then there exists a supporting hyperplane at every point. And that's not too... I mean, it's kind of intuitive that this would be the case. The picture would be something like this. Here's a convex set. See?","zh":"这个超平面告诉你这个集合位于其中一个半空间中。这就是它告诉你的内容。这就是支持超平面。它说的是，如果你有一个凸集，那么在每一个点上都存在一个支持超平面。这并不太……我的意思是，这在直觉上是合理的。图像是这样的。这里有一个凸集。你看？","start":756.48,"end":784.74},{"id":58,"text":"And let's see, let's look at some boundary points. So if you take a point there, there is indeed a supporting hyperplane, and it's basically just tangent to this set, right? By the way, what happens if I go to a corner? Suppose there's a corner there. Let's talk about supporting hyperplanes. Are there some? Is there more than one? Precisely, that's it, right? So when you have a kink...","zh":"让我们看看一些边界点。如果你取一个点在这里，确实存在一个支持超平面，它基本上只是与这个集合相切，对吧？顺便说一句，如果我去一个角落，假设那里有一个角落。让我们讨论支持超平面。是否存在一些？是否存在多个？正是如此，对吧？当你有一个拐角……","start":787.34,"end":813.94},{"id":59,"text":"In a set, there's one. Is there a supporting hyperplane to this set at this point? No, no. So that's what it means, yeah, is that there's no hyperplane at that point that supports it at that point and has the set on one side of it, right? But by the way, the opposite, the converse is also true. If a set has a supporting hyperplane at every point of its boundary, then it's convex.","zh":"在一个集合中，存在一个点。这个集合在该点处是否存在支撑超平面？不，不存在。这就是它的含义，也就是说，在该点处不存在一个超平面，它在该点处支撑集合，并且集合位于该超平面的一侧，对吧？不过，顺便提一下，其逆命题也是成立的。如果一个集合在其边界上的每个点处都有支撑超平面，那么它就是凸集。","start":814.65,"end":841.94},{"id":60,"text":"But again, you know, if you care about these things, that's fine. But it's, you know, a lot of it is just, I think you should think of this intuitively. And these things are just going to come up over and over in applications, which will be really cool. Okay. Okay. Next weird, totally non-motivated thing we're going to do this week is dual cones and generalized inequality.","zh":"但再次强调，如果你关心这些内容，那也没关系。但说实话，很多内容只是让你从直觉上理解。这些概念会在各种应用中反复出现，这会非常有趣。好的。好的。本周我们将要做的下一个奇怪且毫无动机的事情是双重锥和广义不等式。","start":842.68,"end":864.49}],"notes":["本段讲授了支持超平面的基本概念，指出支持超平面是与集合相切的超平面，并且通过该超平面可以判断集合位于某个半空间内。支持超平面的定义适用于任意集合，但特别强调了凸集的性质，即凸集在边界上的每个点都存在支持超平面。","支持超平面的定义需要明确集合和边界点的概念。对于非凸集合，可能在某些边界点上不存在支持超平面，而凸集则保证每个边界点都有支持超平面。这为后续的凸优化理论奠定了基础。","在讨论支持超平面时，讲者通过举例说明了在集合的角落或拐点处可能不存在支持超平面，这进一步强调了凸集的特性。同时，讲者指出支持超平面的存在性与集合的凸性之间存在互为充要条件的关系。","讲者提到支持超平面在实际应用中会频繁出现，这表明该概念在优化问题中具有重要价值。此外，讲者还预告了接下来将讨论对偶锥和广义不等式，这些内容与支持超平面密切相关。","讲者在讲解过程中使用了直观的图像描述，帮助学生理解支持超平面的几何意义。同时，讲者也提醒学生注意支持超平面的定义和性质，避免混淆非凸集合和凸集合之间的区别。","支持超平面的概念是凸优化中的核心内容之一，它不仅用于描述凸集的几何性质，还在优化问题的对偶理论中扮演重要角色。因此，理解支持超平面的定义和性质对于掌握凸优化理论至关重要。"],"formulas":[],"uncertainties":["hap space"],"diagram":"none","start":687.34,"end":864.49,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":687.34,"text":"And that's completely standard, right? So, I mean, maybe not in different fields, but in high BBC math. That's why everyone should speak a little bit of fancy high BBC math. You should understand a little bit. You should recognize it and actually speak some, right? I mean, if you're accent-free, that's awesome. Then you can, I don't know, then you can hang out with mathematicians or something. But, I mean, if that's a good thing, I don't know. Anyway, okay."},{"start":712.1,"text":"And there's variations on it. And this is an important concept. We'll get to this later as well. There's the supporting hyperplane theorem. So first I have to say what a supporting hyperplane is. So a supporting hyperplane is I have a set. It doesn't have to be convex. And I have a point on the boundary of the set here."},{"start":730.56,"text":"And if you don't know what the boundary is, we could just take that to be a completely informal... Your eyeball will tell you what's on the boundary. So that's the point on the boundary. And then a supporting hyperplane is a hyperplane that, very roughly speaking, is tangent to the set here. And what it means is it passes through this point, but everything in this hap space is not in this set. Or another way to say it is everything..."},{"start":756.48,"text":"This hyperplane tells you that the set is in one of the half spaces. That's what it tells you. That's the supporting hyperplane. And what it says is if you have a convex set, then there exists a supporting hyperplane at every point. And that's not too... I mean, it's kind of intuitive that this would be the case. The picture would be something like this. Here's a convex set. See?"},{"start":787.34,"text":"And let's see, let's look at some boundary points. So if you take a point there, there is indeed a supporting hyperplane, and it's basically just tangent to this set, right? By the way, what happens if I go to a corner? Suppose there's a corner there. Let's talk about supporting hyperplanes. Are there some? Is there more than one? Precisely, that's it, right? So when you have a kink..."},{"start":814.65,"text":"In a set, there's one. Is there a supporting hyperplane to this set at this point? No, no. So that's what it means, yeah, is that there's no hyperplane at that point that supports it at that point and has the set on one side of it, right? But by the way, the opposite, the converse is also true. If a set has a supporting hyperplane at every point of its boundary, then it's convex."},{"start":842.68,"text":"But again, you know, if you care about these things, that's fine. But it's, you know, a lot of it is just, I think you should think of this intuitively. And these things are just going to come up over and over in applications, which will be really cool. Okay. Okay. Next weird, totally non-motivated thing we're going to do this week is dual cones and generalized inequality."}],"speech_gaps":[],"frame":"../frames/v003/005.webp","frame_time":699.34},{"title":"对偶锥的概念与例子","segments":[{"id":61,"text":"The first is, so actually, let me just start, let me explain what this is a generalization of, right? So you may know in linear algebra, if that's a subspace, then you have V perp. That's how you pronounce this, right? And that's the set of all, you know, x.","zh":"第一个是，实际上，让我先开始，让我解释一下这是对什么概念的推广，对吧？你可能知道在线性代数中，如果这是一个子空间，那么你有V的正交补集。这就是这个术语的发音，对吧？这是所有满足条件的x的集合。","start":867.07,"end":888.27},{"id":62,"text":"for which y transpose x equals zero for all, you know, y in v, right? So that's it. So that's a useful concept. It's a set of all things orthogonal to everything in your subspace, right? So that's what, and, you know, it kind of means, it's also called the orthogonal complement is another name for this. It's got a bunch of names, okay?","zh":"对于所有y在V中的情况，y的转置乘以x等于零，对吧？这就是它的定义。这是一个有用的观念。这是所有与子空间中每个元素都正交的元素的集合，对吧？这就是所谓的正交补集，这也是这个概念的另一个名称。它有很多名称，好吧？","start":889.02,"end":910.04},{"id":63,"text":"And you probably, you may even know how to, you know, compute a basis for it. If I gave you a basis for like, let's say V or something, right? Okay. So this is the same concept, except now with inequalities. Makes it, in fact, that's kind of, in some sense, that's all we're doing mathematically is we're doing linear algebra with asymmetries. So we replace equalities with inequalities. That's actually all we're doing, right? So, okay. So let's look at what it means to be a dual cone.","zh":"你可能已经知道如何计算它的基底了。如果我给你一个子空间V的基底，对吧？好的。这个概念是相同的，只是现在使用的是不等式。事实上，从某种意义上说，我们在数学上所做的就是处理不对称的线性代数。我们将等式替换为不等式。实际上，这就是我们所做的，对吧？好的。那么，让我们看看什么是对偶锥。","start":911.06,"end":939.62},{"id":64,"text":"All right, sorry that I switched x and y over there and here, but that's fine. So let's actually just draw some pictures because I think that's really the best way to understand this. Okay, so let me write down the definition. So we have it, which is k star equals... I mean, it's perfectly okay for me not to do this to get it right. This is...","zh":"好的，抱歉我在那里和这里交换了x和y，但这没关系。让我们实际上画一些图，因为我觉得这是理解这个概念的最佳方式。好的，让我写下定义。我们有k星等于……我的意思是，我不做这个来确保正确性也是完全可以的。这是……","start":940.33,"end":968.41},{"id":65,"text":"for all x in k. There you go. Okay? So it says you have to make a non-negative inner product with every entry of the cone. Cool? Okay. So I'll just do a couple, and then we quit, and I'll let you go off and do this yourself. All right? So let's write down some cones. Oh, look, here's a cone. Ready? Hey, it's a singleton. There we go. So that's a cone. It's a stupid cone, but it's a cone.","zh":"对于所有x在k中的情况。好了，对吧？所以它表示你必须与锥体中的每个元素形成非负的内积。明白吗？好的。我只做几个例子，然后我们就结束，让你自己去完成这个任务。好的。让我们写下一些锥体。哦，看，这里有一个锥体。准备好了吗？嘿，它是一个单元素集合。好了，这就是一个锥体。它是一个愚蠢的锥体，但它确实是一个锥体。","start":969.17,"end":996.32},{"id":66,"text":"You tell me, what is the dual cone of this? What is it? It's R2. Yeah, because we're doing this in R2 so I can draw it on the board, right? So it's actually everything. Because actually, this is actually, it says, you know, what are the set of vectors so that when you take an inner product with a zero vector, you're bigger than or equal to zero. The answer is like anything, okay? So in this case, you would write it this way.","zh":"你告诉我，这个的对偶锥是什么？是什么？它是R²。对，因为我们是在R²中进行这个操作，所以我可以在黑板上画出来，对吧？所以实际上，它就是一切。因为实际上，它说的是，什么样的向量集合，当它们与零向量做内积时，结果大于或等于零。答案就是任何向量，对吧？所以在这种情况下，你会这样写。","start":996.73,"end":1024.73},{"id":67,"text":"This is R2, right? Which is a cone. R2 is a cone. I mean, it's silly. It's also subspecific, but it's a cone. Oh, by the way, this is something you're going to see that's kind of interesting. When you have a dual cone, if the cone itself is kind of small, that's as small as cones get, right? Then your dual cone is big.","zh":"这是R²，对吧？它本身就是一个锥体。R²是一个锥体。我是说，这有点傻，但它也是子特定的，但它确实是一个锥体。哦，顺便提一下，这是一件有趣的事情。当你有一个对偶锥时，如果这个锥体本身比较小，那是锥体能有多小，那么你的对偶锥就会很大。","start":1027.19,"end":1046.33}],"notes":["本段讲解了对偶锥的概念，它是正交补集的推广，将等式替换为不等式。对偶锥的定义是所有与锥体中每个元素的内积非负的向量集合。讲者提到，当锥体本身很小（如单元素锥）时，其对偶锥会很大，这体现了对偶关系的特性。","讲者通过举例说明了对偶锥的计算方法，例如单元素锥的对偶锥是整个空间R²，因为任何向量与零向量的内积都非负。这展示了对偶锥的定义在不同情况下的应用。","讲者强调了对偶锥在凸优化中的重要性，它与线性代数中的正交补集概念类似，但适用于不等式约束的情况。这种推广使得对偶锥成为处理凸优化问题的重要工具。","讲者提到，对偶锥的定义需要满足所有锥体元素的非负内积条件，这与正交补集的定义有相似之处，但扩展到了更一般的不等式约束。","讲者指出，当锥体非常小时，其对偶锥会变得很大，这说明了对偶关系的非对称性。这种特性在凸优化中具有重要意义，因为它影响了对偶问题的结构和解的性质。","讲者通过简单的例子（如单元素锥）来说明对偶锥的计算方法，这有助于学生理解对偶锥的定义和应用。这种直观的例子有助于学生掌握抽象概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":867.07,"end":1046.33,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":867.07,"text":"The first is, so actually, let me just start, let me explain what this is a generalization of, right? So you may know in linear algebra, if that's a subspace, then you have V perp. That's how you pronounce this, right? And that's the set of all, you know, x."},{"start":889.02,"text":"for which y transpose x equals zero for all, you know, y in v, right? So that's it. So that's a useful concept. It's a set of all things orthogonal to everything in your subspace, right? So that's what, and, you know, it kind of means, it's also called the orthogonal complement is another name for this. It's got a bunch of names, okay?"},{"start":911.06,"text":"And you probably, you may even know how to, you know, compute a basis for it. If I gave you a basis for like, let's say V or something, right? Okay. So this is the same concept, except now with inequalities. Makes it, in fact, that's kind of, in some sense, that's all we're doing mathematically is we're doing linear algebra with asymmetries. So we replace equalities with inequalities. That's actually all we're doing, right? So, okay. So let's look at what it means to be a dual cone."},{"start":940.33,"text":"All right, sorry that I switched x and y over there and here, but that's fine. So let's actually just draw some pictures because I think that's really the best way to understand this. Okay, so let me write down the definition. So we have it, which is k star equals... I mean, it's perfectly okay for me not to do this to get it right. This is..."},{"start":969.17,"text":"for all x in k. There you go. Okay? So it says you have to make a non-negative inner product with every entry of the cone. Cool? Okay. So I'll just do a couple, and then we quit, and I'll let you go off and do this yourself. All right? So let's write down some cones. Oh, look, here's a cone. Ready? Hey, it's a singleton. There we go. So that's a cone. It's a stupid cone, but it's a cone."},{"start":996.73,"text":"You tell me, what is the dual cone of this? What is it? It's R2. Yeah, because we're doing this in R2 so I can draw it on the board, right? So it's actually everything. Because actually, this is actually, it says, you know, what are the set of vectors so that when you take an inner product with a zero vector, you're bigger than or equal to zero. The answer is like anything, okay? So in this case, you would write it this way."},{"start":1027.19,"text":"This is R2, right? Which is a cone. R2 is a cone. I mean, it's silly. It's also subspecific, but it's a cone. Oh, by the way, this is something you're going to see that's kind of interesting. When you have a dual cone, if the cone itself is kind of small, that's as small as cones get, right? Then your dual cone is big."}],"speech_gaps":[],"frame":"../frames/v003/006.webp","frame_time":879.07},{"title":"对偶锥与共轭概念","segments":[{"id":68,"text":"And you've seen things like this. This is like a conjugacy type thing. So you have this in Fourier transforms. I'll go into dialect if you don't mind. But if you have a signal that's very time limited, then it's Fourier transform is big old wide. And conversely. The other thing about conjugacy things is you have this general concept in math that if you do it twice, you get back to the original thing. If you have complex numbers, the conjugate of a conjugate is the number again.","zh":"你已经见过类似的东西了。这类似于共轭的概念。你在傅里叶变换中也见过这种东西。如果你不介意，我可以讲点方言。如果你有一个在时间上非常有限制的信号，那么它的傅里叶变换就会很宽广。反之亦然。关于共轭概念的另一点是，数学中有一个一般性的概念，如果你做两次，就会回到原来的东西。如果你有复数，复数的共轭的共轭就是这个数本身。","start":1046.83,"end":1075.93},{"id":69,"text":"Okay? Over here with subspaces, like I was talking before, if you have a subspace and you go v perp, then perp that. Now, of course, your head explodes, because if you think about what v perp perp is, someone says, what are you looking at? You go, oh, it's a set of all vectors that are orthogonal to all vectors that are orthogonal to all vectors in this subspace. Now, you can pretend you understand what I just said, but I don't.","zh":"明白了？在这里，关于子空间，就像我之前说的，如果你有一个子空间，然后你取v的正交补，再取正交补。当然，你的脑袋会爆炸，因为如果你考虑v的正交补的正交补是什么，有人会问，你在看什么？你会说，哦，这是所有与这个子空间中所有向量正交的向量正交的向量的集合。你现在可以假装你理解了我刚才说的话，但我不理解。","start":1076.37,"end":1103.43},{"id":70,"text":"I didn't get it. And no human being could. I mean, well, maybe a few, but they're weird, right? And you just, so I'm just saying, yeah, these things, but you start using powerful notation and you get used to these things, right? So what is the dual cone of R2, by the way? It's that, right? So the only vector that has a non-negative inner product with all vectors in R2 is zero. Hey, look at that. Funny about that. The conjugate, the dual of the dual is itself, okay?","zh":"我不理解。而且没有人能理解。我是说，也许有少数人能，但他们很奇怪，对吧？你只是，所以我说，是的，这些东西，但当你开始使用强大的符号时，你会习惯这些东西，对吧？顺便问一句，实数空间R²的对偶锥是什么？就是这个，对吧？所以唯一一个与R²中所有向量有非负内积的向量是零向量。嘿，看看这个。真有意思。共轭，对偶的对偶就是它本身，对吧？","start":1103.93,"end":1133.69},{"id":71,"text":"So, and these are just like meta ideas that we're going to see in different points in the course. Okay, let me draw some non-silly ones. How about this? Here's a cone in R2. It's a ray. It's just all non-negative multiples of a vector. This just goes off to infinity. That's a ray, it's called. Okay, what's the dual cone of it? How do we find out? How do we figure it out? Yeah.","zh":"所以，这些都是我们在课程中不同点上会看到的元概念。好的，让我画一些不那么傻的。比如这个？这里是一个R²中的锥体，它是一条射线。它只是某个向量的所有非负倍数。它一直延伸到无穷远。这叫做射线。好的，它的对偶锥是什么？我们怎么找到它？我们怎么弄清楚？是的。","start":1134.24,"end":1162.21},{"id":72,"text":"half space that it's orthogonal to yeah yeah so before we do before we just jump in i mean you know that's correct but let's let's do the following let's first just ask like when whether a vector is in the dual cone this is k right here and i want to know if you're in k star well so here's a vector uh is that is that in k star","zh":"它是一个正交于它的半空间，是的，是的。所以在我们跳入之前，我想说，你知道这是正确的，但让我们这样做，让我们先问一下，什么时候一个向量在对偶锥中。这里是k，我想知道你是否在k星中。好的，这里有一个向量，它是，它是k星中的吗？","start":1163.14,"end":1183.38},{"id":73,"text":"it is yeah yeah because you know basically this thing it has a non-negative inner product with everything everything on this ray i mean on the ray it just scales it right so okay so so that's in the dual cone um how about this guy over here how about that point yeah okay uh how about this point over here no","zh":"是的，是的，因为你知道，基本上这个东西与这条射线上的所有元素都有非负的内积，我意思是，在这条射线上，它只是对其进行缩放，对吧？所以，所以这就是对偶锥中的一个元素。那么，那边的这个点呢？那边的那个点呢？嗯，那边的那个点呢？不","start":1185.48,"end":1205.14}],"notes":["本段讲解了对偶锥的概念，即给定一个锥体K，其对偶锥K*包含所有与K中所有向量有非负内积的向量。讲者通过一个二维空间中的射线锥体K举例，说明如何判断一个向量是否属于K*。","讲者提到，判断一个向量是否在对偶锥中，需要检查它是否与锥体K中的所有向量有非负内积。例如，一个与射线方向一致的向量必然属于K*，因为它与射线上的所有向量的内积都是非负的。","讲者指出，对于射线锥体K，其对偶锥K*是一个半空间，即所有与射线方向正交的向量构成的集合。这表明对偶锥的几何结构与原锥体密切相关。","讲者强调，理解对偶锥需要掌握内积和锥体的基本概念，并通过具体例子进行验证。例如，一个与射线方向相反的向量不会属于K*，因为它与射线上的向量的内积为负。","讲者提到，对偶锥的定义是基于内积的非负性，这与共轭概念类似，即对偶锥的对偶锥是原锥体本身。这种对偶性在凸优化中具有重要意义。","讲者通过口头解释和举例说明了对偶锥的计算方法，但未给出完整的数学推导，因此需要进一步学习相关理论以加深理解。"],"formulas":[],"uncertainties":["half space that it's orthogonal to"],"diagram":"none","start":1046.83,"end":1205.14,"asr_flags":[],"math_clarifications":["原始公式中的 'is non-negative' 应该明确为数学符号 '≥ 0'，以符合数学表达规范。同时，'K^*' 表示对偶锥，'v^T x' 表示向量 v 和 x 的内积，'x ∈ K' 表示 x 属于锥体 K。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1046.83,"text":"And you've seen things like this. This is like a conjugacy type thing. So you have this in Fourier transforms. I'll go into dialect if you don't mind. But if you have a signal that's very time limited, then it's Fourier transform is big old wide. And conversely. The other thing about conjugacy things is you have this general concept in math that if you do it twice, you get back to the original thing. If you have complex numbers, the conjugate of a conjugate is the number again."},{"start":1076.37,"text":"Okay? Over here with subspaces, like I was talking before, if you have a subspace and you go v perp, then perp that. Now, of course, your head explodes, because if you think about what v perp perp is, someone says, what are you looking at? You go, oh, it's a set of all vectors that are orthogonal to all vectors that are orthogonal to all vectors in this subspace. Now, you can pretend you understand what I just said, but I don't."},{"start":1103.93,"text":"I didn't get it. And no human being could. I mean, well, maybe a few, but they're weird, right? And you just, so I'm just saying, yeah, these things, but you start using powerful notation and you get used to these things, right? So what is the dual cone of R2, by the way? It's that, right? So the only vector that has a non-negative inner product with all vectors in R2 is zero. Hey, look at that. Funny about that. The conjugate, the dual of the dual is itself, okay?"},{"start":1134.24,"text":"So, and these are just like meta ideas that we're going to see in different points in the course. Okay, let me draw some non-silly ones. How about this? Here's a cone in R2. It's a ray. It's just all non-negative multiples of a vector. This just goes off to infinity. That's a ray, it's called. Okay, what's the dual cone of it? How do we find out? How do we figure it out? Yeah."},{"start":1163.14,"text":"half space that it's orthogonal to yeah yeah so before we do before we just jump in i mean you know that's correct but let's let's do the following let's first just ask like when whether a vector is in the dual cone this is k right here and i want to know if you're in k star well so here's a vector uh is that is that in k star"},{"start":1185.48,"text":"it is yeah yeah because you know basically this thing it has a non-negative inner product with everything everything on this ray i mean on the ray it just scales it right so okay so so that's in the dual cone um how about this guy over here how about that point yeah okay uh how about this point over here no"}],"speech_gaps":[],"frame":"../frames/v003/007.webp","frame_time":1058.83},{"title":"对偶锥与几何解释","segments":[{"id":74,"text":"Doesn't work. Okay. And so, you know, basically by doing a couple of these, you will quickly figure out that in fact, this is the dual cone. It's a half space. So you could say something fancy like the dual cone of a ray, the dual of a ray is a half space. And notice that that has our small big concept embedded there. Like a ray is kind of a, you know, a very small little baby sharp cone. And then a half space is pretty much as blunt as a cone as you can get.","zh":"不行。好的。所以，你大概通过做几个这样的例子，很快就会明白，实际上这就是对偶锥。它是一个半空间。你可以用一些华丽的说法，比如，一个射线的对偶锥是一个半空间。请注意，这里面包含了我们的一些基本概念。比如，射线可以看作是一个非常小的、尖锐的锥体。而半空间则是你能得到的最钝的锥体了。","start":1206.56,"end":1235.58},{"id":75,"text":"Well, you can have all of our, you know, all of our two, but that's silly, right? So, okay, everybody got this? So I think these are the pictures, you know, you can talk to people you work with or something like, but some of these get complicated and actually a lot of these things you actually have to show. Like,","zh":"当然，你也可以拥有我们所有的两个，但这很傻，对吧？所以，好吧，大家明白了吗？我认为这些就是图像，你可以和你一起工作的人讨论，或者类似的事情。但其中一些内容会变得复杂，实际上，很多这些内容你必须通过证明来理解。比如，","start":1236.05,"end":1252.43},{"id":76,"text":"I mean, and they're not totally straightforward. They involve like, you know, Cauchy-Schwartz inequality or something like that. But, you know, we could, and these are probably best done, you know, in either homework exercises or something like that. But, you know, the things you'd have to show. For example, let's say k equals r plus to the n, non-negative orthon. And when I say the dual of that turns out to be, well, let's just do it in r2. How about that? We'll do it in r2 and then...","zh":"我的意思是，这些内容并不完全直观。它们涉及像柯西-施瓦茨不等式这样的内容。不过，你知道的，我们可以通过这些例子来展示，这些例子可能最好是在家庭作业练习题中完成，或者类似的事情。但你知道的，你必须证明的内容。例如，假设k等于r加上n维的非负正交向量。当我说这个的对偶锥是怎样的时，我们就在二维空间中来处理这个问题吧。怎么样？我们就在二维空间中处理，然后……","start":1253.21,"end":1279.8},{"id":77,"text":"That'll give you a visual on it, and then you'll know that it actually generalizes. So here's my cone K, right? And now I just ask questions like, who's in the dual cone, right? And I ask a question like, is that in the dual cone? No, because look, here's a point over here in the cone, and it's got a negative inner product with this thing, okay? So this is not, okay? Is this in the dual cone? Let's go slow. What I'm asking is, does this vector...","zh":"这将给你一个直观的理解，然后你就会知道它实际上可以推广。所以这里是我的锥体K，对吧？现在我问的问题是，谁在对偶锥中，对吧？我问的问题是，这个点是否在对偶锥中？不，因为看，这里有一个点在这个锥体中，它与这个向量的内积是负的，对吧？所以这个不在，对吧？这个点是否在对偶锥中？我们慢慢来。我问的是，这个向量……","start":1280.76,"end":1311.36},{"id":78,"text":"have a non-negative inner product","zh":"是否具有非负的内积","start":1311.82,"end":1314.24},{"id":79,"text":"Is it plus or minus 90? Is it within 90 degrees of every vector here? And the answer is, it is. And what you figure out pretty quickly is that the dual cone is going to be, it's basically itself. And then that has a fancy name that's called a self-dual cone. Okay? So this is the picture. Now, by the way, I don't think that you could get all of it now. So if you didn't get it all, not a problem. You will have many, many chances to get this later. Okay.","zh":"这是正还是负90度？它是否在每一个向量的90度范围内？答案是，它确实如此。你很快就会发现，对偶锥实际上就是它本身。这种锥体有一个优雅的名字，叫做自对偶锥。明白了吗？这就是这张图。顺便说一下，我觉得你现在可能还不能完全理解所有内容。如果你还没完全理解，没关系。你之后会有许多机会来掌握这个概念。好吗？","start":1314.67,"end":1342.97},{"id":80,"text":"Now it turns out this connections between minimum minimal and dual cones and things like that And this is actually going to end up being super Important and in a lot of practical stuff that we'll see later actually a lot of times you've seen you've already seen it, right? so in in other contexts, right, so If a set over here, that's s has a minimum point in this case. It's it's X, right? Then it's a minimum element","zh":"事实上，这种最小值与对偶锥之间的联系非常重要，而且在我们之后将看到的许多实际应用中都会出现。实际上，你可能已经见过这种概念了，对吧？所以在其他上下文中，如果一个集合在这里，比如说集合S有一个最小点，这个点就是X，对吧？那么它就是一个最小元素。","start":1344.08,"end":1372.5}],"notes":["本段主要讲解对偶锥的概念，通过几何直观来理解。对偶锥是原锥的对偶空间，例如一个射线的对偶锥是一个半空间。射线可以看作是一个非常尖锐的锥体，而半空间则是最钝的锥体形式。","讲者提到，有些概念需要通过证明来理解，例如使用柯西-施瓦茨不等式等工具。这些证明通常需要通过作业或练习来完成，而不是在课堂上直接展开。","讲者以二维空间为例，通过图形化的方式解释对偶锥的构造。通过检查向量与锥体中所有向量的内积是否非负，可以判断该向量是否属于对偶锥。","讲者指出，某些概念可能需要多次学习和理解，例如对偶锥与最小值点之间的关系。这些内容将在后续课程中进一步展开。","讲者提到，对偶锥的概念在后续的优化问题中非常重要，尤其是在实际应用中。这些概念可能在其他上下文中已经出现过，但需要进一步理解。","讲者最后提到，一个集合如果有最小点，那么该点就是最小元素。这与对偶锥的性质相关，但需要进一步的证明和理解。"],"formulas":[],"uncertainties":["k equals r plus to the n, non-negative orthon"],"diagram":"none","start":1206.56,"end":1372.5,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1206.56,"text":"Doesn't work. Okay. And so, you know, basically by doing a couple of these, you will quickly figure out that in fact, this is the dual cone. It's a half space. So you could say something fancy like the dual cone of a ray, the dual of a ray is a half space. And notice that that has our small big concept embedded there. Like a ray is kind of a, you know, a very small little baby sharp cone. And then a half space is pretty much as blunt as a cone as you can get."},{"start":1236.05,"text":"Well, you can have all of our, you know, all of our two, but that's silly, right? So, okay, everybody got this? So I think these are the pictures, you know, you can talk to people you work with or something like, but some of these get complicated and actually a lot of these things you actually have to show. Like,"},{"start":1253.21,"text":"I mean, and they're not totally straightforward. They involve like, you know, Cauchy-Schwartz inequality or something like that. But, you know, we could, and these are probably best done, you know, in either homework exercises or something like that. But, you know, the things you'd have to show. For example, let's say k equals r plus to the n, non-negative orthon. And when I say the dual of that turns out to be, well, let's just do it in r2. How about that? We'll do it in r2 and then..."},{"start":1280.76,"text":"That'll give you a visual on it, and then you'll know that it actually generalizes. So here's my cone K, right? And now I just ask questions like, who's in the dual cone, right? And I ask a question like, is that in the dual cone? No, because look, here's a point over here in the cone, and it's got a negative inner product with this thing, okay? So this is not, okay? Is this in the dual cone? Let's go slow. What I'm asking is, does this vector..."},{"start":1311.82,"text":"have a non-negative inner product"},{"start":1314.67,"text":"Is it plus or minus 90? Is it within 90 degrees of every vector here? And the answer is, it is. And what you figure out pretty quickly is that the dual cone is going to be, it's basically itself. And then that has a fancy name that's called a self-dual cone. Okay? So this is the picture. Now, by the way, I don't think that you could get all of it now. So if you didn't get it all, not a problem. You will have many, many chances to get this later. Okay."},{"start":1344.08,"text":"Now it turns out this connections between minimum minimal and dual cones and things like that And this is actually going to end up being super Important and in a lot of practical stuff that we'll see later actually a lot of times you've seen you've already seen it, right? so in in other contexts, right, so If a set over here, that's s has a minimum point in this case. It's it's X, right? Then it's a minimum element"}],"speech_gaps":[],"frame":"../frames/v003/008.webp","frame_time":1218.56},{"title":"对偶锥与最小化问题的等价性","segments":[{"id":81,"text":"If and only if, whenever you minimize lambda transpose z over s, for any lambda in the dual cone, you get actually x. It says x is the unique minimizer of this, right? So that's, I mean, it's actually kind of interesting.","zh":"当且仅当，无论你如何在s上最小化lambda转置z，对于任何属于对偶锥的lambda，你实际上得到的是x。它说x是这个最小化的唯一解，对吧？所以，这其实挺有意思的。","start":1373.09,"end":1391.29},{"id":82,"text":"that the cone is the non-negative orthant, right? Then what this says is actually really interesting. If you are a minimum point of a set with respect to the non-negative orthant, it says that pick any positive weights, that's lambda, form this linear combination, minimize, and you always get the same thing. You always arrive at this minimum element, right?","zh":"如果锥是正数正交锥，对吧？那么这句话实际上非常有趣。如果你是相对于正数正交锥的一个集合的最小点，它说你可以选择任何正权重，也就是lambda，形成这个线性组合，进行最小化，你总是得到同样的结果。你总是会到达这个最小元素，对吧？","start":1391.6,"end":1415.4},{"id":83,"text":"So that's what that means. It means independent of these weights. However you weight them, doesn't matter. You always get this minimum element, which kind of makes sense, right? Minimal elements, you can find these actually very nicely. This says you simply take any weight that is positive in the dual cone.","zh":"这就是它的意思。这意味着无论这些权重如何，不管你怎么加权，你总是得到这个最小元素，这在某种程度上是合理的，对吧？最小元素，实际上可以非常漂亮地找到。这句话说你只需要选择任何在对偶锥中为正的权重。","start":1416.13,"end":1432.87},{"id":84,"text":"And then you minimize this linear function over z. And what happens then is you are guaranteed to get a minimal point. Now, you've seen this in other contexts. This is like, you know, when you're doing multi-criterion optimization and you make a weighted combination and you minimize a non-negative weighted combination, you get something that's, you know, Pareto optimal, which we'll talk about all this stuff later. There's a question. What is what?","zh":"然后你在这个z上最小化这个线性函数。然后发生的事情是，你保证会得到一个最小点。你现在在其他上下文中见过这个。这类似于当你进行多目标优化时，你做一个加权组合，并最小化一个非负加权组合，你会得到一个帕累托最优解，我们之后会详细讨论这些内容。有一个问题。这是什么？","start":1433.41,"end":1460.44},{"id":85,"text":"What is, I'm sorry. V. Sorry. Z. Is there some Z? Z is a dummy variable, right? So if I say, this is a function, which is F of Z equals lambda transpose Z. So Z is a dummy variable, right? It has no meaning. You can change it to your favorite character. Yeah.","zh":"这是什么，抱歉。V。抱歉。Z。有没有某个Z？Z是一个哑变量，对吧？所以如果说，这是一个函数，F(Z)等于lambda转置Z。所以Z是一个哑变量，对吧？它没有意义。你可以把它换成你最喜欢的字符。是的。","start":1462.67,"end":1485.2},{"id":86,"text":"Well, lambda itself doesn't... Lambda is anything that is positive in the dual inequality. Right? So it's any vector in the positive dual inequality. That's what it means. Okay? So, again, this is kind of weird and out of context, so I wouldn't worry too much about it, but it's something we will see over and over again. Okay.","zh":"好吧，lambda本身并不……lambda是任何在对偶不等式中为正的向量。对吧？所以它是任何在正对偶不等式中的向量。这就是它的意思。明白吗？所以，再次强调，这在脱离上下文的情况下有点奇怪，所以不要太担心，但这是我们反复会看到的内容。好的。","start":1487.74,"end":1509.01},{"id":87,"text":"And our first like, you know, baby childish application from economics goes like this. I mean, this is silly, but so I have to produce a product. Right. And I have a production set and a production set in general tells you and you have different ways of producing it. Right. And a production set in general tells you it tells you what are all the choices that parameterize your production set.","zh":"那么我们第一个像孩子一样幼稚的应用来自经济学，大致是这样的。我的意思是，这很傻，但我要生产一种产品。对吧。我有一个生产集，一般来说，生产集告诉你，你有不同方式来生产它。对吧。一般来说，生产集告诉你，它告诉你所有参数化你生产集的选择是什么。","start":1509.46,"end":1535.36}],"notes":["本段讲解了对偶锥与最小化问题之间的等价性。当且仅当对于任何属于对偶锥的向量λ，最小化λ^T z的结果是x时，x才是该问题的唯一最小化点。这表明，无论选择怎样的正权重λ，只要满足对偶锥的条件，都能得到相同的最小点。这种性质在多目标优化中也有所体现，例如通过加权组合得到帕累托最优解。","讲者提到，当锥是正象限（non-negative orthant）时，这种性质变得特别有意义。此时，无论选择怎样的正权重λ，对z进行线性组合并最小化，都能得到相同的最小点。这说明了最小点的稳定性，即无论权重如何变化，结果保持一致。","讲者进一步解释了Z是一个哑变量（dummy variable），在函数F(Z) = λ^T Z中，Z没有实际意义，可以替换为任何其他符号。这表明在数学表达中，变量的选择是灵活的，只要满足问题的结构要求。","讲者提到λ是满足对偶不等式的正向量，即任何属于正对偶锥的向量。这表明λ的选择必须满足特定的约束条件，以确保最小化问题的正确性。","最后，讲者提到一个来自经济学的简单应用，即生产集（production set）的概念。生产集描述了所有可能的生产方式，通过参数化这些选择，可以分析生产过程中的不同可能性。","讲者强调，虽然这些概念在数学上可能显得抽象，但在实际应用中（如经济学）会反复出现，因此需要理解其背后的逻辑和结构。"],"formulas":[{"latex":"F(Z) = \\lambda^T Z","symbols":"F(Z) 是一个线性函数，其中 Z 是哑变量，表示任何满足条件的变量。","explanation":"公式正确，表示 F(Z) 是一个线性函数，其中 Z 是哑变量，表示任何满足条件的变量。","evidence":"What is, I'm sorry. V. Sorry. Z. Is there some Z? Z is a dummy variable, right? So if I say, this is a function, which is F of Z equals lambda transpose Z. So Z is a dummy variable, right? It has no meaning. You can change it to your favorite character. Yeah."}],"uncertainties":["lambda itself doesn't..."],"diagram":"none","start":1373.09,"end":1535.36,"asr_flags":[],"math_clarifications":["原始公式存在语法错误，'argmin' 后的条件和表达式不完整，需要修复。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1373.09,"text":"If and only if, whenever you minimize lambda transpose z over s, for any lambda in the dual cone, you get actually x. It says x is the unique minimizer of this, right? So that's, I mean, it's actually kind of interesting. Let's suppose that..."},{"start":1391.6,"text":"that the cone is the non-negative orthant, right? Then what this says is actually really interesting. If you are a minimum point of a set with respect to the non-negative orthant, it says that pick any positive weights, that's lambda, form this linear combination, minimize, and you always get the same thing. You always arrive at this minimum element, right?"},{"start":1416.13,"text":"So that's what that means. It means independent of these weights. However you weight them, doesn't matter. You always get this minimum element, which kind of makes sense, right? Minimal elements, you can find these actually very nicely. This says you simply take any weight that is positive in the dual cone."},{"start":1433.41,"text":"And then you minimize this linear function over z. And what happens then is you are guaranteed to get a minimal point. Now, you've seen this in other contexts. This is like, you know, when you're doing multi-criterion optimization and you make a weighted combination and you minimize a non-negative weighted combination, you get something that's, you know, Pareto optimal, which we'll talk about all this stuff later. There's a question. What is what?"},{"start":1462.67,"text":"What is, I'm sorry. V. Sorry. Z. Is there some Z? Z is a dummy variable, right? So if I say, this is a function, which is F of Z equals lambda transpose Z. So Z is a dummy variable, right? It has no meaning. You can change it to your favorite character. Yeah."},{"start":1487.74,"text":"Well, lambda itself doesn't... Lambda is anything that is positive in the dual inequality. Right? So it's any vector in the positive dual inequality. That's what it means. Okay? So, again, this is kind of weird and out of context, so I wouldn't worry too much about it, but it's something we will see over and over again. Okay."},{"start":1509.46,"text":"And our first like, you know, baby childish application from economics goes like this. I mean, this is silly, but so I have to produce a product. Right. And I have a production set and a production set in general tells you and you have different ways of producing it. Right. And a production set in general tells you it tells you what are all the choices that parameterize your production set."}],"speech_gaps":[],"frame":"../frames/v003/009.webp","frame_time":1385.09},{"title":"凸函数的定义与性质","segments":[{"id":88,"text":"which is feasible. Right. And so this is just a made up thing with like, you know, fuel and labor. I mean, it's silly, but there it is. And it said we can make we can get away. We can produce what we need to any point in with any point in here. And I mean, we're getting a little bit ahead of ourselves, but we can talk. We could talk about this if we decide that. I mean, here I'd call them fuel and labor, but it doesn't matter if we decide that each of these sort of has value.","zh":"这可行。对的。所以这只是个虚构的例子，比如燃料和劳动力。我的意思是，这很傻，但就是这样。它说我们可以制造我们需要的任何一点，我们可以在其中的任何一点生产。我的意思是，我们有点超前了，但我们可以谈论这个，如果我们决定的话。我的意思是，我这里称它们为燃料和劳动力，但如果决定每个这样的东西都有价值，那也没关系。","start":1535.94,"end":1560.34},{"id":89,"text":"Positive value, not negative value. Now, what that tells you is kind of everything down and to the left is better. Because, for example, yeah, let's see. If you took this point and you said, you say, thank you for your order. Here's how I'm going to run my business. Okay, and you take this point. Anybody have a comment about that? What?","zh":"正值，而不是负值。这告诉你的意思是，所有在下方和左方的点都更好。例如，如果你取这个点并说，谢谢你的订单。我将这样经营我的生意。好的，然后你取这个点。有人对此有评论吗？什么？","start":1561.1,"end":1586.64},{"id":90,"text":"Yeah, I heard the word. It's good. We'll get to it later. It's not efficient. Or I'll tell you, the technical term for that is, that would be a stupid choice. That's the technical term. Because you'd say, why would you run it like that? Like, excuse me, but this is silly. If you're going to do that, why not do this? And I can make the exact same stuff, and I'll use less fuel and less labor. And some would, I don't know what they would say about that, and they'd say,","zh":"是的，我听到了这个词。很好。我们之后会讲到。这是不高效的。或者我会告诉你，这个术语是，这会是一个愚蠢的选择。这是技术术语。因为你会说，为什么你要这样经营？像，打扰了，但这是很傻的。如果你要这样做，为什么不这样做呢？我可以制造完全相同的东西，并且使用更少的燃料和劳动力。有些人可能不知道他们会说什么，他们会说，","start":1587.29,"end":1613.29},{"id":91,"text":"Yeah, but how do you know it's better? I haven't told you the price of fuel and labor. And you go, dude, as long as they're positive, this is better. OK, everybody got this? So we'll get to all this. And you can see that these are just concepts of efficiency and minimal points. And one name for this is Pareto optimal. And again, we'll come back to this later in quite a lot of detail. But this is things you've seen, I think, or things you've heard of. OK, now we're going to jump into convex functions.","zh":"是的，但你怎么知道它更好？我还没有告诉你燃料和劳动力的价格。然后你说，伙计，只要它们是正的，这就会更好。好的，大家明白了吗？我们会讲到所有这些。你可以看到这些只是效率和最小点的概念。其中一个名称是帕累托最优。而且，我们之后会详细讨论这一点。但这些都是你已经看到或听说过的东西。好的，现在我们要跳入凸函数。","start":1613.72,"end":1643.39},{"id":92,"text":"And, you know, first I'll just say what a convex function is. So a convex function is a function from Rn to R. It's got a domain. That means that's all the points for which F is defined. That's the domain. Okay?","zh":"你知道，首先我只会说什么是凸函数。所以，凸函数是从 Rn 到 R 的函数。它有一个定义域。这意味着这是 F 定义的所有点。这是定义域。好的？","start":1645.34,"end":1660.06},{"id":93,"text":"And the domain has to be convex. And then it has to satisfy this inequality. And what that inequality says is, I mean, there's some weird terms, but I forget what people call this. But this is the graph of the function here. And I think, oh, this is called a chord, I think. That's like some ancient, you know, comes from ancient Greek or something. So that's a chord of the function. And what it says is the chord lies above the graph, right? Or I like to think of it, it has non-negative curvature, right?","zh":"定义域必须是凸集。然后它必须满足这个不等式。这个不等式的意思是，虽然有一些奇怪的术语，但我忘了人们称它为什么。但这是这个函数的图像。我想，哦，这叫做弦，我想。这是来自古希腊的术语，或者类似的东西。所以这是函数的一条弦。它表示的是弦位于图像上方，对吧？或者我喜欢这样想，它具有非负曲率，对吧？","start":1660.92,"end":1689.33},{"id":94,"text":"It can have zero curvature, right? Then there would be like an affine function. But convexity means non-negative curvature. Or you could even say this. You'd say all convexity is we're talking about the sine of the second derivative. We'll get to that. But roughly speaking, that's what it means, right? Okay. So, and we say a function is concave if minus f is convex, right? That means it curves down.","zh":"它可以有零曲率，对吧？那么这就像是一个仿射函数。但凸性意味着非负曲率。或者你甚至可以说，所有凸性都是在讨论二阶导数的正弦。我们会讲到这一点。但大致来说，这就是它的含义，对吧？好的。我们说一个函数是凹函数，如果负的 f 是凸函数，对吧？这意味着它向下弯曲。","start":1690.08,"end":1714.86}],"notes":["本段讲解了凸函数的定义，强调了定义域必须是凸集，并且函数图像上的任意弦必须位于图像上方。这是凸函数的核心性质之一。","讲者提到凸函数的几何直观，即非负曲率，这与二阶导数的符号有关。虽然讲者提到‘sine of the second derivative’，但可能是指二阶导数的符号，而非正弦函数。","讲者还指出，如果一个函数是凸函数，那么其负函数就是凹函数，这为后续讨论凹函数提供了基础。","讲者通过举例说明了凸函数的直观意义，即在定义域内任意两点之间的线段上的函数值不大于该线段连接的函数值，这与弦位于图像上方的性质一致。","讲者提到‘chord’这一术语，可能来自古希腊语，但具体来源未详细说明，这表明该术语在数学中已有悠久历史。","讲者强调了凸函数与凹函数之间的关系，即凹函数是凸函数的负函数，这为后续讨论凸优化问题中的目标函数和约束函数提供了理论基础。"],"formulas":[],"uncertainties":["sine of the second derivative"],"diagram":"none","start":1535.94,"end":1714.86,"asr_flags":[],"math_clarifications":["原文未提及二阶导数或曲率的概念，因此无法核定该公式是否适用。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1535.94,"text":"which is feasible. Right. And so this is just a made up thing with like, you know, fuel and labor. I mean, it's silly, but there it is. And it said we can make we can get away. We can produce what we need to any point in with any point in here. And I mean, we're getting a little bit ahead of ourselves, but we can talk. We could talk about this if we decide that. I mean, here I'd call them fuel and labor, but it doesn't matter if we decide that each of these sort of has value."},{"start":1561.1,"text":"Positive value, not negative value. Now, what that tells you is kind of everything down and to the left is better. Because, for example, yeah, let's see. If you took this point and you said, you say, thank you for your order. Here's how I'm going to run my business. Okay, and you take this point. Anybody have a comment about that? What?"},{"start":1587.29,"text":"Yeah, I heard the word. It's good. We'll get to it later. It's not efficient. Or I'll tell you, the technical term for that is, that would be a stupid choice. That's the technical term. Because you'd say, why would you run it like that? Like, excuse me, but this is silly. If you're going to do that, why not do this? And I can make the exact same stuff, and I'll use less fuel and less labor. And some would, I don't know what they would say about that, and they'd say,"},{"start":1613.72,"text":"Yeah, but how do you know it's better? I haven't told you the price of fuel and labor. And you go, dude, as long as they're positive, this is better. OK, everybody got this? So we'll get to all this. And you can see that these are just concepts of efficiency and minimal points. And one name for this is Pareto optimal. And again, we'll come back to this later in quite a lot of detail. But this is things you've seen, I think, or things you've heard of. OK, now we're going to jump into convex functions."},{"start":1645.34,"text":"And, you know, first I'll just say what a convex function is. So a convex function is a function from Rn to R. It's got a domain. That means that's all the points for which F is defined. That's the domain. Okay?"},{"start":1660.92,"text":"And the domain has to be convex. And then it has to satisfy this inequality. And what that inequality says is, I mean, there's some weird terms, but I forget what people call this. But this is the graph of the function here. And I think, oh, this is called a chord, I think. That's like some ancient, you know, comes from ancient Greek or something. So that's a chord of the function. And what it says is the chord lies above the graph, right? Or I like to think of it, it has non-negative curvature, right?"},{"st
