</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：AI领域的职业建议 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v056.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v056","title":"斯坦福CS230：AI领域的职业建议","course":"深度学习","pages":[{"title":"AI职业建议与AI进展的乐观展望","segments":[{"id":0,"text":"What I want to do today is chat with you about career advice in AI.","zh":"今天我想和你们聊聊人工智能领域的职业建议。","start":0.69,"end":5.37},{"id":1,"text":"And in previous years, I used to do most of this lecture by myself. But what I thought I'd do today is I'll share just a few thoughts and then hand it over to my good friend, Lawrence Moroney, who I invited to speak here and kindly agreed to come all the way to San Francisco. He lives in Seattle, to share with us a very broad market landscape for what he's seeing in the job market, as well as tips for career, growing a career in AI.","zh":"在过去的几年里，我通常是独自完成这堂课的。但今天我想做的事情是，分享一些想法，然后把话题交给我的好朋友Lawrence Moroney。我邀请他来这里演讲，他很友善地同意从西雅图来到旧金山。他将与我们分享他在就业市场上看到的广阔前景，以及在人工智能领域发展职业生涯的建议。","start":6.25,"end":34.59},{"id":2,"text":"There were just two slides and then one more thought I want to share with you before I hand it over to Lawrence, which is, it really feels like the best opportunity, the best time ever to be building with AI and to building a career in AI.","zh":"在我把话题交给Lawrence之前，还想和你们分享两个幻灯片以及一个想法，那就是，现在真的是与人工智能一起构建和构建职业生涯的最佳时机和最佳机会。","start":36.19,"end":51.25},{"id":3,"text":"A few months ago, I know that in social media, traditional media, there are a few questions about, you know, is AI slowing down, right? People are saying, well, is GPT-5 that good? I think it's actually pretty good, but there are questions about, is AI progress slowing down? And I think part of the reason the question was even raised was because if a benchmark for AI is, you know, 100% is perfect answers, then if you make rapid progress, at some point you cannot get above 100% accuracy.","zh":"几个月前，我知道在社交媒体和传统媒体上，有一些关于人工智能是否放缓的问题。人们在问，GPT-5真的那么好吗？我认为它实际上表现得相当不错，但人们也在问，人工智能的进步是否放缓了？我认为之所以提出这个问题，是因为如果人工智能的基准是100%的完美答案，那么当你快速进步时，最终无法超过100%的准确性。","start":52.17,"end":81.03},{"id":4,"text":"one of the studies that most influenced my thinking was work done by this organization, METR, that studied...","zh":"最影响我思考的一项研究是由这个组织METR进行的，他们研究了……","start":81.98,"end":90.72},{"id":5,"text":"as time passes, how complex are the tasks that AI could do as measured by how long it takes a human to do that task. So a few years ago, maybe GPT-2 could do tasks that a human could do in like, you know, a couple of seconds, and then they could do tasks that took a human four seconds, then eight seconds, then like a, you know, a minute, two minutes, four minutes, and so on.","zh":"随着时间的推移，人工智能能够完成的任务的复杂程度，可以通过人类完成该任务所需的时间来衡量。几年前，GPT-2可能能够完成人类在几秒钟内就能完成的任务，然后是人类需要四秒的任务，接着是八秒的任务，再接着是一分钟、两分钟、四分钟，依此类推。","start":91.63,"end":116.07},{"id":6,"text":"and the study estimates that the length of task AI can do is doubling every seven months. And I think on this metric,","zh":"这项研究估计，人工智能能够完成的任务所需的时间每七个月就会翻一番。我认为在这个指标上，","start":116.73,"end":124.37},{"id":7,"text":"I feel optimistic that AI will continue making progress, meaning the complexity of tasks as measured by how long a human takes to do something is doubling rapidly. And same study with smaller dataset, same study argued that AI coding, the doubling time is even shorter, maybe like 70 days. So this code that used to take me, I don't know, 10 minutes to write, then 20 minutes to write, 40 minutes to write, and AI could do more and more of that.","zh":"我觉得对AI会继续取得进展感到乐观，这意味着任务的复杂度，以人类完成某事所需时间来衡量，正在迅速翻倍。同一项研究使用更小的数据集，也指出AI编程的翻倍时间甚至更短，可能只有70天。所以以前我写一段代码可能需要10分钟，然后20分钟，再40分钟，而AI可以完成越来越多这样的工作。","start":124.99,"end":154.41},{"id":8,"text":"And so the reasons I think this is a golden age to be building,","zh":"因此，我认为现在是构建AI的黄金时代，","start":154.97,"end":158.65},{"id":9,"text":"the best time we've ever seen is maybe two themes,","zh":"我们见过的最好的时代可能有两个主题，","start":158.87,"end":161.97},{"id":10,"text":"which are more powerful and faster.","zh":"即更强大和更快。","start":162.07,"end":163.27},{"id":11,"text":"So we can all, all of you in this room can now write software that is","zh":"因此，你们在座的每个人现在都可以编写软件，","start":164.15,"end":169.51},{"id":12,"text":"more powerful than what anyone on the planet could have built,","zh":"其功能比地球上任何人都曾构建的软件更强大，","start":169.51,"end":172.79},{"id":13,"text":"you know, like a year ago by using AI building blocks.","zh":"比如一年前，通过使用AI构建模块就能做到这一点。","start":172.89,"end":177.07},{"id":14,"text":"AI building blocks include large language models,","zh":"AI构建模块包括大型语言模型，","start":177.21,"end":179.05}],"notes":["本段主要讨论AI职业建议，并强调当前是AI发展的黄金时代。讲者提到，AI在任务复杂度和执行速度上的进展非常显著，例如AI完成任务所需时间的复杂度每七个月翻倍，而代码生成的翻倍时间甚至短至70天。这表明AI在多个领域正在快速进步。","讲者提到，AI的进展使得每个人都可以利用AI构建块（如大型语言模型）来编写比过去任何人能构建的软件更强大的软件。这表明AI工具的普及和强大，使得更多人能够参与AI开发。","讲者还提到，AI的进展使得任务复杂度的衡量标准（即人类完成任务所需时间）在不断增长，这表明AI在处理复杂任务方面的能力正在迅速提升。","讲者提到，AI的进展是当前AI发展的黄金时代的原因之一，即AI在性能和速度上的双重提升。这表明AI技术的快速发展为职业发展提供了前所未有的机会。","讲者提到，AI的进展使得AI能够完成越来越多的代码编写任务，这表明AI在软件开发领域的应用正在迅速扩展。","讲者提到，AI的进展使得AI能够完成的任务复杂度在不断增长，这表明AI在处理复杂任务方面的能力正在迅速提升。"],"formulas":[],"uncertainties":[],"diagram":"none","start":0.69,"end":179.05,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":0.69,"text":"What I want to do today is chat with you about career advice in AI."},{"start":6.25,"text":"And in previous years, I used to do most of this lecture by myself. But what I thought I'd do today is I'll share just a few thoughts and then hand it over to my good friend, Lawrence Moroney, who I invited to speak here and kindly agreed to come all the way to San Francisco. He lives in Seattle, to share with us a very broad market landscape for what he's seeing in the job market, as well as tips for career, growing a career in AI."},{"start":36.19,"text":"There were just two slides and then one more thought I want to share with you before I hand it over to Lawrence, which is, it really feels like the best opportunity, the best time ever to be building with AI and to building a career in AI."},{"start":52.17,"text":"A few months ago, I know that in social media, traditional media, there are a few questions about, you know, is AI slowing down, right? People are saying, well, is GPT-5 that good? I think it's actually pretty good, but there are questions about, is AI progress slowing down? And I think part of the reason the question was even raised was because if a benchmark for AI is, you know, 100% is perfect answers, then if you make rapid progress, at some point you cannot get above 100% accuracy."},{"start":81.98,"text":"But one of the studies that most influenced my thinking was work done by this organization, METR, that studied..."},{"start":91.63,"text":"as time passes, how complex are the tasks that AI could do as measured by how long it takes a human to do that task. So a few years ago, maybe GPT-2 could do tasks that a human could do in like, you know, a couple of seconds, and then they could do tasks that took a human four seconds, then eight seconds, then like a, you know, a minute, two minutes, four minutes, and so on."},{"start":116.73,"text":"and the study estimates that the length of task AI can do is doubling every seven months. And I think on this metric,"},{"start":124.99,"text":"I feel optimistic that AI will continue making progress, meaning the complexity of tasks as measured by how long a human takes to do something is doubling rapidly. And same study with smaller dataset, same study argued that AI coding, the doubling time is even shorter, maybe like 70 days. So this code that used to take me, I don't know, 10 minutes to write, then 20 minutes to write, 40 minutes to write, and AI could do more and more of that."},{"start":154.97,"text":"And so the reasons I think this is a golden age to be building,"},{"start":158.87,"text":"the best time we've ever seen is maybe two themes,"},{"start":162.07,"text":"which are more powerful and faster."},{"start":164.15,"text":"So we can all, all of you in this room can now write software that is"},{"start":169.51,"text":"more powerful than what anyone on the planet could have built,"},{"start":172.89,"text":"you know, like a year ago by using AI building blocks."},{"start":177.21,"text":"AI building blocks include large language models,"}],"speech_gaps":[],"frame":"../frames/v056/001.webp","frame_time":12.69},{"title":"AI职业建议：工具与生产力","segments":[{"id":15,"text":"RAC, regenerative workflows, voice AI,","zh":"RAC，再生工作流，语音AI，","start":179.41,"end":181.29},{"id":16,"text":"and of course, deep learning.","zh":"当然还有深度学习。","start":181.47,"end":182.59},{"id":17,"text":"It turns out that a lot of LLMs have a decent,","zh":"事实上，很多大语言模型都具备相当不错的","start":182.59,"end":185.55},{"id":18,"text":"at least basic understanding of deep learning.","zh":"至少基本的深度学习理解能力。","start":185.69,"end":187.95},{"id":19,"text":"So if you ever prompt one of the frontier models","zh":"所以如果你曾经提示其中一个前沿模型","start":188.21,"end":190.27},{"id":20,"text":"to implement a cutting edge neural network for you,","zh":"为你实现一个前沿的神经网络，","start":190.27,"end":192.97},{"id":21,"text":"like try prompting it to implement a transformer network for you,","zh":"比如尝试提示它为你实现一个变压器网络，","start":193.05,"end":196.11},{"id":22,"text":"it's actually not bad at,","zh":"它实际上在这一点上表现得还不错。","start":196.19,"end":197.67},{"id":23,"text":"at helping you use these building blocks to build software quickly.","zh":"在帮助你使用这些构建模块快速构建软件。","start":197.67,"end":200.79},{"id":24,"text":"And, and, and so we have very powerful building blocks","zh":"而且，而且，而且，我们拥有非常强大的构建模块","start":201.59,"end":205.81},{"id":25,"text":"that were very difficult or did not exist a year or two ago.","zh":"这些模块在过去一到两年内非常困难或根本不存在。","start":205.81,"end":209.29},{"id":26,"text":"And so you can now build software that does things that","zh":"因此，你现在可以构建能够完成","start":209.49,"end":211.29},{"id":27,"text":"that no one else on the planet, right,","zh":"那些地球上没有人，甚至","start":211.29,"end":213.45},{"id":28,"text":"even the most advanced teams on the planet could have done.","zh":"地球上最先进的团队也做不到的事情的软件。","start":213.55,"end":215.73},{"id":29,"text":"And then also with, um, uh,","zh":"此外，还有，嗯，嗯，","start":216.19,"end":218.65},{"id":30,"text":"AI coding, the speed with which you can get","zh":"借助AI编程，你能够以多快的速度获得","start":219.41,"end":222.11},{"id":31,"text":"software written is much faster than ever before.","zh":"编写的软件速度比以往任何时候都要快。","start":222.11,"end":225.17},{"id":32,"text":"And I've personally found that it's important to stay on","zh":"我个人发现，保持在工具的前沿非常重要。","start":225.45,"end":227.89},{"id":33,"text":"the frontier of tools because the tools for AI coding changes,","zh":"因为用于AI编码的工具会不断变化，","start":227.89,"end":231.43},{"id":34,"text":"right, I don't know, very, really rapidly.","zh":"对，我不知道，变化非常、非常迅速。","start":231.63,"end":233.81},{"id":35,"text":"So I feel like, um, uh, you know,","zh":"所以我觉得，嗯，嗯，你知道的，","start":234.01,"end":236.65},{"id":36,"text":"since several months ago,","zh":"从几个月前开始，","start":236.67,"end":238.41},{"id":37,"text":"my personal number one favorite too became Glocka.","zh":"我个人最喜欢的工具也变成了Glocka。","start":238.41,"end":241.91},{"id":38,"text":"moving on from some early generations, I think. And then I think since the release of GPT-5, I think OpenAI Codecs has actually made tremendous progress. And this morning, Gemini 3 was released, which, you know, haven't had time to play with yet, just this morning, right? Seems like another huge leap forward. So, I feel like if you ask me every three months what my personal favorite coding tool is, it actually probably changes, definitely every six months, but quite possibly every three months. And I find that, um,","zh":"我认为已经从一些早期版本中脱离了。然后我认为自从发布GPT-5以来，OpenAI的代码工具实际上取得了巨大的进展。今天早上，Gemini 3也发布了，你知道的，我还没来得及尝试，就是今天早上，对吧？看起来又是一个巨大的进步。因此，我觉得如果你每三个月问我一次我个人最喜欢的编码工具是什么，它实际上可能已经改变了，肯定是在六个月之内，但很可能每三个月就会改变一次。我发现，嗯，","start":242.9,"end":271.96},{"id":39,"text":"being half a generation behind in these tools means being, frankly, quite a bit less productive. And I know everyone says AI is moving so fast or engineering so fast, but AI coding tools of all the sectors in AI, many things maybe don't move as fast as the hype says it does, but AI coding tools is one sector where I see the pace of progress is, is tremendous and staying at the latest generation of tools rather than half generation behind, um, makes you more productive.","zh":"在这些工具上落后半个世代意味着，坦白说，你的生产力要低很多。我知道每个人都说AI发展得如此之快，或者工程进展如此之快，但AI领域的各种编码工具，很多东西可能并没有 hype 所说的那么快，但AI编码工具是其中一个领域，我看到其进展速度是巨大的。而不是落后半个世代，保持使用最新一代的工具，会让你更加高效。","start":272.56,"end":298.98},{"id":40,"text":"With our ability to build more powerful software and build it much faster than ever before, I think one piece of advice that I give now much more strongly now than even a year ago or two years ago is just go and build stuff, right? Take classes from Stanford, take online courses, and additionally, your opportunity to build things, and I think Lauren's going to talk about showing them to others, is greater than ever before. But there's one weird implication of this that...","zh":"凭借我们构建更强大软件并比以往任何时候都更快构建的能力，我认为我现在比一年前甚至两年前更加强烈地建议大家去构建东西。参加斯坦福的课程，参加在线课程，此外，你有机会去构建东西，我认为Lauren将会谈到展示给他人看，这比以往任何时候都更加重要。但有一个这种能力的奇怪影响是……","start":301.19,"end":328.17},{"id":41,"text":"is maybe not- is still, I don't know, more and more people are appreciating it but not widely known, which is the product management bottleneck. Which is that when it is increasingly easy to go from a clearly written software spec to a piece of code, then the bottleneck increasingly is deciding what to build or increasingly writing that clear spec for what you actually want to build.","zh":"可能是还没有——仍然是，我不确定，越来越多的人开始欣赏它，但尚未广泛为人所知，这就是产品管理瓶颈。也就是说，当从一个清晰的软件规格文档到一段代码的转换变得越来越容易时，瓶颈越来越多地体现在决定要构建什么，或者越来越多地体现在撰写你真正想要构建的清晰规格文档上。","start":328.99,"end":350.77}],"notes":["本段讨论了AI编码工具的快速发展及其对生产力的影响。讲者指出，AI编码工具的进步速度远超其他AI领域，因此保持使用最新工具非常重要。例如，讲者提到自己在几个月前将Glocka作为最喜欢的工具，但随后OpenAI Codecs在GPT-5发布后取得了显著进展，而最新的Gemini 3也带来了重大突破。这表明AI编码工具的更新迭代非常频繁，需要持续关注。","讲者强调，使用过时的工具会导致生产力下降。他提到，如果落后半个世代的工具，会明显影响效率。这说明在AI领域，工具的更新速度非常快，必须紧跟最新技术。","此外，讲者建议人们积极构建项目，并通过课程学习提升技能。他提到，现在比以往任何时候都有更多机会去实践和展示成果，这与AI工具的普及和易用性密切相关。","然而，讲者也指出，尽管AI工具让软件开发变得更容易，但产品管理瓶颈依然存在。即，当从明确的软件规格到代码的转换变得容易时，瓶颈更多地出现在决定要构建什么，或者撰写清晰的规格上。这表明，尽管技术进步，但决策和规划仍然是关键挑战。","讲者还提到，虽然AI工具的进展非常快，但并非所有AI领域都如此。他指出，AI编码工具是其中进展最快的领域之一，因此保持对最新工具的关注和使用是提高生产力的关键。","最后，讲者总结说，现在比以往任何时候都更应该去构建东西，无论是通过课程学习还是实际项目实践。这反映了AI工具的普及和易用性为个人和团队提供了前所未有的机会。"],"formulas":[],"uncertainties":["Codecs"],"diagram":"none","start":179.41,"end":350.77,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":179.41,"text":"RAC, regenerative workflows, voice AI,"},{"start":181.47,"text":"and of course, deep learning."},{"start":182.59,"text":"It turns out that a lot of LLMs have a decent,"},{"start":185.69,"text":"at least basic understanding of deep learning."},{"start":188.21,"text":"So if you ever prompt one of the frontier models"},{"start":190.27,"text":"to implement a cutting edge neural network for you,"},{"start":193.05,"text":"like try prompting it to implement a transformer network for you,"},{"start":196.19,"text":"it's actually not bad at,"},{"start":197.67,"text":"at helping you use these building blocks to build software quickly."},{"start":201.59,"text":"And, and, and so we have very powerful building blocks"},{"start":205.81,"text":"that were very difficult or did not exist a year or two ago."},{"start":209.49,"text":"And so you can now build software that does things that"},{"start":211.29,"text":"that no one else on the planet, right,"},{"start":213.55,"text":"even the most advanced teams on the planet could have done."},{"start":216.19,"text":"And then also with, um, uh,"},{"start":219.41,"text":"AI coding, the speed with which you can get"},{"start":222.11,"text":"software written is much faster than ever before."},{"start":225.45,"text":"And I've personally found that it's important to stay on"},{"start":227.89,"text":"the frontier of tools because the tools for AI coding changes,"},{"start":231.63,"text":"right, I don't know, very, really rapidly."},{"start":234.01,"text":"So I feel like, um, uh, you know,"},{"start":236.67,"text":"since several months ago,"},{"start":238.41,"text":"my personal number one favorite too became Glocka."},{"start":242.9,"text":"moving on from some early generations, I think. And then I think since the release of GPT-5, I think OpenAI Codecs has actually made tremendous progress. And this morning, Gemini 3 was released, which, you know, haven't had time to play with yet, just this morning, right? Seems like another huge leap forward. So, I feel like if you ask me every three months what my personal favorite coding tool is, it actually probably changes, definitely every six months, but quite possibly every three months. And I find that, um,"},{"start":272.56,"text":"being half a generation behind in these tools means being, frankly, quite a bit less productive. And I know everyone says AI is moving so fast or engineering so fast, but AI coding tools of all the sectors in AI, many things maybe don't move as fast as the hype says it does, but AI coding tools is one sector where I see the pace of progress is, is tremendous and staying at the latest generation of tools rather than half generation behind, um, makes you more productive."},{"start":301.19,"text":"With our ability to build more powerful software and build it much faster than ever before, I think one piece of advice that I give now much more strongly now than even a year ago or two years ago is just go and build stuff, right? Take classes from Stanford, take online courses, and additionally, your opportunity to build things, and I think Lauren's going to talk about showing them to others, is greater than ever before. But there's one weird implication of this that..."},{"start":328.99,"text":"is maybe not- is still, I don't know, more and more people are appreciating it but not widely known, which is the product management bottleneck. Which is that when it is increasingly easy to go from a clearly written software spec to a piece of code, then the bottleneck increasingly is deciding what to build or increasingly writing that clear spec for what you actually want to build."}],"speech_gaps":[],"frame":"../frames/v056/002.webp","frame_time":191.41},{"title":"AI领域职业建议：工程师与产品经理的角色演变","segments":[{"id":42,"text":"When I'm building software, I often think of going through a loop where we'll write some software, write some code, show it to users to get user feedback. I think of this as a PM or product management work, and then based on the user feedback, I'll, you know, revise my view on what users like, what they don't like, this UI is too difficult, they want this feature, they don't want that feature, and change my conception of what to build, and then go around this loop many times to hopefully iterate to other product that users love.","zh":"当我构建软件时，我经常想到一个循环过程，我们会编写一些软件，编写一些代码，展示给用户以获取用户反馈。我认为这属于产品经理或产品管理工作，然后根据用户反馈，我会修订我对用户喜欢什么、不喜欢什么的看法，比如这个界面太难了，他们想要这个功能，不要那个功能，从而改变我想要构建的东西的概念，然后多次绕这个循环，希望迭代出用户喜爱的产品。","start":351.63,"end":378.93},{"id":43,"text":"And because of AI coding, the process of building software has become much cheaper and much faster than before. But that ironically shifts the bottleneck to deciding what to build. Um, so, um, some weird trends I'm seeing.","zh":"由于AI编程，构建软件的过程变得比以前便宜和快速得多。但讽刺的是，这将瓶颈转移到了决定要构建什么上。嗯，所以，嗯，我看到一些奇怪的趋势。","start":379.8,"end":398.69},{"id":44,"text":"In Silicon Valley and in many tech companies, people have often talked about an engineer to a product manager, engineer to PM ratio. And you take these ratios with grain of salt because they're very over the place. But you hear companies talk about an engineer to PM ratio of four to one or seven to one or eight to one. This idea that one product manager writing product specs can keep four to eight or some number like that. Engineer is busy.","zh":"在硅谷和许多科技公司中，人们经常谈论工程师与产品经理的比例。但你要对这些比例持保留态度，因为它们差异很大。但你听到公司谈论工程师与产品经理的比例为四比一、七比一或八比一。这个想法是，一个产品经理可以撰写产品规格，从而管理四到八名或类似数量的工程师，工程师很忙。","start":399.48,"end":425.18},{"id":45,"text":"But because engineering is speeding up, whereas product management is not sped up as far, as much by AI as engineering, um, I'm seeing the inch to PM ratio trending downwards, maybe even two or one to one, right? So some teams I work with, their proposed headcount was like one PM to one engineer, which is a, a, a ratio unlike almost all Silicon Valley, so the traditional Silicon Valley companies. And the other thing I'm seeing is that, um, engineers can also,","zh":"但因为工程速度在加快，而产品管理并没有被AI提升到同样的程度，我看到工程师与产品经理的比例正在下降，甚至可能降到二比一或一比一。所以，我合作的一些团队，他们提议的编制是每个产品经理对应一个工程师，这与几乎所有硅谷公司的传统比例不同。另外，我看到的是，工程师也可以，","start":426.06,"end":454.62},{"id":46,"text":"shape products can move really fast where you go one step further, take the engineer, take the PM and collapse them into a single human. And I find that, um, uh, there are definitely engineers that like doing engineering work that, you know, don't enjoy talking to users and having that more human empathetic side of work. But I'm finding increasingly that the subset of engineers that learn to","zh":"塑造产品可以快速推进，你只需再进一步，将工程师和产品经理合并为一个人。我发现，嗯，嗯，确实有一些工程师喜欢做工程工作，他们不喜欢与用户交流，也不喜欢更具人性化同理心的工作。但越来越多的工程师开始学习","start":455.47,"end":478.97},{"id":47,"text":"talk to users, get feedback, develop deep empathy for users so that they can make decisions about what to build. Those engineers are also the fastest moving people that I'm seeing in Silicon Valley today. And I feel like at the earliest stage of my career, one thing I regretted for years was in one of the roles I had, I went to try to convince a bunch of engineers to do more product work. And I actually...","zh":"与用户交流，获取反馈，培养对用户的深刻同理心，以便能够决定要构建什么。这些工程师也是我今天在硅谷看到的行动最快的群体。在我职业生涯的早期阶段，有一件事我后悔了多年，就是在某个角色中，我试图说服一群工程师做更多的产品工作。而实际上……","start":479.59,"end":506.57},{"id":48,"text":"made a bunch of really good engineers feel bad for not being good product managers. And that was a mistake I made, regretted that for years, I just shouldn't have done that. And part of me feels like I'm now going back to repeat that exact same mistake. Um, having said that, I find that, um,","zh":"让一些非常优秀的工程师因为不是好的产品经理而感到难过。这是我犯的一个错误，后悔了多年，我本不应该这样做。有一部分我感觉自己现在又在重复同样的错误。不过，尽管如此，我发现……","start":506.92,"end":522.86}],"notes":["本段讲授了软件开发过程中工程师与产品经理之间的协作循环，强调了通过用户反馈不断迭代产品的重要性。讲者提到，随着AI编码技术的发展，软件开发的速度和成本大幅降低，但这也使得产品决策成为新的瓶颈。","讲者指出，在硅谷和许多科技公司中，工程师与产品经理的比例（engineer to PM ratio）是一个常见话题，但这些比例因公司而异，通常为4:1或7:1等。随着工程效率的提升，而产品管理未被AI显著加速，这一比例正在下降，甚至可能达到1:1。","讲者提到，一些团队正在尝试将工程师和产品经理的角色合并为一个角色，即由单一工程师承担产品设计和用户沟通的任务。这种趋势使得部分工程师能够更快地推动产品开发。","讲者反思了自己早期职业生涯中，试图说服工程师承担更多产品管理工作时的错误。他意识到，这种做法让一些优秀的工程师感到不适，因为并非所有人都喜欢与用户沟通和进行情感共鸣的工作。","讲者提到，那些学会与用户沟通、获取反馈并建立用户同理心的工程师，往往在硅谷中发展得更快。这表明，产品管理技能对于工程师的职业发展具有重要影响。","讲者最后提到，他意识到自己可能正在重复过去的错误，即试图让工程师承担更多产品管理工作。这反映出他在职业发展过程中对角色分工和团队协作的深刻反思。"],"formulas":[],"uncertainties":[],"diagram":"none","start":351.63,"end":522.86,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":351.63,"text":"When I'm building software, I often think of going through a loop where we'll write some software, write some codes, show it to users to get user feedback. I think of this as a PM or product management work, and then based on the user feedback, I'll, you know, revise my view on what users like, what they don't like, this UI is too difficult, they want this feature, they don't want that feature, and change my conception of what to build, and then go around this loop many times to hopefully iterate to other product that users love."},{"start":379.8,"text":"And because of AI coding, the process of building software has become much cheaper and much faster than before. But that ironically shifts the bottleneck to deciding what to build. Um, so, um, some weird trends I'm seeing."},{"start":399.48,"text":"In Silicon Valley and in many tech companies, people have often talked about an engineer to a product manager, engineer to PM ratio. And you take these ratios with grain of salt because they're very over the place. But you hear companies talk about an engineer to PM ratio of four to one or seven to one or eight to one. This idea that one product manager writing product specs can keep four to eight or some number like that. Engineer is busy."},{"start":426.06,"text":"But because engineering is speeding up, whereas product management is not sped up as far, as much by AI as engineering, um, I'm seeing the inch to PM ratio trending downwards, maybe even two or one to one, right? So some teams I work with, their proposed headcount was like one PM to one engineer, which is a, a, a ratio unlike almost all Silicon Valley, so the traditional Silicon Valley companies. And the other thing I'm seeing is that, um, engineers can also,"},{"start":455.47,"text":"shape products can move really fast where you go one step further, take the engineer, take the PM and collapse them into a single human. And I find that, um, uh, there are definitely engineers that like doing engineering work that, you know, don't enjoy talking to users and having that more human empathetic side of work. But I'm finding increasingly that the subset of engineers that learn to"},{"start":479.59,"text":"talk to users, get feedback, develop deep empathy for users so that they can make decisions about what to build. Those engineers are also the fastest moving people that I'm seeing in Silicon Valley today. And I feel like at the earliest stage of my career, one thing I regretted for years was in one of the roles I had, I went to try to convince a bunch of engineers to do more product work. And I actually..."},{"start":506.92,"text":"made a bunch of really good engineers feel bad for not being good product managers. And that was a mistake I made, regretted that for years, I just shouldn't have done that. And part of me feels like I'm now going back to repeat that exact same mistake. Um, having said that, I find that, um,"}],"speech_gaps":[],"frame":"../frames/v056/003.webp","frame_time":363.63},{"title":"职业发展与社交网络的重要性","segments":[{"id":49,"text":"uh, the fact that, you know, I can write code, but also talk to users to shape what to do, that lets me and the engineers that can do this go much faster. So I think it may be worth taking another look at whether engineers can, um, do a bit more of this work. Uh, because then if you're not waiting for someone else to take the product to customers, you can just write code, have a gut for what to do next, and iterate. That pace, that velocity of execution is much faster.","zh":"嗯，我能够编写代码，同时也能与用户交流以确定该做什么，这让我和那些能够做到这一点的工程师们能够更快地推进工作。因此，我认为值得再考虑一下，工程师是否可以多做一些这样的工作。嗯，因为这样你就不用等待别人将产品带给客户，你可以直接编写代码，凭直觉判断下一步该做什么，并进行迭代。这种执行的速度和效率要快得多。","start":523.4,"end":549.1},{"id":50,"text":"And then, before I hand over to Lawrence, just one last thing I want to share, which is,","zh":"在将话题交给Lawrence之前，我想再分享一点，那就是，","start":550.27,"end":555.71},{"id":51,"text":"In terms of navigating your career, I think one of the most strong predictors for your speed of learning and for your level of success is the people you surround yourself with. I think we're all social creatures. We all learn from people around us. And it turns out that there are studies in sociology that show that if your five closest friends are smokers,","zh":"就职业发展而言，我认为对你学习速度和成功程度的最强预测因素之一是你所结识的人。我认为我们都是社会性动物。我们都从周围的人身上学习。事实上，社会学的研究表明，如果你最亲近的五个朋友都是吸烟者，那么你吸烟的可能性就非常高。请不要吸烟。这只是个例子。","start":556.91,"end":580.45},{"id":52,"text":"the odds of you being a smoker is pretty much high. Please don't smoke. It's just an example.","zh":"我不记得有任何研究显示，如果你最亲近的五到十个朋友都是非常努力、有决心的人，能够快速学习，致力于让AI世界变得更美好，那么你也会更有可能这样做。但我觉得这几乎可以肯定是真的。因此，我们都会受到周围人的启发。如果你能找到一个优秀的团队一起工作，这将有助于推动你前进。事实上，在斯坦福，我感到非常幸运，对吧？这里的学生群体非常优秀，教授团队也非常出色。嗯，而且我认为我们幸运的是斯坦福拥有良好的连接纽带。","start":580.94,"end":585.86},{"id":53,"text":"I don't know of any study showing that if your five or ten closest friends are really hardworking, determined people, you know, learning quickly, trying to make the world a better place of AI, that you are more likely to do that too. But it's one of those things that I think is almost certainly true. So all of us are inspired by the people around us. If you're able to find a good group of people to work with, that helps drive you forward. In fact, here at Stanford, I feel very fortunate, right? Fantastic.","zh":"我不认识任何研究显示，如果你最亲近的五到十个朋友都是非常努力、有决心的人，他们学习速度快，努力让世界变得更美好，比如在AI领域，那么你也会更有可能这么做。但我觉得这几乎可以肯定是真的。我们所有人都会被身边的人所激励。如果你能找到一个好团队一起工作，这会推动你前进。事实上，在斯坦福，我感到非常幸运，对吧？非常棒。","start":587.44,"end":614.62},{"id":54,"text":"student body, fantastic group of faculty. Um, and then the other thing that I, I, I think we're fortunate to have at Stanford is our connective tissue. So, you know, candidly, a lot of the, um, people working at a lot of the cutting edge AI labs, the frontier labs, they were former students of a lot of","zh":"学生群体，非常棒的教师团队。嗯，还有另一件事，我觉得我们幸运的是斯坦福拥有的这种连接纽带。所以，坦白说，很多在很多前沿AI实验室、尖端实验室工作的人，他们曾经都是很多","start":615.42,"end":635.02},{"id":55,"text":"different Stanford faculty. And so that rich connective tissue, you know, candidly means that at Stanford, we often find out about a lot of stuff that's not widely known because of the relationships, their friendships, and when some company does something, you know, one of my friends in the faculty will call up someone in the company and say, hey, that's weird. Does this really work? And so that rich connective tissue means that we're all","zh":"不同斯坦福的教职员工。因此，这种丰富的连接网络，坦白说，意味着在斯坦福，我们经常了解到很多不为人知的事情，因为这些关系、他们的友谊，以及当某家公司做了什么事情时，你知道的，我的一位教职员工朋友会打电话给公司里的人，说，嘿，这很奇怪。这真的有效吗？因此，这种丰富的连接网络意味着我们都在","start":635.34,"end":658.48},{"id":56,"text":"Just as we try to pull our friends forward, our friends also pull us forward with the knowledge and the connective tissue and this know-how of bleeding as AI, which unfortunately is not all published on the internet at this moment in time. So I think while you're at Stanford, make those friends form that rich connective tissue. And there have been a lot of times that, just for myself, where...","zh":"就像我们试图拉我们的朋友向前一样，我们的朋友也通过他们的知识、连接网络以及这种关于AI的前沿技术将我们拉向前。不幸的是，这些内容目前还没有全部发布在互联网上。因此，我认为当你在斯坦福的时候，要结交朋友，形成这种丰富的连接网络。而且，就我自己而言，有很多时候，","start":658.89,"end":679.51}],"notes":["本段讨论了职业发展中的关键因素，即与谁共事对学习速度和成功程度的影响。讲者指出，社交网络和周围人的行为对个人发展有重要影响，例如，如果周围人吸烟，个人吸烟的可能性也会增加。这表明社交环境对个人行为有显著影响。","讲者进一步强调，如果周围人是努力工作、有决心、快速学习并致力于改善AI世界的人，个人也更可能效仿他们的行为。虽然没有直接的研究支持，但讲者认为这种现象几乎可以确定是真实的。","讲者提到，斯坦福大学的社交网络（connective tissue）是其独特优势之一。许多在前沿AI实验室工作的人员都是斯坦福的前学生，这种紧密的联系使得斯坦福能够获取到其他地方不为人知的信息。","这种社交网络不仅帮助斯坦福的成员获取信息，还通过朋友之间的互动和知识共享，推动彼此的进步。讲者指出，这种知识和经验在互联网上尚未完全公开，因此需要通过人际网络来获取。","讲者鼓励学生在斯坦福期间建立良好的人际关系，形成丰富的社交网络，以促进个人和职业的发展。这种社交网络不仅有助于获取信息，还能推动彼此的成长。","讲者以自身为例，说明了社交网络对个人发展的重要性，并强调了在斯坦福期间建立良好人际关系的必要性。"],"formulas":[],"uncertainties":["bleeding as AI"],"diagram":"none","start":523.4,"end":679.51,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":523.4,"text":"uh, the fact that, you know, I can write code, but also talk to users to shape what to do, that lets me and the engineers that can do this go much faster. So I think it may be worth taking another look at whether engineers can, um, do a bit more of this work. Uh, because then if you're not waiting for someone else to take the product to customers, you can just write code, have a gut for what to do next, and iterate. That pace, that velocity of execution is much faster."},{"start":550.27,"text":"And then, before I hand over to Lawrence, just one last thing I want to share, which is,"},{"start":556.91,"text":"In terms of navigating your career, I think one of the most strong predictors for your speed of learning and for your level of success is the people you surround yourself with. I think we're all social creatures. We all learn from people around us. And it turns out that there are studies in sociology that show that if your five closest friends are smokers,"},{"start":580.94,"text":"the odds of you being a smoker is pretty much high. Please don't smoke. It's just an example."},{"start":587.44,"text":"I don't know of any study showing that if your five or ten closest friends are really hardworking, determined people, you know, learning quickly, trying to make the world a better place of AI, that you are more likely to do that too. But it's one of those things that I think is almost certainly true. So all of us are inspired by the people around us. If you're able to find a good group of people to work with, that helps drive you forward. In fact, here at Stanford, I feel very fortunate, right? Fantastic."},{"start":615.42,"text":"student body, fantastic group of faculty. Um, and then the other thing that I, I, I think we're fortunate to have at Stanford is our connective tissue. So, you know, candidly, a lot of the, um, people working at a lot of the cutting edge AI labs, the frontier labs, they were former students of a lot of"},{"start":635.34,"text":"different Stanford faculty. And so that rich connective tissue, you know, candidly means that at Stanford, we often find out about a lot of stuff that's not widely known because of the relationships, their friendships, and when some company does something, you know, one of my friends in the faculty will call up someone in the company and say, hey, that's weird. Does this really work? And so that rich connective tissue means that we're all"},{"start":658.89,"text":"Just as we try to pull our friends forward, our friends also pull us forward with the knowledge and the connective tissue and this know-how of bleeding as AI, which unfortunately is not all published on the internet at this moment in time. So I think while you're at Stanford, make those friends form that rich connective tissue. And there have been a lot of times that, just for myself, where..."}],"speech_gaps":[],"frame":"../frames/v056/004.webp","frame_time":535.4},{"title":"斯坦福CS230：AI领域的职业建议","segments":[{"id":57,"text":"Frankly, I was thinking of going in some technical direction. I'd have, you know, one or two phone calls with someone, right, really close to research, either a Stanford researcher or someone in the frontier lab. They would share something with me, right, that I didn't know before, and that changes the way I choose the technical architecture of a project. So I find that that group of friends you surround yourself with, those little pieces of information, try this, don't do that, that's just hype, ignore the PR, you know, don't actually try that thing. Those things,","zh":"坦白说，我当时在考虑进入某个技术方向。我会和一些人进行一两次电话交流，对吧，这些人非常接近研究领域，要么是斯坦福的研究人员，要么是在前沿实验室工作的人。他们会和我分享一些我之前不知道的信息，这会改变我选择项目技术架构的方式。因此，我发现你所围绕的那群朋友，那些小片段的信息，尝试这个，不要做那个，那是炒作，忽略公关，你知道的，不要真的尝试那个东西。这些事情","start":680.35,"end":707.83},{"id":58,"text":"make a big difference in your ability to steer the direction of your projects. So while you're at Stanford, take advantage of that. This connective tissue that Stanford has is actually really unique. There are lots of great universities in the world, but at this moment in time, I don't think there's any, I don't want to sound like I'm doing PR for Stanford now, but I really think there's no university in the world that is as privileged as Stanford at this moment in time in terms of the richness of the connective tissue to all of the leading AI.","zh":"对你的能力在项目方向上的把控有很大影响。所以在你还在斯坦福的时候，要充分利用这一点。斯坦福拥有的这种连接组织其实是非常独特的。世界上有很多优秀的大学，但在这个时候，我不认为有任何一所大学像斯坦福这样，在与所有领先AI领域的连接组织的丰富性方面如此有特权。","start":709.02,"end":737.46},{"id":59,"text":"groups. But to me, that's also that we're lucky here to have a wonderful community of people to work with and learn from. And for you too, if you apply for jobs, the thing that is much more important for your career success would be if you go to a company, it'll be the people you work with day to day, right? So here's one story that I've told in previous classes and I repeat, which is","zh":"对我来说，这也是我们在这里幸运地拥有一个很棒的社区，可以一起工作和学习。对你来说也是如此，如果你申请工作，对你职业生涯成功更为重要的事情是，如果你去一家公司，你每天工作的同事是谁，对吧？这里有一个我之前在其他课程中讲过并且重复的故事，就是","start":738.17,"end":766.09},{"id":60,"text":"there's a Stanford student that I knew just many years ago that, um, I knew and they did really good work at Stanford. I thought they were a high flyer. And they applied for a job at the company and they got a job offer from one of the companies with, you know, a hot AI brand. Um,","zh":"多年前我认识的一位斯坦福学生，嗯，我知道他并在斯坦福做了非常好的工作。我认为他是个高飞的人才。他申请了一家公司的职位，并收到了一家拥有热门AI品牌的公司的录用通知。嗯，","start":766.94,"end":782.96},{"id":61,"text":"This company refused to tell him which team he would join. They said, oh, come sign up for a job. There's a rotation system, matching system, blah, blah, blah. Sign up the dotted line first. Then we'll figure out what's a good project for you.","zh":"这家公司拒绝告诉他他会加入哪个团队。他们说，哦，来签个职位。有一个轮岗系统、匹配系统，等等。先签上虚线，然后我们会为你找到一个合适的项目。","start":783.65,"end":796.51},{"id":62,"text":"partly because it's a good company. His parents are proud of him for getting a job in this company. This student joined this company hoping to work on an exciting AI project. And after he signed on the dotted line, he was assigned to work on the backend Java payment processing system of the company.","zh":"部分原因是因为这是一家不错的公司。他的父母为他能在这家公司工作感到自豪。这位学生加入这家公司是希望参与一个激动人心的AI项目。然而，在他签署合同后，他被分配到公司后端的Java支付处理系统上工作。","start":798.09,"end":814.63},{"id":63,"text":"Nothing against anyone that wants to do Java backend payment processing systems. I think they're great. But this is an AI students that did not get matched to an AI project. And so for about a year, he was really frustrated and he actually left this company after about a year. The unfortunate thing is I told this story in CS230 some years back. And then after I was already telling the story in this class,","zh":"我并不是在贬低任何想从事Java后端支付处理系统工作的人。我认为他们非常棒。但这位是AI学生，却没有被匹配到AI项目上。因此，大约一年的时间里，他感到非常沮丧，实际上在一年后离开了这家公司。不幸的是，我几年前在CS230课上讲过这个故事。然后在我已经在这一节课上讲述这个故事之后，","start":815.5,"end":842.02},{"id":64,"text":"A couple of years later, another student in CS230 went through the same experience with the same company, not Java backend payment processing, but a different project. And I think this effect of...","zh":"几年后，又有另一位CS230的学生经历了同样的经历，同样是这家公司，不是Java后端支付处理系统，而是另一个不同的项目。我认为这种效应……","start":843.11,"end":855.97}],"notes":["本段主要讲述在斯坦福大学学习期间，如何通过与研究者和前沿实验室人员的交流，获取关键信息，从而影响项目的技术架构选择。这种信息交流对项目方向的把控有重要影响。","斯坦福大学的‘连接组织’（connective tissue）是其独特之处，这种组织网络在当前AI领域中非常丰富，使得斯坦福在AI研究和职业发展方面具有独特优势。","在职业选择中，与同事的日常互动比公司品牌更重要。通过一个斯坦福学生的例子，说明了即使进入知名公司，如果未被分配到合适的项目，也可能导致职业挫败。","该学生原本希望参与AI项目，但被分配到Java后端支付系统，这与他的职业目标不符，最终导致他离开公司。","这一经历被多次提及，说明这种现象在AI领域中具有普遍性，强调了在选择工作时，应关注实际项目与个人兴趣的匹配度。","讲者通过这个故事强调了在职业发展中，与同事的互动和项目匹配度的重要性，而不是仅仅依赖公司品牌或声誉。"],"formulas":[],"uncertainties":[],"diagram":"none","start":680.35,"end":855.97,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":680.35,"text":"Frankly, I was thinking of going in some technical direction. I'd have, you know, one or two phone calls with someone, right, really close to research, either a Stanford researcher or someone in the frontier lab. They would share something with me, right, that I didn't know before, and that changes the way I choose the technical architecture of a project. So I find that that group of friends you surround yourself with, those little pieces of information, try this, don't do that, that's just hype, ignore the PR, you know, don't actually try that thing. Those things,"},{"start":709.02,"text":"make a big difference in your ability to steer the direction of your projects. So while you're at Stanford, take advantage of that. This connective tissue that Stanford has is actually really unique. There are lots of great universities in the world, but at this moment in time, I don't think there's any, I don't want to sound like I'm doing PR for Stanford now, but I really think there's no university in the world that is as privileged as Stanford at this moment in time in terms of the richness of the connective tissue to all of the leading AI."},{"start":738.17,"text":"groups. But to me, that's also that we're lucky here to have a wonderful community of people to work with and learn from. And for you too, if you apply for jobs, the thing that is much more important for your career success would be if you go to a company, it'll be the people you work with day to day, right? So here's one story that I've told in previous classes and I repeat, which is"},{"start":766.94,"text":"there's a Stanford student that I knew just many years ago that, um, I knew and they did really good work at Stanford. I thought they were a high flyer. And they applied for a job at the company and they got a job offer from one of the companies with, you know, a hot AI brand. Um,"},{"start":783.65,"text":"This company refused to tell him which team he would join. They said, oh, come sign up for a job. There's a rotation system, matching system, blah, blah, blah. Sign up the dotted line first. Then we'll figure out what's a good project for you."},{"start":798.09,"text":"partly because it's a good company. His parents are proud of him for getting a job in this company. This student joined this company hoping to work on an exciting AI project. And after he signed on the dotted line, he was assigned to work on the backend Java payment processing system of the company."},{"start":815.5,"text":"Nothing against anyone that wants to do Java backend payment processing systems. I think they're great. But this is an AI students that did not get matched to an AI project. And so for about a year, he was really frustrated and he actually left this company after about a year. The unfortunate thing is I told this story in CS230 some years back. And then after I was already telling the story in this class,"},{"start":843.11,"text":"A couple of years later, another student in CS230 went through the same experience with the same company, not Java backend payment processing, but a different project. And I think this effect of..."}],"speech_gaps":[],"frame":"../frames/v056/005.webp","frame_time":692.35},{"title":"职业建议：选择团队与责任","segments":[{"id":65,"text":"trying to figure out who you'd be actually working with day-to-day and making sure you're surrounded by people that inspire you and work on exciting projects. I think that's important. And if you're completely candid, if a company refuses to tell you what team you'd be assigned to, you know, that does raise a question in my mind, right, of whether or not, you know, what will happen. And I think that instead of working for the company with the hottest brand","zh":"试着弄清楚你每天实际会和谁一起工作，并确保你身边有能激励你、从事令人兴奋项目的人。我认为这一点很重要。如果你完全坦诚地说，如果一家公司拒绝告诉你你会被分配到哪个团队，这在我心中确实会引发一些疑问，你知道吗，会发生什么。我认为与其选择拥有最热门品牌的公司，不如选择一个拥有真正优秀团队的公司。","start":856.82,"end":880.3},{"id":66,"text":"sometimes if you find a really good team with really, you know, hardworking, knowledgeable, smart people trying to do Google AI, but the company logo just isn't as hot, I think that often means you actually learn faster and progress your career better because it is after all, we don't learn from the, you know,","zh":"有时候如果你发现一个非常优秀的团队，团队成员非常努力、知识渊博、聪明，并且致力于实现谷歌AI的目标，但公司的标志并不是那么热门，我认为这通常意味着你实际上能更快地学习并更好地推进你的职业生涯，毕竟，我们不是从公司标志的兴奋感中学习，而是从你每天打交道的人身上学习。因此，我建议你们在决定做什么时，把这一点作为一项巨大的标准。","start":881.14,"end":898.9},{"id":67,"text":"excitement of the company logo when you walk through the door, you learn from the people you deal with day-to-day. So I just urge you to use that as a, as a huge criteria, um, for your selection process for, for what you decide to do, right? Um, and, uh, I think, um, and, and, and then, uh, but I think number one, uh, on, on my","zh":"所以，我建议你们在决定做什么时，把这一点作为一项巨大的标准。嗯，而且，而且，而且，然后，嗯，我认为，嗯，在我，嗯，在我","start":899.66,"end":919.92},{"id":68,"text":"is it's become much easier than ever before","zh":"是的，现在比以往任何时候都更容易","start":921.46,"end":924.24},{"id":69,"text":"to build powerful software faster.","zh":"快速构建强大的软件。","start":924.24,"end":926.62},{"id":70,"text":"And what that means is do be responsible,","zh":"这意味着要负责任，","start":927.18,"end":929.32},{"id":71,"text":"don't build software that hurts others.","zh":"不要开发伤害他人的软件。","start":929.6,"end":931.08},{"id":72,"text":"And at the same time,","zh":"同时，","start":931.86,"end":933.3},{"id":73,"text":"there are so many things that each of you can build.","zh":"你们每个人都可以创造很多东西。","start":933.34,"end":936.24},{"id":74,"text":"And what I find is the number of ideas out in the world","zh":"我发现世界上存在的想法数量","start":936.52,"end":939.0},{"id":75,"text":"is much greater than the number of people","zh":"远多于具备能力去实现它们的人数。","start":939.0,"end":940.9},{"id":76,"text":"with the skill to build them.","zh":"因此，我知道找到工作对刚毕业的大学生来说","start":940.9,"end":942.1},{"id":77,"text":"So I know that finding jobs has gotten tougher","zh":"变得更加困难了。","start":942.3,"end":944.86},{"id":78,"text":"for fresh college grads.","zh":"同时，很多团队","start":944.86,"end":945.96},{"id":79,"text":"At the same time, a lot of teams,","zh":"都找不到足够多的有技能的人，对吧？","start":945.98,"end":947.5},{"id":80,"text":"you just can't find enough skilled people, right?","zh":"你就是找不到足够多有技能的人，对吧？","start":947.72,"end":950.22},{"id":81,"text":"And so there are a lot of projects in the world that if you don't build it, I think","zh":"因此，世界上有很多项目，如果你不去做，我想","start":950.22,"end":955.38},{"id":82,"text":"no one else will build it either.","zh":"也不会有人去做了。","start":955.38,"end":956.74},{"id":83,"text":"So you don't need to, as long as you don't harm others, to be responsible, there are","zh":"所以你不需要，只要你不伤害他人，就无需承担责任，","start":957.36,"end":962.32},{"id":84,"text":"a lot of things that you don't need to wait for permission, you don't need to wait for","zh":"有很多事情你不需要等待许可，也不需要等待","start":962.32,"end":965.02},{"id":85,"text":"someone else to do it first and then you do it.","zh":"别人先去做，然后你再去做。","start":965.02,"end":966.62},{"id":86,"text":"The cost of a failure is much lower than before because you waste a weekend by learning something.","zh":"失败的成本比以前低得多，因为你只是浪费一个周末来学习一些东西。","start":967.7,"end":973.32},{"id":87,"text":"That seems fine to me.","zh":"这对我来说似乎是可以接受的。","start":973.62,"end":974.82},{"id":88,"text":"me. So I think as long as you're being responsible,","zh":"对我来说。所以我认为只要你负责任，","start":974.82,"end":977.26},{"id":89,"text":"going for it, trying things out,","zh":"去尝试，去实践，","start":977.52,"end":979.3},{"id":90,"text":"and building lots of things would be the number one most important thing","zh":"并且构建很多东西将是最重要的事情","start":979.4,"end":983.7},{"id":91,"text":"I think would help your careers and yeah,","zh":"我认为这将有助于你们的职业生涯，是的，","start":983.7,"end":989.08},{"id":92,"text":"I think, I think I'm going to say one last thing that","zh":"我认为，我想再补充一点，","start":989.22,"end":991.94},{"id":93,"text":"is considered not politically correct in some circles,","zh":"在某些圈子里被认为是不政治正确的，","start":991.94,"end":995.62},{"id":94,"text":"but I'll just say it anyway, which is","zh":"但我还是会说出来的，那就是","start":996.16,"end":998.54},{"id":95,"text":"In some circles, it has become considered not politically correct to encourage others to work hard. I'm gonna encourage you to work hard.","zh":"在某些圈子里，鼓励他人努力工作被认为是不政治正确的。我会鼓励你们努力工作。","start":999.13,"end":1008.89},{"id":96,"text":"Now, I think the reason some people don't like that is because there are some people, they're in a phase of life where they're not in a position to work hard. So right after my children were born, I was not working hard for a short period of time. And there are people, because of an injury, disability, whatever, very valid reasons, they're not in a position to work hard at that moment in time. And we should respect them, support them, make sure they're well taken care of, even though they're not working hard.","zh":"我认为有些人不喜欢这一点的原因是，有一些人正处于生命中的某个阶段，他们并不处于能够努力工作的位置。比如在我孩子出生后，有一段时间我没有努力工作。还有一些人，由于受伤、残疾，或者其他各种原因，他们此时并不处于能够努力工作的位置。我们应该尊重他们，支持他们，确保他们得到妥善照顾，即使他们此时没有努力工作。","start":1009.81,"end":1035.41}],"notes":["本段主要讨论在选择工作时，应优先考虑团队的质量而非公司的品牌知名度。讲者强调，一个由优秀、努力、有知识的团队组成的公司，即使品牌不那么响亮，也能带来更快的学习和职业发展。这是因为学习主要来自于日常工作的同事，而不是公司标志。"],"formulas":[],"uncertainties":[],"diagram":"none","start":856.82,"end":1035.41,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":856.82,"text":"trying to figure out who you'd be actually working with day-to-day and making sure you're surrounded by people that inspire you and work on exciting projects. I think that's important. And if you're completely candid, if a company refuses to tell you what team you'd be assigned to, you know, that does raise a question in my mind, right, of whether or not, you know, what will happen. And I think that instead of working for the company with the hottest brand,"},{"start":881.14,"text":"sometimes if you find a really good team with really, you know, hardworking, knowledgeable, smart people trying to do Google AI, but the company logo just isn't as hot, I think that often means you actually learn faster and progress your career better because it is after all, we don't learn from the, you know,"},{"start":899.66,"text":"excitement of the company logo when you walk through the door, you learn from the people you deal with day-to-day. So I just urge you to use that as a, as a huge criteria, um, for your selection process for, for what you decide to do, right? Um, and, uh, I think, um, and, and, and then, uh, but I think number one, uh, on, on my"},{"start":921.46,"text":"is it's become much easier than ever before"},{"start":924.24,"text":"to build powerful software faster."},{"start":927.18,"text":"And what that means is do be responsible,"},{"start":929.6,"text":"don't build software that hurts others."},{"start":931.86,"text":"And at the same time,"},{"start":933.34,"text":"there are so many things that each of you can build."},{"start":936.52,"text":"And what I find is the number of ideas out in the world"},{"start":939.0,"text":"is much greater than the number of people"},{"start":940.9,"text":"with the skill to build them."},{"start":942.3,"text":"So I know that finding jobs has gotten tougher"},{"start":944.86,"text":"for fresh college grads."},{"start":945.98,"text":"At the same time, a lot of teams,"},{"start":947.72,"text":"you just can't find enough skilled people, right?"},{"start":950.22,"text":"And so there are a lot of projects in the world that if you don't build it, I think"},{"start":955.38,"text":"no one else will build it either."},{"start":957.36,"text":"So you don't need to, as long as you don't harm others, to be responsible, there are"},{"start":962.32,"text":"a lot of things that you don't need to wait for permission, you don't need to wait for"},{"start":965.02,"text":"someone else to do it first and then you do it."},{"start":967.7,"text":"The cost of a failure is much lower than before because you waste a weekend by learning something."},{"start":973.62,"text":"That seems fine to me."},{"start":974.82,"text":"me. So I think as long as you're being responsible,"},{"start":977.52,"text":"going for it, trying things out,"},{"start":979.4,"text":"and building lots of things would be the number one most important thing"},{"start":983.7,"text":"I think would help your careers and yeah,"},{"start":989.22,"text":"I think, I think I'm going to say one last thing that"},{"start":991.94,"text":"is considered not politically correct in some circles,"},{"start":996.16,"text":"but I'll just say it anyway, which is"},{"start":999.13,"text":"In some circles, it has become considered not politically correct to encourage others to work hard. I'm gonna encourage you to work hard."},{"start":1009.81,"text":"Now, I think the reason some people don't like that is because there are some people, they're in a phase of life where they're not in a position to work hard. So right after my children were born, I was not working hard for a short period of time. And there are people, because of an injury, disability, whatever, very valid reasons, they're not in a position to work hard at that moment in time. And we should respect them, support them, make sure they're well taken care of, even though they're not working hard."}],"speech_gaps":[],"frame":"../frames/v056/006.webp","frame_time":868.82},{"title":"职业建议与AI领域的发展","segments":[{"id":97,"text":"Having said that, all of my, say, PhD students that became very successful, I saw every single one of them work incredibly hard. I mean, the 2 a.m. sitting up hyperparameter tuning, been there, done that, still doing it some days. And if you are fortunate enough to be in a position in life where you can work really hard, there are so many opportunities to do things right now.","zh":"话说回来，我所有的博士生，那些非常成功的人，我都看到他们每一个人都极其努力地工作。我的意思是，凌晨2点坐着调参，经历过，也做过，有些日子还在继续这么做。如果你有幸处于一个可以非常努力工作的生活中，现在有很多机会把事情做得正确。","start":1036.08,"end":1059.1},{"id":98,"text":"If you get excited, as I do, spending evenings and weekends coding and building stuff and getting user feedback, if you lean in and do those things, it will increase your odds of being really successful. Maybe I get into some trouble with some people encouraging them to work hard, but I find that the truth is people that work hard get a lot more done. We should also respect people that don't and people that aren't in the position to do so.","zh":"如果你像我一样兴奋，花晚上和周末的时间编程和构建东西，并获取用户反馈，如果你投入去做这些事情，你成功的几率就会增加。也许我会因为鼓励人们努力工作而惹上一些麻烦，但我发现事实是努力工作的人能完成更多事情。我们也应该尊重那些不努力工作的人，以及那些没有能力这么做的人。","start":1060.62,"end":1082.88},{"id":99,"text":"you know, between watching some dumb TV show versus finding your agentic code there on the weekend to try something, I'm gonna choose the latter almost every time, right? Unless I watch a show with my kids, sometimes I do that. But you know, besides, I hope you do that.","zh":"你知道，比起看一些无聊的电视节目，我几乎每次都会选择在周末尝试一些自主的代码，去尝试一些新东西，对吧？除非是和孩子们一起看节目，有时候我也会这么做。但除此之外，我希望你也能这么做。","start":1084.43,"end":1100.55},{"id":100,"text":"All right. So those are the main things I want to say. Um, what I want to do is, uh, hand the stage over to my good friend Lawrence Maroney, uh, who, who, who share, um, a lot more about career advice on AI. Maybe just a quick intro. I've known Lawrence for a long time, um,","zh":"好的，这就是我想说的主要内容。嗯，我想做的就是，把舞台交给我的好朋友Lawrence Maroney，他，他，他分享了很多关于AI职业建议的内容。也许只是做个简短的介绍。我认识Lawrence很久了，嗯，","start":1102.73,"end":1118.45},{"id":101,"text":"He's done a lot of online education work, sometimes with me and my teams, taught a lot of people TensorFlow, taught a lot of people PyTorch. He was a lead AI advocate at Google for many years, now runs a group at ARM. I've also enjoyed quite a few of his books. This is one of them. He recently also published a new book on PyTorch. This is an excellent book, Introduction to PyTorch, and is a very sought-after speaker in many circles. So I was very grateful when he agreed to come speak to us.","zh":"他在在线教育方面做了很多工作，有时和我以及我的团队一起，教过很多人TensorFlow，也教过很多人PyTorch。他在谷歌担任了多年的AI倡导者，现在在ARM领导一个小组。我也很喜欢他写的很多书，这是一本其中之一。他最近还出版了一本关于PyTorch的新书，这是一本非常优秀的书，名为《PyTorch入门》，并且在很多圈子里都是备受追捧的演讲者。因此，当他在同意来为我们演讲时，我非常感激。","start":1118.93,"end":1146.41},{"id":102,"text":"Pleasure's all mine. I just want to reinforce something that Andrew was talking about earlier on, about choosing the people that you work with being very important. But I also want to show that, from the other way around, that the company, when they're interviewing you, are also choosing you. And the good companies really want to choose the people that they work with also. And I've been doing a lot of mentoring of young people, particularly over the last 18 months, who are hunting for careers for themselves. And I want to tell the story of one young man.","zh":"很高兴能帮上忙。我想再次强调Andrew之前提到的一个观点，即选择与你一起工作的人非常重要。但我也想从另一个角度来看，当公司面试你时，他们也在选择你。好的公司也非常希望选择与他们一起工作的人。过去18个月里，我一直在指导一些年轻人，他们正在为自己寻找职业道路。我想讲述一个年轻人的故事。","start":1147.14,"end":1174.04},{"id":103,"text":"And this guy, very well educated, great experience, super leet coder.","zh":"这个小伙子受过良好教育，经验丰富，编程能力非常出色。","start":1174.8,"end":1182.1},{"id":104,"text":"He could do every challenge that was in front of him, and he got laid off from his job in April. He worked in medical software, and the medical software business has been changing drastically. Funding has been cut by the federal government in a number of areas, and he got laid off from his job. And with his experience, with his ability, with his skills, all of these kind of things, he thought that it would be very easy for him to find another job. And the poor young guy had a really terrible April. He got laid off from his job in April. Immediately before that, his girlfriend had broken up with him, and then a couple of weeks later,","zh":"他能够应对所有摆在面前的挑战，但在四月份被解雇了。他从事医疗软件行业的工作，而医疗软件行业发生了巨大的变化。联邦政府在多个领域削减了资金，因此他被解雇了。凭借他的经验、能力和技能，他以为自己很容易找到另一份工作。然而，这个年轻人四月份过得非常糟糕。他在四月份被解雇了。就在之前，他的女朋友和他分手了，几周后，","start":1182.96,"end":1211.96}],"notes":["本段主要讨论了在AI领域中，努力工作的重要性以及如何选择合适的职业路径。讲者提到，成功的人通常非常努力，包括深夜调试超参数等。同时，他鼓励听众在有时间的情况下，积极参与项目和获取用户反馈，这会增加成功的几率。","讲者还提到，虽然鼓励努力工作可能会引起一些人的不满，但他认为努力工作的人能完成更多任务。同时，他也尊重那些无法工作的人。","在选择周末活动时，讲者倾向于编写代码而不是看无聊的电视节目，除非是为了陪伴孩子。他希望听众也能做出类似的选择。","接下来，讲者将舞台交给Lawrence Maroney，一位在AI领域有丰富经验的专家，他曾在Google担任AI倡导者，现在在ARM工作，并且出版了多本关于PyTorch的书籍。","Lawrence强调了选择合适的工作伙伴的重要性，并指出公司面试时也在选择合适的人。他提到自己在过去的18个月里指导了许多正在寻找职业的年轻人，并讲述了一个年轻人的故事。","这个年轻人虽然非常优秀，但因行业变化和公司裁员而失业。他原本认为凭借自己的能力和经验可以轻松找到新工作，但现实却并不如他所愿。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1036.08,"end":1211.96,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1036.08,"text":"Having said that, all of my, say, PhD students that became very successful, I saw every single one of them work incredibly hard. I mean, the 2 a.m. sitting up hyperparameter tuning, been there, done that, still doing it some days. And if you are fortunate enough to be in a position in life where you can work really hard, there are so many opportunities to do things right now."},{"start":1060.62,"text":"If you get excited, as I do, spending evenings and weekends coding and building stuff and getting user feedback, if you lean in and do those things, it will increase your odds of being really successful. Maybe I get into some trouble with some people encouraging them to work hard, but I find that the truth is people that work hard get a lot more done. We should also respect people that don't and people that aren't in the position to do so."},{"start":1084.43,"text":"you know, between watching some dumb TV show versus finding your agentic code there on the weekend to try something, I'm gonna choose the latter almost every time, right? Unless I watch a show with my kids, sometimes I do that. But you know, besides, I hope you do that."},{"start":1102.73,"text":"All right. So those are the main things I want to say. Um, what I want to do is, uh, hand the stage over to my good friend Lawrence Maroney, uh, who, who, who share, um, a lot more about career advice on AI. Maybe just a quick intro. I've known Lawrence for a long time, um,"},{"start":1118.93,"text":"He's done a lot of online education work, sometimes with me and my teams, taught a lot of people TensorFlow, taught a lot of people PyTorch. He was a lead AI advocate at Google for many years, now runs a group at ARM. I've also enjoyed quite a few of his books. This is one of them. He recently also published a new book on PyTorch. This is an excellent book, Introduction to PyTorch, and is a very sought-after speaker in many circles. So I was very grateful when he agreed to come speak to us."},{"start":1147.14,"text":"Pleasure's all mine. I just want to reinforce something that Andrew was talking about earlier on, about choosing the people that you work with being very important. But I also want to show that, from the other way around, that the company, when they're interviewing you, are also choosing you. And the good companies really want to choose the people that they work with also. And I've been doing a lot of mentoring of young people, particularly over the last 18 months, who are hunting for careers for themselves. And I want to tell the story of one young man."},{"start":1174.8,"text":"And this guy, very well educated, great experience, super leet coder."},{"start":1182.96,"text":"He could do every challenge that was in front of him, and he got laid off from his job in April. He worked in medical software, and the medical software business has been changing drastically. Funding has been cut by the federal government in a number of areas, and he got laid off from his job. And with his experience, with his ability, with his skills, all of these kind of things, he thought that it would be very easy for him to find another job. And the poor young guy had a really terrible April. He got laid off from his job in April. Immediately before that, his girlfriend had broken up with him, and then a couple of weeks later,"}],"speech_gaps":[],"frame":"../frames/v056/007.webp","frame_time":1048.08},{"title":"职业建议与面试策略的反思","segments":[{"id":105,"text":"Later, his dog died. So he was not in a good place. And so I sat down with him after a couple of months and took a look. And he had a spreadsheet of jobs that he was applying to. And he had over 300 jobs that he was tracking in the spreadsheet. And in a number of these jobs, he actually got into the interview process. And he went very deep in the interview process with companies like Meta. Who else? Not Google.","zh":"后来，他的狗去世了。因此，他情绪非常低落。几个月后，我坐下来和他一起查看了一下。他有一个记录他申请工作的电子表格。他在表格中跟踪了超过300个职位。在这些职位中，他实际上进入了多个面试环节。他与像Meta这样的公司进行了非常深入的面试。还有哪些公司？不是谷歌。","start":1211.98,"end":1238.04},{"id":106,"text":"There was Meta, there was Microsoft, there was one of the other large tech companies where you do lots and lots of interview loops. And every time, towards the end of the loop, he knew he did a great loop. He solved all the coding. He had great conversations with the people, or at least he thought he had. And then every time, within a day, the recruiter would call him and say, no, you didn't get the job.","zh":"有Meta，有微软，还有另一家大型科技公司，那里的面试流程非常繁琐。每次在流程接近尾声时，他都觉得自己表现得非常出色。他解决了所有的编程问题，与面试官进行了很好的交流，或者至少他认为是这样。但每次在一天之内，招聘人员都会打电话告诉他，他没有获得这份工作。","start":1238.67,"end":1259.15},{"id":107,"text":"And it was heartbreaking. And like I said, 300 plus jobs he had been tracking. So I started working with him to kind of do some mock interviews and to do some fine tuning. Oh, it was Jeff Bezos' company, not Amazon. That was one of the other big tech company that he'd interviewed with. And I started like working through him and doing some test interviews and all this kind of thing with him. And terrific, terrific candidate. Couldn't figure out what was going wrong.","zh":"这对他来说非常痛苦。正如我所说，他跟踪了300多个职位。于是我开始和他一起进行模拟面试，并进行一些微调。哦，那是一家Jeff Bezos的公司，不是亚马逊。那是他面试过的另一家大型科技公司。我开始和他一起进行测试面试和其他相关的事情。他是一个非常优秀的候选人，但始终无法弄清楚问题出在哪里。","start":1260.42,"end":1284.96},{"id":108,"text":"Until I decided to try and do a different sort of interview where I gave him a really tough interview. I gave him some tough leet code. I gave him some really obscure corner cases in his coding.","zh":"直到我决定尝试一种不同的面试方式，我给了他一个非常困难的面试。我给了他一些非常难的编程题。我给了他一些非常晦涩的边界情况。","start":1285.82,"end":1299.58},{"id":109,"text":"And how he reacted was the advice that was given to him in the recruiting pamphlets. And a lot of these recruiting pamphlets will say things like, you're going to have an opportunity to share an opinion, and you've got to stand your ground. You've got to have a backbone. Don't bend. His interpretation of that was to be really, really tough.","zh":"他对此的反应，正是招聘手册中给出的建议。这些招聘手册中会说，你将有机会表达自己的观点，你必须坚持自己的立场。你必须有主见。不要退缩。他对此的理解是变得非常强硬。","start":1300.3,"end":1323.11},{"id":110,"text":"So I would pick corners, I'd pick holes in his code, I'd pick corner cases where things may not work, and I'd give him a test of crisis. And this advice that he'd been given to stand his ground ended up making him kind of hostile in these interview environments.","zh":"因此，我会挑选他的代码中的漏洞，我会挑选那些可能出问题的边界情况，我会给他一个危机测试。他所接受的‘坚持立场’的建议，最终使他在面试环境中变得有些敌对。","start":1324.05,"end":1346.01},{"id":111,"text":"Good people, good teams, people that you can work together with. And from the interviewer perspective, if I'm managing this team, this person is that cliche 10x engineer, but I don't want him anywhere near my team because of this attitude. We worked on that. We fine-tuned it. And the strange part is, he's a really, really nice guy. It's just this was the advice he was given.","zh":"优秀的人，优秀的团队，能够一起工作的人。从面试官的角度来看，如果我管理这个团队，这个人就是那个常说的10倍工程师，但我并不想让他接近我的团队，因为他的态度。我们对此进行了讨论，进行了微调。奇怪的是，他其实是一个非常非常好的人。只是他所得到的建议就是这样的。","start":1346.41,"end":1368.27}],"notes":["本段讲述了一位求职者在面试过程中遇到的困难，他虽然在技术能力上表现出色，但因面试策略不当而屡屡失败。讲者通过模拟面试发现，求职者对招聘材料中‘坚持己见’的建议产生了误解，将其理解为在面试中表现得过于强硬，导致面试官对其态度产生负面评价。","讲者指出，求职者在面试中面对挑战时，采取了过于对抗的态度，这与招聘材料中‘坚持己见’的本意相悖。招聘材料中的建议旨在鼓励求职者在面试中表达自己的观点，而不是在技术问题上表现出敌意。","讲者通过模拟面试发现，求职者在面对技术难题时，倾向于坚持自己的观点，即使这些观点可能并不正确。这种态度在面试官眼中显得不合作，从而影响了求职者的面试表现。","讲者强调，面试中的沟通和合作能力同样重要。求职者需要在展示技术能力的同时，展现出良好的沟通技巧和团队合作精神，而不是一味地坚持己见。","讲者指出，求职者在面试中表现出的敌意态度，可能是由于对招聘材料中‘坚持己见’的误解所致。这种误解导致他在面试中未能展现出应有的合作态度，从而影响了面试结果。","讲者通过与求职者的合作，帮助他调整了面试策略，使其在技术能力和沟通技巧上都得到了提升。这一过程表明，面试策略的调整对于求职者的成功至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1211.98,"end":1368.27,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1211.98,"text":"Later, his dog died. So he was not in a good place. And so I sat down with him after a couple of months and took a look. And he had a spreadsheet of jobs that he was applying to. And he had over 300 jobs that he was tracking in the spreadsheet. And in a number of these jobs, he actually got into the interview process. And he went very deep in the interview process with companies like Meta. Who else? Not Google."},{"start":1238.67,"text":"There was Meta, there was Microsoft, there was one of the other large tech companies where you do lots and lots of interview loops. And every time, towards the end of the loop, he knew he did a great loop. He solved all the coding. He had great conversations with the people, or at least he thought he had. And then every time, within a day, the recruiter would call him and say, no, you didn't get the job."},{"start":1260.42,"text":"And it was heartbreaking. And like I said, 300 plus jobs he had been tracking. So I started working with him to kind of do some mock interviews and to do some fine tuning. Oh, it was Jeff Bezos' company, not Amazon. That was one of the other big tech company that he'd interviewed with. And I started like working through him and doing some test interviews and all this kind of thing with him. And terrific, terrific candidate. Couldn't figure out what was going wrong."},{"start":1285.82,"text":"Until I decided to try and do a different sort of interview where I gave him a really tough interview. I gave him some tough leet code. I gave him some really obscure corner cases in his coding."},{"start":1300.3,"text":"And I saw how he reacted. And how he reacted was the advice that was given to him in the recruiting pamphlets. And a lot of these recruiting pamphlets will say things like, you're going to have an opportunity to share an opinion, and you've got to stand your ground. You've got to have a backbone. Don't bend. His interpretation of that was to be really, really tough."},{"start":1324.05,"text":"So I would pick corners, I'd pick holes in his code, I'd pick corner cases where things may not work, and I'd give him a test of crisis. And this advice that he'd been given to stand his ground ended up making him kind of hostile in these interview environments. And I was looking at this then from the point of view of what Andrew was just talking about, where it's a case of, hey..."},{"start":1346.41,"text":"Good people, good teams, people that you can work together with. And from the interviewer perspective, if I'm managing this team, this person is that cliche 10x engineer, but I don't want him anywhere near my team because of this attitude. We worked on that. We fine-tuned it. And the strange part is, he's a really, really nice guy. It's just this was the advice he was given."}],"speech_gaps":[],"frame":"../frames/v056/008.webp","frame_time":1223.98},{"title":"职业建议与当前AI行业就业形势","segments":[{"id":112,"text":"And he followed that advice and he failed so many interviews as a result. So when I gave him the next job that he was interviewing at was at a company where teamwork is very, very highly valued. And the good news is he got the job at that company. He's now working there. He doubled his salary from the job he was laid off from. And he ended up having like about, now he looks back and he had six months of unemployment. But at the time when he was going through all of that, it was a very, very difficult time for him. So the flip side of it, like if you're looking at a company,","zh":"他遵循了那条建议，结果因此失败了很多次面试。所以当我给他介绍下一份工作时，那家公司非常重视团队合作。好消息是他得到了那份工作。他现在在那里工作。他的薪水是之前被裁员时工作的两倍。他回顾起来，大约有六个月的失业时间。但在当时经历这一切的时候，对他来说是非常困难的时期。因此，如果你在考虑一家公司，","start":1368.83,"end":1398.15},{"id":113,"text":"and looking at the people you'll be working with is very, very important, but also realize they are looking at you in the same way. And so if you've gone to tech interview coaching and they gave you that advice to stand your ground and have a backbone, it's good to do that, but don't be a jerk while you're doing so.","zh":"以及你将要合作的人，是非常重要的，但也要意识到他们也在以同样的方式审视你。因此，如果你参加了技术面试辅导，并且他们建议你坚持自己的立场、要有主见，这样做是好的，但不要在这样做时显得很无礼。","start":1398.29,"end":1413.95},{"id":114,"text":"Can you see my slides? Okay. So I'm Lawrence. I've been working in tech for more decades than ChatGP thinks there are ores in strawberry. And so I've worked in many of the big tech companies. I spent many years at Microsoft, spent many years at Google, also worked in places like Reuters. I've done a lot of work in startups, both in this country and abroad. And so what I really want to talk about today is to think about what does the career landscape look like today?","zh":"你能看到我的幻灯片吗？好的。我是Lawrence。我在科技行业工作的时间比ChatGP认为草莓中含有的矿石数量还要多。因此，我曾在许多大科技公司工作过。我在微软工作了很多年，在谷歌也工作了很多年，也在像路透社这样的地方工作过。我在国内外的初创公司也做过很多工作。因此，我今天真正想谈的是，今天的职业前景是怎样的？","start":1414.7,"end":1443.2},{"id":115,"text":"particularly in AI. Because, first of all, what Andrew said about you're in Stanford, you've got the ability to make use of the networks that you have in Stanford, make use of the prestige that you have, and I say use every weapon you have, because unfortunately the landscape right now is not ideal. We've gone through some very difficult times. All you have to do is look at the news, and you can see...","zh":"特别是在人工智能领域。首先，Andrew说的，你在斯坦福，你有能力利用你在斯坦福的网络，利用你的声望，我建议你使用你所拥有的所有资源，因为不幸的是，目前的形势并不理想。我们经历了一些非常困难的时期。你只需看看新闻，就能看到……","start":1444.24,"end":1466.11},{"id":116,"text":"massive tech layoffs, slowing hiring in tech, and lots of stuff like that. But it's not necessarily a bad thing if you do it the right way. So I want to just have a quick look. The job market reality check. Actually, out of interest, I don't know. Are you juniors? You're graduating this year or you're graduating next year? What is the general survey? Your third year of four?","zh":"大规模的科技裁员、科技行业招聘放缓，以及各种类似的情况。但如果你以正确的方式应对，这并不一定是坏事。因此，我想快速看一下就业市场的现实情况。实际上，出于兴趣，我不知道。你们是初级学生吗？你们是今年毕业还是明年毕业？总体的调查结果如何？你们是四年制大学的第三年吗？","start":1466.46,"end":1489.98},{"id":117,"text":"Third year of three. I'll say, so you're going to be graduating coming summer. How many people are already looking for jobs? Okay, quite a few of you. How many people have had success? Nobody. Oh, one. Okay, sort of. Okay, that's good. So you're probably seeing some of these things, the signals out there. Junior hiring slowing significantly. When I say junior, I mean graduate level.","zh":"第三年，三年制。我会说，你们即将在明年夏天毕业。有多少人已经开始找工作了？嗯，相当多的人。有多少人已经成功找到了工作？没有人。哦，有一个。嗯，还算不错。嗯，这很好。所以你们可能已经看到一些信号，外面的招聘情况明显放缓了。当我提到初级职位时，我指的是研究生层次的职位。","start":1491.58,"end":1513.55},{"id":118,"text":"High-profile layoffs are dominating the headlines. I was at Google a couple of years ago when they had the biggest layoff they'd ever had. We're seeing layoffs at the likes of Amazon, Microsoft, other companies like that. It feels that entry-level positions are scarce, and I'm underlying the word feels there, and I want to get into that in a little bit more detail later. And also, competition is fierce. But my question is, should you worry? And I say no, because...","zh":"高调的裁员新闻占据了头条。几年前我在谷歌的时候，他们曾进行过有史以来最大规模的裁员。我们现在看到亚马逊、微软以及其他类似公司也出现了裁员现象。感觉初级职位非常稀缺，我在这里强调的是‘感觉’这个词，稍后我会更详细地讨论这一点。此外，竞争也非常激烈。但我的问题是，你们应该担心吗？我的回答是不应该担心，因为……","start":1514.6,"end":1542.02}],"notes":["本段讲述了一个求职者遵循面试建议却多次失败，最终在重视团队合作的公司获得成功的故事。这说明在求职过程中，除了个人能力，团队合作和公司文化同样重要。同时，讲者强调了在面试中保持自信但不傲慢的重要性。","讲者提到自己在科技行业有多年经验，曾在微软、谷歌、路透社等公司工作，并参与过多个初创公司。他强调当前AI行业的职业环境并不理想，但通过正确的方法可以应对挑战。","讲者询问听众的年级，指出许多学生已经开始求职，但成功者寥寥无几。这反映了当前就业市场的竞争激烈和初级职位的稀缺性。","讲者提到科技行业的大规模裁员和招聘放缓，但认为这并不一定是坏事，关键在于如何应对。他指出，虽然感觉初级职位稀缺，但需要进一步分析和理解市场动态。","讲者最后提出问题：是否应该担心当前的就业形势？他回答说不应该，因为尽管存在挑战，但仍有应对策略。","整体上，讲者通过个人经历和行业观察，为听众提供了关于AI行业职业发展的实用建议，并鼓励他们积极应对当前的就业环境。"],"formulas":[],"uncertainties":["ChatGP thinks there are ores in strawberry"],"diagram":"none","start":1368.83,"end":1542.02,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1368.83,"text":"And he followed that advice and he failed so many interviews as a result. So when I gave him the next job that he was interviewing at was at a company where teamwork is very, very highly valued. And the good news is he got the job at that company. He's now working there. He doubled his salary from the job he was laid off from. And he ended up having like about, now he looks back and he had six months of unemployment. But at the time when he was going through all of that, it was a very, very difficult time for him. So the flip side of it, like if you're looking at a company,"},{"start":1398.29,"text":"and looking at the people you'll be working with is very, very important, but also realize they are looking at you in the same way. And so if you've gone to tech interview coaching and they gave you that advice to stand your ground and have a backbone, it's good to do that, but don't be a jerk while you're doing so."},{"start":1414.7,"text":"Can you see my slides? Okay. So I'm Lawrence. I've been working in tech for more decades than ChatGP thinks there are ores in strawberry. And so I've worked in many of the big tech companies. I spent many years at Microsoft, spent many years at Google, also worked in places like Reuters. I've done a lot of work in startups, both in this country and abroad. And so what I really want to talk about today is to think about what does the career landscape look like today?"},{"start":1444.24,"text":"particularly in AI. Because, first of all, what Andrew said about you're in Stanford, you've got the ability to make use of the networks that you have in Stanford, make use of the prestige that you have, and I say use every weapon you have, because unfortunately the landscape right now is not ideal. We've gone through some very difficult times. All you have to do is look at the news, and you can see..."},{"start":1466.46,"text":"massive tech layoffs, slowing hiring in tech, and lots of stuff like that. But it's not necessarily a bad thing if you do it the right way. So I want to just have a quick look. The job market reality check. Actually, out of interest, I don't know. Are you juniors? You're graduating this year or you're graduating next year? What is the general survey? Your third year of four?"},{"start":1491.58,"text":"Third year of three. I'll say, so you're going to be graduating coming summer. How many people are already looking for jobs? Okay, quite a few of you. How many people have had success? Nobody. Oh, one. Okay, sort of. Okay, that's good. So you're probably seeing some of these things, the signals out there. Junior hiring slowing significantly. When I say junior, I mean graduate level."},{"start":1514.6,"text":"High-profile layoffs are dominating the headlines. I was at Google a couple of years ago when they had the biggest layoff they'd ever had. We're seeing layoffs at the likes of Amazon, Microsoft, other companies like that. It feels that entry-level positions are scarce, and I'm underlying the word feels there, and I want to get into that in a little bit more detail later. And also, competition is fierce. But my question is, should you worry? And I say no, because..."}],"speech_gaps":[],"frame":"../frames/v056/009.webp","frame_time":1380.83},{"title":"AI领域职业建议与行业变化","segments":[{"id":119,"text":"If you can approach things in the right way, if you can approach the job hunting thing in the right way, particularly understanding how rapidly the AI landscape is changing, then I think people with the right mindset will thrive. So what do I mean by that? So as Andrew had mentioned, the AI hiring landscape is changing because the AI industry is changing. The AI industry, I...","zh":"如果你能以正确的方式去处理事情，如果你能以正确的方式去应对求职这件事，特别是理解AI领域变化的速度有多快，那么我认为那些拥有正确心态的人将会蓬勃发展。那么我所说的正确心态是什么意思呢？正如Andrew提到的，AI招聘的环境正在发生变化，因为AI行业本身正在发生变化。AI行业，我……","start":1542.81,"end":1568.23},{"id":120,"text":"I actually first got involved in AI way back in 1992. I worked in it for a little while, just before the AI winter. Everything failed drastically, but I got bitten by the AI bug. And then in 2015, when Google were launching TensorFlow, I got pulled right back into it, became part of the whole AI boom, launching TensorFlow, advocating TensorFlow to millions of people, and seeing the changes that happened.","zh":"我实际上早在1992年就第一次涉足AI领域。在AI寒冬之前，我曾在该领域工作了一段时间。当时一切都失败得非常彻底，但我却被AI深深吸引住了。然后在2015年，当谷歌推出TensorFlow时，我又被拉回到这个领域，成为了整个AI热潮的一部分，推出了TensorFlow，向数以百万计的人推广TensorFlow，并目睹了随之发生的变化。","start":1568.86,"end":1594.86},{"id":121,"text":"Along 2021, 2022, we had a global pandemic. The global pandemic caused a massive industrial slowdown. This massive industrial slowdown meant that companies had to start pivoting towards things that drove revenue and directly drove revenue. And at Google, TensorFlow was an open source product. It didn't directly drive revenue. We began to scale back. Every company in the world also scaled back on hiring at this time.","zh":"在2021年、2022年期间，我们经历了全球大流行。全球大流行导致了大规模的工业放缓。这种大规模的工业放缓意味着公司不得不开始转向那些能直接带来收入的事情。而在谷歌，TensorFlow是一个开源产品，它并没有直接带来收入。我们开始缩减规模。当时世界上所有公司也都缩减了招聘。","start":1597.08,"end":1622.1},{"id":122,"text":"Then we get to about 2022, 2023. What happens? We begin to come out of the global pandemic. We begin to realize all industries have this massive log jam of non-hiring that they had done or hiring that they hadn't done. And we're also entering a time where AI was exploding on the scene, thanks to the work of people like Andrew. The world was pivoting and changing to be AI first in just about everything. And every company needed to hire like crazy.","zh":"然后到了2022年、2023年。发生了什么？我们开始走出全球大流行。我们开始意识到，各行各业都积累了大量的未招聘或未完成的招聘。同时，我们还进入了一个AI迅速崛起的时期，这要归功于像Andrew这样的人的工作。世界正在转向以AI为核心，几乎在所有领域都如此。而每家公司都需要疯狂地招聘。","start":1622.59,"end":1650.17},{"id":123,"text":"Every company then hiring like crazy in 2022, 2023 meant that most companies ended up over hiring.","zh":"2022年、2023年每家公司疯狂招聘意味着大多数公司最终都过度招聘了。","start":1651.07,"end":1657.99},{"id":124,"text":"And what that generally meant was people who were not qualified for higher positions usually got higher positions because you had to enter into a bidding war just to be able to get talent. You ended up having talent grabs, and you ended up having stories like th
