omputer that other people did handwriting and pen and paper with, so I could move quickly. So I know I'm biased in that regard, but I'd say for most research, for the most part, I think, use the most powerful tools you have available, but check your expectations."},{"id":322,"text":"Little story, actually, on that side was a trivia question. Poorest country in Western Europe. Anybody know? What's that? Western Europe. It's Wales."},{"id":323,"text":"So I actually did my undergraduate in Wales, and I went back to do some lectures in the university there. And I met with a researcher there, and he was doing research into brain cancer using computer imagery and using various types of computer imagery. And I asked him, well, what's the biggest problem that you have? What's the biggest blocker for your research? And this is about eight years ago. And his answer was access to a GPU."},{"id":324,"text":"Because for him to be able to train his models and run his models, he needed to be able to access a GPA."},{"id":325,"text":"So in his case, he would spend the entire time that wasn't Tuesday afternoon preparing everything for his model run or his model training or everything like that, and then Tuesday afternoon, once he had access to the GPU, then he would do the training. And then he would hope that in that time that he would train his model and he would get the results that he wanted, otherwise he'd have to wait a week."}],"notes":["本段主要讨论了AI和机器学习在科研中的应用，强调了使用自动化工具的重要性，并通过一个具体例子说明了GPU资源在科研中的关键作用。","讲者提到自己在大学期间通过自动化实验提高了效率，这表明自动化在科研中的实际价值。","讲者还提到一个研究人员因GPU资源不足而面临困难，说明了计算资源在机器学习研究中的重要性。","该例子中，研究人员每天只能使用GPU半天，且时间固定为周二下午，这导致他需要提前准备所有工作，以确保在有限的时间内完成模型训练。","讲者指出，如果模型训练未能在预定时间内完成，研究人员可能需要等待一周，这突显了资源分配对科研进度的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5956.92,"end":6135.16,"asr_flags":[],"raw_segments":[{"start":5956.92,"text":"positioning ourselves to be trusted advisors by not leaning into the same mistakes that the untrained people may be leaning into, I think is the key to that. And just understanding that the average person is generally very intelligent, even if they may not be experts in a specific domain, and to key in on that intelligence and help them to foster and to grow that and navigate them through the parts where they'll have difficulty and let them shine in what they're very, very good at."},{"start":5986.09,"text":"Over here, there was one. Okay. So AI and machine learning for scientific research, where is it a good idea and where should you be cautious? Ooh. My initial gut check would be I think it's always a good idea, right? I think, you know, there's no harm in using the tools that you have available to you, but to always to just double-check your results and double-check your expectations against the grounded reality."},{"start":6028.3,"text":"I've always been a fan of using automation in research as much as possible. My undergraduate was physics many, many years ago, and I was actually very successful in the lab because I usually automated things through a computer that other people did handwriting and pen and paper with, so I could move quickly. So I know I'm biased in that regard, but I'd say for most research, for the most part, I think, use the most powerful tools you have available, but check your expectations."},{"start":6059.44,"text":"Little story, actually, on that side was a trivia question. Poorest country in Western Europe. Anybody know? What's that? Western Europe. It's Wales."},{"start":6073.03,"text":"So I actually did my undergraduate in Wales, and I went back to do some lectures in the university there. And I met with a researcher there, and he was doing research into brain cancer using computer imagery and using various types of computer imagery. And I asked him, well, what's the biggest problem that you have? What's the biggest blocker for your research? And this is about eight years ago. And his answer was access to a GPU."},{"start":6100.94,"text":"Because for him to be able to train his models and run his models, he needed to be able to access a GPA."},{"start":6106.94,"text":"and the department that he was in had one GPU between 10 researchers, which meant that everybody got it for half a day, Monday through Friday, and his half a day was Tuesday afternoon. So in his case, he would spend the entire time that wasn't Tuesday afternoon preparing everything for his model run or his model training or everything like that, and then Tuesday afternoon, once he had access to the GPU, then he would do the training. And then he would hope that in that time that he would train his model and he would get the results that he wanted, otherwise he'd have to wait a week."}],"speech_gaps":[],"frame":"../frames/v056/036.webp","frame_time":5968.92},{"title":"AI作为社会平等或不平等的工具","segments":[{"id":326,"text":"get access to the GPU again. And then I showed them Google Colab. Anybody ever use Google Colab? And you can have..."},{"id":327,"text":"a GPU in the cloud for free with that kind of thing. And the poor guy's brain melted, right? Because I took out my phone and I showed him a notebook running on my phone in Google Colab and training it on that. And it changed everything for him research-wise. And now it was a case of, and this was with free Colab, he had much more than he had with his shared GPU. So I think for someone like him, machine learning was an important part of his research, but he was so gated on it that the ability to widen access to that ended up..."},{"id":328,"text":"like really really advancing his research I don't know where it ended up"},{"id":329,"text":"I don't know what he has done it has been a few years since then but you know"},{"id":330,"text":"that story just came to mind when you ask the question any more questions any"},{"id":331,"text":"feel free to ask me anything okay at the front here"},{"id":332,"text":"So can AI be a force of social equality or social inequality?"},{"id":333,"text":"I think the answer to that is yes."},{"id":334,"text":"It can be both, and it can be neither."},{"id":335,"text":"I mean, I think that ultimately the idea is that if, in my opinion,"},{"id":336,"text":"any tool can be used for any means,"},{"id":337,"text":"so the important thing is to educate and inspire people"},{"id":338,"text":"towards using things for the correct means."},{"id":339,"text":"There's only so much governance can be applied,"},{"id":340,"text":"and sometimes governance can cause more problems,"},{"id":341,"text":"than it solves. So I always love to live my life by assuming good intent, but preparing for bad"},{"id":342,"text":"intent. And in the case of AI, I don't think there's any difference there, that everything"},{"id":343,"text":"that I would do and everything that I would advise is assuming good intent, that people would use it"},{"id":344,"text":"for good things, but also to be prepared for it to be misused. The bad examples that I showed earlier"},{"id":345,"text":"on I think we're good intent rather than bad intent and most mistakes that I see"},{"id":346,"text":"like that are good intent being used mistakenly as opposed to bad intent but"},{"id":347,"text":"I would say that's the only mantra that I can the only advice that I can give"},{"id":348,"text":"and that kind of thing is always assume good intent but prepare for bad intent"},{"id":349,"text":"the AI itself has no choice all right it's how people use it Andrew did you"},{"id":350,"text":"Do you want closing comments, or?"},{"id":351,"text":"All right, thank you, Andrew."}],"notes":["本段讨论了AI作为社会平等或不平等工具的双重可能性。讲者认为AI可以同时是促进社会平等或加剧社会不平等的工具，也可以既不是。这取决于人们如何使用AI，而不是AI本身。","讲者强调了教育和引导的重要性，认为教育和激励人们正确使用AI是关键。他提到，治理在AI的使用中只能起到有限的作用，有时甚至可能带来更多的问题。","讲者提出了一个核心的建议，即假设人们有良好的意图，但也要为可能的恶意使用做好准备。他指出，大多数错误是由于良好意图的误用，而不是恶意意图。","讲者认为AI本身没有选择，它只是工具，真正决定其影响的是人们如何使用它。他提到，无论是他本人还是他建议的，都基于这一假设。","讲者最后提到，他希望听众能够理解这一观点，并在实际应用中加以考虑。","讲者通过一个关于Google Colab的案例，说明了技术访问的平等性如何影响研究进展，从而引出AI作为社会工具的讨论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6135.88,"end":6297.48,"asr_flags":[],"raw_segments":[{"start":6135.88,"text":"get access to the GPU again. And then I showed them Google Colab. Anybody ever use Google Colab? And you can have..."},{"start":6143.46,"text":"a GPU in the cloud for free with that kind of thing. And the poor guy's brain melted, right? Because I took out my phone and I showed him a notebook running on my phone in Google Colab and training it on that. And it changed everything for him research-wise. And now it was a case of, and this was with free Colab, he had much more than he had with his shared GPU. So I think for someone like him, machine learning was an important part of his research, but he was so gated on it that the ability to widen access to that ended up..."},{"start":6172.78,"text":"like really really advancing his research I don't know where it ended up"},{"start":6175.68,"text":"I don't know what he has done it has been a few years since then but you know"},{"start":6178.94,"text":"that story just came to mind when you ask the question any more questions any"},{"start":6185.24,"text":"feel free to ask me anything okay at the front here"},{"start":6203.52,"text":"So can AI be a force of social equality or social inequality?"},{"start":6208.0,"text":"I think the answer to that is yes."},{"start":6210.96,"text":"It can be both, and it can be neither."},{"start":6213.56,"text":"I mean, I think that ultimately the idea is that if, in my opinion,"},{"start":6218.62,"text":"any tool can be used for any means,"},{"start":6221.36,"text":"so the important thing is to educate and inspire people"},{"start":6224.56,"text":"towards using things for the correct means."},{"start":6227.38,"text":"There's only so much governance can be applied,"},{"start":6229.76,"text":"and sometimes governance can cause more problems,"},{"start":6232.78,"text":"than it solves. So I always love to live my life by assuming good intent, but preparing for bad"},{"start":6240.98,"text":"intent. And in the case of AI, I don't think there's any difference there, that everything"},{"start":6245.12,"text":"that I would do and everything that I would advise is assuming good intent, that people would use it"},{"start":6249.46,"text":"for good things, but also to be prepared for it to be misused. The bad examples that I showed earlier"},{"start":6256.36,"text":"on I think we're good intent rather than bad intent and most mistakes that I see"},{"start":6262.46,"text":"like that are good intent being used mistakenly as opposed to bad intent but"},{"start":6266.94,"text":"I would say that's the only mantra that I can the only advice that I can give"},{"start":6270.9,"text":"and that kind of thing is always assume good intent but prepare for bad intent"},{"start":6276.54,"text":"the AI itself has no choice all right it's how people use it Andrew did you"},{"start":6283.9,"text":"Do you want closing comments, or?"},{"start":6296.26,"text":"All right, thank you, Andrew."}],"speech_gaps":[{"start":6285.616,"end":6287.408}],"frame":"../frames/v056/037.webp","frame_time":6147.88}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}

else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
