 M series chips about the neural cores and those kind of things in them. That's part of the idea. So to think about breaking that habit that we've gotten into where you need a GPU to be able to do AI is part of the trend that the world is heading in. Apple are probably one of the leaders in that. I'm very, very bullish on Apple and Apple intelligence as a result from the AI perspective.","zh":"因此，要打破我们已经养成的习惯，即认为需要GPU才能进行AI计算，这是世界正在发展的趋势。苹果公司可能是这一领域的领导者之一。从AI的角度来看，我对苹果和苹果智能非常看好。","start":5041.84,"end":5064.94},{"id":285,"text":"Seeing that trend and following that vector to its logical conclusion, as models are getting smaller, embedded intelligence getting everywhere isn't a pipe dream. It isn't sci-fi anymore. It's going to be a reality that we'll be seeing very, very shortly. So that idea of that convergence of AI because of the ability of smaller models getting smarter and lower-powered devices being able to run them, we see that convergence hitting, and I see massive opportunity there.","zh":"看到这一趋势并沿着这一方向推导其逻辑结论，随着模型变得越来越小，嵌入式智能无处不在并不是一个遥不可及的梦想。它不再是科幻小说了。我们很快就会看到这一现实。因此，由于更小的模型变得越来越智能，以及低功耗设备能够运行这些模型，这种AI的融合正在实现，我认为这将带来巨大的机会。","start":5066.78,"end":5093.12},{"id":286,"text":"So one last part, and just going back to agents for a moment, I think, you know, the one thing that I always say is like a hidden part of artificial intelligence is really what I like to call artificial understanding. And when you can start using models to understand things on your behalf, and when they understand them on your behalf to be able to craft.","zh":"最后再谈一点，回到智能体的话题上，我想，我常说的一点是，人工智能的一个隐藏部分，我称之为人工理解。当你能够开始利用模型来为你理解事物，并且当它们为你理解事物时，能够为你构建出相应的结果。","start":5095.05,"end":5113.53}],"notes":["本段主要讨论了AI在设备端部署的必要性和优势，特别是以支付宝为例，说明了将AI模型部署在设备端可以解决隐私、延迟和云服务成本等问题。讲者指出，通过在设备上运行AI模型，可以避免将照片上传到云端，从而保护用户隐私，同时减少延迟和云服务的构建成本。","讲者提到，苹果公司正在大力投资可扩展的矩阵扩展技术，这使得在移动设备上运行AI成为可能。苹果的A系列和M系列芯片中的神经核心是这一趋势的体现。讲者认为，未来AI不再依赖GPU，而是可以在低功耗设备上运行，这是行业发展的方向。","讲者进一步指出，随着模型规模的缩小和设备性能的提升，AI在嵌入式设备上的应用将变得越来越普遍。这种趋势正在从科幻变为现实，未来将有大量机会出现。","最后，讲者提到AI不仅仅是技术问题，还涉及‘人工理解’的概念，即利用模型来帮助人类理解事物。这种能力将使AI在更多领域发挥作用，而不仅仅是执行任务。","讲者强调，AI的发展趋势是将智能嵌入到各种设备中，而不是依赖于昂贵的云服务或GPU。这种趋势将带来巨大的商业机会，并改变AI的应用方式。","讲者对苹果公司在AI领域的投资和未来潜力表示高度乐观，认为苹果在AI智能方面的进展将引领行业的发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4946.54,"end":5113.53,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4946.54,"text":"extra power, taking up extra footprint space just to be able to run AI workloads, and B, the CPU, of course, being a low power."},{"start":4954.38,"text":"pulling thing, being able to run AI workloads on that, they've been able to build interesting new scenarios. And if I talk about one in particular, there's a company called Alipay. And Alipay had an application where you would, and we've all seen these apps, where you can go through your photographs and you can search for a particular thing. You know, places I ate sushi or something along those lines and use that to create a slideshow. All of those require a back-end service."},{"start":4980.27,"text":"So your photographs are hosted on Google Photos or Apple Photos or something like that, and that back-end service runs the model that you can search against it and be able to do the assembly of them. What Alipay wanted to do was, like, say, there are three problems with this. Problem number one, privacy. You have to share your photos with a third party. Problem number two, latency. You've got to upload those photos, you've got to send the thing, you've got to have the back-end do the thing, and then you've got to download the results from the thing. And then number three is building that cloud service."},{"start":5009.73,"text":"And standing that up costs time and money."},{"start":5012.3,"text":"So if they could move all of this onto the device itself, now the idea was they could run a model on the device that searches the photos on the device. You don't have the latency. And business perspective, they're now saving the money on creating this stand-up service. They now have AI running on the CPU in order to be able to do that. Apple are also people who've invested heavily in the scalable matrix extensions. You see whenever they talk about, if you've ever watched WWDC or anything like that, when they talk about the new AC."},{"start":5041.84,"text":"series chips and M series chips about the neural cores and those kind of things in them. That's part of the idea. So to think about breaking that habit that we've gotten into where you need a GPU to be able to do AI is part of the trend that the world is heading in. Apple are probably one of the leaders in that. I'm very, very bullish on Apple and Apple intelligence as a result from the AI perspective."},{"start":5066.78,"text":"Seeing that trend and following that vector to its logical conclusion, as models are getting smaller, embedded intelligence getting everywhere isn't a pipe dream. It isn't sci-fi anymore. It's going to be a reality that we'll be seeing very, very shortly. So that idea of that convergence of AI because of the ability of smaller models getting smarter and lower-powered devices being able to run them, we see that convergence hitting, and I see massive opportunity there."},{"start":5095.05,"text":"So one last part, and just going back to agents for a moment, I think, you know, the one thing that I always say is like a hidden part of artificial intelligence is really what I like to call artificial understanding. And when you can start using models to understand things on your behalf, and when they understand them on your behalf to be able to craft."}],"speech_gaps":[],"frame":"../frames/v056/030.webp","frame_time":4958.54},{"title":"AI职业建议与生成视频的挑战","segments":[{"id":287,"text":"From that understanding new things, you can actually develop superpowers where you're far more effective than ever before, be that creating code or creating other things. And I'm going to give one quick demo just so we can wrap up. And I was talking earlier about generating video. So this picture is, whoops, sorry, the connection here is not very good. I lost it. So here we go. This picture here is actually of my son playing ice hockey.","zh":"从这种理解中，你可以真正开发出超能力，使你比以往任何时候都更有效率，无论是编写代码还是创造其他东西。我将做一个快速的演示，以便我们结束这个话题。我之前谈到生成视频时说过，这张图片，啊，抱歉，这里的连接不太好。我失去了它。现在我们开始。这张图片实际上是我在冰球比赛中儿子的照片。","start":5114.24,"end":5146.19},{"id":288,"text":"And I took this picture and I was saying, okay, I think I'm very good at prompting. And I wrote a nice prompt for this picture to get him. He's in the middle of taking a slap shot. He's got some beautiful flex on his stick. And I asked it like, okay, to prompt him scoring a goal. What do you think happened? Should we watch? Let's see if it works. This was the wrong video, but it still shows the same idea. Because of poor prompting,","zh":"我拿这张图片，我说，好吧，我认为我非常擅长提示。我为这张图片写了一个不错的提示，以得到他。他正在射门的中间，他的球杆上有漂亮的弯曲。我问它，好吧，提示他得分。你觉得会发生什么？我们应该看看吗？让我们看看是否有效。这是错误的视频，但它仍然展示了同样的想法。由于提示不佳，","start":5146.89,"end":5183.1},{"id":289,"text":"Because of poor understanding of my intent, if I talk about it in agentic senses, the arena that he was in, which is a practice arena and doesn't have any people in it. Sorry, let me pause it. If I just rewind to here. If we look up in this top right hand corner here, this is basically where they store all the garbage. But the AI didn't know that, had no idea of it, so assumed it was a full arena and it started painting people in.","zh":"由于对我的意图理解不足，如果从代理的角度来看，他所处的场地是一个练习场地，里面没有人。抱歉，让我暂停一下。如果我倒回去到这里。如果我们看这个右上角，这里是他们存放垃圾的地方。但AI不知道这一点，毫无头绪，因此假设这是一个满员的场地，并开始画人。","start":5183.58,"end":5212.91},{"id":290,"text":"And even though he shot a mile wide, everybody cheers, and somehow he has two sticks in his hand instead of one, and they forgot his name.","zh":"尽管他射得非常远，但每个人都欢呼，而且不知何故他手里拿着两根球杆而不是一根，他们还忘了他的名字。","start":5213.61,"end":5221.15},{"id":291,"text":"I did not go through an agentic workflow to do this. I did not go through the steps of, A, understand my intent. B, once you understand my intent, understand the tools that are available to you. In this case, it's Veo. And understand the intricacies of using Veo. Make a plan of how to use them. Make a plan of how to build a prompt for them. And then use them and then reflect.","zh":"我没有通过代理的工作流程来做这件事。我没有经过以下步骤：A，理解我的意图。B，一旦你理解了意图，就理解可用的工具。在这种情况下，是Veo。并理解使用Veo的细节。制定一个使用它们的计划。制定一个如何为它们构建提示的计划。然后使用它们并进行反思。","start":5222.89,"end":5242.83},{"id":292,"text":"I've been advising a startup that is working on movie creation using AI, and I want to show you a little sample here of a movie that I've been working on with them, where the whole idea is if you want to have performances out of virtual actors and actresses, you need to have emotion.","zh":"我正在建议一家初创公司，该公司正在使用AI进行电影创作，我想向你们展示一个我与他们一起工作的电影样本，其中整个想法是，如果你想从虚拟演员和演员那里获得表演，你需要有情感。","start":5244.87,"end":5260.49},{"id":293,"text":"You need to be able to convey that emotion, and you also need to be able to put that emotion in the context of the entire story. Because when you create a video from a prompt, you're creating an eight-second snippet. That eight-second snippet needs to know what's going on in the rest of the story. So if I show this one for a moment. And it's a little wooden at the moment. It's not really working perfectly. I have professional actors who are friends who are advising me on this, and they laughed at the performances.","zh":"你需要能够传达这种情感，同时还需要将这种情感置于整个故事的背景下。因为当你从一个提示中创建视频时，你实际上是在创建一个八秒的片段。这个八秒的片段需要了解故事其余部分的情节。所以如果我现在展示这个片段一会儿。目前它显得有点生硬，还没有真正完美地发挥作用。我有一些专业的演员朋友在给我提供建议，他们对这些表演感到好笑。","start":5261.2,"end":5289.42}],"notes":["本段主要讨论了生成视频过程中由于提示词不够准确而导致的问题，例如AI误解了场景意图，将空旷的练习场误认为有观众的场地，从而生成了不相关的画面。这说明了在使用AI生成内容时，明确表达意图和理解工具的限制非常重要。","讲者提到在生成视频时，需要将情感融入虚拟角色的表演中，并且要将情感置于整个故事的上下文中。这表明AI生成的视频片段虽然只有8秒，但必须与整体叙事保持一致，否则会显得不连贯。","讲者强调了在使用AI工具（如Veo）时，需要经历一个完整的流程：理解意图、了解可用工具、掌握工具的使用细节、制定计划、执行并反思。这说明了AI工具的使用不仅仅是输入提示词，还需要系统性的规划和调整。","讲者提到正在与一家初创公司合作，开发基于AI的电影创作工具。这表明AI在影视制作中的应用正在扩展，但目前仍面临技术挑战，如情感表达和场景理解的不足。","讲者提到与专业演员合作，他们对生成的表演表示不满，这说明AI生成的表演仍需人工指导和改进，AI目前还不能完全替代人类的创造力。","讲者通过实际案例展示了AI生成内容的局限性，例如错误的场景理解、不自然的动作和情感表达，这提醒听众在使用AI工具时要保持批判性思维，并不断优化提示词和流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5114.24,"end":5289.42,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5114.24,"text":"From that understanding new things, you can actually develop superpowers where you're far more effective than ever before, be that creating code or creating other things. And I'm going to give one quick demo just so we can wrap up. And I was talking earlier about generating video. So this picture is, whoops, sorry, the connection here is not very good. I lost it. So here we go. This picture here is actually of my son playing ice hockey."},{"start":5146.89,"text":"And I took this picture and I was saying, okay, I think I'm very good at prompting. And I wrote a nice prompt for this picture to get him. He's in the middle of taking a slap shot. He's got some beautiful flex on his stick. And I asked it like, okay, to prompt him scoring a goal. What do you think happened? Should we watch? Let's see if it works. This was the wrong video, but it still shows the same idea. Because of poor prompting,"},{"start":5183.58,"text":"Because of poor understanding of my intent, if I talk about it in agentic senses, the arena that he was in, which is a practice arena and doesn't have any people in it. Sorry, let me pause it. If I just rewind to here. If we look up in this top right hand corner here, this is basically where they store all the garbage. But the AI didn't know that, had no idea of it, so assumed it was a full arena and it started painting people in."},{"start":5213.61,"text":"And even though he shot a mile wide, everybody cheers, and somehow he has two sticks in his hand instead of one, and they forgot his name."},{"start":5222.89,"text":"I did not go through an agentic workflow to do this. I did not go through the steps of, A, understand my intent. B, once you understand my intent, understand the tools that are available to you. In this case, it's Veo. And understand the intricacies of using Veo. Make a plan of how to use them. Make a plan of how to build a prompt for them. And then use them and then reflect."},{"start":5244.87,"text":"I've been advising a startup that is working on movie creation using AI, and I want to show you a little sample here of a movie that I've been working on with them, where the whole idea is if you want to have performances out of virtual actors and actresses, you need to have emotion."},{"start":5261.2,"text":"You need to be able to convey that emotion, and you also need to be able to put that emotion in the context of the entire story. Because when you create a video from a prompt, you're creating an eight-second snippet. That eight-second snippet needs to know what's going on in the rest of the story. So if I show this one for a moment. And it's a little wooden at the moment. It's not really working perfectly. I have professional actors who are friends who are advising me on this, and they laughed at the performances."}],"speech_gaps":[],"frame":"../frames/v056/031.webp","frame_time":5126.24},{"title":"职业建议与课程总结","segments":[{"id":294,"text":"try to view it through the difference that we had from an unagentic prompt with the hockey player to this one. Hopefully we can hear it. I guess I can do the pub quiz after all. They just shut me down. I'm so close. But they wouldn't listen. I won't. They never listen.","zh":"试着从我们之前那个没有自主性的提示与这个提示之间的差异来理解它。希望我们能听到这一点。我想我终究还是可以参加这个酒吧问答比赛的。他们只是把我关掉了。我离成功那么近。但他们不听。我也不听。他们从不听。","start":5290.93,"end":5326.38},{"id":295,"text":"So here's the idea of, again, just thinking in terms of agentic, as I was saying earlier on, breaking it into those steps. That allowed me to use exactly the same engine as I was showing you earlier on that fails to be able to show something that works and is able to do things like portraying emotion that I just spoke about. So I know we're a little bit over time, so sorry about that. I can take any questions if anybody has any. I see Andrew is here as well. He's at the back. And I just really want to say thank you so much for your attention. I really appreciate it.","zh":"所以，再次强调，我们以自主性为出发点进行思考，正如我之前所说，将其分解成这些步骤。这让我能够使用我之前展示给你们的相同引擎，这个引擎无法展示出有效的工作成果，但能够做到我刚才提到的表现出情感之类的事情。我知道我们已经有点超时了，对此我表示歉意。如果有任何问题，我都可以回答。我看到安德鲁也在场，他在后面。我只想衷心感谢大家的注意力，我非常感激。","start":5328.24,"end":5356.78},{"id":296,"text":"Yep. It's a great question. Just to repeat for the video, how much of the improvement is from the use of an agentic workflow versus just lack of hockey stuff in the training set for the failed one?","zh":"是的，这是一个很好的问题。为了视频的方便，改进的大部分来自于使用自主性工作流程，还是仅仅因为失败案例的训练集中缺乏曲棍球相关内容？","start":5365.77,"end":5400.52},{"id":297,"text":"Not comparing like to like, so just using my gut. When I looked at, when I broke this down into the workflow that said, okay, I created scenes like this one and they were awful when I just did it directly for myself with no basis, no agentic, no artificial understanding. And when I broke it down into the steps where it's like, okay, in this scene, the girl is sitting on the bench and she's upset and the person is talking to her and he wants to comfort her.","zh":"这不是在同类事物之间进行比较，所以我只是凭直觉来判断。当我看到，当我把这个流程分解成这样的步骤时，我创建了像这样的场景，但当我直接为自己制作时，没有基础，没有自主性，也没有人工理解，结果非常糟糕。而当我将其分解成步骤，比如在这个场景中，女孩坐在长椅上，她很伤心，而那个人在和她说话，他想安慰她。","start":5402.32,"end":5429.22},{"id":298,"text":"Feeding that to a large language model along with the entire story and along with the constraints that I had where the shot has to be eight seconds long, clear dialogue and all of those kind of thing, and then to understand my intent from that one.","zh":"将这些内容输入到一个大型语言模型中，同时提供整个故事以及我所设定的约束条件，例如镜头必须持续八秒，对话必须清晰等，然后让模型理解我的意图。","start":5431.42,"end":5446.4}],"notes":["本段主要总结了课程内容，并对听众表示感谢。讲师提到自己在时间上有些超时，但仍然愿意回答问题，并提到Andrew在场。这表明课程接近尾声，讲师在进行最后的总结和互动。","讲师提到自己在进行一个问答环节，但听众似乎没有提出问题。这可能意味着课程结束前的互动环节没有达到预期效果，或者听众对内容已经有所理解。","讲师提到自己在进行一个关于职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。","讲师提到自己在进行一个关于AI领域职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。","讲师提到自己在进行一个关于AI领域职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。","讲师提到自己在进行一个关于AI领域职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5290.93,"end":5446.4,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":5290.93,"text":"try to view it through the difference that we had from an unagentic prompt with the hockey player to this one. Hopefully we can hear it. I guess I can do the pub quiz after all. They just shut me down. I'm so close. But they wouldn't listen. I won't. They never listen."},{"start":5328.24,"text":"So here's the idea of, again, just thinking in terms of agentic, as I was saying earlier on, breaking it into those steps. That allowed me to use exactly the same engine as I was showing you earlier on that fails to be able to show something that works and is able to do things like portraying emotion that I just spoke about. So I know we're a little bit over time, so sorry about that. I can take any questions if anybody has any. I see Andrew is here as well. He's at the back. And I just really want to say thank you so much for your attention. I really appreciate it."},{"start":5365.77,"text":"Yep. It's a great question. Just to repeat for the video, how much of the improvement is from the use of an agentic workflow versus just lack of hockey stuff in the training set for the failed one?"},{"start":5402.32,"text":"Not comparing like to like, so just using my gut. When I looked at, when I broke this down into the workflow that said, okay, I created scenes like this one and they were awful when I just did it directly for myself with no basis, no agentic, no artificial understanding. And when I broke it down into the steps where it's like, okay, in this scene, the girl is sitting on the bench and she's upset and the person is talking to her and he wants to comfort her."},{"start":5431.42,"text":"Feeding that to a large language model along with the entire story and along with the constraints that I had where the shot has to be eight seconds long, clear dialogue and all of those kind of thing, and then to understand my intent from that one."}],"speech_gaps":[],"frame":"../frames/v056/032.webp","frame_time":5302.93},{"title":"AI职业建议与LLM应用实例","segments":[{"id":299,"text":"The LLM ended up expressing a prompt that was far more loquacious than I ever would have, that was far more descriptive than I ever would have. The LLM had understanding of what makes a good shot, what makes a good angle, what makes good emotion, far more than I would have. I could spend hours trying to describe it. So that first step in the agentic flow of it, doing that for me and understanding my intent, was huge. The second step then is the tools that it's going to use. So I explicitly said which video engine I'm going to use.","zh":"LLM最终表达了一个比我以往任何时候都更啰嗦、更详细的提示，它对什么是好的镜头、什么是好的角度、什么是好的情感的理解，远比我所能达到的要深刻得多。我可以花好几个小时来描述这些内容。因此，在这个代理流程的第一步中，它为我完成了这项工作并理解了我的意图，这一点非常重要。第二步则是它将要使用的工具。我明确地指定了要使用的视频引擎。","start":5447.16,"end":5476.64},{"id":300,"text":"be using. I was using Gemini as the LLM, and hopefully Gemini is familiar with Veo, you know, that kind of stuff, so to understand the idiosyncrasies of doing things with Veo. What I learned, like, for example, Veo is very bad at doing high action scenes, but is very good at doing slow camera pulls to do a motion, as you saw in this case. So the LLM knew that from me declaring I was using that as a tool, and then further, it built a prompt, and then further refined the prompt from that, and then the third part, actually using the tool to actually generate it for me.","zh":"我正在使用Gemini作为LLM，希望Gemini熟悉Veo，你知道，那种东西，以便理解使用Veo进行操作的特殊之处。我学到的一个例子是，Veo在处理高动作场景时表现非常糟糕，但在进行缓慢的摄像机拉近以展示动作时表现非常好，正如你在这个案例中所看到的。因此，LLM从我声明要使用该工具这一点中了解到这一点，然后进一步构建了一个提示，并进一步优化了这个提示，第三步则是实际使用该工具为我生成视频。","start":5476.65,"end":5505.71},{"id":301,"text":"generating a video with something like VO costs I think between two and three dollars to generate like four videos and credits so the last thing I want to do is generate lots and lots and lots and lots of videos and throw good money after bad but all of that token spend that I did earlier on to understand my intent and then to make the plan for using the agent was saved in the back end where it got it right like you know maybe not get it right first time but it would very rarely take more than two or three tries to get something that was really really nice so I think you know","zh":"使用像Veo这样的工具生成视频的成本，我认为大约是两到三美元生成四段视频和信用额度，因此我最不想做的事情就是生成大量视频并把好钱花在坏地方。但我在前面所花费的所有标记费用，用于理解我的意图并制定使用代理的计划，都被保存在后台，它能够正确地执行，你知道，也许第一次不会完全正确，但它很少需要超过两到三次尝试就能得到非常非常出色的结果，我认为你知道","start":5505.87,"end":5535.19},{"id":302,"text":"Without comparing like with like, I do think that plan of action and going through a workflow like that worked very, very well. Any other questions, thoughts, comments? Yep, up at the back. What has surprised me the most about the AI industry over the years? Oh, that's a good one. I think what has surprised me the most, and it probably shouldn't have surprised me, is how much hype took over.","zh":"不进行类似与类似的比较，我认为这种行动计划和流程确实非常有效。还有其他问题、想法或评论吗？是的，在后面。多年来，关于AI行业最让我惊讶的是什么？哦，这是一个好问题。我认为最让我惊讶的是，而且可能不应该让我感到惊讶的是，炒作有多么严重。","start":5535.72,"end":5568.97},{"id":303,"text":"I honestly thought a lot of people who are in important decision-making roles and that kind of thing would be able to see the signal better than they did. And I think the other part was that the desire to...","zh":"我真心认为，很多处于重要决策职位的人以及类似角色，应该能够比他们实际表现得更好地区分信号。我认为另一部分原因是，人们渴望立即获利，而不是长期收益，这一点也让我感到很惊讶。","start":5569.85,"end":5584.63},{"id":304,"text":"make immediate profits as opposed to long-term gains also surprised me a lot. Let me share one story in that space. Andrew and I taught the TensorFlow specializations on Coursera. And after that, Google launched a professional certificate where the idea of this professional certificate was we'd give a rigorous exam. And at the end of the rigorous exam, if you got the certificate, it was a high prestige thing.","zh":"让我分享一个相关的故事。Andrew和我曾在Coursera上教授TensorFlow专项课程。之后，Google推出了一项专业证书项目，该项目的理念是我们会提供严格的考试。在通过严格的考试后，获得证书是一件具有很高声望的事情。","start":5585.32,"end":5614.58},{"id":305,"text":"that would help you find work, and particularly at the time when TensorFlow was a very highly demanded skill in order to get work. Running that program cost Google $100,000 a year.","zh":"这将有助于你找到工作，尤其是在TensorFlow是一项非常抢手的技能、能够帮助你获得工作的时期。运行该程序每年耗费谷歌100,000美元。","start":5614.6,"end":5625.12}],"notes":["本段主要讲述使用LLM生成视频的成本问题，以及通过前期的意图理解来优化生成过程。讲者提到生成视频的费用大约在2到3美元之间，可以生成四段视频，因此不希望生成大量视频以避免浪费资源。同时，讲者强调前期的意图理解与计划制定在后端保存，使得生成过程更加高效，通常不需要太多尝试就能得到高质量结果。","讲者提到在生成视频时，使用VO（可能指视频生成工具）的成本问题，以及如何通过前期的意图理解来减少不必要的生成尝试。这体现了在实际应用中，如何通过前期的分析和规划来优化资源使用。","讲者提到生成视频的费用和资源浪费问题，强调了在实际应用中需要合理规划，避免不必要的开支。这反映了在AI应用中，成本控制和资源优化的重要性。","讲者提到前期的意图理解与计划制定在后端保存，使得生成过程更加高效，通常不需要太多尝试就能得到高质量结果。这说明了在AI系统中，如何通过前期的分析和规划来提高生成效率。","讲者提到生成视频的费用和资源浪费问题，强调了在实际应用中需要合理规划，避免不必要的开支。这反映了在AI应用中，成本控制和资源优化的重要性。","讲者提到生成视频的费用和资源浪费问题，强调了在实际应用中需要合理规划，避免不必要的开支。这反映了在AI应用中，成本控制和资源优化的重要性。"],"formulas":[],"uncertainties":["VO可能指视频生成工具，但具体名称未明确"],"diagram":"none","start":5447.16,"end":5625.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5447.16,"text":"The LLM ended up expressing a prompt that was far more loquacious than I ever would have, that was far more descriptive than I ever would have. The LLM had understanding of what makes a good shot, what makes a good angle, what makes good emotion, far more than I would have. I could spend hours trying to describe it. So that first step in the agentic flow of it, doing that for me and understanding my intent, was huge. The second step then is the tools that it's going to use. So I explicitly said which video engine I'm going to use."},{"start":5476.65,"text":"be using. I was using Gemini as the LLM, and hopefully Gemini is familiar with Veo, you know, that kind of stuff, so to understand the idiosyncrasies of doing things with Veo. What I learned, like, for example, Veo is very bad at doing high action scenes, but is very good at doing slow camera pulls to do a motion, as you saw in this case. So the LLM knew that from me declaring I was using that as a tool, and then further, it built a prompt, and then further refined the prompt from that, and then the third part, actually using the tool to actually generate it for me."},{"start":5505.87,"text":"generating a video with something like VO costs I think between two and three dollars to generate like four videos and credits so the last thing I want to do is generate lots and lots and lots and lots of videos and throw good money after bad but all of that token spend that I did earlier on to understand my intent and then to make the plan for using the agent was saved in the back end where it got it right like you know maybe not get it right first time but it would very rarely take more than two or three tries to get something that was really really nice so I think you know"},{"start":5535.72,"text":"Without comparing like with like, I do think that plan of action and going through a workflow like that worked very, very well. Any other questions, thoughts, comments? Yep, up at the back. What has surprised me the most about the AI industry over the years? Oh, that's a good one. I think what has surprised me the most, and it probably shouldn't have surprised me, is how much hype took over."},{"start":5569.85,"text":"I honestly thought a lot of people who are in important decision-making roles and that kind of thing would be able to see the signal better than they did. And I think the other part was that the desire to..."},{"start":5585.32,"text":"make immediate profits as opposed to long-term gains also surprised me a lot. Let me share one story in that space. Andrew and I taught the TensorFlow specializations on Coursera. And after that, Google launched a professional certificate where the idea of this professional certificate was we'd give a rigorous exam. And at the end of the rigorous exam, if you got the certificate, it was a high prestige thing."},{"start":5614.6,"text":"that would help you find work, and particularly at the time when TensorFlow was a very highly demanded skill in order to get work. Running that program cost Google $100,000 a year."}],"speech_gaps":[],"frame":"../frames/v056/033.webp","frame_time":5459.16},{"title":"AI职业建议与个人故事","segments":[{"id":306,"text":"Drop in the bucket. Not a lot of money. The goodwill that came out of it was immense. I can tell two stories. I'll tell one story very quickly. There was a young man and he went public in some advertising stuff with Google that he lived in Syria. And we all know there was a huge civil war in Syria over the last few years.","zh":"只是杯水车薪。并不是很多钱。但由此产生的善意却是巨大的。我可以讲两个故事。我会很快讲其中一个故事。有一个年轻人，他在一些谷歌的广告内容中公开表示自己生活在叙利亚。我们都知道，过去几年叙利亚发生了巨大的内战。","start":5626.3,"end":5648.24},{"id":307,"text":"And he got the TensorFlow certificate. He was one of the first in Syria to get it. And it lifted him out of poverty where he was able to move to Germany and get work at a major German firm. And I met him at an event in Amsterdam where he told me his story. And now, because of the job that he had in this German firm, he's able to support his family back home and move them out of the war-torn zone into a peaceful zone. All because he got this AI thing.","zh":"他获得了TensorFlow证书。他是叙利亚首批获得该证书的人之一。这使他摆脱了贫困，使他能够搬到德国并在一家大型德国公司找到工作。我在阿姆斯特丹的一个活动上遇到了他，他向我讲述了他自己的故事。现在，由于他在这家德国公司的这份工作，他能够支持他的家人，并将他们从战乱地区迁移到一个和平地区。这一切都源于他获得了这项AI技术。","start":5648.92,"end":5677.18},{"id":308,"text":"And there were countless stories like that, very inspirational, very beautiful stories. But the thing that surprised me then was sometimes the lack of investment in that, where there was no revenue being generated for the company out of that. We deliberately kept it revenue neutral so that the price of the exams could go down. We wanted it to self-sustain. It ended up not being revenue neutral. It ended up costing the company about $100,000 to $150,000 a year, so they canned it. And it's a shame because of all the potential...","zh":"还有无数这样的故事，非常鼓舞人心，非常动人的故事。但当时让我感到惊讶的是，有时候对这些事情的投资却非常缺乏，因为这些事情并没有为公司带来收入。我们故意保持收支平衡，以便考试的价格能够降低。我们希望它能够自给自足。结果却并没有达到收支平衡，最终每年给公司造成了大约100,000到150,000美元的成本，因此他们取消了这个项目。这很可惜，因为这些事情有着巨大的潜力……","start":5677.74,"end":5706.94},{"id":309,"text":"goodwill that can come out of something like that. But I think those were the two that immediately jumped to mind that have surprised me the most. And then I guess one other part that I would say is the people who've been able to be very successful with AI, who you wouldn't think would be the ones that would be successful with AI, has always been inspirational to me. So allow me one more story. I have a good friend. I showed ice hockey a moment ago. I have a good friend who is a former professional ice hockey player. And any ice hockey fans here?","zh":"但我想，最让我感到惊讶的是那些能够非常成功地运用AI的人，而你可能不会想到他们会成功。这一直是我感到鼓舞的。让我再讲一个故事。我有一个好朋友。我刚才提到了冰球。我有一个好朋友，他曾经是一名职业冰球运动员。在座有冰球爱好者吗？","start":5707.02,"end":5736.35},{"id":310,"text":"You know, it's kind of a brutal sport, right? You see a lot of fighting and a lot of stuff on the ice. And he dropped out of school when he was 13 years old to focus on skating. And he will always tell everybody that he's the dumbest person alive because he's uneducated. He and I are complete opposites. That's why we get on so well. And he retired from ice hockey because of concussion issues. And he now runs a non-profit, the Ice Rinks for a non-profit.","zh":"你知道吗，这其实是一项相当残酷的运动，对吧？你会看到很多打架和冰上的各种事情。他在13岁的时候就辍学了，专注于滑冰。他总是跟大家说他是世界上最蠢的人，因为他没有受过教育。我和他是完全相反的，这也是为什么我们相处得这么融洽。他因为脑震荡问题退役了冰球运动员，现在他经营一个非营利组织，叫做『为非营利组织提供溜冰场』。","start":5737.24,"end":5763.26},{"id":311,"text":"And about three years ago, we were having a beer and he was like, so tell me about AI and tell me about this chat GPT thing. Is it any good? And I was like, you know, just sharing the whole thing. Yes, it's good and all that kind of stuff. And it was obviously a loaded question and I didn't know why. But part of his job at his nonprofit is that every quarter he has to present to the board of directors the results of the operations so that they can be funded properly. Because even though they're a nonprofit, they still need money to operate.","zh":"大约三年前，我们喝啤酒的时候，他问我说：『跟我讲讲AI，还有这个Chat GPT是什么？它有什么用吗？』我当时就说：『你知道的，我只是在分享整个事情。是的，它很好，诸如此类的。』显然这是一个带有深意的问题，我不知道为什么。但他在非营利组织的工作中，每季度都要向董事会汇报运营结果，以便他们能够正确地获得资金支持。即使他们是非营利组织，仍然需要资金来运作。","start":5764.36,"end":5790.88},{"id":312,"text":"And he was spending upwards of $150,000 a year to bring in consultants.","zh":"他每年花费高达150,000美元来聘请顾问。","start":5791.78,"end":5797.7}],"notes":["本段主要讲述AI技术在实际应用中可能带来的社会影响，以及其在商业上的可持续性问题。讲者提到，尽管AI证书帮助了一些人摆脱贫困，但公司由于缺乏收入回报，最终决定停止该项目。这反映了AI技术在社会层面的积极影响与商业可行性之间的矛盾。","讲者通过一个朋友的故事，展示了AI技术如何被非技术背景的人所接受和应用。这位前职业冰球运动员虽然没有接受过正规教育，但对AI表现出浓厚兴趣，并将其应用于非营利组织的运营中，这说明AI技术的普及并不局限于特定背景的人群。","讲者提到，非营利组织需要资金支持，而AI技术可能成为降低成本、提高效率的工具。这表明AI技术在非营利领域的潜在应用价值，尤其是在资源有限的情况下。","讲者强调了AI技术的广泛适用性，即使是对AI不熟悉的人也能通过学习和应用AI技术来改善自己的生活和工作。这体现了AI技术的包容性和可及性。","讲者提到，AI技术的推广需要考虑其经济可持续性，这可能影响其在实际应用中的推广速度和范围。这表明AI技术的推广不仅仅是技术问题，还涉及经济和管理层面的考量。","讲者通过多个故事展示了AI技术在不同背景下的应用，强调了其在社会和个人层面的积极影响。这表明AI技术不仅是一种工具，也是一种能够改变人们生活和工作的力量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5626.3,"end":5797.7,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5626.3,"text":"Drop in the bucket. Not a lot of money. The goodwill that came out of it was immense. I can tell two stories. I'll tell one story very quickly. There was a young man and he went public in some advertising stuff with Google that he lived in Syria. And we all know there was a huge civil war in Syria over the last few years."},{"start":5648.92,"text":"And he got the TensorFlow certificate. He was one of the first in Syria to get it. And it lifted him out of poverty where he was able to move to Germany and get work at a major German firm. And I met him at an event in Amsterdam where he told me his story. And now, because of the job that he had in this German firm, he's able to support his family back home and move them out of the war-torn zone into a peaceful zone. All because he got this AI thing."},{"start":5677.74,"text":"And there were countless stories like that, very inspirational, very beautiful stories. But the thing that surprised me then was sometimes the lack of investment in that, where there was no revenue being generated for the company out of that. We deliberately kept it revenue neutral so that the price of the exams could go down. We wanted it to self-sustain. It ended up not being revenue neutral. It ended up costing the company about $100,000 to $150,000 a year, so they canned it. And it's a shame because of all the potential..."},{"start":5707.02,"text":"goodwill that can come out of something like that. But I think those were the two that immediately jumped to mind that have surprised me the most. And then I guess one other part that I would say is the people who've been able to be very successful with AI, who you wouldn't think would be the ones that would be successful with AI, has always been inspirational to me. So allow me one more story. I have a good friend. I showed ice hockey a moment ago. I have a good friend who is a former professional ice hockey player. And any ice hockey fans here?"},{"start":5737.24,"text":"You know, it's kind of a brutal sport, right? You see a lot of fighting and a lot of stuff on the ice. And he dropped out of school when he was 13 years old to focus on skating. And he will always tell everybody that he's the dumbest person alive because he's uneducated. He and I are complete opposites. That's why we get on so well. And he retired from ice hockey because of concussion issues. And he now runs a non-profit, the Ice Rinks for a non-profit."},{"start":5764.36,"text":"And about three years ago, we were having a beer and he was like, so tell me about AI and tell me about this chat GPT thing. Is it any good? And I was like, you know, just sharing the whole thing. Yes, it's good and all that kind of stuff. And it was obviously a loaded question and I didn't know why. But part of his job at his nonprofit is that every quarter he has to present to the board of directors the results of the operations so that they can be funded properly. Because even though they're a nonprofit, they still need money to operate."},{"start":5791.78,"text":"And he was spending upwards of $150,000 a year to bring in consultants."}],"speech_gaps":[],"frame":"../frames/v056/034.webp","frame_time":5638.3},{"title":"AI技术的实际应用与职业建议","segments":[{"id":313,"text":"to kind of pull the data from all of the different sources they were pulling data from. There's, like, machines in what's called the pump room that has a compressor that cools the ice, and there were spreadsheets, and there was accounts, and all this kind of stuff. And he was not tech-savvy in any way, but he, like, needed to process all this data. So he did an experiment where he got ChatGPT to do it. And this was the loaded question, like, asking me was it any good. And so we talked through it a little bit, and then he told me why.","zh":"他需要从各种不同的数据源中提取数据。例如，在所谓的泵房里有机器，里面有压缩机用来冷却冰块，还有电子表格、账户信息等等。他一点都不懂技术，但需要处理所有这些数据。于是他做了一个实验，让ChatGPT来完成这项任务。这其实是一个关键问题，就是问我这样做是否有效。我们讨论了一下，然后他告诉我他的理由。","start":5798.58,"end":5824.24},{"id":314,"text":"And so I took a look at the results because he was uploading spreadsheets, he was uploading PDFs and all this kind of thing and getting it to assemble a report. And it takes him now about two hours to do the report himself with ChatGPT. And it worked and it worked brilliantly. And that $150,000 a year that he's saving on consulting is now going to underprivileged kids, right, for hockey equipment, for ice skating equipment, for lessons and all of that kind of thing. So it was taken out of the hands of an expensive consulting company and put into the hands of people because of this.","zh":"因此，我查看了结果，因为他正在上传电子表格、PDF文件等各种文件，并将其整合成一份报告。现在他使用ChatGPT自己完成这份报告大约需要两个小时。它有效运作了，并且运作得非常出色。他每年节省下来的$150,000咨询费用，现在被用于帮助弱势儿童，比如购买曲棍球装备、冰鞋装备以及课程等。因此，原本由昂贵的咨询公司处理的事情，现在被交到了普通人的手中，这都要归功于这项技术。","start":5825.05,"end":5854.27},{"id":315,"text":"guy, and he says he's the dumbest person alive, you know, but I hope he's not watching this video, but, and he's like, you know, but he, and I told him afterwards that, congratulations, you're now a developer, right, and he didn't like that, but, you know, but it's like surprises like that, that the superpowers that were handed to somebody like him, that he's not technical in any way, but he was able to effectively build a solution that saved his non-profit $100,000 to $150,000 a year, and like, things like that are all,","zh":"那个人说他是世界上最蠢的人，你知道的，但我希望他没在看这个视频。他说道，但后来我告诉他，恭喜你，你现在是一名开发者了，他并不喜欢这个说法，但你知道的，就是这样一些惊喜，赋予了像他这样非技术背景的人超能力，他能够有效地构建一个解决方案，每年为他的非营利组织节省$100,000到$150,000，像这样的事情还有很多。","start":5854.34,"end":5883.52},{"id":316,"text":"always surprising me in a very pleasant way. Yep. Sorry, I'll get to you next. Sorry. Yep.","zh":"是的。抱歉，我下次再和你聊。抱歉。是的。","start":5883.56,"end":5891.11},{"id":317,"text":"Yep, so just to repeat the question for the video, for engineers like us, sometimes it's easy to navigate the hype, to see the signal from the noise, but what about people who don't have the same training as us? I think that's our opportunity to be trusted advisors for them and to really help them through that to understand it. I think the biggest part in the hype story right now is just understanding the reward mechanism. Everything rewards engagement rather than actual substance. To me, step one is seeing through.","zh":"是的，所以为了视频中的问题，我再重复一遍：对于像我们这样的工程师来说，有时很容易辨别炒作，从噪音中看到信号，但对于那些没有我们相同训练背景的人呢？我认为这就是我们成为他们信任顾问的机会，真正帮助他们理解这些内容。我认为目前炒作故事中最大的部分就是理解奖励机制。一切奖励的是参与度，而不是实际内容。对我来说，第一步就是看透这一点。","start":5912.3,"end":5941.84},{"id":318,"text":"that like the story I just told about my friend you know he'd seen all this kind of stuff but he wasn't willing to bet his career on it you know but he needed like that kind of advice around it and to kind of start peeling apart what he had done and what he did right and what he did wrong and you know so that","zh":"比如我刚刚讲到我朋友的故事，你知道，他见过所有这些内容，但他不愿意把自己的职业生涯押在上面，你知道的，但他需要这种类型的建议，围绕这些内容开始剖析他做过的事情，以及他做对了什么，做错了什么，你知道的，所以","start":5941.9,"end":5956.08}],"notes":["本段讲述了一位非技术人员通过使用ChatGPT处理数据，从而节省了大量咨询费用，并将这些费用用于帮助弱势群体。这说明了AI技术在非技术背景人士中的实际应用价值。","讲者提到这位朋友虽然自认为是‘最蠢的人’，但通过AI工具成功解决了问题，这体现了技术工具对非技术人员的赋能作用。","讲者强调了在AI技术的 hype 中，理解奖励机制的重要性，即当前的奖励机制更倾向于关注参与度而非实际内容。","讲者提到，对于没有相同技术背景的人，工程师应成为值得信赖的顾问，帮助他们理解技术并做出决策。","讲者通过朋友的例子说明，即使没有技术背景，也可以通过适当的技术工具和指导，实现有效的解决方案。","讲者最后提到，这种意外的成功令人惊喜，也说明了AI技术在实际应用中的潜力和价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5798.58,"end":5956.08,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5798.58,"text":"to kind of pull the data from all of the different sources they were pulling data from. There's, like, machines in what's called the pump room that has a compressor that cools the ice, and there were spreadsheets, and there was accounts, and all this kind of stuff. And he was not tech-savvy in any way, but he, like, needed to process all this data. So he did an experiment where he got ChatGPT to do it. And this was the loaded question, like, asking me was it any good. And so we talked through it a little bit, and then he told me why."},{"start":5825.05,"text":"And so I took a look at the results because he was uploading spreadsheets, he was uploading PDFs and all this kind of thing and getting it to assemble a report. And it takes him now about two hours to do the report himself with ChatGPT. And it worked and it worked brilliantly. And that $150,000 a year that he's saving on consulting is now going to underprivileged kids, right, for hockey equipment, for ice skating equipment, for lessons and all of that kind of thing. So it was taken out of the hands of an expensive consulting company and put into the hands of people because of this."},{"start":5854.34,"text":"guy, and he says he's the dumbest person alive, you know, but I hope he's not watching this video, but, and he's like, you know, but he, and I told him afterwards that, congratulations, you're now a developer, right, and he didn't like that, but, you know, but it's like surprises like that, that the superpowers that were handed to somebody like him, that he's not technical in any way, but he was able to effectively build a solution that saved his non-profit $100,000 to $150,000 a year, and like, things like that are all,"},{"start":5883.56,"text":"always surprising me in a very pleasant way. Yep. Sorry, I'll get to you next. Sorry. Yep."},{"start":5912.3,"text":"Yep, so just to repeat the question for the video, for engineers like us, sometimes it's easy to navigate the hype, to see the signal from the noise, but what about people who don't have the same training as us? I think that's our opportunity to be trusted advisors for them and to really help them through that to understand it. I think the biggest part in the hype story right now is just understanding the reward mechanism. Everything rewards engagement rather than actual substance. To me, step one is seeing through."},{"start":5941.9,"text":"that like the story I just told about my friend you know he'd seen all this kind of stuff but he wasn't willing to bet his career on it you know but he needed like that kind of advice around it and to kind of start peeling apart what he had done and what he did right and what he did wrong and you know so that"}],"speech_gaps":[],"frame":"../frames/v056/035.webp","frame_time":5810.58},{"title":"AI与机器学习在科研中的应用与注意事项","segments":[{"id":319,"text":"positioning ourselves to be trusted advisors by not leaning into the same mistakes that the untrained people may be leaning into, I think is the key to that. And just understanding that the average person is generally very intelligent, even if they may not be experts in a specific domain, and to key in on that intelligence and help them to foster and to grow that and navigate them through the parts where they'll have difficulty and let them shine in what they're very, very good at.","zh":"通过避免陷入那些未经训练的人可能犯的错误，使我们自己成为值得信赖的顾问，我认为这是关键。并且要理解到，普通人在一般情况下是非常聪明的，即使他们可能不是某个特定领域的专家，要抓住这种聪明才智，帮助他们培养和提升这种能力，在他们遇到困难的地方引导他们，并让他们在自己非常擅长的领域中发光发热。","start":5956.92,"end":5984.18},{"id":320,"text":"Over here, there was one. Okay. So AI and machine learning for scientific research, where is it a good idea and where should you be cautious? Ooh. My initial gut check would be I think it's always a good idea, right? I think, you know, there's no harm in using the tools that you have available to you, but to always to just double-check your results and double-check your expectations against the grounded reality.","zh":"在这里，有一个例子。好的。人工智能和机器学习在科学研究中，哪些地方是合适的，哪些地方需要谨慎？哦。我最初的直觉是，我认为在任何情况下使用它们都是个好主意，对吧？我认为，使用你所拥有的工具是没有害处的，但要始终检查你的结果和期望是否符合现实基础。","start":5986.09,"end":6026.76},{"id":321,"text":"I've always been a fan of using automation in research as much as possible. My undergraduate was physics many, many years ago, and I was actually very successful in the lab because I usually automated things through a computer that other people did handwriting and pen and paper with, so I could move quickly. So I know I'm biased in that regard, but I'd say for most research, for the most part, I think, use the most powerful tools you have available, but check your expectations.","zh":"我一直认为在研究中尽可能使用自动化是很好的。我的本科是很多年前的物理学，我当时在实验室里非常成功，因为我通常会通过计算机自动化一些其他人在纸上用笔完成的工作，这样我就能更快地进行工作。因此，我在这个方面是有偏见的，但我认为对于大多数研究来说，大部分情况下，使用你所拥有的最强大的工具，但要检查你的期望。","start":6028.3,"end":6054.74},{"id":322,"text":"Little story, actually, on that side was a trivia question. Poorest country in Western Europe. Anybody know? What's that? Western Europe. It's Wales.","zh":"实际上，关于这一点有一个小故事，是一个趣味问题。西欧最贫穷的国家是哪个？有人知道吗？西欧。是威尔士。","start":6059.44,"end":6072.24},{"id":323,"text":"So I actually did my undergraduate in Wales, and I went back to do some lectures in the university there. And I met with a researcher there, and he was doing research into brain cancer using computer imagery and using various types of computer imagery. And I asked him, well, what's the biggest problem that you have? What's the biggest blocker for your research? And this is about eight years ago. And his answer was access to a GPU.","zh":"我实际上是在威尔士完成的本科，之后我回去在那所大学做了一些讲座。我遇到了一位研究人员，他正在利用计算机成像技术研究脑癌，使用各种类型的计算机成像技术。我问他，你最大的问题是什么？你研究中的最大障碍是什么？这是大约八年前的事情。他的回答是访问GPU的权限。","start":6073.03,"end":6098.87},{"id":324,"text":"Because for him to be able to train his models and run his models, he needed to be able to access a GPA.","zh":"因为对他来说，要训练和运行他的模型，他需要能够访问一个GPU。","start":6100.94,"end":6105.68},{"id":325,"text":"So in his case, he would spend the entire time that wasn't Tuesday afternoon preparing everything for his model run or his model training or everything like that, and then Tuesday afternoon, once he had access to the GPU, then he would do the training. And then he would hope that in that time that he would train his model and he would get the results that he wanted, otherwise he'd have to wait a week.","zh":"所以在他的情况下，他会把除了周二下午之外的所有时间都用来准备他的模型运行或模型训练之类的事情，然后到了周二下午，一旦他能使用GPU，他就会开始训练。然后他希望在那段时间里训练他的模型并得到他想要的结果，否则他可能需要等待一周。","start":6106.94,"end":6135.16}],"notes":["本段主要讨论了AI和机器学习在科研中的应用，强调了使用自动化工具的重要性，并通过一个具体例子说明了GPU资源在科研中的关键作用。","讲者提到自己在大学期间通过自动化实验提高了效率，这表明自动化在科研中的实际价值。","讲者还提到一个研究人员因GPU资源不足而面临困难，说明了计算资源在机器学习研究中的重要性。","该例子中，研究人员每天只能使用GPU半天，且时间固定为周二下午，这导致他需要提前准备所有工作，以确保在有限的时间内完成模型训练。","讲者指出，如果模型训练未能在预定时间内完成，研究人员可能需要等待一周，这突显了资源分配对科研进度的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5956.92,"end":6135.16,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5956.92,"text":"positioning ourselves to be trusted advisors by not leaning into the same mistakes that the untrained people may be leaning into, I think is the key to that. And just understanding that the average person is generally very intelligent, even if they may not be experts in a specific domain, and to key in on that intelligence and help them to foster and to grow that and navigate them through the parts where they'll have difficulty and let them shine in what they're very, very good at."},{"start":5986.09,"text":"Over here, there was one. Okay. So AI and machine learning for scientific research, where is it a good idea and where should you be cautious? Ooh. My initial gut check would be I think it's always a good idea, right? I think, you know, there's no harm in using the tools that you have available to you, but to always to just double-check your results and double-check your expectations against the grounded reality."},{"start":6028.3,"text":"I've always been a fan of using automation in research as much as possible. My undergraduate was physics many, many years ago, and I was actually very successful in the lab because I usually automated things through a computer that other people did handwriting and pen and paper with, so I could move quickly. So I know I'm biased in that regard, but I'd say for most research, for the most part, I think, use the most powerful tools you have available, but check your expectations."},{"start":6059.44,"text":"Little story, actually, on that side was a trivia question. Poorest country in Western Europe. Anybody know? What's that? Western Europe. It's Wales."},{"start":6073.03,"text":"So I actually did my undergraduate in Wales, and I went back to do some lectures in the university there. And I met with a researcher there, and he was doing research into brain cancer using computer imagery and using various types of computer imagery. And I asked him, well, what's the biggest problem that you have? What's the biggest blocker for your research? And this is about eight years ago. And his answer was access to a GPU."},{"start":6100.94,"text":"Because for him to be able to train his models and run his models, he needed to be able to access a GPA."},{"start":6106.94,"text":"and the department that he was in had one GPU between 10 researchers, which meant that everybody got it for half a day, Monday through Friday, and his half a day was Tuesday afternoon. So in his case, he would spend the entire time that wasn't Tuesday afternoon preparing everything for his model run or his model training or everything like that, and then Tuesday afternoon, once he had access to the GPU, then he would do the training. And then he would hope that in that time that he would train his model and he would get the results that he wanted, otherwise he'd have to wait a week."}],"speech_gaps":[],"frame":"../frames/v056/036.webp","frame_time":5968.92},{"title":"AI作为社会平等或不平等的工具","segments":[{"id":326,"text":"get access to the GPU again. And then I showed them Google Colab. Anybody ever use Google Colab? And you can have...","zh":"再次获得对GPU的访问权限。然后我向他们展示了Google Colab。有人曾经使用过Google Colab吗？你可以拥有...","start":6135.88,"end":6143.2},{"id":327,"text":"a GPU in the cloud for free with that kind of thing. And the poor guy's brain melted, right? Because I took out my phone and I showed him a notebook running on my phone in Google Colab and training it on that. And it changed everything for him research-wise. And now it was a case of, and this was with free Colab, he had much more than he had with his shared GPU. So I think for someone like him, machine learning was an important part of his research, but he was so gated on it that the ability to widen access to that ended up...","zh":"改变了他的一切。现在这是一个案例，而且这是使用免费Colab的情况，他拥有的资源比他共享GPU时要多得多。因此，对于像他这样的人来说，机器学习是其研究的重要组成部分，但他却因为被限制而无法接触到它，而扩大对这种资源的访问能力最终...","start":6143.46,"end":6172.78},{"id":328,"text":"like really really advancing his research I don't know where it ended up","zh":"我不知道他做了什么，从那以后已经过去几年了，但你知道的","start":6172.78,"end":6175.68},{"id":329,"text":"I don't know what he has done it has been a few years since then but you know","zh":"当你问这个问题时，这个故事就浮现在脑海里，还有更多问题吗？","start":6175.68,"end":6178.94},{"id":330,"text":"that story just came to mind when you ask the question any more questions any","zh":"随时可以问我任何问题，好的，前面这边","start":6178.94,"end":6185.24},{"id":331,"text":"feel free to ask me anything okay at the front here","zh":"所以，人工智能能成为社会平等或社会不平等的力量吗？","start":6185.24,"end":6191.84},{"id":332,"text":"So can AI be a force of social equality or social inequality?","zh":"我认为这个问题的答案是肯定的。","start":6203.52,"end":6207.34},{"id":333,"text":"I think the answer to that is yes.","zh":"我认为答案是肯定的。","start":6208.0,"end":6210.28},{"id":334,"text":"It can be both, and it can be neither.","zh":"它可以既是，也可以都不是。","start":6210.96,"end":6213.18},{"id":335,"text":"I mean, I think that ultimately the idea is that if, in my opinion,","zh":"我的意思是，我认为最终的想法是，如果，按照我的观点，","start":6213.56,"end":6217.94},{"id":336,"text":"any tool can be used for any means,","zh":"任何工具都可以被用于任何目的，","start":6218.62,"end":6221.14},{"id":337,"text":"so the important thing is to educate and inspire people","zh":"因此，重要的事情是教育和激励人们","start":6221.36,"end":6224.56},{"id":338,"text":"towards using things for the correct means.","zh":"以正确的方式使用这些工具。","start":6224.56,"end":6226.84},{"id":339,"text":"There's only so much governance can be applied,","zh":"政府所能施加的治理只到一定程度，","start":6227.38,"end":6229.58},{"id":340,"text":"and sometimes governance can cause more problems,","zh":"有时治理所带来的问题，","start":6229.76,"end":6232.64},{"id":341,"text":"than it solves. So I always love to live my life by assuming good intent, but preparing for bad","zh":"比它解决的问题还要多。因此，我总是喜欢在生活中假设善意，但为恶意做好准备。","start":6232.78,"end":6240.98},{"id":342,"text":"intent. And in the case of AI, I don't think there's any difference there, that everything","zh":"意图。在AI的情况下，我认为在这方面没有区别，即我所做的每一件事以及我所建议的每一件事都是基于良好的意图，即人们会将其用于好的事情","start":6240.98,"end":6245.12},{"id":343,"text":"that I would do and everything that I would advise is assuming good intent, that people would use it","zh":"但也需要准备好它可能被滥用。我之前展示的不良例子，我认为更多是出于良好意图而非不良意图，而我所看到的大多数错误","start":6245.12,"end":6249.46},{"id":344,"text":"for good things, but also to be prepared for it to be misused. The bad examples that I showed earlier","zh":"更像是良好意图被错误使用，而不是不良意图，但","start":6249.46,"end":6256.36},{"id":345,"text":"on I think we're good intent rather than bad intent and most mistakes that I see","zh":"我说，这是我能给出的唯一箴言，也是我能提供的唯一建议","start":6256.36,"end":6262.46},{"id":346,"text":"like that are good intent being used mistakenly as opposed to bad intent but","zh":"那就是这种类型的事情总是要假设良好意图，但也要为不良意图做好准备","start":6262.46,"end":6266.94},{"id":347,"text":"I would say that's the only mantra that I can the only advice that I can give","zh":"AI本身没有选择，对吧？它是人们如何使用它。安德鲁，你","start":6266.94,"end":6270.9},{"id":348,"text":"and that kind of thing is always assume good intent but prepare for bad intent","zh":"有没有","start":6270.9,"end":6275.22},{"id":349,"text":"the AI itself has no choice all right it's how people use it Andrew did you","zh":"AI本身没有选择，对吧，它是人们如何使用它，安德鲁，你有没有","start":6276.54,"end":6283.9},{"id":350,"text":"Do you want closing comments, or?","zh":"你想听总结性的评论，还是其他内容？","start":6283.9,"end":6285.12},{"id":351,"text":"All right, thank you, Andrew.","zh":"好的，谢谢，安德鲁。","start":6296.26,"end":6297.48}],"notes":["本段讨论了AI作为社会平等或不平等工具的双重可能性。讲者认为AI可以同时是促进社会平等或加剧社会不平等的工具，也可以既不是。这取决于人们如何使用AI，而不是AI本身。","讲者强调了教育和引导的重要性，认为教育和激励人们正确使用AI是关键。他提到，治理在AI的使用中只能起到有限的作用，有时甚至可能带来更多的问题。","讲者提出了一个核心的建议，即假设人们有良好的意图，但也要为可能的恶意使用做好准备。他指出，大多数错误是由于良好意图的误用，而不是恶意意图。","讲者认为AI本身没有选择，它只是工具，真正决定其影响的是人们如何使用它。他提到，无论是他本人还是他建议的，都基于这一假设。","讲者最后提到，他希望听众能够理解这一观点，并在实际应用中加以考虑。","讲者通过一个关于Google Colab的案例，说明了技术访问的平等性如何影响研究进展，从而引出AI作为社会工具的讨论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6135.88,"end":6297.48,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":6135.88,"text":"get access to the GPU again. And then I showed them Google Colab. Anybody ever use Google Colab? And you can have..."},{"start":6143.46,"text":"a GPU in the cloud for free with that kind of thing. And the poor guy's brain melted, right? Because I took out my phone and I showed him a notebook running on my phone in Google Colab and training it on that. And it changed everything for him research-wise. And now it was a case of, and this was with free Colab, he had much more than he had with his shared GPU. So I think for someone like him, machine learning was an important part of his research, but he was so gated on it that the ability to widen access to that ended up..."},{"start":6172.78,"text":"like really really advancing his research I don't know where it ended up"},{"start":6175.68,"text":"I don't know what he has done it has been a few years since then but you know"},{"start":6178.94,"text":"that story just came to mind when you ask the question any more questions any"},{"start":6185.24,"text":"feel free to ask me anything okay at the front here"},{"start":6203.52,"text":"So can AI be a force of social equality or social inequality?"},{"start":6208.0,"text":"I think the answer to that is yes."},{"start":6210.96,"text":"It can be both, and it can be neither."},{"start":6213.56,"text":"I mean, I think that ultimately the idea is that if, in my opinion,"},{"start":6218.62,"text":"any tool can be used for any means,"},{"start":6221.36,"text":"so the important thing is to educate and inspire people"},{"start":6224.56,"text":"towards using things for the correct means."},{"start":6227.38,"text":"There's only so much governance can be applied,"},{"start":6229.76,"text":"and sometimes governance can cause more problems,"},{"start":6232.78,"text":"than it solves. So I always love to live my life by assuming good intent, but preparing for bad"},{"start":6240.98,"text":"intent. And in the case of AI, I don't think there's any difference there, that everything"},{"start":6245.12,"text":"that I would do and everything that I would advise is assuming good intent, that people would use it"},{"start":6249.46,"text":"for good things, but also to be prepared for it to be misused. The bad examples that I showed earlier"},{"start":6256.36,"text":"on I think we're good intent rather than bad intent and most mistakes that I see"},{"start":6262.46,"text":"like that are good intent being used mistakenly as opposed to bad intent but"},{"start":6266.94,"text":"I would say that's the only mantra that I can the only advice that I can give"},{"start":6270.9,"text":"and that kind of thing is always assume good intent but prepare for bad intent"},{"start":6276.54,"text":"the AI itself has no choice all right it's how people use it Andrew did you"},{"start":6283.9,"text":"Do you want closing comments, or?"},{"start":6296.26,"text":"All right, thank you, Andrew."}],"speech_gaps":[{"start":6285.616,"end":6287.408}],"frame":"../frames/v056/037.webp","frame_time":6147.88}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v056.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
