e by this time next year from a single prompt we'll be able to do 90 minutes of video and so bye-bye Hollywood you know like so the whole Hollywood is dead meme I think came out of that first of all we can't do 90 minutes even two years later from a prompt and even if you did what kind of prompt would be able to tell you a full story of a movie right so"},{"id":226,"text":"This type of hype leads to engagement. This type of hype leads to attention. But my encouragement to you is to peel that apart. Look for the signal. Ask the why question. Ask the what question and move on from there. So becoming that trusted advisor. World's drowning in hype. How do you do it? Look at the trends, evaluate them objectively. Look at the genuine opportunities that are out there."},{"id":227,"text":"There are fashionable distractions. I don't know what the next one is going to be, but there are these distractions that are out there that will get you lots of engagement on social media. Ignore them and ignore the people that are leaning into them. And then really lean into your skills about explaining technical reality to leadership."},{"id":228,"text":"One skill that one person coached me in once that I thought was really interesting, because it sounded wrong but it ended up being right, was whenever you see something like this, try to figure out how to make it as mundane as possible."},{"id":229,"text":"When you can figure out how to make it as mundane as possible, then you really begin to build the grounding for being able to explain it in detail in ways that people need to understand, right? Like if you go and you look at, you know, I think Gemini 3 was released today, but there were leaks earlier this week, and one person kind of leaked that I built a Minecraft clone and a prompt, you know, that kind of stuff. This is the opposite of mundane."}],"notes":["本段讨论了AI领域中炒作现象的典型例子，如‘好莱坞已死’的言论。讲者指出，这种炒作往往夸大了技术能力，例如声称通过单个提示可以生成90分钟的视频，而实际上目前技术还无法实现。这提醒听众要区分炒作与现实，避免被误导。","讲者强调，面对技术炒作时，应保持批判性思维，通过提问‘为什么’和‘是什么’来辨别信号。这有助于识别真正有价值的技术趋势，而不是被短暂的热点所吸引。","讲者提到，技术炒作往往带来大量关注，但真正的职业发展应建立在对技术本质的理解上。这包括能够向领导层清晰解释技术现实的能力，而不是追逐社交媒体上的流行话题。","讲者分享了一个技巧，即尝试将技术概念变得‘平凡’，这有助于深入理解并有效传达给他人。例如，将复杂的AI模型简化为日常应用，如Minecraft克隆游戏，这与‘平凡’的概念相悖，说明了技术炒作的夸张性。","讲者指出，技术炒作往往伴随着短暂的热度，但真正的技术突破需要时间和深入研究。例如，生成视频技术在两年前是热点，但如今已变得普通，说明技术发展具有周期性。","讲者鼓励听众专注于技术本质，而不是被炒作所吸引。这包括识别真正有价值的技术趋势，忽略短暂的热点，并通过深入理解技术来建立专业信任。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3901.47,"end":4077.74,"asr_flags":[],"raw_segments":[{"start":3901.47,"text":"And the main reason for that is that they're not well scoped, people are jumping on the hype bandwagon, and they're not really understanding their way through the problem. And I think the big brains in this room and the network that you folks have, a really key component of being able to succeed is to understand your way through that problem. So that was a hype example around Agentic that I was thankfully able to help this company through."},{"start":3925.96,"text":"Other recent hype examples, you've probably seen the software engineering is dead. My personal favorite, Hollywood is dead, or AGI by year end."},{"start":3934.73,"text":"I was in Saudi Arabia this time last year at a thing called the FII. And it was a dinner at the FII. And I sat beside the CEO of a company who I'm not going to name. But this was a CEO of a generative AI company. And at that time, he was showing everybody around the table this thing that he'd done where it was text to video. And he could put in a text prompt and get video out of the prompt and get about six seconds worth of video out of it. A year ago, that was..."},{"start":3961.48,"text":"I beg your pardon, two years ago. Two years ago, that was hot stuff. Nowadays, obviously, it's quite passe. Anybody can do it. But he made a comment at that table, and it was a lot of like..."},{"start":3971.81,"text":"media executives at that table is like by this time next year from a single prompt we'll be able to do 90 minutes of video and so bye-bye Hollywood you know like so the whole Hollywood is dead meme I think came out of that first of all we can't do 90 minutes even two years later from a prompt and even if you did what kind of prompt would be able to tell you a full story of a movie right so"},{"start":3993.55,"text":"This type of hype leads to engagement. This type of hype leads to attention. But my encouragement to you is to peel that apart. Look for the signal. Ask the why question. Ask the what question and move on from there. So becoming that trusted advisor. World's drowning in hype. How do you do it? Look at the trends, evaluate them objectively. Look at the genuine opportunities that are out there."},{"start":4020.33,"text":"There are fashionable distractions. I don't know what the next one is going to be, but there are these distractions that are out there that will get you lots of engagement on social media. Ignore them and ignore the people that are leaning into them. And then really lean into your skills about explaining technical reality to leadership."},{"start":4039.33,"text":"One skill that one person coached me in once that I thought was really interesting, because it sounded wrong but it ended up being right, was whenever you see something like this, try to figure out how to make it as mundane as possible."},{"start":4052.14,"text":"When you can figure out how to make it as mundane as possible, then you really begin to build the grounding for being able to explain it in detail in ways that people need to understand, right? Like if you go and you look at, you know, I think Gemini 3 was released today, but there were leaks earlier this week, and one person kind of leaked that I built a Minecraft clone and a prompt, you know, that kind of stuff. This is the opposite of mundane."}],"speech_gaps":[],"frame":"../frames/v056/024.webp","frame_time":3913.47},{"title":"深度学习中的职业建议与技术洞察","segments":[{"id":230,"text":"This was massively hyping the thing, massively showing, and of course they didn't. They built a flashy demo. They didn't really build a Minecraft clone. But the idea here is if you can peel that apart to like, okay, how do I think about what are the mundane things that are happening here? The one that I've been working with a lot recently is video. So text-to-video prompts, as I've mentioned, instead of the magical, you can do whatever you want, all nice and fluffy, Hollywood is dead."},{"id":231,"text":"What is the mundane element of doing text-to-video? The mundane element of doing text-to-video is that when you train a model to create video from a text prompt, what it is doing is it's creating a number of successive frames, and each of those successive frames is going to be slightly different from the frame before."},{"id":232,"text":"And you've trained a model by looking at video to say, well, if in frame one the person's hand's like this, in frame two it's like that, then you can predict it moves this way if there's a matching prompt. And suddenly it's become a little bit more mundane, but suddenly they begin to understand it. And then the people who are experts in that specific field, not the technical side of it, are now the ones that will actually be able to come up and do brilliant things with it. So that hype navigation strategy, filter actively, go deep on the fundamentals."},{"id":233,"text":"get your slides to work and then of course keep your finger on the pulse"},{"id":234,"text":"The hardest part of that, I think, is the third one, is really keeping your finger on the pulse. And that's when you have to wade into those cesspits of people like just farming engagement and really try to figure out the signal from the noise there. But I think it's really important for you to be able to do that, to be connected, to understand that. Reading papers is all very good. The signal-to-noise ratio, I think, in reading papers is a lot better. But to understand the landscape that the people that you are advising, they are the ones who are wading in the cesspits of Twitter and X and LinkedIn. And there's nothing wrong with those people."},{"id":235,"text":"platforms in and of themselves, but the stuff that's posted on those platforms. So overall landscape, it is ripe with opportunity, absolutely ripe with opportunity. So I would encourage you, as Andrew did, to continue learning, to continue digging into what you can do, and to continue building. But there are risks ahead, right? Anybody remember the movie Titanic?"},{"id":236,"text":"Remember the famous phrase in that? Iceberg right ahead. But immediately before that, there's a scene in Titanic. If we weren't being filmed, I would show it, but I can't for copyright reasons, where the two guys up in the crow's nests are kind of like freezing and talking. And like the crow's nest at the top of the ship is where the spotters would be to spot any icebergs in front. And go back and watch the movie again. You'll see the conversation between these two guys is that all they're talking about is how cold they are."}],"notes":["本段主要讨论了在AI领域中如何区分技术炒作与实际应用，强调了深入理解基础概念的重要性。讲者提到，视频生成技术虽然看似神奇，但其核心在于连续帧之间的细微变化，这需要对基础原理有深刻理解。","讲者指出，技术炒作往往掩盖了技术的实质，例如视频生成模型并非像宣传的那样可以实现任何想象中的效果，而是通过学习视频数据中的帧间变化规律来生成连续画面。","讲者进一步强调，真正能够利用这些技术的人是那些在特定领域有深入理解的专家，而不是仅仅依赖技术本身的人。这表明，技术的真正价值在于其应用和理解，而非表面的炒作。","讲者提到，保持对行业动态的敏感度非常重要，这包括关注社交媒体和专业平台上的信息，从中提取有价值的内容。这表明，技术发展不仅依赖于学术研究，也依赖于对实际应用环境的了解。","讲者以电影《泰坦尼克号》中的场景为例，强调了对潜在风险的警觉。这表明，在技术发展过程中，需要保持对潜在问题的敏感度，避免盲目乐观。","最后，讲者鼓励继续学习和探索，同时提醒注意潜在的风险。这表明，技术发展需要持续的努力和谨慎的态度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4078.34,"end":4238.96,"asr_flags":[],"raw_segments":[{"start":4078.34,"text":"This was massively hyping the thing, massively showing, and of course they didn't. They built a flashy demo. They didn't really build a Minecraft clone. But the idea here is if you can peel that apart to like, okay, how do I think about what are the mundane things that are happening here? The one that I've been working with a lot recently is video. So text-to-video prompts, as I've mentioned, instead of the magical, you can do whatever you want, all nice and fluffy, Hollywood is dead."},{"start":4105.76,"text":"What is the mundane element of doing text-to-video? The mundane element of doing text-to-video is that when you train a model to create video from a text prompt, what it is doing is it's creating a number of successive frames, and each of those successive frames is going to be slightly different from the frame before."},{"start":4122.99,"text":"And you've trained a model by looking at video to say, well, if in frame one the person's hand's like this, in frame two it's like that, then you can predict it moves this way if there's a matching prompt. And suddenly it's become a little bit more mundane, but suddenly they begin to understand it. And then the people who are experts in that specific field, not the technical side of it, are now the ones that will actually be able to come up and do brilliant things with it. So that hype navigation strategy, filter actively, go deep on the fundamentals."},{"start":4152.96,"text":"get your slides to work and then of course keep your finger on the pulse"},{"start":4156.41,"text":"The hardest part of that, I think, is the third one, is really keeping your finger on the pulse. And that's when you have to wade into those cesspits of people like just farming engagement and really try to figure out the signal from the noise there. But I think it's really important for you to be able to do that, to be connected, to understand that. Reading papers is all very good. The signal-to-noise ratio, I think, in reading papers is a lot better. But to understand the landscape that the people that you are advising, they are the ones who are wading in the cesspits of Twitter and X and LinkedIn. And there's nothing wrong with those people."},{"start":4185.74,"text":"platforms in and of themselves, but the stuff that's posted on those platforms. So overall landscape, it is ripe with opportunity, absolutely ripe with opportunity. So I would encourage you, as Andrew did, to continue learning, to continue digging into what you can do, and to continue building. But there are risks ahead, right? Anybody remember the movie Titanic?"},{"start":4212.74,"text":"Remember the famous phrase in that? Iceberg right ahead. But immediately before that, there's a scene in Titanic. If we weren't being filmed, I would show it, but I can't for copyright reasons, where the two guys up in the crow's nests are kind of like freezing and talking. And like the crow's nest at the top of the ship is where the spotters would be to spot any icebergs in front. And go back and watch the movie again. You'll see the conversation between these two guys is that all they're talking about is how cold they are."}],"speech_gaps":[],"frame":"../frames/v056/025.webp","frame_time":4090.34},{"title":"AI行业的泡沫与机遇","segments":[{"id":237,"text":"And then it cuts away to the crew of the ship who are like, wait, aren't they supposed to have binoculars? And then the crew is like, oh, we left the binoculars behind in port. That framing the whole idea was like they were so arrogant in being able to move forward that they didn't want to look out for any particular risks. And even though they had people whose job it was to look out for risks, they didn't properly equip or train them. And that, to me, is a really good metaphor for where the AI industry is today. There are risks in front of us."},{"id":238,"text":"those risks, the B word, the bubble word, you're probably reading in the news, are there. To me, though, the opportunity and the things to think about in terms of a bubble are, most of you probably don't remember the dot-com bubble of the 2000s, but if you think about the dot-com bubble, that was the biggest bubble in history. It burst, but we're still here."},{"id":239,"text":"And the people who did dot-com rights not only survived, they thrived. Amazon, Google, they did it right. They understood the fundamentals of what it was to build a dot-com. They understood the fundamentals of what it was to build a business on dot-com. And when the bubble of hype burst, they didn't go with it. There was one website, I believe it was pets.com, that they had the mindset of, if you build it, they will come. They had Super Bowl commercials around pets.com."},{"id":240,"text":"They couldn't handle the traffic that they got. And that was the kind of site that when the bubble burst, those were the kind of sites that just evaporated. So that bubble in AI is likely coming. There is always a bubble. So the companies that are doing AI right are the ones, like I said, that won't just avoid the bubble, that they will actually thrive post-bubble. And the people who are doing AI right."},{"id":241,"text":"The folks in this room who are thinking about AI and how you bring it to your company and the advice that you're giving to your company and leaning into that in the right way will also be the ones who not only avoid getting laid off in the bubble crashes, but will be the ones who will thrive through and after the bubble. So anatomy of any bubble, and what I'm seeing in the AI one in particular, is this kind of pyramid. At the top is the hype that I've been talking about. At the bottom is massive VC investment."},{"id":242,"text":"I'll be frank, I'm already seeing that drying up."},{"id":243,"text":"Right? You know, once upon a time, you could go out with anything that had AI written on it and get VC investment. Then you could go out and do anything within LLM and get VC investment. Now they're far, far, far more cautious. I've been advising a lot of startups. The amount that they're getting invested is being scaled back. The stuff that's being invested in is changing. And, you know, the second layer down, massive VC investment is already beginning to vanish."}],"notes":["本段讲授了AI行业当前面临的泡沫风险，通过类比2000年代的互联网泡沫，指出AI行业可能正在经历类似的阶段。讲者强调，泡沫的形成通常伴随着过度的乐观预期和大量投资，但最终会因现实问题而破裂。","讲者指出，那些在泡沫中成功的企业，如亚马逊和谷歌，是那些真正理解业务本质并建立稳固基础的企业。他们没有盲目追逐短期的炒作，而是专注于长期价值的创造。","讲者提到，泡沫的结构通常呈现金字塔形，顶部是过度的炒作，底部则是大量的风险投资。当前，AI行业的风险投资正在逐渐减少，这表明泡沫可能正在形成。","讲者强调，那些在AI领域正确行事的人，不仅能够避免在泡沫破裂时被裁员，还能在泡沫之后继续繁荣。这包括那些在公司内部推动AI应用并提供正确建议的人。","讲者指出，AI行业的泡沫与互联网泡沫有相似之处，但也有其独特性。泡沫的破裂可能导致大量初创公司倒闭，而那些真正理解AI价值的企业则能幸存并发展。","讲者最后提到，当前的风险投资正在变得更加谨慎，这表明AI行业的泡沫可能正在形成，但尚未达到顶峰。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4239.77,"end":4413.01,"asr_flags":[],"raw_segments":[{"start":4239.77,"text":"And then it cuts away to the crew of the ship who are like, wait, aren't they supposed to have binoculars? And then the crew is like, oh, we left the binoculars behind in port. That framing the whole idea was like they were so arrogant in being able to move forward that they didn't want to look out for any particular risks. And even though they had people whose job it was to look out for risks, they didn't properly equip or train them. And that, to me, is a really good metaphor for where the AI industry is today. There are risks in front of us."},{"start":4268.63,"text":"those risks, the B word, the bubble word, you're probably reading in the news, are there. To me, though, the opportunity and the things to think about in terms of a bubble are, most of you probably don't remember the dot-com bubble of the 2000s, but if you think about the dot-com bubble, that was the biggest bubble in history. It burst, but we're still here."},{"start":4296.57,"text":"And the people who did dot-com rights not only survived, they thrived. Amazon, Google, they did it right. They understood the fundamentals of what it was to build a dot-com. They understood the fundamentals of what it was to build a business on dot-com. And when the bubble of hype burst, they didn't go with it. There was one website, I believe it was pets.com, that they had the mindset of, if you build it, they will come. They had Super Bowl commercials around pets.com."},{"start":4326.29,"text":"They couldn't handle the traffic that they got. And that was the kind of site that when the bubble burst, those were the kind of sites that just evaporated. So that bubble in AI is likely coming. There is always a bubble. So the companies that are doing AI right are the ones, like I said, that won't just avoid the bubble, that they will actually thrive post-bubble. And the people who are doing AI right."},{"start":4353.14,"text":"The folks in this room who are thinking about AI and how you bring it to your company and the advice that you're giving to your company and leaning into that in the right way will also be the ones who not only avoid getting laid off in the bubble crashes, but will be the ones who will thrive through and after the bubble. So anatomy of any bubble, and what I'm seeing in the AI one in particular, is this kind of pyramid. At the top is the hype that I've been talking about. At the bottom is massive VC investment."},{"start":4382.21,"text":"I'll be frank, I'm already seeing that drying up."},{"start":4384.61,"text":"Right? You know, once upon a time, you could go out with anything that had AI written on it and get VC investment. Then you could go out and do anything within LLM and get VC investment. Now they're far, far, far more cautious. I've been advising a lot of startups. The amount that they're getting invested is being scaled back. The stuff that's being invested in is changing. And, you know, the second layer down, massive VC investment is already beginning to vanish."}],"speech_gaps":[],"frame":"../frames/v056/026.webp","frame_time":4251.77},{"title":"AI行业趋势与职业建议","segments":[{"id":244,"text":"Unrealistic valuations. Companies that aren't making money being valued massively high. We all know who they are. We're beginning to see those unrealistic valuations being fed off of that hype. Me Too products, where somebody does something and it's successful and everybody jumps on the bandwagon. We're also seeing them everywhere. We saw them throughout the dot-com bubble. And then right at the bottom is that real value."},{"id":245,"text":"You know, I probably shouldn't have done the triangle like this. It should be more an upside-down triangle, right, because, you know, the real value here is small. I vibe-coded these slides into existence, so this is one of the technical debt I took on. You know, but the real value there, that kernel of value is there, and the ones that build for that will be the ones that survive. So..."},{"id":246,"text":"The direction that I see the AI industry going in and the direction that I would encourage you to start thinking about your skills in is really over the next five years, there's going to be a bifurcation. I'm just going to be ornery in how I describe it as big and small. Big AI will be what we see today with the large language models getting bigger in the desire to drive towards AGI."},{"id":247,"text":"The Geminis, the Claudes, the open AIs of the world are going to continue to drive bigger. And bigger is better in the mindset of those companies towards achieving AGI or towards achieving better business value. That's going to be one side of the branch. The other side of the branch is I'm going to call it small. We've all seen open source models. I hate the term open source. Let me call them open weights or let me call them self-hostable models. They're exploding onto the landscape."},{"id":248,"text":"I read an article recently about Y Combinator that 80% of the companies in Y Combinator were using small models from China in particular. So the Chinese models in particular are doing really well, probably because of the overall landscape there, not leaning into the large models the same way as the West is. I see that bifurcation happening. China, I think, has that head start on the small models. That may last, it may not."},{"id":249,"text":"I don't know, but the point is we're heading in that particular direction of, I'm going to call them instead of big and small now, models that are hosted on your behalf by somebody else, like a GPT or a Gemini or a Claude, or models that you can host yourself for your own needs. As this side right now is underserved, this bubble may burst."},{"id":250,"text":"This one right now is underserved, and this bubble will be later on. And the major skills that I can see developers needing over the next two to three years on this side of the fence will be fine-tuning."}],"notes":["本段讨论了AI行业中的不现实估值现象，指出一些未盈利的公司被高估，这种现象在科技泡沫中曾出现过。讲者提到‘Me Too’产品，即模仿成功产品而缺乏创新，导致市场泡沫。真实价值在底部，而这些泡沫可能最终破裂。","讲者提到自己在制作幻灯片时使用了‘vibe-coded’（即凭感觉或直觉制作），这属于技术债务。他强调真正的价值核心存在，而能够围绕这一核心构建的公司将生存下来。","讲者预测未来五年AI行业将出现分化，分为‘大AI’和‘小AI’两个方向。‘大AI’指的是大型语言模型，它们会继续扩大规模以追求通用人工智能（AGI）和商业价值。‘小AI’则指开源模型，讲者认为应称为‘开放权重’或‘自托管模型’。","讲者提到中国在小模型领域有先发优势，因为中国公司较少依赖大型模型，这可能使他们在小模型领域领先。但这种优势是否持久尚不确定。","讲者指出，当前市场对‘托管模型’（由第三方提供）和‘自托管模型’（用户自行部署）的需求尚未被充分满足，这可能导致泡沫破裂。他建议开发者未来两年到三年内应掌握模型微调技能。","讲者强调，AI行业正在向两个方向发展，开发者需要关注这两个方向，并提升相应技能。他提到‘技术债务’和‘泡沫’等概念，提醒听众注意行业趋势和潜在风险。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4414.32,"end":4573.72,"asr_flags":[],"raw_segments":[{"start":4414.32,"text":"Unrealistic valuations. Companies that aren't making money being valued massively high. We all know who they are. We're beginning to see those unrealistic valuations being fed off of that hype. Me Too products, where somebody does something and it's successful and everybody jumps on the bandwagon. We're also seeing them everywhere. We saw them throughout the dot-com bubble. And then right at the bottom is that real value."},{"start":4438.1,"text":"You know, I probably shouldn't have done the triangle like this. It should be more an upside-down triangle, right, because, you know, the real value here is small. I vibe-coded these slides into existence, so this is one of the technical debt I took on. You know, but the real value there, that kernel of value is there, and the ones that build for that will be the ones that survive. So..."},{"start":4461.97,"text":"The direction that I see the AI industry going in and the direction that I would encourage you to start thinking about your skills in is really over the next five years, there's going to be a bifurcation. I'm just going to be ornery in how I describe it as big and small. Big AI will be what we see today with the large language models getting bigger in the desire to drive towards AGI."},{"start":4484.84,"text":"The Geminis, the Claudes, the open AIs of the world are going to continue to drive bigger. And bigger is better in the mindset of those companies towards achieving AGI or towards achieving better business value. That's going to be one side of the branch. The other side of the branch is I'm going to call it small. We've all seen open source models. I hate the term open source. Let me call them open weights or let me call them self-hostable models. They're exploding onto the landscape."},{"start":4514.04,"text":"I read an article recently about Y Combinator that 80% of the companies in Y Combinator were using small models from China in particular. So the Chinese models in particular are doing really well, probably because of the overall landscape there, not leaning into the large models the same way as the West is. I see that bifurcation happening. China, I think, has that head start on the small models. That may last, it may not."},{"start":4538.33,"text":"I don't know, but the point is we're heading in that particular direction of, I'm going to call them instead of big and small now, models that are hosted on your behalf by somebody else, like a GPT or a Gemini or a Claude, or models that you can host yourself for your own needs. As this side right now is underserved, this bubble may burst."},{"start":4561.4,"text":"This one right now is underserved, and this bubble will be later on. And the major skills that I can see developers needing over the next two to three years on this side of the fence will be fine-tuning."}],"speech_gaps":[],"frame":"../frames/v056/027.webp","frame_time":4426.32},{"title":"AI领域职业建议：模型应用与技能多样化","segments":[{"id":251,"text":"So the ability to take an open source model and fine-tune it for particular downstream tasks. Let me give one concrete example of that that I've personally experienced. I work a lot in Hollywood, and I've worked a lot with studios making movies. And one studio in particular, I was lucky enough to sell a movie to. It's still in pre-production. It'll probably be in pre-production forever."},{"id":252,"text":"One of the things I learned as part of that process was IP in studios is so protected. It's not even funny."},{"id":253,"text":"Go and Google for James Cameron who created Avatar and the lawsuits that he's involved in of this person who apparently sent him a story many years ago about blue aliens and is now suing him for billions of dollars because obviously there were blue aliens in Avatar. The level of IP protection in Hollywood is insane. The opportunity with large language models is equally insane."},{"id":254,"text":"A lot of the focus is on large language models for creation, for storytelling, for rendering and all that. But actually the major opportunity that they have is actually for analysis. To take a look at synopses of movies and find out what works and what doesn't. Why was this movie a hit and this one wasn't? What time of year was this one released and it became successful and this one wasn't? And with the margin on movies being razor thin, that kind of analysis is huge. But in order to do that kind of analysis, you need to share the details."},{"id":255,"text":"Be a movie with a large language model. And they will absolutely not do that with a GPT or a Gemini or whatever, because they're now sharing their IP with a third party."},{"id":256,"text":"Enter small models where they can self-host their own small model, and they are getting smarter and smarter. The 7B model of today is as smart as the 50B model of yesterday. A year from now, the 7B model of a year from now will be as smart as the 300B model of yesteryear. So they're moving in that direction of building using small..."},{"id":257,"text":"Self-hosted models, which they can then fine tune on downstream tasks. Similar with other things where privacy is important, law offices, medical offices, all of those kind of things. So those type of skills are fundamentally important going forward. So that's the bifurcation that I'm seeing happening in AI. The sooner bubble, I think, is in the bigger."},{"id":258,"text":"Non-self-hosted. The later bubble is in the smaller self-hosted. But either way, for your"},{"id":259,"text":"Career to avoid the impact of any bubble bursting, focus on the fundamentals. Build those real"},{"id":260,"text":"Solutions. Understand the business side. And most of all, diversify your skills. Don't be that one"},{"id":261,"text":"Trick pony who only knows how to do one thing. I've worked with brilliant people who are fantastic"},{"id":262,"text":"At coding a particular API or particular framework. And then the industry moved on and they got left"},{"id":263,"text":"Left behind. Okay, so yeah, when bubbles burst, that overall fallout, kind of spoken about it a"},{"id":264,"text":"Little bit already, funding evaporates, hiring freezes become layoffs, projects get cancelled,"},{"id":265,"text":"And talent floods the market. Yep."}],"notes":["本段讨论了AI在电影行业中的应用，特别是大型语言模型在分析电影剧本和市场表现方面的潜力。讲者提到，虽然大型语言模型在创作和故事叙述方面受到关注，但其真正的价值在于分析，例如分析电影概要以判断哪些元素成功，哪些失败。这种分析对于电影行业至关重要，因为电影的利润空间非常狭窄。","讲者指出，由于知识产权保护非常严格，电影公司不会将他们的数据交给第三方模型，如GPT或Gemini，因此他们倾向于使用自托管的小型模型。这些模型可以被进一步微调以适应特定任务，这在需要隐私保护的领域（如法律和医疗）中尤为重要。","讲者强调了技能多样化的必要性，避免成为只擅长一项技能的“单打独斗者”。他提到，一些程序员虽然在特定API或框架上非常优秀，但随着行业的发展，他们可能被市场淘汰。","讲者还讨论了AI领域的“泡沫”现象，认为大型模型和自托管模型分别代表了不同的发展方向。他建议从业者关注基础知识，构建实际解决方案，并理解业务层面，以避免泡沫破裂带来的影响。","当泡沫破裂时，资金蒸发、招聘冻结、项目取消和人才过剩是常见的后果。因此，讲者建议从业者多样化技能，以增强职业的稳定性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4574.68,"end":4751.4,"asr_flags":[],"raw_segments":[{"start":4574.68,"text":"So the ability to take an open source model and fine-tune it for particular downstream tasks. Let me give one concrete example of that that I've personally experienced. I work a lot in Hollywood, and I've worked a lot with studios making movies. And one studio in particular, I was lucky enough to sell a movie to. It's still in pre-production. It'll probably be in pre-production forever."},{"start":4598.61,"text":"One of the things I learned as part of that process was IP in studios is so protected. It's not even funny."},{"start":4607.04,"text":"Go and Google for James Cameron who created Avatar and the lawsuits that he's involved in of this person who apparently sent him a story many years ago about blue aliens and is now suing him for billions of dollars because obviously there were blue aliens in Avatar. The level of IP protection in Hollywood is insane. The opportunity with large language models is equally insane."},{"start":4631.28,"text":"A lot of the focus is on large language models for creation, for storytelling, for rendering and all that. But actually the major opportunity that they have is actually for analysis. To take a look at synopses of movies and find out what works and what doesn't. Why was this movie a hit and this one wasn't? What time of year was this one released and it became successful and this one wasn't? And with the margin on movies being razor thin, that kind of analysis is huge. But in order to do that kind of analysis, you need to share the details."},{"start":4660.46,"text":"be a movie with a large language model. And they will absolutely not do that with a GPT or a Gemini or whatever, because they're now sharing their IP with a third party."},{"start":4669.16,"text":"enter small models where they can self-host their own small model, and they are getting smarter and smarter. The 7B model of today is as smart as the 50B model of yesterday. A year from now, the 7B model of a year from now will be as smart as the 300B model of yesteryear. So they're moving in that direction of building using small..."},{"start":4690.67,"text":"self-hosted models, which they can then fine tune on downstream tasks. Similar with other things where privacy is important, law offices, medical offices, all of those kind of things. So those type of skills are fundamentally important going forward. So that's the bifurcation that I'm seeing happening in AI. The sooner bubble, I think, is in the bigger."},{"start":4709.2,"text":"non-self-hosted. The later bubble is in the smaller self-hosted. But either way, for your"},{"start":4714.58,"text":"career to avoid the impact of any bubble bursting, focus on the fundamentals. Build those real"},{"start":4721.52,"text":"solutions. Understand the business side. And most of all, diversify your skills. Don't be that one"},{"start":4726.88,"text":"trick pony who only knows how to do one thing. I've worked with brilliant people who are fantastic"},{"start":4732.62,"text":"at coding a particular API or particular framework. And then the industry moved on and they got left"},{"start":4737.78,"text":"left behind. Okay, so yeah, when bubbles burst, that overall fallout, kind of spoken about it a"},{"start":4744.74,"text":"little bit already, funding evaporates, hiring freezes become layoffs, projects get cancelled,"},{"start":4749.82,"text":"and talent floods the market. Yep."}],"speech_gaps":[],"frame":"../frames/v056/028.webp","frame_time":4586.68},{"title":"职业建议：技能多样化与专业深度","segments":[{"id":266,"text":"So, how do you think, how is it more important to, like, diversify skills versus, like, actually, like, focusing on, for example, LMS versus, like, computer vision or versus, like, very specific downstream tasks?"},{"id":267,"text":"right so I mean I think so the question was around NVIDIA in particular hiring for a very specific"},{"id":268,"text":"very narrow scenario so then the question is how important is it for you to become an expert in a"},{"id":269,"text":"scenario versus diversifying your skills I would always argue it's still better to diversify your"},{"id":270,"text":"skills because that one narrow scenario is only that one narrow scenario and you're putting all"},{"id":271,"text":"your eggs into one basket NVIDIA would be a fantastic company to work for nothing against"},{"id":272,"text":"them in any way but if you put all of your eggs into that basket and you don't get it"},{"id":273,"text":"then what right so i think the idea of really being able to"},{"id":274,"text":"If you are passionate about a thing, to be very deep in that thing is very, very good, but to only be able to do that thing, I would always encourage to be diversified. When I say diversified, like you were saying, LLMs or computer vision or anything like that, I think that's one part of it, but it's like that knowledge of models and how to use them, to me, is a uni skill. The diversification of skills is breaking outside of that, also to be able to think, okay, what about building applications on top of these?"},{"id":275,"text":"What does scaling an application look like? What does software engineering, in this case, look like? What about user experience and user experience skills? Because it's all very well to build a beautiful application, but if nobody can use it, I'm looking at you, Microsoft Office, you know, there's stuff like that that you just, you know, that's what I really mean about diversifying beyond. So even in that, like, mono example with NVIDIA, to be able to break out of, like, that one particular example, but to show skills in other areas that are of value, I think is really important."},{"id":276,"text":"Okay, as we're just running a little bit, so yeah, I just wanted to, I've kind of gone into it a little bit already, but I'm a massive advocate for small AI. I really do believe small AI is the next big thing because we're moving into a world, and this is part of the job that I do at Arm, is we're kind of moving into a world of like AI everywhere all at once. So there's a traditional, and it's interesting you just brought up NVIDIA because there's a traditional conception that compute platforms are CPU plus GPU when it comes to AI."},{"id":277,"text":"but that's also changing, right? CPU general purpose, GPU specialists. But for example, in mobile space,"},{"id":278,"text":"massive innovation being done with a technology called SME, Scalable Matrix Extensions. And what SME is all about is really allowing you to bring AI workloads and put them on the CPU. The frontrunners in this are a couple of Chinese phone vendors, Vivo and Oppo, who've just recently released phones with SME-enabled chips. And what's magical about these is that, A, they don't need to have a separate external chip drawing..."}],"notes":["本段讨论了在AI领域中，技能多样化与专业深度之间的权衡。讲者认为，虽然深入某一领域（如计算机视觉或特定下游任务）有其价值，但技能多样化更为重要，因为过于专注于某一狭窄场景可能带来风险。讲者以NVIDIA为例，指出虽然该公司在AI领域有重要地位，但将所有技能投入其中可能不具可持续性。","讲者进一步强调，技能多样化不仅包括掌握不同的技术（如LLMs或计算机视觉），还包括理解模型的使用方法，以及构建应用程序、软件工程、用户体验等跨领域的技能。讲者以Microsoft Office为例，说明即使有强大的技术，如果无法被用户使用，也难以成功。","讲者还提到，随着AI技术的发展，传统的计算平台（CPU+GPU）正在发生变化，特别是在移动设备领域，出现了如SME（Scalable Matrix Extensions）等新技术，使得AI工作负载可以在CPU上运行，而无需依赖外部芯片。","讲者以Vivo和Oppo为例，说明这些中国手机厂商正在采用SME技术，展示了AI在移动设备上的创新应用。这表明，AI技术正在向更广泛的领域扩展，而不仅仅是传统的计算平台。","讲者最后提到，他支持“小AI”（small AI）的发展，认为这是未来的重要趋势。小AI指的是在各种设备和场景中广泛应用的AI技术，而不是集中在特定的大型系统上。","讲者强调，AI技术正在从传统的计算平台向更广泛的领域扩展，包括移动设备和嵌入式系统。这种趋势意味着，未来的AI发展将更加注重灵活性和适应性，而不仅仅是计算能力的提升。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4772.84,"end":4946.29,"asr_flags":[],"raw_segments":[{"start":4772.84,"text":"So, how do you think, how is it more important to, like, diversify skills versus, like, actually, like, focusing on, for example, LMS versus, like, computer vision or versus, like, very specific downstream tasks?"},{"start":4788.74,"text":"right so I mean I think so the question was around NVIDIA in particular hiring for a very specific"},{"start":4793.64,"text":"very narrow scenario so then the question is how important is it for you to become an expert in a"},{"start":4798.34,"text":"scenario versus diversifying your skills I would always argue it's still better to diversify your"},{"start":4803.94,"text":"skills because that one narrow scenario is only that one narrow scenario and you're putting all"},{"start":4808.92,"text":"your eggs into one basket NVIDIA would be a fantastic company to work for nothing against"},{"start":4813.38,"text":"them in any way but if you put all of your eggs into that basket and you don't get it"},{"start":4817.3,"text":"then what right so i think the idea of really being able to"},{"start":4822.46,"text":"If you are passionate about a thing, to be very deep in that thing is very, very good, but to only be able to do that thing, I would always encourage to be diversified. When I say diversified, like you were saying, LLMs or computer vision or anything like that, I think that's one part of it, but it's like that knowledge of models and how to use them, to me, is a uni skill. The diversification of skills is breaking outside of that, also to be able to think, okay, what about building applications on top of these?"},{"start":4851.87,"text":"What does scaling an application look like? What does software engineering, in this case, look like? What about user experience and user experience skills? Because it's all very well to build a beautiful application, but if nobody can use it, I'm looking at you, Microsoft Office, you know, there's stuff like that that you just, you know, that's what I really mean about diversifying beyond. So even in that, like, mono example with NVIDIA, to be able to break out of, like, that one particular example, but to show skills in other areas that are of value, I think is really important."},{"start":4882.96,"text":"Okay, as we're just running a little bit, so yeah, I just wanted to, I've kind of gone into it a little bit already, but I'm a massive advocate for small AI. I really do believe small AI is the next big thing because we're moving into a world, and this is part of the job that I do at Arm, is we're kind of moving into a world of like AI everywhere all at once. So there's a traditional, and it's interesting you just brought up NVIDIA because there's a traditional conception that compute platforms are CPU plus GPU when it comes to AI."},{"start":4911.85,"text":"but that's also changing, right? CPU general purpose, GPU specialists. But for example, in mobile space,"},{"start":4919.81,"text":"massive innovation being done with a technology called SME, Scalable Matrix Extensions. And what SME is all about is really allowing you to bring AI workloads and put them on the CPU. The frontrunners in this are a couple of Chinese phone vendors, Vivo and Oppo, who've just recently released phones with SME-enabled chips. And what's magical about these is that, A, they don't need to have a separate external chip drawing..."}],"speech_gaps":[],"frame":"../frames/v056/029.webp","frame_time":4784.84},{"title":"AI在设备端的部署与趋势","segments":[{"id":279,"text":"extra power, taking up extra footprint space just to be able to run AI workloads, and B, the CPU, of course, being a low power."},{"id":280,"text":"pulling thing, being able to run AI workloads on that, they've been able to build interesting new scenarios. And if I talk about one in particular, there's a company called Alipay. And Alipay had an application where you would, and we've all seen these apps, where you can go through your photographs and you can search for a particular thing. You know, places I ate sushi or something along those lines and use that to create a slideshow. All of those require a back-end service."},{"id":281,"text":"So your photographs are hosted on Google Photos or Apple Photos or something like that, and that back-end service runs the model that you can search against it and be able to do the assembly of them. What Alipay wanted to do was, like, say, there are three problems with this. Problem number one, privacy. You have to share your photos with a third party. Problem number two, latency. You've got to upload those photos, you've got to send the thing, you've got to have the back-end do the thing, and then you've got to download the results from the thing. And then number three is building that cloud service."},{"id":282,"text":"And standing that up costs time and money."},{"id":283,"text":"So if they could move all of this onto the device itself, now the idea was they could run a model on the device that searches the photos on the device. You don't have the latency. And business perspective, they're now saving the money on creating this stand-up service. They now have AI running on the CPU in order to be able to do that. Apple are also people who've invested heavily in the scalable matrix extensions. You see whenever they talk about, if you've ever watched WWDC or anything like that, when they talk about the new AC."},{"id":284,"text":"series chips and M series chips about the neural cores and those kind of things in them. That's part of the idea. So to think about breaking that habit that we've gotten into where you need a GPU to be able to do AI is part of the trend that the world is heading in. Apple are probably one of the leaders in that. I'm very, very bullish on Apple and Apple intelligence as a result from the AI perspective."},{"id":285,"text":"Seeing that trend and following that vector to its logical conclusion, as models are getting smaller, embedded intelligence getting everywhere isn't a pipe dream. It isn't sci-fi anymore. It's going to be a reality that we'll be seeing very, very shortly. So that idea of that convergence of AI because of the ability of smaller models getting smarter and lower-powered devices being able to run them, we see that convergence hitting, and I see massive opportunity there."},{"id":286,"text":"So one last part, and just going back to agents for a moment, I think, you know, the one thing that I always say is like a hidden part of artificial intelligence is really what I like to call artificial understanding. And when you can start using models to understand things on your behalf, and when they understand them on your behalf to be able to craft."}],"notes":["本段主要讨论了AI在设备端部署的必要性和优势，特别是以支付宝为例，说明了将AI模型部署在设备端可以解决隐私、延迟和云服务成本等问题。讲者指出，通过在设备上运行AI模型，可以避免将照片上传到云端，从而保护用户隐私，同时减少延迟和云服务的构建成本。","讲者提到，苹果公司正在大力投资可扩展的矩阵扩展技术，这使得在移动设备上运行AI成为可能。苹果的A系列和M系列芯片中的神经核心是这一趋势的体现。讲者认为，未来AI不再依赖GPU，而是可以在低功耗设备上运行，这是行业发展的方向。","讲者进一步指出，随着模型规模的缩小和设备性能的提升，AI在嵌入式设备上的应用将变得越来越普遍。这种趋势正在从科幻变为现实，未来将有大量机会出现。","最后，讲者提到AI不仅仅是技术问题，还涉及‘人工理解’的概念，即利用模型来帮助人类理解事物。这种能力将使AI在更多领域发挥作用，而不仅仅是执行任务。","讲者强调，AI的发展趋势是将智能嵌入到各种设备中，而不是依赖于昂贵的云服务或GPU。这种趋势将带来巨大的商业机会，并改变AI的应用方式。","讲者对苹果公司在AI领域的投资和未来潜力表示高度乐观，认为苹果在AI智能方面的进展将引领行业的发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4946.54,"end":5113.53,"asr_flags":[],"raw_segments":[{"start":4946.54,"text":"extra power, taking up extra footprint space just to be able to run AI workloads, and B, the CPU, of course, being a low power."},{"start":4954.38,"text":"pulling thing, being able to run AI workloads on that, they've been able to build interesting new scenarios. And if I talk about one in particular, there's a company called Alipay. And Alipay had an application where you would, and we've all seen these apps, where you can go through your photographs and you can search for a particular thing. You know, places I ate sushi or something along those lines and use that to create a slideshow. All of those require a back-end service."},{"start":4980.27,"text":"So your photographs are hosted on Google Photos or Apple Photos or something like that, and that back-end service runs the model that you can search against it and be able to do the assembly of them. What Alipay wanted to do was, like, say, there are three problems with this. Problem number one, privacy. You have to share your photos with a third party. Problem number two, latency. You've got to upload those photos, you've got to send the thing, you've got to have the back-end do the thing, and then you've got to download the results from the thing. And then number three is building that cloud service."},{"start":5009.73,"text":"And standing that up costs time and money."},{"start":5012.3,"text":"So if they could move all of this onto the device itself, now the idea was they could run a model on the device that searches the photos on the device. You don't have the latency. And business perspective, they're now saving the money on creating this stand-up service. They now have AI running on the CPU in order to be able to do that. Apple are also people who've invested heavily in the scalable matrix extensions. You see whenever they talk about, if you've ever watched WWDC or anything like that, when they talk about the new AC."},{"start":5041.84,"text":"series chips and M series chips about the neural cores and those kind of things in them. That's part of the idea. So to think about breaking that habit that we've gotten into where you need a GPU to be able to do AI is part of the trend that the world is heading in. Apple are probably one of the leaders in that. I'm very, very bullish on Apple and Apple intelligence as a result from the AI perspective."},{"start":5066.78,"text":"Seeing that trend and following that vector to its logical conclusion, as models are getting smaller, embedded intelligence getting everywhere isn't a pipe dream. It isn't sci-fi anymore. It's going to be a reality that we'll be seeing very, very shortly. So that idea of that convergence of AI because of the ability of smaller models getting smarter and lower-powered devices being able to run them, we see that convergence hitting, and I see massive opportunity there."},{"start":5095.05,"text":"So one last part, and just going back to agents for a moment, I think, you know, the one thing that I always say is like a hidden part of artificial intelligence is really what I like to call artificial understanding. And when you can start using models to understand things on your behalf, and when they understand them on your behalf to be able to craft."}],"speech_gaps":[],"frame":"../frames/v056/030.webp","frame_time":4958.54},{"title":"AI职业建议与生成视频的挑战","segments":[{"id":287,"text":"From that understanding new things, you can actually develop superpowers where you're far more effective than ever before, be that creating code or creating other things. And I'm going to give one quick demo just so we can wrap up. And I was talking earlier about generating video. So this picture is, whoops, sorry, the connection here is not very good. I lost it. So here we go. This picture here is actually of my son playing ice hockey."},{"id":288,"text":"And I took this picture and I was saying, okay, I think I'm very good at prompting. And I wrote a nice prompt for this picture to get him. He's in the middle of taking a slap shot. He's got some beautiful flex on his stick. And I asked it like, okay, to prompt him scoring a goal. What do you think happened? Should we watch? Let's see if it works. This was the wrong video, but it still shows the same idea. Because of poor prompting,"},{"id":289,"text":"Because of poor understanding of my intent, if I talk about it in agentic senses, the arena that he was in, which is a practice arena and doesn't have any people in it. Sorry, let me pause it. If I just rewind to here. If we look up in this top right hand corner here, this is basically where they store all the garbage. But the AI didn't know that, had no idea of it, so assumed it was a full arena and it started painting people in."},{"id":290,"text":"And even though he shot a mile wide, everybody cheers, and somehow he has two sticks in his hand instead of one, and they forgot his name."},{"id":291,"text":"I did not go through an agentic workflow to do this. I did not go through the steps of, A, understand my intent. B, once you understand my intent, understand the tools that are available to you. In this case, it's Veo. And understand the intricacies of using Veo. Make a plan of how to use them. Make a plan of how to build a prompt for them. And then use them and then reflect."},{"id":292,"text":"I've been advising a startup that is working on movie creation using AI, and I want to show you a little sample here of a movie that I've been working on with them, where the whole idea is if you want to have performances out of virtual actors and actresses, you need to have emotion."},{"id":293,"text":"You need to be able to convey that emotion, and you also need to be able to put that emotion in the context of the entire story. Because when you create a video from a prompt, you're creating an eight-second snippet. That eight-second snippet needs to know what's going on in the rest of the story. So if I show this one for a moment. And it's a little wooden at the moment. It's not really working perfectly. I have professional actors who are friends who are advising me on this, and they laughed at the performances."}],"notes":["本段主要讨论了生成视频过程中由于提示词不够准确而导致的问题，例如AI误解了场景意图，将空旷的练习场误认为有观众的场地，从而生成了不相关的画面。这说明了在使用AI生成内容时，明确表达意图和理解工具的限制非常重要。","讲者提到在生成视频时，需要将情感融入虚拟角色的表演中，并且要将情感置于整个故事的上下文中。这表明AI生成的视频片段虽然只有8秒，但必须与整体叙事保持一致，否则会显得不连贯。","讲者强调了在使用AI工具（如Veo）时，需要经历一个完整的流程：理解意图、了解可用工具、掌握工具的使用细节、制定计划、执行并反思。这说明了AI工具的使用不仅仅是输入提示词，还需要系统性的规划和调整。","讲者提到正在与一家初创公司合作，开发基于AI的电影创作工具。这表明AI在影视制作中的应用正在扩展，但目前仍面临技术挑战，如情感表达和场景理解的不足。","讲者提到与专业演员合作，他们对生成的表演表示不满，这说明AI生成的表演仍需人工指导和改进，AI目前还不能完全替代人类的创造力。","讲者通过实际案例展示了AI生成内容的局限性，例如错误的场景理解、不自然的动作和情感表达，这提醒听众在使用AI工具时要保持批判性思维，并不断优化提示词和流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5114.24,"end":5289.42,"asr_flags":[],"raw_segments":[{"start":5114.24,"text":"From that understanding new things, you can actually develop superpowers where you're far more effective than ever before, be that creating code or creating other things. And I'm going to give one quick demo just so we can wrap up. And I was talking earlier about generating video. So this picture is, whoops, sorry, the connection here is not very good. I lost it. So here we go. This picture here is actually of my son playing ice hockey."},{"start":5146.89,"text":"And I took this picture and I was saying, okay, I think I'm very good at prompting. And I wrote a nice prompt for this picture to get him. He's in the middle of taking a slap shot. He's got some beautiful flex on his stick. And I asked it like, okay, to prompt him scoring a goal. What do you think happened? Should we watch? Let's see if it works. This was the wrong video, but it still shows the same idea. Because of poor prompting,"},{"start":5183.58,"text":"Because of poor understanding of my intent, if I talk about it in agentic senses, the arena that he was in, which is a practice arena and doesn't have any people in it. Sorry, let me pause it. If I just rewind to here. If we look up in this top right hand corner here, this is basically where they store all the garbage. But the AI didn't know that, had no idea of it, so assumed it was a full arena and it started painting people in."},{"start":5213.61,"text":"And even though he shot a mile wide, everybody cheers, and somehow he has two sticks in his hand instead of one, and they forgot his name."},{"start":5222.89,"text":"I did not go through an agentic workflow to do this. I did not go through the steps of, A, understand my intent. B, once you understand my intent, understand the tools that are available to you. In this case, it's Veo. And understand the intricacies of using Veo. Make a plan of how to use them. Make a plan of how to build a prompt for them. And then use them and then reflect."},{"start":5244.87,"text":"I've been advising a startup that is working on movie creation using AI, and I want to show you a little sample here of a movie that I've been working on with them, where the whole idea is if you want to have performances out of virtual actors and actresses, you need to have emotion."},{"start":5261.2,"text":"You need to be able to convey that emotion, and you also need to be able to put that emotion in the context of the entire story. Because when you create a video from a prompt, you're creating an eight-second snippet. That eight-second snippet needs to know what's going on in the rest of the story. So if I show this one for a moment. And it's a little wooden at the moment. It's not really working perfectly. I have professional actors who are friends who are advising me on this, and they laughed at the performances."}],"speech_gaps":[],"frame":"../frames/v056/031.webp","frame_time":5126.24},{"title":"职业建议与课程总结","segments":[{"id":294,"text":"try to view it through the difference that we had from an unagentic prompt with the hockey player to this one. Hopefully we can hear it. I guess I can do the pub quiz after all. They just shut me down. I'm so close. But they wouldn't listen. I won't. They never listen."},{"id":295,"text":"So here's the idea of, again, just thinking in terms of agentic, as I was saying earlier on, breaking it into those steps. That allowed me to use exactly the same engine as I was showing you earlier on that fails to be able to show something that works and is able to do things like portraying emotion that I just spoke about. So I know we're a little bit over time, so sorry about that. I can take any questions if anybody has any. I see Andrew is here as well. He's at the back. And I just really want to say thank you so much for your attention. I really appreciate it."},{"id":296,"text":"Yep. It's a great question. Just to repeat for the video, how much of the improvement is from the use of an agentic workflow versus just lack of hockey stuff in the training set for the failed one?"},{"id":297,"text":"Not comparing like to like, so just using my gut. When I looked at, when I broke this down into the workflow that said, okay, I created scenes like this one and they were awful when I just did it directly for myself with no basis, no agentic, no artificial understanding. And when I broke it down into the steps where it's like, okay, in this scene, the girl is sitting on the bench and she's upset and the person is talking to her and he wants to comfort her."},{"id":298,"text":"Feeding that to a large language model along with the entire story and along with the constraints that I had where the shot has to be eight seconds long, clear dialogue and all of those kind of thing, and then to understand my intent from that one."}],"notes":["本段主要总结了课程内容，并对听众表示感谢。讲师提到自己在时间上有些超时，但仍然愿意回答问题，并提到Andrew在场。这表明课程接近尾声，讲师在进行最后的总结和互动。","讲师提到自己在进行一个问答环节，但听众似乎没有提出问题。这可能意味着课程结束前的互动环节没有达到预期效果，或者听众对内容已经有所理解。","讲师提到自己在进行一个关于职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。","讲师提到自己在进行一个关于AI领域职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。","讲师提到自己在进行一个关于AI领域职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。","讲师提到自己在进行一个关于AI领域职业建议的讨论，但内容并未明确展开。这可能是因为课程时间有限，或者讲师更倾向于在课程中强调实践和应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5290.93,"end":5446.4,"asr_flags":[],"raw_segments":[{"start":5290.93,"text":"try to view it through the difference that we had from an unagentic prompt with the hockey player to this one. Hopefully we can hear it. I guess I can do the pub quiz after all. They just shut me down. I'm so close. But they wouldn't listen. I won't. They never listen."},{"start":5328.24,"text":"So here's the idea of, again, just thinking in terms of agentic, as I was saying earlier on, breaking it into those steps. That allowed me to use exactly the same engine as I was showing you earlier on that fails to be able to show something that works and is able to do things like portraying emotion that I just spoke about. So I know we're a little bit over time, so sorry about that. I can take any questions if anybody has any. I see Andrew is here as well. He's at the back. And I just really want to say thank you so much for your attention. I really appreciate it."},{"start":5365.77,"text":"Yep. It's a great question. Just to repeat for the video, how much of the improvement is from the use of an agentic workflow versus just lack of hockey stuff in the training set for the failed one?"},{"start":5402.32,"text":"Not comparing like to like, so just using my gut. When I looked at, when I broke this down into the workflow that said, okay, I created scenes like this one and they were awful when I just did it directly for myself with no basis, no agentic, no artificial understanding. And when I broke it down into the steps where it's like, okay, in this scene, the girl is sitting on the bench and she's upset and the person is talking to her and he wants to comfort her."},{"start":5431.42,"text":"Feeding that to a large language model along with the entire story and along with the constraints that I had where the shot has to be eight seconds long, clear dialogue and all of those kind of thing, and then to understand my intent from that one."}],"speech_gaps":[],"frame":"../frames/v056/032.webp","frame_time":5302.93},{"title":"AI职业建议与LLM应用实例","segments":[{"id":299,"text":"The LLM ended up expressing a prompt that was far more loquacious than I ever would have, that was far more descriptive than I ever would have. The LLM had understanding of what makes a good shot, what makes a good angle, what makes good emotion, far more than I would have. I could spend hours trying to describe it. So that first step in the agentic flow of it, doing that for me and understanding my intent, was huge. The second step then is the tools that it's going to use. So I explicitly said which video engine I'm going to use."},{"id":300,"text":"be using. I was using Gemini as the LLM, and hopefully Gemini is familiar with Veo, you know, that kind of stuff, so to understand the idiosyncrasies of doing things with Veo. What I learned, like, for example, Veo is very bad at doing high action scenes, but is very good at doing slow camera pulls to do a motion, as you saw in this case. So the LLM knew that from me declaring I was using that as a tool, and then further, it built a prompt, and then further refined the prompt from that, and then the third part, actually using the tool to actually generate it for me."},{"id":301,"text":"generating a video with something like VO costs I think between two and three dollars to generate like four videos and credits so the last thing I want to do is generate lots and lots and lots and lots of videos and throw good money after bad but all of that token spend that I did earlier on to understand my intent and then to make the plan for using the agent was saved in the back end where it got it right like you know maybe not get it right first time but it would very rarely take more than two or three tries to get something that was really really nice so I think you know"},{"id":302,"text":"Without comparing like with like, I do think that plan of action and going through a workflow like that worked very, very well. Any other questions, thoughts, comments? Yep, up at the back. What has surprised me the most about the AI industry over the years? Oh, that's a good one. I think what has surprised me the most, and it probably shouldn't have surprised me, is how much hype took over."},{"id":303,"text":"I honestly thought a lot of people who are in important decision-making roles and that kind of thing would be able to see the signal better than they did. And I think the other part was that the desire to..."},{"id":304,"text":"make immediate profits as opposed to long-term gains also surprised me a lot. Let me share one story in that space. Andrew and I taught the TensorFlow specializations on Coursera. And after that, Google launched a professional certificate where the idea of this professional certificate was we'd give a rigorous exam. And at the end of the rigorous exam, if you got the certificate, it was a high prestige thing."},{"id":305,"text":"that would help you find work, and particularly at the time when TensorFlow was a very highly demanded skill in order to get work. Running that program cost Google $100,000 a year."}],"notes":["本段主要讲述使用LLM生成视频的成本问题，以及通过前期的意图理解来优化生成过程。讲者提到生成视频的费用大约在2到3美元之间，可以生成四段视频，因此不希望生成大量视频以避免浪费资源。同时，讲者强调前期的意图理解与计划制定在后端保存，使得生成过程更加高效，通常不需要太多尝试就能得到高质量结果。","讲者提到在生成视频时，使用VO（可能指视频生成工具）的成本问题，以及如何通过前期的意图理解来减少不必要的生成尝试。这体现了在实际应用中，如何通过前期的分析和规划来优化资源使用。","讲者提到生成视频的费用和资源浪费问题，强调了在实际应用中需要合理规划，避免不必要的开支。这反映了在AI应用中，成本控制和资源优化的重要性。","讲者提到前期的意图理解与计划制定在后端保存，使得生成过程更加高效，通常不需要太多尝试就能得到高质量结果。这说明了在AI系统中，如何通过前期的分析和规划来提高生成效率。","讲者提到生成视频的费用和资源浪费问题，强调了在实际应用中需要合理规划，避免不必要的开支。这反映了在AI应用中，成本控制和资源优化的重要性。","讲者提到生成视频的费用和资源浪费问题，强调了在实际应用中需要合理规划，避免不必要的开支。这反映了在AI应用中，成本控制和资源优化的重要性。"],"formulas":[],"uncertainties":["VO可能指视频生成工具，但具体名称未明确"],"diagram":"none","start":5447.16,"end":5625.12,"asr_flags":[],"raw_segments":[{"start":5447.16,"text":"The LLM ended up expressing a prompt that was far more loquacious than I ever would have, that was far more descriptive than I ever would have. The LLM had understanding of what makes a good shot, what makes a good angle, what makes good emotion, far more than I would have. I could spend hours trying to describe it. So that first step in the agentic flow of it, doing that for me and understanding my intent, was huge. The second step then is the tools that it's going to use. So I explicitly said which video engine I'm going to use."},{"start":5476.65,"text":"be using. I was using Gemini as the LLM, and hopefully Gemini is familiar with Veo, you know, that kind of stuff, so to understand the idiosyncrasies of doing things with Veo. What I learned, like, for example, Veo is very bad at doing high action scenes, but is very good at doing slow camera pulls to do a motion, as you saw in this case. So the LLM knew that from me declaring I was using that as a tool, and then further, it built a prompt, and then further refined the prompt from that, and then the third part, actually using the tool to actually generate it for me."},{"start":5505.87,"text":"generating a video with something like VO costs I think between two and three dollars to generate like four videos and credits so the last thing I want to do is generate lots and lots and lots and lots of videos and throw good money after bad but all of that token spend that I did earlier on to understand my intent and then to make the plan for using the agent was saved in the back end where it got it right like you know maybe not get it right first time but it would very rarely take more than two or three tries to get something that was really really nice so I think you know"},{"start":5535.72,"text":"Without comparing like with like, I do think that plan of action and going through a workflow like that worked very, very well. Any other questions, thoughts, comments? Yep, up at the back. What has surprised me the most about the AI industry over the years? Oh, that's a good one. I think what has surprised me the most, and it probably shouldn't have surprised me, is how much hype took over."},{"start":5569.85,"text":"I honestly thought a lot of people who are in important decision-making roles and that kind of thing would be able to see the signal better than they did. And I think the other part was that the desire to..."},{"start":5585.32,"text":"make immediate profits as opposed to long-term gains also surprised me a lot. Let me share one story in that space. Andrew and I taught the TensorFlow specializations on Coursera. And after that, Google launched a professional certificate where the idea of this professional certificate was we'd give a rigorous exam. And at the end of the rigorous exam, if you got the certificate, it was a high prestige thing."},{"start":5614.6,"text":"that would help you find work, and particularly at the time when TensorFlow was a very highly demanded skill in order to get work. Running that program cost Google $100,000 a year."}],"speech_gaps":[],"frame":"../frames/v056/033.webp","frame_time":5459.16},{"title":"AI职业建议与个人故事","segments":[{"id":306,"text":"Drop in the bucket. Not a lot of money. The goodwill that came out of it was immense. I can tell two stories. I'll tell one story very quickly. There was a young man and he went public in some advertising stuff with Google that he lived in Syria. And we all know there was a huge civil war in Syria over the last few years."},{"id":307,"text":"And he got the TensorFlow certificate. He was one of the first in Syria to get it. And it lifted him out of poverty where he was able to move to Germany and get work at a major German firm. And I met him at an event in Amsterdam where he told me his story. And now, because of the job that he had in this German firm, he's able to support his family back home and move them out of the war-torn zone into a peaceful zone. All because he got this AI thing."},{"id":308,"text":"And there were countless stories like that, very inspirational, very beautiful stories. But the thing that surprised me then was sometimes the lack of investment in that, where there was no revenue being generated for the company out of that. We deliberately kept it revenue neutral so that the price of the exams could go down. We wanted it to self-sustain. It ended up not being revenue neutral. It ended up costing the company about $100,000 to $150,000 a year, so they canned it. And it's a shame because of all the potential..."},{"id":309,"text":"goodwill that can come out of something like that. But I think those were the two that immediately jumped to mind that have surprised me the most. And then I guess one other part that I would say is the people who've been able to be very successful with AI, who you wouldn't think would be the ones that would be successful with AI, has always been inspirational to me. So allow me one more story. I have a good friend. I showed ice hockey a moment ago. I have a good friend who is a former professional ice hockey player. And any ice hockey fans here?"},{"id":310,"text":"You know, it's kind of a brutal sport, right? You see a lot of fighting and a lot of stuff on the ice. And he dropped out of school when he was 13 years old to focus on skating. And he will always tell everybody that he's the dumbest person alive because he's uneducated. He and I are complete opposites. That's why we get on so well. And he retired from ice hockey because of concussion issues. And he now runs a non-profit, the Ice Rinks for a non-profit."},{"id":311,"text":"And about three years ago, we were having a beer and he was like, so tell me about AI and tell me about this chat GPT thing. Is it any good? And I was like, you know, just sharing the whole thing. Yes, it's good and all that kind of stuff. And it was obviously a loaded question and I didn't know why. But part of his job at his nonprofit is that every quarter he has to present to the board of directors the results of the operations so that they can be funded properly. Because even though they're a nonprofit, they still need money to operate."},{"id":312,"text":"And he was spending upwards of $150,000 a year to bring in consultants."}],"notes":["本段主要讲述AI技术在实际应用中可能带来的社会影响，以及其在商业上的可持续性问题。讲者提到，尽管AI证书帮助了一些人摆脱贫困，但公司由于缺乏收入回报，最终决定停止该项目。这反映了AI技术在社会层面的积极影响与商业可行性之间的矛盾。","讲者通过一个朋友的故事，展示了AI技术如何被非技术背景的人所接受和应用。这位前职业冰球运动员虽然没有接受过正规教育，但对AI表现出浓厚兴趣，并将其应用于非营利组织的运营中，这说明AI技术的普及并不局限于特定背景的人群。","讲者提到，非营利组织需要资金支持，而AI技术可能成为降低成本、提高效率的工具。这表明AI技术在非营利领域的潜在应用价值，尤其是在资源有限的情况下。","讲者强调了AI技术的广泛适用性，即使是对AI不熟悉的人也能通过学习和应用AI技术来改善自己的生活和工作。这体现了AI技术的包容性和可及性。","讲者提到，AI技术的推广需要考虑其经济可持续性，这可能影响其在实际应用中的推广速度和范围。这表明AI技术的推广不仅仅是技术问题，还涉及经济和管理层面的考量。","讲者通过多个故事展示了AI技术在不同背景下的应用，强调了其在社会和个人层面的积极影响。这表明AI技术不仅是一种工具，也是一种能够改变人们生活和工作的力量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5626.3,"end":5797.7,"asr_flags":[],"raw_segments":[{"start":5626.3,"text":"Drop in the bucket. Not a lot of money. The goodwill that came out of it was immense. I can tell two stories. I'll tell one story very quickly. There was a young man and he went public in some advertising stuff with Google that he lived in Syria. And we all know there was a huge civil war in Syria over the last few years."},{"start":5648.92,"text":"And he got the TensorFlow certificate. He was one of the first in Syria to get it. And it lifted him out of poverty where he was able to move to Germany and get work at a major German firm. And I met him at an event in Amsterdam where he told me his story. And now, because of the job that he had in this German firm, he's able to support his family back home and move them out of the war-torn zone into a peaceful zone. All because he got this AI thing."},{"start":5677.74,"text":"And there were countless stories like that, very inspirational, very beautiful stories. But the thing that surprised me then was sometimes the lack of investment in that, where there was no revenue being generated for the company out of that. We deliberately kept it revenue neutral so that the price of the exams could go down. We wanted it to self-sustain. It ended up not being revenue neutral. It ended up costing the company about $100,000 to $150,000 a year, so they canned it. And it's a shame because of all the potential..."},{"start":5707.02,"text":"goodwill that can come out of something like that. But I think those were the two that immediately jumped to mind that have surprised me the most. And then I guess one other part that I would say is the people who've been able to be very successful with AI, who you wouldn't think would be the ones that would be successful with AI, has always been inspirational to me. So allow me one more story. I have a good friend. I showed ice hockey a moment ago. I have a good friend who is a former professional ice hockey player. And any ice hockey fans here?"},{"start":5737.24,"text":"You know, it's kind of a brutal sport, right? You see a lot of fighting and a lot of stuff on the ice. And he dropped out of school when he was 13 years old to focus on skating. And he will always tell everybody that he's the dumbest person alive because he's uneducated. He and I are complete opposites. That's why we get on so well. And he retired from ice hockey because of concussion issues. And he now runs a non-profit, the Ice Rinks for a non-profit."},{"start":5764.36,"text":"And about three years ago, we were having a beer and he was like, so tell me about AI and tell me about this chat GPT thing. Is it any good? And I was like, you know, just sharing the whole thing. Yes, it's good and all that kind of stuff. And it was obviously a loaded question and I didn't know why. But part of his job at his nonprofit is that every quarter he has to present to the board of directors the results of the operations so that they can be funded properly. Because even though they're a nonprofit, they still need money to operate."},{"start":5791.78,"text":"And he was spending upwards of $150,000 a year to bring in consultants."}],"speech_gaps":[],"frame":"../frames/v056/034.webp","frame_time":5638.3},{"title":"AI技术的实际应用与职业建议","segments":[{"id":313,"text":"to kind of pull the data from all of the different sources they were pulling data from. There's, like, machines in what's called the pump room that has a compressor that cools the ice, and there were spreadsheets, and there was accounts, and all this kind of stuff. And he was not tech-savvy in any way, but he, like, needed to process all this data. So he did an experiment where he got ChatGPT to do it. And this was the loaded question, like, asking me was it any good. And so we talked through it a little bit, and then he told me why."},{"id":314,"text":"And so I took a look at the results because he was uploading spreadsheets, he was uploading PDFs and all this kind of thing and getting it to assemble a report. And it takes him now about two hours to do the report himself with ChatGPT. And it worked and it worked brilliantly. And that $150,000 a year that he's saving on consulting is now going to underprivileged kids, right, for hockey equipment, for ice skating equipment, for lessons and all of that kind of thing. So it was taken out of the hands of an expensive consulting company and put into the hands of people because of this."},{"id":315,"text":"guy, and he says he's the dumbest person alive, you know, but I hope he's not watching this video, but, and he's like, you know, but he, and I told him afterwards that, congratulations, you're now a developer, right, and he didn't like that, but, you know, but it's like surprises like that, that the superpowers that were handed to somebody like him, that he's not technical in any way, but he was able to effectively build a solution that saved his non-profit $100,000 to $150,000 a year, and like, things like that are all,"},{"id":316,"text":"always surprising me in a very pleasant way. Yep. Sorry, I'll get to you next. Sorry. Yep."},{"id":317,"text":"Yep, so just to repeat the question for the video, for engineers like us, sometimes it's easy to navigate the hype, to see the signal from the noise, but what about people who don't have the same training as us? I think that's our opportunity to be trusted advisors for them and to really help them through that to understand it. I think the biggest part in the hype story right now is just understanding the reward mechanism. Everything rewards engagement rather than actual substance. To me, step one is seeing through."},{"id":318,"text":"that like the story I just told about my friend you know he'd seen all this kind of stuff but he wasn't willing to bet his career on it you know but he needed like that kind of advice around it and to kind of start peeling apart what he had done and what he did right and what he did wrong and you know so that"}],"notes":["本段讲述了一位非技术人员通过使用ChatGPT处理数据，从而节省了大量咨询费用，并将这些费用用于帮助弱势群体。这说明了AI技术在非技术背景人士中的实际应用价值。","讲者提到这位朋友虽然自认为是‘最蠢的人’，但通过AI工具成功解决了问题，这体现了技术工具对非技术人员的赋能作用。","讲者强调了在AI技术的 hype 中，理解奖励机制的重要性，即当前的奖励机制更倾向于关注参与度而非实际内容。","讲者提到，对于没有相同技术背景的人，工程师应成为值得信赖的顾问，帮助他们理解技术并做出决策。","讲者通过朋友的例子说明，即使没有技术背景，也可以通过适当的技术工具和指导，实现有效的解决方案。","讲者最后提到，这种意外的成功令人惊喜，也说明了AI技术在实际应用中的潜力和价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5798.58,"end":5956.08,"asr_flags":[],"raw_segments":[{"start":5798.58,"text":"to kind of pull the data from all of the different sources they were pulling data from. There's, like, machines in what's called the pump room that has a compressor that cools the ice, and there were spreadsheets, and there was accounts, and all this kind of stuff. And he was not tech-savvy in any way, but he, like, needed to process all this data. So he did an experiment where he got ChatGPT to do it. And this was the loaded question, like, asking me was it any good. And so we talked through it a little bit, and then he told me why."},{"start":5825.05,"text":"And so I took a look at the results because he was uploading spreadsheets, he was uploading PDFs and all this kind of thing and getting it to assemble a report. And it takes him now about two hours to do the report himself with ChatGPT. And it worked and it worked brilliantly. And that $150,000 a year that he's saving on consulting is now going to underprivileged kids, right, for hockey equipment, for ice skating equipment, for lessons and all of that kind of thing. So it was taken out of the hands of an expensive consulting company and put into the hands of people because of this."},{"start":5854.34,"text":"guy, and he says he's the dumbest person alive, you know, but I hope he's not watching this video, but, and he's like, you know, but he, and I told him afterwards that, congratulations, you're now a developer, right, and he didn't like that, but, you know, but it's like surprises like that, that the superpowers that were handed to somebody like him, that he's not technical in any way, but he was able to effectively build a solution that saved his non-profit $100,000 to $150,000 a year, and like, things like that are all,"},{"start":5883.56,"text":"always surprising me in a very pleasant way. Yep. Sorry, I'll get to you next. Sorry. Yep."},{"start":5912.3,"text":"Yep, so just to repeat the question for the video, for engineers like us, sometimes it's easy to navigate the hype, to see the signal from the noise, but what about people who don't have the same training as us? I think that's our opportunity to be trusted advisors for them and to really help them through that to understand it. I think the biggest part in the hype story right now is just understanding the reward mechanism. Everything rewards engagement rather than actual substance. To me, step one is seeing through."},{"start":5941.9,"text":"that like the story I just told about my friend you know he'd seen all this kind of stuff but he wasn't willing to bet his career on it you know but he needed like that kind of advice around it and to kind of start peeling apart what he had done and what he did right and what he did wrong and you know so that"}],"speech_gaps":[],"frame":"../frames/v056/035.webp","frame_time":5810.58},{"title":"AI与机器学习在科研中的应用与注意事项","segments":[{"id":319,"text":"positioning ourselves to be trusted advisors by not leaning into the same mistakes that the untrained people may be leaning into, I think is the key to that. And just understanding that the average person is generally very intelligent, even if they may not be experts in a specific domain, and to key in on that intelligence and help them to foster and to grow that and navigate them through the parts where they'll have difficulty and let them shine in what they're very, very good at."},{"id":320,"text":"Over here, there was one. Okay. So AI and machine learning for scientific research, where is it a good idea and where should you be cautious? Ooh. My initial gut check would be I think it's always a good idea, right? I think, you know, there's no harm in using the tools that you have available to you, but to always to just double-check your results and double-check your expectations against the grounded reality."},{"id":321,"text":"I've always been a fan of using automation in research as much as possible. My undergraduate was physics many, many years ago, and I was actually very successful in the lab because I usually automated things through a c
