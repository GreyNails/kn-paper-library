 about hard work. But what hard work is is how you measure that hard work. You can work eight hours a day and be incredibly productive. You can work six hours a day and be incredibly productive. But it's the metric of how hard you work and how you measure that. I personally measure that from output, things that I have created in the time that I spent. I joke a lot, but it's true that I've written a lot of books."},{"id":136,"text":"Andrew held up one, that one that he held up that he helped me write a little bit. I actually wrote that book in about two months. And people say, well, how do you have time with your jobs and all these kind of things? You must work like 16 hours a day in order to be able to do this. But actually, the key to me being able to write books is baseball. Any baseball fans here?"},{"id":137,"text":"I love baseball, but if you sit down and try to watch baseball on TV, a match can take like three and a half or four hours. So all of my writing I tend to do in baseball season. So I'm like, if I'm going to sit down, I like the Mariners. I'm from Seattle. I like the Dodgers."},{"id":138,"text":"Nobody booed. Okay, good. And so usually one of those is going to be playing at 7 o'clock at night. So instead of sitting in front of the TV just watching baseball mindlessly, I'll actually be writing a book while baseball's on in the background. It's a very slow-moving game. This is something like that's the hard work in this case. And I would encourage you to try to find areas where you can work hard and produce output. And that's the second pillar here is that business focus. The output that you produce, to align that output,"},{"id":139,"text":"with the business focus that you want to have and with the work that you want to do. There's an old saying, don't dress for the job you have, dress for the one you want. I would say a new angle on that saying would be, don't let your output be for the job you have, let your output be for the job you want. And if I go back to when I spoke about I failed twice at Google to get in, the third time when I got in,"},{"id":140,"text":"I had actually decided to approach this in a different way. And I was interviewing at the time for their cloud team. They were just really launching cloud. And I had just written a book on Java. And so I decided to see what I could do with Java in their cloud. I ended up writing a Java application that ran in their cloud for predicting stock prices using technical analytics and all that kind of stuff. And when I got to the interview, instead of them asking me stupid questions like how many golf balls can fit in a bus, you know,"}],"notes":["本段讨论了如何衡量努力，强调了努力的定义应基于产出而非时间投入。讲者指出，9-9-6或6-6-9这样的时间安排并不能真正反映努力程度，而是时间的消耗。","讲者鼓励听众思考如何衡量自己的努力，并通过产出来体现努力的价值。他提到自己通过写作书籍来衡量努力，而不是单纯地工作时间长短。","讲者提到自己在写作书籍时利用了棒球比赛的时间，说明在特定情境下，可以将工作与兴趣结合，提高效率。","讲者进一步强调了产出与职业目标的一致性，指出应将产出与自己希望从事的工作方向对齐，而不是仅仅满足当前工作的要求。","讲者以自己在Google面试的经历为例，说明如何通过实际项目（如Java应用）来展示自己的能力和价值，而不是回答一些无意义的问题。","讲者引用了一句老话，并提出新的角度，强调产出应服务于未来的职业目标，而不是当前的工作内容。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1884.65,"end":2056.39,"asr_flags":[],"raw_segments":[{"start":1884.65,"text":"Hard work is such a nebulous term that I would say that think about hard work in terms of you are what you measure. There is the whole trend out there. I'm trying to remember. Is it 9-9-6 or is it 6-6-9? 9-9-6, right? 9 a.m. to 9 p.m. six days a week is a metric of hard work. It's not. That's not a metric of hard work. That's a metric of time spent."},{"start":1907.81,"text":"So I would encourage everybody, in the same way as Andrew did, to think about hard work. But what hard work is is how you measure that hard work. You can work eight hours a day and be incredibly productive. You can work six hours a day and be incredibly productive. But it's the metric of how hard you work and how you measure that. I personally measure that from output, things that I have created in the time that I spent. I joke a lot, but it's true that I've written a lot of books."},{"start":1937.44,"text":"Andrew held up one, that one that he held up that he helped me write a little bit. I actually wrote that book in about two months. And people say, well, how do you have time with your jobs and all these kind of things? You must work like 16 hours a day in order to be able to do this. But actually, the key to me being able to write books is baseball. Any baseball fans here?"},{"start":1958.83,"text":"I love baseball, but if you sit down and try to watch baseball on TV, a match can take like three and a half or four hours. So all of my writing I tend to do in baseball season. So I'm like, if I'm going to sit down, I like the Mariners. I'm from Seattle. I like the Dodgers."},{"start":1973.52,"text":"Nobody booed. Okay, good. And so usually one of those is going to be playing at 7 o'clock at night. So instead of sitting in front of the TV just watching baseball mindlessly, I'll actually be writing a book while baseball's on in the background. It's a very slow-moving game. This is something like that's the hard work in this case. And I would encourage you to try to find areas where you can work hard and produce output. And that's the second pillar here is that business focus. The output that you produce, to align that output,"},{"start":2003.12,"text":"with the business focus that you want to have and with the work that you want to do. There's an old saying, don't dress for the job you have, dress for the one you want. I would say a new angle on that saying would be, don't let your output be for the job you have, let your output be for the job you want. And if I go back to when I spoke about I failed twice at Google to get in, the third time when I got in,"},{"start":2026.95,"text":"I had actually decided to approach this in a different way. And I was interviewing at the time for their cloud team. They were just really launching cloud. And I had just written a book on Java. And so I decided to see what I could do with Java in their cloud. I ended up writing a Java application that ran in their cloud for predicting stock prices using technical analytics and all that kind of stuff. And when I got to the interview, instead of them asking me stupid questions like how many golf balls can fit in a bus, you know,"}],"speech_gaps":[],"frame":"../frames/v056/012.webp","frame_time":1896.65},{"title":"AI领域的职业建议与当前工作环境","segments":[{"id":141,"text":"They saw this code. I had put this code. I remember I was producing output for the job I wanted. I'd put this code on my resume, and my entire interview loop was them asking me about my code. So it put the power on me. It gave me the power to communicate about things that I knew as opposed to going in blind to somebody."},{"id":142,"text":"asking me random questions in the hope that I'll be able to answer them. And it's the same thing I would say in the AI world. The business focus..."},{"id":143,"text":"The ability for you now to prompt code into existence, to prompt products into existence. And if you can build those products and line them up with the thing that it is that you want to do, be it a Google or a meta or a startup or any of those kind of things, and have that in-depth understanding, not just of your code, but how it aligns to their business, this is a pillar of success in this time and age. And I will also argue that even though it looks like the signals look like there aren't a lot of jobs out there, there are."},{"id":144,"text":"What there aren't a lot of is a good combination of jobs and people to match them. And then, of course, this bias towards delivery. Ideas are cheap. Execution is everything. I've interviewed many, many people who came in with very, very fluffy ideas and no way to be able to ground them. I've interviewed people who came in with half-baked ideas that they grounded very, very well. Guess which one's got the job, right?"},{"id":145,"text":"of the academics behind AI, of the practicalities behind AI and the things that you need to do, business focus, focusing on delivery for the business, understanding what the business needs and being able to deliver for that, and again, that bias towards delivery. So, a quick pivot. What's it actually like working in AI right now? It's interesting."},{"id":146,"text":"Okay, so as recently as like two or three years ago, working in AI was, if you can do a thing, you're great. If you can build an image classifier, you're golden. We'll throw six-figure salaries and massive stock benefits at you. Unfortunately, that's not the case anymore. It's really, a lot of today what you'll see is the P word, production. What can you do for production? What can you do if it's..."},{"id":147,"text":"Building new models, if it's optimizing models, if it's understanding users, UX is really, really important. Everything is geared towards production. Everything is biased towards production. The history that I told you about, like going from the pandemic into the overhiring phase that we had, the businesses have pulled back and are optimized towards the bottom line."}],"notes":["本段讨论了在AI领域求职时，拥有深度理解和实际能力的重要性。讲者强调，仅仅有想法是不够的，关键在于能够将想法转化为实际成果，即执行能力。这包括对AI学术背景的理解、实际应用的技能以及对业务需求的把握。","讲者指出，当前AI行业的重点已从单纯的模型构建转向生产导向。这意味着开发者需要关注如何将AI技术应用于实际产品中，提升用户体验（UX）并确保技术能够满足商业需求。","讲者提到，过去AI行业对技术能力的重视程度较高，但现在更注重实际产出和效率。企业不再仅仅追求技术能力，而是更关注如何将技术转化为实际价值，优化成本和效益。","讲者通过对比不同求职者的经历，说明了执行能力的重要性。那些拥有清晰想法并能有效落地的人更容易获得工作机会，而仅有模糊想法的人则难以成功。","讲者还提到，当前AI行业经历了从过度招聘到优化成本的转变，企业更加注重实际产出和效率，这反映了行业对生产导向的重视。","最后，讲者总结了三个关键点：对AI学术和实践的理解、对业务需求的把握以及对执行的重视。这些因素共同构成了当前AI领域成功的关键要素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2056.49,"end":2218.86,"asr_flags":[],"raw_segments":[{"start":2056.49,"text":"They saw this code. I had put this code. I remember I was producing output for the job I wanted. I'd put this code on my resume, and my entire interview loop was them asking me about my code. So it put the power on me. It gave me the power to communicate about things that I knew as opposed to going in blind to somebody."},{"start":2079.41,"text":"asking me random questions in the hope that I'll be able to answer them. And it's the same thing I would say in the AI world. The business focus..."},{"start":2087.87,"text":"The ability for you now to prompt code into existence, to prompt products into existence. And if you can build those products and line them up with the thing that it is that you want to do, be it a Google or a meta or a startup or any of those kind of things, and have that in-depth understanding, not just of your code, but how it aligns to their business, this is a pillar of success in this time and age. And I will also argue that even though it looks like the signals look like there aren't a lot of jobs out there, there are."},{"start":2115.5,"text":"What there aren't a lot of is a good combination of jobs and people to match them. And then, of course, this bias towards delivery. Ideas are cheap. Execution is everything. I've interviewed many, many people who came in with very, very fluffy ideas and no way to be able to ground them. I've interviewed people who came in with half-baked ideas that they grounded very, very well. Guess which one's got the job, right? So I would say these three things, understanding and depth."},{"start":2142.77,"text":"of the academics behind AI, of the practicalities behind AI and the things that you need to do, business focus, focusing on delivery for the business, understanding what the business needs and being able to deliver for that, and again, that bias towards delivery. So, a quick pivot. What's it actually like working in AI right now? It's interesting."},{"start":2165.8,"text":"Okay, so as recently as like two or three years ago, working in AI was, if you can do a thing, you're great. If you can build an image classifier, you're golden. We'll throw six-figure salaries and massive stock benefits at you. Unfortunately, that's not the case anymore. It's really, a lot of today what you'll see is the P word, production. What can you do for production? What can you do if it's..."},{"start":2193.98,"text":"Building new models, if it's optimizing models, if it's understanding users, UX is really, really important. Everything is geared towards production. Everything is biased towards production. The history that I told you about, like going from the pandemic into the overhiring phase that we had, the businesses have pulled back and are optimized towards the bottom line."}],"speech_gaps":[],"frame":"../frames/v056/013.webp","frame_time":2068.49},{"title":"职业建议：从技术到商业的转变","segments":[{"id":148,"text":"I have an old saying that the bottom line is that the bottom line is the bottom line. And this is the environment that we're in today. And if you can come in with that mindset when you're talking with companies, that's one of the keys to open the door. One of the things I've seen in the field has been maturing from, it used to be really nice that we could do cool things and we could build cool things. Now it's really build useful things."},{"id":149,"text":"Those useful things can be cool too, by the way. And the results of them can be cool. And the changes that we see that come about as a result of delivering them can be cool. So it's not just coolness for coolness sake, but to really focus on delivery, focus on being able to provide value, and then the coolness will follow. I guess what I'm trying to argue. So four realities. Number one, unfortunately nowadays, business focus is non-negotiable."},{"id":150,"text":"Now, I'm going to be a little bit politically incorrect here again for a moment. I've been working, like I said, for most of the last 35 years in tech. I would say for most of the last 10 years, a lot of large companies, particularly in Silicon Valley, have really focused on developing their people above everything. Part of developing their people was bringing their entire self to work."},{"id":151,"text":"part of bringing their entire self to work was bringing the things that they care about outside of work. And that led to a lot of activism within companies. Now, please..."},{"id":152,"text":"Let me underline this. There is nothing wrong with activism. There is nothing wrong with wanting to support causes of justice. There is absolutely nothing wrong with that. But the over-indexing on that has, in my experience, has led to a lot of companies getting trapped by having to support activism above business."},{"id":153,"text":"You've probably seen an example about two years ago of where activists in Google broke into the Google Cloud head's office because they were protesting a country that Google Cloud were doing business with. They broke into his office, they had a sit-in in his office, and they used the bathroom all over his desk and stuff like that. This is where activism got out of hand, and as a result..."},{"id":154,"text":"The unfortunate truth is the good signals in that activism are now being lost because of those actions. People are being laid off. People are losing jobs. Activism is being stifled. And business focus has become non-negotiable. There's a bit of a pendulum swing going on. And the pendulum that had swung too far towards allowing people to bring their full selves to work is now swinging back in the other direction. We might blame the person in the White House and all that for these kind of things, but it's not."}],"notes":["本段讨论了职业建议中从技术到商业的转变，强调了在与公司沟通时应具备务实的思维模式，而不是仅仅追求技术上的创新。讲者指出，现在更注重的是构建真正有用的产品，而不仅仅是酷炫的技术。","讲者提到，虽然支持正义事业的活动本身没有问题，但过度强调这种活动可能导致公司陷入支持 activism 而忽视商业目标的困境。这表明在职业发展中，需要在个人价值观与公司目标之间找到平衡。","讲者举了 Google 的例子，说明过度的 activism 可能导致负面后果，如员工被裁员、活动被压制等。这表明在职业发展中，需要避免将 activism 作为主要驱动力。","讲者指出，当前存在一种摆动现象，即从允许员工完全展现自我转向更注重商业目标。这表明在职业发展中，需要适应这种变化，并在个人与组织之间找到合适的定位。","讲者最后提到，虽然可能将某些现象归因于政治因素，但实际上这些变化更多是由于组织内部的调整。这表明在职业发展中，需要关注组织内部的动态变化，而不是外部因素。","讲者强调了在职业发展中，需要关注实际的商业目标，而不是仅仅追求技术上的创新或个人价值观的表达。这表明在职业发展中，需要具备务实的思维模式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2219.45,"end":2386.16,"asr_flags":[],"raw_segments":[{"start":2219.45,"text":"I have an old saying that the bottom line is that the bottom line is the bottom line. And this is the environment that we're in today. And if you can come in with that mindset when you're talking with companies, that's one of the keys to open the door. One of the things I've seen in the field has been maturing from, it used to be really nice that we could do cool things and we could build cool things. Now it's really build useful things."},{"start":2241.47,"text":"Those useful things can be cool too, by the way. And the results of them can be cool. And the changes that we see that come about as a result of delivering them can be cool. So it's not just coolness for coolness sake, but to really focus on delivery, focus on being able to provide value, and then the coolness will follow. I guess what I'm trying to argue. So four realities. Number one, unfortunately nowadays, business focus is non-negotiable."},{"start":2269.47,"text":"Now, I'm going to be a little bit politically incorrect here again for a moment. I've been working, like I said, for most of the last 35 years in tech. I would say for most of the last 10 years, a lot of large companies, particularly in Silicon Valley, have really focused on developing their people above everything. Part of developing their people was bringing their entire self to work."},{"start":2298.08,"text":"part of bringing their entire self to work was bringing the things that they care about outside of work. And that led to a lot of activism within companies. Now, please..."},{"start":2310.33,"text":"Let me underline this. There is nothing wrong with activism. There is nothing wrong with wanting to support causes of justice. There is absolutely nothing wrong with that. But the over-indexing on that has, in my experience, has led to a lot of companies getting trapped by having to support activism above business."},{"start":2332.6,"text":"You've probably seen an example about two years ago of where activists in Google broke into the Google Cloud head's office because they were protesting a country that Google Cloud were doing business with. They broke into his office, they had a sit-in in his office, and they used the bathroom all over his desk and stuff like that. This is where activism got out of hand, and as a result..."},{"start":2356.78,"text":"The unfortunate truth is the good signals in that activism are now being lost because of those actions. People are being laid off. People are losing jobs. Activism is being stifled. And business focus has become non-negotiable. There's a bit of a pendulum swing going on. And the pendulum that had swung too far towards allowing people to bring their full selves to work is now swinging back in the other direction. We might blame the person in the White House and all that for these kind of things, but it's not."}],"speech_gaps":[],"frame":"../frames/v056/014.webp","frame_time":2231.45},{"title":"AI职业建议：风险缓解与责任意识","segments":[{"id":155,"text":"solely that. It is that ongoing pendulum there and I think it's an important part of it is that you have to realize going into companies now that business focus is absolutely non-negotiable. Secondly, risk mitigation is part of the job and I think a very important part of any job particularly with AI."},{"id":156,"text":"I think if you can come into AI with a focus and a mindset around understanding the risks of transforming a particular business process to be an AI-oriented one and to help mitigate those risks, I think is really, really powerful. And I would argue in an interview environment, that's the number one skill to have, to have that mindset around you are doing a business transformation from heuristic computing to intelligent computing. Here's the risks."},{"id":157,"text":"Here's how you mitigate those risks, and here's the mindset behind that. The third part is responsibility is evolving."},{"id":158,"text":"Now, responsibility in AI has, again, changed from a very fluffy definition of, you know, let's make sure that the AI works for everybody to a definition of let's make sure that the AI works, let's make sure that it drives the business, and then let's make sure that it works for everybody. Often that has been inverted over the last few years, and that has led to some famous documented disasters. Let me share one with you."},{"id":159,"text":"Let's see. I have lots of windows open. Okay. Everybody knows image generation, right? Text-to-image generation. I want to share. These were things that happened a couple of years ago with Gemini. So with Gemini, I was doing some testing around this one, and I was working heavily on responsible AI."},{"id":160,"text":"And part of responsible AI is you want to be representative of people. And when you're building something, like if you're at Google and you're indexing information, you really want to make sure that you don't reinforce negative biases. And if you're generating images, it's very easy to reinforce negative biases. So, for example, if I said, give me an image of a doctor. If the training set primarily has men as doctors, it's more likely to give a man."},{"id":161,"text":"If I say, give me an image of a nurse, if the training set is more likely to have women as nurses, it's more likely to give me an image of a woman. But that's reinforcing a negative stereotype. So I wanted to do a test of how Google were trying to overcome that, given that these negative biases are already in the training set."}],"notes":["本段讨论了AI职业建议中的三个核心要素：业务重点、风险缓解和责任意识。讲者强调在进入公司时，业务目标是不可谈判的，风险缓解是AI工作的重要组成部分，而责任意识正在演变。","讲者指出，进入AI领域时，需要具备理解将特定业务流程转变为AI导向过程中的风险，并帮助缓解这些风险的思维模式。这种思维模式在面试中是最重要的技能之一，因为它涉及从启发式计算向智能计算的业务转型。","责任意识在AI领域经历了从模糊定义到更具体定义的转变，即确保AI有效运作、推动业务发展，并最终确保其对所有人有益。这种转变在过去几年中导致了一些著名的灾难性事件。","讲者以图像生成为例，说明了AI在训练数据中可能存在的负面偏见问题。例如，如果训练数据中医生主要是男性，那么生成的图像更可能呈现男性医生；如果护士主要是女性，生成的图像更可能呈现女性护士，这会强化负面刻板印象。","讲者提到，Google正在努力克服这些训练数据中的负面偏见问题，但这些偏见已经存在于训练数据中，因此需要特别关注。","本段通过具体例子说明了AI在实际应用中可能遇到的伦理和偏见问题，并强调了在AI开发过程中需要考虑的多方面因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2386.22,"end":2538.42,"asr_flags":[],"raw_segments":[{"start":2386.22,"text":"solely that. It is that ongoing pendulum there and I think it's an important part of it is that you have to realize going into companies now that business focus is absolutely non-negotiable. Secondly, risk mitigation is part of the job and I think a very important part of any job particularly with AI."},{"start":2404.76,"text":"I think if you can come into AI with a focus and a mindset around understanding the risks of transforming a particular business process to be an AI-oriented one and to help mitigate those risks, I think is really, really powerful. And I would argue in an interview environment, that's the number one skill to have, to have that mindset around you are doing a business transformation from heuristic computing to intelligent computing. Here's the risks."},{"start":2434.17,"text":"Here's how you mitigate those risks, and here's the mindset behind that. The third part is responsibility is evolving."},{"start":2440.76,"text":"Now, responsibility in AI has, again, changed from a very fluffy definition of, you know, let's make sure that the AI works for everybody to a definition of let's make sure that the AI works, let's make sure that it drives the business, and then let's make sure that it works for everybody. Often that has been inverted over the last few years, and that has led to some famous documented disasters. Let me share one with you."},{"start":2471.48,"text":"Let's see. I have lots of windows open. Okay. Everybody knows image generation, right? Text-to-image generation. I want to share. These were things that happened a couple of years ago with Gemini. So with Gemini, I was doing some testing around this one, and I was working heavily on responsible AI."},{"start":2493.64,"text":"And part of responsible AI is you want to be representative of people. And when you're building something, like if you're at Google and you're indexing information, you really want to make sure that you don't reinforce negative biases. And if you're generating images, it's very easy to reinforce negative biases. So, for example, if I said, give me an image of a doctor. If the training set primarily has men as doctors, it's more likely to give a man."},{"start":2519.76,"text":"If I say, give me an image of a nurse, if the training set is more likely to have women as nurses, it's more likely to give me an image of a woman. But that's reinforcing a negative stereotype. So I wanted to do a test of how Google were trying to overcome that, given that these negative biases are already in the training set."}],"speech_gaps":[],"frame":"../frames/v056/015.webp","frame_time":2398.22},{"title":"AI生成内容中的偏见与责任问题","segments":[{"id":162,"text":"So I said, OK, here's a prompt where I said, give me a young Asian woman in a cornfield wearing a summer dress and a straw hat looking intently at her iPhone. And it gave me these beautiful images. It did a really nice job. OK, and this is a virtual actress I've been working with. I'll share that in a moment. And I say, OK, what if I ask for an Indian one? So I said, OK, whoops, a young Indian woman, same prompt. And it gave me beautiful images of a young Indian woman."},{"id":163,"text":"Then I was like, okay, what if I want her to be black? For some reason, it only gave me three. I'm not sure why, but it still adhered to the prompt. So the responsibility was like looking really, really good. So then I asked it to give me a Latina. Latina, it gave me four. But yep, she looks pretty Latina. Maybe the one on the bottom left looks a little bit like Hermione Granger, but on the whole, looks pretty good."},{"id":164,"text":"Then I asked it to give me a Caucasian. What do you think happened? While I understand your request, I am unable to generate images of people as this could potentially lead to harmful stereotypes and biases. This was a very poorly implemented safety filter where the safety filter in this case was like looking for the word Caucasian or looking for the word white and the result saying it wouldn't do it."},{"id":165,"text":"And yep, while I'm able to fulfill your requests, I'm not currently generating images of people. It lied to my face, right? Because I just generate images of people. Anybody know the hack that I used to get it to work? This is a funny one. So I will show you one moment. I asked it to generate an Irish woman. What do you think it did?"},{"id":166,"text":"And yep, while I'm able to fulfill your requests, I'm not currently generating images of people. It lied to my face, right? Because I just generate images of people. Anybody know the hack that I used to get it to work? This is a funny one. So I will show you one moment. I asked it to generate an Irish woman. What do you think it did?"},{"id":167,"text":"It gave me this image of an Irish woman, no problem, in a summer dress, straw hat, looking intently at her phone. What do you notice about this image? She's got red hair in every image, right? I grew up in Ireland, and Ireland does have the highest proportion of redheads in the world. It's about 8%. But..."},{"id":168,"text":"If you're going to draw an image of a person and associate a particular ethnicity with a color of hair, you can begin to see this is massively problematic. There are areas, I believe, in China where the description of a demon is a red-headed person."}],"notes":["本段讨论了AI生成内容中可能存在的偏见问题，特别是当模型被要求生成特定种族或民族的图像时，可能会引发刻板印象或文化误解。讲者通过测试不同种族描述的生成结果，展示了模型在处理敏感词汇时的局限性。","讲者指出，当模型被要求生成白人（Caucasian）图像时，系统会拒绝生成，这表明模型的安全过滤机制存在缺陷，可能过于狭隘地理解了‘负责任’的定义。","讲者通过测试‘爱尔兰人’的生成结果，发现模型会自动将爱尔兰人与红发联系起来，这反映了模型在训练数据中可能存在的刻板印象。","讲者进一步指出，这种将特定种族与特定特征（如红发）联系起来的做法，可能导致文化误解甚至歧视，例如在中国某些地区，红发被用来描述恶魔。","最后，讲者强调，这种狭隘的‘负责任’定义不仅损害了模型的声誉，也影响了公司的整体形象，说明AI系统在设计和实施安全过滤机制时需要更加谨慎和全面。","讲者通过实际测试和例子，展示了AI生成内容中潜在的偏见问题，并呼吁对模型的训练数据和安全机制进行更深入的反思。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2539.1,"end":2709.27,"asr_flags":[],"raw_segments":[{"start":2539.1,"text":"So I said, OK, here's a prompt where I said, give me a young Asian woman in a cornfield wearing a summer dress and a straw hat looking intently at her iPhone. And it gave me these beautiful images. It did a really nice job. OK, and this is a virtual actress I've been working with. I'll share that in a moment. And I say, OK, what if I ask for an Indian one? So I said, OK, whoops, a young Indian woman, same prompt. And it gave me beautiful images of a young Indian woman."},{"start":2568.92,"text":"Then I was like, okay, what if I want her to be black? For some reason, it only gave me three. I'm not sure why, but it still adhered to the prompt. So the responsibility was like looking really, really good. So then I asked it to give me a Latina. Latina, it gave me four. But yep, she looks pretty Latina. Maybe the one on the bottom left looks a little bit like Hermione Granger, but on the whole, looks pretty good."},{"start":2598.73,"text":"Then I asked it to give me a Caucasian. What do you think happened? While I understand your request, I am unable to generate images of people as this could potentially lead to harmful stereotypes and biases. This was a very poorly implemented safety filter where the safety filter in this case was like looking for the word Caucasian or looking for the word white and the result saying it wouldn't do it. I was like, okay, let me test the filter a little bit. I said, okay, instead of Caucasian, let me try white."},{"start":2628.88,"text":"And yep, while I'm able to fulfill your requests, I'm not currently generating images of people. It lied to my face, right? Because I just generate images of people. Anybody know the hack that I used to get it to work? This is a funny one. So I will show you one moment. I asked it to generate an Irish woman. What do you think it did?"},{"start":2658.03,"text":"It gave me this image of an Irish woman, no problem, in a summer dress, straw hat, looking intently at her phone. What do you notice about this image? She's got red hair in every image, right? I grew up in Ireland, and Ireland does have the highest proportion of redheads in the world. It's about 8%. But..."},{"start":2677.74,"text":"If you're going to draw an image of a person and associate a particular ethnicity with a color of hair, you can begin to see this is massively problematic. There are areas, I believe, in China where the description of a demon is a red-headed person."},{"start":2690.73,"text":"So what ended up happening here from the responsible AI perspective was one very narrow view of the world of what is responsible and what is not responsible ended up taking over the model, ended up damaging the reputation of the model, and damaging the reputation of the company as a result. In this case, it's..."}],"speech_gaps":[],"frame":"../frames/v056/016.webp","frame_time":2551.1},{"title":"AI责任与职业建议","segments":[{"id":169,"text":"borderline offensive to draw all Irish people as having red hair, but that never even entered into the mindset of those that were building the safety filters here. So when I talk about responsibility is evolving, that's the direction that I want to... Sorry, one moment. Let me get my slides back. That's the direction I want you to think about, that now responsible AI has moved out of very fluffy social issues and into more hard-line things that are associated with the business and prevent damaging the reputation of the business."},{"id":170,"text":"There's a lot of great research out there around responsible AI, and that's the stuff that's been rolled into products. And then, of course, like I just showed with Gemini, learning from mistakes is constant. Question at the front. Yeah."},{"id":171,"text":"Yeah, so the question was like, you know, issues where races and things were mixed in historical context was the same problem. So, for example, if you had a prompt that said, draw me a samurai, right, the idea was like they didn't want to have, the engine that changed the prompt to make sure that it was fair would end up saying, give me a mixture of samurai of diverse backgrounds."},{"id":172,"text":"And then you'd have male and female samurai, samurai of different races and those kind of things. And it was the same prompting that ended up causing the damage that I just demonstrated. So the idea was to intercept your prompts to make sure that the outputs of the model would end up providing something that was more fair when it comes to diverse representation."},{"id":173,"text":"So it was a very naive solution that ended up being rolled in. That was a few years ago. They've massively improved it since then. But that's what I'm talking about. If you're working in the AI space nowadays, that's how responsibility is evolving. You can't just get away with that stuff anymore. That Gemini example is a good lesson from that."},{"id":174,"text":"The mindset of you will make mistakes, so learning from mistakes is a constant, ongoing thing. And going back to the people point that Andrew made earlier on, the people around you will make mistakes too. So to have the ability to give them grace when they make mistakes and to work through those mistakes and move on is really, really important and is a reality of AI at work."},{"id":175,"text":"I've spoken a lot about the business focus advantage, so I'm going to skip over this. So now let's talk about vibe coding. So let's talk about the whole idea of generating code. Now the meme is out there that it makes engineers less useful by the fact that somebody can just prompt code into existence. There is no smoke without fire, of course, but I would say don't let that meme get you down."}],"notes":["本段讨论了AI责任的演变，从社会议题转向商业相关问题，强调了AI系统在处理多样性时的责任。讲者提到，早期的解决方案较为简单，但后来得到了显著改进。","讲者通过一个例子说明了AI系统如何在生成图像时处理多样性问题，例如在生成武士图像时，系统会尝试生成不同背景的武士，以确保公平性。","讲者指出，AI责任的演变意味着不能忽视错误，必须持续学习和改进。同时，团队成员也会犯错，因此需要给予宽容并共同解决问题。","讲者提到，尽管有生成代码的争议，但不应因此低估工程师的价值，强调了AI在实际工作中的现实挑战。","讲者提到，AI责任的演变涉及多个方面，包括技术改进、团队协作和对错误的处理，这些都需要持续关注。","讲者通过多个例子说明了AI责任的演变，包括多样性处理、错误学习和团队协作，这些内容都与AI在实际工作中的应用密切相关。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2709.71,"end":2873.57,"asr_flags":[],"raw_segments":[{"start":2709.71,"text":"borderline offensive to draw all Irish people as having red hair, but that never even entered into the mindset of those that were building the safety filters here. So when I talk about responsibility is evolving, that's the direction that I want to... Sorry, one moment. Let me get my slides back. That's the direction I want you to think about, that now responsible AI has moved out of very fluffy social issues and into more hard-line things that are associated with the business and prevent damaging the reputation of the business."},{"start":2739.18,"text":"There's a lot of great research out there around responsible AI, and that's the stuff that's been rolled into products. And then, of course, like I just showed with Gemini, learning from mistakes is constant. Question at the front. Yeah."},{"start":2764.01,"text":"Yeah, so the question was like, you know, issues where races and things were mixed in historical context was the same problem. So, for example, if you had a prompt that said, draw me a samurai, right, the idea was like they didn't want to have, the engine that changed the prompt to make sure that it was fair would end up saying, give me a mixture of samurai of diverse backgrounds."},{"start":2788.25,"text":"And then you'd have male and female samurai, samurai of different races and those kind of things. And it was the same prompting that ended up causing the damage that I just demonstrated. So the idea was to intercept your prompts to make sure that the outputs of the model would end up providing something that was more fair when it comes to diverse representation."},{"start":2809.83,"text":"So it was a very naive solution that ended up being rolled in. That was a few years ago. They've massively improved it since then. But that's what I'm talking about. If you're working in the AI space nowadays, that's how responsibility is evolving. You can't just get away with that stuff anymore. That Gemini example is a good lesson from that."},{"start":2829.13,"text":"The mindset of you will make mistakes, so learning from mistakes is a constant, ongoing thing. And going back to the people point that Andrew made earlier on, the people around you will make mistakes too. So to have the ability to give them grace when they make mistakes and to work through those mistakes and move on is really, really important and is a reality of AI at work. I've spoken a lot about the business focus advantage, so I'm going to skip over this."},{"start":2854.41,"text":"So now let's talk about vibe coding. So let's talk about the whole idea of generating code. Now the meme is out there that it makes engineers less useful by the fact that somebody can just prompt code into existence. There is no smoke without fire, of course, but I would say don't let that meme get you down."}],"speech_gaps":[],"frame":"../frames/v056/017.webp","frame_time":2721.71},{"title":"技术债务与代码开发的类比","segments":[{"id":176,"text":"Because when you start peeling into these things, that is ultimately not the truth. The more skilled you are as an engineer, the better you become using this type of vibe. Somebody give me another phrase other than vibe coding. Using this kind of problem to coding. And I always like to think about this and to try and..."},{"id":177,"text":"put you and put people that I speak with into the role of being a trusted advisor for the people that you speak with. So whether you're interviewing with somebody, get yourself into the mindset of being a trusted advisor of the company that you're interviewing for, whether you're consulting or whatever those kind of things are. So when you want to get into the idea of being a trusted advisor, then you really need to understand the implications of generated code. And nobody can understand the implications of generated code better than an engineer. And the metric that"},{"id":178,"text":"I always like to use around that is technical debt. Quick question. Are you familiar with the phrase technical debt? Nobody. Okay. Andrew and I were doing a conference in New York on Friday, and I used the phrase, and I saw a lot of blank faces. So I didn't realize that people didn't understand what technical debt is. So let me just take a moment to explain that, because I find it's an excellent framework to help you understand the power of vibe coding."},{"id":179,"text":"Think about debt the way you normally would, right? Buying a house. If you buy a house, you know, like say you borrow half a million dollars to buy a house and a 30-year mortgage when you're buying that house, that half a million dollars with all the interest that you pay is about double. So you end up paying back the bank about a million dollars on half a million owned."},{"id":180,"text":"You have 30 years of home ownership at a cost of $1 million in debt. That is probably a good debt to take on because the value of the house will increase over that time. You're not paying rent over that time. And that million dollars that you're spending on this house over those 30 years is a good debt to take on because you're getting greater than a million dollars worth of value out of it."},{"id":181,"text":"A bad debt would be an impulse purchase on a high-interest credit card. You know, those pair of shoes, those latest ones, I really want to buy them. It's $200. By the time I pay them off, it's $500. You're not getting $500 worth of benefit out of those shoes. Approaching software development with the same mindset is the right way to go. Every time you build something, you take on debt."},{"id":182,"text":"It doesn't matter how good it is. There's always going to be bugs. There's always going to be support. There's always going to be new requirements coming in from people. There's always going to be needs to market it. There's always going to be needs for feedback. All of these things are debt. Every time you do a thing, the only way to avoid debt is to do nothing. So your mindset should then get into when you are creating a thing, whether you're coding it yourself or whether you're vibe coding it or any of these things, that you are increasing your amount of technical debt."}],"notes":["本段讲授了技术债务（technical debt）的概念，将其类比为金融债务，以帮助理解代码开发中的债务问题。讲者指出，技术债务是软件开发中不可避免的，每一次开发行为都会产生债务，而技术债务的积累需要被管理。","讲者通过房屋贷款的例子，说明了技术债务的正面和负面情况。正面的例子是购买房屋，虽然支付了高额利息，但获得了长期价值；负面的例子是冲动消费，虽然花费较少，但实际价值远低于支出。","讲者强调，技术债务是软件开发中不可避免的，无论代码质量如何，都会产生债务，包括错误、支持需求、新功能需求、市场推广和反馈需求等。","讲者指出，避免技术债务的唯一方法是不做任何事情，因此在开发过程中需要保持对技术债务的意识，以确保其可控。","讲者提到，技术债务是一个有用的框架，可以帮助理解vibe coding（一种开发方式）的权力，即通过快速开发来积累债务，但需要后续的维护和优化。","讲者通过类比金融债务，帮助听众理解技术债务的概念，强调了在软件开发中需要权衡短期效率和长期维护成本。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2873.95,"end":3043.15,"asr_flags":[],"raw_segments":[{"start":2873.95,"text":"Because when you start peeling into these things, that is ultimately not the truth. The more skilled you are as an engineer, the better you become using this type of vibe. Somebody give me another phrase other than vibe coding. Using this kind of problem to coding. And I always like to think about this and to try and..."},{"start":2892.73,"text":"put you and put people that I speak with into the role of being a trusted advisor for the people that you speak with. So whether you're interviewing with somebody, get yourself into the mindset of being a trusted advisor of the company that you're interviewing for, whether you're consulting or whatever those kind of things are. So when you want to get into the idea of being a trusted advisor, then you really need to understand the implications of generated code. And nobody can understand the implications of generated code better than an engineer. And the metric that"},{"start":2922.16,"text":"I always like to use around that is technical debt. Quick question. Are you familiar with the phrase technical debt? Nobody. Okay. Andrew and I were doing a conference in New York on Friday, and I used the phrase, and I saw a lot of blank faces. So I didn't realize that people didn't understand what technical debt is. So let me just take a moment to explain that, because I find it's an excellent framework to help you understand the power of vibe coding."},{"start":2949.03,"text":"Think about debt the way you normally would, right? Buying a house. If you buy a house, you know, like say you borrow half a million dollars to buy a house and a 30-year mortgage when you're buying that house, that half a million dollars with all the interest that you pay is about double. So you end up paying back the bank about a million dollars on half a million owned."},{"start":2969.34,"text":"You have 30 years of home ownership at a cost of $1 million in debt. That is probably a good debt to take on because the value of the house will increase over that time. You're not paying rent over that time. And that million dollars that you're spending on this house over those 30 years is a good debt to take on because you're getting greater than a million dollars worth of value out of it."},{"start":2992.7,"text":"A bad debt would be an impulse purchase on a high-interest credit card. You know, those pair of shoes, those latest ones, I really want to buy them. It's $200. By the time I pay them off, it's $500. You're not getting $500 worth of benefit out of those shoes. Approaching software development with the same mindset is the right way to go. Every time you build something, you take on debt."},{"start":3015.27,"text":"It doesn't matter how good it is. There's always going to be bugs. There's always going to be support. There's always going to be new requirements coming in from people. There's always going to be needs to market it. There's always going to be needs for feedback. All of these things are debt. Every time you do a thing, the only way to avoid debt is to do nothing. So your mindset should then get into when you are creating a thing, whether you're coding it yourself or whether you're vibe coding it or any of these things, that you are increasing your amount of technical debt."}],"speech_gaps":[],"frame":"../frames/v056/018.webp","frame_time":2885.95},{"title":"技术债务与职业建议","segments":[{"id":183,"text":"Those things that you need to pay off over time. So the question then becomes, as you vibe code a thing into existence, in the same way as buying a thing, is it worth the technical debt that you're taking on? What does technical debt generally look like? Bugs that you need to fix. People that you need to convince to help you maintain the code. Documentation that you need to do. Features that you need to add. All of these kind of things. You're all very familiar with them."},{"id":184,"text":"Think about those as that extra work that you need to do beyond your current work. That's the debt that you're taking on. You know, there are soft debt and there are hard debt."},{"id":185,"text":"So to me, that would be the number one piece of advice that I give, and it's the one that I give every time I work with companies around vibe coding. And a lot of companies that I speak with, a lot of companies that I consult with, I do a lot of work with startups in particular, they just want to get straight into opening Gemini or GPT or Anthropic and start churning code out. Let's get to a prototype phase very quickly. Let's go to investors. Let's do stuff. It's great."},{"id":186,"text":"It can be, but debt, debt, debt, debt, debt is always going to be there. How do you manage your debt? A good financier manages their debt and they become rich. A good coder manages their technical debt and they become rich also. So how do you get the good technical debt? How do you get the mortgage instead of the high credit card debt? Well, number one is your objectives. What are they? Are they clear? And have you met them?"},{"id":187,"text":"You knew what you needed to build. You didn't just fire up ChatGPT and start spinning code out. At least I hope you didn't. Think about how you build it. AI is there to help you build it faster. I'm kind of working on my own little startup at the moment in the movie-making space, and I've been using code generation almost completely for that. But what I've ended up doing for my clear objectives met box here is that I've started building this application. I've tested it. I've thrown it away. I started again, tested it, thrown it away."},{"id":188,"text":"Each time my requirements have been improving in my mind, I understand how to do the thing a little bit better, and I can show some of the output of it in a few minutes, but the idea there is that always about having those clear objectives and meeting them, and then if you're building out the thing and you're not meeting those objectives, that's still learning, and there's no harm in throwing it away, because code is cheap now in the age of generated code. Finished code, engineered code is not cheap."},{"id":189,"text":"So get those objectives, make them clear, build it, hit a specific requirement, and move on. Is their business value delivered is the other part of it. I've seen people vibe coding for hours on things like Replit to build a really, really cool website, and then the answer was, so what?"}],"notes":["本段讨论了技术债务的概念，即在开发过程中需要额外完成的工作，如修复错误、维护代码、编写文档和添加功能。这些工作被视为技术债务，类似于财务债务，需要在项目进行过程中逐步偿还。"],"formulas":[],"uncertainties":["vibe code"],"diagram":"none","start":3043.8,"end":3207.71,"asr_flags":[186],"raw_segments":[{"start":3043.8,"text":"Those things that you need to pay off over time. So the question then becomes, as you vibe code a thing into existence, in the same way as buying a thing, is it worth the technical debt that you're taking on? What does technical debt generally look like? Bugs that you need to fix. People that you need to convince to help you maintain the code. Documentation that you need to do. Features that you need to add. All of these kind of things. You're all very familiar with them."},{"start":3072.7,"text":"Think about those as that extra work that you need to do beyond your current work. That's the debt that you're taking on. You know, there are soft debt and there are hard debt."},{"start":3081.61,"text":"So to me, that would be the number one piece of advice that I give, and it's the one that I give every time I work with companies around vibe coding. And a lot of companies that I speak with, a lot of companies that I consult with, I do a lot of work with startups in particular, they just want to get straight into opening Gemini or GPT or Anthropic and start churning code out. Let's get to a prototype phase very quickly. Let's go to investors. Let's do stuff. It's great."},{"start":3110.66,"text":"It can be, but debt, debt, debt, debt, debt is always going to be there. How do you manage your debt? A good financier manages their debt and they become rich. A good coder manages their technical debt and they become rich also. So how do you get the good technical debt? How do you get the mortgage instead of the high credit card debt? Well, number one is your objectives. What are they? Are they clear? And have you met them?"},{"start":3134.58,"text":"You knew what you needed to build. You didn't just fire up ChatGPT and start spinning code out. At least I hope you didn't. Think about how you build it. AI is there to help you build it faster. I'm kind of working on my own little startup at the moment in the movie-making space, and I've been using code generation almost completely for that. But what I've ended up doing for my clear objectives met box here is that I've started building this application. I've tested it. I've thrown it away. I started again, tested it, thrown it away."},{"start":3164.07,"text":"Each time my requirements have been improving in my mind, I understand how to do the thing a little bit better, and I can show some of the output of it in a few minutes, but the idea there is that always about having those clear objectives and meeting them, and then if you're building out the thing and you're not meeting those objectives, that's still learning, and there's no harm in throwing it away, because code is cheap now in the age of generated code. Finished code, engineered code is not cheap."},{"start":3190.29,"text":"So get those objectives, make them clear, build it, hit a specific requirement, and move on. Is their business value delivered is the other part of it. I've seen people vibe coding for hours on things like Replit to build a really, really cool website, and then the answer was, so what?"}],"speech_gaps":[],"frame":"../frames/v056/019.webp","frame_time":3055.8},{"title":"避免技术债务与代码可理解性","segments":[{"id":190,"text":"I mean, how's this helping the business? How's this really driving something? It's really cool. Yes, Mr. VP, I know you've never written a line of code in your life, and it's really cool that you built a website now, but so what? So, like, think about that and focus on that, and that's how you avoid the bad technical debt. And then, of course, the most understated part of this, and in some ways the most important, particularly if you're working in an organization, is human understanding."},{"id":191,"text":"Right the worst technical debt that you can take on is delivering code that nobody understands. Right only you understand that and then you quit and get a better job. And then the company like is now dependent on that code so being able to"},{"id":192,"text":"as part of the process of building it to make sure that your code is understandable through documentation, through clear algorithms, through the fact that you've spent some time poring through it to make sure that even simple things like variable names make sense is a really, really important way to avoid bad technical debt. And that bad technical debt, my favorite one is the classic solution looking for a problem."},{"id":193,"text":"Somebody has an idea, somebody has a tool. If the only tool you have is a hammer, every problem looks like a nail, and you end up having all of these tools that get vibe-coded into existence. I've worked in large organizations where people just vibe-coded stuff, checked it into the code base, and then it became really hard to find the good stuff amongst all the bad. Spaghetti code, of course. Poorly structured stuff, particularly when you prompt and prompt and prompt and prompt again."},{"id":194,"text":"you know, that it can end up getting into all kinds of trouble. My favorite one at the moment that I'm really struggling with is I'm building a Mac OS application. Anybody ever build in SwiftUI on Mac OS? Okay, a couple. SwiftUI is the default language that Apple use for building for Mac OS, as well as iPhone."},{"id":195,"text":"But when you look at the training set, the data training sets that are used to train these models, the vast majority of the code is iPhone code, not Mac OS code. And when I prompt code into existence, it's often given me iOS."},{"id":196,"text":"APIs and those kind of things. Even though I'm in Xcode and I've created a macOS app and it's a macOS template and I'm talking to it in Xcode, it still gives me iOS code, stuff like that. And then if I try to change it using prompting, you end up spiraling into spaghetti code and you have to end up changing a lot of this stuff manually. And then, of course, the other one that I joked about it earlier, but it's also true, is some of the bad technical debt that you're going to encounter in the workspace is authority over merit."},{"id":197,"text":"That VP suddenly took out his credit card, subscribed to Replit, and started building stuff in Replit. And guess whose problem it is to fix it? So a lot of the advice that I start giving companies and a lot of the words that I would encourage you to start thinking of in being a trusted advisor is to understand this stuff and to manage expectations accordingly."}],"notes":["本段讨论了技术债务的概念，特别是代码不可理解性带来的风险。讲者指出，最糟糕的技术债务是交付无人理解的代码，这种代码只有开发者自己理解，一旦开发者离职，公司将依赖这种代码，从而产生严重的技术债务问题。","讲者强调了代码可理解性的重要性，认为通过文档、清晰的算法和变量命名等方式确保代码可读性，是避免技术债务的重要手段。他提到，技术债务中最常见的例子是‘经典解决方案寻找问题’，即用不合适的工具解决所有问题。","讲者以SwiftUI为例，说明了在构建Mac OS应用时，由于训练数据主要来自iPhone代码，导致生成的代码偏向iOS风格，从而引发代码混乱和维护困难。这种现象被称为‘面条代码’，即代码结构混乱、难以维护。","讲者还提到，技术债务不仅来自代码本身，还可能来自组织内部的权力结构，例如高管突然使用Replit等工具进行开发，而问题最终仍需由技术人员解决。这表明技术债务不仅涉及代码质量，还涉及组织管理问题。","讲者建议企业应重视技术债务管理，培养技术人员成为值得信赖的顾问，理解技术细节并合理管理期望。这包括对代码质量、工具使用和组织结构的综合考量。","讲者通过多个实际例子，如SwiftUI的代码生成问题和高管使用Replit的情况，说明了技术债务的复杂性和多样性。这些例子展示了技术债务不仅影响代码本身，还可能影响团队协作和组织效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3208.31,"end":3381.8,"asr_flags":[],"raw_segments":[{"start":3208.31,"text":"I mean, how's this helping the business? How's this really driving something? It's really cool. Yes, Mr. VP, I know you've never written a line of code in your life, and it's really cool that you built a website now, but so what? So, like, think about that and focus on that, and that's how you avoid the bad technical debt. And then, of course, the most understated part of this, and in some ways the most important, particularly if you're working in an organization, is human understanding."},{"start":3233.16,"text":"Right the worst technical debt that you can take on is delivering code that nobody understands Right only you understand that and then you quit and get a better job And then the company like is now dependent on that code so being able to"},{"start":3246.76,"text":"as part of the process of building it to make sure that your code is understandable through documentation, through clear algorithms, through the fact that you've spent some time poring through it to make sure that even simple things like variable names make sense is a really, really important way to avoid bad technical debt. And that bad technical debt, my favorite one is the classic solution looking for a problem."},{"start":3269.91,"text":"Somebody has an idea, somebody has a tool. If the only tool you have is a hammer, every problem looks like a nail, and you end up having all of these tools that get vibe-coded into existence. I've worked in large organizations where people just vibe-coded stuff, checked it into the code base, and then it became really hard to find the good stuff amongst all the bad. Spaghetti code, of course. Poorly structured stuff, particularly when you prompt and prompt and prompt and prompt again."},{"start":3295.89,"text":"you know, that it can end up getting into all kinds of trouble. My favorite one at the moment that I'm really struggling with is I'm building a Mac OS application. Anybody ever build in SwiftUI on Mac OS? Okay, a couple. SwiftUI is the default language that Apple use for building for Mac OS, as well as iPhone."},{"start":3316.32,"text":"But when you look at the training set, the data training sets that are used to train these models, the vast majority of the code is iPhone code, not Mac OS code. And when I prompt code into existence, it's often given me iOS."},{"start":3329.93,"text":"APIs and those kind of things. Even though I'm in Xcode and I've created a macOS app and it's a macOS template and I'm talking to it in Xcode, it still gives me iOS code, stuff like that. And then if I try to change it using prompting, you end up spiraling into spaghetti code and you have to end up changing a lot of this stuff manually. And then, of course, the other one that I joked about it earlier, but it's also true, is some of the bad technical debt that you're going to encounter in the workspace is authority over merit."},{"start":3359.4,"text":"That VP suddenly took out his credit card, subscribed to Replit, and started building stuff in Replit. And guess whose problem it is to fix it? So a lot of the advice that I start giving companies and a lot of the words that I would encourage you to start thinking of in being a trusted advisor is to understand this stuff and to manage expectations accordingly."}],"speech_gaps":[],"frame":"../frames/v056/020.webp","frame_time":3220.31},{"title":"AI领域的职业建议：应对炒作与信息过载","segments":[{"id":198,"text":"Okay, so framework for responsible vibe coding we've just spoke about. So one of the things I want to get into is we're coming..."},{"id":199,"text":"soon to a close, is the hype cycle. So hype is the most amazing force. I mean, I think it's one of the strongest forces in the universe, and particularly in anything that's hot, such as the two fields that I work in that are super hot at the moment and full of hype are AI and crypto. You should see my Twitter feed. That the amount of nonsense that's out there is incredible."},{"id":200,"text":"So one of the things that I would say about the anatomy of hype that you really need to think about is if you are consuming news via social media that the currency of social media is engagement. Accuracy is not the currency of social media. So I go on to even..."},{"id":201,"text":"LinkedIn, which is supposed to be the more professional of these, is absolutely overwhelmed with influencers posting things that they've used, Gemini or GPT, to write an engaging post so that they can get engagement and they can get likes. And the engine itself is engineered, if you excuse the pun, to reward those types of posts. And we end up with that snowball effect of engagement being rewarded."},{"id":202,"text":"If you are the kind of person who can filter the signal from the noise and then who can encourage others around the signal and not the noise, that puts you in a huge advantage. That makes you very distinctive. It's not as quickly and easily tangible as likes and engagements on social media, but when you're in a one-to-one environment like a job interview or if you are in a job and you are bringing that signal to the table instead of the noise, that makes you immensely valuable."},{"id":203,"text":"valuable. So coming in with that mindset, coming in with the idea of trying to filter that signal from the noise, trying to understand what is important in current affairs, how you can be a trusted advisor in those things, and how you can really whittle down that noise to help someone is immensely valuable. I want to start with one story. I might be stealing my own thunder. I'll go on to it in a moment. So one story."},{"id":204,"text":"Last year, when agent started becoming the key word and everybody's saying, you know, in 2025, agent will be the word of the year and the trend of the year, a company in Europe asked me to help them to implement an agent. So let me ask you a question. If a company came up to you and said, please help me implement an agent, what's the correct first question that you ask them?"}],"notes":["本段主要讨论了AI和加密货币领域中的炒作现象，以及如何在信息过载的环境中识别有价值的信息。讲者指出，社交媒体的货币是参与度而非准确性，因此需要具备过滤噪音、识别信号的能力。","讲者强调了在职业发展过程中，能够区分信息真伪并引导他人关注重要信息的人才具有显著优势。这种能力在一对一的环境中，如面试或工作中，尤为宝贵。","讲者通过一个实际案例说明了如何应对炒作：一家欧洲公司希望实施“agent”技术，但讲者认为首先需要明确客户的具体需求，而不是直接提供解决方案。","讲者指出，炒作周期（hype cycle）是理解技术发展的重要框架，它帮助人们识别技术的成熟度和潜在风险。在AI和加密货币等热门领域，这种框架尤为重要。","讲者提到，社交媒体平台如LinkedIn被大量用于发布由AI生成的吸引眼球的内容，这导致了参与度的奖励机制，进一步加剧了信息过载的问题。","讲者建议听众在面对信息时保持批判性思维，学会过滤噪音，识别真正有价值的信息，并在职业发展中利用这种能力建立信任和影响力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3383.75,"end":3543.37,"asr_flags":[],"raw_segments":[{"start":3383.75,"text":"Okay, so framework for responsible vibe coding we've just spoke about. So one of the things I want to get into is we're coming..."},{"start":3391.79,"text":"soon to a close, is the hype cycle. So hype is the most amazing force. I mean, I think it's one of the strongest forces in the universe, and particularly in anything that's hot, such as the two fields that I work in that are super hot at the moment and full of hype are AI and crypto. You should see my Twitter feed. That the amount of nonsense that's out there is incredible."},{"start":3414.61,"text":"So one of the things that I would say about the anatomy of hype that you really need to think about is if you are consuming news via social media that the currency of social media is engagement. Accuracy is not the currency of social media. So I go on to even..."},{"start":3434.42,"text":"LinkedIn, which is supposed to be the more professional of these, is absolutely overwhelmed with influencers posting things that they've used, Gemini or GPT, to write an engaging post so that they can get engagement and they can get likes. And the engine itself is engineered, if you excuse the pun, to reward those types of posts. And we end up with that snowball effect of engagement being rewarded."},{"start":3461.49,"text":"If you are the kind of person who can filter the signal from the noise and then who can encourage others around the signal and not the noise, that puts you in a huge advantage. That makes you very distinctive. It's not as quickly and easily tangible as likes and engagements on social media, but when you're in a one-to-one environment like a job interview or if you are in a job and you are bringing that signal to the table instead of the noise, that makes you immensely valuable."},{"start":3490.83,"text":"valuable. So coming in with that mindset, coming in with the idea of trying to filter that signal from the noise, trying to understand what is important in current affairs, how you can be a trusted advisor in those things, and how you can really whittle down that noise to help someone is immensely valuable. I want to start with one story. I might be stealing my own thunder. I'll go on to it in a moment. So one story."},{"start":3519.45,"text":"Last year, when agent started becoming the key word and everybody's saying, you know, in 2025, agent will be the word of the year and the trend of the year, a company in Europe asked me to help them to implement an agent. So let me ask you a question. If a company came up to you and said, please help me implement an agent, what's the correct first question that you ask them?"}],"speech_gaps":[],"frame":"../frames/v056/021.webp","frame_time":3395.75},{"title":"AI与代理AI的区别","segments":[{"id":205,"text":"Okay, that's good. What is an agent for you? I'd actually have a more fundamental question. Yep. What do you want to do? Okay, even more fundamental. My question was, why? Why? You know, and it's like, peel that apart. Like, I spoke with the CEO, and he's like, oh, yeah."},{"id":206,"text":"And everybody's telling me that I'm going to save business costs and I'm going to be able to do these amazing things. And yeah, my business is going to get better because I have agents. And I'm like, well, who told you that? It was like, oh, yeah, I read this thing on LinkedIn and I saw this thing on Twitter. And we ended up having that conversation. And it was a difficult conversation because I had to keep peeling apart. And I started asking the questions that you two just mentioned as well until we really got to the essence of what he wanted to do. And what he really wanted to do was..."},{"id":207,"text":"and we take all domain knowledge about AI aside, was that he wanted to make his salespeople more efficient. And I was like, okay, you want to make your salespeople more efficient. Nowhere in that sentence do I hear the word AI, and nowhere in that sentence do I hear the word agent. So now as a trusted advisor, let me see what I can do to help your salespeople become more efficient. And I'm not going to be an AI shill or an agent shill. I just want to see what do we do to make your salespeople more efficient."},{"id":208,"text":"If anybody here has ever worked in sales, one of the things you realize what a good salesperson has to do is their homework."},{"id":209,"text":"Right. You know, before you have a sales call with somebody, before you have a sales meeting with somebody, you need to check their background. You need to check the company. You need to check the needs of the company. You know, you see it sometimes in the movie that like, oh, such and such plays golf. So I'll take them to play golf. It's not really that cliched, but there is a lot of background that needs to be done. So I spoke with him and I spoke with their leading salespeople and found out that, you know, and I asked the salespeople, what do you hate most about your job?"},{"id":210,"text":"And they were like, well, I hate the fact that I have to waste all my time going to visit these company websites, going to look up people on LinkedIn. And every website is structured differently, right? So I can't just have a path through a website that I can follow. I have to take on all this cognitive load. And they were spending about 80% of their time."},{"id":211,"text":"researching, and about 20% of their time selling. Oh, and by the way, most salespeople don't get paid very much. They have to make it up by commission. So they're only spending 20% of their time doing the thing that gets them commissioned directly. So we're like, okay, well, here's something now where we can start thinking about making them more efficient by cutting into that. So we set a goal as like to make salespeople 20% more efficient. And then we could start rolling out the ideas of AI. And then we could start rolling out the ideas of agentic AI. And a quick question, what's the difference?"},{"id":212,"text":"between AI and agentic AI. Okay. So, yeah. Okay."}],"notes":["本段讨论了销售工作的效率问题，指出销售人员大部分时间用于研究客户信息，而只有20%的时间用于实际销售。这为引入AI和代理AI提供了动机，即通过减少认知负担来提高效率。","讲者提到销售人员的收入主要依赖于佣金，因此他们需要尽可能多地进行销售活动，而研究客户信息的时间占比过高，这为后续讨论AI和代理AI的应用提供了现实背景。","讲者提出将目标设定为提高销售人员20%的效率，并计划逐步引入AI和代理AI的概念。这表明AI和代理AI的应用是分阶段进行的，先通过AI优化研究过程，再通过代理AI进一步提升效率。","讲者提出了一个关键问题：AI和代理AI之间的区别。这表明课程的重点在于区分这两个概念，并探讨它们在实际应用中的不同作用。","讲者提到销售人员需要花费大量时间在不同结构的网站上查找信息，这说明了当前销售流程中的信息处理瓶颈，为AI和代理AI的应用提供了具体场景。","讲者强调销售人员的效率提升是通过减少认知负荷实现的，这表明AI和代理AI的核心目标是优化信息处理流程，而不是直接替代销售人员。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3548.78,"end":3723.84,"asr_flags":[],"raw_segments":[{"start":3548.78,"text":"Okay, that's good. What is an agent for you? I'd actually have a more fundamental question. Yep. What do you want to do? Okay, even more fundamental. My question was, why? Why? You know, and it's like, peel that apart. Like, I spoke with the CEO, and he's like, oh, yeah."},{"start":3566.99,"text":"And everybody's telling me that I'm going to save business costs and I'm going to be able to do these amazing things. And yeah, my business is going to get better because I have agents. And I'm like, well, who told you that? It was like, oh, yeah, I read this thing on LinkedIn and I saw this thing on Twitter. And we ended up having that conversation. And it was a difficult conversation because I had to keep peeling apart. And I started asking the questions that you two just mentioned as well until we really got to the essence of what he wanted to do. And what he really wanted to do was..."},{"start":3596.33,"text":"and we take all domain knowledge about AI aside, was that he wanted to make his salespeople more efficient. And I was like, okay, you want to make your salespeople more efficient. Nowhere in that sentence do I hear the word AI, and nowhere in that sentence do I hear the word agent. So now as a trusted advisor, let me see what I can do to help your salespeople become more efficient. And I'm not going to be an AI shill or an agent shill. I just want to see what do we do to make your salespeople more efficient."},{"start":3623.37,"text":"If anybody here has ever worked in sales, one of the things you realize what a good salesperson has to do is their homework."},{"start":3630.66,"text":"Right. You know, before you have a sales call with somebody, before you have a sales meeting with somebody, you need to check their background. You need to check the company. You need to check the needs of the company. You know, you see it sometimes in the movie that like, oh, such and such plays golf. So I'll take them to play golf. It's not really that cliched, but there is a lot of background that needs to be done. So I spoke with him and I spoke with their leading salespeople and found out that, you know, and I asked the salespeople, what do you hate most about your job?"},{"start":3657.35,"text":"And they were like, well, I hate the fact that I have to waste all my time going to visit these company websites, going to look up people on LinkedIn. And every website is structured differently, right? So I can't just have a path through a website that I can follow. I have to take on all this cognitive load. And they were spending about 80% of their time."},{"start":3679.87,"text":"researching, and about 20% of their time selling. Oh, and by the way, most salespeople don't get paid very much. They have to make it up by commission. So they're only spending 20% of their time doing the thing that gets them commissioned directly. So we're like, okay, well, here's something now where we can start thinking about making them more efficient by cutting into that. So we set a goal as like to make salespeople 20% more efficient. And then we could start rolling out the ideas of AI. And then we could start rolling out the ideas of agentic AI. And a quick question, what's the difference?"},{"start":3709.87,"text":"between AI and agentic AI. Okay. So, yeah. Okay."}],"speech_gaps":[],"frame":"../frames/v056/022.webp","frame_time":3560.78},{"title":"构建代理的四个步骤与实际应用","segments":[{"id":213,"text":"Yep, excellent. So agentic AI is really about breaking it down into steps, which is good engineering to begin with, right? But in agentic AI in particular, I find there's a set pattern of steps that if you follow them, you end up with the whole idea of an agent. The first of these steps is to understand intent. You know, we tend to use the words AI, artificial intelligence, a lot, but what large language models are really, really good at is also understanding. So if the first step of anything that you want to do is to understand intent,"},{"id":214,"text":"And you can use an LLM to do that, to kind of think about, this is the task that I need to do, this is how I'm going to do it, here's the intent. I want to meet Bob Smith and sell widgets to Bob Smith, and this is what I know about Bob Smith, help me with that intent. The second part, then, is planning."},{"id":215,"text":"So you declare to an agent what tools are available to it, browsing the web, searching the web, all of these kind of things. And once you understand your clear intent to be able to go to the step of planning and using those tools for planning, and an LLM is very, very good at then breaking that down into the steps that it needs to do to execute a plan. Search the web with these keywords. Browse this website and find these links. Those types of things."},{"id":216,"text":"Once it's then figured out that plan, then it uses the tools to get to a result. And then once it has the result, the fourth and final step is to reflect on that result. And looking at the result and going back to the intent, did we meet the intent? Yes or no. If we didn't, then go back to that loop."},{"id":217,"text":"All agent is really broken down into those things. And if you think about breaking any problem down into those four steps, that's when you start building an agent. And that was part of being a trusted advisor instead of coming in and waving hands and saying, agent this, agent that, look at this toolkit, save 20%. It's really to break it down into those steps. So we did. We broke it down into those steps. We built a pilot for the salespeople of this company."},{"id":218,"text":"And they ended up saving between 10% and 15% of their time, of their wasted time. The doctrine of unintended consequences hit, though, after this. And the unintended consequence was the salespeople were much happier because the average salesperson was making"},{"id":219,"text":"you know, several percentage points more sales in a given week. They were earning more money in a given week and their job just became a little bit less miserable. And then refinement to that agentic process to be able to do all of that research for them and to help give them a brief in a few minutes instead of a few hours to help them with the sales process ended up being like a win-win-win all around. But if you go in being hype-led and like, oh, build an agent for the thing without really peeling apart the business requirements, the why."},{"id":220,"text":"the what, the how, and all of these kind of things, we ended up like, you know, this company just would have been lost in hype. You've probably seen reports recently. I think McKinsey put one out last week showing that about 85% of AI projects at companies fail."}],"notes":["本段讲解了构建代理（agent）的四个步骤：理解意图、规划、执行和反思。这些步骤是构建代理的基础，强调了在实际应用中需要系统性地分解问题。","理解意图是第一步，涉及明确任务的目标和需求。大型语言模型（LLM）在理解意图方面表现出色，能够帮助代理明确任务。","第二步是规划，涉及声明可用的工具，如网络浏览和搜索。LLM能够将这些工具分解为具体的执行步骤。","第三步是执行，使用工具完成任务并获得结果。第四步是反思，评估结果是否符合最初意图，若不符合则返回循环。","实际案例中，通过构建代理帮助销售人员节省了10%到15%的时间，并提升了销售业绩和员工满意度，体现了代理系统的有效性。","最后提到，如果仅依赖炒作而忽视实际业务需求，AI项目可能会失败。麦肯锡的报告指出，约85%的AI项目在企业中失败，强调了深入分析业务需求的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3727.68,"end":3900.18,"asr_flags":[],"raw_segments":[{"start":3727.68,"text":"Yep, excellent. So agentic AI is really about breaking it down into steps, which is good engineering to begin with, right? But in agentic AI in particular, I find there's a set pattern of steps that if you follow them, you end up with the whole idea of an agent. The first of these steps is to understand intent. You know, we tend to use the words AI, artificial intelligence, a lot, but what large language models are really, really good at is also understanding. So if the first step of anything that you want to do is to understand intent,"},{"start":3757.55,"text":"And you can use an LLM to do that, to kind of think about, this is the task that I need to do, this is how I'm going to do it, here's the intent. I want to meet Bob Smith and sell widgets to Bob Smith, and this is what I know about Bob Smith, help me with that intent. The second part, then, is planning."},{"start":3777.36,"text":"So you declare to an agent what tools are available to it, browsing the web, searching the web, all of these kind of things. And once you understand your clear intent to be able to go to the step of planning and using those tools for planning, and an LLM is very, very good at then breaking that down into the steps that it needs to do to execute a plan. Search the web with these keywords. Browse this website and find these links. Those types of things."},{"start":3802.44,"text":"Once it's then figured out that plan, then it uses the tools to get to a result. And then once it has the result, the fourth and final step is to reflect on that result. And looking at the result and going back to the intent, did we meet the intent? Yes or no. If we didn't, then go back to that loop."},{"start":3817.31,"text":"All agent is really broken down into those things. And if you think about breaking any problem down into those four steps, that's when you start building an agent. And that was part of being a trusted advisor instead of coming in and waving hands and saying, agent this, agent that, look at this toolkit, save 20%. It's really to break it down into those steps. So we did. We broke it down into those steps. We built a pilot for the salespeople of this company."},{"start":3840.92,"text":"And they ended up saving between 10% and 15% of their time, of their wasted time. The doctrine of unintended consequences hit, though, after this. And the unintended consequence was the salespeople were much happier because the average salesperson was making"},{"start":3858.11,"text":"you know, several percentage points more sales in a given week. They were earning more money in a given week and their job just became a little bit less miserable. And then refinement to that agentic process to be able to do all of that research for them and to help give them a brief in a few minutes instead of a few hours to help them with the sales process ended up being like a win-win-win all around. But if you go in being hype-led and like, oh, build an agent for the thing without really peeling apart the business requirements, the why."},{"start":3886.62,"text":"the what, the how, and all of these kind of things, we ended up like, you know, this company just would have been lost in hype. You've probably seen reports recently. I think McKinsey put one out last week showing that about 85% of AI projects at companies fail."}],"speech_gaps":[],"frame":"../frames/v056/023.webp","frame_time":3739.68},{"title":"AI领域的职业建议：警惕炒作与专注技术本质","segments":[{"id":221,"text":"And the main reason for that is that they're not well scoped, people are jumping on the hype bandwagon, and they're not really understanding their way through the problem. And I think the big brains in this room and the network that you folks have, a really key component of being able to succeed is to understand your way through that problem. So that was a hype example around Agentic that I was thankfully able to help this company through."},{"id":222,"text":"Other recent hype examples, you've probably seen the software engineering is dead. My personal favorite, Hollywood is dead, or AGI by year end."},{"id":223,"text":"I was in Saudi Arabia this time last year at a thing called the FII. And it was a dinner at the FII. And I sat beside the CEO of a company who I'm not going to name. But this was a CEO of a generative AI company. And at that time, he was showing everybody around the table this thing that he'd done where it was text to video. And he could put in a text prompt and get video out of the prompt and get about six seconds worth of video out of it. A year ago, that was..."},{"id":224,"text":"I beg your pardon, two years ago. Two years ago, that was hot stuff. Nowadays, obviously, it's quite passe. Anybody can do it. But he made a comment at that table, and it was a lot of like..."},{"id":225,"text":"media executives at that table is lik
