<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯坦福CS230：AI领域的职业建议</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：AI领域的职业建议 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v056","title":"斯坦福CS230：AI领域的职业建议","course":"深度学习","pages":[{"title":"AI职业建议与AI进展的乐观展望","segments":[{"id":0,"text":"What I want to do today is chat with you about career advice in AI."},{"id":1,"text":"And in previous years, I used to do most of this lecture by myself. But what I thought I'd do today is I'll share just a few thoughts and then hand it over to my good friend, Lawrence Moroney, who I invited to speak here and kindly agreed to come all the way to San Francisco. He lives in Seattle, to share with us a very broad market landscape for what he's seeing in the job market, as well as tips for career, growing a career in AI."},{"id":2,"text":"There were just two slides and then one more thought I want to share with you before I hand it over to Lawrence, which is, it really feels like the best opportunity, the best time ever to be building with AI and to building a career in AI."},{"id":3,"text":"A few months ago, I know that in social media, traditional media, there are a few questions about, you know, is AI slowing down, right? People are saying, well, is GPT-5 that good? I think it's actually pretty good, but there are questions about, is AI progress slowing down? And I think part of the reason the question was even raised was because if a benchmark for AI is, you know, 100% is perfect answers, then if you make rapid progress, at some point you cannot get above 100% accuracy."},{"id":4,"text":"one of the studies that most influenced my thinking was work done by this organization, METR, that studied..."},{"id":5,"text":"as time passes, how complex are the tasks that AI could do as measured by how long it takes a human to do that task. So a few years ago, maybe GPT-2 could do tasks that a human could do in like, you know, a couple of seconds, and then they could do tasks that took a human four seconds, then eight seconds, then like a, you know, a minute, two minutes, four minutes, and so on."},{"id":6,"text":"and the study estimates that the length of task AI can do is doubling every seven months. And I think on this metric,"},{"id":7,"text":"I feel optimistic that AI will continue making progress, meaning the complexity of tasks as measured by how long a human takes to do something is doubling rapidly. And same study with smaller dataset, same study argued that AI coding, the doubling time is even shorter, maybe like 70 days. So this code that used to take me, I don't know, 10 minutes to write, then 20 minutes to write, 40 minutes to write, and AI could do more and more of that."},{"id":8,"text":"And so the reasons I think this is a golden age to be building,"},{"id":9,"text":"the best time we've ever seen is maybe two themes,"},{"id":10,"text":"which are more powerful and faster."},{"id":11,"text":"So we can all, all of you in this room can now write software that is"},{"id":12,"text":"more powerful than what anyone on the planet could have built,"},{"id":13,"text":"you know, like a year ago by using AI building blocks."},{"id":14,"text":"AI building blocks include large language models,"}],"notes":["本段主要讨论AI职业建议，并强调当前是AI发展的黄金时代。讲者提到，AI在任务复杂度和执行速度上的进展非常显著，例如AI完成任务所需时间的复杂度每七个月翻倍，而代码生成的翻倍时间甚至短至70天。这表明AI在多个领域正在快速进步。","讲者提到，AI的进展使得每个人都可以利用AI构建块（如大型语言模型）来编写比过去任何人能构建的软件更强大的软件。这表明AI工具的普及和强大，使得更多人能够参与AI开发。","讲者还提到，AI的进展使得任务复杂度的衡量标准（即人类完成任务所需时间）在不断增长，这表明AI在处理复杂任务方面的能力正在迅速提升。","讲者提到，AI的进展是当前AI发展的黄金时代的原因之一，即AI在性能和速度上的双重提升。这表明AI技术的快速发展为职业发展提供了前所未有的机会。","讲者提到，AI的进展使得AI能够完成越来越多的代码编写任务，这表明AI在软件开发领域的应用正在迅速扩展。","讲者提到，AI的进展使得AI能够完成的任务复杂度在不断增长，这表明AI在处理复杂任务方面的能力正在迅速提升。"],"formulas":[],"uncertainties":[],"diagram":"none","start":0.69,"end":179.05,"asr_flags":[],"raw_segments":[{"start":0.69,"text":"What I want to do today is chat with you about career advice in AI."},{"start":6.25,"text":"And in previous years, I used to do most of this lecture by myself. But what I thought I'd do today is I'll share just a few thoughts and then hand it over to my good friend, Lawrence Moroney, who I invited to speak here and kindly agreed to come all the way to San Francisco. He lives in Seattle, to share with us a very broad market landscape for what he's seeing in the job market, as well as tips for career, growing a career in AI."},{"start":36.19,"text":"There were just two slides and then one more thought I want to share with you before I hand it over to Lawrence, which is, it really feels like the best opportunity, the best time ever to be building with AI and to building a career in AI."},{"start":52.17,"text":"A few months ago, I know that in social media, traditional media, there are a few questions about, you know, is AI slowing down, right? People are saying, well, is GPT-5 that good? I think it's actually pretty good, but there are questions about, is AI progress slowing down? And I think part of the reason the question was even raised was because if a benchmark for AI is, you know, 100% is perfect answers, then if you make rapid progress, at some point you cannot get above 100% accuracy."},{"start":81.98,"text":"But one of the studies that most influenced my thinking was work done by this organization, METR, that studied..."},{"start":91.63,"text":"as time passes, how complex are the tasks that AI could do as measured by how long it takes a human to do that task. So a few years ago, maybe GPT-2 could do tasks that a human could do in like, you know, a couple of seconds, and then they could do tasks that took a human four seconds, then eight seconds, then like a, you know, a minute, two minutes, four minutes, and so on."},{"start":116.73,"text":"and the study estimates that the length of task AI can do is doubling every seven months. And I think on this metric,"},{"start":124.99,"text":"I feel optimistic that AI will continue making progress, meaning the complexity of tasks as measured by how long a human takes to do something is doubling rapidly. And same study with smaller dataset, same study argued that AI coding, the doubling time is even shorter, maybe like 70 days. So this code that used to take me, I don't know, 10 minutes to write, then 20 minutes to write, 40 minutes to write, and AI could do more and more of that."},{"start":154.97,"text":"And so the reasons I think this is a golden age to be building,"},{"start":158.87,"text":"the best time we've ever seen is maybe two themes,"},{"start":162.07,"text":"which are more powerful and faster."},{"start":164.15,"text":"So we can all, all of you in this room can now write software that is"},{"start":169.51,"text":"more powerful than what anyone on the planet could have built,"},{"start":172.89,"text":"you know, like a year ago by using AI building blocks."},{"start":177.21,"text":"AI building blocks include large language models,"}],"speech_gaps":[],"frame":"../frames/v056/001.webp","frame_time":12.69},{"title":"AI职业建议：工具与生产力","segments":[{"id":15,"text":"RAC, regenerative workflows, voice AI,"},{"id":16,"text":"and of course, deep learning."},{"id":17,"text":"It turns out that a lot of LLMs have a decent,"},{"id":18,"text":"at least basic understanding of deep learning."},{"id":19,"text":"So if you ever prompt one of the frontier models"},{"id":20,"text":"to implement a cutting edge neural network for you,"},{"id":21,"text":"like try prompting it to implement a transformer network for you,"},{"id":22,"text":"it's actually not bad at,"},{"id":23,"text":"at helping you use these building blocks to build software quickly."},{"id":24,"text":"And, and, and so we have very powerful building blocks"},{"id":25,"text":"that were very difficult or did not exist a year or two ago."},{"id":26,"text":"And so you can now build software that does things that"},{"id":27,"text":"that no one else on the planet, right,"},{"id":28,"text":"even the most advanced teams on the planet could have done."},{"id":29,"text":"And then also with, um, uh,"},{"id":30,"text":"AI coding, the speed with which you can get"},{"id":31,"text":"software written is much faster than ever before."},{"id":32,"text":"And I've personally found that it's important to stay on"},{"id":33,"text":"the frontier of tools because the tools for AI coding changes,"},{"id":34,"text":"right, I don't know, very, really rapidly."},{"id":35,"text":"So I feel like, um, uh, you know,"},{"id":36,"text":"since several months ago,"},{"id":37,"text":"my personal number one favorite too became Glocka."},{"id":38,"text":"moving on from some early generations, I think. And then I think since the release of GPT-5, I think OpenAI Codecs has actually made tremendous progress. And this morning, Gemini 3 was released, which, you know, haven't had time to play with yet, just this morning, right? Seems like another huge leap forward. So, I feel like if you ask me every three months what my personal favorite coding tool is, it actually probably changes, definitely every six months, but quite possibly every three months. And I find that, um,"},{"id":39,"text":"being half a generation behind in these tools means being, frankly, quite a bit less productive. And I know everyone says AI is moving so fast or engineering so fast, but AI coding tools of all the sectors in AI, many things maybe don't move as fast as the hype says it does, but AI coding tools is one sector where I see the pace of progress is, is tremendous and staying at the latest generation of tools rather than half generation behind, um, makes you more productive."},{"id":40,"text":"With our ability to build more powerful software and build it much faster than ever before, I think one piece of advice that I give now much more strongly now than even a year ago or two years ago is just go and build stuff, right? Take classes from Stanford, take online courses, and additionally, your opportunity to build things, and I think Lauren's going to talk about showing them to others, is greater than ever before. But there's one weird implication of this that..."},{"id":41,"text":"is maybe not- is still, I don't know, more and more people are appreciating it but not widely known, which is the product management bottleneck. Which is that when it is increasingly easy to go from a clearly written software spec to a piece of code, then the bottleneck increasingly is deciding what to build or increasingly writing that clear spec for what you actually want to build."}],"notes":["本段讨论了AI编码工具的快速发展及其对生产力的影响。讲者指出，AI编码工具的进步速度远超其他AI领域，因此保持使用最新工具非常重要。例如，讲者提到自己在几个月前将Glocka作为最喜欢的工具，但随后OpenAI Codecs在GPT-5发布后取得了显著进展，而最新的Gemini 3也带来了重大突破。这表明AI编码工具的更新迭代非常频繁，需要持续关注。","讲者强调，使用过时的工具会导致生产力下降。他提到，如果落后半个世代的工具，会明显影响效率。这说明在AI领域，工具的更新速度非常快，必须紧跟最新技术。","此外，讲者建议人们积极构建项目，并通过课程学习提升技能。他提到，现在比以往任何时候都有更多机会去实践和展示成果，这与AI工具的普及和易用性密切相关。","然而，讲者也指出，尽管AI工具让软件开发变得更容易，但产品管理瓶颈依然存在。即，当从明确的软件规格到代码的转换变得容易时，瓶颈更多地出现在决定要构建什么，或者撰写清晰的规格上。这表明，尽管技术进步，但决策和规划仍然是关键挑战。","讲者还提到，虽然AI工具的进展非常快，但并非所有AI领域都如此。他指出，AI编码工具是其中进展最快的领域之一，因此保持对最新工具的关注和使用是提高生产力的关键。","最后，讲者总结说，现在比以往任何时候都更应该去构建东西，无论是通过课程学习还是实际项目实践。这反映了AI工具的普及和易用性为个人和团队提供了前所未有的机会。"],"formulas":[],"uncertainties":["Codecs"],"diagram":"none","start":179.41,"end":350.77,"asr_flags":[],"raw_segments":[{"start":179.41,"text":"RAC, regenerative workflows, voice AI,"},{"start":181.47,"text":"and of course, deep learning."},{"start":182.59,"text":"It turns out that a lot of LLMs have a decent,"},{"start":185.69,"text":"at least basic understanding of deep learning."},{"start":188.21,"text":"So if you ever prompt one of the frontier models"},{"start":190.27,"text":"to implement a cutting edge neural network for you,"},{"start":193.05,"text":"like try prompting it to implement a transformer network for you,"},{"start":196.19,"text":"it's actually not bad at,"},{"start":197.67,"text":"at helping you use these building blocks to build software quickly."},{"start":201.59,"text":"And, and, and so we have very powerful building blocks"},{"start":205.81,"text":"that were very difficult or did not exist a year or two ago."},{"start":209.49,"text":"And so you can now build software that does things that"},{"start":211.29,"text":"that no one else on the planet, right,"},{"start":213.55,"text":"even the most advanced teams on the planet could have done."},{"start":216.19,"text":"And then also with, um, uh,"},{"start":219.41,"text":"AI coding, the speed with which you can get"},{"start":222.11,"text":"software written is much faster than ever before."},{"start":225.45,"text":"And I've personally found that it's important to stay on"},{"start":227.89,"text":"the frontier of tools because the tools for AI coding changes,"},{"start":231.63,"text":"right, I don't know, very, really rapidly."},{"start":234.01,"text":"So I feel like, um, uh, you know,"},{"start":236.67,"text":"since several months ago,"},{"start":238.41,"text":"my personal number one favorite too became Glocka."},{"start":242.9,"text":"moving on from some early generations, I think. And then I think since the release of GPT-5, I think OpenAI Codecs has actually made tremendous progress. And this morning, Gemini 3 was released, which, you know, haven't had time to play with yet, just this morning, right? Seems like another huge leap forward. So, I feel like if you ask me every three months what my personal favorite coding tool is, it actually probably changes, definitely every six months, but quite possibly every three months. And I find that, um,"},{"start":272.56,"text":"being half a generation behind in these tools means being, frankly, quite a bit less productive. And I know everyone says AI is moving so fast or engineering so fast, but AI coding tools of all the sectors in AI, many things maybe don't move as fast as the hype says it does, but AI coding tools is one sector where I see the pace of progress is, is tremendous and staying at the latest generation of tools rather than half generation behind, um, makes you more productive."},{"start":301.19,"text":"With our ability to build more powerful software and build it much faster than ever before, I think one piece of advice that I give now much more strongly now than even a year ago or two years ago is just go and build stuff, right? Take classes from Stanford, take online courses, and additionally, your opportunity to build things, and I think Lauren's going to talk about showing them to others, is greater than ever before. But there's one weird implication of this that..."},{"start":328.99,"text":"is maybe not- is still, I don't know, more and more people are appreciating it but not widely known, which is the product management bottleneck. Which is that when it is increasingly easy to go from a clearly written software spec to a piece of code, then the bottleneck increasingly is deciding what to build or increasingly writing that clear spec for what you actually want to build."}],"speech_gaps":[],"frame":"../frames/v056/002.webp","frame_time":191.41},{"title":"AI领域职业建议：工程师与产品经理的角色演变","segments":[{"id":42,"text":"When I'm building software, I often think of going through a loop where we'll write some software, write some code, show it to users to get user feedback. I think of this as a PM or product management work, and then based on the user feedback, I'll, you know, revise my view on what users like, what they don't like, this UI is too difficult, they want this feature, they don't want that feature, and change my conception of what to build, and then go around this loop many times to hopefully iterate to other product that users love."},{"id":43,"text":"And because of AI coding, the process of building software has become much cheaper and much faster than before. But that ironically shifts the bottleneck to deciding what to build. Um, so, um, some weird trends I'm seeing."},{"id":44,"text":"In Silicon Valley and in many tech companies, people have often talked about an engineer to a product manager, engineer to PM ratio. And you take these ratios with grain of salt because they're very over the place. But you hear companies talk about an engineer to PM ratio of four to one or seven to one or eight to one. This idea that one product manager writing product specs can keep four to eight or some number like that. Engineer is busy."},{"id":45,"text":"But because engineering is speeding up, whereas product management is not sped up as far, as much by AI as engineering, um, I'm seeing the inch to PM ratio trending downwards, maybe even two or one to one, right? So some teams I work with, their proposed headcount was like one PM to one engineer, which is a, a, a ratio unlike almost all Silicon Valley, so the traditional Silicon Valley companies. And the other thing I'm seeing is that, um, engineers can also,"},{"id":46,"text":"shape products can move really fast where you go one step further, take the engineer, take the PM and collapse them into a single human. And I find that, um, uh, there are definitely engineers that like doing engineering work that, you know, don't enjoy talking to users and having that more human empathetic side of work. But I'm finding increasingly that the subset of engineers that learn to"},{"id":47,"text":"talk to users, get feedback, develop deep empathy for users so that they can make decisions about what to build. Those engineers are also the fastest moving people that I'm seeing in Silicon Valley today. And I feel like at the earliest stage of my career, one thing I regretted for years was in one of the roles I had, I went to try to convince a bunch of engineers to do more product work. And I actually..."},{"id":48,"text":"made a bunch of really good engineers feel bad for not being good product managers. And that was a mistake I made, regretted that for years, I just shouldn't have done that. And part of me feels like I'm now going back to repeat that exact same mistake. Um, having said that, I find that, um,"}],"notes":["本段讲授了软件开发过程中工程师与产品经理之间的协作循环，强调了通过用户反馈不断迭代产品的重要性。讲者提到，随着AI编码技术的发展，软件开发的速度和成本大幅降低，但这也使得产品决策成为新的瓶颈。","讲者指出，在硅谷和许多科技公司中，工程师与产品经理的比例（engineer to PM ratio）是一个常见话题，但这些比例因公司而异，通常为4:1或7:1等。随着工程效率的提升，而产品管理未被AI显著加速，这一比例正在下降，甚至可能达到1:1。","讲者提到，一些团队正在尝试将工程师和产品经理的角色合并为一个角色，即由单一工程师承担产品设计和用户沟通的任务。这种趋势使得部分工程师能够更快地推动产品开发。","讲者反思了自己早期职业生涯中，试图说服工程师承担更多产品管理工作时的错误。他意识到，这种做法让一些优秀的工程师感到不适，因为并非所有人都喜欢与用户沟通和进行情感共鸣的工作。","讲者提到，那些学会与用户沟通、获取反馈并建立用户同理心的工程师，往往在硅谷中发展得更快。这表明，产品管理技能对于工程师的职业发展具有重要影响。","讲者最后提到，他意识到自己可能正在重复过去的错误，即试图让工程师承担更多产品管理工作。这反映出他在职业发展过程中对角色分工和团队协作的深刻反思。"],"formulas":[],"uncertainties":[],"diagram":"none","start":351.63,"end":522.86,"asr_flags":[],"raw_segments":[{"start":351.63,"text":"When I'm building software, I often think of going through a loop where we'll write some software, write some codes, show it to users to get user feedback. I think of this as a PM or product management work, and then based on the user feedback, I'll, you know, revise my view on what users like, what they don't like, this UI is too difficult, they want this feature, they don't want that feature, and change my conception of what to build, and then go around this loop many times to hopefully iterate to other product that users love."},{"start":379.8,"text":"And because of AI coding, the process of building software has become much cheaper and much faster than before. But that ironically shifts the bottleneck to deciding what to build. Um, so, um, some weird trends I'm seeing."},{"start":399.48,"text":"In Silicon Valley and in many tech companies, people have often talked about an engineer to a product manager, engineer to PM ratio. And you take these ratios with grain of salt because they're very over the place. But you hear companies talk about an engineer to PM ratio of four to one or seven to one or eight to one. This idea that one product manager writing product specs can keep four to eight or some number like that. Engineer is busy."},{"start":426.06,"text":"But because engineering is speeding up, whereas product management is not sped up as far, as much by AI as engineering, um, I'm seeing the inch to PM ratio trending downwards, maybe even two or one to one, right? So some teams I work with, their proposed headcount was like one PM to one engineer, which is a, a, a ratio unlike almost all Silicon Valley, so the traditional Silicon Valley companies. And the other thing I'm seeing is that, um, engineers can also,"},{"start":455.47,"text":"shape products can move really fast where you go one step further, take the engineer, take the PM and collapse them into a single human. And I find that, um, uh, there are definitely engineers that like doing engineering work that, you know, don't enjoy talking to users and having that more human empathetic side of work. But I'm finding increasingly that the subset of engineers that learn to"},{"start":479.59,"text":"talk to users, get feedback, develop deep empathy for users so that they can make decisions about what to build. Those engineers are also the fastest moving people that I'm seeing in Silicon Valley today. And I feel like at the earliest stage of my career, one thing I regretted for years was in one of the roles I had, I went to try to convince a bunch of engineers to do more product work. And I actually..."},{"start":506.92,"text":"made a bunch of really good engineers feel bad for not being good product managers. And that was a mistake I made, regretted that for years, I just shouldn't have done that. And part of me feels like I'm now going back to repeat that exact same mistake. Um, having said that, I find that, um,"}],"speech_gaps":[],"frame":"../frames/v056/003.webp","frame_time":363.63},{"title":"职业发展与社交网络的重要性","segments":[{"id":49,"text":"uh, the fact that, you know, I can write code, but also talk to users to shape what to do, that lets me and the engineers that can do this go much faster. So I think it may be worth taking another look at whether engineers can, um, do a bit more of this work. Uh, because then if you're not waiting for someone else to take the product to customers, you can just write code, have a gut for what to do next, and iterate. That pace, that velocity of execution is much faster."},{"id":50,"text":"And then, before I hand over to Lawrence, just one last thing I want to share, which is,"},{"id":51,"text":"In terms of navigating your career, I think one of the most strong predictors for your speed of learning and for your level of success is the people you surround yourself with. I think we're all social creatures. We all learn from people around us. And it turns out that there are studies in sociology that show that if your five closest friends are smokers,"},{"id":52,"text":"the odds of you being a smoker is pretty much high. Please don't smoke. It's just an example."},{"id":53,"text":"I don't know of any study showing that if your five or ten closest friends are really hardworking, determined people, you know, learning quickly, trying to make the world a better place of AI, that you are more likely to do that too. But it's one of those things that I think is almost certainly true. So all of us are inspired by the people around us. If you're able to find a good group of people to work with, that helps drive you forward. In fact, here at Stanford, I feel very fortunate, right? Fantastic."},{"id":54,"text":"student body, fantastic group of faculty. Um, and then the other thing that I, I, I think we're fortunate to have at Stanford is our connective tissue. So, you know, candidly, a lot of the, um, people working at a lot of the cutting edge AI labs, the frontier labs, they were former students of a lot of"},{"id":55,"text":"different Stanford faculty. And so that rich connective tissue, you know, candidly means that at Stanford, we often find out about a lot of stuff that's not widely known because of the relationships, their friendships, and when some company does something, you know, one of my friends in the faculty will call up someone in the company and say, hey, that's weird. Does this really work? And so that rich connective tissue means that we're all"},{"id":56,"text":"Just as we try to pull our friends forward, our friends also pull us forward with the knowledge and the connective tissue and this know-how of bleeding as AI, which unfortunately is not all published on the internet at this moment in time. So I think while you're at Stanford, make those friends form that rich connective tissue. And there have been a lot of times that, just for myself, where..."}],"notes":["本段讨论了职业发展中的关键因素，即与谁共事对学习速度和成功程度的影响。讲者指出，社交网络和周围人的行为对个人发展有重要影响，例如，如果周围人吸烟，个人吸烟的可能性也会增加。这表明社交环境对个人行为有显著影响。","讲者进一步强调，如果周围人是努力工作、有决心、快速学习并致力于改善AI世界的人，个人也更可能效仿他们的行为。虽然没有直接的研究支持，但讲者认为这种现象几乎可以确定是真实的。","讲者提到，斯坦福大学的社交网络（connective tissue）是其独特优势之一。许多在前沿AI实验室工作的人员都是斯坦福的前学生，这种紧密的联系使得斯坦福能够获取到其他地方不为人知的信息。","这种社交网络不仅帮助斯坦福的成员获取信息，还通过朋友之间的互动和知识共享，推动彼此的进步。讲者指出，这种知识和经验在互联网上尚未完全公开，因此需要通过人际网络来获取。","讲者鼓励学生在斯坦福期间建立良好的人际关系，形成丰富的社交网络，以促进个人和职业的发展。这种社交网络不仅有助于获取信息，还能推动彼此的成长。","讲者以自身为例，说明了社交网络对个人发展的重要性，并强调了在斯坦福期间建立良好人际关系的必要性。"],"formulas":[],"uncertainties":["bleeding as AI"],"diagram":"none","start":523.4,"end":679.51,"asr_flags":[],"raw_segments":[{"start":523.4,"text":"uh, the fact that, you know, I can write code, but also talk to users to shape what to do, that lets me and the engineers that can do this go much faster. So I think it may be worth taking another look at whether engineers can, um, do a bit more of this work. Uh, because then if you're not waiting for someone else to take the product to customers, you can just write code, have a gut for what to do next, and iterate. That pace, that velocity of execution is much faster."},{"start":550.27,"text":"And then, before I hand over to Lawrence, just one last thing I want to share, which is,"},{"start":556.91,"text":"In terms of navigating your career, I think one of the most strong predictors for your speed of learning and for your level of success is the people you surround yourself with. I think we're all social creatures. We all learn from people around us. And it turns out that there are studies in sociology that show that if your five closest friends are smokers,"},{"start":580.94,"text":"the odds of you being a smoker is pretty much high. Please don't smoke. It's just an example."},{"start":587.44,"text":"I don't know of any study showing that if your five or ten closest friends are really hardworking, determined people, you know, learning quickly, trying to make the world a better place of AI, that you are more likely to do that too. But it's one of those things that I think is almost certainly true. So all of us are inspired by the people around us. If you're able to find a good group of people to work with, that helps drive you forward. In fact, here at Stanford, I feel very fortunate, right? Fantastic."},{"start":615.42,"text":"student body, fantastic group of faculty. Um, and then the other thing that I, I, I think we're fortunate to have at Stanford is our connective tissue. So, you know, candidly, a lot of the, um, people working at a lot of the cutting edge AI labs, the frontier labs, they were former students of a lot of"},{"start":635.34,"text":"different Stanford faculty. And so that rich connective tissue, you know, candidly means that at Stanford, we often find out about a lot of stuff that's not widely known because of the relationships, their friendships, and when some company does something, you know, one of my friends in the faculty will call up someone in the company and say, hey, that's weird. Does this really work? And so that rich connective tissue means that we're all"},{"start":658.89,"text":"Just as we try to pull our friends forward, our friends also pull us forward with the knowledge and the connective tissue and this know-how of bleeding as AI, which unfortunately is not all published on the internet at this moment in time. So I think while you're at Stanford, make those friends form that rich connective tissue. And there have been a lot of times that, just for myself, where..."}],"speech_gaps":[],"frame":"../frames/v056/004.webp","frame_time":535.4},{"title":"斯坦福CS230：AI领域的职业建议","segments":[{"id":57,"text":"Frankly, I was thinking of going in some technical direction. I'd have, you know, one or two phone calls with someone, right, really close to research, either a Stanford researcher or someone in the frontier lab. They would share something with me, right, that I didn't know before, and that changes the way I choose the technical architecture of a project. So I find that that group of friends you surround yourself with, those little pieces of information, try this, don't do that, that's just hype, ignore the PR, you know, don't actually try that thing. Those things,"},{"id":58,"text":"make a big difference in your ability to steer the direction of your projects. So while you're at Stanford, take advantage of that. This connective tissue that Stanford has is actually really unique. There are lots of great universities in the world, but at this moment in time, I don't think there's any, I don't want to sound like I'm doing PR for Stanford now, but I really think there's no university in the world that is as privileged as Stanford at this moment in time in terms of the richness of the connective tissue to all of the leading AI."},{"id":59,"text":"groups. But to me, that's also that we're lucky here to have a wonderful community of people to work with and learn from. And for you too, if you apply for jobs, the thing that is much more important for your career success would be if you go to a company, it'll be the people you work with day to day, right? So here's one story that I've told in previous classes and I repeat, which is"},{"id":60,"text":"there's a Stanford student that I knew just many years ago that, um, I knew and they did really good work at Stanford. I thought they were a high flyer. And they applied for a job at the company and they got a job offer from one of the companies with, you know, a hot AI brand. Um,"},{"id":61,"text":"This company refused to tell him which team he would join. They said, oh, come sign up for a job. There's a rotation system, matching system, blah, blah, blah. Sign up the dotted line first. Then we'll figure out what's a good project for you."},{"id":62,"text":"partly because it's a good company. His parents are proud of him for getting a job in this company. This student joined this company hoping to work on an exciting AI project. And after he signed on the dotted line, he was assigned to work on the backend Java payment processing system of the company."},{"id":63,"text":"Nothing against anyone that wants to do Java backend payment processing systems. I think they're great. But this is an AI students that did not get matched to an AI project. And so for about a year, he was really frustrated and he actually left this company after about a year. The unfortunate thing is I told this story in CS230 some years back. And then after I was already telling the story in this class,"},{"id":64,"text":"A couple of years later, another student in CS230 went through the same experience with the same company, not Java backend payment processing, but a different project. And I think this effect of..."}],"notes":["本段主要讲述在斯坦福大学学习期间，如何通过与研究者和前沿实验室人员的交流，获取关键信息，从而影响项目的技术架构选择。这种信息交流对项目方向的把控有重要影响。","斯坦福大学的‘连接组织’（connective tissue）是其独特之处，这种组织网络在当前AI领域中非常丰富，使得斯坦福在AI研究和职业发展方面具有独特优势。","在职业选择中，与同事的日常互动比公司品牌更重要。通过一个斯坦福学生的例子，说明了即使进入知名公司，如果未被分配到合适的项目，也可能导致职业挫败。","该学生原本希望参与AI项目，但被分配到Java后端支付系统，这与他的职业目标不符，最终导致他离开公司。","这一经历被多次提及，说明这种现象在AI领域中具有普遍性，强调了在选择工作时，应关注实际项目与个人兴趣的匹配度。","讲者通过这个故事强调了在职业发展中，与同事的互动和项目匹配度的重要性，而不是仅仅依赖公司品牌或声誉。"],"formulas":[],"uncertainties":[],"diagram":"none","start":680.35,"end":855.97,"asr_flags":[],"raw_segments":[{"start":680.35,"text":"Frankly, I was thinking of going in some technical direction. I'd have, you know, one or two phone calls with someone, right, really close to research, either a Stanford researcher or someone in the frontier lab. They would share something with me, right, that I didn't know before, and that changes the way I choose the technical architecture of a project. So I find that that group of friends you surround yourself with, those little pieces of information, try this, don't do that, that's just hype, ignore the PR, you know, don't actually try that thing. Those things,"},{"start":709.02,"text":"make a big difference in your ability to steer the direction of your projects. So while you're at Stanford, take advantage of that. This connective tissue that Stanford has is actually really unique. There are lots of great universities in the world, but at this moment in time, I don't think there's any, I don't want to sound like I'm doing PR for Stanford now, but I really think there's no university in the world that is as privileged as Stanford at this moment in time in terms of the richness of the connective tissue to all of the leading AI."},{"start":738.17,"text":"groups. But to me, that's also that we're lucky here to have a wonderful community of people to work with and learn from. And for you too, if you apply for jobs, the thing that is much more important for your career success would be if you go to a company, it'll be the people you work with day to day, right? So here's one story that I've told in previous classes and I repeat, which is"},{"start":766.94,"text":"there's a Stanford student that I knew just many years ago that, um, I knew and they did really good work at Stanford. I thought they were a high flyer. And they applied for a job at the company and they got a job offer from one of the companies with, you know, a hot AI brand. Um,"},{"start":783.65,"text":"This company refused to tell him which team he would join. They said, oh, come sign up for a job. There's a rotation system, matching system, blah, blah, blah. Sign up the dotted line first. Then we'll figure out what's a good project for you."},{"start":798.09,"text":"partly because it's a good company. His parents are proud of him for getting a job in this company. This student joined this company hoping to work on an exciting AI project. And after he signed on the dotted line, he was assigned to work on the backend Java payment processing system of the company."},{"start":815.5,"text":"Nothing against anyone that wants to do Java backend payment processing systems. I think they're great. But this is an AI students that did not get matched to an AI project. And so for about a year, he was really frustrated and he actually left this company after about a year. The unfortunate thing is I told this story in CS230 some years back. And then after I was already telling the story in this class,"},{"start":843.11,"text":"A couple of years later, another student in CS230 went through the same experience with the same company, not Java backend payment processing, but a different project. And I think this effect of..."}],"speech_gaps":[],"frame":"../frames/v056/005.webp","frame_time":692.35},{"title":"职业建议：选择团队与责任","segments":[{"id":65,"text":"trying to figure out who you'd be actually working with day-to-day and making sure you're surrounded by people that inspire you and work on exciting projects. I think that's important. And if you're completely candid, if a company refuses to tell you what team you'd be assigned to, you know, that does raise a question in my mind, right, of whether or not, you know, what will happen. And I think that instead of working for the company with the hottest brand"},{"id":66,"text":"sometimes if you find a really good team with really, you know, hardworking, knowledgeable, smart people trying to do Google AI, but the company logo just isn't as hot, I think that often means you actually learn faster and progress your career better because it is after all, we don't learn from the, you know,"},{"id":67,"text":"excitement of the company logo when you walk through the door, you learn from the people you deal with day-to-day. So I just urge you to use that as a, as a huge criteria, um, for your selection process for, for what you decide to do, right? Um, and, uh, I think, um, and, and, and then, uh, but I think number one, uh, on, on my"},{"id":68,"text":"is it's become much easier than ever before"},{"id":69,"text":"to build powerful software faster."},{"id":70,"text":"And what that means is do be responsible,"},{"id":71,"text":"don't build software that hurts others."},{"id":72,"text":"And at the same time,"},{"id":73,"text":"there are so many things that each of you can build."},{"id":74,"text":"And what I find is the number of ideas out in the world"},{"id":75,"text":"is much greater than the number of people"},{"id":76,"text":"with the skill to build them."},{"id":77,"text":"So I know that finding jobs has gotten tougher"},{"id":78,"text":"for fresh college grads."},{"id":79,"text":"At the same time, a lot of teams,"},{"id":80,"text":"you just can't find enough skilled people, right?"},{"id":81,"text":"And so there are a lot of projects in the world that if you don't build it, I think"},{"id":82,"text":"no one else will build it either."},{"id":83,"text":"So you don't need to, as long as you don't harm others, to be responsible, there are"},{"id":84,"text":"a lot of things that you don't need to wait for permission, you don't need to wait for"},{"id":85,"text":"someone else to do it first and then you do it."},{"id":86,"text":"The cost of a failure is much lower than before because you waste a weekend by learning something."},{"id":87,"text":"That seems fine to me."},{"id":88,"text":"me. So I think as long as you're being responsible,"},{"id":89,"text":"going for it, trying things out,"},{"id":90,"text":"and building lots of things would be the number one most important thing"},{"id":91,"text":"I think would help your careers and yeah,"},{"id":92,"text":"I think, I think I'm going to say one last thing that"},{"id":93,"text":"is considered not politically correct in some circles,"},{"id":94,"text":"but I'll just say it anyway, which is"},{"id":95,"text":"In some circles, it has become considered not politically correct to encourage others to work hard. I'm gonna encourage you to work hard."},{"id":96,"text":"Now, I think the reason some people don't like that is because there are some people, they're in a phase of life where they're not in a position to work hard. So right after my children were born, I was not working hard for a short period of time. And there are people, because of an injury, disability, whatever, very valid reasons, they're not in a position to work hard at that moment in time. And we should respect them, support them, make sure they're well taken care of, even though they're not working hard."}],"notes":["本段主要讨论在选择工作时，应优先考虑团队的质量而非公司的品牌知名度。讲者强调，一个由优秀、努力、有知识的团队组成的公司，即使品牌不那么响亮，也能带来更快的学习和职业发展。这是因为学习主要来自于日常工作的同事，而不是公司标志。"],"formulas":[],"uncertainties":[],"diagram":"none","start":856.82,"end":1035.41,"asr_flags":[],"raw_segments":[{"start":856.82,"text":"trying to figure out who you'd be actually working with day-to-day and making sure you're surrounded by people that inspire you and work on exciting projects. I think that's important. And if you're completely candid, if a company refuses to tell you what team you'd be assigned to, you know, that does raise a question in my mind, right, of whether or not, you know, what will happen. And I think that instead of working for the company with the hottest brand,"},{"start":881.14,"text":"sometimes if you find a really good team with really, you know, hardworking, knowledgeable, smart people trying to do Google AI, but the company logo just isn't as hot, I think that often means you actually learn faster and progress your career better because it is after all, we don't learn from the, you know,"},{"start":899.66,"text":"excitement of the company logo when you walk through the door, you learn from the people you deal with day-to-day. So I just urge you to use that as a, as a huge criteria, um, for your selection process for, for what you decide to do, right? Um, and, uh, I think, um, and, and, and then, uh, but I think number one, uh, on, on my"},{"start":921.46,"text":"is it's become much easier than ever before"},{"start":924.24,"text":"to build powerful software faster."},{"start":927.18,"text":"And what that means is do be responsible,"},{"start":929.6,"text":"don't build software that hurts others."},{"start":931.86,"text":"And at the same time,"},{"start":933.34,"text":"there are so many things that each of you can build."},{"start":936.52,"text":"And what I find is the number of ideas out in the world"},{"start":939.0,"text":"is much greater than the number of people"},{"start":940.9,"text":"with the skill to build them."},{"start":942.3,"text":"So I know that finding jobs has gotten tougher"},{"start":944.86,"text":"for fresh college grads."},{"start":945.98,"text":"At the same time, a lot of teams,"},{"start":947.72,"text":"you just can't find enough skilled people, right?"},{"start":950.22,"text":"And so there are a lot of projects in the world that if you don't build it, I think"},{"start":955.38,"text":"no one else will build it either."},{"start":957.36,"text":"So you don't need to, as long as you don't harm others, to be responsible, there are"},{"start":962.32,"text":"a lot of things that you don't need to wait for permission, you don't need to wait for"},{"start":965.02,"text":"someone else to do it first and then you do it."},{"start":967.7,"text":"The cost of a failure is much lower than before because you waste a weekend by learning something."},{"start":973.62,"text":"That seems fine to me."},{"start":974.82,"text":"me. So I think as long as you're being responsible,"},{"start":977.52,"text":"going for it, trying things out,"},{"start":979.4,"text":"and building lots of things would be the number one most important thing"},{"start":983.7,"text":"I think would help your careers and yeah,"},{"start":989.22,"text":"I think, I think I'm going to say one last thing that"},{"start":991.94,"text":"is considered not politically correct in some circles,"},{"start":996.16,"text":"but I'll just say it anyway, which is"},{"start":999.13,"text":"In some circles, it has become considered not politically correct to encourage others to work hard. I'm gonna encourage you to work hard."},{"start":1009.81,"text":"Now, I think the reason some people don't like that is because there are some people, they're in a phase of life where they're not in a position to work hard. So right after my children were born, I was not working hard for a short period of time. And there are people, because of an injury, disability, whatever, very valid reasons, they're not in a position to work hard at that moment in time. And we should respect them, support them, make sure they're well taken care of, even though they're not working hard."}],"speech_gaps":[],"frame":"../frames/v056/006.webp","frame_time":868.82},{"title":"职业建议与AI领域的发展","segments":[{"id":97,"text":"Having said that, all of my, say, PhD students that became very successful, I saw every single one of them work incredibly hard. I mean, the 2 a.m. sitting up hyperparameter tuning, been there, done that, still doing it some days. And if you are fortunate enough to be in a position in life where you can work really hard, there are so many opportunities to do things right now."},{"id":98,"text":"If you get excited, as I do, spending evenings and weekends coding and building stuff and getting user feedback, if you lean in and do those things, it will increase your odds of being really successful. Maybe I get into some trouble with some people encouraging them to work hard, but I find that the truth is people that work hard get a lot more done. We should also respect people that don't and people that aren't in the position to do so."},{"id":99,"text":"you know, between watching some dumb TV show versus finding your agentic code there on the weekend to try something, I'm gonna choose the latter almost every time, right? Unless I watch a show with my kids, sometimes I do that. But you know, besides, I hope you do that."},{"id":100,"text":"All right. So those are the main things I want to say. Um, what I want to do is, uh, hand the stage over to my good friend Lawrence Maroney, uh, who, who, who share, um, a lot more about career advice on AI. Maybe just a quick intro. I've known Lawrence for a long time, um,"},{"id":101,"text":"He's done a lot of online education work, sometimes with me and my teams, taught a lot of people TensorFlow, taught a lot of people PyTorch. He was a lead AI advocate at Google for many years, now runs a group at ARM. I've also enjoyed quite a few of his books. This is one of them. He recently also published a new book on PyTorch. This is an excellent book, Introduction to PyTorch, and is a very sought-after speaker in many circles. So I was very grateful when he agreed to come speak to us."},{"id":102,"text":"Pleasure's all mine. I just want to reinforce something that Andrew was talking about earlier on, about choosing the people that you work with being very important. But I also want to show that, from the other way around, that the company, when they're interviewing you, are also choosing you. And the good companies really want to choose the people that they work with also. And I've been doing a lot of mentoring of young people, particularly over the last 18 months, who are hunting for careers for themselves. And I want to tell the story of one young man."},{"id":103,"text":"And this guy, very well educated, great experience, super leet coder."},{"id":104,"text":"He could do every challenge that was in front of him, and he got laid off from his job in April. He worked in medical software, and the medical software business has been changing drastically. Funding has been cut by the federal government in a number of areas, and he got laid off from his job. And with his experience, with his ability, with his skills, all of these kind of things, he thought that it would be very easy for him to find another job. And the poor young guy had a really terrible April. He got laid off from his job in April. Immediately before that, his girlfriend had broken up with him, and then a couple of weeks later,"}],"notes":["本段主要讨论了在AI领域中，努力工作的重要性以及如何选择合适的职业路径。讲者提到，成功的人通常非常努力，包括深夜调试超参数等。同时，他鼓励听众在有时间的情况下，积极参与项目和获取用户反馈，这会增加成功的几率。","讲者还提到，虽然鼓励努力工作可能会引起一些人的不满，但他认为努力工作的人能完成更多任务。同时，他也尊重那些无法工作的人。","在选择周末活动时，讲者倾向于编写代码而不是看无聊的电视节目，除非是为了陪伴孩子。他希望听众也能做出类似的选择。","接下来，讲者将舞台交给Lawrence Maroney，一位在AI领域有丰富经验的专家，他曾在Google担任AI倡导者，现在在ARM工作，并且出版了多本关于PyTorch的书籍。","Lawrence强调了选择合适的工作伙伴的重要性，并指出公司面试时也在选择合适的人。他提到自己在过去的18个月里指导了许多正在寻找职业的年轻人，并讲述了一个年轻人的故事。","这个年轻人虽然非常优秀，但因行业变化和公司裁员而失业。他原本认为凭借自己的能力和经验可以轻松找到新工作，但现实却并不如他所愿。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1036.08,"end":1211.96,"asr_flags":[],"raw_segments":[{"start":1036.08,"text":"Having said that, all of my, say, PhD students that became very successful, I saw every single one of them work incredibly hard. I mean, the 2 a.m. sitting up hyperparameter tuning, been there, done that, still doing it some days. And if you are fortunate enough to be in a position in life where you can work really hard, there are so many opportunities to do things right now."},{"start":1060.62,"text":"If you get excited, as I do, spending evenings and weekends coding and building stuff and getting user feedback, if you lean in and do those things, it will increase your odds of being really successful. Maybe I get into some trouble with some people encouraging them to work hard, but I find that the truth is people that work hard get a lot more done. We should also respect people that don't and people that aren't in the position to do so."},{"start":1084.43,"text":"you know, between watching some dumb TV show versus finding your agentic code there on the weekend to try something, I'm gonna choose the latter almost every time, right? Unless I watch a show with my kids, sometimes I do that. But you know, besides, I hope you do that."},{"start":1102.73,"text":"All right. So those are the main things I want to say. Um, what I want to do is, uh, hand the stage over to my good friend Lawrence Maroney, uh, who, who, who share, um, a lot more about career advice on AI. Maybe just a quick intro. I've known Lawrence for a long time, um,"},{"start":1118.93,"text":"He's done a lot of online education work, sometimes with me and my teams, taught a lot of people TensorFlow, taught a lot of people PyTorch. He was a lead AI advocate at Google for many years, now runs a group at ARM. I've also enjoyed quite a few of his books. This is one of them. He recently also published a new book on PyTorch. This is an excellent book, Introduction to PyTorch, and is a very sought-after speaker in many circles. So I was very grateful when he agreed to come speak to us."},{"start":1147.14,"text":"Pleasure's all mine. I just want to reinforce something that Andrew was talking about earlier on, about choosing the people that you work with being very important. But I also want to show that, from the other way around, that the company, when they're interviewing you, are also choosing you. And the good companies really want to choose the people that they work with also. And I've been doing a lot of mentoring of young people, particularly over the last 18 months, who are hunting for careers for themselves. And I want to tell the story of one young man."},{"start":1174.8,"text":"And this guy, very well educated, great experience, super leet coder."},{"start":1182.96,"text":"He could do every challenge that was in front of him, and he got laid off from his job in April. He worked in medical software, and the medical software business has been changing drastically. Funding has been cut by the federal government in a number of areas, and he got laid off from his job. And with his experience, with his ability, with his skills, all of these kind of things, he thought that it would be very easy for him to find another job. And the poor young guy had a really terrible April. He got laid off from his job in April. Immediately before that, his girlfriend had broken up with him, and then a couple of weeks later,"}],"speech_gaps":[],"frame":"../frames/v056/007.webp","frame_time":1048.08},{"title":"职业建议与面试策略的反思","segments":[{"id":105,"text":"Later, his dog died. So he was not in a good place. And so I sat down with him after a couple of months and took a look. And he had a spreadsheet of jobs that he was applying to. And he had over 300 jobs that he was tracking in the spreadsheet. And in a number of these jobs, he actually got into the interview process. And he went very deep in the interview process with companies like Meta. Who else? Not Google."},{"id":106,"text":"There was Meta, there was Microsoft, there was one of the other large tech companies where you do lots and lots of interview loops. And every time, towards the end of the loop, he knew he did a great loop. He solved all the coding. He had great conversations with the people, or at least he thought he had. And then every time, within a day, the recruiter would call him and say, no, you didn't get the job."},{"id":107,"text":"And it was heartbreaking. And like I said, 300 plus jobs he had been tracking. So I started working with him to kind of do some mock interviews and to do some fine tuning. Oh, it was Jeff Bezos' company, not Amazon. That was one of the other big tech company that he'd interviewed with. And I started like working through him and doing some test interviews and all this kind of thing with him. And terrific, terrific candidate. Couldn't figure out what was going wrong."},{"id":108,"text":"Until I decided to try and do a different sort of interview where I gave him a really tough interview. I gave him some tough leet code. I gave him some really obscure corner cases in his coding."},{"id":109,"text":"And how he reacted was the advice that was given to him in the recruiting pamphlets. And a lot of these recruiting pamphlets will say things like, you're going to have an opportunity to share an opinion, and you've got to stand your ground. You've got to have a backbone. Don't bend. His interpretation of that was to be really, really tough."},{"id":110,"text":"So I would pick corners, I'd pick holes in his code, I'd pick corner cases where things may not work, and I'd give him a test of crisis. And this advice that he'd been given to stand his ground ended up making him kind of hostile in these interview environments."},{"id":111,"text":"Good people, good teams, people that you can work together with. And from the interviewer perspective, if I'm managing this team, this person is that cliche 10x engineer, but I don't want him anywhere near my team because of this attitude. We worked on that. We fine-tuned it. And the strange part is, he's a really, really nice guy. It's just this was the advice he was given."}],"notes":["本段讲述了一位求职者在面试过程中遇到的困难，他虽然在技术能力上表现出色，但因面试策略不当而屡屡失败。讲者通过模拟面试发现，求职者对招聘材料中‘坚持己见’的建议产生了误解，将其理解为在面试中表现得过于强硬，导致面试官对其态度产生负面评价。","讲者指出，求职者在面试中面对挑战时，采取了过于对抗的态度，这与招聘材料中‘坚持己见’的本意相悖。招聘材料中的建议旨在鼓励求职者在面试中表达自己的观点，而不是在技术问题上表现出敌意。","讲者通过模拟面试发现，求职者在面对技术难题时，倾向于坚持自己的观点，即使这些观点可能并不正确。这种态度在面试官眼中显得不合作，从而影响了求职者的面试表现。","讲者强调，面试中的沟通和合作能力同样重要。求职者需要在展示技术能力的同时，展现出良好的沟通技巧和团队合作精神，而不是一味地坚持己见。","讲者指出，求职者在面试中表现出的敌意态度，可能是由于对招聘材料中‘坚持己见’的误解所致。这种误解导致他在面试中未能展现出应有的合作态度，从而影响了面试结果。","讲者通过与求职者的合作，帮助他调整了面试策略，使其在技术能力和沟通技巧上都得到了提升。这一过程表明，面试策略的调整对于求职者的成功至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1211.98,"end":1368.27,"asr_flags":[],"raw_segments":[{"start":1211.98,"text":"Later, his dog died. So he was not in a good place. And so I sat down with him after a couple of months and took a look. And he had a spreadsheet of jobs that he was applying to. And he had over 300 jobs that he was tracking in the spreadsheet. And in a number of these jobs, he actually got into the interview process. And he went very deep in the interview process with companies like Meta. Who else? Not Google."},{"start":1238.67,"text":"There was Meta, there was Microsoft, there was one of the other large tech companies where you do lots and lots of interview loops. And every time, towards the end of the loop, he knew he did a great loop. He solved all the coding. He had great conversations with the people, or at least he thought he had. And then every time, within a day, the recruiter would call him and say, no, you didn't get the job."},{"start":1260.42,"text":"And it was heartbreaking. And like I said, 300 plus jobs he had been tracking. So I started working with him to kind of do some mock interviews and to do some fine tuning. Oh, it was Jeff Bezos' company, not Amazon. That was one of the other big tech company that he'd interviewed with. And I started like working through him and doing some test interviews and all this kind of thing with him. And terrific, terrific candidate. Couldn't figure out what was going wrong."},{"start":1285.82,"text":"Until I decided to try and do a different sort of interview where I gave him a really tough interview. I gave him some tough leet code. I gave him some really obscure corner cases in his coding."},{"start":1300.3,"text":"And I saw how he reacted. And how he reacted was the advice that was given to him in the recruiting pamphlets. And a lot of these recruiting pamphlets will say things like, you're going to have an opportunity to share an opinion, and you've got to stand your ground. You've got to have a backbone. Don't bend. His interpretation of that was to be really, really tough."},{"start":1324.05,"text":"So I would pick corners, I'd pick holes in his code, I'd pick corner cases where things may not work, and I'd give him a test of crisis. And this advice that he'd been given to stand his ground ended up making him kind of hostile in these interview environments. And I was looking at this then from the point of view of what Andrew was just talking about, where it's a case of, hey..."},{"start":1346.41,"text":"Good people, good teams, people that you can work together with. And from the interviewer perspective, if I'm managing this team, this person is that cliche 10x engineer, but I don't want him anywhere near my team because of this attitude. We worked on that. We fine-tuned it. And the strange part is, he's a really, really nice guy. It's just this was the advice he was given."}],"speech_gaps":[],"frame":"../frames/v056/008.webp","frame_time":1223.98},{"title":"职业建议与当前AI行业就业形势","segments":[{"id":112,"text":"And he followed that advice and he failed so many interviews as a result. So when I gave him the next job that he was interviewing at was at a company where teamwork is very, very highly valued. And the good news is he got the job at that company. He's now working there. He doubled his salary from the job he was laid off from. And he ended up having like about, now he looks back and he had six months of unemployment. But at the time when he was going through all of that, it was a very, very difficult time for him. So the flip side of it, like if you're looking at a company,"},{"id":113,"text":"and looking at the people you'll be working with is very, very important, but also realize they are looking at you in the same way. And so if you've gone to tech interview coaching and they gave you that advice to stand your ground and have a backbone, it's good to do that, but don't be a jerk while you're doing so."},{"id":114,"text":"Can you see my slides? Okay. So I'm Lawrence. I've been working in tech for more decades than ChatGP thinks there are ores in strawberry. And so I've worked in many of the big tech companies. I spent many years at Microsoft, spent many years at Google, also worked in places like Reuters. I've done a lot of work in startups, both in this country and abroad. And so what I really want to talk about today is to think about what does the career landscape look like today?"},{"id":115,"text":"particularly in AI. Because, first of all, what Andrew said about you're in Stanford, you've got the ability to make use of the networks that you have in Stanford, make use of the prestige that you have, and I say use every weapon you have, because unfortunately the landscape right now is not ideal. We've gone through some very difficult times. All you have to do is look at the news, and you can see..."},{"id":116,"text":"massive tech layoffs, slowing hiring in tech, and lots of stuff like that. But it's not necessarily a bad thing if you do it the right way. So I want to just have a quick look. The job market reality check. Actually, out of interest, I don't know. Are you juniors? You're graduating this year or you're graduating next year? What is the general survey? Your third year of four?"},{"id":117,"text":"Third year of three. I'll say, so you're going to be graduating coming summer. How many people are already looking for jobs? Okay, quite a few of you. How many people have had success? Nobody. Oh, one. Okay, sort of. Okay, that's good. So you're probably seeing some of these things, the signals out there. Junior hiring slowing significantly. When I say junior, I mean graduate level."},{"id":118,"text":"High-profile layoffs are dominating the headlines. I was at Google a couple of years ago when they had the biggest layoff they'd ever had. We're seeing layoffs at the likes of Amazon, Microsoft, other companies like that. It feels that entry-level positions are scarce, and I'm underlying the word feels there, and I want to get into that in a little bit more detail later. And also, competition is fierce. But my question is, should you worry? And I say no, because..."}],"notes":["本段讲述了一个求职者遵循面试建议却多次失败，最终在重视团队合作的公司获得成功的故事。这说明在求职过程中，除了个人能力，团队合作和公司文化同样重要。同时，讲者强调了在面试中保持自信但不傲慢的重要性。","讲者提到自己在科技行业有多年经验，曾在微软、谷歌、路透社等公司工作，并参与过多个初创公司。他强调当前AI行业的职业环境并不理想，但通过正确的方法可以应对挑战。","讲者询问听众的年级，指出许多学生已经开始求职，但成功者寥寥无几。这反映了当前就业市场的竞争激烈和初级职位的稀缺性。","讲者提到科技行业的大规模裁员和招聘放缓，但认为这并不一定是坏事，关键在于如何应对。他指出，虽然感觉初级职位稀缺，但需要进一步分析和理解市场动态。","讲者最后提出问题：是否应该担心当前的就业形势？他回答说不应该，因为尽管存在挑战，但仍有应对策略。","整体上，讲者通过个人经历和行业观察，为听众提供了关于AI行业职业发展的实用建议，并鼓励他们积极应对当前的就业环境。"],"formulas":[],"uncertainties":["ChatGP thinks there are ores in strawberry"],"diagram":"none","start":1368.83,"end":1542.02,"asr_flags":[],"raw_segments":[{"start":1368.83,"text":"And he followed that advice and he failed so many interviews as a result. So when I gave him the next job that he was interviewing at was at a company where teamwork is very, very highly valued. And the good news is he got the job at that company. He's now working there. He doubled his salary from the job he was laid off from. And he ended up having like about, now he looks back and he had six months of unemployment. But at the time when he was going through all of that, it was a very, very difficult time for him. So the flip side of it, like if you're looking at a company,"},{"start":1398.29,"text":"and looking at the people you'll be working with is very, very important, but also realize they are looking at you in the same way. And so if you've gone to tech interview coaching and they gave you that advice to stand your ground and have a backbone, it's good to do that, but don't be a jerk while you're doing so."},{"start":1414.7,"text":"Can you see my slides? Okay. So I'm Lawrence. I've been working in tech for more decades than ChatGP thinks there are ores in strawberry. And so I've worked in many of the big tech companies. I spent many years at Microsoft, spent many years at Google, also worked in places like Reuters. I've done a lot of work in startups, both in this country and abroad. And so what I really want to talk about today is to think about what does the career landscape look like today?"},{"start":1444.24,"text":"particularly in AI. Because, first of all, what Andrew said about you're in Stanford, you've got the ability to make use of the networks that you have in Stanford, make use of the prestige that you have, and I say use every weapon you have, because unfortunately the landscape right now is not ideal. We've gone through some very difficult times. All you have to do is look at the news, and you can see..."},{"start":1466.46,"text":"massive tech layoffs, slowing hiring in tech, and lots of stuff like that. But it's not necessarily a bad thing if you do it the right way. So I want to just have a quick look. The job market reality check. Actually, out of interest, I don't know. Are you juniors? You're graduating this year or you're graduating next year? What is the general survey? Your third year of four?"},{"start":1491.58,"text":"Third year of three. I'll say, so you're going to be graduating coming summer. How many people are already looking for jobs? Okay, quite a few of you. How many people have had success? Nobody. Oh, one. Okay, sort of. Okay, that's good. So you're probably seeing some of these things, the signals out there. Junior hiring slowing significantly. When I say junior, I mean graduate level."},{"start":1514.6,"text":"High-profile layoffs are dominating the headlines. I was at Google a couple of years ago when they had the biggest layoff they'd ever had. We're seeing layoffs at the likes of Amazon, Microsoft, other companies like that. It feels that entry-level positions are scarce, and I'm underlying the word feels there, and I want to get into that in a little bit more detail later. And also, competition is fierce. But my question is, should you worry? And I say no, because..."}],"speech_gaps":[],"frame":"../frames/v056/009.webp","frame_time":1380.83},{"title":"AI领域职业建议与行业变化","segments":[{"id":119,"text":"If you can approach things in the right way, if you can approach the job hunting thing in the right way, particularly understanding how rapidly the AI landscape is changing, then I think people with the right mindset will thrive. So what do I mean by that? So as Andrew had mentioned, the AI hiring landscape is changing because the AI industry is changing. The AI industry, I..."},{"id":120,"text":"I actually first got involved in AI way back in 1992. I worked in it for a little while, just before the AI winter. Everything failed drastically, but I got bitten by the AI bug. And then in 2015, when Google were launching TensorFlow, I got pulled right back into it, became part of the whole AI boom, launching TensorFlow, advocating TensorFlow to millions of people, and seeing the changes that happened."},{"id":121,"text":"Along 2021, 2022, we had a global pandemic. The global pandemic caused a massive industrial slowdown. This massive industrial slowdown meant that companies had to start pivoting towards things that drove revenue and directly drove revenue. And at Google, TensorFlow was an open source product. It didn't directly drive revenue. We began to scale back. Every company in the world also scaled back on hiring at this time."},{"id":122,"text":"Then we get to about 2022, 2023. What happens? We begin to come out of the global pandemic. We begin to realize all industries have this massive log jam of non-hiring that they had done or hiring that they hadn't done. And we're also entering a time where AI was exploding on the scene, thanks to the work of people like Andrew. The world was pivoting and changing to be AI first in just about everything. And every company needed to hire like crazy."},{"id":123,"text":"Every company then hiring like crazy in 2022, 2023 meant that most companies ended up over hiring."},{"id":124,"text":"And what that generally meant was people who were not qualified for higher positions usually got higher positions because you had to enter into a bidding war just to be able to get talent. You ended up having talent grabs, and you ended up having stories like the one Andrew told where it's a case of here's a person with AI talent. Let's grab them. Let's throw money at them. Let's have them come work for us, and then we'll figure out what we want to do."},{"id":125,"text":"So as a result, 2022, 2023, all of this massive overhiring happens because of AI and because of the COVID logjam. And then 2024, 2025 is the great wake up."},{"id":126,"text":"where a lot of companies realized this overhiring that they had done. They have ended up with a lot of people who are underqualified for the job that they were doing. A lot of people ended up getting hired just because they had AI on their resume. And there's a big adjustment going on. And in the light of this big adjustment, show you just one second. In the light of this big adjustment, you're not seeing my slides? Okay. And in the light of this big adjustment,"}],"notes":["本段主要讲述AI行业在不同时间段的变化及其对职业发展的影响。首先提到AI行业在1992年早期阶段的失败，以及2015年TensorFlow的推出带来的复兴。接着描述了2020年全球疫情对AI行业的影响，导致企业放缓招聘。随后在2022-2023年，随着疫情缓解和AI技术的爆发，企业开始大规模招聘，但出现了过度招聘的现象。最后提到2024-2025年，企业开始意识到过度招聘的问题，并进行调整。","讲者强调了AI行业变化的快速性，以及这种变化对求职者心态和策略的影响。他指出，具备正确心态的人才能在行业中脱颖而出。这包括理解AI行业的动态，以及在招聘过程中保持灵活性和适应性。","讲者通过自身经历说明了AI行业的起伏，从1992年的早期失败，到2015年TensorFlow的推出，再到2020年疫情带来的行业放缓，以及2022-2023年的过度招聘。这些例子展示了AI行业如何随着技术发展和外部环境变化而波动。","讲者提到2022-2023年的过度招聘现象，指出许多公司为了获取AI人才而进行激烈的竞争，导致非合格人才被招聘到高职位。这种现象反映了AI行业在快速发展阶段的不稳定性。","讲者指出，2024-2025年是行业调整的时期，许多公司开始意识到过度招聘的问题，并进行调整。这表明AI行业在经历快速扩张后，正在进入一个更加理性和可持续的发展阶段。","讲者最后提到，这种调整对求职者来说是一个重要的机会，需要适应新的行业环境，并重新评估自己的技能和职业路径。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1542.81,"end":1720.09,"asr_flags":[],"raw_segments":[{"start":1542.81,"text":"If you can approach things in the right way, if you can approach the job hunting thing in the right way, particularly understanding how rapidly the AI landscape is changing, then I think people with the right mindset will thrive. So what do I mean by that? So as Andrew had mentioned, the AI hiring landscape is changing because the AI industry is changing. The AI industry, I..."},{"start":1568.86,"text":"I actually first got involved in AI way back in 1992. I worked in it for a little while, just before the AI winter. Everything failed drastically, but I got bitten by the AI bug. And then in 2015, when Google were launching TensorFlow, I got pulled right back into it, became part of the whole AI boom, launching TensorFlow, advocating TensorFlow to millions of people, and seeing the changes that happened."},{"start":1597.08,"text":"Along 2021, 2022, we had a global pandemic. The global pandemic caused a massive industrial slowdown. This massive industrial slowdown meant that companies had to start pivoting towards things that drove revenue and directly drove revenue. And at Google, TensorFlow was an open source product. It didn't directly drive revenue. We began to scale back. Every company in the world also scaled back on hiring at this time."},{"start":1622.59,"text":"Then we get to about 2022, 2023. What happens? We begin to come out of the global pandemic. We begin to realize all industries have this massive log jam of non-hiring that they had done or hiring that they hadn't done. And we're also entering a time where AI was exploding on the scene, thanks to the work of people like Andrew. The world was pivoting and changing to be AI first in just about everything. And every company needed to hire like crazy."},{"start":1651.07,"text":"Every company then hiring like crazy in 2022, 2023 meant that most companies ended up over hiring."},{"start":1659.62,"text":"And what that generally meant was people who were not qualified for higher positions usually got higher positions because you had to enter into a bidding war just to be able to get talent. You ended up having talent grabs, and you ended up having stories like the one Andrew told where it's a case of here's a person with AI talent. Let's grab them. Let's throw money at them. Let's have them come work for us, and then we'll figure out what we want to do."},{"start":1683.9,"text":"So as a result, 2022, 2023, all of this massive overhiring happens because of AI and because of the COVID logjam. And then 2024, 2025 is the great wake up."},{"start":1696.93,"text":"where a lot of companies realized this overhiring that they had done. They have ended up with a lot of people who are underqualified for the job that they were doing. A lot of people ended up getting hired just because they had AI on their resume. And there's a big adjustment going on. And in the light of this big adjustment, show you just one second. In the light of this big adjustment, you're not seeing my slides? Okay. And in the light of this big adjustment,"}],"speech_gaps":[],"frame":"../frames/v056/010.webp","frame_time":1554.81},{"title":"AI领域的职业建议","segments":[{"id":127,"text":"There we go. I think it's because of my power. I'm not plugged into power mains. And in the light of this big adjustment, then what has happened is now a lot of companies are much more cautious about AI skills that they're hiring. And if you're coming into that with that mindset and understanding that, realize opportunity is still there and opportunity is there massively if you approach it strategically. So what I want to talk through today is how you can do exactly that."},{"id":128,"text":"So I see three pillars of success in the business world, and particularly in the AI business world. And nowadays, you can't just have AI on your resume and get overhired. Nowadays, not only do you have to be able to tell that you have the mindset of these three pillars of success, but you also have to be able to show. And to be able to show these actually has never been a better time."},{"id":129,"text":"As Andrew demonstrated earlier on, the ability to vibe code things into existence. He doesn't like the word vibe code. I kind of agree with him. But the ability to prompt things into existence or whatever the word is that we want to use allows you to be able to show better than ever before. He was talking earlier on about product managers, and he had this time when he got engineers to be product managers, and then those engineers ended up being really bad product managers. I actually interviewed at Google twice and failed twice, despite being..."},{"id":130,"text":"very successful at Microsoft, authored 20-plus books, taught college courses. I interviewed at Google twice and failed twice because I was interviewing to be a product manager. Then when I interviewed to be an engineer, they hired me, and they were like..."},{"id":131,"text":"Why didn't you try to join us years ago? So a lot of it is just being a good engineer. You've got the ability to do that and show that nowadays. And with that ratio of engineer to product manager changing, engineering skills are also far more valuable than ever. So the three pillars to success. Number one, understanding in depth. And I'm going to mean this in two different ways. Number one is academically."},{"id":132,"text":"To have the understanding in depth academically of machine learning, of particular model architectures, to be able to understand them, to be able to read papers, to be able to understand what's in those papers, and to be able to understand in particular how to take that stuff and put it to work. The second part of understanding in depth is really having your finger on the pulse of particular trends and where the signal-to-noise ratio..."},{"id":133,"text":"favor signal in those trends. And I'm going to be going into that in a lot more detail a little bit later. Secondly, and also very, very importantly, is business focus. So Andrew said something politically incorrect earlier on. I'm going to also say a similar politically incorrect thing. First of all, hard work."}],"notes":["本段讲者提到，由于AI领域的发展，公司对AI技能的招聘更加谨慎，但机会仍然存在，关键在于战略性的方法。他强调了需要展示自己的能力，而不仅仅是简历上的技能。","讲者指出，现在在AI领域，仅仅拥有AI技能不足以获得工作，必须同时具备正确的思维模式和实际展示能力。他提到，展示能力的时机比以往任何时候都更好。","讲者提到Andrew演示了通过提示（prompt）来生成结果的能力，但认为“vibe code”这个词不准确。他强调了提示能力的重要性，并举了产品经理的例子，说明工程师可能并不擅长产品管理。","讲者提到自己曾两次面试Google失败，但后来在成为工程师后被录用。这说明了在AI领域，工程师技能的重要性远超产品管理技能。","讲者将成功分为三个支柱，其中第一个是深入理解。他提到深入理解包括学术上的掌握，如机器学习和模型架构的理解，以及阅读论文和应用知识的能力。","讲者还提到，深入理解还包括对趋势的把握，特别是在信号与噪声比方面。他计划在后续内容中详细讨论这一点。"],"formulas":[],"uncertainties":["vibe code"],"diagram":"none","start":1720.89,"end":1883.38,"asr_flags":[],"raw_segments":[{"start":1720.89,"text":"There we go. I think it's because of my power. I'm not plugged into power mains. And in the light of this big adjustment, then what has happened is now a lot of companies are much more cautious about AI skills that they're hiring. And if you're coming into that with that mindset and understanding that, realize opportunity is still there and opportunity is there massively if you approach it strategically. So what I want to talk through today is how you can do exactly that."},{"start":1750.02,"text":"So I see three pillars of success in the business world, and particularly in the AI business world. And nowadays, you can't just have AI on your resume and get overhired. Nowadays, not only do you have to be able to tell that you have the mindset of these three pillars of success, but you also have to be able to show. And to be able to show these actually has never been a better time."},{"start":1772.2,"text":"as Andrew demonstrated earlier on, the ability to vibe code things into existence. He doesn't like the word vibe code. I kind of agree with him. But the ability to prompt things into existence or whatever the word is that we want to use allows you to be able to show better than ever before. He was talking earlier on about product managers, and he had this time when he got engineers to be product managers, and then those engineers ended up being really bad product managers. I actually interviewed at Google twice and failed twice, despite being..."},{"start":1801.48,"text":"very successful at Microsoft, authored 20-plus books, taught college courses. I interviewed at Google twice and failed twice because I was interviewing to be a product manager. Then when I interviewed to be an engineer, they hired me, and they were like..."},{"start":1815.04,"text":"Why didn't you try to join us years ago? So a lot of it is just being a good engineer. You've got the ability to do that and show that nowadays. And with that ratio of engineer to product manager changing, engineering skills are also far more valuable than ever. So the three pillars to success. Number one, understanding in depth. And I'm going to mean this in two different ways. Number one is academically."},{"start":1839.05,"text":"To have the understanding in depth academically of machine learning, of particular model architectures, to be able to understand them, to be able to read papers, to be able to understand what's in those papers, and to be able to understand in particular how to take that stuff and put it to work. The second part of understanding in depth is really having your finger on the pulse of particular trends and where the signal-to-noise ratio..."},{"start":1866.36,"text":"favor signal in those trends. And I'm going to be going into that in a lot more detail a little bit later. Secondly, and also very, very importantly, is business focus. So Andrew said something politically incorrect earlier on. I'm going to also say a similar politically incorrect thing. First of all, hard work."}],"speech_gaps":[],"frame":"../frames/v056/011.webp","frame_time":1732.89},{"title":"职业建议：如何衡量努力与产出","segments":[{"id":134,"text":"Hard work is such a nebulous term that I would say that think about hard work in terms of you are what you measure. There is the whole trend out there. I'm trying to remember. Is it 9-9-6 or is it 6-6-9? 9-9-6, right? 9 a.m. to 9 p.m. six days a week is a metric of hard work. It's not. That's not a metric of hard work. That's a metric of time spent."},{"id":135,"text":"So I would encourage everybody, in the same way as Andrew did, to think
