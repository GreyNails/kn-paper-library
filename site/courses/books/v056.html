e one Andrew told where it's a case of here's a person with AI talent. Let's grab them. Let's throw money at them. Let's have them come work for us, and then we'll figure out what we want to do.","zh":"这通常意味着，那些没有资格担任更高职位的人却获得了更高的职位，因为你要进入一场竞标战才能获得人才。最终你就会出现人才争夺的现象，就像安德鲁讲述的那个故事一样，这是一个案例：这里有一个拥有AI人才的人，我们赶紧抓住他，给他大量资金，让他来我们公司工作，然后我们再决定要做什么。","start":1659.62,"end":1683.52},{"id":125,"text":"So as a result, 2022, 2023, all of this massive overhiring happens because of AI and because of the COVID logjam. And then 2024, 2025 is the great wake up.","zh":"因此，2022年、2023年，由于AI和新冠疫情的积压，发生了大规模的过度招聘。而到了2024年、2025年，就迎来了大觉醒。","start":1683.9,"end":1696.5},{"id":126,"text":"where a lot of companies realized this overhiring that they had done. They have ended up with a lot of people who are underqualified for the job that they were doing. A lot of people ended up getting hired just because they had AI on their resume. And there's a big adjustment going on. And in the light of this big adjustment, show you just one second. In the light of this big adjustment, you're not seeing my slides? Okay. And in the light of this big adjustment,","zh":"很多公司意识到他们之前进行了过度招聘，最终他们手头有很多人并不符合他们所从事工作的资格要求。很多人只是因为简历上写着AI就得到了工作。现在正在进行一场巨大的调整。在这样的大调整背景下，你们看不到我的幻灯片吗？好的。在这样的大调整背景下，","start":1696.93,"end":1720.09}],"notes":["本段主要讲述AI行业在不同时间段的变化及其对职业发展的影响。首先提到AI行业在1992年早期阶段的失败，以及2015年TensorFlow的推出带来的复兴。接着描述了2020年全球疫情对AI行业的影响，导致企业放缓招聘。随后在2022-2023年，随着疫情缓解和AI技术的爆发，企业开始大规模招聘，但出现了过度招聘的现象。最后提到2024-2025年，企业开始意识到过度招聘的问题，并进行调整。","讲者强调了AI行业变化的快速性，以及这种变化对求职者心态和策略的影响。他指出，具备正确心态的人才能在行业中脱颖而出。这包括理解AI行业的动态，以及在招聘过程中保持灵活性和适应性。","讲者通过自身经历说明了AI行业的起伏，从1992年的早期失败，到2015年TensorFlow的推出，再到2020年疫情带来的行业放缓，以及2022-2023年的过度招聘。这些例子展示了AI行业如何随着技术发展和外部环境变化而波动。","讲者提到2022-2023年的过度招聘现象，指出许多公司为了获取AI人才而进行激烈的竞争，导致非合格人才被招聘到高职位。这种现象反映了AI行业在快速发展阶段的不稳定性。","讲者指出，2024-2025年是行业调整的时期，许多公司开始意识到过度招聘的问题，并进行调整。这表明AI行业在经历快速扩张后，正在进入一个更加理性和可持续的发展阶段。","讲者最后提到，这种调整对求职者来说是一个重要的机会，需要适应新的行业环境，并重新评估自己的技能和职业路径。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1542.81,"end":1720.09,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1542.81,"text":"If you can approach things in the right way, if you can approach the job hunting thing in the right way, particularly understanding how rapidly the AI landscape is changing, then I think people with the right mindset will thrive. So what do I mean by that? So as Andrew had mentioned, the AI hiring landscape is changing because the AI industry is changing. The AI industry, I..."},{"start":1568.86,"text":"I actually first got involved in AI way back in 1992. I worked in it for a little while, just before the AI winter. Everything failed drastically, but I got bitten by the AI bug. And then in 2015, when Google were launching TensorFlow, I got pulled right back into it, became part of the whole AI boom, launching TensorFlow, advocating TensorFlow to millions of people, and seeing the changes that happened."},{"start":1597.08,"text":"Along 2021, 2022, we had a global pandemic. The global pandemic caused a massive industrial slowdown. This massive industrial slowdown meant that companies had to start pivoting towards things that drove revenue and directly drove revenue. And at Google, TensorFlow was an open source product. It didn't directly drive revenue. We began to scale back. Every company in the world also scaled back on hiring at this time."},{"start":1622.59,"text":"Then we get to about 2022, 2023. What happens? We begin to come out of the global pandemic. We begin to realize all industries have this massive log jam of non-hiring that they had done or hiring that they hadn't done. And we're also entering a time where AI was exploding on the scene, thanks to the work of people like Andrew. The world was pivoting and changing to be AI first in just about everything. And every company needed to hire like crazy."},{"start":1651.07,"text":"Every company then hiring like crazy in 2022, 2023 meant that most companies ended up over hiring."},{"start":1659.62,"text":"And what that generally meant was people who were not qualified for higher positions usually got higher positions because you had to enter into a bidding war just to be able to get talent. You ended up having talent grabs, and you ended up having stories like the one Andrew told where it's a case of here's a person with AI talent. Let's grab them. Let's throw money at them. Let's have them come work for us, and then we'll figure out what we want to do."},{"start":1683.9,"text":"So as a result, 2022, 2023, all of this massive overhiring happens because of AI and because of the COVID logjam. And then 2024, 2025 is the great wake up."},{"start":1696.93,"text":"where a lot of companies realized this overhiring that they had done. They have ended up with a lot of people who are underqualified for the job that they were doing. A lot of people ended up getting hired just because they had AI on their resume. And there's a big adjustment going on. And in the light of this big adjustment, show you just one second. In the light of this big adjustment, you're not seeing my slides? Okay. And in the light of this big adjustment,"}],"speech_gaps":[],"frame":"../frames/v056/010.webp","frame_time":1554.81},{"title":"AI领域的职业建议","segments":[{"id":127,"text":"There we go. I think it's because of my power. I'm not plugged into power mains. And in the light of this big adjustment, then what has happened is now a lot of companies are much more cautious about AI skills that they're hiring. And if you're coming into that with that mindset and understanding that, realize opportunity is still there and opportunity is there massively if you approach it strategically. So what I want to talk through today is how you can do exactly that.","zh":"好的，我想这是因为我的能力。我没有接入电源。在这样的重大调整背景下，发生的事情是现在许多公司对招聘具备AI技能的人更加谨慎了。如果你带着这种心态和理解进入这个领域，就会意识到机会依然存在，而且机会非常巨大，只要你以战略的方式去把握。因此，我想今天要和大家讨论的就是你如何做到这一点。","start":1720.89,"end":1748.51},{"id":128,"text":"So I see three pillars of success in the business world, and particularly in the AI business world. And nowadays, you can't just have AI on your resume and get overhired. Nowadays, not only do you have to be able to tell that you have the mindset of these three pillars of success, but you also have to be able to show. And to be able to show these actually has never been a better time.","zh":"我看到商业世界，特别是AI领域，成功的三大支柱。如今，你不能仅仅在简历上写有AI技能就获得高薪职位。如今，你不仅要能够表达出你具备这三大成功支柱的心态，还要能够展示出来。而能够展示这一点，现在比以往任何时候都更加容易。","start":1750.02,"end":1771.66},{"id":129,"text":"As Andrew demonstrated earlier on, the ability to vibe code things into existence. He doesn't like the word vibe code. I kind of agree with him. But the ability to prompt things into existence or whatever the word is that we want to use allows you to be able to show better than ever before. He was talking earlier on about product managers, and he had this time when he got engineers to be product managers, and then those engineers ended up being really bad product managers. I actually interviewed at Google twice and failed twice, despite being...","zh":"正如安德鲁之前展示的那样，能够将想法转化为代码的能力。他不喜欢用“vibe code”这个词，我某种程度上也同意他的看法。但能够将想法转化为现实的能力，或者我们想要使用的任何词语，都让你能够比以往任何时候都更好地展示自己。他之前谈到产品经理时，曾有一个时期让工程师担任产品经理，结果这些工程师最终成为了非常糟糕的产品经理。我实际上曾两次面试谷歌，但都失败了，尽管我在微软非常成功，撰写了20多本书，还教授过大学课程。","start":1772.2,"end":1801.46},{"id":130,"text":"very successful at Microsoft, authored 20-plus books, taught college courses. I interviewed at Google twice and failed twice because I was interviewing to be a product manager. Then when I interviewed to be an engineer, they hired me, and they were like...","zh":"我两次面试谷歌都失败了，尽管我在微软非常成功，撰写了20多本书，还教授过大学课程。我两次面试谷歌都失败了，因为我面试的是产品经理职位。后来当我面试工程师职位时，他们聘用了我，并且他们说：","start":1801.48,"end":1814.74},{"id":131,"text":"Why didn't you try to join us years ago? So a lot of it is just being a good engineer. You've got the ability to do that and show that nowadays. And with that ratio of engineer to product manager changing, engineering skills are also far more valuable than ever. So the three pillars to success. Number one, understanding in depth. And I'm going to mean this in two different ways. Number one is academically.","zh":"你为什么不在几年前就加入我们呢？很多时候，仅仅成为一个优秀的工程师就足够了。你具备这种能力并能够展示出来，现在比以往任何时候都更加重要。随着工程师与产品经理比例的变化，工程技能的价值也远比以往任何时候都更加重要。成功的三大支柱。第一点，深入理解。我将以两种不同的方式来解释这一点。第一种是学术上的。","start":1815.04,"end":1838.24},{"id":132,"text":"To have the understanding in depth academically of machine learning, of particular model architectures, to be able to understand them, to be able to read papers, to be able to understand what's in those papers, and to be able to understand in particular how to take that stuff and put it to work. The second part of understanding in depth is really having your finger on the pulse of particular trends and where the signal-to-noise ratio...","zh":"要对机器学习有深入的学术理解，特别是对特定模型架构的理解，能够理解这些模型，能够阅读论文，能够理解论文中的内容，并且能够特别理解如何将这些知识应用到实际工作中。深入理解的第二部分是真正把握特定趋势的脉搏以及在这些趋势中信号与噪声的比例...","start":1839.05,"end":1866.01},{"id":133,"text":"favor signal in those trends. And I'm going to be going into that in a lot more detail a little bit later. Secondly, and also very, very importantly, is business focus. So Andrew said something politically incorrect earlier on. I'm going to also say a similar politically incorrect thing. First of all, hard work.","zh":"在这些趋势中更倾向于信号。我稍后会更详细地讨论这一点。其次，也是非常非常重要的，是商业视角。安德鲁之前说过一些政治不正确的话。我也会说一些类似的政治不正确的话。首先，努力工作。","start":1866.36,"end":1883.38}],"notes":["本段讲者提到，由于AI领域的发展，公司对AI技能的招聘更加谨慎，但机会仍然存在，关键在于战略性的方法。他强调了需要展示自己的能力，而不仅仅是简历上的技能。","讲者指出，现在在AI领域，仅仅拥有AI技能不足以获得工作，必须同时具备正确的思维模式和实际展示能力。他提到，展示能力的时机比以往任何时候都更好。","讲者提到Andrew演示了通过提示（prompt）来生成结果的能力，但认为“vibe code”这个词不准确。他强调了提示能力的重要性，并举了产品经理的例子，说明工程师可能并不擅长产品管理。","讲者提到自己曾两次面试Google失败，但后来在成为工程师后被录用。这说明了在AI领域，工程师技能的重要性远超产品管理技能。","讲者将成功分为三个支柱，其中第一个是深入理解。他提到深入理解包括学术上的掌握，如机器学习和模型架构的理解，以及阅读论文和应用知识的能力。","讲者还提到，深入理解还包括对趋势的把握，特别是在信号与噪声比方面。他计划在后续内容中详细讨论这一点。"],"formulas":[],"uncertainties":["vibe code"],"diagram":"none","start":1720.89,"end":1883.38,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1720.89,"text":"There we go. I think it's because of my power. I'm not plugged into power mains. And in the light of this big adjustment, then what has happened is now a lot of companies are much more cautious about AI skills that they're hiring. And if you're coming into that with that mindset and understanding that, realize opportunity is still there and opportunity is there massively if you approach it strategically. So what I want to talk through today is how you can do exactly that."},{"start":1750.02,"text":"So I see three pillars of success in the business world, and particularly in the AI business world. And nowadays, you can't just have AI on your resume and get overhired. Nowadays, not only do you have to be able to tell that you have the mindset of these three pillars of success, but you also have to be able to show. And to be able to show these actually has never been a better time."},{"start":1772.2,"text":"as Andrew demonstrated earlier on, the ability to vibe code things into existence. He doesn't like the word vibe code. I kind of agree with him. But the ability to prompt things into existence or whatever the word is that we want to use allows you to be able to show better than ever before. He was talking earlier on about product managers, and he had this time when he got engineers to be product managers, and then those engineers ended up being really bad product managers. I actually interviewed at Google twice and failed twice, despite being..."},{"start":1801.48,"text":"very successful at Microsoft, authored 20-plus books, taught college courses. I interviewed at Google twice and failed twice because I was interviewing to be a product manager. Then when I interviewed to be an engineer, they hired me, and they were like..."},{"start":1815.04,"text":"Why didn't you try to join us years ago? So a lot of it is just being a good engineer. You've got the ability to do that and show that nowadays. And with that ratio of engineer to product manager changing, engineering skills are also far more valuable than ever. So the three pillars to success. Number one, understanding in depth. And I'm going to mean this in two different ways. Number one is academically."},{"start":1839.05,"text":"To have the understanding in depth academically of machine learning, of particular model architectures, to be able to understand them, to be able to read papers, to be able to understand what's in those papers, and to be able to understand in particular how to take that stuff and put it to work. The second part of understanding in depth is really having your finger on the pulse of particular trends and where the signal-to-noise ratio..."},{"start":1866.36,"text":"favor signal in those trends. And I'm going to be going into that in a lot more detail a little bit later. Secondly, and also very, very importantly, is business focus. So Andrew said something politically incorrect earlier on. I'm going to also say a similar politically incorrect thing. First of all, hard work."}],"speech_gaps":[],"frame":"../frames/v056/011.webp","frame_time":1732.89},{"title":"职业建议：如何衡量努力与产出","segments":[{"id":134,"text":"Hard work is such a nebulous term that I would say that think about hard work in terms of you are what you measure. There is the whole trend out there. I'm trying to remember. Is it 9-9-6 or is it 6-6-9? 9-9-6, right? 9 a.m. to 9 p.m. six days a week is a metric of hard work. It's not. That's not a metric of hard work. That's a metric of time spent.","zh":"努力工作是一个如此模糊的概念，我会说，应该从你所衡量的内容来思考努力工作。外面有一种趋势，我记得，是9-9-6还是6-6-9？是9-9-6，对吧？早上9点到晚上9点，每周工作六天，这是努力工作的度量标准。不是的，这并不是努力工作的度量标准，这是时间花费的度量标准。","start":1884.65,"end":1906.95},{"id":135,"text":"So I would encourage everybody, in the same way as Andrew did, to think about hard work. But what hard work is is how you measure that hard work. You can work eight hours a day and be incredibly productive. You can work six hours a day and be incredibly productive. But it's the metric of how hard you work and how you measure that. I personally measure that from output, things that I have created in the time that I spent. I joke a lot, but it's true that I've written a lot of books.","zh":"因此，我会鼓励每个人，就像安德鲁所做的那样，思考努力工作。但努力工作的本质在于你如何衡量这种努力工作。你可以每天工作八小时并且极其高效，也可以每天工作六小时并且极其高效。但关键在于你如何衡量努力程度以及如何衡量它。我个人是从产出来衡量的，即我在所花费的时间内所创造的东西。我经常开玩笑，但这是真的，我写了很多书。","start":1907.81,"end":1936.77},{"id":136,"text":"Andrew held up one, that one that he held up that he helped me write a little bit. I actually wrote that book in about two months. And people say, well, how do you have time with your jobs and all these kind of things? You must work like 16 hours a day in order to be able to do this. But actually, the key to me being able to write books is baseball. Any baseball fans here?","zh":"安德鲁举起了一本，那是他帮助我写了一点的那本书。实际上，我大约用了两个月时间写了这本书。人们会说，你怎么能在工作和各种事情中找到时间？你一定每天工作16个小时才能做到这一点。但实际上，我能够写书的关键是棒球。这里有没有棒球迷？","start":1937.44,"end":1957.7},{"id":137,"text":"I love baseball, but if you sit down and try to watch baseball on TV, a match can take like three and a half or four hours. So all of my writing I tend to do in baseball season. So I'm like, if I'm going to sit down, I like the Mariners. I'm from Seattle. I like the Dodgers.","zh":"我热爱棒球，但如果你坐下来看电视上的棒球比赛，一场比赛可能需要三到四个小时。因此，我通常在棒球赛季期间进行写作。我会想，如果我要坐下来，我喜欢水手队。我是西雅图人，我喜欢道奇队。","start":1958.83,"end":1972.17},{"id":138,"text":"Nobody booed. Okay, good. And so usually one of those is going to be playing at 7 o'clock at night. So instead of sitting in front of the TV just watching baseball mindlessly, I'll actually be writing a book while baseball's on in the background. It's a very slow-moving game. This is something like that's the hard work in this case. And I would encourage you to try to find areas where you can work hard and produce output. And that's the second pillar here is that business focus. The output that you produce, to align that output,","zh":"没有人 boo（嘘声）。好的。通常其中一场会在晚上7点进行。因此，我不会坐在电视前无意识地看棒球比赛，而是在棒球比赛的背景中写书。这是一项节奏缓慢的比赛。这正是这种情况下所谓的努力工作。我鼓励你们尝试找到可以努力工作并产生产出的领域。这也是这里的第二个支柱，即商业专注。你所产生的产出，要与之对齐，","start":1973.52,"end":2003.06},{"id":139,"text":"with the business focus that you want to have and with the work that you want to do. There's an old saying, don't dress for the job you have, dress for the one you want. I would say a new angle on that saying would be, don't let your output be for the job you have, let your output be for the job you want. And if I go back to when I spoke about I failed twice at Google to get in, the third time when I got in,","zh":"带着你想要拥有的商业焦点和你想要做的工作。有一句老话，不要为你现在拥有的工作打扮，要为你想拥有的工作打扮。我认为对这句话的新角度是，不要让你的产出服务于你现在的工作，要让你的产出服务于你想拥有的工作。如果我回到我之前谈到的，我两次未能进入谷歌的情况，第三次成功进入时，","start":2003.12,"end":2026.28},{"id":140,"text":"I had actually decided to approach this in a different way. And I was interviewing at the time for their cloud team. They were just really launching cloud. And I had just written a book on Java. And so I decided to see what I could do with Java in their cloud. I ended up writing a Java application that ran in their cloud for predicting stock prices using technical analytics and all that kind of stuff. And when I got to the interview, instead of them asking me stupid questions like how many golf balls can fit in a bus, you know,","zh":"我实际上决定以不同的方式来应对。我当时正在为他们的云团队面试。他们刚刚开始推出云服务。而我刚刚写了一本关于Java的书。因此，我决定看看我能否用Java在他们的云平台上做些什么。我最终写了一个Java应用程序，在他们的云平台上运行，用于利用技术分析预测股票价格，诸如此类的事情。当我到达面试时，他们没有问一些愚蠢的问题，比如一辆公交车能装多少个高尔夫球，你知道的，","start":2026.95,"end":2056.39}],"notes":["本段讨论了如何衡量努力，强调了努力的定义应基于产出而非时间投入。讲者指出，9-9-6或6-6-9这样的时间安排并不能真正反映努力程度，而是时间的消耗。","讲者鼓励听众思考如何衡量自己的努力，并通过产出来体现努力的价值。他提到自己通过写作书籍来衡量努力，而不是单纯地工作时间长短。","讲者提到自己在写作书籍时利用了棒球比赛的时间，说明在特定情境下，可以将工作与兴趣结合，提高效率。","讲者进一步强调了产出与职业目标的一致性，指出应将产出与自己希望从事的工作方向对齐，而不是仅仅满足当前工作的要求。","讲者以自己在Google面试的经历为例，说明如何通过实际项目（如Java应用）来展示自己的能力和价值，而不是回答一些无意义的问题。","讲者引用了一句老话，并提出新的角度，强调产出应服务于未来的职业目标，而不是当前的工作内容。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1884.65,"end":2056.39,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1884.65,"text":"Hard work is such a nebulous term that I would say that think about hard work in terms of you are what you measure. There is the whole trend out there. I'm trying to remember. Is it 9-9-6 or is it 6-6-9? 9-9-6, right? 9 a.m. to 9 p.m. six days a week is a metric of hard work. It's not. That's not a metric of hard work. That's a metric of time spent."},{"start":1907.81,"text":"So I would encourage everybody, in the same way as Andrew did, to think about hard work. But what hard work is is how you measure that hard work. You can work eight hours a day and be incredibly productive. You can work six hours a day and be incredibly productive. But it's the metric of how hard you work and how you measure that. I personally measure that from output, things that I have created in the time that I spent. I joke a lot, but it's true that I've written a lot of books."},{"start":1937.44,"text":"Andrew held up one, that one that he held up that he helped me write a little bit. I actually wrote that book in about two months. And people say, well, how do you have time with your jobs and all these kind of things? You must work like 16 hours a day in order to be able to do this. But actually, the key to me being able to write books is baseball. Any baseball fans here?"},{"start":1958.83,"text":"I love baseball, but if you sit down and try to watch baseball on TV, a match can take like three and a half or four hours. So all of my writing I tend to do in baseball season. So I'm like, if I'm going to sit down, I like the Mariners. I'm from Seattle. I like the Dodgers."},{"start":1973.52,"text":"Nobody booed. Okay, good. And so usually one of those is going to be playing at 7 o'clock at night. So instead of sitting in front of the TV just watching baseball mindlessly, I'll actually be writing a book while baseball's on in the background. It's a very slow-moving game. This is something like that's the hard work in this case. And I would encourage you to try to find areas where you can work hard and produce output. And that's the second pillar here is that business focus. The output that you produce, to align that output,"},{"start":2003.12,"text":"with the business focus that you want to have and with the work that you want to do. There's an old saying, don't dress for the job you have, dress for the one you want. I would say a new angle on that saying would be, don't let your output be for the job you have, let your output be for the job you want. And if I go back to when I spoke about I failed twice at Google to get in, the third time when I got in,"},{"start":2026.95,"text":"I had actually decided to approach this in a different way. And I was interviewing at the time for their cloud team. They were just really launching cloud. And I had just written a book on Java. And so I decided to see what I could do with Java in their cloud. I ended up writing a Java application that ran in their cloud for predicting stock prices using technical analytics and all that kind of stuff. And when I got to the interview, instead of them asking me stupid questions like how many golf balls can fit in a bus, you know,"}],"speech_gaps":[],"frame":"../frames/v056/012.webp","frame_time":1896.65},{"title":"AI领域的职业建议与当前工作环境","segments":[{"id":141,"text":"They saw this code. I had put this code. I remember I was producing output for the job I wanted. I'd put this code on my resume, and my entire interview loop was them asking me about my code. So it put the power on me. It gave me the power to communicate about things that I knew as opposed to going in blind to somebody.","zh":"他们看到了这段代码。我曾经写过这段代码。我记得我当时是在为想要的工作产生输出。我把这段代码放在简历上，而我的整个面试过程都是他们问我关于这段代码的问题。这让我拥有了主动权。它让我能够谈论我所知道的内容，而不是盲目地面对某人。","start":2056.49,"end":2078.63},{"id":142,"text":"asking me random questions in the hope that I'll be able to answer them. And it's the same thing I would say in the AI world. The business focus...","zh":"他们随机地问我问题，希望我能够回答。在AI领域，我也会说同样的事情。商业重点……","start":2079.41,"end":2087.45},{"id":143,"text":"The ability for you now to prompt code into existence, to prompt products into existence. And if you can build those products and line them up with the thing that it is that you want to do, be it a Google or a meta or a startup or any of those kind of things, and have that in-depth understanding, not just of your code, but how it aligns to their business, this is a pillar of success in this time and age. And I will also argue that even though it looks like the signals look like there aren't a lot of jobs out there, there are.","zh":"你现在有能力通过提示生成代码，通过提示生成产品。如果你能够构建这些产品，并将它们与你想要做的事情对齐，无论是谷歌、脸书、初创公司还是其他类型的公司，同时拥有对代码的深入理解，以及它如何与他们的业务对齐，这将是这个时代成功的关键。我也会认为，尽管看起来似乎没有很多工作机会，但实际上是有机会的。","start":2087.87,"end":2114.81},{"id":144,"text":"What there aren't a lot of is a good combination of jobs and people to match them. And then, of course, this bias towards delivery. Ideas are cheap. Execution is everything. I've interviewed many, many people who came in with very, very fluffy ideas and no way to be able to ground them. I've interviewed people who came in with half-baked ideas that they grounded very, very well. Guess which one's got the job, right?","zh":"真正缺乏的是工作机会与合适人才的匹配。当然，还有对交付的偏重。想法很便宜，执行才是关键。我面试过很多人，他们带着非常模糊的想法而来，却没有办法将它们落地。我也面试过一些人，他们带着半成品的想法，却能够很好地落地。猜猜看谁得到了工作，对吧？","start":2115.5,"end":2142.18},{"id":145,"text":"of the academics behind AI, of the practicalities behind AI and the things that you need to do, business focus, focusing on delivery for the business, understanding what the business needs and being able to deliver for that, and again, that bias towards delivery. So, a quick pivot. What's it actually like working in AI right now? It's interesting.","zh":"关于AI学术背景、AI实践方面以及你需要做的事情，商业重点，专注于为商业交付，理解商业需求并能够为此交付，再次强调对交付的偏重。那么，快速切换一下。现在实际在AI领域工作是怎样的？这很有趣。","start":2142.77,"end":2164.74},{"id":146,"text":"Okay, so as recently as like two or three years ago, working in AI was, if you can do a thing, you're great. If you can build an image classifier, you're golden. We'll throw six-figure salaries and massive stock benefits at you. Unfortunately, that's not the case anymore. It's really, a lot of today what you'll see is the P word, production. What can you do for production? What can you do if it's...","zh":"好吧，就在两三年前，从事AI工作还意味着如果你能做一件事，你就是很厉害的。如果你能构建一个图像分类器，你就很抢手。我们会给你六位数的薪水和巨大的股票福利。不幸的是，这种情况已经不再存在了。现在，你看到的很多东西都围绕着一个词，即生产（production）。你能为生产做些什么？如果你能……","start":2165.8,"end":2193.58},{"id":147,"text":"Building new models, if it's optimizing models, if it's understanding users, UX is really, really important. Everything is geared towards production. Everything is biased towards production. The history that I told you about, like going from the pandemic into the overhiring phase that we had, the businesses have pulled back and are optimized towards the bottom line.","zh":"构建新模型，如果是在优化模型，或者是在理解用户，用户体验真的非常重要。所有事情都是以生产为导向的。所有事情都偏向于生产。我之前告诉你们的历史，比如从疫情过渡到我们经历的过度雇佣阶段，企业已经有所回撤，并且优化方向都偏向于底线。","start":2193.98,"end":2218.86}],"notes":["本段讨论了在AI领域求职时，拥有深度理解和实际能力的重要性。讲者强调，仅仅有想法是不够的，关键在于能够将想法转化为实际成果，即执行能力。这包括对AI学术背景的理解、实际应用的技能以及对业务需求的把握。","讲者指出，当前AI行业的重点已从单纯的模型构建转向生产导向。这意味着开发者需要关注如何将AI技术应用于实际产品中，提升用户体验（UX）并确保技术能够满足商业需求。","讲者提到，过去AI行业对技术能力的重视程度较高，但现在更注重实际产出和效率。企业不再仅仅追求技术能力，而是更关注如何将技术转化为实际价值，优化成本和效益。","讲者通过对比不同求职者的经历，说明了执行能力的重要性。那些拥有清晰想法并能有效落地的人更容易获得工作机会，而仅有模糊想法的人则难以成功。","讲者还提到，当前AI行业经历了从过度招聘到优化成本的转变，企业更加注重实际产出和效率，这反映了行业对生产导向的重视。","最后，讲者总结了三个关键点：对AI学术和实践的理解、对业务需求的把握以及对执行的重视。这些因素共同构成了当前AI领域成功的关键要素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2056.49,"end":2218.86,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2056.49,"text":"They saw this code. I had put this code. I remember I was producing output for the job I wanted. I'd put this code on my resume, and my entire interview loop was them asking me about my code. So it put the power on me. It gave me the power to communicate about things that I knew as opposed to going in blind to somebody."},{"start":2079.41,"text":"asking me random questions in the hope that I'll be able to answer them. And it's the same thing I would say in the AI world. The business focus..."},{"start":2087.87,"text":"The ability for you now to prompt code into existence, to prompt products into existence. And if you can build those products and line them up with the thing that it is that you want to do, be it a Google or a meta or a startup or any of those kind of things, and have that in-depth understanding, not just of your code, but how it aligns to their business, this is a pillar of success in this time and age. And I will also argue that even though it looks like the signals look like there aren't a lot of jobs out there, there are."},{"start":2115.5,"text":"What there aren't a lot of is a good combination of jobs and people to match them. And then, of course, this bias towards delivery. Ideas are cheap. Execution is everything. I've interviewed many, many people who came in with very, very fluffy ideas and no way to be able to ground them. I've interviewed people who came in with half-baked ideas that they grounded very, very well. Guess which one's got the job, right? So I would say these three things, understanding and depth."},{"start":2142.77,"text":"of the academics behind AI, of the practicalities behind AI and the things that you need to do, business focus, focusing on delivery for the business, understanding what the business needs and being able to deliver for that, and again, that bias towards delivery. So, a quick pivot. What's it actually like working in AI right now? It's interesting."},{"start":2165.8,"text":"Okay, so as recently as like two or three years ago, working in AI was, if you can do a thing, you're great. If you can build an image classifier, you're golden. We'll throw six-figure salaries and massive stock benefits at you. Unfortunately, that's not the case anymore. It's really, a lot of today what you'll see is the P word, production. What can you do for production? What can you do if it's..."},{"start":2193.98,"text":"Building new models, if it's optimizing models, if it's understanding users, UX is really, really important. Everything is geared towards production. Everything is biased towards production. The history that I told you about, like going from the pandemic into the overhiring phase that we had, the businesses have pulled back and are optimized towards the bottom line."}],"speech_gaps":[],"frame":"../frames/v056/013.webp","frame_time":2068.49},{"title":"职业建议：从技术到商业的转变","segments":[{"id":148,"text":"I have an old saying that the bottom line is that the bottom line is the bottom line. And this is the environment that we're in today. And if you can come in with that mindset when you're talking with companies, that's one of the keys to open the door. One of the things I've seen in the field has been maturing from, it used to be really nice that we could do cool things and we could build cool things. Now it's really build useful things.","zh":"我有一句老话，那就是底线就是底线。这是我们今天所处的环境。如果你在与公司交流时能带着这种心态，那就是打开大门的关键之一。我在行业中看到的一个变化是，过去我们能做些酷的事情，能构建一些酷的东西，而现在，我们真正需要构建的是有用的东西。","start":2219.45,"end":2240.88},{"id":149,"text":"Those useful things can be cool too, by the way. And the results of them can be cool. And the changes that we see that come about as a result of delivering them can be cool. So it's not just coolness for coolness sake, but to really focus on delivery, focus on being able to provide value, and then the coolness will follow. I guess what I'm trying to argue. So four realities. Number one, unfortunately nowadays, business focus is non-negotiable.","zh":"顺便说一句，这些有用的东西也可以很酷，它们的结果也可以很酷，通过交付它们所带来的变化也可以很酷。因此，这并不是为了酷而酷，而是要真正专注于交付，专注于能够提供价值，然后酷自然就会随之而来。我想我试图论证的是这四个现实。第一点，不幸的是，如今商业重点是不可谈判的。","start":2241.47,"end":2268.98},{"id":150,"text":"Now, I'm going to be a little bit politically incorrect here again for a moment. I've been working, like I said, for most of the last 35 years in tech. I would say for most of the last 10 years, a lot of large companies, particularly in Silicon Valley, have really focused on developing their people above everything. Part of developing their people was bringing their entire self to work.","zh":"现在，我又要暂时有点政治不正确了。正如我所说，我过去35年大部分时间都在科技行业工作。我认为在过去10年中，很多大公司，尤其是硅谷的公司，真正把发展员工放在了所有事情之上。发展员工的一部分是把他们全部的自我带入工作。","start":2269.47,"end":2297.35},{"id":151,"text":"part of bringing their entire self to work was bringing the things that they care about outside of work. And that led to a lot of activism within companies. Now, please...","zh":"把他们全部的自我带入工作的一部分是把他们在工作之外所关心的事情也带入工作。这导致了公司内部大量的激进主义。请……","start":2298.08,"end":2309.84},{"id":152,"text":"Let me underline this. There is nothing wrong with activism. There is nothing wrong with wanting to support causes of justice. There is absolutely nothing wrong with that. But the over-indexing on that has, in my experience, has led to a lot of companies getting trapped by having to support activism above business.","zh":"让我强调一下。激进主义本身并没有错。想要支持正义事业也没有错。绝对没有任何问题。但在我的经验中，过度强调这一点导致了很多公司陷入必须支持激进主义而忽视商业的困境。","start":2310.33,"end":2331.51},{"id":153,"text":"You've probably seen an example about two years ago of where activists in Google broke into the Google Cloud head's office because they were protesting a country that Google Cloud were doing business with. They broke into his office, they had a sit-in in his office, and they used the bathroom all over his desk and stuff like that. This is where activism got out of hand, and as a result...","zh":"你可能看到两年前谷歌的一个例子，当时谷歌的激进主义者闯入了谷歌云部门负责人的办公室，因为他们抗议谷歌云与某个国家的商业往来。他们闯入了他的办公室，坐在他的办公室里，并在他的办公桌上到处乱涂乱画。这就是激进主义失控的例子，结果……","start":2332.6,"end":2356.34},{"id":154,"text":"The unfortunate truth is the good signals in that activism are now being lost because of those actions. People are being laid off. People are losing jobs. Activism is being stifled. And business focus has become non-negotiable. There's a bit of a pendulum swing going on. And the pendulum that had swung too far towards allowing people to bring their full selves to work is now swinging back in the other direction. We might blame the person in the White House and all that for these kind of things, but it's not.","zh":"不幸的真相是，那些在行动主义中产生的积极信号现在正在因这些行为而丧失。人们正在被裁员。人们正在失去工作。行动主义正在受到压制。而商业重点已经成为不可谈判的。正在发生一种摆动的转变。那个曾经过度向允许人们在工作中展现完整自我的方向摆动的摆锤，现在正在向相反的方向摆动。我们可能会责怪白宫里的人以及所有这些事情，但其实并非如此。","start":2356.78,"end":2386.16}],"notes":["本段讨论了职业建议中从技术到商业的转变，强调了在与公司沟通时应具备务实的思维模式，而不是仅仅追求技术上的创新。讲者指出，现在更注重的是构建真正有用的产品，而不仅仅是酷炫的技术。","讲者提到，虽然支持正义事业的活动本身没有问题，但过度强调这种活动可能导致公司陷入支持 activism 而忽视商业目标的困境。这表明在职业发展中，需要在个人价值观与公司目标之间找到平衡。","讲者举了 Google 的例子，说明过度的 activism 可能导致负面后果，如员工被裁员、活动被压制等。这表明在职业发展中，需要避免将 activism 作为主要驱动力。","讲者指出，当前存在一种摆动现象，即从允许员工完全展现自我转向更注重商业目标。这表明在职业发展中，需要适应这种变化，并在个人与组织之间找到合适的定位。","讲者最后提到，虽然可能将某些现象归因于政治因素，但实际上这些变化更多是由于组织内部的调整。这表明在职业发展中，需要关注组织内部的动态变化，而不是外部因素。","讲者强调了在职业发展中，需要关注实际的商业目标，而不是仅仅追求技术上的创新或个人价值观的表达。这表明在职业发展中，需要具备务实的思维模式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2219.45,"end":2386.16,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2219.45,"text":"I have an old saying that the bottom line is that the bottom line is the bottom line. And this is the environment that we're in today. And if you can come in with that mindset when you're talking with companies, that's one of the keys to open the door. One of the things I've seen in the field has been maturing from, it used to be really nice that we could do cool things and we could build cool things. Now it's really build useful things."},{"start":2241.47,"text":"Those useful things can be cool too, by the way. And the results of them can be cool. And the changes that we see that come about as a result of delivering them can be cool. So it's not just coolness for coolness sake, but to really focus on delivery, focus on being able to provide value, and then the coolness will follow. I guess what I'm trying to argue. So four realities. Number one, unfortunately nowadays, business focus is non-negotiable."},{"start":2269.47,"text":"Now, I'm going to be a little bit politically incorrect here again for a moment. I've been working, like I said, for most of the last 35 years in tech. I would say for most of the last 10 years, a lot of large companies, particularly in Silicon Valley, have really focused on developing their people above everything. Part of developing their people was bringing their entire self to work."},{"start":2298.08,"text":"part of bringing their entire self to work was bringing the things that they care about outside of work. And that led to a lot of activism within companies. Now, please..."},{"start":2310.33,"text":"Let me underline this. There is nothing wrong with activism. There is nothing wrong with wanting to support causes of justice. There is absolutely nothing wrong with that. But the over-indexing on that has, in my experience, has led to a lot of companies getting trapped by having to support activism above business."},{"start":2332.6,"text":"You've probably seen an example about two years ago of where activists in Google broke into the Google Cloud head's office because they were protesting a country that Google Cloud were doing business with. They broke into his office, they had a sit-in in his office, and they used the bathroom all over his desk and stuff like that. This is where activism got out of hand, and as a result..."},{"start":2356.78,"text":"The unfortunate truth is the good signals in that activism are now being lost because of those actions. People are being laid off. People are losing jobs. Activism is being stifled. And business focus has become non-negotiable. There's a bit of a pendulum swing going on. And the pendulum that had swung too far towards allowing people to bring their full selves to work is now swinging back in the other direction. We might blame the person in the White House and all that for these kind of things, but it's not."}],"speech_gaps":[],"frame":"../frames/v056/014.webp","frame_time":2231.45},{"title":"AI职业建议：风险缓解与责任意识","segments":[{"id":155,"text":"solely that. It is that ongoing pendulum there and I think it's an important part of it is that you have to realize going into companies now that business focus is absolutely non-negotiable. Secondly, risk mitigation is part of the job and I think a very important part of any job particularly with AI.","zh":"仅仅是这样。那是持续摆动的钟摆，我认为其中很重要的一部分是你必须意识到，现在进入公司时，商业重点是绝对不可谈判的。其次，风险缓解是工作的一部分，我认为这是任何工作的非常重要的部分，特别是在AI领域。","start":2386.22,"end":2403.99},{"id":156,"text":"I think if you can come into AI with a focus and a mindset around understanding the risks of transforming a particular business process to be an AI-oriented one and to help mitigate those risks, I think is really, really powerful. And I would argue in an interview environment, that's the number one skill to have, to have that mindset around you are doing a business transformation from heuristic computing to intelligent computing. Here's the risks.","zh":"我认为如果你能以理解和转变特定业务流程为AI导向的思维方式进入AI领域，并帮助缓解这些风险，我认为这真的非常强大。我在面试环境中会争辩说，这是最重要的技能，拥有这种思维方式，即你正在从启发式计算转变为智能计算进行业务转型。这里就是风险。","start":2404.76,"end":2433.82},{"id":157,"text":"Here's how you mitigate those risks, and here's the mindset behind that. The third part is responsibility is evolving.","zh":"以下是您如何缓解这些风险，以及背后的心态。第三部分是责任正在演变。","start":2434.17,"end":2440.09},{"id":158,"text":"Now, responsibility in AI has, again, changed from a very fluffy definition of, you know, let's make sure that the AI works for everybody to a definition of let's make sure that the AI works, let's make sure that it drives the business, and then let's make sure that it works for everybody. Often that has been inverted over the last few years, and that has led to some famous documented disasters. Let me share one with you.","zh":"现在，AI中的责任，再次从一个非常模糊的定义，即确保AI对所有人有益，转变为一个定义，即确保AI有效运作，确保它推动业务发展，然后确保它对所有人有益。在过去几年中，这种定义经常被颠倒，这导致了一些著名的记录在案的灾难。让我和你们分享一个例子。","start":2440.76,"end":2469.32},{"id":159,"text":"Let's see. I have lots of windows open. Okay. Everybody knows image generation, right? Text-to-image generation. I want to share. These were things that happened a couple of years ago with Gemini. So with Gemini, I was doing some testing around this one, and I was working heavily on responsible AI.","zh":"让我们看看。我有很多窗口打开。好吧，大家都知道图像生成，对吧？文本到图像生成。我想和大家分享。这些是在几年前与Gemini发生的事情。使用Gemini时，我正在围绕这个进行一些测试，并且我正在大力从事负责任的AI工作。","start":2471.48,"end":2492.4},{"id":160,"text":"And part of responsible AI is you want to be representative of people. And when you're building something, like if you're at Google and you're indexing information, you really want to make sure that you don't reinforce negative biases. And if you're generating images, it's very easy to reinforce negative biases. So, for example, if I said, give me an image of a doctor. If the training set primarily has men as doctors, it's more likely to give a man.","zh":"负责任的AI的一部分是你希望代表人们。当你在构建某些东西时，比如你在Google并正在索引信息，你真的希望确保你不会强化负面偏见。如果你在生成图像，很容易强化负面偏见。例如，如果我说，给我一张医生的图像。如果训练集主要由男性作为医生，那么它更可能给出一个男性。","start":2493.64,"end":2519.3},{"id":161,"text":"If I say, give me an image of a nurse, if the training set is more likely to have women as nurses, it's more likely to give me an image of a woman. But that's reinforcing a negative stereotype. So I wanted to do a test of how Google were trying to overcome that, given that these negative biases are already in the training set.","zh":"如果我说，给我一张护士的图片，如果训练集更可能包含女性作为护士，那么它更可能给我一张女性的图片。但这样做会强化一个负面的刻板印象。因此，我想测试一下谷歌是如何尝试克服这种问题的，因为这些负面偏见已经存在于训练集中。","start":2519.76,"end":2538.42}],"notes":["本段讨论了AI职业建议中的三个核心要素：业务重点、风险缓解和责任意识。讲者强调在进入公司时，业务目标是不可谈判的，风险缓解是AI工作的重要组成部分，而责任意识正在演变。","讲者指出，进入AI领域时，需要具备理解将特定业务流程转变为AI导向过程中的风险，并帮助缓解这些风险的思维模式。这种思维模式在面试中是最重要的技能之一，因为它涉及从启发式计算向智能计算的业务转型。","责任意识在AI领域经历了从模糊定义到更具体定义的转变，即确保AI有效运作、推动业务发展，并最终确保其对所有人有益。这种转变在过去几年中导致了一些著名的灾难性事件。","讲者以图像生成为例，说明了AI在训练数据中可能存在的负面偏见问题。例如，如果训练数据中医生主要是男性，那么生成的图像更可能呈现男性医生；如果护士主要是女性，生成的图像更可能呈现女性护士，这会强化负面刻板印象。","讲者提到，Google正在努力克服这些训练数据中的负面偏见问题，但这些偏见已经存在于训练数据中，因此需要特别关注。","本段通过具体例子说明了AI在实际应用中可能遇到的伦理和偏见问题，并强调了在AI开发过程中需要考虑的多方面因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2386.22,"end":2538.42,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2386.22,"text":"solely that. It is that ongoing pendulum there and I think it's an important part of it is that you have to realize going into companies now that business focus is absolutely non-negotiable. Secondly, risk mitigation is part of the job and I think a very important part of any job particularly with AI."},{"start":2404.76,"text":"I think if you can come into AI with a focus and a mindset around understanding the risks of transforming a particular business process to be an AI-oriented one and to help mitigate those risks, I think is really, really powerful. And I would argue in an interview environment, that's the number one skill to have, to have that mindset around you are doing a business transformation from heuristic computing to intelligent computing. Here's the risks."},{"start":2434.17,"text":"Here's how you mitigate those risks, and here's the mindset behind that. The third part is responsibility is evolving."},{"start":2440.76,"text":"Now, responsibility in AI has, again, changed from a very fluffy definition of, you know, let's make sure that the AI works for everybody to a definition of let's make sure that the AI works, let's make sure that it drives the business, and then let's make sure that it works for everybody. Often that has been inverted over the last few years, and that has led to some famous documented disasters. Let me share one with you."},{"start":2471.48,"text":"Let's see. I have lots of windows open. Okay. Everybody knows image generation, right? Text-to-image generation. I want to share. These were things that happened a couple of years ago with Gemini. So with Gemini, I was doing some testing around this one, and I was working heavily on responsible AI."},{"start":2493.64,"text":"And part of responsible AI is you want to be representative of people. And when you're building something, like if you're at Google and you're indexing information, you really want to make sure that you don't reinforce negative biases. And if you're generating images, it's very easy to reinforce negative biases. So, for example, if I said, give me an image of a doctor. If the training set primarily has men as doctors, it's more likely to give a man."},{"start":2519.76,"text":"If I say, give me an image of a nurse, if the training set is more likely to have women as nurses, it's more likely to give me an image of a woman. But that's reinforcing a negative stereotype. So I wanted to do a test of how Google were trying to overcome that, given that these negative biases are already in the training set."}],"speech_gaps":[],"frame":"../frames/v056/015.webp","frame_time":2398.22},{"title":"AI生成内容中的偏见与责任问题","segments":[{"id":162,"text":"So I said, OK, here's a prompt where I said, give me a young Asian woman in a cornfield wearing a summer dress and a straw hat looking intently at her iPhone. And it gave me these beautiful images. It did a really nice job. OK, and this is a virtual actress I've been working with. I'll share that in a moment. And I say, OK, what if I ask for an Indian one? So I said, OK, whoops, a young Indian woman, same prompt. And it gave me beautiful images of a young Indian woman.","zh":"所以我说道，好的，这里有一个提示，我说：给我一个年轻亚洲女性在玉米地里穿着夏装和草帽，专注地看着她的iPhone。它给了我这些美丽的图像。它做得非常好。好的，这是一位我一直在合作的虚拟演员，我稍后会分享这一点。我说，好的，如果我要求一个印度女性呢？所以我说道，好的，哎呀，一个年轻的印度女性，同样的提示。它给了我美丽的年轻印度女性的图像。","start":2539.1,"end":2567.73},{"id":163,"text":"Then I was like, okay, what if I want her to be black? For some reason, it only gave me three. I'm not sure why, but it still adhered to the prompt. So the responsibility was like looking really, really good. So then I asked it to give me a Latina. Latina, it gave me four. But yep, she looks pretty Latina. Maybe the one on the bottom left looks a little bit like Hermione Granger, but on the whole, looks pretty good.","zh":"然后我想，如果我想要她是个黑人呢？出于某种原因，它只给了我三个。我不确定为什么，但它仍然遵循了提示。所以责任就像是看起来非常棒。然后我要求它给我一个拉丁裔女性。拉丁裔，它给了我四个。但确实，她看起来相当拉丁裔。也许底部左边的那一个看起来有点像赫敏·格兰杰，但总体来说，看起来相当不错。","start":2568.92,"end":2597.65},{"id":164,"text":"Then I asked it to give me a Caucasian. What do you think happened? While I understand your request, I am unable to generate images of people as this could potentially lead to harmful stereotypes and biases. This was a very poorly implemented safety filter where the safety filter in this case was like looking for the word Caucasian or looking for the word white and the result saying it wouldn't do it.","zh":"然后我要求它给我一个白人。你认为会发生什么？虽然我理解你的请求，但我无法生成人物图像，因为这可能会导致有害的刻板印象和偏见。这是一个非常糟糕实现的安全过滤器，其中安全过滤器在这种情况下是寻找单词‘白人’或‘白色’，然后结果说它不会这么做。","start":2598.73,"end":2627.94},{"id":165,"text":"And yep, while I'm able to fulfill your requests, I'm not currently generating images of people. It lied to my face, right? Because I just generate images of people. Anybody know the hack that I used to get it to work? This is a funny one. So I will show you one moment. I asked it to generate an Irish woman. What do you think it did?","zh":"确实，虽然我能够满足你的请求，但我目前不生成人物图像。它直接对我说谎了，对吧？因为我只是生成人物图像。任何人知道我用来让它工作的黑客方法吗？这是一个有趣的例子。所以我将展示你一个瞬间。我要求它生成一个爱尔兰女性。你认为它会怎么做？","start":2628.88,"end":2655.27},{"id":166,"text":"And yep, while I'm able to fulfill your requests, I'm not currently generating images of people. It lied to my face, right? Because I just generate images of people. Anybody know the hack that I used to get it to work? This is a funny one. So I will show you one moment. I asked it to generate an Irish woman. What do you think it did?","zh":"确实，虽然我能够满足你的请求，但我目前不生成人物图像。它直接对我说谎了，对吧？因为我只是生成人物图像。任何人知道我用来让它工作的黑客方法吗？这是一个有趣的例子。所以我将展示你一个瞬间。我要求它生成一个爱尔兰女性。你认为它会怎么做？","start":2658.03,"end":2677.13},{"id":167,"text":"It gave me this image of an Irish woman, no problem, in a summer dress, straw hat, looking intently at her phone. What do you notice about this image? She's got red hair in every image, right? I grew up in Ireland, and Ireland does have the highest proportion of redheads in the world. It's about 8%. But...","zh":"它给我生成了一张爱尔兰女性的图像，没问题，穿着夏装，戴着草帽，专注地盯着手机看。你注意到这张图像有什么特点吗？每张图像里她都有红发，对吧？我是在爱尔兰长大的，爱尔兰确实拥有世界上最高的红发比例，大约是8%。但是……","start":2677.74,"end":2690.18},{"id":168,"text":"If you're going to draw an image of a person and associate a particular ethnicity with a color of hair, you can begin to see this is massively problematic. There are areas, I believe, in China where the description of a demon is a red-headed person.","zh":"如果你要绘制一个人的图像，并将特定的种族与某种发色联系起来，你就可以开始看出这有多么严重的问题。我相信在中国某些地区，恶魔的描述就是一个红发的人。","start":2690.73,"end":2709.27}],"notes":["本段讨论了AI生成内容中可能存在的偏见问题，特别是当模型被要求生成特定种族或民族的图像时，可能会引发刻板印象或文化误解。讲者通过测试不同种族描述的生成结果，展示了模型在处理敏感词汇时的局限性。","讲者指出，当模型被要求生成白人（Caucasian）图像时，系统会拒绝生成，这表明模型的安全过滤机制存在缺陷，可能过于狭隘地理解了‘负责任’的定义。","讲者通过测试‘爱尔兰人’的生成结果，发现模型会自动将爱尔兰人与红发联系起来，这反映了模型在训练数据中可能存在的刻板印象。","讲者进一步指出，这种将特定种族与特定特征（如红发）联系起来的做法，可能导致文化误解甚至歧视，例如在中国某些地区，红发被用来描述恶魔。","最后，讲者强调，这种狭隘的‘负责任’定义不仅损害了模型的声誉，也影响了公司的整体形象，说明AI系统在设计和实施安全过滤机制时需要更加谨慎和全面。","讲者通过实际测试和例子，展示了AI生成内容中潜在的偏见问题，并呼吁对模型的训练数据和安全机制进行更深入的反思。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2539.1,"end":2709.27,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2539.1,"text":"So I said, OK, here's a prompt where I said, give me a young Asian woman in a cornfield wearing a summer dress and a straw hat looking intently at her iPhone. And it gave me these beautiful images. It did a really nice job. OK, and this is a virtual actress I've been working with. I'll share that in a moment. And I say, OK, what if I ask for an Indian one? So I said, OK, whoops, a young Indian woman, same prompt. And it gave me beautiful images of a young Indian woman."},{"start":2568.92,"text":"Then I was like, okay, what if I want her to be black? For some reason, it only gave me three. I'm not sure why, but it still adhered to the prompt. So the responsibility was like looking really, really good. So then I asked it to give me a Latina. Latina, it gave me four. But yep, she looks pretty Latina. Maybe the one on the bottom left looks a little bit like Hermione Granger, but on the whole, looks pretty good."},{"start":2598.73,"text":"Then I asked it to give me a Caucasian. What do you think happened? While I understand your request, I am unable to generate images of people as this could potentially lead to harmful stereotypes and biases. This was a very poorly implemented safety filter where the safety filter in this case was like looking for the word Caucasian or looking for the word white and the result saying it wouldn't do it. I was like, okay, let me test the filter a little bit. I said, okay, instead of Caucasian, let me try white."},{"start":2628.88,"text":"And yep, while I'm able to fulfill your requests, I'm not currently generating images of people. It lied to my face, right? Because I just generate images of people. Anybody know the hack that I used to get it to work? This is a funny one. So I will show you one moment. I asked it to generate an Irish woman. What do you think it did?"},{"start":2658.03,"text":"It gave me this image of an Irish woman, no problem, in a summer dress, straw hat, looking intently at her phone. What do you notice about this image? She's got red hair in every image, right? I grew up in Ireland, and Ireland does have the highest proportion of redheads in the world. It's about 8%. But..."},{"start":2677.74,"text":"If you're going to draw an image of a person and associate a particular ethnicity with a color of hair, you can begin to see this is massively problematic. There are areas, I believe, in China where the description of a demon is a red-headed person."},{"start":2690.73,"text":"So what ended up happening here from the responsible AI perspective was one very narrow view of the world of what is responsible and what is not responsible ended up taking over the model, ended up damaging the reputation of the model, and damaging the reputation of the company as a result. In this case, it's..."}],"speech_gaps":[],"frame":"../frames/v056/016.webp","frame_time":2551.1},{"title":"AI责任与职业建议","segments":[{"id":169,"text":"borderline offensive to draw all Irish people as having red hair, but that never even entered into the mindset of those that were building the safety filters here. So when I talk about responsibility is evolving, that's the direction that I want to... Sorry, one moment. Let me get my slides back. That's the direction I want you to think about, that now responsible AI has moved out of very fluffy social issues and into more hard-line things that are associated with the business and prevent damaging the reputation of the business.","zh":"将所有爱尔兰人描绘成红发是一种 borderline offensive 的行为，但那些构建安全过滤器的人从未将这种想法纳入他们的思维中。因此，当我谈到责任正在演变时，我想让你思考的方向就是……抱歉，等一下。让我把幻灯片拿回来。我想让你思考的方向是，现在负责任的 AI 已经从非常松散的社会问题转向了更多与业务相关、防止损害企业声誉的硬性问题。","start":2709.71,"end":2739.11},{"id":170,"text":"There's a lot of great research out there around responsible AI, and that's the stuff that's been rolled into products. And then, of course, like I just showed with Gemini, learning from mistakes is constant. Question at the front. Yeah.","zh":"关于负责任的 AI，有很多优秀的研究，这些研究已经被应用到了产品中。当然，就像我刚才展示的 Gemini 一样，从错误中学习是持续不断的。前排的问题。是的。","start":2739.18,"end":2762.71},{"id":171,"text":"Yeah, so the question was like, you know, issues where races and things were mixed in historical context was the same problem. So, for example, if you had a prompt that said, draw me a samurai, right, the idea was like they didn't want to have, the engine that changed the prompt to make sure that it was fair would end up saying, give me a mixture of samurai of diverse backgrounds.","zh":"是的，问题是关于在历史背景下涉及种族等因素的问题，这与之前的问题是一样的。例如，如果你有一个提示说『画一个武士』，那么想法是他们不希望出现，改变提示的引擎会确保公平性，最终会说『给我一些背景各异的武士』。","start":2764.01,"end":2787.61},{"id":172,"text":"And then you'd have male and female samurai, samurai of different races and those kind of things. And it was the same prompting that ended up causing the damage that I just demonstrated. So the idea was to intercept your prompts to make sure that the outputs of the model would end up providing something that was more fair when it comes to diverse representation.","zh":"然后你会有男性和女性的武士，不同种族的武士，以及类似的情况。正是这种提示导致了我刚才展示的损害。因此，想法是拦截你的提示，以确保模型的输出能提供更加公平的多样化表现。","start":2788.25,"end":2809.01},{"id":173,"text":"So it was a very naive solution that ended up being rolled in. That was a few years ago. They've massively improved it since then. But that's what I'm talking about. If you're working in the AI space nowadays, that's how responsibility is evolving. You can't just get away with that stuff anymore. That Gemini example is a good lesson from that.","zh":"这是一项非常幼稚的解决方案，当时被应用了。从那以后，他们已经大幅改进了这项技术。但这就是我想说的。如果你现在在 AI 领域工作，责任正在以这种方式演变。你不能再用那种方式敷衍了事。这个 Gemini 的例子是一个很好的教训。","start":2809.83,"end":2827.81},{"id":174,"text":"The mindset of you will make mistakes, so learning from mistakes is a constant, ongoing thing. And going back to the people point that Andrew made earlier on, the people around you will make mistakes too. So to have the ability to give them grace when they make mistakes and to work through those mistakes and move on is really, really important and is a reality of AI at work.","zh":"你的思维方式会犯错，因此从错误中学习是一个持续不断的过程。回到安德鲁之前提到的人际关系这一点，你周围的人也会犯错。因此，当他们犯错时，能够给予他们宽容，并一起处理这些错误并继续前进，这是非常重要且在实际工作中AI所面临的现实。","start":2829.13,"end":2853.37},{"id":175,"text":"I've spoken a lot about the business focus advantage, so I'm going to skip over this. So now let's talk about vibe coding. So let's talk about the whole idea of generating code. Now the meme is out there that it makes engineers less useful by the fact that somebody can just prompt code into existence. There is no smoke without fire, of course, but I would say don't let that meme get you down.","zh":"我之前已经谈了很多关于商业重点优势的内容，所以现在我跳过这部分。现在让我们谈谈氛围编码。让我们谈谈生成代码的整个概念。现在有一种迷因流传着，认为由于有人可以简单地通过提示生成代码，这会使工程师变得不那么有用。当然，无风不起浪，但我认为不要让这种迷念让你感到沮丧。","start":2854.41,"end":2873.57}],"notes":["本段讨论了AI责任的演变，从社会议题转向商业相关问题，强调了AI系统在处理多样性时的责任。讲者提到，早期的解决方案较为简单，但后来得到了显著改进。","讲者通过一个例子说明了AI系统如何在生成图像时处理多样性问题，例如在生成武士图像时，系统会尝试生成不同背景的武士，以确保公平性。","讲者指出，AI责任的演变意味着不能忽视错误，必须持续学习和改进。同时，团队成员也会犯错，因此需要给予宽容并共同解决问题。","讲者提到，尽管有生成代码的争议，但不应因此低估工程师的价值，强调了AI在实际工作中的现实挑战。","讲者提到，AI责任的演变涉及多个方面，包括技术改进、团队协作和对错误的处理，这些都需要持续关注。","讲者通过多个例子说明了AI责任的演变，包括多样性处理、错误学习和团队协作，这些内容都与AI在实际工作中的应用密切相关。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2709.71,"end":2873.57,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2709.71,"text":"borderline offensive to draw all Irish people as having red hair, but that never even entered into the mindset of those that were building the safety filters here. So when I talk about responsibility is evolving, that's the direction that I want to... Sorry, one moment. Let me get my slides back. That's the direction I want you to think about, that now responsible AI has moved out of very fluffy social issues and into more hard-line things that are associated with the business and prevent damaging the reputation of the business."},{"start":2739.18,"text":"There's a lot of great research out there around responsible AI, and that's the stuff that's been rolled into products. And then, of course, like I just showed with Gemini, learning from mistakes is constant. Question at the front. Yeah."},{"start":2764.01,"text":"Yeah, so the question was like, you know, issues where races and things were mixed in historical context was the same problem. So, for example, if you had a prompt that said, draw me a samurai, right, the idea was like they didn't want to have, the engine that changed the prompt to make sure that it was fair would end up saying, give me a mixture of samurai of diverse backgrounds."},{"start":2788.25,"text":"And then you'd have male and female samurai, samurai of different races and those kind of things. And it was the same prompting that ended up causing the damage that I just demonstrated. So the idea was to intercept your prompts to make sure that the outputs of the model would end up providing something that was more fair when it comes to diverse representation."},{"start":2809.83,"text":"So it was a very naive solution that ended up being rolled in. That was a few years ago. They've massively improved it since then. But that's what I'm talking about. If you're working in the AI space nowadays, that's how responsibility is evolving. You can't just get away with that stuff anymore. That Gemini example is a good lesson from that."},{"start":2829.13,"text":"The mindset of you will make mistakes, so learning from mistakes is a constant, ongoing thing. And going back to the people point that Andrew made earlier on, the people around you will make mistakes too. So to have the ability to give them grace when they make mistakes and to work through those mistakes and move on is really, really important and is a reality of AI at work. I've spoken a lot about the business focus advantage, so I'm going to skip over this."},{"start":2854.41,"text":"So now let's talk about vibe coding. So let's talk about the whole idea of generating code. Now the meme is out there that it makes engineers less useful by the fact that somebody can just prompt code into existence. There is no smoke without fire, of course, but I would say don't let that meme get you down."}],"speech_gaps":[],"frame":"../frames/v056/017.webp","frame_time":2721.71},{"title":"技术债务与代码开发的类比","segments":[{"id":176,"text":"Because when you start peeling into these things, that is ultimately not the truth. The more skilled you are as an engineer, the better you become using this type of vibe. Somebody give me another phrase other than vibe coding. Using this kind of problem to coding. And I always like to think about this and to try and...","zh":"因为当你开始深入探讨这些问题时，这最终并不是真相。你作为工程师越熟练，你就越能更好地利用这种感觉。有人能给我另一个词，而不是用vibe coding这个词。用这种问题来编程。我总是喜欢思考这一点，并试图……","start":2873.95,"end":2892.31},{"id":177,"text":"put you and put people that I speak with into the role of being a trusted advisor for the people that you speak with. So whether you're interviewing with somebody, get yourself into the mindset of being a trusted advisor of the company that you're interviewing for, whether you're consulting or whatever those kind of things are. So when you want to get into the idea of being a trusted advisor, then you really need to understand the implications of generated code. And nobody can understand the implications of generated code better than an engineer. And the metric that","zh":"把你和你交谈的人放在一个被信任的顾问的角色中。因此，无论你是在面试某人，还是在咨询，或者其他类似的事情，你都需要把自己置于一个被信任的顾问的心态中，为你要面试的公司或咨询的公司服务。因此，当你想要理解成为被信任的顾问这一概念时，你真的需要理解生成代码的含义。没有人比工程师更能理解生成代码的含义。我总是喜欢用的一个指标是技术债务。快速问题。你熟悉技术债务这个短语吗？没有人。好的。我和Andrew在周五于纽约参加了一个会议，我用了这个短语，我看到很多人脸上都是空白的表情。所以我没有意识到人们并不理解什么是技术债务。因此，让我花一点时间来解释一下，因为我发现这是一个很好的框架，可以帮助你理解vibe coding的力量。","start":2892.73,"end":2922.11},{"id":178,"text":"I always like to use around that is technical debt. Quick question. Are you familiar with the phrase technical debt? Nobody. Okay. Andrew and I were doing a conference in New York on Friday, and I used the phrase, and I saw a lot of blank faces. So I didn't realize that people didn't understand what technical debt is. So let me just take a moment to explain that, because I find it's an excellent framework to help you understand the power of vibe coding.","zh":"想想债务，就像你平常那样。比如买房子。如果你买了一栋房子，比如说你借了五十万美元来买房子，并且在买房时签了一个30年的抵押贷款，那么这五十万美元加上所有利息，大约是两倍。因此，你最终要还给银行大约一百万美元，而你只拥有五十万美元的房子。","start":2922.16,"end":2947.94},{"id":179,"text":"Think about debt the way you normally would, right? Buying a house. If you buy a house, you know, like say you borrow half a million dollars to buy a house and a 30-year mortgage when you're buying that house, that half a million dollars with all the interest that you pay is about double. So you end up paying back the bank about a million dollars on half a million owned.","zh":"你有30年的房屋所有权，代价是100万美元的债务。这可能是一个值得承担的债务，因为在这段时间内房子的价值会上升。在这段时间内你不需要支付房租。你在那30年内花费的这100万美元，是一个值得承担的债务，因为你从中获得了超过100万美元的价值。","start":2949.03,"end":2967.57},{"id":180,"text":"You have 30 years of home ownership at a cost of $1 million in debt. That is probably a good debt to take on because the value of the house will increase over that time. You're not paying rent over that time. And that million dollars that you're spending on this house over those 30 years is a good debt to take on because you're getting greater than a million dollars worth of value out of it.","zh":"你有30年的房屋所有权，代价是100万美元的债务。这可能是一个值得承担的债务，因为在这段时间内房子的价值会上升。在这段时间内你不需要支付房租。你在那30年内花费的这100万美元，是一个值得承担的债务，因为你从中获得了超过100万美元的价值。","start":2969.34,"end":2991.92},{"id":181,"text":"A bad debt would be an impulse purchase on a high-interest credit card. You know, those pair of shoes, those latest ones, I really want to buy them. It's $200. By the time I pay them off, it's $500. You're not getting $500 worth of benefit out of those shoes. Approaching software development with the same mindset is the right way to go. Every time you build something, you take on debt.","zh":"一种坏的债务就是用高利率信用卡进行冲动购物。比如说，那双最新款的鞋子，我真的想要买。价格是200美元。等到还清这笔债务时，实际支付了500美元。你从这些鞋子中获得的价值远远不到500美元。以同样的心态对待软件开发是正确的做法。每次你构建某样东西，你都会承担债务。","start":2992.7,"end":3014.64},{"id":182,"text":"It doesn't matter how good it is. There's always going to be bugs. There's always going to be support. There's always going to be new requirements coming in from people. There's always going to be needs to market it. There's always going to be needs for feedback. All of these things are debt. Every time you do a thing, the only way to avoid debt is to do nothing. So your mindset should then get into when you are creating a thing, whether you're coding it yourself or whether you're vibe coding it or any of these things, that you are increasing your amount of technical debt.","zh":"无论它有多好，总会存在漏洞。总会存在支持需求。总会有人提出新的需求。总会存在市场推广的需求。总会存在反馈的需求。所有这些都属于债务。每次你做一件事，唯一避免债务的方法就是什么都不做。因此，当你在创建某样东西时，无论是自己编写代码还是进行其他形式的编码，你都应该意识到你在增加技术债务。","start":3015.27,"end":3043.15}],"notes":["本段讲授了技术债务（technical debt）的概念，将其类比为金融债务，以帮助理解代码开发中的债务问题。讲者指出，技术债务是软件开发中不可避免的，每一次开发行为都会产生债务，而技术债务的积累需要被管理。","讲者通过房屋贷款的例子，说明了技术债务的正面和负面情况。正面的例子是购买房屋，虽然支付了高额利息，但获得了长期价值；负面的例子是冲动消费，虽然花费较少，但实际价值远低于支出。","讲者强调，技术债务是软件开发中不可避免的，无论代码质量如何，都会产生债务，包括错误、支持需求、新功能需求、市场推广和反馈需求等。","讲者指出，避免技术债务的唯一方法是不做任何事情，因此在开发过程中需要保持对技术债务的意识，以确保其可控。","讲者提到，技术债务是一个有用的框架，可以帮助理解vibe coding（一种开发方式）的权力，即通过快速开发来积累债务，但需要后续的维护和优化。","讲者通过类比金融债务，帮助听众理解技术债务的概念，强调了在软件开发中需要权衡短期效率和长期维护成本。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2873.95,"end":3043.15,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2873.95,"text":"Because when you start peeling into these things, that is ultimately not the truth. The more skilled you are as an engineer, the better you become using this type of vibe. Somebody give me another phrase other than vibe coding. Using this kind of problem to coding. And I always like to think about this and to try and..."},{"start":2892.73,"text":"put you and put people that I speak with into the role of being a trusted advisor for the people that you speak with. So whether you're interviewing with somebody, get yourself into the mindset of being a trusted advisor of the company that you're interviewing for, whether you're consulting or whatever those kind of things are. So when you want to get into the idea of being a trusted advisor, then you really need to understand the implications of generated code. And nobody can understand the implications of generated code better than an engineer. And the metric that"},{"start":2922.16,"text":"I always like to use around that is technical debt. Quick question. Are you familiar with the phrase technical debt? Nobody. Okay. Andrew and I were doing a conference in New York on Friday, and I used the phrase, and I saw a lot of blank faces. So I didn't realize that people didn't understand what technical debt is. So let me just take a moment to explain that, because I find it's an excellent framework to help you understand the power of vibe coding."},{"start":2949.03,"text":"Think about debt the way you normally would, right? Buying a house. If you buy a house, you know, like say you borrow half a million dollars to buy a house and a 30-year mortgage when you're buying that house, that half a million dollars with all the interest that you pay is about double. So you end up paying back the bank about a million dollars on half a million owned."},{"start":2969.34,"text":"You have 30 years of home ownership at a cost of $1 million in debt. That is probably a good debt to take on because the value of the house will increase over that time. You're not paying rent over that time. And that million dollars that you're spending on this house over those 30 years is a good debt to take on because you're getting greater than a million dollars worth of value out of it."},{"start":2992.7,"text":"A bad debt would be an impulse purchase on a high-interest credit card. You know, those pair of shoes, those latest ones, I really want to buy them. It's $200. By the time I pay them off, it's $500. You're not getting $500 worth of benefit out of those shoes. Approaching software development with the same mindset is the right way to go. Every time you build something, you take on debt."},{"start":3015.27,"text":"It doesn't matter how good it is. There's always going to be bugs. There's always going to be support. There's always going to be new requirements coming in from people. There's always going to be needs to market it. There's always going to be needs for feedback. All of these things are debt. Every time you do a thing, the only way to avoid debt is to do nothing. So your mindset should then get into when you are creating a thing, whether you're coding it yourself or whether you're vibe coding it or any of these things, that you are increasing your amount of technical debt."}],"speech_gaps":[],"frame":"../frames/v056/018.webp","frame_time":2885.95},{"title":"技术债务与职业建议","segments":[{"id":183,"text":"Those things that you need to pay off over time. So the question then becomes, as you vibe code a thing into existence, in the same way as buying a thing, is it worth the technical debt that you're taking on? What does technical debt generally look like? Bugs that you need to fix. People that you need to convince to help you maintain the code. Documentation that you need to do. Features that you need to add. All of these kind of things. You're all very familiar with them.","zh":"那些你需要随着时间推移来偿还的事情。因此，问题就变成了，当你将代码编写出来时，就像购买物品一样，你所承担的技术债务是否值得？技术债务通常看起来是什么样子的呢？你需要修复的错误。你需要说服他人帮助你维护代码。你需要撰写的文档。你需要添加的功能。所有这些事情你都非常熟悉。","start":3043.8,"end":3072.12},{"id":184,"text":"Think about those as that extra work that you need to do beyond your current work. That's the debt that you're taking on. You know, there are soft debt and there are hard debt.","zh":"将这些视为你当前工作之外需要额外完成的工作。这就是你所承担的债务。你知道，有软性债务和硬性债务之分。","start":3072.7,"end":3080.4},{"id":185,"text":"So to me, that would be the number one piece of advice that I give, and it's the one that I give every time I work with companies around vibe coding. And a lot of companies that I speak with, a lot of companies that I consult with, I do a lot of work with startups in particular, they just want to get straight into opening Gemini or GPT or Anthropic and start churning code out. Let's get to a prototype phase very quickly. Let's go to investors. Let's do stuff. It's great.","zh":"对我来说，这就是我给的首要建议，也是我每次与公司讨论 vibe 编码时都会给出的建议。我与很多公司交流，包括很多我咨询过的公司，尤其是初创企业，他们只想尽快开始使用 Gemini 或 GPT 或 Anthropic 来快速生成代码。让我们快速进入原型阶段。让我们去见投资人。让我们做点事情。这很棒。","start":3081.61,"end":3109.95},{"id":186,"text":"It can be, but debt, debt, debt, debt, debt is always going to be there. How do you manage your debt? A good financier manages their debt and they become rich. A good coder manages their technical debt and they become rich also. So how do you get the good technical debt? How do you get the mortgage instead of the high credit card debt? Well, number one is your objectives. What are they? Are they clear? And have you met them?","zh":"这可能会是，但债务、债务、债务、债务、债务总是存在的。你如何管理你的债务？一个好的财务管理者会管理他们的债务并变得富有。一个好的程序员也会通过管理他们的技术债务而变得富有。那么你如何获得良好的技术债务？你如何获得抵押贷款而不是高利率信用卡债务？首先，你的目标是什么？它们是否明确？你是否已经达到了这些目标？","start":3110.66,"end":3133.94},{"id":187,"text":"You knew what you needed to build. You didn't just fire up ChatGPT and start spinning code out. At least I hope you didn't. Think about how you build it. AI is there to help you build it faster. I'm kind of working on my own little startup at the moment in the movie-making space, and I've been using code generation almost completely for that. But what I've ended up doing for my clear objectives met box here is that I've started building this application. I've tested it. I've thrown it away. I started again, tested it, thrown it away.","zh":"你知道你所需要构建的东西。你没有只是启动 ChatGPT 并开始生成代码。至少我希望你没有这样做。想想你是如何构建它的。人工智能是为了帮助你更快地构建它。我目前在电影制作领域正在经营自己的小创业公司，我几乎完全使用代码生成来完成这项工作。但在我满足明确目标的盒子中，我最终所做的就是开始构建这个应用程序。我测试了它，然后丢弃了它。我重新开始，测试它，然后再次丢弃它。","start":3134.58,"end":3164.02},{"id":188,"text":"Each time my requirements have been improving in my mind, I understand how to do the thing a little bit better, and I can show some of the output of it in a few minutes, but the idea there is that always about having those clear objectives and meeting them, and then if you're building out the thing and you're not meeting those objectives, that's still learning, and there's no harm in throwing it away, because code is cheap now in the age of generated code. Finished code, engineered code is not cheap.","zh":"每次我的需求在脑海中不断改进时，我都能更好地理解如何完成这件事，并且可以在几分钟内展示一些输出结果。但核心思想是始终拥有清晰的目标并达成它们。如果你在构建某个东西时未能达成这些目标，那仍然是学习过程，而且没有害处，因为现在在生成代码的时代，代码并不昂贵。完成的、经过工程设计的代码并不便宜。","start":3164.07,"end":3189.63},{"id":189,"text":"So get those objectives, make them clear, build it, hit a specific requirement, and move on. Is their business value delivered is the other part of it. I've seen people vibe coding for hours on things like Replit to build a really, really cool website, and then the answer was, so what?","zh":"因此，设定这些目标，使其清晰，进行构建，满足特定需求，然后继续前进。是否交付了商业价值是其中的另一部分。我见过有人在像Replit这样的平台上花费数小时编写代码来构建一个非常酷的网站，但最后的回答却是，那又如何？","start":3190.29,"end":3207.71}],"notes":["本段讨论了技术债务的概念，即在开发过程中需要额外完成的工作，如修复错误、维护代码、编写文档和添加功能。这些工作被视为技术债务，类似于财务债务，需要在项目进行过程中逐步偿还。"],"formulas":[],"uncertainties":["vibe code"],"diagram":"none","start":3043.8,"end":3207.71,"asr_flags":[186],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3043.8,"text":"Those things that you need to pay off over time. So the question then becomes, as you vibe code a thing into existence, in the same way as buying a thing, is it worth the technical debt that you're taking on? What does technical debt generally look like? Bugs that you need to fix. People that you need to convince to help you maintain the code. Documentation that you need to do. Features that you need to add. All of these kind of things. You're all very familiar with them."},{"start":3072.7,"text":"Think about those as that extra work that you need to do beyond your current work. That's the debt that you're taking on. You know, there are soft debt and there are hard debt."},{"start":3081.61,"text":"So to me, that would be the number one piece of advice that I give, and it's the one that I give every time I work with companies around vibe coding. And a lot of companies that I speak with, a lot of companies that I consult with, I do a lot of work with startups in particular, they just want to get straight into opening Gemini or GPT or Anthropic and start churning code out. Let's get to a prototype phase very quickly. Let's go to investors. Let's do stuff. It's great."},{"start":3110.66,"text":"It can be, but debt, debt, debt, debt, debt is always going to be there. How do you manage your debt? A good financier manages their debt and they become rich. A good coder manages their technical debt and they become rich also. So how do you get the good technical debt? How do you get the mortgage instead of the high credit card debt? Well, number one is your objectives. What are they? Are they clear? And have you met them?"},{"start":3134.58,"text":"You knew what you needed to build. You didn't just fire up ChatGPT and start spinning code out. At least I hope you didn't. Think about how you build it. AI is there to help you build it faster. I'm kind of working on my own little startup at the moment in the movie-making space, and I've been using code generation almost completely for that. But what I've ended up doing for my clear objectives met box here is that I've started building this application. I've tested it. I've thrown it away. I started again, tested it, thrown it away."},{"start":3164.07,"text":"Each time my requirements have been improving in my mind, I understand how to do the thing a little bit better, and I can show some of the output of it in a few minutes, but the idea there is that always about having those clear objectives and meeting them, and then if you're building out the thing and you're not meeting those objectives, that's still learning, and there's no harm in throwing it away, because code is cheap now in the age of generated code. Finished code, engineered code is not cheap."},{"start":3190.29,"text":"So get those objectives, make them clear, build it, hit a specific requirement, and move on. Is their business value delivered is the other part of it. I've seen people vibe coding for hours on things like Replit to build a really, really cool website, and then the answer was, so what?"}],"speech_gaps":[],"frame":"../frames/v056/019.webp","frame_time":3055.8},{"title":"避免技术债务与代码可理解性","segments":[{"id":190,"text":"I mean, how's this helping the business? How's this really driving something? It's really cool. Yes, Mr. VP, I know you've never written a line of code in your life, and it's really cool that you built a website now, but so what? So, like, think about that and focus on that, and that's how you avoid the bad technical debt. And then, of course, the most understated part of this, and in some ways the most important, particularly if you're working in an organization, is human understanding.","zh":"我的意思是，这怎么能帮助业务呢？这怎么能真正推动一些事情呢？这真的很酷。是的，先生，我知道您这辈子从未写过一行代码，而且您现在建了一个网站，这真的很酷，但那又如何呢？所以，想想这一点，专注于这一点，这就是如何避免坏的技术债务。当然，这其中最被忽视的部分，也是在某些方面最重要的部分，特别是如果你在组织中工作的话，就是人类的理解。","start":3208.31,"end":3232.45},{"id":191,"text":"Right the worst technical debt that you can take on is delivering code that nobody understands. Right only you understand that and then you quit and get a better job. And then the company like is now dependent on that code so being able to","zh":"最糟糕的技术债务是你交付的代码没人能理解。只有你一个人理解它，然后你辞职去了一份更好的工作。而公司现在就依赖于这段代码，所以能够","start":3233.16,"end":3246.02},{"id":192,"text":"as part of the process of building it to make sure that your code is understandable through documentation, through clear algorithms, through the fact that you've spent some time poring through it to make sure that even simple things like variable names make sense is a really, really important way to avoid bad technical debt. And that bad technical debt, my favorite one is the classic solution looking for a problem.","zh":"在构建过程中，通过文档、清晰的算法，以及你花了一些时间仔细研究以确保即使像变量名这样简单的事情也合乎逻辑，来确保你的代码是可理解的，这是避免坏技术债务的一种非常、非常重要的方式。而我最喜欢的坏技术债务类型是经典的解决方案寻找问题。","start":3246.76,"end":3269.36},{"id":193,"text":"Somebody has an idea, somebody has a tool. If the only tool you have is a hammer, every problem looks like a nail, and you end up having all of these tools that get vibe-coded into existence. I've worked in large organizations where people just vibe-coded stuff, checked it into the code base, and then it became really hard to find the good stuff amongst all the bad. Spaghetti code, of course. Poorly structured stuff, particularly when you prompt and prompt and prompt and prompt again.","zh":"有人有一个想法，有人有一个工具。如果你唯一拥有的工具是一把锤子，那么每个问题看起来都像一颗钉子，你最终会拥有所有这些工具，它们被随意编写出来。我曾在大型组织中工作过，人们随意编写代码，提交到代码库中，然后在所有糟糕的代码中很难找到好的部分。这就是所谓的意大利面代码，结构糟糕的代码，特别是当你不断提示、不断提示、再不断提示的时候。","start":3269.91,"end":3295.19},{"id":194,"text":"you know, that it can end up getting into all kinds of trouble. My favorite one at the moment that I'm really struggling with is I'm building a Mac OS application. Anybody ever build in SwiftUI on Mac OS? Okay, a couple. SwiftUI is the default language that Apple use for building for Mac OS, as well as iPhone.","zh":"你知道，它最终可能会陷入各种麻烦。我目前最困扰我的一个例子是我正在构建一个Mac OS应用程序。有没有人用SwiftUI在Mac OS上开发过？好吧，有几个人。SwiftUI是苹果用于构建Mac OS和iPhone应用的默认语言。","start":3295.89,"end":3315.63},{"id":195,"text":"But when you look at the training set, the data training sets that are used to train these models, the vast majority of the code is iPhone code, not Mac OS code. And when I prompt code into existence, it's often given me iOS.","zh":"但当你查看训练集时，用于训练这些模型的数据训练集，绝大多数的代码都是iPhone代码，而不是Mac OS代码。当我提示生成代码时，它通常会给我iOS代码。","start":3316.32,"end":3328.32},{"id":196,"text":"APIs and those kind of things. Even though I'm in Xcode and I've created a macOS app and it's a macOS template and I'm talking to it in Xcode, it still gives me iOS code, stuff like that. And then if I try to change it using prompting, you end up spiraling into spaghetti code and you have to end up changing a lot of this stuff manually. And then, of course, the other one that I joked about it earlier, but it's also true, is some of the bad technical debt that you're going to encounter in the workspace is authority over merit.","zh":"APIs以及类似的东西。尽管我正在使用Xcode，并且创建了一个macOS应用程序，它是一个macOS模板，我在Xcode中与它进行交互，它仍然会给我iOS代码，诸如此类的内容。然后，如果我尝试通过提示来更改它，你最终会陷入混乱的代码中，并且必须手动更改很多这些内容。当然，还有我之前开玩笑提到的另一个问题，但这也是真实的，就是在工作空间中你可能会遇到一些糟糕的技术债务，即权威凌驾于绩效之上。","start":3329.93,"end":3358.63},{"id":197,"text":"That VP suddenly took out his credit card, subscribed to Replit, and started building stuff in Replit. And guess whose problem it is to fix it? So a lot of the advice that I start giving companies and a lot of the words that I would encourage you to start thinking of in being a trusted advisor is to understand this stuff and to manage expectations accordingly.","zh":"那位副总裁突然拿出他的信用卡，订阅了Replit，并开始在Replit上构建东西。而修复这些问题的责任是谁呢？因此，我开始向公司提供建议，并且我鼓励你们开始思考作为值得信赖的顾问时应使用的词汇是：理解这些内容，并相应地管理期望。","start":3359.4,"end":3381.8}],"notes":["本段讨论了技术债务的概念，特别是代码不可理解性带来的风险。讲者指出，最糟糕的技术债务是交付无人理解的代码，这种代码只有开发者自己理解，一旦开发者离职，公司将依赖这种代码，从而产生严重的技术债务问题。","讲者强调了代码可理解性的重要性，认为通过文档、清晰的算法和变量命名等方式确保代码可读性，是避免技术债务的重要手段。他提到，技术债务中最常见的例子是‘经典解决方案寻找问题’，即用不合适的工具解决所有问题。","讲者以SwiftUI为例，说明了在构建Mac OS应用时，由于训练数据主要来自iPhone代码，导致生成的代码偏向iOS风格，从而引发代码混乱和维护困难。这种现象被称为‘面条代码’，即代码结构混乱、难以维护。","讲者还提到，技术债务不仅来自代码本身，还可能来自组织内部的权力结构，例如高管突然使用Replit等工具进行开发，而问题最终仍需由技术人员解决。这表明技术债务不仅涉及代码质量，还涉及组织管理问题。","讲者建议企业应重视技术债务管理，培养技术人员成为值得信赖的顾问，理解技术细节并合理管理期望。这包括对代码质量、工具使用和组织结构的综合考量。","讲者通过多个实际例子，如SwiftUI的代码生成问题和高管使用Replit的情况，说明了技术债务的复杂性和多样性。这些例子展示了技术债务不仅影响代码本身，还可能影响团队协作和组织效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3208.31,"end":3381.8,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3208.31,"text":"I mean, how's this helping the business? How's this really driving something? It's really cool. Yes, Mr. VP, I know you've never written a line of code in your life, and it's really cool that you built a website now, but so what? So, like, think about that and focus on that, and that's how you avoid the bad technical debt. And then, of course, the most understated part of this, and in some ways the most important, particularly if you're working in an organization, is human understanding."},{"start":3233.16,"text":"Right the worst technical debt that you can take on is delivering code that nobody understands Right only you understand that and then you quit and get a better job And then the company like is now dependent on th
