at code so being able to"},{"start":3246.76,"text":"as part of the process of building it to make sure that your code is understandable through documentation, through clear algorithms, through the fact that you've spent some time poring through it to make sure that even simple things like variable names make sense is a really, really important way to avoid bad technical debt. And that bad technical debt, my favorite one is the classic solution looking for a problem."},{"start":3269.91,"text":"Somebody has an idea, somebody has a tool. If the only tool you have is a hammer, every problem looks like a nail, and you end up having all of these tools that get vibe-coded into existence. I've worked in large organizations where people just vibe-coded stuff, checked it into the code base, and then it became really hard to find the good stuff amongst all the bad. Spaghetti code, of course. Poorly structured stuff, particularly when you prompt and prompt and prompt and prompt again."},{"start":3295.89,"text":"you know, that it can end up getting into all kinds of trouble. My favorite one at the moment that I'm really struggling with is I'm building a Mac OS application. Anybody ever build in SwiftUI on Mac OS? Okay, a couple. SwiftUI is the default language that Apple use for building for Mac OS, as well as iPhone."},{"start":3316.32,"text":"But when you look at the training set, the data training sets that are used to train these models, the vast majority of the code is iPhone code, not Mac OS code. And when I prompt code into existence, it's often given me iOS."},{"start":3329.93,"text":"APIs and those kind of things. Even though I'm in Xcode and I've created a macOS app and it's a macOS template and I'm talking to it in Xcode, it still gives me iOS code, stuff like that. And then if I try to change it using prompting, you end up spiraling into spaghetti code and you have to end up changing a lot of this stuff manually. And then, of course, the other one that I joked about it earlier, but it's also true, is some of the bad technical debt that you're going to encounter in the workspace is authority over merit."},{"start":3359.4,"text":"That VP suddenly took out his credit card, subscribed to Replit, and started building stuff in Replit. And guess whose problem it is to fix it? So a lot of the advice that I start giving companies and a lot of the words that I would encourage you to start thinking of in being a trusted advisor is to understand this stuff and to manage expectations accordingly."}],"speech_gaps":[],"frame":"../frames/v056/020.webp","frame_time":3220.31},{"title":"AI领域的职业建议：应对炒作与信息过载","segments":[{"id":198,"text":"Okay, so framework for responsible vibe coding we've just spoke about. So one of the things I want to get into is we're coming...","zh":"好的，我们刚刚讨论了一个关于负责任的 vibe 编码的框架。所以我想深入探讨的是，我们正在进入……","start":3383.75,"end":3391.37},{"id":199,"text":"soon to a close, is the hype cycle. So hype is the most amazing force. I mean, I think it's one of the strongest forces in the universe, and particularly in anything that's hot, such as the two fields that I work in that are super hot at the moment and full of hype are AI and crypto. You should see my Twitter feed. That the amount of nonsense that's out there is incredible.","zh":"所以我想说的关于炒作结构的一件事是你需要认真思考的是，如果你通过社交媒体获取新闻，那么社交媒体的货币是参与度。准确性并不是社交媒体的货币。所以我甚至会继续……","start":3391.79,"end":3413.73},{"id":200,"text":"So one of the things that I would say about the anatomy of hype that you really need to think about is if you are consuming news via social media that the currency of social media is engagement. Accuracy is not the currency of social media. So I go on to even...","zh":"LinkedIn，它本应是这些平台中更专业的，却被大量影响者所淹没，他们使用 Gemini 或 GPT 来撰写吸引人的帖子，以获得参与度和点赞。而平台本身，如果你允许我这样比喻，就是被设计成奖励这类帖子的。我们最终会陷入参与度被奖励的滚雪球效应。","start":3414.61,"end":3433.59},{"id":201,"text":"LinkedIn, which is supposed to be the more professional of these, is absolutely overwhelmed with influencers posting things that they've used, Gemini or GPT, to write an engaging post so that they can get engagement and they can get likes. And the engine itself is engineered, if you excuse the pun, to reward those types of posts. And we end up with that snowball effect of engagement being rewarded.","zh":"如果你是一个能够从噪音中过滤出信号，并且能够鼓励他人关注信号而非噪音的人，这将使你处于巨大的优势之中。这使你变得非常独特。这不像社交媒体上的点赞和参与度那样迅速且容易被量化，但当你处于一对一的环境，比如面试或工作中，你将信号带到桌面上而不是噪音，这使你极具价值。","start":3434.42,"end":3459.88},{"id":202,"text":"If you are the kind of person who can filter the signal from the noise and then who can encourage others around the signal and not the noise, that puts you in a huge advantage. That makes you very distinctive. It's not as quickly and easily tangible as likes and engagements on social media, but when you're in a one-to-one environment like a job interview or if you are in a job and you are bringing that signal to the table instead of the noise, that makes you immensely valuable.","zh":"价值。因此，带着这种心态进入，带着试图从噪音中过滤出信号、试图理解当前事务中什么重要的想法，以及你如何在这些方面成为值得信赖的顾问，以及你如何真正减少噪音以帮助他人的想法，是非常有价值的。我想从一个故事开始。我可能会抢了自己的风头。我稍后会讲到这个故事。所以一个故事。","start":3461.49,"end":3490.93},{"id":203,"text":"valuable. So coming in with that mindset, coming in with the idea of trying to filter that signal from the noise, trying to understand what is important in current affairs, how you can be a trusted advisor in those things, and how you can really whittle down that noise to help someone is immensely valuable. I want to start with one story. I might be stealing my own thunder. I'll go on to it in a moment. So one story.","zh":"价值。因此，带着这种心态进入，带着试图从噪音中过滤出信号、试图理解当前事务中什么重要的想法，以及你如何在这些方面成为值得信赖的顾问，以及你如何真正减少噪音以帮助他人的想法，是非常有价值的。我想从一个故事开始。我可能会抢了自己的风头。我稍后会讲到这个故事。所以一个故事。","start":3490.83,"end":3518.7},{"id":204,"text":"Last year, when agent started becoming the key word and everybody's saying, you know, in 2025, agent will be the word of the year and the trend of the year, a company in Europe asked me to help them to implement an agent. So let me ask you a question. If a company came up to you and said, please help me implement an agent, what's the correct first question that you ask them?","zh":"去年，当'agent'开始成为关键词，大家都说2025年'agent'会是年度热词和趋势时，一家欧洲公司邀请我帮忙实施一个agent。那么让我问你们一个问题：如果一家公司来找你，说'请帮我实施一个agent'，你首先应该问他们什么问题？","start":3519.45,"end":3543.37}],"notes":["本段主要讨论了AI和加密货币领域中的炒作现象，以及如何在信息过载的环境中识别有价值的信息。讲者指出，社交媒体的货币是参与度而非准确性，因此需要具备过滤噪音、识别信号的能力。","讲者强调了在职业发展过程中，能够区分信息真伪并引导他人关注重要信息的人才具有显著优势。这种能力在一对一的环境中，如面试或工作中，尤为宝贵。","讲者通过一个实际案例说明了如何应对炒作：一家欧洲公司希望实施“agent”技术，但讲者认为首先需要明确客户的具体需求，而不是直接提供解决方案。","讲者指出，炒作周期（hype cycle）是理解技术发展的重要框架，它帮助人们识别技术的成熟度和潜在风险。在AI和加密货币等热门领域，这种框架尤为重要。","讲者提到，社交媒体平台如LinkedIn被大量用于发布由AI生成的吸引眼球的内容，这导致了参与度的奖励机制，进一步加剧了信息过载的问题。","讲者建议听众在面对信息时保持批判性思维，学会过滤噪音，识别真正有价值的信息，并在职业发展中利用这种能力建立信任和影响力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3383.75,"end":3543.37,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3383.75,"text":"Okay, so framework for responsible vibe coding we've just spoke about. So one of the things I want to get into is we're coming..."},{"start":3391.79,"text":"soon to a close, is the hype cycle. So hype is the most amazing force. I mean, I think it's one of the strongest forces in the universe, and particularly in anything that's hot, such as the two fields that I work in that are super hot at the moment and full of hype are AI and crypto. You should see my Twitter feed. That the amount of nonsense that's out there is incredible."},{"start":3414.61,"text":"So one of the things that I would say about the anatomy of hype that you really need to think about is if you are consuming news via social media that the currency of social media is engagement. Accuracy is not the currency of social media. So I go on to even..."},{"start":3434.42,"text":"LinkedIn, which is supposed to be the more professional of these, is absolutely overwhelmed with influencers posting things that they've used, Gemini or GPT, to write an engaging post so that they can get engagement and they can get likes. And the engine itself is engineered, if you excuse the pun, to reward those types of posts. And we end up with that snowball effect of engagement being rewarded."},{"start":3461.49,"text":"If you are the kind of person who can filter the signal from the noise and then who can encourage others around the signal and not the noise, that puts you in a huge advantage. That makes you very distinctive. It's not as quickly and easily tangible as likes and engagements on social media, but when you're in a one-to-one environment like a job interview or if you are in a job and you are bringing that signal to the table instead of the noise, that makes you immensely valuable."},{"start":3490.83,"text":"valuable. So coming in with that mindset, coming in with the idea of trying to filter that signal from the noise, trying to understand what is important in current affairs, how you can be a trusted advisor in those things, and how you can really whittle down that noise to help someone is immensely valuable. I want to start with one story. I might be stealing my own thunder. I'll go on to it in a moment. So one story."},{"start":3519.45,"text":"Last year, when agent started becoming the key word and everybody's saying, you know, in 2025, agent will be the word of the year and the trend of the year, a company in Europe asked me to help them to implement an agent. So let me ask you a question. If a company came up to you and said, please help me implement an agent, what's the correct first question that you ask them?"}],"speech_gaps":[],"frame":"../frames/v056/021.webp","frame_time":3395.75},{"title":"AI与代理AI的区别","segments":[{"id":205,"text":"Okay, that's good. What is an agent for you? I'd actually have a more fundamental question. Yep. What do you want to do? Okay, even more fundamental. My question was, why? Why? You know, and it's like, peel that apart. Like, I spoke with the CEO, and he's like, oh, yeah.","zh":"好的，这很好。对你来说，什么是代理？我实际上有一个更根本的问题。是的。你想做什么？好吧，甚至更根本。我的问题是，为什么？为什么？你知道的，就像把那层剥开。比如，我跟CEO谈过，他说，哦，是的。","start":3548.78,"end":3566.31},{"id":206,"text":"And everybody's telling me that I'm going to save business costs and I'm going to be able to do these amazing things. And yeah, my business is going to get better because I have agents. And I'm like, well, who told you that? It was like, oh, yeah, I read this thing on LinkedIn and I saw this thing on Twitter. And we ended up having that conversation. And it was a difficult conversation because I had to keep peeling apart. And I started asking the questions that you two just mentioned as well until we really got to the essence of what he wanted to do. And what he really wanted to do was...","zh":"每个人都告诉我，我将节省企业成本，并且能够做到这些惊人的事情。是的，我的业务会因为有了代理而变得更好。我说，好吧，是谁告诉你的？他说，哦，是的，我在LinkedIn上读过一篇文章，在Twitter上看到过一些内容。我们最终进行了那次谈话。那是一次困难的谈话，因为我必须不断剥开问题。我开始问你们刚才提到的问题，直到我们真正弄清楚了他想要做什么。而他真正想要做的……","start":3566.99,"end":3596.33},{"id":207,"text":"and we take all domain knowledge about AI aside, was that he wanted to make his salespeople more efficient. And I was like, okay, you want to make your salespeople more efficient. Nowhere in that sentence do I hear the word AI, and nowhere in that sentence do I hear the word agent. So now as a trusted advisor, let me see what I can do to help your salespeople become more efficient. And I'm not going to be an AI shill or an agent shill. I just want to see what do we do to make your salespeople more efficient.","zh":"撇开所有关于AI的知识，他想要让他的销售人员更加高效。我说，好的，你想让你的销售人员更加高效。这句话中我根本没有听到‘AI’这个词，也没有听到‘代理’这个词。现在作为一位值得信赖的顾问，让我看看我能做些什么来帮助你的销售人员变得更加高效。我不会成为AI的推销员或代理的推销员。我只是想知道我们该怎么做才能让销售人员更加高效。","start":3596.33,"end":3622.75},{"id":208,"text":"If anybody here has ever worked in sales, one of the things you realize what a good salesperson has to do is their homework.","zh":"如果在座有人曾经从事过销售工作，你会发现一个好销售人员必须做的事情是他们的准备工作。","start":3623.37,"end":3629.89},{"id":209,"text":"Right. You know, before you have a sales call with somebody, before you have a sales meeting with somebody, you need to check their background. You need to check the company. You need to check the needs of the company. You know, you see it sometimes in the movie that like, oh, such and such plays golf. So I'll take them to play golf. It's not really that cliched, but there is a lot of background that needs to be done. So I spoke with him and I spoke with their leading salespeople and found out that, you know, and I asked the salespeople, what do you hate most about your job?","zh":"对的。你知道，在你和某人进行销售电话或销售会议之前，你需要了解他们的背景。你需要了解他们的公司。你需要了解公司的需求。你有时会在电影中看到这样的场景，比如，某人喜欢打高尔夫球，于是你就带他去打高尔夫球。这并不是特别俗套，但确实有很多背景工作需要完成。我跟他谈过，也和他们的主要销售人员谈过，了解到，你知道的，我还问了销售人员，你们最讨厌自己工作的哪一点？","start":3630.66,"end":3656.64},{"id":210,"text":"And they were like, well, I hate the fact that I have to waste all my time going to visit these company websites, going to look up people on LinkedIn. And every website is structured differently, right? So I can't just have a path through a website that I can follow. I have to take on all this cognitive load. And they were spending about 80% of their time.","zh":"他们说，我讨厌必须花掉所有时间去访问这些公司网站，去LinkedIn上查找人员。每个网站的结构都不一样，对吧？所以我不能遵循一个固定的网站路径。我必须承担所有这些认知负担。他们大约有80%的时间都花在研究上。","start":3657.35,"end":3679.33},{"id":211,"text":"researching, and about 20% of their time selling. Oh, and by the way, most salespeople don't get paid very much. They have to make it up by commission. So they're only spending 20% of their time doing the thing that gets them commissioned directly. So we're like, okay, well, here's something now where we can start thinking about making them more efficient by cutting into that. So we set a goal as like to make salespeople 20% more efficient. And then we could start rolling out the ideas of AI. And then we could start rolling out the ideas of agentic AI. And a quick question, what's the difference?","zh":"研究，而只有20%的时间用于销售。顺便说一句，大多数销售人员收入并不高。他们必须通过佣金来弥补。因此，他们只有20%的时间在做能直接带来佣金的事情。所以我们认为，现在我们可以开始思考如何通过减少这部分时间来提高他们的效率。于是我们设定了一个目标，即让销售人员提高20%的效率。然后我们可以开始推出AI的想法。然后我们可以开始推出代理AI的想法。一个快速的问题，AI和代理AI有什么区别？","start":3679.87,"end":3709.07},{"id":212,"text":"between AI and agentic AI. Okay. So, yeah. Okay.","zh":"AI和代理AI之间的区别。好的。是的。好的。","start":3709.87,"end":3723.84}],"notes":["本段讨论了销售工作的效率问题，指出销售人员大部分时间用于研究客户信息，而只有20%的时间用于实际销售。这为引入AI和代理AI提供了动机，即通过减少认知负担来提高效率。","讲者提到销售人员的收入主要依赖于佣金，因此他们需要尽可能多地进行销售活动，而研究客户信息的时间占比过高，这为后续讨论AI和代理AI的应用提供了现实背景。","讲者提出将目标设定为提高销售人员20%的效率，并计划逐步引入AI和代理AI的概念。这表明AI和代理AI的应用是分阶段进行的，先通过AI优化研究过程，再通过代理AI进一步提升效率。","讲者提出了一个关键问题：AI和代理AI之间的区别。这表明课程的重点在于区分这两个概念，并探讨它们在实际应用中的不同作用。","讲者提到销售人员需要花费大量时间在不同结构的网站上查找信息，这说明了当前销售流程中的信息处理瓶颈，为AI和代理AI的应用提供了具体场景。","讲者强调销售人员的效率提升是通过减少认知负荷实现的，这表明AI和代理AI的核心目标是优化信息处理流程，而不是直接替代销售人员。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3548.78,"end":3723.84,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3548.78,"text":"Okay, that's good. What is an agent for you? I'd actually have a more fundamental question. Yep. What do you want to do? Okay, even more fundamental. My question was, why? Why? You know, and it's like, peel that apart. Like, I spoke with the CEO, and he's like, oh, yeah."},{"start":3566.99,"text":"And everybody's telling me that I'm going to save business costs and I'm going to be able to do these amazing things. And yeah, my business is going to get better because I have agents. And I'm like, well, who told you that? It was like, oh, yeah, I read this thing on LinkedIn and I saw this thing on Twitter. And we ended up having that conversation. And it was a difficult conversation because I had to keep peeling apart. And I started asking the questions that you two just mentioned as well until we really got to the essence of what he wanted to do. And what he really wanted to do was..."},{"start":3596.33,"text":"and we take all domain knowledge about AI aside, was that he wanted to make his salespeople more efficient. And I was like, okay, you want to make your salespeople more efficient. Nowhere in that sentence do I hear the word AI, and nowhere in that sentence do I hear the word agent. So now as a trusted advisor, let me see what I can do to help your salespeople become more efficient. And I'm not going to be an AI shill or an agent shill. I just want to see what do we do to make your salespeople more efficient."},{"start":3623.37,"text":"If anybody here has ever worked in sales, one of the things you realize what a good salesperson has to do is their homework."},{"start":3630.66,"text":"Right. You know, before you have a sales call with somebody, before you have a sales meeting with somebody, you need to check their background. You need to check the company. You need to check the needs of the company. You know, you see it sometimes in the movie that like, oh, such and such plays golf. So I'll take them to play golf. It's not really that cliched, but there is a lot of background that needs to be done. So I spoke with him and I spoke with their leading salespeople and found out that, you know, and I asked the salespeople, what do you hate most about your job?"},{"start":3657.35,"text":"And they were like, well, I hate the fact that I have to waste all my time going to visit these company websites, going to look up people on LinkedIn. And every website is structured differently, right? So I can't just have a path through a website that I can follow. I have to take on all this cognitive load. And they were spending about 80% of their time."},{"start":3679.87,"text":"researching, and about 20% of their time selling. Oh, and by the way, most salespeople don't get paid very much. They have to make it up by commission. So they're only spending 20% of their time doing the thing that gets them commissioned directly. So we're like, okay, well, here's something now where we can start thinking about making them more efficient by cutting into that. So we set a goal as like to make salespeople 20% more efficient. And then we could start rolling out the ideas of AI. And then we could start rolling out the ideas of agentic AI. And a quick question, what's the difference?"},{"start":3709.87,"text":"between AI and agentic AI. Okay. So, yeah. Okay."}],"speech_gaps":[],"frame":"../frames/v056/022.webp","frame_time":3560.78},{"title":"构建代理的四个步骤与实际应用","segments":[{"id":213,"text":"Yep, excellent. So agentic AI is really about breaking it down into steps, which is good engineering to begin with, right? But in agentic AI in particular, I find there's a set pattern of steps that if you follow them, you end up with the whole idea of an agent. The first of these steps is to understand intent. You know, we tend to use the words AI, artificial intelligence, a lot, but what large language models are really, really good at is also understanding. So if the first step of anything that you want to do is to understand intent,","zh":"是的，很好。所以代理型AI实际上是将问题分解成步骤，这本身就是良好的工程实践，对吧？但在代理型AI中，我发现有一个特定的步骤模式，如果你遵循这些步骤，最终就会形成代理的概念。这些步骤中的第一步是理解意图。你知道的，我们经常使用AI、人工智能这样的词汇，但大型语言模型真正非常擅长的是理解。因此，如果你想完成任何任务的第一步就是理解意图，","start":3727.68,"end":3756.84},{"id":214,"text":"And you can use an LLM to do that, to kind of think about, this is the task that I need to do, this is how I'm going to do it, here's the intent. I want to meet Bob Smith and sell widgets to Bob Smith, and this is what I know about Bob Smith, help me with that intent. The second part, then, is planning.","zh":"你可以使用LLM来完成这一点，让其思考：我需要完成的任务是什么，我将如何完成它，这就是我的意图。我想见Bob Smith并把商品卖给他，这是我所知道的关于Bob Smith的信息，帮助我实现这个意图。第二步是规划。","start":3757.55,"end":3776.71},{"id":215,"text":"So you declare to an agent what tools are available to it, browsing the web, searching the web, all of these kind of things. And once you understand your clear intent to be able to go to the step of planning and using those tools for planning, and an LLM is very, very good at then breaking that down into the steps that it needs to do to execute a plan. Search the web with these keywords. Browse this website and find these links. Those types of things.","zh":"因此，你向代理声明它可用的工具，例如浏览网页、搜索网页等。一旦你明确了自己的意图，就可以进入规划步骤，并使用这些工具进行规划，而LLM非常擅长将这些分解成执行计划所需的步骤。例如，使用这些关键词搜索网页，浏览这个网站并找到这些链接等。","start":3777.36,"end":3801.86},{"id":216,"text":"Once it's then figured out that plan, then it uses the tools to get to a result. And then once it has the result, the fourth and final step is to reflect on that result. And looking at the result and going back to the intent, did we meet the intent? Yes or no. If we didn't, then go back to that loop.","zh":"一旦它制定了计划，就会使用这些工具来获得结果。然后，一旦有了结果，第四也是最后一步是反思这个结果。查看结果并回到最初的意图，我们是否满足了意图？是还是否。如果没有满足，就回到这个循环中。","start":3802.44,"end":3816.62},{"id":217,"text":"All agent is really broken down into those things. And if you think about breaking any problem down into those four steps, that's when you start building an agent. And that was part of being a trusted advisor instead of coming in and waving hands and saying, agent this, agent that, look at this toolkit, save 20%. It's really to break it down into those steps. So we did. We broke it down into those steps. We built a pilot for the salespeople of this company.","zh":"所有代理实际上都是由这些步骤构成的。如果你考虑将任何问题分解成这四个步骤，你就会开始构建一个代理。这也是成为值得信赖的顾问而不是一上来就挥舞双手说‘代理这个，代理那个’，展示这个工具包，节省20%的关键所在。实际上，就是将问题分解成这些步骤。我们就是这样做的。我们将问题分解成这些步骤，并为这家公司的销售人员构建了一个试点项目。","start":3817.31,"end":3840.21},{"id":218,"text":"And they ended up saving between 10% and 15% of their time, of their wasted time. The doctrine of unintended consequences hit, though, after this. And the unintended consequence was the salespeople were much happier because the average salesperson was making","zh":"他们最终节省了大约10%到15%的浪费时间。然而，这种非预期后果的理论随后显现了出来。非预期的后果是销售人员变得更加开心，因为平均销售人员在一周内能多卖出几个百分点的产品。他们在一周内赚取了更多的钱，工作也变得稍微不那么痛苦了。","start":3840.92,"end":3857.66},{"id":219,"text":"you know, several percentage points more sales in a given week. They were earning more money in a given week and their job just became a little bit less miserable. And then refinement to that agentic process to be able to do all of that research for them and to help give them a brief in a few minutes instead of a few hours to help them with the sales process ended up being like a win-win-win all around. But if you go in being hype-led and like, oh, build an agent for the thing without really peeling apart the business requirements, the why.","zh":"然后，对这种代理流程进行优化，使其能够为他们完成所有研究，并在几分钟而不是几小时内提供简要指导，帮助他们进行销售流程，最终成为一种三方共赢的局面。但如果你只是被炒作所引导，认为‘哦，为某件事构建一个代理’，而没有真正拆解业务需求，即‘为什么’、‘是什么’、‘如何做’以及所有这些相关问题，那么这家公司最终就会在炒作中迷失。","start":3858.11,"end":3885.99},{"id":220,"text":"the what, the how, and all of these kind of things, we ended up like, you know, this company just would have been lost in hype. You've probably seen reports recently. I think McKinsey put one out last week showing that about 85% of AI projects at companies fail.","zh":"你可能已经看到最近的报告。我认为麦肯锡上周发布了一份报告，显示大约85%的公司人工智能项目最终失败。","start":3886.62,"end":3900.18}],"notes":["本段讲解了构建代理（agent）的四个步骤：理解意图、规划、执行和反思。这些步骤是构建代理的基础，强调了在实际应用中需要系统性地分解问题。","理解意图是第一步，涉及明确任务的目标和需求。大型语言模型（LLM）在理解意图方面表现出色，能够帮助代理明确任务。","第二步是规划，涉及声明可用的工具，如网络浏览和搜索。LLM能够将这些工具分解为具体的执行步骤。","第三步是执行，使用工具完成任务并获得结果。第四步是反思，评估结果是否符合最初意图，若不符合则返回循环。","实际案例中，通过构建代理帮助销售人员节省了10%到15%的时间，并提升了销售业绩和员工满意度，体现了代理系统的有效性。","最后提到，如果仅依赖炒作而忽视实际业务需求，AI项目可能会失败。麦肯锡的报告指出，约85%的AI项目在企业中失败，强调了深入分析业务需求的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3727.68,"end":3900.18,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3727.68,"text":"Yep, excellent. So agentic AI is really about breaking it down into steps, which is good engineering to begin with, right? But in agentic AI in particular, I find there's a set pattern of steps that if you follow them, you end up with the whole idea of an agent. The first of these steps is to understand intent. You know, we tend to use the words AI, artificial intelligence, a lot, but what large language models are really, really good at is also understanding. So if the first step of anything that you want to do is to understand intent,"},{"start":3757.55,"text":"And you can use an LLM to do that, to kind of think about, this is the task that I need to do, this is how I'm going to do it, here's the intent. I want to meet Bob Smith and sell widgets to Bob Smith, and this is what I know about Bob Smith, help me with that intent. The second part, then, is planning."},{"start":3777.36,"text":"So you declare to an agent what tools are available to it, browsing the web, searching the web, all of these kind of things. And once you understand your clear intent to be able to go to the step of planning and using those tools for planning, and an LLM is very, very good at then breaking that down into the steps that it needs to do to execute a plan. Search the web with these keywords. Browse this website and find these links. Those types of things."},{"start":3802.44,"text":"Once it's then figured out that plan, then it uses the tools to get to a result. And then once it has the result, the fourth and final step is to reflect on that result. And looking at the result and going back to the intent, did we meet the intent? Yes or no. If we didn't, then go back to that loop."},{"start":3817.31,"text":"All agent is really broken down into those things. And if you think about breaking any problem down into those four steps, that's when you start building an agent. And that was part of being a trusted advisor instead of coming in and waving hands and saying, agent this, agent that, look at this toolkit, save 20%. It's really to break it down into those steps. So we did. We broke it down into those steps. We built a pilot for the salespeople of this company."},{"start":3840.92,"text":"And they ended up saving between 10% and 15% of their time, of their wasted time. The doctrine of unintended consequences hit, though, after this. And the unintended consequence was the salespeople were much happier because the average salesperson was making"},{"start":3858.11,"text":"you know, several percentage points more sales in a given week. They were earning more money in a given week and their job just became a little bit less miserable. And then refinement to that agentic process to be able to do all of that research for them and to help give them a brief in a few minutes instead of a few hours to help them with the sales process ended up being like a win-win-win all around. But if you go in being hype-led and like, oh, build an agent for the thing without really peeling apart the business requirements, the why."},{"start":3886.62,"text":"the what, the how, and all of these kind of things, we ended up like, you know, this company just would have been lost in hype. You've probably seen reports recently. I think McKinsey put one out last week showing that about 85% of AI projects at companies fail."}],"speech_gaps":[],"frame":"../frames/v056/023.webp","frame_time":3739.68},{"title":"AI领域的职业建议：警惕炒作与专注技术本质","segments":[{"id":221,"text":"And the main reason for that is that they're not well scoped, people are jumping on the hype bandwagon, and they're not really understanding their way through the problem. And I think the big brains in this room and the network that you folks have, a really key component of being able to succeed is to understand your way through that problem. So that was a hype example around Agentic that I was thankfully able to help this company through.","zh":"主要原因在于这些项目没有被很好地界定，人们纷纷追逐炒作的浪潮，而并没有真正理解如何解决这些问题。我认为在座的各位大脑和你们所拥有的网络，能够成功的一个关键组成部分是理解如何解决这些问题。因此，我之前提到的关于代理（Agentic）的炒作例子，我有幸能够帮助这家公司度过难关。","start":3901.47,"end":3925.13},{"id":222,"text":"Other recent hype examples, you've probably seen the software engineering is dead. My personal favorite, Hollywood is dead, or AGI by year end.","zh":"其他近期的炒作例子，你们可能已经看到过，比如‘软件工程已经死了’。我个人最喜欢的是‘好莱坞已经死了’，或者‘年底实现AGI’。","start":3925.96,"end":3933.68},{"id":223,"text":"I was in Saudi Arabia this time last year at a thing called the FII. And it was a dinner at the FII. And I sat beside the CEO of a company who I'm not going to name. But this was a CEO of a generative AI company. And at that time, he was showing everybody around the table this thing that he'd done where it was text to video. And he could put in a text prompt and get video out of the prompt and get about six seconds worth of video out of it. A year ago, that was...","zh":"去年这个时候，我正在沙特阿拉伯参加一个名为FII的活动。那是一场在FII举行的晚宴。我坐在一位我不便透露名字的公司的CEO旁边。这位CEO是一家生成式AI公司的负责人。当时，他向桌上的所有人展示他所做的一项技术，即文本转视频。他只需输入一个文本提示，就能得到一段视频输出，大约六秒钟的视频。","start":3934.73,"end":3961.03},{"id":224,"text":"I beg your pardon, two years ago. Two years ago, that was hot stuff. Nowadays, obviously, it's quite passe. Anybody can do it. But he made a comment at that table, and it was a lot of like...","zh":"请原谅，是两年前。两年前，这项技术还很热门。如今，显然已经过时了。任何人都能做到这一点。但他在那桌人面前发表了一个评论，当时在场的很多媒体人士都表示，到明年这个时候，我们只需一个提示就能生成90分钟的视频，所以好莱坞就该死了，你知道吧。","start":3961.48,"end":3970.94},{"id":225,"text":"media executives at that table is like by this time next year from a single prompt we'll be able to do 90 minutes of video and so bye-bye Hollywood you know like so the whole Hollywood is dead meme I think came out of that first of all we can't do 90 minutes even two years later from a prompt and even if you did what kind of prompt would be able to tell you a full story of a movie right so","zh":"我认为‘好莱坞已经死了’这个梗最初就来自那次聚会。首先，即使到现在，我们还无法从一个提示中生成90分钟的视频。即使你真的能做到，什么样的提示才能讲述一部完整电影的故事呢？","start":3971.81,"end":3992.57},{"id":226,"text":"This type of hype leads to engagement. This type of hype leads to attention. But my encouragement to you is to peel that apart. Look for the signal. Ask the why question. Ask the what question and move on from there. So becoming that trusted advisor. World's drowning in hype. How do you do it? Look at the trends, evaluate them objectively. Look at the genuine opportunities that are out there.","zh":"这种类型的炒作会带来参与度，也会带来关注。但我的建议是，要剥开这些表面现象。寻找真正的信号。提出‘为什么’的问题，提出‘是什么’的问题，然后继续前进。成为那个值得信赖的顾问。世界正被炒作所淹没。你该如何应对？观察趋势，客观地评估它们。寻找真正存在的机会。","start":3993.55,"end":4019.32},{"id":227,"text":"There are fashionable distractions. I don't know what the next one is going to be, but there are these distractions that are out there that will get you lots of engagement on social media. Ignore them and ignore the people that are leaning into them. And then really lean into your skills about explaining technical reality to leadership.","zh":"存在一些时尚的干扰因素。我不知道下一个会是什么，但这些干扰因素确实存在，它们能在社交媒体上获得大量关注。忽略它们，也忽略那些沉迷于这些因素的人。然后，真正专注于你解释技术现实给领导层的技能。","start":4020.33,"end":4038.15},{"id":228,"text":"One skill that one person coached me in once that I thought was really interesting, because it sounded wrong but it ended up being right, was whenever you see something like this, try to figure out how to make it as mundane as possible.","zh":"有一项技能，有一个人曾经教过我，我觉得非常有趣，因为它听起来似乎不对，但最终证明是正确的。那就是，当你看到类似这样的事情时，试着想办法让它尽可能地平凡。","start":4039.33,"end":4051.41},{"id":229,"text":"When you can figure out how to make it as mundane as possible, then you really begin to build the grounding for being able to explain it in detail in ways that people need to understand, right? Like if you go and you look at, you know, I think Gemini 3 was released today, but there were leaks earlier this week, and one person kind of leaked that I built a Minecraft clone and a prompt, you know, that kind of stuff. This is the opposite of mundane.","zh":"当你能够想办法让它尽可能地平凡时，你才真正开始建立起能够以人们需要理解的方式详细解释它的基础，对吧？比如，如果你去查看，我认为 Gemini 3 今天发布了，但本周早些时候已经有泄露消息，有一个人泄露了我构建了一个 Minecraft 克隆版本和一个提示，这种东西就是与平凡相反的。","start":4052.14,"end":4077.74}],"notes":["本段讨论了AI领域中炒作现象的典型例子，如‘好莱坞已死’的言论。讲者指出，这种炒作往往夸大了技术能力，例如声称通过单个提示可以生成90分钟的视频，而实际上目前技术还无法实现。这提醒听众要区分炒作与现实，避免被误导。","讲者强调，面对技术炒作时，应保持批判性思维，通过提问‘为什么’和‘是什么’来辨别信号。这有助于识别真正有价值的技术趋势，而不是被短暂的热点所吸引。","讲者提到，技术炒作往往带来大量关注，但真正的职业发展应建立在对技术本质的理解上。这包括能够向领导层清晰解释技术现实的能力，而不是追逐社交媒体上的流行话题。","讲者分享了一个技巧，即尝试将技术概念变得‘平凡’，这有助于深入理解并有效传达给他人。例如，将复杂的AI模型简化为日常应用，如Minecraft克隆游戏，这与‘平凡’的概念相悖，说明了技术炒作的夸张性。","讲者指出，技术炒作往往伴随着短暂的热度，但真正的技术突破需要时间和深入研究。例如，生成视频技术在两年前是热点，但如今已变得普通，说明技术发展具有周期性。","讲者鼓励听众专注于技术本质，而不是被炒作所吸引。这包括识别真正有价值的技术趋势，忽略短暂的热点，并通过深入理解技术来建立专业信任。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3901.47,"end":4077.74,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":3901.47,"text":"And the main reason for that is that they're not well scoped, people are jumping on the hype bandwagon, and they're not really understanding their way through the problem. And I think the big brains in this room and the network that you folks have, a really key component of being able to succeed is to understand your way through that problem. So that was a hype example around Agentic that I was thankfully able to help this company through."},{"start":3925.96,"text":"Other recent hype examples, you've probably seen the software engineering is dead. My personal favorite, Hollywood is dead, or AGI by year end."},{"start":3934.73,"text":"I was in Saudi Arabia this time last year at a thing called the FII. And it was a dinner at the FII. And I sat beside the CEO of a company who I'm not going to name. But this was a CEO of a generative AI company. And at that time, he was showing everybody around the table this thing that he'd done where it was text to video. And he could put in a text prompt and get video out of the prompt and get about six seconds worth of video out of it. A year ago, that was..."},{"start":3961.48,"text":"I beg your pardon, two years ago. Two years ago, that was hot stuff. Nowadays, obviously, it's quite passe. Anybody can do it. But he made a comment at that table, and it was a lot of like..."},{"start":3971.81,"text":"media executives at that table is like by this time next year from a single prompt we'll be able to do 90 minutes of video and so bye-bye Hollywood you know like so the whole Hollywood is dead meme I think came out of that first of all we can't do 90 minutes even two years later from a prompt and even if you did what kind of prompt would be able to tell you a full story of a movie right so"},{"start":3993.55,"text":"This type of hype leads to engagement. This type of hype leads to attention. But my encouragement to you is to peel that apart. Look for the signal. Ask the why question. Ask the what question and move on from there. So becoming that trusted advisor. World's drowning in hype. How do you do it? Look at the trends, evaluate them objectively. Look at the genuine opportunities that are out there."},{"start":4020.33,"text":"There are fashionable distractions. I don't know what the next one is going to be, but there are these distractions that are out there that will get you lots of engagement on social media. Ignore them and ignore the people that are leaning into them. And then really lean into your skills about explaining technical reality to leadership."},{"start":4039.33,"text":"One skill that one person coached me in once that I thought was really interesting, because it sounded wrong but it ended up being right, was whenever you see something like this, try to figure out how to make it as mundane as possible."},{"start":4052.14,"text":"When you can figure out how to make it as mundane as possible, then you really begin to build the grounding for being able to explain it in detail in ways that people need to understand, right? Like if you go and you look at, you know, I think Gemini 3 was released today, but there were leaks earlier this week, and one person kind of leaked that I built a Minecraft clone and a prompt, you know, that kind of stuff. This is the opposite of mundane."}],"speech_gaps":[],"frame":"../frames/v056/024.webp","frame_time":3913.47},{"title":"深度学习中的职业建议与技术洞察","segments":[{"id":230,"text":"This was massively hyping the thing, massively showing, and of course they didn't. They built a flashy demo. They didn't really build a Minecraft clone. But the idea here is if you can peel that apart to like, okay, how do I think about what are the mundane things that are happening here? The one that I've been working with a lot recently is video. So text-to-video prompts, as I've mentioned, instead of the magical, you can do whatever you want, all nice and fluffy, Hollywood is dead.","zh":"这极大地夸大了这件事，极大地展示了，当然他们并没有做到。他们建立了一个花哨的演示。他们并没有真正建立一个Minecraft克隆版本。但这里的要点是，如果你能将这些剥离出来，思考一下，这里发生的是哪些平凡的事情？我最近一直在处理的一个就是视频。因此，如我之前提到的，文本到视频提示，与其说是魔法般的，你可以随心所欲地做任何事情，一切都很轻松，好莱坞已经死了。","start":4078.34,"end":4105.08},{"id":231,"text":"What is the mundane element of doing text-to-video? The mundane element of doing text-to-video is that when you train a model to create video from a text prompt, what it is doing is it's creating a number of successive frames, and each of those successive frames is going to be slightly different from the frame before.","zh":"文本到视频的平凡之处是什么？文本到视频的平凡之处在于，当你训练一个模型从文本提示生成视频时，它所做的就是生成一系列连续的帧，而每一帧都会与前一帧略有不同。","start":4105.76,"end":4122.2},{"id":232,"text":"And you've trained a model by looking at video to say, well, if in frame one the person's hand's like this, in frame two it's like that, then you can predict it moves this way if there's a matching prompt. And suddenly it's become a little bit more mundane, but suddenly they begin to understand it. And then the people who are experts in that specific field, not the technical side of it, are now the ones that will actually be able to come up and do brilliant things with it. So that hype navigation strategy, filter actively, go deep on the fundamentals.","zh":"你通过观察视频来训练模型，可以说，如果在第一帧中，人的手是这样的，在第二帧中是那样的，那么如果你有一个匹配的提示，就可以预测它会以这种方式移动。突然之间，这变得稍微平凡一些，但突然之间他们开始理解了。然后，那些在该特定领域内有专业知识的人，而不是技术方面的人，现在将能够真正利用它做出出色的事情。因此，这种炒作的导航策略，主动过滤，深入基础。","start":4122.99,"end":4152.1},{"id":233,"text":"get your slides to work and then of course keep your finger on the pulse","zh":"让你的幻灯片发挥作用，然后当然要保持对脉搏的把握。","start":4152.96,"end":4155.94},{"id":234,"text":"The hardest part of that, I think, is the third one, is really keeping your finger on the pulse. And that's when you have to wade into those cesspits of people like just farming engagement and really try to figure out the signal from the noise there. But I think it's really important for you to be able to do that, to be connected, to understand that. Reading papers is all very good. The signal-to-noise ratio, I think, in reading papers is a lot better. But to understand the landscape that the people that you are advising, they are the ones who are wading in the cesspits of Twitter and X and LinkedIn. And there's nothing wrong with those people.","zh":"我认为最难的部分是第三点，即真正保持对脉搏的把握。这需要你深入那些充斥着人们只为获取关注的泥潭，努力从噪音中找出信号。但我认为你能够做到这一点非常重要，要保持联系，要理解这一点。阅读论文是非常好的，我认为在阅读论文时，信号与噪音的比例要好得多。但要理解你所建议的人所处的环境，他们就是那些在Twitter、X和LinkedIn的泥潭中摸索的人。这些人并没有什么问题。","start":4156.41,"end":4185.75},{"id":235,"text":"platforms in and of themselves, but the stuff that's posted on those platforms. So overall landscape, it is ripe with opportunity, absolutely ripe with opportunity. So I would encourage you, as Andrew did, to continue learning, to continue digging into what you can do, and to continue building. But there are risks ahead, right? Anybody remember the movie Titanic?","zh":"平台本身并不是重点，而是平台上发布的内容。因此，整体的局势充满了机会，绝对充满了机会。因此，我鼓励你们，就像安德鲁所做的那样，继续学习，继续探索你能做什么，并继续构建。但前方有风险，对吧？还记得电影《泰坦尼克号》吗？","start":4185.74,"end":4211.49},{"id":236,"text":"Remember the famous phrase in that? Iceberg right ahead. But immediately before that, there's a scene in Titanic. If we weren't being filmed, I would show it, but I can't for copyright reasons, where the two guys up in the crow's nests are kind of like freezing and talking. And like the crow's nest at the top of the ship is where the spotters would be to spot any icebergs in front. And go back and watch the movie again. You'll see the conversation between these two guys is that all they're talking about is how cold they are.","zh":"还记得那部电影中的那句著名台词吗？‘前方有冰山！’但在那之前，电影《泰坦尼克号》中有一个场景，如果我不在拍摄的话，我会展示给你们看，但由于版权原因，我不能这么做，其中两个在瞭望台上的人有点冻僵了，还在交谈。瞭望台位于船的顶部，是瞭望员用来观察前方是否有冰山的地方。回去再看一遍电影，你会看到这两个家伙之间的对话，他们谈论的唯一事情就是自己有多冷。","start":4212.74,"end":4238.96}],"notes":["本段主要讨论了在AI领域中如何区分技术炒作与实际应用，强调了深入理解基础概念的重要性。讲者提到，视频生成技术虽然看似神奇，但其核心在于连续帧之间的细微变化，这需要对基础原理有深刻理解。","讲者指出，技术炒作往往掩盖了技术的实质，例如视频生成模型并非像宣传的那样可以实现任何想象中的效果，而是通过学习视频数据中的帧间变化规律来生成连续画面。","讲者进一步强调，真正能够利用这些技术的人是那些在特定领域有深入理解的专家，而不是仅仅依赖技术本身的人。这表明，技术的真正价值在于其应用和理解，而非表面的炒作。","讲者提到，保持对行业动态的敏感度非常重要，这包括关注社交媒体和专业平台上的信息，从中提取有价值的内容。这表明，技术发展不仅依赖于学术研究，也依赖于对实际应用环境的了解。","讲者以电影《泰坦尼克号》中的场景为例，强调了对潜在风险的警觉。这表明，在技术发展过程中，需要保持对潜在问题的敏感度，避免盲目乐观。","最后，讲者鼓励继续学习和探索，同时提醒注意潜在的风险。这表明，技术发展需要持续的努力和谨慎的态度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4078.34,"end":4238.96,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4078.34,"text":"This was massively hyping the thing, massively showing, and of course they didn't. They built a flashy demo. They didn't really build a Minecraft clone. But the idea here is if you can peel that apart to like, okay, how do I think about what are the mundane things that are happening here? The one that I've been working with a lot recently is video. So text-to-video prompts, as I've mentioned, instead of the magical, you can do whatever you want, all nice and fluffy, Hollywood is dead."},{"start":4105.76,"text":"What is the mundane element of doing text-to-video? The mundane element of doing text-to-video is that when you train a model to create video from a text prompt, what it is doing is it's creating a number of successive frames, and each of those successive frames is going to be slightly different from the frame before."},{"start":4122.99,"text":"And you've trained a model by looking at video to say, well, if in frame one the person's hand's like this, in frame two it's like that, then you can predict it moves this way if there's a matching prompt. And suddenly it's become a little bit more mundane, but suddenly they begin to understand it. And then the people who are experts in that specific field, not the technical side of it, are now the ones that will actually be able to come up and do brilliant things with it. So that hype navigation strategy, filter actively, go deep on the fundamentals."},{"start":4152.96,"text":"get your slides to work and then of course keep your finger on the pulse"},{"start":4156.41,"text":"The hardest part of that, I think, is the third one, is really keeping your finger on the pulse. And that's when you have to wade into those cesspits of people like just farming engagement and really try to figure out the signal from the noise there. But I think it's really important for you to be able to do that, to be connected, to understand that. Reading papers is all very good. The signal-to-noise ratio, I think, in reading papers is a lot better. But to understand the landscape that the people that you are advising, they are the ones who are wading in the cesspits of Twitter and X and LinkedIn. And there's nothing wrong with those people."},{"start":4185.74,"text":"platforms in and of themselves, but the stuff that's posted on those platforms. So overall landscape, it is ripe with opportunity, absolutely ripe with opportunity. So I would encourage you, as Andrew did, to continue learning, to continue digging into what you can do, and to continue building. But there are risks ahead, right? Anybody remember the movie Titanic?"},{"start":4212.74,"text":"Remember the famous phrase in that? Iceberg right ahead. But immediately before that, there's a scene in Titanic. If we weren't being filmed, I would show it, but I can't for copyright reasons, where the two guys up in the crow's nests are kind of like freezing and talking. And like the crow's nest at the top of the ship is where the spotters would be to spot any icebergs in front. And go back and watch the movie again. You'll see the conversation between these two guys is that all they're talking about is how cold they are."}],"speech_gaps":[],"frame":"../frames/v056/025.webp","frame_time":4090.34},{"title":"AI行业的泡沫与机遇","segments":[{"id":237,"text":"And then it cuts away to the crew of the ship who are like, wait, aren't they supposed to have binoculars? And then the crew is like, oh, we left the binoculars behind in port. That framing the whole idea was like they were so arrogant in being able to move forward that they didn't want to look out for any particular risks. And even though they had people whose job it was to look out for risks, they didn't properly equip or train them. And that, to me, is a really good metaphor for where the AI industry is today. There are risks in front of us.","zh":"然后画面切到船上的船员，他们说：等等，他们不是应该有望远镜吗？接着船员们说：哦，我们把望远镜忘在港口了。这种叙事方式暗示了他们过于傲慢，认为自己能够前进，以至于不愿关注任何特定的风险。即使他们有专门负责关注风险的人，他们也没有正确地装备或培训这些人。对我来说，这真是一个很好的隐喻，说明了当今AI行业所处的境地。我们面前存在风险。","start":4239.77,"end":4268.13},{"id":238,"text":"those risks, the B word, the bubble word, you're probably reading in the news, are there. To me, though, the opportunity and the things to think about in terms of a bubble are, most of you probably don't remember the dot-com bubble of the 2000s, but if you think about the dot-com bubble, that was the biggest bubble in history. It burst, but we're still here.","zh":"这些风险，也就是所谓的‘泡沫’，你可能在新闻中读到过。对我来说，尽管如此，关于泡沫的机遇和需要思考的方面是，你们大多数人可能不记得2000年代的互联网泡沫，但如果思考一下互联网泡沫，那确实是历史上最大的泡沫。它破裂了，但我们仍然在这里。","start":4268.63,"end":4295.57},{"id":239,"text":"And the people who did dot-com rights not only survived, they thrived. Amazon, Google, they did it right. They understood the fundamentals of what it was to build a dot-com. They understood the fundamentals of what it was to build a business on dot-com. And when the bubble of hype burst, they didn't go with it. There was one website, I believe it was pets.com, that they had the mindset of, if you build it, they will come. They had Super Bowl commercials around pets.com.","zh":"那些在互联网泡沫中成功的人不仅生存下来，还蓬勃发展。亚马逊、谷歌，他们做对了。他们理解了建立互联网公司的基本要素，也理解了在互联网上建立业务的基本要素。当泡沫的炒作破裂时，他们没有随波逐流。有一个网站，我相信是pets.com，他们持有‘如果你建造它，人们就会来’的心态。他们甚至在超级碗上投放了pets.com的广告。","start":4296.57,"end":4325.61},{"id":240,"text":"They couldn't handle the traffic that they got. And that was the kind of site that when the bubble burst, those were the kind of sites that just evaporated. So that bubble in AI is likely coming. There is always a bubble. So the companies that are doing AI right are the ones, like I said, that won't just avoid the bubble, that they will actually thrive post-bubble. And the people who are doing AI right.","zh":"他们无法应对所获得的流量。而这类网站正是在泡沫破裂时消失的那些。因此，AI领域的泡沫很可能也会到来。泡沫总是存在的。那些正确开展AI业务的公司，正如我所说，不会只是避开泡沫，而是在泡沫破裂后蓬勃发展。那些正确开展AI业务的人。","start":4326.29,"end":4352.55},{"id":241,"text":"The folks in this room who are thinking about AI and how you bring it to your company and the advice that you're giving to your company and leaning into that in the right way will also be the ones who not only avoid getting laid off in the bubble crashes, but will be the ones who will thrive through and after the bubble. So anatomy of any bubble, and what I'm seeing in the AI one in particular, is this kind of pyramid. At the top is the hype that I've been talking about. At the bottom is massive VC investment.","zh":"在座思考AI以及如何将其引入公司、向公司提供建议并以正确方式投入其中的人，不仅会在泡沫破裂时避免被裁员，还会在泡沫中和泡沫之后蓬勃发展。因此，任何泡沫的结构，特别是我在AI领域所观察到的，都呈现出这种金字塔形状。顶部是之前我所谈到的炒作，底部则是大量的风险投资资金投入。","start":4353.14,"end":4381.64},{"id":242,"text":"I'll be frank, I'm already seeing that drying up.","zh":"我要坦白地说，我已经看到这种趋势正在逐渐消失。","start":4382.21,"end":4384.17},{"id":243,"text":"Right? You know, once upon a time, you could go out with anything that had AI written on it and get VC investment. Then you could go out and do anything within LLM and get VC investment. Now they're far, far, far more cautious. I've been advising a lot of startups. The amount that they're getting invested is being scaled back. The stuff that's being invested in is changing. And, you know, the second layer down, massive VC investment is already beginning to vanish.","zh":"对吧？以前，只要你有任何带有AI字样的东西，就能获得风险投资。然后，只要你涉及大语言模型（LLM）的任何项目，也能获得风险投资。但现在他们变得远比以前谨慎得多。我为很多初创公司提供建议，他们获得的投资金额正在减少，投资的方向也在发生变化。而且，第二层的大量风险投资资金已经开始消失。","start":4384.61,"end":4413.01}],"notes":["本段讲授了AI行业当前面临的泡沫风险，通过类比2000年代的互联网泡沫，指出AI行业可能正在经历类似的阶段。讲者强调，泡沫的形成通常伴随着过度的乐观预期和大量投资，但最终会因现实问题而破裂。","讲者指出，那些在泡沫中成功的企业，如亚马逊和谷歌，是那些真正理解业务本质并建立稳固基础的企业。他们没有盲目追逐短期的炒作，而是专注于长期价值的创造。","讲者提到，泡沫的结构通常呈现金字塔形，顶部是过度的炒作，底部则是大量的风险投资。当前，AI行业的风险投资正在逐渐减少，这表明泡沫可能正在形成。","讲者强调，那些在AI领域正确行事的人，不仅能够避免在泡沫破裂时被裁员，还能在泡沫之后继续繁荣。这包括那些在公司内部推动AI应用并提供正确建议的人。","讲者指出，AI行业的泡沫与互联网泡沫有相似之处，但也有其独特性。泡沫的破裂可能导致大量初创公司倒闭，而那些真正理解AI价值的企业则能幸存并发展。","讲者最后提到，当前的风险投资正在变得更加谨慎，这表明AI行业的泡沫可能正在形成，但尚未达到顶峰。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4239.77,"end":4413.01,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4239.77,"text":"And then it cuts away to the crew of the ship who are like, wait, aren't they supposed to have binoculars? And then the crew is like, oh, we left the binoculars behind in port. That framing the whole idea was like they were so arrogant in being able to move forward that they didn't want to look out for any particular risks. And even though they had people whose job it was to look out for risks, they didn't properly equip or train them. And that, to me, is a really good metaphor for where the AI industry is today. There are risks in front of us."},{"start":4268.63,"text":"those risks, the B word, the bubble word, you're probably reading in the news, are there. To me, though, the opportunity and the things to think about in terms of a bubble are, most of you probably don't remember the dot-com bubble of the 2000s, but if you think about the dot-com bubble, that was the biggest bubble in history. It burst, but we're still here."},{"start":4296.57,"text":"And the people who did dot-com rights not only survived, they thrived. Amazon, Google, they did it right. They understood the fundamentals of what it was to build a dot-com. They understood the fundamentals of what it was to build a business on dot-com. And when the bubble of hype burst, they didn't go with it. There was one website, I believe it was pets.com, that they had the mindset of, if you build it, they will come. They had Super Bowl commercials around pets.com."},{"start":4326.29,"text":"They couldn't handle the traffic that they got. And that was the kind of site that when the bubble burst, those were the kind of sites that just evaporated. So that bubble in AI is likely coming. There is always a bubble. So the companies that are doing AI right are the ones, like I said, that won't just avoid the bubble, that they will actually thrive post-bubble. And the people who are doing AI right."},{"start":4353.14,"text":"The folks in this room who are thinking about AI and how you bring it to your company and the advice that you're giving to your company and leaning into that in the right way will also be the ones who not only avoid getting laid off in the bubble crashes, but will be the ones who will thrive through and after the bubble. So anatomy of any bubble, and what I'm seeing in the AI one in particular, is this kind of pyramid. At the top is the hype that I've been talking about. At the bottom is massive VC investment."},{"start":4382.21,"text":"I'll be frank, I'm already seeing that drying up."},{"start":4384.61,"text":"Right? You know, once upon a time, you could go out with anything that had AI written on it and get VC investment. Then you could go out and do anything within LLM and get VC investment. Now they're far, far, far more cautious. I've been advising a lot of startups. The amount that they're getting invested is being scaled back. The stuff that's being invested in is changing. And, you know, the second layer down, massive VC investment is already beginning to vanish."}],"speech_gaps":[],"frame":"../frames/v056/026.webp","frame_time":4251.77},{"title":"AI行业趋势与职业建议","segments":[{"id":244,"text":"Unrealistic valuations. Companies that aren't making money being valued massively high. We all know who they are. We're beginning to see those unrealistic valuations being fed off of that hype. Me Too products, where somebody does something and it's successful and everybody jumps on the bandwagon. We're also seeing them everywhere. We saw them throughout the dot-com bubble. And then right at the bottom is that real value.","zh":"不切实际的估值。那些没有盈利的公司却被估值得非常高。我们都知道他们是谁。我们开始看到这些不切实际的估值被这种炒作所推动。Me Too产品，即某人做了某事并取得成功，然后所有人都跟风加入。我们也在各个地方看到这种情况。我们在互联网泡沫时期就曾见过这种现象。而在底部则是真实的价值。","start":4414.32,"end":4437.54},{"id":245,"text":"You know, I probably shouldn't have done the triangle like this. It should be more an upside-down triangle, right, because, you know, the real value here is small. I vibe-coded these slides into existence, so this is one of the technical debt I took on. You know, but the real value there, that kernel of value is there, and the ones that build for that will be the ones that survive. So...","zh":"你知道，我可能不应该这样画这个三角形。它应该更像是一个倒置的三角形，对吧，因为这里的真实价值很小。我用一种直觉的方式把这些幻灯片创造出来，所以这就是我所承担的技术债务之一。但真实的价值核心在那里，那些为它构建的人将会生存下来。所以……","start":4438.1,"end":4459.71},{"id":246,"text":"The direction that I see the AI industry going in and the direction that I would encourage you to start thinking about your skills in is really over the next five years, there's going to be a bifurcation. I'm just going to be ornery in how I describe it as big and small. Big AI will be what we see today with the large language models getting bigger in the desire to drive towards AGI.","zh":"我看到人工智能行业的发展方向，以及我鼓励你们开始思考自己技能的方向，是在未来五年内会出现分化。我会用一种不太客气的方式描述它，即大和小。大AI将是今天我们看到的大型语言模型继续变大，以追求通用人工智能（AGI）。","start":4461.97,"end":4484.27},{"id":247,"text":"The Geminis, the Claudes, the open AIs of the world are going to continue to drive bigger. And bigger is better in the mindset of those companies towards achieving AGI or towards achieving better business value. That's going to be one side of the branch. The other side of the branch is I'm going to call it small. We've all seen open source models. I hate the term open source. Let me call them open weights or let me call them self-hostable models. They're exploding onto the landscape.","zh":"Geminis、Claudes、以及各种开放AI，它们将继续变得更大。在这些公司追求实现AGI或实现更好商业价值的心态中，更大就是更好。这将是分支的一边。分支的另一边，我会称之为小。我们所有人都见过开源模型。我不喜欢“开源”这个词，让我称它们为“开放权重”或“可自托管模型”。它们正在迅速进入市场。","start":4484.84,"end":4513.32},{"id":248,"text":"I read an article recently about Y Combinator that 80% of the companies in Y Combinator were using small models from China in particular. So the Chinese models in particular are doing really well, probably because of the overall landscape there, not leaning into the large models the same way as the West is. I see that bifurcation happening. China, I think, has that head start on the small models. That may last, it may not.","zh":"我最近读了一篇关于Y Combinator的文章，其中提到Y Combinator中有80%的公司使用了来自中国的中小型模型。因此，中国的模型表现特别好，这可能是因为整体环境不同，他们不像西方那样倾向于使用大型模型。我认为这种分化正在发生。中国在小型模型方面可能有先发优势，这种优势可能会持续，也可能不会。","start":4514.04,"end":4537.98},{"id":249,"text":"I don't know, but the point is we're heading in that particular direction of, I'm going to call them instead of big and small now, models that are hosted on your behalf by somebody else, like a GPT or a Gemini or a Claude, or models that you can host yourself for your own needs. As this side right now is underserved, this bubble may burst.","zh":"我不确定，但关键是，我们正在朝着这样一个方向发展，我称之为不再区分大模型和小模型，而是由其他人托管的模型，比如GPT或Gemini或Claude，或者是你可以自己托管以满足自身需求的模型。目前这一方面服务不足，这个泡沫可能会破裂。","start":4538.33,"end":4560.73},{"id":250,"text":"This one right now is underserved, and this bubble will be later on. And the major skills that I can see developers needing over the next two to three years on this side of the fence will be fine-tuning.","zh":"目前这一方面服务不足，但将来这个泡沫会破裂。我能看到开发者在未来两到三年内在这边需要掌握的主要技能是微调。","start":4561.4,"end":4573.72}],"notes":["本段讨论了AI行业中的不现实估值现象，指出一些未盈利的公司被高估，这种现象在科技泡沫中曾出现过。讲者提到‘Me Too’产品，即模仿成功产品而缺乏创新，导致市场泡沫。真实价值在底部，而这些泡沫可能最终破裂。","讲者提到自己在制作幻灯片时使用了‘vibe-coded’（即凭感觉或直觉制作），这属于技术债务。他强调真正的价值核心存在，而能够围绕这一核心构建的公司将生存下来。","讲者预测未来五年AI行业将出现分化，分为‘大AI’和‘小AI’两个方向。‘大AI’指的是大型语言模型，它们会继续扩大规模以追求通用人工智能（AGI）和商业价值。‘小AI’则指开源模型，讲者认为应称为‘开放权重’或‘自托管模型’。","讲者提到中国在小模型领域有先发优势，因为中国公司较少依赖大型模型，这可能使他们在小模型领域领先。但这种优势是否持久尚不确定。","讲者指出，当前市场对‘托管模型’（由第三方提供）和‘自托管模型’（用户自行部署）的需求尚未被充分满足，这可能导致泡沫破裂。他建议开发者未来两年到三年内应掌握模型微调技能。","讲者强调，AI行业正在向两个方向发展，开发者需要关注这两个方向，并提升相应技能。他提到‘技术债务’和‘泡沫’等概念，提醒听众注意行业趋势和潜在风险。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4414.32,"end":4573.72,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4414.32,"text":"Unrealistic valuations. Companies that aren't making money being valued massively high. We all know who they are. We're beginning to see those unrealistic valuations being fed off of that hype. Me Too products, where somebody does something and it's successful and everybody jumps on the bandwagon. We're also seeing them everywhere. We saw them throughout the dot-com bubble. And then right at the bottom is that real value."},{"start":4438.1,"text":"You know, I probably shouldn't have done the triangle like this. It should be more an upside-down triangle, right, because, you know, the real value here is small. I vibe-coded these slides into existence, so this is one of the technical debt I took on. You know, but the real value there, that kernel of value is there, and the ones that build for that will be the ones that survive. So..."},{"start":4461.97,"text":"The direction that I see the AI industry going in and the direction that I would encourage you to start thinking about your skills in is really over the next five years, there's going to be a bifurcation. I'm just going to be ornery in how I describe it as big and small. Big AI will be what we see today with the large language models getting bigger in the desire to drive towards AGI."},{"start":4484.84,"text":"The Geminis, the Claudes, the open AIs of the world are going to continue to drive bigger. And bigger is better in the mindset of those companies towards achieving AGI or towards achieving better business value. That's going to be one side of the branch. The other side of the branch is I'm going to call it small. We've all seen open source models. I hate the term open source. Let me call them open weights or let me call them self-hostable models. They're exploding onto the landscape."},{"start":4514.04,"text":"I read an article recently about Y Combinator that 80% of the companies in Y Combinator were using small models from China in particular. So the Chinese models in particular are doing really well, probably because of the overall landscape there, not leaning into the large models the same way as the West is. I see that bifurcation happening. China, I think, has that head start on the small models. That may last, it may not."},{"start":4538.33,"text":"I don't know, but the point is we're heading in that particular direction of, I'm going to call them instead of big and small now, models that are hosted on your behalf by somebody else, like a GPT or a Gemini or a Claude, or models that you can host yourself for your own needs. As this side right now is underserved, this bubble may burst."},{"start":4561.4,"text":"This one right now is underserved, and this bubble will be later on. And the major skills that I can see developers needing over the next two to three years on this side of the fence will be fine-tuning."}],"speech_gaps":[],"frame":"../frames/v056/027.webp","frame_time":4426.32},{"title":"AI领域职业建议：模型应用与技能多样化","segments":[{"id":251,"text":"So the ability to take an open source model and fine-tune it for particular downstream tasks. Let me give one concrete example of that that I've personally experienced. I work a lot in Hollywood, and I've worked a lot with studios making movies. And one studio in particular, I was lucky enough to sell a movie to. It's still in pre-production. It'll probably be in pre-production forever.","zh":"因此，能够将开源模型微调以适应特定的下游任务的能力。让我举一个我亲身经历的具体例子。我在好莱坞工作很多，也与很多电影制片公司合作过。其中有一家制片公司，我有幸将一部电影卖给了他们。这部电影目前仍处于前期制作阶段，可能永远都会处于前期制作阶段。","start":4574.68,"end":4596.52},{"id":252,"text":"One of the things I learned as part of that process was IP in studios is so protected. It's not even funny.","zh":"在这个过程中，我学到的一件事是，制片公司的知识产权保护非常严格，甚至可以说是荒谬的。","start":4598.61,"end":4606.41},{"id":253,"text":"Go and Google for James Cameron who created Avatar and the lawsuits that he's involved in of this person who apparently sent him a story many years ago about blue aliens and is now suing him for billions of dollars because obviously there were blue aliens in Avatar. The level of IP protection in Hollywood is insane. The opportunity with large language models is equally insane.","zh":"去谷歌搜索詹姆斯·卡梅隆，他是《阿凡达》的创作者，以及他涉及的法律诉讼。有一个人多年前向他发送了一个关于蓝色外星人的故事，现在却起诉他数十亿美元，因为显然《阿凡达》中有蓝色外星人。好莱坞的知识产权保护程度令人难以置信。大型语言模型带来的机会同样令人难以置信。","start":4607.04,"end":4630.32},{"id":254,"text":"A lot of the focus is on large language models for creation, for storytelling, for rendering and all that. But actually the major opportunity that they have is actually for analysis. To take a look at synopses of movies and find out what works and what doesn't. Why was this movie a hit and this one wasn't? What time of year was this one released and it became successful and this one wasn't? And with the margin on movies being razor thin, that kind of analysis is huge. But in order to do that kind of analysis, you need to share the details.","zh":"目前很多关注点都集中在大型语言模型用于创作、讲故事和渲染等方面。但实际上，它们的主要机会在于分析。通过查看电影的剧情简介，找出哪些内容有效、哪些无效。为什么这部电影是热门，而另一部却不是？为什么一部电影在特定的季节上映后取得了成功，而另一部却没有？在电影利润极其微薄的情况下，这种分析非常重要。但为了进行这种分析，你需要共享详细信息。","start":4631.28,"end":4660.24},{"id":255,"text":"Be a movie with a large language model. And they will absolutely not do that with a GPT or a Gemini or whatever, because they're now sharing their IP with a third party.","zh":"使用大型语言模型来制作电影。他们绝对不会使用GPT或Gemini之类的模型，因为这样会将他们的知识产权与第三方共享。","start":4660.46,"end":4668.16},{"id":256,"text":"Enter small models where they can self-host their own small model, and they are getting smarter and smarter. The 7B model of today is as smart as the 50B model of yesterday. A year from now, the 7B model of a year from now will be as smart as the 300B model of yesteryear. So they're moving in that direction of building using small...","zh":"进入小型模型领域，他们可以自行托管自己的小型模型，并且这些模型正变得越来越聪明。今天的70亿参数模型的智能水平，与昨天的500亿参数模型相当。一年后，一年后的70亿参数模型的智能水平，将与过去3000亿参数模型相当。因此，他们正在朝着构建小型模型的方向发展。","start":4669.16,"end":4690.34},{"id":257,"text":"Self-hosted models, which they can then fine tune on downstream tasks. Similar with other things where privacy is important, law offices, medical offices, all of those kind of things. So those type of skills are fundamentally important going forward. So that's the bifurcation that I'm seeing happening in AI. The sooner bubble, I think, is in the bigger.","zh":"他们可以自行托管模型，然后在下游任务上进行微调。类似地，在隐私很重要的其他领域，如律师事务所、医疗办公室等，也是如此。因此，这些类型技能在未来是根本性的。这就是我看到正在发生的AI领域的分化。我认为，较早的泡沫出现在更大的领域。","start":4690.67,"end":4708.69},{"id":258,"text":"Non-self-hosted. The later bubble is in the smaller self-hosted. But either way, for your","zh":"非自行托管的。后来的泡沫则出现在较小的自行托管领域。但无论如何，为了你的","start":4709.2,"end":4714.58},{"id":259,"text":"Career to avoid the impact of any bubble bursting, focus on the fundamentals. Build those real","zh":"职业避免任何泡沫破裂带来的影响，应专注于基础知识。构建真正的","start":4714.58,"end":4721.52},{"id":260,"text":"Solutions. Understand the business side. And most of all, diversify your skills. Don't be that one","zh":"解决方案。理解商业方面。最重要的是，多样化你的技能。不要成为那个只懂一件事的","start":4721.52,"end":4726.88},{"id":261,"text":"Trick pony who only knows how to do one thing. I've worked with brilliant people who are fantastic","zh":"单打独斗的高手。我曾与一些在特定API或特定框架编码方面非常出色的聪明人合作。","start":4726.88,"end":4732.62},{"id":262,"text":"At coding a particular API or particular framework. And then the industry moved on and they got left","zh":"然后行业向前发展，他们却被甩在了后面。","start":4732.62,"end":4737.78},{"id":263,"text":"Left behind. Okay, so yeah, when bubbles burst, that overall fallout, kind of spoken about it a","zh":"被遗弃了。好的，所以是的，当泡沫破裂时，整体的后果，这一点已经略微讨论过，资金蒸发，招聘冻结变成裁员，项目被取消，","start":4737.78,"end":4744.74},{"id":264,"text":"Little bit already, funding evaporates, hiring freezes become layoffs, projects get cancelled,","zh":"被取消。","start":4744.74,"end":4749.54},{"id":265,"text":"And talent floods the market. Yep.","zh":"而且人才涌入市场。是的。","start":4749.82,"end":4751.4}],"notes":["本段讨论了AI在电影行业中的应用，特别是大型语言模型在分析电影剧本和市场表现方面的潜力。讲者提到，虽然大型语言模型在创作和故事叙述方面受到关注，但其真正的价值在于分析，例如分析电影概要以判断哪些元素成功，哪些失败。这种分析对于电影行业至关重要，因为电影的利润空间非常狭窄。","讲者指出，由于知识产权保护非常严格，电影公司不会将他们的数据交给第三方模型，如GPT或Gemini，因此他们倾向于使用自托管的小型模型。这些模型可以被进一步微调以适应特定任务，这在需要隐私保护的领域（如法律和医疗）中尤为重要。","讲者强调了技能多样化的必要性，避免成为只擅长一项技能的“单打独斗者”。他提到，一些程序员虽然在特定API或框架上非常优秀，但随着行业的发展，他们可能被市场淘汰。","讲者还讨论了AI领域的“泡沫”现象，认为大型模型和自托管模型分别代表了不同的发展方向。他建议从业者关注基础知识，构建实际解决方案，并理解业务层面，以避免泡沫破裂带来的影响。","当泡沫破裂时，资金蒸发、招聘冻结、项目取消和人才过剩是常见的后果。因此，讲者建议从业者多样化技能，以增强职业的稳定性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4574.68,"end":4751.4,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":4574.68,"text":"So the ability to take an open source model and fine-tune it for particular downstream tasks. Let me give one concrete example of that that I've personally experienced. I work a lot in Hollywood, and I've worked a lot with studios making movies. And one studio in particular, I was lucky enough to sell a movie to. It's still in pre-production. It'll probably be in pre-production forever."},{"start":4598.61,"text":"One of the things I learned as part of that process was IP in studios is so protected. It's not even funny."},{"start":4607.04,"text":"Go and Google for James Cameron who created Avatar and the lawsuits that he's involved in of this person who apparently sent him a story many years ago about blue aliens and is now suing him for billions of dollars because obviously there were blue aliens in Avatar. The level of IP protection in Hollywood is insane. The opportunity with large language models is equally insane."},{"start":4631.28,"text":"A lot of the focus is on large language models for creation, for storytelling, for rendering and all that. But actually the major opportunity that they have is actually for analysis. To take a look at synopses of movies and find out what works and what doesn't. Why was this movie a hit and this one wasn't? What time of year was this one released and it became successful and this one wasn't? And with the margin on movies being razor thin, that kind of analysis is huge. But in order to do that kind of analysis, you need to share the details."},{"start":4660.46,"text":"be a movie with a large language model. And they will absolutely not do that with a GPT or a Gemini or whatever, because they're now sharing their IP with a third party."},{"start":4669.16,"text":"enter small models where they can self-host their own small model, and they are getting smarter and smarter. The 7B model of today is as smart as the 50B model of yesterday. A year from now, the 7B model of a year from now will be as smart as the 300B model of yesteryear. So they're moving in that direction of building using small..."},{"start":4690.67,"text":"self-hosted models, which they can then fine tune on downstream tasks. Similar with other things where privacy is important, law offices, medical offices, all of those kind of things. So those type of skills are fundamentally important going forward. So that's the bifurcation that I'm seeing happening in AI. The sooner bubble, I think, is in the bigger."},{"start":4709.2,"text":"non-self-hosted. The later bubble is in the smaller self-hosted. But either way, for your"},{"start":4714.58,"text":"career to avoid the impact of any bubble bursting, focus on the fundamentals. Build those real"},{"start":4721.52,"text":"solutions. Understand the business side. And most of all, diversify your skills. Don't be that one"},{"start":4726.88,"text":"trick pony who only knows how to do one thing. I've worked with brilliant people who are fantastic"},{"start":4732.62,"text":"at coding a particular API or particular framework. And then the industry moved on and they got left"},{"start":4737.78,"text":"left behind. Okay, so yeah, when bubbles burst, that overall fallout, kind of spoken about it a"},{"start":4744.74,"text":"little bit already, funding evaporates, hiring freezes become layoffs, projects get cancelled,"},{"start":4749.82,"text":"and talent floods the market. Yep."}],"speech_gaps":[],"frame":"../frames/v056/028.webp","frame_time":4586.68},{"title":"职业建议：技能多样化与专业深度","segments":[{"id":266,"text":"So, how do you think, how is it more important to, like, diversify skills versus, like, actually, like, focusing on, for example, LMS versus, like, computer vision or versus, like, very specific downstream tasks?","zh":"那么，你怎么想，多样化技能和专注于特定领域，比如LMS，或者计算机视觉，或者非常具体的下游任务，哪个更重要？","start":4772.84,"end":4788.18},{"id":267,"text":"right so I mean I think so the question was around NVIDIA in particular hiring for a very specific","zh":"对，我的意思是，这个问题是围绕NVIDIA特别招聘的，针对一个非常具体的","start":4788.74,"end":4793.64},{"id":268,"text":"very narrow scenario so then the question is how important is it for you to become an expert in a","zh":"非常狭窄的场景，那么问题是，对你来说，成为某个","start":4793.64,"end":4798.34},{"id":269,"text":"scenario versus diversifying your skills I would always argue it's still better to diversify your","zh":"场景的专家有多重要，还是多样化你的技能？我总是认为，多样化技能仍然更好，因为那个狭窄的场景只是那个狭窄的场景，你把所有的鸡蛋都放在一个篮子里","start":4798.34,"end":4803.94},{"id":270,"text":"skills because that one narrow scenario is only that one narrow scenario and you're putting all","zh":"NVIDIA是一家非常棒的公司，我没有任何反对他们的意思，但如果把所有的鸡蛋都放在那个篮子里，而你没有得到","start":4803.94,"end":4808.92},{"id":271,"text":"your eggs into one basket NVIDIA would be a fantastic company to work for nothing against","zh":"那么，会发生什么呢？因此，我认为真正能够","start":4808.92,"end":4813.38},{"id":272,"text":"them in any way but if you put all of your eggs into that basket and you don't get it","zh":"拥有这种能力的想法","start":4813.38,"end":4817.3},{"id":273,"text":"then what right so i think the idea of really being able to","zh":"那么接下来呢，我觉得真正能够","start":4817.3,"end":4821.22},{"id":274,"text":"If you are passionate about a thing, to be very deep in that thing is very, very good, but to only be able to do that thing, I would always encourage to be diversified. When I say diversified, like you were saying, LLMs or computer vision or anything like that, I think that's one part of it, but it's like that knowledge of models and how to use them, to me, is a uni skill. The diversification of skills is breaking outside of that, also to be able to think, okay, what about building applications on top of these?","zh":"如果你对某件事充满热情，深入钻研这件事是非常非常好的，但如果你只能做这件事，我总是鼓励你进行多样化发展。当我提到多样化时，就像你刚才说的，比如大语言模型（LLMs）或计算机视觉之类的内容，我认为这是其中一部分，但对我来说，关于模型的知识以及如何使用它们，是一种单一技能。技能的多样化意味着突破这种单一技能，同时也能够思考，比如如何在这些基础上构建应用程序？","start":4822.46,"end":4851.3},{"id":275,"text":"What does scaling an application look like? What does software engineering, in this case, look like? What about user experience and user experience skills? Because it's all very well to build a beautiful application, but if nobody can use it, I'm looking at you, Microsoft Office, you know, there's stuff like that that you just, you know, that's what I really mean about diversifying beyond. So even in that, like, mono example with NVIDIA, to be able to break out of, like, that one particular example, but to show skills in other areas that are of value, I think is really important.","zh":"应用程序的扩展是什么样子的？在这种情况下，软件工程又是什么样子的？用户体验和用户体验技能又如何？因为仅仅构建一个漂亮的应用程序是不够的，如果没有人能够使用它，我看着你，微软办公软件，你知道的，有一些东西就是这样，这就是我所说的超越单一技能的重要性。因此，即使在像NVIDIA这样的单一例子中，也能够突破那种特定的例子，展示其他有价值的技能，我认为这非常重要。","start":4851.87,"end":4880.17},{"id":276,"text":"Okay, as we're just running a little bit, so yeah, I just wanted to, I've kind of gone into it a little bit already, but I'm a massive advocate for small AI. I really do believe small AI is the next big thing because we're moving into a world, and this is part of the job that I do at Arm, is we're kind of moving into a world of like AI everywhere all at once. So there's a traditional, and it's interesting you just brought up NVIDIA because there's a traditional conception that compute platforms are CPU plus GPU when it comes to AI.","zh":"好的，我们刚刚聊了一点，是的，我只是想稍微深入一点，但我是一个强烈支持小AI的人。我真心相信小AI是下一个大趋势，因为我们正在进入一个世界，这也是我在Arm工作的一部分，我们正在进入一个AI无处不在的世界。因此，传统上，当谈到AI时，计算平台被认为是CPU加上GPU。","start":4882.96,"end":4911.72},{"id":277,"text":"but that's also changing, right? CPU general purpose, GPU specialists. But for example, in mobile space,","zh":"但这也正在发生变化，对吧？CPU是通用的，GPU是专门的。例如，在移动领域，","start":4911.85,"end":4918.51},{"id":278,"text":"massive innovation being done with a technology called SME, Scalable Matrix Extensions. And what SME is all about is really allowing you to bring AI workloads and put them on the CPU. The frontrunners in this are a couple of Chinese phone vendors, Vivo and Oppo, who've just recently released phones with SME-enabled chips. And what's magical about these is that, A, they don't need to have a separate external chip drawing...","zh":"正在使用一种名为SME（可扩展矩阵扩展）的技术进行大量创新。SME的核心在于让你能够将AI任务放到CPU上运行。在这方面领先的是一些中国手机厂商，如vivo和OPPO，他们最近发布了搭载SME芯片的手机。这些手机的神奇之处在于，首先，它们不需要额外的外部芯片来……","start":4919.81,"end":4946.29}],"notes":["本段讨论了在AI领域中，技能多样化与专业深度之间的权衡。讲者认为，虽然深入某一领域（如计算机视觉或特定下游任务）有其价值，但技能多样化更为重要，因为过于专注于某一狭窄场景可能带来风险。讲者以NVIDIA为例，指出虽然该公司在AI领域有重要地位，但将所有技能投入其中可能不具可持续性。","讲者进一步强调，技能多样化不仅包括掌握不同的技术（如LLMs或计算机视觉），还包括理解模型的使用方法，以及构建应用程序、软件工程、用户体验等跨领域的技能。讲者以Microsoft Office为例，说明即使有强大的技术，如果无法被用户使用，也难以成功。","讲者还提到，随着AI技术的发展，传统的计算平台（CPU+GPU）正在发生变化，特别是在移动设备领域，出现了如SME（Scalable Matrix Extensions）等新技术，使得AI工作负载可以在CPU上运行，而无需依赖外部芯片。","讲者以Vivo和Oppo为例，说明这些中国手机厂商正在采用SME技术，展示了AI在移动设备上的创新应用。这表明，AI技术正在向更广泛的领域扩展，而不仅仅是传统的计算平台。","讲者最后提到，他支持“小AI”（small AI）的发展，认为这是未来的重要趋势。小AI指的是在各种设备和场景中广泛应用的AI技术，而不是集中在特定的大型系统上。","讲者强调，AI技术正在从传统的计算平台向更广泛的领域扩展，包括移动设备和嵌入式系统。这种趋势意味着，未来的AI发展将更加注重灵活性和适应性，而不仅仅是计算能力的提升。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4772.84,"end":4946.29,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":4772.84,"text":"So, how do you think, how is it more important to, like, diversify skills versus, like, actually, like, focusing on, for example, LMS versus, like, computer vision or versus, like, very specific downstream tasks?"},{"start":4788.74,"text":"right so I mean I think so the question was around NVIDIA in particular hiring for a very specific"},{"start":4793.64,"text":"very narrow scenario so then the question is how important is it for you to become an expert in a"},{"start":4798.34,"text":"scenario versus diversifying your skills I would always argue it's still better to diversify your"},{"start":4803.94,"text":"skills because that one narrow scenario is only that one narrow scenario and you're putting all"},{"start":4808.92,"text":"your eggs into one basket NVIDIA would be a fantastic company to work for nothing against"},{"start":4813.38,"text":"them in any way but if you put all of your eggs into that basket and you don't get it"},{"start":4817.3,"text":"then what right so i think the idea of really being able to"},{"start":4822.46,"text":"If you are passionate about a thing, to be very deep in that thing is very, very good, but to only be able to do that thing, I would always encourage to be diversified. When I say diversified, like you were saying, LLMs or computer vision or anything like that, I think that's one part of it, but it's like that knowledge of models and how to use them, to me, is a uni skill. The diversification of skills is breaking outside of that, also to be able to think, okay, what about building applications on top of these?"},{"start":4851.87,"text":"What does scaling an application look like? What does software engineering, in this case, look like? What about user experience and user experience skills? Because it's all very well to build a beautiful application, but if nobody can use it, I'm looking at you, Microsoft Office, you know, there's stuff like that that you just, you know, that's what I really mean about diversifying beyond. So even in that, like, mono example with NVIDIA, to be able to break out of, like, that one particular example, but to show skills in other areas that are of value, I think is really important."},{"start":4882.96,"text":"Okay, as we're just running a little bit, so yeah, I just wanted to, I've kind of gone into it a little bit already, but I'm a massive advocate for small AI. I really do believe small AI is the next big thing because we're moving into a world, and this is part of the job that I do at Arm, is we're kind of moving into a world of like AI everywhere all at once. So there's a traditional, and it's interesting you just brought up NVIDIA because there's a traditional conception that compute platforms are CPU plus GPU when it comes to AI."},{"start":4911.85,"text":"but that's also changing, right? CPU general purpose, GPU specialists. But for example, in mobile space,"},{"start":4919.81,"text":"massive innovation being done with a technology called SME, Scalable Matrix Extensions. And what SME is all about is really allowing you to bring AI workloads and put them on the CPU. The frontrunners in this are a couple of Chinese phone vendors, Vivo and Oppo, who've just recently released phones with SME-enabled chips. And what's magical about these is that, A, they don't need to have a separate external chip drawing..."}],"speech_gaps":[],"frame":"../frames/v056/029.webp","frame_time":4784.84},{"title":"AI在设备端的部署与趋势","segments":[{"id":279,"text":"extra power, taking up extra footprint space just to be able to run AI workloads, and B, the CPU, of course, being a low power.","zh":"额外的电力消耗，占用额外的物理空间只是为了运行AI任务，以及B，当然，CPU的功耗较低。","start":4946.54,"end":4953.98},{"id":280,"text":"pulling thing, being able to run AI workloads on that, they've been able to build interesting new scenarios. And if I talk about one in particular, there's a company called Alipay. And Alipay had an application where you would, and we've all seen these apps, where you can go through your photographs and you can search for a particular thing. You know, places I ate sushi or something along those lines and use that to create a slideshow. All of those require a back-end service.","zh":"能够在这类设备上运行AI任务，他们已经能够构建出一些有趣的全新场景。如果我特别提到其中一个例子，有一家公司叫做支付宝。支付宝有一个应用程序，你可以在其中浏览自己的照片，并搜索特定的内容。我们都见过这类应用，比如查找你吃寿司的地方之类的，然后利用这些照片创建幻灯片。所有这些都需要一个后端服务。","start":4954.38,"end":4979.66},{"id":281,"text":"So your photographs are hosted on Google Photos or Apple Photos or something like that, and that back-end service runs the model that you can search against it and be able to do the assembly of them. What Alipay wanted to do was, like, say, there are three problems with this. Problem number one, privacy. You have to share your photos with a third party. Problem number two, latency. You've got to upload those photos, you've got to send the thing, you've got to have the back-end do the thing, and then you've got to download the results from the thing. And then number three is building that cloud service.","zh":"因此，你的照片存储在Google照片或Apple照片等平台上，而后端服务运行模型，使你能够搜索这些照片并进行组合。支付宝想要做的，是指出其中的三个问题。第一个问题是隐私问题，你需要将照片分享给第三方。第二个问题是延迟，你需要上传这些照片，发送请求，让后端处理，然后再下载结果。第三个问题是构建这个云服务。","start":4980.27,"end":5009.17},{"id":282,"text":"And standing that up costs time and money.","zh":"搭建这样的服务需要时间和金钱。","start":5009.73,"end":5011.73},{"id":283,"text":"So if they could move all of this onto the device itself, now the idea was they could run a model on the device that searches the photos on the device. You don't have the latency. And business perspective, they're now saving the money on creating this stand-up service. They now have AI running on the CPU in order to be able to do that. Apple are also people who've invested heavily in the scalable matrix extensions. You see whenever they talk about, if you've ever watched WWDC or anything like that, when they talk about the new AC.","zh":"因此，如果他们能够将所有这些功能转移到设备本身，现在这个想法是可以在设备上运行一个模型，搜索设备上的照片。这样就不会有延迟。从商业角度来看，他们现在节省了搭建这个服务的成本。他们现在能够在CPU上运行AI，以实现这一功能。苹果公司也大力投资了可扩展的矩阵扩展技术。你可以在他们谈论新AC系列芯片和M系列芯片时看到这一点，他们提到神经核心等组件。这就是这个想法的一部分。","start":5012.3,"end":5041.74},{"id":284,"text":"series chips and
