</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 2 模仿学习（Imitation Learning） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v029.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v029","title":"Lecture 2 模仿学习（Imitation Learning）","course":"强化学习","pages":[{"title":"模仿学习（Imitation Learning）基础概念","segments":[{"id":0,"text":"Today we'll be talking about imitation learning. Great. So as a partial recap from last time, we started talking about some of the notation that we use for representing behavior and formulating problems as a decision-making problem. We talked about states and observations, where we either have access to something that can fairly completely represent the state of the world, or a more partial representation that we will refer to as an observation.","zh":"今天我们将讨论模仿学习。很好。作为上次课程的部分回顾，我们开始讨论用于表示行为和将问题表述为决策问题的一些符号。我们提到了状态和观察，其中我们可能拥有能够相对完整地表示世界状态的信息，或者更不完整的表示，我们将这种表示称为观察。","start":5.26,"end":32.46},{"id":1,"text":"We also will be representing actions or decisions with AT. And then we can think about a trajectory as an example of behavior that we've taken over time. We also introduced this notion of a reward function, which is how good is a given state and action. And lastly, this kind of notion of a policy, which is...","zh":"我们还将用AT来表示动作或决策。然后我们可以将轨迹视为随时间推移所采取的行为示例。我们还引入了奖励函数这一概念，即某个状态和动作的好坏程度。最后，我们提到了策略这一概念，即……","start":33.67,"end":60.78},{"id":2,"text":"either conditioned on the current state, what actions do we want to take, or conditioned on a history of observations, what actions should we take, and usually this policy is the behavior that we're trying to learn. We briefly mentioned how this kind of policy can be represented using a generative model and we'll actually touch on that a little bit more today. And the last thing that's not on the slide is that we talked about how the goal of reinforcement learning problems is usually to maximize the expected sum of rewards.","zh":"要么根据当前状态，我们想要采取什么动作，要么根据观察历史，我们应当采取什么动作，通常这种策略就是我们试图学习的行为。我们简要提到了这种策略如何可以通过生成模型来表示，今天我们将更详细地讨论这一点。另外，幻灯片上没有提到的一点是，我们讨论了强化学习问题的目标通常是最大化预期奖励的总和。","start":61.07,"end":91.18},{"id":3,"text":"And today we'll be talking about one way to do that by trying to imitate a good policy. And in particular, the plan today is to go over some of the basics for imitation learning. Then we'll talk about learning expressive policy distributions and why that's important for imitation learning. Then we'll talk about learning from online interventions. And time permitting, we'll talk a little bit about how to collect demonstrations in the first place.","zh":"今天我们将讨论一种实现这一目标的方法，即通过模仿一个良好的策略。具体来说，今天的计划是回顾模仿学习的一些基础知识。然后我们将讨论学习表达性策略分布及其对模仿学习的重要性。接着我们将讨论如何从在线干预中学习。如果时间允许，我们还将简要讨论如何最初收集演示数据。","start":92.21,"end":118.0},{"id":4,"text":"Yeah, so some of the key learning goals. This is a little bit, in some ways, kind of orthogonal to the main topic of the class, but it's actually very important to understand in order to get performant imitation learning systems. So we'll be talking about how to represent distributions using neural networks rather than deterministic functions. We'll also be talking about why expressive distributions matter for imitation learning. And one challenge that can come up with imitation learning, which is compounding errors and how to address compounding errors. Great.","zh":"是的，所以一些关键的学习目标。在某种程度上，这与本课的主要主题有点正交，但为了获得高效的模仿学习系统，实际上非常理解这一点非常重要。我们将讨论如何使用神经网络来表示分布，而不是确定性函数。我们还将讨论为什么具有表达力的分布对于模仿学习很重要。模仿学习中可能出现的一个挑战是累积误差，以及如何解决累积误差。很好。","start":119.23,"end":149.5},{"id":5,"text":"So what is the goal of imitation learning? Like the goal of reinforcement learning, we want to try to achieve high reward. We want to get a good policy that can do the task well. And the way that we'll try to do that is we'll assume that we're given some trajectories that are collected by an expert. This is our data. And we'll refer to these trajectories as demonstrations. So it's kind of like a special kind of trajectory that is demonstrating how to perform the task.","zh":"那么模仿学习的目标是什么？就像强化学习的目标一样，我们想要尝试实现高奖励。我们想要获得一个能够良好完成任务的好策略。我们将通过假设我们被提供了一些由专家收集的轨迹来进行。这是我们的数据。我们将这些轨迹称为演示。因此，这类似于一种特殊的轨迹，它演示了如何执行任务。","start":149.97,"end":177.48}],"notes":["本段介绍了强化学习中模仿学习的基本概念，包括状态、观察、动作、轨迹、奖励函数和策略等核心要素。课程强调模仿学习的目标是通过学习专家的轨迹来获得一个能够完成任务的策略，而不是通过最大化奖励函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":177.48,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5.26,"text":"Today we'll be talking about imitation learning. Great. So as a partial recap from last time, we started talking about some of the notation that we use for representing behavior and formulating problems as a decision-making problem. We talked about states and observations, where we either have access to something that can fairly completely represent the state of the world, or a more partial representation that we will refer to as an observation."},{"start":33.67,"text":"We also will be representing actions or decisions with AT. And then we can think about a trajectory as an example of behavior that we've taken over time. We also introduced this notion of a reward function, which is how good is a given state and action. And lastly, this kind of notion of a policy, which is..."},{"start":61.07,"text":"either conditioned on the current state, what actions do we want to take, or conditioned on a history of observations, what actions should we take, and usually this policy is the behavior that we're trying to learn. We briefly mentioned how this kind of policy can be represented using a generative model and we'll actually touch on that a little bit more today. And the last thing that's not on the slide is that we talked about how the goal of reinforcement learning problems is usually to maximize the expected sum of rewards."},{"start":92.21,"text":"And today we'll be talking about one way to do that by trying to imitate a good policy. And in particular, the plan today is to go over some of the basics for imitation learning. Then we'll talk about learning expressive policy distributions and why that's important for imitation learning. Then we'll talk about learning from online interventions. And time permitting, we'll talk a little bit about how to collect demonstrations in the first place."},{"start":119.23,"text":"Yeah, so some of the key learning goals. This is a little bit, in some ways, kind of orthogonal to the main topic of the class, but it's actually very important to understand in order to get performant imitation learning systems. So we'll be talking about how to represent distributions using neural networks rather than deterministic functions. We'll also be talking about why expressive distributions matter for imitation learning. And one challenge that can come up with imitation learning, which is compounding errors and how to address compounding errors. Great."},{"start":149.97,"text":"So what is the goal of imitation learning? Like the goal of reinforcement learning, we want to try to achieve high reward. We want to get a good policy that can do the task well. And the way that we'll try to do that is we'll assume that we're given some trajectories that are collected by an expert. This is our data. And we'll refer to these trajectories as demonstrations. So it's kind of like a special kind of trajectory that is demonstrating how to perform the task."}],"speech_gaps":[],"frame":"../frames/v029/001.webp","frame_time":17.259999999999998},{"title":"模仿学习（Imitation Learning）的基本概念","segments":[{"id":6,"text":"And we'll use D to denote these demonstrations. Like a trajectory, it'll be a sequence of states and actions. And as an example of what this demonstration data might look like, if we wanted to learn how to autonomously drive a car,","zh":"我们将用 D 来表示这些演示数据。就像轨迹一样，它将是一系列的状态和动作。举个例子，如果我们想要学习如何自主驾驶汽车，","start":179.14,"end":194.64},{"id":7,"text":"We could have demonstrations that are in the form of people driving cars because people are pretty good at driving cars most of the time and so we could record the record from the sensors on a car as well as record kind of steering commands acceleration and so forth and Using a data set of human drivers driving we could then try to mimic that in order to train an autonomous driving agent Now we don't know","zh":"我们可以有以人类驾驶汽车形式的演示数据，因为人类大多数时候都很擅长驾驶汽车，因此我们可以记录汽车传感器的数据，以及记录转向指令、加速度等信息。使用一组人类驾驶员驾驶的数据集，我们就可以尝试模仿这些数据来训练一个自主驾驶的智能体。现在我们并不知道","start":195.18,"end":223.61},{"id":8,"text":"We don't know exactly how humans drive. We don't know the policy that humans are using in order to drive. So we can think about this demonstrations dataset as being sampled from some unknown policy pi expert. And then the goal is to learn a policy that performs at the level or similar to the level of the expert policy by mimicking what's present in the demonstration dataset. Cool. So this is the problem setup.","zh":"我们并不确切知道人类是如何驾驶的。我们不知道人类使用的驾驶策略。因此，我们可以将这些演示数据集视为是从某个未知的专家策略 π_expert 中采样的。然后目标是通过模仿演示数据集中的内容，学习一个性能与专家策略相当的策略。好，这就是问题的设定。","start":225.12,"end":253.93},{"id":9,"text":"Now let's think about kind of version zero of how we could try to do this. So kind of a very simple way that we could do this is kind of first we're given our demonstration data set. So this is some data set that contains state action pairs. We can think of, yeah, these are each of the state actions in each of the demonstration trajectories.","zh":"现在让我们思考一种最简单的实现方式。也就是说，一种非常简单的方法是，首先我们被给予演示数据集。这个数据集包含状态-动作对。我们可以认为，这些就是每个演示轨迹中的状态和动作。","start":256.64,"end":285.84},{"id":10,"text":"And then we could say that we want to train some policy to mimic the demonstration. So we would be training some policy. And in particular, we could think about the actions that this policy is going to take. So if we were to take one of the states in our demonstrations and run it through our policy, then we would get some sort of predicted action A-hat.","zh":"然后我们可以说，我们想要训练一个策略来模仿演示。因此，我们将训练某个策略。特别是，我们可以考虑这个策略将采取的动作。如果我们取演示中的一个状态，并将其输入我们的策略，那么我们将得到某种预测的动作 A-hat。","start":287.37,"end":317.03},{"id":11,"text":"So let's say that this is sampled from pi theta given a state in the demonstration. And then we could try to basically say we want this predicted action to be as close as possible to the action that the demonstrator took. So we could then minimize the difference between the predicted action and the action in the dataset. And we could do this minimization over","zh":"假设这个动作是从给定演示状态的 π_theta 中采样的。然后我们可以说，我们希望这个预测的动作尽可能接近演示中采取的动作。因此，我们可以最小化预测动作与数据集中动作之间的差异。并且我们可以在","start":317.58,"end":347.4}],"notes":["本段介绍了模仿学习的基本概念，即通过专家演示数据来训练一个模仿专家行为的策略。演示数据通常包含状态和动作的序列，例如人类驾驶汽车的轨迹。由于我们不知道专家策略的具体形式，因此需要从演示数据中学习一个策略，使其行为与专家策略相似。","讲者提到，模仿学习的目标是通过模仿演示数据中的行为来训练一个自主驾驶代理。这需要将演示数据视为来自未知专家策略的样本，并学习一个能够模仿这些样本的策略。","在模仿学习中，一个简单的实现方法是使用演示数据中的状态-动作对来训练策略。对于每个状态，策略会生成一个预测动作，该动作应尽可能接近演示数据中的对应动作。","讲者进一步说明，预测动作是通过策略 πθ 在给定状态下的采样得到的，并且目标是使预测动作与演示数据中的动作尽可能接近，从而最小化两者的差异。","最后，讲者提到可以通过最小化预测动作与数据集中动作之间的差异来训练策略，但未完成该过程的描述。","整个段落强调了模仿学习的基本框架，即通过专家演示数据来学习策略，同时指出由于专家策略未知，因此需要从数据中学习策略的参数。"],"formulas":[],"uncertainties":["record from the sensors on a car as well as record kind of steering commands acceleration and so forth and Using a data set of human drivers driving we could then try to mimic that in order to train an autonomous driving agent Now we don't know"],"diagram":"none","start":179.14,"end":347.4,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":179.14,"text":"And we'll use D to denote these demonstrations. Like a trajectory, it'll be a sequence of states and actions. And as an example of what this demonstration data might look like, if we wanted to learn how to autonomously drive a car,"},{"start":195.18,"text":"We could have demonstrations that are in the form of people driving cars because people are pretty good at driving cars most of the time and so we could record the Record from the sensors on a car as well as record kind of steering commands acceleration and so forth and Using a data set of human drivers driving we could then try to mimic that in order to train an autonomous driving agent Now we don't know"},{"start":225.12,"text":"We don't know exactly how humans drive. We don't know the policy that humans are using in order to drive. So we can think about this demonstrations dataset as being sampled from some unknown policy pi expert. And then the goal is to learn a policy that performs at the level or similar to the level of the expert policy by mimicking what's present in the demonstration dataset. Cool. So this is the problem setup."},{"start":256.64,"text":"Now let's think about kind of version zero of how we could try to do this. So kind of a very simple way that we could do this is kind of first we're given our demonstration data set. So this is some data set that contains state action pairs. We can think of, yeah, these are each of the state actions in each of the demonstration trajectories."},{"start":287.37,"text":"And then we could say that we want to train some policy to mimic the demonstration. So we would be training some policy. And in particular, we could think about the actions that this policy is going to take. So if we were to take one of the states in our demonstrations and run it through our policy, then we would get some sort of predicted action A-hat."},{"start":317.58,"text":"So let's say that this is sampled from pi theta given a state in the demonstration. And then we could try to basically say we want this predicted action to be as close as possible to the action that the demonstrator took. So we could then minimize the difference between the predicted action and the action in the dataset. And we could do this minimization over"}],"speech_gaps":[],"frame":"../frames/v029/002.webp","frame_time":191.14},{"title":"模仿学习（Imitation Learning）基础","segments":[{"id":12,"text":"all of the states and actions in our demonstration dataset. Once you train a policy such that the predicted actions are as close as possible to the actions in your dataset, then you can just deploy your policy. This is a policy that should be mimicking the actions in your dataset. This is version zero of imitation learning. So given demonstrations collected by an expert, you essentially do supervised regression to the expert actions.","zh":"我们演示数据集中的所有状态和动作。一旦你训练一个策略，使得预测的动作尽可能接近数据集中的动作，那么你就可以部署这个策略。这是一个模仿数据集中动作的策略。这是模仿学习的版本零。因此，给定由专家收集的演示数据，你本质上是在对专家动作进行监督回归。","start":348.22,"end":379.87},{"id":13,"text":"If your policy is a neural network, this means doing a forward pass on, you sample a mini batch from here, do a forward pass on your neural network to get the predicted actions, compute the loss, and then back propagate the loss into the parameters of the neural network. And you do that iteratively with your favorite optimizer, some form of stochastic gradient descent, in order to optimize your policy. So it's essentially a form of supervised learning.","zh":"如果你的策略是一个神经网络，这意味着你从这里采样一个迷你批次，对神经网络进行前向传播以获得预测的动作，计算损失，然后将损失反向传播到神经网络的参数中。你使用你最喜欢的优化器，某种形式的随机梯度下降，迭代地优化你的策略。因此，这本质上是一种监督学习的形式。","start":380.71,"end":408.0},{"id":14,"text":"And then from here, you can then deploy your learn policy and it should be able to mimic the expert and do something sensible. So in this case, we're considering a deterministic policy. And we're just essentially doing L2 regression. I guess here I wrote it as a stochastic policy, but let's correct that and let's have this be a deterministic policy.","zh":"然后，你可以部署你学习到的策略，并且它应该能够模仿专家并执行合理的行为。在这种情况下，我们考虑的是一个确定性策略。我们本质上只是在做L2回归。我想这里我把它写成了一个随机策略，但让我们纠正这一点，并让这个策略是一个确定性策略。","start":411.15,"end":437.45},{"id":15,"text":"The expert might not be deterministic, and that might lead to some issues. So let's actually talk about that a little bit. So what could go wrong? Let's go back to our driving example. So we have a data set from human drivers, and we recorded the states or the observations. We recorded the steering commands and any other actions that we might want to use. And let's say that for this particular car, in some cases,","zh":"专家可能不是确定性的，这可能导致一些问题。让我们实际讨论一下。那么可能会出什么问题呢？让我们回到我们的驾驶示例。我们有一个来自人类驾驶员的数据集，我们记录了状态或观察值。我们记录了转向命令和其他可能想要使用的动作。假设对于这辆车，在某些情况下，","start":439.6,"end":467.0},{"id":16,"text":"some human drivers might decide to go straight, and other drivers might decide to merge left, maybe because they want to move to a faster lane. So our dataset might contain both examples of going straight in situations like this and examples of merging left in situations like this. Now, a question for you. If you train a policy with L2 regression on a dataset that has these kinds of examples,","zh":"一些人类驾驶员可能会决定直行，而其他驾驶员可能会决定左转，也许因为他们想换到更快的车道。因此，我们的数据集可能包含这两种情况下的示例：在这种情况下直行的示例，以及在这种情况下左转的示例。现在，一个问题是：如果你在包含这些示例的数据集上使用L2回归训练策略，","start":468.4,"end":500.92}],"notes":["本段讨论了模仿学习的基本概念，即通过专家演示数据集训练策略，使策略能够模仿专家的行为。这里提到的版本零模仿学习是通过监督回归来实现的，即策略输出的动作尽可能接近专家动作。","在训练过程中，如果策略是一个神经网络，会通过前向传播、损失计算和反向传播来优化参数。使用随机梯度下降等优化器进行迭代训练，最终得到一个能够模仿专家行为的策略。","本段还指出，专家行为可能不是确定性的，这可能导致问题。例如，在驾驶场景中，不同司机可能在相同情况下做出不同决策，如直行或变道。这种不确定性会影响策略的泛化能力。","当使用L2回归训练策略时，如果数据集中存在多种可能的动作，策略可能会倾向于选择平均值，而不是最优动作。这可能导致策略在实际应用中表现不佳。","因此，模仿学习需要考虑专家行为的不确定性，并在训练过程中引入适当的机制来处理这种不确定性，例如使用概率模型或引入正则化项。","最后，本段提出了一个具体问题，即如果使用L2回归训练策略，如何处理数据集中存在多种可能动作的情况，这为后续讨论提供了切入点。"],"formulas":[],"uncertainties":[],"diagram":"none","start":348.22,"end":500.92,"asr_flags":[],"math_clarifications":["原文中提到的L2回归仅作为概念提及，未提供具体的数学公式或表达式，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":348.22,"text":"all of the states and actions in our demonstration dataset. Once you train a policy such that the predicted actions are as close as possible to the actions in your dataset, then you can just deploy your policy. This is a policy that should be mimicking the actions in your dataset. This is version zero of imitation learning. So given demonstrations collected by an expert, you essentially do supervised regression to the expert actions."},{"start":380.71,"text":"If your policy is a neural network, this means doing a forward pass on, you sample a mini batch from here, do a forward pass on your neural network to get the predicted actions, compute the loss, and then back propagate the loss into the parameters of the neural network. And you do that iteratively with your favorite optimizer, some form of stochastic gradient descent, in order to optimize your policy. So it's essentially a form of supervised learning."},{"start":411.15,"text":"And then from here, you can then deploy your learn policy and it should be able to mimic the expert and do something sensible. So in this case, we're considering a deterministic policy. And we're just essentially doing L2 regression. I guess here I wrote it as a stochastic policy, but let's correct that and let's have this be a deterministic policy."},{"start":439.6,"text":"The expert might not be deterministic, and that might lead to some issues. So let's actually talk about that a little bit. So what could go wrong? Let's go back to our driving example. So we have a data set from human drivers, and we recorded the states or the observations. We recorded the steering commands and any other actions that we might want to use. And let's say that for this particular car, in some cases,"},{"start":468.4,"text":"some human drivers might decide to go straight, and other drivers might decide to merge left, maybe because they want to move to a faster lane. So our dataset might contain both examples of going straight in situations like this and examples of merging left in situations like this. Now, a question for you. If you train a policy with L2 regression on a dataset that has these kinds of examples,"}],"speech_gaps":[],"frame":"../frames/v029/003.webp","frame_time":360.22},{"title":"模仿学习中的策略回归问题","segments":[{"id":17,"text":"What would a policy that was trained with LT regression do in a situation like this? Yeah, so the policy might go to the middle of the two lanes. And let's see why that is. So we, in this example, say we have the steering command. And if we thought about the distribution over actions that are covered in the data set for drivers that chose to go straight.","zh":"如果一个策略是通过LT回归训练的，那么在这样的情况下它会怎么做呢？是的，所以这个策略可能会驶向两条车道的中间。让我们看看为什么会出现这种情况。在这个例子中，我们假设有一个转向指令。如果我们考虑数据集中那些选择直行的驾驶员所覆盖的动作分布。","start":502.16,"end":534.07},{"id":18,"text":"their distribution of actions would look maybe something like this, where this is like zero steering command. This is like kind of staying straight. And for the drivers that chose to merge left, their distribution over actions for the steering command might look something like this. So this is the probability over actions.","zh":"他们的动作分布可能看起来像这样，其中这个是零转向指令，也就是大致保持直行。而对于那些选择向左变道的驾驶员，他们的转向指令动作分布可能看起来像这样。所以这是动作的概率分布。","start":534.65,"end":565.95},{"id":19,"text":"And then if we think about the... These are kind of the two examples. This is if they're... deciding to merge left, they maybe have a steering command of negative two. This is if you stay straight, that might have a steering command of zero. And then in your data set, the kind of overarching distribution over actions represented in the data set might look something like this, where maybe more likely people are to go straight than to merge left. But you get this kind of multimodal distribution.","zh":"然后如果我们考虑这些情况，这些是两种例子。如果他们决定向左变道，他们可能有一个转向指令为负二的值。如果保持直行，这个值可能为零。在你的数据集中，数据集所代表的动作总体分布可能看起来像这样，其中人们更有可能直行而不是向左变道。但你会得到这种多峰分布。","start":566.22,"end":593.74},{"id":20,"text":"that has two peaks, one at going straight and one at merging left. And then when you use L2 regression to try to fit this data, what it's going to do is it's going to predict the mean. So it's going to predict the mean action. In this case, the mean action would be something like here. And that would be probably not very good action to take because that might kind of straddle the lines on the highway.","zh":"这种分布有两个峰值，一个是在直行，一个是在向左变道。然后当你使用L2回归来拟合这些数据时，它所做的就是预测均值。因此，它会预测动作的均值。在这种情况下，均值动作可能像这里所示。而这个动作可能并不是一个很好的选择，因为它可能会在高速公路上横跨车道线。","start":594.48,"end":623.35},{"id":21,"text":"And also we can see that this action actually has very low probability under the data distribution. So it's also kind of objectively or mathematically a poor choice because it had low probability under what the data was doing. Yeah, so L2 regression is the equation from the previous slide. So basically minimizing this squared loss between the predicted action and the true action.","zh":"此外，我们还可以看到这个动作在数据分布下实际上具有非常低的概率。因此，从客观或数学角度来看，这也是一个糟糕的选择，因为它在数据所表现的行为下具有低概率。是的，L2回归就是上一张幻灯片中的方程。基本上，它是在最小化预测动作与真实动作之间的平方损失。","start":623.99,"end":652.74}],"notes":["本段讨论了在模仿学习中使用L2回归（最小二乘回归）拟合数据时可能产生的问题。当数据分布是多峰的（如直行和左转两种行为），L2回归会预测动作的均值，这可能导致策略在车道之间徘徊，从而产生低概率且不安全的行为。","讲者通过驾驶行为的例子说明，当数据集中直行行为的概率高于左转时，L2回归预测的均值可能位于两个车道之间，这在实际驾驶中是不合理的，因为该动作在数据分布中概率较低。","讲者指出，L2回归的目标是最小化预测动作与真实动作之间的平方损失，这会导致模型倾向于选择均值，而忽略了数据分布的多峰特性。","讲者强调，这种均值预测可能在数学上是合理的，但在实际应用中可能不适用，因为该动作在数据分布中概率较低，因此是不好的选择。","讲者提到，L2回归的方程来自上一张幻灯片，说明该方法在模仿学习中的应用，但同时也指出其局限性，即无法处理多峰分布的问题。","讲者最后提出问题，询问绿色和红色部分之间的区别，可能是为了引导学生思考不同策略或数据分布的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":502.16,"end":652.74,"asr_flags":[],"math_clarifications":["公式中的期望未明确其定义域，且未说明损失函数的归一化方式。此外，未提及任何关于数据分布或动作空间的数学假设，因此无法核定该公式的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":502.16,"text":"What would a policy that was trained with LT regression do in a situation like this? Yeah, so the policy might go to the middle of the two lanes. And let's see why that is. So we, in this example, say we have the steering command. And if we thought about the distribution over actions that are covered in the data set for drivers that chose to go straight."},{"start":534.65,"text":"their distribution of actions would look maybe something like this, where this is like zero steering command. This is like kind of staying straight. And for the drivers that chose to merge left, their distribution over actions for the steering command might look something like this. So this is the probability over actions. And then if we think about the... These are kind of the two examples. This is if they're..."},{"start":566.22,"text":"deciding to merge left, they maybe have a steering command of negative two. This is if you stay straight, that might have a steering command of zero. And then in your data set, the kind of overarching distribution over actions represented in the data set might look something like this, where maybe more likely people are to go straight than to merge left. But you get this kind of multimodal distribution."},{"start":594.48,"text":"that has two peaks, one at going straight and one at merging left. And then when you use L2 regression to try to fit this data, what it's going to do is it's going to predict the mean. So it's going to predict the mean action. In this case, the mean action would be something like here. And that would be probably not very good action to take because that might kind of straddle the lines on the highway."},{"start":623.99,"text":"And also we can see that this action actually has very low probability under the data distribution. So it's also kind of objectively or mathematically a poor choice because it had low probability under what the data was doing. Yeah, so L2 regression is the equation from the previous slide. So basically minimizing this squared loss between the predicted action and the true action. And then the other question was, what is the difference between the green and the red here?"}],"speech_gaps":[],"frame":"../frames/v029/004.webp","frame_time":514.1600000000001},{"title":"模仿学习中的分布与数据采样","segments":[{"id":22,"text":"So essentially what I'm drawing in the green is this is the distribution over kind of expert actions, maybe I'll use expert to refer to that, conditioned on only the data that chose to go straight. The blue is the distribution over expert actions if they choose to merge left. And then the red is the distribution of actions","zh":"所以，我用绿色画出的实际上是专家动作的分布，也许我会用专家来指代这个分布，条件是只考虑选择直行的数据。蓝色是专家动作的分布，如果他们选择向左合并。红色则是动作的分布","start":653.17,"end":686.56},{"id":23,"text":"represented in the data set for a given state. So this is, the red is actually what your data looks like. And this is, I'm kind of just showing, this is what the distribution looks like for kind of one part, one subset of drivers and the other subset of drivers. You're asking, can you sample from the data set and do what was in the data set, basically? Yeah. So the tricky thing with sampling from the data set and doing what's in the data set is that","zh":"在给定状态的数据集中表示。因此，红色实际上是你的数据看起来的样子。我大致是在展示，这是某一类驾驶员或另一类驾驶员的分布情况。你在问，能否从数据集中进行采样，并执行数据集中所包含的操作？是的。从数据集中进行采样并执行数据集中操作的难点在于","start":688.96,"end":716.5},{"id":24,"text":"that would look kind of like a nearest neighbors approach, kind of within the realm of machine learning. And it is in some ways a viable approach to a number of machine learning problems. But one big challenge is that ultimately when the car is driving, or when you're kind of have some sort of autonomous driving agent, it's going to face scenarios that are different from what's in the data set. And the...","zh":"这看起来有点像最近邻方法，大致在机器学习的范畴内。在某种程度上，这是解决多个机器学习问题的一种可行方法。但一个主要的挑战是，当汽车在行驶，或者当你有一个某种形式的自动驾驶代理时，它将面临与数据集中不同的场景。而且","start":717.43,"end":739.49},{"id":25,"text":"When it's in those different positions, you won't necessarily have examples in your data set that you can just pick from. So you won't necessarily be able to say like, oh, I saw what the expert did in exactly the situation because ultimately you'll be evaluating scenarios that are different. So what would you do if the actions are not numerical? We will also, in like a slide or two, we'll talk about discrete actions as well.","zh":"当它处于这些不同的位置时，你不一定能在数据集中找到可以直接选取的例子。因此，你不一定能说，哦，我在完全相同的情况下看到专家做了什么，因为最终你评估的场景是不同的。如果动作不是数值型的，你会怎么做？在接下来的几张幻灯片中，我们也会讨论离散动作的情况。","start":740.54,"end":766.52},{"id":26,"text":"So to go over this example on the slides, we can say that the data for staying straight is in yellow. The data for merging left is in blue. The combined data set, maybe because more people decided to stay straight, is shown in black, the black dotted line. And then if we train a model to minimize the L2 error, then the deterministic policy will choose to take an action.","zh":"为了在幻灯片上回顾这个例子，我们可以说明，保持直行的数据是黄色的，向左合并的数据是蓝色的。合并后的数据集，也许因为更多人选择保持直行，用黑色虚线表示。然后如果我们训练一个模型来最小化L2误差，那么确定性策略将选择采取一个动作。","start":768.2,"end":795.96},{"id":27,"text":"that's right here, which is the mean of the black distribution, which has low probability under the data. Now you might be wondering how often does this actually happen in practice? So like this is kind of maybe you might think that there's kind of a contrived example where there is kind of variability in what people would do. It turns out this actually happens all the time. People and demonstrators often do things in different ways, not just in driving and not just in like key decision states.","zh":"这就是这里的均值，它是黑色分布的均值，该分布的数据概率较低。现在你可能会想知道，在实际中这种情况究竟多常发生呢？比如说，你可能会觉得这是一个有点人为构造的例子，其中人们的行为存在一定的变异性。实际上，这种情况在现实中经常发生。人们和示范者经常以不同的方式行事，不仅仅是在驾驶中，也不仅仅是在关键决策状态下。","start":796.49,"end":827.04}],"notes":["本段主要讨论模仿学习中如何通过数据集中的分布来建模专家行为。讲者通过绿色、蓝色和红色分别表示不同决策下的动作分布，强调了在数据集中采样并执行这些动作的挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":653.17,"end":827.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":653.17,"text":"So essentially what I'm drawing in the green is this is the distribution over kind of expert actions, maybe I'll use expert to refer to that, conditioned on only the data that chose to go straight. The blue is the distribution over expert actions if they choose to merge left. And then the red is the distribution of actions"},{"start":688.96,"text":"represented in the data set for a given state. So this is, the red is actually what your data looks like. And this is, I'm kind of just showing, this is what the distribution looks like for kind of one part, one subset of drivers and the other subset of drivers. You're asking, can you sample from the data set and do what was in the data set, basically? Yeah. So the tricky thing with sampling from the data set and doing what's in the data set is that"},{"start":717.43,"text":"that would look kind of like a nearest neighbors approach, kind of within the realm of machine learning. And it is in some ways a viable approach to a number of machine learning problems. But one big challenge is that ultimately when the car is driving, or when you're kind of have some sort of autonomous driving agent, it's going to face scenarios that are different from what's in the data set. And the..."},{"start":740.54,"text":"When it's in those different positions, you won't necessarily have examples in your data set that you can just pick from. So you won't necessarily be able to say like, oh, I saw what the expert did in exactly the situation because ultimately you'll be evaluating scenarios that are different. So what would you do if the actions are not numerical? We will also, in like a slide or two, we'll talk about discrete actions as well."},{"start":768.2,"text":"So to go over this example on the slides, we can say that the data for staying straight is in yellow. The data for merging left is in blue. The combined data set, maybe because more people decided to stay straight, is shown in black, the black dotted line. And then if we train a model to minimize the L2 error, then the deterministic policy will choose to take an action."},{"start":796.49,"text":"that's right here, which is the mean of the black distribution, which has low probability under the data. Now you might be wondering how often does this actually happen in practice? So like this is kind of maybe you might think that there's kind of a contrived example where there is kind of variability in what people would do. It turns out this actually happens all the time. People and demonstrators often do things in different ways, not just in driving and not just in like key decision states."}],"speech_gaps":[],"frame":"../frames/v029/005.webp","frame_time":665.17},{"title":"模仿学习中的分布建模","segments":[{"id":28,"text":"And this happens especially when data is collected by multiple people, because people have different preferences, they have underlying ways they like about doing things, and you can't directly observe all of those preferences and all the things that might affect their behavior. And so as a result, there are some scenarios where if you have one expert policy that always takes a consistent strategy, it's okay to use a deterministic policy.","zh":"这种情况尤其发生在数据由多人收集时，因为人们有不同的偏好，他们有自己做事的潜在方式，而你无法直接观察到所有这些偏好以及可能影响他们行为的其他因素。因此，在某些情况下，如果你有一个始终采取一致策略的专家策略，使用确定性策略是可以接受的。","start":828.19,"end":853.36},{"id":29,"text":"But in many other cases, it's actually very important to make sure that you account for this kind of multimodality in the data. And so the natural question that arises from here is, instead of just learning the mean, could we actually learn to represent more of the distribution of the expert data and not just the mean? Cool. And so this is where kind of learning distributions with neural networks comes in.","zh":"但在许多其他情况下，实际上非常重要的是确保你考虑到数据中的这种多模态性。因此，由此产生的自然问题是：与其仅仅学习均值，我们是否可以学习表示更多专家数据的分布，而不仅仅是均值？很好。这就是学习分布与神经网络相关的地方。","start":853.97,"end":885.19},{"id":30,"text":"In particular, let's see, let's start a new whiteboard. So in the case of the deterministic policy, we had some neural network. I will use a box to represent a neural network. And we just were taking as input some state, and we're outputting the mean action, kind of the mean of a distribution. And so because it's only representing the mean, it's hardly a distribution at all.","zh":"具体来说，让我们开始一个新的白板。在确定性策略的情况下，我们有一个神经网络。我用一个盒子来表示神经网络。我们只是将一些状态作为输入，并输出均值动作，即分布的均值。因此，因为它只表示均值，它几乎不表示任何分布。","start":887.61,"end":919.43},{"id":31,"text":"And instead, what we'd like to be able to do is have this neural network actually output the parameters of a distribution over action. And if it can output a distribution over actions, then we should be able to capture more than just the mean. Cool. So this is often the way that we try to learn.","zh":"相反，我们希望这个神经网络能够输出动作上的分布参数。如果它能够输出动作的分布，那么我们就应该能够捕捉到比均值更多的信息。很好。因此，这通常是学习分布的方式。","start":921.09,"end":951.99},{"id":32,"text":"distributions with neural networks is we actually output the parameters of those distributions. So you can think about it as this. You have a neural network, outputs parameters. If the distribution class that you choose is very expressive, then you should be able to get an expressive distribution as output. Now let's think about a couple examples of what this might look like. So if your actions are not continuous and if instead they are discrete actions,","zh":"使用神经网络学习分布的方法是，我们实际上输出这些分布的参数。你可以这样想：你有一个神经网络，输出参数。如果你选择的分布类别非常有表现力，那么你应该能够得到一个有表现力的分布作为输出。现在让我们考虑一些这可能看起来像的例子。如果你的动作不是连续的，而是离散的动作，","start":952.58,"end":978.49}],"notes":["本段讨论了在模仿学习中，如何通过神经网络建模动作分布，而不仅仅是学习均值。讲者指出，当数据由多人收集时，由于个人偏好不同，无法直接观察所有偏好和行为影响因素，因此需要考虑数据的多模态性。","讲者提出，如果仅学习均值，可能无法充分捕捉专家数据的分布特性。因此，引入了神经网络输出分布参数的方法，以更全面地表示动作分布。","在确定性策略中，神经网络仅输出动作的均值，这实际上并未表示分布。而通过输出分布参数，可以更准确地建模动作的分布特性。","讲者强调，选择一个表达能力强的分布类，可以使得神经网络输出的分布也具有较强的表达能力。这为模仿学习提供了更丰富的建模方式。","最后，讲者提到可以考虑离散动作的情况，暗示了不同动作空间下分布建模的多样性。","整个段落围绕如何通过神经网络建模动作分布展开，强调了分布参数的重要性以及分布类选择对建模效果的影响。"],"formulas":[],"uncertainties":["distributions with neural networks is we actually output the parameters of those distributions"],"diagram":"none","start":828.19,"end":978.49,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":828.19,"text":"And this happens especially when data is collected by multiple people, because people have different preferences, they have underlying ways they like about doing things, and you can't directly observe all of those preferences and all the things that might affect their behavior. And so as a result, there are some scenarios where if you have one expert policy that always takes a consistent strategy, it's okay to use a deterministic policy."},{"start":853.97,"text":"But in many other cases, it's actually very important to make sure that you account for this kind of multimodality in the data. And so the natural question that arises from here is, instead of just learning the mean, could we actually learn to represent more of the distribution of the expert data and not just the mean? Cool. And so this is where kind of learning distributions with neural networks comes in."},{"start":887.61,"text":"In particular, let's see, let's start a new whiteboard. So in the case of the deterministic policy, we had some neural network. I will use a box to represent a neural network. And we just were taking as input some state, and we're outputting the mean action, kind of the mean of a distribution. And so because it's only representing the mean, it's hardly a distribution at all."},{"start":921.09,"text":"And instead, what we'd like to be able to do is have this neural network actually output the parameters of a distribution over action. And if it can output a distribution over actions, then we should be able to capture more than just the mean. Cool. So this is often the way that we try to learn."},{"start":952.58,"text":"distributions with neural networks is we actually output the parameters of those distributions. So you can think about it as this. You have a neural network, outputs parameters. If the distribution class that you choose is very expressive, then you should be able to get an expressive distribution as output. Now let's think about a couple examples of what this might look like. So if your actions are not continuous and if instead they are discrete actions,"}],"speech_gaps":[],"frame":"../frames/v029/006.webp","frame_time":840.19},{"title":"模仿学习中的动作分布建模","segments":[{"id":33,"text":"So maybe you're trying to train a policy to play a video game like Super Mario. Then the actions might be something like up arrow, down arrow, press A, press B, right arrow, something like that. And what you could do is what the neural network could output is basically this categorical distribution over actions, where it's going to, in this discrete case, it will output the probability of the first action, the probability of the second action, the probability of the third action, and so forth.","zh":"所以也许你正在尝试训练一个策略来玩像超级马里奥这样的视频游戏。那么动作可能是像上箭头、下箭头、按A键、按B键、右箭头之类的。你可以做的事情是，神经网络输出的基本上是一个动作上的分类分布，在这种离散情况下，它将输出第一个动作的概率、第二个动作的概率、第三个动作的概率，依此类推。","start":979.26,"end":1008.34},{"id":34,"text":"And so you can think of this sort of as a classification problem. And this distribution is actually maximally expressive. And what I mean by that is that there isn't any distribution over actions that this cannot represent because it's a fairly simple kind of categorical or pretty simple set of discrete possible options.","zh":"因此，你可以将这种问题看作是一种分类问题。这个分布实际上具有最大的表达能力。我的意思是，这种分布可以表示任何动作上的分布，因为它是一种相对简单的分类或相当简单的离散可能选项集合。","start":1010.03,"end":1034.59},{"id":35,"text":"So this is actually really nice. We can get a really expressive distribution this way. Unfortunately, a lot of the world is not just one-dimensional discrete action choices. We often have much more complex actions, and that's why we need to think about how to model distributions over those actions. So if we move towards continuous actions...","zh":"所以这实际上是非常棒的。我们可以用这种方式获得一个非常具有表达能力的分布。不幸的是，世界上很多东西并不是简单的单维离散动作选择。我们经常面对更加复杂的动作，这就是为什么我们需要考虑如何建模这些动作上的分布。因此，如果我们转向连续动作……","start":1035.69,"end":1057.44},{"id":36,"text":"like in a driving scenario where you have steering commands, for example. The most natural thing to do is to use a Gaussian distribution. We talked about outputting just the mean of a Gaussian distribution, which corresponds to minimizing the squared error. But you can also have the neural network output the variance. Unfortunately, if you have it output the variance, it's not going to do anything.","zh":"例如在驾驶场景中，你有转向指令。最自然的做法是使用高斯分布。我们之前讨论过输出高斯分布的均值，这对应于最小化平方误差。但你也可以让神经网络输出方差。不幸的是，如果你让它输出方差，它不会做任何特别的事情。","start":1058.81,"end":1081.99},{"id":37,"text":"particularly helpful in this example. It'll just output a wider variance Gaussian in order to try to cover more probability mass. And it's not very expressive. And so we want to be able to use distribution classes that are more expressive so that we can try to ultimately get actions that are high probability.","zh":"在本例中，这并不特别有用。它只会输出一个更宽的方差高斯分布，以试图覆盖更多的概率质量。而它表达能力并不强。因此，我们希望使用更具表达能力的分布类别，以便最终获得高概率的动作。","start":1083.42,"end":1111.52},{"id":38,"text":"Would we be happy if we can perfectly model this? Or would that still lead to issues where you might have an indecisive policy that chooses one mode and then chooses another mode? The answer here is that if you have a good state representation, then you should be happy. And in particular, say you modeled this perfectly and, for example, you chose this and then you merge left, you start merging left, then if you know that you've started to merge left and your velocity is moving left,","zh":"如果我们能够完美地建模这个分布，我们会感到满意吗？或者即使这样，是否仍会导致问题，例如策略在不同模式之间犹豫不决？答案是，如果你有一个良好的状态表示，那么你应该感到满意。具体来说，假设你完美地建模了这个分布，例如你选择了某个动作并开始向左变道，一旦你知道你已经开始向左变道，并且你的速度也在向左移动，","start":1112.53,"end":1141.22},{"id":39,"text":"then the data should continue moving left.","zh":"那么数据应该继续向左移动。","start":1141.69,"end":1144.59},{"id":40,"text":"And so then at that point, the distribution of reactions","zh":"因此，在那个时刻，反应的分布","start":1144.75,"end":1147.63},{"id":41,"text":"should look kind of something more like this","zh":"应该看起来更像这样","start":1147.63,"end":1151.01},{"id":42,"text":"once you are in that state at that point.","zh":"一旦你处于那个状态的那一刻。","start":1152.13,"end":1154.41},{"id":43,"text":"So if you have a good demonstration data set","zh":"因此，如果你有一个良好的演示数据集","start":1155.81,"end":1158.23}],"notes":["本段讨论了在模仿学习中如何建模连续动作分布的问题。讲者指出，在像驾驶这样的场景中，使用高斯分布是自然的选择，但仅输出均值可能不足以捕捉动作的不确定性。输出方差虽然可以增加分布的覆盖范围，但可能无法有效表达动作的复杂性，因此需要更表达力强的分布模型。","讲者进一步指出，即使能够完美建模动作分布，如果状态表示不够好，仍可能导致策略犹豫不决，选择不同的模式。因此，良好的状态表示对于确保策略的连贯性和一致性至关重要。","讲者通过驾驶场景的例子说明，当状态表示足够好时，系统应该能够根据当前状态和动作的连续性，生成合理的动作分布。例如，当车辆开始向左变道时，系统应能根据当前速度和状态，生成向左移动的分布。","讲者提到，如果状态表示足够好，那么在特定状态下，动作分布应该能够反映出当前的动态特性，从而确保策略的连贯性和合理性。","讲者强调，模仿学习中需要使用更表达力强的分布模型，以捕捉动作的复杂性和不确定性，从而生成高概率的动作。","最后，讲者指出，如果拥有良好的演示数据集，可以更好地建模动作分布，从而生成更准确和连贯的策略。"],"formulas":[],"uncertainties":["uncertain if the variance is being outputted correctly in the context of the distribution"],"diagram":"none","start":979.26,"end":1158.23,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":979.26,"text":"So maybe you're trying to train a policy to play a video game like Super Mario. Then the actions might be something like up arrow, down arrow, press A, press B, right arrow, something like that. And what you could do is what the neural network could output is basically this categorical distribution over actions, where it's going to, in this discrete case, it will output the probability of the first action, the probability of the second action, the probability of the third action, and so forth."},{"start":1010.03,"text":"And so you can think of this sort of as a classification problem. And this distribution is actually maximally expressive. And what I mean by that is that there isn't any distribution over actions that this cannot represent because it's a fairly simple kind of categorical or pretty simple set of discrete possible options."},{"start":1035.69,"text":"So this is actually really nice. We can get a really expressive distribution this way. Unfortunately, a lot of the world is not just one-dimensional discrete action choices. We often have much more complex actions, and that's why we need to think about how to model distributions over those actions. So if we move towards continuous actions..."},{"start":1058.81,"text":"like in a driving scenario where you have steering commands, for example. The most natural thing to do is to use a Gaussian distribution. We talked about outputting just the mean of a Gaussian distribution, which corresponds to minimizing the squared error. But you can also have the neural network output the variance. Unfortunately, if you have it output the variance, it's not going to do anything."},{"start":1083.42,"text":"particularly helpful in this example. It'll just output a wider variance Gaussian in order to try to cover more probability mass. And it's not very expressive. And so we want to be able to use distribution classes that are more expressive so that we can try to ultimately get actions that are high probability. Yeah, so the question was, if we have some action distribution that looks like this, for example,"},{"start":1112.53,"text":"Would we be happy if we can perfectly model this? Or would that still lead to issues where you might have an indecisive policy that chooses one mode and then chooses another mode? The answer here is that if you have a good state representation, then you should be happy. And in particular, say you modeled this perfectly and, for example, you chose this and then you merge left, you start merging left, then if you know that you've started to merge left and your velocity is moving left,"},{"start":1141.69,"text":"then the data should continue moving left."},{"start":1144.75,"text":"And so then at that point, the distribution of reactions"},{"start":1147.63,"text":"should look kind of something more like this"},{"start":1152.13,"text":"once you are in that state at that point."},{"start":1155.81,"text":"So if you have a good demonstration data set"}],"speech_gaps":[],"frame":"../frames/v029/007.webp","frame_time":991.26},{"title":"模仿学习的目标与策略","segments":[{"id":44,"text":"and a good state representation,","zh":"并且有一个良好的状态表示，","start":1158.23,"end":1159.49},{"id":45,"text":"if you perfectly model the demonstrations,","zh":"如果你完美地建模了示范行为，","start":1159.85,"end":1161.67},{"id":46,"text":"you will get a good policy out.","zh":"你将得到一个良好的策略。","start":1162.11,"end":1164.13},{"id":47,"text":"So the question is, is the only goal in imitation learning","zh":"因此，问题是，模仿学习的唯一目标","start":1165.11,"end":1167.77},{"id":48,"text":"to mimic the expert, or is there some assumption","zh":"是否仅仅是模仿专家，还是存在一些假设","start":1167.77,"end":1169.55},{"id":49,"text":"that the expert was maximizing some reward generally you want if you kind of","zh":"即专家在最大化某种奖励，你想要的大概是","start":1169.55,"end":1176.05},{"id":50,"text":"assume that what you're trying to imitate is good the but it doesn't","zh":"假设你试图模仿的是好的，但并不","start":1176.05,"end":1181.77},{"id":51,"text":"necessarily need to be the optimal policy and in many cases like many real","zh":"一定需要是最优策略，在许多情况下，比如许多现实","start":1181.77,"end":1187.17},{"id":52,"text":"world practical messy scenarios getting the optimal policy is like hopeless in","zh":"在现实混乱的场景中，获得最优策略就像是不可能的","start":1187.17,"end":1191.29},{"id":53,"text":"some ways so yeah generally we assume that you're trying to mimic something","zh":"在某些方面，是的，通常我们假设你是在尝试模仿某样东西","start":1191.29,"end":1194.71},{"id":54,"text":"good and really the focus is on trying to imitate that yeah so the question is","zh":"而实际上重点是尝试去模仿它，是的，所以问题是","start":1194.71,"end":1199.29},{"id":55,"text":"in this case, if we do this perfectly and are we happy with sampling a mode that is underrepresented,","zh":"在这种情况下，如果我们做到完美，我们是否满意于采样一个被低估的模式，","start":1199.29,"end":1205.19},{"id":56,"text":"there are scenarios where you might want to try to essentially do better than the expert,","zh":"有一些场景你可能想要尝试本质上做得比专家更好，","start":1206.83,"end":1211.69},{"id":57,"text":"and maybe in some cases this mode is actually better, or maybe in some cases this mode is","zh":"也许在某些情况下这个模式实际上更好，或者也许在某些情况下这个模式","start":1211.83,"end":1215.77},{"id":58,"text":"really better. If you want to outperform the expert, that's more where reinforcement learning","zh":"真的更好。如果你想超越专家，那就是强化学习","start":1215.77,"end":1221.31},{"id":59,"text":"comes in and other tools come in. You could also try to curate your data set to try to","zh":"发挥作用的地方，其他工具也会发挥作用。你也可以尝试整理你的数据集以尝试去","start":1221.31,"end":1225.47},{"id":60,"text":"contain more of the stuff that you think is better.","zh":"包含更多你认为更好的内容。","start":1225.47,"end":1228.23},{"id":61,"text":"With imitation learning, generally everything that we'll talk about in this lecture is trying to meet expert performance or meet the demonstrator performance and not exceed it. Yeah, so the question is, should the parameters of the distribution over actions be state dependent? And yeah, absolutely. I've been writing this as kind of the parameters of P of A, but everything here is implicitly dependent on the state because this is the output of a neural network that was conditioned on the state.","zh":"在模仿学习中，我们将在本节课中讨论的一切内容，都是试图达到专家水平或演示者水平，而不会超过它。是的，所以问题是，动作分布的参数是否应该依赖于状态？是的，绝对应该。我一直在将这些写成P(A)的参数，但这里的每一个内容都是隐式地依赖于状态的，因为这是由一个以状态为条件的神经网络的输出。","start":1230.78,"end":1256.5},{"id":62,"text":"And so in some states, it might choose to output a distribution that's really multimodal. In other cases, it might choose to output a distribution that is much more unimodal. Cool. So let's talk about some more interesting expressive distributions with neural networks. And some of these will build upon tools in generative modeling. And in particular, if we think about some examples of generative models, we won't go into all the details of these. But one example of a generative model that you might have seen before is called a diffusion model.","zh":"因此，在某些状态下，它可能会选择输出一个非常多元分布的分布。在其他情况下，它可能会选择输出一个更加单峰分布。很好。那么让我们讨论一些更有趣的表达分布，这些分布将基于生成建模中的工具。特别是，如果我们考虑一些生成模型的例子，我们不会深入讨论这些细节。但你可能之前见过的一个生成模型的例子叫做扩散模型。","start":1256.92,"end":1287.73},{"id":63,"text":"And this is a model that can output and generate images of different people, can be used to generate videos and so forth. It's very popular for generative models over visual data. And the thing that's really cool about these kinds of image diffusion models is that they are able to represent a very diverse distribution over images, including images that are completely different from one another.","zh":"这是一种可以输出和生成不同人物图像、可以用于生成视频等的模型。它在视觉数据上的生成模型中非常流行。这些图像扩散模型真正酷的地方在于，它们能够表示非常多样化的图像分布，包括彼此完全不同的图像。","start":1288.3,"end":1313.62}],"notes":["本段讨论了模仿学习的目标是否仅仅是模仿专家行为，还是需要假设专家在最大化某种奖励。讲者指出，模仿学习的目标通常是模仿一个良好的策略，而不一定是最优策略，因为在现实复杂场景中，找到最优策略可能非常困难。","讲者进一步说明，如果完全模仿专家行为，可能会遇到采样到低概率模式的问题，这在某些情况下可能需要改进，例如通过强化学习或其他工具来超越专家表现。","讲者提到，模仿学习的目标通常是达到专家水平，而不是超越，因此参数分布是否依赖于状态是一个关键问题。讲者指出，参数分布实际上隐含依赖于状态，因为输出是基于状态的神经网络。","讲者还提到，神经网络可以输出多模态或单模态的分布，这取决于状态。这表明模仿学习中策略的表达能力可以非常灵活。","最后，讲者引入了生成模型的概念，特别是扩散模型，作为生成图像和视频的工具，并指出这些模型能够表示非常多样化的图像分布。","讲者强调，模仿学习的目标是达到专家表现，而不是超越，因此在设计策略时需要考虑如何有效模仿专家行为，同时避免采样到低概率模式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1158.23,"end":1313.62,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":1158.23,"text":"and a good state representation,"},{"start":1159.85,"text":"if you perfectly model the demonstrations,"},{"start":1162.11,"text":"you will get a good policy out."},{"start":1165.11,"text":"So the question is, is the only goal in imitation learning"},{"start":1167.77,"text":"to mimic the expert, or is there some assumption"},{"start":1169.55,"text":"that the expert was maximizing some reward generally you want if you kind of"},{"start":1176.05,"text":"assume that what you're trying to imitate is good the but it doesn't"},{"start":1181.77,"text":"necessarily need to be the optimal policy and in many cases like many real"},{"start":1187.17,"text":"world practical messy scenarios getting the optimal policy is like hopeless in"},{"start":1191.29,"text":"some ways so yeah generally we assume that you're trying to mimic something"},{"start":1194.71,"text":"good and really the focus is on trying to imitate that yeah so the question is"},{"start":1199.29,"text":"in this case, if we do this perfectly and are we happy with sampling a mode that is underrepresented,"},{"start":1206.83,"text":"there are scenarios where you might want to try to essentially do better than the expert,"},{"start":1211.83,"text":"and maybe in some cases this mode is actually better, or maybe in some cases this mode is"},{"start":1215.77,"text":"really better. If you want to outperform the expert, that's more where reinforcement learning"},{"start":1221.31,"text":"comes in and other tools come in. You could also try to curate your data set to try to"},{"start":1225.47,"text":"contain more of the stuff that you think is better."},{"start":1230.78,"text":"With imitation learning, generally everything that we'll talk about in this lecture is trying to meet expert performance or meet the demonstrator performance and not exceed it. Yeah, so the question is, should the parameters of the distribution over actions be state dependent? And yeah, absolutely. I've been writing this as kind of the parameters of P of A, but everything here is implicitly dependent on the state because this is the output of a neural network that was conditioned on the state."},{"start":1256.92,"text":"And so in some states, it might choose to output a distribution that's really multimodal. In other cases, it might choose to output a distribution that is much more unimodal. Cool. So let's talk about some more interesting expressive distributions with neural networks. And some of these will build upon tools in generative modeling. And in particular, if we think about some examples of generative models, we won't go into all the details of these. But one example of a generative model that you might have seen before is called a diffusion model."},{"start":1288.3,"text":"And this is a model that can output and generate images of different people, can be used to generate videos and so forth. It's very popular for generative models over visual data. And the thing that's really cool about these kinds of image diffusion models is that they are able to represent a very diverse distribution over images, including images that are completely different from one another."}],"speech_gaps":[{"start":1228.63,"end":1230.38}],"frame":"../frames/v029/008.webp","frame_time":1170.23},{"title":"生成模型与分布建模","segments":[{"id":64,"text":"Another example of a generative model is an autoregressive model. You can think about this as essentially like what happens with language modeling, where you're predicting one kind of token or one word at a time. And this is also a really powerful model, and it's much more powerful than just outputting the distribution, like at the mean invariance of a Gaussian, and much more powerful than outputting, for example, the categorical distribution over one dimension.","zh":"另一个生成模型的例子是自回归模型。你可以将其视为类似于语言建模的过程，其中你一次预测一种标记或一个单词。这也是一个非常强大的模型，它比仅仅输出分布（例如高斯分布的均值不变性）要强大得多，也比输出单维上的分类分布要强大得多。","start":1315.09,"end":1344.49},{"id":65,"text":"So you can think about these two as most typically used to represent either the probability of an image given a text description or the probability of the next word given the word so far. The reason why they're often used in these contexts is because these are very common problems that people work on a lot and also because they're very well suited for addressing these kinds of problems.","zh":"因此，你可以将这两种模型通常用于表示给定文本描述的图像概率，或者给定当前单词的下一个单词概率。它们经常用于这些情境的原因是，这些是非常常见且人们经常研究的问题，同时也是解决这些问题非常合适的工具。","start":1346.19,"end":1371.89},{"id":66,"text":"But the underlying technique behind image diffusion models and autoregressive models is extremely general. And you can use the same idea to learn a distribution over actions given observations or given states. So let's talk a little bit about how we might use some of these tools to learn that distribution. So our goal is to approximate P of A given S. One example, one kind of...","zh":"但图像扩散模型和自回归模型背后的底层技术是非常通用的。你也可以使用同样的思想来学习给定观测或状态的动作分布。那么，让我们稍微讨论一下我们如何利用这些工具来学习这种分布。我们的目标是近似给定状态 S 的动作分布 P(A|S)。一个例子，一种……","start":1372.81,"end":1402.55},{"id":67,"text":"maybe form of generative model that's simpler than those two that we'll start with as a mixture of Gaussians. And a mixture of Gaussians is already a lot more expressive than just a single Gaussian. And so it's a case where we're trying to model a distribution as a combination of Gaussians. And so in this case, instead of just having the neural network output mu, we'll have it output the parameters of a Gaussian mixture model distribution. And so in the case","zh":"可能是比前两种更简单的生成模型，我们将从高斯混合模型开始。高斯混合模型已经比单一高斯分布更具表现力。因此，这是一个我们试图将分布建模为多个高斯分布组合的情况。在这种情况下，我们不再让神经网络仅输出均值 μ，而是让它输出高斯混合模型分布的参数。因此，在这种情况下","start":1403.03,"end":1432.63},{"id":68,"text":"of a DMM, it will output the mean, stair and deviation, and weight associated with one Gaussian, also the mean, stair and deviation, and weight of a second Gaussian, and so on. And you might, if you have n different components, it will output n different parameters for different Gaussians.","zh":"对于 DMM，它将输出一个高斯分布的均值、阶梯和偏差以及相关权重，以及第二个高斯分布的均值、阶梯和偏差以及权重，依此类推。如果你有 n 个不同的组成部分，它将输出 n 个不同高斯分布的参数。","start":1433.29,"end":1461.31},{"id":69,"text":"Yeah, so the question is, can we elaborate more on, like, what does it mean for these distributions to be more or less expressive? Yeah, so essentially it is referring to, if you have some underlying distribution, it's like how, maybe I'll actually rephrase it slightly differently. So one way to think about it is it's essentially the number of different distributions you can capture, like perfectly.","zh":"是的，所以问题是，我们能否更详细地解释一下，这些分布的表达能力更强或更弱是什么意思？是的，所以本质上它指的是，如果你有一些基础分布，它就像是如何，也许我会稍微换个说法。一种思考方式是，它实际上指的是你能捕捉到的不同分布的数量，比如完美地。","start":1462.28,"end":1490.75}],"notes":["本段讨论了生成模型在分布建模中的应用，特别是高斯混合模型（GMM）如何通过组合多个高斯分布来增强表达能力。讲者提到，与单一高斯分布相比，GMM能够更灵活地拟合复杂的数据分布，这体现在模型输出多个高斯分布的参数（均值、方差、权重）。","讲者指出，生成模型如自回归模型和扩散模型可以用于建模动作分布，即给定观测或状态时的动作概率分布。这表明生成模型不仅限于图像或文本，还可以扩展到强化学习中的动作空间建模。","在讨论表达能力时，讲者强调了分布表达能力的定义，即模型能够拟合的分布数量。这与模型的参数数量和结构有关，更复杂的模型通常具有更高的表达能力。","讲者提到，生成模型的参数输出方式（如输出多个高斯分布的参数）是其表达能力增强的关键因素。这表明模型的结构设计直接影响其对复杂分布的拟合能力。","讲者通过重新表述的方式解释了表达能力的概念，强调了模型对不同分布的拟合能力，这与模型的灵活性和参数数量密切相关。","本段还涉及生成模型在强化学习中的潜在应用，即通过建模动作分布来实现模仿学习，这为后续讨论生成模型在强化学习中的具体应用奠定了基础。"],"formulas":[{"latex":"P(A\\mid S)","symbols":"动作给定状态的概率分布","explanation":"保持原公式，无需修改，表示给定状态S下动作A的概率分布。","evidence":"But the underlying technique behind image diffusion models and autoregressive models is extremely general. And you can use the same idea to learn a distribution over actions given observations or given states. So let's talk a little bit about how we might use some of these tools to learn that distribution. So our goal is to approximate P of A given S. One example, one kind of..."},{"latex":"GMM","symbols":"高斯混合模型","explanation":"保持原公式，无需修改，表示高斯混合模型的缩写。","evidence":"maybe form of generative model that's simpler than those two that we'll start with as a mixture of Gaussians. And a mixture of Gaussians is already a lot more expressive than just a single Gaussian. And so it's a case where we're trying to model a distribution as a combination of Gaussians. And so in this case, instead of just having the neural network output mu, we'll have it output the parameters of a Gaussian mixture model distribution. And so in the case"}],"uncertainties":["stair"],"diagram":"none","start":1315.09,"end":1490.75,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1315.09,"text":"Another example of a generative model is an autoregressive model. You can think about this as essentially like what happens with language modeling, where you're predicting one kind of token or one word at a time. And this is also a really powerful model, and it's much more powerful than just outputting the distribution, like at the mean invariance of a Gaussian, and much more powerful than outputting, for example, the categorical distribution over one dimension."},{"start":1346.19,"text":"So you can think about these two as most typically used to represent either the probability of an image given a text description or the probability of the next word given the word so far. The reason why they're often used in these contexts is because these are very common problems that people work on a lot and also because they're very well suited for addressing these kinds of problems."},{"start":1372.81,"text":"But the underlying technique behind image diffusion models and autoregressive models is extremely general. And you can use the same idea to learn a distribution over actions given observations or given states. So let's talk a little bit about how we might use some of these tools to learn that distribution. So our goal is to approximate P of A given S. One example, one kind of..."},{"start":1403.03,"text":"maybe form of generative model that's simpler than those two that we'll start with as a mixture of Gaussians. And a mixture of Gaussians is already a lot more expressive than just a single Gaussian. And so it's a case where we're trying to model a distribution as a combination of Gaussians. And so in this case, instead of just having the neural network output mu, we'll have it output the parameters of a Gaussian mixture model distribution. And so in the case"},{"start":1433.29,"text":"of a DMM, it will output the mean, stair and deviation, and weight associated with one Gaussian, also the mean, stair and deviation, and weight of a second Gaussian, and so on. And you might, if you have n different components, it will output n different parameters for different Gaussians."},{"start":1462.28,"text":"Yeah, so the question is, can we elaborate more on, like, what does it mean for these distributions to be more or less expressive? Yeah, so essentially it is referring to, if you have some underlying distribution, it's like how, maybe I'll actually rephrase it slightly differently. So one way to think about it is it's essentially the number of different distributions you can capture, like perfectly."}],"speech_gaps":[],"frame":"../frames/v029/009.webp","frame_time":1327.09},{"title":"模仿学习中的生成模型与分布表示","segments":[{"id":70,"text":"with that chosen representation. And so if you only use a Gaussian, then you can only perfectly model Gaussian distributions. Whereas if you use a Gaussian mixture model, you can represent any individual Gaussian, but you can also represent any distribution that can be represented perfectly as a combination of Gaussians. And so it's strictly more expressive than using a single Gaussian.","zh":"有了这种选定的表示方式。因此，如果你只使用高斯分布，那么你只能完美地建模高斯分布。而如果你使用高斯混合模型，你不仅可以表示任何单个高斯分布，还可以表示任何可以被完美表示为高斯分布组合的分布。因此，它比使用单个高斯分布更具表达能力。","start":1491.41,"end":1517.65},{"id":71,"text":"Now, in some cases, it can be difficult to compare two different distribution classes because in some ways some might be more expressive or less expressive. But in the case of Gaussian mixture models, it's strictly more expressive than a Gaussian. Yeah, the question is, do you need to pick the number of Gaussians ahead of time? Yes, you do. You can think about it as a hyperparameter and you could experiment and look at how well are you fitting the data with different numbers of mixture components. Okay. And then there's two other examples of generative models that we could use.","zh":"在某些情况下，比较两个不同的分布类可能会有困难，因为在某些方面，某些分布类可能更具表达能力或更不具表达能力。但在高斯混合模型的情况下，它比高斯分布严格更具表达能力。是的，问题是，你是否需要提前选择高斯分布的数量？是的，你需要。你可以将其视为一个超参数，并且可以进行实验，查看使用不同数量的混合成分时数据拟合的效果如何。好的。然后还有另外两个生成模型的例子。","start":1519.41,"end":1549.08},{"id":72,"text":"The second one is discretized and autoregressive, which is just like language models. And the third would be to use something like diffusion, but diffusion over actions instead of diffusion over images. And so we talked a little bit just now about mixtures of Gaussians, where we'll be outputting basically the parameters of a Gaussian mixture model.","zh":"第二个是离散化和自回归模型，这与语言模型类似。第三个则是使用类似扩散的方法，但不是在图像上进行扩散，而是在动作上进行扩散。因此，我们刚才简要讨论了高斯混合模型，我们将输出基本上是高斯混合模型的参数。","start":1550.3,"end":1576.52},{"id":73,"text":"Now let's talk a little bit about... kind of a scenario where we could try to use an autoregressive model, like a language model, in order to generate action. So in this case, there's a couple scenarios where you might want to use this. So you might be in a scenario where your actions are already discrete, and you actually don't need to discretize in that case. Or you might be in a scenario where it's multidimensional.","zh":"现在让我们简要讨论一下，一种可以尝试使用自回归模型（如语言模型）来生成动作的场景。在这种情况下，存在几种你可能想要使用它的场景。你可能处于一个动作已经是离散的场景，此时你实际上不需要进行离散化。或者你可能处于一个场景，其中动作是多维的。","start":1577.55,"end":1606.63},{"id":74,"text":"Or you might be in a scenario where they are actually continuous and multidimensional, and then you need to discretize or tokenize first and then use an autoregressive model. And so if we think about this back in the driving example, so this will be if we use discretize plus autoregressive. In this case, let's say that we're in the driving case and","zh":"或者你可能处于一个场景，其中动作实际上是连续且多维的，此时你需要先进行离散化或分词，然后再使用自回归模型。因此，如果我们回到驾驶的例子，这将是如果我们使用离散化加自回归模型的情况。在这种情况下，假设我们处于驾驶的场景中，","start":1607.16,"end":1636.22},{"id":75,"text":"We'll just consider a simplified driving case where the first action is the steering angle and the second action is the acceleration. So if we wanted to represent a distribution over these actions using an autoregressive model, there's two things that we would want to do. The first would be to discretize and the second then would be to formulate the autoregressive model.","zh":"我们将考虑一个简化的驾驶案例，其中第一个动作是转向角度，第二个动作是加速度。因此，如果我们想要使用自回归模型来表示这些动作的分布，我们需要做两件事。第一件事是离散化，第二件事则是构建自回归模型。","start":1637.46,"end":1669.26}],"notes":["本段讨论了生成模型中不同分布表示方法的表达能力，指出高斯混合模型（GMM）比单一高斯分布更强大，因为它可以表示任何由高斯分布组合而成的分布。同时，讲者提到在某些情况下，比较不同分布类别的表达能力可能具有挑战性，但GMM的表达能力是严格更强的。","讲者进一步说明了在使用GMM时，需要预先确定高斯分布的数量，并将其视为超参数。通过实验不同数量的混合成分，可以评估模型对数据的拟合效果。此外，还提到了两种其他生成模型的例子：离散化和自回归模型，以及基于扩散的模型，但后者是针对动作而非图像。","在讨论自回归模型的应用场景时，讲者指出，当动作是离散的时，不需要离散化；而当动作是连续且多维时，需要先进行离散化或分词处理，再使用自回归模型。以驾驶场景为例，讲者提到可以将驾驶动作分解为转向角和加速度两个部分。","讲者进一步说明了如何使用自回归模型表示动作分布，包括两个步骤：离散化和构建自回归模型。这表明在实际应用中，需要将连续动作转换为离散形式，以便于模型处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1491.41,"end":1669.26,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1491.41,"text":"with that chosen representation. And so if you only use a Gaussian, then you can only perfectly model Gaussian distributions. Whereas if you use a Gaussian mixture model, you can represent any individual Gaussian, but you can also represent any distribution that can be represented perfectly as a combination of Gaussians. And so it's strictly more expressive than using a single Gaussian. Now, in some cases, it can be difficult to"},{"start":1519.41,"text":"compare two different distribution classes because in some ways some might be more expressive or less expressive. But in the case of Gaussian mixture models, it's strictly more expressive than a Gaussian. Yeah, the question is, do you need to pick the number of Gaussians ahead of time? Yes, you do. You can think about it as a hyperparameter and you could experiment and look at how well are you fitting the data with different numbers of mixture components. Okay. And then there's two other examples of generative models that we could use."},{"start":1550.3,"text":"The second one is discretized and autoregressive, which is just like language models. And the third would be to use something like diffusion, but diffusion over actions instead of diffusion over images. And so we talked a little bit just now about mixtures of Gaussians, where we'll be outputting basically the parameters of a Gaussian mixture model. Now let's talk a little bit about..."},{"start":1577.55,"text":"kind of a scenario where we could try to use an autoregressive model, like a language model, in order to generate action. So in this case, there's a couple scenarios where you might want to use this. So you might be in a scenario where your actions are already discrete, and you actually don't need to discretize in that case. Or you might be in a scenario where it's multidimensional."},{"start":1607.16,"text":"Or you might be in a scenario where they are actually continuous and multidimensional, and then you need to discretize or tokenize first and then use an autoregressive model. And so if we think about this back in the driving example, so this will be if we use discretize plus autoregressive. In this case, let's say that we're in the driving case and"},{"start":1637.46,"text":"We'll just consider a simplified driving case where the first action is the steering angle and the second action is the acceleration. So if we wanted to represent a distribution over these actions using an autoregressive model, there's two things that we would want to do. The first would be to discretize and the second then would be to formulate the autoregressive model."}],"speech_gaps":[],"frame":"../frames/v029/010.webp","frame_time":1503.41},{"title":"模仿学习中的分布建模与离散化","segments":[{"id":76,"text":"In particular, when we use autoregressive models, it means that we're going to be essentially predicting one dimension at a time. So if we first want to model a distribution over the first dimension of the action, what we would do is, in the case of steering, so we have P steering, say that we wanted our prediction to look something like this. Now a Gaussian can't represent this, and so...","zh":"特别是，当我们使用自回归模型时，这意味着我们将一次预测一个维度。因此，如果我们首先想要对动作的第一个维度建模，我们所做的就是，在转向的情况下，比如说我们希望我们的预测看起来像这样。现在高斯分布无法表示这种情况，因此...","start":1670.84,"end":1701.98},{"id":77,"text":"we would choose to discretize it and represent a discretized distribution and what that would look like is essentially kind of creating bins for the different steering angles and you would then output a probability for each bin and then this kind of something that looks a little bit closer to like a staircase these bars would be","zh":"我们会选择对其进行离散化，并表示一个离散化的分布，这种分布看起来基本上是为不同的转向角度创建一些区间（bins），然后你会为每个区间输出一个概率，这些看起来有点像阶梯状的条形图，这些条形图就是","start":1702.35,"end":1729.9},{"id":78,"text":"the distribution that you're actually using to approximate the original distribution. And so you could then, in this case, output. So for the first dimension, you would be outputting each of the probability values for each of these bars, like the height of each of these bars. So this gives you a fairly expressive distribution over angle. And then you could choose to have a more fine discretization or a more coarse discretization. And if it's more fine,","zh":"你实际用来近似原始分布的分布。因此在这种情况下，你可以输出。因此对于第一个维度，你会输出每个条形图的概率值，也就是每个条形图的高度。这为你提供了对角度的相当有表现力的分布。然后你可以选择更精细的离散化或更粗糙的离散化。如果更精细，","start":1730.75,"end":1761.22},{"id":79,"text":"you get more expressivity in terms of what you can represent, but you also have to output more numbers, so there's a trade-off there. And then once you output a distribution over the angle, then you would want to output a distribution over acceleration. And in particular, in the case of merging left versus going straight, if you're merging left, probably you would be accelerating more because there was a car kind of back and left, whereas if you're going straight, you're probably more likely to be","zh":"你在表示能力方面会有更多的表达力，但你也必须输出更多的数值，因此存在权衡。一旦你输出了角度的分布，你就会想要输出加速度的分布。特别是，在合并左转与直行的情况下，如果你要合并左转，你可能加速更多，因为有一辆车在你后面和左边，而如果你直行，你更可能保持当前速度。他们希望我们的加速度分布是根据所选择的转向角度进行条件化的。因此，我们将预测P-angle，然后从这个分布中进行采样。我们将称这个","start":1761.7,"end":1789.07},{"id":80,"text":"more likely to be keeping your current speed. They want our distribution over acceleration to be conditioned on which steering angle we chose. So what we'll do is we'll predict P-angle and then we will sample a steering angle from this. We'll refer to this","zh":"更可能保持当前速度。它们希望我们的加速度分布要根据所选择的转向角度进行条件建模。因此，我们将预测P-angle，然后从此分布中采样一个转向角度。我们将称这个为","start":1790.67,"end":1819.59},{"id":81,"text":"for now is AT1 because it's the first dimension of the action. We'll sample it from this distribution here. And then we want to get a distribution over the second dimension conditioned on the first dimension. And to do this, we'll then pass our predicted action or the sampled action back into our model and then have our model output another distribution. And in this case, if you","zh":"目前是AT1，因为它代表动作的第一个维度。我们将从此分布中进行采样。然后，我们希望根据第一个维度获得第二个维度的分布。为此，我们将预测的动作或采样后动作再次输入到模型中，让模型输出另一个分布。在这种情况下，如果你","start":1820.3,"end":1850.17}],"notes":["本段讲解了在模仿学习中使用自回归模型时，如何对动作空间进行离散化处理。讲者提到，当使用高斯分布无法准确表示某些分布时，可以采用离散化方法，将连续的动作空间划分为多个区间（bins），并为每个区间分配概率值。这种离散化方法类似于阶梯状的分布，每个区间的高度代表该区间的概率。","讲者进一步说明，离散化的粒度（即区间划分的精细程度）会影响模型的表达能力。更精细的离散化可以提供更丰富的分布表示，但需要输出更多的数值，因此存在表达能力与计算复杂度之间的权衡。","在处理多维动作空间时，讲者提到，模型需要对每个维度进行条件分布建模。例如，在处理转向角度后，模型需要根据所选的转向角度，输出一个关于加速度的条件分布。这种条件分布建模是模仿学习中处理多维动作空间的关键步骤。","讲者通过具体例子说明了条件分布建模的逻辑：在合并左转和直行的情况下，模型需要根据转向角度的不同，输出不同的加速度分布。例如，左转时可能需要加速，而直行时则可能保持当前速度。","讲者还提到，模型在处理多维动作空间时，会依次预测每个维度的分布，并将前一个维度的输出作为条件输入到下一个维度的分布建模中。这种逐步预测的方式是自回归模型的核心机制。","最后，讲者指出，模型在处理多维动作空间时，需要将每个维度的分布输出作为独立的分布，同时确保这些分布之间存在条件依赖关系。这种条件依赖关系是模仿学习中建模复杂动作空间的关键。"],"formulas":[],"uncertainties":["the kind of something that looks a little bit closer to like a staircase these bars would be"],"diagram":"none","start":1670.84,"end":1850.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1670.84,"text":"In particular, when we use autoregressive models, it means that we're going to be essentially predicting one dimension at a time. So if we first want to model a distribution over the first dimension of the action, what we would do is, in the case of steering, so we have P steering, say that we wanted our prediction to look something like this. Now a Gaussian can't represent this, and so..."},{"start":1702.35,"text":"we would choose to discretize it and represent a discretized distribution and what that would look like is essentially kind of creating bins for the different steering angles and you would then output a probability for each bin and then this kind of something that looks a little bit closer to like a staircase these bars would be"},{"start":1730.75,"text":"the distribution that you're actually using to approximate the original distribution. And so you could then, in this case, output. So for the first dimension, you would be outputting each of the probability values for each of these bars, like the height of each of these bars. So this gives you a fairly expressive distribution over angle. And then you could choose to have a more fine discretization or a more coarse discretization. And if it's more fine,"},{"start":1761.7,"text":"you get more expressivity in terms of what you can represent, but you also have to output more numbers, so there's a trade-off there. And then once you output a distribution over the angle, then you would want to output a distribution over acceleration. And in particular, in the case of merging left versus going straight, if you're merging left, probably you would be accelerating more because there was a car kind of back and left, whereas if you're going straight, you're probably more likely to be"},{"start":1790.67,"text":"more likely to be keeping your current speed. They want our distribution over acceleration to be conditioned on which steering angle we chose. So what we'll do is we'll predict P-angle and then we will sample a steering angle from this. We'll refer to this"},{"start":1820.3,"text":"for now is AT1 because it's the first dimension of the action. We'll sample it from this distribution here. And then we want to get a distribution over the second dimension conditioned on the first dimension. And to do this, we'll then pass our predicted action or the sampled action back into our model and then have our model output another distribution. And in this case, if you"}],"speech_gaps":[],"frame":"../frames/v029/011.webp","frame_time":1682.84},{"title":"模仿学习中的离散化与序列建模","segments":[{"id":82,"text":"If you are conditioning on AT1 equals maybe an angle that's like negative 2, so something more left, then you might output a distribution over acceleration that has more probability on higher accelerations versus if you condition on a steering angle.","zh":"如果你的条件是AT1等于可能是一个类似负2的角度，也就是更偏向左边，那么你可能会输出一个在较高加速度上概率更大的加速度分布，而不是如果你的条件是一个接近零的转向角度。","start":1850.92,"end":1881.85},{"id":83,"text":"that is something more like zero, then you might output a distribution over accelerations that is smaller. Yeah, so the question is, how do you build your training data when you are discretizing like this? So to do this, let's see. So when you build your training data, you'll have the state-action pairs and you'll be sampling state-action pairs.","zh":"如果是这样，那么你可能会输出一个在加速度上概率更小的分布。是的，所以问题是，当你进行这种离散化时，你是如何构建你的训练数据的？为了做到这一点，让我们看看。当你构建训练数据时，你会有状态-动作对，并且你会采样子状态-动作对。","start":1882.41,"end":1912.9},{"id":84,"text":"And in order to kind of convert it into something like this, what you'll do is you'll sample a state-action pair, then you'll bin the action according to your binning strategy. And then you'll apply a loss that is between the model's predicted distribution and the sampled action, which would be like one of these bins. And the loss, you can actually just use the cross-entropy loss here.","zh":"为了将其转换成类似这样的形式，你所做的就是采样子状态-动作对，然后根据你的分箱策略对动作进行分箱。然后你会应用一个损失函数，该损失函数是在模型预测的分布和采样的动作之间，而采样的动作会是这些分箱中的一个。并且，你实际上可以在这里直接使用交叉熵损失。","start":1913.99,"end":1940.13},{"id":85,"text":"And so you can think about it as you're doing a classification problem for each dimension of your actions. One other diagram that I think would be helpful here to think about how we go about doing this is when you have a model that's kind of autoregressive, that's predicting actions, you often use a sequence model. And so if you think about kind of a sequence neural network, something like a transformer or something like that, you would pass as input.","zh":"因此，你可以将其视为你在对动作的每个维度进行分类问题。我认为另一个有助于理解我们如何进行这种操作的图示是，当你有一个类似于自回归的模型，该模型预测动作时，你通常会使用序列模型。因此，如果你考虑一种序列神经网络，比如变压器或其他类似结构，你会将状态作为输入。","start":1940.59,"end":1971.54},{"id":86,"text":"your state and then you're kind of predicting a distribution over the first dimension of your action. So this is kind of a distribution over steering angle. Then you would then kind of sample from this distribution and then you'll pass this sampled action or your kind of chosen steering command","zh":"然后你预测动作的第一个维度上的分布，这类似于转向角度的分布。然后你从这个分布中进行采样，并将这个采样的动作或你选择的转向指令传回模型，然后输出下一个动作的分布。这正是语言模型的工作方式，你有一个起始标记，预测下一个词的分布，从该分布中采样一个词，将其传回模型，然后进行预测。","start":1972.09,"end":2001.61},{"id":87,"text":"back into your model, and then output the distribution over the next action. This is exactly how language models work, where you'll have some sort of beginning token, you'll predict a distribution over the next word, you'll sample a word from that, pass that sampled word back into the model, and then predict.","zh":"将这个结果重新输入到你的模型中，然后输出下一个动作的概率分布。这正是语言模型的工作方式，你将有一个起始标记，预测下一个词的概率分布，从该分布中采样一个词，将采样的词重新输入到模型中，然后进行下一次预测。","start":2002.26,"end":2022.9}],"notes":["本段讨论了在模仿学习中如何通过离散化处理动作空间，并构建训练数据。讲者提到，当条件变量（如转向角）取不同值时，模型输出的动作分布（如加速度）会有所不同。例如，当转向角为负值时，模型倾向于输出更高的加速度分布，而当转向角接近零时，分布则更小。这表明模型需要根据输入状态和动作的离散化策略进行训练。","讲者进一步说明了如何构建离散化的训练数据。具体来说，需要从状态-动作对中采样，并根据预设的分箱策略对动作进行离散化处理。然后，通过计算模型预测分布与采样动作之间的损失（如交叉熵损失）来训练模型。","在处理多维动作空间时，讲者将问题分解为每个动作维度的分类任务。例如，模型可以依次预测每个动作维度的分布，如转向角，然后根据该分布进行采样，并将采样结果作为输入继续预测下一个动作维度。","讲者提到，这种处理方式与语言模型的生成过程类似。语言模型通过预测下一个词的分布，采样后将其作为输入继续预测后续词。同样，在模仿学习中，模型通过预测下一个动作的分布，采样后作为输入继续预测后续动作。","讲者强调了序列模型（如Transformer）在模仿学习中的应用。通过将状
