态作为输入，模型可以依次预测每个动作维度的分布，从而实现对连续动作空间的离散化处理。","最后，讲者指出，这种离散化和序列建模的方法能够有效处理复杂动作空间，同时保持模型的可解释性和训练效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1850.92,"end":2022.9,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1850.92,"text":"If you are conditioning on AT1 equals maybe an angle that's like negative 2, so something more left, then you might output a distribution over acceleration that has more probability on higher accelerations versus if you condition on a steering angle."},{"start":1882.41,"text":"that is something more like zero, then you might output a distribution over accelerations that is smaller. Yeah, so the question is, how do you build your training data when you are discretizing like this? So to do this, let's see. So when you build your training data, you'll have the state-action pairs and you'll be sampling state-action pairs."},{"start":1913.99,"text":"And in order to kind of convert it into something like this, what you'll do is you'll sample a state-action pair, then you'll bin the action according to your binning strategy. And then you'll apply a loss that is between the model's predicted distribution and the sampled action, which would be like one of these bins. And the loss, you can actually just use the cross-entropy loss here."},{"start":1940.59,"text":"And so you can think about it as you're doing a classification problem for each dimension of your actions. One other diagram that I think would be helpful here to think about how we go about doing this is when you have a model that's kind of autoregressive, that's predicting actions, you often use a sequence model. And so if you think about kind of a sequence neural network, something like a transformer or something like that, you would pass as input."},{"start":1972.09,"text":"your state and then you're kind of predicting a distribution over the first dimension of your action. So this is kind of a distribution over steering angle. Then you would then kind of sample from this distribution and then you'll pass this sampled action or your kind of chosen steering command"},{"start":2002.26,"text":"back into your model, and then output the distribution over the next action. This is exactly how language models work, where you'll have some sort of beginning token, you'll predict a distribution over the next word, you'll sample a word from that, pass that sampled word back into the model, and then predict."}],"speech_gaps":[],"frame":"../frames/v029/012.webp","frame_time":1862.92},{"title":"模仿学习中的维度顺序与离散化","segments":[{"id":88,"text":"distribution over the next word. Except now we're doing it over dimensions of our action sequence rather than over different words in a sentence.","zh":"对下一个单词的分布。但现在我们是在动作序列的不同维度上进行的，而不是在句子中的不同单词上。","start":2023.64,"end":2032.7},{"id":89,"text":"Yeah, great question. How do you determine the order of these different dimensions? In language models, it's very natural because there's a natural ordering to words in a sentence, for example. Although even across different languages, there's some variation there. It's something that generally you kind of pick by hand. You could also in some ways treat it as a hyperparameter. In other cases, there might also be somewhat natural choices for the ordering. So if you're controlling a robot arm, for example,","zh":"是的，非常好的问题。如何确定这些不同维度的顺序？在语言模型中，这非常自然，因为句子中的单词有自然的顺序，例如。尽管在不同语言之间，这种顺序也存在一些变化。通常，你基本上是手动选择的。你也可以在某种程度上将其视为一个超参数。在其他情况下，也可能会有一些自然的选择顺序。例如，如果你在控制一个机械臂，","start":2033.65,"end":2059.15},{"id":90,"text":"You can go down what's called the kinematic chain of a robot arm, where you start with the base dimension, and then you go to the next joint, and the next joint, and so forth. The good news is that, in principle, the expressive power of this distribution doesn't change with the order. Essentially, your goal is trying to represent the full joint distribution over all dimensions.","zh":"你可以按照所谓的机械臂的运动链来依次处理，从基座维度开始，然后是下一个关节，再下一个关节，依此类推。好消息是，原则上，这种分布的表达能力不会因顺序而改变。本质上，你的目标是尝试表示所有维度上的联合分布。","start":2059.65,"end":2083.51},{"id":91,"text":"And the only reason why you're doing an ordering here is because if you tried to represent a joint distribution over all the dimensions at once, there's a lot of pairwise probabilities that you would have to predict. And it's a lot more efficient to do it one dimension at a time to represent the full joint. Yeah, so the question is, in the case of a video game, it was pretty discrete. Here we're in a more continuous case.","zh":"在这里进行顺序处理的唯一原因是，如果你试图一次性表示所有维度的联合分布，你将需要预测大量的成对概率。而逐个维度进行表示则更加高效。是的，所以问题是，在视频游戏的情况下，它几乎是离散的。而我们现在处理的是一个更连续的情况。","start":2084.24,"end":2109.36},{"id":92,"text":"Whenever we want to use an autoregressive model, does that mean we should be discretizing, right? Cool. So there's actually kind of two reasons to be using discretization. One reason to use discretization is it allows you to model a very multimodal complex distribution. And so these bars can be any height that you want. And so it actually can model things that are way more expressive than a mixture of Gaussians.","zh":"每当我们想要使用自回归模型时，这意味着我们应该进行离散化，对吧？很好。实际上，使用离散化有两个原因。其中一个原因是它允许你建模一个非常多模态的复杂分布。因此，这些条形可以是任何高度。因此，它实际上可以建模比高斯混合物更具有表达力的事物。","start":2111.19,"end":2137.65},{"id":93,"text":"up to how fine your discretization is. The challenge with discretization is that if you have a lot of bins, you might have 100 bins for one dimension, and then you're trying to represent a 10-dimensional action or something like that, then the dimensionality of your discretized actions is going to blow up if you try to model that full 10 to the fifth matrix over probabilities. And so using an autoregressive model helps you deal with that dimensionality.","zh":"这取决于你的离散化有多精细。离散化的挑战在于，如果你有很多区间（bins），比如一个维度有100个区间，而你试图表示一个10维的动作，那么当你尝试建模完整的10维概率矩阵时，离散化动作的维度将会急剧增加。因此，使用自回归模型可以帮助你处理这种维度问题。","start":2138.17,"end":2167.09},{"id":94,"text":"You could, in principle, also use an autoregressive model with a mixture of Gaussians, for example, and that would be completely fine as well. It's not a common choice, per se, because if you're going to go through the trouble of using an autoregressive model, usually discretization is a pretty powerful choice. But yeah, you can also use it with a Gaussian mixture model or Gaussians or something like that.","zh":"原则上，你也可以使用带有高斯混合模型的自回归模型，这同样完全可行。不过，这并不是一个常见的选择，因为如果你要花力气使用自回归模型，通常离散化是一个相当强大的选择。但没错，你也可以将其与高斯混合模型或高斯分布等一起使用。","start":2168.48,"end":2196.48}],"notes":["本段讨论了在模仿学习中使用自回归模型时是否需要离散化的问题。讲者指出，离散化有两个主要原因：一是它允许建模非常复杂的多模态分布，二是它能够处理高维动作空间中的维度爆炸问题。讲者提到，离散化可以将分布表示为不同高度的条形图，从而比高斯混合模型更具表达能力。","讲者进一步解释了离散化带来的挑战，即当维度较多时，离散化后的动作空间维度会迅速增加，导致概率矩阵的维度爆炸。因此，使用自回归模型可以有效应对这一问题，因为它能够逐个维度地建模分布，而不是同时建模所有维度。","最后，讲者提到虽然自回归模型通常与离散化结合使用，但也可以与高斯混合模型结合使用。不过，由于离散化在处理高维空间时更为有效，因此它通常是更常见的选择。","讲者强调了自回归模型在模仿学习中的重要性，特别是在处理连续动作空间时，离散化能够帮助模型更高效地表示复杂的联合分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2023.64,"end":2196.48,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2023.64,"text":"distribution over the next word. Except now we're doing it over dimensions of our action sequence rather than over different words in a sentence."},{"start":2033.65,"text":"Yeah, great question. How do you determine the order of these different dimensions? In language models, it's very natural because there's a natural ordering to words in a sentence, for example. Although even across different languages, there's some variation there. It's something that generally you kind of pick by hand. You could also in some ways treat it as a hyperparameter. In other cases, there might also be somewhat natural choices for the ordering. So if you're controlling a robot arm, for example,"},{"start":2059.65,"text":"You can go down what's called the kinematic chain of a robot arm, where you start with the base dimension, and then you go to the next joint, and the next joint, and so forth. The good news is that, in principle, the expressive power of this distribution doesn't change with the order. Essentially, your goal is trying to represent the full joint distribution over all dimensions."},{"start":2084.24,"text":"And the only reason why you're doing an ordering here is because if you tried to represent a joint distribution over all the dimensions at once, there's a lot of pairwise probabilities that you would have to predict. And it's a lot more efficient to do it one dimension at a time to represent the full joint. Yeah, so the question is, in the case of a video game, it was pretty discrete. Here we're in a more continuous case."},{"start":2111.19,"text":"Whenever we want to use an autoregressive model, does that mean we should be discretizing, right? Cool. So there's actually kind of two reasons to be using discretization. One reason to use discretization is it allows you to model a very multimodal complex distribution. And so these bars can be any height that you want. And so it actually can model things that are way more expressive than a mixture of Gaussians."},{"start":2138.17,"text":"up to how fine your discretization is. The challenge with discretization is that if you have a lot of bins, you might have 100 bins for one dimension, and then you're trying to represent a 10-dimensional action or something like that, then the dimensionality of your discretized actions is going to blow up if you try to model that full 10 to the fifth matrix over probabilities. And so using an autoregressive model helps you deal with that dimensionality."},{"start":2168.48,"text":"You could, in principle, also use an autoregressive model with a mixture of Gaussians, for example, and that would be completely fine as well. It's not a common choice, per se, because if you're going to go through the trouble of using an autoregressive model, usually discretization is a pretty powerful choice. But yeah, you can also use it with a Gaussian mixture model or Gaussians or something like that."}],"speech_gaps":[],"frame":"../frames/v029/013.webp","frame_time":2035.64},{"title":"模仿学习中的训练方法","segments":[{"id":95,"text":"Yeah, so the question was around how we actually kind of train this and maybe let's just like walk through how we go about training this so It's actually gonna look Well, yeah, let's walk through how we train it. So we're given some data set. So we're given some data set that has state-action pairs and we're gonna want to train our neural network and We're gonna follow a typical way of training neural networks, which is to sample","zh":"是的，所以问题是关于我们实际上如何训练这个模型的，也许我们就这样走一遍训练过程吧，这样它看起来会怎样。嗯，是的，让我们走一遍如何训练它。我们被给予了一些数据集。我们被给予了一些包含状态-动作对的数据集，我们想要训练我们的神经网络。我们将遵循训练神经网络的典型方式，即从数据集中采样","start":2197.37,"end":2226.51},{"id":96,"text":"to sample an example from your dataset, or sample a mini-batch of examples. I'll write it up for a mini-batch size of one, just for simplicity, but you can kind of extend it. So we're going to be sampling a state-action pair from our dataset. And the... Once we sample this, there...","zh":"从你的数据集中采样一个例子，或者采样一个迷你批次的例子。我将为一个迷你批次大小为1的情况写出来，只是为了简化，但你可以扩展它。我们将从数据集中采样一个状态-动作对。然后，一旦我们采样了这个，那里……","start":2228.31,"end":2254.08},{"id":97,"text":"we will essentially be running a forward pass through our network and a backward pass through our network. And the key question that comes up is like doing the forward pass is kind of fairly straightforward. And when we do the forward pass, we'll be getting kind of some probability over the actions of each dimension. And then we need to figure out what should the objective be. And the objective that there's actually kind of a common objective that we can think about for all of these generative models.","zh":"我们将基本上通过我们的网络进行一次前向传播和一次反向传播。随之而来的一个关键问题是，进行前向传播相对而言是比较直接的。当我们进行前向传播时，我们将得到每个维度上动作的概率。然后我们需要确定目标应该是什么。实际上，对于所有这些生成模型，有一种常见的目标可以考虑。","start":2256.23,"end":2284.01},{"id":98,"text":"And that objective is that we want, we're outputting these kind of probability distributions, we want to be maximizing the probability of the actions represented in the data. Or equivalently, we'll write this as minimizing the log probability of, I'll write this as pi theta of A given S.","zh":"这个目标是，我们输出这些概率分布，我们想要最大化数据中表示的动作的概率。或者等价地，我们可以将其写成最小化对数概率，我将其写为 π_θ(A|S)。","start":2285.36,"end":2312.46},{"id":99,"text":"And this is with respect to theta. And so what this means is we're going to be evaluating how likely is the action that was sampled under our policy. And then we'll be trying to make the probability of the action in the dataset as high as possible, or the negative log probability as low as possible.","zh":"这是关于 θ 的。这意味着我们将评估在我们的策略下采样到的动作的可能性。然后我们将尝试使数据集中动作的概率尽可能高，或者使负对数概率尽可能低。","start":2313.98,"end":2340.03},{"id":100,"text":"is going to be different for different models. For a Gaussian mixture model, what you'll do is you can write down the probability density function for a Gaussian mixture model and then just differentiate with respect to the mean variance and weight that is outputted by the neural network. And for the case of the autoregressive model, it's a little bit different. So we will...","zh":"这将因不同的模型而异。对于高斯混合模型，你所做的就是写出高斯混合模型的概率密度函数，然后对神经网络输出的均值、方差和权重进行求导。对于自回归模型的情况则有所不同。因此，我们将……","start":2340.31,"end":2368.88}],"notes":["本段讲解了模仿学习中训练模型的目标，即最大化数据集中动作的概率，或等价地最小化负对数概率。这与生成模型的训练目标一致，通过神经网络输出动作的概率分布来实现。","讲者提到，训练过程中需要对采样的动作进行前向传播和反向传播，以更新网络参数。目标函数是最大化数据集中动作的概率，这可以通过最小化负对数概率来实现。","在实际应用中，不同的模型（如高斯混合模型和自回归模型）会采用不同的方法来计算对数概率。例如，高斯混合模型需要对均值、方差和权重进行求导，而自回归模型则有所不同。","讲者强调了训练过程中需要考虑的两个关键点：一是如何评估采样动作在策略下的概率，二是如何通过优化目标函数来调整网络参数，以提高模型对数据集的拟合能力。","本段还提到，训练过程遵循典型的神经网络训练方法，包括从数据集中采样示例或小批量数据，并通过前向和反向传播进行参数更新。","讲者指出，目标函数的优化是模仿学习的核心，通过最大化数据集中动作的概率，模型能够更好地学习到专家策略的行为模式。"],"formulas":[{"latex":"L(\\theta) = -\\frac{1}{N} \\mathbb{E}_{(s,a) \\sim D} [\\log \\rho_\\theta(a|s)]","symbols":"L(θ) 表示损失函数，ρ_θ(a|s) 表示策略 π_θ 在状态 s 下选择动作 a 的概率，D 表示数据集","explanation":"修正了公式中的数学符号，将 'E' 改为更标准的数学期望符号 '\\mathbb{E}'，并确保公式中的符号与上下文一致。","evidence":"And that objective is that we want, we're outputting these kind of probability distributions, we want to be maximizing the probability of the actions represented in the data. Or equivalently, we'll write this as minimizing the log probability of, I'll write this as pi theta of A given S. And this is with respect to theta. And so what this means is we're going to be evaluating how likely is the action that was sampled under our policy. And then we'll be trying to make the probability of the action in the dataset as high as possible, or the negative log probability as low as possible. Now in practice, what this log probability looks like..."}],"uncertainties":[],"diagram":"none","start":2197.37,"end":2368.88,"asr_flags":[],"math_clarifications":["公式中的 'E' 已被更正为标准的数学期望符号 '\\mathbb{E}'，以符合数学表达规范。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2197.37,"text":"Yeah, so the question was around how we actually kind of train this and maybe let's just like walk through how we go about training this so It's actually gonna look Well, yeah, let's walk through how we train it. So we're given some data set. So we're given some data set that has state-action pairs and we're gonna want to train our neural network and We're gonna follow a typical way of training neural networks, which is to sample"},{"start":2228.31,"text":"to sample an example from your dataset, or sample a mini-batch of examples. I'll write it up for a mini-batch size of one, just for simplicity, but you can kind of extend it. So we're going to be sampling a state-action pair from our dataset. And the... Once we sample this, there..."},{"start":2256.23,"text":"we will essentially be running a forward pass through our network and a backward pass through our network. And the key question that comes up is like doing the forward pass is kind of fairly straightforward. And when we do the forward pass, we'll be getting kind of some probability over the actions of each dimension. And then we need to figure out what should the objective be. And the objective that there's actually kind of a common objective that we can think about for all of these generative models."},{"start":2285.36,"text":"And that objective is that we want, we're outputting these kind of probability distributions, we want to be maximizing the probability of the actions represented in the data. Or equivalently, we'll write this as minimizing the log probability of, I'll write this as pi theta of A given S."},{"start":2313.98,"text":"And this is with respect to theta. And so what this means is we're going to be evaluating how likely is the action that was sampled under our policy. And then we'll be trying to make the probability of the action in the dataset as high as possible, or the negative log probability as low as possible. Now in practice, what this log probability looks like..."},{"start":2340.31,"text":"is going to be different for different models. For a Gaussian mixture model, what you'll do is you can write down the probability density function for a Gaussian mixture model and then just differentiate with respect to the mean variance and weight that is outputted by the neural network. And for the case of the autoregressive model, it's a little bit different. So we will..."}],"speech_gaps":[],"frame":"../frames/v029/014.webp","frame_time":2209.37},{"title":"模仿学习中的离散化与损失函数","segments":[{"id":101,"text":"What this looks like for the autoregressive model is we essentially get the probability of AT1 and the probability of AT2 given AT1 and so forth. And this probability for this first dimension, it will just be the cross-entropy loss.","zh":"对于自回归模型来说，这看起来就是我们实际上得到AT1的概率以及在AT1给定情况下的AT2的概率，依此类推。对于这个第一维度的概率，它将仅仅是交叉熵损失。","start":2369.87,"end":2399.53},{"id":102,"text":"that corresponds to trying to maximize the log probability of this value for a discrete categorical variable. And for the second dimension, that's where things get a little bit more complicated because this will just be the cross-entropy loss, but you need to figure out which action you want to use here. And oftentimes, you will use the action in the data set.","zh":"这对应于试图最大化离散分类变量的该值的对数概率。而对于第二个维度，事情会变得稍微复杂一些，因为这仍然是交叉熵损失，但你需要确定在这里使用哪个动作。通常，你会使用数据集中的动作。","start":2400.43,"end":2428.47},{"id":103,"text":"So for the inputs, you'll often actually pass as input the state and the dimensions that were chosen in the dataset. And then for each of these probabilities, you'll be applying the cross-entropy loss and back-propagating the cross-entropy loss back into the network. And then at test time, you'll then actually be using your own predictions and passing your own predictions into the neural network. But this is really the... this objective right here is really...","zh":"因此，对于输入，你通常会实际传递状态以及数据集中选择的维度。然后，对于每一个概率，你都会应用交叉熵损失，并将交叉熵损失反向传播回网络中。在测试时，你实际上会使用自己的预测，并将这些预测传递给神经网络。但这个目标函数就是……这个目标函数真的……","start":2428.8,"end":2457.43},{"id":104,"text":"the core loss function, and this corresponds to a form of cross-entropy loss for discretized distributions, and for Gaussian mixture models, you write down the PDF and differentiate. Yeah, so the question was, it seems a little odd to discretize and do a categorical distribution over a continuous variable, especially given that a loss function like cross-entropy won't take into account the fact that two bins are, like, that sort of error is","zh":"核心损失函数，这对应于离散化分布的一种形式的交叉熵损失，对于高斯混合模型，你会写出概率密度函数并进行求导。是的，所以问题是，似乎将连续变量离散化并在其上使用分类分布有点奇怪，尤其是考虑到像交叉熵这样的损失函数不会考虑到两个区间之间的误差，比如这种误差……","start":2457.77,"end":2483.55},{"id":105,"text":"probably less costly than an error that is for two bins that are very far apart from one another. This is kind of one downside to using discretized actions. In practice, often that sort of distance is something that is fairly quick to learn. And so the outcome is often...","zh":"可能比两个相距很远的区间之间的误差成本更低。这是使用离散化动作的一个缺点。在实践中，这种距离通常是非常容易学习的。因此，结果通常是……","start":2484.05,"end":2507.91},{"id":106,"text":"In practice, often that sort of distance is something that is fairly quick to learn. And so the outcome is often...","zh":"在实践中，这种距离通常是非常容易学习的。因此，结果通常是……","start":2509.02,"end":2515.48},{"id":107,"text":"still pretty good, but you might need more data. And how fine your discretization","zh":"仍然相当不错，但你可能需要更多的数据。而你的离散化程度","start":2515.48,"end":2520.8},{"id":108,"text":"is a really important hyperparameter, because if it's too fine, then it'll be very hard to","zh":"是一个非常重要的超参数，因为如果它太细，那么将非常难以","start":2520.8,"end":2526.3},{"id":109,"text":"get signal, because if you're off by one, you'll get zero loss function. There are also other","zh":"获取信号，因为如果你错了一位，你就会得到零损失函数。还有其他事情你可以做，以尝试平滑数据和平滑标签，使得","start":2526.3,"end":2531.8},{"id":110,"text":"things that you can do to try to smoothen out the data and smoothen out the labels so that","zh":"标签不仅仅是一个one-hot向量。你可以稍微在周围平滑一下。","start":2533.1,"end":2538.12},{"id":111,"text":"the label isn't just like a one-hot vector. You can kind of smooth around it a little bit.","zh":"哦，对了，这是个很棒的问题。","start":2539.02,"end":2542.98},{"id":112,"text":"Oh, yeah, awesome question.","zh":"我实际上没有来得及写出第三个例子。","start":2543.86,"end":2545.1},{"id":113,"text":"I didn't actually get to write the third example.","zh":"我实际上没有写第三个例子。","start":2545.22,"end":2548.26}],"notes":["本段讨论了在模仿学习中使用离散化动作的缺点，特别是当使用交叉熵损失函数时，无法考虑到相邻类别之间的误差成本较低，而远距离类别之间的误差成本较高。这表明离散化方法在处理连续变量时存在一定的局限性。","讲者提到，尽管离散化动作在实践中可能较快学习，但结果可能仍然不错，但需要更多的数据。这说明离散化方法在实际应用中需要权衡数据量和模型性能。","讲者指出，离散化的粒度（即离散化程度）是一个非常重要的超参数。如果粒度过细，模型可能会因为一个微小的误差而得到零损失，这会阻碍模型的学习过程。","为了缓解离散化带来的问题，讲者提到可以采取一些平滑数据和标签的方法，使标签不再是简单的one-hot向量，而是通过某种方式平滑处理，以减少误差的不连续性。","讲者还提到，这些平滑方法虽然有助于改善模型性能，但属于更高级的技术，可能需要更多的计算资源和调整。","最后，讲者提到自己没有来得及写第三个例子，这表明课程内容可能在后续继续展开，但当前段落已经涵盖了离散化动作的主要问题和应对策略。"],"formulas":[],"uncertainties":["the question was, it seems a little odd to discretize and do a categorical distribution over a continuous variable, especially given that a loss function like cross-entropy won't take into account the fact that two bins are, like, that sort of error is"],"diagram":"none","start":2369.87,"end":2548.26,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":2369.87,"text":"What this looks like for the autoregressive model is we essentially get the probability of AT1 and the probability of AT2 given AT1 and so forth. And this probability for this first dimension, it will just be the cross-entropy loss."},{"start":2400.43,"text":"that corresponds to trying to maximize the log probability of this value for a discrete categorical variable. And for the second dimension, that's where things get a little bit more complicated because this will just be the cross-entropy loss, but you need to figure out which action you want to use here. And oftentimes, you will use the action in the data set."},{"start":2428.8,"text":"So for the inputs, you'll often actually pass as input the state and the dimensions that were chosen in the dataset. And then for each of these probabilities, you'll be applying the cross-entropy loss and back-propagating the cross-entropy loss back into the network. And then at test time, you'll then actually be using your own predictions and passing your own predictions into the neural network. But this is really the... this objective right here is really..."},{"start":2457.77,"text":"the core loss function, and this corresponds to a form of cross-entropy loss for discretized distributions, and for Gaussian mixture models, you write down the PDF and differentiate. Yeah, so the question was, it seems a little odd to discretize and do a categorical distribution over a continuous variable, especially given that a loss function like cross-entropy won't take into account the fact that two bins are, like, that sort of error is"},{"start":2484.05,"text":"probably less costly than an error that is for two bins that are very far apart from one another. This is kind of one downside to using discretized actions. In practice, often that sort of distance is something that is fairly quick to learn. And so the outcome is often..."},{"start":2509.02,"text":"still pretty good, but you might need more data. And how fine your discretization"},{"start":2515.48,"text":"is a really important hyperparameter, because if it's too fine, then it'll be very hard to"},{"start":2520.8,"text":"get signal, because if you're off by one, you'll get zero loss function. There are also other"},{"start":2526.3,"text":"things that you can do to try to smoothen out the data and smoothen out the labels so that"},{"start":2533.1,"text":"the label isn't just like a one-hot vector. You can kind of smooth around it a little bit."},{"start":2539.02,"text":"So that's one thing that can also help with that, although it's a little bit more advanced."},{"start":2543.86,"text":"Oh, yeah, awesome question."},{"start":2545.22,"text":"I didn't actually get to write the third example."}],"speech_gaps":[],"frame":"../frames/v029/015.webp","frame_time":2381.87},{"title":"模仿学习中的序列建模与扩散模型","segments":[{"id":114,"text":"And so, yeah, so when you are outputting the probability over the third action, it will","zh":"因此，当你输出第三个动作的概率时，它会","start":2549.74,"end":2555.56},{"id":115,"text":"be conditioned on everything so far.","zh":"依赖于迄今为止的所有信息。","start":2555.56,"end":2557.2},{"id":116,"text":"And often the way that you do that is if you're using a sequence model, you can then output","zh":"通常，你这样做的方式是，如果你使用的是序列模型，那么你可以输出","start":2557.6,"end":2563.54},{"id":117,"text":"the prediction, like a sample from this distribution.","zh":"预测结果，比如从这个分布中采样的一个样本。","start":2563.54,"end":2566.12},{"id":118,"text":"So A, T, 2, and then output the probability over the third action right here.","zh":"所以 A, T, 2，然后在这里输出第三个动作的概率。","start":2566.12,"end":2573.5},{"id":119,"text":"And if you have a sequence model that takes into account everything from the past, then it will already condition on all the actions so far.","zh":"如果你有一个考虑了过去所有信息的序列模型，那么它已经会基于迄今为止的所有动作进行条件建模。","start":2573.68,"end":2580.34},{"id":120,"text":"So how does backpropagation handle this when it's discrete?","zh":"那么当它是离散的时候，反向传播是如何处理这种情况的？","start":2581.3,"end":2585.68},{"id":121,"text":"So only the output is discrete.","zh":"所以只有输出是离散的。","start":2585.88,"end":2589.32},{"id":122,"text":"And so you can think about it as a classification problem.","zh":"因此，你可以把它看作一个分类问题。","start":2589.52,"end":2591.86},{"id":123,"text":"problem. And so if the weights are discrete, that's bad for backpropagation. But when it's","zh":"问题。因此，如果权重是离散的，这对反向传播是不利的。但当它只在标签上时，你只是在这些离散变量上计算损失函数。","start":2591.86,"end":2598.1},{"id":124,"text":"only at the labels, you're only just computing the loss function on those discrete variables.","zh":"然后这个损失是……你可以直接进行反向传播。","start":2598.1,"end":2602.22},{"id":125,"text":"And then that loss is... You can backpropagate in a direct way.","zh":"这是因为输出是一个概率，然后在这个概率上计算损失，接着你就可以在这个概率上反向传播这个损失。因此，输出实际上仍然是连续值，因为你是在输出这些条形的高度。","start":2602.42,"end":2608.24},{"id":126,"text":"And that's because the output is outputting a probability and computing a loss on that probability, and then you can backpropagate that loss on that probability. So the outputs are actually still continuous values because you're outputting the height of each of these bars.","zh":"很好。这是这种离散化情况的可视化。我们输出第一个维度，第二个维度在给定第一个维度的情况下，第三个维度在给定前两个动作维度的情况下，依此类推。这种方法非常可扩展，它允许你处理相当长的动作序列，类似于语言模型。我在这里最后展示的是扩散模型。扩散模型……","start":2609.65,"end":2625.42},{"id":127,"text":"Cool. So this is a visualization of this kind of discretized case. We're outputting the first dimension, the second dimension given the first dimension, the third dimension given the first two dimensions of the action, and so forth. And this is very scalable. It allows you to handle fairly long sequences of actions similar to language models. The last thing that I put up on here is diffusion. Diffusion is...","zh":"也是一个非常有吸引力的选择，尤其是在处理连续动作时。它可以建模非常复杂的连续变量分布，包括高维连续变量，如图像或动作，并且它通过这种去噪过程来实现这一点：你从完全的噪声开始，然后迭代地去噪，使它逐渐变成一个更干净的动作版本，最终生成一个希望是干净的动作预测。","start":2629.33,"end":2656.06},{"id":128,"text":"also a very appealing choice, especially for continuous actions. It can model very complex distributions over continuous variables, including high-dimensional continuous variables like images or actions, and it does so by using this kind of denoising process where you start with complete noise and denoise it iteratively to make it a less and less noisy version of the action to ultimately generate hopefully a clean action prediction.","zh":"有一点值得注意的是，这两种模型都有某种迭代过程。在自回归模型的情况下，它是对预测维度的迭代；而在扩散模型的情况下，它是对这个去噪过程的迭代。现在我有一个问题要问大家。我们已经讨论了这些更具表达力的分布类别。","start":2656.44,"end":2682.6},{"id":129,"text":"One thing that's kind of notable is both this model and diffusion models do have some sort of iterative process. In the case of autoregressive models, it's iterative over the dimensions of your prediction. And in the case of diffusion, it's iterative over this denoising process. Now one question I have for all of you. So we've talked about these more expressive distribution classes.","zh":"有一点值得一提的是，这两种模型都具有某种迭代过程。在自回归模型的情况下，它是沿着预测的维度进行迭代的。而在扩散模型的情况下，它是沿着去噪过程进行迭代的。现在我有一个问题想问大家。我们已经讨论了这些更具表现力的分布类别。","start":2684.85,"end":2708.36}],"notes":["本段讲解了在模仿学习中，如何通过序列模型对动作进行条件概率建模。讲者提到，当输出第三个动作的概率时，模型需要基于之前的所有动作进行条件建模。这类似于语言模型中逐词生成的过程，即每个动作的预测依赖于前面的所有动作。","讲者进一步说明，当使用序列模型时，模型可以输出一个样本，即从概率分布中采样。这种做法允许模型处理长序列的动作，类似于语言模型的处理方式。","在讨论离散动作时，讲者指出，虽然输出是离散的，但可以通过分类问题来处理。此时，损失函数仅作用于离散变量，而反向传播可以以直接的方式进行。","讲者强调，尽管输出是离散的，但模型实际上输出的是概率分布，因此输出仍然是连续值。这是因为模型输出的是每个离散动作的概率分布的“高度”，即概率密度。","讲者提到，扩散模型（diffusion）是一种非常有吸引力的选择，特别是在处理连续动作时。扩散模型通过逐步去噪的过程，可以建模复杂的连续变量分布，包括高维的连续变量，如图像或动作。","最后，讲者指出，无论是自回归模型还是扩散模型，都具有某种迭代过程。自回归模型的迭代是基于动作维度的，而扩散模型的迭代是基于去噪过程的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2549.74,"end":2708.36,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":2549.74,"text":"And so, yeah, so when you are outputting the probability over the third action, it will"},{"start":2555.56,"text":"be conditioned on everything so far."},{"start":2557.6,"text":"And often the way that you do that is if you're using a sequence model, you can then output"},{"start":2563.54,"text":"the prediction, like a sample from this distribution."},{"start":2566.12,"text":"So A, T, 2, and then output the probability over the third action right here."},{"start":2573.68,"text":"And if you have a sequence model that takes into account everything from the past, then it will already condition on all the actions so far."},{"start":2581.3,"text":"So how does backpropagation handle this when it's discrete?"},{"start":2585.88,"text":"So only the output is discrete."},{"start":2589.52,"text":"And so you can think about it as a classification problem."},{"start":2591.86,"text":"problem. And so if the weights are discrete, that's bad for backpropagation. But when it's"},{"start":2598.1,"text":"only at the labels, you're only just computing the loss function on those discrete variables."},{"start":2602.42,"text":"And then that loss is... You can backpropagate in a direct way."},{"start":2609.65,"text":"And that's because the output is outputting a probability and computing a loss on that probability, and then you can backpropagate that loss on that probability. So the outputs are actually still continuous values because you're outputting the height of each of these bars."},{"start":2629.33,"text":"Cool. So this is a visualization of this kind of discretized case. We're outputting the first dimension, the second dimension given the first dimension, the third dimension given the first two dimensions of the action, and so forth. And this is very scalable. It allows you to handle fairly long sequences of actions similar to language models. The last thing that I put up on here is diffusion. Diffusion is..."},{"start":2656.44,"text":"also a very appealing choice, especially for continuous actions. It can model very complex distributions over continuous variables, including high-dimensional continuous variables like images or actions, and it does so by using this kind of denoising process where you start with complete noise and denoise it iteratively to make it a less and less noisy version of the action to ultimately generate hopefully a clean action prediction."},{"start":2684.85,"text":"One thing that's kind of notable is both this model and diffusion models do have some sort of iterative process. In the case of autoregressive models, it's iterative over the dimensions of your prediction. And in the case of diffusion, it's iterative over this denoising process. Now one question I have for all of you. So we've talked about these more expressive distribution classes."}],"speech_gaps":[],"frame":"../frames/v029/016.webp","frame_time":2561.74},{"title":"模仿学习中的模型表达能力与分布表达能力","segments":[{"id":130,"text":"And none of what we talked about has actually really changed the architecture of the model. And I'm curious, one very important question is, instead of having these more complex distributions, we could just still use the L2 error, like the L2 norm as the loss function, but just make the neural network bigger. And bigger neural networks are generally more expressive than smaller neural networks. So does anyone have thoughts on,","zh":"我们之前讨论的所有内容实际上并没有真正改变模型的架构。我很好奇，一个非常重要的问题是，与其使用这些更复杂的分布，我们仍然可以使用L2误差，比如将L2范数作为损失函数，但只是让神经网络更大。一般来说，更大的神经网络比更小的神经网络更具表达能力。那么，有人对此有什么想法吗？","start":2710.8,"end":2740.71},{"id":131,"text":"how what we talked about here is different from just making the model bigger with the L2 law. Yeah, so in the driving example, even if you make the network really, really large, it's still going to output just the mean. It might output the mean very, very accurately, but it doesn't actually change its ability to represent a more complex distribution. And so the expressive power of a distribution that you're trying to represent is actually","zh":"我们在这里讨论的内容与仅仅通过L2法则让模型变大有什么不同呢？是的，在驾驶的例子中，即使你让网络变得非常大，它仍然只会输出均值。它可能会非常准确地输出均值，但它实际上并没有改变其表示更复杂分布的能力。因此，你试图表示的分布的表达能力实际上是","start":2741.34,"end":2769.01},{"id":132,"text":"And if you think about this picture again, where you have a neural network that's outputting parameters of a distribution, there's the expressive part of this function of how many functions can you represent that go from S to parameters? And then there's the expressive power of this top part that how many different distributions can those parameters even represent in the first place?","zh":"如果你再想想这张图，其中有一个神经网络输出分布的参数，这里有一个表达部分，即这个函数能表示多少从状态S到参数的函数？然后是这个顶部部分的表达能力，即这些参数最初能表示多少种不同的分布？","start":2769.92,"end":2794.16},{"id":133,"text":"And this is a really important point, where neural network expressivity is often distinct from distribution expressivity.","zh":"这是一个非常重要的观点，其中神经网络的表达能力通常与分布的表达能力是不同的。","start":2794.83,"end":2807.8},{"id":134,"text":"The expressivity of the distributions that it can represent is kind of captured by what kind of distribution you're allowing it to represent. And if it only outputs the mean invariance, it can very expressively represent functions that go from state to mean invariance, but it can't represent anything more complex than a Gaussian. Okay, so we walk through this a bit. So we are given some demonstrations. We're trying to train a generative model over actions.","zh":"它能够表示的分布的表达能力在某种程度上取决于你允许它表示什么样的分布。如果它只输出均值不变性，它可以非常具有表达能力地表示从状态到均值不变性的函数，但它无法表示比高斯分布更复杂的任何内容。好的，所以我们稍微讨论了一下。我们被给予了一些演示，我们试图在动作上训练一个生成模型。","start":2810.8,"end":2834.32},{"id":135,"text":"And this is trying to minimize the negative log likelihood of the expert's actions given the states in the demonstration. And so this equation looks maybe a little bit complicated, but the log pi is the log probability under the policy. The blue part is the demo actions.","zh":"这是试图最小化专家动作在演示状态下的负对数似然。因此，这个方程看起来可能有点复杂，但log π 是策略下的对数概率。蓝色部分是演示动作。","start":2835.0,"end":2861.28}],"notes":["本段讨论了模仿学习中模型表达能力与分布表达能力的区别。讲者指出，即使增加神经网络的规模，使用L2损失函数，也无法改变模型对复杂分布的表达能力。模型的表达能力指的是其能够表示的函数数量，而分布的表达能力指的是这些参数能够表示的分布类型。","讲者通过一个例子说明，即使神经网络非常大，如果它只输出均值，那么它只能表示高斯分布，无法表示更复杂的分布。这表明模型的表达能力与分布的表达能力是两个不同的概念。","讲者进一步指出，神经网络的表达能力取决于其能够表示的函数数量，而分布的表达能力取决于参数能够表示的分布类型。因此，模型的表达能力并不等同于分布的表达能力。","讲者提到，如果模型只能输出均值，那么它只能表示从状态到均值的函数，而无法表示更复杂的分布。这说明模型的结构决定了其能够表示的分布类型。","最后，讲者提到模仿学习的目标是训练一个生成模型，以最小化专家动作的负对数似然。这涉及到对策略的对数概率进行建模，并利用演示数据进行训练。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2710.8,"end":2861.28,"asr_flags":[],"math_clarifications":["公式中的符号 '\\rho(a|s)' 应更正为 '\\pi(a|s)'，以表示政策的条件概率密度。此外，损失函数应明确为负对数似然，但需要更详细的上下文来准确表达其与专家动作的关系。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2710.8,"text":"And none of what we talked about has actually really changed the architecture of the model. And I'm curious, one very important question is, instead of having these more complex distributions, we could just still use the L2 error, like the L2 norm as the loss function, but just make the neural network bigger. And bigger neural networks are generally more expressive than smaller neural networks. So does anyone have thoughts on,"},{"start":2741.34,"text":"how what we talked about here is different from just making the model bigger with the L2 law. Yeah, so in the driving example, even if you make the network really, really large, it's still going to output just the mean. It might output the mean very, very accurately, but it doesn't actually change its ability to represent a more complex distribution. And so the expressive power of a distribution that you're trying to represent is actually"},{"start":2769.92,"text":"in many ways separate from the expressive power of the function itself. And if you think about this picture again, where you have a neural network that's outputting parameters of a distribution, there's the expressive part of this function of how many functions can you represent that go from S to parameters? And then there's the expressive power of this top part that how many different distributions can those parameters even represent in the first place?"},{"start":2794.83,"text":"And this is a really important point, where neural network expressivity is often distinct from distribution expressivity. Yeah, so the expressivity of this output"},{"start":2810.8,"text":"The expressivity of the distributions that it can represent is kind of captured by what kind of distribution you're allowing it to represent. And if it only outputs the mean invariance, it can very expressively represent functions that go from state to mean invariance, but it can't represent anything more complex than a Gaussian. Okay, so we walk through this a bit. So we are given some demonstrations. We're trying to train a generative model over actions."},{"start":2835.0,"text":"And this is trying to minimize the negative log likelihood of the expert's actions given the states in the demonstration. And so this equation looks maybe a little bit complicated, but the log pi is the log probability under the policy. The blue part is the demo actions."}],"speech_gaps":[],"frame":"../frames/v029/017.webp","frame_time":2722.8},{"title":"模仿学习中的生成模型与损失函数比较","segments":[{"id":136,"text":"that are sampled from the demonstration data set. And this probability is under the policy that we're trying to learn. Cool, and then once we fit this, we should have a policy that's better at actually matching what the expert is doing. And as a result, it should be better at performing the test. Okay, so now why did we learn all this? How well does the generative model work compared to just using an L2 loss?","zh":"这些样本是从演示数据集中采样的。并且这个概率是在我们试图学习的策略下计算的。很好，一旦我们拟合了这个模型，我们就应该得到一个更擅长实际匹配专家行为的策略。因此，它在测试中的表现也应该更好。好的，那么我们现在为什么要学习这些呢？生成模型的表现与仅仅使用L2损失相比如何？","start":2861.98,"end":2891.69},{"id":137,"text":"There's a couple of works that have evaluated this more explicitly. So here's a transport task where you need to have one robot kind of transport a tool to another robot, and the policy is controlling both of these robots. And we'll be comparing diffusion and a Gaussian mixture model. Diffusion actually is a lot more expressive than what you can even represent with a Gaussian mixture model.","zh":"有一些工作已经更明确地评估了这一点。这里是一个运输任务，你需要让一个机器人将工具传递给另一个机器人，策略是控制这两个机器人。我们将比较扩散模型和高斯混合模型。实际上，扩散模型的表达能力比高斯混合模型所能表示的要强得多。","start":2893.18,"end":2922.53},{"id":138,"text":"And we'll be looking at two different demonstration datasets. One was a dataset that was just collected by one person. And then the other one is a dataset that was collected by multiple people. And we'll look at success rate. And when we use diffusion, we see that on both datasets it's able to do pretty well, although it does degrade with multiple humans in the dataset, which means that as you add more diversity in the dataset, performance can go down. And with the Gaussian mixture model, we see that it, well, first it does worse than diffusion, so expressivity is very helpful.","zh":"我们将观察两个不同的演示数据集。一个是仅由一个人收集的数据集，另一个是由多人收集的数据集。我们将观察成功率。当我们使用扩散模型时，我们发现它在这两个数据集上都能表现得相当不错，尽管在多人数据集中性能会有所下降，这意味着随着数据集中多样性增加，性能可能会下降。而使用高斯混合模型时，我们发现它首先比扩散模型表现得更差，这说明表达能力非常重要。","start":2923.18,"end":2950.1},{"id":139,"text":"Expressive distributions is very helpful. And second, it actually goes down a lot more for the multi-human dataset, which means that the expressivity of the distribution is especially important for datasets that have more different kinds of behaviors in them. We can also see this on a real task on a real robot. So this is a task that's actually pretty difficult, hanging a shirt on a hanger.","zh":"表达能力强的分布非常有用。其次，它在多人数据集上的表现下降得更多，这意味着分布的表达能力对于包含更多不同行为类型的数据集尤为重要。我们也可以在真实机器人上的实际任务中看到这一点。这是一个实际上相当困难的任务，即把衬衫挂在衣架上。","start":2950.72,"end":2978.72},{"id":140,"text":"The dataset was collected by lots of different people because it's actually a pretty large dataset. And once you scale up, it's very hard to have a single person with one consistent strategy collect all of your data. So it has different people and different strategies. And it compares using either diffusion, which is very expressive, or an L1 loss, which is a deterministic policy.","zh":"这个数据集是由许多不同的人收集的，因为它实际上是一个相当大的数据集。一旦你进行扩展，就很难让一个人用一个一致的策略收集所有数据。因此，它包含了不同的人和不同的策略。它比较了使用扩散模型（表达能力很强）或L1损失（确定性策略）的效果。","start":2979.22,"end":3002.27},{"id":141,"text":"And what we see first, it's not as successful as the simpler simulated task. But here we see again that having an expressive distribution is really critical for being able to do the task successfully. And if you just use L1 loss, the success rate of the policy drops by nearly 50%. Is there any scenario where you'd want to use a mixture of other models instead of a Gaussian?","zh":"我们首先看到，它的效果并不如更简单的模拟任务那样成功。但在这里我们再次看到，拥有一个表达力强的分布对于成功完成任务至关重要。如果你仅仅使用L1损失，策略的成功率会下降近50%。有没有任何场景是你希望使用其他模型的混合而不是高斯分布？","start":3003.79,"end":3025.64}],"notes":["本段讨论了生成模型在模仿学习中的表现，特别是扩散模型与高斯混合模型的比较。讲者指出扩散模型在表达能力上优于高斯混合模型，尤其在处理多人类数据集时表现更优，但随着数据集多样性增加，性能可能下降。","讲者通过一个实际任务（挂衬衫）来展示生成模型在真实机器人上的应用。数据集由多人收集，包含不同的策略，这使得模型需要具备更强的表达能力。","讲者提到使用L1损失函数会导致策略成功率大幅下降，说明生成模型在处理复杂任务时的重要性。同时，讲者提出了一个开放性问题，询问是否在某些情况下应使用其他模型的混合而非高斯模型。","讲者强调了表达能力在模仿学习中的关键作用，特别是在数据集包含多种行为时。这表明模型的表达能力直接影响其在不同任务中的表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2861.98,"end":3025.64,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2861.98,"text":"that are sampled from the demonstration data set. And this probability is under the policy that we're trying to learn. Cool, and then once we fit this, we should have a policy that's better at actually matching what the expert is doing. And as a result, it should be better at performing the test. Okay, so now why did we learn all this? How well does the generative model work compared to just using an L2 loss?"},{"start":2893.18,"text":"There's a couple of works that have evaluated this more explicitly. So here's a transport task where you need to have one robot kind of transport a tool to another robot, and the policy is controlling both of these robots. And we'll be comparing diffusion and a Gaussian mixture model. Diffusion actually is a lot more expressive than what you can even represent with a Gaussian mixture model. And we'll be looking at two different demonstration datasets. One was a dataset that was just collected by one person."},{"start":2923.18,"text":"And then the other one is a dataset that was collected by multiple people. And we'll look at success rate. And when we use diffusion, we see that on both datasets it's able to do pretty well, although it does degrade with multiple humans in the dataset, which means that as you add more diversity in the dataset, performance can go down. And with the Gaussian mixture model, we see that it, well, first it does worse than diffusion, so expressivity is very helpful."},{"start":2950.72,"text":"Expressive distributions is very helpful. And second, it actually goes down a lot more for the multi-human dataset, which means that the expressivity of the distribution is especially important for datasets that have more different kinds of behaviors in them. We can also see this on a real task on a real robot. So this is a task that's actually pretty difficult, hanging a shirt on a hanger."},{"start":2979.22,"text":"The dataset was collected by lots of different people because it's actually a pretty large dataset. And once you scale up, it's very hard to have a single person with one consistent strategy collect all of your data. So it has different people and different strategies. And it compares using either diffusion, which is very expressive, or an L1 loss, which is a deterministic policy."},{"start":3003.79,"text":"And what we see first, it's not as successful as the simpler simulated task. But here we see again that having an expressive distribution is really critical for being able to do the task successfully. And if you just use L1 loss, the success rate of the policy drops by nearly 50%. Is there any scenario where you'd want to use a mixture of other models instead of a Gaussian?"}],"speech_gaps":[],"frame":"../frames/v029/018.webp","frame_time":2873.98},{"title":"模仿学习中的模型与算法特性","segments":[{"id":142,"text":"Oftentimes other models might already be quite expressive. So not to my knowledge, but it's not completely inconceivable. Okay, now if you actually look at some of the big models that people have been developing in robotics.","zh":"其他模型可能已经相当具有表现力了。据我所知并非如此，但这并不完全不可能。好的，现在如果你实际看一下人们在机器人学中开发的一些大型模型。","start":3027.31,"end":3048.66},{"id":143,"text":"They build on what we covered so far in lecture. And so these are kind of foundation models trained on lots of different demonstration data sets by companies like NVIDIA, Figure, Pi, and this kind of open source vision language action model. Using expressive distributions when you have large scale data sets is a key component of these models.","zh":"它们建立在我们到目前为止在课堂上所讲的内容之上。因此，这些是基础模型，由像NVIDIA、Figure、Pi这样的公司，在大量不同的演示数据集上进行训练，以及这种开源的视觉语言动作模型。当你拥有大规模数据集时，使用具有表现力的分布是这些模型的一个关键组成部分。","start":3050.38,"end":3070.78},{"id":144,"text":"And if you look at some of the big models that people have been developing for autonomous driving at Waymo and Wave, the first one uses discretized and autoregressive prediction. And the second one also uses discretized actions with autoregressive prediction. Great. So a summary so far of what we've talked about. If you have data from one consistent demonstrator, you should learn a unimodal policy distribution. If you have multimodal data from multiple demonstrators, you should learn a distribution.","zh":"如果你看一下人们为自动驾驶开发的一些大型模型，例如Waymo和Wave，第一个模型使用的是离散化和自回归预测，第二个模型也使用离散化动作与自回归预测。很好。到目前为止我们所讨论内容的总结。如果你有来自一个一致演示者的数据，你应该学习一个单峰策略分布。如果你有来自多个演示者的多模态数据，你应该学习一个分布。","start":3072.55,"end":3100.74},{"id":145,"text":"You need an expressive generative model when you have data from multiple people. Very important. And one other thing that I'll mention here is that the algorithm is fully offline. And this is getting into a notion that's very important in reinforcement learning more generally, which is offline algorithms are a bit different from online algorithms. So offline algorithms use only an existing data set, and they don't use any new data.","zh":"当你有来自多个人的数据时，你需要一个具有表现力的生成模型。这非常重要。另外我要提到的一点是，该算法是完全离线的。这涉及到强化学习中一个非常重要的概念，即离线算法与在线算法有所不同。因此，离线算法仅使用现有的数据集，而不使用任何新数据。","start":3101.34,"end":3130.65},{"id":146,"text":"And online means that you're using new data from your learned policy. And this distinction is important in a couple of different ways. Online means that you're going to have to actually kind of recollect data as you run the algorithm. And so this can be expensive. It can also, if your policy might be like under trained in some scenarios, it might be unsafe to run your policy.","zh":"而在线意味着你使用从学习策略中获得的新数据。这种区别在几个方面都很重要。在线意味着你在运行算法时需要实际重新收集数据。因此这可能会很昂贵。此外，如果你的策略在某些情况下可能训练不足，运行你的策略可能会不安全。","start":3131.35,"end":3158.42},{"id":147,"text":"If you're in a medical domain, for example, you might not want to collect online data from a policy that doesn't work fully yet. Thinking about offline algorithms and online algorithms is a key distinction and a key way to think about different algorithms. For what we've covered so far, we don't need any data from the policy, so this is offline. We also don't need to define a reward function.","zh":"如果你处于医疗领域，例如，你可能不希望从尚未完全起作用的策略中收集在线数据。思考离线算法和在线算法是一个关键区别，也是思考不同算法的一种关键方式。就我们迄今为止所涵盖的内容而言，我们不需要任何来自策略的数据，因此这是离线的。我们也不需要定义一个奖励函数。","start":3158.93,"end":3186.01}],"notes":["本段讨论了模仿学习中模型的表达能力，指出已有模型可能已经足够表达，但并非完全不可能。接着提到在机器人领域，大型模型是基于之前课程内容构建的，这些模型使用大量演示数据集进行训练，如NVIDIA、Figure、Pi等公司，以及开源的视觉语言动作模型。使用表达能力强的分布是这些模型的关键组成部分。","在自动驾驶领域，Waymo和Wave开发的模型使用离散和自回归预测。离散动作与自回归预测是这些模型的重要特征。总结部分指出，如果数据来自单一一致的示范者，应学习单峰策略分布；如果数据来自多个示范者，则应学习分布。当数据来自多人时，需要使用表达能力强的生成模型。","本段强调了离线算法与在线算法的区别。离线算法仅使用现有数据集，不使用新数据；而在线算法则使用新数据，这在运行算法时需要重新收集数据，可能成本较高，且在策略未充分训练的情况下可能不安全。例如，在医疗领域，可能不希望使用尚未完全有效的策略收集在线数据。","离线与在线算法的区分是理解不同算法的重要方式。目前所讨论的内容不需要策略的数据，因此是离线的，也不需要定义奖励函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3027.31,"end":3186.01,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3027.31,"text":"Oftentimes other models might already be quite expressive. So not to my knowledge, but it's not completely inconceivable. Okay, now if you actually look at some of the big models that people have been developing in robotics."},{"start":3050.38,"text":"They build on what we covered so far in lecture. And so these are kind of foundation models trained on lots of different demonstration data sets by companies like NVIDIA, Figure, Pi, and this kind of open source vision language action model. Using expressive distributions when you have large scale data sets is a key component of these models."},{"start":3072.55,"text":"And if you look at some of the big models that people have been developing for autonomous driving at Waymo and Wave, the first one uses discretized and autoregressive prediction. And the second one also uses discretized actions with autoregressive prediction. Great. So a summary so far of what we've talked about. If you have data from one consistent demonstrator, you should learn a unimodal policy distribution. If you have multimodal data from multiple demonstrators, you should learn a distribution."},{"start":3101.34,"text":"You need an expressive generative model when you have data from multiple people. Very important. And one other thing that I'll mention here is that the algorithm is fully offline. And this is getting into a notion that's very important in reinforcement learning more generally, which is offline algorithms are a bit different from online algorithms. So offline algorithms use only an existing data set, and they don't use any new data."},{"start":3131.35,"text":"from what you're learning. And online means that you're using new data from your learned policy. And this distinction is important in a couple of different ways. Online means that you're going to have to actually kind of recollect data as you run the algorithm. And so this can be expensive. It can also, if your policy might be like under trained in some scenarios, it might be unsafe to run your policy."},{"start":3158.93,"text":"If you're in a medical domain, for example, you might not want to collect online data from a policy that doesn't work fully yet. Thinking about offline algorithms and online algorithms is a key distinction and a key way to think about different algorithms. For what we've covered so far, we don't need any data from the policy, so this is offline. We also don't need to define a reward function."}],"speech_gaps":[],"frame":"../frames/v029/019.webp","frame_time":3039.31},{"title":"模仿学习中的挑战与监督学习对比","segments":[{"id":148,"text":"Last time we talked about defining reward functions for examples, for some examples, and we talked about how in some examples it might be kind of hard to write down the reward function. So this is pretty nice. Like in driving, you don't have to write down all of the ways in which you might want it to drive. The downside is that you might need a lot of data for reliable performance. You might need a lot of demonstrations. And that ties into how we might try to learn from online interventions.","zh":"上一次我们讨论了如何为示例定义奖励函数，对于一些示例来说，这可能有点困难，因此这非常不错。例如，在驾驶中，你不需要写出所有你希望车辆如何驾驶的方式。缺点是，为了实现可靠的性能，你可能需要大量的数据，或者大量的演示。这也涉及到我们如何尝试从在线干预中学习。","start":3187.23,"end":3214.52},{"id":149,"text":"Yeah, so the question was for the kind of previous videos that I showed imitation learning seems straightforward like what is like the research in it? And is it just doing what we talked about today? There are a couple well, I guess there's a number of different things that went into those different examples the","zh":"是的，之前的问题是关于我展示的模仿学习视频，看起来似乎很直接，比如研究内容是什么？它是否只是我们今天讨论的内容？有一些方面，我想有多个不同的因素影响了这些不同的示例。","start":3215.69,"end":3235.87},{"id":150,"text":"So I can walk through maybe a couple examples. So in the case of the first demonstration, a lot of things went into curation of the data and also the architecture of the model. And so those were two kind of things that were novel about this. In the case of the NVIDIA example, a lot of work went into trying to use data from simulation, especially because collecting data on humanoids is quite challenging and trying to figure out how to leverage that simulation data.","zh":"因此，我可以举几个例子。在第一个演示案例中，数据的整理以及模型的架构都起了很大作用，因此这两个方面是这个案例中比较新颖的地方。在NVIDIA的案例中，很多工作都投入到如何利用模拟数据，尤其是因为收集人类类机器人（humanoids）的数据相当具有挑战性，而且需要想办法利用这些模拟数据。","start":3237.19,"end":3264.39},{"id":151,"text":"In the case of the figure example, there was also some architectural design choices that made it helpful, especially in terms of running models at very high frequency. And in the OpenVLA example, that was also an example where there was a lot of architectural choices in terms of the models. And so it's not just exactly what we talked about, so there is a bit more to it, but what we talked about is a huge driving factor behind these different examples.","zh":"在图示案例中，也有一些架构设计的选择使得模型更有帮助，尤其是在以非常高的频率运行模型方面。在OpenVLA的案例中，这也是一个涉及大量模型架构选择的案例。因此，这不仅仅是我们今天讨论的内容，还有更多内容，但今天我们讨论的内容是这些不同案例背后的重要驱动力。","start":3265.25,"end":3291.33},{"id":152,"text":"These two also went into different co-training objectives and architectures. So we talked a lot about how to train models with imitation learning. And there's one important thing that we haven't covered yet, which is what can go wrong and why imitation learning is kind of challenging. So for this, it's helpful to look at supervised learning. So in supervised learning, we have some data.","zh":"这些案例还涉及不同的协同训练目标和架构。我们讨论了很多如何使用模仿学习来训练模型的问题。还有一个重要的点我们尚未涉及，即什么可能会出错，以及为什么模仿学习具有一定的挑战性。因此，参考监督学习是有帮助的。在监督学习中，我们有一些数据。","start":3293.07,"end":3319.44},{"id":153,"text":"And it's usually kind of trained from one data set that stays fixed. And we try to, and kind of the inputs to the model are completely independent from the predictions that the model makes. Now, this all changes in imitation learning. So say you have a demonstration that is in your data set. And so each of these dots is like a state and then an action, state action, something like this.","zh":"而且它通常是用一个固定的数 据集进行训练的。我们尝试让模型的输入完全独立于模型所做出的预测。但在模仿学习中，这一切都会发生变化。比如说，你有一个演示数据，它包含在你的数据集中。那么每一个这样的点都像是一个状态和一个动作，也就是状态-动作对，类似这样的情况。","start":3321.26,"end":3352.21}],"notes":["本段讨论了模仿学习中的一些挑战，特别是与监督学习的对比。讲者指出，模仿学习不仅仅是简单的模仿示例，还涉及数据的收集、模型架构的设计以及训练目标的选择。监督学习中，数据集是固定的，输入和预测之间是独立的，而模仿学习中，数据集是动态的，输入和预测之间存在依赖关系。","讲者提到，模仿学习的挑战在于如何处理数据的不完整性和模型的泛化能力。例如，在数据收集过程中，可能需要大量的演示数据，而这些数据可能无法完全覆盖所有可能的场景。此外，模型架构的设计也需要考虑如何高效地利用这些数据。","在监督学习中，输入和预测之间是独立的，而在模仿学习中，输入和预测之间存在依赖关系。例如，每个演示数据点包含状态和动作，模型需要根据这些数据点进行学习。","讲者还提到，模仿学习中存在一些挑战，例如如何处理数据的不一致性、如何设计有效的训练目标以及如何确保模型的泛化能力。这些问题需要通过不同的方法来解决，例如使用模拟数据、设计合适的模型架构等。","讲者指出，模仿学习的研究不仅仅是简单的模仿示例，还涉及多个方面，包括数据的收集、模型架构的设计、训练目标的选择以及如何处理数据的不完整性和不一致性。这些因素共同影响了模仿学习的效果。","最后，讲者提到，模仿学习与监督学习在数据处理和模型训练方面存在显著差异。监督学习中，数据集是固定的，而模仿学习中，数据集是动态的，输入和预测之间存在依赖关系。这些差异使得模仿学习更具挑战性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3187.23,"end":3352.21,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3187.23,"text":"Last time we talked about defining reward functions for examples, for some examples, and we talked about how in some examples it might be kind of hard to write down the reward function. So this is pretty nice. Like in driving, you don't have to write down all of the ways in which you might want it to drive. The downside is that you might need a lot of data for reliable performance. You might need a lot of demonstrations. And that ties into how we might try to learn from online interventions."},{"start":3215.69,"text":"Yeah, so the question was for the kind of previous videos that I showed imitation learning seems straightforward like what is like the research in it? And is it just doing what we talked about today? There are a couple well, I guess there's a number of different things that went into those different examples the"},{"start":3237.19,"text":"So I can walk through maybe a couple examples. So in the case of the first demonstration, a lot of things went into curation of the data and also the architecture of the model. And so those were two kind of things that were novel about this. In the case of the NVIDIA example, a lot of work went into trying to use data from simulation, especially because collecting data on humanoids is quite challenging and trying to figure out how to leverage that simulation data."},{"start":3265.25,"text":"In the case of the figure example, there was also some architectural design choices that made it helpful, especially in terms of running models at very high frequency. And in the OpenVLA example, that was also an example where there was a lot of architectural choices in terms of the models. And so it's not just exactly what we talked about, so there is a bit more to it, but what we talked about is a huge driving factor behind these different examples."},{"start":3293.07,"text":"These two also went into different co-training objectives and architectures. So we talked a lot about how to train models with imitation learning. And there's one important thing that we haven't covered yet, which is what can go wrong and why imitation learning is kind of challenging. So for this, it's helpful to look at supervised learning. So in supervised learning, we have some data."},{"start":3321.26,"text":"And it's usually kind of trained from one data set that stays fixed. And we try to, and kind of the inputs to the model are completely independent from the predictions that the model makes. Now, this all changes in imitation learning. So say you have a demonstration that is in your data set. And so each of these dots is like a state and then an action, state action, something like this."}],"speech_gaps":[],"frame":"../frames/v029/020.webp","frame_time":3199.23},{"title":"模仿学习中的分布偏移与误差累积","segments":[{"id":154,"text":"And now you're trying to mimic this demonstration. If you're trying to mimic it and then you roll out your policy starting from this state, maybe at the beginning of the trajectory it's able to do pretty well. But at some point it might make a mistake. The policy isn't going to be perfect. And so if it makes a mistake, maybe it kind of ends up over here a little further from where the demonstration covered.","zh":"现在你试图模仿这个演示。如果你试图模仿它，然后从这个状态开始执行你的策略，可能在轨迹的开始阶段它能够表现得相当不错。但到了某个时刻，它可能会犯错。策略不会是完美的。因此，如果它犯了错误，它可能会有点偏离演示所覆盖的区域。","start":3352.66,"end":3378.53},{"id":155,"text":"And now from this state, it's possible that it actually doesn't have that much data from where it ended up after it made this mistake, even if it was a small mistake. It's going to be kind of potentially underrepresented in the data. And if it's underrepresented, it's actually even more likely to make a mistake in the future. And so if it's more likely to make a mistake, it might actually kind of drift away from the distribution even more.","zh":"现在从这个状态出发，即使它犯的错误很小，它可能实际上并没有太多数据来自它犯错后所到达的状态。它在数据中可能会被低估。如果它被低估，它实际上在未来更有可能再次犯错。因此，如果它更有可能犯错，它可能会进一步偏离分布。","start":3379.88,"end":3404.52},{"id":156,"text":"I mean at that point maybe here it's actually very far away and it makes maybe an even bigger mistake. So this is often referred to as compounding errors because these mistakes, because they can start drifting off the distribution when you make mistakes, those mistakes can then compound as you roll out your policy.","zh":"我的意思是，到那时，它可能已经非常远离分布，并且可能犯下更大的错误。因此，这通常被称为累积误差，因为这些错误，因为它们可能在你犯错时开始偏离分布，这些错误会在你执行策略时进一步累积。","start":3405.06,"end":3436.26},{"id":157,"text":"by your policy is actually different from the distribution of states that's visited by the expert. And this means that you actually, it kind of differs fundamentally from supervised learning. So errors can lead away from the distribution. Errors can then compound. The states visited by the expert are different than the states visited by the learned policy. This is referred to as covariate shift. So it's a kind of distribution shift.","zh":"你的策略所访问的状态分布实际上与专家所访问的状态分布不同。这意味着，它实际上与监督学习有着根本的不同。错误可能导致偏离分布，错误随后会累积。专家访问的状态与学习策略访问的状态不同。这被称为协变量偏移。因此，这是一种分布偏移。","start":3436.99,"end":3468.2},{"id":158,"text":"And this means that you actually, it kind of differs fundamentally from supervised learning. So errors can lead away from the distribution. Errors can then compound. The states visited by the expert are different than the states visited by the learned policy. This is referred to as covariate shift. So it's a kind of distribution shift.","zh":"这意味着，它实际上与监督学习有着根本的不同。错误可能导致偏离分布，错误随后会累积。专家访问的状态与学习策略访问的状态不同。这被称为协变量偏移。因此，这是一种分布偏移。","start":3469.6,"end":3498.95},{"id":159,"text":"So how can we address this? One solution is just to collect a ton of data, train for as long as possible to fit the data as well as you can, and hope for the best. If you have the capacity to do this, it's not a terrible solution. But there's also some other solutions.","zh":"那么我们该如何解决这个问题呢？一种解决方案就是收集大量数据，尽可能长时间地训练以更好地拟合数据，然后寄希望于最好的结果。如果你有这个能力，这并不是一个糟糕的解决方案。但还有其他一些解决方案。","start":3501.49,"end":3520.05}],"notes":["本段讲解了模仿学习中误差累积的问题，即当策略在执行过程中出现错误时，这些错误可能导致状态分布偏离专家演示的分布，从而引发进一步的错误。这种现象被称为误差累积（compounding errors）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3352.66,"end":3520.05,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3352.66,"text":"And now you're trying to mimic this demonstration. If you're trying to mimic it and then you roll out your policy starting from this state, maybe at the beginning of the trajectory it's able to do pretty well. But at some point it might make a mistake. The policy isn't going to be perfect. And so if it makes a mistake, maybe it kind of ends up over here a little further from where the demonstration covered."},{"start":3379.88,"text":"And now from this state, it's possible that it actually doesn't have that much data from where it ended up after it made this mistake, even if it was a small mistake. It's going to be kind of potentially underrepresented in the data. And if it's underrepresented, it's actually even more likely to make a mistake in the future. And so if it's more likely to make a mistake, it might actually kind of drift away from the distribution even more."},{"start":3405.06,"text":"I mean at that point maybe here it's actually very far away and it makes maybe an even bigger mistake. So this is often referred to as compounding errors because these mistakes, because they can start drifting off the distribution when you make mistakes, those mistakes can then compound as you roll out your policy. And as a result of this, and kind of one thing that you see here is that the distribution of states, this pen, sorry, the distribution of states that are visited"},{"start":3436.99,"text":"by your policy is actually different from the distribution of states that's visited by the expert. And this means that you actually, it kind of differs fundamentally from supervised learning. So errors can lead away from the distribution. Errors can then compound. The states visited by the expert are different than the states visited by the learned policy. This is referred to as covariate shift. So it's a kind of distribution shift."},{"start":3469.6,"text":"And that sort of distribution shift can lead to worse performance and also makes it different from supervised learning. So this is one of the reasons why fitting the distribution really well is very important, because if you don't fit it well and you learn only the mean, for example, then you're even more likely to have these kinds of compounding errors. But even if you do fit it well, you might still make mistakes and might drift off the distribution."},{"start":3501.49,"text":"So how can we address this? One solution is just to collect a ton of data, train for as long as possible to fit the data as well as you can, and hope for the best. If you have the capacity to do this, it's not a terrible solution. But there's also some other solutions."}],"speech_gaps":[],"frame":"../frames/v029/021.webp","frame_time":3364.66},{"title":"模仿学习中的纠正数据与策略改进","segments":[{"id":160,"text":"These solutions are actually quite popular in practice. Basically, the key alternative solution is to try to collect corrective data. If we're in this scenario, what we can try to do is, as the policy starts to make a mistake, we could try to say, okay, if you're here, the correct action is to do this. This green data,","zh":"这些解决方案在实践中实际上非常流行。基本上，关键的替代方案是尝试收集纠正数据。如果我们处于这种情境中，我们可以尝试做的是，当策略开始犯错时，我们可以尝试说，如果你在这里，正确的做法是这样做。这种绿色数据","start":3522.02,"end":3548.61},{"id":161,"text":"can be very very helpful to allow the policy to recover from mistakes that it made. So the corrective behave data would be kind of ideally you would learn kind of something like this that tells your policy exactly how to recover and then if you collect this corrective data then you could combine the data in green with the data in black train a policy on that combined data and","zh":"可以非常非常有帮助，使策略能够从它所犯的错误中恢复。因此，纠正行为数据理想情况下应该学习类似这样的东西，告诉你的策略确切的恢复方法。然后如果你收集了这种纠正数据，你可以将绿色数据与黑色数据结合，基于这些组合数据训练策略，并","start":3549.52,"end":3576.93},{"id":162,"text":"then if it makes a mistake, it should actually have examples of how to recover and get back to the distribution because we're actually running our policy and then getting examples of how to recover after running our policy. Does this not overfit the model and make it less generalizable? You would need to make sure that when you collect online data, you collect it in diverse scenarios and not just very narrow scenarios. If you only collect it in a very small amount of scenarios, then these corrections won't be as diverse as your original data set.","zh":"然后如果它犯了错误，它实际上应该有如何恢复并回到分布的示例，因为我们实际上是在运行策略并获取运行策略后如何恢复的示例。这不会不会导致模型过拟合并使其泛化能力变差吗？你需要确保在收集在线数据时，是在多样化的场景中收集，而不是仅仅在非常狭窄的场景中收集。如果你只在非常有限的场景中收集数据，那么这些纠正数据的多样性将不如你的原始数据集。","start":3578.3,"end":3606.67},{"id":163,"text":"Yeah, so the main difference between the learned policy distribution and the expert distribution is just kind of how the actions led to particular states.","zh":"是的，学习策略分布与专家分布之间的主要区别仅仅是动作如何导致特定状态。","start":3607.47,"end":3617.31},{"id":164,"text":"And the reason, yeah, and this is, I'm kind of using this as shorthand for the states visited by the policy. And when you start to incorporate these corrections, you're kind of expanding the distributions of states that you have data for. And you're kind of making your data set, your distribution of states seen in your data set wider to include kind of both PFS and the states that your policy might be likely to visit.","zh":"原因，是的，这我在某种程度上用作策略访问状态的简写。当你开始引入这些纠正措施时，你实际上是在扩展你有数据的状态分布。你实际上是在使你的数据集，你数据集中看到的状态分布更广泛，包括PFS以及你的策略可能更可能访问的状态。","start":3618.55,"end":3646.67},{"id":165,"text":"if it makes mistakes. So in terms of what this looks like as an algorithm, we will first roll out our policy. So this is what's shown in blue here. Then we will query an expert at the states that you visited. And these actions in green are the same as kind of the orange A star on the slide. And then we will aggregate the corrective data","zh":"如果它犯了错误。就算法的外观而言，我们将首先运行我们的策略。这就是这里显示的蓝色部分。然后我们将在你访问的状态处查询专家。这些绿色动作与幻灯片上的橙色A星相同。然后我们将汇总纠正数据","start":3647.04,"end":3677.44}],"notes":["本段讲解了模仿学习中使用纠正数据来帮助策略从错误中恢复的方法。纠正数据通过提供正确的动作示例，使策略能够在出现错误时参考这些数据进行修正。","讲者提到，如果只在狭窄的场景中收集纠正数据，那么这些数据的多样性将低于原始数据集，从而影响策略的泛化能力。因此，需要确保在线数据收集的场景多样化。","在策略执行过程中，纠正数据可以扩展策略访问的状态分布，使数据集包含更多可能的状态，包括策略可能访问的状态和专家策略访问的状态。","讲者还提到，纠正数据的收集和整合是模仿学习算法中的关键步骤，包括策略的执行、专家查询以及纠正数据的聚合。","在算法流程中，首先执行策略，然后在策略访问的状态上查询专家，获取纠正动作，并将这些数据与原始数据结合训练策略。","讲者使用了“PFS”这一术语，可能指代“Policy-Feedback States”或类似概念，但未明确解释，需结合上下文理解。"],"formulas":[],"uncertainties":["PFS（可能指Policy-Feedback States）未明确解释，需结合上下文理解。"],"diagram":"none","start":3522.02,"end":3677.44,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3522.02,"text":"These solutions are actually quite popular in practice. Basically, the key alternative solution is to try to collect corrective data. If we're in this scenario, what we can try to do is, as the policy starts to make a mistake, we could try to say, okay, if you're here, the correct action is to do this. This green data,"},{"start":3549.52,"text":"can be very very helpful to allow the policy to recover from mistakes that it made. So the corrective behave data would be kind of ideally you would learn kind of something like this that tells your policy exactly how to recover and then if you collect this corrective data then you could combine the data in green with the data in black train a policy on that combined data and"},{"start":3578.3,"text":"then if it makes a mistake, it should actually have examples of how to recover and get back to the distribution because we're actually running our policy and then getting examples of how to recover after running our policy. Does this not overfit the model and make it less generalizable? You would need to make sure that when you collect online data, you collect it in diverse scenarios and not just very narrow scenarios. If you only collect it in a very small amount of scenarios, then these corrections won't be as diverse as your original data set."},{"start":3607.47,"text":"Yeah, so the main difference between the learned policy distribution and the expert distribution is just kind of how the actions led to particular states."},{"start":3618.55,"text":"And the reason, yeah, and this is, I'm kind of using this as shorthand for the states visited by the policy. And when you start to incorporate these corrections, you're kind of expanding the distributions of states that you have data for. And you're kind of making your data set, your distribution of states seen in your data set wider to include kind of both PFS and the states that your policy might be likely to visit."},{"start":3647.04,"text":"if it makes mistakes. So in terms of what this looks like as an algorithm, we will first roll out our policy. So this is what's shown in blue here. Then we will query an expert at the states that you visited. And these actions in green are the same as kind of the orange A star on the slide. And then we will aggregate the corrective data"}],"speech_gaps":[],"frame":"../frames/v029/022.webp","frame_time":3534.02},{"title":"模仿学习中的数据集聚合（DAGGR）","segments":[{"id":166,"text":"with the existing, the first demonstration data set, and then we'll update the policy on the aggregated data set. In this updated policy, you could kind of fine-tune the policy, so kind of warm start it, train on the original data set, and then update it with fine-tuning. You could also train from scratch if you're concerned about, I don't know, some biases or something like that, oftentimes you might fine-tune.","zh":"使用现有的第一个演示数据集，然后我们在聚合数据集上更新策略。在这个更新后的策略中，你可以对策略进行微调，因此可以作为一种热启动方式，先在原始数据集上进行训练，然后通过微调来更新策略。如果你担心某些偏差或其他问题，也可以从头开始训练。通常情况下，你可能会选择微调。","start":3678.21,"end":3703.85},{"id":167,"text":"And then you can actually repeat this process. So you can train on the corrective data, get a better policy, and then maybe your policy actually starts making, you have kind of another policy, and maybe it makes mistakes in a different way. And in that case, you'd want to then kind of collect some corrective data from that second policy if a new failure mode or a new kind of mistake emerges.","zh":"然后你可以实际重复这个过程。因此，你可以在纠正数据上进行训练，得到一个更好的策略，然后也许你的策略开始以另一种方式犯错，你可能会有另一个策略。在这种情况下，如果出现了新的故障模式或新的错误类型，你可能需要从第二个策略中收集一些纠正数据。","start":3704.93,"end":3726.61},{"id":168,"text":"This is a repetitive process. This name has a terrible algorithm because it's not very descriptive, but it's called dataset aggregation or DAGGR because you're aggregating data. It's helpful to know terminology, but this, I think, was a bad choice. It's a data-efficient way to learn from an expert.","zh":"这是一个重复的过程。这个名称有一个糟糕的算法，因为它描述性不强，但它被称为数据集聚合或DAGGR，因为你在聚合数据。了解术语是有帮助的，但我觉得这是一个糟糕的选择。这是一种数据高效的学习方式，从专家那里学习。","start":3729.57,"end":3748.29},{"id":169,"text":"but it can be hard to query an expert. And so getting these green actions can be a little bit tricky. So you might have to actually ask a person like, okay, this is what my car did on the road. Like what steering command should it have done instead in those scenarios? And so this sort of data actually can be potentially very hard to collect.","zh":"但查询专家可能会很困难。因此，获取这些绿色动作可能会有点棘手。你可能需要实际询问一个人，例如，我的车在道路上做了什么。在这些情况下，它应该采取什么样的转向指令？因此，这种类型的数据实际上可能非常难以收集。","start":3749.61,"end":3769.39},{"id":170,"text":"Yeah, so how do we get the corrective data? What this would look like is you would run your policy to get this blue trajectory. And so this would be a, this trajectory is like a sequence of like S1, A1, S2, A2, and so forth. And then you would basically like, this is not possible in some scenarios, but you'd ask a person like for this S, what?","zh":"是的，那么我们如何获取纠正数据？这看起来会是这样的：你运行你的策略以获得这条蓝色轨迹。因此，这条轨迹就像一个序列，如S1, A1, S2, A2，依此类推。然后你基本上会问一个人，对于这个S，应该是什么？","start":3770.33,"end":3795.9},{"id":171,"text":"should the A have been? And for this S, what should the A have been? And for this S, what should the A have been? Now, there are scenarios where you can't do that and where this algorithm is just not possible to run. And that kind of leads into potentially a scenario, like another way that we might be able to collect corrective data. We might not be able to tell exactly, like, this is exactly the steering command you should have done because that's very hard to do. And so what we could do instead is","zh":"A 应该是什么？对于这个 S，A 应该是什么？对于这个 S，A 应该是什么？现在，有一些场景你无法做到这一点，这种算法也无法运行。这可能会引导出另一种收集校正数据的场景。我们可能无法确切地告诉某人，比如，这就是你应该执行的转向指令，因为这非常困难。因此，我们所做的可能是","start":3796.4,"end":3823.36},{"id":172,"text":"instead of saying, like, for each of these actions, we want to query what the expert would have done, we're actually going to let the expert take full control at some point. And so what this would look like is something where you start drifting off, the expert notices that a mistake was made, and then takes full control, for example, starts driving the car rather than letting the policy drive the car. And then in this case, you can then add those kind of...","zh":"不是对每个动作都询问专家会怎么做，而是让专家在某个时刻完全接管控制。这会表现为一种情况：你开始偏离轨道，专家注意到错误发生了，然后完全接管控制，例如，开始驾驶汽车而不是让策略来驾驶汽车。在这种情况下，你可以添加这些类型的...","start":3824.47,"end":3852.63}],"notes":["本段讲解了模仿学习中的一种方法，即数据集聚合（DAGGR）。该方法通过不断更新策略，利用已有的演示数据集进行微调，以提高策略的性能。同时，也提到在某些情况下，可能需要从头训练策略，以避免偏差。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3678.21,"end":3852.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3678.21,"text":"with the existing, the first demonstration data set, and then we'll update the policy on the aggregated data set. In this updated policy, you could kind of fine-tune the policy, so kind of warm start it, train on the original data set, and then update it with fine-tuning. You could also train from scratch if you're concerned about, I don't know, some biases or something like that, oftentimes you might fine-tune."},{"start":3704.93,"text":"And then you can actually repeat this process. So you can train on the corrective data, get a better policy, and then maybe your policy actually starts making, you have kind of another policy, and maybe it makes mistakes in a different way. And in that case, you'd want to then kind of collect some corrective data from that second policy if a new failure mode or a new kind of mistake emerges."},{"start":3729.57,"text":"This is a repetitive process. This name has a terrible algorithm because it's not very descriptive, but it's called dataset aggregation or DAGGR because you're aggregating data. It's helpful to know terminology, but this, I think, was a bad choice. It's a data-efficient way to learn from an expert."},{"start":3749.61,"text":"but it can be hard to query an expert. And so getting these green actions can be a little bit tricky. So you might have to actually ask a person like, okay, this is what my car did on the road. Like what steering command should it have done instead in those scenarios? And so this sort of data actually can be potentially very hard to collect."},{"start":3770.33,"text":"Yeah, so how do we get the corrective data? What this would look like is you would run your policy to get this blue trajectory. And so this would be a, this trajectory is like a sequence of like S1, A1, S2, A2, and so forth. And then you would basically like, this is not possible in some scenarios, but you'd ask a person like for this S, what?"},{"start":3796.4,"text":"should the A have been? And for this S, what should the A have been? And for this S, what should the A have been? Now, there are scenarios where you can't do that and where this algorithm is just not possible to run. And that kind of leads into potentially a scenario, like another way that we might be able to collect corrective data. We might not be able to tell exactly, like, this is exactly the steering command you should have done because that's very hard to do. And so what we could do instead is"},{"start":3824.47,"text":"instead of saying, like, for each of these actions, we want to query what the expert would have done, we're actually going to let the expert take full control at some point. And so what this would look like is something where you start drifting off, the expert notices that a mistake was made, and then takes full control, for example, starts driving the car rather than letting the policy drive the car. And then in this case, you can then add those kind of..."}],"speech_gaps":[],"frame":"../frames/v029/023.webp","frame_time":3690.21},{"title":"模仿学习中的专家干预与过拟合问题","segments":[{"id":173,"text":"Instead of trying to query the expert on the policy states, you would start to roll out the learned policy. The expert intervenes when the policy makes a mistake. The expert provides a partial demonstration from the state that the policy visited. So it would take full control and then aggregate this partial demonstration with the original dataset.","zh":"与其试图向专家查询策略状态，你开始会 rollout 学习到的策略。专家会在策略出错时进行干预。专家会从策略访问的状态提供一个部分演示。因此，它会完全接管，然后
