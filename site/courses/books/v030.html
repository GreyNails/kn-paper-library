;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 3 策略梯度（Policy Gradients） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v030","title":"Lecture 3 策略梯度（Policy Gradients）","course":"强化学习","pages":[{"title":"策略梯度（Policy Gradients）","segments":[{"id":0,"text":"Okay, let's get started.","start":5.42,"end":7.04},{"id":1,"text":"As a recap of some of the stuff that we've talked about so far, we formulated this reinforcement learning problem where we have states and actions. We have some kind of trajectories that we might be collecting, which are sequences of states and actions. We have a reward function, which tells us how good is a particular state and action. And also a policy, which is usually what we're trying to learn. And this is representing the behavior that we're trying to learn.","start":7.82,"end":36.66},{"id":2,"text":"And then the goal of reinforcement learning, which we talked about in the first lecture, is to try to maximize the expected sum of rewards. So we want to produce behavior that leads to positive outcomes. And we can actually mathematically write this down as an expectation over the probability distribution over trajectories.","start":37.55,"end":61.21},{"id":3,"text":"where this probability distribution is a function of the policy, which is acting in the world, the environment dynamics, which might be stochastic, and of course, the reward function. Last week on Friday, we started talking about one way to do this, which is if you have expert demonstrations, you can try to imitate the expert by trying to maximize the...","start":61.8,"end":86.94},{"id":4,"text":"likelihood of the actions that the demonstrator did. So trying to actually produce a policy that leads to actions that the expert would have taken. This is a very simple and scalable approach, but it cannot outperform the demonstrator and doesn't allow improvement through trial and error.","start":87.67,"end":104.71},{"id":5,"text":"We also introduced the notion of an offline algorithm that only uses an existing data set and no new data from a learned policy, and an online algorithm that uses new data from the learned policy. And today we'll be talking about ways in which we can use reinforcement learning to outperform the demonstrator, to improve from practice, and specifically we'll be starting to talk about online reinforcement learning algorithms.","start":106.32,"end":130.59},{"id":6,"text":"Particularly, our first online RL algorithm will be policy gradients. We'll talk about a couple different variants of policy gradients and introduce both kind of the mathematical derivation for it as well as some of the intuition behind it. And policy gradients are the basis for some popular reinforcement learning algorithms, including ones that are used to train legged robots, use algorithms that are used to train language models, and are also kind of part of the default project.","start":132.87,"end":160.63}],"notes":["本段介绍了强化学习的基本框架，包括状态、动作、轨迹、奖励函数和策略的概念。强化学习的目标是最大化预期奖励总和，这可以通过对轨迹的概率分布进行期望计算来表达。","课程提到专家演示（expert demonstrations）方法，即通过最大化专家行为的似然来模仿专家，这种方法虽然简单且可扩展，但无法超越专家表现，也不允许通过试错进行改进。","课程区分了离线算法和在线算法。离线算法仅使用现有数据集，而在线算法则利用由学习策略生成的新数据。今天将讨论如何通过在线强化学习算法超越专家表现，实现从实践中改进。","策略梯度是在线强化学习算法的基础，课程将介绍其不同变体，并讨论其数学推导和直觉。策略梯度被用于训练腿部机器人、语言模型等复杂系统，是强化学习中的重要方法。","课程提到策略梯度是默认项目的一部分，暗示其在实际应用中的广泛使用，但未具体说明其在项目中的具体角色。","课程强调策略梯度方法的在线特性，即通过不断与环境交互来更新策略，从而实现性能提升，这与专家演示方法形成对比。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.42,"end":160.63,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.42,"text":"Okay, let's get started."},{"start":7.82,"text":"As a recap of some of the stuff that we've talked about so far, we formulated this reinforcement learning problem where we have states and actions. We have some kind of trajectories that we might be collecting, which are sequences of states and actions. We have a reward function, which tells us how good is a particular state and action. And also a policy, which is usually what we're trying to learn. And this is representing the behavior that we're trying to learn."},{"start":37.55,"text":"And then the goal of reinforcement learning, which we talked about in the first lecture, is to try to maximize the expected sum of rewards. So we want to produce behavior that leads to positive outcomes. And we can actually mathematically write this down as an expectation over the probability distribution over trajectories."},{"start":61.8,"text":"where this probability distribution is a function of the policy, which is acting in the world, the environment dynamics, which might be stochastic, and of course, the reward function. Last week on Friday, we started talking about one way to do this, which is if you have expert demonstrations, you can try to imitate the expert by trying to maximize the..."},{"start":87.67,"text":"likelihood of the actions that the demonstrator did. So trying to actually produce a policy that leads to actions that the expert would have taken. This is a very simple and scalable approach, but it cannot outperform the demonstrator and doesn't allow improvement through trial and error."},{"start":106.32,"text":"We also introduced the notion of an offline algorithm that only uses an existing data set and no new data from a learned policy, and an online algorithm that uses new data from the learned policy. And today we'll be talking about ways in which we can use reinforcement learning to outperform the demonstrator, to improve from practice, and specifically we'll be starting to talk about online reinforcement learning algorithms."},{"start":132.87,"text":"Particularly, our first online RL algorithm will be policy gradients. We'll talk about a couple different variants of policy gradients and introduce both kind of the mathematical derivation for it as well as some of the intuition behind it. And policy gradients are the basis for some popular reinforcement learning algorithms, including ones that are used to train legged robots, use algorithms that are used to train language models, and are also kind of part of the default project."}],"speech_gaps":[],"frame":"../frames/v030/001.webp","frame_time":17.42},{"title":"策略梯度（Policy Gradients）概述","segments":[{"id":7,"text":"We won't get to kind of the complete algorithm that was used to train these today, but we'll get like most of or like halfway there, basically. And by Friday, we'll have most of the algorithm for it. Yeah. And then the key goals will be to try to get the intuition behind policy gradients, how to implement them and when to use them.","start":161.24,"end":191.94},{"id":8,"text":"initialize our policy in some way. When you train a neural network, you need to initialize its weights. We could initialize the weights of our policy randomly. We could also initialize it with imitation learning. We could also use heuristics. It depends on the problem setting. And after we've initialized our policy, we'll run our policy to collect some data. So actually try out different things in the world. Then we'll use that batch of data to improve the policy.","start":192.75,"end":221.03},{"id":9,"text":"And then we will repeat that process. We'll then collect new data with our updated policy and update our policy again using that latest batch of data. So we're going to attempt the task and try to get better. So what this might look like is the first iteration. We kind of attempt whatever, some kind of simple 2D navigation task. The reward for some of them is bad. The reward for other trajectories is like okay. And then after more iterations of this,","start":222.44,"end":250.22},{"id":10,"text":"we might have a policy that's a bit better that is able to get higher reward, but isn't perfect. So sometimes it gets higher reward, sometimes it still gets lower reward. Then we'll use that to improve the policy again. And after more iterations, hopefully we'll get a policy that is able to succeed. So this is kind of this notion of online reinforcement learning, where we're collecting data online and improving using that data. So we talked about this reinforcement learning objective, and...","start":250.75,"end":281.79},{"id":11,"text":"So you have some policy and you want to actually understand how good that policy is. To do that, we can't just actually look at the weights of the neural network. We actually have to run the policy to understand how good it is. And so what we'll do is to estimate this expectation, which is a function of the policy, we can actually just run the policy multiple times, observe the resulting reward, and...","start":282.32,"end":309.02},{"id":12,"text":"then compute the average over the observed reward. And that's an estimate of how good our policy is. So we can then sum over the samples from our policy. Now, let's start to think about how we actually... So we have this trial and error process. We collect some data and we improve our policy. Collecting the data is straightforward. We've talked about how to run a policy to get a rollout.","start":309.74,"end":336.56}],"notes":["本段介绍了强化学习中策略梯度方法的基本思想，即通过在线学习的方式不断收集数据并改进策略。课程提到，策略梯度的目标是理解策略的性能，通过运行策略并计算平均奖励来估计其效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":161.24,"end":336.56,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":161.24,"text":"We won't get to kind of the complete algorithm that was used to train these today, but we'll get like most of or like halfway there, basically. And by Friday, we'll have most of the algorithm for it. Yeah. And then the key goals will be to try to get the intuition behind policy gradients, how to implement them and when to use them. OK, so the outline of an online reinforcement learning algorithm is going to look something like this. So first we need to."},{"start":192.75,"text":"initialize our policy in some way. When you train a neural network, you need to initialize its weights. We could initialize the weights of our policy randomly. We could also initialize it with imitation learning. We could also use heuristics. It depends on the problem setting. And after we've initialized our policy, we'll run our policy to collect some data. So actually try out different things in the world. Then we'll use that batch of data to improve the policy."},{"start":222.44,"text":"And then we will repeat that process. We'll then collect new data with our updated policy and update our policy again using that latest batch of data. So we're going to attempt the task and try to get better. So what this might look like is the first iteration. We kind of attempt whatever, some kind of simple 2D navigation task. The reward for some of them is bad. The reward for other trajectories is like okay. And then after more iterations of this,"},{"start":250.75,"text":"we might have a policy that's a bit better that is able to get higher reward, but isn't perfect. So sometimes it gets higher reward, sometimes it still gets lower reward. Then we'll use that to improve the policy again. And after more iterations, hopefully we'll get a policy that is able to succeed. So this is kind of this notion of online reinforcement learning, where we're collecting data online and improving using that data. So we talked about this reinforcement learning objective, and..."},{"start":282.32,"text":"So you have some policy and you want to actually understand how good that policy is. To do that, we can't just actually look at the weights of the neural network. We actually have to run the policy to understand how good it is. And so what we'll do is to estimate this expectation, which is a function of the policy, we can actually just run the policy multiple times, observe the resulting reward, and..."},{"start":309.74,"text":"then compute the average over the observed reward. And that's an estimate of how good our policy is. So we can then sum over the samples from our policy. Now, let's start to think about how we actually... So we have this trial and error process. We collect some data and we improve our policy. Collecting the data is straightforward. We've talked about how to run a policy to get a rollout."}],"speech_gaps":[],"frame":"../frames/v030/002.webp","frame_time":173.24},{"title":"策略梯度方法的基本概念","segments":[{"id":13,"text":"in the environment. We can kind of sample an action, observe the next state, then run that through our policy again to get a new action and repeat that process. But how do we actually then improve our policy after we've collected that data? So we have our objective, and this can be written down as we have some policy pi theta, and our goal is to maximize the expected rewards when we sample from that policy.","start":336.9,"end":365.79},{"id":14,"text":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory.","start":366.72,"end":395.36},{"id":15,"text":"where this just means the sum of the rewards along that trajectory. So our goal is to maximize the rewards. We're going to maximize this with respect to our policy parameters theta. Now, how do we actually optimize this? So if we want to use gradient descent, because we typically train neural networks with gradient descent, we need to figure out the gradient of this objective with regard to theta.","start":396.37,"end":424.59},{"id":16,"text":"And we'll refer to this term right here as j theta to be able to write it. This is the objective that we're trying to maximize. And it's a little bit challenging to try to get a gradient of this thing directly because the relationship that this has on theta is through the trajectories that we sampled.","start":426.92,"end":451.32},{"id":17,"text":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral.","start":451.85,"end":485.26},{"id":18,"text":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of","start":485.95,"end":516.1}],"notes":["本段讲解了策略梯度方法的基本思想，即通过采样轨迹来最大化期望奖励。讲者提到，策略梯度的目标是最大化奖励总和，而这一目标函数是关于策略参数θ的函数，因此需要计算其梯度。","讲者指出，直接对目标函数求梯度存在困难，因为目标函数的值依赖于采样轨迹，而轨迹的生成过程又依赖于环境的动态特性，这些特性通常是未知的。","为了处理这一问题，讲者建议将期望值写成积分形式，这样可以利用积分的线性性质，将梯度运算引入积分内部，从而得到梯度表达式。","讲者提到，积分形式的期望值可以表示为对轨迹τ的概率分布pθ(τ)和奖励r(τ)的乘积进行积分，这一步是基于期望的定义。","最后，讲者指出，由于积分是求和的线性操作，因此可以将梯度运算引入积分内部，从而得到梯度表达式，这是策略梯度方法的关键步骤之一。","讲者强调，这一过程需要处理采样过程和环境动态的不确定性，因此需要通过数学推导来找到梯度表达式，以便进行梯度下降优化。"],"formulas":[{"latex":"J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi_\\theta} [R(\\tau)]","symbols":"J(θ) 表示目标函数，即期望奖励；τ 表示轨迹；πθ 表示策略；R(τ) 表示轨迹的奖励总和。","explanation":"公式正确，表示目标函数为轨迹的期望奖励。","evidence":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory."},{"latex":"\\mathbb{E}_{\\tau \\sim \\pi_\\theta} [R(\\tau)] = \\int p_\\theta(\\tau) R(\\tau) d\\tau","symbols":"期望值可以表示为积分形式，其中 pθ(τ) 是轨迹的概率分布，R(τ) 是轨迹的奖励总和。","explanation":"公式正确，表示期望值可以写成积分形式。","evidence":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral."},{"latex":"\\nabla_\\theta J(\\theta) = \\int \\nabla_\\theta [p_\\theta(\\tau) R(\\tau)] d\\tau","symbols":"梯度可以通过将梯度运算引入积分内部来计算，从而得到目标函数的梯度表达式。","explanation":"公式正确，表示梯度可以通过将梯度运算引入积分内部来计算。","evidence":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of"}],"uncertainties":[],"diagram":"none","start":336.9,"end":516.1,"asr_flags":[],"math_clarifications":["所有公式均符合数学规范，没有明显的转写或整理错误。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":336.9,"text":"in the environment. We can kind of sample an action, observe the next state, then run that through our policy again to get a new action and repeat that process. But how do we actually then improve our policy after we've collected that data? So we have our objective, and this can be written down as we have some policy pi theta, and our goal is to maximize the expected rewards when we sample from that policy."},{"start":366.72,"text":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory."},{"start":396.37,"text":"where this just means the sum of the rewards along that trajectory. So our goal is to maximize the rewards. We're going to maximize this with respect to our policy parameters theta. Now, how do we actually optimize this? So if we want to use gradient descent, because we typically train neural networks with gradient descent, we need to figure out the gradient of this objective with regard to theta."},{"start":426.92,"text":"And we'll refer to this term right here as j theta to be able to write it. This is the objective that we're trying to maximize. And it's a little bit challenging to try to get a gradient of this thing directly because the relationship that this has on theta is through the trajectories that we sampled."},{"start":451.85,"text":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral."},{"start":485.95,"text":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of"}],"speech_gaps":[],"frame":"../frames/v030/003.webp","frame_time":348.9},{"title":"策略梯度中的梯度计算与技巧","segments":[{"id":19,"text":"the gradient of p theta of tau, r of tau. Now this doesn't really help us directly in any way because we don't want to have to evaluate this integral in order to take a gradient. And at this point there is kind of a trick, a convenient trick that we can use to try to put this into a form that's more useful. And in particular the trick is that","start":518.52,"end":550.63},{"id":20,"text":"and we'll write it over here, is that if you think about p theta of tau times the gradient of p theta of tau, actually, sorry, times the gradient of the log, does anyone remember what the gradient of a log is, or the derivative of log?","start":551.38,"end":585.6},{"id":21,"text":"1 over, right? So then what this is equal to is this is equal to p theta of tau times 1 over p theta of tau. And then we need to use the chain rule to apply the gradient to this. And so with the chain rule, we'll get the gradient of p theta of tau. And these two will then cancel out. And this is equal to the gradient","start":587.79,"end":618.39},{"id":22,"text":"of p theta of tau. And the reason why this is a convenient equality between gradient of p theta and this is we can actually then replace the gradient of p theta down here with this first thing right here. If we replace this gradient of p theta of tau right here, if we replace this, we now get an integral of p theta of tau times grad","start":619.59,"end":649.84},{"id":23,"text":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times","start":653.06,"end":685.51}],"notes":["本段讲解了策略梯度方法中梯度计算的关键技巧，即利用对数梯度的性质来简化积分表达式。讲者首先指出，直接计算梯度积分并不方便，因此引入了一个技巧，即利用对数梯度的性质，将原式转换为更易处理的形式。","讲者通过提问引导学生回忆对数的导数，即梯度的性质，指出梯度的对数等于1/p(theta)。接着，通过链式法则将梯度应用到整个表达式中，使得p(theta)和1/p(theta)相互抵消，从而简化了计算。","讲者进一步说明，这种等价关系使得可以将梯度替换为对数梯度，从而将原积分表达式转换为期望形式。这一步是策略梯度方法中的关键，因为它允许我们通过采样来估计梯度，而不需要显式计算积分。","最后，讲者提到，这种转换后的表达式可以表示为对tau的期望，其中包含梯度对数概率和奖励的乘积。这为后续的策略梯度算法提供了理论基础，即通过采样来估计梯度并更新策略参数。"],"formulas":[{"latex":"\\mathbb{E}_{\\tau \\sim p_\\theta(\\tau)}[\\nabla \\log p_\\theta(\\tau) \\cdot R(\\tau)]","symbols":"期望形式的梯度计算，包含对数梯度和奖励的乘积","explanation":"该公式在原始文本中被明确提及，且数学表达正确，因此保留。","evidence":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times"}],"uncertainties":["log p theta of tau times r of tau p tau"],"diagram":"none","start":518.52,"end":685.51,"asr_flags":[],"math_clarifications":["原始文本中并未明确提及公式0和公式1，因此无法确定其是否应保留。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":518.52,"text":"the gradient of p theta of tau, r of tau. Now this doesn't really help us directly in any way because we don't want to have to evaluate this integral in order to take a gradient. And at this point there is kind of a trick, a convenient trick that we can use to try to put this into a form that's more useful. And in particular the trick is that"},{"start":551.38,"text":"and we'll write it over here, is that if you think about p theta of tau times the gradient of p theta of tau, actually, sorry, times the gradient of the log, does anyone remember what the gradient of a log is, or the derivative of log?"},{"start":587.79,"text":"1 over, right? So then what this is equal to is this is equal to p theta of tau times 1 over p theta of tau. And then we need to use the chain rule to apply the gradient to this. And so with the chain rule, we'll get the gradient of p theta of tau. And these two will then cancel out. And this is equal to the gradient"},{"start":619.59,"text":"of p theta of tau. And the reason why this is a convenient equality between gradient of p theta and this is we can actually then replace the gradient of p theta down here with this first thing right here. If we replace this gradient of p theta of tau right here, if we replace this, we now get an integral of p theta of tau times grad"},{"start":653.06,"text":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times"}],"speech_gaps":[],"frame":"../frames/v030/004.webp","frame_time":530.52},{"title":"策略梯度方法中的期望梯度估计","segments":[{"id":24,"text":"r of tau. So what we did there is we used this log trick to then get the p theta out here and then get an expectation. And we're starting to get to something that's actually more like what we can evaluate. And in particular, this expectation is something that we can estimate with samples. And now theta is actually appearing on the inside here. And that means that this kind of","start":686.57,"end":714.31},{"id":25,"text":"This is actually getting closer to something that we can evaluate. We still have this term right here, which doesn't look like pi of a given f. So we need to kind of work on this term. But we're starting to get towards something that we can evaluate.","start":714.78,"end":727.82},{"id":26,"text":"Yeah, so the question is how is this more useful than the first term because we still have the sampling and the issue with the first case was that we can't differentiate through the sampling. Now the thing that's different here is that theta actually appears inside the expectation. Now we're not going to be able to differentiate through the sampling still, but the thing that's useful here is that we will actually be able to differentiate with respect to theta.","start":728.86,"end":755.24},{"id":27,"text":"We're still not going to differentiate in this part, but we'll be able to get an estimate that's still useful. And we could potentially draw many, many samples and then measure this quantity to get actually a pretty accurate representation of the gradient. In a way that actually depends on theta. Okay, let's talk a little bit about this term right here. So, and actually maybe in case it's useful in terms of where we're at right so far, we can show that on the slides as well.","start":757.35,"end":789.63},{"id":28,"text":"we looked at this J of theta, wrote it down as an integral. We found this convenient identity over here, where P grad log P is equal to grad P. And then we can use that to derive this second equation right here. And now we're right here. So for this part, for grad log P, this is something that we can write out. And if we use","start":790.66,"end":821.04},{"id":29,"text":"if we remember that p theta of tau equals p of s1 times pi of a t given s t and p of s t plus 1 given s t a t and then with a product over t then when we take the log of this as is over there the log of","start":821.51,"end":852.15}],"notes":["本段讲解了策略梯度方法中如何通过引入对数技巧将策略参数θ从期望外部移动到内部，从而使得梯度估计成为可能。虽然仍然存在采样问题，但此时θ出现在期望内部，使得对θ的梯度计算成为可能。","讲者指出，虽然仍然无法对采样过程进行微分，但此时可以对θ进行微分，从而得到梯度估计。这与之前的情况不同，因为之前无法对θ进行微分。","讲者提到，可以通过大量采样来估计梯度，并且这种估计依赖于θ的值。这表明梯度估计是θ的函数，从而使得策略优化成为可能。","讲者提到，他们回顾了J(θ)的表达式，并将其写成积分形式。他们发现了一个有用的恒等式，即P∇log P = ∇P，这可以用来推导出第二个等式。","讲者指出，对于∇log P这一项，可以将其展开并写出具体的表达式。这表明他们正在处理梯度计算中的关键步骤。","讲者提到，他们记得pθ(τ)的表达式，即p(s1)乘以π(a_t|s_t)和p(s_{t+1}|s_t, a_t)的乘积，并且在对数中处理这些项。这表明他们正在处理策略梯度方法中的对数概率计算。"],"formulas":[],"uncertainties":["log of"],"diagram":"none","start":686.57,"end":852.15,"asr_flags":[],"math_clarifications":["公式 $P \\nabla \\log P = \\nabla P$ 不正确，正确的恒等式应为 $\\nabla \\log P = \\frac{\\nabla P}{P}$。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":686.57,"text":"r of tau. So what we did there is we used this log trick to then get the p theta out here and then get an expectation. And we're starting to get to something that's actually more like what we can evaluate. And in particular, this expectation is something that we can estimate with samples. And now theta is actually appearing on the inside here. And that means that this kind of"},{"start":714.78,"text":"This is actually getting closer to something that we can evaluate. We still have this term right here, which doesn't look like pi of a given f. So we need to kind of work on this term. But we're starting to get towards something that we can evaluate."},{"start":728.86,"text":"Yeah, so the question is how is this more useful than the first term because we still have the sampling and the issue with the first case was that we can't differentiate through the sampling. Now the thing that's different here is that theta actually appears inside the expectation. Now we're not going to be able to differentiate through the sampling still, but the thing that's useful here is that we will actually be able to differentiate with respect to theta."},{"start":757.35,"text":"We're still not going to differentiate in this part, but we'll be able to get an estimate that's still useful. And we could potentially draw many, many samples and then measure this quantity to get actually a pretty accurate representation of the gradient. In a way that actually depends on theta. Okay, let's talk a little bit about this term right here. So, and actually maybe in case it's useful in terms of where we're at right so far, we can show that on the slides as well."},{"start":790.66,"text":"we looked at this J of theta, wrote it down as an integral. We found this convenient identity over here, where P grad log P is equal to grad P. And then we can use that to derive this second equation right here. And now we're right here. So for this part, for grad log P, this is something that we can write out. And if we use"},{"start":821.51,"text":"if we remember that p theta of tau equals p of s1 times pi of a t given s t and p of s t plus 1 given s t a t and then with a product over t then when we take the log of this as is over there the log of"}],"speech_gaps":[],"frame":"../frames/v030/005.webp","frame_time":698.57},{"title":"策略梯度（Policy Gradients）","segments":[{"id":30,"text":"p theta of tau is equal to the log of p of s1 plus the sum over t of the log of pi plus the log of the dynamics. And then once we actually take the gradient of log p tau, then","start":853.36,"end":888.84},{"id":31,"text":"the gradient of this with respect to theta, theta doesn't affect the initial state distribution.","start":889.74,"end":894.34},{"id":32,"text":"It also doesn't affect the dynamics in any way. And so the gradient of log p theta of tau","start":894.6,"end":904.64},{"id":33,"text":"is equal to just the gradient of this term right here. So the gradient of","start":904.64,"end":913.26},{"id":34,"text":"of log pi theta of A given S. And so this is really useful","start":913.26,"end":925.28},{"id":35,"text":"because this means that we could actually plug in this over","start":925.28,"end":930.68},{"id":36,"text":"there.","start":930.68,"end":930.98},{"id":37,"text":"And this is actually something that we can evaluate.","start":931.16,"end":932.98},{"id":38,"text":"We can evaluate the gradient of log pi.","start":933.18,"end":938.94},{"id":39,"text":"And this is just taking a backward path through the log of the output of our neural network.","start":938.94,"end":946.74},{"id":40,"text":"And so then we actually get a gradient that we can evaluate.","start":949.88,"end":954.28},{"id":41,"text":"So the gradient that we get when we plug things in, the gradient of J theta, when we plug this in,","start":954.28,"end":973.26},{"id":42,"text":"is we have an expectation over trajectory sampled from our policy. And inside that","start":973.4,"end":983.94},{"id":43,"text":"expectation we will have we can bring the gradient inside that summation and so we'll have a sum over","start":983.94,"end":990.7},{"id":44,"text":"time steps of grad log pi of a t given s t right here and then we still have our r of t right here","start":990.7,"end":1004.26},{"id":45,"text":"so we can write that as r of tau we could also write it as a summation of r","start":1005.06,"end":1011.72},{"id":46,"text":"So this is what's called the policy gradient, or the vanilla policy gradient, and this is","start":1018.22,"end":1026.06},{"id":47,"text":"a lot nicer than the version up there.","start":1026.06,"end":1028.16}],"notes":["本段讲解了策略梯度方法中对轨迹概率的分解，指出策略梯度的计算仅依赖于策略部分，而初始状态分布和动态模型对梯度没有影响。这简化了梯度的计算，因为只需要关注策略部分的梯度。"],"formulas":[{"latex":"\\nabla_\\theta J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi} \\left[ \\sum_t \\nabla_\\theta \\log \\pi(a_t | s_t) r_t \\right]","symbols":"策略梯度的期望形式，通过奖励和策略梯度的乘积求和","explanation":"公式正确表达了策略梯度的期望形式，符合策略梯度定理，因此保留。","evidence":"So the gradient that we get when we plug things in, the gradient of J theta, when we plug this in, is we have an expectation over trajectory sampled from our policy. And inside that expectation we will have we can bring the gradient inside that summation and so we'll have a sum over time steps of grad log pi of a t given s t right here and then we still have our r of t right here so we can write that as r of tau we could also write it as a summation of r"}],"uncertainties":["log of p of s1"],"diagram":"none","start":853.36,"end":1028.16,"asr_flags":[41],"math_clarifications":["原始片段中提到的'log dynamics'和'log p(s_1)'的对数形式可能不准确，因为轨迹概率应为各部分的乘积而非对数之和。此外，梯度仅作用于策略部分的表述需要更明确的数学说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":853.36,"text":"p theta of tau is equal to the log of p of s1 plus the sum over t of the log of pi plus the log of the dynamics. And then once we actually take the gradient of log p tau, then"},{"start":889.74,"text":"the gradient of this with respect to theta, theta doesn't affect the initial state distribution."},{"start":894.6,"text":"It also doesn't affect the dynamics in any way. And so the gradient of log p theta of tau"},{"start":904.64,"text":"is equal to just the gradient of this term right here. So the gradient of"},{"start":913.26,"text":"of log pi theta of A given S. And so this is really useful"},{"start":925.28,"text":"because this means that we could actually plug in this over"},{"start":930.68,"text":"there."},{"start":931.16,"text":"And this is actually something that we can evaluate."},{"start":933.18,"text":"We can evaluate the gradient of log pi."},{"start":938.94,"text":"And this is just taking a backward path through the log of the output of our neural network."},{"start":949.88,"text":"And so then we actually get a gradient that we can evaluate."},{"start":954.28,"text":"So the gradient that we get when we plug things in, the gradient of J theta, when we plug this in,"},{"start":973.4,"text":"is we have an expectation over trajectory sampled from our policy. And inside that"},{"start":983.94,"text":"expectation we will have we can bring the gradient inside that summation and so we'll have a sum over"},{"start":990.7,"text":"time steps of grad log pi of a t given s t right here and then we still have our r of t right here"},{"start":1005.06,"text":"so we can write that as r of tau we could also write it as a summation of r"},{"start":1018.22,"text":"So this is what's called the policy gradient, or the vanilla policy gradient, and this is"},{"start":1026.06,"text":"a lot nicer than the version up there."}],"speech_gaps":[{"start":1012.592,"end":1014.352},{"start":1014.416,"end":1015.984}],"frame":"../frames/v030/006.webp","frame_time":865.36},{"title":"策略梯度方法的实现与梯度估计","segments":[{"id":48,"text":"because we can sample trajectories from our policy, compute their reward, also compute the gradient of log of pi for each of the actions, and then sum those together, multiply, and we can get a gradient that we can apply to the weights of our neural network that's actually leading to higher reward. So again, on the slides.","start":1028.7,"end":1058.83},{"id":49,"text":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta.","start":1060.21,"end":1088.03},{"id":50,"text":"And then we get this final term when we plug it in. So this is the gradient. When we do run policy gradient, we'll collect data and then we'll evaluate this equation. And then we'll use that to represent the gradient of the weights of the policy and then run gradient descent, apply that to our policy and then repeat the process. So, yeah, we also talked about this verbally, but in order to estimate this gradient here.","start":1090.38,"end":1125.09},{"id":51,"text":"We'll run the policy to collect some data. We'll then improve the policy using that data. In particular, you can think of the first summation as collecting n samples for that expectation. And ideally, n is larger because the higher n is, the better an estimate you're going to get of the expectation of the integral. And then once we evaluate this gradient that we're estimating with samples, we'll then take a gradient step on our policy parameters.","start":1125.51,"end":1154.8},{"id":52,"text":"And so the full algorithm looks something like sampling trajectories from our policy, evaluating an estimate of the gradient, using those samples, and then applying that to the weights, and then repeating this process to collect a new batch of data, recomputing the gradient, and improving the policy. So the question is, what does it look like to use the data to estimate this kind of gradient term, like this first term or the second term?","start":1158.51,"end":1187.53}],"notes":["本段讲解了策略梯度方法中如何通过采样轨迹来估计梯度。首先，通过计算轨迹的概率并取对数，将乘积转化为求和，从而简化梯度计算。接着，将对数概率代入梯度公式，发现首项和末项与参数θ无关，因此可以忽略。最终得到的梯度项用于更新策略参数。","在实际运行策略梯度算法时，需要收集数据并评估梯度估计。通过这些数据，可以计算出策略参数的梯度，并使用梯度下降法进行更新。重复这一过程可以逐步改进策略。","为了提高梯度估计的准确性，通常会增加样本数量n。样本数量越大，对期望值的估计越精确。在评估梯度后，会根据估计结果对策略参数进行梯度更新。","整个策略梯度算法的流程包括：从策略中采样轨迹，估计梯度，使用这些样本更新策略参数，并重复这一过程以收集新的数据，重新计算梯度并改进策略。","最后，课程提出了一个关键问题：如何利用数据来估计这种梯度项，例如第一项或第二项。这引导学生思考具体的实现细节和梯度估计方法。","这些内容强调了策略梯度方法的核心思想，即通过采样和梯度估计来优化策略参数，从而提高策略的奖励。"],"formulas":[{"latex":"log p(\\tau) = \\sum_{t=1}^{T} \\log \\pi(a_t | s_t)","symbols":"对数概率的展开形式","explanation":"正确地将轨迹概率的对数展开为各个时间步动作概率的对数和，符合概率论的基本性质。","evidence":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta."},{"latex":"\\nabla_\\theta \\mathbb{E}_{\\tau \\sim \\pi_\\theta} [\\log p(\\tau)]","symbols":"梯度的期望形式","explanation":"正确地表示了对轨迹概率对数的期望的梯度，符合策略梯度方法的基本框架。","evidence":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta."}],"uncertainties":[],"diagram":"none","start":1028.7,"end":1187.53,"asr_flags":[],"math_clarifications":["公式2中的乘法符号应为加法，因为策略梯度的最终形式是期望值的和，而非乘积。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1028.7,"text":"because we can sample trajectories from our policy, compute their reward, also compute the gradient of log of pi for each of the actions, and then sum those together, multiply, and we can get a gradient that we can apply to the weights of our neural network that's actually leading to higher reward. So again, on the slides."},{"start":1060.21,"text":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta."},{"start":1090.38,"text":"And then we get this final term when we plug it in. So this is the gradient. When we do run policy gradient, we'll collect data and then we'll evaluate this equation. And then we'll use that to represent the gradient of the weights of the policy and then run gradient descent, apply that to our policy and then repeat the process. So, yeah, we also talked about this verbally, but in order to estimate this gradient here."},{"start":1125.51,"text":"We'll run the policy to collect some data. We'll then improve the policy using that data. In particular, you can think of the first summation as collecting n samples for that expectation. And ideally, n is larger because the higher n is, the better an estimate you're going to get of the expectation of the integral. And then once we evaluate this gradient that we're estimating with samples, we'll then take a gradient step on our policy parameters."},{"start":1158.51,"text":"And so the full algorithm looks something like sampling trajectories from our policy, evaluating an estimate of the gradient, using those samples, and then applying that to the weights, and then repeating this process to collect a new batch of data, recomputing the gradient, and improving the policy. So the question is, what does it look like to use the data to estimate this kind of gradient term, like this first term or the second term?"}],"speech_gaps":[],"frame":"../frames/v030/007.webp","frame_time":1040.7},{"title":"策略梯度算法的数学基础","segments":[{"id":53,"text":"Cool? The first term. Yeah, so when we're using the data to compute this first term, what we're doing is we're getting a bunch of states and actions, a bunch of trajectories. We're getting n trajectories that each, in this case, have length t time steps. And we'll be taking the states and actions in those trajectories, passing the state through the policy.","start":1188.56,"end":1210.31},{"id":54,"text":"As a forward pass to get the probability over actions will then evaluate the action in the data","start":1211.35,"end":1216.67},{"id":55,"text":"the probability of that","start":1217.23,"end":1218.61},{"id":56,"text":"of that action in the data under the distribution that the policy output so if it's like a","start":1219.21,"end":1224.41},{"id":57,"text":"Categorical distribution will then get the probability. We'll take the log of that probability and","start":1225.83,"end":1230.35},{"id":58,"text":"Then we take the gradient right here, which will just be a forward pass through sorry a backward pass through the network","start":1230.35,"end":1234.99},{"id":59,"text":"After taking the log of the policy output for that action","start":1236.37,"end":1240.25},{"id":60,"text":"So this is called the Reinforced Algorithm, or the Vanilla Policy Gradient Algorithm.","start":1241.47,"end":1245.41},{"id":61,"text":"Yeah, so this came out, this is just R of tau.","start":1246.33,"end":1248.35},{"id":62,"text":"So I'm using R of tau as shorthand for this, just because I didn't want to write this summation","start":1248.99,"end":1254.63},{"id":63,"text":"five times.","start":1255.33,"end":1255.97},{"id":64,"text":"But yeah, this is exactly R of tau.","start":1257.29,"end":1259.75},{"id":65,"text":"Yeah, exactly.","start":1260.63,"end":1261.23},{"id":66,"text":"So this is an estimate because we're only going to be taking n samples to estimate this","start":1261.35,"end":1264.99},{"id":67,"text":"expectation.","start":1264.99,"end":1265.25},{"id":68,"text":"If you took infinite, then this would be exact.","start":1265.25,"end":1270.11},{"id":69,"text":"Of course, taking infinite samples is not possible.","start":1270.95,"end":1273.25},{"id":70,"text":"Yeah, so the gradient right here, this is going to depend on the architecture.","start":1274.19,"end":1277.13},{"id":71,"text":"The question was, do we compute this by hand?","start":1278.23,"end":1280.01},{"id":72,"text":"You can use automatic differentiation.","start":1281.21,"end":1283.25},{"id":73,"text":"So like whatever library, PyTorch or whatever, that can compute that for you.","start":1283.99,"end":1287.53},{"id":74,"text":"So you don't have to write it up.","start":1287.55,"end":1289.03},{"id":75,"text":"Great. So let's talk about some of the intuition behind this.","start":1290.25,"end":1292.37},{"id":76,"text":"so there's the math. But what does this gradient actually mean? So if you look at this,","start":1292.37,"end":1298.71},{"id":77,"text":"maybe let's start by looking at the first term. The first term, if we kind of think back to","start":1299.49,"end":1305.61},{"id":78,"text":"imitation learning, this first term is actually the same as the gradient of the imitation learning","start":1305.61,"end":1311.53},{"id":79,"text":"objective. So in imitation learning, we were trying to mimic actions from some demonstration","start":1311.53,"end":1316.39},{"id":80,"text":"data set by maximizing the log probability or minimizing the negative log probability.","start":1316.39,"end":1321.99},{"id":81,"text":"And if you take the gradient of that, it's similarly going to be the gradient of the log probability. You can think about this first term as saying I'm going to basically try to increase the likelihood of the actions in the online data. But then for the second term, it's weighting that by the reward of that trajectory. Like how good was that trajectory? And so you can kind of think about this as the imitation gradient, but weighted by","start":1323.19,"end":1353.52}],"notes":["本段讲解了策略梯度算法中第一项的计算过程，即通过数据计算策略输出的概率，并取对数。这部分涉及从状态和动作中获取轨迹，通过策略网络进行前向传播以获得动作的概率分布。接着，通过反向传播计算梯度，这与神经网络的自动微分机制相关。","讲者提到，第一项与模仿学习中的梯度目标相似，即最大化对数概率或最小化负对数概率。这表明策略梯度算法在某种程度上与模仿学习的目标一致，但加入了奖励的加权。","讲者强调，由于只能使用有限样本进行估计，因此该梯度是一个估计值，而不是精确值。如果使用无限样本，该估计将变得精确，但实际中这是不可能的。","讲者还提到梯度的计算依赖于网络的架构，并指出可以使用自动微分工具（如PyTorch）来计算梯度，而无需手动推导。","最后，讲者提到该算法被称为“Reinforced Algorithm”或“Vanilla Policy Gradient Algorithm”，并指出其数学表达式为R(τ)，即轨迹的累积奖励。","讲者通过对比模仿学习和策略梯度算法，强调了策略梯度算法在最大化动作概率的同时，还考虑了轨迹的奖励，从而实现了强化学习的目标。"],"formulas":[],"uncertainties":["Categorical distribution will then get the probability. We'll take the log of that probability and"],"diagram":"none","start":1188.56,"end":1353.52,"asr_flags":[67],"math_clarifications":["原始文本中并未明确给出R(τ)的具体数学表达式，仅提到R(τ)作为轨迹的累积奖励。因此，无法核定该公式是否准确或完整。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1188.56,"text":"Cool? The first term. Yeah, so when we're using the data to compute this first term, what we're doing is we're getting a bunch of states and actions, a bunch of trajectories. We're getting n trajectories that each, in this case, have length t time steps. And we'll be taking the states and actions in those trajectories, passing the state through the policy."},{"start":1211.35,"text":"As a forward pass to get the probability over actions will then evaluate the action in the data"},{"start":1217.23,"text":"the probability of that"},{"start":1219.21,"text":"of that action in the data under the distribution that the policy output so if it's like a"},{"start":1225.83,"text":"Categorical distribution will then get the probability. We'll take the log of that probability and"},{"start":1230.35,"text":"Then we take the gradient right here, which will just be a forward pass through sorry a backward pass through the network"},{"start":1236.37,"text":"After taking the log of the policy output for that action"},{"start":1241.47,"text":"So this is called the Reinforced Algorithm, or the Vanilla Policy Gradient Algorithm."},{"start":1246.33,"text":"Yeah, so this came out, this is just R of tau."},{"start":1248.99,"text":"So I'm using R of tau as shorthand for this, just because I didn't want to write this summation"},{"start":1255.33,"text":"five times."},{"start":1257.29,"text":"But yeah, this is exactly R of tau."},{"start":1260.63,"text":"Yeah, exactly."},{"start":1261.35,"text":"So this is an estimate because we're only going to be taking n samples to estimate this"},{"start":1264.99,"text":"expectation."},{"start":1265.25,"text":"If you took infinite, then this would be exact."},{"start":1270.95,"text":"Of course, taking infinite samples is not possible."},{"start":1274.19,"text":"Yeah, so the gradient right here, this is going to depend on the architecture."},{"start":1278.23,"text":"The question was, do we compute this by hand?"},{"start":1281.21,"text":"You can use automatic differentiation."},{"start":1283.99,"text":"So like whatever library, PyTorch or whatever, that can compute that for you."},{"start":1287.55,"text":"So you don't have to write it up."},{"start":1290.25,"text":"Great. So let's talk about some of the intuition behind this."},{"start":1292.37,"text":"so there's the math. But what does this gradient actually mean? So if you look at this,"},{"start":1299.49,"text":"maybe let's start by looking at the first term. The first term, if we kind of think back to"},{"start":1305.61,"text":"imitation learning, this first term is actually the same as the gradient of the imitation learning"},{"start":1311.53,"text":"objective. So in imitation learning, we were trying to mimic actions from some demonstration"},{"start":1316.39,"text":"data set by maximizing the log probability or minimizing the negative log probability."},{"start":1323.19,"text":"And if you take the gradient of that, it's similarly going to be the gradient of the log probability. You can think about this first term as saying I'm going to basically try to increase the likelihood of the actions in the online data. But then for the second term, it's weighting that by the reward of that trajectory. Like how good was that trajectory? And so you can kind of think about this as the imitation gradient, but weighted by"}],"speech_gaps":[],"frame":"../frames/v030/008.webp","frame_time":1200.56},{"title":"策略梯度与模仿学习的对比","segments":[{"id":82,"text":"the sum of rewards seen in the data. And so essentially, you're going to increase the likelihood of actions that had high reward and decrease the likelihood of actions that were taken in negative reward trajectories. And so you're actually going to be imitating your own data, the data that was collected by the policy. But depending on whether it's high reward or low reward, you will be...","start":1354.17,"end":1381.52},{"id":83,"text":"you might actually have a negative gradient. If it's negative reward, it's going to push you away from the bad stuff and push you towards the good stuff. So this is inside the first summation. You can see the i comes up right here. So we're summing a bunch of trajectories, and then this is all within the summation over n. So the question is, is the difference between this and imitation learning, where imitation learning, you're either right or wrong, or here you're this amount of right or this amount of wrong?","start":1382.54,"end":1409.14},{"id":84,"text":"So you can apply this, well in principle you can apply this in scenarios where the reward is very sparse.","start":1411.09,"end":1417.88},{"id":85,"text":"And so you can actually apply it in scenarios where the reward is just like one if you succeeded and zero otherwise. Now, this algorithm may not do very well in those scenarios, and we'll talk about that. One of the key differences with imitation learning is that you're actually doing this on your own rollouts. So the policy is collecting its own data and then applying this objective to its own data. And so that's one of the differences. And then second is we're actually using this reward, whereas in imitation learning, you're just blindly imitating all the data.","start":1418.35,"end":1446.29},{"id":86,"text":"without any notion of how good the data is. And it kind of assumes that it's good data. Yeah, how do you sample the first state of the trajectory? This is something that's typically defined by the problem setting. So in some problem settings, if you're trying to train an agent to play pinball or something, then the initial state will just be given by the pinball machine.","start":1446.7,"end":1470.32},{"id":87,"text":"So it's usually thought of as a property of the environment. So the question is, can you use this to improve imitation learning by weighting the trajectories by reward? Yeah, you could definitely do that. We will also talk about some of the good things and bad things about this objective in the coming slides.","start":1472.47,"end":1498.26},{"id":88,"text":"Yeah, so the question was, in practice, does it make sense to start with imitation learning, run that for a number of iterations, and then switch to this?","start":1499.22,"end":1504.86},{"id":89,"text":"That can definitely make sense. If you start completely from a randomly initialized policy, it will do random stuff. And if you have a very dense reward signal, that can be okay. But in other scenarios, if you have access to demonstrations, then initializing with demonstrations can be a very good fit. And then it will allow you to improve on top of your initial policy.","start":1505.83,"end":1528.75}],"notes":["本段讨论了策略梯度方法与模仿学习之间的区别。策略梯度方法通过奖励来调整策略，增加高奖励动作的概率，减少低奖励动作的概率，而模仿学习则是直接复制数据。策略梯度方法在奖励稀疏的场景中可能表现不佳，但可以通过自身收集的数据进行优化。","策略梯度方法的一个关键区别在于，它使用自身的数据进行训练，而不是盲目地模仿所有数据。这使得策略梯度方法能够根据奖励的大小调整策略，而模仿学习则没有这种机制。","在某些情况下，可以将模仿学习与策略梯度方法结合使用。例如，先使用模仿学习进行初始化，再切换到策略梯度方法进行优化。这种方法在奖励信号密集的场景中可能更有效。","初始状态的采样通常由环境定义，例如在玩弹珠时初始状态由弹珠机给出，在语言建模中初始状态可能是用户的问题。这种初始状态的设定是环境的一部分。","策略梯度方法可以通过对轨迹进行加权来改进模仿学习。通过奖励对轨迹进行加权，可以更有效地优化策略，而不仅仅是复制数据。","在实际应用中，策略梯度方法可能需要较多的训练数据和计算资源，尤其是在奖励稀疏的场景中。因此，结合模仿学习进行初始化可能是一个有效的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1354.17,"end":1528.75,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1354.17,"text":"the sum of rewards seen in the data. And so essentially, you're going to increase the likelihood of actions that had high reward and decrease the likelihood of actions that were taken in negative reward trajectories. And so you're actually going to be imitating your own data, the data that was collected by the policy. But depending on whether it's high reward or low reward, you will be..."},{"start":1382.54,"text":"you might actually have a negative gradient. If it's negative reward, it's going to push you away from the bad stuff and push you towards the good stuff. So this is inside the first summation. You can see the i comes up right here. So we're summing a bunch of trajectories, and then this is all within the summation over n. So the question is, is the difference between this and imitation learning, where imitation learning, you're either right or wrong, or here you're this amount of right or this amount of wrong?"},{"start":1411.09,"text":"So you can apply this, well in principle you can apply this in scenarios where the reward is very sparse."},{"start":1418.35,"text":"And so you can actually apply it in scenarios where the reward is just like one if you succeeded and zero otherwise. Now, this algorithm may not do very well in those scenarios, and we'll talk about that. One of the key differences with imitation learning is that you're actually doing this on your own rollouts. So the policy is collecting its own data and then applying this objective to its own data. And so that's one of the differences. And then second is we're actually using this reward, whereas in imitation learning, you're just blindly imitating all the data."},{"start":1446.7,"text":"without any notion of how good the data is. And it kind of assumes that it's good data. Yeah, how do you sample the first state of the trajectory? This is something that's typically defined by the problem setting. So in some problem settings, if you're trying to train an agent to play pinball or something, then the initial state will just be given by the pinball machine."},{"start":1472.47,"text":"In other cases, in language modeling, the initial state or observation might be the first question that the user asks. So it's usually thought of as a property of the environment. So the question is, can you use this to improve imitation learning by weighting the trajectories by reward? Yeah, you could definitely do that. We will also talk about some of the good things and bad things about this objective in the coming slides."},{"start":1499.22,"text":"Yeah, so the question was, in practice, does it make sense to start with imitation learning, run that for a number of iterations, and then switch to this?"},{"start":1505.83,"text":"That can definitely make sense. If you start completely from a randomly initialized policy, it will do random stuff. And if you have a very dense reward signal, that can be okay. But in other scenarios, if you have access to demonstrations, then initializing with demonstrations can be a very good fit. And then it will allow you to improve on top of your initial policy."}],"speech_gaps":[],"frame":"../frames/v030/009.webp","frame_time":1366.17},{"title":"策略梯度与奖励学习","segments":[{"id":90,"text":"So the question is, if you don't have a good conception of what's good and bad, like what the reward function should be, can you use imitation learning to kind of get an initial sense for that? We'll talk about reward learning in a few lectures and how you can potentially use expert data for that. In practice, it's challenging.","start":1529.72,"end":1549.94},{"id":91,"text":"So we talked about how this kind of is intuitively increasing likelihood on high reward trajectories and decreasing likelihood on negative reward trajectories. If we actually look at this visually, say that we took a few trajectories, one of them had good reward, one of them had bad reward, and this red is kind of showing our initial distribution over trajectories. What this gradient is going to do is it's going to increase the likelihood on the green part, so you'll get something that looks like this.","start":1551.89,"end":1578.71},{"id":92,"text":"And then it'll decrease the likelihood on the red part, so you'll get something that looks like this. And it'll encourage the policy to take actions that are more like the high-reward trajectory. In even more brief terms, you can think of this as trying to do more of the good stuff and less of the bad stuff that you observed. And then you can also think about this as kind of a formalization of trial and error, where you're actually going to try to do different things. And if you see...","start":1579.29,"end":1610.92},{"id":93,"text":"good stuff happening, then you'll try to do more of that. And if you make a mistake, then you'll try to stop doing that. Cool. So now I have a question for you. So let's look at an example. Say that we're trying to have a humanoid learn how to walk in simulation. And we'll define the reward function to be the forward velocity of the robot. This means that the reward function will be positive if it's moving forward. It may also be negative if the robot is moving backwards. It might be zero if the robot is not moving.","start":1611.5,"end":1640.83},{"id":94,"text":"First, we'll sample from our policy. Say we have a policy that's not very good at the beginning. So in the first trajectory, maybe it falls backwards. In the second trajectory, maybe it falls forwards, which will actually technically give it positive reward. So the sum of rewards will be positive. Maybe in another trajectory, it manages to stand still. So the rewards would be zero for that.","start":1643.15,"end":1665.25},{"id":95,"text":"In another trajectory, maybe it takes one small step forward and then falls backwards. And so the initial reward at the beginning of the trajectory would actually be getting positive rewards. And then later on, it would be getting negative rewards and the sum of rewards would be negative. And then maybe the last trajectory is it takes one large step backwards and then a small step forwards. And in this case, it would have kind of negative rewards and then some positive rewards, but the sum of rewards would still be negative.","start":1666.19,"end":1694.3}],"notes":["本段讨论了策略梯度方法的基本思想，即通过增加高奖励轨迹的概率并减少低奖励轨迹的概率来优化策略。讲者提到，梯度会增加绿色部分（高奖励轨迹）的概率，同时减少红色部分（低奖励轨迹）的概率，从而鼓励策略采取更接近高奖励轨迹的行为。","讲者进一步解释了策略梯度方法可以被视为一种形式化的试错过程，即通过尝试不同的行为并根据结果调整策略。如果观察到好的结果，策略会倾向于重复该行为；如果出现错误，则会减少该行为的发生。","在举例部分，讲者以一个模拟中的人形机器人学习行走为例，说明了奖励函数的定义。奖励函数被定义为机器人的前向速度，因此正向移动会获得正奖励，反向移动会获得负奖励，静止则获得零奖励。","接着，讲者描述了不同轨迹的奖励情况。例如，一个轨迹可能在开始时获得正奖励，但随后获得负奖励，导致总奖励为负；另一个轨迹可能在开始时获得正奖励，但最终总奖励仍为负。","通过这些例子，讲者展示了策略梯度方法如何通过调整策略来最大化期望奖励，从而引导策略向更优的方向发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1529.72,"end":1694.3,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1529.72,"text":"So the question is, if you don't have a good conception of what's good and bad, like what the reward function should be, can you use imitation learning to kind of get an initial sense for that? We'll talk about reward learning in a few lectures and how you can potentially use expert data for that. In practice, it's challenging."},{"start":1551.89,"text":"So we talked about how this kind of is intuitively increasing likelihood on high reward trajectories and decreasing likelihood on negative reward trajectories. If we actually look at this visually, say that we took a few trajectories, one of them had good reward, one of them had bad reward, and this red is kind of showing our initial distribution over trajectories. What this gradient is going to do is it's going to increase the likelihood on the green part, so you'll get something that looks like this."},{"start":1579.29,"text":"And then it'll decrease the likelihood on the red part, so you'll get something that looks like this. And it'll encourage the policy to take actions that are more like the high-reward trajectory. In even more brief terms, you can think of this as trying to do more of the good stuff and less of the bad stuff that you observed. And then you can also think about this as kind of a formalization of trial and error, where you're actually going to try to do different things. And if you see..."},{"start":1611.5,"text":"good stuff happening, then you'll try to do more of that. And if you make a mistake, then you'll try to stop doing that. Cool. So now I have a question for you. So let's look at an example. Say that we're trying to have a humanoid learn how to walk in simulation. And we'll define the reward function to be the forward velocity of the robot. This means that the reward function will be positive if it's moving forward. It may also be negative if the robot is moving backwards. It might be zero if the robot is not moving."},{"start":1643.15,"text":"First, we'll sample from our policy. Say we have a policy that's not very good at the beginning. So in the first trajectory, maybe it falls backwards. In the second trajectory, maybe it falls forwards, which will actually technically give it positive reward. So the sum of rewards will be positive. Maybe in another trajectory, it manages to stand still. So the rewards would be zero for that."},{"start":1666.19,"text":"In another trajectory, maybe it takes one small step forward and then falls backwards. And so the initial reward at the beginning of the trajectory would actually be getting positive rewards. And then later on, it would be getting negative rewards and the sum of rewards would be negative. And then maybe the last trajectory is it takes one large step backwards and then a small step forwards. And in this case, it would have kind of negative rewards and then some positive rewards, but the sum of rewards would still be negative."}],"speech_gaps":[],"frame":"../frames/v030/010.webp","frame_time":1541.72},{"title":"策略梯度中的梯度作用与轨迹多样性","segments":[{"id":96,"text":"Now, my question for you is, what will the gradient that we defined here, what will it encourage the policy to do if this is your data set, if these are the five trajectories that you sampled? This is going to be one of our simpler examples, and then we'll move to more complex examples in a couple more slides.","start":1696.08,"end":1718.4},{"id":97,"text":"So I'd encourage you to pair up for a minute, discuss it briefly, and then we'll come back and share in like one or two minutes. Okay, let's come back. If you want to share your answer, can you raise your hand? Okay, so the gradient will encourage it to fall forwards and potentially stand still. So, cool.","start":1718.97,"end":1741.05},{"id":98,"text":"Mostly correct. So if we think through each of these trajectories, the first one, the reward, will be negative here. It'll also be negative. The sum of rewards over the entire trajectory will be negative for 1, 4, and 5. It should be about 0 for 3. And for 2, the sum should be positive. And so what this means is you'll get negative gradients for...","start":1742.22,"end":1764.62},{"id":99,"text":"any actions that were taken in 1, 4, and 5, you'll get positive gradients for all the actions taken in 2, and you'll get roughly zero gradients for all the actions that are taken in trajectory 3. And so this means that it will encourage it to fall forwards, and it'll encourage it to not do the things that were in 1, 4, and 5, so it will discourage it from taking steps backwards or forwards, and will also discourage it from falling backwards.","start":1765.02,"end":1790.52},{"id":100,"text":"Cool. So yeah, so we encourage the policy to fall forwards and not take steps. This is distressing because we don't want our policy to fall forward. We want to take steps. And so this is a kind of example of how the gradient that we're getting is noisy, high variance. It means that depending on what these trajectories are, the gradient might vary drastically. So if you do actually have some trajectories that are walking forwards.","start":1792.11,"end":1817.49},{"id":101,"text":"you might actually get a very different gradient estimate from this set of trajectories. And so that's kind of the definition of having noise or having high variance. Yeah, so the question is why are we getting multiple trajectories from the same policy? Like why not just get one?","start":1818.35,"end":1831.65},{"id":102,"text":"There's two reasons for this. One is that the policy is not deterministic. And so if we want to explore different strategies, we will get kind of different samples of different strategies because it's not deterministic. And the second reason is also the environment might be stochastic. And so even if you have a deterministic policy, you might see different outcomes. And this will help you learn about those different outcomes. There's one thing that we can do about this that we can already kind of directly improve the gradient in a fairly simple way.","start":1832.91,"end":1860.45}],"notes":["本段讨论了策略梯度中梯度的作用，指出梯度会鼓励策略采取某些动作，例如向前倒下或保持静止。同时，讲者提到梯度估计可能具有高方差，因为不同轨迹可能导致不同的梯度估计。","讲者进一步解释了为何需要从同一策略中获取多个轨迹，原因包括策略的非确定性和环境的随机性。非确定性策略会生成不同的策略样本，而随机环境即使有确定性策略也会导致不同结果，这有助于学习不同结果。","讲者提到可以通过直接改进梯度来应对轨迹多样性带来的问题，但未具体说明如何改进。这表明在策略梯度方法中，轨迹多样性是不可避免的，且需要通过其他技术（如重要性采样或基线）来减少方差。","讲者强调了梯度估计的高方差问题，指出不同轨迹可能导致梯度估计差异很大，这会影响策略的更新效果。因此，减少方差是策略梯度方法中的一个重要挑战。","讲者通过一个具体的例子说明了梯度如何影响策略：对于奖励总和为负的轨迹，梯度会鼓励策略避免这些动作；而对于奖励总和为正的轨迹，梯度会鼓励策略采取这些动作。","讲者最后提到，虽然轨迹多样性可能带来噪声，但这是学习过程中必要的，因为不同轨迹提供了不同的信息，有助于策略的优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1696.08,"end":1860.45,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1696.08,"text":"Now, my question for you is, what will the gradient that we defined here, what will it encourage the policy to do if this is your data set, if these are the five trajectories that you sampled? This is going to be one of our simpler examples, and then we'll move to more complex examples in a couple more slides."},{"start":1718.97,"text":"So I'd encourage you to pair up for a minute, discuss it briefly, and then we'll come back and share in like one or two minutes. Okay, let's come back. If you want to share your answer, can you raise your hand? Okay, so the gradient will encourage it to fall forwards and potentially stand still. So, cool."},{"start":1742.22,"text":"Mostly correct. So if we think through each of these trajectories, the first one, the reward, will be negative here. It'll also be negative. The sum of rewards over the entire trajectory will be negative for 1, 4, and 5. It should be about 0 for 3. And for 2, the sum should be positive. And so what this means is you'll get negative gradients for..."},{"start":1765.02,"text":"any actions that were taken in 1, 4, and 5, you'll get positive gradients for all the actions taken in 2, and you'll get roughly zero gradients for all the actions that are taken in trajectory 3. And so this means that it will encourage it to fall forwards, and it'll encourage it to not do the things that were in 1, 4, and 5, so it will discourage it from taking steps backwards or forwards, and will also discourage it from falling backwards."},{"start":1792.11,"text":"Cool. So yeah, so we encourage the policy to fall forwards and not take steps. This is distressing because we don't want our policy to fall forward. We want to take steps. And so this is a kind of example of how the gradient that we're getting is noisy, high variance. It means that depending on what these trajectories are, the gradient might vary drastically. So if you do actually have some trajectories that are walking forwards."},{"start":1818.35,"text":"you might actually get a very different gradient estimate from this set of trajectories. And so that's kind of the definition of having noise or having high variance. Yeah, so the question is why are we getting multiple trajectories from the same policy? Like why not just get one?"},{"start":1832.91,"text":"There's two reasons for this. One is that the policy is not deterministic. And so if we want to explore different strategies, we will get kind of different samples of different strategies because it's not deterministic. And the second reason is also the environment might be stochastic. And so even if you have a deterministic policy, you might see different outcomes. And this will help you learn about those different outcomes. There's one thing that we can do about this that we can already kind of directly improve the gradient in a fairly simple way."}],"speech_gaps":[],"frame":"../frames/v030/011.webp","frame_time":1708.08},{"title":"策略梯度中的轨迹依赖性与梯度更新","segments":[{"id":103,"text":"And in particular, one observation that we might make is that if you're in the middle of a trajectory and you take an action, that action has no influence on previous states. And right now, the gradient is using the rewards at all states in the trajectory to update, in the gradient update, and it's even telling us to take actions later in the trajectory if your reward earlier in the trajectory was good or bad.","start":1861.29,"end":1889.62},{"id":104,"text":"One of the things that we can do is if one of our trajectories was to take a large step backwards and then a small step forwards, and we should actually be able to learn from this trajectory that taking a small step forward is good. And the way that we can do that is instead of having this be a sum from t equals 1 to t, what we can instead do is we can actually have this summation start at t.","start":1892.26,"end":1922.24},{"id":105,"text":"And so we can have this essentially be, let's use a different letter. So we'll have T prime that is starting at T and going to capital T. And now this is a reward of ST prime AT prime. And by having it only look at future rewards, this means that we're now kind of incorporating the fact that","start":1923.27,"end":1953.2},{"id":106,"text":"Current actions can only affect the future and not affect the past. Oh, yes, sorry. One other thing that you have to do here. Yes, good point, is to actually move this summation inside this summation here. Yeah, why can we do this? So the reason is that we know that our action at, let's say, our action at time equals 100. So let's say, like,","start":1954.54,"end":1981.26},{"id":107,"text":"if t equals 100. So we're looking at like a 100. We know that this 100 is only going to influence rewards in the future and this isn't going to have any impact on states in the past. So like this is going to be completely independent of like s50. So this doesn't affect like","start":1983.21,"end":2008.91},{"id":108,"text":"S50 or S51 or S99. And this means that because of that independence, we can then drop the rewards. We can kind of drop that from the equation. When looking at increasing the likelihood of an action at time t, only use the future rewards in that influence.","start":2009.74,"end":2038.14}],"notes":["本段讨论了策略梯度方法中轨迹依赖性的关键点，即当前动作仅影响未来状态，而不影响过去状态。因此，在梯度更新中，可以仅考虑未来奖励，而不必考虑过去奖励。这有助于简化计算并提高学习效率。","讲者提到，如果轨迹中包含大步后退和小步前进，那么应能从轨迹中学习到小步前进是好的。这表明，梯度更新应从某个时间点开始，而不是从轨迹的起点开始，从而更关注未来奖励。","讲者使用了T'作为新的时间变量，从T开始到大写T，表示只关注未来奖励。这表明，梯度更新可以仅考虑未来奖励，而不必考虑所有状态的奖励，从而减少计算复杂度。","讲者强调，当前动作仅影响未来奖励，而不影响过去状态。因此，可以将奖励从方程中移除，仅使用未来奖励来更新动作的概率。这表明，梯度更新可以更高效地进行，因为不需要考虑过去状态的影响。","讲者提到，动作在时间t=100时仅影响未来奖励，而不影响时间t=50、t=51或t=99的状态。这表明，动作与状态之间存在独立性，因此可以将奖励从方程中移除。"],"formulas":[],"uncertainties":["S50 or S51 or S99"],"diagram":"none","start":1861.29,"end":2038.14,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1861.29,"text":"And in particular, one observation that we might make is that if you're in the middle of a trajectory and you take an action, that action has no influence on previous states. And right now, the gradient is using the rewards at all states in the trajectory to update, in the gradient update, and it's even telling us to take actions later in the trajectory if your reward earlier in the trajectory was good or bad."},{"start":1892.26,"text":"One of the things that we can do is if one of our trajectories was to take a large step backwards and then a small step forwards, and we should actually be able to learn from this trajectory that taking a small step forward is good. And the way that we can do that is instead of having this be a sum from t equals 1 to t, what we can instead do is we can actually have this summation start at t."},{"start":1923.27,"text":"And so we can have this essentially be, let's use a different letter. So we'll have T prime that is starting at T and going to capital T. And now this is a reward of ST prime AT prime. And by having it only look at future rewards, this means that we're now kind of incorporating the fact that"},{"start":1954.54,"text":"Current actions can only affect the future and not affect the past. Oh, yes, sorry. One other thing that you have to do here. Yes, good point, is to actually move this summation inside this summation here. Yeah, why can we do this? So the reason is that we know that our action at, let's say, our action at time equals 100. So let's say, like,"},{"start":1983.21,"text":"if t equals 100. So we're looking at like a 100. We know that this 100 is only going to influence rewards in the future and this isn't going to have any impact on states in the past. So like this is going to be completely independent of like s50. So this doesn't affect like"},{"start":2009.74,"text":"S50 or S51 or S99. And this means that because of that independence, we can then drop the rewards. We can kind of drop that from the equation. When looking at increasing the likelihood of an action at time t, only use the future rewards in that influence."}],"speech_gaps":[],"frame":"../frames/v030/012.webp","frame_time":1873.29},{"title":"策略梯度中的因果关系与奖励累积","segments":[{"id":109,"text":"It's a little bit hard to write out mathematically why you can do that. I can maybe think about whether there's a nice mathematical expression for that. But it's really just about causality in the world. And so basically, policy behavior at time t is not going to influence rewards at earlier time steps. Cool. I think that this equation, OK, I don't have the typo in this equation. So yeah, we're bringing this summation inside the other one.","start":2039.34,"end":2068.51},{"id":110,"text":"and is only going to be a factor of the future time steps. And this means that for this example right here, we will be kind of decreasing the likelihood of actions at the beginning of the trajectory, and then the future summations will become positive because you took a step forward, and then you'll actually start to be increasing the likelihood of taking a small step forward.","start":2069.95,"end":2094.43},{"id":111,"text":"Yeah, so a very good point is it still doesn't help you if you take a step forward and then you take a step backwards. And the reason why that's actually a little bit difficult to handle is that it's possible that the step forwards actually cause you to fall backwards or cause you to take a step backwards. You don't really know. A big part of reinforcement learning is thinking about what...","start":2095.57,"end":2118.77},{"id":112,"text":"influence those actions have on the future. And you need to learn that from experience. And you need to... If you take a step forward, it means it could, from the algorithm's point of view, actually have caused something bad to happen in the future. And so we can't drop those rewards. So the question was, if you say that you had a lot of really bad stuff at the beginning and then you took a good action later on in the destructory, would you have enough time to accumulate that?","start":2119.35,"end":2148.43},{"id":113,"text":"Now, so in your particular example, you started getting kind of capital T was equal to 10. And you started seeing, you did something really good at time step 6. Now, at time step 6, what this will look like is you'll have grad log A6 given S6. And then you'll have a summation from T prime equals 6 to 10 of R.","start":2148.78,"end":2177.45},{"id":114,"text":"And so if you did get a high reward from that action immediately or in the next four time steps, then you would actually increase the likelihood on that action. Now, it's really going to depend a lot on the reward function.","start":2179.65,"end":2192.47},{"id":115,"text":"So you're saying that for fixed horizon problems, the gradient will be different if you're summing over 10 rewards versus over 4 rewards. So one of the things that's important if you have a fixed time horizon T is for this to be a proper state, and actually to be truly Markovian, you need it to contain information about...","start":2193.36,"end":2218.82}],"notes":["本段讨论了策略梯度方法中因果关系的重要性，即当前策略行为不会影响过去时间步的奖励。这表明在策略梯度中，奖励的计算依赖于未来时间步的累积，而非过去。这种因果关系是策略梯度方法设计的基础。","在具体例子中，当在时间步6采取了一个好的动作，该动作的奖励会通过梯度更新影响该动作的概率。这说明策略梯度方法通过梯度上升来调整策略，使得高奖励的动作更有可能被重复选择。","然而，如果在时间步6采取了一个好的动作，但随后又采取了一个坏的动作，这可能导致整体奖励的下降。因此，策略梯度方法需要考虑动作对未来奖励的长期影响，而不仅仅是即时奖励。","在固定时间范围的问题中，梯度的计算依赖于奖励的总和。例如，如果时间范围是10个时间步，那么梯度的计算会包括这10个时间步的奖励，而如果时间范围是4个时间步，则梯度的计算仅包括这4个时间步的奖励。","为了确保策略梯度方法的有效性，状态必须包含足够的信息以支持马尔可夫性质。这意味着状态需要包含所有必要的信息，以便在给定当前状态时，能够预测未来的奖励。","因此，策略梯度方法需要在设计时考虑时间范围和奖励函数的特性，以确保梯度的计算能够准确反映策略的优化方向。"],"formulas":[],"uncertainties":["capital T was equal to 10"],"diagram":"none","start":2039.34,"end":2218.82,"asr_flags":[],"math_clarifications":["公式中缺少明确的数学运算符，如期望符号或乘法符号，导致表达不完整。此外，未明确说明是期望值还是具体形式，因此无法核定其数学正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2039.34,"text":"It's a little bit hard to write out mathematically why you can do that. I can maybe think about whether there's a nice mathematical expression for that. But it's really just about causality in the world. And so basically, policy behavior at
