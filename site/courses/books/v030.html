time t is not going to influence rewards at earlier time steps. Cool. I think that this equation, OK, I don't have the typo in this equation. So yeah, we're bringing this summation inside the other one."},{"start":2069.95,"text":"and is only going to be a factor of the future time steps. And this means that for this example right here, we will be kind of decreasing the likelihood of actions at the beginning of the trajectory, and then the future summations will become positive because you took a step forward, and then you'll actually start to be increasing the likelihood of taking a small step forward."},{"start":2095.57,"text":"Yeah, so a very good point is it still doesn't help you if you take a step forward and then you take a step backwards. And the reason why that's actually a little bit difficult to handle is that it's possible that the step forwards actually cause you to fall backwards or cause you to take a step backwards. You don't really know. A big part of reinforcement learning is thinking about what..."},{"start":2119.35,"text":"influence those actions have on the future. And you need to learn that from experience. And you need to... If you take a step forward, it means it could, from the algorithm's point of view, actually have caused something bad to happen in the future. And so we can't drop those rewards. So the question was, if you say that you had a lot of really bad stuff at the beginning and then you took a good action later on in the destructory, would you have enough time to accumulate that?"},{"start":2148.78,"text":"Now, so in your particular example, you started getting kind of capital T was equal to 10. And you started seeing, you did something really good at time step 6. Now, at time step 6, what this will look like is you'll have grad log A6 given S6. And then you'll have a summation from T prime equals 6 to 10 of R."},{"start":2179.65,"text":"And so if you did get a high reward from that action immediately or in the next four time steps, then you would actually increase the likelihood on that action. Now, it's really going to depend a lot on the reward function."},{"start":2193.36,"text":"So you're saying that for fixed horizon problems, the gradient will be different if you're summing over 10 rewards versus over 4 rewards. So one of the things that's important if you have a fixed time horizon T is for this to be a proper state, and actually to be truly Markovian, you need it to contain information about..."}],"speech_gaps":[],"frame":"../frames/v030/013.webp","frame_time":2051.34},{"title":"策略梯度中的状态表示与奖励梯度","segments":[{"id":116,"text":"like the future dynamics. And if it's fixed at 10 and the policy doesn't know if the horizon is about to finish, then it's actually not a truly Markovian state. You need to actually give it information about how many time steps it has left to succeed, and then you can incorporate that into the state. And so you would actually have different states in those different circumstances. Okay.","start":2220.24,"end":2244.31},{"id":117,"text":"So now another example for you, and this actually comes back to the question that came up earlier, although it's actually slightly different. So say that the robot, we now have a version that is only depending on future rewards. We have the same version of the problem, but now our policy is a little bit better. One of the trajectories falls forward, one of the trajectories kind of slowly stumbles forward, one of the trajectories steadily walks forward, and one of the trajectories runs forward.","start":2245.24,"end":2272.26},{"id":118,"text":"My question for you is, what will the gradient encourage the policy to do in this case? And we can use this version, the kind of updated version. Yeah, and so I'll encourage you to pair up again and discuss this, and then we'll come back in like two minutes. Okay, let's come back. Please raise your hand if you want to share your answer.","start":2275.18,"end":2307.01},{"id":119,"text":"Okay. Yeah. So the first answer was that it's going to get highest reward for the stuff that is moving forward at higher velocity. So it's going to encourage it to do that, the highest velocity stuff the most. And you were saying that even if it makes any sort of forward progress, it'll still encourage it to do that.","start":2308.36,"end":2323.7},{"id":120,"text":"Yeah, so another hypothesis was that if we kind of go back to the previous example, it might encourage it to fall forward and then get back up again and then fall forward and get back up again, especially if it's easy to fall forward. Now, getting up again is actually a little bit more challenging, so that might also be a little tricky.","start":2324.59,"end":2339.09},{"id":121,"text":"And so the thoughts there was that the fourth one, if the reward is, it might dominate if that one has a much higher reward than the others. If it's, if they're more kind of even in terms of velocity and it's just like move forward, then it won't necessarily dominate and you'll do all four. Yeah, so all of the rewards in these cases will all be positive. And so even, so the kind of, I think what a lot of people are getting at is that the kind of reward of this last one.","start":2340.03,"end":2364.56},{"id":122,"text":"will be the highest and so it will be encouraged to do this but because all of these also like one two and three also have positive rewards the policy is actually also still going to be encouraged to do those things. So because basically the with this term is non-negative when it's positive you're still going to be increasing the likelihood on the actions in these trajectories. Now it won't do it as frequently as running forward but it will still be encouraged to do that.","start":2365.05,"end":2392.99}],"notes":["本段讨论了策略梯度方法中状态表示的重要性，指出如果状态不包含剩余时间步数的信息，那么状态就不是真正马尔可夫的。因此，需要将剩余时间步数作为状态的一部分，以确保策略能够做出正确的决策。","接着，讲者通过一个机器人运动的例子，说明策略梯度如何鼓励策略选择不同动作。机器人有四种不同的运动轨迹：快速前倾、缓慢前倾、稳定行走和快速奔跑。讲者询问学生，梯度会鼓励策略选择哪种轨迹。","学生们的回答表明，梯度会鼓励策略选择奖励最高的动作，即快速奔跑。但也有观点认为，如果前倾动作的奖励较高，策略可能会反复前倾并尝试恢复，这取决于恢复的难度。","此外，讲者指出，如果四种轨迹的奖励差异不大，那么策略可能会同时鼓励所有动作。但总体而言，奖励最高的动作会受到更多鼓励，而其他动作仍会受到一定程度的鼓励。","最后，讲者强调，梯度项是非负的，因此即使奖励较低，策略仍会增加这些动作的概率，只是频率较低。","这些讨论帮助学生理解策略梯度方法中奖励信号如何影响策略的更新，以及如何在不同奖励分布下策略的行为变化。"],"formulas":[],"uncertainties":["the with this term is non-negative"],"diagram":"none","start":2220.24,"end":2392.99,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2220.24,"text":"like the future dynamics. And if it's fixed at 10 and the policy doesn't know if the horizon is about to finish, then it's actually not a truly Markovian state. You need to actually give it information about how many time steps it has left to succeed, and then you can incorporate that into the state. And so you would actually have different states in those different circumstances. Okay."},{"start":2245.24,"text":"So now another example for you, and this actually comes back to the question that came up earlier, although it's actually slightly different. So say that the robot, we now have a version that is only depending on future rewards. We have the same version of the problem, but now our policy is a little bit better. One of the trajectories falls forward, one of the trajectories kind of slowly stumbles forward, one of the trajectories steadily walks forward, and one of the trajectories runs forward."},{"start":2275.18,"text":"My question for you is, what will the gradient encourage the policy to do in this case? And we can use this version, the kind of updated version. Yeah, and so I'll encourage you to pair up again and discuss this, and then we'll come back in like two minutes. Okay, let's come back. Please raise your hand if you want to share your answer."},{"start":2308.36,"text":"Okay. Yeah. So the first answer was that it's going to get highest reward for the stuff that is moving forward at higher velocity. So it's going to encourage it to do that, the highest velocity stuff the most. And you were saying that even if it makes any sort of forward progress, it'll still encourage it to do that."},{"start":2324.59,"text":"Yeah, so another hypothesis was that if we kind of go back to the previous example, it might encourage it to fall forward and then get back up again and then fall forward and get back up again, especially if it's easy to fall forward. Now, getting up again is actually a little bit more challenging, so that might also be a little tricky."},{"start":2340.03,"text":"And so the thoughts there was that the fourth one, if the reward is, it might dominate if that one has a much higher reward than the others. If it's, if they're more kind of even in terms of velocity and it's just like move forward, then it won't necessarily dominate and you'll do all four. Yeah, so all of the rewards in these cases will all be positive. And so even, so the kind of, I think what a lot of people are getting at is that the kind of reward of this last one."},{"start":2365.05,"text":"will be the highest and so it will be encouraged to do this but because all of these also like one two and three also have positive rewards the policy is actually also still going to be encouraged to do those things. So because basically the with this term is non-negative when it's positive you're still going to be increasing the likelihood on the actions in these trajectories. Now it won't do it as frequently as running forward but it will still be encouraged to do that."}],"speech_gaps":[],"frame":"../frames/v030/014.webp","frame_time":2232.24},{"title":"策略梯度中的梯度噪声与奖励函数缩放","segments":[{"id":123,"text":"And that might be a little bit concerning because sometimes it will actually be encouraging it to stumble forward and ideally we would actually, in this case, want a policy that can actually have the policy run as fast as possible.","start":2393.37,"end":2407.05},{"id":124,"text":"Yeah, so the question was, is this because of local minimum? It seems like with this reward function, the best outcome is to run forward. And so why are we getting this kind of objective? The reason for this is because the gradient is noisy. It kind of comes down to variance.","start":2407.97,"end":2424.53},{"id":125,"text":"And if you do have a policy that runs forward, it will encourage it to keep on running forward. But when you have other data in there, that kind of that other data will influence it in some ways. And so it won't necessarily converge to a local optimum because at this point it will encourage it to run forward more. And then the next batch of data will run forward more. They'll encourage it to run for even more. So eventually it will converge to the global optimum, but it will get there more slowly because the gradient.","start":2425.17,"end":2454.37},{"id":126,"text":"has a lot of variance depending on the samples that you select. Will this encourage the robot to roll forward? With this data, it will not encourage it to roll forward unless some weird combination of gradients causes that, but generally it will not. If you had data of rolling forward, then it would encourage it to roll forward.","start":2454.99,"end":2476.78},{"id":127,"text":"The question is, can the agent learn from a subset of trajectories instead of the whole trajectory? In this case, it will learn from all future steps in the trajectory. So that is a subset, but it might not be. And I guess in the next lecture, we'll talk about more sophisticated ways to estimate this that are smarter, basically.","start":2477.61,"end":2497.63},{"id":128,"text":"Cool. So the thing that we saw here is that things are sensitive to the scaling of the reward function. And on the flip side, if everything was negative, like came up in the question before, we would actually only be getting negative gradients to our policy and no actual positive gradients. And that's actually a big problem with this kind of approach is that it kind of depends on the scale of the reward. And there's actually a very simple thing that we can do to fix this.","start":2499.98,"end":2525.32},{"id":129,"text":"And so in particular, what we can do is when we are using this gradient of, which is kind of the expectation of p of tau of, I'll maybe do the kind of the first version just to make it a bit shorter. But we get the gradient of log p of tau times r of tau. And what we can do is instead of having this be r of tau,","start":2526.07,"end":2554.99}],"notes":["本段讨论了策略梯度方法中梯度噪声对学习过程的影响。讲者指出，梯度的方差较大，这可能导致策略收敛到全局最优解的过程变慢，但最终仍会收敛。同时，讲者提到，如果数据中存在其他信息，这些信息可能会对策略产生影响，从而改变其行为。","讲者进一步指出，梯度噪声的存在使得策略在学习过程中可能不会立即收敛到局部最优解，而是会逐步调整，最终趋向于全局最优解。然而，由于梯度的方差较大，收敛速度会受到影响。","讲者还提到，奖励函数的缩放对策略梯度方法至关重要。如果奖励函数的值全部为负，那么策略将只能获得负梯度，而无法获得正梯度，这会导致学习过程出现问题。","为了解决奖励函数缩放的问题，讲者指出可以采取一个简单的措施，即在计算梯度时对奖励函数进行归一化处理，以确保梯度的稳定性。","讲者提到，梯度的计算涉及对轨迹概率和奖励的期望值，这需要对整个轨迹进行处理。然而，如果只使用轨迹的一部分数据，可能会导致学习效果不佳。","最后，讲者提到在后续课程中会介绍更复杂的估计方法，以提高策略梯度方法的效率和稳定性。"],"formulas":[],"uncertainties":["the kind of the first version just to make it a bit shorter"],"diagram":"none","start":2393.37,"end":2554.99,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2393.37,"text":"And that might be a little bit concerning because sometimes it will actually be encouraging it to stumble forward and ideally we would actually, in this case, want a policy that can actually have the policy run as fast as possible."},{"start":2407.97,"text":"Yeah, so the question was, is this because of local minimum? It seems like with this reward function, the best outcome is to run forward. And so why are we getting this kind of objective? The reason for this is because the gradient is noisy. It kind of comes down to variance."},{"start":2425.17,"text":"And if you do have a policy that runs forward, it will encourage it to keep on running forward. But when you have other data in there, that kind of that other data will influence it in some ways. And so it won't necessarily converge to a local optimum because at this point it will encourage it to run forward more. And then the next batch of data will run forward more. They'll encourage it to run for even more. So eventually it will converge to the global optimum, but it will get there more slowly because the gradient."},{"start":2454.99,"text":"has a lot of variance depending on the samples that you select. Will this encourage the robot to roll forward? With this data, it will not encourage it to roll forward unless some weird combination of gradients causes that, but generally it will not. If you had data of rolling forward, then it would encourage it to roll forward."},{"start":2477.61,"text":"The question is, can the agent learn from a subset of trajectories instead of the whole trajectory? In this case, it will learn from all future steps in the trajectory. So that is a subset, but it might not be. And I guess in the next lecture, we'll talk about more sophisticated ways to estimate this that are smarter, basically."},{"start":2499.98,"text":"Cool. So the thing that we saw here is that things are sensitive to the scaling of the reward function. And on the flip side, if everything was negative, like came up in the question before, we would actually only be getting negative gradients to our policy and no actual positive gradients. And that's actually a big problem with this kind of approach is that it kind of depends on the scale of the reward. And there's actually a very simple thing that we can do to fix this."},{"start":2526.07,"text":"And so in particular, what we can do is when we are using this gradient of, which is kind of the expectation of p of tau of, I'll maybe do the kind of the first version just to make it a bit shorter. But we get the gradient of log p of tau times r of tau. And what we can do is instead of having this be r of tau,"}],"speech_gaps":[],"frame":"../frames/v030/015.webp","frame_time":2405.37},{"title":"策略梯度中的常数项处理","segments":[{"id":130,"text":"we can actually subtract a constant where that constant can be equal to the average reward. And if we subtract the average reward from this, this means that things that are better than average will increase the likelihood, and things that are below average will actually lead us to decrease likelihood. So this will be negative. Now, you might be wondering,","start":2555.58,"end":2590.03},{"id":131,"text":"Can we just add this b here? Did I just make that up? Why can we do that? Why are we allowed to do that? We can see what the effect that this has on the gradient. And what we can show is we can actually show that if you subtract a constant in expectation, this has zero effect on the gradient. So this is the gradient.","start":2591.12,"end":2620.98},{"id":132,"text":"of j. And if we look at what effect this has on the gradient and expectation, we can look","start":2621.82,"end":2632.22},{"id":133,"text":"at essentially the expectation of grad log p times b. And it's possible to show that","start":2632.22,"end":2649.76},{"id":134,"text":"this, in expectation, is actually equal to zero. And in particular, if we write this out as the","start":2649.76,"end":2660.44},{"id":135,"text":"gradient of, or sorry, the integral, the expectation is the integral of p of tau times","start":2660.44,"end":2668.78},{"id":136,"text":"times grad log p of tau times b d tau.","start":2668.78,"end":2676.82},{"id":137,"text":"We can then use the same trick that we used before, but in reverse.","start":2678.5,"end":2684.62},{"id":138,"text":"this is equal to the integral of grad p theta of tau times b d tau. I'm a little","start":2684.62,"end":2702.12},{"id":139,"text":"bit out of space but the gradient can be moved to the outside of the integral","start":2702.12,"end":2707.24},{"id":140,"text":"integral because this is a linear operation. We can also move b outside the integral because","start":2707.24,"end":2716.32},{"id":141,"text":"it's a constant. And so this is equal to the gradient b times the gradient of the integral","start":2716.32,"end":2733.64}],"notes":["本段讲解了在策略梯度方法中，如何处理常数项对梯度的影响。讲者指出，如果从奖励中减去平均奖励，这不会影响梯度，因为期望下常数项对梯度的贡献为零。","讲者进一步解释了期望梯度的计算过程，指出梯度可以被移出积分，因为梯度运算是线性的，而常数项可以被移出积分。","讲者提到，通过将梯度与积分中的常数项结合，可以简化梯度的计算，从而使得策略梯度方法更加高效。","讲者强调了在策略梯度中，常数项的处理是基于数学推导的，而不是随意添加的，这确保了梯度计算的正确性。","讲者还提到，这种处理方式在强化学习中是常见的，因为它允许我们对奖励进行归一化，从而提高策略优化的稳定性。","最后，讲者指出，这种处理方式在数学上是严谨的，因为它基于期望和积分的线性性质，确保了梯度计算的正确性。"],"formulas":[{"latex":"E[\\nabla \\log p(\\tau) \\cdot b] = 0","symbols":"期望梯度与常数项的乘积为零","explanation":"该公式正确表达了期望梯度与常数项的乘积为零，符合数学推导逻辑。","evidence":"this, in expectation, is actually equal to zero. And in particular, if we write this out as the"}],"uncertainties":[],"diagram":"none","start":2555.58,"end":2733.64,"asr_flags":[141],"math_clarifications":["公式1正确表达了期望梯度与常数项的乘积为零，符合数学推导逻辑。公式2存在数学错误，梯度运算不能直接移出积分，除非积分内部是关于参数的函数，且梯度是关于参数的。此处未明确参数和积分变量，因此无法确定其正确性，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2555.58,"text":"we can actually subtract a constant where that constant can be equal to the average reward. And if we subtract the average reward from this, this means that things that are better than average will increase the likelihood, and things that are below average will actually lead us to decrease likelihood. So this will be negative. Now, you might be wondering,"},{"start":2591.12,"text":"Can we just add this b here? Did I just make that up? Why can we do that? Why are we allowed to do that? We can see what the effect that this has on the gradient. And what we can show is we can actually show that if you subtract a constant in expectation, this has zero effect on the gradient. So this is the gradient."},{"start":2621.82,"text":"of j. And if we look at what effect this has on the gradient and expectation, we can look"},{"start":2632.22,"text":"at essentially the expectation of grad log p times b. And it's possible to show that"},{"start":2649.76,"text":"this, in expectation, is actually equal to zero. And in particular, if we write this out as the"},{"start":2660.44,"text":"gradient of, or sorry, the integral, the expectation is the integral of p of tau times"},{"start":2668.78,"text":"times grad log p of tau times b d tau."},{"start":2678.5,"text":"We can then use the same trick that we used before, but in reverse."},{"start":2684.62,"text":"this is equal to the integral of grad p theta of tau times b d tau. I'm a little"},{"start":2702.12,"text":"bit out of space but the gradient can be moved to the outside of the integral"},{"start":2707.24,"text":"integral because this is a linear operation. We can also move b outside the integral because"},{"start":2716.32,"text":"it's a constant. And so this is equal to the gradient b times the gradient of the integral"}],"speech_gaps":[],"frame":"../frames/v030/016.webp","frame_time":2567.58},{"title":"策略梯度中的基线（Baseline）","segments":[{"id":142,"text":"integral of p theta of tau d tau. Now this integral is just equal to 1, and the gradient","start":2733.64,"end":2744.52},{"id":143,"text":"gradient of one is zero. So this is one, this is two, and this is one.","start":2744.52,"end":2751.3},{"id":144,"text":"is 0, and b times 0 is 0. And so this means that the expectation, this is going to have 0 effect on the gradient. And so just to maybe write that out a little bit more cleanly, the expectation of the gradient of log p times b, so basically the effect that this baseline is having on this gradient, we can write that out as the integral.","start":2752.7,"end":2780.78},{"id":145,"text":"We can then use the log trick and reverse. We can move b and the gradient outside of the integral. This integral is equal to 1, the gradient of 1 is 0, and then we get 0. So this means that we can add this baseline. Yeah, so the reason why this constant term, the question was like, this constant term wouldn't be helpful if...","start":2781.85,"end":2802.96},{"id":146,"text":"we could actually truly evaluate the expectation. And yeah, that's correct. So if we had this expectation and could measure this exactly, then we wouldn't need this. The reason why this is helpful is because we have this expectation. And this basically, you can think of it as reducing, it's a way to reduce the variance of your estimate of this expectation. And it's an unbiased way to do that. So in particular, as long as the baseline is a constant,","start":2803.25,"end":2829.69},{"id":147,"text":"then it won't change the behavior of the gradient expectation. This means that it's unbiased. This is a term from statistics talking about effect on random variables. And you can show that it reduces the variance of your estimate of the gradient. So the question is, is B really a constant and seems to depend on the trajectories? We'll use the same value of B for an entire batch for all of the examples. And so we'll collect a batch of data.","start":2831.69,"end":2860.1},{"id":148,"text":"then we will compute B, and we'll use B for all of the updates on that batch of data. Yeah, so how does it reduce the variance of the gradient? You can write down... So this is kind of the expectation of the gradient. You can write down the variance analytically and show that it reduces the variance.","start":2860.68,"end":2881.54},{"id":149,"text":"I don't want to go through the math because we have some other stuff to get through, but kind of intuitively you can think about it in terms of this example of it will encourage it to do more of the good stuff, more of the above average stuff and less of the below average stuff. I can also mention that average reward is actually not the optimal baseline. You can actually...","start":2883.37,"end":2906.65}],"notes":["本段讲解了策略梯度中基线（Baseline）的作用，即通过引入一个常数项来减少梯度估计的方差，同时保持无偏性。基线的引入不会改变梯度期望的行为，因此不会影响梯度的无偏性。基线可以是常数，也可以依赖于轨迹，但通常在一批数据中使用相同的基线值。","基线的引入是通过将基线和梯度移出积分，从而使得积分结果为零，因此不会影响梯度的计算。这种做法在统计学中被称为无偏估计，因为它不会改变梯度的期望值。","基线的使用可以减少梯度估计的方差，但需要确保基线是常数或与轨迹无关。如果基线依赖于轨迹，那么它可能会影响梯度的计算，但通常在一批数据中使用相同的基线值。","平均奖励并不是最优的基线，因为基线的选择会影响梯度估计的方差。因此，选择合适的基线是策略梯度方法中的一个重要问题。","基线的引入是策略梯度方法中减少方差的一种技术，它通过调整梯度估计的计算方式，使得估计更加稳定。这种技术在强化学习中被广泛使用。","在实际应用中，基线的选择需要根据具体问题进行调整，以达到最佳的方差减少效果。同时，基线的计算需要考虑数据的分布和梯度的特性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2733.64,"end":2906.65,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2733.64,"text":"integral of p theta of tau d tau. Now this integral is just equal to 1, and the gradient"},{"start":2744.52,"text":"gradient of one is zero. So this is one, this is two, and this is one."},{"start":2752.7,"text":"is 0, and b times 0 is 0. And so this means that the expectation, this is going to have 0 effect on the gradient. And so just to maybe write that out a little bit more cleanly, the expectation of the gradient of log p times b, so basically the effect that this baseline is having on this gradient, we can write that out as the integral."},{"start":2781.85,"text":"We can then use the log trick and reverse. We can move b and the gradient outside of the integral. This integral is equal to 1, the gradient of 1 is 0, and then we get 0. So this means that we can add this baseline. Yeah, so the reason why this constant term, the question was like, this constant term wouldn't be helpful if..."},{"start":2803.25,"text":"we could actually truly evaluate the expectation. And yeah, that's correct. So if we had this expectation and could measure this exactly, then we wouldn't need this. The reason why this is helpful is because we have this expectation. And this basically, you can think of it as reducing, it's a way to reduce the variance of your estimate of this expectation. And it's an unbiased way to do that. So in particular, as long as the baseline is a constant,"},{"start":2831.69,"text":"then it won't change the behavior of the gradient expectation. This means that it's unbiased. This is a term from statistics talking about effect on random variables. And you can show that it reduces the variance of your estimate of the gradient. So the question is, is B really a constant and seems to depend on the trajectories? We'll use the same value of B for an entire batch for all of the examples. And so we'll collect a batch of data."},{"start":2860.68,"text":"then we will compute B, and we'll use B for all of the updates on that batch of data. Yeah, so how does it reduce the variance of the gradient? You can write down... So this is kind of the expectation of the gradient. You can write down the variance analytically and show that it reduces the variance."},{"start":2883.37,"text":"I don't want to go through the math because we have some other stuff to get through, but kind of intuitively you can think about it in terms of this example of it will encourage it to do more of the good stuff, more of the above average stuff and less of the below average stuff. I can also mention that average reward is actually not the optimal baseline. You can actually..."}],"speech_gaps":[],"frame":"../frames/v030/017.webp","frame_time":2745.64},{"title":"策略梯度中的基线与梯度计算","segments":[{"id":150,"text":"derive the variance, and then take the derivative of the variance set equal to zero to find the optimal baseline. But average reward is pretty good. The optimal baseline is something like, it's very close to average reward, but there's some additional weighting terms. Cool. So we have one more episode of what does the gradient do.","start":2907.55,"end":2931.13},{"id":151,"text":"And we're going to look at a different example. In this case, the robot is folding a jacket. And the reward is 1 if it's neatly folded, 0.5 if it's folded with some wrinkles, and 0 if it's not folded. We're going to again sample from our policy. We have some samples of not touching the jacket, folding only the sleeves but not folding the full thing, flattening the jacket but not folding it, and one trajectory where it does fold the jacket.","start":2932.55,"end":2959.23},{"id":152,"text":"And my question is, with the baseline in here this time, what does the gradient look like? The rewards for 1, 2, and 3 will be 0, and the reward for 4 will be positive. And so this means that because of our baseline, the gradient for 4 will be positive and will encourage this behavior, and then will discourage all the behavior for 1, 2, and 3.","start":2960.06,"end":2982.44},{"id":153,"text":"Now, in some ways, this is good because it means that we are encouraging the good behavior. But there are also some things that are a little bit dissatisfying about this. The first is that the gradient for 1, 2, and 3 is going to be identical for all of them. There isn't any differentiation between them. And some of these are actually better than others. This is kind of, in some ways, a result of the reward function that we're using, which is more sparse than it could be.","start":2982.93,"end":3010.51},{"id":154,"text":"And the other thing is that we'll actually see some techniques in Friday's lecture that would actually be able to leverage some of the good parts of these trajectories, because there is a good thing about folding the sleeves, and it would be nice to be able to use that data to encourage the policy. And right now, it will actually be discouraged and have negative gradients for this trajectory. So in some ways, this is good. So it will encourage folding, but the gradient is constant for trajectories one, two, and three.","start":3010.94,"end":3037.66},{"id":155,"text":"We will, on Friday, we'll see ways to make this a little bit better. And kind of one of the takeaways here is that policy gradient is still noisy and is still high variance. And it really is going to work best if you have dense rewards rather than rewards that are sparse. And it'll work best if you have large batches of data, because if you didn't actually sample this fourth trajectory and you only sampled failures, then you would have zero gradient and you wouldn't actually be able to improve.","start":3039.24,"end":3067.7},{"id":156,"text":"So the question was, can we just improve the reward function? Yes. So if we had a more dense reward function, that would definitely help in these cases. There are actually scenarios still where that...","start":3068.68,"end":3082.9}],"notes":["本段讨论了策略梯度方法中基线的作用，以及基线如何影响梯度的计算。在机器人折叠外套的例子中，基线被用来调整梯度，使得只有成功折叠的轨迹（第4条）会获得正梯度，而其他失败的轨迹（第1、2、3条）会获得负梯度。这表明基线有助于区分不同轨迹的贡献。","然而，梯度计算中存在一个问题，即对于第1、2、3条轨迹的梯度是相同的，这导致无法区分这些轨迹之间的差异。这可能是因为奖励函数过于稀疏，无法提供足够的信息来区分不同行为的优劣。","课堂中提到，未来的课程（周五）将介绍一些技术，这些技术可以利用轨迹中的有用信息，例如折叠袖子的行为，从而鼓励策略。当前的梯度计算方式会抑制这些有用的行为，导致负梯度。","此外，策略梯度方法存在高方差和噪声的问题，因此需要密集的奖励函数和大量的数据样本。如果只采样失败的轨迹，可能会导致梯度为零，无法进行有效的策略更新。","课堂最后提到，可以通过改进奖励函数来缓解这些问题，例如使用更密集的奖励函数，以提供更丰富的反馈信息，从而提高策略梯度方法的效果。","这些讨论强调了策略梯度方法在实际应用中的局限性，以及如何通过改进奖励函数和采样策略来优化其性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2907.55,"end":3082.9,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2907.55,"text":"derive the variance, and then take the derivative of the variance set equal to zero to find the optimal baseline. But average reward is pretty good. The optimal baseline is something like, it's very close to average reward, but there's some additional weighting terms. Cool. So we have one more episode of what does the gradient do."},{"start":2932.55,"text":"And we're going to look at a different example. In this case, the robot is folding a jacket. And the reward is 1 if it's neatly folded, 0.5 if it's folded with some wrinkles, and 0 if it's not folded. We're going to again sample from our policy. We have some samples of not touching the jacket, folding only the sleeves but not folding the full thing, flattening the jacket but not folding it, and one trajectory where it does fold the jacket."},{"start":2960.06,"text":"And my question is, with the baseline in here this time, what does the gradient look like? The rewards for 1, 2, and 3 will be 0, and the reward for 4 will be positive. And so this means that because of our baseline, the gradient for 4 will be positive and will encourage this behavior, and then will discourage all the behavior for 1, 2, and 3."},{"start":2982.93,"text":"Now, in some ways, this is good because it means that we are encouraging the good behavior. But there are also some things that are a little bit dissatisfying about this. The first is that the gradient for 1, 2, and 3 is going to be identical for all of them. There isn't any differentiation between them. And some of these are actually better than others. This is kind of, in some ways, a result of the reward function that we're using, which is more sparse than it could be."},{"start":3010.94,"text":"And the other thing is that we'll actually see some techniques in Friday's lecture that would actually be able to leverage some of the good parts of these trajectories, because there is a good thing about folding the sleeves, and it would be nice to be able to use that data to encourage the policy. And right now, it will actually be discouraged and have negative gradients for this trajectory. So in some ways, this is good. So it will encourage folding, but the gradient is constant for trajectories one, two, and three."},{"start":3039.24,"text":"We will, on Friday, we'll see ways to make this a little bit better. And kind of one of the takeaways here is that policy gradient is still noisy and is still high variance. And it really is going to work best if you have dense rewards rather than rewards that are sparse. And it'll work best if you have large batches of data, because if you didn't actually sample this fourth trajectory and you only sampled failures, then you would have zero gradient and you wouldn't actually be able to improve."},{"start":3068.68,"text":"So the question was, can we just improve the reward function? Yes. So if we had a more dense reward function, that would definitely help in these cases. There are actually scenarios still where that..."}],"speech_gaps":[],"frame":"../frames/v030/018.webp","frame_time":2919.55},{"title":"策略梯度中的基线与实现","segments":[{"id":157,"text":"we could do better. So especially if you, for example, folded the sleeves, got positive reward for this and then dropped it on the ground or something after that, then that's still dissatisfying because we wouldn't use the first part successfully. And we'll actually see how to do that, how to get good gradient for that first part on Friday. But yeah, if you had a more dense reward function for this particular set of directories, that would work a lot better.","start":3084.38,"end":3107.24},{"id":158,"text":"Oh, so the question here is, when we do the baseline, are we also using this trick to only use future rewards? You can combine them. You need to be a little bit, you need to think a little bit, potentially more carefully about what the baseline will be, because some of the rewards, you'll be summing over fewer things or more things depending on where you are in the trajectory, but you can definitely combine them.","start":3108.15,"end":3131.37},{"id":159,"text":"Yeah, so the question was, if we're using average reward as the baseline,","start":3132.19,"end":3135.17},{"id":160,"text":"Do you need to use data from the policy?","start":3135.71,"end":3137.33},{"id":161,"text":"Do you need to use data from the policy?","start":3137.45,"end":3138.87},{"id":162,"text":"So yes, you'll want to keep on updating it because as the policy gets better,","start":3139.83,"end":3143.05},{"id":163,"text":"what's above average and below average will change,","start":3143.81,"end":3146.13},{"id":164,"text":"and you'll want to recompute it on your latest batch of data.","start":3146.31,"end":3150.39},{"id":165,"text":"Cool.","start":3153.65,"end":3154.05},{"id":166,"text":"So one more thing on this version of the algorithm,","start":3155.07,"end":3157.55},{"id":167,"text":"and then we'll move on to one last version.","start":3157.61,"end":3159.77},{"id":168,"text":"In terms of how to implement it, we talked about we kind of derived a gradient like this.","start":3159.77,"end":3166.11},{"id":169,"text":"And to actually implement this in practice, you could, in principle, actually just run","start":3167.15,"end":3173.41},{"id":170,"text":"a backward pass for all of these different terms.","start":3173.41,"end":3175.43},{"id":171,"text":"But if you computed all these individually, then you'd have to do n times t backward passes,","start":3176.35,"end":3181.21},{"id":172,"text":"and this would be rather inefficient.","start":3181.41,"end":3182.91},{"id":173,"text":"efficient. And it'd be nice if we could just actually do automatic differentiation on the","start":3182.91,"end":3189.41},{"id":174,"text":"full objective and only do one forward pass and one backward pass. And we can do that.","start":3189.41,"end":3195.63},{"id":175,"text":"So it's possible to implement essentially a surrogate objective whose gradient is the","start":3195.79,"end":3200.37},{"id":176,"text":"same as this objective. I'm calling it surrogate because it's not the same as the very first","start":3200.37,"end":3206.29},{"id":177,"text":"objective of maximizing expected rewards. But you can write down a surrogate objective","start":3206.29,"end":3211.67},{"id":178,"text":"for this particular example, this is what the surrogate objective looks like. Note that I","start":3211.67,"end":3216.23},{"id":179,"text":"actually do have a typo on these equations where this second sum should be inside the first sum.","start":3216.23,"end":3222.47},{"id":180,"text":"That's maybe a small note. I'll see if I can fix that. But yeah, you can implement a surrogate","start":3222.63,"end":3228.07},{"id":181,"text":"So it's possible to implement essentially a surrogate objective whose gradient is the","start":3228.07,"end":3233.95}],"notes":["本段讨论了在策略梯度方法中使用基线时，是否仅使用未来奖励的问题。讲者指出，基线可以结合不同时间点的奖励，但需要仔细考虑基线的定义，因为不同轨迹位置的奖励数量可能不同。同时，讲者提到，如果使用平均奖励作为基线，需要持续更新基线，因为随着策略的改进，高于或低于平均的奖励会变化，因此需要在最新的数据批次上重新计算基线。","讲者进一步说明，当实现策略梯度算法时，虽然理论上可以对每个项进行反向传播，但这样会非常低效。因此，更高效的方法是使用自动微分技术，对整个目标函数进行一次前向和反向传播。这种方法可以实现一个代理目标函数，其梯度与原始目标函数相同，但不等同于最初的期望奖励最大化目标。","讲者提到，代理目标函数的实现需要特别注意公式中的错误，例如第二个求和项应位于第一个求和项内部。这一错误可能影响公式的正确性，因此需要修正。此外，讲者强调，使用代理目标函数可以简化实现过程，只需进行一次反向传播即可。","在实现策略梯度时，讲者指出，虽然可以对每个项进行反向传播，但这样会非常低效。因此，更高效的方法是使用自动微分技术，对整个目标函数进行一次前向和反向传播。这种方法可以实现一个代理目标函数，其梯度与原始目标函数相同，但不等同于最初的期望奖励最大化目标。","讲者提到，代理目标函数的实现需要特别注意公式中的错误，例如第二个求和项应位于第一个求和项内部。这一错误可能影响公式的正确性，因此需要修正。此外，讲者强调，使用代理目标函数可以简化实现过程，只需进行一次反向传播即可。","讲者最后指出，虽然代理目标函数的公式中存在一个拼写错误，但可以通过修正来确保其正确性。这一错误可能影响公式的正确性，因此需要修正。此外，讲者强调，使用代理目标函数可以简化实现过程，只需进行一次反向传播即可。"],"formulas":[],"uncertainties":["the second sum should be inside the first sum"],"diagram":"none","start":3084.38,"end":3233.95,"asr_flags":[],"math_clarifications":["原文未提及该公式，无法核定其数学恒等关系，因此移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3084.38,"text":"we could do better. So especially if you, for example, folded the sleeves, got positive reward for this and then dropped it on the ground or something after that, then that's still dissatisfying because we wouldn't use the first part successfully. And we'll actually see how to do that, how to get good gradient for that first part on Friday. But yeah, if you had a more dense reward function for this particular set of directories, that would work a lot better."},{"start":3108.15,"text":"Oh, so the question here is, when we do the baseline, are we also using this trick to only use future rewards? You can combine them. You need to be a little bit, you need to think a little bit, potentially more carefully about what the baseline will be, because some of the rewards, you'll be summing over fewer things or more things depending on where you are in the trajectory, but you can definitely combine them."},{"start":3132.19,"text":"Yeah, so the question was, if we're using average reward as the baseline,"},{"start":3135.71,"text":"do we need to keep updating the term?"},{"start":3137.45,"text":"Do you need to use data from the policy?"},{"start":3139.83,"text":"So yes, you'll want to keep on updating it because as the policy gets better,"},{"start":3143.81,"text":"what's above average and below average will change,"},{"start":3146.31,"text":"and you'll want to recompute it on your latest batch of data."},{"start":3153.65,"text":"Cool."},{"start":3155.07,"text":"So one more thing on this version of the algorithm,"},{"start":3157.61,"text":"and then we'll move on to one last version."},{"start":3159.77,"text":"In terms of how to implement it, we talked about we kind of derived a gradient like this."},{"start":3167.15,"text":"And to actually implement this in practice, you could, in principle, actually just run"},{"start":3173.41,"text":"a backward pass for all of these different terms."},{"start":3176.35,"text":"But if you computed all these individually, then you'd have to do n times t backward passes,"},{"start":3181.41,"text":"and this would be rather inefficient."},{"start":3182.91,"text":"efficient. And it'd be nice if we could just actually do automatic differentiation on the"},{"start":3189.41,"text":"full objective and only do one forward pass and one backward pass. And we can do that."},{"start":3195.79,"text":"So it's possible to implement essentially a surrogate objective whose gradient is the"},{"start":3200.37,"text":"same as this objective. I'm calling it surrogate because it's not the same as the very first"},{"start":3206.29,"text":"objective of maximizing expected rewards. But you can write down a surrogate objective"},{"start":3211.67,"text":"for this particular example, this is what the surrogate objective looks like. Note that I"},{"start":3216.23,"text":"actually do have a typo on these equations where this second sum should be inside the first sum."},{"start":3222.63,"text":"That's maybe a small note. I'll see if I can fix that. But yeah, you can implement a surrogate"},{"start":3228.07,"text":"objective and then use backprop and autodiff software to just do one backward pass."}],"speech_gaps":[],"frame":"../frames/v030/019.webp","frame_time":3096.38},{"title":"策略梯度方法的挑战与改进","segments":[{"id":182,"text":"Okay, and what this actually looks like in practice is this would actually look like a cross-entropy loss for a discrete action policy or something like squared error for a Gaussian policy. You could also use more sophisticated policies like diffusion or something like that as well. Okay, so summary so far. We showed how to estimate the gradient of the RL objective using this log gradient trick. This corresponds to weighing the policy likelihood by future rewards.","start":3236.88,"end":3265.67},{"id":183,"text":"And we found that subtracting a baseline like average reward will also further improve the gradient. Even with these two things, the gradient is still noisy. And so it's best with large batches and dense rewards. This is also our first online reinforcement learning algorithm where we iterate between collecting a batch of data with our policy and improve our policy. And it kind of formalizes this trial and error learning process.","start":3266.38,"end":3293.4},{"id":184,"text":"And we change theta in step three. And this means that every single time we take a single gradient step, we need to recollect data to estimate our gradient. And this is kind of sad because usually we do like thousands and thousands of gradient steps on neural networks. And so, yeah, that seems like a problem.","start":3294.7,"end":3324.37},{"id":185,"text":"And what this is called is it's called on-policy. It means that the gradient that we are measuring requires data using our exact policy. And we can think about this as an attribute of an online URL algorithm, where on-policy only uses data from the current policy, and off-policy means that you can reuse data from other past policies.","start":3325.71,"end":3351.14},{"id":186,"text":"So can we derive an off policy version of the policy gradient? And it's only going to be a little off policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data. And to do this, we can use important sampling. And important sampling is actually a really cool technique that's useful outside of reinforcement learning as well. And it's kind of thinking about this.","start":3352.58,"end":3374.9},{"id":187,"text":"So can we derive an off policy version of the policy gradient? And it's only going to be a little off policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data. And to do this, we can use important sampling. And important sampling is actually a really cool technique that's useful outside of reinforcement learning as well. And it's kind of thinking about this.","start":3377.85,"end":3403.28}],"notes":["本段讨论了策略梯度方法的一个关键问题，即在线策略（on-policy）的局限性。在线策略要求每次梯度更新都需要重新收集数据，这在神经网络训练中通常需要大量梯度步骤，因此效率较低。"],"formulas":[],"uncertainties":["URL algorithm"],"diagram":"none","start":3236.88,"end":3403.28,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3236.88,"text":"Okay, and what this actually looks like in practice is this would actually look like a cross-entropy loss for a discrete action policy or something like squared error for a Gaussian policy. You could also use more sophisticated policies like diffusion or something like that as well. Okay, so summary so far. We showed how to estimate the gradient of the RL objective using this log gradient trick. This corresponds to weighing the policy likelihood by future rewards."},{"start":3266.38,"text":"And we found that subtracting a baseline like average reward will also further improve the gradient. Even with these two things, the gradient is still noisy. And so it's best with large batches and dense rewards. This is also our first online reinforcement learning algorithm where we iterate between collecting a batch of data with our policy and improve our policy. And it kind of formalizes this trial and error learning process."},{"start":3294.7,"text":"And the intuition for everything we've done so far is do more of the high-reward stuff and less of the low-reward stuff. Now the last thing we'll talk about today is what else is troublesome about policy gradients. And one thing that we haven't really talked about that much is the details of the sampling process. And this is what our gradient and our algorithm looks like. And note that in this gradient, this assumes that we're sampling from pi theta."},{"start":3325.71,"text":"And we change theta in step three. And this means that every single time we take a single gradient step, we need to recollect data to estimate our gradient. And this is kind of sad because usually we do like thousands and thousands of gradient steps on neural networks. And so, yeah, that seems like a problem."},{"start":3352.58,"text":"And what this is called is it's called on-policy. It means that the gradient that we are measuring requires data using our exact policy. And we can think about this as an attribute of an online URL algorithm, where on-policy only uses data from the current policy, and off-policy means that you can reuse data from other past policies."},{"start":3377.85,"text":"So can we derive an off policy version of the policy gradient? And it's only going to be a little off policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data. And to do this, we can use important sampling. And important sampling is actually a really cool technique that's useful outside of reinforcement learning as well. And it's kind of thinking about this."}],"speech_gaps":[],"frame":"../frames/v030/020.webp","frame_time":3248.88},{"title":"利用重要性采样估计期望","segments":[{"id":188,"text":"this scenario where you want to estimate a quantity, an expectation, without actually sampling from that distribution. So say you have some expectation using samples from p and you want to estimate some function f using those samples. But say that you only have access to the ability to sample from q . So this is usually called your","start":3404.54,"end":3434.08},{"id":189,"text":"proposal distribution that's able to kind of propose samples to use. This is like your old policy. We have samples from our old policy, but we want to be able to estimate a function of samples of our new policy after we've taken a gradient step. So what you can do in this case, if you write down this expectation as an integral, it looks something like this. And","start":3434.52,"end":3460.96},{"id":190,"text":"As long as Q of X has reasonable support, we can write this as, we can kind of add in this term that equals one into our equation. And then we can now actually write this as an expectation with respect to Q. So this is equal to an expectation with respect to Q of","start":3462.28,"end":3494.61},{"id":191,"text":"p of x divided by q of x times f of x. And so this means that we can actually estimate, we can get this expectation by sampling from q and then weighting the quantity by p over q. So that's pretty cool. This means that we can use principal samples from our old policy, q,","start":3496.78,"end":3525.88},{"id":192,"text":"weight them by the probability of the sample under our new policy divided by the probability under the old policy times the quantity. So we showed this for kind of this simple case of P and Q . In terms of actually applying this to our policy, we can take our expected rewards with regard to P . If we instead have some previous policy that we've collected samples from, we can then","start":3526.76,"end":3557.05}],"notes":["本段讲解了重要性采样的基本思想，即在无法直接从目标分布p中采样时，利用一个可以采样的提议分布q来估计期望值。通过引入重要性权重p(x)/q(x)，可以将期望值转换为对q的期望，从而利用已有的q样本进行估计。","讲者提到，当q的支撑集合理时，可以将期望值写成对q的期望形式，即E_q[p(x)/q(x) * f(x)]。这表明，可以通过从q中采样并乘以重要性权重来估计目标期望。","重要性采样方法的关键在于权重的计算，即目标分布p(x)与提议分布q(x)的比值。这允许我们使用旧策略q的样本，通过加权的方式估计新策略p的期望值。","讲者还提到，这种方法可以应用于策略梯度方法中，即利用旧策略的样本估计新策略的期望奖励。这为策略梯度方法中的重要性采样提供了理论基础。","在实际应用中，重要性采样需要确保提议分布q的支撑集合理，否则可能会导致权重过大或估计不稳定。因此，在选择q时需要谨慎。","重要性采样是一种有效的估计方法，但其效果依赖于提议分布q与目标分布p的相似性。如果q与p差异较大，权重可能会变得非常大，导致估计不准确。"],"formulas":[{"latex":"E_p[f(x)] = E_q\\left[ \\frac{p(x)}{q(x)} f(x) \\right]","symbols":"期望值估计公式","explanation":"公式正确，使用了重要性采样方法，将原分布p的期望估计为提议分布q的期望，通过加权因子p(x)/q(x)。","evidence":"p of x divided by q of x times f of x. And so this means that we can actually estimate, we can get this expectation by sampling from q and then weighting the quantity by p over q. So that's pretty cool. This means that we can use principal samples from our old policy, q,"}],"uncertainties":["p of x divided by q of x"],"diagram":"none","start":3404.54,"end":3557.05,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3404.54,"text":"this scenario where you want to estimate a quantity, an expectation, without actually sampling from that distribution. So say you have some expectation using samples from p and you want to estimate some function f using those samples. But say that you only have access to the ability to sample from q . So this is usually called your"},{"start":3434.52,"text":"proposal distribution that's able to kind of propose samples to use. This is like your old policy. We have samples from our old policy, but we want to be able to estimate a function of samples of our new policy after we've taken a gradient step. So what you can do in this case, if you write down this expectation as an integral, it looks something like this. And"},{"start":3462.28,"text":"As long as Q of X has reasonable support, we can write this as, we can kind of add in this term that equals one into our equation. And then we can now actually write this as an expectation with respect to Q. So this is equal to an expectation with respect to Q of"},{"start":3496.78,"text":"p of x divided by q of x times f of x. And so this means that we can actually estimate, we can get this expectation by sampling from q and then weighting the quantity by p over q. So that's pretty cool. This means that we can use principal samples from our old policy, q,"},{"start":3526.76,"text":"weight them by the probability of the sample under our new policy divided by the probability under the old policy times the quantity. So we showed this for kind of this simple case of P and Q . In terms of actually applying this to our policy, we can take our expected rewards with regard to P . If we instead have some previous policy that we've collected samples from, we can then"}],"speech_gaps":[],"frame":"../frames/v030/021.webp","frame_time":3416.54},{"title":"策略梯度中的重要性抽样与轨迹处理","segments":[{"id":193,"text":"measure our objective in terms of the samples from that policy, where we weight the reward by the new policy divided by the old policy probability. Now, note that this requires your proposal distribution to have non-zero support in scenarios where your new policy has probability. This is actually very important for it to work. If Qx is zero, this is not poorly defined.","start":3557.58,"end":3586.18},{"id":194,"text":"But that's really the only catch here. In general, this important sampling technique is really going to work best when P and Q or when your old policy and your new policy are very similar to each other. Now, there's some details. We've shown this in terms of P of tau. Now, how do we actually do this in terms of pi of A given S? That actually gets a little bit trickier. We can write down P of tau and this ratio.","start":3587.3,"end":3614.26},{"id":195,"text":"as the product of these different probabilities. Unfortunately, some of the probabilities cancel out. But when we then try to put these probabilities into our update, we're going to get something like this, where we then have this product of these ratios, these probability ratios. And now, unfortunately, this product can actually become very small or very large.","start":3615.75,"end":3645.8},{"id":196,"text":"if the length of your trajectory is very large. Because you're going to be multiplying many, many numbers together. If you have 100 numbers that you're multiplying together, if they're above one, that might start to get very large. If they're below one, that might get to zero very quickly. And so in practice, we often will consider the expectations over time steps instead of trajectories. And that also has a little bit of a hitch, which is that this needs to be over state-action pairs.","start":3646.86,"end":3674.79},{"id":197,"text":"rather than actions given states. But often in practice, we can approximate this ratio as equal to one. This is incorrect, but it's kind of the best that we can do. And then we can get some final form where we get this ratio of new policy over old policy. Cool. The full algorithm looks the same, except now we can take multiple gradient steps on the same batch.","start":3676.34,"end":3704.43},{"id":198,"text":"This is good. And then we have this new form for our gradient.","start":3704.99,"end":3710.25}],"notes":["本段讲解了策略梯度方法中重要性抽样的核心思想，即通过新旧策略概率比值来加权奖励，以估计目标函数。这要求提议分布（proposal distribution）在新策略有概率的场景中具有非零支持，否则会导致计算不准确。"],"formulas":[],"uncertainties":["Qx is zero"],"diagram":"none","start":3557.58,"end":3710.25,"asr_flags":[],"math_clarifications":["原始公式未正确反映重要性抽样技术中的期望值计算，应基于轨迹的加权奖励总和，而不是时间步的平均。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3557.58,"text":"measure our objective in terms of the samples from that policy, where we weight the reward by the new policy divided by the old policy probability. Now, note that this requires your proposal distribution to have non-zero support in scenarios where your new policy has probability. This is actually very important for it to work. If Qx is zero, this is not poorly defined."},{"start":3587.3,"text":"But that's really the only catch here. In general, this important sampling technique is really going to work best when P and Q or when your old policy and your new policy are very similar to each other. Now, there's some details. We've shown this in terms of P of tau. Now, how do we actually do this in terms of pi of A given S? That actually gets a little bit trickier. We can write down P of tau and this ratio."},{"start":3615.75,"text":"as the product of these different probabilities. Unfortunately, some of the probabilities cancel out. But when we then try to put these probabilities into our update, we're going to get something like this, where we then have this product of these ratios, these probability ratios. And now, unfortunately, this product can actually become very small or very large."},{"start":3646.86,"text":"if the length of your trajectory is very large. Because you're going to be multiplying many, many numbers together. If you have 100 numbers that you're multiplying together, if they're above one, that might start to get very large. If they're below one, that might get to zero very quickly. And so in practice, we often will consider the expectations over time steps instead of trajectories. And that also has a little bit of a hitch, which is that this needs to be over state-action pairs."},{"start":3676.34,"text":"rather than actions given states. But often in practice, we can approximate this ratio as equal to one. This is incorrect, but it's kind of the best that we can do. And then we can get some final form where we get this ratio of new policy over old policy. Cool. The full algorithm looks the same, except now we can take multiple gradient steps on the same batch."},{"start":3704.99,"text":"This is good. And then we have this new form for our gradient."}],"speech_gaps":[],"frame":"../frames/v030/022.webp","frame_time":3569.58},{"title":"策略梯度方法的回顾与后续内容","segments":[{"id":199,"text":"Okay, we'll talk a little bit about some tricks. We don't have time to cover KL constraints today, but to review things, we talked about online RL, the on-policy algorithm, we talked about baselines for reducing variance, and we also just derived this off-policy policy gradient, which uses importance sampling and allows us to apply multiple gradient steps. The intuition is to do more high-reward stuff and less low-reward stuff, and the gradient is still very noisy and best with large batches.","start":3714.11,"end":3741.57},{"id":200,"text":"and dense rewards. Cool. And that's it for today. Next time, we'll talk about actor critic methods, which will build closely on what we talked about today, including PPO.","start":3741.89,"end":3751.55}],"notes":["本段回顾了策略梯度方法中的一些关键概念，包括在线强化学习、基于策略的算法、方差减少的基线方法，以及推导出的离策略策略梯度方法。离策略策略梯度使用重要性采样，允许应用多个梯度步骤。其核心思想是增加高奖励行为，减少低奖励行为，但梯度仍然具有高噪声，因此需要使用大批次数据来优化。","讲者提到接下来的课程将讨论Actor-Critic方法，这些方法将建立在今天讨论的内容之上，包括PPO（Proximal Policy Optimization）算法。这表明课程内容将逐步深入，从策略梯度方法过渡到更复杂的Actor-Critic框架，以提高策略优化的稳定性和效率。","在讲者提到的离策略策略梯度方法中，重要性采样是关键的技术，它允许在使用不同策略生成的数据上进行梯度估计。这种方法虽然有效，但会引入高方差，因此需要通过基线或其他技术来减少方差。","讲者强调了梯度噪声的问题，并指出使用大批次数据可以缓解这一问题。这表明在实际应用中，策略梯度方法需要在计算资源和梯度稳定性之间进行权衡。","讲者提到的PPO算法是Actor-Critic方法的一个重要实例，它通过引入近端策略优化来稳定训练过程，避免策略更新过大导致的性能下降。这表明课程内容将涵盖更高级的策略优化技术。","本段内容为后续课程的Actor-Critic方法奠定了基础，强调了策略梯度方法在强化学习中的重要性，并指出其局限性，如高方差和噪声问题，为后续更复杂的优化方法做铺垫。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3714.11,"end":3751.55,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3714.11,"text":"Okay, we'll talk a little bit about some tricks. We don't have time to cover KL constraints today, but to review things, we talked about online RL, the on-policy algorithm, we talked about baselines for reducing variance, and we also just derived this off-policy policy gradient, which uses important sampling and allows us to apply multiple gradient steps. The intuition is to do more high-reward stuff and less low-reward stuff, and the gradient is still very noisy and best with large batches."},{"start":3741.89,"text":"and dense rewards. Cool. And that's it for today. Next time, we'll talk about actor critic methods, which will build closely on what we talked about today, including PPO."}],"speech_gaps":[],"frame":"../frames/v030/023.webp","frame_time":3726.11}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
