</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 3 策略梯度（Policy Gradients） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v030.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v030","title":"Lecture 3 策略梯度（Policy Gradients）","course":"强化学习","pages":[{"title":"策略梯度（Policy Gradients）","segments":[{"id":0,"text":"Okay, let's get started.","zh":"好的，我们开始吧。","start":5.42,"end":7.04},{"id":1,"text":"As a recap of some of the stuff that we've talked about so far, we formulated this reinforcement learning problem where we have states and actions. We have some kind of trajectories that we might be collecting, which are sequences of states and actions. We have a reward function, which tells us how good is a particular state and action. And also a policy, which is usually what we're trying to learn. And this is representing the behavior that we're trying to learn.","zh":"作为我们之前讨论内容的一个回顾，我们提出了一个强化学习问题，其中包含状态和动作。我们可能会收集一些轨迹，这些轨迹是状态和动作的序列。我们还有一个奖励函数，它告诉我们某个特定状态和动作的好坏。此外，我们还有一个策略，这通常是我们要学习的内容，它代表了我们想要学习的行为。","start":7.82,"end":36.66},{"id":2,"text":"And then the goal of reinforcement learning, which we talked about in the first lecture, is to try to maximize the expected sum of rewards. So we want to produce behavior that leads to positive outcomes. And we can actually mathematically write this down as an expectation over the probability distribution over trajectories.","zh":"强化学习的目标，我们在第一讲中讨论过，是尝试最大化奖励的期望总和。因此，我们希望产生导致积极结果的行为。我们实际上可以将这一目标数学地表示为对轨迹的概率分布上的期望。","start":37.55,"end":61.21},{"id":3,"text":"where this probability distribution is a function of the policy, which is acting in the world, the environment dynamics, which might be stochastic, and of course, the reward function. Last week on Friday, we started talking about one way to do this, which is if you have expert demonstrations, you can try to imitate the expert by trying to maximize the...","zh":"其中，这个概率分布是策略的函数，策略在世界中起作用，环境动态可能具有随机性，当然还有奖励函数。上周五，我们开始讨论一种实现方法，即如果你有专家演示，你可以通过尝试最大化演示者执行的动作的似然性来模仿专家。因此，实际上产生一个策略，使得其动作与专家采取的动作一致。这是一种非常简单且可扩展的方法，但它无法超越演示者，并且不允许通过试错进行改进。","start":61.8,"end":86.94},{"id":4,"text":"likelihood of the actions that the demonstrator did. So trying to actually produce a policy that leads to actions that the expert would have taken. This is a very simple and scalable approach, but it cannot outperform the demonstrator and doesn't allow improvement through trial and error.","zh":"我们还介绍了离线算法的概念，这种算法仅使用现有数据集，而不使用从学习策略中获得的新数据，以及在线算法，这种算法使用从学习策略中获得的新数据。今天我们将讨论如何利用强化学习超越演示者、通过实践进行改进，并且具体地，我们将开始讨论在线强化学习算法。","start":87.67,"end":104.71},{"id":5,"text":"We also introduced the notion of an offline algorithm that only uses an existing data set and no new data from a learned policy, and an online algorithm that uses new data from the learned policy. And today we'll be talking about ways in which we can use reinforcement learning to outperform the demonstrator, to improve from practice, and specifically we'll be starting to talk about online reinforcement learning algorithms.","zh":"我们还介绍了离线算法的概念，这种算法仅使用现有的数据集，而不使用从学习策略中获得的新数据，以及在线算法，这种算法使用从学习策略中获得的新数据。今天我们将讨论如何利用强化学习来超越示范者（demonstrator），从实践中进行改进，并且我们将开始讨论在线强化学习算法。","start":106.32,"end":130.59},{"id":6,"text":"Particularly, our first online RL algorithm will be policy gradients. We'll talk about a couple different variants of policy gradients and introduce both kind of the mathematical derivation for it as well as some of the intuition behind it. And policy gradients are the basis for some popular reinforcement learning algorithms, including ones that are used to train legged robots, use algorithms that are used to train language models, and are also kind of part of the default project.","zh":"特别是，我们的第一个在线强化学习算法将是策略梯度。我们将讨论几种不同的策略梯度变体，并介绍其数学推导以及背后的一些直觉。策略梯度是某些流行强化学习算法的基础，包括用于训练腿部机器人、语言模型的算法，以及也是默认项目的一部分。","start":132.87,"end":160.63}],"notes":["本段介绍了强化学习的基本框架，包括状态、动作、轨迹、奖励函数和策略的概念。强化学习的目标是最大化预期奖励总和，这可以通过对轨迹的概率分布进行期望计算来表达。","课程提到专家演示（expert demonstrations）方法，即通过最大化专家行为的似然来模仿专家，这种方法虽然简单且可扩展，但无法超越专家表现，也不允许通过试错进行改进。","课程区分了离线算法和在线算法。离线算法仅使用现有数据集，而在线算法则利用由学习策略生成的新数据。今天将讨论如何通过在线强化学习算法超越专家表现，实现从实践中改进。","策略梯度是在线强化学习算法的基础，课程将介绍其不同变体，并讨论其数学推导和直觉。策略梯度被用于训练腿部机器人、语言模型等复杂系统，是强化学习中的重要方法。","课程提到策略梯度是默认项目的一部分，暗示其在实际应用中的广泛使用，但未具体说明其在项目中的具体角色。","课程强调策略梯度方法的在线特性，即通过不断与环境交互来更新策略，从而实现性能提升，这与专家演示方法形成对比。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.42,"end":160.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.42,"text":"Okay, let's get started."},{"start":7.82,"text":"As a recap of some of the stuff that we've talked about so far, we formulated this reinforcement learning problem where we have states and actions. We have some kind of trajectories that we might be collecting, which are sequences of states and actions. We have a reward function, which tells us how good is a particular state and action. And also a policy, which is usually what we're trying to learn. And this is representing the behavior that we're trying to learn."},{"start":37.55,"text":"And then the goal of reinforcement learning, which we talked about in the first lecture, is to try to maximize the expected sum of rewards. So we want to produce behavior that leads to positive outcomes. And we can actually mathematically write this down as an expectation over the probability distribution over trajectories."},{"start":61.8,"text":"where this probability distribution is a function of the policy, which is acting in the world, the environment dynamics, which might be stochastic, and of course, the reward function. Last week on Friday, we started talking about one way to do this, which is if you have expert demonstrations, you can try to imitate the expert by trying to maximize the..."},{"start":87.67,"text":"likelihood of the actions that the demonstrator did. So trying to actually produce a policy that leads to actions that the expert would have taken. This is a very simple and scalable approach, but it cannot outperform the demonstrator and doesn't allow improvement through trial and error."},{"start":106.32,"text":"We also introduced the notion of an offline algorithm that only uses an existing data set and no new data from a learned policy, and an online algorithm that uses new data from the learned policy. And today we'll be talking about ways in which we can use reinforcement learning to outperform the demonstrator, to improve from practice, and specifically we'll be starting to talk about online reinforcement learning algorithms."},{"start":132.87,"text":"Particularly, our first online RL algorithm will be policy gradients. We'll talk about a couple different variants of policy gradients and introduce both kind of the mathematical derivation for it as well as some of the intuition behind it. And policy gradients are the basis for some popular reinforcement learning algorithms, including ones that are used to train legged robots, use algorithms that are used to train language models, and are also kind of part of the default project."}],"speech_gaps":[],"frame":"../frames/v030/001.webp","frame_time":17.42},{"title":"策略梯度（Policy Gradients）概述","segments":[{"id":7,"text":"We won't get to kind of the complete algorithm that was used to train these today, but we'll get like most of or like halfway there, basically. And by Friday, we'll have most of the algorithm for it. Yeah. And then the key goals will be to try to get the intuition behind policy gradients, how to implement them and when to use them.","zh":"我们今天不会详细讲解用于训练这些策略的完整算法，但我们会讲解大部分或至少一半的内容。到了周五，我们会拥有该算法的大部分内容。是的。然后关键目标是尝试理解策略梯度的基本原理，如何实现它们以及何时使用它们。","start":161.24,"end":191.94},{"id":8,"text":"initialize our policy in some way. When you train a neural network, you need to initialize its weights. We could initialize the weights of our policy randomly. We could also initialize it with imitation learning. We could also use heuristics. It depends on the problem setting. And after we've initialized our policy, we'll run our policy to collect some data. So actually try out different things in the world. Then we'll use that batch of data to improve the policy.","zh":"以某种方式初始化我们的策略。当你训练一个神经网络时，你需要初始化其权重。我们可以随机初始化策略的权重。我们也可以使用模仿学习进行初始化。我们也可以使用启发式方法。这取决于问题的设定。在我们初始化策略之后，我们会运行策略以收集一些数据。因此，实际上尝试在世界中执行不同的操作。然后我们会使用这一批数据来改进策略。","start":192.75,"end":221.03},{"id":9,"text":"And then we will repeat that process. We'll then collect new data with our updated policy and update our policy again using that latest batch of data. So we're going to attempt the task and try to get better. So what this might look like is the first iteration. We kind of attempt whatever, some kind of simple 2D navigation task. The reward for some of them is bad. The reward for other trajectories is like okay. And then after more iterations of this,","zh":"然后我们会重复这个过程。我们会使用更新后的策略收集新的数据，并使用最新的一批数据再次更新策略。因此，我们会尝试执行任务并努力变得更好。这可能看起来像第一次迭代。我们大致尝试一些事情，比如某种简单的二维导航任务。其中一些轨迹的奖励较差，而其他轨迹的奖励则还行。在更多这样的迭代之后，","start":222.44,"end":250.22},{"id":10,"text":"we might have a policy that's a bit better that is able to get higher reward, but isn't perfect. So sometimes it gets higher reward, sometimes it still gets lower reward. Then we'll use that to improve the policy again. And after more iterations, hopefully we'll get a policy that is able to succeed. So this is kind of this notion of online reinforcement learning, where we're collecting data online and improving using that data. So we talked about this reinforcement learning objective, and...","zh":"我们可能会得到一个稍好一些的策略，该策略能够获得更高的奖励，但还不是完美的。有时它会获得更高的奖励，有时仍然获得较低的奖励。然后我们会使用这些数据再次改进策略。经过更多的迭代后，我们希望得到一个能够成功的策略。因此，这就是在线强化学习的概念，我们在在线环境中收集数据并利用这些数据进行改进。我们之前讨论了强化学习的目标，以及……","start":250.75,"end":281.79},{"id":11,"text":"So you have some policy and you want to actually understand how good that policy is. To do that, we can't just actually look at the weights of the neural network. We actually have to run the policy to understand how good it is. And so what we'll do is to estimate this expectation, which is a function of the policy, we can actually just run the policy multiple times, observe the resulting reward, and...","zh":"你有一个策略，你想要真正理解该策略有多好。要做到这一点，我们不能仅仅查看神经网络的权重。我们实际上必须运行该策略以了解其表现。因此，我们将估计这个期望值，它是一个与策略相关的函数。我们实际上可以多次运行该策略，观察得到的奖励，并……","start":282.32,"end":309.02},{"id":12,"text":"then compute the average over the observed reward. And that's an estimate of how good our policy is. So we can then sum over the samples from our policy. Now, let's start to think about how we actually... So we have this trial and error process. We collect some data and we improve our policy. Collecting the data is straightforward. We've talked about how to run a policy to get a rollout.","zh":"然后计算观察到的奖励的平均值。这便是我们策略好坏的一个估计。因此，我们可以对从策略中采样的样本进行求和。现在，让我们开始思考我们实际上是如何进行的……因此，我们有一个试错的过程。我们收集一些数据，然后改进我们的策略。数据收集是直接的。我们已经讨论过如何运行策略以获得一个轨迹。","start":309.74,"end":336.56}],"notes":["本段介绍了强化学习中策略梯度方法的基本思想，即通过在线学习的方式不断收集数据并改进策略。课程提到，策略梯度的目标是理解策略的性能，通过运行策略并计算平均奖励来估计其效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":161.24,"end":336.56,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":161.24,"text":"We won't get to kind of the complete algorithm that was used to train these today, but we'll get like most of or like halfway there, basically. And by Friday, we'll have most of the algorithm for it. Yeah. And then the key goals will be to try to get the intuition behind policy gradients, how to implement them and when to use them. OK, so the outline of an online reinforcement learning algorithm is going to look something like this. So first we need to."},{"start":192.75,"text":"initialize our policy in some way. When you train a neural network, you need to initialize its weights. We could initialize the weights of our policy randomly. We could also initialize it with imitation learning. We could also use heuristics. It depends on the problem setting. And after we've initialized our policy, we'll run our policy to collect some data. So actually try out different things in the world. Then we'll use that batch of data to improve the policy."},{"start":222.44,"text":"And then we will repeat that process. We'll then collect new data with our updated policy and update our policy again using that latest batch of data. So we're going to attempt the task and try to get better. So what this might look like is the first iteration. We kind of attempt whatever, some kind of simple 2D navigation task. The reward for some of them is bad. The reward for other trajectories is like okay. And then after more iterations of this,"},{"start":250.75,"text":"we might have a policy that's a bit better that is able to get higher reward, but isn't perfect. So sometimes it gets higher reward, sometimes it still gets lower reward. Then we'll use that to improve the policy again. And after more iterations, hopefully we'll get a policy that is able to succeed. So this is kind of this notion of online reinforcement learning, where we're collecting data online and improving using that data. So we talked about this reinforcement learning objective, and..."},{"start":282.32,"text":"So you have some policy and you want to actually understand how good that policy is. To do that, we can't just actually look at the weights of the neural network. We actually have to run the policy to understand how good it is. And so what we'll do is to estimate this expectation, which is a function of the policy, we can actually just run the policy multiple times, observe the resulting reward, and..."},{"start":309.74,"text":"then compute the average over the observed reward. And that's an estimate of how good our policy is. So we can then sum over the samples from our policy. Now, let's start to think about how we actually... So we have this trial and error process. We collect some data and we improve our policy. Collecting the data is straightforward. We've talked about how to run a policy to get a rollout."}],"speech_gaps":[],"frame":"../frames/v030/002.webp","frame_time":173.24},{"title":"策略梯度方法的基本概念","segments":[{"id":13,"text":"in the environment. We can kind of sample an action, observe the next state, then run that through our policy again to get a new action and repeat that process. But how do we actually then improve our policy after we've collected that data? So we have our objective, and this can be written down as we have some policy pi theta, and our goal is to maximize the expected rewards when we sample from that policy.","zh":"在环境中。我们可以采样一个动作，观察下一个状态，然后将该状态再次输入我们的策略以获得新的动作，并重复这个过程。但如何在收集了这些数据之后实际改进我们的策略呢？因此我们有一个目标，可以将其写为：我们有一个策略 pi theta，我们的目标是当从该策略中采样时最大化预期奖励。","start":336.9,"end":365.79},{"id":14,"text":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory.","zh":"我们可以将从策略中采样的轨迹视为由某个分布所生成，我将其记为 p theta of tau。theta 是因为轨迹上的分布是所用策略的函数。我们的目标是最大化奖励的总和。在这里我将使用简写，我将使用简写来表示轨迹的奖励。","start":366.72,"end":395.36},{"id":15,"text":"where this just means the sum of the rewards along that trajectory. So our goal is to maximize the rewards. We're going to maximize this with respect to our policy parameters theta. Now, how do we actually optimize this? So if we want to use gradient descent, because we typically train neural networks with gradient descent, we need to figure out the gradient of this objective with regard to theta.","zh":"其中，这仅仅表示该轨迹上的奖励总和。因此我们的目标是最大化奖励。我们将相对于策略参数 theta 来最大化这个目标。现在，我们如何实际优化这个目标呢？如果我们想使用梯度下降，因为我们通常用梯度下降来训练神经网络，我们需要确定这个目标相对于 theta 的梯度。","start":396.37,"end":424.59},{"id":16,"text":"And we'll refer to this term right here as j theta to be able to write it. This is the objective that we're trying to maximize. And it's a little bit challenging to try to get a gradient of this thing directly because the relationship that this has on theta is through the trajectories that we sampled.","zh":"我们将此处的这个项称为 j theta，以便能够写出它。这是我们试图最大化的目标。直接获取这个目标的梯度有点具有挑战性，因为该目标对 theta 的依赖是通过我们采样的轨迹实现的。","start":426.92,"end":451.32},{"id":17,"text":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral.","zh":"因此我们不能直接对这个采样过程进行求导。而这个采样过程还依赖于世界的动态，而我们也不了解这些动态。因此，如果我们想要尝试获取 j theta 的梯度，将这个期望写成积分是有帮助的。因此这个期望可以写成积分。","start":451.85,"end":485.26},{"id":18,"text":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of","zh":"p theta of tau 乘以 r of tau d tau。这仅仅是从期望的定义而来。现在，因为积分是求和，而这是一个线性操作，我们可以将梯度带入积分中。因此，具体来说，这看起来是积分的","start":485.95,"end":516.1}],"notes":["本段讲解了策略梯度方法的基本思想，即通过采样轨迹来最大化期望奖励。讲者提到，策略梯度的目标是最大化奖励总和，而这一目标函数是关于策略参数θ的函数，因此需要计算其梯度。","讲者指出，直接对目标函数求梯度存在困难，因为目标函数的值依赖于采样轨迹，而轨迹的生成过程又依赖于环境的动态特性，这些特性通常是未知的。","为了处理这一问题，讲者建议将期望值写成积分形式，这样可以利用积分的线性性质，将梯度运算引入积分内部，从而得到梯度表达式。","讲者提到，积分形式的期望值可以表示为对轨迹τ的概率分布pθ(τ)和奖励r(τ)的乘积进行积分，这一步是基于期望的定义。","最后，讲者指出，由于积分是求和的线性操作，因此可以将梯度运算引入积分内部，从而得到梯度表达式，这是策略梯度方法的关键步骤之一。","讲者强调，这一过程需要处理采样过程和环境动态的不确定性，因此需要通过数学推导来找到梯度表达式，以便进行梯度下降优化。"],"formulas":[{"latex":"J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi_\\theta} [R(\\tau)]","symbols":"J(θ) 表示目标函数，即期望奖励；τ 表示轨迹；πθ 表示策略；R(τ) 表示轨迹的奖励总和。","explanation":"公式正确，表示目标函数为轨迹的期望奖励。","evidence":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory."},{"latex":"\\mathbb{E}_{\\tau \\sim \\pi_\\theta} [R(\\tau)] = \\int p_\\theta(\\tau) R(\\tau) d\\tau","symbols":"期望值可以表示为积分形式，其中 pθ(τ) 是轨迹的概率分布，R(τ) 是轨迹的奖励总和。","explanation":"公式正确，表示期望值可以写成积分形式。","evidence":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral."},{"latex":"\\nabla_\\theta J(\\theta) = \\int \\nabla_\\theta [p_\\theta(\\tau) R(\\tau)] d\\tau","symbols":"梯度可以通过将梯度运算引入积分内部来计算，从而得到目标函数的梯度表达式。","explanation":"公式正确，表示梯度可以通过将梯度运算引入积分内部来计算。","evidence":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of"}],"uncertainties":[],"diagram":"none","start":336.9,"end":516.1,"asr_flags":[],"math_clarifications":["所有公式均符合数学规范，没有明显的转写或整理错误。"],"boards":[{"title":"策略梯度的目标函数定义","summary":"策略梯度方法的目标是最大化策略πθ的期望奖励。通过采样轨迹τ，计算其奖励总和R(τ)，并将其作为目标函数J(θ)。该函数表示在策略πθ下，所有可能轨迹的期望奖励。","relation":"推导顺序","conditions":"策略πθ已定义，环境动态未知","pitfall":"目标函数的计算依赖于轨迹采样，需注意环境动态的不确定性","note_indices":[0,1,2,3,4,5],"formula_indices":[0,1,2],"source_ids":[13,14,15,16,17,18],"steps":["定义策略πθ，表示动作选择的概率分布。","通过策略πθ采样轨迹τ，记录状态和动作序列。","将目标函数J(θ)定义为轨迹的期望奖励。","将期望值转换为积分形式，便于数学处理和梯度计算。","利用积分的线性性质，将梯度运算引入积分内部。","最终得到目标函数的梯度表达式，用于梯度下降优化。"],"nodes":[{"title":"策略定义","text":"策略πθ表示动作选择的概率分布，决定环境交互过程。"},{"title":"轨迹采样","text":"通过策略πθ采样轨迹τ，记录状态和动作序列。"},{"title":"奖励计算","text":"计算轨迹τ的奖励总和R(τ)，作为目标函数的一部分。"},{"title":"期望值转换","text":"将期望值转换为积分形式，便于数学处理和梯度计算。"},{"title":"梯度计算","text":"将梯度运算引入积分内部，得到目标函数的梯度表达式。"}],"id":"v030-003-1","start":336.9,"end":516.1,"formulas":[{"latex":"J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi_\\theta} [R(\\tau)]","symbols":"J(θ) 表示目标函数，即期望奖励；τ 表示轨迹；πθ 表示策略；R(τ) 表示轨迹的奖励总和。","evidence":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory.","explanation":"公式正确，表示目标函数为轨迹的期望奖励。"},{"latex":"\\mathbb{E}_{\\tau \\sim \\pi_\\theta} [R(\\tau)] = \\int p_\\theta(\\tau) R(\\tau) d\\tau","symbols":"期望值可以表示为积分形式，其中 pθ(τ) 是轨迹的概率分布，R(τ) 是轨迹的奖励总和。","evidence":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral.","explanation":"公式正确，表示期望值可以写成积分形式。"},{"latex":"\\nabla_\\theta J(\\theta) = \\int \\nabla_\\theta [p_\\theta(\\tau) R(\\tau)] d\\tau","symbols":"梯度可以通过将梯度运算引入积分内部来计算，从而得到目标函数的梯度表达式。","evidence":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of","explanation":"公式正确，表示梯度可以通过将梯度运算引入积分内部来计算。"}],"formula_candidates_removed":0,"frame":"../board-frames/v030/003-1.webp","frame_time":379.22}],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":336.9,"text":"in the environment. We can kind of sample an action, observe the next state, then run that through our policy again to get a new action and repeat that process. But how do we actually then improve our policy after we've collected that data? So we have our objective, and this can be written down as we have some policy pi theta, and our goal is to maximize the expected rewards when we sample from that policy."},{"start":366.72,"text":"We can consider the trajectories that are sampled from the policy as being drawn by some distribution that I'll write as p theta of tau. Theta because the distribution over trajectories is a function of the policy that you're using. And our goal is to maximize the sum of rewards. I'm going to use shorthand here. I'm going to use shorthand for r of the trajectory."},{"start":396.37,"text":"where this just means the sum of the rewards along that trajectory. So our goal is to maximize the rewards. We're going to maximize this with respect to our policy parameters theta. Now, how do we actually optimize this? So if we want to use gradient descent, because we typically train neural networks with gradient descent, we need to figure out the gradient of this objective with regard to theta."},{"start":426.92,"text":"And we'll refer to this term right here as j theta to be able to write it. This is the objective that we're trying to maximize. And it's a little bit challenging to try to get a gradient of this thing directly because the relationship that this has on theta is through the trajectories that we sampled."},{"start":451.85,"text":"So we can't just differentiate through this sampling process. And that sampling process also depends on the dynamics of the world, which we also don't know. So if we're going to think about trying to get a gradient of j theta, it's helpful to write down this expectation as an integral. So this expectation can be written as an integral."},{"start":485.95,"text":"of p theta of tau times r of tau d tau. So this is just from the definition of an expectation. Now because an integral is a summation and that's kind of a linear operation, we can bring the gradient inside the integral. And so in particular what that looks like is the integral of"}],"speech_gaps":[],"frame":"../frames/v030/003.webp","frame_time":348.9},{"title":"策略梯度中的梯度计算与技巧","segments":[{"id":19,"text":"the gradient of p theta of tau, r of tau. Now this doesn't really help us directly in any way because we don't want to have to evaluate this integral in order to take a gradient. And at this point there is kind of a trick, a convenient trick that we can use to try to put this into a form that's more useful. And in particular the trick is that","zh":"pθ(τ)的梯度，r(τ)。现在这并不能直接帮助我们，因为我们不想为了计算梯度而必须评估这个积分。此时，有一种方便的技巧，可以尝试将这个表达式转换为更有用的形式。特别是，这个技巧是：","start":518.52,"end":550.63},{"id":20,"text":"and we'll write it over here, is that if you think about p theta of tau times the gradient of p theta of tau, actually, sorry, times the gradient of the log, does anyone remember what the gradient of a log is, or the derivative of log?","zh":"我们将在这里写下，即如果你考虑pθ(τ)乘以pθ(τ)的梯度，实际上，抱歉，是乘以log的梯度，有人记得log的梯度或导数是什么吗？","start":551.38,"end":585.6},{"id":21,"text":"1 over, right? So then what this is equal to is this is equal to p theta of tau times 1 over p theta of tau. And then we need to use the chain rule to apply the gradient to this. And so with the chain rule, we'll get the gradient of p theta of tau. And these two will then cancel out. And this is equal to the gradient","zh":"1除以，对吧？因此，这等于pθ(τ)乘以1除以pθ(τ)。然后我们需要使用链式法则来应用梯度。因此，使用链式法则，我们将得到pθ(τ)的梯度。这两个项将相互抵消。因此，这等于pθ(τ)的梯度。","start":587.79,"end":618.39},{"id":22,"text":"of p theta of tau. And the reason why this is a convenient equality between gradient of p theta and this is we can actually then replace the gradient of p theta down here with this first thing right here. If we replace this gradient of p theta of tau right here, if we replace this, we now get an integral of p theta of tau times grad","zh":"之所以这个梯度pθ和这个表达式之间的等式是方便的，是因为我们可以将这里的pθ的梯度替换为这个第一项。如果我们替换这里的pθ的梯度，我们现在得到一个积分，即pθ(τ)乘以grad log pθ(τ)乘以r(τ) pτ。","start":619.59,"end":649.84},{"id":23,"text":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times","zh":"这很有用，因为我们可以将这个表达式表示为期望值，即这里的第一个项。因此，这等于从pθ(τ)中采样的τ的期望值，乘以grad log pθ(τ)乘以","start":653.06,"end":685.51}],"notes":["本段讲解了策略梯度方法中梯度计算的关键技巧，即利用对数梯度的性质来简化积分表达式。讲者首先指出，直接计算梯度积分并不方便，因此引入了一个技巧，即利用对数梯度的性质，将原式转换为更易处理的形式。","讲者通过提问引导学生回忆对数的导数，即梯度的性质，指出梯度的对数等于1/p(theta)。接着，通过链式法则将梯度应用到整个表达式中，使得p(theta)和1/p(theta)相互抵消，从而简化了计算。","讲者进一步说明，这种等价关系使得可以将梯度替换为对数梯度，从而将原积分表达式转换为期望形式。这一步是策略梯度方法中的关键，因为它允许我们通过采样来估计梯度，而不需要显式计算积分。","最后，讲者提到，这种转换后的表达式可以表示为对tau的期望，其中包含梯度对数概率和奖励的乘积。这为后续的策略梯度算法提供了理论基础，即通过采样来估计梯度并更新策略参数。"],"formulas":[{"latex":"\\mathbb{E}_{\\tau \\sim p_\\theta(\\tau)}[\\nabla \\log p_\\theta(\\tau) \\cdot R(\\tau)]","symbols":"期望形式的梯度计算，包含对数梯度和奖励的乘积","explanation":"该公式在原始文本中被明确提及，且数学表达正确，因此保留。","evidence":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times"}],"uncertainties":["log p theta of tau times r of tau p tau"],"diagram":"none","start":518.52,"end":685.51,"asr_flags":[],"math_clarifications":["原始文本中并未明确提及公式0和公式1，因此无法确定其是否应保留。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[{"title":"策略梯度中的梯度计算技巧","summary":"本知识点讲解了策略梯度方法中如何通过利用对数梯度的性质，将原本难以计算的积分形式转换为期望形式，从而简化梯度计算。讲者通过链式法则和对数导数的性质，使得计算过程更加高效。","relation":"推导顺序","conditions":"适用于策略梯度方法中需要计算梯度的情况","pitfall":"需注意对数梯度与原概率梯度之间的关系，避免混淆","note_indices":[0,1,2,3],"formula_indices":[0],"source_ids":[19,20,21,22,23],"steps":["识别梯度计算中的积分形式难以直接处理","利用对数梯度的性质，将原式转换为更易处理的形式","应用链式法则，简化计算过程","将结果转换为期望形式，便于采样估计"],"nodes":[{"title":"原始梯度表达式","text":"直接计算梯度积分形式，但难以处理"},{"title":"对数梯度性质","text":"利用对数梯度与原概率梯度的关系，简化计算"},{"title":"链式法则应用","text":"通过链式法则，使概率项与倒数项相互抵消"},{"title":"期望形式转换","text":"将积分形式转换为对tau的期望，便于采样估计"}],"id":"v030-004-1","start":518.52,"end":685.51,"formulas":[{"latex":"\\mathbb{E}_{\\tau \\sim p_\\theta(\\tau)}[\\nabla \\log p_\\theta(\\tau) \\cdot R(\\tau)]","symbols":"期望形式的梯度计算，包含对数梯度和奖励的乘积","evidence":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times","explanation":"该公式在原始文本中被明确提及，且数学表达正确，因此保留。"},{"latex":"\\nabla \\log p_\\theta(\\tau) = \\frac{\\nabla p_\\theta(\\tau)}{p_\\theta(\\tau)}","symbols":"对数梯度的定义","explanation":"通过链式法则推导出对数梯度与原概率梯度的关系","evidence_ids":[20,21],"evidence":"and we'll write it over here, is that if you think about p theta of tau times the gradient of p theta of tau, actually, sorry, times the gradient of the log, does anyone remember what the gradient of a log is, or the derivative of log? 1 over, right? So then what this is equal to is this is equal to p theta of tau times 1 over p theta of tau. And then we need to use the chain rule to apply the gradient to this. And so with the chain rule, we'll get the gradient of p theta of tau. And these two will then cancel out. And this is equal to the gradient"}],"formula_candidates_removed":0,"frame":"../board-frames/v030/004-1.webp","frame_time":665.56}],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":518.52,"text":"the gradient of p theta of tau, r of tau. Now this doesn't really help us directly in any way because we don't want to have to evaluate this integral in order to take a gradient. And at this point there is kind of a trick, a convenient trick that we can use to try to put this into a form that's more useful. And in particular the trick is that"},{"start":551.38,"text":"and we'll write it over here, is that if you think about p theta of tau times the gradient of p theta of tau, actually, sorry, times the gradient of the log, does anyone remember what the gradient of a log is, or the derivative of log?"},{"start":587.79,"text":"1 over, right? So then what this is equal to is this is equal to p theta of tau times 1 over p theta of tau. And then we need to use the chain rule to apply the gradient to this. And so with the chain rule, we'll get the gradient of p theta of tau. And these two will then cancel out. And this is equal to the gradient"},{"start":619.59,"text":"of p theta of tau. And the reason why this is a convenient equality between gradient of p theta and this is we can actually then replace the gradient of p theta down here with this first thing right here. If we replace this gradient of p theta of tau right here, if we replace this, we now get an integral of p theta of tau times grad"},{"start":653.06,"text":"log p theta of tau times r of tau p tau. Now this is something that's useful because we can now represent this as an expectation, this first term right here. And so this is equal to an expectation of tau sampled from p theta of tau of grad log p theta of tau times"}],"speech_gaps":[],"frame":"../frames/v030/004.webp","frame_time":530.52},{"title":"策略梯度方法中的期望梯度估计","segments":[{"id":24,"text":"r of tau. So what we did there is we used this log trick to then get the p theta out here and then get an expectation. And we're starting to get to something that's actually more like what we can evaluate. And in particular, this expectation is something that we can estimate with samples. And now theta is actually appearing on the inside here. And that means that this kind of","zh":"r of tau。所以我们在那里的做法是使用这个对数技巧，从而将 p theta 提取出来，然后得到一个期望值。我们开始接近可以评估的内容。特别是，这个期望值可以通过样本进行估计。现在 theta 实际上出现在期望值内部。这意味着这种类型的","start":686.57,"end":714.31},{"id":25,"text":"This is actually getting closer to something that we can evaluate. We still have this term right here, which doesn't look like pi of a given f. So we need to kind of work on this term. But we're starting to get towards something that we can evaluate.","zh":"这实际上正在接近我们可以评估的内容。我们仍然有这个项，它看起来不像给定 f 的 pi。因此我们需要对这个项进行一些处理。但我们已经开始接近可以评估的内容。","start":714.78,"end":727.82},{"id":26,"text":"Yeah, so the question is how is this more useful than the first term because we still have the sampling and the issue with the first case was that we can't differentiate through the sampling. Now the thing that's different here is that theta actually appears inside the expectation. Now we're not going to be able to differentiate through the sampling still, but the thing that's useful here is that we will actually be able to differentiate with respect to theta.","zh":"是的，问题是为什么这比第一项更有用，因为我们仍然有采样，而且在第一种情况下，我们无法通过采样进行微分。现在不同的地方是 theta 实际上出现在期望值内部。我们仍然无法通过采样进行微分，但这里有用的是我们可以对 theta 进行微分。","start":728.86,"end":755.24},{"id":27,"text":"We're still not going to differentiate in this part, but we'll be able to get an estimate that's still useful. And we could potentially draw many, many samples and then measure this quantity to get actually a pretty accurate representation of the gradient. In a way that actually depends on theta. Okay, let's talk a little bit about this term right here. So, and actually maybe in case it's useful in terms of where we're at right so far, we can show that on the slides as well.","zh":"我们仍然不会在这个部分进行微分，但我们可以得到一个仍然有用的估计值。我们甚至可以潜在地  and then with a product over t then when we take the log of this as is over there the log of"}],"speech_gaps":[],"frame":"../frames/v030/005.webp","frame_time":698.57},{"title":"策略梯度（Policy Gradients）","segments":[{"id":30,"text":"p theta of tau is equal to the log of p of s1 plus the sum over t of the log of pi plus the log of the dynamics. And then once we actually take the gradient of log p tau, then","zh":"p_θ(τ)等于log p(s₁)加上对t求和的log π加上log动力学。然后一旦我们实际上对log p(τ)取梯度，那么","start":853.36,"end":888.84},{"id":31,"text":"the gradient of this with respect to theta, theta doesn't affect the initial state distribution.","zh":"这个关于θ的梯度，θ不会影响初始状态分布。","start":889.74,"end":894.34},{"id":32,"text":"It also doesn't affect the dynamics in any way. And so the gradient of log p theta of tau","zh":"它也不会以任何方式影响动力学。因此，log p_θ(τ)的梯度","start":894.6,"end":904.64},{"id":33,"text":"is equal to just the gradient of this term right here. So the gradient of","zh":"等于这里这个项的梯度。因此，","start":904.64,"end":913.26},{"id":34,"text":"of log pi theta of A given S. And so this is really useful","zh":"log π_θ(a|s)的梯度。因此，这非常有用","start":913.26,"end":925.28},{"id":35,"text":"because this means that we could actually plug in this over","zh":"因为这意味着我们可以实际上将这个带入","start":925.28,"end":930.68},{"id":36,"text":"there.","zh":"这里。","start":930.68,"end":930.98},{"id":37,"text":"And this is actually something that we can evaluate.","zh":"而这实际上是我们可以评估的东西。","start":931.16,"end":932.98},{"id":38,"text":"We can evaluate the gradient of log pi.","zh":"我们可以计算 log π 的梯度。","start":933.18,"end":938.94},{"id":39,"text":"And this is just taking a backward path through the log of the output of our neural network.","zh":"这仅仅是通过神经网络输出的对数的反向路径。","start":938.94,"end":946.74},{"id":40,"text":"And so then we actually get a gradient that we can evaluate.","zh":"因此，我们实际上得到了一个可以计算的梯度。","start":949.88,"end":954.28},{"id":41,"text":"So the gradient that we get when we plug things in, the gradient of J theta, when we plug this in,","zh":"当我们代入这些内容时，得到的梯度 J_θ 的梯度，","start":954.28,"end":973.26},{"id":42,"text":"is we have an expectation over trajectory sampled from our policy. And inside that","zh":"是我们在从策略中采样的轨迹上取期望。并且在这个期望中，","start":973.4,"end":983.94},{"id":43,"text":"expectation we will have we can bring the gradient inside that summation and so we'll have a sum over","zh":"我们可以将梯度带入求和符号内，因此我们将得到一个时间步的求和。","start":983.94,"end":990.7},{"id":44,"text":"time steps of grad log pi of a t given s t right here and then we still have our r of t right here","zh":"这里我们有 grad log π 在时间步 t 给定状态 s_t，这里我们仍然有奖励 r_t。","start":990.7,"end":1004.26},{"id":45,"text":"so we can write that as r of tau we could also write it as a summation of r","zh":"因此我们可以将其写成 r_τ，也可以写成奖励的求和。","start":1005.06,"end":1011.72},{"id":46,"text":"So this is what's called the policy gradient, or the vanilla policy gradient, and this is","zh":"这就是所谓的策略梯度，或者说是原始的策略梯度，这就是","start":1018.22,"end":1026.06},{"id":47,"text":"a lot nicer than the version up there.","zh":"比上面那个版本要好得多。","start":1026.06,"end":1028.16}],"notes":["本段讲解了策略梯度方法中对轨迹概率的分解，指出策略梯度的计算仅依赖于策略部分，而初始状态分布和动态模型对梯度没有影响。这简化了梯度的计算，因为只需要关注策略部分的梯度。"],"formulas":[{"latex":"\\nabla_\\theta J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi} \\left[ \\sum_t \\nabla_\\theta \\log \\pi(a_t | s_t) r_t \\right]","symbols":"策略梯度的期望形式，通过奖励和策略梯度的乘积求和","explanation":"公式正确表达了策略梯度的期望形式，符合策略梯度定理，因此保留。","evidence":"So the gradient that we get when we plug things in, the gradient of J theta, when we plug this in, is we have an expectation over trajectory sampled from our policy. And inside that expectation we will have we can bring the gradient inside that summation and so we'll have a sum over time steps of grad log pi of a t given s t right here and then we still have our r of t right here so we can write that as r of tau we could also write it as a summation of r"}],"uncertainties":["log of p of s1"],"diagram":"none","start":853.36,"end":1028.16,"asr_flags":[41],"math_clarifications":["原始片段中提到的'log dynamics'和'log p(s_1)'的对数形式可能不准确，因为轨迹概率应为各部分的乘积而非对数之和。此外，梯度仅作用于策略部分的表述需要更明确的数学说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":853.36,"text":"p theta of tau is equal to the log of p of s1 plus the sum over t of the log of pi plus the log of the dynamics. And then once we actually take the gradient of log p tau, then"},{"start":889.74,"text":"the gradient of this with respect to theta, theta doesn't affect the initial state distribution."},{"start":894.6,"text":"It also doesn't affect the dynamics in any way. And so the gradient of log p theta of tau"},{"start":904.64,"text":"is equal to just the gradient of this term right here. So the gradient of"},{"start":913.26,"text":"of log pi theta of A given S. And so this is really useful"},{"start":925.28,"text":"because this means that we could actually plug in this over"},{"start":930.68,"text":"there."},{"start":931.16,"text":"And this is actually something that we can evaluate."},{"start":933.18,"text":"We can evaluate the gradient of log pi."},{"start":938.94,"text":"And this is just taking a backward path through the log of the output of our neural network."},{"start":949.88,"text":"And so then we actually get a gradient that we can evaluate."},{"start":954.28,"text":"So the gradient that we get when we plug things in, the gradient of J theta, when we plug this in,"},{"start":973.4,"text":"is we have an expectation over trajectory sampled from our policy. And inside that"},{"start":983.94,"text":"expectation we will have we can bring the gradient inside that summation and so we'll have a sum over"},{"start":990.7,"text":"time steps of grad log pi of a t given s t right here and then we still have our r of t right here"},{"start":1005.06,"text":"so we can write that as r of tau we could also write it as a summation of r"},{"start":1018.22,"text":"So this is what's called the policy gradient, or the vanilla policy gradient, and this is"},{"start":1026.06,"text":"a lot nicer than the version up there."}],"speech_gaps":[{"start":1012.592,"end":1014.352},{"start":1014.416,"end":1015.984}],"frame":"../frames/v030/006.webp","frame_time":865.36},{"title":"策略梯度方法的实现与梯度估计","segments":[{"id":48,"text":"because we can sample trajectories from our policy, compute their reward, also compute the gradient of log of pi for each of the actions, and then sum those together, multiply, and we can get a gradient that we can apply to the weights of our neural network that's actually leading to higher reward. So again, on the slides.","zh":"因为我们可以通过我们的策略采样轨迹，计算它们的奖励，同时计算每个动作的log π的梯度，然后将这些梯度相加、相乘，从而得到一个可以应用于神经网络权重的梯度，这些权重实际上会导致更高的奖励。所以再次回到幻灯片上。","start":1028.7,"end":1058.83},{"id":49,"text":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta.","zh":"我们写下了轨迹的概率。如果你对这个概率取对数，就会得到一个求和而不是乘积，每个单独项的对数。然后如果我们把这个代入梯度中，并对log p_tau取梯度，那么首项和末项会消失，因为它们不依赖于θ。","start":1060.21,"end":1088.03},{"id":50,"text":"And then we get this final term when we plug it in. So this is the gradient. When we do run policy gradient, we'll collect data and then we'll evaluate this equation. And then we'll use that to represent the gradient of the weights of the policy and then run gradient descent, apply that to our policy and then repeat the process. So, yeah, we also talked about this verbally, but in order to estimate this gradient here.","zh":"然后当我们代入后，我们会得到这个最终的项，这就是梯度。当我们运行策略梯度时，我们会收集数据，然后评估这个方程。接着我们会用它来表示策略权重的梯度，然后运行梯度下降，将这个梯度应用于我们的策略，然后重复这个过程。所以，是的，我们还用语言讨论过这一点，但为了估计这里的梯度，","start":1090.38,"end":1125.09},{"id":51,"text":"We'll run the policy to collect some data. We'll then improve the policy using that data. In particular, you can think of the first summation as collecting n samples for that expectation. And ideally, n is larger because the higher n is, the better an estimate you're going to get of the expectation of the integral. And then once we evaluate this gradient that we're estimating with samples, we'll then take a gradient step on our policy parameters.","zh":"我们会运行策略来收集一些数据，然后使用这些数据来改进策略。具体来说，你可以将第一个求和项视为收集n个样本以估计这个期望值。理想情况下，n越大越好，因为n越大，你对积分期望值的估计就越准确。一旦我们评估了用样本估计的梯度，我们就会在策略参数上进行梯度更新。","start":1125.51,"end":1154.8},{"id":52,"text":"And so the full algorithm looks something like sampling trajectories from our policy, evaluating an estimate of the gradient, using those samples, and then applying that to the weights, and then repeating this process to collect a new batch of data, recomputing the gradient, and improving the policy. So the question is, what does it look like to use the data to estimate this kind of gradient term, like this first term or the second term?","zh":"因此，完整的算法大致如下：从我们的策略中采样轨迹，评估梯度的估计值，使用这些样本，然后将其应用于权重，接着重复这个过程以收集新的数据批次，重新计算梯度，并改进策略。那么问题是，使用数据来估计这种梯度项，比如第一个项或第二个项，会是什么样子？","start":1158.51,"end":1187.53}],"notes":["本段讲解了策略梯度方法中如何通过采样轨迹来估计梯度。首先，通过计算轨迹的概率并取对数，将乘积转化为求和，从而简化梯度计算。接着，将对数概率代入梯度公式，发现首项和末项与参数θ无关，因此可以忽略。最终得到的梯度项用于更新策略参数。","在实际运行策略梯度算法时，需要收集数据并评估梯度估计。通过这些数据，可以计算出策略参数的梯度，并使用梯度下降法进行更新。重复这一过程可以逐步改进策略。","为了提高梯度估计的准确性，通常会增加样本数量n。样本数量越大，对期望值的估计越精确。在评估梯度后，会根据估计结果对策略参数进行梯度更新。","整个策略梯度算法的流程包括：从策略中采样轨迹，估计梯度，使用这些样本更新策略参数，并重复这一过程以收集新的数据，重新计算梯度并改进策略。","最后，课程提出了一个关键问题：如何利用数据来估计这种梯度项，例如第一项或第二项。这引导学生思考具体的实现细节和梯度估计方法。","这些内容强调了策略梯度方法的核心思想，即通过采样和梯度估计来优化策略参数，从而提高策略的奖励。"],"formulas":[{"latex":"log p(\\tau) = \\sum_{t=1}^{T} \\log \\pi(a_t | s_t)","symbols":"对数概率的展开形式","explanation":"正确地将轨迹概率的对数展开为各个时间步动作概率的对数和，符合概率论的基本性质。","evidence":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta."},{"latex":"\\nabla_\\theta \\mathbb{E}_{\\tau \\sim \\pi_\\theta} [\\log p(\\tau)]","symbols":"梯度的期望形式","explanation":"正确地表示了对轨迹概率对数的期望的梯度，符合策略梯度方法的基本框架。","evidence":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta."}],"uncertainties":[],"diagram":"none","start":1028.7,"end":1187.53,"asr_flags":[],"math_clarifications":["公式2中的乘法符号应为加法，因为策略梯度的最终形式是期望值的和，而非乘积。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1028.7,"text":"because we can sample trajectories from our policy, compute their reward, also compute the gradient of log of pi for each of the actions, and then sum those together, multiply, and we can get a gradient that we can apply to the weights of our neural network that's actually leading to higher reward. So again, on the slides."},{"start":1060.21,"text":"We wrote down what the probability of a trajectory is. If you take the log of that, you get a summation instead of a product and a log of each of the individual terms. Then if we plug that into our gradient and we take the gradient of log p tau, then the first term and the last term go away because they don't depend on theta."},{"start":1090.38,"text":"And then we get this final term when we plug it in. So this is the gradient. When we do run policy gradient, we'll collect data and then we'll evaluate this equation. And then we'll use that to represent the gradient of the weights of the policy and then run gradient descent, apply that to our policy and then repeat the process. So, yeah, we also talked about this verbally, but in order to estimate this gradient here."},{"start":1125.51,"text":"We'll run the policy to collect some data. We'll then improve the policy using that data. In particular, you can think of the first summation as collecting n samples for that expectation. And ideally, n is larger because the higher n is, the better an estimate you're going to get of the expectation of the integral. And then once we evaluate this gradient that we're estimating with samples, we'll then take a gradient step on our policy parameters."},{"start":1158.51,"text":"And so the full algorithm looks something like sampling trajectories from our policy, evaluating an estimate of the gradient, using those samples, and then applying that to the weights, and then repeating this process to collect a new batch of data, recomputing the gradient, and improving the policy. So the question is, what does it look like to use the data to estimate this kind of gradient term, like this first term or the second term?"}],"speech_gaps":[],"frame":"../frames/v030/007.webp","frame_time":1040.7},{"title":"策略梯度算法的数学基础","segments":[{"id":53,"text":"Cool? The first term. Yeah, so when we're using the data to compute this first term, what we're doing is we're getting a bunch of states and actions, a bunch of trajectories. We're getting n trajectories that each, in this case, have length t time steps. And we'll be taking the states and actions in those trajectories, passing the state through the policy.","zh":"酷吗？第一个项。是的，当我们使用数据来计算这个第一个项时，我们得到一组状态和动作，一组轨迹。我们得到n条轨迹，每条轨迹在此情况下有t个时间步。我们将取这些轨迹中的状态和动作，将状态通过策略进行传递。","start":1188.56,"end":1210.31},{"id":54,"text":"As a forward pass to get the probability over actions will then evaluate the action in the data","zh":"作为前向传播以获得动作上的概率，将评估数据中的动作","start":1211.35,"end":1216.67},{"id":55,"text":"the probability of that","zh":"该动作的概率","start":1217.23,"end":1218.61},{"id":56,"text":"of that action in the data under the distribution that the policy output so if it's like a","zh":"在策略输出分布下数据中该动作的概率，所以如果是像一个","start":1219.21,"end":1224.41},{"id":57,"text":"Categorical distribution will then get the probability. We'll take the log of that probability and","zh":"分类分布，那么将得到该概率。我们将取该概率的对数，","start":1225.83,"end":1230.35},{"id":58,"text":"Then we take the gradient right here, which will just be a forward pass through sorry a backward pass through the network","zh":"然后我们在这里取梯度，这将只是一个网络的前向传播，抱歉是反向传播","start":1230.35,"end":1234.99},{"id":59,"text":"After taking the log of the policy output for that action","zh":"在取该动作的策略输出的对数之后","start":1236.37,"end":1240.25},{"id":60,"text":"So this is called the Reinforced Algorithm, or the Vanilla Policy Gradient Algorithm.","zh":"因此，这被称为增强算法，或原始策略梯度算法。","start":1241.47,"end":1245.41},{"id":61,"text":"Yeah, so this came out, this is just R of tau.","zh":"是的，就是这样，这就是 R of tau。","start":1246.33,"end":1248.35},{"id":62,"text":"So I'm using R of tau as shorthand for this, just because I didn't want to write this summation","zh":"所以我用 R of tau 来简写这个，只是因为我不想写这个求和式","start":1248.99,"end":1254.63},{"id":63,"text":"five times.","zh":"五次。","start":1255.33,"end":1255.97},{"id":64,"text":"But yeah, this is exactly R of tau.","zh":"但确实是的，这就是 R of tau。","start":1257.29,"end":1259.75},{"id":65,"text":"Yeah, exactly.","zh":"是的，没错。","start":1260.63,"end":1261.23},{"id":66,"text":"So this is an estimate because we're only going to be taking n samples to estimate this","zh":"所以这是一个估计值，因为我们只用 n 个样本去估计这个","start":1261.35,"end":1264.99},{"id":67,"text":"expectation.","zh":"期望值。","start":1264.99,"end":1265.25},{"id":68,"text":"If you took infinite, then this would be exact.","zh":"如果你取无限多个样本，那么这就是精确的。","start":1265.25,"end":1270.11},{"id":69,"text":"Of course, taking infinite samples is not possible.","zh":"当然，获取无限多的样本是不可能的。","start":1270.95,"end":1273.25},{"id":70,"text":"Yeah, so the gradient right here, this is going to depend on the architecture.","zh":"是的，所以这里的梯度，这将取决于架构。","start":1274.19,"end":1277.13},{"id":71,"text":"The question was, do we compute this by hand?","zh":"问题是，我们是否手动计算这个？","start":1278.23,"end":1280.01},{"id":72,"text":"You can use automatic differentiation.","zh":"你可以使用自动微分。","start":1281.21,"end":1283.25},{"id":73,"text":"So like whatever library, PyTorch or whatever, that can compute that for you.","zh":"所以无论使用什么库，比如PyTorch或者其他，都可以为你计算这个。","start":1283.99,"end":1287.53},{"id":74,"text":"So you don't have to write it up.","zh":"因此，你不需要手动写出这个过程。","start":1287.55,"end":1289.03},{"id":75,"text":"Great. So let's talk about some of the intuition behind this.","zh":"很好。那么我们来谈谈这个背后的直觉。","start":1290.25,"end":1292.37},{"id":76,"text":"so there's the math. But what does this gradient actually mean? So if you look at this,","zh":"所以这里有数学推导。但这个梯度到底意味着什么？所以如果你看一下这个，","start":1292.37,"end":1298.71},{"id":77,"text":"maybe let's start by looking at the first term. The first term, if we kind of think back to","zh":"也许我们可以先看一下第一个项。如果我们回想一下模仿学习，第一个项实际上与模仿学习的目标函数的梯度是相同的。","start":1299.49,"end":1305.61},{"id":78,"text":"imitation learning, this first term is actually the same as the gradient of the imitation learning","zh":"模仿学习中，这个第一项实际上与模仿学习的目标梯度是相同的","start":1305.61,"end":1311.53},{"id":79,"text":"objective. So in imitation learning, we were trying to mimic actions from some demonstration","zh":"因此，在模仿学习中，我们试图模仿某些演示中的动作","start":1311.53,"end":1316.39},{"id":80,"text":"data set by maximizing the log probability or minimizing the negative log probability.","zh":"在模仿学习中，我们试图通过最大化对数概率或最小化负对数概率来模仿一些演示数据集中的动作。","start":1316.39,"end":1321.99},{"id":81,"text":"And if you take the gradient of that, it's similarly going to be the gradient of the log probability. You can think about this first term as saying I'm going to basically try to increase the likelihood of the actions in the online data. But then for the second term, it's weighting that by the reward of that trajectory. Like how good was that trajectory? And so you can kind of think about this as the imitation gradient, but weighted by","zh":"如果你对这个进行求梯度，它同样会是日志概率的梯度。你可以将这个第一项理解为：我基本上会尝试增加在线数据中动作的可能性。但第二个项则是用该轨迹的奖励来加权。就像这条轨迹有多好？因此你可以将这个理解为模仿梯度，但被加权了","start":1323.19,"end":1353.52}],"notes":["本段讲解了策略梯度算法中第一项的计算过程，即通过数据计算策略输出的概率，并取对数。这部分涉及从状态和动作中获取轨迹，通过策略网络进行前向传播以获得动作的概率分布。接着，通过反向传播计算梯度，这与神经网络的自动微分机制相关。","讲者提到，第一项与模仿学习中的梯度目标相似，即最大化对数概率或最小化负对数概率。这表明策略梯度算法在某种程度上与模仿学习的目标一致，但加入了奖励的加权。","讲者强调，由于只能使用有限样本进行估计，因此该梯度是一个估计值，而不是精确值。如果使用无限样本，该估计将变得精确，但实际中这是不可能的。","讲者还提到梯度的计算依赖于网络的架构，并指出可以使用自动微分工具（如PyTorch）来计算梯度，而无需手动推导。","最后，讲者提到该算法被称为“Reinforced Algorithm”或“Vanilla Policy Gradient Algorithm”，并指出其数学表达式为R(τ)，即轨迹的累积奖励。","讲者通过对比模仿学习和策略梯度算法，强调了策略梯度算法在最大化动作概率的同时，还考虑了轨迹的奖励，从而实现了强化学习的目标。"],"formulas":[],"uncertainties":["Categorical distribution will then get the probability. We'll take the log of that probability and"],"diagram":"none","start":1188.56,"end":1353.52,"asr_flags":[67],"math_clarifications":["原始文本中并未明确给出R(τ)的具体数学表达式，仅提到R(τ)作为轨迹的累积奖励。因此，无法核定该公式是否准确或完整。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":1188.56,"text":"Cool? The first term. Yeah, so when we're using the data to compute this first term, what we're doing is we're getting a bunch of states and actions, a bunch of trajectories. We're getting n trajectories that each, in this case, have length t time steps. And we'll be taking the states and actions in those trajectories, passing the state through the policy."},{"start":1211.35,"text":"As a forward pass to get the probability over actions will then evaluate the action in the data"},{"start":1217.23,"text":"the probability of that"},{"start":1219.21,"text":"of that action in the data under the distribution that the policy output so if it's like a"},{"start":1225.83,"text":"Categorical distribution will then get the probability. We'll take the log of that probability and"},{"start":1230.35,"text":"Then we take the gradient right here, which will just be a forward pass through sorry a backward pass through the network"},{"start":1236.37,"text":"After taking the log of the policy output for that action"},{"start":1241.47,"text":"So this is called the Reinforced Algorithm, or the Vanilla Policy Gradient Algorithm."},{"start":1246.33,"text":"Yeah, so this came out, this is just R of tau."},{"start":1248.99,"text":"So I'm using R of tau as shorthand for this, just because I didn't want to write this summation"},{"start":1255.33,"text":"five times."},{"start":1257.29,"text":"But yeah, this is exactly R of tau."},{"start":1260.63,"text":"Yeah, exactly."},{"start":1261.35,"text":"So this is an estimate because we're only going to be taking n samples to estimate this"},{"start":1264.99,"text":"expectation."},{"start":1265.25,"text":"If you took infinite, then this would be exact."},{"start":1270.95,"text":"Of course, taking infinite samples is not possible."},{"start":1274.19,"text":"Yeah, so the gradient right here, this is going to depend on the architecture."},{"start":1278.23,"text":"The question was, do we compute this by hand?"},{"start":1281.21,"text":"You can use automatic differentiation."},{"start":1283.99,"text":"So like whatever library, PyTorch or whatever, that can compute that for you."},{"start":1287.55,"text":"So you don't have to write it up."},{"start":1290.25,"text":"Great. So let's talk about some of the intuition behind this."},{"start":1292.37,"text":"so there's the math. But what does this gradient actually mean? So if you look at this,"},{"start":1299.49,"text":"maybe let's start by looking at the first term. The first term, if we kind of think back to"},{"start":1305.61,"text":"imitation learning, this first term is actually the same as the gradient of the imitation learning"},{"start":1311.53,"text":"objective. So in imitation learning, we were trying to mimic actions from some demonstration"},{"start":1316.39,"text":"data set by maximizing the log probability or minimizing the negative log probability."},{"start":1323.19,"text":"And if you take the gradient of that, it's similarly going to be the gradient of the log probability. You can think about this first term as saying I'm going to basically try to increase the likelihood of the actions in the online data. But then for the second term, it's weighting that by the reward of that trajectory. Like how good was that trajectory? And so you can kind of think about this as the imitation gradient, but weighted by"}],"speech_gaps":[],"frame":"../frames/v030/008.webp","frame_time":1200.56},{"title":"策略梯度与模仿学习的对比","segments":[{"id":82,"text":"the sum of rewards seen in the data. And so essentially, you're going to increase the likelihood of actions that had high reward and decrease the likelihood of actions that were taken in negative reward trajectories. And so you're actually going to be imitating your own data, the data that was collected by the policy. But depending on whether it's high reward or low reward, you will be...","zh":"数据中看到的奖励总和。因此，实际上，你会增加那些具有高奖励动作的可能性，降低那些在负奖励轨迹中采取的动作的可能性。因此，你实际上是在模仿自己的数据，即由策略收集的数据。但根据是高奖励还是低奖励，你将会……","start":1354.17,"end":1381.52},{"id":83,"text":"you might actually have a negative gradient. If it's negative reward, it's going to push you away from the bad stuff and push you towards the good stuff. So this is inside the first summation. You can see the i comes up right here. So we're summing a bunch of trajectories, and then this is all within the summation over n. So the question is, is the difference between this and imitation learning, where imitation learning, you're either right or wrong, or here you're this amount of right or this amount of wrong?","zh":"你实际上可能会有一个负梯度。如果是负奖励，它会将你远离坏的情况，推向好的情况。因此，这是第一个求和项中的内容。你可以看到这里的i出现了。因此，我们是在对一系列轨迹进行求和，而这一切都在对n的求和范围内。问题是，这与模仿学习有什么不同？在模仿学习中，你要么是对的，要么是错的，而在这里，你则是有一定量的对或一定量的错。","start":1382.54,"end":1409.14},{"id":84,"text":"So you can apply this, well in principle you can apply this in scenarios where the reward is very sparse.","zh":"因此，你可以在奖励非常稀疏的场景中应用这种方法。","start":1411.09,"end":1417.88},{"id":85,"text":"And so you can actually apply it in scenarios where the reward is just like one if you succeeded and zero otherwise. Now, this algorithm may not do very well in those scenarios, and we'll talk about that. One of the key differences with imitation learning is that you're actually doing this on your own rollouts. So the policy is collecting its own data and then applying this objective to its own data. And so that's one of the differences. And then second is we're actually using this reward, whereas in imitation learning, you're just blindly imitating all the data.","zh":"因此，你实际上可以在奖励只是成功时为1、否则为0的场景中应用这种方法。然而，这种算法在这些场景中可能表现不佳，我们之后会讨论这一点。与模仿学习的一个关键区别在于，你实际上是在自己的 rollout 上进行操作。因此，策略会收集自己的数据，然后将其应用于自己的数据上。因此，这是其中一个区别。另一个区别是我们实际上使用了这个奖励，而在模仿学习中，你只是盲目地模仿所有数据。","start":1418.35,"end":1446.29},{"id":86,"text":"without any notion of how good the data is. And it kind of assumes that it's good data. Yeah, how do you sample the first state of the trajectory? This is something that's typically defined by the problem setting. So in some problem settings, if you're trying to train an agent to play pinball or something, then the initial state will just be given by the pinball machine.","zh":"没有任何关于数据好坏的概念。它基本上假设数据是好的。是的，如何采样轨迹的第一个状态？这是通常由问题设定定义的。因此，在某些问题设定中，如果你试图训练一个代理来玩弹珠机，那么初始状态将由弹珠机给出。","start":1446.7,"end":1470.32},{"id":87,"text":"So it's usually thought of as a property of the environment. So the question is, can you use this to improve imitation learning by weighting the trajectories by reward? Yeah, you could definitely do that. We will also talk about some of the good things and bad things about this objective in the coming slides.","zh":"因此，它通常被视为环境的一个属性。问题是，能否通过按奖励对轨迹进行加权来改进模仿学习？是的，你完全可以这样做。我们将在接下来的幻灯片中讨论这个目标的一些优点和缺点。","start":1472.47,"end":1498.26},{"id":88,"text":"Yeah, so the question was, in practice, does it make sense to start with imitation learning, run that for a number of iterations, and then switch to this?","zh":"是的，问题是，在实践中，是否合理地从模仿学习开始，运行若干次迭代，然后切换到这种方法？","start":1499.22,"end":1504.86},{"id":89,"text":"That can definitely make sense. If you start completely from a randomly initialized policy, it will do random stuff. And if you have a very dense reward signal, that can be okay. But in other scenarios, if you have access to demonstrations, then initializing with demonstrations can be a very good fit. And then it will allow you to improve on top of your initial policy.","zh":"这确实可能有意义。如果你从一个随机初始化的策略完全开始，它会做随机的事情。如果你有一个非常密集的奖励信号，这可能是可以接受的。但在其他情况下，如果你有演示数据，那么以演示数据进行初始化可能是一个非常好的选择。然后它将允许你在初始策略的基础上进行改进。","start":1505.83,"end":1528.75}],"notes":["本段讨论了策略梯度方法与模仿学习之间的区别。策略梯度方法通过奖励来调整策略，增加高奖励动作的概率，减少低奖励动作的概率，而模仿学习则是直接复制数据。策略梯度方法在奖励稀疏的场景中可能表现不佳，但可以通过自身收集的数据进行优化。","策略梯度方法的一个关键区别在于，它使用自身的数据进行训练，而不是盲目地模仿所有数据。这使得策略梯度方法能够根据奖励的大小调整策略，而模仿学习则没有这种机制。","在某些情况下，可以将模仿学习与策略梯度方法结合使用。例如，先使用模仿学习进行初始化，再切换到策略梯度方法进行优化。这种方法在奖励信号密集的场景中可能更有效。","初始状态的采样通常由环境定义，例如在玩弹珠时初始状态由弹珠机给出，在语言建模中初始状态可能是用户的问题。这种初始状态的设定是环境的一部分。","策略梯度方法可以通过对轨迹进行加权来改进模仿学习。通过奖励对轨迹进行加权，可以更有效地优化策略，而不仅仅是复制数据。","在实际应用中，策略梯度方法可能需要较多的训练数据和计算资源，尤其是在奖励稀疏的场景中。因此，结合模仿学习进行初始化可能是一个有效的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1354.17,"end":1528.75,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1354.17,"text":"the sum of rewards seen in the data. And so essentially, you're going to increase the likelihood of actions that had high reward and decrease the likelihood of actions that were taken in negative reward trajectories. And so you're actually going to be imitating your own data, the data that was collected by the policy. But depending on whether it's high reward or low reward, you will be..."},{"start":1382.54,"text":"you might actually have a negative gradient. If it's negative reward, it's going to push you away from the bad stuff and push you towards the good stuff. So this is inside the first summation. You can see the i comes up right here. So we're summing a bunch of trajectories, and then this is all within the summation over n. So the question is, is the difference between this and imitation learning, where imitation learning, you're either right or wrong, or here you're this amount of right or this amount of wrong?"},{"start":1411.09,"text":"So you can apply this, well in principle you can apply this in scenarios where the reward is very sparse."},{"start":1418.35,"text":"And so you can actually apply it in scenarios where the reward is just like one if you succeeded and zero otherwise. Now, this algorithm may not do very well in those scenarios, and we'll talk about that. One of the key differences with imitation learning is that you're actually doing this on your own rollouts. So the policy is collecting its own data and then applying this objective to its own data. And so that's one of the differences. And then second is we're actually using this reward, whereas in imitation learning, you're just blindly imitating all the data."},{"start":1446.7,"text":"without any notion of how good the data is. And it kind of assumes that it's good data. Yeah, how do you sample the first state of the trajectory? This is something that's typically defined by the problem setting. So in some problem settings, if you're trying to train an agent to play pinball or something, then the initial state will just be given by the pinball machine."},{"start":1472.47,"text":"In other cases, in language modeling, the initial state or observation might be the first question that the user asks. So it's usually thought of as a property of the environment. So the question is, can you use this to improve imitation learning by weighting the trajectories by reward? Yeah, you could definitely do that. We will also talk about some of the good things and bad things about this objective in the coming slides."},{"start":1499.22,"text":"Yeah, so the question was, in practice, does it make sense to start with imitation learning, run that for a number of iterations, and then switch to this?"},{"start":1505.83,"text":"That can definitely make sense. If you start completely from a randomly initialized policy, it will do random stuff. And if you have a very dense reward signal, that can be okay. But in other scenarios, if you have access to demonstrations, then initializing with demonstrations can be a very good fit. And then it will allow you to improve on top of your initial policy."}],"speech_gaps":[],"frame":"../frames/v030/009.webp","frame_time":1366.17},{"title":"策略梯度与奖励学习","segments":[{"id":90,"text":"So the question is, if you don't have a good conception of what's good and bad, like what the reward function should be, can you use imitation learning to kind of get an initial sense for that? We'll talk about reward learning in a few lectures and how you can potentially use expert data for that. In practice, it's challenging.","zh":"那么问题是，如果你对什么是好、什么是坏没有清晰的认识，比如不知道奖励函数应该是什么样的，你能否利用模仿学习来获得一个初步的感知？我们将在后续几节课中讨论奖励学习，以及如何潜在地利用专家数据来进行。在实践中，这具有挑战性。","start":1529.72,"end":1549.94},{"id":91,"text":"So we talked about how this kind of is intuitively increasing likelihood on high reward trajectories and decreasing likelihood on negative reward trajectories. If we actually look at this visually, say that we took a few trajectories, one of them had good reward, one of them had bad reward, and this red is kind of showing our initial distribution over trajectories. What this gradient is going to do is it's going to increase the likelihood on the green part, so you'll get something that looks like this.","zh":"我们之前讨论过，这种做法在直觉上会增加高奖励轨迹的似然性，同时降低负奖励轨迹的似然性。如果我们实际从视觉上来看，假设我们收集了几条轨迹，其中一条有好的奖励，另一条有坏的奖励，红色部分大致展示了我们对轨迹的初始分布。这个梯度的作用是增加绿色部分的似然性，因此你会得到一个看起来像这样的结果。","start":1551.89,"end":1578.71},{"id":92,"text":"And then it'll decrease the likelihood on the red part, so you'll get something that looks like this. And it'll encourage the policy to take actions that are more like the high-reward trajectory. In even more brief terms, you can think of this as trying to do more of the good stuff and less of the bad stuff that you observed. And then you can also think about this as kind of a formalization of trial and error, where you're actually going to try to do different things. And if you see...","zh":"然后它会降低红色部分的似然性，因此你会得到一个看起来像这样的结果。它会鼓励策略采取更接近高奖励轨迹的动作。用更简短的说法，你可以将其视为尝试做更多你观察到的好事，以及更少的坏事。你也可以将其视为一种试错的正式化，你实际上会尝试不同的事情。如果你看到……","start":1579.29,"end":1610.92},{"id":93,"text":"good stuff happening, then you'll try to do more of that. And if you make a mistake, then you'll try to stop doing that. Cool. So now I have a question for you. So let's look at an example. Say that we're trying to have a humanoid learn how to walk in simulation. And we'll define the reward function to be the forward velocity of the robot. This means that the reward function will be positive if it's moving forward. It may also be negative if the robot is moving backwards. It might be zero if the robot is not moving.","zh":"好事发生，那么你会尝试更多这样的行为。如果你犯了错误，那么你会尝试停止这样做。很好。现在我有一个问题要问你们。让我们来看一个例子。假设我们试图让一个类人机器人在模拟环境中学习如何行走。我们将奖励函数定义为机器人的前向速度。这意味着如果机器人向前移动，奖励函数将是正的。如果机器人向后移动，奖励函数可能为负。如果机器人没有移动，奖励函数可能为零。","start":1611.5,"end":1640.83},{"id":94,"text":"First, we'll sample from our policy. Say we have a policy that's not very good at the beginning. So in the first trajectory, maybe it falls backwards. In the second trajectory, maybe it falls forwards, which will actually technically give it positive reward. So the sum of rewards will be positive. Maybe in another trajectory, it manages to stand still. So the rewards would be zero for that.","zh":"首先，我们将从我们的策略中进行采样。假设我们有一个在开始时表现不佳的策略。因此，在第一条轨迹中，它可能向后倒下。在第二条轨迹中，它可能向前倒下，这实际上会给予它正奖励。因此，奖励的总和将是正的。也许在另一条轨迹中，它能够保持静止。那么该轨迹的奖励将是零。","start":1643.15,"end":1665.25},{"id":95,"text":"In another trajectory, maybe it takes one small step forward and then falls backwards. And so the initial reward at the beginning of the trajectory would actually be getting positive rewards. And then later on, it would be getting negative rewards and the sum of rewards would be negative. And then maybe the last trajectory is it takes one large step backwards and then a small step forwards. And in this case, it would have kind of negative rewards and then some positive rewards, but the sum of rewards would still be negative.","zh":"在另一条轨迹中，它可能先向前迈出一小步，然后向后倒下。因此，轨迹开始时的初始奖励实际上会是正奖励。之后，它会获得负奖励，奖励的总和将是负的。也许最后一条轨迹是它向后迈出一大步，然后向前迈出一小步。在这种情况下，它会有一些负奖励和一些正奖励，但奖励的总和仍然是负的。","start":1666.19,"end":1694.3}],"notes":["本段讨论了策略梯度方法的基本思想，即通过增加高奖励轨迹的概率并减少低奖励轨迹的概率来优化策略。讲者提到，梯度会增加绿色部分（高奖励轨迹）的概率，同时减少红色部分（低奖励轨迹）的概率，从而鼓励策略采取更接近高奖励轨迹的行为。","讲者进一步解释了策略梯度方法可以被视为一种形式化的试错过程，即通过尝试不同的行为并根据结果调整策略。如果观察到好的结果，策略会倾向于重复该行为；如果出现错误，则会减少该行为的发生。","在举例部分，讲者以一个模拟中的人形机器人学习行走为例，说明了奖励函数的定义。奖励函数被定义为机器人的前向速度，因此正向移动会获得正奖励，反向移动会获得负奖励，静止则获得零奖励。","接着，讲者描述了不同轨迹的奖励情况。例如，一个轨迹可能在开始时获得正奖励，但随后获得负奖励，导致总奖励为负；另一个轨迹可能在开始时获得正奖励，但最终总奖励仍为负。","通过这些例子，讲者展示了策略梯度方法如何通过调整策略来最大化期望奖励，从而引导策略向更优的方向发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1529.72,"end":1694.3,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1529.72,"text":"So the question is, if you don't have a good conception of what's good and bad, like what the reward function should be, can you use imitation learning to kind of get an initial sense for that? We'll talk about reward learning in a few lectures and how you can potentially use expert data for that. In practice, it's challenging."},{"start":1551.89,"text":"So we talked about how this kind of is intuitively increasing likelihood on high reward trajectories and decreasing likelihood on negative reward trajectories. If we actually look at this visually, say that we took a few trajectories, one of them had good reward, one of them had bad reward, and this red is kind of showing our initial distribution over trajectories. What this gradient is going to do is it's going to increase the likelihood on the green part, so you'll get something that looks like this."},{"start":1579.29,"text":"And then it'll decrease the likelihood on the red part, so you'll get something that looks like this. And it'll encourage the policy to take actions that are more like the high-reward trajectory. In even more brief terms, you can think of this as trying to do more of the good stuff and less of the bad stuff that you observed. And then you can also think about this as kind of a formalization of trial and error, where you're actually going to try to do different things. And if you see..."},{"start":1611.5,"text":"good stuff happening, then you'll try to do more of that. And if you make a mistake, then you'll try to stop doing that. Cool. So now I have a question for you. So let's look at an example. Say that we're trying to have a humanoid learn how to walk in simulation. And we'll define the reward function to be the forward velocity of the robot. This means that the reward function will be positive if it's moving forward. It may also be negative if the robot is moving backwards. It might be zero if the robot is not moving."},{"start":1643.15,"text":"First, we'll sample from our policy. Say we have a policy that's not very good at the beginning. So in the first trajectory, maybe it falls backwards. In the second trajectory, maybe it falls forwards, which will actually technically give it positive reward. So the sum of rewards will be positive. Maybe in another trajectory, it manages to stand still. So the rewards would be zero for that."},{"start":1666.19,"text":"In another trajectory, maybe it takes one small step forward and then falls backwards. And so the initial reward at the beginning of the trajectory would actually be getting positive rewards. And then later on, it would be getting negative rewards and the sum of rewards would be negative. And then maybe the last trajectory is it takes one large step backwards and then a small step forwards. And in this case, it would have kind of negative rewards and then some positive rewards, but the sum of rewards would still be negative."}],"speech_gaps":[],"frame":"../frames/v030/010.webp","frame_time":1541.72},{"title":"策略梯度中的梯度作用与轨迹多样性","segments":[{"id":96,"text":"Now, my question for you is, what will the gradient that we defined here, what will it encourage the policy to do if this is your data set, if these are the five trajectories that you sampled? This is going to be one of our simpler examples, and then we'll move to more complex examples in a couple more slides.","zh":"现在，我的问题是，我们在这里定义的梯度会鼓励策略做什么，如果这是你的数据集，如果这些是你采样的五条轨迹呢？这将是我们一个更简单的例子，然后在接下来的几张幻灯片中，我们将转向更复杂的例子。","start":1696.08,"end":1718.4},{"id":97,"text":"So I'd encourage you to pair up for a minute, discuss it briefly, and then we'll come back and share in like one or two minutes. Okay, let's come back. If you want to share your answer, can you raise your hand? Okay, so the gradient will encourage it to fall forwards and potentially stand still. So, cool.","zh":"因此，我鼓励你们花一分钟时间配对讨论一下，然后我们将在一到两分钟后回来分享。好的，我们回来。如果你想分享你的答案，可以举手吗？好的，所以梯度会鼓励它向前倒下并可能保持静止。所以，很酷。","start":1718.97,"end":1741.05},{"id":98,"text":"Mostly correct. So if we think through each of these trajectories, the first one, the reward, will be negative here. It'll also be negative. The sum of rewards over the entire trajectory will be negative for 1, 4, and 5. It should be about 0 for 3. And for 2, the sum should be positive. And so what this means is you'll get negative gradients for...","zh":"大部分是正确的。如果我们仔细分析每条轨迹，第一条轨迹的奖励将是负的。它也会是负的。整个轨迹的奖励总和对于1、4和5来说将是负的，对于3来说应该接近0。对于2来说，总和应该是正的。这意味着你会在1、4和5中采取的动作上获得负梯度，而在2中采取的动作上获得正梯度，并且在轨迹3中采取的动作上获得近似为零的梯度。因此，这会鼓励策略向前倒下，并且会鼓励它不做1、4和5中所做的事，因此会阻止它向后或向前迈步，也会阻止它向后倒下。","start":1742.22,"end":1764.62},{"id":99,"text":"any actions that were taken in 1, 4, and 5, you'll get positive gradients for all the actions taken in 2, and you'll get roughly zero gradients for all the actions that are taken in trajectory 3. And so this means that it will encourage it to fall forwards, and it'll encourage it to not do the things that were in 1, 4, and 5, so it will discourage it from taking steps backwards or forwards, and will also discourage it from falling backwards.","zh":"在1、4和5中采取的任何动作，你都会为在2中采取的所有动作获得正梯度，并且在轨迹3中采取的所有动作会获得大约零梯度。这意味着它会鼓励向前倾倒，并且会鼓励不要做1、4和5中的事情，因此会阻止它采取向后或向前的步骤，也会阻止它向后倾倒。","start":1765.02,"end":1790.52},{"id":100,"text":"Cool. So yeah, so we encourage the policy to fall forwards and not take steps. This is distressing because we don't want our policy to fall forward. We want to take steps. And so this is a kind of example of how the gradient that we're getting is noisy, high variance. It means that depending on what these trajectories are, the gradient might vary drastically. So if you do actually have some trajectories that are walking forwards.","zh":"你可能会从这些轨迹集中得到非常不同的梯度估计。因此，这就是具有噪声或高方差的定义。是的，问题是为什么我们会从同一个策略中获取多条轨迹？比如，为什么不只获取一条呢？","start":1792.11,"end":1817.49},{"id":101,"text":"you might actually get a very different gradient estimate from this set of trajectories. And so that's kind of the definition of having noise or having high variance. Yeah, so the question is why are we getting multiple trajectories from the same policy? Like why not just get one?","zh":"你可能会从这些轨迹集中得到非常不同的梯度估计。因此，这就是具有噪声或高方差的定义。是的，问题是为什么我们会从同一个策略中获取多条轨迹？比如，为什么不只获取一条呢？","start":1818.35,"end":1831.65},{"id":102,"text":"There's two reasons for this. One is that the policy is not deterministic. And so if we want to explore different strategies, we will get kind of different samples of different strategies because it's not deterministic. And the second reason is also the environment might be stochastic. And so even if you have a deterministic policy, you might see different outcomes. And this will help you learn about those different outcomes. There's one thing that we can do about this that we can already kind of directly improve the gradient in a fairly simple way.","zh":"出现这种情况有两个原因。一个是策略本身不是确定性的。因此，如果我们想要探索不同的策略，就会得到不同策略的不同样本，因为策略不是确定性的。第二个原因是环境可能是随机的。因此，即使你有一个确定性的策略，你也会看到不同的结果。这将有助于你学习这些不同的结果。针对这种情况，我们有一种可以直接以相对简单的方式改进梯度的方法。","start":1832.91,"end":1860.45}],"notes":["本段讨论了策略梯度中梯度的作用，指出梯度会鼓励策略采取某些动作，例如向前倒下或保持静止。同时，讲者提到梯度估计可能具有高方差，因为不同轨迹可能导致不同的梯度估计。","讲者进一步解释了为何需要从同一策略中获取多个轨迹，原因包括策略的非确定性和环境的随机性。非确定性策略会生成不同的策略样本，而随机环境即使有确定性策略也会导致不同结果，这有助于学习不同结果。","讲者提到可以通过直接改进梯度来应对轨迹多样性带来的问题，但未具体说明如何改进。这表明在策略梯度方法中，轨迹多样性是不可避免的，且需要通过其他技术（如重要性采样或基线）来减少方差。","讲者强调了梯度估计的高方差问题，指出不同轨迹可能导致梯度估计差异很大，这会影响策略的更新效果。因此，减少方差是策略梯度方法中的一个重要挑战。","讲者通过一个具体的例子说明了梯度如何影响策略：对于奖励总和为负的轨迹，梯度会鼓励策略避免这些动作；而对于奖励总和为正的轨迹，梯度会鼓励策略采取这些动作。","讲者最后提到，虽然轨迹多样性可能带来噪声，但这是学习过程中必要的，因为不同轨迹提供了不同的信息，有助于策略的优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1696.08,"end":1860.45,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1696.08,"text":"Now, my question for you is, what will the gradient that we defined here, what will it encourage the policy to do if this is your data set, if these are the five trajectories that you sampled? This is going to be one of our simpler examples, and then we'll move to more complex examples in a couple more slides."},{"start":1718.97,"text":"So I'd encourage you to pair up for a minute, discuss it briefly, and then we'll come back and share in like one or two minutes. Okay, let's come back. If you want to share your answer, can you raise your hand? Okay, so the gradient will encourage it to fall forwards and potentially stand still. So, cool."},{"start":1742.22,"text":"Mostly correct. So if we think through each of these trajectories, the first one, the reward, will be negative here. It'll also be negative. The sum of rewards over the entire trajectory will be negative for 1, 4, and 5. It should be about 0 for 3. And for 2, the sum should be positive. And so what this means is you'll get negative gradients for..."},{"start":1765.02,"text":"any actions that were taken in 1, 4, and 5, you'll get positive gradients for all the actions taken in 2, and you'll get roughly zero gradients for all the actions that are taken in trajectory 3. And so this means that it will encourage it to fall forwards, and it'll encourage it to not do the things that were in 1, 4, and 5, so it will discourage it from taking steps backwards or forwards, and will also discourage it from falling backwards."},{"start":1792.11,"text":"Cool. So yeah, so we encourage the policy to fall forwards and not take steps. This is distressing because we don't want our policy to fall forward. We want to take steps. And so this is a kind of example of how the gradient that we're getting is noisy, high variance. It means that depending on what these trajectories are, the gradient might vary drastically. So if you do actually have some trajectories that are walking forwards."},{"start":1818.35,"text":"you might actually get a very different gradient estimate from this set of trajectories. And so that's kind of the definition of having noise or having high variance. Yeah, so the question is why are we getting multiple trajectories from the same policy? Like why not just get one?"},{"start":1832.91,"text":"There's two reasons for this. One is that the policy is not deterministic. And so if we want to explore different strategies, we will get kind of different samples of different strategies because it's not deterministic. And the second reason is also the environment might be stochastic. And so even if you have a deterministic policy, you might see different outcomes. And this will help you learn about those different outcomes. There's one thing that we can do about this that we can already kind of directly improve the gradient in a fairly simple way."}],"speech_gaps":[],"frame":"../frames/v030/011.webp","frame_time":1708.08},{"title":"策略梯度中的轨迹依赖性与梯度更新","segments":[{"id":103,"text":"And in particular, one observation that we might make is that if you're in the middle of a trajectory and you take an action, that action has no influence on previous states. And right now, the gradient is using the rewards at all states in the trajectory to update, in the gradient update, and it's even telling us to take actions later in the trajectory if your reward earlier in the trajectory was good or bad
