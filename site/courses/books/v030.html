.","zh":"特别值得注意的一点是，如果你正处于轨迹的中间并采取了一个动作，这个动作对之前的状态是没有影响的。而目前，梯度更新使用轨迹中所有状态的奖励来进行更新，并且甚至建议我们根据轨迹早期的奖励好坏来决定后续采取的动作。","start":1861.29,"end":1889.62},{"id":104,"text":"One of the things that we can do is if one of our trajectories was to take a large step backwards and then a small step forwards, and we should actually be able to learn from this trajectory that taking a small step forward is good. And the way that we can do that is instead of having this be a sum from t equals 1 to t, what we can instead do is we can actually have this summation start at t.","zh":"我们可以做的一件事是，如果轨迹中有一个大步后退然后小步前进的情况，我们实际上应该能够从这个轨迹中学习到小步前进是好的。我们做到这一点的方式是，而不是从 t 等于 1 开始求和，我们可以让求和从 t 开始。","start":1892.26,"end":1922.24},{"id":105,"text":"And so we can have this essentially be, let's use a different letter. So we'll have T prime that is starting at T and going to capital T. And now this is a reward of ST prime AT prime. And by having it only look at future rewards, this means that we're now kind of incorporating the fact that","zh":"因此，我们可以让这个求和本质上从另一个字母开始。我们将使用 T prime，它从 T 开始到大写 T。现在，这是状态 ST prime 和动作 AT prime 的奖励。通过只关注未来的奖励，这意味着我们现在某种程度上考虑到了","start":1923.27,"end":1953.2},{"id":106,"text":"Current actions can only affect the future and not affect the past. Oh, yes, sorry. One other thing that you have to do here. Yes, good point, is to actually move this summation inside this summation here. Yeah, why can we do this? So the reason is that we know that our action at, let's say, our action at time equals 100. So let's say, like,","zh":"当前的动作只能影响未来，而不会影响过去。哦，对，抱歉。你在这里还需要做的一件事是，实际上将这个求和移到这个求和里面。是的，为什么可以这样做呢？原因是我们知道在时间等于 100 时采取的动作。比如说，","start":1954.54,"end":1981.26},{"id":107,"text":"if t equals 100. So we're looking at like a 100. We know that this 100 is only going to influence rewards in the future and this isn't going to have any impact on states in the past. So like this is going to be completely independent of like s50. So this doesn't affect like","zh":"如果 t 等于 100。我们正在查看的是 100。我们知道这个 100 只会影响未来的奖励，而不会对过去的状态有任何影响。比如，这会完全独立于 s50。这不会影响 s50 或 s51 或 s99。","start":1983.21,"end":2008.91},{"id":108,"text":"S50 or S51 or S99. And this means that because of that independence, we can then drop the rewards. We can kind of drop that from the equation. When looking at increasing the likelihood of an action at time t, only use the future rewards in that influence.","zh":"S50或S51或S99。这意味着由于这种独立性，我们可以将奖励舍去。我们可以从方程中大致去掉这部分。在考虑增加时间t处动作的可能性时，只需使用该动作影响下的未来奖励。","start":2009.74,"end":2038.14}],"notes":["本段讨论了策略梯度方法中轨迹依赖性的关键点，即当前动作仅影响未来状态，而不影响过去状态。因此，在梯度更新中，可以仅考虑未来奖励，而不必考虑过去奖励。这有助于简化计算并提高学习效率。","讲者提到，如果轨迹中包含大步后退和小步前进，那么应能从轨迹中学习到小步前进是好的。这表明，梯度更新应从某个时间点开始，而不是从轨迹的起点开始，从而更关注未来奖励。","讲者使用了T'作为新的时间变量，从T开始到大写T，表示只关注未来奖励。这表明，梯度更新可以仅考虑未来奖励，而不必考虑所有状态的奖励，从而减少计算复杂度。","讲者强调，当前动作仅影响未来奖励，而不影响过去状态。因此，可以将奖励从方程中移除，仅使用未来奖励来更新动作的概率。这表明，梯度更新可以更高效地进行，因为不需要考虑过去状态的影响。","讲者提到，动作在时间t=100时仅影响未来奖励，而不影响时间t=50、t=51或t=99的状态。这表明，动作与状态之间存在独立性，因此可以将奖励从方程中移除。"],"formulas":[],"uncertainties":["S50 or S51 or S99"],"diagram":"none","start":1861.29,"end":2038.14,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1861.29,"text":"And in particular, one observation that we might make is that if you're in the middle of a trajectory and you take an action, that action has no influence on previous states. And right now, the gradient is using the rewards at all states in the trajectory to update, in the gradient update, and it's even telling us to take actions later in the trajectory if your reward earlier in the trajectory was good or bad."},{"start":1892.26,"text":"One of the things that we can do is if one of our trajectories was to take a large step backwards and then a small step forwards, and we should actually be able to learn from this trajectory that taking a small step forward is good. And the way that we can do that is instead of having this be a sum from t equals 1 to t, what we can instead do is we can actually have this summation start at t."},{"start":1923.27,"text":"And so we can have this essentially be, let's use a different letter. So we'll have T prime that is starting at T and going to capital T. And now this is a reward of ST prime AT prime. And by having it only look at future rewards, this means that we're now kind of incorporating the fact that"},{"start":1954.54,"text":"Current actions can only affect the future and not affect the past. Oh, yes, sorry. One other thing that you have to do here. Yes, good point, is to actually move this summation inside this summation here. Yeah, why can we do this? So the reason is that we know that our action at, let's say, our action at time equals 100. So let's say, like,"},{"start":1983.21,"text":"if t equals 100. So we're looking at like a 100. We know that this 100 is only going to influence rewards in the future and this isn't going to have any impact on states in the past. So like this is going to be completely independent of like s50. So this doesn't affect like"},{"start":2009.74,"text":"S50 or S51 or S99. And this means that because of that independence, we can then drop the rewards. We can kind of drop that from the equation. When looking at increasing the likelihood of an action at time t, only use the future rewards in that influence."}],"speech_gaps":[],"frame":"../frames/v030/012.webp","frame_time":1873.29},{"title":"策略梯度中的因果关系与奖励累积","segments":[{"id":109,"text":"It's a little bit hard to write out mathematically why you can do that. I can maybe think about whether there's a nice mathematical expression for that. But it's really just about causality in the world. And so basically, policy behavior at time t is not going to influence rewards at earlier time steps. Cool. I think that this equation, OK, I don't have the typo in this equation. So yeah, we're bringing this summation inside the other one.","zh":"很难用数学方式写出为什么你可以这样做。我或许可以想想是否存在一个漂亮的数学表达式来表示这一点。但其实这仅仅关乎于世界中的因果关系。基本上，时间t的策略行为不会影响更早时间步的奖励。好，我认为这个等式，嗯，我这个等式中没有拼写错误。所以是的，我们将这个求和式子放到另一个里面。","start":2039.34,"end":2068.51},{"id":110,"text":"and is only going to be a factor of the future time steps. And this means that for this example right here, we will be kind of decreasing the likelihood of actions at the beginning of the trajectory, and then the future summations will become positive because you took a step forward, and then you'll actually start to be increasing the likelihood of taking a small step forward.","zh":"它只会对未来的时间步产生影响。这意味着在这个例子中，我们会略微降低轨迹开始时动作的可能性，而未来求和项会变成正数，因为你向前迈出了一步，然后你实际上会开始增加向前迈出小步的可能性。","start":2069.95,"end":2094.43},{"id":111,"text":"Yeah, so a very good point is it still doesn't help you if you take a step forward and then you take a step backwards. And the reason why that's actually a little bit difficult to handle is that it's possible that the step forwards actually cause you to fall backwards or cause you to take a step backwards. You don't really know. A big part of reinforcement learning is thinking about what...","zh":"是的，一个非常好的观点是，如果你向前迈出一步，然后又向后迈出一步，这仍然不会对你有所帮助。而实际上处理这种情况有点困难的原因是，向前迈出的一步可能会导致你向后倒下，或者导致你向后迈出一步。你并不真正知道。强化学习的一个重要部分就是思考这些动作对未来的影响。你需要从经验中学习这一点。你需要……如果你向前迈出一步，从算法的角度来看，这实际上可能导致未来发生不好的事情。因此，我们不能忽略这些奖励。问题是，如果你说你在开始时经历了很多非常糟糕的事情，然后在轨迹的后期采取了一个好的动作，你是否有足够的时间来累积这些影响？","start":2095.57,"end":2118.77},{"id":112,"text":"influence those actions have on the future. And you need to learn that from experience. And you need to... If you take a step forward, it means it could, from the algorithm's point of view, actually have caused something bad to happen in the future. And so we can't drop those rewards. So the question was, if you say that you had a lot of really bad stuff at the beginning and then you took a good action later on in the destructory, would you have enough time to accumulate that?","zh":"现在，在你的例子中，你开始看到时间步T等于10。你开始注意到，在时间步6时你做了一件非常好的事情。在时间步6时，这会表现为你将有grad log A6给定S6。然后你将有一个从T prime等于6到10的奖励求和。","start":2119.35,"end":2148.43},{"id":113,"text":"Now, so in your particular example, you started getting kind of capital T was equal to 10. And you started seeing, you did something really good at time step 6. Now, at time step 6, what this will look like is you'll have grad log A6 given S6. And then you'll have a summation from T prime equals 6 to 10 of R.","zh":"现在，在你的例子中，你开始看到时间步T等于10。你开始注意到，在时间步6时你做了一件非常好的事情。在时间步6时，这会表现为你将有grad log A6给定S6。然后你将有一个从T prime等于6到10的奖励求和。","start":2148.78,"end":2177.45},{"id":114,"text":"And so if you did get a high reward from that action immediately or in the next four time steps, then you would actually increase the likelihood on that action. Now, it's really going to depend a lot on the reward function.","zh":"因此，如果你从该动作立即或在接下来的四个时间步中获得了高奖励，那么你实际上会增加该动作的可能性。现在，这在很大程度上取决于奖励函数。","start":2179.65,"end":2192.47},{"id":115,"text":"So you're saying that for fixed horizon problems, the gradient will be different if you're summing over 10 rewards versus over 4 rewards. So one of the things that's important if you have a fixed time horizon T is for this to be a proper state, and actually to be truly Markovian, you need it to contain information about...","zh":"所以你在说，对于固定时间范围的问题，如果你对10个奖励求和，而不是对4个奖励求和，那么梯度将会不同。因此，如果你有一个固定的时间范围T，其中一个重要的是要确保这是一个合适的态，而且实际上要真正是马尔可夫的，它需要包含关于……的信息。","start":2193.36,"end":2218.82}],"notes":["本段讨论了策略梯度方法中因果关系的重要性，即当前策略行为不会影响过去时间步的奖励。这表明在策略梯度中，奖励的计算依赖于未来时间步的累积，而非过去。这种因果关系是策略梯度方法设计的基础。","在具体例子中，当在时间步6采取了一个好的动作，该动作的奖励会通过梯度更新影响该动作的概率。这说明策略梯度方法通过梯度上升来调整策略，使得高奖励的动作更有可能被重复选择。","然而，如果在时间步6采取了一个好的动作，但随后又采取了一个坏的动作，这可能导致整体奖励的下降。因此，策略梯度方法需要考虑动作对未来奖励的长期影响，而不仅仅是即时奖励。","在固定时间范围的问题中，梯度的计算依赖于奖励的总和。例如，如果时间范围是10个时间步，那么梯度的计算会包括这10个时间步的奖励，而如果时间范围是4个时间步，则梯度的计算仅包括这4个时间步的奖励。","为了确保策略梯度方法的有效性，状态必须包含足够的信息以支持马尔可夫性质。这意味着状态需要包含所有必要的信息，以便在给定当前状态时，能够预测未来的奖励。","因此，策略梯度方法需要在设计时考虑时间范围和奖励函数的特性，以确保梯度的计算能够准确反映策略的优化方向。"],"formulas":[],"uncertainties":["capital T was equal to 10"],"diagram":"none","start":2039.34,"end":2218.82,"asr_flags":[],"math_clarifications":["公式中缺少明确的数学运算符，如期望符号或乘法符号，导致表达不完整。此外，未明确说明是期望值还是具体形式，因此无法核定其数学正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2039.34,"text":"It's a little bit hard to write out mathematically why you can do that. I can maybe think about whether there's a nice mathematical expression for that. But it's really just about causality in the world. And so basically, policy behavior at time t is not going to influence rewards at earlier time steps. Cool. I think that this equation, OK, I don't have the typo in this equation. So yeah, we're bringing this summation inside the other one."},{"start":2069.95,"text":"and is only going to be a factor of the future time steps. And this means that for this example right here, we will be kind of decreasing the likelihood of actions at the beginning of the trajectory, and then the future summations will become positive because you took a step forward, and then you'll actually start to be increasing the likelihood of taking a small step forward."},{"start":2095.57,"text":"Yeah, so a very good point is it still doesn't help you if you take a step forward and then you take a step backwards. And the reason why that's actually a little bit difficult to handle is that it's possible that the step forwards actually cause you to fall backwards or cause you to take a step backwards. You don't really know. A big part of reinforcement learning is thinking about what..."},{"start":2119.35,"text":"influence those actions have on the future. And you need to learn that from experience. And you need to... If you take a step forward, it means it could, from the algorithm's point of view, actually have caused something bad to happen in the future. And so we can't drop those rewards. So the question was, if you say that you had a lot of really bad stuff at the beginning and then you took a good action later on in the destructory, would you have enough time to accumulate that?"},{"start":2148.78,"text":"Now, so in your particular example, you started getting kind of capital T was equal to 10. And you started seeing, you did something really good at time step 6. Now, at time step 6, what this will look like is you'll have grad log A6 given S6. And then you'll have a summation from T prime equals 6 to 10 of R."},{"start":2179.65,"text":"And so if you did get a high reward from that action immediately or in the next four time steps, then you would actually increase the likelihood on that action. Now, it's really going to depend a lot on the reward function."},{"start":2193.36,"text":"So you're saying that for fixed horizon problems, the gradient will be different if you're summing over 10 rewards versus over 4 rewards. So one of the things that's important if you have a fixed time horizon T is for this to be a proper state, and actually to be truly Markovian, you need it to contain information about..."}],"speech_gaps":[],"frame":"../frames/v030/013.webp","frame_time":2051.34},{"title":"策略梯度中的状态表示与奖励梯度","segments":[{"id":116,"text":"like the future dynamics. And if it's fixed at 10 and the policy doesn't know if the horizon is about to finish, then it's actually not a truly Markovian state. You need to actually give it information about how many time steps it has left to succeed, and then you can incorporate that into the state. And so you would actually have different states in those different circumstances. Okay.","zh":"比如未来的动态。如果它固定为10，而策略不知道时间步是否即将结束，那么实际上这不是一个真正的马尔可夫状态。你需要给它提供有关它还剩多少时间步才能成功的信息，然后你可以将这些信息纳入状态中。因此，在这些不同情况下，你会有不同状态。好的。","start":2220.24,"end":2244.31},{"id":117,"text":"So now another example for you, and this actually comes back to the question that came up earlier, although it's actually slightly different. So say that the robot, we now have a version that is only depending on future rewards. We have the same version of the problem, but now our policy is a little bit better. One of the trajectories falls forward, one of the trajectories kind of slowly stumbles forward, one of the trajectories steadily walks forward, and one of the trajectories runs forward.","zh":"现在我再给你们一个例子，这实际上回到之前提出的问题，虽然它略有不同。假设机器人，我们现在有一个版本，它只依赖于未来的奖励。我们有相同的问题版本，但现在我们的策略稍微好一些。其中一条轨迹向前跌倒，一条轨迹缓慢地向前蹒跚，一条轨迹稳定地向前行走，还有一条轨迹向前奔跑。","start":2245.24,"end":2272.26},{"id":118,"text":"My question for you is, what will the gradient encourage the policy to do in this case? And we can use this version, the kind of updated version. Yeah, and so I'll encourage you to pair up again and discuss this, and then we'll come back in like two minutes. Okay, let's come back. Please raise your hand if you want to share your answer.","zh":"我的问题是，这种情况下梯度会鼓励策略做些什么？我们可以使用这个更新后的版本。是的，所以我鼓励你们再次分组讨论这个问题，然后我们大约两分钟后回来。好的，我们回来吧。请举手，如果你想分享你的答案。","start":2275.18,"end":2307.01},{"id":119,"text":"Okay. Yeah. So the first answer was that it's going to get highest reward for the stuff that is moving forward at higher velocity. So it's going to encourage it to do that, the highest velocity stuff the most. And you were saying that even if it makes any sort of forward progress, it'll still encourage it to do that.","zh":"好的。是的。第一个答案是，它会为以更高速度向前移动的事物提供最高的奖励。因此，它会鼓励策略做这件事，尤其是对最高速度的部分给予最多鼓励。你们还说，即使它做出任何向前进展，它也会鼓励它这么做。","start":2308.36,"end":2323.7},{"id":120,"text":"Yeah, so another hypothesis was that if we kind of go back to the previous example, it might encourage it to fall forward and then get back up again and then fall forward and get back up again, especially if it's easy to fall forward. Now, getting up again is actually a little bit more challenging, so that might also be a little tricky.","zh":"是的，另一个假设是，如果我们回到之前的例子，它可能会鼓励策略向前跌倒，然后重新站起来，然后再向前跌倒，再重新站起来，特别是如果向前跌倒很容易的话。然而，重新站起来实际上要困难一些，因此这可能也会有点棘手。","start":2324.59,"end":2339.09},{"id":121,"text":"And so the thoughts there was that the fourth one, if the reward is, it might dominate if that one has a much higher reward than the others. If it's, if they're more kind of even in terms of velocity and it's just like move forward, then it won't necessarily dominate and you'll do all four. Yeah, so all of the rewards in these cases will all be positive. And so even, so the kind of, I think what a lot of people are getting at is that the kind of reward of this last one.","zh":"因此，人们认为，如果奖励是，它可能会主导，如果这个奖励比其他奖励高得多的话。如果它们在速度方面比较均衡，只是像向前移动一样，那么它就不会必然主导，你将会执行所有四个动作。是的，所以在这些情况下，所有的奖励都会是正的。因此，我认为很多人想表达的是，最后一个动作的奖励。","start":2340.03,"end":2364.56},{"id":122,"text":"will be the highest and so it will be encouraged to do this but because all of these also like one two and three also have positive rewards the policy is actually also still going to be encouraged to do those things. So because basically the with this term is non-negative when it's positive you're still going to be increasing the likelihood on the actions in these trajectories. Now it won't do it as frequently as running forward but it will still be encouraged to do that.","zh":"将会是最高的，因此会被鼓励去执行这个动作，但由于这些奖励中的一、二、三也有正奖励，策略实际上仍然会被鼓励去执行这些动作。因此，基本上，这个项在非负的情况下，当它是正的时候，你仍然会增加这些轨迹中动作的可能性。它不会像向前移动那样频繁执行，但它仍然会被鼓励去执行这个动作。","start":2365.05,"end":2392.99}],"notes":["本段讨论了策略梯度方法中状态表示的重要性，指出如果状态不包含剩余时间步数的信息，那么状态就不是真正马尔可夫的。因此，需要将剩余时间步数作为状态的一部分，以确保策略能够做出正确的决策。","接着，讲者通过一个机器人运动的例子，说明策略梯度如何鼓励策略选择不同动作。机器人有四种不同的运动轨迹：快速前倾、缓慢前倾、稳定行走和快速奔跑。讲者询问学生，梯度会鼓励策略选择哪种轨迹。","学生们的回答表明，梯度会鼓励策略选择奖励最高的动作，即快速奔跑。但也有观点认为，如果前倾动作的奖励较高，策略可能会反复前倾并尝试恢复，这取决于恢复的难度。","此外，讲者指出，如果四种轨迹的奖励差异不大，那么策略可能会同时鼓励所有动作。但总体而言，奖励最高的动作会受到更多鼓励，而其他动作仍会受到一定程度的鼓励。","最后，讲者强调，梯度项是非负的，因此即使奖励较低，策略仍会增加这些动作的概率，只是频率较低。","这些讨论帮助学生理解策略梯度方法中奖励信号如何影响策略的更新，以及如何在不同奖励分布下策略的行为变化。"],"formulas":[],"uncertainties":["the with this term is non-negative"],"diagram":"none","start":2220.24,"end":2392.99,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2220.24,"text":"like the future dynamics. And if it's fixed at 10 and the policy doesn't know if the horizon is about to finish, then it's actually not a truly Markovian state. You need to actually give it information about how many time steps it has left to succeed, and then you can incorporate that into the state. And so you would actually have different states in those different circumstances. Okay."},{"start":2245.24,"text":"So now another example for you, and this actually comes back to the question that came up earlier, although it's actually slightly different. So say that the robot, we now have a version that is only depending on future rewards. We have the same version of the problem, but now our policy is a little bit better. One of the trajectories falls forward, one of the trajectories kind of slowly stumbles forward, one of the trajectories steadily walks forward, and one of the trajectories runs forward."},{"start":2275.18,"text":"My question for you is, what will the gradient encourage the policy to do in this case? And we can use this version, the kind of updated version. Yeah, and so I'll encourage you to pair up again and discuss this, and then we'll come back in like two minutes. Okay, let's come back. Please raise your hand if you want to share your answer."},{"start":2308.36,"text":"Okay. Yeah. So the first answer was that it's going to get highest reward for the stuff that is moving forward at higher velocity. So it's going to encourage it to do that, the highest velocity stuff the most. And you were saying that even if it makes any sort of forward progress, it'll still encourage it to do that."},{"start":2324.59,"text":"Yeah, so another hypothesis was that if we kind of go back to the previous example, it might encourage it to fall forward and then get back up again and then fall forward and get back up again, especially if it's easy to fall forward. Now, getting up again is actually a little bit more challenging, so that might also be a little tricky."},{"start":2340.03,"text":"And so the thoughts there was that the fourth one, if the reward is, it might dominate if that one has a much higher reward than the others. If it's, if they're more kind of even in terms of velocity and it's just like move forward, then it won't necessarily dominate and you'll do all four. Yeah, so all of the rewards in these cases will all be positive. And so even, so the kind of, I think what a lot of people are getting at is that the kind of reward of this last one."},{"start":2365.05,"text":"will be the highest and so it will be encouraged to do this but because all of these also like one two and three also have positive rewards the policy is actually also still going to be encouraged to do those things. So because basically the with this term is non-negative when it's positive you're still going to be increasing the likelihood on the actions in these trajectories. Now it won't do it as frequently as running forward but it will still be encouraged to do that."}],"speech_gaps":[],"frame":"../frames/v030/014.webp","frame_time":2232.24},{"title":"策略梯度中的梯度噪声与奖励函数缩放","segments":[{"id":123,"text":"And that might be a little bit concerning because sometimes it will actually be encouraging it to stumble forward and ideally we would actually, in this case, want a policy that can actually have the policy run as fast as possible.","zh":"这可能有点令人担忧，因为有时候它实际上是在鼓励机器人向前跌倒，而理想情况下，我们在这个案例中希望有一个策略，能够尽可能快地运行。","start":2393.37,"end":2407.05},{"id":124,"text":"Yeah, so the question was, is this because of local minimum? It seems like with this reward function, the best outcome is to run forward. And so why are we getting this kind of objective? The reason for this is because the gradient is noisy. It kind of comes down to variance.","zh":"是的，问题是，这是否是因为局部极小值？看起来，对于这个奖励函数，最好的结果是向前运行。那么为什么我们会得到这种目标呢？原因在于梯度是嘈杂的。这基本上归结为方差的问题。","start":2407.97,"end":2424.53},{"id":125,"text":"And if you do have a policy that runs forward, it will encourage it to keep on running forward. But when you have other data in there, that kind of that other data will influence it in some ways. And so it won't necessarily converge to a local optimum because at this point it will encourage it to run forward more. And then the next batch of data will run forward more. They'll encourage it to run for even more. So eventually it will converge to the global optimum, but it will get there more slowly because the gradient.","zh":"如果你有一个向前运行的策略，它会鼓励它继续向前运行。但当你有其他数据时，这些数据会在某种程度上影响它。因此，它不一定收敛到局部最优解，因为在这一点上它会鼓励它更进一步地向前运行。然后下一组数据也会鼓励它更进一步地向前运行。它们会鼓励它运行得更多。最终它会收敛到全局最优解，但会更缓慢地到达，因为梯度。","start":2425.17,"end":2454.37},{"id":126,"text":"has a lot of variance depending on the samples that you select. Will this encourage the robot to roll forward? With this data, it will not encourage it to roll forward unless some weird combination of gradients causes that, but generally it will not. If you had data of rolling forward, then it would encourage it to roll forward.","zh":"取决于你选择的样本，梯度会有很大的方差。这会鼓励机器人向前滚动吗？在这些数据下，除非某些奇怪的梯度组合导致这种情况，否则它不会鼓励机器人向前滚动。通常情况下，它不会。如果你有向前滚动的数据，那么它会鼓励机器人向前滚动。","start":2454.99,"end":2476.78},{"id":127,"text":"The question is, can the agent learn from a subset of trajectories instead of the whole trajectory? In this case, it will learn from all future steps in the trajectory. So that is a subset, but it might not be. And I guess in the next lecture, we'll talk about more sophisticated ways to estimate this that are smarter, basically.","zh":"问题是，智能体能否从轨迹的一个子集而不是整个轨迹中学习？在这种情况下，它会从轨迹中的所有未来步骤中学习。因此，这是一个子集，但可能不是。我想在下一节课中，我们会讨论更复杂的方式来估计这个，基本上更聪明的方法。","start":2477.61,"end":2497.63},{"id":128,"text":"Cool. So the thing that we saw here is that things are sensitive to the scaling of the reward function. And on the flip side, if everything was negative, like came up in the question before, we would actually only be getting negative gradients to our policy and no actual positive gradients. And that's actually a big problem with this kind of approach is that it kind of depends on the scale of the reward. And there's actually a very simple thing that we can do to fix this.","zh":"很好。我们在这里看到的是，事情对奖励函数的缩放非常敏感。另一方面，如果所有东西都是负的，就像之前的问题中提到的那样，我们实际上只会得到针对策略的负梯度，而没有任何正梯度。实际上，这种方法的一个大问题是它依赖于奖励的尺度。实际上，我们可以做一件非常简单的事情来解决这个问题。","start":2499.98,"end":2525.32},{"id":129,"text":"And so in particular, what we can do is when we are using this gradient of, which is kind of the expectation of p of tau of, I'll maybe do the kind of the first version just to make it a bit shorter. But we get the gradient of log p of tau times r of tau. And what we can do is instead of having this be r of tau,","zh":"因此，我们可以这样做：当我们使用这个梯度时，它实际上是p(τ)的期望，我可能先做第一种版本，以使内容更简短。但我们得到的是log p(τ)的梯度乘以r(τ)。我们可以做的是，而不是让这个等于r(τ)，","start":2526.07,"end":2554.99}],"notes":["本段讨论了策略梯度方法中梯度噪声对学习过程的影响。讲者指出，梯度的方差较大，这可能导致策略收敛到全局最优解的过程变慢，但最终仍会收敛。同时，讲者提到，如果数据中存在其他信息，这些信息可能会对策略产生影响，从而改变其行为。","讲者进一步指出，梯度噪声的存在使得策略在学习过程中可能不会立即收敛到局部最优解，而是会逐步调整，最终趋向于全局最优解。然而，由于梯度的方差较大，收敛速度会受到影响。","讲者还提到，奖励函数的缩放对策略梯度方法至关重要。如果奖励函数的值全部为负，那么策略将只能获得负梯度，而无法获得正梯度，这会导致学习过程出现问题。","为了解决奖励函数缩放的问题，讲者指出可以采取一个简单的措施，即在计算梯度时对奖励函数进行归一化处理，以确保梯度的稳定性。","讲者提到，梯度的计算涉及对轨迹概率和奖励的期望值，这需要对整个轨迹进行处理。然而，如果只使用轨迹的一部分数据，可能会导致学习效果不佳。","最后，讲者提到在后续课程中会介绍更复杂的估计方法，以提高策略梯度方法的效率和稳定性。"],"formulas":[],"uncertainties":["the kind of the first version just to make it a bit shorter"],"diagram":"none","start":2393.37,"end":2554.99,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2393.37,"text":"And that might be a little bit concerning because sometimes it will actually be encouraging it to stumble forward and ideally we would actually, in this case, want a policy that can actually have the policy run as fast as possible."},{"start":2407.97,"text":"Yeah, so the question was, is this because of local minimum? It seems like with this reward function, the best outcome is to run forward. And so why are we getting this kind of objective? The reason for this is because the gradient is noisy. It kind of comes down to variance."},{"start":2425.17,"text":"And if you do have a policy that runs forward, it will encourage it to keep on running forward. But when you have other data in there, that kind of that other data will influence it in some ways. And so it won't necessarily converge to a local optimum because at this point it will encourage it to run forward more. And then the next batch of data will run forward more. They'll encourage it to run for even more. So eventually it will converge to the global optimum, but it will get there more slowly because the gradient."},{"start":2454.99,"text":"has a lot of variance depending on the samples that you select. Will this encourage the robot to roll forward? With this data, it will not encourage it to roll forward unless some weird combination of gradients causes that, but generally it will not. If you had data of rolling forward, then it would encourage it to roll forward."},{"start":2477.61,"text":"The question is, can the agent learn from a subset of trajectories instead of the whole trajectory? In this case, it will learn from all future steps in the trajectory. So that is a subset, but it might not be. And I guess in the next lecture, we'll talk about more sophisticated ways to estimate this that are smarter, basically."},{"start":2499.98,"text":"Cool. So the thing that we saw here is that things are sensitive to the scaling of the reward function. And on the flip side, if everything was negative, like came up in the question before, we would actually only be getting negative gradients to our policy and no actual positive gradients. And that's actually a big problem with this kind of approach is that it kind of depends on the scale of the reward. And there's actually a very simple thing that we can do to fix this."},{"start":2526.07,"text":"And so in particular, what we can do is when we are using this gradient of, which is kind of the expectation of p of tau of, I'll maybe do the kind of the first version just to make it a bit shorter. But we get the gradient of log p of tau times r of tau. And what we can do is instead of having this be r of tau,"}],"speech_gaps":[],"frame":"../frames/v030/015.webp","frame_time":2405.37},{"title":"策略梯度中的常数项处理","segments":[{"id":130,"text":"we can actually subtract a constant where that constant can be equal to the average reward. And if we subtract the average reward from this, this means that things that are better than average will increase the likelihood, and things that are below average will actually lead us to decrease likelihood. So this will be negative. Now, you might be wondering,","zh":"我们实际上可以减去一个常数，这个常数可以等于平均奖励。如果我们从这个值中减去平均奖励，这意味着比平均奖励更好的情况会增加似然性，而比平均奖励差的情况实际上会导致我们减少似然性，因此这会是负值。现在，你可能会想","start":2555.58,"end":2590.03},{"id":131,"text":"Can we just add this b here? Did I just make that up? Why can we do that? Why are we allowed to do that? We can see what the effect that this has on the gradient. And what we can show is we can actually show that if you subtract a constant in expectation, this has zero effect on the gradient. So this is the gradient.","zh":"我们是否可以直接在这里加上这个 b？我是不是随便编的？为什么我们可以这么做？为什么我们被允许这么做？我们可以看看这个对梯度的影响。并且我们可以证明，如果我们期望值中减去一个常数，这对梯度没有影响。因此这就是梯度。","start":2591.12,"end":2620.98},{"id":132,"text":"of j. And if we look at what effect this has on the gradient and expectation, we can look","zh":"关于 j 的。如果我们看一下这个对梯度和期望值的影响，我们可以看","start":2621.82,"end":2632.22},{"id":133,"text":"at essentially the expectation of grad log p times b. And it's possible to show that","zh":"本质上是梯度 log p 的期望值乘以 b。并且我们可以证明","start":2632.22,"end":2649.76},{"id":134,"text":"this, in expectation, is actually equal to zero. And in particular, if we write this out as the","zh":"这个在期望值下实际上是等于零的。特别是如果我们把它写成梯度，或者抱歉，积分，期望值是 p(τ) 乘以","start":2649.76,"end":2660.44},{"id":135,"text":"gradient of, or sorry, the integral, the expectation is the integral of p of tau times","zh":"梯度 log p(τ) 乘以 b dτ 的积分。","start":2660.44,"end":2668.78},{"id":136,"text":"times grad log p of tau times b d tau.","zh":"然后我们可以使用之前用过的相同技巧，但反过来。","start":2668.78,"end":2676.82},{"id":137,"text":"We can then use the same trick that we used before, but in reverse.","zh":"然后我们可以使用之前用过的相同技巧，但方向相反。","start":2678.5,"end":2684.62},{"id":138,"text":"this is equal to the integral of grad p theta of tau times b d tau. I'm a little","zh":"这等于对路径τ的梯度pθ(τ)乘以b的积分。我有点空间不够，但梯度可以移到积分外面","start":2684.62,"end":2702.12},{"id":139,"text":"bit out of space but the gradient can be moved to the outside of the integral","zh":"因为这是一个线性操作。我们也可以将b移到积分外面，因为它是一个常数。因此，这等于b乘以积分的梯度","start":2702.12,"end":2707.24},{"id":140,"text":"integral because this is a linear operation. We can also move b outside the integral because","zh":"积分因为这是一个线性操作。我们也可以将b移到积分外面，因为它是一个常数。","start":2707.24,"end":2716.32},{"id":141,"text":"it's a constant. And so this is equal to the gradient b times the gradient of the integral","zh":"因此，这等于b乘以积分的梯度","start":2716.32,"end":2733.64}],"notes":["本段讲解了在策略梯度方法中，如何处理常数项对梯度的影响。讲者指出，如果从奖励中减去平均奖励，这不会影响梯度，因为期望下常数项对梯度的贡献为零。","讲者进一步解释了期望梯度的计算过程，指出梯度可以被移出积分，因为梯度运算是线性的，而常数项可以被移出积分。","讲者提到，通过将梯度与积分中的常数项结合，可以简化梯度的计算，从而使得策略梯度方法更加高效。","讲者强调了在策略梯度中，常数项的处理是基于数学推导的，而不是随意添加的，这确保了梯度计算的正确性。","讲者还提到，这种处理方式在强化学习中是常见的，因为它允许我们对奖励进行归一化，从而提高策略优化的稳定性。","最后，讲者指出，这种处理方式在数学上是严谨的，因为它基于期望和积分的线性性质，确保了梯度计算的正确性。"],"formulas":[{"latex":"E[\\nabla \\log p(\\tau) \\cdot b] = 0","symbols":"期望梯度与常数项的乘积为零","explanation":"该公式正确表达了期望梯度与常数项的乘积为零，符合数学推导逻辑。","evidence":"this, in expectation, is actually equal to zero. And in particular, if we write this out as the"}],"uncertainties":[],"diagram":"none","start":2555.58,"end":2733.64,"asr_flags":[141],"math_clarifications":["公式1正确表达了期望梯度与常数项的乘积为零，符合数学推导逻辑。公式2存在数学错误，梯度运算不能直接移出积分，除非积分内部是关于参数的函数，且梯度是关于参数的。此处未明确参数和积分变量，因此无法确定其正确性，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":2555.58,"text":"we can actually subtract a constant where that constant can be equal to the average reward. And if we subtract the average reward from this, this means that things that are better than average will increase the likelihood, and things that are below average will actually lead us to decrease likelihood. So this will be negative. Now, you might be wondering,"},{"start":2591.12,"text":"Can we just add this b here? Did I just make that up? Why can we do that? Why are we allowed to do that? We can see what the effect that this has on the gradient. And what we can show is we can actually show that if you subtract a constant in expectation, this has zero effect on the gradient. So this is the gradient."},{"start":2621.82,"text":"of j. And if we look at what effect this has on the gradient and expectation, we can look"},{"start":2632.22,"text":"at essentially the expectation of grad log p times b. And it's possible to show that"},{"start":2649.76,"text":"this, in expectation, is actually equal to zero. And in particular, if we write this out as the"},{"start":2660.44,"text":"gradient of, or sorry, the integral, the expectation is the integral of p of tau times"},{"start":2668.78,"text":"times grad log p of tau times b d tau."},{"start":2678.5,"text":"We can then use the same trick that we used before, but in reverse."},{"start":2684.62,"text":"this is equal to the integral of grad p theta of tau times b d tau. I'm a little"},{"start":2702.12,"text":"bit out of space but the gradient can be moved to the outside of the integral"},{"start":2707.24,"text":"integral because this is a linear operation. We can also move b outside the integral because"},{"start":2716.32,"text":"it's a constant. And so this is equal to the gradient b times the gradient of the integral"}],"speech_gaps":[],"frame":"../frames/v030/016.webp","frame_time":2567.58},{"title":"策略梯度中的基线（Baseline）","segments":[{"id":142,"text":"integral of p theta of tau d tau. Now this integral is just equal to 1, and the gradient","zh":"对τ的pθ(τ)积分。现在这个积分等于1，而梯度","start":2733.64,"end":2744.52},{"id":143,"text":"gradient of one is zero. So this is one, this is two, and this is one.","zh":"1的梯度是0。所以这是1，这是2，这也是1。","start":2744.52,"end":2751.3},{"id":144,"text":"is 0, and b times 0 is 0. And so this means that the expectation, this is going to have 0 effect on the gradient. And so just to maybe write that out a little bit more cleanly, the expectation of the gradient of log p times b, so basically the effect that this baseline is having on this gradient, we can write that out as the integral.","zh":"是0，b乘以0也是0。因此，这个期望对梯度没有影响。为了更清晰地写出这一点，梯度的期望值为log p乘以b，也就是说，这个基线对梯度的影响可以写成积分形式。","start":2752.7,"end":2780.78},{"id":145,"text":"We can then use the log trick and reverse. We can move b and the gradient outside of the integral. This integral is equal to 1, the gradient of 1 is 0, and then we get 0. So this means that we can add this baseline. Yeah, so the reason why this constant term, the question was like, this constant term wouldn't be helpful if...","zh":"然后我们可以使用对数技巧并反转。我们可以将b和梯度移出积分。这个积分等于1，1的梯度是0，因此结果为0。这意味着我们可以添加这个基线。是的，之所以这个常数项，问题是，如果我们可以真正计算这个期望值，那么这个常数项就没有帮助。","start":2781.85,"end":2802.96},{"id":146,"text":"we could actually truly evaluate the expectation. And yeah, that's correct. So if we had this expectation and could measure this exactly, then we wouldn't need this. The reason why this is helpful is because we have this expectation. And this basically, you can think of it as reducing, it's a way to reduce the variance of your estimate of this expectation. And it's an unbiased way to do that. So in particular, as long as the baseline is a constant,","zh":"是的，这是正确的。如果我们有这个期望值并且可以精确测量它，那么我们就不需要这个。之所以这个是有帮助的，是因为我们有这个期望值。基本上，你可以把它看作是减少你对这个期望值的估计的方差的一种方法，并且这是一种无偏的方法。特别是，只要基线是一个常数，","start":2803.25,"end":2829.69},{"id":147,"text":"then it won't change the behavior of the gradient expectation. This means that it's unbiased. This is a term from statistics talking about effect on random variables. And you can show that it reduces the variance of your estimate of the gradient. So the question is, is B really a constant and seems to depend on the trajectories? We'll use the same value of B for an entire batch for all of the examples. And so we'll collect a batch of data.","zh":"它就不会改变梯度期望值的行为。这意味着它是无偏的。这是统计学中的一个术语，指的是对随机变量的影响。你可以证明它会减少你对梯度估计的方差。问题是，B真的只是一个常数吗？它似乎依赖于轨迹。我们会为整个批次的所有示例使用相同的B值。因此，我们会收集一批数据。","start":2831.69,"end":2860.1},{"id":148,"text":"then we will compute B, and we'll use B for all of the updates on that batch of data. Yeah, so how does it reduce the variance of the gradient? You can write down... So this is kind of the expectation of the gradient. You can write down the variance analytically and show that it reduces the variance.","zh":"然后我们会计算B，并且在该批次数据的所有更新中使用B。是的，它是如何减少梯度的方差的？你可以写下……所以这是梯度的期望值。你可以写出方差的解析表达式，并展示它如何减少方差。","start":2860.68,"end":2881.54},{"id":149,"text":"I don't want to go through the math because we have some other stuff to get through, but kind of intuitively you can think about it in terms of this example of it will encourage it to do more of the good stuff, more of the above average stuff and less of the below average stuff. I can also mention that average reward is actually not the optimal baseline. You can actually...","zh":"我不想去处理那些数学推导，因为我们还有其他内容要讲，但直觉上你可以这样想，这个例子会鼓励它多做一些好的事情，多做一些高于平均水平的事情，而少做一些低于平均水平的事情。我也可以提到，平均奖励实际上并不是最优的基线。你实际上可以...","start":2883.37,"end":2906.65}],"notes":["本段讲解了策略梯度中基线（Baseline）的作用，即通过引入一个常数项来减少梯度估计的方差，同时保持无偏性。基线的引入不会改变梯度期望的行为，因此不会影响梯度的无偏性。基线可以是常数，也可以依赖于轨迹，但通常在一批数据中使用相同的基线值。","基线的引入是通过将基线和梯度移出积分，从而使得积分结果为零，因此不会影响梯度的计算。这种做法在统计学中被称为无偏估计，因为它不会改变梯度的期望值。","基线的使用可以减少梯度估计的方差，但需要确保基线是常数或与轨迹无关。如果基线依赖于轨迹，那么它可能会影响梯度的计算，但通常在一批数据中使用相同的基线值。","平均奖励并不是最优的基线，因为基线的选择会影响梯度估计的方差。因此，选择合适的基线是策略梯度方法中的一个重要问题。","基线的引入是策略梯度方法中减少方差的一种技术，它通过调整梯度估计的计算方式，使得估计更加稳定。这种技术在强化学习中被广泛使用。","在实际应用中，基线的选择需要根据具体问题进行调整，以达到最佳的方差减少效果。同时，基线的计算需要考虑数据的分布和梯度的特性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2733.64,"end":2906.65,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2733.64,"text":"integral of p theta of tau d tau. Now this integral is just equal to 1, and the gradient"},{"start":2744.52,"text":"gradient of one is zero. So this is one, this is two, and this is one."},{"start":2752.7,"text":"is 0, and b times 0 is 0. And so this means that the expectation, this is going to have 0 effect on the gradient. And so just to maybe write that out a little bit more cleanly, the expectation of the gradient of log p times b, so basically the effect that this baseline is having on this gradient, we can write that out as the integral."},{"start":2781.85,"text":"We can then use the log trick and reverse. We can move b and the gradient outside of the integral. This integral is equal to 1, the gradient of 1 is 0, and then we get 0. So this means that we can add this baseline. Yeah, so the reason why this constant term, the question was like, this constant term wouldn't be helpful if..."},{"start":2803.25,"text":"we could actually truly evaluate the expectation. And yeah, that's correct. So if we had this expectation and could measure this exactly, then we wouldn't need this. The reason why this is helpful is because we have this expectation. And this basically, you can think of it as reducing, it's a way to reduce the variance of your estimate of this expectation. And it's an unbiased way to do that. So in particular, as long as the baseline is a constant,"},{"start":2831.69,"text":"then it won't change the behavior of the gradient expectation. This means that it's unbiased. This is a term from statistics talking about effect on random variables. And you can show that it reduces the variance of your estimate of the gradient. So the question is, is B really a constant and seems to depend on the trajectories? We'll use the same value of B for an entire batch for all of the examples. And so we'll collect a batch of data."},{"start":2860.68,"text":"then we will compute B, and we'll use B for all of the updates on that batch of data. Yeah, so how does it reduce the variance of the gradient? You can write down... So this is kind of the expectation of the gradient. You can write down the variance analytically and show that it reduces the variance."},{"start":2883.37,"text":"I don't want to go through the math because we have some other stuff to get through, but kind of intuitively you can think about it in terms of this example of it will encourage it to do more of the good stuff, more of the above average stuff and less of the below average stuff. I can also mention that average reward is actually not the optimal baseline. You can actually..."}],"speech_gaps":[],"frame":"../frames/v030/017.webp","frame_time":2745.64},{"title":"策略梯度中的基线与梯度计算","segments":[{"id":150,"text":"derive the variance, and then take the derivative of the variance set equal to zero to find the optimal baseline. But average reward is pretty good. The optimal baseline is something like, it's very close to average reward, but there's some additional weighting terms. Cool. So we have one more episode of what does the gradient do.","zh":"推导方差，然后将方差设为零求导以找到最优基线。但平均奖励效果已经很好了。最优基线大致上接近平均奖励，但还有一些额外的加权项。不错。所以我们又有了一个关于梯度会做什么的示例。","start":2907.55,"end":2931.13},{"id":151,"text":"And we're going to look at a different example. In this case, the robot is folding a jacket. And the reward is 1 if it's neatly folded, 0.5 if it's folded with some wrinkles, and 0 if it's not folded. We're going to again sample from our policy. We have some samples of not touching the jacket, folding only the sleeves but not folding the full thing, flattening the jacket but not folding it, and one trajectory where it does fold the jacket.","zh":"我们将看一下一个不同的例子。在这种情况下，机器人正在折叠一件外套。奖励为：如果折叠整齐则为1，有褶皱则为0.5，未折叠则为0。我们将再次从策略中进行采样。我们有一些样本，包括不触碰外套、只折叠袖子但未折叠整个外套、压平外套但未折叠，以及一条成功折叠外套的轨迹。","start":2932.55,"end":2959.23},{"id":152,"text":"And my question is, with the baseline in here this time, what does the gradient look like? The rewards for 1, 2, and 3 will be 0, and the reward for 4 will be positive. And so this means that because of our baseline, the gradient for 4 will be positive and will encourage this behavior, and then will discourage all the behavior for 1, 2, and 3.","zh":"我的问题是，这次有了基线，梯度会是什么样子？1、2、3的奖励都是0，而4的奖励是正的。这意味着，由于我们的基线，4的梯度会是正的，并会鼓励这种行为，同时会抑制1、2、3的行为。","start":2960.06,"end":2982.44},{"id":153,"text":"Now, in some ways, this is good because it means that we are encouraging the good behavior. But there are also some things that are a little bit dissatisfying about this. The first is that the gradient for 1, 2, and 3 is going to be identical for all of them. There isn't any differentiation between them. And some of these are actually better than others. This is kind of, in some ways, a result of the reward function that we're using, which is more sparse than it could be.","zh":"在某些方面，这是好的，因为它意味着我们鼓励了良好的行为。但还有一些事情让人不太满意。第一，1、2、3的梯度对于所有情况都是一样的，它们之间没有区分。而其中一些情况实际上比其他情况更好。这在某种程度上是由于我们使用的奖励函数，它比可能的更加稀疏。","start":2982.93,"end":3010.51},{"id":154,"text":"And the other thing is that we'll actually see some techniques in Friday's lecture that would actually be able to leverage some of the good parts of these trajectories, because there is a good thing about folding the sleeves, and it would be nice to be able to use that data to encourage the policy. And right now, it will actually be discouraged and have negative gradients for this trajectory. So in some ways, this is good. So it will encourage folding, but the gradient is constant for trajectories one, two, and three.","zh":"另一个问题是，我们将在周五的课程中看到一些技术，这些技术实际上能够利用这些轨迹中的一些优点，因为折叠袖子是有好处的，能够利用这些数据来鼓励策略会很好。而目前，这条轨迹会被抑制，并且会有负梯度。所以在某种程度上，这是好的，它会鼓励折叠，但轨迹1、2、3的梯度是恒定的。","start":3010.94,"end":3037.66},{"id":155,"text":"We will, on Friday, we'll see ways to make this a little bit better. And kind of one of the takeaways here is that policy gradient is still noisy and is still high variance. And it really is going to work best if you have dense rewards rather than rewards that are sparse. And it'll work best if you have large batches of data, because if you didn't actually sample this fourth trajectory and you only sampled failures, then you would have zero gradient and you wouldn't actually be able to improve.","zh":"我们将在周五看到一些方法，使这一过程有所改进。这里的一个大致结论是，策略梯度仍然存在噪声，并且方差仍然很高。它在密集奖励的情况下效果最好，而不是稀疏奖励。它在拥有大量数据批次的情况下效果最好，因为如果你没有实际采样第四条轨迹，而只采样了失败的情况，那么你将得到零梯度，实际上无法进行改进。","start":3039.24,"end":3067.7},{"id":156,"text":"So the question was, can we just improve the reward function? Yes. So if we had a more dense reward function, that would definitely help in these cases. There are actually scenarios still where that...","zh":"问题是，我们能否仅仅改进奖励函数？是的。如果我们有一个更密集的奖励函数，这在这些情况下肯定会有所帮助。实际上，仍然存在一些场景，","start":3068.68,"end":3082.9}],"notes":["本段讨论了策略梯度方法中基线的作用，以及基线如何影响梯度的计算。在机器人折叠外套的例子中，基线被用来调整梯度，使得只有成功折叠的轨迹（第4条）会获得正梯度，而其他失败的轨迹（第1、2、3条）会获得负梯度。这表明基线有助于区分不同轨迹的贡献。","然而，梯度计算中存在一个问题，即对于第1、2、3条轨迹的梯度是相同的，这导致无法区分这些轨迹之间的差异。这可能是因为奖励函数过于稀疏，无法提供足够的信息来区分不同行为的优劣。","课堂中提到，未来的课程（周五）将介绍一些技术，这些技术可以利用轨迹中的有用信息，例如折叠袖子的行为，从而鼓励策略。当前的梯度计算方式会抑制这些有用的行为，导致负梯度。","此外，策略梯度方法存在高方差和噪声的问题，因此需要密集的奖励函数和大量的数据样本。如果只采样失败的轨迹，可能会导致梯度为零，无法进行有效的策略更新。","课堂最后提到，可以通过改进奖励函数来缓解这些问题，例如使用更密集的奖励函数，以提供更丰富的反馈信息，从而提高策略梯度方法的效果。","这些讨论强调了策略梯度方法在实际应用中的局限性，以及如何通过改进奖励函数和采样策略来优化其性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2907.55,"end":3082.9,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2907.55,"text":"derive the variance, and then take the derivative of the variance set equal to zero to find the optimal baseline. But average reward is pretty good. The optimal baseline is something like, it's very close to average reward, but there's some additional weighting terms. Cool. So we have one more episode of what does the gradient do."},{"start":2932.55,"text":"And we're going to look at a different example. In this case, the robot is folding a jacket. And the reward is 1 if it's neatly folded, 0.5 if it's folded with some wrinkles, and 0 if it's not folded. We're going to again sample from our policy. We have some samples of not touching the jacket, folding only the sleeves but not folding the full thing, flattening the jacket but not folding it, and one trajectory where it does fold the jacket."},{"start":2960.06,"text":"And my question is, with the baseline in here this time, what does the gradient look like? The rewards for 1, 2, and 3 will be 0, and the reward for 4 will be positive. And so this means that because of our baseline, the gradient for 4 will be positive and will encourage this behavior, and then will discourage all the behavior for 1, 2, and 3."},{"start":2982.93,"text":"Now, in some ways, this is good because it means that we are encouraging the good behavior. But there are also some things that are a little bit dissatisfying about this. The first is that the gradient for 1, 2, and 3 is going to be identical for all of them. There isn't any differentiation between them. And some of these are actually better than others. This is kind of, in some ways, a result of the reward function that we're using, which is more sparse than it could be."},{"start":3010.94,"text":"And the other thing is that we'll actually see some techniques in Friday's lecture that would actually be able to leverage some of the good parts of these trajectories, because there is a good thing about folding the sleeves, and it would be nice to be able to use that data to encourage the policy. And right now, it will actually be discouraged and have negative gradients for this trajectory. So in some ways, this is good. So it will encourage folding, but the gradient is constant for trajectories one, two, and three."},{"start":3039.24,"text":"We will, on Friday, we'll see ways to make this a little bit better. And kind of one of the takeaways here is that policy gradient is still noisy and is still high variance. And it really is going to work best if you have dense rewards rather than rewards that are sparse. And it'll work best if you have large batches of data, because if you didn't actually sample this fourth trajectory and you only sampled failures, then you would have zero gradient and you wouldn't actually be able to improve."},{"start":3068.68,"text":"So the question was, can we just improve the reward function? Yes. So if we had a more dense reward function, that would definitely help in these cases. There are actually scenarios still where that..."}],"speech_gaps":[],"frame":"../frames/v030/018.webp","frame_time":2919.55},{"title":"策略梯度中的基线与实现","segments":[{"id":157,"text":"we could do better. So especially if you, for example, folded the sleeves, got positive reward for this and then dropped it on the ground or something after that, then that's still dissatisfying because we wouldn't use the first part successfully. And we'll actually see how to do that, how to get good gradient for that first part on Friday. But yeah, if you had a more dense reward function for this particular set of directories, that would work a lot better.","zh":"我们可以做得更好。例如，如果你把袖子折起来，为此获得了正奖励，然后之后把它扔在地上或者其他什么操作，这仍然令人不满意，因为我们不会成功地利用第一部分。我们实际上会在星期五看到如何做到这一点，如何为第一部分获得良好的梯度。但没错，如果你为这个特定的目录集使用更密集的奖励函数，效果会好得多。","start":3084.38,"end":3107.24},{"id":158,"text":"Oh, so the question here is, when we do the baseline, are we also using this trick to only use future rewards? You can combine them. You need to be a little bit, you need to think a little bit, potentially more carefully about what the baseline will be, because some of the rewards, you'll be summing over fewer things or more things depending on where you are in the trajectory, but you can definitely combine them.","zh":"哦，这里的问题是，当我们进行基线计算时，我们是否也在使用这个技巧，只使用未来的奖励？你可以将它们结合起来。你需要稍微仔细一些地考虑基线会是什么，因为根据你在轨迹中的位置，有些奖励你会对更少或更多的事物进行求和，但你完全可以将它们结合起来。","start":3108.15,"end":3131.37},{"id":159,"text":"Yeah, so the question was, if we're using average reward as the baseline,","zh":"是的，问题是，如果我们使用平均奖励作为基线，","start":3132.19,"end":3135.17},{"id":160,"text":"Do you need to use data from the policy?","zh":"是否需要使用策略的数据？","start":3135.71,"end":3137.33},{"id":161,"text":"Do you need to use data from the policy?","zh":"是否需要使用策略的数据？","start":3137.45,"end":3138.87},{"id":162,"text":"So yes, you'll want to keep on updating it because as the policy gets better,","zh":"是的，你希望继续更新它，因为随着策略变得更好，","start":3139.83,"end":3143.05},{"id":163,"text":"what's above average and below average will change,","zh":"高于平均和低于平均的部分会发生变化，","start":3143.81,"end":3146.13},{"id":164,"text":"and you'll want to recompute it on your latest batch of data.","zh":"你希望在你最新的数据批次上重新计算它。","start":3146.31,"end":3150.39},{"id":165,"text":"Cool.","zh":"不错。","start":3153.65,"end":3154.05},{"id":166,"text":"So one more thing on this version of the algorithm,","zh":"关于这个算法版本，我再补充一点，","start":3155.07,"end":3157.55},{"id":167,"text":"and then we'll move on to one last version.","zh":"然后我们再转向最后一个版本。","start":3157.61,"end":3159.77},{"id":168,"text":"In terms of how to implement it, we talked about we kind of derived a gradient like this.","zh":"在实现方面，我们讨论了如何推导出这样的梯度。","start":3159.77,"end":3166.11},{"id":169,"text":"And to actually implement this in practice, you could, in principle, actually just run","zh":"在实际实现中，原则上你可以直接对所有这些不同项进行反向传播。","start":3167.15,"end":3173.41},{"id":170,"text":"a backward pass for all of these different terms.","zh":"但如果单独计算所有这些项，","start":3173.41,"end":3175.43},{"id":171,"text":"But if you computed all these individually, then you'd have to do n times t backward passes,","zh":"你就需要进行 n 次 t 次反向传播，","start":3176.35,"end":3181.21},{"id":172,"text":"and this would be rather inefficient.","zh":"这将非常低效。","start":3181.41,"end":3182.91},{"id":173,"text":"efficient. And it'd be nice if we could just actually do automatic differentiation on the","zh":"高效。如果我们能够直接对整个目标函数进行自动微分那就更好了，只需进行一次前向传播和一次反向传播。我们确实可以做到这一点。","start":3182.91,"end":3189.41},{"id":174,"text":"full objective and only do one forward pass and one backward pass. And we can do that.","zh":"因此，实际上可以实现一个代理目标函数，其梯度与该目标函数相同。我称之为代理目标函数，因为它与最初最大化预期奖励的目标函数不同。","start":3189.41,"end":3195.63},{"id":175,"text":"So it's possible to implement essentially a surrogate objective whose gradient is the","zh":"但对于这个特定的例子，你可以写出一个代理目标函数，这就是代理目标函数的表达式。请注意，我在这些方程中确实有一个拼写错误，其中第二个求和符号应该位于第一个求和符号内部。","start":3195.79,"end":3200.37},{"id":176,"text":"same as this objective. I'm calling it surrogate because it's not the same as the very first","zh":"这可能是一个小的注释。我会看看是否可以修复这个错误。但总之，你可以实现一个代理目标函数。","start":3200.37,"end":3206.29},{"id":177,"text":"objective of maximizing expected rewards. But you can write down a surrogate objective","zh":"最大化预期奖励的目标。但你可以写出一个替代目标","start":3206.29,"end":3211.67},{"id":178,"text":"for this particular example, this is what the surrogate objective looks like. Note that I","zh":"对于这个特定的例子，这就是替代目标的样子。请注意，我在这些方程中实际上有一个拼写错误，其中第二个求和符号应该位于第一个求和符号内部。","start":3211.67,"end":3216.23},{"id":179,"text":"actually do have a typo on these equations where this second sum should be inside the first sum.","zh":"那可能是一个小的注释。我会看看是否可以修复这个错误。但总之，你可以实现一个替代","start":3216.23,"end":3222.47},{"id":180,"text":"That's maybe a small note. I'll see if I can fix that. But yeah, you can implement a surrogate","zh":"目标","start":3222.63,"end":3228.07},{"id":181,"text":"So it's possible to implement essentially a surrogate objective whose gradient is the","zh":"因此，可以实现一个本质上是替代目标函数，其梯度为","start":3228.07,"end":3233.95}],"notes":["本段讨论了在策略梯度方法中使用基线时，是否仅使用未来奖励的问题。讲者指出，基线可以结合不同时间点的奖励，但需要仔细考虑基线的定义，因为不同轨迹位置的奖励数量可能不同。同时，讲者提到，如果使用平均奖励作为基线，需要持续更新基线，因为随着策略的改进，高于或低于平均的奖励会变化，因此需要在最新的数据批次上重新计算基线。","讲者进一步说明，当实现策略梯度算法时，虽然理论上可以对每个项进行反向传播，但这样会非常低效。因此，更高效的方法是使用自动微分技术，对整个目标函数进行一次前向和反向传播。这种方法可以实现一个代理目标函数，其梯度与原始目标函数相同，但不等同于最初的期望奖励最大化目标。","讲者提到，代理目标函数的实现需要特别注意公式中的错误，例如第二个求和项应位于第一个求和项内部。这一错误可能影响公式的正确性，因此需要修正。此外，讲者强调，使用代理目标函数可以简化实现过程，只需进行一次反向传播即可。","在实现策略梯度时，讲者指出，虽然可以对每个项进行反向传播，但这样会非常低效。因此，更高效的方法是使用自动微分技术，对整个目标函数进行一次前向和反向传播。这种方法可以实现一个代理目标函数，其梯度与原始目标函数相同，但不等同于最初的期望奖励最大化目标。","讲者提到，代理目标函数的实现需要特别注意公式中的错误，例如第二个求和项应位于第一个求和项内部。这一错误可能影响公式的正确性，因此需要修正。此外，讲者强调，使用代理目标函数可以简化实现过程，只需进行一次反向传播即可。","讲者最后指出，虽然代理目标函数的公式中存在一个拼写错误，但可以通过修正来确保其正确性。这一错误可能影响公式的正确性，因此需要修正。此外，讲者强调，使用代理目标函数可以简化实现过程，只需进行一次反向传播即可。"],"formulas":[],"uncertainties":["the second sum should be inside the first sum"],"diagram":"none","start":3084.38,"end":3233.95,"asr_flags":[],"math_clarifications":["原文未提及该公式，无法核定其数学恒等关系，因此移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":3084.38,"text":"we could do better. So especially if you, for example, folded the sleeves, got positive reward for this and then dropped it on the ground or something after that, then that's still dissatisfying because we wouldn't use the first part successfully. And we'll actually see how to do that, how to get good gradient for that first part on Friday. But yeah, if you had a more dense reward function for this particular set of directories, that would work a lot better."},{"start":3108.15,"text":"Oh, so the question here is, when we do the baseline, are we also using this trick to only use future rewards? You can combine them. You need to be a little bit, you need to think a little bit, potentially more carefully about what the baseline will be, because some of the rewards, you'll be summing over fewer things or more things depending on where you are in the trajectory, but you can definitely combine them."},{"start":3132.19,"text":"Yeah, so the question was, if we're using average reward as the baseline,"},{"start":3135.71,"text":"do we need to keep updating the term?"},{"start":3137.45,"text":"Do you need to use data from the policy?"},{"start":3139.83,"text":"So yes, you'll want to keep on updating it because as the policy gets better,"},{"start":3143.81,"text":"what's above average and below average will change,"},{"start":3146.31,"text":"and you'll want to recompute it on your latest batch of data."},{"start":3153.65,"text":"Cool."},{"start":3155.07,"text":"So one more thing on this version of the algorithm,"},{"start":3157.61,"text":"and then we'll move on to one last version."},{"start":3159.77,"text":"In terms of how to implement it, we talked about we kind of derived a gradient like this."},{"start":3167.15,"text":"And to actually implement this in practice, you could, in principle, actually just run"},{"start":3173.41,"text":"a backward pass for all of these different terms."},{"start":3176.35,"text":"But if you computed all these individually, then you'd have to do n times t backward passes,"},{"start":3181.41,"text":"and this would be rather inefficient."},{"start":3182.91,"text":"efficient. And it'd be nice if we could just actually do automatic differentiation on the"},{"start":3189.41,"text":"full objective and only do one forward pass and one backward pass. And we can do that."},{"start":3195.79,"text":"So it's possible to implement essentially a surrogate objective whose gradient is the"},{"start":3200.37,"text":"same as this objective. I'm calling it surrogate because it's not the same as the very first"},{"start":3206.29,"text":"objective of maximizing expected rewards. But you can write down a surrogate objective"},{"start":3211.67,"text":"for this particular example, this is what the surrogate objective looks like. Note that I"},{"start":3216.23,"text":"actually do have a typo on these equations where this second sum should be inside the first sum."},{"start":3222.63,"text":"That's maybe a small note. I'll see if I can fix that. But yeah, you can implement a surrogate"},{"start":3228.07,"text":"objective and then use backprop and autodiff software to just do one backward pass."}],"speech_gaps":[],"frame":"../frames/v030/019.webp","frame_time":3096.38},{"title":"策略梯度方法的挑战与改进","segments":[{"id":182,"text":"Okay, and what this actually looks like in practice is this would actually look like a cross-entropy loss for a discrete action policy or something like squared error for a Gaussian policy. You could also use more sophisticated policies like diffusion or something like that as well. Okay, so summary so far. We showed how to estimate the gradient of the RL objective using this log gradient trick. This corresponds to weighing the policy likelihood by future rewards.","zh":"好的，实际上在实践中，这看起来像是一个离散动作策略的交叉熵损失，或者像高斯策略的平方误差。你也可以使用更复杂的策略，比如扩散模型之类的。好的，到目前为止的总结。我们展示了如何使用这个对数梯度技巧来估计强化学习目标的梯度。这相当于通过未来的奖励来加权策略似然。","start":3236.88,"end":3265.67},{"id":183,"text":"And we found that subtracting a baseline like average reward will also further improve the gradient. Even with these two things, the gradient is still noisy. And so it's best with large batches and dense rewards. This is also our first online reinforcement learning algorithm where we iterate between collecting a batch of data with our policy and improve our policy. And it kind of formalizes this trial and error learning process.","zh":"我们还发现，减去一个基线（如平均奖励）也会进一步改善梯度。即使有了这两个因素，梯度仍然很嘈杂。因此，最好使用大批次和密集奖励。这也是我们第一个在线强化学习算法，其中我们交替地使用我们的策略收集一批数据并改进我们的策略。它在某种程度上形式化了这种试错学习过程。","start":3266.38,"end":3293.4},{"id":184,"text":"And we change theta in step three. And this means that every single time we take a single gradient step, we need to recollect data to estimate our gradient. And this is kind of sad because usually we do like thousands and thousands of gradient steps on neural networks. And so, yeah, that seems like a problem.","zh":"我们在第三步中改变θ。这意味着每次我们进行一次梯度更新时，都需要重新收集数据来估计梯度。这有点令人沮丧，因为通常我们在神经网络上进行成千上万次的梯度步骤。因此，这似乎是一个问题。","start":3294.7,"end":3324.37},{"id":185,"text":"And what this is called is it's called on-policy. It means that the gradient that we are measuring requires data using our exact policy. And we can think about this as an attribute of an online URL algorithm, where on-policy only uses data from the current policy, and off-policy means that you can reuse data from other past policies.","zh":"这种算法被称为在策略（on-policy）。这意味着我们所测量的梯度需要使用我们当前的精确策略来生成数据。我们可以将这视为在线强化学习算法的一个属性，其中在策略仅使用当前策略的数据，而离策略（off-policy）意味着你可以重用其他过去策略的数据。","start":3325.71,"end":3351.14},{"id":186,"text":"So can we derive an off policy version of the policy gradient? And it's only going to be a little off policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data. And to do this, we can use important sampling. And important sampling is actually a really cool technique that's useful outside of reinforcement learning as well. And it's kind of thinking about this.","zh":"那么，我们能否推导出一个离策略版本的策略梯度？它只会稍微偏离在策略。我的意思是，我们只是试图在一个数据批次上进行多次梯度步骤。为了做到这一点，我们可以使用重要性采样。重要性采样实际上是一种非常酷的技术，它在强化学习之外也有用。它有点像这样思考。","start":3352.58,"end":3374.9},{"id":187,"text":"So can we derive an off policy version of the policy gradient? And it's only going to be a little off policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data. And to do this, we can use important sampling. And important sampling is actually a really cool technique that's useful outside of reinforcement learning as well. And it's kind of thinking about this.","zh":"那么我们能否推导出一种离策略的策略梯度方法？而且它只会稍微离策略一些。我的意思是，我们只是想在单一批次的数据上进行多次梯度更新。为了做到这一点，我们可以使用重要性采样。重要性采样实际上是一种非常酷的技术，它在强化学习之外的其他领域也很有用。这有点像这样思考。","start":3377.85,"end":3403.28}],"notes":["本段讨论了策略梯度方法的一个关键问题，即在线策略（on-policy）的局限性。在线策略要求每次梯度更新都需要重新收集数据，这在神经网络训练中通常需要大量梯度步骤，因此效率较低。"],"formulas":[],"uncertainties":["URL algorithm"],"diagram":"none","start":3236.88,"end":3403.28,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3236.88,"text":"Okay, and what this actually looks like in practice is this would actually look like a cross-entropy loss for a discrete action policy or something like squared error for a Gaussian policy. You could also use more sophisticated policies like diffusion or something like that as well. Okay, so summary so far. We showed how to estimate the gradient of the RL objective using this log gradient trick. This corresponds to weighing the policy likelihood by future rewards."},{"start":3266.38,"text":"And we found that subtracting a baseline like average reward will also further improve the gradient. Even with these two things, the gradient is still noisy. And so it's best with large batches and dense rewards. This is also our first online reinforcement learning algorithm where we iterate between collecting a batch of data with our policy and improve our policy. And it kind of formalizes this trial and error learning process."},{"start":3294.7,"text":"And the intuition for everything we've done so far is do more of the high-reward stuff and less of the low-reward stuff. Now the last thing we'll talk about today is what else is troublesome about policy gradients. And one thing that we haven't really talked about that much is the details of the sampling process. And this is what our gradient and our algorithm looks like. And note that in this gradient, this assumes that we're sampling from pi theta."},{"start":3325.71,"text":"And we change theta in step three. And this means that every single time we take a single gradient step, we need to recollect data to estimate our gradient. And this is kind of sad because usually we do like thousands and thousands of gradient steps on neural networks. And so, yeah, that seems like a problem."},{"start":3352.58,"text":"And what this is called is it's called on-policy. It means that the gradient that we are measuring requires data using our exact policy. And we can think about this as an attribute of an online URL algorithm, where on-policy only uses data from the current policy, and off-policy means that you can reuse data from other past policies."},{"start":3377.85,"text":"So can we derive an off policy version of the policy gradient? And it's only going to be a little off policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data. And to do this, we can use important sampling. And important sampling is actually a really cool technique that's useful outside of reinforcement learning as well. And it's kind of thinking about this."}],"speech_gaps":[],"frame":"../frames/v030/020.webp","frame_time":3248.88},{"title":"利用重要性采样估计期望","segments":[{"id":188,"text":"this scenario where you want to estimate a quantity, an expectation, without actually sampling from that distribution. So say you have some expectation using samples from p and you want to estimate some function f using those samples. But say that you only have access to the ability to sample from q . So this is usually called your","zh":"在这种情况下，你想要估计一个量，即期望值，而无需实际从该分布中进行抽样。例如，你有一些使用p分布样本的期望值，并且想要使用这些样本估计某个函数f。但假设你只能从q分布中进行抽样。这种情况通常被称为你的","start":3404.54,"end":3434.08},{"id":189,"text":"proposal distribution that's able to kind of propose samples to use. This is like your old policy. We have samples from our old policy, but we want to be able to estimate a function of samples of our new policy after we've taken a gradient step. So what you can do in this case, if you write down this expectation as an integral, it looks something like this. And","zh":"提议分布，它能够提出用于抽样的样本。这类似于你的旧策略。我们有来自旧策略的样本，但想要能够估计新策略样本的函数值。在这种情况下，如果你将这个期望值写成积分形式，它看起来像这样。并且","start":3434.52,"end":3460.96},{"id":190,"text":"As long as Q of X has reasonable support, we can write this as, we can kind of add in this term that equals one into our equation. And then we can now actually write this as an expectation with respect to Q. So this is equal to an expectation with respect to Q of","zh":"只要Q(X)具有合理的支撑集，我们可以将这个项等于1添加到方程中。然后我们现在可以将这个表达式写成关于Q的期望值。因此，这等于关于Q的期望值","start":3462.28,"end":3494.61},{"id":191,"text":"p of x divided by q of x times f of x. And so this means that we can actually estimate, we can get this expectation by sampling from q and then weighting the quantity by p over q. So that's pretty cool. This means that we can use principal samples from our old policy, q,","zh":"p(x)除以q(x)乘以f(x)。因此，这意味着我们实际上可以通过从q分布中抽样，并将该量乘以p/q的权重来估计这个期望值。这很酷。这意味着我们可以使用旧策略的样本，","start":3496.78,"end":3525.88},{"id":192,"text":"weight them by the probability of the sample under our new policy divided by the probability under the old policy times the quantity. So we showed this for kind of this simple case of P and Q . In terms of actually applying this to our policy, we can take our expected rewards with regard to P . If we instead have some previous policy that we've collected samples from, we can then","zh":"将它们乘以样本在新策略下的概率除以样本在旧策略下的概率乘以该量。我们已经展示了这种P和Q的简单情况。在实际将此应用于策略时，我们可以计算关于P的预期奖励。如果我们有之前收集样本的策略，那么我们可以","start":3526.76,"end":3557.05}],"notes":["本段讲解了重要性采样的基本思想，即在无法直接从目标分布p中采样时，利用一个可以采样的提议分布q来估计期望值。通过引入重要性权重p(x)/q(x)，可以将期望值转换为对q的期望，从而利用已有的q样本进行估计。","讲者提到，当q的支撑集合理时，可以将期望值写成对q的期望形式，即E_q[p(x)/q(x) * f(x)]。这表明，可以通过从q中采样并乘以重要性权重来估计目标期望。","重要性采样方法的关键在于权重的计算，即目标分布p(x)与提议分布q(x)的比值。这允许我们使用旧策略q的样本，通过加权的方式估计新策略p的期望值。","讲者还提到，这种方法可以应用于策略梯度方法中，即利用旧策略的样本估计新策略的期望奖励。这为策略梯度方法中的重要性采样提供了理论基础。","在实际应用中，重要性采样需要确保提议分布q的支撑集合理，否则可能会导致权重过大或估计不稳定。因此，在选择q时需要谨慎。","重要性采样是一种有效的估计方法，但其效果依赖于提议分布q与目标分布p的相似性。如果q与p差异较大，权重可能会变得非常大，导致估计不准确。"],"formulas":[{"latex":"E_p[f(x)] = E_q\\left[ \\frac{p(x)}{q(x)} f(x) \\right]","symbols":"期望值估计公式","explanation":"公式正确，使用了重要性采样方法，将原分布p的期望估计为提议分布q的期望，通过加权因子p(x)/q(x)。","evidence":"p of x divided by q of x times f of x. And so this means that we can actually estimate, we can get this expectation by sampling from q and then weighting the quantity by p over q. So that's pretty cool. This means that we can use principal samples from our old policy, q,"}],"uncertainties":["p of x divided by q of x"],"diagram":"none","start":3404.54,"end":3557.05,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3404.54,"text":"this scenario where you want to estimate a quantity, an expectation, without actually sampling from that distribution. So say you have some expectation using samples from p and you want to estimate some function f using those samples. But say that you only have access to the ability to sample from q . So this is usually called your"},{"start":3434.52,"text":"proposal distribution that's able to kind of propose samples to use. This is like your old policy. We have samples from our old policy, but we want to be able to estimate a function of samples of our new policy after we've taken a gradient step. So what you can do in this case, if you write down this expectation as an integral, it looks something like this. And"},{"start":3462.28,"text":"As long as Q of X has reasonable support, we can write this as, we can kind of add in this term that equals one into our equation. And then we can now actually write this as an expectation with respect to Q. So this is equal to an expectation with respect to Q of"},{"start":3496.78,"text":"p of x divided by q of x times f of x. And so this means that we can actually estimate, we can get this expectation by sampling from q and then weighting the quantity by p over q. So that's pretty cool. This means that we can use principal samples from our old policy, q,"},{"start":3526.76,"text":"weight them by the probability of the sample under our new policy divided by the probability under the old policy times the quantity. So we showed this for kind of this simple case of P and Q . In terms of actually applying this to our policy, we can take our expected rewards with regard to P . If we instead have some previous policy that we've collected samples from, we can then"}],"speech_gaps":[],"frame":"../frames/v030/021.webp","frame_time":3416.54},{"title":"策略梯度中的重要性抽样与轨迹处理","segments":[{"id":193,"text":"measure our objective in terms of the samples from that policy, where we weight the reward by the new policy divided by the old policy probability. Now, note that this requires your proposal distribution to have non-zero support in scenarios where your new policy has probability. This is actually very important for it to work. If Qx is zero, this is not poorly defined.","zh":"我们以该策略的样本为基准来衡量我们的目标，其中我们将奖励乘以新策略概率除以旧策略概率。请注意，这要求你的提议分布（proposal distribution）在新策略有概率的场景中具有非零支持（support）。这对于它能够正常工作实际上非常重要。如果Qx为零，这并不是不明确的。","start":3557.58,"end":3586.18},{"id":194,"text":"But that's really the only catch here. In general, this important sampling technique is really going to work best when P and Q or when your old policy and your new policy are very similar to each other. Now, there's some details. We've shown this in terms of P of tau. Now, how do we actually do this in terms of pi of A given S? That actually gets a little bit trickier. We can write down P of tau and this ratio.","zh":"但这是这里唯一需要注意的问题。一般来说，这种重要性抽样技术在P和Q，或者旧策略和新策略非常相似时，效果最好。现在有一些细节。我们已经以P(τ)的形式展示了这一点。现在，我们如何以π(a|s)的形式实际操作呢？这实际上会变得稍微复杂一些。我们可以写出P(τ)以及这个比率。","start":3587.3,"end":3614.26},{"id":195,"text":"as the product of these different probabilities. Unfortunately, some of the probabilities cancel out. But when we then try to put these probabilities into our update, we're going to get something like this, where we then have this product of these ratios, these probability ratios. And now, unfortunately, this product can actually become very small or very large.","zh":"作为这些不同概率的乘积。不幸的是，其中一些概率会相互抵消。但当我们尝试将这些概率代入更新公式时，我们会得到类似这样的结果，其中包含这些比率、这些概率比率的乘积。不幸的是，这个乘积实际上可能会变得非常小或非常大。","start":3615.75,"end":3645.8},{"id":196,"text":"if the length of your trajectory is very large. Because you're going to be multiplying many, many numbers together. If you have 100 numbers that you're multiplying together, if they're above one, that might start to get very large. If they're below one, that might get to zero very quickly. And so in practice, we often will consider the expectations over time steps instead of trajectories. And that also has a little bit of a hitch, which is that this needs to be over state-action pairs.","zh":"如果轨迹的长度非常长，因为你要将许多数字相乘。如果你有100个数字相乘，如果它们大于1，这可能会变得非常大。如果它们小于1，这可能会迅速趋近于零。因此，在实践中，我们通常会考虑时间步上的期望，而不是轨迹上的期望。这也有一些小问题，即这需要基于状态-动作对。","start":3646.86,"end":3674.79},{"id":197,"text":"rather than actions given states. But often in practice, we can approximate this ratio as equal to one. This is incorrect, but it's kind of the best that we can do. And then we can get some final form where we get this ratio of new policy over old policy. Cool. The full algorithm looks the same, except now we can take multiple gradient steps on the same batch.","zh":"而不是基于状态的动作。但通常在实践中，我们可以将这个比率近似为等于1。这是不正确的，但这是我们能做的最好的近似。然后我们可以得到一个最终形式，其中包含新策略与旧策略的比率。很好。完整的算法看起来相同，只是现在我们可以在同一批数据上进行多次梯度更新。","start":3676.34,"end":3704.43},{"id":198,"text":"This is good. And then we have this new form for our gradient.","zh":"这是好的。然后我们有了新的梯度形式。","start":3704.99,"end":3710.25}],"notes":["本段讲解了策略梯度方法中重要性抽样的核心思想，即通过新旧策略概率比值来加权奖励，以估计目标函数。这要求提议分布（proposal distribution）在新策略有概率的场景中具有非零支持，否则会导致计算不准确。"],"formulas":[],"uncertainties":["Qx is zero"],"diagram":"none","start":3557.58,"end":3710.25,"asr_flags":[],"math_clarifications":["原始公式未正确反映重要性抽样技术中的期望值计算，应基于轨迹的加权奖励总和，而不是时间步的平均。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3557.58,"text":"measure our objective in terms of the samples from that policy, where we weight the reward by the new policy divided by the old policy probability. Now, note that this requires your proposal distribution to have non-zero support in scenarios where your new policy has probability. This is actually very important for it to work. If Qx is zero, this is not poorly defined."},{"start":3587.3,"text":"But that's really the only catch here. In general, this important sampling technique is really going to work best when P and Q or when your old policy and your new policy are very similar to each other. Now, there's some details. We've shown this in terms of P of tau. Now, how do we actually do this in terms of pi of A given S? That actually gets a little bit trickier. We can write down P of tau and this ratio."},{"start":3615.75,"text":"as the product of these different probabilities. Unfortunately, some of the probabilities cancel out. But when we then try to put these probabilities into our update, we're going to get something like this, where we then have this product of these ratios, these probability ratios. And now, unfortunately, this product can actually become very small or very large."},{"start":3646.86,"text":"if the length of your trajectory is very large. Because you're going to be multiplying many, many numbers together. If you have 100 numbers that you're multiplying together, if they're above one, that might start to get very large. If they're below one, that might get to zero very quickly. And so in practice, we often will consider the expectations over time steps instead of trajectories. And that also has a little bit of a hitch, which is that this needs to be over state-action pairs."},{"start":3676.34,"text":"rather than actions given states. But often in practice, we can approximate this ratio as equal to one. This is incorrect, but it's kind of the best that we can do. And then we can get some final form where we get this ratio of new policy over old policy. Cool. The full algorithm looks the same, except now we can take multiple gradient steps on the same batch."},{"start":3704.99,"text":"This is good. And then we have this new form for our gradient."}],"speech_gaps":[],"frame":"../frames/v030/022.webp","frame_time":3569.58},{"title":"策略梯度方法的回顾与后续内容","segments":[{"id":199,"text":"Okay, we'll talk a little bit about some tricks. We don't have time to cover KL constraints today, but to review things, we talked about online RL, the on-policy algorithm, we talked about baselines for reducing variance, and we also just derived this off-policy policy gradient, which uses importance sampling and allows us to apply multiple gradient steps. The intuition is to do more high-reward stuff and less low-reward stuff, and the gradient is still very noisy and best with large batches.","zh":"好的，我们来谈谈一些技巧。今天我们没有时间讲KL约束，但为了复习，我们讨论了在线强化学习，在策略算法，我们还讨论了减少方差的基线方法，并且刚刚推导了这种离策略策略梯度，它使用重要性采样，允许我们应用多个梯度步骤。直觉上是做更多高奖励的事情，做更少低奖励的事情，而梯度仍然非常嘈杂，最好使用大批次。","start":3714.11,"end":3741.57},{"id":200,"text":"and dense rewards. Cool. And that's it for today. Next time, we'll talk about actor critic methods, which will build closely on what we talked about today, including PPO.","zh":"以及密集奖励。很好。今天的讲解就到这里。下次我们将讨论Actor-Critic方法，这将紧密建立在我们今天讨论的内容之上，包括PPO。","start":3741.89,"end":3751.55}],"notes":["本段回顾了策略梯度方法中的一些关键概念，包括在线强化学习、基于策略的算法、方差减少的基线方法，以及推导出的离策略策略梯度方法。离策略策略梯度使用重要性采样，允许应用多个梯度步骤。其核心思想是增加高奖励行为，减少低奖励行为，但梯度仍然具有高噪声，因此需要使用大批次数据来优化。","讲者提到接下来的课程将讨论Actor-Critic方法，这些方法将建立在今天讨论的内容之上，包括PPO（Proximal Policy Optimization）算法。这表明课程内容将逐步深入，从策略梯度方法过渡到更复杂的Actor-Critic框架，以提高策略优化的稳定性和效率。","在讲者提到的离策略策略梯度方法中，重要性采样是关键的技术，它允许在使用不同策略生成的数据上进行梯度估计。这种方法虽然有效，但会引入高方差，因此需要通过基线或其他技术来减少方差。","讲者强调了梯度噪声的问题，并指出使用大批次数据可以缓解这一问题。这表明在实际应用中，策略梯度方法需要在计算资源和梯度稳定性之间进行权衡。","讲者提到的PPO算法是Actor-Critic方法的一个重要实例，它通过引入近端策略优化来稳定训练过程，避免策略更新过大导致的性能下降。这表明课程内容将涵盖更高级的策略优化技术。","本段内容为后续课程的Actor-Critic方法奠定了基础，强调了策略梯度方法在强化学习中的重要性，并指出其局限性，如高方差和噪声问题，为后续更复杂的优化方法做铺垫。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3714.11,"end":3751.55,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":2,"raw_segments":[{"start":3714.11,"text":"Okay, we'll talk a little bit about some tricks. We don't have time to cover KL constraints today, but to review things, we talked about online RL, the on-policy algorithm, we talked about baselines for reducing variance, and we also just derived this off-policy policy gradient, which uses important sampling and allows us to apply multiple gradient steps. The intuition is to do more high-reward stuff and less low-reward stuff, and the gradient is still very noisy and best with large batches."},{"start":3741.89,"text":"and dense rewards. Cool. And that's it for today. Next time, we'll talk about actor critic methods, which will build closely on what we talked about today, including PPO."}],"speech_gaps":[],"frame":"../frames/v030/023.webp","frame_time":3726.11}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v030.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
