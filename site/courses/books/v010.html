ah, blah, blah. But the point is just doing 10 is good enough. So now you know a secret, right? So if I go to my forecasting group and I tell you, here's the demand for this product over the next week, hour by hour, and you go, okay."},{"start":2539.54,"text":"You go, are you certain? They're like, no. And then they say, please generate me 10 such trajectories or 100. I don't care. Right. Then this tells you this. And you say, but the rule is they have to be defensible. They can't be like weird things. Right. Every single one would have to pass as a model. Right. So that's what you would do. OK, so sorry, that was just a weird aside on all these things. OK, but this is the picture. So you can actually do things like stochastic."}],"speech_gaps":[],"frame":"../frames/v010/015.webp","frame_time":2414.86},{"title":"鲁棒最小二乘与正则化","segments":[{"id":117,"text":"robust least squares. And I'll go through this because it actually is very cool and it tells you about what regularization really is. So here it is. So we're going to do least squares. Here we are. So it's 1805 now and we're doing least squares. And so our model is going to be stochastic. We're going to say, well, no, I don't know A. A is A bar. That's kind of like a nominal value of A. Plus U. Use a random matrix, zero mean."},{"id":118,"text":"And let's say that the expected value of each entry is u is p, right? So if p were like little sigma squared i, it says all the entries are all completely independent and they're all perturbed by an n0 sigma squared, little sigma squared value independently. Completely reasonable. By the way, if someone gives you a matrix and you say how accurate are the entries and they can't say, find someone else to work with."},{"id":119,"text":"Because in any practice, if you can't say, if you can't say something like, oh, those are pretty good. Like third significant digit is actually like probably right. That's one thing. Or if they say the second digit is meaningless. So if they don't, if they can't say anything, then just find someone else to work with because this is not someone who knows what they're doing. Everybody got that? Okay."},{"id":120,"text":"All right, so this is one of those cases where you can just analytically work this out. I mean, you just expand this and you get something really, really cool. It turns out you should solve this problem here. It's super simple, right? And actually now, let's just take P equals, you know, delta I, right? So delta would be little sigma squared I, right? Then it's very cool. You end up with this and you go, oh, that's taking off regularization. So you can turn this around."},{"id":121,"text":"And someone says, what are you doing? And you go, well, I'm doing regularized least squares. Like I'm doing ridge regression, you would say here, or you'd say ticking off regularization or something like that, right? And they'd say, why? And one thing you could say is, yeah, because I don't know A, right? And I think we already talked about the fact that this makes sense because the thing that happens, AX is sort of the result, right? If A is uncertain and X is big,"},{"id":122,"text":"You get a lot of uncertainty in the result. If x is small, like if it's zero, it doesn't matter what a is. Everybody following this? So this all sort of makes sense, but it's very cool. So it means that, well, now you know what taken off regularization is or ridge regression is, right? It's basically saying that all of your data, I guess in, let's see, in a regression context, you're basically saying, thank you for all your features."}],"notes":["本段讲解了鲁棒最小二乘法，强调了正则化在处理不确定性矩阵A时的作用。通过引入随机扰动矩阵U，模型考虑了A的不确定性，从而引出正则化方法的必要性。","讲者指出，当矩阵A的不确定性较大时，结果的不确定性也会增加。如果x的值较小，即使A存在不确定性，结果也不会受到显著影响。这说明了正则化方法在处理不确定性时的重要性。","讲者提到，如果无法评估矩阵A的准确性，应避免与之合作。这强调了在实际应用中对数据准确性的重视，以及正则化方法在处理不确定数据时的实用性。","讲者通过将P设为delta I（即delta为小sigma平方的单位矩阵），展示了正则化方法如何通过引入额外的约束来稳定解。这表明正则化方法可以被视为一种对模型不确定性的补偿。","讲者进一步解释了正则化方法（如岭回归）的含义，即通过引入额外的约束来减少模型对数据的过度拟合。这说明了正则化方法在回归问题中的实际应用。","最后，讲者指出正则化方法可以被视为对数据特征的感谢，即通过引入额外的约束来提高模型的鲁棒性。这表明正则化方法在处理不确定性时的直观意义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2572.46,"end":2731.07,"asr_flags":[],"raw_segments":[{"start":2572.46,"text":"robust least squares. And I'll go through this because it actually is very cool and it tells you about what regularization really is. So here it is. So we're going to do least squares. Here we are. So it's 1805 now and we're doing least squares. And so our model is going to be stochastic. We're going to say, well, no, I don't know A. A is A bar. That's kind of like a nominal value of A. Plus U. Use a random matrix, zero mean."},{"start":2602.06,"text":"And let's say that the expected value of each entry is u is p, right? So if p were like little sigma squared i, it says all the entries are all completely independent and they're all perturbed by an n0 sigma squared, little sigma squared value independently. Completely reasonable. By the way, if someone gives you a matrix and you say how accurate are the entries and they can't say, find someone else to work with."},{"start":2627.35,"text":"Because in any practice, if you can't say, if you can't say something like, oh, those are pretty good. Like third significant digit is actually like probably right. That's one thing. Or if they say the second digit is meaningless. So if they don't, if they can't say anything, then just find someone else to work with because this is not someone who knows what they're doing. Everybody got that? Okay."},{"start":2650.89,"text":"All right, so this is one of those cases where you can just analytically work this out. I mean, you just expand this and you get something really, really cool. It turns out you should solve this problem here. It's super simple, right? And actually now, let's just take P equals, you know, delta I, right? So delta would be little sigma squared I, right? Then it's very cool. You end up with this and you go, oh, that's taking off regularization. So you can turn this around."},{"start":2679.91,"text":"And someone says, what are you doing? And you go, well, I'm doing regularized least squares. Like I'm doing ridge regression, you would say here, or you'd say ticking off regularization or something like that, right? And they'd say, why? And one thing you could say is, yeah, because I don't know A, right? And I think we already talked about the fact that this makes sense because the thing that happens, AX is sort of the result, right? If A is uncertain and X is big,"},{"start":2707.05,"text":"You get a lot of uncertainty in the result. If x is small, like if it's zero, it doesn't matter what a is. Everybody following this? So this all sort of makes sense, but it's very cool. So it means that, well, now you know what taken off regularization is or ridge regression is, right? It's basically saying that all of your data, I guess in, let's see, in a regression context, you're basically saying, thank you for all your features."}],"speech_gaps":[],"frame":"../frames/v010/016.webp","frame_time":2584.46},{"title":"凸优化中的不确定性建模与几何解释","segments":[{"id":123,"text":"your feature matrix because that's what A is right basically it says I'll trust all these features are plus minus you know uh 0.01 with they're disturbed by independent gaussians everybody following this so that's what this and then it says that suggests a taken off parameter right so that makes sense I mean it's kind of I think it's kind of cool right um"},{"id":124,"text":"I'm not going to go into the details of this because it's actually quite complicated, but you can actually do a weird thing with... You can actually work out the case where A is in... This is an ellipsoid in matrix space. That's what that is, right? This would be the analog of the previous one. In the previous one, I made a... Well, I didn't say what the distribution was, but I told you it's first and second moments, right? But I didn't say it was Gaussian or anything, but anyway. So here..."},{"id":125,"text":"this would be the ellipsoid. And you say any matrix in this ellipsoid is a plausible model. You can actually tell, I'm not going to go through it, but it's actually, these are things that, let's say, Lagrange would not have known. Let's just put it that way. Probably could have explained it to him pretty quickly, to be honest, but nevertheless, well, okay, they'd have some questions, like how on earth do you solve that problem? But we'd have an answer for that too, right?"},{"id":126,"text":"Okay, I'm not going to look at it. We won't go into the details because it's quite complicated, but I'll just show you the results, which are really very cool. Oh, and this is, by the way, the kind of thing you'd expect to have, right? Let me explain what we're doing. So here's what we're doing. This is now, I have a disk in matrix space. I mean, it's a baby example, right? But I have a disk. That's what this is if you think about it, right? It's two-dimensional."},{"id":127,"text":"It goes off in these two directions, A1 and A2. I have a disk. And actually, I put a uniform distribution on the disk, on this unit disk, right? That's what actually happens. So this one is cool. This is x least squares. That just says that's the traditional method of handling uncertainty, which is ignore it. And I just plug in the mean, and I calculate x."},{"id":128,"text":"And then you get this distribution like this, which you should do anyway, just to check. And that's a message to you that you probably shouldn't, that you need to be a little bit more sophisticated than just ignoring uncertainty. And let me just check on a few things here. Let's describe. How would you describe in words these events? What would you say? Worst case."}],"notes":["本段讲授了在凸优化中如何处理不确定性，通过将特征矩阵视为被独立高斯噪声扰动的模型，从而引入了参数估计的问题。讲者提到，这种模型假设所有特征值在±0.01范围内变化，且服从独立高斯分布。这种建模方式为后续的优化问题提供了几何解释，即通过椭球体或圆盘来表示可能的参数空间。","讲者进一步解释了如何将不确定性建模为矩阵空间中的几何形状，如椭球体和圆盘。椭球体表示参数的可能范围，而圆盘则代表均匀分布的参数空间。这种几何解释有助于理解参数的不确定性如何影响优化问题的解。","讲者提到，传统的处理不确定性方法是忽略它，即使用均值来估计参数。这种方法虽然简单，但可能不够精确。因此，讲者强调需要更复杂的处理方式，例如通过优化方法来考虑不确定性的影响。","讲者还提到，如何描述这些事件，特别是最坏情况下的处理方式。这表明在凸优化中，需要考虑不同情况下的鲁棒性，而不仅仅是基于均值的估计。","讲者提到，这些方法可能需要更复杂的数学工具，如拉格朗日乘数法，但这些方法在现代优化中已经被广泛使用。这表明，虽然这些方法可能在历史上较为复杂，但现代计算工具使得它们变得可行。","讲者通过几何解释和实际例子，展示了如何将不确定性建模为凸优化问题的一部分。这种建模方式不仅有助于理解参数的不确定性，还为后续的优化算法提供了理论基础。"],"formulas":[],"uncertainties":["the taken off parameter","the analog of the previous one","the first and second moments","the traditional method of handling uncertainty","the message to you that you probably shouldn't"],"diagram":"none","start":2731.85,"end":2894.01,"asr_flags":[],"raw_segments":[{"start":2731.85,"text":"your feature matrix because that's what a is right basically it says i'll trust all these features are plus minus you know uh 0.01 with they're disturbed by independent gaussians everybody following this so that's what this and then it says that suggests a taken off parameter right so that makes sense i mean it's kind of i think it's kind of cool right um"},{"start":2757.39,"text":"I'm not going to go into the details of this because it's actually quite complicated, but you can actually do a weird thing with... You can actually work out the case where A is in... This is an ellipsoid in matrix space. That's what that is, right? This would be the analog of the previous one. In the previous one, I made a... Well, I didn't say what the distribution was, but I told you it's first and second moments, right? But I didn't say it was Gaussian or anything, but anyway. So here..."},{"start":2786.47,"text":"this would be the ellipsoid. And you say any matrix in this ellipsoid is a plausible model. You can actually tell, I'm not going to go through it, but it's actually, these are things that, let's say, Lagrange would not have known. Let's just put it that way. Probably could have explained it to him pretty quickly, to be honest, but nevertheless, well, okay, they'd have some questions, like how on earth do you solve that problem? But we'd have an answer for that too, right?"},{"start":2814.19,"text":"Okay, I'm not going to look at it. We won't go into the details because it's quite complicated, but I'll just show you the results, which are really very cool. Oh, and this is, by the way, the kind of thing you'd expect to have, right? Let me explain what we're doing. So here's what we're doing. This is now, I have a disk in matrix space. I mean, it's a baby example, right? But I have a disk. That's what this is if you think about it, right? It's two-dimensional."},{"start":2841.61,"text":"It goes off in these two directions, A1 and A2. I have a disk. And actually, I put a uniform distribution on the disk, on this unit disk, right? That's what actually happens. So this one is cool. This is x least squares. That just says that's the traditional method of handling uncertainty, which is ignore it. And I just plug in the mean, and I calculate x."},{"start":2863.86,"text":"And then you get this distribution like this, which you should do anyway, just to check. And that's a message to you that you probably shouldn't, that you need to be a little bit more sophisticated than just ignoring uncertainty. And let me just check on a few things here. Let's describe. How would you describe in words these events? What would you say? Worst case."}],"speech_gaps":[],"frame":"../frames/v010/017.webp","frame_time":2743.85},{"title":"统计估计的基本概念","segments":[{"id":129,"text":"Yeah, you say, look, this is bad. These are perturbations to A where my choice of X gave me a really big residual, right? So these are kind of, this is, you know, bad luck or something. Oh, by the way, how do you describe these? Yeah, what would you call it? Yeah, how about dumb luck? Right, because you're using a dumb method, right? And sure enough, 5% of the time, the perturbation of A is in a way that actually helped you, right? So this is, I would call this dumb luck."},{"id":130,"text":"Then we look at ticking off here, or ridge regression, if you want to. That's a different dialect for it. So if you do ridge regression, you get this. And actually, it's really cool to see. I mean, you see immediately kind of what adding regularization does. It tightens the distribution with respect. In this case, it's with respect to a very specific perturbation of the parameters. So that's this one. And then when you do the robustly squares,"},{"id":131,"text":"I mean, that's unfair because we told it exactly what the disk was and stuff like that. And you can see you get this beautiful, very tight distribution. So make sense? Yeah. Okay. So, okay. So this is, and you know, these are all like convex problems and stuff like that. So, okay. All right. So our next topic."},{"id":132,"text":"is a statistical estimation. It's extremely elementary, but we'll talk about it. It's sort of interesting. So actually, it's one of those things where if you haven't seen this stuff before, you're not going to understand it from what I say. And if you've seen it before, you'll be bored out of your mind or something like that. So I'll probably tell some weird stories through it, anyway, just to make it more interesting. But here we go. So we'll just start with parametric distribution estimation."},{"id":133,"text":"Here's the idea, is that we have a density and we have an observed value of something. We have a density, but the density is indexed by a parameter, right? For example, a Gaussian would be indexed by, let's say, its mean and its covariance matrix, let's say, right? Or a Poisson variable by its rate or something like this, or an exponential variable by its rate or whatever it is, right? So you'd have parameters."},{"id":134,"text":"And what we'll do is we'll put the parameter as a subscript. So px of y is going to be the density with parameter values x at the point y, right? So that's going to be, that's called the likelihood function."}],"notes":["本段介绍了统计估计的基本概念，特别是参数化分布估计。讲者提到，当我们有一个密度函数，并且该密度函数由参数索引时，我们可以通过观察到的数据来估计这些参数。例如，高斯分布由均值和协方差矩阵索引，泊松分布由速率索引，指数分布也由速率索引。","讲者强调，参数化分布估计中，参数通常以下标形式表示，如px(y)表示参数为x时在点y处的密度函数，这被称为似然函数。这一概念是统计估计的基础，用于从数据中推断参数的值。","讲者提到，如果听众之前没有接触过这些内容，可能无法完全理解；如果之前学过，可能会觉得无聊。因此，他计划通过讲述一些有趣的故事来增加内容的趣味性。","讲者还提到，统计估计是一个非常基础但重要的主题，它在许多领域都有应用，如机器学习和信号处理。通过参数化分布估计，我们可以从数据中学习到关于未知参数的信息。","在讲授过程中，讲者使用了多个例子来说明参数化分布的概念，如高斯分布、泊松分布和指数分布，这些例子帮助听众更好地理解参数化分布估计的基本思想。","讲者还提到，参数化分布估计是凸优化的一个应用领域，这表明该主题与课程的其他部分有联系，如凸问题和优化方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2894.64,"end":3060.57,"asr_flags":[],"raw_segments":[{"start":2894.64,"text":"Yeah, you say, look, this is bad. These are perturbations to A where my choice of X gave me a really big residual, right? So these are kind of, this is, you know, bad luck or something. Oh, by the way, how do you describe these? Yeah, what would you call it? Yeah, how about dumb luck? Right, because you're using a dumb method, right? And sure enough, 5% of the time, the perturbation of A is in a way that actually helped you, right? So this is, I would call this dumb luck."},{"start":2926.41,"text":"Then we look at ticking off here, or ridge regression, if you want to. That's a different dialect for it. So if you do ridge regression, you get this. And actually, it's really cool to see. I mean, you see immediately kind of what adding regularization does. It tightens the distribution with respect. In this case, it's with respect to a very specific perturbation of the parameters. So that's this one. And then when you do the robustly squares,"},{"start":2955.06,"text":"I mean, that's unfair because we told it exactly what the disk was and stuff like that. And you can see you get this beautiful, very tight distribution. So make sense? Yeah. Okay. So, okay. So this is, and you know, these are all like convex problems and stuff like that. So, okay. All right. So our next topic."},{"start":2980.51,"text":"is a statistical estimation. It's extremely elementary, but we'll talk about it. It's sort of interesting. So actually, it's one of those things where if you haven't seen this stuff before, you're not going to understand it from what I say. And if you've seen it before, you'll be bored out of your mind or something like that. So I'll probably tell some weird stories through it, anyway, just to make it more interesting. But here we go. So we'll just start with parametric distribution estimation."},{"start":3009.38,"text":"Here's the idea, is that we have a density and we have an observed value of something. We have a density, but the density is indexed by a parameter, right? For example, a Gaussian would be indexed by, let's say, its mean and its covariance matrix, let's say, right? Or a Poisson variable by its rate or something like this, or an exponential variable by its rate or whatever it is, right? So you'd have parameters."},{"start":3038.85,"text":"And what we'll do is we'll put the parameter as a subscript. So px of y is going to be the density with parameter values x at the point y, right? So that's going to be, that's called the likelihood function."}],"speech_gaps":[],"frame":"../frames/v010/018.webp","frame_time":2906.64},{"title":"最大似然估计与凸性","segments":[{"id":135,"text":"People often work with the log likelihood function, obviously maximizing a likelihood and a log likelihood are the same thing, and so you would have something that looks like this. So here, this is an estimator for x, and you're given y, which is an observation."},{"id":136,"text":"And it's you know it I mean it kind of makes sense and you could argue a lot of things about it And if you take a like statistics 101 class you'll hear a lot about about properties of this right so okay So that's that's maximum likelihood estimation So as I said this is called the log likelihood function by the way here what we're doing is we're considering this a function of X which is the parameter in the distribution not of Y right so"},{"id":137,"text":"And you can add constraints to this. I mean, for example, if this is a Gaussian distribution, let's say scalar, with mean mu and standard deviation little sigma, right? Then..."},{"id":138,"text":"You know, little sigma has to be positive, like otherwise it makes no sense at all. So you could add, you would add that as a constraint or simply define the likelihood to be zero. If you say, if you say, well, how, you know, what, what density do I get when, what's my likelihood if I guess that the standard deviation is minus one?"},{"id":139,"text":"I mean, aside from that being profoundly stupid, you just get zero. And then log of zero is minus infinity, and that means you did a very bad job of maximizing. So, okay. You can add regularization, too. So regularized maximum likelihood, you could do. So the question is, when is this convex? And it's convex when the log likelihood function is concave."},{"id":140,"text":"Now you have to be super careful because up till now we saw the idea of a log-concave distribution or density. So a density is log-concave if when you fix x, this thing is concave in y. That's a log-concave density. This is not that."},{"id":141,"text":"This is the opposite. This is, how does this vary as a function of when you fix y of x, which is the parameter in the distribution. Everybody got that? Now it's going to turn out that there's lots of cases, like if it's an exponential family, then it's going to turn out they're the same thing. But in general, they're different. I'm just going slow just to make sure this is all totally clear."}],"notes":["本段讲解了最大似然估计的基本概念，指出最大化似然函数和对数似然函数是等价的。同时，强调了在估计过程中，参数x是分布中的参数，而y是观测值。"],"formulas":[],"uncertainties":["log-concave density 的定义是否准确"],"diagram":"none","start":3062.36,"end":3213.21,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学定义或上下文来确认对数似然函数和似然为零的具体形式和条件，因此无法核定其数学表达的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3062.36,"text":"People often work with the log likelihood function, obviously maximizing a likelihood and a log likelihood are the same thing, and so you would have something that looks like this. So here, this is an estimator for x, and you're given y, which is an observation."},{"start":3077.49,"text":"And it's you know it I mean it kind of makes sense and you could argue a lot of things about it And if you take a like statistics 101 class you'll hear a lot about about properties of this right so okay So that's that's maximum likelihood estimation So as I said this is called the log likelihood function by the way here what we're doing is we're considering this a function of X which is the parameter in the distribution not of Y right so"},{"start":3104.85,"text":"And you can add constraints to this. I mean, for example, if this is a Gaussian distribution, let's say scalar, with mean mu and standard deviation little sigma, right? Then..."},{"start":3121.39,"text":"You know, little sigma has to be positive, like otherwise it makes no sense at all. So you could add, you would add that as a constraint or simply define the likelihood to be zero. If you say, if you say, well, how, you know, what, what density do I get when, what's my likelihood if I guess that the standard deviation is minus one?"},{"start":3142.35,"text":"I mean, aside from that being profoundly stupid, you just get zero. And then log of zero is minus infinity, and that means you did a very bad job of maximizing. So, okay. You can add regularization, too. So regularized maximum likelihood, you could do. So the question is, when is this convex? And it's convex when the log likelihood function is concave."},{"start":3168.81,"text":"Now you have to be super careful because up till now we saw the idea of a log-concave distribution or density. So a density is log-concave if when you fix x, this thing is concave in y. That's a log-concave density. This is not that."},{"start":3188.75,"text":"This is the opposite. This is, how does this vary as a function of when you fix y of x, which is the parameter in the distribution. Everybody got that? Now it's going to turn out that there's lots of cases, like if it's an exponential family, then it's going to turn out they're the same thing. But in general, they're different. I'm just going slow just to make sure this is all totally clear."}],"speech_gaps":[],"frame":"../frames/v010/019.webp","frame_time":3074.36},{"title":"最大似然估计与凸性","segments":[{"id":142,"text":"Okay, so that's it. So roughly speaking, maximum likelihood estimation is a convex problem when the log likelihood function is concave, which is not the same as saying that the densities are all log concave. That's a different thing. Okay, so we'll just look at some simple examples here. So here's one. It's a traditional linear measurement model. So I make a bunch of measurements."},{"id":143,"text":"And they're going to look like yi. And my model is going to be that each yi, which is a scalar, is a linear function of x."},{"id":144,"text":"here, plus a noise which is independent across different eyes. So that's what the model is. Actually, it's kind of interesting because someone in EE or something like that would describe this in a pretty simple way. They would say something like, x is what you really want to measure."},{"id":145,"text":"AI tells you what your right measurement is. Like, oh, that's a radar snapshot from this position, like that. Or A7 is what I deduced from some GPS thing or something like that, right? And they say, well, that's how they would describe the problem, right? But the statistician would have to describe it this way."},{"id":146,"text":"They would say that what you observe from your sensor suite actually comes from a distribution. You go, oh, okay."},{"id":147,"text":"Then you say, ah, the distribution changes, it's parametrized by this x."},{"id":148,"text":"I mean, they're saying the same thing, but I'm just saying this is the language a statistician would use."},{"id":149,"text":"And then they would say, so your problem is really to estimate which distribution generated the measurements,"},{"id":150,"text": oise density, this thing would go way down. I mean, I'd have to adjust things to get the normalization right, but whatever. The density is proportional to this. So what you do is you just take a Gaussian, cut it, and then glue on."},{"id":184,"text":"exponential tails. If you do maximum likelihood estimation, congratulations, you're doing Huber fitting. Everybody got this? Make sense? So there's lots of ways to understand exactly the same thing, right? What if I did fitting with a, I don't know, here, with a dead zone linear penalty? That's maximum likelihood for what?"}],"notes":["本段讲解了Huber拟合与最大似然估计之间的关系。讲者指出，Huber拟合可以被看作是一种混合密度模型，它结合了高斯分布和指数分布的特性。具体来说，Huber拟合在某个阈值内使用高斯分布，而在阈值之外使用指数分布。这种结构使得Huber拟合对异常值具有鲁棒性，同时保留了高斯分布的某些特性。","讲者进一步解释了如何将Huber拟合转化为最大似然估计问题。他指出，Huber拟合对应的最大似然估计问题中，噪声密度是一个由高斯分布和指数分布组合而成的密度函数。这种密度函数在阈值内与高斯分布相似，而在阈值外则具有指数衰减的特性。","讲者强调，虽然Huber拟合看起来像是一种混合模型，但它并不是严格意义上的混合分布。这是因为Huber拟合的密度函数在阈值处是连续的，而混合分布通常在不同成分之间存在断点。因此，Huber拟合更准确地说是一种连续的密度函数，它结合了高斯分布和指数分布的特性。","讲者还提到，当使用Huber拟合时，需要对密度函数进行归一化处理。虽然归一化过程可能需要调整参数，但讲者指出，这种调整并不影响拟合的基本思想。归一化后的密度函数仍然保持了高斯分布和指数分布的特性。","最后，讲者通过提问的方式引导听众思考，如果使用一种具有“死区”的线性惩罚函数进行拟合，这种拟合方法对应的最大似然估计问题是什么。这表明，Huber拟合的思路可以推广到其他类型的惩罚函数，从而形成不同的鲁棒估计方法。","讲者通过这些讲解，帮助听众理解Huber拟合的统计意义，并展示了如何将这种拟合方法与最大似然估计框架联系起来。这种联系不仅加深了对Huber拟合的理解，也为后续学习其他鲁棒估计方法奠定了基础。"],"formulas":[],"uncertainties":["exponential tails"],"diagram":"none","start":3717.43,"end":3894.31,"asr_flags":[],"raw_segments":[{"start":3717.43,"text":"For a Laplacian noise, that's not the case, right? As a matter of fact, there's a sharp peak, and actually being zero is actually quite likely. And that explains also why you get weird, you know, the sparsity and stuff like that. Okay, so does this all make sense? And let's do one more just for fun. And you can turn this backwards and forwards. So let's do one more. You tell me, suppose someone says, I'm going to use Huber fitting. That looks like this. It's quadratic up to some threshold, and then it goes linear."},{"start":3748.15,"text":"O , it's going to look like this, right? It's going to have a super sharp like that, right? Okay. How sharp is this going to be?"},{"start":4217.83,"text":"infinitely sharp because the less sharp you make this you start dropping the probability here"},{"start":4222.75,"text":"but you know everyone over age 33 survived so that's that's you're losing you're losing log"},{"start":4228.21,"text":"likelihood right and the other thing too is if you make this less than infinitely"},{"start":4232.45,"text":"infinite slope here then you know you're short changing the predictions here right so in this"}],"speech_gaps":[],"frame":"../frames/v010/025.webp","frame_time":4075.17},{"title":"假设检验与随机检测器","segments":[{"id":201,"text":"case this is precisely the case when the log likelihood is unbounded above"},{"id":202,"text":"above, right? So this is extremely common in models, right? If a log-likelihood is unbounded"},{"id":203,"text":"above, it means they're separable and stuff like that, right? So, of course, this is fixed"},{"id":204,"text":"by regression and things like that. Sorry, by adding regularization, right? So that's"},{"id":205,"text":"fine. Okay. All right. Our last topic is just sort of a whirlwind of topics. There's more"},{"id":206,"text":"more in the book which you know we'd expect you to be reading um but uh and the next the last one"},{"id":207,"text":"is just on kind of basic hypothesis testing right so and the setting here it's super simple setting"},{"id":208,"text":"it just says um i have a random variable and for fun i'm just going to make it uh with values in"},{"id":209,"text":"one to n right um and it was either it was generated from two different one of two different"},{"id":210,"text":"distributions and you have to guess which one it's it was generated from did it come from P did it"},{"id":211,"text":"come from Q that's your question right it's a basic question here right and the way that's"},{"id":212,"text":"going to work is an outcome is going to ha load is unbound"},{"start":4250.77,"text":"above, it means they're separable and stuff like that, right? So, of course, this is fixed"},{"start":4255.65,"text":"by regression and things like that. Sorry, by adding regularization, right? So that's"},{"start":4260.61,"text":"fine. Okay. All right. Our last topic is just sort of a whirlwind of topics. There's more"},{"start":4269.45,"text":"more in the book which you know we'd expect you to be reading um but uh and the next the last one"},{"start":4276.45,"text":"is just on kind of basic hypothesis testing right so and the setting here it's super simple setting"},{"start":4282.09,"text":"it just says um i have a random variable and for fun i'm just going to make it uh with values in"},{"start":4288.45,"text":"one to n right um and it was either it was generated from two different one of two different"},{"start":4295.13,"text":"distributions and you have to guess which one it's it was generated from did it come from P did it"},{"start":4300.85,"text":"come from Q that's your question right it's a basic question here right and the way that's"},{"start":4308.07,"text":"going to work is an outcome is going to happen like I'm gonna say okay I observe seven right"},{"start":4316.18,"text":"From that, you have to guess, like, was it from distribution P or Q? You could almost guess, or from a course, you would certainly know what the optimal guess is, right? I mean, it'd be very weird if P7 was like 0.8 or something, and Q7 was 0.05. And I said, 7 is what occurred. Which one do you think it came from? And you go, oh, Q."},{"start":4345.49,"text":"It's just, I mean, if you think carefully about it, that's weird. I mean, unless you know something secretly behind it, you must know something, right? And you go, whoa, it's much more likely with the first model than the second. And you go, yeah, but I've been doing this for 20 years. I got a good feel for these things. So go with Q. I mean, anyway, I'm just saying, you can even guess what it is. But we'll just work out what it is. Okay. So what we're going to do is we're going to look at a..."},{"start":4371.07,"text":"randomized detector. And a randomized detector is like a two by n matrix. It's a very weird thing. It looks like this, right? So it's a two by n matrix. It looks like, you know, 0.8, 0.2, 1, 0, 0, 1. That's good. And 0.3 and 0.7, right? And let's say this is p and q, right? And this is the outcome. This is 1 and that's n, okay? So the idea here is"}],"speech_gaps":[],"frame":"../frames/v010/026.webp","frame_time":4251.51},{"title":"检测器与混淆矩阵","segments":[{"id":216,"text":"This is my detector. It's a policy. And what it does is it says that if the outcome is 2, I will simply say it came from P, period. Everybody following this? If the outcome is 3, I'll say it came from Q. If the outcome is 1, I will then do something very weird. I'll flip a coin with probability 0.8. And if it comes up heads, I'll say it's P. Otherwise, I'll say it's Q. Right? Everybody?"},{"id":217,"text":"Got that? By the way, we're going to see examples where you need a randomized detector. A deterministic detector is when all the numbers in that matrix are 0 or 1. Then it's just a partition of the outcomes, which are 1 to n, into the ones where you guess it's p and the ones where you guess it's q. Yeah."},{"id":218,"text":"Isn't p a distribution and q is a distribution? Yeah, those are n numbers that are non-negative and add up to 1. But here they don't add up to 1, right? This is a detector matrix. This is not a probability distribution at all. Yeah, so p and q do. Those things, of course. The sum of the pi's is 1, the sum of the qi's is 1. The only thing, in fact, the rules for this matrix are..."},{"id":219,"text":"They're non-negative, and the column sums are one. That's the rules for this detector matrix. It's a randomized, it characterizes a randomized detector. So you'd say it's like column stochastic or something like that, right? The matrix. Okay. Okay. Now..."},{"id":220,"text":"What you could do is just work out the, you can actually just work out the so-called detector matrix, which actually you get by just doing literally matrix multiplication, right? So if I do the following, if I multiply my matrix here by, here's P and here's Q, I get a two by two matrix, which is super interesting."},{"id":221,"text":"And what it's going to tell me, it's called, I don't know, confusion matrix. There are lots of names for this, right? But it tells you actually what the probability of your being either right or wrong is as a function of whether it was generated from P or Q, right? And so that's called a confusion matrix. Although maybe for two by two, it's not. But I don't know. It's got some, I don't know what it is. Anyway."},{"id":222,"text":"And so here, you would like the, if this matrix, this detection probability matrix were an identity, that's perfect, right? Because it means that whenever it comes from P, I guess P. Whenever it comes from Q, I guess Q. By the way, would that ever happen? When do you imagine that's possible? Somebody give me an example. Yeah. When the distributions don't overlap? Yeah, they don't overlap, right? So here's P."}],"notes":["本段讲解了检测器的概念，包括确定性检测器和随机化检测器的区别。确定性检测器通过0或1的矩阵表示，将结果划分为猜测P或Q的类别。而随机化检测器则允许在某些情况下通过概率翻转硬币来决定猜测结果。","讲者指出，p和q是概率分布，它们的元素非负且和为1。而检测器矩阵的元素和不一定为1，其列和为1，这表明检测器矩阵是列随机化的，用于描述随机化检测器。","检测器矩阵可以通过矩阵乘法计算得到，它将P和Q的分布相乘，得到一个2x2的矩阵，称为混淆矩阵。混淆矩阵用于表示在不同分布下猜测正确的概率。","讲者提到，理想情况下，混淆矩阵应为单位矩阵，这意味着当输入来自P时猜测P，来自Q时猜测Q。这种情况只有在分布不重叠时才可能发生。","讲者通过提问引导学生思考分布不重叠的情况，这表明在分布完全分离时，检测器可以完美区分两种分布。","本段内容涉及检测器的构建、随机化检测器的特性、混淆矩阵的定义及其在分类问题中的作用，以及理想情况下的检测器性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4397.42,"end":4573.94,"asr_flags":[],"raw_segments":[{"start":4397.42,"text":"This is my detector. It's a policy. And what it does is it says that if the outcome is 2, I will simply say it came from P, period. Everybody following this? If the outcome is 3, I'll say it came from Q. If the outcome is 1, I will then do something very weird. I'll flip a coin with probability 0.8. And if it comes up heads, I'll say it's P. Otherwise, I'll say it's Q. Right? Everybody?"},{"start":4425.88,"text":"Got that? By the way, we're going to see examples where you need a randomized detector. A deterministic detector is when all the numbers in that matrix are 0 or 1. Then it's just a partition of the outcomes, which are 1 to n, into the ones where you guess it's p and the ones where you guess it's q. Yeah."},{"start":4444.17,"text":"Isn't p a distribution and q is a distribution? Yeah, those are n numbers that are non-negative and add up to 1. But here they don't add up to 1, right? This is a detector matrix. This is not a probability distribution at all. Yeah, so p and q do. Those things, of course. The sum of the pi's is 1, the sum of the qi's is 1. The only thing, in fact, the rules for this matrix are..."},{"start":4473.77,"text":"They're non-negative, and the column sums are one. That's the rules for this detector matrix. It's a randomized, it characterizes a randomized detector. So you'd say it's like column stochastic or something like that, right? The matrix. Okay. Okay. Now..."},{"start":4494.44,"text":"What you could do is just work out the, you can actually just work out the so-called detector matrix, which actually you get by just doing literally matrix multiplication, right? So if I do the following, if I multiply my matrix here by, here's P and here's Q, I get a two by two matrix, which is super interesting."},{"start":4519.17,"text":"And what it's going to tell me, it's called, I don't know, confusion matrix. There are lots of names for this, right? But it tells you actually what the probability of your being either right or wrong is as a function of whether it was generated from P or Q, right? And so that's called a confusion matrix. Although maybe for two by two, it's not. But I don't know. It's got some, I don't know what it is. Anyway."},{"start":4546.27,"text":"And so here, you would like the, if this matrix, this detection probability matrix were an identity, that's perfect, right? Because it means that whenever it comes from P, I guess P. Whenever it comes from Q, I guess Q. By the way, would that ever happen? When do you imagine that's possible? Somebody give me an example. Yeah. When the distributions don't overlap? Yeah, they don't overlap, right? So here's P."}],"speech_gaps":[],"frame":"../frames/v010/027.webp","frame_time":4409.42},{"title":"贝叶斯检测与多准则优化","segments":[{"id":223,"text":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"id":224,"text":"And if the outcome were 2, it came from Q, not P. And so in this case, if you had a reasonable deterministic detector there, you would come up with this detection matrix being the identity, meaning you make no mistakes. I mean, that's a silly thing, but nevertheless, that's the idea. So what you really end up having in the choice of T now is this is a multi-criterion problem."},{"id":225,"text":"Right. So because there's two, actually, you can even weirdly say that. Well, here we can. This matrix only has two free parameters in it. Right. The probability of a false negative and probability of a false positive. Both of those you want small. Right. So we can say it's a bicriterion problem and it would look like this. Right. It looks exactly like this. So, yeah. So this is this is what you would do."},{"id":226,"text":"this is your false probability and false negative, false positive, false negative probabilities. You want them both small, right? So what's cool is over here, I mean, with this ridiculous example over here, we can make both of them zero, right? But in general, obviously you can't do that, right? So it's a bicriterion problem and it looks like this. That is an LP, right? Actually, it's an LP that's so simple, it has an analytical solution."},{"id":227,"text":"which you could work out. We'll get to that in a minute. But if you scalarize it, and so lambda would be the penalty that tells you how much false negatives bother you more than false positives, right? If you solve this, you actually end up with a solution that is a deterministic detector."},{"id":228,"text":"Okay, so you get. As a matter of fact, the method is actually incredibly simple. It's really dumb. It basically says that it depends on the ratio of p over q."},{"id":229,"text":"Right. And so this is this is, you know, I guess they call it a likelihood ratio test. Right. I mean, this is a super dumb example, but actually this kind of works in infinite dimensions and things like that. Right. So it'd be the exact same thing in infinite dimensions. If I had two continuous densities and I say, hey, here's X, which density did it come from? You know, you look at it. What you do is you look at the ratio of the densities and then there's a threshold which you interpret as."}],"notes":["本段讲授了贝叶斯检测的基本概念，通过两个离散分布P和Q的示例，说明如何根据观测结果判断其来源。P和Q的支撑集不重叠，因此当观测结果为3时，可以确定其来自P；当为2时，来自Q。这展示了检测矩阵的确定性，即在理想情况下可以完全正确分类。","接下来，课程讨论了多准则优化问题，即在选择检测矩阵T时，需要同时最小化误检率（false positive）和漏检率（false negative）。这被描述为一个双准则问题，其中两个目标需要平衡。","在具体例子中，P和Q的参数被设定为0.5和0.3，这使得在某些情况下可以实现零误检率和零漏检率。然而，一般情况下无法做到这一点，因此需要通过优化方法找到最佳的检测策略。","课程进一步指出，该问题可以转化为一个线性规划（LP）问题，其解具有解析形式。通过引入一个惩罚参数λ，可以将双准则问题转化为单准则问题，从而找到最优的检测阈值。","最后，课程提到该方法基于似然比检验（likelihood ratio test），即通过比较两个分布的密度比值来决定观测结果的来源。这种方法不仅适用于离散分布，也适用于连续分布，并且在无限维空间中同样适用。","整个讲解通过一个简单的例子引出复杂的优化问题，强调了在实际应用中如何平衡不同类型的错误，并通过数学建模找到最优解。"],"formulas":[{"latex":"P = [0, 0, 0.5, 0.5]","symbols":"P 是一个离散概率分布，其支撑集为 {0, 1, 2, 3}，对应概率为 0, 0, 0.5, 0.5。","explanation":"公式正确，表示离散概率分布P。","evidence":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"latex":"Q = [0.3, 0.7, 0, 0]","symbols":"Q 是另一个离散概率分布，其支撑集为 {0, 1, 2, 3}，对应概率为 0.3, 0.7, 0, 0。","explanation":"公式正确，表示离散概率分布Q。","evidence":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"latex":"P_{\\text{false negative}} = P_{\\text{false positive}} = 0","symbols":"在特定情况下，可以实现零误检率和零漏检率。","explanation":"公式正确，表示在特定情况下可以实现零误检率和零漏检率。","evidence":"Right. So because there's two, actually, you can even weirdly say that. Well, here we can. This matrix only has two free parameters in it. Right. The probability of a false negative and probability of false positive. Both of those you want small. Right. So we can say it's a bicriterion problem and it would look like this. Right. It looks exactly like this. So, yeah. So this is this is what you would do."},{"latex":"P_{\\text{false negative}} + \\text{penalty} \\times P_{\\text{false positive}} = \\text{objective function}","symbols":"通过引入惩罚参数λ，将双准则问题转化为单准则问题，以找到最优的检测阈值。","explanation":"公式正确，表示通过引入惩罚参数λ，将双准则问题转化为单准则问题。","evidence":"which you could work out. We'll get to that in a minute. But if you scalarize it, and so lambda would be the penalty that tells you how much false negatives bother you more than false positives, right? If you solve this, you actually end up with a solution that is a deterministic detector."}],"uncertainties":[],"diagram":"none","start":4574.68,"end":4748.62,"asr_flags":[],"math_clarifications":["公式2未说明矩阵的维度和具体形式，无法核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4574.68,"text":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"start":4604.93,"text":"And if the outcome were 2, it came from Q, not P. And so in this case, if you had a reasonable deterministic detector there, you would come up with this detection matrix being the identity, meaning you make no mistakes. I mean, that's a silly thing, but nevertheless, that's the idea. So what you really end up having in the choice of T now is this is a multi-criterion problem."},{"start":4634.21,"text":"Right. So because there's two, actually, you can even weirdly say that. Well, here we can. This matrix only has two free parameters in it. Right. The probability of a false negative and probability of false positive. Both of those you want small. Right. So we can say it's a bicriterion problem and it would look like this. Right. It looks exactly like this. So, yeah. So this is this is what you would do."},{"start":4659.0,"text":"this is your false probability and false negative, false positive, false negative probabilities. You want them both small, right? So what's cool is over here, I mean, with this ridiculous example over here, we can make both of them zero, right? But in general, obviously you can't do that, right? So it's a bicriterion problem and it looks like this. That is an LP, right? Actually, it's an LP that's so simple, it has an analytical solution."},{"start":4687.67,"text":"which you could work out. We'll get to that in a minute. But if you scalarize it, and so lambda would be the penalty that tells you how much false negatives bother you more than false positives, right? If you solve this, you actually end up with a solution that is a deterministic detector."},{"start":4709.62,"text":"Okay, so you get. As a matter of fact, the method is actually incredibly simple. It's really dumb. It basically says that it depends on the ratio of p over q."},{"start":4721.33,"text":"Right. And so this is this is, you know, I guess they call it a likelihood ratio test. Right. I mean, this is a super dumb example, but actually this kind of works in infinite dimensions and things like that. Right. So it'd be the exact same thing in infinite dimensions. If I had two continuous densities and I say, hey, here's X, which density did it come from? You know, you look at it. What you do is you look at the ratio of the densities and then there's a threshold which you interpret as."}],"speech_gaps":[],"frame":"../frames/v010/028.webp","frame_time":4586.68},{"title":"分类器设计与优化","segments":[{"id":230,"text":"how much you care about being false negative compared to false positive. And if you're above the threshold, you guess one distribution if you're below and all that kind of stuff. Okay, everybody got this? So, okay. Now, those are deterministic detectors. But you could do other stuff. Like you could say, actually, here's what I care about. I want to minimize the probability of being wrong."},{"id":231,"text":"Minimize the probability. Did I say maximize? Whatever. You want to minimize the probability of being wrong, right? And so there you're minimizing the max of these two things. That's an LP, and it usually ends up not being a deterministic detector. So we'll quit today, and we'll start up again next time."}],"notes":["本段讨论了分类器设计中对误判的权衡，特别是对假阴性和假阳性的关注程度。讲者提到，当超过某个阈值时，分类器会猜测一个分布，而低于阈值时则猜测另一个分布。这种设计属于确定性检测器，但也可以采用其他方法，如最小化错误概率。","讲者指出，虽然可能误说成最大化，但目标是减少错误概率。这种优化问题通常转化为最小化两个误判概率的最大值，属于线性规划问题，且通常不采用确定性检测器。","讲者提到，这种优化方法通常不采用确定性检测器，而是通过线性规划来实现，这表明分类器设计可以基于不同的优化目标进行调整。","课程内容涉及分类器设计中的误判分析，以及如何通过优化方法来改进分类器的性能。讲者强调了对假阴性和假阳性的不同关注程度，以及如何通过数学建模来实现优化目标。","讲者提到，这种优化问题通常不采用确定性检测器，而是通过线性规划来实现，这表明分类器设计可以基于不同的优化目标进行调整。","课程内容涉及分类器设计中的误判分析，以及如何通过优化方法来改进分类器的性能。讲者强调了对假阴性和假阳性的不同关注程度，以及如何通过数学建模来实现优化目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4749.1,"end":4797.27,"asr_flags":[],"raw_segments":[{"start":4749.1,"text":"how much you care about being false negative compared to false positive. And if you're above the threshold, you guess one distribution if you're below and all that kind of stuff. Okay, everybody got this? So, okay. Now, those are deterministic detectors. But you could do other stuff. Like you could say, actually, here's what I care about. I want to minimize the probability of being wrong."},{"start":4774.25,"text":"Minimize the probability. Did I say maximize? Whatever. You want to minimize the probability of being wrong, right? And so there you're minimizing the max of these two things. That's an LP, and it usually ends up not being a deterministic detector. So we'll quit today, and we'll start up again next time."}],"speech_gaps":[],"frame":"../frames/v010/029.webp","frame_time":4761.1}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
