x}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">10 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 10 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v010.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v010","title":"10 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 10","course":"凸优化","pages":[{"title":"惩罚函数与L1正则化","segments":[{"id":0,"text":"Okay, we'll continue. There was a couple of things I wanted to point out here. We already saw a couple, right? So the idea here is you create a penalty function which basically describes how you feel, how irritated are you with a residual of a certain value, right? So these are like residuals here.","zh":"好的，我们继续。我之前想指出一些事情。我们已经看到一些了，对吧？这里的思路是，你创建一个惩罚函数，它基本上描述了你对某个残差值的感受，也就是你有多烦躁，对吧？所以这些就是残差。","start":5.23,"end":27.8},{"id":1,"text":"And then this is basically your irritation. And what you're going to do is actually minimize your total irritation, right? By minimizing the sum of these things. And then you can interpret these all sorts of ways. You know, your standard thing would be a quadratic. That's been a tradition for a couple of hundred years. And also has analytical solutions in some simple cases, right? But then we have some others here, like this dead zone linear. And these are interesting because they have like a kink here.","zh":"然后，这基本上就是你的烦躁程度。你接下来要做的事情实际上是通过最小化这些值的总和来最小化你的总烦躁程度，对吧？然后你可以以各种方式解释这些。你知道的，标准的做法就是二次函数。这已经是一个传统了两百多年。在一些简单的情况下，它也有解析解，对吧？但除此之外，我们还有一些其他的，比如这个死区线性函数。这些很有趣，因为它们在这里有一个拐点。","start":28.84,"end":56.52},{"id":2,"text":"And what we observed last time was actually kind of interesting. It was this. It was that when you have a kink here, you find a whole bunch of values right at the kink. Notice that that's also true for the L1 solution as well. So the L1 solution says you don't like residuals.","zh":"我们上次观察到的实际上有点意思。就是这个。当这里有一个拐点时，你会发现很多值正好位于拐点处。请注意，这同样适用于L1解。所以L1解表示你不喜欢残差。","start":58.03,"end":80.95},{"id":3,"text":"In fact, one way to analyze what an L1 penalty function is, is that for large residuals, it's relatively chill, at least for a convex penalty. Because it's a lot smaller than a quadratic when a residual is large, because a quadratic is large squared. Conversely, for small residuals, something like an L1 or something with a sharp point is actually not chill.","zh":"事实上，分析L1惩罚函数的一种方法是，对于大的残差，它相对而言比较淡定，至少对于凸惩罚函数来说是这样。因为当残差很大时，它比二次函数小得多，因为二次函数是平方的。相反地，对于小的残差，像L1或者有尖点的函数实际上并不淡定。","start":82.43,"end":109.29},{"id":4,"text":"It's very, it gets very upset with, it gets relatively upset with small residuals, whereas, for example, a square penalty is not, is fine. So, and I'm just, there's no more to what I'm saying than just this. So don't try to over, I mean, you can, if you wanted to, people have actually attempted to make this extremely mathematical and so on. It's a bit silly because I think it's actually very interesting to actually just see how this works. Okay.","zh":"它对小残差非常烦躁，而例如平方惩罚则不是这样，它很宽容。所以，我所说的没有更多内容，只是这些。所以不要试图过度理解，我的意思就是这些。如果你愿意的话，人们实际上尝试将这个变得极其数学化。这有点傻，因为我觉得直接看到它是如何运作的其实非常有趣。好的。","start":109.82,"end":136.42},{"id":5,"text":"That is actually something, especially this top one, which is the L1 thing. Here you see that a whole bunch of penalties are zero. And in fact, this is a theme you're going to see. You may already have seen it in some statistics and machine learning classes. And basically what people say is that L1 is a sparsifier.","zh":"这实际上是一个重要的点，尤其是顶部的那个，也就是L1正则化。在这里你可以看到很多惩罚项都是零。事实上，这会是一个你将会经常看到的主题。你可能已经在一些统计学和机器学习课程中见过这一点。人们通常说，L1正则化是一种稀疏化方法。","start":137.19,"end":157.27}],"notes":["本段讨论了惩罚函数中不同形式的残差处理方式，特别是L1惩罚函数的特性。讲者指出，L1惩罚函数在残差较大时相对不敏感，而在残差较小时则会表现出较强的敏感性，这与二次惩罚函数形成对比。","讲者提到，L1惩罚函数在残差较大时，其惩罚值比二次惩罚函数小得多，因为二次惩罚函数的惩罚值与残差的平方成正比。而在残差较小时，L1惩罚函数的惩罚值会相对较大，因此对小残差更敏感。","讲者强调，L1惩罚函数的一个重要特性是它能够产生稀疏解，即在优化过程中，许多变量的系数会趋近于零。这种特性在统计学和机器学习中被广泛用于特征选择。","讲者指出，虽然L1惩罚函数可以被数学化地分析，但其直观的理解更为重要。他建议不要过度数学化，而是通过观察其行为来理解其作用。","讲者提到，L1惩罚函数的这种特性在统计学和机器学习课程中已经被广泛讨论，因此听众可能已经有所了解。","讲者最后指出，L1惩罚函数的这种稀疏性是其在实际应用中的一个重要优势，尤其是在处理高维数据时，能够有效减少模型的复杂度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":157.27,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5.23,"text":"Okay, we'll continue. There was a couple of things I wanted to point out here. We already saw a couple, right? So the idea here is you create a penalty function which basically describes how you feel, how irritated are you with a residual of a certain value, right? So these are like residuals here."},{"start":28.84,"text":"And then this is basically your irritation. And what you're going to do is actually minimize your total irritation, right? By minimizing the sum of these things. And then you can interpret these all sorts of ways. You know, your standard thing would be a quadratic. That's been a tradition for a couple of hundred years. And also has analytical solutions in some simple cases, right? But then we have some others here, like this dead zone linear. And these are interesting because they have like a kink here."},{"start":58.03,"text":"And what we observed last time was actually kind of interesting. It was this. It was that when you have a kink here, you find a whole bunch of values right at the kink. Notice that that's also true for the L1 solution as well. So the L1 solution says you don't like residuals."},{"start":82.43,"text":"In fact, one way to analyze what an L1 penalty function is, is that for large residuals, it's relatively chill, at least for a convex penalty. Because it's a lot smaller than a quadratic when a residual is large, because a quadratic is large squared. Conversely, for small residuals, something like an L1 or something with a sharp point is actually not chill."},{"start":109.82,"text":"It's very, it gets very upset with, it gets relatively upset with small residuals, whereas, for example, a square penalty is not, is fine. So, and I'm just, there's no more to what I'm saying than just this. So don't try to over, I mean, you can, if you wanted to, people have actually attempted to make this extremely mathematical and so on. It's a bit silly because I think it's actually very interesting to actually just see how this works. Okay."},{"start":137.19,"text":"That is actually something, especially this top one, which is the L1 thing. Here you see that a whole bunch of penalties are zero. And in fact, this is a theme you're going to see. You may already have seen it in some statistics and machine learning classes. And basically what people say is that L1 is a sparsifier."}],"speech_gaps":[],"frame":"../frames/v010/001.webp","frame_time":17.23},{"title":"L1范数与稀疏性","segments":[{"id":6,"text":"meaning that when you take an L1 norm of something in an optimization problem, it is often the case that at the solution, the argument has a lot of zero entries. That's the case here, okay? And so that's just a common phenomenon, and it's got tons of uses, including a lot of practical uses. We'll get to it in machine learning. There's just tons of them, but it comes up in engineering and has been used actually now for several decades.","zh":"这意味着在优化问题中，当你对某个对象取L1范数时，通常在解中，该对象的参数会有大量的零元素。在这里就是这种情况，对吧？这就是一种常见的现象，并且有大量用途，包括很多实际应用。我们将在机器学习中讨论它。它有很多应用，但早在几十年前就已经在工程领域被使用了。","start":158.1,"end":186.68},{"id":7,"text":"So, okay. I guess this is the, we looked at the Huber penalty. That focuses on","zh":"好的。我想这就是我们刚才讨论的，我们看了Huber惩罚项。它关注的是","start":187.97,"end":196.18},{"id":8,"text":"large residuals and the fact that a Huber penalty is like this Frankenstein penalty that blends together a quadratic for small residuals with basically something that looks like an L1 penalty for large, right? And so you might say that a Huber penalty matches least squares for small residuals, which is to say that it's relatively...","zh":"大的残差，以及Huber惩罚项像这样一种Frankenstein惩罚项，它将小残差的二次项与基本上看起来像L1惩罚项的大残差结合起来，对吧？因此你可能会说，Huber惩罚项在小残差的情况下与最小二乘法一致，也就是说，它相对……","start":197.07,"end":219.29},{"id":9,"text":"If, for example, x is a sequence of forces that you apply to something, let's say ax equals b, it says make me a trajectory of forces to put every 20 milliseconds on this rigid body to move it from this position to that position. Let's just say that's what x is. If I use an L1 norm here, I want someone to guess.","zh":"例如，如果x是一系列施加在某个物体上的力，比如说ax等于b，它要求我生成一个力的轨迹，每隔20毫秒施加在刚体上，以将其从当前位置移动到目标位置。让我们假设这就是x的含义。如果我在这种情况下使用L1范数，我希望有人来猜测。","start":219.68,"end":247.15},{"id":10,"text":"Which is, by the way, a kind of a first order approximation of fuel use, at least for rockets. So, somebody want to make a guess as to what it's going to look like? What is X going to be? Based on what we were just talking about. It's going to be sparse. Yeah. Yeah. And by the way, if you go and watch videos of satellites maneuvering or rockets maneuvering.","zh":"顺便说一句，这在火箭中是一种对燃料消耗的零阶近似。因此，有人想猜测它会是什么样子吗？根据我们刚才讨论的内容，x会是什么样子？它会是稀疏的。是的。顺便说一句，如果你观看卫星或火箭机动的视频。","start":248.06,"end":274.52},{"id":11,"text":"Which is, by the way, a kind of a first order approximation of fuel use, at least for rockets. So, somebody want to make a guess as to what it's going to look like? What is X going to be? Based on what we were just talking about. It's going to be sparse. Yeah. Yeah. And by the way, if you go and watch videos of satellites maneuvering or rockets maneuvering.","zh":"顺便说一句，这在火箭中是一种对燃料消耗的零阶近似。因此，有人想猜测它会是什么样子吗？根据我们刚才讨论的内容，x会是什么样子？它会是稀疏的。是的。顺便说一句，如果你观看卫星或火箭机动的视频。","start":275.07,"end":300.44},{"id":12,"text":"That's exactly what you'll see. If you watch, because you'll actually see puffs come out of the thrusters, and there's little bursts, and you'll see like, you know, one, two, three, and then just nothing. And then some other thruster, you'll get like two bursts out of it or something like that. So that's exactly right. They're sparse. Everybody got this? So it's a theme. Don't worry, you're going to see it basically from now on. And it's used in a whole lot of other applications, not just, well, that's one.","zh":"这就是你将会看到的。如果你仔细观察，你会看到推进器会喷出气泡，会有小的爆发，你会看到像这样，一个、两个、三个，然后就没有了。然后其他推进器可能会有两次爆发，或者其他类似的情况。所以这完全正确。它们是稀疏的。大家明白了吗？这是一个主题。别担心，从现在开始你基本上会一直看到这一点。它被用于很多其他应用，不仅仅是这个例子。","start":300.96,"end":329.34}],"notes":["本段主要讲解了L1范数在优化问题中的应用，特别是在稀疏性方面的表现。当使用L1范数时，解通常具有大量零元素，这种现象在工程和机器学习中都有广泛应用。例如，在火箭推进系统中，L1范数可以用来近似燃料使用情况，从而得到稀疏的控制信号。","讲者通过火箭推进系统的例子，说明了稀疏性在实际中的体现。当火箭进行机动时，推进器会以脉冲形式工作，即在短时间内施加较大的力，随后停止，这种行为与稀疏性特征相符。","讲者强调了稀疏性是一个重要的主题，并指出它将在后续课程中频繁出现。稀疏性不仅在工程领域有应用，还在机器学习、信号处理等多个领域有广泛应用。","讲者提到，稀疏性可以通过L1范数实现，而L1范数在优化问题中能够产生稀疏解，这与L1范数的性质密切相关。这种性质使得L1范数在处理高维数据时特别有用。","讲者还提到，稀疏性在实际应用中可以带来计算上的优势，例如减少计算复杂度和提高模型的可解释性。因此，理解稀疏性及其在优化问题中的应用对于学习凸优化非常重要。","讲者通过火箭推进系统的例子，直观地展示了稀疏性的实际意义，帮助学生更好地理解L1范数在优化问题中的作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":158.1,"end":329.34,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":158.1,"text":"meaning that when you take an L1 norm of something in an optimization problem, it is often the case that at the solution, the argument has a lot of zero entries. That's the case here, okay? And so that's just a common phenomenon, and it's got tons of uses, including a lot of practical uses. We'll get to it in machine learning. There's just tons of them, but it comes up in engineering and has been used actually now for several decades."},{"start":187.97,"text":"So, okay. I guess this is the, we looked at the Huber penalty. That focuses on"},{"start":197.07,"text":"large residuals and the fact that a Huber penalty is like this Frankenstein penalty that blends together a quadratic for small residuals with basically something that looks like an L1 penalty for large, right? And so you might say that a Huber penalty matches least squares for small residuals, which is to say that it's relatively..."},{"start":219.68,"text":"chill not as chill as a dead zone that's that's as chill as you can get that's like well okay then but for large residuals a huber penalty is actually looks more like an l1 thing which is for a convex penalty is as chill as you can get right so okay um we looked at least norm problems where you know basically the same story uh happens um but now i can we can cut you can kind of guess a lot of stuff"},{"start":248.06,"text":"If, for example, x is a sequence of forces that you apply to something, let's say ax equals b, it says make me a trajectory of forces to put every 20 milliseconds on this rigid body to move it from this position to that position. Let's just say that's what x is. If I use an L1 norm here, I want someone to guess."},{"start":275.07,"text":"Which is, by the way, a kind of a first order approximation of fuel use, at least for rockets. So, somebody want to make a guess as to what it's going to look like? What is X going to be? Based on what we were just talking about. It's going to be sparse. Yeah. Yeah. And by the way, if you go and watch videos of satellites maneuvering or rockets maneuvering."},{"start":300.96,"text":"That's exactly what you'll see. If you watch, because you'll actually see puffs come out of the thrusters, and there's little bursts, and you'll see like, you know, one, two, three, and then just nothing. And then some other thruster, you'll get like two bursts out of it or something like that. So that's exactly right. They're sparse. Everybody got this? So it's a theme. Don't worry, you're going to see it basically from now on. And it's used in a whole lot of other applications, not just, well, that's one."}],"speech_gaps":[],"frame":"../frames/v010/002.webp","frame_time":170.1},{"title":"输入设计与目标函数","segments":[{"id":13,"text":"So anyway, okay, we'll get to that. Okay, we talked about regularized approximation last time as basically a bicriterion problem where you have two criteria. And of course you could extend it and have three and things like that. And I think we looked at an example of that, not this one.","zh":"总之，好吧，我们会讲到的。好吧，我们上次讨论了正则化逼近，基本上是一个双标准问题，你有两个标准。当然你也可以扩展它，拥有三个甚至更多这样的标准。我想我们看过一个这样的例子，不是这个例子。","start":330.64,"end":349.86},{"id":14,"text":"but optimal input design. We looked at this last time, and this is sort of very typical. This is a pure quadratic problem, so it's not that. I mean, you know, it's very simple. You don't need the material of this glass to solve this problem. But it looks something like this, right? You're designing an input.","zh":"但最优输入设计。我们上次已经讨论过这个问题，这基本上是非常典型的。这是一个纯粹的二次问题，所以不是那种。我的意思是，你知道的，它非常简单。你不需要用这节课的内容来解决这个问题。但看起来大概是这样的，对吧？你在设计一个输入。","start":350.66,"end":364.42},{"id":15,"text":"which is an input to some system which is given by a convolution or in dialect I would say it's a","zh":"这个输入是给定系统的一个输入，这个系统由卷积给出，或者用另一种说法，它是一个","start":364.94,"end":372.78},{"id":16,"text":"linear time invariant system that would be like EE and maybe mechanical engineering dialect for","zh":"线性时不变系统，这在电气工程和可能机械工程的术语中","start":372.78,"end":378.5},{"id":17,"text":"what this is right so the output is a is the input uh convolved with something um I guess","zh":"就是这个意思。所以输出是输入，嗯，与某个东西卷积得到的，嗯，我想","start":378.5,"end":385.48},{"id":18,"text":"in fancy language you would say it's the convolution kernel that would be something","zh":"用更专业的术语来说，它就是卷积核，会是某个东西","start":385.48,"end":389.92},{"id":19,"text":"think everyone would understand. But if you're exclusively with people who speak this E-E-M-E","zh":"大家都会理解的。但如果只和那些说这种电气工程和机械工程术语的人交流，你会说","start":389.92,"end":396.56},{"id":20,"text":"dialect, you would say something like H is the impulse response, right? So I'm just mentioning","zh":"像 H 是脉冲响应，对吧？我只是提一下","start":396.56,"end":402.0},{"id":21,"text":"that different groups have different names for these things, right? Okay, so here we have like","zh":"不同群体对这些事物有不同的名称，对吧？好的，那么我们这里就有三个目标，对吧？","start":402.0,"end":409.06},{"id":22,"text":"three objectives, right? I mean, the first one is we want to track some desired trajectory.","zh":"第一个目标是我们希望跟踪某个期望的轨迹。","start":409.06,"end":413.0},{"id":23,"text":"We want the input small. I mean, roughly, we're making it L2 norm small squared.","zh":"我们希望输入的值较小。我的意思是，大致上，我们是在使L2范数的平方变得较小。","start":413.9,"end":419.58},{"id":24,"text":"And we want the input variation to be small.","zh":"我们还希望输入的变化较小。","start":419.92,"end":422.32},{"id":25,"text":"So we want the difference between u, t plus 1, and u, t to be relatively small.","zh":"因此，我们希望u(t+1)和u(t)之间的差异相对较小。","start":422.44,"end":426.36},{"id":26,"text":"And so what we'll do is we will minimize a weighted sum of them.","zh":"因此，我们将对它们进行加权求和并进行最小化。","start":428.12,"end":432.48},{"id":27,"text":"These are positive weights, the delta and the eta, that weight the different things.","zh":"这些是正权重，delta和eta，用于对不同的因素进行加权。","start":432.56,"end":436.18},{"id":28,"text":"And then the way, in fact, people in control and other areas talk about this is they would say that the delta and the eta are knobs, design knobs,","zh":"事实上，控制领域和其他领域的人会说，delta和eta是调节旋钮，设计旋钮，","start":436.28,"end":446.76},{"id":29,"text":"that allows you to shape, to make you look like what you want it to look like.","zh":"这允许你进行塑造，使你看起来像你想要的样子。","start":446.76,"end":451.96},{"id":30,"text":"Everybody got that? Right, so I guess in machine learning you'd call them hyperparameters, which are things you wiggle to make, to change your model.","zh":"大家明白了吗？对，所以在机器学习中，你会称它们为超参数，也就是你可以调整的东西，用来改变你的模型。","start":452.46,"end":461.04},{"id":31,"text":"you know to make it less sensitive to something or something like that everybody got that unlike in machine learning where you actually have rather good ways to defend choices of delta and eta in a ton of applications you don't right so i mean you do kind of right so you know in control you'd do something like pick some values and say oh you know that's nice saves a lot of fuel but the ride is too rough right and then you would","zh":"你知道，用来使它对某些东西不那么敏感，或者类似的事情，大家明白了吗？不像在机器学习中，你实际上在很多应用中都有相当好的方法来辩护选择的delta和eta，你不是，所以我说你确实有点对，你知道，在控制中你会做一些事情，比如选择一些值，然后说哦，你知道的，这节省了很多燃料，但乘坐体验太颠簸了，然后你会","start":461.42,"end":486.7},{"id":32,"text":"wiggle these things multiply them one or two of them by a factor of two divide one by a factor of two rerun it and you'd say okay that looks we're only using about five percent we only lost a few percent in fuel efficiency but it's a lot smoother ride or something like that it would be things like this right so okay and and we looked actually at some examples of how that works and and the example actually shows","zh":"调整这些值，把其中一两个乘以两倍，或者把其中一个除以两倍，重新运行一遍，然后你会说，哦，看起来我们只用了大约五分之一，我们在燃料效率上只损失了百分之几，但乘坐体验要平顺得多，或者类似的事情，就是这样，所以好的，我们实际上看了一些例子，说明它是如何工作的，而且这个例子实际上展示了","start":487.26,"end":508.65}],"notes":["本段讲授了输入设计问题，其中涉及系统建模和目标函数的构建。系统被建模为线性时不变系统，输入通过卷积与系统响应相关联。输入设计的目标包括跟踪期望轨迹、使输入本身尽可能小（L2范数小）以及限制输入的变化幅度。这些目标通过加权求和的方式进行优化，权重参数（delta和eta）用于调整不同目标的重要性。"],"formulas":[],"uncertainties":["在片段15中，'in dialect I would say it's a' 可能是 'in dialect I would say it's a linear time invariant system' 的不完整表达。","在片段17中，'a is the input uh convolved with something um I guess' 可能是 'the output is a convolution of the input with something' 的不完整表达。","在片段31中，'i mean you do kind of right so you know in control you'd do something like pick some values and say oh you know that's nice saves a lot of fuel but the ride is too rough right and then you would' 可能是 'you do kind of right, so you know in control you'd do something like pick some values and say, oh, you know, that's nice, saves a lot of fuel, but the ride is too rough, right, and then you would' 的不完整表达。"],"diagram":"none","start":330.64,"end":508.65,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":330.64,"text":"So anyway, okay, we'll get to that. Okay, we talked about regularized approximation last time as basically a bicriterion problem where you have two criteria. And of course you could extend it and have three and things like that. And I think we looked at an example of that, not this one."},{"start":350.66,"text":"but optimal input design. We looked at this last time, and this is sort of very typical. This is a pure quadratic problem, so it's not that. I mean, you know, it's very simple. You don't need the material of this glass to solve this problem. But it looks something like this, right? You're designing an input."},{"start":364.94,"text":"which is an input to some system which is given by a convolution or in dialect I would say it's a"},{"start":372.78,"text":"linear time invariant system that would be like EE and maybe mechanical engineering dialect for"},{"start":378.5,"text":"what this is right so the output is a is the input uh convolved with something um I guess"},{"start":385.48,"text":"in fancy language you would say it's the convolution kernel that would be something"},{"start":389.92,"text":"think everyone would understand. But if you're exclusively with people who speak this E-E-M-E"},{"start":396.56,"text":"dialect, you would say something like H is the impulse response, right? So I'm just mentioning"},{"start":402.0,"text":"that different groups have different names for these things, right? Okay, so here we have like"},{"start":409.06,"text":"three objectives, right? I mean, the first one is we want to track some desired trajectory."},{"start":413.9,"text":"We want the input small. I mean, roughly, we're making it L2 norm small squared."},{"start":419.92,"text":"And we want the input variation to be small."},{"start":422.44,"text":"So we want the difference between u, t plus 1, and u, t to be relatively small."},{"start":428.12,"text":"And so what we'll do is we will minimize a weighted sum of them."},{"start":432.56,"text":"These are positive weights, the delta and the eta, that weight the different things."},{"start":436.28,"text":"And then the way, in fact, people in control and other areas talk about this is they would say that the delta and the eta are knobs, design knobs,"},{"start":446.76,"text":"that allows you to shape, to make you look like what you want it to look like."},{"start":452.46,"text":"Everybody got that? Right, so I guess in machine learning you'd call them hyperparameters, which are things you wiggle to make, to change your model."},{"start":461.42,"text":"you know to make it less sensitive to something or something like that everybody got that unlike in machine learning where you actually have rather good ways to defend choices of delta and eta in a ton of applications you don't right so i mean you do kind of right so you know in control you'd do something like pick some values and say oh you know that's nice saves a lot of fuel but the ride is too rough right and then you would"},{"start":487.26,"text":"wiggle these things multiply them one or two of them by a factor of two divide one by a factor of two rerun it and you'd say okay that looks we're only using about five percent we only lost a few percent in fuel efficiency but it's a lot smoother ride or something like that it would be things like this right so okay and and we looked actually at some examples of how that works and and the example actually shows"}],"speech_gaps":[],"frame":"../frames/v010/003.webp","frame_time":342.64},{"title":"凸优化中的稀疏性与平滑性","segments":[{"id":33,"text":"what the whole idea here is, and it's identical to the idea, by the way, in regularization and machine learning, which we'll talk about later. It's identical, and what it is based on is you can actually sometimes get away with not a huge loss in your primary objective, while at the same time actually getting a substantial reduction in your secondary objectives, right? So this is A, a lot smoother than that, and also B, a lot smaller.","zh":"这里的整个想法是什么，顺便说一下，这个想法和后来我们会谈到的正则化和机器学习中的想法是一样的。它是一样的，其基础是有时你可以在不造成主要目标巨大损失的同时，同时在次要目标上获得实质性的减少，对吧？所以这是A，比那个更平滑，同时也是B，更小。","start":509.24,"end":538.22},{"id":34,"text":"Right? I mean, if this is not good enough tracking error, this versus that, then, you know, this is all theoretical, right? But if you say like, yo, that's fine. That's all I wanted this thing to do, right? Oh, and I think...","zh":"对吧？我的意思是，如果这个跟踪误差还不够好，这个和那个相比，那么，你知道的，这都是理论上的，对吧？但如果你说，嗯，这就可以了。这就是我想要这个东西做的，对吧？哦，而且我想……","start":538.74,"end":552.79},{"id":35,"text":"I couldn't remember the name in control or mechanical engineering for this. It's called a doublet. Someone told me anyway. It's something like a doublet motion or something like that. That's what it is when something goes like this. It goes over here, over there, and then back. Okay. All right. Does this make sense? And now I'm going to ask you a question. What would happen if I change this to the sum of the absolute values? You just guess.","zh":"我记不起控制或机械工程中这个的名称。它叫做双极。有人告诉我的。它类似于双极运动或者类似的东西。当某物像这样运动时，这就是它的样子。它从这里移动到那里，再回来。好的。好的。这有没有道理？现在我要问你们一个问题。如果我把这个改成绝对值的和，会发生什么？你只需要猜。","start":553.13,"end":583.16},{"id":36,"text":"I mean, three lines of Python and you would know. But just, someone could just make a guess. What do you think would happen? What? Yeah, well, I don't think u is sparse at all. Like, here, let's go look at u. Sorry. Here's u. Well, that's not true. I shouldn't have spoke, right? It does look like it doesn't do anything for 40 steps. It would be sparser, right? What if, what if I changed this to be the sum of the absolute values? What would you get?","zh":"我的意思是，三行Python代码你就会知道。但只是，有人可以随便猜一下。你认为会发生什么？什么？嗯，我觉得u根本就不是稀疏的。比如，这里，让我们看看u。抱歉。这里是u。好吧，这并不正确。我本不应该说的，对吧？看起来它在40步内没有做任何事情。它会更稀疏，对吧？如果，如果我把这个改成绝对值的和，你会得到什么？","start":584.43,"end":614.93},{"id":37,"text":"I mean, three lines of Python and you would know. But just, someone could just make a guess. What do you think would happen? What? Yeah, well, I don't think u is sparse at all. Like, here, let's go look at u. Sorry. Here's u. Well, that's not true. I shouldn't have spoke, right? It does look like it doesn't do anything for 40 steps. It would be sparser, right? What if, what if I changed this to be the sum of the absolute values? What would you get?","zh":"我的意思是，三行Python代码你就会知道。但只是，有人可以随便猜一下。你认为会发生什么？什么？嗯，我觉得u根本就不是稀疏的。比如，这里，让我们看看u。抱歉。这里是u。好吧，这并不正确。我本不应该说的，对吧？看起来它在40步内没有做任何事情。它会更稀疏，对吧？如果，如果我把这个改成绝对值的和，你会得到什么？","start":616.02,"end":641.7},{"id":38,"text":"And you're just guessing here. So what's that? Sparse derivative. It's not a derivative. It's a first difference. Yeah, sparse first difference. What does it mean if a time series has a sparse first difference? What does that mean? It's what? It's what? I can't hear. More smooth. More smooth.","zh":"你在这里只是在猜测。那么这是什么？稀疏导数。它不是导数，而是一个一阶差分。对，是稀疏的一阶差分。如果一个时间序列具有稀疏的一阶差分，这意味着什么？这意味着什么？它是什么？它是什么？我听不清。更平滑。更平滑。","start":643.05,"end":662.33},{"id":39,"text":"I don't think that's very smooth, no. I mean, it's smooth in a certain sense, right? In the sense that the L1 norm of the first difference is small. I don't know. Yeah. Piecewise what? Kind of constant and when it changes, it's constant. It's piecewise constant, right? If I give you a time series and I tell you that...","zh":"我认为这并不太平滑，对吧。我的意思是，在某种意义上它是平滑的，对吧？在这样的意义上，一阶差分的L1范数很小。我不知道。对。分段什么？大致是常数，当它变化时，也是常数。它是分段常数，对吧？如果我给你一个时间序列，并告诉你……","start":662.64,"end":688.24}],"notes":["本段讨论了凸优化中稀疏性和平滑性的概念，以及它们在控制和机械工程中的应用。讲者提到，稀疏性可以通过使用L1范数来实现，而平滑性则可以通过L2范数来实现。讲者还提到，稀疏性可以用于化学工程中的输入规划，以鼓励分段常数的输入。","讲者通过一个例子说明了稀疏性与平滑性的区别。他提到，如果将目标函数从L2范数改为L1范数，那么结果会更加稀疏，但可能不够平滑。他进一步解释了稀疏性在时间序列中的含义，即大部分时间的差分是零，这意味着时间序列大部分时间保持不变。","讲者还提到，稀疏性在控制和机械工程中被称为双极（doublet），它描述了一种运动模式，即物体在不同位置之间来回移动。这种模式在化学工程中被用来规划输入变化。","讲者通过提问引导学生思考稀疏性与平滑性的关系，并指出稀疏性并不意味着完全平滑，而是指在某些情况下，稀疏性可以带来更优的性能。"],"formulas":[],"uncertainties":["doublet"],"diagram":"none","start":509.24,"end":688.24,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":509.24,"text":"what the whole idea here is, and it's identical to the idea, by the way, in regularization and machine learning, which we'll talk about later. It's identical, and what it is based on is you can actually sometimes get away with not a huge loss in your primary objective, while at the same time actually getting a substantial reduction in your secondary objectives, right? So this is A, a lot smoother than that, and also B, a lot smaller."},{"start":538.74,"text":"Right? I mean, if this is not good enough tracking error, this versus that, then, you know, this is all theoretical, right? But if you say like, yo, that's fine. That's all I wanted this thing to do, right? Oh, and I think..."},{"start":553.13,"text":"I couldn't remember the name in control or mechanical engineering for this. It's called a doublet. Someone told me anyway. It's something like a doublet motion or something like that. That's what it is when something goes like this. It goes over here, over there, and then back. Okay. All right. Does this make sense? And now I'm going to ask you a question. What would happen if I change this to the sum of the absolute values? You just guess."},{"start":584.43,"text":"I mean, three lines of Python and you would know. But just, someone could just make a guess. What do you think would happen? What? Yeah, well, I don't think u is sparse at all. Like, here, let's go look at u. Sorry. Here's u. Well, that's not true. I shouldn't have spoke, right? It does look like it doesn't do anything for 40 steps. It would be sparser, right? What if, what if I changed this to be the sum of the absolute values? What would you get?"},{"start":616.02,"text":"And you're just guessing here. So what's that? Sparse derivative. It's not a derivative. It's a first difference. Yeah, sparse first difference. What does it mean if a time series has a sparse first difference? What does that mean? It's what? It's what? I can't hear. More smooth. More smooth."},{"start":643.05,"text":"I don't think that's very smooth, no. I mean, it's smooth in a certain sense, right? In the sense that the L1 norm of the first difference is small. I don't know. Yeah. Piecewise what? Kind of constant and when it changes, it's constant. It's piecewise constant, right? If I give you a time series and I tell you that..."},{"start":662.64,"text":"the first differences are sparse, then it means that most of the time it's zero. And that means most of the time the value is equal to the previous value. So it would encourage piecewise constant inputs, right? So make sense? Yeah. So that's actually used in like chemical engineering plants when they're planning out changes to inputs and things like that. They actually put a term that looks like this with absolute values."}],"speech_gaps":[],"frame":"../frames/v010/004.webp","frame_time":521.24},{"title":"信号重建与平滑方法","segments":[{"id":40,"text":"And they even have some great name for that. What happens then is you get things that says you're going to run three and a half hours and then you're going to increase the feed rate to this. And then three hours after that, you're going to turn up the power to this heater or something like that. And they call those deltas.","zh":"他们甚至给这个过程起了一个很棒的名字。接下来会发生的是，你会得到一些指令，比如你将运行三小时半，然后将进料速率增加到某个值。然后在那之后三小时，你将把加热器的功率调高到某个值。他们把这些称为 deltas。","start":688.78,"end":707.84},{"id":41,"text":"I mean, it's just dialect, but it's kind of cool. And it's done exactly by solving actually quadratic programs. Actually, it looks exactly like that, but with an absolute value here. And the whole idea here should be kind of obvious, right? You can design these penalty terms and objective terms and things like that.","zh":"我的意思是，这只是方言，但挺酷的。它实际上是通过求解二次规划问题来完成的。实际上，它看起来就是这样，只不过这里有一个绝对值。在这里，整个想法应该很明显，对吧？你可以设计这些惩罚项和目标项等等。","start":708.4,"end":732.32},{"id":42,"text":"to get something that you want, right? Like some kind of sparsity or something like that. Okay. Next up is another very simple problem. It's called signal reconstruction. It didn't stop people from running a thousand papers on it, but still, here it is. And it goes like this. So I give you a corrupted signal.","zh":"以得到你想要的东西，对吧？比如某种稀疏性或者其他类似的东西。好的。接下来是另一个非常简单的问题。它被称为信号重建。这并没有阻止人们发表上千篇相关论文，但不管怎样，这里就是它。它的工作方式如下。我给你一个被损坏的信号。","start":732.88,"end":754.14},{"id":43,"text":"And then what you want to do is form a, you want to form an approximation of it or an uncorrupted or, you know, cleaned signal or a reconstructed signal. We're going to call that X hat. That's our variable. X corrupted is given, right? So that would be something like that. And then what you're also given is you're given phi is something like it's a regularization function or a smoothing objective. So it basically says that, it says that the larger phi is,","zh":"然后你想要做的就是形成一个近似值，或者一个未被损坏的、清理后的信号，或者说是重建的信号。我们将这个称为 X 帽。这是我们的变量。被损坏的信号是已知的，对吧？所以这会是类似这样的东西。然后你也会被给出 phi，它类似于一个正则化函数或平滑目标函数。它基本上表示，phi 越大，","start":754.67,"end":784.03},{"id":44,"text":"the less plausible X hat is as what you're trying to reconstruct, right? So simple things would be things like a quadratic smoother. This would be the one we just talked about. It's an L1 smoother. You could take the third difference and take the L1 difference. You could put a dead zone penalty on the second difference. I mean, there's just a lot of stuff you could do with this. Okay? So this is sort of the idea.","zh":"X 帽作为你想要重建的信号就越不靠谱，对吧？简单一点的例子就是二次平滑器。这就是我们刚才讨论的那个。它是 L1 平滑器。你可以取三阶差分并取 L1 差分。你也可以在二阶差分上使用死区惩罚。我的意思是，你可以用这个做很多事情。明白了吗？这就是这个想法的大致内容。","start":784.55,"end":813.59},{"id":45,"text":"Now, by the way, okay, so let's just take a look at how this works. So here's just a, you know, kind of a classic example for how you do signal reconstruction. Like, so here's an original signal and you can see it's like smooth or something like that. And now here we add some noise to it and it looks like that, right? And now we simply do, this is with quadratic smoothing.","zh":"现在，顺便说一下，好的，让我们来看看这个方法是如何工作的。这里有一个经典的例子，说明你是如何进行信号重建的。比如，这里有一个原始信号，你可以看到它看起来是平滑的。现在我们向其中添加一些噪声，看起来就是这样，对吧？现在我们简单地进行操作，这是使用二次平滑的方法。","start":815.24,"end":840.6},{"id":46,"text":"which, by the way, turns out to be linear, and it turns out to be exactly classical smoothing and whatever, and all the stuff, well, in EE you would learn and stuff like that. That's what it is. So that's what that is. And basically the smoother is then, I'll go into dialect, a low-pass filter is what people would say. And someone would say, what are you doing? And you say, I'm filtering out the high-frequency noise here to estimate the...","zh":"顺便说一下，这种方法实际上是一种线性方法，并且实际上就是经典的平滑方法，以及所有相关的内容，这些在电气工程中你会学到的。这就是它的本质。所以这就是它的本质。基本上，平滑器，我会用术语来说，就是人们所说的低通滤波器。有人会问，你在做什么？你会回答，我在滤除这里的高频噪声以估计……","start":841.36,"end":866.54}],"notes":["本段讲解了信号重建的基本概念，即通过给定的受干扰信号，设计合适的惩罚项和目标函数，以重建出干净的信号。其中提到的phi函数作为正则化函数或平滑目标，其值越大，重建的信号越不被接受。"],"formulas":[],"uncertainties":[],"diagram":"none","start":688.78,"end":866.54,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":688.78,"text":"And they even have some great name for that. What happens then is you get things that says you're going to run three and a half hours and then you're going to increase the feed rate to this. And then three hours after that, you're going to turn up the power to this heater or something like that. And they call those deltas."},{"start":708.4,"text":"I mean, it's just dialect, but it's kind of cool. And it's done exactly by solving actually quadratic programs. Actually, it looks exactly like that, but with an absolute value here. And the whole idea here should be kind of obvious, right? You can design these penalty terms and objective terms and things like that."},{"start":732.88,"text":"to get something that you want, right? Like some kind of sparsity or something like that. Okay. Next up is another very simple problem. It's called signal reconstruction. It didn't stop people from running a thousand papers on it, but still, here it is. And it goes like this. So I give you a corrupted signal."},{"start":754.67,"text":"And then what you want to do is form a, you want to form an approximation of it or an uncorrupted or, you know, cleaned signal or a reconstructed signal. We're going to call that X hat. That's our variable. X corrupted is given, right? So that would be something like that. And then what you're also given is you're given phi is something like it's a regularization function or a smoothing objective. So it basically says that, it says that the larger phi is,"},{"start":784.55,"text":"the less plausible X hat is as what you're trying to reconstruct, right? So simple things would be things like a quadratic smoother. This would be the one we just talked about. It's an L1 smoother. You could take the third difference and take the L1 difference. You could put a dead zone penalty on the second difference. I mean, there's just a lot of stuff you could do with this. Okay? So this is sort of the idea."},{"start":815.24,"text":"Now, by the way, okay, so let's just take a look at how this works. So here's just a, you know, kind of a classic example for how you do signal reconstruction. Like, so here's an original signal and you can see it's like smooth or something like that. And now here we add some noise to it and it looks like that, right? And now we simply do, this is with quadratic smoothing."},{"start":841.36,"text":"which, by the way, turns out to be linear, and it turns out to be exactly classical smoothing and whatever, and all the stuff, well, in EE you would learn and stuff like that. That's what it is. So that's what that is. And basically the smoother is then, I'll go into dialect, a low-pass filter is what people would say. And someone would say, what are you doing? And you say, I'm filtering out the high-frequency noise here to estimate the..."}],"speech_gaps":[],"frame":"../frames/v010/005.webp","frame_time":700.78},{"title":"平滑与缺失数据处理","segments":[{"id":47,"text":"signal which has lots of low frequency content. So that's quasi-dialect for saying this thing is smooth and the noise added to it is much rougher.","zh":"一个包含大量低频成分的信号。所以，这是说这个东西是平滑的，而加在它上面的噪声则更加粗糙的一种类比说法。","start":867.36,"end":878.42},{"id":48,"text":"Okay? I mean, you could say that in other dialects too, right? Certainly in time series dialect, you would be able to say something like that. I don't exactly speak that dialect, so I'm not going to even attempt, but you could. Okay. And then here's some examples, right? So you have a trade-off where you're trading off two things. Like, how far do you deviate from what was given to you?","zh":"明白了吗？我的意思是，你也可以在其他方言中这样说，对吧？当然在时间序列的语境中，你可以说类似这样的话。我不太懂那种方言，所以我不打算尝试，但你可以说。明白了吗。然后这里有一些例子，对吧？所以你面临着一个权衡，你要在两个方面之间进行取舍。例如，你偏离给定数据的程度有多大？","start":879.15,"end":897.41},{"id":49,"text":"And the second term is how small is this quadratic or how big is this quadratic, or in this case quadratic, smoothing cost. And you can see, you know, this is with it with, this thing is relatively high here, this one, the quadratic component. And this is something like, you know, you might guess, I guess just by eyeball, you might say that's not enough smoothing.","zh":"第二个项是这个二次项的大小，或者说这个二次项的大小，或者说在这个情况下，平滑成本的大小。你可以看到，这个项在这里相对较高，而这个二次项的成分。这可能让你猜测，仅仅通过肉眼观察，你可能会说这还不够平滑。","start":898.04,"end":924.09},{"id":50,"text":"which means you should, depends which one you're putting the weight on, probably you're putting the weight on this, and it says you should probably decrease the weight on the smoothing regularizer, then you might get something like this, and then you might say over here, well, that's already too smoothed, or something like that. Here, by the way, you can use an obvious method to actually...","zh":"这意味着你应该怎么做，取决于你更重视哪一个，可能你更重视这个，它说你应该减少对平滑正则化项的权重，然后你可能会得到类似这样的结果，然后你可能会说在这里，这已经平滑得太多了，或者类似这样的话。顺便说一句，你可以用一种明显的方法，以一种非常有原则的方式选择平滑的程度。","start":924.74,"end":948.28},{"id":51,"text":"in a very principled way, select the amount of smoothing. You just do cross-validation here, right? So I think a lot of people who do this don't do that, which I find bizarre. But nevertheless, because it's in like your first class on statistics and machine learning, nevertheless, you could. And you do that by doing the following. What you do to do that, I'll just explain it, is over here in this one, you take the one that you're given, X corrupted.","zh":"你只需要在这里进行交叉验证，对吧？我认为很多从事这项工作的人并不这样做，这让我感到奇怪。但不管怎样，因为这是你在统计学和机器学习的第一堂课，不管怎样，你都可以这样做。你这样做是通过以下方式：你想要做到这一点，我来解释一下，就是在这里，你取给定的X，它被损坏了。","start":948.81,"end":976.57},{"id":52,"text":"And you extend this formulation to allow it to have NAs in it. So unknown, like unknown measurements. Like I didn't get a measurement for index 37, 52, 53, 62, 70. Anyway, you do that. And it's actually extremely simple if you make this a sum of squares over those. But the X hat is going to be a full one. It doesn't have any NAs in it, if you're following me.","zh":"然后你将这种形式推广，允许它包含缺失值。例如，未知的测量值。例如，我没有得到索引37、52、53、62、70的测量值。不管怎样，你这样做。实际上，如果你将这个转化为这些值的平方和，它会变得极其简单。但X的估计值将是一个完整的值，它不会有缺失值，如果你明白我的意思的话。","start":977.29,"end":999.25},{"id":53,"text":"NA meaning not a number, right? Or NAN. I think that would be the other way to say it, right? So, or question mark or whatever, or missing data, right? So then you do this. Now, once you extend this, which is unbelievably simple to handle missing data, now you can do cross-validation. And you do that by saying, thanks for your data, 10% is missing. You randomly yank out another 10% of the data, which you knew.","zh":"NA表示不是一个数字，对吧？或者NAN。我想那应该是另一种说法，对吧？所以，或者问号或者其他什么，或者缺失数据，对吧？所以然后你这么做。现在，一旦你扩展了这一点，处理缺失数据简单到令人难以置信，现在你就可以进行交叉验证。你这样做是说，谢谢你的数据，10%是缺失的。你随机抽取另外10%的数据，而这部分数据你是知道的。","start":999.62,"end":1024.53}],"notes":["本段讨论了在信号处理中如何通过平滑成本来平衡信号的平滑程度与噪声的粗糙程度。讲者提到，平滑成本的大小决定了信号的平滑程度，如果平滑成本过高，信号可能被过度平滑，而过低则可能无法有效去除噪声。"],"formulas":[],"uncertainties":[],"diagram":"none","start":867.36,"end":1024.53,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":867.36,"text":"signal which has lots of low frequency content. So that's quasi-dialect for saying this thing is smooth and the noise added to it is much rougher."},{"start":879.15,"text":"Okay? I mean, you could say that in other dialects too, right? Certainly in time series dialect, you would be able to say something like that. I don't exactly speak that dialect, so I'm not going to even attempt, but you could. Okay. And then here's some examples, right? So you have a trade-off where you're trading off two things. Like, how far do you deviate from what was given to you?"},{"start":898.04,"text":"That's this term. And the second term is how small is this quadratic or how big is this quadratic, or in this case quadratic, smoothing cost. And you can see, you know, this is with it with, this thing is relatively high here, this one, the quadratic component. And this is something like, you know, you might guess, I guess just by eyeball, you might say that's not enough smoothing."},{"start":924.74,"text":"which means you should, depends which one you're putting the weight on, probably you're putting the weight on this, and it says you should probably decrease the weight on the smoothing regularizer, then you might get something like this, and then you might say over here, well, that's already too smoothed, or something like that. Here, by the way, you can use an obvious method to actually..."},{"start":948.81,"text":"in a very principled way, select the amount of smoothing. You just do cross-validation here, right? So I think a lot of people who do this don't do that, which I find bizarre. But nevertheless, because it's in like your first class on statistics and machine learning, nevertheless, you could. And you do that by doing the following. What you do to do that, I'll just explain it, is over here in this one, you take the one that you're given, X corrupted."},{"start":977.29,"text":"And you extend this formulation to allow it to have NAs in it. So unknown, like unknown measurements. Like I didn't get a measurement for index 37, 52, 53, 62, 70. Anyway, you do that. And it's actually extremely simple if you make this a sum of squares over those. But the X hat is going to be a full one. It doesn't have any NAs in it, if you're following me."},{"start":999.62,"text":"NA meaning not a number, right? Or NAN. I think that would be the other way to say it, right? So, or question mark or whatever, or missing data, right? So then you do this. Now, once you extend this, which is unbelievably simple to handle missing data, now you can do cross-validation. And you do that by saying, thanks for your data, 10% is missing. You randomly yank out another 10% of the data, which you knew."}],"speech_gaps":[],"frame":"../frames/v010/006.webp","frame_time":879.36},{"title":"凸优化中的正则化与平滑方法","segments":[{"id":54,"text":"but isn't missing, and you pretend it's missing. Now you do signal reconstruction, and you try, you know, you try this thing, and someone at the next desk says, oh, you should try Huber, try Huber, you know, whatever. Try Huber on the third difference, and you're like, okay, dude, and you try these things. Every time you do that, you can make a prediction, which is X hat, of the values that you actually observed, but pretended you didn't. Everybody see that?","zh":"但你并没有丢失数据，你假装数据丢失了。现在你进行信号重建，你尝试这样做，你知道的，你尝试这个方法，然后隔壁的人说，哦，你应该尝试Huber方法，尝试Huber方法，不管怎样。尝试在第三阶差上使用Huber方法，你就会说，好吧，伙计，你尝试这些方法。每次你这样做，你都可以做一个预测，也就是X帽，预测你实际观察到但假装没有的数据值。大家明白了吗？","start":1025.1,"end":1051.97},{"id":55,"text":"And then we can say, thanks for your suggesting of using a Huber penalty on the third difference. Just for the record, it did a lot worse than mine. OK, so everyone, if you follow that, that's fine. And if you didn't, it's probably OK. So I mean, certainly not part of the class, this class. OK, now when you.","zh":"然后我们可以感谢你建议在第三阶差上使用Huber惩罚。顺便说一句，它比我的方法表现得要差很多。好的，大家，如果你跟上了，那很好。如果你没跟上，那也可能是正常的。我的意思是，这显然不是这门课的内容。好的，现在当你。","start":1052.49,"end":1076.37},{"id":56,"text":"When your penalty is an L1 norm on the first difference, that's actually got a name. And this is just completely standard math. It's the total variation. Literally, in continuous time, it's like the integral of the absolute value of the derivative or something like that. And so this is the analog of that. And as we actually reasoned earlier, when you...","zh":"当你对一阶差使用L1范数作为惩罚时，这其实有一个名称。这只是一个完全标准的数学概念。它被称为总变差。在连续时间中，它类似于对导数的绝对值进行积分，或者类似的东西。因此，这就是它的类比。正如我们之前实际推理的那样，当你……","start":1077.58,"end":1104.14},{"id":57,"text":"have a penalty which is like an l1 norm on a difference you should be expecting the solution to have a difference which is sparse okay which corresponds to a piecewise constant uh approximation right and so here's an example here where here's this original thing","zh":"当你对一个差值使用类似L1范数的惩罚时，你应该期望解中的差值是稀疏的，这对应于分段常数的近似。在这里，有一个例子，这就是原始的数据。","start":1104.48,"end":1124.71},{"id":58,"text":"And here's the corrupted one. And I'll come back and describe how people in some dialects would describe this. But the point is that's it. Now we're going to do L1. Sorry, this is quadratic. So in quadratic, you see you do a little bit of smoothing. And good news is the noise has gone way down.","zh":"这里是被破坏的数据。我会回来详细描述一些方言中的人如何描述这个例子。但重点是，这就是它。现在我们要使用L1范数。抱歉，这个是二次的。在二次情况下，你会进行一点平滑处理。好消息是噪声已经大大降低了。","start":1126.31,"end":1147.09},{"id":59,"text":"Bad news, you can't really see it here, but what was actually a transition in one period up here, these sharp things, are now smooth and they go down over 10, 20 periods. That's over here. When I put this amount on it, good news, this noise is attenuated more, but now you can see it's really quite smooth, right? And then this is like...","zh":"坏消息是，你在这里看不到它，但原本这里的一个周期变化，这些尖锐的特征，现在变得平滑，并且在10到20个周期内逐渐下降。这在这里。当我对它施加这个程度的惩罚时，好消息是噪声被进一步衰减，但现在你可以看到它真的非常平滑，对吧？然后这就是……","start":1148.18,"end":1168.0},{"id":60,"text":"you know, very smooth, right? So if you wanted to preserve these shifts, right, then you would use, instead of a quadratic smoother, you would use like an L1 smoother, okay? And this sort of makes sense. I was going to say, like, if you know about audio, this is just applying a low-pass filter, and what you're losing are, for example, the attack of a drum beat, right? And it would just, good news, the noise would be attenuated. Bad news,","zh":"你知道，非常平滑，对吧？所以如果你想保留这些移位，对吧，那么你就会使用，而不是二次平滑器，你会使用像L1平滑器，好吗？这种说法在某种程度上是有道理的。我本来想说，比如，如果你了解音频，这其实就是应用一个低通滤波器，而你所失去的，例如，是鼓点的起音部分，对吧？而且好消息是，噪声会被衰减。坏消息是，","start":1168.17,"end":1197.31}],"notes":["本段讲授了在信号重建中使用不同正则化方法（如Huber惩罚和L1惩罚）的对比。讲者提到，当使用L1惩罚时，解会具有稀疏的差分，对应于分段常数的近似。这与总变分（total variation）的概念相关，是凸优化中的标准方法。","讲者通过一个例子说明了使用L1惩罚和二次惩罚（平滑）的效果差异。二次惩罚会使得信号更加平滑，但会丢失一些尖锐的特征，如音频中的鼓点攻击。而L1惩罚则保留了这些特征，但会引入更多的噪声。","讲者提到，使用L1惩罚的平滑方法类似于低通滤波器，但会损失一些高频信息。这说明了在优化问题中，正则化方法的选择会影响信号的平滑程度和特征保留能力。","讲者强调，不同的正则化方法适用于不同的应用场景。例如，当需要保留信号的尖锐特征时，应使用L1惩罚；而当需要减少噪声时，应使用二次惩罚。","讲者通过类比音频信号处理，说明了正则化方法在信号重建中的实际应用。这有助于学生理解不同正则化方法的物理意义和数学背景。","讲者提到，使用Huber惩罚在某些情况下效果不如L1惩罚，这说明了在实际应用中需要根据具体问题选择合适的正则化方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1025.1,"end":1197.31,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1025.1,"text":"but isn't missing, and you pretend it's missing. Now you do signal reconstruction, and you try, you know, you try this thing, and someone at the next desk says, oh, you should try Huber, try Huber, you know, whatever. Try Huber on the third difference, and you're like, okay, dude, and you try these things. Every time you do that, you can make a prediction, which is X hat, of the values that you actually observed, but pretended you didn't. Everybody see that?"},{"start":1052.49,"text":"And then we can say, thanks for your suggesting of using a Huber penalty on the third difference. Just for the record, it did a lot worse than mine. OK, so everyone, if you follow that, that's fine. And if you didn't, it's probably OK. So I mean, certainly not part of the class, this class. OK, now when you."},{"start":1077.58,"text":"When your penalty is an L1 norm on the first difference, that's actually got a name. And this is just completely standard math. It's the total variation. Literally, in continuous time, it's like the integral of the absolute value of the derivative or something like that. And so this is the analog of that. And as we actually reasoned earlier, when you..."},{"start":1104.48,"text":"have a penalty which is like an l1 norm on a difference you should be expecting the solution to have a difference which is sparse okay which corresponds to a piecewise constant uh approximation right and so here's an example here where here's this original thing"},{"start":1126.31,"text":"And here's the corrupted one. And I'll come back and describe how people in some dialects would describe this. But the point is that's it. Now we're going to do L1. Sorry, this is quadratic. So in quadratic, you see you do a little bit of smoothing. And good news is the noise has gone way down."},{"start":1148.18,"text":"Bad news, you can't really see it here, but what was actually a transition in one period up here, these sharp things, are now smooth and they go down over 10, 20 periods. That's over here. When I put this amount on it, good news, this noise is attenuated more, but now you can see it's really quite smooth, right? And then this is like..."},{"start":1168.17,"text":"you know, very smooth, right? So if you wanted to preserve these shifts, right, then you would use, instead of a quadratic smoother, you would use like an L1 smoother, okay? And this sort of makes sense. I was going to say, like, if you know about audio, this is just applying a low-pass filter, and what you're losing are, for example, the attack of a drum beat, right? And it would just, good news, the noise would be attenuated. Bad news,"}],"speech_gaps":[],"frame":"../frames/v010/007.webp","frame_time":1037.1},{"title":"总变分平滑与图像去噪","segments":[{"id":61,"text":"the drums are muffled. I mean, that was rough, but actually correct, right? What I just said. Okay. So now we do a total variation smoothing. So total variation smoothing goes like this. This is maybe not quite enough. This is, this might be about right, but the cool part is if you take a look at it, it actually has preserved these sharp, these sharp shock. Okay. Shock. Sorry. That's from econometrics, right? So, but there, so there's a lot, this comes up in lots and lots of fields.","zh":"鼓声被模糊了。我是说，那很粗糙，但实际上是正确的，对吧？我刚才说的。好的。现在我们进行总变分平滑。总变分平滑是这样的。这可能还不够。这可能差不多是对的，但有趣的是，如果你仔细看一下，它实际上保留了这些尖锐的、这些尖锐的冲击。好的。冲击。抱歉。这是从计量经济学来的，对吧？所以，但在这里，这在很多很多领域都会出现。","start":1197.88,"end":1227.16},{"id":62,"text":"All with different dialects and names for everything. And then this one is sort of interesting. You might say that's a little bit over-regularized. And what you can see here is it's going towards what we guessed was going to happen. That you're going to get something that's piecewise constant. And it would look like this. Everybody got this?","zh":"所有这些都有不同的术语和名称。然后这个有点有趣。你可能会说这有点过度正则化了。你可以看到这里它正朝着我们猜测会发生的情况发展。你会得到一个分段常数的结果。它看起来会像这样。大家明白了吗？","start":1227.64,"end":1247.5},{"id":63,"text":"There's no mystery here. It just follows from knowing about what happens with L1 norms and things like that. Let's see, I should probably make some other, yeah. You get the same thing. You get total variation denoising, for example, in images.","zh":"这里没有谜团。它只是从了解L1范数之类的东西中得出的。让我们看看，我应该可能再做一个其他的，对吧。你会得到同样的结果。例如，你会在图像中得到总变分去噪。","start":1248.05,"end":1265.27},{"id":64,"text":"That's actually super interesting. You can do a sum of absolute values. You can take an image, let's say represented by a matrix, and you could do something like this. You could have i j plus 1, and then you would have x i j minus x i minus 1, and j.","zh":"这实际上非常有趣。你可以对绝对值求和。你可以将图像，比如说用矩阵表示，然后你可以这样做。你可以有i j加1，然后你会有x i j减去x i减1，j。","start":1266.41,"end":1290.94},{"id":65,"text":"And so you can take the L1 norm of that and then sum it over all pixels in your image. This is a very crude idea of the space gradient in the image. So it turns out a very good thing to do there. If you actually take the L1 norm of this, you actually end up with artifacts that are aligned with the axes. But if you just simply do this, this is a generalization of an absolute value. If you do...","zh":"然后你可以对这个取L1范数，并在图像的所有像素上求和。这是图像中空间梯度的一个非常粗略的想法。结果发现，在那里做L1范数是一个非常好的做法。如果你实际上对这个取L1范数，你会得到与坐标轴对齐的伪影。但如果你只是简单地这样做，这实际上是绝对值的一个推广。如果你这样做……","start":1293.27,"end":1321.67},{"id":66,"text":"If you take this objective here, let me draw that a little bit better, right? By the way, this is not squared. It is not squared. It's just the sum of the norms. Everybody got that? That's called total variation. That's a total variation penalty for images. That works like actually really well, like quite well.","zh":"如果你在这里取这个目标函数，让我把它画得更好一点，对吧？顺便说一句，这不是平方的。它不是平方的。它只是范数的和。大家明白了吗？这被称为总变分。这是图像的总变分惩罚。它实际上效果非常好，相当好。","start":1322.11,"end":1346.35},{"id":67,"text":"I mean, if you want to get into fancier ones, you can. But this is like as a first cut, this is actually really quite good. And what happens there is it preserves, it's going to preserve sharp boundaries. You know, obviously there's boundaries if I'm looking over there. Some pixels are the podium and some is the chair behind it. And there's a sharp boundary. And if I were to do this, smoothing with this.","zh":"我的意思是，如果你想尝试更高级的，你当然可以。但作为初步尝试，这实际上已经相当不错了。在那里发生的情况是，它会保留，它会保留锐利的边界。你知道，显然如果我在这里看的话，有些像素是讲台，有些是讲台后面的椅子。存在一个锐利的边界。如果我用这种方法进行平滑处理的话。","start":1346.83,"end":1370.42}],"notes":["本段讲解了总变分平滑的基本思想，即通过计算图像中相邻像素之间的差异并对其取L1范数，从而实现图像去噪。这种做法可以保留图像中的尖锐边界，避免过度平滑。","讲者提到总变分平滑是一种非常有效的图像去噪方法，其核心在于对图像梯度进行L1范数的求和，这与绝对值函数的推广有关。","在图像处理中，总变分平滑通过计算图像中每个像素与其相邻像素的差值，然后对这些差值取L1范数并求和，从而实现对图像的平滑处理。","讲者强调，总变分平滑能够保留图像中的尖锐边界，例如图像中物体与背景之间的边界，这在图像处理中非常重要。","总变分平滑的数学表达式是图像中相邻像素差值的L1范数之和，这与绝对值函数的推广有关，但不涉及平方项。","总变分平滑在图像处理中被广泛应用，因为它能够有效去除噪声，同时保留图像的边缘信息，是一种非常实用的图像处理技术。"],"formulas":[],"uncertainties":["i j plus 1, and then you would have x i j minus x i minus 1, and j"],"diagram":"none","start":1197.88,"end":1370.42,"asr_flags":[],"math_clarifications":["总变分（TV）在图像处理中通常定义为图像梯度的L1范数之和，即TV = sum_{i,j} (|x_{i,j} - x_{i-1,j}| + |x_{i,j} - x_{i,j-1}|)，而不是包含1/2系数的绝对值之和。此外，总变分作为惩罚项时，通常不包含1/2系数，且应明确其数学定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1197.88,"text":"the drums are muffled. I mean, that was rough, but actually correct, right? What I just said. Okay. So now we do a total variation smoothing. So total variation smoothing goes like this. This is maybe not quite enough. This is, this might be about right, but the cool part is if you take a look at it, it actually has preserved these sharp, these sharp shock. Okay. Shock. Sorry. That's from econometrics, right? So, but there, so there's a lot, this comes up in lots and lots of fields."},{"start":1227.64,"text":"All with different dialects and names for everything. And then this one is sort of interesting. You might say that's a little bit over-regularized. And what you can see here is it's going towards what we guessed was going to happen. That you're going to get something that's piecewise constant. And it would look like this. Everybody got this?"},{"start":1248.05,"text":"There's no mystery here. It just follows from knowing about what happens with L1 norms and things like that. Let's see, I should probably make some other, yeah. You get the same thing. You get total variation denoising, for example, in images."},{"start":1266.41,"text":"That's actually super interesting. You can do a sum of absolute values. You can take an image, let's say represented by a matrix, and you could do something like this. You could have i j plus 1, and then you would have x i j minus x i minus 1, and j."},{"start":1293.27,"text":"And so you can take the L1 norm of that and then sum it over all pixels in your image. This is a very crude idea of the space gradient in the image. So it turns out a very good thing to do there. If you actually take the L1 norm of this, you actually end up with artifacts that are aligned with the axes. But if you just simply do this, this is a generalization of an absolute value. If you do..."},{"start":1322.11,"text":"If you take this objective here, let me draw that a little bit better, right? By the way, this is not squared. It is not squared. It's just the sum of the norms. Everybody got that? That's called total variation. That's a total variation penalty for images. That works like actually really well, like quite well."},{"start":1346.83,"text":"I mean, if you want to get into fancier ones, you can. But this is like as a first cut, this is actually really quite good. And what happens there is it preserves, it's going to preserve sharp boundaries. You know, obviously there's boundaries if I'm looking over there. Some pixels are the podium and some is the chair behind it. And there's a sharp boundary. And if I were to do this, smoothing with this."}],"speech_gaps":[],"frame":"../frames/v010/008.webp","frame_time":1209.88},{"title":"总变分图像去噪与正则化过度的影响","segments":[{"id":68,"text":"I'm just doing a linear smoothing with a kernel that goes down like that, and it's going to blur things. You don't have to follow this, but if you know some of the stuff I'm talking about, that's great. People refer to that as total variation image denoising. Have people seen this? Who's seen this before?","zh":"我只是用一个像这样的核进行线性平滑，这会导致图像模糊。你们不需要跟着我，但如果你了解我正在谈论的一些内容，那就太好了。人们称这种方法为总变分图像去噪。大家有没有见过这个方法？谁以前见过？","start":1371.25,"end":1396.62},{"id":69,"text":"Somewhere. Okay, cool. In where? Pressure jumps across shock waves. Yeah, so this preserves. What happens if I use excessive regularization of this on an image? So I have a black and white image. I give it to you. And you say, I just learned about total variation, you know, whatever, denoising. And you use too much of this regularization. What do you get? Just guess.","zh":"在某个地方。好的，不错。在哪里？压力在激波中跳跃。是的，这样就能保留细节。如果我在图像上使用过多的正则化，会发生什么？我有一张黑白图像。我把它给你。你说，我刚刚学到了总变分，不管怎样，去噪。然后你使用了过多的这种正则化。你得到什么？猜猜看。","start":1397.74,"end":1427.98},{"id":70,"text":"It's zero, which is indeed very sparse, right? You have to admit that, right? Okay, so yes, if it was way too high, it would say, here's your new image. And the entire thing is just one, some grayscale value, right? Which is kind of the app.","zh":"它会变成零，这确实是非常稀疏的，对吧？你得承认这一点，对吧？好的，所以是的，如果正则化参数太高，它会说，这是你的新图像。整个图像就只是一个灰度值，对吧？这有点像应用。","start":1428.64,"end":1447.2},{"id":71,"text":"It's zero, which is indeed very sparse, right? You have to admit that, right? Okay, so yes, if it was way too high, it would say, here's your new image. And the entire thing is just one, some grayscale value, right? Which is kind of the app. Okay, everybody got that? Okay. Okay, let's crank it down to something reasonable, right? And what do you think happens? I mean, it's something like this phenomenon here, right?","zh":"它会变成零，这确实是非常稀疏的，对吧？你得承认这一点，对吧？好的，所以是的，如果正则化参数太高，它会说，这是你的新图像。整个图像就只是一个灰度值，对吧？这有点像应用。好的，大家都明白了吗？好的。好的，我们现在把参数调低到一个合理的水平，对吧？你认为会发生什么？我的意思是，这类似于这里的现象，对吧？","start":1448.88,"end":1474.76},{"id":72,"text":"What do you think, but in an image, what do you think it would, what would be the phenomenon in an image? What's that? Yeah, you'd get edges and regions with a constant grayscale value. Yeah, so actually what you'd end up getting is like cartoonish looking things, right? Because, you know, you take an image with, we never, you know, 8-bit or whatever it is, 8-bit stuff, and then you end up with like, you know, three different values, and you get regions, so.","zh":"你认为，在图像中，会发生什么现象？你认为在图像中会出现什么？这是什么？是的，你会得到边缘和具有恒定灰度值的区域。是的，实际上你最终会得到类似卡通风格的图像，对吧？因为你知道，你处理的是一张图像，无论是8位还是其他什么，然后你会得到像三个不同的值，从而形成区域。","start":1475.29,"end":1503.28},{"id":73,"text":"Okay. These are just sort of examples to give you the idea of how these things are done. Okay. Next topic, which is something we're going to talk about also in other contexts, like a statistical context, is the idea of robust approximation. So, I mean, robustness is this thing. I think we've talked about it before.","zh":"好的。这些都是为了给你一个概念，说明这些方法是如何进行的。好的。下一个主题，这在其他上下文中，比如统计学上下文中，我们也会讨论，是关于鲁棒逼近的概念。我的意思是，鲁棒性就是这个概念。我想我们之前已经讨论过这个了。","start":1503.78,"end":1523.84},{"id":74,"text":"It's a universal thing. If you do anything with math at all, then it's something you need to be aware of, right? Your model is not what you think it is. It might be really accurate if we're talking electromagnetics or photonics or E&M or Newtonian mechanics.","zh":"这是一个普遍的现象。如果你在做任何数学相关的事务，那么你都需要意识到这一点，对吧？你的模型并不是你所认为的那个模型。如果我们在谈论电磁学、光子学、电磁学或牛顿力学时，它可能非常准确。","start":1525.82,"end":1543.54}],"notes":["本段讨论了在图像处理中使用过多正则化（如L1正则化）可能导致的后果。当正则化参数过大时，图像会变得非常稀疏，最终可能只剩下单一的灰度值，这类似于将图像压缩为一个单一的灰度值。这种现象类似于在图像中过度平滑，导致图像失去细节，呈现出卡通化的视觉效果。","在图像中，过度正则化会导致图像中出现边缘和具有恒定灰度值的区域。这种现象类似于将图像分割为多个区域，每个区域具有相同的灰度值，从而形成类似卡通的视觉效果。这种效果是因为正则化过程倾向于保留图像中的边缘，同时将图像的其他部分平滑为常数。","在图像处理中，正则化参数的选择至关重要。如果参数过小，图像可能过于模糊；如果参数过大，图像可能过于稀疏，甚至失去所有细节。因此，选择合适的正则化参数是图像处理中的关键问题。","本段还提到，图像通常以8位格式存储，这意味着每个像素的灰度值范围是有限的。当正则化参数过大时，图像可能被压缩为少数几个灰度值，从而形成明显的区域划分。","在图像处理中，总变分（TV）去噪是一种常见的方法，它通过最小化图像的总变分来去除噪声。然而，如果正则化参数过大，这种方法可能导致图像失去细节，形成卡通化的视觉效果。","本段通过具体的例子说明了正则化参数对图像处理结果的影响，强调了在实际应用中需要仔细选择正则化参数的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1371.25,"end":1543.54,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1371.25,"text":"I'm just doing a linear smoothing with a kernel that goes down like that, and it's going to blur things. You don't have to follow this, but if you know some of the stuff I'm talking about, that's great. People refer to that as total variation image denoising. Have people seen this? Who's seen this before?"},{"start":1397.74,"text":"Somewhere. Okay, cool. In where? Pressure jumps across shock waves. Yeah, so this preserves. What happens if I use excessive regularization of this on an image? So I have a black and white image. I give it to you. And you say, I just learned about total variation, you know, whatever, denoising. And you use too much of this regularization. What do you get? Just guess."},{"start":1428.64,"text":"I think everyone can guess. What? Yeah, okay, sorry, yes. Not a blur. No, no. So, okay, if you... Okay, by the way, if you add too much like L1 regularization, what's the limit of that? What happens when I add like an enormous amount?"},{"start":1448.88,"text":"It's zero, which is indeed very sparse, right? You have to admit that, right? Okay, so yes, if it was way too high, it would say, here's your new image. And the entire thing is just one, some grayscale value, right? Which is kind of the app. Okay, everybody got that? Okay. Okay, let's crank it down to something reasonable, right? And what do you think happens? I mean, it's something like this phenomenon here, right?"},{"start":1475.29,"text":"What do you think, but in an image, what do you think it would, what would be the phenomenon in an image? What's that? Yeah, you'd get edges and regions with a constant grayscale value. Yeah, so actually what you'd end up getting is like cartoonish looking things, right? Because, you know, you take an image with, we never, you know, 8-bit or whatever it is, 8-bit stuff, and then you end up with like, you know, three different values, and you get regions, so."},{"start":1503.78,"text":"Okay. These are just sort of examples to give you the idea of how these things are done. Okay. Next topic, which is something we're going to talk about also in other contexts, like a statistical context, is the idea of robust approximation. So, I mean, robustness is this thing. I think we've talked about it before."},{"start":1525.82,"text":"It's a universal thing. If you do anything with math at all, then it's something you need to be aware of, right? Your model is not what you think it is. It might be really accurate if we're talking electromagnetics or photonics or E&M or Newtonian mechanics."}],"speech_gaps":[],"frame":"../frames/v010/009.webp","frame_time":1383.25},{"title":"不确定性处理与凸优化应用","segments":[{"id":75,"text":"Pretty accurate, thank you. But in other cases, it's not at all. That would be in areas like machine learning or, for that matter, finance. Your model is just a fantasy and it's not what's actually happening. Newtonian mechanics, I'd say it kind of is what's happening. E&M, your model is actually kind of what's happening. Although even there, there's questions. You might not know stuff and things like that.","zh":"相当准确，谢谢。但在其他情况下则完全不是这样。这会出现在像机器学习或者，更不用说金融这样的领域。你的模型只是幻想，它并不是实际发生的事情。牛顿力学，我认为它基本上就是实际发生的事情。电磁学，你的模型实际上基本上就是实际发生的事情。尽管即使在那里，也还存在疑问。你可能不知道一些事情，诸如此类。","start":1544.89,"end":1571.25},{"id":76,"text":"So here it is. We want to, let's say, we want an approximation problem. We want to minimize norm AX minus B. But we're going to actually address the idea that we don't know A. So, you know, you don't know A. By the way, let's talk about how do most people in practice handle uncertainty? What's the most common method for handling uncertainty? It's not fancy. Well, how do most people handle uncertainty?","zh":"现在，我们想要一个近似问题。我们想要最小化范数 AX 减去 B。但我们实际上要处理的是这样一个想法：我们并不知道 A。顺便问一下，人们在实践中是如何处理不确定性的？处理不确定性的最常见的方法是什么？它并不复杂。那么，大多数人是如何处理不确定性的？","start":1573.28,"end":1605.45},{"id":77,"text":"Right now, if we're speaking, people are doing supply. They're working out supply. I guarantee you Amazon is working out supply chains. They're deciding stuff that's going to go to various warehouses and land at fulfillment centers in the Bay Area. Obviously, they don't know. So how do they handle the uncertainty? Mostly. That's a good question. So the question is, do they have a mean and a variance for A-way? Turns out, that's not true. It's even done.","zh":"现在，如果我们谈论的是供应，人们正在处理供应。他们正在安排供应。我可以向你保证，亚马逊正在处理供应链。他们正在决定将要运往各个仓库并最终到达湾区履约中心的物品。显然，他们并不知道。那么他们是如何处理不确定性的？大部分情况下。这是一个好问题。问题是，他们是否对 A 方向有均值和方差？结果证明，这并不正确。它甚至被做了。","start":1606.9,"end":1635.5},{"id":78,"text":"What's the simplest way to handle uncertainty? I knew you guys were too... You really think things are that sophisticated? What do you do? Like a safety stock. I can't believe this. It's time for you to know something about the real world, which is horrifying. What is the simplest way to handle uncertainty? What?","zh":"处理不确定性的最简单方法是什么？我知道你们太……你们真的认为事情这么复杂吗？你们会怎么做？比如安全库存。我简直不敢相信。是时候了解一些现实世界的情况了，这令人可怕。处理不确定性的最简单方法是什么？什么？","start":1637.26,"end":1660.4},{"id":79,"text":"the guests okay now what is that oh they're getting close what does that mean yes educated yes educated okay sorry so but in particular here's what they do they just ignore it you just ignore it right i mean that's a that i guarantee you that night that's how 99 of actual uncertainty in practice is handled you're like you're like this is the demand we think for these products over the next hours and days or something like that and you're like uh","zh":"客人好，现在这是什么？哦，他们快要接近了，这代表什么？是的，受过教育的，是的，受过教育的，抱歉，但特别在这里，他们所做的就是忽略它，你只是忽略它，对吧？我的意思是，我向你保证，那晚99%的不确定性在实践中就是这样处理的。你就像这样，你就像这样，这是这些产品在未来几小时或几天内的需求，诸如此类，你就像嗯","start":1661.6,"end":1688.7},{"id":80,"text":"You just say, cool, thanks. And then you solve some big convex problem to figure out what to do. That's actually kind of what happens, right? I mean, not always. You just ignore it. By the way, ignoring it and then just go ahead and implementing it is a very bad idea. So the least you could do, and now I'll take some of these suggestions, is what? The least you can do if you ignore it, if someone says, look, here's my data.","zh":"你只是说，酷，谢谢。然后你解决一些大的凸问题来决定该怎么做。实际上，这种情况确实会发生，对吧？我是说，并不是总是如此。你只是把它忽略掉。顺便说一句，忽略它然后直接实施是一个非常糟糕的主意。那么你至少可以做的是什么？现在我会采纳一些这些建议，如果有人告诉你，看，这是我数据的话，如果你选择忽略它，至少你可以做的是什么？","start":1689.52,"end":1715.38}],"notes":["本段讨论了在实际应用中处理不确定性的方式，指出大多数情况下人们会忽略不确定性，直接使用数据进行决策。这种做法虽然常见，但可能带来严重后果，因为忽略不确定性可能导致决策失误。","讲者提到，即使在像机器学习和金融这样的领域，模型可能并不完全反映现实情况，但像牛顿力学和电磁学这样的物理模型则更接近现实。这说明不同领域对模型与现实的契合度存在差异。","在处理不确定性时，人们通常不会采用复杂的数学方法，而是通过简单的假设，如设定均值和方差，来处理问题。然而，这种做法并不总是准确，有时甚至会忽略不确定性本身。","讲者强调，忽略不确定性并直接进行决策是一种非常糟糕的做法，尤其是在面对复杂系统时。因此，即使在忽略不确定性的情况下，也应采取一些基本的措施来降低风险。","讲者提到，实际应用中，人们通常会假设某些参数的分布，如均值和方差，然后基于这些假设进行优化。这种做法虽然简单，但可能无法完全反映现实情况。","最后，讲者指出，即使在忽略不确定性的情况下，也应采取一些基本的措施，如使用凸优化方法来处理问题，以确保决策的合理性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1544.89,"end":1715.38,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1544.89,"text":"Pretty accurate, thank you. But in other cases, it's not at all. That would be in areas like machine learning or, for that matter, finance. Your model is just a fantasy and it's not what's actually happening. Newtonian mechanics, I'd say it kind of is what's happening. E&M, your model is actually kind of what's happening. Although even there, there's questions. You might not know stuff and things like that."},{"start":1573.28,"text":"So here it is. We want to, let's say, we want an approximation problem. We want to minimize norm AX minus B. But we're going to actually address the idea that we don't know A. So, you know, you don't know A. By the way, let's talk about how do most people in practice handle uncertainty? What's the most common method for handling uncertainty? It's not fancy. Well, how do most people handle uncertainty?"},{"start":1606.9,"text":"Right now, if we're speaking, people are doing supply. They're working out supply. I guarantee you Amazon is working out supply chains. They're deciding stuff that's going to go to various warehouses and land at fulfillment centers in the Bay Area. Obviously, they don't know. So how do they handle the uncertainty? Mostly. That's a good question. So the question is, do they have a mean and a variance for A-way? Turns out, that's not true. It's even done."},{"start":1637.26,"text":"What's the simplest way to handle uncertainty? I knew you guys were too... You really think things are that sophisticated? What do you do? Like a safety stock. I can't believe this. It's time for you to know something about the real world, which is horrifying. What is the simplest way to handle uncertainty? What?"},{"start":1661.6,"text":"the guests okay now what is that oh they're getting close what does that mean yes educated yes educated okay sorry so but in particular here's what they do they just ignore it you just ignore it right i mean that's a that i guarantee you that night that's how 99 of actual uncertainty in practice is handled you're like you're like this is the demand we think for these products over the next hours and days or something like that and you're like uh"},{"start":1689.52,"text":"You just say, cool, thanks. And then you solve some big convex problem to figure out what to do. That's actually kind of what happens, right? I mean, not always. You just ignore it. By the way, ignoring it and then just go ahead and implementing it is a very bad idea. So the least you could do, and now I'll take some of these suggestions, is what? The least you can do if you ignore it, if someone says, look, here's my data."}],"speech_gaps":[],"frame":"../frames/v010/010.webp","frame_time":1556.89},{"title":"处理不确定性与鲁棒性","segments":[{"id":81,"text":"And then they say, oh, the data's really, the change is quite, you know, it can be not what I'm saying, right? And you say, yeah, no problem, thanks. And they give you like, anyway, they give you like 50 different values for possible values for A, you just take the average or something like that and then go with it, right? But what should you do then? What would you do at that point? Well, at the least, yeah.","zh":"然后他们说，哦，数据真的变化很大，你知道的，它可能并不是我所说的那样，对吧？你回答说，是的，没问题，谢谢。他们给你提供大约50个可能的A值，你只需要取平均值或者其他类似的方法，然后继续下去，对吧？但这时候你应该怎么做呢？在那个点上你会怎么做呢？至少，是的。","start":1716.28,"end":1742.68},{"id":82,"text":"Yeah, you simulate it with that. So that would be probably the, I mean, the ones that I don't think are criminal, that would be an approach that's not criminal, right? If someone comes to you and says, you know, oh, I've generated samples from what I think A is. And you go, cool, thank you, right? Then you...","zh":"是的，你可以用这些数据进行模拟。这可能就是一种不构成犯罪的方法，对吧？如果有人来找你，说，你知道的，我从我认为的A中生成了样本。你回答，很好，谢谢，对吧？然后你……","start":1744.22,"end":1764.6},{"id":83,"text":"The first thing you do is you form the average of A or the median or something like that. Use it in this thing. You get an X, and then you simulate this thing across all the individual samples. Everybody following that? And by the way, if it's pretty tight, you just say done, right? So that's the latest. Okay, so...","zh":"你首先要做的是计算A的平均值或中位数之类的。然后用这个值进行模拟。你得到一个X，接着你在这个所有样本上进行模拟。大家都跟上了吗？顺便说一句，如果结果非常紧密，你就可以直接说完成了，对吧？这就是最新的方法。好的，那么……","start":1764.89,"end":1785.08},{"id":84,"text":"So there are methods for handling uncertainty. Like I said, anyone who does anything in practice anywhere is going to have regularization. They may not call it regularization. They might call it robustness. That would be one name for it. It's got lots of names. But you can't make anything practical work without addressing...","zh":"处理不确定性的方法有很多种。正如我之前所说，任何在实践中做任何事情的人都会使用正则化。他们可能不会称之为正则化，他们可能会称之为鲁棒性。这可以是其中的一个名称。它有很多名称。但你不能在不处理……","start":1788.25,"end":1806.23},{"id":85,"text":"without addressing this uncertainty somehow. Actually, all of regularization in machine learning statistics, all of it is nothing but addressing uncertainty like this in data and stuff like that. Okay, so we'll look at a couple. Now we're going to look at fancy methods for doing this.","zh":"不处理这种不确定性的情况下做出任何实际可行的东西。实际上，机器学习统计中的所有正则化，全部都是在处理数据和其他类似问题中的不确定性。好的，那么我们将看看几种方法。现在我们将看看一些更高级的方法来处理这个问题。","start":1807.42,"end":1829.22},{"id":86,"text":"Well, there's different approaches. I think we saw these in some very early examples. So one is stochastic, right? So you say A comes from a distribution. They come from a name distribution. Or you could have, who knows, it could actually be something from which you can sample A's if you have a fancy model for it, right? That would be something. Another, actually probably better defensible, is...","zh":"有不同的方法。我想我们在一些非常早期的例子中已经看到了这些方法。其中一种是随机的，对吧？你说A来自一个分布。它们来自一个命名分布。或者你也可以有，谁知道呢，如果你有一个复杂的模型，你实际上可以从该模型中采样A的值，对吧？这会是一个方法。另一种，实际上可能更有说服力的是……","start":1831.15,"end":1854.79},{"id":87,"text":"You estimate A. A is itself. There's a whole department that's estimating A. By A, I just mean the model, right? Or people say the forward model. The whole department doing it. And they could do things like what you do is you say to them, don't give me one model. Give me 50 plausible models. And what they would then do is they would say, cool, if you're going with one, here's the A we think you should use. But here's 50 others.","zh":"你估计A。A本身就是一个模型。整个部门都在估计A。这里的A，我指的是模型，对吧？或者说，人们称之为前向模型。整个部门都在做这件事。他们可能会做类似的事情，比如你告诉他们，不要给我一个模型，给我50个合理的模型。然后他们会说，好的，如果你要选一个，这里是我们认为你应该使用的A。但这里还有另外50个模型。","start":1855.92,"end":1879.52}],"notes":["本段讨论了在面对不确定性时，如何通过平均或中位数等方法处理数据中的变化。讲者提到，当有多个可能的A值时，可以取平均值或中位数，并通过模拟来验证结果。如果结果足够紧密，就可以停止处理。","讲者指出，处理不确定性是实际应用中不可或缺的一部分，通常被称为正则化或鲁棒性。所有机器学习中的正则化方法本质上都是在处理数据中的不确定性。","讲者提到，处理不确定性有多种方法，包括随机方法（stochastic approach）和估计方法。随机方法假设A来自某种分布，而估计方法则通过生成多个可能的模型来处理不确定性。","讲者强调，实际应用中必须处理不确定性，否则无法构建有效的模型。他提到，即使不使用正则化术语，实际应用中也会通过鲁棒性来应对不确定性。","讲者提到，当有多个可能的模型时，可以生成多个模型并选择一个最合适的。这种方法在实际应用中更为合理，因为它考虑了多种可能性。","讲者最后指出，处理不确定性是构建可靠模型的关键，无论使用何种方法，都必须考虑数据中的不确定性。"],"formulas":[],"uncertainties":["name distribution"],"diagram":"none","start":1716.28,"end":1879.52,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1716.28,"text":"And then they say, oh, the data's really, the change is quite, you know, it can be not what I'm saying, right? And you say, yeah, no problem, thanks. And they give you like, anyway, they give you like 50 different values for possible values for A, you just take the average or something like that and then go with it, right? But what should you do then? What would you do at that point? Well, at the least, yeah."},{"start":1744.22,"text":"Yeah, you simulate it with that. So that would be probably the, I mean, the ones that I don't think are criminal, that would be an approach that's not criminal, right? If someone comes to you and says, you know, oh, I've generated samples from what I think A is. And you go, cool, thank you, right? Then you..."},{"start":1764.89,"text":"The first thing you do is you form the average of A or the median or something like that. Use it in this thing. You get an X, and then you simulate this thing across all the individual samples. Everybody following that? And by the way, if it's pretty tight, you just say done, right? So that's the latest. Okay, so..."},{"start":1788.25,"text":"So there are methods for handling uncertainty. Like I said, anyone who does anything in practice anywhere is going to have regularization. They may not call it regularization. They might call it robustness. That would be one name for it. It's got lots of names. But you can't make anything practical work without addressing..."},{"start":1807.42,"text":"without addressing this uncertainty somehow. Actually, all of regularization in machine learning statistics, all of it is nothing but addressing uncertainty like this in data and stuff like that. Okay, so we'll look at a couple. Now we're going to look at fancy methods for doing this."},{"start":1831.15,"text":"Well, there's different approaches. I think we saw these in some very early examples. So one is stochastic, right? So you say A comes from a distribution. They come from a name distribution
