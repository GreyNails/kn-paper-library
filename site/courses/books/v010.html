f you look up here, it's actually super interesting.","zh":"因此，这解释了为什么L1估计实际上会比另一个方法更加稳健，对吧？因为你基本上是在假设你的噪声具有厚尾分布，对吧？哦，而且这其实也很有趣。这不是主要观点，但如果你向上看，这实际上非常有趣。","start":3666.72,"end":3687.42},{"id":178,"text":"right? So if you zoom in on a Gaussian, it's uniform density at the top, right? It just looks, it's uniform, right? And you're saying, well, what that means is like, I don't, you know, it means once your residual is smaller than when you zoom in and the Gaussian looks like it's flat, once your residual is in there, like you don't care if it's like 0.01 or minus 0.03, you couldn't care less. They're all equally likely, statistically speaking, they're all reasonable. Everybody see what I'm saying? For a","zh":"对吧？所以如果你放大一个高斯分布，顶部是均匀密度，对吧？看起来它就是均匀的，对吧？你可能会说，这意味着什么呢？比如说，一旦你的残差小于你放大后看到的高斯分布看起来是平坦的区域，一旦你的残差处于这个范围内，比如是0.01或者-0.03，你都不会在意。从统计学的角度来看，它们都是等可能的，都是合理的。大家明白我的意思吗？对于一个","start":3688.16,"end":3716.28}],"notes":["本段讲解了L1估计相较于L2估计在处理大残差时的鲁棒性。讲者指出，L2估计对大残差非常敏感，因为其平方项会放大这些残差的影响，而L1估计由于使用绝对值，对大残差的敏感度较低，因此更鲁棒。","讲者通过噪声分布的假设来解释这种鲁棒性差异。如果噪声服从拉普拉斯分布（具有厚尾），则出现三倍标准差的事件概率较高，而高斯分布下这种事件概率极低，因此L1估计更适合处理这种厚尾噪声。","讲者进一步说明，当残差较小时，高斯分布的密度函数在局部区域近似为均匀分布，这意味着残差在该区域内的变化对估计结果影响不大，因此L1估计在处理这类噪声时表现更稳定。","讲者提到，L1估计的鲁棒性来源于其对噪声分布的假设，即噪声具有厚尾特性，这与高斯分布的薄尾特性形成对比。这种假设直接影响了估计方法的选择。","讲者通过图像的局部放大来说明高斯分布的密度函数在小残差区域的特性，强调了残差在该区域内的变化对估计结果影响较小，从而支持了L1估计的鲁棒性。","讲者最后指出，L1估计的鲁棒性是其在处理厚尾噪声时的优势，而L2估计则更适合处理高斯噪声，这种选择取决于对噪声分布的假设。"],"formulas":[{"latex":"L_1 \\text{ estimation}","symbols":"L1估计","explanation":"保留原始公式，L1估计是正确的术语，无需修改。","evidence":"One, let's focus on the large residuals, right? You'd say, well, least squares is going to be very sensitive to large residuals. Like it really doesn't like them because it squares them, right? And you'd say, by contrast, L1 is going to be much more chill. Everybody got what I'm saying? And so you'd say, and what does that mean? And you go, well, what it means is that when you do L1 estimation, it's much less sensitive to outliers. That's what it means."},{"latex":"L_2 \\t s them, right? And you'd say, by contrast, L1 is going to be much more chill. Everybody got what I'm saying? And so you'd say, and what does that mean? And you go, well, what it means is that when you do L1 estimation, it's much less sensitive to outliers. That's what it means."},{"start":3591.84,"text":"So it's a robust estimator, actually, literally in the statistics sense, right? So it's a robust estimator, okay? What's cool is you get the same, you can argue it here. You could say, well, the difference between like L2 fitting and L1 approximation, you say the difference is actually basically this. It's a difference between whether you believe the noise density looks like this or looks like this, right?"},{"start":3620.05,"text":"That's a pretty bad job. It's a horrible Gaussian, but you get the idea, right? So it looks like that. And actually, you pick everything off from this, right? Like you would say, look, if you thought your noises were Laplacian, then the probability of like a three sigma event is not insignificant."},{"start":3640.14,"text":"I mean, you could expect to have a noise which is like three times the standard deviation, right? That's the whole point, right? Or four times, right? Or something in there. It can happen. Gaussian can't happen. I mean, kind of, you know what I mean, right? It's extremely unlikely, right? So you'd say, so if I were you, your estimation, if it's going to work well, it cannot be sensitive to these large noises. Everybody following this? So that's why."},{"start":3666.72,"text":"So that explains why L1 estimation would be actually more robust than the other one, right? Because you're basically fitting with the presumption that your noises have fat tails, right? So, oh, and this is actually interesting too. This is not the main point, but if you look up here, it's actually super interesting."},{"start":3688.16,"text":"right? So if you zoom in on a Gaussian, it's uniform density at the top, right? It just looks, it's uniform, right? And you're saying, well, what that means is like, I don't, you know, it means once your residual is smaller than when you zoom in and the Gaussian looks like it's flat, once your residual is in there, like you don't care if it's like 0.01 or minus 0.03, you couldn't care less. They're all equally likely, statistically speaking, they're all reasonable. Everybody see what I'm saying? For a"}],"speech_gaps":[],"frame":"../frames/v010/022.webp","frame_time":3577.28},{"title":"Huber拟合与最大似然解释","segments":[{"id":179,"text":"For a Laplacian noise, that's not the case, right? As a matter of fact, there's a sharp peak, and actually being zero is actually quite likely. And that explains also why you get weird, you know, the sparsity and stuff like that. Okay, so does this all make sense? And let's do one more just for fun. And you can turn this backwards and forwards. So let's do one more. You tell me, suppose someone says, I'm going to use Huber fitting. That looks like this. It's quadratic up to some threshold, and then it goes linear.","zh":"对于拉普拉斯噪声，情况并非如此，对吧？实际上，有一个尖锐的峰值，实际上值为零的可能性相当高。这也解释了为什么你会得到一些奇怪的结果，比如稀疏性之类的东西。好的，那么这一切都有道理吗？我们再来做一个，只是为了好玩。你可以反过来思考。我们再来做一个。你告诉我，假设有人说，我要使用Huber拟合。看起来像这样。它在某个阈值内是二次的，然后变为线性。","start":3717.43,"end":3747.54},{"id":180,"text":"Okay? So there's Huber fitting. And someone says, why are you doing that? And you go, well, because it's like, I want to do least squares, but I want to be insensitive to occasional weird large noises. Right? Done. That's more than a good enough explanation. But suppose you wanted to defend it statistically. In fact, how would you describe it? How would you say, what is Huber fitting when you're doing it statistically? How do you describe it? What is it in terms of maximum likelihood? How do you translate it to that dialect?","zh":"明白了？所以这就是Huber拟合。有人问，你为什么这么做？你会回答，因为我想做最小二乘法，但我想对偶尔出现的异常大噪声不敏感。对吧？好了。这已经是一个足够好的解释了。但假设你想从统计学的角度来辩护。事实上，你如何描述它？你如何说，当你在做统计学时，Huber拟合是什么？你如何描述它？它在最大似然的意义下是什么？你如何将其转换为这种语言？","start":3748.15,"end":3776.26},{"id":181,"text":"What's Huber fitting with? I mean, what maximum likelihood problem does it correspond to? It's not a mixture. It's close, right? It's actually pretty close to a mixture, but it's not. It's actually a weird, it says, oh, I'm doing maximum likelihood estimation. You go, with what density of noise density? And they would say, well, it's this weird Frankenstein density that looks like this.","zh":"Huber拟合基于什么？我的意思是，它对应的是什么样的最大似然问题？它不是一个混合分布。它很接近，对吧？它实际上非常接近一个混合分布，但并不是。它实际上是一个奇怪的分布，它说，哦，我在做最大似然估计。你回答，基于什么噪声密度？他们会说，这是一种奇怪的Frankenstein密度，看起来像这样。","start":3779.97,"end":3811.16},{"id":182,"text":"It is, it looks like this. It's a Gaussian, right? It's actually e to the minus this, right? So it's actually literally exactly a Gaussian, right? Out to some threshold. And then you glue onto it an exponential tail. Everybody got that? Because that's what the exp of the Huber thing is, right? You have to normalize it, but who cares, right? But it looks like that. Everyone agree?","zh":"是的，它看起来像这样。它是一个高斯分布，对吧？它实际上是 e 的负指数，对吧？所以它实际上就是精确的高斯分布，对吧？在某个阈值内。然后你把它和一个指数尾部连接起来。大家明白了吗？因为这就是Huber方法的指数部分，对吧？你必须对其进行归一化，但谁在乎呢，对吧？但它看起来就是这样。大家同意吗？","start":3811.77,"end":3836.4},{"id":183,"text":"And someone said, well, what are you doing? And you go, I'm doing maximum likelihood estimation. And you go, then why aren't you using it? You say it's pretty much Gaussian, but I'm going to use Huber instead. And they'd say, what does that mean? And you say, well, what it really means is I'm assuming that my noise density, this thing would go way down. I mean, I'd have to adjust things to get the normalization right, but whatever. The density is proportional to this. So what you do is you just take a Gaussian, cut it, and then glue on.","zh":"有人问，你到底在做什么？你会回答，我在做最大似然估计。然后他们会问，那你为什么不用最大似然估计呢？你会说，这基本上就是高斯分布，但我还是选择用Huber方法。他们又会问，这到底是什么意思？你会回答，其实这意味着我假设我的噪声密度，这个函数会急剧下降。我的意思是，我需要调整一些参数以确保归一化正确，但不管怎样，密度与这个函数成比例。所以你所做的就是取一个高斯分布，把它截断，然后接上一个指数尾部。","start":3836.96,"end":3864.68},{"id":184,"text":"exponential tails. If you do maximum likelihood estimation, congratulations, you're doing Huber fitting. Everybody got this? Make sense? So there's lots of ways to understand exactly the same thing, right? What if I did fitting with a, I don't know, here, with a dead zone linear penalty? That's maximum likelihood for what?","zh":"如果你进行最大似然估计，恭喜你，你实际上是在进行Huber拟合。大家明白了吗？有没有道理？所以有很多方法可以理解完全相同的概念，对吧？如果我用一种不同的拟合方法，比如这里有一个死区线性惩罚项，那这对应的是哪种最大似然估计呢？","start":3865.21,"end":3894.31}],"notes":["本段讲解了Huber拟合与最大似然估计之间的关系。讲者指出，Huber拟合可以被看作是一种混合密度模型，它结合了高斯分布和指数分布的特性。具体来说，Huber拟合在某个阈值内使用高斯分布，而在阈值之外使用指数分布。这种结构使得Huber拟合对异常值具有鲁棒性，同时保留了高斯分布的某些特性。","讲者进一步解释了如何将Huber拟合转化为最大似然估计问题。他指出，Huber拟合对应的最大似然估计问题中，噪声密度是一个由高斯分布和指数分布组合而成的密度函数。这种密度函数在阈值内与高斯分布相似，而在阈值外则具有指数衰减的特性。","讲者强调，虽然Huber拟合看起来像是一种混合模型，但它并不是严格意义上的混合分布。这是因为Huber拟合的密度函数在阈值处是连续的，而混合分布通常在不同成分之间存在断点。因此，Huber拟合更准确地说是一种连续的密度函数，它结合了高斯分布和指数分布的特性。","讲者还提到，当使用Huber拟合时，需要对密度函数进行归一化处理。虽然归一化过程可能需要调整参数，但讲者指出，这种调整并不影响拟合的基本思想。归一化后的密度函数仍然保持了高斯分布和指数分布的特性。","最后，讲者通过提问的方式引导听众思考，如果使用一种具有“死区”的线性惩罚函数进行拟合，这种拟合方法对应的最大似然估计问题是什么。这表明，Huber拟合的思路可以推广到其他类型的惩罚函数，从而形成不同的鲁棒估计方法。","讲者通过这些讲解，帮助听众理解Huber拟合的统计意义，并展示了如何将这种拟合方法与最大似然估计框架联系起来。这种联系不仅加深了对Huber拟合的理解，也为后续学习其他鲁棒估计方法奠定了基础。"],"formulas":[],"uncertainties":["exponential tails"],"diagram":"none","start":3717.43,"end":3894.31,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3717.43,"text":"For a Laplacian noise, that's not the case, right? As a matter of fact, there's a sharp peak, and actually being zero is actually quite likely. And that explains also why you get weird, you know, the sparsity and stuff like that. Okay, so does this all make sense? And let's do one more just for fun. And you can turn this backwards and forwards. So let's do one more. You tell me, suppose someone says, I'm going to use Huber fitting. That looks like this. It's quadratic up to some threshold, and then it goes linear."},{"start":3748.15,"text":"Okay? So there's Huber fitting. And someone says, why are you doing that? And you go, well, because it's like, I want to do least squares, but I want to be insensitive to occasional weird large noises. Right? Done. That's more than a good enough explanation. But suppose you wanted to defend it statistically. In fact, how would you describe it? How would you say, what is Huber fitting when you're doing it statistically? How do you describe it? What is it in terms of maximum likelihood? How do you translate it to that dialect?"},{"start":3779.97,"text":"What's Huber fitting with? I mean, what maximum likelihood problem does it correspond to? It's not a mixture. It's close, right? It's actually pretty close to a mixture, but it's not. It's actually a weird, it says, oh, I'm doing maximum likelihood estimation. You go, with what density of noise density? And they would say, well, it's this weird Frankenstein density that looks like this."},{"start":3811.77,"text":"It is, it looks like this. It's a Gaussian, right? It's actually e to the minus this, right? So it's actually literally exactly a Gaussian, right? Out to some threshold. And then you glue onto it an exponential tail. Everybody got that? Because that's what the exp of the Huber thing is, right? You have to normalize it, but who cares, right? But it looks like that. Everyone agree?"},{"start":3836.96,"text":"And someone said, well, what are you doing? And you go, I'm doing maximum likelihood estimation. And you go, then why aren't you using it? You say it's pretty much Gaussian, but I'm going to use Huber instead. And they'd say, what does that mean? And you say, well, what it really means is I'm assuming that my noise density, this thing would go way down. I mean, I'd have to adjust things to get the normalization right, but whatever. The density is proportional to this. So what you do is you just take a Gaussian, cut it, and then glue on."},{"start":3865.21,"text":"exponential tails. If you do maximum likelihood estimation, congratulations, you're doing Huber fitting. Everybody got this? Make sense? So there's lots of ways to understand exactly the same thing, right? What if I did fitting with a, I don't know, here, with a dead zone linear penalty? That's maximum likelihood for what?"}],"speech_gaps":[],"frame":"../frames/v010/023.webp","frame_time":3729.43},{"title":"概率密度与逻辑回归建模","segments":[{"id":185,"text":"What's your noise density for that? Yeah, you say, well, my noise is this. It's actually flat. It's a uniform over some interval. And then that's some fraction of the probability. And then I glue on exponential tails. So you'd say, actually, between plus and minus 0.1, it's just uniform. I mean, you're equally likely to have anything in there in the noise.","zh":"你的噪声密度是什么？是的，你会说，我的噪声是这样的。实际上它是平坦的，是在某个区间上的均匀分布。然后这是概率的一部分。然后你再在两端加上指数尾部。所以你会说，实际上在正负0.1之间，它只是均匀分布的。我的意思是，在这个噪声范围内，任何值出现的可能性是相等的。","start":3900.1,"end":3929.44},{"id":186,"text":"and you'd say occasionally though you get some big big things and those are these exponential tails you glued on right everybody so all all make sense so okay um okay we'll look at uh just a a couple of others um so logistic regression which i i very much hope many people have seen but um anyway and it's the same sort of thing right you would you would say um i have a uh here um","zh":"不过偶尔你也会遇到一些非常大的值，这些就是你刚才粘贴上的指数尾部，对吧？所以所有这些都讲得通，嗯，嗯，我们来看看其他几个例子，嗯，逻辑回归，我希望很多人已经见过，不过不管怎样，它和之前的情况是类似的，对吧？你会说，我有一个随机变量，取值为0或1，取值为1的概率是这个东西的逻辑函数，","start":3929.98,"end":3959.19},{"id":187,"text":"Have a random variable takes value 0 1 and the probability being 1 is a logistic of this thing Which is an affine function of some features or explanatory variables that you can see, right? So that's what it would be And so that is the and here you would say something like, you know conditioned on you you'd say the density","zh":"有一个随机变量取值为0和1，取值为1的概率是这个东西的逻辑函数，也就是某些特征或解释变量的仿射函数，对吧？所以这就是它的情况。在这里，你会说一些类似的话，比如，已知你的情况下，你会说这个密度","start":3959.74,"end":3984.51},{"id":188,"text":"or sorry, the probability mass function, or just the probability that it's one, right? It depends on a parameter, which is a and b, right? And if you just take the, you know, if you take the log of this, you end up with this thing, and it comes down here, and you can see immediately that this is going to be concave, right? Because this is, that's affine, right? And then this is log sum x, because this is exp of zero, right? So this is log sum x, right?","zh":"或者抱歉，是概率质量函数，或者只是它为1的概率，对吧？它取决于一个参数，即a和b，对吧？如果你对这个取对数，你会得到这个东西，然后它会下降到这里，你可以立刻看出这个是凹函数，对吧？因为这是仿射函数，对吧？然后这是log sum x，因为这是exp零，对吧？所以这就是log sum x，对吧？","start":3985.29,"end":4012.07},{"id":189,"text":"I think that's a logistic loss, right? And with a minus sign, it becomes concave and affine is concave, right? So that's a, I mean, I'm sure people have seen this, right? So that's the idea. So that's logistic modeling. And then, you know, this would just be like a little baby example, right? So the example is here I have one explanatory variable u.","zh":"我想这就是逻辑损失，对吧？加上负号后，它就变成了凹函数，而仿射函数也是凹函数，对吧？所以这就是，我的意思是，我相信大家已经见过这个了，对吧？这就是这个想法。这就是逻辑建模。然后，你知道的，这只是一个小小的例子，对吧？所以例子是，我有一个解释变量u。","start":4013.04,"end":4035.78},{"id":190,"text":"right? Which might be, you know, age or, I don't know, I'm just making this up, right? Age, and this is the, I don't know, the probability that when you're admitted for something to the ER, you're, I don't know, you survive. I mean, I'm just making this up, but that would be it, right? So, oh, it looks like young people don't do very well and older people do pretty well. Maybe this is the, maybe that's the probability that you don't survive. How about that? Then this makes sense. Then it has the right.","zh":"对吧？这可能是年龄，或者，我也不确定，我只是随便举个例子，对吧？年龄，这是当你被送进急诊室时，你存活的概率，我也不确定，我只是随便说说，对吧？所以，哦，看起来年轻人表现得并不好，而老年人表现得相当好。也许这就是你无法存活的概率。这样如何？那这就说得通了。然后它就有了正确的含义。","start":4036.79,"end":4062.69}],"notes":["本段首先讨论了噪声密度的构建，指出噪声密度可以是均匀分布，然后在区间外附加指数尾部。接着，课程转向逻辑回归建模，介绍了逻辑回归的基本概念，即随机变量取值为0或1，其概率由逻辑函数决定，该函数是特征的仿射函数。"],"formulas":[{"l here you would say something like, you know conditioned on you you'd say the density"},{"start":3985.29,"text":"or sorry, the probability mass function, or just the probability that it's one, right? It depends on a parameter, which is a and b, right? And if you just take the, you know, if you take the log of this, you end up with this thing, and it comes down here, and you can see immediately that this is going to be concave, right? Because this is, that's affine, right? And then this is log sum x, because this is exp of zero, right? So this is log sum x, right?"},{"start":4013.04,"text":"I think that's a logistic loss, right? And with a minus sign, it becomes concave and affine is concave, right? So that's a, I mean, I'm sure people have seen this, right? So that's the idea. So that's logistic modeling. And then, you know, this would just be like a little baby example, right? So the example is here I have one explanatory variable u."},{"start":4036.79,"text":"right? Which might be, you know, age or, I don't know, I'm just making this up, right? Age, and this is the, I don't know, the probability that when you're admitted for something to the ER, you're, I don't know, you survive. I mean, I'm just making this up, but that would be it, right? So, oh, it looks like young people don't do very well and older people do pretty well. Maybe this is the, maybe that's the probability that you don't survive. How about that? Then this makes sense. Then it has the right."}],"speech_gaps":[],"frame":"../frames/v010/024.webp","frame_time":3912.1},{"title":"最大似然估计与逻辑回归","segments":[{"id":191,"text":"flavor, right? So, okay. And so, you know, these dots are your sample, the data you have, right? You'd say, you know, here's someone who was 63, didn't survive. Here's someone who's 27, did survive or something like that, that kind of thing. That's the data. And, you know, your eyeball would look at it and say, look.","zh":"味道，对吧？所以，好的。你明白，这些点是你样本，也就是你拥有的数据，对吧？你会说，比如，这里有一个63岁的人，没有存活。这里有一个27岁的人，存活了，或者其他类似的情况，这种就是数据。你用眼睛看一下，会说，看。","start":4063.17,"end":4081.75},{"id":192,"text":"you know, the probability of being one is higher when you is large. But, you know, there's things that are not obvious. Like, you know, like, how about there? There's someone like really old and for whatever reason, they survived, right? Or something like that. I'm just making this up. Okay.","zh":"你知道，当你的数值较大时，成为一类的概率更高。但你知道，有些事情并不明显。比如，比如，这里有没有人特别老，但因为某种原因存活了，对吧？或者其他类似的情况。我只是在编造例子。好的。","start":4082.19,"end":4097.55},{"id":193,"text":"And if you fit, now that's just a convex problem to fit it, and you would fit it, and you'd end up with this curve here, right? So it looks like that, this curve here. It kind of makes sense. Let me ask you a couple of questions about this. What if the data actually looked like this?","zh":"如果你拟合，现在这只是一个凸问题，你可以拟合它，最终你会得到这条曲线，对吧？所以它看起来像这样，这条曲线。这在某种程度上是合理的。让我问你几个关于这个问题的问题。如果数据实际上看起来像这样呢？","start":4099.32,"end":4118.16},{"id":194,"text":"What if the data looked like this? Here's u, and suppose it looked like here's 1, and here's 0. And suppose there's a whole bunch of points along here, right? And then there's a whole bunch of points along here. So a couple of questions. What does it mean? Tell me about the maximum likelihood problem, and let's just talk about that. So what does it mean? This means, look, everyone less than 32 survived. No one above that age survived, okay? So you tell me what.","zh":"如果数据看起来像这样呢？这里有一个u，假设它看起来像这里有一个1，这里有一个0。并且假设这里有一大堆点，对吧？然后这里也有一大堆点。那么有几个问题。这意味着什么？告诉我关于最大似然问题的情况，我们只谈这个。那么这意味着什么？这表示，看，所有小于32岁的人存活了。没有人超过这个年龄存活了，对吧？你告诉我什么。","start":4122.22,"end":4159.79},{"id":195,"text":"Like, what does it mean? I mean, there's so many ways to say this in different dialects. It's, yeah. Yeah, you would say that the data are linearly separable, right? Okay. How about the, what about the logistic? The, sorry, the log likelihood. Suppose I asked you to maximize the log likelihood here. Again, you can just guess, or you might know, but what do you think is going to happen? Any guesses?","zh":"比如，这意味着什么？我的意思是，有无数种方式用不同的方言来表达这个意思。是的。是的，你会说数据是线性可分的，对吧？好的。那关于逻辑回归呢？抱歉，是关于对数似然。假设我问你在这里最大化对数似然，你会怎么做？你可以随意猜测，或者你可能知道，但你认为会发生什么？有什么猜测吗？","start":4160.22,"end":4196.44},{"id":196,"text":"Well, how should I draw the, your actual, I'll draw the logistic map corresponding to the maximum likelihood. What's it going to look like? Yeah. Okay. I'll take your, it's going to look like this, right? It's going to have a super sharp like that, right? Okay. How sharp is this going to be?","zh":"那么，我应该怎么画出，你的实际，我会画出对应最大似然的逻辑映射。它会看起来像什么？是的。好的。我会采纳你的，它会看起来像这样，对吧？它会有一个非常尖锐的形状，对吧？好的。这个尖锐程度会有多高？","start":4197.3,"end":4216.39},{"id":197,"text":"infinitely sharp because the less sharp you make this you start dropping the probability here","zh":"无限尖锐，因为如果你让这个尖锐程度降低，你就会在这里降低概率","start":4217.83,"end":4222.75},{"id":198,"text":"but you know everyone over age 33 survived so that's that's you're losing you're losing log","zh":"但你知道所有33岁以上的人都幸存了，所以这就是你正在失去的对数似然，你正在失去对数似然","start":4222.75,"end":4228.21},{"id":199,"text":"likelihood right and the other thing too is if you make this less than infinitely","zh":"另一个问题是如果你让这个斜率小于无限大","start":4228.21,"end":4232.45},{"id":200,"text":"infinite slope here then you know you're short changing the predictions here right so in this","zh":"在这里你就会低估预测值，对吧，所以在这种","start":4232.45,"end":4239.51}],"notes":["本段讨论了最大似然估计在逻辑回归中的应用，特别是当数据具有线性可分性时，最大似然估计会趋向于无限陡峭的决策边界。讲者指出，当数据完全线性可分时，最大似然估计的对数似然函数会变得无限陡峭，这会导致模型对数据的拟合变得极端。","讲者通过一个年龄与生存状态的例子来说明这一现象。当所有年龄大于33岁的个体都存活时，模型会倾向于将决策边界设置在年龄33岁处，从而使得对数似然函数的梯度变得无限大。","讲者进一步指出，如果决策边界不够陡峭（即斜率不是无限大），则会损失对数似然函数的值，从而影响模型对数据的预测能力。这表明在完全线性可分的情况下，最大似然估计的决策边界会趋向于无限陡峭。","讲者还提到，当数据完全线性可分时，逻辑回归模型的对数似然函数会趋向于无限大，这在实际应用中可能导致数值计算上的问题，例如梯度爆炸。","讲者通过一个具体的例子说明了这一现象：当所有年龄大于33岁的个体都存活时，模型会将决策边界设置在年龄33岁处，从而使得对数似然函数的梯度变得无限大。","讲者强调，当数据完全线性可分时，最大似然估计的决策边界会趋向于无限陡峭，这在实际应用中可能导致数值计算上的问题，例如梯度爆炸。"],"formulas":[],"uncertainties":["infinitely sharp","you're losing you're losing log","less than infinitely","infinite slope here"],"diagram":"none","start":4063.17,"end":4239.51,"asr_flags":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":4063.17,"text":"flavor, right? So, okay. And so, you know, these dots are your sample, the data you have, right? You'd say, you know, here's someone who was 63, didn't survive. Here's someone who's 27, did survive or something like that, that kind of thing. That's the data. And, you know, your eyeball would look at it and say, look."},{"start":4082.19,"text":"you know, the probability of being one is higher when you is large. But, you know, there's things that are not obvious. Like, you know, like, how about there? There's someone like really old and for whatever reason, they survived, right? Or something like that. I'm just making this up. Okay."},{"start":4099.32,"text":"And if you fit, now that's just a convex problem to fit it, and you would fit it, and you'd end up with this curve here, right? So it looks like that, this curve here. It kind of makes sense. Let me ask you a couple of questions about this. What if the data actually looked like this?"},{"start":4122.22,"text":"What if the data looked like this? Here's u, and suppose it looked like here's 1, and here's 0. And suppose there's a whole bunch of points along here, right? And then there's a whole bunch of points along here. So a couple of questions. What does it mean? Tell me about the maximum likelihood problem, and let's just talk about that. So what does it mean? This means, look, everyone less than 32 survived. No one above that age survived, okay? So you tell me what."},{"start":4160.22,"text":"Like, what does it mean? I mean, there's so many ways to say this in different dialects. It's, yeah. Yeah, you would say that the data are linearly separable, right? Okay. How about the, what about the logistic? The, sorry, the log likelihood. Suppose I asked you to maximize the log likelihood here. Again, you can just guess, or you might know, but what do you think is going to happen? Any guesses?"},{"start":4197.3,"text":"Well, how should I draw the, your actual, I'll draw the logistic map corresponding to the maximum likelihood. What's it going to look like? Yeah. Okay. I'll take your, it's going to look like this, right? It's going to have a super sharp like that, right? Okay. How sharp is this going to be?"},{"start":4217.83,"text":"infinitely sharp because the less sharp you make this you start dropping the probability here"},{"start":4222.75,"text":"but you know everyone over age 33 survived so that's that's you're losing you're losing log"},{"start":4228.21,"text":"likelihood right and the other thing too is if you make this less than infinitely"},{"start":4232.45,"text":"infinite slope here then you know you're short changing the predictions here right so in this"}],"speech_gaps":[],"frame":"../frames/v010/025.webp","frame_time":4075.17},{"title":"假设检验与随机检测器","segments":[{"id":201,"text":"case this is precisely the case when the log likelihood is unbounded above","zh":"这种情况正是当对数似然在上方无界时的情况","start":4239.51,"end":4245.29},{"id":202,"text":"above, right? So this is extremely common in models, right? If a log-likelihood is unbounded","zh":"对吧？所以这种情况在模型中非常常见，对吧？如果对数似然在上方无界","start":4246.09,"end":4250.77},{"id":203,"text":"above, it means they're separable and stuff like that, right? So, of course, this is fixed","zh":"这意味着它们是可分的，以及其他类似的情况，对吧？所以当然，这种情况可以通过回归和其他方法来解决","start":4250.77,"end":4255.65},{"id":204,"text":"by regression and things like that. Sorry, by adding regularization, right? So that's","zh":"通过添加正则化，对吧？这样就可以了。好的。那么我们最后的话题只是各种主题的快速浏览","start":4255.65,"end":4260.61},{"id":205,"text":"fine. Okay. All right. Our last topic is just sort of a whirlwind of topics. There's more","zh":"书中还有更多内容，你们知道我们期望你们阅读的，不过还有最后一个","start":4260.61,"end":4269.45},{"id":206,"text":"more in the book which you know we'd expect you to be reading um but uh and the next the last one","zh":"话题只是关于基本的假设检验，对吧？在这里的设定中，情况非常简单","start":4269.45,"end":4276.45},{"id":207,"text":"is just on kind of basic hypothesis testing right so and the setting here it's super simple setting","zh":"它只是说，我有一个随机变量，为了好玩，我将让它取值于","start":4276.45,"end":4282.09},{"id":208,"text":"it just says um i have a random variable and for fun i'm just going to make it uh with values in","zh":"某个特定的集合中","start":4282.09,"end":4288.45},{"id":209,"text":"one to n right um and it was either it was generated from two different one of two different","zh":"从1到n，嗯，它要么是来自两个不同的分布之一","start":4288.45,"end":4295.13},{"id":210,"text":"distributions and you have to guess which one it's it was generated from did it come from P did it","zh":"你必须猜测它是来自哪一个分布，它是来自P还是Q？","start":4295.13,"end":4300.85},{"id":211,"text":"come from Q that's your question right it's a basic question here right and the way that's","zh":"这就是你在这里的基本问题，对吧？解决这个问题的方法是，一个结果会发生，比如我会说，我观察到7，","start":4300.85,"end":4308.07},{"id":212,"text":"going to work is an outcome is going to happen like I'm gonna say okay I observe seven right","zh":"从这一点，你必须猜测，它是来自分布P还是Q？你几乎可以猜测，或者从课程中，你当然会知道最优的猜测是什么，对吧？","start":4308.07,"end":4314.33},{"id":213,"text":"From that, you have to guess, like, was it from distribution P or Q? You could almost guess, or from a course, you would certainly know what the optimal guess is, right? I mean, it'd be very weird if P7 was like 0.8 or something, and Q7 was 0.05. And I said, 7 is what occurred. Which one do you think it came from? And you go, oh, Q.","zh":"我的意思是，如果P7是0.8或者类似的东西，而Q7是0.05，那就非常奇怪了。我说，7发生了，你觉得它是来自哪一个？你会说，Q。","start":4316.18,"end":4344.16},{"id":214,"text":"It's just, I mean, if you think carefully about it, that's weird. I mean, unless you know something secretly behind it, you must know something, right? And you go, whoa, it's much more likely with the first model than the second. And you go, yeah, but I've been doing this for 20 years. I got a good feel for these things. So go with Q. I mean, anyway, I'm just saying, you can even guess what it is. But we'll just work out what it is. Okay. So what we're going to do is we're going to look at a...","zh":"我的意思是，如果你仔细想想，这很奇怪。我的意思是，除非你秘密地知道一些东西，否则你必须知道一些东西，对吧？你会说，哇，第一个模型比第二个模型更有可能。你会说，是的，但我已经做了20年了，我对这些事情有很好的感觉。所以选择Q。我的意思是，无论如何，我只是说，你甚至可以猜测它是哪一个。但我们将计算出它到底是什么。好的。那么我们将要做的就是，我们将会观察一个随机检测器。","start":4345.49,"end":4370.43},{"id":215,"text":"randomized detector. And a randomized detector is like a two by n matrix. It's a very weird thing. It looks like this, right? So it's a two by n matrix. It looks like, you know, 0.8, 0.2, 1, 0, 0, 1. That's good. And 0.3 and 0.7, right? And let's say this is p and q, right? And this is the outcome. This is 1 and that's n, okay? So the idea here is","zh":"随机检测器就像是一个2乘n的矩阵。它是一个非常奇怪的东西。它看起来像这样，对吧？所以它是一个2乘n的矩阵。看起来像，你知道的，0.8，0.2，1，0，0，1。这很好。还有0.3和0.7，对吧？并且让我们说这个是p和q，对吧？这是结果。这是1，那是n，对吧？所以这个想法是","start":4371.07,"end":4396.89}],"notes":["本段讲授了假设检验的基本概念，即在两个可能的分布P和Q之间判断一个观测值来自哪一个分布。讲者通过一个例子说明，当观测值在某个分布下概率更高时，应选择该分布作为来源。","讲者提到，当对数似然函数在上方无界时，模型可能具有可分性，这通常需要通过正则化方法来解决，以避免模型过拟合。","讲者进一步介绍了随机检测器的概念，这是一种用于假设检验的工具，它是一个2×n的矩阵，用于表示在不同分布下做出决策的概率。","在随机检测器的例子中，讲者展示了如何通过概率值来判断观测值来自哪个分布，例如，当观测值在分布P下的概率显著高于分布Q时，应选择P作为来源。","讲者强调了在假设检验中，选择最优决策需要基于概率的比较，而不是主观判断，这体现了统计决策理论的基本思想。","最后，讲者提到随机检测器的结构和使用方式，为后续的深入讨论奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4239.51,"end":4396.89,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":4239.51,"text":"case this is precisely the case when the when the log likelihood is unbounded above"},{"start":4246.09,"text":"above, right? So this is extremely common in models, right? If a log-like load is unbound"},{"start":4250.77,"text":"above, it means they're separable and stuff like that, right? So, of course, this is fixed"},{"start":4255.65,"text":"by regression and things like that. Sorry, by adding regularization, right? So that's"},{"start":4260.61,"text":"fine. Okay. All right. Our last topic is just sort of a whirlwind of topics. There's more"},{"start":4269.45,"text":"more in the book which you know we'd expect you to be reading um but uh and the next the last one"},{"start":4276.45,"text":"is just on kind of basic hypothesis testing right so and the setting here it's super simple setting"},{"start":4282.09,"text":"it just says um i have a random variable and for fun i'm just going to make it uh with values in"},{"start":4288.45,"text":"one to n right um and it was either it was generated from two different one of two different"},{"start":4295.13,"text":"distributions and you have to guess which one it's it was generated from did it come from P did it"},{"start":4300.85,"text":"come from Q that's your question right it's a basic question here right and the way that's"},{"start":4308.07,"text":"going to work is an outcome is going to happen like I'm gonna say okay I observe seven right"},{"start":4316.18,"text":"From that, you have to guess, like, was it from distribution P or Q? You could almost guess, or from a course, you would certainly know what the optimal guess is, right? I mean, it'd be very weird if P7 was like 0.8 or something, and Q7 was 0.05. And I said, 7 is what occurred. Which one do you think it came from? And you go, oh, Q."},{"start":4345.49,"text":"It's just, I mean, if you think carefully about it, that's weird. I mean, unless you know something secretly behind it, you must know something, right? And you go, whoa, it's much more likely with the first model than the second. And you go, yeah, but I've been doing this for 20 years. I got a good feel for these things. So go with Q. I mean, anyway, I'm just saying, you can even guess what it is. But we'll just work out what it is. Okay. So what we're going to do is we're going to look at a..."},{"start":4371.07,"text":"randomized detector. And a randomized detector is like a two by n matrix. It's a very weird thing. It looks like this, right? So it's a two by n matrix. It looks like, you know, 0.8, 0.2, 1, 0, 0, 1. That's good. And 0.3 and 0.7, right? And let's say this is p and q, right? And this is the outcome. This is 1 and that's n, okay? So the idea here is"}],"speech_gaps":[],"frame":"../frames/v010/026.webp","frame_time":4251.51},{"title":"检测器与混淆矩阵","segments":[{"id":216,"text":"This is my detector. It's a policy. And what it does is it says that if the outcome is 2, I will simply say it came from P, period. Everybody following this? If the outcome is 3, I'll say it came from Q. If the outcome is 1, I will then do something very weird. I'll flip a coin with probability 0.8. And if it comes up heads, I'll say it's P. Otherwise, I'll say it's Q. Right? Everybody?","zh":"这是我设计的检测器。它是一种策略。它的作用是，如果结果是2，我会直接说它来自P，就这么简单。大家明白吗？如果结果是3，我会说它来自Q。如果结果是1，我会做一件非常奇怪的事情。我会以0.8的概率抛一枚硬币。如果出现正面，我会说它是P；否则，我会说它是Q。对吧？大家明白吗？","start":4397.42,"end":4424.66},{"id":217,"text":"Got that? By the way, we're going to see examples where you need a randomized detector. A deterministic detector is when all the numbers in that matrix are 0 or 1. Then it's just a partition of the outcomes, which are 1 to n, into the ones where you guess it's p and the ones where you guess it's q. Yeah.","zh":"明白了吗？顺便说一下，我们将会看到需要随机化检测器的例子。确定性检测器是指该矩阵中的所有数字都是0或1。然后它只是将结果1到n划分为两类：一类是你猜测来自p，另一类是你猜测来自q。对吧。","start":4425.88,"end":4443.52},{"id":218,"text":"Isn't p a distribution and q is a distribution? Yeah, those are n numbers that are non-negative and add up to 1. But here they don't add up to 1, right? This is a detector matrix. This is not a probability distribution at all. Yeah, so p and q do. Those things, of course. The sum of the pi's is 1, the sum of the qi's is 1. The only thing, in fact, the rules for this matrix are...","zh":"p和q不是分布吗？是的，它们是n个非负数，且总和为1。但在这里，它们的总和并不为1，对吧？这是一个检测器矩阵。这根本不是一个概率分布。是的，p和q确实是分布。当然，pi的总和为1，qi的总和也为1。事实上，这个矩阵的规则是……","start":4444.17,"end":4473.45},{"id":219,"text":"They're non-negative, and the column sums are one. That's the rules for this detector matrix. It's a randomized, it characterizes a randomized detector. So you'd say it's like column stochastic or something like that, right? The matrix. Okay. Okay. Now...","zh":"它们是非负的，并且列的总和为1。这就是这个检测器矩阵的规则。它是一种随机化的检测器，它描述了一个随机化的检测器。所以你会说它类似于列随机的矩阵，对吧？这个矩阵。好的。好的。现在……","start":4473.77,"end":4493.47},{"id":220,"text":"What you could do is just work out the, you can actually just work out the so-called detector matrix, which actually you get by just doing literally matrix multiplication, right? So if I do the following, if I multiply my matrix here by, here's P and here's Q, I get a two by two matrix, which is super interesting.","zh":"你可以做的是直接计算所谓的检测器矩阵，它实际上是通过矩阵乘法直接得到的，对吧？所以如果我这样做，如果我将这里的矩阵乘以P和Q，我会得到一个2x2的矩阵，这非常有趣。","start":4494.44,"end":4517.7},{"id":221,"text":"And what it's going to tell me, it's called, I don't know, confusion matrix. There are lots of names for this, right? But it tells you actually what the probability of your being either right or wrong is as a function of whether it was generated from P or Q, right? And so that's called a confusion matrix. Although maybe for two by two, it's not. But I don't know. It's got some, I don't know what it is. Anyway.","zh":"它会告诉我一些东西，它被称为混淆矩阵。这个矩阵有很多名字，对吧？但它实际上告诉你的是，根据它是否来自P或Q，你正确或错误的概率是多少，对吧？所以这被称为混淆矩阵。尽管对于2x2的情况，它可能不是这样。但我不确定它叫什么。不管怎样。","start":4519.17,"end":4544.07},{"id":222,"text":"And so here, you would like the, if this matrix, this detection probability matrix were an identity, that's perfect, right? Because it means that whenever it comes from P, I guess P. Whenever it comes from Q, I guess Q. By the way, would that ever happen? When do you imagine that's possible? Somebody give me an example. Yeah. When the distributions don't overlap? Yeah, they don't overlap, right? So here's P.","zh":"因此，这里你希望这个矩阵，这个检测概率矩阵要是单位矩阵，那就完美了，对吧？因为这意味着当它来自P时，你猜的是P；当它来自Q时，你猜的是Q。顺便问一句，这种情况会发生吗？你想象什么时候可能发生呢？有人给我举个例子。对的。当分布不重叠的时候？对的，它们不重叠，对吧？这里就是P。","start":4546.27,"end":4573.94}],"notes":["本段讲解了检测器的概念，包括确定性检测器和随机化检测器的区别。确定性检测器通过0或1的矩阵表示，将结果划分为猜测P或Q的类别。而随机化检测器则允许在某些情况下通过概率翻转硬币来决定猜测结果。","讲者指出，p和q是概率分布，它们的元素非负且和为1。而检测器矩阵的元素和不一定为1，其列和为1，这表明检测器矩阵是列随机化的，用于描述随机化检测器。","检测器矩阵可以通过矩阵乘法计算得到，它将P和Q的分布相乘，得到一个2x2的矩阵，称为混淆矩阵。混淆矩阵用于表示在不同分布下猜测正确的概率。","讲者提到，理想情况下，混淆矩阵应为单位矩阵，这意味着当输入来自P时猜测P，来自Q时猜测Q。这种情况只有在分布不重叠时才可能发生。","讲者通过提问引导学生思考分布不重叠的情况，这表明在分布完全分离时，检测器可以完美区分两种分布。","本段内容涉及检测器的构建、随机化检测器的特性、混淆矩阵的定义及其在分类问题中的作用，以及理想情况下的检测器性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4397.42,"end":4573.94,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4397.42,"text":"This is my detector. It's a policy. And what it does is it says that if the outcome is 2, I will simply say it came from P, period. Everybody following this? If the outcome is 3, I'll say it came from Q. If the outcome is 1, I will then do something very weird. I'll flip a coin with probability 0.8. And if it comes up heads, I'll say it's P. Otherwise, I'll say it's Q. Right? Everybody?"},{"start":4425.88,"text":"Got that? By the way, we're going to see examples where you need a randomized detector. A deterministic detector is when all the numbers in that matrix are 0 or 1. Then it's just a partition of the outcomes, which are 1 to n, into the ones where you guess it's p and the ones where you guess it's q. Yeah."},{"start":4444.17,"text":"Isn't p a distribution and q is a distribution? Yeah, those are n numbers that are non-negative and add up to 1. But here they don't add up to 1, right? This is a detector matrix. This is not a probability distribution at all. Yeah, so p and q do. Those things, of course. The sum of the pi's is 1, the sum of the qi's is 1. The only thing, in fact, the rules for this matrix are..."},{"start":4473.77,"text":"They're non-negative, and the column sums are one. That's the rules for this detector matrix. It's a randomized, it characterizes a randomized detector. So you'd say it's like column stochastic or something like that, right? The matrix. Okay. Okay. Now..."},{"start":4494.44,"text":"What you could do is just work out the, you can actually just work out the so-called detector matrix, which actually you get by just doing literally matrix multiplication, right? So if I do the following, if I multiply my matrix here by, here's P and here's Q, I get a two by two matrix, which is super interesting."},{"start":4519.17,"text":"And what it's going to tell me, it's called, I don't know, confusion matrix. There are lots of names for this, right? But it tells you actually what the probability of your being either right or wrong is as a function of whether it was generated from P or Q, right? And so that's called a confusion matrix. Although maybe for two by two, it's not. But I don't know. It's got some, I don't know what it is. Anyway."},{"start":4546.27,"text":"And so here, you would like the, if this matrix, this detection probability matrix were an identity, that's perfect, right? Because it means that whenever it comes from P, I guess P. Whenever it comes from Q, I guess Q. By the way, would that ever happen? When do you imagine that's possible? Somebody give me an example. Yeah. When the distributions don't overlap? Yeah, they don't overlap, right? So here's P."}],"speech_gaps":[],"frame":"../frames/v010/027.webp","frame_time":4409.42},{"title":"贝叶斯检测与多准则优化","segments":[{"id":223,"text":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P.","zh":"我在这里画一个P。它是0，0，0.5，0.5。这里是Q。这是P，这里是Q。它是0.3，0.7，0，0。对吧？所以它们只是有不重叠的支持集，或者只是不同。现在，如果我告诉你结果是3，你能说什么？并且是确定的。你可以这样说，如果结果是3，它不可能来自Q，因此来自P。","start":4574.68,"end":4604.4},{"id":224,"text":"And if the outcome were 2, it came from Q, not P. And so in this case, if you had a reasonable deterministic detector there, you would come up with this detection matrix being the identity, meaning you make no mistakes. I mean, that's a silly thing, but nevertheless, that's the idea. So what you really end up having in the choice of T now is this is a multi-criterion problem.","zh":"如果结果是2，它来自Q，而不是P。因此在这种情况下，如果你有一个合理的确定性检测器，你会得到这个检测矩阵是单位矩阵，这意味着你不会犯错误。我是说，这很傻，但无论如何，这就是想法。因此，你现在在选择T时实际上面临的是一个多准则问题。","start":4604.93,"end":4633.35},{"id":225,"text":"Right. So because there's two, actually, you can even weirdly say that. Well, here we can. This matrix only has two free parameters in it. Right. The probability of a false negative and probability of a false positive. Both of those you want small. Right. So we can say it's a bicriterion problem and it would look like this. Right. It looks exactly like this. So, yeah. So this is this is what you would do.","zh":"对的。因为有两个，实际上你甚至可以奇怪地说。在这里我们可以。这个矩阵中只有两个自由参数。对的。假阳性概率和假阴性概率。你都希望这两个概率尽可能小。对的。因此我们可以称其为一个双准则问题，它看起来像这样。对的。它看起来就完全像这样。所以，是的。这就是你会做的事情。","start":4634.21,"end":4657.97},{"id":226,"text":"this is your false probability and false negative, false positive, false negative probabilities. You want them both small, right? So what's cool is over here, I mean, with this ridiculous example over here, we can make both of them zero, right? But in general, obviously you can't do that, right? So it's a bicriterion problem and it looks like this. That is an LP, right? Actually, it's an LP that's so simple, it has an analytical solution.","zh":"这是你的假阳性概率和假阴性概率。你希望它们都尽可能小，对吧？有趣的是，在这里，我意思是在这个荒谬的例子中，我们可以让这两个概率都为零，对吧？但一般来说，显然你做不到，对吧？因此这是一个双准则问题，它看起来像这样。这是一个线性规划问题，对吧？实际上，这是一个非常简单的线性规划问题，它有一个解析解。","start":4659.0,"end":4686.94},{"id":227,"text":"which you could work out. We'll get to that in a minute. But if you scalarize it, and so lambda would be the penalty that tells you how much false negatives bother you more than false positives, right? If you solve this, you actually end up with a solution that is a deterministic detector.","zh":"你可以自己推导出来。我们稍后会讲到这一点。但如果你将其标量化，那么λ就是一种惩罚，它告诉你假阴性比假阳性更让你困扰的程度，对吧？如果你解决这个问题，你实际上会得到一个确定性检测器的解。","start":4687.67,"end":4708.59},{"id":228,"text":"Okay, so you get. As a matter of fact, the method is actually incredibly simple. It's really dumb. It basically says that it depends on the ratio of p over q.","zh":"好的，你得到的。事实上，这个方法实际上非常简单。它真的很傻。它基本上说的是，它取决于p与q的比值。","start":4709.62,"end":4720.78},{"id":229,"text":"Right. And so this is this is, you know, I guess they call it a likelihood ratio test. Right. I mean, this is a super dumb example, but actually this kind of works in infinite dimensions and things like that. Right. So it'd be the exact same thing in infinite dimensions. If I had two continuous densities and I say, hey, here's X, which density did it come from? You know, you look at it. What you do is you look at the ratio of the densities and then there's a threshold which you interpret as.","zh":"对的。所以这就是所谓的似然比检验。对的。我意思是，这是一个超级简单的例子，但实际上这种检验方法在无限维空间中也是可行的。对的。所以在无限维空间中，它也是一样的。如果我有两个连续的概率密度函数，我说，嘿，这里有一个样本X，它是来自哪一个密度的？你知道的，你观察它。你所做的就是比较这两个密度函数的比值，然后有一个阈值，你可以据此进行解释。","start":4721.33,"end":4748.62}],"notes":["本段讲授了贝叶斯检测的基本概念，通过两个离散分布P和Q的示例，说明如何根据观测结果判断其来源。P和Q的支撑集不重叠，因此当观测结果为3时，可以确定其来自P；当为2时，来自Q。这展示了检测矩阵的确定性，即在理想情况下可以完全正确分类。","接下来，课程讨论了多准则优化问题，即在选择检测矩阵T时，需要同时最小化误检率（false positive）和漏检率（false negative）。这被描述为一个双准则问题，其中两个目标需要平衡。","在具体例子中，P和Q的参数被设定为0.5和0.3，这使得在某些情况下可以实现零误检率和零漏检率。然而，一般情况下无法做到这一点，因此需要通过优化方法找到最佳的检测策略。","课程进一步指出，该问题可以转化为一个线性规划（LP）问题，其解具有解析形式。通过引入一个惩罚参数λ，可以将双准则问题转化为单准则问题，从而找到最优的检测阈值。","最后，课程提到该方法基于似然比检验（likelihood ratio test），即通过比较两个分布的密度比值来决定观测结果的来源。这种方法不仅适用于离散分布，也适用于连续分布，并且在无限维空间中同样适用。","整个讲解通过一个简单的例子引出复杂的优化问题，强调了在实际应用中如何平衡不同类型的错误，并通过数学建模找到最优解。"],"formulas":[{"latex":"P = [0, 0, 0.5, 0.5]","symbols":"P 是一个离散概率分布，其支撑集为 {0, 1, 2, 3}，对应概率为 0, 0, 0.5, 0.5。","explanation":"公式正确，表示离散概率分布P。","evidence":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"latex":"Q = [0.3, 0.7, 0, 0]","symbols":"Q 是另一个离散概率分布，其支撑集为 {0, 1, 2, 3}，对应概率为 0.3, 0.7, 0, 0。","explanation":"公式正确，表示离散概率分布Q。","evidence":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"latex":"P_{\\text{false negative}} = P_{\\text{false positive}} = 0","symbols":"在特定情况下，可以实现零误检率和零漏检率。","explanation":"公式正确，表示在特定情况下可以实现零误检率和零漏检率。","evidence":"Right. So because there's two, actually, you can even weirdly say that. Well, here we can. This matrix only has two free parameters in it. Right. The probability of a false negative and probability of false positive. Both of those you want small. Right. So we can say it's a bicriterion problem and it would look like this. Right. It looks exactly like this. So, yeah. So this is this is what you would do."},{"latex":"P_{\\text{false negative}} + \\text{penalty} \\times P_{\\text{false positive}} = \\text{objective function}","symbols":"通过引入惩罚参数λ，将双准则问题转化为单准则问题，以找到最优的检测阈值。","explanation":"公式正确，表示通过引入惩罚参数λ，将双准则问题转化为单准则问题。","evidence":"which you could work out. We'll get to that in a minute. But if you scalarize it, and so lambda would be the penalty that tells you how much false negatives bother you more than false positives, right? If you solve this, you actually end up with a solution that is a deterministic detector."}],"uncertainties":[],"diagram":"none","start":4574.68,"end":4748.62,"asr_flags":[],"math_clarifications":["公式2未说明矩阵的维度和具体形式，无法核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4574.68,"text":"I'll draw a P here. It's 0, 0, 0.5, 0.5. And here's Q. This is P, and here's Q. It's going to be 0.3, 0.7, 0, 0. Okay? So they just have non-overlapping support, or they're just different. And so this is silly, but now if I tell you the outcome is 3, what can you say? And with certainty. You can say, if the outcome is 3, it can't have come from Q, so it came from P."},{"start":4604.93,"text":"And if the outcome were 2, it came from Q, not P. And so in this case, if you had a reasonable deterministic detector there, you would come up with this detection matrix being the identity, meaning you make no mistakes. I mean, that's a silly thing, but nevertheless, that's the idea. So what you really end up having in the choice of T now is this is a multi-criterion problem."},{"start":4634.21,"text":"Right. So because there's two, actually, you can even weirdly say that. Well, here we can. This matrix only has two free parameters in it. Right. The probability of a false negative and probability of false positive. Both of those you want small. Right. So we can say it's a bicriterion problem and it would look like this. Right. It looks exactly like this. So, yeah. So this is this is what you would do."},{"start":4659.0,"text":"this is your false probability and false negative, false positive, false negative probabilities. You want them both small, right? So what's cool is over here, I mean, with this ridiculous example over here, we can make both of them zero, right? But in general, obviously you can't do that, right? So it's a bicriterion problem and it looks like this. That is an LP, right? Actually, it's an LP that's so simple, it has an analytical solution."},{"start":4687.67,"text":"which you could work out. We'll get to that in a minute. But if you scalarize it, and so lambda would be the penalty that tells you how much false negatives bother you more than false positives, right? If you solve this, you actually end up with a solution that is a deterministic detector."},{"start":4709.62,"text":"Okay, so you get. As a matter of fact, the method is actually incredibly simple. It's really dumb. It basically says that it depends on the ratio of p over q."},{"start":4721.33,"text":"Right. And so this is this is, you know, I guess they call it a likelihood ratio test. Right. I mean, this is a super dumb example, but actually this kind of works in infinite dimensions and things like that. Right. So it'd be the exact same thing in infinite dimensions. If I had two continuous densities and I say, hey, here's X, which density did it come from? You know, you look at it. What you do is you look at the ratio of the densities and then there's a threshold which you interpret as."}],"speech_gaps":[],"frame":"../frames/v010/028.webp","frame_time":4586.68},{"title":"分类器设计与优化","segments":[{"id":230,"text":"how much you care about being false negative compared to false positive. And if you're above the threshold, you guess one distribution if you're below and all that kind of stuff. Okay, everybody got this? So, okay. Now, those are deterministic detectors. But you could do other stuff. Like you could say, actually, here's what I care about. I want to minimize the probability of being wrong.","zh":"你对误判为假阴性与假阳性的关注程度有多大。如果你的值高于阈值，你猜测属于某一类分布；如果低于，则属于另一类，诸如此类。好的，大家都明白了吗？那么，好的。这些都是确定性的检测器。但你也可以做其他事情。例如，你可以这样说：实际上，我关心的是这个。我想最小化出错的概率。","start":4749.1,"end":4773.4},{"id":231,"text":"Minimize the probability. Did I say maximize? Whatever. You want to minimize the probability of being wrong, right? And so there you're minimizing the max of these two things. That's an LP, and it usually ends up not being a deterministic detector. So we'll quit today, and we'll start up again next time.","zh":"最小化概率。我刚才说的是最大化吗？随便啦。你想要最小化出错的概率，对吧？因此，你是在最小化这两个因素中的最大值。这是一个线性规划问题，通常最终不会得到一个确定性的检测器。所以我们今天就到这里，下次再继续。","start":4774.25,"end":4797.27}],"notes":["本段讨论了分类器设计中对误判的权衡，特别是对假阴性和假阳性的关注程度。讲者提到，当超过某个阈值时，分类器会猜测一个分布，而低于阈值时则猜测另一个分布。这种设计属于确定性检测器，但也可以采用其他方法，如最小化错误概率。","讲者指出，虽然可能误说成最大化，但目标是减少错误概率。这种优化问题通常转化为最小化两个误判概率的最大值，属于线性规划问题，且通常不采用确定性检测器。","讲者提到，这种优化方法通常不采用确定性检测器，而是通过线性规划来实现，这表明分类器设计可以基于不同的优化目标进行调整。","课程内容涉及分类器设计中的误判分析，以及如何通过优化方法来改进分类器的性能。讲者强调了对假阴性和假阳性的不同关注程度，以及如何通过数学建模来实现优化目标。","讲者提到，这种优化问题通常不采用确定性检测器，而是通过线性规划来实现，这表明分类器设计可以基于不同的优化目标进行调整。","课程内容涉及分类器设计中的误判分析，以及如何通过优化方法来改进分类器的性能。讲者强调了对假阴性和假阳性的不同关注程度，以及如何通过数学建模来实现优化目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4749.1,"end":4797.27,"asr_flags":[],"translation_complete":true,"translated_segments":2,"raw_segments":[{"start":4749.1,"text":"how much you care about being false negative compared to false positive. And if you're above the threshold, you guess one distribution if you're below and all that kind of stuff. Okay, everybody got this? So, okay. Now, those are deterministic detectors. But you could do other stuff. Like you could say, actually, here's what I care about. I want to minimize the probability of being wrong."},{"start":4774.25,"text":"Minimize the probability. Did I say maximize? Whatever. You want to minimize the probability of being wrong, right? And so there you're minimizing the max of these two things. That's an LP, and it usually ends up not being a deterministic detector. So we'll quit today, and we'll start up again next time."}],"speech_gaps":[],"frame":"../frames/v010/029.webp","frame_time":4761.1}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v010.mp4"}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
