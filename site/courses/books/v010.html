<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 10</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">10 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 10 · 完整初稿</p><video id="video" hidden controls preload="none"></video><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v010","title":"10 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 10","course":"凸优化","pages":[{"title":"惩罚函数与L1正则化","segments":[{"id":0,"text":"Okay, we'll continue. There was a couple of things I wanted to point out here. We already saw a couple, right? So the idea here is you create a penalty function which basically describes how you feel, how irritated are you with a residual of a certain value, right? So these are like residuals here."},{"id":1,"text":"And then this is basically your irritation. And what you're going to do is actually minimize your total irritation, right? By minimizing the sum of these things. And then you can interpret these all sorts of ways. You know, your standard thing would be a quadratic. That's been a tradition for a couple of hundred years. And also has analytical solutions in some simple cases, right? But then we have some others here, like this dead zone linear. And these are interesting because they have like a kink here."},{"id":2,"text":"And what we observed last time was actually kind of interesting. It was this. It was that when you have a kink here, you find a whole bunch of values right at the kink. Notice that that's also true for the L1 solution as well. So the L1 solution says you don't like residuals."},{"id":3,"text":"In fact, one way to analyze what an L1 penalty function is, is that for large residuals, it's relatively chill, at least for a convex penalty. Because it's a lot smaller than a quadratic when a residual is large, because a quadratic is large squared. Conversely, for small residuals, something like an L1 or something with a sharp point is actually not chill."},{"id":4,"text":"It's very, it gets very upset with, it gets relatively upset with small residuals, whereas, for example, a square penalty is not, is fine. So, and I'm just, there's no more to what I'm saying than just this. So don't try to over, I mean, you can, if you wanted to, people have actually attempted to make this extremely mathematical and so on. It's a bit silly because I think it's actually very interesting to actually just see how this works. Okay."},{"id":5,"text":"That is actually something, especially this top one, which is the L1 thing. Here you see that a whole bunch of penalties are zero. And in fact, this is a theme you're going to see. You may already have seen it in some statistics and machine learning classes. And basically what people say is that L1 is a sparsifier."}],"notes":["本段讨论了惩罚函数中不同形式的残差处理方式，特别是L1惩罚函数的特性。讲者指出，L1惩罚函数在残差较大时相对不敏感，而在残差较小时则会表现出较强的敏感性，这与二次惩罚函数形成对比。","讲者提到，L1惩罚函数在残差较大时，其惩罚值比二次惩罚函数小得多，因为二次惩罚函数的惩罚值与残差的平方成正比。而在残差较小时，L1惩罚函数的惩罚值会相对较大，因此对小残差更敏感。","讲者强调，L1惩罚函数的一个重要特性是它能够产生稀疏解，即在优化过程中，许多变量的系数会趋近于零。这种特性在统计学和机器学习中被广泛用于特征选择。","讲者指出，虽然L1惩罚函数可以被数学化地分析，但其直观的理解更为重要。他建议不要过度数学化，而是通过观察其行为来理解其作用。","讲者提到，L1惩罚函数的这种特性在统计学和机器学习课程中已经被广泛讨论，因此听众可能已经有所了解。","讲者最后指出，L1惩罚函数的这种稀疏性是其在实际应用中的一个重要优势，尤其是在处理高维数据时，能够有效减少模型的复杂度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":157.27,"asr_flags":[],"raw_segments":[{"start":5.23,"text":"Okay, we'll continue. There was a couple of things I wanted to point out here. We already saw a couple, right? So the idea here is you create a penalty function which basically describes how you feel, how irritated are you with a residual of a certain value, right? So these are like residuals here."},{"start":28.84,"text":"And then this is basically your irritation. And what you're going to do is actually minimize your total irritation, right? By minimizing the sum of these things. And then you can interpret these all sorts of ways. You know, your standard thing would be a quadratic. That's been a tradition for a couple of hundred years. And also has analytical solutions in some simple cases, right? But then we have some others here, like this dead zone linear. And these are interesting because they have like a kink here."},{"start":58.03,"text":"And what we observed last time was actually kind of interesting. It was this. It was that when you have a kink here, you find a whole bunch of values right at the kink. Notice that that's also true for the L1 solution as well. So the L1 solution says you don't like residuals."},{"start":82.43,"text":"In fact, one way to analyze what an L1 penalty function is, is that for large residuals, it's relatively chill, at least for a convex penalty. Because it's a lot smaller than a quadratic when a residual is large, because a quadratic is large squared. Conversely, for small residuals, something like an L1 or something with a sharp point is actually not chill."},{"start":109.82,"text":"It's very, it gets very upset with, it gets relatively upset with small residuals, whereas, for example, a square penalty is not, is fine. So, and I'm just, there's no more to what I'm saying than just this. So don't try to over, I mean, you can, if you wanted to, people have actually attempted to make this extremely mathematical and so on. It's a bit silly because I think it's actually very interesting to actually just see how this works. Okay."},{"start":137.19,"text":"That is actually something, especially this top one, which is the L1 thing. Here you see that a whole bunch of penalties are zero. And in fact, this is a theme you're going to see. You may already have seen it in some statistics and machine learning classes. And basically what people say is that L1 is a sparsifier."}],"speech_gaps":[],"frame":"../frames/v010/001.webp","frame_time":17.23},{"title":"L1范数与稀疏性","segments":[{"id":6,"text":"meaning that when you take an L1 norm of something in an optimization problem, it is often the case that at the solution, the argument has a lot of zero entries. That's the case here, okay? And so that's just a common phenomenon, and it's got tons of uses, including a lot of practical uses. We'll get to it in machine learning. There's just tons of them, but it comes up in engineering and has been used actually now for several decades."},{"id":7,"text":"So, okay. I guess this is the, we looked at the Huber penalty. That focuses on"},{"id":8,"text":"large residuals and the fact that a Huber penalty is like this Frankenstein penalty that blends together a quadratic for small residuals with basically something that looks like an L1 penalty for large, right? And so you might say that a Huber penalty matches least squares for small residuals, which is to say that it's relatively..."},{"id":9,"text":"If, for example, x is a sequence of forces that you apply to something, let's say ax equals b, it says make me a trajectory of forces to put every 20 milliseconds on this rigid body to move it from this position to that position. Let's just say that's what x is. If I use an L1 norm here, I want someone to guess."},{"id":10,"text":"Which is, by the way, a kind of a first order approximation of fuel use, at least for rockets. So, somebody want to make a guess as to what it's going to look like? What is X going to be? Based on what we were just talking about. It's going to be sparse. Yeah. Yeah. And by the way, if you go and watch videos of satellites maneuvering or rockets maneuvering."},{"id":11,"text":"Which is, by the way, a kind of a first order approximation of fuel use, at least for rockets. So, somebody want to make a guess as to what it's going to look like? What is X going to be? Based on what we were just talking about. It's going to be sparse. Yeah. Yeah. And by the way, if you go and watch videos of satellites maneuvering or rockets maneuvering."},{"id":12,"text":"That's exactly what you'll see. If you watch, because you'll actually see puffs come out of the thrusters, and there's little bursts, and you'll see like, you know, one, two, three, and then just nothing. And then some other thruster, you'll get like two bursts out of it or something like that. So that's exactly right. They're sparse. Everybody got this? So it's a theme. Don't worry, you're going to see it basically from now on. And it's used in a whole lot of other applications, not just, well, that's one."}],"notes":["本段主要讲解了L1范数在优化问题中的应用，特别是在稀疏性方面的表现。当使用L1范数时，解通常具有大量零元素，这种现象在工程和机器学习中都有广泛应用。例如，在火箭推进系统中，L1范数可以用来近似燃料使用情况，从而得到稀疏的控制信号。","讲者通过火箭推进系统的例子，说明了稀疏性在实际中的体现。当火箭进行机动时，推进器会以脉冲形式工作，即在短时间内施加较大的力，随后停止，这种行为与稀疏性特征相符。","讲者强调了稀疏性是一个重要的主题，并指出它将在后续课程中频繁出现。稀疏性不仅在工程领域有应用，还在机器学习、信号处理等多个领域有广泛应用。","讲者提到，稀疏性可以通过L1范数实现，而L1范数在优化问题中能够产生稀疏解，这与L1范数的性质密切相关。这种性质使得L1范数在处理高维数据时特别有用。","讲者还提到，稀疏性在实际应用中可以带来计算上的优势，例如减少计算复杂度和提高模型的可解释性。因此，理解稀疏性及其在优化问题中的应用对于学习凸优化非常重要。","讲者通过火箭推进系统的例子，直观地展示了稀疏性的实际意义，帮助学生更好地理解L1范数在优化问题中的作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":158.1,"end":329.34,"asr_flags":[],"raw_segments":[{"start":158.1,"text":"meaning that when you take an L1 norm of something in an optimization problem, it is often the case that at the solution, the argument has a lot of zero entries. That's the case here, okay? And so that's just a common phenomenon, and it's got tons of uses, including a lot of practical uses. We'll get to it in machine learning. There's just tons of them, but it comes up in engineering and has been used actually now for several decades."},{"start":187.97,"text":"So, okay. I guess this is the, we looked at the Huber penalty. That focuses on"},{"start":197.07,"text":"large residuals and the fact that a Huber penalty is like this Frankenstein penalty that blends together a quadratic for small residuals with basically something that looks like an L1 penalty for large, right? And so you might say that a Huber penalty matches least squares for small residuals, which is to say that it's relatively..."},{"start":219.68,"text":"chill not as chill as a dead zone that's that's as chill as you can get that's like well okay then but for large residuals a huber penalty is actually looks more like an l1 thing which is for a convex penalty is as chill as you can get right so okay um we looked at least norm problems where you know basically the same story uh happens um but now i can we can cut you can kind of guess a lot of stuff"},{"start":248.06,"text":"If, for example, x is a sequence of forces that you apply to something, let's say ax equals b, it says make me a trajectory of forces to put every 20 milliseconds on this rigid body to move it from this position to that position. Let's just say that's what x is. If I use an L1 norm here, I want someone to guess."},{"start":275.07,"text":"Which is, by the way, a kind of a first order approximation of fuel use, at least for rockets. So, somebody want to make a guess as to what it's going to look like? What is X going to be? Based on what we were just talking about. It's going to be sparse. Yeah. Yeah. And by the way, if you go and watch videos of satellites maneuvering or rockets maneuvering."},{"start":300.96,"text":"That's exactly what you'll see. If you watch, because you'll actually see puffs come out of the thrusters, and there's little bursts, and you'll see like, you know, one, two, three, and then just nothing. And then some other thruster, you'll get like two bursts out of it or something like that. So that's exactly right. They're sparse. Everybody got this? So it's a theme. Don't worry, you're going to see it basically from now on. And it's used in a whole lot of other applications, not just, well, that's one."}],"speech_gaps":[],"frame":"../frames/v010/002.webp","frame_time":170.1},{"title":"输入设计与目标函数","segments":[{"id":13,"text":"So anyway, okay, we'll get to that. Okay, we talked about regularized approximation last time as basically a bicriterion problem where you have two criteria. And of course you could extend it and have three and things like that. And I think we looked at an example of that, not this one."},{"id":14,"text":"but optimal input design. We looked at this last time, and this is sort of very typical. This is a pure quadratic problem, so it's not that. I mean, you know, it's very simple. You don't need the material of this glass to solve this problem. But it looks something like this, right? You're designing an input."},{"id":15,"text":"which is an input to some system which is given by a convolution or in dialect I would say it's a"},{"id":16,"text":"linear time invariant system that would be like EE and maybe mechanical engineering dialect for"},{"id":17,"text":"what this is right so the output is a is the input uh convolved with something um I guess"},{"id":18,"text":"in fancy language you would say it's the convolution kernel that would be something"},{"id":19,"text":"think everyone would understand. But if you're exclusively with people who speak this E-E-M-E"},{"id":20,"text":"dialect, you would say something like H is the impulse response, right? So I'm just mentioning"},{"id":21,"text":"that different groups have different names for these things, right? Okay, so here we have like"},{"id":22,"text":"three objectives, right? I mean, the first one is we want to track some desired trajectory."},{"id":23,"text":"We want the input small. I mean, roughly, we're making it L2 norm small squared."},{"id":24,"text":"And we want the input variation to be small."},{"id":25,"text":"So we want the difference between u, t plus 1, and u, t to be relatively small."},{"id":26,"text":"And so what we'll do is we will minimize a weighted sum of them."},{"id":27,"text":"These are positive weights, the delta and the eta, that weight the different things."},{"id":28,"text":"And then the way, in fact, people in control and other areas talk about this is they would say that the delta and the eta are knobs, design knobs,"},{"id":29,"text":"that allows you to shape, to make you look like what you want it to look like."},{"id":30,"text":"Everybody got that? Right, so I guess in machine learning you'd call them hyperparameters, which are things you wiggle to make, to change your model."},{"id":31,"text":"you know to make it less sensitive to something or something like that everybody got that unlike in machine learning where you actually have rather good ways to defend choices of delta and eta in a ton of applications you don't right so i mean you do kind of right so you know in control you'd do something like pick some values and say oh you know that's nice saves a lot of fuel but the ride is too rough right and then you would"},{"id":32,"text":"wiggle these things multiply them one or two of them by a factor of two divide one by a factor of two rerun it and you'd say okay that looks we're only using about five percent we only lost a few percent in fuel efficiency but it's a lot smoother ride or something like that it would be things like this right so okay and and we looked actually at some examples of how that works and and the example actually shows"}],"notes":["本段讲授了输入设计问题，其中涉及系统建模和目标函数的构建。系统被建模为线性时不变系统，输入通过卷积与系统响应相关联。输入设计的目标包括跟踪期望轨迹、使输入本身尽可能小（L2范数小）以及限制输入的变化幅度。这些目标通过加权求和的方式进行优化，权重参数（delta和eta）用于调整不同目标的重要性。"],"formulas":[],"uncertainties":["在片段15中，'in dialect I would say it's a' 可能是 'in dialect I would say it's a linear time invariant system' 的不完整表达。","在片段17中，'a is the input uh convolved with something um I guess' 可能是 'the output is a convolution of the input with something' 的不完整表达。","在片段31中，'i mean you do kind of right so you know in control you'd do something like pick some values and say oh you know that's nice saves a lot of fuel but the ride is too rough right and then you would' 可能是 'you do kind of right, so you know in control you'd do something like pick some values and say, oh, you know, that's nice, saves a lot of fuel, but the ride is too rough, right, and then you would' 的不完整表达。"],"diagram":"none","start":330.64,"end":508.65,"asr_flags":[],"raw_segments":[{"start":330.64,"text":"So anyway, okay, we'll get to that. Okay, we talked about regularized approximation last time as basically a bicriterion problem where you have two criteria. And of course you could extend it and have three and things like that. And I think we looked at an example of that, not this one."},{"start":350.66,"text":"but optimal input design. We looked at this last time, and this is sort of very typical. This is a pure quadratic problem, so it's not that. I mean, you know, it's very simple. You don't need the material of this glass to solve this problem. But it looks something like this, right? You're designing an input."},{"start":364.94,"text":"which is an input to some system which is given by a convolution or in dialect I would say it's a"},{"start":372.78,"text":"linear time invariant system that would be like EE and maybe mechanical engineering dialect for"},{"start":378.5,"text":"what this is right so the output is a is the input uh convolved with something um I guess"},{"start":385.48,"text":"in fancy language you would say it's the convolution kernel that would be something"},{"start":389.92,"text":"think everyone would understand. But if you're exclusively with people who speak this E-E-M-E"},{"start":396.56,"text":"dialect, you would say something like H is the impulse response, right? So I'm just mentioning"},{"start":402.0,"text":"that different groups have different names for these things, right? Okay, so here we have like"},{"start":409.06,"text":"three objectives, right? I mean, the first one is we want to track some desired trajectory."},{"start":413.9,"text":"We want the input small. I mean, roughly, we're making it L2 norm small squared."},{"start":419.92,"text":"And we want the input variation to be small."},{"start":422.44,"text":"So we want the difference between u, t plus 1, and u, t to be relatively small."},{"start":428.12,"text":"And so what we'll do is we will minimize a weighted sum of them."},{"start":432.56,"text":"These are positive weights, the delta and the eta, that weight the different things."},{"start":436.28,"text":"And then the way, in fact, people in control and other areas talk about this is they would say that the delta and the eta are knobs, design knobs,"},{"start":446.76,"text":"that allows you to shape, to make you look like what you want it to look like."},{"start":452.46,"text":"Everybody got that? Right, so I guess in machine learning you'd call them hyperparameters, which are things you wiggle to make, to change your model."},{"start":461.42,"text":"you know to make it less sensitive to something or something like that everybody got that unlike in machine learning where you actually have rather good ways to defend choices of delta and eta in a ton of applications you don't right so i mean you do kind of right so you know in control you'd do something like pick some values and say oh you know that's nice saves a lot of fuel but the ride is too rough right and then you would"},{"start":487.26,"text":"wiggle these things multiply them one or two of them by a factor of two divide one by a factor of two rerun it and you'd say okay that looks we're only using about five percent we only lost a few percent in fuel efficiency but it's a lot smoother ride or something like that it would be things like this right so okay and and we looked actually at some examples of how that works and and the example actually shows"}],"speech_gaps":[],"frame":"../frames/v010/003.webp","frame_time":342.64},{"title":"凸优化中的稀疏性与平滑性","segments":[{"id":33,"text":"what the whole idea here is, and it's identical to the idea, by the way, in regularization and machine learning, which we'll talk about later. It's identical, and what it is based on is you can actually sometimes get away with not a huge loss in your primary objective, while at the same time actually getting a substantial reduction in your secondary objectives, right? So this is A, a lot smoother than that, and also B, a lot smaller."},{"id":34,"text":"Right? I mean, if this is not good enough tracking error, this versus that, then, you know, this is all theoretical, right? But if you say like, yo, that's fine. That's all I wanted this thing to do, right? Oh, and I think..."},{"id":35,"text":"I couldn't remember the name in control or mechanical engineering for this. It's called a doublet. Someone told me anyway. It's something like a doublet motion or something like that. That's what it is when something goes like this. It goes over here, over there, and then back. Okay. All right. Does this make sense? And now I'm going to ask you a question. What would happen if I change this to the sum of the absolute values? You just guess."},{"id":36,"text":"I mean, three lines of Python and you would know. But just, someone could just make a guess. What do you think would happen? What? Yeah, well, I don't think u is sparse at all. Like, here, let's go look at u. Sorry. Here's u. Well, that's not true. I shouldn't have spoke, right? It does look like it doesn't do anything for 40 steps. It would be sparser, right? What if, what if I changed this to be the sum of the absolute values? What would you get?"},{"id":37,"text":"I mean, three lines of Python and you would know. But just, someone could just make a guess. What do you think would happen? What? Yeah, well, I don't think u is sparse at all. Like, here, let's go look at u. Sorry. Here's u. Well, that's not true. I shouldn't have spoke, right? It does look like it doesn't do anything for 40 steps. It would be sparser, right? What if, what if I changed this to be the sum of the absolute values? What would you get?"},{"id":38,"text":"And you're just guessing here. So what's that? omething like that. That's what it is when something goes like this. It goes over here, over there, and then back. Okay. All right. Does this make sense? And now I'm going to ask you a question. What would happen if I change this to the sum of the absolute values? You just guess."},{"start":584.43,"text":"I mean, three lines of Python and you would know. But just, someone could just make a guess. What do you think would happen? What? Yeah, well, I don't think u is sparse at all. Like, here, let's go look at u. Sorry. Here's u. Well, that's not true. I shouldn't have spoke, right? It does look like it doesn't do anything for 40 steps. It would be sparser, right? What if, what if I changed this to be the sum of the absolute values? What would you get?"},{"start":616.02,"text":"And you're just guessing here. So what's that? Sparse derivative. It's not a derivative. It's a first difference. Yeah, sparse first difference. What does it mean if a time series has a sparse first difference? What does that mean? It's what? It's what? I can't hear. More smooth. More smooth."},{"start":643.05,"text":"I don't think that's very smooth, no. I mean, it's smooth in a certain sense, right? In the sense that the L1 norm of the first difference is small. I don't know. Yeah. Piecewise what? Kind of constant and when it changes, it's constant. It's piecewise constant, right? If I give you a time series and I tell you that..."},{"start":662.64,"text":"the first differences are sparse, then it means that most of the time it's zero. And that means most of the time the value is equal to the previous value. So it would encourage piecewise constant inputs, right? So make sense? Yeah. So that's actually used in like chemical engineering plants when they're planning out changes to inputs and things like that. They actually put a term that looks like this with absolute values."}],"speech_gaps":[],"frame":"../frames/v010/004.webp","frame_time":521.24},{"title":"信号重建与平滑方法","segments":[{"id":40,"tex pted signal."},{"start":754.67,"text":"And then what you want to do is form a, you want to form an approximation of it or an uncorrupted or, you know, cleaned signal or a reconstructed signal. We're going to call that X hat. That's our variable. X corrupted is given, right? So that would be something like that. And then what you're also given is you're given phi is something like it's a regularization function or a smoothing objective. So it basically says that, it says that the larger phi is,"},{"start":784.55,"text":"the less plausible X hat is as what you're trying to reconstruct, right? So simple things would be things like a quadratic smoother. This would be the one we just talked about. It's an L1 smoother. You could take the third difference and take the L1 difference. You could put a dead zone penalty on the second difference. I mean, there's just a lot of stuff you could do with this. Okay? So this is sort of the idea."},{"start":815.24,"text":"Now, by the way, okay, so let's just take a look at how this works. So here's just a, you know, kind of a classic example for how you do signal reconstruction. Like, so here's an original signal and you can see it's like smooth or something like that. And now here we add some noise to it and it looks like that, right? And now we simply do, this is with quadratic smoothing."},{"start":841.36,"text":"which, by the way, turns out to be linear, and it turns out to be exactly classical smoothing and whatever, and all the stuff, well, in EE you would learn and stuff like that. That's what it is. So that's what that is. And basically the smoother is then, I'll go into dialect, a low-pass filter is what people would say. And someone would say, what are you doing? And you say, I'm filtering out the high-frequency noise here to estimate the..."}],"speech_gaps":[],"frame":"../frames/v010/005.webp","frame_time":700.78},{"title":"平滑与缺失数据处理","segments":[{"id":47,"text":"signal which has lots of low frequency content. So that's quasi-dialect for saying this thing is smooth and the noise added to it is much rougher."},{"id":48,"text":"Okay? I mean, you could say that in other dialects too, right? Certainly in time series dialect, you would be able to say something like that. I don't exactly speak that dialect, so I'm not going to even attempt, but you could. Okay. And then here's some examples, right? So you have a trade-off where you're trading off two things. Like, how far do you deviate from what was given to you?"},{"id":49,"text":"And the second term is how small is this quadratic or how big is this quadratic, or in this case quadratic, smoothing cost. And you can see, you know, this is with it with, this thing is relatively high here, this one, the quadratic component. And this is something like, you know, you might guess, I guess just by eyeball, you might say that's not enough smoothing."},{"id":50,"text":"which means you should, depends which one you're putting the weight on, probably you're putting the weight on this, and it says you should probably decrease the weight on the smoothing regularizer, then you might get something like this, and then you might say over here, well, that's already too smoothed, or something like that. Here, by the way, you can use an obvious method to actually..."},{"id":51,"text":"in a very principled way, select the amount of smoothing. You just do cross-validation here, right? So I think a lot of people who do this don't do that, which I find bizarre. But nevertheless, because it's in like your first class on statistics and machine learning, nevertheless, you could. And you do that by doing the following. What you do to do that, I'll just explain it, is over here in this one, you take the one that you're given, X corrupted."},{"id":52,"text":"And you extend this formulation to allow it to have NAs in it. So unknown, like unknown measurements. Like I didn't get a measurement for index 37, 52, 53, 62, 70. Anyway, you do that. And it's actually extremely simple if you make this a sum of squares over those. But the X hat is going to be a full one. It doesn't have any NAs in it, if you're following me."},{"id":53,"text":"NA meaning not a number, right? Or NAN. I think that would be the other way to say it, right? So, or question mark or whatever, or missing data, right? So then you do this. Now, once you extend this, which is unbelievably simple to handle missing data, now you can do cross-validation. And you do that by saying, thanks for your data, 10% is missing. You randomly yank out another 10% of the data, which you knew."}],"notes":["本段讨论了在信号处理中如何通过平滑成本来平衡信号的平滑程度与噪声的粗糙程度。讲者提到，平滑成本的大小决定了信号的平滑程度，如果平滑成本过高，信号可能被过度平滑，而过低则可能无法有效去除噪声。"],"formulas":[],"uncertainties":[],"diagram":"none","start":867.36,"end":1024.53,"asr_flags":[],"raw_segments":[{"start":867.36,"text":"signal which has lots of low frequency content. So that's quasi-dialect for saying this thing is smooth and the noise added to it is much rougher."},{"start":879.15,"text":"Okay? I mean, you could say that in other dialects too, right? Certainly in time series dialect, you would be able to say something like that. I don't exactly speak that dialect, so I'm not going to even attempt, but you could. Okay. And then here's some examples, right? So you have a trade-off where you're trading off two things. Like, how far do you deviate from what was given to you?"},{"start":898.04,"text":"That's this term. And the second term is how small is this quadratic or how big is this quadratic, or in this case quadratic, smoothing cost. And you can see, you know, this is with it with, this thing is relatively high here, this one, the quadratic component. And this is something like, you know, you might guess, I guess just by eyeball, you might say that's not enough smoothing."},{"start":924.74,"text":"which means you should, depends which one you're putting the weight on, probably you're putting the weight on this, and it says you should probably decrease the weight on the smoothing regularizer, then you might get something like this, and then you might say over here, well, that's already too smoothed, or something like that. Here, by the way, you can use an obvious method to actually..."},{"start":948.81,"text":"in a very principled way, select the amount of smoothing. You just do cross-validation here, right? So I think a lot of people who do this don't do that, which I find bizarre. But nevertheless, because it's in like your first class on statistics and machine learning, nevertheless, you could. And you do that by doing the following. What you do to do that, I'll just explain it, is over here in this one, you take the one that you're given, X corrupted."},{"start":977.29,"text":"And you extend this formulation to allow it to have NAs in it. So unknown, like unknown measurements. Like I didn't get a measurement for index 37, 52, 53, 62, 70. Anyway, you do that. And it's actually extremely simple if you make this a sum of squares over those. But the X hat is going to be a full one. It doesn't have any NAs in it, if you're following me."},{"start":999.62,"text":"NA meaning not a number, right? Or NAN. I think that would be the other way to say it, right? So, or question mark or whatever, or missing data, right? So then you do this. Now, once you extend this, which is unbelievably simple to handle missing data, now you can do cross-validation. And you do that by saying, thanks for your data, 10% is missing. You randomly yank out another 10% of the data, which you knew."}],"speech_gaps":[],"frame":"../frames/v010/006.webp","frame_time":879.36},{"title":"凸优化中的正则化与平滑方法","segments":[{"id":54,"text":"but isn't missing, and you pretend it's missing. Now you do signal reconstruction, and you try, you know, you try this thing, and someone at the next desk says, oh, you should try Huber, try Huber, you know, whatever. Try Huber on the third difference, and you're like, okay, dude, and you try these things. Every time you do that, you can make a prediction, which is X hat, of the values that you actually observed, but pretended you didn't. Everybody see that?"},{"id":55,"text":"And then we can say, thanks for your suggesting of using a Huber penalty on the third difference. Just for the record, it did a lot worse than mine. OK, so everyone, if you follow that, that's fine. And if you didn't, it's probably OK. So I mean, certainly not part of the class, this class. OK, now when you."},{"id":56,"text":"When your penalty is an L1 norm on the first difference, that's actually got a name. And this is just completely standard math. It's the total variation. Literally, in continuous time, it's like the integral of the absolute value of the derivative or something like that. And so this is the analog of that. And as we actually reasoned earlier, when you..."},{"id":57,"text":"have a penalty which is like an l1 norm on a difference you should be expecting the solution to have a difference which is sparse okay which corresponds to a piecewise constant uh approximation right and so here's an example here where here's this original thing"},{"id":58,"text":"And here's the corrupted one. And I'll come back and describe how people in some dialects would describe this. But the point is that's it. Now we're going to do L1. Sorry, this is quadratic. So in quadratic, you see you do a little bit of smoothing. And good news is the noise has gone way down."},{"id":59,"text":"Bad news, you can't really see it here, but what was actually a transition in one period up here, these sharp things, are now smooth and they go down over 10, 20 periods. That's over here. When I put this amount on it, good news, this noise is attenuated more, but now you can see it's really quite smooth, right? And then this is like..."},{"id":60,"text":"you know, very smooth, right? So if you wanted to preserve these shifts, right, then you would use, instead of a quadratic smoother, you would use like an L1 smoother, okay? And this sort of makes sense. I was going to say, like, if you know about audio, this is just applying a low-pass filter, and what you're losing are, for example, the attack of a drum beat, right? And it would just, good news, the noise would be attenuated. Bad news,"}],"notes":["本段讲授了在信号重建中使用不同正则化方法（如Huber惩罚和L1惩罚）的对比。讲者提到，当使用L1惩罚时，解会具有稀疏的差分，对应于分段常数的近似。这与总变分（total variation）的概念相关，是凸优化中的标准方法。","讲者通过一个例子说明了使用L1惩罚和二次惩罚（平滑）的效果差异。二次惩罚会使得信号更加平滑，但会丢失一些尖锐的特征，如音频中的鼓点攻击。而L1惩罚则保留了这些特征，但会引入更多的噪声。","讲者提到，使用L1惩罚的平滑方法类似于低通滤波器，但会损失一些高频信息。这说明了在优化问题中，正则化方法的选择会影响信号的平滑程度和特征保留能力。","讲者强调，不同的正则化方法适用于不同的应用场景。例如，当需要保留信号的尖锐特征时，应使用L1惩罚；而当需要减少噪声时，应使用二次惩罚。","讲者通过类比音频信号处理，说明了正则化方法在信号重建中的实际应用。这有助于学生理解不同正则化方法的物理意义和数学背景。","讲者提到，使用Huber惩罚在某些情况下效果不如L1惩罚，这说明了在实际应用中需要根据具体问题选择合适的正则化方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1025.1,"end":1197.31,"asr_flags":[],"raw_segments":[{"start":1025.1,"text":"but isn't missing, and you pretend it's missing. Now you do signal reconstruction, and you try, you know, you try this thing, and someone at the next desk says, oh, you should try Huber, try Huber, you know, whatever. Try Huber on the third difference, and you're like, okay, dude, and you try these things. Every time you do that, you can make a prediction, which is X hat, of the values that you actually observed, but pretended you didn't. Everybody see that?"},{"start":1052.49,"text":"And then we can say, thanks for your suggesting of using a Huber penalty on the third difference. Just for the record, it did a lot worse than mine. OK, so everyone, if you follow that, that's fine. And if you didn't, it's probably OK. So I mean, certainly not part of the class, this class. OK, now when you."},{"start":1077.58,"text":"When your penalty is an L1 norm on the first difference, that's actually got a name. And this is just completely standard math. It's the total variation. Literally, in continuous time, it's like the integral of the absolute value of the derivative or something like that. And so this is the analog of that. ry. That's from econometrics, right? So, but there, so there's a lot, this comes up in lots and lots of fields."},{"id":62,"text":"All with different dialects and names for everything. And then this one is sort of interesting. You might say that's a little bit over-regularized. And what you can see here is it's going towards what we guessed was going to happen. That you're going to get something that's piecewise constant. And it would look like this. Everybody got this?"},{"id":63,"text":"There's no mystery here. It just follows from knowing about what happens with L1 norms and things like that. Let's see, I should probably make some other, yeah. You get the same thing. You get total variation denoising, for example, in images."},{"id":64,"text":"That's actually super interesting. You can do a sum of absolute values. You can take an image, let's say represented by a matrix, and you could do something like this. You could have i j plus 1, and then you would have x i j minus x i minus 1, and j."},{"id":65,"text":"And so you can take the L1 norm of that and then sum it over all pixels in your image. This is a very crude idea of the space gradient in the image. So it turns out a very good thing to do there. If you actually take the L1 norm of this, you actually end up with artifacts that are aligned with the axes. But if you just simply do this, this is a generalization of an absolute value. If you do..."},{"id":66,"text":"If you take this objective here, let me draw that a little bit better, right? By the way, this is not squared. It is not squared. It's just the sum of the norms. Everybody got that? That's called total variation. That's a total variation penalty for images. That works like actually really well, like quite well."},{"id":67,"text":"I mean, if you want to get into fancier ones, you can. But this is like as a first cut, this is actually really quite good. And what happens there is it preserves, it's going to preserve sharp boundaries. You know, obviously there's boundaries if I'm looking over there. Some pixels are the podium and some is the chair behind it. And there's a sharp boundary. And if I were to do this, smoothing with this."}],"notes":["本段讲解了总变分平滑的基本思想，即通过计算图像中相邻像素之间的差异并对其取L1范数，从而实现图像去噪。这种做法可以保留图像中的尖锐边界，避免过度平滑。","讲者提到总变分平滑是一种非常有效的图像去噪方法，其核心在于对图像梯度进行L1范数的求和，这与绝对值函数的推广有关。","在图像处理中，总变分平滑通过计算图像中每个像素与其相邻像素的差值，然后对这些差值取L1范数并求和，从而实现对图像的平滑处理。","讲者强调，总变分平滑能够保留图像中的尖锐边界，例如图像中物体与背景之间的边界，这在图像处理中非常重要。","总变分平滑的数学表达式是图像中相邻像素差值的L1范数之和，这与绝对值函数的推广有关，但不涉及平方项。","总变分平滑在图像处理中被广泛应用，因为它能够有效去除噪声，同时保留图像的边缘信息，是一种非常实用的图像处理技术。"],"formulas":[],"uncertainties":["i j plus 1, and then you would have x i j minus x i minus 1, and j"],"diagram":"none","start":1197.88,"end":1370.42,"asr_flags":[],"math_clarifications":["总变分（TV）在图像处理中通常定义为图像梯度的L1范数之和，即TV = sum_{i,j} (|x_{i,j} - x_{i-1,j}| + |x_{i,j} - x_{i,j-1}|)，而不是包含1/2系数的绝对值之和。此外，总变分作为惩罚项时，通常不包含1/2系数，且应明确其数学定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1197.88,"text":"the drums are muffled. I mean, that was rough, but actually correct, right? What I just said. Okay. So now we do a total variation smoothing. So total variation smoothing goes like this. This is maybe not quite enough. This is, this might be about right, but the cool part is if you take a look at it, it actually has preserved these sharp, these sharp shock. Okay. Shock. Sorry. That's from econometrics, right? So, but there, so there's a lot, this comes up in lots and lots of fields."},{"start":1227.64,"text":"All with different dialects and names for everything. And then this one is sort of interesting. You might say that's a little bit over-regularized. And what you can see here is it's going towards what we guessed was going to happen. That you're going to get something that's piecewise constant. And it would look like this. Everybody got this?"},{"start":1248.05,"text":"There's no mystery here. It just follows from knowing about what happens with L1 norms and things like that. Let's see, I should probably make some other, yeah. You get the same thing. You get total variation denoising, for example, in images."},{"start":1266.41,"text":"That's actually super interesting. You can do a sum of absolute values. You can take an image, let's say represented by a matrix, and you could do something like this. You could have i j plus 1, and then you would have x i j minus x i minus 1, and j."},{"start":1293.27,"text":"And so you can take the L1 norm of that and then sum it over all pixels in your image. This is a very crude idea of the space gradient in the image. So it turns out a very good thing to do there. If you actually take the L1 norm of this, you actually end up with artifacts that are aligned with the axes. But if you just simply do this, this is a generalization of an absolute value. If you do..."},{"start":1322.11,"text":"If you take this objective here, let me draw that a little bit better, right? By the way, this is not squared. It is not squared. It's just the sum of the norms. Everybody got that? That's called total variation. That's a total variation penalty for images. That works like actually really well, like quite well."},{"start":1346.83,"text":"I mean, if you want to get into fancier ones, you can. But this is like as a first cut, this is actually really quite good. And what happens there is it preserves, it's going to preserve sharp boundaries. You know, obviously there's boundaries if I'm looking over there. Some pixels are the podium and some is the chair behind it. And there's a sharp boundary. And if I were to do this, smoothing with this."}],"speech_gaps":[],"frame":"../frames/v010/008.webp","frame_time":1209.88},{"title":"总变分图像去噪与正则化过度的影响","segments":[{"id":68,"text":"I'm just doing a linear smoothing with a kernel that goes down like that, and it's going to blur things. You don't have to follow this, but if you know some of the stuff I'm talking about, that's great. People refer to that as total variation image denoising. Have people seen this? Who's seen this before?"},{"id":69,"text":"Somewhere. Okay, cool. In where? Pressure jumps across shock waves. Yeah, so this preserves. What happens if I use excessive regularization of this on an image? So I have a black and white image. I give it to you. And you say, I just learned about total variation, you know, whatever, denoising. And you use too much of this regularization. What do you get? Just guess."},{"id":70,"text":"It's zero, which is indeed very sparse, right? You have to admit that, right? Okay, so yes, if it was way too high, it would say, here's your new image. And the entire thing is just one, some grayscale value, right? Which is kind of the app."},{"id":71,"text":"It's zero, which is indeed very sparse, right? You have to admit that, right? Okay, so yes, if it was way too high, it would say, here's your new image. And the entire thing is just one, some grayscale value, right? Which is kind of the app. Okay, everybody got that? Okay. Okay, let's crank it down to something reasonable, right? And what do you think happens? I mean, it's something like this phenomenon here, right?"},{"id":72,"text":"What do you think, but in an image, what do you think it would, what would be the phenomenon in an image? What's that? Yeah, you'd get edges and regions with a constant grayscale value. Yeah, so actually what you'd end up getting is like cartoonish looking things, right? Because, you know, you take an image with, we never, you know, 8-bit or whatever it is, 8-bit stuff, and then you end up with like, you know, three different values, and you get regions, so."},{"id":73,"text":"Okay. These are just sort of examples to give you the idea of how these things are done. Okay. Next topic, which is something we're going to talk about also in other contexts, like a statistical context, is the idea of robust approximation. So, I mean, robustness is this thing. I think we've talked about it before."},{"id":74,"text":"It's a universal thing. If you do anything with math at all, then it's something you need to be aware of, right? Your model is not what you think it is. It might be really accurate if we're talking electromagnetics or photonics or E&M or Newtonian mechanics."}],"notes":["本段讨论了在图像处理中使用过多正则化（如L1正则化）可能导致的后果。当正则化参数过大时，图像会变得非常稀疏，最终可能只剩下单一的灰度值，这类似于将图像压缩为一个单一的灰度值。这种现象类似于在图像中过度平滑，导致图像失去细节，呈现出卡通化的视觉效果。","在图像中，过度正则化会导致图像中出现边缘和具有恒定灰度值的区域。这种现象类似于将图像分割为多个区域，每个区域具有相同的灰度值，从而形成类似卡通的视觉效果。这种效果是因为正则化过程倾向于保留图像中的边缘，同时将图像的其他部分平滑为常数。","在图像处理中，正则化参数的选择至关重要。如果参数过小，图像可能过于模糊；如果参数过大，图像可能过于稀疏，甚至失去所有细节。因此，选择合适的正则化参数是图像处理中的关键问题。","本段还提到，图像通常以8位格式存储，这意味着每个像素的灰度值范围是有限的。当正则化参数过大时，图像可能被压缩为少数几个灰度值，从而形成明显的区域划分。","在图像处理中，总变分（TV）去噪是一种常见的方法，它通过最小化图像的总变分来去除噪声。然而，如果正则化参数过大，这种方法可能导致图像失去细节，形成卡通化的视觉效果。","本段通过具体的例子说明了正则化参数对图像处理结果的影响，强调了在实际应用中需要仔细选择正则化参数的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1371.25,"end":1543.54,"asr_flags":[],"raw_segments":[{"start":1371.25,"text":"I'm just doing a linear smoothing with a kernel that goes down like that, and it's going to blur things. You don't have to follow this, but if you know some of the stuff I'm talking about, that's great. People refer to that as total variation image denoising. Have people seen this? Who's seen this before?"},{"start":1397.74,"text":"Somewhere. Okay, cool. In where? Pressure jumps across shock waves. Yeah, so this preserves. What happens if I use excessive regularization of this on an image? So I have a black and white image. I give it to you. And you say, I just learned about total variation, you know, whatever, denoising. And you use too much of this regularization. What do you get? Just guess."},{"start":1428.64,"text":"I think everyone can guess. What? Yeah, okay, sorry, yes. Not a blur. No, no. So, okay, if you... Okay, by the way, if you add too much like L1 regularization, what's the limit of that? What happens when I add like an enormous amount?"},{"start":1448.88,"text":"It's zero, which is indeed very sparse, right? You have to admit that, right? Okay, so yes, if it was way too high, it would say, here's your new image. And the entire thing is just one, some grayscale value, right? Which is kind of the app. Okay, everybody got that? Okay. Okay, let's crank it down to something reasonable, right? And what do you think happens? I mean, it's something like this phenomenon here, right?"},{"start":1475.29,"text":"What do you think, but in an image, what do you think it would, what would be the phenomenon in an image? What's that? Yeah, you'd get edges and regions with a constant grayscale value. Yeah, so actually what you'd end up getting is like cartoonish looking things, right? Because, you know, you take an image with, we never, you know, 8-bit or whatever it is, 8-bit stuff, and then you end up with like, you know, three different values, and you get regions, so."},{"start":1503.78,"text":"Okay. These are just sort of examples to give you the idea of how these things are done. Okay. Next topic, which is something we're going to talk about also in other contexts, like a statistical context, is the idea of robust approximation. So, I mean, robustness is this thing. I think we've talked about it before."},{"start":1525.82,"text":"It's a universal thing. If you do anything with math at all, then it's something you need to be aware of, right? Your model is not what you think it is. It might be really accurate if we're talking electromagnetics or photonics or E&M or Newtonian mechanics."}],"speech_gaps":[],"frame":"../frames/v010/009.webp","frame_time":1383.25},{"title":"不确定性处理与凸优化应用","segments":[{"id":75,"text":"Pretty accurate, thank you. But in other cases, it's not at all. That would be in areas like machine learning or, for that matter, finance. Your model is just a fantasy and it's not what's actually happening. Newtonian mechanics, I'd say it kind of is what's happening. E&M, your model is actually kind of what's happening. Although even there, there's questions. You might not know stuff and things like that."},{"id":76,"text":"So here it is. We want to, let's say, we want an approximation problem. We want to minimize norm AX minus B. But we're going to actually address the idea that we don't know A. So, you know, you don't know A. By the way, let's talk about how do most people in practice handle uncertainty? What's the most common method for handling uncertainty? It's not fancy. Well, how do most people handle uncertainty?"},{"id":77,"text":"Right now, if we're speaking, people are doing supply. They're working out supply. I guarantee you Amazon is working out supply chains. They're deciding stuff that's going to go to various warehouses and land at fulfillment centers in the Bay Area. Obviously, they don't know. So how do they handle the uncertainty? Mostly. That's a good question. So the question is, do they have a mean and a variance for A-way? Turns out, that's not true. It's even done."},{"id":78,"text":"What's the simplest way to handle uncertainty? I knew you guys were too... You really think things are that sophisticated? What do you do? Like a safety stock. I can't believe this. It's time for you to know something about the real world, which is horrifying. What is the simplest way to handle uncertainty? What?"},{"id":79,"text":"the guests okay now what is that oh they're getting close what does that mean yes educated yes educated okay sorry so but in particular here's what they do they just ignore it you just ignore it right i mean that's a that i guarantee you that night that's how 99 of actual uncertainty in practice is handled you're like you're like this is the demand we think for these products over the next hours and days or something like that and you're like uh"},{"id":80,"text":"You just say, cool, thanks. And then you solve some big convex problem to figure out what to do. That's actually kind of what happens, right? I mean, not always. You just ignore it. By the way, ignoring it and then just go ahead and implementing it is a very bad idea. So the least you could do, and now I'll take some of these suggestions, is what? The least you can do if you ignore it, if someone says, look, here's my data."}],"notes":["本段讨论了在实际应用中处理不确定性的方式，指出大多数情况下人们会忽略不确定性，直接使用数据进行决策。这种做法虽然常见，但可能带来严重后果，因为忽略不确定性可能导致决策失误。","讲者提到，即使在像机器学习和金融这样的领域，模型可能并不完全反映现实情况，但像牛顿力学和电磁学这样的物理模型则更接近现实。这说明不同领域对模型与现实的契合度存在差异。","在处理不确定性时，人们通常不会采用复杂的数学方法，而是通过简单的假设，如设定均值和方差，来处理问题。然而，这种做法并不总是准确，有时甚至会忽略不确定性本身。","讲者强调，忽略不确定性并直接进行决策是一种非常糟糕的做法，尤其是在面对复杂系统时。因此，即使在忽略不确定性的情况下，也应采取一些基本的措施来降低风险。","讲者提到，实际应用中，人们通常会假设某些参数的分布，如均值和方差，然后基于这些假设进行优化。这种做法虽然简单，但可能无法完全反映现实情况。","最后，讲者指出，即使在忽略不确定性的情况下，也应采取一些基本的措施，如使用凸优化方法来处理问题，以确保决策的合理性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1544.89,"end":1715.38,"asr_flags":[],"raw_segments":[{"start":1544.89,"text":"Pretty accurate, thank you. But in other cases, it's not at all. That would be in areas like machine learning or, for that matter, finance. Your model is just a fantasy and it's not what's actually happening. Newtonian mechanics, I'd say it kind of is what's happening. E&M, your model is actually kind of what's happening. Although even there, there's questions. You might not know stuff and things like that."},{"start":1573.28,"text":"So here it is. We want to, let's say, we want an approximation problem. We want to minimize norm AX minus B. But we're going to actually address the idea that we don't know A. So, you know, you don't know A. By the way, let's talk about how do most people in practice handle uncertainty? What's the most common method for handling uncertainty? It's not fancy. Well, how do most people handle uncertainty?"},{"start":1606.9,"text":"Right now, if we're speaking, people are doing supply. They're working out supply. I guarantee you Amazon is working out supply chains. They're deciding stuff that's going to go to various warehouses and land at fulfillment centers in the Bay Area. Obviously, they don't know. So how do they handle the uncertainty? Mostly. That's a good question. So the question is, do they have a mean and a variance for A-way? Turns out, that's not true. It's even done."},{"start":1637.26,"text":"What's the simplest way to handle uncertainty? I knew you guys were too... You really think things are that sophisticated? What do you do? Like a safety stock. I can't believe this. It's time for you to know something about the real world, which is horrifying. What is the simplest way to handle uncertainty? What?"},{"start":1661.6,"text":"the guests okay now what is that oh they're getting close what does that mean yes educated yes educated okay sorry so but in particular here's what they do they just ignore it you just ignore it right i mean that's a that i guarantee you that night that's how 99 of actual uncertainty in practice is handled you're like you're like this is the demand we think for these products over the next hours and days or something like that and you're like uh"},{"start":1689.52,"text":"You just say, cool, thanks. And then you solve some big convex problem to figure out what to do. That's actually kind of what happens, right? I mean, not always. You just ignore it. By the way, ignoring it and then just go ahead and implementing it is a very bad idea. So the least you could do, and now I'll take some of these suggestions, is what? The least you can do if you ignore it, if someone says, look, here's my data."}],"speech_gaps":[],"frame":"../frames/v010/010.webp","frame_time":1556.89},{"title":"处理不确定性与鲁棒性","segments":[{"id":81,"text":"And then they say, oh, the data's really, the change is quite, you know, it can be not what I'm saying, right? And you say, yeah, no problem, thanks. And they give you like, anyway, they give you like 50 different values for possible values for A, you just take the average or something like that and then go with it, right? But what should you do then? What would you do at that point? Well, at the least, yeah."},{"id":82,"text":"Yeah, you simulate it with that. So that would be probably the, I mean, the ones that I don't think are criminal, that would be an approach that's not criminal, right? If someone comes to you and says, you know, oh, I've generated samples from what I think A is. And you go, cool, thank you, right? Then you..."},{"id":83,"text":"The first thing you do is you form the average of A or the median or something like that. Use it in this thing. You get an X, and then you simulate this thing across all the individual samples. Everybody following that? And by the way, if it's pretty tight, you just say done, right? So that's the latest. Okay, so..."},{"id":84,"text":"So there are methods for handling uncertainty. Like I said, anyone who does anything in practice anywhere is going to have regularization. They may not call it regularization. They might call it robustness. That would be one name for it. It's got lots of names. But you can't make anything practical work without addressing..."},{"id":85,"text":"without addressing this uncertainty somehow. Actually, all of regularization in machine learning statistics, all of it is nothing but addressing uncertainty like this in data and stuff like that. Okay, so we'll look at a couple. Now we're going to look at fancy methods for doing this."},{"id":86,"text":"Well, there's different approaches. I think we saw these in some very early examples. So one is stochastic, right? So you say A comes from a distribution. They come from a name distribution. Or you could have, who knows, it could actually be something from which you can sample A's if you have a fancy model for it, right? That would be something. Another, actually probably better defensible, is..."},{"id":87,"text":"You estimate A. A is itself. There's a whole department that's estimating A. By A, I just mean the model, right? Or people say the forward model. The whole department doing it. And they could do things like what you do is you say to them, don't give me one model. Give me 50 plausible models. And what they would then do is they would say, cool, if you're going with one, here's the A we think you should use. But here's 50 others."}],"notes":["本段讨论了在面对不确定性时，如何通过平均或中位数等方法处理数据中的变化。讲者提到，当有多个可能的A值时，可以取平均值或中位数，并通过模拟来验证结果。如果结果足够紧密，就可以停止处理。","讲者指出，处理不确定性是实际应用中不可或缺的一部分，通常被称为正则化或鲁棒性。所有机器学习中的正则化方法本质上都是在处理数据中的不确定性。","讲者提到，处理不确定性有多种方法，包括随机方法（stochastic approach）和估计方法。随机方法假设A来自某种分布，而估计方法则通过生成多个可能的模型来处理不确定性。","讲者强调，实际应用中必须处理不确定性，否则无法构建有效的模型。他提到，即使不使用正则化术语，实际应用中也会通过鲁棒性来应对不确定性。","讲者提到，当有多个可能的模型时，可以生成多个模型并选择一个最合适的。这种方法在实际应用中更为合理，因为它考虑了多种可能性。","讲者最后指出，处理不确定性是构建可靠模型的关键，无论使用何种方法，都必须考虑数据中的不确定性。"],"formulas":[],"uncertainties":["name distribution"],"diagram":"none","start":1716.28,"end":1879.52,"asr_flags":[],"raw_segments":[{"start":1716.28,"text":"And then they say, oh, the data's really, the change is quite, you know, it can be not what I'm saying, right? And you say, yeah, no problem, thanks. And they give you like, anyway, they give you like 50 different values for possible values for A, you just take the average or something like that and then go with it, right? But what should you do then? What would you do at that point? Well, at the least, yeah."},{"start":1744.22,"text":"Yeah, you simulate it with that. So that would be probably the, I mean, the ones that I don't think are criminal, that would be an approach that's not criminal, right? If someone comes to you and says, you know, oh, I've generated samples from what I think A is. And you go, cool, thank you, right? Then you..."},{"start":1764.89,"text":"The first thing you do is you form the average of A or the median or something like that. Use it in this thing. You get an X, and then you simulate this thing across all the individual samples. Everybody following that? And by the way, if it's pretty tight, you just say done, right? So that's the latest. Okay, so..."},{"start":1788.25,"text":"So there are methods for handling uncertainty. Like I said, anyone who does anything in practice anywhere is going to have regularization. They may not call it regularization. They ally minimize the expected value. Now, that's a convex problem. I mean, because expectation preserves minimization, you know, preserves, sorry, expectation preserves convexity, right? So, okay."},{"id":90,"text":"I don't even believe it. It's not generated from probability distribution, which is true of almost everything, like almost nothing is, right? So it's ridiculous. It's not from a probability distribution. You'd say, but my experience says I think that the entries in this matrix are correct plus minus 3%. I mean, it could be a lot more sophisticated than that, right? You could say, well, the diagonal entries, I know this well. These things, oh, that entry, I barely know the sign."},{"id":91,"text":"Everybody following us would be things like that. So you could make up something like that. And then you could say, well, which A is it? You'd say any A that satisfies the constraints that I just described to you is plausible, right? And then, by the way, people have, they have huge philosophical fights, which is kind of hilarious, right? So the worst case people say like, oh my God, it's so unsophisticated to assume a distribution."},{"id":92,"text":"right? And they're like, that's ridiculous because it's not a probability distribution, blah, blah, blah, and stuff like that. And then, I don't know, the stochastic people, it'd be like a fight between Bayesians and frequentists or whatever. It's kind of, anyway, so."},{"id":93,"text":"And then the stochastic one would say something like, oh, the worst case is way too conservative. And you're like, none of this makes any sense, by the way. They're both, but they're much closer than they think. And actually, a lot of times it's embarrassing because they have this huge philosophical argument, and then it turns out you work out the math of what they're doing, and they're doing exactly the same thing, right?"},{"id":94,"text":"where one person has a knob that says how big their uncertainty set is, and the other has a kno  jumping ahead, but I don't mind doing it. How would you make a principled one in statistics? Let's say maximum likelihood. Sorry, I'm getting ahead, but you can just pretend. If you don't know what I'm talking about, that's fine too. Someone tell me a good way to honor a request for 10 plausible models. We'll do maximum likelihood here."}],"notes":["本段讨论了在模型生成过程中可能出现的欺诈行为，即提供多个看似不同的模型，但实际上只是重复使用同一个模型。讲者指出，这种做法是不诚实的，因为模型之间没有真正的变化，只是通过添加一些随机噪声来掩盖真相。","讲者进一步提出，为了生成一组合理的模型，可以采用统计学中的最大似然方法。这种方法是一种更系统、更严谨的模型生成方式，而不是简单地复制同一个模型。","在讲者提到的统计方法中，最大似然估计是一种常见的方法，用于从数据中推断模型参数。这种方法要求模型能够合理地解释数据，并且在不同数据集上生成的模型之间存在一定的变化。","讲者强调，模型生成过程中需要确保模型的多样性，即不同模型之间应有一定的差异，而不是简单地复制同一个模型。这种多样性有助于更好地理解问题的不确定性。","讲者还提到，如果模型之间没有显著差异，这可能意味着模型本身存在问题，或者数据本身缺乏足够的信息来生成不同的模型。","最后，讲者指出，虽然欺诈性模型生成是一种极端的做法，但为了确保模型的合理性和多样性，采用统计学方法如最大似然估计是更可取的。"],"formulas":[],"uncertainties":["randan"],"diagram":"none","start":2223.95,"end":2402.08,"asr_flags":[],"raw_segments":[{"start":2223.95,"text":"Okay, so it turns out, as a street fighting matter, it turns out that all you need is just literally a shockingly small number of samples of A, and then you do something like a mini-max or something like that, which would be something like a very crude approximation of this worst-case thing, does the trick. So, for example, if you say, design me a trajectory for..."},{"start":2252.09,"text":"I don't know, this drone or something goes from here to there, right? And you go like, okay, can I have the model? And they go, yeah, sure. And they go, well, what are these parameters? And you go, oh, we don't know. They can vary, right? That's the, I mean, because it depends on the payload and blah, blah, blah. And by the way, even if I tell you the payload, I might not know it within, you know, plus or minus 5% or something like that. So there, it turns out, an extremely good thing to do is just ask whoever is coming up with the model. You'd say, give me 10 models."},{"start":2281.29,"text":"And you say, here are the rules. They have to be plausible. They can't give you some crazy thing. You'd say every one of these, you would have to defend as a plausible model that it's consistent with what you know about the problem and the past data. Everybody see what I'm saying? And they could do that all sorts of, so you might do it this way. You'd say, not a problem. I'll fit a model on Monday data, Tuesday data, Wednesday data, and Thursday data. Done. Now you have seven different models. If they're wildly different, something's weird."},{"start":2310.02,"text":"If they're all the same as doubles, what do you think has happened? What would you do if you ask someone to make a model of something and they go, cool, I made one for Monday, Tuesday, Wednesday, Thursday. And you go, God, thanks so much. And then they're all, they're kind of like equal as doubles. It's not a convex optimization question here. What would you do?"},{"start":2339.43,"text":"Variation is not dependent on details. Nah, nah, that's not, no, yeah, but really you think, you think out of the eighth significant figure, it doesn't, no, it's fraud."},{"start":2352.56,"text":"That's what it is. They just lied. They just said, they just gave you eight copies, seven copies of a single model. So, you know, the least they should do is cover their tracks and add a little bit of randan into the model. I mean, come on, right? So if you're in this situation and some crazy person comes to you and says, give me ten models. Yeah, so, just for fun, that'd be one extreme."},{"start":2373.29,"text":"So fraud is one approach to generating a set of models. Let's do a principled one in statistics. We're jumping ahead, but I don't mind doing it. How would you make a principled one in statistics? Let's say maximum likelihood. Sorry, I'm getting ahead, but you can just pretend. If you don't know what I'm talking about, that's fine too. Someone tell me a good way to honor a request for 10 plausible models. We'll do maximum likelihood here."}],"speech_gaps":[],"frame":"../frames/v010/014.webp","frame_time":2235.95},{"title":"生成多个模型以处理不确定性","segments":[{"id":110,"text":"Someone tell me how to get 10 models. That's what I want to know. And don't pretend there's no one in statistics here because I know there's a lot of people in statistics here. So don't, yeah, go ahead. Somebody make a suggestion? You were going to make one?"},{"id":111,"text":"Do you bootstrap? That would be fun. Bootstrap would be fun. Here's a simple way that is convex optimization. You would do this. Certainly, you would find the maximum likelihood estimate. And you'd send that parameter and say, if you have to go with one, take this one. Right? Okay. But then what you would do is you'd find the maximum likelihood. I will draw the likelihood function right now. Sorry, I'm getting ahead of myself, but it's just fun. So here's the likelihood function. Here's the maximum likelihood point."},{"id":112,"text":"Right. What you do is you record what the maximum likelihood is. Drop to a to something to a likelihood level that is slightly less than the maximum likelihood, which is completely defensible statistically. And then what you would do is you would you would find points in here. Right. Like that."},{"id":113,"text":"I mean, I guess it depends. If it's all smooth, this would be like from the, you'd sample from the Fisher, you know, the Fisher information, the ellipsoid defined by it. Okay, sorry. That was weird. I just couldn't help myself. But did everybody get that? And then someone said, what have you given me? And you'd say, I gave you 10 models. And you go, well, you say the first one is actually the maximum likelihood. If you're going to go with one, I'd go with that if I were you. And you go, what are the other 10 or 100? And you would say, oh."},{"id":114,"text":"Those are models whose parameters are almost maximum likelihood. Everybody got that? Okay. And then you'd say, thank you. And then you'd come over here and you'd do something with, and then you'd put these in as a maximum or something like that, or an average. It wouldn't matter. Oh, sorry. I was going to tell you the secret on this. The secret is by simply admitting and acknowledging that there is uncertainty."},{"id":115,"text":"gets you like 90% of the way there. Then you can do all these fancy things later and you know, blah, blah, blah. But the point is just doing 10 is good enough. So now you know a secret, right? So if I go to my forecasting group and I tell you, here's the demand for this product over the next week, hour by hour, and you go, okay."},{"id":116,"text":"You go, are you certain? They're like, no. And then they say, please generate me 10 such trajectories or 100. I don't care. Right. Then this tells you this. And you say, but the rule is they have to be defensible. They can't be like weird things. Right. Every single one would have to pass as a model. Right. So that's what you would do. OK, so sorry, that was just a weird aside on all these things. OK, but this is the picture. So you can actually do things like stochastic."}],"notes":["本段讲授了如何通过生成多个模型来处理不确定性。首先，讲者提到通过最大似然估计找到一个模型，然后降低似然水平，找到接近最大似然的多个模型。这些模型的参数几乎达到最大似然估计，但略低于它，这是统计上完全合理的做法。","接着，讲者提到如果数据是平滑的，可以使用Fisher信息定义的椭球来采样，从而生成多个模型。这些模型需要是可辩护的，即每个模型都必须能够被视为一个合理的模型。","讲者进一步指出，生成多个模型（如10个或100个）可以提供更多的信息，帮助决策者更好地理解不确定性。这种方法的核心在于承认并接受不确定性，而不是试图找到一个单一的确定性模型。","最后，讲者以一个实际例子说明了这种方法的应用：在预测产品需求时，生成多个可能的轨迹，而不是仅提供一个确定的预测。这种方法可以提高预测的鲁棒性，因为每个轨迹都必须是合理的。","讲者强调，生成多个模型并不需要复杂的计算，只需要承认不确定性，并通过简单的统计方法（如最大似然估计和降低似然水平）来实现。这种方法可以为后续的复杂分析打下基础。","整个过程展示了如何通过凸优化方法处理不确定性，强调了在实际应用中，生成多个模型比追求单一确定性模型更为有效。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2402.86,"end":2571.59,"asr_flags":[],"raw_segments":[{"start":2402.86,"text":"Someone tell me how to get 10 models. That's what I want to know. And don't pretend there's no one in statistics here because I know there's a lot of people in statistics here. So don't, yeah, go ahead. Somebody make a suggestion? You were going to make one?"},{"start"
