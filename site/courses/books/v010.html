. Or you could have, who knows, it could actually be something from which you can sample A's if you have a fancy model for it, right? That would be something. Another, actually probably better defensible, is..."},{"start":1855.92,"text":"You estimate A. A is itself. There's a whole department that's estimating A. By A, I just mean the model, right? Or people say the forward model. The whole department doing it. And they could do things like what you do is you say to them, don't give me one model. Give me 50 plausible models. And what they would then do is they would say, cool, if you're going with one, here's the A we think you should use. But here's 50 others."}],"speech_gaps":[],"frame":"../frames/v010/011.webp","frame_time":1728.28},{"title":"概率模型与不确定性处理的哲学争论","segments":[{"id":88,"text":"that are consistent with everything we know and we have seen everybody understand what I just said so that's that's like ideal that's like okay thank you right or you could say here's a thousand because I have the that department that does the modeling says I I actually have a generative model I can generate you as many how many a's you want right I'll just I'll just sample from that distribution everybody","zh":"这些是与我们所知道的一切一致的，我们看到每个人都理解我刚才说的话，所以这就是理想的情况，就像好吧，谢谢，或者你可以说，这里有一千个，因为我有那个部门做建模，他们说，我实际上有一个生成模型，我可以生成你想要的任意数量的a，我只需要从那个分布中采样，每个人都能理解。","start":1880.12,"end":1901.58},{"id":89,"text":"following this, right? So that's stochastic, right? And then you might do something like actually minimize the expected value. Now, that's a convex problem. I mean, because expectation preserves minimization, you know, preserves, sorry, expectation preserves convexity, right? So, okay.","zh":"接下来，对吧？所以这就是随机的，对吧？然后你可能会做类似的事情，比如最小化期望值。现在，这是一个凸问题。我的意思是，因为期望值保持最小化，你知道的，保持，抱歉，期望值保持凸性，对吧？所以，好吧。","start":1902.85,"end":1930.27},{"id":90,"text":"I don't even believe it. It's not generated from probability distribution, which is true of almost everything, like almost nothing is, right? So it's ridiculous. It's not from a probability distribution. You'd say, but my experience says I think that the entries in this matrix are correct plus minus 3%. I mean, it could be a lot more sophisticated than that, right? You could say, well, the diagonal entries, I know this well. These things, oh, that entry, I barely know the sign.","zh":"我甚至都不相信。它并不是从概率分布中生成的，这在几乎所有事情中都是真的，对吧？几乎没有什么是这样生成的，对吧？所以这是荒谬的。它并不是来自一个概率分布。你会说，但我的经验告诉我，我认为这个矩阵中的条目是正确的，误差在3%左右。我的意思是，它可能比这更复杂，对吧？你可以说，好吧，对角线上的条目，我知道得很清楚。这些条目，哦，那个条目，我几乎都不知道符号。","start":1930.81,"end":1957.66},{"id":91,"text":"Everybody following us would be things like that. So you could make up something like that. And then you could say, well, which A is it? You'd say any A that satisfies the constraints that I just described to you is plausible, right? And then, by the way, people have, they have huge philosophical fights, which is kind of hilarious, right? So the worst case people say like, oh my God, it's so unsophisticated to assume a distribution.","zh":"所有跟上我们思路的人都会是这样的事情。所以你可以编造类似的东西。然后你可以说，好吧，哪个A是正确的？你会说，任何满足我刚才描述的约束条件的A都是合理的，对吧？顺便说一句，人们之间会有巨大的哲学争论，这有点可笑，对吧？所以最坏的情况，人们会说，哦我的天，假设一个分布是如此不成熟。","start":1958.92,"end":1981.69},{"id":92,"text":"right? And they're like, that's ridiculous because it's not a probability distribution, blah, blah, blah, and stuff like that. And then, I don't know, the stochastic people, it'd be like a fight between Bayesians and frequentists or whatever. It's kind of, anyway, so.","zh":"对吧？他们会觉得这很荒谬，因为它不是一个概率分布， blah, blah, blah，诸如此类的事情。然后，我不知道，那些随机的人，这会像贝叶斯学派和频率学派之间的争论，或者随便什么。这有点，总之是这样。","start":1982.37,"end":1994.45},{"id":93,"text":"And then the stochastic one would say something like, oh, the worst case is way too conservative. And you're like, none of this makes any sense, by the way. They're both, but they're much closer than they think. And actually, a lot of times it's embarrassing because they have this huge philosophical argument, and then it turns out you work out the math of what they're doing, and they're doing exactly the same thing, right?","zh":"然后，随机性的一方会说，哦，最坏情况分析太过保守了。你会说，顺便提一下，这些说法都不太对劲。他们其实很接近，但彼此却认为差距很大。实际上，很多时候这会让人感到尴尬，因为他们进行了一场巨大的哲学争论，结果你把他们所做的事情的数学推导理清楚后，发现他们实际上在做完全相同的事情，对吧？","start":1996.09,"end":2015.41},{"id":94,"text":"where one person has a knob that says how big their uncertainty set is, and the other has a knob that's basically like variance or something like that. So it turns out they're doing kind of the same thing. Oh, and there are hybrids of these. There's robust stochastic. And then you'd say, well, here's my uncertain parameter. It's from a probability distribution. And you go, cool, do you mind giving me the parameters? And you go, uh-huh, no.","zh":"其中一个人有一个旋钮，用来调节他们的不确定性集的大小，而另一个人的旋钮基本上就是方差或者其他类似的东西。结果发现他们做的事情其实很相似。哦，而且还有这些方法的混合形式，比如鲁棒随机性。然后你会说，好吧，我的不确定参数是从概率分布中来的。你会说，好啊，你愿意给我参数吗？然后他会说，嗯，不，不愿意。","start":2016.68,"end":2045.42}],"notes":["本段讨论了概率模型与不确定性处理的两种主要方法：随机方法（stochastic）和最坏情况方法（worst case）。随机方法通过期望值进行优化，而最坏情况方法则考虑最不利的情况。这两种方法在数学上都具有凸性，但它们在哲学上存在争议。","讲者指出，最坏情况方法假设数据不是来自概率分布，这在现实中几乎不可能，因此显得过于保守。而随机方法则基于概率分布，但需要提供参数信息，这在实际中可能难以实现。","讲者提到，尽管这两种方法在哲学上存在巨大分歧，但它们在数学上其实非常接近。例如，最坏情况方法中的不确定性集可以类比于随机方法中的方差，两者在本质上是相似的。","讲者还提到，存在混合方法，如鲁棒随机方法（robust stochastic），它结合了最坏情况和随机方法的优点，允许参数来自概率分布，但需要提供参数信息。","讲者强调，尽管两种方法在哲学上存在分歧，但它们在实际应用中往往殊途同归，因为它们的数学基础非常相似，只是在参数设定上有所不同。","最后，讲者指出，实际应用中，这两种方法的分歧往往被夸大了，因为它们在数学上其实非常接近，只是在参数设定和不确定性处理方式上有所不同。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1880.12,"end":2045.42,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1880.12,"text":"that are consistent with everything we know and we have seen everybody understand what i just said so that's that's like ideal that's like okay thank you right or you could say here's a thousand because i have the that department that does the modeling says i i actually have a generative model i can generate you as many how many a's you want right i'll just i'll just sample from that distribution everybody"},{"start":1902.85,"text":"following this, right? So that's stochastic, right? And then you might do something like actually minimize the expected value. Now, that's a convex problem. I mean, because expectation preserves minimization, you know, preserves, sorry, expectation preserves convexity, right? So, okay. At the other end, people do worst case, right? And this would be something like, look,"},{"start":1930.81,"text":"I don't even believe it. It's not generated from probability distribution, which is true of almost everything, like almost nothing is, right? So it's ridiculous. It's not from a probability distribution. You'd say, but my experience says I think that the entries in this matrix are correct plus minus 3%. I mean, it could be a lot more sophisticated than that, right? You could say, well, the diagonal entries, I know this well. These things, oh, that entry, I barely know the sign."},{"start":1958.92,"text":"Everybody following us would be things like that. So you could make up something like that. And then you could say, well, which A is it? You'd say any A that satisfies the constraints that I just described to you is plausible, right? And then, by the way, people have, they have huge philosophical fights, which is kind of hilarious, right? So the worst case people say like, oh my God, it's so unsophisticated to assume a distribution."},{"start":1982.37,"text":"right? And they're like, that's ridiculous because it's not a probability distribution, blah, blah, blah, and stuff like that. And then, I don't know, the stochastic people, it'd be like a fight between Bayesians and frequentists or whatever. It's kind of, anyway, so."},{"start":1996.09,"text":"And then the stochastic one would say something like, oh, the worst case is way too conservative. And you're like, none of this makes any sense, by the way. They're both, but they're much closer than they think. And actually, a lot of times it's embarrassing because they have this huge philosophical argument, and then it turns out you work out the math of what they're doing, and they're doing exactly the same thing, right?"},{"start":2016.68,"text":"where one person has a knob that says how big their uncertainty set is, and the other has a knob that's basically like variance or something like that. So it turns out they're doing kind of the same thing. Oh, and there are hybrids of these. There's robust stochastic. And then you'd say, well, here's my uncertain parameter. It's from a probability distribution. And you go, cool, do you mind giving me the parameters? And you go, uh-huh, no."}],"speech_gaps":[],"frame":"../frames/v010/012.webp","frame_time":1892.12},{"title":"不确定性建模与鲁棒性方法的对比","segments":[{"id":95,"text":"I give you a set of parameters, right? And then they would claim that this gives you the advantages of both of these methods. Anyway, this is just to give you the big picture of uncertainty modeling and things like that. Okay.","zh":"我给你一组参数，对吧？然后他们会声称这给了你这两种方法的优势。不管怎样，这只是为了给你一个不确定性建模和类似事物的总体概览。好的。","start":2045.98,"end":2061.08},{"id":96,"text":"All right. Okay, so here's just a baby example to see what the idea is. So here, I mean, it's a matrix, right? I don't know how big it is. It doesn't really matter, but it's a matrix, right? And what we're going to do is we're going to have extremely explicit uncertainty. It's extremely dumb. There's a line segment.","zh":"好的。好的，这里只是一个简单的例子，来看看这个想法是什么。所以这里，我指的是一个矩阵，对吧？我不知道它有多大。其实并不重要，但这是一个矩阵，对吧？而我们要做的事情是引入极度明确的不确定性。它非常愚蠢。有一条线段。","start":2061.92,"end":2079.82},{"id":97,"text":"in, there's a line segment in matrix space. I mean, that's kind of silly, right? Because it's a more common model would be all the end, these entries are all plus minus 1% and things like that, right? So, okay. But just, this is just to make the example so we can work out exactly what happens. So the A that you get is parameterized by U and we'll, you know, okay, here it is. And so,","zh":"在矩阵空间中，有一条线段。我指的是，这有点傻，对吧？因为更常见的模型是所有端点，这些条目都是加减1%之类的，对吧？所以，好的。但只是为了让例子更清晰，我们可以精确地计算出会发生什么。所以你得到的A是通过U参数化的，我们，你知道的，好的，这里就是。因此，","start":2081.41,"end":2103.05},{"id":98,"text":"This is what people would normally do. They would say, you know, what does my matrix look like? It looks like that. U is centered around zero. And they'd say, cool, my A matrix is A0, period, right? And that would give you this curve here. And what this is showing you is here, this is what happens when A is A0. This is what happens as you change A. And you can see...","zh":"这通常是人们会做的事情。他们会说，你知道吗，我的矩阵看起来像这样。U围绕零点中心。他们会说，酷，我的A矩阵就是A0，对吧？这会给你这里这条曲线。而这里展示的是，当A等于A0时会发生什么。这是当你改变A时会发生的情况。你可以看到……","start":2103.68,"end":2127.24},{"id":99,"text":"well, there's going to be these other methods. They're not as good as this one. This one has the absolute minimum value here. And you can see that as, you know, your errors, like, I don't know what this is, three. And then by the time this gets to minus one, it's double, it's six, right? And so you might say, well, this is too sensitive, right? Then you might look at the stochastic one. So here's the, this is the stochastic one. And what we do there is we","zh":"好吧，还会有其他方法。它们不如这个方法好。这个方法在这里有绝对最小值。你可以看到，随着你的误差，比如，我不知道这是三。当这个值降到-1时，它变成了六，对吧？因此你可能会说，好吧，这个太敏感了，对吧？然后你可能会看看随机方法。这里就是随机方法。我们在那里做的是","start":2127.95,"end":2153.33},{"id":100,"text":"minimize basically the integral of this over this range, and that gives you this one here. And what you can see here is you, so here's how people would say this, you have given up nominal performance, right? So you gave up nominal performance, and what you got was something that was much less sensitive to the variations.","zh":"基本上是在这个范围内对这个积分进行最小化，这会给你这里的结果。你可以看到这里，人们会这样描述，你放弃了名义性能，对吧？你放弃了名义性能，而你得到的是一个对变化更加不敏感的结果。","start":2154.23,"end":2175.85},{"id":101,"text":"see this and i mean that's kind of the story you want that that is exactly the story you that that's what you want to happen right and then the worst case one again you can that's that's not hard to solve um and it turns out for the worst case one here um you can see you gave up","zh":"看到这个，我的意思是，这就是你想要的故事，那就是你希望发生的事情，对吧？然后最坏情况下的那个，你也可以，这并不难解决，嗯，结果在这里，最坏情况下的那个，你可以看到你放弃了某些性能，但你可以看到它极其稳健，对吧？所以每个人，所以这个画面就是这样展开的，显然在更复杂的设置中也是如此，但这就是当你有一个处理鲁棒性或不确定性的方法时，你想要的故事，对吧？所以，这一切都讲得通。是的。我可以告诉你一个小窍门。你想听C吗？是的，但这只是非正式的。所以你不能告诉别人你是从哪里学到的。","start":2177.21,"end":2193.55},{"id":102,"text":"some performance here, but you can see that it's incredibly robust, right? So everybody, so this picture plays out and obviously much more sophisticated settings, but this is the story that you want to have when you have a method that addresses robustness, right? So, or uncertainty. So just all this make, make sense. Yeah. So I can tell you a little trick. You want to hear a C? Yeah, but this is, this is unofficial. So you can't tell people where you learn this.","zh":"这里有一些表现，但你可以看到它极其稳健，对吧？所以，大家，这张图展现的情况，显然在更复杂的场景中，但当你有一个处理鲁棒性或不确定性的方法时，这就是你想要的故事，对吧？所以，或者不确定性。所以这一切都讲得通。是的。我可以告诉你一个小窍门。你想听一个C吗？是的，但这只是非正式的。你不能告诉别人你是从哪里学到的。","start":2193.97,"end":2222.85}],"notes":["本段讲授了不确定性建模的基本概念，通过一个简单的矩阵例子来说明不同方法的鲁棒性。讲者提到，一种方法是将矩阵参数化为U，并假设U围绕零中心，从而得到一个确定性的A矩阵。这种情况下，A矩阵的性能表现是绝对最小值，但对误差非常敏感。","讲者指出，另一种方法是随机方法，通过在某个范围内对函数进行积分，从而得到一个更鲁棒的结果。这种方法虽然放弃了名义性能，但对参数变化的敏感度较低。讲者强调，这种随机方法在处理不确定性时具有优势。","讲者还提到，最坏情况方法（worst-case）也是一种处理不确定性的方法，虽然它会牺牲一些性能，但具有极强的鲁棒性。讲者指出，这种最坏情况方法在更复杂的设置中也适用，是处理不确定性时希望看到的典型故事。","讲者最后提到，不确定性建模的目的是在面对参数变化时，确保系统具有足够的鲁棒性。他提到，这种方法在处理不确定性时是希望看到的，即在牺牲一定性能的同时，获得更强的鲁棒性。","讲者还提到，不确定性建模的目的是在面对参数变化时，确保系统具有足够的鲁棒性。他提到，这种方法在处理不确定性时是希望看到的，即在牺牲一定性能的同时，获得更强的鲁棒性。","讲者最后提到，不确定性建模的目的是在面对参数变化时，确保系统具有足够的鲁棒性。他提到，这种方法在处理不确定性时是希望看到的，即在牺牲一定性能的同时，获得更强的鲁棒性。"],"formulas":[],"uncertainties":["in, there's a line segment in matrix space. I mean, that's kind of silly, right? Because it's a more common model would be all the end, these entries are all plus minus 1% and things like that, right? So, okay. But just, this is just to make the example so we can work out exactly what happens. So the A that you get is parameterized by U and we'll, you know, okay, here it is. And so,"],"diagram":"none","start":2045.98,"end":2222.85,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2045.98,"text":"I give you a set of parameters, right? And then they would claim that this gives you the advantages of both of these methods. Anyway, this is just to give you the big picture of uncertainty modeling and things like that. Okay."},{"start":2061.92,"text":"All right. Okay, so here's just a baby example to see what the idea is. So here, I mean, it's a matrix, right? I don't know how big it is. It doesn't really matter, but it's a matrix, right? And what we're going to do is we're going to have extremely explicit uncertainty. It's extremely dumb. There's a line segment."},{"start":2081.41,"text":"in, there's a line segment in matrix space. I mean, that's kind of silly, right? Because it's a more common model would be all the end, these entries are all plus minus 1% and things like that, right? So, okay. But just, this is just to make the example so we can work out exactly what happens. So the A that you get is parameterized by U and we'll, you know, okay, here it is. And so,"},{"start":2103.68,"text":"This is what people would normally do. They would say, you know, what does my matrix look like? It looks like that. U is centered around zero. And they'd say, cool, my A matrix is A0, period, right? And that would give you this curve here. And what this is showing you is here, this is what happens when A is A0. This is what happens as you change A. And you can see..."},{"start":2127.95,"text":"well, there's going to be these other methods. They're not as good as this one. This one has the absolute minimum value here. And you can see that as, you know, your errors, like, I don't know what this is, three. And then by the time this gets to minus one, it's double, it's six, right? And so you might say, well, this is too sensitive, right? Then you might look at the stochastic one. So here's the, this is the stochastic one. And what we do there is we"},{"start":2154.23,"text":"minimize basically the integral of this over this range, and that gives you this one here. And what you can see here is you, so here's how people would say this, you have given up nominal performance, right? So you gave up nominal performance, and what you got was something that was much less sensitive to the variations."},{"start":2177.21,"text":"see this and i mean that's kind of the story you want that that is exactly the story you that that's what you want to happen right and then the worst case one again you can that's that's not hard to solve um and it turns out for the worst case one here um you can see you gave up"},{"start":2193.97,"text":"some performance here, but you can see that it's incredibly robust, right? So everybody, so this picture plays out and obviously much more sophisticated settings, but this is the story that you want to have when you have a method that addresses robustness, right? So, or uncertainty. So just all this make, make sense. Yeah. So I can tell you a little trick. You want to hear a C? Yeah, but this is, this is unofficial. So you can't tell people where you learn this."}],"speech_gaps":[],"frame":"../frames/v010/013.webp","frame_time":2057.98},{"title":"模型生成与统计方法","segments":[{"id":103,"text":"Okay, so it turns out, as a street fighting matter, it turns out that all you need is just literally a shockingly small number of samples of A, and then you do something like a mini-max or something like that, which would be something like a very crude approximation of this worst-case thing, does the trick. So, for example, if you say, design me a trajectory for...","zh":"嗯，实际上，作为一个街头格斗的问题，结果发现你只需要非常惊人的少量A的样本，然后做一些类似mini-max的事情，这实际上是对最坏情况的一种非常粗略的近似，就能解决问题。例如，如果你说，设计一条轨迹，比如这个无人机或者其他什么东西从这里到那里，对吧？然后你会说，你能给我一个模型吗？他们就会说，当然可以。然后他们会问，这些参数是什么？你会说，哦，我们不知道。它们可能会变化，对吧？这就是我所说的，因为这取决于负载和其他因素。顺便说一句，即使我告诉你负载，我可能也无法精确到正负5%左右。因此，实际上，一个极其好的做法就是直接问正在构建模型的人。你会说，给我10个模型。","start":2223.95,"end":2251.57},{"id":104,"text":"I don't know, this drone or something goes from here to there, right? And you go like, okay, can I have the model? And they go, yeah, sure. And they go, well, what are these parameters? And you go, oh, we don't know. They can vary, right? That's the, I mean, because it depends on the payload and blah, blah, blah. And by the way, even if I tell you the payload, I might not know it within, you know, plus or minus 5% or something like that. So there, it turns out, an extremely good thing to do is just ask whoever is coming up with the model. You'd say, give me 10 models.","zh":"我不知道，这个无人机或者其他什么东西，是从这里到那里，对吧？然后你会说，我可以得到这个模型吗？他们就会说，是的，当然可以。然后他们会问，这些参数是什么？你会回答，哦，我们并不知道。它们可能会变化，对吧？这就是我所说的，因为这取决于负载和其他各种因素。顺便说一句，即使我告诉你负载是多少，我可能也无法精确到正负5%左右的范围。所以，这时候，一个极其好的做法就是直接问正在构建模型的人。你会说，给我10个模型。","start":2252.09,"end":2279.79},{"id":105,"text":"And you say, here are the rules. They have to be plausible. They can't give you some crazy thing. You'd say every one of these, you would have to defend as a plausible model that it's consistent with what you know about the problem and the past data. Everybody see what I'm saying? And they could do that all sorts of, so you might do it this way. You'd say, not a problem. I'll fit a model on Monday data, Tuesday data, Wednesday data, and Thursday data. Done. Now you have seven different models. If they're wildly different, something's weird.","zh":"如果它们都完全一样，你会怎么想？如果你问某人做一个模型，他们说，好的，我为周一、周二、周三和周四各做了一个模型。然后你会说，天啊，非常感谢。然后它们都差不多，像是双胞胎一样。这不是一个凸优化的问题。你会怎么做？","start":2281.29,"end":2309.07},{"id":106,"text":"If they're all the same as doubles, what do you think has happened? What would you do if you ask someone to make a model of something and they go, cool, I made one for Monday, Tuesday, Wednesday, Thursday. And you go, God, thanks so much. And then they're all, they're kind of like equal as doubles. It's not a convex optimization question here. What would you do?","zh":"变化并不依赖于细节。不，不，那不是，不，是的，但你真的会想，你真的会想，从第八位有效数字开始，它并不，不，这是欺诈。","start":2310.02,"end":2336.3},{"id":107,"text":"Variation is not dependent on details. Nah, nah, that's not, no, yeah, but really you think, you think out of the eighth significant figure, it doesn't, no, it's fraud.","zh":"变化并不依赖于细节。不，不，那不是，不，是的，但你真的会想，你真的会想，从第八位有效数字开始，它并不，不，这是欺诈。","start":2339.43,"end":2351.39},{"id":108,"text":"That's what it is. They just lied. They just said, they just gave you eight copies, seven copies of a single model. So, you know, the least they should do is cover their tracks and add a little bit of randan into the model. I mean, come on, right? So if you're in this situation and some crazy person comes to you and says, give me ten models. Yeah, so, just for fun, that'd be one extreme.","zh":"这就是情况。他们只是撒谎。他们只是说，他们给你八份拷贝，其中七份都是同一个模型。所以，他们至少应该掩盖一下痕迹，并在模型中加入一点随机性。我是说，拜托，对吧？如果你处于这种情况下，而有一个人来对你说，给我十个模型。嗯，就为了好玩，这就是一个极端的情况。","start":2352.56,"end":2372.66},{"id":109,"text":"So fraud is one approach to generating a set of models. Let's do a principled one in statistics. We're jumping ahead, but I don't mind doing it. How would you make a principled one in statistics? Let's say maximum likelihood. Sorry, I'm getting ahead, but you can just pretend. If you don't know what I'm talking about, that's fine too. Someone tell me a good way to honor a request for 10 plausible models. We'll do maximum likelihood here.","zh":"欺诈是一种生成一组模型的方法。让我们在统计学中做一个更严谨的方法。我们跳过了部分内容，但我并不介意这样做。你如何在统计学中做一个严谨的方法？比如说最大似然估计。抱歉，我有点跳前了，但你可以假装理解。如果你不知道我在说什么，也没关系。有人告诉我一个好方法，来满足对十个合理模型的请求。我们在这里使用最大似然估计。","start":2373.29,"end":2402.08}],"notes":["本段讨论了在模型生成过程中可能出现的欺诈行为，即提供多个看似不同的模型，但实际上只是重复使用同一个模型。讲者指出，这种做法是不诚实的，因为模型之间没有真正的变化，只是通过添加一些随机噪声来掩盖真相。","讲者进一步提出，为了生成一组合理的模型，可以采用统计学中的最大似然方法。这种方法是一种更系统、更严谨的模型生成方式，而不是简单地复制同一个模型。","在讲者提到的统计方法中，最大似然估计是一种常见的方法，用于从数据中推断模型参数。这种方法要求模型能够合理地解释数据，并且在不同数据集上生成的模型之间存在一定的变化。","讲者强调，模型生成过程中需要确保模型的多样性，即不同模型之间应有一定的差异，而不是简单地复制同一个模型。这种多样性有助于更好地理解问题的不确定性。","讲者还提到，如果模型之间没有显著差异，这可能意味着模型本身存在问题，或者数据本身缺乏足够的信息来生成不同的模型。","最后，讲者指出，虽然欺诈性模型生成是一种极端的做法，但为了确保模型的合理性和多样性，采用统计学方法如最大似然估计是更可取的。"],"formulas":[],"uncertainties":["randan"],"diagram":"none","start":2223.95,"end":2402.08,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2223.95,"text":"Okay, so it turns out, as a street fighting matter, it turns out that all you need is just literally a shockingly small number of samples of A, and then you do something like a mini-max or something like that, which would be something like a very crude approximation of this worst-case thing, does the trick. So, for example, if you say, design me a trajectory for..."},{"start":2252.09,"text":"I don't know, this drone or something goes from here to there, right? And you go like, okay, can I have the model? And they go, yeah, sure. And they go, well, what are these parameters? And you go, oh, we don't know. They can vary, right? That's the, I mean, because it depends on the payload and blah, blah, blah. And by the way, even if I tell you the payload, I might not know it within, you know, plus or minus 5% or something like that. So there, it turns out, an extremely good thing to do is just ask whoever is coming up with the model. You'd say, give me 10 models."},{"start":2281.29,"text":"And you say, here are the rules. They have to be plausible. They can't give you some crazy thing. You'd say every one of these, you would have to defend as a plausible model that it's consistent with what you know about the problem and the past data. Everybody see what I'm saying? And they could do that all sorts of, so you might do it this way. You'd say, not a problem. I'll fit a model on Monday data, Tuesday data, Wednesday data, and Thursday data. Done. Now you have seven different models. If they're wildly different, something's weird."},{"start":2310.02,"text":"If they're all the same as doubles, what do you think has happened? What would you do if you ask someone to make a model of something and they go, cool, I made one for Monday, Tuesday, Wednesday, Thursday. And you go, God, thanks so much. And then they're all, they're kind of like equal as doubles. It's not a convex optimization question here. What would you do?"},{"start":2339.43,"text":"Variation is not dependent on details. Nah, nah, that's not, no, yeah, but really you think, you think out of the eighth significant figure, it doesn't, no, it's fraud."},{"start":2352.56,"text":"That's what it is. They just lied. They just said, they just gave you eight copies, seven copies of a single model. So, you know, the least they should do is cover their tracks and add a little bit of randan into the model. I mean, come on, right? So if you're in this situation and some crazy person comes to you and says, give me ten models. Yeah, so, just for fun, that'd be one extreme."},{"start":2373.29,"text":"So fraud is one approach to generating a set of models. Let's do a principled one in statistics. We're jumping ahead, but I don't mind doing it. How would you make a principled one in statistics? Let's say maximum likelihood. Sorry, I'm getting ahead, but you can just pretend. If you don't know what I'm talking about, that's fine too. Someone tell me a good way to honor a request for 10 plausible models. We'll do maximum likelihood here."}],"speech_gaps":[],"frame":"../frames/v010/014.webp","frame_time":2235.95},{"title":"生成多个模型以处理不确定性","segments":[{"id":110,"text":"Someone tell me how to get 10 models. That's what I want to know. And don't pretend there's no one in statistics here because I know there's a lot of people in statistics here. So don't, yeah, go ahead. Somebody make a suggestion? You were going to make one?","zh":"有人告诉我如何得到10个模型。这就是我想知道的。不要假装这里没有统计学的人，我知道这里有很多统计学的人。所以不要，是的，继续说吧。有人能提出建议吗？你原本打算做一个吗？","start":2402.86,"end":2416.88},{"id":111,"text":"Do you bootstrap? That would be fun. Bootstrap would be fun. Here's a simple way that is convex optimization. You would do this. Certainly, you would find the maximum likelihood estimate. And you'd send that parameter and say, if you have to go with one, take this one. Right? Okay. But then what you would do is you'd find the maximum likelihood. I will draw the likelihood function right now. Sorry, I'm getting ahead of myself, but it's just fun. So here's the likelihood function. Here's the maximum likelihood point.","zh":"你们会使用自助法（bootstrap）吗？这会很有趣。自助法会很有趣。这里有一个简单的方法，属于凸优化。你会这么做。当然，你会找到最大似然估计。然后你会把这个参数发送出去，并说，如果你必须选择一个，就选择这个。对吧？好的。但接下来你会做的是找到最大似然估计。我现在就画出似然函数。抱歉，我有点跑题了，但这很有趣。这是似然函数。这里是最大似然点。","start":2417.97,"end":2445.15},{"id":112,"text":"Right. What you do is you record what the maximum likelihood is. Drop to a to something to a likelihood level that is slightly less than the maximum likelihood, which is completely defensible statistically. And then what you would do is you would you would find points in here. Right. Like that.","zh":"对的。你所做的就是记录最大似然值。然后降到一个稍低于最大似然值的似然水平，这在统计学上是完全合理的。然后你会在这个区域内找到点。对的。就像这样。","start":2445.71,"end":2464.57},{"id":113,"text":"I mean, I guess it depends. If it's all smooth, this would be like from the, you'd sample from the Fisher, you know, the Fisher information, the ellipsoid defined by it. Okay, sorry. That was weird. I just couldn't help myself. But did everybody get that? And then someone said, what have you given me? And you'd say, I gave you 10 models. And you go, well, you say the first one is actually the maximum likelihood. If you're going to go with one, I'd go with that if I were you. And you go, what are the other 10 or 100? And you would say, oh.","zh":"我的意思是，这取决于具体情况。如果一切都很平滑，这会类似于从费舍尔信息（Fisher information）中采样，也就是由它定义的椭球体。好的，抱歉。那句话有点奇怪。我就是忍不住要说出来。但大家明白了吗？然后有人问，你给了我什么？你会说，我给了你10个模型。然后你会说，你所说的第一个实际上是最大似然的。如果你必须选择一个，我会建议你选择这个。然后你会问，其他的10个或100个呢？你会说，哦。","start":2464.96,"end":2489.7},{"id":114,"text":"Those are models whose parameters are almost maximum likelihood. Everybody got that? Okay. And then you'd say, thank you. And then you'd come over here and you'd do something with, and then you'd put these in as a maximum or something like that, or an average. It wouldn't matter. Oh, sorry. I was going to tell you the secret on this. The secret is by simply admitting and acknowledging that there is uncertainty.","zh":"这些是参数几乎等于最大似然值的模型。大家明白了吗？好的。然后你会说，谢谢。然后你会过来这里做些事情，并把这些作为最大值或类似的东西，或者平均值。这没关系。哦，抱歉。我原本打算在这里告诉你这个秘密。秘密就是简单地承认并接受存在不确定性。","start":2490.45,"end":2518.98},{"id":115,"text":"gets you like 90% of the way there. Then you can do all these fancy things later and you know, blah, blah, blah. But the point is just doing 10 is good enough. So now you know a secret, right? So if I go to my forecasting group and I tell you, here's the demand for this product over the next week, hour by hour, and you go, okay.","zh":"这能让你达到90%的进度。之后你可以做各种复杂的事情，比如 blah, blah, blah。但重点是，做10个就已经足够好了。现在你已经知道一个秘密了，对吧？如果我去我的预测小组，告诉你们这个产品下周每小时的需求，你们会说，好的。","start":2519.69,"end":2538.95},{"id":116,"text":"You go, are you certain? They're like, no. And then they say, please generate me 10 such trajectories or 100. I don't care. Right. Then this tells you this. And you say, but the rule is they have to be defensible. They can't be like weird things. Right. Every single one would have to pass as a model. Right. So that's what you would do. OK, so sorry, that was just a weird aside on all these things. OK, but this is the picture. So you can actually do things like stochastic.","zh":"你们会问，你确定吗？他们会说，不。然后他们会说，请生成10条或100条这样的轨迹，我无所谓。对吧。这就能告诉你这个信息。然后你会说，但规则是它们必须是可辩护的。它们不能是奇怪的事情。对吧。每一条都必须能被当作一个模型。对吧。这就是你会做的事情。好的，抱歉，刚才只是关于所有这些事情的一个奇怪的插曲。好的，但这是整个画面。所以你实际上可以做一些事情，比如随机的。","start":2539.54,"end":2571.59}],"notes":["本段讲授了如何通过生成多个模型来处理不确定性。首先，讲者提到通过最大似然估计找到一个模型，然后降低似然水平，找到接近最大似然的多个模型。这些模型的参数几乎达到最大似然估计，但略低于它，这是统计上完全合理的做法。","接着，讲者提到如果数据是平滑的，可以使用Fisher信息定义的椭球来采样，从而生成多个模型。这些模型需要是可辩护的，即每个模型都必须能够被视为一个合理的模型。","讲者进一步指出，生成多个模型（如10个或100个）可以提供更多的信息，帮助决策者更好地理解不确定性。这种方法的核心在于承认并接受不确定性，而不是试图找到一个单一的确定性模型。","最后，讲者以一个实际例子说明了这种方法的应用：在预测产品需求时，生成多个可能的轨迹，而不是仅提供一个确定的预测。这种方法可以提高预测的鲁棒性，因为每个轨迹都必须是合理的。","讲者强调，生成多个模型并不需要复杂的计算，只需要承认不确定性，并通过简单的统计方法（如最大似然估计和降低似然水平）来实现。这种方法可以为后续的复杂分析打下基础。","整个过程展示了如何通过凸优化方法处理不确定性，强调了在实际应用中，生成多个模型比追求单一确定性模型更为有效。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2402.86,"end":2571.59,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2402.86,"text":"Someone tell me how to get 10 models. That's what I want to know. And don't pretend there's no one in statistics here because I know there's a lot of people in statistics here. So don't, yeah, go ahead. Somebody make a suggestion? You were going to make one?"},{"start":2417.97,"text":"Do you bootstrap? That would be fun. Bootstrap would be fun. Here's a simple way that is convex optimization. You would do this. Certainly, you would find the maximum likelihood estimate. And you'd send that parameter and say, if you have to go with one, take this one. Right? Okay. But then what you would do is you'd find the maximum likelihood. I will draw the likelihood function right now. Sorry, I'm getting ahead of myself, but it's just fun. So here's the likelihood function. Here's the maximum likelihood point."},{"start":2445.71,"text":"Right. What you do is you record what the maximum likelihood is. Drop to a to something to a likelihood level that is slightly less than the maximum likelihood, which is completely defensible statistically. And then what you would do is you would you would find points in here. Right. Like that."},{"start":2464.96,"text":"I mean, I guess it depends. If it's all smooth, this would be like from the, you'd sample from the Fisher, you know, the Fisher information, the ellipsoid defined by it. Okay, sorry. That was weird. I just couldn't help myself. But did everybody get that? And then someone said, what have you given me? And you'd say, I gave you 10 models. And you go, well, you say the first one is actually the maximum likelihood. If you're going to go with one, I'd go with that if I were you. And you go, what are the other 10 or 100? And you would say, oh."},{"start":2490.45,"text":"Those are models whose parameters are almost maximum likelihood. Everybody got that? Okay. And then you'd say, thank you. And then you'd come over here and you'd do something with, and then you'd put these in as a maximum or something like that, or an average. It wouldn't matter. Oh, sorry. I was going to tell you the secret on this. The secret is by simply admitting and acknowledging that there is uncertainty."},{"start":2519.69,"text":"gets you like 90% of the way there. Then you can do all these fancy things later and you know, blah, blah, blah. But the point is just doing 10 is good enough. So now you know a secret, right? So if I go to my forecasting group and I tell you, here's the demand for this product over the next week, hour by hour, and you go, okay."},{"start":2539.54,"text":"You go, are you certain? They're like, no. And then they say, please generate me 10 such trajectories or 100. I don't care. Right. Then this tells you this. And you say, but the rule is they have to be defensible. They can't be like weird things. Right. Every single one would have to pass as a model. Right. So that's what you would do. OK, so sorry, that was just a weird aside on all these things. OK, but this is the picture. So you can actually do things like stochastic."}],"speech_gaps":[],"frame":"../frames/v010/015.webp","frame_time":2414.86},{"title":"鲁棒最小二乘与正则化","segments":[{"id":117,"text":"robust least squares. And I'll go through this because it actually is very cool and it tells you about what regularization really is. So here it is. So we're going to do least squares. Here we are. So it's 1805 now and we're doing least squares. And so our model is going to be stochastic. We're going to say, well, no, I don't know A. A is A bar. That's kind of like a nominal value of A. Plus U. Use a random matrix, zero mean.","zh":"鲁棒最小二乘。我会讲解这个，因为它实际上非常有趣，并且能告诉你正则化到底是什么。所以这里我们开始。我们将进行最小二乘。现在是1805年，我们正在做最小二乘。我们的模型将是随机的。我们会说，不，我不知道A。A是A bar。这有点像A的名义值。加上U。使用一个随机矩阵，均值为零。","start":2572.46,"end":2601.6},{"id":118,"text":"And let's say that the expected value of each entry is u is p, right? So if p were like little sigma squared i, it says all the entries are all completely independent and they're all perturbed by an n0 sigma squared, little sigma squared value independently. Completely reasonable. By the way, if someone gives you a matrix and you say how accurate are the entries and they can't say, find someone else to work with.","zh":"假设每个元素的期望值是u，对吧？所以如果p类似于小的σ²i，它表示所有元素都是完全独立的，并且每个元素都独立地被n0σ²，小的σ²值扰动。这完全合理。顺便说一句，如果有人给你一个矩阵，并且你问这些元素的准确性，而他们无法回答，那就找别人合作。","start":2602.06,"end":2626.53},{"id":119,"text":"Because in any practice, if you can't say, if you can't say something like, oh, those are pretty good. Like third significant digit is actually like probably right. That's one thing. Or if they say the second digit is meaningless. So if they don't, if they can't say anything, then just find someone else to work with because this is not someone who knows what they're doing. Everybody got that? Okay.","zh":"因为在实际操作中，如果你无法说明，比如，你说这些元素相当准确，比如第三位有效数字可能正确，那就是一种情况。或者如果他们说第二位数字毫无意义。如果他们不能说明，那就找别人合作，因为这不是一个知道他们在做什么的人。大家明白了吗？好的。","start":2627.35,"end":2649.81},{"id":120,"text":"All right, so this is one of those cases where you can just analytically work this out. I mean, you just expand this and you get something really, really cool. It turns out you should solve this problem here. It's super simple, right? And actually now, let's just take P equals, you know, delta I, right? So delta would be little sigma squared I, right? Then it's very cool. You end up with this and you go, oh, that's taking off regularization. So you can turn this around.","zh":"好的，这是一个你可以直接进行解析计算的情况。我的意思是，你只需要展开这个表达式，就会得到一个非常酷的结果。结果是你应该解决这个问题。这非常简单，对吧？实际上，现在让我们取P等于delta I，对吧？delta就是小的σ²I，对吧？然后这变得非常酷。你最终得到这个结果，并说，哦，这就是正则化的应用。你可以反过来思考。","start":2650.89,"end":2679.12},{"id":121,"text":"And someone says, what are you doing? And you go, well, I'm doing regularized least squares. Like I'm doing ridge regression, you would say here, or you'd say ticking off regularization or something like that, right? And they'd say, why? And one thing you could say is, yeah, because I don't know A, right? And I think we already talked about the fact that this makes sense because the thing that happens, AX is sort of the result, right? If A is uncertain and X is big,","zh":"有人问你在做什么，你会说，我在做正则化的最小二乘。你会在这里说，我在做岭回归，或者你会说正则化，对吧？他们会问，为什么？你可以回答，是的，因为我不知道A，对吧？我认为我们已经讨论过，这是因为当A不确定而X很大时，AX的结果会发生变化，对吧？","start":2679.91,"end":2706.49},{"id":122,"text":"You get a lot of uncertainty in the result. If x is small, like if it's zero, it doesn't matter what a is. Everybody following this? So this all sort of makes sense, but it's very cool. So it means that, well, now you know what taken off regularization is or ridge regression is, right? It's basically saying that all of your data, I guess in, let's see, in a regression context, you're basically saying, thank you for all your features.","zh":"你得到的结果中有很多不确定性。如果x很小，比如是零，那么a的值就无关紧要。大家都能跟上吗？所以这一切大致上是有道理的，但非常有趣。这意味着，现在你已经知道什么是去正则化或者岭回归了，对吧？它基本上是在说，你所有的数据，我想在回归的背景下，你是在说，谢谢你们所有的特征。","start":2707.05,"end":2731.07}],"notes":["本段讲解了鲁棒最小二乘法，强调了正则化在处理不确定性矩阵A时的作用。通过引入随机扰动矩阵U，模型考虑了A的不确定性，从而引出正则化方法的必要性。","讲者指出，当矩阵A的不确定性较大时，结果的不确定性也会增加。如果x的值较小，即使A存在不确定性，结果也不会受到显著影响。这说明了正则化方法在处理不确定性时的重要性。","讲者提到，如果无法评估矩阵A的准确性，应避免与之合作。这强调了在实际应用中对数据准确性的重视，以及正则化方法在处理不确定数据时的实用性。","讲者通过将P设为delta I（即delta为小sigma平方的单位矩阵），展示了正则化方法如何通过引入额外的约束来稳定解。这表明正则化方法可以被视为一种对模型不确定性的补偿。","讲者进一步解释了正则化方法（如岭回归）的含义，即通过引入额外的约束来减少模型对数据的过度拟合。这说明了正则化方法在回归问题中的实际应用。","最后，讲者指出正则化方法可以被视为对数据特征的感谢，即通过引入额外的约束来提高模型的鲁棒性。这表明正则化方法在处理不确定性时的直观意义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2572.46,"end":2731.07,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2572.46,"text":"robust least squares. And I'll go through this because it actually is very cool and it tells you about what regularization really is. So here it is. So we're going to do least squares. Here we are. So it's 1805 now and we're doing least squares. And so our model is going to be stochastic. We're going to say, well, no, I don't know A. A is A bar. That's kind of like a nominal value of A. Plus U. Use a random matrix, zero mean."},{"start":2602.06,"text":"And let's say that the expected value of each entry is u is p, right? So if p were like little sigma squared i, it says all the entries are all completely independent and they're all perturbed by an n0 sigma squared, little sigma squared value independently. Completely reasonable. By the way, if someone gives you a matrix and you say how accurate are the entries and they can't say, find someone else to work with."},{"start":2627.35,"text":"Because in any practice, if you can't say, if you can't say something like, oh, those are pretty good. Like third significant digit is actually like probably right. That's one thing. Or if they say the second digit is meaningless. So if they don't, if they can't say anything, then just find someone else to work with because this is not someone who knows what they're doing. Everybody got that? Okay."},{"start":2650.89,"text":"All right, so this is one of those cases where you can just analytically work this out. I mean, you just expand this and you get something really, really cool. It turns out you should solve this problem here. It's super simple, right? And actually now, let's just take P equals, you know, delta I, right? So delta would be little sigma squared I, right? Then it's very cool. You end up with this and you go, oh, that's taking off regularization. So you can turn this around."},{"start":2679.91,"text":"And someone says, what are you doing? And you go, well, I'm doing regularized least squares. Like I'm doing ridge regression, you would say here, or you'd say ticking off regularization or something like that, right? And they'd say, why? And one thing you could say is, yeah, because I don't know A, right? And I think we already talked about the fact that this makes sense because the thing that happens, AX is sort of the result, right? If A is uncertain and X is big,"},{"start":2707.05,"text":"You get a lot of uncertainty in the result. If x is small, like if it's zero, it doesn't matter what a is. Everybody following this? So this all sort of makes sense, but it's very cool. So it means that, well, now you know what taken off regularization is or ridge regression is, right? It's basically saying that all of your data, I guess in, let's see, in a regression context, you're basically saying, thank you for all your features."}],"speech_gaps":[],"frame":"../frames/v010/016.webp","frame_time":2584.46},{"title":"凸优化中的不确定性建模与几何解释","segments":[{"id":123,"text":"your feature matrix because that's what A is right basically it says I'll trust all these features are plus minus you know uh 0.01 with they're disturbed by independent gaussians everybody following this so that's what this and then it says that suggests a taken off parameter right so that makes sense I mean it's kind of I think it's kind of cool right um","zh":"你的特征矩阵，因为这就是A基本上，它说我会信任所有这些特征都是正负，你知道的，大约是0.01，它们被独立高斯噪声扰动，大家都是这样，对吧？所以这就是这个，然后它说这暗示了一个参数被取走，对吧？这很合理，我的意思是，我觉得这有点酷，对吧？嗯","start":2731.85,"end":2755.93},{"id":124,"text":"I'm not going to go into the details of this because it's actually quite complicated, but you can actually do a weird thing with... You can actually work out the case where A is in... This is an ellipsoid in matrix space. That's what that is, right? This would be the analog of the previous one. In the previous one, I made a... Well, I didn't say what the distribution was, but I told you it's first and second moments, right? But I didn't say it was Gaussian or anything, but anyway. So here...","zh":"我不会深入细节，因为实际上这相当复杂，但你实际上可以做一些奇怪的事情，比如，你可以实际计算出A在……这是一个矩阵空间中的椭球体。这就是它的意思，对吧？这将是前一个的类比。在前一个中，我做了……好吧，我没有说分布是什么，但我告诉你它是第一和第二矩，对吧？但我没有说它是高斯分布或者其他什么，不管怎样。所以在这里……","start":2757.39,"end":2785.31},{"id":125,"text":"this would be the ellipsoid. And you say any matrix in this ellipsoid is a plausible model. You can actually tell, I'm not going to go through it, but it's actually, these are things that, let's say, Lagrange would not have known. Let's just put it that way. Probably could have explained it to him pretty quickly, to be honest, but nevertheless, well, okay, they'd have some questions, like how on earth do you solve that problem? But we'd have an answer for that too, right?","zh":"这将是椭球体。你说任何在这个椭球体内的矩阵都是一个合理的模型。你实际上可以判断，我不会详细说明，但事实上，这些都是像拉格朗日可能不会知道的事情。我们就这样说吧。说实话，可能可以很快向他解释清楚，但无论如何，好吧，他们可能会有一些问题，比如，你怎么解决这个问题？但我们也会有答案，对吧？","start":2786.47,"end":2812.44},{"id":126,"text":"Okay, I'm not going to look at it. We won't go into the details because it's quite complicated, but I'll just show you the results, which are really very cool. Oh, and this is, by the way, the kind of thing you'd expect to have, right? Let me explain what we're doing. So here's what we're doing. This is now, I have a disk in matrix space. I mean, it's a baby example, right? But I have a disk. That's what this is if you think about it, right? It's two-dimensional.","zh":"好的，我不会去看它。我们不会深入细节，因为它相当复杂，但我只会展示结果，这些结果真的很酷。哦，顺便说一句，这就是你期望会有的东西，对吧？让我解释一下我们在做什么。所以这里我们正在做的是，我现在有一个矩阵空间中的圆盘。我的意思是，这是一个简单的例子，对吧？但我有一个圆盘。这就是它的意思，如果你这样想的话，对吧？它是二维的。","start":2814.19,"end":2840.49},{"id":127,"text":"It goes off in these two directions, A1 and A2. I have a disk. And actually, I put a uniform distribution on the disk, on this unit disk, right? That's what actually happens. So this one is cool. This is x least squares. That just says that's the traditional method of handling uncertainty, which is ignore it. And I just plug in the mean, and I calculate x.","zh":"它沿着这两个方向A1和A2延伸。我有一个圆盘。实际上，我在这个单位圆盘上放置了一个均匀分布，对吧？这就是实际发生的事情。这个很酷。这是x最小二乘法。它只是说这是处理不确定性的传统方法，即忽略它。我只需代入均值，并计算x。","start":2841.61,"end":2862.88},{"id":128,"text":"And then you get this distribution like this, which you should do anyway, just to check. And that's a message to you that you probably shouldn't, that you need to be a little bit more sophisticated than just ignoring uncertainty. And let me just check on a few things here. Let's describe. How would you describe in words these events? What would you say? Worst case.","zh":"然后你会得到这样的分布，你应该这样做，只是为了检查。这是一个信息，告诉你你可能不应该忽略不确定性，你需要比仅仅忽略不确定性更 sophisticated。让我在这里检查一些事情。让我们描述一下。你怎么用语言来描述这些事件？你会怎么说？最坏情况。","start":2863.86,"end":2894.01}],"notes":["本段讲授了在凸优化中如何处理不确定性，通过将特征矩阵视为被独立高斯噪声扰动的模型，从而引入了参数估计的问题。讲者提到，这种模型假设所有特征值在±0.01范围内变化，且服从独立高斯分布。这种建模方式为后续的优化问题提供了几何解释，即通过椭球体或圆盘来表示可能的参数空间。","讲者进一步解释了如何将不确定性建模为矩阵空间中的几何形状，如椭球体和圆盘。椭球体表示参数的可能范围，而圆盘则代表均匀分布的参数空间。这种几何解释有助于理解参数的不确定性如何影响优化问题的解。","讲者提到，传统的处理不确定性方法是忽略它，即使用均值来估计参数。这种方法虽然简单，但可能不够精确。因此，讲者强调需要更复杂的处理方式，例如通过优化方法来考虑不确定性的影响。","讲者还提到，如何描述这些事件，特别是最坏情况下的处理方式。这表明在凸优化中，需要考虑不同情况下的鲁棒性，而不仅仅是基于均值的估计。","讲者提到，这些方法可能需要更复杂的数学工具，如拉格朗日乘数法，但这些方法在现代优化中已经被广泛使用。这表明，虽然这些方法可能在历史上较为复杂，但现代计算工具使得它们变得可行。","讲者通过几何解释和实际例子，展示了如何将不确定性建模为凸优化问题的一部分。这种建模方式不仅有助于理解参数的不确定性，还为后续的优化算法提供了理论基础。"],"formulas":[],"uncertainties":["the taken off parameter","the analog of the previous one","the first and second moments","the traditional method of handling uncertainty","the message to you that you probably shouldn't"],"diagram":"none","start":2731.85,"end":2894.01,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2731.85,"text":"your feature matrix because that's what a is right basically it says i'll trust all these features are plus minus you know uh 0.01 with they're disturbed by independent gaussians everybody following this so that's what this and then it says that suggests a taken off parameter right so that makes sense i mean it's kind of i think it's kind of cool right um"},{"start":2757.39,"text":"I'm not going to go into the details of this because it's actually quite complicated, but you can actually do a weird thing with... You can actually work out the case where A is in... This is an ellipsoid in matrix space. That's what that is, right? This would be the analog of the previous one. In the previous one, I made a... Well, I didn't say what the distribution was, but I told you it's first and second moments, right? But I didn't say it was Gaussian or anything, but anyway. So here..."},{"start":2786.47,"text":"this would be the ellipsoid. And you say any matrix in this ellipsoid is a plausible model. You can actually tell, I'm not going to go through it, but it's actually, these are things that, let's say, Lagrange would not have known. Let's just put it that way. Probably could have explained it to him pretty quickly, to be honest, but nevertheless, well, okay, they'd have some questions, like how on earth do you solve that problem? But we'd have an answer for that too, right?"},{"start":2814.19,"text":"Okay, I'm not going to look at it. We won't go into the details because it's quite complicated, but I'll just show you the results, which are really very cool. Oh, and this is, by the way, the kind of thing you'd expect to have, right? Let me explain what we're doing. So here's what we're doing. This is now, I have a disk in matrix space. I mean, it's a baby example, right? But I have a disk. That's what this is if you think about it, right? It's two-dimensional."},{"start":2841.61,"text":"It goes off in these two directions, A1 and A2. I have a disk. And actually, I put a uniform distribution on the disk, on this unit disk, right? That's what actually happens. So this one is cool. This is x least squares. That just says that's the traditional method of handling uncertainty, which is ignore it. And I just plug in the mean, and I calculate x."},{"start":2863.86,"text":"And then you get this distribution like this, which you should do anyway, just to check. And that's a message to you that you probably shouldn't, that you need to be a little bit more sophisticated than just ignoring uncertainty. And let me just check on a few things here. Let's describe. How would you describe in words these events? What would you say? Worst case."}],"speech_gaps":[],"frame":"../frames/v010/017.webp","frame_time":2743.85},{"title":"统计估计的基本概念","segments":[{"id":129,"text":"Yeah, you say, look, this is bad. These are perturbations to A where my choice of X gave me a really big residual, right? So these are kind of, this is, you know, bad luck or something. Oh, by the way, how do you describe these? Yeah, what would you call it? Yeah, how about dumb luck? Right, because you're using a dumb method, right? And sure enough, 5% of the time, the perturbation of A is in a way that actually helped you, right? So this is, I would call this dumb luck.","zh":"是的，你说，看，这很糟糕。这些是对A的扰动，我的X的选择让我得到了一个非常大的残差，对吧？所以这些可以说是，这有点像坏运气或者什么的。哦，顺便问一下，你怎么描述这些呢？是的，你会怎么称呼它？是的，怎么不说傻运气呢？对，因为你使用了一个傻方法，对吧？而且确实，5%的时间，A的扰动实际上帮助了你，对吧？所以我会称这为傻运气。","start":2894.64,"end":2923.98},{"id":130,"text":"Then we look at ticking off here, or ridge regression, if you want to. That's a different dialect for it. So if you do ridge regression, you get this. And actually, it's really cool to see. I mean, you see immediately kind of what adding regularization does. It tightens the distribution with respect. In this case, it's with respect to a very specific perturbation of the parameters. So that's this one. And then when you do the robustly squares,","zh":"然后我们看看这里，或者说是岭回归，如果你想的话。这是它的另一种说法。所以如果你做岭回归，你会得到这个结果。实际上，看到这个真的很酷。我的意思是，你立刻就能看出添加正则化的作用。它会收紧分布，相对于这个参数的特定扰动。所以这就是这个情况。然后当你做稳健平方，","start":2926.41,"end":2954.43},{"id":131,"text":"I mean, that's unfair because we told it exactly what the disk was and stuff like that. And you can see you get this beautiful, very tight distribution. So make sense? Yeah. Okay. So, okay. So this is, and you know, these are all like convex problems and stuff like that. So, okay. All right. So our next topic.","zh":"我的意思是，这不公平，因为我们已经告诉它盘子是什么样子的，以及类似的东西。你可以看到你会得到一个非常漂亮的、非常紧的分布。这有道理吗？是的。好的。所以，好的。所以这就是，你知道，这些都是凸问题之类的东西。所以，好的。那么我们接下来的话题。","start":2955.06,"end":2978.9},{"id":132,"text":"is a statistical estimation. It's extremely elementary, but we'll talk about it. It's sort of interesting. So actually, it's one of those things where if you haven't seen this stuff before, you're not going to understand it from what I say. And if you've seen it before, you'll be bored out of your mind or something like that. So I'll probably tell some weird stories through it, anyway, just to make it more interesting. But here we go. So we'll just start with parametric distribution estimation.","zh":"是统计估计。它极其基础，但我们会谈谈它。它有点有趣。实际上，这是那种如果你之前没看过这些东西，你从我说的话里是无法理解它的。如果你之前看过，你就会无聊得要死或者类似的情况。所以我可能会通过讲一些奇怪的故事来让它更有趣。但让我们开始吧。我们将从参数分布估计开始。","start":2980.51,"end":3007.23},{"id":133,"text":"Here's the idea, is that we have a density and we have an observed value of something. We have a density, but the density is indexed by a parameter, right? For example, a Gaussian would be indexed by, let's say, its mean and its covariance matrix, let's say, right? Or a Poisson variable by its rate or something like this, or an exponential variable by its rate or whatever it is, right? So you'd have parameters.","zh":"这里的想法是，我们有一个密度函数，我们有一个观察到的值。我们有一个密度函数，但这个密度函数是通过一个参数索引的，对吧？例如，一个高斯分布是通过它的均值和协方差矩阵索引的，对吧？或者一个泊松变量通过它的速率，或者一个指数变量通过它的速率或者其他什么，对吧？所以你会有参数。","start":3009.38,"end":3037.84},{"id":134,"text":"And what we'll do is we'll put the parameter as a subscript. So px of y is going to be the density with parameter values x at the point y, right? So that's going to be, that's called the likelihood function.","zh":"我们将参数作为下标。所以，px(y)指的是在点y处参数值为x的密度函数，对吧？这就是所谓的似然函数。","start":3038.85,"end":3060.57}],"notes":["本段介绍了统计估计的基本概念，特别是参数化分布估计。讲者提到，当我们有一个密度函数，并且该密度函数由参数索引时，我们可以通过观察到的数据来估计这些参数。例如，高斯分布由均值和协方差矩阵索引，泊松分布由速率索引，指数分布也由速率索引。","讲者强调，参数化分布估计中，参数通常以下标形式表示，如px(y)表示参数为x时在点y处的密度函数，这被称为似然函数。这一概念是统计估计的基础，用于从数据中推断参数的值。","讲者提到，如果听众之前没有接触过这些内容，可能无法完全理解；如果之前学过，可能会觉得无聊。因此，他计划通过讲述一些有趣的故事来增加内容的趣味性。","讲者还提到，统计估计是一个非常基础但重要的主题，它在许多领域都有应用，如机器学习和信号处理。通过参数化分布估计，我们可以从数据中学习到关于未知参数的信息。","在讲授过程中，讲者使用了多个例子来说明参数化分布的概念，如高斯分布、泊松分布和指数分布，这些例子帮助听众更好地理解参数化分布估计的基本思想。","讲者还提到，参数化分布估计是凸优化的一个应用领域，这表明该主题与课程的其他部分有联系，如凸问题和优化方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2894.64,"end":3060.57,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2894.64,"text":"Yeah, you say, look, this is bad. These are perturbations to A where my choice of X gave me a really big residual, right? So these are kind of, this is, you know, bad luck or something. Oh, by the way, how do you describe these? Yeah, what would you call it? Yeah, how about dumb luck? Right, because you're using a dumb method, right? And sure enough, 5% of the time, the perturbation of A is in a way that actually helped you, right? So this is, I would call this dumb luck."},{"start":2926.41,"text":"Then we look at ticking off here, or ridge regression, if you want to. That's a different dialect for it. So if you do ridge regression, you get this. And actually, it's really cool to see. I mean, you see immediately kind of what adding regularization does. It tightens the distribution with respect. In this case, it's with respect to a very specific perturbation of the parameters. So that's this one. And then when you do the robustly squares,"},{"start":2955.06,"text":"I mean, that's unfair because we told it exactly what the disk was and stuff like that. And you can see you get this beautiful, very tight distribution. So make sense? Yeah. Okay. So, okay. So this is, and you know, these are all like convex problems and stuff like that. So, okay. All right. So our next topic."},{"start":2980.51,"text":"is a statistical estimation. It's extremely elementary, but we'll talk about it. It's sort of interesting. So actually, it's one of those things where if you haven't seen this stuff before, you're not going to understand it from what I say. And if you've seen it before, you'll be bored out of your mind or something like that. So I'll probably tell some weird stories through it, anyway, just to make it more interesting. But here we go. So we'll just start with parametric distribution estimation."},{"start":3009.38,"text":"Here's the idea, is that we have a density and we have an observed value of something. We have a density, but the density is indexed by a parameter, right? For example, a Gaussian would be indexed by, let's say, its mean and its covariance matrix, let's say, right? Or a Poisson variable by its rate or something like this, or an exponential variable by its rate or whatever it is, right? So you'd have parameters."},{"start":3038.85,"text":"And what we'll do is we'll put the parameter as a subscript. So px of y is going to be the density with parameter values x at the point y, right? So that's going to be, that's called the likelihood function."}],"speech_gaps":[],"frame":"../frames/v010/018.webp","frame_time":2906.64},{"title":"最大似然估计与凸性","segments":[{"id":135,"text":"People often work with the log likelihood function, obviously maximizing a likelihood and a log likelihood are the same thing, and so you would have something that looks like this. So here, this is an estimator for x, and you're given y, which is an observation.","zh":"人们经常使用对数似然函数，显然最大化似然和最大化对数似然是一回事，因此你会得到一个看起来像这样的结果。在这里，这是对x的估计，你被给出y，它是观测值。","start":3062.36,"end":3076.64},{"id":136,"text":"And it's you know it I mean it kind of makes sense and you could argue a lot of things about it And if you take a like statistics 101 class you'll hear a lot about about properties of this right so okay So that's that's maximum likelihood estimation So as I said this is called the log likelihood function by the way here what we're doing is we're considering this a function of X which is the parameter in the distribution not of Y right so","zh":"而且，你知道，这在某种程度上是有道理的，你可以对它进行很多讨论。如果你上过统计学101课程，你会听到很多关于这个函数性质的内容。好的，这就是最大似然估计。正如我所说的，这里我们称之为对数似然函数。在这里，我们考虑的是一个关于X的函数，X是分布中的参数，而不是Y，对吧？","start":3077.49,"end":3102.73},{"id":137,"text":"And you can add constraints to this. I mean, for example, if this is a Gaussian distribution, let's say scalar, with mean mu and standard deviation little sigma, right? Then...","zh":"你可以给这个函数添加约束。例如，如果这是一个标量高斯分布，均值为mu，标准差为小sigma，对吧？那么...","start":3104.85,"end":3120.59},{"id":138,"text":"You know, little sigma has to be positive, like otherwise it makes no sense at all. So you could add, you would add that as a constraint or simply define the likelihood to be zero. If you say, if you say, well, how, you know, what, what density do I get when, what's my likelihood if I guess that the standard deviation is minus one?","zh":"你知道，小sigma必须是正数，否则完全没有意义。因此，你可以添加这个作为约束条件，或者简单地将似然定义为零。如果你说，如果标准差猜测为负一，你会得到什么样的密度？","start":3121.39,"end":3141.85},{"id":139,"text":"I mean, aside from that being profoundly stupid, you just get zero. And then log of zero is minus infinity, and that means you did a very bad job of maximizing. So, okay. You can add regularization, too. So regularized maximum likelihood, you could do. So the question is, when is this convex? And it's convex when the log likelihood function is concave.","zh":"我的意思是，除了这明显是愚蠢的之外，你只会得到零。然后零的对数是负无穷，这意味着你做得很糟糕，无法最大化。所以，好的。你也可以添加正则化。因此，正则化的最大似然估计也是可以进行的。问题是，什么时候这个函数是凸的？当对数似然函数是凹函数时，它才是凸的。","start":3142.35,"end":3167.73},{"id":140,"text":"Now you have to be super careful because up till now we saw the idea of a log-concave distribution or density. So a density is log-concave if when you fix x, this thing is concave in y. That's a log-concave density. This is not that.","zh":"现在你必须非常小心，因为直到现在我们看到的是关于对数凹分布或密度的概念。如果固定x，这个函数在y上是凹的，那么这就是一个对数凹密度。这并不是这种情况。","start":3168.81,"end":3187.85},{"id":141,"text":"This is the opposite. This is, how does this vary as a function of when you fix y of x, which is the parameter in the distribution. Everybody got that? Now it's going to turn out that there's lots of cases, like if it's an exponential family, then it's going to turn out they're the same thing. But in general, they're different. I'm just going slow just to make sure this is all totally clear.","zh":"这是相反的。这是如何随着参数x的变化而变化的，当固定y时，x是分布中的参数。大家明白了吗？现在，结果会发现有很多情况，例如如果它是一个指数族分布，那么它们会是同一件事。但一般来说，它们是不同的。我只是放慢速度，以确保所有内容都完全清楚。","start":3188.75,"end":3213.21}],"notes":["本段讲解了最大似然估计的基本概念，指出最大化似然函数和对数似然函数是等价的。同时，强调了在估计过程中，参数x是分布中的参数，而y是观测值。"],"formulas":[],"uncertainties":["log-concave density 的定义是否准确"],"diagram":"none","start":3062.36,"end":3213.21,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学定义或上下文来确认对数似然函数和似然为零的具体形式和条件，因此无法核定其数学表达的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3062.36,"text":"People often work with the log likelihood function, obviously maximizing a likelihood and a log likelihood are the same thing, and so you would have something that looks like this. So here, this is an estimator for x, and you're given y, which is an observation."},{"start":3077.49,"text":"And it's you know it I mean it kind of makes sense and you could argue a lot of things about it And if you take a like statistics 101 class you'll hear a lot about about properties of this right so okay So that's that's maximum likelihood estimation So as I said this is called the log likelihood function by the way here what we're doing is we're considering this a function of X which is the parameter in the distribution not of Y right so"},{"start":3104.85,"text":"And you can add constraints to this. I mean, for example, if this is a Gaussian distribution, let's say scalar, with mean mu and standard deviation little sigma, right? Then..."},{"start":3121.39,"text":"You know, little sigma has to be positive, like otherwise it makes no sense at all. So you could add, you would add that as a constraint or simply define the likelihood to be zero. If you say, if you say, well, how, you know, what, what density do I get when, what's my likelihood if I guess that the standard deviation is minus one?"},{"start":3142.35,"text":"I mean, aside from that being profoundly stupid, you just get zero. And then log of zero is minus infinity, and that means you did a very bad job of maximizing. So, okay. You can add regularization, too. So regularized maximum likelihood, you could do. So the question is, when is this convex? And it's convex when the log likelihood function is concave."},{"start":3168.81,"text":"Now you have to be super careful because up till now we saw the idea of a log-concave distribution or density. So a density is log-concave if when you fix x, this thing is concave in y. That's a log-concave density. This is not that."},{"start":3188.75,"text":"This is the opposite. This is, how does this vary as a function of when you fix y of x, which is the parameter in the distribution. Everybody got that? Now it's going to turn out that there's lots of cases, like if it's an exponential family, then it's going to turn out they're the same thing. But in general, they're different. I'm just going slow just to make sure this is all totally clear."}],"speech_gaps":[],"frame":"../frames/v010/019.webp","frame_time":3074.36},{"title":"最大似然估计与凸性","segments":[{"id":142,"text":"Okay, so that's it. So roughly speaking, maximum likelihood estimation is a convex problem when the log likelihood function is concave, which is not the same as saying that the densities are all log concave. That's a different thing. Okay, so we'll just look at some simple examples here. So here's one. It's a traditional linear measurement model. So I make a bunch of measurements.","zh":"好的，那差不多就是了。总的来说，当对数似然函数是凹函数时，最大似然估计是一个凸问题，这并不等同于说所有的密度函数都是对数凹函数。这是不同的事情。好的，我们现在来看一些简单的例子。这里有一个例子。这是一个传统的线性测量模型。所以我进行一系列的测量。","start":3214.03,"end":3243.49},{"id":143,"text":"And they're going to look like yi. And my model is going to be that each yi, which is a scalar, is a linear function of x.","zh":"这些测量结果看起来像 yi。我的模型是，每个 yi，这是一个标量，是 x 的线性函数。","start":3245.38,"end":3254.26},{"id":144,"text":"here, plus a noise which is independent across different eyes. So that's what the model is. Actually, it's kind of interesting because someone in EE or something like that would describe this in a pretty simple way. They would say something like, x is what you really want to measure.","zh":"这里，加上一个在不同测量之间独立的噪声。这就是模型的内容。实际上，这有点有趣，因为一个电子工程或类似领域的人员会以一种相当简单的方式描述这个问题。他们会说，x 是你真正想要测量的东西。","start":3256.37,"end":3274.13},{"id":145,"text":"AI tells you what your right measurement is. Like, oh, that's a radar snapshot from this position, like that. Or A7 is what I deduced from some GPS thing or something like that, right? And they say, well, that's how they would describe the problem, right? But the statistician would have to describe it this way.","zh":"AI 告诉你你的正确测量是什么。比如，哦，这是从这个位置的雷达快照，像这样。或者 A7 是我从某种 GPS 设备推导出来的，对吧？他们说，嗯，这就是他们描述问题的方式，对吧？但统计学家必须这样描述。","start":3275.02,"end":3302.82},{"id":146,"text":"They would say that what you observe from your sensor suite actually comes from a distribution. You go, oh, okay.","zh":"他们会说，你从传感器套件中观察到的数据实际上来自于一个分布。你就会说，哦，明白了。","start":3303.79,"end":3309.61},{"id":147,"text":"Then you say, ah, the distribution changes, it's parametrized by this x.","zh":"然后你说，啊，这个分布会变化，它由这个 x 参数化。","start":3310.01,"end":3310.87},{"id":148,"text":"I mean, they're saying the same thing, but I'm just saying this is the language a statistician would use.","zh":"我的意思是，他们说的其实是同一件事，但我只是说这是统计学家会使用的语言。","start":3311.09,"end":3314.87},{"id":149,"text":"And then they would say, so your problem is really to estimate which distribution generated the measurements,","zh":"然后他们会说，你的问题是真正要估计哪个分布生成了这些测量结果，","start":3315.21,"end":3321.67},{"id":150,"text":"the 27 measurements you actually got.","zh":"你实际得到的27个测量值。","start":3321.89,"end":3323.79},{"id":151,"text":"Everybody following this, right?","zh":"大家都跟得上吗？","start":3323.95,"end":3325.77},{"id":152,"text":"Whereas I think a normal person would just say something like, that's the model.","zh":"而我想一个正常人只会说，这就是模型。","start":3326.39,"end":3330.33},{"id":153,"text":"These are the 27 measurements I got.","zh":"这些是我得到的27个测量值。","start":3330.43,"end":3331.97},{"id":154,"text":"These are independent.","zh":"这些是独立的。","start":3332.13,"end":3332.97},{"id":155,"text":"independent, could you please guess what x is, right? So, I mean, I have lots of friends","zh":"独立的，你能猜猜x是多少吗？","start":3332.97,"end":3337.23},{"id":156,"text":"who are statisticians, so this is fine. So, all fine. Actually, that's how I can, I've","zh":"我有很多统计学的朋友，所以这没问题。所以，一切都没问题。实际上，这就是我学到的，我学会了他们的术语。","start":3337.23,"end":3342.09},{"id":157,"text":"learned, I picked up their dialect. So, actually, it makes me very nervous when I, anyway, so","zh":"所以，实际上，当我这样做的时候，我感到非常紧张，不管怎样，所以","start":3342.09,"end":3347.99},{"id":158,"text":"it's, which I, of course, enjoy. So, anyway, all right. Okay, so let's see how this works.","zh":"它，我当然喜欢。所以，总之，好吧。好的，那我们来看看这是怎么运作的。","start":3347.99,"end":3353.47},{"id":159,"text":"Well, if, you know, this is the, these are independent, right? So, what you're really","zh":"嗯，如果你知道，这些是独立的，对吧？所以，你在这里实际上","start":3357.47,"end":3361.61},{"id":160,"text":"saying here is is something like you know y i minus a i transpose x which is v i these these","zh":"说的是类似这样的事情，你知道，y_i 减去 a_i 转置 x 等于 v_i，这些这些","start":3361.61,"end":3366.83},{"id":161,"text":"are independent right so the the density is the product of the density so so the the density of","zh":"是独立的，对吧？所以，密度是各个密度的乘积，所以，所以测量向量的密度等于这里这个东西，对吧？","start":3366.83,"end":3372.79},{"id":162,"text":"the vector of measurements is equal to this thing right over here um and you take the log of that","zh":"然后你对它取对数，你就得到这个，对吧？嗯，这里这个是我们想要的，这里的变量是 x，对吧？","start":3372.79,"end":3378.93},{"id":163,"text":"and you get this right um and here this is we we want to we the variable here is x right","zh":"这里这个是我们想要的，这里的变量是 x，对吧？","start":3378.93,"end":3387.23}],"notes":["本段主要讲解最大似然估计（Maximum Likelihood Estimation, MLE）在凸优化中的应用。讲者指出，当对数似然函数是凹函数时，最大似然估计问题是一个凸问题。但需要注意，这并不等同于所有密度函数都是对数凹函数。讲者通过一个简单的线性测量模型来举例说明，其中每个观测值 $ y_i $ 是关于未知参数 $ x $ 的线性函数加上独立噪声。"],"formulas":[],"uncertainties":["independent across different eyes"],"diagram":"none","start":3214.03,"end":3387.23,"asr_flags":[],"math_clarifications":["原公式中未明确噪声方差，且未使用标准形式的高斯密度归一化因子。修正为标准形式的高斯密度函数，使用σ²表示方差，并将归一化因子明确为1/sqrt(2πσ²)","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":3214.03,"text":"Okay, so that's it. So roughly speaking, maximum likelihood estimation is a convex problem when the log likelihood function is concave, which is not the same as saying that the densities are all log concave. That's a different thing. Okay, so we'll just look at some simple examples here. So here's one. It's a traditional linear measurement model. So I make a bunch of measurements."},{"start":3245.38,"text":"And they're going to look like yi. And my model is going to be that each yi, which is a scalar, is a linear function of x."},{"start":3256.37,"text":"here, plus a noise which is independent across different eyes. So that's what the model is. Actually, it's kind of interesting because someone in EE or something like that would describe this in a pretty simple way. They would say something like, x is what you really want to measure."},{"start":3275.02,"text":"AI tells you what your right measurement is. Like, oh, that's a radar snapshot from this position, like that. Or A7 is what I deduced from some GPS thing or something like that, right? And they say, well, that's how they would describe the problem, right? But the statistician would have to describe it this way. They would say that what you observe from your sensor suite actually comes from a distribution. You go, oh, okay."},{"start":3303.79,"text":"Then you say, ah, the distribution changes, it's parametrized by this x."},{"start":3310.01,"text":"Everybody got that?"},{"start":3311.09,"text":"I mean, they're saying the same thing, but I'm just saying this is the language a statistician would use."},{"start":3315.21,"text":"And then they would say, so your problem is really to estimate which distribution generated the measurements,"},{"start":3321.89,"text":"the 27 measurements you actually got."},{"start":3323.95,"text":"Everybody following this, right?"},{"start":3326.39,"text":"Whereas I think a normal person would just say something like, that's the model."},{"start":3330.43,"text":"These are the 27 measurements I got."},{"start":3332.13,"text":"These are independent."},{"start":3332.97,"text":"independent, could you please guess what x is, right? So, I mean, I have lots of friends"},{"start":3337.23,"text":"who are statisticians, so this is fine. So, all fine. Actually, that's how I can, I've"},{"start":3342.09,"text":"learned, I picked up their dialect. So, actually, it makes me very nervous when I, anyway, so"},{"start":3347.99,"text":"it's, which I, of course, enjoy. So, anyway, all right. Okay, so let's see how this works."},{"start":3357.47,"text":"Well, if, you know, this is the, these are independent, right? So, what you're really"},{"start":3361.61,"text":"saying here is is something like you know y i minus a i transpose x which is v i these these"},{"start":3366.83,"text":"are independent right so the the density is the product of the density so so the the density of"},{"start":3372.79,"text":"the vector of measurements is equal to this thing right over here um and you take the log of that"},{"start":3378.93,"text":"and you get this right um and here this is we we want to we the variable here is x right"}],"speech_gaps":[{"start":3355.088,"end":3357.07}],"frame":"../frames/v010/020.webp","frame_time":3226.03},{"title":"凸优化中的凸性与最大似然估计","segments":[{"id":164,"text":"Right. So what's interesting here is this is when is, you know, this thing is a convex problem,","zh":"对的。有趣的是，这里的情况是，当这个函数是一个凸问题时，也就是说，对数似然函数是凸的。在这种情况下，它恰好与密度函数的凹性一致。","start":3387.23,"end":3396.77},{"id":165,"text":"which is say that the log likelihood is convex. In this case, it coincides exactly with the density","zh":"所以这是一个两者完全相同的情况。对的。所以实际上","start":3396.93,"end":3402.81},{"id":166,"text":"being long concave. So this is a case where the two are the same. Right. So because actually","zh":"你在这里看到了一些东西。这是因为基本上，如果这个函数是凹的，即如果这个密度函数是凹的，那么这就告诉你，这个函数在x上是凹的，对吧？但如果凹性是指，如果p是一个使得这个函数是凹的函数，那么这就是与仿射函数的预合成。因此，这些是","start":3402.81,"end":3408.43},{"id":167,"text":"You see something here. It's because basically the x, if this thing is log concave, so if this is a log concave density, then this is, that tells you that this is concave in, log p is concave in this, right? But if log concave is, if this is, if p is such that this is a concave function, then this is precomposition with an affine function. And so these are,","zh":"关于x的凹函数。我不确定这是否说得通。这就是这个图景。好的。那么，让我们来看一些具体的例子，对吧？所以有人会说，噪声是高斯分布的。你会说，这里就是对数似然函数。你会看到，它是一个常数减去一个二次函数，对吧？","start":3409.54,"end":3435.86},{"id":168,"text":"concave functions of x. I don't know if that makes sense. So that's the picture. Okay. So, all right. And let's look at some specific examples, right? So someone says, okay, the noises are Gaussian. And you'd say, well, here's the log likelihood function. And you see, it's a constant minus a quadratic, right?","zh":"你会立刻看到最大似然解就是最小二乘解，对吧？所以这说明，如果你在做最小二乘法，并且想让它听起来更高级一些，把别人打发掉，他们就会问你在做什么。你会回答，哦，我在用高斯分布进行最大似然估计，噪声分布或者其他类似的东西，对吧？大家明白了吗？","start":3436.52,"end":3457.4},{"id":169,"text":"And what you see immediately is the maximum likelihood solution is the least squares solution, right? So this says if you're doing least squares and you want to make it sound fancy and brush someone off, they'd say, what are you doing? And you go, oh, I'm doing maximum likelihood estimation with a Gaussian distribution, noise distribution or something like that, right? So everybody got that?","zh":"好的，你也可以让噪声服从拉普拉斯分布，对吧？所以拉普拉斯分布意味着密度函数看起来像这样，对吧？这里零点，对吧？然后它会像这样延伸，对吧？在这里，它的尾部比高斯分布大得多，对吧？对于相同的，比如说，相同的方差，对吧？","start":3458.15,"end":3479.16},{"id":170,"text":"Okay, you could have, let's make the noise, let's make the noise Laplacian, right? So Laplacian means that it looks like the density looks like this, right? It's, here's zero, right? And it goes like this, right? And out here, it's got way, way bigger tails than a Gaussian, right? And for the same, let's say, for the same whatever variance, right?","zh":"这说明你现在对这个函数取对数，你会得到这个结果，你会看到这是很有趣的。所以用拉普拉斯噪声进行最大似然估计基本上就是L1估计。顺便说一句，我们现在实际上可以得出一些结论。我们现在可以从两个完全不同的角度来理解鲁棒性。今天早上，我刚刚画下...","start":3481.54,"end":3510.04},{"id":171,"text":"And what this says is you now take the log of this, and you end up with this, and you see that's cool. So maximum likelihood estimation with Laplacian noise is basically L1 estimation. By the way, we can actually now figure something out. We can understand robustness now from two completely different things. Earlier today, I was just drawing down...","zh":"而这意味着你现在对这个取对数，就会得到这个结果，你会发现这很有趣。所以带有拉普拉斯噪声的最大似然估计基本上就是L1估计。顺便说一下，我们现在实际上可以得出一些结论。我们现在可以从两个完全不同的角度来理解鲁棒性。今天早上我之前只是画了下来……","start":3510.43,"end":3537.89},{"id":172,"text":"you know, let's compare the square and the quadratic, right? So the square penalty looks like this, right? And then the absolute value looks like that, right? We'd say, you know, if you're, again, not, if you're not doing a statistical interpretation, you would say, well, the difference between least squares and L1 estimation is two, really.","zh":"你知道吗，让我们比较平方和二次函数，对吧？所以平方惩罚看起来是这样的，对吧？然后绝对值看起来是那样的，对吧？我们可以说，如果你不进行统计解释的话，你会说，最小二乘法和L1估计之间的区别其实只有两个，真的。","start":3538.39,"end":3563.24}],"notes":["本段讨论了凸优化中凸性与最大似然估计的关系，指出当对数似然函数是凸函数时，它与密度函数的凹性一致。这表明在某些情况下，凸性和凹性可以同时成立，但需要满足特定条件。","讲者提到，如果密度函数是凹函数，那么对数密度函数也是凹函数，这表明在凸优化中，对数凹函数的性质可以用来分析问题的结构。","在具体例子中，讲者以高斯噪声为例，指出最大似然估计等价于最小二乘估计，这说明在高斯分布下，最大似然估计具有良好的性质。","接着，讲者讨论了拉普拉斯噪声的情况，指出最大似然估计在拉普拉斯噪声下等价于L1估计，这说明不同噪声分布会导致不同的估计方法。","讲者还提到，通过比较平方误差和绝对误差，可以理解不同估计方法的鲁棒性差异，这表明在非统计解释下，不同损失函数的选择会影响估计结果。","最后，讲者指出，最大似然估计和L1估计之间的差异可以通过两种不同的方法来理解，这表明在凸优化中，不同的理论框架可以提供不同的视角。"],"formulas":[{"latex":"log p(x) \\text{ 是 } x \\text{ 上的凹函数}","symbols":"对数密度函数在变量x上是凹函数","explanation":"保持原公式，符号和数学类型正确，无需修改。","evidence":"You see something here. It's because basically the x, if this thing is log concave, so if this is a log concave density, then this is, that tells you that this is concave in, log p is concave in this, right? But if log concave is, if this is, if p is such that this is a concave function, then this is precomposition with an affine function. And so these are,"}],"uncertainties":["log concave is, if this is, if p is such that this is a concave function"],"diagram":"none","start":3387.23,"end":3563.24,"asr_flags":[],"math_clarifications":["公式1中未明确说明是高斯分布，且缺少归一化常数。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":3387.23,"text":"Right. So what's interesting here is this is when is, you know, this thing is a convex problem,"},{"start":3396.93,"text":"which is say that the log likelihood is convex. In this case, it coincides exactly with the density"},{"start":3402.81,"text":"being long concave. So this is a case where the two are the same. Right. So because actually"},{"start":3409.54,"text":"You see something here. It's because basically the x, if this thing is log concave, so if this is a log concave density, then this is, that tells you that this is concave in, log p is concave in this, right? But if log concave is, if this is, if p is such that this is a concave function, then this is precomposition with an affine function. And so these are,"},{"start":3436.52,"text":"concave functions of x. I don't know if that makes sense. So that's the picture. Okay. So, all right. And let's look at some specific examples, right? So someone says, okay, the noises are Gaussian. And you'd say, well, here's the log likelihood function. And you see, it's a constant minus a quadratic, right?"},{"start":3458.15,"text":"And what you see immediately is the maximum likelihood solution is the least squares solution, right? So this says if you're doing least squares and you want to make it sound fancy and brush someone off, they'd say, what are you doing? And you go, oh, I'm doing maximum likelihood estimation with a Gaussian distribution, noise distribution or something like that, right? So everybody got that?"},{"start":3481.54,"text":"Okay, you could have, let's make the noise, let's make the noise Laplacian, right? So Laplacian means that it looks like the density looks like this, right? It's, here's zero, right? And it goes like this, right? And out here, it's got way, way bigger tails than a Gaussian, right? And for the same, let's say, for the same whatever variance, right?"},{"start":3510.43,"text":"And what this says is you now take the log of this, and you end up with this, and you see that's cool. So maximum likelihood estimation with Laplacian noise is basically L1 estimation. By the way, we can actually now figure something out. We can understand robustness now from two completely different things. Earlier today, I was just drawing down..."},{"start":3538.39,"text":"you know, let's compare the square and the quadratic, right? So the square penalty looks like this, right? And then the absolute value looks like that, right? We'd say, you know, if you're, again, not, if you're not doing a statistical interpretation, you would say, well, the difference between least squares and L1 estimation is two, really."}],"speech_gaps":[],"frame":"../frames/v010/021.webp","frame_time":3399.23},{"title":"L1估计的鲁棒性与噪声分布假设","segments":[{"id":173,"text":"One, let's focus on the large residuals, right? You'd say, well, least squares is going to be very sensitive to large residuals. Like it really doesn't like them because it squares them, right? And you'd say, by contrast, L1 is going to be much more chill. Everybody got what I'm saying? And so you'd say, and what does that mean? And you go, well, what it means is that when you do L1 estimation, it's much less sensitive to outliers. That's what it means.","zh":"首先，让我们关注较大的残差，对吧？你会说，最小二乘法会对较大的残差非常敏感。就像它真的不喜欢这些残差，因为它对它们进行了平方，对吧？你会说，相比之下，L1方法会更加从容。大家明白我的意思吗？所以你会说，这意味着什么？然后你会说，这意味着当你进行L1估计时，它对异常值的敏感度要低得多。这就是它的意思。","start":3565.28,"end":3591.22},{"id":174,"text":"So it's a robust estimator, actually, literally in the statistics sense, right? So it's a robust estimator, okay? What's cool is you get the same, you can argue it here. You could say, well, the difference between like L2 fitting and L1 approximation, you say the difference is actually basically this. It's a difference between whether you believe the noise density looks like this or looks like this, right?","zh":"因此，它实际上是一个稳健的估计器，严格来说在统计学意义上，对吧？所以它是一个稳健的估计器，对吧？有趣的是，你可以在这里进行论证。你可以说，L2拟合和L1逼近之间的差异实际上基本上就是这个。它区别在于你是否认为噪声的密度看起来像这样或像这样，对吧？","start":3591.84,"end":3618.42},{"id":175,"text":"That's a pretty bad job. It's a horrible Gaussian, but you get the idea, right? So it looks like that. And actually, you pick everything off from this, right? Like you would say, look, if you thought your noises were Laplacian, then the probability of like a three sigma event is not insignificant.","zh":"这是一次相当糟糕的工作。它是一个糟糕的高斯分布，但你能明白我的意思，对吧？它看起来就是这样。实际上，你从这里的一切都是这样选择的，对吧？比如你会说，看，如果你认为你的噪声是拉普拉斯分布，那么三倍标准差事件的概率就不是可以忽略的。","start":3620.05,"end":3638.97},{"id":176,"text":"I mean, you could expect to have a noise which is like three times the standard deviation, right? That's the whole point, right? Or four times, right? Or something in there. It can happen. Gaussian can't happen. I mean, kind of, you know what I mean, right? It's extremely unlikely, right? So you'd say, so if I were you, your estimation, if it's going to work well, it cannot be sensitive to these large noises. Everybody following this? So that's why.","zh":"我的意思是，你可能会期望有噪声是标准差的三倍，对吧？这就是整个要点，对吧？或者四倍，对吧？或者在其中某个范围内。这可能发生。高斯分布不可能发生。我的意思是，你知道我的意思，对吧？这是极其不可能的，对吧？所以你会说，所以如果你是我，你的估计，如果要正常工作，就不能对这些大的噪声敏感。大家跟上这个思路了吗？这就是为什么。","start":3640.14,"end":3665.54},{"id":177,"text":"So that explains why L1 estimation would be actually more robust than the other one, right? Because you're basically fitting with the presumption that your noises have fat tails, right? So, oh, and this is actually interesting too. This is not the main point, but i
