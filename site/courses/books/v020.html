<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 10 用RL提升大语言模型推理（RL for LLM Reasoning）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 10 用RL提升大语言模型推理（RL for LLM Reasoning） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v020.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v020","title":"Lecture 10 用RL提升大语言模型推理（RL for LLM Reasoning）","course":"强化学习","pages":[{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":0,"text":"So today we'll not talk about CQL. We'll talk about reasoning and sort of particularly reinforcement learning for LLM reasoning.","zh":"所以今天我们将不谈论CQL。我们将谈论推理，特别是强化学习在大语言模型推理中的应用。","start":5.2,"end":13.4},{"id":1,"text":"So, at a high level, reasoning could mean many, many things, and it clearly even today means different things for different people. But what I'm going to do today in this lecture, and also I should mention that it's very hard to do justice to reasoning topics in one lecture. This was also a trouble that I had for my own class this semester, where I was covering similar content two weeks ago, and I couldn't go over everything. But what I'm going to do today is to give you at least one perspective on some of the trends in the field of reasoning.","zh":"总的来说，推理可以意味着许多许多事情，而且很明显，即使在今天，对于不同的人来说，推理也意味着不同的东西。但今天在这一讲中，我将向你们提供一个关于该领域趋势的一个视角。我也应该提到，要在一堂课中公正地讨论推理主题是非常困难的。这同样是我这学期自己课程中的一个难题，我在两周前讲过类似的内容，但我无法涵盖所有内容。今天我将做的是，至少给你们提供一个关于该领域趋势的视角。","start":14.22,"end":41.64},{"id":2,"text":"And for doing that, what we'll do is we'll restrict ourselves to sort of solving math problems. So, you know, if you're following all the news in language models these days, sort of people have been really excited about solving sort of technical questions like math and coding and scientific questions with these models. And one of sort of the benchmarks people look at, for example, is this AIME exam, American Invitational Mathematical Examination. This is sort of an example question, okay, from...","zh":"为了做到这一点，我们将限制自己解决数学问题。你们如果关注这些天语言模型的新闻，人们对于这些模型解决诸如数学、编程和科学问题等技术性问题感到非常兴奋。例如，人们会参考的一个基准就是美国邀请数学考试（AIME）。这是一个示例问题，好吧，来自……","start":42.17,"end":70.61},{"id":3,"text":"from that particular exam where you kind of have to solve","zh":"来自该考试的一个问题，你必须解决","start":71.63,"end":74.65},{"id":4,"text":"a certain sort of number theory question, for instance. And to solve this, sort of these are some ground truth solutions for it. You'll have to solve this in natural language, where you kind of want your language model, for instance, to, you know, after seeing this question, produce a solution that looks like one of those solutions that you see up on the slide. So I took these solutions from sort of the ground truth, sort of the reference solutions that exist for this exam, but you would want your LLM to sort of be capable enough to, one, you know, write a solution like this, and two, come up with the right answer finally.","zh":"某种类型的数论问题。为了解决这个问题，这些是一些真实解法。你们需要用自然语言来解决这个问题，你希望你的语言模型，例如，在看到这个问题后，能够产生一个看起来像幻灯片上那些解法之一的解法。我从这些解法中取自该考试的真实解法，即该考试存在的参考解法，但你希望你的大语言模型能够做到两点：一是写出这样的解法，二是最终得出正确的答案。","start":75.66,"end":103.16},{"id":5,"text":"So that's sort of the goal for today. So what I'll do today is I'll give you sort of my perspective on, or sort of I'll organize the material and reasoning and especially RL for reasoning in sort of a particular way that I particularly like. And to do that, we'll start off from sort of the conventional way or looking back at the conventional way of training language models.","zh":"所以这就是我们今天的目标。今天我将从我自己的视角出发，或者以一种我特别喜欢的方式组织材料和推理，尤其是关于强化学习在推理中的应用。为了做到这一点，我们将从传统的训练语言模型的方式开始。","start":104.26,"end":124.46},{"id":6,"text":"So typically when we train language models or just generally foundation models overall, the conventional paradigm has been to do next token prediction, meaning you take your data, you tokenize that into a string of tokens and token inputs, and you train the model with sort of a negative log likelihood loss to predict the next token that appears in the sequence.","zh":"通常在训练语言模型或更广泛的基座模型时，传统的范式是进行下一个标记预测，这意味着你取你的数据，将其分词为标记字符串和输入标记，然后使用负对数似然损失来训练模型，以预测序列中出现的下一个标记。","start":125.15,"end":144.33},{"id":7,"text":"So in the context of reasoning, this would mean you would take the question, you would tokenize it into a string of tokens. You'll take the answer, which is from one of these reference solutions, tokenize that into a string of tokens, and then train the model to predict this answer string conditioned on the input question string. Now, to start to look at or start to understand why RL matters here, we start by asking this question of why does next token prediction of this form actually work?","zh":"在推理的背景下，这意味着你会将问题分词为标记字符串，然后取答案（来自这些参考解之一），将其分词为标记字符串，然后训练模型在输入问题字符串的条件下预测这个答案字符串。为了开始理解为什么强化学习在这里重要，我们首先需要问这个问题：为什么这种形式的下一个标记预测实际上有效？","start":144.87,"end":170.31}],"notes":["本段主要讨论了在推理任务中使用强化学习（RL）的重要性，特别是与传统的基于下一个标记预测（next token prediction）的训练方法相比。讲者指出，传统的训练方法是通过负对数似然损失函数来预测下一个标记，这种方法在推理任务中可能不够有效，因此需要引入强化学习来提升模型的推理能力。","讲者提到，为了理解为什么强化学习在推理任务中是重要的，需要首先理解为什么传统的下一个标记预测方法能够有效。这表明，讲者认为传统的训练方法虽然在某些任务中表现良好，但在需要复杂推理的任务中可能无法达到最佳效果。","讲者还提到，推理任务通常涉及解决数学问题，例如美国数学邀请赛（AIME）中的题目。这些题目需要模型生成类似于参考答案的自然语言解决方案，并且最终得出正确的答案。这表明，推理任务不仅需要模型生成正确的答案，还需要生成合理的推理过程。","讲者指出，传统的训练方法可能无法充分捕捉到推理过程中所需的复杂逻辑关系，因此需要引入强化学习来优化模型的推理能力。这表明，强化学习在处理需要复杂推理的任务时可能具有优势。","讲者提到，他将从传统的语言模型训练方法出发，组织材料并讨论强化学习在推理中的应用。这表明，讲者希望从基础概念出发，逐步引导学生理解强化学习在推理任务中的作用。","讲者强调，理解为什么传统的下一个标记预测方法有效是理解强化学习在推理任务中重要性的关键。这表明，讲者认为在引入强化学习之前，需要先理解现有方法的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":170.31,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.2,"text":"So today we'll not talk about CQL. We'll talk about reasoning and sort of particularly reinforcement learning for LLM reasoning."},{"start":14.22,"text":"So, at a high level, reasoning could mean many, many things, and it clearly even today means different things for different people. But what I'm going to do today in this lecture, and also I should mention that it's very hard to do justice to reasoning topics in one lecture. This was also a trouble that I had for my own class this semester, where I was covering similar content two weeks ago, and I couldn't go over everything. But what I'm going to do today is to give you at least one perspective on some of the trends in the field of reasoning."},{"start":42.17,"text":"And for doing that, what we'll do is we'll restrict ourselves to sort of solving math problems. So, you know, if you're following all the news in language models these days, sort of people have been really excited about solving sort of technical questions like math and coding and scientific questions with these models. And one of sort of the benchmarks people look at, for example, is this AIME exam, American Invitational Mathematical Examination. This is sort of an example question, okay, from..."},{"start":71.63,"text":"from that particular exam where you kind of have to solve"},{"start":75.66,"text":"a certain sort of number theory question, for instance. And to solve this, sort of these are some ground truth solutions for it. You'll have to solve this in natural language, where you kind of want your language model, for instance, to, you know, after seeing this question, produce a solution that looks like one of those solutions that you see up on the slide. So I took these solutions from sort of the ground truth, sort of the reference solutions that exist for this exam, but you would want your LLM to sort of be capable enough to, one, you know, write a solution like this, and two, come up with the right answer finally."},{"start":104.26,"text":"So that's sort of the goal for today. So what I'll do today is I'll give you sort of my perspective on, or sort of I'll organize the material and reasoning and especially RL for reasoning in sort of a particular way that I particularly like. And to do that, we'll start off from sort of the conventional way or looking back at the conventional way of training language models."},{"start":125.15,"text":"So typically when we train language models or just generally foundation models overall, the conventional paradigm has been to do next token prediction, meaning you take your data, you tokenize that into a string of tokens and token inputs, and you train the model with sort of a negative log likelihood loss to predict the next token that appears in the sequence."},{"start":144.87,"text":"So in the context of reasoning, this would mean you would take the question, you would tokenize it into a string of tokens. You'll take the answer, which is from one of these reference solutions, tokenize that into a string of tokens, and then train the model to predict this answer string conditioned on the input question string. Now, to start to look at or start to understand why RL matters here, we start by asking this question of why does next token prediction of this form actually work?"}],"speech_gaps":[],"frame":"../frames/v020/001.webp","frame_time":17.2},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":8,"text":"And, you know, again, answering this question will take sort of more than, it's an open research question, to be honest. But one perspective of looking at this that I particularly like is to sort of look at this particular equation, which tells you how well next token prediction works in general. So what is this equation telling me? It's telling me that if I train a model, if I train a particular model p theta, which is mapping some inputs x, like the question, to some output y, like the answer, this learned model,","zh":"而且，说实话，回答这个问题需要更多的研究，这是一个开放性研究问题。但我特别喜欢的一个视角是，看看这个特定的方程，它告诉你下个token预测在一般情况下表现如何。那么这个方程在告诉我什么？它告诉我，如果你训练一个模型，如果你训练一个特定的模型p_theta，它将一些输入x（比如问题）映射到一些输出y（比如答案），这个学习到的模型，","start":171.41,"end":199.83},{"id":9,"text":"is only going to approximate the ground truth underlying model or the ground truth solution with an error, meaning with an error that is shown on the slide, which is p theta minus p star, depending on the size of the data that you use for training. So if you have a lot of data, which shows you many, many questions and many, many answers, then ideally this error would be low and you would approximate a very highly capable expert at solving these questions.","zh":"只会以一定的误差近似底层的真实模型或真实解，这个误差如幻灯片中所示，即p_theta减去p_star，这取决于你用于训练的数据量大小。所以如果你有大量的数据，展示了非常多的问题和非常多的答案，那么理想情况下这个误差会很小，你就能近似一个非常强大的专家来解决这些问题。","start":200.29,"end":226.03},{"id":10,"text":"But in reality, it so happens that the amount of data that you have for a lot of these reasoning problems and many other domains as well, you really don't have enough data to make this bound small enough. So you kind of end up learning models that are not approximating human level capabilities. You just do next token prediction.","zh":"但在现实中，对于很多这些推理问题以及其他许多领域来说，你拥有的数据量真的不足以让这个误差足够小。因此，你最终学到的模型并不能近似人类水平的能力，你只是在做下个token预测。","start":226.73,"end":243.87},{"id":11,"text":"So there's actually sort of a lot of work that exists out there which studies the amount of data. And one of the interesting things that they tell you is if you simply keep doing, if you simply keep taking high quality solutions of hard questions from the Internet and you train your model with some sort of supervised training, some sort of next token prediction, you will not do really well because it's estimated that you are going to run out of high quality data of this sort by 2028.","zh":"实际上，已经有很多研究工作探讨了数据量的问题。他们告诉你的一个有趣的事情是，如果你继续这样做，如果你继续从互联网上获取高质量的难题解答，并用某种监督训练或某种下个token预测的方式训练你的模型，你将不会表现得很好，因为估计到2028年，这种高质量的数据就会用完了。","start":244.65,"end":272.13},{"id":12,"text":"and clearly you have not gotten to a level where you can do great research with, or these models can just replace human researchers, for instance. This also happens in other domains, like, for instance, in robotics and embodied AI, where, again, data is very limited, which means that if you just simply rely on next token prediction alone, you'll not be able to get the ground truth sort of expert-level capability in your model of sorts.","zh":"显然，你还没有达到能够用这些模型进行出色研究的水平，或者这些模型还不能取代人类研究人员，例如。这种情况也发生在其他领域，比如机器人和具身人工智能领域，其中数据非常有限，这意味着如果你仅仅依赖下一个标记的预测，你就无法在模型中获得类似专家水平的真实能力。","start":272.52,"end":293.34},{"id":13,"text":"So just to kind of give you a concrete example, if you just train models on current data and you ask them to solve this very interesting question from IMO 2021, presumably this question exists in the training sets of one of these models, but if you ask sort of GPDs or open air family of models to solve this, they're going to give you a solution that kind of looks very sensible in these settings. So they're going to produce solutions that look quite like a solution that a human expert would have written, except that they end up missing the logic behind the","zh":"为了给你一个具体的例子，如果你只是在当前数据上训练模型，并让他们解决2021年国际数学奥林匹克竞赛中的一道有趣问题，这道题很可能存在于这些模型的训练集中，但如果你让GPDs或开放域模型来解决这个问题，它们会给出一个在这些情况下看起来非常合理的解决方案。它们会生成看起来很像人类专家所写的解决方案，只是它们最终会遗漏背后的逻辑。","start":295.25,"end":324.35}],"notes":["本段讨论了大语言模型在推理任务中的局限性，指出即使模型在训练数据中包含相关问题，它们也可能无法正确理解问题背后的逻辑。这表明仅依赖于数据量和下一个标记预测（next token prediction）不足以实现人类水平的推理能力。","讲者提到，当前的数据量可能不足以支持模型达到人类专家的水平，特别是在需要深度推理的任务中，如国际数学奥林匹克竞赛（IMO）的问题。这表明数据质量和数量对模型性能有重要影响。","讲者指出，即使使用高质量的数据进行监督训练，模型也可能在2028年之前耗尽这种数据，这限制了模型在推理任务上的表现。这表明数据的可用性和持续性是模型发展的关键因素。","讲者还提到，这种数据限制不仅存在于语言模型领域，也存在于其他领域，如机器人和具身AI。这表明数据稀缺是许多AI领域面临的共同挑战。","讲者通过一个具体的例子说明了模型在推理任务中的表现：即使问题存在于训练数据中，模型可能生成看似合理但缺乏逻辑的解决方案。这表明模型可能无法真正理解问题的结构和逻辑。","讲者强调，仅依靠下一个标记预测无法实现模型的专家级能力，因此需要探索其他方法，如强化学习（RL）来提升模型的推理能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":171.41,"end":324.35,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":171.41,"text":"And, you know, again, answering this question will take sort of more than, it's an open research question, to be honest. But one perspective of looking at this that I particularly like is to sort of look at this particular equation, which tells you how well next token prediction works in general. So what is this equation telling me? It's telling me that if I train a model, if I train a particular model p theta, which is mapping some inputs x, like the question, to some output y, like the answer, this learned model,"},{"start":200.29,"text":"is only going to approximate the ground truth underlying model or the ground truth solution with an error, meaning with an error that is shown on the slide, which is p theta minus p star, depending on the size of the data that you use for training. So if you have a lot of data, which shows you many, many questions and many, many answers, then ideally this error would be low and you would approximate a very highly capable expert at solving these questions."},{"start":226.73,"text":"But in reality, it so happens that the amount of data that you have for a lot of these reasoning problems and many other domains as well, you really don't have enough data to make this bound small enough. So you kind of end up learning models that are not approximating human level capabilities. You just do next token prediction."},{"start":244.65,"text":"So there's actually sort of a lot of work that exists out there which studies the amount of data. And one of the interesting things that they tell you is if you simply keep doing, if you simply keep taking high quality solutions of hard questions from the Internet and you train your model with some sort of supervised training, some sort of next token prediction, you will not do really well because it's estimated that you are going to run out of high quality data of this sort by 2028."},{"start":272.52,"text":"and clearly you have not gotten to a level where you can do great research with, or these models can just replace human researchers, for instance. This also happens in other domains, like, for instance, in robotics and embodied AI, where, again, data is very limited, which means that if you just simply rely on next token prediction alone, you'll not be able to get the ground truth sort of expert-level capability in your model of sorts."},{"start":295.25,"text":"So just to kind of give you a concrete example, if you just train models on current data and you ask them to solve this very interesting question from IMO 2021, presumably this question exists in the training sets of one of these models, but if you ask sort of GPDs or open air family of models to solve this, they're going to give you a solution that kind of looks very sensible in these settings. So they're going to produce solutions that look quite like a solution that a human expert would have written, except that they end up missing the logic behind the"}],"speech_gaps":[],"frame":"../frames/v020/002.webp","frame_time":183.41},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":14,"text":"the answer. So in this particular question, if you need to prove that inequality that you see up on the slide, you cannot really go out there and start to look at individual terms of that expression. You have to kind of think about the whole summation as a whole. And these models, this is, I think, from an O-series model, I think O1, that I kind of got the solution. It starts to look at sort of individual terms, for instance, and ends up kind of asserting its solution at the end. But it really kind of does not realize that it's actually making a mistake and does not correct it.","zh":"答案。因此，在这个问题中，如果你需要证明你在幻灯片上看到的那个不等式，你不能真的出去查看该表达式的各个单独项。你必须将整个求和视为一个整体来思考。这些模型，我认为，来自一个O系列模型，比如O1，我大概得到了解决方案。它开始查看某些单独的项，最后却断言其解决方案。但它实际上并没有意识到自己犯了错误，也没有纠正这个错误。","start":324.43,"end":353.55},{"id":15,"text":"So really what ends up happening with these current sort of supervised training paradigms when you think about reasoning is that they are going to produce a solution that looks very much like a legitimate solution that you could have written on an exam. It's just that that solution ends up being wrong and the logical content of that solution is not quite correct. And that's precisely something that RL tries to fix. And I'll hopefully try to show you some examples today of what kind of RL techniques come to rescue in that setting.","zh":"因此，当你考虑推理时，这些当前的监督训练范式最终会产生一个看起来非常像你在考试上可以写出的合法解决方案。只是这个解决方案实际上是错误的，其逻辑内容也不完全正确。而这正是强化学习（RL）试图解决的问题。我希望今天能向你们展示一些强化学习技术在这种情况下的应用实例。","start":354.09,"end":378.81},{"id":16,"text":"So in today's lecture, I guess we'll talk about RL for reasoning. I roughly sort of characterized this in sort of two parts. So I broke this down into two parts.","zh":"因此，在今天的讲座中，我想我们将会讨论用于推理的强化学习。我大致将这个主题分为两个部分。我把这个内容分成了两个部分。","start":380.66,"end":390.16},{"id":17,"text":"And these two parts are based on sort of timelines. So it's based on like stuff that came before sort of the DeepSeq R1 family of models came out. How many of you know what the DeepSeq R1 model is? Actually, I'm just curious. I have seen it, have played around with it. It's a model that was released, which is from a company in China named DeepSeq, which is really, really good at solving a lot of these sort of competition math problems or competition coding problems.","zh":"这两个部分是基于时间线的。也就是说，它基于在DeepSeq R1系列模型出现之前的内容。有多少人知道DeepSeq R1模型是什么？实际上，我只是出于好奇。我见过这个模型，也尝试过它。这是一个由一家名为DeepSeq的中国公司发布的模型，该公司在解决大量这类竞赛数学问题或竞赛编程问题方面非常出色。","start":390.66,"end":415.04},{"id":18,"text":"It's sort of in a similar style of model as the OpenAI O series of models, or some of these thinking models that exist out there, like the Gemini thinking model, or sort of Claude Sonnet thinking version, etc. So these are sort of models of the same family, and what we're going to do is we're going to talk about techniques that came before these models came out, which is early 2025, so January 2025, and some techniques that kind of have become much more prominent in the community after these models came out.","zh":"它在风格上类似于OpenAI的O系列模型，或者一些现有的思考模型，比如Gemini的思考模型，或者类似Claude Sonnet的思考版本等。因此，这些模型属于同一家族，接下来我们将讨论这些模型问世之前的技术，也就是2025年初的技术，以及这些模型问世后在社区中变得更为突出的一些技术。","start":415.98,"end":443.76},{"id":19,"text":"So the first part of my lecture will be based on these classical techniques that I'm going to talk about. And I'll talk about techniques that rely on some form of imitation learning, which I'm guessing has been covered in the class. We'll talk about some techniques that look like offline reinforcement learning. And I'll talk about some techniques that look like online reinforcement learning. This is sort of my characterization of this whole space. In general, there's a lot of literature that has been coming out, so I'll probably miss out on some of them. But this is roughly a characterization that I think makes sense to think about.","zh":"我讲座的第一部分将基于这些经典技术。我将讨论依赖于某种形式模仿学习的技术，我猜这部分内容已经在课堂上讲过。我们还将讨论一些看起来像离线强化学习的技术，以及一些看起来像在线强化学习的技术。这是我对这个领域的大致描述。总的来说，有很多文献正在涌现，所以我可能会遗漏其中的一些内容。但这是我大致认为有意义的描述。","start":444.35,"end":473.01},{"id":20,"text":"And after that, I'm going to talk about some modern extensions of these techniques into this thinking model kind of territory, where we'll talk about how can you take some of these techniques that people have built before early 2025 and think about using them to train thinking models that have been doing really amazing right now. And there's some very interesting things that need to change when you go from the left-hand side to the right-hand side in this particular setting.","zh":"接下来，我将讨论这些技术在思考模型领域中的现代扩展。我们将探讨如何将人们在2025年初之前构建的一些技术应用于训练当前表现非常出色的思考模型。在这一特定情境下，从左边到右边进行转变时，有一些非常有趣的变化需要考虑。","start":473.91,"end":501.51}],"notes":["本段讨论了当前监督训练范式在推理任务中的局限性，即模型可能生成看似合理但实际上错误的解决方案。这表明监督学习在处理需要逻辑推理的任务时存在不足，而强化学习（RL）试图解决这一问题。","讲者提到DeepSeq R1模型，这是一个来自中国公司的模型，擅长解决数学竞赛和编程竞赛问题。这表明当前的推理模型在特定领域表现优异，但仍然存在需要改进的地方。","讲者将强化学习在推理任务中的应用分为两个部分：基于时间线的早期技术和现代扩展。早期技术包括模仿学习、离线强化学习和在线强化学习，而现代扩展则涉及如何将这些技术应用于当前的推理模型。","讲者指出，从左侧到右侧的转变需要一些重要的调整，这可能涉及模型架构、训练方法或评估标准的变化。这表明在将传统强化学习技术应用于推理模型时，需要进行适应性调整。","讲者提到，当前的推理模型（如DeepSeq R1、OpenAI O系列、Gemini和Claude Sonnet）在推理任务中表现出色，但仍然存在逻辑错误。这表明强化学习在提升模型推理能力方面具有潜力。","讲者强调，强化学习的目标是纠正模型在推理过程中可能产生的错误，而不仅仅是生成看似合理的解决方案。这表明强化学习在推理任务中的核心价值在于提升模型的逻辑正确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":324.43,"end":501.51,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":324.43,"text":"the answer. So in this particular question, if you need to prove that inequality that you see up on the slide, you cannot really go out there and start to look at individual terms of that expression. You have to kind of think about the whole summation as a whole. And these models, this is, I think, from an O-series model, I think O1, that I kind of got the solution. It starts to look at sort of individual terms, for instance, and ends up kind of asserting its solution at the end. But it really kind of does not realize that it's actually making a mistake and does not correct it."},{"start":354.09,"text":"So really what ends up happening with these current sort of supervised training paradigms when you think about reasoning is that they are going to produce a solution that looks very much like a legitimate solution that you could have written on an exam. It's just that that solution ends up being wrong and the logical content of that solution is not quite correct. And that's precisely something that RL tries to fix. And I'll hopefully try to show you some examples today of what kind of RL techniques come to rescue in that setting."},{"start":380.66,"text":"So in today's lecture, I guess we'll talk about RL for reasoning. I roughly sort of characterized this in sort of two parts. So I broke this down into two parts."},{"start":390.66,"text":"And these two parts are based on sort of timelines. So it's based on like stuff that came before sort of the DeepSeq R1 family of models came out. How many of you know what the DeepSeq R1 model is? Actually, I'm just curious. I have seen it, have played around with it. It's a model that was released, which is from a company in China named DeepSeq, which is really, really good at solving a lot of these sort of competition math problems or competition coding problems."},{"start":415.98,"text":"It's sort of in a similar style of model as the OpenAI O series of models, or some of these thinking models that exist out there, like the Gemini thinking model, or sort of Claude Sonnet thinking version, etc. So these are sort of models of the same family, and what we're going to do is we're going to talk about techniques that came before these models came out, which is early 2025, so January 2025, and some techniques that kind of have become much more prominent in the community after these models came out."},{"start":444.35,"text":"So the first part of my lecture will be based on these classical techniques that I'm going to talk about. And I'll talk about techniques that rely on some form of imitation learning, which I'm guessing has been covered in the class. We'll talk about some techniques that look like offline reinforcement learning. And I'll talk about some techniques that look like online reinforcement learning. This is sort of my characterization of this whole space. In general, there's a lot of literature that has been coming out, so I'll probably miss out on some of them. But this is roughly a characterization that I think makes sense to think about."},{"start":473.91,"text":"And after that, I'm going to talk about some modern extensions of these techniques into this thinking model kind of territory, where we'll talk about how can you take some of these techniques that people have built before early 2025 and think about using them to train thinking models that have been doing really amazing right now. And there's some very interesting things that need to change when you go from the left-hand side to the right-hand side in this particular setting."}],"speech_gaps":[],"frame":"../frames/v020/003.webp","frame_time":336.43},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":21,"text":"Okay, so I guess I already talked about the problem setup, but let me kind of just quickly go into a little bit of a detail and connect back to RL terminology. So we are going to consider reasoning, and in this particular setting, as I described earlier, you will be given a problem in natural language, and you have to write a solution in natural language. So what we can do when you think about this in the context of RL from an RL person's lens is you can think of this whole problem solving as an MDP, as a Markov decision process.","zh":"好的，所以我想我已经讲过问题设置，但让我简要地深入一点，并联系到强化学习的术语。我们将考虑推理，并且在这个特定的设置中，如我之前所描述的，你会被给出一个自然语言的问题，然后你需要用自然语言写出一个解决方案。当你从强化学习者的视角来看待这个问题时，你可以将整个问题解决过程视为一个马尔可夫决策过程（MDP）。","start":503.23,"end":532.25},{"id":22,"text":"And to do that, what you can do is you can think of the string of tokens that exist in the, or string of words that exist in the question as sort of an initial state of your MDP. So it's sort of the initial state that your agent or your policy is going to start from when it starts to sort of act in the world.","zh":"要做到这一点，你可以将存在于问题中的字符串标记（或字符串单词）视为你MDP的初始状态。这基本上是你代理或策略在开始在世界中行动时所处的初始状态。","start":533.06,"end":548.94},{"id":23,"text":"You can think of this solution that the model produces as being broken down into a sequence of steps. And these steps could correspond to actions, for example. So you can think of it as there's a model which takes as input this initial state, which is the problem. It one by one takes in a bunch of actions, which are these steps, and at the end ends up with a particular answer. So in this particular setting, that answer is represented in this box that you see up there.","zh":"你可以将模型生成的解决方案视为被分解成一系列步骤。这些步骤可以对应于动作，例如。你可以将其视为一个模型，它以这个初始状态（即问题）作为输入，依次接收一系列动作（即这些步骤），并在最后得到一个特定的答案。在这个特定的设置中，这个答案被显示在你上面看到的这个框中。","start":549.77,"end":576.25},{"id":24,"text":"And the answer is eight. And what you're going to do is you're going to reward the model with a sparse reward of plus one if this answer ends up being correct. And a reward of zero if this answer does not end up being correct. So the real Markov decision process here is sort of state, going to a sequence of actions, and going to sort of a termination bit where the model produces an answer. And you get a reward at the end of it if the particular answer is correct or not.","zh":"这个答案是八。你将根据这个答案是否正确，给予模型一个稀疏奖励：如果答案正确，奖励为加一；如果答案不正确，奖励为零。因此，这里的真正马尔可夫决策过程是状态，经过一系列动作，然后进入一个终止位，模型生成答案。如果答案正确，你将在最后得到奖励。","start":577.18,"end":606.95},{"id":25,"text":"So in RL terminology, this is a lot like a sparse reward MDP with a deterministic dynamics. What do I mean by this? Basically, there's no external environment in this whole process of producing these steps. There's no external environment that gives you a next state. All you are seeing is the initial state and these actions one by one, which tell you the next state of the problem.","zh":"在强化学习术语中，这类似于一个具有确定性动态的稀疏奖励MDP。我的意思是什么？基本上，在生成这些步骤的过程中没有外部环境。没有外部环境提供下一个状态。你所看到的只是初始状态和这些依次的动作，这些动作告诉你问题的下一个状态。","start":608.45,"end":634.49},{"id":26,"text":"Your model takes as action the particular step, the first step of the problem. It gets to state S1, which is nothing but the string of tokens.","zh":"你的模型采取的动作是问题的第一步。它到达状态S1，而S1无非就是一串标记。","start":635.04,"end":642.76},{"id":27,"text":"in S0 and A0, concatenated with each other. So that's all S1 is. It produces the next state, A1. It takes the next step, A1, or the next action, A1, goes to S2, and your next state, S2, is just S0, A0, A1, concatenated with each other until you hit the final answer. So you do this multiple times. You hit the final answer. Your model produces some answer, let's say 8. You get a reward, which is based on whether 8 is equal to the ground truth.","zh":"在S0和A0拼接在一起。因此，S1就是这样的结果。它产生下一个状态A1。它采取下一步动作A1，或者下一个动作A1，进入状态S2，而你的下一个状态S2仅仅是S0、A0、A1拼接在一起，直到你得到最终答案。因此你重复这个过程多次。你得到最终答案。你的模型产生某个答案，比如说8。你获得的奖励取决于8是否等于真实答案。","start":643.66,"end":670.94}],"notes":["本段讲解了如何将大语言模型的推理过程建模为马尔可夫决策过程（MDP）。讲者指出，问题的自然语言输入可以视为MDP的初始状态，而模型生成的推理步骤则对应于动作序列，最终生成的答案作为终止状态。奖励机制是稀疏的，仅在答案正确时给予+1奖励，否则为0。","讲者强调，这种建模方式没有外部环境，所有状态转移完全由模型的动作序列决定。初始状态是问题的自然语言输入，每个动作生成下一个状态，直到最终答案生成。这种设定类似于确定性动态的稀疏奖励MDP。","在推理过程中，模型通过逐步执行动作（即推理步骤）来生成答案。每个动作都会导致状态的更新，最终状态是答案。奖励仅在最终答案正确时给予，这与强化学习中的稀疏奖励机制一致。","讲者提到，状态转移是通过将初始状态和动作序列进行拼接来实现的。例如，S1是初始状态S0和第一个动作A0的拼接，S2是S0、A0和A1的拼接，直到最终答案生成。这种状态转移方式是确定性的，没有随机性。","讲者还指出，这种建模方式适用于大语言模型的推理任务，因为模型的输出可以被视为一系列动作，而最终答案作为终止状态。奖励机制的设计使得模型能够通过强化学习优化其推理过程。","本段内容强调了将自然语言推理任务转化为强化学习问题的思路，即通过状态转移和奖励机制来引导模型生成正确的答案。这种建模方式为后续的强化学习方法提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":503.23,"end":670.94,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":503.23,"text":"Okay, so I guess I already talked about the problem setup, but let me kind of just quickly go into a little bit of a detail and connect back to RL terminology. So we are going to consider reasoning, and in this particular setting, as I described earlier, you will be given a problem in natural language, and you have to write a solution in natural language. So what we can do when you think about this in the context of RL from an RL person's lens is you can think of this whole problem solving as an MDP, as a Markov decision process."},{"start":533.06,"text":"And to do that, what you can do is you can think of the string of tokens that exist in the, or string of words that exist in the question as sort of an initial state of your MDP. So it's sort of the initial state that your agent or your policy is going to start from when it starts to sort of act in the world."},{"start":549.77,"text":"You can think of this solution that the model produces as being broken down into a sequence of steps. And these steps could correspond to actions, for example. So you can think of it as there's a model which takes as input this initial state, which is the problem. It one by one takes in a bunch of actions, which are these steps, and at the end ends up with a particular answer. So in this particular setting, that answer is represented in this box that you see up there."},{"start":577.18,"text":"And the answer is eight. And what you're going to do is you're going to reward the model with a sparse reward of plus one if this answer ends up being correct. And a reward of zero if this answer does not end up being correct. So the real Markov decision process here is sort of state, going to a sequence of actions, and going to sort of a termination bit where the model produces an answer. And you get a reward at the end of it if the particular answer is correct or not."},{"start":608.45,"text":"So in RL terminology, this is a lot like a sparse reward MDP with a deterministic dynamics. What do I mean by this? Basically, there's no external environment in this whole process of producing these steps. There's no external environment that gives you a next state. All you are seeing is the initial state and these actions one by one, which tell you the next state of the problem. So I'll just draw on the board because I think, you know, so this is your initial state."},{"start":635.04,"text":"Your model takes as action the particular step, the first step of the problem. It gets to state S1, which is nothing but the string of tokens."},{"start":643.66,"text":"in S0 and A0, concatenated with each other. So that's all S1 is. It produces the next state, A1. It takes the next step, A1, or the next action, A1, goes to S2, and your next state, S2, is just S0, A0, A1, concatenated with each other until you hit the final answer. So you do this multiple times. You hit the final answer. Your model produces some answer, let's say 8. You get a reward, which is based on whether 8 is equal to the ground truth."}],"speech_gaps":[],"frame":"../frames/v020/004.webp","frame_time":515.23},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":28,"text":"answer or not. So you get a reward of R of 8, ground truth. This is either plus 1 or 0. That's your MDP that you're operating in. So that's a very good question. So the actions here could be infinity. There are infinitely many actions, but unlike sort of having, unless continuous control, where you kind of have a fixed dimension vector of continuous values, which are also infinite, you have a variable length string of tokens, which are all discrete, but then there could be many of them.","zh":"回答或不回答。因此，你会获得一个奖励 R 为 8，这是真实答案。这要么是加 1，要么是 0。这就是你所处的 MDP。这是一个非常好的问题。因此，这里的动作可以是无限的。存在无限多的动作，但不同于连续控制，其中你通常有一个固定维度的连续值向量，这些值也是无限的，你有一个长度可变的字符串标记序列，这些标记都是离散的，但可能有非常多。","start":672.0,"end":697.74},{"id":29,"text":"So the question is, what about questions where the answer is a proof or not a final numerical value? That's a very good question. I think we, as a community, haven't figured out the right set of techniques for such problems. So that's why we started off with sort of competition problems where there is a sort of a deterministic final answer. So we'll assume for now that we have a deterministic final answer.","zh":"问题是，当答案是一个证明而不是最终的数值时，我们该怎么办？这也是一个非常好的问题。我认为，我们这个社区还没有找到解决这类问题的正确技术集。因此，我们最初从一些有确定性最终答案的竞争性问题开始。现在我们将假设我们有一个确定性的最终答案。","start":698.51,"end":721.65},{"id":30,"text":"Yeah, so the question is, is there a risk that we get to the right answer, but we take suboptimal steps? There is, and I'm going to be talking about that in this lecture, actually. So that's sort of a basic sort of reasoning MDP or a language MDP you can pose for studying reasoning problems in this particular setting, and at least something that I'm going to be sticking to in this particular lecture.","zh":"是的，问题是，我们是否会得到正确的答案，但采取次优步骤？会的，我将在本次讲座中谈到这一点。因此，这基本上是一个用于研究此类推理问题的推理 MDP 或语言 MDP，至少在本次讲座中，我会坚持使用这个模型。","start":722.88,"end":741.77},{"id":31,"text":"Okay, so we'll start with studying some classical RL methods for reasoning. And what I'm going to do here is I'm going to cover one of my papers from NeurIps 24 that you see on the slide. This is the first bullet point. And why am I covering that paper? It's not because this paper invented a lot of the techniques, but because this paper actually did a lot of interesting empirical analysis of a lot of the methods that exist out there to understand why something works and why something fails. So it's just a nice way to get a conceptual model, at least in my opinion.","zh":"好的，我们将从研究一些经典的强化学习方法开始。在这里，我将介绍我在 NeurIPS 24 上发表的一篇论文，你们在幻灯片上可以看到。这是第一个要点。为什么我要介绍这篇论文？不是因为这篇论文发明了很多技术，而是因为这篇论文对现有方法进行了大量有趣的实证分析，以理解为什么某些方法有效，而某些方法失败。在我看来，这为建立概念模型提供了一个很好的方式。","start":742.99,"end":772.17},{"id":32,"text":"about all the sort of techniques in the classical reasoning space with RL. Okay, so what we're going to do is we're going to sort of try to understand how different methods or how RL methods for training for reasoning behave when we train them on different amounts of data. So we're going to do what we call a data scaling analysis in this particular segment of the talk.","zh":"关于经典推理空间中所有类型的技巧与强化学习。好的，那么我们将要做的是尝试理解不同的方法，或者用于推理训练的强化学习方法，在我们用不同数量的数据进行训练时的表现。因此，在本段演讲中，我们将进行所谓的数据扩展分析。","start":772.27,"end":794.62},{"id":33,"text":"So the basic setup here would be I'm going to build algorithms that can be used to train reasoning models on a data set. This data set will consist of some problems or these initial states that I described to you earlier. And we'll assume access to some Oracle solutions because we need a way to check the ground truth answer because that defines the reward function. So we have a data set of problems and solutions that we're going to be training with.","zh":"在这里的基本设置是，我将构建可以用于在数据集上训练推理模型的算法。这个数据集将包含一些问题或我之前向你们描述的初始状态。我们将假设可以访问某些Oracle解决方案，因为我们需要一种方式来验证真实答案，因为这定义了奖励函数。因此，我们将有一个包含问题和解决方案的数据集，用于训练。","start":795.28,"end":819.42},{"id":34,"text":"And what we're going to do is we're going to try to understand different classes of methods by evaluating how well they do when we train them on different amounts of problems and solution pairs that this data set gives us. So there's three axes we're going to look at when we think about training these methods on this data.","zh":"我们将要做的是尝试通过评估它们在使用该数据集提供的不同数量的问题和解决方案对进行训练时的表现，来理解不同类别的方法。因此，当我们考虑在这些数据上训练这些方法时，我们将关注三个轴。","start":819.76,"end":839.09}],"notes":["本段讨论了强化学习（RL）在大语言模型（LLM）推理中的应用，特别是如何将RL框架应用于推理问题。讲者提到，推理问题中的动作空间是无限的，但与连续控制不同，这里的动作是离散的字符串，由多个标记组成。此外，讲者指出，对于需要证明而非最终数值答案的问题，目前社区尚未找到合适的解决方法，因此先从确定性答案的问题开始研究。","讲者提到，即使得到正确答案，也可能采取次优步骤，这是推理问题中的一个风险。他将此问题视为一个基本的推理马尔可夫决策过程（MDP）或语言MDP，并将在本讲座中重点探讨这一问题。","讲者介绍了他的一篇NeurIPS 24论文，该论文并未发明大量技术，但通过大量实证分析理解了现有方法为何有效或失败。这为理解推理问题中的RL方法提供了概念模型。","接下来，讲者将讨论如何通过数据量变化来分析不同RL方法在推理任务中的表现，即所谓的数据缩放分析。他提到，数据集包含问题和对应的Oracle解决方案，用于验证真实答案并定义奖励函数。","最后，讲者指出将从三个维度分析不同方法在训练数据量变化下的表现，这可能包括数据量、模型复杂度和性能指标等。","整个段落强调了在推理任务中使用RL的挑战，包括动作空间的无限性、次优步骤的风险以及如何通过实证分析理解不同方法的优劣。"],"formulas":[],"uncertainties":[],"diagram":"none","start":672.0,"end":839.09,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":672.0,"text":"answer or not. So you get a reward of R of 8, ground truth. This is either plus 1 or 0. That's your MDP that you're operating in. So that's a very good question. So the actions here could be infinity. There are infinitely many actions, but unlike sort of having, unless continuous control, where you kind of have a fixed dimension vector of continuous values, which are also infinite, you have a variable length string of tokens, which are all discrete, but then there could be many of them."},{"start":698.51,"text":"So the question is, what about questions where the answer is a proof or not a final numerical value? That's a very good question. I think we, as a community, haven't figured out the right set of techniques for such problems. So that's why we started off with sort of competition problems where there is a sort of a deterministic final answer. So we'll assume for now that we have a deterministic final answer."},{"start":722.88,"text":"Yeah, so the question is, is there a risk that we get to the right answer, but we take suboptimal steps? There is, and I'm going to be talking about that in this lecture, actually. So that's sort of a basic sort of reasoning MDP or a language MDP you can pose for studying reasoning problems in this particular setting, and at least something that I'm going to be sticking to in this particular lecture."},{"start":742.99,"text":"Okay, so we'll start with studying some classical RL methods for reasoning. And what I'm going to do here is I'm going to cover one of my papers from NeurIps 24 that you see on the slide. This is the first bullet point. And why am I covering that paper? It's not because this paper invented a lot of the techniques, but because this paper actually did a lot of interesting empirical analysis of a lot of the methods that exist out there to understand why something works and why something fails. So it's just a nice way to get a conceptual model, at least in my opinion."},{"start":772.27,"text":"about all the sort of techniques in the classical reasoning space with RL. Okay, so what we're going to do is we're going to sort of try to understand how different methods or how RL methods for training for reasoning behave when we train them on different amounts of data. So we're going to do what we call a data scaling analysis in this particular segment of the talk."},{"start":795.28,"text":"So the basic setup here would be I'm going to build algorithms that can be used to train reasoning models on a data set. This data set will consist of some problems or these initial states that I described to you earlier. And we'll assume access to some Oracle solutions because we need a way to check the ground truth answer because that defines the reward function. So we have a data set of problems and solutions that we're going to be training with."},{"start":819.76,"text":"And what we're going to do is we're going to try to understand different classes of methods by evaluating how well they do when we train them on different amounts of problems and solution pairs that this data set gives us. So there's three axes we're going to look at when we think about training these methods on this data."}],"speech_gaps":[],"frame":"../frames/v020/005.webp","frame_time":684.0},{"title":"强化学习中用于提升大语言模型推理的拒绝微调方法","segments":[{"id":35,"text":"We can train them with potentially ground truth answers on multiple questions. So we can take this data set of problems and solutions and train the model to produce the solution given the question, like what supervised fine-tuning or imitation learning does. So we can just do imitation learning on top of this data. We'll introduce a new method that we call rejection fine-tuning, which trains on many correct solutions for a given answer.","zh":"我们可以用多个问题的潜在真实答案来训练它们。因此，我们可以使用这个问题与解答的数据集，训练模型根据问题生成解答，就像监督微调或模仿学习所做的那样。因此，我们只需在这个数据集上进行模仿学习。我们将介绍一种新方法，我们称之为拒绝微调，它在给定答案的许多正确解答上进行训练。","start":839.5,"end":867.16},{"id":36,"text":"So I'm going to write this method out here. And that will be clear for you. So what you're going to do is you're going to take a model, pi of y given x. We'll take a question x from my data set. So this is my question or problem. So this is my initial state.","zh":"我现在将在这里写出这个方法，这样你会清楚明白。你所要做的就是，你将使用一个模型，pi of y given x。我们将从我的数据集中选取一个问题x。这就是我的问题或问题。这就是我的初始状态。","start":867.78,"end":885.71},{"id":37,"text":"This is my solution, which consists of a sequence of actions. What I'm going to do now is I'm going to take these questions and sample multiple solutions from my particular model, from my current model that I want to train in this particular setting. So I have a model pi theta. I'm going to sample multiple solutions conditioned on the question given this particular model. So this is my model I'm training, the initial model.","zh":"这就是我的解答，它由一系列动作组成。我现在要做的就是，我将使用这些问题，并从我的特定模型中采样多个解答，从我当前想要在这个特定设置中训练的模型中采样。因此，我有一个模型pi theta。我将根据这个问题，在这个特定模型上采样多个解答。这就是我要训练的模型，初始模型。","start":886.25,"end":914.15},{"id":38,"text":"This is the data set. I'm going to sample multiple solution traces. What I'm going to do now is I'm going to take these traces, evaluate the rewards on each of them. So I'm going to evaluate R of Y1, R of Y2, R of Yn. Why can I do this? Because I have this question in my data set, which means I have a ground truth answer Y star for this question in my data set as well. Ground truth answer","zh":"这就是数据集。我将采样多个解答轨迹。我现在要做的就是，我将使用这些轨迹，评估每个轨迹的奖励。因此，我将评估R of Y1，R of Y2，R of Yn。为什么我可以这样做？因为我在数据集中有这个问题，这意味着我在数据集中也有这个问题的真实答案Y star。真实答案","start":916.52,"end":946.75},{"id":39,"text":"for X question. And what I can do is I can simply match whether multiple traces or multiple trajectories sampled from my policy, pi theta, end up in the right answer or not by checking whether the final number was correct or not. So what I'm doing here is I'm taking my initial model, sampling a bunch of traces, or rolling it out in my environment, which is simply producing solutions from this model for each question, and evaluating the rewards against the ground truth answer.","zh":"对于X问题。我可以做的就是，我可以简单地检查多个轨迹或多个轨迹从我的策略pi theta中采样后，是否最终到达正确的答案，只需检查最终的数值是否正确即可。因此，我在这里所做的就是，使用我的初始模型，采样许多轨迹，或在环境中展开，这仅仅是为每个问题从这个模型中生成解答，并将奖励评估与真实答案进行比较。","start":947.56,"end":976.29},{"id":40,"text":"Now what I do is I take this particular set of y1 to yn's I produced, and I retain only those ones which ended up in the right answer. So I take the set S of y1 to yn, and I filter it to get some filtered set, let's call it S tilde, which consists of y's, so yj, such that the reward is 1.","zh":"现在我所做的就是，我取我生成的这一组y1到yn，只保留那些最终得到正确答案的。所以我取y1到yn的集合S，然后对其进行过滤，得到一个过滤后的集合，我们称之为S带波浪线，这个集合由满足奖励为1的yj组成。","start":977.01,"end":1007.67}],"notes":["本段讲解了拒绝微调方法的基本思想，即通过从模型中采样多个解决方案，并根据这些解决方案是否达到正确答案来筛选出高质量的轨迹。这种方法利用了数据集中存在的正确答案作为奖励信号。","在具体实现中，模型会根据给定的问题生成多个解决方案轨迹，并对每个轨迹进行奖励评估。奖励的计算基于轨迹是否最终得到正确的答案，即最终的奖励值为1。","筛选过程是通过保留那些最终奖励为1的轨迹来实现的，这些轨迹被认为是高质量的解决方案。这一步骤是拒绝微调方法的核心，因为它确保了模型在训练过程中只关注那些能够产生正确答案的轨迹。","这种方法与传统的监督微调或模仿学习不同，它通过强化学习的框架来优化模型的推理能力，而不是直接使用监督信号。","在实际操作中，模型会根据问题生成多个轨迹，并通过评估这些轨迹的奖励来决定哪些轨迹可以用于进一步的训练。","这种方法的关键在于利用数据集中的正确答案作为奖励信号，从而引导模型学习如何生成正确的解决方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":839.5,"end":1007.67,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":839.5,"text":"We can train them with potentially ground truth answers on multiple questions. So we can take this data set of problems and solutions and train the model to produce the solution given the question, like what supervised fine-tuning or imitation learning does. So we can just do imitation learning on top of this data. We'll introduce a new method that we call rejection fine-tuning, which trains on many correct solutions for a given answer."},{"start":867.78,"text":"So I'm going to write this method out here. And that will be clear for you. So what you're going to do is you're going to take a model, pi of y given x. We'll take a question x from my data set. So this is my question or problem. So this is my initial state."},{"start":886.25,"text":"This is my solution, which consists of a sequence of actions. What I'm going to do now is I'm going to take these questions and sample multiple solutions from my particular model, from my current model that I want to train in this particular setting. So I have a model pi theta. I'm going to sample multiple solutions conditioned on the question given this particular model. So this is my model I'm training, the initial model."},{"start":916.52,"text":"This is the data set. I'm going to sample multiple solution traces. What I'm going to do now is I'm going to take these traces, evaluate the rewards on each of them. So I'm going to evaluate R of Y1, R of Y2, R of Yn. Why can I do this? Because I have this question in my data set, which means I have a ground truth answer Y star for this question in my data set as well. Ground truth answer"},{"start":947.56,"text":"for X question. And what I can do is I can simply match whether multiple traces or multiple trajectories sampled from my policy, pi theta, end up in the right answer or not by checking whether the final number was correct or not. So what I'm doing here is I'm taking my initial model, sampling a bunch of traces, or rolling it out in my environment, which is simply producing solutions from this model for each question, and evaluating the rewards against the ground truth answer."},{"start":977.01,"text":"Now what I do is I take this particular set of y1 to yn's I produced, and I retain only those ones which ended up in the right answer. So I take the set S of y1 to yn, and I filter it to get some filtered set, let's call it S tilde, which consists of y's, so yj, such that the reward is 1."}],"speech_gaps":[],"frame":"../frames/v020/006.webp","frame_time":851.5},{"title":"使用强化学习提升大语言模型推理","segments":[{"id":41,"text":"Meaning these solutions ended up at the right answer. Does this procedure make sense to people? Okay. And what I'm going to do now is, you know, now I have a bunch of traces or a bunch of trajectories that ended up at the right answer, which means they're successful. So what I can do is I can simply try to train my model pi theta to imitate these trajectories. So I can train pi theta to imitate s tilde. So I'm just going to write it down here again. So my algorithm looks like this.","zh":"这意味着这些解决方案最终得出了正确的答案。这个过程对人们来说有意义吗？好的。现在我要做的事情是，现在我有一系列轨迹或一系列最终得出正确答案的轨迹，这意味着它们是成功的。因此，我可以做的是，我可以简单地尝试训练我的模型 pi theta 来模仿这些轨迹。因此，我可以训练 pi theta 来模仿 s tilde。我在这里再次写下这个过程。因此，我的算法看起来像这样。","start":1008.92,"end":1037.83},{"id":42,"text":"For iteration 1 to some t that I can choose however I want. So step one is sample y1 to n from pi theta of dot given x question. The second step is filter and generate s tilde, which consists of correct y's only.","zh":"对于从 1 到某个 t 的迭代，我可以任意选择。第一步是从 pi theta 给定 x question 的条件下，采样 y1 到 yn。第二步是过滤并生成 s tilde，它仅包含正确的 y。","start":1038.46,"end":1071.35},{"id":43,"text":"And the third step is do imitation or do BC or SFP, depending upon whatever terminology you like, you can call that, on S tilde. So you're training the model now, pi theta, to produce only the y's that were correct. So that's sort of this particular approach.","zh":"第三步是进行模仿学习或进行 BC 或 SFP，根据你喜欢的术语，你可以称之为在 s tilde 上进行。你现在正在训练模型 pi theta，使其仅生成正确的 y。因此，这就是这种特定方法。","start":1072.75,"end":1090.89},{"id":44,"text":"Okay, so this approach is what is called rejection fine-tuning, or RFT, and that's why you see it on the horizontal axis up there, where what you're doing now is you're going to produce many solutions and try to filter for correct ones and train on them again. What happens now is you're rejecting the ones that were wrong, hence the word rejection, and fine-tuning just stands for fine-tuning, so RFT or rejection fine-tuning.","zh":"好的，这种方法被称为拒绝微调（rejection fine-tuning，RFT），这就是为什么你会在上面的水平轴上看到它。你现在要做的事情是生成许多解决方案，并尝试筛选出正确的解决方案，然后再次进行训练。现在发生的是你拒绝那些错误的解决方案，因此有“拒绝”这个词，而“微调”只是指微调，因此是 RFT 或拒绝微调。","start":1091.96,"end":1117.68},{"id":45,"text":"The nice property about this approach is it's not actually asking you for Oracle solutions that a human wrote. All it asks for is solutions that your model can produce, which ended up being correct. So these are on-policy rollouts that are sampled from your policy, and you're simply filtering for correctness, which you can because you know what the reward function looks like.","zh":"这种方法的一个优点是它实际上并不要求你提供人类编写的 Oracle 解决方案。它只需要你的模型能够生成的、最终正确的解决方案。因此，这些是来自你策略的在策略 rollout，你只需筛选出正确的解决方案，而这你可以做到，因为你了解奖励函数的形状。","start":1118.2,"end":1139.68},{"id":46,"text":"And the third axis here is actually full-blown reinforcement learning, where in RL, when we train on data, we don't really need the data to be high quality or high rewarding. You've talked about offline RL. That's on your homework. You can learn from suboptimal data, data that does not succeed. And so you can kind of also think about the third axis in all of these methods as methods which train on incorrect solutions or learn from traces or rollouts that did not succeed, that attained a reward of zero. So I'm just going to call them RL.","zh":"这里的第三个轴实际上是完整的强化学习，在强化学习中，当我们用数据进行训练时，其实并不需要这些数据是高质量的或高奖励的。你已经讨论过离线强化学习，这在你的作业中有所涉及。你可以从次优的数据中学习，也可以从没有成功的数据中学习。因此，你也可以将这些方法中的第三个轴视为那些在错误的解决方案上进行训练，或从没有成功、获得零奖励的轨迹或 rollout 中学习的方法。所以我将它们称为强化学习。","start":1140.81,"end":1168.77}],"notes":["本段讲解了强化学习在提升大语言模型推理能力中的应用，特别是通过模仿学习和拒绝微调（RFT）的方法。首先，模型生成多个轨迹，然后筛选出正确的轨迹进行训练，这种方法被称为拒绝微调。这种方法不需要人类编写的Oracle解决方案，而是利用模型自身生成的正确轨迹进行训练。","在拒绝微调中，模型通过采样生成多个解决方案，然后过滤出正确的解决方案进行训练。这种方法的关键在于模型能够根据奖励函数判断轨迹的正确性，从而进行筛选。这种方法与传统的模仿学习（BC）或策略微调（SFP）类似，但更强调对正确轨迹的筛选。","与拒绝微调不同，强化学习（RL）可以利用不成功的轨迹进行训练，即使这些轨迹没有达到高奖励或高质量。这种方法允许模型从错误或低效的轨迹中学习，从而提升整体性能。这种学习方式在离线强化学习中尤为重要，因为数据可能并不完美。","在强化学习中，训练数据的质量并不需要特别高，模型可以通过优化策略来最大化长期奖励。这种方法与拒绝微调不同，因为它不依赖于对正确轨迹的筛选，而是直接利用所有轨迹进行训练，包括那些不成功的轨迹。","课程中提到的三种方法（拒绝微调、模仿学习、强化学习）分别对应不同的训练策略。拒绝微调强调对正确轨迹的筛选，模仿学习强调对正确轨迹的模仿，而强化学习则强调从所有轨迹中学习，包括不成功的轨迹。这三种方法在实际应用中各有优劣，需要根据具体任务进行选择。","课程中还提到，强化学习可以处理离线数据，即不需要实时交互的数据。这种能力使得强化学习在实际应用中更加灵活，尤其是在数据获取成本较高的情况下。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1008.92,"end":1168.77,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1008.92,"text":"Meaning these solutions ended up at the right answer. Does this procedure make sense to people? Okay. And what I'm going to do now is, you know, now I have a bunch of traces or a bunch of trajectories that ended up at the right answer, which means they're successful. So what I can do is I can simply try to train my model pi theta to imitate these trajectories. So I can train pi theta to imitate s tilde. So I'm just going to write it down here again. So my algorithm looks like this."},{"start":1038.46,"text":"For iteration 1 to some t that I can choose however I want. So step one is sample y1 to n from pi theta of dot given x question. The second step is filter and generate s tilde, which consists of correct y's only."},{"start":1072.75,"text":"And the third step is do imitation or do BC or SFP, depending upon whatever terminology you like, you can call that, on S tilde. So you're training the model now, pi theta, to produce only the y's that were correct. So that's sort of this particular approach."},{"start":1091.96,"text":"Okay, so this approach is what is called rejection fine-tuning, or RFT, and that's why you see it on the horizontal axis up there, where what you're doing now is you're going to produce many solutions and try to filter for correct ones and train on them again. What happens now is you're rejecting the ones that were wrong, hence the word rejection, and fine-tuning just stands for fine-tuning, so RFT or rejection fine-tuning."},{"start":1118.2,"text":"The nice property about this approach is it's not actually asking you for Oracle solutions that a human wrote. All it asks for is solutions that your model can produce, which ended up being correct. So these are on-policy rollouts that are sampled from your policy, and you're simply filtering for correctness, which you can because you know what the reward function looks like."},{"start":1140.81,"text":"And the third axis here is actually full-blown reinforcement learning, where in RL, when we train on data, we don't really need the data to be high quality or high rewarding. You've talked about offline RL. That's on your homework. You can learn from suboptimal data, data that does not succeed. And so you can kind of also think about the third axis in all of these methods as methods which train on incorrect solutions or learn from traces or rollouts that did not succeed, that attained a reward of zero. So I'm just going to call them RL."}],"speech_gaps":[],"frame":"../frames/v020/007.webp","frame_time":1020.92},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":47,"text":"So there are these three different axes along which you can sort of, you know, train methods. You can scale your data. You can scale your model bandwidth. Number of questions and oracle solutions, SFT. Number of questions and correct solutions by filtering or rejection, which is called rejection, fine-tuning, or RFT. And just training on any kind of data, which is reinforcement learning. So what I'm going to do in this lecture is we'll talk about how these different methods actually behave in practice. And that'll give us a sense of, like, what to use in what case.","zh":"因此，存在三个不同的轴，你可以沿着这些轴来训练方法。你可以扩展你的数据。你可以扩展你的模型带宽。问题数量和oracle解决方案，即SFT（监督微调）。问题数量和通过过滤或拒绝得到的正确解决方案，这被称为拒绝微调或RFT。以及仅在任何类型的数据上进行训练，这被称为强化学习。因此，在本节课中，我们将讨论这些不同方法在实际中的表现。这将帮助我们了解在什么情况下使用哪种方法。","start":1169.37,"end":1197.21},{"id":48,"text":"So the question is, are we forcing the model to come up with overly verbose answers? So here we are not really. So the short answer is no, because here we are not really encouraging verbosity at all. All we're doing is we're simply sampling multiple traces from a model and train the model to find answers, train the model to sort of closely mimic traces, which ended up being successful.","zh":"问题是，我们是否在迫使模型生成过于冗长的答案？实际上并不是。简短的回答是不，因为我们并没有真正鼓励冗长。我们所做的只是从模型中采样多个轨迹，并训练模型找到答案，训练模型大致模仿那些最终成功的轨迹。","start":1198.16,"end":1220.54},{"id":49,"text":"In some way, so if the traces that end up being successful are those that actually need more space to be verbose, then it's going to incentivize you to be verbose. But if the questions that end up succeeding are not those or the traces that end up succeeding are not the ones that end up needing to be verbose, then it's going to not incentivize it. So imagine that let's say the question is two plus two is equal to question mark. Maybe one of the traces gets you an answer of four, and you know there are some traces which are going to do this, which are going to count two plus two in 10 different ways, but most of the traces write down four right away. Then what you're going to do in this","zh":"某种意义上，如果最终成功的轨迹是那些实际上需要更多空间来生成冗长答案的轨迹，那么它将激励你生成冗长的答案。但如果最终成功的题目或轨迹并不是那些需要冗长答案的，那么它就不会激励你这样做。想象一下，假设问题是“2加2等于多少”，其中一条轨迹会得到答案“4”，而有些轨迹会以10种不同的方式计算2加2，但大多数轨迹会直接写出“4”。那么在这个过程中，你会找到那些直接写出“4”的轨迹，并训练它们全部直接输出“4”。这就是下一个开放的问题。因此，这种情况不一定以这种方式发生。","start":1221.1,"end":1250.28},{"id":50,"text":"processes, you're going to find traces which end up with a four right away, and you're going to train them all to produce four right away. That's the next open. So it's not necessarily going to happen that way. Okay, so the question is, if the method got the correct answer with the wrong sort of approach, then you're incentivizing them all to learn that. And the answer is yes. And that's why we'll see how these things behave in empirical results. That's kind of the next part of the talk.","zh":"问题是，如果方法通过错误的方法得到了正确的答案，那么你就会激励它们全部学习这种方法。答案是肯定的。这也是为什么我们将通过实证结果来观察这些方法的表现。这是演讲的下一部分内容。","start":1250.41,"end":1274.05},{"id":51,"text":"Yeah, so the question is, would the data set be biased towards easy problems? The short answer is it does, yes, in some way. But the practical answer for this question is, well, in these cases, what you're going to do is you're going to potentially start with training the model on top of.","zh":"是的，问题是，这个数据集是否会偏向于容易的问题？简短的回答是，是的，在某种程度上确实如此。但针对这个问题的实用回答是，在这种情况下，你可能会先在Oracle数据或Oracle问题-答案对上进行监督微调（SFT），然后在此基础上进行拒绝微调。因此，模型现在具备生成这些问题答案的能力，然后你开始进行训练。很好。实际上，这是一张让我在当时课堂上花了很长时间理解的幻灯片，但从这里开始的很多幻灯片实际上都在讨论这些方法的性质。","start":1274.88,"end":1291.98},{"id":52,"text":"Oracle data or Oracle question-answer pairs first with SFT, the first axis that goes up, and then do rejection fine-tuning on top of it. So the model has some capability now to produce some answers for those questions, and then you start doing it. Great. So this was actually one of the slides which took me a long time even in my lecture back then, but a lot of the slides from here on are actually talking about properties of these methods actually.","zh":"先用Oracle数据或Oracle问题-答案对进行SFT，第一个轴向上升，然后在此基础上进行拒绝微调。因此，模型现在具备生成这些问题答案的能力，然后你开始进行这样的训练。很好。所以这实际上是我当时讲课时花了很长时间的一张幻灯片，但从这里开始的很多幻灯片实际上都是在讨论这些方法的性质。","start":1292.41,"end":1316.33},{"id":53,"text":"So the first thing we're going to look at is how does SFT behave? So training your model with imitation learning on correct answers given questions that some human wrote. So when we're doing this work, we looked at two benchmarks.","zh":"我们将首先查看SFT的行为。通过在人类编写的问题上使用正确答案进行模仿学习来训练模型。在我们进行这项工作时，我们考察了两个基准。","start":1316.87,"end":1329.51}],"notes":["本段讨论了在强化学习中，模型是否会因为训练数据而变得过于冗长。讲者指出，模型并不会被鼓励产生冗长的回答，而是通过采样多个轨迹并训练模型模仿成功轨迹来学习。成功轨迹是否需要冗长回答取决于问题本身，如果成功轨迹是冗长的，模型就会被激励产生冗长回答，否则不会。","讲者进一步举例说明，如果问题本身可以通过简单回答解决，那么模型会倾向于快速给出答案，而不是冗长的解释。这表明模型的行为取决于训练数据中成功轨迹的特性。","讲者提到，如果模型通过错误的方法得到了正确的答案，那么它会被激励学习这种错误的方法。这说明训练数据的质量和多样性对模型学习过程有重要影响。","讲者还提到数据集可能偏向于简单问题，但实际应用中可以通过先使用SFT（监督微调）训练模型，再进行拒绝微调（RFT）来解决这个问题。这表明在实际应用中需要结合多种方法来优化模型性能。","讲者指出，这些方法的性质和行为是课程后续内容的重点，说明课程将深入探讨这些方法的理论和实践应用。","讲者提到自己在准备课程时花费了大量时间，这表明课程内容具有一定的深度和复杂性，需要学生认真理解和掌握。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1169.37,"end":1329.51,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1169.37,"text":"So there are these three different axes along which you can sort of, you know, train methods. You can scale your data. You can scale your model bandwidth. Number of questions and oracle solutions, SFT. Number of questions and correct solutions by filtering or rejection, which is called rejection, fine-tuning, or RFT. And just training on any kind of data, which is reinforcement learning. So what I'm going to do in this lecture is we'll talk about how these different methods actually behave in practice. And that'll give us a sense of, like, what to use in what case."},{"start":1198.16,"text":"So the question is, are we forcing the model to come up with overly verbose answers? So here we are not really. So the short answer is no, because here we are not really encouraging verbosity at all. All we're doing is we're simply sampling multiple traces from a model and train the model to find answers, train the model to sort of closely mimic traces, which ended up being successful."},{"start":1221.1,"text":"in some way so if the traces that end up being successful are those that actually need more space to be verbose then it's going to incentivize you to be verbose but if the questions that end up succeeding are not those or the traces that end up succeeding are not the ones that end up needing to be verbose then it's going to not incentivize it so imagine that let's say the question is two plus two is equal to question mark maybe one of the traces gets you an answer of four and you know there are some traces which are going to do this do which are going to count two plus two in 10 different ways but most of the traces write down four right away then what you're going to do in this"},{"start":1250.41,"text":"processes, you're going to find traces which end up with a four right away, and you're going to train them all to produce four right away. That's the next open. So it's not necessarily going to happen that way. Okay, so the question is, if the method got the correct answer with the wrong sort of approach, then you're incentivizing them all to learn that. And the answer is yes. And that's why we'll see how these things behave in empirical results. That's kind of the next part of the talk."},{"start":1274.88,"text":"Yeah, so the question is, would the data set be biased towards easy problems? The short answer is it does, yes, in some way. But the practical answer for this question is, well, in these cases, what you're going to do is you're going to potentially start with training the model on top of."},{"start":1292.41,"text":"Oracle data or Oracle question-answer pairs first with SFP, the first axis that goes up, and then do rejection fine-tuning on top of it. So the model has some capability now to produce some answers for those questions, and then you start doing it. Great. So this was actually one of the slides which took me a long time even in my lecture back then, but a lot of the slides from here on are actually talking about properties of these methods actually."},{"start":1316.87,"text":"So the first thing we're going to look at is how does SFT behave? So training your model with imitation learning on correct answers given questions that some human wrote. So when we're doing this work, we looked at two benchmarks."}],"speech_gaps":[],"frame":"../frames/v020/008.webp","frame_time":1181.37},{"title":"强化学习在提升大语言模型推理中的应用","segments":[{"id":54,"text":"named GSM 8K and MATH. These benchmarks now are fully solved. So it doesn't make sense to sort of going forward benchmark methods on these benchmarks. But back then in 2024, this was like a year ago exactly, these benchmarks are very sort of representative of useful methods. So what we try to do in this particular slide is we are trying to see how well SFT behaves and we're trying to compare it to RFT or rejection fine-tuning that I described to you.","zh":"这些基准测试被称为GSM 8K和MATH。这些基准测试现在已经完全被解决了。因此，在这些基准测试上继续改进基准方法是没有意义的。但当时在2024年，也就是一年前，这些基准测试非常具有代表性，能够体现有用的方法。因此，我们在这一张幻灯片中尝试了解SFT的表现，并将其与我之前描述的拒绝微调（RFT）方法进行比较。","start":1330.68,"end":1359.44},{"id":55,"text":"We do that on top of multiple models. And here I'm showing you one result on top of the DeepSeq V2 model. That is one of the best math models back at the time. And what I'm plotting here is I'm plotting the average test error of this model after fine-tuning with these SFT and RFT methods as a function of how much data we run fine-tuning on. So the more the data, the ideal picture is you will get lower error and you should be able to actually get better accuracy, right? Because you have more data, more coverage of questions like that.","zh":"我们在多个模型上进行了这项工作。在这里，我向你展示了一个结果，是在DeepSeq V2模型上进行的。这是当时最好的数学模型之一。我在这里绘制的是，经过使用这些SFT和RFT方法微调后，该模型的平均测试误差，作为微调所使用数据量的函数。因此，数据越多，理想情况下，你得到的误差越低，你应该能够实际获得更好的准确性，对吧？因为数据越多，覆盖的问题类型就越广。","start":1359.94,"end":1387.92},{"id":56,"text":"So that indeed does happen. So you do find that, you know, error goes down as you scale up the amount of questions in both of these settings. But clearly, sort of the error does not go down at a very fast rate, meaning it so turns out that, you know, the test error, if you try to approximate the closest sort of function to this particular curve, it will be the function that looks like D to the minus 0.15.","zh":"确实如此。你会发现，在这两种设置中，随着问题数量的增加，误差确实会下降。但显然，误差下降的速度并不快，这意味着，如果你尝试近似拟合这条曲线的最接近函数，它将类似于d的-0.15次方。","start":1388.62,"end":1411.94},{"id":57,"text":"or d to the minus 0.05. So this particular curve that you're seeing, these are empirical measurements. But if I try to fit a smooth curve to it as a function of the data set size, that the exponent is going to be a very small number. Ideally, you would want this exponent to be really large, like d to the minus half, for instance, because this curve will go down very quickly. And with a reasonable amount of data, you're going to be succeeding at the particular problem, at this particular data set. But that doesn't happen in this case.","zh":"或者d的-0.05次方。你所看到的这条曲线是经验测量的结果。但如果我尝试用一条平滑的曲线来拟合它，作为数据集大小的函数，那么指数将是一个非常小的数值。理想情况下，你希望这个指数非常大，例如d的-0.5次方，因为这样的曲线会迅速下降。并且，使用合理数量的数据，你就能在特定的问题上取得成功，但在这种情况下并没有发生。","start":1412.42,"end":1436.47},{"id":58,"text":"So one of the goals that we then could have for a lot of these reasoning methods and RL methods for reasoning is to sort of push this curve as much as possible towards the left and towards sort of the x-axis. So push them down and towards the left.","zh":"因此，我们对这些推理方法和强化学习方法的一个目标，就是尽可能地将这条曲线向左和向x轴方向推移。也就是说，将它们尽可能地向下和向左推移。","start":1437.06,"end":1452.58},{"id":59,"text":"And the first result we saw to that extent was the fact that rejection fine tuning or training on your own data, on your own correct solutions, actually gets you a much better test error. So you find that you can get the same test error on both of these benchmarks with RFT as you could do with 2x the number of questions and 2x the number of human written solutions for SFT. So what this tells you at a high level is that on policy imitation learning,","zh":"我们首先看到的结果是，拒绝微调（rejection fine tuning）或在自己的数据、自己的正确解上进行训练，实际上能够获得更好的测试误差。因此你会发现，在这两个基准测试中，使用RFT可以达到与使用两倍数量的问题和两倍数量的人工编写解的SFT（监督微调）相同的测试误差。从高层次来看，这表明在策略模仿学习中，","start":1453.44,"end":1482.27},{"id":60,"text":"Sampling from your policy and imitating the correct answers can be 2x more efficient in this particular setting compared to SFT alone, or off-policy SFT, or just imitation learning alone. Okay, great. So that's sort of the first result, first takeaway to have here.","zh":"从你的策略中进行采样并模仿正确答案，在这种特定设置下，相比仅使用SFT、离策略SFT或仅使用模仿学习，效率可以提高2倍。好的，很好。因此，这就是第一个结果，第一个值得记住的要点。","start":1482.77,"end":1497.78}],"notes":["本段讨论了在强化学习（RL）框架下，如何通过SFT（监督微调）和RFT（拒绝微调）方法提升大语言模型（LLM）在推理任务上的表现。讲者指出，SFT和RFT在不同数据量下对测试误差的影响，以及如何通过RFT方法在较少数据下达到与SFT在更多数据下相似的性能。","讲者提到，随着数据量的增加，测试误差会下降，但下降速度较慢，这表明模型的性能提升存在一定的瓶颈。通过拟合曲线，讲者指出误差函数可能类似于D的负指数形式，如D的-0.15次方或D的-0.05次方，这表明模型的性能提升随着数据量的增加而逐渐趋于平缓。","讲者进一步指出，理想情况下，误差函数的指数应较大，如D的-0.5次方，这样模型在较少数据下就能达到较高的性能。然而，在实际情况下，这种快速下降并未出现，说明当前方法在数据利用效率上仍有提升空间。","讲者强调，RFT方法通过使用自身数据和正确答案进行训练，能够显著提升测试误差表现。具体而言，RFT在相同测试误差下所需的训练数据量仅为SFT的1/2，这表明RFT在效率上具有明显优势。","讲者指出，RFT方法在政策模仿学习（policy imitation learning）中的应用，能够通过从策略中采样并模仿正确答案，实现比SFT或仅模仿学习更高的效率。这表明在强化学习框架下，通过策略优化可以显著提升模型的推理能力。","讲者总结了RFT方法在提升模型推理性能方面的初步成果，指出其在减少数据需求和提升测试误差方面的有效性，为后续研究提供了方向。"],"formulas":[{"latex":"D^{-0.15}","symbols":"误差函数的指数形式","explanation":"该公式表示测试误差随数据量D变化的指数形式，指数为-0.15，符合原文中提到的误差函数近似曲线的描述。","evidence":"So that indeed does happen. So you do find that, you know, error goes down as you scale up the amount of questions in both of these settings. But clearly, sort of the error does not go down at a very fast rate, meaning it so turns out that, you know, the test error, if you try to approximate the closest sort of function to this particular curve, it will be the function that looks like D to the minus 0.15."},{"latex":"D^{-0.5}","symbols":"理想误差函数的指数形式","explanation":"该公式表示理想情况下测试误差随数据量D变化的指数形式，指数为-0.5，符合原文中提到的理想误差函数的描述。","evidence":"or d to the minus 0.05. So this particular curve that you're seeing, these are empirical measurements. But if I try to fit a smooth curve to it as a function of the data set size, that the exponent is going to be a very small number. Ideally, you would want this exponent to be really large, like d to the minus half, for instance, because this curve will go down very quickly. And with a reasonable amount of data, you're going to be succeeding at the particular problem, at this particular data set. But that doesn't happen in this case."}],"uncertainties":["D to the minus 0.15"],"diagram":"none","start":1330.68,"end":1497.78,"asr_flags":[],"math_clarifications":["原文中提到的误差函数指数形式为D^{-0.15}和D^{-0.5}，这些指数形式符合数学中描述误差随数据量变化的常见形式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1330.68,"text":"named GSM 8K and MATH. These benchmarks now are fully solved. So it doesn't make sense to sort of going forward benchmark methods on these benchmarks. But back then in 2024, this was like a year ago exactly, these benchmarks are very sort of representative of useful methods. So what we try to do in this particular slide is we are trying to see how well SFT behaves and we're trying to compare it to RFT or rejection fine-tuning that I described to you."},{"start":1359.94,"text":"We do that on top of multiple models. And here I'm showing you one result on top of the DeepSeq V2 model. That is one of the best math models back at the time. And what I'm plotting here is I'm plotting the average test error of this model after fine-tuning with these SFT and RFT methods as a function of how much data we run fine-tuning on. So the more the data, the ideal picture is you will get lower error and you should be able to actually get better accuracy, right? Because you have more data, more coverage of questions like that."},{"start":1388.62,"text":"So that indeed does happen. So you do find that, you know, error goes down as you scale up the amount of questions in both of these settings. But clearly, sort of the error does not go down at a very fast rate, meaning it so turns out that, you know, the test error, if you try to approximate the closest sort of function to this particular curve, it will be the function that looks like D to the minus 0.15."},{"start":1412.42,"text":"or d to the minus 0.05. So this particular curve that you're seeing, these are empirical measurements. But if I try to fit a smooth curve to it as a function of the data set size, that the exponent is going to be a very small number. Ideally, you would want this exponent to be really large, like d to the minus half, for instance, because this curve will go down very quickly. And with a reasonable amount of data, you're going to be succeeding at the particular problem, at this particular data set. But that doesn't happen in this case."},{"start":1437.06,"text":"So one of the goals that we then could have for a lot of these reasoning methods and RL methods for reasoning is to sort of push this curve as much as possible towards the left and towards sort of the x-axis. So push them down and towards the left."},{"start":1453.44,"text":"And the first result we saw to that extent was the fact that rejection fine tuning or training on your own data, on your own correct solutions, actually gets you a much better test error. So you find that you can get the same test error on both of these benchmarks with RFT as you could do with 2x the number of questions and 2x the number of human written solutions for SFT. So what this tells you at a high level is that on policy imitation learning,"},{"start":1482.77,"text":"Sampling from your policy and imitating the correct answers can be 2x more efficient in this particular setting compared to SFT alone, or off-policy SFT, or just imitation learning alone. Okay, great. So that's sort of the first result, first takeaway to have here."}],"speech_gaps":[],"frame":"../frames/v020/009.webp","frame_time":1342.68},{"title":"强化学习中策略优化的局限性","segments":[{"id":61,"text":"But it so turns out that if you simply keep doing this over and over, it's not going to give you the best possible policy or the best possible model. So if you simply keep scaling up SFT on policy data, what do I mean by scaling it up? I mean you increase this value of n that you see up here. So you just sample tons and tons of solutions and pick the correct ones and just start to do BC on all of them. Turns out that that recipe does not actually work.","zh":"但事实上，如果你只是不断重复这样做，它不会给你最佳的策略或最佳的模型。所以如果你只是不断在策略数据上进行扩展，我的意思是什么？我指的是你增加这里看到的n值。因此，你只需采样大量的解决方案，挑选正确的那些，并开始对所有这些进行行为克隆（BC）。结果发现，这种做法实际上并不奏效。","start":1498.97,"end":1522.07},{"id":62,"text":"So what happens is on-policy imitation learning ends up hurting generalization if you do too much of it. And to show a result for it, I'm going to show you a plot here.","zh":"所以会发生的是，如果你过度进行策略内模仿学习，它最终会损害泛化能力。为了展示这个结果，我将向你们展示一个图表。","start":1522.78,"end":1531.26},{"id":63,"text":"which is showing sort of the test performance of the same plot. But now the x-axis is the number of correct answers you get in this filtered set that I was describing to you earlier per question. So you can scale it up for how much ever you want. The size of s tilde multiplied by a constant factor is shown on the x-axis. And we are plotting the performance of the resulting RFT trained model.","zh":"这个图表展示的是相同图表的测试性能。但此时x轴是你们在之前描述的过滤集合中每题获得的正确答案数量。因此，你可以根据需要进行扩展。x轴上显示的是s~的大小乘以一个常数因子。我们正在绘制由此训练出的RFT模型的性能。","start":1531.82,"end":1556.68},{"id":64,"text":"The interesting thing to notice here is that initially, your error goes down. So as you do more and more correct solution traces, as you generate more and more of these correct solution traces, your error goes down, as you see initially. But then beyond a point, your error starts to go up in this particular setting. So you find that beyond a point, you hit diminishing returns. And there's no way you can simply generate more solutions from your policy, mimic them, and get better performance. And in fact, the error even goes up on some of these data sets that you see up here.","zh":"这里值得注意的是，最初你的误差会下降。因此，随着你进行更多的正确解决方案轨迹，随着你生成更多的这些正确解决方案轨迹，你的误差会下降，如你最初所见。但超过某个点后，你的误差在这个特定设置中开始上升。因此你会发现，超过某个点后，你开始出现边际效益递减。你无法通过仅仅生成更多来自策略的解决方案，模仿它们来获得更好的性能。事实上，在你们看到的这些数据集中，误差甚至会增加。","start":1557.36,"end":1583.54},{"id":65,"text":"You can think of it as the size of s tilde. So number of correct solutions you retain per question. So the question was, what is the x-axis? The x-axis is number of s tilde. So the plot, it's basically s tilde times 8k in the plot, because that's the number of prompts that you see up here. But yeah, it's just a constant multiplier, which stays the same for all the points on the particular plot.","zh":"你可以将其视为s~的大小。即每题保留的正确解决方案数量。所以问题是，x轴是什么？x轴是s~的数量。这个图表基本上是s~乘以8000，因为这是你们在这里看到的提示数量。但没错，它只是一个常数乘数，对于该图表上的所有点都保持不变。","start":1588.48,"end":1611.89},{"id":66,"text":"So that's a great question. So the question is, when you scale S tilde, which is for RFT, do you do deduplication? The answer is yes. And I actually removed that detail from my slide because I thought it would be too much details. But since you asked it, the answer is yes. You would often, when you do this process, you would often deduplicate S tildes.","zh":"所以这是一个非常好的问题。问题是，当你扩展S tilde（用于RFT）时，你会进行去重吗？答案是肯定的。我实际上已经从幻灯片中删除了这个细节，因为我认为这会太详细。但既然你提出了这个问题，答案是肯定的。当你进行这个过程时，你通常会去重S tilde。","start":1612.83,"end":1629.39},{"id":67,"text":"There's a lot of mechanisms for it. Peo
