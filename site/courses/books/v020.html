 or sorry, for the same base model and for 8x fewer questions, you can do similar, or you can get the same performance with RL in this setting.","start":3638.95,"end":3662.45},{"id":162,"text":"Yeah, so generally I've seen people use 0.6 as a temperature for a lot of... So the question is, what's the recommended temperature to use? I've generally found it to be 0.6 is what most people use. I don't think that there's something that's set in stone. You can always change it. The question is, what's the solid line? That's just SFT, or human-written solutions in this setting. There's no per-step advantage in that line.","start":3663.37,"end":3688.51},{"id":163,"text":"And the poor step advantage one was actually the one I showed you before. I removed it here because this is maybe the ultimate result in some ways, from human data to self-generated data of sorts. But yeah, it's like 2x with the poor step.","start":3689.41,"end":3702.97},{"id":164,"text":"Okay, so the final thing, that final main method, and then I'm going to just talk about what people are currently doing very briefly, and I'll end the lecture at that point. But the final thing we can also do here is online reinforcement learning. There's two ways of doing this. So the most basic recipe for doing this is actually to not use any of this advantage, but sort of generalize this kind of basic RFT algorithm without advantages to online RFT. So how do you do that? You can basically just take your model.","start":3705.35,"end":3731.99},{"id":165,"text":"Similar to how we sampled a bunch of traces from my current model or current policy and filtered the right ones. Rather than filtering, you can just train it with onPolicyRL.","start":3732.85,"end":3741.11}],"notes":["本段主要讨论了使用强化学习（RL）提升大语言模型（LLM）推理能力的方法，特别是通过DeepSeq V2模型和DPO算法实现的数据效率提升。与基于人类编写解决方案的SFT方法相比，可以将训练所需数据量减少8倍，从而在相同测试误差下使用更少的样本。","在讨论pass at five时，指出这是一种评估模型的方法，即给模型五次机会，判断其是否至少有一次成功。这反映了模型在多次尝试中可能获得的改进，而不仅仅是单次尝试的成功率。","在比较不同方法的效率时，提到RFT在回忆任务中提供了2倍的提升，而LAMA2在整体设置中也表现出类似的8倍提升。此外，还提到温度参数0.6是常见的选择，但并非固定，可以根据具体任务进行调整。","在讨论在线强化学习时，指出可以通过不使用优势函数，将基本的RFT算法推广到在线RFT。具体方法是直接使用当前模型或策略生成的轨迹进行训练，而不是过滤。","本段还提到，与SFT相比，使用RL可以显著提高数据效率，特别是在相同模型和数据量下，通过减少问题数量即可达到相同性能。","最后，强调了在线强化学习的两种方法，并指出其基本思路是直接使用当前模型生成的轨迹进行训练，而不是过滤，从而实现更高效的训练过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3564.23,"end":3741.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3564.23,"text":"And then DeepSeq V2 models as well as DeepSeq V2 models. And what we are finding in general is that compared to the base SFT method, where you were just training on human written solutions, you can get up to an 8x boost in the amount of data that you need for training. So the dashed line here is this first step sort of DPO algorithm that I talked about."},{"start":3584.55,"text":"And you see that it can get you the same test error with 8x fewer samples than training with SFT on human-written data. RFT was 2x for recollection. I removed that line here because it would have been too cluttered. But in general, this 8x also holds true for LAMA2 roughly overall in this setting."},{"start":3603.67,"text":"Yeah, so the question is, what is pass at five? That's a great question. So you can think of pass at five, I guess, for understanding the slide, it doesn't matter, first of all. But in general, you can think of pass at five basically as saying, if I gave the model five chances, can it succeed even once out of those five chances? So it's sort of a way people evaluate models because it's kind of telling you that, okay, maybe the model could not succeed in one try, but if I give it like five N tries, maybe it can succeed. And that's what pass at N."},{"start":3629.76,"text":"I mean, I don't think for this particular result it matters so much. The main thing to look at is this 8x kind of boost in data efficiency that you see up here."},{"start":3638.95,"text":"Okay, so the high-level takeaway here is that if you do offline RL with sort of this per-step notion of credit assignment that we talked about, you can actually get a lot more data efficiency boost compared to imitation learning. So for the same amount of data for the same base model, or sorry, for the same base model and for 8x fewer questions, you can do similar, or you can get the same performance with RL in this setting."},{"start":3663.37,"text":"Yeah, so generally I've seen people use 0.6 as a temperature for a lot of... So the question is, what's the recommended temperature to use? I've generally found it to be 0.6 is what most people use. I don't think that there's something that's set in stone. You can always change it. The question is, what's the solid line? That's just SFT, or human-written solutions in this setting. There's no per-step advantage in that line."},{"start":3689.41,"text":"And the poor step advantage one was actually the one I showed you before. I removed it here because this is maybe the ultimate result in some ways, from human data to self-generated data of sorts. But yeah, it's like 2x with the poor step."},{"start":3705.35,"text":"Okay, so the final thing, that final main method, and then I'm going to just talk about what people are currently doing very briefly, and I'll end the lecture at that point. But the final thing we can also do here is online reinforcement learning. There's two ways of doing this. So the most basic recipe for doing this is actually to not use any of this advantage, but sort of generalize this kind of basic RFT algorithm without advantages to online RFT. So how do you do that? You can basically just take your model."},{"start":3732.85,"text":"Similar to how we sampled a bunch of traces from my current model or current policy and filtered the right ones. Rather than filtering, you can just train it with onPolicyRL."}],"speech_gaps":[],"frame":"../frames/v020/022.webp","frame_time":3576.23},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":166,"text":"So you can just generate rollouts from your current policy, which might be correct or wrong. You can reward them using the reward function by just checking the answer against the answer that the model produces. You can penalize it if it does not produce an answer. You can penalize it if it violates format. There's a bunch of reward-shaping things you can do. And then you just train your policy to maximize this reward using policy gradients. So RFT, we were explicitly filtering","start":3741.47,"end":3769.93},{"id":167,"text":"and training with SFT. But rather than doing this filtering or training with SFT, you can simply run on policy reinforcement learning. Because all in this formulation is just state, action, there's an MDP, there's a reward, and just do R on top of it. So you can simply write the policy gradient equation, so that basically just looks like grad log pi times the reward that you see up here, and you can just run that on your problem.","start":3770.52,"end":3794.1},{"id":168,"text":"There's also a lot of work which now tries to kind of go beyond the basic reinforced style policy gradient and goes to sort of methods like what's called GRPO. It's nothing but just an extension of like the basic PPO algorithm in the setting. So the PPO algorithm, I guess I'm going to say a few things like PPO algorithm uses a learned value function. The GRPO algorithm replaces that learned value function or learned Q value function with simply this rollout based estimation of advantages. So the same old basic RL recipe applied on an image.","start":3795.63,"end":3824.95},{"id":169,"text":"DP that looks like the thing that you see up there. So a trajectory that looks like the thing that you see up there with a zero-one reward. Okay. And what you can also do, and this is something that finally you can do, is you can also do per-step advantages in online RL. That's kind of the final method that you can apply. So in this setting, you can take a solution from your base model, or take a solution from your current policy that you're training over the course of training. You can do these rollouts if you want to. You can use these rollouts to compute advantages.","start":3824.97,"end":3853.05},{"id":170,"text":"And rather than doing these rollouts, you can also potentially do something slightly different, which is basically to train a reward model-like thing to fit to these advantage predictions or to fit to these Q value predictions and then compute advantages.","start":3854.27,"end":3866.79},{"id":171,"text":"So this is very similar to some of the RLHF work that you probably saw, except that now this is a reward model that is rewarding every step of sorts, or a reward model that's producing the Q value for every step or the advantage for every step, as opposed to producing a reward for the whole sequence that you are seeing. And once you have these advantage predictions that you can fit to a network, you can query this particular...","start":3867.71,"end":3891.55},{"id":172,"text":"So for any rollout that your policy produces, you can query the advantage predictor that you have trained to reward every single step in this particular policy generation. And once you do that, what you can do now is you can simply take your network, produce these advantage labels, and optimize for reward that you're getting at the end, plus these advantages that you see up here.","start":3892.59,"end":3914.57}],"notes":["本段讲解了如何通过强化学习（RL）提升大语言模型（LLM）的推理能力。具体方法是通过生成轨迹（rollouts）并使用奖励函数对模型的输出进行评估，从而训练策略以最大化奖励。这包括对模型输出的正确性、格式是否符合要求等进行奖励或惩罚。此外，还提到可以使用策略梯度方法进行训练，而无需进行SFT（监督微调）或过滤。","本段进一步讨论了如何在强化学习框架中应用策略梯度方法。通过将问题建模为马尔可夫决策过程（MDP），并定义奖励函数，可以使用策略梯度公式进行训练。同时，还提到GRPO算法作为PPO算法的扩展，通过使用基于轨迹的估计来计算优势值，而不是使用学习的值函数或Q值函数。","本段介绍了如何在在线强化学习中计算每一步的优势值。这包括使用基础模型或当前策略生成轨迹，并利用这些轨迹计算优势值。此外，还提到可以训练一个奖励模型来拟合这些优势值或Q值预测，从而计算优势值。","本段强调了与RLHF（强化学习与人类反馈）工作的相似之处，但不同之处在于，现在的奖励模型不仅对整个序列进行奖励，而是对每个步骤进行奖励，包括生成Q值或优势值。这使得模型能够更细致地优化每一步的输出。","本段讨论了如何利用训练好的优势预测器来优化策略。对于每个轨迹，可以查询优势预测器以获得每一步的奖励，并结合最终的奖励进行优化。这种方法允许模型在生成过程中逐步优化输出，从而提升推理能力。","本段总结了强化学习在提升大语言模型推理能力中的应用方法，包括生成轨迹、奖励函数设计、策略梯度训练、优势值计算以及奖励模型的使用。这些方法共同构成了一个完整的强化学习框架，用于优化模型的推理性能。"],"formulas":[],"uncertainties":["GRPO算法的具体实现细节未明确说明，可能需要进一步澄清。","优势预测器的具体训练方法和网络结构未详细描述，可能需要补充信息。"],"diagram":"none","start":3741.47,"end":3914.57,"asr_flags":[],"math_clarifications":["优势值A_t的计算通常基于策略梯度方法中的估计，如使用TD误差或Q值估计，且需要明确状态值函数V(\\phi_t)的定义。此外，公式中未体现优势值的计算通常基于策略梯度方法中的估计，如使用TD误差或Q值估计。因此，该公式无法直接使用，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3741.47,"text":"So you can just generate rollouts from your current policy, which might be correct or wrong. You can reward them using the reward function by just checking the answer against the answer that the model produces. You can penalize it if it does not produce an answer. You can penalize it if it violates format. There's a bunch of reward-shaping things you can do. And then you just train your policy to maximize this reward using policy gradients. So RFT, we were explicitly filtering"},{"start":3770.52,"text":"and training with SFT. But rather than doing this filtering or training with SFT, you can simply run on policy reinforcement learning. Because all in this formulation is just state, action, there's an MDP, there's a reward, and just do R on top of it. So you can simply write the policy gradient equation, so that basically just looks like grad log pi times the reward that you see up here, and you can just run that on your problem."},{"start":3795.63,"text":"There's also a lot of work which now tries to kind of go beyond the basic reinforced style policy gradient and goes to sort of methods like what's called GRPO. It's nothing but just an extension of like the basic PPO algorithm in the setting. So the PPO algorithm, I guess I'm going to say a few things like PPO algorithm uses a learned value function. The GRPO algorithm replaces that learned value function or learned Q value function with simply this rollout based estimation of advantages. So the same old basic RL recipe applied on an image."},{"start":3824.97,"text":"DP that looks like the thing that you see up there. So a trajectory that looks like the thing that you see up there with a zero-one reward. Okay. And what you can also do, and this is something that finally you can do, is you can also do per-step advantages in online RL. That's kind of the final method that you can apply. So in this setting, you can take a solution from your base model, or take a solution from your current policy that you're training over the course of training. You can do these rollouts if you want to. You can use these rollouts to compute advantages."},{"start":3854.27,"text":"And rather than doing these rollouts, you can also potentially do something slightly different, which is basically to train a reward model-like thing to fit to these advantage predictions or to fit to these Q value predictions and then compute advantages."},{"start":3867.71,"text":"So this is very similar to some of the RLHF work that you probably saw, except that now this is a reward model that is rewarding every step of sorts, or a reward model that's producing the Q value for every step or the advantage for every step, as opposed to producing a reward for the whole sequence that you are seeing. And once you have these advantage predictions that you can fit to a network, you can query this particular..."},{"start":3892.59,"text":"So for any rollout that your policy produces, you can query the advantage predictor that you have trained to reward every single step in this particular policy generation. And once you do that, what you can do now is you can simply take your network, produce these advantage labels, and optimize for reward that you're getting at the end, plus these advantages that you see up here."}],"speech_gaps":[],"frame":"../frames/v020/023.webp","frame_time":3753.47},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":173,"text":"Yeah, so the question is, how generalizable is reasoning? When you train on math, does it improve on GSM8K? So it turns out if you train on math, it does not improve on GSM8K, and many people have shown it. But if you train on a bunch of mixture of prompts, which are of varied levels of difficulty, you can actually get there. So this is precisely the recipe which has been used in, or not this one, but the basic online RL recipe which I talked to you about earlier, used to train all of these, or many of these thinking models which have open","start":3916.4,"end":3944.52},{"id":174,"text":"recipe descriptions so this online rm recipe is kind of used to train the deep sea carbon model for instance and that kind of does generalize to a fairly good amount of extent it doesn't also generalize to a large to every single problem out there but to a fairly good extent it does","start":3945.9,"end":3958.22},{"id":175,"text":"So you can compute these advantage predictions. You can fit them to a network, use them to produce these rewards for every single step. And that's sort of the more advanced way of doing online RL with this particular thing. So we had a work that we call process advantage verifiers here. Process because it's rewarding every step. Advantage because it's fitting an advantage function. And a verifier because somehow in the domain of reasoning, reward models are referred to often as verifiers.","start":3959.2,"end":3985.3},{"id":176,"text":"So if you see that word come up, it's just synonymous to a reward model of sorts. Or in this particular case, even you can think of it as a Q function or a value function of sorts. But that's kind of the name of the method. And we find that in general. So I'm going to skip some of these details. But in general, if you do...","start":3985.92,"end":4001.98},{"id":177,"text":"dense reward RL, like process reward or advantage-based reward RL, you find that you can kind of get to a much better accuracy compared to sort of what's called ORM RL or just 0-1 reward RL, like the sparse 0-1 reward provided at the end of the trajectory. So this is sort of the basic recipe that a lot of the current work is using. This is sort of the advantage-based verifier's recipe. And you can kind of see that you can get a bigger boost in sample efficiency as well as in terms of just absolute performance that you see up here. Also, these numbers kind of","start":4002.88,"end":4032.1},{"id":178,"text":"look small, but with 2B and 9B models that we were basing this off of, apparently this is sort of the best result that you can get on certain data sets that we tried this on. So it's about 5 to 6x sample efficiency boost and about 6 to 7% absolute performance improvement in this particular setting with the 10 set advantages somewhere. Okay.","start":4032.18,"end":4054.2},{"id":179,"text":"Okay, I'm going to skip some of these things. But at a high level, we are also seeing now these newer thinking models that have come up, where basically these models can just think for longer and produce a better answer. This is sort of the DeepSeq R1 family of models, the OpenAI O1 family of models, or O-series of models from OpenAI. In my opinion, really these are trained using very similar...","start":4055.28,"end":4078.42},{"id":180,"text":"recipes that I just talked to you about for this whole lecture. Except that there are some small changes that happen in this process from pre-these-models-error versus these models.","start":4078.83,"end":4089.41}],"notes":["本段讨论了强化学习在大语言模型推理中的应用，特别是如何通过训练混合难度的提示来提升模型的泛化能力。讲者指出，仅在数学任务上训练并不能显著提升模型在GSM8K数据集上的表现，但通过混合不同难度的提示，可以实现更好的泛化效果。","讲者提到，这种训练方法与在线强化学习（online RL）的配方类似，用于训练如深海碳模型等模型。虽然这种方法在一定程度上可以泛化，但并不能解决所有问题。","在强化学习中，计算优势预测并将其拟合到网络中，可以为每个步骤生成奖励。这种方法被称为过程优势验证器（process advantage verifiers），其中“过程”指的是每一步都给予奖励，“优势”指的是拟合优势函数，“验证器”则是因为在推理领域，奖励模型常被称为验证器。","讲者指出，优势验证器方法在密集奖励强化学习（dense reward RL）中表现优于稀疏奖励（如0-1奖励）的方法。这种方法在样本效率和绝对性能上都有显著提升，例如在2B和9B模型上，样本效率提升了5到6倍，性能提升了6到7%。","讲者提到，当前的许多推理模型，如DeepSeq R1、OpenAI的O1系列模型，都是基于类似的训练配方，但与之前的模型相比，有一些小的改进。","讲者强调，这些模型能够进行更长时间的推理并生成更好的答案，这表明强化学习方法在提升大语言模型推理能力方面具有重要价值。"],"formulas":[],"uncertainties":["recipe descriptions so this online rm recipe is kind of used to train the deep sea carbon model for instance and that kind of does generalize to a fairly good amount of extent it doesn't also generalize to a large to every single problem out there but to a fairly good extent it does"],"diagram":"none","start":3916.4,"end":4089.41,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3916.4,"text":"Yeah, so the question is, how generalizable is reasoning? When you train on math, does it improve on GSM8K? So it turns out if you train on math, it does not improve on GSM8K, and many people have shown it. But if you train on a bunch of mixture of prompts, which are of varied levels of difficulty, you can actually get there. So this is precisely the recipe which has been used in, or not this one, but the basic online RL recipe which I talked to you about earlier, used to train all of these, or many of these thinking models which have open"},{"start":3945.9,"text":"recipe descriptions so this online rm recipe is kind of used to train the deep sea carbon model for instance and that kind of does generalize to a fairly good amount of extent it doesn't also generalize to a large to every single problem out there but to a fairly good extent it does"},{"start":3959.2,"text":"So you can compute these advantage predictions. You can fit them to a network, use them to produce these rewards for every single step. And that's sort of the more advanced way of doing online RL with this particular thing. So we had a work that we call process advantage verifiers here. Process because it's rewarding every step. Advantage because it's fitting an advantage function. And a verifier because somehow in the domain of reasoning, reward models are referred to often as verifiers."},{"start":3985.92,"text":"So if you see that word come up, it's just synonymous to a reward model of sorts. Or in this particular case, even you can think of it as a Q function or a value function of sorts. But that's kind of the name of the method. And we find that in general. So I'm going to skip some of these details. But in general, if you do..."},{"start":4002.88,"text":"dense reward RL, like process reward or advantage-based reward RL, you find that you can kind of get to a much better accuracy compared to sort of what's called ORM RL or just 0-1 reward RL, like the sparse 0-1 reward provided at the end of the trajectory. So this is sort of the basic recipe that a lot of the current work is using. This is sort of the advantage-based verifier's recipe. And you can kind of see that you can get a bigger boost in sample efficiency as well as in terms of just absolute performance that you see up here. Also, these numbers kind of"},{"start":4032.18,"text":"look small, but with 2B and 9B models that we were basing this off of, apparently this is sort of the best result that you can get on certain data sets that we tried this on. So it's about 5 to 6x sample efficiency boost and about 6 to 7% absolute performance improvement in this particular setting with the 10 set advantages somewhere. Okay."},{"start":4055.28,"text":"Okay, I'm going to skip some of these things. But at a high level, we are also seeing now these newer thinking models that have come up, where basically these models can just think for longer and produce a better answer. This is sort of the DeepSeq R1 family of models, the OpenAI O1 family of models, or O-series of models from OpenAI. In my opinion, really these are trained using very similar..."},{"start":4078.83,"text":"recipes that I just talked to you about for this whole lecture. Except that there are some small changes that happen in this process from pre-these-models-error versus these models."}],"speech_gaps":[],"frame":"../frames/v020/024.webp","frame_time":3928.4},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":181,"text":"So the RL training objective has remained the same. So there's some minor details, like there's this new method called GRPO, which I'm just describing. It's basically PPO with some tweaks. There's also some other methods like advantage-induced policy alignment. You don't need to know what those methods are. Just think of them roughly as policy gradient methods done with slight tweaks overall.","start":4090.38,"end":4109.76},{"id":182,"text":"But what has changed is that the action space in a way has changed for these models, in my opinion. Now, this is a very kind of crude statement to make. And to be really rigorous about it, I think the statement sounds wrong because these models do actually produce token by token, one at a time. But these models, the base models on which we are doing RL, have become better at being able to kind of implement interesting kind of meta procedures. Like, you know, these models can actually produce a solution, maybe go out there and then try to verify the solution they have produced.","start":4110.64,"end":4139.74},{"id":183,"text":"maybe then backtrack to a particular point and do something else from there. And you can think of this as just yet another version of defining the step. These models can produce more interesting steps than just going out there and calculating yet another quantity like the models previously could have done. So it's just a better notion of a step or a better action that these models can sample when you run all of these algorithms on top of them.","start":4140.08,"end":4161.76},{"id":184,"text":"And once you do that and you give these models a longer budget to act, so if you tell these models that, okay, there's no limit on how many tokens you can think, you can sample during the course of RL, you can maybe sample solutions which are really, really long, but just get me the right answer. If I give these models that playground to kind of sample more and more tokens, turns out that RL training algorithms with these two bullet points actually give you much better performance. And that's kind of what we see with these current thinking models right now.","start":4162.59,"end":4190.77},{"id":185,"text":"Turns out that if you do a counterfactual experiment where you take models which are not capable of implementing basic answer checking or verification or generating a better answer, turns out that you cannot do good RL with them right now. So really nothing has changed in terms of the high-level techniques that I talked about, except that the base models have become more interesting in a way that they can sample interesting kinds of steps to train on.","start":4191.72,"end":4220.56},{"id":186,"text":"And that has led to some of the most amazing results that we are seeing right now.","start":4221.0,"end":4223.82}],"notes":["本段讨论了强化学习（RL）在大语言模型（LLM）推理中的应用，强调了模型在行动空间上的变化。虽然模型仍然按token生成，但基础模型现在能够执行更复杂的元过程，如生成解决方案并验证其正确性。","讲者指出，模型现在可以回溯到特定点并采取不同的行动，这被视为对‘步骤’概念的改进。这种改进使得模型在执行RL算法时能够生成更丰富的动作。","当给予模型更长的思考预算时，即允许模型生成更多token，RL训练算法表现出更好的性能。这表明模型在生成更长、更复杂的解决方案方面具有潜力。","讲者提到，如果模型无法执行基本的验证或生成更优答案，那么当前的RL方法可能无法有效训练这些模型。这说明模型的改进是实现更好RL性能的关键。","尽管高层技术没有变化，但基础模型的改进使得它们能够生成更有趣的训练步骤，从而推动了当前最令人惊叹的结果。","这些结果表明，模型在推理能力上的提升对强化学习的应用具有重要意义，尤其是在需要复杂验证和生成任务的场景中。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4090.38,"end":4223.82,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4090.38,"text":"So the RL training objective has remained the same. So there's some minor details, like there's this new method called GRPO, which I'm just describing. It's basically PPO with some tweaks. There's also some other methods like advantage-induced policy alignment. You don't need to know what those methods are. Just think of them roughly as policy gradient methods done with slight tweaks overall."},{"start":4110.64,"text":"But what has changed is that the action space in a way has changed for these models, in my opinion. Now, this is a very kind of crude statement to make. And to be really rigorous about it, I think the statement sounds wrong because these models do actually produce token by token, one at a time. But these models, the base models on which we are doing RL, have become better at being able to kind of implement interesting kind of meta procedures. Like, you know, these models can actually produce a solution, maybe go out there and then try to verify the solution they have produced."},{"start":4140.08,"text":"maybe then backtrack to a particular point and do something else from there. And you can think of this as just yet another version of defining the step. These models can produce more interesting steps than just going out there and calculating yet another quantity like the models previously could have done. So it's just a better notion of a step or a better action that these models can sample when you run all of these algorithms on top of them."},{"start":4162.59,"text":"And once you do that and you give these models a longer budget to act, so if you tell these models that, okay, there's no limit on how many tokens you can think, you can sample during the course of RL, you can maybe sample solutions which are really, really long, but just get me the right answer. If I give these models that playground to kind of sample more and more tokens, turns out that RL training algorithms with these two bullet points actually give you much better performance. And that's kind of what we see with these current thinking models right now."},{"start":4191.72,"text":"Turns out that if you do a counterfactual experiment where you take models which are not capable of implementing basic answer checking or verification or generating a better answer, turns out that you cannot do good RL with them right now. So really nothing has changed in terms of the high-level techniques that I talked about, except that the base models have become more interesting in a way that they can sample interesting kinds of steps to train on."},{"start":4221.0,"text":"And that has led to some of the most amazing results that we are seeing right now."}],"speech_gaps":[],"frame":"../frames/v020/025.webp","frame_time":4102.38}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
