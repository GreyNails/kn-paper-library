个推理路径的结构。","讲者进一步说明，DPO方法通过构建偏好对（preference pair）来训练模型。偏好对由共享前缀和后续步骤组成，其中一部分步骤是正确的，另一部分是错误的。这种方法能够更全面地捕捉模型推理过程中的差异。","在构建偏好对时，讲者提到可以使用成功和失败的rollout来生成数据。成功rollout的后续步骤被保留，而失败rollout的后续步骤则被用来与成功步骤进行对比，从而形成训练数据。","讲者还指出，DPO方法的一个关键点是保留所有步骤，而不仅仅是用于计算优势的步骤。这表明DPO方法在训练过程中更注重整个推理路径的完整性，而不仅仅是局部优势。","此外，讲者提到DPO方法与之前通过优势过滤步骤的方式不同，这表明DPO方法在处理推理路径时采用了不同的策略，可能更适用于复杂或长序列的推理任务。","最后，讲者提到DPO损失函数可能不需要在幻灯片上展示，这表明DPO方法的实现细节可能较为复杂，或者讲者认为在当前的讲解中不需要深入讨论损失函数的具体形式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3054.12,"end":3229.97,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3054.12,"text":"The next thing, okay, before that, I can show you some results here. So this actually ended up addressing that error going up problem, at least to the extent that we were able to train models. So, you know, here, again, I'm plotting number of correct answers per question, and you'll find that the advantage filtering did help you compared to sort of the RFT approach, which was going up before."},{"start":3076.6,"text":"And we did measure the number of spurious steps according to some heuristic definition of how we can evaluate this, like how we can probe this. And it seemed like, just from a qualitative perspective also, the number of spurious steps actually kind of reduced in some way. Okay, so the next thing is, how can you use this for offline reinforcement learning? And this is where sort of DPO-based methods come in. So there was a question about this earlier in the class. So you can also use the same principle for doing DPO, actually."},{"start":3106.04,"text":"So the idea in DPO is sort of slightly different from computing this advantage exactly, but uses the same protocol that I described to you earlier, where what you're going to do now is you're going to take a solution from your base model that you're training. Maybe this is incorrect. And so far, what we did was we found out steps that were useful and retained them in some way or the other and discarded everything else. But what we can do now is we can do these rollouts. And rather than sort of throwing away"},{"start":3132.86,"text":"or throwing away these rollouts or just using these rollouts to estimate the advantage, what I can do is I can instead take a rollout which ended up succeeding with a shared prefix, take the solution trace from my model which did not end up succeeding, and construct a preference pair out of them. So I now have a preference pair which looks like some prefix followed by some correction, which is good, and some prefix followed by some steps which are actually wrong."},{"start":3161.03,"text":"and I can throw this into a DPO training dataset. I can also do the same thing with a correct rollout. So if let's say I have a correct rollout from my base model, I can still do these rollouts, and maybe one of them will not end up succeeding, potentially, from my rollout policy, and I can basically put this thing as a preference pair into my training mix."},{"start":3183.81,"text":"So the nice thing that is happening, or there are two differences that are happening here, right? In some way, I'm still realizing in this process that prefixes are shared. And really the difference between, you know, correct and incorrect rollout comes from that little segment that you see, you know, beyond the prefix in the settings. That's the first thing. And the second thing is, you know, rather than the previous approach of filtering by advantages, I'm actually retaining the whole steps that appear in this rollout distribution."},{"start":3211.07,"text":"So I'm not simply using these rollouts like the orange colored dashed lines to compute advantages, but I'm retaining them and I'm training on top of the tokens that appear in that rollout as well."},{"start":3222.77,"text":"So the DPO loss, I guess I don't have that on my slides, but I guess probably I don't need to necessarily write that down."}],"speech_gaps":[],"frame":"../frames/v020/019.webp","frame_time":3066.12},{"title":"强化学习中RL与大语言模型推理的结合","segments":[{"id":137,"text":"But it's basically just a matter of the same old DPO loss on top of these two segments of solutions that we talked about.","zh":"但基本上这只是在我们之前讨论的这两个解决方案段上应用同样的旧的DPO损失函数的问题。","start":3230.07,"end":3238.27},{"id":138,"text":"yeah great question the question is do you want high quality text or do you want","zh":"是的，很好的问题，问题是你是想要高质量的文本，还是想要","start":3239.11,"end":3243.23},{"id":139,"text":"sort of more diversity um i think the the true uh so uh okay so uh i should mention that like","zh":"某种程度上的更多多样性，嗯，我想真正的情况是，嗯，好的，所以嗯，我应该提到的是，像","start":3243.23,"end":3250.55},{"id":140,"text":"this is something that we have tried to formalize so there's like an exact equation that you can","zh":"我们已经尝试将这一点形式化，所以存在一个精确的方程，你可以","start":3250.55,"end":3254.95},{"id":141,"text":"you can write down and you can be like okay i want a policy to do these rollouts which","zh":"写下并可以说，嗯，我想要一个策略来执行这些 rollout，它","start":3254.95,"end":3258.91},{"id":142,"text":"maximizes this expression um sort of thing in one of the papers um i think that kind of balances","zh":"最大化这个表达式，嗯，某种方式，在其中一篇论文中，嗯，我想这种做法在某种程度上平衡了","start":3259.55,"end":3265.81},{"id":143,"text":"differences in some way, diversity and high quality.","zh":"多样性与高质量之间的差异。","start":3265.81,"end":3268.41},{"id":144,"text":"So imagine for a second that your model is really bad.","zh":"想象一下，如果你的模型真的很差。","start":3268.71,"end":3271.55},{"id":145,"text":"So let's say your model mostly produces incorrect.","zh":"所以假设你的模型大部分都产生错误。","start":3271.69,"end":3274.37},{"id":146,"text":"then you want a rollout policy that can actually somewhat succeed because otherwise there's no notion of a success that you can learn from ever, right? You've only seen failures. How can you actually even learn to solve that problem if you only see failures? On the other hand, let's say if your model is kind of decent, like 50% accurate, but it's not as good overall, like it's not the best at solving problems. In that case, maybe all you want is just diverse ways of solving the problem such that you can see what ways you're more prone to failing. So you care about sort of coverage in some ways. So really the answer here is like every,","zh":"那么你想要一个 rollout 策略，它实际上能够某种程度上成功，否则你就没有任何可以学习的成功概念，对吧？你只看到了失败。你怎么可能从只看到失败中学习到解决这个问题的方法呢？另一方面，假设你的模型还算不错，比如准确率是 50%，但它整体上并不是最好的解决问题的模型。在这种情况下，也许你只需要多样化的解决问题的方法，这样你就能看到哪些方法更容易导致失败。因此你在某种程度上关心的是覆盖范围。所以真正答案是，每个强化学习问题中，你都想要在探索和利用之间取得某种平衡，这包括高质量的文本或高质量的解决方案，能够正确回答问题，同时在某种程度上更加多样化。我认为这个平衡的精确表达式其实也可以写出来，但我今天不会讲解，但这就是它们之间的直接关系。","start":3275.37,"end":3304.63},{"id":147,"text":"single problem in RL, there is some balance between exploration and exploitation you kind of want to do, which is high-quality text or high-quality solutions which solve the question correctly and being more diverse in some way. I think the exact expression for this is actually something you can also write down, and I'm not going to cover today, but yeah, it's straight up between them.","zh":"是的，所以他们基本上是用来训练 DPU 的。所以，你明白的，到目前为止，我想我应该为所有人写下这个算法。所以你所做的就是，基本上这就是 RFT 算法。现在我们要做的就是做同样的过程。因此，在迭代 1 到 T 中，我会从当前策略中采样 Y1 到 YN。","start":3304.75,"end":3324.73},{"id":148,"text":"Yeah, so they basically used to train DPU. So, you know, like so far, I guess, okay, actually, let me just write that algorithm down for everybody's understanding. So what you do is you're basically, so that is the RFT algorithm. And now what we are going to do is we are going to simply do the same process. So for iteration in 1 to T, I'm going to, you know, sample Y1 to N from my current policy.","zh":"是的，所以他们基本上是用来训练DPU的。所以，你知道的，到目前为止，我想让大家更清楚，我来把那个算法写下来。所以你所做的就是，这就是RFT算法。现在我们要做的就是做同样的过程。所以在1到T次迭代中，我会从当前策略中采样Y1到YN。","start":3325.61,"end":3353.72},{"id":149,"text":"given any question. I am going to now do these rollouts. So I'm going to do rollouts and construct the preference data set depref. In this case, it's basically those preferences. And now what I'm going to do is I'm going to run or minimize DPO loss. That's kind of the main algorithm that you're going to do. And the depref consists of prefixes generated from your current base model.","zh":"而轨迹的一部分来自于它的一部分，来自于你正在训练的同一模型 pi theta。另一部分偏好对来自于 rollout 策略。这就是橙色线。","start":3355.46,"end":3390.79},{"id":150,"text":"and the trace is coming from one part of it is from the same model that you are training, pi theta. The other segment, the other part of the preference pair comes from the rollout policy. That's the orange line.","zh":"而轨迹的一部分来自于你正在训练的同一个模型pi theta。另一部分偏好对来自于rollout策略。那是橙色的线。","start":3391.26,"end":3401.84}],"notes":["本段讨论了在强化学习中如何平衡高质量文本与多样性的问题。讲者指出，当模型表现较差时，需要一个能够成功执行的rollout策略，否则无法从失败中学习。当模型表现中等时，更关注多样性的解决方案，以发现模型容易失败的方式。这与强化学习中的探索与利用（exploration and exploitation）概念相呼应，即在追求高质量解决方案的同时，也要考虑多样性。","讲者提到，这种平衡可以通过一个具体的表达式来形式化，但并未在本段详细展开。这表明在实际应用中，需要根据具体问题来设计相应的策略，以实现高质量与多样性的平衡。","在构建偏好数据集（depref）时，讲者提到该数据集由当前基础模型生成的前缀和rollout策略生成的轨迹组成。这表明在训练过程中，需要将模型的输出与rollout策略的输出进行比较，以形成偏好数据。","讲者还提到，DPO损失函数是训练过程中的核心算法，通过最小化该损失函数来优化模型性能。这表明DPO损失函数在强化学习与大语言模型推理的结合中起着关键作用。","讲者提到，rollout策略的轨迹来自当前训练的模型（pi theta）和rollout策略本身。这表明在训练过程中，需要将模型的输出与rollout策略的输出进行比较，以形成偏好数据。","最后，讲者提到，整个过程与DPO算法类似，但具体实现细节未在本段展开。这表明在实际应用中，需要根据具体问题来设计相应的训练流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3230.07,"end":3401.84,"asr_flags":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":3230.07,"text":"But it's basically just a matter of the same old DPO loss on top of these two segments of solutions that we talked about."},{"start":3239.11,"text":"yeah great question the question is do you want high quality text or do you want"},{"start":3243.23,"text":"sort of more diversity um i think the the true uh so uh okay so uh i should mention that like"},{"start":3250.55,"text":"this is something that we have tried to formalize so there's like an exact equation that you can"},{"start":3254.95,"text":"you can write down and you can be like okay i want a policy to do these rollouts which"},{"start":3259.55,"text":"maximizes this expression um sort of thing in one of the papers um i think that kind of balances"},{"start":3265.81,"text":"differences in some way, diversity and high quality."},{"start":3268.71,"text":"So imagine for a second that your model is really bad."},{"start":3271.69,"text":"So let's say your model mostly produces incorrect."},{"start":3275.37,"text":"then you want a rollout policy that can actually somewhat succeed because otherwise there's no notion of a success that you can learn from ever, right? You've only seen failures. How can you actually even learn to solve that problem if you only see failures? On the other hand, let's say if your model is kind of decent, like 50% accurate, but it's not as good overall, like it's not the best at solving problems. In that case, maybe all you want is just diverse ways of solving the problem such that you can see what ways you're more prone to failing. So you care about sort of coverage in some ways. So really the answer here is like every,"},{"start":3304.75,"text":"single problem in RL, there is some balance between exploration and exploitation you kind of want to do, which is high-quality text or high-quality solutions which solve the question correctly and being more diverse in some way. I think the exact expression for this is actually something you can also write down, and I'm not going to cover today, but yeah, it's straight up between them."},{"start":3325.61,"text":"Yeah, so they basically used to train DPU. So, you know, like so far, I guess, okay, actually, let me just write that algorithm down for everybody's understanding. So what you do is you're basically, so that is the RFT algorithm. And now what we are going to do is we are going to simply do the same process. So for iteration in 1 to T, I'm going to, you know, sample Y1 to N from my current policy."},{"start":3355.46,"text":"given any question. I am going to now do these rollouts. So I'm going to do rollouts and construct the preference data set depref. In this case, it's basically those preferences. And now what I'm going to do is I'm going to run or minimize DPO loss. That's kind of the main algorithm that you're going to do. And the depref consists of prefixes generated from your current base model."},{"start":3391.26,"text":"and the trace is coming from one part of it is from the same model that you are training, pi theta. The other segment, the other part of the preference pair comes from the rollout policy. That's the orange line."}],"speech_gaps":[],"frame":"../frames/v020/020.webp","frame_time":3242.07},{"title":"如何将回答分割为步骤","segments":[{"id":151,"text":"So the question is, given a sample trajectory, how do we segment into steps? So in this work, we just used sentences. So we just said, well, sentences, we're going to break them down into steps from after every sentence. In general, I think it depends. It's a thing that you can bake into your model. So if you have played with, for example, open AI models, you'll see that they often produce responses that look like, you know, step one in sort of markdown, like a very big step one, and then they'll say a bunch of stuff, and then step two, and they'll say a bunch of stuff. So you can use that sort of notation.","zh":"那么问题是，给定一个样本轨迹，我们如何将其分割为步骤？在这项工作中，我们只是使用了句子。我们只是说，句子，我们要从每个句子之后将其分解为步骤。一般来说，我认为这取决于具体情况。这是你可以融入模型中的一个方面。例如，如果你使用过像Open AI的模型，你会发现它们经常生成看起来像markdown格式的步骤，比如一个非常大的步骤一，然后说一堆内容，接着是步骤二，再说一堆内容。你可以使用这种类型的标记。","start":3402.7,"end":3431.72},{"id":152,"text":"Oftentimes, it's so happening that as these models kind of get better at basic instruction following, you can just prompt them to produce responses for complex questions in a particular stylistic fashion and use some heuristics about that style to partition things into steps. So, for instance, you can just tell a model, well, I want an answer for this particular question that never uses the word step, that always produces a logical block of calculation, puts a horizontal","zh":"通常情况下，随着这些模型在遵循基本指令方面变得越来越好，你只需提示它们以特定的风格生成复杂问题的回答，并利用对该风格的一些启发式方法来将内容分割为步骤。例如，你可以告诉模型，我希望针对这个问题的回答从不使用“步骤”这个词，总是生成一个逻辑计算块，画一条水平线，然后推下一个逻辑计算块，依此类推。它很可能为你完成这个任务，这也是你可以在训练过程中进行的操作。你可以只需提示它们以某种方式生成解决方案，然后相应地定义步骤。没有普遍的定义。因此问题是，是否存在一种惯例来生成用于生成步骤的特殊标记？","start":3432.24,"end":3461.3},{"id":153,"text":"a line and then pushes the next logical block and so on. And it will most likely do it for you, which is something you can also do during the course of training. So you can just prompt them to kind of produce solutions in a particular way and then define steps accordingly. There's no universal definition. So the question is, is there a convention to produce special tokens for generating steps?","zh":"我认为我没有看到一个非常明确且普遍使用的惯例。我们使用过的一种惯例，我看到许多其他论文也使用过，但它们仍然是少数，是它们会生成类似步骤哈希一冒号然后说一些内容。这也可以是多行。在这项工作中，我们使用了行。在后续的工作中，我们使用了这种步骤的概念。因此，这真的取决于你，我认为。","start":3461.45,"end":3477.46},{"id":154,"text":"I think that I've not seen a very, very clear convention that is universally used all the time. One convention that we have been using that I've seen many other papers use, but they're still outliers for this, is they would produce like step hash one colon and then say something. And that could be a bunch of lines as well. In this work, we used lines. In a follow-up thing, we had used this step notion. So it really depends on up to you, really, I think.","zh":"我认为我没有看到一个非常明确且普遍使用的惯例。我们使用过的一种惯例，我看到许多其他论文也使用过，但它们仍然是少数，是它们会生成类似步骤哈希一冒号然后说一些内容。这也可以是多行。在这项工作中，我们使用了行。在后续的工作中，我们使用了这种步骤的概念。因此，这真的取决于你，我认为。","start":3478.78,"end":3502.94},{"id":155,"text":"Okay, cool. Any questions on the DPO part in this case? So this is the DPO version of the algorithm. Great, okay. So you can do this and put this into your data. So if you go back to our plot from before, if you measure how well does such kind of an offline RL method do, what ends up happening is, okay, I guess these were supposed to be GIFs, but anyways. So I'm now plotting the test error as a function of number of questions that,","zh":"好的，不错。这个案例中有关DPO部分有任何问题吗？所以这是该算法的DPO版本。很好，好的。你可以这样做，并将它应用到你的数据中。如果你回到我们之前的图表，如果你测量这种离线强化学习方法表现如何，结果会是，嗯，我想这些本应是GIF，但不管怎样。我现在正在绘制测试误差作为问题数量的函数，","start":3505.21,"end":3537.23},{"id":156,"text":"existed in my data set. So far, we were looking at number of correct answers per question for a lot of the plots in the middle. But now I'm back to the plot where we are plotting the x-axis as a function of number of questions in the original data set. And you find that compared to, and now there are two models here. One of them is like a LAMA2 model. So this probably tells you how old this work is at this point. It's a year old, but LAMA2 feels like a long time ago.","zh":"存在于我的数据集中。到目前为止，我们一直在查看许多中间图表中每个问题的正确答案数量。但现在我又回到了一个图表，其中x轴是原始数据集中问题的数量。你会发现，与之相比，这里有两个模型。其中一个模型是LAMA2模型。这可能告诉你这项工作的年代，它已经有一年了，但LAMA2感觉像是很久以前的事了。","start":3538.02,"end":3563.18}],"notes":["本段讨论了如何将模型的回答分割为步骤，指出这取决于模型的输出风格。例如，一些模型会以Markdown格式输出步骤，如'步骤一'、'步骤二'等。此外，也可以通过提示模型以特定方式生成答案，如避免使用'步骤'一词，而是以逻辑块的形式呈现，通过水平线分隔。这种方法可以在训练过程中实现。","讲者提到没有统一的定义来生成步骤，但存在一些惯例，如使用特殊标记（如'step #1:'）来表示步骤。这些惯例在不同论文中有所应用，但并非普遍采用。因此，如何分割步骤取决于具体任务和模型的输出风格。","在讨论DPO算法时，讲者提到可以将这种分割方法应用于数据中，并通过图表展示其效果。图表显示了测试误差随问题数量的变化，这有助于评估离线强化学习方法的性能。","讲者还提到，LAMA2模型的使用表明该工作已有约一年的历史，这反映了该领域的发展速度。通过比较不同模型的性能，可以评估不同方法的有效性。","讲者强调，分割步骤的方法并非固定，而是可以根据具体任务和模型的输出风格进行调整。因此，选择合适的分割方法是实现有效推理的关键。","最后，讲者询问了关于DPO部分的问题，表明该部分是课程的重点之一。通过讨论不同模型的性能，可以进一步理解强化学习在提升大语言模型推理中的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3402.7,"end":3563.18,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3402.7,"text":"So the question is, given a sample trajectory, how do we segment into steps? So in this work, we just used sentences. So we just said, well, sentences, we're going to break them down into steps from after every sentence. In general, I think it depends. It's a thing that you can bake into your model. So if you have played with, for example, open AI models, you'll see that they often produce responses that look like, you know, step one in sort of markdown, like a very big step one, and then they'll say a bunch of stuff, and then step two, and they'll say a bunch of stuff. So you can use that sort of notation."},{"start":3432.24,"text":"Oftentimes, it's so happening that as these models kind of get better at basic instruction following, you can just prompt them to produce responses for complex questions in a particular stylistic fashion and use some heuristics about that style to partition things into steps. So, for instance, you can just tell a model, well, I want an answer for this particular question that never uses the word step, that always produces a logical block of calculation, puts a horizontal"},{"start":3461.45,"text":"a line and then pushes the next logical block and so on. And it will most likely do it for you, which is something you can also do during the course of training. So you can just prompt them to kind of produce solutions in a particular way and then define steps accordingly. There's no universal definition. So the question is, is there a convention to produce special tokens for generating steps?"},{"start":3478.78,"text":"I think that I've not seen a very, very clear convention that is universally used all the time. One convention that we have been using that I've seen many other papers use, but they're still outliers for this, is they would produce like step hash one colon and then say something. And that could be a bunch of lines as well. In this work, we used lines. In a follow-up thing, we had used this step notion. So it really depends on up to you, really, I think."},{"start":3505.21,"text":"Okay, cool. Any questions on the DPO part in this case? So this is the DPO version of the algorithm. Great, okay. So you can do this and put this into your data. So if you go back to our plot from before, if you measure how well does such kind of an offline RL method do, what ends up happening is, okay, I guess these were supposed to be GIFs, but anyways. So I'm now plotting the test error as a function of number of questions that,"},{"start":3538.02,"text":"existed in my data set. So far, we were looking at number of correct answers per question for a lot of the plots in the middle. But now I'm back to the plot where we are plotting the x-axis as a function of number of questions in the original data set. And you find that compared to, and now there are two models here. One of them is like a LAMA2 model. So this probably tells you how old this work is at this point. It's a year old, but LAMA2 feels like a long time ago."}],"speech_gaps":[],"frame":"../frames/v020/021.webp","frame_time":3414.7},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":157,"text":"And then DeepSeq V2 models as well as DeepSeq V2 models. And what we are finding in general is that compared to the base SFT method, where you were just training on human written solutions, you can get up to an 8x boost in the amount of data that you need for training. So the dashed line here is this first step sort of DPO algorithm that I talked about.","zh":"然后还有 DeepSeq V2 模型以及 DeepSeq V2 模型。我们发现的一般情况是，与仅在人类编写解决方案上进行训练的基线 SFT 方法相比，你可以获得最多 8 倍的数据量提升，用于训练。这里虚线表示我之前提到的这种第一阶段的 DPO 算法。","start":3564.23,"end":3583.95},{"id":158,"text":"And you see that it can get you the same test error with 8x fewer samples than training with SFT on human-written data. RFT was 2x for recollection. I removed that line here because it would have been too cluttered. But in general, this 8x also holds true for LAMA2 roughly overall in this setting.","zh":"你可以看到，它可以在比使用人类编写数据进行 SFT 训练少 8 倍的样本数量下达到相同的测试误差。RFT 在回忆任务上是 2 倍的提升。我在这里移除了那条线，因为它会显得过于拥挤。但总体而言，在这种设置下，LAMA2 也大致保持了 8 倍的提升。","start":3584.55,"end":3602.69},{"id":159,"text":"Yeah, so the question is, what is pass at five? That's a great question. So you can think of pass at five, I guess, for understanding the slide, it doesn't matter, first of all. But in general, you can think of pass at five basically as saying, if I gave the model five chances, can it succeed even once out of those five chances? So it's sort of a way people evaluate models because it's kind of telling you that, okay, maybe the model could not succeed in one try, but if I give it like five N tries, maybe it can succeed. And that's what pass at N.","zh":"是的，问题是，什么是 pass at five？这是一个很好的问题。你可以认为，对于理解幻灯片来说，这并不重要，首先。但一般来说，你可以将 pass at five 看作是：如果我给模型五次机会，它能否在五次中至少成功一次？这是一种人们评估模型的方式，因为它告诉你，也许模型在一次尝试中无法成功，但如果我给它五次尝试，它可能就能成功。这就是 pass at N 的意思。","start":3603.67,"end":3628.49},{"id":160,"text":"I mean, I don't think for this particular result it matters so much. The main thing to look at is this 8x kind of boost in data efficiency that you see up here.","zh":"我的意思是，我认为对于这个特定的结果来说，这并不那么重要。主要要看的是这里看到的 8 倍的数据效率提升。","start":3629.76,"end":3637.34},{"id":161,"text":"Okay, so the high-level takeaway here is that if you do offline RL with sort of this per-step notion of credit assignment that we talked about, you can actually get a lot more data efficiency boost compared to imitation learning. So for the same amount of data for the same base model, or sorry, for the same base model and for 8x fewer questions, you can do similar, or you can get the same performance with RL in this setting.","zh":"好的，这里的总体结论是，如果你使用这种我们讨论过的每一步的信用分配概念来进行离线强化学习，你实际上可以比模仿学习获得更多的数据效率提升。因此，对于相同的基础模型和 8 倍更少的问题数量，你可以达到相似的性能，或者在这一设置下通过强化学习获得相同的性能。","start":3638.95,"end":3662.45},{"id":162,"text":"Yeah, so generally I've seen people use 0.6 as a temperature for a lot of... So the question is, what's the recommended temperature to use? I've generally found it to be 0.6 is what most people use. I don't think that there's something that's set in stone. You can always change it. The question is, what's the solid line? That's just SFT, or human-written solutions in this setting. There's no per-step advantage in that line.","zh":"是的，一般来说，我看到人们使用0.6作为温度参数，用于很多情况。问题是，推荐使用什么温度参数？我通常发现大多数人使用的是0.6。我认为并没有什么固定不变的标准。你总是可以调整它。问题是，什么是这条实线？这仅仅是SFT，或者在这个情境下的人工撰写解决方案。在这条线上没有每一步的优势。","start":3663.37,"end":3688.51},{"id":163,"text":"And the poor step advantage one was actually the one I showed you before. I removed it here because this is maybe the ultimate result in some ways, from human data to self-generated data of sorts. But yeah, it's like 2x with the poor step.","zh":"而那个较差的步骤优势的情况实际上是之前我展示给你的。我在这里移除了它，因为这可能是某种意义上的最终结果，从人类数据到某种自生成数据。但总之，它大约是2倍的较差步骤。","start":3689.41,"end":3702.97},{"id":164,"text":"Okay, so the final thing, that final main method, and then I'm going to just talk about what people are currently doing very briefly, and I'll end the lecture at that point. But the final thing we can also do here is online reinforcement learning. There's two ways of doing this. So the most basic recipe for doing this is actually to not use any of this advantage, but sort of generalize this kind of basic RFT algorithm without advantages to online RFT. So how do you do that? You can basically just take your model.","zh":"好的，那么最后一种主要方法，然后我会简要地谈谈人们目前在做的事情，之后我就结束这堂课了。但最后我们也可以在这里做在线强化学习。有两种方法可以实现这一点。最基本的配方实际上是不使用任何优势，而是将这种基本的RFT算法（不带优势）推广到在线RFT。那么你是如何做到这一点的？你基本上可以只使用你的模型。","start":3705.35,"end":3731.99},{"id":165,"text":"Similar to how we sampled a bunch of traces from my current model or current policy and filtered the right ones. Rather than filtering, you can just train it with onPolicyRL.","zh":"类似于我们从当前模型或当前策略中采样了一大批轨迹并筛选出正确的那些。而不是筛选，你可以直接使用onPolicyRL进行训练。","start":3732.85,"end":3741.11}],"notes":["本段主要讨论了使用强化学习（RL）提升大语言模型（LLM）推理能力的方法，特别是通过DeepSeq V2模型和DPO算法实现的数据效率提升。与基于人类编写解决方案的SFT方法相比，可以将训练所需数据量减少8倍，从而在相同测试误差下使用更少的样本。","在讨论pass at five时，指出这是一种评估模型的方法，即给模型五次机会，判断其是否至少有一次成功。这反映了模型在多次尝试中可能获得的改进，而不仅仅是单次尝试的成功率。","在比较不同方法的效率时，提到RFT在回忆任务中提供了2倍的提升，而LAMA2在整体设置中也表现出类似的8倍提升。此外，还提到温度参数0.6是常见的选择，但并非固定，可以根据具体任务进行调整。","在讨论在线强化学习时，指出可以通过不使用优势函数，将基本的RFT算法推广到在线RFT。具体方法是直接使用当前模型或策略生成的轨迹进行训练，而不是过滤。","本段还提到，与SFT相比，使用RL可以显著提高数据效率，特别是在相同模型和数据量下，通过减少问题数量即可达到相同性能。","最后，强调了在线强化学习的两种方法，并指出其基本思路是直接使用当前模型生成的轨迹进行训练，而不是过滤，从而实现更高效的训练过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3564.23,"end":3741.11,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":3564.23,"text":"And then DeepSeq V2 models as well as DeepSeq V2 models. And what we are finding in general is that compared to the base SFT method, where you were just training on human written solutions, you can get up to an 8x boost in the amount of data that you need for training. So the dashed line here is this first step sort of DPO algorithm that I talked about."},{"start":3584.55,"text":"And you see that it can get you the same test error with 8x fewer samples than training with SFT on human-written data. RFT was 2x for recollection. I removed that line here because it would have been too cluttered. But in general, this 8x also holds true for LAMA2 roughly overall in this setting."},{"start":3603.67,"text":"Yeah, so the question is, what is pass at five? That's a great question. So you can think of pass at five, I guess, for understanding the slide, it doesn't matter, first of all. But in general, you can think of pass at five basically as saying, if I gave the model five chances, can it succeed even once out of those five chances? So it's sort of a way people evaluate models because it's kind of telling you that, okay, maybe the model could not succeed in one try, but if I give it like five N tries, maybe it can succeed. And that's what pass at N."},{"start":3629.76,"text":"I mean, I don't think for this particular result it matters so much. The main thing to look at is this 8x kind of boost in data efficiency that you see up here."},{"start":3638.95,"text":"Okay, so the high-level takeaway here is that if you do offline RL with sort of this per-step notion of credit assignment that we talked about, you can actually get a lot more data efficiency boost compared to imitation learning. So for the same amount of data for the same base model, or sorry, for the same base model and for 8x fewer questions, you can do similar, or you can get the same performance with RL in this setting."},{"start":3663.37,"text":"Yeah, so generally I've seen people use 0.6 as a temperature for a lot of... So the question is, what's the recommended temperature to use? I've generally found it to be 0.6 is what most people use. I don't think that there's something that's set in stone. You can always change it. The question is, what's the solid line? That's just SFT, or human-written solutions in this setting. There's no per-step advantage in that line."},{"start":3689.41,"text":"And the poor step advantage one was actually the one I showed you before. I removed it here because this is maybe the ultimate result in some ways, from human data to self-generated data of sorts. But yeah, it's like 2x with the poor step."},{"start":3705.35,"text":"Okay, so the final thing, that final main method, and then I'm going to just talk about what people are currently doing very briefly, and I'll end the lecture at that point. But the final thing we can also do here is online reinforcement learning. There's two ways of doing this. So the most basic recipe for doing this is actually to not use any of this advantage, but sort of generalize this kind of basic RFT algorithm without advantages to online RFT. So how do you do that? You can basically just take your model."},{"start":3732.85,"text":"Similar to how we sampled a bunch of traces from my current model or current policy and filtered the right ones. Rather than filtering, you can just train it with onPolicyRL."}],"speech_gaps":[],"frame":"../frames/v020/022.webp","frame_time":3576.23},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":166,"text":"So you can just generate rollouts from your current policy, which might be correct or wrong. You can reward them using the reward function by just checking the answer against the answer that the model produces. You can penalize it if it does not produce an answer. You can penalize it if it violates format. There's a bunch of reward-shaping things you can do. And then you just train your policy to maximize this reward using policy gradients. So RFT, we were explicitly filtering","zh":"因此，你可以从当前策略生成轨迹，这可能是正确的也可能是错误的。你可以通过将答案与模型生成的答案进行对比，使用奖励函数来奖励这些轨迹。如果它没有生成答案，你可以对其进行惩罚。如果它违反了格式，你也可以对其进行惩罚。你可以进行许多奖励塑造的操作。然后，你只需使用策略梯度训练你的策略以最大化这个奖励。因此，在RFT中，我们明确地进行了过滤","start":3741.47,"end":3769.93},{"id":167,"text":"and training with SFT. But rather than doing this filtering or training with SFT, you can simply run on policy reinforcement learning. Because all in this formulation is just state, action, there's an MDP, there's a reward, and just do R on top of it. So you can simply write the policy gradient equation, so that basically just looks like grad log pi times the reward that you see up here, and you can just run that on your problem.","zh":"并使用SFT进行训练。但与其进行这种过滤或使用SFT进行训练，你可以直接运行离策略强化学习。因为在这种公式中，一切都是状态和动作，存在一个马尔可夫决策过程（MDP），存在一个奖励，只需在上面应用R。因此，你可以直接写出策略梯度方程，它基本上看起来像梯度对数π乘以此处看到的奖励，然后你只需在你的问题上运行这个方程。","start":3770.52,"end":3794.1},{"id":168,"text":"There's also a lot of work which now tries to kind of go beyond the basic reinforced style policy gradient and goes to sort of methods like what's called GRPO. It's nothing but just an extension of like the basic PPO algorithm in the setting. So the PPO algorithm, I guess I'm going to say a few things like PPO algorithm uses a learned value function. The GRPO algorithm replaces that learned value function or learned Q value function with simply this rollout based estimation of advantages. So the same old basic RL recipe applied on an image.","zh":"也有很多工作尝试超越基本的强化学习风格的策略梯度，转向像称为GRPO的方法。它不过是对基本PPO算法在该设置下的扩展。因此，PPO算法，我想说一些事情，比如PPO算法使用了一个学习到的价值函数。GRPO算法用基于轨迹的估计优势替换了这个学习到的价值函数或学习到的Q值函数。因此，同样的基本RL配方应用于图像。","start":3795.63,"end":3824.95},{"id":169,"text":"DP that looks like the thing that you see up there. So a trajectory that looks like the thing that you see up there with a zero-one reward. Okay. And what you can also do, and this is something that finally you can do, is you can also do per-step advantages in online RL. That's kind of the final method that you can apply. So in this setting, you can take a solution from your base model, or take a solution from your current policy that you're training over the course of training. You can do these rollouts if you want to. You can use these rollouts to compute advantages.","zh":"DP看起来像你上面看到的东西。因此，一个轨迹看起来像你上面看到的东西，带有零一奖励。好的。你还可以做的一件事，而且这是你最终可以做的事情，是你可以在线强化学习中进行每一步的优势计算。这是你可以应用的最终方法。因此，在这种设置中，你可以从你的基础模型中获取一个解决方案，或者从你在训练过程中正在训练的当前策略中获取一个解决方案。如果你想的话，你可以进行这些轨迹生成。你可以使用这些轨迹生成来计算优势。","start":3824.97,"end":3853.05},{"id":170,"text":"And rather than doing these rollouts, you can also potentially do something slightly different, which is basically to train a reward model-like thing to fit to these advantage predictions or to fit to these Q value predictions and then compute advantages.","zh":"与其进行这些 rollout，你也可以潜在地做一些略有不同的事情，即训练一个类似于奖励模型的模型，使其拟合这些优势预测或 Q 值预测，然后计算优势。","start":3854.27,"end":3866.79},{"id":171,"text":"So this is very similar to some of the RLHF work that you probably saw, except that now this is a reward model that is rewarding every step of sorts, or a reward model that's producing the Q value for every step or the advantage for every step, as opposed to producing a reward for the whole sequence that you are seeing. And once you have these advantage predictions that you can fit to a network, you can query this particular...","zh":"这与你可能见过的一些 RLHF 工作非常相似，只不过现在这是一个奖励模型，它对每一步进行奖励，或者产生每一步的 Q 值或优势，而不是对整个序列产生一个奖励。一旦你有了可以拟合到网络上的优势预测，你就可以查询这个特定的……","start":3867.71,"end":3891.55},{"id":172,"text":"So for any rollout that your policy produces, you can query the advantage predictor that you have trained to reward every single step in this particular policy generation. And once you do that, what you can do now is you can simply take your network, produce these advantage labels, and optimize for reward that you're getting at the end, plus these advantages that you see up here.","zh":"因此，对于你策略生成的任何 rollout，你都可以查询你训练好的优势预测器，以奖励该策略生成中的每一步。一旦你这样做，你现在可以做的就是使用你的网络生成这些优势标签，并优化你最终获得的奖励，加上你在这里看到的优势。","start":3892.59,"end":3914.57}],"notes":["本段讲解了如何通过强化学习（RL）提升大语言模型（LLM）的推理能力。具体方法是通过生成轨迹（rollouts）并使用奖励函数对模型的输出进行评估，从而训练策略以最大化奖励。这包括对模型输出的正确性、格式是否符合要求等进行奖励或惩罚。此外，还提到可以使用策略梯度方法进行训练，而无需进行SFT（监督微调）或过滤。","本段进一步讨论了如何在强化学习框架中应用策略梯度方法。通过将问题建模为马尔可夫决策过程（MDP），并定义奖励函数，可以使用策略梯度公式进行训练。同时，还提到GRPO算法作为PPO算法的扩展，通过使用基于轨迹的估计来计算优势值，而不是使用学习的值函数或Q值函数。","本段介绍了如何在在线强化学习中计算每一步的优势值。这包括使用基础模型或当前策略生成轨迹，并利用这些轨迹计算优势值。此外，还提到可以训练一个奖励模型来拟合这些优势值或Q值预测，从而计算优势值。","本段强调了与RLHF（强化学习与人类反馈）工作的相似之处，但不同之处在于，现在的奖励模型不仅对整个序列进行奖励，而是对每个步骤进行奖励，包括生成Q值或优势值。这使得模型能够更细致地优化每一步的输出。","本段讨论了如何利用训练好的优势预测器来优化策略。对于每个轨迹，可以查询优势预测器以获得每一步的奖励，并结合最终的奖励进行优化。这种方法允许模型在生成过程中逐步优化输出，从而提升推理能力。","本段总结了强化学习在提升大语言模型推理能力中的应用方法，包括生成轨迹、奖励函数设计、策略梯度训练、优势值计算以及奖励模型的使用。这些方法共同构成了一个完整的强化学习框架，用于优化模型的推理性能。"],"formulas":[],"uncertainties":["GRPO算法的具体实现细节未明确说明，可能需要进一步澄清。","优势预测器的具体训练方法和网络结构未详细描述，可能需要补充信息。"],"diagram":"none","start":3741.47,"end":3914.57,"asr_flags":[],"math_clarifications":["优势值A_t的计算通常基于策略梯度方法中的估计，如使用TD误差或Q值估计，且需要明确状态值函数V(\\phi_t)的定义。此外，公式中未体现优势值的计算通常基于策略梯度方法中的估计，如使用TD误差或Q值估计。因此，该公式无法直接使用，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3741.47,"text":"So you can just generate rollouts from your current policy, which might be correct or wrong. You can reward them using the reward function by just checking the answer against the answer that the model produces. You can penalize it if it does not produce an answer. You can penalize it if it violates format. There's a bunch of reward-shaping things you can do. And then you just train your policy to maximize this reward using policy gradients. So RFT, we were explicitly filtering"},{"start":3770.52,"text":"and training with SFT. But rather than doing this filtering or training with SFT, you can simply run on policy reinforcement learning. Because all in this formulation is just state, action, there's an MDP, there's a reward, and just do R on top of it. So you can simply write the policy gradient equation, so that basically just looks like grad log pi times the reward that you see up here, and you can just run that on your problem."},{"start":3795.63,"text":"There's also a lot of work which now tries to kind of go beyond the basic reinforced style policy gradient and goes to sort of methods like what's called GRPO. It's nothing but just an extension of like the basic PPO algorithm in the setting. So the PPO algorithm, I guess I'm going to say a few things like PPO algorithm uses a learned value function. The GRPO algorithm replaces that learned value function or learned Q value function with simply this rollout based estimation of advantages. So the same old basic RL recipe applied on an image."},{"start":3824.97,"text":"DP that looks like the thing that you see up there. So a trajectory that looks like the thing that you see up there with a zero-one reward. Okay. And what you can also do, and this is something that finally you can do, is you can also do per-step advantages in online RL. That's kind of the final method that you can apply. So in this setting, you can take a solution from your base model, or take a solution from your current policy that you're training over the course of training. You can do these rollouts if you want to. You can use these rollouts to compute advantages."},{"start":3854.27,"text":"And rather than doing these rollouts, you can also potentially do something slightly different, which is basically to train a reward model-like thing to fit to these advantage predictions or to fit to these Q value predictions and then compute advantages."},{"start":3867.71,"text":"So this is very similar to some of the RLHF work that you probably saw, except that now this is a reward model that is rewarding every step of sorts, or a reward model that's producing the Q value for every step or the advantage for every step, as opposed to producing a reward for the whole sequence that you are seeing. And once you have these advantage predictions that you can fit to a network, you can query this particular..."},{"start":3892.59,"text":"So for any rollout that your policy produces, you can query the advantage predictor that you have trained to reward every single step in this particular policy generation. And once you do that, what you can do now is you can simply take your network, produce these advantage labels, and optimize for reward that you're getting at the end, plus these advantages that you see up here."}],"speech_gaps":[],"frame":"../frames/v020/023.webp","frame_time":3753.47},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":173,"text":"Yeah, so the question is, how generalizable is reasoning? When you train on math, does it improve on GSM8K? So it turns out if you train on math, it does not improve on GSM8K, and many people have shown it. But if you train on a bunch of mixture of prompts, which are of varied levels of difficulty, you can actually get there. So this is precisely the recipe which has been used in, or not this one, but the basic online RL recipe which I talked to you about earlier, used to train all of these, or many of these thinking models which have open","zh":"是的，所以问题是，推理的泛化能力如何？当你在数学上进行训练时，它是否能提升在GSM8K上的表现？结果发现，如果你在数学上进行训练，它并不会在GSM8K上有所提升，很多人已经证明了这一点。但如果你训练的是大量不同难度级别的提示混合物，你实际上可以达到这个效果。因此，这就是之前我提到的在线强化学习的基本配方，用来训练所有这些，或者许多这些思考模型，它们具有开放性。","start":3916.4,"end":3944.52},{"id":174,"text":"recipe descriptions so this online rm recipe is kind of used to train the deep sea carbon model for instance and that kind of does generalize to a fairly good amount of extent it doesn't also generalize to a large to every single problem out there but to a fairly good extent it does","zh":"配方描述，因此这种在线强化学习的配方被用来训练诸如深海碳模型之类的模型，这种模型在一定程度上确实具有泛化能力，但它并不泛化到每一个问题上，但确实能在相当大的程度上泛化。","start":3945.9,"end":3958.22},{"id":175,"text":"So you can compute these advantage predictions. You can fit them to a network, use them to produce these rewards for every single step. And that's sort of the more advanced way of doing online RL with this particular thing. So we had a work that we call process advantage verifiers here. Process because it's rewarding every step. Advantage because it's fitting an advantage function. And a verifier because somehow in the domain of reasoning, reward models are referred to often as verifiers.","zh":"因此，你可以计算这些优势预测。你可以将它们拟合到一个网络中，用它们为每一步生成奖励。这基本上是使用这种特定方法进行在线强化学习的更高级方式。我们有一个工作，我们称之为过程优势验证器。过程是因为它对每一步都给予奖励。优势是因为它拟合了一个优势函数。验证器是因为在推理领域，奖励模型通常被称为验证器。","start":3959.2,"end":3985.3},{"id":176,"text":"So if you see that word come up, it's just synonymous to a reward model of sorts. Or in this particular case, even you can think of it as a Q function or a value function of sorts. But that's kind of the name of the method. And we find that in general. So I'm going to skip some of these details. But in general, if you do...","zh":"所以如果你看到这个词出现，它只是某种奖励模型的同义词。或者在这种情况，你也可以将其视为某种Q函数或价值函数。但这是该方法的名称。我们发现这在一般情况下是适用的。因此，我将跳过一些细节。但总的来说，如果你这样做...","start":3985.92,"end":4001.98},{"id":177,"text":"dense reward RL, like process reward or advantage-based reward RL, you find that you can kind of get to a much better accuracy compared to sort of what's called ORM RL or just 0-1 reward RL, like the sparse 0-1 reward provided at the end of the trajectory. So this is sort of the basic recipe that a lot of the current work is using. This is sort of the advantage-based verifier's recipe. And you can kind of see that you can get a bigger boost in sample efficiency as well as in terms of just absolute performance that you see up here. Also, these numbers kind of","zh":"密集奖励强化学习，比如过程奖励或基于优势的奖励强化学习，你会发现你可以达到比所谓的ORM强化学习或仅仅是0-1奖励强化学习（如轨迹结束时提供的稀疏0-1奖励）要好得多的准确性。因此，这基本上是当前许多工作所采用的基本方法。这基本上是基于优势的验证器的方法。你也可以看到，在样本效率和这里所展示的绝对性能方面，你都能获得更大的提升。此外，这些数字看起来可能很小，","start":4002.88,"end":4032.1},{"id":178,"text":"look small, but with 2B and 9B models that we were basing this off of, apparently this is sort of the best result that you can get on certain data sets that we tried this on. So it's about 5 to 6x sample efficiency boost and about 6 to 7% absolute performance improvement in this particular setting with the 10 set advantages somewhere. Okay.","zh":"看起来很小，但基于我们所使用的20亿和90亿参数模型，显然在我们尝试过的某些数据集上，这是可以得到的最佳结果。因此，在这种特定情况下，它大约提供了5到6倍的样本效率提升，并在具有10个优势的设置中，绝对性能提高了大约6到7%。好的。","start":4032.18,"end":4054.2},{"id":179,"text":"Okay, I'm going to skip some of these things. But at a high level, we are also seeing now these newer thinking models that have come up, where basically these models can just think for longer and produce a better answer. This is sort of the DeepSeq R1 family of models, the OpenAI O1 family of models, or O-series of models from OpenAI. In my opinion, really these are trained using very similar...","zh":"好的，我将跳过一些内容。但总体而言，我们现在也看到了一些新出现的思考模型，这些模型基本上可以思考得更久并产生更好的答案。这基本上是DeepSeq R1系列模型、OpenAI的O1系列模型，或者是OpenAI的O系列模型。在我看来，这些模型实际上都是使用我刚刚在这堂课上谈到的类似方法进行训练的。","start":4055.28,"end":4078.42},{"id":180,"text":"recipes that I just talked to you about for this whole lecture. Except that there are some small changes that happen in this process from pre-these-models-error versus these models.","zh":"只不过在这个过程中，与这些模型之前存在的错误相比，有一些小的改动。","start":4078.83,"end":4089.41}],"notes":["本段讨论了强化学习在大语言模型推理中的应用，特别是如何通过训练混合难度的提示来提升模型的泛化能力。讲者指出，仅在数学任务上训练并不能显著提升模型在GSM8K数据集上的表现，但通过混合不同难度的提示，可以实现更好的泛化效果。","讲者提到，这种训练方法与在线强化学习（online RL）的配方类似，用于训练如深海碳模型等模型。虽然这种方法在一定程度上可以泛化，但并不能解决所有问题。","在强化学习中，计算优势预测并将其拟合到网络中，可以为每个步骤生成奖励。这种方法被称为过程优势验证器（process advantage verifiers），其中“过程”指的是每一步都给予奖励，“优势”指的是拟合优势函数，“验证器”则是因为在推理领域，奖励模型常被称为验证器。","讲者指出，优势验证器方法在密集奖励强化学习（dense reward RL）中表现优于稀疏奖励（如0-1奖励）的方法。这种方法在样本效率和绝对性能上都有显著提升，例如在2B和9B模型上，样本效率提升了5到6倍，性能提升了6到7%。","讲者提到，当前的许多推理模型，如DeepSeq R1、OpenAI的O1系列模型，都是基于类似的训练配方，但与之前的模型相比，有一些小的改进。","讲者强调，这些模型能够进行更长时间的推理并生成更好的答案，这表明强化学习方法在提升大语言模型推理能力方面具有重要价值。"],"formulas":[],"uncertainties":["recipe descriptions so this online rm recipe is kind of used to train the deep sea carbon model for instance and that kind of does generalize to a fairly good amount of extent it doesn't also generalize to a large to every single problem out there but to a fairly good extent it does"],"diagram":"none","start":3916.4,"end":4089.41,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3916.4,"text":"Yeah, so the question is, how generalizable is reasoning? When you train on math, does it improve on GSM8K? So it turns out if you train on math, it does not improve on GSM8K, and many people have shown it. But if you train on a bunch of mixture of prompts, which are of varied levels of difficulty, you can actually get there. So this is precisely the recipe which has been used in, or not this one, but the basic online RL recipe which I talked to you about earlier, used to train all of these, or many of these thinking models which have open"},{"start":3945.9,"text":"recipe descriptions so this online rm recipe is kind of used to train the deep sea carbon model for instance and that kind of does generalize to a fairly good amount of extent it doesn't also generalize to a large to every single problem out there but to a fairly good extent it does"},{"start":3959.2,"text":"So you can compute these advantage predictions. You can fit them to a network, use them to produce these rewards for every single step. And that's sort of the more advanced way of doing online RL with this particular thing. So we had a work that we call process advantage verifiers here. Process because it's rewarding every step. Advantage because it's fitting an advantage function. And a verifier because somehow in the domain of reasoning, reward models are referred to often as verifiers."},{"start":3985.92,"text":"So if you see that word come up, it's just synonymous to a reward model of sorts. Or in this particular case, even you can think of it as a Q function or a value function of sorts. But that's kind of the name of the method. And we find that in general. So I'm going to skip some of these details. But in general, if you do..."},{"start":4002.88,"text":"dense reward RL, like process reward or advantage-based reward RL, you find that you can kind of get to a much better accuracy compared to sort of what's called ORM RL or just 0-1 reward RL, like the sparse 0-1 reward provided at the end of the trajectory. So this is sort of the basic recipe that a lot of the current work is using. This is sort of the advantage-based verifier's recipe. And you can kind of see that you can get a bigger boost in sample efficiency as well as in terms of just absolute performance that you see up here. Also, these numbers kind of"},{"start":4032.18,"text":"look small, but with 2B and 9B models that we were basing this off of, apparently this is sort of the best result that you can get on certain data sets that we tried this on. So it's about 5 to 6x sample efficiency boost and about 6 to 7% absolute performance improvement in this particular setting with the 10 set advantages somewhere. Okay."},{"start":4055.28,"text":"Okay, I'm going to skip some of these things. But at a high level, we are also seeing now these newer thinking models that have come up, where basically these models can just think for longer and produce a better answer. This is sort of the DeepSeq R1 family of models, the OpenAI O1 family of models, or O-series of models from OpenAI. In my opinion, really these are trained using very similar..."},{"start":4078.83,"text":"recipes that I just talked to you about for this whole lecture. Except that there are some small changes that happen in this process from pre-these-models-error versus these models."}],"speech_gaps":[],"frame":"../frames/v020/024.webp","frame_time":3928.4},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":181,"text":"So the RL training objective has remained the same. So there's some minor details, like there's this new method called GRPO, which I'm just describing. It's basically PPO with some tweaks. There's also some other methods like advantage-induced policy alignment. You don't need to know what those methods are. Just think of them roughly as policy gradient methods done with slight tweaks overall.","zh":"因此，强化学习的训练目标保持不变。有一些细节有所变化，比如有一种新方法叫做GRPO，我正在描述它。它基本上是PPO的一些变种。还有一些其他方法，比如优势诱导策略对齐。你不需要知道这些方法具体是什么。只需大致认为它们是带有轻微调整的策略梯度方法。","start":4090.38,"end":4109.76},{"id":182,"text":"But what has changed is that the action space in a way has changed for these models, in my opinion. Now, this is a very kind of crude statement to make. And to be really rigorous about it, I think the statement sounds wrong because these models do actually produce token by token, one at a time. But these models, the base models on which we are doing RL, have become better at being able to kind of implement interesting kind of meta procedures. Like, you know, these models can actually produce a solution, maybe go out there and then try to verify the solution they have produced.","zh":"但在我看来，这些模型的行动空间在某种程度上发生了变化。这是一个非常粗略的说法。要真正严谨地说，我认为这个说法听起来是错误的，因为这些模型确实是一次一个标记地生成，逐个生成。但这些模型，我们进行强化学习所基于的基础模型，已经变得更好，能够实现一些有趣的元过程。例如，这些模型实际上可以生成一个解决方案，然后出去验证它们生成的解决方案。","start":4110.64,"end":4139.74},{"id":183,"text":"maybe then backtrack to a particular point and do something else from there. And you can think of this as just yet another version of defining the step. These models can produce more interesting steps than just going out there and calculating yet another quantity like the models previously could have done. So it's just a better notion of a step or a better action that these models can sample when you run all of these algorithms on top of them.","zh":"也许然后回退到某个特定点，从那里做其他事情。你可以将这视为定义步骤的另一种方式。这些模型可以生成比之前模型所能生成的更有趣的步骤，而不仅仅是出去计算另一个量。因此，这些模型在运行所有这些算法时，可以采样更好的步骤或更好的动作。","start":4140.08,"end":4161.76},{"id":184,"text":"And once you do that and you give these models a longer budget to act, so if you tell these models that, okay, there's no limit on how many tokens you can think, you can sample during the course of RL, you can maybe sample solutions which are really, really long, but just get me the right answer. If I give these models that playground to kind of sample more and more tokens, turns out that RL training algorithms with these two bullet points actually give you much better performance. And that's kind of what we see with these current thinking models right now.","zh":"一旦你这样做，并给这些模型更长的行动预算，也就是说，如果你告诉这些模型，没有限制它们可以思考的标记数量，在强化学习过程中可以采样更多标记，你可能会采样出非常长的解决方案，但只需得到正确的答案。如果你给这些模型这样一个平台，让它们采样越来越多的标记，结果发现，具有这两个要点的强化学习训练算法实际上能提供更好的性能。而这正是当前这些思考模型所表现出的情况。","start":4162.59,"end":4190.77},{"id":185,"text":"Turns out that if you do a counterfactual experiment where you take models which are not capable of implementing basic answer checking or verification or generating a better answer, turns out that you cannot do good RL with them right now. So really nothing has changed in terms of the high-level techniques that I talked about, except that the base models have become more interesting in a way that they can sample interesting kinds of steps to train on.","zh":"事实证明，如果你进行一个反事实实验，其中你使用的是无法实现基本答案检查或验证或生成更好答案的模型，那么你目前无法用它们进行良好的强化学习。因此，从我所讨论的高层技术角度来看，实际上没有什么变化，除了基础模型变得更有意思，它们能够采样出有趣类型的步骤来进行训练。","start":4191.72,"end":4220.56},{"id":186,"text":"And that has led to some of the most amazing results that we are seeing right now.","zh":"这导致了我们现在所看到的一些最令人惊叹的结果。","start":4221.0,"end":4223.82}],"notes":["本段讨论了强化学习（RL）在大语言模型（LLM）推理中的应用，强调了模型在行动空间上的变化。虽然模型仍然按token生成，但基础模型现在能够执行更复杂的元过程，如生成解决方案并验证其正确性。","讲者指出，模型现在可以回溯到特定点并采取不同的行动，这被视为对‘步骤’概念的改进。这种改进使得模型在执行RL算法时能够生成更丰富的动作。","当给予模型更长的思考预算时，即允许模型生成更多token，RL训练算法表现出更好的性能。这表明模型在生成更长、更复杂的解决方案方面具有潜力。","讲者提到，如果模型无法执行基本的验证或生成更优答案，那么当前的RL方法可能无法有效训练这些模型。这说明模型的改进是实现更好RL性能的关键。","尽管高层技术没有变化，但基础模型的改进使得它们能够生成更有趣的训练步骤，从而推动了当前最令人惊叹的结果。","这些结果表明，模型在推理能力上的提升对强化学习的应用具有重要意义，尤其是在需要复杂验证和生成任务的场景中。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4090.38,"end":4223.82,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4090.38,"text":"So the RL training objective has remained the same. So there's some minor details, like there's this new method called GRPO, which I'm just describing. It's basically PPO with some tweaks. There's also some other methods like advantage-induced policy alignment. You don't need to know what those methods are. Just think of them roughly as policy gradient methods done with slight tweaks overall."},{"start":4110.64,"text":"But what has changed is that the action space in a way has changed for these models, in my opinion. Now, this is a very kind of crude statement to make. And to be really rigorous about it, I think the statement sounds wrong because these models do actually produce token by token, one at a time. But these models, the base models on which we are doing RL, have become better at being able to kind of implement interesting kind of meta procedures. Like, you know, these models can actually produce a solution, maybe go out there and then try to verify the solution they have produced."},{"start":4140.08,"text":"maybe then backtrack to a particular point and do something else from there. And you can think of this as just yet another version of defining the step. These models can produce more interesting steps than just going out there and calculating yet another quantity like the models previously could have done. So it's just a better notion of a step or a better action that these models can sample when you run all of these algorithms on top of them."},{"start":4162.59,"text":"And once you do that and you give these models a longer budget to act, so if you tell these models that, okay, there's no limit on how many tokens you can think, you can sample during the course of RL, you can maybe sample solutions which are really, really long, but just get me the right answer. If I give these models that playground to kind of sample more and more tokens, turns out that RL training algorithms with these two bullet points actually give you much better performance. And that's kind of what we see with these current thinking models right now."},{"start":4191.72,"text":"Turns out that if you do a counterfactual experiment where you take models which are not capable of implementing basic answer checking or verification or generating a better answer, turns out that you cannot do good RL with them right now. So really nothing has changed in terms of the high-level techniques that I talked about, except that the base models have become more interesting in a way that they can sample interesting kinds of steps to train on."},{"start":4221.0,"text":"And that has led to some of the most amazing results that we are seeing right now."}],"speech_gaps":[],"frame":"../frames/v020/025.webp","frame_time":4102.38}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v020.mp4"}</script><script src="../assets/katex.min.js"></script><script>

if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}

by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
