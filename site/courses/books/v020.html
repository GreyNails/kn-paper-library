ple can do sort of, you know, just edit distance based sort of rejection as well. So keep the, you know, sample more than N. So one of the recipes people do is sample more than N, like 2N, and retain the N of them, which actually seem to be maximally diverse. That's something people do a lot of times. So yeah, you do that. Great. Okay.","zh":"有很多机制可以实现这一点。人们可以基于编辑距离进行某种拒绝采样。因此，你可以保留样本数量超过N。人们常用的一种方法是采样超过N，比如2N，然后保留其中的N个，这些样本实际上似乎具有最大多样性。这是人们经常做的事情。所以是的，你会这么做。很好。好的。","start":1630.08,"end":1649.09},{"id":68,"text":"So what this tells us at a high level is that fitting on self-generated data on a limited number of initial states actually hurts generalization of the model. So if you recall the picture that I drew earlier, which I erased, where there was an S naught and your model took an A naught and went to S1, you can think of this as basically training on a set of S naughts and evaluating on a new set, on a new test problem. And it turns out that if you train too much on a particular set of S naughts in this particular way, you end up hitting the generalization model in that setting.","zh":"从高层次来看，这告诉我们，在有限数量的初始状态上使用自生成数据进行拟合实际上会损害模型的泛化能力。如果你还记得我之前画的那张图（我后来擦掉了），其中有一个S naught，你的模型采取了一个A naught并转移到了S1，你可以将这视为基本上是在一组S naught上进行训练，并在一组新的测试问题上进行评估。结果发现，如果你以这种方式在特定的S naught集合上训练过多，你最终会在这个设置中遇到泛化模型的问题。","start":1649.79,"end":1678.89}],"notes":["本段讨论了在强化学习中，仅通过增加样本数量来提升策略效果的局限性。讲者指出，如果仅仅通过增加样本数量（即增加n值）来提升策略，这种方法并不能得到最优的策略或模型。这是因为当样本数量增加到一定程度后，模型的泛化能力反而会下降，出现边际效益递减的现象。","讲者通过一个图表展示了这一现象，图表的x轴表示正确答案的数量，y轴表示模型的性能。初始阶段，随着正确答案数量的增加，模型的误差会下降，但超过某个阈值后，误差开始上升，这表明模型的泛化能力受到了限制。","讲者进一步解释了x轴的含义，指出x轴代表的是s tilde的大小，即每个问题保留的正确解的数量。图表中的x轴实际上是s tilde乘以一个常数因子，这个常数因子与提示的数量有关。","讲者提到在进行这种策略优化时，通常会进行去重操作，以确保样本的多样性。去重的方法包括基于编辑距离的拒绝采样，以及采样超过N个样本后保留其中N个最多样化的样本。","最后，讲者总结了这一现象的含义，指出在有限的初始状态上进行自生成数据的拟合会损害模型的泛化能力。这与之前提到的S naught和S1的示意图相关，表明模型在训练时如果过度依赖特定的初始状态，会导致在新问题上的表现下降。","讲者强调了泛化能力的重要性，并指出在强化学习中，过度依赖特定的训练数据可能会导致模型在新任务上的表现不佳。因此，需要在训练过程中平衡样本数量和多样性，以避免泛化能力的下降。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1498.97,"end":1678.89,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1498.97,"text":"But it so turns out that if you simply keep doing this over and over, it's not going to give you the best possible policy or the best possible model. So if you simply keep scaling up SFT on policy data, what do I mean by scaling it up? I mean you increase this value of n that you see up here. So you just sample tons and tons of solutions and pick the correct ones and just start to do BC on all of them. Turns out that that recipe does not actually work."},{"start":1522.78,"text":"So what happens is on-policy imitation learning ends up hurting generalization if you do too much of it. And to show a result for it, I'm going to show you a plot here."},{"start":1531.82,"text":"which is showing sort of the test performance of the same plot. But now the x-axis is the number of correct answers you get in this filtered set that I was describing to you earlier per question. So you can scale it up for how much ever you want. The size of s tilde multiplied by a constant factor is shown on the x-axis. And we are plotting the performance of the resulting RFT trained model."},{"start":1557.36,"text":"The interesting thing to notice here is that initially, your error goes down. So as you do more and more correct solution traces, as you generate more and more of these correct solution traces, your error goes down, as you see initially. But then beyond a point, your error starts to go up in this particular setting. So you find that beyond a point, you hit diminishing returns. And there's no way you can simply generate more solutions from your policy, mimic them, and get better performance. And in fact, the error even goes up on some of these data sets that you see up here."},{"start":1588.48,"text":"You can think of it as the size of s tilde. So number of correct solutions you retain per question. So the question was, what is the x-axis? The x-axis is number of s tilde. So the plot, it's basically s tilde times 8k in the plot, because that's the number of prompts that you see up here. But yeah, it's just a constant multiplier, which stays the same for all the points on the particular plot."},{"start":1612.83,"text":"So that's a great question. So the question is, when you scale S tilde, which is for RFT, do you do deduplication? The answer is yes. And I actually removed that detail from my slide because I thought it would be too much details. But since you asked it, the answer is yes. You would often, when you do this process, you would often deduplicate S tildes."},{"start":1630.08,"text":"There's a lot of mechanisms for it. People can do sort of, you know, just edit distance based sort of rejection as well. So keep the, you know, sample more than N. So one of the recipes people do is sample more than N, like 2N, and retain the N of them, which actually seem to be maximally diverse. That's something people do a lot of times. So yeah, you do that. Great. Okay."},{"start":1649.79,"text":"So what this tells us at a high level is that fitting on self-generated data on a limited number of initial states actually hurts generalization of the model. So if you recall the picture that I drew earlier, which I erased, where there was an S naught and your model took an A naught and went to S1, you can think of this as basically training on a set of S naughts and evaluating on a new set, on a new test problem. And it turns out that if you train too much on a particular set of S naughts in this particular way, you end up hitting the generalization model in that setting."}],"speech_gaps":[],"frame":"../frames/v020/010.webp","frame_time":1510.97},{"title":"强化学习中伪步骤的出现及其影响","segments":[{"id":69,"text":"Okay, so why does this happen? And this is sort of the picture that I'm going to talk about, and I'll connect it to some of the interesting concepts that we know in imitation learning right now, which is this picture of spurious steps. So, yeah, so what we're going to do is, you know, we'll move away a little bit from, like, examples and look at pictures. And what we'll do is we'll plot these pictures, as I was describing to you earlier, as this little trajectory in an MDP. So you have prompts as initial states, and you are producing these steps one by one. They take you to the next states, and then eventually you end up at the answer.","zh":"好的，那么为什么会发生这种情况呢？这基本上就是我要讲的图景，我会将其与目前模仿学习中的一些有趣概念联系起来，也就是所谓的伪步骤图景。因此，我们将稍微远离具体的例子，转而关注图景。我们将绘制这些图景，正如我之前向你们描述的那样，作为马尔可夫决策过程（MDP）中的一个小轨迹。你们有提示作为初始状态，然后依次生成这些步骤。它们将你们带到下一个状态，最终你们会到达答案。","start":1681.11,"end":1709.66},{"id":70,"text":"So it so happens that when you sample a lot from your own model and train on it on policy, like you sample from your policy and train on it, you will often find that there are some of these traces which end up having steps which are spurious in nature, steps which actually are incorrect, but they just somehow don't affect the model's generation.","zh":"事实上，当你从自己的模型中大量采样并在其上进行策略训练时，你会发现有一些轨迹最终会包含伪步骤，这些步骤实际上是错误的，但它们以某种方式不会影响模型的生成。","start":1710.64,"end":1727.8},{"id":71,"text":"So I'm going to show you an example, but basically these are steps which would take you to a regime where you're maybe doing a wrong calculation. You know, somehow, you know, you get there. Maybe on this particular trace, when you are sampling from your model, you end up do recovering from these traces. So you end up with the correct answer. But maybe in reality, you know, these traces are actually harmful.","zh":"我将向你们展示一个例子，但基本上这些步骤会将你们带入一个可能进行错误计算的领域。你们以某种方式到达那里。也许在这个特定的轨迹中，当你从模型中进行采样时，你们会从这些轨迹中恢复过来，最终得到正确的答案。但也许在现实中，这些轨迹实际上是有害的。","start":1728.75,"end":1747.55},{"id":72,"text":"So just to give you an example, let's say this is a little arithmetic problem. It's from this GSM 8K data set. One interesting example we found, which is the most stark example of this particular issue, was there's a solution from the model which does some calculation. Then it says that the total amount of money needed is like 100 times 2, which is 200. And it reverses its calculation in the next line. So the true calculation is 100 by 2, but it ends up saying 200 and then sort of goes to 100 by 2 right away.","zh":"为了给你们举个例子，假设这是一个小的算术问题，它来自GSM 8K数据集。我们发现的一个有趣例子，是这种问题的最明显案例，其中模型提供了一个解决方案，进行了一些计算。然后它说所需的总金额是100乘以2，即200。在下一行，它又反转了计算。正确的计算是100除以2，但它却说200，然后立刻又说100除以2。","start":1748.23,"end":1777.29},{"id":73,"text":"So what ends up happening is this particular step that exists in the middle where it's doing 200 is sort of a spurious step. It's a step that is not needed. It's an incorrect step that exists in the solution. You end up still at the right answer in this particular rollout, but this step shouldn't be there in reality in that particular setting. So that's a spurious step in this particular set.","zh":"最终发生的情况是，这个在中间存在的执行200的步骤实际上是一个伪步骤。这是一个不需要的步骤，也是一个错误的步骤，存在于解决方案中。你仍然在这个特定的 rollout 中到达了正确的答案，但在这种特定情况下，这个步骤实际上不应该存在。因此，这就是这个特定集合中的一个伪步骤。","start":1777.85,"end":1797.09},{"id":74,"text":"So the question is, the step is always a sentence. For now, you can imagine it's always a sentence in this particular setting. There's no universally agreed upon definition to it. So this is a very sort of, I guess in the second part of my talk, I'm going to show you some examples where the step is not at all a sentence. It's a full block of things. So, yeah.","zh":"问题是，这个步骤总是以句子的形式存在。目前，你可以想象在这个特定的设置中，它总是以句子的形式出现。对于它的定义，目前还没有普遍认可的定义。因此，在我演讲的第二部分，我将向你们展示一些例子，其中这个步骤根本不是以句子的形式存在的，而是以一个完整的块状内容存在。是的。","start":1798.12,"end":1813.78},{"id":75,"text":"That's a great question. So the question is, is this the main cause of increase in error and can you not measure it in some way? So it turns out that the answer to both is yes, it's one of the main causes for increase in error. Can you measure it in some way? At least normal notions of fitting the data won't tell you this.","zh":"这是一个非常好的问题。问题是，这是否是误差增加的主要原因，以及你是否能够以某种方式测量它？结果表明，对于这两个问题，答案都是肯定的，它是误差增加的主要原因之一。你能否以某种方式测量它？至少，常规的数据拟合概念不会告诉你这一点。","start":1814.38,"end":1832.06},{"id":76,"text":"That's a great question. So the question is, can we associate the overfitting problem with this? So you can actually measure this. In the paper, we did measure this. We measured the amount of spurious steps that you see, and it grows on over time. Obviously, I cannot give you a proof that this is the only cause. I can give you a proof that this should be a problem. I cannot give you a proof that this is the only problem. But this is sort of one of the big problems that you see. So the question is, how do you find out if it's a spurious step? In experiments, we do it in a particular way, and that also dictates a lot of methodologies that I'm going to show you in a second.","zh":"这是一个非常好的问题。问题是，我们能否将过拟合问题与这个伪步骤联系起来？实际上，你可以测量这一点。在论文中，我们确实测量了这一点。我们测量了你所看到的伪步骤的数量，并且随着时间的推移，这个数量会增加。显然，我无法证明这是唯一的原因。我可以证明这是一个应该引起关注的问题。我无法证明这是唯一的问题。但这是你所看到的一个主要问题。问题是，你如何判断它是否是一个伪步骤？在实验中，我们以特定的方式进行判断，这也决定了我即将展示给你们的许多方法论。","start":1833.21,"end":1859.56}],"notes":["本段讨论了强化学习中伪步骤（spurious steps）的出现及其对模型推理的影响。伪步骤指的是在模型生成过程中出现的错误步骤，这些步骤虽然不影响最终结果，但实际上是不正确的。例如，在一个算术问题中，模型可能错误地计算出200，然后又回到正确的计算方式，这种错误步骤在模型的推理过程中存在，但不会影响最终答案。","伪步骤的出现与模型在训练过程中采样和训练的方式有关。当模型在策略上进行训练时，可能会生成一些错误的步骤，这些步骤在某些情况下不会影响最终结果，但在其他情况下可能有害。因此，伪步骤的存在可能导致模型在某些情况下出现错误。","伪步骤的检测和测量是研究中的一个重要问题。虽然传统的数据拟合方法无法直接检测到伪步骤，但可以通过实验和特定的方法来测量伪步骤的数量及其随时间的变化趋势。这有助于理解模型在训练过程中可能出现的问题。","伪步骤的检测方法在实验中被广泛应用，并且这些方法也影响了后续的研究方法。通过测量伪步骤的数量，可以更好地理解模型在推理过程中的行为，并改进模型的训练策略。","伪步骤的存在是模型推理过程中一个重要的问题，但并非唯一的问题。因此，研究者需要综合考虑多种因素，以全面理解模型的性能和潜在问题。","伪步骤的检测和测量对于改进模型的推理能力至关重要。通过识别和减少伪步骤，可以提高模型的准确性和可靠性，从而更好地应用于实际问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1681.11,"end":1859.56,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1681.11,"text":"Okay, so why does this happen? And this is sort of the picture that I'm going to talk about, and I'll connect it to some of the interesting concepts that we know in imitation learning right now, which is this picture of spurious steps. So, yeah, so what we're going to do is, you know, we'll move away a little bit from, like, examples and look at pictures. And what we'll do is we'll plot these pictures, as I was describing to you earlier, as this little trajectory in an MDP. So you have prompts as initial states, and you are producing these steps one by one. They take you to the next states, and then eventually you end up at the answer."},{"start":1710.64,"text":"So it so happens that when you sample a lot from your own model and train on it on policy, like you sample from your policy and train on it, you will often find that there are some of these traces which end up having steps which are spurious in nature, steps which actually are incorrect, but they just somehow don't affect the model's generation."},{"start":1728.75,"text":"So I'm going to show you an example, but basically these are steps which would take you to a regime where you're maybe doing a wrong calculation. You know, somehow, you know, you get there. Maybe on this particular trace, when you are sampling from your model, you end up do recovering from these traces. So you end up with the correct answer. But maybe in reality, you know, these traces are actually harmful."},{"start":1748.23,"text":"So just to give you an example, let's say this is a little arithmetic problem. It's from this GSM 8K data set. One interesting example we found, which is the most stark example of this particular issue, was there's a solution from the model which does some calculation. Then it says that the total amount of money needed is like 100 times 2, which is 200. And it reverses its calculation in the next line. So the true calculation is 100 by 2, but it ends up saying 200 and then sort of goes to 100 by 2 right away."},{"start":1777.85,"text":"So what ends up happening is this particular step that exists in the middle where it's doing 200 is sort of a spurious step. It's a step that is not needed. It's an incorrect step that exists in the solution. You end up still at the right answer in this particular rollout, but this step shouldn't be there in reality in that particular setting. So that's a spurious step in this particular set."},{"start":1798.12,"text":"So the question is, the step is always a sentence. For now, you can imagine it's always a sentence in this particular setting. There's no universally agreed upon definition to it. So this is a very sort of, I guess in the second part of my talk, I'm going to show you some examples where the step is not at all a sentence. It's a full block of things. So, yeah."},{"start":1814.38,"text":"That's a great question. So the question is, is this the main cause of increase in error and can you not measure it in some way? So it turns out that the answer to both is yes, it's one of the main causes for increase in error. Can you measure it in some way? At least normal notions of fitting the data won't tell you this."},{"start":1833.21,"text":"That's a great question. So the question is, can we associate the overfitting problem with this? So you can actually measure this. In the paper, we did measure this. We measured the amount of spurious steps that you see, and it grows on over time. Obviously, I cannot give you a proof that this is the only cause. I can give you a proof that this should be a problem. I cannot give you a proof that this is the only problem. But this is sort of one of the big problems that you see. So the question is, how do you find out if it's a spurious step? In experiments, we do it in a particular way, and that also dictates a lot of methodologies that I'm going to show you in a second."}],"speech_gaps":[],"frame":"../frames/v020/011.webp","frame_time":1693.11},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":77,"text":"So this particular method, so the question is, do you sample entire trajectories? This particular method samples entire trajectories. You can sample parts of trajectories if you want it to be, but I think it needs some advanced machinery that I think can be done based on what I'm going to talk about in the next slide.","zh":"所以这个特定的方法，问题是，你是否采样完整的轨迹？这个特定的方法采样完整的轨迹。如果你想采样轨迹的部分内容，也是可以的，但我认为这需要一些高级的机制，我认为这可以基于我接下来幻灯片中要讲的内容来实现。","start":1860.45,"end":1876.45},{"id":78,"text":"The question is, do you overfit to a certain class of methods that got to the right answer? In a way, the answer is at a high level, yes, with the caveat that I don't know how to define what a method means, right? So you can call a method that... So just seeing this example, one can say that the calculation of 100 times 2...","zh":"问题是，你是否会过度拟合到某一类得到正确答案的方法上？从一个高层次的角度来看，答案是肯定的，但需要注意的是，我不确定如何定义什么是方法，对吧？所以你可以称一个方法……通过这个例子，人们可以说计算100乘以2……","start":1877.44,"end":1895.9},{"id":79,"text":"is a methodological phenomenon that the model wants to do to be able to then succeed and then realize that it was wrong. You can also say that really the method here is nothing but just doing a bunch of arithmetic. So it really depends on what you define that, and I think it's a semantic question at that point. So from a very symbolic perspective, one can say that there are a set of tokens that maybe still lead you to the right answer on a training set, but may not actually help you do the right thing on a test problem.","zh":"是一种方法论现象，模型想要这样做以便能够成功，然后意识到自己是错误的。你也可以认为，这里的真正方法不过是一系列算术运算。因此，这取决于你如何定义它，我认为这已经是一个语义问题。从一个非常符号化的角度来看，人们可以说有一组标记，它们可能在训练集上引导你得到正确的答案，但可能实际上无法帮助你在测试问题上做出正确的决策。","start":1896.17,"end":1921.37},{"id":80,"text":"So this is very similar to the problem of causal confusion in imitation learning, actually. I'm not sure if causal confusion... Okay, okay. Never mind. But basically there's this problem of if you produce a bunch of stuff in your policy that might be bad, like these Fourier steps, you might just not learn to imitate the expert in the right way possible. So maybe you actually end up at the right answer, but you're learning these incorrect associations.","zh":"这与模仿学习中的因果混淆问题非常相似。我不确定因果混淆……好吧，好吧。暂且不提。但基本上，如果你在策略中生成大量可能有害的内容，比如这些傅里叶步骤，你可能只是无法以正确的方式学习模仿专家。因此，你可能最终得到正确的答案，但你却学习了这些错误的关联。","start":1922.92,"end":1952.34},{"id":81,"text":"That's basically the gist of this problem of causal confusion that people in imitation learning know a lot about, actually. Okay, so how can we address this? And that's where RL comes in, and that's sort of the third axis of using incorrect data or incorrect rollouts for learning.","zh":"这就是模仿学习中人们非常了解的因果混淆问题的核心。那么，我们如何解决这个问题呢？这就是强化学习发挥作用的地方，这也是使用错误数据或错误轨迹进行学习的第三个轴线。","start":1952.52,"end":1966.7},{"id":82,"text":"The simple idea is, as many of you already asked questions about, assigning some notion of a credit to a step. So if I can understand what is the utility of every single step or every single state that my policy generates, then I can kind of somehow use that notion to filter off these bad kinds of solutions. So that's exactly kind of what we do or what RL for reasoning tries to do at a high level as well.","zh":"一个简单的想法是，正如你们中很多人已经问过的问题一样，为每一步赋予某种信用的概念。因此，如果我能理解我的策略生成的每一步或每一个状态的效用，那么我就可以利用这种概念来过滤掉这些不良的解决方案。这就是强化学习在推理中所做的，或者说在高层次上，强化学习在推理中试图做到的事情。","start":1967.43,"end":1992.81},{"id":83,"text":"So, identifying these Fourier steps and eliminating them in some way. So, the way to do this is the following, and this ties back to a lot of concepts of value functions and advantage functions that many of you are probably familiar with. So, I'm going to start with an illustration, and then I'll write down the exact math for what this means. So, let's say I gave you a particular rollout or a particular trace. So, again, starting from a prompt, adding these steps or actions, and going to a final answer, which maybe ended up being incorrect, so it's shown as a red dot.","zh":"因此，识别这些傅里叶步骤并以某种方式消除它们。要做到这一点，方法如下，这与许多你们可能已经熟悉的值函数和优势函数的概念密切相关。我将先进行一个示例，然后写出这具体意味着什么的数学表达式。假设我给你们一个特定的 rollout 或轨迹。再次从一个提示开始，添加这些步骤或动作，然后到达一个最终答案，这个答案可能最终是错误的，因此被显示为一个红色的点。","start":1994.06,"end":2022.55}],"notes":["本段讨论了强化学习在大语言模型推理中的应用，特别是如何通过RL来解决因果混淆问题。讲者提到，模型可能会过度拟合某些方法，从而在训练集上表现良好，但在测试问题上却无法正确执行。这类似于模仿学习中的因果混淆问题，即模型可能学习到错误的关联，导致最终结果正确但过程错误。","讲者指出，因果混淆问题在模仿学习中是一个已知的问题，即模型可能生成一些不良的步骤（如Fourier步骤），从而无法正确模仿专家的行为。这可能导致模型最终得到正确答案，但学习到的是错误的关联。","为了解决这个问题，强化学习被引入，通过为每个步骤或状态分配某种信用（credit），从而过滤掉这些不良的解决方案。这与价值函数和优势函数的概念相关，这些概念在强化学习中被广泛使用。","讲者提到，通过识别并消除这些不良步骤（Fourier steps），可以改进模型的推理能力。这涉及到对每个步骤的效用进行评估，并利用这些信息来优化模型的行为。","讲者还提到，通过示例来说明这一过程，即从提示开始，添加步骤或动作，最终得到一个可能错误的答案（用红色点表示）。这表明模型在推理过程中可能会生成错误的步骤，而强化学习的目标是识别并消除这些步骤。","最后，讲者指出，强化学习在推理中的应用涉及对每个步骤的效用进行评估，并利用这些信息来优化模型的行为。这与价值函数和优势函数的概念密切相关，这些概念在强化学习中被广泛使用。"],"formulas":[{"latex":"V(s) = \\text{Expected return from state } s","symbols":"V(s) 表示状态 s 的价值函数","explanation":"公式正确，价值函数定义为从状态 s 开始的期望回报，符合强化学习中的标准定义。","evidence":"The simple idea is, as many of you already asked questions about, assigning some notion of a credit to a step. So if I can understand what is the utility of every single step or every single state that my policy generates, then I can kind of somehow use that notion to filter off these bad kinds of solutions. So that's exactly kind of what we do or what RL for reasoning tries to do at a high level as well."}],"uncertainties":["Fourier steps"],"diagram":"none","start":1860.45,"end":2022.55,"asr_flags":[],"math_clarifications":["公式中的符号和定义清晰，无需进一步修改。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1860.45,"text":"So this particular method, so the question is, do you sample entire trajectories? This particular method samples entire trajectories. You can sample parts of trajectories if you want it to be, but I think it needs some advanced machinery that I think can be done based on what I'm going to talk about in the next slide."},{"start":1877.44,"text":"That's a great question. The question is, do you overfit to a certain class of methods that got to the right answer? In a way, the answer is at a high level, yes, with the caveat that I don't know how to define what a method means, right? So you can call a method that... So just seeing this example, one can say that the calculation of 100 times 2..."},{"start":1896.17,"text":"is a methodological phenomenon that the model wants to do to be able to then succeed and then realize that it was wrong. You can also say that really the method here is nothing but just doing a bunch of arithmetic. So it really depends on what you define that, and I think it's a semantic question at that point. So from a very symbolic perspective, one can say that there are a set of tokens that maybe still lead you to the right answer on a training set, but may not actually help you do the right thing on a test problem."},{"start":1922.92,"text":"So this is very similar to the problem of causal confusion in imitation learning, actually. I'm not sure if causal confusion... Okay, okay. Never mind. But basically there's this problem of if you produce a bunch of stuff in your policy that might be bad, like these Fourier steps, you might just not learn to imitate the expert in the right way possible. So maybe you actually end up at the right answer, but you're learning these incorrect associations."},{"start":1952.52,"text":"That's basically the gist of this problem of causal confusion that people in imitation learning know a lot about, actually. Okay, so how can we address this? And that's where RL comes in, and that's sort of the third axis of using incorrect data or incorrect rollouts for learning."},{"start":1967.43,"text":"The simple idea is, as many of you already asked questions about, assigning some notion of a credit to a step. So if I can understand what is the utility of every single step or every single state that my policy generates, then I can kind of somehow use that notion to filter off these bad kinds of solutions. So that's exactly kind of what we do or what RL for reasoning tries to do at a high level as well."},{"start":1994.06,"text":"So, identifying these Fourier steps and eliminating them in some way. So, the way to do this is the following, and this ties back to a lot of concepts of value functions and advantage functions that many of you are probably familiar with. So, I'm going to start with an illustration, and then I'll write down the exact math for what this means. So, let's say I gave you a particular rollout or a particular trace. So, again, starting from a prompt, adding these steps or actions, and going to a final answer, which maybe ended up being incorrect, so it's shown as a red dot."}],"speech_gaps":[],"frame":"../frames/v020/012.webp","frame_time":1872.45},{"title":"通过强化学习提升大语言模型推理","segments":[{"id":84,"text":"What I can do now is I can try to identify whether a step is spurious or not by taking these particular prefixes or taking these particular states that were basically concatenating all the tokens so far and doing what you can think of as rollouts in a way. So I can ask some model to try to complete the solution given a prefix of a generated solution.","zh":"我现在可以做的事情是，通过使用这些特定的前缀或这些特定的状态（这些状态基本上是将迄今为止的所有标记连接起来的），以某种方式来进行所谓的展开（rollouts），从而尝试识别某一步是否是虚假的。因此，我可以询问某个模型，给定一个生成解的前缀，尝试完成该解。","start":2023.4,"end":2045.48},{"id":85,"text":"So, you know, for example, in this particular setting that you see on the slide, I have kept the first three steps the same. And I'm asking a separate model or a separate rollout policy to try to complete the solution given this particular prefix.","zh":"例如，在你看到的这个特定设置中，我保持了前三个步骤不变。然后，我询问一个单独的模型或一个单独的展开策略，给定这个特定的前缀，尝试完成该解。","start":2046.08,"end":2058.28},{"id":86,"text":"So if I do this and let's say the rollout ends up succeeding, so many of these rollouts end up at the right answer, then likely the prefix was not too bad because clearly for this particular rollout policy, it did not end up affecting any of its problem-solving abilities.","zh":"如果我这样做，并且假设展开最终成功了，那么很多这样的展开最终都到达了正确答案，那么很可能这个前缀并不是太差，因为显然对于这个特定的展开策略，它并没有影响到其解决问题的能力。","start":2060.46,"end":2077.46},{"id":87,"text":"On the other hand, let's say if I ended up at a totally wrong answer, conditioned on the prefix that you see up here, clearly something is not okay here, and clearly there's something wrong with the prefix that you're seeing up here, because your rollout policy could not at all succeed, conditioned on that prefix, even after doing many possible rollouts.","zh":"另一方面，假设我最终到达了一个完全错误的答案，条件是在你上面看到的前缀，显然这里存在问题，显然你看到的这个前缀有问题，因为你的展开策略在给定这个前缀的情况下，即使进行了许多可能的展开，也无法成功。","start":2078.91,"end":2097.03},{"id":88,"text":"And if I ended up succeeding sometimes and sometimes not, maybe there's still some issue. Maybe it's not the best thing you can have, but at least it's slightly better than always failing that you see up here, for instance. So this basic principle of doing rollouts and estimating some notion of expected success in the future can kind of tell you something about what is wrong with the current prefix that you are particularly operating at.","zh":"如果我有时成功有时不成功，可能仍然存在问题。也许它并不是最好的选择，但至少它比你上面看到的总是失败的情况要好一些。因此，这种通过展开并估计未来某种成功期望的基本原则，可以告诉你当前操作的前缀存在什么问题。","start":2098.15,"end":2121.09},{"id":89,"text":"This is also very similar to a value function, right? Because this is basically computing the expected future zero one reward that my rollout policy, that this orange policy gets when it acts in this particular MDP. So the question is, the spurious step on the previous slide is that.","zh":"这也非常类似于一个价值函数，对吧？因为这基本上是在计算我的展开策略（即橙色策略）在这个特定的马尔可夫决策过程（MDP）中，采取行动时所获得的预期未来零一奖励。因此，问题在于上一张幻灯片中的虚假步骤是什么。","start":2122.38,"end":2140.85},{"id":90,"text":"actually irrelevant or incorrect. Or irrelevant slash, I mean, it's incorrect clearly because, or okay, the step is not incorrect in its own right, but it is sort of irrelevant in a way. Imagine for a second that if you pass to a language model a million irrelevant tokens and ask it to sort of dig out the information that actually matters, that can be a challenging problem on a test set. So that's why even if a step is irrelevant, it can be a problem for the model.","zh":"实际上无关或错误。或者无关，我的意思是，它显然是错误的，或者好吧，这一步本身并不错误，但以某种方式是无关的。想象一下，如果你向语言模型传递一百万个无关的标记，并让它找出真正重要的信息，这在测试集上可能是一个具有挑战性的问题。因此，即使某一步是无关的，它也可能对模型造成问题。","start":2142.57,"end":2170.39},{"id":91,"text":"Okay, so we did these rollouts. We computed the expected value of how many times can I succeed. And that resembles something that looks like a value function of sorts. And why is it a value function? Because if you sort of write this down in a bit of math, so let's say if I define the problem or the initial state as X, each of these steps as Y1s to YNs. So I guess there's a bit of a notation mismatch here. Y1s to YNs are independent rollouts. Here, the YIs I'm showing are basically each step or each action that you take.","zh":"好的，所以我们进行了这些 rollout（轨迹）。我们计算了成功次数的期望值。这看起来像是某种价值函数。为什么这是价值函数呢？因为如果你用一些数学公式把它写下来，比如说，如果我把问题或初始状态定义为 X，每个步骤定义为 Y1s 到 YNs。所以这里可能存在一些符号上的不匹配。Y1s 到 YNs 是独立的 rollout（轨迹）。在这里，我展示的 YIs 基本上是每个步骤或每个采取的动作。","start":2171.44,"end":2199.78}],"notes":["本段讲解了通过执行rollout来评估当前前缀是否存在问题的方法。通过观察rollout的成功率，可以判断当前前缀是否有效。如果rollout总是成功，说明前缀没有问题；如果总是失败，说明前缀存在问题；如果有时成功有时失败，说明前缀可能存在问题，但至少比完全失败要好。","讲者提到，这种评估方法与价值函数（value function）相似，因为价值函数计算的是在特定马尔可夫决策过程（MDP）中，策略在未来获得的预期奖励。这里通过rollout计算的预期成功次数，可以视为一种价值函数的近似。","讲者指出，前缀中的某些步骤可能无关或错误，即使这些步骤本身不错误，但它们可能对模型的推理过程产生干扰。例如，如果模型被输入大量无关的token，它可能难以从中提取出有用的信息。","讲者提到，通过定义初始状态为X，每个步骤为Y1到YN，可以将rollout的成功率与价值函数进行类比。然而，这里存在符号上的不一致，因为Y1到YN可能指的是独立的rollout，而实际展示的YIs指的是每个步骤或动作。","讲者强调，这种评估方法的核心在于通过rollout估计未来成功的期望值，从而判断当前前缀是否存在问题。这种方法可以用于识别和修正模型推理过程中的错误或无关步骤。","讲者还提到，这种评估方法与强化学习中的价值函数概念相似，因为价值函数衡量的是策略在特定状态下的预期回报。通过rollout计算的预期成功次数，可以视为一种价值函数的近似，用于指导模型的优化过程。"],"formulas":[],"uncertainties":["Y1s to YNs are independent rollouts"],"diagram":"none","start":2023.4,"end":2199.78,"asr_flags":[],"math_clarifications":["原文中未出现任何具体的数学公式或表达式，因此无法进行数学校对。所有内容均为自然语言描述，涉及的是算法或方法的逻辑流程，而非数学公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2023.4,"text":"What I can do now is I can try to identify whether a step is spurious or not by taking these particular prefixes or taking these particular states that were basically concatenating all the tokens so far and doing what you can think of as rollouts in a way. So I can ask some model to try to complete the solution given a prefix of a generated solution."},{"start":2046.08,"text":"So, you know, for example, in this particular setting that you see on the slide, I have kept the first three steps the same. And I'm asking a separate model or a separate rollout policy to try to complete the solution given this particular prefix."},{"start":2060.46,"text":"So if I do this and let's say the rollout ends up succeeding, so many of these rollouts end up at the right answer, then likely the prefix was not too bad because clearly for this particular rollout policy, it did not end up affecting any of its problem-solving abilities."},{"start":2078.91,"text":"On the other hand, let's say if I ended up at a totally wrong answer, conditioned on the prefix that you see up here, clearly something is not okay here, and clearly there's something wrong with the prefix that you're seeing up here, because your rollout policy could not at all succeed, conditioned on that prefix, even after doing many possible rollouts."},{"start":2098.15,"text":"And if I ended up succeeding sometimes and sometimes not, maybe there's still some issue. Maybe it's not the best thing you can have, but at least it's slightly better than always failing that you see up here, for instance. So this basic principle of doing rollouts and estimating some notion of expected success in the future can kind of tell you something about what is wrong with the current prefix that you are particularly operating at."},{"start":2122.38,"text":"This is also very similar to a value function, right? Because this is basically computing the expected future zero one reward that my rollout policy, that this orange policy gets when it acts in this particular MDP. So the question is, the spurious step on the previous slide is that."},{"start":2142.57,"text":"actually irrelevant or incorrect. Or irrelevant slash, I mean, it's incorrect clearly because, or okay, the step is not incorrect in its own right, but it is sort of irrelevant in a way. Imagine for a second that if you pass to a language model a million irrelevant tokens and ask it to sort of dig out the information that actually matters, that can be a challenging problem on a test set. So that's why even if a step is irrelevant, it can be a problem for the model."},{"start":2171.44,"text":"Okay, so we did these rollouts. We computed the expected value of how many times can I succeed. And that resembles something that looks like a value function of sorts. And why is it a value function? Because if you sort of write this down in a bit of math, so let's say if I define the problem or the initial state as X, each of these steps as Y1s to YNs. So I guess there's a bit of a notation mismatch here. Y1s to YNs are independent rollouts. Here, the YIs I'm showing are basically each step or each action that you take."}],"speech_gaps":[],"frame":"../frames/v020/013.webp","frame_time":2035.4},{"title":"强化学习中Q函数的定义与使用","segments":[{"id":92,"text":"So if you define a quantity that looks like the following, it's basically a Q function. So what is this quantity? It's telling you the Q value for your particular rollout policy, pi tilde. So the policy which is trying to complete the solution, rollout policy pi tilde. I'm computing its Q value at a given state, given by the initial state and the prefix of the solution so far.","zh":"所以如果你定义一个看起来像下面这样的量，它基本上就是一个Q函数。那么这个量是什么？它告诉你的是你特定的 rollout 策略 pi tilde 的 Q 值。这个策略是试图完成解的 rollout 策略 pi tilde。我在给定状态，由初始状态和目前为止的解的前缀所确定的状态下计算它的 Q 值。","start":2200.92,"end":2224.8},{"id":93,"text":"and given an action, which is the current step that your policy adds. I can define the Q value here as the expected long-term reward, meaning the expected 0-1 reward that I get under my rollout policy if I start by executing, you know,","zh":"并且给定一个动作，也就是你的策略在当前步骤添加的动作。我可以在这里定义 Q 值为期望的长期奖励，意思是如果你按照 rollout 策略开始执行，你所得到的期望 0-1 奖励。","start":2225.34,"end":2241.8},{"id":94,"text":"A Q function, just to recall, Q pi, I guess it's subscript pi. Q pi of SA is basically nothing but R of SA, or I guess depends upon how you write this, but it's basically the expected discounted reward that you get.","zh":"为了回忆一下，Q 函数，也就是 Q pi，我想是下标 pi。Q pi 的 SA 是基本上 R 的 SA，或者根据你怎么写这个，但基本上就是你所得到的期望折扣奖励。","start":2242.17,"end":2270.01},{"id":95,"text":"starting from t equal to zero to, you know, let's say infinity in general, conditioned on S zero being S and A zero being A.","zh":"从 t 等于零到，比如说无穷大，一般情况下，条件是 S 零等于 S 和 A 零等于 A。","start":2273.15,"end":2280.85},{"id":96,"text":"This is the definition of a Q function. In this particular setting, we are assuming discount factor is one. So gamma is set to exactly one. And the reward that you get is only at termination. So there's 0, 0, 0, 0 until you end up hitting the final answer. So that's why you see there's only one expectation up there. And this expectation is computed under policy pi. So you compute, you roll this policy pi out from there on. There's one minor detail here. You typically have R of SA.","zh":"这就是 Q 函数的定义。在这个特定的设置中，我们假设折扣因子是 1。所以 gamma 被设置为恰好 1。你所得到的奖励只在终止时出现。所以在你最终得到最终答案之前，都是 0，0，0，0。这就是为什么你看到上面只有一个期望值。这个期望值是在策略 pi 下计算的。所以你计算，从那里开始 rollout 这个策略 pi。这里有一个小细节，你通常有 R 的 SA。","start":2281.3,"end":2309.82},{"id":97,"text":"plus this thing, because you roll out the policy from the next step, and you sum up the reward at the current state. In this case, it doesn't matter, because R of SA is equal to zero. You only get a reward at the end. Gamma is set to one. So essentially, the thing that you see up here is essentially an expected future reward, starting from a given prefix, which is the state, at a given step, which is the action, and the rollout is performed under pi tilde that you see up here.","zh":"加上这个东西，因为你从下一步开始 rollout 策略，并且你累加当前状态的奖励。在这种情况下，这并不重要，因为 R 的 SA 等于零。你只在最后得到奖励。gamma 被设置为 1。因此，你在这里看到的东西基本上就是从给定前缀开始的期望未来奖励，这个前缀是状态，在给定步骤中的动作，并且 rollout 是在你上面看到的 pi tilde 策略下进行的。","start":2310.43,"end":2334.99},{"id":98,"text":"Okay, so the question is, would you use the same policy to roll out those other trajectories? So in principle, this equation that I wrote is agnostic of which policy you use to do the rollout. So there's been actually no...","zh":"好的，那么问题是，你会用同样的策略来 rollout 其他轨迹吗？原则上，我写的这个方程与你用来进行 rollout 的策略无关。实际上，这里没有任何...","start":2335.99,"end":2349.55},{"id":99,"text":"So I have a belief about this answer, about this particular choice of the policy. So in my opinion, the policy that you're doing, rollout switch, should be a different policy compared to the current one. Otherwise, it can fail in the same way. There's some work in literature which argues that even using the same policy can actually be good enough.","zh":"因此，我对这个答案有一个看法，关于这个特定的策略选择。在我看来，你正在执行的策略，即rollout切换，应该与当前策略不同。否则，它可能会以相同的方式失败。文献中有一些研究认为，即使使用相同的策略，实际上也可能足够好。","start":2350.57,"end":2367.53}],"notes":["本段讲解了Q函数的定义，强调Q函数是基于特定策略（rollout policy）的预期长期奖励。在该设定中，折扣因子γ被设为1，意味着没有折扣，奖励仅在终止时获得。因此，Q函数的计算仅涉及最终的奖励，而中间步骤的奖励为零。","Q函数的定义依赖于初始状态和当前动作，且计算过程是在给定策略π下进行的。在该上下文中，Q函数的计算方式与标准定义略有不同，因为中间步骤的奖励为零，且仅在最终状态获得奖励。","讲者提到，使用相同的策略进行rollout可能会导致失败，因此建议使用不同的策略。然而，也有文献指出，使用相同策略可能在某些情况下是有效的。","在定义Q函数时，讲者提到通常会包含R(S,A)项，但在该特定情况下，由于中间奖励为零，因此该项不影响最终结果。"],"formulas":[{"latex":"\\gamma = 1","symbols":"折扣因子γ被设为1，意味着没有折扣","explanation":"公式正确，折扣因子γ被设为1，符合上下文描述。","evidence":"This is the definition of a Q function. In this particular setting, we are assuming discount factor is one. So gamma is set to exactly one. And the reward that you get is only at termination. So there's 0, 0, 0, 0 until you end up hitting the final answer. So that's why you see there's only one expectation up there. And this expectation is computed under policy pi. So you compute, you roll this policy pi out from there on. There's one minor detail here. You typically have R of SA."}],"uncertainties":["在讲者提到的Q函数定义中，是否明确区分了状态和动作的索引？"],"diagram":"none","start":2200.92,"end":2367.53,"asr_flags":[],"math_clarifications":["Q函数的定义应为预期未来奖励，而非折扣奖励，因为折扣因子γ被设为1。奖励仅在终止时获得，因此R(s, a)应为在状态s和动作a时的即时奖励，而非中间步骤的奖励为零。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2200.92,"text":"So if you define a quantity that looks like the following, it's basically a Q function. So what is this quantity? It's telling you the Q value for your particular rollout policy, pi tilde. So the policy which is trying to complete the solution, rollout policy pi tilde. I'm computing its Q value at a given state, given by the initial state and the prefix of the solution so far."},{"start":2225.34,"text":"and given an action, which is the current step that your policy adds. I can define the Q value here as the expected long-term reward, meaning the expected 0-1 reward that I get under my rollout policy if I start by executing, you know,"},{"start":2242.17,"text":"if I start by getting actions I plus one to L from this rollout policy. So what's the Q function? A Q function, just to recall, Q pi, I guess it's subscript pi. Q pi of SA is basically nothing but R of SA, or I guess depends upon how you write this, but it's basically the expected discounted reward that you get."},{"start":2273.15,"text":"starting from t equal to zero to, you know, let's say infinity in general, conditioned on S zero being S and A zero being A."},{"start":2281.3,"text":"This is the definition of a Q function. In this particular setting, we are assuming discount factor is one. So gamma is set to exactly one. And the reward that you get is only at termination. So there's 0, 0, 0, 0 until you end up hitting the final answer. So that's why you see there's only one expectation up there. And this expectation is computed under policy pi. So you compute, you roll this policy pi out from there on. There's one minor detail here. You typically have R of SA."},{"start":2310.43,"text":"plus this thing, because you roll out the policy from the next step, and you sum up the reward at the current state. In this case, it doesn't matter, because R of SA is equal to zero. You only get a reward at the end. Gamma is set to one. So essentially, the thing that you see up here is essentially an expected future reward, starting from a given prefix, which is the state, at a given step, which is the action, and the rollout is performed under pi tilde that you see up here."},{"start":2335.99,"text":"Okay, so the question is, would you use the same policy to roll out those other trajectories? So in principle, this equation that I wrote is agnostic of which policy you use to do the rollout. So there's been actually no..."},{"start":2350.57,"text":"So I have a belief about this answer, about this particular choice of the policy. So in my opinion, the policy that you're doing, rollout switch, should be a different policy compared to the current one. Otherwise, it can fail in the same way. There's some work in literature which argues that even using the same policy can actually be good enough."}],"speech_gaps":[],"frame":"../frames/v020/014.webp","frame_time":2212.92},{"title":"强化学习中Q函数与优势函数的定义与应用","segments":[{"id":100,"text":"I think we haven't seen an apples to apples comparison given the sort of scale of experiments, which definitely shows one way or the other. I think most of the evidence that exists right now points towards the benefits from having a different policy because that makes sense also. But I think there's a part of the community, especially sort of the NLP community, which kind of does it using the same policy and finds it to work reasonably fine.","zh":"我认为我们还没有看到一个真正公平的比较，考虑到实验的规模，这无疑会显示出某种结果。我认为目前存在的大部分证据都指向了拥有不同策略的好处，这也有道理。但我觉得社区中有一部分人，尤其是自然语言处理社区，他们使用相同的策略，并发现这种方法运行得相当不错。","start":2368.94,"end":2390.98},{"id":101,"text":"That's a great question. So the question is, is this similar to trajectory stitching and advantage weights? It so turns out that the answer is exactly yes. It is very related to that. I don't think I have a discussion of this stitching angle in my slides because I think it would have been a bit too technical. But yeah, if you check the paper, you'll find exactly it talks about sort of stitching in this particular setting. And it's very related concepts. So yeah, you can think of it that way.","zh":"这是一个很好的问题。问题是，这是否与轨迹拼接和优势权重类似？事实证明，答案是肯定的。它与这些概念非常相关。我认为我的幻灯片中没有讨论这个拼接角度，因为我觉得这会有点太技术化了。但没错，如果你查看论文，你会发现它确实讨论了在这种特定情况下所谓的拼接。而且这些是非常相关的概念。所以没错，你可以这样去想。","start":2391.91,"end":2417.03},{"id":102,"text":"Okay, great. So this is the definition of a Q function. And once you've defined this Q function, it so turns out that you can use this Q function to now tell you whether steps are spurious or not, are good or not, in the same way as defining advantages would have done.","zh":"好的，很好。这是Q函数的定义。一旦你定义了这个Q函数，事实证明你可以利用这个Q函数来判断步骤是否是虚假的、是否是好的，就像定义优势函数所做的那样。","start":2417.92,"end":2434.16},{"id":103,"text":"So I'm pretty sure you talked about sort of advantage weighted regression as an offline RL method. I'm going to do something very similar to that, but just sort of to kind of spend one minute on the definition of the advantage here. So the advantage function typically means QSA minus V of S that you probably talked about. So A of SA under a given policy is Q pi of SA minus V pi of S.","zh":"我pretty sure你讨论过优势加权回归作为一种离线强化学习方法。我将做非常类似的事情，只是花一分钟来定义这里的优点。通常，优势函数意味着Q(S, A)减去V(S)，这可能是你讨论过的。因此，在给定策略下，A(S, A)等于Q^π(S, A)减去V^π(S)。","start":2434.39,"end":2459.67},{"id":104,"text":"In this particular setting, though, the dynamics are deterministic, and the state is simply a concatenation of the previous state with a new set of tokens which define the step that is added in there. Hence, what happens is you can define the advantage as Q value of the prefix until step i minus Q value of the prefix until step i minus 1.","zh":"不过，在这种特定情况下，动态是确定性的，状态仅仅是前一个状态与一组新标记的简单拼接，这些标记定义了被添加的步骤。因此，会发生的是，你可以将优势定义为前i步的Q值减去前i-1步的Q值。","start":2461.17,"end":2483.77},{"id":105,"text":"that sort of serves as the same notion of advantage in this particular MDP. So that's why the definition you see up there is Q minus Q and not Q minus V, but it's sort of basically the same thing. So once you define it in this way, you can actually compute these advantages for every step. So you can compute advantages by subtracting the Q values for consecutive steps, one from each other, and you'll get some positive and some negative numbers in this particular setting.","zh":"这种定义在某种程度上充当了该特定马尔可夫决策过程（MDP）中的优势概念。这就是为什么你上面看到的定义是Q减去Q，而不是Q减去V，但基本上是同样的意思。一旦以这种方式定义，你实际上可以计算出每一步的优势。因此，你可以通过减去连续步骤的Q值来计算优势，一个步骤减去另一个步骤，你会在这个特定的设置中得到一些正数和一些负数。","start":2484.75,"end":2508.05},{"id":106,"text":"It just really depends on how many times can you succeed. And once you have these advantages, they are a measure of how well a particular step, how much a particular step contributed to your ability to be able to succeed from that particular prefix. So if step two ended up reducing the advantage, that means your Q value at step one was higher than Q value after step two has been executed, which means step two is probably not that good of a step to have in order to be able to succeed eventually.","zh":"这仅仅取决于你能成功多少次。一旦你有了这些优势，它们衡量的是特定步骤对从该特定前缀中成功的能力的贡献程度。如果第二步导致优势减少，这意味着第一步的Q值高于执行完第二步后的Q值，这表明第二步可能并不是一个有助于最终成功的良好步骤。","start":2508.94,"end":2537.52}],"notes":["本段讲解了Q函数的定义及其在强化学习中的应用，特别是如何通过Q函数判断步骤是否为有益的步骤。优势函数被定义为Q值与状态值的差值，用于评估每个步骤对最终成功的影响。","在确定性动态的环境下，状态由前一个状态和新添加的标记组成。优势函数被定义为前一步Q值与当前步Q值的差值，这与传统的优势函数定义类似，但使用Q值代替了状态值。","优势函数的计算方法是通过连续步骤的Q值相减，得到正负值，从而判断每个步骤对整体成功的影响。如果某个步骤导致优势减少，说明该步骤可能对成功没有帮助。","在强化学习中，优势函数的定义和计算方法对于评估策略的有效性至关重要。通过优势函数，可以识别出哪些步骤是有效的，哪些步骤是冗余或有害的。","本段还提到，优势函数的计算方法与传统的轨迹缝合和优势权重方法有相似之处，但具体实现方式有所不同，特别是在确定性动态的环境下。","优势函数的计算不仅有助于评估策略的有效性，还可以用于优化策略，通过调整步骤的选择来提高整体的成功率。"],"formulas":[{"latex":"A(s, a) = Q^\\pi(s, a) - V^\\pi(s)","symbols":"优势函数等于Q值减去状态值","explanation":"公式正确表达了优势函数的定义，即Q值减去状态值。","evidence":"So I'm pretty sure you talked about sort of advantage weighted regression as an offline RL method. I'm going to do something very similar to that, but just sort of to kind of spend one minute on the definition of the advantage here. So the advantage function typically means QSA minus V of S that you probably talked about. So A of SA under a given policy is Q pi of SA minus V pi of S."},{"latex":"A_i = Q_i - Q_{i-1}","symbols":"优势函数定义为当前步骤Q值与前一步Q值的差值","explanation":"公式正确表达了在确定性动态系统中，优势函数定义为当前步骤Q值与前一步Q值的差值。","evidence":"that sort of serves as the same notion of advantage in this particular MDP. So that's why the definition you see up there is Q minus Q and not Q minus V, but it's sort of basically the same thing. So once you define it in this way, you can actually compute these advantages for every step. So you can compute advantages by subtracting the Q values for consecutive steps, one from each other, and you'll get some positive and some negative numbers in this particular setting."}],"uncertainties":[],"diagram":"none","start":2368.94,"end":2537.52,"asr_flags":[],"math_clarifications":["公式中的符号和定义与上下文一致，没有发现数学错误。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2368.94,"text":"I think we haven't seen an apples to apples comparison given the sort of scale of experiments, which definitely shows one way or the other. I think most of the evidence that exists right now points towards the benefits from having a different policy because that makes sense also. But I think there's a part of the community, especially sort of the NLP community, which kind of does it using the same policy and finds it to work reasonably fine."},{"start":2391.91,"text":"That's a great question. So the question is, is this similar to trajectory stitching and advantage weights? It so turns out that the answer is exactly yes. It is very related to that. I don't think I have a discussion of this stitching angle in my slides because I think it would have been a bit too technical. But yeah, if you check the paper, you'll find exactly it talks about sort of stitching in this particular setting. And it's very related concepts. So yeah, you can think of it that way."},{"start":2417.92,"text":"Okay, great. So this is the definition of a Q function. And once you've defined this Q function, it so turns out that you can use this Q function to now tell you whether steps are spurious or not, are good or not, in the same way as defining advantages would have done."},{"start":2434.39,"text":"So I'm pretty sure you talked about sort of advantage weighted regression as an offline RL method. I'm going to do something very similar to that, but just sort of to kind of spend one minute on the definition of the advantage here. So the advantage function typically means QSA minus V of S that you probably talked about. So A of SA under a given policy is Q pi of SA minus V pi of S."},{"start":2461.17,"text":"In this particular setting, though, the dynamics are deterministic, and the state is simply a concatenation of the previous state with a new set of tokens which define the step that is added in there. Hence, what happens is you can define the advantage as Q value of the prefix until step i minus Q value of the prefix until step i minus 1."},{"start":2484.75,"text":"that sort of serves as the same notion of advantage in this particular MDP. So that's why the definition you see up there is Q minus Q and not Q minus V, but it's sort of basically the same thing. So once you define it in this way, you can actually compute these advantages for every step. So you can compute advantages by subtracting the Q values for consecutive steps, one from each other, and you'll get some positive and some negative numbers in this particular setting."},{"start":2508.94,"text":"It just really depends on how many times can you succeed. And once you have these advantages, they are a measure of how well a particular step, how much a particular step contributed to your ability to be able to succeed from that particular prefix. So if step two ended up reducing the advantage, that means your Q value at step one was higher than Q value after step two has been executed, which means step two is probably not that good of a step to have in order to be able to succeed eventually."}],"speech_gaps":[],"frame":"../frames/v020/015.webp","frame_time":2380.94},{"title":"强化学习中优势函数与过程奖励模型","segments":[{"id":107,"text":"So, a negative or a low advantage means it's sort of a bad step or kind of a spurious step and you don't want to necessarily learn from it. A positive advantage means it's a good step and you probably want to learn from it. So, this is sort of supposed to answer the questions about how do you identify spurious steps in something.","zh":"因此，一个负值或低优势意味着这一步可能是糟糕的步骤或虚假的步骤，你不一定要从中学到东西。一个正优势意味着这一步是好的步骤，你可能想要从中学到东西。因此，这在某种程度上应该回答了如何识别虚假步骤的问题。","start":2538.32,"end":2555.14},{"id":108,"text":"So the question is, are we fitting a Q function? It's a very good question. Turns out that in the literature, there's been two kinds of work. They explicitly fit a Q function like quantity. It's what's called, so in the NLP community, this is what's called a process reward model.","zh":"所以问题是，我们是在拟合一个Q函数吗？这是一个非常好的问题。事实上，在文献中，有两种类型的研究所涉及。它们明确地拟合一个Q函数，如数量。这被称为，在自然语言处理社区中，这就是所谓的过程奖励模型。","start":2555.97,"end":2574.74},{"id":109,"text":"reward model. I'm guessing since you covered DPO and RLHF, you've talked about reward models, which give you a score for a particular question and answer. This is giving you the score for every step, and hence scoring the process, and hence the word process reward model, or a PRM.","zh":"奖励模型。我猜因为你讲过DPO和RLHF，你已经讨论过奖励模型，它会为特定的问题和答案给出一个得分。这里给出的是每一步的得分，因此对整个过程进行评分，因此称为过程奖励模型，或PRM。","start":2575.82,"end":2595.26},{"id":110,"text":"Don't necessarily think that PRM and Q values should be semantically the same thing, but that's kind of what a lot of the NLP people call this. But yeah, you can kind of train that. But there's the other class of methods which would simply use rollouts the way I talked to you about to estimate advantages, and we'll see what that means.","zh":"不要认为PRM和Q值在语义上应该完全相同，但这是很多自然语言处理研究者所称的。但确实，你可以训练这种模型。但还有一种方法类别的方法，它们会简单地使用我之前提到的rollouts来估计优势，我们之后会看到这意味着什么。","start":2597.11,"end":2613.43},{"id":111,"text":"Yeah, that's a great question. The question is, how does this help models learn general problem-solving strategies? The rough answer is, ultimately, what ends up happening here is you are breaking down the success of a particular long trace into successes of individual steps that appear inside of it. And that can be a useful thing to know because now, presumably, your model can...","zh":"是的，这是一个很好的问题。问题是，这如何帮助模型学习一般的解决问题策略？粗略的答案是，最终，这里发生的事情是，你将一个特定长轨迹的成功分解为其中包含的各个步骤的成功。这可能是一个有用的信息，因为现在，你的模型可以……","start":2614.32,"end":2636.68},{"id":112,"text":"realize that, okay, once it, let's say it has broken down a problem into four steps or four high-level plans, if it can also localize which step is kind of going wrong, it can actually, you know, better learn that step as opposed to sort of, you know, just vaguely thinking that, okay, a step three might be the cause of the problem when it fails, whereas maybe it's actually step one. So it helps you just learn sort of in a more, so ultimately you need to have some data for learning, but then this is sort of vastly improving your data efficiency and so on. Yeah.","zh":"意识到，比如说，它已经将一个问题分解为四个步骤或四个高层次的计划，如果它还能定位哪个步骤出了问题，它实际上可以更好地学习那个步骤，而不是模糊地认为，当它失败时，可能是第三步出了问题，而实际上可能是第一步。这有助于你更有效地学习。因此，最终你需要一些数据来进行学习，但这种做法在很大程度上提高了你的数据效率，等等。是的。","start":2637.1,"end":2664.38},{"id":113,"text":"Great. Okay. So the next step is going to be to use these advantages for training. And this is where sort of a lot of the methods that I talked about also will come into picture. So the first thing is just going to be to filter by advantages that I just described. So you can take a bunch of traces from your model. And I still have the RFT algorithm here. So I'm just going to...","zh":"很好。好的。下一步就是利用这些优势值来进行训练。这也是我之前提到的一些方法将要发挥作用的地方。首先要做的是根据我刚才描述的优势值进行过滤。你可以从你的模型中获取一批轨迹。我这里仍然有RFT算法。所以我只是要...","start":2665.96,"end":2686.66},{"id":114,"text":"I'm going to write it down as 1 to n, sample from pi theta. You can take the RFT algorithm. You can sample from your model, a non-policy trace potentially. You can take every step, do these rollouts that we talked about, use them to estimate advantages, and put this into your training data set for doing imitation learning or SFT if this particular step is correct.","zh":"我将把它写成从1到n，从πθ中进行采样。你可以使用RFT算法。你可以从你的模型中进行采样，这可能是非策略的轨迹。你可以对每一步进行处理，执行我们之前讨论过的rollouts，利用它们来估计优势值，并将这些结果放入你的训练数据集中，用于模仿学习或SFT，如果这一步是正确的的话。","start":2687.04,"end":2710.42}],"notes":["本段讨论了强化学习中优势函数的概念，指出负的或低的优势意味着步骤可能是错误的或虚假的，不应从中学习，而正的优势意味着步骤是好的，应从中学习。这回答了如何识别虚假步骤的问题。","本段提到是否在拟合Q函数的问题，指出文献中存在两种方法：一种是显式拟合Q函数，称为过程奖励模型（PRM），另一种是使用rollouts估计优势。PRM与Q值在语义上不一定相同，但NLP社区通常这样称呼。","本段进一步解释了PRM的作用，即为每个步骤打分，从而对整个过程进行评分，这与传统的奖励模型不同，后者为问题和答案打分。","本段指出，虽然PRM和Q值在语义上可能不同，但NLP社区通常将它们视为同一类方法。同时，还提到另一种方法是使用rollouts估计优势，这将在后续讨论。","本段讨论了优势函数如何帮助模型学习一般性问题解决策略。通过将长轨迹的成功分解为各个步骤的成功，模型可以更精确地定位问题所在步骤，从而更有效地学习。","本段提到，使用优势函数进行训练时，需要过滤出优势较高的轨迹，并将其用于模仿学习或监督微调（SFT）。这有助于提高数据效率，使模型在较少数据下也能学习到更有效的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2538.32,"end":2710.42,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2538.32,"text":"So, a negative or a low advantage means it's sort of a bad step or kind of a spurious step and you don't want to necessarily learn from it. A positive advantage means it's a good step and you probably want to learn from it. So, this is sort of supposed to answer the questions about how do you identify spurious steps in something."},{"start":2555.97,"text":"So the question is, are we fitting a Q function? It's a very good question. Turns out that in the literature, there's been two kinds of work. They explicitly fit a Q function like quantity. It's what's called, so in the NLP community, this is what's called a process reward model. Process."},{"start":2575.82,"text":"reward model. I'm guessing since you covered DPO and RLHF, you've talked about reward models, which give you a score for a particular question and answer. This is giving you the score for every step, and hence scoring the process, and hence the word process reward model, or a PRM."},{"start":2597.11,"text":"Don't necessarily think that PRM and Q values should be semantically the same thing, but that's kind of what a lot of the NLP people call this. But yeah, you can kind of train that. But there's the other class of methods which would simply use rollouts the way I talked to you about to estimate advantages, and we'll see what that means."},{"start":2614.32,"text":"Yeah, that's a great question. The question is, how does this help models learn general problem-solving strategies? The rough answer is, ultimately, what ends up happening here is you are breaking down the success of a particular long trace into successes of individual steps that appear inside of it. And that can be a useful thing to know because now, presumably, your model can..."},{"start":2637.1,"text":"realize that, okay, once it, let's say it has broken down a problem into four steps or four high-level plans, if it can also localize which step is kind of going wrong, it can actually, you know, better learn that step as opposed to sort of, you know, just vaguely thinking that, okay, a step three might be the cause of the problem when it fails, whereas maybe it's actually step one. So it helps you just learn sort of in a more, so ultimately you need to have some data for learning, but then this is sort of vastly improving your data efficiency and so on. Yeah."},{"start":2665.96,"text":"Great. Okay. So the next step is going to be to use these advantages for training. And this is where sort of a lot of the methods that I talked about also will come into picture. So the first thing is just going to be to filter by advantages that I just described. So you can take a bunch of traces from your model. And I still have the RFT algorithm here. So I'm just going to..."},{"start":2687.04,"text":"I'm going to write it down as 1 to n, sample from pi theta. You can take the RFT algorithm. You can sample from your model, a non-policy trace potentially. You can take every step, do these rollouts that we talked about, use them to estimate advantages, and put this into your training data set for doing imitation learning or SFT if this particular step is correct."}],"speech_gaps":[],"frame":"../frames/v020/016.webp","frame_time":2550.32},{"title":"强化学习中优势加权回归与训练策略","segments":[{"id":115,"text":"So what does that mean? That basically means that you are taking a particular trace and you are checking at a step level whether the advantages are positive. Even if that particular step comes from an incorrect solution trace, you're going to put that into your training data set if that step itself gives you a high advantage. On the other hand, let's say if that step itself comes from a correct solution trace, maybe there's a particular step here which gets a low advantage or a really negative advantage. I'm going to just throw it away.","zh":"那这意味着什么呢？基本上意味着你正在检查一个特定轨迹的每一步，看看优势是否为正。即使这一步来自一个错误的解决方案轨迹，如果你这一步本身能给你带来高优势，你也会把它加入训练数据集中。另一方面，假设这一步本身来自一个正确的解决方案轨迹，也许这里有一个特定的步骤得到了低优势或非常负的优势。我会直接丢弃它。","start":2711.02,"end":2739.76},{"id":116,"text":"So this is very much reminiscent of advantage weighted regression, except that here, rather than doing exponentiated advantages, which I'm guessing was covered, we are doing sort of like filtering on advantages. That's sort of the basic idea. You can also do exponentiation of advantages. So you can train on everything, but multiply the loss by e to the a. That objective, I think, requires a lot of tuning. And if you can only run one experiment, you probably prefer this objective over e to the a in general.","zh":"这与优势加权回归非常相似，只是在这里，我们不是进行指数化的优势，我猜这部分内容已经讲过，而是进行某种优势的过滤。这就是基本的想法。你也可以对优势进行指数化。因此你可以训练所有内容，但将损失乘以 e 的 a 次方。我认为这个目标需要大量的调参。如果你只能运行一次实验，你通常会更倾向于这个目标而不是 e 的 a 次方。","start":2740.94,"end":2769.84},{"id":117,"text":"That's a great question. So the question is, do you only train up to the good steps on an incorrect solution? The answer is not really. So we initially thought that that's kind of the only way to train here. And we did a concrete ablation studying this as well. The answer is, well, you never really train the model to. So in this particular setting, you're not. Let's say a particular step gives you a higher advantage. You're not training the model to produce this step and then this step. All your training is to produce this step conditioned on the prefix so far.","zh":"这是一个很好的问题。问题是，你是否只在错误的解决方案中训练到好的步骤？答案并不是这样。我们最初认为这是唯一的训练方式。我们也进行了具体的消融实验来研究这一点。答案是，你实际上从未真正训练模型去做到这一点。在这一特定设置中，你并没有这样做。假设某个步骤给你带来了更高的优势，你并不是在训练模型去生成这个步骤和随后的步骤。你所有的训练都是在给定当前前缀的情况下生成这个步骤。","start":2771.2,"end":2799.46},{"id":118,"text":"So your loss looks like...","zh":"所以你的损失看起来像……","start":2799.99,"end":2801.73},{"id":119,"text":"train the model to produce AI given SI and not the previous actions or the previous steps that you see up here. So I'm just going to probably just draw it here because I think it's easiest to draw it. So think of it as this way. You had X or S0. You took A0. You went to S1. You are taking A1, S2. These are steps, and this is the states. Let's say this state got an advantage, which is really positive. So A of S1, A1.","zh":"训练模型以在给定 SI 和不给定之前的动作或你在这里看到的之前的步骤的情况下生成 AI。我可能只是在这里画出来，因为我觉得这样画起来最简单。想象一下，你有 X 或 S0。你采取了 A0。你到达了 S1。你正在采取 A1，到达了 S2。这些都是步骤，这是状态。假设这个状态得到了一个非常正的优势。所以 A1 的优势是 A of S1。","start":2802.37,"end":2831.71},{"id":120,"text":"is really positive, and A of S0, A0 is really negative. What you are going to do now is you're going to not necessarily, so what I'm not saying is train your policy to produce A0 given S0. You're not going to do that. You're going to just train the policy to produce A1 given S0, A0.","zh":"优势确实是正的，而A在S0、A0的情况下是负的。你现在要做的事情并不是一定如此，所以我并不是说要训练你的策略以在给定S0的情况下产生A0。你不会这么做。你只是要训练策略以在给定S0、A0的情况下产生A1。","start":2832.49,"end":2852.39},{"id":121,"text":"So that's all you're trying. Or, you know, I wrote S0 comma A0. This basically just is equal to S1 because you're concatenating steps. But that's kind of the thing you're going to incentivize. So you're only training on the steps. So the question is, is there a separate prompter that keeps prompting the model when it acts here? The answer is not really, right? So in general, when you do RL, we never really train the policy to sort of, we train a policy, you know, with.","zh":"这就是你所要尝试的全部。或者，你可能会写成S0、A0。这基本上就等于S1，因为你是在拼接步骤。但这就是你要激励的事情。因此，你只在步骤上进行训练。问题是，是否存在一个独立的提示者，在模型在此处行动时持续提示模型？答案是否定的，对吧？因此，一般来说，在进行强化学习时，我们从不真正训练策略以某种方式，我们只是训练一个策略，你知道的。","start":2853.34,"end":2878.82}],"notes":["本段讨论了强化学习中优势加权回归的变体，强调了通过过滤优势来训练策略，而不是使用指数优势。讲者提到，虽然可以使用指数优势，但这种方法需要大量调参，因此在只能运行一次实验时，更倾向于使用过滤优势的方法。","讲者回答了一个关于是否仅在正确解的步骤上训练的问题，指出实际上并不训练模型生成特定步骤，而是基于前缀条件生成当前步骤。这表明训练过程关注的是当前步骤的优势，而不是整个路径。","讲者通过状态和动作的序列来解释训练过程，指出模型的训练目标是基于当前状态和前一步动作生成下一步动作，而不是直接基于初始状态生成整个路径。","讲者提到在强化学习中，通常不训练策略去生成特定的步骤，而是基于当前状态和前一步动作进行训练，这表明训练过程是逐步进行的，而不是一次性生成整个路径。","讲者还提到，训练过程中并不需要额外的提示器来持续提示模型，这表明训练过程是基于当前状态和前一步动作的自然生成过程。","讲者强调了训练策略的逐步性和基于优势的过滤方法，这与传统的强化学习方法有所不同，更注重当前步骤的优势而非整个路径的优化。"],"formulas":[],"uncertainties":["e to the a"],"diagram":"none","start":2711.02,"end":2878.82,"asr_flags":[],"math_clarifications":["公式中的指数优势形式与原文描述的'过滤优势'概念不符，原文提到的是使用优势进行加权而非指数化。此外，公式中未明确说明优势a的定义和来源，因此无法准确核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2711.02,"text":"So what does that mean? That basically means that you are taking a particular trace and you are checking at a step level whether the advantages are positive. Even if that particular step comes from an incorrect solution trace, you're going to put that into your training data set if that step itself gives you a high advantage. On the other hand, let's say if that step itself comes from a correct solution trace, maybe there's a particular step here which gets a low advantage or a really negative advantage. I'm going to just throw it away."},{"start":2740.94,"text":"So this is very much reminiscent of advantage weighted regression, except that here, rather than doing exponentiated advantages, which I'm guessing was covered, we are doing sort of like filtering on advantages. That's sort of the basic idea. You can also do exponentiation of advantages. So you can train on everything, but multiply the loss by e to the a. That objective, I think, requires a lot of tuning. And if you can only run one experiment, you probably prefer this objective over e to the a in general."},{"start":2771.2,"text":"That's a great question. So the question is, do you only train up to the good steps on an incorrect solution? The answer is not really. So we initially thought that that's kind of the only way to train here. And we did a concrete ablation studying this as well. The answer is, well, you never really train the model to. So in this particular setting, you're not. Let's say a particular step gives you a higher advantage. You're not training the model to produce this step and then this step. All your training is to produce this step conditioned on the prefix so far."},{"start":2799.99,"text":"So your loss looks like..."},{"start":2802.37,"text":"train the model to produce AI given SI and not the previous actions or the previous steps that you see up here. So I'm just going to probably just draw it here because I think it's easiest to draw it. So think of it as this way. You had X or S0. You took A0. You went to S1. You are taking A1, S2. These are steps, and this is the states. Let's say this state got an advantage, which is really positive. So A of S1, A1."},{"start":2832.49,"text":"is really positive, and A of S0, A0 is really negative. What you are going to do now is you're going to not necessarily, so what I'm not saying is train your policy to produce A0 given S0. You're not going to do that. You're going to just train the policy to produce A1 given S0, A0."},{"start":2853.34,"text":"So that's all you're trying. Or, you know, I wrote S0 comma A0. This basically just is equal to S1 because you're concatenating steps. But that's kind of the thing you're going to incentivize. So you're only training on the steps. So the question is, is there a separate prompter that keeps prompting the model when it acts here? The answer is not really, right? So in general, when you do RL, we never really train the policy to sort of, we train a policy, you know, with."}],"speech_gaps":[],"frame":"../frames/v020/017.webp","frame_time":2723.02},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":122,"text":"to produce individual actions, like in offline RL or in imitation learning, we train it to produce A1 given S1, A2 given S2, and so on. But when it acts in the world, it just acts and produces a giant sequence of actions in one go, right? So you can train the policy on different segments of steps it's seeing, but when it's deployed, it's going to just produce one action, then the state S1 is going to be simply the whole...","zh":"为了生成个体动作，比如在离线强化学习或模仿学习中，我们训练模型根据S1生成A1，根据S2生成A2，依此类推。但当它在现实世界中行动时，它会一次性生成一连串的动作，对吧？因此，你可以根据它所看到的不同步骤片段来训练策略，但当它被部署时，它只会生成一个动作，然后状态S1就仅仅是整个……","start":2879.34,"end":2903.06},{"id":123,"text":"tokens in the question, tokens in the step so far, and that's S1, and you're going to now, the same policy can now continue on and produce the next step. So it's not going to be prompted in any way. It's just going to be producing the whole solution in one flow, except that now you're just training it in a way that you're breaking them down into steps. So really there's no notion of a separate act.","zh":"问题中的标记、到目前为止的步骤中的标记，就是S1，然后同样的策略可以继续生成下一步。因此，它不会以任何方式被提示。它会一次性生成整个解决方案，只是现在你只是以分步骤的方式训练它。因此，实际上并不存在单独的行动概念。","start":2904.23,"end":2922.99},{"id":124,"text":"So the question is, do you only train on a step because of the Markov property, because you don't care how you got there? In a way, the answer is actually no, because in some ways your state S1 consists of all of your history, right? So S1 consists of, so S0 is a problem. A0 is, let's say, step one. And S1 in this case is basically problem concatenated with step one, right?","zh":"问题是，你是否只因为马尔可夫性质而只在单个步骤上进行训练，因为你不关心你是如何到达那里的？某种程度上，答案是否定的，因为在某些方面，你的状态S1包含了你所有的历史信息，对吧？因此，S1包含的是，S0是一个问题。A0是，比如说，第一步。在这种情况下，S1基本上是问题与第一步的拼接，对吧？","start":2923.88,"end":2951.13},{"id":125,"text":"So in some ways, you have preserved all of your history in this case, and it's a non-Markovian policy that you're learning, except that here, the reason why we do this at the step level is because now we can better understand which part of the solution actually caused me to derail if it did. So there's no notion of independence. It's not like given S. So, OK, in this particular setting, given S1.","zh":"因此，在某种程度上，你保留了所有的历史信息，而你学习的是一个非马尔可夫策略，除了在这里，我们在步骤层面这样做是因为现在我们可以更好地理解解决方案中的哪一部分导致了失败。因此，不存在独立性的概念。它不像给定S。所以，好吧，在这种特定的设置中，给定S1。","start":2953.01,"end":2974.85},{"id":126,"text":"Sure, action A1 is all matters, but S1 and S0A0 are the same. So depending upon the way you look at it, it can be called a non-Markovian policy as well, because it's conditioned on the whole history. But in this particular setting, if you define S1 as concatenated states, it's a Markovian policy. So the question is if your Q values are really negative, but your advantages are positive, would you put it in the training data set or not?","zh":"当然，动作A1是关键，但S1和S0A0是相同的。因此，根据你如何看待它，它也可以被称为一个非马尔可夫策略，因为它依赖于整个历史。但在这种特定的设置中，如果你将S1定义为拼接后的状态，它就是一个马尔可夫策略。问题是，如果你的Q值实际上是负的，但你的优势值是正的，你会把它放入训练数据集中吗？","start":2975.41,"end":3000.3},{"id":127,"text":"Yeah, that's a great question. I think we tried this with like, so we did take traces which were incorrect and we put the steps which were actually good from them into our data set. And that was fine, except that like, let's say if there are traces where everything is just as, like there's no way, like there's no prefix of that from which you can succeed at all. The advantages are also small and the keywords are also small. Turns out that if you filter them out, you might do a little bit better.","zh":"是的，这是个很好的问题。我想我们尝试过类似的方法，我们确实收集了错误的轨迹，并将其中实际有效的步骤提取出来加入到我们的数据集中。这在某种程度上是可行的，但例外情况是，比如存在一些轨迹，其中所有内容都是无效的，没有任何前缀能够成功。优势也很小，关键词也很少。结果发现，如果你过滤掉这些情况，可能会稍微好一点。","start":3001.15,"end":3028.69},{"id":128,"text":"But again, I don't have a very, very concrete result I can show you here, so I'm not going to tell you that this is the way to go. But it seems like, to a large extent, desensitivity does not exist in some way. Because the prefix is the culprit then, and you're training only A1 conditioned on the prefix and not training them all to produce the prefix at all. Okay, great. So that's the first option. So this is a lot like filtered imitation learning or advantage-weighted regression.","zh":"但同样，我在这里并没有非常具体的结果可以展示给你，所以我不会告诉你这就是正确的方法。但看起来，某种程度上，去敏感化并不存在。因为问题出在前缀上，你只在前缀的条件下训练A1，而并没有训练它们全部生成前缀。好的，明白了。所以这是第一个选项。这在很大程度上类似于过滤模仿学习或优势加权回归。","start":3029.32,"end":3053.37}],"notes":["本段讨论了在强化学习中如何训练模型以生成序列动作，特别是在大语言模型推理中的应用。讲者指出，虽然训练时可以将动作分解为步骤进行训练，但在实际部署时，模型会一次性生成整个动作序列。这涉及到状态表示的问题，即状态S1是否包含历史信息。","讲者进一步探讨了状态表示与马尔可夫性质的关系。他指出，虽然在某些情况下状态S1包含所有历史信息，因此可能是一个非马尔可夫策略，但在特定设定下，如果将S1定义为拼接状态，则可以视为马尔可夫策略。","讲者提到，训练时需要考虑Q值和优势值的关系。如果Q值为负而优势值为正，是否应该将这些样本包含在训练数据集中。他指出，虽然可以尝试包含这些样本，但过滤掉某些无法成功完成的前缀可能会带来更好的效果。","讲者还提到，虽然没有非常明确的结果，但过滤掉某些无效的前缀可能有助于提高模型性能。他指出，这种做法类似于过滤模仿学习或优势加权回归。","讲者强调了在训练过程中，如何处理历史信息和状态表示的重要性。他指出，虽然模型在训练时可以分解为步骤进行训练，但在实际部署时，模型会一次性生成整个动作序列，这需要在状态表示上进行适当的处理。","最后，讲者提到，虽然没有非常明确的结果，但过滤掉某些无效的前缀可能有助于提高模型性能。他指出，这种做法类似于过滤模仿学习或优势加权回归。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2879.34,"end":3053.37,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2879.34,"text":"to produce individual actions, like in offline RL or in imitation learning, we train it to produce A1 given S1, A2 given S2, and so on. But when it acts in the world, it just acts and produces a giant sequence of actions in one go, right? So you can train the policy on different segments of steps it's seeing, but when it's deployed, it's going to just produce one action, then the state S1 is going to be simply the whole..."},{"start":2904.23,"text":"tokens in the question, tokens in the step so far, and that's S1, and you're going to now, the same policy can now continue on and produce the next step. So it's not going to be prompted in any way. It's just going to be producing the whole solution in one flow, except that now you're just training it in a way that you're breaking them down into steps. So really there's no notion of a separate act."},{"start":2923.88,"text":"So the question is, do you only train on a step because of the Markov property, because you don't care how you got there? In a way, the answer is actually no, because in some ways your state S1 consists of all of your history, right? So S1 consists of, so S0 is a problem. A0 is, let's say, step one. And S1 in this case is basically problem concatenated with step one, right?"},{"start":2953.01,"text":"So in some ways, you have preserved all of your history in this case, and it's a non-Markovian policy that you're learning, except that here, the reason why we do this at the step level is because now we can better understand which part of the solution actually caused me to derail if it did. So there's no notion of independence. It's not like given S. So, OK, in this particular setting, given S1."},{"start":2975.41,"text":"Sure, action A1 is all matters, but S1 and S0A0 are the same. So depending upon the way you look at it, it can be called a non-Markovian policy as well, because it's conditioned on the whole history. But in this particular setting, if you define S1 as concatenated states, it's a Markovian policy. So the question is if your Q values are really negative, but your advantages are positive, would you put it in the training data set or not?"},{"start":3001.15,"text":"Yeah, that's a great question. I think we tried this with like, so we did take traces which were incorrect and we put the steps which were actually good from them into our data set. And that was fine, except that like, let's say if there are traces where everything is just as, like there's no way, like there's no prefix of that from which you can succeed at all. The advantages are also small and the keywords are also small. Turns out that if you filter them out, you might do a little bit better."},{"start":3029.32,"text":"But again, I don't have a very, very concrete result I can show you here, so I'm not going to tell you that this is the way to go. But it seems like, to a large extent, desensitivity does not exist in some way. Because the prefix is the culprit then, and you're training only A1 conditioned on the prefix and not training them all to produce the prefix at all. Okay, great. So that's the first option. So this is a lot like filtered imitation learning or advantage-weighted regression."}],"speech_gaps":[],"frame":"../frames/v020/018.webp","frame_time":2891.34},{"title":"使用RL提升大语言模型推理","segments":[{"id":129,"text":"The next thing, okay, before that, I can show you some results here. So this actually ended up addressing that error going up problem, at least to the extent that we were able to train models. So, you know, here, again, I'm plotting number of correct answers per question, and you'll find that the advantage filtering did help you compared to sort of the RFT approach, which was going up before.","zh":"接下来，好吧，在那之前，我可以向你们展示一些结果。实际上，这最终解决了那个错误上升的问题，至少在我们能够训练模型的程度上是如此。所以，你们会发现，这里的图表显示的是每个问题的正确答案数量，你们会发现优势过滤确实帮助你们，与之前上升的RFT方法相比。","start":3054.12,"end":3074.2},{"id":130,"text":"And we did measure the number of spurious steps according to some heuristic definition of how we can evaluate this, like how we can probe this. And it seemed like, just from a qualitative perspective also, the number of spurious steps actually kind of reduced in some way. Okay, so the next thing is, how can you use this for offline reinforcement learning? And this is where sort of DPO-based methods come in. So there was a question about this earlier in the class. So you can also use the same principle for doing DPO, actually.","zh":"我们根据某种启发式定义来衡量虚假步骤的数量，就像我们如何探测这个问题一样。从定性角度来看，虚假步骤的数量似乎以某种方式减少了。好吧，接下来的问题是，你们如何将这种方法用于离线强化学习？这就是所谓的基于DPO的方法出现的地方。在课堂上之前有人问过这个问题。实际上，你们也可以使用同样的原理来进行DPO。","start":3076.6,"end":3105.18},{"id":131,"text":"So the idea in DPO is sort of slightly different from computing this advantage exactly, but uses the same protocol that I described to you earlier, where what you're going to do now is you're going to take a solution from your base model that you're training. Maybe this is incorrect. And so far, what we did was we found out steps that were useful and retained them in some way or the other and discarded everything else. But what we can do now is we can do these rollouts. And rather than sort of throwing away","zh":"在DPO中的想法与精确计算这个优势略有不同，但使用了我之前向你们描述的相同协议，即现在你们将从你们正在训练的基础模型中获取一个解决方案。也许这个解决方案是错误的。到目前为止，我们所做的工作是找出有用的步骤并以某种方式保留它们，而丢弃其他一切。但现在我们可以进行这些轨迹生成。而不是丢弃这些轨迹生成，或者仅仅使用这些轨迹生成来估计优势，我可以做的是，我可以选择一个以共享前缀结束并成功完成的轨迹，从我的模型中获取一个未能成功完成的解决方案轨迹，并从中构建一个偏好对。","start":3106.04,"end":3131.44},{"id":132,"text":"or throwing away these rollouts or just using these rollouts to estimate the advantage, what I can do is I can instead take a rollout which ended up succeeding with a shared prefix, take the solution trace from my model which did not end up succeeding, and construct a preference pair out of them. So I now have a preference pair which looks like some prefix followed by some correction, which is good, and some prefix followed by some steps which are actually wrong.","zh":"或者丢弃这些轨迹，或者仅仅使用这些轨迹来估计优势值，我所做的其实是：取一个最终成功的轨迹，它有一个共享的前缀；然后从我的模型中获取一个未成功轨迹的解决方案轨迹，并从它们中构造一个偏好对。因此，我现在有了一个偏好对，它看起来像是一些前缀后跟一些正确的修正，这很好，以及一些前缀后跟一些实际上错误的步骤。","start":3132.86,"end":3160.5},{"id":133,"text":"and I can throw this into a DPO training dataset. I can also do the same thing with a correct rollout. So if let's say I have a correct rollout from my base model, I can still do these rollouts, and maybe one of them will not end up succeeding, potentially, from my rollout policy, and I can basically put this thing as a preference pair into my training mix.","zh":"我可以将这个内容加入到一个DPO训练数据集中。我也可以用正确轨迹做同样的事情。例如，如果我有一个来自基础模型的正确轨迹，我仍然可以进行这些轨迹生成，也许其中一条轨迹不会从我的轨迹策略中成功，我基本上可以将这个内容作为偏好对加入到我的训练数据中。","start":3161.03,"end":3182.59},{"id":134,"text":"So the nice thing that is happening, or there are two differences that are happening here, right? In some way, I'm still realizing in this process that prefixes are shared. And really the difference between, you know, correct and incorrect rollout comes from that little segment that you see, you know, beyond the prefix in the settings. That's the first thing. And the second thing is, you know, rather than the previous approach of filtering by advantages, I'm actually retaining the whole steps that appear in this rollout distribution.","zh":"这里发生的事情，或者说有两个不同之处。一方面，我在这一过程中仍然意识到前缀是共享的。另一方面，正确轨迹和错误轨迹之间的差异来自于你看到的那个部分，也就是在前缀之后的设置部分。这是第一点。第二点是，我并没有像之前那样通过优势来过滤，而是实际上保留了这个轨迹分布中出现的所有步骤。","start":3183.81,"end":3210.29},{"id":135,"text":"So I'm not simply using these rollouts like the orange colored dashed lines to compute advantages, but I'm retaining them and I'm training on top of the tokens that appear in that rollout as well.","zh":"因此，我并不是仅仅使用这些轨迹（如橙色虚线所示）来计算优势，而是保留这些轨迹，并且在这些轨迹中出现的标记上进行训练。","start":3211.07,"end":3221.75},{"id":136,"text":"So the DPO loss, I guess I don't have that on my slides, but I guess probably I don't need to necessarily write that down.","zh":"DPO损失函数，我想我的幻灯片上没有展示，但我想可能不需要特意写下来。","start":3222.77,"end":3229.97}],"notes":["本段讲解了如何利用DPO方法来提升大语言模型的推理能力。讲者提到，DPO方法与之前通过优势计算来过滤步骤的方式不同，而是保留了整个rollout过程中的所有步骤。这表明DPO方法在训练过程中不仅关注优势，还考虑了整
