 and train on it, you will often find that there are some of these traces which end up having steps which are spurious in nature, steps which actually are incorrect, but they just somehow don't affect the model's generation."},{"start":1728.75,"text":"So I'm going to show you an example, but basically these are steps which would take you to a regime where you're maybe doing a wrong calculation. You know, somehow, you know, you get there. Maybe on this particular trace, when you are sampling from your model, you end up do recovering from these traces. So you end up with the correct answer. But maybe in reality, you know, these traces are actually harmful."},{"start":1748.23,"text":"So just to give you an example, let's say this is a little arithmetic problem. It's from this GSM 8K data set. One interesting example we found, which is the most stark example of this particular issue, was there's a solution from the model which does some calculation. Then it says that the total amount of money needed is like 100 times 2, which is 200. And it reverses its calculation in the next line. So the true calculation is 100 by 2, but it ends up saying 200 and then sort of goes to 100 by 2 right away."},{"start":1777.85,"text":"So what ends up happening is this particular step that exists in the middle where it's doing 200 is sort of a spurious step. It's a step that is not needed. It's an incorrect step that exists in the solution. You end up still at the right answer in this particular rollout, but this step shouldn't be there in reality in that particular setting. So that's a spurious step in this particular set."},{"start":1798.12,"text":"So the question is, the step is always a sentence. For now, you can imagine it's always a sentence in this particular setting. There's no universally agreed upon definition to it. So this is a very sort of, I guess in the second part of my talk, I'm going to show you some examples where the step is not at all a sentence. It's a full block of things. So, yeah."},{"start":1814.38,"text":"That's a great question. So the question is, is this the main cause of increase in error and can you not measure it in some way? So it turns out that the answer to both is yes, it's one of the main causes for increase in error. Can you measure it in some way? At least normal notions of fitting the data won't tell you this."},{"start":1833.21,"text":"That's a great question. So the question is, can we associate the overfitting problem with this? So you can actually measure this. In the paper, we did measure this. We measured the amount of spurious steps that you see, and it grows on over time. Obviously, I cannot give you a proof that this is the only cause. I can give you a proof that this should be a problem. I cannot give you a proof that this is the only problem. But this is sort of one of the big problems that you see. So the question is, how do you find out if it's a spurious step? In experiments, we do it in a particular way, and that also dictates a lot of methodologies that I'm going to show you in a second."}],"speech_gaps":[],"frame":"../frames/v020/011.webp","frame_time":1693.11},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":77,"text":"So this particular method, so the question is, do you sample entire trajectories? This particular method samples entire trajectories. You can sample parts of trajectories if you want it to be, but I think it needs some advanced machinery that I think can be done based on what I'm going to talk about in the next slide.","start":1860.45,"end":1876.45},{"id":78,"text":"The question is, do you overfit to a certain class of methods that got to the right answer? In a way, the answer is at a high level, yes, with the caveat that I don't know how to define what a method means, right? So you can call a method that... So just seeing this example, one can say that the calculation of 100 times 2...","start":1877.44,"end":1895.9},{"id":79,"text":"is a methodological phenomenon that the model wants to do to be able to then succeed and then realize that it was wrong. You can also say that really the method here is nothing but just doing a bunch of arithmetic. So it really depends on what you define that, and I think it's a semantic question at that point. So from a very symbolic perspective, one can say that there are a set of tokens that maybe still lead you to the right answer on a training set, but may not actually help you do the right thing on a test problem.","start":1896.17,"end":1921.37},{"id":80,"text":"So this is very similar to the problem of causal confusion in imitation learning, actually. I'm not sure if causal confusion... Okay, okay. Never mind. But basically there's this problem of if you produce a bunch of stuff in your policy that might be bad, like these Fourier steps, you might just not learn to imitate the expert in the right way possible. So maybe you actually end up at the right answer, but you're learning these incorrect associations.","start":1922.92,"end":1952.34},{"id":81,"text":"That's basically the gist of this problem of causal confusion that people in imitation learning know a lot about, actually. Okay, so how can we address this? And that's where RL comes in, and that's sort of the third axis of using incorrect data or incorrect rollouts for learning.","start":1952.52,"end":1966.7},{"id":82,"text":"The simple idea is, as many of you already asked questions about, assigning some notion of a credit to a step. So if I can understand what is the utility of every single step or every single state that my policy generates, then I can kind of somehow use that notion to filter off these bad kinds of solutions. So that's exactly kind of what we do or what RL for reasoning tries to do at a high level as well.","start":1967.43,"end":1992.81},{"id":83,"text":"So, identifying these Fourier steps and eliminating them in some way. So, the way to do this is the following, and this ties back to a lot of concepts of value functions and advantage functions that many of you are probably familiar with. So, I'm going to start with an illustration, and then I'll write down the exact math for what this means. So, let's say I gave you a particular rollout or a particular trace. So, again, starting from a prompt, adding these steps or actions, and going to a final answer, which maybe ended up being incorrect, so it's shown as a red dot.","start":1994.06,"end":2022.55}],"notes":["本段讨论了强化学习在大语言模型推理中的应用，特别是如何通过RL来解决因果混淆问题。讲者提到，模型可能会过度拟合某些方法，从而在训练集上表现良好，但在测试问题上却无法正确执行。这类似于模仿学习中的因果混淆问题，即模型可能学习到错误的关联，导致最终结果正确但过程错误。","讲者指出，因果混淆问题在模仿学习中是一个已知的问题，即模型可能生成一些不良的步骤（如Fourier步骤），从而无法正确模仿专家的行为。这可能导致模型最终得到正确答案，但学习到的是错误的关联。","为了解决这个问题，强化学习被引入，通过为每个步骤或状态分配某种信用（credit），从而过滤掉这些不良的解决方案。这与价值函数和优势函数的概念相关，这些概念在强化学习中被广泛使用。","讲者提到，通过识别并消除这些不良步骤（Fourier steps），可以改进模型的推理能力。这涉及到对每个步骤的效用进行评估，并利用这些信息来优化模型的行为。","讲者还提到，通过示例来说明这一过程，即从提示开始，添加步骤或动作，最终得到一个可能错误的答案（用红色点表示）。这表明模型在推理过程中可能会生成错误的步骤，而强化学习的目标是识别并消除这些步骤。","最后，讲者指出，强化学习在推理中的应用涉及对每个步骤的效用进行评估，并利用这些信息来优化模型的行为。这与价值函数和优势函数的概念密切相关，这些概念在强化学习中被广泛使用。"],"formulas":[{"latex":"V(s) = \\text{Expected return from state } s","symbols":"V(s) 表示状态 s 的价值函数","explanation":"公式正确，价值函数定义为从状态 s 开始的期望回报，符合强化学习中的标准定义。","evidence":"The simple idea is, as many of you already asked questions about, assigning some notion of a credit to a step. So if I can understand what is the utility of every single step or every single state that my policy generates, then I can kind of somehow use that notion to filter off these bad kinds of solutions. So that's exactly kind of what we do or what RL for reasoning tries to do at a high level as well."}],"uncertainties":["Fourier steps"],"diagram":"none","start":1860.45,"end":2022.55,"asr_flags":[],"math_clarifications":["公式中的符号和定义清晰，无需进一步修改。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1860.45,"text":"So this particular method, so the question is, do you sample entire trajectories? This particular method samples entire trajectories. You can sample parts of trajectories if you want it to be, but I think it needs some advanced machinery that I think can be done based on what I'm going to talk about in the next slide."},{"start":1877.44,"text":"That's a great question. The question is, do you overfit to a certain class of methods that got to the right answer? In a way, the answer is at a high level, yes, with the caveat that I don't know how to define what a method means, right? So you can call a method that... So just seeing this example, one can say that the calculation of 100 times 2..."},{"start":1896.17,"text":"is a methodological phenomenon that the model wants to do to be able to then succeed and then realize that it was wrong. You can also say that really the method here is nothing but just doing a bunch of arithmetic. So it really depends on what you define that, and I think it's a semantic question at that point. So from a very symbolic perspective, one can say that there are a set of tokens that maybe still lead you to the right answer on a training set, but may not actually help you do the right thing on a test problem."},{"start":1922.92,"text":"So this is very similar to the problem of causal confusion in imitation learning, actually. I'm not sure if causal confusion... Okay, okay. Never mind. But basically there's this problem of if you produce a bunch of stuff in your policy that might be bad, like these Fourier steps, you might just not learn to imitate the expert in the right way possible. So maybe you actually end up at the right answer, but you're learning these incorrect associations."},{"start":1952.52,"text":"That's basically the gist of this problem of causal confusion that people in imitation learning know a lot about, actually. Okay, so how can we address this? And that's where RL comes in, and that's sort of the third axis of using incorrect data or incorrect rollouts for learning."},{"start":1967.43,"text":"The simple idea is, as many of you already asked questions about, assigning some notion of a credit to a step. So if I can understand what is the utility of every single step or every single state that my policy generates, then I can kind of somehow use that notion to filter off these bad kinds of solutions. So that's exactly kind of what we do or what RL for reasoning tries to do at a high level as well."},{"start":1994.06,"text":"So, identifying these Fourier steps and eliminating them in some way. So, the way to do this is the following, and this ties back to a lot of concepts of value functions and advantage functions that many of you are probably familiar with. So, I'm going to start with an illustration, and then I'll write down the exact math for what this means. So, let's say I gave you a particular rollout or a particular trace. So, again, starting from a prompt, adding these steps or actions, and going to a final answer, which maybe ended up being incorrect, so it's shown as a red dot."}],"speech_gaps":[],"frame":"../frames/v020/012.webp","frame_time":1872.45},{"title":"通过强化学习提升大语言模型推理","segments":[{"id":84,"text":"What I can do now is I can try to identify whether a step is spurious or not by taking these particular prefixes or taking these particular states that were basically concatenating all the tokens so far and doing what you can think of as rollouts in a way. So I can ask some model to try to complete the solution given a prefix of a generated solution.","start":2023.4,"end":2045.48},{"id":85,"text":"So, you know, for example, in this particular setting that you see on the slide, I have kept the first three steps the same. And I'm asking a separate model or a separate rollout policy to try to complete the solution given this particular prefix.","start":2046.08,"end":2058.28},{"id":86,"text":"So if I do this and let's say the rollout ends up succeeding, so many of these rollouts end up at the right answer, then likely the prefix was not too bad because clearly for this particular rollout policy, it did not end up affecting any of its problem-solving abilities.","start":2060.46,"end":2077.46},{"id":87,"text":"On the other hand, let's say if I ended up at a totally wrong answer, conditioned on the prefix that you see up here, clearly something is not okay here, and clearly there's something wrong with the prefix that you're seeing up here, because your rollout policy could not at all succeed, conditioned on that prefix, even after doing many possible rollouts.","start":2078.91,"end":2097.03},{"id":88,"text":"And if I ended up succeeding sometimes and sometimes not, maybe there's still some issue. Maybe it's not the best thing you can have, but at least it's slightly better than always failing that you see up here, for instance. So this basic principle of doing rollouts and estimating some notion of expected success in the future can kind of tell you something about what is wrong with the current prefix that you are particularly operating at.","start":2098.15,"end":2121.09},{"id":89,"text":"This is also very similar to a value function, right? Because this is basically computing the expected future zero one reward that my rollout policy, that this orange policy gets when it acts in this particular MDP. So the question is, the spurious step on the previous slide is that.","start":2122.38,"end":2140.85},{"id":90,"text":"actually irrelevant or incorrect. Or irrelevant slash, I mean, it's incorrect clearly because, or okay, the step is not incorrect in its own right, but it is sort of irrelevant in a way. Imagine for a second that if you pass to a language model a million irrelevant tokens and ask it to sort of dig out the information that actually matters, that can be a challenging problem on a test set. So that's why even if a step is irrelevant, it can be a problem for the model.","start":2142.57,"end":2170.39},{"id":91,"text":"Okay, so we did these rollouts. We computed the expected value of how many times can I succeed. And that resembles something that looks like a value function of sorts. And why is it a value function? Because if you sort of write this down in a bit of math, so let's say if I define the problem or the initial state as X, each of these steps as Y1s to YNs. So I guess there's a bit of a notation mismatch here. Y1s to YNs are independent rollouts. Here, the YIs I'm showing are basically each step or each action that you take.","start":2171.44,"end":2199.78}],"notes":["本段讲解了通过执行rollout来评估当前前缀是否存在问题的方法。通过观察rollout的成功率，可以判断当前前缀是否有效。如果rollout总是成功，说明前缀没有问题；如果总是失败，说明前缀存在问题；如果有时成功有时失败，说明前缀可能存在问题，但至少比完全失败要好。","讲者提到，这种评估方法与价值函数（value function）相似，因为价值函数计算的是在特定马尔可夫决策过程（MDP）中，策略在未来获得的预期奖励。这里通过rollout计算的预期成功次数，可以视为一种价值函数的近似。","讲者指出，前缀中的某些步骤可能无关或错误，即使这些步骤本身不错误，但它们可能对模型的推理过程产生干扰。例如，如果模型被输入大量无关的token，它可能难以从中提取出有用的信息。","讲者提到，通过定义初始状态为X，每个步骤为Y1到YN，可以将rollout的成功率与价值函数进行类比。然而，这里存在符号上的不一致，因为Y1到YN可能指的是独立的rollout，而实际展示的YIs指的是每个步骤或动作。","讲者强调，这种评估方法的核心在于通过rollout估计未来成功的期望值，从而判断当前前缀是否存在问题。这种方法可以用于识别和修正模型推理过程中的错误或无关步骤。","讲者还提到，这种评估方法与强化学习中的价值函数概念相似，因为价值函数衡量的是策略在特定状态下的预期回报。通过rollout计算的预期成功次数，可以视为一种价值函数的近似，用于指导模型的优化过程。"],"formulas":[],"uncertainties":["Y1s to YNs are independent rollouts"],"diagram":"none","start":2023.4,"end":2199.78,"asr_flags":[],"math_clarifications":["原文中未出现任何具体的数学公式或表达式，因此无法进行数学校对。所有内容均为自然语言描述，涉及的是算法或方法的逻辑流程，而非数学公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2023.4,"text":"What I can do now is I can try to identify whether a step is spurious or not by taking these particular prefixes or taking these particular states that were basically concatenating all the tokens so far and doing what you can think of as rollouts in a way. So I can ask some model to try to complete the solution given a prefix of a generated solution."},{"start":2046.08,"text":"So, you know, for example, in this particular setting that you see on the slide, I have kept the first three steps the same. And I'm asking a separate model or a separate rollout policy to try to complete the solution given this particular prefix."},{"start":2060.46,"text":"So if I do this and let's say the rollout ends up succeeding, so many of these rollouts end up at the right answer, then likely the prefix was not too bad because clearly for this particular rollout policy, it did not end up affecting any of its problem-solving abilities."},{"start":2078.91,"text":"On the other hand, let's say if I ended up at a totally wrong answer, conditioned on the prefix that you see up here, clearly something is not okay here, and clearly there's something wrong with the prefix that you're seeing up here, because your rollout policy could not at all succeed, conditioned on that prefix, even after doing many possible rollouts."},{"start":2098.15,"text":"And if I ended up succeeding sometimes and sometimes not, maybe there's still some issue. Maybe it's not the best thing you can have, but at least it's slightly better than always failing that you see up here, for instance. So this basic principle of doing rollouts and estimating some notion of expected success in the future can kind of tell you something about what is wrong with the current prefix that you are particularly operating at."},{"start":2122.38,"text":"This is also very similar to a value function, right? Because this is basically computing the expected future zero one reward that my rollout policy, that this orange policy gets when it acts in this particular MDP. So the question is, the spurious step on the previous slide is that."},{"start":2142.57,"text":"actually irrelevant or incorrect. Or irrelevant slash, I mean, it's incorrect clearly because, or okay, the step is not incorrect in its own right, but it is sort of irrelevant in a way. Imagine for a second that if you pass to a language model a million irrelevant tokens and ask it to sort of dig out the information that actually matters, that can be a challenging problem on a test set. So that's why even if a step is irrelevant, it can be a problem for the model."},{"start":2171.44,"text":"Okay, so we did these rollouts. We computed the expected value of how many times can I succeed. And that resembles something that looks like a value function of sorts. And why is it a value function? Because if you sort of write this down in a bit of math, so let's say if I define the problem or the initial state as X, each of these steps as Y1s to YNs. So I guess there's a bit of a notation mismatch here. Y1s to YNs are independent rollouts. Here, the YIs I'm showing are basically each step or each action that you take."}],"speech_gaps":[],"frame":"../frames/v020/013.webp","frame_time":2035.4},{"title":"强化学习中Q函数的定义与使用","segments":[{"id":92,"text":"So if you define a quantity that looks like the following, it's basically a Q function. So what is this quantity? It's telling you the Q value for your particular rollout policy, pi tilde. So the policy which is trying to complete the solution, rollout policy pi tilde. I'm computing its Q value at a given state, given by the initial state and the prefix of the solution so far.","start":2200.92,"end":2224.8},{"id":93,"text":"and given an action, which is the current step that your policy adds. I can define the Q value here as the expected long-term reward, meaning the expected 0-1 reward that I get under my rollout policy if I start by executing, you know,","start":2225.34,"end":2241.8},{"id":94,"text":"A Q function, just to recall, Q pi, I guess it's subscript pi. Q pi of SA is basically nothing but R of SA, or I guess depends upon how you write this, but it's basically the expected discounted reward that you get.","start":2242.17,"end":2270.01},{"id":95,"text":"starting from t equal to zero to, you know, let's say infinity in general, conditioned on S zero being S and A zero being A.","start":2273.15,"end":2280.85},{"id":96,"text":"This is the definition of a Q function. In this particular setting, we are assuming discount factor is one. So gamma is set to exactly one. And the reward that you get is only at termination. So there's 0, 0, 0, 0 until you end up hitting the final answer. So that's why you see there's only one expectation up there. And this expectation is computed under policy pi. So you compute, you roll this policy pi out from there on. There's one minor detail here. You typically have R of SA.","start":2281.3,"end":2309.82},{"id":97,"text":"plus this thing, because you roll out the policy from the next step, and you sum up the reward at the current state. In this case, it doesn't matter, because R of SA is equal to zero. You only get a reward at the end. Gamma is set to one. So essentially, the thing that you see up here is essentially an expected future reward, starting from a given prefix, which is the state, at a given step, which is the action, and the rollout is performed under pi tilde that you see up here.","start":2310.43,"end":2334.99},{"id":98,"text":"Okay, so the question is, would you use the same policy to roll out those other trajectories? So in principle, this equation that I wrote is agnostic of which policy you use to do the rollout. So there's been actually no...","start":2335.99,"end":2349.55},{"id":99,"text":"So I have a belief about this answer, about this particular choice of the policy. So in my opinion, the policy that you're doing, rollout switch, should be a different policy compared to the current one. Otherwise, it can fail in the same way. There's some work in literature which argues that even using the same policy can actually be good enough.","start":2350.57,"end":2367.53}],"notes":["本段讲解了Q函数的定义，强调Q函数是基于特定策略（rollout policy）的预期长期奖励。在该设定中，折扣因子γ被设为1，意味着没有折扣，奖励仅在终止时获得。因此，Q函数的计算仅涉及最终的奖励，而中间步骤的奖励为零。","Q函数的定义依赖于初始状态和当前动作，且计算过程是在给定策略π下进行的。在该上下文中，Q函数的计算方式与标准定义略有不同，因为中间步骤的奖励为零，且仅在最终状态获得奖励。","讲者提到，使用相同的策略进行rollout可能会导致失败，因此建议使用不同的策略。然而，也有文献指出，使用相同策略可能在某些情况下是有效的。","在定义Q函数时，讲者提到通常会包含R(S,A)项，但在该特定情况下，由于中间奖励为零，因此该项不影响最终结果。"],"formulas":[{"latex":"\\gamma = 1","symbols":"折扣因子γ被设为1，意味着没有折扣","explanation":"公式正确，折扣因子γ被设为1，符合上下文描述。","evidence":"This is the definition of a Q function. In this particular setting, we are assuming discount factor is one. So gamma is set to exactly one. And the reward that you get is only at termination. So there's 0, 0, 0, 0 until you end up hitting the final answer. So that's why you see there's only one expectation up there. And this expectation is computed under policy pi. So you compute, you roll this policy pi out from there on. There's one minor detail here. You typically have R of SA."}],"uncertainties":["在讲者提到的Q函数定义中，是否明确区分了状态和动作的索引？"],"diagram":"none","start":2200.92,"end":2367.53,"asr_flags":[],"math_clarifications":["Q函数的定义应为预期未来奖励，而非折扣奖励，因为折扣因子γ被设为1。奖励仅在终止时获得，因此R(s, a)应为在状态s和动作a时的即时奖励，而非中间步骤的奖励为零。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2200.92,"text":"So if you define a quantity that looks like the following, it's basically a Q function. So what is this quantity? It's telling you the Q value for your particular rollout policy, pi tilde. So the policy which is trying to complete the solution, rollout policy pi tilde. I'm computing its Q value at a given state, given by the initial state and the prefix of the solution so far."},{"start":2225.34,"text":"and given an action, which is the current step that your policy adds. I can define the Q value here as the expected long-term reward, meaning the expected 0-1 reward that I get under my rollout policy if I start by executing, you know,"},{"start":2242.17,"text":"if I start by getting actions I plus one to L from this rollout policy. So what's the Q function? A Q function, just to recall, Q pi, I guess it's subscript pi. Q pi of SA is basically nothing but R of SA, or I guess depends upon how you write this, but it's basically the expected discounted reward that you get."},{"start":2273.15,"text":"starting from t equal to zero to, you know, let's say infinity in general, conditioned on S zero being S and A zero being A."},{"start":2281.3,"text":"This is the definition of a Q function. In this particular setting, we are assuming discount factor is one. So gamma is set to exactly one. And the reward that you get is only at termination. So there's 0, 0, 0, 0 until you end up hitting the final answer. So that's why you see there's only one expectation up there. And this expectation is computed under policy pi. So you compute, you roll this policy pi out from there on. There's one minor detail here. You typically have R of SA."},{"start":2310.43,"text":"plus this thing, because you roll out the policy from the next step, and you sum up the reward at the current state. In this case, it doesn't matter, because R of SA is equal to zero. You only get a reward at the end. Gamma is set to one. So essentially, the thing that you see up here is essentially an expected future reward, starting from a given prefix, which is the state, at a given step, which is the action, and the rollout is performed under pi tilde that you see up here."},{"start":2335.99,"text":"Okay, so the question is, would you use the same policy to roll out those other trajectories? So in principle, this equation that I wrote is agnostic of which policy you use to do the rollout. So there's been actually no..."},{"start":2350.57,"text":"So I have a belief about this answer, about this particular choice of the policy. So in my opinion, the policy that you're doing, rollout switch, should be a different policy compared to the current one. Otherwise, it can fail in the same way. There's some work in literature which argues that even using the same policy can actually be good enough."}],"speech_gaps":[],"frame":"../frames/v020/014.webp","frame_time":2212.92},{"title":"强化学习中Q函数与优势函数的定义与应用","segments":[{"id":100,"text":"I think we haven't seen an apples to apples comparison given the sort of scale of experiments, which definitely shows one way or the other. I think most of the evidence that exists right now points towards the benefits from having a different policy because that makes sense also. But I think there's a part of the community, especially sort of the NLP community, which kind of does it using the same policy and finds it to work reasonably fine.","start":2368.94,"end":2390.98},{"id":101,"text":"That's a great question. So the question is, is this similar to trajectory stitching and advantage weights? It so turns out that the answer is exactly yes. It is very related to that. I don't think I have a discussion of this stitching angle in my slides because I think it would have been a bit too technical. But yeah, if you check the paper, you'll find exactly it talks about sort of stitching in this particular setting. And it's very related concepts. So yeah, you can think of it that way.","start":2391.91,"end":2417.03},{"id":102,"text":"Okay, great. So this is the definition of a Q function. And once you've defined this Q function, it so turns out that you can use this Q function to now tell you whether steps are spurious or not, are good or not, in the same way as defining advantages would have done.","start":2417.92,"end":2434.16},{"id":103,"text":"So I'm pretty sure you talked about sort of advantage weighted regression as an offline RL method. I'm going to do something very similar to that, but just sort of to kind of spend one minute on the definition of the advantage here. So the advantage function typically means QSA minus V of S that you probably talked about. So A of SA under a given policy is Q pi of SA minus V pi of S.","start":2434.39,"end":2459.67},{"id":104,"text":"In this particular setting, though, the dynamics are deterministic, and the state is simply a concatenation of the previous state with a new set of tokens which define the step that is added in there. Hence, what happens is you can define the advantage as Q value of the prefix until step i minus Q value of the prefix until step i minus 1.","start":2461.17,"end":2483.77},{"id":105,"text":"that sort of serves as the same notion of advantage in this particular MDP. So that's why the definition you see up there is Q minus Q and not Q minus V, but it's sort of basically the same thing. So once you define it in this way, you can actually compute these advantages for every step. So you can compute advantages by subtracting the Q values for consecutive steps, one from each other, and you'll get some positive and some negative numbers in this particular setting.","start":2484.75,"end":2508.05},{"id":106,"text":"It just really depends on how many times can you succeed. And once you have these advantages, they are a measure of how well a particular step, how much a particular step contributed to your ability to be able to succeed from that particular prefix. So if step two ended up reducing the advantage, that means your Q value at step one was higher than Q value after step two has been executed, which means step two is probably not that good of a step to have in order to be able to succeed eventually.","start":2508.94,"end":2537.52}],"notes":["本段讲解了Q函数的定义及其在强化学习中的应用，特别是如何通过Q函数判断步骤是否为有益的步骤。优势函数被定义为Q值与状态值的差值，用于评估每个步骤对最终成功的影响。","在确定性动态的环境下，状态由前一个状态和新添加的标记组成。优势函数被定义为前一步Q值与当前步Q值的差值，这与传统的优势函数定义类似，但使用Q值代替了状态值。","优势函数的计算方法是通过连续步骤的Q值相减，得到正负值，从而判断每个步骤对整体成功的影响。如果某个步骤导致优势减少，说明该步骤可能对成功没有帮助。","在强化学习中，优势函数的定义和计算方法对于评估策略的有效性至关重要。通过优势函数，可以识别出哪些步骤是有效的，哪些步骤是冗余或有害的。","本段还提到，优势函数的计算方法与传统的轨迹缝合和优势权重方法有相似之处，但具体实现方式有所不同，特别是在确定性动态的环境下。","优势函数的计算不仅有助于评估策略的有效性，还可以用于优化策略，通过调整步骤的选择来提高整体的成功率。"],"formulas":[{"latex":"A(s, a) = Q^\\pi(s, a) - V^\\pi(s)","symbols":"优势函数等于Q值减去状态值","explanation":"公式正确表达了优势函数的定义，即Q值减去状态值。","evidence":"So I'm pretty sure you talked about sort of advantage weighted regression as an offline RL method. I'm going to do something very similar to that, but just sort of to kind of spend one minute on the definition of the advantage here. So the advantage function typically means QSA minus V of S that you probably talked about. So A of SA under a given policy is Q pi of SA minus V pi of S."},{"latex":"A_i = Q_i - Q_{i-1}","symbols":"优势函数定义为当前步骤Q值与前一步Q值的差值","explanation":"公式正确表达了在确定性动态系统中，优势函数定义为当前步骤Q值与前一步Q值的差值。","evidence":"that sort of serves as the same notion of advantage in this particular MDP. So that's why the definition you see up there is Q minus Q and not Q minus V, but it's sort of basically the same thing. So once you define it in this way, you can actually compute these advantages for every step. So you can compute advantages by subtracting the Q values for consecutive steps, one from each other, and you'll get some positive and some negative numbers in this particular setting."}],"uncertainties":[],"diagram":"none","start":2368.94,"end":2537.52,"asr_flags":[],"math_clarifications":["公式中的符号和定义与上下文一致，没有发现数学错误。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2368.94,"text":"I think we haven't seen an apples to apples comparison given the sort of scale of experiments, which definitely shows one way or the other. I think most of the evidence that exists right now points towards the benefits from having a different policy because that makes sense also. But I think there's a part of the community, especially sort of the NLP community, which kind of does it using the same policy and finds it to work reasonably fine."},{"start":2391.91,"text":"That's a great question. So the question is, is this similar to trajectory stitching and advantage weights? It so turns out that the answer is exactly yes. It is very related to that. I don't think I have a discussion of this stitching angle in my slides because I think it would have been a bit too technical. But yeah, if you check the paper, you'll find exactly it talks about sort of stitching in this particular setting. And it's very related concepts. So yeah, you can think of it that way."},{"start":2417.92,"text":"Okay, great. So this is the definition of a Q function. And once you've defined this Q function, it so turns out that you can use this Q function to now tell you whether steps are spurious or not, are good or not, in the same way as defining advantages would have done."},{"start":2434.39,"text":"So I'm pretty sure you talked about sort of advantage weighted regression as an offline RL method. I'm going to do something very similar to that, but just sort of to kind of spend one minute on the definition of the advantage here. So the advantage function typically means QSA minus V of S that you probably talked about. So A of SA under a given policy is Q pi of SA minus V pi of S."},{"start":2461.17,"text":"In this particular setting, though, the dynamics are deterministic, and the state is simply a concatenation of the previous state with a new set of tokens which define the step that is added in there. Hence, what happens is you can define the advantage as Q value of the prefix until step i minus Q value of the prefix until step i minus 1."},{"start":2484.75,"text":"that sort of serves as the same notion of advantage in this particular MDP. So that's why the definition you see up there is Q minus Q and not Q minus V, but it's sort of basically the same thing. So once you define it in this way, you can actually compute these advantages for every step. So you can compute advantages by subtracting the Q values for consecutive steps, one from each other, and you'll get some positive and some negative numbers in this particular setting."},{"start":2508.94,"text":"It just really depends on how many times can you succeed. And once you have these advantages, they are a measure of how well a particular step, how much a particular step contributed to your ability to be able to succeed from that particular prefix. So if step two ended up reducing the advantage, that means your Q value at step one was higher than Q value after step two has been executed, which means step two is probably not that good of a step to have in order to be able to succeed eventually."}],"speech_gaps":[],"frame":"../frames/v020/015.webp","frame_time":2380.94},{"title":"强化学习中优势函数与过程奖励模型","segments":[{"id":107,"text":"So, a negative or a low advantage means it's sort of a bad step or kind of a spurious step and you don't want to necessarily learn from it. A positive advantage means it's a good step and you probably want to learn from it. So, this is sort of supposed to answer the questions about how do you identify spurious steps in something.","start":2538.32,"end":2555.14},{"id":108,"text":"So the question is, are we fitting a Q function? It's a very good question. Turns out that in the literature, there's been two kinds of work. They explicitly fit a Q function like quantity. It's what's called, so in the NLP community, this is what's called a process reward model.","start":2555.97,"end":2574.74},{"id":109,"text":"reward model. I'm guessing since you covered DPO and RLHF, you've talked about reward models, which give you a score for a particular question and answer. This is giving you the score for every step, and hence scoring the process, and hence the word process reward model, or a PRM.","start":2575.82,"end":2595.26},{"id":110,"text":"Don't necessarily think that PRM and Q values should be semantically the same thing, but that's kind of what a lot of the NLP people call this. But yeah, you can kind of train that. But there's the other class of methods which would simply use rollouts the way I talked to you about to estimate advantages, and we'll see what that means.","start":2597.11,"end":2613.43},{"id":111,"text":"Yeah, that's a great question. The question is, how does this help models learn general problem-solving strategies? The rough answer is, ultimately, what ends up happening here is you are breaking down the success of a particular long trace into successes of individual steps that appear inside of it. And that can be a useful thing to know because now, presumably, your model can...","start":2614.32,"end":2636.68},{"id":112,"text":"realize that, okay, once it, let's say it has broken down a problem into four steps or four high-level plans, if it can also localize which step is kind of going wrong, it can actually, you know, better learn that step as opposed to sort of, you know, just vaguely thinking that, okay, a step three might be the cause of the problem when it fails, whereas maybe it's actually step one. So it helps you just learn sort of in a more, so ultimately you need to have some data for learning, but then this is sort of vastly improving your data efficiency and so on. Yeah.","start":2637.1,"end":2664.38},{"id":113,"text":"Great. Okay. So the next step is going to be to use these advantages for training. And this is where sort of a lot of the methods that I talked about also will come into picture. So the first thing is just going to be to filter by advantages that I just described. So you can take a bunch of traces from your model. And I still have the RFT algorithm here. So I'm just going to...","start":2665.96,"end":2686.66},{"id":114,"text":"I'm going to write it down as 1 to n, sample from pi theta. You can take the RFT algorithm. You can sample from your model, a non-policy trace potentially. You can take every step, do these rollouts that we talked about, use them to estimate advantages, and put this into your training data set for doing imitation learning or SFT if this particular step is correct.","start":2687.04,"end":2710.42}],"notes":["本段讨论了强化学习中优势函数的概念，指出负的或低的优势意味着步骤可能是错误的或虚假的，不应从中学习，而正的优势意味着步骤是好的，应从中学习。这回答了如何识别虚假步骤的问题。","本段提到是否在拟合Q函数的问题，指出文献中存在两种方法：一种是显式拟合Q函数，称为过程奖励模型（PRM），另一种是使用rollouts估计优势。PRM与Q值在语义上不一定相同，但NLP社区通常这样称呼。","本段进一步解释了PRM的作用，即为每个步骤打分，从而对整个过程进行评分，这与传统的奖励模型不同，后者为问题和答案打分。","本段指出，虽然PRM和Q值在语义上可能不同，但NLP社区通常将它们视为同一类方法。同时，还提到另一种方法是使用rollouts估计优势，这将在后续讨论。","本段讨论了优势函数如何帮助模型学习一般性问题解决策略。通过将长轨迹的成功分解为各个步骤的成功，模型可以更精确地定位问题所在步骤，从而更有效地学习。","本段提到，使用优势函数进行训练时，需要过滤出优势较高的轨迹，并将其用于模仿学习或监督微调（SFT）。这有助于提高数据效率，使模型在较少数据下也能学习到更有效的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2538.32,"end":2710.42,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2538.32,"text":"So, a negative or a low advantage means it's sort of a bad step or kind of a spurious step and you don't want to necessarily learn from it. A positive advantage means it's a good step and you probably want to learn from it. So, this is sort of supposed to answer the questions about how do you identify spurious steps in something."},{"start":2555.97,"text":"So the question is, are we fitting a Q function? It's a very good question. Turns out that in the literature, there's been two kinds of work. They explicitly fit a Q function like quantity. It's what's called, so in the NLP community, this is what's called a process reward model. Process."},{"start":2575.82,"text":"reward model. I'm guessing since you covered DPO and RLHF, you've talked about reward models, which give you a score for a particular question and answer. This is giving you the score for every step, and hence scoring the process, and hence the word process reward model, or a PRM."},{"start":2597.11,"text":"Don't necessarily think that PRM and Q values should be semantically the same thing, but that's kind of what a lot of the NLP people call this. But yeah, you can kind of train that. But there's the other class of methods which would simply use rollouts the way I talked to you about to estimate advantages, and we'll see what that means."},{"start":2614.32,"text":"Yeah, that's a great question. The question is, how does this help models learn general problem-solving strategies? The rough answer is, ultimately, what ends up happening here is you are breaking down the success of a particular long trace into successes of individual steps that appear inside of it. And that can be a useful thing to know because now, presumably, your model can..."},{"start":2637.1,"text":"realize that, okay, once it, let's say it has broken down a problem into four steps or four high-level plans, if it can also localize which step is kind of going wrong, it can actually, you know, better learn that step as opposed to sort of, you know, just vaguely thinking that, okay, a step three might be the cause of the problem when it fails, whereas maybe it's actually step one. So it helps you just learn sort of in a more, so ultimately you need to have some data for learning, but then this is sort of vastly improving your data efficiency and so on. Yeah."},{"start":2665.96,"text":"Great. Okay. So the next step is going to be to use these advantages for training. And this is where sort of a lot of the methods that I talked about also will come into picture. So the first thing is just going to be to filter by advantages that I just described. So you can take a bunch of traces from your model. And I still have the RFT algorithm here. So I'm just going to..."},{"start":2687.04,"text":"I'm going to write it down as 1 to n, sample from pi theta. You can take the RFT algorithm. You can sample from your model, a non-policy trace potentially. You can take every step, do these rollouts that we talked about, use them to estimate advantages, and put this into your training data set for doing imitation learning or SFT if this particular step is correct."}],"speech_gaps":[],"frame":"../frames/v020/016.webp","frame_time":2550.32},{"title":"强化学习中优势加权回归与训练策略","segments":[{"id":115,"text":"So what does that mean? That basically means that you are taking a particular trace and you are checking at a step level whether the advantages are positive. Even if that particular step comes from an incorrect solution trace, you're going to put that into your training data set if that step itself gives you a high advantage. On the other hand, let's say if that step itself comes from a correct solution trace, maybe there's a particular step here which gets a low advantage or a really negative advantage. I'm going to just throw it away.","start":2711.02,"end":2739.76},{"id":116,"text":"So this is very much reminiscent of advantage weighted regression, except that here, rather than doing exponentiated advantages, which I'm guessing was covered, we are doing sort of like filtering on advantages. That's sort of the basic idea. You can also do exponentiation of advantages. So you can train on everything, but multiply the loss by e to the a. That objective, I think, requires a lot of tuning. And if you can only run one experiment, you probably prefer this objective over e to the a in general.","start":2740.94,"end":2769.84},{"id":117,"text":"That's a great question. So the question is, do you only train up to the good steps on an incorrect solution? The answer is not really. So we initially thought that that's kind of the only way to train here. And we did a concrete ablation studying this as well. The answer is, well, you never really train the model to. So in this particular setting, you're not. Let's say a particular step gives you a higher advantage. You're not training the model to produce this step and then this step. All your training is to produce this step conditioned on the prefix so far.","start":2771.2,"end":2799.46},{"id":118,"text":"So your loss looks like...","start":2799.99,"end":2801.73},{"id":119,"text":"train the model to produce AI given SI and not the previous actions or the previous steps that you see up here. So I'm just going to probably just draw it here because I think it's easiest to draw it. So think of it as this way. You had X or S0. You took A0. You went to S1. You are taking A1, S2. These are steps, and this is the states. Let's say this state got an advantage, which is really positive. So A of S1, A1.","start":2802.37,"end":2831.71},{"id":120,"text":"is really positive, and A of S0, A0 is really negative. What you are going to do now is you're going to not necessarily, so what I'm not saying is train your policy to produce A0 given S0. You're not going to do that. You're going to just train the policy to produce A1 given S0, A0.","start":2832.49,"end":2852.39},{"id":121,"text":"So that's all you're trying. Or, you know, I wrote S0 comma A0. This basically just is equal to S1 because you're concatenating steps. But that's kind of the thing you're going to incentivize. So you're only training on the steps. So the question is, is there a separate prompter that keeps prompting the model when it acts here? The answer is not really, right? So in general, when you do RL, we never really train the policy to sort of, we train a policy, you know, with.","start":2853.34,"end":2878.82}],"notes":["本段讨论了强化学习中优势加权回归的变体，强调了通过过滤优势来训练策略，而不是使用指数优势。讲者提到，虽然可以使用指数优势，但这种方法需要大量调参，因此在只能运行一次实验时，更倾向于使用过滤优势的方法。","讲者回答了一个关于是否仅在正确解的步骤上训练的问题，指出实际上并不训练模型生成特定步骤，而是基于前缀条件生成当前步骤。这表明训练过程关注的是当前步骤的优势，而不是整个路径。","讲者通过状态和动作的序列来解释训练过程，指出模型的训练目标是基于当前状态和前一步动作生成下一步动作，而不是直接基于初始状态生成整个路径。","讲者提到在强化学习中，通常不训练策略去生成特定的步骤，而是基于当前状态和前一步动作进行训练，这表明训练过程是逐步进行的，而不是一次性生成整个路径。","讲者还提到，训练过程中并不需要额外的提示器来持续提示模型，这表明训练过程是基于当前状态和前一步动作的自然生成过程。","讲者强调了训练策略的逐步性和基于优势的过滤方法，这与传统的强化学习方法有所不同，更注重当前步骤的优势而非整个路径的优化。"],"formulas":[],"uncertainties":["e to the a"],"diagram":"none","start":2711.02,"end":2878.82,"asr_flags":[],"math_clarifications":["公式中的指数优势形式与原文描述的'过滤优势'概念不符，原文提到的是使用优势进行加权而非指数化。此外，公式中未明确说明优势a的定义和来源，因此无法准确核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2711.02,"text":"So what does that mean? That basically means that you are taking a particular trace and you are checking at a step level whether the advantages are positive. Even if that particular step comes from an incorrect solution trace, you're going to put that into your training data set if that step itself gives you a high advantage. On the other hand, let's say if that step itself comes from a correct solution trace, maybe there's a particular step here which gets a low advantage or a really negative advantage. I'm going to just throw it away."},{"start":2740.94,"text":"So this is very much reminiscent of advantage weighted regression, except that here, rather than doing exponentiated advantages, which I'm guessing was covered, we are doing sort of like filtering on advantages. That's sort of the basic idea. You can also do exponentiation of advantages. So you can train on everything, but multiply the loss by e to the a. That objective, I think, requires a lot of tuning. And if you can only run one experiment, you probably prefer this objective over e to the a in general."},{"start":2771.2,"text":"That's a great question. So the question is, do you only train up to the good steps on an incorrect solution? The answer is not really. So we initially thought that that's kind of the only way to train here. And we did a concrete ablation studying this as well. The answer is, well, you never really train the model to. So in this particular setting, you're not. Let's say a particular step gives you a higher advantage. You're not training the model to produce this step and then this step. All your training is to produce this step conditioned on the prefix so far."},{"start":2799.99,"text":"So your loss looks like..."},{"start":2802.37,"text":"train the model to produce AI given SI and not the previous actions or the previous steps that you see up here. So I'm just going to probably just draw it here because I think it's easiest to draw it. So think of it as this way. You had X or S0. You took A0. You went to S1. You are taking A1, S2. These are steps, and this is the states. Let's say this state got an advantage, which is really positive. So A of S1, A1."},{"start":2832.49,"text":"is really positive, and A of S0, A0 is really negative. What you are going to do now is you're going to not necessarily, so what I'm not saying is train your policy to produce A0 given S0. You're not going to do that. You're going to just train the policy to produce A1 given S0, A0."},{"start":2853.34,"text":"So that's all you're trying. Or, you know, I wrote S0 comma A0. This basically just is equal to S1 because you're concatenating steps. But that's kind of the thing you're going to incentivize. So you're only training on the steps. So the question is, is there a separate prompter that keeps prompting the model when it acts here? The answer is not really, right? So in general, when you do RL, we never really train the policy to sort of, we train a policy, you know, with."}],"speech_gaps":[],"frame":"../frames/v020/017.webp","frame_time":2723.02},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":122,"text":"to produce individual actions, like in offline RL or in imitation learning, we train it to produce A1 given S1, A2 given S2, and so on. But when it acts in the world, it just acts and produces a giant sequence of actions in one go, right? So you can train the policy on different segments of steps it's seeing, but when it's deployed, it's going to just produce one action, then the state S1 is going to be simply the whole...","start":2879.34,"end":2903.06},{"id":123,"text":"tokens in the question, tokens in the step so far, and that's S1, and you're going to now, the same policy can now continue on and produce the next step. So it's not going to be prompted in any way. It's just going to be producing the whole solution in one flow, except that now you're just training it in a way that you're breaking them down into steps. So really there's no notion of a separate act.","start":2904.23,"end":2922.99},{"id":124,"text":"So the question is, do you only train on a step because of the Markov property, because you don't care how you got there? In a way, the answer is actually no, because in some ways your state S1 consists of all of your history, right? So S1 consists of, so S0 is a problem. A0 is, let's say, step one. And S1 in this case is basically problem concatenated with step one, right?","start":2923.88,"end":2951.13},{"id":125,"text":"So in some ways, you have preserved all of your history in this case, and it's a non-Markovian policy that you're learning, except that here, the reason why we do this at the step level is because now we can better understand which part of the solution actually caused me to derail if it did. So there's no notion of independence. It's not like given S. So, OK, in this particular setting, given S1.","start":2953.01,"end":2974.85},{"id":126,"text":"Sure, action A1 is all matters, but S1 and S0A0 are the same. So depending upon the way you look at it, it can be called a non-Markovian policy as well, because it's conditioned on the whole history. But in this particular setting, if you define S1 as concatenated states, it's a Markovian policy. So the question is if your Q values are really negative, but your advantages are positive, would you put it in the training data set or not?","start":2975.41,"end":3000.3},{"id":127,"text":"Yeah, that's a great question. I think we tried this with like, so we did take traces which were incorrect and we put the steps which were actually good from them into our data set. And that was fine, except that like, let's say if there are traces where everything is just as, like there's no way, like there's no prefix of that from which you can succeed at all. The advantages are also small and the keywords are also small. Turns out that if you filter them out, you might do a little bit better.","start":3001.15,"end":3028.69},{"id":128,"text":"But again, I don't have a very, very concrete result I can show you here, so I'm not going to tell you that this is the way to go. But it seems like, to a large extent, desensitivity does not exist in some way. Because the prefix is the culprit then, and you're training only A1 conditioned on the prefix and not training them all to produce the prefix at all. Okay, great. So that's the first option. So this is a lot like filtered imitation learning or advantage-weighted regression.","start":3029.32,"end":3053.37}],"notes":["本段讨论了在强化学习中如何训练模型以生成序列动作，特别是在大语言模型推理中的应用。讲者指出，虽然训练时可以将动作分解为步骤进行训练，但在实际部署时，模型会一次性生成整个动作序列。这涉及到状态表示的问题，即状态S1是否包含历史信息。","讲者进一步探讨了状态表示与马尔可夫性质的关系。他指出，虽然在某些情况下状态S1包含所有历史信息，因此可能是一个非马尔可夫策略，但在特定设定下，如果将S1定义为拼接状态，则可以视为马尔可夫策略。","讲者提到，训练时需要考虑Q值和优势值的关系。如果Q值为负而优势值为正，是否应该将这些样本包含在训练数据集中。他指出，虽然可以尝试包含这些样本，但过滤掉某些无法成功完成的前缀可能会带来更好的效果。","讲者还提到，虽然没有非常明确的结果，但过滤掉某些无效的前缀可能有助于提高模型性能。他指出，这种做法类似于过滤模仿学习或优势加权回归。","讲者强调了在训练过程中，如何处理历史信息和状态表示的重要性。他指出，虽然模型在训练时可以分解为步骤进行训练，但在实际部署时，模型会一次性生成整个动作序列，这需要在状态表示上进行适当的处理。","最后，讲者提到，虽然没有非常明确的结果，但过滤掉某些无效的前缀可能有助于提高模型性能。他指出，这种做法类似于过滤模仿学习或优势加权回归。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2879.34,"end":3053.37,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2879.34,"text":"to produce individual actions, like in offline RL or in imitation learning, we train it to produce A1 given S1, A2 given S2, and so on. But when it acts in the world, it just acts and produces a giant sequence of actions in one go, right? So you can train the policy on different segments of steps it's seeing, but when it's deployed, it's going to just produce one action, then the state S1 is going to be simply the whole..."},{"start":2904.23,"text":"tokens in the question, tokens in the step so far, and that's S1, and you're going to now, the same policy can now continue on and produce the next step. So it's not going to be prompted in any way. It's just going to be producing the whole solution in one flow, except that now you're just training it in a way that you're breaking them down into steps. So really there's no notion of a separate act."},{"start":2923.88,"text":"So the question is, do you only train on a step because of the Markov property, because you don't care how you got there? In a way, the answer is actually no, because in some ways your state S1 consists of all of your history, right? So S1 consists of, so S0 is a problem. A0 is, let's say, step one. And S1 in this case is basically problem concatenated with step one, right?"},{"start":2953.01,"text":"So in some ways, you have preserved all of your history in this case, and it's a non-Markovian policy that you're learning, except that here, the reason why we do this at the step level is because now we can better understand which part of the solution actually caused me to derail if it did. So there's no notion of independence. It's not like given S. So, OK, in this particular setting, given S1."},{"start":2975.41,"text":"Sure, action A1 is all matters, but S1 and S0A0 are the same. So depending upon the way you look at it, it can be called a non-Markovian policy as well, because it's conditioned on the whole history. But in this particular setting, if you define S1 as concatenated states, it's a Markovian policy. So the question is if your Q values are really negative, but your advantages are positive, would you put it in the training data set or not?"},{"start":3001.15,"text":"Yeah, that's a great question. I think we tried this with like, so we did take traces which were incorrect and we put the steps which were actually good from them into our data set. And that was fine, except that like, let's say if there are traces where everything is just as, like there's no way, like there's no prefix of that from which you can succeed at all. The advantages are also small and the keywords are also small. Turns out that if you filter them out, you might do a little bit better."},{"start":3029.32,"text":"But again, I don't have a very, very concrete result I can show you here, so I'm not going to tell you that this is the way to go. But it seems like, to a large extent, desensitivity does not exist in some way. Because the prefix is the culprit then, and you're training only A1 conditioned on the prefix and not training them all to produce the prefix at all. Okay, great. So that's the first option. So this is a lot like filtered imitation learning or advantage-weighted regression."}],"speech_gaps":[],"frame":"../frames/v020/018.webp","frame_time":2891.34},{"title":"使用RL提升大语言模型推理","segments":[{"id":129,"text":"The next thing, okay, before that, I can show you some results here. So this actually ended up addressing that error going up problem, at least to the extent that we were able to train models. So, you know, here, again, I'm plotting number of correct answers per question, and you'll find that the advantage filtering did help you compared to sort of the RFT approach, which was going up before.","start":3054.12,"end":3074.2},{"id":130,"text":"And we did measure the number of spurious steps according to some heuristic definition of how we can evaluate this, like how we can probe this. And it seemed like, just from a qualitative perspective also, the number of spurious steps actually kind of reduced in some way. Okay, so the next thing is, how can you use this for offline reinforcement learning? And this is where sort of DPO-based methods come in. So there was a question about this earlier in the class. So you can also use the same principle for doing DPO, actually.","start":3076.6,"end":3105.18},{"id":131,"text":"So the idea in DPO is sort of slightly different from computing this advantage exactly, but uses the same protocol that I described to you earlier, where what you're going to do now is you're going to take a solution from your base model that you're training. Maybe this is incorrect. And so far, what we did was we found out steps that were useful and retained them in some way or the other and discarded everything else. But what we can do now is we can do these rollouts. And rather than sort of throwing away","start":3106.04,"end":3131.44},{"id":132,"text":"or throwing away these rollouts or just using these rollouts to estimate the advantage, what I can do is I can instead take a rollout which ended up succeeding with a shared prefix, take the solution trace from my model which did not end up succeeding, and construct a preference pair out of them. So I now have a preference pair which looks like some prefix followed by some correction, which is good, and some prefix followed by some steps which are actually wrong.","start":3132.86,"end":3160.5},{"id":133,"text":"and I can throw this into a DPO training dataset. I can also do the same thing with a correct rollout. So if let's say I have a correct rollout from my base model, I can still do these rollouts, and maybe one of them will not end up succeeding, potentially, from my rollout policy, and I can basically put this thing as a preference pair into my training mix.","start":3161.03,"end":3182.59},{"id":134,"text":"So the nice thing that is happening, or there are two differences that are happening here, right? In some way, I'm still realizing in this process that prefixes are shared. And really the difference between, you know, correct and incorrect rollout comes from that little segment that you see, you know, beyond the prefix in the settings. That's the first thing. And the second thing is, you know, rather than the previous approach of filtering by advantages, I'm actually retaining the whole steps that appear in this rollout distribution.","start":3183.81,"end":3210.29},{"id":135,"text":"So I'm not simply using these rollouts like the orange colored dashed lines to compute advantages, but I'm retaining them and I'm training on top of the tokens that appear in that rollout as well.","start":3211.07,"end":3221.75},{"id":136,"text":"So the DPO loss, I guess I don't have that on my slides, but I guess probably I don't need to necessarily write that down.","start":3222.77,"end":3229.97}],"notes":["本段讲解了如何利用DPO方法来提升大语言模型的推理能力。讲者提到，DPO方法与之前通过优势计算来过滤步骤的方式不同，而是保留了整个rollout过程中的所有步骤。这表明DPO方法在训练过程中不仅关注优势，还考虑了整个推理路径的结构。","讲者进一步说明，DPO方法通过构建偏好对（preference pair）来训练模型。偏好对由共享前缀和后续步骤组成，其中一部分步骤是正确的，另一部分是错误的。这种方法能够更全面地捕捉模型推理过程中的差异。","在构建偏好对时，讲者提到可以使用成功和失败的rollout来生成数据。成功rollout的后续步骤被保留，而失败rollout的后续步骤则被用来与成功步骤进行对比，从而形成训练数据。","讲者还指出，DPO方法的一个关键点是保留所有步骤，而不仅仅是用于计算优势的步骤。这表明DPO方法在训练过程中更注重整个推理路径的完整性，而不仅仅是局部优势。","此外，讲者提到DPO方法与之前通过优势过滤步骤的方式不同，这表明DPO方法在处理推理路径时采用了不同的策略，可能更适用于复杂或长序列的推理任务。","最后，讲者提到DPO损失函数可能不需要在幻灯片上展示，这表明DPO方法的实现细节可能较为复杂，或者讲者认为在当前的讲解中不需要深入讨论损失函数的具体形式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3054.12,"end":3229.97,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3054.12,"text":"The next thing, okay, before that, I can show you some results here. So this actually ended up addressing that error going up problem, at least to the extent that we were able to train models. So, you know, here, again, I'm plotting number of correct answers per question, and you'll find that the advantage filtering did help you compared to sort of the RFT approach, which was going up before."},{"start":3076.6,"text":"And we did measure the number of spurious steps according to some heuristic definition of how we can evaluate this, like how we can probe this. And it seemed like, just from a qualitative perspective also, the number of spurious steps actually kind of reduced in some way. Okay, so the next thing is, how can you use this for offline reinforcement learning? And this is where sort of DPO-based methods come in. So there was a question about this earlier in the class. So you can also use the same principle for doing DPO, actually."},{"start":3106.04,"text":"So the idea in DPO is sort of slightly different from computing this advantage exactly, but uses the same protocol that I described to you earlier, where what you're going to do now is you're going to take a solution from your base model that you're training. Maybe this is incorrect. And so far, what we did was we found out steps that were useful and retained them in some way or the other and discarded everything else. But what we can do now is we can do these rollouts. And rather than sort of throwing away"},{"start":3132.86,"text":"or throwing away these rollouts or just using these rollouts to estimate the advantage, what I can do is I can instead take a rollout which ended up succeeding with a shared prefix, take the solution trace from my model which did not end up succeeding, and construct a preference pair out of them. So I now have a preference pair which looks like some prefix followed by some correction, which is good, and some prefix followed by some steps which are actually wrong."},{"start":3161.03,"text":"and I can throw this into a DPO training dataset. I can also do the same thing with a correct rollout. So if let's say I have a correct rollout from my base model, I can still do these rollouts, and maybe one of them will not end up succeeding, potentially, from my rollout policy, and I can basically put this thing as a preference pair into my training mix."},{"start":3183.81,"text":"So the nice thing that is happening, or there are two differences that are happening here, right? In some way, I'm still realizing in this process that prefixes are shared. And really the difference between, you know, correct and incorrect rollout comes from that little segment that you see, you know, beyond the prefix in the settings. That's the first thing. And the second thing is, you know, rather than the previous approach of filtering by advantages, I'm actually retaining the whole steps that appear in this rollout distribution."},{"start":3211.07,"text":"So I'm not simply using these rollouts like the orange colored dashed lines to compute advantages, but I'm retaining them and I'm training on top of the tokens that appear in that rollout as well."},{"start":3222.77,"text":"So the DPO loss, I guess I don't have that on my slides, but I guess probably I don't need to necessarily write that down."}],"speech_gaps":[],"frame":"../frames/v020/019.webp","frame_time":3066.12},{"title":"强化学习中RL与大语言模型推理的结合","segments":[{"id":137,"text":"But it's basically just a matter of the same old DPO loss on top of these two segments of solutions that we talked about.","start":3230.07,"end":3238.27},{"id":138,"text":"yeah great question the question is do you want high quality text or do you want","start":3239.11,"end":3243.23},{"id":139,"text":"sort of more diversity um i think the the true uh so uh okay so uh i should mention that like","start":3243.23,"end":3250.55},{"id":140,"text":"this is something that we have tried to formalize so there's like an exact equation that you can","start":3250.55,"end":3254.95},{"id":141,"text":"you can write down and you can be like okay i want a policy to do these rollouts which","start":3254.95,"end":3258.91},{"id":142,"text":"maximizes this expression um sort of thing in one of the papers um i think that kind of balances","start":3259.55,"end":3265.81},{"id":143,"text":"differences in some way, diversity and high quality.","start":3265.81,"end":3268.41},{"id":144,"text":"So imagine for a second that your model is really bad.","start":3268.71,"end":3271.55},{"id":145,"text":"So let's say your model mostly produces incorrect.","start":3271.69,"end":3274.37},{"id":146,"text":"then you want a rollout policy that can actually somewhat succeed because otherwise there's no notion of a success that you can learn from ever, right? You've only seen failures. How can you actually even learn to solve that problem if you only see failures? On the other hand, let's say if your model is kind of decent, like 50% accurate, but it's not as good overall, like it's not the best at solving problems. In that case, maybe all you want is just diverse ways of solving the problem such that you can see what ways you're more prone to failing. So you care about sort of coverage in some ways. So really the answer here is like every,","start":3275.37,"end":3304.63},{"id":147,"text":"single problem in RL, there is some balance between exploration and exploitation you kind of want to do, which is high-quality text or high-quality solutions which solve the question correctly and being more diverse in some way. I think the exact expression for this is actually something you can also write down, and I'm not going to cover today, but yeah, it's straight up between them.","start":3304.75,"end":3324.73},{"id":148,"text":"Yeah, so they basically used to train DPU. So, you know, like so far, I guess, okay, actually, let me just write that algorithm down for everybody's understanding. So what you do is you're basically, so that is the RFT algorithm. And now what we are going to do is we are going to simply do the same process. So for iteration in 1 to T, I'm going to, you know, sample Y1 to N from my current policy.","start":3325.61,"end":3353.72},{"id":149,"text":"given any question. I am going to now do these rollouts. So I'm going to do rollouts and construct the preference data set depref. In this case, it's basically those preferences. And now what I'm going to do is I'm going to run or minimize DPO loss. That's kind of the main algorithm that you're going to do. And the depref consists of prefixes generated from your current base model.","start":3355.46,"end":3390.79},{"id":150,"text":"and the trace is coming from one part of it is from the same model that you are training, pi theta. The other segment, the other part of the preference pair comes from the rollout policy. That's the orange line.","start":3391.26,"end":3401.84}],"notes":["本段讨论了在强化学习中如何平衡高质量文本与多样性的问题。讲者指出，当模型表现较差时，需要一个能够成功执行的rollout策略，否则无法从失败中学习。当模型表现中等时，更关注多样性的解决方案，以发现模型容易失败的方式。这与强化学习中的探索与利用（exploration and exploitation）概念相呼应，即在追求高质量解决方案的同时，也要考虑多样性。","讲者提到，这种平衡可以通过一个具体的表达式来形式化，但并未在本段详细展开。这表明在实际应用中，需要根据具体问题来设计相应的策略，以实现高质量与多样性的平衡。","在构建偏好数据集（depref）时，讲者提到该数据集由当前基础模型生成的前缀和rollout策略生成的轨迹组成。这表明在训练过程中，需要将模型的输出与rollout策略的输出进行比较，以形成偏好数据。","讲者还提到，DPO损失函数是训练过程中的核心算法，通过最小化该损失函数来优化模型性能。这表明DPO损失函数在强化学习与大语言模型推理的结合中起着关键作用。","讲者提到，rollout策略的轨迹来自当前训练的模型（pi theta）和rollout策略本身。这表明在训练过程中，需要将模型的输出与rollout策略的输出进行比较，以形成偏好数据。","最后，讲者提到，整个过程与DPO算法类似，但具体实现细节未在本段展开。这表明在实际应用中，需要根据具体问题来设计相应的训练流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3230.07,"end":3401.84,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3230.07,"text":"But it's basically just a matter of the same old DPO loss on top of these two segments of solutions that we talked about."},{"start":3239.11,"text":"yeah great question the question is do you want high quality text or do you want"},{"start":3243.23,"text":"sort of more diversity um i think the the true uh so uh okay so uh i should mention that like"},{"start":3250.55,"text":"this is something that we have tried to formalize so there's like an exact equation that you can"},{"start":3254.95,"text":"you can write down and you can be like okay i want a policy to do these rollouts which"},{"start":3259.55,"text":"maximizes this expression um sort of thing in one of the papers um i think that kind of balances"},{"start":3265.81,"text":"differences in some way, diversity and high quality."},{"start":3268.71,"text":"So imagine for a second that your model is really bad."},{"start":3271.69,"text":"So let's say your model mostly produces incorrect."},{"start":3275.37,"text":"then you want a rollout policy that can actually somewhat succeed because otherwise there's no notion of a success that you can learn from ever, right? You've only seen failures. How can you actually even learn to solve that problem if you only see failures? On the other hand, let's say if your model is kind of decent, like 50% accurate, but it's not as good overall, like it's not the best at solving problems. In that case, maybe all you want is just diverse ways of solving the problem such that you can see what ways you're more prone to failing. So you care about sort of coverage in some ways. So really the answer here is like every,"},{"start":3304.75,"text":"single problem in RL, there is some balance between exploration and exploitation you kind of want to do, which is high-quality text or high-quality solutions which solve the question correctly and being more diverse in some way. I think the exact expression for this is actually something you can also write down, and I'm not going to cover today, but yeah, it's straight up between them."},{"start":3325.61,"text":"Yeah, so they basically used to train DPU. So, you know, like so far, I guess, okay, actually, let me just write that algorithm down for everybody's understanding. So what you do is you're basically, so that is the RFT algorithm. And now what we are going to do is we are going to simply do the same process. So for iteration in 1 to T, I'm going to, you know, sample Y1 to N from my current policy."},{"start":3355.46,"text":"given any question. I am going to now do these rollouts. So I'm going to do rollouts and construct the preference data set depref. In this case, it's basically those preferences. And now what I'm going to do is I'm going to run or minimize DPO loss. That's kind of the main algorithm that you're going to do. And the depref consists of prefixes generated from your current base model."},{"start":3391.26,"text":"and the trace is coming from one part of it is from the same model that you are training, pi theta. The other segment, the other part of the preference pair comes from the rollout policy. That's the orange line."}],"speech_gaps":[],"frame":"../frames/v020/020.webp","frame_time":3242.07},{"title":"如何将回答分割为步骤","segments":[{"id":151,"text":"So the question is, given a sample trajectory, how do we segment into steps? So in this work, we just used sentences. So we just said, well, sentences, we're going to break them down into steps from after every sentence. In general, I think it depends. It's a thing that you can bake into your model. So if you have played with, for example, open AI models, you'll see that they often produce responses that look like, you know, step one in sort of markdown, like a very big step one, and then they'll say a bunch of stuff, and then step two, and they'll say a bunch of stuff. So you can use that sort of notation.","start":3402.7,"end":3431.72},{"id":152,"text":"Oftentimes, it's so happening that as these models kind of get better at basic instruction following, you can just prompt them to produce responses for complex questions in a particular stylistic fashion and use some heuristics about that style to partition things into steps. So, for instance, you can just tell a model, well, I want an answer for this particular question that never uses the word step, that always produces a logical block of calculation, puts a horizontal","start":3432.24,"end":3461.3},{"id":153,"text":"a line and then pushes the next logical block and so on. And it will most likely do it for you, which is something you can also do during the course of training. So you can just prompt them to kind of produce solutions in a particular way and then define steps accordingly. There's no universal definition. So the question is, is there a convention to produce special tokens for generating steps?","start":3461.45,"end":3477.46},{"id":154,"text":"I think that I've not seen a very, very clear convention that is universally used all the time. One convention that we have been using that I've seen many other papers use, but they're still outliers for this, is they would produce like step hash one colon and then say something. And that could be a bunch of lines as well. In this work, we used lines. In a follow-up thing, we had used this step notion. So it really depends on up to you, really, I think.","start":3478.78,"end":3502.94},{"id":155,"text":"Okay, cool. Any questions on the DPO part in this case? So this is the DPO version of the algorithm. Great, okay. So you can do this and put this into your data. So if you go back to our plot from before, if you measure how well does such kind of an offline RL method do, what ends up happening is, okay, I guess these were supposed to be GIFs, but anyways. So I'm now plotting the test error as a function of number of questions that,","start":3505.21,"end":3537.23},{"id":156,"text":"existed in my data set. So far, we were looking at number of correct answers per question for a lot of the plots in the middle. But now I'm back to the plot where we are plotting the x-axis as a function of number of questions in the original data set. And you find that compared to, and now there are two models here. One of them is like a LAMA2 model. So this probably tells you how old this work is at this point. It's a year old, but LAMA2 feels like a long time ago.","start":3538.02,"end":3563.18}],"notes":["本段讨论了如何将模型的回答分割为步骤，指出这取决于模型的输出风格。例如，一些模型会以Markdown格式输出步骤，如'步骤一'、'步骤二'等。此外，也可以通过提示模型以特定方式生成答案，如避免使用'步骤'一词，而是以逻辑块的形式呈现，通过水平线分隔。这种方法可以在训练过程中实现。","讲者提到没有统一的定义来生成步骤，但存在一些惯例，如使用特殊标记（如'step #1:'）来表示步骤。这些惯例在不同论文中有所应用，但并非普遍采用。因此，如何分割步骤取决于具体任务和模型的输出风格。","在讨论DPO算法时，讲者提到可以将这种分割方法应用于数据中，并通过图表展示其效果。图表显示了测试误差随问题数量的变化，这有助于评估离线强化学习方法的性能。","讲者还提到，LAMA2模型的使用表明该工作已有约一年的历史，这反映了该领域的发展速度。通过比较不同模型的性能，可以评估不同方法的有效性。","讲者强调，分割步骤的方法并非固定，而是可以根据具体任务和模型的输出风格进行调整。因此，选择合适的分割方法是实现有效推理的关键。","最后，讲者询问了关于DPO部分的问题，表明该部分是课程的重点之一。通过讨论不同模型的性能，可以进一步理解强化学习在提升大语言模型推理中的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3402.7,"end":3563.18,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3402.7,"text":"So the question is, given a sample trajectory, how do we segment into steps? So in this work, we just used sentences. So we just said, well, sentences, we're going to break them down into steps from after every sentence. In general, I think it depends. It's a thing that you can bake into your model. So if you have played with, for example, open AI models, you'll see that they often produce responses that look like, you know, step one in sort of markdown, like a very big step one, and then they'll say a bunch of stuff, and then step two, and they'll say a bunch of stuff. So you can use that sort of notation."},{"start":3432.24,"text":"Oftentimes, it's so happening that as these models kind of get better at basic instruction following, you can just prompt them to produce responses for complex questions in a particular stylistic fashion and use some heuristics about that style to partition things into steps. So, for instance, you can just tell a model, well, I want an answer for this particular question that never uses the word step, that always produces a logical block of calculation, puts a horizontal"},{"start":3461.45,"text":"a line and then pushes the next logical block and so on. And it will most likely do it for you, which is something you can also do during the course of training. So you can just prompt them to kind of produce solutions in a particular way and then define steps accordingly. There's no universal definition. So the question is, is there a convention to produce special tokens for generating steps?"},{"start":3478.78,"text":"I think that I've not seen a very, very clear convention that is universally used all the time. One convention that we have been using that I've seen many other papers use, but they're still outliers for this, is they would produce like step hash one colon and then say something. And that could be a bunch of lines as well. In this work, we used lines. In a follow-up thing, we had used this step notion. So it really depends on up to you, really, I think."},{"start":3505.21,"text":"Okay, cool. Any questions on the DPO part in this case? So this is the DPO version of the algorithm. Great, okay. So you can do this and put this into your data. So if you go back to our plot from before, if you measure how well does such kind of an offline RL method do, what ends up happening is, okay, I guess these were supposed to be GIFs, but anyways. So I'm now plotting the test error as a function of number of questions that,"},{"start":3538.02,"text":"existed in my data set. So far, we were looking at number of correct answers per question for a lot of the plots in the middle. But now I'm back to the plot where we are plotting the x-axis as a function of number of questions in the original data set. And you find that compared to, and now there are two models here. One of them is like a LAMA2 model. So this probably tells you how old this work is at this point. It's a year old, but LAMA2 feels like a long time ago."}],"speech_gaps":[],"frame":"../frames/v020/021.webp","frame_time":3414.7},{"title":"强化学习在大语言模型推理中的应用","segments":[{"id":157,"text":"And then DeepSeq V2 models as well as DeepSeq V2 models. And what we are finding in general is that compared to the base SFT method, where you were just training on human written solutions, you can get up to an 8x boost in the amount of data that you need for training. So the dashed line here is this first step sort of DPO algorithm that I talked about.","start":3564.23,"end":3583.95},{"id":158,"text":"And you see that it can get you the same test error with 8x fewer samples than training with SFT on human-written data. RFT was 2x for recollection. I removed that line here because it would have been too cluttered. But in general, this 8x also holds true for LAMA2 roughly overall in this setting.","start":3584.55,"end":3602.69},{"id":159,"text":"Yeah, so the question is, what is pass at five? That's a great question. So you can think of pass at five, I guess, for understanding the slide, it doesn't matter, first of all. But in general, you can think of pass at five basically as saying, if I gave the model five chances, can it succeed even once out of those five chances? So it's sort of a way people evaluate models because it's kind of telling you that, okay, maybe the model could not succeed in one try, but if I give it like five N tries, maybe it can succeed. And that's what pass at N.","start":3603.67,"end":3628.49},{"id":160,"text":"I mean, I don't think for this particular result it matters so much. The main thing to look at is this 8x kind of boost in data efficiency that you see up here.","start":3629.76,"end":3637.34},{"id":161,"text":"Okay, so the high-level takeaway here is that if you do offline RL with sort of this per-step notion of credit assignment that we talked about, you can actually get a lot more data efficiency boost compared to imitation learning. So for the same amount of data for the same base model,
