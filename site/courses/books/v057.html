<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯坦福CS230：增强 LLM 应用</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：增强 LLM 应用 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v057.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v057","title":"斯坦福CS230：增强 LLM 应用","course":"深度学习","pages":[{"title":"超越大型语言模型：增强应用与代理AI工作流","segments":[{"id":0,"text":"Hi, everyone. Welcome to another lecture for CS230 Deep Learning. Today, we're going to talk about enhancing large language model applications. And I call this lecture Beyond LLM. It has a lot of newer content.","zh":"大家好。欢迎参加CS230深度学习的又一节课。今天，我们将讨论增强大型语言模型的应用。我称这节课为超越大型语言模型。它包含很多较新的内容。","start":1.33,"end":21.77},{"id":1,"text":"And the idea behind this lecture is we started to learn about neurons, and then we learned about layers, and then we learned about deep neural networks, and then we learned a little bit about how to structure projects in C3. And now we're going one level beyond into what would it look like if you were building agentic AI systems at work.","zh":"这节课的思路是，我们一开始学习了神经元，然后学习了层，接着学习了深度神经网络，然后学习了一点如何在C3中构建项目。现在，我们将进入一个更高级的层次，思考如果你在工作中构建代理型AI系统会是什么样子。","start":22.93,"end":50.05},{"id":2,"text":"In a startup, in a company. And it's probably one of the more practical lectures. Again, the goal is not to build a product end to end in the next hour or so, but rather to tell you all the techniques that...","zh":"在初创公司或公司中。这可能是一节更加实用的课程。再次强调，我们的目标并不是在接下来的一个小时内构建一个完整的产品，而是向你们介绍所有这些技术……","start":50.69,"end":66.45},{"id":3,"text":"AI engineers have cracked, figured out or exploring so that after the class, you have sort of the breadth of view of different prompting techniques, different agentic workflows, multi-agency stands, evals. And then when you want to dive deeper, you have the baggage to dive deeper and learn faster about it. Okay.","zh":"AI工程师们已经破解、弄清楚或正在探索的。这样，在课程结束后，你们将对各种提示技术、代理工作流、多代理系统、评估方法等有一个大致的了解。当你们想要深入研究时，你们将拥有足够的背景知识，能够更快地学习和深入理解。好的。","start":67.04,"end":87.1},{"id":4,"text":"Let's try to make it as interactive as possible, as usual. When we look at the agenda, the agenda is going to start with the core idea behind challenges and opportunities for augmenting LLMs. So we start from a base model. How do we maximize the performance of that base model? Then we dive deep into the first line of optimization, which is prompting methods. And we see a variety of","zh":"我们尽量让这节课尽可能互动。通常情况下，当我们查看议程时，议程将从增强大型语言模型所面临的挑战和机遇的核心思想开始。因此，我们从一个基础模型开始。如何最大化这个基础模型的性能？然后我们将深入探讨优化的第一线，即提示方法。我们会看到各种各样的方法。","start":88.61,"end":117.81},{"id":5,"text":"of them. Then we go slightly deeper. If we were to get our hands under the hood and do some fine tuning, what would it look like? I'm not a fan of fine tuning. And I talk a lot about that, but I'll explain why I try to.","zh":"然后我们将稍微深入一点。如果我们想要深入了解并进行一些微调，会是什么样子？我不太喜欢微调。我会对此进行很多讨论，但我会解释我为何尽量避免这样做。","start":117.87,"end":130.59},{"id":6,"text":"Avoid fine-tuning as much as possible. And then we'll do a section four on retrieval augmented generation or RAG, which you've probably heard of in the news. Maybe some of you have played with RAGs. We're going to sort of unpack what a RAG is and how it works and then the different methods within RAGs.","zh":"尽可能避免微调。然后我们将进行第四部分，关于检索增强生成（RAG），这在新闻中你可能已经听说过。也许你们中的一些人已经尝试过RAG。我们将大致拆解RAG是什么以及它是如何工作的，然后是RAG中的不同方法。","start":131.34,"end":152.64},{"id":7,"text":"And then we talk about agentic AI workflows. I'll define it. Andrew Ng is one of the first ones who have called this trend agentic AI workflows. And so we look at the definition that Andrew gives to agentic workflows, and then we start seeing examples. The section six is very practical. It's a case study where we will...","zh":"然后我们讨论代理AI工作流。我会对其进行定义。Andrew Ng 是最早将这一趋势称为代理AI工作流的人之一。因此，我们首先看一下 Andrew 给出的代理工作流的定义，然后开始看到一些例子。第六节非常实用。它是一个案例研究，我们将……","start":153.24,"end":178.5}],"notes":["本讲讨论如何增强大型语言模型应用，讲者将其称为“Beyond LLM”。课程从神经元、网络层和深度神经网络的基础出发，进一步讨论在创业公司或企业中构建代理式 AI 系统时会用到的方法。本讲的目标是建立技术全景，便于之后继续深入，而不是在一节课内从头到尾完成一个产品。","内容首先讨论：给定一个基础模型，如何尽可能发挥它的性能。第一条优化路线是提示方法；随后讨论如果能够修改模型内部、进行微调，会涉及什么。讲者表达了自己倾向于尽量避免微调，并预告稍后解释原因；这里还没有给出这一取舍的详细论证。","另一条路线是检索增强生成（Retrieval-Augmented Generation，RAG）。讲者预告会拆解 RAG 的含义、工作方式及不同做法。接着介绍代理式 AI 工作流。讲者将 Andrew Ng 描述为较早以这一名称概括该趋势的人之一，并计划结合其定义和具体例子展开。","这段主要是课程导入和议程说明，尚未进入具体算法推导，因此不列数学公式。阅读时先分清模型本身的改进、提示方法、外部检索和代理工作流几条路线，后续再结合相应时段理解各自的作用。"],"formulas":[],"uncertainties":["原始识别中的“C3”可能是课程名称或编号的误识别；本页中文说明未将其作为确定名称。"],"diagram":"none","start":1.33,"end":178.5,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1.33,"text":"Hi, everyone. Welcome to another lecture for CS230 Deep Learning. Today, we're going to talk about enhancing large language model applications. And I call this lecture Beyond LLM. It has a lot of newer content."},{"start":22.93,"text":"And the idea behind this lecture is we started to learn about neurons, and then we learned about layers, and then we learned about deep neural networks, and then we learned a little bit about how to structure projects in C3. And now we're going one level beyond into what would it look like if you were building agentic AI systems at work."},{"start":50.69,"text":"in a startup, in a company. And it's probably one of the more practical lectures. Again, the goal is not to build a product end to end in the next hour or so, but rather to tell you all the techniques that..."},{"start":67.04,"text":"AI engineers have cracked, figured out or exploring so that after the class, you have sort of the breadth of view of different prompting techniques, different agentic workflows, multi-agency stands, evals. And then when you want to dive deeper, you have the baggage to dive deeper and learn faster about it. Okay."},{"start":88.61,"text":"let's try to make it as interactive as possible, as usual. When we look at the agenda, the agenda is going to start with the core idea behind challenges and opportunities for augmenting LLMs. So we start from a base model. How do we maximize the performance of that base model? Then we dive deep into the first line of optimization, which is prompting methods. And we see a variety of"},{"start":117.87,"text":"of them. Then we go slightly deeper. If we were to get our hands under the hood and do some fine tuning, what would it look like? I'm not a fan of fine tuning. And I talk a lot about that, but I'll explain why I try to."},{"start":131.34,"text":"avoid fine-tuning as much as possible. And then we'll do a section four on retrieval augmented generation or RAG, which you've probably heard of in the news. Maybe some of you have played with RAGs. We're going to sort of unpack what a RAG is and how it works and then the different methods within RAGs."},{"start":153.24,"text":"And then we talk about agentic AI workflows. I'll define it. Andrew Ng is one of the first ones who have called this trend agentic AI workflows. And so we look at the definition that Andrew gives to agentic workflows, and then we start seeing examples. The section six is very practical. It's a case study where we will..."}],"speech_gaps":[],"frame":"../frames/v057/001.webp","frame_time":13.33},{"title":"增强LLM应用的挑战","segments":[{"id":8,"text":"Think about an agentic workflow and I'll ask you to measure if the agent actually works. And we brainstorm how we can measure if an agentic workflow is working the way you want it to work. There's plenty of methods called evals that...","zh":"思考一个代理工作流程，然后我会让你评估这个代理是否真的有效。我们还将一起探讨如何衡量一个代理工作流程是否按照你期望的方式运行。有很多被称为评估（evals）的方法...","start":179.07,"end":195.51},{"id":9,"text":"solve that problem. And then we look briefly at multi-agent workflow, and then we can have a sort of open-ended discussion where I share some thoughts on what's next in AI. And I'm looking forward to hearing from you all as well on that one. Okay, so let's get started with the problem of augmenting LLM. So open-ended question for you.","zh":"可以解决这个问题。然后我们简要地看一下多代理工作流程，之后我们可以进行一个开放式的讨论，我将分享一些关于AI未来发展的想法。我也很期待听到你们对此的看法。好的，那么我们开始讨论如何增强LLM的问题。这是一个开放性问题。","start":196.58,"end":219.68},{"id":10,"text":"You are all familiar with pre-trained models like GPT 3.5 Turbo or GPT 4.0. What's the limitation of using just a base model? What are the typical issues that might arise as you're using a vanilla pre-trained model? Yes.","zh":"你们都熟悉像GPT 3.5 Turbo或GPT 4.0这样的预训练模型。仅使用基础模型有什么局限性？在使用一个普通的预训练模型时，可能会出现哪些典型问题？","start":220.44,"end":244.32},{"id":11,"text":"Lack some domain knowledge. You're perfectly right.","zh":"缺乏一些领域知识。你完全正确。","start":246.43,"end":248.67},{"id":12,"text":"We had a group of students a few years ago, it was not LLM related,","zh":"几年前我们有一组学生，那并不是与LLM相关的项目，","start":248.87,"end":253.51},{"id":13,"text":"but they were building an autonomous farming device or vehicle","zh":"但他们正在构建一个自主的农业设备或车辆","start":253.69,"end":260.47},{"id":14,"text":"that had a camera underneath taking pictures of crops","zh":"其下方装有摄像头，用来拍摄作物的照片","start":260.47,"end":263.87},{"id":15,"text":"to determine if the crop is sick or not, if it should be thrown away,","zh":"以判断作物是否生病，是否需要丢弃，","start":263.87,"end":268.71},{"id":16,"text":"if it should be used or not.","zh":"是否应该使用它。","start":268.97,"end":271.55},{"id":17,"text":"and that data set","zh":"以及那个数据集","start":271.55,"end":273.87},{"id":18,"text":"is not a data set you find out there","zh":"并不是你能在外面找到的那个数据集","start":273.87,"end":276.45},{"id":19,"text":"and the base model","zh":"以及基础模型","start":276.45,"end":278.39},{"id":20,"text":"or a pre-trained computer","zh":"或者一个预训练的计算机","start":278.39,"end":280.39},{"id":21,"text":"vision model would lack that knowledge","zh":"视觉模型将缺乏这种知识","start":280.39,"end":282.39},{"id":22,"text":"of course. What else?","zh":"当然。还有什么？","start":282.39,"end":284.13},{"id":23,"text":"Yes?","zh":"是的？","start":285.47,"end":286.07},{"id":24,"text":"I'm sorry to interrupt","zh":"很抱歉打断一下","start":286.33,"end":287.27},{"id":25,"text":"but in reality","zh":"但事实上","start":288.25,"end":289.61},{"id":26,"text":"the pictures are very dark","zh":"图片非常暗","start":289.61,"end":291.45},{"id":27,"text":"Okay, maybe","zh":"好的，也许","start":292.43,"end":293.83},{"id":28,"text":"you're saying, so just to","zh":"你是在说，所以为了","start":293.83,"end":295.99},{"id":29,"text":"repeat for people online","zh":"让在线的人重复一下","start":295.99,"end":297.95},{"id":30,"text":"you're saying the model might have been trained","zh":"你是在说这个模型可能是在","start":297.95,"end":300.21},{"id":31,"text":"on high quality data, but the data","zh":"高质量数据上训练的，但数据","start":300.21,"end":302.25},{"id":32,"text":"in the wild is actually not that high quality.","zh":"在现实世界中实际并不是很高质量。","start":302.25,"end":304.13},{"id":33,"text":"And in fact, yes, the distribution","zh":"事实上，是的，真实世界的分布","start":304.37,"end":306.03},{"id":34,"text":"of the real world might differ","zh":"可能与训练集不同，","start":306.03,"end":308.23},{"id":35,"text":"as we've seen with GANs","zh":"正如我们看到的GANs的情况一样。","start":308.23,"end":310.23},{"id":36,"text":"from the training sets.","zh":"这可能会导致预训练模型出现问题，","start":310.23,"end":311.87},{"id":37,"text":"And that might create an issue with pre-trained","zh":"尽管预训练的LLMs","start":312.09,"end":314.17},{"id":38,"text":"models, although pre-trained LLMs","zh":"在某种程度上变得更好了。","start":314.17,"end":316.15},{"id":39,"text":"are getting better at","zh":"正在变得更好","start":316.15,"end":317.21},{"id":40,"text":"handling all sorts of data","zh":"处理各种类型的数据","start":318.15,"end":320.05},{"id":41,"text":"inputs. Yes?","zh":"输入。是吗？","start":320.05,"end":321.91},{"id":42,"text":"Like what?","zh":"比如什么？","start":322.71,"end":323.59},{"id":43,"text":"Lacks current information.","zh":"缺乏当前信息。","start":326.21,"end":327.75},{"id":44,"text":"The LLM is not up to date.","zh":"语言模型没有更新。","start":328.33,"end":329.95},{"id":45,"text":"And in fact, you're right. Imagine you have to retrain from scratch your LLM every couple of months.","zh":"事实上，你说得对。想象一下，你每隔几个月就要从头开始重新训练你的语言模型。","start":330.21,"end":335.29},{"id":46,"text":"One story that I found funny, it's from probably three years ago or maybe more, five years ago, where during his first presidency, President Trump one day tweeted,","zh":"我曾听过一个有趣的故事，大概是在三年前或更早，五年前，当时特朗普总统在任期间有一天推特上写道，","start":335.75,"end":348.01},{"id":47,"text":"You remember that tweet or?","zh":"你还记得这条推文吗？","start":349.39,"end":351.03},{"id":48,"text":"just covfefe and it was probably a typo or it was in his pocket i don't know but that word","zh":"只是covfefe，可能是拼写错误，或者当时在口袋里，我也不确定，但那个词","start":352.07,"end":357.93}],"notes":["课堂中提到一个实际案例，即学生团队开发的自主农业设备，该设备使用摄像头拍摄作物图像以判断作物是否健康。由于实际数据质量不高，基础模型无法准确识别作物状态，这说明了模型在现实数据分布与训练数据分布不一致时的局限性。","讲者以特朗普的“covfefe”推文为例，说明了模型无法获取最新信息的问题。该例子表明，如果模型没有及时更新，可能会产生错误或不相关的输出。"],"formulas":[],"uncertainties":["i don't know but that word"],"diagram":"none","start":179.07,"end":357.93,"asr_flags":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":179.07,"text":"Think about an agentic workflow and I'll ask you to measure if the agent actually works. And we brainstorm how we can measure if an agentic workflow is working the way you want it to work. There's plenty of methods called evals that..."},{"start":196.58,"text":"solve that problem. And then we look briefly at multi-agent workflow, and then we can have a sort of open-ended discussion where I share some thoughts on what's next in AI. And I'm looking forward to hearing from you all as well on that one. Okay, so let's get started with the problem of augmenting LLM. So open-ended question for you."},{"start":220.44,"text":"You are all familiar with pre-trained models like GPT 3.5 Turbo or GPT 4.0. What's the limitation of using just a base model? What are the typical issues that might arise as you're using a vanilla pre-trained model? Yes."},{"start":246.43,"text":"Lack some domain knowledge. You're perfectly right."},{"start":248.87,"text":"We had a group of students a few years ago, it was not LLM related,"},{"start":253.69,"text":"but they were building an autonomous farming device or vehicle"},{"start":260.47,"text":"that had a camera underneath taking pictures of crops"},{"start":263.87,"text":"to determine if the crop is sick or not, if it should be thrown away,"},{"start":268.97,"text":"if it should be used or not."},{"start":271.55,"text":"and that data set"},{"start":273.87,"text":"is not a data set you find out there"},{"start":276.45,"text":"and the base model"},{"start":278.39,"text":"or a pre-trained computer"},{"start":280.39,"text":"vision model would lack that knowledge"},{"start":282.39,"text":"of course. What else?"},{"start":285.47,"text":"Yes?"},{"start":286.33,"text":"I'm sorry to interrupt"},{"start":288.25,"text":"but in reality"},{"start":289.61,"text":"the pictures are very dark"},{"start":292.43,"text":"Okay, maybe"},{"start":293.83,"text":"you're saying, so just to"},{"start":295.99,"text":"repeat for people online"},{"start":297.95,"text":"you're saying the model might have been trained"},{"start":300.21,"text":"on high quality data, but the data"},{"start":302.25,"text":"in the wild is actually not that high quality."},{"start":304.37,"text":"And in fact, yes, the distribution"},{"start":306.03,"text":"of the real world might differ"},{"start":308.23,"text":"as we've seen with GANs"},{"start":310.23,"text":"from the training sets."},{"start":312.09,"text":"And that might create an issue with pre-trained"},{"start":314.17,"text":"models, although pre-trained LLMs"},{"start":316.15,"text":"are getting better at"},{"start":318.15,"text":"handling all sorts of data"},{"start":320.05,"text":"inputs. Yes?"},{"start":322.71,"text":"Like what?"},{"start":326.21,"text":"Lacks current information."},{"start":328.33,"text":"The LLM is not up to date."},{"start":330.21,"text":"And in fact, you're right. Imagine you have to retrain from scratch your LLM every couple of months."},{"start":335.75,"text":"One story that I found funny, it's from probably three years ago or maybe more, five years ago, where during his first presidency, President Trump one day tweeted,"},{"start":349.39,"text":"You remember that tweet or?"},{"start":352.07,"text":"just covfefe and it was probably a typo or it was in his pocket i don't know but that word"}],"speech_gaps":[],"frame":"../frames/v057/002.webp","frame_time":191.07},{"title":"LLM在社交媒体趋势中的挑战与控制问题","segments":[{"id":49,"text":"did not exist the llms in fact that twitter was running at the time could not recognize that word","zh":"当时推特上并没有运行着能够识别该词的LLM，因此实际上并没有这样的LLM存在","start":357.93,"end":363.89},{"id":50,"text":"and so the recommender system sort of went wild because suddenly everybody was making fun of that","zh":"因此推荐系统几乎失控了，因为突然之间所有人都在拿这个词开玩笑","start":363.89,"end":370.59},{"id":51,"text":"tweet using the word covfefe and the llm was so confused on you know what does that mean where","zh":"用这个词『covfefe』发推文，而LLM对这个词的意思感到非常困惑，你知道它到底是什么意思","start":370.59,"end":376.33},{"id":52,"text":"Where should we show it?","zh":"我们应该在哪里展示它？","start":376.33,"end":377.17},{"id":53,"text":"To whom should we show it?","zh":"我们应该向谁展示它？","start":377.25,"end":378.33},{"id":54,"text":"And this is an example of nowadays, especially on social media, there are so many new trends.","zh":"这是一个如今的例子，尤其是在社交媒体上，存在如此多的新趋势","start":378.47,"end":384.37},{"id":55,"text":"And it's very hard to retrain an LLM to match the new trend and understand the new words out there.","zh":"而且很难重新训练一个LLM以匹配新的趋势并理解那些新出现的词汇","start":385.55,"end":390.85},{"id":56,"text":"I mean, you know, you oftentimes hear Gen Z words like RIS or MID or whatever.","zh":"我意思是，你经常能听到Z世代的词汇，比如RIS或MID之类的","start":390.93,"end":396.27},{"id":57,"text":"I don't know all of them.","zh":"我不了解所有的内容。","start":396.41,"end":397.33},{"id":58,"text":"but you probably want to find a way that can allow the LLM to understand those trends","zh":"但你可能想要找到一种方法，让LLM能够理解这些趋势","start":397.33,"end":404.15},{"id":59,"text":"without retraining the llm from scratch.","zh":"而无需从头开始重新训练LLM。","start":404.15,"end":406.15},{"id":60,"text":"What else?","zh":"还有别的吗？","start":407.21,"end":408.01},{"id":61,"text":"It's trained on breadth of knowledge, and if you wanted to do some specialized, that might work.","zh":"它是基于广泛的知识进行训练的，如果你想做一些专门化的任务，这可能有效。","start":409.69,"end":415.17},{"id":62,"text":"Yeah, it might be trained on a breadth of knowledge,","zh":"是的，它可能是在广泛的知识上进行训练的，","start":415.87,"end":418.35},{"id":63,"text":"but it might fail or not perform adequately on a narrow task that is very well-defined.","zh":"但它可能在非常明确的狭窄任务上表现不佳或无法胜任。","start":418.45,"end":424.29},{"id":64,"text":"I think about enterprise applications that, yeah, enterprise application, you need high precision, high fidelity, low latency, and maybe the model is not great at that specific thing.","zh":"我想到了企业应用，是的，企业应用需要高精度、高保真度和低延迟，而模型可能在这些特定方面表现不佳。","start":424.29,"end":436.41},{"id":65,"text":"It might do fine, but just not good enough.","zh":"它可能表现不错，但可能还不够好。","start":436.51,"end":438.23},{"id":66,"text":"And you might want to augment it in a certain way.","zh":"你可能希望以某种方式对其进行增强。","start":438.45,"end":440.85},{"id":67,"text":"Yeah.","zh":"是的。","start":440.97,"end":440.99},{"id":68,"text":"So maybe it has a lot of broad domain knowledge that might not be needed for.","zh":"所以它可能拥有大量广泛领域的知识，这些知识可能并不需要用于。","start":449.21,"end":454.19},{"id":69,"text":"your application. And so you're using a massive heavy model when you actually are only using 2%","zh":"你的应用场景。因此，当你实际上只使用了模型能力的2%时，却在使用一个巨大的重型模型。你完全正确。你可能并不需要全部能力。因此，你可能会找到方法来修剪、量化模型，对其进行修改。这些都是很好的观点。","start":454.29,"end":459.45},{"id":70,"text":"of the model capability. You're perfectly right. You might not need all of it. So you might","zh":"我会再补充一些。大语言模型（LLMs）非常难以控制。你刚才的最后一点是","start":459.45,"end":463.19},{"id":71,"text":"find ways to prune, quantize the model, modify it. All of these are good points.","zh":"正确的。你可能并不需要全部能力。因此，你可能会找到方法来修剪、量化模型，对其进行修改。这些都是很好的观点。","start":463.19,"end":469.13},{"id":72,"text":"I'm going to add a few more as well. LLMs are very difficult to control. Your last point is","zh":"我会再补充一些。大语言模型（LLMs）非常难以控制。你刚才的最后一点是","start":469.21,"end":475.83},{"id":73,"text":"actually an example of that. You want to control the LLM to use a part of it.","zh":"这实际上是一个例子。你想要控制LLM，使其使用其中的一部分。","start":475.83,"end":478.97},{"id":74,"text":"knowledge, but it's not. It's in fact getting confused. We've seen that in history. In 2016, Microsoft created a notorious Twitter bot that learned from users and it quickly became a racist jerk. Microsoft ended up removing the bot 16 hours after launching it. The community was really fast at determining that this was a racist bot.","zh":"它拥有知识，但并非如此。实际上它变得困惑了。我们在历史上见过这种情况。2016年，微软创建了一个臭名昭著的Twitter机器人，它从用户那里学习，很快变得种族主义且令人讨厌。微软最终在发布16小时后删除了这个机器人。社区非常迅速地判断出这是一个种族主义的机器人。","start":479.08,"end":503.18},{"id":75,"text":"And you can empathize with Microsoft in the sense that it is actually hard to control an LLM. They might have done a better job to qualify before launching, but it is really hard to control an LLM. Even more recently, this is a tweet from Sam Altman last November, where there was this debate between Elon Musk and Sam Altman on whose LLM is the left-wing propaganda machine or the right-wing propaganda machine. And they were hating on each other.","zh":"你可以理解微软的处境，因为实际上控制LLM是非常困难的。他们可能在发布前做得更好，但控制LLM真的非常困难。更近一些，这是Sam Altman去年11月的一条推文，当时有埃隆·马斯克和Sam Altman之间的一场辩论，讨论谁的LLM是左翼宣传机器或右翼宣传机器，他们彼此互相攻击。","start":505.05,"end":534.45}],"notes":["讲者指出，LLM的控制难度很大，例如微软2016年创建的Twitter机器人在短时间内变得具有攻击性，说明LLM在训练和部署过程中需要更严格的控制和验证。","讲者还提到，LLM可能被用于政治立场的传播，如马斯克和阿尔特曼之间的争论，这表明LLM的偏见和立场问题需要进一步研究。"],"formulas":[],"uncertainties":[],"diagram":"none","start":357.93,"end":534.45,"asr_flags":[67],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":357.93,"text":"did not exist the llms in fact that twitter was running at the time could not recognize that word"},{"start":363.89,"text":"and so the recommender system sort of went wild because suddenly everybody was making fun of that"},{"start":370.59,"text":"tweet using the word covfefe and the llm was so confused on you know what does that mean where"},{"start":376.33,"text":"Where should we show it?"},{"start":377.25,"text":"To whom should we show it?"},{"start":378.47,"text":"And this is an example of nowadays, especially on social media, there are so many new trends."},{"start":385.55,"text":"And it's very hard to retrain an LLM to match the new trend and understand the new words out there."},{"start":390.93,"text":"I mean, you know, you oftentimes hear Gen Z words like RIS or MID or whatever."},{"start":396.41,"text":"I don't know all of them."},{"start":397.33,"text":"but you probably want to find a way that can allow the LLM to understand those trends"},{"start":404.15,"text":"without retraining the LLM from scratch."},{"start":407.21,"text":"What else?"},{"start":409.69,"text":"It's trained on breadth of knowledge, and if you wanted to do some specialized, that might work."},{"start":415.87,"text":"Yeah, it might be trained on a breadth of knowledge,"},{"start":418.45,"text":"but it might fail or not perform adequately on a narrow task that is very well-defined."},{"start":424.29,"text":"I think about enterprise applications that, yeah, enterprise application, you need high precision, high fidelity, low latency, and maybe the model is not great at that specific thing."},{"start":436.51,"text":"It might do fine, but just not good enough."},{"start":438.45,"text":"And you might want to augment it in a certain way."},{"start":440.97,"text":"Yeah."},{"start":449.21,"text":"So maybe it has a lot of broad domain knowledge that might not be needed for."},{"start":454.29,"text":"your application. And so you're using a massive heavy model when you actually are only using 2%"},{"start":459.45,"text":"of the model capability. You're perfectly right. You might not need all of it. So you might"},{"start":463.19,"text":"find ways to prune, quantize the model, modify it. All of these are good points."},{"start":469.21,"text":"I'm going to add a few more as well. LLMs are very difficult to control. Your last point is"},{"start":475.83,"text":"actually an example of that. You want to control the LLM to use a part of it."},{"start":479.08,"text":"knowledge, but it's not. It's in fact getting confused. We've seen that in history. In 2016, Microsoft created a notorious Twitter bot that learned from users and it quickly became a racist jerk. Microsoft ended up removing the bot 16 hours after launching it. The community was really fast at determining that this was a racist bot."},{"start":505.05,"text":"And you can empathize with Microsoft in the sense that it is actually hard to control an LLM. They might have done a better job to qualify before launching, but it is really hard to control an LLM. Even more recently, this is a tweet from Sam Altman last November, where there was this debate between Elon Musk and Sam Altman on whose LLM is the left-wing propaganda machine or the right-wing propaganda machine. And they were hating on each other."}],"speech_gaps":[{"start":441.39,"end":443.92}],"frame":"../frames/v057/003.webp","frame_time":369.93},{"title":"LLM在实际应用中的挑战","segments":[{"id":76,"text":"other's LLMs. But that tells you at the end of the day that even those two teams, Grok and OpenAI, which are probably the best funded team with a lot of talent, are not doing a great job at controlling their LLMs. And from time to time, if you hang out on X, you might see...","zh":"其他公司的LLMs。但最终这说明，即使是Grok和OpenAI这两个可能资金最充足、人才最多的团队，也未能很好地控制他们的LLMs。有时，如果你在X上待着，你可能会看到...","start":534.44,"end":553.66},{"id":77,"text":"screenshots of users interacting with LLMs and the LLMs saying something really controversial or racist or something that would not be considered great by social standards, I guess. And that tells you that the model is really hard to control.","zh":"用户与LLMs互动的截图，以及LLMs说出一些极具争议性或种族主义的内容，这些内容在社会标准下可能并不被认为是好的。这说明模型真的很难控制。","start":554.34,"end":573.08},{"id":78,"text":"The second aspect of it is something that you've mentioned earlier. LLMs may underperform in your task. And that might include specific knowledge gaps, such as medical diagnosis. If you're doing medical diagnosis, you would rather have an LLM that is specialized for that and is great at it. And in fact, something that we haven't mentioned as a group has sources. So the answer is sourced specifically.","zh":"第二个方面是你之前提到的。LLMs可能在你的任务中表现不佳。这可能包括特定的知识差距，例如医学诊断。如果你在进行医学诊断，你更希望有一个专门为此设计并且非常擅长的LLM。事实上，我们尚未提到的一个问题是信息来源。因此，答案需要有具体的来源。","start":575.17,"end":598.49},{"id":79,"text":"you have a hard time believing something unless you have the actual source of the research that backs it up inconsistencies in style and format so imagine you're building a legal ai","zh":"你很难相信某件事，除非你有实际支持该研究的来源。风格和格式上的不一致，想象一下你正在构建一个法律AI","start":599.52,"end":610.42},{"id":80,"text":"agentic workflow. Legal has a very specific way to write and read where every word counts. If you're negotiating a large contract, every word on that contract might mean something else when it comes to the court. And so it's very important that you use an LLM that is very good at it.","zh":"的自主工作流程。法律领域有非常特定的写作风格和阅读方式，每个词都至关重要。如果你在协商一份大合同，合同中的每一个词在法庭上都可能意味着不同的含义。因此，使用一个非常擅长这方面LLM非常重要。","start":611.32,"end":629.54},{"id":81,"text":"The precision matters. And then, you know, task specific understanding, such as doing a classification on a niche field. Here, I pulled an example where, you know, let's say a biotech product is trying to use an LLM to categorize user reviews into positive, neutral or negative. You know, maybe for that company, something that's...","zh":"精确性至关重要。此外，任务特定的理解，例如在某个专业领域进行分类。这里，我举了一个例子，比如说，一家生物科技公司试图使用LLM将用户评论分类为正面、中性或负面。你可能知道，对于该公司来说，通常被认为是负面评论的内容，实际上可能被归类为中性评论，因为该行业的净推荐值（NPS）通常远低于其他行业。这就是任务特定的理解，LLM需要与公司认为的分类方式对齐。我们稍后将看到如何解决这个问题的例子。","start":630.13,"end":653.49},{"id":82,"text":"would be considered a negative review typically is actually considered a neutral review because the NPS of that industry tends to be way lower than other industries, let's say. That's a task-specific understanding and the LLM needs to be aligned to what the company believes is the categorization that it wants. We will see an example of how to solve that problem in a second.","zh":"通常会被视为负面评价的评论实际上会被视为中性评价，因为该行业的净推荐值（NPS）往往比其他行业低得多，比如说。这是一种任务特定的理解，LLM需要与公司认为的分类标准对齐。我们稍后将看到如何解决这个问题的一个例子。","start":654.56,"end":676.86},{"id":83,"text":"And then limited context handling. A lot of AI applications, especially in the enterprise, have required data that has a lot of context.","zh":"然后是有限的上下文处理能力。很多AI应用，尤其是在企业领域，都需要具有大量上下文的数据。","start":677.22,"end":688.28}],"notes":["本段讨论了LLM在实际应用中面临的挑战，特别是其控制性和任务特定理解能力的重要性。讲者指出，即使像Grok和OpenAI这样资金和人才充足的团队，也难以完全控制其LLM，这表明LLM的控制是一个复杂的问题。此外，讲者提到，LLM在特定任务上的表现可能不足，例如医疗诊断，需要专门化的模型。","讲者进一步强调了任务特定理解的重要性，特别是在法律和生物技术等专业领域。例如，在法律领域，合同中的每一个词都可能具有法律意义，因此需要高度精确的LLM。而在生物技术领域，用户评论的分类可能因行业标准不同而有所不同，这需要LLM能够理解并适应特定的分类标准。","讲者还提到，LLM在处理有限上下文时的挑战，特别是在企业应用中，数据通常包含大量上下文信息。这表明，LLM需要具备处理复杂上下文的能力，以满足实际应用的需求。","讲者通过一个生物技术公司的例子，说明了任务特定理解的重要性。该公司可能需要将用户评论分类为正面、中性或负面，但由于该行业的NPS较低，通常被视为负面的评论可能实际上应被归类为中性。这表明，LLM需要根据公司的具体需求进行调整。","讲者还提到，LLM在处理不一致的风格和格式时的困难，特别是在构建法律AI时。法律文本的风格和格式非常特定，因此需要高度精确的LLM来确保输出的准确性和一致性。","最后，讲者指出，LLM在实际应用中需要具备处理复杂任务和上下文的能力，这需要模型的精确性和任务特定的理解能力。"],"formulas":[],"uncertainties":["inconsistencies in style and format so imagine you're building a legal ai"],"diagram":"none","start":534.44,"end":688.28,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":534.44,"text":"other's LLMs. But that tells you at the end of the day that even those two teams, Grok and OpenAI, which are probably the best funded team with a lot of talent, are not doing a great job at controlling their LLMs. And from time to time, if you hang out on X, you might see..."},{"start":554.34,"text":"screenshots of users interacting with LLMs and the LLMs saying something really controversial or racist or something that would not be considered great by social standards, I guess. And that tells you that the model is really hard to control."},{"start":575.17,"text":"The second aspect of it is something that you've mentioned earlier. LLMs may underperform in your task. And that might include specific knowledge gaps, such as medical diagnosis. If you're doing medical diagnosis, you would rather have an LLM that is specialized for that and is great at it. And in fact, something that we haven't mentioned as a group has sources. So the answer is sourced specifically."},{"start":599.52,"text":"you have a hard time believing something unless you have the actual source of the research that backs it up inconsistencies in style and format so imagine you're building a legal ai"},{"start":611.32,"text":"agentic workflow. Legal has a very specific way to write and read where every word counts. If you're negotiating a large contract, every word on that contract might mean something else when it comes to the court. And so it's very important that you use an LLM that is very good at it."},{"start":630.13,"text":"The precision matters. And then, you know, task specific understanding, such as doing a classification on a niche field. Here, I pulled an example where, you know, let's say a biotech product is trying to use an LLM to categorize user reviews into positive, neutral or negative. You know, maybe for that company, something that's..."},{"start":654.56,"text":"would be considered a negative review typically is actually considered a neutral review because the NPS of that industry tends to be way lower than other industries, let's say. That's a task-specific understanding and the LLM needs to be aligned to what the company believes is the categorization that it wants. We will see an example of how to solve that problem in a second."},{"start":677.22,"text":"And then limited context handling. A lot of AI applications, especially in the enterprise, have required data that has a lot of context."}],"speech_gaps":[],"frame":"../frames/v057/004.webp","frame_time":546.44},{"title":"LLM在知识管理与上下文处理中的局限性","segments":[{"id":84,"text":"Just to give you a simple example, knowledge management is an important space that enterprises buy a lot of knowledge management tools. When you go on your drive and you have all your documents, ideally, you could have an LLM running on top of that drive. You can ask any question and it will read immediately thousands of documents and answer, what was our Q4 performance in sales? It was X dollars. It finds it super quickly. In practice, because LLMs do not have","zh":"只是为了给你一个简单的例子，知识管理是企业购买大量知识管理工具的重要领域。当你开车时，你拥有所有文档，理想情况下，你可以在该驱动器上运行一个LLM。你可以提出任何问题，它会立即阅读成千上万的文档并回答，例如我们的第四季度销售业绩是多少？是X美元。它会非常快速地找到答案。实际上，由于LLM不具备足够大的上下文，你无法使用一个独立的、未经微调的预训练LLM来解决这个问题。你必须对其进行增强。这是否清楚？关于上下文窗口的另一个方面是它们实际上是有局限的。如果你查看过去五年中模型的上下文窗口，","start":689.47,"end":718.47},{"id":85,"text":"a large enough context, you cannot use a standalone vanilla pre-trained LLM to solve that problem. You will have to augment it. Does that make sense? The other aspect around context windows is they are in fact limited. If you look at the context windows of the models from the last five years,","zh":"即使是最先进的模型，其上下文窗口或可接受的输入标记数量也最多在几十万左右。只是为了让你有个概念，20万标记大约相当于两本书。","start":718.85,"end":738.11},{"id":86,"text":"Even the best models today will range in context window or number of tokens it can take as input somewhere in the hundreds of thousands of tokens max. Just to give you a sense, 200,000 tokens is roughly two books.","zh":"即使是最先进的模型，其上下文窗口或能接受的输入标记数量也最多在几十万左右。仅作为参考，200,000个标记大约相当于两本书的内容。","start":739.48,"end":757.32},{"id":87,"text":"So that's how much you can upload and it can read, pretty much. And you can imagine that when you're dealing with video understanding or heavier data files, that is, of course, an issue. So you might have to chunk it, you might have to embed it, you might have to find other ways to get the LLM to handle larger contexts.","zh":"注意力机制也很强大但存在问题，因为它在非常大的上下文中并不擅长注意力分配。实际上，有一个有趣的问题被称为“ haystack 中的 needle ”。这是一个AI问题，或者称为基准测试，其中……","start":758.78,"end":779.64},{"id":88,"text":"The attention mechanism is also powerful but problematic because it does not do a great job at attending in very large contexts. There is actually an interesting problem called needle in a haystack. It's an AI problem or call it a benchmark where...","zh":"为了测试你的LLM是否擅长注意力分配，即在大型语料库中对一个非常具体的事实进行关注，研究人员可能会在书中随机插入一句话，","start":782.04,"end":802.04},{"id":89,"text":"In order to test if your LLM is good at attending, at putting attention on a very specific fact within a large corpus, researchers might randomly insert in a book one sentence that","zh":"该句子描述了某个特定的事实，例如“Arun和Max正在圣经中间的Blue Bottle咖啡馆喝咖啡”，或者在一些非常长的文本中。然后你问LLM，Arun和Max正在喝什么？","start":802.56,"end":817.44},{"id":90,"text":"that outlines a certain fact, such as Arun and Max are having coffee at Blue Bottle in the middle of the Bible, let's say, or some very long text. And then you ask the LLM, what were Arun and Max having?","zh":"例如，如果有一段文本描述了某个事实，比如Arun和Max正在圣经中间的Blue Bottle咖啡馆喝咖啡，或者是一段非常长的文本。然后你问LLM，Arun和Max正在喝什么？","start":818.86,"end":835.6},{"id":91,"text":"at Blue Bottle, and you see if it remembers AWS Coffee. It's actually a complex problem, not because the question is complex, but because you're asking the model to find a fact within a very large corpus, and that's complicated. So again, this is a limiting factor for LLMs. We'll talk about RAG in a second, but I want to preview, you know, there is debates around whether RAG is the right long-term approach for AI systems. So as a high-level idea,","zh":"在Blue Bottle，你会看到它是否记得AWS Coffee。实际上这是一个复杂的问题，不是因为问题本身复杂，而是因为你要求模型在一个非常庞大的语料库中找到一个事实，这很困难。因此，这再次成为LLMs的一个限制因素。我们稍后会讨论RAG，但我想提前说明，关于RAG是否是AI系统长期的正确方法，存在争论。因此，作为一个高层次的想法，","start":837.33,"end":867.41}],"notes":["本段讲授了LLM在知识管理中的应用及其局限性。企业购买知识管理工具，理想情况下可以将LLM部署在存储设备上，通过提问快速检索大量文档。然而，LLM的上下文窗口有限，无法处理大量数据，因此需要进行增强处理。","上下文窗口的大小是LLM处理能力的重要限制因素。即使是最先进的模型，其最大上下文窗口也仅在数十万token左右，相当于两本书的长度。这在处理视频理解或大型数据文件时尤为明显，需要进行分块、嵌入或其他方法来扩展上下文处理能力。","注意力机制虽然强大，但在处理非常大的上下文时表现不佳。一个典型的例子是“needle in a haystack”问题，即在庞大的文本中寻找特定事实。研究人员通过在长文本中随机插入特定句子来测试LLM的注意力能力。","这种测试方法并不复杂，但挑战在于模型需要在庞大的语料库中找到特定信息。这表明LLM在处理大规模数据时存在局限性，是当前研究的一个重要方向。","此外，本段还提到检索增强生成（RAG）作为解决LLM上下文限制的一种方法，但关于RAG是否是长期解决方案仍存在争议。"],"formulas":[],"uncertainties":[],"diagram":"none","start":689.47,"end":867.41,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":689.47,"text":"Just to give you a simple example, knowledge management is an important space that enterprises buy a lot of knowledge management tools. When you go on your drive and you have all your documents, ideally, you could have an LLM running on top of that drive. You can ask any question and it will read immediately thousands of documents and answer, what was our Q4 performance in sales? It was X dollars. It finds it super quickly. In practice, because LLMs do not have"},{"start":718.85,"text":"a large enough context, you cannot use a standalone vanilla pre-trained LLM to solve that problem. You will have to augment it. Does that make sense? The other aspect around context windows is they are in fact limited. If you look at the context windows of the models from the last five years,"},{"start":739.48,"text":"Even the best models today will range in context window or number of tokens it can take as input somewhere in the hundreds of thousands of tokens max. Just to give you a sense, 200,000 tokens is roughly two books."},{"start":758.78,"text":"So that's how much you can upload and it can read, pretty much. And you can imagine that when you're dealing with video understanding or heavier data files, that is, of course, an issue. So you might have to chunk it, you might have to embed it, you might have to find other ways to get the LLM to handle larger contexts."},{"start":782.04,"text":"The attention mechanism is also powerful but problematic because it does not do a great job at attending in very large contexts. There is actually an interesting problem called needle in a haystack. It's an AI problem or call it a benchmark where..."},{"start":802.56,"text":"In order to test if your LLM is good at attending, at putting attention on a very specific fact within a large corpus, researchers might randomly insert in a book one sentence that"},{"start":818.86,"text":"that outlines a certain fact, such as Arun and Max are having coffee at Blue Bottle in the middle of the Bible, let's say, or some very long text. And then you ask the LLM, what were Arun and Max having?"},{"start":837.33,"text":"at Blue Bottle, and you see if it remembers AWS Coffee. It's actually a complex problem, not because the question is complex, but because you're asking the model to find a fact within a very large corpus, and that's complicated. So again, this is a limiting factor for LLMs. We'll talk about RAG in a second, but I want to preview, you know, there is debates around whether RAG is the right long-term approach for AI systems. So as a high-level idea,"}],"speech_gaps":[],"frame":"../frames/v057/005.webp","frame_time":701.47},{"title":"RAG机制与LLM应用的讨论","segments":[{"id":92,"text":"A RAG is a mechanism, if you will, that embeds documents that an LLM can retrieve and then add as context to its initial prompt and answer a question. It has lots of applications. Knowledge management is an example. So imagine you have your drive again, but every document is sort of compressed in representation and the LLM has access to that lower dimensional representation.","zh":"RAG是一种机制，可以将LLM能够检索的文档嵌入，并将其作为初始提示的上下文来回答问题。它有很多应用场景。知识管理就是一个例子。所以想象一下，你再次拥有你的硬盘，但每一份文档都以某种方式被压缩成表示形式，而LLM可以访问这种低维表示。","start":868.19,"end":893.31},{"id":93,"text":"The debate that this tweet from Yaufu outlines is, in theory, if we have infinite computes, then RAG is useless. Because you can just read...","zh":"这条推文所概述的争论是，从理论上讲，如果我们拥有无限的计算能力，那么RAG就毫无用处。因为你可以直接阅读……","start":895.02,"end":907.8},{"id":94,"text":"a massive corpus immediately and answer your question but even in that case latency might be an issue imagine the time it takes for an ai to read all your drive every single time you ask a question it doesn't make sense so rag has other advantages beyond even the accuracy on top of that the sourcing matters as well so it might drag allows you to source we'll talk","zh":"一个庞大的语料库并立即回答你的问题，但即使在这种情况下，延迟可能仍然是一个问题。想象一下，每次你提问时，AI都需要花费时间读取你的整个硬盘，这显然不合理。因此，RAG的优势不仅仅在于准确性，此外，来源也非常重要，因此它可能允许你进行溯源，我们稍后会讨论。","start":908.24,"end":932.32},{"id":95,"text":"We'll talk about all that later. But there's always this debate in the community whether a certain method is actually future-proof. Because in practice, as compute power doubles every year, let's say, some of the methods we're learning right now might not be relevant three years from now. We don't know, essentially.","zh":"我们稍后会讨论所有这些内容。但社区中始终存在这样的争论，即某种方法是否真正具有未来性。因为在实践中，计算能力每年翻倍，比如说，我们现在学习的一些方法可能在三年后就不再相关。我们实际上并不知道。","start":932.74,"end":952.46},{"id":96,"text":"And the analogy that he makes on context windows and why RAG approaches might be relevant even a long time from now is search. When you search on a search engine, you still find sources of information. And in fact, in the background, there is very detailed traversal algorithms that rank and find the specific links that might be the best to present you versus if you had to read, imagine,","zh":"他所作的类比是关于上下文窗口的，以及为什么RAG方法可能在很长时间内仍然相关。搜索就是一个例子。当你在搜索引擎上进行搜索时，你仍然能找到信息来源。事实上，在后台，有非常详细的遍历算法来排序并找到可能最适合呈现给你的链接，而不是如果你必须阅读，想象一下，","start":955.79,"end":985.29},{"id":97,"text":"you had to read the entire web every single time you're doing a search query without being able to narrow to a certain portion of the space that might, again, not be reasonable.","zh":"你每次进行搜索查询时都必须阅读整个网络，而无法缩小到特定空间的一部分，这显然不合理。","start":985.39,"end":996.15},{"id":98,"text":"Okay. When we're thinking of improving LLMs, the easiest way we think of it is two dimensions. One dimension is we are going to improve the foundation model itself. So, for example, we move from GPT 3.5 Turbo to GPT 4 to GPT 4.0 to GPT 5. Each of that is supposed to improve the base model. GPT 5 is another debate because it's sort of,","zh":"好的。当我们考虑改进LLM时，我们最容易想到的是两个维度。一个维度是我们将改进基础模型本身。例如，我们从GPT 3.5 Turbo发展到GPT 4，再到GPT 4.0，再到GPT 5。每一个版本都旨在改进基础模型。GPT 5又是一个争论点，因为它有点……","start":997.83,"end":1026.09}],"notes":["本段讨论了RAG（检索增强生成）机制的局限性，指出即使在无限计算资源的情况下，RAG仍然具有优势。例如，延迟问题和信息源的重要性，使得RAG在实际应用中仍然有价值。","讲者提到，RAG的优势不仅限于准确性，还包括信息源的可追溯性。这表明RAG在需要可靠信息来源的场景中具有独特价值。","讲者通过搜索引擎的类比，说明RAG在信息检索中的重要性。即使在计算资源充足的情况下，直接读取全部数据仍然不可行，而RAG可以有效缩小搜索范围。","讲者指出，随着计算能力的提升，某些方法可能在未来变得不相关。这表明技术发展和方法论的更新是持续的过程。","讲者提到，改进LLM的思路包括提升基础模型本身，例如从GPT 3.5 Turbo到GPT 4等版本的迭代。这表明模型性能的提升是LLM发展的核心方向之一。","讲者提到GPT 5的讨论，暗示模型迭代是一个持续的过程，且每个版本的改进都可能带来新的挑战和讨论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":868.19,"end":1026.09,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":868.19,"text":"A RAG is a mechanism, if you will, that embeds documents that an LLM can retrieve and then add as context to its initial prompt and answer a question. It has lots of applications. Knowledge management is an example. So imagine you have your drive again, but every document is sort of compressed in representation and the LLM has access to that lower dimensional representation."},{"start":895.02,"text":"The debate that this tweet from Yaufu outlines is, in theory, if we have infinite computes, then RAG is useless. Because you can just read..."},{"start":908.24,"text":"a massive corpus immediately and answer your question but even in that case latency might be an issue imagine the time it takes for an ai to read all your drive every single time you ask a question it doesn't make sense so rag has other advantages beyond even the accuracy on top of that the sourcing matters as well so it might drag allows you to source we'll talk"},{"start":932.74,"text":"We'll talk about all that later. But there's always this debate in the community whether a certain method is actually future-proof. Because in practice, as compute power doubles every year, let's say, some of the methods we're learning right now might not be relevant three years from now. We don't know, essentially."},{"start":955.79,"text":"And the analogy that he makes on context windows and why RAG approaches might be relevant even a long time from now is search. When you search on a search engine, you still find sources of information. And in fact, in the background, there is very detailed traversal algorithms that rank and find the specific links that might be the best to present you versus if you had to read, imagine,"},{"start":985.39,"text":"you had to read the entire web every single time you're doing a search query without being able to narrow to a certain portion of the space that might, again, not be reasonable."},{"start":997.83,"text":"Okay. When we're thinking of improving LLMs, the easiest way we think of it is two dimensions. One dimension is we are going to improve the foundation model itself. So, for example, we move from GPT 3.5 Turbo to GPT 4 to GPT 4.0 to GPT 5. Each of that is supposed to improve the base model. GPT 5 is another debate because it's sort of,"}],"speech_gaps":[],"frame":"../frames/v057/006.webp","frame_time":880.19},{"title":"LLM 应用与提示工程","segments":[{"id":99,"text":"packaging other models within itself, but you know if you're thinking about 3.5 and 4.0, that's really what it is. The pre-trained model improves, and so you should see your performance improve on your tasks. But the other dimension is we can actually engineer and leverage the LLM in a way that makes it better. So you can prompt simply GPT 4.0, you can","zh":"将其他模型包装在自身内部，但你知道如果你在考虑3.5和4.0版本，那其实就是这个意思。预训练模型得到了改进，因此你应该在你的任务上看到性能的提升。但另一个维度是我们实际上可以以一种使其变得更好的方式来工程化并利用LLM。因此，你可以简单地提示GPT 4.0，你也可以","start":1026.49,"end":1050.61},{"id":100,"text":"change some prompts and improve the prompt, and it will improve the performance. It's shown. You can even put a RAG around it. You can put an agentic workflow around it. You can even put a multi-agent system around it. And that is another dimension for you to improve performance. So that's how I want you to think about it. Which LLM I'm using, and then how can I maximize the performance of that LLM? This lecture is about the vertical axis. Those are the methods that we will see together.","zh":"修改一些提示并改进提示，这将提升性能。这一点已经得到了证明。你甚至可以将RAG（检索增强生成）围绕它构建。你也可以将一个代理工作流围绕它构建。你甚至可以将一个多代理系统围绕它构建。这为你提升性能提供了另一个维度。因此，我想让你这样思考。我正在使用哪个LLM，以及我如何最大化该LLM的性能？本节课讨论的是垂直轴。这些是我们将一起看到的方法。","start":1051.87,"end":1080.55},{"id":101,"text":"Sounds good for the introduction. So let's move to prompt engineering. I'm going to start with an interesting study just to motivate why prompt engineering matters. There is a study from HPS, UPenn.","zh":"这似乎对引言部分很合适。那么，让我们进入提示工程。我将从一项有趣的研究开始，只是为了说明为什么提示工程很重要。这项研究来自HPS，宾夕法尼亚大学","start":1084.81,"end":1100.75},{"id":102,"text":"as well as Harvard Business School and others also involved Wharton that took a subset of BCG consultants, individual contributors, split them into three groups. One group had no access to AI. One group had access to... ","zh":"以及哈佛商学院，还有其他人也涉及沃顿商学院，他们选取了一部分BCG顾问，个体贡献者，将他们分成三组。一组没有访问AI的权限。一组有访问权限，","start":1102.3,"end":1117.0},{"id":103,"text":"I think it was GPT-4. And then one group had access to the LLM, but also a training on how to prompt better. And then they observed the performance of these consultants across a wide variety of tasks. There's a few things that they noticed that I thought was interesting. One is something they call the jagged frontier, meaning that certain tasks that consultants are doing fall.","zh":"我认为是GPT-4。另一组有访问LLM的权限，但还接受了如何更好地提示的培训。然后他们观察了这些顾问在各种任务上的表现。他们注意到一些我认为很有趣的事情。其中之一是他们称之为锯齿前沿的现象，意味着某些顾问正在执行的任务落在","start":1117.39,"end":1143.23},{"id":104,"text":"beyond the JAG frontier, meaning AI is not good enough. It's not improving human performance. In fact, it's actually making it worse. And some tasks are within the frontier, meaning that AI is actually significantly improving the performance, the speed, the quality of the consultant.","zh":"锯齿前沿之外，意味着AI还不够好。它并没有提升人类的表现。事实上，它实际上让表现变得更差。而一些任务则位于前沿之内，意味着AI实际上显著提升了顾问的表现、速度和质量。","start":1143.93,"end":1166.71},{"id":105,"text":"Many tasks fell within and many tasks fell without, and they shared their insights. But the TLDR is there is a frontier within which AI is absolutely helping and one where they call out this behavior of falling asleep at the wheel, where people relied on AI on a task that was beyond the frontier. And in fact, it ended up going worse because the human was not reviewing the outputs carefully enough.","zh":"许多任务落在了AI能够处理的范围内，许多任务则超出了这个范围，它们分享了各自的见解。但简而言之，存在一个边界，在这个边界内AI绝对在帮助，而在另一个边界外，人们依赖AI完成超出该边界的任务，这种行为被称作‘自动驾驶’。实际上，结果反而更糟糕，因为人类没有仔细审查输出内容。","start":1168.19,"end":1194.79}],"notes":["本段介绍了LLM（大语言模型）的应用方式，包括如何通过包装其他模型、改进提示（prompt）以及构建更复杂的系统（如RAG、代理工作流、多代理系统）来提升性能。讲者强调，选择合适的LLM并最大化其性能是本节课的重点。","讲者通过一项研究来说明提示工程的重要性。该研究由HPS、宾夕法尼亚大学和哈佛商学院等机构联合进行，研究对象是BCG咨询顾问，分为三组：无AI访问组、仅访问AI组和接受提示训练的AI组。研究结果显示，AI在某些任务上显著提升了性能，但在超出AI能力范围的任务上反而使人类表现变差。","研究中提到的“锯齿前沿”（jagged frontier）概念指出，AI在某些任务上表现优异，而在其他任务上则无法有效帮助。这表明AI并非在所有任务上都优于人类，需要根据任务类型进行合理使用。","研究还指出，当人类过度依赖AI处理超出其能力范围的任务时，可能会导致“睡轮行为”（falling asleep at the wheel），即人类未能仔细审查AI的输出，从而导致结果变差。","讲者总结了研究的主要结论：AI在特定任务范围内能显著提升性能，但在超出其能力的任务上可能使人类表现变差。因此，合理使用AI并结合人类的监督和审查至关重要。","本段强调了提示工程在实际应用中的重要性，以及如何通过改进提示和构建更复杂的系统来提升LLM的性能。同时，也提醒听众注意AI的局限性，避免在超出其能力的任务上过度依赖AI。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1026.49,"end":1194.79,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1026.49,"text":"packaging other models within itself but you know if you're thinking about 3.54 and 4.0 that's really what it is the pre-trained model improves and so you should see your performance improve on your tasks but the other dimension is we can actually engineer leverage the llm in a way that makes it better so you can prompt simply gpt 4.0 you can"},{"start":1051.87,"text":"change some prompts and improve the prompt and it will improve the performance. It's shown. You can even put a rag around it. You can put an agentic workflow around it. You can even put a multi-agent system around it. And that is another dimension for you to improve performance. So that's how I want you to think about it. Which LLM I'm using and then how can I maximize the performance of that LLM? This lecture is about the vertical axis. Those are the methods that we will see together."},{"start":1084.81,"text":"Sounds good for the introduction. So let's move to prompt engineering. I'm going to start with an interesting study just to motivate why prompt engineering matters. There is a study from HPS, UPenn."},{"start":1102.3,"text":"as well as Harvard Business School and others also involved Wharton that took a subset of BCG consultants, individual contributors, split them into three groups. One group had no access to AI. One group had access to..."},{"start":1117.39,"text":"I think it was GPT-4. And then one group had access to the LLM, but also a training on how to prompt better. And then they observed the performance of these consultants across a wide variety of tasks. There's a few things that they noticed that I thought was interesting. One is something they call the jagged frontier, meaning that certain tasks that consultants are doing fall."},{"start":1143.93,"text":"beyond the JAG frontier, meaning AI is not good enough. It's not improving human performance. In fact, it's actually making it worse. And some tasks are within the frontier, meaning that AI is actually significantly improving the performance, the speed, the quality of the consultant."},{"start":1168.19,"text":"Many tasks fell within and many tasks fell without, and they shared their insights. But the TLDR is there is a frontier within which AI is absolutely helping and one where they call out this behavior of falling asleep at the wheel, where people relied on AI on a task that was beyond the frontier. And in fact, it ended up going worse because the human was not reviewing the outputs carefully enough."}],"speech_gaps":[],"frame":"../frames/v057/007.webp","frame_time":1038.49},{"title":"增强LLM应用中的提示工程与角色分类","segments":[{"id":106,"text":"They did note that the group that was trained was the best, better than the group that was not trained on prompt engineering, which also motivates why this lecture matters, so that you're within that group afterwards. One other insight were the centaurs and the cyborgs. They noticed that consultants had the tendency to work with AI in one of two ways, and you might yourself be part of one of these groups.","zh":"他们指出，接受训练的小组表现最好，优于没有接受提示工程训练的小组，这也解释了为什么这堂课很重要，这样你之后就能成为那个小组的一员。另一个见解是半人马和赛博格。他们注意到顾问们倾向于以两种方式之一与AI合作，你可能自己也属于其中的一个群体。","start":1197.58,"end":1224.72},{"id":107,"text":"The centaurs are mythical creatures that are half human, half, I think, half horses. Half horses, half something.","zh":"半人马是神话中的生物，一半是人类，我想，一半是马。一半是马，一半是其他东西。","start":1225.38,"end":1237.06},{"id":108,"text":"And those were individuals that would divide and delegate.","zh":"这些人会分工并委派任务。","start":1238.36,"end":1241.66},{"id":109,"text":"They might give a pretty big task to the AI.","zh":"他们可能会给AI分配一个相当大的任务。","start":1241.88,"end":1244.36},{"id":110,"text":"So imagine you're working on a PowerPoint, which consultants are known to do.","zh":"想象一下你在做一份PowerPoint演示文稿，而顾问们以做这个闻名。","start":1244.54,"end":1248.16},{"id":111,"text":"You might actually write a very long prompt on how you wanted to do your PowerPoint and then let it work for some time and then come back and it's done.","zh":"你可能会先写一个很长的提示，说明你想要如何制作这份PowerPoint，然后让AI工作一段时间，之后回来发现它已经完成了。","start":1248.68,"end":1255.72},{"id":112,"text":"When others would act as cyborgs, cyborgs are fully blended, bio-niche human robots, augmented with robotic parts.","zh":"而其他人则会作为赛博格工作，赛博格是完全融合的生物-机械人，被机械部件增强。","start":1255.94,"end":1265.92},{"id":113,"text":"They would actually work super quickly with the model and back and forth.","zh":"他们会与模型快速互动，来回切换。","start":1265.92,"end":1269.6},{"id":114,"text":"They would actually work super quickly with the model and back and forth.","zh":"它们实际上会和模型进行非常快速的交互和来回沟通。","start":1269.74,"end":1273.04},{"id":115,"text":"I find that a lot of students are actually more working like cyborgs than centaurs.","zh":"我发现很多学生实际上更像是半机械人而不是半人马。","start":1273.32,"end":1278.3},{"id":116,"text":"But while maybe in the enterprise, when you're trying to automate the workflow,","zh":"但也许在企业中，当你试图自动化工作流程时，","start":1278.44,"end":1281.98},{"id":117,"text":"you're thinking more like a centaur.","zh":"你更倾向于以半人马的思维方式去思考。","start":1282.16,"end":1284.06},{"id":118,"text":"That's just something good to keep in mind.","zh":"这只是个值得记住的好点。","start":1285.42,"end":1287.0},{"id":119,"text":"Also, a lot of companies will tell you,","zh":"此外，很多公司会告诉你，","start":1287.18,"end":1288.9},{"id":120,"text":"oh, we're hiring prompt engineers, etc. It's a cure.","zh":"哦，我们正在招聘提示工程师等等。这是一剂良药。","start":1288.92,"end":1291.42},{"id":121,"text":"I don't buy that. I think it's just a skill that everybody should have.","zh":"我不认同这一点。我认为这只是一个每个人都应该具备的技能。","start":1291.7,"end":1295.26},{"id":122,"text":"You're not going to make a cure out of prompt engineering, but you're probably going to use it as a very powerful skill in your cure.","zh":"你不会用提示工程来制造一个治愈方法，但你很可能会在你的治愈方法中使用它作为一种非常强大的技能。","start":1295.26,"end":1302.56},{"id":123,"text":"So let's talk about basic prompt design principles.","zh":"那么，让我们谈谈基本的提示设计原则。","start":1305.56,"end":1308.24},{"id":124,"text":"I'm giving you a very simple prompt here.","zh":"我现在给你一个非常简单的提示。","start":1308.7,"end":1311.38},{"id":125,"text":"Summarize this document, and then the document is uploaded alongside it.","zh":"总结这份文件，然后这份文件会与它一起上传。","start":1312.26,"end":1316.02},{"id":126,"text":"And the model has not much context around it.","zh":"而模型对此并没有太多的上下文信息。","start":1316.18,"end":1320.06},{"id":127,"text":"What should be the summary? How long should be the summary? What should we talk about? Etc. You can actually improve these prompts by doing something like summarize this 10-page scientific paper on renewable energy in five bullet points focusing on key findings and implications for policymakers. That's already better, right? You're sharing the audience.","zh":"这个摘要应该是什么？摘要应该有多长？我们应该谈论什么？等等。你实际上可以通过做一些事情来改进这些提示，例如：总结这份关于可再生能源的10页科学论文，用五个要点来总结，重点放在关键发现和对政策制定者的含义上。这已经更好了，对吧？你是在与受众分享。","start":1320.62,"end":1343.86},{"id":128,"text":"and it's going to tailor it to the audience. You're saying that you want five bullet points and you want to focus only on key findings. That's a better prompt, you would argue. How could you even make this prompt better? What are other techniques that you've heard of, have tried yourself, that could make this one-shot prompt better? Yeah.","zh":"它会根据受众进行调整。你是在说你想要五个要点，并且只想关注关键发现。你会认为这是一个更好的提示。你还能如何让这个一次性提示变得更好？你听说过或尝试过哪些其他技术，可以使得这个提示更好？是的。","start":1344.41,"end":1369.62}],"notes":["本段介绍了提示工程在增强LLM应用中的重要性，并通过centaurs和cyborgs的比喻来区分两种不同的使用方式。centaurs指的是将任务分解并委托给AI的用户，而cyborgs则是与AI紧密协作、快速交互的用户。这种区分有助于理解不同场景下如何更有效地使用AI工具。","课堂中提到，许多学生更倾向于以cyborgs的方式使用AI，即与AI进行快速交互，而不是将任务完全委托给AI。这表明在实际应用中，用户可能更倾向于与AI进行协作，而不是完全依赖AI。","在企业环境中，当试图自动化工作流程时，用户可能更倾向于以centaurs的方式使用AI，即将任务分解并交给AI处理。这表明在不同的应用场景中，用户可能需要采用不同的协作方式。","课堂中还提到，虽然一些公司声称正在招聘提示工程师，但作者认为这只是一个技能，每个人都应该掌握。这表明提示工程是一个普遍适用的技能，而不是一个专门的职业。","最后，课堂中讨论了提示设计的基本原则，并通过一个简单的例子说明了如何改进提示。这表明在实际应用中，通过明确任务要求和目标受众，可以显著提高AI的输出质量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1197.58,"end":1369.62,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":1197.58,"text":"They did note that the group that was trained was the best, better than the group that was not trained on prompt engineering, which also motivates why this lecture matters, so that you're within that group afterwards. One other insight were the centaurs and the cyborgs. They noticed that consultants had the tendency to work with AI in one of two ways, and you might yourself be part of one of these groups."},{"start":1225.38,"text":"The centaurs are mythical creatures that are half human, half, I think, half horses. Half horses, half something."},{"start":1238.36,"text":"And those were individuals that would divide and delegate."},{"start":1241.88,"text":"They might give a pretty big task to the AI."},{"start":1244.54,"text":"So imagine you're working on a PowerPoint, which consultants are known to do."},{"start":1248.68,"text":"You might actually write a very long prompt on how you wanted to do your PowerPoint and then let it work for some time and then come back and it's done."},{"start":1255.94,"text":"When others would act as cyborgs, cyborgs are fully blended, bio-niche human robots, augmented with robotic parts."},{"start":1265.92,"text":"and those individuals will not delegate fully a task."},{"start":1269.74,"text":"They would actually work super quickly with the model and back and forth."},{"start":1273.32,"text":"I find that a lot of students are actually more working like cyborgs than centaurs."},{"start":1278.44,"text":"But while maybe in the enterprise, when you're trying to automate the workflow,"},{"start":1282.16,"text":"you're thinking more like a centaur."},{"start":1285.42,"text":"That's just something good to keep in mind."},{"start":1287.18,"text":"Also, a lot of companies will tell you,"},{"start":1288.92,"text":"oh, we're hiring prompt engineers, etc. It's a cure."},{"start":1291.7,"text":"I don't buy that. I think it's just a skill that everybody should have."},{"start":1295.26,"text":"You're not going to make a cure out of prompt engineering, but you're probably going to use it as a very powerful skill in your cure."},{"start":1305.56,"text":"So let's talk about basic prompt design principles."},{"start":1308.7,"text":"I'm giving you a very simple prompt here."},{"start":1312.26,"text":"Summarize this document, and then the document is uploaded alongside it."},{"start":1316.18,"text":"And the model has not much context around it."},{"start":1320.62,"text":"What should be the summary? How long should be the summary? What should we talk about? Etc. You can actually improve these prompts by doing something like summarize this 10-page scientific paper on renewable energy in five bullet points focusing on key findings and implications for policymakers. That's already better, right? You're sharing the audience."},{"start":1344.41,"text":"and it's going to tailor it to the audience. You're saying that you want five bullet points and you want to focus only on key findings. That's a better prompt, you would argue. How could you even make this prompt better? What are other techniques that you've heard of, have tried yourself, that could make this one-shot prompt better? Yeah."}],"speech_gaps":[],"frame":"../frames/v057/008.webp","frame_time":1209.58},{"title":"增强LLM应用的提示技巧","segments":[{"id":129,"text":"Okay, right example. So say you mean here is an example of a great submarine. Yeah, you're right. That's a good idea. Very popular technique. Act like a renewable energy expert giving a conference at Davos, let's say. Yeah, that's great.","zh":"好的，好的例子。所以你是指这里有一个很棒的潜艇的例子。是的，你说得对。这是个好主意。非常流行的技术。比如，你假装成可再生能源专家，在达沃斯会议上做演讲，这样说就很好。是的，这很棒。","start":1373.33,"end":1393.6},{"id":130,"text":"You are the best in the world at this. Explain. Yeah, actually, I mean, these things work. It's funny, but it does work to say act like XYZ. It's a very popular prompt template. We see a few examples. What else could you do? Yes. Okay.","zh":"你是世界上在这方面最好的。解释一下。实际上，这些方法是有效的。有趣的是，但说假装成XYZ确实有效。这是一种非常流行的提示模板。我们已经看到一些例子。你还能做什么？是的。好的。","start":1399.2,"end":1418.72},{"id":131,"text":"Critique your own project so you're using reflection. So you might actually do one output and then ask it to critique it and then give it back. Yeah, we'll see that. That's a great one. That's the one that probably works best within those typically, but we see some examples. What else? Yeah. Okay. Break the task down into steps. Do you know how that is called? No. Okay. Chain of thoughts.","zh":"批判你自己的项目，这样你就能进行反思。你可能会先生成一个输出，然后让它批判这个输出，再把它反馈给你。是的，我们会看到这一点。这是在这些情况下可能效果最好的一个。我们已经看到一些例子。还有什么？是的。好的。把任务分解成步骤。你知道这叫什么吗？不。好的。思维链（Chain of Thoughts）","start":1422.37,"end":1445.0},{"id":132,"text":"This is actually a popular method that's been shown in research that it improves. You could actually give clear instruction and also encourage the model to think step by step. Approach the task step by step and do not skip any step. And then you give it some steps such as step one, identify the three most important findings. Step two, explain how each finding impacts renewable energy policy. Step three, write the five-bullet summary with each point addressing a finding, etc.","zh":"实际上，这是一种在研究中被证明能提高效果的流行方法。你实际上可以给出明确的指令，同时鼓励模型逐步思考。逐步地接近任务，不要跳过任何步骤。然后你可以给出一些步骤，例如第一步，确定三个最重要的发现；第二步，解释每个发现如何影响可再生能源政策；第三步，写出一个五点摘要，每个点都针对一个发现，等等。","start":1447.05,"end":1475.29},{"id":133,"text":"Chain of Thoughts, I leaked the paper from 2023 that popularized Chain of Thoughts. Chain of Thoughts is very, very popular right now, especially in AI startups that are trying to control their elements. Okay.","zh":"思维链（Chain of Thoughts），我泄露了2023年流行化思维链的论文。思维链现在非常、非常流行，尤其是在那些试图控制其要素的AI初创公司中。好的。","start":1476.54,"end":1491.4},{"id":134,"text":"To go back to your examples about act like XYZ, what I like to do, Andrew also talks about that, is to look at other people's prompts.","zh":"回到你关于假装成XYZ的例子，我喜欢做的事情，安德鲁也提到了这一点，是查看别人的提示。","start":1492.24,"end":1501.96},{"id":135,"text":"And in fact, online, you have a lot of prompt repositories for free on GitHub.","zh":"事实上，在线上有许多免费的提示仓库在GitHub上。","start":1502.26,"end":1507.52},{"id":136,"text":"In fact, I linked the awesome prompt template repo on GitHub, where you have so many examples of great prompts that engineers have built.","zh":"事实上，我链接了一个很棒的提示模板仓库在GitHub上，里面有工程师们构建的大量优秀提示示例。","start":1507.92,"end":1516.24},{"id":137,"text":"They said it works great for us and they published it online.","zh":"他们说这对我们效果很好，并且他们将其在线发布。","start":1516.38,"end":1519.28},{"id":138,"text":"The advantage of a prompt template is that you can actually put it in your code and scale it for many user requests.","zh":"提示模板的优势在于你可以将其放入代码中，并针对许多用户请求进行扩展。","start":1519.28,"end":1530.18},{"id":139,"text":"The advantage of a prompt template is that you can actually put it in your code and scale it for many user requests.","zh":"提示模板的优势在于你可以将其放入代码中，并针对许多用户请求进行扩展。","start":1532.84,"end":1540.66},{"id":140,"text":"So let me give you an example from Workera.","zh":"那么让我从Workera给你们举一个例子。","start":1540.84,"end":1543.48},{"id":141,"text":"Workera evaluates skills.","zh":"Workera评估技能。","start":1545.34,"end":1546.96},{"id":142,"text":"Some of you have taken the assessments already.","zh":"你们中的一些人已经参加了评估。","start":1546.98,"end":1548.66},{"id":143,"text":"and tries to personalize it to the user.","zh":"并试图将其个性化以适应用户。","start":1549.28,"end":1551.88}],"notes":["本段讲解了如何通过角色扮演（act like XYZ）来增强大型语言模型（LLM）的应用效果。例如，让模型扮演可再生能源专家在达沃斯会议中发言，是一种非常受欢迎的提示技巧。这种方法通过设定明确的角色，使模型能够更自然地生成符合角色设定的输出。","课堂中还提到，通过让模型自我批判（critique your own project）来促进反思，这是一种有效的学习方法。例如，先生成一个输出，再让模型对其进行批判性分析，然后将其反馈给用户。","链式思维（Chain of Thoughts）是一种被广泛研究并证明有效的提示方法，它鼓励模型逐步思考并完成任务。这种方法通过分步骤指导模型，提高输出的准确性和逻辑性。","课堂中还提到，可以通过查看其他人的提示模板来优化自己的提示策略。例如，GitHub上有很多优秀的提示模板仓库，其中包含了许多工程师构建的高质量提示示例。","提示模板的优势在于可以将其嵌入代码中，从而实现对多个用户请求的扩展和自动化处理。例如，Workera公司利用提示模板来评估用户的技能，并根据用户需求进行个性化调整。","课堂最后强调了提示模板的灵活性和可扩展性，指出其在实际应用中的重要性。通过合理使用提示模板，可以显著提升LLM在各种任务中的表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1373.33,"end":1551.88,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":1373.33,"text":"Okay, right example. So say you mean here is an example of a great submarine. Yeah, you're right. That's a good idea. Very popular technique. Act like a renewable energy expert giving a conference at Davos, let's say. Yeah, that's great."},{"start":1399.2,"text":"You are the best in the world at this. Explain. Yeah, actually, I mean, these things work. It's funny, but it does work to say act like XYZ. It's a very popular prompt template. We see a few examples. What else could you do? Yes. Okay."},{"start":1422.37,"text":"Critique your own project so you're using reflection. So you might actually do one output and then ask it to critique it and then give it back. Yeah, we'll see that. That's a great one. That's the one that probably works best within those typically, but we see some examples. What else? Yeah. Okay. Break the task down into steps. Do you know how that is called? No. Okay. Chain of thoughts."},{"start":1447.05,"text":"This is actually a popular method that's been shown in research that it improves. You could actually give clear instruction and also encourage the model to think step by step. Approach the task step by step and do not skip any step. And then you give it some steps such as step one, identify the three most important findings. Step two, explain how each finding impacts renewable energy policy. Step three, write the five-bullet summary with each point addressing a finding, etc."},{"start":1476.54,"text":"Chain of Thoughts, I leaked the paper from 2023 that popularized Chain of Thoughts. Chain of Thoughts is very, very popular right now, especially in AI startups that are trying to control their elements. Okay."},{"start":1492.24,"text":"To go back to your examples about act like XYZ, what I like to do, Andrew also talks about that, is to look at other people's prompts."},{"start":1502.26,"text":"And in fact, online, you have a lot of prompt repositories for free on GitHub."},{"start":1507.92,"text":"In fact, I linked the awesome prompt template repo on GitHub, where you have so many examples of great prompts that engineers have built."},{"start":1516.38,"text":"They said it works great for us and they published it online."},{"start":1519.28,"text":"And a lot of them start with act as, you know, act as a Linux terminal, act as an English translator, act like a position interviewer, etc."},{"start":1532.84,"text":"The advantage of a prompt template is that you can actually put it in your code and scale it for many user requests."},{"start":1540.84,"text":"So let me give you an example from Workera."},{"start":1545.34,"text":"Workera evaluates skills."},{"start":1546.98,"text":"Some of you have taken the assessments already."},{"start":1549.28,"text":"and tries to personalize it to the user."}],"speech_gaps":[{"start":1394.0,"end":1396.416},{"start":1396.416,"end":1398.384}],"frame":"../frames/v057/009.webp","frame_time":1385.33},{"title":"提示模板与零样本提示","segments":[{"id":144,"text":"And in fact, if you actually read in an HR system,","zh":"事实上，如果你真的在人力资源系统中查看","start":1552.4,"end":1555.26},{"id":145,"text":"in an enterprise, in the HR system,","zh":"在一个企业中，在人力资源系统中","start":1555.38,"end":1557.52},{"id":146,"text":"you might have Jane is a product manager, level three,","zh":"你可能会看到简是一名三级产品经理","start":1557.72,"end":1561.96},{"id":147,"text":"and she is in the US, and her preferred language is English.","zh":"她位于美国，她的首选语言是英语","start":1562.1,"end":1566.16},{"id":148,"text":"And actually, that metadata can be inserted in a prompt template","zh":"实际上，这些元数据可以插入到一个针对简定制的提示模板中","start":1566.98,"end":1570.68},{"id":149,"text":"that we personalize for Jane.","zh":"同样地，对于乔来说，他的首选语言","start":1570.68,"end":1572.52},{"id":150,"text":"And similarly for Joe, whose favorite language,","zh":"他的首选语言是西班牙语","start":1572.7,"end":1575.88},{"id":151,"text":"his preferred language is Spanish,","zh":"他的首选语言是西班牙语，","start":1575.96,"end":1577.48},{"id":152,"text":"it will tailor it to Joe.","zh":"它将根据乔进行调整。","start":1577.48,"end":1580.32},{"id":153,"text":"And that's called a prompt template.","zh":"这就是所谓的提示模板。","start":1580.46,"end":1581.78},{"id":154,"text":"So the question is,","zh":"所以问题是，","start":1590.64,"end":1593.52},{"id":155,"text":"do the foundation models use a prompt template","zh":"基础模型是否使用提示模板","start":1593.62,"end":1596.22},{"id":156,"text":"or do you have to integrate it yourself?","zh":"还是你必须自己进行整合？","start":1596.22,"end":1598.4},{"id":157,"text":"So the foundation models probably use a system prompt","zh":"因此，基础模型可能使用一个你无法看到的系统提示","start":1598.82,"end":1602.48},{"id":158,"text":"that you don't see.","zh":"就像当你实际在ChatGPT上输入时，","start":1602.48,"end":1603.28},{"id":159,"text":"Like when actually you type on ChatGPT,","zh":"那样。","start":1603.42,"end":1606.3},{"id":160,"text":"it is possible it's not public that open ai behind the scene has like act like a very helpful","zh":"有可能，这并不公开，OpenAI在幕后像一个非常有帮助的助手一样行动","start":1606.3,"end":1613.6},{"id":161,"text":"assistance for this user and by the way here is your memories about your the user that we kept in","zh":"顺便说一句，这里是您关于用户的记忆，我们将其保存在数据库中，您可以实际检查这些记忆，然后您的提示会进入生成阶段","start":1613.6,"end":1620.08},{"id":162,"text":"a database you can actually check your memories and then your prompt goes under and then the","zh":"然后生成开始，所以他们可能在使用类似的方法，但这并不意味着您不能自己添加一个","start":1620.08,"end":1625.3},{"id":163,"text":"generation starts so probably they're using something like that but it doesn't mean you can't","zh":"事实上，如果您考虑一个提示模板，例如在这里的工作示例，我之前","start":1625.3,"end":1629.7},{"id":164,"text":"add one yourself so in fact if you if you think about a prompt template for for the work here","zh":"可能它开始于您调用OpenAI并像一个有帮助的助手一样行动。然后在下面，它像一个伟大的AI导师，帮助人们在他们的职业生涯中。OpenAI的提示模板还包括遵循创建者的指示或类似的内容。这是可能的。关于提示模板的问题？再次，我鼓励您去阅读一些提示的例子。其中一些例子非常有思考性。","start":1629.7,"end":1635.58},{"id":165,"text":"example, I was","zh":"让我们谈谈零样本提示与少量样本提示。","start":1635.58,"end":1636.14},{"id":166,"text":"Maybe it starts when you call OpenAI by act like a helpful assistant. And then underneath, it's like act like a great AI mentor that helps people in their career. And OpenAI's prompt template also has follow the instruction from the creator or something like that. It's possible. Questions about prompt templates? Again, I would encourage you to go and read examples of prompts. Some of them are quite thoughtful.","zh":"也许它始于你像一个有帮助的助手一样调用OpenAI。而在其下，它更像是一个帮助人们在职业生涯中取得成功的优秀AI导师。OpenAI的提示模板也包含遵循创建者指令或类似的内容。这是有可能的。关于提示模板有什么问题吗？再次，我鼓励你们去阅读一些提示的例子。其中一些例子非常有思考性。","start":1636.97,"end":1663.17},{"id":167,"text":"Let's talk about zero-shot versus few-shot prompting.","zh":"让我们谈谈零样本提示与少样本提示的区别。","start":1664.66,"end":1667.82},{"id":168,"text":"It came up earlier.","zh":"这之前已经出现过了。","start":1667.84,"end":1669.06},{"id":169,"text":"Here's an example, again, going back to the categorization of product reviews.","zh":"这里有一个例子，再次回到产品评论的分类问题上。","start":1669.42,"end":1674.24},{"id":170,"text":"Let's say that we're working on a task where the prompt is classify the tone of the sentence as positive, negative, or neutral, and then you paste the review, which is the product is fine, but I was expecting more.","zh":"假设我们正在处理一个任务，提示是将句子的语气分类为正面、负面或中性，然后你粘贴评论，例如：'产品还行，但我的期望更高。'","start":1674.56,"end":1689.28},{"id":171,"text":"if i were to survey the room i would bet that some of you would say it's negative some of you","zh":"如果我调查一下房间里的意见，我会打赌有些人会说它是负面的，有些人","start":1691.56,"end":1697.98},{"id":172,"text":"would say it's neutral because you actually have a first part that is relatively positive it's fine","zh":"会说它是中性的，因为你实际上有一个相对正面的部分：'产品还行'","start":1697.98,"end":1703.54},{"id":173,"text":"and then the second part i was expecting more which is relatively negative so where do you land","zh":"然后第二部分'我的期望更高'则相对负面，那么你倾向于哪一种？","start":1704.08,"end":1708.82},{"id":174,"text":"this can be a subjective question and maybe in one industry this would be considered amazing","zh":"这可能是一个主观的问题，也许在某些行业，这会被认为是极好的，","start":1708.82,"end":1713.84},{"id":175,"text":"and another one it would be considered really bad because people are used to really flourishing","zh":"而在另一些行业则会被认为是非常糟糕的，因为人们习惯了非常繁荣的环境。","start":1713.84,"end":1718.5},{"id":176,"text":"reviews. And so the way you can actually align the model to your task is by converting that","zh":"评论。因此，你可以通过将该内容转换为零样本提示来使模型与你的任务对齐。","start":1718.5,"end":1724.52},{"id":177,"text":"zero-shot prompt. Zero-shot refers to the fact that it's not beginning given any example","zh":"零样本指的是模型在没有任何示例的情况下开始。","start":1724.52,"end":1728.66}],"notes":["本段讨论了提示模板（prompt template）的概念，即通过将用户信息（如语言偏好）嵌入提示模板中，实现个性化交互。讲者指出，基础模型（foundation models）可能已经内置了系统提示，但用户也可以自行添加提示模板。例如，OpenAI的提示模板可能包含扮演助手或导师的角色，以及遵循创建者指令等元素。","讲者进一步解释了零样本提示（zero-shot prompting）的概念，即模型在没有示例的情况下完成任务。通过一个产品评论分类的例子，讲者展示了如何根据句子的语气（正面、负面或中性）进行分类，指出这种分类可能具有主观性，取决于行业背景。","讲者强调了零样本提示与少样本提示（few-shot prompting）的区别，指出零样本提示不依赖任何示例，而少样本提示则可能包含少量示例。这种区分对于模型对任务的理解和对齐至关重要。","讲者提到，通过零样本提示，可以将模型对任务的理解与实际需求对齐。例如，在产品评论分类任务中，模型需要根据句子的语气进行分类，而这种分类可能因行业背景不同而有所差异。","讲者鼓励学生阅读提示模板的示例，以更好地理解如何构建有效的提示。这表明提示模板的设计和使用是深度学习和自然语言处理中的重要实践。","讲者指出，零样本提示的主观性可能影响模型的输出，因此需要根据具体任务和行业背景进行调整。这表明在实际应用中，提示模板的设计和使用需要结合具体场景进行优化。"],"formulas":[],"uncertainties":["act like a very helpful","assistance for this user and by the way here is your memories about your the user that we kept in","a database you can actually check your memories and then your prompt goes under and then the","generation starts so probably they're using something like that but it doesn't mean you can't","add one yourself so in fact if you if you think about a prompt template for for the work here","example, I was","Maybe it starts when you call OpenAI by act like a helpful assistant. And then underneath, it's like act like a great AI mentor that helps people in their career. And OpenAI's prompt template also has follow the instruction from the creator or something like that. It's possible. Questions about prompt templates? Again, I would encourage you to go and read examples of prompts. Some of them are quite thoughtful.","if i were to survey the room i would bet that some of you would say it's negative some of you","would say it's neutral because you actually have a first part that is relatively positive it's fine","and then the second part i was expecting more which is relatively negative so where do you land","this can be a subjective question and maybe in one industry this would be considered amazing","and another one it would be considered really bad because people are used to really flourishing","reviews. And so the way you can actually align the model to your task is by converting that","zero-shot prompt. Zero-shot refers to the fact that it's not beginning given any example"],"diagram":"none","start":1552.4,"end":1728.66,"asr_flags":[],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":1552.4,"text":"And in fact, if you actually read in an HR system,"},{"start":1555.38,"text":"in an enterprise, in the HR system,"},{"start":1557.72,"text":"you might have Jane is a product manager, level three,"},{"start":1562.1,"text":"and she is in the US, and her preferred language is English."},{"start":1566.98,"text":"And actually, that metadata can be inserted in a prompt template"},{"start":1570.68,"text":"that we personalize for Jane."},{"start":1572.7,"text":"And similarly for Joe, whose favorite language,"},{"start":1575.96,"text":"his preferred language is Spanish,"},{"start":1577.48,"text":"it will tailor it to Joe."},{"start":1580.46,"text":"And that's
