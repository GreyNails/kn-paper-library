oves user satisfaction?"},{"id":235,"text":"Yeah, it's not going to be a three-step process."},{"id":236,"text":"I see, I see. Why do we need the three steps?"},{"id":237,"text":"Yeah. I mean, think about it. The intermediate output is what you want to see."},{"id":238,"text":"Like, if I'm debugging the first approach, the way I would do it is I would capture user insights. Like, here's the email. How good was the response? Thumbs up, thumbs down."},{"id":239,"text":"Was your issue resolved? Thumbs up, thumbs down. Those would tell me how good is my prompt. And I can engineer that prompt, optimize it, and I would probably drive some gains. But I will not be able easily to trace back to what the problem was. While in the second approach, not only I can use the end-to-end metrics to improve my process, I can also use the intermediate steps. For example, if I look at prompt two and I look at the outline and I see the outline is actually meh, it's not great. Then I think I can get a lot"},{"id":240,"text":"of gains out of the outline. Or the outline is actually really good, but the last prompt doesn't do a good job at translating it into an email. So the outline is exactly what I want the LLM to do, but the translation in a customer-facing email is not good. In fact, it doesn't follow our vocabulary internally. Then I know the third prompt is where I would get the most gains. So that's what it allows me to do. Have intermediate steps to review."},{"id":241,"text":"We'll talk about it. Are there any latency concerns? Yes."},{"id":242,"text":"In certain applications, you don't want to use a chain or you don't want to use a long chain because it adds latency."},{"id":243,"text":"We'll talk about that later. Good point."},{"id":244,"text":"So practically, this is what chaining complex prompts look like."},{"id":245,"text":"You have your first prompt with your first task."},{"id":246,"text":"The output is pasted in the second prompt with the second task being defined."},{"id":247,"text":"find the output is then pasted into the third prompt with the third task being defined and so"}],"notes":["讲者用邮件回复任务说明链式提示的价值：除了可能改善最终回复表现，更重要的是让工作流可观察，方便定位问题。学生问：既然三个任务能放在一个提示里，为什么还要拆成三步？","只看最终结果，也可以通过用户反馈来优化提示，例如回复是否有帮助、问题是否得到解决。但这些端到端反馈不容易指出错误发生在哪个环节。拆成多步后，可以直接查看中间结果，逐段判断。","例如，大纲本身不好，就优先优化生成大纲的提示；如果大纲已经合适，而最终邮件没有很好地表达大纲内容，或者没有采用公司需要的用词，就优先改进第三步。这是讲者强调的“能看见中间输出”带来的调试优势。","链式调用也会增加延迟，因此有些应用不适合使用长链。这里的取舍是可观察性、调试便利和最终任务表现，与额外调用带来的延迟之间的平衡；本段没有给出适用于所有应用的固定结论。","操作上，前一个提示的输出会作为下一步的输入，再由下一步承担自己的子任务。讲者预告会在后续继续讨论延迟问题。"],"formulas":[],"diagram":"none","uncertainties":[],"asr_flags":[],"raw_segments":[{"start":2082.41,"text":"um the performance of uh the email the email how much it will the open rate will be or the user"},{"start":2089.97,"text":"satisfaction on the response will actually get higher you know and so chaining improves performance"},{"start":2096.61,"text":"But most importantly, it helps you control your workflow and debug it more seamlessly."},{"start":2103.65,"text":"Yes?"},{"start":2105.05,"text":"So, if we know that the three problems independently work very well,"},{"start":2110.77,"text":"if we combine them into one problem, and we highlight that,"},{"start":2114.61,"text":"and by that, we get a separate policy, or do we still have to do that breakdown?"},{"start":2124.45,"text":"So, let me try to rephrase."},{"start":2126.13,"text":"You say, let's say we look at the first prompt, which has all three tasks built in that prompt."},{"start":2133.73,"text":"What exactly do you mean?"},{"start":2135.23,"text":"You mean like if we evaluate the output and we measure some user insight, satisfaction, etc."},{"start":2141.55,"text":"Why don't we just modify that prompt and essentially see how it improves user satisfaction?"},{"start":2147.19,"text":"Yeah, it's not going to be a three-step process."},{"start":2150.53,"text":"I see, I see. Why do we need the three steps?"},{"start":2152.89,"text":"Yeah. I mean, think about it. The intermediate output is what you want to see."},{"start":2158.14,"text":"Like, if I'm debugging the first approach, the way I would do it is I would capture user insights. Like, here's the email. How good was the response? Thumbs up, thumbs down."},{"start":2170.09,"text":"Was your issue resolved? Thumbs up, thumbs down. Those would tell me how good is my prompt. And I can engineer that prompt, optimize it, and I would probably drive some gains. But I will not be able easily to trace back to what the problem was. While in the second approach, not only I can use the end-to-end metrics to improve my process, I can also use the intermediate steps. For example, if I look at prompt two and I look at the outline and I see the outline is actually meh, it's not great. Then I think I can get a lot"},{"start":2199.37,"text":"of gains out of the outline. Or the outline is actually really good, but the last prompt doesn't do a good job at translating it into an email. So the outline is exactly what I want the LLM to do, but the translation in a customer-facing email is not good. In fact, it doesn't follow our vocabulary internally. Then I know the third prompt is where I would get the most gains. So that's what it allows me to do. Have intermediate steps to review."},{"start":2229.74,"text":"We'll talk about it. Are there any latency concerns? Yes."},{"start":2233.1,"text":"In certain applications, you don't want to use a chain or you don't want to use a long chain because it adds latency."},{"start":2242.0,"text":"We'll talk about that later. Good point."},{"start":2244.82,"text":"So practically, this is what chaining complex prompts look like."},{"start":2249.18,"text":"You have your first prompt with your first task."},{"start":2251.68,"text":"The output is pasted in the second prompt with the second task being defined."},{"start":2256.68,"text":"find the output is then pasted into the third prompt with the third task being defined and so"}],"speech_gaps":[],"frame":"../frames/v057/013.webp","frame_time":2094.41},{"title":"测试提示与自动化评估方法","segments":[{"id":248,"text":"on that's what it looks like in practice. Super, we'll talk more later about testing your prompts"},{"id":249,"text":"but there are methods now to do it and we will see later in this lecture with our case study how"},{"id":250,"text":"how we can test our prompts."},{"id":251,"text":"But here is an example of how you might do it."},{"id":252,"text":"You might have a summarization workflow prompt that is the baseline."},{"id":253,"text":"It's a single prompt."},{"id":254,"text":"You might have a refined summarization, which is a modified prompt of this,"},{"id":255,"text":"or a workflow with a chain."},{"id":256,"text":"You know, and then you have your test case, which is the inputs that you want to summarize, let's say, and then you have the generated outputs and you can have humans go and."},{"id":257,"text":"these outputs and you would notice that the baseline is better or worse than the refined prompt. Of course, this manual approach takes time, but it's a good way to start and usually the advice is"},{"id":258,"text":"get hands-on at the beginning because you will quickly notice some issues and it will give you better intuition on what tweaks can lead to better performance. However, if you wanted to scale that system across many products, many parts of your code base, you might want to find a way to do that automatically without asking humans to review and grade summaries. One approach is to use"},{"id":259,"text":"you know platforms like at porcaria we our team uses a platform called prompt food that allows you to actually automate part of this testing. In a nutshell, what it does is it can allow you to run the same prompts with five different llms immediately put everything in a table that makes it super easy for a human to grade. Let's say, or alternatively it might allow you to define define llm judges"},{"id":260,"text":"LLM judges can come in different flavors. For example, I can have an LLM judge that does a pairwise comparison. So what the LLM is asked to do is here are two summaries. Just tell me which one is better than the other one."},{"id":261,"text":"That's what the LLM does. And that can be used as a proxy for how good the summarization baseline versus the refined version is. Another way to do an LLM judge is if you do it for a single answer grading. So here's a summary graded from one to five."},{"id":262,"text":"And then you can go even deeper and do a reference-guided pairwise comparison. Or you add also a rubric. You say a five is when a summary is below 100 characters. I'm just making up. Below 100 characters mentions at least three key points that are distinct and starts with a first sentence that displays the overview and then goes into detail. That's a great summary number, five out of five. Zero is..."}],"notes":["本段讲解了如何测试提示（prompt）的性能，包括手动测试和自动化测试方法。手动测试涉及使用基线提示和改进后的提示进行比较，通过人工评估生成的输出来判断效果。这种方法虽然耗时，但能帮助开发者快速发现问题并获得对提示调整的直觉。","在手动测试的基础上，如果需要在多个产品和代码库中扩展系统，可以考虑自动化测试方法。例如，使用像Prompt Food这样的平台，可以自动运行多个大型语言模型（LLMs）并生成结果表格，便于人工评估。此外，还可以定义LLM法官（LLM judges）来自动评估生成的摘要。","LLM法官可以采用不同的方式，如成对比较（pairwise comparison）或单个答案评分（single answer grading）。成对比较要求LLM判断两个摘要中哪个更好，而单个答案评分则要求LLM对摘要进行1到5分的评分。","还可以进一步细化评估方法，例如引入参考指南（reference-guided pairwise comparison）或评分标准（rubric）。评分标准可以包括摘要长度、是否包含关键点、是否以概述句开头等，从而更系统地评估摘要质量。","在实际应用中，评分标准可以是任意的，例如将5分定义为摘要长度低于100字符、包含至少三个关键点、以概述句开头等。这种评分方式可以为评估提供更明确的依据。","本段强调了在开发过程中尽早进行手动测试的重要性，以及如何通过自动化工具扩展测试范围，从而提高效率和准确性。"],"formulas":[],"uncertainties":["porcaria","define define llm judges"],"diagram":"none","start":2261.6,"end":2439.88,"asr_flags":[248],"raw_segments":[{"start":2261.6,"text":"on that's what it looks like in practice super we'll talk more later about testing your prompts"},{"start":2274.48,"text":"but there are methods now to do it and we will see later in this lecture with our case study how"},{"start":2279.68,"text":"how we can test our prompts."},{"start":2282.06,"text":"But here is an example of how you might do it."},{"start":2287.58,"text":"You might have a summarization workflow prompt that is the baseline."},{"start":2295.46,"text":"It's a single prompt."},{"start":2297.28,"text":"You might have a refined summarization, which is a modified prompt of this,"},{"start":2302.14,"text":"or a workflow with a chain."},{"start":2304.6,"text":"You know, and then you have your test case, which is the inputs that you want to summarize, let's say, and then you have the generated outputs and you can have humans go and."},{"start":2317.71,"text":"these outputs and you would notice that the baseline is better or worse than the refined prompt of course this manual approach takes time but it's a good way to start and usually the advice is"},{"start":2331.99,"text":"get hands-on at the beginning because you will quickly notice some issues and it will give you better intuition on what tweaks can lead to better performance. However, if you wanted to scale that system across many products, many parts of your code base, you might want to find a way to do that automatically without asking humans to review and grade summaries. One approach is to use"},{"start":2354.67,"text":"you know platforms like at porcaria we our team uses a platform called prompt food that allows you to actually automate part of this testing in a nutshell what it does is it can allow you to run the same prompts with five different llms immediately put everything in a table that makes it super easy for a human to grade let's say or alternatively it might allow you to define define llm judges"},{"start":2383.28,"text":"LLM judges can come in different flavors. For example, I can have an LLM judge that does a pairwise comparison. So what the LLM is asked to do is here are two summaries. Just tell me which one is better than the other one."},{"start":2397.2,"text":"That's what the LLM does. And that can be used as a proxy for how good the summarization baseline versus the refined version is. Another way to do an LLM judge is if you do it for a single answer grading. So here's a summary graded from one to five."},{"start":2414.1,"text":"And then you can go even deeper and do a reference-guided pairwise comparison. Or you add also a rubric. You say a five is when a summary is below 100 characters. I'm just making up. Below 100 characters mentions at least three key points that are distinct and starts with a first sentence that displays the overview and then goes into detail. That's a great summary number, five out of five. Zero is..."}],"speech_gaps":[],"frame":"../frames/v057/014.webp","frame_time":2273.6},{"title":"避免微调：提示工程的优势与局限","segments":[{"id":263,"text":"The LLM failed to summarize and actually was very verbose, let's say. And so you put a rubric behind it, and you have an LLM as just finding the rubric. Of course, you can now pair different techniques. You can do a few shots for the rubric. You can actually give examples of 5 out of 5s, 4 out of 4s, 3 out of 3s, because now you know multiple techniques. Okay? Does that make sense? Yeah."},{"id":264,"text":"Okay, so that was the second section on prompt engineering or the first line of optimization. Now, let's say you've exhausted all your chances for prompt engineering and you're thinking about actually touching the model, modifying its weights or fine-tuning it, in other words. I was telling you I'm not a fan of fine-tuning. There's a few reasons why."},{"id":265,"text":"It requires substantial labeled data, typically to fine-tune, although now there are approaches that are getting better at fine-tuning that look more like few-shot prompting, actually, than fine-tuning. It's sort of merging, although one modifies the weight, the other doesn't modify the weights."},{"id":266,"text":"losing their general purpose utility. So you might fine-tune a model and actually when someone asks a pretty generic question, it doesn't do well anymore. It might do well on your task. So it might be relevant or not. And then it's time and cost intensive. That's my main problem. And at Workera, we steer away from fine-tuning as much as possible because by the time you're done fine-tuning your model, the next model is out and it's actually beating your fine-tuned version of the previous model."},{"id":267,"text":"So I would steer away from fine-tuning as much as you can. The advantage of the prompt engineering methods we've seen is you can put the next best pre-trained model directly in your code. It will update everything immediately. Fine-tuning doesn't work like that. There are advantages, though, where it still makes sense. If the task requires repeated high-precision outputs, such as legal, scientific explanation, and if the general-purpose LLM struggles with domain-specific language."},{"id":268,"text":"So let's look at a quick example together, which is an example from Ross Lazarewicz. I think it was a couple of years ago, September 23, where Ross..."},{"id":269,"text":"uh tried to do slack fine tuning so he looked at a lot of slack messages within his company and he was like i'm going to fine tune a model that speaks like us or operates like us because this is how we work right this is the data that represents how people work at the company"}],"notes":["本段讨论了微调模型的局限性，包括需要大量标注数据、可能丧失通用性以及时间和成本高昂的问题。讲者指出，微调模型在面对通用问题时可能表现不佳，而微调后的模型可能很快被更新的模型所超越。","讲者提到，微调模型可能会过度适应特定数据，导致其在新任务上表现不佳。此外，微调过程需要大量时间和计算资源，这在实际应用中可能不具成本效益。","讲者以Ross Lazarewicz的例子说明了微调的潜在问题。他尝试对Slack消息进行微调，以使模型更贴近公司内部的沟通方式，但这种方法可能无法适应更广泛的场景。","讲者强调，提示工程方法相比微调具有优势，因为可以直接使用预训练模型，无需重新训练，从而节省时间和资源。然而，微调在某些需要高精度输出的领域（如法律和科学解释）仍然有其适用性。","讲者指出，微调模型可能无法适应快速变化的环境，因为新模型的发布可能使微调后的模型迅速过时。因此，讲者建议尽可能避免微调，除非任务对精度要求极高。","讲者提到，微调模型可能会过度适应特定数据，导致其在新任务上表现不佳。此外，微调过程需要大量时间和计算资源，这在实际应用中可能不具成本效益。"],"formulas":[],"uncertainties":["losing their general purpose utility"],"diagram":"none","start":2440.23,"end":2612.53,"asr_flags":[],"raw_segments":[{"start":2440.23,"text":"The LLM failed to summarize and actually was very verbose, let's say. And so you put a rubric behind it, and you have an LLM as just finding the rubric. Of course, you can now pair different techniques. You can do a few shots for the rubric. You can actually give examples of 5 out of 5s, 4 out of 4s, 3 out of 3s, because now you know multiple techniques. Okay? Does that make sense? Yeah."},{"start":2467.92,"text":"Okay, so that was the second section on prompt engineering or the first line of optimization. Now, let's say you've exhausted all your chances for prompt engineering and you're thinking about actually touching the model, modifying its weights or fine-tuning it, in other words. I was telling you I'm not a fan of fine-tuning. There's a few reasons why."},{"start":2495.4,"text":"It requires substantial labeled data, typically to fine-tune, although now there are approaches that are getting better at fine-tuning that look more like few-shot prompting, actually, than fine-tuning. It's sort of merging, although one modifies the weight, the other doesn't modify the weights. Fine-tuned models may also overfeed to specific data. We're going to see a funny example, actually."},{"start":2520.3,"text":"losing their general purpose utility. So you might fine-tune a model and actually when someone asks a pretty generic question, it doesn't do well anymore. It might do well on your task. So it might be relevant or not. And then it's time and cost intensive. That's my main problem. And at Workera, we steer away from fine-tuning as much as possible because by the time you're done fine-tuning your model, the next model is out and it's actually beating your fine-tuned version of the previous model."},{"start":2549.46,"text":"So I would steer away from fine-tuning as much as you can. The advantage of the prompt engineering methods we've seen is you can put the next best pre-trained model directly in your code. It will update everything immediately. Fine-tuning doesn't work like that. There are advantages, though, where it still makes sense. If the task requires repeated high-precision outputs, such as legal, scientific explanation, and if the general-purpose LLM struggles with domain-specific language."},{"start":2579.37,"text":"So let's look at a quick example together, which is an example from Ross Lazarewicz. I think it was a couple of years ago, September 23, where Ross..."},{"start":2596.99,"text":"uh tried to do slack fine tuning so he looked at a lot of slack messages within his company and he was like i'm going to fine tune a model that speaks like us or operates like us because this is how we work right this is the data that represents how people work at the company"}],"speech_gaps":[],"frame":"../frames/v057/015.webp","frame_time":2452.23},{"title":"增强LLM应用中的挑战与RAG","segments":[{"id":270,"text":"And so he actually went ahead and fine-tuned the model, gave it a prompt like, hey, write a, you know, he was delegating to the model, write a 500 word blog post on prompt engineering. And the model responded, I shall work on that in the morning. And then he tries to push the model a little further and say, it's morning now. And the model said, I'm writing right now, it's 6.30 a.m. here."},{"id":271,"text":"Write it now. Okay. Please. Okay, I shall write it now. I actually don't know what you would like me to say about prompt engineering. I can only describe the process. The only thing that comes to mind for a headline is how do we build prompts."},{"id":272,"text":"You know, it's kind of a funny example for fine-tuning because it's true that it went wrong. Like he was supposed to think like, I want the model to speak like us at work. And it ended up acting like people and not actually following instructions. So one example why I would steer away from fine-tuning. Super."},{"id":273,"text":"Let's talk about RAGs. RAGs is important. It's important to know out there and at least having the basics. It's a very common interview question, by the way. If you go interview for a job, they might ask you to explain in a nutshell to a five-year-old what is a RAG. And hopefully after that, you'll be able to do it. So we've seen some of the challenges with standalone LLMs."},{"id":274,"text":"Those challenges include the context window being small, the fact that it's hard to remember details within a large context window, knowledge gaps, you know, cutoff dates you mentioned earlier."},{"id":275,"text":"The model might be trained up to a date and then it cannot follow the trends or be up to date."},{"id":276,"text":"Hallucinations."},{"id":277,"text":"There are some fields, think about medical diagnosis, where hallucinations are very costly."},{"id":278,"text":"You can't afford a hallucination."},{"id":279,"text":"Even in education, imagine deploying a model for the U.S. youth education and it hallucinates and"},{"id":280,"text":"it teaches millions of people something completely wrong, it's a problem and then lack of sources"},{"id":281,"text":"a lot of fields love sources, research fields love sources, education love sources, legal"},{"id":282,"text":"loves sources as well, and so the pre-trained LLM doesn't do a good job to source and in fact if you"},{"id":283,"text":"If you have tried to find sources on a plain LLM, it actually hallucinates a lot."},{"id":284,"text":"It makes up research papers."},{"id":285,"text":"It just lists completely fakes."},{"id":286,"text":"So how do we solve that? With a RAG. RAG integrates with external knowledge sources, databases, documents, APIs. It ensures that..."}],"notes":["本段讨论了微调LLM时可能出现的问题，例如模型未能遵循指令，而是表现出类似人类的行为。这表明微调可能不是最佳选择，尤其是在需要严格遵循指令的场景中。","RAG（检索增强生成）被介绍为解决LLM局限性的方法，特别是在需要外部知识和来源的领域。RAG通过整合外部知识源，如数据库、文档和API，确保生成的内容更加准确。","LLM在知识更新和来源引用方面存在挑战，例如知识截止日期和幻觉问题。这些问题在医疗诊断、教育和法律等对准确性要求高的领域尤为严重。","幻觉问题可能导致严重后果，例如在教育中误导大量学生。因此，RAG被提出作为解决这些问题的方案。","RAG通过引入外部知识源，帮助模型在生成内容时引用可靠的信息，从而减少幻觉和知识过时的问题。","RAG的应用不仅限于特定领域，而是适用于需要准确信息和来源引用的广泛场景，如研究、教育和法律等。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2614.0,"end":2788.53,"asr_flags":[],"raw_segments":[{"start":2614.0,"text":"And so he actually went ahead and fine tuned the model, gave it a prompt like, hey, write a, you know, he was delegating to the model, write a 500 word blog post on prompt engineering. And the model responded, I shall work on that in the morning. And then he tries to push the model a little further and say, it's morning now. And the model said, I'm writing right now, it's 6.30 a.m. here."},{"start":2642.82,"text":"Write it now. Okay. Please. Okay, I shall write it now. I actually don't know what you would like me to say about prompt engineering. I can only describe the process. The only thing that comes to mind for a headline is how do we build prompts."},{"start":2657.1,"text":"You know, it's kind of a funny example for fine tuning because it's true that it went wrong. Like he was supposed to think like, I want the model to speak like us at work. And it ended up acting like people and not actually following instructions. So one example why I would steer away from fine tuning. Super."},{"start":2687.77,"text":"Let's talk about rags. Rags is important. It's important to know out there and at least having the basics. It's a very common interview question, by the way. If you go interview for a job, they might ask you to explain in a nutshell to a five-year-old what is a rag. And hopefully after that, you'll be able to do it. So we've seen some of the challenges with standalone LLMs."},{"start":2710.9,"text":"Those challenges include the context window being small, the fact that it's hard to remember details within a large context window, knowledge gaps, you know, cutoff dates you mentioned earlier."},{"start":2724.12,"text":"The model might be trained up to a date and then it cannot follow the trends or be up to date."},{"start":2729.46,"text":"Hallucinations."},{"start":2730.28,"text":"There are some fields, think about medical diagnosis, where hallucinations are very costly."},{"start":2735.28,"text":"You can't afford a hallucination."},{"start":2736.5,"text":"even in education imagine deploying a model for the u.s youth education and it hallucinates and"},{"start":2744.26,"text":"it teaches millions of people something completely wrong it's a problem and then lack of sources"},{"start":2749.98,"text":"a lot of fields love sources research fields love sources education love sources legal"},{"start":2758.16,"text":"loves sources as well and so the pre-trained llm doesn't do a good job to source and in fact if you"},{"start":2766.04,"text":"If you have tried to find sources on a plain LLM, it actually hallucinates a lot."},{"start":2771.34,"text":"It makes up research papers."},{"start":2772.78,"text":"It just lists completely fakes."},{"start":2776.01,"text":"So how do we solve that? With a RAG. RAG integrates with external knowledge sources, databases, documents, APIs. It ensures that..."}],"speech_gaps":[],"frame":"../frames/v057/016.webp","frame_time":2626.0},{"title":"RAG 技术与向量数据库","segments":[{"id":287,"text":"answers are more accurate, up-to-date, and grounded because you can actually update your document. Your drive is always up-to-date. I mean, ideally, you're always pushing new documents to it. And when you query, what is our Q4 performance in sales? Hopefully, there is the last board deck in the drive and it can read the last board deck."},{"id":288,"text":"And more developer control. We'll see why rags allow for targeted customization without actually requiring the retraining of the model. In fact, you don't touch the model with rags."},{"id":289,"text":"It's really a technique that is put on top of the model. So to see an example of a rag, this is a question answering application where we're in the medical field and a user is asking a query, what are the side effects of drug X?"},{"id":290,"text":"This is an important question. You can't hallucinate. You need to source. You need to be up to date. Maybe there is a new update to that drug that is now in the database and you need to read that. A rag is a great example of what you would want to use here."},{"id":291,"text":"The way it works is you have your knowledge base of a bunch of documents. What you do is you use an embedding to embed those documents into lower dimensional representations. So, for example, if the document is a PDF, a long PDF, you might..."},{"id":292,"text":"you know read the pdf understand it and then embed it we've seen plenty of embedding approaches"},{"id":293,"text":"together triplet loss etc you remember so imagine one of them here for llms is embedding those"},{"id":294,"text":"documents into lower representation if the representation is too small you will lose"},{"id":295,"text":"information if it's too big you will add latency right it's a trade um you will store typically"},{"id":296,"text":"those representations into a database"},{"id":297,"text":"those representations into a database"},{"id":298,"text":"called a vector"},{"id":299,"text":"database. There's a lot of vector"},{"id":300,"text":"database providers out there."},{"id":301,"text":"I think"},{"id":302,"text":"I've listed a couple that are"},{"id":303,"text":"very common. No, I haven't listed, but I can"},{"id":304,"text":"database is essentially storing those vectors"},{"id":305,"text":"database is essentially storing those vectors"},{"id":306,"text":"in a very efficient manner, allowing the"},{"id":307,"text":"fast retrieval"},{"id":308,"text":"with a certain distance metric."},{"id":309,"text":"embed, usually with the same algorithm, the user prompts, and you run a retrieval process,"},{"id":310,"text":"embed, usually with the same algorithm, the user prompts, and you run a retrieval process,"},{"id":311,"text":"which is essentially saying, based on the embedding from the user query and the vector"},{"id":312,"text":"database, find the relevant documents based on the distance between those embeddings."},{"id":313,"text":"user query with a system prompt or a prompt template on top."},{"id":314,"text":"So the prompt template can be answer user query based on list of documents."}],"notes":["本段讲解了RAG（检索增强生成）技术的基本原理，强调其在需要准确、最新和基于证据回答的问题中的重要性，例如医疗领域的药物副作用查询。RAG通过将文档嵌入到低维表示中，并使用向量数据库进行高效检索，从而实现对用户查询的精准回答。","在RAG中，文档和用户查询都会被嵌入到向量空间中，通过计算嵌入之间的距离来找到最相关的文档。这种技术允许在不重新训练模型的情况下进行定制化，从而提高回答的准确性和时效性。","向量数据库是RAG的关键组成部分，它以高效的方式存储和检索嵌入向量。数据库支持基于特定距离度量（如余弦相似度）的快速检索，这使得RAG能够在大规模文档集合中快速找到相关信息。","RAG的流程包括：文档嵌入、用户查询嵌入、向量数据库检索、相关文档检索、将检索到的文档与用户查询结合生成最终答案。这种流程确保了回答的准确性和可追溯性。","在实际应用中，RAG可以用于各种需要基于最新数据和证据进行回答的场景，例如医疗、金融和法律领域。它避免了模型的幻觉问题，确保回答基于真实数据。","RAG的实现涉及多个步骤，包括文档预处理、嵌入生成、向量数据库构建、检索和生成。这些步骤需要仔细设计和优化，以确保系统的效率和准确性。"],"formulas":[],"uncertainties":["the representation is too small you will lose","if it's too big you will add latency right it's a trade um you will store typically"],"diagram":"none","start":2789.23,"end":2967.44,"asr_flags":[],"raw_segments":[{"start":2789.23,"text":"answers are more accurate, up-to-date, and grounded because you can actually update your document. Your drive is always up-to-date. I mean, ideally, you're always pushing new documents to it. And when you query, what is our Q4 performance in sales? Hopefully, there is the last board deck in the drive and it can read the last board deck."},{"start":2810.4,"text":"And more developer control. We'll see why rags allow for targeted customization without actually requiring the retraining of the model. In fact, you don't touch the model with rags."},{"start":2821.35,"text":"It's really a technique that is put on top of the model. So to see an example of a rag, this is a question answering application where we're in the medical field and a user is asking a query, what are the side effects of drug X?"},{"start":2842.09,"text":"This is an important question. You can't hallucinate. You need to source. You need to be up to date. Maybe there is a new update to that drug that is now in the database and you need to read that. A rag is a great example of what you would want to use here."},{"start":2857.99,"text":"The way it works is you have your knowledge base of a bunch of documents. What you do is you use an embedding to embed those documents into lower dimensional representations. So, for example, if the document is a PDF, a long PDF, you might..."},{"start":2876.78,"text":"you know read the pdf understand it and then embed it we've seen plenty of embedding approaches"},{"start":2881.84,"text":"together triplet loss etc you remember so imagine one of them here for llms is embedding those"},{"start":2888.76,"text":"documents into lower representation if the representation is too small you will lose"},{"start":2895.14,"text":"information if it's too big you will add latency right it's a trade um you will store typically"},{"start":2903.24,"text":"those representations into a database"},{"start":2905.92,"text":"called a vector"},{"start":2907.06,"text":"database. There's a lot of vector"},{"start":2909.14,"text":"database providers out there."},{"start":2914.04,"text":"I think"},{"start":2915.16,"text":"I've listed a couple that are"},{"start":2917.04,"text":"very common. No, I haven't listed, but I can"},{"start":2919.12,"text":"share afterwards. A vector"},{"start":2921.3,"text":"database is essentially storing those vectors"},{"start":2923.16,"text":"in a very efficient manner, allowing the"},{"start":2925.1,"text":"fast retrieval"},{"start":2926.8,"text":"with a certain distance metric."},{"start":2928.96,"text":"What you do is you also"},{"start":2931.04,"text":"embed, usually with the same algorithm, the user prompts, and you run a retrieval process,"},{"start":2938.86,"text":"which is essentially saying, based on the embedding from the user query and the vector"},{"start":2945.56,"text":"database, find the relevant documents based on the distance between those embeddings."},{"start":2951.32,"text":"Once you've found the relevant documents, you pull them, and then you add them to the"},{"start":2956.02,"text":"user query with a system prompt or a prompt template on top."},{"start":2960.1,"text":"So the prompt template can be answer user query based on list of documents."}],"speech_gaps":[{"start":2911.66,"end":2913.64}],"frame":"../frames/v057/017.webp","frame_time":2801.23},{"title":"增强LLM应用中的检索增强生成（RAG）技术","segments":[{"id":315,"text":"If answered not in the document, say, I don't know. That's your prompt template where the user query is pasted, the documents are pasted, and then your output should be what you want because it's now grounded in the document. You can also add to this prompt template, tell me the exact page, chapter, line of the document that was relevant, and in fact, link it as well, just to be more precise. Any question on rags?"},{"id":316,"text":"is a simple vanilla rag yeah yes"},{"id":317,"text":"Question is, do the document embeddings still retain information of the location of the information within that document, especially in big documents? Great question. We'll get to it in a second. Because you're right that the vanilla rag might not do a good job with very large documents. So let's say, you know, when you open a medication box and you have this gigantic white paper with all the information and it's..."},{"id":318,"text":"very long, maybe a vanilla rag would not cut it. So what people have figured out is a bunch of techniques to improve rags. And in fact, chunking is a great technique that is very popular. So you might actually store in the vector database the embedding of the full documents. And on top of that, you will also store a chapter level vector. And when you retrieve, you retrieve the document, you retrieve the chapter, and that allows you to be more precise with the sourcing. It's one example."},{"id":319,"text":"Another technique that's popular is HIDE, hypothetical document embeddings, where a group of researchers published a paper showing that"},{"id":320,"text":"When you get your user query, one of the main problems is the user query actually does not look like your documents. For example, the user query might be, what are the side effects of drug X, when actually in the vector database, the vector represents very long documents. So how do you guarantee that the vector embedding is going to be close to the document embedding? What they do is they use the user query to generate a fake, hallucinated document."},{"id":321,"text":"They embed that document, and then they compare it to the vector in the vector database. Does that make sense? So, for example, the user says, what is the side effect of drug X? There's a prompt that this is given to another prompt that says, based on this user query, generates five-page reports answering the user query. It generates..."},{"id":322,"text":"potentially a completely fake answer, you embed that and it will be closer to the document that you're looking for likely."}],"notes":["本段讨论了检索增强生成（RAG）技术在处理大型文档时的局限性，特别是当用户查询与文档内容不匹配时的问题。讲者指出，传统的RAG可能无法有效处理非常大的文档，因此需要改进技术，如分块（chunking）和HIDE方法。","讲者提到，分块是一种流行的改进技术，通过在向量数据库中存储文档和章节级别的向量，可以提高检索的精确性。这允许在检索时同时获取文档和章节信息，从而更准确地定位信息来源。","HIDE方法涉及使用用户查询生成一个假文档，然后将其嵌入并与向量数据库中的文档进行比较。这种方法可以解决用户查询与文档内容不匹配的问题，从而提高检索的准确性。","讲者以药物副作用的查询为例，说明了如何通过生成假文档来匹配用户查询，并将其嵌入以找到相关的文档。这种方法可以提高检索的效率和准确性。","讲者强调，生成假文档的过程可能会产生完全虚假的答案，但通过嵌入和比较，可以找到与用户查询相关的文档。这种方法在处理大型文档时特别有用。","讲者指出，这种方法需要在向量数据库中存储文档和章节级别的向量，并在检索时同时获取这些信息，以提高检索的精确性和效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2968.99,"end":3141.92,"asr_flags":[],"raw_segments":[{"start":2968.99,"text":"If answered not in the document, say, I don't know. That's your prompt template where the user query is pasted, the documents are pasted, and then your output should be what you want because it's now grounded in the document. You can also add to this prompt template, tell me the exact page, chapter, line of the document that was relevant, and in fact, link it as well, just to be more precise. Any question on rags?"},{"start":2999.94,"text":"is a simple vanilla rag yeah yes"},{"start":3011.7,"text":"Question is, do the document embeddings still retain information of the location of the information within that document, especially in big documents? Great question. We'll get to it in a second. Because you're right that the vanilla rag might not do a good job with very large documents. So let's say, you know, when you open a medication box and you have this gigantic white paper with all the information and it's..."},{"start":3038.26,"text":"very long, maybe a vanilla rag would not cut it. So what people have figured out is a bunch of techniques to improve rags. And in fact, chunking is a great technique that is very popular. So you might actually store in the vector database the embedding of the full documents. And on top of that, you will also store a chapter level vector. And when you retrieve, you retrieve the document, you retrieve the chapter, and that allows you to be more precise with the sourcing. It's one example."},{"start":3067.02,"text":"Another technique that's popular is HIDE, hypothetical document embeddings, where a group of researchers published a paper showing that"},{"start":3081.06,"text":"When you get your user query, one of the main problems is the user query actually does not look like your documents. For example, the user query might be, what are the side effects of drug X, when actually in the vector database, the vector represents very long documents. So how do you guarantee that the vector embedding is going to be close to the document embedding? What they do is they use the user query to generate a fake, hallucinated document."},{"start":3109.71,"text":"They embed that document, and then they compare it to the vector in the vector database. Does that make sense? So, for example, the user says, what is the side effect of drug X? There's a prompt that this is given to another prompt that says, based on this user query, generates five-page reports answering the user query. It generates..."},{"start":3132.86,"text":"potentially a completely fake answer, you embed that and it will be closer to the document that you're looking for likely."}],"speech_gaps":[],"frame":"../frames/v057/018.webp","frame_time":2980.99},{"title":"增强LLM应用：从单任务到自主工作流","segments":[{"id":323,"text":"It's one example of a rag approach. Again, the purpose of this lecture is not to go through all these three and explain you every single method that has been discovered for rags, but I just wanted to show you how much research has been done between 2020 and 2025 in rags and how many branches of research you now have that you can learn from. The survey paper is linked in the slides, by the way, and I'll share them after the lecture. Super."},{"id":324,"text":"So we've made some progress. Hopefully now you feel like if you were to start an LLM application, you know how to do better prompts, you know how to do chains, you know how to do fine tuning. You also know how to do retrieval. And you have the baggage of techniques that you can go and read and find the code base, pull the code, vibe code it, but you have the breadth now."},{"id":325,"text":"The next set of topics we're going to see is around the question of how could we extend the capabilities of LLMs from performing single tasks enhanced with external knowledge to handling multi-step autonomous workflows. And this is where we get into proper agentic AI. So let's talk about agentic AI workflows towards autonomous and specialized systems."},{"id":326,"text":"Then we'll talk about evals. Then we'll see multi-agent systems. And we'll end with a little thoughts on what's next in AI. So Andrew Ng actually coined the term agentic AI workflows. And his reason was that a lot of companies use, say, agents, agents, agents everywhere, agents everywhere."},{"id":327,"text":"If you go and work at these companies, you will notice that they mean very different things by agent. Some people actually have a prompt and they call it an agent. Other people, they have a very complex multi-agency system, they call it an agent. And so calling everything an agent doesn't do it justice. So Andrew says, let's call it agentic workflows. Because in practice, it's a bunch of prompts with tools."},{"id":328,"text":"With additional resources, API calls that ultimately are put in a workflow, and you can call that workflow agentic."},{"id":329,"text":"So it's all about the multi-step process to complete the task."},{"id":330,"text":"Also, calling it agentic workflow allows us to not mix it up with what I called agent in the last lecture with reinforcement learning."},{"id":331,"text":"Because in RL, agent has a very specific definition, interacts with an environment, passes from one state to the other, has a reward and an observation."},{"id":332,"text":"You remember that chart, right?"}],"notes":["本段介绍了增强LLM应用的背景，强调了从单任务到多步骤自主工作流的转变。课程提到，研究者在2020至2025年间对RAG（检索增强生成）进行了大量研究，形成了多个研究分支。课程还提到，有一篇综述论文链接在幻灯片中，将在讲座结束后分享。","本段总结了课程中提到的LLM应用的关键技术，包括更好的提示、链式推理、微调、检索等。这些技术为学生提供了广泛的学习资源和实践基础，使他们能够找到代码库、拉取代码并进行实验。","本段引入了“代理式AI工作流”（agentic AI workflows）的概念，这是课程接下来要讨论的主题。课程指出，代理式AI工作流是将LLM的能力从单任务扩展到多步骤自主工作流的关键。","本段提到Andrew Ng提出了“代理式AI工作流”这一术语，其原因是许多公司广泛使用“代理”（agent）一词，但其含义却各不相同。Andrew认为，使用“代理式工作流”更准确，因为其本质上是一系列带有工具的提示。","本段强调了“代理式工作流”与强化学习中的“代理”（agent）概念的区别。在强化学习中，代理有明确的定义，包括与环境交互、状态转移、奖励和观察等。","本段提到课程中曾展示过一张图表，但未提供具体内容。这可能与后续讨论有关，但未在当前片段中展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3144.94,"end":3323.92,"asr_flags":[],"raw_segments":[{"start":3144.94,"text":"It's one example of a rag approach. Again, the purpose of this lecture is not to go through all these three and explain you every single method that has been discovered for rags, but I just wanted to show you how much research has been done between 2020 and 2025 in rags and how many branches of research you now have that you can learn from. The survey paper is linked in the slides, by the way, and I'll share them after the lecture. Super."},{"start":3182.72,"text":"So we've made some progress. Hopefully now you feel like if you were to start an LLM application, you know how to do better prompts, you know how to do chains, you know how to do fine tuning. You also know how to do retrieval. And you have the baggage of techniques that you can go and read and find the code base, pull the code, vibe code it, but you have the breadth now."},{"start":3206.23,"text":"The next set of topics we're going to see is around the question of how could we extend the capabilities of LLMs from performing single tasks enhanced with external knowledge to handling multi-step autonomous workflows. And this is where we get into proper agentic AI. So let's talk about agentic AI workflows towards autonomous and specialized systems."},{"start":3236.04,"text":"Then we'll talk about evals. Then we'll see multi-agent systems. And we'll end with a little thoughts on what's next in AI. So Andrew Ng actually coined the term agentic AI workflows. And his reason was that a lot of companies use, say, agents, agents, agents everywhere, agents everywhere."},{"start":3264.63,"text":"If you go and work at these companies, you will notice that they mean very different things by agent. Some people actually have a prompt and they call it an agent. Other people, they have a very complex multi-agency system, they call it an agent. And so calling everything an agent doesn't do it justice. So Andrew says, let's call it agentic workflows. Because in practice, it's a bunch of prompts with tools."},{"start":3290.06,"text":"With additional resources, API calls that ultimately are put in a workflow, and you can call that workflow agentic."},{"start":3298.34,"text":"So it's all about the multi-step process to complete the task."},{"start":3307.12,"text":"Also, calling it agentic workflow allows us to not mix it up with what I called agent in the last lecture with reinforcement learning."},{"start":3315.06,"text":"Because in RL, agent has a very specific definition, interacts with an environment, passes from one state to the other, has a reward and an observation."},{"start":3322.96,"text":"You remember that chart, right?"}],"speech_gaps":[],"frame":"../frames/v057/019.webp","frame_time":3156.94},{"title":"从单步提示到多步骤代理工作流的转变","segments":[{"id":333,"text":"So here's an example of how we move from a one-step prompt to a multi-step agentic workflow."},{"id":334,"text":"Let's say a user queries a product."},{"id":335,"text":"What is your refund policy on a chatbot?"},{"id":336,"text":"and the response"},{"id":337,"text":"using a rag"},{"id":338,"text":"says"},{"id":339,"text":"refunds are available"},{"id":340,"text":"within 30 days"},{"id":341,"text":"of purchase"},{"id":342,"text":"and maybe the rag"},{"id":343,"text":"can even look"},{"id":344,"text":"linked to the policy."},{"id":345,"text":"That's what we learned so far. Instead, an agenting workflow can function like this. The user says, can I get a refund for my order? And the response via..."},{"id":346,"text":"The agentic workflow is the agent retrieves the refund policy using a rag. The agent then follows up with the users and says, can you provide your order number? Then the agent queries an API to check the order details. And finally, it comes back to the user and confirms your order qualifies for a refund. The amount will be processed in three to five business days. This is much more thoughtful than the first version, which is sort of vanilla, right?"},{"id":347,"text":"So that's what we're going to talk about in the next couple of slides, is how do we get from the first one to the second one. There are plenty of specialized agentic workflows online. You've heard, and if you hang out in SF, you probably see a bunch of billboards. AI software engineer, AI skills mentor you've interacted with in the class to work AI SDR, AI lawyers, AI..."},{"id":348,"text":"specialized cloud engineer, it would be a stretch to say that everything works, but there's work being done towards that. I'm not personally a fan of putting a face behind those things. I think it's gimmicky. And I think in a few years from now, actually very few products will have a human face behind it. But it might be a marketing tactic from some startups. It's more scary than it is engaging, frankly."},{"id":349,"text":"Okay. I want to talk about the pirating shift. That's especially useful. Let's say you're a software engineer or you're planning to be a software engineer because software engineering as a discipline is sort of shifting or at least the best engineers I've worked with are able to move from a deterministic mindset to a fuzzy mindset."},{"id":350,"text":"and balance between the two whenever they need to get something done so here's the paradigm shift between traditional software and agent tki software the first one is the way you handle data traditional software deals with structured data you have json's you have databases they're pasted in a very structured manner in a data engineering pipeline and then they're used to be displayed on a certain interface the user might feel a form that is then retrieved and pasted in the day"}],"notes":["本段讲解了从单步提示到多步骤代理工作流的转变。通过一个退款政策查询的例子，说明了传统方法与代理工作流之间的差异。代理工作流能够更细致地处理用户请求，例如通过RAG（检索增强生成）获取退款政策，然后进一步询问用户订单号，查询API以确认订单详情，并最终向用户确认退款资格和处理时间。","在接下来的讲解中，课程提到代理工作流在实际应用中已经存在，例如AI软件工程师、AI法律顾问等。虽然这些应用可能并不完美，但它们代表了当前技术发展的趋势。课程还指出，未来产品可能不再需要人类面孔，而是更多地依赖AI代理。","课程进一步讨论了软件工程领域的范式转变，强调从确定性思维向模糊性思维的转变。优秀的工程师能够在这两种思维方式之间找到平衡，以应对不同的任务需求。","最后，课程提到传统软件处理结构化数据，如JSON和数据库，这些数据在数据工程管道中被处理并用于界面显示。而代理软件则可能采用不同的数据处理方式，例如通过API查询和用户交互来获取信息。"],"formulas":[],"uncertainties":["pirating shift","agent tki software"],"diagram":"none","start":3328.2,"end":3501.18,"asr_flags":[],"raw_segments":[{"start":3328.2,"text":"So here's an example of how we move from a one-step prompt to a multi-step agentic workflow."},{"start":3335.76,"text":"Let's say a user queries a product."},{"start":3340.92,"text":"What is your refund policy on a chatbot?"},{"start":3343.28,"text":"and the response"},{"start":3345.02,"text":"using a rag"},{"start":3346.44,"text":"says"},{"start":3346.96,"text":"refunds are available"},{"start":3348.16,"text":"within 30 days"},{"start":3349.14,"text":"of purchase"},{"start":3349.7,"text":"and maybe the rag"},{"start":3350.58,"text":"can even look"},{"start":3351.36,"text":"linked to the policy."},{"start":3353.39,"text":"That's what we learned so far. Instead, an agenting workflow can function like this. The user says, can I get a refund for my order? And the response via..."},{"start":3365.77,"text":"The agentic workflow is the agent retrieves the refund policy using a rag. The agent then follows up with the users and says, can you provide your order number? Then the agent queries an API to check the order details. And finally, it comes back to the user and confirms your order qualifies for a refund. The amount will be processed in three to five business days. This is much more thoughtful than the first version, which is sort of vanilla, right?"},{"start":3394.0,"text":"So that's what we're going to talk about in the next couple of slides, is how do we get from the first one to the second one. There are plenty of specialized agentic workflows online. You've heard, and if you hang out in SF, you probably see a bunch of billboards. AI software engineer, AI skills mentor you've interacted with in the class to work AI SDR, AI lawyers, AI..."},{"start":3421.83,"text":"specialized cloud engineer, it would be a stretch to say that everything works, but there's work being done towards that. I'm not personally a fan of putting a face behind those things. I think it's gimmicky. And I think in a few years from now, actually very few products will have a human face behind it. But it might be a marketing tactic from some startups. It's more scary than it is engaging, frankly."},{"start":3451.79,"text":"Okay. I want to talk about the pirating shift. That's especially useful. Let's say you're a software engineer or you're planning to be a software engineer because software engineering as a discipline is sort of shifting or at least the best engineers I've worked with are able to move from a deterministic mindset to a fuzzy mindset."},{"start":3471.84,"text":"and balance between the two whenever they need to get something done so here's the paradigm shift between traditional software and agent tki software the first one is the way you handle data traditional software deals with structured data you have json's you have databases they're pasted in a very structured manner in a data engineering pipeline and then they're used to be displayed on a certain interface the user might feel a form that is then retrieved and pasted in the day"}],"speech_gaps":[],"frame":"../frames/v057/020.webp","frame_time":3340.2},{"title":"增强LLM应用中的模糊工程与代理AI软件","segments":[{"id":351,"text":"database, all of that historically has been structured data. Now, more and more companies are handling freeform text, images, and all of that requires dynamic interpretation to transform an input into an output. The software itself..."},{"id":352,"text":"Used to be deterministic. Now you have a lot of software that is fuzzy. And fuzzy software creates so many issues. I mean, imagine if you let your user ask anything on your website. The chances that it breaks is tremendous. The chances that you're attacked is tremendous. The chances, it's really, really complicated. It's more complicated than people make it seem on Twitter. Fuzzy engineering is truly hard."},{"id":353,"text":"You might get hate as a company because one user did something that you authorized them to do that ended up breaking the database and ended up, you know, we've seen that with many companies in the last couple of years. So it takes a very specialized engineering mindset to do fuzzy engineering, but also know when you need to be deterministic. The other thing I'd call is with agentic AI software."},{"id":354,"text":"you sort of want to think about your software as like your manager. So you're familiar with the monolith or microservices approaches in software, where you structure your software in different boxes that can talk to each other and it allows teams to debug one section at a time."},{"id":355,"text":"to be done by a group of humans, what would be those roles? Would I have a graphic designer that then puts together a chart and then sends it to a marketing manager that converts it into a nice blog post that then gives it to the performance marketing expert that then publishes the blog post and then optimizes an A-B test, then to a data scientist that analyzes the data and then puts hypotheses and validates them or invalidates them? That's how you typically think if you're building an agentic AI software."},{"id":356,"text":"When actually the equivalent of that in traditional software might be completely different. It might be we have a data engineer box right here that handles all our data engineering. And then here we have the UI, UX stuff. Everything UI, UX related goes here. And companies might structure it in very different ways. And here is the business logic that we want to care about. And there's five engineers working on the business logic, let's say. Okay."},{"id":357,"text":"Testing and debugging is also very different. And we'll talk about it in the next section. The other thing that I feel matters is with AI in engineering, the cost of experimentation is going down drastically. And so people, I feel, should be more comfortable throwing away code."}],"notes":["本段讨论了模糊工程在现代软件开发中的挑战，特别是当用户输入变得不可预测时，系统可能因错误操作而崩溃。讲者指出，这种模糊性导致了公司可能因用户行为而遭受负面评价，强调了在软件设计中需要平衡模糊性和确定性。","讲者将代理AI软件类比为经理，通过将任务分解为不同角色（如图形设计师、市场经理等）来构建系统。这种类比帮助理解如何将复杂任务分配给不同的AI模块，类似于传统软件中的微服务架构。","在代理AI软件中，每个角色对应一个AI模块，负责特定任务，如生成图表、撰写博客、优化A/B测试等。这种结构允许系统模块化，便于调试和维护。","传统软件架构可能采用不同的分层方式，例如数据工程师、UI/UX团队和业务逻辑模块。讲者指出，不同公司可能根据自身需求采用不同的架构方式。","测试和调试在代理AI软件中与传统软件有显著不同，这将在后续部分详细讨论。讲者强调了AI工程中实验成本的降低，使得开发人员可以更自由地尝试和丢弃代码。","讲者指出，随着AI技术的发展，实验成本的降低使得开发人员可以更轻松地进行尝试和迭代，从而加快产品开发和优化过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3501.23,"end":3679.18,"asr_flags":[],"raw_segments":[{"start":3501.23,"text":"database, all of that historically has been structured data. Now, more and more companies are handling freeform text, images, and all of that requires dynamic interpretation to transform an input into an output. The software itself..."},{"start":3520.05,"text":"Used to be deterministic. Now you have a lot of software that is fuzzy. And fuzzy software creates so many issues. I mean, imagine if you let your user ask anything on your website. The chances that it breaks is tremendous. The chances that you're attacked is tremendous. The chances, it's really, really complicated. It's more complicated than people make it seem on Twitter. Fuzzy engineering is truly hard."},{"start":3546.97,"text":"You might get hate as a company because one user did something that you authorized them to do that ended up breaking the database and ended up, you know, we've seen that with many companies in the last couple of years. So it takes a very specialized engineering mindset to do fuzzy engineering, but also know when you need to be deterministic. The other thing I'd call is with agentic AI software."},{"start":3569.52,"text":"you sort of want to think about your software as like your manager. So you're familiar with the monolith or microservices approaches in software, where you structure your software in different boxes that can talk to each other and it allows teams to debug one section at a time. Now the equivalent with agentic AI is you think as a manager. So you think, okay, if I was to delegate my products,"},{"start":3598.8,"text":"to be done by a group of humans, what would be those roles? Would I have a graphic designer that then puts together a chart and then sends it to a marketing manager that converts it into a nice blog post that then gives it to the performance marketing expert that then publishes the blog post and then optimizes an A-B test, then to a data scientist that analyzes the data and then puts hypotheses and validates them or invalidates them? That's how you typically think if you're building an agentic AI software."},{"start":3628.43,"text":"When actually the equivalent of that in traditional software might be completely different. It might be we have a data engineer box right here that handles all our data engineering. And then here we have the UI, UX stuff. Everything UI, UX related goes here. And companies might structure it in very different ways. And here is the business logic that we want to care about. And there's five engineers working on the business logic, let's say. Okay."},{"start":3657.1,"text":"Testing and debugging is also very different. And we'll talk about it in the next section. The other thing that I feel matters is with AI in engineering, the cost of experimentation is going down drastically. And so people, I feel, should be more comfortable throwing away code."}],"speech_gaps":[],"frame":"../frames/v057/021.webp","frame_time":3513.23},{"title":"传统软件工程与AI工程的对比","segments":[{"id":358,"text":"In traditional software engineering, you probably don't throw away code a ton. You build a code and it's solid and it's bulletproof and then you update it over time. We've seen AI companies be more comfortable throwing away codes, which has advantages in terms of the speed at which you move, but also disadvantages in terms of the quality of your software that can break more."},{"id":359,"text":"Okay. So anyway, just wanted to do an"},{"id":360,"text":"apartheid on the paradigm shift"},{"id":361,"text":"from deterministic to fuzzy engineering."},{"id":362,"text":"Oh, and actually I can give you an example"},{"id":363,"text":"from Workera that we"},{"id":364,"text":"learned probably over"},{"id":365,"text":"the last 12 months. It's like, if"},{"id":366,"text":"you've used Workera, you might have seen"},{"id":367,"text":"that the interface has"},{"id":368,"text":"asked you sometimes multiple choice"},{"id":369,"text":"questions. And sometimes it asks you"},{"id":370,"text":"multiple select and sometimes it asks you drag and drop ordering matching whatever right those"},{"id":371,"text":"are example of deterministic item types meaning you answer the question on a multiple choice"},{"id":372,"text":"there's one correct answer it's fully deterministic on the other hand you sometimes have voice"},{"id":373,"text":"questions where you go to a role play or you have voice plus coding questions where your code is"},{"id":374,"text":"being read by the interface or whatever those are fuzzy meaning the scoring algorithm might"},{"id":375,"text":"actually make mistakes. And those mistakes might be costly. And so companies have to figure out"},{"id":376,"text":"a human in the loop system, which you might have seen the appeal feature at the end. So at the end"},{"id":377,"text":"of the assessment, you have an appeal feature where it allows you to say, I want to appeal"},{"id":378,"text":"the agent because I want to challenge what the agent said on my answer, because I thought that"},{"id":379,"text":"was better than what the agent thought. And then you bring a human in the loop that then can fix"},{"id":380,"text":"the agent, can tell the agent, actually, you were too harsh on the answer of this person."},{"id":381,"text":"Um, and you know, that's an example of a fuzzy engineered system that then adds a human in"},{"id":382,"text":"the loop to make it more aligned."},{"id":383,"text":"And so if you're building a company, I would encourage you to think about what can I get"},{"id":384,"text":"done with determinism and let's get that done."},{"id":385,"text":"And then the fuzzy stuff, I want to do fuzzy because it allows more interaction."},{"id":386,"text":"It allows more back and forth, but I need to put guardrails around it."},{"id":387,"text":"And how am I going to design those guardrails?"},{"id":388,"text":"Pretty much."},{"id":389,"text":"All right."},{"id":390,"text":"Here's another example from enterprise workflows, which are likely to change due to agentic AI. This is a paper from McKinsey, I believe from last year, where they looked at a financial institution and they said that, you know, we observed that they often spend one to four weeks to create a credit risk memo. And here's the process. A relationship manager."},{"id":391,"text":"Gathers data from 15 and more than 15 sources on the borrower, loan type."}],"notes":["本段讨论了传统软件工程与AI工程在开发方式上的差异。传统软件工程注重代码的稳定性和长期维护，而AI工程则更倾向于快速迭代，但可能牺牲软件质量。这种差异源于AI系统的不确定性，即模糊工程（fuzzy engineering）的特点。","讲者通过Workera的例子说明了模糊工程的应用。在Workera中，系统有时会使用确定性问题（如单选题），有时则使用模糊问题（如语音问答或代码评估），后者可能因评分算法的不准确性而产生错误，进而需要引入人类监督机制。","模糊工程的挑战在于如何在系统中引入人类监督，以确保质量。讲者提到，Workera在评估结束后提供了申诉功能，允许用户挑战AI的评分结果，并引入人类进行修正。","讲者建议在构建公司时，应优先利用确定性方法完成核心任务，再在需要交互和灵活性的部分引入模糊工程，同时设置适当的边界条件（guardrails）以控制风险。","讲者还提到，企业流程（如信用风险分析）可能因AI代理（agentic AI）而发生变化。例如，某金融机构的信用风险分析流程原本需要1至4周，而AI可能改变这一流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3681.42,"end":3856.5,"asr_flags":[],"raw_segments":[{"start":3681.42,"text":"In traditional software engineering, you probably don't throw away code a ton. You build a code and it's solid and it's bulletproof and then you update it over time. We've seen AI companies be more comfortable throwing away codes, which has advantages in terms of the speed at which you move, but also disadvantages in terms of the quality of your software that can break more."},{"start":3708.43,"text":"Okay. So anyway, just wanted to do an"},{"start":3710.59,"text":"apartheid on the paradigm shift"},{"start":3712.75,"text":"from deterministic to fuzzy engineering."},{"start":3720.41,"text":"Oh, and actually I can give you an example"},{"start":3722.39,"text":"from Workera that we"},{"start":3724.77,"text":"learned probably over"},{"start":3726.73,"text":"the last 12 months. It's like, if"},{"start":3728.53,"text":"you've used Workera, you might have seen"},{"start":3730.67,"text":"that the interface has"},{"start":3733.07,"text":"asked you sometimes multiple choice"},{"start":3734.73,"text":"questions. And sometimes it asks you"},{"start":3736.83,"text":"multiple select and sometimes it asks you drag and drop ordering matching whatever right those"},{"start":3741.73,"text":"are example of deterministic item types meaning you answer the question on a multiple choice"},{"start":3747.31,"text":"there's one correct answer it's fully deterministic on the other hand you sometimes have voice"},{"start":3752.95,"text":"questions where you go to a role play or you have voice plus coding questions where your code is"},{"start":3759.09,"text":"being read by the interface or whatever those are fuzzy meaning the scoring algorithm might"},{"start":3765.95,"text":"actually make mistakes. And those mistakes might be costly. And so companies have to figure out"},{"start":3772.13,"text":"a human in the loop system, which you might have seen the appeal feature at the end. So at the end"},{"start":3777.19,"text":"of the assessment, you have an appeal feature where it allows you to say, I want to appeal"},{"start":3781.77,"text":"the agent because I want to challenge what the agent said on my answer, because I thought that"},{"start":3786.61,"text":"was better than what the agent thought. And then you bring a human in the loop that then can fix"},{"start":3790.95,"text":"the agent, can tell the agent, actually, you were too harsh on the answer of this person."},{"start":3795.95,"text":"Um, and you know, that's an example of a fuzzy engineered system that then adds a human in"},{"start":3801.95,"text":"the loop to make it more aligned."},{"start":3804.09,"text":"And so if you're building a company, I would encourage you to think about what can I get"},{"start":3808.65,"text":"done with determinism and let's get that done."},{"start":3810.97,"text":"And then the fuzzy stuff, I want to do fuzzy because it allows more interaction."},{"start":3815.87,"text":"It allows more back and forth, but I need to put guardrails around it."},{"start":3819.87,"text":"And how am I going to design those guardrails?"},{"start":3821.73,"text":"Pretty much."},{"start":3822.43,"text":"All right."},{"start":3825.04,"text":"Here's another example from enterprise workflows, which are likely to change due to agentic AI. This is a paper from McKinsey, I believe from last year, where they looked at a financial institution and they said that, you know, we observed that they often spend one to four weeks to create a credit risk memo. And here's the process. A relationship manager."},{"start":3850.32,"text":"Gathers data from 15 and more than 15 sources on the borrower, loan type."}],"speech_gaps":[],"frame":"../frames/v057/022.webp","frame_time":3693.42},{"title":"增强LLM应用：流程优化与组织变革","segments":[{"id":392,"text":"Other factors, then the relationship manager and the credit analyst collaboratively analyze that data from these sources. Then the credit analyst typically spends 20 hours or more writing a memo and then goes back to the relationship manager. They give feedback and then they go through this loop again and again. And it takes a long time to get a credit memo out."},{"id":393,"text":"They then run a research study where they changed the process. They said Gen AI agents could actually cut time by 20 to 60% on credit risk memos. And the process has changed to the relationship manager directly work with the Gen AI agent system, provides relevant materials that needs to produce the memo. The agent subdivises the project into tasks that are assigned to specialist agents, gathers and analyzes the data from multiple sources."},{"id":394,"text":"drafts a memo, then the relationship manager and the credit analyst sit down together, review the memo, give feedback to the agent, and within 20% to 60% less time are done. And so this is an example where you're actually not changing the human stakeholders. You're just changing the process and adding Gen AI to reduce the time it takes to get a credit memo out. It turns out that..."},{"id":395,"text":"Imagine you're an enterprise and you have 100,000 employees and there's a lot of enterprises with 100,000 employees out there. You are currently under crisis in terms of redesigning your workflows. It turns out that if you actually pull the job descriptions from the HR system and you interpret them, you also pull the business process workflows that you have encoded in your..."},{"id":396,"text":"you actually can find gains in multiple places. And in the next few years, you're probably going to see workflows being more optimized to add Gen AI. Even if that happens, the hardest part is changing people. What we know this is, this is great in theory, but now let's try to fit that second workflow for 10,000 credits, risk analysts and relationship managers. My guess is it will take years. It will take 10, 20 years."},{"id":397,"text":"get to this being actually done at scale within an organization because change is so hard, you know, so hard to rewire business workflows, job descriptions, incentivize people to do different and be different and train them. And so, you know, this is what the world is going towards, but it's going to take a long time, I think."}],"notes":["本段讨论了在信用风险备忘录生成过程中引入生成式AI代理的优化流程。传统流程中，关系经理和信用分析师需要花费大量时间撰写备忘录，并反复进行反馈循环。而通过引入AI代理，流程被重新设计，AI负责将任务分配给专业代理，收集和分析数据，最终生成备忘录，从而将时间缩短20%到60%。","该段还指出，虽然AI可以显著提高效率，但真正的挑战在于组织内部的变革。即使技术可行，改变人们的工作方式、调整工作描述、激励员工适应新流程仍然需要很长时间，可能需要10到20年。","此外，本段提到，企业拥有大量员工时，通过从HR系统中提取职位描述和业务流程，可以发现多个优化点。未来几年，随着AI的进一步应用，工作流程将更加优化，但组织变革的难度依然存在。","讲者强调，尽管AI在理论上具有巨大潜力，但实际应用中需要克服组织内部的阻力，包括重新设计工作流程、调整激励机制以及对员工进行培训。这些因素使得大规模应用AI仍然面临挑战。","最后，讲者指出，虽然世界正在向AI驱动的工作流程转变，但这一过程将是一个长期的过程，需要耐心和持续的努力。","本段通过具体案例说明了AI在优化业务流程中的潜力，同时也指出了组织变革的复杂性和长期性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3857.12,"end":4012.86,"asr_flags":[],"raw_segments":[{"start":3857.12,"text":"Other factors, then the relationship manager and the credit analyst collaboratively analyze that data from these sources. Then the credit analyst typically spends 20 hours or more writing a memo and then goes back to the relationship manager. They give feedback and then they go through this loop again and again. And it takes a long time to get a credit memo out."},{"start":3882.06,"text":"They then run a research study where they changed the process. They said Gen AI agents could actually cut time by 20 to 60% on credit risk memos. And the process has changed to the relationship manager directly work with the Gen AI agent system, provides relevant materials that needs to produce the memo. The agent subdivises the project into tasks that are assigned to specialist agents, gathers and analyzes the data from multiple sources."},{"start":3911.59,"text":"drafts a memo, then the relationship manager and the credit analyst sit down together, review the memo, give feedback to the agent, and within 20% to 60% less time are done. And so this is an example where you're actually not changing the human stakeholders. You're just changing the process and adding Gen AI to reduce the time it takes to get a credit memo out. It turns out that..."},{"start":3936.96,"text":"Imagine you're an enterprise and you have 100,000 employees and there's a lot of enterprises with 100,000 employees out there. You are currently under crisis in terms of redesigning your workflows. It turns out that if you actually pull the job descriptions from the HR system and you interpret them, you also pull the business process workflows that you have encoded in your..."},{"start":3962.26,"text":"you actually can find gains in multiple places. And in the next few years, you're probably going to see workflows being more optimized to add Gen AI. Even if that happens, the hardest part is changing people. What we know this is, this is great in theory, but now let's try to fit that second workflow for 10,000 credits, risk analysts and relationship managers. My guess is it will take years. It will take 10, 20 years."},{"start":3991.66,"text":"get to this being actually done at scale within an organization because change is so hard, you know, so hard to rewire business workflows, job descriptions, incentivize people to do different and be different and train them. And so, you know, this is what the world is going towards, but it's going to take a long time, I think."}],"speech_gaps":[],"frame":"../frames/v057/023.webp","frame_time":3869.12},{"title":"智能体的核心组件与记忆管理","segments":[{"id":398,"text":"Okay, then I want to talk about how the agent actually works and what are the core components of an agent. Imagine a travel booking AI agent. That's an easy example you've all thought about. I still haven't been able to get an agent to book a trip for me or I was scared because it was going to book a very expensive or long trip. But in theory..."},{"id":399,"text":"you can have a travel booking agent that has prompts. So the prompts we've seen, we know the methods to optimize those prompts. That travel agent also has a context management system, which is essentially the memory of what it knows about the user. That context management system might include a core memory or working memory and an archival memory. What the difference is within memory,"},{"id":400,"text":"um is not every memory needs to be fast to access like think about it you you're onboarded on a"},{"id":401,"text":"product and the first question is hi what's your name and i say my name is kian that's probably"},{"id":402,"text":"going to sit in the working memory because the agent every time he's going to talk to me he's"},{"id":403,"text":"going to want to use my name right but then maybe the second question is kian what's your birthday"},{"id":404,"text":"and i give it my birthday does it need my birthday every day probably not so it's probably going to"},{"id":405,"text":"targets on the long-term memory or the archival memory and those memories are slower to access"},{"id":406,"text":"they're farther down the stack and you know that structure allows agent to determine what's the"},{"id":407,"text":"working memory and what's a long-term memory you know and that makes it easier for the agent to"},{"id":408,"text":"retrieve super fast because think about it when you interact with chat gpt you feel that it's"},{"id":409,"text":"very personal at times right you feel like it understands you um imagine every time you call"},{"id":410,"text":"it it has to read the memories right and that can be costly it's like a very it's a very burdensome"},{"id":411,"text":"cost because it happens every time you talk to it so you want to be highly optimized with the"},{"id":412,"text":"working memory you know if it takes three seconds to look in the memory every time you're going to"},{"id":413,"text":"talk to your llm it's going to take three seconds which you don't want so anyway and then you have"},{"id":414,"text":"the tools the tools can include apis like a flight search api hotel booking api car rental api weather"},{"id":415,"text":"API and then the payment processing API and typically you would want to"},{"id":416,"text":"to tell your agent how that API works."},{"id":417,"text":"It turns out that agents, or LLMs, I should say,"},{"id":418,"text":"are very good at reading API documentation."},{"id":419,"text":"So you give it the API documentation, and it reads the JSON,"},{"id":420,"text":"and it reads what does a get request look like,"},{"id":421,"text":"and this is the format that I need to push,"},{"id":422,"text":"and then it pushes it in that format, let's say."},{"id":423,"text":"And then it retrieves something."},{"id":424,"text":"Does that make sense, those different components?"},{"id":425,"text":"you know entropic also talks about resources resources is data that is sitting somewhere"}],"notes":["本段讲解了智能体的核心组件，包括提示（prompts）、上下文管理系统（context management system）和工具（tools）。上下文管理系统分为工作记忆（working memory）和归档记忆（archival memory），工作记忆用于快速访问的当前信息，而归档记忆用于长期存储的信息，访问速度较慢。这种分层结构有助于智能体高效地检索信息。","讲者通过一个旅行预订智能体的例子，说明了智能体如何管理用户信息。例如，用户的名字会被存储在工作记忆中，而生日等信息可能存储在归档记忆中。这种区分使得智能体在与用户交互时能够快速访问关键信息，同时避免频繁访问慢速存储。","讲者提到，智能体需要优化工作记忆的访问速度，因为每次访问工作记忆都会带来延迟。如果每次访问需要三秒钟，这将严重影响用户体验。因此，智能体的设计需要在工作记忆和归档记忆之间进行权衡。","工具部分包括各种API，如航班搜索、酒店预订、租车和天气API，以及支付处理API。讲者强调，需要向智能体解释这些API的工作方式，以便智能体能够正确调用。","讲者指出，智能体或大型语言模型（LLMs）在阅读API文档方面表现良好。通过提供API文档，智能体可以理解如何构造请求，并以正确的格式推送数据，从而实现功能。","最后，讲者询问听众是否理解这些不同组件，表明课程内容的重点在于理解智能体的结构和工作原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4015.6,"end":4190.67,"asr_flags":[],"raw_segments":[{"start":4015.6,"text":"Okay, then I want to talk about how the agent actually works and what are the core components of an agent. Imagine a travel booking AI agent. That's an easy example you've all thought about. I still haven't been able to get an agent to book a trip for me or I was scared because it was going to book a very expensive or long trip. But in theory..."},{"start":4038.92,"text":"you can have a travel booking agent that has prompts. So the prompts we've seen, we know the methods to optimize those prompts. That travel agent also has a context management system, which is essentially the memory of what it knows about the user. That context management system might include a core memory or working memory and an archival memory. What the difference is within memory,"},{"start":4066.84,"text":"um is not every memory needs to be fast to access like think about it you you're onboarded on a"},{"start":4073.58,"text":"product and the first question is hi what's your name and i say my name is kian that's probably"},{"start":4079.78,"text":"going to sit in the working memory because the agent every time he's going to talk to me he's"},{"start":4083.6,"text":"going to want to use my name right but then maybe the second question is kian what's your birthday"},{"start":4088.26,"text":"and i give it my birthday does it need my birthday every day probably not so it's probably going to"},{"start":4093.38,"text":"targets on the long-term memory or the archival memory and those memories are slower to access"},{"start":4099.92,"text":"they're farther down the stack and you know that structure allows agent to determine what's the"},{"start":4105.92,"text":"working memory and what's a long-term memory you know and that makes it easier for the agent to"},{"start":4110.98,"text":"retrieve super fast because think about it when you interact with chat gpt you feel that it's"},{"start":4116.1,"text":"very personal at times right you feel like it understands you um imagine every time you call"},{"start":4121.36,"text":"it it has to read the memories right and that can be costly it's like a very it's a very burdensome"},{"start":4127.52,"text":"cost because it happens every time you talk to it so you want to be highly optimized with the"},{"start":4133.2,"text":"working memory you know if it takes three seconds to look in the memory every time you're going to"},{"start":4138.36,"text":"talk to your llm it's going to take three seconds which you don't want so anyway and then you have"},{"start":4143.62,"text":"the tools the tools can include apis like a flight search api hotel booking api car rental api weather"},{"start":4150.76,"text":"API and then the payment processing API and typically you would want to"},{"start":4156.43,"text":"to tell your agent how that API works."},{"start":4159.41,"text":"It turns out that agents, or LLMs, I should say,"},{"start":4162.97,"text":"are very good at reading API documentation."},{"start":4165.73,"text":"So you give it the API documentation, and it reads the JSON,"},{"start":4168.79,"text":"and it reads what does a get request look like,"},{"start":4171.47,"text":"and this is the format that I need to push,"},{"start":4174.15,"text":"and then it pushes it in that format, let's say."},{"start":4177.47,"text":"And then it retrieves something."},{"start":4180.93,"text":"Does that make sense, those different components?"},{"start":4182.99,"text":"you know entropic also talks about resources resources is data that is sitting somewhere"}],"speech_gaps":[],"frame":"../frames/v057/024.webp","frame_time":4027.6},{"title":"增强LLM应用中的自主性架构","segments":[{"id":426,"text":"that you might let your agent read for example if you're building your startups you have a crm"},{"id":427,"text":"a crm has data in it and you want to use lookups in that data you will probably give a lookup tool"},{"id":428,"text":"and you will give access to the resource and it will do lookups whenever you want super fast"},{"id":429,"text":"So, this type of architecture can be built with different degrees of autonomy, from the least autonomous to the most autonomous."},{"id":430,"text":"And I'll give you a few examples."},{"id":431,"text":"Less autonomous would be you've hard-coded the steps."},{"id":432,"text":"So, let's say I tell the travel agent, first identify the intent, then look up in the database the history of this customer with us and their preferences."},{"id":433,"text":"is, then go to the flight API, blah, blah, blah, then go to the, I would hard code the"},{"id":434,"text":"steps."},{"id":435,"text":"Okay."},{"id":436,"text":"That's the least autonomous."},{"id":437,"text":"The semi-autonomous is I might hard code the tools, but I'm not going to hard code the"},{"id":438,"text":"steps."},{"id":439,"text":"So I'm going to tell the agents, um, your acts like a travel agents and, um, and, uh,"},{"id":440,"text":"you, your task is to help the person book a travel."},{"id":441,"text":"and these are the tools that you have accessible to yourself."},{"id":442,"text":"And so I'm not hard-coding the steps,"},{"id":443,"text":"I'm just hard-coding the tools that you have access to for yourself."},{"id":444,"text":"The more autonomous is the agent decides the steps"},{"id":445,"text":"and can create the tools."},{"id":446,"text":"So that's where you might give actually access to a code editor to the agent."},{"id":447,"text":"And the agent might actually be able to ping any API in the web,"},{"id":448,"text":"perform some web search."},{"id":449,"text":"It might even be a
