called a prompt template."},{"start":1590.64,"text":"So the question is,"},{"start":1593.62,"text":"do the foundation models use a prompt template"},{"start":1596.22,"text":"or do you have to integrate it yourself?"},{"start":1598.82,"text":"So the foundation models probably use a system prompt"},{"start":1602.48,"text":"that you don't see."},{"start":1603.42,"text":"Like when actually you type on ChatGPT,"},{"start":1606.3,"text":"it is possible it's not public that open ai behind the scene has like act like a very helpful"},{"start":1613.6,"text":"assistance for this user and by the way here is your memories about your the user that we kept in"},{"start":1620.08,"text":"a database you can actually check your memories and then your prompt goes under and then the"},{"start":1625.3,"text":"generation starts so probably they're using something like that but it doesn't mean you can't"},{"start":1629.7,"text":"add one yourself so in fact if you if you think about a prompt template for for the work here"},{"start":1635.58,"text":"example, I was"},{"start":1636.97,"text":"Maybe it starts when you call OpenAI by act like a helpful assistant. And then underneath, it's like act like a great AI mentor that helps people in their career. And OpenAI's prompt template also has follow the instruction from the creator or something like that. It's possible. Questions about prompt templates? Again, I would encourage you to go and read examples of prompts. Some of them are quite thoughtful."},{"start":1664.66,"text":"Let's talk about zero-shot versus few-shot prompting."},{"start":1667.84,"text":"It came up earlier."},{"start":1669.42,"text":"Here's an example, again, going back to the categorization of product reviews."},{"start":1674.56,"text":"Let's say that we're working on a task where the prompt is classify the tone of the sentence as positive, negative, or neutral, and then you paste the review, which is the product is fine, but I was expecting more."},{"start":1691.56,"text":"if i were to survey the room i would bet that some of you would say it's negative some of you"},{"start":1697.98,"text":"would say it's neutral because you actually have a first part that is relatively positive it's fine"},{"start":1704.08,"text":"and then the second part i was expecting more which is relatively negative so where do you land"},{"start":1708.82,"text":"this can be a subjective question and maybe in one industry this would be considered amazing"},{"start":1713.84,"text":"and another one it would be considered really bad because people are used to really flourishing"},{"start":1718.5,"text":"reviews. And so the way you can actually align the model to your task is by converting that"},{"start":1724.52,"text":"zero-shot prompt. Zero-shot refers to the fact that it's not beginning given any example"}],"speech_gaps":[{"start":1583.6,"end":1585.776},{"start":1586.096,"end":1587.76}],"frame":"../frames/v057/010.webp","frame_time":1564.4},{"title":"Few-shot Prompting 和 Prompt 长度限制","segments":[{"id":178,"text":"into a few-shot prompt where the model is given in the prompt a set of examples to align it to","zh":"将其转化为一个少样本提示，模型在提示中被提供一组示例以使其对齐你想要它执行的任务","start":1729.5,"end":1736.52},{"id":179,"text":"what you want it to do. So the example here is, again, you paste the same prompt as before with","zh":"所以这里的例子是，再次，你粘贴与之前相同的提示，并加上用户评论","start":1736.52,"end":1741.56},{"id":180,"text":"the user review. And then you add, here are examples of tone classifications. This exceeded","zh":"然后你添加，这里是语气分类的示例。这超出了我的预期","start":1741.56,"end":1747.32},{"id":181,"text":"my expectation","zh":"我的期望","start":1747.32,"end":1747.9},{"id":182,"text":"completely.","zh":"完全地。","start":1747.9,"end":1748.28},{"id":183,"text":"positive it's okay but i wish it had more features negative the service was adequate neither good nor bad uh mutual now classify the tone of this sentence um you know after you've heard about these things and the model then says negative","zh":"positive 它是可以的，但我希望它有更多的功能 negative 服务是令人满意的，既不好的也不坏的 uh 双方现在分类这个句子的语气 um 你知道在你了解了这些事情之后，模型然后说 negative","start":1749.15,"end":1767.11},{"id":184,"text":"And the reason it says negative, of course, is likely because of the second example, which was, it's okay, but I wish it had more features, which we told the model that was negative. Because the model saw that it's aligned now with your expectations. Few-shot prompts are very popular.","zh":"而且它说负面的原因，当然是因为第二个例子，那个例子是可以接受的，但我希望它有更多的特征，我们告诉模型那是负面的。因为模型现在与你的期望对齐了。少样本提示非常流行。","start":1767.88,"end":1785.36},{"id":185,"text":"And in fact, for AI startups that are slightly more sophisticated, you might see them keep a prompt up to date whenever a user says something and they might have a human label it and then add it as a few shots in their relevant prompts in their code base.","zh":"事实上，对于稍微复杂一些的人工智能初创公司，你可能会看到他们在用户说出某些内容时保持提示的更新，并可能由人类进行标注，然后将其作为少量示例添加到其代码库中相关提示的few-shot部分。","start":1786.54,"end":1803.14},{"id":186,"text":"You can think of that as almost building a data set.","zh":"你可以把它看作几乎是在构建一个数据集。","start":1803.8,"end":1806.5},{"id":187,"text":"But instead of actually building a separate data set, like we've seen with supervised fine tuning and then fine tuning the model on it, you're just putting it directly in the prompts.","zh":"但你并不需要实际构建一个单独的数据集，比如我们之前在监督微调中看到的那样，然后在该数据集上微调模型，你只需将这些内容直接放入提示中。","start":1806.58,"end":1815.18},{"id":188,"text":"And it turns out it's probably faster to do that if you want to experiment quickly because you don't touch the model parameters, you just update your prompts.","zh":"如果你想要快速进行实验，这样做可能更快，因为你不需要修改模型参数，只需更新你的提示。","start":1815.18,"end":1822.98},{"id":189,"text":"And if it's text examples, you can actually concatenate so many examples in a single prompt.","zh":"如果这些是文本示例，你实际上可以在一个提示中连接许多示例。","start":1823.38,"end":1830.62},{"id":190,"text":"At some point, it will be too long and you will not have the necessary context window, but it's a pretty strong approach that is quick to align an LLM.","zh":"在某个时候，提示会变得太长，以至于你无法拥有足够的上下文窗口，但这是一个相当强大的方法，能够快速对大语言模型进行对齐。","start":1830.82,"end":1839.48},{"id":191,"text":"okay yes","zh":"好的 是的","start":1844.66,"end":1846.02},{"id":192,"text":"so question was is there any research on how long the prompt can be before the model essentially","zh":"所以问题是，是否有研究探讨提示长度达到什么程度后，模型会开始忽略指令或不再遵循指示？","start":1852.6,"end":1859.1},{"id":193,"text":"uses itself or doesn't follow instructions anymore there is uh the problem is that research","zh":"这里的问题是，有关这方面的研究","start":1859.1,"end":1865.88},{"id":194,"text":"Search is outdated every few months because models get better.","zh":"搜索结果每隔几个月就会过时，因为模型性能在不断提升。","start":1865.88,"end":1869.32},{"id":195,"text":"And so I don't know where the state-of-the-art is.","zh":"因此，我不清楚当前的最先进水平是什么。","start":1870.24,"end":1873.02},{"id":196,"text":"You can probably find it online on benchmarks.","zh":"你可能可以在基准测试的网站上找到相关信息。","start":1873.1,"end":1874.86},{"id":197,"text":"We see that... I'll give you an example.","zh":"我们看到……我会举一个例子。","start":1875.48,"end":1877.86},{"id":198,"text":"On the Workero product, you have a voice conversation","zh":"在Workero产品中，你有一个语音对话","start":1879.2,"end":1883.04},{"id":199,"text":"for some of you that have tried it,","zh":"对于一些已经尝试过它的你们，","start":1883.04,"end":1884.84},{"id":200,"text":"where you're asked, explain what is a prompt,","zh":"你会被问到，解释什么是提示（prompt）,","start":1884.92,"end":1886.86},{"id":201,"text":"and then you explain, and then there's a scoring algorithm.","zh":"然后你进行解释，然后有一个评分算法。","start":1886.98,"end":1888.72},{"id":202,"text":"We know that after eight turns, the model loses itself.","zh":"我们知道，在八轮之后，模型会失去自我。","start":1889.28,"end":1893.78},{"id":203,"text":"after eight turns because you always paste the previous user response it just starts going wild","zh":"在八轮之后，因为你总是粘贴之前的用户回复，它就开始变得失控了。","start":1893.78,"end":1900.38},{"id":204,"text":"and so the techniques we use in the background is we actually create chapters of the conversation","zh":"因此，我们在后台使用的技术是，我们实际上会将对话分成章节。","start":1900.38,"end":1905.48},{"id":205,"text":"maybe one chapter is the first eight prompt and then you actually start over from another prompt","zh":"也许一个章节是前八轮的提示，然后你实际上从另一个提示重新开始。","start":1905.48,"end":1909.44}],"notes":["本段讲解了few-shot prompting的概念，即通过在提示中加入示例来引导模型输出符合预期的结果。例如，用户输入一个评论，模型根据之前提供的语气分类示例进行分类。这表明模型能够通过示例学习任务的模式。","接着，讲者提到few-shot prompting在AI初创公司中的应用，即通过用户反馈更新提示，而不是构建独立的数据集。这种方法更快，因为它不需要调整模型参数，只需更新提示。","讲者还提到，如果提示过长，模型可能会超出上下文窗口限制，因此需要平衡提示长度和模型性能。","随后，讲者回答了一个关于提示长度限制的问题，指出目前的研究可能已经过时，因为模型性能在不断进步。因此，最新的研究结果可能需要查阅在线基准测试。","最后，讲者以Workero产品为例，说明模型在八轮对话后可能失去控制，因此需要将对话分成章节，重新开始新的提示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1729.5,"end":1909.44,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":1729.5,"text":"into a few-shot prompt where the model is given in the prompt a set of examples to align it to"},{"start":1736.52,"text":"what you want it to do. So the example here is, again, you paste the same prompt as before with"},{"start":1741.56,"text":"the user review. And then you add, here are examples of tone classifications. This exceeded"},{"start":1747.32,"text":"my expectation"},{"start":1747.9,"text":"completely."},{"start":1749.15,"text":"positive it's okay but i wish it had more features negative the service was adequate neither good nor bad uh mutual now classify the tone of this sentence um you know after you've heard about these things and the model then says negative"},{"start":1767.88,"text":"And the reason it says negative, of course, is likely because of the second example, which was, it's okay, but I wish it had more features, which we told the model that was negative. Because the model saw that it's aligned now with your expectations. Few-shot prompts are very popular."},{"start":1786.54,"text":"And in fact, for AI startups that are slightly more sophisticated, you might see them keep a prompt up to date whenever a user says something and they might have a human label it and then add it as a few shots in their relevant prompts in their code base."},{"start":1803.8,"text":"You can think of that as almost building a data set."},{"start":1806.58,"text":"But instead of actually building a separate data set, like we've seen with supervised fine tuning and then fine tuning the model on it, you're just putting it directly in the prompts."},{"start":1815.18,"text":"And it turns out it's probably faster to do that if you want to experiment quickly because you don't touch the model parameters, you just update your prompts."},{"start":1823.38,"text":"And if it's text examples, you can actually concatenate so many examples in a single prompt."},{"start":1830.82,"text":"At some point, it will be too long and you will not have the necessary context window, but it's a pretty strong approach that is quick to align an LLM."},{"start":1844.66,"text":"okay yes"},{"start":1852.6,"text":"so question was is there any research on how long the prompt can be before the model essentially"},{"start":1859.1,"text":"uses itself or doesn't follow instructions anymore there is uh the problem is that research"},{"start":1865.88,"text":"Search is outdated every few months because models get better."},{"start":1870.24,"text":"And so I don't know where the state-of-the-art is."},{"start":1873.1,"text":"You can probably find it online on benchmarks."},{"start":1875.48,"text":"We see that... I'll give you an example."},{"start":1879.2,"text":"On the Workero product, you have a voice conversation"},{"start":1883.04,"text":"for some of you that have tried it,"},{"start":1884.92,"text":"where you're asked, explain what is a prompt,"},{"start":1886.98,"text":"and then you explain, and then there's a scoring algorithm."},{"start":1889.28,"text":"We know that after eight turns, the model loses itself."},{"start":1893.78,"text":"after eight turns because you always paste the previous user response it just starts going wild"},{"start":1900.38,"text":"and so the techniques we use in the background is we actually create chapters of the conversation"},{"start":1905.48,"text":"maybe one chapter is the first eight prompt and then you actually start over from another prompt"}],"speech_gaps":[{"start":1846.704,"end":1848.432}],"frame":"../frames/v057/011.webp","frame_time":1741.5},{"title":"链式提示技术及其优势","segments":[{"id":206,"text":"you can summarize the first part of the conversation, insert the summary, and then keep going","zh":"你可以总结对话的第一部分，插入总结，然后继续进行","start":1909.44,"end":1914.74},{"id":207,"text":"those are engineering hacks that engineers might have figured out in the background","zh":"这些都是工程师可能在后台想出来的工程技术技巧","start":1914.74,"end":1918.96},{"id":208,"text":"Because eight turns makes a prompt quite long, actually.","zh":"实际上，八轮对话会让提示变得相当长","start":1920.1,"end":1923.08},{"id":209,"text":"Let's move on to chaining.","zh":"让我们继续讨论提示链","start":1929.4,"end":1931.2},{"id":210,"text":"Chaining is the most popular technique out of everything we've seen so far in prompt engineering.","zh":"在我们迄今为止看到的所有提示工程技术中，提示链是最受欢迎的技术","start":1931.64,"end":1937.68},{"id":211,"text":"It's not chain of thought.","zh":"它并不是思维链","start":1938.78,"end":1940.02},{"id":212,"text":"So chain of thought we've seen is think step by step, step one, step two, step three.","zh":"我们之前看到的思维链是逐步思考，第一步，第二步，第三步","start":1940.12,"end":1943.64},{"id":213,"text":"Do not skip any step.","zh":"不要跳过任何一步","start":1943.68,"end":1944.62},{"id":214,"text":"This is different.","zh":"这有所不同。","start":1944.86,"end":1945.7},{"id":215,"text":"This is chaining complex prompt to improve performance, and this is what it looks like.","zh":"这是将复杂提示链起来以提高性能，这就是它的样子。","start":1945.7,"end":1951.26},{"id":216,"text":"You take a single step prompt, such as read this customer review and write a professional response that acknowledges their concern, explains the issue, offers a resolution, and then you paste the customer review, which is I ordered a laptop. It arrived three days late. The packaging was damaged. Very disappointing. I needed that urgently for work. And then the output is an email that is immediately given to you by the LLM after it reads the prompt.","zh":"你先写一个单步提示，例如：阅读这条客户评论并撰写一封专业的回复，承认他们的关切，解释问题，提供解决方案。然后你将客户评论粘贴进去，例如：我订购了一台笔记本电脑。它迟到了三天。包装受损。非常令人失望。我急需这台电脑用于工作。然后输出是一封电子邮件，LLM在读完提示后立即给你。","start":1953.03,"end":1981.63},{"id":217,"text":"um so this might work but it might be hard to control you know because","zh":"嗯，这可能有效，但可能难以控制，你知道的","start":1983.01,"end":1990.67},{"id":218,"text":"Think about it. There's multiple steps that you have listed and everything is embedded in the same prompt. And if you wanted to debug step by step and know which step is weaker, you couldn't. You would have everything mixed together. So one advantage of chaining is you would separate the prompts so that you can debug them separately. And it will also lead to an easier manner to improve your workflow. Let's say a first prompt is extract the key issues.","zh":"想一想。你列出的步骤有很多，而所有内容都嵌入在同一个提示中。如果你想逐步调试并知道哪一步较弱，就无法做到。你会把所有内容混在一起。因此，链式提示的一个优势是你能够将提示分开，从而分别进行调试。这也会使改进工作流程变得更加容易。例如，第一个提示是提取关键问题。","start":1991.18,"end":2020.02},{"id":219,"text":"Identify the key concerns mentioned in this customer review. Paste the customer review. Second prompt, using these issues, so you paste back the issues, draft an outline for a professional response that acknowledges concerns, explains possible reasons, and offer a resolution. So this is not, you know, prompt number three, write the full response. So using the outline, write the professional response. And then you get your final output.","zh":"识别这条客户评论中提到的关键关切。粘贴客户评论。第二个提示，使用这些问题，所以你将问题粘贴回去，起草一封专业回复的提纲，承认关切，解释可能的原因，并提供解决方案。所以这不是，你知道的，第三个提示，撰写完整的回复。所以使用提纲，撰写专业回复。然后你得到最终输出。","start":2020.46,"end":2052.69},{"id":220,"text":"So in theory, you can tell me, oh, the second approach is better than the first one at first. But what you can notice is that we can actually test those three prompts separately from each other and determine if we will get the most gains out of...","zh":"因此，理论上你可以告诉我，第二种方法一开始比第一种方法更好。但你能注意到的是，我们实际上可以将这三个提示彼此分开进行测试，并确定我们能从……获得最大的收益","start":2054.28,"end":2069.88},{"id":221,"text":"uh engineering the first prompt optimizing it or the second one or the third one we now have","zh":"嗯，工程化第一个提示进行优化，还是第二个提示或第三个提示，我们现在有了","start":2070.43,"end":2076.45},{"id":222,"text":"three prompts that are independent from each other and you know maybe if uh the outline was better","zh":"三个相互独立的提示，你可能如果大纲更好一些的话","start":2076.45,"end":2082.41}],"notes":["本段讲解了链式提示技术（chaining）的概念，指出它与链式思维（chain of thought）不同。链式提示是将复杂的提示拆分成多个独立的步骤，以便于调试和优化。例如，可以将客户评论处理分为提取关键问题、起草大纲、撰写完整回复三个步骤。","链式提示的优势在于可以独立测试每个步骤，从而更容易识别和改进薄弱环节。例如，可以分别测试提取关键问题、起草大纲和撰写完整回复这三个步骤，以确定哪个步骤对整体性能提升最大。","在实际应用中，链式提示可以提高工作流的效率，因为每个步骤都可以独立优化。例如，可以先优化提取关键问题的步骤，再优化起草大纲的步骤，最后优化撰写完整回复的步骤。","链式提示的实施需要将每个步骤的输出作为下一个步骤的输入，从而形成一个连贯的工作流程。例如，提取关键问题的输出可以作为起草大纲的输入，起草大纲的输出可以作为撰写完整回复的输入。","链式提示的实施需要考虑每个步骤的独立性和连贯性，以确保最终输出的质量。例如，如果提取关键问题的步骤不够准确，可能会影响后续步骤的输出质量。","链式提示的实施还可以帮助识别和解决潜在的问题。例如，如果某个步骤的输出质量不高，可以通过独立测试该步骤来识别问题并进行优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1909.44,"end":2082.41,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":1909.44,"text":"you you can summarize the first part of the conversation insert the summary and then keep"},{"start":1914.74,"text":"going you know those are engineering hacks that engineers might have figured out in the background"},{"start":1920.1,"text":"Because eight turns makes a prompt quite long, actually."},{"start":1929.4,"text":"Let's move on to chaining."},{"start":1931.64,"text":"Chaining is the most popular technique out of everything we've seen so far in prompt engineering."},{"start":1938.78,"text":"It's not chain of thought."},{"start":1940.12,"text":"So chain of thought we've seen is think step by step, step one, step two, step three."},{"start":1943.68,"text":"Do not skip any step."},{"start":1944.86,"text":"This is different."},{"start":1945.7,"text":"This is chaining complex prompt to improve performance, and this is what it looks like."},{"start":1953.03,"text":"You take a single step prompt, such as read this customer review and write a professional response that acknowledges their concern, explains the issue, offers a resolution, and then you paste the customer review, which is I ordered a laptop. It arrived three days late. The packaging was damaged. Very disappointing. I needed that urgently for work. And then the output is an email that is immediately given to you by the LLM after it reads the prompt."},{"start":1983.01,"text":"um so this might work but it might be hard to control you know because"},{"start":1991.18,"text":"Think about it. There's multiple steps that you have listed and everything is embedded in the same prompt. And if you wanted to debug step by step and know which step is weaker, you couldn't. You would have everything mixed together. So one advantage of chaining is you would separate the prompts so that you can debug them separately. And it will also lead to an easier manner to improve your workflow. Let's say a first prompt is extract the key issues."},{"start":2020.46,"text":"Identify the key concerns mentioned in this customer review. Paste the customer review. Second prompt, using these issues, so you paste back the issues, draft an outline for a professional response that acknowledges concerns, explains possible reasons, and offer a resolution. So this is not, you know, prompt number three, write the full response. So using the outline, write the professional response. And then you get your final output."},{"start":2054.28,"text":"So in theory, you can tell me, oh, the second approach is better than the first one at first. But what you can notice is that we can actually test those three prompts separately from each other and determine if we will get the most gains out of..."},{"start":2070.43,"text":"uh engineering the first prompt optimizing it or the second one or the third one we now have"},{"start":2076.45,"text":"three prompts that are independent from each other and you know maybe if uh the outline was better"}],"speech_gaps":[],"frame":"../frames/v057/012.webp","frame_time":1921.44},{"title":"链式提示：用中间结果定位问题，也要考虑延迟","start":2082.41,"end":2261.6,"segments":[{"id":223,"text":"um the performance of uh the email the email how much it will the open rate will be or the user","zh":"嗯，邮件的性能，邮件的打开率会是多少，或者用户满意度会如何","start":2082.41,"end":2089.97},{"id":224,"text":"satisfaction on the response will actually get higher you know and so chaining improves performance","zh":"实际上用户的满意度会提高，所以链式提示能提升性能","start":2089.97,"end":2096.61},{"id":225,"text":"But most importantly, it helps you control your workflow and debug it more seamlessly.","zh":"但最重要的是，它能帮助你更好地控制工作流程并更无缝地进行调试。","start":2096.61,"end":2101.77},{"id":226,"text":"Yes?","zh":"是吗？","start":2103.65,"end":2104.33},{"id":227,"text":"So, if we know that the three problems independently work very well,","zh":"所以，如果我们知道这三个问题各自都能很好地工作，","start":2105.05,"end":2110.57},{"id":228,"text":"if we combine them into one problem, and we highlight that,","zh":"如果我们把它们合并成一个问题，并突出这一点，","start":2110.77,"end":2114.59},{"id":229,"text":"and by that, we get a separate policy, or do we still have to do that breakdown?","zh":"通过这样做，我们能得到一个独立的策略，还是说我们仍然需要进行这种分解？","start":2114.61,"end":2123.33},{"id":230,"text":"So, let me try to rephrase.","zh":"所以，让我试着重新表述。","start":2124.45,"end":2126.13},{"id":231,"text":"You say, let's say we look at the first prompt, which has all three tasks built in that prompt.","zh":"你说，比如说我们看一下第一个提示，这个提示已经包含了三个任务。","start":2126.13,"end":2131.55},{"id":232,"text":"What exactly do you mean?","zh":"你具体是什么意思？","start":2133.73,"end":2135.17},{"id":233,"text":"You mean like if we evaluate the output and we measure some user insight, satisfaction, etc.","zh":"你是说如果我们评估输出，并且测量一些用户洞察、满意度等。","start":2135.23,"end":2139.95},{"id":234,"text":"Why don't we just modify that prompt and essentially see how it improves user satisfaction?","zh":"为什么我们不直接修改这个提示，然后看看它如何提升用户满意度？","start":2141.55,"end":2146.49},{"id":235,"text":"Yeah, it's not going to be a three-step process.","zh":"是的，这不会是一个三步流程。","start":2147.19,"end":2149.01},{"id":236,"text":"I see, I see. Why do we need the three steps?","zh":"我明白了，我明白了。为什么我们需要三个步骤？","start":2150.53,"end":2152.89},{"id":237,"text":"Yeah. I mean, think about it. The intermediate output is what you want to see.","zh":"是的。我的意思是，想想看。中间的输出是你想要看到的。","start":2152.89,"end":2157.55},{"id":238,"text":"Like, if I'm debugging the first approach, the way I would do it is I would capture user insights. Like, here's the email. How good was the response? Thumbs up, thumbs down.","zh":"比如说，如果我在调试第一个方法，我所做的就是捕捉用户洞察。比如，这里有一封邮件。这个回复有多好？点赞，点踩。","start":2158.14,"end":2168.8},{"id":239,"text":"Was your issue resolved? Thumbs up, thumbs down. Those would tell me how good is my prompt. And I can engineer that prompt, optimize it, and I would probably drive some gains. But I will not be able easily to trace back to what the problem was. While in the second approach, not only I can use the end-to-end metrics to improve my process, I can also use the intermediate steps. For example, if I look at prompt two and I look at the outline and I see the outline is actually meh, it's not great. Then I think I can get a lot","zh":"你的问题解决了吗？点赞，点踩。这些会告诉我我的提示效果如何。我可以优化这个提示，进而可能获得一些提升。但我不容易追溯到问题到底出在哪里。而在第二种方法中，我不仅可以使用端到端的指标来改进我的流程，还可以使用中间步骤。例如，如果我查看提示二并查看大纲，我发现大纲其实一般，不是很好。然后我想我可以从中获得很多提升。或者大纲其实非常好，但最后一个提示在将其转化为面向客户的邮件时表现不佳。因此，大纲正是我希望LLM执行的，但将其转化为客户邮件的翻译却不理想。事实上，它没有遵循我们内部的术语。那么我知道第三个提示是我能获得最多提升的地方。这就是它允许我做的事情。有中间步骤可供审查。","start":2170.09,"end":2199.27},{"id":240,"text":"of gains out of the outline. Or the outline is actually really good, but the last prompt doesn't do a good job at translating it into an email. So the outline is exactly what I want the LLM to do, but the translation in a customer-facing email is not good. In fact, it doesn't follow our vocabulary internally. Then I know the third prompt is where I would get the most gains. So that's what it allows me to do. Have intermediate steps to review.","zh":"从大纲中获取收益。或者大纲实际上非常好，但最后一个提示在将其转化为电子邮件时做得不好。因此，大纲正是我希望LLM执行的内容，但将其转化为面向客户的电子邮件时表现不佳。事实上，它没有遵循我们内部的术语。那么我知道第三个提示是我能获得最多收益的地方。这就是它允许我做的事情。通过中间步骤进行审查。","start":2199.37,"end":2225.15},{"id":241,"text":"We'll talk about it. Are there any latency concerns? Yes.","zh":"在某些应用中，你不希望使用链式提示，或者不希望使用很长的链式提示，因为这会增加延迟。","start":2229.74,"end":2232.42},{"id":242,"text":"In certain applications, you don't want to use a chain or you don't want to use a long chain because it adds latency.","zh":"在某些应用中，你不希望使用链式提示，或者不希望使用长链式提示，因为这会增加延迟。","start":2233.1,"end":2240.42},{"id":243,"text":"We'll talk about that later. Good point.","zh":"实际上，这就是链式复杂提示的外观。","start":2242.0,"end":2243.68},{"id":244,"text":"So practically, this is what chaining complex prompts look like.","zh":"你有一个第一个提示，执行第一个任务。","start":2244.82,"end":2248.88},{"id":245,"text":"You have your first prompt with your first task.","zh":"输出被粘贴到第二个提示中，第二个任务被定义。","start":2249.18,"end":2251.52},{"id":246,"text":"The output is pasted in the second prompt with the second task being defined.","zh":"输出被粘贴在第二个提示中，第二个任务被定义。","start":2251.68,"end":2256.68},{"id":247,"text":"find the output is then pasted into the third prompt with the third task being defined and so","zh":"找到的输出然后被粘贴到第三个提示中，第三个任务被定义并如此进行","start":2256.68,"end":2261.6}],"notes":["讲者用邮件回复任务说明链式提示的价值：除了可能改善最终回复表现，更重要的是让工作流可观察，方便定位问题。学生问：既然三个任务能放在一个提示里，为什么还要拆成三步？","只看最终结果，也可以通过用户反馈来优化提示，例如回复是否有帮助、问题是否得到解决。但这些端到端反馈不容易指出错误发生在哪个环节。拆成多步后，可以直接查看中间结果，逐段判断。","例如，大纲本身不好，就优先优化生成大纲的提示；如果大纲已经合适，而最终邮件没有很好地表达大纲内容，或者没有采用公司需要的用词，就优先改进第三步。这是讲者强调的“能看见中间输出”带来的调试优势。","链式调用也会增加延迟，因此有些应用不适合使用长链。这里的取舍是可观察性、调试便利和最终任务表现，与额外调用带来的延迟之间的平衡；本段没有给出适用于所有应用的固定结论。","操作上，前一个提示的输出会作为下一步的输入，再由下一步承担自己的子任务。讲者预告会在后续继续讨论延迟问题。"],"formulas":[],"diagram":"none","uncertainties":[],"asr_flags":[],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":2082.41,"text":"um the performance of uh the email the email how much it will the open rate will be or the user"},{"start":2089.97,"text":"satisfaction on the response will actually get higher you know and so chaining improves performance"},{"start":2096.61,"text":"But most importantly, it helps you control your workflow and debug it more seamlessly."},{"start":2103.65,"text":"Yes?"},{"start":2105.05,"text":"So, if we know that the three problems independently work very well,"},{"start":2110.77,"text":"if we combine them into one problem, and we highlight that,"},{"start":2114.61,"text":"and by that, we get a separate policy, or do we still have to do that breakdown?"},{"start":2124.45,"text":"So, let me try to rephrase."},{"start":2126.13,"text":"You say, let's say we look at the first prompt, which has all three tasks built in that prompt."},{"start":2133.73,"text":"What exactly do you mean?"},{"start":2135.23,"text":"You mean like if we evaluate the output and we measure some user insight, satisfaction, etc."},{"start":2141.55,"text":"Why don't we just modify that prompt and essentially see how it improves user satisfaction?"},{"start":2147.19,"text":"Yeah, it's not going to be a three-step process."},{"start":2150.53,"text":"I see, I see. Why do we need the three steps?"},{"start":2152.89,"text":"Yeah. I mean, think about it. The intermediate output is what you want to see."},{"start":2158.14,"text":"Like, if I'm debugging the first approach, the way I would do it is I would capture user insights. Like, here's the email. How good was the response? Thumbs up, thumbs down."},{"start":2170.09,"text":"Was your issue resolved? Thumbs up, thumbs down. Those would tell me how good is my prompt. And I can engineer that prompt, optimize it, and I would probably drive some gains. But I will not be able easily to trace back to what the problem was. While in the second approach, not only I can use the end-to-end metrics to improve my process, I can also use the intermediate steps. For example, if I look at prompt two and I look at the outline and I see the outline is actually meh, it's not great. Then I think I can get a lot"},{"start":2199.37,"text":"of gains out of the outline. Or the outline is actually really good, but the last prompt doesn't do a good job at translating it into an email. So the outline is exactly what I want the LLM to do, but the translation in a customer-facing email is not good. In fact, it doesn't follow our vocabulary internally. Then I know the third prompt is where I would get the most gains. So that's what it allows me to do. Have intermediate steps to review."},{"start":2229.74,"text":"We'll talk about it. Are there any latency concerns? Yes."},{"start":2233.1,"text":"In certain applications, you don't want to use a chain or you don't want to use a long chain because it adds latency."},{"start":2242.0,"text":"We'll talk about that later. Good point."},{"start":2244.82,"text":"So practically, this is what chaining complex prompts look like."},{"start":2249.18,"text":"You have your first prompt with your first task."},{"start":2251.68,"text":"The output is pasted in the second prompt with the second task being defined."},{"start":2256.68,"text":"find the output is then pasted into the third prompt with the third task being defined and so"}],"speech_gaps":[],"frame":"../frames/v057/013.webp","frame_time":2094.41},{"title":"测试提示与自动化评估方法","segments":[{"id":248,"text":"on that's what it looks like in practice. Super, we'll talk more later about testing your prompts","zh":"这就是在实践中看起来的样子。很好，我们之后会更详细地讨论如何测试你的提示","start":2261.6,"end":2274.48},{"id":249,"text":"but there are methods now to do it and we will see later in this lecture with our case study how","zh":"但现在已经有方法可以做到这一点，我们稍后在本节课的案例研究中会看到","start":2274.48,"end":2279.68},{"id":250,"text":"how we can test our prompts.","zh":"我们如何测试我们的提示。","start":2279.68,"end":2281.74},{"id":251,"text":"But here is an example of how you might do it.","zh":"但这里有一个你如何进行测试的例子。","start":2282.06,"end":2286.54},{"id":252,"text":"You might have a summarization workflow prompt that is the baseline.","zh":"你可能会有一个基础的摘要工作流程提示。","start":2287.58,"end":2295.26},{"id":253,"text":"It's a single prompt.","zh":"它是一个单一的提示。","start":2295.46,"end":2296.94},{"id":254,"text":"You might have a refined summarization, which is a modified prompt of this,","zh":"你可能会有一个改进的摘要，这是对这个提示的修改版本，","start":2297.28,"end":2302.02},{"id":255,"text":"or a workflow with a chain.","zh":"或者是一个包含提示链的工作流程。","start":2302.14,"end":2304.6},{"id":256,"text":"You know, and then you have your test case, which is the inputs that you want to summarize, let's say, and then you have the generated outputs and you can have humans go and.","zh":"你知道，然后你有一个测试用例，也就是你想要总结的输入，接着你有生成的输出，然后你可以让人去。","start":2304.6,"end":2316.88},{"id":257,"text":"these outputs and you would notice that the baseline is better or worse than the refined prompt. Of course, this manual approach takes time, but it's a good way to start and usually the advice is","zh":"这些输出，你会注意到基线表现是更好还是更差，与优化后的提示相比。当然，这种手动方法需要时间，但它是一个很好的开始方式，通常建议","start":2317.71,"end":2331.53},{"id":258,"text":"get hands-on at the beginning because you will quickly notice some issues and it will give you better intuition on what tweaks can lead to better performance. However, if you wanted to scale that system across many products, many parts of your code base, you might want to find a way to do that automatically without asking humans to review and grade summaries. One approach is to use","zh":"在开始时亲自动手，因为你会很快发现一些问题，并且这会给你更好的直觉，了解哪些调整可以带来更好的性能。然而，如果你想要将这个系统扩展到许多产品、代码库的许多部分，你可能需要找到一种方法，无需让人类评审和评分摘要。一种方法是使用","start":2331.99,"end":2354.11},{"id":259,"text":"you know platforms like at porcaria we our team uses a platform called prompt food that allows you to actually automate part of this testing. In a nutshell, what it does is it can allow you to run the same prompts with five different llms immediately put everything in a table that makes it super easy for a human to grade. Let's say, or alternatively it might allow you to define define llm judges","zh":"你知道像Porcaria这样的平台，我们团队使用了一个名为Prompt Food的平台，它允许你自动化部分测试。简而言之，它的作用是允许你运行相同的提示，使用五个不同的LLM，立即将所有内容放入表格中，这使得人类评分变得非常容易。例如，或者另一种方式是它可能允许你定义LLM评审员","start":2354.67,"end":2381.89},{"id":260,"text":"LLM judges can come in different flavors. For example, I can have an LLM judge that does a pairwise comparison. So what the LLM is asked to do is here are two summaries. Just tell me which one is better than the other one.","zh":"LLM评审员可以有不同的类型。例如，我可以有一个LLM评审员进行成对比较。所以LLM被要求做的事情是，这里有两个摘要，只需告诉我哪一个比另一个更好。","start":2383.28,"end":2396.18},{"id":261,"text":"That's what the LLM does. And that can be used as a proxy for how good the summarization baseline versus the refined version is. Another way to do an LLM judge is if you do it for a single answer grading. So here's a summary graded from one to five.","zh":"这就是LLM所做的。这可以作为衡量摘要基线与优化版本好坏的代理。另一种方式是使用单个答案评分的LLM评审员。例如，这里有一个从1到5评分的摘要。","start":2397.2,"end":2413.02},{"id":262,"text":"And then you can go even deeper and do a reference-guided pairwise comparison. Or you add also a rubric. You say a five is when a summary is below 100 characters. I'm just making up. Below 100 characters mentions at least three key points that are distinct and starts with a first sentence that displays the overview and then goes into detail. That's a great summary number, five out of five. Zero is...","zh":"然后你可以更深入地进行参考引导的成对比较。或者你也可以添加一个评分标准。你说，5分是当摘要长度低于100个字符时。我随便说的。低于100个字符提到了至少三个不同的关键点，并且以第一句话展示概述，然后进入细节。这是一个很棒的摘要，5分满分。0分是...","start":2414.1,"end":2439.88}],"notes":["本段讲解了如何测试提示（prompt）的性能，包括手动测试和自动化测试方法。手动测试涉及使用基线提示和改进后的提示进行比较，通过人工评估生成的输出来判断效果。这种方法虽然耗时，但能帮助开发者快速发现问题并获得对提示调整的直觉。","在手动测试的基础上，如果需要在多个产品和代码库中扩展系统，可以考虑自动化测试方法。例如，使用像Prompt Food这样的平台，可以自动运行多个大型语言模型（LLMs）并生成结果表格，便于人工评估。此外，还可以定义LLM法官（LLM judges）来自动评估生成的摘要。","LLM法官可以采用不同的方式，如成对比较（pairwise comparison）或单个答案评分（single answer grading）。成对比较要求LLM判断两个摘要中哪个更好，而单个答案评分则要求LLM对摘要进行1到5分的评分。","还可以进一步细化评估方法，例如引入参考指南（reference-guided pairwise comparison）或评分标准（rubric）。评分标准可以包括摘要长度、是否包含关键点、是否以概述句开头等，从而更系统地评估摘要质量。","在实际应用中，评分标准可以是任意的，例如将5分定义为摘要长度低于100字符、包含至少三个关键点、以概述句开头等。这种评分方式可以为评估提供更明确的依据。","本段强调了在开发过程中尽早进行手动测试的重要性，以及如何通过自动化工具扩展测试范围，从而提高效率和准确性。"],"formulas":[],"uncertainties":["porcaria","define define llm judges"],"diagram":"none","start":2261.6,"end":2439.88,"asr_flags":[248],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":2261.6,"text":"on that's what it looks like in practice super we'll talk more later about testing your prompts"},{"start":2274.48,"text":"but there are methods now to do it and we will see later in this lecture with our case study how"},{"start":2279.68,"text":"how we can test our prompts."},{"start":2282.06,"text":"But here is an example of how you might do it."},{"start":2287.58,"text":"You might have a summarization workflow prompt that is the baseline."},{"start":2295.46,"text":"It's a single prompt."},{"start":2297.28,"text":"You might have a refined summarization, which is a modified prompt of this,"},{"start":2302.14,"text":"or a workflow with a chain."},{"start":2304.6,"text":"You know, and then you have your test case, which is the inputs that you want to summarize, let's say, and then you have the generated outputs and you can have humans go and."},{"start":2317.71,"text":"these outputs and you would notice that the baseline is better or worse than the refined prompt of course this manual approach takes time but it's a good way to start and usually the advice is"},{"start":2331.99,"text":"get hands-on at the beginning because you will quickly notice some issues and it will give you better intuition on what tweaks can lead to better performance. However, if you wanted to scale that system across many products, many parts of your code base, you might want to find a way to do that automatically without asking humans to review and grade summaries. One approach is to use"},{"start":2354.67,"text":"you know platforms like at porcaria we our team uses a platform called prompt food that allows you to actually automate part of this testing in a nutshell what it does is it can allow you to run the same prompts with five different llms immediately put everything in a table that makes it super easy for a human to grade let's say or alternatively it might allow you to define define llm judges"},{"start":2383.28,"text":"LLM judges can come in different flavors. For example, I can have an LLM judge that does a pairwise comparison. So what the LLM is asked to do is here are two summaries. Just tell me which one is better than the other one."},{"start":2397.2,"text":"That's what the LLM does. And that can be used as a proxy for how good the summarization baseline versus the refined version is. Another way to do an LLM judge is if you do it for a single answer grading. So here's a summary graded from one to five."},{"start":2414.1,"text":"And then you can go even deeper and do a reference-guided pairwise comparison. Or you add also a rubric. You say a five is when a summary is below 100 characters. I'm just making up. Below 100 characters mentions at least three key points that are distinct and starts with a first sentence that displays the overview and then goes into detail. That's a great summary number, five out of five. Zero is..."}],"speech_gaps":[],"frame":"../frames/v057/014.webp","frame_time":2273.6},{"title":"避免微调：提示工程的优势与局限","segments":[{"id":263,"text":"The LLM failed to summarize and actually was very verbose, let's say. And so you put a rubric behind it, and you have an LLM as just finding the rubric. Of course, you can now pair different techniques. You can do a few shots for the rubric. You can actually give examples of 5 out of 5s, 4 out of 4s, 3 out of 3s, because now you know multiple techniques. Okay? Does that make sense? Yeah.","zh":"大型语言模型未能进行总结，实际上非常冗长，可以说。因此，你可以在其背后设置一个评分标准，让大型语言模型仅仅负责找到这个评分标准。当然，你现在可以将不同的技术进行组合。你可以为评分标准进行几次示例提示。你实际上可以给出5分中的5分、4分中的4分、3分中的3分的例子，因为现在你掌握了多种技术。明白了吗？这样是否合理？是的。","start":2440.23,"end":2467.44},{"id":264,"text":"Okay, so that was the second section on prompt engineering or the first line of optimization. Now, let's say you've exhausted all your chances for prompt engineering and you're thinking about actually touching the model, modifying its weights or fine-tuning it, in other words. I was telling you I'm not a fan of fine-tuning. There's a few reasons why.","zh":"好的，这就是关于提示工程的第二部分，或者说是优化的第一步。现在，假设你已经用尽了所有提示工程的可能性，你开始考虑实际修改模型，调整其权重或进行微调，换句话说。我告诉过你我不太喜欢微调。有几个原因。","start":2467.92,"end":2492.28},{"id":265,"text":"It requires substantial labeled data, typically to fine-tune, although now there are approaches that are getting better at fine-tuning that look more like few-shot prompting, actually, than fine-tuning. It's sort of merging, although one modifies the weight, the other doesn't modify the weights.","zh":"通常需要大量的标记数据来进行微调，尽管现在有一些方法在微调方面表现得越来越像少样本提示，实际上而不是传统的微调。它在某种程度上正在融合，虽然一种方法修改权重，另一种方法则不修改权重。","start":2495.4,"end":2518.8},{"id":266,"text":"losing their general purpose utility. So you might fine-tune a model and actually when someone asks a pretty generic question, it doesn't do well anymore. It might do well on your task. So it might be relevant or not. And then it's time and cost intensive. That's my main problem. And at Workera, we steer away from fine-tuning as much as possible because by the time you're done fine-tuning your model, the next model is out and it's actually beating your fine-tuned version of the previous model.","zh":"因此，你可能会微调一个模型，但当有人提出一个相当通用的问题时，它可能表现不佳。它可能在你的任务上表现良好。因此，它可能相关或不相关。此外，这需要大量的时间和成本。这是我的主要问题。在Workera，我们尽可能避免微调，因为当你完成模型微调后，下一个模型已经发布，并且实际上已经超越了你微调过的上一个模型。","start":2520.3,"end":2548.86},{"id":267,"text":"So I would steer away from fine-tuning as much as you can. The advantage of the prompt engineering methods we've seen is you can put the next best pre-trained model directly in your code. It will update everything immediately. Fine-tuning doesn't work like that. There are advantages, though, where it still makes sense. If the task requires repeated high-precision outputs, such as legal, scientific explanation, and if the general-purpose LLM struggles with domain-specific language.","zh":"因此，我建议你尽可能避免微调。我们之前看到的提示工程技术的优势在于，你可以直接将下一个最佳预训练模型放入你的代码中。它会立即更新所有内容。微调并不是这样运作的。不过，在某些情况下，微调仍然有意义。如果任务需要重复的高精度输出，例如法律解释或科学解释，而通用的大型语言模型在领域特定语言上表现不佳。","start":2549.46,"end":2578.64},{"id":268,"text":"So let's look at a quick example together, which is an example from Ross Lazarewicz. I think it was a couple of years ago, September 23, where Ross...","zh":"因此，让我们一起看一个快速的例子，这个例子来自Ross Lazarewicz。我想是在几年前的9月23日左右，Ross……","start":2579.37,"end":2593.45},{"id":269,"text":"uh tried to do slack fine tuning so he looked at a lot of slack messages within his company and he was like i'm going to fine tune a model that speaks like us or operates like us because this is how we work right this is the data that represents how people work at the company","zh":"他尝试进行微调，因此他查看了公司内部大量的Slack消息，并想，我要微调一个能像我们说话或运作的模型，因为这就是我们工作的方式，这就是代表公司员工工作方式的数据","start":2596.99,"end":2612.53}],"notes":["本段讨论了微调模型的局限性，包括需要大量标注数据、可能丧失通用性以及时间和成本高昂的问题。讲者指出，微调模型在面对通用问题时可能表现不佳，而微调后的模型可能很快被更新的模型所超越。","讲者提到，微调模型可能会过度适应特定数据，导致其在新任务上表现不佳。此外，微调过程需要大量时间和计算资源，这在实际应用中可能不具成本效益。","讲者以Ross Lazarewicz的例子说明了微调的潜在问题。他尝试对Slack消息进行微调，以使模型更贴近公司内部的沟通方式，但这种方法可能无法适应更广泛的场景。","讲者强调，提示工程方法相比微调具有优势，因为可以直接使用预训练模型，无需重新训练，从而节省时间和资源。然而，微调在某些需要高精度输出的领域（如法律和科学解释）仍然有其适用性。","讲者指出，微调模型可能无法适应快速变化的环境，因为新模型的发布可能使微调后的模型迅速过时。因此，讲者建议尽可能避免微调，除非任务对精度要求极高。","讲者提到，微调模型可能会过度适应特定数据，导致其在新任务上表现不佳。此外，微调过程需要大量时间和计算资源，这在实际应用中可能不具成本效益。"],"formulas":[],"uncertainties":["losing their general purpose utility"],"diagram":"none","start":2440.23,"end":2612.53,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2440.23,"text":"The LLM failed to summarize and actually was very verbose, let's say. And so you put a rubric behind it, and you have an LLM as just finding the rubric. Of course, you can now pair different techniques. You can do a few shots for the rubric. You can actually give examples of 5 out of 5s, 4 out of 4s, 3 out of 3s, because now you know multiple techniques. Okay? Does that make sense? Yeah."},{"start":2467.92,"text":"Okay, so that was the second section on prompt engineering or the first line of optimization. Now, let's say you've exhausted all your chances for prompt engineering and you're thinking about actually touching the model, modifying its weights or fine-tuning it, in other words. I was telling you I'm not a fan of fine-tuning. There's a few reasons why."},{"start":2495.4,"text":"It requires substantial labeled data, typically to fine-tune, although now there are approaches that are getting better at fine-tuning that look more like few-shot prompting, actually, than fine-tuning. It's sort of merging, although one modifies the weight, the other doesn't modify the weights. Fine-tuned models may also overfeed to specific data. We're going to see a funny example, actually."},{"start":2520.3,"text":"losing their general purpose utility. So you might fine-tune a model and actually when someone asks a pretty generic question, it doesn't do well anymore. It might do well on your task. So it might be relevant or not. And then it's time and cost intensive. That's my main problem. And at Workera, we steer away from fine-tuning as much as possible because by the time you're done fine-tuning your model, the next model is out and it's actually beating your fine-tuned version of the previous model."},{"start":2549.46,"text":"So I would steer away from fine-tuning as much as you can. The advantage of the prompt engineering methods we've seen is you can put the next best pre-trained model directly in your code. It will update everything immediately. Fine-tuning doesn't work like that. There are advantages, though, where it still makes sense. If the task requires repeated high-precision outputs, such as legal, scientific explanation, and if the general-purpose LLM struggles with domain-specific language."},{"start":2579.37,"text":"So let's look at a quick example together, which is an example from Ross Lazarewicz. I think it was a couple of years ago, September 23, where Ross..."},{"start":2596.99,"text":"uh tried to do slack fine tuning so he looked at a lot of slack messages within his company and he was like i'm going to fine tune a model that speaks like us or operates like us because this is how we work right this is the data that represents how people work at the company"}],"speech_gaps":[],"frame":"../frames/v057/015.webp","frame_time":2452.23},{"title":"增强LLM应用中的挑战与RAG","segments":[{"id":270,"text":"And so he actually went ahead and fine-tuned the model, gave it a prompt like, hey, write a, you know, he was delegating to the model, write a 500 word blog post on prompt engineering. And the model responded, I shall work on that in the morning. And then he tries to push the model a little further and say, it's morning now. And the model said, I'm writing right now, it's 6.30 a.m. here.","zh":"于是他实际上继续对模型进行了微调，并给了它一个提示，比如：嘿，写一篇关于提示工程的500字博客文章。他是在将任务委托给模型。模型回应说，我将在早上处理这件事。然后他试图进一步推动模型，说现在已经是早上了。模型回答说，我正在写，这里现在是早上6点30分。","start":2614.0,"end":2641.74},{"id":271,"text":"Write it now. Okay. Please. Okay, I shall write it now. I actually don't know what you would like me to say about prompt engineering. I can only describe the process. The only thing that comes to mind for a headline is how do we build prompts.","zh":"现在就写吧。好的。请。好的，我现在就写。实际上，我不确定你希望我如何谈论提示工程。我只能描述这个过程。关于标题，唯一想到的是我们如何构建提示。","start":2642.82,"end":2656.2},{"id":272,"text":"You know, it's kind of a funny example for fine-tuning because it's true that it went wrong. Like he was supposed to think like, I want the model to speak like us at work. And it ended up acting like people and not actually following instructions. So one example why I would steer away from fine-tuning. Super.","zh":"你知道，这是一个有趣的微调例子，因为它确实出了问题。他本应让模型像我们在工作中那样思考，希望模型能像我们一样说话。但结果却表现得像人一样，而没有遵循指示。因此，这就是我倾向于远离微调的一个例子。","start":2657.1,"end":2683.75},{"id":273,"text":"Let's talk about RAGs. RAGs is important. It's important to know out there and at least having the basics. It's a very common interview question, by the way. If you go interview for a job, they might ask you to explain in a nutshell to a five-year-old what is a RAG. And hopefully after that, you'll be able to do it. So we've seen some of the challenges with standalone LLMs.","zh":"让我们谈谈RAG。RAG非常重要。了解它很重要，至少掌握基础知识。顺便说一句，这也是一个常见的面试问题。如果你去面试工作，他们可能会问你，用一句话向一个五岁的孩子解释什么是RAG。希望在那之后，你能够做到这一点。我们已经看到一些独立LLM的挑战。","start":2687.77,"end":2710.05},{"id":274,"text":"Those challenges include the context window being small, the fact that it's hard to remember details within a large context window, knowledge gaps, you know, cutoff dates you mentioned earlier.","zh":"这些挑战包括上下文窗口较小，难以在较大的上下文窗口中记住细节，知识缺口，比如你之前提到的截止日期。","start":2710.9,"end":2723.94},{"id":275,"text":"The model might be trained up to a date and then it cannot follow the trends or be up to date.","zh":"模型可能只训练到某个日期，之后就无法跟踪趋势或保持最新。","start":2724.12,"end":2728.2},{"id":276,"text":"Hallucinations.","zh":"幻觉。","start":2729.46,"end":2729.94},{"id":277,"text":"There are some fields, think about medical diagnosis, where hallucinations are very costly.","zh":"在某些领域，比如医学诊断，幻觉会造成非常严重的后果。","start":2730.28,"end":2735.14},{"id":278,"text":"You can't afford a hallucination.","zh":"你承担不起幻觉带来的后果。","start":2735.28,"end":2736.5},{"id":279,"text":"Even in education, imagine deploying a model for the U.S. youth education and it hallucinates and","zh":"即使在教育领域，想象一下部署一个模型用于美国青少年教育，而该模型产生了幻觉，","start":2736.5,"end":2744.26},{"id":280,"text":"it teaches millions of people something completely wrong, it's a problem and then lack of sources","zh":"它会教导数百万人一些完全错误的信息，这将是一个问题，同时缺乏来源","start":2744.26,"end":2749.98},{"id":281,"text":"a lot of fields love sources, research fields love sources, education love sources, legal","zh":"很多领域都重视来源，研究领域重视来源，教育领域重视来源，法律领域也重视来源，","start":2749.98,"end":2758.16},{"id":282,"text":"loves sources as well, and so the pre-trained LLM doesn't do a good job to source and in fact if you","zh":"因此，预训练的LLM在引用来源方面表现不佳，事实上，如果你","start":2758.16,"end":2766.04},{"id":283,"text":"If you have tried to find sources on a plain LLM, it actually hallucinates a lot.","zh":"如果你尝试在普通的LLM上查找来源，它实际上会产生大量幻觉。","start":2766.04,"end":2771.24},{"id":284,"text":"It makes up research papers.","zh":"它会编造研究论文。","start":2771.34,"end":2772.62},{"id":285,"text":"It just lists completely fakes.","zh":"它只是列出完全虚假的内容。","start":2772.78,"end":2774.78},{"id":286,"text":"So how do we solve that? With a RAG. RAG integrates with external knowledge sources, databases, documents, APIs. It ensures that...","zh":"那么我们如何解决这个问题呢？通过RAG（检索增强生成）。RAG可以与外部知识源、数据库、文档、API集成。它确保了...","start":2776.01,"end":2788.53}],"notes":["本段讨论了微调LLM时可能出现的问题，例如模型未能遵循指令，而是表现出类似人类的行为。这表明微调可能不是最佳选择，尤其是在需要严格遵循指令的场景中。","RAG（检索增强生成）被介绍为解决LLM局限性的方法，特别是在需要外部知识和来源的领域。RAG通过整合外部知识源，如数据库、文档和API，确保生成的内容更加准确。","LLM在知识更新和来源引用方面存在挑战，例如知识截止日期和幻觉问题。这些问题在医疗诊断、教育和法律等对准确性要求高的领域尤为严重。","幻觉问题可能导致严重后果，例如在教育中误导大量学生。因此，RAG被提出作为解决这些问题的方案。","RAG通过引入外部知识源，帮助模型在生成内容时引用可靠的信息，从而减少幻觉和知识过时的问题。","RAG的应用不仅限于特定领域，而是适用于需要准确信息和来源引用的广泛场景，如研究、教育和法律等。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2614.0,"end":2788.53,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":2614.0,"text":"And so he actually went ahead and fine tuned the model, gave it a prompt like, hey, write a, you know, he was delegating to the model, write a 500 word blog post on prompt engineering. And the model responded, I shall work on that in the morning. And then he tries to push the model a little further and say, it's morning now. And the model said, I'm writing right now, it's 6.30 a.m. here."},{"start":2642.82,"text":"Write it now. Okay. Please. Okay, I shall write it now. I actually don't know what you would like me to say about prompt engineering. I can only describe the process. The only thing that comes to mind for a headline is how do we build prompts."},{"start":2657.1,"text":"You know, it's kind of a funny example for fine tuning because it's true that it went wrong. Like he was supposed to think like, I want the model to speak like us at work. And it ended up acting like people and not actually following instructions. So one example why I would steer away from fine tuning. Super."},{"start":2687.77,"text":"Let's talk about rags. Rags is important. It's important to know out there and at least having the basics. It's a very common interview question, by the way. If you go interview for a job, they might ask you to explain in a nutshell to a five-year-old what is a rag. And hopefully after that, you'll be able to do it. So we've seen some of the challenges with standalone LLMs."},{"start":2710.9,"text":"Those challenges include the context window being small, the fact that it's hard to remember details within a large context window, knowledge gaps, you know, cutoff dates you mentioned earlier."},{"start":2724.12,"text":"The model might be trained up to a date and then it cannot follow the trends or be up to date."},{"start":2729.46,"text":"Hallucinations."},{"start":2730.28,"text":"There are some fields, think about medical diagnosis, where hallucinations are very costly."},{"start":2735.28,"text":"You can't afford a hallucination."},{"start":2736.5,"text":"even in education imagine deploying a model for the u.s youth education and it hallucinates and"},{"start":2744.26,"text":"it teaches millions of people something completely wrong it's a problem and then lack of sources"},{"start":2749.98,"text":"a lot of fields love sources research fields love sources education love sources legal"},{"start":2758.16,"text":"loves sources as well and so the pre-trained llm doesn't do a good job to source and in fact if you"},{"start":2766.04,"text":"If you have tried to find sources on a plain LLM, it actually hallucinates a lot."},{"start":2771.34,"text":"It makes up research papers."},{"start":2772.78,"text":"It just lists completely fakes."},{"start":2776.01,"text":"So how do we solve that? With a RAG. RAG integrates with external knowledge sources, databases, documents, APIs. It ensures that..."}],"speech_gaps":[],"frame":"../frames/v057/016.webp","frame_time":2626.0},{"title":"RAG 技术与向量数据库","segments":[{"id":287,"text":"answers are more accurate, up-to-date, and grounded because you can actually update your document. Your drive is always up-to-date. I mean, ideally, you're always pushing new documents to it. And when you query, what is our Q4 performance in sales? Hopefully, there is the last board deck in the drive and it can read the last board deck.","zh":"答案更加准确、最新且有依据，因为你可以实际更新你的文档。你的驱动始终是最新的。我的意思是，理想情况下，你一直在向其中推送新文档。当你查询时，例如，我们的第四季度销售业绩如何？希望驱动中存在最新的董事会简报，并且可以读取最新的董事会简报。","start":2789.23,"end":2808.79},{"id":288,"text":"And more developer control. We'll see why rags allow for targeted customization without actually requiring the retraining of the model. In fact, you don't touch the model with rags.","zh":"此外还有更多的开发者控制权。我们将看到，RAG 允许进行有针对性的定制，而无需实际重新训练模型。事实上，在 RAG 中你不会触碰模型本身。","start":2810.4,"end":2820.9},{"id":289,"text":"It's really a technique that is put on top of the model. So to see an example of a rag, this is a question answering application where we're in the medical field and a user is asking a query, what are the side effects of drug X?","zh":"这是一种放在模型之上的技术。为了看一个 RAG 的例子，这是一个问答应用，我们处于医疗领域，用户提出一个查询，例如，药物 X 的副作用有哪些？","start":2821.35,"end":2840.27},{"id":290,"text":"This is an important question. You can't hallucinate. You need to source. You need to be up to date. Maybe there is a new update to that drug that is now in the database and you need to read that. A rag is a great example of what you would want to use here.","zh":"这是一个重要问题。你不能编造答案。你需要引用来源。你需要保持最新。也许该药物有新的更新，现在已存入数据库，你需要读取这些信息。RAG 是一个在这里你想要使用的绝佳例子。","start":2842.09,"end":2857.33},{"id":291,"text":"The way it works is you have your knowledge base of a bunch of documents. What you do is you use an embedding to embed those documents into lower dimensional representations. So, for example, if the document is a PDF, a long PDF, you might...","zh":"其工作方式是，你有一个包含大量文档的知识库。你所做的就是使用嵌入将这些文档转换为低维表示。例如，如果文档是一个长 PDF，你可能会……","start":2857.99,"end":2876.39},{"id":292,"text":"you know read the pdf understand it and then embed it we've seen plenty of embedding approaches","zh":"你知道读取 PDF、理解它，然后进行嵌入，我们已经见过很多种嵌入方法","start":2876.78,"end":2881.84},{"id":293,"text":"together triplet loss etc you remember so imagine one of them here for llms is embedding those","zh":"比如三元组损失等，你记得，所以想象其中一个在这里用于大语言模型，是将这些文档嵌入到低维表示中","start":2881.84,"end":2888.76},{"id":294,"text":"documents into lower representation if the representation is too small you will lose","zh":"如果表示太小，你会丢失信息","start":2888.76,"end":2895.14},{"id":295,"text":"information if it's too big you will add latency right it's a trade um you will store typically","zh":"如果信息太大，你将会增加延迟，对吧，你通常会存储这些表示。","start":2895.14,"end":2903.24},{"id":296,"text":"those representations into a database","zh":"将这些表示存储到一个数据库中。","start":2903.24,"end":2905.28},{"id":297,"text":"those representations into a database","zh":"将这些表示存储到一个数据库中。","start":2905.92,"end":2907.06},{"id":298,"text":"called a vector","zh":"称为向量。","start":2907.06,"end":2909.14},{"id":299,"text":"database. There's a lot of vector","zh":"数据库。有很多向量数据库提供商。","start":2909.14,"end":2911.26},{"id":300,"text":"database providers out there.","zh":"数据库提供商。","start":2914.04,"end":2915.16},{"id":301,"text":"I think","zh":"我认为","start":2915.16,"end":2917.04},{"id":302,"text":"I've listed a couple that are","zh":"我已经列出了一些。","start":2917.04,"end":2919.12},{"id":303,"text":"very common. No, I haven't listed, but I can","zh":"非常常见。不，我还没有列出，但我可以","start":2919.12,"end":2921.3},{"id":304,"text":"database is essentially storing those vectors","zh":"数据库本质上是在存储这些向量","start":2921.3,"end":2923.16},{"id":305,"text":"database is essentially storing those vectors","zh":"数据库本质上是在存储这些向量","start":2923.16,"end":2925.1},{"id":306,"text":"in a very efficient manner, allowing the","zh":"以一种非常高效的方式，允许进行","start":2925.1,"end":2926.06},{"id":307,"text":"fast retrieval","zh":"快速检索","start":2926.8,"end":2928.4},{"id":308,"text":"with a certain distance metric.","zh":"使用某种距离度量。","start":2928.96,"end":2931.04},{"id":309,"text":"embed, usually with the same algorithm, the user prompts, and you run a retrieval process,","zh":"嵌入，通常使用相同的算法，对用户提示进行嵌入，并运行检索过程，","start":2931.04,"end":2938.56},{"id":310,"text":"embed, usually with the same algorithm, the user prompts, and you run a retrieval process,","zh":"嵌入，通常使用相同的算法，对用户提示进行嵌入，并运行检索过程，","start":2938.86,"end":2945.56},{"id":311,"text":"which is essentially saying, based on the embedding from the user query and the vector","zh":"这实际上是在说，基于用户查询的嵌入和向量数据库，找到那些嵌入之间的距离相关的文档。","start":2945.56,"end":2950.58},{"id":312,"text":"database, find the relevant documents based on the distance between those embeddings.","zh":"根据用户查询和向量数据库中的嵌入之间的距离，找到相关的文档。","start":2951.32,"end":2956.02},{"id":313,"text":"user query with a system prompt or a prompt template on top.","zh":"用户查询可以结合一个系统提示或一个提示模板进行处理。","start":2956.02,"end":2960.1},{"id":314,"text":"So the prompt template can be answer user query based on list of documents.","zh":"因此，提示模板可以是基于文档列表来回答用户查询。","start":2960.1,"end":2967.44}],"notes":["本段讲解了RAG（检索增强生成）技术的基本原理，强调其在需要准确、最新和基于证据回答的问题中的重要性，例如医疗领域的药物副作用查询。RAG通过将文档嵌入到低维表示中，并使用向量数据库进行高效检索，从而实现对用户查询的精准回答。","在RAG中，文档和用户查询都会被嵌入到向量空间中，通过计算嵌入之间的距离来找到最相关的文档。这种技术允许在不重新训练模型的情况下进行定制化，从而提高回答的准确性和时效性。","向量数据库是RAG的关键组成部分，它以高效的方式存储和检索嵌入向量。数据库支持基于特定距离度量（如余弦相似度）的快速检索，这使得RAG能够在大规模文档集合中快速找到相关信息。","RAG的流程包括：文档嵌入、用户查询嵌入、向量数据库检索、相关文档检索、将检索到的文档与用户查询结合生成最终答案。这种流程确保了回答的准确性和可追溯性。","在实际应用中，RAG可以用于各种需要基于最新数据和证据进行回答的场景，例如医疗、金融和法律领域。它避免了模型的幻觉问题，确保回答基于真实数据。","RAG的实现涉及多个步骤，包括文档预处理、嵌入生成、向量数据库构建、检索和生成。这些步骤需要仔细设计和优化，以确保系统的效率和准确性。"],"formulas":[],"uncertainties":["the representation is too small you will lose","if it's too big you will add latency right it's a trade um you will store typically"],"diagram":"none","start":2789.23,"end":2967.44,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":2789.23,"text":"answers are more accurate, up-to-date, and grounded because you can actually update your document. Your drive is always up-to-date. I mean, ideally, you're always pushing new documents to it. And when you query, what is our Q4 performance in sales? Hopefully, there is the last board deck in the drive and it can read the last board deck."},{"start":2810.4,"text":"And more developer control. We'll see why rags allow for targeted customization without actually requiring the retraining of the model. In fact, you don't touch the model with rags."},{"start":2821.35,"text":"It's really a technique that is put on top of the model. So to see an example of a rag, this is a question answering application where we're in the medical field and a user is asking a query, what are the side effects of drug X?"},{"start":2842.09,"text":"This is an important question. You can't hallucinate. You need to source. You need to be up to date. Maybe there is a new update to that drug that is now in the database and you need to read that. A rag is a great example of what you would want to use here."},{"start":2857.99,"text":"The way it works is you have your knowledge base of a bunch of documents. What you do is you use an embedding to embed those documents into lower dimensional representations. So, for example, if the document is a PDF, a long PDF, you might..."},{"start":2876.78,"text":"you know read the pdf understand it and then embed it we've seen plenty of embedding approaches"},{"start":2881.84,"text":"together triplet loss etc you remember so imagine one of them here for llms is embedding those"},{"start":2888.76,"text":"documents into lower representation if the representation is too small you will lose"},{"start":2895.14,"text":"information if it's too big you will add latency right it's a trade um you will store typically"},{"start":2903.24,"text":"those representations into a database"},{"start":2905.92,"text":"called a vector"},{"start":2907.06,"text":"database. There's a lot of vector"},{"start":2909.14,"text":"database providers out there."},{"start":2914.04,"text":"I think"},{"start":2915.16,"text":"I've listed a couple that are"},{"start":2917.04,"text":"very common. No, I haven't listed, but I can"},{"start":2919.12,"text":"share afterwards. A vector"},{"start":2921.3,"text":"database is essentially storing those vectors"},{"start":2923.16,"text":"in a very efficient manner, allowing the"},{"start":2925.1,"text":"fast retrieval"},{"start":2926.8,"text":"with a certain distance metric."},{"start":2928.96,"text":"What you do is you also"},{"start":2931.04,"text":"embed, usually with the same algorithm, the user prompts, and you run a retrieval process,"},{"start":2938.86,"text":"which is essentially saying, based on the embedding from the user query and the vector"},{"start":2945.56,"text":"database, find the relevant documents based on the distance between those embeddings."},{"start":2951.32,"text":"Once you've found the relevant documents, you pull them, and then you add them to the"},{"start":2956.02,"text":"user query with a system prompt or a prompt template on top."},{"start":2960.1,"text":"So the prompt template can be answer user query based on list of documents."}],"speech_gaps":[{"start":2911.66,"end":2913.64}],"frame":"../frames/v057/017.webp","frame_time":2801.23},{"title":"增强LLM应用中的检索增强生成（RAG）技术","segments":[{"id":315,"text":"If answered not in the document, say, I don't know. That's your prompt template where the user query is pasted, the documents are pasted, and then your output should be what you want because it's now grounded in the document. You can also add to this prompt template, tell me the exact page, chapter, line of the document that was relevant, and in fact, link it as well, just to be more precise. Any question on rags?","zh":"如果答案不在文档中，就说，我不知道。这就是你的提示模板，用户查询被粘贴进去，文档也被粘贴进去，然后你的输出应该是你想要的，因为它现在基于文档。你也可以添加到这个提示模板中，告诉我文档中相关的确切页面、章节和行号，并且实际上还可以链接起来，以更加精确。有任何关于RAG的问题吗？","start":2968.99,"end":2999.39},{"id":316,"text":"is a simple vanilla rag yeah yes","zh":"这是一个简单的原始RAG，是的，是的","start":2999.94,"end":3004.63},{"id":317,"text":"Question is, do the document embeddings still retain information of the location of the information within that document, especially in big documents? Great question. We'll get to it in a second. Because you're right that the vanilla rag might not do a good job with very large documents. So let's say, you know, when you open a medication box and you have this gigantic white paper with all the information and it's...","zh":"问题是，文档嵌入是否仍然保留了信息在文档中的位置信息，尤其是在大文档中？这是一个好问题。我们稍后会讲到。因为你说得对，原始RAG可能在处理非常大的文档时表现不佳。比如说，当你打开一个药品盒子，里面有一张巨大的白纸，包含所有信息，它……","start":3011.7,"end":3037.88},{"id":318,"text":"very long, maybe a vanilla rag would not cut it. So what people have figured out is a bunch of techniques to improve rags. And in fact, chunking is a great technique that is very popular. So you might actually store in the vector database the embedding of the full documents. And on top of that, you will also store a chapter level vector. And when you retrieve, you retrieve the document, you retrieve the chapter, and that allows you to be more precise with the sourcing. It's one example.","zh":"非常长，也许原始RAG就不太够用了。所以人们已经想出了一系列技术来改进RAG。事实上，分块（chunking）是一种非常流行且有效的技术。你可能会在向量数据库中存储完整文档的嵌入，同时还会存储章节级别的向量。当你检索时，你检索文档，也检索章节，这允许你更精确地进行引用。这是一个例子。","start":3038.26,"end":3065.9},{"id":319,"text":"Another technique that's popular is HIDE, hypothetical document embeddings, where a group of researchers published a paper showing that","zh":"另一种流行的技术是HIDE（假设文档嵌入），一组研究人员发表了一篇论文，显示了","start":3067.02,"end":3080.3},{"id":320,"text":"When you get your user query, one of the main problems is the user query actually does not look like your documents. For example, the user query might be, what are the side effects of drug X, when actually in the vector database, the vector represents very long documents. So how do you guarantee that the vector embedding is going to be close to the document embedding? What they do is they use the user query to generate a fake, hallucinated document.","zh":"当你获得用户的查询时，最主要的问题是用户的查询实际上并不像你的文档。例如，用户的查询可能是，药物X的副作用是什么，而实际上在向量数据库中，向量代表的是非常长的文档。那么你如何保证向量嵌入会接近文档嵌入？他们所做的就是使用用户的查询生成一个假的、幻觉的文档。","start":3081.06,"end":3108.66},{"id":321,"text":"They embed that document, and then they compare it to the vector in the vector database. Does that make sense? So, for example, the user says, what is the side effect of drug X? There's a prompt that this is given to another prompt that says, based on this user query, generates five-page reports answering the user query. It generates...","zh":"他们将该文档进行嵌入，然后将其与向量数据库中的向量进行比较。这有意义吗？例如，用户问，药物X的副作用是什么？有一个提示被提供给另一个提示，该提示说明：基于此用户查询，生成五页的报告来回答用户的问题。它会生成……","start":3109.71,"end":3132.52},{"id":322,"text":"potentially a completely fake answer, you embed that and it will be closer to the document that you're looking for likely.","zh":"可能会生成一个完全虚假的答案，你将该答案进行嵌入，它会更接近你所寻找的文档。","start":3132.86,"end":3141.92}],"notes":["本段讨论了检索增强生成（RAG）技术在处理大型文档时的局限性，特别是当用户查询与文档内容不匹配时的问题。讲者指出，传统的RAG可能无法有效处理非常大的文档，因此需要改进技术，如分块（chunking）和HIDE方法。","讲者提到，分块是一种流行的改进技术，通过在向量数据库中存储文档和章节级别的向量，可以提高检索的精确性。这允许在检索时同时获取文档和章节信息，从而更准确地定位信息来源。","HIDE方法涉及使用用户查询生成一个假文档，然后将其嵌入并与向量数据库中的文档进行比较。这种方法可以解决用户查询与文档内容不匹配的问题，从而提高检索的准确性。","讲者以药物副作用的查询为例，说明了如何通过生成假文档来匹配用户查询，并将其嵌入以找到相关的文档。这种方法可以提高检索的效率和准确性。","讲者强调，生成假文档的过程可能会产生完全虚假的答案，但通过嵌入和比较，可以找到与用户查询相关的文档。这种方法在处理大型文档时特别有用。","讲者指出，这种方法需要在向量数据库中存储文档和章节级别的向量，并在检索时同时获取这些信息，以提高检索的精确性和效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2968.99,"end":3141.92,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2968.99,"text":"If answered not in the document, say, I don't know. That's your prompt template where the user query is pasted, the documents are pasted, and then your output should be what you want because it's now grounded in the document. You can also add to this prompt template, tell me the exact page, chapter, line of the document that was relevant, and in fact, link it as well, just to be more precise. Any question on rags?"},{"start":2999.94,"text":"is a simple vanilla rag yeah yes"},{"start":3011.7,"text":"Question is, do the document embeddings still retain information of the location of the information within that document, especially in big documents? Great question. We'll get to it in a second. Because you're right that the vanilla rag might not do a good job with very large documents. So let's say, you know, when you open a medication box and you have this gigantic white paper with all the information and it's..."},{"start":3038.26,"text":"very long, maybe a vanilla rag would not cut it. So what people have figured out is a bunch of techniques to improve rags. And in fact, chunking is a great technique that is very popular. So you might actually store in the vector database the embedding of the full documents. And on top of that, you will also store a chapter level vector. And when you retrieve, you retrieve the document, you retrieve the chapter, and that allows you to be more precise with the sourcing. It's one example."},{"start":3067.02,"text":"Another technique that's popular is HIDE, hypothetical document embeddings, where a group of researchers published a paper showing that"},{"start":3081.06,"text":"When you get your user query, one of the main problems is the user query actually does not look like your documents. For example, the user query might be, what are the side effects of drug X, when actually in the vector database, the vector represents very long documents. So how do you guarantee that the vector embedding is going to be close to the document embedding? What they do is they use the user query to generate a fake, hallucinated document."},{"start":3109.71,"text":"They embed that document, and then they compare it to the vector in the vector database. Does that make sense? So, for example, the user says, what is the side effect of drug X? There's a prompt that this is given to another prompt that says, based on this user query, generates five-page reports answering the user query. It generates..."},{"start":3132.86,"text":"potentially a completely fake answer, you embed that and it will be closer to the document that you're looking for likely."}],"speech_gaps":[],"frame":"../frames/v057/018.webp","frame_time":2980.99},{"title":"增强LLM应用：从单任务到自主工作流","segments":[{"id":323,"text":"It's one example of a rag approach. Again, the purpose of this lecture is not to go through all these three and explain you every single method that has been discovered for rags, but I just wanted to show you how much research has been done between 2020 and 2025 in rags and how many branches of research you now have that you can learn from. The survey paper is linked in the slides, by the way, and I'll share them after the lecture. Super.","zh":"这是一个检索增强（RAG）方法的例子。再次强调，本节课的目的并不是逐一讲解这三种方法以及所有为RAG发现的单个技术，我只是想向你们展示从2020年到2025年间在RAG领域进行了多少研究，以及你现在可以学习的多少研究分支。顺便说一下，综述论文在幻灯片中已链接，我将在课程结束后分享它们。超级棒。","start":3144.94,"end":3178.18},{"id":324,"text":"So we've made some progress. Hopefully now you feel like if you were to start an LLM application, you know how to do better prompts, you know how to do chains, you know how to do fine tuning. You also know how to do retrieval. And you have the baggage of techniques that you can go and read and find the code base, pull the code, vibe code it, but you have the breadth now.","zh":"我们已经取得了一些进展。希望现在你们觉得，如果要开始一个LLM应用，你们知道如何编写更好的提示，知道如何构建提示链，知道如何进行微调，也知道如何进行检索。你们还掌握了各种技术，可以去阅读相关资料，找到代码库，拉取代码，理解代码，但你们现在有了更广的视野。","start":3182.72,"end":3202.66},{"id":325,"text":"The next set of topics we're going to see is around the question of how could we extend the capabilities of LLMs from performing single tasks enhanced with external knowledge to handling multi-step autonomous workflows. And this is where we get into proper agentic AI. So let's talk about agentic AI workflows towards autonomous and specialized systems.","zh":"接下来我们将探讨的问题是，我们如何将LLM的能力从执行单任务并结合外部知识扩展到处理多步骤的自主工作流。这就是我们进入正则代理AI（proper agentic AI）的领域。让我们讨论代理AI工作流，以实现自主和专门化的系统。","start":3206.23,"end":3234.94},{"id":326,"text":"Then we'll talk about evals. Then we'll see multi-agent systems. And we'll end with a little thoughts on what's next in AI. So Andrew Ng actually coined the term agentic AI workflows. And his reason was that a lot of companies use, say, agents, agents, agents everywhere, agents everywhere.","zh":"然后我们将讨论评估（evals）。接着我们将看到多代理系统。最后，我们将简要思考一下AI的未来方向。实际上，Andrew Ng提出了“代理AI工作流”这一术语。他的理由是，很多公司使用诸如“代理”、“代理”、“代理”无处不在，到处都是代理。","start":3236.04,"end":3263.55},{"id":327,"text":"If you go and work at these companies, you will notice that they mean very different things by agent. Some people actually have a prompt and they call it an agent. Other people, they have a very complex multi-agency system, they call it an agent. And so calling everything an agent doesn't do it justice. So Andrew says, let's call it agentic workflows. Because in practice, it's a bunch of prompts with tools.","zh":"如果你去这些公司工作，你会发现他们所说的“代理”含义非常不同。有些人实际上只是有一个提示，他们称之为代理；其他人则拥有非常复杂的多代理系统，他们也称之为代理。因此，将一切称为代理并不能准确表达其含义。因此，Andrew说，让我们称之为“代理工作流”（agentic workflows）。因为在实践中，它是一系列提示与工具的组合。","start":3264.63,"end":3289.43},{"id":328,"text":"With additional resources, API calls that ultimately are put in a workflow, and you can call that workflow agentic.","zh":"通过添加额外资源、API调用，这些最终被放入一个工作流中，你可以将这个工作流称为代理的（agentic）。","start":3290.06,"end":3298.02},{"id":329,"text":"So it's all about the multi-step process to complete the task.","zh":"这全部都是关于完成任务的多步骤过程。","start":3298.34,"end":3304.18},{"id":330,"text":"Also, calling it agentic workflow allows us to not mix it up with what I called agent in the last lecture with reinforcement learning.","zh":"此外，将它称为代理工作流（agentic workflow）可以让我们避免与上一节课中我所说的强化学习中的“代理”（agent）混淆。","start":3307.12,"end":3315.06},{"id":331,"text":"Because in RL, agent has a very specific definition, interacts with an environment, passes from one state to the other, has a reward and an observation.","zh":"因为在强化学习中，智能体有一个非常明确的定义，它与环境进行交互，从一个状态转移到另一个状态，具有奖励和观测。","start":3315.06,"end":3322.72},{"id":332,"text":"You remember that chart, right?","zh":"你还记得那个图表，对吧？","start":3322.96,"end":3323.92}],"notes":["本段介绍了增强LLM应用的背景，强调了从单任务到多步骤自主工作流的转变。课程提到，研究者在2020至2025年间对RAG（检索增强生成）进行了大量研究，形成了多个研究分支。课程还提到，有一篇综述论文链接在幻灯片中，将在讲座结束后分享。","本段总结了课程中提到的LLM应用的关键技术，包括更好的提示、链式推理、微调、检索等。这些技术为学生提供了广泛的学习资源和实践基础，使他们能够找到代码库、拉取代码并进行实验。","本段引入了“代理式AI工作流”（agentic AI workflows）的概念，这是课程接下来要讨论的主题。课程指出，代理式AI工作流是将LLM的能力从单任务扩展到多步骤自主工作流的关键。","本段提到Andrew Ng提出了“代理式AI工作流”这一术语，其原因是许多公司广泛使用“代理”（agent）一词，但其含义却各不相同。Andrew认为，使用“代理式工作流”更准确，因为其本质上是一系列带有工具的提示。","本段强调了“代理式工作流”与强化学习中的“代理”（agent）概念的区别。在强化学习中，代理有明确的定义，包括与环境交互、状态转移、奖励和观察等。","本段提到课程中曾展示过一张图表，但未提供具体内容。这可能与后续讨论有关，但未在当前片段中展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3144.94,"end":3323.92,"asr_flags":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":3144.94,"text":"It's one example of a rag approach. Again, the purpose of this lecture is not to go through all these three and explain you every single method that has been discovered for rags, but I just wanted to show you how much research has been done between 2020 and 2025 in rags and how many branches of research you now have that you can learn from. The survey paper is linked in the slides, by the way, and I'll share them after the lecture. Super."},{"start":3182.72,"text":"So we've made some progress. Hopefully now you feel like if you were to start an LLM application, you know how to do better prompts, you know how to do chains, you know how to do fine tuning. You also know how to do retrieval. And you have the baggage of techniques that you can go and read and find the code base, pull the code, vibe code it, but you have the breadth now."},{"start":3206.23,"text":"The next set of topics we're going to see is around the question of how could we extend the capabilities of LLMs from performing single tasks enhanced with external knowledge to handling multi-step autonomous workflows. And this is where we get into proper agentic AI. So let's talk about agentic AI workflows towards autonomous and specialized systems."},{"start":3236.04,"text":"Then we'll talk about evals. Then we'll see multi-agent systems. And we'll end with a little thoughts on what's next in AI. So Andrew Ng actually coined the term agentic AI workflows. And his reason was that a lot of companies use, say, agents, agents, agents everywhere, agents everywhere."},{"start":3264.63,"text":"If you go and work at these companies, you will notice that they mean very different things by agent. Some people actually have a prompt and they call it an agent. Other people, they have a very complex multi-agency system, they call it an agent. And so calling everything an agent doesn't do it justice. So Andrew says, let's call it agentic workflows. Because in practice, it's a bunch of prompts with tools."},{"start":3290.06,"text":"With additional resources, API calls that ultimately are put in a workflow, and you can call that workflow agentic."},{"start":3298.34,"text":"So it's all about the multi-step process to complete the task."},{"start":3307.12,"text":"Also, calling it agentic workflow allows us to not mix it up with what I called agent in the last lecture with reinforcement learning."},{"start":3315.06,"text":"Because in RL, agent has a very specific definition, interacts with an environment, passes from one state to the other, has a reward and an observation."},{"start":3322.96,"text":"You remember that chart, right?"}],"speech_gaps":[],"frame":"../frames/v057/019.webp","frame_time":3156.94},{"title":"从单步提示到多步骤代理工作流的转变","segments":[{"id":333,"text":"So here's an example of how we move from a one-step prompt to a multi-step agentic workflow.","zh":"那么，这里有一个如何从单步提示转变为多步骤代理工作流的例子。","start":3328.2,"end":3334.76},{"id":334,"text":"Let's say a user queries a product.","zh":"假设用户查询一个产品。","start":3335.76,"end":3340.72},{"id":335,"text":"What is your refund policy on a chatbot?","zh":"你们对聊天机器人的退款政策是什么？","start":3340.92,"end":3343.28},{"id":336,"text":"and the response","zh":"并得到一个响应","start":3343.28,"end":3345.02},{"id":337,"text":"using a rag","zh":"使用RAG","start":3345.02,"end":3346.44},{"id":338,"text":"says","zh":"说","start":3346.44,"end":3346.96},{"id":339,"text":"refunds are available","zh":"退款是可用的","start":3346.96,"end":3348.16},{"id":340,"text":"within 30 days","zh":"在30天内","start":3348.16,"end":3349.14},{"id":341,"text":"of purchase","zh":"购买","start":3349.14,"end":3349.7},{"id":342,"text":"and maybe the rag","zh":"也许还有rag","start":3349.7,"end":3350.58},{"id":343,"text":"can even look","zh":"甚至可以查看","start":3350.58,"end":3351.36},{"id":344,"text":"linked to the policy.","zh":"与策略相关联。","start":3351.36,"end":3352.12},{"id":345,"text":"That's what we learned so far. Instead, an agenting workflow can function like this. The user says, can I get a refund for my order? And the response via...","zh":"这就是我们到目前为止所学到的。相反，一个代理工作流可以像这样运作。用户说，我可以为我的订单申请退款吗？并且通过...","start":3353.39,"end":3365.15},{"id":346,"text":"The agentic workflow is the agent retrieves the refund policy using a rag. The agent then follows up with the users and says, can you provide your order number? Then the agent queries an API to check the order details. And finally, it comes back to the user and confirms your order qualifies for a refund. The amount will be processed in three to five business days. This is much more thoughtful than the first version, which is sort of vanilla, right?","zh":"代理工作流是代理使用rag检索退款政策。然后代理会与用户跟进，并询问：你能提供你的订单号吗？接着代理会查询一个API来检查订单详情。最后，它会回到用户那里，并确认你的订单符合退款条件。退款金额将在三到五个工作日内处理完毕。这比第一个版本要更加周到，对吧？","start":3365.77,"end":3392.37},{"id":347,"text":"So that's what we're going to talk about in the next couple of slides, is how do we get from the first one to the second one. There are plenty of specialized agentic workflows online. You've heard, and if you hang out in SF, you probably see a bunch of billboards. AI software engineer, AI skills mentor you've interacted with in the class to work AI SDR, AI lawyers, AI...","zh":"因此，我们接下来几页将讨论的是，如何从第一个版本过渡到第二个版本。网上有很多专门的代理工作流。你可能听说过，如果你在旧金山待过，你可能看到很多广告牌。人工智能软件工程师、人工智能技能导师，你在课堂上互动过的那些人，来工作人工智能销售代表、人工智能律师、人工智能……","start":3394.0,"end":3418.96},{"id":348,"text":"specialized cloud engineer, it would be a stretch to say that everything works, but there's work being done towards that. I'm not personally a fan of putting a face behind those things. I think it's gimmicky. And I think in a few years from now, actually very few products will have a human face behind it. But it might be a marketing tactic from some startups. It's more scary than it is engaging, frankly.","zh":"专门的云工程师，说一切都能正常运作可能有些牵强，但确实有相关工作在进行。我个人不太喜欢给这些事物赋予人脸。我认为这很花哨。而且我认为在不久的将来，实际上很少有产品会有人类面孔。这可能是一些初创公司的营销策略。坦白说，这比吸引人更令人害怕。","start":3421.83,"end":3450.06},{"id":349,"text":"Okay. I want to talk about the pirating shift. That's especially useful. Let's say you're a software engineer or you're planning to be a software engineer because software engineering as a discipline is sort of shifting or at least the best engineers I've worked with are able to move from a deterministic mindset to a fuzzy mindset.","zh":"好的。我想谈谈思维转变。这尤其有用。假设你是软件工程师，或者打算成为软件工程师，因为作为一门学科，软件工程正在发生某种转变，至少我所合作过的最佳工程师能够从确定性思维转变为模糊性思维。","start":3451.79,"end":3470.97},{"id":350,"text":"and balance between the two whenever they need to get something done so here's the paradigm shift between traditional software and agent tki software the first one is the way you handle data traditional software deals with structured data you have json's you have databases they're pasted in a very structured manner in a data engineering pipeline and then they're used to be displayed on a certain interface the user might feel a form that is then retrieved and pasted in th
