知道的，我们是否被允许更新地址，","start":5240.06,"end":5246.26},{"id":520,"text":"is it a fixed data point and then draft a response email and send the email okay so we've decomposed","zh":"还是这是一个固定的数据点，然后起草回复邮件并发送邮件。好的，所以我们已经分解了这项任务。","start":5246.26,"end":5252.72},{"id":521,"text":"that task. Once you've decomposed that task, how do you design your agentic workflow?","zh":"一旦你分解了这项任务，你如何设计你的代理工作流程？","start":5252.72,"end":5261.2},{"id":522,"text":"Yes.","zh":"是的。","start":5279.48,"end":5280.2},{"id":523,"text":"exactly so to repeat i'm gonna you're gonna look at the decomposition of tasks","zh":"没错，所以我要重复一遍，你会看到任务的分解","start":5293.54,"end":5297.82},{"id":524,"text":"get an instinct of what's fuzzy what's deterministic and then determine which line","zh":"从而获得一个直觉，了解哪些部分模糊，哪些部分是确定的，然后确定哪条线","start":5298.76,"end":5305.16},{"id":525,"text":"is going to be an llm one shot which one will require maybe a rag which one will require a tool","zh":"这将是一个LLM一次性的任务，其中一项可能需要RAG，另一项可能需要工具","start":5305.16,"end":5311.88},{"id":526,"text":"which one will require memory, which one.","zh":"哪一项需要记忆，哪一项。","start":5311.88,"end":5314.56},{"id":527,"text":"So you will start designing that map completely right.","zh":"因此，你将完全开始设计这张地图。","start":5314.62,"end":5317.86},{"id":528,"text":"That's also what I would recommend.","zh":"这也是我推荐的做法。","start":5317.98,"end":5319.14},{"id":529,"text":"You might actually draft it and say,","zh":"你实际上可能会草拟它并说，","start":5319.3,"end":5321.78},{"id":530,"text":"okay, I take the user prompts and...","zh":"好吧，我接收用户的提示并...","start":5321.84,"end":5324.04},{"id":531,"text":"The first step of my task decomposition was extracting information. That seems to be a vanilla LLM. You can guess that the vanilla LLM would probably be good enough at extracting.","zh":"我的任务分解的第一步是提取信息。这似乎是一个普通的LLM。你可以猜测普通的LLM在提取信息方面可能已经足够好。","start":5325.25,"end":5337.95},{"id":532,"text":"The user wants to change their address, and this is the order number, and this is the new address. You probably don't need too much technology there other than the LLM. The next step, it feels like you need a tool because you're actually going to have to look up in the database and also update the address. So that might be a tool, and you might have to build a custom tool for the LLM to say, let me connect you to that database, or let me give you access to that resource with an MCP.","zh":"用户想要更改他们的地址，这是订单号，这是新地址。你可能在那里不需要太多技术，除了LLM。下一步，感觉你可能需要一个工具，因为你实际上必须在数据库中查找并更新地址。因此，这可能是一个工具，你可能需要为LLM构建一个定制工具，例如，让我将你连接到该数据库，或者让我给你访问该资源的权限。","start":5338.66,"end":5366.1},{"id":533,"text":"After that, you probably need an LLM again to draft the email, but you would probably paste confirmation.","zh":"之后，你可能需要再次使用LLM来起草邮件，但你可能会粘贴确认信息。","start":5368.82,"end":5374.12},{"id":534,"text":"You would paste the confirmation that your address has been updated from X to Y, and then the LLM will draft an answer.","zh":"你会粘贴确认信息，说明你的地址已从X更新为Y，然后LLM将起草回复。","start":5374.62,"end":5380.32},{"id":535,"text":"And of course, just to not forget, you might need a tool to send the email.","zh":"当然，为了不忘记，你可能还需要一个工具来发送邮件。","start":5380.6,"end":5384.48},{"id":536,"text":"You might actually need to post something for the email to go out.","zh":"你实际上可能需要发布一些内容，以便邮件能够发出。","start":5385.12,"end":5392.04},{"id":537,"text":"And then you'll get the output.","zh":"然后你将得到输出结果。","start":5393.28,"end":5394.56},{"id":538,"text":"Does that make sense?","zh":"这听起来清楚吗？","start":5394.96,"end":5395.82},{"id":539,"text":"That's exactly what you described.","zh":"这正是你所描述的。","start":5395.96,"end":5397.1},{"id":540,"text":"okay now moving to the next step once we have decomposed our tasks then we have designed an","zh":"好的，现在进入下一步，一旦我们完成了任务分解，那么我们已经设计了","start":5398.02,"end":5403.84}],"notes":["本段讲解了如何将客户支持任务分解为多个步骤，并讨论了如何设计代理工作流。首先，人类客服代理会提取信息，然后在数据库中查找客户记录，检查政策，确认是否允许更新地址，然后起草并发送回复邮件。这些步骤被分解为不同的任务，以便后续设计代理流程。","接下来，讲者强调在任务分解后，需要判断哪些步骤可以由LLM一次性处理，哪些需要结合RAG（检索增强生成）或工具。例如，信息提取可能由LLM直接处理，而数据库查询和更新则需要工具支持。","讲者还提到，起草邮件可能再次使用LLM，但需要将确认信息粘贴进去。此外，发送邮件可能需要另一个工具，以确保邮件能够实际发出。","最后，讲者询问是否理解上述流程，并指出这正是学生所描述的内容，表明任务分解和代理流程设计是理解LLM应用的关键步骤。","讲者通过具体的例子，如地址更新流程，展示了如何将任务分解为多个步骤，并为每个步骤分配适当的处理方式，从而构建一个完整的代理工作流。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5227.92,"end":5403.84,"asr_flags":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":5227.92,"text":"decomposition so let's say we've done that work and we have this list i'm simplifying but the"},{"start":5233.92,"text":"customer support agent human typically would extract info then look up in the database to"},{"start":5240.06,"text":"retrieve the customer record then check the policy you know are we allowed to update the address or"},{"start":5246.26,"text":"is it a fixed data point and then draft a response email and send the email okay so we've decomposed"},{"start":5252.72,"text":"that task. Once you've decomposed that task, how do you design your agentic workflow?"},{"start":5279.48,"text":"Yes."},{"start":5293.54,"text":"exactly so to repeat i'm gonna you're gonna look at the decomposition of tasks"},{"start":5298.76,"text":"get an instinct of what's fuzzy what's deterministic and then determine which line"},{"start":5305.16,"text":"is going to be an llm one shot which one will require maybe a rag which one will require a tool"},{"start":5311.88,"text":"which one will require memory, which one."},{"start":5314.62,"text":"So you will start designing that map completely right."},{"start":5317.98,"text":"That's also what I would recommend."},{"start":5319.3,"text":"You might actually draft it and say,"},{"start":5321.84,"text":"okay, I take the user prompts and..."},{"start":5325.25,"text":"The first step of my task decomposition was extracting information. That seems to be a vanilla LLM. You can guess that the vanilla LLM would probably be good enough at extracting."},{"start":5338.66,"text":"The user wants to change their address, and this is the order number, and this is the new address. You probably don't need too much technology there other than the LLM. The next step, it feels like you need a tool because you're actually going to have to look up in the database and also update the address. So that might be a tool, and you might have to build a custom tool for the LLM to say, let me connect you to that database, or let me give you access to that resource with an MCP."},{"start":5368.82,"text":"After that, you probably need an LLM again to draft the email, but you would probably paste confirmation."},{"start":5374.62,"text":"You would paste the confirmation that your address has been updated from X to Y, and then the LLM will draft an answer."},{"start":5380.6,"text":"And of course, just to not forget, you might need a tool to send the email."},{"start":5385.12,"text":"You might actually need to post something for the email to go out."},{"start":5393.28,"text":"And then you'll get the output."},{"start":5394.96,"text":"Does that make sense?"},{"start":5395.96,"text":"That's exactly what you described."},{"start":5398.02,"text":"okay now moving to the next step once we have decomposed our tasks then we have designed an"}],"speech_gaps":[],"frame":"../frames/v057/031.webp","frame_time":5239.92},{"title":"LLM追踪与系统调试","segments":[{"id":541,"text":"agentic workflow around it, it took us five minutes in practice, it would take you more if you're","zh":"围绕它的代理工作流，我们在实践中花了五分钟，如果你是在此基础上建立创业公司，你花费的时间会更长","start":5403.84,"end":5408.5},{"id":542,"text":"building your startup on that, you want to make sure your task decomposition is accurate, your","zh":"你想要确保任务分解是准确的，这里的内容也是准确的","start":5408.5,"end":5411.78},{"id":543,"text":"thing is accurate here, and then you can have a lot of work done on every tool and optimize it","zh":"然后你可以在每个工具上完成大量工作并对其进行优化，包括延迟和成本","start":5411.78,"end":5417.32},{"id":544,"text":"and latency and cost, but let's say and now we want to know how if it works, you know, and I'm","zh":"但让我们假设现在我们想知道它是否有效，你知道的，而我会假设你拥有LLM追踪","start":5417.32,"end":5424.56},{"id":545,"text":"I'm going to assume that you have LLM traces.","zh":"LLM追踪非常重要","start":5424.56,"end":5426.98},{"id":546,"text":"LLM traces are very important.","zh":"实际上，如果你正在与一家AI初创公司面试","start":5427.34,"end":5429.06},{"id":547,"text":"Actually, if you're interviewing with an AI startup,","zh":"我建议你在面试过程中向他们提问","start":5429.48,"end":5431.58},{"id":548,"text":"I would recommend you in the interview process to ask them,","zh":"我在面试过程中建议你们询问他们，","start":5431.92,"end":5434.86},{"id":549,"text":"do you have LLM traces?","zh":"你们有LLM的追踪记录吗？","start":5435.54,"end":5436.6},{"id":550,"text":"Because if they don't have LLM traces,","zh":"因为如果他们没有LLM的追踪记录，","start":5436.84,"end":5438.48},{"id":551,"text":"it is pretty hard to debug an LLM system.","zh":"就很难调试一个LLM系统。","start":5438.76,"end":5441.44},{"id":552,"text":"Because you don't have visibility on the chain of complex prompts","zh":"因为你无法看到复杂提示调用的链条","start":5441.78,"end":5445.76},{"id":553,"text":"that were called and where the bug is.","zh":"以及错误发生的位置。","start":5445.76,"end":5447.86},{"id":554,"text":"So it's a basic sort of part of an AI startup stack","zh":"所以，这是AI初创公司技术栈中的一个基本组成部分","start":5448.82,"end":5453.68},{"id":555,"text":"stack to have LLM","zh":"技术栈中要有LLM","start":5453.68,"end":5455.38},{"id":556,"text":"traces. So let's","zh":"追踪记录。所以让我们","start":5455.38,"end":5457.46},{"id":557,"text":"assume you have traces. How would you","zh":"假设你有追踪数据。你会如何","start":5457.46,"end":5459.48},{"id":558,"text":"know if your system works?","zh":"知道你的系统是否正常运作？","start":5459.48,"end":5460.66},{"id":559,"text":"I'm going to summarize some of the things I","zh":"我将总结一些我之前听到的内容。","start":5463.42,"end":5465.44},{"id":560,"text":"heard earlier.","zh":"你给了我们一个端到端的指标例子。","start":5465.44,"end":5466.12},{"id":561,"text":"You gave us an example of","zh":"你查看用户满意度","start":5467.1,"end":5469.26},{"id":562,"text":"an end-to-end metric.","zh":"作为最终的指标。你也可以进行","start":5469.26,"end":5471.38},{"id":563,"text":"You look at the user satisfaction at the","zh":"你查看用户满意度在最后的结果。","start":5471.54,"end":5473.44},{"id":564,"text":"end. You can also do","zh":"你也可以进行","start":5473.44,"end":5475.38},{"id":565,"text":"a component-based approach where","zh":"一种基于组件的方法，","start":5475.38,"end":5477.48},{"id":566,"text":"you actually will look at the tool,","zh":"你实际上会查看工具，","start":5477.48,"end":5479.32},{"id":567,"text":"the database updates, and","zh":"数据库更新，以及","start":5479.44,"end":5481.44},{"id":568,"text":"you will manually do an","zh":"你将手动进行错误分析，并发现，哦，工具实际上总是忘记更新电子邮件。它只是","start":5481.44,"end":5483.36},{"id":569,"text":"error analysis and see, oh, the tool actually always forgets to update the email. It just","zh":"在写入方面失败了。我将修复这个问题。这几乎是确定性的。","start":5483.36,"end":5488.42},{"id":570,"text":"fails at writing. And I'm going to fix that. This is deterministic, pretty much.","zh":"或者当它尝试发送电子邮件并 ping 应该发送电子邮件的系统时，","start":5488.42,"end":5492.6},{"id":571,"text":"Or when it tries to send the email and ping the system that is supposed to send the email,","zh":"它没有以正确的格式发送。因此，它会在这一点上出现错误。同样，你可以修复这个问题。","start":5494.62,"end":5500.18},{"id":572,"text":"it doesn't send it in the right format. And so it bugs at that point. Again, you could fix that.","zh":"它没有以正确的格式发送。因此在这一点上会出现错误。同样，你可以修复这个问题。","start":5500.38,"end":5505.98},{"id":573,"text":"Draft of the email. DLLM doesn't do a great job. It's not very polite at drafting the email. So you could look at component by component and it's actually easier to debug than to look at it end to end. You probably do a mix of both. Another way to look at it is what is objective versus what is subjective. So for example, an objective example would be a DLLM extracted the wrong order ID.","zh":"电子邮件草稿。DLLM在处理电子邮件草稿方面表现不佳。它在撰写邮件时不够礼貌。因此，你可以逐个组件进行检查，实际上比整体检查更容易调试。你可能两者都会混合使用。另一种看待问题的方式是区分客观内容和主观内容。例如，一个客观的例子就是DLLM提取了错误的订单ID。","start":5507.58,"end":5533.68},{"id":574,"text":"The user said my order ID is X, and the LLM, when it actually pasted, looked up in the database, it used the wrong order ID. This is objectively wrong. You can actually write a Python code that checks that, checks just the alignment between what the user mentioned and what was actually pasted in the database or for the lookup. You also have subjective stuff, which we talked about, where you probably want to do either human rating or LLM as judges. It's very relevant for subjective.","zh":"用户说我的订单ID是X，而LLM在实际粘贴时，从数据库中查找时使用了错误的订单ID。这是明显错误的。你实际上可以编写一段Python代码来检查这一点，检查用户提到的内容与实际粘贴到数据库或用于查找的内容之间的对齐情况。你还会遇到主观性内容，我们之前讨论过，这种情况下你可能需要进行人工评分或让LLM担任评委。这在主观性内容中非常相关。","start":5534.34,"end":5562.7},{"id":575,"text":"And finally, you will find yourself having quantitative evals and more qualitative evals. So quantitative would be percentage of successful address updates. The latency, you could actually track the latency component base and see which one is the slowest.","zh":"最后，你会发现你需要进行定量评估和更定性的评估。定量评估可以是成功地址更新的百分比。延迟方面，你可以跟踪各个组件的延迟情况，并查看哪个组件最慢。","start":5564.98,"end":5581.36}],"notes":["本段讨论了在构建基于LLM的初创公司时，追踪LLM行为的重要性。讲师指出，LLM追踪是调试系统的关键，因为它提供了对复杂提示链的可见性，有助于定位错误。如果没有追踪，调试将变得非常困难。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5403.84,"end":5581.36,"asr_flags":[],"translation_complete":true,"translated_segments":35,"raw_segments":[{"start":5403.84,"text":"agentic workflow around it it took us five minutes in practice it would take you more if you're"},{"start":5408.5,"text":"building your startup on that you want to make sure your task decomposition is accurate your"},{"start":5411.78,"text":"thing is accurate here and then you can have a lot of work done on every tool and optimize it"},{"start":5417.32,"text":"and latency and cost but let's say and now we want to know how if it works you know and i'm"},{"start":5424.56,"text":"I'm going to assume that you have LLM traces."},{"start":5427.34,"text":"LLM traces are very important."},{"start":5429.48,"text":"Actually, if you're interviewing with an AI startup,"},{"start":5431.92,"text":"I would recommend you in the interview process to ask them,"},{"start":5435.54,"text":"do you have LLM traces?"},{"start":5436.84,"text":"Because if they don't have LLM traces,"},{"start":5438.76,"text":"it is pretty hard to debug an LLM system."},{"start":5441.78,"text":"Because you don't have visibility on the chain of complex prompts"},{"start":5445.76,"text":"that were called and where the bug is."},{"start":5448.82,"text":"So it's a basic sort of part of an AI startup stack"},{"start":5453.68,"text":"stack to have LLM"},{"start":5455.38,"text":"traces. So let's"},{"start":5457.46,"text":"assume you have traces. How would you"},{"start":5459.48,"text":"know if your system works?"},{"start":5463.42,"text":"I'm going to summarize some of the things I"},{"start":5465.44,"text":"heard earlier."},{"start":5467.1,"text":"You gave us an example of"},{"start":5469.26,"text":"an end-to-end metric."},{"start":5471.54,"text":"You look at the user satisfaction at the"},{"start":5473.44,"text":"end. You can also do"},{"start":5475.38,"text":"a component-based approach where"},{"start":5477.48,"text":"you actually will look at the tool,"},{"start":5479.44,"text":"the database updates, and"},{"start":5481.44,"text":"you will manually do an"},{"start":5483.36,"text":"error analysis and see, oh, the tool actually always forgets to update the email. It just"},{"start":5488.42,"text":"fails at writing. And I'm going to fix that. This is deterministic, pretty much."},{"start":5494.62,"text":"Or when it tries to send the email and ping the system that is supposed to send the email,"},{"start":5500.38,"text":"it doesn't send it in the right format. And so it bugs at that point. Again, you could fix that."},{"start":5507.58,"text":"Draft of the email. DLLM doesn't do a great job. It's not very polite at drafting the email. So you could look at component by component and it's actually easier to debug than to look at it end to end. You probably do a mix of both. Another way to look at it is what is objective versus what is subjective. So for example, an objective example would be a DLLM extracted the wrong order ID."},{"start":5534.34,"text":"The user said my order ID is X, and the LLM, when it actually pasted, looked up in the database, it used the wrong order ID. This is objectively wrong. You can actually write a Python code that checks that, checks just the alignment between what the user mentioned and what was actually pasted in the database or for the lookup. You also have subjective stuff, which we talked about, where you probably want to do either human rating or LLM as judges. It's very relevant for subjective."},{"start":5564.98,"text":"And finally, you will find yourself having quantitative evals and more qualitative evals. So quantitative would be percentage of successful address updates. The latency, you could actually track the latency component base and see which one is the slowest."}],"speech_gaps":[{"start":5461.06,"end":5462.608}],"frame":"../frames/v057/032.webp","frame_time":5415.84},{"title":"评估LLM性能与多智能体系统","segments":[{"id":576,"text":"Let's say sending the email is five seconds. It's too long, let's say. You would notice component-based or the full workflow. And then you will decide, where am I optimizing my latency and how am I going to do that? And then finally, qualitatively, you might actually do some error analysis and look at where are the hallucinations? Where are the tone mismatches?","zh":"假设发送邮件需要五秒钟。这太长了，对吧。你会注意到基于组件的或整个工作流程的问题。然后你会决定，我在哪里优化延迟，我该如何去做？最后，从定性角度来看，你可能会进行一些错误分析，看看幻觉出现在哪里？语气不匹配出现在哪里？","start":5581.8,"end":5606.66},{"id":577,"text":"Are the users confused and by what they're confused? That would be more qualitative, and typically it would take more white-glove approaches to do that. So here's what it could look like. I gave you some examples, but you would build evals to determine objectively, subjectively, component-based, end-to-end-based, and then quantitatively and qualitatively where is your LLM failing and where it's doing well.","zh":"用户是否感到困惑，他们因何而困惑？这会更加定性化，通常需要更细致的白手套式方法来完成。所以，这可能会是什么样子。我给你举了一些例子，但你会构建评估方法，以客观和主观的方式，基于组件或端到端的方式，定量和定性地判断你的LLM在哪些方面表现不佳，哪些方面表现良好。","start":5608.6,"end":5634.85},{"id":578,"text":"Does that give you a sense of the type of stuff you could do to improve that agenting workflow? Super. Well, that was our case study on evals. We're not going to delve deeper into it, but hopefully it gave you a sense of the type of stuff you can do with LLM judges, with objective, subjective, component-based, end-to-end, etc. Last section on multi-agent workflows. So you might ask,","zh":"这是否让你对可以用来改进代理工作流程的类型有了一个大致的了解？很好。这就是我们关于评估的案例研究。我们不会深入探讨它，但希望它让你对可以使用LLM法官、客观、主观、基于组件、端到端等方法进行的类型有了一个大致的了解。最后一节关于多智能体工作流程。你可能会问，","start":5638.77,"end":5666.38},{"id":579,"text":"hey, why do we need a multi-agent workflow when the workflow already has multiple steps, already calls the LLM multiple times, already gives them tools? Why do we need multiple agents? And so many people are talking about multi-agent system online. It's not even a new thing, frankly. I mean, multi-agent system has been around for a long time. The main advantage of a multi-agent system is going to be parallelism. It's like, is there something that I wish... ","zh":"嘿，为什么我们需要多智能体工作流程，当这个工作流程已经包含多个步骤，已经多次调用LLM，已经提供了工具？为什么还需要多个智能体？在线上，很多人在谈论多智能体系统。实际上，这并不是什么新东西。我的意思是，多智能体系统已经存在很长时间了。多智能体系统的主要优势将是并行性。就像，有没有什么我希望……","start":5668.19,"end":5696.21},{"id":580,"text":"I would run in parallel, sort of independently, but maybe there are some sinks in the middle. But that's where you want to put a multi-agent system. It's when it's parallel. The other advantage that some companies have with multi-agent system is an agent can be reused. So let's say in a company you have an agent that's been built for design. That agent can be used in the marketing team and it can be used in the product team.","zh":"我希望并行运行，某种程度上是独立的，但可能中间有一些瓶颈。但这就是你想要放置多智能体系统的地方。当它并行运行时。一些公司使用多智能体系统的另一个优势是智能体可以被复用。例如，在公司中，如果你有一个为设计构建的智能体，它可以被用于市场团队，也可以被用于产品团队。","start":5696.89,"end":5722.89},{"id":581,"text":"And so now you're optimizing an agent which has multiple stakeholders that can communicate with it and benefit from its performance. Actually, I'm going to ask you a question and take a few, maybe a minute to think about it. Let's say you were building smart home automation for your apartment or your home. What agents would you want to build?","zh":"现在你正在优化一个代理，它有多个利益相关者可以与之通信，并且能够从其表现中获益。实际上，我会问你一个问题，并花几分钟时间思考一下。假设你正在为你的公寓或家构建智能家居自动化系统，你会想要构建哪些代理？","start":5723.37,"end":5747.64},{"id":582,"text":"Write it down, and then I'm going to ask you in a minute to share some of the agents that you will build.","zh":"写下你的答案，然后我稍后会要求你分享你将构建的一些代理。","start":5749.56,"end":5755.68}],"notes":["本段讲解了如何通过评估来改进LLM的工作流程，包括定量和定性分析。评估可以是组件级或端到端的，用于确定LLM在哪些方面表现良好或存在问题，例如幻觉和语气不匹配。","讲者提到，用户可能对系统产生困惑，这种困惑需要通过定性分析来识别。通常需要更细致的‘白手套’方法来处理。评估可以是客观的、主观的、组件级的或端到端的，以全面了解LLM的性能。","讲者指出，多智能体系统的主要优势在于并行性。当某些任务可以并行执行时，多智能体系统可以提高效率。此外，智能体可以被复用，例如设计智能体可以被营销和产品团队使用。","讲者最后提出一个实际问题，让听众思考如何构建智能家居自动化系统中的智能体。这有助于理解多智能体系统在实际应用中的设计和优化。","讲者强调，多智能体系统并不是新概念，而是已有很长历史。其核心优势在于并行处理和智能体的复用，这在实际应用中可以带来显著的效率提升。","讲者通过提问引导听众思考如何构建智能体，这有助于加深对多智能体系统在实际场景中应用的理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5581.8,"end":5755.68,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5581.8,"text":"Let's say sending the email is five seconds. It's too long, let's say. You would notice component-based or the full workflow. And then you will decide, where am I optimizing my latency and how am I going to do that? And then finally, qualitative, you might actually do some error analysis and look at where are the hallucinations? Where are the tone mismatches?"},{"start":5608.6,"text":"Are the users confused and by what they're confused? That would be more qualitative, and typically it would take more white-glove approaches to do that. So here's what it could look like. I gave you some examples, but you would build evals to determine objectively, subjectively, component-based, end-to-end-based, and then quantitatively and qualitatively where is your LLM failing and where it's doing well."},{"start":5638.77,"text":"Does that give you a sense of the type of stuff you could do to improve that agenting workflow? Super. Well, that was our case study on evals. We're not going to delve deeper into it, but hopefully it gave you a sense of the type of stuff you can do with LLM judges, with objective, subjective, component-based, end-to-end, etc. Last section on multi-agent workflows. So you might ask,"},{"start":5668.19,"text":"hey, why do we need a multi-agent workflow when the workflow already has multiple steps, already calls the LLM multiple times, already gives them tools? Why do we need multiple agents? And so many people are talking about multi-agent system online. It's not even a new thing, frankly. I mean, multi-agent system has been around for a long time. The main advantage of a multi-agent system is going to be parallelism. It's like, is there something that I wish..."},{"start":5696.89,"text":"I would run in parallel, sort of independently, but maybe there are some sinks in the middle. But that's where you want to put a multi-agent system. It's when it's parallel. The other advantage that some companies have with multi-agent system is an agent can be reused. So let's say in a company you have an agent that's been built for design. That agent can be used in the marketing team and it can be used in the product team."},{"start":5723.37,"text":"And so now you're optimizing an agent which has multiple stakeholders that can communicate with it and benefit from its performance. Actually, I'm going to ask you a question and take a few, maybe a minute to think about it. Let's say you were building smart home automation for your apartment or your home. What agents would you want to build?"},{"start":5749.56,"text":"Write it down, and then I'm going to ask you in a minute to share some of the agents that you will build."}],"speech_gaps":[],"frame":"../frames/v057/033.webp","frame_time":5593.8},{"title":"构建智能家庭的多智能体系统","segments":[{"id":583,"text":"Also, think about how you would put a hierarchy between these agents or how you would organize them or who should communicate with who.","zh":"此外，还要思考你如何在这些建议中建立一个层级结构，或者如何组织它们，或者谁应该与谁进行通信。","start":5756.64,"end":5763.4},{"id":584,"text":"Okay?","zh":"好的？","start":5763.72,"end":5764.12},{"id":585,"text":"Okay, take a minute for that.","zh":"好的，花点时间思考一下。","start":5764.46,"end":5765.76},{"id":586,"text":"Be creative also, because I'm going to ask all of your agents, and maybe you have an agent that nobody has thought of.","zh":"也要有创意，因为我会询问你们所有的代理，也许你们有一个别人没有想到的代理。","start":5768.12,"end":5773.28},{"id":587,"text":"Okay, let's get started.","zh":"好的，我们开始吧。","start":5778.04,"end":5779.3},{"id":588,"text":"And who wants to give me a set of agents that you would want for your home, smart home?","zh":"那么，谁想给我一个你们希望用于你们的智能家居的代理集合？","start":5779.56,"end":5785.48},{"id":589,"text":"Yes.","zh":"是的。","start":5785.76,"end":5786.24},{"id":590,"text":"Okay so let me repeat there are four agents I think roughly one that tracks biometric like your","zh":"好的，让我重复一下，我认为有四个代理，大概一个用于追踪生物特征，比如你的","start":5816.22,"end":5823.54},{"id":591,"text":"where are you in the home where are you moving how you're moving things like that","zh":"你在家里什么地方 你在移动 你如何移动这些东西之类的","start":5824.36,"end":5828.16},{"id":592,"text":"that sort of knows your location the second one uh determines the temperature","zh":"那种知道你位置的 第二个则确定房间的温度","start":5828.92,"end":5835.02},{"id":593,"text":"of the rooms and has the ability to change it.","zh":"并有能力改变它。","start":5835.02,"end":5838.82},{"id":594,"text":"The third one tracks energy efficiency","zh":"第三个追踪能源效率","start":5839.78,"end":5842.3},{"id":595,"text":"and might give feedback on energy and energy usage.","zh":"并可能对能源和能源使用提供反馈。","start":5842.3,"end":5847.02},{"id":596,"text":"It might be, I don't know,","zh":"它可能有 我不知道","start":5847.14,"end":5848.34},{"id":597,"text":"maybe it has the control over the temperature as well.","zh":"也许它也有对温度的控制权。","start":5848.38,"end":5850.92},{"id":598,"text":"I don't know, actually, or the gas.","zh":"实际上 我不知道 或者是燃气。","start":5850.96,"end":5853.08},{"id":599,"text":"or the water, might cut your water at some point. And then you have an orchestrator agent. What is exactly the orchestrator doing? Okay, passes instructions. So is that the agent that communicates mainly with the user? Okay, so if I have, I'm coming back home and I'm saying I want the oven to be preheated.","zh":"或者水管，可能会在某个时候切断你的水源。然后你有一个协调者代理。协调者到底在做什么？嗯，传递指令。那么，这是否是主要与用户沟通的代理？嗯，比如，我回家后，我说我想让烤箱预热。","start":5853.94,"end":5881.18},{"id":600,"text":"What is exactly the orchestrator doing? Okay, passes instructions. So is that the agent that communicates mainly with the user? Okay, so if I have, I'm coming back home and I'm saying I want the oven to be preheated.","zh":"协调者到底在做什么？嗯，传递指令。那么，这是否是主要与用户沟通的代理？嗯，比如，我回家后，我说我想让烤箱预热。","start":5881.82,"end":5900.49}],"notes":["本段讨论了构建智能家庭多智能体系统时需要考虑的智能体层级和通信机制。讲者首先引导学生思考如何组织智能体之间的层级关系，以及谁应该与谁进行通信。接着，讲者举例说明了四种智能体：一种用于跟踪生物特征和位置，一种用于控制室温，一种用于跟踪能源效率并提供反馈，还有一种用于控制燃气和水。最后，讲者介绍了协调者智能体的作用，即主要与用户通信，并将指令传递给其他智能体。","讲者通过一个具体的例子说明了协调者智能体的功能：当用户回家并要求预热烤箱时，用户与协调者通信，协调者再将指令传递给相应的智能体。这展示了多智能体系统中智能体之间的协作机制。","讲者强调了在设计多智能体系统时需要考虑的创造性，即学生可能提出一些未被想到的智能体。这表明在实际应用中，智能体的设计需要灵活且具有创新性。","讲者提到的智能体包括生物特征追踪、温度控制、能源效率监控以及协调者，这些智能体共同构成了一个完整的智能家庭系统。这说明了多智能体系统在实际应用中的复杂性和多样性。","讲者在描述智能体功能时，使用了具体的例子，如控制燃气和水，这表明智能体不仅需要执行基本任务，还需要具备一定的决策能力。","讲者通过提问和引导，鼓励学生思考和提出自己的想法，这有助于加深对多智能体系统概念的理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5756.64,"end":5900.49,"asr_flags":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":5756.64,"text":"Also, think about how you would put a hierarchy between these agents or how you would organize them or who should communicate with who."},{"start":5763.72,"text":"Okay?"},{"start":5764.46,"text":"Okay, take a minute for that."},{"start":5768.12,"text":"Be creative also, because I'm going to ask all of your agents, and maybe you have an agent that nobody has thought of."},{"start":5778.04,"text":"Okay, let's get started."},{"start":5779.56,"text":"And who wants to give me a set of agents that you would want for your home, smart home?"},{"start":5785.76,"text":"Yes."},{"start":5816.22,"text":"okay so let me repeat there are four agents i think roughly one that tracks biometric like your"},{"start":5824.36,"text":"where are you in the home where are you moving how you're moving things like that"},{"start":5828.92,"text":"that sort of knows your location the second one uh determines the temperature"},{"start":5835.02,"text":"of the rooms and has the ability to change it."},{"start":5839.78,"text":"The third one tracks energy efficiency"},{"start":5842.3,"text":"and might give feedback on energy and energy usage."},{"start":5847.14,"text":"It might be, I don't know,"},{"start":5848.38,"text":"maybe it has the control over the temperature as well."},{"start":5850.96,"text":"I don't know, actually, or the gas."},{"start":5853.94,"text":"or the water, might cut your water at some point. And then you have an orchestrator agent. What is exactly the orchestrator doing? Okay, passes instructions. So is that the agent that communicates mainly with the user? Okay, so if I have, I'm coming back home and I'm saying I want the oven to be preheated."},{"start":5881.82,"text":"i communicate with the orchestrator and then it would funnel to another agent okay sounds good yeah so that's an example of a i want to say a hierarchical um agent multi-agent system um what else any other ideas what would you add to that yeah"}],"speech_gaps":[{"start":5788.896,"end":5790.928},{"start":5796.048,"end":5797.584},{"start":5806.256,"end":5807.792},{"start":5813.36,"end":5815.696}],"frame":"../frames/v057/034.webp","frame_time":5768.64},{"title":"多智能体系统与应用场景","segments":[{"id":601,"text":"Oh, I like that. That's a really good one. So let me summarize. You have a security agent that determines if you can enter or not. And when you enter, it understands who you are, and then it gives you certain sets of permissions that might be different depending on if you're a parent or a kid, or you might have access to certain cars and not others.","zh":"哦，我喜欢这个例子。这真是个非常好的例子。让我总结一下。你有一个安全代理，它决定你是否可以进入。当你进入时，它会识别你是谁，然后给你某些特定的权限，这些权限可能根据你是家长还是孩子而有所不同，或者你可能对某些汽车有访问权限而对其他汽车没有。","start":5930.72,"end":5953.52},{"id":602,"text":"The kid cannot open the fridge or I don't know, like something like that. Yeah. Or, OK, I like that. That's a good one. Yeah. And it does feel like it's a complex enough workflow where you want a specific workflow tied to that. I agree. What else? Yes.","zh":"孩子不能打开冰箱，或者我不知道，像这样的事情。对的。或者，哦，我喜欢这个例子。这真是个好例子。对的。这感觉像是一个足够复杂的流程，你希望将特定的流程与之绑定。我同意。还有什么？是的。","start":5954.4,"end":5976.14},{"id":603,"text":"Well, that's really good, actually. So you mentioned two of them.","zh":"实际上，这真的很棒。所以你提到了其中两个。","start":6008.68,"end":6011.88},{"id":604,"text":"One is maybe an agent that has access to external APIs that can understand the weather out there, the wind, the sun, and then has control over certain devices at home, temperature, blinds, things like that, and also understands your preferences for it. That does feel like it's a good use case because you could give that to the orchestrator, but it might lose itself because it's doing too much. And also these problems are tied together, like temperature outdoor with the weather API.","zh":"一个是可能拥有访问外部API的代理，它可以了解外面的天气、风、阳光等，然后对家中的某些设备进行控制，比如温度、窗帘等，同时还能了解你的偏好。这确实感觉像是一个很好的用例，因为你可以将这个交给协调者，但它可能会因为承担太多任务而失去自身功能。此外，这些问题相互关联，比如室外温度与天气API。","start":6012.42,"end":6041.5},{"id":605,"text":"And it might actually have access to the camera in the fridge, for example, and know your preferences and also has access to the e-commerce API to order Amazon groceries ahead of time.","zh":"它甚至可能实际拥有冰箱内的摄像头，了解你的偏好，并且还能访问电子商务API提前订购亚马逊杂货。","start":6041.71,"end":6052.81},{"id":606,"text":"And it might actually have access to the camera in the fridge, for example, and know your preferences and also has access to the e-commerce API to order Amazon groceries ahead of time. I agree. And maybe the orchestrator will be the communication line with the user, but it might communicate with that agent in order to get it done. Yeah, I like those. So those are all really good examples. Here is the list I had.","zh":"它甚至可能实际拥有冰箱内的摄像头，了解你的偏好，并且还能访问电子商务API提前订购亚马逊杂货。我同意。也许协调者将是与用户沟通的渠道，但它可能会与该代理沟通以完成任务。是的，我喜欢这些例子。这些都是非常好的例子。这是我的列表。","start":6053.52,"end":6078.96},{"id":607,"text":"up there. So climate control, lighting, security, energy management, entertainment, notification agent, alerts about the system updates, energy saving, and orchestrator. So all of them you mentioned actually. And then...","zh":"上面列出的。包括气候控制、照明、安全、能源管理、娱乐、通知代理、系统更新的警报、节能以及协调者。你实际上提到了所有这些。然后...","start":6080.3,"end":6094.68},{"id":608,"text":"We didn't talk about the different interaction patterns,","zh":"我们没有讨论不同的交互模式。","start":6095.07,"end":6097.75},{"id":609,"text":"but you do have different ways to organize a multi-agent system,","zh":"但你确实有不同的方法来组织一个多智能体系统，","start":6098.05,"end":6102.33},{"id":610,"text":"flat, hierarchical.","zh":"扁平的，分层的。","start":6102.73,"end":6104.45},{"id":611,"text":"It sounds like this would be hierarchical.","zh":"听起来这应该是分层的。","start":6104.55,"end":6107.03},{"id":612,"text":"I agree.","zh":"我同意。","start":6107.17,"end":6107.91},{"id":613,"text":"And the reason is UI UX.","zh":"原因在于用户界面和用户体验。","start":6108.13,"end":6110.07}],"notes":["本段讨论了多智能体系统在实际应用中的具体例子，包括家庭安全代理、环境控制代理、冰箱代理等。这些代理具有不同的功能和交互方式，例如安全代理负责身份验证和权限管理，环境控制代理负责调节温度和窗帘等。这些例子展示了多智能体系统如何通过分工协作完成复杂任务。","讲者提到多智能体系统可以有不同的组织结构，如扁平结构和分层结构。分层结构可能更适合需要复杂协调的任务，例如家庭智能系统中，高层代理负责协调多个子代理，而子代理负责具体任务。","讲者提到用户界面和用户体验（UI/UX）是选择分层结构的原因之一。这表明在设计多智能体系统时，需要考虑用户交互的直观性和易用性，以确保系统能够被用户有效使用。","讲者提到的冰箱代理具有访问摄像头和电子商务API的功能，这表明智能体可以集成多种传感器和外部服务，以实现更复杂的任务，如自动订购食品。","讲者提到的多智能体系统包括气候控制、照明、安全、能源管理、娱乐、通知代理和协调器等，这些代理共同构成了一个完整的家庭智能系统。","讲者提到的交互模式未详细展开，但指出多智能体系统可以有不同的组织方式，这表明在实际应用中，需要根据任务的复杂性和需求选择合适的结构。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5930.72,"end":6110.07,"asr_flags":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":5930.72,"text":"Oh, I like that. That's a really good one. So let me summarize. You have a security agent that determines if you can enter or not. And when you enter, it understands who you are, and then it gives you certain sets of permissions that might be different depending on if you're a parent or a kid, or you might have access to certain cars and not others."},{"start":5954.4,"text":"The kid cannot open the fridge or I don't know, like something like that. Yeah. Or, OK, I like that. That's a good one. Yeah. And it does feel like it's a complex enough workflow where you want a specific workflow tied to that. I agree. What else? Yes."},{"start":6008.68,"text":"Well, that's really good, actually. So you mentioned two of them."},{"start":6012.42,"text":"One is maybe an agent that has access to external APIs that can understand the weather out there, the wind, the sun, and then has control over certain devices at home, temperature, blinds, things like that, and also understands your preferences for it. That does feel like it's a good use case because you could give that to the orchestrator, but it might lose itself because it's doing too much. And also these problems are tied together, like temperature outdoor with the weather API."},{"start":6041.71,"text":"might influence the temperature inside how you want it etc okay and then the second one which i also like is you might have an agent that looks at your fridge and what's inside"},{"start":6053.52,"text":"And it might actually have access to the camera in the fridge, for example, and know your preferences and also has access to the e-commerce API to order Amazon groceries ahead of time. I agree. And maybe the orchestrator will be the communication line with the user, but it might communicate with that agent in order to get it done. Yeah, I like those. So those are all really good examples. Here is the list I had."},{"start":6080.3,"text":"up there. So climate control, lighting, security, energy management, entertainment, notification agent, alerts about the system updates, energy saving, and orchestrator. So all of them you mentioned actually. And then..."},{"start":6095.07,"text":"We didn't talk about the different interaction patterns,"},{"start":6098.05,"text":"but you do have different ways to organize a multi-agent system,"},{"start":6102.73,"text":"flat, hierarchical."},{"start":6104.55,"text":"It sounds like this would be hierarchical."},{"start":6107.17,"text":"I agree."},{"start":6108.13,"text":"And the reason is UI UX."}],"speech_gaps":[{"start":5976.54,"end":5979.088},{"start":5980.704,"end":5984.112},{"start":5992.88,"end":5994.672},{"start":5996.912,"end":5998.448},{"start":5998.896,"end":6000.768},{"start":6000.768,"end":6004.464},{"start":6004.464,"end":6006.0}],"frame":"../frames/v057/035.webp","frame_time":5942.72},{"title":"多智能体系统与LLM发展趋势","segments":[{"id":614,"text":"I would rather have to only talk to the orchestrator","zh":"我宁愿只与协调者交谈","start":6110.53,"end":6113.47},{"id":615,"text":"rather than have to go to a specialized application to do something.","zh":"而不是去专门的应用程序去做某件事。","start":6113.47,"end":6117.43},{"id":616,"text":"It feels like the orchestrator could be responsible for that.","zh":"感觉协调者可能应该负责这件事。","start":6117.67,"end":6120.17},{"id":617,"text":"And so I agree.","zh":"因此我同意。","start":6120.35,"end":6121.29},{"id":618,"text":"I would probably go for a hierarchical setup here.","zh":"我可能会选择一个分层的架构。","start":6121.35,"end":6123.99},{"id":619,"text":"But maybe you might also add some connections between other agents, like in the flat system where it's all-to-all.","zh":"但也许你也可以在其他智能体之间添加一些连接，比如在扁平系统中所有智能体之间全连接的情况。","start":6123.99,"end":6130.85},{"id":620,"text":"For example, with climate control and energy, if you want to connect those two, you might actually allow them to speak with each other.","zh":"例如，在气候控制和能源方面，如果你想将这两个连接起来，你实际上可以让它们互相交流。","start":6130.97,"end":6137.49},{"id":621,"text":"When you allow agents to speak with each other, it is basically an MCP protocol, by the way.","zh":"当你允许智能体之间进行交流时，这基本上就是一种MCP协议。","start":6137.85,"end":6143.01},{"id":622,"text":"So you treat the agent like a tool, exactly like a tool.","zh":"所以你把智能体当作一个工具，就像一个工具一样。","start":6143.05,"end":6146.37},{"id":623,"text":"Here is how you interact with this agent.","zh":"这里是你可以如何与这个智能体互动。","start":6146.59,"end":6148.71},{"id":624,"text":"Here is what it can tell you.","zh":"这里是它能告诉你什么。","start":6148.81,"end":6149.93},{"id":625,"text":"Here is what it needs from you, essentially.","zh":"这里是它基本上需要你提供什么。","start":6150.01,"end":6152.23},{"id":626,"text":"dimension. Okay, super. And then without going into the details, there are advantages to multi-agent","zh":"维度。好的，超级。然后不深入细节，多智能体工作流程相对于单个智能体有一些优势，例如调试。","start":6152.23,"end":6159.23},{"id":627,"text":"workflows versus single agents, such as debugging. It's easier to debug a specialized agent and to","zh":"更容易调试一个专用智能体，以及整个系统。","start":6159.23,"end":6166.95},{"id":628,"text":"debug an entire system. Parallelization as well. It's easier to have things run in parallel","zh":"并行化也是一个优势。更容易让事情并行运行，","start":6166.95,"end":6172.05},{"id":629,"text":"and you can earn time. There are some advantages to doing that. And I leave you with this slide","zh":"并且可以节省时间。这样做有一些优势。我以这张幻灯片结束。","start":6172.05,"end":6178.85},{"id":630,"text":"if you want to go deeper.","zh":"如果你想深入了解。","start":6178.85,"end":6179.57},{"id":631,"text":"Super. So we've learned so many techniques to optimize LLMs from prompts to chains to fine-tuning retrieval and to multi-agent system as well. And then just to end on a couple of trends I want you to watch, I think next week is Thanksgiving. Is that it? Is Thanksgiving break? No, the week after. Okay. Well, ahead of the Thanksgiving break, so if you're traveling, you can think about these things.","zh":"很好。因此我们已经学习了许多优化LLMs的技术，从提示到链式结构，再到微调、检索以及多智能体系统。然后，我想结束时提几个趋势，让你关注一下。我认为下周就是感恩节了。是这样吗？感恩节假期吗？不，是感恩节之后的那一周。好吧，在感恩节假期之前，如果你要出行，可以思考这些问题。","start":6180.83,"end":6204.07},{"id":632,"text":"What's next in AI? I wanted to call out a couple of trends. So Ilya Suskever, one of the EOGs of LLMs and OpenAI co-founder, raised that question about are we plateauing or not? The question of are we going to see in the coming years LLMs sort of not improve as fast as...","zh":"人工智能的下一个发展方向是什么？我想指出几个趋势。Ilya Suskever，LLMs和OpenAI的联合创始人之一，提出了一个问题：我们是否已经到达了瓶颈？问题是，在未来几年，我们是否会看到LLMs的改进速度不如以往那样快？","start":6205.43,"end":6229.07},{"id":633,"text":"we've seen in the past. It's been the feeling in the community probably that the last version of GPT did not bring the level of performance that people were expecting, although it did make it so much easier to use for consumers because you don't need to interact with different models. It's all under the same hood. So it seems that it's progressing, but the plateau is unclear. The way I would think about it is...","zh":"我们过去所看到的那样。社区中可能普遍有一种感觉，即最新版本的GPT并没有带来人们所期待的性能水平，尽管它使消费者使用起来更加简便，因为你不需要与不同的模型进行交互，所有功能都集成在一个系统中。因此，看起来它在进步，但是否到达瓶颈尚不明确。我认为可以这样思考","start":6229.41,"end":6254.91},{"id":634,"text":"The LLM scaling laws tell us that if we continue to improve compute and energy, then LLMs should continue to improve.","zh":"LLM扩展定律告诉我们，如果我们继续改进计算能力和能源效率，那么LLMs应该会继续改进。","start":6257.12,"end":6264.2},{"id":635,"text":"But at some point, it's going to plateau.","zh":"但最终会在某个时候达到瓶颈。","start":6264.4,"end":6265.86},{"id":636,"text":"So what's going to take us to the next step?","zh":"那么，什么将引领我们进入下一步？","start":6265.98,"end":6267.66},{"id":637,"text":"It's probably architecture search.","zh":"可能是架构搜索。","start":6268.36,"end":6270.4},{"id":638,"text":"Still, a lot of LLMs, even if we don't understand what's under the hood, are probably transformer-based today.","zh":"尽管如此，很多大型语言模型，即使我们不了解其内部机制，今天可能仍然是基于Transformer的。","start":6271.06,"end":6275.98},{"id":639,"text":"But we know that the human brain does not operate the same way.","zh":"但我们知道，人类大脑的运作方式并不相同。","start":6276.16,"end":6279.54},{"id":640,"text":"There's just certain things that we do that are much more efficient, much faster.","zh":"我们有一些做法要高效得多，也快得多。","start":6279.6,"end":6283.62},{"id":641,"text":"We don't need as much data.","zh":"我们不需要那么多数据。","start":6283.78,"end":6284.9},{"id":642,"text":"out. So theoretically, we have so much to learn in terms of architecture search that we haven't","zh":"因此，从理论上讲，我们在架构搜索方面还有非常多可以学习的地方，我们尚未","start":6284.9,"end":6289.68}],"notes":["本段讨论了多智能体系统相较于单一智能体的优势，包括调试和并行化。讲者提到，调试专用智能体和整个系统更容易，同时并行化可以节省时间。这些优势表明多智能体系统在某些应用场景中可能更有效。","讲者提到，多智能体系统在调试方面有优势，因为可以分别调试每个智能体，而单一智能体系统可能需要更复杂的调试过程。这种模块化设计有助于定位和解决问题。","并行化是多智能体系统的一个重要优势，因为多个智能体可以同时执行任务，从而节省时间。这种并行处理能力在需要高效计算的场景中尤为重要。","讲者还提到，多智能体系统在某些情况下可能比单一智能体更有效，但具体优势取决于应用场景。例如，在需要多个智能体协同工作的任务中，多智能体系统可能更合适。","讲者最后提到，多智能体系统是优化LLM技术的一部分，与其他技术如提示工程、链式结构和微调等并列。这表明多智能体系统是LLM优化策略的一个重要方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6110.53,"end":6289.68,"asr_flags":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":6110.53,"text":"I would rather have to only talk to the orchestrator"},{"start":6113.47,"text":"rather than have to go to a specialized application to do something."},{"start":6117.67,"text":"It feels like the orchestrator could be responsible for that."},{"start":6120.35,"text":"And so I agree."},{"start":6121.35,"text":"I would probably go for a hierarchical setup here."},{"start":6123.99,"text":"But maybe you might also add some connections between other agents, like in the flat system where it's all-to-all."},{"start":6130.97,"text":"For example, with climate control and energy, if you want to connect those two, you might actually allow them to speak with each other."},{"start":6137.85,"text":"When you allow agents to speak with each other, it is basically an MCP protocol, by the way."},{"start":6143.05,"text":"So you treat the agent like a tool, exactly like a tool."},{"start":6146.59,"text":"Here is how you interact with this agent."},{"start":6148.81,"text":"Here is what it can tell you."},{"start":6150.01,"text":"Here is what it needs from you, essentially."},{"start":6152.23,"text":"dimension. Okay, super. And then without going into the details, there are advantages to multi-agent"},{"start":6159.23,"text":"workflows versus single agents, such as debugging. It's easier to debug a specialized agent and to"},{"start":6166.95,"text":"debug an entire system. Parallelization as well. It's easier to have things run in parallel"},{"start":6172.05,"text":"and you can earn time. There are some advantages to doing that. And I leave you with this slide"},{"start":6178.85,"text":"if you want to go deeper."},{"start":6180.83,"text":"Super. So we've learned so many techniques to optimize LLMs from prompts to chains to fine-tuning retrieval and to multi-agent system as well. And then just to end on a couple of trends I want you to watch, I think next week is Thanksgiving. Is that it? Is Thanksgiving break? No, the week after. Okay. Well, ahead of the Thanksgiving break, so if you're traveling, you can think about these things."},{"start":6205.43,"text":"What's next in AI? I wanted to call out a couple of trends. So Ilya Suskever, one of the EOGs of LLMs and OpenAI co-founder, raised that question about are we plateauing or not? The question of are we going to see in the coming years LLMs sort of not improve as fast as..."},{"start":6229.41,"text":"we've seen in the past. It's been the feeling in the community probably that the last version of GPT did not bring the level of performance that people were expecting, although it did make it so much easier to use for consumers because you don't need to interact with different models. It's all under the same hood. So it seems that it's progressing, but the plateau is unclear. The way I would think about it is..."},{"start":6257.12,"text":"The LLM scaling laws tell us that if we continue to improve compute and energy, then LLMs should continue to improve."},{"start":6264.4,"text":"But at some point, it's going to plateau."},{"start":6265.98,"text":"So what's going to take us to the next step?"},{"start":6268.36,"text":"It's probably architecture search."},{"start":6271.06,"text":"Still, a lot of LLMs, even if we don't understand what's under the hood, are probably transformer-based today."},{"start":6276.16,"text":"But we know that the human brain does not operate the same way."},{"start":6279.6,"text":"There's just certain things that we do that are much more efficient, much faster."},{"start":6283.78,"text":"We don't need as much data."},{"start":6284.9,"text":"out. So theoretically, we have so much to learn in terms of architecture search that we haven't"}],"speech_gaps":[],"frame":"../frames/v057/036.webp","frame_time":6122.53},{"title":"增强LLM应用的工程与多模态发展","segments":[{"id":643,"text":"figured out. It's not a surprise that you see those labs hire so many engineers, because it","zh":"搞清楚了。你看到那些实验室雇佣这么多工程师并不令人意外，因为","start":6289.68,"end":6295.88},{"id":644,"text":"is possible that in the next few years, you're going to have thousands of engineers trying to","zh":"有可能在未来几年内，你会看到成千上万的工程师试图","start":6295.88,"end":6299.94},{"id":645,"text":"figure out the different engineering hacks and tactics and architectural searches that are going","zh":"弄清楚那些将导致更好模型的不同工程技巧、战术和架构搜索方法。其中一个人突然会发现下一个Transformer，并将计算需求和能源需求减少10倍。","start":6299.94,"end":6304.16},{"id":646,"text":"to lead to better models. And one of them suddenly will find the next transformer and it will reduce","zh":"这有点像如果你读过艾萨克·阿西莫夫的《基地》系列，","start":6304.16,"end":6310.34},{"id":647,"text":"by 10x the need for compute and the need for energy.","zh":"由于计算需求和能源需求增加了10倍。","start":6310.34,"end":6313.74},{"id":648,"text":"It's sort of, if you've read Isaac Asimov's foundation series,","zh":"因为他们的决定。","start":6314.6,"end":6319.7},{"id":649,"text":"individuals can have an amazing impact on the future","zh":"个人可以对未来的产生惊人的影响","start":6320.52,"end":6323.5},{"id":650,"text":"because of their decisions.","zh":"因为他们所做的决定。","start":6323.5,"end":6324.74},{"id":651,"text":"Whoever discovered transformers had a tremendous impact","zh":"发现变压器的人对AI的发展方向产生了巨大影响","start":6325.26,"end":6329.54},{"id":652,"text":"on the direction of AI.","zh":"对AI的发展方向产生了巨大影响","start":6329.54,"end":6330.72},{"id":653,"text":"I think we're going to see more of that in the coming years","zh":"我认为在接下来的几年里，我们会看到更多类似的情况","start":6331.02,"end":6333.4},{"id":654,"text":"where some group of researchers that is iterating fast","zh":"某些研究小组快速迭代","start":6333.4,"end":6336.62},{"id":655,"text":"might discover certain things that would suddenly unlock","zh":"可能会发现某些东西，这些发现会突然突破","start":6336.62,"end":6339.84},{"id":656,"text":"lock that plateau and take us to the next step","zh":"目前的瓶颈，将我们带入下一步","start":6339.84,"end":6341.8},{"id":657,"text":"and it's going to continue to improve like that.","zh":"并且这种改进会持续下去","start":6341.8,"end":6343.4},{"id":658,"text":"And so it doesn't surprise me that there's so many","zh":"因此，看到如此多的","start":6343.56,"end":6345.78},{"id":659,"text":"companies hiring engineers right now","zh":"公司现在正在招聘工程师","start":6345.78,"end":6347.7},{"id":660,"text":"to figure out those hacks and those","zh":"去寻找那些技巧和方法","start":6347.7,"end":6349.74},{"id":661,"text":"techniques.","zh":"技术。","start":6349.74,"end":6350.54},{"id":662,"text":"The other set of gains that","zh":"我们还可能看到另一类收益是来自多模态","start":6352.24,"end":6353.8},{"id":663,"text":"we might see is from multimodality.","zh":"我们可能会看到的是来自多模态的发展。","start":6353.8,"end":6355.22},{"id":664,"text":"So the way to think about it is","zh":"思考这个问题的方式是","start":6355.52,"end":6357.5},{"id":665,"text":"we've had LLMs","zh":"我们之前已经有了基于文本的LLM","start":6357.5,"end":6359.72},{"id":666,"text":"first, text-based, and then we've added","zh":"，然后我们又添加了","start":6359.72,"end":6361.86},{"id":667,"text":"imaging. And today","zh":"成像。今天","start":6361.86,"end":6363.32},{"id":668,"text":"models are very good at images, they're","zh":"模型在图像方面表现非常出色，它们也","start":6363.82,"end":6365.74},{"id":669,"text":"very good at text. Turns out that being","zh":"在文本方面表现非常出色。结果发现，擅长图像和擅长文本会使整个模型更好，因此你擅长","start":6365.74,"end":6367.82},{"id":670,"text":"good at images and being good at text makes the whole model better so the fact that you're good","zh":"理解猫的图像会使你在文本方面也更好。现在你再添加另一个模态，比如音频或视频，整个系统会变得更强大，因此你写关于猫的文本时会更好","start":6367.82,"end":6373.18},{"id":671,"text":"at understanding a cat image makes you better at text as well for a cat now you add another","zh":"如果你知道猫的声音是什么样的，如果你还能查看猫的图像，这有意义吗","start":6373.18,"end":6378.4},{"id":672,"text":"modality like audio or video the whole system gets better so you're better at writing about a cat","zh":"所以，我们看到从一个模态到另一个模态的收益，并且这可能会引导我们进入","start":6378.4,"end":6384.46},{"id":673,"text":"if you know what a cat sounds like if you can look at a cat on an image as well does that make sense","zh":"更深层次的发展","start":6384.46,"end":6388.72},{"id":674,"text":"so we see gains that are translated from one modality to another and that might lead in the","zh":"因此，我们看到从一种模态到另一种模态的收益转换，这可能会导致","start":6388.72,"end":6393.62},{"id":675,"text":"pinnacle of robotics where all these modalities come together and suddenly the robot is better","zh":"机器人技术的巅峰，所有这些模态汇聚在一起，突然机器人变得更好","start":6393.62,"end":6398.32},{"id":676,"text":"at running away from a cat because it understands what a cat is how it sounds like what it looks","zh":"能够逃跑远离一只猫，因为它理解猫是什么，它听起来像什么，看起来像什么等等，这都有意义","start":6398.32,"end":6403.2},{"id":677,"text":"like etc that makes sense the other one is the multiple methods working in harmony in the","zh":"另一种情况是多种方法和谐共存，在","start":6403.2,"end":6409.6},{"id":678,"text":"tuesday lectures we've seen supervised learning unsupervised learning self-supervised learning","zh":"星期二的讲座中，我们已经看到了监督学习、无监督学习、自监督学习","start":6409.6,"end":6414.9},{"id":679,"text":"reinforcement learning prompt engineering lags etc if you look at how babies learn","zh":"强化学习、提示工程等，如果你观察婴儿是如何学习的","start":6414.9,"end":6421.2},{"id":680,"text":"it is probably a mix of those different approaches.","zh":"它可能是这些不同方法的结合。","start":6421.78,"end":6425.2},{"id":681,"text":"Like a baby,","zh":"就像一个婴儿，","start":6425.28,"end":6425.94},{"id":682,"text":"might have some meta-learning, meaning it has some survival instinct that is encoded in the DNA, most likely. And that's like the baby's pre-training, if you will. On top of that, the mom or the dad is pointing at stuff and saying, bad, good, bad, good, supervised learning. On top of that, the baby's falling on the ground and getting hurt, and that's a reward signal for reinforcement learning. On top of that, the baby's observing other people doing stuff or other babies.","zh":"可能具有元学习，意味着它有一些生存本能，这些本能编码在DNA中，很可能。这就像婴儿的预训练，如果你愿意这样说。在此基础上，父母指着东西并说，坏，好，坏，好，这是监督学习。在此基础上，婴儿摔倒并受伤，这为强化学习提供了一个奖励信号。在此基础上，婴儿观察其他人做事或观察其他婴儿。","start":6427.56,"end":6456.88}],"notes":["本段讨论了LLM应用中工程团队的重要性，指出随着技术的发展，大量工程师将致力于寻找新的工程技巧和架构优化，以提升模型性能。其中提到，某些突破性发现（如Transformer）可能显著降低计算和能源需求。","讲者引用了阿西莫夫的《基地》系列，强调个体决策对未来的深远影响，指出Transformer的发现对AI方向产生了巨大影响，并预测未来将有更多类似突破。","讲者提到多模态（multimodality）是另一个提升模型性能的途径，通过结合文本、图像、音频和视频等不同模态，模型的整体表现会得到提升。例如，理解猫的图像有助于提升文本理解能力，而加入音频或视频模态则能进一步增强模型。","讲者将多模态与机器人技术联系起来，认为当所有模态结合时，机器人将能更好地理解环境，例如躲避猫，因为其能同时理解猫的视觉、听觉等特征。","讲者还提到，婴儿的学习过程是多种学习方法的结合，包括监督学习（父母的指导）、强化学习（通过试错获得奖励信号）和无监督学习（观察他人行为），并指出这些方法在LLM的发展中可能具有借鉴意义。","讲者强调，婴儿的学习过程涉及元学习（meta-learning），即通过DNA编码的生存本能进行预训练，这与LLM的预训练阶段有相似之处。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6289.68,"end":6456.88,"asr_flags":[],"translation_complete":true,"translated_segments":40,"raw_segments":[{"start":6289.68,"text":"figured out. It's not a surprise that you see those labs hire so many engineers, because it"},{"start":6295.88,"text":"is possible that in the next few years, you're going to have thousands of engineers trying to"},{"start":6299.94,"text":"figure out the different engineering hacks and tactics and architectural searches that are going"},{"start":6304.16,"text":"to lead to better models. And one of them suddenly will find the next transformer and it will reduce"},{"start":6310.34,"text":"by 10x the need for compute and the need for energy."},{"start":6314.6,"text":"It's sort of, if you've read Isaac Asimov's foundation series,"},{"start":6320.52,"text":"individuals can have an amazing impact on the future"},{"start":6323.5,"text":"because of their decisions."},{"start":6325.26,"text":"Whoever discovered transformers had a tremendous impact"},{"start":6329.54,"text":"on the direction of AI."},{"start":6331.02,"text":"I think we're going to see more of that in the coming years"},{"start":6333.4,"text":"where some group of researchers that is iterating fast"},{"start":6336.62,"text":"might discover certain things that would suddenly unlock"},{"start":6339.84,"text":"lock that plateau and take us to the next step"},{"start":6341.8,"text":"and it's going to continue to improve like that."},{"start":6343.56,"text":"And so it doesn't surprise me that there's so many"},{"start":6345.78,"text":"companies hiring engineers right now"},{"start":6347.7,"text":"to figure out those hacks and those"},{"start":6349.74,"text":"techniques."},{"start":6352.24,"text":"The other set of gains that"},{"start":6353.8,"text":"we might see is from multimodality."},{"start":6355.52,"text":"So the way to think about it is"},{"start":6357.5,"text":"we've had LLMs"},{"start":6359.72,"text":"first, text-based, and then we've added"},{"start":6361.86,"text":"imaging. And today"},{"start":6363.82,"text":"models are very good at images, they're"},{"start":6365.74,"text":"very good at text. Turns out that being"},{"start":6367.82,"text":"good at images and being good at text makes the whole model better so the fact that you're good"},{"start":6373.18,"text":"at understanding a cat image makes you better at text as well for a cat now you add another"},{"start":6378.4,"text":"modality like audio or video the whole system gets better so you're better at writing about a cat"},{"start":6384.46,"text":"if you know what a cat sounds like if you can look at a cat on an image as well does that make sense"},{"start":6388.72,"text":"so we see gains that are translated from one modality to another and that might lead in the"},{"start":6393.62,"text":"pinnacle of robotics where all these modalities come together and suddenly the robot is better"},{"start":6398.32,"text":"at running away from a cat because it understands what a cat is how it sounds like what it looks"},{"start":6403.2,"text":"like etc that makes sense the other one is the multiple methods working in harmony in the"},{"start":6409.6,"text":"tuesday lectures we've seen supervised learning unsupervised learning self-supervised learning"},{"start":6414.9,"text":"reinforcement learning prompt engineering lags etc if you look at how babies learn"},{"start":6421.78,"text":"it is probably a mix of those different approaches."},{"start":6425.28,"text":"Like a baby,"},{"start":6427.56,"text":"might have some meta-learning, meaning it has some survival instinct that is encoded in the DNA, most likely. And that's like the baby's pre-training, if you will. On top of that, the mom or the dad is pointing at stuff and saying, bad, good, bad, good, supervised learning. On top of that, the baby's falling on the ground and getting hurt, and that's a reward signal for reinforcement learning. On top of that, the baby's observing other people doing stuff or other babies."}],"speech_gaps":[],"frame":"../frames/v057/037.webp","frame_time":6301.68},{"title":"深度学习课程中的增强LLM应用趋势","segments":[{"id":683,"text":"is doing stuff unsupervised learning. You see what I mean? We're probably a mix of all these methods, and I think that's where the trend is going, is where those methods that you've seen in CS230 come together in order to build an AI system that learns fast, is low latency, is cheap, energy efficient, and makes the most out of all of these methods.","zh":"正在做无监督学习的事情。你明白我的意思吗？我们可能融合了所有这些方法，我认为这就是趋势所在，这些你在CS230中学到的方法会结合起来，构建一个学习速度快、延迟低、成本低、能耗低，并且充分利用所有这些方法的AI系统。","start":6456.91,"end":6478.33},{"id":684,"text":"Finally, and this is especially true at Stanford, you have research going on that you would consider human-centric and some research that is non-human-centric.","zh":"最后，这一点在斯坦福尤其明显，你有研究是人类中心导向的，也有一些研究是非人类中心导向的。","start":6479.24,"end":6489.68},{"id":685,"text":"By human-centric, I should say human approaches that are modeled after the brain and approaches that are not modeled after humans, because it turns out that the human body is very limiting.","zh":"所谓人类中心导向，我应该说是指那些模仿大脑的思路，以及那些不模仿人类的思路，因为事实上，人体是非常有限制的。","start":6489.84,"end":6500.24},{"id":686,"text":"think and so if you actually only do research on what the human brain looks like you're probably","zh":"思考，所以如果你只做研究，研究人类大脑的结构，你可能","start":6500.24,"end":6504.8},{"id":687,"text":"missing out on compute and energy and stuff like that that you can optimize even beyond","zh":"错过了计算和能耗等方面的内容，这些内容你甚至可以优化得比","start":6504.8,"end":6508.88},{"id":688,"text":"neuronal connections in the brain but you still can learn a lot from the human brain and that's","zh":"大脑中的神经连接更优，但你仍然可以从人类大脑中学到很多，这就是","start":6508.88,"end":6513.84},{"id":689,"text":"why there are professors that are running labs right now that try to understand how does back","zh":"为什么现在有教授在运行实验室，试图理解人类是如何进行反向传播的，事实上，我们可能并不具备反向传播。","start":6513.84,"end":6519.36},{"id":690,"text":"propagation work for humans and in fact it's probably that we don't have back propagation","zh":"机制。","start":6519.36,"end":6524.1},{"id":691,"text":"we don't use back propagation we only do forward propagation let's say so this type of stuff is","zh":"我们不使用反向传播，我们只做前向传播，比如说，这种东西是","start":6524.1,"end":6529.24},{"id":692,"text":"interesting research that i would encourage you to read if you're curious about the direction of of","zh":"一项有趣的研究，如果你对AI的发展方向感到好奇，我鼓励你去阅读","start":6529.24,"end":6534.32},{"id":693,"text":"ai um and then finally one thing that's going to be pretty clear i call it all the time but","zh":"嗯，最后有一件事会非常明显，我经常称之为，但","start":6534.32,"end":6540.24},{"id":694,"text":"it's the velocity at which things are moving you're noticing part of the reason","zh":"它是事物移动的速度，你注意到部分原因","start":6540.24,"end":6544.52},{"id":695,"text":"we're giving you a breath in cs230 is because these methods are changing so fast so i don't","zh":"我们给你在cs230中喘息的机会，是因为这些方法变化得如此之快，所以我","start":6544.52,"end":6549.32},{"id":696,"text":"want to bother going and teaching you the number 17 methods on rag that optimizes the rag because","zh":"不想去教你那些在rag上优化的第17种方法，因为","start":6549.32,"end":6555.28},{"id":697,"text":"Because in two years, you're not going to need it.","zh":"因为在两年后，你将不需要它。","start":6555.28,"end":6556.64},{"id":698,"text":"So I would rather you think about","zh":"所以我宁愿你思考","start":6556.82,"end":6558.8},{"id":699,"text":"what is the breadth of things you want to understand.","zh":"你想理解的事情有多广？","start":6559.22,"end":6561.3},{"id":700,"text":"And when you need it, you are sprinting","zh":"当你需要的时候，你才能冲刺","start":6561.54,"end":6563.52},{"id":701,"text":"and learning the exact thing you need faster","zh":"并更快地学习你需要的精确内容","start":6563.52,"end":6565.16},{"id":702,"text":"because the half-life of skill is so low.","zh":"因为技能的半衰期如此之低。","start":6565.16,"end":6567.64},{"id":703,"text":"You want to come out of the class with a good breadth","zh":"你希望在课程结束后拥有良好的广度","start":6567.96,"end":6570.14},{"id":704,"text":"and then have the ability to go deep","zh":"并且在需要时具备深入学习的能力","start":6570.14,"end":6572.5},{"id":705,"text":"whenever you need after the class.","zh":"在课程之后的任何时候。","start":6572.5,"end":6573.96},{"id":706,"text":"And so that's sort of how that class is designed as well.","zh":"因此，这门课的设计也是这样。","start":6574.18,"end":6576.48},{"id":707,"text":"Yeah, that's it for today.","zh":"是的，今天的课就到这里。","start":6577.42,"end":6578.78},{"id":708,"text":"So thank you.","zh":"所以谢谢大家。","start":6579.5,"end":6580.66},{"id":709,"text":"Thank you for participating.","zh":"感谢大家的参与。","start":6581.64,"end":6583.28}],"notes":["本段主要讨论了增强LLM应用的趋势，强调了不同方法的结合，以构建快速、低延迟、低成本且能源效率高的AI系统。讲者提到，这些方法的结合是未来的发展方向。","讲者提到，斯坦福大学的研究分为以人类为中心和非人类为中心的两种类型。以人类为中心的研究是基于大脑的模型，而非人类的模型则可能超越人类身体的限制。","讲者指出，仅研究人类大脑的结构可能会忽略计算和能源优化的潜力，但人类大脑仍然提供了许多值得学习的方面。","讲者提到，目前有教授在研究人类如何进行反向传播，实际上人类可能并不使用反向传播，而是仅使用前向传播。这种研究方向值得探索。","讲者强调了AI领域发展速度之快，因此课程设计更注重广度而非深度，鼓励学生在需要时快速学习特定技能。","课程设计的目标是让学生在课堂上掌握广泛的知识，并在之后根据需要深入学习特定领域，因为技能的半衰期非常短。"],"formulas":[],"uncertainties":["missing out on compute and energy and stuff like that that you can optimize even beyond","how does back propagation work for humans","the number 17 methods on rag that optimizes the rag"],"diagram":"none","start":6456.91,"end":6583.28,"asr_flags":[],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":6456.91,"text":"is doing stuff unsupervised learning. You see what I mean? We're probably a mix of all these methods, and I think that's where the trend is going, is where those methods that you've seen in CS230 come together in order to build an AI system that learns fast, is low latency, is cheap, energy efficient, and makes the most out of all of these methods."},{"start":6479.24,"text":"Finally, and this is especially true at Stanford, you have research going on that you would consider human-centric and some research that is non-human-centric."},{"start":6489.84,"text":"By human-centric, I should say human approaches that are modeled after the brain and approaches that are not modeled after humans, because it turns out that the human body is very limiting."},{"start":6500.24,"text":"think and so if you actually only do research on what the human brain looks like you're probably"},{"start":6504.8,"text":"missing out on compute and energy and stuff like that that you can optimize even beyond"},{"start":6508.88,"text":"neuronal connections in the brain but you still can learn a lot from the human brain and that's"},{"start":6513.84,"text":"why there are professors that are running labs right now that try to understand how does back"},{"start":6519.36,"text":"propagation work for humans and in fact it's probably that we don't have back propagation"},{"start":6524.1,"text":"we don't use back propagation we only do forward propagation let's say so this type of stuff is"},{"start":6529.24,"text":"interesting research that i would encourage you to read if you're curious about the direction of of"},{"start":6534.32,"text":"ai um and then finally one thing that's going to be pretty clear i call it all the time but"},{"start":6540.24,"text":"it's the velocity at which things are moving you're noticing part of the reason"},{"start":6544.52,"text":"we're giving you a breath in cs230 is because these methods are changing so fast so i don't"},{"start":6549.32,"text":"want to bother going and teaching you the number 17 methods on rag that optimizes the rag because"},{"start":6555.28,"text":"Because in two years, you're not going to need it."},{"start":6556.82,"text":"So I would rather you think about"},{"start":6559.22,"text":"what is the breadth of things you want to understand."},{"start":6561.54,"text":"And when you need it, you are sprinting"},{"start":6563.52,"text":"and learning the exact thing you need faster"},{"start":6565.16,"text":"because the half-life of skill is so low."},{"start":6567.96,"text":"You want to come out of the class with a good breadth"},{"start":6570.14,"text":"and then have the ability to go deep"},{"start":6572.5,"text":"whenever you need after the class."},{"start":6574.18,"text":"And so that's sort of how that class is designed as well."},{"start":6577.42,"text":"Yeah, that's it for today."},{"start":6579.5,"text":"So thank you."},{"start":6581.64,"text":"Thank you for participating."}],"speech_gaps":[],"frame":"../frames/v057/038.webp","frame_time":6468.91}],"complete":true,"video_url":" function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
