ble to create some code to display data to the user."},{"id":450,"text":"It might even be able to perform some calculations like, oh, I'm going to calculate the fastest route to get from San Francisco to New York."},{"id":451,"text":"And which one might be the most appropriate for what the user is looking for."},{"id":452,"text":"And then I want to calculate the distance between the airport and that hotel versus that hotel."},{"id":453,"text":"And I'm going to..."},{"id":454,"text":"code to do that. So it's actually fully autonomous from that perspective. So yeah, remember those keywords, memory, prompts, tools, etc."},{"id":455,"text":"Now, I presented the flight API, but it does not have to be an API. You probably have heard the term MCP or model context protocol that was coined by Anthropic. I pasted the seminal article on MCP at the bottom of this slide. But let me explain in a nutshell why those things would differ. In the API case, you would actually teach."}],"notes":["本段讲解了增强LLM应用中不同自主性级别的架构设计。最不自主的系统是将步骤硬编码，例如旅行代理需要明确的指令，如识别意图、查找客户历史记录和偏好、调用航班API等。这种设计缺乏灵活性，完全依赖预设的步骤。","半自主系统则将工具硬编码，但不硬编码步骤。代理被赋予可访问的工具，例如数据库和API，但具体执行步骤由代理决定。这种设计提高了灵活性，但仍然需要一定程度的指导。","最自主的系统允许代理自主决定步骤，并创建工具。例如，代理可以访问代码编辑器，调用任意API，执行网络搜索，甚至编写代码进行计算，如计算从旧金山到纽约的最快路线。这种设计赋予代理高度的自主性。","本段还提到MCP（Model Context Protocol）这一概念，由Anthropic提出，用于描述不同系统间交互的协议。与API不同，MCP可能涉及更复杂的上下文管理，但具体细节未展开。","课堂中强调了自主性架构的关键要素，包括记忆、提示（prompts）、工具（tools）等。这些要素共同决定了代理的自主程度和功能范围。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4190.67,"end":4355.99,"asr_flags":[],"raw_segments":[{"start":4190.67,"text":"that you might let your agent read for example if you're building your startups you have a crm"},{"start":4196.69,"text":"a crm has data in it and you want to use lookups in that data you will probably give a lookup tool"},{"start":4203.63,"text":"and you will give access to the resource and it will do lookups whenever you want super fast"},{"start":4208.67,"text":"So, this type of architecture can be built with different degrees of autonomy, from the least autonomous to the most autonomous."},{"start":4219.55,"text":"And I'll give you a few examples."},{"start":4222.13,"text":"Less autonomous would be you've hard-coded the steps."},{"start":4225.67,"text":"So, let's say I tell the travel agent, first identify the intent, then look up in the database the history of this customer with us and their preferences."},{"start":4237.79,"text":"is, then go to the flight API, blah, blah, blah, then go to the, I would hard code the"},{"start":4243.05,"text":"steps."},{"start":4243.53,"text":"Okay."},{"start":4244.23,"text":"That's the least autonomous."},{"start":4246.35,"text":"The semi-autonomous is I might hard code the tools, but I'm not going to hard code the"},{"start":4252.27,"text":"steps."},{"start":4252.97,"text":"So I'm going to tell the agents, um, your acts like a travel agents and, um, and, uh,"},{"start":4262.51,"text":"you, your task is to help the person book a travel."},{"start":4265.93,"text":"and these are the tools that you have accessible to yourself."},{"start":4269.11,"text":"And so I'm not hard-coding the steps,"},{"start":4271.13,"text":"I'm just hard-coding the tools that you have access to for yourself."},{"start":4274.73,"text":"The more autonomous is the agent decides the steps"},{"start":4278.33,"text":"and can create the tools."},{"start":4280.61,"text":"So that's where you might give actually access to a code editor to the agent."},{"start":4285.09,"text":"And the agent might actually be able to ping any API in the web,"},{"start":4289.25,"text":"perform some web search."},{"start":4290.77,"text":"It might even be able to create some code to display data to the user."},{"start":4294.81,"text":"It might even be able to perform some calculations like, oh, I'm going to calculate the fastest route to get from San Francisco to New York."},{"start":4303.75,"text":"And which one might be the most appropriate for what the user is looking for."},{"start":4308.47,"text":"And then I want to calculate the distance between the airport and that hotel versus that hotel."},{"start":4312.89,"text":"And I'm going to..."},{"start":4313.64,"text":"code to do that. So it's actually fully autonomous from that perspective. So yeah, remember those keywords, memory, prompts, tools, etc."},{"start":4330.32,"text":"Now, I presented the flight API, but it does not have to be an API. You probably have heard the term MCP or model context protocol that was coined by Anthropic. I pasted the seminal article on MCP at the bottom of this slide. But let me explain in a nutshell why those things would differ. In the API case, you would actually teach."}],"speech_gaps":[],"frame":"../frames/v057/025.webp","frame_time":4202.67},{"title":"增强LLM应用中的API通信与MCP架构","segments":[{"id":456,"text":"your LLM to ping an API. So you would say, this is how you ping this API, and this is the data that it will send you back. And you would have to do that in a one-off manner. So you would have to build or sort of give the API documentation of your flight API, your booking hotel API, your car rental API, and then you would give tools for your model to communicate with those APIs."},{"id":457,"text":"it doesn't scale very well versus MCP. MCP, it's really about putting a system in the middle, sort of, that would make it simpler for your LLM to communicate with that endpoint."},{"id":458,"text":"You might have an MCP server, an MCP client, where you're trying to communicate with that travel database or the flight API or MCP. And your agent might actually just communicate with it and say, hey, what do you need in order to give me more flight information? And that agent will respond by, I would like you to tell me where is the origin flight, where is the destination, and what you're looking for at the high level. This is my requirement. Okay, let me get back to you with my requirement."},{"id":459,"text":"Oh, you forgot to tell me your budget. Whatever. Oh, let me give you my budget, et cetera. And it's agent-to-agent communication, which allows more scalability. You don't need to hard-code everything. Companies have displayed their MCPs out there, and your agent can communicate with them and figure out how to get the data it needs. Does that make sense? Yeah. Oh, sorry."},{"id":460,"text":"I think it is, ultimately. The question is, is it an HTTP issue? Because anyway, if an API has to be updated, the MCP has to be updated. That's what you say, right?"},{"id":461,"text":"Yes, that's correct. But at least it allows the agent to sort of go back and forth and figure out what the requirements are. But at the end of the day, ideally, if you're a startup, you have some documentation and automatically you have an agent or an LLM workflow that reads that documentation and updates the code accordingly. But I agree. It's not something that is fully autonomous. Yeah."},{"id":462,"text":"Which security specifically? Yeah, so are there security issues with MCPs? So think about it this way. MCPs, depending on the data that you get access to, might have different requirements, lower stake or higher stake. I'm not an expert at the full range, but it wouldn't surprise me that when you..."}],"notes":["本段讨论了在增强LLM应用中，如何通过API进行通信，以及MCP（中间通信平台）架构的优势。讲者指出，直接让LLM与多个API通信可能难以扩展，而MCP可以作为一个中间系统，简化LLM与API的交互。MCP允许LLM通过与代理进行对话，逐步明确所需信息，从而避免硬编码所有API细节。","讲者进一步说明，MCP的引入使得系统更具可扩展性，因为LLM可以通过与MCP的交互动态获取所需信息，而不是预先编写所有API的文档。这种设计减少了对API文档的依赖，提高了系统的灵活性。","讲者提到，MCP的使用也涉及安全问题，因为不同的API可能涉及不同级别的数据敏感性。MCP需要根据数据的敏感程度设置不同的访问权限和安全措施。","讲者指出，MCP的更新需要与API的更新同步，这可能带来一定的维护成本。然而，MCP的引入使得系统能够更灵活地适应API的变化，而无需频繁修改LLM的代码。","讲者还提到，理想情况下，初创公司可以利用文档自动生成LLM的工作流，从而自动更新代码。然而，这种自动化仍然需要人工干预，不能完全实现自主性。","最后，讲者提到关于MCP安全性的具体问题，指出MCP可能面临不同的安全挑战，具体取决于所访问的数据类型和敏感程度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4356.78,"end":4532.58,"asr_flags":[],"raw_segments":[{"start":4356.78,"text":"your LLM to ping an API. So you would say, this is how you ping this API, and this is the data that it will send you back. And you would have to do that in a one-off manner. So you would have to build or sort of give the API documentation of your flight API, your booking hotel API, your car rental API, and then you would give tools for your model to communicate with those APIs."},{"start":4382.57,"text":"it doesn't scale very well versus MCP. MCP, it's really about putting a system in the middle, sort of, that would make it simpler for your LLM to communicate with that endpoint. So for instance,"},{"start":4402.04,"text":"You might have an MCP server, an MCP client, where you're trying to communicate with that travel database or the flight API or MCP. And your agent might actually just communicate with it and say, hey, what do you need in order to give me more flight information? And that agent will respond by, I would like you to tell me where is the origin flight, where is the destination, and what you're looking for at the high level. This is my requirement. Okay, let me get back to you with my requirement."},{"start":4431.26,"text":"Oh, you forgot to tell me your budget. Whatever. Oh, let me give you my budget, et cetera. And it's agent-to-agent communication, which allows more scalability. You don't need to hard-code everything. Companies have displayed their MCPs out there, and your agent can communicate with them and figure out how to get the data it needs. Does that make sense? Yeah. Oh, sorry."},{"start":4472.05,"text":"I think it is, ultimately. The question is, is it an HTTP issue? Because anyway, if an API has to be updated, the MCP has to be updated. That's what you say, right?"},{"start":4481.87,"text":"Yes, that's correct. But at least it allows the agent to sort of go back and forth and figure out what the requirements are. But at the end of the day, ideally, if you're a startup, you have some documentation and automatically you have an agent or an LLM workflow that reads that documentation and updates the code accordingly. But I agree. It's not something that is fully autonomous. Yeah."},{"start":4510.51,"text":"Which security specifically? Yeah, so are there security issues with MCPs? So think about it this way. MCPs, depending on the data that you get access to, might have different requirements, lower stake or higher stake. I'm not an expert at the full range, but it wouldn't surprise me that when you..."}],"speech_gaps":[{"start":4458.784,"end":4461.536},{"start":4461.536,"end":4463.664},{"start":4463.664,"end":4465.232},{"start":4468.24,"end":4471.65}],"frame":"../frames/v057/026.webp","frame_time":4368.78},{"title":"MCP 与安全性的讨论","segments":[{"id":463,"text":"When you expose an MCP to an... I think a lot of MCPs have authentication. So you might actually need a code to actually talk to it, just like you would with an API or a key. Yeah, but that's a good question. I'm not an expert at the security of these systems, but we can look into it."},{"id":464,"text":"Any other questions on what we've seen with the agentic workflows, APIs, tools, MCPs, memory? All of that is under progress, so even memory is not a solved problem by any means. It's pretty hard, actually. Yes? Exactly. Is MCP about efficiency or accessing more data? It's about efficiency."},{"id":465,"text":"Let's say you have a coding agent and it has an MCP client and there's multiple MCP servers that are exposed out there. That agent can communicate very efficiently with them and find what it needs. And it's a more efficient process than actually displaying APIs and the APIs on that side and how to ping them and what the protocol is. But it's not about the data that is being exposed because ultimately you control the data that is being exposed."},{"id":466,"text":"You probably, depending on how the MCP is built, my guess is you probably expose yourself to other risks because your MCP server can see any inputs pretty much from another LLM. And so it has to be robust."},{"id":467,"text":"Super. So let's look at an example of a step-by-step workflow for the travel agent. So let's say the user says, I want to plan a trip to Paris from December 15th to 20th with flights, hotels near the Eiffel Tower, and then an itinerary of must-visit places. That's the task to the travel agent. Step two, the agent plans the steps."},{"id":468,"text":"So it says, I'm going to find flights. Use the flight search API to get option for December 15th. Search hotels, generate recommendation for places to visit, validate preferences, budget, etc. Book the trip with the payment processing API. Step three, that's just the planning, by the way. Step three, execute the plan. Use your tools, combine the results."}],"notes":["本段讨论了MCP（可能指机器通信协议）在安全性和效率方面的应用。讲者提到，许多MCP具有认证机制，因此需要代码来与之通信，类似于API或密钥。讲者表示自己不是该领域的专家，但可以进一步探讨相关问题。","讲者指出，目前关于代理工作流、API、工具、MCP和记忆的实现仍处于进行中，记忆问题尚未解决。MCP的重点在于效率，而非访问更多数据。","讲者通过一个示例说明了MCP在实际应用中的效率优势。例如，一个编码代理可以通过MCP客户端与多个MCP服务器高效通信，而无需手动处理API的协议和调用。","讲者提到，MCP服务器可能会暴露于其他风险，因为它们可以接收来自其他LLM的输入，因此需要具备鲁棒性。","讲者以旅行代理为例，展示了MCP在实际任务中的应用流程。用户请求规划巴黎之旅，代理需要搜索航班、酒店、推荐景点，并最终完成预订。","在执行计划时，代理需要使用工具并整合结果。这表明MCP在实际任务中不仅涉及通信，还包括任务分解和结果整合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4535.36,"end":4705.66,"asr_flags":[],"raw_segments":[{"start":4535.36,"text":"When you expose an MCP to an... I think a lot of MCPs have authentication. So you might actually need a code to actually talk to it, just like you would with an API or a key. Yeah, but that's a good question. I'm not an expert at the security of these systems, but we can look into it."},{"start":4558.43,"text":"Any other questions on what we've seen with the agentic workflows, APIs, tools, MCPs, memory? All of that is under progress, so even memory is not a solved problem by any means. It's pretty hard, actually. Yes? Exactly. Is MCP about efficiency or accessing more data? It's about efficiency."},{"start":4604.03,"text":"Let's say you have a coding agent and it has an MCP client and there's multiple MCP servers that are exposed out there. That agent can communicate very efficiently with them and find what it needs. And it's a more efficient process than actually displaying APIs and the APIs on that side and how to ping them and what the protocol is. But it's not about the data that is being exposed because ultimately you control the data that is being exposed."},{"start":4635.02,"text":"You probably, depending on how the MCP is built, my guess is you probably expose yourself to other risks because your MCP server can see any inputs pretty much from another LLM. And so it has to be robust."},{"start":4653.43,"text":"Super. So let's look at an example of a step-by-step workflow for the travel agent. So let's say the user says, I want to plan a trip to Paris from December 15th to 20th with flights, hotels near the Eiffel Tower, and then an itinerary of must-visit places. That's the task to the travel agent. Step two, the agent plans the steps."},{"start":4682.64,"text":"So it says, I'm going to find flights. Use the flight search API to get option for December 15th. Search hotels, generate recommendation for places to visit, validate preferences, budget, etc. Book the trip with the payment processing API. Step three, that's just the planning, by the way. Step three, execute the plan. Use your tools, combine the results."}],"speech_gaps":[],"frame":"../frames/v057/027.webp","frame_time":4547.36},{"title":"评估和改进LLM应用的系统","segments":[{"id":469,"text":"And then proactive user interaction and booking. It might make a first proposal to the user and ask the user to validate or invalidate, and then may repeat that planning and execution process. And then finally, it might actually update the memory. It might say, oh, I just learned through this interaction that the user only likes direct flights. Next time, I'll only give direct flights."},{"id":470,"text":"Or I noticed users are fine with three-star hotels or four-star hotels. And in fact, they don't want to go above budget or something like that. So that hopefully makes sense by now on how you might do that. My question for you is, how would you know if this works? And if you had such a system running in production, how would you improve it?"},{"id":471,"text":"Yeah. So that's an example. So let users rate their experience at the end. That would be an end-to-end test, right? You're looking at the user experience through the steps and say, how good was it from one to five, let's say. Yeah, it's a good way. And then if you learn that a user says one, how would you improve the workflow?"},{"id":472,"text":"Okay, so you would go down three and say, okay, you said one, what was your issue? And then the user says the prices were too high, let's say. And then you would go back and fix that specific tool or prompt. Yeah, okay. Any other ideas? Yeah, good. So that's a good insight. Separate the LLM-related stuff from the non-LLM-related stuff, the deterministic stuff. The deterministic stuff, you might be able to fix it."},{"id":473,"text":"You know, more objectively, essentially. Yeah, it was. What else? So give me an example of an objective issue that you can notice and how you would fix it versus a subjective issue. Yeah. OK, so let's say you say."},{"id":474,"text":"There's the same flight, but one is cheaper than the other, let's say. It's objectively worse. And so you can capture that almost automatically. Yeah. So you could actually build evals that are objective, that are tracked."}],"notes":["本段讨论了如何评估和改进LLM在实际应用中的表现。讲者提出了一个系统，该系统通过用户交互和反馈来优化服务，例如根据用户的偏好调整推荐策略。讲者还提出了如何判断系统是否有效的问题，并建议通过用户评分来评估整体体验。","讲者进一步说明了如何通过用户评分来评估系统效果，并指出如果用户评分较低，应深入询问用户的具体问题，例如价格过高，并据此改进系统中的特定工具或提示。","讲者强调了区分LLM相关问题和非LLM相关问题的重要性，指出非LLM相关问题（如价格、航班选择等）可以通过客观方式解决，而LLM相关问题可能需要更复杂的调整。","讲者举了一个例子，说明如何识别和解决客观问题，例如同一航班但价格不同的情况，这种问题可以通过自动化评估来检测，并据此改进系统。","讲者指出，通过构建客观的评估体系，可以更有效地跟踪和改进系统性能，而主观问题则需要更细致的用户反馈来识别和解决。","本段的核心在于如何通过用户反馈和系统评估来持续优化LLM应用，强调了区分客观和主观问题的重要性，以及如何通过具体例子来改进系统表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4706.36,"end":4886.3,"asr_flags":[],"raw_segments":[{"start":4706.36,"text":"And then proactive user interaction and booking. It might make a first proposal to the user and ask the user to validate or invalidate, and then may repeat that planning and execution process. And then finally, it might actually update the memory. It might say, oh, I just learned through this interaction that the user only likes direct flights. Next time, I'll only give direct flights."},{"start":4731.72,"text":"Or I noticed users are fine with three-star hotels or four-star hotels. And in fact, they don't want to go above budget or something like that. So that hopefully makes sense by now on how you might do that. My question for you is, how would you know if this works? And if you had such a system running in production, how would you improve it?"},{"start":4764.37,"text":"Yeah. So that's an example. So let users rate their experience at the end. That would be an end-to-end test, right? You're looking at the user experience through the steps and say, how good was it from one to five, let's say. Yeah, it's a good way. And then if you learn that a user says one, how would you improve the workflow?"},{"start":4795.82,"text":"Okay, so you would go down three and say, okay, you said one, what was your issue? And then the user says the prices were too high, let's say. And then you would go back and fix that specific tool or prompt. Yeah, okay. Any other ideas? Yeah, good. So that's a good insight. Separate the LLM-related stuff from the non-LLM-related stuff, the deterministic stuff. The deterministic stuff, you might be able to fix it."},{"start":4835.06,"text":"You know, more objectively, essentially. Yeah, it was. What else? So give me an example of an objective issue that you can notice and how you would fix it versus a subjective issue. Yeah. OK, so let's say you say."},{"start":4873.98,"text":"There's the same flight, but one is cheaper than the other, let's say. It's objectively worse. And so you can capture that almost automatically. Yeah. So you could actually build evals that are objective, that are tracked."}],"speech_gaps":[],"frame":"../frames/v057/028.webp","frame_time":4718.36},{"title":"LLM在实际应用中的评估与改进","segments":[{"id":475,"text":"Across your users. And you might actually run an analysis after and see that for the objective stuff, we notice that our LLM agentic AI workflow is bad with pricing. It just doesn't read price as well because it always gives a more expensive option. Yeah, you're perfectly right. How about the subjective stuff? Yeah. Do you choose a direct or indirect? The indirect or the voltage?"},{"id":476,"text":"Yeah, good one. Do you choose a direct flight or an indirect flight if the indirect is cheaper but the direct is more comfortable? Yeah, that's a good one, actually. So how would you capture that information? Let's say this is used by thousands of users. Could you feed something in? Yeah, I mean, you could. Could you feed something in about the user preferences? Well, you could build a data set."},{"id":477,"text":"That has some of that information. So you build 10 prompts where the user is saying that I prefer direct flights because I care about my time. And then you look at the output and you actually give the example of a good output. And you probably are able to capture the performance of your agentic workflow on this specific eval."},{"id":478,"text":"Does it prioritize? Does it understand price conscious? Is it price conscious, essentially, and comfort conscious? What about the tone? Let's say the LLM right now is not very friendly. How would you notice that, and how would you fix it? Yeah. Okay, have a test user run the prompt and see if there's something wrong with that. Tell me about the last step. How would you notice that something is wrong?"},{"id":479,"text":"So I've got a couple of chats from the AI. I'll use the response."},{"id":480,"text":"Yeah, I agree with your approach. Have LLM judges that evaluate the response against a certain rubric of what politeness looks like. So here in this case, you could actually start with error analysis. So you start, you have a thousand users and you can pull up 20 user interaction and read through it. And you might notice at first sight, the LLM seems to be very rude. It's just super..."}],"notes":["本段讨论了LLM在实际应用中如何评估和改进其性能，特别是针对价格敏感性和主观偏好。讲者提到，LLM在处理价格信息时可能偏向于提供更昂贵的选项，这表明其在价格意识方面存在不足。同时，讲者也提到，用户可能更倾向于直接航班，因为时间因素更重要，这说明主观偏好在决策中的重要性。","讲者进一步探讨了如何通过构建数据集来捕捉用户偏好，例如通过设计10个提示，让用户表达对直接航班的偏好。然后通过分析输出结果，评估LLM在特定任务上的表现。这种方法有助于识别LLM在实际应用中的性能问题。","在讨论LLM的语气问题时，讲者指出，如果LLM当前的语气不够友好，可以通过测试用户运行提示来发现问题。这表明在实际应用中，需要通过用户反馈和测试来评估和改进LLM的表现。","最后，讲者提到，通过分析用户交互数据，可以发现LLM在某些情况下表现得非常粗鲁，这表明在实际应用中，需要持续监控和改进LLM的表现，以确保其符合预期的行为标准。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4887.07,"end":5051.74,"asr_flags":[],"raw_segments":[{"start":4887.07,"text":"across your users. And you might actually run an analysis after and see that for the objective stuff, we notice that our LLM agentic AI workflow is bad with pricing. It just doesn't read price as well because it always gives a more expensive option. Yeah, you're perfectly right. How about the subjective stuff? Yeah. Do you choose a direct or indirect? The indirect or the voltage?"},{"start":4921.17,"text":"Yeah, good one. Do you choose a direct flight or an indirect flight if the indirect is cheaper but the direct is more comfortable? Yeah, that's a good one, actually. So how would you capture that information? Let's say this is used by thousands of users. Could you feed something in? Yeah, I mean, you could. Could you feed something in about the user preferences? Well, you could build a data set."},{"start":4954.89,"text":"that has some of that information. So you build 10 prompts where the user is saying that I prefer direct flights because I care about my time. And then you look at the output and you actually give the example of a good output. And you probably are able to capture the performance of your agentic workflow on this specific eval."},{"start":4980.05,"text":"Does it prioritize? Does it understand price conscious? Is it price conscious, essentially, and comfort conscious? What about the tone? Let's say the LLM right now is not very friendly. How would you notice that, and how would you fix it? Yeah. Okay, have a test user run the prompt and see if there's something wrong with that. Tell me about the last step. How would you notice that something is wrong?"},{"start":5016.66,"text":"So I've got a couple of chats from the AI. I'll use the response."},{"start":5027.66,"text":"Yeah, I agree with your approach. Have LLM judges that evaluate the response against a certain rubric of what politeness looks like. So here in this case, you could actually start with error analysis. So you start, you have a thousand users and you can pull up 20 user interaction and read through it. And you might notice at first sight, the LLM seems to be very rude. It's just super..."}],"speech_gaps":[{"start":5025.62,"end":5027.26}],"frame":"../frames/v057/029.webp","frame_time":4899.07},{"title":"评估LLM应用的案例研究","segments":[{"id":481,"text":"super short in its answers and it's not very helpful, you notice that with your error analysis manually. Then you go to the next stage. You actually put evals behind it. You say, I'm going to create a set of LLM judges that are going to look at the user interaction and are going to rate how polite it is. And I'm going to give it a rubric. Then what I'm going to do is I'm going to flip my LLM. Instead of using GPT-4, I'm going to use Grok."},{"id":482,"text":"And instead of using rock, I'm using llama. And then I'm going to run those three LLMs side by side, give it to my LLM judges."},{"id":483,"text":"And then get my subjective score at the end to say, oh, X model was more polite on average. Yeah, perfectly right. That's an example of an eval that is very specific and allows you to choose between LLMs. You could actually do the same eval, not across LLMs, but fix the LLM, change the prompt. You actually, instead of saying act like a travel agent, you say act like a helpful travel agent. And then you see the influence of that word on your eval."},{"id":484,"text":"with the LLM as judges."},{"id":485,"text":"Does that make sense?"},{"id":486,"text":"All right."},{"id":487,"text":"Super."},{"id":488,"text":"So let's move forward and do a case study with evals,"},{"id":489,"text":"and then we're almost done for today."},{"id":490,"text":"Let's say your product manager asks you to build"},{"id":491,"text":"an AI agent for customer support."},{"id":492,"text":"Okay?"},{"id":493,"text":"Where do you start?"},{"id":494,"text":"And here is an example of the user prompt."},{"id":495,"text":"I need to change my shipping address for order, blah, blah, blah."},{"id":496,"text":"I move to a new address."},{"id":497,"text":"So, what would you start if I'm giving you that project?"},{"id":498,"text":"Yes?"},{"id":499,"text":"I've done research online for a system of models, and I see some research that may be popular for this model."},{"id":500,"text":"So, there's a lot of people on that."},{"id":501,"text":"Do some research, see benchmarks"},{"id":502,"text":"and how different models"},{"id":503,"text":"perform at customer support and then"},{"id":504,"text":"pick a model. That's what you mean."},{"id":505,"text":"Yeah, it's true you could do that."},{"id":506,"text":"What else could you do?"},{"id":507,"text":"Yeah."},{"id":508,"text":"Okay, yeah, I like that."},{"id":509,"text":"Try to decompose"},{"id":510,"text":"the different tasks that it will need"},{"id":511,"text":"and try to guess which ones will be more"},{"id":512,"text":"of a struggle, which ones should be fuzzy,"},{"id":513,"text":"which one should be deterministic yeah you're right yeah similar to what you said that's what"},{"id":514,"text":"i would recommend as well you say i would sit down with a customer support agent for a day or two"},{"id":515,"text":"and i would decompose the tasks they're going through i will ask them where do they struggle"},{"id":516,"text":"how much time it takes yes that's usually where you want to start with task decomposition"}],"notes":["本段讲授了如何通过构建LLM评估系统来比较不同模型的表现。首先，讲者提到在进行错误分析后，会创建一组LLM法官来评估用户交互的礼貌程度，并使用评分标准。接着，讲者提到会使用不同的LLM模型（如Grok和Llama）进行并行评估，以获得主观评分，从而选择更礼貌的模型。此外，讲者还提到可以通过修改提示词（如从“扮演旅行代理”改为“扮演有帮助的旅行代理”）来观察不同提示对评估结果的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5052.58,"end":5227.92,"asr_flags":[513],"raw_segments":[{"start":5052.58,"text":"super short in its answers and it's not very helpful, you notice that with your error analysis manually. Then you go to the next stage. You actually put evals behind it. You say, I'm going to create a set of LLM judges that are going to look at the user interaction and are going to rate how polite it is. And I'm going to give it a rubric. Then what I'm going to do is I'm going to flip my LLM. Instead of using GPT-4, I'm going to use Grok."},{"start":5081.92,"text":"And instead of using rock, I'm using llama. And then I'm going to run those three LLMs side by side, give it to my LLM judges."},{"start":5089.66,"text":"And then get my subjective score at the end to say, oh, X model was more polite on average. Yeah, perfectly right. That's an example of an eval that is very specific and allows you to choose between LLMs. You could actually do the same eval, not across LLMs, but fix the LLM, change the prompt. You actually, instead of saying act like a travel agent, you say act like a helpful travel agent. And then you see the influence of that word on your eval."},{"start":5117.32,"text":"with the LLM as judges."},{"start":5118.54,"text":"Does that make sense?"},{"start":5119.92,"text":"All right."},{"start":5121.88,"text":"Super."},{"start":5122.54,"text":"So let's move forward and do a case study with evals,"},{"start":5125.7,"text":"and then we're almost done for today."},{"start":5129.36,"text":"Let's say your product manager asks you to build"},{"start":5133.16,"text":"an AI agent for customer support."},{"start":5136.94,"text":"Okay?"},{"start":5137.78,"text":"Where do you start?"},{"start":5138.92,"text":"And here is an example of the user prompt."},{"start":5141.06,"text":"I need to change my shipping address for order, blah, blah, blah."},{"start":5144.46,"text":"I move to a new address."},{"start":5147.98,"text":"So, what would you start if I'm giving you that project?"},{"start":5159.42,"text":"Yes?"},{"start":5161.34,"text":"I've done research online for a system of models, and I see some research that may be popular for this model."},{"start":5168.14,"text":"So, there's a lot of people on that."},{"start":5172.22,"text":"Do some research, see benchmarks"},{"start":5174.4,"text":"and how different models"},{"start":5176.5,"text":"perform at customer support and then"},{"start":5178.54,"text":"pick a model. That's what you mean."},{"start":5180.28,"text":"Yeah, it's true you could do that."},{"start":5182.08,"text":"What else could you do?"},{"start":5184.16,"text":"Yeah."},{"start":5188.06,"text":"Okay, yeah, I like that."},{"start":5191.76,"text":"Try to decompose"},{"start":5194.2,"text":"the different tasks that it will need"},{"start":5195.64,"text":"and try to guess which ones will be more"},{"start":5198.04,"text":"of a struggle, which ones should be fuzzy,"},{"start":5199.76,"text":"which one should be deterministic yeah you're right yeah similar to what you said that's what"},{"start":5215.18,"text":"i would recommend as well you say i would sit down with a customer support agent for a day or two"},{"start":5219.58,"text":"and i would decompose the tasks they're going through i will ask them where do they struggle"},{"start":5223.4,"text":"how much time it takes yes that's usually where you want to start with task decomposition"}],"speech_gaps":[{"start":5184.944,"end":5186.64}],"frame":"../frames/v057/030.webp","frame_time":5064.58},{"title":"任务分解与LLM应用设计","segments":[{"id":517,"text":"decomposition so let's say we've done that work and we have this list i'm simplifying but the"},{"id":518,"text":"customer support agent human typically would extract info then look up in the database to"},{"id":519,"text":"retrieve the customer record then check the policy you know are we allowed to update the address or"},{"id":520,"text":"is it a fixed data point and then draft a response email and send the email okay so we've decomposed"},{"id":521,"text":"that task. Once you've decomposed that task, how do you design your agentic workflow?"},{"id":522,"text":"Yes."},{"id":523,"text":"exactly so to repeat i'm gonna you're gonna look at the decomposition of tasks"},{"id":524,"text":"get an instinct of what's fuzzy what's deterministic and then determine which line"},{"id":525,"text":"is going to be an llm one shot which one will require maybe a rag which one will require a tool"},{"id":526,"text":"which one will require memory, which one."},{"id":527,"text":"So you will start designing that map completely right."},{"id":528,"text":"That's also what I would recommend."},{"id":529,"text":"You might actually draft it and say,"},{"id":530,"text":"okay, I take the user prompts and..."},{"id":531,"text":"The first step of my task decomposition was extracting information. That seems to be a vanilla LLM. You can guess that the vanilla LLM would probably be good enough at extracting."},{"id":532,"text":"The user wants to change their address, and this is the order number, and this is the new address. You probably don't need too much technology there other than the LLM. The next step, it feels like you need a tool because you're actually going to have to look up in the database and also update the address. So that might be a tool, and you might have to build a custom tool for the LLM to say, let me connect you to that database, or let me give you access to that resource with an MCP."},{"id":533,"text":"After that, you probably need an LLM again to draft the email, but you would probably paste confirmation."},{"id":534,"text":"You would paste the confirmation that your address has been updated from X to Y, and then the LLM will draft an answer."},{"id":535,"text":"And of course, just to not forget, you might need a tool to send the email."},{"id":536,"text":"You might actually need to post something for the email to go out."},{"id":537,"text":"And then you'll get the output."},{"id":538,"text":"Does that make sense?"},{"id":539,"text":"That's exactly what you described."},{"id":540,"text":"okay now moving to the next step once we have decomposed our tasks then we have designed an"}],"notes":["本段讲解了如何将客户支持任务分解为多个步骤，并讨论了如何设计代理工作流。首先，人类客服代理会提取信息，然后在数据库中查找客户记录，检查政策，确认是否允许更新地址，然后起草并发送回复邮件。这些步骤被分解为不同的任务，以便后续设计代理流程。","接下来，讲者强调在任务分解后，需要判断哪些步骤可以由LLM一次性处理，哪些需要结合RAG（检索增强生成）或工具。例如，信息提取可能由LLM直接处理，而数据库查询和更新则需要工具支持。","讲者还提到，起草邮件可能再次使用LLM，但需要将确认信息粘贴进去。此外，发送邮件可能需要另一个工具，以确保邮件能够实际发出。","最后，讲者询问是否理解上述流程，并指出这正是学生所描述的内容，表明任务分解和代理流程设计是理解LLM应用的关键步骤。","讲者通过具体的例子，如地址更新流程，展示了如何将任务分解为多个步骤，并为每个步骤分配适当的处理方式，从而构建一个完整的代理工作流。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5227.92,"end":5403.84,"asr_flags":[],"raw_segments":[{"start":5227.92,"text":"decomposition so let's say we've done that work and we have this list i'm simplifying but the"},{"start":5233.92,"text":"customer support agent human typically would extract info then look up in the database to"},{"start":5240.06,"text":"retrieve the customer record then check the policy you know are we allowed to update the address or"},{"start":5246.26,"text":"is it a fixed data point and then draft a response email and send the email okay so we've decomposed"},{"start":5252.72,"text":"that task. Once you've decomposed that task, how do you design your agentic workflow?"},{"start":5279.48,"text":"Yes."},{"start":5293.54,"text":"exactly so to repeat i'm gonna you're gonna look at the decomposition of tasks"},{"start":5298.76,"text":"get an instinct of what's fuzzy what's deterministic and then determine which line"},{"start":5305.16,"text":"is going to be an llm one shot which one will require maybe a rag which one will require a tool"},{"start":5311.88,"text":"which one will require memory, which one."},{"start":5314.62,"text":"So you will start designing that map completely right."},{"start":5317.98,"text":"That's also what I would recommend."},{"start":5319.3,"text":"You might actually draft it and say,"},{"start":5321.84,"text":"okay, I take the user prompts and..."},{"start":5325.25,"text":"The first step of my task decomposition was extracting information. That seems to be a vanilla LLM. You can guess that the vanilla LLM would probably be good enough at extracting."},{"start":5338.66,"text":"The user wants to change their address, and this is the order number, and this is the new address. You probably don't need too much technology there other than the LLM. The next step, it feels like you need a tool because you're actually going to have to look up in the database and also update the address. So that might be a tool, and you might have to build a custom tool for the LLM to say, let me connect you to that database, or let me give you access to that resource with an MCP."},{"start":5368.82,"text":"After that, you probably need an LLM again to draft the email, but you would probably paste confirmation."},{"start":5374.62,"text":"You would paste the confirmation that your address has been updated from X to Y, and then the LLM will draft an answer."},{"start":5380.6,"text":"And of course, just to not forget, you might need a tool to send the email."},{"start":5385.12,"text":"You might actually need to post something for the email to go out."},{"start":5393.28,"text":"And then you'll get the output."},{"start":5394.96,"text":"Does that make sense?"},{"start":5395.96,"text":"That's exactly what you described."},{"start":5398.02,"text":"okay now moving to the next step once we have decomposed our tasks then we have designed an"}],"speech_gaps":[],"frame":"../frames/v057/031.webp","frame_time":5239.92},{"title":"LLM追踪与系统调试","segments":[{"id":541,"text":"agentic workflow around it, it took us five minutes in practice, it would take you more if you're"},{"id":542,"text":"building your startup on that, you want to make sure your task decomposition is accurate, your"},{"id":543,"text":"thing is accurate here, and then you can have a lot of work done on every tool and optimize it"},{"id":544,"text":"and latency and cost, but let's say and now we want to know how if it works, you know, and I'm"},{"id":545,"text":"I'm going to assume that you have LLM traces."},{"id":546,"text":"LLM traces are very important."},{"id":547,"text":"Actually, if you're interviewing with an AI startup,"},{"id":548,"text":"I would recommend you in the interview process to ask them,"},{"id":549,"text":"do you have LLM traces?"},{"id":550,"text":"Because if they don't have LLM traces,"},{"id":551,"text":"it is pretty hard to debug an LLM system."},{"id":552,"text":"Because you don't have visibility on the chain of complex prompts"},{"id":553,"text":"that were called and where the bug is."},{"id":554,"text":"So it's a basic sort of part of an AI startup stack"},{"id":555,"text":"stack to have LLM"},{"id":556,"text":"traces. So let's"},{"id":557,"text":"assume you have traces. How would you"},{"id":558,"text":"know if your system works?"},{"id":559,"text":"I'm going to summarize some of the things I"},{"id":560,"text":"heard earlier."},{"id":561,"text":"You gave us an example of"},{"id":562,"text":"an end-to-end metric."},{"id":563,"text":"You look at the user satisfaction at the"},{"id":564,"text":"end. You can also do"},{"id":565,"text":"a component-based approach where"},{"id":566,"text":"you actually will look at the tool,"},{"id":567,"text":"the database updates, and"},{"id":568,"text":"you will manually do an"},{"id":569,"text":"error analysis and see, oh, the tool actually always forgets to update the email. It just"},{"id":570,"text":"fails at writing. And I'm going to fix that. This is deterministic, pretty much."},{"id":571,"text":"Or when it tries to send the email and ping the system that is supposed to send the email,"},{"id":572,"text":"it doesn't send it in the right format. And so it bugs at that point. Again, you could fix that."},{"id":573,"text":"Draft of the email. DLLM doesn't do a great job. It's not very polite at drafting the email. So you could look at component by component and it's actually easier to debug than to look at it end to end. You probably do a mix of both. Another way to look at it is what is objective versus what is subjective. So for example, an objective example would be a DLLM extracted the wrong order ID."},{"id":574,"text":"The user said my order ID is X, and the LLM, when it actually pasted, looked up in the database, it used the wrong order ID. This is objectively wrong. You can actually write a Python code that checks that, checks just the alignment between what the user mentioned and what was actually pasted in the database or for the lookup. You also have subjective stuff, which we talked about, where you probably want to do either human rating or LLM as judges. It's very relevant for subjective."},{"id":575,"text":"And finally, you will find yourself having quantitative evals and more qualitative evals. So quantitative would be percentage of successful address updates. The latency, you could actually track the latency component base and see which one is the slowest."}],"notes":["本段讨论了在构建基于LLM的初创公司时，追踪LLM行为的重要性。讲师指出，LLM追踪是调试系统的关键，因为它提供了对复杂提示链的可见性，有助于定位错误。如果没有追踪，调试将变得非常困难。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5403.84,"end":5581.36,"asr_flags":[],"raw_segments":[{"start":5403.84,"text":"agentic workflow around it it took us five minutes in practice it would take you more if you're"},{"start":5408.5,"text":"building your startup on that you want to make sure your task decomposition is accurate your"},{"start":5411.78,"text":"thing is accurate here and then you can have a lot of work done on every tool and optimize it"},{"start":5417.32,"text":"and latency and cost but let's say and now we want to know how if it works you know and i'm"},{"start":5424.56,"text":"I'm going to assume that you have LLM traces."},{"start":5427.34,"text":"LLM traces are very important."},{"start":5429.48,"text":"Actually, if you're interviewing with an AI startup,"},{"start":5431.92,"text":"I would recommend you in the interview process to ask them,"},{"start":5435.54,"text":"do you have LLM traces?"},{"start":5436.84,"text":"Because if they don't have LLM traces,"},{"start":5438.76,"text":"it is pretty hard to debug an LLM system."},{"start":5441.78,"text":"Because you don't have visibility on the chain of complex prompts"},{"start":5445.76,"text":"that were called and where the bug is."},{"start":5448.82,"text":"So it's a basic sort of part of an AI startup stack"},{"start":5453.68,"text":"stack to have LLM"},{"start":5455.38,"text":"traces. So let's"},{"start":5457.46,"text":"assume you have traces. How would you"},{"start":5459.48,"text":"know if your system works?"},{"start":5463.42,"text":"I'm going to summarize some of the things I"},{"start":5465.44,"text":"heard earlier."},{"start":5467.1,"text":"You gave us an example of"},{"start":5469.26,"text":"an end-to-end metric."},{"start":5471.54,"text":"You look at the user satisfaction at the"},{"start":5473.44,"text":"end. You can also do"},{"start":5475.38,"text":"a component-based approach where"},{"start":5477.48,"text":"you actually will look at the tool,"},{"start":5479.44,"text":"the database updates, and"},{"start":5481.44,"text":"you will manually do an"},{"start":5483.36,"text":"error analysis and see, oh, the tool actually always forgets to update the email. It just"},{"start":5488.42,"text":"fails at writing. And I'm going to fix that. This is deterministic, pretty much."},{"start":5494.62,"text":"Or when it tries to send the email and ping the system that is supposed to send the email,"},{"start":5500.38,"text":"it doesn't send it in the right format. And so it bugs at that point. Again, you could fix that."},{"start":5507.58,"text":"Draft of the email. DLLM doesn't do a great job. It's not very polite at drafting the email. So you could look at component by component and it's actually easier to debug than to look at it end to end. You probably do a mix of both. Another way to look at it is what is objective versus what is subjective. So for example, an objective example would be a DLLM extracted the wrong order ID."},{"start":5534.34,"text":"The user said my order ID is X, and the LLM, when it actually pasted, looked up in the database, it used the wrong order ID. This is objectively wrong. You can actually write a Python code that checks that, checks just the alignment between what the user mentioned and what was actually pasted in the database or for the lookup. You also have subjective stuff, which we talked about, where you probably want to do either human rating or LLM as judges. It's very relevant for subjective."},{"start":5564.98,"text":"And finally, you will find yourself having quantitative evals and more qualitative evals. So quantitative would be percentage of successful address updates. The latency, you could actually track the latency component base and see which one is the slowest."}],"speech_gaps":[{"start":5461.06,"end":5462.608}],"frame":"../frames/v057/032.webp","frame_time":5415.84},{"title":"评估LLM性能与多智能体系统","segments":[{"id":576,"text":"Let's say sending the email is five seconds. It's too long, let's say. You would notice component-based or the full workflow. And then you will decide, where am I optimizing my latency and how am I going to do that? And then finally, qualitatively, you might actually do some error analysis and look at where are the hallucinations? Where are the tone mismatches?"},{"id":577,"text":"Are the users confused and by what they're confused? That would be more qualitative, and typically it would take more white-glove approaches to do that. So here's what it could look like. I gave you some examples, but you would build evals to determine objectively, subjectively, component-based, end-to-end-based, and then quantitatively and qualitatively where is your LLM failing and where it's doing well."},{"id":578,"text":"Does that give you a sense of the type of stuff you could do to improve that agenting workflow? Super. Well, that was our case study on evals. We're not going to delve deeper into it, but hopefully it gave you a sense of the type of stuff you can do with LLM judges, with objective, subjective, component-based, end-to-end, etc. Last section on multi-agent workflows. So you might ask,"},{"id":579,"text":"hey, why do we need a multi-agent workflow when the workflow already has multiple steps, already calls the LLM multiple times, already gives them tools? Why do we need multiple agents? And so many people are talking about multi-agent system online. It's not even a new thing, frankly. I mean, multi-agent system has been around for a long time. The main advantage of a multi-agent system is going to be parallelism. It's like, is there something that I wish... "},{"id":580,"text":"I would run in parallel, sort of independently, but maybe there are some sinks in the middle. But that's where you want to put a multi-agent system. It's when it's parallel. The other advantage that some companies have with multi-agent system is an agent can be reused. So let's say in a company you have an agent that's been built for design. That agent can be used in the marketing team and it can be used in the product team."},{"id":581,"text":"And so now you're optimizing an agent which has multiple stakeholders that can communicate with it and benefit from its performance. Actually, I'm going to ask you a question and take a few, maybe a minute to think about it. Let's say you were building smart home automation for your apartment or your home. What agents would you want to build?"},{"id":582,"text":"Write it down, and then I'm going to ask you in a minute to share some of the agents that you will build."}],"notes":["本段讲解了如何通过评估来改进LLM的工作流程，包括定量和定性分析。评估可以是组件级或端到端的，用于确定LLM在哪些方面表现良好或存在问题，例如幻觉和语气不匹配。","讲者提到，用户可能对系统产生困惑，这种困惑需要通过定性分析来识别。通常需要更细致的‘白手套’方法来处理。评估可以是客观的、主观的、组件级的或端到端的，以全面了解LLM的性能。","讲者指出，多智能体系统的主要优势在于并行性。当某些任务可以并行执行时，多智能体系统可以提高效率。此外，智能体可以被复用，例如设计智能体可以被营销和产品团队使用。","讲者最后提出一个实际问题，让听众思考如何构建智能家居自动化系统中的智能体。这有助于理解多智能体系统在实际应用中的设计和优化。","讲者强调，多智能体系统并不是新概念，而是已有很长历史。其核心优势在于并行处理和智能体的复用，这在实际应用中可以带来显著的效率提升。","讲者通过提问引导听众思考如何构建智能体，这有助于加深对多智能体系统在实际场景中应用的理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5581.8,"end":5755.68,"asr_flags":[],"raw_segments":[{"start":5581.8,"text":"Let's say sending the email is five seconds. It's too long, let's say. You would notice component-based or the full workflow. And then you will decide, where am I optimizing my latency and how am I going to do that? And then finally, qualitative, you might actually do some error analysis and look at where are the hallucinations? Where are the tone mismatches?"},{"start":5608.6,"text":"Are the users confused and by what they're confused? That would be more qualitative, and typically it would take more white-glove approaches to do that. So here's what it could look like. I gave you some examples, but you would build evals to determine objectively, subjectively, component-based, end-to-end-based, and then quantitatively and qualitatively where is your LLM failing and where it's doing well."},{"start":5638.77,"text":"Does that give you a sense of the type of stuff you could do to improve that agenting workflow? Super. Well, that was our case study on evals. We're not going to delve deeper into it, but hopefully it gave you a sense of the type of stuff you can do with LLM judges, with objective, subjective, component-based, end-to-end, etc. Last section on multi-agent workflows. So you might ask,"},{"start":5668.19,"text":"hey, why do we need a multi-agent workflow when the workflow already has multiple steps, already calls the LLM multiple times, already gives them tools? Why do we need multiple agents? And so many people are talking about multi-agent system online. It's not even a new thing, frankly. I mean, multi-agent system has been around for a long time. The main advantage of a multi-agent system is going to be parallelism. It's like, is there something that I wish..."},{"start":5696.89,"text":"I would run in parallel, sort of independently, but maybe there are some sinks in the middle. But that's where you want to put a multi-agent system. It's when it's parallel. The other advantage that some companies have with multi-agent system is an agent can be reused. So let's say in a company you have an agent that's been built for design. That agent can be used in the marketing team and it can be used in the product team."},{"start":5723.37,"text":"And so now you're optimizing an agent which has multiple stakeholders that can communicate with it and benefit from its performance. Actually, I'm going to ask you a question and take a few, maybe a minute to think about it. Let's say you were building smart home automation for your apartment or your home. What agents would you want to build?"},{"start":5749.56,"text":"Write it down, and then I'm going to ask you in a minute to share some of the agents that you will build."}],"speech_gaps":[],"frame":"../frames/v057/033.webp","frame_time":5593.8},{"title":"构建智能家庭的多智能体系统","segments":[{"id":583,"text":"Also, think about how you would put a hierarchy between these agents or how you would organize them or who should communicate with who."},{"id":584,"text":"Okay?"},{"id":585,"text":"Okay, take a minute for that."},{"id":586,"text":"Be creative also, because I'm going to ask all of your agents, and maybe you have an agent that nobody has thought of."},{"id":587,"text":"Okay, let's get started."},{"id":588,"text":"And who wants to give me a set of agents that you would want for your home, smart home?"},{"id":589,"text":"Yes."},{"id":590,"text":"Okay so let me repeat there are four agents I think roughly one that tracks biometric like your"},{"id":591,"text":"where are you in the home where are you moving how you're moving things like that"},{"id":592,"text":"that sort of knows your location the second one uh determines the temperature"},{"id":593,"text":"of the rooms and has the ability to change it."},{"id":594,"text":"The third one tracks energy efficiency"},{"id":595,"text":"and might give feedback on energy and energy usage."},{"id":596,"text":"It might be, I don't know,"},{"id":597,"text":"maybe it has the control over the temperature as well."},{"id":598,"text":"I don't know, actually, or the gas."},{"id":599,"text":"or the water, might cut your water at some point. And then you have an orchestrator agent. What is exactly the orchestrator doing? Okay, passes instructions. So is that the agent that communicates mainly with the user? Okay, so if I have, I'm coming back home and I'm saying I want the oven to be preheated."},{"id":600,"text":"What is exactly the orchestrator doing? Okay, passes instructions. So is that the agent that communicates mainly with the user? Okay, so if I have, I'm coming back home and I'm saying I want the oven to be preheated."}],"notes":["本段讨论了构建智能家庭多智能体系统时需要考虑的智能体层级和通信机制。讲者首先引导学生思考如何组织智能体之间的层级关系，以及谁应该与谁进行通信。接着，讲者举例说明了四种智能体：一种用于跟踪生物特征和位置，一种用于控制室温，一种用于跟踪能源效率并提供反馈，还有一种用于控制燃气和水。最后，讲者介绍了协调者智能体的作用，即主要与用户通信，并将指令传递给其他智能体。","讲者通过一个具体的例子说明了协调者智能体的功能：当用户回家并要求预热烤箱时，用户与协调者通信，协调者再将指令传递给相应的智能体。这展示了多智能体系统中智能体之间的协作机制。","讲者强调了在设计多智能体系统时需要考虑的创造性，即学生可能提出一些未被想到的智能体。这表明在实际应用中，智能体的设计需要灵活且具有创新性。","讲者提到的智能体包括生物特征追踪、温度控制、能源效率监控以及协调者，这些智能体共同构成了一个完整的智能家庭系统。这说明了多智能体系统在实际应用中的复杂性和多样性。","讲者在描述智能体功能时，使用了具体的例子，如控制燃气和水，这表明智能体不仅需要执行基本任务，还需要具备一定的决策能力。","讲者通过提问和引导，鼓励学生思考和提出自己的想法，这有助于加深对多智能体系统概念的理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5756.64,"end":5900.49,"asr_flags":[],"raw_segments":[{"start":5756.64,"text":"Also, think about how you would put a hierarchy between these agents or how you would organize them or who should communicate with who."},{"start":5763.72,"text":"Okay?"},{"start":5764.46,"text":"Okay, take a minute for that."},{"start":5768.12,"text":"Be creative also, because I'm going to ask all of your agents, and maybe you have an agent that nobody has thought of."},{"start":5778.04,"text":"Okay, let's get started."},{"start":5779.56,"text":"And who wants to give me a set of agents that you would want for your home, smart home?"},{"start":5785.76,"text":"Yes."},{"start":5816.22,"text":"okay so let me repeat there are four agents i think roughly one that tracks biometric like your"},{"start":5824.36,"text":"where are you in the home where are you moving how you're moving things like that"},{"start":5828.92,"text":"that sort of knows your location the second one uh determines the temperature"},{"start":5835.02,"text":"of the rooms and has the ability to change it."},{"start":5839.78,"text":"The third one tracks energy efficiency"},{"start":5842.3,"text":"and might give feedback on energy and energy usage."},{"start":5847.14,"text":"It might be, I don't know,"},{"start":5848.38,"text":"maybe it has the control over the temperature as well."},{"start":5850.96,"text":"I don't know, actually, or the gas."},{"start":5853.94,"text":"or the water, might cut your water at some point. And then you have an orchestrator agent. What is exactly the orchestrator doing? Okay, passes instructions. So is that the agent that communicates mainly with the user? Okay, so if I have, I'm coming back home and I'm saying I want the oven to be preheated."},{"start":5881.82,"text":"i communicate with the orchestrator and then it would funnel to another agent okay sounds good yeah so that's an example of a i want to say a hierarchical um agent multi-agent system um what else any other ideas what would you add to that yeah"}],"speech_gaps":[{"start":5788.896,"end":5790.928},{"start":5796.048,"end":5797.584},{"start":5806.256,"end":5807.792},{"start":5813.36,"end":5815.696}],"frame":"../frames/v057/034.webp","frame_time":5768.64},{"title":"多智能体系统与应用场景","segments":[{"id":601,"text":"Oh, I like that. That's a really good one. So let me summarize. You have a security agent that determines if you can enter or not. And when you enter, it understands who you are, and then it gives you certain sets of permissions that might be different depending on if you're a parent or a kid, or you might have access to certain cars and not others."},{"id":602,"text":"The kid cannot open the fridge or I don't know, like something like that. Yeah. Or, OK, I like that. That's a good one. Yeah. And it does feel like it's a complex enough workflow where you want a specific workflow tied to that. I agree. What else? Yes."},{"id":603,"text":"Well, that's really good, actually. So you mentioned two of them."},{"id":604,"text":"One is maybe an agent that has access to external APIs that can understand the weather out there, the wind, the sun, and then has control over certain devices at home, temperature, blinds, things like that, and also understands your preferences for it. That does feel like it's a good use case because you could give that to the orchestrator, but it might lose itself because it's doing too much. And also these problems are tied together, like temperature outdoor with the weather API."},{"id":605,"text":"And it might actually have access to the camera in the fridge, for example, and know your preferences and also has access to the e-commerce API to order Amazon groceries ahead of time."},{"id":606,"text":"And it might actually have access to the camera in the fridge, for example, and know your preferences and also has access to the e-commerce API to order Amazon groceries ahead of time. I agree. And maybe the orchestrator will be the communication line with the user, but it might communicate with that agent in order to get it done. Yeah, I like those. So those are all really good examples. Here is the list I had."},{"id":607,"text":"up there. So climate control, lighting, security, energy management, entertainment, notification agent, alerts about the system updates, energy saving, and orchestrator. So all of them you mentioned actually. And then..."},{"id":608,"text":"We didn't talk about the different interaction patterns,"},{"id":609,"text":"but you do have different ways to organize a multi-agent system,"},{"id":610,"text":"flat, hierarchical."},{"id":611,"text":"It sounds like this would be hierarchical."},{"id":612,"text":"I agree."},{"id":613,"text":"And the reason is UI UX."}],"notes":["本段讨论了多智能体系统在实际应用中的具体例子，包括家庭安全代理、环境控制代理、冰箱代理等。这些代理具有不同的功能和交互方式，例如安全代理负责身份验证和权限管理，环境控制代理负责调节温度和窗帘等。这些例子展示了多智能体系统如何通过分工协作完成复杂任务。","讲者提到多智能体系统可以有不同的组织结构，如扁平结构和分层结构。分层结构可能更适合需要复杂协调的任务，例如家庭智能系统中，高层代理负责协调多个子代理，而子代理负责具体任务。","讲者提到用户界面和用户体验（UI/UX）是选择分层结构的原因之一。这表明在设计多智能体系统时，需要考虑用户交互的直观性和易用性，以确保系统能够被用户有效使用。","讲者提到的冰箱代理具有访问摄像头和电子商务API的功能，这表明智能体可以集成多种传感器和外部服务，以实现更复杂的任务，如自动订购食品。","讲者提到的多智能体系统包括气候控制、照明、安全、能源管理、娱乐、通知代理和协调器等，这些代理共同构成了一个完整的家庭智能系统。","讲者提到的交互模式未详细展开，但指出多智能体系统可以有不同的组织方式，这表明在实际应用中，需要根据任务的复杂性和需求选择合适的结构。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5930.72,"end":6110.07,"asr_flags":[],"raw_segments":[{"start":5930.72,"text":"Oh, I like that. That's a really good one. So let me summarize. You have a security agent that determines if you can enter or not. And when you enter, it understands who you are, and then it gives you certain sets of permissions that might be different depending on if you're a parent or a kid, or you might have access to certain cars and not others."},{"start":5954.4,"text":"The kid cannot open the fridge or I don't know, like something like that. Yeah. Or, OK, I like that. That's a good one. Yeah. And it does feel like it's a complex enough workflow where you want a specific workflow tied to that. I agree. What else? Yes."},{"start":6008.68,"text":"Well, that's really good, actually. So you mentioned two of them."},{"start":6012.42,"text":"One is maybe an agent that has access to external APIs that can understand the weather out there, the wind, the sun, and then has control over certain devices at home, temperature, blinds, things like that, and also understands your preferences for it. That does feel like it's a good use case because you could give that to the orchestrator, but it might lose itself because it's doing too much. And also these problems are tied together, like temperature outdoor with the weather API."},{"start":6041.71,"text":"might influence the temperature inside how you want it etc okay and then the second one which i also like is you might have an agent that looks at your fridge and what's inside"},{"start":6053.52,"text":"And it might actually have access to the camera in the fridge, for example, and know your preferences and also has access to the e-commerce API to order Amazon groceries ahead of time. I agree. And maybe the orchestrator will be the communication line with the user, but it might communicate with that agent in order to get it done. Yeah, I like those. So those are all really good examples. Here is the list I had."},{"start":6080.3,"text":"up there. So climate control, lighting, security, energy management, entertainment, notification agent, alerts about the system updates, energy saving, and orchestrator. So all of them you mentioned actually. And then..."},{"start":6095.07,"text":"We didn't talk about the different interaction patterns,"},{"start":6098.05,"text":"but you do have different ways to organize a multi-agent system,"},{"start":6102.73,"text":"flat, hierarchical."},{"start":6104.55,"text":"It sounds like this would be hierarchical."},{"start":6107.17,"text":"I agree."},{"start":6108.13,"text":"And the reason is UI UX."}],"speech_gaps":[{"start":5976.54,"end":5979.088},{"start":5980.704,"end":5984.112},{"start":5992.88,"end":5994.672},{"start":5996.912,"end":5998.448},{"start":5998.896,"end":6000.768},{"start":6000.768,"end":6004.464},{"start":6004.464,"end":6006.0}],"frame":"../frames/v057/035.webp","frame_time":5942.72},{"title":"多智能体系统与LLM发展趋势","segments":[{"id":614,"text":"I would rather have to only talk to the orchestrator"},{"id":615,"text":"rather than have to go to a specialized application to do something."},{"id":616,"text":"It feels like the orchestrator could be responsible for that."},{"id":617,"text":"And so I agree."},{"id":618,"text":"I would probably go for a hierarchical setup here."},{"id":619,"text":"But maybe you might also add some connections between other agents, like in the flat system where it's all-to-all."},{"id":620,"text":"For example, with climate control and energy, if you want to connect those two, you might actually allow them to speak with each other."},{"id":621,"text":"When you allow agents to speak with each other, it is basically an MCP protocol, by the way."},{"id":622,"text":"So you treat the agent like a tool, exactly like a tool."},{"id":623,"text":"Here is how you interact with this agent."},{"id":624,"text":"Here is what it can tell you."},{"id":625,"text":"Here is what it needs from you, essentially."},{"id":626,"text":"dimension. Okay, super. And then without going into the details, there are advantages to multi-agent"},{"id":627,"text":"workflows versus single agents, such as debugging. It's easier to debug a specialized agent and to"},{"id":628,"text":"debug an entire system. Parallelization as well. It's easier to have things run in parallel"},{"id":629,"text":"and you can earn time. There are some advantages to doing that. And I leave you with this slide"},{"id":630,"text":"if you want to go deeper."},{"id":631,"text":"Super. So we've learned so many techniques to optimize LLMs from prompts to chains to fine-tuning retrieval and to multi-agent system as well. And then just to end on a couple of trends I want you to watch, I think next week is Thanksgiving. Is that it? Is Thanksgiving break? No, the week after. Okay. Well, ahead of the Thanksgiving break, so if you're traveling, you can think about these things."},{"id":632,"text":"What's next in AI? I wanted to call out a couple of trends. So Ilya Suskever, one of the EOGs of LLMs and OpenAI co-founder, raised that question about are we plateauing or not? The question of are we going to see in the coming years LLMs sort of not improve as fast as..."},{"id":633,"text":"we've seen in the past. It's been the feeling in the community probably that the last version of GPT did not bring the level of performance that people were expecting, although it did make it so much easier to use for consumers because you don't need to interact with different models. It's all under the same hood. So it seems that it's progressing, but the plateau is unclear. The way I would think about it is..."},{"id":634,"text":"The LLM scaling laws tell us that if we continue to improve compute and energy, then LLMs should continue to improve."},{"id":635,"text":"But at some point, it's going to plateau."},{"id":636,"text":"So what's going to take us to the next step?"},{"id":637,"text":"It's probably architecture search."},{"id":638,"text":"Still, a lot of LLMs, even if we don't understand what's under the hood, are probably transformer-based today."},{"id":639,"text":"But we know that the human brain does not operate the same way."},{"id":640,"text":"There's just certain things that we do that are much more efficient, much faster."},{"id":641,"text":"We don't need as much data."},{"id":642,"text":"out. So theoretically, we have so much to learn in terms of architecture search that we haven't"}],"notes":["本段讨论了多智能体系统相较于单一智能体的优势，包括调试和并行化。讲者提到，调试专用智能体和整个系统更容易，同时并行化可以节省时间。这些优势表明多智能体系统在某些应用场景中可能更有效。","讲者提到，多智能体系统在调试方面有优势，因为可以分别调试每个智能体，而单一智能体系统可能需要更复杂的调试过程。这种模块化设计有助于定位和解决问题。","并行化是多智能体系统的一个重要优势，因为多个智能体可以同时执行任务，从而节省时间。这种并行处理能力在需要高效计算的场景中尤为重要。","讲者还提到，多智能体系统在某些情况下可能比单一智能体更有效，但具体优势取决于应用场景。例如，在需要多个智能体协同工作的任务中，多智能体系统可能更合适。","讲者最后提到，多智能体系统是优化LLM技术的一部分，与其他技术如提示工程、链式结构和微调等并列。这表明多智能体系统是LLM优化策略的一个重要方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6110.53,"end":6289.68,"asr_flags":[],"raw_segments":[{"start":6110.53,"text":"I would rather have to only talk to the orchestrator"},{"start":6113.47,"text":"rather than have to go to a specialized application to do something."},{"start":6117.67,"text":"It feels like the orchestrator could be responsible for that."},{"start":6120.35,"text":"And so I agree."},{"start":6121.35,"text":"I would probably go for a hierarchical setup here."},{"start":6123.99,"text":"But maybe you might also add some connections between other agents, like in the flat system where it's all-to-all."},{"start":6130.97,"text":"For example, with climate control and energy, if you want to connect those two, you might actually allow them to speak with each other."},{"start":6137.85,"text":"When you allow agents to speak with each other, it is basically an MCP protocol, by the way."},{"start":6143.05,"text":"So you treat the agent like a tool, exactly like a tool."},{"start":6146.59,"text":"Here is how you interact with this agent."},{"start":6148.81,"text":"Here is what it can tell you."},{"start":6150.01,"text":"Here is what it needs from you, essentially."},{"start":6152.23,"text":"dimension. Okay, super. And then without going into the details, there are advantages to multi-agent"},{"start":6159.23,"text":"workflows versus single agents, such as debugging. It's easier to debug a specialized agent and to"},{"start":6166.95,"text":"debug an entire system. Parallelization as well. It's easier to have things run in parallel"},{"start":6172.05,"text":"and you can earn time. There are some advantages to doing that. And I leave you with this slide"},{"start":6178.85,"text":"if you want to go deeper."},{"start":6180.83,"text":"Super. So we've learned so many techniques to optimize LLMs from prompts to chains to fine-tuning retrieval and to multi-agent system as well. And then just to end on a couple of trends I want you to watch, I think next week is Thanksgiving. Is that it? Is Thanksgiving break? No, the week after. Okay. Well, ahead of the Thanksgiving break, so if you're traveling, you can think about these things."},{"start":6205.43,"text":"What's next in AI? I wanted to call out a couple of trends. So Ilya Suskever, one of the EOGs of LLMs and OpenAI co-founder, raised that question about are we plateauing or not? The question of are we going to see in the coming years LLMs sort of not improve as fast as..."},{"start":6229.41,"text":"we've seen in the past. It's been the feeling in the community probably that the last version of GPT did not bring the level of performance that people were expecting, although it did make it so much easier to use for consumers because you don't need to interact with different models. It's all under the same hood. So it seems that it's progressing, but the plateau is unclear. The way I would think about it is..."},{"start":6257.12,"text":"The LLM scaling laws tell us that if we continue to improve compute and energy, then LLMs should continue to improve."},{"start":6264.4,"text":"But at some point, it's going to plateau."},{"start":6265.98,"text":"So what's going to take us to the next step?"},{"start":6268.36,"text":"It's probably architecture search."},{"start":6271.06,"text":"Still, a lot of LLMs, even if we don't understand what's under the hood, are probably transformer-based today."},{"start":6276.16,"text":"But we know that the human brain does not operate the same way."},{"start":6279.6,"text":"There's just certain things that we do that are much more efficient, much faster."},{"start":6283.78,"text":"We don't need as much data."},{"start":6284.9,"text":"out. So theoretically, we have so much to learn in terms of architecture search that we haven't"}],"speech_gaps":[],"frame":"../frames/v057/036.webp","frame_time":6122.53},{"title":"增强LLM应用的工程与多模态发展","segments":[{"id":643,"text":"figured out. It's not a surprise that you see those labs hire so many engineers, because it"},{"id":644,"text":"is possible that in the next few years, you're going to have thousands of engineers trying to"},{"id":645,"text":"figure out the different engineering hacks and tactics and architectural searches that are going"},{"id":646,"text":"to lead to better models. And one of them suddenly will find the next transformer and it will reduce"},{"id":647,"text":"by 10x the need for compute and the need for energy."},{"id":648,"text":"It's sort of, if you've read Isaac Asimov's foundation series,"},{"id":649,"text":"individuals can have an amazing impact on the future"},{"id":650,"text":"because of their decisions."},{"id":651,"text":"Whoever discovered transformers had a tremendous impact"},{"id":652,"text":"on the direction of AI."},{"id":653,"text":"I think we're going to see more of that in the coming years"},{"id":654,"text":"where some group of researchers that is iterating fast"},{"id":655,"text":"might discover certain things that would suddenly unlock"},{"id":656,"text":"lock that plateau and take us to the next step"},{"id":657,"text":"and it's going to continue to improve like that."},{"id":658,"text":"And so it doesn't surprise me that there's so many"},{"id":659,"text":"companies hiring engineers right now"},{"id":660,"text":"to figure out those hacks and those"},{"id":661,"text":"techniques."},{"id":662,"text":"The other set of gains that"},{"id":663,"text":"we might see is from multimodality."},{"id":664,"text":"So the way to think about it is"},{"id":665,"text":"we've had LLMs"},{"id":666,"text":"first, text-based, and then we've added"},{"id":667,"text":"imaging. And today"},{"id":668,"text":"models are very good at images, they're"},{"id":669,"text":"very good at text. Turns out that being"},{"id":670,"text":"good at images and being good at text makes the whole model better so the fact that you're good"},{"id":671,"text":"at understanding a cat image makes you better at text as well for a cat now you add another"},{"id":672,"text":"modality like audio or video the whole system gets better so you're better at writing about a cat"},{"id":673,"text":"if you know what a cat sounds like if you can look at a cat on an image as well does that make sense"},{"id":674,"text":"so we see gains that are translated from one modality to another and that might lead in the"},{"id":675,"text":"pinnacle of robotics where all these modalities come together and suddenly the robot is better"},{"id":676,"text":"at running away from a cat because it understands what a cat is how it sounds like what it looks"},{"id":677,"text":"like etc that makes sense the other one is the multiple methods working in harmony in the"},{"id":678,"text":"tuesday lectures we've seen supervised learning unsupervised learning self-supervised learning"},{"id":679,"text":"reinforcement learning prompt engineering lags etc if you look at how babies learn"},{"id":680,"text":"it is probably a mix of those different approaches."},{"id":681,"text":"Like a baby,"},{"id":682,"text":"might have some meta-learning, meaning it has some survival instinct that is encoded in the DNA, most likely. And that's like the baby's pre-training, if you will. On top of that, the mom or the dad is pointing at stuff and saying, bad, good, bad, good, supervised learning. On top of that, the baby's falling on the ground and getting hurt, and that's a reward signal for reinforcement learning. On top of that, the baby's observing other people doing stuff or other babies."}],"notes":["本段讨论了LLM应用中工程团队的重要性，指出随着技术的发展，大量工程师将致力于寻找新的工程技巧和架构优化，以提升模型性能。其中提到，某些突破性发现（如Transformer）可能显著降低计算和能源需求。","讲者引用了阿西莫夫的《基地》系列，强调个体决策对未来的深远影响，指出Transformer的发现对AI方向产生了巨大影响，并预测未来将有更多类似突破。","讲者提到多模态（multimodality）是另一个提升模型性能的途径，通过结合文本、图像、音频和视频等不同模态，模型的整体表现会得到提升。例如，理解猫的图像有助于提升文本理解能力，而加入音频或视频模态则能进一步增强模型。","讲者将多模态与机器人技术联系起来，认为当所有模态结合时，机器人将能更好地理解环境，例如躲避猫，因为其能同时理解猫的视觉、听觉等特征。","讲者还提到，婴儿的学习过程是多种学习方法的结合，包括监督学习（父母的指导）、强化学习（通过试错获得奖励信号）和无监督学习（观察他人行为），并指出这些方法在LLM的发展中可能具有借鉴意义。","讲者强调，婴儿的学习过程涉及元学习（meta-learning），即通过DNA编码的生存本能进行预训练，这与LLM的预训练阶段有相似之处。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6289.68,"end":6456.88,"asr_flags":[],"raw_segments":[{"start":6289.68,"text":"figured out. It's not a surprise that you see those labs hire so many engineers, because it"},{"start":6295.88,"text":"is possible that in the next few years, you're going to have thousands of engineers trying to"},{"start":6299.94,"text":"figure out the different engineering hacks and tactics and architectural searches that are going"},{"start":6304.16,"text":"to lead to better models. And one of them suddenly will find the next transformer and it will reduce"},{"start":6310.34,"text":"by 10x the need for compute and the need for energy."},{"start":6314.6,"text":"It's sort of, if you've read Isaac Asimov's foundation series,"},{"start":6320.52,"text":"individuals can have an amazing impact on the future"},{"start":6323.5,"text":"because of their decisions."},{"start":6325.26,"text":"Whoever discovered transformers had a tremendous impact"},{"start":6329.54,"text":"on the direction of AI."},{"start":6331.02,"text":"I think we're going to see more of that in the coming years"},{"start":6333.4,"text":"where some group of researchers that is iterating fast"},{"start":6336.62,"text":"might discover certain things that would suddenly unlock"},{"start":6339.84,"text":"lock that plateau and take us to the next step"},{"start":6341.8,"text":"and it's going to continue to improve like that."},{"start":6343.56,"text":"And so it doesn't surprise me that there's so many"},{"start":6345.78,"text":"companies hiring engineers right now"},{"start":6347.7,"text":"to figure out those hacks and those"},{"start":6349.74,"text":"techniques."},{"start":6352.24,"text":"The other set of gains that"},{"start":6353.8,"text":"we might see is from multimodality."},{"start":6355.52,"text":"So the way to think about it is"},{"start":6357.5,"text":"we've had LLMs"},{"start":6359.72,"text":"first, text-based, and then we've added"},{"start":6361.86,"text":"imaging. And today"},{"start":6363.82,"text":"models are very good at images, they're"},{"start":6365.74,"text":"very good at text. Turns out that being"},{"start":6367.82,"text":"good at images and being good at text makes the whole model better so the fact that you're good"},{"start":6373.18,"text":"at understanding a cat image makes you better at text as well for a cat now you add another"},{"start":6378.4,"text":"modality like audio or video the whole system gets better so you're better at writing about a cat"},{"start":6384.46,"text":"if you know what a cat sounds like if you can look at a cat on an image as well does that make sense"},{"start":6388.72,"text":"so we see gains that are translated from one modality to another and that might lead in the"},{"start":6393.62,"text":"pinnacle of robotics where all these modalities come together and suddenly the robot is better"},{"start":6398.32,"text":"at running away from a cat because it understands what a cat is how it sounds like what it looks"},{"start":6403.2,"text":"like etc that makes sense the other one is the multiple methods working in harmony in the"},{"start":6409.6,"text":"tuesday lectures we've seen supervised learning unsupervised learning self-supervised learning"},{"start":6414.9,"text":"reinforcement learning prompt engineering lags etc if you look at how babies learn"},{"start":6421.78,"text":"it is probably a mix of those different approaches."},{"start":6425.28,"text":"Like a baby,"},{"start":6427.56,"text":"might have some meta-learning, meaning it has some survival instinct that is encoded in the DNA, most likely. And that's like the baby's pre-training, if you will. On top of that, the mom or the dad is pointing at stuff and saying, bad, good, bad, good, supervised learning. On top of that, the baby's falling on the ground and getting hurt, and that's a reward signal for reinforcement learning. On top of that, the baby's observing other people doing stuff or other babies."}],"speech_gaps":[],"frame":"../frames/v057/037.webp","frame_time":6301.68},{"title":"深度学习课程中的增强LLM应用趋势","segments":[{"id":683,"text":"is doing stuff unsupervised learning. You see what I mean? We're probably a mix of all these methods, and I think that's where the trend is going, is where those methods that you've seen in CS230 come together in order to build an AI system that learns fast, is low latency, is cheap, energy efficient, and makes the most out of all of these methods."},{"id":684,"text":"Finally, and this is especially true at Stanford, you have research going on that you would consider human-centric and some research that is non-human-centric."},{"id":685,"text":"By human-centric, I should say human approaches that are modeled after the brain and approaches that are not modeled after humans, because it turns out that the human body is very limiting."},{"id":686,"text":"think and so if you actually only do research on what the human brain looks like you're probably"},{"id":687,"text":"missing out on compute and energy and stuff like that that you can optimize even beyond"},{"id":688,"text":"neuronal connections in the brain but you still can learn a lot from the human brain and that's"},{"id":689,"text":"why there are professors that are running labs right now that try to understand how does back"},{"id":690,"text":"propagation work for humans and in fact it's probably that we don't have back propagation"},{"id":691,"text":"we don't use back propagation we only do forward propagation let's say so this type of stuff is"},{"id":692,"text":"interesting research that i would encourage you to read if you're curious about the direction of of"},{"id":693,"text":"ai um and then finally one thing that's going to be pretty clear i call it all the time but"},{"id":694,"text":"it's the velocity at which things are moving you're noticing part of the reason"},{"id":695,"text":"we're giving you a breath in cs230 is because these methods are changing so fast so i d
