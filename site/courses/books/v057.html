ne}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：增强 LLM 应用 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v057","title":"斯坦福CS230：增强 LLM 应用","course":"深度学习","pages":[{"title":"超越大型语言模型：增强应用与代理AI工作流","segments":[{"id":0,"text":"Hi, everyone. Welcome to another lecture for CS230 Deep Learning. Today, we're going to talk about enhancing large language model applications. And I call this lecture Beyond LLM. It has a lot of newer content."},{"id":1,"text":"And the idea behind this lecture is we started to learn about neurons, and then we learned about layers, and then we learned about deep neural networks, and then we learned a little bit about how to structure projects in C3. And now we're going one level beyond into what would it look like if you were building agentic AI systems at work."},{"id":2,"text":"In a startup, in a company. And it's probably one of the more practical lectures. Again, the goal is not to build a product end to end in the next hour or so, but rather to tell you all the techniques that..."},{"id":3,"text":"AI engineers have cracked, figured out or exploring so that after the class, you have sort of the breadth of view of different prompting techniques, different agentic workflows, multi-agency stands, evals. And then when you want to dive deeper, you have the baggage to dive deeper and learn faster about it. Okay."},{"id":4,"text":"Let's try to make it as interactive as possible, as usual. When we look at the agenda, the agenda is going to start with the core idea behind challenges and opportunities for augmenting LLMs. So we start from a base model. How do we maximize the performance of that base model? Then we dive deep into the first line of optimization, which is prompting methods. And we see a variety of"},{"id":5,"text":"of them. Then we go slightly deeper. If we were to get our hands under the hood and do some fine tuning, what would it look like? I'm not a fan of fine tuning. And I talk a lot about that, but I'll explain why I try to."},{"id":6,"text":"Avoid fine-tuning as much as possible. And then we'll do a section four on retrieval augmented generation or RAG, which you've probably heard of in the news. Maybe some of you have played with RAGs. We're going to sort of unpack what a RAG is and how it works and then the different methods within RAGs."},{"id":7,"text":"And then we talk about agentic AI workflows. I'll define it. Andrew Ng is one of the first ones who have called this trend agentic AI workflows. And so we look at the definition that Andrew gives to agentic workflows, and then we start seeing examples. The section six is very practical. It's a case study where we will..."}],"notes":["本讲讨论如何增强大型语言模型应用，讲者将其称为“Beyond LLM”。课程从神经元、网络层和深度神经网络的基础出发，进一步讨论在创业公司或企业中构建代理式 AI 系统时会用到的方法。本讲的目标是建立技术全景，便于之后继续深入，而不是在一节课内从头到尾完成一个产品。","内容首先讨论：给定一个基础模型，如何尽可能发挥它的性能。第一条优化路线是提示方法；随后讨论如果能够修改模型内部、进行微调，会涉及什么。讲者表达了自己倾向于尽量避免微调，并预告稍后解释原因；这里还没有给出这一取舍的详细论证。","另一条路线是检索增强生成（Retrieval-Augmented Generation，RAG）。讲者预告会拆解 RAG 的含义、工作方式及不同做法。接着介绍代理式 AI 工作流。讲者将 Andrew Ng 描述为较早以这一名称概括该趋势的人之一，并计划结合其定义和具体例子展开。","这段主要是课程导入和议程说明，尚未进入具体算法推导，因此不列数学公式。阅读时先分清模型本身的改进、提示方法、外部检索和代理工作流几条路线，后续再结合相应时段理解各自的作用。"],"formulas":[],"uncertainties":["原始识别中的“C3”可能是课程名称或编号的误识别；本页中文说明未将其作为确定名称。"],"diagram":"none","start":1.33,"end":178.5,"asr_flags":[],"raw_segments":[{"start":1.33,"text":"Hi, everyone. Welcome to another lecture for CS230 Deep Learning. Today, we're going to talk about enhancing large language model applications. And I call this lecture Beyond LLM. It has a lot of newer content."},{"start":22.93,"text":"And the idea behind this lecture is we started to learn about neurons, and then we learned about layers, and then we learned about deep neural networks, and then we learned a little bit about how to structure projects in C3. And now we're going one level beyond into what would it look like if you were building agentic AI systems at work."},{"start":50.69,"text":"in a startup, in a company. And it's probably one of the more practical lectures. Again, the goal is not to build a product end to end in the next hour or so, but rather to tell you all the techniques that..."},{"start":67.04,"text":"AI engineers have cracked, figured out or exploring so that after the class, you have sort of the breadth of view of different prompting techniques, different agentic workflows, multi-agency stands, evals. And then when you want to dive deeper, you have the baggage to dive deeper and learn faster about it. Okay."},{"start":88.61,"text":"let's try to make it as interactive as possible, as usual. When we look at the agenda, the agenda is going to start with the core idea behind challenges and opportunities for augmenting LLMs. So we start from a base model. How do we maximize the performance of that base model? Then we dive deep into the first line of optimization, which is prompting methods. And we see a variety of"},{"start":117.87,"text":"of them. Then we go slightly deeper. If we were to get our hands under the hood and do some fine tuning, what would it look like? I'm not a fan of fine tuning. And I talk a lot about that, but I'll explain why I try to."},{"start":131.34,"text":"avoid fine-tuning as much as possible. And then we'll do a section four on retrieval augmented generation or RAG, which you've probably heard of in the news. Maybe some of you have played with RAGs. We're going to sort of unpack what a RAG is and how it works and then the different methods within RAGs."},{"start":153.24,"text":"And then we talk about agentic AI workflows. I'll define it. Andrew Ng is one of the first ones who have called this trend agentic AI workflows. And so we look at the definition that Andrew gives to agentic workflows, and then we start seeing examples. The section six is very practical. It's a case study where we will..."}],"speech_gaps":[],"frame":"../frames/v057/001.webp","frame_time":13.33},{"title":"增强LLM应用的挑战","segments":[{"id":8,"text":"Think about an agentic workflow and I'll ask you to measure if the agent actually works. And we brainstorm how we can measure if an agentic workflow is working the way you want it to work. There's plenty of methods called evals that..."},{"id":9,"text":"solve that problem. And then we look briefly at multi-agent workflow, and then we can have a sort of open-ended discussion where I share some thoughts on what's next in AI. And I'm looking forward to hearing from you all as well on that one. Okay, so let's get started with the problem of augmenting LLM. So open-ended question for you."},{"id":10,"text":"You are all familiar with pre-trained models like GPT 3.5 Turbo or GPT 4.0. What's the limitation of using just a base model? What are the typical issues that might arise as you're using a vanilla pre-trained model? Yes."},{"id":11,"text":"Lack some domain knowledge. You're perfectly right."},{"id":12,"text":"We had a group of students a few years ago, it was not LLM related,"},{"id":13,"text":"but they were building an autonomous farming device or vehicle"},{"id":14,"text":"that had a camera underneath taking pictures of crops"},{"id":15,"text":"to determine if the crop is sick or not, if it should be thrown away,"},{"id":16,"text":"if it should be used or not."},{"id":17,"text":"and that data set"},{"id":18,"text":"is not a data set you find out there"},{"id":19,"text":"and the base model"},{"id":20,"text":"or a pre-trained computer"},{"id":21,"text":"vision model would lack that knowledge"},{"id":22,"text":"of course. What else?"},{"id":23,"text":"Yes?"},{"id":24,"text":"I'm sorry to interrupt"},{"id":25,"text":"but in reality"},{"id":26,"text":"the pictures are very dark"},{"id":27,"text":"Okay, maybe"},{"id":28,"text":"you're saying, so just to"},{"id":29,"text":"repeat for people online"},{"id":30,"text":"you're saying the model might have been trained"},{"id":31,"text":"on high quality data, but the data"},{"id":32,"text":"in the wild is actually not that high quality."},{"id":33,"text":"And in fact, yes, the distribution"},{"id":34,"text":"of the real world might differ"},{"id":35,"text":"as we've seen with GANs"},{"id":36,"text":"from the training sets."},{"id":37,"text":"And that might create an issue with pre-trained"},{"id":38,"text":"models, although pre-trained LLMs"},{"id":39,"text":"are getting better at"},{"id":40,"text":"handling all sorts of data"},{"id":41,"text":"inputs. Yes?"},{"id":42,"text":"Like what?"},{"id":43,"text":"Lacks current information."},{"id":44,"text":"The LLM is not up to date."},{"id":45,"text":"And in fact, you're right. Imagine you have to retrain from scratch your LLM every couple of months."},{"id":46,"text":"One story that I found funny, it's from probably three years ago or maybe more, five years ago, where during his first presidency, President Trump one day tweeted,"},{"id":47,"text":"You remember that tweet or?"},{"id":48,"text":"just covfefe and it was probably a typo or it was in his pocket i don't know but that word"}],"notes":["课堂中提到一个实际案例，即学生团队开发的自主农业设备，该设备使用摄像头拍摄作物图像以判断作物是否健康。由于实际数据质量不高，基础模型无法准确识别作物状态，这说明了模型在现实数据分布与训练数据分布不一致时的局限性。","讲者以特朗普的“covfefe”推文为例，说明了模型无法获取最新信息的问题。该例子表明，如果模型没有及时更新，可能会产生错误或不相关的输出。"],"formulas":[],"uncertainties":["i don't know but that word"],"diagram":"none","start":179.07,"end":357.93,"asr_flags":[],"raw_segments":[{"start":179.07,"text":"Think about an agentic workflow and I'll ask you to measure if the agent actually works. And we brainstorm how we can measure if an agentic workflow is working the way you want it to work. There's plenty of methods called evals that..."},{"start":196.58,"text":"solve that problem. And then we look briefly at multi-agent workflow, and then we can have a sort of open-ended discussion where I share some thoughts on what's next in AI. And I'm looking forward to hearing from you all as well on that one. Okay, so let's get started with the problem of augmenting LLM. So open-ended question for you."},{"start":220.44,"text":"You are all familiar with pre-trained models like GPT 3.5 Turbo or GPT 4.0. What's the limitation of using just a base model? What are the typical issues that might arise as you're using a vanilla pre-trained model? Yes."},{"start":246.43,"text":"Lack some domain knowledge. You're perfectly right."},{"start":248.87,"text":"We had a group of students a few years ago, it was not LLM related,"},{"start":253.69,"text":"but they were building an autonomous farming device or vehicle"},{"start":260.47,"text":"that had a camera underneath taking pictures of crops"},{"start":263.87,"text":"to determine if the crop is sick or not, if it should be thrown away,"},{"start":268.97,"text":"if it should be used or not."},{"start":271.55,"text":"and that data set"},{"start":273.87,"text":"is not a data set you find out there"},{"start":276.45,"text":"and the base model"},{"start":278.39,"text":"or a pre-trained computer"},{"start":280.39,"text":"vision model would lack that knowledge"},{"start":282.39,"text":"of course. What else?"},{"start":285.47,"text":"Yes?"},{"start":286.33,"text":"I'm sorry to interrupt"},{"start":288.25,"text":"but in reality"},{"start":289.61,"text":"the pictures are very dark"},{"start":292.43,"text":"Okay, maybe"},{"start":293.83,"text":"you're saying, so just to"},{"start":295.99,"text":"repeat for people online"},{"start":297.95,"text":"you're saying the model might have been trained"},{"start":300.21,"text":"on high quality data, but the data"},{"start":302.25,"text":"in the wild is actually not that high quality."},{"start":304.37,"text":"And in fact, yes, the distribution"},{"start":306.03,"text":"of the real world might differ"},{"start":308.23,"text":"as we've seen with GANs"},{"start":310.23,"text":"from the training sets."},{"start":312.09,"text":"And that might create an issue with pre-trained"},{"start":314.17,"text":"models, although pre-trained LLMs"},{"start":316.15,"text":"are getting better at"},{"start":318.15,"text":"handling all sorts of data"},{"start":320.05,"text":"inputs. Yes?"},{"start":322.71,"text":"Like what?"},{"start":326.21,"text":"Lacks current information."},{"start":328.33,"text":"The LLM is not up to date."},{"start":330.21,"text":"And in fact, you're right. Imagine you have to retrain from scratch your LLM every couple of months."},{"start":335.75,"text":"One story that I found funny, it's from probably three years ago or maybe more, five years ago, where during his first presidency, President Trump one day tweeted,"},{"start":349.39,"text":"You remember that tweet or?"},{"start":352.07,"text":"just covfefe and it was probably a typo or it was in his pocket i don't know but that word"}],"speech_gaps":[],"frame":"../frames/v057/002.webp","frame_time":191.07},{"title":"LLM在社交媒体趋势中的挑战与控制问题","segments":[{"id":49,"text":"did not exist the llms in fact that twitter was running at the time could not recognize that word"},{"id":50,"text":"and so the recommender system sort of went wild because suddenly everybody was making fun of that"},{"id":51,"text":"tweet using the word covfefe and the llm was so confused on you know what does that mean where"},{"id":52,"text":"Where should we show it?"},{"id":53,"text":"To whom should we show it?"},{"id":54,"text":"And this is an example of nowadays, especially on social media, there are so many new trends."},{"id":55,"text":"And it's very hard to retrain an LLM to match the new trend and understand the new words out there."},{"id":56,"text":"I mean, you know, you oftentimes hear Gen Z words like RIS or MID or whatever."},{"id":57,"text":"I don't know all of them."},{"id":58,"text":"but you probably want to find a way that can allow the LLM to understand those trends"},{"id":59,"text":"without retraining the llm from scratch."},{"id":60,"text":"What else?"},{"id":61,"text":"It's trained on breadth of knowledge, and if you wanted to do some specialized, that might work."},{"id":62,"text":"Yeah, it might be trained on a breadth of knowledge,"},{"id":63,"text":"but it might fail or not perform adequately on a narrow task that is very well-defined."},{"id":64,"text":"I think about enterprise applications that, yeah, enterprise application, you need high precision, high fidelity, low latency, and maybe the model is not great at that specific thing."},{"id":65,"text":"It might do fine, but just not good enough."},{"id":66,"text":"And you might want to augment it in a certain way."},{"id":67,"text":"Yeah."},{"id":68,"text":"So maybe it has a lot of broad domain knowledge that might not be needed for."},{"id":69,"text":"your application. And so you're using a massive heavy model when you actually are only using 2%"},{"id":70,"text":"of the model capability. You're perfectly right. You might not need all of it. So you might"},{"id":71,"text":"find ways to prune, quantize the model, modify it. All of these are good points."},{"id":72,"text":"I'm going to add a few more as well. LLMs are very difficult to control. Your last point is"},{"id":73,"text":"actually an example of that. You want to control the LLM to use a part of it."},{"id":74,"text":"knowledge, but it's not. It's in fact getting confused. We've seen that in history. In 2016, Microsoft created a notorious Twitter bot that learned from users and it quickly became a racist jerk. Microsoft ended up removing the bot 16 hours after launching it. The community was really fast at determining that this was a racist bot."},{"id":75,"text":"And you can empathize with Microsoft in the sense that it is actually hard to control an LLM. They might have done a better job to qualify before launching, but it is really hard to control an LLM. Even more recently, this is a tweet from Sam Altman last November, where there was this debate between Elon Musk and Sam Altman on whose LLM is the left-wing propaganda machine or the right-wing propaganda machine. And they were hating on each other."}],"notes":["讲者指出，LLM的控制难度很大，例如微软2016年创建的Twitter机器人在短时间内变得具有攻击性，说明LLM在训练和部署过程中需要更严格的控制和验证。","讲者还提到，LLM可能被用于政治立场的传播，如马斯克和阿尔特曼之间的争论，这表明LLM的偏见和立场问题需要进一步研究。"],"formulas":[],"uncertainties":[],"diagram":"none","start":357.93,"end":534.45,"asr_flags":[67],"raw_segments":[{"start":357.93,"text":"did not exist the llms in fact that twitter was running at the time could not recognize that word"},{"start":363.89,"text":"and so the recommender system sort of went wild because suddenly everybody was making fun of that"},{"start":370.59,"text":"tweet using the word covfefe and the llm was so confused on you know what does that mean where"},{"start":376.33,"text":"Where should we show it?"},{"start":377.25,"text":"To whom should we show it?"},{"start":378.47,"text":"And this is an example of nowadays, especially on social media, there are so many new trends."},{"start":385.55,"text":"And it's very hard to retrain an LLM to match the new trend and understand the new words out there."},{"start":390.93,"text":"I mean, you know, you oftentimes hear Gen Z words like RIS or MID or whatever."},{"start":396.41,"text":"I don't know all of them."},{"start":397.33,"text":"but you probably want to find a way that can allow the LLM to understand those trends"},{"start":404.15,"text":"without retraining the LLM from scratch."},{"start":407.21,"text":"What else?"},{"start":409.69,"text":"It's trained on breadth of knowledge, and if you wanted to do some specialized, that might work."},{"start":415.87,"text":"Yeah, it might be trained on a breadth of knowledge,"},{"start":418.45,"text":"but it might fail or not perform adequately on a narrow task that is very well-defined."},{"start":424.29,"text":"I think about enterprise applications that, yeah, enterprise application, you need high precision, high fidelity, low latency, and maybe the model is not great at that specific thing."},{"start":436.51,"text":"It might do fine, but just not good enough."},{"start":438.45,"text":"And you might want to augment it in a certain way."},{"start":440.97,"text":"Yeah."},{"start":449.21,"text":"So maybe it has a lot of broad domain knowledge that might not be needed for."},{"start":454.29,"text":"your application. And so you're using a massive heavy model when you actually are only using 2%"},{"start":459.45,"text":"of the model capability. You're perfectly right. You might not need all of it. So you might"},{"start":463.19,"text":"find ways to prune, quantize the model, modify it. All of these are good points."},{"start":469.21,"text":"I'm going to add a few more as well. LLMs are very difficult to control. Your last point is"},{"start":475.83,"text":"actually an example of that. You want to control the LLM to use a part of it."},{"start":479.08,"text":"knowledge, but it's not. It's in fact getting confused. We've seen that in history. In 2016, Microsoft created a notorious Twitter bot that learned from users and it quickly became a racist jerk. Microsoft ended up removing the bot 16 hours after launching it. The community was really fast at determining that this was a racist bot."},{"start":505.05,"text":"And you can empathize with Microsoft in the sense that it is actually hard to control an LLM. They might have done a better job to qualify before launching, but it is really hard to control an LLM. Even more recently, this is a tweet from Sam Altman last November, where there was this debate between Elon Musk and Sam Altman on whose LLM is the left-wing propaganda machine or the right-wing propaganda machine. And they were hating on each other."}],"speech_gaps":[{"start":441.39,"end":443.92}],"frame":"../frames/v057/003.webp","frame_time":369.93},{"title":"LLM在实际应用中的挑战","segments":[{"id":76,"text":"other's LLMs. But that tells you at the end of the day that even those two teams, Grok and OpenAI, which are probably the best funded team with a lot of talent, are not doing a great job at controlling their LLMs. And from time to time, if you hang out on X, you might see..."},{"id":77,"text":"screenshots of users interacting with LLMs and the LLMs saying something really controversial or racist or something that would not be considered great by social standards, I guess. And that tells you that the model is really hard to control."},{"id":78,"text":"The second aspect of it is something that you've mentioned earlier. LLMs may underperform in your task. And that might include specific knowledge gaps, such as medical diagnosis. If you're doing medical diagnosis, you would rather have an LLM that is specialized for that and is great at it. And in fact, something that we haven't mentioned as a group has sources. So the answer is sourced specifically."},{"id":79,"text":"you have a hard time believing something unless you have the actual source of the research that backs it up inconsistencies in style and format so imagine you're building a legal ai"},{"id":80,"text":"agentic workflow. Legal has a very specific way to write and read where every word counts. If you're negotiating a large contract, every word on that contract might mean something else when it comes to the court. And so it's very important that you use an LLM that is very good at it."},{"id":81,"text":"The precision matters. And then, you know, task specific understanding, such as doing a classification on a niche field. Here, I pulled an example where, you know, let's say a biotech product is trying to use an LLM to categorize user reviews into positive, neutral or negative. You know, maybe for that company, something that's..."},{"id":82,"text":"would be considered a negative review typically is actually considered a neutral review because the NPS of that industry tends to be way lower than other industries, let's say. That's a task-specific understanding and the LLM needs to be aligned to what the company believes is the categorization that it wants. We will see an example of how to solve that problem in a second."},{"id":83,"text":"And then limited context handling. A lot of AI applications, especially in the enterprise, have required data that has a lot of context."}],"notes":["本段讨论了LLM在实际应用中面临的挑战，特别是其控制性和任务特定理解能力的重要性。讲者指出，即使像Grok和OpenAI这样资金和人才充足的团队，也难以完全控制其LLM，这表明LLM的控制是一个复杂的问题。此外，讲者提到，LLM在特定任务上的表现可能不足，例如医疗诊断，需要专门化的模型。","讲者进一步强调了任务特定理解的重要性，特别是在法律和生物技术等专业领域。例如，在法律领域，合同中的每一个词都可能具有法律意义，因此需要高度精确的LLM。而在生物技术领域，用户评论的分类可能因行业标准不同而有所不同，这需要LLM能够理解并适应特定的分类标准。","讲者还提到，LLM在处理有限上下文时的挑战，特别是在企业应用中，数据通常包含大量上下文信息。这表明，LLM需要具备处理复杂上下文的能力，以满足实际应用的需求。","讲者通过一个生物技术公司的例子，说明了任务特定理解的重要性。该公司可能需要将用户评论分类为正面、中性或负面，但由于该行业的NPS较低，通常被视为负面的评论可能实际上应被归类为中性。这表明，LLM需要根据公司的具体需求进行调整。","讲者还提到，LLM在处理不一致的风格和格式时的困难，特别是在构建法律AI时。法律文本的风格和格式非常特定，因此需要高度精确的LLM来确保输出的准确性和一致性。","最后，讲者指出，LLM在实际应用中需要具备处理复杂任务和上下文的能力，这需要模型的精确性和任务特定的理解能力。"],"formulas":[],"uncertainties":["inconsistencies in style and format so imagine you're building a legal ai"],"diagram":"none","start":534.44,"end":688.28,"asr_flags":[],"raw_segments":[{"start":534.44,"text":"other's LLMs. But that tells you at the end of the day that even those two teams, Grok and OpenAI, which are probably the best funded team with a lot of talent, are not doing a great job at controlling their LLMs. And from time to time, if you hang out on X, you might see..."},{"start":554.34,"text":"screenshots of users interacting with LLMs and the LLMs saying something really controversial or racist or something that would not be considered great by social standards, I guess. And that tells you that the model is really hard to control."},{"start":575.17,"text":"The second aspect of it is something that you've mentioned earlier. LLMs may underperform in your task. And that might include specific knowledge gaps, such as medical diagnosis. If you're doing medical diagnosis, you would rather have an LLM that is specialized for that and is great at it. And in fact, something that we haven't mentioned as a group has sources. So the answer is sourced specifically."},{"start":599.52,"text":"you have a hard time believing something unless you have the actual source of the research that backs it up inconsistencies in style and format so imagine you're building a legal ai"},{"start":611.32,"text":"agentic workflow. Legal has a very specific way to write and read where every word counts. If you're negotiating a large contract, every word on that contract might mean something else when it comes to the court. And so it's very important that you use an LLM that is very good at it."},{"start":630.13,"text":"The precision matters. And then, you know, task specific understanding, such as doing a classification on a niche field. Here, I pulled an example where, you know, let's say a biotech product is trying to use an LLM to categorize user reviews into positive, neutral or negative. You know, maybe for that company, something that's..."},{"start":654.56,"text":"would be considered a negative review typically is actually considered a neutral review because the NPS of that industry tends to be way lower than other industries, let's say. That's a task-specific understanding and the LLM needs to be aligned to what the company believes is the categorization that it wants. We will see an example of how to solve that problem in a second."},{"start":677.22,"text":"And then limited context handling. A lot of AI applications, especially in the enterprise, have required data that has a lot of context."}],"speech_gaps":[],"frame":"../frames/v057/004.webp","frame_time":546.44},{"title":"LLM在知识管理与上下文处理中的局限性","segments":[{"id":84,"text":"Just to give you a simple example, knowledge management is an important space that enterprises buy a lot of knowledge management tools. When you go on your drive and you have all your documents, ideally, you could have an LLM running on top of that drive. You can ask any question and it will read immediately thousands of documents and answer, what was our Q4 performance in sales? It was X dollars. It finds it super quickly. In practice, because LLMs do not have"},{"id":85,"text":"a large enough context, you cannot use a standalone vanilla pre-trained LLM to solve that problem. You will have to augment it. Does that make sense? The other aspect around context windows is they are in fact limited. If you look at the context windows of the models from the last five years,"},{"id":86,"text":"Even the best models today will range in context window or number of tokens it can take as input somewhere in the hundreds of thousands of tokens max. Just to give you a sense, 200,000 tokens is roughly two books."},{"id":87,"text":"So that's how much you can upload and it can read, pretty much. And you can imagine that when you're dealing with video understanding or heavier data files, that is, of course, an issue. So you might have to chunk it, you might have to embed it, you might have to find other ways to get the LLM to handle larger contexts."},{"id":88,"text":"The attention mechanism is also powerful but problematic because it does not do a great job at attending in very large contexts. There is actually an interesting problem called needle in a haystack. It's an AI problem or call it a benchmark where..."},{"id":89,"text":"In order to test if your LLM is good at attending, at putting attention on a very specific fact within a large corpus, researchers might randomly insert in a book one sentence that"},{"id":90,"text":"that outlines a certain fact, such as Arun and Max are having coffee at Blue Bottle in the middle of the Bible, let's say, or some very long text. And then you ask the LLM, what were Arun and Max having?"},{"id":91,"text":"at Blue Bottle, and you see if it remembers AWS Coffee. It's actually a complex problem, not because the question is complex, but because you're asking the model to find a fact within a very large corpus, and that's complicated. So again, this is a limiting factor for LLMs. We'll talk about RAG in a second, but I want to preview, you know, there is debates around whether RAG is the right long-term approach for AI systems. So as a high-level idea,"}],"notes":["本段讲授了LLM在知识管理中的应用及其局限性。企业购买知识管理工具，理想情况下可以将LLM部署在存储设备上，通过提问快速检索大量文档。然而，LLM的上下文窗口有限，无法处理大量数据，因此需要进行增强处理。","上下文窗口的大小是LLM处理能力的重要限制因素。即使是最先进的模型，其最大上下文窗口也仅在数十万token左右，相当于两本书的长度。这在处理视频理解或大型数据文件时尤为明显，需要进行分块、嵌入或其他方法来扩展上下文处理能力。","注意力机制虽然强大，但在处理非常大的上下文时表现不佳。一个典型的例子是“needle in a haystack”问题，即在庞大的文本中寻找特定事实。研究人员通过在长文本中随机插入特定句子来测试LLM的注意力能力。","这种测试方法并不复杂，但挑战在于模型需要在庞大的语料库中找到特定信息。这表明LLM在处理大规模数据时存在局限性，是当前研究的一个重要方向。","此外，本段还提到检索增强生成（RAG）作为解决LLM上下文限制的一种方法，但关于RAG是否是长期解决方案仍存在争议。"],"formulas":[],"uncertainties":[],"diagram":"none","start":689.47,"end":867.41,"asr_flags":[],"raw_segments":[{"start":689.47,"text":"Just to give you a simple example, knowledge management is an important space that enterprises buy a lot of knowledge management tools. When you go on your drive and you have all your documents, ideally, you could have an LLM running on top of that drive. You can ask any question and it will read immediately thousands of documents and answer, what was our Q4 performance in sales? It was X dollars. It finds it super quickly. In practice, because LLMs do not have"},{"start":718.85,"text":"a large enough context, you cannot use a standalone vanilla pre-trained LLM to solve that problem. You will have to augment it. Does that make sense? The other aspect around context windows is they are in fact limited. If you look at the context windows of the models from the last five years,"},{"start":739.48,"text":"Even the best models today will range in context window or number of tokens it can take as input somewhere in the hundreds of thousands of tokens max. Just to give you a sense, 200,000 tokens is roughly two books."},{"start":758.78,"text":"So that's how much you can upload and it can read, pretty much. And you can imagine that when you're dealing with video understanding or heavier data files, that is, of course, an issue. So you might have to chunk it, you might have to embed it, you might have to find other ways to get the LLM to handle larger contexts."},{"start":782.04,"text":"The attention mechanism is also powerful but problematic because it does not do a great job at attending in very large contexts. There is actually an interesting problem called needle in a haystack. It's an AI problem or call it a benchmark where..."},{"start":802.56,"text":"In order to test if your LLM is good at attending, at putting attention on a very specific fact within a large corpus, researchers might randomly insert in a book one sentence that"},{"start":818.86,"text":"that outlines a certain fact, such as Arun and Max are having coffee at Blue Bottle in the middle of the Bible, let's say, or some very long text. And then you ask the LLM, what were Arun and Max having?"},{"start":837.33,"text":"at Blue Bottle, and you see if it remembers AWS Coffee. It's actually a complex problem, not because the question is complex, but because you're asking the model to find a fact within a very large corpus, and that's complicated. So again, this is a limiting factor for LLMs. We'll talk about RAG in a second, but I want to preview, you know, there is debates around whether RAG is the right long-term approach for AI systems. So as a high-level idea,"}],"speech_gaps":[],"frame":"../frames/v057/005.webp","frame_time":701.47},{"title":"RAG机制与LLM应用的讨论","segments":[{"id":92,"text":"A RAG is a mechanism, if you will, that embeds documents that an LLM can retrieve and then add as context to its initial prompt and answer a question. It has lots of applications. Knowledge management is an example. So imagine you have your drive again, but every document is sort of compressed in representation and the LLM has access to that lower dimensional representation."},{"id":93,"text":"The debate that this tweet from Yaufu outlines is, in theory, if we have infinite computes, then RAG is useless. Because you can just read..."},{"id":94,"text":"a massive corpus immediately and answer your question but even in that case latency might be an issue imagine the time it takes for an ai to read all your drive every single time you ask a question it doesn't make sense so rag has other advantages beyond even the accuracy on top of that the sourcing matters as well so it might drag allows you to source we'll talk"},{"id":95,"text":"We'll talk about all that later. But there's always this debate in the community whether a certain method is actually future-proof. Because in practice, as compute power doubles every year, let's say, some of the methods we're learning right now might not be relevant three years from now. We don't know, essentially."},{"id":96,"text":"And the analogy that he makes on context windows and why RAG approaches might be relevant even a long time from now is search. When you search on a search engine, you still find sources of information. And in fact, in the background, there is very detailed traversal algorithms that rank and find the specific links that might be the best to present you versus if you had to read, imagine,"},{"id":97,"text":"you had to read the entire web every single time you're doing a search query without being able to narrow to a certain portion of the space that might, again, not be reasonable."},{"id":98,"text":"Okay. When we're thinking of improving LLMs, the easiest way we think of it is two dimensions. One dimension is we are going to improve the foundation model itself. So, for example, we move from GPT 3.5 Turbo to GPT 4 to GPT 4.0 to GPT 5. Each of that is supposed to improve the base model. GPT 5 is another debate because it's sort of,"}],"notes":["本段讨论了RAG（检索增强生成）机制的局限性，指出即使在无限计算资源的情况下，RAG仍然具有优势。例如，延迟问题和信息源的重要性，使得RAG在实际应用中仍然有价值。","讲者提到，RAG的优势不仅限于准确性，还包括信息源的可追溯性。这表明RAG在需要可靠信息来源的场景中具有独特价值。","讲者通过搜索引擎的类比，说明RAG在信息检索中的重要性。即使在计算资源充足的情况下，直接读取全部数据仍然不可行，而RAG可以有效缩小搜索范围。","讲者指出，随着计算能力的提升，某些方法可能在未来变得不相关。这表明技术发展和方法论的更新是持续的过程。","讲者提到，改进LLM的思路包括提升基础模型本身，例如从GPT 3.5 Turbo到GPT 4等版本的迭代。这表明模型性能的提升是LLM发展的核心方向之一。","讲者提到GPT 5的讨论，暗示模型迭代是一个持续的过程，且每个版本的改进都可能带来新的挑战和讨论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":868.19,"end":1026.09,"asr_flags":[],"raw_segments":[{"start":868.19,"text":"A RAG is a mechanism, if you will, that embeds documents that an LLM can retrieve and then add as context to its initial prompt and answer a question. It has lots of applications. Knowledge management is an example. So imagine you have your drive again, but every document is sort of compressed in representation and the LLM has access to that lower dimensional representation."},{"start":895.02,"text":"The debate that this tweet from Yaufu outlines is, in theory, if we have infinite computes, then RAG is useless. Because you can just read..."},{"start":908.24,"text":"a massive corpus immediately and answer your question but even in that case latency might be an issue imagine the time it takes for an ai to read all your drive every single time you ask a question it doesn't make sense so rag has other advantages beyond even the accuracy on top of that the sourcing matters as well so it might drag allows you to source we'll talk"},{"start":932.74,"text":"We'll talk about all that later. But there's always this debate in the community whether a certain method is actually future-proof. Because in practice, as compute power doubles every year, let's say, some of the methods we're learning right now might not be relevant three years from now. We don't know, essentially."},{"start":955.79,"text":"And the analogy that he makes on context windows and why RAG approaches might be relevant even a long time from now is search. When you search on a search engine, you still find sources of information. And in fact, in the background, there is very detailed traversal algorithms that rank and find the specific links that might be the best to present you versus if you had to read, imagine,"},{"start":985.39,"text":"you had to read the entire web every single time you're doing a search query without being able to narrow to a certain portion of the space that might, again, not be reasonable."},{"start":997.83,"text":"Okay. When we're thinking of improving LLMs, the easiest way we think of it is two dimensions. One dimension is we are going to improve the foundation model itself. So, for example, we move from GPT 3.5 Turbo to GPT 4 to GPT 4.0 to GPT 5. Each of that is supposed to improve the base model. GPT 5 is another debate because it's sort of,"}],"speech_gaps":[],"frame":"../frames/v057/006.webp","frame_time":880.19},{"title":"LLM 应用与提示工程","segments":[{"id":99,"text":"packaging other models within itself, but you know if you're thinking about 3.5 and 4.0, that's really what it is. The pre-trained model improves, and so you should see your performance improve on your tasks. But the other dimension is we can actually engineer and leverage the LLM in a way that makes it better. So you can prompt simply GPT 4.0, you can"},{"id":100,"text":"change some prompts and improve the prompt, and it will improve the performance. It's shown. You can even put a RAG around it. You can put an agentic workflow around it. You can even put a multi-agent system around it. And that is another dimension for you to improve performance. So that's how I want you to think about it. Which LLM I'm using, and then how can I maximize the performance of that LLM? This lecture is about the vertical axis. Those are the methods that we will see together."},{"id":101,"text":"Sounds good for the introduction. So let's move to prompt engineering. I'm going to start with an interesting study just to motivate why prompt engineering matters. There is a study from HPS, UPenn."},{"id":102,"text":"as well as Harvard Business School and others also involved Wharton that took a subset of BCG consultants, individual contributors, split them into three groups. One group had no access to AI. One group had access to... "},{"id":103,"text":"I think it was GPT-4. And then one group had access to the LLM, but also a training on how to prompt better. And then they observed the performance of these consultants across a wide variety of tasks. There's a few things that they noticed that I thought was interesting. One is something they call the jagged frontier, meaning that certain tasks that consultants are doing fall."},{"id":104,"text":"beyond the JAG frontier, meaning AI is not good enough. It's not improving human performance. In fact, it's actually making it worse. And some tasks are within the frontier, meaning that AI is actually significantly improving the performance, the speed, the quality of the consultant."},{"id":105,"text":"Many tasks fell within and many tasks fell without, and they shared their insights. But the TLDR is there is a frontier within which AI is absolutely helping and one where they call out this behavior of falling asleep at the wheel, where people relied on AI on a task that was beyond the frontier. And in fact, it ended up going worse because the human was not reviewing the outputs carefully enough."}],"notes":["本段介绍了LLM（大语言模型）的应用方式，包括如何通过包装其他模型、改进提示（prompt）以及构建更复杂的系统（如RAG、代理工作流、多代理系统）来提升性能。讲者强调，选择合适的LLM并最大化其性能是本节课的重点。","讲者通过一项研究来说明提示工程的重要性。该研究由HPS、宾夕法尼亚大学和哈佛商学院等机构联合进行，研究对象是BCG咨询顾问，分为三组：无AI访问组、仅访问AI组和接受提示训练的AI组。研究结果显示，AI在某些任务上显著提升了性能，但在超出AI能力范围的任务上反而使人类表现变差。","研究中提到的“锯齿前沿”（jagged frontier）概念指出，AI在某些任务上表现优异，而在其他任务上则无法有效帮助。这表明AI并非在所有任务上都优于人类，需要根据任务类型进行合理使用。","研究还指出，当人类过度依赖AI处理超出其能力范围的任务时，可能会导致“睡轮行为”（falling asleep at the wheel），即人类未能仔细审查AI的输出，从而导致结果变差。","讲者总结了研究的主要结论：AI在特定任务范围内能显著提升性能，但在超出其能力的任务上可能使人类表现变差。因此，合理使用AI并结合人类的监督和审查至关重要。","本段强调了提示工程在实际应用中的重要性，以及如何通过改进提示和构建更复杂的系统来提升LLM的性能。同时，也提醒听众注意AI的局限性，避免在超出其能力的任务上过度依赖AI。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1026.49,"end":1194.79,"asr_flags":[],"raw_segments":[{"start":1026.49,"text":"packaging other models within itself but you know if you're thinking about 3.54 and 4.0 that's really what it is the pre-trained model improves and so you should see your performance improve on your tasks but the other dimension is we can actually engineer leverage the llm in a way that makes it better so you can prompt simply gpt 4.0 you can"},{"start":1051.87,"text":"change some prompts and improve the prompt and it will improve the performance. It's shown. You can even put a rag around it. You can put an agentic workflow around it. You can even put a multi-agent system around it. And that is another dimension for you to improve performance. So that's how I want you to think about it. Which LLM I'm using and then how can I maximize the performance of that LLM? This lecture is about the vertical axis. Those are the methods that we will see together."},{"start":1084.81,"text":"Sounds good for the introduction. So let's move to prompt engineering. I'm going to start with an interesting study just to motivate why prompt engineering matters. There is a study from HPS, UPenn."},{"start":1102.3,"text":"as well as Harvard Business School and others also involved Wharton that took a subset of BCG consultants, individual contributors, split them into three groups. One group had no access to AI. One group had access to..."},{"start":1117.39,"text":"I think it was GPT-4. And then one group had access to the LLM, but also a training on how to prompt better. And then they observed the performance of these consultants across a wide variety of tasks. There's a few things that they noticed that I thought was interesting. One is something they call the jagged frontier, meaning that certain tasks that consultants are doing fall."},{"start":1143.93,"text":"beyond the JAG frontier, meaning AI is not good enough. It's not improving human performance. In fact, it's actually making it worse. And some tasks are within the frontier, meaning that AI is actually significantly improving the performance, the speed, the quality of the consultant."},{"start":1168.19,"text":"Many tasks fell within and many tasks fell without, and they shared their insights. But the TLDR is there is a frontier within which AI is absolutely helping and one where they call out this behavior of falling asleep at the wheel, where people relied on AI on a task that was beyond the frontier. And in fact, it ended up going worse because the human was not reviewing the outputs carefully enough."}],"speech_gaps":[],"frame":"../frames/v057/007.webp","frame_time":1038.49},{"title":"增强LLM应用中的提示工程与角色分类","segments":[{"id":106,"text":"They did note that the group that was trained was the best, better than the group that was not trained on prompt engineering, which also motivates why this lecture matters, so that you're within that group afterwards. One other insight were the centaurs and the cyborgs. They noticed that consultants had the tendency to work with AI in one of two ways, and you might yourself be part of one of these groups."},{"id":107,"text":"The centaurs are mythical creatures that are half human, half, I think, half horses. Half horses, half something."},{"id":108,"text":"And those were individuals that would divide and delegate."},{"id":109,"text":"They might give a pretty big task to the AI."},{"id":110,"text":"So imagine you're working on a PowerPoint, which consultants are known to do."},{"id":111,"text":"You might actually write a very long prompt on how you wanted to do your PowerPoint and then let it work for some time and then come back and it's done."},{"id":112,"text":"When others would act as cyborgs, cyborgs are fully blended, bio-niche human robots, augmented with robotic parts."},{"id":113,"text":"They would actually work super quickly with the model and back and forth."},{"id":114,"text":"They would actually work super quickly with the model and back and forth."},{"id":115,"text":"I find that a lot of students are actually more working like cyborgs than centaurs."},{"id":116,"text":"But while maybe in the enterprise, when you're trying to automate the workflow,"},{"id":117,"text":"you're thinking more like a centaur."},{"id":118,"text":"That's just something good to keep in mind."},{"id":119,"text":"Also, a lot of companies will tell you,"},{"id":120,"text":"oh, we're hiring prompt engineers, etc. It's a cure."},{"id":121,"text":"I don't buy that. I think it's just a skill that everybody should have."},{"id":122,"text":"You're not going to make a cure out of prompt engineering, but you're probably going to use it as a very powerful skill in your cure."},{"id":123,"text":"So let's talk about basic prompt design principles."},{"id":124,"text":"I'm giving you a very simple prompt here."},{"id":125,"text":"Summarize this document, and then the document is uploaded alongside it."},{"id":126,"text":"And the model has not much context around it."},{"id":127,"text":"What should be the summary? How long should be the summary? What should we talk about? Etc. You can actually improve these prompts by doing something like summarize this 10-page scientific paper on renewable energy in five bullet points focusing on key findings and implications for policymakers. That's already better, right? You're sharing the audience."},{"id":128,"text":"and it's going to tailor it to the audience. You're saying that you want five bullet points and you want to focus only on key findings. That's a better prompt, you would argue. How could you even make this prompt better? What are other techniques that you've heard of, have tried yourself, that could make this one-shot prompt better? Yeah."}],"notes":["本段介绍了提示工程在增强LLM应用中的重要性，并通过centaurs和cyborgs的比喻来区分两种不同的使用方式。centaurs指的是将任务分解并委托给AI的用户，而cyborgs则是与AI紧密协作、快速交互的用户。这种区分有助于理解不同场景下如何更有效地使用AI工具。","课堂中提到，许多学生更倾向于以cyborgs的方式使用AI，即与AI进行快速交互，而不是将任务完全委托给AI。这表明在实际应用中，用户可能更倾向于与AI进行协作，而不是完全依赖AI。","在企业环境中，当试图自动化工作流程时，用户可能更倾向于以centaurs的方式使用AI，即将任务分解并交给AI处理。这表明在不同的应用场景中，用户可能需要采用不同的协作方式。","课堂中还提到，虽然一些公司声称正在招聘提示工程师，但作者认为这只是一个技能，每个人都应该掌握。这表明提示工程是一个普遍适用的技能，而不是一个专门的职业。","最后，课堂中讨论了提示设计的基本原则，并通过一个简单的例子说明了如何改进提示。这表明在实际应用中，通过明确任务要求和目标受众，可以显著提高AI的输出质量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1197.58,"end":1369.62,"asr_flags":[],"raw_segments":[{"start":1197.58,"text":"They did note that the group that was trained was the best, better than the group that was not trained on prompt engineering, which also motivates why this lecture matters, so that you're within that group afterwards. One other insight were the centaurs and the cyborgs. They noticed that consultants had the tendency to work with AI in one of two ways, and you might yourself be part of one of these groups."},{"start":1225.38,"text":"The centaurs are mythical creatures that are half human, half, I think, half horses. Half horses, half something."},{"start":1238.36,"text":"And those were individuals that would divide and delegate."},{"start":1241.88,"text":"They might give a pretty big task to the AI."},{"start":1244.54,"text":"So imagine you're working on a PowerPoint, which consultants are known to do."},{"start":1248.68,"text":"You might actually write a very long prompt on how you wanted to do your PowerPoint and then let it work for some time and then come back and it's done."},{"start":1255.94,"text":"When others would act as cyborgs, cyborgs are fully blended, bio-niche human robots, augmented with robotic parts."},{"start":1265.92,"text":"and those individuals will not delegate fully a task."},{"start":1269.74,"text":"They would actually work super quickly with the model and back and forth."},{"start":1273.32,"text":"I find that a lot of students are actually more working like cyborgs than centaurs."},{"start":1278.44,"text":"But while maybe in the enterprise, when you're trying to automate the workflow,"},{"start":1282.16,"text":"you're thinking more like a centaur."},{"start":1285.42,"text":"That's just something good to keep in mind."},{"start":1287.18,"text":"Also, a lot of companies will tell you,"},{"start":1288.92,"text":"oh, we're hiring prompt engineers, etc. It's a cure."},{"start":1291.7,"text":"I don't buy that. I think it's just a skill that everybody should have."},{"start":1295.26,"text":"You're not going to make a cure out of prompt engineering, but you're probably going to use it as a very powerful skill in your cure."},{"start":1305.56,"text":"So let's talk about basic prompt design principles."},{"start":1308.7,"text":"I'm giving you a very simple prompt here."},{"start":1312.26,"text":"Summarize this document, and then the document is uploaded alongside it."},{"start":1316.18,"text":"And the model has not much context around it."},{"start":1320.62,"text":"What should be the summary? How long should be the summary? What should we talk about? Etc. You can actually improve these prompts by doing something like summarize this 10-page scientific paper on renewable energy in five bullet points focusing on key findings and implications for policymakers. That's already better, right? You're sharing the audience."},{"start":1344.41,"text":"and it's going to tailor it to the audience. You're saying that you want five bullet points and you want to focus only on key findings. That's a better prompt, you would argue. How could you even make this prompt better? What are other techniques that you've heard of, have tried yourself, that could make this one-shot prompt better? Yeah."}],"speech_gaps":[],"frame":"../frames/v057/008.webp","frame_time":1209.58},{"title":"增强LLM应用的提示技巧","segments":[{"id":129,"text":"Okay, right example. So say you mean here is an example of a great submarine. Yeah, you're right. That's a good idea. Very popular technique. Act like a renewable energy expert giving a conference at Davos, let's say. Yeah, that's great."},{"id":130,"text":"You are the best in the world at this. Explain. Yeah, actually, I mean, these things work. It's funny, but it does work to say act like XYZ. It's a very popular prompt template. We see a few examples. What else could you do? Yes. Okay."},{"id":131,"text":"Critique your own project so you're using reflection. So you might actually do one output and then ask it to critique it and then give it back. Yeah, we'll see that. That's a great one. That's the one that probably works best within those typically, but we see some examples. What else? Yeah. Okay. Break the task down into steps. Do you know how that is called? No. Okay. Chain of thoughts."},{"id":132,"text":"This is actually a popular method that's been shown in research that it improves. You could actually give clear instruction and also encourage the model to think step by step. Approach the task step by step and do not skip any step. And then you give it some steps such as step one, identify the three most important findings. Step two, explain how each finding impacts renewable energy policy. Step three, write the five-bullet summary with each point addressing a finding, etc."},{"id":133,"text":"Chain of Thoughts, I leaked the paper from 2023 that popularized Chain of Thoughts. Chain of Thoughts is very, very popular right now, especially in AI startups that are trying to control their elements. Okay."},{"id":134,"text":"To go back to your examples about act like XYZ, what I like to do, Andrew also talks about that, is to look at other people's prompts."},{"id":135,"text":"And in fact, online, you have a lot of prompt repositories for free on GitHub."},{"id":136,"text":"In fact, I linked the awesome prompt template repo on GitHub, where you have so many examples of great prompts that engineers have built."},{"id":137,"text":"They said it works great for us and they published it online."},{"id":138,"text":"The advantage of a prompt template is that you can actually put it in your code and scale it for many user requests."},{"id":139,"text":"The advantage of a prompt template is that you can actually put it in your code and scale it for many user requests."},{"id":140,"text":"So let me give you an example from Workera."},{"id":141,"text":"Workera evaluates skills."},{"id":142,"text":"Some of you have taken the assessments already."},{"id":143,"text":"and tries to personalize it to the user."}],"notes":["本段讲解了如何通过角色扮演（act like XYZ）来增强大型语言模型（LLM）的应用效果。例如，让模型扮演可再生能源专家在达沃斯会议中发言，是一种非常受欢迎的提示技巧。这种方法通过设定明确的角色，使模型能够更自然地生成符合角色设定的输出。","课堂中还提到，通过让模型自我批判（critique your own project）来促进反思，这是一种有效的学习方法。例如，先生成一个输出，再让模型对其进行批判性分析，然后将其反馈给用户。","链式思维（Chain of Thoughts）是一种被广泛研究并证明有效的提示方法，它鼓励模型逐步思考并完成任务。这种方法通过分步骤指导模型，提高输出的准确性和逻辑性。","课堂中还提到，可以通过查看其他人的提示模板来优化自己的提示策略。例如，GitHub上有很多优秀的提示模板仓库，其中包含了许多工程师构建的高质量提示示例。","提示模板的优势在于可以将其嵌入代码中，从而实现对多个用户请求的扩展和自动化处理。例如，Workera公司利用提示模板来评估用户的技能，并根据用户需求进行个性化调整。","课堂最后强调了提示模板的灵活性和可扩展性，指出其在实际应用中的重要性。通过合理使用提示模板，可以显著提升LLM在各种任务中的表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1373.33,"end":1551.88,"asr_flags":[],"raw_segments":[{"start":1373.33,"text":"Okay, right example. So say you mean here is an example of a great submarine. Yeah, you're right. That's a good idea. Very popular technique. Act like a renewable energy expert giving a conference at Davos, let's say. Yeah, that's great."},{"start":1399.2,"text":"You are the best in the world at this. Explain. Yeah, actually, I mean, these things work. It's funny, but it does work to say act like XYZ. It's a very popular prompt template. We see a few examples. What else could you do? Yes. Okay."},{"start":1422.37,"text":"Critique your own project so you're using reflection. So you might actually do one output and then ask it to critique it and then give it back. Yeah, we'll see that. That's a great one. That's the one that probably works best within those typically, but we see some examples. What else? Yeah. Okay. Break the task down into steps. Do you know how that is called? No. Okay. Chain of thoughts."},{"start":1447.05,"text":"This is actually a popular method that's been shown in research that it improves. You could actually give clear instruction and also encourage the model to think step by step. Approach the task step by step and do not skip any step. And then you give it some steps such as step one, identify the three most important findings. Step two, explain how each finding impacts renewable energy policy. Step three, write the five-bullet summary with each point addressing a finding, etc."},{"start":1476.54,"text":"Chain of Thoughts, I leaked the paper from 2023 that popularized Chain of Thoughts. Chain of Thoughts is very, very popular right now, especially in AI startups that are trying to control their elements. Okay."},{"start":1492.24,"text":"To go back to your examples about act like XYZ, what I like to do, Andrew also talks about that, is to look at other people's prompts."},{"start":1502.26,"text":"And in fact, online, you have a lot of prompt repositories for free on GitHub."},{"start":1507.92,"text":"In fact, I linked the awesome prompt template repo on GitHub, where you have so many examples of great prompts that engineers have built."},{"start":1516.38,"text":"They said it works great for us and they published it online."},{"start":1519.28,"text":"And a lot of them start with act as, you know, act as a Linux terminal, act as an English translator, act like a position interviewer, etc."},{"start":1532.84,"text":"The advantage of a prompt template is that you can actually put it in your code and scale it for many user requests."},{"start":1540.84,"text":"So let me give you an example from Workera."},{"start":1545.34,"text":"Workera evaluates skills."},{"start":1546.98,"text":"Some of you have taken the assessments already."},{"start":1549.28,"text":"and tries to personalize it to the user."}],"speech_gaps":[{"start":1394.0,"end":1396.416},{"start":1396.416,"end":1398.384}],"frame":"../frames/v057/009.webp","frame_time":1385.33},{"title":"提示模板与零样本提示","segments":[{"id":144,"text":"And in fact, if you actually read in an HR system,"},{"id":145,"text":"in an enterprise, in the HR system,"},{"id":146,"text":"you might have Jane is a product manager, level three,"},{"id":147,"text":"and she is in the US, and her preferred language is English."},{"id":148,"text":"And actually, that metadata can be inserted in a prompt template"},{"id":149,"text":"that we personalize for Jane."},{"id":150,"text":"And similarly for Joe, whose favorite language,"},{"id":151,"text":"his preferred language is Spanish,"},{"id":152,"text":"it will tailor it to Joe."},{"id":153,"text":"And that's called a prompt template."},{"id":154,"text":"So the question is,"},{"id":155,"text":"do the foundation models use a prompt template"},{"id":156,"text":"or do you have to integrate it yourself?"},{"id":157,"text":"So the foundation models probably use a system prompt"},{"id":158,"text":"that you don't see."},{"id":159,"text":"Like when actually you type on ChatGPT,"},{"id":160,"text":"it is possible it's not public that open ai behind the scene has like act like a very helpful"},{"id":161,"text":"assistance for this user and by the way here is your memories about your the user that we kept in"},{"id":162,"text":"a database you can actually check your memories and then your prompt goes under and then the"},{"id":163,"text":"generation starts so probably they're using something like that but it doesn't mean you can't"},{"id":164,"text":"add one yourself so in fact if you if you think about a prompt template for for the work here"},{"id":165,"text":"example, I was"},{"id":166,"text":"Maybe it starts when you call OpenAI by act like a helpful assistant. And then underneath, it's like act like a great AI mentor that helps people in their career. And OpenAI's prompt template also has follow the instruction from the creator or something like that. It's possible. Questions about prompt templates? Again, I would encourage you to go and read examples of prompts. Some of them are quite thoughtful."},{"id":167,"text":"Let's talk about zero-shot versus few-shot prompting."},{"id":168,"text":"It came up earlier."},{"id":169,"text":"Here's an example, again, going back to the categorization of product reviews."},{"id":170,"text":"Let's say that we're working on a task where the prompt is classify the tone of the sentence as positive, negative, or neutral, and then you paste the review, which is the product is fine, but I was expecting more."},{"id":171,"text":"if i were to survey the room i would bet that some of you would say it's negative some of you"},{"id":172,"text":"would say it's neutral because you actually have a first part that is relatively positive it's fine"},{"id":173,"text":"and then the second part i was expecting more which is relatively negative so where do you land"},{"id":174,"text":"this can be a subjective question and maybe in one industry this would be considered amazing"},{"id":175,"text":"and another one it would be considered really bad because people are used to really flourishing"},{"id":176,"text":"reviews. And so the way you can actually align the model to your task is by converting that"},{"id":177,"text":"zero-shot prompt. Zero-shot refers to the fact that it's not beginning given any example"}],"notes":["本段讨论了提示模板（prompt template）的概念，即通过将用户信息（如语言偏好）嵌入提示模板中，实现个性化交互。讲者指出，基础模型（foundation models）可能已经内置了系统提示，但用户也可以自行添加提示模板。例如，OpenAI的提示模板可能包含扮演助手或导师的角色，以及遵循创建者指令等元素。","讲者进一步解释了零样本提示（zero-shot prompting）的概念，即模型在没有示例的情况下完成任务。通过一个产品评论分类的例子，讲者展示了如何根据句子的语气（正面、负面或中性）进行分类，指出这种分类可能具有主观性，取决于行业背景。","讲者强调了零样本提示与少样本提示（few-shot prompting）的区别，指出零样本提示不依赖任何示例，而少样本提示则可能包含少量示例。这种区分对于模型对任务的理解和对齐至关重要。","讲者提到，通过零样本提示，可以将模型对任务的理解与实际需求对齐。例如，在产品评论分类任务中，模型需要根据句子的语气进行分类，而这种分类可能因行业背景不同而有所差异。","讲者鼓励学生阅读提示模板的示例，以更好地理解如何构建有效的提示。这表明提示模板的设计和使用是深度学习和自然语言处理中的重要实践。","讲者指出，零样本提示的主观性可能影响模型的输出，因此需要根据具体任务和行业背景进行调整。这表明在实际应用中，提示模板的设计和使用需要结合具体场景进行优化。"],"formulas":[],"uncertainties":["act like a very helpful","assistance for this user and by the way here is your memories about your the user that we kept in","a database you can actually check your memories and then your prompt goes under and then the","generation starts so probably they're using something like that but it doesn't mean you can't","add one yourself so in fact if you if you think about a prompt template for for the work here","example, I was","Maybe it starts when you call OpenAI by act like a helpful assistant. And then underneath, it's like act like a great AI mentor that helps people in their career. And OpenAI's prompt template also has follow the instruction from the creator or something like that. It's possible. Questions about prompt templates? Again, I would encourage you to go and read examples of prompts. Some of them are quite thoughtful.","if i were to survey the room i would bet that some of you would say it's negative some of you","would say it's neutral because you actually have a first part that is relatively positive it's fine","and then the second part i was expecting more which is relatively negative so where do you land","this can be a subjective question and maybe in one industry this would be considered amazing","and another one it would be considered really bad because people are used to really flourishing","reviews. And so the way you can actually align the model to your task is by converting that","zero-shot prompt. Zero-shot refers to the fact that it's not beginning given any example"],"diagram":"none","start":1552.4,"end":1728.66,"asr_flags":[],"raw_segments":[{"start":1552.4,"text":"And in fact, if you actually read in an HR system,"},{"start":1555.38,"text":"in an enterprise, in the HR system,"},{"start":1557.72,"text":"you might have Jane is a product manager, level three,"},{"start":1562.1,"text":"and she is in the US, and her preferred language is English."},{"start":1566.98,"text":"And actually, that metadata can be inserted in a prompt template"},{"start":1570.68,"text":"that we personalize for Jane."},{"start":1572.7,"text":"And similarly for Joe, whose favorite language,"},{"start":1575.96,"text":"his preferred language is Spanish,"},{"start":1577.48,"text":"it will tailor it to Joe."},{"start":1580.46,"text":"And that's called a prompt template."},{"start":1590.64,"text":"So the question is,"},{"start":1593.62,"text":"do the foundation models use a prompt template"},{"start":1596.22,"text":"or do you have to integrate it yourself?"},{"start":1598.82,"text":"So the foundation models probably use a system prompt"},{"start":1602.48,"text":"that you don't see."},{"start":1603.42,"text":"Like when actually you type on ChatGPT,"},{"start":1606.3,"text":"it is possible it's not public that open ai behind the scene has like act like a very helpful"},{"start":1613.6,"text":"assistance for this user and by the way here is your memories about your the user that we kept in"},{"start":1620.08,"text":"a database you can actually check your memories and then your prompt goes under and then the"},{"start":1625.3,"text":"generation starts so probably they're using something like that but it doesn't mean you can't"},{"start":1629.7,"text":"add one yourself so in fact if you if you think about a prompt template for for the work here"},{"start":1635.58,"text":"example, I was"},{"start":1636.97,"text":"Maybe it starts when you call OpenAI by act like a helpful assistant. And then underneath, it's like act like a great AI mentor that helps people in their career. And OpenAI's prompt template also has follow the instruction from the creator or something like that. It's possible. Questions about prompt templates? Again, I would encourage you to go and read examples of prompts. Some of them are quite thoughtful."},{"start":1664.66,"text":"Let's talk about zero-shot versus few-shot prompting."},{"start":1667.84,"text":"It came up earlier."},{"start":1669.42,"text":"Here's an example, again, going back to the categorization of product reviews."},{"start":1674.56,"text":"Let's say that we're working on a task where the prompt is classify the tone of the sentence as positive, negative, or neutral, and then you paste the review, which is the product is fine, but I was expecting more."},{"start":1691.56,"text":"if i were to survey the room i would bet that some of you would say it's negative some of you"},{"start":1697.98,"text":"would say it's neutral because you actually have a first part that is relatively positive it's fine"},{"start":1704.08,"text":"and then the second part i was expecting more which is relatively negative so where do you land"},{"start":1708.82,"text":"this can be a subjective question and maybe in one industry this would be considered amazing"},{"start":1713.84,"text":"and another one it would be considered really bad because people are used to really flourishing"},{"start":1718.5,"text":"reviews. And so the way you can actually align the model to your task is by converting that"},{"start":1724.52,"text":"zero-shot prompt. Zero-shot refers to the fact that it's not beginning given any example"}],"speech_gaps":[{"start":1583.6,"end":1585.776},{"start":1586.096,"end":1587.76}],"frame":"../frames/v057/010.webp","frame_time":1564.4},{"title":"Few-shot Prompting 和 Prompt 长度限制","segments":[{"id":178,"text":"into a few-shot prompt where the model is given in the prompt a set of examples to align it to"},{"id":179,"text":"what you want it to do. So the example here is, again, you paste the same prompt as before with"},{"id":180,"text":"the user review. And then you add, here are examples of tone classifications. This exceeded"},{"id":181,"text":"my expectation"},{"id":182,"text":"completely."},{"id":183,"text":"positive it's okay but i wish it had more features negative the service was adequate neither good nor bad uh mutual now classify the tone of this sentence um you know after you've heard about these things and the model then says negative"},{"id":184,"text":"And the reason it says negative, of course, is likely because of the second example, which was, it's okay, but I wish it had more features, which we told the model that was negative. Because the model saw that it's aligned now with your expectations. Few-shot prompts are very popular."},{"id":185,"text":"And in fact, for AI startups that are slightly more sophisticated, you might see them keep a prompt up to date whenever a user says something and they might have a human label it and then add it as a few shots in their relevant prompts in their code base."},{"id":186,"text":"You can think of that as almost building a data set."},{"id":187,"text":"But instead of actually building a separate data set, like we've seen with supervised fine tuning and then fine tuning the model on it, you're just putting it directly in the prompts."},{"id":188,"text":"And it turns out it's probably faster to do that if you want to experiment quickly because you don't touch the model parameters, you just update your prompts."},{"id":189,"text":"And if it's text examples, you can actually concatenate so many examples in a single prompt."},{"id":190,"text":"At some point, it will be too long and you will not have the necessary context window, but it's a pretty strong approach that is quick to align an LLM."},{"id":191,"text":"okay yes"},{"id":192,"text":"so question was is there any research on how long the prompt can be before the model essentially"},{"id":193,"text":"uses itself or doesn't follow instructions anymore there is uh the problem is that research"},{"id":194,"text":"Search is outdated every few months because models get better."},{"id":195,"text":"And so I don't know where the state-of-the-art is."},{"id":196,"text":"You can probably find it online on benchmarks."},{"id":197,"text":"We see that... I'll give you an example."},{"id":198,"text":"On the Workero product, you have a voice conversation"},{"id":199,"text":"for some of you that have tried it,"},{"id":200,"text":"where you're asked, explain what is a prompt,"},{"id":201,"text":"and then you explain, and then there's a scoring algorithm."},{"id":202,"text":"We know that after eight turns, the model loses itself."},{"id":203,"text":"after eight turns because you always paste the previous user response it just starts going wild"},{"id":204,"text":"and so the techniques we use in the background is we actually create chapters of the conversation"},{"id":205,"text":"maybe one chapter is the first eight prompt and then you actually start over from another prompt"}],"notes":["本段讲解了few-shot prompting的概念，即通过在提示中加入示例来引导模型输出符合预期的结果。例如，用户输入一个评论，模型根据之前提供的语气分类示例进行分类。这表明模型能够通过示例学习任务的模式。","接着，讲者提到few-shot prompting在AI初创公司中的应用，即通过用户反馈更新提示，而不是构建独立的数据集。这种方法更快，因为它不需要调整模型参数，只需更新提示。","讲者还提到，如果提示过长，模型可能会超出上下文窗口限制，因此需要平衡提示长度和模型性能。","随后，讲者回答了一个关于提示长度限制的问题，指出目前的研究可能已经过时，因为模型性能在不断进步。因此，最新的研究结果可能需要查阅在线基准测试。","最后，讲者以Workero产品为例，说明模型在八轮对话后可能失去控制，因此需要将对话分成章节，重新开始新的提示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1729.5,"end":1909.44,"asr_flags":[],"raw_segments":[{"start":1729.5,"text":"into a few-shot prompt where the model is given in the prompt a set of examples to align it to"},{"start":1736.52,"text":"what you want it to do. So the example here is, again, you paste the same prompt as before with"},{"start":1741.56,"text":"the user review. And then you add, here are examples of tone classifications. This exceeded"},{"start":1747.32,"text":"my expectation"},{"start":1747.9,"text":"completely."},{"start":1749.15,"text":"positive it's okay but i wish it had more features negative the service was adequate neither good nor bad uh mutual now classify the tone of this sentence um you know after you've heard about these things and the model then says negative"},{"start":1767.88,"text":"And the reason it says negative, of course, is likely because of the second example, which was, it's okay, but I wish it had more features, which we told the model that was negative. Because the model saw that it's aligned now with your expectations. Few-shot prompts are very popular."},{"start":1786.54,"text":"And in fact, for AI startups that are slightly more sophisticated, you might see them keep a prompt up to date whenever a user says something and they might have a human label it and then add it as a few shots in their relevant prompts in their code base."},{"start":1803.8,"text":"You can think of that as almost building a data set."},{"start":1806.58,"text":"But instead of actually building a separate data set, like we've seen with supervised fine tuning and then fine tuning the model on it, you're just putting it directly in the prompts."},{"start":1815.18,"text":"And it turns out it's probably faster to do that if you want to experiment quickly because you don't touch the model parameters, you just update your prompts."},{"start":1823.38,"text":"And if it's text examples, you can actually concatenate so many examples in a single prompt."},{"start":1830.82,"text":"At some point, it will be too long and you will not have the necessary context window, but it's a pretty strong approach that is quick to align an LLM."},{"start":1844.66,"text":"okay yes"},{"start":1852.6,"text":"so question was is there any research on how long the prompt can be before the model essentially"},{"start":1859.1,"text":"uses itself or doesn't follow instructions anymore there is uh the problem is that research"},{"start":1865.88,"text":"Search is outdated every few months because models get better."},{"start":1870.24,"text":"And so I don't know where the state-of-the-art is."},{"start":1873.1,"text":"You can probably find it online on benchmarks."},{"start":1875.48,"text":"We see that... I'll give you an example."},{"start":1879.2,"text":"On the Workero product, you have a voice conversation"},{"start":1883.04,"text":"for some of you that have tried it,"},{"start":1884.92,"text":"where you're asked, explain what is a prompt,"},{"start":1886.98,"text":"and then you explain, and then there's a scoring algorithm."},{"start":1889.28,"text":"We know that after eight turns, the model loses itself."},{"start":1893.78,"text":"after eight turns because you always paste the previous user response it just starts going wild"},{"start":1900.38,"text":"and so the techniques we use in the background is we actually create chapters of the conversation"},{"start":1905.48,"text":"maybe one chapter is the first eight prompt and then you actually start over from another prompt"}],"speech_gaps":[{"start":1846.704,"end":1848.432}],"frame":"../frames/v057/011.webp","frame_time":1741.5},{"title":"链式提示技术及其优势","segments":[{"id":206,"text":"you can summarize the first part of the conversation, insert the summary, and then keep going"},{"id":207,"text":"those are engineering hacks that engineers might have figured out in the background"},{"id":208,"text":"Because eight turns makes a prompt quite long, actually."},{"id":209,"text":"Let's move on to chaining."},{"id":210,"text":"Chaining is the most popular technique out of everything we've seen so far in prompt engineering."},{"id":211,"text":"It's not chain of thought."},{"id":212,"text":"So chain of thought we've seen is think step by step, step one, step two, step three."},{"id":213,"text":"Do not skip any step."},{"id":214,"text":"This is different."},{"id":215,"text":"This is chaining complex prompt to improve performance, and this is what it looks like."},{"id":216,"text":"You take a single step prompt, such as read this customer review and write a professional response that acknowledges their concern, explains the issue, offers a resolution, and then you paste the customer review, which is I ordered a laptop. It arrived three days late. The packaging was damaged. Very disappointing. I needed that urgently for work. And then the output is an email that is immediately given to you by the LLM after it reads the prompt."},{"id":217,"text":"um so this might work but it might be hard to control you know because"},{"id":218,"text":"Think about it. There's multiple steps that you have listed and everything is embedded in the same prompt. And if you wanted to debug step by step and know which step is weaker, you couldn't. You would have everything mixed together. So one advantage of chaining is you would separate the prompts so that you can debug them separately. And it will also lead to an easier manner to improve your workflow. Let's say a first prompt is extract the key issues."},{"id":219,"text":"Identify the key concerns mentioned in this customer review. Paste the customer review. Second prompt, using these issues, so you paste back the issues, draft an outline for a professional response that acknowledges concerns, explains possible reasons, and offer a resolution. So this is not, you know, prompt number three, write the full response. So using the outline, write the professional response. And then you get your final output."},{"id":220,"text":"So in theory, you can tell me, oh, the second approach is better than the first one at first. But what you can notice is that we can actually test those three prompts separately from each other and determine if we will get the most gains out of..."},{"id":221,"text":"uh engineering the first prompt optimizing it or the second one or the third one we now have"},{"id":222,"text":"three prompts that are independent from each other and you know maybe if uh the outline was better"}],"notes":["本段讲解了链式提示技术（chaining）的概念，指出它与链式思维（chain of thought）不同。链式提示是将复杂的提示拆分成多个独立的步骤，以便于调试和优化。例如，可以将客户评论处理分为提取关键问题、起草大纲、撰写完整回复三个步骤。","链式提示的优势在于可以独立测试每个步骤，从而更容易识别和改进薄弱环节。例如，可以分别测试提取关键问题、起草大纲和撰写完整回复这三个步骤，以确定哪个步骤对整体性能提升最大。","在实际应用中，链式提示可以提高工作流的效率，因为每个步骤都可以独立优化。例如，可以先优化提取关键问题的步骤，再优化起草大纲的步骤，最后优化撰写完整回复的步骤。","链式提示的实施需要将每个步骤的输出作为下一个步骤的输入，从而形成一个连贯的工作流程。例如，提取关键问题的输出可以作为起草大纲的输入，起草大纲的输出可以作为撰写完整回复的输入。","链式提示的实施需要考虑每个步骤的独立性和连贯性，以确保最终输出的质量。例如，如果提取关键问题的步骤不够准确，可能会影响后续步骤的输出质量。","链式提示的实施还可以帮助识别和解决潜在的问题。例如，如果某个步骤的输出质量不高，可以通过独立测试该步骤来识别问题并进行优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1909.44,"end":2082.41,"asr_flags":[],"raw_segments":[{"start":1909.44,"text":"you you can summarize the first part of the conversation insert the summary and then keep"},{"start":1914.74,"text":"going you know those are engineering hacks that engineers might have figured out in the background"},{"start":1920.1,"text":"Because eight turns makes a prompt quite long, actually."},{"start":1929.4,"text":"Let's move on to chaining."},{"start":1931.64,"text":"Chaining is the most popular technique out of everything we've seen so far in prompt engineering."},{"start":1938.78,"text":"It's not chain of thought."},{"start":1940.12,"text":"So chain of thought we've seen is think step by step, step one, step two, step three."},{"start":1943.68,"text":"Do not skip any step."},{"start":1944.86,"text":"This is different."},{"start":1945.7,"text":"This is chaining complex prompt to improve performance, and this is what it looks like."},{"start":1953.03,"text":"You take a single step prompt, such as read this customer review and write a professional response that acknowledges their concern, explains the issue, offers a resolution, and then you paste the customer review, which is I ordered a laptop. It arrived three days late. The packaging was damaged. Very disappointing. I needed that urgently for work. And then the output is an email that is immediately given to you by the LLM after it reads the prompt."},{"start":1983.01,"text":"um so this might work but it might be hard to control you know because"},{"start":1991.18,"text":"Think about it. There's multiple steps that you have listed and everything is embedded in the same prompt. And if you wanted to debug step by step and know which step is weaker, you couldn't. You would have everything mixed together. So one advantage of chaining is you would separate the prompts so that you can debug them separately. And it will also lead to an easier manner to improve your workflow. Let's say a first prompt is extract the key issues."},{"start":2020.46,"text":"Identify the key concerns mentioned in this customer review. Paste the customer review. Second prompt, using these issues, so you paste back the issues, draft an outline for a professional response that acknowledges concerns, explains possible reasons, and offer a resolution. So this is not, you know, prompt number three, write the full response. So using the outline, write the professional response. And then you get your final output."},{"start":2054.28,"text":"So in theory, you can tell me, oh, the second approach is better than the first one at first. But what you can notice is that we can actually test those three prompts separately from each other and determine if we will get the most gains out of..."},{"start":2070.43,"text":"uh engineering the first prompt optimizing it or the second one or the third one we now have"},{"start":2076.45,"text":"three prompts that are independent from each other and you know maybe if uh the outline was better"}],"speech_gaps":[],"frame":"../frames/v057/012.webp","frame_time":1921.44},{"title":"链式提示：用中间结果定位问题，也要考虑延迟","start":2082.41,"end":2261.6,"segments":[{"id":223,"text":"um the performance of uh the email the email how much it will the open rate will be or the user"},{"id":224,"text":"satisfaction on the response will actually get higher you know and so chaining improves performance"},{"id":225,"text":"But most importantly, it helps you control your workflow and debug it more seamlessly."},{"id":226,"text":"Yes?"},{"id":227,"text":"So, if we know that the three problems independently work very well,"},{"id":228,"text":"if we combine them into one problem, and we highlight that,"},{"id":229,"text":"and by that, we get a separate policy, or do we still have to do that breakdown?"},{"id":230,"text":"So, let me try to rephrase."},{"id":231,"text":"You say, let's say we look at the first prompt, which has all three tasks built in that prompt."},{"id":232,"text":"What exactly do you mean?"},{"id":233,"text":"You mean like if we evaluate the output and we measure some user insight, satisfaction, etc."},{"id":234,"text":"Why don't we just modify that prompt and essentially see how it impr
