on't"},{"id":696,"text":"want to bother going and teaching you the number 17 methods on rag that optimizes the rag because"},{"id":697,"text":"Because in two years, you're not going to need it."},{"id":698,"text":"So I would rather you think about"},{"id":699,"text":"what is the breadth of things you want to understand."},{"id":700,"text":"And when you need it, you are sprinting"},{"id":701,"text":"and learning the exact thing you need faster"},{"id":702,"text":"because the half-life of skill is so low."},{"id":703,"text":"You want to come out of the class with a good breadth"},{"id":704,"text":"and then have the ability to go deep"},{"id":705,"text":"whenever you need after the class."},{"id":706,"text":"And so that's sort of how that class is designed as well."},{"id":707,"text":"Yeah, that's it for today."},{"id":708,"text":"So thank you."},{"id":709,"text":"Thank you for participating."}],"notes":["本段主要讨论了增强LLM应用的趋势，强调了不同方法的结合，以构建快速、低延迟、低成本且能源效率高的AI系统。讲者提到，这些方法的结合是未来的发展方向。","讲者提到，斯坦福大学的研究分为以人类为中心和非人类为中心的两种类型。以人类为中心的研究是基于大脑的模型，而非人类的模型则可能超越人类身体的限制。","讲者指出，仅研究人类大脑的结构可能会忽略计算和能源优化的潜力，但人类大脑仍然提供了许多值得学习的方面。","讲者提到，目前有教授在研究人类如何进行反向传播，实际上人类可能并不使用反向传播，而是仅使用前向传播。这种研究方向值得探索。","讲者强调了AI领域发展速度之快，因此课程设计更注重广度而非深度，鼓励学生在需要时快速学习特定技能。","课程设计的目标是让学生在课堂上掌握广泛的知识，并在之后根据需要深入学习特定领域，因为技能的半衰期非常短。"],"formulas":[],"uncertainties":["missing out on compute and energy and stuff like that that you can optimize even beyond","how does back propagation work for humans","the number 17 methods on rag that optimizes the rag"],"diagram":"none","start":6456.91,"end":6583.28,"asr_flags":[],"raw_segments":[{"start":6456.91,"text":"is doing stuff unsupervised learning. You see what I mean? We're probably a mix of all these methods, and I think that's where the trend is going, is where those methods that you've seen in CS230 come together in order to build an AI system that learns fast, is low latency, is cheap, energy efficient, and makes the most out of all of these methods."},{"start":6479.24,"text":"Finally, and this is especially true at Stanford, you have research going on that you would consider human-centric and some research that is non-human-centric."},{"start":6489.84,"text":"By human-centric, I should say human approaches that are modeled after the brain and approaches that are not modeled after humans, because it turns out that the human body is very limiting."},{"start":6500.24,"text":"think and so if you actually only do research on what the human brain looks like you're probably"},{"start":6504.8,"text":"missing out on compute and energy and stuff like that that you can optimize even beyond"},{"start":6508.88,"text":"neuronal connections in the brain but you still can learn a lot from the human brain and that's"},{"start":6513.84,"text":"why there are professors that are running labs right now that try to understand how does back"},{"start":6519.36,"text":"propagation work for humans and in fact it's probably that we don't have back propagation"},{"start":6524.1,"text":"we don't use back propagation we only do forward propagation let's say so this type of stuff is"},{"start":6529.24,"text":"interesting research that i would encourage you to read if you're curious about the direction of of"},{"start":6534.32,"text":"ai um and then finally one thing that's going to be pretty clear i call it all the time but"},{"start":6540.24,"text":"it's the velocity at which things are moving you're noticing part of the reason"},{"start":6544.52,"text":"we're giving you a breath in cs230 is because these methods are changing so fast so i don't"},{"start":6549.32,"text":"want to bother going and teaching you the number 17 methods on rag that optimizes the rag because"},{"start":6555.28,"text":"Because in two years, you're not going to need it."},{"start":6556.82,"text":"So I would rather you think about"},{"start":6559.22,"text":"what is the breadth of things you want to understand."},{"start":6561.54,"text":"And when you need it, you are sprinting"},{"start":6563.52,"text":"and learning the exact thing you need faster"},{"start":6565.16,"text":"because the half-life of skill is so low."},{"start":6567.96,"text":"You want to come out of the class with a good breadth"},{"start":6570.14,"text":"and then have the ability to go deep"},{"start":6572.5,"text":"whenever you need after the class."},{"start":6574.18,"text":"And so that's sort of how that class is designed as well."},{"start":6577.42,"text":"Yeah, that's it for today."},{"start":6579.5,"text":"So thank you."},{"start":6581.64,"text":"Thank you for participating."}],"speech_gaps":[],"frame":"../frames/v057/038.webp","frame_time":6468.91}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
