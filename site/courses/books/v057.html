e day","zh":"他们在需要完成任务时能够在两者之间取得平衡。这里传统软件与代理软件之间的范式转变是：第一种是处理数据的方式。传统软件处理结构化数据，你有 JSON，你有数据库，它们在数据工程流水线中以非常结构化的方式被粘贴，然后被用于在特定界面上显示，用户可能会填写一个表单，然后该表单被提取并粘贴到当天的使用中。","start":3471.84,"end":3501.18}],"notes":["本段讲解了从单步提示到多步骤代理工作流的转变。通过一个退款政策查询的例子，说明了传统方法与代理工作流之间的差异。代理工作流能够更细致地处理用户请求，例如通过RAG（检索增强生成）获取退款政策，然后进一步询问用户订单号，查询API以确认订单详情，并最终向用户确认退款资格和处理时间。","在接下来的讲解中，课程提到代理工作流在实际应用中已经存在，例如AI软件工程师、AI法律顾问等。虽然这些应用可能并不完美，但它们代表了当前技术发展的趋势。课程还指出，未来产品可能不再需要人类面孔，而是更多地依赖AI代理。","课程进一步讨论了软件工程领域的范式转变，强调从确定性思维向模糊性思维的转变。优秀的工程师能够在这两种思维方式之间找到平衡，以应对不同的任务需求。","最后，课程提到传统软件处理结构化数据，如JSON和数据库，这些数据在数据工程管道中被处理并用于界面显示。而代理软件则可能采用不同的数据处理方式，例如通过API查询和用户交互来获取信息。"],"formulas":[],"uncertainties":["pirating shift","agent tki software"],"diagram":"none","start":3328.2,"end":3501.18,"asr_flags":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":3328.2,"text":"So here's an example of how we move from a one-step prompt to a multi-step agentic workflow."},{"start":3335.76,"text":"Let's say a user queries a product."},{"start":3340.92,"text":"What is your refund policy on a chatbot?"},{"start":3343.28,"text":"and the response"},{"start":3345.02,"text":"using a rag"},{"start":3346.44,"text":"says"},{"start":3346.96,"text":"refunds are available"},{"start":3348.16,"text":"within 30 days"},{"start":3349.14,"text":"of purchase"},{"start":3349.7,"text":"and maybe the rag"},{"start":3350.58,"text":"can even look"},{"start":3351.36,"text":"linked to the policy."},{"start":3353.39,"text":"That's what we learned so far. Instead, an agenting workflow can function like this. The user says, can I get a refund for my order? And the response via..."},{"start":3365.77,"text":"The agentic workflow is the agent retrieves the refund policy using a rag. The agent then follows up with the users and says, can you provide your order number? Then the agent queries an API to check the order details. And finally, it comes back to the user and confirms your order qualifies for a refund. The amount will be processed in three to five business days. This is much more thoughtful than the first version, which is sort of vanilla, right?"},{"start":3394.0,"text":"So that's what we're going to talk about in the next couple of slides, is how do we get from the first one to the second one. There are plenty of specialized agentic workflows online. You've heard, and if you hang out in SF, you probably see a bunch of billboards. AI software engineer, AI skills mentor you've interacted with in the class to work AI SDR, AI lawyers, AI..."},{"start":3421.83,"text":"specialized cloud engineer, it would be a stretch to say that everything works, but there's work being done towards that. I'm not personally a fan of putting a face behind those things. I think it's gimmicky. And I think in a few years from now, actually very few products will have a human face behind it. But it might be a marketing tactic from some startups. It's more scary than it is engaging, frankly."},{"start":3451.79,"text":"Okay. I want to talk about the pirating shift. That's especially useful. Let's say you're a software engineer or you're planning to be a software engineer because software engineering as a discipline is sort of shifting or at least the best engineers I've worked with are able to move from a deterministic mindset to a fuzzy mindset."},{"start":3471.84,"text":"and balance between the two whenever they need to get something done so here's the paradigm shift between traditional software and agent tki software the first one is the way you handle data traditional software deals with structured data you have json's you have databases they're pasted in a very structured manner in a data engineering pipeline and then they're used to be displayed on a certain interface the user might feel a form that is then retrieved and pasted in the day"}],"speech_gaps":[],"frame":"../frames/v057/020.webp","frame_time":3340.2},{"title":"增强LLM应用中的模糊工程与代理AI软件","segments":[{"id":351,"text":"database, all of that historically has been structured data. Now, more and more companies are handling freeform text, images, and all of that requires dynamic interpretation to transform an input into an output. The software itself...","zh":"数据库，所有这些历史数据都是结构化数据。现在，越来越多的公司处理自由格式的文本、图像，以及所有这些都需要动态解释来将输入转换为输出。软件本身……","start":3501.23,"end":3519.63},{"id":352,"text":"Used to be deterministic. Now you have a lot of software that is fuzzy. And fuzzy software creates so many issues. I mean, imagine if you let your user ask anything on your website. The chances that it breaks is tremendous. The chances that you're attacked is tremendous. The chances, it's really, really complicated. It's more complicated than people make it seem on Twitter. Fuzzy engineering is truly hard.","zh":"过去是确定性的。现在你有很多软件是模糊的。而模糊的软件会带来很多问题。我的意思是，想象一下如果你让用户在你的网站上可以问任何问题。它出错的可能性是巨大的。你被攻击的可能性也是巨大的。它真的非常复杂。比人们在推特上说的要复杂得多。模糊工程确实是真正困难的。","start":3520.05,"end":3545.33},{"id":353,"text":"You might get hate as a company because one user did something that you authorized them to do that ended up breaking the database and ended up, you know, we've seen that with many companies in the last couple of years. So it takes a very specialized engineering mindset to do fuzzy engineering, but also know when you need to be deterministic. The other thing I'd call is with agentic AI software.","zh":"你可能会因为一家公司的一个用户做了你授权他们做的事情，结果破坏了数据库，最终导致一些问题，我们最近几年已经看到很多公司出现这种情况。因此，进行模糊工程需要一种非常专业的工程思维方式，同时也要知道何时需要确定性。另一点我要提到的是代理AI软件。","start":3546.97,"end":3568.79},{"id":354,"text":"you sort of want to think about your software as like your manager. So you're familiar with the monolith or microservices approaches in software, where you structure your software in different boxes that can talk to each other and it allows teams to debug one section at a time.","zh":"你可能希望将你的软件想象成你的经理。因此，你熟悉软件中的单体或微服务方法，其中你将软件结构化为不同的模块，这些模块可以互相通信，并允许团队一次调试一个部分。","start":3569.52,"end":3598.44},{"id":355,"text":"to be done by a group of humans, what would be those roles? Would I have a graphic designer that then puts together a chart and then sends it to a marketing manager that converts it into a nice blog post that then gives it to the performance marketing expert that then publishes the blog post and then optimizes an A-B test, then to a data scientist that analyzes the data and then puts hypotheses and validates them or invalidates them? That's how you typically think if you're building an agentic AI software.","zh":"如果由一组人类完成，那些角色会是什么？我会有一个图形设计师，然后将图表组合起来，再发送给营销经理，将其转化为一篇漂亮的博客文章，然后交给性能营销专家，发布博客文章并优化A/B测试，再交给数据科学家分析数据，然后提出假设并验证或证伪这些假设？这就是你通常会想到的，如果你在构建代理AI软件的话。","start":3598.8,"end":3627.12},{"id":356,"text":"When actually the equivalent of that in traditional software might be completely different. It might be we have a data engineer box right here that handles all our data engineering. And then here we have the UI, UX stuff. Everything UI, UX related goes here. And companies might structure it in very different ways. And here is the business logic that we want to care about. And there's five engineers working on the business logic, let's say. Okay.","zh":"实际上，在传统软件中，这可能完全不一样。我们可能在这里有一个数据工程师模块，负责处理所有的数据工程。然后这里是我们关于用户界面和用户体验（UI, UX）的内容。所有与UI和UX相关的内容都放在这里。公司可能会以非常不同的方式来组织这些部分。这里是我们需要关注的业务逻辑。比如说，这里有五位工程师在处理业务逻辑。好的。","start":3628.43,"end":3655.62},{"id":357,"text":"Testing and debugging is also very different. And we'll talk about it in the next section. The other thing that I feel matters is with AI in engineering, the cost of experimentation is going down drastically. And so people, I feel, should be more comfortable throwing away code.","zh":"测试和调试也完全不同。我们将在下一节讨论这一点。我觉得另一个重要的方面是，在工程中使用AI，实验的成本正在大幅下降。因此，我觉得人们应该更愿意丢弃代码。","start":3657.1,"end":3679.18}],"notes":["本段讨论了模糊工程在现代软件开发中的挑战，特别是当用户输入变得不可预测时，系统可能因错误操作而崩溃。讲者指出，这种模糊性导致了公司可能因用户行为而遭受负面评价，强调了在软件设计中需要平衡模糊性和确定性。","讲者将代理AI软件类比为经理，通过将任务分解为不同角色（如图形设计师、市场经理等）来构建系统。这种类比帮助理解如何将复杂任务分配给不同的AI模块，类似于传统软件中的微服务架构。","在代理AI软件中，每个角色对应一个AI模块，负责特定任务，如生成图表、撰写博客、优化A/B测试等。这种结构允许系统模块化，便于调试和维护。","传统软件架构可能采用不同的分层方式，例如数据工程师、UI/UX团队和业务逻辑模块。讲者指出，不同公司可能根据自身需求采用不同的架构方式。","测试和调试在代理AI软件中与传统软件有显著不同，这将在后续部分详细讨论。讲者强调了AI工程中实验成本的降低，使得开发人员可以更自由地尝试和丢弃代码。","讲者指出，随着AI技术的发展，实验成本的降低使得开发人员可以更轻松地进行尝试和迭代，从而加快产品开发和优化过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3501.23,"end":3679.18,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3501.23,"text":"database, all of that historically has been structured data. Now, more and more companies are handling freeform text, images, and all of that requires dynamic interpretation to transform an input into an output. The software itself..."},{"start":3520.05,"text":"Used to be deterministic. Now you have a lot of software that is fuzzy. And fuzzy software creates so many issues. I mean, imagine if you let your user ask anything on your website. The chances that it breaks is tremendous. The chances that you're attacked is tremendous. The chances, it's really, really complicated. It's more complicated than people make it seem on Twitter. Fuzzy engineering is truly hard."},{"start":3546.97,"text":"You might get hate as a company because one user did something that you authorized them to do that ended up breaking the database and ended up, you know, we've seen that with many companies in the last couple of years. So it takes a very specialized engineering mindset to do fuzzy engineering, but also know when you need to be deterministic. The other thing I'd call is with agentic AI software."},{"start":3569.52,"text":"you sort of want to think about your software as like your manager. So you're familiar with the monolith or microservices approaches in software, where you structure your software in different boxes that can talk to each other and it allows teams to debug one section at a time. Now the equivalent with agentic AI is you think as a manager. So you think, okay, if I was to delegate my products,"},{"start":3598.8,"text":"to be done by a group of humans, what would be those roles? Would I have a graphic designer that then puts together a chart and then sends it to a marketing manager that converts it into a nice blog post that then gives it to the performance marketing expert that then publishes the blog post and then optimizes an A-B test, then to a data scientist that analyzes the data and then puts hypotheses and validates them or invalidates them? That's how you typically think if you're building an agentic AI software."},{"start":3628.43,"text":"When actually the equivalent of that in traditional software might be completely different. It might be we have a data engineer box right here that handles all our data engineering. And then here we have the UI, UX stuff. Everything UI, UX related goes here. And companies might structure it in very different ways. And here is the business logic that we want to care about. And there's five engineers working on the business logic, let's say. Okay."},{"start":3657.1,"text":"Testing and debugging is also very different. And we'll talk about it in the next section. The other thing that I feel matters is with AI in engineering, the cost of experimentation is going down drastically. And so people, I feel, should be more comfortable throwing away code."}],"speech_gaps":[],"frame":"../frames/v057/021.webp","frame_time":3513.23},{"title":"传统软件工程与AI工程的对比","segments":[{"id":358,"text":"In traditional software engineering, you probably don't throw away code a ton. You build a code and it's solid and it's bulletproof and then you update it over time. We've seen AI companies be more comfortable throwing away codes, which has advantages in terms of the speed at which you move, but also disadvantages in terms of the quality of your software that can break more.","zh":"在传统的软件工程中，你可能不会大量丢弃代码。你编写一段代码，它很稳固且经过充分验证，然后随着时间的推移进行更新。我们看到AI公司更倾向于丢弃代码，这在移动速度方面有优势，但也可能导致软件质量下降，因为代码更容易出错。","start":3681.42,"end":3705.38},{"id":359,"text":"Okay. So anyway, just wanted to do an","zh":"好的。总之，我只是想做一个","start":3708.43,"end":3710.59},{"id":360,"text":"apartheid on the paradigm shift","zh":"关于范式转变的种族隔离","start":3710.59,"end":3712.75},{"id":361,"text":"from deterministic to fuzzy engineering.","zh":"从确定性工程到模糊工程。","start":3712.75,"end":3714.73},{"id":362,"text":"Oh, and actually I can give you an example","zh":"哦，实际上我可以给你一个例子","start":3720.41,"end":3722.39},{"id":363,"text":"from Workera that we","zh":"来自Workera，我们","start":3722.39,"end":3724.77},{"id":364,"text":"learned probably over","zh":"可能在过去12个月里学到的。就像，如果","start":3724.77,"end":3726.73},{"id":365,"text":"the last 12 months. It's like, if","zh":"最近的12个月。就像，如果","start":3726.73,"end":3728.53},{"id":366,"text":"you've used Workera, you might have seen","zh":"你使用过Workera，你可能已经看到","start":3728.53,"end":3730.67},{"id":367,"text":"that the interface has","zh":"它的界面有","start":3730.67,"end":3731.67},{"id":368,"text":"asked you sometimes multiple choice","zh":"有时会问你多项选择题","start":3733.07,"end":3734.73},{"id":369,"text":"questions. And sometimes it asks you","zh":"有时它会问你","start":3734.73,"end":3736.83},{"id":370,"text":"multiple select and sometimes it asks you drag and drop ordering matching whatever right those","zh":"多项选择题，有时它会问你拖放排序匹配等各种问题，这些","start":3736.83,"end":3741.73},{"id":371,"text":"are example of deterministic item types meaning you answer the question on a multiple choice","zh":"是确定性题型的例子，意味着你在多项选择题上回答问题","start":3741.73,"end":3747.31},{"id":372,"text":"there's one correct answer it's fully deterministic on the other hand you sometimes have voice","zh":"有一个正确答案，它是完全确定的，另一方面，你有时会遇到语音","start":3747.31,"end":3752.95},{"id":373,"text":"questions where you go to a role play or you have voice plus coding questions where your code is","zh":"问题，你需要进行角色扮演，或者你会遇到语音加编程的问题，你的代码是","start":3752.95,"end":3759.09},{"id":374,"text":"being read by the interface or whatever those are fuzzy meaning the scoring algorithm might","zh":"被接口读取或无论那些是什么模糊含义的评分算法可能会","start":3759.09,"end":3765.95},{"id":375,"text":"actually make mistakes. And those mistakes might be costly. And so companies have to figure out","zh":"实际上犯错误。而这些错误可能会带来代价。因此，公司必须想办法","start":3765.95,"end":3772.13},{"id":376,"text":"a human in the loop system, which you might have seen the appeal feature at the end. So at the end","zh":"建立一个人机协同系统，你可能在最后看到了申诉功能。因此，在评估结束时","start":3772.13,"end":3777.19},{"id":377,"text":"of the assessment, you have an appeal feature where it allows you to say, I want to appeal","zh":"你会有一个申诉功能，允许你说：我想申诉","start":3777.19,"end":3781.31},{"id":378,"text":"the agent because I want to challenge what the agent said on my answer, because I thought that","zh":"这个代理，因为我想要挑战代理对我答案的判断，因为我认为","start":3781.77,"end":3786.61},{"id":379,"text":"was better than what the agent thought. And then you bring a human in the loop that then can fix","zh":"那比代理认为的更好。然后你引入一个人机协同机制，这个人机协同机制","start":3786.61,"end":3790.95},{"id":380,"text":"the agent, can tell the agent, actually, you were too harsh on the answer of this person.","zh":"可以修正代理，可以告诉代理，实际上，你对这个人答案的评判过于严厉了。","start":3790.95,"end":3795.23},{"id":381,"text":"Um, and you know, that's an example of a fuzzy engineered system that then adds a human in","zh":"嗯，这就是一个模糊工程系统的一个例子，然后引入了人类参与","start":3795.95,"end":3801.95},{"id":382,"text":"the loop to make it more aligned.","zh":"循环以使其更加对齐。","start":3801.95,"end":3803.65},{"id":383,"text":"And so if you're building a company, I would encourage you to think about what can I get","zh":"因此，如果你在建立一家公司，我鼓励你思考什么是可以用确定性来完成的，让我们先完成这些。","start":3804.09,"end":3808.65},{"id":384,"text":"done with determinism and let's get that done.","zh":"然后是模糊的部分，我想做模糊的，因为它允许更多的互动。","start":3808.65,"end":3810.81},{"id":385,"text":"And then the fuzzy stuff, I want to do fuzzy because it allows more interaction.","zh":"它允许更多的来回交流，但我需要在周围设置护栏。","start":3810.97,"end":3815.77},{"id":386,"text":"It allows more back and forth, but I need to put guardrails around it.","zh":"我该如何设计这些护栏？","start":3815.87,"end":3819.79},{"id":387,"text":"And how am I going to design those guardrails?","zh":"差不多就是这样。","start":3819.87,"end":3821.73},{"id":388,"text":"Pretty much.","zh":"好的。","start":3821.73,"end":3822.25},{"id":389,"text":"All right.","zh":"好吧。","start":3822.43,"end":3822.95},{"id":390,"text":"Here's another example from enterprise workflows, which are likely to change due to agentic AI. This is a paper from McKinsey, I believe from last year, where they looked at a financial institution and they said that, you know, we observed that they often spend one to four weeks to create a credit risk memo. And here's the process. A relationship manager.","zh":"这里还有一个来自企业工作流程的例子，这些流程可能会因为代理型AI而发生变化。这是一篇麦肯锡的论文，我认为是去年发表的，他们研究了一家金融机构，并指出，他们通常需要花费一到四周的时间来创建一份信用风险备忘录。以下是该流程。客户经理。","start":3825.04,"end":3848.98},{"id":391,"text":"Gathers data from 15 and more than 15 sources on the borrower, loan type.","zh":"从借款人和贷款类型收集15个以上来源的数据。","start":3850.32,"end":3856.5}],"notes":["本段讨论了传统软件工程与AI工程在开发方式上的差异。传统软件工程注重代码的稳定性和长期维护，而AI工程则更倾向于快速迭代，但可能牺牲软件质量。这种差异源于AI系统的不确定性，即模糊工程（fuzzy engineering）的特点。","讲者通过Workera的例子说明了模糊工程的应用。在Workera中，系统有时会使用确定性问题（如单选题），有时则使用模糊问题（如语音问答或代码评估），后者可能因评分算法的不准确性而产生错误，进而需要引入人类监督机制。","模糊工程的挑战在于如何在系统中引入人类监督，以确保质量。讲者提到，Workera在评估结束后提供了申诉功能，允许用户挑战AI的评分结果，并引入人类进行修正。","讲者建议在构建公司时，应优先利用确定性方法完成核心任务，再在需要交互和灵活性的部分引入模糊工程，同时设置适当的边界条件（guardrails）以控制风险。","讲者还提到，企业流程（如信用风险分析）可能因AI代理（agentic AI）而发生变化。例如，某金融机构的信用风险分析流程原本需要1至4周，而AI可能改变这一流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3681.42,"end":3856.5,"asr_flags":[],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":3681.42,"text":"In traditional software engineering, you probably don't throw away code a ton. You build a code and it's solid and it's bulletproof and then you update it over time. We've seen AI companies be more comfortable throwing away codes, which has advantages in terms of the speed at which you move, but also disadvantages in terms of the quality of your software that can break more."},{"start":3708.43,"text":"Okay. So anyway, just wanted to do an"},{"start":3710.59,"text":"apartheid on the paradigm shift"},{"start":3712.75,"text":"from deterministic to fuzzy engineering."},{"start":3720.41,"text":"Oh, and actually I can give you an example"},{"start":3722.39,"text":"from Workera that we"},{"start":3724.77,"text":"learned probably over"},{"start":3726.73,"text":"the last 12 months. It's like, if"},{"start":3728.53,"text":"you've used Workera, you might have seen"},{"start":3730.67,"text":"that the interface has"},{"start":3733.07,"text":"asked you sometimes multiple choice"},{"start":3734.73,"text":"questions. And sometimes it asks you"},{"start":3736.83,"text":"multiple select and sometimes it asks you drag and drop ordering matching whatever right those"},{"start":3741.73,"text":"are example of deterministic item types meaning you answer the question on a multiple choice"},{"start":3747.31,"text":"there's one correct answer it's fully deterministic on the other hand you sometimes have voice"},{"start":3752.95,"text":"questions where you go to a role play or you have voice plus coding questions where your code is"},{"start":3759.09,"text":"being read by the interface or whatever those are fuzzy meaning the scoring algorithm might"},{"start":3765.95,"text":"actually make mistakes. And those mistakes might be costly. And so companies have to figure out"},{"start":3772.13,"text":"a human in the loop system, which you might have seen the appeal feature at the end. So at the end"},{"start":3777.19,"text":"of the assessment, you have an appeal feature where it allows you to say, I want to appeal"},{"start":3781.77,"text":"the agent because I want to challenge what the agent said on my answer, because I thought that"},{"start":3786.61,"text":"was better than what the agent thought. And then you bring a human in the loop that then can fix"},{"start":3790.95,"text":"the agent, can tell the agent, actually, you were too harsh on the answer of this person."},{"start":3795.95,"text":"Um, and you know, that's an example of a fuzzy engineered system that then adds a human in"},{"start":3801.95,"text":"the loop to make it more aligned."},{"start":3804.09,"text":"And so if you're building a company, I would encourage you to think about what can I get"},{"start":3808.65,"text":"done with determinism and let's get that done."},{"start":3810.97,"text":"And then the fuzzy stuff, I want to do fuzzy because it allows more interaction."},{"start":3815.87,"text":"It allows more back and forth, but I need to put guardrails around it."},{"start":3819.87,"text":"And how am I going to design those guardrails?"},{"start":3821.73,"text":"Pretty much."},{"start":3822.43,"text":"All right."},{"start":3825.04,"text":"Here's another example from enterprise workflows, which are likely to change due to agentic AI. This is a paper from McKinsey, I believe from last year, where they looked at a financial institution and they said that, you know, we observed that they often spend one to four weeks to create a credit risk memo. And here's the process. A relationship manager."},{"start":3850.32,"text":"Gathers data from 15 and more than 15 sources on the borrower, loan type."}],"speech_gaps":[],"frame":"../frames/v057/022.webp","frame_time":3693.42},{"title":"增强LLM应用：流程优化与组织变革","segments":[{"id":392,"text":"Other factors, then the relationship manager and the credit analyst collaboratively analyze that data from these sources. Then the credit analyst typically spends 20 hours or more writing a memo and then goes back to the relationship manager. They give feedback and then they go through this loop again and again. And it takes a long time to get a credit memo out.","zh":"其他因素，关系经理和信用分析师会共同分析这些来源的数据。然后信用分析师通常需要花费20小时或更多时间撰写备忘录，然后返回给关系经理。他们提供反馈，然后重复这个循环。要得到一份信用备忘录需要很长时间。","start":3857.12,"end":3880.84},{"id":393,"text":"They then run a research study where they changed the process. They said Gen AI agents could actually cut time by 20 to 60% on credit risk memos. And the process has changed to the relationship manager directly work with the Gen AI agent system, provides relevant materials that needs to produce the memo. The agent subdivises the project into tasks that are assigned to specialist agents, gathers and analyzes the data from multiple sources.","zh":"他们随后进行了一项研究，改变了流程。他们表示，生成式AI代理实际上可以将信用风险备忘录的时间缩短20%到60%。流程已改变为关系经理直接与生成式AI代理系统合作，提供生成备忘录所需的材料。代理将项目细分为任务，分配给专业代理，从多个来源收集和分析数据。","start":3882.06,"end":3910.92},{"id":394,"text":"drafts a memo, then the relationship manager and the credit analyst sit down together, review the memo, give feedback to the agent, and within 20% to 60% less time are done. And so this is an example where you're actually not changing the human stakeholders. You're just changing the process and adding Gen AI to reduce the time it takes to get a credit memo out. It turns out that...","zh":"起草备忘录后，关系经理和信用分析师会坐在一起，审查备忘录，向代理提供反馈，并在20%到60%更短的时间内完成。这是一个例子，你实际上并没有改变人类利益相关者，只是改变了流程，并加入生成式AI以减少获取信用备忘录所需的时间。结果发现，","start":3911.59,"end":3935.79},{"id":395,"text":"Imagine you're an enterprise and you have 100,000 employees and there's a lot of enterprises with 100,000 employees out there. You are currently under crisis in terms of redesigning your workflows. It turns out that if you actually pull the job descriptions from the HR system and you interpret them, you also pull the business process workflows that you have encoded in your...","zh":"想象你是一家企业，你有100,000名员工，而且还有许多其他企业也有100,000名员工。你目前正处于重新设计工作流程的危机中。结果发现，如果你从人力资源系统中提取工作描述并进行解读，你也会提取出你已经在其中编码的业务流程工作流。","start":3936.96,"end":3961.86},{"id":396,"text":"you actually can find gains in multiple places. And in the next few years, you're probably going to see workflows being more optimized to add Gen AI. Even if that happens, the hardest part is changing people. What we know this is, this is great in theory, but now let's try to fit that second workflow for 10,000 credits, risk analysts and relationship managers. My guess is it will take years. It will take 10, 20 years.","zh":"你实际上可以在多个地方发现改进空间。在接下来的几年里，你可能会看到工作流程更加优化，加入生成式AI。即使发生这种情况，最难的部分仍然是改变人们。我们了解这一点，这在理论上很好，但现在让我们尝试为10,000份信用风险分析和关系经理拟合这个第二流程。我的猜测是这将需要数年时间，可能需要10到20年。","start":3962.26,"end":3990.98},{"id":397,"text":"get to this being actually done at scale within an organization because change is so hard, you know, so hard to rewire business workflows, job descriptions, incentivize people to do different and be different and train them. And so, you know, this is what the world is going towards, but it's going to take a long time, I think.","zh":"要让这种做法在组织中大规模实施实际上非常困难，因为变革本身就很难，比如重新设计业务流程、职位描述、激励人们做不同的事情并变得不同，以及对他们进行培训。因此，我认为世界正在朝这个方向发展，但这将需要很长时间。","start":3991.66,"end":4012.86}],"notes":["本段讨论了在信用风险备忘录生成过程中引入生成式AI代理的优化流程。传统流程中，关系经理和信用分析师需要花费大量时间撰写备忘录，并反复进行反馈循环。而通过引入AI代理，流程被重新设计，AI负责将任务分配给专业代理，收集和分析数据，最终生成备忘录，从而将时间缩短20%到60%。","该段还指出，虽然AI可以显著提高效率，但真正的挑战在于组织内部的变革。即使技术可行，改变人们的工作方式、调整工作描述、激励员工适应新流程仍然需要很长时间，可能需要10到20年。","此外，本段提到，企业拥有大量员工时，通过从HR系统中提取职位描述和业务流程，可以发现多个优化点。未来几年，随着AI的进一步应用，工作流程将更加优化，但组织变革的难度依然存在。","讲者强调，尽管AI在理论上具有巨大潜力，但实际应用中需要克服组织内部的阻力，包括重新设计工作流程、调整激励机制以及对员工进行培训。这些因素使得大规模应用AI仍然面临挑战。","最后，讲者指出，虽然世界正在向AI驱动的工作流程转变，但这一过程将是一个长期的过程，需要耐心和持续的努力。","本段通过具体案例说明了AI在优化业务流程中的潜力，同时也指出了组织变革的复杂性和长期性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3857.12,"end":4012.86,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3857.12,"text":"Other factors, then the relationship manager and the credit analyst collaboratively analyze that data from these sources. Then the credit analyst typically spends 20 hours or more writing a memo and then goes back to the relationship manager. They give feedback and then they go through this loop again and again. And it takes a long time to get a credit memo out."},{"start":3882.06,"text":"They then run a research study where they changed the process. They said Gen AI agents could actually cut time by 20 to 60% on credit risk memos. And the process has changed to the relationship manager directly work with the Gen AI agent system, provides relevant materials that needs to produce the memo. The agent subdivises the project into tasks that are assigned to specialist agents, gathers and analyzes the data from multiple sources."},{"start":3911.59,"text":"drafts a memo, then the relationship manager and the credit analyst sit down together, review the memo, give feedback to the agent, and within 20% to 60% less time are done. And so this is an example where you're actually not changing the human stakeholders. You're just changing the process and adding Gen AI to reduce the time it takes to get a credit memo out. It turns out that..."},{"start":3936.96,"text":"Imagine you're an enterprise and you have 100,000 employees and there's a lot of enterprises with 100,000 employees out there. You are currently under crisis in terms of redesigning your workflows. It turns out that if you actually pull the job descriptions from the HR system and you interpret them, you also pull the business process workflows that you have encoded in your..."},{"start":3962.26,"text":"you actually can find gains in multiple places. And in the next few years, you're probably going to see workflows being more optimized to add Gen AI. Even if that happens, the hardest part is changing people. What we know this is, this is great in theory, but now let's try to fit that second workflow for 10,000 credits, risk analysts and relationship managers. My guess is it will take years. It will take 10, 20 years."},{"start":3991.66,"text":"get to this being actually done at scale within an organization because change is so hard, you know, so hard to rewire business workflows, job descriptions, incentivize people to do different and be different and train them. And so, you know, this is what the world is going towards, but it's going to take a long time, I think."}],"speech_gaps":[],"frame":"../frames/v057/023.webp","frame_time":3869.12},{"title":"智能体的核心组件与记忆管理","segments":[{"id":398,"text":"Okay, then I want to talk about how the agent actually works and what are the core components of an agent. Imagine a travel booking AI agent. That's an easy example you've all thought about. I still haven't been able to get an agent to book a trip for me or I was scared because it was going to book a very expensive or long trip. But in theory...","zh":"好的，那么我想谈谈智能体是如何实际运作的，以及智能体的核心组件是什么。想象一个旅行预订的AI智能体。这是一个你们都曾思考过的简单例子。我仍然没能让智能体为我预订一次旅行，或者我害怕它会预订一个非常昂贵或漫长的旅行。但理论上...","start":4015.6,"end":4037.84},{"id":399,"text":"you can have a travel booking agent that has prompts. So the prompts we've seen, we know the methods to optimize those prompts. That travel agent also has a context management system, which is essentially the memory of what it knows about the user. That context management system might include a core memory or working memory and an archival memory. What the difference is within memory,","zh":"你可以拥有一个旅行预订智能体，它具有提示（prompts）。我们已经见过这些提示，也知道优化这些提示的方法。这个旅行智能体还具有一个上下文管理系统，这实际上就是它所知道的用户信息的记忆。这个上下文管理系统可能包括一个核心记忆或工作记忆，以及一个归档记忆。在记忆内部，区别是...","start":4038.92,"end":4065.94},{"id":400,"text":"um is not every memory needs to be fast to access like think about it you you're onboarded on a","zh":"并不是每条记忆都需要快速访问，想想看，当你被引入一个产品时，第一个问题是‘你好，你叫什么名字？’我说我的名字是Kian，这可能","start":4066.84,"end":4073.58},{"id":401,"text":"product and the first question is hi what's your name and i say my name is kian that's probably","zh":"会存放在工作记忆中，因为每次智能体与我交谈时，","start":4073.58,"end":4079.78},{"id":402,"text":"going to sit in the working memory because the agent every time he's going to talk to me he's","zh":"它都会想要使用我的名字。但随后可能第二个问题是‘Kian，你生日是什么时候？’","start":4079.78,"end":4083.6},{"id":403,"text":"going to want to use my name right but then maybe the second question is kian what's your birthday","zh":"我说出我的生日，它是否需要每天使用我的生日？可能不需要，因此它可能会","start":4083.6,"end":4088.26},{"id":404,"text":"and i give it my birthday does it need my birthday every day probably not so it's probably going to","zh":"存储在长期记忆或归档记忆中，而这些记忆的访问速度较慢。","start":4088.26,"end":4093.38},{"id":405,"text":"targets on the long-term memory or the archival memory and those memories are slower to access","zh":"目标位于长期记忆或档案记忆中，而这些记忆的访问速度较慢","start":4093.38,"end":4099.92},{"id":406,"text":"they're farther down the stack and you know that structure allows agent to determine what's the","zh":"它们位于栈的下方，你知道这种结构使智能体能够确定什么是工作记忆，什么是长期记忆，你知道这使得智能体更容易","start":4099.92,"end":4105.92},{"id":407,"text":"working memory and what's a long-term memory you know and that makes it easier for the agent to","zh":"快速检索，想想看，当你与Chat GPT互动时，你有时会感觉它非常个性化，你会觉得它理解你，想象每次你调用","start":4105.92,"end":4110.98},{"id":408,"text":"retrieve super fast because think about it when you interact with chat gpt you feel that it's","zh":"它时，它都必须读取记忆，这可能会很昂贵，它就像一种非常耗费资源的成本，因为每次你与它交谈时都会发生这种情况，因此你希望","start":4110.98,"end":4116.1},{"id":409,"text":"very personal at times right you feel like it understands you um imagine every time you call","zh":"在工作记忆上进行高度优化，你知道，如果每次你要与你的LLM交谈时，都要花三秒钟去查找记忆，那么每次交谈都会花费三秒钟，这你并不希望","start":4116.1,"end":4121.36},{"id":410,"text":"it it has to read the memories right and that can be costly it's like a very it's a very burdensome","zh":"所以无论如何，你还有","start":4121.36,"end":4127.52},{"id":411,"text":"cost because it happens every time you talk to it so you want to be highly optimized with the","zh":"工作记忆","start":4127.52,"end":4133.2},{"id":412,"text":"working memory you know if it takes three seconds to look in the memory every time you're going to","zh":"的代价","start":4133.2,"end":4138.36},{"id":413,"text":"talk to your llm it's going to take three seconds which you don't want so anyway and then you have","zh":"如果每次你要与你的LLM交谈时，都要花三秒钟去查找记忆，那么每次交谈都会花费三秒钟，这你并不希望，所以无论如何，你还有","start":4138.36,"end":4143.62},{"id":414,"text":"the tools the tools can include apis like a flight search api hotel booking api car rental api weather","zh":"这些工具可以包括诸如航班搜索API、酒店预订API、汽车租赁API和天气API等API","start":4143.62,"end":4150.76},{"id":415,"text":"API and then the payment processing API and typically you would want to","zh":"API，然后是支付处理API，通常你希望","start":4150.76,"end":4156.0},{"id":416,"text":"to tell your agent how that API works.","zh":"告诉你的智能体该API是如何工作的。","start":4156.43,"end":4159.07},{"id":417,"text":"It turns out that agents, or LLMs, I should say,","zh":"事实上，智能体，或者说大型语言模型（LLMs），我应该这么说，","start":4159.41,"end":4162.87},{"id":418,"text":"are very good at reading API documentation.","zh":"在阅读API文档方面非常擅长。","start":4162.97,"end":4165.29},{"id":419,"text":"So you give it the API documentation, and it reads the JSON,","zh":"因此，你只需提供API文档，它就会阅读JSON格式，","start":4165.73,"end":4168.53},{"id":420,"text":"and it reads what does a get request look like,","zh":"并阅读GET请求看起来是什么样子，","start":4168.79,"end":4171.37},{"id":421,"text":"and this is the format that I need to push,","zh":"以及我需要推送的格式是怎样的。","start":4171.47,"end":4173.99},{"id":422,"text":"and then it pushes it in that format, let's say.","zh":"然后它以这种格式将信息推入其中。","start":4174.15,"end":4176.81},{"id":423,"text":"And then it retrieves something.","zh":"然后它会检索一些内容。","start":4177.47,"end":4178.81},{"id":424,"text":"Does that make sense, those different components?","zh":"这些不同的组件这样理解是否清楚？","start":4180.93,"end":4182.99},{"id":425,"text":"you know entropic also talks about resources resources is data that is sitting somewhere","zh":"你知道，熵也谈到资源，资源是存储在某处的数据","start":4182.99,"end":4190.67}],"notes":["本段讲解了智能体的核心组件，包括提示（prompts）、上下文管理系统（context management system）和工具（tools）。上下文管理系统分为工作记忆（working memory）和归档记忆（archival memory），工作记忆用于快速访问的当前信息，而归档记忆用于长期存储的信息，访问速度较慢。这种分层结构有助于智能体高效地检索信息。","讲者通过一个旅行预订智能体的例子，说明了智能体如何管理用户信息。例如，用户的名字会被存储在工作记忆中，而生日等信息可能存储在归档记忆中。这种区分使得智能体在与用户交互时能够快速访问关键信息，同时避免频繁访问慢速存储。","讲者提到，智能体需要优化工作记忆的访问速度，因为每次访问工作记忆都会带来延迟。如果每次访问需要三秒钟，这将严重影响用户体验。因此，智能体的设计需要在工作记忆和归档记忆之间进行权衡。","工具部分包括各种API，如航班搜索、酒店预订、租车和天气API，以及支付处理API。讲者强调，需要向智能体解释这些API的工作方式，以便智能体能够正确调用。","讲者指出，智能体或大型语言模型（LLMs）在阅读API文档方面表现良好。通过提供API文档，智能体可以理解如何构造请求，并以正确的格式推送数据，从而实现功能。","最后，讲者询问听众是否理解这些不同组件，表明课程内容的重点在于理解智能体的结构和工作原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4015.6,"end":4190.67,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":4015.6,"text":"Okay, then I want to talk about how the agent actually works and what are the core components of an agent. Imagine a travel booking AI agent. That's an easy example you've all thought about. I still haven't been able to get an agent to book a trip for me or I was scared because it was going to book a very expensive or long trip. But in theory..."},{"start":4038.92,"text":"you can have a travel booking agent that has prompts. So the prompts we've seen, we know the methods to optimize those prompts. That travel agent also has a context management system, which is essentially the memory of what it knows about the user. That context management system might include a core memory or working memory and an archival memory. What the difference is within memory,"},{"start":4066.84,"text":"um is not every memory needs to be fast to access like think about it you you're onboarded on a"},{"start":4073.58,"text":"product and the first question is hi what's your name and i say my name is kian that's probably"},{"start":4079.78,"text":"going to sit in the working memory because the agent every time he's going to talk to me he's"},{"start":4083.6,"text":"going to want to use my name right but then maybe the second question is kian what's your birthday"},{"start":4088.26,"text":"and i give it my birthday does it need my birthday every day probably not so it's probably going to"},{"start":4093.38,"text":"targets on the long-term memory or the archival memory and those memories are slower to access"},{"start":4099.92,"text":"they're farther down the stack and you know that structure allows agent to determine what's the"},{"start":4105.92,"text":"working memory and what's a long-term memory you know and that makes it easier for the agent to"},{"start":4110.98,"text":"retrieve super fast because think about it when you interact with chat gpt you feel that it's"},{"start":4116.1,"text":"very personal at times right you feel like it understands you um imagine every time you call"},{"start":4121.36,"text":"it it has to read the memories right and that can be costly it's like a very it's a very burdensome"},{"start":4127.52,"text":"cost because it happens every time you talk to it so you want to be highly optimized with the"},{"start":4133.2,"text":"working memory you know if it takes three seconds to look in the memory every time you're going to"},{"start":4138.36,"text":"talk to your llm it's going to take three seconds which you don't want so anyway and then you have"},{"start":4143.62,"text":"the tools the tools can include apis like a flight search api hotel booking api car rental api weather"},{"start":4150.76,"text":"API and then the payment processing API and typically you would want to"},{"start":4156.43,"text":"to tell your agent how that API works."},{"start":4159.41,"text":"It turns out that agents, or LLMs, I should say,"},{"start":4162.97,"text":"are very good at reading API documentation."},{"start":4165.73,"text":"So you give it the API documentation, and it reads the JSON,"},{"start":4168.79,"text":"and it reads what does a get request look like,"},{"start":4171.47,"text":"and this is the format that I need to push,"},{"start":4174.15,"text":"and then it pushes it in that format, let's say."},{"start":4177.47,"text":"And then it retrieves something."},{"start":4180.93,"text":"Does that make sense, those different components?"},{"start":4182.99,"text":"you know entropic also talks about resources resources is data that is sitting somewhere"}],"speech_gaps":[],"frame":"../frames/v057/024.webp","frame_time":4027.6},{"title":"增强LLM应用中的自主性架构","segments":[{"id":426,"text":"that you might let your agent read for example if you're building your startups you have a crm","zh":"你可能会让你的代理阅读，例如，如果你在构建你的初创公司，你有一个客户关系管理（CRM）系统","start":4190.67,"end":4196.69},{"id":427,"text":"a crm has data in it and you want to use lookups in that data you will probably give a lookup tool","zh":"一个CRM系统中有数据，你希望在这些数据中进行查找，你可能会提供一个查找工具","start":4196.69,"end":4203.63},{"id":428,"text":"and you will give access to the resource and it will do lookups whenever you want super fast","zh":"并且你会给予访问资源的权限，它会在你想要的时候进行快速查找","start":4203.63,"end":4208.67},{"id":429,"text":"So, this type of architecture can be built with different degrees of autonomy, from the least autonomous to the most autonomous.","zh":"因此，这种类型的架构可以根据自主性的程度进行构建，从最低自主性到最高自主性","start":4208.67,"end":4219.19},{"id":430,"text":"And I'll give you a few examples.","zh":"我会给你几个例子","start":4219.55,"end":4220.95},{"id":431,"text":"Less autonomous would be you've hard-coded the steps.","zh":"较低自主性的情况是你已经硬编码了步骤","start":4222.13,"end":4225.53},{"id":432,"text":"So, let's say I tell the travel agent, first identify the intent, then look up in the database the history of this customer with us and their preferences.","zh":"例如，我告诉旅行代理，第一步是识别意图，然后在数据库中查找该客户与我们的历史记录和偏好","start":4225.67,"end":4237.79},{"id":433,"text":"is, then go to the flight API, blah, blah, blah, then go to the, I would hard code the","zh":"然后去航班API， blah, blah, blah, 然后去，我会硬编码的","start":4237.79,"end":4243.05},{"id":434,"text":"steps.","zh":"步骤。","start":4243.05,"end":4243.29},{"id":435,"text":"Okay.","zh":"好的。","start":4243.53,"end":4243.97},{"id":436,"text":"That's the least autonomous.","zh":"这是最不自主的。","start":4244.23,"end":4245.55},{"id":437,"text":"The semi-autonomous is I might hard code the tools, but I'm not going to hard code the","zh":"半自主的是我可能会硬编码工具，但我不打算硬编码","start":4246.35,"end":4252.27},{"id":438,"text":"steps.","zh":"步骤。","start":4252.27,"end":4252.61},{"id":439,"text":"So I'm going to tell the agents, um, your acts like a travel agents and, um, and, uh,","zh":"所以我将告诉代理，嗯，你的行为就像旅行代理一样，嗯，而且，嗯，","start":4252.97,"end":4262.35},{"id":440,"text":"you, your task is to help the person book a travel.","zh":"你的任务是帮助这个人预订旅行。","start":4262.51,"end":4265.93},{"id":441,"text":"and these are the tools that you have accessible to yourself.","zh":"并且这些是你自己可以访问的工具。","start":4265.93,"end":4268.77},{"id":442,"text":"And so I'm not hard-coding the steps,","zh":"因此，我没有硬编码步骤，","start":4269.11,"end":4271.03},{"id":443,"text":"I'm just hard-coding the tools that you have access to for yourself.","zh":"我只是硬编码你自己可以使用的工具。","start":4271.13,"end":4274.13},{"id":444,"text":"The more autonomous is the agent decides the steps","zh":"代理越自主，它就越能决定步骤","start":4274.73,"end":4278.33},{"id":445,"text":"and can create the tools.","zh":"并且可以创建工具。","start":4278.33,"end":4280.29},{"id":446,"text":"So that's where you might give actually access to a code editor to the agent.","zh":"因此，你可能会实际给代理提供一个代码编辑器的访问权限。","start":4280.61,"end":4284.97},{"id":447,"text":"And the agent might actually be able to ping any API in the web,","zh":"代理甚至可能实际能够调用网络上的任何API，","start":4285.09,"end":4289.15},{"id":448,"text":"perform some web search.","zh":"执行一些网络搜索。","start":4289.25,"end":4290.47},{"id":449,"text":"It might even be able to create some code to display data to the user.","zh":"它甚至可能能够创建一些代码来向用户显示数据。","start":4290.77,"end":4294.81},{"id":450,"text":"It might even be able to perform some calculations like, oh, I'm going to calculate the fastest route to get from San Francisco to New York.","zh":"它甚至可能能够执行一些计算，比如，哦，我要计算从旧金山到纽约的最快路线。","start":4294.81,"end":4303.29},{"id":451,"text":"And which one might be the most appropriate for what the user is looking for.","zh":"然后，哪一种可能是最符合用户需求的。","start":4303.75,"end":4308.27},{"id":452,"text":"And then I want to calculate the distance between the airport and that hotel versus that hotel.","zh":"接着，我想计算机场到这家酒店的距离，与那家酒店的距离。","start":4308.47,"end":4312.71},{"id":453,"text":"And I'm going to...","zh":"然后我将...","start":4312.89,"end":4313.53},{"id":454,"text":"code to do that. So it's actually fully autonomous from that perspective. So yeah, remember those keywords, memory, prompts, tools, etc.","zh":"编写代码来完成这些任务。因此，从这个角度来看，它实际上是完全自主的。所以，记得这些关键词：记忆、提示、工具等。","start":4313.64,"end":4328.58},{"id":455,"text":"Now, I presented the flight API, but it does not have to be an API. You probably have heard the term MCP or model context protocol that was coined by Anthropic. I pasted the seminal article on MCP at the bottom of this slide. But let me explain in a nutshell why those things would differ. In the API case, you would actually teach.","zh":"现在，我介绍了航班API，但它不一定要是API。你可能听说过Anthropic提出的MCP（模型上下文协议）这一术语。我在本幻灯片底部贴上了关于MCP的奠基性文章。但让我简要解释一下为什么这些事物会有所不同。在API的情况下，你实际上会进行教学。","start":4330.32,"end":4355.99}],"notes":["本段讲解了增强LLM应用中不同自主性级别的架构设计。最不自主的系统是将步骤硬编码，例如旅行代理需要明确的指令，如识别意图、查找客户历史记录和偏好、调用航班API等。这种设计缺乏灵活性，完全依赖预设的步骤。","半自主系统则将工具硬编码，但不硬编码步骤。代理被赋予可访问的工具，例如数据库和API，但具体执行步骤由代理决定。这种设计提高了灵活性，但仍然需要一定程度的指导。","最自主的系统允许代理自主决定步骤，并创建工具。例如，代理可以访问代码编辑器，调用任意API，执行网络搜索，甚至编写代码进行计算，如计算从旧金山到纽约的最快路线。这种设计赋予代理高度的自主性。","本段还提到MCP（Model Context Protocol）这一概念，由Anthropic提出，用于描述不同系统间交互的协议。与API不同，MCP可能涉及更复杂的上下文管理，但具体细节未展开。","课堂中强调了自主性架构的关键要素，包括记忆、提示（prompts）、工具（tools）等。这些要素共同决定了代理的自主程度和功能范围。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4190.67,"end":4355.99,"asr_flags":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":4190.67,"text":"that you might let your agent read for example if you're building your startups you have a crm"},{"start":4196.69,"text":"a crm has data in it and you want to use lookups in that data you will probably give a lookup tool"},{"start":4203.63,"text":"and you will give access to the resource and it will do lookups whenever you want super fast"},{"start":4208.67,"text":"So, this type of architecture can be built with different degrees of autonomy, from the least autonomous to the most autonomous."},{"start":4219.55,"text":"And I'll give you a few examples."},{"start":4222.13,"text":"Less autonomous would be you've hard-coded the steps."},{"start":4225.67,"text":"So, let's say I tell the travel agent, first identify the intent, then look up in the database the history of this customer with us and their preferences."},{"start":4237.79,"text":"is, then go to the flight API, blah, blah, blah, then go to the, I would hard code the"},{"start":4243.05,"text":"steps."},{"start":4243.53,"text":"Okay."},{"start":4244.23,"text":"That's the least autonomous."},{"start":4246.35,"text":"The semi-autonomous is I might hard code the tools, but I'm not going to hard code the"},{"start":4252.27,"text":"steps."},{"start":4252.97,"text":"So I'm going to tell the agents, um, your acts like a travel agents and, um, and, uh,"},{"start":4262.51,"text":"you, your task is to help the person book a travel."},{"start":4265.93,"text":"and these are the tools that you have accessible to yourself."},{"start":4269.11,"text":"And so I'm not hard-coding the steps,"},{"start":4271.13,"text":"I'm just hard-coding the tools that you have access to for yourself."},{"start":4274.73,"text":"The more autonomous is the agent decides the steps"},{"start":4278.33,"text":"and can create the tools."},{"start":4280.61,"text":"So that's where you might give actually access to a code editor to the agent."},{"start":4285.09,"text":"And the agent might actually be able to ping any API in the web,"},{"start":4289.25,"text":"perform some web search."},{"start":4290.77,"text":"It might even be able to create some code to display data to the user."},{"start":4294.81,"text":"It might even be able to perform some calculations like, oh, I'm going to calculate the fastest route to get from San Francisco to New York."},{"start":4303.75,"text":"And which one might be the most appropriate for what the user is looking for."},{"start":4308.47,"text":"And then I want to calculate the distance between the airport and that hotel versus that hotel."},{"start":4312.89,"text":"And I'm going to..."},{"start":4313.64,"text":"code to do that. So it's actually fully autonomous from that perspective. So yeah, remember those keywords, memory, prompts, tools, etc."},{"start":4330.32,"text":"Now, I presented the flight API, but it does not have to be an API. You probably have heard the term MCP or model context protocol that was coined by Anthropic. I pasted the seminal article on MCP at the bottom of this slide. But let me explain in a nutshell why those things would differ. In the API case, you would actually teach."}],"speech_gaps":[],"frame":"../frames/v057/025.webp","frame_time":4202.67},{"title":"增强LLM应用中的API通信与MCP架构","segments":[{"id":456,"text":"your LLM to ping an API. So you would say, this is how you ping this API, and this is the data that it will send you back. And you would have to do that in a one-off manner. So you would have to build or sort of give the API documentation of your flight API, your booking hotel API, your car rental API, and then you would give tools for your model to communicate with those APIs.","zh":"让你的LLM去ping一个API。因此你会说，这就是如何ping这个API，以及它会返回给你哪些数据。你必须以一次性的方式完成这个操作。因此你必须构建或提供你的航班API、酒店预订API、汽车租赁API的API文档，然后你还要为你的模型提供与这些API通信的工具。","start":4356.78,"end":4380.38},{"id":457,"text":"it doesn't scale very well versus MCP. MCP, it's really about putting a system in the middle, sort of, that would make it simpler for your LLM to communicate with that endpoint.","zh":"与MCP相比，这种方法扩展性并不好。MCP的核心思想是将一个系统放在中间，使得你的LLM与该端点通信变得更加简单。","start":4382.57,"end":4400.53},{"id":458,"text":"You might have an MCP server, an MCP client, where you're trying to communicate with that travel database or the flight API or MCP. And your agent might actually just communicate with it and say, hey, what do you need in order to give me more flight information? And that agent will respond by, I would like you to tell me where is the origin flight, where is the destination, and what you're looking for at the high level. This is my requirement. Okay, let me get back to you with my requirement.","zh":"你可能会有一个MCP服务器和一个MCP客户端，你试图与旅行数据库、航班API或MCP进行通信。你的代理实际上可能只需与它通信并说：嘿，为了给我更多的航班信息，你需要什么？然后这个代理会回应：我需要你告诉我出发地是哪里，目的地是哪里，以及你整体上在寻找什么。这是我的需求。好的，让我根据我的需求再联系你。","start":4402.04,"end":4430.48},{"id":459,"text":"Oh, you forgot to tell me your budget. Whatever. Oh, let me give you my budget, et cetera. And it's agent-to-agent communication, which allows more scalability. You don't need to hard-code everything. Companies have displayed their MCPs out there, and your agent can communicate with them and figure out how to get the data it needs. Does that make sense? Yeah. Oh, sorry.","zh":"哦，你忘记告诉我你的预算了。随便啦。哦，让我给你我的预算，诸如此类。这是一种代理与代理之间的通信，这允许更高的扩展性。你不需要硬编码所有内容。公司已经展示了它们的MCP，你的代理可以与它们通信并弄清楚如何获取所需的数据。这清楚吗？是的。哦，抱歉。","start":4431.26,"end":4455.98},{"id":460,"text":"I think it is, ultimately. The question is, is it an HTTP issue? Because anyway, if an API has to be updated, the MCP has to be updated. That's what you say, right?","zh":"我认为最终是这样的。问题是，这是否是一个HTTP问题？因为无论如何，如果一个API需要更新，MCP也需要更新。这就是你说的，对吧？","start":4472.05,"end":4481.43},{"id":461,"text":"Yes, that's correct. But at least it allows the agent to sort of go back and forth and figure out what the requirements are. But at the end of the day, ideally, if you're a startup, you have some documentation and automatically you have an agent or an LLM workflow that reads that documentation and updates the code accordingly. But I agree. It's not something that is fully autonomous. Yeah.","zh":"是的，这是正确的。但至少它允许代理来回沟通并弄清楚需求是什么。但最终，理想情况下，如果你是一家初创公司，你有一些文档，并且你自动拥有一个代理或一个LLM工作流，它读取这些文档并相应地更新代码。但我同意，这并不是一个完全自主的过程。是的。","start":4481.87,"end":4504.55},{"id":462,"text":"Which security specifically? Yeah, so are there security issues with MCPs? So think about it this way. MCPs, depending on the data that you get access to, might have different requirements, lower stake or higher stake. I'm not an expert at the full range, but it wouldn't surprise me that when you...","zh":"哪种安全问题呢？是的，那么MCPs有没有安全问题呢？让我们这样想。根据你所获得的数据，MCPs可能会有不同的要求，较低的风险或较高的风险。我不是这方面的专家，但不会让我感到惊讶的是，当你……","start":4510.51,"end":4532.58}],"notes":["本段讨论了在增强LLM应用中，如何通过API进行通信，以及MCP（中间通信平台）架构的优势。讲者指出，直接让LLM与多个API通信可能难以扩展，而MCP可以作为一个中间系统，简化LLM与API的交互。MCP允许LLM通过与代理进行对话，逐步明确所需信息，从而避免硬编码所有API细节。","讲者进一步说明，MCP的引入使得系统更具可扩展性，因为LLM可以通过与MCP的交互动态获取所需信息，而不是预先编写所有API的文档。这种设计减少了对API文档的依赖，提高了系统的灵活性。","讲者提到，MCP的使用也涉及安全问题，因为不同的API可能涉及不同级别的数据敏感性。MCP需要根据数据的敏感程度设置不同的访问权限和安全措施。","讲者指出，MCP的更新需要与API的更新同步，这可能带来一定的维护成本。然而，MCP的引入使得系统能够更灵活地适应API的变化，而无需频繁修改LLM的代码。","讲者还提到，理想情况下，初创公司可以利用文档自动生成LLM的工作流，从而自动更新代码。然而，这种自动化仍然需要人工干预，不能完全实现自主性。","最后，讲者提到关于MCP安全性的具体问题，指出MCP可能面临不同的安全挑战，具体取决于所访问的数据类型和敏感程度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4356.78,"end":4532.58,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4356.78,"text":"your LLM to ping an API. So you would say, this is how you ping this API, and this is the data that it will send you back. And you would have to do that in a one-off manner. So you would have to build or sort of give the API documentation of your flight API, your booking hotel API, your car rental API, and then you would give tools for your model to communicate with those APIs."},{"start":4382.57,"text":"it doesn't scale very well versus MCP. MCP, it's really about putting a system in the middle, sort of, that would make it simpler for your LLM to communicate with that endpoint. So for instance,"},{"start":4402.04,"text":"You might have an MCP server, an MCP client, where you're trying to communicate with that travel database or the flight API or MCP. And your agent might actually just communicate with it and say, hey, what do you need in order to give me more flight information? And that agent will respond by, I would like you to tell me where is the origin flight, where is the destination, and what you're looking for at the high level. This is my requirement. Okay, let me get back to you with my requirement."},{"start":4431.26,"text":"Oh, you forgot to tell me your budget. Whatever. Oh, let me give you my budget, et cetera. And it's agent-to-agent communication, which allows more scalability. You don't need to hard-code everything. Companies have displayed their MCPs out there, and your agent can communicate with them and figure out how to get the data it needs. Does that make sense? Yeah. Oh, sorry."},{"start":4472.05,"text":"I think it is, ultimately. The question is, is it an HTTP issue? Because anyway, if an API has to be updated, the MCP has to be updated. That's what you say, right?"},{"start":4481.87,"text":"Yes, that's correct. But at least it allows the agent to sort of go back and forth and figure out what the requirements are. But at the end of the day, ideally, if you're a startup, you have some documentation and automatically you have an agent or an LLM workflow that reads that documentation and updates the code accordingly. But I agree. It's not something that is fully autonomous. Yeah."},{"start":4510.51,"text":"Which security specifically? Yeah, so are there security issues with MCPs? So think about it this way. MCPs, depending on the data that you get access to, might have different requirements, lower stake or higher stake. I'm not an expert at the full range, but it wouldn't surprise me that when you..."}],"speech_gaps":[{"start":4458.784,"end":4461.536},{"start":4461.536,"end":4463.664},{"start":4463.664,"end":4465.232},{"start":4468.24,"end":4471.65}],"frame":"../frames/v057/026.webp","frame_time":4368.78},{"title":"MCP 与安全性的讨论","segments":[{"id":463,"text":"When you expose an MCP to an... I think a lot of MCPs have authentication. So you might actually need a code to actually talk to it, just like you would with an API or a key. Yeah, but that's a good question. I'm not an expert at the security of these systems, but we can look into it.","zh":"当你将一个MCP暴露给一个... 我认为很多MCP都有认证。因此你可能实际上需要一个代码才能与之通信，就像使用API或密钥一样。是的，但这是一个好问题。我不是这些系统的安全专家，但我们可以通过研究来探讨。","start":4535.36,"end":4554.9},{"id":464,"text":"Any other questions on what we've seen with the agentic workflows, APIs, tools, MCPs, memory? All of that is under progress, so even memory is not a solved problem by any means. It's pretty hard, actually. Yes? Exactly. Is MCP about efficiency or accessing more data? It's about efficiency.","zh":"关于我们看到的代理工作流、API、工具、MCP和记忆，还有其他问题吗？所有这些都在进行中，因此记忆在任何意义上都不是一个已解决的问题。实际上，这相当困难。是的？没错。MCP是关于效率还是访问更多数据？它关于效率。","start":4558.43,"end":4602.09},{"id":465,"text":"Let's say you have a coding agent and it has an MCP client and there's multiple MCP servers that are exposed out there. That agent can communicate very efficiently with them and find what it needs. And it's a more efficient process than actually displaying APIs and the APIs on that side and how to ping them and what the protocol is. But it's not about the data that is being exposed because ultimately you control the data that is being exposed.","zh":"假设你有一个编码代理，它有一个MCP客户端，并且有多个暴露在外的MCP服务器。该代理可以非常高效地与它们通信，并找到它需要的内容。这比实际显示API、API的调用方式以及如何ping它们和协议要更高效。但这并不是关于被暴露的数据，因为最终你控制着被暴露的数据。","start":4604.03,"end":4632.55},{"id":466,"text":"You probably, depending on how the MCP is built, my guess is you probably expose yourself to other risks because your MCP server can see any inputs pretty much from another LLM. And so it has to be robust.","zh":"你可能根据MCP的构建方式而面临其他风险，我的猜测是你可能暴露于其他风险，因为你的MCP服务器几乎可以查看来自另一个LLM的任何输入。因此它必须足够稳健。","start":4635.02,"end":4649.73},{"id":467,"text":"Super. So let's look at an example of a step-by-step workflow for the travel agent. So let's say the user says, I want to plan a trip to Paris from December 15th to 20th with flights, hotels near the Eiffel Tower, and then an itinerary of must-visit places. That's the task to the travel agent. Step two, the agent plans the steps.","zh":"很好。让我们来看一个旅行代理的逐步工作流程的例子。假设用户说，我想从12月15日到20日计划去巴黎的旅行，包括航班、靠近埃菲尔铁塔的酒店，以及必须参观的景点行程。这是给旅行代理的任务。第二步，代理规划步骤。","start":4653.43,"end":4682.09},{"id":468,"text":"So it says, I'm going to find flights. Use the flight search API to get option for December 15th. Search hotels, generate recommendation for places to visit, validate preferences, budget, etc. Book the trip with the payment processing API. Step three, that's just the planning, by the way. Step three, execute the plan. Use your tools, combine the results.","zh":"它说，我要找航班。使用航班搜索API获取12月15日的选项。搜索酒店，生成参观地点的推荐，验证偏好、预算等。使用支付处理API预订旅行。第三步，这只是规划，顺便说一句。第三步，执行计划。使用你的工具，结合结果。","start":4682.64,"end":4705.66}],"notes":["本段讨论了MCP（可能指机器通信协议）在安全性和效率方面的应用。讲者提到，许多MCP具有认证机制，因此需要代码来与之通信，类似于API或密钥。讲者表示自己不是该领域的专家，但可以进一步探讨相关问题。","讲者指出，目前关于代理工作流、API、工具、MCP和记忆的实现仍处于进行中，记忆问题尚未解决。MCP的重点在于效率，而非访问更多数据。","讲者通过一个示例说明了MCP在实际应用中的效率优势。例如，一个编码代理可以通过MCP客户端与多个MCP服务器高效通信，而无需手动处理API的协议和调用。","讲者提到，MCP服务器可能会暴露于其他风险，因为它们可以接收来自其他LLM的输入，因此需要具备鲁棒性。","讲者以旅行代理为例，展示了MCP在实际任务中的应用流程。用户请求规划巴黎之旅，代理需要搜索航班、酒店、推荐景点，并最终完成预订。","在执行计划时，代理需要使用工具并整合结果。这表明MCP在实际任务中不仅涉及通信，还包括任务分解和结果整合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4535.36,"end":4705.66,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4535.36,"text":"When you expose an MCP to an... I think a lot of MCPs have authentication. So you might actually need a code to actually talk to it, just like you would with an API or a key. Yeah, but that's a good question. I'm not an expert at the security of these systems, but we can look into it."},{"start":4558.43,"text":"Any other questions on what we've seen with the agentic workflows, APIs, tools, MCPs, memory? All of that is under progress, so even memory is not a solved problem by any means. It's pretty hard, actually. Yes? Exactly. Is MCP about efficiency or accessing more data? It's about efficiency."},{"start":4604.03,"text":"Let's say you have a coding agent and it has an MCP client and there's multiple MCP servers that are exposed out there. That agent can communicate very efficiently with them and find what it needs. And it's a more efficient process than actually displaying APIs and the APIs on that side and how to ping them and what the protocol is. But it's not about the data that is being exposed because ultimately you control the data that is being exposed."},{"start":4635.02,"text":"You probably, depending on how the MCP is built, my guess is you probably expose yourself to other risks because your MCP server can see any inputs pretty much from another LLM. And so it has to be robust."},{"start":4653.43,"text":"Super. So let's look at an example of a step-by-step workflow for the travel agent. So let's say the user says, I want to plan a trip to Paris from December 15th to 20th with flights, hotels near the Eiffel Tower, and then an itinerary of must-visit places. That's the task to the travel agent. Step two, the agent plans the steps."},{"start":4682.64,"text":"So it says, I'm going to find flights. Use the flight search API to get option for December 15th. Search hotels, generate recommendation for places to visit, validate preferences, budget, etc. Book the trip with the payment processing API. Step three, that's just the planning, by the way. Step three, execute the plan. Use your tools, combine the results."}],"speech_gaps":[],"frame":"../frames/v057/027.webp","frame_time":4547.36},{"title":"评估和改进LLM应用的系统","segments":[{"id":469,"text":"And then proactive user interaction and booking. It might make a first proposal to the user and ask the user to validate or invalidate, and then may repeat that planning and execution process. And then finally, it might actually update the memory. It might say, oh, I just learned through this interaction that the user only likes direct flights. Next time, I'll only give direct flights.","zh":"然后是主动的用户互动和预订。它可能会向用户提出第一个建议，并询问用户是否验证或否定，然后可能会重复这个规划和执行过程。最后，它可能会实际更新记忆。它可能会说，哦，我通过这次互动了解到用户只喜欢直飞航班。下次，我只会提供直飞航班。","start":4706.36,"end":4730.1},{"id":470,"text":"Or I noticed users are fine with three-star hotels or four-star hotels. And in fact, they don't want to go above budget or something like that. So that hopefully makes sense by now on how you might do that. My question for you is, how would you know if this works? And if you had such a system running in production, how would you improve it?","zh":"或者我注意到用户对三星级酒店或四星级酒店是可以接受的。事实上，他们不想超出预算或类似的事情。所以希望到目前为止，你已经明白如何做到这一点。我的问题是，你怎么知道这是否有效？如果你有一个这样的系统在生产环境中运行，你会如何改进它？","start":4731.72,"end":4756.64},{"id":471,"text":"Yeah. So that's an example. So let users rate their experience at the end. That would be an end-to-end test, right? You're looking at the user experience through the steps and say, how good was it from one to five, let's say. Yeah, it's a good way. And then if you learn that a user says one, how would you improve the workflow?","zh":"是的。这是一个例子。让用户体验在最后进行评分。这将是一个端到端的测试，对吧？你通过步骤观察用户体验，并说，从1到5分，你觉得有多好。是的，这是一个好方法。然后如果你了解到用户给了1分，你会如何改进工作流程？","start":4764.37,"end":4789.71},{"id":472,"text":"Okay, so you would go down three and say, okay, you said one, what was your issue? And then the user says the prices were too high, let's say. And then you would go back and fix that specific tool or prompt. Yeah, okay. Any other ideas? Yeah, good. So that's a good insight. Separate the LLM-related stuff from the non-LLM-related stuff, the deterministic stuff. The deterministic stuff, you might be able to fix it.","zh":"好的，你会降低三分，并说，哦，你说1分，你的问题是什么？然后用户说价格太高，比如说。然后你会回去并修复那个特定的工具或提示。是的，好的。还有其他想法吗？是的，很好。这是一个很好的见解。将与LLM相关的内容与非LLM相关的内容、确定性内容分开。确定性内容，你可能能够修复。","start":4795.82,"end":4834.04},{"id":473,"text":"You know, more objectively, essentially. Yeah, it was. What else? So give me an example of an objective issue that you can notice and how you would fix it versus a subjective issue. Yeah. OK, so let's say you say.","zh":"你知道，更客观地说，是的，就是这样。还有什么？给我一个你可以注意到的客观问题的例子，以及你如何修复它，与主观问题相比。是的。好的，比如说你说。","start":4835.06,"end":4873.3},{"id":474,"text":"There's the same flight, but one is cheaper than the other, let's say. It's objectively worse. And so you can capture that almost automatically. Yeah. So you could actually build evals that are objective, that are tracked.","zh":"同一航班，但一个是更便宜的，比如说。这在客观上更差。因此，你可以几乎自动地捕捉到这一点。是的。因此，你实际上可以构建一些客观的评估，这些评估是可以追踪的。","start":4873.98,"end":4886.3}],"notes":["本段讨论了如何评估和改进LLM在实际应用中的表现。讲者提出了一个系统，该系统通过用户交互和反馈来优化服务，例如根据用户的偏好调整推荐策略。讲者还提出了如何判断系统是否有效的问题，并建议通过用户评分来评估整体体验。","讲者进一步说明了如何通过用户评分来评估系统效果，并指出如果用户评分较低，应深入询问用户的具体问题，例如价格过高，并据此改进系统中的特定工具或提示。","讲者强调了区分LLM相关问题和非LLM相关问题的重要性，指出非LLM相关问题（如价格、航班选择等）可以通过客观方式解决，而LLM相关问题可能需要更复杂的调整。","讲者举了一个例子，说明如何识别和解决客观问题，例如同一航班但价格不同的情况，这种问题可以通过自动化评估来检测，并据此改进系统。","讲者指出，通过构建客观的评估体系，可以更有效地跟踪和改进系统性能，而主观问题则需要更细致的用户反馈来识别和解决。","本段的核心在于如何通过用户反馈和系统评估来持续优化LLM应用，强调了区分客观和主观问题的重要性，以及如何通过具体例子来改进系统表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4706.36,"end":4886.3,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4706.36,"text":"And then proactive user interaction and booking. It might make a first proposal to the user and ask the user to validate or invalidate, and then may repeat that planning and execution process. And then finally, it might actually update the memory. It might say, oh, I just learned through this interaction that the user only likes direct flights. Next time, I'll only give direct flights."},{"start":4731.72,"text":"Or I noticed users are fine with three-star hotels or four-star hotels. And in fact, they don't want to go above budget or something like that. So that hopefully makes sense by now on how you might do that. My question for you is, how would you know if this works? And if you had such a system running in production, how would you improve it?"},{"start":4764.37,"text":"Yeah. So that's an example. So let users rate their experience at the end. That would be an end-to-end test, right? You're looking at the user experience through the steps and say, how good was it from one to five, let's say. Yeah, it's a good way. And then if you learn that a user says one, how would you improve the workflow?"},{"start":4795.82,"text":"Okay, so you would go down three and say, okay, you said one, what was your issue? And then the user says the prices were too high, let's say. And then you would go back and fix that specific tool or prompt. Yeah, okay. Any other ideas? Yeah, good. So that's a good insight. Separate the LLM-related stuff from the non-LLM-related stuff, the deterministic stuff. The deterministic stuff, you might be able to fix it."},{"start":4835.06,"text":"You know, more objectively, essentially. Yeah, it was. What else? So give me an example of an objective issue that you can notice and how you would fix it versus a subjective issue. Yeah. OK, so let's say you say."},{"start":4873.98,"text":"There's the same flight, but one is cheaper than the other, let's say. It's objectively worse. And so you can capture that almost automatically. Yeah. So you could actually build evals that are objective, that are tracked."}],"speech_gaps":[],"frame":"../frames/v057/028.webp","frame_time":4718.36},{"title":"LLM在实际应用中的评估与改进","segments":[{"id":475,"text":"Across your users. And you might actually run an analysis after and see that for the objective stuff, we notice that our LLM agentic AI workflow is bad with pricing. It just doesn't read price as well because it always gives a more expensive option. Yeah, you're perfectly right. How about the subjective stuff? Yeah. Do you choose a direct or indirect? The indirect or the voltage?","zh":"在您的用户中。您可能会在之后进行分析，并发现对于客观性内容，我们注意到我们的LLM代理AI工作流程在定价方面表现不佳。它只是不擅长读取价格，因为它总是给出更昂贵的选项。是的，您说得完全正确。那么对于主观性内容呢？是的。您会选择直接还是间接？是间接还是电压？","start":4887.07,"end":4919.94},{"id":476,"text":"Yeah, good one. Do you choose a direct flight or an indirect flight if the indirect is cheaper but the direct is more comfortable? Yeah, that's a good one, actually. So how would you capture that information? Let's say this is used by thousands of users. Could you feed something in? Yeah, I mean, you could. Could you feed something in about the user preferences? Well, you could build a data set.","zh":"是的，很好的问题。如果间接航班更便宜但直接航班更舒适，您会选择直接航班还是间接航班？是的，实际上这是一个很好的问题。那么您如何捕捉这些信息？假设这个被成千上万的用户使用，您能否输入一些内容？是的，我的意思是，您可以。您能否输入一些关于用户偏好的信息？您可以构建一个数据集。","start":4921.17,"end":4954.13},{"id":477,"text":"That has some of that information. So you build 10 prompts where the user is saying that I prefer direct flights because I care about my time. And then you look at the output and you actually give the example of a good output. And you probably are able to capture the performance of your agentic workflow on this specific eval.","zh":"这个数据集包含一些相关信息。因此，您可以构建10个提示，让用户表示他们更喜欢直飞航班，因为他们在意时间。然后您查看输出，并实际给出一个良好的输出示例。您可能能够捕捉到您的代理工作流程在这一特定评估中的表现。","start":4954.89,"end":4978.92},{"id":478,"text":"Does it prioritize? Does it understand price conscious? Is it price conscious, essentially, and comfort conscious? What about the tone? Let's say the LLM right now is not very friendly. How would you notice that, and how would you fix it? Yeah. Okay, have a test user run the prompt and see if there's something wrong with that. Tell me about the last step. How would you notice that something is wrong?","zh":"它是否会优先考虑？它是否理解价格敏感？本质上，它是价格敏感且舒适敏感吗？语气方面呢？假设当前的LLM并不太友好。您如何注意到这一点，又如何修复它？是的。好的，让测试用户运行提示并查看是否有问题。告诉我最后一步。您如何注意到有问题？","start":4980.05,"end":5016.0},{"id":479,"text":"So I've got a couple of chats from the AI. I'll use the response.","zh":"我有几个来自AI的聊天记录，我会使用这个回复。","start":5016.66,"end":5025.22},{"id":480,"text":"Yeah, I agree with your approach. Have LLM judges that evaluate the response against a certain rubric of what politeness looks like. So here in this case, you could actually start with error analysis. So you start, you have a thousand users and you can pull up 20 user interaction and read through it. And you might notice at first sight, the LLM seems to be very rude. It's just super...","zh":"是的，我同意您的方法。让LLM评委根据礼貌的某些标准来评估回复。在这种情况下，您可以实际上从错误分析开始。您开始时有1000个用户，可以调取20个用户交互并阅读。您可能会在第一眼就注意到，LLM似乎非常粗鲁。它只是超级……","start":5027.66,"end":5051.74}],"notes":["本段讨论了LLM在实际应用中如何评估和改进其性能，特别是针对价格敏感性和主观偏好。讲者提到，LLM在处理价格信息时可能偏向于提供更昂贵的选项，这表明其在价格意识方面存在不足。同时，讲者也提到，用户可能更倾向于直接航班，因为时间因素更重要，这说明主观偏好在决策中的重要性。","讲者进一步探讨了如何通过构建数据集来捕捉用户偏好，例如通过设计10个提示，让用户表达对直接航班的偏好。然后通过分析输出结果，评估LLM在特定任务上的表现。这种方法有助于识别LLM在实际应用中的性能问题。","在讨论LLM的语气问题时，讲者指出，如果LLM当前的语气不够友好，可以通过测试用户运行提示来发现问题。这表明在实际应用中，需要通过用户反馈和测试来评估和改进LLM的表现。","最后，讲者提到，通过分析用户交互数据，可以发现LLM在某些情况下表现得非常粗鲁，这表明在实际应用中，需要持续监控和改进LLM的表现，以确保其符合预期的行为标准。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4887.07,"end":5051.74,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4887.07,"text":"across your users. And you might actually run an analysis after and see that for the objective stuff, we notice that our LLM agentic AI workflow is bad with pricing. It just doesn't read price as well because it always gives a more expensive option. Yeah, you're perfectly right. How about the subjective stuff? Yeah. Do you choose a direct or indirect? The indirect or the voltage?"},{"start":4921.17,"text":"Yeah, good one. Do you choose a direct flight or an indirect flight if the indirect is cheaper but the direct is more comfortable? Yeah, that's a good one, actually. So how would you capture that information? Let's say this is used by thousands of users. Could you feed something in? Yeah, I mean, you could. Could you feed something in about the user preferences? Well, you could build a data set."},{"start":4954.89,"text":"that has some of that information. So you build 10 prompts where the user is saying that I prefer direct flights because I care about my time. And then you look at the output and you actually give the example of a good output. And you probably are able to capture the performance of your agentic workflow on this specific eval."},{"start":4980.05,"text":"Does it prioritize? Does it understand price conscious? Is it price conscious, essentially, and comfort conscious? What about the tone? Let's say the LLM right now is not very friendly. How would you notice that, and how would you fix it? Yeah. Okay, have a test user run the prompt and see if there's something wrong with that. Tell me about the last step. How would you notice that something is wrong?"},{"start":5016.66,"text":"So I've got a couple of chats from the AI. I'll use the response."},{"start":5027.66,"text":"Yeah, I agree with your approach. Have LLM judges that evaluate the response against a certain rubric of what politeness looks like. So here in this case, you could actually start with error analysis. So you start, you have a thousand users and you can pull up 20 user interaction and read through it. And you might notice at first sight, the LLM seems to be very rude. It's just super..."}],"speech_gaps":[{"start":5025.62,"end":5027.26}],"frame":"../frames/v057/029.webp","frame_time":4899.07},{"title":"评估LLM应用的案例研究","segments":[{"id":481,"text":"super short in its answers and it's not very helpful, you notice that with your error analysis manually. Then you go to the next stage. You actually put evals behind it. You say, I'm going to create a set of LLM judges that are going to look at the user interaction and are going to rate how polite it is. And I'm going to give it a rubric. Then what I'm going to do is I'm going to flip my LLM. Instead of using GPT-4, I'm going to use Grok.","zh":"它的回答非常简短，而且并不很有帮助，你通过手动进行错误分析就能注意到这一点。然后你进入下一步。你实际上会在后面进行评估。你会说，我要创建一组LLM评判者，他们会查看用户互动，并对礼貌程度进行评分。我会给它一个评分标准。然后我将翻转我的LLM。不再使用GPT-4，而是使用Grok。","start":5052.58,"end":5081.34},{"id":482,"text":"And instead of using rock, I'm using llama. And then I'm going to run those three LLMs side by side, give it to my LLM judges.","zh":"不再使用岩石，而是使用llama。然后我会将这三个LLM并排运行，交给我的LLM评判者。","start":5081.92,"end":5088.84},{"id":483,"text":"And then get my subjective score at the end to say, oh, X model was more polite on average. Yeah, perfectly right. That's an example of an eval that is very specific and allows you to choose between LLMs. You could actually do the same eval, not across LLMs, but fix the LLM, change the prompt. You actually, instead of saying act like a travel agent, you say act like a helpful travel agent. And then you see the influence of that word on your eval.","zh":"然后在最后得到一个主观评分，以说明哦，X模型在平均上更加礼貌。是的，完全正确。这是一个非常具体的评估示例，允许你在不同的LLM之间进行选择。你实际上可以做同样的评估，不是跨LLM，而是固定LLM，改变提示。你不再说扮演旅行代理，而是说扮演有帮助的旅行代理。然后你会看到这个词对你评估的影响。","start":5089.66,"end":5117.04},{"id":484,"text":"with the LLM as judges.","zh":"使用LLM作为评判者。","start":5117.32,"end":5118.36},{"id":485,"text":"Does that make sense?","zh":"这清楚吗？","start":5118.54,"end":5119.08},{"id":486,"text":"All right.","zh":"好的。","start":5119.92,"end":5120.5},{"id":487,"text":"Super.","zh":"很好。","start":5121.88,"end":5122.36},{"id":488,"text":"So let's move forward and do a case study with evals,","zh":"那么，让我们继续进行一个带有评估的案例研究。","start":5122.54,"end":5125.64},{"id":489,"text":"and then we're almost done for today.","zh":"然后我们今天就快结束了。","start":5125.7,"end":5128.74},{"id":490,"text":"Let's say your product manager asks you to build","zh":"假设你的产品经理让你开发","start":5129.36,"end":5133.16},{"id":491,"text":"an AI agent for customer support.","zh":"一个用于客户支持的AI代理。","start":5133.16,"end":5135.88},{"id":492,"text":"Okay?","zh":"好的？","start":5136.94,"end":5137.42},{"id":493,"text":"Where do you start?","zh":"你从哪里开始？","start":5137.78,"end":5138.76},{"id":494,"text":"And here is an example of the user prompt.","zh":"这里有一个用户提示的例子。","start":5138.92,"end":5140.92},{"id":495,"text":"I need to change my shipping address for order, blah, blah, blah.","zh":"我需要更改订单的送货地址， blah, blah, blah.","start":5141.06,"end":5144.36},{"id":496,"text":"I move to a new address.","zh":"我搬到了一个新地址。","start":5144.46,"end":5146.22},{"id":497,"text":"So, what would you start if I'm giving you that project?","zh":"那么，如果你给了我这个项目，你会从哪里开始？","start":5147.98,"end":5150.92},{"id":498,"text":"Yes?","zh":"是的？","start":5159.42,"end":5159.9},{"id":499,"text":"I've done research online for a system of models, and I see some research that may be popular for this model.","zh":"我在网上做了一些关于模型系统的调研，看到一些可能适用于这个模型的研究。","start":5161.34,"end":5167.94},{"id":500,"text":"So, there's a lot of people on that.","zh":"在这方面有很多人参与。","start":5168.14,"end":5170.28},{"id":501,"text":"Do some research, see benchmarks","zh":"做一些研究，看看基准测试","start":5172.22,"end":5174.4},{"id":502,"text":"and how different models","zh":"以及不同模型","start":5174.4,"end":5176.5},{"id":503,"text":"perform at customer support and then","zh":"在客户支持方面的表现，然后","start":5176.5,"end":5178.54},{"id":504,"text":"pick a model. That's what you mean.","zh":"选择一个模型。这就是你的意思。","start":5178.54,"end":5180.0},{"id":505,"text":"Yeah, it's true you could do that.","zh":"是的，你确实可以这么做。","start":5180.28,"end":5182.0},{"id":506,"text":"What else could you do?","zh":"除此之外你还能做些什么？","start":5182.08,"end":5183.68},{"id":507,"text":"Yeah.","zh":"是的。","start":5184.16,"end":5184.32},{"id":508,"text":"Okay, yeah, I like that.","zh":"好的，是的，我喜欢这个想法。","start":5188.06,"end":5191.66},{"id":509,"text":"Try to decompose","zh":"尝试分解","start":5191.76,"end":5194.2},{"id":510,"text":"the different tasks that it will need","zh":"它所需要完成的不同任务","start":5194.2,"end":5195.64},{"id":511,"text":"and try to guess which ones will be more","zh":"并尝试猜测哪些任务会更具挑战性，","start":5195.64,"end":5198.04},{"id":512,"text":"of a struggle, which ones should be fuzzy,","zh":"哪些任务应该更模糊，","start":5198.04,"end":5199.76},{"id":513,"text":"which one should be deterministic yeah you're right yeah similar to what you said that's what","zh":"哪一个应该是确定性的，是的，你说得对，和你说的类似，这就是","start":5199.76,"end":5215.18},{"id":514,"text":"i would recommend as well you say i would sit down with a customer support agent for a day or two","zh":"我也建议这样做，你说我应该和客服代理一起工作一两天","start":5215.18,"end":5219.58},{"id":515,"text":"and i would decompose the tasks they're going through i will ask them where do they struggle","zh":"我会分解他们所经历的任务，我会问他们他们在哪些地方遇到困难","start":5219.58,"end":5223.4},{"id":516,"text":"how much time it takes yes that's usually where you want to start with task decomposition","zh":"需要花费多少时间，是的，这通常是任务分解时想要首先开始的地方","start":5223.4,"end":5227.92}],"notes":["本段讲授了如何通过构建LLM评估系统来比较不同模型的表现。首先，讲者提到在进行错误分析后，会创建一组LLM法官来评估用户交互的礼貌程度，并使用评分标准。接着，讲者提到会使用不同的LLM模型（如Grok和Llama）进行并行评估，以获得主观评分，从而选择更礼貌的模型。此外，讲者还提到可以通过修改提示词（如从“扮演旅行代理”改为“扮演有帮助的旅行代理”）来观察不同提示对评估结果的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5052.58,"end":5227.92,"asr_flags":[513],"translation_complete":true,"translated_segments":36,"raw_segments":[{"start":5052.58,"text":"super short in its answers and it's not very helpful, you notice that with your error analysis manually. Then you go to the next stage. You actually put evals behind it. You say, I'm going to create a set of LLM judges that are going to look at the user interaction and are going to rate how polite it is. And I'm going to give it a rubric. Then what I'm going to do is I'm going to flip my LLM. Instead of using GPT-4, I'm going to use Grok."},{"start":5081.92,"text":"And instead of using rock, I'm using llama. And then I'm going to run those three LLMs side by side, give it to my LLM judges."},{"start":5089.66,"text":"And then get my subjective score at the end to say, oh, X model was more polite on average. Yeah, perfectly right. That's an example of an eval that is very specific and allows you to choose between LLMs. You could actually do the same eval, not across LLMs, but fix the LLM, change the prompt. You actually, instead of saying act like a travel agent, you say act like a helpful travel agent. And then you see the influence of that word on your eval."},{"start":5117.32,"text":"with the LLM as judges."},{"start":5118.54,"text":"Does that make sense?"},{"start":5119.92,"text":"All right."},{"start":5121.88,"text":"Super."},{"start":5122.54,"text":"So let's move forward and do a case study with evals,"},{"start":5125.7,"text":"and then we're almost done for today."},{"start":5129.36,"text":"Let's say your product manager asks you to build"},{"start":5133.16,"text":"an AI agent for customer support."},{"start":5136.94,"text":"Okay?"},{"start":5137.78,"text":"Where do you start?"},{"start":5138.92,"text":"And here is an example of the user prompt."},{"start":5141.06,"text":"I need to change my shipping address for order, blah, blah, blah."},{"start":5144.46,"text":"I move to a new address."},{"start":5147.98,"text":"So, what would you start if I'm giving you that project?"},{"start":5159.42,"text":"Yes?"},{"start":5161.34,"text":"I've done research online for a system of models, and I see some research that may be popular for this model."},{"start":5168.14,"text":"So, there's a lot of people on that."},{"start":5172.22,"text":"Do some research, see benchmarks"},{"start":5174.4,"text":"and how different models"},{"start":5176.5,"text":"perform at customer support and then"},{"start":5178.54,"text":"pick a model. That's what you mean."},{"start":5180.28,"text":"Yeah, it's true you could do that."},{"start":5182.08,"text":"What else could you do?"},{"start":5184.16,"text":"Yeah."},{"start":5188.06,"text":"Okay, yeah, I like that."},{"start":5191.76,"text":"Try to decompose"},{"start":5194.2,"text":"the different tasks that it will need"},{"start":5195.64,"text":"and try to guess which ones will be more"},{"start":5198.04,"text":"of a struggle, which ones should be fuzzy,"},{"start":5199.76,"text":"which one should be deterministic yeah you're right yeah similar to what you said that's what"},{"start":5215.18,"text":"i would recommend as well you say i would sit down with a customer support agent for a day or two"},{"start":5219.58,"text":"and i would decompose the tasks they're going through i will ask them where do they struggle"},{"start":5223.4,"text":"how much time it takes yes that's usually where you want to start with task decomposition"}],"speech_gaps":[{"start":5184.944,"end":5186.64}],"frame":"../frames/v057/030.webp","frame_time":5064.58},{"title":"任务分解与LLM应用设计","segments":[{"id":517,"text":"decomposition so let's say we've done that work and we have this list i'm simplifying but the","zh":"分解工作，假设我们已经完成了这项工作，并得到了这个列表（我在这里进行了简化），","start":5227.92,"end":5233.92},{"id":518,"text":"customer support agent human typically would extract info then look up in the database to","zh":"客户支持代理（人类）通常会提取信息，然后在数据库中查找以","start":5233.92,"end":5240.06},{"id":519,"text":"retrieve the customer record then check the policy you know are we allowed to update the address or","zh":"检索客户记录，然后检查策略，你
