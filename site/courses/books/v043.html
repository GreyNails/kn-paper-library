</div><script type="application/json" id="data" data-encoding="gzip" data-source-url="https://raw.githubusercontent.com/GreyNails/kn-paper-library/main/course-data/v043-1cdcd3ead8da587fbf098b0cad0c298943b960edc3ac6e69fa0666fc716cb817.json.gz"></script><script src="../assets/katex.min.js"></script><script type="module">async function readCourseData(){try{return await decodeCourseData()}catch(error){const sheet=document.getElementById('sheet');if(sheet){sheet.innerHTML='<div class="empty-state"><h2>课程暂时未能载入</h2><p>请检查网络后重试。已保存的阅读位置不会丢失。</p><button id="retry-course">重新载入</button><p><a href="../index.html">返回课程目录</a></p></div>';document.getElementById('retry-course').onclick=()=>location.reload()}throw error}}async function decodeCourseData(){const e=document.getElementById('data');let text,assetBase='';if(e.dataset.sourceUrl){assetBase=e.dataset.sourceUrl.replace(/course-data\/[^/]+$/,'');const response=await fetch(e.dataset.sourceUrl);if(!response.ok)throw new Error('课程内容暂时无法载入');const stream=response.body.pipeThrough(new DecompressionStream('gzip'));text=await new Response(stream).text()}else if(e.dataset.encoding){const bytes=Uint8Array.from(atob(e.textContent.trim()),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));text=await new Response(stream).text()}else text=e.textContent;const result=JSON.parse(text);const resource=s=>typeof s==='string'&&s.startsWith('@raw/')?assetBase+s.slice(5):s;for(const page of result.pages){page.frame=resource(page.frame);for(const point of page.boards||[]){point.frame=resource(point.frame);point.redraw_svg_url=resource(point.redraw_svg_url);if(point.visual_source)point.visual_source.slide_image=resource(point.visual_source.slide_image)}}return result}

function boardGraph(point){if(point.redraw_svg_url)return '<svg viewBox="0 0 900 90"><text x="20" y="48" font-size="24" fill="#24434c">正在载入原PPT图形…</text></svg>';if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes||[]){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${Math.max(90,y)}" role="img" aria-label="${esc(point.title+'：'+(point.relation||'讲解梳理'))}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
const boardTabMemory=new Map();
function knowledgeBoard(point){
 const source=point.visual_source||{},id=String(point.id),selected=boardTabMemory.get(id)||'redraw';
 const reviewed=source.manual_review||source.method==='manual_video_pdf_visual_comparison'||source.method==='manual_video_frame_math_comparison';
 const stampSafe=t=>typeof t==='number'?stamp(t):'时间待定位';
 const sourceLabel=source.source_kind==='blackboard'?'原视频板书':'原PPT';
 const tabs=[['redraw','重绘与解读'],['source','原图对照'],['formula','公式'],['evidence','讲者依据']];
 const panel=(name,body)=>`<div class="board-panel" id="${esc(id)}-panel-${name}" role="tabpanel" aria-labelledby="${esc(id)}-tab-${name}" tabindex="0"${selected===name?'':' hidden'}>${body}</div>`;
 const inspectButton=(image,title)=>`<button type="button" class="board-inspect" data-inspect-image="${esc(image)}" data-inspect-title="${esc(title)}">查看大图</button>`;
 const sourceImage=(image,label)=>`<figure><button type="button" class="board-image-button board-inspect" data-inspect-image="${esc(image)}" data-inspect-title="${esc(label)}" aria-label="放大查看：${esc(label)}"><img loading="lazy" src="${esc(image)}" alt="${esc(label)}"></button><figcaption><span>${esc(label)}</span>${inspectButton(image,label)}</figcaption></figure>`;
 const images=[];
 if(source.verified&&source.slide_image)images.push(sourceImage(source.slide_image,sourceLabel+(source.pdf_page?' · PDF 第 '+source.pdf_page+' 页':source.slide_number?' · '+source.slide_number:'')));
 if(point.frame&&point.frame!==source.slide_image)images.push(sourceImage(point.frame,'原视频截图 · '+stampSafe(point.frame_time)));
 const evidence=(point.source_ids||[]).map(sourceId=>data.pages.flatMap(p=>p.segments||[]).find(s=>s.id===sourceId)).filter(Boolean);
 const formulaBody=(point.formulas||[]).length?`<p class="board-formula-count">${point.formulas.length} 条公式 · 符号说明与推导依据</p>`+point.formulas.map(f=>`<p class="muted">${esc(f.origin||'讲者讲述与既有整理')}</p>`+formula(f)).join(''):`<div class="board-empty">${point.formula_review_pending?'原始公式已保留在重绘图中；独立排版的公式仍在逐式核对。':'本知识点没有单独整理的公式，可结合重绘图和讲者依据学习。'}<p><button type="button" data-board-switch="redraw">查看重绘与解读</button></p></div>`;
 const redraw=`<p class="board-summary">${translatedProse(point.summary||'')}</p><div class="board-visual-toolbar"><h3>重绘图解${point.relation?' · '+esc(point.relation):''}</h3><button type="button" class="board-inspect" data-inspect-vector="true" data-inspect-title="${esc(point.title+' · 重绘图解')}">放大画板</button></div><div class="board-graph" data-vector-url="${esc(point.redraw_svg_url||'')}">${boardGraph(point)}</div>${(point.steps||[]).length?'<h3>理解路径</h3><ol class="board-steps">'+point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')+'</ol>':''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p class="board-pitfall"><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}`;
 const original=`${images.length?'<div class="board-source">'+images.join('')+'</div>':'<div class="board-empty">本知识点的原始画面仍待核对。</div>'}<div class="board-source-notes">${source.verified?'<p>已对照本讲视频 '+stampSafe(source.video_time)+' 的画面。'+(source.source_url?` <a href="${esc(source.source_url)}" target="_blank" rel="noopener">${source.pdf_page?'打开原始讲义 PDF':'打开原始课程视频'} ↗</a>`:'')+'</p>':''}${(source.items||[]).length?'<p><b>从原页提取</b></p><ul>'+source.items.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul>':''}</div>`;
 return `<section class="knowledge-board" id="${esc(id)}" data-board-id="${esc(id)}"><header class="board-head"><div><div class="board-eyebrow">${source.verified?sourceLabel+'提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stampSafe(point.start)}–${stampSafe(point.end)}</div><h2>${esc(point.title)}</h2><span class="board-review${reviewed?' reviewed':''}">${reviewed?'已逐项核对的示例':source.verified?'图像来源已定位 · 解读为自动初稿':'解读为自动初稿 · 图像来源待核对'}</span></div><button type="button" class="board-seek" data-time="${Number(point.start)||0}" aria-label="回看本知识点 ${stampSafe(point.start)}">回看 ${stampSafe(point.start)}</button></header><div class="board-tabs" role="tablist" aria-label="知识点资料">${tabs.map(([name,label])=>`<button type="button" role="tab" id="${esc(id)}-tab-${name}" data-board-tab="${name}" aria-controls="${esc(id)}-panel-${name}" aria-selected="${selected===name}" tabindex="${selected===name?'0':'-1'}">${label}</button>`).join('')}</div>${panel('redraw',redraw)}${panel('source',original)}${panel('formula',formulaBody)}${panel('evidence',evidence.length?'<p class="board-evidence-note">与本知识点对应的讲者原文及中文翻译。</p>'+evidence.map(speakerPair).join(''):'<div class="board-empty">此处按原PPT解读，当前尚未定位到直接对应的讲解片段。</div>')}</section>`;

function renderPane(restore=true){const p=data.pages[index];if(!p)return;const tools=by('content-tools');tools.innerHTML='';tools.className='content-tools';let content='';if(activeView==='lesson')content=lessonHTML(p);if(activeView==='boards'){if(p.boards?.length){boardIndex=Math.min(boardIndex,p.boards.length-1);tools.innerHTML=boardTools(p);content=knowledgeBoard(currentBoard())}else content='<div class="empty-state"><span class="eyebrow">知识点画板</span><h2>本页画板正在整理</h2><p>可以先阅读讲解、中英对照，或查看原视频截图。</p><button data-switch-view="lesson">返回本页讲解</button><button data-switch-view="source">查看原始材料</button></div>'}if(activeView==='transcript'){tools.classList.add('transcript-tools');tools.innerHTML=`<label><span class="sr">搜索本页中英文原文</span><input id="transcript-search" type="search" placeholder="搜索本页原文…" value="${esc(transcriptQuery)}"></label><select id="transcript-language" aria-label="原文显示语言"><option value="both">中英对照</option><option value="zh">只看中文</option><option value="en">只看英文</option></select><button id="find-speaking" title="定位视频当前时间对应的原文">当前讲述</button>`;content=transcriptHTML(p)}if(activeView==='source')content=sourceHTML(p);by('sheet').innerHTML=content;by('sheet').setAttribute('aria-labelledby','tab-'+activeView);document.querySelectorAll('.reader-tabs [role=tab]').forEach(tab=>{const selected=tab.dataset.view===activeView;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1});mathRender();if(activeView==='boards'&&p.boards?.length){by('board-select').value=boardIndex;by('board-select').onchange=e=>selectBoard(Number(e.target.value));by('board-prev').onclick=()=>selectBoard(boardIndex-1);by('board-next').onclick=()=>selectBoard(boardIndex+1);initBoardUI(by('sheet'))}if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}if(activeView==='transcript'){by('transcript-language').value=language;by('transcript-language').onchange=e=>{language=e.target.value;storage.set('kn-study-language',language);by('sheet').querySelector('.bilingual').className='bilingual language-'+language};by('transcript-search').oninput=e=>{transcriptQuery=e.target.value;by('sheet').innerHTML=transcriptHTML(p);by('sheet').scrollTop=0;highlightSegment()};by('find-speaking').onclick=locateSpeaking;highlightSegment()}restorePanePosition(restore?(scrollPositions.get(paneKey())||0):0);}
function selectBoard(n){rememberScroll();pointPositions.set(`${index}/${boardIndex}`,by('sheet').querySelector('.board-tab[aria-selected=true]')?.dataset.boardTab);boardIndex=Math.max(0,Math.min((data.pages[index].boards?.length||1)-1,n));renderPane();const previous=pointPositions.get(`${index}/${boardIndex}`);if(previous){const tab=[...by('sheet').querySelectorAll('[data-board-tab]')].find(t=>t.dataset.boardTab===previous);tab?.click()}}
function switchView(view,focus=false){if(!views.includes(view)||view===activeView)return;rememberScroll();activeView=view;savePosition();updateURL();renderPane();if(focus)by('tab-'+view).focus()}
function render(){if(!data.pages.length){by('sheet').innerHTML='<div class="empty-state"><h2>本讲内容正在生成</h2><p>请稍后刷新，或返回课程目录。</p><a href="../index.html">返回课程目录</a></div>';return}const p=data.pages[index];by('page-title').textContent=p.title;by('page-title').title=p.title;by('page-position').textContent=`第 ${index+1} / ${data.pages.length} 页`;by('jump').textContent='▶ '+stamp(p.start)+'–'+stamp(p.end);by('counter').textContent=`${index+1} / ${data.pages.length}`;by('toc').value=index;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('board-count').textContent=p.boards?.length||0;by('bookmark-page').setAttribute('aria-pressed',String(bookmarks.has(index)));by('bookmark-page').textContent=bookmarks.has(index)?'◆ 已收藏':'＋ 书签';by('mark-complete').setAttribute('aria-pressed',String(completed.has(index)));by('mark-complete').textContent=completed.has(index)?'✓ 已学完':'○ 标记学完';by('watch-title').textContent=p.title;by('watch-current').textContent='从 '+stamp(p.start)+' 开始观看';if(p.frame&&video.readyState===0)video.poster=p.frame;renderPane();renderOutline();savePosition()}
function go(n,push=true){n=clampPage(n);if(n===index)return;rememberScroll();index=n;boardIndex=0;transcriptQuery='';render();updateURL(push);if(drawer())setOutline(false);by('page-list').querySelector('[aria-current]')?.scrollIntoView({block:'nearest'});}
function onHistory(){const next=clampPage(location.hash.slice(1));const requested=new URL(location.href).searchParams.get('view')||'lesson';if(next===index&&requested===activeView)return;rememberScroll();index=next;activeView=views.includes(requested)?requested:'lesson';boardIndex=0;transcriptQuery='';render();}
function studySeek(t){pendingSeek=Math.max(0,Number(t)||0);setVideo(true);by('video-status').textContent='正在定位至 '+stamp(pendingSeek)+'…';if(!video.getAttribute('src')){by('video-status').textContent='原视频正在同步，也可选择本地视频。';return}if(video.readyState>=1)applyPendingSeek();else video.load()}
function applyPendingSeek(){if(pendingSeek===null)return;const t=pendingSeek;pendingSeek=null;video.currentTime=Number.isFinite(video.duration)?Math.min(t,video.duration):t;video.play().catch(()=>{by('video-status').textContent='已定位至 '+stamp(t)+'，点击播放继续。'});by('video-status').textContent='已定位至 '+stamp(t);}
window.studySeek=studySeek;
function highlightSegment(){if(activeView!=='transcript')return;let active=data.pages[index].segments.find(s=>video.currentTime>=s.start&&video.currentTime<s.end);by('sheet').querySelectorAll('.speaker-pair').forEach(el=>el.classList.toggle('is-active',Boolean(active)&&Number(el.dataset.sourceId)===active.id));lastActiveSegment=active?.id??-1;}
function locateSpeaking(){const t=video.currentTime,at=data.pages.findIndex(p=>t>=p.start&&t<p.end);if(at<0){announce('当前时间没有对应的讲述片段');return}if(index!==at)go(at);if(activeView!=='transcript')switchView('transcript');if(transcriptQuery){transcriptQuery='';renderPane()}highlightSegment();const node=by('sheet').querySelector('.speaker-pair.is-active');if(node)node.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});else announce('此处可能为停顿或无讲述时段');}
function videoError(){by('video-status').textContent=localVideoURL?'当前浏览器无法读取所选视频，请检查格式或换一个文件。':'视频暂时未能播放，可在「视频来源与本地文件」中打开原视频，或选择本地文件。';by('video-dock').querySelector('.video-options').open=true;}
function setZoom(value){zoom=Math.max(.25,Math.min(6,value));by('inspect-content').style.width=(zoom*100)+'%';by('zoom-fit').textContent=zoom===1?'适应窗口':Math.round(zoom*100)+'%';}
async function inspect(detail){const version=++inspectVersion;restoreFocus=document.activeElement;by('inspect-title').textContent=detail.title||'查看图像';by('inspect-content').textContent='正在载入图像…';setZoom(1);if(!by('inspect-dialog').open)by('inspect-dialog').showModal();try{if(detail.image){const img=new Image();img.src=detail.image;img.alt=detail.title||'课程原图';img.onerror=()=>{if(version===inspectVersion)by('inspect-content').innerHTML='<p class="muted">图片暂未载入，请关闭后重试。</p>'};by('inspect-content').replaceChildren(img)}else{const markup=detail.vectorUrl?await getBoardVector(detail.vectorUrl):detail.html;if(version!==inspectVersion)return;by('inspect-content').innerHTML=markup||'<p>暂无图像</p>';}}catch{if(version===inspectVersion)by('inspect-content').innerHTML='<p>图像暂未载入，请关闭后重试。</p>'}}
function closeInspect(){++inspectVersion;by('inspect-dialog').close();restoreFocus?.focus()}
for(const event of ['wheel','touchstart','pointerdown','keydown'])by('sheet').addEventListener(event,()=>{pendingRestore=null},{passive:true});
document.addEventListener('study:inspect',e=>inspect(e.detail));
document.addEventListener('study:board-tab-before',()=>{if(activeView==='boards')rememberScroll()});
document.addEventListener('study:board-tab-after',()=>{if(activeView==='boards'){restorePanePosition(scrollPositions.get(paneKey())||0);rememberScroll()}});
by('inspect-close').onclick=closeInspect;by('inspect-dialog').addEventListener('cancel',()=>{++inspectVersion});by('zoom-in').onclick=()=>setZoom(zoom*1.25);by('zoom-out').onclick=()=>setZoom(zoom/1.25);by('zoom-fit').onclick=()=>setZoom(1);
by('settings-open').onclick=()=>by('settings-dialog').showModal();by('settings-close').onclick=()=>by('settings-dialog').close();by('font-size').value=storage.get('kn-study-font','18');function setFont(){const size=['16','18','20'].includes(by('font-size').value)?by('font-size').value:'18';document.documentElement.style.setProperty('--font-size',size+'px');by('sheet').style.setProperty('--font-size',size+'px');storage.set('kn-study-font',size)}by('font-size').onchange=setFont;setFont();
by('toggle-outline').onclick=()=>setOutline(app.classList.contains('outline-closed'),true);by('close-outline').onclick=()=>{setOutline(false);by('toggle-outline').focus()};by('drawer-shade').onclick=()=>{setOutline(false);by('toggle-outline').focus()};by('toggle-video').onclick=()=>setVideo(app.classList.contains('video-closed'));by('close-video').onclick=()=>{setVideo(false);by('toggle-video').focus()};
by('page-search').oninput=e=>{outlineQuery=e.target.value;renderOutline()};by('filter-all').onclick=()=>setBookmarkFilter(false);by('filter-bookmarks').onclick=()=>setBookmarkFilter(true);by('page-list').onclick=e=>{const item=e.target.closest('[data-page]');if(item){go(Number(item.dataset.page));if(drawer()){setOutline(false);by('sheet').focus({preventScroll:true})}}};
by('bookmark-page').onclick=()=>{if(bookmarks.has(index))bookmarks.delete(index);else bookmarks.add(index);storage.set('kn-study-bookmarks-'+data.id,JSON.stringify([...bookmarks]));by('bookmark-page').setAttribute('aria-pressed',String(bookmarks.has(index)));by('bookmark-page').textContent=bookmarks.has(index)?'◆ 已收藏':'＋ 书签';renderOutline();announce(bookmarks.has(index)?'已加入本讲书签':'已移除书签')};
by('mark-complete').onclick=()=>{if(completed.has(index))completed.delete(index);else completed.add(index);storage.set('kn-study-completed-'+data.id,JSON.stringify([...completed]));by('mark-complete').setAttribute('aria-pressed',String(completed.has(index)));by('mark-complete').textContent=completed.has(index)?'✓ 已学完':'○ 标记学完';renderOutline();announce(completed.has(index)?'已标记本页学完':'已取消学完标记')};
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1} / ${data.pages.length}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);by('jump').onclick=()=>studySeek(data.pages[index].start);by('watch-current').onclick=()=>studySeek(data.pages[index].start);
document.querySelector('.reader-tabs').addEventListener('click',e=>{const tab=e.target.closest('[data-view]');if(tab)switchView(tab.dataset.view)});
document.querySelector('.reader-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();e.stopPropagation();const pos=views.indexOf(activeView),next=e.key==='Home'?0:e.key==='End'?views.length-1:(pos+(e.key==='ArrowRight'?1:-1)+views.length)%views.length;switchView(views[next],true)});
by('sheet').addEventListener('click',e=>{const change=e.target.closest('[data-switch-view]');if(change)switchView(change.dataset.switchView,true);const seek=e.target.closest('.speaker-time[data-time]');if(seek)studySeek(Number(seek.dataset.time));const img=e.target.closest('[data-inspect-image]');if(img&&!img.classList.contains('board-inspect'))inspect({title:img.dataset.title,image:img.dataset.inspectImage});if(e.target.closest('#clear-transcript')){transcriptQuery='';renderPane();by('transcript-search').focus()}});
video.addEventListener('loadedmetadata',applyPendingSeek);video.addEventListener('error',videoError);video.addEventListener('timeupdate',()=>{highlightSegment();if(by('follow-video').checked&&pendingSeek===null){const next=data.pages.findIndex(p=>video.currentTime>=p.start&&video.currentTime<p.end);if(next>=0&&next!==index)go(next,false)}});video.addEventListener('playing',()=>{by('video-status').textContent='正在播放 · '+(localVideoURL?'本地视频':'课程原视频')});
by('back-ten').onclick=()=>studySeek(video.currentTime-10);by('forward-ten').onclick=()=>studySeek(video.currentTime+10);by('playback-rate').value=storage.get('kn-study-rate','1');video.playbackRate=Number(by('playback-rate').value)||1;by('playback-rate').onchange=e=>{video.playbackRate=Number(e.target.value);storage.set('kn-study-rate',e.target.value)};
by('video-download').href=data.video_url||video.getAttribute('src')||'#';by('local-video').onchange=e=>{const file=e.target.files[0];if(!file)return;if(localVideoURL)URL.revokeObjectURL(localVideoURL);localVideoURL=URL.createObjectURL(file);pendingSeek=data.pages[index].start;video.src=localVideoURL;video.load();setVideo(true);by('video-status').textContent='已选择 '+file.name+'，正在定位当前阅读时段。';};
document.addEventListener('keydown',e=>{if(by('inspect-dialog').open||by('settings-dialog').open)return;if(e.key==='Escape'&&!app.classList.contains('outline-closed')&&drawer()){setOutline(false);by('toggle-outline').focus();return}if(drawer()&&!app.classList.contains('outline-closed')&&e.key==='Tab'){const focusable=[...by('outline').querySelectorAll('a,button,input,select')].filter(el=>!el.disabled&&el.getClientRects().length);if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0]?.focus()}return}if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,select,textarea,video,[role=tablist],[contenteditable=true]'))return;if(e.key==='/'){e.preventDefault();setOutline(true,true);by('page-search').focus();return}if(e.target.closest('button,a,summary'))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
window.addEventListener('popstate',onHistory);window.addEventListener('hashchange',onHistory);window.addEventListener('pagehide',()=>{rememberScroll();savePosition();if(localVideoURL)URL.revokeObjectURL(localVideoURL)});
let wasDrawer=drawer(),wasSmall=small();window.addEventListener('resize',()=>{if(drawer()!==wasDrawer){wasDrawer=drawer();setOutline(!wasDrawer&&storage.get('kn-study-outline','open')==='open')}if(small()!==wasSmall){wasSmall=small();setVideo(!wasSmall&&storage.get('kn-study-video','open')==='open')}});
setOutline(!drawer()&&storage.get('kn-study-outline','open')==='open');setVideo(!small()&&storage.get('kn-study-video','open')==='open');render();updateURL();let scrollSaveTimer;by('sheet').addEventListener('scroll',()=>{clearTimeout(scrollSaveTimer);scrollSaveTimer=setTimeout(rememberScroll,180)},{passive:true});
</script></body></html>
