</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】大语言模型与下一词预测损失 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v043.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v043","title":"【斯坦福CS229】大语言模型与下一词预测损失","course":"机器学习","pages":[{"title":"表示学习与嵌入向量在语义搜索中的应用","segments":[{"id":0,"text":"application of representation learning for semantic search which is","zh":"表示学习在语义搜索中的应用，这在大型语言模型时代仍然有用。","start":5.3,"end":10.36},{"id":1,"text":"something still useful for the large language model era. So I guess recall that you know","zh":"所以我想回忆一下，当我们谈论表示学习时，我们关心的是我们想要一个映射","start":11.26,"end":19.84},{"id":2,"text":"when we talk about representation learning what we care about is that we want to have a mapping","zh":"使得给定一个原始输入x，它可以是图像，也可以是文本，也可以是某些","start":20.58,"end":24.3},{"id":3,"text":"that given a raw input x which could be an image, it could be a text, it could be some","zh":"音频或视频。","start":24.82,"end":30.1},{"id":4,"text":"some audios or videos.","zh":"并且你想要一个映射，比如说参数化为theta","start":30.1,"end":30.96},{"id":5,"text":"And you want a mapping that, say, parametrized by theta","zh":"将这个输入映射到phi(theta, x)。","start":31.28,"end":34.96},{"id":6,"text":"that maps this into phi theta x.","zh":"并且这个是一个向量，比如说在维度m中。","start":35.66,"end":38.34},{"id":7,"text":"And this is a vector, let's say, in dimension m.","zh":"这是一个向量，比如说，在m维空间中。","start":38.76,"end":41.54},{"id":8,"text":"So every image is mapped to a vector.","zh":"因此，每张图像都被映射到一个向量。","start":42.32,"end":44.74},{"id":9,"text":"Every sequence of text can be mapped into a vector,","zh":"每一段文本序列都可以被映射到一个向量，","start":44.88,"end":47.86},{"id":10,"text":"so on and so forth.","zh":"依此类推。","start":47.98,"end":48.48},{"id":11,"text":"And what you really want is that you","zh":"你真正想要的是，","start":48.88,"end":51.04},{"id":12,"text":"want similar images to be mapped to similar embeddings.","zh":"相似的图像被映射到相似的嵌入向量。","start":51.04,"end":55.92},{"id":13,"text":"By the way, this is often called embeddings.","zh":"顺便提一句，这通常被称为嵌入向量。","start":55.92,"end":58.56},{"id":14,"text":"Sometimes it's called representation.","zh":"有时也被称为表示。","start":60.76,"end":62.08},{"id":15,"text":"I think probably because representation is too generic,","zh":"我想可能是因为表示这个词太泛了，","start":62.84,"end":66.0},{"id":16,"text":"people often use embeddings.","zh":"人们经常使用嵌入向量。","start":66.56,"end":68.04},{"id":17,"text":"And sometimes people just call this feature.","zh":"有时人们只是称其为特征。","start":68.58,"end":70.84},{"id":18,"text":"I think we will just use the word embeddings, which is pretty much the most common word right now. So this is the embeddings of this image into the Euclidean space. So basically, you embed the image into Euclidean space. So it's a point in the Euclidean space. And often what you want is that you want similar images or maybe similar tags to be mapped to similar embeddings. So for example, if you have maybe a cat, two different cats, cat 1 and cat 2,","zh":"我认为我们会使用“嵌入向量”这个词，这基本上是目前最常用的术语。因此，这是将这张图像嵌入到欧几里得空间中的表示。基本上，你将图像嵌入到欧几里得空间中。因此，它在欧几里得空间中是一个点。通常你希望的是，相似的图像或可能相似的标签被映射到相似的嵌入向量。例如，如果你有一个猫，两个不同的猫，猫1和猫2，","start":71.69,"end":100.75},{"id":19,"text":"maybe and you want this in the euclidean space their representation or their embeddings are similar and if you have an airplane for example then you want let me not try to draw any of this i'll just write it you probably want the embeddings to be somewhere far away that's pretty much done","zh":"也许，你希望在欧几里得空间中它们的表示或嵌入向量是相似的。例如，如果你有一个飞机，你希望嵌入向量位于远处。这基本上就是这个想法。","start":101.6,"end":120.18},{"id":20,"text":"the idea. So you want similar images to be mapped to similar embeddings. You want different images to be mapped to different embeddings. And then you can use the embeddings to do some similarity research. For example, you can say, I have the embeddings for this image of cat, and I want similar images of cat. I will just go look at which other images have similar embeddings, and those are supposed to be similar images. And the same thing for text and audios and videos.","zh":"你希望相似的图像被映射到相似的嵌入向量。你希望不同的图像被映射到不同的嵌入向量。然后你可以使用这些嵌入向量来进行相似性搜索。例如，你可以这样说，我有这张猫图像的嵌入向量，我想要相似的猫图像。我只需要查看哪些其他图像具有相似的嵌入向量，这些图像应该就是相似的图像。同样的情况也适用于文本、音频和视频。","start":122.33,"end":149.05},{"id":21,"text":"We probably mostly use the image as an example. In a later part of the lecture, I'm going to talk a little more about text. But the technologies are very, very similar. So we'll just start with images, which is the most canonical way to discuss these kind of ideas. So that's pretty much the basic ideas of","zh":"我们可能主要使用图像作为例子。在讲座的后半部分，我会稍微多讲一些关于文本的内容。但技术是非常、非常相似的。因此，我们先从图像开始，这是讨论这些想法最典型的途径。这就是这些基本思想的大概。","start":149.5,"end":169.11}],"notes":["本段讲解了表示学习（representation learning）的基本概念，即通过映射将原始输入（如图像、文本、音频、视频）转换为嵌入向量（embeddings），这些向量通常位于欧几里得空间中。相似的输入应映射到相似的嵌入，而不同的输入应映射到不同的嵌入。这种映射有助于进行语义搜索，例如通过比较嵌入向量的相似性来找到相似的图像、文本或音频。","讲者提到，嵌入（embeddings）是表示学习中常用的术语，有时也被称为表示（representation）或特征（feature）。由于“representation”过于通用，人们更倾向于使用“embeddings”这一术语。嵌入向量的目的是将输入数据转换为可以在欧几里得空间中进行比较的数值形式。","讲者以图像为例，说明了嵌入向量的应用。例如，两张不同的猫图像应映射到相似的嵌入向量，而飞机图像则应映射到远离猫图像嵌入的区域。这种映射使得可以通过比较嵌入向量的相似性来实现语义搜索。","讲者指出，嵌入向量可以用于各种类型的数据，如文本、音频和视频。通过比较嵌入向量的相似性，可以找到具有相似语义的输入。例如，给定一张猫的图像嵌入，可以搜索其他具有相似嵌入的图像，从而找到相似的猫图像。","讲者提到，图像通常是讨论表示学习的典型例子，但后续还会涉及文本的表示学习。尽管技术细节可能有所不同，但基本原理是相似的。因此，课程将首先以图像为例，介绍表示学习的基本概念。","讲者强调，表示学习的目标是将输入数据映射到一个可以进行相似性比较的向量空间。这种映射使得可以利用嵌入向量进行语义搜索，从而实现更高效的检索和分析。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.3,"end":169.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":5.3,"text":"application of representation learning for semantic search which is"},{"start":11.26,"text":"something still useful for the large language model era. So I guess recall that you know"},{"start":20.58,"text":"when we talk about representation learning what we care about is that we want to have a mapping"},{"start":24.82,"text":"that given a raw input x which could be an image, it could be a text, it could be some"},{"start":30.1,"text":"some audios or videos."},{"start":31.28,"text":"And you want a mapping that, say, parametrized by theta"},{"start":35.66,"text":"that maps this into phi theta x."},{"start":38.76,"text":"And this is a vector, let's say, in dimension m."},{"start":42.32,"text":"So every image is mapped to a vector."},{"start":44.88,"text":"Every sequence of text can be mapped into a vector,"},{"start":47.98,"text":"so on and so forth."},{"start":48.88,"text":"And what you really want is that you"},{"start":51.04,"text":"want similar images to be mapped to similar embeddings."},{"start":55.92,"text":"By the way, this is often called embeddings."},{"start":60.76,"text":"Sometimes it's called representation."},{"start":62.84,"text":"I think probably because representation is too generic,"},{"start":66.56,"text":"people often use embeddings."},{"start":68.58,"text":"And sometimes people just call this feature."},{"start":71.69,"text":"I think we will just use the word embeddings, which is pretty much the most common word right now. So this is the embeddings of this image into the Euclidean space. So basically, you embed the image into Euclidean space. So it's a point in the Euclidean space. And often what you want is that you want similar images or maybe similar tags to be mapped to similar embeddings. So for example, if you have maybe a cat, two different cats, cat 1 and cat 2,"},{"start":101.6,"text":"maybe and you want this in the euclidean space their representation or their embeddings are similar and if you have an airplane for example then you want let me not try to draw any of this i'll just write it you probably want the embeddings to be somewhere far away that's pretty much done"},{"start":122.33,"text":"the idea. So you want similar images to be mapped to similar embeddings. You want different images to be mapped to different embeddings. And then you can use the embeddings to do some similarity research. For example, you can say, I have the embeddings for this image of cat, and I want similar images of cat. I will just go look at which other images have similar embeddings, and those are supposed to be similar images. And the same thing for text and audios and videos."},{"start":149.5,"text":"We probably mostly use the image as an example. In a later part of the lecture, I'm going to talk a little more about text. But the technologies are very, very similar. So we'll just start with images, which is the most canonical way to discuss these kind of ideas. So that's pretty much the basic ideas of"}],"speech_gaps":[],"frame":"../frames/v043/001.webp","frame_time":17.3},{"title":"嵌入与表示学习的训练方法","segments":[{"id":22,"text":"Embeddings. I guess we have discussed some other applications of embeddings, which are you can use these embeddings as an input to a linear classification. And you add a linear head on top of it. You do a so-called linear probe. Those are useful tools. But these days, people don't use those anymore that much because you can just use the end-to-end model as opposed to have these two separate steps. So that's why the most","zh":"嵌入。我想我们已经讨论过一些嵌入的其他应用，你可以将这些嵌入作为线性分类的输入，并在其上添加一个线性头部。你这样做被称为线性探针。这些是很有用的工具。但如今，人们不再像以前那样频繁地使用这些方法，因为你可以直接使用端到端模型，而不是将这两个步骤分开。这就是为什么如今这些嵌入或表示学习最重要的应用是相似性搜索。","start":171.15,"end":198.49},{"id":23,"text":"important applications these days for these embeddings or representation learning is the similarity search. Okay, so then next, let's talk about how to train these embeddings, right? This is one of the main tasks for this lecture. For this course, we are trying to teach a little bit about how to train these models. And let's start with images.","zh":"好的，那么接下来，让我们谈谈如何训练这些嵌入，对吧？这是本节课的主要任务之一。在这门课程中，我们试图教一些如何训练这些模型的知识。让我们从图像开始。","start":200.27,"end":222.24},{"id":24,"text":"So for image representation, the way that people do it is the following. You start with, okay, I guess there are two ways. The first way is called supervised pre-training, which is not very common anymore, but because it's very easy to describe and it existed in the literature, we'll talk about very, very briefly. So we can use the supervised pre-training for representations, for embeddings. And the idea is very, very simple.","zh":"对于图像表示，人们通常采用以下方法。你开始时，我想有两种方法。第一种方法称为监督预训练，现在已经不那么常见了，但由于它非常容易描述，并且在文献中存在，我们将简要地谈谈。我们可以使用监督预训练来获得表示或嵌入。其想法非常简单。","start":223.36,"end":250.45},{"id":25,"text":"What you do is you just use a new artwork. Let's say, suppose you have a new artwork X, and you have a gigantic new artwork. How do you draw it? You have many, many layers. And you use this to predict some labels. You have a supervised classification task. You have a thousand labels, for example, in ImageNet. And you tune a new artwork to predict the labels. And this new artwork has many layers. And often, the last but one layer","zh":"你所做的就是使用一个新作品。例如，假设你有一个新作品 X，还有一个巨大的新作品。你是如何绘制它的？你有许多许多层，并使用这些层来预测一些标签。你有一个监督分类任务。例如，ImageNet中有1000个标签。你调整这个新作品以预测这些标签。这个新作品有许多层。通常，倒数第二层","start":251.01,"end":280.42},{"id":26,"text":"is some kind of vector. And then you add some matrix w to turn it into logits, to turn it into maybe this is the logits. And then you do a softmax, right?","zh":"是一个向量。然后你添加一个矩阵 w 来将其转换为对数几率（logits），也许这就是对数几率。然后你进行 softmax 操作，对吧？","start":281.12,"end":295.81},{"id":27,"text":"That's pretty much what often new artworks look like. We discussed this before. And you just call this layer the phi theta x. You see the last but one layer, the prenotimate layer, is the representations. You just drop everything afterwards. You say, this is my representations. I'm going to use it for my downstream applications. I can use it as inputs for some other.","zh":"这基本上就是新作品通常的样子。我们之前讨论过这一点。你只需将这一层称为 phi theta x。你看到倒数第二层，即预激活层，是表示。你只需丢弃之后的所有内容。你说，这就是我的表示。我要将它用于下游应用。我可以将其作为其他模型的输入。","start":297.68,"end":322.18}],"notes":["本段讲解了监督预训练方法，即使用图像数据集（如ImageNet）进行分类任务，通过多层网络结构预测标签，最后一层（倒数第二层）作为表示层，用于下游任务。","讲者提到监督预训练虽然不常见，但因其描述简单且在文献中存在，因此简要介绍。该方法通过调整网络参数以预测标签，最后一层输出为向量，再通过矩阵变换和softmax函数得到分类结果。","讲者指出，最后一层（倒数第二层）被称为表示层，即phi(theta, x)，并强调该层的输出可作为下游任务的输入，无需后续处理。","讲者提到，监督预训练方法中，网络结构包含多个层，通过训练使网络能够预测标签，从而学习到图像的表示。","讲者指出，监督预训练方法中，最后一层输出为向量，再通过矩阵w转换为logits，最后通过softmax函数进行分类。","讲者强调，监督预训练方法中，最后一层（倒数第二层）作为表示层，用于下游任务，而后续层则被丢弃。"],"formulas":[],"uncertainties":["prenotimate"],"diagram":"none","start":171.15,"end":322.18,"asr_flags":[],"math_clarifications":["原文中未明确定义 'representation'、'W'、'softmax' 等符号的数学类型和维度，因此无法核定其数学正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":171.15,"text":"Embeddings. I guess we have discussed some other applications of embeddings, which are you can use these embeddings as an input to a linear classification. And you add a linear head on top of it. You do a so-called linear probe. Those are useful tools. But these days, people don't use those anymore that much because you can just use the end-to-end model as opposed to have these two separate steps. So that's why the most"},{"start":200.27,"text":"important applications these days for these embeddings or representation learning is the similarity search. Okay, so then next, let's talk about how to train these embeddings, right? This is one of the main tasks for this lecture. For this course, we are trying to teach a little bit about how to train these models. And let's start with images."},{"start":223.36,"text":"So for image representation, the way that people do it is the following. You start with, okay, I guess there are two ways. The first way is called supervised pre-training, which is not very common anymore, but because it's very easy to describe and it existed in the literature, we'll talk about very, very briefly. So we can use the supervised pre-training for representations, for embeddings. And the idea is very, very simple."},{"start":251.01,"text":"What you do is you just use a new artwork. Let's say, suppose you have a new artwork X, and you have a gigantic new artwork. How do you draw it? You have many, many layers. And you use this to predict some labels. You have a supervised classification task. You have a thousand labels, for example, in ImageNet. And you tune a new artwork to predict the labels. And this new artwork has many layers. And often, the last but one layer"},{"start":281.12,"text":"is some kind of vector. And then you add some matrix w to turn it into logits, to turn it into maybe this is the logits. And then you do a softmax, right?"},{"start":297.68,"text":"That's pretty much what often new artworks look like. We discussed this before. And you just call this layer the phi theta x. You see the last but one layer, the prenotimate layer, is the representations. You just drop everything afterwards. You say, this is my representations. I'm going to use it for my downstream applications. I can use it as inputs for some other."}],"speech_gaps":[],"frame":"../frames/v043/002.webp","frame_time":183.15},{"title":"无监督学习与对比学习","segments":[{"id":28,"text":"classification tasks, which is the linear probe approach, or I can just use this to measure similarities between images. So that's the so-called two parts per training. And you can see the concern is that you have to use a large label data set to learn this. Especially, you have to use a relatively large label data set because if your labels are only just binary, maybe 0 to 10, then","zh":"分类任务，也就是所谓的线性探针方法，或者我也可以仅仅使用它来衡量图像之间的相似性。因此这就是所谓的两阶段训练。你可以看到，问题在于你必须使用一个大型的带标签数据集来学习这一点。特别是，你必须使用一个相对较大的带标签数据集，因为如果你的标签仅仅是二元的，比如0到10，那么","start":322.77,"end":351.58},{"id":29,"text":"presumably the features you learn, the internal representations you learn to predict those labels are not diverse enough. So suppose the only thing you care about is whether it's a zero to nine digit, then you probably only recognize certain kind of like patterns that is only related to the digits, but not other patterns. Maybe more extreme example, suppose the only labels you have is like black and white, whether it's like a black and white image or a colored image, then you don't have to have any representations to","zh":"你所学到的特征，也就是你用来预测这些标签的内部表示，可能不够多样化。假设你唯一关心的是它是否是0到9的数字，那么你可能只会识别与数字相关的某些特定模式，而不会识别其他模式。也许更极端的例子，假设你拥有的唯一标签是黑白与否，即是否是黑白图像或彩色图像，那么你就不需要任何复杂的表示来","start":352.55,"end":381.96},{"id":30,"text":"any complex representations to predict the label very","zh":"准确地预测标签，那么这些表示","start":382.32,"end":385.82},{"id":31,"text":"accurately, and then the representations","zh":"就无法用于其他任务。","start":385.82,"end":387.24},{"id":32,"text":"wouldn't be useful for other tasks.","zh":"然而，如果你拥有足够多样化的标签集，比如像ImageNet那样的1000个标签，那么这些表示","start":387.24,"end":388.82},{"id":33,"text":"However, if you have a diverse enough label set, maybe","zh":"通常会非常好。","start":389.38,"end":392.0},{"id":34,"text":"like 1,000 labels like ImageNet, then the representations","zh":"像ImageNet那样有1,000个标签，然后表示方法","start":392.0,"end":395.0},{"id":35,"text":"are generally pretty good.","zh":"通常已经相当不错了。","start":395.0,"end":396.22},{"id":36,"text":"But still, the limitation is that if you want to scale it,","zh":"但即便如此，其局限性在于如果你想扩展它，","start":398.26,"end":401.96},{"id":37,"text":"you want to get more and more labels, it's very expensive.","zh":"你想要获得越来越多的标签，这非常昂贵。","start":402.02,"end":404.2},{"id":38,"text":"You have to get more and more labels, more and more data,","zh":"你必须获得越来越多的标签和越来越多的数据，","start":404.42,"end":406.32},{"id":39,"text":"use a lot of labelers.","zh":"使用大量的标注人员。","start":406.98,"end":407.66},{"id":40,"text":"So, that's why people move towards the unspressed approach.","zh":"因此，人们转向了无监督的方法。","start":407.66,"end":412.82},{"id":41,"text":"So, this is called contrastive learning.","zh":"因此，这种方法被称为对比学习。","start":413.24,"end":417.22},{"id":42,"text":"So, there are different forms of this, but at least one of the original motivations is that you want to learn these representations without needing any labels from images.","zh":"因此，存在多种形式的这种学习方式，但至少最初的动机之一是，你希望在不需要任何图像标签的情况下学习这些表示。","start":423.82,"end":436.64},{"id":43,"text":"images. And the approach is like this. So there are many, many details. So the general","zh":"图像。这种方法的思路如下。因此有许多许多细节。因此，总体","start":436.64,"end":441.46},{"id":44,"text":"principle is that you have an image X, you first use augmentation to generate two versions","zh":"其原理是，你有一张图像 X，你首先使用增强方法生成两个版本","start":441.46,"end":448.72},{"id":45,"text":"of it. So you say, I guess, you know, I don't have, I didn't have the slides, but you can","zh":"所以你可以说，我猜，你知道，我没有，我没有看到幻灯片，但你可以","start":448.72,"end":456.12},{"id":46,"text":"imagine, let's say, suppose you have X hat and X tilde. These are augmentations. And","zh":"想象，比如说，假设你有 X hat 和 X tilde。这些是增强后的图像。","start":456.12,"end":466.62},{"id":47,"text":"um, heard of augmentations,","zh":"嗯，听说过增强方法吗，","start":466.62,"end":467.86},{"id":48,"text":"it means that, uh, you do random","zh":"这意味着，嗯，你进行随机","start":467.86,"end":470.06},{"id":49,"text":"random flip, sometimes random blurring, sometimes you add random noise. There are many different ways of doing augmentations. And I think cropping is probably the most important thing. You have a big image, you crop a small part of it. If you Google search quickly, you can see online many visual examples. And because it's random, so you can use two random C to generate two augmentations. Maybe you have a big image and you get the X hat is one right top corner and the X tilde is the left bottom corner. And maybe you can add","zh":"随机翻转，有时随机模糊，有时你添加随机噪声。有许多不同的增强方法。我认为裁剪可能是最重要的方法之一。你有一张大图像，你裁剪其中一小部分。如果你快速进行谷歌搜索，你可以在网上看到许多视觉示例。由于是随机的，因此你可以使用两个随机的 C 来生成两个增强版本。也许你有一张大图像，你得到的 X hat 是右上角，而 X tilde 是左下角。也许你还可以添加","start":470.81,"end":499.91}],"notes":["本段讨论了监督学习中标签数据集的局限性，指出如果标签数据集不够多样，学习到的特征表示可能无法泛化到其他任务。例如，如果只有0到9的标签，模型可能只学习与数字相关的模式，而无法识别其他类型的模式。极端情况下，如果只有黑白标签，模型可能不需要复杂的表示就能准确预测标签，导致表示对其他任务无用。","当标签数据集足够多样时，如ImageNet的1000个标签，表示通常会比较有效。然而，随着任务扩展，需要更多标签，这会带来高昂的成本，因此人们转向无监督方法。","对比学习（contrastive learning）是一种无监督方法，其核心思想是通过数据增强生成两个图像版本，然后学习使相似图像的表示接近、不相似图像的表示远离的表示。数据增强包括随机翻转、模糊、添加噪声等操作，其中裁剪（cropping）是最重要的方法之一。","通过随机裁剪生成两个增强图像，例如从图像的右上角和左下角分别裁剪，然后学习使这两个增强图像的表示尽可能相似，而与其他图像的表示尽可能不同。这种学习方式不需要标签，仅依赖图像之间的相似性进行表示学习。","对比学习的实现需要考虑数据增强的具体方式，以及如何定义相似性度量。例如，使用余弦相似度或欧氏距离来衡量表示之间的相似性，并通过优化损失函数（如对比损失）来学习表示。"],"formulas":[],"uncertainties":["two random C to generate two augmentations"],"diagram":"none","start":322.77,"end":499.91,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":322.77,"text":"classification tasks, which is the linear probe approach, or I can just use this to measure similarities between images. So that's the so-called two parts per training. And you can see the concern is that you have to use a large label data set to learn this. Especially, you have to use a relatively large label data set because if your labels are only just binary, maybe 0 to 10, then"},{"start":352.55,"text":"presumably the features you learn, the internal representations you learn to predict those labels are not diverse enough. So suppose the only thing you care about is whether it's a zero to nine digit, then you probably only recognize certain kind of like patterns that is only related to the digits, but not other patterns. Maybe more extreme example, suppose the only labels you have is like black and white, whether it's like a black and white image or a colored image, then you don't have to have any representations to"},{"start":382.32,"text":"any complex representations to predict the label very"},{"start":385.82,"text":"accurately, and then the representations"},{"start":387.24,"text":"wouldn't be useful for other tasks."},{"start":389.38,"text":"However, if you have a diverse enough label set, maybe"},{"start":392.0,"text":"like 1,000 labels like ImageNet, then the representations"},{"start":395.0,"text":"are generally pretty good."},{"start":398.26,"text":"But still, the limitation is that if you want to scale it,"},{"start":402.02,"text":"you want to get more and more labels, it's very expensive."},{"start":404.42,"text":"You have to get more and more labels, more and more data,"},{"start":406.98,"text":"use a lot of labelers."},{"start":407.66,"text":"So, that's why people move towards the unspressed approach."},{"start":413.24,"text":"So, this is called contrastive learning."},{"start":423.82,"text":"So, there are different forms of this, but at least one of the original motivations is that you want to learn these representations without needing any labels from images."},{"start":436.64,"text":"images. And the approach is like this. So there are many, many details. So the general"},{"start":441.46,"text":"principle is that you have an image X, you first use augmentation to generate two versions"},{"start":448.72,"text":"of it. So you say, I guess, you know, I don't have, I didn't have the slides, but you can"},{"start":456.12,"text":"imagine, let's say, suppose you have X hat and X tilde. These are augmentations. And"},{"start":466.62,"text":"um, heard of augmentations,"},{"start":467.86,"text":"it means that, uh, you do random"},{"start":470.81,"text":"random flip, sometimes random blurring, sometimes you add random noise. There are many different ways of doing augmentations. And I think cropping is probably the most important thing. You have a big image, you crop a small part of it. If you Google search quickly, you can see online many visual examples. And because it's random, so you can use two random C to generate two augmentations. Maybe you have a big image and you get the X hat is one right top corner and the X tilde is the left bottom corner. And maybe you can add"}],"speech_gaps":[],"frame":"../frames/v043/003.webp","frame_time":334.77},{"title":"大语言模型与下一词预测损失","segments":[{"id":50,"text":"additional flips, blurring, so on and so forth. So can you repeat the question? So I guess you're asking why...","zh":"额外的翻转、模糊，等等。那么你能重复一下问题吗？所以我想你在问为什么...","start":500.19,"end":520.9},{"id":51,"text":"I'm trying to translate your sentence a little bit. Like, are you asking why? Even you are able to predict the ground truth, predict the labels perfectly, right? Even if that's the case, why this representation is good? No, that's not the question. But where does that come from? So I'm trying to see what's the...","zh":"我正在尝试翻译你的句子。比如，你是在问为什么吗？即使你能够完美地预测真实标签，预测标签，对吧？即使在这种情况下，为什么这种表示是好的？不，这不是问题。但它是从哪里来的？所以我正在试图弄清楚什么是...","start":521.62,"end":544.49},{"id":52,"text":"Because this label is... There is no so-called ground truth representation, by the way. So the representation, if it satisfies certain properties, it's probably a good one. But there's no so-called ground truth ones. Because the label is supposed to be what you put in space to find the embedding of some texture image, right? No, no. The labels are just discrete labels, like whether it's a cat or dog or a bulldog, so on and so forth.","zh":"因为这个标签是...顺便说一句，不存在所谓的地面真实表示。所以，如果这个表示满足某些属性，它可能是一个好的表示。但并不存在所谓的地面真实表示。因为标签是你放入空间中以找到某些纹理图像嵌入的，对吧？不，不。标签只是离散的标签，比如它是猫还是狗还是斗牛犬，等等。","start":545.4,"end":569.8},{"id":53,"text":"Oh, maybe that's the confusion. This is a classification task, just to clarify. This is a very, very simple vanilla classification task. Like, you have, like, a following class is, like, I think you mentioned that, like, maybe Bulldog is one class, you know, like, some special person cat is one class, you know, like, a firetruck is another class.","zh":"哦，也许这就是混淆所在。这是一个分类任务，为了澄清。这是一个非常、非常简单的普通分类任务。比如，你有一个类别，比如，我想你提到过，比如斗牛犬是一个类别，你知道，比如某种特殊的人猫是一个类别，你知道，比如消防车是另一个类别。","start":570.44,"end":588.08},{"id":54,"text":"Yeah, what is the deterministic? The question is whether you can use a deterministic method. What are deterministic methods? Yeah, yeah, yeah. So for example, if you just, you know, this is already a vector, right? It's already a tensor in the beginning, right? Because there are numerical numbers. If you concatenate them, then, but you don't have this property that similar cats will have similar embeddings, right? For example, you can have","zh":"是的，什么是确定性的？问题是，你能否使用确定性方法。什么是确定性方法？是的，是的，是的。例如，如果你只是，你知道，这已经是一个向量了，对吧？它一开始就是一个张量，对吧？因为有数值。如果你将它们连接起来，但你没有这种性质，即相似的猫会有相似的嵌入，对吧？例如，你可以有","start":599.55,"end":629.29},{"id":55,"text":"a person cat in this position and the other position, in the raw pixel space, they are very far away from each other. If you compare the two pixels, pixel by pixel, they are very different. But humans will see they are the same cat. So somehow you have to extract the semantic meanings from it.","zh":"一个在某个位置的人猫和另一个位置的人猫，在原始像素空间中，它们彼此非常遥远。如果你逐个像素地比较这两个像素，它们非常不同。但人类会看到它们是同一只猫。因此，你必须以某种方式从中提取语义含义。","start":629.87,"end":646.25},{"id":56,"text":"Yes, exactly, exactly. So we're going to try to find embeddings that satisfy this kind of property. And one way to do it is by just doing a classification task. So, and the representations, you know, there's no proof for why the representations are good, but intuitively...","zh":"是的，没错，没错。所以我们试图找到满足这种性质的嵌入。一种方法就是通过执行一个分类任务。所以，这些表示，你知道的，没有证明为什么这些表示是好的，但直观上...","start":657.67,"end":671.47}],"notes":["本段讨论了分类任务中表示学习的问题，强调了即使能够完美预测标签，也不能直接说明表示是好的。讲者指出，没有所谓的‘真实表示’，表示的好坏取决于是否满足某些性质。","讲者澄清了分类任务的性质，指出这是一个非常基础的分类任务，例如将猫、狗、消防车等作为不同类别。这有助于理解表示学习的目标是提取语义信息。","讲者提到确定性方法的问题，指出如果直接将数值拼接，可能无法保证相似对象具有相似的嵌入表示。例如，不同位置的猫在像素空间中可能差异很大，但人类仍能识别为同一对象。","讲者强调了表示学习的目标是找到满足特定性质的嵌入，例如相似对象具有相似表示。虽然没有严格的证明，但这种直观理解是表示学习的重要基础。","讲者提到分类任务是实现这一目标的一种方法，但表示的好坏仍需通过其他方式验证，如语义相似性或任务性能。","讲者指出，表示学习的挑战在于如何从原始数据中提取语义信息，这需要模型具备一定的抽象和概括能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":500.19,"end":671.47,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":500.19,"text":"additional flips, blurring, so on and so forth. So can you repeat the question? So I guess you're asking why..."},{"start":521.62,"text":"I'm trying to translate your sentence a little bit. Like, are you asking why? Even you are able to predict the ground truth, predict the labels perfectly, right? Even if that's the case, why this representation is good? No, that's not the question. But where does that come from? So I'm trying to see what's the..."},{"start":545.4,"text":"Because this label is... There is no so-called ground truth representation, by the way. So the representation, if it satisfies certain properties, it's probably a good one. But there's no so-called ground truth ones. Because the label is supposed to be what you put in space to find the embedding of some texture image, right? No, no. The labels are just discrete labels, like whether it's a cat or dog or a bulldog, so on and so forth."},{"start":570.44,"text":"Oh, maybe that's the confusion. This is a classification task, just to clarify. This is a very, very simple vanilla classification task. Like, you have, like, a following class is, like, I think you mentioned that, like, maybe Bulldog is one class, you know, like, some special person cat is one class, you know, like, a firetruck is another class."},{"start":599.55,"text":"Yeah, what is the deterministic? The question is whether you can use a deterministic method. What are deterministic methods? Yeah, yeah, yeah. So for example, if you just, you know, this is already a vector, right? It's already a tensor in the beginning, right? Because there are numerical numbers. If you concatenate them, then, but you don't have this property that similar cats will have similar embeddings, right? For example, you can have"},{"start":629.87,"text":"a person cat in this position and the other position, in the raw pixel space, they are very far away from each other. If you compare the two pixels, pixel by pixel, they are very different. But humans will see they are the same cat. So somehow you have to extract the semantic meanings from it."},{"start":657.67,"text":"Yes, exactly, exactly. So we're going to try to find embeddings that satisfy this kind of property. And one way to do it is by just doing a classification task. So, and the representations, you know, there's no proof for why the representations are good, but intuitively..."}],"speech_gaps":[{"start":589.808,"end":592.432},{"start":592.688,"end":595.568},{"start":595.568,"end":597.152},{"start":648.976,"end":657.27}],"frame":"../frames/v043/004.webp","frame_time":512.19},{"title":"大语言模型与下一词预测损失","segments":[{"id":57,"text":"If your representations are not capturing the similarity of the images, you probably cannot predict the labels with a linear classification anyways. So that's kind of the reason. For example, if you use the x as the representation and you take a linear classifier, you wouldn't be able to predict the labels. Any other questions? How is this linear? Because it's frozen like the other way. No.","zh":"如果你的表示没有捕捉到图像之间的相似性，那么你无论如何都无法用线性分类器来预测标签。这就是原因。例如，如果你使用x作为表示，并使用线性分类器，你就无法预测标签。还有其他问题吗？为什么是线性的？因为它像其他方式一样被冻结了。不。","start":672.31,"end":702.84},{"id":58,"text":"No, here we are trying to, we are using this part as your representation. It's not, maybe I didn't get the question. So you churn this from scratch, first of all? Yeah. Yeah, so that's the difference. Sorry, can you repeat the question? Maybe I didn't get it. No, I think that makes sense, because it's being churned from scratch, and then you're synchronizing to that layer.","zh":"不，我们在这里尝试的是，我们使用这一部分作为你的表示。也许我没有理解你的问题。所以你从头开始生成这个吗？是的。是的，这就是区别。抱歉，你能重复一下问题吗？也许我没有理解。不，我认为这很有道理，因为它是从头开始生成的，然后你同步到这一层。","start":704.0,"end":730.67},{"id":59,"text":"applying the linear you don't apply the linear transformation you get rid of it you just declare this is my final goal my final deliverable any other questions about the supervised approach","zh":"应用线性变换，你不会应用线性变换，你会去掉它，你只是声明这是我的最终目标，我的最终成果。还有关于监督方法的其他问题吗？","start":731.86,"end":743.46},{"id":60,"text":"OK, great. OK, so now the enterprise approach. And recall that our goal is to produce something like this. We don't care about the final classification. The classification is a mean towards the end. And here, I don't even have classification labels. I don't have a data set with labels. I just have a batch of images, nothing else. So I want to find a method that can give me that representation such that similar images are similar in the Euclidean space.","zh":"好的，很好。好的，现在是企业级方法。并回想我们的目标是生成类似这样的东西。我们不关心最终的分类。分类只是达到目标的一种手段。在这里，我甚至没有分类标签。我没有带有标签的数据集。我只有一批图像，没有其他内容。因此，我想找到一种方法，可以得到这样的表示，使得相似的图像在欧几里得空间中也是相似的。","start":744.7,"end":768.22},{"id":61,"text":"an approach is like this you know you you use the x and do augmentations you get different two augmentations of course you can have multiple augmentations you just take two random one by random cropping random flipping you know like sometimes like you know","zh":"一种方法是这样的，你知道，你使用x并进行增强，得到不同的两个增强版本，当然你可以有多个增强版本，你只需随机选择两个，比如随机裁剪、随机翻转，你知道，有时像这样。","start":770.03,"end":784.85},{"id":62,"text":"adding blurry, kind of like making it a little bit blurry, or adding Gaussian noise, so on and so forth. Sometimes you do some color transformation. You make it black and white. You make the color seem a little bit different. There's a family of augmentations. Eventually, exactly what augmentations are don't matter that much. You have to have enough diverse augmentations. But that's it. And then you get these two things. And then you say, I want these two. So you can apply a new artwork on this. You can get phi theta x hat.","zh":"添加模糊，有点模糊，或者添加高斯噪声，等等。有时你会做一些颜色变换。你会把它变成黑白，你会让颜色看起来有点不同。有一系列的增强方法。最终，具体使用哪些增强方法并不重要。你必须有足够的多样化增强。但这就是全部。然后你会得到这两个东西。然后你会说，我希望得到这两个。因此，你可以在这个基础上应用一个新的艺术作品，你可以得到phi theta x hat。","start":785.74,"end":814.7},{"id":63,"text":"And you can get applied on your network phi theta, and you get phi theta x tilde. And you say you want these two to be close. So that's something you can express by a loss function. You just say these two needs to be close. I need to minimize the distance between this. And you don't need any label so far.","zh":"你可以将这个应用到你的网络 phi theta 上，得到 phi theta x tilde。然后你说你希望这两个结果接近。因此，你可以通过一个损失函数来表达这一点。你只需要说这两个结果需要接近。我需要最小化它们之间的距离。到目前为止，你还不需要任何标签。","start":815.32,"end":832.06}],"notes":["本段讨论了表示学习与线性分类之间的关系。如果表示无法捕捉图像之间的相似性，那么使用线性分类器预测标签将变得困难。例如，如果使用x作为表示并采用线性分类器，就无法预测标签。这表明表示学习的质量直接影响分类性能。","讲者提到线性分类器的使用方式，即不应用线性变换，而是直接声明最终目标。这表明在某些情况下，线性分类器可能被简化为直接使用表示作为最终输出。","讲者讨论了数据增强（data augmentation）在表示学习中的应用。通过随机裁剪、翻转、模糊、添加高斯噪声等操作，可以生成多样化的增强图像。这些增强图像用于训练模型，使其学习到更鲁棒的表示。","讲者提到，增强操作的具体形式并不重要，关键在于增强的多样性。只要增强操作足够多样，就能帮助模型学习到更有效的表示。","讲者进一步说明，通过增强操作得到的两个图像，可以应用损失函数使它们在欧几里得空间中尽可能接近。这种做法不需要标签，属于无监督学习的一种方法。","讲者提到，通过应用损失函数，可以使得增强后的图像表示尽可能接近，从而学习到更有效的表示。这种做法在无监督学习中非常常见，尤其是在表示学习中。"],"formulas":[],"uncertainties":["phi theta x hat 和 phi theta x tilde 的具体含义可能需要进一步澄清，但根据上下文，它们可能表示增强后的表示"],"diagram":"none","start":672.31,"end":832.06,"asr_flags":[],"math_clarifications":["公式中的距离函数未明确具体形式，如欧几里得距离或余弦相似度，且未说明x和x'是经过增强后的输入。此外，损失函数的形式未明确，如是否为均方误差或交叉熵。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":672.31,"text":"If your representations are not capturing the similarity of the images, you probably cannot predict the labels with a linear classification anyways. So that's kind of the reason. For example, if you use the x as the representation and you take a linear classifier, you wouldn't be able to predict the labels. Any other questions? How is this linear? Because it's frozen like the other way. No."},{"start":704.0,"text":"No, here we are trying to, we are using this part as your representation. It's not, maybe I didn't get the question. So you churn this from scratch, first of all? Yeah. Yeah, so that's the difference. Sorry, can you repeat the question? Maybe I didn't get it. No, I think that makes sense, because it's being churned from scratch, and then you're synchronizing to that layer."},{"start":731.86,"text":"applying the linear you don't apply the linear transformation you get rid of it you just declare this is my final goal my final deliverable any other questions about the supervised approach"},{"start":744.7,"text":"OK, great. OK, so now the enterprise approach. And recall that our goal is to produce something like this. We don't care about the final classification. The classification is a mean towards the end. And here, I don't even have classification labels. I don't have a data set with labels. I just have a batch of images, nothing else. So I want to find a method that can give me that representation such that similar images are similar in the Euclidean space."},{"start":770.03,"text":"an approach is like this you know you you use the x and do augmentations you get different two augmentations of course you can have multiple augmentations you just take two random one by random cropping random flipping you know like sometimes like you know"},{"start":785.74,"text":"adding blurry, kind of like making it a little bit blurry, or adding Gaussian noise, so on and so forth. Sometimes you do some color transformation. You make it black and white. You make the color seem a little bit different. There's a family of augmentations. Eventually, exactly what augmentations are don't matter that much. You have to have enough diverse augmentations. But that's it. And then you get these two things. And then you say, I want these two. So you can apply a new artwork on this. You can get phi theta x hat."},{"start":815.32,"text":"And you can get applied on your network phi theta, and you get phi theta x tilde. And you say you want these two to be close. So that's something you can express by a loss function. You just say these two needs to be close. I need to minimize the distance between this. And you don't need any label so far."}],"speech_gaps":[],"frame":"../frames/v043/005.webp","frame_time":684.31},{"title":"大语言模型与下一词预测损失","segments":[{"id":64,"text":"Of course, this wouldn't work by itself, because you can see if this is the only objective you have to make these two embeddings close, then you just map everything to the same point. Every image, no matter the augmentations of anything, you just map to the same point, everything becomes close afterwards. So it needs something to counterbalance this thing so that not everything gets mapped to the same point. You need to say something needs to be far away from each other. Otherwise, being close","zh":"当然，仅靠这一点是行不通的，因为你可以看到，如果你只有一个目标要让这两个嵌入接近，那么你只需将所有内容映射到同一个点。无论图像经过什么增强处理，你都只需将其映射到同一个点，之后所有内容都会变得接近。因此，你需要一些东西来抵消这一点，以确保并非所有内容都被映射到同一个点。你需要说明某些内容需要彼此远离。否则，仅仅接近是没有意义的。","start":832.75,"end":858.01},{"id":65,"text":"without a relative measure is meaningless, right? You have to say something is close, something is far, right? So then how do you get something, get the counterbalance? Then what you do is you say you have another image. This is a completely different image. Maybe let's say, what's the notation I use for this? I guess I just don't want to mess up my notation. Oh, I guess I just have another image z, let's say.","zh":"没有相对度量的话，接近是没有意义的，对吧？你必须说明某些内容接近，某些内容远离，对吧？那么，你如何获得这种抵消呢？然后你所做的就是引入另一张图像。这是一张完全不同的图像。也许我们可以用什么符号来表示它？我想我就不想搞乱我的符号了。哦，我想我只需要另一个图像 z，比如说。","start":858.62,"end":886.62},{"id":66,"text":"And z, again here, I'm applying some augmentation just to make it kind of more like a type check in some sense, so that they are in the same augmentation space. Maybe you get z hat, and then you apply this phi theta z hat. Oh, you apply the phi theta, the new artwork, and you get phi theta z hat. And now you say, I'm going to have another part of the objective to try to encourage","zh":"同样地，这里我应用了一些增强处理，以某种意义上进行类型检查，使它们处于相同的增强空间中。也许你会得到 z 帽，然后应用这个 phi theta z 帽。哦，你应用 phi theta，也就是新的艺术作品，得到 phi theta z 帽。现在你可以说，我要在目标中加入另一部分，以鼓励","start":887.82,"end":916.14},{"id":67,"text":"these two be far away. And maybe these two should be far away as well. So basically, if there are augmentations of different images, they should be far away. And if there are augmentations of the same image, they should be close by. That's pretty much the fundamental objectives, the main objectives you want to design. There are many different ways to design objectives to encourage these distances. But this is the main gist. And do you see some issues with this?","zh":"这两个彼此远离。也许这两个也应该彼此远离。基本上，如果对不同图像进行增强处理，它们应该彼此远离；如果对同一图像进行增强处理，它们应该彼此接近。这基本上就是主要的目标，也就是你想要设计的主要目标。有许多不同的方法可以设计目标来鼓励这些距离。但这就是主要的思路。你是否看到这种方法有什么问题？","start":917.32,"end":947.42},{"id":68,"text":"Go ahead. Yeah. Exactly. That's a great question. Right. Exactly. That's exactly what I was trying to ask. So there's one possible issue with this, which is that if X and Z are...","zh":"请说吧。是的。没错。正是如此。这是一个非常好的问题。对的。正是如此。这正是我试图提出的问题。因此，这种方法可能存在一个问题，即如果 X 和 Z 是……","start":947.92,"end":963.13},{"id":69,"text":"maybe as a two-person cat, they are just different positions, or maybe two similar airplanes, but not the same image. So because you don't really know whether they are similar or not, you just take another image. So yes, in that case, your objective here for being far away is counterproductive. So for example, if there are two different airplanes, then you should actually make all of this close to each other. But your objective is trying to make them","zh":"也许就像两只猫，它们只是不同的位置，或者也许像两架相似的飞机，但不是同一张图像。因此，因为你并不真正知道它们是否相似，你只是选择另一张图像。所以在这种情况下，你的目标让它们远离彼此是适得其反的。例如，如果有两架不同的飞机，你实际上应该让所有这些都彼此接近。但你的目标却试图让它们远离彼此。","start":963.49,"end":992.01},{"id":70,"text":"far away. So in those cases, you are being counterproductive. But the answer is, that's fine. Because in most of the cases, x and z are not similar. If you sample two random images from your pool of images,","zh":"在这种情况下，你是在适得其反。但答案是，这没关系。因为在大多数情况下，x 和 z 并不相似。如果你从图像池中随机采样两张图像，","start":992.46,"end":1007.18},{"id":71,"text":"most likely, they are not similar to each other","zh":"很可能它们彼此并不相似","start":1008.36,"end":1010.08},{"id":72,"text":"in any sense.","zh":"在任何意义上。","start":1010.08,"end":1010.74}],"notes":["本段讨论了在设计模型目标时，仅使用使嵌入向量接近的单一目标会导致所有图像被映射到同一个点的问题。因此，需要引入一个反向机制，使不同图像的嵌入向量保持一定距离。这涉及到如何定义‘远’和‘近’的相对度量，以及如何通过引入另一个图像来实现这种反向机制。","讲者提到，为了确保不同图像的嵌入向量保持远距离，可以使用另一个图像z，并对其进行增强处理，使其与原图像处于相同的增强空间。通过应用函数phi(theta, z)，可以生成新的嵌入向量，并在目标函数中引入使这些向量保持远距离的机制。","讲者指出，如果两个图像实际上是相似的（如不同位置的猫或相似的飞机），那么模型的目标函数可能会导致错误的远距离惩罚。然而，讲者认为在大多数情况下，随机选取的两个图像并不相似，因此这种反向机制仍然是有效的。","讲者强调，设计目标函数时需要平衡使相似图像接近和不同图像远离的机制，这是构建有效模型的关键。同时，讲者也提到，如何具体实现这些目标是设计模型时需要考虑的问题。","讲者通过举例说明了模型目标函数可能带来的问题，并指出在实际应用中，这种反向机制在大多数情况下是有效的，因为随机选取的图像通常不相似。"],"formulas":[],"uncertainties":[],"diagram":"none","start":832.75,"end":1010.74,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":832.75,"text":"Of course, this wouldn't work by itself, because you can see if this is the only objective you have to make these two embeddings close, then you just map everything to the same point. Every image, no matter the augmentations of anything, you just map to the same point, everything becomes close afterwards. So it needs something to counterbalance this thing so that not everything gets mapped to the same point. You need to say something needs to be far away from each other. Otherwise, being close"},{"start":858.62,"text":"without a relative measure is meaningless, right? You have to say something is close, something is far, right? So then how do you get something, get the counterbalance? Then what you do is you say you have another image. This is a completely different image. Maybe let's say, what's the notation I use for this? I guess I just don't want to mess up my notation. Oh, I guess I just have another image z, let's say."},{"start":887.82,"text":"And z, again here, I'm applying some augmentation just to make it kind of more like a type check in some sense, so that they are in the same augmentation space. Maybe you get z hat, and then you apply this phi theta z hat. Oh, you apply the phi theta, the new artwork, and you get phi theta z hat. And now you say, I'm going to have another part of the objective to try to encourage"},{"start":917.32,"text":"these two be far away. And maybe these two should be far away as well. So basically, if there are augmentations of different images, they should be far away. And if there are augmentations of the same image, they should be close by. That's pretty much the fundamental objectives, the main objectives you want to design. There are many different ways to design objectives to encourage these distances. But this is the main gist. And do you see some issues with this?"},{"start":947.92,"text":"Go ahead. Yeah. Exactly. That's a great question. Right. Exactly. That's exactly what I was trying to ask. So there's one possible issue with this, which is that if X and Z are..."},{"start":963.49,"text":"maybe as a two-person cat, they are just different positions, or maybe two similar airplanes, but not the same image. So because you don't really know whether they are similar or not, you just take another image. So yes, in that case, your objective here for being far away is counterproductive. So for example, if there are two different airplanes, then you should actually make all of this close to each other. But your objective is trying to make them"},{"start":992.46,"text":"far away. So in those cases, you are being counterproductive. But the answer is, that's fine. Because in most of the cases, x and z are not similar. If you sample two random images from your pool of images,"},{"start":1008.36,"text":"most likely, they are not similar to each other"},{"start":1010.08,"text":"in any sense."}],"speech_gaps":[],"frame":"../frames/v043/006.webp","frame_time":844.75},{"title":"大语言模型与下一词预测损失","segments":[{"id":73,"text":"One of them is the airplane, the other is a chair,","zh":"其中一个是一个飞机，另一个是一个椅子，","start":1011.28,"end":1013.04},{"id":74,"text":"the other is a building.","zh":"另一个是一个建筑物。","start":1013.18,"end":1013.82},{"id":75,"text":"That's most likely the case.","zh":"这很可能就是这种情况。","start":1014.08,"end":1015.44},{"id":76,"text":"With some small chance, they are similar.","zh":"有一些小概率，它们是相似的。","start":1015.64,"end":1017.16},{"id":77,"text":"But you just say those are collateral damage.","zh":"但你只是说这些是附带损害。","start":1017.36,"end":1019.96},{"id":78,"text":"You have to deal with that.","zh":"你必须处理这种情况。","start":1020.08,"end":1022.06},{"id":79,"text":"So basically, by and large, this is the right objective.","zh":"基本上，总的来说，这就是正确的目标。","start":1022.24,"end":1025.74},{"id":80,"text":"And it turns out that the benefit of this objective,","zh":"结果发现，这个目标的好处，","start":1026.02,"end":1029.8},{"id":81,"text":"trying to make them far away, overrides the damage it makes.","zh":"试图让它们远离，会覆盖它所造成的损害。","start":1030.1,"end":1033.92},{"id":82,"text":"So that's pretty much the answer to this.","zh":"所以这基本上就是这个问题的答案。","start":1035.52,"end":1038.36},{"id":83,"text":"How would you learn eventually that cats are closer to dogs than airplanes are to dogs?","zh":"你最终是如何学习到猫比飞机更接近狗的？","start":1041.36,"end":1046.26},{"id":84,"text":"How would you eventually learn this?","zh":"你最终是如何学会这一点的？","start":1047.12,"end":1048.92},{"id":85,"text":"Even if you said x and z, you want to learn that x and z might be more similar to each other than x and y.","zh":"即使你说x和z，你也想学习到x和z可能比x和y更相似。","start":1049.36,"end":1056.42},{"id":86,"text":"So how does the model pull off that?","zh":"那么模型是如何做到这一点的？","start":1057.16,"end":1060.64},{"id":87,"text":"So, I think, you know, this is, you know, I think there's some interpretation of your answer is a question is required some deep mathematical study, which, you know, I was, I wrote some papers on this, but maybe let me try to clarify your question.","zh":"我认为，你知道，这个问题的答案可能需要一些深层次的数学研究，你知道的，我写过一些关于这个的论文，但也许让我试着澄清你的问题。","start":1062.22,"end":1078.94},{"id":88,"text":"So, so you are trying to ask how, what makes, you know, so why is surprising for you?","zh":"所以，你是在问，什么使得你感到惊讶？","start":1079.06,"end":1087.12},{"id":89,"text":"like maybe that's the question that's my question back to you like like in one sense it's not except","zh":"比如，也许这就是我问你的问题，就像在某种意义上它并不是，除了","start":1087.12,"end":1091.8},{"id":90,"text":"No, it's kind of a follow-up from someone else's question. It's like the chance that we said we have X and Z and that they are more similar to each other. Just like how do we, at this moment that we have here, how do we make sure that we can somehow represent that dogs and cats are similar to each other? We're more similar to each other than, say, dogs and airplanes.","zh":"不，这是对别人问题的一个后续提问。就像我们说过我们有X和Z，它们彼此更相似。就像我们现在所处的这一刻，我们如何确保能够以某种方式表示狗和猫是相似的？我们彼此之间比狗和飞机更相似。","start":1094.14,"end":1114.86},{"id":91,"text":"I think, you know, okay, let me try to give you a simpler answer. And then if I'm not happy with it, I can tell you a deeper answer. So this objective, you try to make these two close, right? You want this to be close by. You want these two embeddings to be close. That's kind of like how you make sure similar things are closer to each other, right? But then you try to deal with the...","zh":"我想，你知道，让我试着给你一个更简单的答案。如果我不满意，我可以告诉你一个更深入的答案。所以这个目标，你试图让这两者接近，对吧？你希望这两者之间的距离近。这有点像如何确保相似的事物彼此更接近，对吧？但然后你试图处理……","start":1116.82,"end":1141.67},{"id":92,"text":"the degenerate situation where everything is closed and then you try to make random things far away from each other. So then the only way that you can enable this is that the similar things are close to each other and the different things are far away from each other. Oh no, I don't think that's, at least that's not my goal at this moment. I think that you can","zh":"那种退化的状况，即所有事物都彼此接近，然后你试图让随机的事物彼此远离。因此，你唯一能实现这一点的方式是相似的事物彼此接近，而不同的事物彼此远离。哦不，我不认为这是，至少这不是我此刻的目标。我想你能够","start":1143.8,"end":1173.23}],"notes":["本段讨论了大语言模型如何学习不同实体之间的相似性，例如猫和狗比猫和飞机更相似。讲者指出，模型需要通过某种机制来确保相似实体在嵌入空间中更接近，而不同实体则更远。这涉及到模型如何在训练过程中学习这种关系，以及如何避免所有实体都过于接近的退化情况。","讲者提到，虽然目标是让相似实体接近，但同时也要让不相关的实体远离，这需要模型在训练过程中平衡这两种目标。这种平衡可能通过损失函数的设计来实现，例如下一词预测损失，它鼓励模型在预测下一个词时考虑上下文中的语义关系。","讲者还提到，这种学习过程可能需要深入的数学研究，例如通过分析嵌入空间的结构和损失函数的优化过程。这可能涉及到对模型如何表示语义相似性以及如何通过梯度下降等优化方法来调整嵌入向量的探讨。","讲者指出，模型需要在训练过程中处理退化情况，即所有实体都过于接近的问题。这可能涉及到对损失函数的调整，例如引入正则化项或使用更复杂的损失函数来确保不同实体之间的距离。","讲者提到，模型如何确保相似实体在嵌入空间中更接近，这可能涉及到对嵌入向量的优化，例如通过梯度下降来调整嵌入向量，使其在语义上更接近。这可能涉及到对损失函数的梯度计算和优化过程的分析。","讲者最后提到，这种学习过程可能需要更深入的数学研究，例如对嵌入空间的结构和损失函数的优化方法进行分析。这可能涉及到对模型如何表示语义相似性以及如何通过梯度下降等优化方法来调整嵌入向量的探讨。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1011.28,"end":1173.23,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":1011.28,"text":"One of them is the airplane, the other is a chair,"},{"start":1013.18,"text":"the other is a building."},{"start":1014.08,"text":"That's most likely the case."},{"start":1015.64,"text":"With some small chance, they are similar."},{"start":1017.36,"text":"But you just say those are collateral damage."},{"start":1020.08,"text":"You have to deal with that."},{"start":1022.24,"text":"So basically, by and large, this is the right objective."},{"start":1026.02,"text":"And it turns out that the benefit of this objective,"},{"start":1030.1,"text":"trying to make them far away, overrides the damage it makes."},{"start":1035.52,"text":"So that's pretty much the answer to this."},{"start":1041.36,"text":"How would you learn eventually that cats are closer to dogs than airplanes are to dogs?"},{"start":1047.12,"text":"How you are eventually learn this?"},{"start":1049.36,"text":"Even if you said x and z, you want to learn that x and z might be more similar to each other than x and y."},{"start":1057.16,"text":"So how does the model pull off that?"},{"start":1062.22,"text":"So, I think, you know, this is, you know, I think there's some interpretation of your answer is a question is required some deep mathematical study, which, you know, I was, I wrote some papers on this, but maybe let me try to clarify your question."},{"start":1079.06,"text":"So, so you are trying to ask how, what makes, you know, so why is surprising for you?"},{"start":1087.12,"text":"like maybe that's the question that's my question back to you like like in one sense it's not except"},{"start":1094.14,"text":"No, it's kind of a follow-up from someone else's question. It's like the chance that we said we have X and Z and that they are more similar to each other. Just like how do we, at this moment that we have here, how do we make sure that we can somehow represent that dogs and cats are similar to each other? We're more similar to each other than, say, dogs and airplanes."},{"start":1116.82,"text":"I think, you know, okay, let me try to give you a simpler answer. And then if I'm not happy with it, I can tell you a deeper answer. So this objective, you try to make these two close, right? You want this to be close by. You want these two embeddings to be close. That's kind of like how you make sure similar things are closer to each other, right? But then you try to deal with the..."},{"start":1143.8,"text":"the degenerate situation where everything is closed and then you try to make random things far away from each other. So then the only way that you can enable this is that the similar things are close to each other and the different things are far away from each other. Oh no, I don't think that's, at least that's not my goal at this moment. I think that you can"}],"speech_gaps":[],"frame":"../frames/v043/007.webp","frame_time":1023.28},{"title":"大语言模型与下一词预测损失","segments":[{"id":93,"text":"Yeah, so I think for simplicity, let's just say you want cat. You don't really care about cat is further closer to dog than airplane is to dog. Cat and dog and airplane are just three different type of things. They're all considered to be far away from each other. You just want different type of cats to be similar to each other. And actually, even if you really look into the data, the closest...","zh":"是的，所以为了简单起见，让我们说你想要猫。你其实并不关心猫离狗有多远，或者飞机离狗有多远。猫、狗和飞机只是三种不同类型的事物。它们都被认为彼此相距很远。你只需要不同类型猫之间相似。事实上，即使你仔细查看数据，最近的……","start":1176.93,"end":1198.29},{"id":94,"text":"Suppose you have one cat. I don't know what other breeds of cats. So basically, all the nearby points are actually even cats from the same breed. So even cats from different breeds are still quite far away from each other. Of course, eventually, I think the points will be organized in some somewhat hierarchical way. But that's kind of more like a secondary effect. The first other bit is just that.","zh":"假设你有一只猫。我不知道还有哪些其他品种的猫。基本上，所有附近的点实际上都是同一种品种的猫。即使不同品种的猫，彼此之间仍然相距很远。当然，最终，我认为这些点会以某种层次结构的方式组织起来。但这更像是一个次要效果。首要的另一点就是这个。","start":1199.02,"end":1226.6},{"id":95,"text":"maybe cast with the same breed of close to each other like you don't even care about other things everything kind of spaces out equally like like if i have a plane yeah all of them would be like vectors that just like space around around the circle because you keep adding more i didn't get it if if everything is just like everything you want it to be equally far away is that what you're saying no no no no","zh":"也许同一种品种的猫彼此靠近，你甚至不关心其他事情，所有东西都差不多等距分布，比如如果我有一个飞机，是的，所有飞机都会像围绕圆圈的向量一样分布，因为你不断添加更多，我没明白，如果一切东西都彼此等距，这就是你在说的吗？不，不，不，不","start":1227.91,"end":1257.04},{"id":96,"text":"No, I want the similar things to be close to each other and different things to be far away from each other. Okay. That's that. Yeah. Right. So I'm not sure whether maybe this is a bad format. So I think maybe let me see whether I can find quickly. How do I do this? So somehow last time.","zh":"不，我想要相似的东西彼此靠近，不同的东西彼此远离。好的。就是这样。是的。对的。我不确定这是否是一个糟糕的格式。所以我想也许我可以快速找到。我该如何做到这一点？所以某种方式上，上次。","start":1257.92,"end":1289.02},{"id":97,"text":"So maybe one thing that let's try to clarify is that there is a fundamental goal here and there's also approach.","zh":"所以也许有一件事我们可以尝试澄清，那就是这里有一个根本的目标，还有一个方法。","start":1294.13,"end":1300.49},{"id":98,"text":"So there's a desiderata, which is that you want similar images","zh":"有一个期望，即你想要相似的图像","start":1302.78,"end":1305.2},{"id":99,"text":"to be close to each other and different images","zh":"彼此靠近，而不同的图像","start":1305.2,"end":1308.72},{"id":100,"text":"to be far away from each other.","zh":"彼此远离。","start":1308.72,"end":1309.82},{"id":101,"text":"That doesn't mean that you put everything just randomly there.","zh":"这并不意味着你可以把所有东西随意地放在一起。","start":1310.08,"end":1312.8},{"id":102,"text":"If you put everything map to random points,","zh":"如果你把所有东西都映射到随机点上，","start":1312.92,"end":1315.96},{"id":103,"text":"it wouldn't satisfy this at all.","zh":"那就根本无法满足这一点。","start":1316.12,"end":1317.2},{"id":104,"text":"So you do have to organize everything","zh":"因此，你必须以一种非常、非常漂亮的方式组织所有东西。","start":1317.76,"end":1319.54},{"id":105,"text":"in a very, very nice way.","zh":"这样，当你有一个飞机时，那个点","start":1319.54,"end":1320.6},{"id":106,"text":"So that if you have an airplane, that point","zh":"会靠近其他飞机。","start":1321.7,"end":1324.02},{"id":107,"text":"is close to other airplanes.","zh":"并且它靠近，但与其他猫却非常远。","start":1324.02,"end":1325.46},{"id":108,"text":"And it's close, but it's very far away from other cats.","zh":"而且它很接近，但与其他猫相距甚远。","start":1326.38,"end":1329.18},{"id":109,"text":"So that's clear.","zh":"所以这就很清楚了。","start":1329.54,"end":1331.38},{"id":110,"text":"Okay, and then and you're asking about approach, right? Okay. So so what's the question about approach?","zh":"好的，然后你是在问方法，对吧？好的。那么问题到底是什么关于方法的？","start":1331.38,"end":1337.7},{"id":111,"text":"Over there why here? Okay. Yeah","zh":"那边为什么在这里？好的。是的","start":1341.54,"end":1344.52},{"id":112,"text":"Yes","zh":"是的","start":1345.4,"end":1345.88}],"notes":["本段讨论了在机器学习中，特别是大语言模型中，如何组织数据以使相似的事物彼此接近，而不同的事物彼此远离。讲者提到，虽然可以将所有点随机放置，但这无法满足相似性要求，因此需要一种更有序的组织方式。"],"formulas":[],"uncertainties":["cast with the same breed of close to each other like you don't even care about other things ，","start":1427.69,"end":1429.39},{"id":135,"text":"it's so easy in some sense.","zh":"在某种意义上来说，这是很容易的。","start":1429.39,"end":1431.09},{"id":136,"text":"But you just say, I don't care because.","zh":"但你说，我不在乎，因为。","start":1431.77,"end":1433.51},{"id":137,"text":"But in some sense, eventually, what happens","zh":"但从某种意义上说，最终会发生的事情是","start":1434.55,"end":1436.75},{"id":138,"text":"is that you want the phi of y to be also.","zh":"你希望 phi(y) 也是这样。","start":1436.75,"end":1440.75},{"id":139,"text":"So let's say y is a different cat.","zh":"比如说，y 是一只不同的猫。","start":1442.91,"end":1444.47},{"id":140,"text":"So you want phi of y to be far away from this.","zh":"因此你希望 phi(y) 与这个保持距离。","start":1444.69,"end":1446.85},{"id":141,"text":"You want it to be far.","zh":"你希望它远离。","start":1446.93,"end":1447.97},{"id":142,"text":"But you didn't achieve it when you optimize it.","zh":"但你在优化时没有实现这一点。","start":1448.41,"end":1450.67},{"id":143,"text":"So it's in a loss function.","zh":"因此它体现在损失函数中。","start":1451.13,"end":1452.43},{"id":144,"text":"It's trying to damage your goal.","zh":"它在损害你的目标。","start":1452.57,"end":1456.13},{"id":145,"text":"No, but it wouldn't succeed because there are other things","zh":"不，但不会成功，因为还有其他东西在帮助你。","start":1456.13,"end":1462.69},{"id":146,"text":"that are trying to help you.","zh":"这是一些试图帮助你的事情。","start":1462.69,"end":1463.59},{"id":147,"text":"Do you believe also that there's a lot of labels protecting?","zh":"你也相信有很多标签在保护吗？","start":1465.13,"end":1469.55},{"id":148,"text":"This is another thing where you have just images","zh":"这是另一个情况，你只有猫和大象的图片","start":1471.03,"end":1473.63},{"id":149,"text":"of cats and elephants, because of this assumption","zh":"这是因为这个假设","start":1473.63,"end":1477.13},{"id":150,"text":"of the chances of getting an X and a Y that are both a cat","zh":"获取一个既是猫又是狗的X和Y的可能性","start":1477.13,"end":1480.85},{"id":151,"text":"and a dog is not true at all.","zh":"根本就不是真的。","start":1480.85,"end":1483.81},{"id":152,"text":"If you don't have  to be close","zh":"以鼓励一些配对之间的距离接近","start":1573.22,"end":1575.64},{"id":179,"text":"and some of the pairs to be far away.","zh":"而另一些配对之间的距离远离。","start":1575.64,"end":1577.02},{"id":180,"text":"So that's the next step.","zh":"这就是下一步。","start":1577.48,"end":1579.52},{"id":181,"text":"And the objective here is like this.","zh":"在这里的目标是这样的。","start":1580.36,"end":1584.18},{"id":182,"text":"So what it does is the following.","zh":"它所做的如下。","start":1586.84,"end":1588.8},{"id":183,"text":"So I think it's called SimClear.","zh":"所以我认为它被称为 SimClear。","start":1590.22,"end":1593.14},{"id":184,"text":"So it takes a batch of images.","zh":"所以它会处理一批图像。","start":1595.86,"end":1598.1},{"id":185,"text":"There's some kind of efficiency perspective,","zh":"从某种效率的角度来看，","start":1598.4,"end":1600.6},{"id":186,"text":"perspective, in some sense, as you will see,","zh":"在某种意义上，你会看到，","start":1600.6,"end":1602.48},{"id":187,"text":"so that the loss function is probably not a cleanest,","zh":"所以损失函数可能并不是最清晰的，","start":1602.6,"end":1605.1},{"id":188,"text":"simple way to express this philosophy or this kind","zh":"简单的方式来表达这种哲学或这种类型","start":1605.94,"end":1611.24},{"id":189,"text":"of goal, in some sense.","zh":"的目标，从某种意义上来说。","start":1611.24,"end":1613.5},{"id":190,"text":"But from some efficiency perspective,","zh":"但从某种效率的角度来看，","start":1613.66,"end":1616.06},{"id":191,"text":"you always do this.","zh":"你总是这样做。","start":1616.4,"end":1617.42},{"id":192,"text":"So you first sample a batch of images.","zh":"所以你首先采样一批图像。","start":1617.58,"end":1619.34},{"id":193,"text":"This is random images.","zh":"这些是随机的图像。","start":1619.98,"end":1621.4},{"id":194,"text":"There are some cats, there are some dogs, so on and so forth.","zh":"其中有猫，也有狗，等等。","start":1624.78,"end":1626.86},{"id":195,"text":"And then you say, you build, you augment, so you augment into two type of images, right?","zh":"然后你说，你构建，你增强，所以你增强成两种类型的图像，对吧？","start":1626.86,"end":1638.58},{"id":196,"text":"and you also do the second copy, and I'm organizing it as indexes, indices of a matrix.","zh":"你同时也做第二个副本，并且我将其组织为矩阵的索引。","start":1638.62,"end":1648.08},{"id":197,"text":"and I'm organizing it as indexes, indices of a matrix.","zh":"并且我将其组织为矩阵的索引。","start":1648.16,"end":1652.24},{"id":198,"text":"So basically I have this 2B example.","zh":"所以基本上我有这2B个例子。","start":1653.8,"end":1655.32},{"id":199,"text":"x hat 1 and x tilde 1 are the augmentations of the first image. x hat 2 and x tilde 2 is the augmentation of the second image, so on and so forth. And now I want to build some kind of like a matrix. If you really think about it, what you really want is that you want this. Suppose this matrix is capturing the similarity. You want here to be big because you want a similarity between this.","zh":"x hat 1 和 x tilde 1 是第一张图像的增强版本。x hat 2 和 x tilde 2 是第二张图像的增强版本，依此类推。现在我想构建某种矩阵。如果你仔细想想，你真正想要的是这个。假设这个矩阵在捕捉相似性。你希望这里（对应同一张图像的增强版本）的值较大，因为你希望它们之间有相似性。","start":1657.92,"end":1687.46},{"id":200,"text":"augmentation of the same image to be big. And you want augmentation of this and you want","zh":"你希望同一张图像的增强版本之间的相似性较大。你希望这个（对应不同图像的增强版本）的值较大，","start":1687.92,"end":1693.66},{"id":201,"text":"this entry to be big because these two are both augmentations of the second image.","zh":"因为这两个都是第二张图像的增强版本。","start":1693.66,"end":1698.18},{"id":202,"text":"Maybe these two are two different cats and then you want the two cats to be similar.","zh":"也许这两个是两只不同的猫，你希望这两只猫相似。","start":1704.26,"end":1708.7},{"id":203,"text":"And these two are two different airplanes, you want them similar. And in any of the other off","zh":"而这两个是两架不同的飞机，你希望它们相似。在任何其他情况下，","start":1708.84,"end":1713.48}],"notes":["本段具体说明了如何通过构建矩阵来捕捉图像之间的相似性。讲者提到，对于每张图像，都会生成两个增强版本，分别作为矩阵中的行。矩阵的每个元素代表两个增强图像之间的相似性。讲者强调，对于同一张图像的两个增强版本，相似性应较大，而对于不同图像的增强版本，如果它们属于同一类别（如两只猫或两架飞机），相似性也应较大，而不同类别的图像则应保持较远的距离。"],"formulas":[],"uncertainties":["augmentation of this and you want"],"diagram":"none","start":1537.13,"end":1713.48,"asr_flags":[198],"boards":[],"translation_comple ges, right?"},{"start":1638.62,"text":"First the hat, the first copy for each of them, and then on the, and you also do the second copy,"},{"start":1648.16,"text":"and I'm organizing it as indexes, indices of a matrix."},{"start":1653.8,"text":"So basically I have this 2B example."},{"start":1657.92,"text":"x hat 1 and x tilde 1 are the augmentations of the first image. x hat 2 and x tilde 2 is the augmentation of the second image, so on and so forth. And now I want to build some kind of like a matrix. If you really think about it, what you really want is that you want this. Suppose this matrix is capturing the similarity. You want here to be big because you want a similarity between this."},{"start":1687.92,"text":"augmentation of the same image to be big. And you want augmentation of this and you want"},{"start":1693.66,"text":"this entry to be big because these two are both augmentations of the second image."},{"start":1704.26,"text":"Maybe these two are two different cats and then you want the two cats to be similar."},{"start":1708.84,"text":"And these two are two different airplanes, you want them similar. And in any of the other off"}],"speech_gaps":[{"start":1540.29,"end":1541.94}],"frame":"../frames/v043/010.webp","frame_time":1549.13},{"title":"相似性度量与损失函数设计","segments":[{"id":204,"text":"diagonal entries, you don't want them to be similar, right? So maybe this","zh":"对角线元素，你不希望它们相似，对吧？所以也许这个","start":1713.48,"end":1717.8},{"id":205,"text":"entry is a cat versus an airplane, you want it to be as small as possible. So","zh":"元素是猫与飞机的对比，你希望它尽可能小。所以","start":1717.8,"end":1722.9},{"id":206,"text":"basically what you do is you say, and you measure the similarity, so the","zh":"基本上你所做的就是你说出并测量相似性，因此","start":1722.9,"end":1727.92},{"id":207,"text":"similarity will just be between two images. It's just like you take the,","zh":"相似性仅仅是在两张图像之间。它就像你取的，","start":1727.92,"end":1738.6},{"id":208,"text":"suppose you have similarity between X and Z, you just say the similarity is","zh":"假设你有X和Z之间的相似性，你只需说相似性是","start":1739.5,"end":1743.18},{"id":209,"text":"is the inner product of the embeddings.","zh":"嵌入向量的内积。","start":1743.18,"end":1745.98},{"id":210,"text":"And often, you normalize the embeddings,","zh":"通常，你会对嵌入向量进行归一化，","start":1750.02,"end":1751.78},{"id":211,"text":"which makes the inner product the same as the cosine","zh":"这使得内积等同于余弦相似度","start":1751.88,"end":1755.3},{"id":212,"text":"similarity.","zh":"相似性。","start":1755.3,"end":1755.62},{"id":213,"text":"So the similarity between x and z are just the inner product.","zh":"因此，x 和 z 之间的相似性仅仅是它们的内积。","start":1756.48,"end":1760.78},{"id":214,"text":"And if you translate here, this entry","zh":"如果你在这里进行翻译，这个条目","start":1761.14,"end":1763.64},{"id":215,"text":"will just be the inner product between x hat 1","zh":"将仅仅是 x hat 1 与 x tilde 1 之间的内积。","start":1763.64,"end":1770.54},{"id":216,"text":"1 and x tilde 1.","zh":"1 和 x 带波浪线的 1。","start":1770.54,"end":1774.52},{"id":217,"text":"And the same thing here, that this entry","zh":"是这两个嵌入向量之间的内积。","start":1776.34,"end":1778.66},{"id":218,"text":"is the inner product between the embeddings here","zh":"以及这两个嵌入向量之间的内积。","start":1778.66,"end":1781.0},{"id":219,"text":"and the embeddings here.","zh":"以及这里的嵌入。","start":1781.0,"end":1781.76},{"id":220,"text":"And basically, for every i, j entry,","zh":"基本上，对于每一个i, j项，","start":1784.18,"end":1786.86},{"id":221,"text":"you see the inner product is just the phi of x hat i","zh":"你看到的是内积，它仅仅是x hat i的phi函数","start":1788.38,"end":1791.86},{"id":222,"text":"and the phi of x tilde j.","zh":"和x tilde j的phi函数。","start":1792.52,"end":1794.94},{"id":223,"text":"So in some sense, you fill in the entries here","zh":"从某种意义上说，你在这里填充这些项","start":1795.94,"end":1798.84},{"id":224,"text":"into this matrix, and you want this matrix to have a diagnose to be big and off-diagnose to be small.","zh":"到这个矩阵中，你希望这个矩阵的对角线项很大，而非对角线项很小。","start":1798.84,"end":1805.28},{"id":225,"text":"I'm not doing really anything de o be small."},{"start":1806.22,"text":"I'm not doing really anything deep. It's just I'm translating it into a slightly different language. But how big is big and how small is small, I still haven't specified. So the way to exactly say what is big and what is small in this matrix is the following. So you look at it row by row, let's say. So for each row, you want the"},{"start":1834.43,"text":"the diagonal term to be big, and the off-diagonal term to be small. And the loss function you use for each row, let's say, should I call it row i, the loss is minus log. You take the exponential of, let me see whether I'm making some small type. I think let me use for every column."}],"speech_gaps":[{"start":1746.464,"end":1748.176}],"frame":"../frames/v043/011.webp","frame_time":1725.48},{"title":"大语言模型与下一词预测损失","segments":[{"id":227,"text":"It doesn't really matter. It's just the notation thing. Let's say for every column, you look at one column, you want the diagonal term to be big. So for every column, you take this. This is hat i transpose. I guess maybe I should write transpose here. Transpose phi j. Sorry, this is i. Let me write it down, and I will interpret. This is the same term as.","zh":"其实这并不重要。这只是符号的问题。比如说，对于每一列，你查看某一列，你希望对角线项很大。因此，对于每一列，你取这个。这是i的转置。我想我应该在这里写上转置。转置的phi j。抱歉，这是i。让我把它写下来，然后我来解释。这和前面的项是一样的。","start":1880.14,"end":1921.39},{"id":228,"text":"And then you have, OK, so this is a little bit complicated. But what is this term? This is really, suppose you call this matrix, let's just say temporarily, let's call this matrix i's. Each entry is i's i j, similarity i's i j. So this is exponential i's i i. This is the i times i, right? So this is the i's entry, so maybe this entry.","zh":"然后你有，好的，这有点复杂。但这个项是什么？这实际上是，假设你称这个矩阵为i的矩阵，暂时这么称呼，每个元素是i的i j，相似度i的i j。因此，这是指数i的i i。这是i乘以i，对吧？因此，这是i的项，所以也许这个项。","start":1922.44,"end":1964.34},{"id":229,"text":"Right? And this is the same thing, exponential ssi. And if you think about this, so this term, this function is decreasing in this term. So if this term is big, I think the function is small. You are minimizing the function. This is a loss function.","zh":"对吧？这和指数ssi是一样的。如果你仔细想想，这个项，这个函数在这个项上是递减的。因此，如果这个项很大，我想这个函数会很小。你是在最小化这个函数。这是一个损失函数。","start":1967.49,"end":1984.29},{"id":230,"text":"So let's check that. So I think without this log and this, I think this is an increasing function in the SII. If SII is bigger, I think you can verify this increasing function. And then when you have a log, it's still increasing. And when you have negative, it's decreasing. So basically, this loss function is trying to make this term bigger. OK, so and am I right? I think I'm, yes. OK, and now for these terms.","zh":"所以让我们检查一下。我认为没有这个对数和这个负号的情况下，这个函数在SII上是递增的。如果SII更大，我认为你可以验证这个递增函数。然后当你有对数时，它仍然是递增的。当你有负号时，它就是递减的。因此，基本上，这个损失函数试图让这个项变大。好的，那么我是不是对的？我想我是对的。好的，现在对于这些项。","start":1986.56,"end":2020.8},{"id":231,"text":"It's in the reverse direction. So OK, so first I see what are these terms. These are the i's, i, j, right? Because this is j and this is i. So basically, these are all of these off diagonal entries here. And you have a sum of the exponential of them. And you want, if you check the monotonicity, you want these terms to be small so that the whole loss function is small.","zh":"这是相反的方向。所以，首先我看看这些项是什么。这些是i的i j，对吧？因为这里是j，这里是i。因此，这些是所有这些非对角线项。你有一个它们的指数之和。你希望，如果你检查单调性，这些项要小，这样整个损失函数才会小。","start":2021.39,"end":2043.42}],"notes":["本段讨论了大语言模型中下一词预测损失函数的设计，重点在于如何通过调整矩阵中的项来最小化损失函数。讲者提到，对于每个列，希望对角线项较大，而其他非对角线项则希望较小，以使整体损失函数更小。","讲者解释了损失函数的结构，其中包含指数项和对数项。他指出，当指数项较大时，函数值会减小，因此损失函数的目标是使这些项尽可能大。然而，对于非对角线项，由于它们的指数项被求和，因此希望这些项尽可能小，以减少整体损失。","讲者进一步说明了损失函数的单调性。他指出，当没有对数和负号时，函数是随着指数项的增大而增加的；当加入对数后，函数仍然保持单调递增；而加入负号后，函数变为单调递减。因此，损失函数的设计旨在使某些项尽可能大，而其他项尽可能小。","讲者提到，对于非对角线项，它们的指数项被求和，因此希望这些项尽可能小，以使整体损失函数更小。这表明损失函数的设计需要在不同项之间进行权衡，以达到最小化损失的目标。","讲者通过举例说明了损失函数的结构和行为，强调了指数项和对数项在损失函数中的作用。他指出，损失函数的设计需要考虑这些项的单调性，以确保模型能够正确地进行预测。","讲者最后确认了自己对损失函数的理解是正确的，并指出需要进一步分析这些项的行为，以确保模型的性能。"],"formulas":[],"uncertainties":["hat i transpose","exponential ssi","SII"],"diagram":"none","start":1880.14,"end":2043.42,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1880.14,"text":"It doesn't really matter. It's just the notation thing. Let's say for every column, you look at one column, you want the diagonal term to be big. So for every column, you take this. This is hat i transpose. I guess maybe I should write transpose here. Transpose phi j. Sorry, this is i. Let me write it down, and I will interpret. This is the same term as."},{"start":1922.44,"text":"And then you have, OK, so this is a little bit complicated. But what is this term? This is really, suppose you call this matrix, let's just say temporarily, let's call this matrix i's. Each entry is i's i j, similarity i's i j. So this is exponential i's i i. This is the i times i, right? So this is the i's entry, so maybe this entry."},{"start":1967.49,"text":"Right? And this is the same thing, exponential ssi. And if you think about this, so this term, this function is decreasing in this term. So if this term is big, I think the function is small. You are minimizing the function. This is a loss function."},{"start":1986.56,"text":"So let's check that. So I think without this log and this, I think this is an increasing function in the SII. If SII is bigger, I think you can verify this increasing function. And then when you have a log, it's still increasing. And when you have negative, it's decreasing. So basically, this loss function is trying to make this term bigger. OK, so and am I right? I think I'm, yes. OK, and now for these terms."},{"start":2021.39,"text":"It's in the reverse direction. So OK, so first I see what are these terms. These are the i's, i, j, right? Because this is j and this is i. So basically, these are all of these off diagonal entries here. And you have a sum of the exponential of them. And you want, if you check the monotonicity, you want these terms to be small so that
