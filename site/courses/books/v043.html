etween x height i which is the augmentation of the same image versus all the x height","zh":"这是我的正确配对，因此这是一个分类问题。在某种意义上，你只是在做多类分类，你试图将我的配对与所有其他图像的增强配对进行分类。因此，这实际上是一个分类问题，你是在将x的tilde i（即同一张图像的增强）与所有x的tilde j进行分类。","start":2110.09,"end":2138.35},{"id":236,"text":"So x tilde i and x tilde j. And your log j's, the input to this classification is this similarity number. And you're doing a softmax. This is just a literal softmax. And you take a log, which is the standard kind of like cross entropy loss for this kind of multi-class classification problem. So I think that's it.","zh":"因此，x tilde i和x tilde j。你输入到这个分类中的相似度数值。你进行的是一个softmax操作。这只是一个字面意义上的softmax。你取一个对数，这就像标准的交叉熵损失函数，用于这种多类分类问题。我认为这就是全部。","start":2139.66,"end":2165.1},{"id":237,"text":"In some sense, that's originally how they come up with this objective. And one small thing here is that this is for column i. And you have to sum over all the i's. So for each i, you are doing this classification problem. You are trying to classify which one is my friend, which one is from a different image. And you do this for all the columns. You sum them up. And that's your loss for this batch of examples. So for each batch, you have a loss, which is the sum over all of these i's.","zh":"从某种意义上说，这就是他们最初提出这个目标函数的方式。这里还有一个小细节，就是这是针对第i列而言的。你需要对所有的i进行求和。因此，对于每个i，你都在执行一个分类任务。你试图区分哪些是朋友，哪些来自不同的图像。你对所有列都这样做，然后将它们相加。这就是这一批示例的损失。因此，对于每个批次，你都有一个损失，它是对所有这些i的求和。","start":2165.69,"end":2194.85}],"notes":["本段主要讨论损失函数的结构及其与分类任务的关系。讲者指出，损失函数中的项如果较小，整体结果会更大，因为这些项在分母中，而对数和负号会影响整体的大小。因此，损失函数鼓励sii较大而sij较小，同时强调sii与sij之间的比较是通过log-sum exponential的方式进行的。","讲者提到，虽然数学表达式看起来复杂，但其核心思想是区分同一图像的增强版本与其他图像的增强版本。这类似于多类分类任务，其中输入是相似性分数，输出是通过softmax进行分类。","在分类任务中，输入是相似性分数，输出是通过softmax进行分类。损失函数是标准的交叉熵损失，用于多类分类问题。","损失函数的计算需要对所有列i进行求和，每个i对应一个分类任务。最终的损失是该批次所有i的损失之和。","讲者强调，这种损失函数的设计来源于对同一图像增强版本的区分任务，其核心思想是通过分类任务来实现对增强图像的识别。","整个过程涉及对相似性分数的处理、softmax分类以及损失函数的构建，最终目标是通过分类任务来区分同一图像的增强版本与其他图像的增强版本。"],"formulas":[{"latex":"L = -\\log\\left(\\frac{\\exp(s_{ii})}{\\sum_j \\exp(s_{ij})}\\right)","symbols":"损失函数L由对数和softmax组成，其中s_{ii}和s_{ij}是相似性分数","explanation":"公式正确，使用了softmax函数和对数损失，符合多分类任务的损失函数形式。","evidence":"And if these terms are small, the whole thing is bigger, like the division. Because these are in a denominator, so this thing is bigger. And with the log, it's still bigger. And with the minus, it's smaller. So if this term is smaller, then the whole thing is smaller. So basically, you are encouraging sii to be big and sij to be small. And also, the comparison between them is in this log-sum exponential sense. So basically, you want them to be, in some sense, you want sii to be comparably bigger than sij, in some sense. So x tilde i and x tilde j. And your log j's, the input to this classification is this similarity number. And you're doing a softmax. This is just a literal softmax. And you take a log, which is the standard kind of like cross entropy loss for this kind of multi-class classification problem. So I think that's it."}],"uncertainties":["x height i 和 x height j 的具体含义可能不明确","log j's 的具体含义可能不明确"],"diagram":"none","start":2043.91,"end":2194.85,"asr_flags":[],"math_clarifications":["公式中的s_{ii}和s_{ij}表示相似性分数，其中s_{ii}是同一图像的增强版本之间的相似性，s_{ij}是不同图像的增强版本之间的相似性。公式中的分母是所有j的指数和，分子是特定i的指数，符合softmax的定义。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2043.91,"text":"And if these terms are small, the whole thing is bigger, like the division. Because these are in a denominator, so this thing is bigger. And with the log, it's still bigger. And with the minus, it's smaller. So if this term is smaller, then the whole thing is smaller. So basically, you are encouraging sii to be big and sij to be small. And also, the comparison between them is in this log-sum exponential sense. So basically, you want them to be, in some sense, you want sii to be comparably bigger than sij, in some sense."},{"start":2074.98,"text":"So from this, it sounds a little complicated because you have so many maths. But eventually, what does this really mean is that you are trying to, at least my interpretation here is that you are trying to distinguish"},{"start":2090.18,"text":"So another interpretation is that you are trying to distinguish between which one is the augmentation of the same image. So in some sense, what he's trying to do here is that if I give my x height i, the first copy of the augmentation for i's image, I want to know which of this x tilde is"},{"start":2110.09,"text":"is my pair right so so this is a classification in some sense you are just really doing a this is the same as a multi-class classification where you are trying to classify between my pair versus all the other the pair augmentations of the other images so this is really classification you are classifying between x height i which is the augmentation of the same image versus all the x height"},{"start":2139.66,"text":"So x tilde i and x tilde j. And your log j's, the input to this classification is this similarity number. And you're doing a softmax. This is just a literal softmax. And you take a log, which is the standard kind of like cross entropy loss for this kind of multi-class classification problem. So I think that's it."},{"start":2165.69,"text":"In some sense, that's originally how they come up with this objective. And one small thing here is that this is for column i. And you have to sum over all the i's. So for each i, you are doing this classification problem. You are trying to classify which one is my friend, which one is from a different image. And you do this for all the columns. You sum them up. And that's your loss for this batch of examples. So for each batch, you have a loss, which is the sum over all of these i's."}],"speech_gaps":[],"frame":"../frames/v043/013.webp","frame_time":2055.91},{"title":"下一词预测损失与负样本比例","segments":[{"id":238,"text":"Maybe let me pause here. This is a little bit complicated. Yep. Yep. You are minimizing loss. You are minimizing loss. There is a minus here as well. You are minimizing the version with the minus. Yeah, yeah. Minus. I'm trying to understand what happened to the other end. I think it's . Yeah. Yeah, maybe let's see. So one way to think about this is that, do I have a colored?","zh":"也许我在这里暂停一下。这有点复杂。是的。是的。你在最小化损失。你在最小化损失。这里还有一个负号。你在最小化带有负号的版本。是的，是的。负号。我试着理解另一端发生了什么。我想是这个。是的。是的，也许我们来看看。一种思考方式是，我有没有颜色？","start":2197.17,"end":2233.35},{"id":239,"text":"So if you think of this term as A, and this is A, and this is B, let's say. So then your loss is minus log A over A plus B. And we can just check the monotonicity of A or B. The monotonicity of B is very easy. If B is bigger, then this A over A plus B is smaller. And with the log, it's still smaller. And with minus, it's bigger.","zh":"如果你把这个项看作A，这个是A，这个是B，那么你的损失是负的log A除以A加B。我们可以检查A或B的单调性。B的单调性很容易。如果B更大，那么A除以A加B就会更小。加上log之后，它仍然更小。加上负号之后，它就更大。","start":2239.16,"end":2267.8},{"id":240,"text":"So it's monotone in B. If B is bigger, the whole thing is bigger. So basically, if you want the loss to be smaller, you want B to be smaller. So for A, I think it's just reverse direction. I think you can do this if you want 1 minus B over A plus B. This is equal.","zh":"所以它是单调递增的B。如果B更大，整个表达式就更大。所以基本上，如果你想让损失更小，你希望B更小。对于A，我想方向是相反的。我想如果你想要1减去B除以A加B，这等于。","start":2270.27,"end":2287.33},{"id":241,"text":"It's decreasing in A. This part is decreasing in A. With a minus, it's increasing in A. And with a log, it's still increasing. With a minus, it becomes decreasing. So this function is decreasing in A. That means that to minimize the function, you should maximize A. Any other questions? So if you do all the possible combinations, does the model see a lot more negative examples than positive? That's what you want in the ratio?","zh":"它是随着A的增加而减少的。这一部分随着A的增加而减少。加上负号后，它随着A的增加而增加。加上log之后，它仍然增加。加上负号后，它就变成减少的。因此，这个函数随着A的增加而减少。这意味着为了最小化这个函数，你应该最大化A。还有其他问题吗？如果你做所有可能的组合，模型是否看到了比正样本更多的负样本？这就是你想要的比例吗？","start":2290.72,"end":2337.53},{"id":242,"text":"Yeah, that's a great question. I think, okay, so maybe that's a great question. So first of all, maybe let's also introduce some notation. I think this, right, the augmentation of the same thing, this is called positive pair. And any other things, other pairs are negative pairs. So like a...","zh":"是的，这是一个很好的问题。我想，好的，也许这就是一个很好的问题。首先，也许我们也可以引入一些符号。我想，对的，这种相同事物的增强，这被称为正样本对。其他任何事物，其他对都是负样本对。比如一个……","start":2338.49,"end":2360.42},{"id":243,"text":"So I think people sometimes call this random pairs. Some people just call this negative pairs. I think from what I see, people are converging to the word negative pairs, even though, as we discussed a lot before, they are not always negative.","zh":"我想人们有时会称这种为随机对。有些人只是称这种为负样本对。我想从我看到的情况来看，人们正在趋向于使用“负样本对”这个词，尽管，正如我们之前讨论的很多次，它们并不总是负的。","start":2363.82,"end":2376.3}],"notes":["本段讨论了下一词预测损失函数的单调性分析，重点在于如何通过调整A和B的大小来最小化损失。讲者指出，当B增大时，A/(A+B)会减小，因此log(A/(A+B))也会减小，加上负号后整体变大，说明损失函数在B上是单调递增的。因此，为了最小化损失，B应尽可能小。对于A，讲者指出其变化方向相反，即损失函数在A上是单调递减的，因此应尽可能增大A。","讲者进一步提出问题，询问模型是否在训练过程中看到的负样本比正样本更多，这与损失函数的最小化目标相关。负样本比例的增加有助于模型更好地区分正负样本，从而提升预测性能。","讲者引入了正样本对和负样本对的概念，指出正样本对是指同一数据的增强版本，而负样本对则是其他数据对。虽然负样本对有时被称作随机对，但讲者强调，这些对并不总是具有负面含义，而是用于对比学习的框架。","讲者提到，尽管负样本对的定义存在争议，但学术界正在逐渐统一使用“负样本对”这一术语。这表明在对比学习中，负样本对的使用是重要的，但其具体定义和实现方式可能因研究而异。","讲者通过分析损失函数的单调性，强调了在设计损失函数时需要考虑变量之间的相互作用。例如，A和B的变化方向不同，因此需要分别分析其对损失函数的影响。","讲者通过提问引导学生思考模型在训练过程中如何处理正负样本的比例问题，这有助于理解对比学习中负样本的重要性以及如何优化损失函数。"],"formulas":[],"uncertainties":["可能无法准确识别的术语如 'colored' 和 'augmentation' 的具体含义，需要进一步上下文确认。","讲者提到的 'A over A plus B' 和 '1 minus B over A plus B' 的具体数学表达式可能存在识别错误，需进一步确认。","讲者提到的 'monotonicity' 和 'decreasing/increasing' 的具体数学定义可能需要更精确的表达。"],"diagram":"none","start":2197.17,"end":2376.3,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2197.17,"text":"Maybe let me pause here. This is a little bit complicated. Yep. Yep. You are minimizing loss. You are minimizing loss. There is a minus here as well. You are minimizing the version with the minus. Yeah, yeah. Minus. I'm trying to understand what happened to the other end. I think it's . Yeah. Yeah, maybe let's see. So one way to think about this is that, do I have a colored?"},{"start":2239.16,"text":"So if you think of this term as A, and this is A, and this is B, let's say. So then your loss is minus log A over A plus B. And we can just check the monotonicity of A or B. The monotonicity of B is very easy. If B is bigger, then this A over A plus B is smaller. And with the log, it's still smaller. And with minus, it's bigger."},{"start":2270.27,"text":"So it's monotone in B. If B is bigger, the whole thing is bigger. So basically, if you want the loss to be smaller, you want B to be smaller. So for A, I think it's just reverse direction. I think you can do this if you want 1 minus B over A plus B. This is equal."},{"start":2290.72,"text":"It's decreasing in A. This part is decreasing in A. With a minus, it's increasing in A. And with a log, it's still increasing. With a minus, it becomes decreasing. So this function is decreasing in A. That means that to minimize the function, you should maximize A. Any other questions? So if you do all the possible combinations, does the model see a lot more negative examples than positive? That's what you want in the ratio?"},{"start":2338.49,"text":"Yeah, that's a great question. I think, okay, so maybe that's a great question. So first of all, maybe let's also introduce some notation. I think this, right, the augmentation of the same thing, this is called positive pair. And any other things, other pairs are negative pairs. So like a..."},{"start":2363.82,"text":"So I think people sometimes call this random pairs. Some people just call this negative pairs. I think from what I see, people are converging to the word negative pairs, even though, as we discussed a lot before, they are not always negative."}],"speech_gaps":[],"frame":"../frames/v043/014.webp","frame_time":2209.17},{"title":"大语言模型与下一词预测损失","segments":[{"id":244,"text":"you have some small chance that they are actually good positive pairs, but you just treat them as negative pairs. And maybe before answering your question, so actually in practice, people don't have to get these positive pairs necessarily only through augmentations. You can find other ways to find positive pairs. For example, if you have an image,","zh":"你有很小的可能性，它们实际上是真正的好正样本对，但你却把它们当作负样本对。也许在回答你的问题之前，实际上在实践中，人们并不一定非要通过增强来获取这些正样本对。你也可以通过其他方式找到正样本对。例如，如果你有一张图片，","start":2377.52,"end":2403.4},{"id":245,"text":"And you can use the image to generate some text. Maybe you generate some text description. And then you can call the original image x hat i. And you can call the text description x tilde i. And you'll see this is a possible pair.","zh":"你可以用这张图片生成一些文本。也许你生成一些文本描述。然后你可以将原始图片称为x hat i，将文本描述称为x tilde i。你会看到这是一对可能的正样本对。","start":2406.57,"end":2423.62},{"id":246,"text":"That's also allowed. So in that case, basically all the tilde version are texts and all the hat version is images. And if they share the same index, they are positive pairs. If they don't share the same index, they are negative pairs. And that's actually how you train the text or share the representation between text and images. So you just create this kind of shared kind of like pairs with both image and text and then you know how to represent both image and text.","zh":"这也是被允许的。在这种情况下，基本上所有的tilde版本都是文本，所有的hat版本都是图片。如果它们共享相同的索引，它们就是正样本对；如果它们不共享相同的索引，它们就是负样本对。实际上，这就是如何训练文本或在文本和图片之间共享表示的方法。你只需创建这种共享的样本对，包含图像和文本，然后你就知道如何表示图像和文本。","start":2424.25,"end":2453.21},{"id":247,"text":"OK. And now, going back to your question, if you count the number of positive pairs, it's only in the diagonal. And if you count negative pairs, everything else is negative pairs. So that's true. There are a lot more negative pairs than positive pairs. But I think that's actually pretty reasonable because the negative pairs has much weaker","zh":"好的。现在，回到你的问题，如果你计算正样本对的数量，它们只出现在对角线上。如果你计算负样本对的数量，其余所有都是负样本对。这是正确的。负样本对的数量远远多于正样本对。但我认为这实际上是很合理的，因为在某种意义上，负样本对的信号要弱得多。在许多情况下，实际上区分两张非常不同、非常远的图片并不难。因此，在某种意义上，你需要更多的负样本对来在一定程度上平衡正样本对。","start":2454.46,"end":2475.89},{"id":248,"text":"signal in some sense. In many cases, it's actually not that hard to distinguish two images that are very far, very different. So in some sense, you do need more negative pairs to counterbalance the positive pairs to some degree. And another thing is that actually what people in practice really found is that they need a stronger negative pairs.","zh":"另一个方面是，实际上人们在实践中发现，他们需要更强的负样本对。而不是仅仅随机选择的负样本对。因此，有一种叫做负样本挖掘（negative mining）或负样本对挖掘（negative pair mining）的方法，有时也称为困难负样本（hard negatives）。你试图找到困难负样本。那么，困难负样本是什么？困难负样本是指那些","start":2477.54,"end":2499.6},{"id":249,"text":"than just the randomly chosen negative pairs. So there is something called negative mining, negative pair mining, and sometimes also called hard negatives. You are trying to find hard negatives. And what are the hard negatives? The hard negatives are those cases where","zh":"不仅仅是随机选择的负样本对。因此，有一种叫做负样本挖掘（negative mining）、负样本对挖掘（negative pair mining），有时也被称为困难负样本（hard negatives）。你试图找到困难负样本。那么，什么是困难负样本？困难负样本是指那些","start":2501.12,"end":2522.36},{"id":250,"text":"um they look somewhat similar but not really exactly like so for example you could have um maybe an image you know which is about you know um a kid playing a soccer and then you have another text which is kind of like about soccer but there's no kid right it's probably fifa you know like the the world cup something like that and do you do you think this this text about fifa uh world cup is the same","zh":"嗯，它们看起来有些相似，但并不是完全一样。例如，你可能会有一个关于一个孩子踢足球的图像，然后还有一个文本，内容大致是关于足球的，但里面没有孩子，可能是关于国际足联（FIFA）的，比如世界杯之类的。你觉得这个关于国际足联世界杯的文本和之前的那个文本是否相同？","start":2523.17,"end":2548.59}],"notes":["本段讲解了在训练模型时如何构建正负样本对。正样本对通常是指具有相同索引的图像和文本对，而负样本对则是索引不同的对。这种配对方式有助于模型学习如何在图像和文本之间建立共享表示。","在实际应用中，正样本对并不一定只能通过数据增强来获取，还可以通过其他方式找到。例如，使用图像生成文本描述，然后将原始图像和生成的文本描述配对，形成正样本对。","负样本对的数量远多于正样本对，这是因为负样本对的信号较弱，且在许多情况下，区分两个差异很大的图像并不困难。因此，需要更多的负样本对来平衡正样本对的影响。","在实践中，人们发现需要更强的负样本对，而不仅仅是随机选择的负样本对。因此，出现了负样本挖掘（negative mining）或硬负样本（hard negatives）的概念，旨在寻找那些看起来相似但又不完全相同的样本对。","硬负样本指的是那些看起来相似但又不完全相同的样本对，例如，一张关于孩子踢足球的图片和一段关于足球但没有孩子的文本描述。这种样本对对模型的训练具有更高的挑战性，有助于提升模型的区分能力。","在实际应用中，如何定义和选择硬负样本是一个重要的问题，因为它直接影响模型的性能和训练效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2377.52,"end":2548.59,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2377.52,"text":"have some small chance that they are actually good positive pairs, but you just treat them as negative pairs. And maybe before answering your question, so actually in practice, people don't have to get these positive pairs necessarily only through augmentations. You can find other ways to find positive pairs. For example, if you have an image,"},{"start":2406.57,"text":"And you can use the image to generate some text. Maybe you generate some text description. And then you can call the original image x hat i. And you can call the text description x tilde i. And you'll see this is a possible pair."},{"start":2424.25,"text":"That's also allowed. So in that case, basically all the tilde version are texts and all the hat version is images. And if they share the same index, they are positive pairs. If they don't share the same index, they are negative pairs. And that's actually how you train the text or share the representation between text and images. So you just create this kind of shared kind of like pairs with both image and text and then you know how to represent both image and text."},{"start":2454.46,"text":"OK. And now, going back to your question, if you count the number of positive pairs, it's only in the diagonal. And if you count negative pairs, everything else is negative pairs. So that's true. There are a lot more negative pairs than positive pairs. But I think that's actually pretty reasonable because the negative pairs has much weaker"},{"start":2477.54,"text":"signal in some sense. In many cases, it's actually not that hard to distinguish two images that are very far, very different. So in some sense, you do need more negative pairs to counterbalance the positive pairs to some degree. And another thing is that actually what people in practice really found is that they need a stronger negative pairs."},{"start":2501.12,"text":"than just the randomly chosen negative pairs. So there is something called negative mining, negative pair mining, and sometimes also called hard negatives. You are trying to find hard negatives. And what are the hard negatives? The hard negatives are those cases where"},{"start":2523.17,"text":"um they look somewhat similar but not really exactly like so for example you could have um maybe an image you know which is about you know um a kid playing a soccer and then you have another text which is kind of like about soccer but there's no kid right it's probably fifa you know like the the world cup something like that and do you do you think this this text about fifa uh world cup is the same"}],"speech_gaps":[],"frame":"../frames/v043/015.webp","frame_time":2389.52},{"title":"大语言模型与下一词预测损失","segments":[{"id":251,"text":"should be matched to the kid playing soccer. You know, it's kind of like a little bit kind of ambiguous in some sense, right? So, and you've got those kind of cases, hard negatives. So those are kind of like potentially confusing, distracting pairs in some sense. And you put those in your loss function or data distribution you are training on so that you make the loss more demanding. You say, I cannot, not only I have to distinguish","zh":"应该与正在踢足球的孩子相匹配。你知道的，从某种意义上说，这有点模糊，对吧？所以，你还会遇到这种硬负样本的情况。这些在某种意义上就像是潜在的混淆、分散注意力的配对。你把这些放入你的损失函数或训练数据分布中，以使损失更加严格。你说，我不能仅仅区分非常不同的图像或不同类型的数据，我还必须区分那些看似相似但实际上不相似的事物。总的来说，这实际上是实践中最大的技巧之一。你试图找出哪些负样本足够难，但又不是正样本。因为如果太难了，实际上最终它们会变得越来越相似，最终应该被视为正样本配对。因此，如何平衡这一点就变得很重要。因为每次你试图过滤你的数据时，你会发现越来越多的难负样本。在某个时候，你无法区分难负样本和正样本。因此，你必须在某个时候停止，以免混淆自己。我刚刚有个问题。这的计算复杂度是多少？","start":2549.2,"end":2576.7},{"id":252,"text":"very clearly different images or different kind of data. I have to also distinguish those things that are seemingly similar but not really. So generally speaking, this is actually one of the biggest trick in practice. You try to find out what are","zh":"非常不同的图像或者不同类型的数据。我还需要区分那些看起来相似但实际上不是的东西。总的来说，这实际上是实践中最大的一个陷阱之一。你试图找出那些","start":2578.22,"end":2597.53},{"id":253,"text":"hard enough negatives that are not positives. Because if it's too hard, it's actually eventually becomes, you know, the more and more similar they are, eventually they should be considered as positive pairs. So, and it's how to balance that. Because anytime you are trying to filter through your data, you know, you find more and more harder negatives. And at some point, you cannot tell apart hard negatives and positives. So you have to stop somewhere so that you don't confuse yourself. I just got a question. What's the computational complexity of this?","zh":"足够难的负样本，而它们并不是正样本。因为如果太难的话，实际上最终会变得越来越相似，最终应该被当作正样本对来处理。因此，如何平衡这一点就变得很重要。因为任何时候你在尝试过滤你的数据时，你会发现越来越多的难负样本。在某个时候，你无法区分难负样本和正样本。因此，你必须在某个时候停止，以免混淆自己。我刚刚有一个问题。这个的计算复杂度是多少？","start":2599.27,"end":2627.82},{"id":254,"text":"of going through and computing the walls for every single one","zh":"对，好的，只要它是b的平方，就OK。","start":2628.92,"end":2634.54},{"id":255,"text":"in the matrix?","zh":"所以但b的平方实际上是一个非常好的问题。","start":2634.54,"end":2636.72},{"id":256,"text":"Yeah, so it's b squared, right?","zh":"对，好的，只要它是b的平方，就OK。","start":2637.06,"end":2638.16},{"id":257,"text":"Right, OK, as long as it is b squared, OK.","zh":"所以但b的平方实际上是一个非常好的问题。","start":2638.24,"end":2640.12},{"id":258,"text":"So but b squared is actually, that's actually a good question.","zh":"对，好的，只要它是b的平方，就OK。","start":2641.34,"end":2645.96},{"id":259,"text":"So b squared is not that of a problem,","zh":"所以b平方并不是一个问题，","start":2646.08,"end":2648.62},{"id":260,"text":"because the real issue is that how do you compute","zh":"因为真正的问题是，你如何计算","start":2648.74,"end":2653.18},{"id":261,"text":"the embeddings of all of this?","zh":"所有这些的嵌入表示？","start":2653.18,"end":2654.36},{"id":262,"text":"So that is actually proportional to 2b.","zh":"所以实际上它与2b成正比。","start":2654.52,"end":2657.0},{"id":263,"text":"So basically, you have to do 2B forward pass to compute the embeddings.","zh":"基本上，你必须进行2B次前向传播来计算嵌入表示。","start":2657.0,"end":2661.32},{"id":264,"text":"But each of these embeddings is much more expensive.","zh":"但每一个这样的嵌入表示成本要高得多。","start":2661.82,"end":2664.1},{"id":265,"text":"You have to go through billions of parameters to compute one embedding.","zh":"你必须经过数十亿个参数来计算一个嵌入表示。","start":2664.28,"end":2667.4},{"id":266,"text":"So that's the real computational bottleneck.","zh":"所以这就是真正的计算瓶颈。","start":2667.84,"end":2671.28},{"id":267,"text":"Just getting these loss functions done with B-square operation, that's cheap, generally speaking.","zh":"仅仅用 B-square 操作完成这些损失函数，一般来说成本很低。","start":2671.44,"end":2677.34},{"id":268,"text":"So you just use random augmentation?","zh":"所以你只是使用随机增强吗？","start":2686.04,"end":2687.86},{"id":269,"text":"You do a random augmentation. So if you only have more augmentations,","zh":"你进行随机增强。所以如果你有更多的增强方式，","start":2692.44,"end":2696.52},{"id":270,"text":"you just go through the data multiple times, each time you generate some different augmentations.","zh":"你只需多次遍历数据，每次生成一些不同的增强方式。","start":2696.56,"end":2699.76},{"id":271,"text":"But actually, you never really go through the data more than a few times, I think.","zh":"但实际上，我认为你通常不会遍历数据超过几次。","start":2700.96,"end":2705.66},{"id":272,"text":"Yeah, but you use a random augmentation so that each time you are applying different tactics or different combinations of the tactics in the augmentation.","zh":"是的，但你使用随机增强，这样每次应用不同的策略或不同的策略组合。","start":2707.74,"end":2714.54},{"id":273,"text":"So if you were to find negative pairs, would you not put all of the pairs in? Like you would only put some subset of the other data points?","zh":"所以如果你要寻找负样本对，你不会把所有的样本对都放入吗？比如你只会放入其他数据点的一个子集？","start":2716.4,"end":2723.94},{"id":274,"text":"If you have very good negative pairs, then what would you do?","zh":"如果你有非常好的负样本对，你会怎么做？","start":2724.98,"end":2728.9}],"notes":["本段主要讲解了在训练模型时如何处理负样本的问题，特别是如何选择足够难的负样本以提高模型的区分能力。讲者提到，如果负样本太难，它们最终会被视为正样本，因此需要在正负样本之间找到平衡。此外，讲者还提到如何通过随机增强来处理数据，以生成不同的增强版本，从而避免重复使用相同的数据。","讲者进一步讨论了计算复杂度的问题，指出虽然计算B平方的操作相对便宜，但计算嵌入（embeddings）才是真正的计算瓶颈。这是因为每个嵌入都需要通过大量的参数进行计算，这使得整个过程变得非常昂贵。","讲者还提到，虽然可以多次遍历数据，但通常不会超过几次，因为这会增加计算负担。此外，随机增强的策略可以应用不同的增强方法或组合，以生成多样化的数据。","最后，讲者提出了关于负样本选择的问题，即是否应该将所有可能的负样本对都包含在内，或者只选择一部分。讲者指出，如果负样本对质量很高，那么可以考虑使用它们，但需要权衡计算成本和模型性能。","讲者还提到，如何在实际操作中找到合适的负样本对，以及如何在正负样本之间进行平衡，以确保模型能够有效区分不同的数据。这涉及到对数据分布和损失函数的深入理解。","整个段落强调了在训练模型时，如何通过选择合适的负样本和增强策略来提高模型的性能，同时也要注意计算成本和效率的问题。"],"formulas":[{"latex":"O(b^2)","symbols":"计算复杂度为O(b²)","explanation":"该公式表示计算所有数据对的复杂度为O(b²)，符合原文中提到的计算墙壁（可能指数据对）的复杂度。","evidence":"Yeah, so it's b squared, right? Right, OK, as long as it is b squared, OK."},{"latex":"O(2b)","symbols":"计算嵌入的复杂度为O(2b)","explanation":"该公式表示计算嵌入的复杂度为O(2b)，符合原文中提到的需要进行2B次前向传播来计算嵌入。","evidence":"So that is actually proportional to 2b. So basically, you have to do 2B forward pass to compute the embeddings."}],"uncertainties":["the walls for every single one"],"diagram":"none","start":2549.2,"end":2728.9,"asr_flags":[],"math_clarifications":["原文中提到的计算复杂度为O(b²)和O(2b)是基于对数据对和嵌入计算的描述，符合上下文中的讨论。"],"boards":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":2549.2,"text":"should be matched to the kid playing soccer. You know, it's kind of like a little bit kind of ambiguous in some sense, right? So, and you've got those kind of cases, hard negatives. So those are kind of like potentially confusing, distracting pairs in some sense. And you put those in your loss function or data distribution you are training on so that you make the loss more demanding. You say, I cannot, not only I have to distinguish"},{"start":2578.22,"text":"very clearly different images or different kind of data. I have to also distinguish those things that are seemingly similar but not really. So generally speaking, this is actually one of the biggest trick in practice. You try to find out what are"},{"start":2599.27,"text":"hard enough negatives that are not positives. Because if it's too hard, it's actually eventually becomes, you know, the more and more similar they are, eventually they should be considered as positive pairs. So, and it's how to balance that. Because anytime you are trying to filter through your data, you know, you find more and more harder negatives. And at some point, you cannot tell apart hard negatives and positives. So you have to stop somewhere so that you don't confuse yourself. I just got a question. What's the computational complexity of this?"},{"start":2628.92,"text":"of going through and computing the walls for every single one"},{"start":2634.54,"text":"in the matrix?"},{"start":2637.06,"text":"Yeah, so it's b squared, right?"},{"start":2638.24,"text":"Right, OK, as long as it is b squared, OK."},{"start":2641.34,"text":"So but b squared is actually, that's actually a good question."},{"start":2646.08,"text":"So b squared is not that of a problem,"},{"start":2648.74,"text":"because the real issue is that how do you compute"},{"start":2653.18,"text":"the embeddings of all of this?"},{"start":2654.52,"text":"So that is actually proportional to 2b."},{"start":2657.0,"text":"So basically, you have to do 2B forward pass to compute the embeddings."},{"start":2661.82,"text":"But each of these embeddings is much more expensive."},{"start":2664.28,"text":"You have to go through billions of parameters to compute one embedding."},{"start":2667.84,"text":"So that's the real computational bottleneck."},{"start":2671.44,"text":"Just getting these loss functions done with B-square operation, that's cheap, generally speaking."},{"start":2686.04,"text":"So you just use random augmentation?"},{"start":2692.44,"text":"You do a random augmentation. So if you only have more augmentations,"},{"start":2696.56,"text":"you just go through the data multiple times, each time you generate some different augmentations."},{"start":2700.96,"text":"But actually, you never really go through the data more than a few times, I think."},{"start":2707.74,"text":"Yeah, but you use a random augmentation so that each time you are applying different tactics or different combinations of the tactics in the augmentation."},{"start":2716.4,"text":"So if you were to find negative pairs, would you not put all of the pairs in? Like you would only put some subset of the other data points?"},{"start":2724.98,"text":"If you have very good negative pairs, then what would you do?"}],"speech_gaps":[{"start":2681.904,"end":2684.4},{"start":2688.88,"end":2691.28}],"frame":"../frames/v043/016.webp","frame_time":2561.2},{"title":"负样本选择与损失函数优化","segments":[{"id":275,"text":"Yeah.","zh":"是的。","start":2729.12,"end":2729.56},{"id":276,"text":"Sorry, so what you are proposing to do?","zh":"抱歉，那么你打算怎么做？","start":2729.66,"end":2732.04},{"id":277,"text":"Like would you then not use all of the negative samples,","zh":"比如，你不会使用所有的负样本，","start":2732.04,"end":2735.02},{"id":278,"text":"but only some subsets? You'd have like the one positive and then","zh":"而只是使用其中的一些子集？你会有一个正样本，然后","start":2735.14,"end":2737.38},{"id":279,"text":"So for example, by the way, another thing is that what I didn't say clearly here is that this B is not the whole data set. This B is only a sub-sample. version of the data set. So B could be 128, maybe 1,000, 4,000, so on and so forth. And what you do is that each time you take B of the real examples from images and you build this matrix, and then next time you move on to another B examples.","zh":"顺便提一下，另一个事情是，我在这里没有说清楚的是，这里的B并不是整个数据集。这个B只是数据集的一个子样本。B可以是128，也许1,000，4,000，等等。你所做的就是每次从图像中选取B个真实示例并构建这个矩阵，然后下一次再选取另一个B个示例。","start":2737.9,"end":2767.54},{"id":280,"text":"version of the data set. So B could be 128, maybe 1,000, 4,000, so on and so forth. And what you do is that each time you take B of the real examples from images and you build this matrix, and then next time you move on to another B examples. And how do you select that B examples also matters a little bit. So first of all, you shouldn't select those examples that are very","zh":"B可以是128，也许1,000，4,000，等等。你所做的就是每次从图像中选取B个真实示例并构建这个矩阵，然后下一次再选取另一个B个示例。而如何选择这些B个示例也有一点重要。首先，你不应该选择那些非常","start":2768.32,"end":2792.53},{"id":281,"text":"I guess we are getting into deep situations, some of the practice situations. In practice, you have actually many, many data sets. You maybe have an image data set. You have a data set that are always about buildings. You have an image data set which is from the web. You may have different data sources.","zh":"我想我们已经进入了一些实践中的复杂情况。在实践中，你实际上拥有许多许多数据集。你可能有一个图像数据集。你有一个数据集总是关于建筑物的。你有一个从网络上获取的图像数据集。你可能有不同的数据来源。","start":2794.48,"end":2810.54},{"id":282,"text":"And when you sample these images, first of all, people always sample these B images from the same source so that they are somewhat similar to each other. And that's one way to create harder negatives. Because if they are all very different, then it's just so easy to fit this loss function. You just clearly tell. For another example, I think I'm","zh":"当你采样这些图像时，首先，人们总是从同一个来源采样这些B张图像，使得它们彼此之间有些相似。这是创建更难负样本的一种方法。因为如果它们都非常不同，那么就很容易拟合这个损失函数。你只需明确地告诉。例如，我想我","start":2812.37,"end":2835.65},{"id":283,"text":"I was involved in a startup which is doing some of these things with natural languages. And when there's natural languages, they are, for example, for coding, there are different programming languages. Java, C++, and so forth. So if all of these examples are from different programming languages, it's so easy to tell apart them. Your loss function is naturally so small, and there's nothing you need to do with it. So that's why you probably should pick this B.","zh":"我曾参与过一家初创公司，该公司正在利用自然语言进行一些相关工作。当涉及到自然语言时，例如在编程中，存在不同的编程语言，如Java、C++等。如果所有这些例子都来自不同的编程语言，那么它们之间的区分就非常容易。此时你的损失函数自然会很小，你无需对其进行任何处理。因此，你可能应该选择这个B。","start":2837.68,"end":2864.94},{"id":284,"text":"examples from at least the same programming languages or maybe even the same code base on the same RIPOs and so forth to make it a bit harder to distinguish. So basically, the trick is that you need to start with things that are somewhat difficult to distinguish to make the loss function more demanding, and then you can learn a stronger representation. Any other questions? OK, so I think","zh":"为了使区分变得更加困难，你可以选择至少来自相同编程语言或甚至相同代码库（如RIPOs等）的示例。基本上，诀窍在于你需要从那些稍难区分的事物开始，从而使损失函数更具挑战性，然后你可以学习到更强的表示能力。还有其他问题吗？好的，我认为","start":2866.43,"end":2902.37}],"notes":["本段讨论了在训练模型时如何选择负样本以优化损失函数。讲者指出，不应使用所有负样本，而是选择部分子集，特别是强负样本（hard negative pairs），以使损失函数更具挑战性。B代表的是数据集的一个子集，而不是整个数据集，B的大小可以是128、1000、4000等。每次训练时，从真实示例中选取B个样本构建矩阵，然后切换到另一个B个样本。","选择B个样本时，需要注意样本的来源。通常，人们会从同一来源选取B个样本，以确保它们在某种程度上相似。这样可以创建更难区分的负样本，因为如果样本差异太大，损失函数会变得容易优化。例如，在自然语言处理中，如果所有示例都来自不同的编程语言，那么损失函数会自然较小，无需额外处理。","讲者提到，为了使损失函数更具挑战性，应选择那些在某种程度上难以区分的样本。这样可以促使模型学习更强的表示能力。例如，在编程语言处理中，如果所有示例都来自同一编程语言或同一代码库，那么模型需要更努力地区分它们。","讲者强调，选择样本时应避免选择那些差异过大的样本，因为这会使得损失函数变得容易优化。因此，选择相似但有一定差异的样本是创建硬负样本的一种方法。","讲者还提到，在实际应用中，可能会有多个数据集，例如图像数据集、特定主题的数据集（如建筑物）以及来自网络的数据集。不同数据源的样本可能具有不同的相似性，因此在选择样本时需要考虑这些因素。","最后，讲者总结说，选择具有挑战性的样本是优化损失函数的关键，这有助于模型学习更强大的表示能力。"],"formulas":[],"uncertainties":["RIPOs"],"diagram":"none","start":2729.12,"end":2902.37,"asr_flags":[277,278],"boards":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":2729.12,"text":"Yeah."},{"start":2729.66,"text":"Sorry, so what you are proposing to do?"},{"start":2732.04,"text":"Like would you then not use all of the negative samples,"},{"start":2735.14,"text":"but only some subsets? You'd have like the one positive and then"},{"start":2737.9,"text":"start fewer? Yeah, exactly, exactly. So if you have better negative pairs, you should just replace this whole thing by positive pairs and a set of strong negative pairs, hard negative pairs. Yes. To make the loss more demanding, yes. And yeah, exactly. So for example, by the way, another thing is that what I didn't say clearly here is that this B is not the whole data set. This B is only a sub-sample."},{"start":2768.32,"text":"version of the data set. So B could be 128, maybe 1,000, 4,000, so on and so forth. And what you do is that each time you take B of the real examples from images and you build this matrix, and then next time you move on to another B examples. And how do you select that B examples also matters a little bit. So first of all, you shouldn't select those examples that are very"},{"start":2794.48,"text":"I guess we are getting into deep situations, some of the practice situations. In practice, you have actually many, many data sets. You maybe have an image data set. You have a data set that are always about buildings. You have an image data set which is from the web. You may have different data sources."},{"start":2812.37,"text":"And presumably, those images in the same data sources are somewhat more similar to each other. And when you sample these images, first of all, people always sample these B images from the same source so that they are somewhat similar to each other. And that's one way to create harder negatives. Because if they are all very different, then it's just so easy to fit this loss function. You just clearly tell. For another example, I think I'm"},{"start":2837.68,"text":"I was involved in a startup which is doing some of these things with natural languages. And when there's natural languages, they are, for example, for coding, there are different programming languages. Java, C++, and so forth. So if all of these examples are from different programming languages, it's so easy to tell apart them. Your loss function is naturally so small, and there's nothing you need to do with it. So that's why you probably should pick this B."},{"start":2866.43,"text":"examples from at least the same programming languages or maybe even the same code base on the same RIPOs and so forth to make it a bit harder to distinguish. So basically, the trick is that you need to start with things that are somewhat difficult to distinguish to make the loss function more demanding, and then you can learn a stronger representation. Any other questions? OK, so I think"}],"speech_gaps":[],"frame":"../frames/v043/017.webp","frame_time":2741.12},{"title":"大语言模型与下一词预测损失","segments":[{"id":285,"text":"Wait, anything else I didn't say? OK. And for languages, oftentimes you don't have augmentations. And what people do is that the public papers had many different other ways to prepare the positive pairs. So if you're just training this embedding for some languages, then you, for example, sometimes use X tilde as the, so you have a document and the","zh":"等等，我还有什么没说吗？好的。对于语言来说，很多时候你并不需要增强数据。人们通常采用的方法是，公开论文中有很多不同的方法来准备正样本对。因此，如果你只是在训练这种嵌入表示，那么例如，有时你会使用X~作为，也就是说，你有一个文档和","start":2906.44,"end":2934.03},{"id":286,"text":"The tilde version, the first augmentation, so-called augmentation, is maybe the title and the headers. And the second copy is probably just the raw text. So then you create a pair. The pair is the title versus the headers versus the raw text. And that's positive pair. And then if you have the title of one document and raw text of another document, that's a negative pair. Obviously, it's less likely for them to match to each other.","zh":"带波浪号的版本，也就是第一种增强方式，所谓的增强，可能是标题和页眉。第二种复制可能是原始文本。然后你创建一个样本对。样本对是标题与页眉与原始文本之间的对比。这就是正样本对。然后如果你有一个文档的标题和另一个文档的原始文本，这就是负样本对。显然，它们之间匹配的可能性较低。","start":2934.53,"end":2962.63},{"id":287,"text":"Okay, so now let's briefly talk about how do you use this in the semantic search. So I think you can probably imagine it's very simple. So in semantic search, the goal is that you are given a query and you want to find all similar kind of like objects in your pool.","zh":"好的，现在让我们简要谈谈如何在语义搜索中使用这些方法。我想你可以想象这非常简单。在语义搜索中，目标是当你被给出一个查询时，你想要在你的数据集中找到所有相似的物体。","start":2964.46,"end":2981.14},{"id":288,"text":"say, documents or images. For example, you have a large collection of images and you are given one image, a new image, you want to find all the similar images in that pool. In the text, I think you have a query and you have a large collection of documents and you want to find which document is most relevant to the query, maybe answering the question of query, so on and so forth. So it's always something like you have a collection of, say, documents or objects you care about and you have a query. And this is a query.","zh":"例如，你有一个庞大的图像集合，你被给出一张新的图像，你想要在该集合中找到所有相似的图像。在文本中，我认为你有一个查询和一个庞大的文档集合，你想要找到与查询最相关的文档，可能回答查询的问题，等等。因此，它总是类似于你有一个文档或物体的集合，你有一个查询。这就是一个查询。","start":2981.71,"end":3010.47},{"id":289,"text":"And you want to find, among this collection of documents, which one is closest to the query or collection of images. And the way you do it is that you just, very simple, given the embedding models or the representation, the phi, you just compute phi of d1 up to phi of dn in advance. And then given the query, so at a test time, you have a query, you take the query and you map it to","zh":"你想要在这些文档中找到最接近查询的文档或图像集合。你实现的方法是，非常简单，给定嵌入模型或表示，phi，你提前计算d1到dn的phi值。然后在测试时，你有一个查询，你将查询映射到","start":3011.56,"end":3042.62},{"id":290,"text":"the embedding of the query. And then among these embeddings, these points where you have a bunch of points, you want to find the nearest neighbor of this. You just find the, you want to minimize, you want to find the id, say i, such that, I guess let's maximize the inner product. Let's maximize the inner product between phi theta q and phi theta di. So how do you maximize this?","zh":"查询的嵌入。然后在这些嵌入中，这些点中你有一组点，你想要找到这个点的最近邻。你只需要找到，你想要最小化，你想要找到一个id，比如说i，使得，我想应该是最大化内积。让我们最大化phi theta q和phi theta di之间的内积。那么你如何最大化这个内积？","start":3043.85,"end":3071.42}],"notes":["本段主要讲解了在语言模型中，如何通过不同的方式准备正样本对，以用于训练嵌入模型。通常情况下，语言模型不会像图像处理那样使用数据增强，而是通过标题、页眉和原始文本等不同部分来构建正样本对。正样本对指的是同一文档的不同部分，而负样本对则是不同文档之间的部分。","在语义搜索中，目标是给定一个查询，找到与之最相似的对象。这可以是文档或图像等。例如，在图像搜索中，给定一张新图像，需要在数据库中找到相似的图像；在文本搜索中，给定一个查询，需要在文档集合中找到最相关的文档。","语义搜索的实现方式相对简单，首先需要预先计算所有文档的嵌入表示，然后在查询时，将查询映射为嵌入表示，并在所有嵌入表示中找到最接近的邻居。为了最大化相似性，通常会最大化查询嵌入与文档嵌入之间的内积。","在实际操作中，需要预先计算所有文档的嵌入表示，并在查询时进行实时映射。找到最接近的邻居是通过计算内积来实现的，这需要最大化查询嵌入与文档嵌入之间的相似性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2906.44,"end":3071.42,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2906.44,"text":"Wait, anything else I didn't say? OK. And for languages, oftentimes you don't have augmentations. And what people do is that the public papers had many different other ways to prepare the positive pairs. So if you're just training this embedding some languages, then you, for example, sometimes use X tilde as the, so you have a document and the"},{"start":2934.53,"text":"The tilde version, the first augmentation, so-called augmentation, is maybe the title and the headers. And the second copy is probably just the raw text. So then you create a pair. The pair is the title versus the headers versus the raw text. And that's positive pair. And then if you have the title of one document and raw text of another document, that's a negative pair. Obviously, it's less likely for them to match to each other."},{"start":2964.46,"text":"Okay, so now let's briefly talk about how do you use this in the semantic search. So I think you can probably imagine it's very simple. So in semantic search, the goal is that you are given a query and you want to find all similar kind of like objects in your pool."},{"start":2981.71,"text":"say, documents or images. For example, you have a large collection of images and you are given one image, a new image, you want to find all the similar images in that pool. In the text, I think you have a query and you have a large collection of documents and you want to find which document is most relevant to the query, maybe answering the question of query, so on and so forth. So it's always something like you have a collection of, say, documents or objects you care about and you have a query. And this is a query."},{"start":3011.56,"text":"And you want to find, among this collection of documents, which one is closest to the query or collection of images. And the way you do it is that you just, very simple, given the embedding models or the representation, the phi, you just compute phi of d1 up to phi of dn in advance. And then given the query, so at a test time, you have a query, you take the query and you map it to"},{"start":3043.85,"text":"the embedding of the query. And then among these embeddings, these points where you have a bunch of points, you want to find the nearest neighbor of this. You just find the, you want to minimize, you want to find the id, say i, such that, I guess let's maximize the inner product. Let's maximize the inner product between phi theta q and phi theta di. So how do you maximize this?"}],"speech_gaps":[],"frame":"../frames/v043/018.webp","frame_time":2918.44},{"title":"大语言模型与下一词预测损失","segments":[{"id":291,"text":"The simplest way is just you go over all the i's. You don't have to recompute the phi because phi is all the embeddings already stored. You don't have to rerun your network. You just have a bunch of vectors. And then you take the inner product of all of these vectors with this guy and you look at all of the numbers and you see which one is biggest. Or maybe which one is the top 10. You don't have to always get the biggest. So that's the brute force way. And if you want to make it faster, then there are this kind of like...","zh":"最简单的方法就是你遍历所有的i。你不需要重新计算phi，因为phi已经是所有已存储的嵌入向量。你也不需要重新运行你的网络。你只需要有一组向量，然后你将这些向量与这个向量做内积，查看所有的数值，并找出其中最大的那个。或者也许找出前10个。你并不总是需要找到最大的那个。这就是暴力方法。如果你想让这个过程更快，那么就有这种类似……","start":3071.99,"end":3099.95},{"id":292,"text":"a tool called Vector Database. So basically, there are other kind of k-nearest neighbor algorithms. The k-nearest neighbor algorithm is exactly solving this problem. So you're having a lot of points, and the k-nearest neighbor algorithm will find the k-nearest neighbor, the k closest neighbors in the point cloud. I think there is a purely algorithmic question, so I guess we won't","zh":"一种叫做向量数据库的工具。基本上，还有其他类型的k近邻算法。k近邻算法正是在解决这个问题。你有很多点，而k近邻算法会找到这些点云中距离最近的k个邻居。我认为这是一个纯粹的算法问题，所以我想我们不会……","start":3100.6,"end":3128.08},{"id":293,"text":"It's not actually much of interest for this course. It's just purely algorithmically, how do you find from a large collection of vectors, how do you find the closest vectors? And practically speaking, you can use a vector database. A vector database is exactly designed for this. The database is storing this and then enabling how do you take the max within your product. OK. And now, finally, I think","zh":"这实际上对本课程并不是特别有趣。它只是纯粹从算法角度出发，如何从大量向量集合中找到最近的向量？从实际角度来看，你可以使用向量数据库。向量数据库正是为此设计的。数据库存储这些向量，并且能够支持如何在内积中找到最大值。好的。现在，最后，我想……","start":3129.3,"end":3155.59},{"id":294,"text":"We can also talk about, let's see what else we should talk about. Let me see how much time I have. So I think, finally, I think we can talk about some of the application of semantic search. You can see that semantic search is useful.","zh":"我们也可以谈谈，我们还应该谈些什么。让我看看我还有多少时间。因此，我想最后，我们可以谈谈语义搜索的一些应用。你可以看到语义搜索是有用的。","start":3158.31,"end":3189.27},{"id":295,"text":"by itself because you just have to do search in some sense, in many cases. And actually, most of the search system these days, except some of the legacy system like Google. I think Google is also using semantic search to some degree, but we don't know exactly. It's kind of like a more fusion of many, many methods. But most of the new methods, if you implement a semantic search system yourself, you probably should use these kind of ideas. And there's one more application beyond semantic search.","zh":"本身，因为在很多情况下，你只需要进行某种意义上的搜索。实际上，如今大多数的搜索系统，除了像谷歌这样的传统系统。我认为谷歌也在某种程度上使用了语义搜索，但我们并不确切知道。它更像是许多许多方法的融合。但大多数新的方法，如果你自己实现一个语义搜索系统，你可能应该使用这些想法。还有一个语义搜索之外的应用。","start":3190.07,"end":3218.49},{"id":296,"text":"in the large English model area, which is you use this in the so-called retrieval argument generation. And the motivation is that","zh":"在大型英语模型领域，就是你使用它在所谓的检索论证生成中。其动机是……","start":3218.99,"end":3241.46}],"notes":["本段讲解了在大语言模型中进行下一词预测时，如何通过向量数据库和k近邻算法来加速搜索过程。讲者提到，最简单的方法是遍历所有i值，找到与当前向量内积最大的向量，或者取前10个最大值。这种方法虽然直接，但计算量较大，因此需要更高效的工具，如向量数据库。","讲者指出，k近邻算法是解决此类问题的典型方法，它可以在点云中找到k个最近的邻居。虽然这在算法上是一个纯技术问题，但讲者认为对于本课程来说，这并不是重点。他强调，实际应用中可以使用向量数据库来高效地进行向量搜索。","讲者提到，向量数据库是专门为这种任务设计的，它存储了向量并支持如何在向量集合中找到最大值。这表明向量数据库在处理大规模向量数据时具有显著优势。","讲者进一步讨论了语义搜索的应用，指出语义搜索在许多情况下是必要的，因为搜索本质上就是一种语义匹配。他提到，现代的搜索引擎，如Google，也在一定程度上使用了语义搜索，尽管具体实现细节尚不明确。","讲者还提到，除了语义搜索之外，还有其他应用，如检索-生成（retrieval argument generation）方法。这种方法的动机是利用向量数据库来生成更准确的搜索结果。","讲者最后提到，虽然具体实现细节可能尚未展开，但这些方法在构建语义搜索系统时是重要的考虑因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3071.99,"end":3241.46,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3071.99,"text":"The simplest way is just you go over all the i's. You don't have to recompute the phi because phi is all the embeddings already stored. You don't have to rerun your network. You just have a bunch of vectors. And then you take the inner part of all of these vectors with this guy and you look at all of the numbers and you see which one is biggest. Or maybe which one is the top 10. You don't have to always get the biggest. So that's the brute force way. And if you want to make it faster, then there are this kind of like..."},{"start":3100.6,"text":"a tool called Vector Database. So basically, there are other kind of k-nearest neighbor algorithms. The k-nearest neighbor algorithm is exactly solving this problem. So you're having a lot of points, and the k-nearest neighbor algorithm will find the k-nearest neighbor, the k closest neighbors in the point cloud. I think there is a purely algorithmic question, so I guess we won't"},{"start":3129.3,"text":"It's not actually much of interest for this course. It's just purely algorithmically, how do you find from a large collection of vectors, how do you find the closest vectors? And practically speaking, you can use a vector database. A vector database is exactly designed for this. The database is storing this and then enabling how do you take the max within your product. OK. And now, finally, I think"},{"start":3158.31,"text":"We can also talk about, let's see what else we should talk about. Let me see how much time I have. So I think, finally, I think we can talk about some of the application of semantic search. You can see that semantic search is useful."},{"start":3190.07,"text":"by itself because you just have to do search in some sense, in many cases. And actually, most of the search system these days, except some of the legacy system like Google. I think Google is also using semantic search to some degree, but we don't know exactly. It's kind of like a more fusion of many, many methods. But most of the new methods, if you implement a semantic search system yourself, you probably should use these kind of ideas. And there's one more application beyond semantic search."},{"start":3218.99,"text":"in the large English model area, which is you use this in the so-called retrieval argument generation. And the motivation is that"}],"speech_gaps":[],"frame":"../frames/v043/019.webp","frame_time":3083.99},{"title":"大语言模型与下一词预测损失","segments":[{"id":297,"text":"Once the large-language model came out, they are often off the shelf, just a generic large-language model. So they are divided by some of these frontier labs. And they don't see the proprietary information of another enterprise. So because those informations","zh":"一旦大型语言模型问世，它们通常是现成的，只是一个通用的大型语言模型。因此，它们被一些前沿实验室所划分。它们无法看到其他企业的专有信息。因此，这些信息","start":3242.36,"end":3256.82},{"id":298,"text":"they cannot be leaked to the training data of the Frontier Labs. But these enterprises or even just yourself, imagine you want to have some kind of personal assistant and you have some information that you are not comfortable with sending to the Frontier Labs for training.","zh":"无法泄露给前沿实验室的训练数据。但这些企业，甚至你自己，想象一下，你想要拥有某种个人助手，并且你有一些不愿意发送给前沿实验室进行训练的信息。","start":3257.54,"end":3276.76},{"id":299,"text":"And then you have to somehow let the models to ingest this additional information, the proprietary information, in some form at a test time. And how do you ingest this additional information to the large ambush model?","zh":"然后你必须以某种方式让模型在测试时摄入这些额外的信息，即专有信息。你如何将这些额外的信息摄入到大型语言模型中？","start":3277.55,"end":3291.15},{"id":300,"text":"There are several different ways. One way is you fine-tune. You fine-tune on your own data, starting from the base model. Oftentimes, the issue with that is that that's actually a good idea for some applications. But in some other cases, it's just too expensive. You only have a small data set, and you don't want to host a trillion parameter models on your .","zh":"有几种不同的方法。一种方法是你进行微调。你从基础模型开始，使用你自己的数据进行微调。通常，这种方法在某些应用中是一个好主意。但在其他情况下，这可能只是太昂贵了。你可能只有一小部分数据集，而且你不希望在你的 GPU 上托管万亿参数的模型，或者可能只是不想支付微调和托管这些模型的成本。","start":3291.71,"end":3314.71},{"id":301,"text":"GPU, or maybe just pay for the cost to fine tune and host those models. So a simpler approach is the so-called retrieval augment generation approach. And what it does is that it's very simple. So basically, you have a query.","zh":"因此，一个更简单的方法是所谓的检索增强生成方法。它的做法非常简单。基本上，你有一个查询。","start":3314.84,"end":3331.02},{"id":302,"text":"and you have a corpus, let's say you have a lot of documents on your laptop, or you have a lot of documents in the enterprise which are proprietary, and you say, at the last time you do this retrieval, so you first do retrieval to get some relevant...","zh":"你还有一个语料库，比如说你在笔记本电脑上有大量文档，或者在企业中有大量专有文档，你可以说，在最后一次执行此检索时，你首先进行检索以获取一些相关的...","start":3332.01,"end":3351.53},{"id":303,"text":"to get some relevant documents from your corpus, right? So like maybe you get some of your own, maybe your bank statement, you know, like your other information on your laptop, or maybe in enterprise, they can get the CEO's memo, all of those. And so this retrieval step is exactly something like this, and you get some relevant documents. And then you send a subset of relevant documents, which often is probably five documents, 10 documents to a large language model.","zh":"以获取一些相关的文档，对吧？比如说，你可能会获取一些你自己的，比如你的银行对账单，你知道的，比如你在笔记本电脑上的其他信息，或者在企业中，他们可以获取首席执行官的备忘录，所有这些。因此，这个检索步骤正是如此，你获取一些相关的文档。然后你将一部分相关的文档，通常是五到十份文档，发送给大型语言模型。","start":3354.32,"end":3385.85},{"id":304,"text":"And then you give them in the context of the large-language model. Basically, you just send this to the large-language model. And then the large-language model will also see the query and also the documents together and then generate the answer.","zh":"然后你将这些内容放在大语言模型的上下文中。基本上，你只需将这些内容发送给大语言模型。然后，大语言模型也会看到查询和文档，并生成答案。","start":3387.52,"end":3400.0}],"notes":["本段讨论了大语言模型在实际应用中面临的隐私问题，特别是企业或个人在使用这些模型时，如何避免将敏感信息泄露给训练数据。讲者指出，大语言模型通常是现成的，但企业或个人可能需要在测试时将专有信息输入模型。","讲者提到，一种解决方法是微调模型，但这种方法在数据量小或成本高的情况下可能不可行。因此，提出了检索增强生成（retrieval-augmented generation）方法，即在查询时从本地或企业文档库中检索相关文档，并将这些文档作为上下文输入模型。","检索增强生成方法的关键在于如何从文档库中检索出与查询相关的文档，并将这些文档与查询一起输入模型，以生成更准确的回答。这种方法避免了将敏感信息直接输入模型训练数据的问题。","讲者还提到，检索步骤类似于传统的信息检索方法，例如从本地计算机或企业文档库中找到相关的文档，如银行对账单或CEO备忘录等。然后，将这些文档作为上下文输入模型，以生成最终的回答。","这种方法的优势在于，它可以在不泄露敏感信息的情况下，利用模型的生成能力来回答问题。同时，这种方法也避免了微调模型的高昂成本和计算资源需求。","讲者强调，检索增强生成方法是一种相对简单且有效的解决方案，适用于需要在测试时输入专有信息的场景。这种方法在实际应用中具有重要的意义，尤其是在隐私保护和数据安全方面。"],"formulas":[],"uncertainties":["large ambush model"],"diagram":"none","start":3242.36,"end":3400.0,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3242.36,"text":"Once the large-language model came out, they are often off the shelf, just a generic large-language model. So they are divided by some of these frontier labs. And they don't see the proprietary information of another enterprise. So because those informations"},{"start":3257.54,"text":"they cannot be leaked to the training data of the Frontier Labs. But these enterprises or even just yourself, imagine you want to have some kind of personal assistant and you have some information that you are not comfortable with sending to the Frontier Labs for training."},{"start":3277.55,"text":"And then you have to somehow let the models to ingest this additional information, the proprietary information, in some form at a test time. And how do you ingest this additional information to the large ambush model?"},{"start":3291.71,"text":"There are several different ways. One way is you fine-tune. You fine-tune on your own data, starting from the base model. Oftentimes, the issue with that is that that's actually a good idea for some applications. But in some other cases, it's just too expensive. You only have a small data set, and you don't want to host a trillion parameter models on your ."},{"start":3314.84,"text":"GPU, or maybe just pay for the cost to fine tune and host those models. So a simpler approach is the so-called retrieval augment generation approach. And what it does is that it's very simple. So basically, you have a query."},{"start":3332.01,"text":"and you have a corpus, let's say you have a lot of documents on your laptop, or you have a lot of documents in the enterprise which are proprietary, and you say, at the last time you do this retrieval, so you first do retrieval to get some relevant..."},{"start":3354.32,"text":"to get some relevant documents from your corpus, right? So like maybe you get some of your own, maybe your bank statement, you know, like your other information on your laptop, or maybe in enterprise, they can get the CEO's memo, all of those. And so this retrieval step is exactly something like this, and you get some relevant documents. And then you send a subset of relevant documents, which often is probably five documents, 10 documents to a large language model."},{"start":3387.52,"text":"And then you give them in the context of the large-language model. Basically, you just send this to the large-language model. And then the large-language model will also see the query and also the documents together and then generate the answer."}],"speech_gaps":[],"frame":"../frames/v043/020.webp","frame_time":3254.36},{"title":"大语言模型与下一词预测损失","segments":[{"id":305,"text":"So this way, you don't have to modify the large language model's internal state. You don't have to change the parameters. You are just giving the large language model additional information in a chat interface in some sense. We haven't talked too much about the context of all of those, but you can imagine you just send this information to the large language model as the augmentation of the generation. So this has, of course, there are","zh":"这样，你就不需要修改大语言模型的内部状态。你也不需要更改参数。你只是在某种意义上通过聊天界面向大语言模型提供额外的信息。我们还没有过多讨论这些上下文，但你可以想象，你只是将这些信息作为生成的增强传递给大语言模型。当然，这种方法也有","start":3402.33,"end":3424.31},{"id":306,"text":"trade-offs for different ways to ingesting the different ways of ingesting proprietary information. The nice thing about this is that it's very modularized because this is a retrieval thing, which is almost completely separated from the large language model. And you can deal with many kinds of data governance very easily. For example, you can say, oh, some users don't see these documents, right? Some users don't have permissions to see the earning.","zh":"不同方式摄入专有信息所带来的权衡。这种方法的优点是它非常模块化，因为这属于检索问题，几乎完全与大语言模型分离。你可以非常容易地处理各种数据治理问题。例如，你可以说明，某些用户看不到这些文档，对吧？某些用户没有权限查看收益。","start":3424.87,"end":3448.91},{"id":307,"text":"projection in the company, in advance. So then you just forbid those people to have the retrieval, to see those information in the retrieval phase. And then they wouldn't see those additional data. And it's easy to delete information because you just delete your information from your corpus, then it will be never retrieved at all. So it's easier to forget.","zh":"公司内部的投影，提前进行。因此，你只需禁止这些人员在检索阶段进行检索，看不到这些信息。然后他们就不会看到这些额外的数据。删除信息也很容易，因为你只需从你的语料库中删除信息，它就永远不会被检索到。因此，更容易忘记。","start":3450.24,"end":3471.42},{"id":308,"text":"And also, it's kind of somewhat cheap because the retrieval step is always cheaper, much cheaper. So in contrast, for example, if you fine-tune a large language model on all the data in your enterprise, then to delete it is actually not that easy. How do you forget about something by un-fine-tuning it is actually still a very open question. But here, this is a very clean way to deal with it. Yeah, anything else?","zh":"此外，这种方法在成本上也相对较低，因为检索步骤总是更便宜，便宜得多。相比之下，例如，如果你在企业内的所有数据上微调大语言模型，那么删除它实际上并不容易。如何通过反微调来忘记某些信息，实际上仍然是一个非常开放的问题。但在这里，这是一种非常干净的处理方式。是的，还有其他问题吗？","start":3473.14,"end":3503.0},{"id":309,"text":"Oh, maybe another thing is that, you know, speaking of about the most frontier approach, I think these days, you know, anthropic, they are actually using a different type of like search algorithms for this phase. So they don't necessarily do all the semantical search. What they do is that they just use the regular expression matching. So they use language models to generate some.","zh":"哦，也许还有另一件事，说到最前沿的方法，我认为如今，像Anthropic这样的公司实际上在这一阶段使用了不同类型的搜索算法。他们不一定进行所有语义搜索。他们所做的只是使用正则表达式匹配。他们使用语言模型生成一些。","start":3507.31,"end":3529.49},{"id":310,"text":"regular expression to search for certain keywords. But the regular expression can be very complicated. You can probably have... I don't know exactly because you cannot really see all the... on what the frontier models always do because they are hidden in some sense. But I think the common understanding seems to be that you generate a lot of regular expressions to search for various variants of the keywords. You try to search for all kinds of patterns and then you search relevant documents this way.","zh":"使用正则表达式来搜索某些关键词。但是正则表达式可能非常复杂。你可能可以拥有……我不确定具体原因，因为你无法真正看到……前沿模型总是做什么，因为它们在某种意义上是隐藏的。但我想普遍的理解似乎是，你生成大量的正则表达式来搜索各种关键词的变体。你尝试搜索各种模式，然后通过这种方式搜索相关文档。","start":3529.93,"end":3558.59},{"id":311,"text":"And this works pretty well for code, partly because the code structure, the riposte for code is often much more structured. Doing regular expression search can give you a lot of knowledge already. You have the very structured file.","zh":"这种方法在代码上效果相当不错，部分原因是代码结构，对代码的回应往往更加结构化。使用正则表达式搜索可以为你提供大量的知识。你拥有非常结构化的文件。","start":3558.92,"end":3576.0}],"notes":["本段主要讨论了在大语言模型中如何通过检索机制来处理专有信息，而不是直接修改模型参数。这种方式具有模块化的优势，因为检索过程与模型本身是分离的，便于数据治理。例如，可以通过权限控制来限制某些用户访问特定文档，或者通过删除语料库中的信息来实现信息的删除。","此外，这种方式在成本上也更具优势，因为检索步骤通常比微调模型便宜得多。相比之下，如果对整个企业数据进行微调，删除信息会更加困难，因为无法通过反向微调来实现。而通过检索机制，可以更干净、更简单地处理信息的删除问题。","在前沿方法中，一些公司如Anthropic使用了不同的搜索算法，例如正则表达式匹配，而不是完全的语义搜索。他们利用语言模型生成正则表达式来搜索特定关键词的变体，从而找到相关的文档。这种方法在处理代码时效果较好，因为代码结构通常更加规范，正则表达式搜索可以提供大量有用的信息。","然而，这些前沿方法的具体实现细节仍然不透明，因为它们通常被封装在模型内部。尽管如此，普遍认为生成大量正则表达式来搜索关键词的不同变体是一种常见的做法。这种方法在处理结构化数据时表现良好，但可能在处理非结构化文本时效果有限。","本段还提到，通过检索机制可以实现信息的删除和权限控制，这在数据治理和隐私保护方面具有重要意义。同时，这种方式也避免了对模型参数的直接修改，从而保持了模型的稳定性和一致性。","最后，讲者提到，虽然这些方法在实际应用中存在一定的挑战，但它们提供了一种相对简单和有效的解决方案，特别是在处理大规模数据和复杂权限控制时。"],"formulas":[],"uncertainties":["riposte for code"],"diagram":"none","start":3402.33,"end":3576.0,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3402.33,"text":"So this way, you don't have to modify the large English model's internal state. You don't have to change the parameters. You are just giving the large English model additional information in a chat interface in some sense. We haven't talked too much about the context of all of those, but you can imagine you just send this information to the large English model as the augmentation of the generation. So this has, of course, there are"},{"start":3424.87,"text":"trade-offs for different ways to ingesting the different ways of ingesting proprietary information. The nice thing about this is that it's very modularized because this is a retrieval thing, which is almost completely separated from the large language model. And you can deal with many kind of data governance very easily. For example, you can say, oh, some users don't see these documents, right? Some users don't have permissions to see the earning."},{"start":3450.24,"text":"projection in the company, in advance. So then you just forbid those people to have the retrieval, to see those information in the retrieval phase. And then they wouldn't see those additional data. And it's easy to delete information because you just delete your information from your corpus, then it will be never retrieved at all. So it's easier to forget."},{"start":3473.14,"text":"And also, it's kind of somewhat cheap because the retrieval step is always cheaper, much cheaper. So in contrast, for example, if you fine-tune a large language model on all the data in your enterprise, then to delete it is actually not that easy. How do you forget about something by un-fine-tuning it is actually still a very open question. But here, this is a very clean way to deal with it. Yeah, anything else?"},{"start":3507.31,"text":"Oh, maybe another thing is that, you know, speaking of about the most frontier approach, I think these days, you know, anthropic, they are actually using a different type of like search algorithms for this phase. So they don't necessarily do all the semantical search. What they do is that they just use the regular expression matching. So they use language models to generate some."},{"start":3529.93,"text":"regular expression to search for certain keywords. But the regular expression can be very complicated. You can probably have... I don't know exactly because you cannot really see all the... on what the frontier models always do because they are hidden in some sense. But I think the common understanding seems to be that you generate a lot of regular expressions to search for various variants of the keywords. You try to search for all kinds of patterns and then you search relevant documents this way."},{"start":3558.92,"text":"And this works pretty well for code, partly because the code structure, the riposte for code is often much more structured. Doing regular expression search can give you a lot of knowledge already. You have the very structured file."}],"speech_gaps":[],"frame":"../frames/v043/021.webp","frame_time":3414.33},{"title":"大语言模型与下一词预测损失","segments":[{"id":312,"text":"a file tree, and you have a very strict kind of keywords for all the variables in some sense, the function names, all of those. So that makes it a little bit easier to use regular expression. But semantic retrieval, I think, are still, at least so far, they are still very useful for many other cases where this kind of like a","zh":"一个文件树，你对所有变量的关键词有非常严格的一种类型，函数名，所有这些。这使得使用正则表达式变得稍微容易一些。但语义检索，我认为，至少到目前为止，它们在许多其他情况下仍然非常有用，这种像记录表达式的方法处理起来有点困难。或者也许你应该结合使用它们，如此等等。基本上，我认为这种检索论点生成是非常清晰的，这非常必要。但你确切如何进行检索仍然取决于你的应用。而且我们还不知道哪种方法是最好的。","start":3578.03,"end":3599.11},{"id":313,"text":"record expression-based approach is a little harder to deal with. Or maybe you should do both of the combination of them, and so on and so forth. So basically, I think this retrieval argument generation is pretty clear that this is very much needed. But how do you exactly do the retrieval still depends on your applications. And we don't know exactly which one is the best way yet.","zh":"基于表达式的记录方法有点难以处理。或者也许你应该结合使用它们两者，如此等等。因此，我认为这种检索与生成的论点已经很清楚，这非常必要。但你究竟如何进行检索仍然取决于你的应用场景。而且我们还不知道哪种方法是最佳的方式。","start":3600.04,"end":3625.04},{"id":314,"text":"Okay, I think I don't have anything to say that can be done in 10 minutes. So maybe we'll just stop here for today.","zh":"好的，我认为我没有什么可以在十分钟内完成的事情。所以也许我们今天就到这里吧。","start":3626.99,"end":3636.11}],"notes":["本段讨论了在编程和自然语言处理中，使用严格的关键词和文件树结构可以简化正则表达式的使用，但语义检索在处理更复杂的表达式时仍然具有优势。讲者提到，结合使用这两种方法可能是更好的选择，但具体方法仍取决于应用场景。","讲者指出，虽然检索和生成的结合是必要的，但如何具体实施仍不明确，目前还没有确定的最佳方法。这表明在实际应用中需要根据具体情况选择合适的策略。","讲者提到，由于时间限制，无法在10分钟内进一步深入讨论，因此课程可能在此结束。这表明课程内容可能已经覆盖了主要概念，但仍有进一步探讨的空间。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3578.03,"end":3636.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":3,"raw_segments":[{"start":3578.03,"text":"a file tree, and you have a very strict kind of keywords for all the variables in some sense, the function names, all of those. So that makes it a little bit easier to use regular expression. But semantic retrieval, I think, are still, at least so far, they are still very useful for many other cases where this kind of like a"},{"start":3600.04,"text":"record expression-based approach is a little harder to deal with. Or maybe you should do both of the combination of them, and so on and so forth. So basically, I think this retrieval argument generation is pretty clear that this is very much needed. But how do you exactly do the retrieval still depends on your applications. And we don't know exactly which one is the best way yet."},{"start":3626.99,"text":"Okay, I think I don't have anything to say that can be done in 10 minutes. So maybe we'll just stop here for today."}],"speech_gaps":[],"frame":"../frames/v043/022.webp","frame_time":3590.03}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v043.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
