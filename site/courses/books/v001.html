 in. Yes. How much probability? Basic. You need to know like probability one on one, but you really need to know it."},{"start":1208.88,"text":"Right. Well, I mean, it's very basic stuff. You know what a density is, what a CDF is, what conditioning is, what independence really means, you know. So it's all probability one. If we go beyond that, we prepare you with, we'll remind you like what a moment generating function is or something like that. Right. So, yeah. Okay. Cool. Yeah. Any, yeah."},{"start":1233.82,"text":"Compared to the YouTube version, because this has been recorded in the past, how different are the lectures?"},{"start":1241.52,"text":"Oh, that's a good question."},{"start":1243.32,"text":"Yeah, so let me say a little bit about what's available online."},{"start":1246.62,"text":"Oh, the first thing is, it will take you about four seconds to find usually weird old versions of solutions of the homework."},{"start":1255.8,"text":"Which, you know, whatever, I mean, you can get them or not."},{"start":1258.62,"text":"That's not the point."},{"start":1259.34,"text":"the the point of the homework which I would you know it's actually very"},{"start":1264.2,"text":"important it doesn't count for much you great takes a long time actually those"},{"start":1267.82,"text":"problems all started as final exam problems that that's where they all came"},{"start":1272.12,"text":"from right so so so the people at one point said hey final exams coming up I'm"},{"start":1277.74,"text":"nervous how do I train for it I'm like dude you've been doing final exam"},{"start":1282.18,"text":"problems the entire quarter that's what do you think what do you think the"},{"start":1284.96,"text":"homework I mean we modify them a little bit because you know if it's a homework"},{"start":1288.46,"text":"word problem we can be a little more vague and i don't know it could be more of a pain in the ass"},{"start":1292.7,"text":"take longer to solve that kind of thing so you know but but the point is there's some editing"},{"start":1298.02,"text":"in style but roughly speaking that's that's what they are so um and there i'd actually i mean i"},{"start":1304.34,"text":"kind of recommend uh if you if it if it works for your learning style working in working on the"},{"start":1309.56,"text":"homework in groups right so that i mean again that's if that's your learning style that's a"},{"start":1315.24,"text":"a good way to do it. If you do that, collect yourself a group of people. You do not want"},{"start":1321.9,"text":"the people in your group to be polite. Don't want that. So the worst thing that could happen"},{"start":1326.3,"text":"is, you know, because you learn by explaining."}],"speech_gaps":[],"frame":"../frames/v001/008.webp","frame_time":1162.27},{"title":"课堂互动与跨学科背景","segments":[{"id":91,"text":"Right. At least that's how I learn. And so what will happen is if you have a polite group and you explain this and they go like, oh, yeah, yeah, totally. Oh, yeah, sure. Yeah. And like what you want, you want someone in your group is like, sorry, I didn't understand one thing you said. Right. And that's a hint. Right. I mean, if if that's all they ever say, you can kick them out of your group. But but the point is, that's actually what you want. OK, something something like that. Yeah.","zh":"对的。至少这是我学习的方式。然后会发生的是，如果你有一个礼貌的小组，并且你解释了这一点，他们可能会说，哦，对，对，完全正确。哦，对，当然。然后你想要的是，你小组里有人会说，抱歉，我刚才没听懂你说的一点。对的。这其实是个提示。对的。我的意思是，如果他们只说这些，你可以把他们踢出小组。但是重点是，这其实是你想要的。好的，差不多是这样。","start":1328.96,"end":1356.42},{"id":92,"text":"I should say a little bit more. I'll say this a little bit more about backgrounds and stuff like that. So we have people from 20 departments in this class right now.","zh":"我应该再多说一点。我会再多说一点关于背景和类似的内容。现在这门课有来自20个部门的学生。","start":1357.32,"end":1364.94},{"id":93,"text":"right so uh which is really cool so and for me it's super fun because it's basically it is a cross-cultural experience that's a cross mathematical cultural experience right so you know it's kind of fun right you maybe you do i don't know genetics and the person next to you does like drones or something or somebody does machine learning i don't know or you know economics so um it's fun and uh and there are a bit there are a few rules there so like","zh":"对，所以嗯，这真的很酷，而且对我来说超级有趣，因为基本上这是一次跨文化的体验，是一次跨数学文化的体验。对吧？你知道，这有点有趣。你可能做遗传学，而旁边的人做无人机之类的东西，或者有人做机器学习，或者你知道的，经济学。嗯，这很有趣，而且嗯，还有一些规则。比如","start":1365.3,"end":1392.26},{"id":94,"text":"What we do there, these are the standard obvious rules. If you walk in the room and basically not everyone speaks Tamil, you switch to English. I mean, hello. That's just normal. The same thing here. We're going to see a lot of different fields that use this, a whole lot of them. Actually, a lot of them have dialects, including the ones I come from. I mean, strong dialects. By the way, no field thinks they have a dialect.","zh":"我们在那里做的，这些是标准的、显而易见的规则。如果你走进房间，基本上不是每个人都会说泰米尔语，你就切换成英语。我是说，你好。这很正常。同样的情况在这里。我们会看到很多使用这个领域的不同学科，有很多。实际上，其中很多领域都有方言，包括我来自的领域。我是说，强烈的方言。顺便说一句，没有哪个领域会认为自己有方言。","start":1393.14,"end":1421.18},{"id":95,"text":"But in fact, they all have, and some are like HIC dialects. I can tell you, like, you know, statistics has a dialect. It does. Econ, terrible one. Oh, my God. Signal processing, that's like physics. Oh, my God. Don't even get me started on that. Machine learning is just off scale. Like, I don't even know where that came from. I guess it's from not knowing the basics or something. I don't know. I don't know. Like how, I don't know where you would, but, you know.","zh":"但实际上，它们都有，而且有些是HIC方言。我可以告诉你，比如，统计学有方言。确实如此。经济学，糟糕透顶。哦，我的天。信号处理，那就像物理学。哦，我的天。别提信号处理了。机器学习简直超出了尺度。就像，我不知道它从哪里来的。我想可能是由于不了解基础知识，或者其他什么。我不知道。我不知道。比如，我不知道你会在哪里，但你知道。","start":1421.68,"end":1449.32},{"id":96,"text":"I'm fluent in several of these dialects, but not all. But I understand a lot of them and I would recognize them so I could intervene. But the rules apply here. If you find yourself in a small group and everybody speaks signal processing, feel free to switch to signal processing dialect by all means or machine learning, whatever you like. But if a normal person shows up, you switch to what we call high BBC mathematics.","zh":"我精通其中几种方言，但并非全部。但我理解很多内容，并且能够识别它们，因此我可以介入。但这里的规则适用。如果你发现自己在一个小组中，而所有人都在使用信号处理的术语，那么不妨随意切换到信号处理或机器学习的术语，无论你喜欢哪种。但如果一个普通人出现，你们就要切换到我们所说的高BBC数学。","start":1450.33,"end":1476.69},{"id":97,"text":"Okay, so that means you speak, you know, at this level using a lexicon and language that anyone mathematically trained should understand. Because that's how you go back. If I talk to someone in finance and they start blabbering stuff and I have no idea what they're talking about, I was like, whoa, dude, let's slow down, right? I'd say, what does that even mean? And then theoretically, we can all back up until we get to math.","zh":"好的，这意味着你使用的是一个任何受过数学训练的人都应该能够理解的词汇和语言。因为这就是我们回退的方式。如果我和一个金融人士交谈，他们开始说一些我完全听不懂的内容，我会说，哇，伙计，放慢点，对吧？我会问，那到底是什么意思？然后理论上，我们都可以回退到数学的基础。","start":1477.58,"end":1500.94}],"notes":["本段主要讨论课堂互动方式，强调在小组讨论中，如果有人表示不理解，这实际上是一个积极的信号，表明需要更清晰的解释。同时，讲者提到课堂成员来自不同学科背景，如遗传学、无人机、机器学习和经济学等，这种多样性为学习提供了丰富的视角。","讲者提到课堂中存在一些规则，例如在非英语环境中切换为英语，以及在不同学科领域中使用特定术语时的沟通方式。这些规则有助于确保所有参与者都能理解讨论内容。","讲者用“dialects”来比喻不同学科领域中的术语和表达方式，指出每个领域都有其独特的术语体系，但这些术语体系之间存在差异，有时甚至难以理解。","讲者提到自己对某些学科的术语体系较为熟悉，但并非全部。他强调在跨学科讨论中，需要使用一种通用的数学语言，以便所有参与者都能理解。","讲者通过举例说明，如果在与金融领域的人交流时遇到术语障碍，可以通过回到数学基础来解决沟通问题，这体现了数学作为通用语言的重要性。","讲者最后强调，课堂讨论应保持在数学训练者都能理解的水平，以确保所有参与者都能有效沟通和学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1328.96,"end":1500.94,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1328.96,"text":"Right. At least that's how I learn. And so what will happen is if you have a if you have a polite group and you explain this and they go like, oh, yeah, yeah, totally. Oh, yeah, sure. Yeah. And like what you want, you want someone in your group is like, sorry, I didn't understand one thing you said. Right. And that's a hint. Right. I mean, if if that's all they ever say, you can kick them out of your group. But but the point is, that's actually what you want. OK, something something like that. Yeah."},{"start":1357.32,"text":"I should say a little bit more. I'll say this a little bit more about backgrounds and stuff like that. So we have people from 20 departments in this class right now."},{"start":1365.3,"text":"right so uh which is really cool so and for me it's super fun because it's basically it is a cross-cultural experience that's a cross mathematical cultural experience right so you know it's kind of fun right you maybe you do i don't know genetics and the person next to you does like drones or something or somebody does machine learning i don't know or you know economics so um it's fun and uh and there are a bit there are a few rules there so like"},{"start":1393.14,"text":"What we do there, these are the standard obvious rules. If you walk in the room and basically not everyone speaks Tamil, you switch to English. I mean, hello. That's just normal. The same thing here. We're going to see a lot of different fields that use this, a whole lot of them. Actually, a lot of them have dialects, including the ones I come from. I mean, strong dialects. By the way, no field thinks they have a dialect."},{"start":1421.68,"text":"But in fact, they all have, and some are like HIC dialects. I can tell you, like, you know, statistics has a dialect. It does. Econ, terrible one. Oh, my God. Signal processing, that's like physics. Oh, my God. Don't even get me started on that. Machine learning is just off scale. Like, I don't even know where that came from. I guess it's from not knowing the basics or something. I don't know. I don't know. Like how, I don't know where you would, but, you know."},{"start":1450.33,"text":"I'm fluent in several of these dialects, but not all. But I understand a lot of them and I would recognize them so I could intervene. But the rules apply here. If you find yourself in a small group and everybody speaks signal processing, feel free to switch to signal processing dialect by all means or machine learning, whatever you like. But if a normal person shows up, you switch to what we call high BBC mathematics."},{"start":1477.58,"text":"Okay, so that means you speak, you know, at this level using a lexicon and language that anyone mathematically trained should understand. Because that's how you go back. If I talk to someone in finance and they start blabbering stuff and I have no idea what they're talking about, I was like, whoa, dude, let's slow down, right? I'd say, what does that even mean? And then theoretically, we can all back up until we get to math."}],"speech_gaps":[],"frame":"../frames/v001/009.webp","frame_time":1340.96},{"title":"课程介绍与优化问题概述","segments":[{"id":98,"text":"and then they can say it. Then they can hopefully explain what they're trying to say, right? So that's kind of what we're going to do. But well, every now and then, actually, just for cultural enrichment, I might mention some dialect things. Also, that's a social advantage for you because if you find yourself at a party and all of a sudden, there you are with a bunch of like quants, I'll tell you a couple of words you drop and they'll go like, what? Like that. So that's just for fun, though. That's for cultural enrichment. So, okay. All right.","zh":"然后他们可以说出来。然后他们希望能解释自己想表达的意思，对吧？所以这就是我们接下来要做的事情。不过实际上，偶尔我也会提到一些方言的内容。这也是你的一个社交优势，因为如果你发现自己在派对上，突然就和一群量化分析师在一起，我会告诉你几个你可以说的词，他们就会说，什么？就像这样。不过这只是为了好玩，只是为了文化丰富。所以，好的。好了。","start":1501.47,"end":1530.39},{"id":99,"text":"Now I think I have covered everything. Any questions about it? Okay. So we're going to jump into just a big overview lecture. And don't get the wrong idea. This is absolutely not representative. First of all, I'll go fast. I won't define a lot of terms, which is not what's going to happen during the class. Everything I'm about to talk about, we will talk about in hideous detail in the next four to five weeks. So don't worry about that.","zh":"我认为我已经讲完了所有内容。有关于这些内容的问题吗？好的。接下来我们将进行一个大致的概述讲座。不要误解我的意思。这绝对不代表整个课程内容。首先，我会讲得很快。我不会定义很多术语，这并不是课堂上将要发生的事情。我接下来要讲的一切内容，我们将在接下来的四到五周内详细讨论。所以不用担心这一点。","start":1530.96,"end":1558.78},{"id":100,"text":"So this is not representative, but we'll go over it. So I'll start with just a quick informal introduction to what is mathematical optimization. We'll talk about actually probably the two most important problem classes there are. Least squares is for sure number one, and number two, I think would probably be linear programming. We'll talk about that. Then in fact,","zh":"所以这并不是代表整个课程内容，但我们还是会讲一遍。我将从一个快速的非正式介绍开始，介绍什么是数学优化。我们将讨论实际上最重要的两个问题类别。最小二乘法肯定是第一，第二，我认为可能是线性规划。我们将讨论这些内容。事实上，","start":1562.41,"end":1588.37},{"id":101,"text":"the parent of those is actually convex optimization. So we'll get to that, which is more. So it's just to orient you into how, you know, what is the whole, what's the big picture, okay? And I'll say a little bit, we'll look at a little example and stuff like that. And I'll say a little bit about a brief history of it.","zh":"这些内容的父类实际上是凸优化。我们将讲到这一点，这会更深入一些。所以这只是为了让你了解整体情况，你知道的，整个图景是怎样的，对吧？我会说一点，我们会看一个小小的例子，以及类似的内容。我还会简要地讲一点它的简要历史。","start":1589.77,"end":1607.67},{"id":102,"text":"Okay, so here's what an optimization problem is. And I'm going to, you know, we'll go over this a lot more in much more detail later, right? But so now this is just a quick, quick, fast introduction. Okay, so...","zh":"好的，这就是一个优化问题。我将会，你知道的，我们会在之后更详细地讲这个内容，对吧？但现在这只是快速、快速、快速的介绍。好的，所以……","start":1608.72,"end":1621.98},{"id":103,"text":"So it's an optimization problem that looks like this. And there's some critical components. Number one is you have to have something called the optimization variable. Actually, so here's a phrase people use in management science for this and operations research. They call these the decision variables, which is a fantastic name because it tells you these are the things you need to choose. So that's decision variable. But that's dialect. So people in math would say, what are you talking? Would not know what that means.","zh":"因此，这是一个看起来像这样的优化问题。其中有一些关键组成部分。第一点是你必须拥有一个被称为优化变量的东西。实际上，这是管理科学和运筹学中人们用来描述这种变量的术语。他们称之为决策变量，这是一个极好的名称，因为它告诉你这些是你需要选择的事物。因此这就是决策变量。但这是术语的差异。数学家们会说，你在说什么？他们不会知道这个意思。","start":1623.56,"end":1650.84},{"id":104,"text":"So you have the variables that you're going to choose. And then you have a couple of components. And by the way, I actually think of a problem in my own mind. By the way, minimize is not min. Min is a mathematical operator. It has only one definition and has always only had one definition. It takes as argument a finite set of numbers, and it returns the smallest one.","zh":"你有一些你要选择的变量，然后你还有几个组成部分。顺便说一句，我自己在脑海中会想到一个具体的问题。顺便说一句，最小化并不是“min”。‘Min’是一个数学运算符。它只有一个定义，而且一直只有一个定义。它接受一个有限的数值集合作为参数，并返回其中最小的那个。","start":1653.43,"end":1676.9}],"notes":["本段主要讲解了优化问题的基本概念，包括优化变量（decision variables）和最小化操作符（min）的定义。讲者指出，'min' 是一个数学运算符，其定义是明确的，它接受一个有限数集作为输入，并返回其中最小的数。讲者还提到，'decision variables' 是运筹学和管理科学中常用的术语，用来表示需要选择的变量，而数学家可能不熟悉这个术语。","讲者强调了优化问题的结构，包括优化变量、目标函数和约束条件。他指出，虽然在课堂上会详细讲解这些内容，但本段只是快速介绍。讲者还提到，'min' 是一个数学运算符，而不是一个动词，它有唯一的定义，不能被误解为其他含义。","讲者通过对比不同领域对同一概念的称呼，展示了术语的多样性。例如，'decision variables' 是运筹学中的术语，而数学家可能更倾向于使用更通用的术语如 'variables'。这种差异反映了不同学科对同一概念的不同表达方式。","讲者还指出，'min' 是一个数学运算符，其定义是严格的，它只能作用于有限数集。这一点对于理解优化问题的数学基础非常重要，因为优化问题通常涉及寻找最小值或最大值。","讲者通过强调术语的准确性和定义的唯一性，帮助学生建立对优化问题的正确理解。他提醒学生注意术语的使用，避免混淆不同的概念，例如将 'min' 误认为是一个动词。","最后，讲者提到，虽然本段只是快速介绍，但后续课程会详细讲解优化问题的各个方面，包括目标函数、约束条件和优化变量等。这为学生后续学习奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1501.47,"end":1676.9,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1501.47,"text":"and then they can say it. Then they can hopefully explain what they're trying to say, right? So that's kind of what we're going to do. But well, every now and then, actually, just for cultural enrichment, I might mention some dialect things. Also, that's a social advantage for you because if you find yourself at a party and all of a sudden, there you are with a bunch of like quants, I'll tell you a couple of words you drop and they'll go like, what? Like that. So that's just for fun, though. That's for cultural enrichment. So, okay. All right."},{"start":1530.96,"text":"Now I think I have covered everything. Any questions about it? Okay. So we're going to jump into just a big overview lecture. And don't get the wrong idea. This is absolutely not representative. First of all, I'll go fast. I won't define a lot of terms, which is not what's going to happen during the class. Everything I'm about to talk about, we will talk about in hideous detail in the next four to five weeks. So don't worry about that."},{"start":1562.41,"text":"So this is not representative, but we'll go over it. So I'll start with just a quick informal introduction to what is mathematical optimization. We'll talk about actually probably the two most important problem classes there are. Least squares is for sure number one, and number two, I think would probably be linear programming. We'll talk about that. Then in fact,"},{"start":1589.77,"text":"the parent of those is actually convex optimization. So we'll get to that, which is more. So it's just to orient you into how, you know, what is the whole, what's the big picture, okay? And I'll say a little bit, we'll look at a little example and stuff like that. And I'll say a little bit about a brief history of it."},{"start":1608.72,"text":"Okay, so here's what an optimization problem is. And I'm going to, you know, we'll go over this a lot more in much more detail later, right? But so now this is just a quick, quick, fast introduction. Okay, so..."},{"start":1623.56,"text":"So it's an optimization problem that looks like this. And there's some critical components. Number one is you have to have something called the optimization variable. Actually, so here's a phrase people use in management science for this and operations research. They call these the decision variables, which is a fantastic name because it tells you these are the things you need to choose. So that's decision variable. But that's dialect. So people in math would say, what are you talking? Would not know what that means."},{"start":1653.43,"text":"So you have the variables that you're going to choose. And then you have a couple of components. And by the way, I actually think of a problem in my own mind. By the way, minimize is not min. Min is a mathematical operator. It has only one definition and has always only had one definition. It takes as argument a finite set of numbers, and it returns the smallest one."}],"speech_gaps":[],"frame":"../frames/v001/010.webp","frame_time":1513.47},{"title":"优化问题的定义与约束","segments":[{"id":105,"text":"Period. That's what min is. Minimize is actually a different thing. I mean, it's a similar idea. I actually think of this as a constructor for a problem. That's really what that is. So I actually think of this in an object-oriented way, and I believe that's absolutely the correct way to do it. So an optimization problem is actually an object in an object-oriented language, and it has different attributes and fields. It's got an objective.","zh":"好了。这就是min的意思。最小化实际上是一个不同的概念。我的意思是，它是一个类似的想法。我实际上把这看作是一个问题的构造器。这就是它的真正含义。因此，我实际上以面向对象的方式来看待这个问题，我相信这是绝对正确的方法。因此，一个优化问题实际上是一个面向对象语言中的对象，它有不同的属性和字段。它有一个目标函数。","start":1677.35,"end":1702.37},{"id":106,"text":"It's got an objective, and it's got constraints. And so let me explain a little bit about how that works. I have a function, f0. That's going to be our objective function here. And, you know, what that is, I mean, one way people describe this, I think it's a really good description, actually, is they call that, it's a best effort situation. Best effort means whatever value of f0 of x you come up with, we'll accept it.","zh":"它有一个目标函数，它还有一些约束条件。让我稍微解释一下它是如何工作的。我有一个函数，f0。这将是我们的目标函数。你知道，人们描述这个的方式，我认为这是一个非常好的描述，就是他们称之为一种最佳努力的情况。最佳努力意味着无论你得出什么样的f0(x)值，我们都会接受它。","start":1704.46,"end":1730.25},{"id":107,"text":"And the predicates describe constraints. And these are some, you know, sometimes people call this hard constraints, right? Or something like that. Because the semantics is really, really simple. The semantics is this. If someone proposes an X and one of these is violated and it doesn't matter by how much, then it is completely unacceptable. Okay?","zh":"这些谓词描述了约束条件。有时人们称这些为硬约束，对吧？或者类似的说法。因为语义非常简单。语义就是这样的：如果有人提出一个X，并且其中任何一个被违反，不管违反的程度如何，那么这都是完全不可接受的。好的？","start":1730.82,"end":1752.46},{"id":108,"text":"And the predicates describe constraints. And these are some, you know, sometimes people call this hard constraints, right? Or something like that. Because the semantics is really, really simple. The semantics is this. If someone proposes an X and one of these is violated and it doesn't matter by how much, then it is completely unacceptable. Okay? So that is the semantics of a constraint. I mean...","zh":"这些谓词描述了约束条件。有时人们称这些为硬约束，对吧？或者类似的说法。因为语义非常简单。语义就是这样的：如果有人提出一个X，并且其中任何一个被违反，不管违反的程度如何，那么这都是完全不可接受的。好的？这就是约束的语义。我的意思是……","start":1752.92,"end":1778.88},{"id":109,"text":"We'll see where constraints come from in the wild. They can come from different places and have different attributes. Sometimes it's like it's a physics thing. Or it's something like, actually, guess what? Covariance matrices are positive semi-definite. So please don't give me one that's either not symmetric or has a negative eigenvalue. Thank you, kind of thing. Or it could be just a modest preference.","zh":"我们将在实际中看到约束的来源。它们可能来自不同的地方，并具有不同的属性。有时它像是一个物理问题。或者它可能是这样的，猜猜看？协方差矩阵是半正定的。所以请不要给我一个不对称的或者具有负特征值的矩阵。谢谢，这种类型的东西。或者它可能只是某种适度的偏好。","start":1780.61,"end":1805.21},{"id":110,"text":"Like, please keep the leverage on my portfolio less than 6.7. And you'd say, well, we had a good day and some things went up and now it's 6.8. Whatever, right? So we'll talk about those later. But that's the meaning of a constraint. Okay. And then a solution or optimal point, right? X star.","zh":"比如，你可能会说，请保持我的投资组合的杠杆率低于6.7。然后你会说，今天行情不错，一些东西上涨了，现在达到了6.8。随便啦，对吧？所以我们之后会讨论这些。但这就是约束的含义。好的。然后是一个解或者最优解，对吧？X 星。","start":1805.92,"end":1830.14}],"notes":["本段讲解了优化问题中约束的定义和性质。约束被描述为谓词，即数学表达式，其结果为真或假。约束的语义是，如果任何约束被违反，无论违反程度如何，该解都是完全不可接受的。这强调了约束在优化问题中的严格性。","讲者提到约束可能来自不同来源，例如物理约束或统计约束。例如，协方差矩阵必须是半正定的，这意味着它必须是对称的且所有特征值非负。这表明约束可以是硬性约束，即必须严格满足的条件。","讲者还提到约束可以是软性约束，例如对投资组合杠杆率的限制。这种情况下，如果杠杆率超过某个阈值（如6.7），则可能被接受，但需要根据具体情况判断。这说明约束可以有不同的属性和处理方式。","讲者强调了约束在优化问题中的重要性，即它们定义了可行解的集合。任何违反约束的解都被视为无效，因此在求解优化问题时必须确保所有约束都被满足。","讲者通过协方差矩阵的例子说明了约束的数学性质，即半正定性。这表明在优化问题中，约束可能涉及复杂的数学条件，如对称性和特征值的限制。","讲者最后提到，约束的来源和属性可能不同，这需要在实际问题中进行具体分析。这说明在实际应用中，约束的处理需要根据具体问题的性质进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1677.35,"end":1830.14,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1677.35,"text":"Period. That's what min is. Minimize is actually a different thing. I mean, it's a similar idea. I actually think of this as a constructor for a problem. That's really what that is. So I actually think of this in an object-oriented way, and I believe that's absolutely the correct way to do it. So an optimization problem is actually an object in an object-oriented language, and it has different attributes and fields. It's got an objective."},{"start":1704.46,"text":"It's got an objective, and it's got constraints. And so let me explain a little bit about how that works. I have a function, f0. That's going to be our objective function here. And, you know, what that is, I mean, one way people describe this, I think it's a really good description, actually, is they call that, it's a best effort situation. Best effort means whatever value of f0 of x you come up with, we'll accept it."},{"start":1730.82,"text":"By the way, the smaller it is or the more negative it is, the happier we are. But we'll accept it. Just do your best on that. Now, the constraints, these are predicates. So a predicate is a mathematical expression that evaluates to either true or false. So they're either satisfied or they're not."},{"start":1752.92,"text":"And the predicates describe constraints. And these are some, you know, sometimes people call this hard constraints, right? Or something like that. Because the semantics is really, really simple. The semantics is this. If someone proposes an X and one of these is violated and it doesn't matter by how much, then it is completely unacceptable. Okay? So that is the semantics of a constraint. I mean..."},{"start":1780.61,"text":"We'll see where constraints come from in the wild. They can come from different places and have different attributes. Sometimes it's like it's a physics thing. Or it's something like, actually, guess what? Covariance matrices are positive semi-definite. So please don't give me one that's either not symmetric or has a negative eigenvalue. Thank you, kind of thing. Or it could be just a modest preference."},{"start":1805.92,"text":"Like, please keep the leverage on my portfolio less than 6.7. And you'd say, well, we had a good day and some things went up and now it's 6.8. Whatever, right? So we'll talk about those later. But that's the meaning of a constraint. Okay. And then a solution or optimal point, right? X star."}],"speech_gaps":[],"frame":"../frames/v001/011.webp","frame_time":1689.35},{"title":"优化问题与示例","segments":[{"id":111,"text":"Right? That's a star and not a little asterisk, right? So asterisk is going to be reserved for some other concepts we're going to see later in the class, which are really cool, but not now. So star sort of means optimal here. And what it means is it has the smallest objective value among all choices that satisfy the constraints. Okay, so I mean, I'm just, this is obvious and you should kind of know this anyway or something. And you've probably seen this in lots of fields, but that's what it is.","zh":"对吧？那是星星，而不是一个小星号，对吧？所以星号将会保留给我们在课堂后面要看到的一些概念，这些概念真的很酷，但现在还不用。这里的星号基本上意味着最优。它的意思是，在满足所有约束条件的选择中，它具有最小的目标值。好的，我的意思是，这很显然，你们应该已经知道或者至少应该了解这些。你们可能在很多领域都见过这个概念，但这就是它的含义。","start":1830.72,"end":1858.7},{"id":112,"text":"Okay so that's an optimization problem um okay there you go oh and of course there's tons of variations which we'll look at you could maximize something typically if you maximize it something like a utility or a profit or something like that right or you know or whatever some or a score or something like that you would ma that's okay but we'll look at those variations later okay","zh":"好的，所以这就是一个优化问题，嗯，好的，你明白了吧。当然，还有无数种变体，我们之后会看到。你通常可以最大化一些东西，比如效用或利润，或者其他类似的东西，对吧？或者你可能最大化一个得分，或者其他什么，这也没关系。但我们会在之后看看这些变体，好的。","start":1859.08,"end":1885.0},{"id":113,"text":"So let's first look at some examples about, you know, by the way, you'll see tons of examples before the course is over. Right. OK, so, I mean, here's one. Let's do portfolio optimization. Right. So you want to construct a portfolio of, let's say, you know, 5000 assets. Right. And so what that means is you have to decide how much of each of these do you hold?","zh":"那么，让我们先看一些例子，顺便说一句，你们在课程结束前会看到无数个例子。对的。我的意思是，这里有一个例子。让我们做投资组合优化。对的。你想要构建一个包含，比如说，5000种资产的投资组合。对的。这意味着你必须决定你持有这些资产中的多少比例？","start":1885.58,"end":1909.16},{"id":114,"text":"And it could be negative. That means like a short position. And you don't have to know what I'm talking about. It's fine. But that's what that would mean. A negative short position means you actually borrowed it from someone but had the obligation to pay it back later. And that actually is the same as owning a negative number of shares. That's a short position. Again, you don't need to know that or whatever. Well, you will see all this. That's just for cultural enrichment. Consider that part of cultural enrichment if you're not in that field.","zh":"这可能是负数。这意味着做空头寸。你不需要知道我在说什么，这没关系。但这就是它的意思。负的空头寸意味着你实际上从别人那里借了它，但有义务在以后归还。实际上，这和拥有负数量的股票是一样的。这就是空头寸。再次强调，你不需要知道这些，或者随便怎样。好吧，你们会看到所有这些内容。这只是文化上的补充。如果你不在这个领域，可以将这部分视为文化上的补充。","start":1909.82,"end":1937.14},{"id":115,"text":"Your job is to choose how much you put in. And, you know, presumably there's a budget like please invest a billion dollars or something like that or something like that. There could be things like a minimum and maximum allowed investment. Like, please don't put any more than 10 percent of your total portfolio in any one name. That would be that was I just said that in dialect. OK, but I think you knew what I meant. Right.","zh":"你的任务是决定投入多少。而且，你大概会有一个预算，比如请投资十亿美元之类的。可能会有一些限制，比如允许的最大和最小投资金额。例如，不要将你整个投资组合的超过10%投入任何一个项目。这就是我刚才用方言说的。好的，但我想你明白我的意思。对吧？","start":1939.08,"end":1964.54},{"id":116,"text":"You know, there could be a minimum expected return. You could say, I'd like to make at least 8% a year. At least that's my expectation according to my various models, right? Something like that. The constraints might be, well, I mentioned one already, a budget, you know, a minimum return. And the objective, you know, might be something like the overall risk or the risk is a dialect for the variance of the return.","zh":"你可能会有一个最低预期回报率。你可以表示，我希望每年至少获得8%的回报。至少这是我根据各种模型的预期，对吧？类似这样的情况。约束条件可能包括，我已经提到的一个，就是预算，还有最低回报率。而目标可能是整体风险，或者风险在方言中指的是回报的方差。","start":1966.01,"end":1994.19}],"notes":["本段讲解了优化问题的基本概念，包括最大化或最小化目标函数，同时满足约束条件。讲者提到优化问题可以应用于各种领域，如投资组合优化，其中目标可能是最大化利润或最小化风险，而约束可能包括预算限制或最低预期回报。","讲者通过投资组合优化的例子，说明了如何在多个资产之间分配资金，允许负值表示做空操作。同时，讲者提到约束条件可能包括投资比例限制和最低预期回报，目标函数可能是风险（即收益方差）的最小化。","讲者强调了优化问题的普遍性，并指出在课程中将看到大量不同类型的优化问题，包括最大化和最小化目标函数，以及各种约束条件的组合。","讲者提到风险在优化问题中通常被定义为收益的方差，这表明在投资组合优化中，风险是通过收益的波动性来衡量的，而目标是找到在满足约束条件下的最优风险水平。","讲者还提到，优化问题的约束条件可以包括预算限制、投资比例限制和最低预期回报，这些条件共同定义了可行解的范围，而目标函数则决定了最优解的选择标准。","讲者在讲解过程中使用了“dialect”一词，可能是指术语的非正式表达，但并未明确说明其具体含义，因此需要进一步澄清。"],"formulas":[{"latex":"\\text{Var}(R) = \\mathbb{E}[(R - \\mathbb{E}[R])^2]","symbols":"方差表示收益的波动性","explanation":"公式正确，使用了数学期望符号\\mathbb{E}，方差定义正确，适用于收益R的波动性计算","evidence":"You know, there could be a minimum expected return. You could say, I'd like to make at least 8% a year. At least that's my expectation according to my various models, right? Something like that. The constraints might be, well, I mentioned one already, a budget, you know, a minimum return. And the objective, you know, might be something like the overall risk or the risk is a dialect for the variance of the return."}],"uncertainties":["dialect"],"diagram":"none","start":1830.72,"end":1994.19,"asr_flags":[],"math_clarifications":["公式中的符号和定义符合数学规范，无需进一步修改"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1830.72,"text":"Right? That's a star and not a little asterisk, right? So asterisk is going to be reserved for some other concepts we're going to see later in the class, which are really cool, but not now. So star sort of means optimal here. And what it means is it has the smallest objective value among all choices that satisfy the constraints. Okay, so I mean, I'm just, this is obvious and you should kind of know this anyway or something. And you've probably seen this in lots of fields, but that's what it is."},{"start":1859.08,"text":"okay so that's an optimization problem um okay there you go oh and of course there's tons of variations which we'll look at you could maximize something typically if you maximize it something like a utility or a profit or something like that right or you know or whatever some or a score or something like that you would ma that's okay but we'll look at those variations later okay"},{"start":1885.58,"text":"So let's first look at some examples about, you know, by the way, you'll see tons of examples before the course is over. Right. OK, so, I mean, here's one. Let's do portfolio optimization. Right. So you want to construct a portfolio of, let's say, you know, 5000 assets. Right. And so what that means is you have to decide how much of each of these do you hold?"},{"start":1909.82,"text":"And it could be negative. That means like a short position. And you don't have to know what I'm talking about. It's fine. But that's what that would mean. A negative short position means you actually borrowed it from someone but had the obligation to pay it back later. And that actually is the same as owning a negative number of shares. That's a short position. Again, you don't need to know that or whatever. Well, you will see all this. That's just for cultural enrichment. Consider that part of cultural enrichment if you're not in that field."},{"start":1939.08,"text":"Your job is to choose how much you put in. And, you know, presumably there's a budget like please invest a billion dollars or something like that or something like that. There could be things like a minimum and maximum allowed investment. Like, please don't put any more than 10 percent of your total portfolio in any one name. That would be that was I just said that in dialect. OK, but I think you knew what I meant. Right."},{"start":1966.01,"text":"You know, there could be a minimum expected return. You could say, I'd like to make at least 8% a year. At least that's my expectation according to my various models, right? Something like that. The constraints might be, well, I mentioned one already, a budget, you know, a minimum return. And the objective, you know, might be something like the overall risk or the risk is a dialect for the variance of the return."}],"speech_gaps":[],"frame":"../frames/v001/012.webp","frame_time":1842.72},{"title":"凸优化在金融与电子设计中的应用","segments":[{"id":117,"text":"Right? So that's what you'd do. So you'd say, among all portfolios, you know, with a leverage less than 3.6, with blah, blah, blah, with this thing, with that thing, with, you know, no positions more than, you know, 0.1, meaning whatever, you know, you can't hold 10% in any one name, that kind of stuff. It says, among all those, please find me the one with minimum risk, according to some risk model, which is typically a variance model. Okay? So that's that. Okay, that's... And it's...","zh":"对吧？所以这就是你要做的事情。你会说，在所有投资组合中，你知道，杠杆率低于3.6，有各种各样的限制，比如这个、那个，还有，你知道的，任何单一资产的头寸不超过0.1，也就是说，你不能在任何一个资产上持有10%的仓位，这种类型的事情。它说，在所有这些限制下，请找出一个风险最小的投资组合，根据某种风险模型，通常是方差模型。好吗？这就是那个问题。好的，这就是……而且它……","start":1994.72,"end":2022.96},{"id":118,"text":"you know i mean i'm not aware of any i am not aware of any quantitative hedge fund that doesn't simply use convex optimization to do this so i'm not aware of one okay they may exist but that's pathetic actually if you ask me but anyway fine um okay here's another one just to switch signs","zh":"你知道，我的意思是，我不认识任何一家使用凸优化来做这件事的量化对冲基金，所以我不认识一家，好吧，它们可能存在，但老实说，如果问我，那真是太糟糕了。不过，不管怎样，好的，这里还有一个例子，换个话题。","start":2023.28,"end":2042.16},{"id":119,"text":"switch switch switch areas and switch so is device sizing and electronic circuits right so you know everybody's wearing a lot of electronics i i got a lot on me i got a lot in front of me and stuff like that and uh you know when people are designing the actual integrated circuits","zh":"换个领域，换个话题，设备尺寸和电子电路，对吧？所以你知道，每个人都用了很多电子设备，我自己身上有很多，前面也有很多，诸如此类的东西。你知道，当人们在设计实际的集成电路时，","start":2042.8,"end":2059.0},{"id":120,"text":"I mean, at the detailed inner level, digital or analog, there's a point where people do analog size. Actually, this optimization is used throughout circuit design, throughout, right? So maybe not for like super hardcore, small analog stuff where it's still like kind of old cowboys, you know, coming up with a weird circuit from 1927 or something, you know, that was vacuum tubes and now it's in whatever CMOS.","zh":"我的意思是，在详细的设计层面，无论是数字还是模拟，人们会在某个点进行模拟尺寸设计。实际上，这种优化方法被广泛应用于电路设计的各个方面，对吧？所以可能不用于像超级硬核、小型模拟电路这样的老派设计，你知道的，那些从1927年左右就存在的奇怪电路，那时候还是真空管，现在则是各种CMOS技术。","start":2059.7,"end":2086.46},{"id":121,"text":"But for the stuff that you have around you, sizing is a big deal, right? And so the idea there is I might have a logic block inside a chip where, and again, you don't have to, again, like when we talk about these things for real, I'll say more, but now it's just, you should just get the flavor of it, right? So I have a logic block inside a chip. I have, let's say, I don't know, a million gates inside.","zh":"但对于你周围使用的那些东西，尺寸设计是一个大问题，对吧？所以那里的想法是，我可能有一个芯片内部的逻辑块，再次强调，当我们真正谈论这些事情时，我会说更多，但现在你只需要理解其大致意思。我有一个芯片内部的逻辑块，里面可能有数百万个门。","start":2087.53,"end":2110.56},{"id":122,"text":"And its job is really simple. A bunch of ones and zeros are going to come active at the input to this block.","zh":"它的任务其实很简单。一串一和零会在输入端激活。","start":2111.59,"end":2118.91},{"id":123,"text":"And some number of picoseconds later, we hope that whatever that block computes is a bunch of ones and zeros. It's going to come out by the deadline on the right-hand side where it's going to be latched into some new latches. And again, if you know what I'm talking about, great. If you don't, that's fine too. So that's a timing requirement, and it's unbelievably important. Or here would be the slang.","zh":"在一些皮秒之后，我们希望这个块计算出的结果是一串一和零。它将在右边截止时间处被锁存到一些新的锁存器中。如果你明白我在说什么，很好。如果你不明白，也没关系。这就是一个时序要求，而且极其重要。或者这就是俚语。","start":2119.45,"end":2144.03},{"id":124,"text":"I want to make sure this can clock at 2.8 gigahertz, this core, right? So that would be the slang, right? But that translates into a timing requirement. That's what it means, right? Okay, now the basic idea is that for each of your million gates, let's say, you can actually change like its size, right? If you make it big, here's the good news, it's fast.","zh":"我想确保这个核心能够以2.8吉赫兹的频率工作，对吧？这就是俚语，对吧？但这转化为一个时序要求。这就是它的含义，对吧？好的，基本的想法是，对于你那百万个门中的每一个，实际上你可以改变它的尺寸，对吧？如果你把它做得更大，好消息是它会更快。","start":2144.73,"end":2168.11}],"notes":["本段首先提到凸优化在金融领域的应用，特别是投资组合优化，其中约束条件包括杠杆率、单个资产的持仓上限等，目标是最小化风险（通常用方差模型）。接着，讲者指出几乎所有量化对冲基金都使用凸优化，但可能有例外，不过这种情况很少见。","随后，讲者转向电子设计领域，特别是集成电路设计中的设备尺寸优化。他提到在设计集成电路时，尤其是在数字或模拟电路的详细层面，设备尺寸的优化是关键，而凸优化被广泛应用于整个电路设计过程中。","讲者进一步解释了逻辑块在芯片中的作用，其中包含大量逻辑门，输入为二进制信号，输出也需在规定时间内完成计算并被锁存。这涉及严格的时序要求，例如确保芯片能够以2.8 GHz的频率运行。","最后，讲者指出在电子设计中，可以通过调整逻辑门的尺寸来优化性能，增大尺寸会提高速度，但可能增加功耗。这体现了凸优化在电子设计中的实际应用价值。","讲者强调了凸优化在不同领域中的广泛适用性，从金融到电子设计，展示了其在实际问题建模和求解中的重要性。","讲者通过具体的例子，如投资组合优化和集成电路设计，帮助听众理解凸优化的实际应用场景，同时指出凸优化在这些领域中的关键作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1994.72,"end":2168.11,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1994.72,"text":"Right? So that's what you'd do. So you'd say, among all portfolios, you know, with a leverage less than 3.6, with blah, blah, blah, with this thing, with that thing, with, you know, no positions more than, you know, 0.1, meaning whatever, you know, you can't hold 10% in any one name, that kind of stuff. It says, among all those, please find me the one with minimum risk, according to some risk model, which is typically a variance model. Okay? So that's that. Okay, that's... And it's..."},{"start":2023.28,"text":"you know i mean i'm not aware of any i am not aware of any quantitative hedge fund that doesn't simply use convex optimization to do this so i'm not aware of one okay they may exist but that's pathetic actually if you ask me but anyway fine um okay here's another one just to switch signs"},{"start":2042.8,"text":"switch switch switch areas and switch so is device sizing and electronic circuits right so you know everybody's wearing a lot of electronics i i got a lot on me i got a lot in front of me and stuff like that and uh you know when people are designing the actual integrated circuits"},{"start":2059.7,"text":"I mean, at the detailed inner level, digital or analog, there's a point where people do analog size. Actually, this optimization is used throughout circuit design, throughout, right? So maybe not for like super hardcore, small analog stuff where it's still like kind of old cowboys, you know, coming up with a weird circuit from 1927 or something, you know, that was vacuum tubes and now it's in whatever CMOS."},{"start":2087.53,"text":"But for the stuff that you have around you, sizing is a big deal, right? And so the idea there is I might have a logic block inside a chip where, and again, you don't have to, again, like when we talk about these things for real, I'll say more, but now it's just, you should just get the flavor of it, right? So I have a logic block inside a chip. I have, let's say, I don't know, a million gates inside."},{"start":2111.59,"text":"And its job is really simple. A bunch of ones and zeros are going to come active at the input to this block."},{"start":2119.45,"text":"And some number of picoseconds later, we hope that whatever that block computes is a bunch of ones and zeros. It's going to come out by the deadline on the right-hand side where it's going to be latched into some new latches. And again, if you know what I'm talking about, great. If you don't, that's fine too. So that's a timing requirement, and it's unbelievably important. Or here would be the slang."},{"start":2144.73,"text":"I want to make sure this can clock at 2.8 gigahertz, this core, right? So that would be the slang, right? But that translates into a timing requirement. That's what it means, right? Okay, now the basic idea is that for each of your million gates, let's say, you can actually change like its size, right? If you make it big, here's the good news, it's fast."}],"speech_gaps":[],"frame":"../frames/v001/013.webp","frame_time":2006.72},{"title":"优化在电路设计与数据拟合中的应用","segments":[{"id":125,"text":"You make them big, they're fast. Why? Because a lot of current can come in and charge up the capacitance fast, and it's going to be fast. That's the good news. Bad news? It's big, physically, right? And you've got a limit on area. Other bad news is it's power hungry. And, you know, so, and actually that's kind of, power is kind of the limiting thing right now in a lot of circuit design. Okay?","zh":"你让它们变大，它们就会快。为什么？因为很多电流可以进来并快速充电电容，所以它会很快。这是好消息。坏消息？它们在物理上很大，对吧？而且你有面积限制。其他坏消息是它们耗电。你知道的，实际上，现在在很多电路设计中，功耗是主要的限制因素。好吗？","start":2168.89,"end":2192.47},{"id":126,"text":"Okay, so now the idea is, I mean, it's kind of roughly, it's obvious what to do intuitively, right? You know, for the, I'll tell you, here's some slang, right? For the critical paths, those are the ones that says, you know, I'll tell you what, here's what's, for timing to clock at 2.8 gigahertz, your hardest thing is going to be the signal that flows from these things over to those over there. Those are the critical paths. You're going to want to size those big because you want to make sure that with high probability.","zh":"好的，现在这个想法是，我意思是，它有点粗略，从直觉上来说，你知道该怎么做，对吧？我会告诉你，这里有一些行话，对吧？对于关键路径，这些是那些说，你知道的，我会告诉你，这里是关于定时达到2.8吉赫兹的，你最难处理的是从这些元件流向那边的信号。这些就是关键路径。你想要让这些路径的元件尺寸变大，因为你希望确保在下一个时钟周期到来时，信号是有效的，对吧？而对于那些不太重要的部分，你想要将它们设置为最小尺寸，对吧？我意思是，这看起来有点明显，但实际上，这一切都是通过优化完成的。好的，所以这一切都讲得通吗？好的，所以这是第一个例子。然后最后一个例子有点好笑，因为它涵盖了。","start":2193.29,"end":2220.75},{"id":127,"text":"the signal's valid when the next clock cycle comes around, right? And for things that are less so, you're going to want to set them to minimum size, right? So, I mean, this is kind of obvious, but this is actually all done by, you know, by optimization. Okay, so all that kind of makes sense? So, okay. So that's one. And then the last example is kind of hilarious because it subsumes.","zh":"几乎所有统计学和机器学习的内容。这被称为数据拟合。这是这个过程。在这里，变量是模型中的参数。可以是统计模型、预测模型，或者其他任何模型。它是对某物的模型，你有参数。如果你在做传统的统计学，你可能会有10个参数，而如果你在训练神经网络，你可能会有100亿个参数。","start":2221.66,"end":2247.75},{"id":128,"text":"pretty much most of statistics and machine learning. This is called data fitting. It's this. Here, the variables are parameters in a model. Could be a statistical model, a prediction model, whatever. It's a model of something, and you got parameters. If you're doing land of old-school statistics, you might have 10, and if you're training a neural network, you might have 10 billion.","zh":"差不多统计学和机器学习中的大部分内容。这被称为数据拟合。这就是。这里的变量是模型中的参数。可能是统计模型、预测模型，或者其他任何模型。它是对某事物的模型，你拥有参数。如果你在做传统的统计学，你可能会有10个，而如果你在训练一个神经网络，你可能会有100亿个。","start":2248.27,"end":2272.4},{"id":129,"text":"But those are the variables in an optimization problem. Then the constraints might be based on prior information, like if you're estimating, for example, an intensity, it's got to be positive, it can't be negative. If you're estimating a covariance matrix, it's got to be positive semi-definite. So these are like constraints. Let's see. Your objective typically involves two things.","zh":"但这些是在优化问题中的变量。然后约束可能基于先验信息，例如，如果你在估计一个强度，它必须是正的，不能是负的。如果你在估计一个协方差矩阵，它必须是半正定的。因此这些是约束。让我们看看。你的目标通常涉及两个方面。","start":2274.03,"end":2300.05},{"id":130,"text":"The first is a measure of misfit with the data you have, the training data, right? So that's the first thing. Like if someone says, what are you doing? You say, I'm fitting a model. You go, how are you doing it? And you go, well, I mean, the first thing is I wanted to reproduce the data I have. Then the critical part, so I mean, because if you're not doing well on the historical data.","zh":"第一个是衡量你所拥有的数据，也就是训练数据的拟合程度的指标，对吧？所以这是第一件事。比如有人问你，你在做什么？你说，我在拟合一个模型。然后他问，你是怎么做的？你回答，嗯，首先我想重现我所拥有的数据。然后关键的部分，我的意思是，如果你在历史数据上表现不佳。","start":2301.09,"end":2321.84}],"notes":["本段讲授了电路设计中优化的应用，特别是针对关键路径的尺寸调整。关键路径是指在时钟频率为2.8 GHz时，信号从一个位置传输到另一个位置的路径。这些路径需要较大尺寸以确保信号在下一个时钟周期到来时有效。而其他路径则可以设置为最小尺寸。这种做法虽然直观，但实际上是通过优化实现的。","接下来，讲授了数据拟合在统计学和机器学习中的广泛应用。数据拟合是指通过优化问题来调整模型参数，使其尽可能拟合训练数据。变量是模型的参数，可以是统计模型或预测模型中的参数。参数的数量可以从10个到100亿个不等。","约束条件可能基于先验信息，例如估计强度时必须为正，估计协方差矩阵时必须为半正定。这些约束条件确保了模型的合理性。目标函数通常包括两个部分：一是衡量模型与训练数据之间的拟合误差，二是确保模型在历史数据上的表现。","在讲授过程中，强调了优化问题在实际应用中的重要性，包括电路设计和数据拟合。优化不仅涉及调整参数，还涉及满足各种约束条件，以确保模型的合理性和有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2168.89,"end":2321.84,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2168.89,"text":"You make them big, they're fast. Why? Because a lot of current can come in and charge up the capacitance fast, and it's going to be fast. That's the good news. Bad news? It's big, physically, right? And you've got a limit on area. Other bad news is it's power hungry. And, you know, so, and actually that's kind of, power is kind of the limiting thing right now in a lot of circuit design. Okay?"},{"start":2193.29,"text":"Okay, so now the idea is, I mean, it's kind of roughly, it's obvious what to do intuitively, right? You know, for the, I'll tell you, here's some slang, right? For the critical paths, those are the ones that says, you know, I'll tell you what, here's what's, for timing to clock at 2.8 gigahertz, your hardest thing is going to be the signal that flows from these things over to those over there. Those are the critical paths. You're going to want to size those big because you want to make sure that with high probability."},{"start":2221.66,"text":"the signal's valid when the next clock cycle comes around, right? And for things that are less so, you're going to want to set them to minimum size, right? So, I mean, this is kind of obvious, but this is actually all done by, you know, by optimization. Okay, so all that kind of makes sense? So, okay. So that's one. And then the last example is kind of hilarious because it subsumes."},{"start":2248.27,"text":"pretty much most of statistics and machine learning. This is called data fitting. It's this. Here, the variables are parameters in a model. Could be a statistical model, a prediction model, whatever. It's a model of something, and you got parameters. If you're doing land of old-school statistics, you might have 10, and if you're training a neural network, you might have 10 billion."},{"start":2274.03,"text":"But those are the variables in an optimization problem. Then the constraints might be based on prior information, like if you're estimating, for example, an intensity, it's got to be positive, it can't be negative. If you're estimating a covariance matrix, it's got to be positive semi-definite. So these are like constraints. Let's see. Your objective typically involves two things."},{"start":2301.09,"text":"The first is a measure of misfit with the data you have, the training data, right? So that's the first thing. Like if someone says, what are you doing? You say, I'm fitting a model. You go, how are you doing it? And you go, well, I mean, the first thing is I wanted to reproduce the data I have. Then the critical part, so I mean, because if you're not doing well on the historical data."}],"speech_gaps":[],"frame":"../frames/v001/014.webp","frame_time":2180.89},{"title":"优化在不同领域的应用","segments":[{"id":131,"text":"you should just give up or something like that, time to go home. But then there's another term and someone says, well, what's that other term? You go, that's a regularization or a detuning term or in optimization you call it a term that promotes robustness. Someone says, what's that? You say, wait, do you mean you're not actually choosing the parameters to do the best on the historical data? You say, right, exactly.","zh":"你应该只是放弃或者类似的事情，该回家了。但接着又有一个术语，有人问，那另一个术语是什么？你会说，那是正则化或调参项，或者在优化中你称之为促进鲁棒性的项。有人问，那是什么？你会说，等等，你是说你并没有真正选择参数来在历史数据上表现最好？你会说，对，就是这样。","start":2322.32,"end":2349.02},{"id":132,"text":"because I don't want to overfit or something like that. I'm sure you've seen all these ideas, but that's another example where people would use optimization. What's super interesting is just to think a little bit about how the variables enter in these three broad categories. Here, it's actually prescriptive.","zh":"因为我不想过拟合或者类似的事情。我相信你们已经见过所有这些想法，但这也是另一个人们会使用优化的例子。超级有趣的是思考一下这些三个广泛类别中变量是如何进入的。在这里，它实际上是处方性的。","start":2349.64,"end":2368.88},{"id":133,"text":"When you calculate this, you get a trade list, and it says go buy so many shares of this, dump that, buy this, buy that, that kind of thing. That's prescriptive. So things actually happen. Another good example of that would be control. So that's another big, huge example here. That would be like landing a rocket, flying a rocket, flying an airplane, autonomous driving.","zh":"当你计算这个时，你会得到一个交易清单，它会说买入多少股这种股票，卖出那种，买入这种，买入那种，诸如此类的事情。这就是处方性的。所以事情实际上会发生。另一个很好的例子就是控制。所以这也是另一个巨大的例子。例如，着陆火箭、飞行火箭、飞行飞机、自动驾驶。","start":2369.84,"end":2392.42},{"id":134,"text":"There, it's prescriptive. Here are the optimization variables. It's actually literally the four thrusts on your drone in 20 millisecond increments for the next 10 seconds. And things happen. Like when you come up with an X or whatever it is, you download it in your drone and it flies. So same here.","zh":"在那里，它是处方性的。这里是优化变量。实际上，它就是你无人机上四个推力在20毫秒间隔内的数值，持续10秒。事情会发生。例如，当你得出一个X或者任何东西时，你将其下载到无人机中，它就会飞行。所以这里也是一样的。","start":2393.07,"end":2416.57},{"id":135,"text":"Here, I mean, things happen. It's just on a much smaller time scale, right? Sorry, longer time scale, much longer time scale, right? So electronic design, people design bridges. That's how people design bridges and big buildings and steel structures and things like that, right? You spend a lot of time working it out and simulating it like crazy, and then you...","zh":"在这里，我的意思是事情会发生。只是时间尺度要小得多，对吧？抱歉，是更长的时间尺度，要长得多的时间尺度，对吧？电子设计，人们设计桥梁。这就是人们设计桥梁和大型建筑以及钢结构等事物的方式，对吧？你花很多时间进行计算和疯狂的模拟，然后你……","start":2417.4,"end":2438.24},{"id":136,"text":"you build the thing and you're hoping it's going to stay there for 100 years or 200 years, that kind of thing. I mean, not for a circuit, that's for building. For a circuit, you're hoping it's going to last like four or five years, something like that. Then in data fitting, the variables are not actions at all.","zh":"你建造这个东西，你希望它能在那里待上100年或200年，诸如此类的事情。我的意思是，对于电路来说不是这样，那是针对建筑的。对于电路来说，你希望它能使用四到五年，类似这样的情况。然后在数据拟合中，变量根本不是动作。","start":2438.54,"end":2453.7},{"id":137,"text":"they're actually, nothing happens, right? If I show you a coefficient in a regression model or something, you don't do something. It's just a parameter, right? So I think it's interesting to sort of think about this. But there's a lot of other applications of optimization, which we will see that don't, you know, that aren't, but these are just kind of good, basic, simple examples. Okay. Okay, so.","zh":"它们实际上，什么都不会发生，对吧？如果我向你展示一个回归模型中的系数，你不会做任何事情。它只是一个参数，对吧？所以我觉得思考这一点很有趣。但优化还有许多其他应用，我们将会看到，这些应用并不像这些例子那样，但这些只是很好的、基本的、简单的例子。好的。好的，所以。","start":2454.25,"end":2479.39}],"notes":["本段讨论了优化在不同领域中的应用，包括金融、控制和工程设计。讲者提到在金融中，优化用于生成交易列表，这属于处方性应用，即根据计算结果采取具体行动。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2322.32,"end":2479.39,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2322.32,"text":"you should just give up or something like that, time to go home. But then there's another term and someone says, well, what's that other term? You go, that's a regularization or a detuning term or in optimization you call it a term that promotes robustness. Someone says, what's that? You say, wait, do you mean you're not actually choosing the parameters to do the best on the historical data? You say, right, exactly."},{"start":2349.64,"text":"because I don't want to overfit or something like that. I'm sure you've seen all these ideas, but that's another example where people would use optimization. What's super interesting is just to think a little bit about how the variables enter in these three broad categories. Here, it's actually prescriptive."},{"start":2369.84,"text":"When you calculate this, you get a trade list, and it says go buy so many shares of this, dump that, buy this, buy that, that kind of thing. That's prescriptive. So things actually happen. Another good example of that would be control. So that's another big, huge example here. That would be like landing a rocket, flying a rocket, flying an airplane, autonomous driving."},{"start":2393.07,"text":"There, it's prescriptive. Here are the optimization variables. It's actually literally the four thrusts on your drone in 20 millisecond increments for the next 10 seconds. And things happen. Like when you come up with an X or whatever it is, you download it in your drone and it flies. So same here."},{"start":2417.4,"text":"Here, I mean, things happen. It's just on a much smaller time scale, right? Sorry, longer time scale, much longer time scale, right? So electronic design, people design bridges. That's how people design bridges and big buildings and steel structures and things like that, right? You spend a lot of time working it out and simulating it like crazy, and then you..."},{"start":2438.54,"text":"you build the thing and you're hoping it's going to stay there for 100 years or 200 years, that kind of thing. I mean, not for a circuit, that's for building. For a circuit, you're hoping it's going to last like four or five years, something like that. Then in data fitting, the variables are not actions at all."},{"start":2454.25,"text":"they're actually, nothing happens, right? If I show you a coefficient in a regression model or something, you don't do something. It's just a parameter, right? So I think it's interesting to sort of think about this. But there's a lot of other applications of optimization, which we will see that don't, you know, that aren't, but these are just kind of good, basic, simple examples. Okay. Okay, so."}],"speech_gaps":[],"frame":"../frames/v001/015.webp","frame_time":2334.32},{"title":"优化问题的普遍性与局部优化","segments":[{"id":138,"text":"So you might ask, yeah, by the way, it's very normal when people learn about this first, is to wake up kind of in sweating a little bit in the middle of the night and go like, and you're like, oh my God, everything is an optimization problem. Oh my God. Right, okay, so should this happen to you? It's gonna happen to one or two of you, I can guarantee it, okay, just statistically, okay? So just calm down.","zh":"所以你可能会问，对了，当人们第一次学习这个的时候，是很正常的，会在半夜醒来，有点出汗，然后想，哦我的天，一切都是优化问题。哦我的天。对，好吧，这会发生给你吗？我可以保证，这会发生给一两个你们，好吧，从统计学上来说，好吧？所以，就冷静下来吧。","start":2480.81,"end":2503.41},{"id":139,"text":"Yes, duh, everything is an optimization problem. Of course it is. Then not only it's both true and says nothing. It's like a tautology, like, of course, right? So, you know, okay. So now the, so then the question is, once you realize, well, it's everything. Like it's absolutely everything. It's all of design. It's all of statistics. It's all of, you know, blah, blah, blah. Okay, fine.","zh":"是的，当然，一切都是优化问题。当然如此。但不仅它是真的，而且它什么也没说。它就像一个同义反复，当然如此，对吧？所以，你知道，好吧。那么现在的问题是，一旦你意识到，嗯，一切都是。就像它绝对是所有的一切。它是所有的设计。它是所有的统计学。它是所有的，你知道的， blah, blah, blah。好吧，行吧。","start":2504.96,"end":2529.6},{"id":140,"text":"Then you ask yourself, okay, cool, now that's really interesting now. Can you solve it? And now we get to the bad news, which is, no, generally you can't. So, sorry. Yeah, so that's okay. And there's different types of ways to get around that. There's two traditional compromises, one taken 99.9% of the time and 1.1% of the time.","zh":"然后你问自己，好吧，酷，现在这真的很有趣了。你能解决它吗？现在我们进入坏消息，那就是，通常你不能。所以，抱歉。是的，这样就可以了。而且有不同类型的解决方法来绕过这个问题。有两种传统的折中方法，一种在99.9%的时间使用，另一种在1.1%的时间使用。","start":2531.25,"end":2556.01},{"id":141,"text":"The first compromise is actually to to actually solve. And then you have a little asterisk and then down at the footnote in extremely small font. It says basically not really or something like that. Right. So that's that's I'm not making fun of this, but I'm just saying that this is this is like a whole lot of people do this. And it's fine. It just means that you you found a point that was feasible.","zh":"第一种折中方法实际上是去真正求解。然后你有一个小星号，然后在脚注里用极小的字体写着，基本上说不是真的，或者类似这样的话。对。所以，我不是在嘲笑这个，我只是在说，这是一大群人会这么做。这也没关系。它只是意味着你找到了一个可行点。","start":2558.08,"end":2586.36},{"id":142,"text":"It has a better, let's say it has a better objective value than what you started with and you're happy, right? But, you know, is it the absolute best anyone can do? You don't know, right? I mean, if you're honest, right? So that's that. That's called local optimization. It's very widely used. There's nothing wrong with it. It's fine. I mean, as long as you don't pretend that you've actually solved a problem, then we get into trouble, right? So, and there's lots of cases where that doesn't even really matter. I mean, it's fine. So actually right now as we speak,","zh":"它有一个更好的目标值，比你开始的时候更好，你就会满意，对吧？但是，你知道，它是不是绝对最好的解决方案？你不知道，对吧？我的意思是，如果你诚实的话，对吧？这就是所谓的局部优化。它被广泛使用。这没有问题。没关系。我的意思是，只要你不假装你已经真正解决了问题，我们就会陷入麻烦，对吧？所以，而且有很多情况，这甚至根本不重要。我的意思是，这也没关系。实际上，我们现在说话的时候，","start":2587.21,"end":2616.57},{"id":143,"text":"There's like millions, 10 million local optimization, maybe more than that, local optimization problems are running right now. So someone want to tell me what they are? What are local optimizations running right now? 10 million of them, a minimum 10 million. On GPUs, all over the world, and other, maybe? People are fitting... Go ahead. Neural networks. Oh man, people are fitting neural networks. Yeah, so there you go. And they don't...","zh":"有数百万，大概是1000万个局部优化问题，可能还有更多，现在正在运行。所以有人想告诉我，它们是什么？现在正在运行的局部优化问题是什么？至少有1000万个。在世界各地的GPU上，以及其他地方吗？人们在进行……继续。神经网络。哦，天哪，人们正在拟合神经网络。是的，就是这样。而且它们……","start":2617.0,"end":2647.6}],"notes":["本段讨论了优化问题的普遍性，指出许多领域的问题都可以被建模为优化问题，但通常无法找到全局最优解。讲者提到，人们常常使用局部优化方法，即找到一个比初始点更优的可行解，但这种方法并不保证找到全局最优解。","讲者强调，局部优化方法虽然广泛使用且没有错误，但必须明确说明其局限性，即不能声称已真正解决问题。这在实际应用中非常重要，尤其是在涉及神经网络训练等复杂问题时。","讲者通过举例说明，当前全球范围内有数百万个局部优化问题正在运行，尤其是在GPU上，这些优化问题通常涉及神经网络的训练过程。","讲者指出，尽管局部优化方法在许多情况下是可接受的，但必须清楚地认识到其局限性，即无法保证找到全局最优解。这在实际应用中需要谨慎对待，尤其是在对结果有严格要求的场景中。","讲者通过幽默的方式指出，许多人在面对优化问题时会感到焦虑，但这种焦虑是正常的，因为优化问题的复杂性往往超出人们的预期。","讲者强调，局部优化方法的使用并不意味着问题已被解决，而是找到一个可行的解，这在某些情况下是可接受的，但在其他情况下可能需要更精确的全局优化方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2480.81,"end":2647.6,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2480.81,"text":"So you might ask, yeah, by the way, it's very normal when people learn about this first, is to wake up kind of in sweating a little bit in the middle of the night and go like, and you're like, oh my God, everything is an optimization problem. Oh my God. Right, okay, so should this happen to you? It's gonna happen to one or two of you, I can guarantee it, okay, just statistically, okay? So just calm down."},{"start":2504.96,"text":"Yes, duh, everything is an optimization problem. Of course it is. Then not only it's both true and says nothing. It's like a tautology, like, of course, right? So, you know, okay. So now the, so then the question is, once you realize, well, it's everything. Like it's absolutely everything. It's all of design. It's all of statistics. It's all of, you know, blah, blah, blah. Okay, fine."},{"start":2531.25,"text":"Then you ask yourself, okay, cool, now that's really interesting now. Can you solve it? And now we get to the bad news, which is, no, generally you can't. So, sorry. Yeah, so that's okay. And there's different types of ways to get around that. There's two traditional compromises, one taken 99.9% of the time and 1.1% of the time."},{"start":2558.08,"text":"The first compromise is actually to to actually solve. And then you have a little asterisk and then down at the footnote in extremely small font. It says basically not really or something like that. Right. So that's that's I'm not making fun of this, but I'm just saying that this is this is like a whole lot of people do this. And it's fine. It just means that you you found a point that was feasible."},{"start":2587.21,"text":"It has a better, let's say it has a better objective value than what you started with and you're happy, right? But, you know, is it the absolute best anyone can do? You don't know, right? I mean, if you're honest, right? So that's that. That's called local optimization. It's very widely used. There's nothing wrong with it. It's fine. I mean, as long as you don't pretend that you've actually solved a problem, then we get into trouble, right? So, and there's lots of cases where that doesn't even really matter. I mean, it's fine. So actually right now as we speak,"},{"start":2617.0,"text":"There's like millions, 10 million local optimization, maybe more than that, local optimization problems are running right now. So someone want to tell me what they are? What are local optimizations running right now? 10 million of them, a minimum 10 million. On GPUs, all over the world, and other, maybe? People are fitting... Go ahead. Neural networks. Oh man, people are fitting neural networks. Yeah, so there you go. And they don't..."}],"speech_gaps":[],"frame":"../frames/v001/016.webp","frame_time":2492.81},{"title":"优化问题的动机与例外情况","segments":[{"id":144,"text":"They don't care. No one comes up to you and says, wow, that's awesome. Is that the absolute best you could do? And by the way, the reason you might not care, there's a lot of reasons you might not care. You say, number one, I made up the objective. That's the first thing. So we shouldn't get too crazy about that, right? Number two, the objective is merely a surrogate for what I really want to do. And you go, what do you really want to do? What I really want to do is make excellent day ahead predictions. That's what I really want to do.","zh":"他们并不在意。没有人会走到你面前说，哇，这太棒了。这是你能做到的绝对最好的结果吗？顺便说一句，你可能不在意的原因有很多。你说，第一个原因，我制定了目标。这是第一点。因此，我们不应该对此过于激动，对吧？第二个原因，这个目标只是我真正想做的事情的一个替代品。你会说，你真正想做什么？我真正想做的就是做出优秀的明天预测。这就是我真正想做的事情。","start":2648.14,"end":2673.74},{"id":145,"text":"All this machine learning optimization crap, that's just a way to get there. So you're not paid to minimize loss functions if you're doing machine learning. You're paid to do a good job on tomorrow's data, on unseen data. So there's lots of reasons why you could say you couldn't care less in many, many cases. And that's all perfectly valid.","zh":"所有这些机器学习优化的麻烦，其实只是达到目的的一种方式。因此，如果你在做机器学习，你并不是被雇佣来最小化损失函数的。你被雇佣的是在明天的数据上，或者在未见过的数据上做好工作。因此，在许多情况下，你可以说你根本不在意，这有很多原因。而这完全是有道理的。","start":2674.25,"end":2696.61},{"id":146,"text":"There are some exceptions, and I'm going to talk about them, and that's actually kind of what this course is about, okay? So, the exceptions are, there are certain kind of problems that you can just solve, right? There's no art of any kind whatsoever. It's a technology. You just solve it, right? I mean, if you push these things to the extremes and blah, blah, blah, there might be some minimal art, but, you know.","zh":"有一些例外情况，我将要谈到它们，实际上这就是这门课程的内容，对吧？这些例外情况是，有一些特定类型的问题，你可以直接解决，对吧？没有任何艺术成分。这是一门技术。你只需要解决它，对吧？我的意思是，如果你把这些事情推向极端，啰啰嗦嗦的，可能会有一些最小的艺术成分，但你知道的。","start":2699.13,"end":2718.45},{"id":147,"text":"Fine. And the most famous one is least squares problem. I'll talk about that. That goes back officially to about year 1800, but it's almost certain that people knew about it way before that. And I'll say a lot about it. Another one is linear programming problems. And of course, convex optimization problems is another example. Now, for these things,","zh":"好吧。其中最著名的例子就是最小二乘问题。我会谈到这一点。它正式地可以追溯到大约1800年，但几乎可以肯定的是，人们在那之前就已经知道它了。我会详细讲很多关于它的事情。另一个例子是线性规划问题。当然，凸优化问题也是另一个例子。对于这些问题，","start":2718.86,"end":2740.09},{"id":148,"text":"For these problems, when you say you've solved it, there's no asterisk. You don't pull in the legal boilerplate.","zh":"对于这些问题，当你声称你已经解决了它时，不需要加注释。你不需要引入法律上的免责声明。","start":2741.26,"end":2751.18},{"id":149,"text":"right? The release that, you know, when you read in small writing or the thing you said when you said agree, it was like way, way down where you didn't read it. It said things we understand that this may not be the best X, blah, blah, blah, blah, blah, right? That kind of thing. But that's what this is, okay? So there's nothing, they just work, right? By the way, what's super interesting about that is that makes them really suitable for embedded applications, right? So","zh":"对吧？那个发布版本，你知道的，当你在小字里阅读，或者你之前说同意的时候，它其实是在非常下面的地方，你根本没注意到。它说一些我们理解的内容，比如这可能不是最好的X， blah, blah, blah, blah, blah，对吧？就是这种东西。但这就是我们所说的，对吧？所以没有什么特别的，它们只是起作用，对吧？顺便说一句，这种东西非常有趣的是，这使它们非常适合嵌入式应用，对吧？","start":2751.68,"end":2777.48},{"id":150,"text":"That's like, you know, I mean, I was joking with a friend, like if you got on a flight and the captain said, you know, great news, you know, today we're going to see some interesting weather and we're going to be, you know, training our RL controller. It's going to be real fun. Right. I mean, this is ridiculous. Right. Right. Or or I mean, so actually.","zh":"就像，你知道的，我跟一个朋友开玩笑说，如果你登上了一架飞机，而机长说，你知道吗，好消息，今天我们要看看一些有趣的天气，而且我们要训练我们的强化学习控制器。这会非常有趣。对吧？我是说，这真是荒谬的。对吧？对吧？或者，我是说，实际上如此。","start":2779.26,"end":2800.76}],"notes":["本段讨论了优化问题在实际应用中的动机，指出人们通常不会过分关注损失函数的最小化，因为优化的目标是实现更实际的预测或决策。讲者强调，机器学习中的优化只是达到最终目标的一种手段，而不是最终目标本身。","讲者指出，虽然在很多情况下人们可能对优化结果不关心，但存在一些例外情况，这些例外情况正是本课程要探讨的核心内容。这些例外情况指的是某些问题可以通过直接求解来解决，而不需要复杂的调整或艺术性处理。","讲者提到，最著名的例外之一是线性最小二乘问题，它最早可以追溯到1800年左右，但可能更早就有相关应用。此外，线性规划问题和凸优化问题也是这类例外的典型例子。","对于这些例外问题，讲者指出，一旦问题被解决，就没有需要额外说明的条件或限制，即没有“附带条件”或“免责声明”。这表明这些问题是高度可靠和直接的。","讲者还提到，这些问题的这种特性使它们非常适合嵌入式应用，因为它们不需要复杂的调整或额外的解释。","最后，讲者用一个幽默的例子说明了在实际应用中，人们通常不会对优化过程中的不确定性或复杂性感到担忧，而是更关注最终结果的可靠性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2648.14,"end":2800.76,"asr_flags":[149],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2648.14,"text":"They don't care. No one comes up to you and says, wow, that's awesome. Is that the absolute best you could do? And by the way, the reason you might not care, there's a lot of reasons you might not care. You say, number one, I made up the objective. That's the first thing. So we shouldn't get too crazy about that, right? Number two, the objective is merely a surrogate for what I really want to do. And you go, what do you really want to do? What I really want to do is make excellent day ahead predictions. That's what I really want to do."},{"start":2674.25,"text":"All this machine learning optimization crap, that's just a way to get there. So you're not paid to minimize loss functions if you're doing machine learning. You're paid to do a good job on tomorrow's data, on unseen data. So there's lots of reasons why you could say you couldn't care less in many, many cases. And that's all perfectly valid."},{"start":2699.13,"text":"There are some exceptions, and I'm going to talk about them, and that's actually kind of what this course is about, okay? So, the exceptions are, there are certain kind of problems that you can just solve, right? There's no art of any kind whatsoever. It's a technology. You just solve it, right? I mean, if you push these things to the extremes and blah, blah, blah, there might be some minimal art, but, you know."},{"start":2718.86,"text":"Fine. And the most famous one is least squares problem. I'll talk about that. That goes back officially to about year 1800, but it's almost certain that people knew about it way before that. And I'll say a lot about it. Another one is linear programming problems. And of course, convex optimization problems is another example. Now, for these things,"},{"start":2741.26,"text":"For these problems, when you say you've solved it, there's no asterisk. You don't pull in the legal boilerplate."},{"start":2751.68,"text":"right? The release that, you know, when you read in small writing or the thing you said when you said agree, it was like way, way down where you didn't read it. It said things we understand that this may not be the best X, blah, blah, blah, blah, blah, right? That kind of thing. But that's what this is, okay? So there's nothing, they just work, right? By the way, what's super interesting about that is that makes them really suitable for embedded applications, right? So"},{"start":2779.26,"text":"That's like, you know, I mean, I was joking with a friend, like if you got on a flight and the captain said, you know, great news, you know, today we're going to see some interesting weather and we're going to be, you know, training our RL controller. It's going to be real fun. Right. I mean, this is ridiculous. Right. Right. Or or I mean, so actually."}],"speech_gaps":[],"frame":"../frames/v001/017.webp","frame_time":2660.14},{"title":"凸优化的实际应用与历史背景","segments":[{"id":151,"text":"A lot of jet engines work this way. You actually solve an optimization problem 50 times a second. They're really complicated, a jet engine. There's like, you know, 50 different things. The X that you're choosing is like at least dimension 20. It's like all sorts of crazy little bleed valves and things. And you can change the angle of attack on road. It's just crazy stuff. Fuel mix, all sorts of crazy stuff you can do to run a jet engine. They're very serious. Here's what happens.","zh":"很多喷气发动机就是这么工作的。你实际上每秒要解决一个优化问题50次。它们真的非常复杂，一个喷气发动机。里面有大约50种不同的东西。你选择的X至少是20维的。它包括各种各样的小的旁通阀之类的东西。你还可以改变迎角在道路上。这简直太疯狂了。燃料混合，各种各样的疯狂操作都可以用来运行喷气发动机。它们非常严肃。这就是会发生的事情。","start":2801.46,"end":2829.32},{"id":152,"text":"Actually solves a convex problem 50 times a second, right? And notice I said not a neural network. Nevertheless, that's because these things, they just work, right? So they're very good for that kind of stuff. Okay. But it's probably better not to get all weird about it.","zh":"实际上每秒解决一个凸问题50次，对吧？请注意，我说的是不是神经网络。然而，这些方法就是如此有效，对吧？所以它们非常适合这种类型的问题。好的。但可能最好不要过于奇怪地看待这些事情。","start":2829.83,"end":2851.09},{"id":153,"text":"and say things like, you know, like, oh, what are you doing? I'm solving a convex problem. I get the actual global solution, you know, blah, blah, blah, blah, blah. Oh, you're, oh, wow, look at you. You're, oh, is that, is that stochastic gradient descent? Oh, okay. You know, it's, it's, it's, it's better not to get too bent out of shape about all these things, right? Okay. Okay. So let's start with least squares.","zh":"并说一些像，你知道的，比如，你在做什么？我在解决一个凸问题。我得到了真正的全局解，你知道的， blah, blah, blah, blah, blah。哦，你在，哦，哇，看看你。你在，哦，这是不是随机梯度下降？哦，好的。你知道的，它，它，它，最好不要对所有这些事情太过激动，对吧？好的。好的。那我们从最小二乘开始。","start":2852.22,"end":2872.28},{"id":154,"text":"So like I said, Least Squares goes back to around 1800 with Gauss and Legendre, maybe Lagrange. I can't remember who was involved in this. And that's, of course, the Western mythology. So, I mean, almost certainly it was known in India or China for sure. And in various other ancient places, Persia for sure. Okay, so, you know, anyway.","zh":"正如我所说，最小二乘法可以追溯到大约1800年，与高斯和勒让德，也许还有拉格朗日有关。我不记得谁参与了这个。当然，这是西方的神话。我的意思是，几乎可以肯定在印度或中国早就知道了。在各种其他古代地方，比如波斯，肯定也是这样。好的，所以，你知道的，不管怎样。","start":2873.04,"end":2896.04},{"id":155,"text":"This has a least square solution. By the way, because it has a least square solution, that means it's taught. It's taught by people who have this 19th century math training, which is most people who teach. You write down the formula and a lot of paper and pencil kind of stuff, just like their parents did and their grandparents and their great-grandparents, that kind of stuff. It's fine, and we shouldn't make too much fun of it because a lot of stuff was built that way.","zh":"这个问题有一个最小二乘解。顺便说一句，因为这个问题有最小二乘解，这意味着它是被教授的。它是被那些有19世纪数学训练的人教授的，而这些人是大多数教授。你写下公式，以及大量的纸笔操作，就像他们的父母、祖父母和曾祖父母那样。这没问题，我们不应该对它太过嘲笑，因为很多东西就是这样建立起来的。","start":2897.96,"end":2921.7},{"id":156,"text":"So it's just an analytical solution of A, whatever, if A has full rank and is tall. And there's lots of reliable and efficient algorithms and software to do this. And basically, you can solve this in a time which is proportional to, actually, this is a theme that you will know later in the class very well. It's the big times small squared theme.","zh":"因此，这仅仅是矩阵A的一个解析解，不管怎样，只要A是满秩且高瘦型的。并且有很多可靠且高效的算法和软件可以完成这个任务。基本上，你解决这个问题所需的时间与某个主题成正比，这个主题你将在本课程后面非常熟悉。这就是所谓的“大矩阵乘以小矩阵平方”的主题。","start":2923.55,"end":2944.15},{"id":157,"text":"There's two dimensions here, right? There's the number of rows. That's the number of terms in your least squares problem. And x, this is the dimension of x. That's the number of variables you have, right? Which is n here, okay?","zh":"这里有两个维度，对吧？一个是行数。这是你最小二乘问题中的项数。而x，这是x的维度。这是你拥有的变量数量，对吧？这里就是n，好的？","start":2945.0,"end":2957.44}],"notes":["本段介绍了凸优化在实际工程中的应用，如喷气发动机的控制，其中每秒需要解决50次优化问题。这些问题涉及多个变量和复杂的控制参数，如喷嘴角度、燃料混合等。这说明了凸优化在现实世界中的重要性。","讲者指出，虽然这些优化问题可能涉及凸优化，但并不一定是神经网络。这表明凸优化在某些领域（如航空工程）中具有独特的优势，能够提供可靠的全局最优解。","讲者提到，尽管凸优化在理论上可以提供全局最优解，但实际应用中人们可能对这些方法过于执着，甚至将其与随机梯度下降等方法混淆。这提醒我们不要过度关注这些技术细节。","讲者回顾了最小二乘法的历史，指出其起源可以追溯到1800年左右，由高斯、勒让德和拉格朗日等人提出。同时，他也提到这种技术可能在古代文明（如印度、中国、波斯）中已有应用。","讲者强调，最小二乘法的解法是通过解析方法实现的，这需要一定的数学训练。尽管这种方法可能显得繁琐，但它是许多现代技术的基础。","讲者提到，最小二乘法的求解时间与问题的规模有关，特别是当矩阵A具有全秩且为高维时，求解时间与矩阵的行数和列数的乘积有关。这为后续课程中讨论的计算复杂度提供了背景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2801.46,"end":2957.44,"asr_flags":[153],"translation_complete":true,"translated_segments":7,"ra
