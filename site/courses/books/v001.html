ook. You will not do actual programming because you're going to write scripts that are like 10 lines long."},{"id":35,"text":"I mean, basically. So to me, that doesn't cross over the threshold to programming. So, you know, but you have to know what a notebook is and know your way a little bit around Python and object-oriented things. But it's, you know, that's all. So nothing fancy, nothing advanced."},{"id":36,"text":"So the TAs and I, we've been having a lot of fun with chat GPT. I mean, us and a million other people, right? But anyway, so we have typed in interesting, you know, like actually homework problems, final exam problems. And I mean, and, you know, there was actually one final exam problem. It was a very straightforward one where it actually came up with a completely reasonable solution and generated code that ran."},{"id":37,"text":"But that's cool because we have a category of final exam problem where it just goes like this. We just tell you exactly what to do. We say, here's a field. You have to decide these things. Here's this flux balance constraint. Here's this thing. Here's another constraint. Here's the objective. And then what happens is you just assemble it, write it into six lines of Python and run it. And presumably there's an example there that shows you you just did something good."},{"id":38,"text":"Right. Like like if it's an image thing, like a smiley face comes up or I don't know, that kind of thing. Right. So we have those. Actually, once I had a hilarious thing where someone turned in his final and I said, how was it? And he said, yeah, I mean, problem three. I was like, problem three. That was like that was like we told you exactly. He said."}],"notes":["本段主要介绍了课程的先决条件，包括线性代数和概率论，这两门课程是必不可少的。讲者指出，学生不应认为自己已经掌握了这些知识，尤其是如果他们曾参加过一些不系统的机器学习课程。此外，讲者还提到，学生需要具备基本的Python编程能力，但不需要深入的编程技能，因为课程中的编程任务较为简单，通常只需编写10行左右的代码。","讲者提到，课程中会使用Chat GPT等工具来辅助教学，例如在作业和考试中输入问题，让AI生成解决方案和代码。讲者指出，AI有时能生成合理的答案和可运行的代码，但并非所有问题都能得到完美的解答，有些问题需要学生自己动手完成。","讲者还提到，课程中的  so that means you speak, you know, at this level using a lexicon and language that anyone mathematically trained should understand. Because that's how you go back. If I talk to someone in finance and they start blabbering stuff and I have no idea what they're talking about, I was like, whoa, dude, let's slow down, right? I'd say, what does that even mean? And then theoretically, we can all back up until we get to math."}],"speech_gaps":[],"frame":"../frames/v001/009.webp","frame_time":1340.96},{"title":"课程介绍与优化问题概述","segments":[{"id":98,"text":"and then they can say it. Then they can hopefully explain what they're trying to say, right? So that's kind of what we're going to do. But well, every now and then, actually, just for cultural enrichment, I might mention some dialect things. Also, that's a social advantage for you because if you find yourself at a party and all of a sudden, there you are with a bunch of like quants, I'll tell you a couple of words you drop and they'll go like, what? Like that. So that's just for fun, though. That's for cultural enrichment. So, okay. All right."},{"id":99,"text":"Now I think I have covered everything. Any questions about it? Okay. So we're going to jump into just a big overview lecture. And don't get the wrong idea. This is absolutely not representative. First of all, I'll go fast. I won't define a lot of terms, which is not what's going to happen during the class. Everything I'm about to talk about, we will talk about in hideous detail in the next four to five weeks. So don't worry about that."},{"id":100,"text":"So this is not representative, but we'll go over it. So I'll start with just a quick informal introduction to what is mathematical optimization. We'll talk about actually probably the two most important problem classes there are. Least squares is for sure number one, and number two, I think would probably be linear programming. We'll talk about that. Then in fact,"},{"id":101,"text":"the parent of those is actually convex optimization. So we'll get to that, which is more. So it's just to orient you into how, you know, what is the whole, what's the big picture, okay? And I'll say a little bit, we'll look at a little example and stuff like that. And I'll say a little bit about a brief history of it."},{"id":102,"text":"Okay, so here's what an optimization problem is. And I'm going to, you know, we'll go over this a lot more in much more detail later, right? But so now this is just a quick, quick, fast introduction. Okay, so..."},{"id":103,"text":"So it's an optimization problem that looks like this. And there's some critical components. Number one is you have to have something called the optimization variable. Actually, so here's a phrase people use in management science for this and operations research. They call these the decision variables, which is a fantastic name because it tells you these are the things you need to choose. So that's decision variable. But that's dialect. So people in math would say, what are you talking? Would not know what that means."},{"id":104,"text":"So you have the variables that you're going to choose. And then you have a couple of components. And by the way, I actually think of a problem in my own mind. By the way, minimize is not min. Min is a mathematical operator. It has only one definition and has always only had one definition. It takes as argument a finite set of numbers, and it returns the smallest one."}],"notes":["本段主要讲解了优化问题的基本概念，包括优化变量（decision variables）和最小化操作符（min）的定义。讲者指出，'min' 是一个数学运算符，其定义是明确的，它接受一个有限数集作为输入，并返回其中最小的数。讲者还提到，'decision variables' 是运筹学和管理科学中常用的术语，用来表示需要选择的变量，而数学家可能不熟悉这个术语。","讲者强调了优化问题的结构，包括优化变量、目标函数和约束条件。他指出，虽然在课堂上会详细讲解这些内容，但本段只是快速介绍。讲者还提到，'min' 是一个数学运算符，而不是一个动词，它有唯一的定义，不能被误解为其他含义。","讲者通过对比不同领域对同一概念的称呼，展示了术语的多样性。例如，'decision variables' 是运筹学中的术语，而数学家可能更倾向于使用更通用的术语如 'variables'。这种差异反映了不同学科对同一概念的不同表达方式。","讲者还指出，'min' 是一个数学运算符，其定义是严格的，它只能作用于有限数集。这一点对于理解优化问题的数学基础非常重要，因为优化问题通常涉及寻找最小值或最大值。","讲者通过强调术语的准确性和定义的唯一性，帮助学生建立对优化问题的正确理解。他提醒学生注意术语的使用，避免混淆不同的概念，例如将 'min' 误认为是一个动词。","最后，讲者提到，虽然本段只是快速介绍，但后续课程会详细讲解优化问题的各个方面，包括目标函数、约束条件和优化变量等。这为学生后续学习奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1501.47,"end":1676.9,"asr_flags":[],"raw_segments":[{"start":1501.47,"text":"and then they can say it. Then they can hopefully explain what they're trying to say, right? So that's kind of what we're going to do. But well, every now and then, actually, just for cultural enrichment, I might mention some dialect things. Also, that's a social advantage for you because if you find yourself at a party and all of a sudden, there you are with a bunch of like quants, I'll tell you a couple of words you drop and they'll go like, what? Like that. So that's just for fun, though. That's for cultural enrichment. So, okay. All right."},{"start":1530.96,"text":"Now I think I have covered everything. Any questions about it? Okay. So we're going to jump into just a big overview lecture. And don't get the wrong idea. This is absolutely not representative. First of all, I'll go fast. I won't define a lot of terms, which is not what's going to happen during the class. Everything I'm about to talk about, we will talk about in hideous detail in the next four to five weeks. So don't worry about that."},{"start":1562.41,"text":"So this is not representative, but we'll go over it. So I'll start with just a quick informal introduction to what is mathematical optimization. We'll talk about actually probably the two most important problem classes there are. Least squares is for sure number one, and number two, I think would probably be linear programming. We'll talk about that. Then in fact,"},{"start":1589.77,"text":"the parent of those is actually convex optimization. So we'll get to that, which is more. So it's just to orient you into how, you know, what is the whole, what's the big picture, okay? And I'll say a little bit, we'll look at a little example and stuff like that. And I'll say a little bit about a brief history of it."},{"start":1608.72,"text":"Okay, so here's what an optimization problem is. And I'm going to, you know, we'll go over this a lot more in much more detail later, right? But so now this is just a quick, quick, fast introduction. Okay, so..."},{"start":1623.56,"text":"So it's an optimization problem that looks like this. And there's some critical components. Number one is you have to have something called the optimization variable. Actually, so here's a phrase people use in management science for this and operations research. They call these the decision variables, which is a fantastic name because it tells you these are the things you need to choose. So that's decision variable. But that's dialect. So people in math would say, what are you talking? Would not know what that means."},{"start":1653.43,"text":"So you have the variables that you're going to choose. And then you have a couple of components. And by the way, I actually think of a problem in my own mind. By the way, minimize is not min. Min is a mathematical operator. It has only one definition and has always only had one definition. It takes as argument a finite set of numbers, and it returns the smallest one."}],"speech_gaps":[],"frame":"../frames/v001/010.webp","frame_time":1513.47},{"title":"优化问题的定义与约束","segments":[{"id":105,"text":"Period. That's what min is. Minimize is actually a different thing. I mean, it's a similar idea. I actually think of this as a constructor for a problem. That's really what that is. So I actually think of this in an object-oriented way, and I believe that's absolutely the correct way to do it. So an optimization problem is actually an object in an object-oriented language, and it has different attributes and fields. It's got an objective."},{"id":106,"text":"It's got an objective, and it's got constraints. And so let me explain a little bit about how that works. I have a function, f0. That's going to be our objective function here. And, you know, what that is, I mean, one way people describe this, I think it's a really good description, actually, is they call that, it's a best effort situation. Best effort means whatever value of f0 of x you come up with, we'll accept it."},{"id":107,"text":"And the predicates describe constraints. And these are some, you know, sometimes people call this hard constraints, right? Or something like that. Because the semantics is really, really simple. The semantics is this. If someone proposes an X and one of these is violated and it doesn't matter by how much, then it is completely unacceptable. Okay?"},{"id":108,"text":"And the predicates describe constraints. And these are some, you know, sometimes people call this hard constraints, right? Or something like that. Because the semantics is really, really simple. The semantics is this. If someone proposes an X and one of these is violated and it doesn't matter by how much, then it is completely unacceptable. Okay? So that is the semantics of a constraint. I mean..."},{"id":109,"text":"We'll see where constraints come from in the wild. They can come from different places and have different attributes. Sometimes it's like it's a physics thing. Or it's something like, actually, guess what? Covariance matrices are positive semi-definite. So please don't give me one that's either not symmetric or has a negative eigenvalue. Thank you, kind of thing. Or it could be just a modest preference."},{"id":110,"text":"Like, please keep the leverage on my portfolio less than 6.7. And you'd say, well, we had a good day and some things went up and now it's 6.8. Whatever, right? So we'll talk about those later. But that's the meaning of a constraint. Okay. And then a solution or optimal point, right? X star."}],"notes":["本段讲解了优化问题中约束的定义和性质。约束被描述为谓词，即数学表达式，其结果为真或假。约束的语义是，如果任何约束被违反，无论违反程度如何，该解都是完全不可接受的。这强调了约束在优化问题中的严格性。","讲者提到约束可能来自不同来源，例如物理约束或统计约束。例如，协方差矩阵必须是半正定的，这意味着它必须是对称的且所有特征值非负。这表明约束可以是硬性约束，即必须严格满足的条件。","讲者还提到约束可以是软性约束，例如对投资组合杠杆率的限制。这种情况下，如果杠杆率超过某个阈值（如6.7），则可能被接受，但需要根据具体情况判断。这说明约束可以有不同的属性和处理方式。","讲者强调了约束在优化问题中的重要性，即它们定义了可行解的集合。任何违反约束的解都被视为无效，因此在求解优化问题时必须确保所有约束都被满足。","讲者通过协方差矩阵的例子说明了约束的数学性质，即半正定性。这表明在优化问题中，约束可能涉及复杂的数学条件，如对称性和特征值的限制。","讲者最后提到，约束的来源和属性可能不同，这需要在实际问题中进行具体分析。这说明在实际应用中，约束的处理需要根据具体问题的性质进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1677.35,"end":1830.14,"asr_flags":[],"raw_segments":[{"start":1677.35,"text":"Period. That's what min is. Minimize is actually a different thing. I mean, it's a similar idea. I actually think of this as a constructor for a problem. That's really what that is. So I actually think of this in an object-oriented way, and I believe that's absolutely the correct way to do it. So an optimization problem is actually an object in an object-oriented language, and it has different attributes and fields. It's got an objective."},{"start":1704.46,"text":"It's got an objective, and it's got constraints. And so let me explain a little bit about how that works. I have a function, f0. That's going to be our objective function here. And, you know, what that is, I mean, one way people describe this, I think it's a really good description, actually, is they call that, it's a best effort situation. Best effort means whatever value of f0 of x you come up with, we'll accept it."},{"start":1730.82,"text":"By the way, the smaller it is or the more negative it is, the happier we are. But we'll accept it. Just do your best on that. Now, the constraints, these are predicates. So a predicate is a mathematical expression that evaluates to either true or false. So they're either satisfied or they're not."},{"start":1752.92,"text":"And the predicates describe constraints. And these are some, you know, sometimes people call this hard constraints, right? Or something like that. Because the semantics is really, really simple. The semantics is this. If someone proposes an X and one of these is violated and it doesn't matter by how much, then it is completely unacceptable. Okay? So that is the semantics of a constraint. I mean..."},{"start":1780.61,"text":"We'll see where constraints come from in the wild. They can come from different places and have different attributes. Sometimes it's like it's a physics thing. Or it's something like, actually, guess what? Covariance matrices are positive semi-definite. So please don't give me one that's either not symmetric or has a negative eigenvalue. Thank you, kind of thing. Or it could be just a modest preference."},{"start":1805.92,"text":"Like, please keep the leverage on my portfolio less than 6.7. And you'd say, well, we had a good day and some things went up and now it's 6.8. Whatever, right? So we'll talk about those later. But that's the meaning of a constraint. Okay. And then a solution or optimal point, right? X star."}],"speech_gaps":[],"frame":"../frames/v001/011.webp","frame_time":1689.35},{"title":"优化问题与示例","segments":[{"id":111,"text":"Right? That's a star and not a little asterisk, right? So asterisk is going to be reserved for some other concepts we're going to see later in the class, which are really cool, but not now. So star sort of means optimal here. And what it means is it has the smallest objective value among all choices that satisfy the constraints. Okay, so I mean, I'm just, this is obvious and you should kind of know this anyway or something. And you've probably seen this in lots of fields, but that's what it is."},{"id":112,"text":"Okay so that's an optimization problem um okay there you go oh and of course there's tons of variations which we'll look at you could maximize something typically if you maximize it something like a utility or a profit or something like that right or you know or whatever some or a score or something like that you would ma that's okay but we'll look at those variations later okay"},{"id":113,"text":"So let's first look at some examples about, you know, by the way, you'll see tons of examples before the course is over. Right. OK, so, I mean, here's one. Let's do portfolio optimization. Right. So you want to construct a portfolio of, let's say, you know, 5000 assets. Right. And so what that means is you have to decide how much of each of these do you hold?"},{"id":114,"text":"And it could be negative. That means like a short position. And you don't have to know what I'm talking about. It's fine. But that's what that would mean. A negative short position means you actually borrowed it from someone but had the obligation to pay it back later. And that actually is the same as owning a negative number of shares. That's a short position. Again, you don't need to know that or whatever. Well, you will see all this. That's just for cultural enrichment. Consider that part of cultural enrichment if you're not in that field."},{"id":115,"text":"Your job is to choose how much you put in. And, you know, presumably there's a budget like please invest a billion dollars or something like that or something like that. There could be things like a minimum and maximum allowed investment. Like, please don't put any more than 10 percent of your total portfolio in any one name. That would be that was I just said that in dialect. OK, but I think you knew what I meant. Right."},{"id":116,"text":"You know, there could be a minimum expected return. You could say, I'd like to make at least 8% a year. At least that's my expectation according to my various models, right? Something like that. The constraints might be, well, I mentioned one already, a budget, you know, a minimum return. And the objective, you know, might be something like the overall risk or the risk is a dialect for the variance of the return."}],"notes":["本段讲解了优化问题的基本概念，包括最大化或最小化目标函数，同时满足约束条件。讲者提到优化问题可以应用于各种领域，如投资组合优化，其中目标可能是最大化利润或最小化风险，而约束可能包括预算限制或最低预期回报。","讲者通过投资组合优化的例子，说明了如何在多个资产之间分配资金，允许负值表示做空操作。同时，讲者提到约束条件可能包括投资比例限制和最低预期回报，目标函数可能是风险（即收益方差）的最小化。","讲者强调了优化问题的普遍性，并指出在课程中将看到大量不同类型的优化问题，包括最大化和最小化目标函数，以及各种约束条件的组合。","讲者提到风险在优化问题中通常被定义为收益的方差，这表明在投资组合优化中，风险是通过收益的波动性来衡量的，而目标是找到在满足约束条件下的最优风险水平。"," e. Let's do portfolio optimization. Right. So you want to construct a portfolio of, let's say, you know, 5000 assets. Right. And so what that means is you have to decide how much of each of these do you hold?"},{"start":1909.82,"text":"And it could be negative. That means like a short position. And you don't have to know what I'm talking about. It's fine. But that's what that would mean. A negative short position means you actually borrowed it from someone but had the obligation to pay it back later. And that actually is the same as owning a negative number of shares. That's a short position. Again, you don't need to know that or whatever. Well, you will see all this. That's just for cultural enrichment. Consider that part of cultural enrichment if you're not in that field."},{"start":1939.08,"text":"Your job is to choose how much you put in. And, you know, presumably there's a budget like please invest a billion dollars or something like that or something like that. There could be things like a minimum and maximum allowed investment. Like, please don't put any more than 10 percent of your total portfolio in any one name. That would be that was I just said that in dialect. OK, but I think you knew what I meant. Right."},{"start":1966.01,"text":"You know, there could be a minimum expected return. You could say, I'd like to make at least 8% a year. At least that's my expectation according to my various models, right? Something like that. The constraints might be, well, I mentioned one already, a budget, you know, a minimum return. And the objective, you know, might be something like the overall risk or the risk is a dialect for the variance of the return."}],"speech_gaps":[],"frame":"../frames/v001/012.webp","frame_time":1842.72},{"title":"凸优化在金融与电子设计中的应用","segments":[{"id":117,"text":"Right? So that's what you'd do. So you'd say, among all portfolios, you know, with a leverage less than 3.6, with blah, blah, blah, with this thing, with that thing, with, you know, no , and you got parameters. If you're doing land of old-school statistics, you might have 10, and if you're training a neural network, you might have 10 billion."},{"id":129,"text":"But those are the variables in an optimization problem. Then the constraints might be based on prior information, like if you're estimating, for example, an intensity, it's got to be positive, it can't be negative. If you're estimating a covariance matrix, it's got to be positive semi-definite. So these are like constraints. Let's see. Your objective typically involves two things."},{"id":130,"text":"The first is a measure of misfit with the data you have, the training data, right? So that's the first thing. Like if someone says, what are you doing? You say, I'm fitting a model. You go, how are you doing it? And you go, well, I mean, the first thing is I wanted to reproduce the data I have. Then the critical part, so I mean, because if you're not doing well on the historical data."}],"notes":["本段讲授了电路设计中优化的应用，特别是针对关键路径的尺寸调整。关键路径是指在时钟频率为2.8 GHz时，信号从一个位置传输到另一个位置的路径。这些路径需要较大尺寸以确保信号在下一个时钟周期到来时有效。而其他路径则可以设置为最小尺寸。这种做法虽然直观，但实际上是通过优化实现的。","接下来，讲授了数据拟合在统计学和机器学习中的广泛应用。数据拟合是指通过优化问题来调整模型参数，使其尽可能拟合训练数据。变量是模型的参数，可以是统计模型或预测模型中的参数。参数的数量可以从10个到100亿个不等。","约束条件可能基于先验信息，例如估计强度时必须为正，估计协方差矩阵时必须为半正定。这些约束条件确保了模型的合理性。目标函数通常包括两个部分：一是衡量模型与训练数据之间的拟合误差，二是确保模型在历史数据上的表现。","在讲授过程中，强调了优化问题在实际应用中的重要性，包括电路设计和数据拟合。优化不仅涉及调整参数，还涉及满足各种约束条件，以确保模型的合理性和有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2168.89,"end":2321.84,"asr_flags":[],"raw_segments":[{"start":2168.89,"text":"You make them big, they're fast. Why? Because a lot of current can come in and charge up the capacitance fast, and it's going to be fast. That's the good news. Bad news? It's big, physically, right? And you've got a limit on area. Other bad news is it's power hungry. And, you know, so, and actually that's kind of, power is kind of the limiting thing right now in a lot of circuit design. Okay?"},{"start":2193.29,"text":"Okay, so now the idea i 凸函数在优化问题中具有良好的性质，如局部最优解即为全局最优解。","课程强调，凸优化问题的解决方法是将实际问题转化为凸问题，一旦成功，即视为完成。如果实际问题规模很大或有实时性要求，可以进一步优化算法以满足需求。这表明凸优化在实际应用中具有广泛的适用性。","凸函数的定义在几何上表现为非负曲率，即函数图像在任意两点之间的线段上不会向下弯曲。这种性质使得凸函数在优化问题中具有良好的性质，如局部最优解即为全局最优解。","课程指出，传统的优化分类方法将问题分为线性规划和非线性规划，这种分类方式被认为是错误的。实际上，凸优化问题的非线性部分（即非负曲率）并不复杂，而负曲率才是优化的难点。","凸优化问题的定义和性质在课程中被强调为关键内容，因为它们构成了整个课程的基础。凸函数的性质使得优化问题具有良好的解的结构，如局部最优解即为全局最优解。","课程通过对比传统分类方法，指出凸优化问题的非线性部分（即非负曲率）并不复杂，而负曲率才是优化的难点。这表明凸优化问题在实际应用中具有重要的意义。"],"formulas":[],"uncertainties":["f of alpha x plus beta y is less than or equal to alpha of x"],"diagram":"none","start":3464.92,"end":3643.63,"asr_flags":[],"raw_segments":[{"start":3464.92,"text":"And by the way, and the way we think of that, that's actually kind of the way it works in this class, right? If we reduce your practical problem to a convex problem, we declare success. We just say, done. And then if the person comes back and says, yeah, but we need to do it for gigantic ones, then we can help out making it work. Or they say, no, we have to do it for hard real time. It has to be done in 20 milliseconds, blah, blah, blah. And you're like, OK, whatever. But the point is, bottom zeroth order, you reduce it to convex, it's done."},{"start":3491.24,"text":"And that actually kind of fits. I mean, I think that's more than just a joke. It's actually kind of real. That every time, historically, when someone put something, formulated something as a convex problem and what people wanted to scale it or make it unbelievably reliable or something, they were able to do it. So that's an example. Yeah, so we'll look at that. And then that gets us to what the class is about, which is convex optimization."},{"start":3520.22,"text":"It's all about, this is what, I mean, kind of weird that the entire class is about this, but the, so it's actually very weird. It's a mild generalization of being, well, affine, right? And here I'll try to use the notation here. It basically says that f of, you know, alpha x plus beta y is less than or equal to alpha of x."},{"start":3546.78,"text":"f of x plus beta f of y. Now, there's some rules here. Alpha, beta have to be positive, and they have to sum to 1. OK? So roughly speaking, this means, and you know, obviously, we'll go over the whole, the rest of all this later. But you know, in one dimension, basically, it says that the curvature, it has to curve up. That's all it means. It has positive curvature, non-negative curvature. OK? So the entire class is about."},{"start":3576.81,"text":"with things that have non-negative curvature. That's the entire class. What's weird, it is weird when you first hear about this, is that there's some weird asymmetry. That is very weird, right? Because the classical thinking is, if everything is linear, oh, that's linear programming. In fact, in classical Western optimization, the way people think of it is, there's linear programming, and then are you ready for the other one? That's called?"},{"start":3605.3,"text":"non-linear programming, and you're supposed to go, ooh, wow, that's really complicated, and blah, blah, blah. Okay, everybody got it? So it turns out that view of the world is just stupid and wrong, okay? And the weird thing, what's really weird is it's this. It turns out curvature, right, which is non-linearity, turns out this is weird asymmetry, and non-negative curvature is just fine. But, you know, negative curvature, that does make it hard."},{"start":3633.45,"text":"So this is just not, this is not, I don't think this is obvious ahead of time, right? This is kind of an interesting part about it, right? So, okay. So that's a convex optimization problem where all the functions look like that."}],"speech_gaps":[],"frame":"../frames/v001/022.webp","frame_time":3476.92},{"title":"凸优化的概述与技术应用","segments":[{"id":185,"text":"And, you know, it's like linear programming. You know, there's analytical solutions for about 17 of these. And really, who cares about those anyway, right? So, you know, least squares and, you k eck what happens. So two proposed constraints, right? The first is that no more than half the total power is in any 10 lamps. I could probably make up some kind of practical reason why you might impose a constraint like that. But usually constraints like that are just made up by people who have no idea what they're doing. And so they just made it up, right? So the second is this. No more than half the lamps are on."},{"id":207,"text":"By the way, that gets us to something very interesting, which is actually, suppose you were designing a building or a lab experiment or who knows, a piece of equipment, and you wanted to choose where to put the lights. So you could very reasonably do something like solve this problem with a million potential light locations, but you'd like to solve it with 990."},{"id":208,"text":"And what you're hoping, then you'd say, it's got to support my loads. It's got to have my, it has to satisfy these dynamic, you know, blah, blah, blah. And what you're hoping, you have no intention of building a bridge with 100 million bars, right? And, you know, then if you're lucky, it comes out and the solution is sparse. And congratulations, you just designed the topology of the truss. I don't know if that made sense, but that was, okay, fine."},{"id":209,"text":"And what you're hoping, then you'd say, it's got to support my loads. It's got to have my, it has to satisfy these dynamic, you know, blah, blah, blah. And what you're hoping, you have no intention of building a bridge with 100 million bars, right? And, you know, then if you're lucky, it comes out and the solution is sparse. And congratulations, you just designed the topology of the truss. I don't know if that made sense, but that was, okay, fine."}],"notes":["本段主要讲解了凸函数的直观判断方法，即通过观察函数图像是否向上弯曲来判断其凸性。讲者通过一个具体的例子说明了当变量u变化时，误差如何随着u的变化而变化，强调了凸函数的性质：当u增加时，误差线性增长，而当u减少时，误差则呈倒数关系。讲者还提到，当u等于1时，误差为零，这是最小值点。","讲者随后引入了约束条件的概念，说明在优化问题中，约束条件可以是实际问题中的物理限制，例如限制任何10个灯泡的总功率不超过总功率的一半，或者限制灯泡数量的一半不能开启。这些约束条件通常由设计者根据实际需求设定，但有时也可能只是随意设定。","讲者进一步讨论了在实际工程设计中，如何通过优化问题来选择灯泡的位置。他提到，可以将问题规模从百万个潜在位置缩小到990个，甚至99%的位置为零，从而减少计算复杂度。这种做法在结构设计中很常见，例如在设计桁架结构时，通过优化变量（如截面面积）来实现结构的最优配置。","讲者还提到，设计者通常不会实际建造包含大量构件的结构，而是希望优化后的解是稀疏的，即大部分变量为零，从而实现结构的最优拓扑设计。这种稀疏性在实际工程中具有重要意义，因为它可以显著减少材料使用和成本。","讲者通过一个具体的例子说明了如何通过优化问题来设计结构，强调了凸优化在实际工程中的应用价值。他指出，虽然优化问题可能看起来复杂，但通过合理设定约束条件和目标函数，可以有效地找到最优解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4147.31,"end":4307.2,"asr_flags":[],"raw_segments":[{"start":4147.31,"text":"right? So u is the ratio of one thing to positive things, right? If it's one, they're equal, and that's the minimum. If you could subtract one if you want here and make this zero, right? But if you increase it above that, then your fractional error grows linearly. If you decrease it, it's like one over u, right? So this is, I think you can call this, what, 100% error or something? And if I were down here, the 50% error points would be one half and, I don't know, 1.5? No."},{"start":4176.59,"text":"Somehow that didn't come out right. Okay, scrap that, right? But anyway, you get the idea. But the main thing here and the only thing you should be able to do now is take your eyeball and say, that curves upward, that's convex. Okay, so make sense? So that's the idea. So you get the exact solution and I mean, it's just, you know, not a problem. And now for fun, I'll add some constraints to it."},{"start":4206.51,"text":"And we'll check what happens. So two proposed constraints, right? The first is that no more than half the total power is in any 10 lamps. I could probably make up some kind of practical reason why you might impose a constraint like that. But usually constraints like that are just made up by people who have no idea what they're doing. And so they just made it up, right? So the second is this. No more than half the lamps are on."},{"start":4235.48,"text":"By the way, that gets us to something very interesting, which is actually, suppose you were designing a building or a lab experiment or who knows, a piece of equipment, and you wanted to choose where to put the lights. So you could very reasonably do something like solve this problem with a million potential light locations, but you'd like to solve it with 990."},{"start":4260.06,"text":"of the, or whatever, you know, with 99% of them, zero, right? Because if a lamp is zero, it means you didn't need it, okay? In fact, people design structures that way. You take a big old structure, you put in way too many bars or a space frame, you put way too many bars in you're going to need, and your variables are the cross-sectional areas, okay?"},{"start":4281.98,"text":"And what you're hoping, then you'd say, it's got to support my loads. It's got to have my, it has to satisfy these dynamic, you know, blah, blah, blah. And what you're hoping, you have no intention of building a bridge with 100 million bars, right? And, you know, then if you're lucky, it comes out and the solution is sparse. And congratulations, you just designed the topology of the truss. I don't know if that made sense, but that was, okay, fine."}],"speech_gaps":[],"frame":"../frames/v001/026.webp","frame_time":4159.31},{"title":"凸优化的直观理解与问题复杂性","segments":[{"id":210,"text":"What? Architects love you, too. Yeah. You know, using material. Yeah, no, no, exactly. So, okay. All right. So, I'll just, you know, I mean, here, it's here. So, it turns out these two look very similar, don't they? And they both look kind of weird and combinatorial, right? Like, you would, I mean, later in the class, you might say, I don't know, they both look kind of hard, right? So, it turns out this one is convex."},{"id":211,"text":"It's very weird, but it is. And the second one is not. I could repeat this. I could transcribe this to any field you like. It would be, construct me a portfolio of 10,000 assets, world market or whatever, but I don't want to hold more than 100 names. That's an example of that. That's actually hard."},{"id":212,"text":"But I could say, I could put a concentration, I could say things like this. I don't want more than 5% of my portfolio to live in any collection of 100 names. Everybody follow that? Someone says, why would you do that? And you go, that's an anti-concentration, you know, blah, blah, blah, inequality, constraint. Anyway, that one's convex. It's just convex, right? So, okay. This is weird, but it actually tells you a very important point. It's actually why you're here, and it's why the class is not like two lectures."},{"id":213,"text":"So I like to think of it this way. In fact, that's part of what the class is about. We are going to break your idea about what's easy and what's hard for an optimization problem. Because unless you know the things you're going to know in this class, you are wrong."},{"id":214,"text":"And it is not obvious. That's, I think, it's kind of interesting, right? Like if I show you a linear program and I tell you, oh my God, you know, it's got this dimensions. There's more vertices than the number of subatomic particles in the universe. And you're like, whoa, whoa, boy, oh, you know. And then I'd say, yeah, I can solve that in 50 milliseconds on my phone, okay? So it's just, I'm just saying these things are not obvious. They're weird. So, or another way that I would usually say something like this, that this is,"},{"id":215,"text":"I guess problem complexity is not continuous in the intuition norm. That's the way to say it, right? So it means two things can look intuitively to be very similar. You're like, yeah, whatever. They look about the same. But one can be really hard and one is really easy, right? So that's the idea. Okay."}],"notes":["本段讲授了凸优化问题的直观理解，强调了问题复杂性与直觉之间的差异。讲者通过两个看似相似但实际复杂度不同的优化问题进行对比，指出凸优化问题虽然看起来复杂，但实际上是可解的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4308.63,"end":4459.53,"asr_flags":[],"raw_segments":[{"start":4308.63,"text":"What? Architects love you, too. Yeah. You know, using material. Yeah, no, no, exactly. So, okay. All right. So, I'll just, you know, I mean, here, it's here. So, it turns out these two look very similar, don't they? And they both look kind of weird and combinatorial, right? Like, you would, I mean, later in the class, you might say, I don't know, they both look kind of hard, right? So, it turns out this one is convex."},{"start":4338.04,"text":"It's very weird, but it is. And the second one is not. I could repeat this. I could transcribe this to any field you like. It would be, construct me a portfolio of 10,000 assets, world market or whatever, but I don't want to hold more than 100 names. That's an example of that. That's actually hard."},{"start":4362.42,"text":"But I could say, I could put a concentration, I could say things like this. I don't want more than 5% of my portfolio to live in any collection of 100 names. Everybody follow that? Someone says, why would you do that? And you go, that's an anti-concentration, you know, blah, blah, blah, inequality, constraint. Anyway, that one's convex. It's just convex, right? So, okay. This is weird, but it actually tells you a very important point. It's actually why you're here, and it's why the class is not like two lectures."},{"start":4391.81,"text":"So I like to think of it this way. In fact, that's part of what the class is about. We are going to break your idea about what's easy and what's hard for an optimization problem. Because unless you know the things you're going to know in this class, you are wrong."},{"start":4409.43,"text":"And it is not obvious. That's, I think, it's kind of interesting, right? Like if I show you a linear program and I tell you, oh my God, you know, it's got this dimensions. There's more vertices than the number of subatomic particles in the universe. And you're like, whoa, whoa, boy, oh, you know. And then I'd say, yeah, I can solve that in 50 milliseconds on my phone, okay? So it's just, I'm just saying these things are not obvious. They're weird. So, or another way that I would usually say something like this, that this is,"},{"start":4439.14,"text":"I guess problem complexity is not continuous in the intuition norm. That's the way to say it, right? So it means two things can look intuitively to be very similar. You're like, yeah, whatever. They look about the same. But one can be really hard and one is really easy, right? So that's the idea. Okay."}],"speech_gaps":[],"frame":"../frames/v001/027.webp","frame_time":4320.63},{"title":"课程目标与实际应用","segments":[{"id":216,"text":"Let's see. Okay, so this is this example. I'll just say a little bit about the course goals and then I think we'll just finish up today. So, you know, the main goal is to be able to recognize convex problems, right? And so the reason is it is not going to happen to you that you go to an internship or a startup or something and someone says, whoa, I have this optimization problem. I think it might be convex. It's not going to happen."},{"id":217,"text":"what's going to happen is they're going to come to you and it's going to be unbelievably complicated and they're going to say oh do you know about like you know mortgage swap derivative you know options and what and you're like and then they'd say well here's the basics of this and here's that and here's that oh yeah here's a giant book read that and an intern fit this model and you're like whoa so it's going to be really complicated this this is the way it really works right and it's going to be your job to cut through all the noise sit back come back the next day and go it's done"},{"id":218,"text":"I can schedule your EV charging. And they'll go, what do you mean? It's really complicated. Like, you know, we have limits on the total amount of power here and blah, blah, blah. And different people, different customers have different goals about when they want to have so much charge. And you're like, it's done. You'll just say it's done. So that's what we're training you for. So that actually, weirdly, that actually happens. Like, I've actually had students come back to me."},{"id":219,"text":"Fall the next year one came back and I was like, what is it? And he said you said"},{"id":220,"text":"Yeah, you know, you rant and rave about it. They said, we just thought you were just telling stories and being weird and stuff. I was like, yeah, mostly I am. And he said, yeah, but what he said actually really happened to me. Like, I actually really went and they said, oh, we want to make this regression model. It's super complicated. And there's this and that. And you have to do this and that. And there's causality. And you can't use this before that. And let's remember that the Hong Kong thing, those prices closed before this opened. And you're like, whoa. Anyway, it turned out."},{"id":221,"text":"It was just convex, the whole thing. And I said, well, what happened then? He said, I was the superstar intern, right? And he said, actually, it was finished in about a week. But anyway, so it actually does happen, just to let you know. OK. And then it's very much the class that focuses in no way whatsoever on the theory. There's extremely interesting theory here. But there is no."},{"id":222,"text":"We're not interested in that. We're actually interested in solving problems. And so, you know..."},{"id":223,"text":"You will have practice writing these 10-line scripts. You can't get out of here. You will have done signal processing. You'll do machine learning. You're going to do control. You're going to do portfolio construction. You're going to find arbitrage-free bounds on prices. I don't know what you're going to do, but you're going to do a lot of weird practical stuff. I mean, kind of sandbox versions of things, but still, they will be completely real."}],"notes":["本段主要讲解了课程的目标，即帮助学生识别凸优化问题，并强调在实际应用中，学生将面对复杂的问题，但需要能够快速识别并解决这些问题。课程的重点是实际应用而非理论，学生将学习如何在各种实际场景中应用凸优化，如信号处理、机器学习、控制、投资组合构建等。","讲者通过一个实际案例说明了课程的实际应用价值，即学生在实习或工作中遇到复杂问题时，能够快速识别其为凸优化问题并解决。这个例子表明，虽然问题看起来复杂，但其本质可能是凸的，从而可以高效求解。","课程强调实践性 function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
