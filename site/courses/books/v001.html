-grandparents, that kind of stuff. It's fine, and we shouldn't make too much fun of it because a lot of stuff was built that way."},{"start":2923.55,"text":"So it's just an analytical solution of A, whatever, if A has full rank and is tall. And there's lots of reliable and efficient algorithms and software to do this. And basically, you can solve this in a time which is proportional to, actually, this is a theme that you will know later in the class very well. It's the big times small squared theme."},{"start":2945.0,"text":"There's two dimensions here, right? There's the number of rows. That's the number of terms in your least squares problem. And x, this is the dimension of x. That's the number of variables you have, right? Which is n here, okay?"}],"speech_gaps":[],"frame":"../frames/v001/018.webp","frame_time":2813.46},{"title":"最小二乘法的实用性和应用","segments":[{"id":158,"text":"And, you know, the computation time for this is, you know, is nothing. And if A is structured like it's sparse, you can do this even faster. But you can do these at just stunning speeds, I'm sure people here know. Like, you know, it's absolutely, it is nothing to solve a problem with, you know, 10 million entries and, you know, a couple of hundred.","zh":"而且，你知道，计算时间其实非常短。如果你的矩阵A是稀疏结构，你甚至可以更快地完成计算。但你可以以惊人的速度完成这些计算，我相信在座的人都知道。比如，你知道，解决一个有1000万条数据和几百个参数的问题，这简直不值一提。","start":2959.13,"end":2983.65},{"id":159,"text":"and a couple hundred parameters or by the way the other way around with regularization it's just absolutely nothing i can do that on a laptop okay and then what what can we do on a gpu like don't even get me started right so i mean you so these things are really uh pretty crazy okay","zh":"以及几百个参数，或者反过来，通过正则化，这完全不值一提，我可以在笔记本电脑上完成。那么，我们能在GPU上做些什么呢？别提了，所以，这些事情真的非常疯狂，对吧？","start":2984.9,"end":3003.48},{"id":160,"text":"So that's a mature technology. So the question is, how do you use least squares? It's actually a really good question. You could teach a super awesome two-week short course on it, which is basically like, that's least squares. We can solve them. End of story. You don't do the silly theory and stuff like that because it's totally irrelevant. So you just say, that's it. It's a fact. We can solve ginormous least squares problems. You can right now.","zh":"所以，这是一种成熟的技术。问题是，你如何使用最小二乘法？其实这是一个非常好的问题。你可以开设一个超级精彩的两周短期课程，基本上就是，这就是最小二乘法。我们可以解决它。完事了。你不需要做那些愚蠢的理论和那些东西，因为它们完全不相关。所以你只需要说，这就是事实。我们可以解决巨大的最小二乘问题。你现在就可以做到。","start":3004.56,"end":3028.94},{"id":161,"text":"right? You know, when you don't even need torch to do, you could solve just gigantic problems. And then you'd say, I'm going to show you some street fighting tricks for least squares and you will be empowered. Okay. So you could, this course doesn't exist, but it'd be awesome if it did. And there's just like, you learn about three or four tricks and you are good to go. Yeah. The tricks are things like throwing in weights on different, different, different data entries. I mean, which is silly.","zh":"对吧？你知道，你甚至不需要使用PyTorch就能解决巨大的问题。然后你会说，我要向你们展示一些最小二乘法的街头技巧，你们就会变得强大。好的。所以，这个课程并不存在，但如果有的话会非常棒。你只需要学习三到四个技巧，就可以上手了。是的。这些技巧包括对不同的数据条目添加权重。我的意思是，这很傻。","start":3029.45,"end":3054.95},{"id":162,"text":"regularization and adding terms. Like you'd say, well, I like the trajectory I got for my airplane, but you know, there's too much rudder movement. You're like, fine, throw in an additional least squares term on rudder movement, right? So these are the kinds of street fighting things people do. And it's really pretty cool, right? So everybody got this? So, you know, you learn a handful of tricks and least squares and you are good to go, right? And in a lot of practical problems. We should also not make fun of it because it runs.","zh":"正则化和添加项。比如，你会说，我喜欢我飞机的轨迹，但你知道，舵的运动太多了。你会说，好吧，添加一个关于舵运动的额外最小二乘项，对吧？这些就是人们在实际中使用的街头技巧。这真的很酷，对吧？所以，大家都明白了吗？所以，你知道，你只需要掌握几个技巧，就可以使用最小二乘法，对吧？在很多实际问题中，我们也不应该嘲笑它，因为它运行得很快。","start":3056.4,"end":3084.94},{"id":163,"text":"Most certainly most of last century's technology, right? I mean, come on, look, in statistics, it's called regression. Don't make fun of it because regression models are like really widely used and perfectly good. It's the basis. I mean, it gets fancier and stuff like it's the basis of the actual control that's used, right?","zh":"上个世纪的大多数技术，对吧？我是说，看吧，在统计学中，它被称为回归。不要拿它开玩笑，因为回归模型实际上被广泛使用，并且是非常好的。它是基础。我是说，它会变得更复杂，但它实际上是用于实际控制的基础，对吧？","start":3085.58,"end":3104.88},{"id":164,"text":"Which is not, of course, RL, if any of you thought that that was the case, right? That's a joke. So the actual control that's used on vehicles, generators, things like that, anything, it's all around you. That's all basically infinite dimensional variations on least squares. I'm filtering traditional signal processing, all least squares. Equalization, all these things.","zh":"当然，这并不是强化学习，如果你们中有人以为这就是强化学习的话，对吧？那是个笑话。实际上用于车辆、发电机等东西的控制，任何东西，它都围绕着你。这基本上都是最小二乘法在无限维空间上的变体。我正在过滤传统的信号处理，全部都是最小二乘法。均衡，所有这些内容。","start":3105.45,"end":3131.15}],"notes":["本段讨论了最小二乘法的计算效率和实际应用。讲师指出，即使对于包含数百万个条目和数百个参数的问题，最小二乘法的计算时间也非常短，甚至可以在笔记本电脑上快速解决。此外，讲师提到GPU可以进一步加速这些计算。","讲师强调最小二乘法是一个成熟的技术，可以用于解决大规模问题。他提到，可以开设一个为期两周的课程专门讲解最小二乘法，重点在于其实际应用而非理论推导。","讲师提到最小二乘法的一些实用技巧，例如在不同数据条目上添加权重、正则化和添加额外的最小二乘项。这些技巧被称为“街头战斗技巧”，用于改进模型的性能。","讲师指出，最小二乘法是统计学中的回归分析的基础，并且是许多实际控制系统的基石。他强调，尽管最小二乘法可能看起来简单，但它在实际应用中非常强大。","讲师澄清了最小二乘法与强化学习（RL）的区别，指出实际控制系统（如车辆和发电机）使用的是基于最小二乘法的无限维变体，而不是强化学习。","讲师提到传统信号处理中的滤波和均衡等技术也基于最小二乘法，说明其在工程和科学中的广泛应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2959.13,"end":3131.15,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2959.13,"text":"And, you know, the computation time for this is, you know, is nothing. And if A is structured like it's sparse, you can do this even faster. But you can do these at just stunning speeds, I'm sure people here know. Like, you know, it's absolutely, it is nothing to solve a problem with, you know, 10 million entries and, you know, a couple of hundred."},{"start":2984.9,"text":"and a couple hundred parameters or by the way the other way around with regularization it's just absolutely nothing i can do that on a laptop okay and then what what can we do on a gpu like don't even get me started right so i mean you so these things are really uh pretty crazy okay"},{"start":3004.56,"text":"So that's a mature technology. So the question is, how do you use least squares? It's actually a really good question. You could teach a super awesome two-week short course on it, which is basically like, that's least squares. We can solve them. End of story. You don't do the silly theory and stuff like that because it's totally irrelevant. So you just say, that's it. It's a fact. We can solve ginormous least squares problems. You can right now."},{"start":3029.45,"text":"right? You know, when you don't even need torch to do, you could solve just gigantic problems. And then you'd say, I'm going to show you some street fighting tricks for least squares and you will be empowered. Okay. So you could, this course doesn't exist, but it'd be awesome if it did. And there's just like, you learn about three or four tricks and you are good to go. Yeah. The tricks are things like throwing in weights on different, different, different data entries. I mean, which is silly."},{"start":3056.4,"text":"regularization and adding terms. Like you'd say, well, I like the trajectory I got for my airplane, but you know, there's too much rudder movement. You're like, fine, throw in an additional least squares term on rudder movement, right? So these are the kinds of street fighting things people do. And it's really pretty cool, right? So everybody got this? So, you know, you learn a handful of tricks and least squares and you are good to go, right? And in a lot of practical problems. We should also not make fun of it because it runs."},{"start":3085.58,"text":"Most certainly most of last century's technology, right? I mean, come on, look, in statistics, it's called regression. Don't make fun of it because regression models are like really widely used and perfectly good. It's the basis. I mean, it gets fancier and stuff like it's the basis of the actual control that's used, right?"},{"start":3105.45,"text":"Which is not, of course, RL, if any of you thought that that was the case, right? That's a joke. So the actual control that's used on vehicles, generators, things like that, anything, it's all around you. That's all basically infinite dimensional variations on least squares. I'm filtering traditional signal processing, all least squares. Equalization, all these things."}],"speech_gaps":[],"frame":"../frames/v001/019.webp","frame_time":2971.13},{"title":"凸优化简介与线性规划的讨论","segments":[{"id":165,"text":"So it's easy to make, you know, you kind of want to make fun of it, but I wouldn't because it's running most of the technology we have right now. And pretty well, thank you, right? So could you do a little bit better with convex? You can, yeah. But let's be humble a little bit, okay? In some cases, right? So, okay. So that's least squares. Linear programming. This is super interesting.","zh":"所以它很容易制作，你知道的，你可能会想拿它开玩笑，但我不这么做的，因为它正在运行我们目前大部分的技术。而且效果相当不错，对吧？所以你能用凸优化做得更好吗？可以，是的。但让我们稍微谦虚一点，好吗？在某些情况下，对吧？所以，好的。这就是最小二乘法。线性规划。这非常有趣。","start":3132.29,"end":3159.1},{"id":166,"text":"Yeah, I'm just curious. It depends on your background, but how many people have not seen linear programming, which is perfectly okay. It has nothing to do with you. Okay, cool. What's your background? Civil. Civil engineering. Yeah. Okay. I'm doing structural engineering. Oh, it's all LP. That's like, how do you... Oh, yeah.","zh":"是的，我只是好奇。这取决于你的背景，但有多少人没有见过线性规划，这完全没问题。这与你无关。好的，酷。你的背景是什么？土木工程。是的。好的。我在做结构工程。哦，这全是线性规划。那你是怎么……哦，对的。","start":3160.49,"end":3180.94},{"id":167,"text":"How do you design structures? I don't get it. I'm using genetic algorithms right now. Okay, okay, okay. Okay, that's fine. Okay, that's fine. That's right here. Good, thank you. Okay, good. Okay, great. That's fine. uality constraints. Everybody picturing this? So, by the way...","start":3273.96,"end":3290.22}],"notes":["本段介绍了凸优化的基本概念，并提到线性规划（LP）在现代技术中的广泛应用。讲者指出，虽然线性规划在某些情况下可以做得更好，但需要保持谦虚，因为其应用范围有限。同时，讲者提到线性规划的数学背景和其在结构工程中的应用，例如使用遗传算法进行结构设计。","讲者询问听众的背景，并提到线性规划是结构工程中的核心工具。他指出，线性规划的数学基础并不直观，且许多算法的原理难以解释，这可能与数学的复杂性有关。","讲者强调线性规划的简单性，即最小化一个线性函数，同时满足一系列线性不等式约束。他提到，这种问题在实际中非常常见，并且可以通过详细的分析来解决。","讲者指出，线性规划的求解可以在高维空间中进行，例如当变量数量达到百万级，约束数量达到千万级时，仍然可以高效求解。这表明线性规划在处理大规模问题时具有强大的能力。","讲者提到，即使在小规模问题中，例如有1000个变量和5000个约束的情况下，线性规划的求解仍然是可行的。这说明线性规划在实际应用中具有广泛的适用性。","讲者通过举例说明线性规划的求解过程，强调其在实际问题中的重要性，并指出其在结构工程中的应用，例如使用遗传算法进行结构设计。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3132.29,"end":3290.22,"asr_flags":[],"translation_complete":false,"translated_segments":5,"raw_segments":[{"start":3132.29,"text":"So it's easy to make, you know, you kind of want to make fun of it, but I wouldn't because it's running most of the technology we have right now. And pretty well, thank you, right? So could you do a little bit better with convex? You can, yeah. But let's be humble a little bit, okay? In some cases, right? So, okay. So that's least squares. Linear programming. This is super interesting."},{"start":3160.49,"text":"Yeah, I'm just curious. It depends on your background, but how many people have not seen linear programming, which is perfectly okay. It has nothing to do with you. Okay, cool. What's your background? Civil. Civil engineering. Yeah. Okay. I'm doing structural engineering. Oh, it's all LP. That's like, how do you... Oh, yeah."},{"start":3181.98,"text":"How do you design structures? I don't get it. I'm using genetic algorithms right now. Okay, okay, okay. Okay, that's fine. Okay, that's fine. That's right here. Good, thank you. Okay, good. Okay, great. That's fine. Okay, so..."},{"start":3200.06,"text":"All right, so linear programming. So I'm from a more mathematical background, and you didn't hear about it because there's no analytical formula for it. Even worse, most of the alg s used for supply chain. It's used for all sorts of other crazy stuff, like all the time. It's used for scheduling a lot of stuff."},{"start":3444.15,"text":"Now, it gets kind of interesting, right? Because you'd think to detect a linear program is kind of easy, but it turns out there's a whole bunch of problems that you can transform. If you know a few tricks, you will know them in a few weeks. If you know a few tricks, you can transform a problem that doesn't remotely sound like an LP into an LP."}],"speech_gaps":[],"frame":"../frames/v001/021.webp","frame_time":3302.4},{"title":"凸优化课程简介与凸函数定义","segments":[{"id":178,"text":"And by the way, and the way we think of that, that's actually kind of the way it works in this class, right? If we reduce your practical problem to a convex problem, we declare success. We just say, done. And then if the person comes back and says, yeah, but we need to do it for gigantic ones, then we can help out making it work. Or they say, no, we have to do it for hard real time. It has to be done in 20 milliseconds, blah, blah, blah. And you're like, OK, whatever. But the point is, bottom zeroth order, you reduce it to convex, it's done.","zh":"顺便说一下，我们思考这个问题的方式，实际上就是这门课中所采用的方式，对吧？如果我们能把你的实际问题简化为一个凸问题，我们就宣布成功。我们只是说，完成。然后如果有人回来并说，是的，但我们必须要处理非常大的问题，那么我们可以帮助你让其正常运行。或者他们说，不，我们必须处理实时性很强的问题。它必须在20毫秒内完成，等等。你会说，好吧，随便你。但重点是，从最根本的层面来说，如果你能将其简化为凸问题，那就完成了。","start":3464.92,"end":3490.78},{"id":179,"text":"And that actually kind of fits. I mean, I think that's more than just a joke. It's actually kind of real. That every time, historically, when someone put something, formulated something as a convex problem and what people wanted to scale it or make it unbelievably reliable or something, they were able to do it. So that's an example. Yeah, so we'll look at that. And then that gets us to what the class is about, which is convex optimization.","zh":"这实际上很贴切。我的意思是，我认为这不仅仅是一个笑话。这实际上是真实的。每次历史上，当有人将某个问题或某个公式表述为凸问题，并且想要将其扩展或使其变得极其可靠时，他们都能做到这一点。这是一个例子。是的，我们会看看这个例子。然后这就引出了这门课的内容，即凸优化。","start":3491.24,"end":3518.46},{"id":180,"text":"It's all about, this is what, I mean, kind of weird that the entire class is about this, but the, so it's actually very weird. It's a mild generalization of being, well, affine, right? And here I'll try to use the notation here. It basically says that f of, you know, alpha x plus beta y is less than or equal to alpha of x.","zh":"这门课的所有内容，就是这个，我的意思是，有点奇怪这门课全部都是关于这个的，但其实是非常奇怪的。它实际上是仿射的（affine）的一个轻微泛化，对吧？在这里，我会尝试使用这里的符号。它基本上表示，f（alpha x + beta y）小于等于 alpha f（x）加上 beta f（y）。","start":3520.22,"end":3546.1},{"id":181,"text":"f of x plus beta f of y. Now, there's some rules here. Alpha, beta have to be positive, and they have to sum to 1. OK? So roughly speaking, this means, and you know, obviously, we'll go over the whole, the rest of all this later. But you know, in one dimension, basically, it says that the curvature, it has to curve up. That's all it means. It has positive curvature, non-negative curvature. OK? So the entire class is about.","zh":"现在，这里有一些规则。alpha 和 beta 必须是正数，并且它们的和必须等于1。对吧？所以大致来说，这意味着，你知道的，我们之后会详细讲解所有这些内容。但你知道的，在一维情况下，这基本上意味着曲率必须向上弯曲。这就是它的意思。它具有正曲率，非负曲率。对吧？所以这门课的全部内容就是关于这些具有非负曲率的事物。","start":3546.78,"end":3575.5},{"id":182,"text":"with things that have non-negative curvature. That's the entire class. What's weird, it is weird when you first hear about this, is that there's some weird asymmetry. That is very weird, right? Because the classical thinking is, if everything is linear, oh, that's linear programming. In fact, in classical Western optimization, the way people think of it is, there's linear programming, and then are you ready for the other one? That's called?","zh":"这门课的全部内容就是关于这些具有非负曲率的事物。这很奇怪，当你第一次听到这个概念时，是的，有些奇怪的不对称性。这非常奇怪，对吧？因为传统的思维方式是，如果一切都是线性的，哦，那就是线性规划。事实上，在传统的西方优化理论中，人们思考的方式是，有线性规划，然后你准备好迎接另一个吗？那个叫做什么？","start":3576.81,"end":3604.13},{"id":183,"text":"non-linear programming, and you're supposed to go, ooh, wow, that's really complicated, and blah, blah, blah. Okay, everybody got it? So it turns out that view of the world is just stupid and wrong, okay? And the weird thing, what's really weird is it's this. It turns out curvature, right, which is non-linearity, turns out this is weird asymmetry, and non-negative curvature is just fine. But, you know, negative curvature, that does make it hard.","zh":"非线性规划，你可能会想，哦，哇，这真的很复杂， blah, blah, blah。好吧，大家明白了吗？结果发现这种看待世界的方式是愚蠢且错误的，对吧？奇怪的是，真正奇怪的是这个。实际上，曲率，也就是非线性，实际上表现出一种奇怪的不对称性，非负曲率是没问题的。但你知道吗，负曲率确实会让问题变得困难。","start":3605.3,"end":3632.91},{"id":184,"text":"So this is just not, this is not, I don't think this is obvious ahead of time, right? This is kind of an interesting part about it, right? So, okay. So that's a convex optimization problem where all the functions look like that.","zh":"这并不是，这并不是，我认为事先并不明显，对吧？这是它的一个有趣之处，对吧？所以，好吧。这就是一个凸优化问题，其中所有函数都看起来像这样。","start":3633.45,"end":3643.63}],"notes":["本段介绍了凸优化课程的核心概念，即凸函数的定义。凸函数的定义是：对于任意两个点x和y，以及正数α和β，满足α + β = 1时，f(αx + βy) ≤ αf(x) + βf(y)。这表明凸函数在任意两点之间的线段上，函数值不会低于连接这两点的直线段。这种性质使得凸函数在优化问题中具有良好的性质，如局部最优解即为全局最优解。","课程强调，凸优化问题的解决方法是将实际问题转化为凸问题，一旦成功，即视为完成。如果实际问题规模很大或有实时性要求，可以进一步优化算法以满足需求。这表明凸优化在实际应用中具有广泛的适用性。","凸函数的定义在几何上表现为非负曲率，即函数图像在任意两点之间的线段上不会向下弯曲。这种性质使得凸函数在优化问题中具有良好的性质，如局部最优解即为全局最优解。","课程指出，传统的优化分类方法将问题分为线性规划和非线性规划，这种分类方式被认为是错误的。实际上，凸优化问题的非线性部分（即非负曲率）并不复杂，而负曲率才是优化的难点。","凸优化问题的定义和性质在课程中被强调为关键内容，因为它们构成了整个课程的基础。凸函数的性质使得优化问题具有良好的解的结构，如局部最优解即为全局最优解。","课程通过对比传统分类方法，指出凸优化问题的非线性部分（即非负曲率）并不复杂，而负曲率才是优化的难点。这表明凸优化问题在实际应用中具有重要的意义。"],"formulas":[],"uncertainties":["f of alpha x plus beta y is less than or equal to alpha of x"],"diagram":"none","start":3464.92,"end":3643.63,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3464.92,"text":"And by the way, and the way we think of that, that's actually kind of the way it works in this class, right? If we reduce your practical problem to a convex problem, we declare success. We just say, done. And then if the person comes back and says, yeah, but we need to do it for gigantic ones, then we can help out making it work. Or they say, no, we have to do it for hard real time. It has to be done in 20 milliseconds, blah, blah, blah. And you're like, OK, whatever. But the point is, bottom zeroth order, you reduce it to convex, it's done."},{"start":3491.24,"text":"And that actually kind of fits. I mean, I think that's more than just a joke. It's actually kind of real. That every time, historically, when someone put something, formulated something as a convex problem and what people wanted to scale it or make it unbelievably reliable or something, they were able to do it. So that's an example. Yeah, so we'll look at that. And then that gets us to what the class is about, which is convex optimization."},{"start":3520.22,"text":"It's all about, this is what, I mean, kind of weird that the entire class is about this, but the, so it's actually very weird. It's a mild generalization of being, well, affine, right? And here I'll try to use the notation here. It basically says that f of, you know, alpha x plus beta y is less than or equal to alpha of x."},{"start":3546.78,"text":"f of x plus beta f of y. Now, there's some rules here. Alpha, beta have to be positive, and they have to sum to 1. OK? So roughly speaking, this means, and you know, obviously, we'll go over the whole, the rest of all this later. But you know, in one dimension, basically, it says that the curvature, it has to curve up. That's all it means. It has positive curvature, non-negative curvature. OK? So the entire class is about."},{"start":3576.81,"text":"with things that have non-negative curvature. That's the entire class. What's weird, it is weird when you first hear about this, is that there's some weird asymmetry. That is very weird, right? Because the classical thinking is, if everything is linear, oh, that's linear programming. In fact, in classical Western optimization, the way people think of it is, there's linear programming, and then are you ready for the other one? That's called?"},{"start":3605.3,"text":"non-linear programming, and you're supposed to go, ooh, wow, that's really complicated, and blah, blah, blah. Okay, everybody got it? So it turns out that view of the world is just stupid and wrong, okay? And the weird thing, what's really weird is it's this. It turns out curvature, right, which is non-linearity, turns out this is weird asymmetry, and non-negative curvature is just fine. But, you know, negative curvature, that does make it hard."},{"start":3633.45,"text":"So this is just not, this is not, I don't think this is obvious ahead of time, right? This is kind of an interesting part about it, right? So, okay. So that's a convex optimization problem where all the functions look like that."}],"speech_gaps":[],"frame":"../frames/v001/022.webp","frame_time":3476.92},{"title":"凸优化的概述与技术应用","segments":[{"id":185,"text":"And, you know, it's like linear programming. You know, there's analytical solutions for about 17 of these. And really, who cares about those anyway, right? So, you know, least squares and, you know, I could name a couple of other famous ones. You know, you encounter one in your information theory or communications class. You know, in statistics you get, you see a couple. But, I mean, it's whatever. It's fine.","zh":"而且，你知道的，这就像线性规划。你知道的，大约有17种这类问题有解析解。说实话，谁还关心这些呢，对吧？所以，你知道的，最小二乘法，你知道的，我还能列举几个著名的例子。你知道的，在信息论或通信课上你会遇到其中一个。你知道的，在统计学中你会看到几个。但，我说句实话，这无所谓。没关系。","start":3645.19,"end":3665.41},{"id":186,"text":"They're reliable and efficient algorithms, and it's kind of almost a technology. It's not quite. Oh, that reminds me to say something about, well, I'll say it again when we get to it later. Later in the class, within three weeks, you'll actually be solving problems. It will mostly work, the software, like 99.5% of the time, something like that.","zh":"它们是可靠且高效的算法，几乎可以算是一种技术。但还不完全如此。哦，这让我想起要提一下，好吧，等我们后面讲到的时候我会再说。在接下来的课程中，大约三周后，你实际上会开始解决问题。软件大部分时候会正常工作，大概99.5%的时间，类似这样的情况。","start":3667.71,"end":3694.08},{"id":187,"text":"It will fail sometimes. But actually, you don't know it. But by agreeing to be in this class, again, if you scroll down that thing that you agreed, which you can't find anymore because we actually didn't do that. But anyway, if you look in there, it basically says that while you're in the class at least, you agree to do the following. If it doesn't work, you may only discuss that when people in the class are present.","zh":"它有时会失败。但事实上，你并不知道它失败了。但通过同意参加这门课，再次，如果你向下滚动你同意的那个条款，你已经找不到它了，因为我们实际上并没有这么做。但不管怎样，如果你查看那个条款，它基本上说明，在你参加这门课期间，你同意做到以下几点。如果它不起作用，你只能在课堂上的人在场时讨论这个问题。","start":3694.58,"end":3718.44},{"id":188,"text":"If a roommate says, what are you doing? And let's say you're swearing at the laptop because it's not working. They say, oh, I'm doing convex optimization. And they say, is it not working? You are obligated to say, it's convex optimization. Of course, it works perfectly. You say, hello, excuse me, that's the point of the field.","zh":"如果室友问你在做什么，比如说你对着笔记本电脑发誓诅咒因为它没用，他们说：你在做凸优化吗？他们问：它没用吗？你有义务说：我在做凸优化。当然，它完美地起作用了。你说：你好，打扰一下，这就是这个领域的要点。","start":3719.35,"end":3736.13},{"id":189,"text":"Of course it works. And they go, then why are you swearing at your laptop? And you go, oh, it's not doing what I thought it would or something like that. So anyway, I'm just saying that's the way it's going to work. But it should be a technology. And actually, it can easily be made a technology. So it's embedded in all sorts of stuff that you wouldn't, that it's in UAVs. It's in lots and lots of stuff.","zh":"当然它起作用了。他们问：那为什么你对着笔记本电脑发誓诅咒？你说：哦，它没有按照我预期的那样工作，或者类似的情况。总之，我只是说事情会是这样。但它应该是一种技术。实际上，它很容易被做成一种技术。因此，它被嵌入到各种你不会想到的东西中，比如无人机（UAVs），还有大量的其他东西中。","start":3738.01,"end":3766.63},{"id":190,"text":"And there is no human intervention. It's running at things like 100 hertz or something like that. So things work that way. Okay. Now here's where it gets interesting. So the question then comes down to, okay, cool. How do I know if my problem is convex? That's a great question. It turns out that's actually not easy to do.","zh":"而且没有任何人为干预。它以每秒100次或类似的速度运行。事情就是这样运作的。好的。现在这里变得有趣了。那么问题就变成了，好吧，很酷。我怎么知道我的问题是不是凸的？这是个好问题。事实上，这并不容易做到。","start":3767.76,"end":3792.21},{"id":191,"text":"That's actually interesting, right? That it's not, you know, like, how do I know if my problem's a linear program? That's actually quite straightforward, right? How do I know if it's, and you'll see, there'll be, you know, so that's why we're going to spend the next three weeks, you know, going into some horrible math. But the whole point is that you learn to recognize convex functions, right? And that sort of stuff. That's going to be the key.","zh":"这其实很有趣，对吧？因为并不是像如何判断我的问题是不是线性规划问题那样简单。事实上，这相当直接，对吧？如何判断它是不是，你将会看到，会有，你知道的，这就是为什么我们要花接下来的三周时间，你知道的，深入一些可怕的数学。但整个重点是让你学会识别凸函数，对吧？以及这类东西。这将是关键。","start":3793.57,"end":3817.63}],"notes":["本段主要介绍了凸优化的基本概念，将其与线性规划进行类比，指出凸优化问题在实际应用中非常广泛，但其分析解的数量有限，且在实际应用中可能遇到失败的情况。同时，强调了凸优化作为一种技术的可靠性与高效性，以及其在各种系统中的嵌入应用。","讲者提到，虽然凸优化在实际中非常可靠，但其失败的情况也存在，且用户在使用过程中需要遵守一定的规则，例如在讨论问题时必须在课堂内进行，以避免误解。这反映了凸优化作为一种技术的规范性和严谨性。","讲者通过一个日常场景的例子，说明了凸优化在实际应用中的重要性，即即使在出现问题时，也应坚持其正确性，这体现了凸优化作为一门学科的核心价值。","讲者指出，判断一个问题是凸问题并不容易，这与判断是否为线性规划问题形成对比，强调了凸优化的复杂性，并预告了接下来课程将深入探讨数学理论，以帮助学生掌握识别凸函数的方法。","课程将重点放在数学理论的深入讲解上，以帮助学生理解如何识别凸函数，这是学习凸优化的关键部分。","讲者通过幽默的方式强调了凸优化的可靠性，同时指出其在实际应用中的重要性，如无人机等系统中，凸优化技术的广泛应用展示了其在现实世界中的价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3645.19,"end":3817.63,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3645.19,"text":"And, you know, it's like linear programming. You know, there's analytical solutions for about 17 of these. And really, who cares about those anyway, right? So, you know, least squares and, you know, I could name a couple of other famous ones. You know, you encounter one in your information theory or communications class. You know, in statistics you get, you see a couple. But, I mean, it's whatever. It's fine."},{"start":3667.71,"text":"They're reliable and efficient algorithms, and it's kind of almost a technology. It's not quite. Oh, that reminds me to say something about, well, I'll say it again when we get to it later. Later in the class, within three weeks, you'll actually be solving problems. It will mostly work, the software, like 99.5% of the time, something like that."},{"start":3694.58,"text":"It will fail sometimes. But actually, you don't know it. But by agreeing to be in this class, again, if you scroll down that thing that you agreed, which you can't find anymore because we actually didn't do that. But anyway, if you look in there, it basically says that while you're in the class at least, you agree to do the following. If it doesn't work, you may only discuss that when people in the class are present."},{"start":3719.35,"text":"If a roommate says, what are you doing? And let's say you're swearing at the laptop because it's not working. They say, oh, I'm doing convex optimization. And they say, is it not working? You are obligated to say, it's convex optimization. Of course, it works perfectly. You say, hello, excuse me, that's the point of the field."},{"start":3738.01,"text":"Of course it works. And they go, then why are you swearing at your laptop? And you go, oh, it's not doing what I thought it would or something like that. So anyway, I'm just saying that's the way it's going to work. But it should be a technology. And actually, it can easily be made a technology. So it's embedded in all sorts of stuff that you wouldn't, that it's in UAVs. It's in lots and lots of stuff."},{"start":3767.76,"text":"And there is no human intervention. It's running at things like 100 hertz or something like that. So things work that way. Okay. Now here's where it gets interesting. So the question then comes down to, okay, cool. How do I know if my problem is convex? That's a great question. It turns out that's actually not easy to do."},{"start":3793.57,"text":"That's actually interesting, right? That it's not, you know, like, how do I know if my problem's a linear program? That's actually quite straightforward, right? How do I know if it's, and you'll see, there'll be, you know, so that's why we're going to spend the next three weeks, you know, going into some horrible math. But the whole point is that you learn to recognize convex functions, right? And that sort of stuff. That's going to be the key."}],"speech_gaps":[],"frame":"../frames/v001/023.webp","frame_time":3657.19},{"title":"照明问题与凸优化","segments":[{"id":192,"text":"And it turns out, you know, turns out a lot of problems can be solved using this, right? Okay. So let's look at a quick example, just for fun here. You know, like, quasi-practical, actually. It does come from something real. So here's the problem. So I have a bunch of lamps here that, you know, spray out illumination. And there's some surface that I want to illuminate here, right?","zh":"事实上，你会发现，很多问题都可以用这种方法来解决，对吧？好的。那么让我们看一个快速的例子，只是为了好玩。你知道的，实际上这是一个接近实用的问题。它确实来源于现实中的某个问题。那么这里的问题是，我这里有一堆灯，它们会发出照明。并且有一个表面，我希望对其进行照明，对吧？","start":3819.61,"end":3848.0},{"id":193,"text":"And I'm going to assume that the light is incoherent or whatever. So the powers are going to add, right? They're going to add linearly. And it turns out that the intensity, here's a patch. And the intensity here is simply, it's linear in the lamp powers, right? And so AKJ gives you the number, tells you it's the coefficient of the amount of illumination you get on patch K.","zh":"我将假设光线是不相干的，或者随便什么情况。因此，光的功率会相加，对吧？它们会以线性方式相加。事实上，这里的强度，这里有一个贴片。这里的强度仅仅是灯的功率的线性函数，对吧？因此，AKJ会给出一个数值，告诉你在贴片K上获得的照明量的系数。","start":3848.47,"end":3877.07},{"id":194,"text":"for, let's say, one watt put into lamp J, okay? So, and you know, look, here's a baby formula, inverse square thing, you know, because it's propagating in 3D. And the cosine, this is like the cosine shading angle. It doesn't matter. And if your patch is here and the light is here, you don't have a direct thing. So it's zero, right? So that's, okay, so that's what it is.","zh":"比如说，将一瓦特的功率输入到灯J中，对吧？所以，你看，这里有一个简单的公式，就是反平方定律，你知道的，因为光线是在三维空间中传播的。还有余弦项，这类似于余弦遮蔽角。这并不重要。如果你的贴片在这里，而光源在那里，你没有直接的照射，所以它就是零，对吧？所以这就是它的意思。","start":3877.87,"end":3904.83},{"id":195,"text":"To choose these lamp powers, I mean, they've obviously got to be non-negative. This problem would be a lot easier if you had lamps that could spew negative light. That would be a huge innovation. Yeah, so spray darkness, I guess, right? So, okay. And they have some maximum value. And what you want is, you know, someone has said I want uniform illumination at this level called I desired. I care about proportional, so I'm going to take logs.","zh":"为了选择这些灯的功率，我的意思是，它们显然必须是非负的。如果你们有可以喷出负光的灯，这个问题会容易得多。那将是一个巨大的创新。是的，所以喷洒黑暗，对吧？好的。并且它们有一个最大值。而你想要的是，你知道的，有人说过我希望在这个称为I desired的水平上获得均匀的照明。我关心的是比例，所以我将取对数。","start":3905.27,"end":3934.59},{"id":196,"text":"And I'd say minimize the maximum fractional error across this, right? So that's the problem, right? So this is like a typical real problem that actually came from something real. It's fine. That's it. That's the problem. The question is, how do you do this, right? And this wouldn't be a problem. I mean, engineers are actually pretty good. The first thing someone would do, I would hope, would be to do things like this. First of all, they have a simulator.","zh":"我会说最小化这个最大分数误差，对吧？这就是问题，对吧？所以这是一个典型的现实问题，确实来源于现实中的某个问题。没关系。这就是问题。问题是，你如何做到这一点，对吧？这不会是一个问题。我的意思是，工程师实际上相当擅长。某人首先会做的事情，我希望是做这样的事情。首先，他们有一个模拟器。","start":3935.26,"end":3963.58},{"id":197,"text":"And the first thing they would do is they'd fire up the simulator, and you should just put in uniform power and then turn it up and down and see how well you do, right? Then they'd say, oh, you know, I know least squares, so I'm going to do least squares, right? Because this is kind of least squares. There's a matrix there that maps the powers to the illuminations, so I'm going to do least squares, right? Now, what's going to happen when you do...","zh":"然后他们首先会做的是启动模拟器，你只需要输入均匀的功率，然后调高调低，看看你表现如何，对吧？接着他们会说，哦，我知道最小二乘法，所以我将使用最小二乘法，对吧？因为这有点像最小二乘法。那里有一个矩阵，将功率映射到照明上，所以我将使用最小二乘法，对吧？那么当你这样做时，会发生什么呢？","start":3964.25,"end":3991.0}],"notes":["本段介绍了照明问题的建模过程，其中灯的功率与表面的照度之间存在线性关系。讲者提到，每个灯的功率对每个表面区域的照度贡献是线性的，且系数AKJ表示该贡献。此外，讲者还提到，照度的计算涉及反平方定律和余弦因子，这些因素会影响最终的照度值。","讲者指出，灯的功率必须是非负的，这是问题的一个约束条件。如果允许负的灯功率（即喷洒黑暗），问题会变得更容易。但现实中，灯的功率不能为负，因此这是一个重要的限制。","讲者提到，目标是实现均匀的照度，且希望照度达到某个目标值。为了处理比例关系，讲者建议使用对数变换。此外，讲者提出一个优化问题，即最小化最大相对误差，这可能是一个凸优化问题。","讲者讨论了工程师通常会采取的解决方法，包括使用模拟器进行实验，尝试均匀功率分配，并通过最小二乘法来求解。然而，讲者暗示这些方法可能并不总是最优的，特别是当问题具有凸性时，可能需要更精确的优化方法。","讲者提到，问题中的矩阵将灯的功率映射到照度上，这暗示了线性关系的存在。最小二乘法的使用表明，问题可能被建模为一个线性系统，但讲者并未明确指出是否为凸优化问题。","讲者强调了实际问题的复杂性，包括非负约束、反平方定律和余弦因子的影响，这些因素可能使问题变得非凸。因此，讲者可能在暗示，虽然问题看起来像一个线性问题，但实际可能需要凸优化方法来求解。"],"formulas":[],"uncertainties":["反平方定律和余弦因子的具体数学表达式未明确给出，可能需要进一步澄清。","最小化最大相对误差的具体数学形式未明确，可能需要进一步澄清。","讲者提到的矩阵映射关系未明确给出，可能需要进一步澄清。"],"diagram":"none","start":3819.61,"end":3991.0,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的数学信息来核定公式，因此无法确认其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3819.61,"text":"And it turns out, you know, turns out a lot of problems can be solved using this, right? Okay. So let's look at a quick example, just for fun here. You know, like, quasi-practical, actually. It does come from something real. So here's the problem. So I have a bunch of lamps here that, you know, spray out illumination. And there's some surface that I want to illuminate here, right?"},{"start":3848.47,"text":"And I'm going to assume that the light is incoherent or whatever. So the powers are going to add, right? They're going to add linearly. And it turns out that the intensity, here's a patch. And the intensity here is simply, it's linear in the lamp powers, right? And so AKJ gives you the number, tells you it's the coefficient of the amount of illumination you get on patch K."},{"start":3877.87,"text":"for, let's say, one watt put into lamp J, okay? So, and you know, look, he you're just this is I'm just this is street fighting. This is someone who just has to do this right. They're like, you know, I just need to find these illuminations. You know, if it's negative, you just set that lamp to zero or something. And if it's above your if it's above the maximum power, you clip it at the maximum power. Right. And you know, so something like this would it would do something I don't know what it wouldn't probably not terrible right.","zh":"最小二乘法中的一些幂可能会出现负值。我是说，这不是很明显吗。然后你知道的，这就是我所说的街头斗殴。这就是那些必须正确完成这件事的人。他们就像，你知道的，我只需要找到这些启示。你知道的，如果它是负值，你只需将那个灯设为零或者类似的东西。如果它超过了最大功率，你就将其裁剪到最大功率。对吧。你知道，这样做的结果会是，我不知道它会做什么，但可能不会太糟糕。","start":3991.29,"end":4017.39},{"id":199,"text":"And then you'd say, well, no, I know what I'm going to do. I'm going to do weighted least squares. And the way I'm going to do it is I'm going to have this least squares objective here, but that's another least squares objective. And what it does, if you think about it, is there's the interval each of those powers has to be in, which is between zero and P max. And what this is, is it pulls you towards the center of that interval. So if you're too low, like your negative power, it pulls you towards zero.","zh":"然后你会说，不，我知道我要怎么做。我要做加权最小二乘法。我要做的方式是，这里有一个最小二乘目标函数，但这是另一个最小二乘目标函数。如果你仔细想想，它所做的就是，每个功率必须处于一个区间内，即在零和最大功率之间。而这就是它所做的，它会将你拉向这个区间的中心。如果你太低，比如负的功率，它会将你拉向零。","start":4017.91,"end":4043.17},{"id":200,"text":"If you're positive, if you're above the maximum, it pulls you down towards the maximum. Everybody got that? And so you might solve this problem. And then here would be a completely reasonable way to do this. If p is below negative, you know, increase, you know, you say wj times equals 2. Okay? I'll just make it, this is what people would do. This is the kind of thing somebody would do. If it's above the maximum, w times equals 2.","zh":"如果你是正的，如果你超过了最大值，它会将你向下拉向最大值。大家明白了吗？所以你可能会解决这个问题。然后这里会有一种完全合理的方式来处理这个问题。如果p低于负值，你知道的，增加，你知道的，你说wj乘以等于2。好的？我会直接这样做，这就是人们会做的事情。这就是某人会做的事情。如果它超过了最大值，w乘以等于2。好的？","start":4043.85,"end":4072.99},{"id":201,"text":"Okay? If you're in the band, W divided by equals 2. Everybody understand what I'm saying? Okay, so you just do that. Okay? And, you know, something is going to happen. It's not going to be too bad. And, you know, that's how a lot of stuff actually works this way. Right? As I told you, you could actually have a perfectly good life doing a lot of mathematical stuff if the only thing you actually really knew well was least squares, plus you knew some street fighting tricks. Right? So you'd be just fine. Okay.","zh":"好的？如果你处于这个区间内，W除以等于2。大家明白我在说什么吗？好的，你只需要这样做。好的？你知道，会发生一些事情。它不会太糟糕。你知道，这就是很多东西实际上的工作方式。对吧？正如我告诉你的，如果你唯一真正擅长的是最小二乘法，再加上你知道一些街头斗殴技巧，你实际上可以过上非常好的生活。对吧？所以你会很不错的。好的。","start":4073.37,"end":4099.13},{"id":202,"text":"Somebody could say, maybe they came from management science or OR, and they go, hey, that looks just like an LP, or something I can solve with LP, except for the log, right? And so they might do something like this, and you'd do pretty well. And these are just approximate solutions, but probably not too bad. Everybody following this? I mention this because this is kind of how a lot of stuff actually works. People are good. They'll do what they need, and clever. Okay.","zh":"有人可能会说，也许他们来自运筹学或管理科学领域，然后他们会说，嘿，这看起来就像是一个线性规划问题，或者我可以使用线性规划来解决的问题，只是多了一个对数项，对吧？因此他们可能会这样做，而你也会做得很好。这些只是近似解，但可能并不太差。大家都能跟上吗？我之所以提到这一点，是因为实际上很多东西就是这样运作的。人们很聪明，他们会做他们需要做的事情，并且很巧妙。好的。","start":4100.4,"end":4128.54},{"id":203,"text":"So it turns out the whole thing is just convex, period. The whole thing. So, I mean, you exponentiate the objective and it's just convex. And it's not obvious. And people probably don't know that. So this is the function that is the fractional error. And let me explain that.","zh":"事实上，整个问题本身就是凸的，完完全全的凸。整个问题。我的意思是，你对目标函数进行指数运算，它仍然是凸的。而且这并不明显，人们可能并不知道这一点。因此，这就是所谓的分数误差函数。让我来解释一下。","start":4129.61,"end":4146.79}],"notes":["本段讲解了最小二乘法在处理约束条件时的处理方式，特别是当计算结果超出允许范围时的处理策略。讲者提到，当计算出的功率为负数时，可以将其设为零；当超过最大功率时，可以将其截断为最大功率。这种处理方式被称为‘street fighting’，即在实际应用中灵活处理问题。","讲者进一步解释了加权最小二乘法的使用，指出其目标是将结果拉向允许的区间中心。如果结果低于下限，会向零拉；如果高于上限，会向最大值拉。这种处理方式是通过在目标函数中引入权重来实现的。","讲者提到，当结果在允许范围内时，可以使用简单的权重（如2）来处理。这种处理方式是实际应用中常见的做法，体现了在实际问题中灵活运用数学工具的技巧。","讲者强调，即使在没有严格数学理论支持的情况下，通过经验性方法（如加权最小二乘法）也能得到合理的近似解。这种做法在实际工程和优化问题中非常常见。","讲者指出，整个问题本质上是凸的，因此可以使用凸优化方法求解。尽管这一点可能不直观，但通过指数化目标函数可以验证其凸性。","最后，讲者提到，这种处理方式涉及一个称为‘fractional error’的函数，该函数用于衡量误差的相对大小，并指出需要进一步解释该函数的定义和性质。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3991.29,"end":4146.79,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3991.29,"text":"least squares is some of the powers are going to come out negative i mean duh right and then you know you're just this is i'm just this is street fighting this is someone who just has to do this right they're like you know i just need to find these illuminations you know if it's negative you just set that lamp to zero or something and if it's above your if it's above the maximum power you clip it at the maximum power right and you know so something like this would it would do something i don't know what it wouldn't probably not terrible right"},{"start":4017.91,"text":"And then you'd say, well, no, I know what I'm going to do. I'm going to do weighted least squares. And the way I'm going to do it is I'm going to have this least squares objective here, but that's another least squares objective. And what it does, if you think about it, is there's the interval each of those powers has to be in, which is between zero and P max. And what this is, is it pulls you towards the center of that interval. So if you're too low, like your negative power, it pulls you towards zero."},{"start":4043.85,"text":"If you're positive, if you're above the maximum, it pulls you down towards the maximum. Everybody got that? And so you might solve this problem. And then here would be a completely reasonable way to do this. If p is below negative, you know, increase, you know, you say wj times equals 2. Okay? I'll just make it, this is what people would do. This is the kind of thing somebody would do. If it's above the maximum, w times equals 2."},{"start":4073.37,"text":"Okay? If you're in the band, W divided by equals 2. Everybody understand what I'm saying? Okay, so you just do that. Okay? And, you know, something is going to happen. It's not going to be too bad. And, you know, that's how a lot of stuff actually works this way. Right? As I told you, you could actually have a perfectly good life doing a lot of mathematical stuff if the only thing you actually really knew well was least squares, plus you knew some street fighting tricks. Right? So you'd be just fine. Okay."},{"start":4100.4,"text":"Somebody could say, maybe they came from management science or OR, and they go, hey, that looks just like an LP, or something I can solve with LP, except for the log, right? And so they might do something like this, and you'd do pretty well. And these are just approximate solutions, but probably not too bad. Everybody following this? I mention this because this is kind of how a lot of stuff actually works. People are good. They'll do what they need, and clever. Okay."},{"start":4129.61,"text":"So it turns out the whole thing is just convex, period. The whole thing. So, I mean, you exponentiate the objective and it's just convex. And it's not obvious. And people probably don't know that. So this is the function that is the fractional error. And let me explain that."}],"speech_gaps":[],"frame":"../frames/v001/025.webp","frame_time":4003.29},{"title":"凸优化中的凸函数与约束问题","segments":[{"id":204,"text":"right? So u is the ratio of one thing to positive things, right? If it's one, they're equal, and that's the minimum. If you could subtract one if you want here and make this zero, right? But if you increase it above that, then your fractional error grows linearly. If you decrease it, it's like one over u, right? So this is, I think you can call this, what, 100% error or something? And if I were down here, the 50% error points would be one half and, I don't know, 1.5? No.","start":4147.31,"end":4176.13},{"id":205,"text":"Somehow that didn't come out right. Okay, scrap that, right? But anyway, you get the idea. But the main thing here and the only thing you should be able to do now is take your eyeball and say, that curves upward, that's convex. Okay, so make sense? So that's the idea. So you get the exact solution and I mean, it's just, you know, not a problem. And now for fun, I'll add some constraints to it.","start":4176.59,"end":4206.11},{"id":206,"text":"And we'll check what happens. So two proposed constraints, right? The first is that no more than half the total power is in any 10 lamps. I could probably make up some kind of practical reason why you might impose a constraint like that. But usually constraints like that are just made up by people who have no idea what they're doing. And so they just made it up, right? So the second is this. No more than half the lamps are on.","start":4206.51,"end":4233.82},{"id":207,"text":"By the way, that gets us to something very interesting, which is actually, suppose you were designing a building or a lab experiment or who knows, a piece of equipment, and you wanted to choose where to put the lights. So you could very reasonably do something like solve this problem with a million potential light locations, but you'd like to solve it with 990.","start":4235.48,"end":4258.98},{"id":208,"text":"And what you're hoping, then you'd say, it's got to support my loads. It's got to have my, it has to satisfy these dynamic, you know, blah, blah, blah. And what you're hoping, you have no intention of building a bridge with 100 million bars, right? And, you know, then if you're lucky, it comes out and the solution is sparse. And congratulations, you just designed the topology of the truss. I don't know if that made sense, but that was, okay, fine.","start":4260.06,"end":4281.51},{"id":209,"text":"And what you're hoping, then you'd say, it's got to support my loads. It's got to have my, it has to satisfy these dynamic, you know, blah, blah, blah. And what you're hoping, you have no intention of building a bridge with 100 million bars, right? And, you know, then if you're lucky, it comes out and the solution is sparse. And congratulations, you just designed the topology of the truss. I don't know if that made sense, but that was, okay, fine.","start":4281.98,"end":4307.2}],"notes":["本段主要讲解了凸函数的直观判断方法，即通过观察函数图像是否向上弯曲来判断其凸性。讲者通过一个具体的例子说明了当变量u变化时，误差如何随着u的变化而变化，强调了凸函数的性质：当u增加时，误差线性增长，而当u减少时，误差则呈倒数关系。讲者还提到，当u等于1时，误差为零，这是最小值点。","讲者随后引入了约束条件的概念，说明在优化问题中，约束条件可以是实际问题中的物理限制，例如限制任何10个灯泡的总功率不超过总功率的一半，或者限制灯泡数量的一半不能开启。这些约束条件通常由设计者根据实际需求设定，但有时也可能只是随意设定。","讲者进一步讨论了在实际工程设计中，如何通过优化问题来选择灯泡的位置。他提到，可以将问题规模从百万个潜在位置缩小到990个，甚至99%的位置为零，从而减少计算复杂度。这种做法在结构设计中很常见，例如在设计桁架结构时，通过优化变量（如截面面积）来实现结构的最优配置。","讲者还提到，设计者通常不会实际建造包含大量构件的结构，而是希望优化后的解是稀疏的，即大部分变量为零，从而实现结构的最优拓扑设计。这种稀疏性在实际工程中具有重要意义，因为它可以显著减少材料使用和成本。","讲者通过一个具体的例子说明了如何通过优化问题来设计结构，强调了凸优化在实际工程中的应用价值。他指出，虽然优化问题可能看起来复杂，但通过合理设定约束条件和目标函数，可以有效地找到最优解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4147.31,"end":4307.2,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4147.31,"text":"right? So u is the ratio of one thing to positive things, right? If it's one, they're equal, and that's the minimum. If you could subtract one if you want here and make this zero, right? But if you increase it above that, then your fractional error grows linearly. If you decrease it, it's like one over u, right? So this is, I think you can call this, what, 100% error or something? And if I were down here, the 50% error points would be one half and, I don't know, 1.5? No."},{"start":4176.59,"text":"Somehow that didn't come out right. Okay, scrap that, right? But anyway, you get the idea. But the main thing here and the only thing you should be able to do now is take your eyeball and say, that curves upward, that's convex. Okay, so make sense? So that's the idea. So you get the exact solution and I mean, it's just, you know, not a problem. And now for fun, I'll add some constraints to it."},{"start":4206.51,"text":"And we'll check what happens. So two proposed constraints, right? The first is that no more than half the total power is in any 10 lamps. I could probably make up some kind of practical reason why you might impose a constraint like that. But usually constraints like that are just made up by people who have no idea what they're doing. And so they just made it up, right? So the second is this. No more than half the lamps are on."},{"start":4235.48,"text":"By the way, that gets us to something very interesting, which is actually, suppose you were designing a building or a lab experiment or who knows, a piece of equipment, and you wanted to choose where to put the lights. So you could very reasonably do something like solve this problem with a million potential light locations, but you'd like to solve it with 990."},{"start":4260.06,"text":"of the, or whatever, you know, with 99% of them, zero, right? Because if a lamp is zero, it means you didn't need it, okay? In fact, people design structures that way. You take a big old structure, you put in way too many bars or a space frame, you put way too many bars in you're going to need, and your variables are the cross-sectional areas, okay?"},{"start":4281.98,"text":"And what you're hoping, then you'd say, it's got to support my loads. It's got to have my, it has to satisfy these dynamic, you know, blah, blah, blah. And what you're hoping, you have no intention of building a bridge with 100 million bars, right? And, you know, then if you're lucky, it comes out and the solution is sparse. And congratulations, you just designed the topology of the truss. I don't know if that made sense, but that was, okay, fine."}],"speech_gaps":[],"frame":"../frames/v001/026.webp","frame_time":4159.31},{"title":"凸优化的直观理解与问题复杂性","segments":[{"id":210,"text":"What? Architects love you, too. Yeah. You know, using material. Yeah, no, no, exactly. So, okay. All right. So, I'll just, you know, I mean, here, it's here. So, it turns out these two look very similar, don't they? And they both look kind of weird and combinatorial, right? Like, you would, I mean, later in the class, you might say, I don't know, they both look kind of hard, right? So, it turns out this one is convex.","zh":"什么？建筑师也喜欢你。是的。你知道，使用材料。是的，不，不，正是如此。所以，好吧。好的。所以，我只需要，你知道，我的意思是，这里，它就在这里。结果发现这两个看起来非常相似，对吧？它们看起来都相当奇怪和组合性，对吧？比如，后来在课堂上，你可能会说，我不知道，它们看起来都相当难，对吧？结果发现这个是凸的。","start":4308.63,"end":4336.35},{"id":211,"text":"It's very weird, but it is. And the second one is not. I could repeat this. I could transcribe this to any field you like. It would be, construct me a portfolio of 10,000 assets, world market or whatever, but I don't want to hold more than 100 names. That's an example of that. That's actually hard.","zh":"这很奇怪，但确实是这样。第二个则不是。我可以重复这个例子，我可以将这个例子转录到你感兴趣的任何领域。比如，构建一个包含10,000种资产的投资组合，无论是世界市场还是其他，但我不想持有超过100个名称。这就是这个例子。实际上，这很难。","start":4338.04,"end":4361.76},{"id":212,"text":"But I could say, I could put a concentration, I could say things like this. I don't want more than 5% of my portfolio to live in any collection of 100 names. Everybody follow that? Someone says, why would you do that? And you go, that's an anti-concentration, you know, blah, blah, blah, inequality, constraint. Anyway, that one's convex. It's just convex, right? So, okay. This is weird, but it actually tells you a very important point. It's actually why you're here, and it's why the class is not like two lectures.","zh":"但我可以说，我可以设定一个集中度，我可以这样说。我不想让我的投资组合中任何100个名称的组合超过5%。大家明白这个意思吗？有人会问，为什么你要这样做？然后你会回答，这是反集中度，你知道的，啰啰嗦嗦的不等式约束。不管怎样，这个是凸的。它只是凸的，对吧？所以，好吧。这很奇怪，但它实际上告诉你一个非常重要的点。它实际上就是你在这里的原因，也是这门课不像两节课的原因。","start":4362.42,"end":4389.64},{"id":213,"text":"So I like to think of it this way. In fact, that's part of what the class is about. We are going to break your idea about what's easy and what's hard for an optimization problem. Because unless you know the things you're going to know in this class, you are wrong.","zh":"我喜欢这样思考。事实上，这正是这门课的一部分内容。我们将打破你对优化问题中什么是容易、什么是困难的想法。除非你知道这门课中你要知道的内容，否则你就是错的。","start":4391.81,"end":4408.88},{"id":214,"text":"And it is not obvious. That's, I think, it's kind of interesting, right? Like if I show you a linear program and I tell you, oh my God, you know, it's got this dimensions. There's more vertices than the number of subatomic particles in the universe. And you're like, whoa, whoa, boy, oh, you know. And then I'd say, yeah, I can solve that in 50 milliseconds on my phone, okay? So it's just, I'm just saying these things are not obvious. They're weird. So, or another way that I would usually say something like this, that this is,","zh":"这并不明显。我认为，这有点有趣，对吧？比如，如果我给你展示一个线性规划问题，并告诉你，哦我的天，你知道，它有这个维度。它的顶点数量比宇宙中的基本粒子数量还要多。你会说，哇，哇，男孩，哦，你知道。然后我会说，是的，我可以在手机上用50毫秒解决这个问题。所以，我只是在说这些事情并不明显。它们很奇怪。或者另一种说法，我通常会这样表达，那就是这个是","start":4409.43,"end":4438.29},{"id":215,"text":"I guess problem complexity is not continuous in the intuition norm. That's the way to say it, right? So it means two things can look intuitively to be very similar. You're like, yeah, whatever. They look about the same. But one can be really hard and one is really easy, right? So that's the idea. Okay.","zh":"我想问题的复杂度在直观范数下并不是连续的。这就是这么说的意思，对吧？这意味着两个问题在直观上看起来可能非常相似。你可能会想，嗯，不管怎样，它们看起来差不多。但其中一个可能真的很难，而另一个却很容易，对吧？这就是这个想法。好的。","start":4439.14,"end":4459.53}],"notes":["本段讲授了凸优化问题的直观理解，强调了问题复杂性与直觉之间的差异。讲者通过两个看似相似但实际复杂度不同的优化问题进行对比，指出凸优化问题虽然看起来复杂，但实际上是可解的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4308.63,"end":4459.53,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4308.63,"text":"What? Architects love you, too. Yeah. You know, using material. Yeah, no, no, exactly. So, okay. All right. So, I'll just, you know, I mean, here, it's here. So, it turns out these two look very similar, don't they? And they both look kind of weird and combinatorial, right? Like, you would, I mean, later in the class, you might say, I don't know, they both look kind of hard, right? So, it turns out this one is convex."},{"start":4338.04,"text":"It's very weird, but it is. And the second one is not. I could repeat this. I could transcribe this to any field you like. It would be, construct me a portfolio of 10,000 assets, world market or whatever, but I don't want to hold more than 100 names. That's an example of that. That's actually hard."},{"start":4362.42,"text":"But I could say, I could put a concentration, I could say things like this. I don't want more than 5% of my portfolio to live in any collection of 100 names. Everybody follow that? Someone says, why would you do that? And you go, that's an anti-concentration, you know, blah, blah, blah, inequality, constraint. Anyway, that one's convex. It's just convex, right? So, okay. This is weird, but it actually tells you a very important point. It's actually why you're here, and it's why the class is not like two lectures."},{"start":4391.81,"text":"So I like to think of it this way. In fact, that's part of what the class is about. We are going to break your idea about what's easy and what's hard for an optimization problem. Because unless you know the things you're going to know in this class, you are wrong."},{"start":4409.43,"text":"And it is not obvious. That's, I think, it's kind of interesting, right? Like if I show you a linear program and I tell you, oh my God, you know, it's got this dimensions. There's more vertices than the number of subatomic particles in the universe. And you're like, whoa, whoa, boy, oh, you know. And then I'd say, yeah, I can solve that in 50 milliseconds on my phone, okay? So it's just, I'm just saying these things are not obvious. They're weird. So, or another way that I would usually say something like this, that this is,"},{"start":4439.14,"text":"I guess problem complexity is not continuous in the intuition norm. That's the way to say it, right? So it means two things can look intuitively to be very similar. You're like, yeah, whatever. They look about the same. But one can be really hard and one is really easy, right? So that's the idea. Okay."}],"speech_gaps":[],"frame":"../frames/v001/027.webp","frame_time":4320.63},{"title":"课程目标与实际应用","segments":[{"id":216,"text":"Let's see. Okay, so this is this example. I'll just say a little bit about the course goals and then I think we'll just finish up today. So, you know, the main goal is to be able to recognize convex problems, right? And so the reason is it is not going to happen to you that you go to an internship or a startup or something and someone says, whoa, I have this optimization problem. I think it might be convex. It's not going to happen.","zh":"让我们看看。好的，所以这是这个例子。我只会稍微说一点课程目标，然后我想我们今天就结束了。所以，你知道的，主要目标是能够识别凸问题，对吧？所以原因是你不会遇到这样的情况：你去实习或者加入一家初创公司，然后有人会说，哇，我有一个优化问题。我想它可能是凸的。这不会发生的。","start":4462.51,"end":4489.53},{"id":217,"text":"what's going to happen is they're going to come to you and it's going to be unbelievably complicated and they're going to say oh do you know about like you know mortgage swap derivative you know options and what and you're like and then they'd say well here's the basics of this and here's that and here's that oh yeah here's a giant book read that and an intern fit this model and you're like whoa so it's going to be really complicated this this is the way it really works right and it's going to be your job to cut through all the noise sit back come back the next day and go it's done","zh":"真正会发生的是他们会来找你，而且问题会无比复杂，他们会说哦，你知道关于抵押掉期衍生品、期权之类的吗？你就会愣住，然后他们会说，好吧，这里有一些这个的基础，这里有一些那个，这里有一些那个，哦，对了，这里有一本大书，读一下，然后实习生把这个模型拟合出来，你会说哇，这真的太复杂了，这就是它真正运作的方式，而你的工作就是过滤掉所有噪音，坐下来，第二天回来就说它已经完成了。","start":4489.95,"end":4518.78},{"id":218,"text":"I can schedule your EV charging. And they'll go, what do you mean? It's really complicated. Like, you know, we have limits on the total amount of power here and blah, blah, blah. And different people, different customers have different goals about when they want to have so much charge. And you're like, it's done. You'll just say it's done. So that's what we're training you for. So that actually, weirdly, that actually happens. Like, I've actually had students come back to me.","zh":"我可以为你安排电动汽车的充电。他们会问，你是怎么想的？这真的很复杂。比如，你知道的，我们在这里对总功率有上限，等等。不同的人、不同的客户对于何时充满电有不同的目标。你会说，它已经完成了。这就是我们训练你们的。所以实际上，奇怪的是，这真的会发生。比如，我实际上有学生在下一年回来找我。","start":4519.29,"end":4544.59},{"id":219,"text":"Fall the next year one came back and I was like, what is it? And he said you said","zh":"秋天，有一个学生回来了，我说，这是什么？他说你曾说过","start":4547.18,"end":4552.2},{"id":220,"text":"Yeah, you know, you rant and rave about it. They said, we just thought you were just telling stories and being weird and stuff. I was like, yeah, mostly I am. And he said, yeah, but what he said actually really happened to me. Like, I actually really went and they said, oh, we want to make this regression model. It's super complicated. And there's this and that. And you have to do this and that. And there's causality. And you can't use this before that. And let's remember that the Hong Kong thing, those prices closed before this opened. And you're like, whoa. Anyway, it turned out.","zh":"是的，你知道的，你抱怨和发牢骚。他们说，我们只是以为你在讲故事和装怪。我说，是的，我大部分时候都是这样。他说，是的，但他所说的实际上真的发生在我身上。比如，我实际上真的去了，他们说，哦，我们想做一个回归模型。这超级复杂。还有这个和那个。你必须做这个和那个。还有因果关系。你不能在那个之前使用这个。还记得那个香港的事情，那些价格在开盘前就收盘了。你会说，哇。不管怎样，结果证明。","start":4552.64,"end":4578.32},{"id":221,"text":"It was just convex, the whole thing. And I said, well, what happened then? He said, I was the superstar intern, right? And he said, actually, it was finished in about a week. But anyway, so it actually does happen, just to let you know. OK. And then it's very much the class that focuses in no way whatsoever on the theory. There's extremely interesting theory here. But there is no.","zh":"它只是凸的，整个事情。我说，那之后发生了什么呢？他说，我当时是超级实习生，对吧？他说，实际上，这件事在一个星期左右就完成了。不过，总之，这种事情确实会发生，只是让你知道一下。好的。然后，这门课基本上完全不涉及任何理论。这里有着极其有趣的理论，但这里没有任何理论。","start":4578.81,"end":4604.48},{"id":222,"text":"We're not interested in that. We're actually interested in solving problems. And so, you know...","zh":"我们不感兴趣的是那些理论。我们实际上感兴趣的是解决问题。所以，你知道……","start":4605.18,"end":4611.04},{"id":223,"text":"You will have practice writing these 10-line scripts. You can't get out of here. You will have done signal processing. You'll do machine learning. You're going to do control. You're going to do portfolio construction. You're going to find arbitrage-free bounds on prices. I don't know what you're going to do, but you're going to do a lot of weird practical stuff. I mean, kind of sandbox versions of things, but still, they will be completely real.","zh":"你们将有机会练习编写这些10行的脚本。你们别想逃掉。你们将进行信号处理。你们将做机器学习。你们将做控制。你们将做投资组合构建。你们将找到无套利价格的上界。我不知道你们会做什么，但你们将做很多奇怪的实用事情。我是说，这些是某种沙盒版本的东西，但即便如此，它们仍然是完全真实的。","start":4611.22,"end":4637.3}],"notes":["本段主要讲解了课程的目标，即帮助学生识别凸优化问题，并强调在实际应用中，学生将面对复杂的问题，但需要能够快速识别并解决这些问题。课程的重点是实际应用而非理论，学生将学习如何在各种实际场景中应用凸优化，如信号处理、机器学习、控制、投资组合构建等。","讲者通过一个实际案例说明了课程的实际应用价值，即学生在实习或工作中遇到复杂问题时，能够快速识别其为凸优化问题并解决。这个例子表明，虽然问题看起来复杂，但其本质可能是凸的，从而可以高效求解。","课程强调实践性，学生将通过编写简短的脚本、处理实际数据等方式进行学习，而不是专注于理论推导。这种教学方式旨在让学生掌握解决实际问题的技能。","讲者提到，学生在实际工作中可能会遇到涉及因果关系、时间顺序等复杂因素的问题，但通过凸优化的方法，可以快速找到解决方案。这表明课程不仅教授理论，还注重实际问题的建模与求解。","课程内容涵盖多个领域，如信号处理、机器学习、控制、投资组合构建等，说明凸优化在实际应用中的广泛性。学生将学习如何在这些领域中应用凸优化技术。","讲者强调，虽然课程不专注于理论，但理论基础仍然重要。学生需要理解凸优化的基本概念，以便在实际问题中正确应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4462.51,"end":4637.3,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4462.51,"text":"Let's see. Okay, so this is this example. I'll just say a little bit about the course goals and then I think we'll just finish up today. So, you know, the main goal is to be able to recognize convex problems, right? And so the reason is it is not going to happen to you that you go to an internship or a startup or something and someone says, whoa, I have this optimization problem. I think it might be convex. It's not going to happen."},{"start":4489.95,"text":"what's going to happen is they're going to come to you and it's going to be unbelievably complicated and they're going to say oh do you know about like you know mortgage swap derivative you know options and what and you're like and then they'd say well here's the basics of this and here's that and here's that oh yeah here's a giant book read that and an intern fit this model and you're like whoa so it's going to be really complicated this this is the way it really works right and it's going to be your job to cut through all the noise sit back come back the next day and go it's done"},{"start":4519.29,"text":"I can schedule your EV charging. And they'll go, what do you mean? It's really complicated. Like, you know, we have limits on the total amount of power here and blah, blah, blah. And different people, different customers have different goals about when they want to have so much charge. And you're like, it's done. You'll just say it's done. So that's what we're training you for. So that actually, weirdly, that actually happens. Like, I've actually had students come back to me."},{"start":4547.18,"text":"Fall the next year one came back and I was like, what is it? And he said you said"},{"start":4552.64,"text":"Yeah, you know, you rant and rave about it. They said, we just thought you were just telling stories and being weird and stuff. I was like, yeah, mostly I am. And he said, yeah, but what he said actually really happened to me. Like, I actually really went and they said, oh, we want to make this regression model. It's super complicated. And there's this and that. And you have to do this and that. And there's causality. And you can't use this before that. And let's remember that the Hong Kong thing, those prices closed before this opened. And you're like, whoa. Anyway, it turned out."},{"start":4578.81,"text":"It was just convex, the whole thing. And I said, well, what happened then? He said, I was the superstar intern, right? And he said, actually, it was finished in about a week. But anyway, so it actually does happen, just to let you know. OK. And then it's very much the class that focuses in no way whatsoever on the theory. There's extremely interesting theory here. But there is no."},{"start":4605.18,"text":"We're not interested in that. We're actually interested in solving problems. And so, you know..."},{"start":4611.22,"text":"You will have practice writing these 10-line scripts. You can't get out of here. You will have done signal processing. You'll do machine learning. You're going to do control. You're going to do portfolio construction. You're going to find arbitrage-free bounds on prices. I don't know what you're going to do, but you're going to do a lot of weird practical stuff. I mean, kind of sandbox versions of things, but still, they will be completely real."}],"speech_gaps":[],"frame":"../frames/v001/028.webp","frame_time":4474.51},{"title":"课程目标与学习方式","segments":[{"id":224,"text":"uh so that's going to be kind of the focus of the class and and that's kind of what we're uh what we're trying to to produce right so maybe at the end of the class you know we're going to make it all very simple it's going to be kind of a um going to be in a sandbox we'll pre-digest stuff it'll it'll be fine but and then maybe at the end of the class once you've mastered all of those things then i'll i'll tell you some um","zh":"嗯，所以这将是这门课的重点，也是我们试图要产出的东西。也许在课程结束时，我们会把所有内容变得非常简单，它将是一个沙盒环境，我们会预先处理好一切内容，它会很顺利。但也许在课程结束时，当你掌握了所有这些内容之后，我会告诉你一些嗯……","start":4637.74,"end":4662.94},{"id":225,"text":"maybe some secret street fighting tricks before you go out into the wild. But I'll make you sign a release saying you didn't learn those things from me. So we'll do that a bit later. So that's really the goal of the class is to learn these things. So I'm going to quit here, but I am going to say one thing. Bear in mind that when we come back Thursday, the tone is going to change.","zh":"也许是一些秘密的街头格斗技巧，然后你再去外面世界闯荡。但我会让你签署一份声明，说明你没有从我这里学到这些内容。我们会在稍后做这件事。这门课真正的目标就是学习这些内容。我现在要结束了，但我要说一件事。请记住，当我们周四回来时，语气将会发生变化。","start":4663.62,"end":4689.48},{"id":226,"text":"You might be thinking, this is actually kind of interesting. This is going to be a fun class. Wait till Thursday. We're going in way deep. Well, it'll be weird, but anyway, you'll see.","zh":"你可能会想，这其实还挺有趣的。这将是一门有趣的课。等到周四吧。我们会深入探讨。好吧，这会很奇怪，但无论如何，你将会看到。","start":4690.38,"end":4701.1}],"notes":["本段主要介绍了课程的目标和学习方式。课程将从基础概念开始，逐步深入，最终让学生掌握相关知识，并在课程结束时提供一些实用技巧。课程初期会以简单的方式讲解内容，让学生在‘沙盒’环境中学习，之后会进入更深入的阶段。","讲者提到课程后期会引入一些‘秘密街头格斗技巧’，但要求学生签署声明，表明这些技巧并非来自讲者本人。这表明课程不仅注重理论，也强调实践和应用。","课程初期的语气较为轻松，但到周四会进入更深入的学习阶段，这可能意味着课程内容会逐步加深，学生需要做好心理准备。","讲者提到学生可能会觉得课程有趣，但提醒他们周四的内容会更加深入，这可能意味着课程内容会有较大的变化，学生需要适应不同的学习节奏。","讲者使用了‘sand box’这样的比喻，说明课程会提供一个安全的环境让学生学习，之后再逐步挑战更复杂的概念。","课程的目标是让学生掌握这些知识，而不仅仅是了解，这表明课程注重实际应用和深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4637.74,"end":4701.1,"asr_flags":[],"translation_complete":true,"translated_segments":3,"raw_segments":[{"start":4637.74,"text":"uh so that's going to be kind of the the the focus of the of the class and and that's kind of what we're uh what we're trying to to produce right so maybe at the end of the class you know we're going to make it all very simple it's going to be kind of a um going to be in a sandbox we'll pre-digest stuff it'll it'll be fine but and then maybe at the end of the class once you've mastered all of those things then i'll i'll tell you some um"},{"start":4663.62,"text":"maybe some secret street fighting tricks before you go out into the wild. But I'll make you sign a release saying you didn't learn those things from me. So we'll do that a bit later. So that's really the goal of the class is to learn these things. So I'm going to quit here, but I am going to say one thing. Bear in mind that when we come back Thursday, the tone is going to change."},{"start":4690.38,"text":"You might be thinking, this is actually kind of interesting. This is going to be a fun class. Wait till Thursday. We're going in way deep. Well, it'll be weird, but anyway, you'll see."}],"speech_gaps":[],"frame":"../frames/v001/029.webp","frame_time":4649.74}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
