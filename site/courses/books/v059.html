过反向传播和正则化技术，可以揭示模型内部对各类别的理解。","课程强调了正则化在模型可视化中的重要性，通过调整正则化方法可以提升图像质量，使模型的决策过程更易于解释。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2320.99,"end":2499.36,"asr_flags":[],"raw_segments":[{"start":2320.99,"text":"So here's what we'll do. We'll define the loss function where we take the pre-softmax score of doc, so the thing right before the softmax, which is only dependent on that specific class, and we might also regularize it to make sure it looks natural. The reason we want the regularization term is because pixels need to be between 0 and 255, roughly. And so you don't want to run an optimization problem where pixels can have values that go all over the place."},{"start":2349.95,"text":"It's just not going to look good to the human eye."},{"start":2353.77,"text":"And so we're going to do that. We're going to run a gradient ascent algorithm, so similar to what we've seen in some of the previous classes, where we're going to update the pixels of an input image, a completely random input image, until we can maximize the loss function we defined. So we forward propagated the random image, we compute the objective, we back propagate all the way back to the pixels, and then we update the pixels to maximize that objective."},{"start":2381.32,"text":"And we do that many times until we end up with something that might look like this. So let's say we take the score of a Dalmatian. You know, here researchers showed, and this is work from Jason Yosinski."},{"start":2403.27,"text":"shows that you can start seeing the model. If you ask the model, what is a Dalmatian, it will tell you it's something with black dots on a white background, roughly. In fact, you might not understand fully what the dog is, but that's what it thinks it is. So we just unpacked it a little bit and queried that. Another interesting one is if you look at..."},{"start":2428.3,"text":"The goose, so here, the top left label goose for the model is many of them."},{"start":2439.14,"text":"What does that mean?"},{"start":2440.12,"text":"It means probably the model has seen a bunch of geese all the time together"},{"start":2444.44,"text":"and has rarely seen a single one."},{"start":2447.32,"text":"And maybe the labeled data was labeling that as goose when it was geese."},{"start":2452.4,"text":"And so the model actually doesn't understand that it's a single one."},{"start":2455.3,"text":"It thinks that all of them are the label."},{"start":2458.74,"text":"Does that make sense?"},{"start":2461.86,"text":"Okay."},{"start":2463.62,"text":"Super."},{"start":2464.18,"text":"So that's called class model visualization."},{"start":2466.02,"text":"You can actually..."},{"start":2466.92,"text":"Oh, sorry."},{"start":2467.42,"text":"I wasn't showing what I was talking about."},{"start":2469.3,"text":"No, I was showing..."},{"start":2472.92,"text":"The way to improve those visualizations"},{"start":2475.7,"text":"is just to change some of the regularization methods."},{"start":2478.16,"text":"So the researchers have shown"},{"start":2479.94,"text":"that you can actually add more color"},{"start":2482.64,"text":"by regularizing better"},{"start":2483.78,"text":"so it looks better to the human eye."},{"start":2485.4,"text":"And then it becomes easier to query the model"},{"start":2488.02,"text":"for a variety of classes just to make sure that it understood those classes."},{"start":2492.7,"text":"And so same with flamingos, actually the label flamingo to the model feels like"}],"speech_gaps":[],"frame":"../frames/v059/015.webp","frame_time":2332.99},{"title":"模型可视化与特征映射分析","segments":[{"id":163,"text":"many flamingos, just something you can observe. Any questions on class model"},{"id":164,"text":"visualization? Nothing super new, just another, you know, tool in your kit. It"},{"id":165,"text":"It turns out you can apply the same type of method"},{"id":166,"text":"as class model visualization,"},{"id":167,"text":"but instead of doing it at the class level,"},{"id":168,"text":"you do it in an intermediary action."},{"id":169,"text":"so you could actually do the same exercise sort of what you were saying earlier with the masking of the later layer and just looking inside the network you could pick an activation in the network create an objective function with the regularization and say hey show me the input picture that maximizes this activation and that should tell you what is the input that maximizes activation the most right"},{"id":170,"text":"Okay, so that's class model visualization, which can also be applied with gradient ascent anywhere inside the network at any neuron. And that already gives you some sort of a method to look at the neuron level and say, hey, what's the input that maximizes the fake input that theoretically you could generate that maximizes that activation?"},{"id":171,"text":"The next method is actually the most commonly used today because it's so simple and intuitive. It's a data set search. So what you could actually do is to pick a filter. You just pick one filter. You pick its feature map among, you know, I guess you pick one feature map at some point in the network, such as after this max pooling layer."},{"id":172,"text":"And so let's say you have 256 filters in that convolution layer. So you have 256 feature maps of size five by five. And you find across all your data, your validation set, the top five image that maximize this feature map."},{"id":173,"text":"so you just track the activations in that feature map you find the highest activation across all your data and you find the top the top five images and you can do that you know again you would say this seems that the filter that produced that feature map has learned to detect shirts because if you find the top five images that activated that feature map the most that filter the most it's all images of shirts"}],"notes":["本段讲解了模型可视化技术，特别是类模型可视化（class model visualization）和特征映射分析（feature map analysis）。类模型可视化是一种通过梯度上升方法，在网络的任意层或神经元上寻找最大化激活的输入图像的技术。这种方法可以用于理解模型在不同层的特征提取能力。","接下来，讲者介绍了另一种更常用的方法，即数据集搜索（data set search）。该方法通过选择一个特定的滤波器（filter），并找到在验证集上激活该滤波器的前五张图像，从而分析该滤波器学习到的特征。例如，如果某滤波器在图像中检测到衬衫，那么激活该滤波器的图像可能都是衬衫。","讲者强调了特征映射分析的直观性和实用性，通过分析特征图（feature map）的激活情况，可以理解模型在不同层学习到的特征类型。","在特征映射分析中，讲者提到，如果某个滤波器在验证集上激活的图像都是衬衫，那么可以推断该滤波器学习到了检测衬衫的特征。","讲者还提到，特征映射分析可以用于理解模型在不同层的特征提取能力，例如在卷积层之后的特征图（feature map）。","最后，讲者指出，特征映射分析是一种简单且直观的方法，可以用于分析模型在不同层的特征提取能力，从而帮助理解模型的内部机制。"],"formulas":[],"uncertainties":["the fake input that theoretically you could generate that maximizes that activation"],"diagram":"none","start":2499.36,"end":2664.58,"asr_flags":[],"raw_segments":[{"start":2499.36,"text":"many flamingos, just something you can observe. Any questions on class model"},{"start":2509.26,"text":"visualization? Nothing super new, just another, you know, tool in your kit. It"},{"start":2517.06,"text":"It turns out you can apply the same type of method"},{"start":2520.84,"text":"as class model visualization,"},{"start":2522.94,"text":"but instead of doing it at the class level,"},{"start":2526.08,"text":"you do it in an intermediary action."},{"start":2531.29,"text":"so you could actually do the same exercise sort of what you were saying earlier with the masking of the later layer and just looking inside the network you could pick an activation in the network create an objective function with the regularization and say hey show me the input picture that maximizes this activation and that should tell you what is the input that maximizes activation the most right"},{"start":2562.38,"text":"Okay, so that's class model visualization, which can also be applied with gradient ascent anywhere inside the network at any neuron. And that already gives you some sort of a method to look at the neuron level and say, hey, what's the input that maximizes the fake input that theoretically you could generate that maximizes that activation?"},{"start":2585.26,"text":"The next method is actually the most commonly used today because it's so simple and intuitive. It's a data set search. So what you could actually do is to pick a filter. You just pick one filter. You pick its feature map among, you know, I guess you pick one feature map at some point in the network, such as after this max pooling layer."},{"start":2613.24,"text":"And so let's say you have 256 filters in that convolution layer. So you have 256 feature maps of size five by five. And you find across all your data, your validation set, the top five image that maximize this feature map."},{"start":2639.26,"text":"so you just track the activations in that feature map you find the highest activation across all your data and you find the top the top five images and you can do that you know again you would say this seems that the filter that produced that feature map has learned to detect shirts because if you find the top five images that activated that feature map the most that filter the most it's all images of shirts"}],"speech_gaps":[],"frame":"../frames/v059/016.webp","frame_time":2511.36},{"title":"模型内部发生了什么：特征图与激活分析","segments":[{"id":174,"text":"If you were to find something like this, you would say, it seems that the filter has learned to detect edges. And you could do that across every feature map to interpret your filters. Okay, simple data set search that can allow you to interpret if a filter is reacting to something meaningful. So if you look at these pictures that I printed at the bottom of the slide, they're all cropped. So why are they cropped?"},{"id":175,"text":"They don't look like images from the data set. The image is probably bigger than that, right? The what? So we took the input image, we send it through the conv relu blocks, and then we pick a feature map in the fifth block, let's say. What is this feature map looking at? Is it looking at the whole image or no? Sorry, what is the... So we pick a feature map."},{"id":176,"text":"And in that feature map, we find the activation that's the highest. So let's say the activation is the row number five, column number three. If you pick that activation, does it have access to the entire input image or not? So you don't necessarily have access to the entire image. The best way to visualize it is at the first layer. Let's say on the first layer, you take the input image, you take a filter, and you run it through."},{"id":177,"text":"that activation in the feature map of the first layer is only going to see what the filter sees, right? When you go deeper in the network, do you see more or less on average of the image? A single activation, does it have access to more or less parts of the image? You say more? Yeah, it's more. Let's look at it. So here's a picture, 64 by 64 by three, let's say. We have a conv."}],"notes":["本段讲解了如何通过特征图和激活值来理解卷积神经网络内部的运作机制。讲者提到，通过在特征图中找到最高激活值，可以确定网络在处理输入图像时关注的区域。同时，讲者指出，随着网络层数的加深，单个激活值能够访问的图像区域会增加，这表明网络在更高层能够捕捉更复杂的特征。","讲者通过一个具体的例子来说明这一现象：假设输入图像为64x64x3的尺寸，经过卷积层处理后，激活值在特征图中只关注滤波器所检测到的区域。随着网络层数的增加，激活值能够访问的图像区域会更多，这表明网络在更高层能够捕捉更全局的特征。","讲者还提到，通过分析特征图和激活值，可以解释网络是否在学习有意义的特征。例如，如果某个特征图的激活值集中在图像的边缘区域，那么可以推测该滤波器可能在学习检测边缘的特征。","此外，讲者指出，特征图的大小和输入图像的大小有关，因此在分析特征图时需要考虑输入图像的尺寸以及网络的结构。例如，如果特征图看起来与数据集中的图像不同，可能是因为输入图像被裁剪过，或者特征图的尺寸较小。","讲者还提到，通过分析特征图和激活值，可以理解网络在处理图像时的注意力机制。例如，如果某个激活值在特征图中集中在某个区域，那么可以推测网络在该区域关注更多的信息。","最后，讲者通过一个具体的例子说明了特征图和激活值的关系：在第一层，激活值只能看到滤波器所检测到的区域，而在更深层，激活值能够访问更多的图像区域，这表明网络在更高层能够捕捉更复杂的特征。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2667.6,"end":2838.88,"asr_flags":[],"raw_segments":[{"start":2667.6,"text":"If you were to find something like this, you would say, it seems that the filter has learned to detect edges. And you could do that across every feature map to interpret your filters. Okay, simple data set search that can allow you to interpret if a filter is reacting to something meaningful. So if you look at these pictures that I printed at the bottom of the slide, they're all cropped. So why are they cropped?"},{"start":2707.95,"text":"They don't look like images from the data set. The image is probably bigger than that, right? The what? So we took the input image, we send it through the conv relu blocks, and then we pick a feature map in the fifth block, let's say. What is this feature map looking at? Is it looking at the whole image or no? Sorry, what is the... So we pick a feature map."},{"start":2754.04,"text":"And in that feature map, we find the activation that's the highest. So let's say the activation is the row number five, column number three. If you pick that activation, does it have access to the entire input image or not? So you don't necessarily have access to the entire image. The best way to visualize it is at the first layer. Let's say on the first layer, you take the input image, you take a filter, and you run it through."},{"start":2803.09,"text":"that activation in the feature map of the first layer is only going to see what the filter sees, right? When you go deeper in the network, do you see more or less on average of the image? A single activation, does it have access to more or less parts of the image? You say more? Yeah, it's more. Let's look at it. So here's a picture, 64 by 64 by three, let's say. We have a conv."}],"speech_gaps":[],"frame":"../frames/v059/017.webp","frame_time":2679.6},{"title":"卷积网络的特征映射与反向工程","segments":[{"id":178,"text":"network, five layers, and after five layers, the last comp has 13 filters and leads to a 13 by 13, sorry, it has 256 filters that leads to a 13 by 13 feature maps. If I look at this feature map, let's say that's the most activated, I trace back to the input space, it will have access to this part of the image, let's say."},{"id":179,"text":"Now, if there was another Convrelu block and I was looking at a feature map,"},{"id":180,"text":"it would have even more abstraction of multiple portions of these squares."},{"id":181,"text":"So it would actually see slightly more from the input image."},{"id":182,"text":"Does that make sense?"},{"id":183,"text":"So, you know, that's how you would think about it."},{"id":184,"text":"And it makes sense because at the end of it, the last output has access to the entire image, right?"},{"id":185,"text":"because all these things are adding up to the prediction."},{"id":186,"text":"The deeper the activation, the more it sees from the image,"},{"id":187,"text":"and that's why the images were cropped."},{"id":188,"text":"They were just cropped based on tracing back"},{"id":189,"text":"what that activation was looking at in the input image,"},{"id":190,"text":"which you can do very simply computationally."},{"id":191,"text":"Okay, so now we're going to look at our last method for convs,"},{"id":192,"text":"which has to do with reverse engineering, a conv,"},{"id":193,"text":"and then we move to the frontier models."},{"id":194,"text":"So remember this slide from when we introduced generative adversarial networks, GANs?"},{"id":195,"text":"I didn't talk too much about the generator architecture."},{"id":196,"text":"I just said it was a neural network,"},{"id":197,"text":"but I did mention that something's weird about that network,"},{"id":198,"text":"which is that the input is way smaller than its output."},{"id":199,"text":"The input is a vector z, the output is an image of more dimensions."},{"id":200,"text":"It is very common that such a network needs to upsample and thus would use a deconvolution."},{"id":201,"text":"Sometimes in the literature you're going to see dimensions of deconvolutions as an upsampling network."},{"id":202,"text":"The input is smaller than the output."},{"id":203,"text":"Sometimes those are called transposed convolutions, but we're going to talk about them."},{"id":204,"text":"Another example where you might run into upsampling is when you have an encoder-decoder type network, such as for segmentation. So let's say you're given an image of a cellular set of cells like this, and then you want to label, segment the pixels that belong to a cell just to find the different cells. Typically, you would use a set of convolutions that reduces the volume in height and width. And then..."}],"notes":["本段讲解了卷积网络中特征映射的形成过程，指出随着网络层数的增加，特征映射的尺寸会逐渐减小，而滤波器的数量会增加。例如，在五层网络中，最后一层有256个滤波器，生成13x13的特征图。通过反向追踪，可以确定特征图对应输入图像的特定区域。","教师提到，如果网络中存在另一个卷积-激活块，特征图将包含更多抽象信息，能够捕捉输入图像中多个区域的特征。这表明随着网络深度的增加，模型对输入图像的感知范围也在扩大。","教师指出，网络的最后输出能够访问整个图像，因为所有层的激活共同作用于最终的预测。因此，图像被裁剪是为了确保特征图能够正确映射到输入图像的相应区域。","教师提到，反向追踪特征图的激活区域可以通过简单的计算实现，这为理解模型内部的特征提取过程提供了方法。","教师介绍了反向工程卷积网络的方法，并提到将讨论反向工程的前沿模型。这表明课程内容将从基础卷积网络转向更复杂的模型结构。","教师回顾了生成对抗网络（GANs）的生成器架构，指出输入向量z的维度远小于输出图像的维度，因此需要进行上采样。这种上采样通常通过反卷积（deconvolution）实现，有时也被称为转置卷积（transposed convolutions）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2839.5,"end":3012.43,"asr_flags":[],"raw_segments":[{"start":2839.5,"text":"network, five layers, and after five layers, the last comp has 13 filters and leads to a 13 by 13, sorry, it has 256 filters that leads to a 13 by 13 feature maps. If I look at this feature map, let's say that's the most activated, I trace back to the input space, it will have access to this part of the image, let's say."},{"start":2869.97,"text":"Now, if there was another Convrelu block and I was looking at a feature map,"},{"start":2875.77,"text":"it would have even more abstraction of multiple portions of these squares."},{"start":2879.81,"text":"So it would actually see slightly more from the input image."},{"start":2882.95,"text":"Does that make sense?"},{"start":2885.23,"text":"So, you know, that's how you would think about it."},{"start":2889.31,"text":"And it makes sense because at the end of it, the last output has access to the entire image, right?"},{"start":2894.47,"text":"because all these things are adding up to the prediction."},{"start":2903.27,"text":"The deeper the activation, the more it sees from the image,"},{"start":2906.67,"text":"and that's why the images were cropped."},{"start":2908.33,"text":"They were just cropped based on tracing back"},{"start":2910.79,"text":"what that activation was looking at in the input image,"},{"start":2913.49,"text":"which you can do very simply computationally."},{"start":2919.55,"text":"Okay, so now we're going to look at our last method for convs,"},{"start":2923.35,"text":"which has to do with reverse engineering, a conv,"},{"start":2926.71,"text":"and then we move to the frontier models."},{"start":2930.73,"text":"So remember this slide from when we introduced generative adversarial networks, GANs?"},{"start":2939.15,"text":"I didn't talk too much about the generator architecture."},{"start":2943.55,"text":"I just said it was a neural network,"},{"start":2945.39,"text":"but I did mention that something's weird about that network,"},{"start":2949.57,"text":"which is that the input is way smaller than its output."},{"start":2953.35,"text":"The input is a vector z, the output is an image of more dimensions."},{"start":2959.19,"text":"It is very common that such a network needs to upsample and thus would use a deconvolution."},{"start":2966.47,"text":"Sometimes in the literature you're going to see dimensions of deconvolutions as an upsampling network."},{"start":2973.63,"text":"The input is smaller than the output."},{"start":2978.09,"text":"Sometimes those are called transposed convolutions, but we're going to talk about them."},{"start":2984.48,"text":"Another example where you might run into upsampling is when you have an encoder-decoder type network, such as for segmentation. So let's say you're given an image of a cellular set of cells like this, and then you want to label, segment the pixels that belong to a cell just to find the different cells. Typically, you would use a set of convolutions that reduces the volume in height and width. And then..."}],"speech_gaps":[],"frame":"../frames/v059/018.webp","frame_time":2851.5},{"title":"卷积网络与反向工程","segments":[{"id":205,"text":"You get information encoded in a dense format that you will then sample because your output should be of the size of the inputs minus the number of channels. But at least every pixel should have its own class. And so typically that would be a set of convolutions followed by deconvolutions. So you downsample, you upsample. Why am I talking about deconvolutions? Because we're going to try to reverse engineer."},{"id":206,"text":"conv networks by adding a module, a deconvolutional module that will take a specific activation and will reverse engineer the trace to verify what was the reason this activation was high. This idea is key, not only for convs, but for any network you think about in the future when you work on it, if you want to actually reverse engineer the reason a specific neuron has been active."},{"id":207,"text":"So let's take the example of a 1D convolution. This is the most basic example just for the sake of understanding the math. And I give you an input x which has..."},{"id":208,"text":"some padding with two zeros at the top, two zeros at the bottom, and then X1 through X8 values, and I send that input to a 1D convolution, which has one single filter of size four with a stride of two. What's the size of my output Y? Remember the formula. What? Five, correct. Yes, I assume you did this. This."},{"id":209,"text":"You know, you took the Nx, you applied the formula, and you floored it, you didn't forget to add 1, and then you ended up with 5. Is that it? Yeah. Correct. Super."},{"id":210,"text":"So we have our output of 5, and let's say we define our filter size for W1, W2, W3, W4. It's actually easy to see that the CONV1D can be written as a system of equations where Y1 equals W1 times 0 plus W2 times 0 because of the padding plus W3 times X1 plus W4 times X2, right?"}],"notes":["本段讲解了卷积网络中反向工程的概念，即通过添加反卷积模块来分析特定激活值高的原因。这不仅适用于卷积网络，也适用于未来设计的任何网络。","讲者通过一个1D卷积的例子来说明数学计算过程，包括输入的填充、卷积核的大小和步长，以及输出尺寸的计算。","在计算输出尺寸时，讲者强调了公式中的关键步骤，包括对输入尺寸的处理、填充的影响以及最终结果的计算。","讲者进一步解释了1D卷积的数学表达，展示了如何通过卷积核与输入的乘积来得到输出的每个元素。","整个讲解强调了卷积操作的数学基础，以及如何通过反向工程来理解网络内部的运作机制。","讲者通过具体的例子和公式推导，帮助学生理解卷积网络的结构和计算过程，为后续的反向工程打下基础。"],"formulas":[],"uncertainti
