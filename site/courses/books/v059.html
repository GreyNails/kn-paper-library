作是对视觉网络的一个轻微修改，可以让你解开网络内部发生了什么以及决策过程。还有一种对CAM或类激活映射算法的改进方法，称为GradCam，它增强了该方法。好的？有关类激活映射有任何问题吗？","start":2100.99,"end":2136.62}],"notes":["本段讲解了类激活映射（Class Activation Map, CAM）的基本原理，即通过将全连接层的权重与特征图进行加权求和，从而可视化模型对输入图像中特定类别的关注区域。讲者提到，特征图的激活程度反映了其对最终得分的贡献，而通过叠加这些特征图并应用权重，可以得到一个类激活映射，用于解释模型的决策过程。","讲者进一步说明，CAM方法需要重新训练最后一层全连接层，并且只使用最后一层的权重，而不是整个网络的权重。这样可以避免信息丢失，并且能够追溯到输入空间中的局部信息。同时，讲者指出，CAM方法可以应用于不同的类别，如狗和猫，不同类别的权重分布可能不同。","讲者提到，CAM方法由伯克利的研究人员提出，并且还介绍了其改进版本GradCam。GradCam通过引入梯度信息来增强CAM的效果，使得模型的决策过程更加清晰。讲者最后询问学生是否对类激活映射有任何问题，表明该方法是当前研究中的一个重要方向。","在讲解过程中，讲者强调了特征图与权重之间的关系，以及如何通过加权求和得到最终的类激活映射。同时，讲者指出，CAM方法能够帮助理解深度学习模型的内部机制，从而提高模型的可解释性。","讲者还提到，CAM方法仅使用最后一层全连接层的权重，而不是整个网络的权重，这有助于避免信息混杂，并且能够更准确地追溯到输入空间中的局部信息。这种方法在图像分类任务中具有重要的应用价值。","最后，讲者通过提问的方式引导学生思考类激活映射的应用和意义，表明该方法在模型解释和可视化方面的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1990.02,"end":2136.62,"asr_flags":[],"math_clarifications":["公式CAM = sum(w_i × f_i)未明确权重w_i和特征图f_i的具体来源或计算方式，且未体现权重的归一化处理，可能影响结果的准确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1990.02,"text":"And now we can treat that as a vector that goes through a decision engine or a fully connected layer that ultimately goes through our softmax and give us the probabilities. So this architecture is easier to trace back to localized information in the input space because you can actually look at, let's say, one of the score of dog, and you can look at the weights of each of these edges."},{"start":2016.06,"text":"that tell you how much has the feature map from the volume before contributed to that score. So in other words, if I had to summarize, let's say the feature map looks like this. So this feature map is very high, has somehow activated heavily in some portion of the input image. The others similarly have activated."},{"start":2038.61,"text":"To other things, you're taking the weights from your fully connected layer. By the way, you have to retrain that layer. You have to just train that layer, that last one. And then you sum all of them and it gives you what we call a class activation map for the class that you're visualizing. So you're overlaying those last six feature maps and you're weighing them with the weights of the last fully connected layer. You're not losing information. You're not mixing three fully connected layers that are impossible to trace back to the input space. Okay?"},{"start":2075.38,"text":"So if you now give it an input image and you overlay the class activation map for the score of dog, which you can do for other classes. You can do the same thing for the class of cat. Look at the different weights, the feature maps. And maybe for the class of cat, the weights will certainly be different. So the contribution of each feature map will be different. Yeah, and this is what you get. This is called class activation map."},{"start":2100.99,"text":"It's from folks over at Berkeley. And so here's a video that describes it. It runs really quickly. You can think of it as a slight modification to a vision network that can allow you to unpack what's happening inside and what's the decision process. There is also sort of an improvement to the CAM or class activation map algorithm called GradCam, which enhances that method. Okay? Any questions on class activation maps?"}],"speech_gaps":[],"frame":"../frames/v059/013.webp","frame_time":2002.02},{"title":"模型内部发生了什么：可视化与理解","segments":[{"id":128,"text":"So we're getting to know convolutions a little better. Yeah. Yeah, so you were saying in the video, it seems like the model sometimes is looking at meaningless things. Yeah, I mean, it's not surprising, frankly. This is the previous generation of models. And on top of that, you're looking on a video. The model is a classification network. So it might look sometimes at things that are not even labeled.","zh":"所以我们对卷积有了稍微更好的了解。是的。是的，你在视频中说，似乎模型有时会关注一些无意义的东西。是的，说实话，这并不令人惊讶。这是前一代的模型。而且你是在视频上进行观察。模型是一个分类网络。因此，它有时可能会关注那些甚至没有被标记的东西。","start":2140.74,"end":2171.84},{"id":129,"text":"And so it has to find the closest one. It might not make sense at all. That's why you build that type of module to visualize and understand the network's actually not working that well. But maybe on the main objects that you actually want for your task, let's say the zoo wants to do very well with cats and dogs, you can verify that when a cat is moving even at fast speed, the model's quickly looking at it. Super. Let's do a couple more methods because it's going to build our intuition.","zh":"因此，它必须找到最接近的一个。这可能完全没意义。这就是为什么你要构建这种模块来可视化和理解网络实际上并没有很好地工作。但也许在你任务中真正需要的对象上，比如说动物园希望在猫和狗上表现非常好，你可以验证当猫快速移动时，模型能够迅速关注它。很好。让我们再做几个方法，因为这将帮助我们建立直觉。","start":2172.61,"end":2203.64},{"id":130,"text":"for frontier models. So now the zoo trusts you. It trusts that the model correctly locates animals, but they get sort of scared and they wonder if the model understands what a dog is. Does it understand actually what a dog is or is it just like pattern matching random things? How could you take this ConvNet","zh":"对于前沿模型。现在动物园信任你。它信任模型能够正确定位动物，但它们有点害怕，并且想知道模型是否理解什么是狗。它实际上是否理解什么是狗，还是只是随机模式匹配？你如何利用这个ConvNet","start":2205.07,"end":2232.14},{"id":131,"text":"and sort of query what the model thinks a dog is. How would you do that? How could you ask the model what's your best representation of a dog? Okay, yeah, you did say two things. So get an image, so a forged image that maximizes the probability of dog. Yeah, let's do that actually. And then on your second point about","zh":"来查询模型认为狗是什么？你如何做到这一点？你如何询问模型你对狗的最佳表示是什么？好的，是的，你说过两件事。所以获取一张图像，即一张最大化狗概率的伪造图像。是的，我们实际上可以这么做。然后在你关于","start":2233.37,"end":2282.81},{"id":132,"text":"reverse engineering, we're going to look at the method there as well. But yeah, I agree. So how would you concretely do that? What would you maximize? Okay.","zh":"反向工程的第二点上，我们也将查看该方法。是的，我同意。那么你如何具体地做到这一点？你要最大化什么？好的。","start":2284.79,"end":2296.71},{"id":133,"text":"Actually, what we said earlier, but I think you came right after that, is we would not take the softmax output because the softmax output is dependent on other classes. You divide by the sum of the exponentials of other classes. And so you could actually maximize the softmax output by not maximizing the class you want, but by minimizing the other classes, which is different than what you want.","zh":"实际上，我们之前说过，但我认为你紧接着说的是，我们不应该使用softmax输出，因为softmax输出依赖于其他类别。你将其他类别的指数相加后进行除法。因此，实际上可以通过不最大化你想要的类别，而是最小化其他类别来最大化softmax输出，这与你想要的有所不同。","start":2297.26,"end":2319.28}],"notes":["本段讨论了如何通过最大化softmax输出来理解模型对特定类别的表示。讲者指出，softmax输出依赖于其他类别的概率，因此不能直接最大化目标类别的概率，而是需要最小化其他类别的概率，从而间接提高目标类别的概率。这种做法与直接最大化目标类别的概率不同，因为softmax的计算方式涉及所有类别的指数和。","讲者提到，为了查询模型对‘狗’的表示，可以构造一个图像，使得该图像最大化模型对‘狗’类别的softmax输出。这涉及到对图像进行优化，以改变模型的输出概率分布。这种方法被称为反向工程，用于理解模型内部的表示。","在反向工程过程中，需要考虑softmax输出的计算方式，即每个类别的概率是该类别对数似然除以所有类别对数似然的和。因此，最大化目标类别的概率需要同时最小化其他类别的概率，这与直接最大化目标类别的概率不同。","讲者强调，这种反向工程方法可以帮助理解模型是否真正理解了目标类别（如‘狗’），还是仅仅通过模式匹配来识别。这涉及到对模型内部表示的深入分析，以判断其是否具备语义理解能力。","在实际操作中，可以通过优化图像的像素值，使得模型对目标类别的softmax输出最大化。这种方法需要使用梯度上升算法，逐步调整图像，以达到目标输出。","讲者指出，这种方法虽然有效，但需要注意softmax输出的依赖性，即目标类别的概率受到其他类别概率的影响。因此，在反向工程过程中，需要同时考虑所有类别的概率分布，而不仅仅是目标类别。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2140.74,"end":2319.28,"asr_flags":[],"math_clarifications":["原文提到不能直接最大化softmax输出，因为其依赖于其他类别的概率，因此该公式不能直接用于最大化目标类别的概率。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2140.74,"text":"So we're getting to know convolutions a little better. Yeah. Yeah, so you were saying in the video, it seems like the model sometimes is looking at meaningless things. Yeah, I mean, it's not surprising, frankly. This is the previous generation of models. And on top of that, you're looking on a video. The model is a classification network. So it might look sometimes at things that are not even labeled."},{"start":2172.61,"text":"And so it has to find the closest one. It might not make sense at all. That's why you build that type of module to visualize and understand the network's actually not working that well. But maybe on the main objects that you actually want for your task, let's say the zoo wants to do very well with cats and dogs, you can verify that when a cat is moving even at fast speed, the model's quickly looking at it. Super. Let's do a couple more methods because it's going to build our intuition."},{"start":2205.07,"text":"for frontier models. So now the zoo trusts you. It trusts that the model correctly locates animals, but they get sort of scared and they wonder if the model understands what a dog is. Does it understand actually what a dog is or is it just like pattern matching random things? How could you take this ConvNet"},{"start":2233.37,"text":"and sort of query what the model thinks a dog is. How would you do that? How could you ask the model what's your best representation of a dog? Okay, yeah, you did say two things. So get an image, so a forged image that maximizes the probability of dog. Yeah, let's do that actually. And then on your second point about"},{"start":2284.79,"text":"reverse engineering, we're going to look at the method there as well. But yeah, I agree. So how would you concretely do that? What would you maximize? Okay."},{"start":2297.26,"text":"Actually, what we said earlier, but I think you came right after that, is we would not take the softmax output because the softmax output is dependent on other classes. You divide by the sum of the exponentials of other classes. And so you could actually maximize the softmax output by not maximizing the class you want, but by minimizing the other classes, which is different than what you want."}],"speech_gaps":[],"frame":"../frames/v059/014.webp","frame_time":2152.74},{"title":"模型内部发生了什么：可视化与正则化","segments":[{"id":134,"text":"So here's what we'll do. We'll define the loss function where we take the pre-softmax score of doc, so the thing right before the softmax, which is only dependent on that specific class, and we might also regularize it to make sure it looks natural. The reason we want the regularization term is because pixels need to be between 0 and 255, roughly. And so you don't want to run an optimization problem where pixels can have values that go all over the place.","zh":"那么我们将怎么做呢？我们将定义一个损失函数，其中我们取文档的预softmax得分，也就是softmax之前的那个部分，它只依赖于特定的类别，我们还可能对其进行正则化，以确保其看起来自然。我们想要正则化项的原因是，像素值应该大致在0到255之间。因此，你不希望运行一个优化问题，其中像素值可以到处乱跑。","start":2320.99,"end":2349.25},{"id":135,"text":"It's just not going to look good to the human eye.","zh":"这在人眼看来肯定不会好看。","start":2349.95,"end":2351.91},{"id":136,"text":"And so we're going to do that. We're going to run a gradient ascent algorithm, so similar to what we've seen in some of the previous classes, where we're going to update the pixels of an input image, a completely random input image, until we can maximize the loss function we defined. So we forward propagated the random image, we compute the objective, we back propagate all the way back to the pixels, and then we update the pixels to maximize that objective.","zh":"因此，我们将这样做。我们将运行一个梯度上升算法，类似于我们在一些先前课程中看到的，我们将更新输入图像的像素值，一个完全随机的输入图像，直到我们最大化我们定义的损失函数。因此，我们将随机图像进行前向传播，计算目标函数，然后将梯度反向传播回像素，然后更新像素以最大化该目标函数。","start":2353.77,"end":2380.73},{"id":137,"text":"And we do that many times until we end up with something that might look like this. So let's say we take the score of a Dalmatian. You know, here researchers showed, and this is work from Jason Yosinski.","zh":"我们将多次重复这个过程，直到我们得到一个看起来像这样的结果。例如，假设我们取斑点狗的得分。你知道，研究人员已经展示了这一点，这是Jason Yosinski的工作。","start":2381.32,"end":2401.6},{"id":138,"text":"shows that you can start seeing the model. If you ask the model, what is a Dalmatian, it will tell you it's something with black dots on a white background, roughly. In fact, you might not understand fully what the dog is, but that's what it thinks it is. So we just unpacked it a little bit and queried that.","zh":"展示了你可以开始看到模型。如果你问模型，什么是斑点狗，它会告诉你，它是一种在白色背景上有黑色斑点的东西，大致如此。事实上，你可能并不完全理解这只狗是什么，但这就是它认为的样子。因此，我们只是稍微解开了它并进行了查询。","start":2403.27,"end":2427.45},{"id":139,"text":"The goose, so here, the top left label goose for the model is many of them.","zh":"鹅，这里，模型的左上角标签是鹅，有很多个。","start":2428.3,"end":2438.1},{"id":140,"text":"What does that mean?","zh":"这意味着什么？","start":2439.14,"end":2440.08},{"id":141,"text":"It means probably the model has seen a bunch of geese all the time together","zh":"这意味着模型可能一直看到了很多只鹅。","start":2440.12,"end":2444.44},{"id":142,"text":"and has rarely seen a single one.","zh":"并且很少看到一个单独的实例。","start":2444.44,"end":2446.4},{"id":143,"text":"And maybe the labeled data was labeling that as goose when it was geese.","zh":"也许标注数据将它们标记为鹅，而实际上是一群鹅。","start":2447.32,"end":2452.12},{"id":144,"text":"And so the model actually doesn't understand that it's a single one.","zh":"因此，模型实际上并不理解它是一个单独的实例。","start":2452.4,"end":2455.24},{"id":145,"text":"It thinks that all of them are the label.","zh":"它认为所有这些都是标签。","start":2455.3,"end":2458.14},{"id":146,"text":"Does that make sense?","zh":"这有意义吗？","start":2458.74,"end":2459.58},{"id":147,"text":"Okay.","zh":"好的。","start":2461.86,"end":2462.32},{"id":148,"text":"Super.","zh":"很好。","start":2463.62,"end":2464.08},{"id":149,"text":"So that's called class model visualization.","zh":"这被称为类模型可视化。","start":2464.18,"end":2465.6},{"id":150,"text":"You can actually...","zh":"你实际上可以...","start":2466.02,"end":2466.92},{"id":151,"text":"Oh, sorry.","zh":"哦，抱歉。","start":2466.92,"end":2467.34},{"id":152,"text":"I wasn't showing what I was talking about.","zh":"我刚才没有展示我所谈论的内容。","start":2467.42,"end":2469.18},{"id":153,"text":"No, I was showing...","zh":"不，我是在展示...","start":2469.3,"end":2470.2},{"id":154,"text":"The way to improve those visualizations","zh":"改进这些可视化的方法","start":2472.92,"end":2475.7},{"id":155,"text":"is just to change some of the regularization methods.","zh":"只是改变一些正则化方法。","start":2475.7,"end":2478.06},{"id":156,"text":"So the researchers have shown","zh":"因此研究人员已经表明","start":2478.16,"end":2479.94},{"id":157,"text":"that you can actually add more color","zh":"你实际上可以添加更多颜色","start":2479.94,"end":2482.64},{"id":158,"text":"by regularizing better","zh":"通过更好的正则化","start":2482.64,"end":2483.78},{"id":159,"text":"so it looks better to the human eye.","zh":"因此在人眼看来效果更好。","start":2483.78,"end":2485.3},{"id":160,"text":"And then it becomes easier to query the model","zh":"然后更容易向模型查询","start":2485.4,"end":2488.02},{"id":161,"text":"for a variety of classes just to make sure that it understood those classes.","zh":"各种类别的信息，只是为了确保模型理解了这些类别。","start":2488.02,"end":2491.06},{"id":162,"text":"And so same with flamingos, actually the label flamingo to the model feels like","zh":"实际上，对于火烈鸟，模型对标签火烈鸟的感觉就像","start":2492.7,"end":2499.36}],"notes":["本段讲解了如何通过梯度上升算法对随机输入图像进行优化，以最大化定义的损失函数。该过程涉及前向传播、计算目标函数、反向传播并更新像素值，最终生成可视化结果。","通过Dalmatian的例子，说明模型能够通过反向传播生成图像，揭示模型对特定类别的理解。例如，模型认为Dalmatian是具有黑色斑点的白色背景图像。","在鹅的例子中，模型可能将多个鹅视为一个类别，而不是单个鹅，这表明模型在训练数据中可能更常见的是群体图像，而非单个个体。","通过改变正则化方法，可以改善可视化效果，使图像更符合人类视觉习惯，从而更容易查询模型对不同类别的理解。","模型的可视化方法被称为“类模型可视化”，通过反向传播和正则化技术，可以揭示模型内部对各类别的理解。","课程强调了正则化在模型可视化中的重要性，通过调整正则化方法可以提升图像质量，使模型的决策过程更易于解释。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2320.99,"end":2499.36,"asr_flags":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":2320.99,"text":"So here's what we'll do. We'll define the loss function where we take the pre-softmax score of doc, so the thing right before the softmax, which is only dependent on that specific class, and we might also regularize it to make sure it looks natural. The reason we want the regularization term is because pixels need to be between 0 and 255, roughly. And so you don't want to run an optimization problem where pixels can have values that go all over the place."},{"start":2349.95,"text":"It's just not going to look good to the human eye."},{"start":2353.77,"text":"And so we're going to do that. We're going to run a gradient ascent algorithm, so similar to what we've seen in some of the previous classes, where we're going to update the pixels of an input image, a completely random input image, until we can maximize the loss function we defined. So we forward propagated the random image, we compute the objective, we back propagate all the way back to the pixels, and then we update the pixels to maximize that objective."},{"start":2381.32,"text":"And we do that many times until we end up with something that might look like this. So let's say we take the score of a Dalmatian. You know, here researchers showed, and this is work from Jason Yosinski."},{"start":2403.27,"text":"shows that you can start seeing the model. If you ask the model, what is a Dalmatian, it will tell you it's something with black dots on a white background, roughly. In fact, you might not understand fully what the dog is, but that's what it thinks it is. So we just unpacked it a little bit and queried that. Another interesting one is if you look at..."},{"start":2428.3,"text":"The goose, so here, the top left label goose for the model is many of them."},{"start":2439.14,"text":"What does that mean?"},{"start":2440.12,"text":"It means probably the model has seen a bunch of geese all the time together"},{"start":2444.44,"text":"and has rarely seen a single one."},{"start":2447.32,"text":"And maybe the labeled data was labeling that as goose when it was geese."},{"start":2452.4,"text":"And so the model actually doesn't understand that it's a single one."},{"start":2455.3,"text":"It thinks that all of them are the label."},{"start":2458.74,"text":"Does that make sense?"},{"start":2461.86,"text":"Okay."},{"start":2463.62,"text":"Super."},{"start":2464.18,"text":"So that's called class model visualization."},{"start":2466.02,"text":"You can actually..."},{"start":2466.92,"text":"Oh, sorry."},{"start":2467.42,"text":"I wasn't showing what I was talking about."},{"start":2469.3,"text":"No, I was showing..."},{"start":2472.92,"text":"The way to improve those visualizations"},{"start":2475.7,"text":"is just to change some of the regularization methods."},{"start":2478.16,"text":"So the researchers have shown"},{"start":2479.94,"text":"that you can actually add more color"},{"start":2482.64,"text":"by regularizing better"},{"start":2483.78,"text":"so it looks better to the human eye."},{"start":2485.4,"text":"And then it becomes easier to query the model"},{"start":2488.02,"text":"for a variety of classes just to make sure that it understood those classes."},{"start":2492.7,"text":"And so same with flamingos, actually the label flamingo to the model feels like"}],"speech_gaps":[],"frame":"../frames/v059/015.webp","frame_time":2332.99},{"title":"模型可视化与特征映射分析","segments":[{"id":163,"text":"many flamingos, just something you can observe. Any questions on class model","zh":"很多火烈鸟，只是你可以观察到的东西。关于类模型有任何问题吗？","start":2499.36,"end":2509.26},{"id":164,"text":"visualization? Nothing super new, just another, you know, tool in your kit. It","zh":"可视化？没什么特别的新东西，只是你工具箱里的另一个工具。","start":2509.26,"end":2517.06},{"id":165,"text":"It turns out you can apply the same type of method","zh":"结果发现你可以应用同一种类型的方法","start":2517.06,"end":2520.84},{"id":166,"text":"as class model visualization,","zh":"如同类模型可视化，","start":2520.84,"end":2522.44},{"id":167,"text":"but instead of doing it at the class level,","zh":"但不是在类级别进行，","start":2522.94,"end":2525.46},{"id":168,"text":"you do it in an intermediary action.","zh":"而是在一个中间动作中进行。","start":2526.08,"end":2530.3},{"id":169,"text":"so you could actually do the same exercise sort of what you were saying earlier with the masking of the later layer and just looking inside the network you could pick an activation in the network create an objective function with the regularization and say hey show me the input picture that maximizes this activation and that should tell you what is the input that maximizes activation the most right","zh":"因此，你实际上可以进行类似的练习，就像你之前提到的，通过屏蔽后面的层并查看网络内部，你可以选择网络中的一个激活值，创建一个带有正则化的目标函数，并说：嘿，展示给我一张最大化这个激活值的输入图片，这应该告诉你什么样的输入能够最大化激活值。","start":2531.29,"end":2559.32},{"id":170,"text":"Okay, so that's class model visualization, which can also be applied with gradient ascent anywhere inside the network at any neuron. And that already gives you some sort of a method to look at the neuron level and say, hey, what's the input that maximizes the fake input that theoretically you could generate that maximizes that activation?","zh":"好的，所以这就是类模型可视化，它也可以在神经网络中的任何神经元处应用梯度上升。这已经为你提供了一种方法，可以查看神经元级别，并说：嘿，什么样的输入能够最大化这个理论上的假输入，从而最大化该激活值？","start":2562.38,"end":2582.46},{"id":171,"text":"The next method is actually the most commonly used today because it's so simple and intuitive. It's a data set search. So what you could actually do is to pick a filter. You just pick one filter. You pick its feature map among, you know, I guess you pick one feature map at some point in the network, such as after this max pooling layer.","zh":"接下来的方法实际上是目前最常用的，因为它非常简单直观。这是一种数据集搜索方法。你实际上可以做的是选择一个滤波器。你只需要选择一个滤波器。你选择其特征图，比如在神经网络的某个点，比如在最大池化层之后，选择一个特征图。","start":2585.26,"end":2612.59},{"id":172,"text":"And so let's say you have 256 filters in that convolution layer. So you have 256 feature maps of size five by five. And you find across all your data, your validation set, the top five image that maximize this feature map.","zh":"比如说你在那个卷积层中有256个滤波器。因此你有256个大小为五乘五的特征图。然后你可以在所有数据和验证集上寻找最大化这个特征图的前五张图像。","start":2613.24,"end":2635.9},{"id":173,"text":"so you just track the activations in that feature map you find the highest activation across all your data and you find the top the top five images and you can do that you know again you would say this seems that the filter that produced that feature map has learned to detect shirts because if you find the top five images that activated that feature map the most that filter the most it's all images of shirts","zh":"因此你只需追踪该特征图的激活值，在所有数据中找到最高激活值的前五张图像。你可以这样做，你可以说这似乎表明产生该特征图的滤波器已经学会了检测衬衫，因为如果你找到激活该特征图最多的前五张图像，那么该滤波器最可能检测的是衬衫图像。","start":2639.26,"end":2664.58}],"notes":["本段讲解了模型可视化技术，特别是类模型可视化（class model visualization）和特征映射分析（feature map analysis）。类模型可视化是一种通过梯度上升方法，在网络的任意层或神经元上寻找最大化激活的输入图像的技术。这种方法可以用于理解模型在不同层的特征提取能力。","接下来，讲者介绍了另一种更常用的方法，即数据集搜索（data set search）。该方法通过选择一个特定的滤波器（filter），并找到在验证集上激活该滤波器的前五张图像，从而分析该滤波器学习到的特征。例如，如果某滤波器在图像中检测到衬衫，那么激活该滤波器的图像可能都是衬衫。","讲者强调了特征映射分析的直观性和实用性，通过分析特征图（feature map）的激活情况，可以理解模型在不同层学习到的特征类型。","在特征映射分析中，讲者提到，如果某个滤波器在验证集上激活的图像都是衬衫，那么可以推断该滤波器学习到了检测衬衫的特征。","讲者还提到，特征映射分析可以用于理解模型在不同层的特征提取能力，例如在卷积层之后的特征图（feature map）。","最后，讲者指出，特征映射分析是一种简单且直观的方法，可以用于分析模型在不同层的特征提取能力，从而帮助理解模型的内部机制。"],"formulas":[],"uncertainties":["the fake input that theoretically you could generate that maximizes that activation"],"diagram":"none","start":2499.36,"end":2664.58,"asr_flags":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":2499.36,"text":"many flamingos, just something you can observe. Any questions on class model"},{"start":2509.26,"text":"visualization? Nothing super new, just another, you know, tool in your kit. It"},{"start":2517.06,"text":"It turns out you can apply the same type of method"},{"start":2520.84,"text":"as class model visualization,"},{"start":2522.94,"text":"but instead of doing it at the class level,"},{"start":2526.08,"text":"you do it in an intermediary action."},{"start":2531.29,"text":"so you could actually do the same exercise sort of what you were saying earlier with the masking of the later layer and just looking inside the network you could pick an activation in the network create an objective function with the regularization and say hey show me the input picture that maximizes this activation and that should tell you what is the input that maximizes activation the most right"},{"start":2562.38,"text":"Okay, so that's class model visualization, which can also be applied with gradient ascent anywhere inside the network at any neuron. And that already gives you some sort of a method to look at the neuron level and say, hey, what's the input that maximizes the fake input that theoretically you could generate that maximizes that activation?"},{"start":2585.26,"text":"The next method is actually the most commonly used today because it's so simple and intuitive. It's a data set search. So what you could actually do is to pick a filter. You just pick one filter. You pick its feature map among, you know, I guess you pick one feature map at some point in the network, such as after this max pooling layer."},{"start":2613.24,"text":"And so let's say you have 256 filters in that convolution layer. So you have 256 feature maps of size five by five. And you find across all your data, your validation set, the top five image that maximize this feature map."},{"start":2639.26,"text":"so you just track the activations in that feature map you find the highest activation across all your data and you find the top the top five images and you can do that you know again you would say this seems that the filter that produced that feature map has learned to detect shirts because if you find the top five images that activated that feature map the most that filter the most it's all images of shirts"}],"speech_gaps":[],"frame":"../frames/v059/016.webp","frame_time":2511.36},{"title":"模型内部发生了什么：特征图与激活分析","segments":[{"id":174,"text":"If you were to find something like this, you would say, it seems that the filter has learned to detect edges. And you could do that across every feature map to interpret your filters. Okay, simple data set search that can allow you to interpret if a filter is reacting to something meaningful. So if you look at these pictures that I printed at the bottom of the slide, they're all cropped. So why are they cropped?","zh":"如果你发现类似这样的情况，你会说，似乎这个滤波器已经学会了检测边缘。你可以对每个特征图进行这样的操作，以解释你的滤波器。好的，一个简单的数据集搜索，可以让你判断一个滤波器是否对有意义的内容做出反应。所以如果你看一下我幻灯片底部打印的这些图片，它们都是裁剪过的。那么为什么它们会被裁剪呢？","start":2667.6,"end":2703.8},{"id":175,"text":"They don't look like images from the data set. The image is probably bigger than that, right? The what? So we took the input image, we send it through the conv relu blocks, and then we pick a feature map in the fifth block, let's say. What is this feature map looking at? Is it looking at the whole image or no? Sorry, what is the... So we pick a feature map.","zh":"它们看起来不像数据集中的图像。这张图像可能比这更大，对吧？什么？所以我们取输入图像，将其送入卷积和ReLU块，然后我们在第五个块中选择一个特征图，比如说。这个特征图在看什么？它是在看整个图像还是没有？抱歉，什么……所以我们选择了一个特征图。","start":2707.95,"end":2753.5},{"id":176,"text":"And in that feature map, we find the activation that's the highest. So let's say the activation is the row number five, column number three. If you pick that activation, does it have access to the entire input image or not? So you don't necessarily have access to the entire image. The best way to visualize it is at the first layer. Let's say on the first layer, you take the input image, you take a filter, and you run it through.","zh":"在该特征图中，我们找到激活值最高的位置。比如说，激活值位于第五行第三列。如果你选择这个激活值，它是否能访问整个输入图像呢？所以你不一定能访问整个图像。最好的可视化方式是在第一层。比如说，在第一层，你取输入图像，取一个滤波器，并将其运行通过。","start":2754.04,"end":2801.62},{"id":177,"text":"that activation in the feature map of the first layer is only going to see what the filter sees, right? When you go deeper in the network, do you see more or less on average of the image? A single activation, does it have access to more or less parts of the image? You say more? Yeah, it's more. Let's look at it. So here's a picture, 64 by 64 by three, let's say. We have a conv.","zh":"该特征图中的这个激活值只会看到滤波器所看到的内容，对吧？当你在网络中深入时，你平均看到的图像部分是更多还是更少？一个单一的激活值是否能访问更多或更少的图像部分？你说更多？是的，它更多。让我们来看一下。这里有一张图片，假设是64乘64乘3。我们有一个卷积层。","start":2803.09,"end":2838.88}],"notes":["本段讲解了如何通过特征图和激活值来理解卷积神经网络内部的运作机制。讲者提到，通过在特征图中找到最高激活值，可以确定网络在处理输入图像时关注的区域。同时，讲者指出，随着网络层数的加深，单个激活值能够访问的图像区域会增加，这表明网络在更高层能够捕捉更复杂的特征。","讲者通过一个具体的例子来说明这一现象：假设输入图像为64x64x3的尺寸，经过卷积层处理后，激活值在特征图中只关注滤波器所检测到的区域。随着网络层数的增加，激活值能够访问的图像区域会更多，这表明网络在更高层能够捕捉更全局的特征。","讲者还提到，通过分析特征图和激活值，可以解释网络是否在学习有意义的特征。例如，如果某个特征图的激活值集中在图像的边缘区域，那么可以推测该滤波器可能在学习检测边缘的特征。","此外，讲者指出，特征图的大小和输入图像的大小有关，因此在分析特征图时需要考虑输入图像的尺寸以及网络的结构。例如，如果特征图看起来与数据集中的图像不同，可能是因为输入图像被裁剪过，或者特征图的尺寸较小。","讲者还提到，通过分析特征图和激活值，可以理解网络在处理图像时的注意力机制。例如，如果某个激活值在特征图中集中在某个区域，那么可以推测网络在该区域关注更多的信息。","最后，讲者通过一个具体的例子说明了特征图和激活值的关系：在第一层，激活值只能看到滤波器所检测到的区域，而在更深层，激活值能够访问更多的图像区域，这表明网络在更高层能够捕捉更复杂的特征。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2667.6,"end":2838.88,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":2667.6,"text":"If you were to find something like this, you would say, it seems that the filter has learned to detect edges. And you could do that across every feature map to interpret your filters. Okay, simple data set search that can allow you to interpret if a filter is reacting to something meaningful. So if you look at these pictures that I printed at the bottom of the slide, they're all cropped. So why are they cropped?"},{"start":2707.95,"text":"They don't look like images from the data set. The image is probably bigger than that, right? The what? So we took the input image, we send it through the conv relu blocks, and then we pick a feature map in the fifth block, let's say. What is this feature map looking at? Is it looking at the whole image or no? Sorry, what is the... So we pick a feature map."},{"start":2754.04,"text":"And in that feature map, we find the activation that's the highest. So let's say the activation is the row number five, column number three. If you pick that activation, does it have access to the entire input image or not? So you don't necessarily have access to the entire image. The best way to visualize it is at the first layer. Let's say on the first layer, you take the input image, you take a filter, and you run it through."},{"start":2803.09,"text":"that activation in the feature map of the first layer is only going to see what the filter sees, right? When you go deeper in the network, do you see more or less on average of the image? A single activation, does it have access to more or less parts of the image? You say more? Yeah, it's more. Let's look at it. So here's a picture, 64 by 64 by three, let's say. We have a conv."}],"speech_gaps":[],"frame":"../frames/v059/017.webp","frame_time":2679.6},{"title":"卷积网络的特征映射与反向工程","segments":[{"id":178,"text":"network, five layers, and after five layers, the last comp has 13 filters and leads to a 13 by 13, sorry, it has 256 filters that leads to a 13 by 13 feature maps. If I look at this feature map, let's say that's the most activated, I trace back to the input space, it will have access to this part of the image, let's say.","zh":"网络有五层，经过五层后，最后一个卷积层有13个滤波器，导致13乘13的特征图。抱歉，它实际上有256个滤波器，导致13乘13的特征图。如果我查看这个特征图，假设这是最活跃的，我回溯到输入空间，它将能够访问图像的这一部分，比如说。","start":2839.5,"end":2869.31},{"id":179,"text":"Now, if there was another Convrelu block and I was looking at a feature map,","zh":"现在，如果还有一个ConvReLU块，我正在查看一个特征图，","start":2869.97,"end":2875.57},{"id":180,"text":"it would have even more abstraction of multiple portions of these squares.","zh":"它将对这些正方形的多个部分有更高级别的抽象。","start":2875.77,"end":2879.69},{"id":181,"text":"So it would actually see slightly more from the input image.","zh":"因此，它实际上将从输入图像中看到稍微更多一些的内容。","start":2879.81,"end":2882.77},{"id":182,"text":"Does that make sense?","zh":"这有意义吗？","start":2882.95,"end":2883.47},{"id":183,"text":"So, you know, that's how you would think about it.","zh":"所以，你知道，这就是你思考这个问题的方式。","start":2885.23,"end":2889.21},{"id":184,"text":"And it makes sense because at the end of it, the last output has access to the entire image, right?","zh":"这也有道理，因为在最后的输出中，最后一个输出能够访问整个图像，对吧？","start":2889.31,"end":2894.47},{"id":185,"text":"because all these things are adding up to the prediction.","zh":"因为所有这些内容都加总起来用于预测。","start":2894.47,"end":2900.91},{"id":186,"text":"The deeper the activation, the more it sees from the image,","zh":"激活越深，它从图像中看到的内容就越多，","start":2903.27,"end":2906.59},{"id":187,"text":"and that's why the images were cropped.","zh":"这就是为什么图像被裁剪的原因。","start":2906.67,"end":2908.21},{"id":188,"text":"They were just cropped based on tracing back","zh":"它们只是根据回溯来裁剪的","start":2908.33,"end":2910.79},{"id":189,"text":"what that activation was looking at in the input image,","zh":"该激活在输入图像中关注的内容，","start":2910.79,"end":2913.29},{"id":190,"text":"which you can do very simply computationally.","zh":"这在计算上可以非常简单地实现。","start":2913.49,"end":2916.35},{"id":191,"text":"Okay, so now we're going to look at our last method for convs,","zh":"好的，现在我们将看一下卷积网络的最后一种方法，","start":2919.55,"end":2923.35},{"id":192,"text":"which has to do with reverse engineering, a conv,","zh":"这与反向工程有关，一个卷积，","start":2923.35,"end":2926.45},{"id":193,"text":"and then we move to the frontier models.","zh":"然后我们将转向前沿模型。","start":2926.71,"end":2928.63},{"id":194,"text":"So remember this slide from when we introduced generative adversarial networks, GANs?","zh":"那么还记得我们介绍生成对抗网络（GANs）时的这张幻灯片吗？","start":2930.73,"end":2938.27},{"id":195,"text":"I didn't talk too much about the generator architecture.","zh":"我当时并没有太多谈论生成器的架构。","start":2939.15,"end":2943.17},{"id":196,"text":"I just said it was a neural network,","zh":"我只是说它是一个神经网络，","start":2943.55,"end":2945.17},{"id":197,"text":"but I did mention that something's weird about that network,","zh":"但我确实提到过这个网络有些奇怪的地方，","start":2945.39,"end":2949.51},{"id":198,"text":"which is that the input is way smaller than its output.","zh":"那就是输入远远小于输出。","start":2949.57,"end":2952.61},{"id":199,"text":"The input is a vector z, the output is an image of more dimensions.","zh":"输入是一个向量 z，输出是一个更高维的图像。","start":2953.35,"end":2958.25},{"id":200,"text":"It is very common that such a network needs to upsample and thus would use a deconvolution.","zh":"这样的网络通常需要进行上采样，因此会使用反卷积操作。","start":2959.19,"end":2965.63},{"id":201,"text":"Sometimes in the literature you're going to see dimensions of deconvolutions as an upsampling network.","zh":"在文献中，有时你会看到将反卷积的维度描述为一种上采样网络。","start":2966.47,"end":2973.33},{"id":202,"text":"The input is smaller than the output.","zh":"输入的尺寸小于输出的尺寸。","start":2973.63,"end":2976.69},{"id":203,"text":"Sometimes those are called transposed convolutions, but we're going to talk about them.","zh":"有时这些操作也被称为转置卷积，但我们将要讨论它们。","start":2978.09,"end":2982.05},{"id":204,"text":"Another example where you might run into upsampling is when you have an encoder-decoder type network, such as for segmentation. So let's say you're given an image of a cellular set of cells like this, and then you want to label, segment the pixels that belong to a cell just to find the different cells. Typically, you would use a set of convolutions that reduces the volume in height and width. And then...","zh":"另一个你可能会遇到上采样的例子是在使用编码器-解码器类型的网络时，例如用于分割任务。比如说，你被给定一张包含细胞的图像，然后你想要标记、分割出属于某个细胞的像素，以找到不同的细胞。通常，你会使用一组卷积操作来减少高度和宽度方向上的体积，然后……","start":2984.48,"end":3012.43}],"notes":["本段讲解了卷积网络中特征映射的形成过程，指出随着网络层数的增加，特征映射的尺寸会逐渐减小，而滤波器的数量会增加。例如，在五层网络中，最后一层有256个滤波器，生成13x13的特征图。通过反向追踪，可以确定特征图对应输入图像的特定区域。","教师提到，如果网络中存在另一个卷积-激活块，特征图将包含更多抽象信息，能够捕捉输入图像中多个区域的特征。这表明随着网络深度的增加，模型对输入图像的感知范围也在扩大。","教师指出，网络的最后输出能够访问整个图像，因为所有层的激活共同作用于最终的预测。因此，图像被裁剪是为了确保特征图能够正确映射到输入图像的相应区域。","教师提到，反向追踪特征图的激活区域可以通过简单的计算实现，这为理解模型内部的特征提取过程提供了方法。","教师介绍了反向工程卷积网络的方法，并提到将讨论反向工程的前沿模型。这表明课程内容将从基础卷积网络转向更复杂的模型结构。","教师回顾了生成对抗网络（GANs）的生成器架构，指出输入向量z的维度远小于输出图像的维度，因此需要进行上采样。这种上采样通常通过反卷积（deconvolution）实现，有时也被称为转置卷积（transposed convolutions）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2839.5,"end":3012.43,"asr_flags":[],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":2839.5,"text":"network, five layers, and after five layers, the last comp has 13 filters and leads to a 13 by 13, sorry, it has 256 filters that leads to a 13 by 13 feature maps. If I look at this feature map, let's say that's the most activated, I trace back to the input space, it will have access to this part of the image, let's say."},{"start":2869.97,"text":"Now, if there was another Convrelu block and I was looking at a feature map,"},{"start":2875.77,"text":"it would have even more abstraction of multiple portions of these squares."},{"start":2879.81,"text":"So it would actually see slightly more from the input image."},{"start":2882.95,"text":"Does that make sense?"},{"start":2885.23,"text":"So, you know, that's how you would think about it."},{"start":2889.31,"text":"And it makes sense because at the end of it, the last output has access to the entire image, right?"},{"start":2894.47,"text":"because all these things are adding up to the prediction."},{"start":2903.27,"text":"The deeper the activation, the more it sees from the image,"},{"start":2906.67,"text":"and that's why the images were cropped."},{"start":2908.33,"text":"They were just cropped based on tracing back"},{"start":2910.79,"text":"what that activation was looking at in the input image,"},{"start":2913.49,"text":"which you can do very simply computationally."},{"start":2919.55,"text":"Okay, so now we're going to look at our last method for convs,"},{"start":2923.35,"text":"which has to do with reverse engineering, a conv,"},{"start":2926.71,"text":"and then we move to the frontier models."},{"start":2930.73,"text":"So remember this slide from when we introduced generative adversarial networks, GANs?"},{"start":2939.15,"text":"I didn't talk too much about the generator architecture."},{"start":2943.55,"text":"I just said it was a neural network,"},{"start":2945.39,"text":"but I did mention that something's weird about that network,"},{"start":2949.57,"text":"which is that the input is way smaller than its output."},{"start":2953.35,"text":"The input is a vector z, the output is an image of more dimensions."},{"start":2959.19,"text":"It is very common that such a network needs to upsample and thus would use a deconvolution."},{"start":2966.47,"text":"Sometimes in the literature you're going to see dimensions of deconvolutions as an upsampling network."},{"start":2973.63,"text":"The input is smaller than the output."},{"start":2978.09,"text":"Sometimes those are called transposed convolutions, but we're going to talk about them."},{"start":2984.48,"text":"Another example where you might run into upsampling is when you have an encoder-decoder type network, such as for segmentation. So let's say you're given an image of a cellular set of cells like this, and then you want to label, segment the pixels that belong to a cell just to find the different cells. Typically, you would use a set of convolutions that reduces the volume in height and width. And then..."}],"speech_gaps":[],"frame":"../frames/v059/018.webp","frame_time":2851.5},{"title":"卷积网络与反向工程","segments":[{"id":205,"text":"You get information encoded in a dense format that you will then sample because your output should be of the size of the inputs minus the number of channels. But at least every pixel should have its own class. And so typically that would be a set of convolutions followed by deconvolutions. So you downsample, you upsample. Why am I talking about deconvolutions? Because we're going to try to reverse engineer.","zh":"你会得到一种密集编码的信息，然后你将对其进行采样，因为你的输出应该与输入的尺寸减去通道数相同。但至少每个像素都应该有自己的类别。因此，通常这会是一组卷积层后接反卷积层。你先下采样，再上采样。为什么我要谈论反卷积？因为我们打算尝试反向工程。","start":3012.9,"end":3043.13},{"id":206,"text":"conv networks by adding a module, a deconvolutional module that will take a specific activation and will reverse engineer the trace to verify what was the reason this activation was high. This idea is key, not only for convs, but for any network you think about in the future when you work on it, if you want to actually reverse engineer the reason a specific neuron has been active.","zh":"通过添加一个模块，一个反卷积模块，它将接收一个特定的激活值，并反向工程其轨迹以验证为何该激活值较高。这个想法至关重要，不仅适用于卷积网络，也适用于你未来在研究任何网络时，若想真正反向工程某个特定神经元为何活跃的原因。","start":3045.16,"end":3074.9},{"id":207,"text":"So let's take the example of a 1D convolution. This is the most basic example just for the sake of understanding the math. And I give you an input x which has...","zh":"让我们以一个一维卷积为例。这是为了便于理解数学原理而采用的最基本例子。我给你一个输入 x，它包含……","start":3075.69,"end":3090.05},{"id":208,"text":"some padding with two zeros at the top, two zeros at the bottom, and then X1 through X8 values, and I send that input to a 1D convolution, which has one single filter of size four with a stride of two. What's the size of my output Y? Remember the formula. What? Five, correct. Yes, I assume you did this. This.","zh":"顶部和底部各有两个零的填充，然后是 X1 到 X8 的值，我将这个输入发送到一个一维卷积中，该卷积有一个大小为四的单个滤波器，步长为二。我的输出 Y 的尺寸是多少？记住公式。什么？五，正确。是的，我假设你已经做过这个计算。","start":3091.63,"end":3131.74},{"id":209,"text":"You know, you took the Nx, you applied the formula, and you floored it, you didn't forget to add 1, and then you ended up with 5. Is that it? Yeah. Correct. Super.","zh":"你知道的，你取了 Nx，应用了公式，向下取整，没有忘记加 1，最终得到了 5。这就是全部吗？是的。正确。超级。","start":3135.15,"end":3153.13},{"id":210,"text":"So we have our output of 5, and let's say we define our filter size for W1, W2, W3, W4. It's actually easy to see that the CONV1D can be written as a system of equations where Y1 equals W1 times 0 plus W2 times 0 because of the padding plus W3 times X1 plus W4 times X2, right?","zh":"因此，我们有输出尺寸为 5，假设我们定义了滤波器的尺寸为 W1、W2、W3、W4。实际上很容易看出，一维卷积可以写成一个方程组，其中 Y1 等于 W1 乘以 0 加上 W2 乘以 0（因为有填充）加上 W3 乘以 X1 加上 W4 乘以 X2，对吧？","start":3154.92,"end":3183.66}],"notes":["本段讲解了卷积网络中反向工程的概念，即通过添加反卷积模块来分析特定激活值高的原因。这不仅适用于卷积网络，也适用于未来设计的任何网络。","讲者通过一个1D卷积的例子来说明数学计算过程，包括输入的填充、卷积核的大小和步长，以及输出尺寸的计算。","在计算输出尺寸时，讲者强调了公式中的关键步骤，包括对输入尺寸的处理、填充的影响以及最终结果的计算。","讲者进一步解释了1D卷积的数学表达，展示了如何通过卷积核与输入的乘积来得到输出的每个元素。","整个讲解强调了卷积操作的数学基础，以及如何通过反向工程来理解网络内部的运作机制。","讲者通过具体的例子和公式推导，帮助学生理解卷积网络的结构和计算过程，为后续的反向工程打下基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3012.9,"end":3183.66,"asr_flags":[],"math_clarifications":["公式中的分母应为 stride，但原公式中未明确说明分母为 stride，且未使用数学符号表示，因此无法确定其正确性，需移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3012.9,"text":"You get information encoded in a dense format that you will then sample because your output should be of the size of the inputs minus the number of channels. But at least every pixel should have its own class. And so typically that would be a set of convolutions followed by deconvolutions. So you downsample, you upsample. Why am I talking about deconvolutions? Because we're going to try to reverse engineer."},{"start":3045.16,"text":"conv networks by adding a module, a deconvolutional module that will take a specific activation and will reverse engineer the trace to verify what was the reason this activation was high. This idea is key, not only for convs, but for any network you think about in the future when you work on it, if you want to actually reverse engineer the reason a specific neuron has been active."},{"start":3075.69,"text":"So let's take the example of a 1D convolution. This is the most basic example just for the sake of understanding the math. And I give you an input x which has..."},{"start":3091.63,"text":"some padding with two zeros at the top, two zeros at the bottom, and then X1 through X8 values, and I send that input to a 1D convolution, which has one single filter of size four with a stride of two. What's the size of my output Y? Remember the formula. What? Five, correct. Yes, I assume you did this. This."},{"start":3135.15,"text":"You know, you took the Nx, you applied the formula, and you floored it, you didn't forget to add 1, and then you ended up with 5. Is that it? Yeah. Correct. Super."},{"start":3154.92,"text":"So we have our output of 5, and let's say we define our filter size for W1, W2, W3, W4. It's actually easy to see that the CONV1D can be written as a system of equations where Y1 equals W1 times 0 plus W2 times 0 because of the padding plus W3 times X1 plus W4 times X2, right?"}],"speech_gaps":[],"frame":"../frames/v059/019.webp","frame_time":3024.9},{"title":"卷积层的矩阵表示与逆变换","segments":[{"id":211,"text":"You're just overlaying the filter on top of the first four indices of the inputs, and you're doing a dot product. Same thing with the second one, third one, all the way to the fifth one, and that's your system of equation that describes this conv1d. Now, because it's a system of equation, you could actually write it as a matrix multiplication. So you could say...","zh":"你只是将滤波器叠加在输入的前四个索引上，并进行点积运算。第二个、第三个，一直到第五个都是同样的操作，这就是描述这个conv1d的方程组。现在，因为这是一个方程组，你实际上可以将其写成矩阵乘法的形式。所以你可以这样说……","start":3184.56,"end":3213.65},{"id":212,"text":"The CONV1D is literally just a weight matrix that we multiply by the input. So the input and the output sizes we know, 5, 1, and 12, 1. So the weight matrix is necessarily a 5 by 12 weight matrix. So we just rewrote the CONV1D as a single weight matrix that you multiply by the input to get the output. If you were to...","zh":"CONV1D实际上只是一个我们与输入相乘的权重矩阵。因此，输入和输出的尺寸我们是知道的，分别是5、1和12、1。因此，权重矩阵一定是5乘12的权重矩阵。因此，我们只是将CONV1D重写为一个单一的权重矩阵，通过与输入相乘得到输出。如果你要……","start":3214.11,"end":3244.59},{"id":213,"text":"draw this matrix, this is what it would look like. So it would be a matrix with values all along the diagonal and the rest are zeros. So that's our conclusion. Conv1d can be rewritten as a matrix vector multiplication. Everybody follows? So if you can write it as a matrix multiplication, remember we're talking about reverse engineering, then I could say dconv","zh":"画出这个矩阵，它看起来会是这样的。它会是一个对角线上有值、其余为零的矩阵。这就是我们的结论。Conv1d可以重写为矩阵向量乘法。大家跟上了吗？所以如果你能将其写成矩阵乘法的形式，记住我们是在逆向工程，那么我可以说dconv","start":3245.07,"end":3287.1},{"id":214,"text":"It's possible. It's possible to reverse engineer that. And in fact, I'm going to make a very big assumption that is not always true. Sometimes it's true, but for practical reasons, we're in deep learning, right? It's an engineering field. We're going to assume that W is invertible. And so you can find a matrix H that is equal to the inverse of W, such that X equals HY, so that you're able to reverse engineer.","zh":"这是可能的。事实上，我可以做出一个非常大的假设，这个假设并不总是成立。有时候它是成立的，但出于实际原因，我们在深度学习领域，对吧？这是一个工程领域。我们将假设W是可逆的。因此，你可以找到一个矩阵H，等于W的逆矩阵，使得X等于HY，从而实现逆向工程。","start":3287.98,"end":3316.6},{"id":215,"text":"the signal. I'm going to make a second assumption in the sizes I printed, which is even bigger, is that W is not only invertible, it is also orthogonal, meaning that its inverse is its transpose. It happens that it's sometimes true, and in fact...","zh":"信号。我将在打印的尺寸中做出第二个假设，这个假设甚至更大，即W不仅可逆，而且还是正交的，这意味着它的逆矩阵是它的转置。事实上，这种情况有时是成立的，而且……","start":3317.18,"end":3339.12}],"notes":["本段讲解了如何将一维卷积层（Conv1D）表示为矩阵乘法。通过将卷积操作视为多个滤波器与输入的点积，可以将其转化为一个线性系统，进而用矩阵乘法表示。这种转换有助于理解卷积操作的数学本质，并为反向工程（如反卷积）提供理论基础。","讲者指出，Conv1D可以被表示为一个权重矩阵与输入向量的乘积。输入和输出的尺寸分别为5×1和12×1，因此权重矩阵必须是5×12的。这种矩阵表示方式简化了对卷积操作的理解，并为后续的反向计算提供了可能。","在讨论反向工程时，讲者假设权重矩阵W是可逆的，并进一步假设W是正交矩阵，即其逆矩阵等于其转置。这种假设在实际应用中可能并不总是成立，但为了简化计算和工程实现，通常会做出这样的假设。","讲者强调，这些假设（如W的可逆性和正交性）在实际深度学习中可能并不总是成立，但出于工程实践的需要，通常会采用这些假设来简化计算。这表明在实际应用中，需要权衡理论上的严格性和计算的可行性。","讲者提到，通过将卷积操作表示为矩阵乘法，可以进一步进行反向工程，例如反卷积（dconv）。这表明矩阵表示不仅有助于理解卷积操作，还为模型的逆向操作提供了数学基础。","讲者指出，正交矩阵的假设在某些情况下成立，但并非总是如此。这表明在实际应用中，需要根据具体问题和数据特性来选择是否采用这些假设，以确保模型的准确性和稳定性。"],"formulas":[],"uncertainties":["dconv"],"diagram":"none","start":3184.56,"end":3339.12,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏明确的上下文和数学条件，无法验证其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3184.56,"text":"You're just overlaying the filter on top of the first four indices of the inputs, and you're doing a dot product. Same thing with the second one, third one, all the way to the fifth one, and that's your system of equation that describes this conv1d. Now, because it's a system of equation, you could actually write it as a matrix multiplication. So you could say..."},{"start":3214.11,"text":"The CONV1D is literally just a weight matrix that we multiply by the input. So the input and the output sizes we know, 5, 1, and 12, 1. So the weight matrix is necessarily a 5 by 12 weight matrix. So we just rewrote the CONV1D as a single weight matrix that you multiply by the input to get the output. If you were to..."},{"start":3245.07,"text":"draw this matrix, this is what it would look like. So it would be a matrix with values all along the diagonal and the rest are zeros. So that's our conclusion. Conv1d can be rewritten as a matrix vector multiplication. Everybody follows? So if you can write it as a matrix multiplication, remember we're talking about reverse engineering, then I could say dconv"},{"start":3287.98,"text":"It's possible. It's possible to reverse engineer that. And in fact, I'm going to make a very big assumption that is not always true. Sometimes it's true, but for practical reasons, we're in deep learning, right? It's an engineering field. We're going to assume that W is invertible. And so you can find a matrix H that is equal to the inverse of W, such that X equals HY, so that you're able to reverse engineer."},{"start":3317.18,"text":"the signal. I'm going to make a second assumption in the sizes I printed, which is even bigger, is that W is not only invertible, it is also orthogonal, meaning that its inverse is its transpose. It happens that it's sometimes true, and in fact..."}],"speech_gaps":[],"frame":"../frames/v059/020.webp","frame_time":3196.56},{"title":"卷积与反卷积的数学关系","segments":[{"id":216,"text":"If you think about an edge detector, so let's say our filter is minus one zero zero one, uh zero zero zero one. It's it's an edge detector. Sorry, I have one too many zeros, but it's an edge detector. Um, and it's actually um you know invertible and its inverse is its transpose. Um, and so that simplifies our reverse engineering because we have a conv1d.","zh":"如果你考虑一个边缘检测器，比如说我们的滤波器是-1 0 0 1，嗯，0 0 0 1。它是一个边缘检测器。抱歉，我多了一个零，但它确实是一个边缘检测器。嗯，而且它实际上是可逆的，其逆是它的转置。嗯，因此这简化了我们的逆向工程，因为我们有一个conv1d。","start":3339.45,"end":3366.87},{"id":217,"text":"And we know that we can write it as a matrix vector multiplication, and we can transpose that matrix to reverse it. And maybe it's not always true, but it's true enough for it to work in deep learning, pretty much. You're going to do that so many times, right? That's why in the literature, oftentimes deconvolutions are called transposed convolutions.","zh":"我们知道可以将其写成矩阵向量乘法，然后通过转置该矩阵来反转它。也许这并不总是成立，但足以在深度学习中起作用，基本上。你将会多次进行这样的操作，对吧？这就是为什么在文献中，通常将反卷积称为转置卷积。","start":3367.73,"end":3392.19},{"id":218,"text":"I give you the 1D example, the 2D example is similar, it's just more complicated. There's more math, things mix up, but same idea. Now, there is a trick that makes it simpler to code the deconvolution. And to see that trick, I just drew x equals w transpose y.","zh":"我给你一个1D的例子，2D的例子类似，只是更复杂。有更多数学运算，一些内容会混淆，但核心思想是一样的。现在，有一个技巧可以简化反卷积的编码。为了看到这个技巧，我只画了x等于w转置乘以y。","start":3394.51,"end":3421.28},{"id":219,"text":"So, you have your x, which is a vector of size 12, although there's two padding at the top or at the bottom. And then I transpose the W matrix that I was showing you. And then I multiply that by my vector y of size 5. This is actually...","zh":"所以，你有一个x，它是一个大小为12的向量，虽然顶部或底部有两层填充。然后我转置了我之前展示的W矩阵，并将其乘以一个大小为5的向量y。这实际上是……","start":3422.41,"end":3443.15},{"id":220,"text":"A transpose convolution with stride 2 is equivalent to something slightly different, which is a subpixel convolution of stride 1 half. It's a mathematical trick.","zh":"一个转置卷积，步长为2，等价于一个略有不同的操作，即步长为1半的子像素卷积。这是一个数学技巧。","start":3443.56,"end":3454.44},{"id":221,"text":"You can do it at home, but you would see that these two operations are equivalent, meaning you can actually flip the filter. So you see in the right side, in the left side of the screen, the filters are flipped. So if you look at the first row of my matrix, it's not W1 through W4, it's W4 through W1. So I flipped the filter and I scanned it all the way through the diagonal.","zh":"你可以在家尝试一下，但你会看到这两个操作是等价的，这意味着你可以实际翻转滤波器。所以你看屏幕右侧，左侧的滤波器被翻转了。所以如果你看我的矩阵的第一行，它不是W1到W4，而是W4到W1。因此我翻转了滤波器，并沿着对角线扫描了整个过程。","start":3456.91,"end":3485.57},{"id":222,"text":"I also used another trick, which is my Y vector. I inserted zeros in between the values. It's called subpixel. So I inserted zeros, and I also added some padding. So a couple of tricks, but...","zh":"我还使用了另一个技巧，即我的Y向量。我在值之间插入了零。这被称为子像素。所以我插入了零，并且还添加了一些填充。几个小技巧，但……","start":3487.47,"end":3503.61}],"notes":["本段讲解了卷积和反卷积之间的数学关系，特别是反卷积可以通过转置矩阵实现。讲者提到，当卷积核是可逆的时，其逆矩阵就是其转置矩阵，这简化了反卷积的实现。此外，讲者还提到，反卷积在深度学习中被称作转置卷积，因为其操作方式与普通卷积相反。","讲者通过一个1D的例子说明了转置卷积的实现方式，即通过将卷积核转置后与输入向量相乘。同时，讲者指出，转置卷积与子像素卷积在数学上是等价的，这可以通过插入零值和添加填充来实现。","讲者还提到，转置卷积的实现中，卷积核的顺序会被翻转，例如，原本的W1到W4会被变为W4到W1。这种翻转操作是实现转置卷积的关键步骤之一。","讲者进一步说明了转置卷积的实现中，除了翻转卷积核外，还会在输入向量中插入零值，以模拟子像素卷积的效果。这种技巧使得转置卷积在代码实现上更加简单。","讲者强调，虽然转置卷积在数学上与子像素卷积等价，但它们在实际应用中可能有不同的表现，特别是在处理不同尺寸的输入时。","最后，讲者指出，转置卷积的实现涉及多个技巧，包括卷积核的翻转和输入向量的填充，这些技巧使得转置卷积在深度学习中成为一种重要的操作。"],"formulas":[{"latex":"x = W^T y","symbols":"x 是输入向量，W 是卷积核矩阵，y 是输出向量","explanation":"公式正确，表示转置卷积操作，x 是输入向量，W 是卷积核矩阵，y 是输出向量。","evidence":"I give you the 1D example, the 2D example is similar, it's just more complicated. There's more math, things mix up, but same idea. Now, there is a trick that makes it simpler to code the deconvolution. And to see that trick, I just drew x equals w transpose y."}],"uncertainties":["可能听不清的公式细节，如转置卷积与子像素卷积的具体数学等价关系"],"diagram":"none","start":3339.45,"end":3503.61,"asr_flags":[],"math_clarifications":["公式 x = W^T y 正确表示转置卷积操作，其中 W 是卷积核矩阵，x 是输入向量，y 是输出向量。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3339.45,"text":"if you think about an edge detector so let's say our filter is minus one zero zero one uh zero zero zero one it's it's a it's an edge detector sorry i have one too many zeros but it's an edge detector um and it's actually um you know invertible and its inverse is its transpose um and so that simplifies our reverse engineering because we have a conv1d"},{"start":3367.73,"text":"And we know that we can write it as a matrix vector multiplication, and we can transpose that matrix to reverse it. And maybe it's not always true, but it's true enough for it to work in deep learning, pretty much. You're going to do that so many times, right? That's why in the literature, oftentimes deconvolutions are called transposed convolutions."},{"start":3394.51,"text":"I give you the 1D example, the 2D example is similar, it's just more complicated. There's more math, things mix up, but same idea. Now, there is a trick that makes it simpler to code the deconvolution. And to see that trick, I just drew x equals w transpose y."},{"start":3422.41,"text":"So, you have your x, which is a vector of size 12, although there's two padding at the top or at the bottom. And then I transpose the W matrix that I was showing you. And then I multiply that by my vector y of size 5. This is actually..."},{"start":3443.56,"text":"a transpose convolution with stride 2 is equivalent to something slightly different, which is a subpixel convolution of stride 1 half. It's a mathematical trick."},{"start":3456.91,"text":"You can do it at home, but you would see that these two operations are equivalent, meaning you can actually flip the filter. So you see in the right side, in the left side of the screen, the filters are flipped. So if you look at the first row of my matrix, it's not W1 through W4, it's W4 through W1. So I flipped the filter and I scanned it all the way through the diagonal."},{"start":3487.47,"text":"I also used another trick, which is my Y vector. I inserted zeros in between the values. It's called subpixel. So I inserted zeros, and I also added some padding. So a couple of tricks, but..."}],"speech_gaps":[],"frame":"../frames/v059/021.webp","frame_time":3351.45},{"title":"反卷积与特征图反向重建","segments":[{"id":223,"text":"No need to remember it by heart. If there's anything you can remember, it's that implementing a deconvolution in the subpixel version I was describing is similar to a convolution. But what you do is you create a subpixel version of the inputs by adding zeros in between the values and padding it. You flip the filters and you divide the stripe by two. And that's what a deconvolution is.","zh":"不需要把它背下来。如果你能记住什么，那就是在我描述的子像素版本中实现反卷积类似于卷积。但你所做的就是通过在值之间添加零来创建输入的子像素版本，并进行填充。你翻转滤波器，并将步长除以二。这就是反卷积。","start":3504.23,"end":3531.31},{"id":224,"text":"If you have a convolutional neural network and you want to reverse engineer it, you take the filters, you flip them, you create a subpixel version of the input, you divide the stride by two, and you run the process, you will have reversed that convolution. The reason we're doing that is because we're just rewriting the convolution as another convolution, but the hyperparameters are different. But it's easy to code.","zh":"如果你有一个卷积神经网络，并且想要反向工程它，你取出滤波器，翻转它们，创建输入的子像素版本，将步长除以二，然后运行这个过程，你就能反向这个卷积。我们这样做是因为我们只是将卷积重写为另一个卷积，但超参数是不同的。但这很容易编写代码。","start":3532.11,"end":3561.08},{"id":225,"text":"You're just reusing the same code pretty much. So anyway, let's get back to our example here. We have an image of a dog. We run it through a conv net and we pick at some point in that conv net a feature map. We pick one feature map only among the 256 possible feature maps right here.","zh":"你基本上是在复用相同的代码。总之，让我们回到我们的例子中。我们有一张狗的图片。我们将其输入卷积网络，并在该卷积网络的某个点选择一个特征图。我们只在256个可能的特征图中选择一个。","start":3562.92,"end":3591.13},{"id":226,"text":"And we're going to look at the max activation of that feature map. So we find the max. Let's say it's this one. So row two, column three is the maximum number of that feature map. What does it mean? It means the filter that led to that feature map, when it looked at its input, it was maximal in that location. It's maximally activated in that location. We zero out every other","zh":"我们将查看该特征图的最大激活值。所以我们找到最大值。假设是这个。那么第二行第三列是该特征图的最大值。这意味着导致该特征图的滤波器在查看其输入时，在该位置达到最大值。它在该位置被最大激活。我们零化该矩阵的其他所有条目，","start":3591.76,"end":3620.01},{"id":227,"text":"entries of this matrix, and then we reverse the network. So we max pooled, we unpooled. We reload, we do the reverse. We do a deconv instead of the conv, which is a transposed convolution, sub-pixel version, flip the filter, divide the stride by two. And we do that how many times? Three times, because we had three blocks. And then we should be able to reconstruct","zh":"然后我们反向网络。我们进行最大池化，然后解池化。我们重新加载，进行反向操作。我们使用反卷积而不是卷积，这实际上是转置卷积，子像素版本，翻转滤波器，将步长除以二。我们这样做多少次？三次，因为我们有三个块。然后我们应该能够重建","start":3622.86,"end":3651.23},{"id":228,"text":"what this activation was maximally activated for, and we get the cropped version, as we learned, the cropped part of the image that this activation was looking at, and exactly the pixels that maximize its value. Does that make sense? It's pretty complex, but it's important to know these methods because you might run into something similar in the future or be asked to sort of interpret certain feature maps, certain activation maps, et cetera.","zh":"这个激活函数被什么输入激活得最多，我们得到的是裁剪后的版本，正如我们所学的，这是图像中该激活函数关注的部分，以及精确地最大化其值的像素。这听起来合理吗？这有点复杂，但了解这些方法很重要，因为将来你可能会遇到类似的问题，或者被要求解释某些特征图、某些激活图等等。","start":3652.58,"end":3683.3}],"notes":["本段讲解了反卷积（deconvolution）的实现方式，将其描述为一种类似于卷积的操作，通过在输入值之间插入零、翻转滤波器并除以步长来实现。这表明反卷积是将卷积操作进行逆向处理的一种方法。","在反向工程卷积神经网络时，需要翻转滤波器、创建子像素版本的输入、将步长除以二，并重复该过程。这说明反卷积是将卷积操作重新表述为另一种卷积，但超参数不同。","在示例中，选取了图像中的一张特征图，并找到其最大激活值。这表明最大激活值对应于滤波器在输入图像中某个位置的最强响应。","通过将最大激活值的其他位置设为零，并反向操作网络（如反向池化、反向卷积），可以重建该激活值所关注的图像区域。这说明反向操作可以用于解释特征图的激活区域。","反向操作需要重复三次，因为网络中有三个块。这表明反向过程的次数与网络结构中的块数相关。","最终可以重建该激活值所关注的图像区域，并得到裁剪后的图像部分。这说明反向操作可以用于可视化特征图所关注的图像区域，从而帮助理解模型的内部机制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3504.23,"end":3683.3,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3504.23,"text":"No need to remember it by heart. If there's anything you can remember, it's that implementing a deconvolution in the subpixel version I was describing is similar to a convolution. But what you do is you create a subpixel version of the inputs by adding zeros in between the values and padding it. You flip the filters and you divide the stripe by two. And that's what a deconvolution is."},{"start":3532.11,"text":"If you have a convolutional neural network and you want to reverse engineer it, you take the filters, you flip them, you create a subpixel version of the input, you divide the stride by two, and you run the process, you will have reversed that convolution. The reason we're doing that is because we're just rewriting the convolution as another convolution, but the hyperparameters are different. But it's easy to code."},{"start":3562.92,"text":"You're just reusing the same code pretty much. So anyway, let's get back to our example here. We have an image of a dog. We run it through a conv net and we pick at some point in that conv net a feature map. We pick one feature map only among the 256 possible feature maps right here."},{"start":3591.76,"text":"And we're going to look at the max activation of that feature map. So we find the max. Let's say it's this one. So row two, column three is the maximum number of that feature map. What does it mean? It means the filter that led to that feature map, when it looked at its input, it was maximal in that location. It's maximally activated in that location. We zero out every other"},{"start":3622.86,"text":"entries of this matrix, and then we reverse the network. So we max pooled, we unpooled. We reload, we do the reverse. We do a deconv instead of the conv, which is a transposed convolution, sub-pixel version, flip the filter, divide the stride by two. And we do that how many times? Three times, because we had three blocks. And then we should be able to reconstruct"},{"start":3652.58,"text":"what this activation was maximally activated for, and we get the cropped version, as we learned, the cropped part of the image that this activation was looking at, and exactly the pixels that maximize its value. Does that make sense? It's pretty complex, but it's important to know these methods because you might run into something similar in the future or be asked to sort of interpret certain feature maps, certain activation maps, et cetera."}],"speech_gaps":[],"frame":"../frames/v059/022.webp","frame_time":3516.23},{"title":"反池化与ReLU的可逆性","segments":[{"id":229,"text":"Okay, so some additional details that we'll cover is what is unpool and why do we do some ReLU in there. So very simply, let's say I take the max pooling layer, I max pool this, filter size two by two, stride of two. If you wanted to unpool this, how would you do it? Or pooling layers, max pooling layers, invertible.","zh":"好的，那么我们还将讨论一些额外的细节，即什么是反池化以及为什么在其中使用ReLU。非常简单地说，假设我取一个最大池化层，我对其进行最大池化，滤波器大小为2x2，步长为2。如果你想反池化这个操作，你会怎么做？或者，池化层、最大池化层是否可逆。","start":3685.39,"end":3722.69},{"id":230,"text":"No. Why? Yeah. Yeah, exactly. It's not invertible because if you pick, you're right, the sixth here on the top left, you can tell that the sixth was in one of these four, but you don't know where it was. You can't invert. And it's very important to know where it was, right? So it's not invertible, but you could actually use a trick to make it invertible, which is passing what we call switches.","zh":"不。为什么？是的。是的，没错。它不可逆，因为如果你选择，你没错，这里的第六个在左上角，你可以知道第六个是在这四个中的一个，但你不知道它来自哪里。你无法反推。知道它来自哪里是非常重要的，对吧？所以它不可逆，但你实际上可以使用一个技巧来使其可逆，这就是传递我们所说的开关。","start":3726.66,"end":3764.67},{"id":231,"text":"So during the forward propagation, you look at all your pooling, your max pooling, and you remember with the binary matrix, a very lightweight matrix, where the pooling happened, where the max pooling happened. And then when you're doing the unpooling, you remember those switches, so you keep them in memory, and you pass them back, and that should tell you where the value came from. So that's what we mean by unpooling.","zh":"因此，在前向传播过程中，你会查看所有的池化操作，最大池化操作，并用一个二进制矩阵，一个非常轻量级的矩阵，记录池化发生的位置，最大池化发生的位置。然后在进行反池化时，你会记住这些开关，将它们保留在内存中，并传递回去，这样就能告诉你值是从哪里来的。这就是我们所说的反池化。","start":3765.45,"end":3790.46},{"id":232,"text":"Okay, so I go back to my previous map. The only thing I need to change to be able to reverse engineer my network is to pass the switches and the filters, by the way, because the decom is just the flip version of the filter with subpixel and stride divided by two. And so I do that. You can see you can literally invert your network here and trace back from one activation to the input space.","zh":"好的，我回到我之前的地图。唯一需要改变以能够反向推导我的网络的是传递开关和滤波器，顺便说一句，因为分解只是滤波器的翻转版本，带有亚像素和步长除以二。因此我这样做。你可以看到，你可以在这里实际反转你的网络，并从一个激活值追溯回输入空间。","start":3791.37,"end":3816.66},{"id":233,"text":"And then for relu is a little odd. I'm not going to spend too much time on it because it's more empirical than nothing. But relu forward is essentially zeroing out every value that is negative during the forward path. Technically, a relu backward is impossible unless you have also the switches. If you have the switches, you could actually, you know, pass linearly back whatever was kept because it's the identity function.","zh":"然后对于ReLU来说有点奇怪。我不会花太多时间在它上面，因为它更多的是经验性的。但ReLU的前向操作本质上是在前向路径中将所有负值设为零。从技术上讲，ReLU的反向操作是不可能的，除非你也有开关。如果你有开关，你实际上可以传递回被保留的值，因为它是恒等函数。","start":3817.9,"end":3845.74}],"notes":["本段讲解了反池化（unpooling）的可逆性问题。池化层（如最大池化）在进行下采样时会丢失位置信息，因此无法直接反向操作。为了实现反池化，需要记录池化过程中哪些位置被选中，即所谓的‘开关’（switches）。这些信息在反向传播时被用来恢复原始位置信息，从而实现反池化。","在反池化过程中，需要将这些开关信息与滤波器（filter）一起传递，以便在反向操作时能够正确地恢复原始特征图。反池化操作实际上是将滤波器进行翻转，并结合子像素和步长信息，从而实现对原始特征图的重建。","对于ReLU激活函数，其前向传播会将负值置零，而反向传播则需要依赖开关信息来恢复梯度。如果没有开关信息，ReLU的反向传播是不可行的，因为无法确定哪些输入值被保留下来。","开关信息在反池化和ReLU的反向传播中都起着关键作用，它们允许模型在反向操作时恢复丢失的位置信息或梯度信息，从而实现网络的可逆性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3685.39,"end":3845.74,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3685.39,"text":"Okay, so some additional details that we'll cover is what is unpool and why do we do some ReLU in there. So very simply, let's say I take the max pooling layer, I max pool this, filter size two by two, stride of two. If you wanted to unpool this, how would you do it? Or pooling layers, max pooling layers, invertible."},{"start":3726.66,"text":"No. Why? Yeah. Yeah, exactly. It's not invertible because if you pick, you're right, the sixth here on the top left, you can tell that the sixth was in one of these four, but you don't know where it was. You can't invert. And it's very important to know where it was, right? So it's not invertible, but you could actually use a trick to make it invertible, which is passing what we call switches."},{"start":3765.45,"text":"So during the forward propagation, you look at all your pooling, your max pooling, and you remember with the binary matrix, a very lightweight matrix, where the pooling happened, where the max pooling happened. And then when you're doing the unpooling, you remember those switches, so you keep them in memory, and you pass them back, and that should tell you where the value came from. So that's what we mean by unpooling."},{"start":3791.37,"text":"Okay, so I go back to my previous map. The only thing I need to change to be able to reverse engineer my network is to pass the switches and the filters, by the way, because the decom is just the flip version of the filter with subpixel and stride divided by two. And so I do that. You can see you can literally invert your network here and trace back from one activation to the input space."},{"start":3817.9,"text":"And then for relu is a little odd. I'm not going to spend too much time on it because it's more empirical than nothing. But relu forward is essentially zeroing out every value that is negative during the forward path. Technically, a relu backward is impossible unless you have also the switches. If you have the switches, you could actually, you know, pass linearly back whatever was kept because it's the identity function."}],"speech_gaps":[],"frame":"../frames/v059/023.webp","frame_time":3697.39},{"title":"模型内部的激活与可视化","segments":[{"id":234,"text":"But actually, that would kill your positive signal coming back. So instead, you just reuse ReLU. Basically, you reuse a ReLU because you want to start from the activation that is the highest on your feature map and to keep passing the positive signal back to the input space. Don't worry too much about it. It's just that ReLU is just passed as a ReLU during the reconstruction process, not as a proper ReLU backward.","zh":"但实际上，这会杀死你从输出返回的正信号。因此，你只需重新使用ReLU。基本上，你重新使用ReLU是因为你想从特征图中激活最高的位置开始，并继续将正信号传递回输入空间。不要太担心这个问题。只是在重建过程中，ReLU被当作ReLU传递，而不是作为真正的ReLU反向传递。","start":3847.21,"end":3874.14},{"id":235,"text":"Okay, so here we go. We send our dog through the network. We look at a specific max pool output. We take the feature map. We find the activation that is the highest in that feature map. We zero out all the rest. We reverse engineer our network. We find the cropped part of this dog with the pixels that led to that specific feature map shining. We are interpreting the filter.","zh":"好的，我们开始吧。我们将狗送入网络中。我们观察一个特定的池化输出。我们获取特征图。我们找到该特征图中激活最高的位置。我们将其余部分置零。我们逆向工程网络。我们找到导致该特定特征图激活的狗的裁剪部分的像素。我们正在解释滤波器。","start":3876.01,"end":3901.67},{"id":236,"text":"that led that feature map. And you can do that anywhere across, um, across the network. But of course, if you're earlier, the crop is going to be even smaller. If you're later, generally bigger. Okay? So you learned dconvs.","zh":"导致该特征图的激活。你可以在网络的任何位置进行这样的操作。当然，如果你在更早的层，裁剪的区域会更小。如果你在更后面的层，通常会更大。明白了吗？所以你学习了转置卷积（dconvs）。","start":3902.12,"end":3923.45},{"id":237,"text":"Now let's look at some practical visualizations from Matthew Zahler and Rob Fergus. These are great researchers in the space of visualizations. They've been making so much progress. So they trained the network. They looked at results on a validation set of 50,000 images.","zh":"现在让我们看看Matthew Zahler和Rob Fergus的一些实际可视化结果。他们是可视化领域的杰出研究者，取得了许多进展。他们训练了网络，并在包含50,000张图像的验证集上查看结果。","start":3924.73,"end":3948.31},{"id":238,"text":"So what you're seeing is the first layer and specifically the patches. What the patches are, they're the top nine strongest activation per filter. So for each filter in the first layer, they look at the top nine strongest activation and they remember the data points that was leading to that. So that's the data set search method that we saw together.","zh":"你所看到的是第一层，特别是各个块（patches）。这些块指的是每个滤波器的最强九个激活。对于第一层中的每个滤波器，他们查看最强的九个激活，并记住导致这些激活的数据点。这就是我们之前一起看到的数据集搜索方法。","start":3950.82,"end":3976.41},{"id":239,"text":"What are the nine images that led to that maximum, that feature map activating the most? Print them. Those are the patches for each filter. If you do that, you can already interpret some of the filters by seeing that, oh, this one reacts to edges that are diagonal, or this one reacts to edges that are straight, for example.","zh":"导致最大激活的九张图像是什么？打印出来。这些就是每个滤波器的块。如果你这样做，你就可以通过观察到，例如，这个滤波器对对角线边缘有反应，或者那个滤波器对直线边缘有反应，来解释一些滤波器。","start":3976.97,"end":4004.33}],"notes":["本段讲解了在神经网络中如何通过反向传播和ReLU激活函数来保留正向信号。讲者指出，直接使用ReLU可能会导致信号丢失，因此需要在反向传播过程中重新使用ReLU，以确保从特征图中最高激活值开始传递信号。","讲者通过一个具体的例子，说明如何通过反向工程来解释网络中的滤波器。具体来说，他们从最大池化输出中找到特征图中的最高激活值，然后裁剪出导致该特征图激活的图像部分，从而解释滤波器的功能。","讲者提到，这种反向工程方法可以在网络的任何位置进行，但越早的层裁剪的图像越小，越晚的层裁剪的图像越大。这说明了不同层在特征提取中的不同作用。","讲者介绍了Matthew Zahler和Rob Fergus在可视化方面的研究成果，他们通过训练网络并在验证集上评估结果，展示了第一层的激活情况。","讲者进一步解释了第一层的“patches”概念，即每个滤波器的最强激活值对应的九张图像。这些图像反映了滤波器对特定特征（如边缘）的响应。","最后，讲者指出，通过观察这些图像，可以解释滤波器的功能，例如某些滤波器对对角线边缘敏感，而另一些则对直线边缘敏感。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3847.21,"end":4004.33,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3847.21,"text":"But actually, that would kill your positive signal coming back. So instead, you just reuse ReLU. Basically, you reuse a ReLU because you want to start from the activation that is the highest on your feature map and to keep passing the positive signal back to the input space. Don't worry too much about it. It's just that ReLU is just passed as a ReLU during the reconstruction process, not as a proper ReLU backward."},{"start":3876.01,"text":"Okay, so here we go. We send our dog through the network. We look at a specific max pool output. We take the feature map. We find the activation that is the highest in that feature map. We zero out all the rest. We reverse engineer our network. We find the cropped part of this dog with the pixels that led to that specific feature map shining. We are interpreting the filter."},{"start":3902.12,"text":"that led that feature map. And you can do that anywhere across, um, across the network. But of course, if you're earlier, the crop is going to be even smaller. If you're later, generally bigger. Okay? So you learned dconvs."},{"start":3924.73,"text":"Now let's look at some practical visualizations from Matthew Zahler and Rob Fergus. These are great researchers in the space of visualizations. They've been making so much progress. So they trained the network. They looked at results on a validation set of 50,000 images."},{"start":3950.82,"text":"So what you're seeing is the first layer and specifically the patches. What the patches are, they're the top nine strongest activation per filter. So for each filter in the first layer, they look at the top nine strongest activation and they remember the data points that was leading to that. So that's the data set search method that we saw together."},{"start":3976.97,"text":"What are the nine images that led to that maximum, that feature map activating the most? Print them. Those are the patches for each filter. If you do that, you can already interpret some of the filters by seeing that, oh, this one reacts to edges that are diagonal, or this one reacts to edges that are straight, for example."}],"speech_gaps":[],"frame":"../frames/v059/024.webp","frame_time":3859.21},{"title":"模型内部发生了什么","segments":[{"id":240,"text":"On the bottom right, we actually print the filters raw. And of course, because it's the first layer, it is interpretable. So if in fact you have an edge detector, you should see when you print that matrix that it looks like an edge detector. That doesn't work for layers beyond one. So now let's go a little deeper. Now we're going layer two, and we're looking at the decoms. So what are they doing? They're essentially...","zh":"在右下角，我们实际上打印的是原始的滤波器。当然，因为这是第一层，它是可解释的。所以如果你确实有一个边缘检测器，当你打印这个矩阵时，你应该会看到它看起来像一个边缘检测器。这种方法在超过第一层的层中就不起作用了。现在让我们深入一点。我们现在进入第二层，并查看这些解码器。它们在做什么？它们基本上……","start":4005.13,"end":4034.51},{"id":241,"text":"They're essentially looking at the top one strongest activation per feature in the second layer. So the second layer has 256 feature maps. They're presented here. You pick one feature map. You look across all these 50,000 validation images. You find the maximum.","zh":"它们基本上是在查看第二层中每个特征的最强激活。第二层有256个特征图。它们在这里展示出来。你选择一个特征图，然后在所有这些50,000张验证图像上进行查找，找到最大值。","start":4036.01,"end":4057.97},{"id":242,"text":"feature map, you take the specific portion of that feature map, the specific entry that's maximally activated, you zero out the rest.","zh":"对于这个特征图，你取该特征图中特定的部分，即被最大激活的特定条目，然后将其余部分置零。","start":4058.79,"end":4066.71},{"id":243,"text":"You do your deconv, you pass the switches, blah, blah, blah, and you get the cropped part of the image that represents why it was activated. And this is printed all over here. And you can see, you can start interpreting that by doing the top one, or you can do the top nine. And if you actually do the top nine, you would start seeing that, in fact, certain filters have very clear purposes. Some filters detect circles. Some filters detect odd shapes.","zh":"你进行反卷积，通过开关，等等，然后得到代表为何被激活的图像裁剪部分。这部分被打印在这里。你可以通过查看最强的顶部一个来开始解释，或者查看最强的九个。如果你实际上查看最强的九个，你就会开始看到某些滤波器有非常明确的目的。一些滤波器检测圆形，一些滤波器检测奇形怪状的形状。","start":4067.45,"end":4096.53},{"id":244,"text":"If you keep doing that in layer three, you would start seeing with the deconv method that the filters are capturing more complex information. Remember in the first lecture we did together, I said that the deeper you go in the network, the more the information adds up and you get more complex features later. This is a proof of that, pretty much.","zh":"如果你继续在第三层这样做，通过反卷积方法，你会开始看到滤波器捕捉更复杂的信息。记得在我们共同的第一讲中，我说过，网络越深，信息越加总，你之后会得到更复杂的特征。这基本上就是这个结论的证明。","start":4100.76,"end":4124.07},{"id":245,"text":"Now, if you go to layer three and you can do all of it.","zh":"现在，如果你进入第三层，你可以完成所有这些操作。","start":4126.26,"end":4130.98},{"id":246,"text":"You can do the top nine patches where if the nine patches look very similar,","zh":"你可以查看最强的九个块，如果这九个块看起来非常相似，","start":4131.02,"end":4135.54},{"id":247,"text":"you know, you can probably safely say that this filter was responsible for this type of shape or color or, you know, salient feature.","zh":"你就可以安全地认为这个滤波器负责这种形状或颜色，或者某种显著的特征。","start":4136.08,"end":4148.06},{"id":248,"text":"And then you can do the deconv as well, essentially.","zh":"然后你也可以进行反卷积操作，基本上如此。","start":4148.84,"end":4152.56},{"id":249,"text":"essentially. Let's watch together a very short video of Jason Yosinski that shows a little bit","zh":"基本上。让我们一起观看一段简短的视频，这段视频由Jason Yosinski制作，展示了我们共同学到的几乎所有内容。","start":4152.56,"end":4160.08},{"id":250,"text":"of everything we've learned together. They can recognize school buses and zebras and can tell","zh":"他们能够识别校车和斑马，并且能够区分马尔他犬和约克夏犬。","start":4160.08,"end":4164.54},{"id":251,"text":"the difference between Maltese terriers and Yorkshire terriers. We now know what it takes","zh":"我们现在知道如何有效地训练这些神经网络，但对我们来说，仍然不太清楚它们是如何实际计算出最终答案的。","start":4164.54,"end":4169.2},{"id":252,"text":"to train these neural networks well, but we don't know so much about how they're actually computing","zh":"我们开发了这个交互式的深度可视化工具箱，以揭示这些黑箱内部的运作情况，展示神经网络内部发生了什么。","start":4169.2,"end":4173.18},{"id":253,"text":"their final answers. We developed this interactive deep visualization toolbox to shine light into","zh":"在左上角，我们展示了","start":4173.18,"end":4178.72},{"id":254,"text":"these black boxes, showing what happens inside of neural nets. In the top left corner, we show the","zh":"这些黑箱，展示神经网络内部发生了什么。在左上角，我们展示了","start":4178.72,"end":4184.2}],"notes":["本段讲解了如何通过反卷积方法可视化神经网络中各层的特征图。在第二层，通过选择每个特征图中激活最强的区域，并将其余部分置零，可以反卷积出对应的图像部分，从而理解该特征图的作用。","在第三层，通过反卷积方法可以观察到更复杂的特征，这证明了随着网络深度的增加，特征会逐渐变得复杂。这与第一讲中提到的网络越深，特征越复杂是一致的。","通过反卷积方法，可以识别出某些滤波器负责检测特定的形状或颜色，例如圆形或奇形。这表明神经网络能够学习到具有明确功能的特征。","通过展示视频，可以进一步理解神经网络如何识别不同物体，如校车和斑马，以及如何区分不同品种的狗。这说明了神经网络在训练后能够进行复杂的分类任务。","开发了一个交互式的深度可视化工具箱，用于揭示神经网络内部的黑箱操作，展示网络内部的处理过程。","在左上角展示了工具箱的界面，这有助于理解神经网络内部的处理流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4005.13,"end":4184.2,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":4005.13,"text":"On the bottom right, we actually print the filters raw. And of course, because it's the first layer, it is interpretable. So if in fact you have an edge detector, you should see when you print that matrix that it looks like an edge detector. That doesn't work for layers beyond one. So now let's go a little deeper. Now we're going layer two, and we're looking at the decoms. So what are they doing? They're essentially..."},{"start":4036.01,"text":"They're essentially looking at the top one strongest activation per feature in the second layer. So the second layer has 256 feature maps. They're presented here. You pick one feature map. You look across all these 50,000 validation images. You find the maximum."},{"start":4058.79,"text":"feature map, you take the specific portion of that feature map, the specific entry that's maximally activated, you zero out the rest."},{"start":4067.45,"text":"You do your deconv, you pass the switches, blah, blah, blah, and you get the cropped part of the image that represents why it was activated. And this is printed all over here. And you can see, you can start interpreting that by doing the top one, or you can do the top nine. And if you actually do the top nine, you would start seeing that, in fact, certain filters have very clear purposes. Some filters detect circles. Some filters detect odd shapes."},{"start":4100.76,"text":"If you keep doing that in layer three, you would start seeing with the deconv method that the filters are capturing more complex information. Remember in the first lecture we did together, I said that the deeper you go in the network, the more the information adds up and you get more complex features later. This is a proof of that, pretty much."},{"start":4126.26,"text":"Now,
