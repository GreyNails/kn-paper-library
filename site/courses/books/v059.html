<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯坦福CS230：模型内部发生了什么</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：模型内部发生了什么 · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v059","title":"斯坦福CS230：模型内部发生了什么","course":"深度学习","pages":[{"title":"模型内部发生了什么","segments":[{"id":0,"text":"Welcome to lecture 9 already. I hope everybody had a good fall break. Today we're going to talk about neural networks, both convolutional neural networks and transformers, and we're going to unpack it to see what's going on inside."},{"id":1,"text":"This lecture used to be called Neural Network Interpretability, but I've broadened the scope because there is a section now where we talk more about frontier models."},{"id":2,"text":"and the interpretability or visualization methods have not quite been figured out for most models that you play with out there. So think about this one as research areas, what we know from convolutions and what we're trying to figure out for frontier models."},{"id":3,"text":"We're going to start with a very packed agenda with a case study where I'm going to ask you a question and let you brainstorm a little bit altogether on how you would."},{"id":4,"text":"try to understand what's happening inside of a frontier model. In the second section, we're going to look at the example of convolutions specifically and try to interpret everything possible about a convolution, meaning we're going to look at"},{"id":5,"text":"However, they are going to bring you the skills that will allow you to understand the methods for frontier models as researchers are trying to figure them out. The second half of the lecture is going to focus more on the modern representation analysis. We're going to talk about scaling laws."},{"id":6,"text":"you might see frontier labs used for today's language or vision large models. However, they are going to bring you the skills that will allow you to understand the methods for frontier models as researchers are trying to figure them out. The second half of the lecture is going to focus more on the modern representation analysis. We're going to talk about scaling laws."},{"id":7,"text":"Capability benchmarking, data diagnostics, and then I end on a few closing remarks. Okay, are we ready for this one? Lots of visualizations in this lecture. So first question for you all. Let's say the case study is you are a model trainer and you're working on 200 billion parameters."}],"notes":["本段介绍了课程的结构和目标，强调了对前沿模型内部机制的理解。课程将从卷积神经网络的案例研究开始，分析输入输出关系、特定神经元和特征图的作用，并介绍相关方法。这些方法虽然适用于卷积网络，但不适用于当前的前沿模型，但它们能帮助理解前沿模型的方法。","接下来的课程内容将聚焦于现代表示分析，包括扩展定律（scaling laws）、能力基准测试（capability benchmarking）和数据诊断（data diagnostics）。这些内容旨在帮助学生理解模型的扩展性和性能评估。","课程还提到，尽管目前对前沿模型的可解释性方法尚未完全明确，但通过学习卷积网络的分析方法，学生可以掌握理解前沿模型的技能。这为后续研究前沿模型的内部机制打下基础。","课程强调了可视化在理解模型内部机制中的重要性，并通过案例研究引导学生思考如何理解大规模模型的内部运作。这有助于学生在实际研究中应用这些方法。","课程还提到，尽管当前的前沿模型可能使用不同的方法，但掌握基础分析技能对于理解这些模型至关重要。这为学生后续研究前沿模型提供了理论和实践基础。","最后，课程以提问的方式引导学生思考如何理解大规模模型的内部机制，这有助于激发学生的主动思考和探索精神。"],"formulas":[],"uncertainties":[],"diagram":"none","start":0.82,"end":160.94,"asr_flags":[],"raw_segments":[{"start":0.82,"text":"Welcome to lecture 9 already. I hope everybody had a good fall break. Today we're going to talk about neural networks, both convolutional neural networks and transformers, and we're going to unpack it to see what's going on inside."},{"start":22.64,"text":"This lecture used to be called Neural Network Interpretability, but I've broadened the scope because there is a section now where we talk more about frontier models."},{"start":35.14,"text":"and the interpretability or visualization methods have not quite been figured out for most models that you play with out there. So think about this one as research areas, what we know from convolutions and what we're trying to figure out for frontier models."},{"start":53.25,"text":"We're going to start with a very packed agenda with a case study where I'm going to ask you a question and let you brainstorm a little bit altogether on how you would."},{"start":67.74,"text":"try to understand what's happening inside of a frontier model. In the second section, we're going to look at the example of convolutions specifically and try to interpret everything possible about a convolution, meaning we're going to look at"},{"start":86.94,"text":"input-output relationship. We're going to look at a specific neuron inside and try to interpret it. We're going to look also at specific feature maps and try to understand what they do. I will present many methods to do that. Those methods are real and they've been used for convolutions. But again, they're not the methods that..."},{"start":107.66,"text":"you might see frontier labs used for today's language or vision large models. However, they are going to bring you the skills that will allow you to understand the methods for frontier models as researchers are trying to figure them out. The second half of the lecture is going to focus more on the modern representation analysis. We're going to talk about scaling laws."},{"start":134.72,"text":"Capability benchmarking, data diagnostics, and then I end on a few closing remarks. Okay, are we ready for this one? Lots of visualizations in this lecture. So first question for you all. Let's say the case study is you are a model trainer and you're working on 200 billion parameters."}],"speech_gaps":[],"frame":"../frames/v059/001.webp","frame_time":12.82},{"title":"模型训练中的异常检测与分析","segments":[{"id":8,"text":"model at a frontier lab. And overnight, you know, a new checkpoint passes a training sanity check, but a few issues arise. Things like, you know, model is getting worse on reasoning benchmarks. Some safety evals are failing."},{"id":9,"text":"And there is a weird spike in, let's say, latency for tool use when you actually use this model for an agentic workflow. Your VP is wondering what's happening and they ask, what is going on? And what are you going to look at first? So what I want you to discuss for a minute or so, think about it first and I'll open up, is what are the type of evidences that you would look?"},{"id":10,"text":"Want to inspect before even touching the code or retraining the model. What are the things that you want to look at? Jump in. There's no single answer, so I want to know everything you're going to look at."},{"id":11,"text":"Okay, so error analysis. So look at, you said, I will look at the reasoning benchmarks and find the examples where the model is failing. Specifically, try to find patterns in order to pinpoint what the issue might be. And then same thing on the safety evals where you want to see what type of safety issues are arising. Is it everywhere? Is it specific to something? Yeah, I agree. Error analysis in general. What else?"},{"id":12,"text":"Remember, you're the model trainer, so you're training this model. You're supposed to be watching certain things when you're training. What can be interesting? Yeah, let's say, not necessarily passing, but those are great examples. So you're mentioning, yeah, as you're the model trainer, you would be watching the training loss. And you want to see, what are you going to look for in that training loss? Okay, conversions. You probably want to make sure that it's smooth. You don't want big spikes."}],"notes":["本段讨论了模型训练过程中需要关注的关键指标，特别是训练损失的变化趋势。模型训练者应持续监控训练损失，确保其平稳变化，避免出现大的波动。这有助于及时发现模型训练中的潜在问题，如过拟合或训练不稳定。","在训练过程中，模型训练者应关注训练损失的平滑性，避免出现大的波动。这可能表明模型在学习过程中遇到了困难，或者训练数据中存在噪声或异常值。","模型训练者应通过分析训练损失的变化趋势，来判断模型是否正常学习。如果训练损失出现大的波动，可能意味着模型在某些数据点上表现不佳，或者训练过程中的超参数设置存在问题。","除了训练损失，模型训练者还应关注其他指标，如验证损失、准确率等，以全面评估模型的性能。这些指标的变化趋势可以帮助模型训练者更好地理解模型的学习过程。","在模型训练过程中，模型训练者应保持对训练过程的持续监控，以便及时发现并解决潜在问题。这包括对训练损失、验证损失、准确率等指标的定期检查。","模型训练者应通过分析训练损失的变化趋势，来判断模型是否正常学习。如果训练损失出现大的波动，可能意味着模型在某些数据点上表现不佳，或者训练过程中的超参数设置存在问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":161.86,"end":311.69,"asr_flags":[],"raw_segments":[{"start":161.86,"text":"model at a frontier lab. And overnight, you know, a new checkpoint passes a training sanity check, but a few issues arise. Things like, you know, model is getting worse on reasoning benchmarks. Some safety evals are failing."},{"start":182.46,"text":"And there is a weird spike in, let's say, latency for tool use when you actually use this model for an agentic workflow. Your VP is wondering what's happening and they ask, what is going on? And what are you going to look at first? So what I want you to discuss for a minute or so, think about it first and I'll open up, is what are the type of evidences that you would look?"},{"start":209.17,"text":"Want to inspect before even touching the code or retraining the model. What are the things that you want to look at? Jump in. There's no single answer, so I want to know everything you're going to look at."},{"start":226.62,"text":"Okay, so error analysis. So look at, you said, I will look at the reasoning benchmarks and find the examples where the model is failing. Specifically, try to find patterns in order to pinpoint what the issue might be. And then same thing on the safety evals where you want to see what type of safety issues are arising. Is it everywhere? Is it specific to something? Yeah, I agree. Error analysis in general. What else?"},{"start":268.97,"text":"Remember, you're the model trainer, so you're training this model. You're supposed to be watching certain things when you're training. What can be interesting? Yeah, let's say, not necessarily passing, but those are great examples. So you're mentioning, yeah, as you're the model trainer, you would be watching the training loss. And you want to see, what are you going to look for in that training loss? Okay, conversions. You probably want to make sure that it's smooth. You don't want big spikes."}],"speech_gaps":[],"frame":"../frames/v059/002.webp","frame_time":173.86},{"title":"模型训练过程中的验证损失与问题排查","segments":[{"id":13,"text":"How about the validation loss? What is your expectation on the validation loss? Yeah, should probably follow the same curve as the training loss, but is likely slightly higher, because you're probably performing slightly less well on the validation set than on the training set. If you're seeing spikes, it might mean there are some issues. What else are you looking at? Yeah. So this batch, you mean?"},{"id":14,"text":"Yeah, so you're looking at this round of training data. Maybe the last round of data that we trained on, there were some issues in that data. Maybe that data was probably poisoned or biased toward a certain category of data that we're failing on. You're totally right."},{"id":15,"text":"Maybe that specific checkpoint is doing poorly compared to the previous checkpoint, and so you pinpoint where the issue arises during the training. What else are you looking at? Yeah. Okay. Because it's overnight and it seemed everything was good up to yesterday and now there's an issue, maybe you're saying there's a hardware issue. Yeah, we could check actually. Yeah, latency has been pointed out, so maybe the hardware has failed. Yeah, you're right."},{"id":16,"text":"What else? So a lot of the answers are global answers. You're looking at the model in general. You're not looking at specific portions of the model. What would you look at if you were to inspect the model more precisely from the inside? And this one's a language model, so you can think about the fact that it's a language model. Yeah, you're right. You want to look at different checkpoints."}],"notes":["本段讨论了模型训练过程中验证损失的预期表现，指出验证损失通常会比训练损失稍高，因为模型在验证集上的表现通常不如训练集。同时，提到如果验证损失出现异常波动，可能意味着数据存在问题，如数据被污染或存在偏差。","讲者进一步指出，如果某个特定的检查点（checkpoint）表现不佳，可能需要定位问题出现在训练过程的哪个阶段。此外，还提到如果问题是在夜间突然出现，可能需要考虑硬件故障的可能性，如延迟增加。","最后，讲者强调，虽然很多回答是全局性的，但若要更精确地检查模型内部，应关注具体的检查点，并指出对于语言模型，应考虑其作为语言模型的特性。","讲者还提到，如果问题出现在模型的特定部分，应检查该部分的训练数据和模型参数，以确定问题的根源。"],"formulas":[],"uncertainties":[],"diagram":"none","start":313.02,"end":485.12,"asr_flags":[],"raw_segments":[{"start":313.02,"text":"How about the validation loss? What is your expectation on the validation loss? Yeah, should probably follow the same curve as the training loss, but is likely slightly higher, because you're probably performing slightly less well on the validation set than on the training set. If you're seeing spikes, it might mean there are some issues. What else are you looking at? Yeah. So this batch, you mean?"},{"start":354.62,"text":"Yeah, so you're looking at this round of training data. Maybe the last round of data that we trained on, there were some issues in that data. Maybe that data was probably poisoned or biased toward a certain category of data that we're failing on. You're totally right."},{"start":376.46,"text":"Maybe that specific checkpoint is doing poorly compared to the previous checkpoint, and so you pinpoint where the issue arises during the training. What else are you looking at? Yeah. Okay. Because it's overnight and it seemed everything was good up to yesterday and now there's an issue, maybe you're saying there's a hardware issue. Yeah, we could check actually. Yeah, latency has been pointed out, so maybe the hardware has failed. Yeah, you're right."},{"start":426.45,"text":"What else? So a lot of the answers are global answers. You're looking at the model in general. You're not looking at specific portions of the model. What would you look at if you were to inspect the model more precisely from the inside? And this one's a language model, so you can think about the fact that it's a language model. Yeah, you're right. You want to look at different checkpoints."}],"speech_gaps":[],"frame":"../frames/v059/003.webp","frame_time":325.02},{"title":"模型调试与可视化分析","segments":[{"id":17,"text":"and see where did we fail and might be able to trace back to that moment and figure out what the issue was. So, for example, maybe your initialization was actually pretty good and the first checkpoints were doing well, but suddenly at some point the model saturated in a certain way. Maybe you're seeing exploding gradients or vanishing gradients in certain moments and you want to pinpoint that. Yeah. What else?"},{"id":18,"text":"We're adding so many methods right now, but I want to hear what else you have for language models. What are things can you visualize for language models that might mean something's going wrong? Yeah, the attention maps. Yeah, yeah, fair enough. You've learned about transformers in the online videos. The attention maps, which are representative of..."},{"id":19,"text":"you know the relationship between different tokens they might not make sense to you you might actually be plotting certain attention maps and be like this token has nothing to do with that one but the model seems to think it has and you might be able to identify certain issues with the attention maps what else beyond the attention maps what what yeah so you mean tell me more about the sensitivity analysis what would you fix for example and what would you change"},{"id":20,"text":"Okay, yeah, but I like the idea of sensitivity analysis. You might try to figure out which hyperparameter went wrong. Is there something wrong with our optimizer? Is our learning rate schedule poorly tuned? Maybe scaling laws. We know that we can play with compute, we can play with data, we can play with model size, and one of those might be going wrong."}],"notes":["本段讨论了模型调试过程中可能遇到的问题，如梯度爆炸或消失，以及如何通过注意力图（attention maps）来识别模型内部的问题。注意力图可以揭示模型对不同标记（tokens）之间关系的理解是否合理，从而帮助定位模型错误。","讲者提到，除了注意力图之外，还可以通过敏感性分析（sensitivity analysis）来识别模型中可能出错的超参数，例如优化器设置或学习率调度是否恰当。这有助于理解模型性能下降的原因。","讲者进一步指出，模型性能问题可能与计算资源、数据量或模型规模等要素有关，这些因素可以通过调整来优化模型表现。这表明模型调试需要从多个维度进行分析。","讲者强调了模型调试过程中需要系统性地排查问题，包括检查初始化是否合理、模型是否在某些时刻饱和，以及是否出现了梯度相关的问题。这些都需要通过可视化和分析来确认。","讲者还提到，敏感性分析可以帮助识别哪些超参数可能对模型性能产生较大影响，从而指导后续的调参工作。这表明模型调试是一个需要结合理论分析和实验验证的过程。","讲者最后指出，模型调试需要综合考虑多个因素，包括模型结构、训练过程和数据质量，这为后续的模型优化提供了方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":485.79,"end":645.82,"asr_flags":[],"raw_segments":[{"start":485.79,"text":"and see where did we fail and might be able to trace back to that moment and figure out what the issue was. So, for example, maybe your initialization was actually pretty good and the first checkpoints were doing well, but suddenly at some point the model saturated in a certain way. Maybe you're seeing exploding gradients or vanishing gradients in certain moments and you want to pinpoint that. Yeah. What else?"},{"start":515.57,"text":"We're adding so many methods right now, but I want to hear what else you have for language models. What are things can you visualize for language models that might mean something's going wrong? Yeah, the attention maps. Yeah, yeah, fair enough. You've learned about transformers in the online videos. The attention maps, which are representative of..."},{"start":552.3,"text":"you know the relationship between different tokens they might not make sense to you you might actually be plotting certain attention maps and be like this token has nothing to do with that one but the model seems to think it has and you might be able to identify certain issues with the attention maps what else beyond the attention maps what what yeah so you mean tell me more about the sensitivity analysis what would you fix for example and what would you change"},{"start":622.49,"text":"Okay, yeah, but I like the idea of sensitivity analysis. You might try to figure out which hyperparameter went wrong. Is there something wrong with our optimizer? Is our learning rate schedule poorly tuned? Maybe scaling laws. We know that we can play with compute, we can play with data, we can play with model size, and one of those might be going wrong."}],"speech_gaps":[],"frame":"../frames/v059/004.webp","frame_time":497.79},{"title":"模型内部发生了什么：分析与训练策略","segments":[{"id":21,"text":"Maybe an analysis would allow us to identify the model is fine, it just needs to be trained longer. Or the model is actually too small for the amount of data we're giving it. That type of stuff would come with either doing a sensitive analysis or comparing what we're doing to the scaling laws that we know from other models. We're going to look into that. Okay, any other ideas?"},{"id":22,"text":"Might be. So you're saying I gave you 200 billion parameters, which is a very large model even as of today. It might be over-parameterized. That's a good question because it depends on what it's been trained on, how much data we're feeding it, how much compute. It's all relative to each other. But yeah, it's a large model, so I would expect a lot of compute and a lot of data along with it. You know, in fact, a lot of these models might be built as a mixture of experts. You've heard about mixture of experts. One thing that could happen is that"},{"id":23,"text":"some of the experts are failing."},{"id":24,"text":"And you might be inspecting if experts are in fact failing or the routing module is always selecting the same experts because it's just found an expert that is really good and generalized and the other experts are not being used. That might be another issue as well that might be related to the model capacity. Because if the model is not using all its experts, it's probably not actually operating as a 200 billion parameter model. It's operating as a smaller model."},{"id":25,"text":"Yeah. Okay. So, you know, generally this is to motivate the lecture. We're going to look into all of these together today, right? And we start with convolutions because they're very visual. For the convolutional part, we're going to go super deep."},{"id":26,"text":"But then for the frontier models, I'm just going to get broader and give you the areas of research. So the answer to the question I asked typically would fall under four buckets, every solution that we looked into together. One is training and scaling. So people are looking at lost curves, at things like gradients, learning rates."},{"id":27,"text":"mixture of experts routing scaling laws we're going to talk about all these the second category is representation and internal aspect of the model you mentioned attention heads and maps embeddings nobody mentioned embeddings but you could actually visualize embeddings and see does it make sense to you are these you know tokens close to each other as you would expect meaning the the models mental understanding of language is correct"}],"notes":["本段讨论了模型规模与训练数据之间的关系，指出模型可能因参数过多而过参数化，需要考虑训练数据量、计算资源和模型容量的匹配。同时提到模型可能由多个专家组成，专家之间的路由机制可能影响模型性能。","讲者提到模型可能未充分利用所有专家，导致实际性能低于预期。这表明模型的内部结构和专家分配机制对整体表现有重要影响，需要进一步分析。","在讨论模型内部结构时，讲者提到注意力头、嵌入映射等概念，并指出嵌入可以可视化，以判断模型对语言的理解是否合理。这表明模型的内部表示是理解其行为的重要依据。","讲者将模型分析分为训练与扩展、表示与内部结构等类别，强调了不同层面的分析对理解模型行为的重要性。这为后续课程内容提供了框架。","讲者提到模型可能因专家分配不均而表现不佳，这表明模型的路由机制和专家设计是影响模型性能的关键因素。","讲者提到模型的内部表示可以通过可视化嵌入来评估，这为模型调试和优化提供了实际方法。"],"formulas":[],"uncertainties":["mixture of experts routing scaling laws we're going to talk about all these the second category is representation and internal aspect of the model you mentioned attention heads and maps embeddings nobody mentioned embeddings but you could actually visualize embeddings and see does it make sense to you are these you know tokens close to each other as you would expect meaning the the models mental understanding of language is correct"],"diagram":"none","start":646.54,"end":803.6,"asr_flags":[],"raw_segments":[{"start":646.54,"text":"Maybe an analysis would allow us to identify the model is fine, it just needs to be trained longer. Or the model is actually too small for the amount of data we're giving it. That type of stuff would come with either doing a sensitive analysis or comparing what we're doing to the scaling laws that we know from other models. We're going to look into that. Okay, any other ideas?"},{"start":681.07,"text":"Might be. So you're saying I gave you 200 billion parameters, which is a very large model even as of today. It might be over-parameterized. That's a good question because it depends on what it's been trained on, how much data we're feeding it, how much compute. It's all relative to each other. But yeah, it's a large model, so I would expect a lot of compute and a lot of data along with it. You know, in fact, a lot of these models might be built as a mixture of experts. You've heard about mixture of experts. One thing that could happen is that"},{"start":710.07,"text":"some of the experts are failing."},{"start":712.17,"text":"And you might be inspecting if experts are in fact failing or the routing module is always selecting the same experts because it's just found an expert that is really good and generalized and the other experts are not being used. That might be another issue as well that might be related to the model capacity. Because if the model is not using all its experts, it's probably not actually operating as a 200 billion parameter model. It's operating as a smaller model."},{"start":742.29,"text":"Yeah. Okay. So, you know, generally this is to motivate the lecture. We're going to look into all of these together today, right? And we start with convolutions because they're very visual. For the convolutional part, we're going to go super deep."},{"start":757.62,"text":"But then for the frontier models, I'm just going to get broader and give you the areas of research. So the answer to the question I asked typically would fall under four buckets, every solution that we looked into together. One is training and scaling. So people are looking at lost curves, at things like gradients, learning rates."},{"start":777.14,"text":"mixture of experts routing scaling laws we're going to talk about all these the second category is representation and internal aspect of the model you mentioned attention heads and maps embeddings nobody mentioned embeddings but you could actually visualize embeddings and see does it make sense to you are these you know tokens close to each other as you would expect meaning the the models mental understanding of language is correct"}],"speech_gaps":[],"frame":"../frames/v059/005.webp","frame_time":658.54},{"title":"模型内部发生了什么：模型行为与数据分布问题","segments":[{"id":28,"text":"And then your own level behaviors, although that's really hard with a large model and nobody has quite figured it out yet. And then the other category might be data and distribution. Maybe, you know, the actual benchmark that we're looking at has been contaminated, meaning, you know, the model is just not either is doing too well on that benchmark or it doesn't mean anything or is doing poorly for a certain reason because."},{"id":29,"text":"the data distribution used in the test set is completely different from the training or validation set."},{"id":30,"text":"And then, you know, it might be failing at different levels. You can run benchmarks on the language model. You can run benchmarks on the agentic workflow that is using that language model. And because you want the language model to be using agentic workflow, those are two levels that you need to inspect. So, for example, when a frontier lab says our model is doing really well for tool use, what they mean is the language model has been tested on upstream tasks."},{"id":31,"text":"in a workflow and it's actually good at tool use against their benchmarks so those are different levels of capability analysis okay so let's talk about convolutions we're going to dive deep inside convolutions and then we'll go back up and look at frontier models okay so first case study for convolutions"},{"id":32,"text":"Let's say that you have built an animal classifier for a zoo, and they are very reluctant to use your model without any human supervising because they don't understand the decision-making process of the model."},{"id":33,"text":"How can you alleviate their concerns?"},{"id":34,"text":"How can you give them intuition about the decision-making process of the model so that they feel like, ah, the model's doing things that feel natural and human?"},{"id":35,"text":"So, let's say, just to simplify, let's say you have a convolutional neural network and"},{"id":36,"text":"there's a softmax layer and it's supposed to identify animals, so the number of classes"},{"id":37,"text":"or many animals if you were to write a quick Python code to give them some"},{"id":38,"text":"intuition how would you do it yeah"},{"id":39,"text":"And then the next thing I want to explain is how the CNN, each layer of our CNN is getting higher, more in-depth, I guess, features of the image that we're putting, of the animals that we're showing."}],"notes":["本段讨论了模型行为和数据分布问题，指出模型行为分析的困难，以及数据分布不一致可能导致模型表现不佳。讲者提到，模型可能在不同层次上失败，例如语言模型和其使用的代理工作流，需要分别进行评估。","讲者以动物分类器为例，说明如何让模型决策过程对用户透明，以增加信任。用户可能担心模型的决策过程不透明，因此需要提供直观的解释。","讲者提到，卷积神经网络（CNN）的每一层都会提取图像的更高层次特征，这有助于理解模型如何逐步识别图像内容。","讲者强调，模型的决策过程需要通过可视化或解释方法来增强透明度，使用户能够理解模型的推理过程，从而增加对模型的信任。","讲者提到，模型的性能可能受到测试集和训练集数据分布差异的影响，这可能导致模型表现不佳。因此，需要关注数据分布的一致性。","讲者指出，模型的评估需要在不同层次上进行，包括语言模型本身和其使用的代理工作流，这有助于全面分析模型的能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":805.22,"end":977.21,"asr_flags":[37],"raw_segments":[{"start":805.22,"text":"And then your own level behaviors, although that's really hard with a large model and nobody has quite figured it out yet. And then the other category might be data and distribution. Maybe, you know, the actual benchmark that we're looking at has been contaminated, meaning, you know, the model is just not either is doing too well on that benchmark or it doesn't mean anything or is doing poorly for a certain reason because."},{"start":834.53,"text":"the data distribution used in the test set is completely different from the training or validation set."},{"start":840.8,"text":"And then, you know, it might be failing at different levels. You can run benchmarks on the language model. You can run benchmarks on the agentic workflow that is using that language model. And because you want the language model to be using agentic workflow, those are two levels that you need to inspect. So, for example, when a frontier lab says our model is doing really well for tool use, what they mean is the language model has been tested on upstream tasks."},{"start":868.35,"text":"in a workflow and it's actually good at tool use against their benchmarks so those are different levels of capability analysis okay so let's talk about convolutions we're going to dive deep inside convolutions and then we'll go back up and look at frontier models okay so first case study for convolutions"},{"start":892.95,"text":"Let's say that you have built an animal classifier for a zoo, and they are very reluctant to use your model without any human supervising because they don't understand the decision-making process of the model."},{"start":907.47,"text":"How can you alleviate their concerns?"},{"start":909.61,"text":"How can you give them intuition about the decision-making process of the model so that they feel like, ah, the model's doing things that feel natural and human?"},{"start":925.47,"text":"So, let's say, just to simplify, let's say you have a convolutional neural network and"},{"start":930.67,"text":"there's a softmax layer and it's supposed to identify animals, so the number of classes"},{"start":935.05,"text":"or many animals if you were to write a quick Python code to give them some"},{"start":954.49,"text":"intuition how would you do it yeah"},{"start":965.21,"text":"And then the next thing I want to explain is how the CNN, each layer of our CNN is getting higher, more in-depth, I guess, features of the image that we're putting, of the animals that we're showing."}],"speech_gaps":[{"start":958.016,"end":959.696}],"frame":"../frames/v059/006.webp","frame_time":817.22},{"title":"模型内部发生了什么：解释与验证方法","segments":[{"id":40,"text":"And then maybe if I have time, I can try and do some sort of different images to try and figure out what layers of CNNs I can use."},{"id":41,"text":"Okay."},{"id":42,"text":"But I don't know if that was all you had to say."},{"id":43,"text":"Good, good, good."},{"id":44,"text":"Good. So just to recap, the zoo is not AI-native, so you have to explain certain things."},{"id":45,"text":"You're going to tell them what Softmax is, so we're going to have a probability for each animal classes."},{"id":46,"text":"That's how it works."},{"id":47,"text":"And on top of that, you also mentioned you might talk about convolutions and say, here are how features are identified."},{"id":48,"text":"Here is how a filter scans through the image, and we're expecting this to learn."},{"id":49,"text":"So you're going to educate them first. That's totally right."},{"id":50,"text":"The second thing you mentioned is maybe you run a dataset search."},{"id":51,"text":"So you can try to build their intuition by showing them animal pictures and showing that the model is doing well."},{"id":52,"text":"And yeah, I agree. Those are good approaches."},{"id":53,"text":"We're going to see how to do a proper data set search large scale."},{"id":54,"text":"But what else can you do that's going to give a little bit more confidence?"},{"id":55,"text":"Because this is explanation, but it's not proof that the model is looking at the right place."},{"id":56,"text":"So you say, ideally, you would give them intuition at a filter level. Like this filter, we know it's responsible for finding the legs of an animal. That's what you're saying. So how would you do that? You know, good intuition. You're asking, is it as simple as just printing out the weights that are identified or the feature map that results of that filter? Unfortunately, not usually, because that might be true for the first layer."},{"id":57,"text":"But as you get deeper, things mix up so much that if you were just to print the filter, it wouldn't make any sense, pretty much. But there are other methods that we're going to see. So your intuition is right. We're going to try to give them that. Something simpler. Input-output relationship. How would you show that the output is actually related to the right portions of the inputs? For this dog, for example."},{"id":58,"text":"Yeah. Yeah. Confusion metrics across a lot of data. You would find true positives, false, et cetera. Yeah. Correct. Something else?"}],"notes":["本段讨论了如何在卷积神经网络（CNN）中解释模型的内部运作，特别是如何通过滤波器来识别特征。讲者指出，虽然在第一层中可以通过打印权重或特征图来直观理解滤波器的作用，但随着网络深度增加，这种直观方法变得不可行，因为特征会混合。因此，需要更复杂的解释方法，如输入-输出关系分析。","讲者提到，为了验证模型是否关注了正确的输入区域，可以使用混淆矩阵等方法，通过计算真正例、假正例等指标来评估模型的性能。这表明，除了直观解释外，还需要通过量化指标来验证模型的行为。","讲者强调，解释模型内部机制不仅仅是展示权重或特征图，还需要通过更系统的方法，如输入-输出关系分析，来验证模型是否在正确的位置进行特征提取。这为后续的模型解释方法提供了方向。","讲者指出，随着网络深度增加，特征的混合使得简单的滤波器分析变得困难，因此需要其他方法来解释模型行为。这表明，模型解释是一个复杂的问题，需要结合多种技术。","讲者提到，输入-输出关系分析是一种更简单的解释方法，可以用来验证模型是否在正确的输入区域进行处理。这为模型验证提供了实际操作的思路。","讲者最后提到混淆矩阵等指标可以用于评估模型在大量数据上的表现，这表明模型解释不仅需要直观方法，还需要量化分析来支持结论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":978.03,"end":1137.98,"asr_flags":[],"raw_segments":[{"start":978.03,"text":"And then maybe if I have time, I can try and do some sort of different images to try and figure out what layers of CNNs I can use."},{"start":987.97,"text":"Okay."},{"start":988.73,"text":"But I don't know if that was all you had to say."},{"start":990.47,"text":"Good, good, good."},{"start":991.09,"text":"Good. So just to recap, the zoo is not AI-native, so you have to explain certain things."},{"start":996.73,"text":"You're going to tell them what Softmax is, so we're going to have a probability for each animal classes."},{"start":1001.05,"text":"That's how it works."},{"start":1002.59,"text":"And on top of that, you also mentioned you might talk about convolutions and say, here are how features are identified."},{"start":1008.51,"text":"Here is how a filter scans through the image, and we're expecting this to learn."},{"start":1013.17,"text":"So you're going to educate them first. That's totally right."},{"start":1015.73,"text":"The second thing you mentioned is maybe you run a dataset search."},{"start":1019.65,"text":"So you can try to build their intuition by showing them animal pictures and showing that the model is doing well."},{"start":1025.53,"text":"And yeah, I agree. Those are good approaches."},{"start":1028.17,"text":"We're going to see how to do a proper data set search large scale."},{"start":1032.11,"text":"But what else can you do that's going to give a little bit more confidence?"},{"start":1036.97,"text":"Because this is explanation, but it's not proof that the model is looking at the right place."},{"start":1056.3,"text":"So you say, ideally, you would give them intuition at a filter level. Like this filter, we know it's responsible for finding the legs of an animal. That's what you're saying. So how would you do that? You know, good intuition. You're asking, is it as simple as just printing out the weights that are identified or the feature map that results of that filter? Unfortunately, not usually, because that might be true for the first layer."},{"start":1093.34,"text":"But as you get deeper, things mix up so much that if you were just to print the filter, it wouldn't make any sense, pretty much. But there are other methods that we're going to see. So your intuition is right. We're going to try to give them that. Something simpler. Input-output relationship. How would you show that the output is actually related to the right portions of the inputs? For this dog, for example."},{"start":1124.23,"text":"Yeah. Yeah. Confusion metrics across a lot of data. You would find true positives, false, et cetera. Yeah. Correct. Something else?"}],"speech_gaps":[{"start":1041.43,"end":1042.96}],"frame":"../frames/v059/007.webp","frame_time":990.03},{"title":"模型内部的直观理解","segments":[{"id":59,"text":"So similar to what he said with, you want to give them intuition from the inner workings of the network, and you're saying, how about we mask the latter parts of the network, and we treat every intermediary layer as an output and analyze if the output makes sense?"},{"id":60,"text":"Yeah, we're going to look at that, actually."},{"id":61,"text":"Yeah, those are more advanced."},{"id":62,"text":"What I was looking for is even more basic, much more basic."},{"id":63,"text":"it's if you want to show"},{"id":64,"text":"the relationship between"},{"id":65,"text":"an input and an output of a"},{"id":66,"text":"CNN or you know any"},{"id":67,"text":"vision model you might take"},{"id":68,"text":"the score of the dog"},{"id":69,"text":"in the output layer okay"},{"id":70,"text":"and what is"},{"id":71,"text":"exactly this quantity"},{"id":72,"text":"what is the intuition your intuition"},{"id":73,"text":"for what this quantity means"},{"id":74,"text":"if you take the derivative"},{"id":75,"text":"of the score of an animal"},{"id":76,"text":"mol class with respect to x, with x being the input image."},{"id":77,"text":"Yeah."},{"id":78,"text":"You want to be able to, if you can do that, you would indicate that which are the pixels"},{"id":79,"text":"want, right?"},{"id":80,"text":"You want to be able to, if you can do that, you would indicate that which are the pixels"},{"id":81,"text":"of the image that if we change them,"},{"id":82,"text":"it changes the score of dog."},{"id":83,"text":"If you can print that, then you would be able to show"},{"id":84,"text":"this is where the model is looking at"},{"id":85,"text":"when it's predicting a dog, right?"},{"id":86,"text":"So yeah, if you actually calculate this derivative,"},{"id":87,"text":"you would get something like that"},{"id":88,"text":"where some of the pixels are gonna be brighter,"},{"id":89,"text":"meaning their gradient is higher,"},{"id":90,"text":"and some of the pixels are gonna be darker,"},{"id":91,"text":"meaning we moved that pixel"},{"id":92,"text":"and it didn't modify the score of dog at all."},{"id":93,"text":"That's a very quick way to look at which pixels in the input were relevant for the score of DOG."},{"id":94,"text":"Now, why should we select the score of DOG pre-softmax versus post-softmax?"},{"id":95,"text":"It's usually a very common misconception. Yeah. So what's the issue with the scaled version? Class of dog. Yeah. So what you said is the post softmax."},{"id":96,"text":"Score is not only depending on dog. It's also dependent on all the other scores. So you could actually Take a pixel move it and it happens to modify the score of a panda because there's a panda in the background or something and It would influence what you're trying to show but you're only looking at dog You just want the score of dog to be influenced. So that's why in this"}],"notes":["本段讨论了如何通过分析模型内部的梯度来理解模型对输入图像中哪些像素敏感。讲者提到，可以通过计算输出层中狗的得分对输入图像的导数，来确定哪些像素的变化会影响模型的预测结果。这种分析方法可以帮助识别模型关注的区域。","讲者进一步解释了为什么选择预softmax的得分而不是后softmax的得分。后softmax的得分会受到其他类别得分的影响，因此可能无法准确反映模型对特定类别的关注程度。而预softmax的得分则更直接地反映了模型对特定类别的响应。","讲者提到，通过改变输入图像中的某些像素，可以观察到模型对狗的得分的变化。如果某个像素的变化显著影响了得分，说明该像素对模型的预测具有重要影响。","讲者强调，这种分析方法可以快速识别输入图像中哪些像素对模型的预测结果至关重要，从而帮助理解模型的决策过程。","讲者指出，选择预softmax的得分而不是后softmax的得分，是因为后softmax的得分会受到其他类别得分的影响，这可能会干扰对特定类别的关注分析。","讲者通过举例说明，如果在图像中存在其他类别（如熊猫）的像素，这些像素的变化可能会影响模型对狗的得分，因此需要选择预softmax的得分来避免这种干扰。"],"formulas":[],"uncertainties":["mol class"],"diagram":"none","start":1159.4,"end":1332.18,"asr_flags":[],"raw_segments":[{"start":1159.4,"text":"So similar to what he said with, you want to give them intuition from the inner workings of the network, and you're saying, how about we mask the latter parts of the network, and we treat every intermediary layer as an output and analyze if the output makes sense?"},{"start":1175.0,"text":"Yeah, we're going to look at that, actually."},{"start":1177.26,"text":"Yeah, those are more advanced."},{"start":1178.42,"text":"What I was looking for is even more basic, much more basic."},{"start":1181.16,"text":"it's if you want to show"},{"start":1183.14,"text":"the relationship between"},{"start":1185.0,"text":"an input and an output of a"},{"start":1186.96,"text":"CNN or you know any"},{"start":1189.02,"text":"vision model you might take"},{"start":1191.1,"text":"the score of the dog"},{"start":1192.88,"text":"in the output layer okay"},{"start":1195.0,"text":"and what is"},{"start":1196.7,"text":"exactly this quantity"},{"start":1198.24,"text":"what is the intuition your intuition"},{"start":1200.74,"text":"for what this quantity means"},{"start":1207.12,"text":"if you take the derivative"},{"start":1208.78,"text":"of the score of an animal"},{"start":1210.78,"text":"mol class with respect to x, with x being the input image."},{"start":1220.62,"text":"Yeah."},{"start":1226.68,"text":"Yeah, how does the score of dog change when you move pixels around, which is what you"},{"start":1233.22,"text":"want, right?"},{"start":1233.82,"text":"You want to be able to, if you can do that, you would indicate that which are the pixels"},{"start":1238.04,"text":"of the image that if we change them,"},{"start":1240.56,"text":"it changes the score of dog."},{"start":1242.7,"text":"If you can print that, then you would be able to show"},{"start":1245.06,"text":"this is where the model is looking at"},{"start":1247.58,"text":"when it's predicting a dog, right?"},{"start":1250.54,"text":"So yeah, if you actually calculate this derivative,"},{"start":1254.7,"text":"you would get something like that"},{"start":1256.14,"text":"where some of the pixels are gonna be brighter,"},{"start":1258.88,"text":"meaning their gradient is higher,"},{"start":1260.92,"text":"and some of the pixels are gonna be darker,"},{"start":1262.96,"text":"meaning we moved that pixel"},{"start":1264.52,"text":"and it didn't modify the score of dog at all."},{"start":1268.04,"text":"That's a very quick way to look at which pixels in the input were relevant for the score of DOG."},{"start":1276.88,"text":"Now, why should we select the score of DOG pre-softmax versus post-softmax?"},{"start":1286.0,"text":"It's usually a very common misconception. Yeah. So what's the issue with the scaled version? Class of dog. Yeah. So what you said is the post softmax."},{"start":1310.24,"text":"Score is not only depending on dog. It's also dependent on all the other scores. So you could actually Take a pixel move it and it happens to modify the score of a panda because there's a panda in the background or something and It would influence what you're trying to show but you're only looking at dog You just want the score of dog to be influenced. So that's why in this"}],"speech_gaps":[],"frame":"../frames/v059/008.webp","frame_time":1171.4},{"title":"可视化模型内部决策：显著性图与积分梯度","segments":[{"id":97,"text":"A method called saliency maps we use the pre-softmax scores that is only representative of the class at hand that you're analyzing."},{"id":98,"text":"Okay? So you could do that, and actually if you were to, in the past, not anymore, but you could use that for a quick segmentation sanity check because the pixels that are brighter, the gradients that are brighter are representatives of the pixels that should be overlaid on the dog. And in fact, if you do the saliency maps and you realize that the pixels that are bright when you compute that gradient are all over the place, it's probably that the model is not even looking at the right place. It's just getting lucky. Okay? So this first method, saliency maps."},{"id":99,"text":"Now have that in your toolkit. Very easy to implement, right? You just write a Python script, you perform the gradient calculation, you print it, it's a matrix of pixels that are brighter or darker, and you're done. One of the main issues with saliency maps is that it's looking at just a pixel level, which doesn't make too much sense if you want to interpret semantically where the model is looking at."},{"id":100,"text":"The model will never see a cat or a dog with one pixel being different than the rest. It would be too discontinuous. So instead, there's another method. I'm not going to go into the detail, but I link the paper, which is way more common, called integrated gradients. And integrated gradients, the idea is that instead of doing that directly by taking the ds of dog over dx, we're going to take an image of the animal and we're going to generate, you know,"},{"id":101,"text":"sort of many pictures that are taking dark, completely black zeros, a pixel all the way to the animal, the final image. And then we're going to look at the path of gradients across."},{"id":102,"text":"all of this update and it's going to be way more interpretive. I'm not going to go into the details but integrated gradients is just an extension of saliency maps that happens to use a different formula with an integration and is way more common. If you look at it practically, this is an example from the medical field, here is an image of a retina and if you perform the integrated gradients you would see that the original"},{"id":103,"text":"image, the annotation for the lesions are exactly where the model is looking at when it's giving you a probability that there is a lesion. So second method called integrated gradients. Let's push it a little further. The next case study is that you want to now tell them a little more about the decision process."}],"notes":["本段介绍了显著性图（saliency maps）的概念，这是一种通过计算梯度来可视化模型决策的工具。显著性图使用预softmax得分，仅代表当前分析的类别。通过计算梯度，可以识别出对模型决策影响较大的像素。如果显著性图中亮像素分布广泛，可能表明模型并未真正关注相关区域，而是偶然正确。"],"formulas":[],"uncertainties":["ds of dog over dx"],"diagram":"none","start":1332.56,"end":1498.7,"asr_flags":[],"raw_segments":[{"start":1332.56,"text":"method called saliency maps we use the pre-softmax scores that is only representative of the class at hand that you're analyzing."},{"start":1341.58,"text":"Okay? So you could do that, and actually if you were to, in the past, not anymore, but you could use that for a quick segmentation sanity check because the pixels that are brighter, the gradients that are brighter are representatives of the pixels that should be overlaid on the dog. And in fact, if you do the saliency maps and you realize that the pixels that are bright when you compute that gradient are all over the place, it's probably that the model is not even looking at the right place. It's just getting lucky. Okay? So this first method, saliency maps."},{"start":1371.93,"text":"now have that in your toolkit. Very easy to implement, right? You just write a Python script, you perform the gradient calculation, you print it, it's a matrix of pixels that are brighter or darker, and you're done. One of the main issues with saliency maps is that it's looking at just a pixel level, which doesn't make too much sense if you want to interpret semantically where the model is looking at."},{"start":1398.22,"text":"The model will never see a cat or a dog with one pixel being different than the rest. It would be too discontinuous. So instead, there's another method. I'm not going to go into the detail, but I link the paper, which is way more common, called integrated gradients. And integrated gradients, the idea is that instead of doing that directly by taking the ds of dog over dx, we're going to take an image of the animal and we're going to generate, you know,"},{"start":1427.34,"text":"sort of many pictures that are taking dark, completely black zeros, a pixel all the way to the animal, the final image. And then we're going to look at the path of gradients across."},{"start":1443.06,"text":"all of this update and it's going to be way more interpretive. I'm not going to go into the details but integrated gradients is just an extension of saliency maps that happens to use a different formula with an integration and is way more common. If you look at it practically, this is an example from the medical field, here is an image of a retina and if you perform the integrated gradients you would see that the original"},{"start":1469.76,"text":"image, the annotation for the lesions are exactly where the model is looking at when it's giving you a probability that there is a lesion. So second method called integrated gradients. Let's push it a little further. The next case study is that you want to now tell them a little more about the decision process."}],"speech_gaps":[],"frame":"../frames/v059/009.webp","frame_time":1344.56},{"title":"模型内部发生了什么：可视化方法","segments":[{"id":104,"text":"of the model with, I guess, let me rephrase. The saliency maps looked at the pixel level. What you can do in order to give a better intuition, which was mentioned earlier, is another approach called occlusion sensitivity, which is actually way more intuitive and simple, where you could actually take the dog image"},{"id":105,"text":"and paste it into the CNN and you would get a score of a dog. You could also overlay a dark square. So zero out or mask partially the input image and give it to the same CNN and track the modifications on the score of dog that you're tracking. If you actually do that, you can plot a probability map of how is the score of dog changing as I move the dark square through the image."},{"id":106,"text":"So let's do it together. I'm going to say that this one, when you actually put the dark square on the top left of the image, the score of dog is unchanged. It's still very high. Now you move the square a little bit to the right, and you see that it's still very high, the score of dog. You do it again, still very high. Now the square is partially occluding the face of the dog, and you should see the score of dog drop if the model is in fact looking..."},{"id":107,"text":"at the dog. And you perform that many times. So you scan through the image with your dark square and you plot what we call the probability map of the true class for different positions of the gray square. Does that make sense? So pretty simple, computationally expensive though."},{"id":108,"text":"Just have to rerun the image so many times through the model. Here are practical examples to look at. The first one, the true label is a Pomeranian."},{"id":109,"text":"cute dog and you see that the model is failing to recognize the true class when the square is overlapping with sort of the center of the face which makes sense because here the true class that we're tracking is not dog it's pomeranian and i could see how if you occlude the face it's hard to get the breed of the dog"},{"id":110,"text":"The second example, the true label is a car wheel. Sorry, I hadn't shown you that. The true label is a car wheel, and you can see that when the square is on the wheel, it is in fact dropping in terms of the true."}],"notes":["本段介绍了模型可视化方法中的遮挡敏感性（occlusion sensitivity）技术，该方法通过在输入图像上覆盖暗色方块，观察模型输出分数的变化，从而判断模型关注的区域。这种方法比像素级的显著性图（saliency maps）更直观，但计算成本较高。","讲者通过一个例子说明，当遮挡方块覆盖狗的面部区域时，模型对狗的识别分数会下降，这表明模型在识别狗时依赖面部特征。这说明模型的决策过程与人类的直觉一致，即面部是识别狗的关键区域。","另一个例子中，模型的真正标签是汽车轮毂，当遮挡方块覆盖轮毂区域时，模型的输出分数下降，这表明模型在识别汽车轮毂时依赖轮毂特征。","讲者指出，遮挡敏感性方法虽然直观，但需要多次运行模型，因此计算成本较高。这种方法适用于需要理解模型决策依据的场景，如图像分类任务。","讲者提到，遮挡敏感性方法可以用于分析模型对不同特征的依赖程度，例如在识别狗的品种时，面部特征可能比身体其他部分更重要。","讲者强调，遮挡敏感性方法是一种有效的可视化工具，可以帮助理解模型的内部机制，但需要注意遮挡区域的选择和实验设计的合理性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1499.94,"end":1659.53,"asr_flags":[],"raw_segments":[{"start":1499.94,"text":"of the model with, I guess, let me rephrase. The saliency maps looked at the pixel level. What you can do in order to give a better intuition, which was mentioned earlier, is another approach called occlusion sensitivity, which is actually way more intuitive and simple, where you could actually take the dog image"},{"start":1529.22,"text":"and paste it into the CNN and you would get a score of a dog. You could also overlay a dark square. So zero out or mask partially the input image and give it to the same CNN and track the modifications on the score of dog that you're tracking. If you actually do that, you can plot a probability map of how is the score of dog changing as I move the dark square through the image."},{"start":1560.11,"text":"So let's do it together. I'm going to say that this one, when you actually put the dark square on the top left of the image, the score of dog is unchanged. It's still very high. Now you move the square a little bit to the right, and you see that it's still very high, the score of dog. You do it again, still very high. Now the square is partially occluding the face of the dog, and you should see the score of dog drop if the model is in fact looking..."},{"start":1589.63,"text":"at the dog. And you perform that many times. So you scan through the image with your dark square and you plot what we call the probability map of the true class for different positions of the gray square. Does that make sense? So pretty simple, computationally expensive though."},{"start":1610.6,"text":"Just have to rerun the image so many times through the model. Here are practical examples to look at. The first one, the true label is a Pomeranian."},{"start":1623.61,"text":"cute dog and you see that the model is failing to recognize the true class when the square is overlapping with sort of the center of the face which makes sense because here the true class that we're tracking is not dog it's pomeranian and i could see how if you occlude the face it's hard to get the breed of the dog"},{"start":1645.27,"text":"The second example, the true label is a car wheel. Sorry, I hadn't shown you that. The true label is a car wheel, and you can see that when the square is on the wheel, it is in fact dropping in terms of the true."}],"speech_gaps":[],"frame":"../frames/v059/010.webp","frame_time":1511.94},{"title":"模型的可视化与解释性分析","segments":[{"id":111,"text":"class probability and then finally the afghan hound what's interesting about that third example is the probability is dropping when the square is on the dog but it's also increasing when the square is on the face of the human on the left which means that if you actually occlude the the face of the human the model thinks even more that the true class is in fact an afghan hound"},{"id":112,"text":"You're just removing additional unnecessary information for it to discover the true class. So this model seems to be doing well, right? It seems to be looking in the right place. We call that occlusion sensitivity. Pretty simple. Another tool with saliency map and integrated gradients in your toolkit. Let's push it slightly further. Here."},{"id":113,"text":"Here we're given, along with the classification outputs, the zoo wants a real-time visualization of the model's decision process, and you have one day to show that. And we're talking about convolutions again. What do you do? So the important part is to know the methods that we've seen so far are sort of posts."},{"id":114,"text":"methods where you analyze the output or you show something. Here we're looking at a sort of ideally a module that we could plug in our network that would constantly give us the decision-making process of the network, or at least where it's looking at. How would you do this? This is our network, by the way. We're taking an input, we're adding zero padding, and we have a series of conv value max pool blocks."},{"id":115,"text":"And then at the end we flatten, we have a triple fully connected layer, a softmax, and we get our probability output for classification. So just first question, where do you think is the weakness of this network when it comes to interpreting where the model is looking at on a picture? A part of this architecture makes interpreting the network way harder. Why?"}],"notes":["本段讨论了模型对图像中不同区域的敏感性，通过遮挡实验发现，当遮挡狗的区域时，模型对阿富汗猎犬类别的置信度下降，而遮挡人类面部时，置信度上升，说明模型在识别时更关注人类面部。这表明模型在决策过程中可能依赖于某些关键特征。","接下来，课程介绍了模型解释性的工具，如显著性图和积分梯度法，并提到这些方法属于后处理方法，即在模型输出后进行分析。课程进一步提出，需要一种能够实时可视化模型决策过程的模块，这可能涉及网络内部的结构设计。","课程展示了网络的结构，包括输入、零填充、卷积层、最大池化层、展平层、全连接层和softmax输出。课程提出，该网络在解释模型关注区域方面存在弱点，这可能与网络结构有关，例如卷积层和全连接层的组合使得模型决策过程难以直接可视化。","课程指出，网络结构中的某些部分（如卷积层和全连接层）使得模型的决策过程难以解释，因此需要设计一种能够实时展示模型决策过程的模块。这可能涉及对网络内部机制的深入理解，以及如何将解释性工具嵌入到网络中。","课程最后提出问题，要求学生思考网络结构中哪些部分导致了模型解释性的困难，并引导学生思考如何改进模型的可解释性。这表明课程关注模型的透明性和可解释性，这是深度学习模型的重要研究方向之一。","课程通过具体的例子和结构分析，帮助学生理解模型的决策过程，并引导学生思考如何改进模型的可解释性。这有助于学生在实际应用中更好地理解和调试深度学习模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1660.06,"end":1806.43,"asr_flags":[],"raw_segments":[{"start":1660.06,"text":"class probability and then finally the afghan hound what's interesting about that third example is the probability is dropping when the square is on the dog but it's also increasing when the square is on the face of the human on the left which means that if you actually occlude the the face of the human the model thinks even more that the true class is in fact an afghan hound"},{"start":1685.68,"text":"You're just removing additional unnecessary information for it to discover the true class. So this model seems to be doing well, right? It seems to be looking in the right place. We call that occlusion sensitivity. Pretty simple. Another tool with saliency map and integrated gradients in your toolkit. Let's push it slightly further. Here."},{"start":1715.53,"text":"Here we're given, along with the classification outputs, the zoo wants a real-time visualization of the model's decision process, and you have one day to show that. And we're talking about convolutions again. What do you do? So the important part is to know the methods that we've seen so far are sort of posts."},{"start":1739.0,"text":"methods where you analyze the output or you show something. Here we're looking at a sort of ideally a module that we could plug in our network that would constantly give us the decision-making process of the network, or at least where it's looking at. How would you do this? This is our network, by the way. We're taking an input, we're adding zero padding, and we have a series of conv value max pool blocks."},{"start":1769.84,"text":"And then at the end we flatten, we have a triple fully connected layer, a softmax, and we get our probability output for classification. So just first question, where do you think is the weakness of this network when it comes to interpreting where the model is looking at on a picture? A part of this architecture makes interpreting the network way harder. Why?"}],"speech_gaps":[],"frame":"../frames/v059/011.webp","frame_time":1672.06},{"title":"全连接层与局部信息的保留","segments":[{"id":116,"text":"Yeah, totally right. The fully connected layers, you're looking at all the pieces at the same time, you're mixing everything, and you're doing it three times. So by the end of those three layers, the information has been mixed together, essentially. You do not find the localized information that you had pre-that with the max pools and the conv layers. So how could you change that layer in order to avoid that? How would you modify your network if you wanted to retain maybe the performance of the model but not lose that?"},{"id":117,"text":"localized information."},{"id":118,"text":"Yeah, good idea. Instead of doing three, can we do one? Can we still have a layer that makes the interpretation easy? Actually, there's another trick which we're going to see, but it's similar to what you described. Let's say we convert this network into something where the flattening of the pixels and the fully connected layers are converted into a single global average pooling layer and a fully connected."},{"id":119,"text":"So here we reduce from three to one, the fully connected layers. We still need our fully connected layers in our softmax because it's a classification task and we want a good decision engine at the end. But we converted, we added a global average pooling. So let me explain why this is better. So the last conv block, essentially, is giving us a volume."},{"id":120,"text":"For the sake of simplicity, let's say that volume is a four by four with six channels. And I color coded them for simplicity. So each of these channels is a feature map that is resulting from a filter being scanned through the previous input. Everybody's clear on that? So global average pooling."},{"id":121,"text":"is going to take each of these channels, feature maps, and is going to average them in a single number. So if you take the orange matrix and you average it, it gives you 104.7. You do the same thing with the green one, the blue one, all six of them, and you get a volume, or call it a vector of size six, 116."},{"id":122,"text":"So why is that interesting? Because we actually did not lose the localized information. We did not mix things up. We just assigned a single number to a feature map that we retained. So the localized information is still there on the previous volume."}],"notes":["本段讨论了全连接层对信息混合的影响，以及如何通过全局平均池化层来保留局部信息。全连接层会将所有特征混合，导致局部信息丢失，而全局平均池化层则通过将每个特征图平均为一个数值，保留了局部信息。","教师提出了一种替代方案，即将全连接层替换为全局平均池化层，从而减少全连接层的数量，同时保留分类所需的决策能力。这种做法在保持模型性能的同时，避免了信息的过度混合。","教师以一个四乘四的体积和六个通道为例，说明了全局平均池化层的工作原理。每个通道对应一个特征图，通过平均操作将每个特征图转换为一个数值，最终得到一个六维向量。","教师强调，全局平均池化层不会丢失局部信息，而是将每个特征图的信息保留为一个数值，因此在后续的全连接层中仍然可以利用这些信息进行分类。","这种做法在卷积神经网络中被广泛应用，特别是在需要保留局部特征的场景中，如图像分类任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1824.99,"end":1989.23,"asr_flags":[],"raw_segments":[{"start":1824.99,"text":"Yeah, totally right. The fully connected layers, you're looking at all the pieces at the same time, you're mixing everything, and you're doing it three times. So by the end of those three layers, the information has been mixed together, essentially. You do not find the localized information that you had pre-that with the max pools and the conv layers. So how could you change that layer in order to avoid that? How would you modify your network if you wanted to retain maybe the performance of the model but not lose that?"},{"start":1854.36,"text":"localized information."},{"start":1865.49,"text":"Yeah, good idea. Instead of doing three, can we do one? Can we still have a layer that makes the interpretation easy? Actually, there's another trick which we're going to see, but it's similar to what you described. Let's say we convert this network into something where the flattening of the pixels and the fully connected layers are converted into a single global average pooling layer and a fully connected."},{"start":1895.53,"text":"So here we reduce from three to one, the fully connected layers. We still need our fully connected layers in our softmax because it's a classification task and we want a good decision engine at the end. But we converted, we added a global average pooling. So let me explain why this is better. So the last conv block, essentially, is giving us a volume."},{"start":1918.99,"text":"For the sake of simplicity, let's say that volume is a four by four with six channels. And I color coded them for simplicity. So each of these channels is a feature map that is resulting from a filter being scanned through the previous input. Everybody's clear on that? So global average pooling."},{"start":1944.56,"text":"is going to take each of these channels, feature maps, and is going to average them in a single number. So if you take the orange matrix and you average it, it gives you 104.7. You do the same thing with the green one, the blue one, all six of them, and you get a volume, or call it a vector of size six, 116."},{"start":1971.79,"text":"So why is that interesting? Because we actually did not lose the localized information. We did not mix things up. We just assigned a single number to a feature map that we retained. So the localized information is still there on the previous volume."}],"speech_gaps":[],"frame":"../frames/v059/012.webp","frame_time":1836.99},{"title":"模型内部发生了什么：类激活映射","segments":[{"id":123,"text":"And now we can treat that as a vector that goes through a decision engine or a fully connected layer that ultimately goes through our softmax and give us the probabilities. So this architecture is easier to trace back to localized information in the input space because you can actually look at, let's say, one of the score of dog, and you can look at the weights of each of these edges."},{"id":124,"text":"that tell you how much has the feature map from the volume before contributed to that score. So in other words, if I had to summarize, let's say the feature map looks like this. So this feature map is very high, has somehow activated heavily in some portion of the input image. The others similarly have activated."},{"id":125,"text":"To other things, you're taking the weights from your fully connected layer. By the way, you have to retrain that layer. You have to just train that layer, that last one. And then you sum all of them and it gives you what we call a class activation map for the class that you're visualizing. So you're overlaying those last six feature maps and you're weighing them with the weights of the last fully connected layer. You're not losing information. You're not mixing three fully connected layers that are impossible to trace back to the input space. Okay?"},{"id":126,"text":"So if you now give it an input image and you overlay the class activation map for the score of dog, which you can do for other classes. You can do the same thing for the class of cat. Look at the different weights, the feature maps. And maybe for the class of cat, the weights will certainly be different. So the contribution of each feature map will be different. Yeah, and this is what you get. This is called class activation map."},{"id":127,"text":"It's from folks over at Berkeley. And so here's a video that describes it. It runs really quickly. You can think of it as a slight modification to a vision network that can allow you to unpack what's happening inside and what's the decision process. There is also sort of an improvement to the CAM or class activation map algorithm called GradCam, which enhances that method. Okay? Any questions on class activation maps?"}],"notes":["本段讲解了类激活映射（Class Activation Map, CAM）的基本原理，即通过将全连接层的权重与特征图进行加权求和，从而可视化模型对输入图像中特定类别的关注区域。讲者提到，特征图的激活程度反映了其对最终得分的贡献，而通过叠加这些特征图并应用权重，可以得到一个类激活映射，用于解释模型的决策过程。","讲者进一步说明，CAM方法需要重新训练最后一层全连接层，并且只使用最后一层的权重，而不是整个网络的权重。这样可以避免信息丢失，并且能够追溯到输入空间中的局部信息。同时，讲者指出，CAM方法可以应用于不同的类别，如狗和猫，不同类别的权重分布可能不同。","讲者提到，CAM方法由伯克利的研究人员提出，并且还介绍了其改进版本GradCam。GradCam通过引入梯度信息来增强CAM的效果，使得模型的决策过程更加清晰。讲者最后询问学生是否对类激活映射有任何问题，表明该方法是当前研究中的一个重要方向。","在讲解过程中，讲者强调了特征图与权重之间的关系，以及如何通过加权求和得到最终的类激活映射。同时，讲者指出，CAM方法能够帮助理解深度学习模型的内部机制，从而提高模型的可解释性。","讲者还提到，CAM方法仅使用最后一层全连接层的权重，而不是整个网络的权重，这有助于避免信息混杂，并且能够更准确地追溯到输入空间中的局部信息。这种方法在图像分类任务中具有重要的应用价值。","最后，讲者通过提问的方式引导学生思考类激活映射的应用和意义，表明该方法在模型解释和可视化方面的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1990.02,"end":2136.62,"asr_flags":[],"math_clarifications":["公式CAM = sum(w_i × f_i)未明确权重w_i和特征图f_i的具体来源或计算方式，且未体现权重的归一化处理，可能影响结果的准确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1990.02,"text":"And now we can treat that as a vector that goes through a decision engine or a fully connected layer that ultimately goes through our softmax and give us the probabilities. So this architecture is easier to trace back to localized information in the input space because you can actually look at, let's say, one of the score of dog, and you can look at the weights of each of these edges."},{"start":2016.06,"text":"that tell you how much has the feature map from the volume before contributed to that score. So in other words, if I had to summarize, let's say the feature map looks like this. So this feature map is very high, has somehow activated heavily in some portion of the input image. The others similarly have activated."},{"start":2038.61,"text":"To other things, you're taking the weights from your fully connected layer. By the way, you have to retrain that layer. You have to just train that layer, that last one. And then you sum all of them and it gives you what we call a class activation map for the class that you're visualizing. So you're overlaying those last six feature maps and you're weighing them with the weights of the last fully connected layer. You're not losing information. You're not mixing three fully connected layers that are impossible to trace back to the input space. Okay?"},{"start":2075.38,"text":"So if you now give it an input image and you overlay the class activation map for the score of dog, which you can do for other classes. You can do the same thing for the class of cat. Look at the different weights, the feature maps. And maybe for the class of cat, the weights will certainly be different. So the contribution of each feature map will be different. Yeah, and this is what you get. This is called class activation map."},{"start":2100.99,"text":"It's from folks over at Berkeley. And so here's a video that describes it. It runs really quickly. You can think of it as a slight modification to a vision network that can allow you to unpack what's happening inside and what's the decision process. There is also sort of an improvement to the CAM or class activation map algorithm called GradCam, which enhances that method. Okay? Any questions on class activation maps?"}],"speech_gaps":[],"frame":"../frames/v059/013.webp","frame_time":2002.02},{"title":"模型内部发生了什么：可视化与理解","segments":[{"id":128,"text":"So we're getting to know convolutions a little better. Yeah. Yeah, so you were saying in the video, it seems like the model sometimes is looking at meaningless things. Yeah, I mean, it's not surprising, frankly. This is the previous generation of models. And on top of that, you're looking on a video. The model is a classification network. So it might look sometimes at things that are not even labeled."},{"id":129,"text":"And so it has to find the closest one. It might not make sense at all. That's why you build that type of module to visualize and understand the network's actually not working that well. But maybe on the main objects that you actually want for your task, let's say the zoo wants to do very well with cats and dogs, you can verify that when a cat is moving even at fast speed, the model's quickly looking at it. Super. Let's do a couple more methods because it's going to build our intuition."},{"id":130,"text":"for frontier models. So now the zoo trusts you. It trusts that the model correctly locates animals, but they get sort of scared and they wonder if the model understands what a dog is. Does it understand actually what a dog is or is it just like pattern matching random things? How could you take this ConvNet"},{"id":131,"text":"and sort of query what the model thinks a dog is. How would you do that? How could you ask the model what's your best representation of a dog? Okay, yeah, you did say two things. So get an image, so a forged image that maximizes the probability of dog. Yeah, let's do that actually. And then on your second point about"},{"id":132,"text":"reverse engineering, we're going to look at the method there as well. But yeah, I agree. So how would you concretely do that? What would you maximize? Okay."},{"id":133,"text":"Actually, what we said earlier, but I think you came right after that, is we would not take the softmax output because the softmax output is dependent on other classes. You divide by the sum of the exponentials of other classes. And so you could actually maximize the softmax output by not maximizing the class you want, but by minimizing the other classes, which is different than what you want."}],"notes":["本段讨论了如何通过最大化softmax输出来理解模型对特定类别的表示。讲者指出，softmax输出依赖于其他类别的概率，因此不能直接最大化目标类别的概率，而是需要最小化其他类别的概率，从而间接提高目标类别的概率。这种做法与直接最大化目标类别的概率不同，因为softmax的计算方式涉及所有类别的指数和。","讲者提到，为了查询模型对‘狗’的表示，可以构造一个图像，使得该图像最大化模型对‘狗’类别的softmax输出。这涉及到对图像进行优化，以改变模型的输出概率分布。这种方法被称为反向工程，用于理解模型内部的表示。","在反向工程过程中，需要考虑softmax输出的计算方式，即每个类别的概率是该类别对数似然除以所有类别对数似然的和。因此，最大化目标类别的概率需要同时最小化其他类别的概率，这与直接最大化目标类别的概率不同。","讲者强调，这种反向工程方法可以帮助理解模型是否真正理解了目标类别（如‘狗’），还是仅仅通过模式匹配来识别。这涉及到对模型内部表示的深入分析，以判断其是否具备语义理解能力。","在实际操作中，可以通过优化图像的像素值，使得模型对目标类别的softmax输出最大化。这种方法需要使用梯度上升算法，逐步调整图像，以达到目标输出。","讲者指出，这种方法虽然有效，但需要注意softmax输出的依赖性，即目标类别的概率受到其他类别概率的影响。因此，在反向工程过程中，需要同时考虑所有类别的概率分布，而不仅仅是目标类别。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2140.74,"end":2319.28,"asr_flags":[],"math_clarifications":["原文提到不能直接最大化softmax输出，因为其依赖于其他类别的概率，因此该公式不能直接用于最大化目标类别的概率。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2140.74,"text":"So we're getting to know convolutions a little better. Yeah. Yeah, so you were saying in the video, it seems like the model sometimes is looking at meaningless things. Yeah, I mean, it's not surprising, frankly. This is the previous generation of models. And on top of that, you're looking on a video. The model is a classification network. So it might look sometimes at things that are not even labeled."},{"start":2172.61,"text":"And so it has to find the closest one. It might not make sense at all. That's why you build that type of module to visualize and understand the network's actually not working that well. But maybe on the main objects that you actually want for your task, let's say the zoo wants to do very well with cats and dogs, you can verify that when a cat is moving even at fast speed, the model's quickly looking at it. Super. Let's do a couple more methods because it's going to build our intuition."},{"start":2205.07,"text":"for frontier models. So now the zoo trusts you. It trusts that the model correctly locates animals, but they get sort of scared and they wonder if the model understands what a dog is. Does it understand actually what a dog is or is it just like pattern matching random things? How could you take this ConvNet"},{"start":2233.37,"text":"and sort of query what the model thinks a dog is. How would you do that? How could you ask the model what's your best representation of a dog? Okay, yeah, you did say two things. So get an image, so a forged image that maximizes the probability of dog. Yeah, let's do that actually. And then on your second point about"},{"start":2284.79,"text":"reverse engineering, we're going to look at the method there as well. But yeah, I agree. So how would you concretely do that? What would you maximize? Okay."},{"start":2297.26,"text":"Actually, what we said earlier, but I think you came right after that, is we would not take the softmax output because the softmax output is dependent on other classes. You divide by the sum of the exponentials of other classes. And so you could actually maximize the softmax output by not maximizing the class you want, but by minimizing the other classes, which is different than what you want."}],"speech_gaps":[],"frame":"../frames/v059/014.webp","frame_time":2152.74},{"title":"模型内部发生了什么：可视化与正则化","segments":[{"id":134,"text":"So here's what we'll do. We'll define the loss function where we take the pre-softmax score of doc, so the thing right before the softmax, which is only dependent on that specific class, and we might also regularize it to make sure it looks natural. The reason we want the regularization term is because pixels need to be between 0 and 255, roughly. And so you don't want to run an optimization problem where pixels can have values that go all over the place."},{"id":135,"text":"It's just not going to look good to the human eye."},{"id":136,"text":"And so we're going to do that. We're going to run a gradient ascent algorithm, so similar to what we've seen in some of the previous classes, where we're going to update the pixels of an input image, a completely random input image, until we can maximize the loss function we defined. So we forward propagated the random image, we compute the objective, we back propagate all the way back to the pixels, and then we update the pixels to maximize that objective."},{"id":137,"text":"And we do that many times until we end up with something that might look like this. So let's say we take the score of a Dalmatian. You know, here researchers showed, and this is work from Jason Yosinski."},{"id":138,"text":"shows that you can start seeing the model. If you ask the model, what is a Dalmatian, it will tell you it's something with black dots on a white background, roughly. In fact, you might not understand fully what the dog is, but that's what it thinks it is. So we just unpacked it a little bit and queried that."},{"id":139,"text":"The goose, so here, the top left label goose for the model is many of them."},{"id":140,"text":"What does that mean?"},{"id":141,"text":"It means probably the model has seen a bunch of geese all the time together"},{"id":142,"text":"and has rarely seen a single one."},{"id":143,"text":"And maybe the labeled data was labeling that as goose when it was geese."},{"id":144,"text":"And so the model actually doesn't understand that it's a single one."},{"id":145,"text":"It thinks that all of them are the label."},{"id":146,"text":"Does that make sense?"},{"id":147,"text":"Okay."},{"id":148,"text":"Super."},{"id":149,"text":"So that's called class model visualization."},{"id":150,"text":"You can actually..."},{"id":151,"text":"Oh, sorry."},{"id":152,"text":"I wasn't showing what I was talking about."},{"id":153,"text":"No, I was showing..."},{"id":154,"text":"The way to improve those visualizations"},{"id":155,"text":"is just to change some of the regularization methods."},{"id":156,"text":"So the researchers have shown"},{"id":157,"text":"that you can actually add more color"},{"id":158,"text":"by regularizing better"},{"id":159,"text":"so it looks better to the human eye."},{"id":160,"text":"And then it becomes easier to query the model"},{"id":161,"text":"for a variety of classes just to make sure that it understood those classes."},{"id":162,"text":"And so same with flamingos, actually the label flamingo to the model feels like"}],"notes":["本段讲解了如何通过梯度上升算法对随机输入图像进行优化，以最大化定义的损失函数。该过程涉及前向传播、计算目标函数、反向传播并更新像素值，最终生成可视化结果。","通过Dalmatian的例子，说明模型能够通过反向传播生成图像，揭示模型对特定类别的理解。例如，模型认为Dalmatian是具有黑色斑点的白色背景图像。","在鹅的例子中，模型可能将多个鹅视为一个类别，而不是单个鹅，这表明模型在训练数据中可能更常见的是群体图像，而非单个个体。","通过改变正则化方法，可以改善可视化效果，使图像更符合人类视觉习惯，从而更容易查询模型对不同类别的理解。","模型的可视化方法被称为“类模型可视化”，通
