text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：模型内部发生了什么 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v059.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v059","title":"斯坦福CS230：模型内部发生了什么","course":"深度学习","pages":[{"title":"模型内部发生了什么","segments":[{"id":0,"text":"Welcome to lecture 9 already. I hope everybody had a good fall break. Today we're going to talk about neural networks, both convolutional neural networks and transformers, and we're going to unpack it to see what's going on inside.","zh":"欢迎来到第9讲。我希望大家都度过了一个愉快的假期。今天我们将讨论神经网络，包括卷积神经网络和变换器，并将深入探讨其内部发生了什么。","start":0.82,"end":21.52},{"id":1,"text":"This lecture used to be called Neural Network Interpretability, but I've broadened the scope because there is a section now where we talk more about frontier models.","zh":"这堂课以前叫做神经网络可解释性，但我扩大了范围，因为现在有一个部分专门讨论前沿模型。","start":22.64,"end":33.52},{"id":2,"text":"and the interpretability or visualization methods have not quite been figured out for most models that you play with out there. So think about this one as research areas, what we know from convolutions and what we're trying to figure out for frontier models.","zh":"目前，大多数你在外边使用的模型的可解释性或可视化方法还没有完全弄清楚。因此，把这看作是研究领域，我们从卷积中了解到了什么，以及我们正在努力弄清楚的前沿模型。","start":35.14,"end":52.5},{"id":3,"text":"We're going to start with a very packed agenda with a case study where I'm going to ask you a question and let you brainstorm a little bit altogether on how you would.","zh":"我们将从一个非常紧凑的议程开始，其中我将向你们提出一个问题，并让你们一起思考一下，你们会如何理解。","start":53.25,"end":67.13},{"id":4,"text":"try to understand what's happening inside of a frontier model. In the second section, we're going to look at the example of convolutions specifically and try to interpret everything possible about a convolution, meaning we're going to look at","zh":"尝试理解前沿模型内部发生了什么。在第二部分，我们将具体以卷积为例，尝试解释卷积的各个方面，这意味着我们将查看","start":67.74,"end":86.62},{"id":5,"text":"However, they are going to bring you the skills that will allow you to understand the methods for frontier models as researchers are trying to figure them out. The second half of the lecture is going to focus more on the modern representation analysis. We're going to talk about scaling laws.","zh":"然而，它们将带给你理解前沿模型的方法的技能，正如研究人员正在努力弄清楚这些方法。这堂课的后半部分将更多地关注现代表示分析。我们将讨论扩展定律。","start":86.94,"end":107.38},{"id":6,"text":"you might see frontier labs used for today's language or vision large models. However, they are going to bring you the skills that will allow you to understand the methods for frontier models as researchers are trying to figure them out. The second half of the lecture is going to focus more on the modern representation analysis. We're going to talk about scaling laws.","zh":"你可能会看到前沿实验室今天用于语言或视觉大型模型。然而，它们将带给你理解前沿模型的方法的技能，正如研究人员正在努力弄清楚这些方法。这堂课的后半部分将更多地关注现代表示分析。我们将讨论扩展定律。","start":107.66,"end":133.68},{"id":7,"text":"Capability benchmarking, data diagnostics, and then I end on a few closing remarks. Okay, are we ready for this one? Lots of visualizations in this lecture. So first question for you all. Let's say the case study is you are a model trainer and you're working on 200 billion parameters.","zh":"能力基准测试、数据诊断，然后我以一些结束语结束。好的，我们准备好开始了吗？这堂课有很多可视化内容。那么第一个问题给你们。假设案例研究是你们是一个模型训练师，你们正在处理2000亿参数。","start":134.72,"end":160.94}],"notes":["本段介绍了课程的结构和目标，强调了对前沿模型内部机制的理解。课程将从卷积神经网络的案例研究开始，分析输入输出关系、特定神经元和特征图的作用，并介绍相关方法。这些方法虽然适用于卷积网络，但不适用于当前的前沿模型，但它们能帮助理解前沿模型的方法。","接下来的课程内容将聚焦于现代表示分析，包括扩展定律（scaling laws）、能力基准测试（capability benchmarking）和数据诊断（data diagnostics）。这些内容旨在帮助学生理解模型的扩展性和性能评估。","课程还提到，尽管目前对前沿模型的可解释性方法尚未完全明确，但通过学习卷积网络的分析方法，学生可以掌握理解前沿模型的技能。这为后续研究前沿模型的内部机制打下基础。","课程强调了可视化在理解模型内部机制中的重要性，并通过案例研究引导学生思考如何理解大规模模型的内部运作。这有助于学生在实际研究中应用这些方法。","课程还提到，尽管当前的前沿模型可能使用不同的方法，但掌握基础分析技能对于理解这些模型至关重要。这为学生后续研究前沿模型提供了理论和实践基础。","最后，课程以提问的方式引导学生思考如何理解大规模模型的内部机制，这有助于激发学生的主动思考和探索精神。"],"formulas":[],"uncertainties":[],"diagram":"none","start":0.82,"end":160.94,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":0.82,"text":"Welcome to lecture 9 already. I hope everybody had a good fall break. Today we're going to talk about neural networks, both convolutional neural networks and transformers, and we're going to unpack it to see what's going on inside."},{"start":22.64,"text":"This lecture used to be called Neural Network Interpretability, but I've broadened the scope because there is a section now where we talk more about frontier models."},{"start":35.14,"text":"and the interpretability or visualization methods have not quite been figured out for most models that you play with out there. So think about this one as research areas, what we know from convolutions and what we're trying to figure out for frontier models."},{"start":53.25,"text":"We're going to start with a very packed agenda with a case study where I'm going to ask you a question and let you brainstorm a little bit altogether on how you would."},{"start":67.74,"text":"try to understand what's happening inside of a frontier model. In the second section, we're going to look at the example of convolutions specifically and try to interpret everything possible about a convolution, meaning we're going to look at"},{"start":86.94,"text":"input-output relationship. We're going to look at a specific neuron inside and try to interpret it. We're going to look also at specific feature maps and try to understand what they do. I will present many methods to do that. Those methods are real and they've been used for convolutions. But again, they're not the methods that..."},{"start":107.66,"text":"you might see frontier labs used for today's language or vision large models. However, they are going to bring you the skills that will allow you to understand the methods for frontier models as researchers are trying to figure them out. The second half of the lecture is going to focus more on the modern representation analysis. We're going to talk about scaling laws."},{"start":134.72,"text":"Capability benchmarking, data diagnostics, and then I end on a few closing remarks. Okay, are we ready for this one? Lots of visualizations in this lecture. So first question for you all. Let's say the case study is you are a model trainer and you're working on 200 billion parameters."}],"speech_gaps":[],"frame":"../frames/v059/001.webp","frame_time":12.82},{"title":"模型训练中的异常检测与分析","segments":[{"id":8,"text":"model at a frontier lab. And overnight, you know, a new checkpoint passes a training sanity check, but a few issues arise. Things like, you know, model is getting worse on reasoning benchmarks. Some safety evals are failing.","zh":"在前沿实验室中的模型。而且一夜之间，你知道的，一个新的检查点通过了训练合理性检查，但出现了一些问题。比如，模型在推理基准测试中表现变差。一些安全评估失败了。","start":161.86,"end":181.34},{"id":9,"text":"And there is a weird spike in, let's say, latency for tool use when you actually use this model for an agentic workflow. Your VP is wondering what's happening and they ask, what is going on? And what are you going to look at first? So what I want you to discuss for a minute or so, think about it first and I'll open up, is what are the type of evidences that you would look?","zh":"当实际上使用这个模型进行代理工作流时，会出现一些奇怪的延迟峰值。你的副总裁想知道发生了什么，并问，发生了什么事？你打算先检查什么？所以我想让你花几分钟时间思考一下，先想一想，然后我再开放讨论，问题是：你会查看哪些类型的证据？","start":182.46,"end":208.48},{"id":10,"text":"Want to inspect before even touching the code or retraining the model. What are the things that you want to look at? Jump in. There's no single answer, so I want to know everything you're going to look at.","zh":"在甚至触碰代码或重新训练模型之前，你想先检查什么？你会查看哪些事情？请跳进来。没有单一的答案，所以我希望了解你打算查看的一切。","start":209.17,"end":225.95},{"id":11,"text":"Okay, so error analysis. So look at, you said, I will look at the reasoning benchmarks and find the examples where the model is failing. Specifically, try to find patterns in order to pinpoint what the issue might be. And then same thing on the safety evals where you want to see what type of safety issues are arising. Is it everywhere? Is it specific to something? Yeah, I agree. Error analysis in general. What else?","zh":"好的，所以是错误分析。所以你要查看，你说，我会查看推理基准测试，并找到模型失败的示例。具体来说，尝试寻找模式，以确定问题可能出在哪里。同样地，在安全评估中，你想要了解出现哪些类型的安全问题。是普遍存在的吗？还是特定于某些内容？是的，我同意。一般来说，错误分析。还有别的吗？","start":226.62,"end":253.04},{"id":12,"text":"Remember, you're the model trainer, so you're training this model. You're supposed to be watching certain things when you're training. What can be interesting? Yeah, let's say, not necessarily passing, but those are great examples. So you're mentioning, yeah, as you're the model trainer, you would be watching the training loss. And you want to see, what are you going to look for in that training loss? Okay, conversions. You probably want to make sure that it's smooth. You don't want big spikes.","zh":"记住，你是模型训练师，所以你在训练这个模型。当你在训练时，你应该关注某些事情。什么可能是有趣的？是的，比如说，不一定通过，但这些都是很好的例子。所以你在提到，是的，作为模型训练师，你会关注训练损失。你打算在训练损失中寻找什么？好的，转换。你可能需要确保它平滑。你不希望出现大的峰值。","start":268.97,"end":311.69}],"notes":["本段讨论了模型训练过程中需要关注的关键指标，特别是训练损失的变化趋势。模型训练者应持续监控训练损失，确保其平稳变化，避免出现大的波动。这有助于及时发现模型训练中的潜在问题，如过拟合或训练不稳定。","在训练过程中，模型训练者应关注训练损失的平滑性，避免出现大的波动。这可能表明模型在学习过程中遇到了困难，或者训练数据中存在噪声或异常值。","模型训练者应通过分析训练损失的变化趋势，来判断模型是否正常学习。如果训练损失出现大的波动，可能意味着模型在某些数据点上表现不佳，或者训练过程中的超参数设置存在问题。","除了训练损失，模型训练者还应关注其他指标，如验证损失、准确率等，以全面评估模型的性能。这些指标的变化趋势可以帮助模型训练者更好地理解模型的学习过程。","在模型训练过程中，模型训练者应保持对训练过程的持续监控，以便及时发现并解决潜在问题。这包括对训练损失、验证损失、准确率等指标的定期检查。","模型训练者应通过分析训练损失的变化趋势，来判断模型是否正常学习。如果训练损失出现大的波动，可能意味着模型在某些数据点上表现不佳，或者训练过程中的超参数设置存在问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":161.86,"end":311.69,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":161.86,"text":"model at a frontier lab. And overnight, you know, a new checkpoint passes a training sanity check, but a few issues arise. Things like, you know, model is getting worse on reasoning benchmarks. Some safety evals are failing."},{"start":182.46,"text":"And there is a weird spike in, let's say, latency for tool use when you actually use this model for an agentic workflow. Your VP is wondering what's happening and they ask, what is going on? And what are you going to look at first? So what I want you to discuss for a minute or so, think about it first and I'll open up, is what are the type of evidences that you would look?"},{"start":209.17,"text":"Want to inspect before even touching the code or retraining the model. What are the things that you want to look at? Jump in. There's no single answer, so I want to know everything you're going to look at."},{"start":226.62,"text":"Okay, so error analysis. So look at, you said, I will look at the reasoning benchmarks and find the examples where the model is failing. Specifically, try to find patterns in order to pinpoint what the issue might be. And then same thing on the safety evals where you want to see what type of safety issues are arising. Is it everywhere? Is it specific to something? Yeah, I agree. Error analysis in general. What else?"},{"start":268.97,"text":"Remember, you're the model trainer, so you're training this model. You're supposed to be watching certain things when you're training. What can be interesting? Yeah, let's say, not necessarily passing, but those are great examples. So you're mentioning, yeah, as you're the model trainer, you would be watching the training loss. And you want to see, what are you going to look for in that training loss? Okay, conversions. You probably want to make sure that it's smooth. You don't want big spikes."}],"speech_gaps":[],"frame":"../frames/v059/002.webp","frame_time":173.86},{"title":"模型训练过程中的验证损失与问题排查","segments":[{"id":13,"text":"How about the validation loss? What is your expectation on the validation loss? Yeah, should probably follow the same curve as the training loss, but is likely slightly higher, because you're probably performing slightly less well on the validation set than on the training set. If you're seeing spikes, it might mean there are some issues. What else are you looking at? Yeah. So this batch, you mean?","zh":"验证损失如何？你对验证损失有什么预期？是的，它应该大致遵循训练损失的曲线，但可能略高，因为你可能在验证集上的表现略逊于训练集。如果你看到突增，这可能意味着存在一些问题。你还关注什么？是的。所以是这一批次的数据，对吧？","start":313.02,"end":354.14},{"id":14,"text":"Yeah, so you're looking at this round of training data. Maybe the last round of data that we trained on, there were some issues in that data. Maybe that data was probably poisoned or biased toward a certain category of data that we're failing on. You're totally right.","zh":"是的，你正在查看这一轮的训练数据。也许我们之前训练的最后一轮数据中存在一些问题。也许这些数据可能被污染，或者偏向于我们表现不佳的某一类数据。你完全正确。","start":354.62,"end":374.94},{"id":15,"text":"Maybe that specific checkpoint is doing poorly compared to the previous checkpoint, and so you pinpoint where the issue arises during the training. What else are you looking at? Yeah. Okay. Because it's overnight and it seemed everything was good up to yesterday and now there's an issue, maybe you're saying there's a hardware issue. Yeah, we could check actually. Yeah, latency has been pointed out, so maybe the hardware has failed. Yeah, you're right.","zh":"也许这个特定的检查点相比之前的检查点表现较差，因此你能够定位问题在训练过程中出现的位置。你还关注什么？是的。好的。因为是深夜，而且看起来直到昨天一切都很正常，现在出现了问题，也许你在说存在硬件问题。是的，我们实际上可以检查一下。是的，延迟已经被指出，所以可能是硬件出现了故障。是的，你说得对。","start":376.46,"end":421.81},{"id":16,"text":"What else? So a lot of the answers are global answers. You're looking at the model in general. You're not looking at specific portions of the model. What would you look at if you were to inspect the model more precisely from the inside? And this one's a language model, so you can think about the fact that it's a language model. Yeah, you're right. You want to look at different checkpoints.","zh":"还有什么？很多答案都是全局性的。你是在总体上查看模型，而不是查看模型的特定部分。如果你要更精确地从内部检查模型，你会关注什么？而且这是一个语言模型，所以你可以考虑它作为语言模型的特性。是的，你说得对。你想要查看不同的检查点。","start":426.45,"end":485.12}],"notes":["本段讨论了模型训练过程中验证损失的预期表现，指出验证损失通常会比训练损失稍高，因为模型在验证集上的表现通常不如训练集。同时，提到如果验证损失出现异常波动，可能意味着数据存在问题，如数据被污染或存在偏差。","讲者进一步指出，如果某个特定的检查点（checkpoint）表现不佳，可能需要定位问题出现在训练过程的哪个阶段。此外，还提到如果问题是在夜间突然出现，可能需要考虑硬件故障的可能性，如延迟增加。","最后，讲者强调，虽然很多回答是全局性的，但若要更精确地检查模型内部，应关注具体的检查点，并指出对于语言模型，应考虑其作为语言模型的特性。","讲者还提到，如果问题出现在模型的特定部分，应检查该部分的训练数据和模型参数，以确定问题的根源。"],"formulas":[],"uncertainties":[],"diagram":"none","start":313.02,"end":485.12,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":313.02,"text":"How about the validation loss? What is your expectation on the validation loss? Yeah, should probably follow the same curve as the training loss, but is likely slightly higher, because you're probably performing slightly less well on the validation set than on the training set. If you're seeing spikes, it might mean there are some issues. What else are you looking at? Yeah. So this batch, you mean?"},{"start":354.62,"text":"Yeah, so you're looking at this round of training data. Maybe the last round of data that we trained on, there were some issues in that data. Maybe that data was probably poisoned or biased toward a certain category of data that we're failing on. You're totally right."},{"start":376.46,"text":"Maybe that specific checkpoint is doing poorly compared to the previous checkpoint, and so you pinpoint where the issue arises during the training. What else are you looking at? Yeah. Okay. Because it's overnight and it seemed everything was good up to yesterday and now there's an issue, maybe you're saying there's a hardware issue. Yeah, we could check actually. Yeah, latency has been pointed out, so maybe the hardware has failed. Yeah, you're right."},{"start":426.45,"text":"What else? So a lot of the answers are global answers. You're looking at the model in general. You're not looking at specific portions of the model. What would you look at if you were to inspect the model more precisely from the inside? And this one's a language model, so you can think about the fact that it's a language model. Yeah, you're right. You want to look at different checkpoints."}],"speech_gaps":[],"frame":"../frames/v059/003.webp","frame_time":325.02},{"title":"模型调试与可视化分析","segments":[{"id":17,"text":"and see where did we fail and might be able to trace back to that moment and figure out what the issue was. So, for example, maybe your initialization was actually pretty good and the first checkpoints were doing well, but suddenly at some point the model saturated in a certain way. Maybe you're seeing exploding gradients or vanishing gradients in certain moments and you want to pinpoint that. Yeah. What else?","zh":"并查看我们哪里失败了，可能能够追溯到那个时刻，并弄清楚问题所在。例如，也许你的初始化实际上还不错，前几个检查点表现良好，但突然在某个时刻模型以某种方式饱和了。也许你在某些时刻看到了梯度爆炸或梯度消失的现象，你想要定位到这些情况。对的。还有什么其他问题吗？","start":485.79,"end":514.47},{"id":18,"text":"We're adding so many methods right now, but I want to hear what else you have for language models. What are things can you visualize for language models that might mean something's going wrong? Yeah, the attention maps. Yeah, yeah, fair enough. You've learned about transformers in the online videos. The attention maps, which are representative of...","zh":"我们现在添加了这么多方法，但我希望听到你们对于语言模型还有哪些其他的建议。对于语言模型，你们可以可视化哪些内容，可能意味着某些地方出了问题？对的，注意力图。对的，对的，说得不错。你们已经在在线视频中学习过变压器（transformer）了。注意力图代表的是……","start":515.57,"end":552.01},{"id":19,"text":"you know the relationship between different tokens they might not make sense to you you might actually be plotting certain attention maps and be like this token has nothing to do with that one but the model seems to think it has and you might be able to identify certain issues with the attention maps what else beyond the attention maps what what yeah so you mean tell me more about the sensitivity analysis what would you fix for example and what would you change","zh":"你知道不同标记之间的关系，这些关系对你来说可能没有意义，你可能实际上在绘制某些注意力图，并觉得这个标记和那个标记毫无关系，但模型似乎认为它们有关联，你可能能够通过注意力图识别出某些问题。除此之外，还有哪些内容呢？除了注意力图之外，还有什么？对了，你是指让我更详细地谈谈敏感性分析吗？例如，你会如何修复这些问题，又会如何调整呢？","start":552.3,"end":597.73},{"id":20,"text":"Okay, yeah, but I like the idea of sensitivity analysis. You might try to figure out which hyperparameter went wrong. Is there something wrong with our optimizer? Is our learning rate schedule poorly tuned? Maybe scaling laws. We know that we can play with compute, we can play with data, we can play with model size, and one of those might be going wrong.","zh":"好的，是的，但我喜欢敏感性分析这个想法。你可能会尝试弄清楚哪个超参数出了问题。我们的优化器有问题吗？我们的学习率调度是否调得不好？也许还有缩放定律。我们知道可以调整计算资源、数据量和模型规模，而这三者中的某一个可能出了问题。","start":622.49,"end":645.82}],"notes":["本段讨论了模型调试过程中可能遇到的问题，如梯度爆炸或消失，以及如何通过注意力图（attention maps）来识别模型内部的问题。注意力图可以揭示模型对不同标记（tokens）之间关系的理解是否合理，从而帮助定位模型错误。","讲者提到，除了注意力图之外，还可以通过敏感性分析（sensitivity analysis）来识别模型中可能出错的超参数，例如优化器设置或学习率调度是否恰当。这有助于理解模型性能下降的原因。","讲者进一步指出，模型性能问题可能与计算资源、数据量或模型规模等要素有关，这些因素可以通过调整来优化模型表现。这表明模型调试需要从多个维度进行分析。","讲者强调了模型调试过程中需要系统性地排查问题，包括检查初始化是否合理、模型是否在某些时刻饱和，以及是否出现了梯度相关的问题。这些都需要通过可视化和分析来确认。","讲者还提到，敏感性分析可以帮助识别哪些超参数可能对模型性能产生较大影响，从而指导后续的调参工作。这表明模型调试是一个需要结合理论分析和实验验证的过程。","讲者最后指出，模型调试需要综合考虑多个因素，包括模型结构、训练过程和数据质量，这为后续的模型优化提供了方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":485.79,"end":645.82,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":485.79,"text":"and see where did we fail and might be able to trace back to that moment and figure out what the issue was. So, for example, maybe your initialization was actually pretty good and the first checkpoints were doing well, but suddenly at some point the model saturated in a certain way. Maybe you're seeing exploding gradients or vanishing gradients in certain moments and you want to pinpoint that. Yeah. What else?"},{"start":515.57,"text":"We're adding so many methods right now, but I want to hear what else you have for language models. What are things can you visualize for language models that might mean something's going wrong? Yeah, the attention maps. Yeah, yeah, fair enough. You've learned about transformers in the online videos. The attention maps, which are representative of..."},{"start":552.3,"text":"you know the relationship between different tokens they might not make sense to you you might actually be plotting certain attention maps and be like this token has nothing to do with that one but the model seems to think it has and you might be able to identify certain issues with the attention maps what else beyond the attention maps what what yeah so you mean tell me more about the sensitivity analysis what would you fix for example and what would you change"},{"start":622.49,"text":"Okay, yeah, but I like the idea of sensitivity analysis. You might try to figure out which hyperparameter went wrong. Is there something wrong with our optimizer? Is our learning rate schedule poorly tuned? Maybe scaling laws. We know that we can play with compute, we can play with data, we can play with model size, and one of those might be going wrong."}],"speech_gaps":[],"frame":"../frames/v059/004.webp","frame_time":497.79},{"title":"模型内部发生了什么：分析与训练策略","segments":[{"id":21,"text":"Maybe an analysis would allow us to identify the model is fine, it just needs to be trained longer. Or the model is actually too small for the amount of data we're giving it. That type of stuff would come with either doing a sensitive analysis or comparing what we're doing to the scaling laws that we know from other models. We're going to look into that. Okay, any other ideas?","zh":"也许通过分析我们可以确定模型本身没有问题，只是需要更长时间的训练。或者模型实际上对于给定的数据量来说太小了。这类问题可以通过进行敏感性分析，或者将我们的做法与我们从其他模型中了解的扩展定律进行比较来解决。我们会研究这些问题。好的，还有其他想法吗？","start":646.54,"end":669.8},{"id":22,"text":"Might be. So you're saying I gave you 200 billion parameters, which is a very large model even as of today. It might be over-parameterized. That's a good question because it depends on what it's been trained on, how much data we're feeding it, how much compute. It's all relative to each other. But yeah, it's a large model, so I would expect a lot of compute and a lot of data along with it. You know, in fact, a lot of these models might be built as a mixture of experts. You've heard about mixture of experts. One thing that could happen is that","zh":"有可能。所以你在说我已经给了你2000亿个参数，这即使在今天也是一个非常大的模型。它可能是过度参数化的。这是一个好问题，因为这取决于它被训练的内容、我们给它的数据量以及计算资源。这些因素彼此之间都是相对的。但没错，这是一个大模型，因此我预期需要大量的计算资源和大量数据。事实上，很多这些模型可能是由专家混合组成的。你听说过专家混合的概念。可能发生的情况是：","start":681.07,"end":709.65},{"id":23,"text":"some of the experts are failing.","zh":"一些专家出现了故障。","start":710.07,"end":711.41},{"id":24,"text":"And you might be inspecting if experts are in fact failing or the routing module is always selecting the same experts because it's just found an expert that is really good and generalized and the other experts are not being used. That might be another issue as well that might be related to the model capacity. Because if the model is not using all its experts, it's probably not actually operating as a 200 billion parameter model. It's operating as a smaller model.","zh":"你可能会检查这些专家是否真的出现了故障，或者路由模块总是选择相同的专家，因为它已经找到了一个非常优秀且能够泛化的专家，而其他专家没有被使用。这也是另一个可能与模型容量相关的问题。因为如果模型没有使用所有专家，它实际上可能并不是一个2000亿参数的模型，而是在运行一个更小的模型。","start":712.17,"end":741.45},{"id":25,"text":"Yeah. Okay. So, you know, generally this is to motivate the lecture. We're going to look into all of these together today, right? And we start with convolutions because they're very visual. For the convolutional part, we're going to go super deep.","zh":"是的。好的。一般来说，这是为了激励今天的讲座。我们将今天一起探讨所有这些问题，对吧？我们首先从卷积开始，因为它们非常直观。在卷积部分，我们将深入探讨。","start":742.29,"end":756.17},{"id":26,"text":"But then for the frontier models, I'm just going to get broader and give you the areas of research. So the answer to the question I asked typically would fall under four buckets, every solution that we looked into together. One is training and scaling. So people are looking at lost curves, at things like gradients, learning rates.","zh":"但至于前沿模型，我只会更广泛地介绍研究领域。我们通常对之前提出的问题的解答通常可以归入四个类别，每一个我们共同探讨的解决方案。第一类是训练和扩展。人们正在研究损失曲线、梯度、学习率等事物。","start":757.62,"end":776.58},{"id":27,"text":"mixture of experts routing scaling laws we're going to talk about all these the second category is representation and internal aspect of the model you mentioned attention heads and maps embeddings nobody mentioned embeddings but you could actually visualize embeddings and see does it make sense to you are these you know tokens close to each other as you would expect meaning the the models mental understanding of language is correct","zh":"专家混合路由扩展定律，我们接下来要讨论所有这些，第二类是表示和模型的内部方面，你提到了注意力头和映射嵌入，没有人提到嵌入，但你实际上可以可视化嵌入并查看是否对你有意义，这些标记是否彼此接近，正如你所期望的，这意味着模型对语言的理解是正确的","start":777.14,"end":803.6}],"notes":["本段讨论了模型规模与训练数据之间的关系，指出模型可能因参数过多而过参数化，需要考虑训练数据量、计算资源和模型容量的匹配。同时提到模型可能由多个专家组成，专家之间的路由机制可能影响模型性能。","讲者提到模型可能未充分利用所有专家，导致实际性能低于预期。这表明模型的内部结构和专家分配机制对整体表现有重要影响，需要进一步分析。","在讨论模型内部结构时，讲者提到注意力头、嵌入映射等概念，并指出嵌入可以可视化，以判断模型对语言的理解是否合理。这表明模型的内部表示是理解其行为的重要依据。","讲者将模型分析分为训练与扩展、表示与内部结构等类别，强调了不同层面的分析对理解模型行为的重要性。这为后续课程内容提供了框架。","讲者提到模型可能因专家分配不均而表现不佳，这表明模型的路由机制和专家设计是影响模型性能的关键因素。","讲者提到模型的内部表示可以通过可视化嵌入来评估，这为模型调试和优化提供了实际方法。"],"formulas":[],"uncertainties":["mixture of experts routing scaling laws we're going to talk about all these the second category is representation and internal aspect of the model you mentioned attention heads and maps embeddings nobody mentioned embeddings but you could actually visualize embeddings and see does it make sense to you are these you know tokens close to each other as you would expect meaning the the models mental understanding of language is correct"],"diagram":"none","start":646.54,"end":803.6,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":646.54,"text":"Maybe an analysis would allow us to identify the model is fine, it just needs to be trained longer. Or the model is actually too small for the amount of data we're giving it. That type of stuff would come with either doing a sensitive analysis or comparing what we're doing to the scaling laws that we know from other models. We're going to look into that. Okay, any other ideas?"},{"start":681.07,"text":"Might be. So you're saying I gave you 200 billion parameters, which is a very large model even as of today. It might be over-parameterized. That's a good question because it depends on what it's been trained on, how much data we're feeding it, how much compute. It's all relative to each other. But yeah, it's a large model, so I would expect a lot of compute and a lot of data along with it. You know, in fact, a lot of these models might be built as a mixture of experts. You've heard about mixture of experts. One thing that could happen is that"},{"start":710.07,"text":"some of the experts are failing."},{"start":712.17,"text":"And you might be inspecting if experts are in fact failing or the routing module is always selecting the same experts because it's just found an expert that is really good and generalized and the other experts are not being used. That might be another issue as well that might be related to the model capacity. Because if the model is not using all its experts, it's probably not actually operating as a 200 billion parameter model. It's operating as a smaller model."},{"start":742.29,"text":"Yeah. Okay. So, you know, generally this is to motivate the lecture. We're going to look into all of these together today, right? And we start with convolutions because they're very visual. For the convolutional part, we're going to go super deep."},{"start":757.62,"text":"But then for the frontier models, I'm just going to get broader and give you the areas of research. So the answer to the question I asked typically would fall under four buckets, every solution that we looked into together. One is training and scaling. So people are looking at lost curves, at things like gradients, learning rates."},{"start":777.14,"text":"mixture of experts routing scaling laws we're going to talk about all these the second category is representation and internal aspect of the model you mentioned attention heads and maps embeddings nobody mentioned embeddings but you could actually visualize embeddings and see does it make sense to you are these you know tokens close to each other as you would expect meaning the the models mental understanding of language is correct"}],"speech_gaps":[],"frame":"../frames/v059/005.webp","frame_time":658.54},{"title":"模型内部发生了什么：模型行为与数据分布问题","segments":[{"id":28,"text":"And then your own level behaviors, although that's really hard with a large model and nobody has quite figured it out yet. And then the other category might be data and distribution. Maybe, you know, the actual benchmark that we're looking at has been contaminated, meaning, you know, the model is just not either is doing too well on that benchmark or it doesn't mean anything or is doing poorly for a certain reason because.","zh":"然后是你自己的行为层面，尽管在大型模型中这真的很困难，而且目前还没有人完全弄清楚。另一个类别可能是数据和分布。也许，你们正在查看的实际基准测试已经被污染了，意思是，模型在这个基准测试上表现得非常好，或者它没有任何意义，或者因为某些原因表现得非常差。","start":805.22,"end":833.84},{"id":29,"text":"the data distribution used in the test set is completely different from the training or validation set.","zh":"用于测试集的数据分布与训练集或验证集完全不同。","start":834.53,"end":839.81},{"id":30,"text":"And then, you know, it might be failing at different levels. You can run benchmarks on the language model. You can run benchmarks on the agentic workflow that is using that language model. And because you want the language model to be using agentic workflow, those are two levels that you need to inspect. So, for example, when a frontier lab says our model is doing really well for tool use, what they mean is the language model has been tested on upstream tasks.","zh":"然后，它可能在不同层面上失败。你可以对语言模型运行基准测试，也可以对使用该语言模型的代理工作流程运行基准测试。因为你希望语言模型使用代理工作流程，因此需要检查这两个层面。例如，当一个前沿实验室说我们的模型在工具使用方面表现很好时，他们指的是语言模型已经在上游任务上进行了测试。","start":840.8,"end":867.66},{"id":31,"text":"in a workflow and it's actually good at tool use against their benchmarks so those are different levels of capability analysis okay so let's talk about convolutions we're going to dive deep inside convolutions and then we'll go back up and look at frontier models okay so first case study for convolutions","zh":"在一个工作流程中，它实际上在他们的基准测试中表现良好，因此这些是不同层面的能力分析。好的，现在让我们谈谈卷积，我们将深入探讨卷积，然后回到前沿模型上。好的，现在第一个关于卷积的案例研究。","start":868.35,"end":892.07},{"id":32,"text":"Let's say that you have built an animal classifier for a zoo, and they are very reluctant to use your model without any human supervising because they don't understand the decision-making process of the model.","zh":"假设你为动物园构建了一个动物分类器，但他们非常不愿意在没有任何人类监督的情况下使用你的模型，因为他们不理解模型的决策过程。","start":892.95,"end":907.07},{"id":33,"text":"How can you alleviate their concerns?","zh":"你如何缓解他们的担忧？","start":907.47,"end":909.45},{"id":34,"text":"How can you give them intuition about the decision-making process of the model so that they feel like, ah, the model's doing things that feel natural and human?","zh":"你如何让他们对模型的决策过程有直觉，使他们觉得，啊，模型所做的事感觉自然且像人类？","start":909.61,"end":920.11},{"id":35,"text":"So, let's say, just to simplify, let's say you have a convolutional neural network and","zh":"让我们假设，为了简化，你有一个卷积神经网络，","start":925.47,"end":930.67},{"id":36,"text":"there's a softmax layer and it's supposed to identify animals, so the number of classes","zh":"有一个softmax层，它应该用来识别动物，因此类别数量","start":930.67,"end":935.05},{"id":37,"text":"or many animals if you were to write a quick Python code to give them some","zh":"或者如果你用一段快速的Python代码来给它们一些","start":935.05,"end":954.49},{"id":38,"text":"intuition how would you do it yeah","zh":"直观的认识，你会怎么做呢，对吧","start":954.49,"end":956.89},{"id":39,"text":"And then the next thing I want to explain is how the CNN, each layer of our CNN is getting higher, more in-depth, I guess, features of the image that we're putting, of the animals that we're showing.","zh":"然后我想解释的是，卷积神经网络（CNN）的每一层都在获取图像中，也就是我们展示的动物的，更高层次、更深入的特征","start":965.21,"end":977.21}],"notes":["本段讨论了模型行为和数据分布问题，指出模型行为分析的困难，以及数据分布不一致可能导致模型表现不佳。讲者提到，模型可能在不同层次上失败，例如语言模型和其使用的代理工作流，需要分别进行评估。","讲者以动物分类器为例，说明如何让模型决策过程对用户透明，以增加信任。用户可能担心模型的决策过程不透明，因此需要提供直观的解释。","讲者提到，卷积神经网络（CNN）的每一层都会提取图像的更高层次特征，这有助于理解模型如何逐步识别图像内容。","讲者强调，模型的决策过程需要通过可视化或解释方法来增强透明度，使用户能够理解模型的推理过程，从而增加对模型的信任。","讲者提到，模型的性能可能受到测试集和训练集数据分布差异的影响，这可能导致模型表现不佳。因此，需要关注数据分布的一致性。","讲者指出，模型的评估需要在不同层次上进行，包括语言模型本身和其使用的代理工作流，这有助于全面分析模型的能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":805.22,"end":977.21,"asr_flags":[37],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":805.22,"text":"And then your own level behaviors, although that's really hard with a large model and nobody has quite figured it out yet. And then the other category might be data and distribution. Maybe, you know, the actual benchmark that we're looking at has been contaminated, meaning, you know, the model is just not either is doing too well on that benchmark or it doesn't mean anything or is doing poorly for a certain reason because."},{"start":834.53,"text":"the data distribution used in the test set is completely different from the training or validation set."},{"start":840.8,"text":"And then, you know, it might be failing at different levels. You can run benchmarks on the language model. You can run benchmarks on the agentic workflow that is using that language model. And because you want the language model to be using agentic workflow, those are two levels that you need to inspect. So, for example, when a frontier lab says our model is doing really well for tool use, what they mean is the language model has been tested on upstream tasks."},{"start":868.35,"text":"in a workflow and it's actually good at tool use against their benchmarks so those are different levels of capability analysis okay so let's talk about convolutions we're going to dive deep inside convolutions and then we'll go back up and look at frontier models okay so first case study for convolutions"},{"start":892.95,"text":"Let's say that you have built an animal classifier for a zoo, and they are very reluctant to use your model without any human supervising because they don't understand the decision-making process of the model."},{"start":907.47,"text":"How can you alleviate their concerns?"},{"start":909.61,"text":"How can you give them intuition about the decision-making process of the model so that they feel like, ah, the model's doing things that feel natural and human?"},{"start":925.47,"text":"So, let's say, just to simplify, let's say you have a convolutional neural network and"},{"start":930.67,"text":"there's a softmax layer and it's supposed to identify animals, so the number of classes"},{"start":935.05,"text":"or many animals if you were to write a quick Python code to give them some"},{"start":954.49,"text":"intuition how would you do it yeah"},{"start":965.21,"text":"And then the next thing I want to explain is how the CNN, each layer of our CNN is getting higher, more in-depth, I guess, features of the image that we're putting, of the animals that we're showing."}],"speech_gaps":[{"start":958.016,"end":959.696}],"frame":"../frames/v059/006.webp","frame_time":817.22},{"title":"模型内部发生了什么：解释与验证方法","segments":[{"id":40,"text":"And then maybe if I have time, I can try and do some sort of different images to try and figure out what layers of CNNs I can use.","zh":"然后，如果我有时间，我可以尝试做一些不同的图像，以尝试弄清楚在CNN的哪些层可以使用。","start":978.03,"end":987.59},{"id":41,"text":"Okay.","zh":"好的。","start":987.97,"end":988.41},{"id":42,"text":"But I don't know if that was all you had to say.","zh":"但我不确定这是否是你全部要讲的内容。","start":988.73,"end":990.47},{"id":43,"text":"Good, good, good.","zh":"很好，很好，很好。","start":990.47,"end":991.09},{"id":44,"text":"Good. So just to recap, the zoo is not AI-native, so you have to explain certain things.","zh":"好的。所以简要回顾一下，这个动物园并不是AI原生的，因此你必须解释一些内容。","start":991.09,"end":996.61},{"id":45,"text":"You're going to tell them what Softmax is, so we're going to have a probability for each animal classes.","zh":"你要告诉他们什么是Softmax，这样我们就可以为每个动物类别生成一个概率。","start":996.73,"end":1000.69},{"id":46,"text":"That's how it works.","zh":"这就是它的运作方式。","start":1001.05,"end":1001.97},{"id":47,"text":"And on top of that, you also mentioned you might talk about convolutions and say, here are how features are identified.","zh":"除此之外，你还提到可能会讨论卷积，并说明特征是如何被识别的。","start":1002.59,"end":1008.27},{"id":48,"text":"Here is how a filter scans through the image, and we're expecting this to learn.","zh":"这里展示了滤波器如何扫描图像，我们期望它能够学习。","start":1008.51,"end":1013.05},{"id":49,"text":"So you're going to educate them first. That's totally right.","zh":"所以你首先要对它们进行训练。这完全正确。","start":1013.17,"end":1015.67},{"id":50,"text":"The second thing you mentioned is maybe you run a dataset search.","zh":"你提到的第二件事可能是你运行一个数据集搜索。","start":1015.73,"end":1019.65},{"id":51,"text":"So you can try to build their intuition by showing them animal pictures and showing that the model is doing well.","zh":"你可以通过展示动物图片来帮助他们建立直觉，并展示模型表现良好。","start":1019.65,"end":1025.25},{"id":52,"text":"And yeah, I agree. Those are good approaches.","zh":"是的，我同意。这些都是很好的方法。","start":1025.53,"end":1028.05},{"id":53,"text":"We're going to see how to do a proper data set search large scale.","zh":"我们将看到如何进行大规模的数据集搜索。","start":1028.17,"end":1031.61},{"id":54,"text":"But what else can you do that's going to give a little bit more confidence?","zh":"除此之外，你还能做些什么来增加一点信心呢？","start":1032.11,"end":1036.83},{"id":55,"text":"Because this is explanation, but it's not proof that the model is looking at the right place.","zh":"因为这是解释，但并不能证明模型正在关注正确的位置。","start":1036.97,"end":1041.03},{"id":56,"text":"So you say, ideally, you would give them intuition at a filter level. Like this filter, we know it's responsible for finding the legs of an animal. That's what you're saying. So how would you do that? You know, good intuition. You're asking, is it as simple as just printing out the weights that are identified or the feature map that results of that filter? Unfortunately, not usually, because that might be true for the first layer.","zh":"所以你说，理想情况下，你会在滤波器层面给他们一些直觉。比如这个滤波器，我们知道它负责检测动物的腿。这就是你在说的。那么你该如何做到这一点呢？你知道，好的直觉。你在问，是不是仅仅打印出被识别的权重或者该滤波器的结果特征图就可以了？不幸的是，通常不是这样，因为这可能在第一层是成立的。","start":1056.3,"end":1092.57},{"id":57,"text":"But as you get deeper, things mix up so much that if you were just to print the filter, it wouldn't make any sense, pretty much. But there are other methods that we're going to see. So your intuition is right. We're going to try to give them that. Something simpler. Input-output relationship. How would you show that the output is actually related to the right portions of the inputs? For this dog, for example.","zh":"但随着你深入网络，情况会变得如此复杂，以至于如果你只是打印滤波器，它基本上是没有意义的。但我们会看到其他方法。因此你的直觉是对的。我们会尝试给他们这样的直觉。一种更简单的方式。输入-输出关系。你如何展示输出实际上与输入的正确部分相关？例如，对于这只狗。","start":1093.34,"end":1121.84},{"id":58,"text":"Yeah. Yeah. Confusion metrics across a lot of data. You would find true positives, false, et cetera. Yeah. Correct. Something else?","zh":"是的。是的。在大量数据上计算混淆矩阵。你会找到真正例、假等等。是的。正确。还有其他方法吗？","start":1124.23,"end":1137.98}],"notes":["本段讨论了如何在卷积神经网络（CNN）中解释模型的内部运作，特别是如何通过滤波器来识别特征。讲者指出，虽然在第一层中可以通过打印权重或特征图来直观理解滤波器的作用，但随着网络深度增加，这种直观方法变得不可行，因为特征会混合。因此，需要更复杂的解释方法，如输入-输出关系分析。","讲者提到，为了验证模型是否关注了正确的输入区域，可以使用混淆矩阵等方法，通过计算真正例、假正例等指标来评估模型的性能。这表明，除了直观解释外，还需要通过量化指标来验证模型的行为。","讲者强调，解释模型内部机制不仅仅是展示权重或特征图，还需要通过更系统的方法，如输入-输出关系分析，来验证模型是否在正确的位置进行特征提取。这为后续的模型解释方法提供了方向。","讲者指出，随着网络深度增加，特征的混合使得简单的滤波器分析变得困难，因此需要其他方法来解释模型行为。这表明，模型解释是一个复杂的问题，需要结合多种技术。","讲者提到，输入-输出关系分析是一种更简单的解释方法，可以用来验证模型是否在正确的输入区域进行处理。这为模型验证提供了实际操作的思路。","讲者最后提到混淆矩阵等指标可以用于评估模型在大量数据上的表现，这表明模型解释不仅需要直观方法，还需要量化分析来支持结论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":978.03,"end":1137.98,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":978.03,"text":"And then maybe if I have time, I can try and do some sort of different images to try and figure out what layers of CNNs I can use."},{"start":987.97,"text":"Okay."},{"start":988.73,"text":"But I don't know if that was all you had to say."},{"start":990.47,"text":"Good, good, good."},{"start":991.09,"text":"Good. So just to recap, the zoo is not AI-native, so you have to explain certain things."},{"start":996.73,"text":"You're going to tell them what Softmax is, so we're going to have a probability for each animal classes."},{"start":1001.05,"text":"That's how it works."},{"start":1002.59,"text":"And on top of that, you also mentioned you might talk about convolutions and say, here are how features are identified."},{"start":1008.51,"text":"Here is how a filter scans through the image, and we're expecting this to learn."},{"start":1013.17,"text":"So you're going to educate them first. That's totally right."},{"start":1015.73,"text":"The second thing you mentioned is maybe you run a dataset search."},{"start":1019.65,"text":"So you can try to build their intuition by showing them animal pictures and showing that the model is doing well."},{"start":1025.53,"text":"And yeah, I agree. Those are good approaches."},{"start":1028.17,"text":"We're going to see how to do a proper data set search large scale."},{"start":1032.11,"text":"But what else can you do that's going to give a little bit more confidence?"},{"start":1036.97,"text":"Because this is explanation, but it's not proof that the model is looking at the right place."},{"start":1056.3,"text":"So you say, ideally, you would give them intuition at a filter level. Like this filter, we know it's responsible for finding the legs of an animal. That's what you're saying. So how would you do that? You know, good intuition. You're asking, is it as simple as just printing out the weights that are identified or the feature map that results of that filter? Unfortunately, not usually, because that might be true for the first layer."},{"start":1093.34,"text":"But as you get deeper, things mix up so much that if you were just to print the filter, it wouldn't make any sense, pretty much. But there are other methods that we're going to see. So your intuition is right. We're going to try to give them that. Something simpler. Input-output relationship. How would you show that the output is actually related to the right portions of the inputs? For this dog, for example."},{"start":1124.23,"text":"Yeah. Yeah. Confusion metrics across a lot of data. You would find true positives, false, et cetera. Yeah. Correct. Something else?"}],"speech_gaps":[{"start":1041.43,"end":1042.96}],"frame":"../frames/v059/007.webp","frame_time":990.03},{"title":"模型内部的直观理解","segments":[{"id":59,"text":"So similar to what he said with, you want to give them intuition from the inner workings of the network, and you're saying, how about we mask the latter parts of the network, and we treat every intermediary layer as an output and analyze if the output makes sense?","zh":"所以，这类似于他所说的，你想从网络的内部运作中给他们一些直观的理解，你可以说，那我们把网络的后部分屏蔽掉，并将每一个中间层都当作输出来处理，分析这些输出是否合理？","start":1159.4,"end":1174.7},{"id":60,"text":"Yeah, we're going to look at that, actually.","zh":"是的，我们实际上会看一下这个方法。","start":1175.0,"end":1176.68},{"id":61,"text":"Yeah, those are more advanced.","zh":"是的，这些是更高级的内容。","start":1177.26,"end":1178.32},{"id":62,"text":"What I was looking for is even more basic, much more basic.","zh":"我寻找的是更加基础的，甚至更加基础的。","start":1178.42,"end":1181.16},{"id":63,"text":"it's if you want to show","zh":"如果你想要展示","start":1181.16,"end":1183.14},{"id":64,"text":"the relationship between","zh":"输入和输出之间的","start":1183.14,"end":1185.0},{"id":65,"text":"an input and an output of a","zh":"一个CNN或者任何","start":1185.0,"end":1186.96},{"id":66,"text":"CNN or you know any","zh":"网络的输入和输出之间的关系","start":1186.96,"end":1189.02},{"id":67,"text":"vision model you might take","zh":"你可能会采取的视觉模型","start":1189.02,"end":1191.1},{"id":68,"text":"the score of the dog","zh":"狗的得分","start":1191.1,"end":1192.88},{"id":69,"text":"in the output layer okay","zh":"在输出层，好吧","start":1192.88,"end":1195.0},{"id":70,"text":"and what is","zh":"以及什么是","start":1195.0,"end":1196.7},{"id":71,"text":"exactly this quantity","zh":"这个量究竟是什么","start":1196.7,"end":1198.24},{"id":72,"text":"what is the intuition your intuition","zh":"你的直觉是什么，你的直觉","start":1198.24,"end":1200.74},{"id":73,"text":"for what this quantity means","zh":"这个量意味着什么","start":1200.74,"end":1202.18},{"id":74,"text":"if you take the derivative","zh":"如果你取导数","start":1207.12,"end":1208.78},{"id":75,"text":"of the score of an animal","zh":"动物得分的方面","start":1208.78,"end":1210.78},{"id":76,"text":"mol class with respect to x, with x being the input image.","zh":"关于输入图像x的类别得分","start":1210.78,"end":1216.42},{"id":77,"text":"Yeah.","zh":"是的。","start":1220.62,"end":1221.06},{"id":78,"text":"You want to be able to, if you can do that, you would indicate that which are the pixels","zh":"你希望能够做到这一点，如果你能做到，你就能指出哪些像素","start":1226.68,"end":1233.22},{"id":79,"text":"want, right?","zh":"是你想要的，对吧？","start":1233.22,"end":1233.64},{"id":80,"text":"You want to be able to, if you can do that, you would indicate that which are the pixels","zh":"你希望能够做到这一点，如果你能做到，你就能指出哪些像素","start":1233.82,"end":1238.04},{"id":81,"text":"of the image that if we change them,","zh":"如果改变它们，","start":1238.04,"end":1240.48},{"id":82,"text":"it changes the score of dog.","zh":"就会改变狗的得分。","start":1240.56,"end":1241.7},{"id":83,"text":"If you can print that, then you would be able to show","zh":"如果你能打印出来，那么你就能展示","start":1242.7,"end":1245.06},{"id":84,"text":"this is where the model is looking at","zh":"这就是模型在观察的地方","start":1245.06,"end":1246.82},{"id":85,"text":"when it's predicting a dog, right?","zh":"当它预测一只狗的时候，对吧？","start":1247.58,"end":1249.94},{"id":86,"text":"So yeah, if you actually calculate this derivative,","zh":"所以，如果你实际上计算这个导数，","start":1250.54,"end":1253.94},{"id":87,"text":"you would get something like that","zh":"你会得到类似这样的结果","start":1254.7,"end":1256.14},{"id":88,"text":"where some of the pixels are gonna be brighter,","zh":"其中一些像素会更亮，","start":1256.14,"end":1258.72},{"id":89,"text":"meaning their gradient is higher,","zh":"意味着它们的梯度更高，","start":1258.88,"end":1260.78},{"id":90,"text":"and some of the pixels are gonna be darker,","zh":"而另一些像素会更暗，","start":1260.92,"end":1262.84},{"id":91,"text":"meaning we moved that pixel","zh":"这意味着我们移动了那个像素","start":1262.96,"end":1264.52},{"id":92,"text":"and it didn't modify the score of dog at all.","zh":"并且它完全没有改变狗的得分。","start":1264.52,"end":1266.68},{"id":93,"text":"That's a very quick way to look at which pixels in the input were relevant for the score of DOG.","zh":"这是一种非常快速的方法，可以查看输入中的哪些像素对于狗的得分是相关的。","start":1268.04,"end":1274.04},{"id":94,"text":"Now, why should we select the score of DOG pre-softmax versus post-softmax?","zh":"现在，我们为什么应该选择DOG的得分是在softmax之前还是之后呢？","start":1276.88,"end":1282.26},{"id":95,"text":"It's usually a very common misconception. Yeah. So what's the issue with the scaled version? Class of dog. Yeah. So what you said is the post softmax.","zh":"这通常是一个非常常见的误解。是的。那么缩放版本的问题是什么？狗的类别。是的。你所说的就是在softmax之后的得分。","start":1286.0,"end":1309.5},{"id":96,"text":"Score is not only depending on dog. It's also dependent on all the other scores. So you could actually Take a pixel move it and it happens to modify the score of a panda because there's a panda in the background or something and It would influence what you're trying to show but you're only looking at dog You just want the score of dog to be influenced. So that's why in this","zh":"得分不仅仅取决于狗，它还依赖于所有其他得分。因此，你实际上可以移动一个像素，它可能会修改熊猫的得分，因为背景中可能有熊猫，这会对你想要展示的内容产生影响，但你只关注狗。你只想让狗的得分受到影响。这就是为什么在这个","start":1310.24,"end":1332.18}],"notes":["本段讨论了如何通过分析模型内部的梯度来理解模型对输入图像中哪些像素敏感。讲者提到，可以通过计算输出层中狗的得分对输入图像的导数，来确定哪些像素的变化会影响模型的预测结果。这种分析方法可以帮助识别模型关注的区域。","讲者进一步解释了为什么选择预softmax的得分而不是后softmax的得分。后softmax的得分会受到其他类别得分的影响，因此可能无法准确反映模型对特定类别的关注程度。而预softmax的得分则更直接地反映了模型对特定类别的响应。","讲者提到，通过改变输入图像中的某些像素，可以观察到模型对狗的得分的变化。如果某个像素的变化显著影响了得分，说明该像素对模型的预测具有重要影响。","讲者强调，这种分析方法可以快速识别输入图像中哪些像素对模型的预测结果至关重要，从而帮助理解模型的决策过程。","讲者指出，选择预softmax的得分而不是后softmax的得分，是因为后softmax的得分会受到其他类别得分的影响，这可能会干扰对特定类别的关注分析。","讲者通过举例说明，如果在图像中存在其他类别（如熊猫）的像素，这些像素的变化可能会影响模型对狗的得分，因此需要选择预softmax的得分来避免这种干扰。"],"formulas":[],"uncertainties":["mol class"],"diagram":"none","start":1159.4,"end":1332.18,"asr_flags":[],"translation_complete":true,"translated_segments":38,"raw_segments":[{"start":1159.4,"text":"So similar to what he said with, you want to give them intuition from the inner workings of the network, and you're saying, how about we mask the latter parts of the network, and we treat every intermediary layer as an output and analyze if the output makes sense?"},{"start":1175.0,"text":"Yeah, we're going to look at that, actually."},{"start":1177.26,"text":"Yeah, those are more advanced."},{"start":1178.42,"text":"What I was looking for is even more basic, much more basic."},{"start":1181.16,"text":"it's if you want to show"},{"start":1183.14,"text":"the relationship between"},{"start":1185.0,"text":"an input and an output of a"},{"start":1186.96,"text":"CNN or you know any"},{"start":1189.02,"text":"vision model you might take"},{"start":1191.1,"text":"the score of the dog"},{"start":1192.88,"text":"in the output layer okay"},{"start":1195.0,"text":"and what is"},{"start":1196.7,"text":"exactly this quantity"},{"start":1198.24,"text":"what is the intuition your intuition"},{"start":1200.74,"text":"for what this quantity means"},{"start":1207.12,"text":"if you take the derivative"},{"start":1208.78,"text":"of the score of an animal"},{"start":1210.78,"text":"mol class with respect to x, with x being the input image."},{"start":1220.62,"text":"Yeah."},{"start":1226.68,"text":"Yeah, how does the score of dog change when you move pixels around, which is what you"},{"start":1233.22,"text":"want, right?"},{"start":1233.82,"text":"You want to be able to, if you can do that, you would indicate that which are the pixels"},{"start":1238.04,"text":"of the image that if we change them,"},{"start":1240.56,"text":"it changes the score of dog."},{"start":1242.7,"text":"If you can print that, then you would be able to show"},{"start":1245.06,"text":"this is where the model is looking at"},{"start":1247.58,"text":"when it's predicting a dog, right?"},{"start":1250.54,"text":"So yeah, if you actually calculate this derivative,"},{"start":1254.7,"text":"you would get something like that"},{"start":1256.14,"text":"where some of the pixels are gonna be brighter,"},{"start":1258.88,"text":"meaning their gradient is higher,"},{"start":1260.92,"text":"and some of the pixels are gonna be darker,"},{"start":1262.96,"text":"meaning we moved that pixel"},{"start":1264.52,"text":"and it didn't modify the score of dog at all."},{"start":1268.04,"text":"That's a very quick way to look at which pixels in the input were relevant for the score of DOG."},{"start":1276.88,"text":"Now, why should we select the score of DOG pre-softmax versus post-softmax?"},{"start":1286.0,"text":"It's usually a very common misconception. Yeah. So what's the issue with the scaled version? Class of dog. Yeah. So what you said is the post softmax."},{"start":1310.24,"text":"Score is not only depending on dog. It's also dependent on all the other scores. So you could actually Take a pixel move it and it happens to modify the score of a panda because there's a panda in the background or something and It would influence what you're trying to show but you're only looking at dog You just want the score of dog to be influenced. So that's why in this"}],"speech_gaps":[],"frame":"../frames/v059/008.webp","frame_time":1171.4},{"title":"可视化模型内部决策：显著性图与积分梯度","segments":[{"id":97,"text":"A method called saliency maps we use the pre-softmax scores that is only representative of the class at hand that you're analyzing.","zh":"一种称为显著性图的方法，我们使用的是预softmax得分，这些得分仅能代表你正在分析的那个类。","start":1332.56,"end":1340.06},{"id":98,"text":"Okay? So you could do that, and actually if you were to, in the past, not anymore, but you could use that for a quick segmentation sanity check because the pixels that are brighter, the gradients that are brighter are representatives of the pixels that should be overlaid on the dog. And in fact, if you do the saliency maps and you realize that the pixels that are bright when you compute that gradient are all over the place, it's probably that the model is not even looking at the right place. It's just getting lucky. Okay? So this first method, saliency maps.","zh":"明白了？所以你可以这么做，虽然过去可能这么做，但现在不再这么做，但你可以用它来进行一个快速的分割合理性检查，因为亮度较高的像素，其梯度也较高，这些像素代表应该叠加在狗上的像素。事实上，如果你绘制显著性图，并发现计算该梯度时亮度较高的像素分布在整个图像中，这可能意味着模型根本没有关注正确的位置，它只是碰巧得到了正确的结果。明白了？所以这是第一种方法，显著性图。","start":1341.58,"end":1370.76},{"id":99,"text":"Now have that in your toolkit. Very easy to implement, right? You just write a Python script, you perform the gradient calculation, you print it, it's a matrix of pixels that are brighter or darker, and you're done. One of the main issues with saliency maps is that it's looking at just a pixel level, which doesn't make too much sense if you want to interpret semantically where the model is looking at.","zh":"现在把这个方法加入你的工具箱中。非常容易实现，对吧？你只需要编写一个Python脚本，进行梯度计算，打印出来，它就是一个亮度较高或较低的像素矩阵，你就完成了。显著性图的主要问题之一是它只关注像素级别，如果你想要语义上理解模型关注的位置，这并不太有意义。","start":1371.93,"end":1397.59},{"id":100,"text":"The model will never see a cat or a dog with one pixel being different than the rest. It would be too discontinuous. So instead, there's another method. I'm not going to go into the detail, but I link the paper, which is way more common, called integrated gradients. And integrated gradients, the idea is that instead of doing that directly by taking the ds of dog over dx, we're going to take an image of the animal and we're going to generate, you know,","zh":"模型永远不会看到一个猫或狗只有一像素与其他像素不同的图像。这会过于不连续。因此，还有一种其他方法。我不会深入细节，但我会链接到一篇更常见的论文，称为积分梯度。积分梯度的想法是，而不是直接通过计算狗的ds对dx的导数，我们将会生成一张动物的图像，并生成从完全黑色的零像素到动物最终图像的许多图像，然后我们将会查看这些图像的梯度路径。","start":1398.22,"end":1426.96},{"id":101,"text":"sort of many pictures that are taking dark, completely black zeros, a pixel all the way to the animal, the final image. And then we're going to look at the path of gradients across.","zh":"所有这些更新过程，它将更加具有解释性。我不会深入细节，但积分梯度只是显著性图的一种扩展，它使用了不同的公式，包含积分运算，并且更加常见。如果你从实际应用来看，这是一个来自医疗领域的例子，这里是一张视网膜的图像，如果你进行积分梯度计算，你会看到原始","start":1427.34,"end":1442.34},{"id":102,"text":"all of this update and it's going to be way more interpretive. I'm not going to go into the details but integrated gradients is just an extension of saliency maps that happens to use a different formula with an integration and is way more common. If you look at it practically, this is an example from the medical field, here is an image of a retina and if you perform the integrated gradients you would see that the original","zh":"所有这些更新，它将更具解释性。我不会深入细节，但积分梯度只是显著性图的一种扩展，它使用了一种不同的公式，通过积分实现，并且更为常见。从实际应用来看，这是一个来自医疗领域的例子，这里是一张视网膜的图像，如果你进行积分梯度计算，你会看到原始","start":1443.06,"end":1468.08},{"id":103,"text":"image, the annotation for the lesions are exactly where the model is looking at when it's giving you a probability that there is a lesion. So second method called integrated gradients. Let's push it a little further. The next case study is that you want to now tell them a little more about the decision process.","zh":"在图像中，病变的标注正好是模型在给出存在病变概率时所关注的位置。因此，第二种方法称为积分梯度。让我们进一步探讨。下一个案例研究是，你现在想要向他们更详细地解释决策过程。","start":1469.76,"end":1498.7}],"notes":["本段介绍了显著性图（saliency maps）的概念，这是一种通过计算梯度来可视化模型决策的工具。显著性图使用预softmax得分，仅代表当前分析的类别。通过计算梯度，可以识别出对模型决策影响较大的像素。如果显著性图中亮像素分布广泛，可能表明模型并未真正关注相关区域，而是偶然正确。"],"formulas":[],"uncertainties":["ds of dog over dx"],"diagram":"none","start":1332.56,"end":1498.7,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1332.56,"text":"method called saliency maps we use the pre-softmax scores that is only representative of the class at hand that you're analyzing."},{"start":1341.58,"text":"Okay? So you could do that, and actually if you were to, in the past, not anymore, but you could use that for a quick segmentation sanity check because the pixels that are brighter, the gradients that are brighter are representatives of the pixels that should be overlaid on the dog. And in fact, if you do the saliency maps and you realize that the pixels that are bright when you compute that gradient are all over the place, it's probably that the model is not even looking at the right place. It's just getting lucky. Okay? So this first method, saliency maps."},{"start":1371.93,"text":"now have that in your toolkit. Very easy to implement, right? You just write a Python script, you perform the gradient calculation, you print it, it's a matrix of pixels that are brighter or darker, and you're done. One of the main issues with saliency maps is that it's looking at just a pixel level, which doesn't make too much sense if you want to interpret semantically where the model is looking at."},{"start":1398.22,"text":"The model will never see a cat or a dog with one pixel being different than the rest. It would be too discontinuous. So instead, there's another method. I'm not going to go into the detail, but I link the paper, which is way more common, called integrated gradients. And integrated gradients, the idea is that instead of doing that directly by taking the ds of dog over dx, we're going to take an image of the animal and we're going to generate, you know,"},{"start":1427.34,"text":"sort of many pictures that are taking dark, completely black zeros, a pixel all the way to the animal, the final image. And then we're going to look at the path of gradients across."},{"start":1443.06,"text":"all of this update and it's going to be way more interpretive. I'm not going to go into the details but integrated gradients is just an extension of saliency maps that happens to use a different formula with an integration and is way more common. If you look at it practically, this is an example from the medical field, here is an image of a retina and if you perform the integrated gradients you would see that the original"},{"start":1469.76,"text":"image, the annotation for the lesions are exactly where the model is looking at when it's giving you a probability that there is a lesion. So second method called integrated gradients. Let's push it a little further. The next case study is that you want to now tell them a little more about the decision process."}],"speech_gaps":[],"frame":"../frames/v059/009.webp","frame_time":1344.56},{"title":"模型内部发生了什么：可视化方法","segments":[{"id":104,"text":"of the model with, I guess, let me rephrase. The saliency maps looked at the pixel level. What you can do in order to give a better intuition, which was mentioned earlier, is another approach called occlusion sensitivity, which is actually way more intuitive and simple, where you could actually take the dog image","zh":"关于模型的，我想重新表述一下。显著性图是在像素层面进行分析的。为了提供更好的直观理解，之前提到的另一种方法叫做遮挡敏感度，这种方法实际上更加直观和简单，你可以将狗的图像输入到CNN中，从而得到一个狗的得分。你也可以在图像上叠加一个黑暗的方块，将输入图像的部分区域置零或遮挡，然后将处理后的图像输入到相同的CNN中，并跟踪狗的得分变化。如果你这样做，就可以绘制出一个概率图，显示随着黑暗方块在图像上的移动，狗的得分是如何变化的。","start":1499.94,"end":1528.5},{"id":105,"text":"and paste it into the CNN and you would get a score of a dog. You could also overlay a dark square. So zero out or mask partially the input image and give it to the same CNN and track the modifications on the score of dog that you're tracking. If you actually do that, you can plot a probability map of how is the score of dog changing as I move the dark square through the image.","zh":"让我们一起进行这个实验。我会说，当黑暗方块放置在图像的左上角时，狗的得分没有变化，仍然非常高。现在你将方块向右移动一点，你仍然可以看到狗的得分非常高。再次移动，得分依然很高。现在方块部分遮挡了狗的脸，如果你的模型确实在看狗，你应该会看到狗的得分下降。你多次重复这个过程。因此，你用黑暗方块扫描整个图像，并绘制出我们称之为灰方块不同位置时真实类别的概率图。这是否清楚？这方法非常简单，但计算成本很高。","start":1529.22,"end":1558.9},{"id":106,"text":"So let's do it together. I'm going to say that this one, when you actually put the dark square on the top left of the image, the score of dog is unchanged. It's still very high. Now you move the square a little bit to the right, and you see that it's still very high, the score of dog. You do it again, still very high. Now the square is partially occluding the face of the dog, and you should see the score of dog drop if the model is in fact looking...","zh":"你只需要将图像多次重新输入到模型中。这里有一些实际的例子可以参考。第一个例子，真实标签是一只波美拉尼亚犬。可爱的小狗，你可以看到当方块与面部中心重叠时，模型无法识别真实类别，这很合理，因为我们追踪的真实类别不是狗，而是波美拉尼亚犬，你可以理解如果遮挡了面部，很难识别狗的品种。","start":1560.11,"end":1589.29},{"id":107,"text":"at the dog. And you perform that many times. So you scan through the image with your dark square and you plot what we call the probability map of the true class for different positions of the gray square. Does that make sense? So pretty simple, computationally expensive though.","zh":"第二个例子，真实标签是汽车轮毂。抱歉，我之前没有展示过。真实标签是汽车轮毂，你可以看到当方块位于轮毂上时，真实类别的得分确实下降了。","start":1589.63,"end":1609.76},{"id":108,"text":"Just have to rerun the image so many times through the model. Here are practical examples to look at. The first one, the true label is a Pomeranian.","zh":"只需要将图像多次重新通过模型进行处理。这里有一些实际的例子可以参考。第一个例子，真实的标签是一只波美拉尼亚犬。","start":1610.6,"end":1622.96},{"id":109,"text":"cute dog and you see that the model is failing to recognize the true class when the square is overlapping with sort of the center of the face which makes sense because here the true class that we're tracking is not dog it's pomeranian and i could see how if you occlude the face it's hard to get the breed of the dog","zh":"可爱的小狗，你可以看到当方框与面部中心部分重叠时，模型未能识别出真实的类别，这合乎逻辑，因为在我们追踪的真实类别中并不是狗，而是波美拉尼亚犬，我可以看出如果遮挡了面部，很难判断狗的品种。","start":1623.61,"end":1644.37},{"id":110,"text":"The second example, the true label is a car wheel. Sorry, I hadn't shown you that. The true label is a car wheel, and you can see that when the square is on the wheel, it is in fact dropping in terms of the true.","zh":"第二个例子，真实的标签是一辆汽车的轮子。抱歉，我之前还没有展示过这个例子。真实的标签是汽车的轮子，你可以看到当方框位于轮子上时，其真实类别的识别准确率确实有所下降。","start":1645.27,"end":1659.53}],"notes":["本段介绍了模型可视化方法中的遮挡敏感性（occlusion sensitivity）技术，该方法通过在输入图像上覆盖暗色方块，观察模型输出分数的变化，从而判断模型关注的区域。这种方法比像素级的显著性图（saliency maps）更直观，但计算成本较高。","讲者通过一个例子说明，当遮挡方块覆盖狗的面部区域时，模型对狗的识别分数会下降，这表明模型在识别狗时依赖面部特征。这说明模型的决策过程与人类的直觉一致，即面部是识别狗的关键区域。","另一个例子中，模型的真正标签是汽车轮毂，当遮挡方块覆盖轮毂区域时，模型的输出分数下降，这表明模型在识别汽车轮毂时依赖轮毂特征。","讲者指出，遮挡敏感性方法虽然直观，但需要多次运行模型，因此计算成本较高。这种方法适用于需要理解模型决策依据的场景，如图像分类任务。","讲者提到，遮挡敏感性方法可以用于分析模型对不同特征的依赖程度，例如在识别狗的品种时，面部特征可能比身体其他部分更重要。","讲者强调，遮挡敏感性方法是一种有效的可视化工具，可以帮助理解模型的内部机制，但需要注意遮挡区域的选择和实验设计的合理性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1499.94,"end":1659.53,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1499.94,"text":"of the model with, I guess, let me rephrase. The saliency maps looked at the pixel level. What you can do in order to give a better intuition, which was mentioned earlier, is another approach called occlusion sensitivity, which is actually way more intuitive and simple, where you could actually take the dog image"},{"start":1529.22,"text":"and paste it into the CNN and you would get a score of a dog. You could also overlay a dark square. So zero out or mask partially the input image and give it to the same CNN and track the modifications on the score of dog that you're tracking. If you actually do that, you can plot a probability map of how is the score of dog changing as I move the dark square through the image."},{"start":1560.11,"text":"So let's do it together. I'm going to say that this one, when you actually put the dark square on the top left of the image, the score of dog is unchanged. It's still very high. Now you move the square a little bit to the right, and you see that it's still very high, the score of dog. You do it again, still very high. Now the square is partially occluding the face of the dog, and you should see the score of dog drop if the model is in fact looking..."},{"start":1589.63,"text":"at the dog. And you perform that many times. So you scan through the image with your dark square and you plot what we call the probability map of the true class for different positions of the gray square. Does that make sense? So pretty simple, computationally expensive though."},{"start":1610.6,"text":"Just have to rerun the image so many times through the model. Here are practical examples to look at. The first one, the true label is a Pomeranian."},{"start":1623.61,"text":"cute dog and you see that the model is failing to recognize the true class when the square is overlapping with sort of the center of the face which makes sense because here the true class that we're tracking is not dog it's pomeranian and i could see how if you occlude the face it's hard to get the breed of the dog"},{"start":1645.27,"text":"The second example, the true label is a car wheel. Sorry, I hadn't shown you that. The true label is a car wheel, and you can see that when the square is on the wheel, it is in fact dropping in terms of the true."}],"speech_gaps":[],"frame":"../frames/v059/010.webp","frame_time":1511.94},{"title":"模型的可视化与解释性分析","segments":[{"id":111,"text":"class probability and then finally the afghan hound what's interesting about that third example is the probability is dropping when the square is on the dog but it's also increasing when the square is on the face of the human on the left which means that if you actually occlude the the face of the human the model thinks even more that the true class is in fact an afghan hound","zh":"类别概率，然后是阿富汗猎犬。第三个例子有趣的是，当方块在狗身上时，概率下降，但当方块在左边人类面部时，概率又在上升。这意味着如果你实际遮挡左边人类的面部，模型会认为真正的类别实际上更可能是阿富汗猎犬。","start":1660.06,"end":1683.54},{"id":112,"text":"You're just removing additional unnecessary information for it to discover the true class. So this model seems to be doing well, right? It seems to be looking in the right place. We call that occlusion sensitivity. Pretty simple. Another tool with saliency map and integrated gradients in your toolkit. Let's push it slightly further. Here.","zh":"你只是在移除额外的、不必要的信息，以便模型能够发现真正的类别。因此，这个模型似乎表现得不错，对吧？它似乎在正确的位置进行观察。我们称之为遮挡敏感性。相当简单。另一个工具，如显著性图和积分梯度，已经加入你的工具箱中。让我们稍微进一步探讨一下。","start":1685.68,"end":1712.74},{"id":113,"text":"Here we're given, along with the classification outputs, the zoo wants a real-time visualization of the model's decision process, and you have one day to show that. And we're talking about convolutions again. What do you do? So the important part is to know the methods that we've seen so far are sort of posts.","zh":"在这里，我们不仅得到了分类输出，动物园还希望实时可视化模型的决策过程，并且你只有一天时间来展示这一点。我们再次谈到卷积。你会怎么做？重要的是要知道，我们之前看到的方法基本上是后处理方法。","start":1715.53,"end":1738.33},{"id":114,"text":"methods where you analyze the output or you show something. Here we're looking at a sort of ideally a module that we could plug in our network that would constantly give us the decision-making process of the network, or at least where it's looking at. How would you do this? This is our network, by the way. We're taking an input, we're adding zero padding, and we have a series of conv value max pool blocks.","zh":"这些方法是你分析输出或展示某些内容的方法。在这里，我们希望有一个理想的模块，可以插入到我们的网络中，持续为我们提供网络的决策过程，或者至少是网络在关注的位置。你会怎么做？顺便说一句，这就是我们的网络。我们输入一个图像，添加零填充，然后有一系列卷积、最大池化块。","start":1739.0,"end":1769.14},{"id":115,"text":"And then at the end we flatten, we have a triple fully connected layer, a softmax, and we get our probability output for classification. So just first question, where do you think is the weakness of this network when it comes to interpreting where the model is looking at on a picture? A part of this architecture makes interpreting the network way harder. Why?","zh":"然后我们展平，接着是三个全连接层，一个softmax层，最终得到分类的概率输出。那么第一个问题，你认为这个网络在解释模型在图像上关注的位置时有什么弱点？这个架构的一部分使得解释网络变得更加困难。为什么？","start":1769.84,"end":1806.43}],"notes":["本段讨论了模型对图像中不同区域的敏感性，通过遮挡实验发现，当遮挡狗的区域时，模型对阿富汗猎犬类别的置信度下降，而遮挡人类面部时，置信度上升，说明模型在识别时更关注人类面部。这表明模型在决策过程中可能依赖于某些关键特征。","接下来，课程介绍了模型解释性的工具，如显著性图和积分梯度法，并提到这些方法属于后处理方法，即在模型输出后进行分析。课程进一步提出，需要一种能够实时可视化模型决策过程的模块，这可能涉及网络内部的结构设计。","课程展示了网络的结构，包括输入、零填充、卷积层、最大池化层、展平层、全连接层和softmax输出。课程提出，该网络在解释模型关注区域方面存在弱点，这可能与网络结构有关，例如卷积层和全连接层的组合使得模型决策过程难以直接可视化。","课程指出，网络结构中的某些部分（如卷积层和全连接层）使得模型的决策过程难以解释，因此需要设计一种能够实时展示模型决策过程的模块。这可能涉及对网络内部机制的深入理解，以及如何将解释性工具嵌入到网络中。","课程最后提出问题，要求学生思考网络结构中哪些部分导致了模型解释性的困难，并引导学生思考如何改进模型的可解释性。这表明课程关注模型的透明性和可解释性，这是深度学习模型的重要研究方向之一。","课程通过具体的例子和结构分析，帮助学生理解模型的决策过程，并引导学生思考如何改进模型的可解释性。这有助于学生在实际应用中更好地理解和调试深度学习模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1660.06,"end":1806.43,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1660.06,"text":"class probability and then finally the afghan hound what's interesting about that third example is the probability is dropping when the square is on the dog but it's also increasing when the square is on the face of the human on the left which means that if you actually occlude the the face of the human the model thinks even more that the true class is in fact an afghan hound"},{"start":1685.68,"text":"You're just removing additional unnecessary information for it to discover the true class. So this model seems to be doing well, right? It seems to be looking in the right place. We call that occlusion sensitivity. Pretty simple. Another tool with saliency map and integrated gradients in your toolkit. Let's push it slightly further. Here."},{"start":1715.53,"text":"Here we're given, along with the classification outputs, the zoo wants a real-time visualization of the model's decision process, and you have one day to show that. And we're talking about convolutions again. What do you do? So the important part is to know the methods that we've seen so far are sort of posts."},{"start":1739.0,"text":"methods where you analyze the output or you show something. Here we're looking at a sort of ideally a module that we could plug in our network that would constantly give us the decision-making process of the network, or at least where it's looking at. How would you do this? This is our network, by the way. We're taking an input, we're adding zero padding, and we have a series of conv value max pool blocks."},{"start":1769.84,"text":"And then at the end we flatten, we have a triple fully connected layer, a softmax, and we get our probability output for classification. So just first question, where do you think is the weakness of this network when it comes to interpreting where the model is looking at on a picture? A part of this architecture makes interpreting the network way harder. Why?"}],"speech_gaps":[],"frame":"../frames/v059/011.webp","frame_time":1672.06},{"title":"全连接层与局部信息的保留","segments":[{"id":116,"text":"Yeah, totally right. The fully connected layers, you're looking at all the pieces at the same time, you're mixing everything, and you're doing it three times. So by the end of those three layers, the information has been mixed together, essentially. You do not find the localized information that you had pre-that with the max pools and the conv layers. So how could you change that layer in order to avoid that? How would you modify your network if you wanted to retain maybe the performance of the model but not lose that?","zh":"是的，完全正确。全连接层是同时查看所有元素，将所有内容混合在一起，并且重复三次。因此，经过这三个层之后，信息基本上已经被混合在一起了。你不会找到在最大池化层和卷积层之前所拥有的局部信息。那么，你该如何修改这一层以避免这种情况呢？如果你想保留模型的性能，但又不丢失这些信息，你会如何修改你的网络？","start":1824.99,"end":1854.05},{"id":117,"text":"localized information.","zh":"局部信息。","start":1854.36,"end":1855.32},{"id":118,"text":"Yeah, good idea. Instead of doing three, can we do one? Can we still have a layer that makes the interpretation easy? Actually, there's another trick which we're going to see, but it's similar to what you described. Let's say we convert this network into something where the flattening of the pixels and the fully connected layers are converted into a single global average pooling layer and a fully connected.","zh":"是的，好主意。我们不是做三次，能不能只做一次？我们还能保留一个便于解释的层吗？实际上，还有一个技巧我们即将看到，但和你描述的类似。假设我们将这个网络转换成一个结构，其中像素的展平和全连接层被转换成一个全局平均池化层和一个全连接层。","start":1865.49,"end":1894.07},{"id":119,"text":"So here we reduce from three to one, the fully connected layers. We still need our fully connected layers in our softmax because it's a classification task and we want a good decision engine at the end. But we converted, we added a global average pooling. So let me explain why this is better. So the last conv block, essentially, is giving us a volume.","zh":"在这里，我们将全连接层从三个减少到一个。我们仍然需要全连接层在我们的softmax中，因为这是一个分类任务，我们希望在最后有一个良好的决策引擎。但我们进行了转换，我们添加了一个全局平均池化层。让我解释为什么这更好。基本上，最后一个卷积块会给我们一个体积。","start":1895.53,"end":1918.33},{"id":120,"text":"For the sake of simplicity, let's say that volume is a four by four with six channels. And I color coded them for simplicity. So each of these channels is a feature map that is resulting from a filter being scanned through the previous input. Everybody's clear on that? So global average pooling.","zh":"为了简化起见，假设这个体积是一个四乘四的矩阵，有六个通道。为了简化，我用颜色进行了标记。每个通道都是一个特征图，它是通过一个滤波器扫描前一层输入得到的。大家对这一点都清楚吗？全局平均池化。","start":1918.99,"end":1943.72},{"id":121,"text":"is going to take each of these channels, feature maps, and is going to average them in a single number. So if you take the orange matrix and you average it, it gives you 104.7. You do the same thing with the green one, the blue one, all six of them, and you get a volume, or call it a vector of size six, 116.","zh":"会将这些通道中的每一个特征图平均成一个单一的数值。例如，如果你取橙色矩阵并对其进行平均，你会得到104.7。你对绿色矩阵和蓝色矩阵做同样的事情，对所有六个通道都这样做，你会得到一个体积，或者称为一个大小为六的向量，即116。","start":1944.56,"end":1970.09},{"id":122,"text":"So why is that interesting? Because we actually did not lose the localized information. We did not mix things up. We just assigned a single number to a feature map that we retained. So the localized information is still there on the previous volume.","zh":"为什么这很有趣呢？因为我们实际上并没有丢失局部信息。我们并没有将信息混合在一起。我们只是将一个特征图分配了一个单一的数值，而保留了它。因此，局部信息仍然存在于之前的体积中。","start":1971.79,"end":1989.23}],"notes":["本段讨论了全连接层对信息混合的影响，以及如何通过全局平均池化层来保留局部信息。全连接层会将所有特征混合，导致局部信息丢失，而全局平均池化层则通过将每个特征图平均为一个数值，保留了局部信息。","教师提出了一种替代方案，即将全连接层替换为全局平均池化层，从而减少全连接层的数量，同时保留分类所需的决策能力。这种做法在保持模型性能的同时，避免了信息的过度混合。","教师以一个四乘四的体积和六个通道为例，说明了全局平均池化层的工作原理。每个通道对应一个特征图，通过平均操作将每个特征图转换为一个数值，最终得到一个六维向量。","教师强调，全局平均池化层不会丢失局部信息，而是将每个特征图的信息保留为一个数值，因此在后续的全连接层中仍然可以利用这些信息进行分类。","这种做法在卷积神经网络中被广泛应用，特别是在需要保留局部特征的场景中，如图像分类任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1824.99,"end":1989.23,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1824.99,"text":"Yeah, totally right. The fully connected layers, you're looking at all the pieces at the same time, you're mixing everything, and you're doing it three times. So by the end of those three layers, the information has been mixed together, essentially. You do not find the localized information that you had pre-that with the max pools and the conv layers. So how could you change that layer in order to avoid that? How would you modify your network if you wanted to retain maybe the performance of the model but not lose that?"},{"start":1854.36,"text":"localized information."},{"start":1865.49,"text":"Yeah, good idea. Instead of doing three, can we do one? Can we still have a layer that makes the interpretation easy? Actually, there's another trick which we're going to see, but it's similar to what you described. Let's say we convert this network into something where the flattening of the pixels and the fully connected layers are converted into a single global average pooling layer and a fully connected."},{"start":1895.53,"text":"So here we reduce from three to one, the fully connected layers. We still need our fully connected layers in our softmax because it's a classification task and we want a good decision engine at the end. But we converted, we added a global average pooling. So let me explain why this is better. So the last conv block, essentially, is giving us a volume."},{"start":1918.99,"text":"For the sake of simplicity, let's say that volume is a four by four with six channels. And I color coded them for simplicity. So each of these channels is a feature map that is resulting from a filter being scanned through the previous input. Everybody's clear on that? So global average pooling."},{"start":1944.56,"text":"is going to take each of these channels, feature maps, and is going to average them in a single number. So if you take the orange matrix and you average it, it gives you 104.7. You do the same thing with the green one, the blue one, all six of them, and you get a volume, or call it a vector of size six, 116."},{"start":1971.79,"text":"So why is that interesting? Because we actually did not lose the localized information. We did not mix things up. We just assigned a single number to a feature map that we retained. So the localized information is still there on the previous volume."}],"speech_gaps":[],"frame":"../frames/v059/012.webp","frame_time":1836.99},{"title":"模型内部发生了什么：类激活映射","segments":[{"id":123,"text":"And now we can treat that as a vector that goes through a decision engine or a fully connected layer that ultimately goes through our softmax and give us the probabilities. So this architecture is easier to trace back to localized information in the input space because you can actually look at, let's say, one of the score of dog, and you can look at the weights of each of these edges.","zh":"现在我们可以将它视为一个向量，经过决策引擎或全连接层，最终通过softmax给出概率。因此，这种架构更容易追溯到输入空间中的局部信息，因为你可以实际查看，比如说，狗的得分，然后查看这些边的每个权重。","start":1990.02,"end":2015.26},{"id":124,"text":"that tell you how much has the feature map from the volume before contributed to that score. So in other words, if I had to summarize, let's say the feature map looks like this. So this feature map is very high, has somehow activated heavily in some portion of the input image. The others similarly have activated.","zh":"这些权重告诉你，前面体积中的特征图对这个得分贡献了多少。换句话说，如果我要总结一下，比如说特征图看起来像这样。这个特征图非常高，在输入图像的某些部分被强烈激活。其他特征图也类似地被激活。","start":2016.06,"end":2037.94},{"id":125,"text":"To other things, you're taking the weights from your fully connected layer. By the way, you have to retrain that layer. You have to just train that layer, that last one. And then you sum all of them and it gives you what we call a class activation map for the class that you're visualizing. So you're overlaying those last six feature maps and you're weighing them with the weights of the last fully connected layer. You're not losing information. You're not mixing three fully connected layers that are impossible to trace back to the input space. Okay?","zh":"你从全连接层中取权重。顺便说一句，你必须重新训练这一层。你只需要训练最后一层。然后你将它们全部相加，这就会给你我们称之为类激活映射的类的可视化结果。因此，你叠加最后六个特征图，并用最后一层全连接层的权重对它们进行加权。你不会丢失信息，也不会混合三个无法追溯到输入空间的全连接层。好的？","start":2038.61,"end":2074.87},{"id":126,"text":"So if you now give it an input image and you overlay the class activation map for the score of dog, which you can do for other classes. You can do the same thing for the class of cat. Look at the different weights, the feature maps. And maybe for the class of cat, the weights will certainly be different. So the contribution of each feature map will be different. Yeah, and this is what you get. This is called class activation map.","zh":"现在如果你给它一个输入图像，并叠加狗的得分的类激活映射，你可以对其他类做同样的事情。比如说猫的类。查看不同的权重和特征图。对于猫的类，权重可能一定不同。因此，每个特征图的贡献也会不同。是的，这就是你得到的。这被称为类激活映射。","start":2075.38,"end":2098.09},{"id":127,"text":"It's from folks over at Berkeley. And so here's a video that describes it. It runs really quickly. You can think of it as a slight modification to a vision network that can allow you to unpack what's happening inside and what's the decision process. There is also sort of an improvement to the CAM or class activation map algorithm called GradCam, which enhances that method. Okay? Any questions on class activation maps?","zh":"它来自伯克利的研究人员。这里有一个视频描述了它。视频播放得非常快。你可以把它看
