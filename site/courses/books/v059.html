ystem of equations where Y1 equals W1 times 0 plus W2 times 0 because of the padding plus W3 times X1 plus W4 times X2, right?"}],"speech_gaps":[],"frame":"../frames/v059/019.webp","frame_time":3024.9},{"title":"卷积层的矩阵表示与逆变换","segments":[{"id":211,"text":"You're just overlaying the filter on top of the first four indices of the inputs, and you're doing a dot product. Same thing with the second one, third one, all the way to the fifth one, and that's your system of equation that describes this conv1d. Now, because it's a system of equation, you could actually write it as a matrix multiplication. So you could say..."},{"id":212,"text":"The CONV1D is literally just a weight matrix that we multiply by the input. So the input and the output sizes we know, 5, 1, and 12, 1. So the weight matrix is necessarily a 5 by 12 weight matrix. So we just rewrote the CONV1D as a single weight matrix that you multiply by the input to get the output. If you were to..."},{"id":213,"text":"draw this matrix, this is what it would look like. So it would be a matrix with values all along the diagonal and the rest are zeros. So that's our conclusion. Conv1d can be rewritten as a matrix vector multiplication. Everybody follows? So if you can write it as a matrix multiplication, remember we're talking about reverse engineering, then I could say dconv"},{"id":214,"text":"It's possible. It's possible to reverse engineer that. And in fact, I'm going to make a very big assumption that is not always true. Sometimes it's true, but for practical reasons, we're in deep learning, right? It's an engineering field. We're going to assume that W is invertible. And so you can find a matrix H that is equal to the inverse of W, such that X equals HY, so that you're able to reverse engineer."},{"id":215,"text":"the signal. I'm going to make a second assumption in the sizes I printed, which is even bigger, is that W is not only invertible, it is also orthogonal, meaning that its inverse is its transpose. It happens that it's sometimes true, and in fact..."}],"notes":["本段讲解了如何将一维卷积层（Conv1D）表示为矩阵乘法。通过将卷积操作视为多个滤波器与输入的点积，可以将其转化为一个线性系统，进而用矩阵乘法表示。这种转换有助于理解卷积操作的数学本质，并为反向工程（如反卷积）提供理论基础。","讲者指出，Conv1D可以被表示为一个权重矩阵与输入向量的乘积。输入和输出的尺寸分别为5×1和12×1，因此权重矩阵必须是5×12的。这种矩阵表示方式简化了对卷积操作的理解，并为后续的反向计算提供了可能。","在讨论反向工程时，讲者假设权重矩阵W是可逆的，并进一步假设W是正交矩阵，即其逆矩阵等于其转置。这种假设在实际应用中可能并不总是成立，但为了简化计算和工程实现，通常会做出这样的假设。","讲者强调，这些假设（如W的可逆性和正交性）在实际深度学习中可能并不总是成立，但出于工程实践的需要，通常会采用这些假设来简化计算。这表明在实际应用中，需要权衡理论上的严格性和计算的可行性。","讲者提到，通过将卷积操作表示为矩阵乘法，可以进一步进行反向工程，例如反卷积（dconv）。这表明矩阵表示不仅有助于理解卷积操作，还为模型的逆向操作提供了数学基础。","讲者指出，正交矩阵的假设在某些情况下成立，但并非总是如此。这表明在实际应用中，需要根据具体问题和数据特性来选择是否采用这些假设，以确保模型的准确性和稳定性。"],"formulas":[],"uncertainties":["dconv"],"diagram":"none","start":3184.56,"end":3339.12,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏明确的上下文和数学条件，无法验证其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3184.56,"text":"You're just overlaying the filter on top of the first four indices of the inputs, and you're doing a dot product. Same thing with the second one, third one, all the way to the fifth one, and that's your system of equation that describes this conv1d. Now, because it's a system of equation, you could actually write it as a matrix multiplication. So you could say..."},{"start":3214.11,"text":"The CONV1D is literally just a weight matrix that we multiply by the input. So the input and the output sizes we know, 5, 1, and 12, 1. So the weight matrix is necessarily a 5 by 12 weight matrix. So we just rewrote the CONV1D as a single weight matrix that you multiply by the input to get the output. If you were to..."},{"start":3245.07,"text":"draw this matrix, this is what it would look like. So it would be a matrix with values all along the diagonal and the rest are zeros. So that's our conclusion. Conv1d can be rewritten as a matrix vector multiplication. Everybody follows? So if you can write it as a matrix multiplication, remember we're talking about reverse engineering, then I could say dconv"},{"start":3287.98,"text":"It's possible. It's possible to reverse engineer that. And in fact, I'm going to make a very big assumption that is not always true. Sometimes it's true, but for practical reasons, we're in deep learning, right? It's an engineering field. We're going to assume that W is invertible. And so you can find a matrix H that is equal to the inverse of W, such that X equals HY, so that you're able to reverse engineer."},{"start":3317.18,"text":"the signal. I'm going to make a second assumption in the sizes I printed, which is even bigger, is that W is not only invertible, it is also orthogonal, meaning that its inverse is its transpose. It happens that it's sometimes true, and in fact..."}],"speech_gaps":[],"frame":"../frames/v059/020.webp","frame_time":3196.56},{"title":"卷积与反卷积的数学关系","segments":[{"id":216,"text":"If you think about an edge detector, so let's say our filter is minus one zero zero one, uh zero zero zero one. It's it's an edge detector. Sorry, I have one too many zeros, but it's an edge detector. Um, and it's actually um you know invertible and its inverse is its transpose. Um, and so that simplifies our reverse engineering because we have a conv1d."},{"id":217,"text":"And we know that we can write it as a matrix vector multiplication, and we can transpose that matrix to reverse it. And maybe it's not always true, but it's true enough for it to work in deep learning, pretty much. You're going to do that so many times, right? That's why in the literature, oftentimes deconvolutions are called transposed convolutions."},{"id":218,"text":"I give you the 1D example, the 2D example is similar, it's just more complicated. There's more math, things mix up, but same idea. Now, there is a trick that makes it simpler to code the deconvolution. And to see that trick, I just drew x equals w transpose y."},{"id":219,"text":"So, you have your x, which is a vector of size 12, although there's two padding at the top or at the bottom. And then I transpose the W matrix that I was showing you. And then I multiply that by my vector y of size 5. This is actually..."},{"id":220,"text":"A transpose convolution with stride 2 is equivalent to something slightly different, which is a subpixel convolution of stride 1 half. It's a mathematical trick."},{"id":221,"text":"You can do it at home, but you would see that these two operations are equivalent, meaning you can actually flip the filter. So you see in the right side, in the left side of the screen, the filters are flipped. So if you look at the first row of my matrix, it's not W1 through W4, it's W4 through W1. So I flipped the filter and I scanned it all the way through the diagonal."},{"id":222,"text":"I also used another trick, which is my Y vector. I inserted zeros in between the values. It's called subpixel. So I inserted zeros, and I also added some padding. So a couple of tricks, but..."}],"notes":["本段讲解了卷积和反卷积之间的数学关系，特别是反卷积可以通过转置矩阵实现。讲者提到，当卷积核是可逆的时，其逆矩阵就是其转置矩阵，这简化了反卷积的实现。此外，讲者还提到，反卷积在深度学习中被称作转置卷积，因为其操作方式与普通卷积相反。","讲者通过一个1D的例子说明了转置卷积的实现方式，即通过将卷积核转置后与输入向量相乘。同时，讲者指出，转置卷积与子像素卷积在数学上是等价的，这可以通过插入零值和添加填充来实现。","讲者还提到，转置卷积的实现中，卷积核的顺序会被翻转，例如，原本的W1到W4会被变为W4到W1。这种翻转操作是实现转置卷积的关键步骤之一。","讲者进一步说明了转置卷积的实现中，除了翻转卷积核外，还会在输入向量中插入零值，以模拟子像素卷积的效果。这种技巧使得转置卷积在代码实现上更加简单。","讲者强调，虽然转置卷积在数学上与子像素卷积等价，但它们在实际应用中可能有不同的表现，特别是在处理不同尺寸的输入时。","最后，讲者指出，转置卷积的实现涉及多个技巧，包括卷积核的翻转和输入向量的填充，这些技巧使得转置卷积在深度学习中成为一种重要的操作。"],"formulas":[{"latex":"x = W^T y","symbols":"x 是输入向量，W 是卷积核矩阵，y 是输出向量","explanation":"公式正确，表示转置卷积操作，x 是输入向量，W 是卷积核矩阵，y 是输出向量。","evidence":"I give you the 1D example, the 2D example is similar, it's just more complicated. There's more math, things mix up, but same idea. Now, there is a trick that makes it simpler to code the deconvolution. And to see that trick, I just drew x equals w transpose y."}],"uncertainties":["可能听不清的公式细节，如转置卷积与子像素卷积的具体数学等价关系"],"diagram":"none","start":3339.45,"end":3503.61,"asr_flags":[],"math_clarifications":["公式 x = W^T y 正确表示转置卷积操作，其中 W 是卷积核矩阵，x 是输入向量，y 是输出向量。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3339.45,"text":"if you think about an edge detector so let's say our filter is minus one zero zero one uh zero zero zero one it's it's a it's an edge detector sorry i have one too many zeros but it's an edge detector um and it's actually um you know invertible and its inverse is its transpose um and so that simplifies our reverse engineering because we have a conv1d"},{"start":3367.73,"text":"And we know that we can write it as a matrix vector multiplication, and we can transpose that matrix to reverse it. And maybe it's not always true, but it's true enough for it to work in deep learning, pretty much. You're going to do that so many times, right? That's why in the literature, oftentimes deconvolutions are called transposed convolutions."},{"start":3394.51,"text":"I give you the 1D example, the 2D example is similar, it's just more complicated. There's more math, things mix up, but same idea. Now, there is a trick that makes it simpler to code the deconvolution. And to see that trick, I just drew x equals w transpose y."},{"start":3422.41,"text":"So, you have your x, which is a vector of size 12, although there's two padding at the top or at the bottom. And then I transpose the W matrix that I was showing you. And then I multiply that by my vector y of size 5. This is actually..."},{"start":3443.56,"text":"a transpose convolution with stride 2 is equivalent to something slightly different, which is a subpixel convolution of stride 1 half. It's a mathematical trick."},{"start":3456.91,"text":"You can do it at home, but you would see that these two operations are equivalent, meaning you can actually flip the filter. So you see in the right side, in the left side of the screen, the filters are flipped. So if you look at the first row of my matrix, it's not W1 through W4, it's W4 through W1. So I flipped the filter and I scanned it all the way through the diagonal."},{"start":3487.47,"text":"I also used another trick, which is my Y vector. I inserted zeros in between the values. It's called subpixel. So I inserted zeros, and I also added some padding. So a couple of tricks, but..."}],"speech_gaps":[],"frame":"../frames/v059/021.webp","frame_time":3351.45},{"title":"反卷积与特征图反向重建","segments":[{"id":223,"text":"No need to remember it by heart. If there's anything you can remember, it's that implementing a deconvolution in the subpixel version I was describing is similar to a convolution. But what you do is you create a subpixel version of the inputs by adding zeros in between the values and padding it. You flip the filters and you divide the stripe by two. And that's what a deconvolution is."},{"id":224,"text":"If you have a convolutional neural network and you want to reverse engineer it, you take the filters, you flip them, you create a subpixel version of the input, you divide the stride by two, and you run the process, you will have reversed that convolution. The reason we're doing that is because we're just rewriting the convolution as another convolution, but the hyperparameters are different. But it's easy to code."},{"id":225,"text":"You're just reusing the same code pretty much. So anyway, let's get back to our example here. We have an image of a dog. We run it through a conv net and we pick at some point in that conv net a feature map. We pick one feature map only among the 256 possible feature maps right here."},{"id":226,"text":"And we're going to look at the max activation of that feature map. So we find the max. Let's say it's this one. So row two, column three is the maximum number of that feature map. What does it mean? It means the filter that led to that feature map, when it looked at its input, it was maximal in that location. It's maximally activated in that location. We zero out every other"},{"id":227,"text":"entries of this matrix, and then we reverse the network. So we max pooled, we unpooled. We reload, we do the reverse. We do a deconv instead of the conv, which is a transposed convolution, sub-pixel version, flip the filter, divide the stride by two. And we do that how many times? Three times, because we had three blocks. And then we should be able to reconstruct"},{"id":228,"text":"what this activation was maximally activated for, and we get the cropped version, as we learned, the cropped part of the image that this activation was looking at, and exactly the pixels that maximize its value. Does that make sense? It's pretty complex, but it's important to know these methods because you might run into something similar in the future or be asked to sort of interpret certain feature maps, certain activation maps, et cetera."}],"notes":["本段讲解了反卷积（deconvolution）的实现方式，将其描述为一种类似于卷积的操作，通过在输入值之间插入零、翻转滤波器并除以步长来实现。这表明反卷积是将卷积操作进行逆向处理的一种方法。","在反向工程卷积神经网络时，需要翻转滤波器、创建子像素版本的输入、将步长除以二，并重复该过程。这说明反卷积是将卷积操作重新表述为另一种卷积，但超参数不同。","在示例中，选取了图像中的一张特征图，并找到其最大激活值。这表明最大激活值对应于滤波器在输入图像中某个位置的最强响应。","通过将最大激活值的其他位置设为零，并反向操作网络（如反向池化、反向卷积），可以重建该激活值所关注的图像区域。这说明反向操作可以用于解释特征图的激活区域。","反向操作需要重复三次，因为网络中有三个块。这表明反向过程的次数与网络结构中的块数相关。","最终可以重建该激活值所关注的图像区域，并得到裁剪后的图像部分。这说明反向操作可以用于可视化特征图所关注的图像区域，从而帮助理解模型的内部机制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3504.23,"end":3683.3,"asr_flags":[],"raw_segments":[{"start":3504.23,"text":"No need to remember it by heart. If there's anything you can remember, it's that implementing a deconvolution in the subpixel version I was describing is similar to a convolution. But what you do is you create a subpixel version of the inputs by adding zeros in between the values and padding it. You flip the filters and you divide the stripe by two. And that's what a deconvolution is."},{"start":3532.11,"text":"If you have a convolutional neural network and you want to reverse engineer it, you take the filters, you flip them, you create a subpixel version of the input, you divide the stride by two, and you run the process, you will have reversed that convolution. The reason we're doing that is because we're just rewriting the convolution as another convolution, but the hyperparameters are different. But it's easy to code."},{"start":3562.92,"text":"You're just reusing the same code pretty much. So anyway, let's get back to our example here. We have an image of a dog. We run it through a conv net and we pick at some point in that conv net a feature map. We pick one feature map only among the 256 possible feature maps right here."},{"start":3591.76,"text":"And we're going to look at the max activation of that feature map. So we find the max. Let's say it's this one. So row two, column three is the maximum number of that feature map. What does it mean? It means the filter that led to that feature map, when it looked at its input, it was maximal in that location. It's maximally activated in that location. We zero out every other"},{"start":3622.86,"text":"entries of this matrix, and then we reverse the network. So we max pooled, we unpooled. We reload, we do the reverse. We do a deconv instead of the conv, which is a transposed convolution, sub-pixel version, flip the filter, divide the stride by two. And we do that how many times? Three times, because we had three blocks. And then we should be able to reconstruct"},{"start":3652.58,"text":"what this activation was maximally activated for, and we get the cropped version, as we learned, the cropped part of the image that this activation was looking at, and exactly the pixels that maximize its value. Does that make sense? It's pretty complex, but it's important to know these methods because you might run into something similar in the future or be asked to sort of interpret certain feature maps, certain activation maps, et cetera."}],"speech_gaps":[],"frame":"../frames/v059/022.webp","frame_time":3516.23},{"title":"反池化与ReLU的可逆性","segments":[{"id":229,"text":"Okay, so some additional details that we'll cover is what is unpool and why do we do some ReLU in there. So very simply, let's say I take the max pooling layer, I max pool this, filter size two by two, stride of two. If you wanted to unpool this, how would you do it? Or pooling layers, max pooling layers, invertible."},{"id":230,"text":"No. Why? Yeah. Yeah, exactly. It's not invertible because if you pick, you're right, the sixth here on the top left, you can tell that the sixth was in one of these four, but you don't know where it was. You can't invert. And it's very important to know where it was, right? So it's not invertible, but you could actually use a trick to make it invertible, which is passing what we call switches."},{"id":231,"text":"So during the forward propagation, you look at all your pooling, your max pooling, and you remember with the binary matrix, a very lightweight matrix, where the pooling happened, where the max pooling happened. And then when you're doing the unpooling, you remember those switches, so you keep them in memory, and you pass them back, and that should tell you where the value came from. So that's what we mean by unpooling."},{"id":232,"text":"Okay, so I go back to my previous map. The only thing I need to change to be able to reverse engineer my network is to pass the switches and the filters, by the way, because the decom is just the flip version of the filter with subpixel and stride divided by two. And so I do that. You can see you can literally invert your network here and trace back from one activation to the input space."},{"id":233,"text":"And then for relu is a little odd. I'm not going to spend too much time on it because it's more empirical than nothing. But relu forward is essentially zeroing out every value that is negative during the forward path. Technically, a relu backward is impossible unless you have also the switches. If you have the switches, you could actually, you know, pass linearly back whatever was kept because it's the identity function."}],"notes":["本段讲解了反池化（unpooling）的可逆性问题。池化层（如最大池化）在进行下采样时会丢失位置信息，因此无法直接反向操作。为了实现反池化，需要记录池化过程中哪些位置被选中，即所谓的‘开关’（switches）。这些信息在反向传播时被用来恢复原始位置信息，从而实现反池化。","在反池化过程中，需要将这些开关信息与滤波器（filter）一起传递，以便在反向操作时能够正确地恢复原始特征图。反池化操作实际上是将滤波器进行翻转，并结合子像素和步长信息，从而实现对原始特征图的重建。","对于ReLU激活函数，其前向传播会将负值置零，而反向传播则需要依赖开关信息来恢复梯度。如果没有开关信息，ReLU的反向传播是不可行的，因为无法确定哪些输入值被保留下来。","开关信息在反池化和ReLU的反向传播中都起着关键作用，它们允许模型在反向操作时恢复丢失的位置信息或梯度信息，从而实现网络的可逆性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3685.39,"end":3845.74,"asr_flags":[],"raw_segments":[{"start":3685.39,"text":"Okay, so some additional details that we'll cover is what is unpool and why do we do some ReLU in there. So very simply, let's say I take the max pooling layer, I max pool this, filter size two by two, stride of two. If you wanted to unpool this, how would you do it? Or pooling layers, max pooling layers, invertible."},{"start":3726.66,"text":"No. Why? Yeah. Yeah, exactly. It's not invertible because if you pick, you're right, the sixth here on the top left, you can tell that the sixth was in one of these four, but you don't know where it was. You can't invert. And it's very important to know where it was, right? So it's not invertible, but you could actually use a trick to make it invertible, which is passing what we call switches."},{"start":3765.45,"text":"So during the forward propagation, you look at all your pooling, your max pooling, and you remember with the binary matrix, a very lightweight matrix, where the pooling happened, where the max pooling happened. And then when you're doing the unpooling, you remember those switches, so you keep them in memory, and you pass them back, and that should tell you where the value came from. So that's what we mean by unpooling."},{"start":3791.37,"text":"Okay, so I go back to my previous map. The only thing I need to change to be able to reverse engineer my network is to pass the switches and the filters, by the way, because the decom is just the flip version of the filter with subpixel and stride divided by two. And so I do that. You can see you can literally invert your network here and trace back from one activation to the input space."},{"start":3817.9,"text":"And then for relu is a little odd. I'm not going to spend too much time on it because it's more empirical than nothing. But relu forward is essentially zeroing out every value that is negative during the forward path. Technically, a relu backward is impossible unless you have also the switches. If you have the switches, you could actually, you know, pass linearly back whatever was kept because it's the identity function."}],"speech_gaps":[],"frame":"../frames/v059/023.webp","frame_time":3697.39},{"title":"模型内部的激活与可视化","segments":[{"id":234,"text":"But actually, that would kill your positive signal coming back. So instead, you just reuse ReLU. Basically, you reuse a ReLU because you want to start from the activation that is the highest on your feature map and to keep passing the positive signal back to the input space. Don't worry too much about it. It's just that ReLU is just passed as a ReLU during the reconstruction process, not as a proper ReLU backward."},{"id":235,"text":"Okay, so here we go. We send our dog through the network. We look at a specific max pool output. We take the feature map. We find the activation that is the highest in that feature map. We zero out all the rest. We reverse engineer our network. We find the cropped part of this dog with the pixels that led to that specific feature map shining. We are interpreting the filter."},{"id":236,"text":"that led that feature map. And you can do that anywhere across, um, across the network. But of course, if you're earlier, the crop is going to be even smaller. If you're later, generally bigger. Okay? So you learned dconvs."},{"id":237,"text":"Now let's look at some practical visualizations from Matthew Zahler and Rob Fergus. These are great researchers in the space of visualizations. They've been making so much progress. So they trained the network. They looked at results on a validation set of 50,000 images."},{"id":238,"text":"So what you're seeing is the first layer and specifically the patches. What the patches are, they're the top nine strongest activation per filter. So for each filter in the first layer, they look at the top nine strongest activation and they remember the data points that was leading to that. So that's the data set search method that we saw together."},{"id":239,"text":"What are the nine images that led to that maximum, that feature map activating the most? Print them. Those are the patches for each filter. If you do that, you can already interpret some of the filters by seeing that, oh, this one reacts to edges that are diagonal, or this one reacts to edges that are straight, for example."}],"notes":["本段讲解了在神经网络中如何通过反向传播和ReLU激活函数来保留正向信号。讲者指出，直接使用ReLU可能会导致信号丢失，因此需要在反向传播过程中重新使用ReLU，以确保从特征图中最高激活值开始传递信号。","讲者通过一个具体的例子，说明如何通过反向工程来解释网络中的滤波器。具体来说，他们从最大池化输出中找到特征图中的最高激活值，然后裁剪出导致该特征图激活的图像部分，从而解释滤波器的功能。","讲者提到，这种反向工程方法可以在网络的任何位置进行，但越早的层裁剪的图像越小，越晚的层裁剪的图像越大。这说明了不同层在特征提取中的不同作用。","讲者介绍了Matthew Zahler和Rob Fergus在可视化方面的研究成果，他们通过训练网络并在验证集上评估结果，展示了第一层的激活情况。","讲者进一步解释了第一层的“patches”概念，即每个滤波器的最强激活值对应的九张图像。这些图像反映了滤波器对特定特征（如边缘）的响应。","最后，讲者指出，通过观察这些图像，可以解释滤波器的功能，例如某些滤波器对对角线边缘敏感，而另一些则对直线边缘敏感。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3847.21,"end":4004.33,"asr_flags":[],"raw_segments":[{"start":3847.21,"text":"But actually, that would kill your positive signal coming back. So instead, you just reuse ReLU. Basically, you reuse a ReLU because you want to start from the activation that is the highest on your feature map and to keep passing the positive signal back to the input space. Don't worry too much about it. It's just that ReLU is just passed as a ReLU during the reconstruction process, not as a proper ReLU backward."},{"start":3876.01,"text":"Okay, so here we go. We send our dog through the network. We look at a specific max pool output. We take the feature map. We find the activation that is the highest in that feature map. We zero out all the rest. We reverse engineer our network. We find the cropped part of this dog with the pixels that led to that specific feature map shining. We are interpreting the filter."},{"start":3902.12,"text":"that led that feature map. And you can do that anywhere across, um, across the network. But of course, if you're earlier, the crop is going to be even smaller. If you're later, generally bigger. Okay? So you learned dconvs."},{"start":3924.73,"text":"Now let's look at some practical visualizations from Matthew Zahler and Rob Fergus. These are great researchers in the space of visualizations. They've been making so much progress. So they trained the network. They looked at results on a validation set of 50,000 images."},{"start":3950.82,"text":"So what you're seeing is the first layer and specifically the patches. What the patches are, they're the top nine strongest activation per filter. So for each filter in the first layer, they look at the top nine strongest activation and they remember the data points that was leading to that. So that's the data set search method that we saw together."},{"start":3976.97,"text":"What are the nine images that led to that maximum, that feature map activating the most? Print them. Those are the patches for each filter. If you do that, you can already interpret some of the filters by seeing that, oh, this one reacts to edges that are diagonal, or this one reacts to edges that are straight, for example."}],"speech_gaps":[],"frame":"../frames/v059/024.webp","frame_time":3859.21},{"title":"模型内部发生了什么","segments":[{"id":240,"text":"On the bottom right, we actually print the filters raw. And of course, because it's the first layer, it is interpretable. So if in fact you have an edge detector, you should see when you print that matrix that it looks like an edge detector. That doesn't work for layers beyond one. So now let's go a little deeper. Now we're going layer two, and we're looking at the decoms. So what are they doing? They're essentially..."},{"id":241,"text":"They're essentially looking at the top one strongest activation per feature in the second layer. So the second layer has 256 feature maps. They're presented here. You pick one feature map. You look across all these 50,000 validation images. You find the maximum."},{"id":242,"text":"feature map, you take the specific portion of that feature map, the specific entry that's maximally activated, you zero out the rest."},{"id":243,"text":"You do your deconv, you pass the switches, blah, blah, blah, and you get the cropped part of the image that represents why it was activated. And this is printed all over here. And you can see, you can start interpreting that by doing the top one, or you can do the top nine. And if you actually do the top nine, you would start seeing that, in fact, certain filters have very clear purposes. Some filters detect circles. Some filters detect odd shapes."},{"id":244,"text":"If you keep doing that in layer three, you would start seeing with the deconv method that the filters are capturing more complex information. Remember in the first lecture we did together, I said that the deeper you go in the network, the more the information adds up and you get more complex features later. This is a proof of that, pretty much."},{"id":245,"text":"Now, if you go to layer three and you can do all of it."},{"id":246,"text":"You can do the top nine patches where if the nine patches look very similar,"},{"id":247,"text":"you know, you can probably safely say that this filter was responsible for this type of shape or color or, you know, salient feature."},{"id":248,"text":"And then you can do the deconv as well, essentially."},{"id":249,"text":"essentially. Let's watch together a very short video of Jason Yosinski that shows a little bit"},{"id":250,"text":"of everything we've learned together. They can recognize school buses and zebras and can tell"},{"id":251,"text":"the difference between Maltese terriers and Yorkshire terriers. We now know what it takes"},{"id":252,"text":"to train these neural networks well, but we don't know so much about how they're actually computing"},{"id":253,"text":"their final answers. We developed this interactive deep visualization toolbox to shine light into"},{"id":254,"text":"these black boxes, showing what happens inside of neural nets. In the top left corner, we show the"}],"notes":["本段讲解了如何通过反卷积方法可视化神经网络中各层的特征图。在第二层，通过选择每个特征图中激活最强的区域，并将其余部分置零，可以反卷积出对应的图像部分，从而理解该特征图的作用。","在第三层，通过反卷积方法可以观察到更复杂的特征，这证明了随着网络深度的增加，特征会逐渐变得复杂。这与第一讲中提到的网络越深，特征越复杂是一致的。","通过反卷积方法，可以识别出某些滤波器负责检测特定的形状或颜色，例如圆形或奇形。这表明神经网络能够学习到具有明确功能的特征。","通过展示视频，可以进一步理解神经网络如何识别不同物体，如校车和斑马，以及如何区分不同品种的狗。这说明了神经网络在训练后能够进行复杂的分类任务。","开发了一个交互式的深度可视化工具箱，用于揭示神经网络内部的黑箱操作，展示网络内部的处理过程。","在左上角展示了工具箱的界面，这有助于理解神经网络内部的处理流程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4005.13,"end":4184.2,"asr_flags":[],"raw_segments":[{"start":4005.13,"text":"On the bottom right, we actually print the filters raw. And of course, because it's the first layer, it is interpretable. So if in fact you have an edge detector, you should see when you print that matrix that it looks like an edge detector. That doesn't work for layers beyond one. So now let's go a little deeper. Now we're going layer two, and we're looking at the decoms. So what are they doing? They're essentially..."},{"start":4036.01,"text":"They're essentially looking at the top one strongest activation per feature in the second layer. So the second layer has 256 feature maps. They're presented here. You pick one feature map. You look across all these 50,000 validation images. You find the maximum."},{"start":4058.79,"text":"feature map, you take the specific portion of that feature map, the specific entry that's maximally activated, you zero out the rest."},{"start":4067.45,"text":"You do your deconv, you pass the switches, blah, blah, blah, and you get the cropped part of the image that represents why it was activated. And this is printed all over here. And you can see, you can start interpreting that by doing the top one, or you can do the top nine. And if you actually do the top nine, you would start seeing that, in fact, certain filters have very clear purposes. Some filters detect circles. Some filters detect odd shapes."},{"start":4100.76,"text":"If you keep doing that in layer three, you would start seeing with the deconv method that the filters are capturing more complex information. Remember in the first lecture we did together, I said that the deeper you go in the network, the more the information adds up and you get more complex features later. This is a proof of that, pretty much."},{"start":4126.26,"text":"Now, if you go to layer three and you can do all of it."},{"start":4131.02,"text":"You can do the top nine patches where if the nine patches look very similar,"},{"start":4136.08,"text":"you know, you can probably safely say that this filter was responsible for this type of shape or color or, you know, salient feature."},{"start":4148.84,"text":"And then you can do the deconv as well, essentially."},{"start":4152.56,"text":"essentially. Let's watch together a very short video of Jason Yosinski that shows a little bit"},{"start":4160.08,"text":"of everything we've learned together. They can recognize school buses and zebras and can tell"},{"start":4164.54,"text":"the difference between Maltese terriers and Yorkshire terriers. We now know what it takes"},{"start":4169.2,"text":"to train these neural networks well, but we don't know so much about how they're actually computing"},{"start":4173.18,"text":"their final answers. We developed this interactive deep visualization toolbox to shine light into"},{"start":4178.72,"text":"these black boxes, showing what happens inside of neural nets. In the top left corner, we show the"}],"speech_gaps":[],"frame":"../frames/v059/025.webp","frame_time":4017.13},{"title":"模型可视化与神经网络内部机制","segments":[{"id":255,"text":"input to the network, which can be a still image or video from a webcam. These black squares in the"},{"id":256,"text":"middle show the activations on a single layer of a network, in this case the popular deep neural"},{"id":257,"text":"network called AlexNet running in CAFE. By interacting with the network, we can see what"},{"id":258,"text":"some of the neurons are doing. For example, on this first layer, the unit in the center"},{"id":259,"text":"responds strongly to light to dark edges."},{"id":260,"text":"Its neighbor, one neuron over, responds"},{"id":261,"text":"to edges in the opposite direction, dark to light."},{"id":262,"text":"Using optimization, we can synthetically"},{"id":263,"text":"produce images that light up each neuron on this layer"},{"id":264,"text":"to see what each neuron is looking for."},{"id":265,"text":"We can scroll through every layer in the network"},{"id":266,"text":"to see what it does, including convolution, pooling,"},{"id":267,"text":"and normalization layers."},{"id":268,"text":"We can switch back and forth between showing"},{"id":269,"text":"showing the actual activations, and showing images synthesized to produce high activation."},{"id":270,"text":"This is the class model visualization method."},{"id":271,"text":"By the time we get to the fifth convolutional layer, the features being computed represent abstract concepts."},{"id":272,"text":"For example, this neuron seems to respond to faces."},{"id":273,"text":"We can further investigate this neuron by showing a few different types of information."},{"id":274,"text":"First, we can artificially create optimized images using new regularization techniques that are described in our paper."},{"id":275,"text":"That's the class model visualization."},{"id":276,"text":"That's the data set search."},{"id":277,"text":"And that's the decon."},{"id":278,"text":"We can see that it would respond more strongly if we had even darker eyes and rosier lips. We can also confirm that it cares about the head and shoulders, but ignores the arms and torso. We can even see that it fires to some extent for cat faces. Using backcrop or decon, we can see that this unit depends most strongly on a couple units in the previous layer, CONV4, and on about a dozen or so in CONV3. So because of decon, you can trace back the entire layers before."},{"id":279,"text":"The top nine images. Okay, I'm going to leave it to you, but you get the idea. These researchers built a toolkit that essentially reproduces some of the methods we've seen together, although we've seen more methods than what's in the toolkit. And so your kit is now able to answer many questions about convolution, such as, hey, what part of the input is responsible for the output? We now know that we can use occlusion sensitivity or class activation maps."},{"id":280,"text":"What is the role of a neuron, filter, layer? We have many methods that can allow us to do that. Can we check what the network focuses on given the input image? We have methods to do that. And how does the neural network see our world? We have the gradient ascent class model visualization method that allow us to maximize."}],"notes":["本段讲解了神经网络内部机制的可视化方法，包括通过激活图和合成图像来观察网络中各个神经元的响应。例如，第一层神经元对明暗边缘敏感，而相邻神经元则对相反方向的边缘敏感。通过优化技术，可以生成特定激活的图像，从而揭示每个神经元关注的特征。"],"formulas":[],"uncertainties":[],"diagram":"network","start":4184.2,"end":4356.18,"asr_flags":[],"raw_segments":[{"start":4184.2,"text":"input to the network, which can be a still image or video from a webcam. These black squares in the"},{"start":4189.74,"text":"middle show the activations on a single layer of a network, in this case the popular deep neural"},{"start":4193.96,"text":"network called AlexNet running in CAFE. By interacting with the network, we can see what"},{"start":4198.72,"text":"some of the neurons are doing. For example, on this first layer, the unit in the center"},{"start":4204.44,"text":"responds strongly to light to dark edges."},{"start":4208.48,"text":"Its neighbor, one neuron over, responds"},{"start":4210.84,"text":"to edges in the opposite direction, dark to light."},{"start":4215.38,"text":"Using optimization, we can synthetically"},{"start":4217.58,"text":"produce images that light up each neuron on this layer"},{"start":4219.78,"text":"to see what each neuron is looking for."},{"start":4222.22,"text":"We can scroll through every layer in the network"},{"start":4224.3,"text":"to see what it does, including convolution, pooling,"},{"start":4227.96,"text":"and normalization layers."},{"start":4229.76,"text":"We can switch back and forth between showing"},{"start":4231.7,"text":"showing the actual activations, and showing images synthesized to produce high activation."},{"start":4236.32,"text":"This is the class model visualization method."},{"start":4239.32,"text":"By the time we get to the fifth convolutional layer, the features being computed represent abstract concepts."},{"start":4246.34,"text":"For example, this neuron seems to respond to faces."},{"start":4249.64,"text":"We can further investigate this neuron by showing a few different types of information."},{"start":4253.68,"text":"First, we can artificially create optimized images using new regularization techniques that are described in our paper."},{"start":4259.1,"text":"That's the class model visualization."},{"start":4263.86,"text":"That's the data set search."},{"start":4270.46,"text":"And that's the decon."},{"start":4280.65,"text":"We can see that it would respond more strongly if we had even darker eyes and rosier lips. We can also confirm that it cares about the head and shoulders, but ignores the arms and torso. We can even see that it fires to some extent for cat faces. Using backcrop or decon, we can see that this unit depends most strongly on a couple units in the previous layer, CONV4, and on about a dozen or so in CONV3. So because of decon, you can trace back the entire layers before."},{"start":4310.01,"text":"The top nine images. Okay, I'm going to leave it to you, but you get the idea. These researchers built a toolkit that essentially reproduces some of the methods we've seen together, although we've seen more methods than what's in the toolkit. And so your kit is now able to answer many questions about convolution, such as, hey, what part of the input is responsible for the output? We now know that we can use occlusion sensitivity or class activation maps."},{"start":4337.24,"text":"What is the role of a neuron, filter, layer? We have many methods that can allow us to do that. Can we check what the network focuses on given the input image? We have methods to do that. And how does the neural network see our world? We have the gradient ascent class model visualization method that allow us to maximize."}],"speech_gaps":[{"start":4261.68,"end":4263.46},{"start":4267.76,"end":4270.06},{"start":4274.032,"end":4277.568},{"start":4277.568,"end":4279.92}],"frame":"../frames/v059/026.webp","frame_time":4196.2},{"title":"模型内部发生了什么：CNN与Transformer的对比","segments":[{"id":281,"text":"an input image with respect, sorry, find the input image that maximizes a certain activation. So that was the first part. Um, and then we're going to move toward frontier ideas. Any questions on CNNs? You feel like you have a better idea of how to look inside a CNN? So let me start by comparing CNNs."},{"id":282,"text":"Two more modern frontier networks. The core distinction is going to be that CNNs deal with localized information. They visualize edges, textures, and shapes. When in modern, call it LLMs, we visualize relationships and meanings between concepts or between tokens."},{"id":283,"text":"And this is because transformers are based on attention."},{"id":284,"text":"And that started with the attention is all you need paper,"},{"id":285,"text":"which essentially explained why attention on its own"},{"id":286,"text":"is highly performant and can allow us"},{"id":287,"text":"to model very complex relationships."},{"id":288,"text":"So, you know, by the way, this is just the first figure"},{"id":289,"text":"of the attention is all you need paper,"},{"id":290,"text":"which you should all be able to read and understand by now in the class."},{"id":291,"text":"And transformers really represent language using two very simple ideas that are visualizable."},{"id":292,"text":"We can interpret them to a certain extent."},{"id":293,"text":"The first one is the attention patterns."},{"id":294,"text":"Attention looks at the relationship between tokens."},{"id":295,"text":"So you look at a specific token, which can be a word, a subword, or a syllable."},{"id":296,"text":"You know, I'm going to simplify by saying it's a word and its relationship with other words in the training set."},{"id":297,"text":"And that's the attention that the transformer looking at it."},{"id":298,"text":"Each attention head learns different patterns."},{"id":299,"text":"So it can learn things like linking pronouns to nouns or tracking structures or enforcing a certain ordering."},{"id":300,"text":"And then I really like this visualization, which is from Jesse Vig in 2019."},{"id":301,"text":"And this visualization essentially shows you there is a very nice blog post that he wrote with a few figures where you can see he presents how attention can be visualized."}],"notes":["本段介绍了CNN和Transformer模型在内部机制上的核心区别。CNN处理局部信息，如边缘、纹理和形状，而Transformer通过注意力机制处理概念或标记之间的关系。这种区别源于Transformer基于注意力机制，而CNN则基于卷积操作。","课程提到注意力机制的起源是2017年的论文《Attention Is All You Need》，该论文解释了为什么注意力机制本身具有高性能，并且能够建模复杂的语义关系。","Transformer模型通过两个简单的可视化概念来表示语言：注意力模式和位置编码。注意力模式关注标记之间的关系，而位置编码则用于捕捉序列中的位置信息。","注意力机制允许每个注意力头学习不同的模式，例如将代词与名词连接、跟踪结构或强制某种顺序。这种机制使得Transformer能够处理复杂的语言结构。","课程还提到Jesse Vig在2019年的一篇博客文章中提供了注意力机制的可视化示例，展示了如何通过可视化来理解注意力机制的工作原理。","这些内容帮助学生理解如何通过可视化技术来探索和解释深度学习模型的内部机制，特别是CNN和Transformer之间的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4357.55,"end":4520.85,"asr_flags":[],"raw_segments":[{"start":4357.55,"text":"an input image with respect sorry find the input image that maximizes a certain activation super so that was the first part um and then we're going to move toward frontier ideas any questions on cnn's you feel like you have a better idea of how to look inside a cnn so let me start by comparing cnn's"},{"start":4389.35,"text":"two more modern frontier networks. The core distinction is going to be that CNNs deal with localized information. They visualize edges, textures, and shapes. When in modern, call it LLMs, we visualize relationships and meanings between concepts or between tokens."},{"start":4419.53,"text":"And this is because transformers are based on attention."},{"start":4425.29,"text":"And that started with the attention is all you need paper,"},{"start":4429.11,"text":"which essentially explained why attention on its own"},{"start":4433.49,"text":"is highly performant and can allow us"},{"start":4436.81,"text":"to model very complex relationships."},{"start":4440.83,"text":"So, you know, by the way, this is just the first figure"},{"start":4445.31,"text":"of the attention is all you need paper,"},{"start":4447.21,"text":"which you should all be able to read and understand by now in the class."},{"start":4452.71,"text":"And transformers really represent language using two very simple ideas that are visualizable."},{"start":4461.05,"text":"We can interpret them to a certain extent."},{"start":4464.29,"text":"The first one is the attention patterns."},{"start":4469.41,"text":"Attention looks at the relationship between tokens."},{"start":4472.89,"text":"So you look at a specific token, which can be a word, a subword, or a syllable."},{"start":4478.53,"text":"You know, I'm going to simplify by saying it's a word and its relationship with other words in the training set."},{"start":4485.09,"text":"And that's the attention that the transformer looking at it."},{"start":4490.25,"text":"Each attention head learns different patterns."},{"start":4493.33,"text":"So it can learn things like linking pronouns to nouns or tracking structures or enforcing a certain ordering."},{"start":4499.31,"text":"And then I really like this visualization, which is from Jesse Vig in 2019."},{"start":4508.63,"text":"And this visualization essentially shows you there is a very nice blog post that he wrote with a few figures where you can see he presents how attention can be visualized."}],"speech_gaps":[],"frame":"../frames/v059/027.webp","frame_time":4369.55},{"title":"嵌入与注意力机制在语言模型中的作用","segments":[{"id":302,"text":"In simple ways, what is the connection between a fixed token with the surrounding tokens? Let's say, um, so this is essentially the transformer analog to the CNN saliency maps that we looked at. Pretty much, the other things that transformers or more modern language models use embeddings. You know, during the pre-training phase, you're also learning embeddings."},{"id":303,"text":"You are ready to read the birth paper, in fact, now with the baggage you have from the class. And what's interesting about embeddings, and I printed a picture here from Garg in 2021, I also encourage you to see that."},{"id":304,"text":"Short blog post where he uses a visualization method called T-SNE. It's a dimensionality reduction method. We're not going to present it in the class, but it's taught actually a lot in biotech and healthcare. It's used very extensively for those of you who work with the Stanford Hospital. And it allows you to visualize embeddings. And embeddings are sort of how the language model perceives our words. So you would expect tokens that..."},{"id":305,"text":"Should have similar semantic meanings to be next to each other in that space, or tokens that have nothing to do with each other to be far away from each other in distance. And that can be a way to sanity check that your model actually is learning meaningful representations. So together, attention and embeddings are what let large language models track relationships and meanings."},{"id":306,"text":"And you can visualize your embeddings with dimensionality reduction tool. You can visualize attention relationships as well. Unfortunately, the modern transformers are so complicated that even the cutting-edge research is only able to interpret those relationships with two-layer transformers, pretty much."},{"id":307,"text":"The best you find out there is probably Anthropic's work, so I linked two papers. The first one is called The Mathematical Framework for Transformer Circuits, which is essentially explaining how the different components within a transformer interact with each other, and they introduce the concept of a circuit. And then the second one is a follow-up to that paper called..."},{"id":308,"text":"In-context learning with induction heads. Induction heads are probably the best tool we have to sort of visualize what's happening inside a transformer. It's pretty complex. You should be able to understand it by now, but you'd have to spend quite some time to go deeper into it. I just will link them. We're not going to talk about it for the sake of time. Let's get to..."}],"notes":["本段讲解了嵌入（embeddings）在语言模型中的作用，即语言模型如何通过嵌入来感知词语。嵌入是模型对词语的表示，通过可视化方法如T-SNE可以观察这些嵌入在空间中的分布。相似语义的词应彼此接近，而无关词则应远离，这可以作为模型是否学习到有意义表示的检验方法。","嵌入与注意力机制共同作用，使大语言模型能够追踪词语之间的关系和含义。注意力机制允许模型关注输入中的不同部分，而嵌入则提供了词语的向量表示。","现代Transformer模型非常复杂，即使是最前沿的研究也只能通过两层Transformer来解释其内部关系。Anthropic的论文提供了对Transformer内部机制的深入分析，特别是通过“电路”这一概念。","“感应头”（induction heads）是目前可视化Transformer内部机制的最佳工具。它允许研究者观察模型在处理输入时的内部表示和关系，但理解这些机制需要深入研究。","课程鼓励学生阅读相关论文，如Garg 2021年的博客和Anthropic的两篇论文，以进一步理解Transformer的内部机制。","课程提到T-SNE是一种降维方法，常用于生物技术和医疗领域，特别是与斯坦福医院相关的工作中。它被广泛用于可视化嵌入，帮助理解模型如何表示词语。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4521.5,"end":4697.53,"asr_flags":[],"raw_segments":[{"start":4521.5,"text":"in simple ways what is the connection between a fixed token with the surrounding tokens let's say um so this is essentially the transformer analog to the cnn saliency maps that we looked at pretty much the other things that transformers or more modern language model uses embeddings you know during the pre-training phase you're also learning embeddings"},{"start":4554.39,"text":"you are ready to read the birth paper, in fact, now with the baggage you have from the class. And what's interesting about embeddings, and I printed a picture here from Garg in 2021, I also encourage you to see that."},{"start":4571.59,"text":"short blog post where he uses a visualization method called T-SNE. It's a dimensionally reduction method. We're not going to present it in the class, but it's taught actually a lot in biotech and healthcare. It's used very extensively for those of you who work with the Stanford Hospital. And it allows you to visualize embeddings. And embeddings are sort of how the language model perceives our words. So you would expect tokens that..."},{"start":4598.59,"text":"should have similar semantic meanings to be next to each other in that space, or tokens that have nothing to do with each other to be far away from each other in distance. And that can be a way to sanity check that your model actually is learning meaningful representations. So together, attention and embeddings are what let large language models track relationship and meanings."},{"start":4624.88,"text":"And you can visualize your embeddings with dimensionally reduction tool. You can visualize attention relationships as well. Unfortunately, the modern transformers are so complicated that even the cutting-edge research is only able to interpret those relationships with two-layer transformers, pretty much."},{"start":4651.97,"text":"The best you find out there is probably Anthropic's work, so I linked two papers. The first one is called The Mathematical Framework for Transformer Circuits, which is essentially explaining how the different components within a transformer interact with each other, and they introduce the concept of a circuit. And then the second one is a follow-up to that paper called..."},{"start":4673.33,"text":"in-context learning with induction heads. Induction heads are probably the best tool we have to sort of visualize what's happening inside a transformer. It's pretty complex. You should be able to understand it by now, but you'd have to spend quite some time to go deeper into it. I just will link them. We're not going to talk about it for the sake of time. Let's get to..."}],"speech_gaps":[],"frame":"../frames/v059/028.webp","frame_time":4533.5},{"title":"模型训练与诊断","segments":[{"id":309,"text":"Some fun stuff. Training and scaling diagnostics. So how do labs, frontier labs, check if a model is training well? We've talked about it in the first case study, but one very natural way is to look at our loss curves. You can look at the training loss, at the validation loss, and make sure that they follow sort of a smooth..."},{"id":310,"text":"you can look at the training loss, at the validation loss, and make sure that they follow sort of a smooth trajectory and if it's not smooth there's probably something that went wrong you've probably trained your own network where some loss functions look very funky I remember back in the days there was even blogs where people would post their ugliest loss functions and there was a lot on there you might find sudden jumps on the loss that means maybe the the batch that has been processed has been corrupted maybe you're doing extremely well on it when you should actually not"},{"id":311,"text":"you know, do that well, and it might raise a flag. You might, you know, find bugs in your code because of that. You might find gradients that are exploding, gradients that are vanishing. All of that you could visualize at the loss function level. Now, note that loss functions can be run at a global level or at a, you know, on a specific subset of your data. We're going to talk about it in data diagnostics."},{"id":312,"text":"The other things that are interesting to track also sometimes referred to in the community as training telemetry is to watch and track your gradient norms, look at your learning rate schedule, or even look at hardware efficiency metrics to feel if you've underutilized compute, which we talked about again in the first part. So imagine that if you're working at a..."},{"id":313,"text":"They don't want to give it out because it will leak, essentially, information about their architecture, about what's going well, what's not going well, et cetera. And that's why you find very few information on these. The one thing that you do find some charts on that are really helpful is scaling laws."},{"id":314,"text":"They don't want to give it out because it will leak, essentially, information about their architecture, about what's going well, what's not going well, et cetera. And that's why you find very few information on these. The one thing that you do find some charts on that are really helpful is scaling laws."},{"id":315,"text":"Scaling laws, which we've talked about in a previous lecture, is essentially trying to understand the relationship between our model performance and some other"},{"id":316,"text":"call it hyperparameters, such as the model capacity, so the size of the model, the amount of compute that's being used, or the dataset size. DeepMind has done amazing work, I think it was in 2022, a couple of years ago, with Chinchilla. This chart is..."}],"notes":["本段主要讲解了模型训练过程中如何通过损失曲线来诊断模型是否训练良好。讲者提到，可以通过观察训练损失和验证损失的平滑性来判断模型是否正常训练，如果出现突然的跳跃，可能意味着数据批次被损坏或模型在某些部分表现异常。","讲者还提到，损失函数可以在全局或特定数据子集上运行，这有助于更细致地分析模型表现。此外，还提到了梯度范数、学习率调度和硬件效率指标等其他训练监控指标，这些可以帮助判断计算资源是否被充分利用。","讲者指出，大型前沿实验室通常会有一个仪表板来跟踪不同数据子集的损失函数、检查点等信息，但由于这些信息涉及知识产权，很少对外公开。然而，一些关于扩展定律（scaling laws）的图表仍然可以找到，这些图表有助于理解模型性能与模型容量、计算量和数据集大小之间的关系。","扩展定律是理解模型性能与模型容量、计算量和数据集大小之间关系的重要工具。讲者提到，DeepMind在2022年左右的Chinchilla研究中对此进行了深入探讨，这些研究结果有助于指导模型的扩展策略。"],"formulas":[],"uncertainties":["call it hyperparameters"],"diagram":"none","start":4698.13,"end":4873.98,"asr_flags":[],"raw_segments":[{"start":4698.13,"text":"Some fun stuff. Training and scaling diagnostics. So how do labs, frontier labs, check if a model is training well? We've talked about it in the first case study, but one very natural way is to look at our loss curves. You can look at the training loss, at the validation loss, and make sure that they follow sort of a smooth..."},{"start":4721.53,"text":"trajectory and if it's not smooth there's probably something that went wrong you've probably trained your own network where some loss functions look very funky i remember back in the days there was even blogs where people would post their ugliest loss functions and there was a lot on there you might find sudden jumps on the loss that means maybe the the batch that has been processed has been corrupted maybe you're doing extremely well on it when you should actually not"},{"start":4750.31,"text":"you know, do that well, and it might raise a flag. You might, you know, find bugs in your code because of that. You might find gradients that are exploding, gradients that are vanishing. All of that you could visualize at the loss function level. Now, note that loss functions can be run at a global level or at a, you know, on a specific subset of your data. We're going to talk about it in data diagnostics."},{"start":4776.27,"text":"The other things that are interesting to track also sometimes referred to in the community as training telemetry is to watch and track your gradient norms, look at your learning rate schedule, or even look at hardware efficiency metrics to feel if you've underutilized compute, which we talked about again in the first part. So imagine that if you're working at a..."},{"start":4804.34,"text":"major frontier lab, you probably have a dashboard that tracks your different loss function for different subsets of the data, your checkpoints, all of that. You would have all of that. Unfortunately, very few of these are published because they're IP. They can't really..."},{"start":4821.97,"text":"They don't want to give it out because it will leak, essentially, information about their architecture, about what's going well, what's not going well, et cetera. And that's why you find very few information on these. The one thing that you do find some charts on that are really helpful is scaling laws."},{"start":4840.8,"text":"Scaling laws, which we've talked about in a previous lecture, is essentially trying to understand the relationship between our model performance and some other"},{"start":4854.26,"text":"call it hyperparameters, such as the model capacity, so the size of the model, the amount of compute that's being used, or the dataset size. DeepMind has done amazing work, I think it was in 2022, a couple of years ago, with Chinchilla. This chart is..."}],"speech_gaps":[],"frame":"../frames/v059/029.webp","frame_time":4710.13},{"title":"模型规模与训练效果的分析","segments":[{"id":317,"text":"borrowed from the chinchilla paper, where essentially what I want you to look at here is they're comparing the chinchilla model, the green star, to other models, including GPT-3, which came up a little before. And what they're showing is that the scaling law is actually slightly different than what OpenAI thought."},{"id":318,"text":"they analyzed GPT-3 and they said GPT-3 is actually not performing well enough for the size that it is at and it was found that GPT-3 was not trained for long enough they essentially explained that if you kept training GPT-3 for longer you would have had way better performance and it was not about the model size in fact the model was underutilized"},{"id":319,"text":"So they plotted these lines. So the dotted line is what probably we thought in 2020, 21, the scaling law, the power law would be. And they showed that it's actually not exactly that. Where essentially the idea is they plot the full line here and they say, this is our analysis of the scaling law. If your star is above that line, it's probably that your model should be trained longer."},{"id":320,"text":"If it's on the line, it's respecting the scaling laws that they're finding. And that's what's interesting about this Chinchilla paper. So that's after the GPT-3 paper. Chinchilla came in 2022 saying you should have trained GPT-3 longer, you would have done better. And here's Chinchilla model that has less parameters than GPT-3, so 70 billion versus 175 billion, and that is performing better. Yes."},{"id":321,"text":"To go deeper, I also pulled a few charts that show you the power laws between the loss function. So on the vertical axis, you have the test loss."},{"id":322,"text":"That shows essentially your performance on the test set. And then on the horizontal axis, on the x-axis, you have compute, data set size, and parameters. So how are those scaling laws established? Essentially, they fix two of them, and they vary the third one, and they see if things are respected. Meaning, let's say you're increasing the, you're keeping the same compute, the same data set size, but you're training a model that is twice as big."}],"notes":["本段主要讨论了Chinchilla论文中对模型规模与训练效果之间关系的分析。Chinchilla论文指出，GPT-3模型虽然参数量较大，但训练时间不足，导致其性能未达到预期。论文认为，如果GPT-3继续训练更长时间，其性能会显著提升，而不是单纯依赖模型规模。这表明模型的训练时间对性能有重要影响。","Chinchilla论文还展示了不同模型在不同参数量和训练时间下的表现。通过绘制的曲线，论文指出如果模型的表现点位于曲线之上，说明该模型可能需要更长的训练时间。如果模型的表现点位于曲线上，则说明其符合当前发现的缩放定律。","Chinchilla模型的参数量（700亿）少于GPT-3（1750亿），但其性能却更好，这进一步支持了训练时间对模型性能的重要性。这表明模型的性能不仅取决于参数量，还与训练时间密切相关。","在分析缩放定律时，研究者通过固定两个变量（如计算资源和数据集大小），并改变第三个变量（如模型参数量），来观察模型性能是否符合预期的缩放规律。这种方法有助于理解不同因素对模型性能的影响。","论文还提到，测试损失是衡量模型性能的重要指标，它反映了模型在测试集上的表现。通过分析损失函数与计算资源、数据集大小和参数量之间的关系，可以更全面地理解模型的训练效果。","Chinchilla论文的发现对后续模型设计和训练策略具有重要影响，表明在模型开发过程中，除了增加参数量外，还需要考虑训练时间的优化，以达到更好的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4875.08,"end":5033.66,"asr_flags":[],"raw_segments":[{"start":4875.08,"text":"borrowed from the chinchilla paper, where essentially what I want you to look at here is they're comparing the chinchilla model, the green star, to other models, including GPT-3, which came up a little before. And what they're showing is that the scaling law is actually slightly different than what OpenAI thought."},{"start":4899.88,"text":"they analyzed GPT-3 and they said GPT-3 is actually not performing well enough for the size that it is at and it was found that GPT-3 was not trained for long enough they essentially explained that if you kept training GPT-3 for longer you would have had way better performance and it was not about the model size in fact the model was underutilized"},{"start":4923.75,"text":"So they plotted these lines. So the dotted line is what probably we thought in 2020, 21, the scaling law, the power law would be. And they showed that it's actually not exactly that. Where essentially the idea is they plot the full line here and they say, this is our analysis of the scaling law. If your star is above that line, it's probably that your model should be trained longer."},{"start":4953.8,"text":"If it's on the line, it's respecting the scaling laws that they're finding. And that's what's interesting about this Chinchilla paper. So that's after the GPT-3 paper. Chinchilla came in 2022 saying you should have trained GPT-3 longer, you would have done better. And here's Chinchilla model that has less parameters than GPT-3, so 70 billion versus 175 billion, and that is performing better. Yes."},{"start":4990.67,"text":"To go deeper, I also pulled a few charts that show you the power laws between the loss function. So on the vertical axis, you have the test loss."},{"start":5005.03,"text":"That shows essentially your performance on the test set. And then on the horizontal axis, on the x-axis, you have compute, data set size, and parameters. So how are those scaling laws established? Essentially, they fix two of them, and they vary the third one, and they see if things are respected. Meaning, let's say you're increasing the, you're keeping the same compute, the same data set size, but you're training a model that is twice as big."}],"speech_gaps":[],"frame":"../frames/v059/030.webp","frame_time":4887.08}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
