if you go to layer three and you can do all of it."},{"start":4131.02,"text":"You can do the top nine patches where if the nine patches look very similar,"},{"start":4136.08,"text":"you know, you can probably safely say that this filter was responsible for this type of shape or color or, you know, salient feature."},{"start":4148.84,"text":"And then you can do the deconv as well, essentially."},{"start":4152.56,"text":"essentially. Let's watch together a very short video of Jason Yosinski that shows a little bit"},{"start":4160.08,"text":"of everything we've learned together. They can recognize school buses and zebras and can tell"},{"start":4164.54,"text":"the difference between Maltese terriers and Yorkshire terriers. We now know what it takes"},{"start":4169.2,"text":"to train these neural networks well, but we don't know so much about how they're actually computing"},{"start":4173.18,"text":"their final answers. We developed this interactive deep visualization toolbox to shine light into"},{"start":4178.72,"text":"these black boxes, showing what happens inside of neural nets. In the top left corner, we show the"}],"speech_gaps":[],"frame":"../frames/v059/025.webp","frame_time":4017.13},{"title":"模型可视化与神经网络内部机制","segments":[{"id":255,"text":"input to the network, which can be a still image or video from a webcam. These black squares in the","zh":"网络的输入，可以是来自网络摄像头的静态图像或视频。这些中间的黑色方块显示了网络单一层上的激活情况，","start":4184.2,"end":4189.74},{"id":256,"text":"middle show the activations on a single layer of a network, in this case the popular deep neural","zh":"在这个例子中，是名为AlexNet的流行深度神经网络在CAFE中运行。通过与网络进行交互，我们可以看到一些神经元在做什么。","start":4189.74,"end":4193.96},{"id":257,"text":"network called AlexNet running in CAFE. By interacting with the network, we can see what","zh":"例如，在这一层中，中心的单元对从亮到暗的边缘有强烈反应。","start":4193.96,"end":4198.72},{"id":258,"text":"some of the neurons are doing. For example, on this first layer, the unit in the center","zh":"它的邻居，隔壁的一个神经元，对相反方向的边缘，即从暗到亮有反应。","start":4198.72,"end":4204.44},{"id":259,"text":"responds strongly to light to dark edges.","zh":"使用优化方法，我们可以合成地","start":4204.44,"end":4206.36},{"id":260,"text":"Its neighbor, one neuron over, responds","zh":"展示这些神经元的响应。","start":4208.48,"end":4210.84},{"id":261,"text":"to edges in the opposite direction, dark to light.","zh":"从暗到亮，方向相反。","start":4210.84,"end":4212.98},{"id":262,"text":"Using optimization, we can synthetically","zh":"利用优化，我们可以合成","start":4215.38,"end":4217.58},{"id":263,"text":"produce images that light up each neuron on this layer","zh":"生成点亮该层每个神经元的图像","start":4217.58,"end":4219.78},{"id":264,"text":"to see what each neuron is looking for.","zh":"以查看每个神经元在寻找什么。","start":4219.78,"end":4221.42},{"id":265,"text":"We can scroll through every layer in the network","zh":"我们可以滚动查看网络中的每一层","start":4222.22,"end":4224.3},{"id":266,"text":"to see what it does, including convolution, pooling,","zh":"以了解其作用，包括卷积层、池化层，","start":4224.3,"end":4227.32},{"id":267,"text":"and normalization layers.","zh":"以及归一化层。","start":4227.96,"end":4228.82},{"id":268,"text":"We can switch back and forth between showing","zh":"我们可以切换显示","start":4229.76,"end":4231.7},{"id":269,"text":"showing the actual activations, and showing images synthesized to produce high activation.","zh":"实际激活值与合成图像以产生高激活值之间的显示模式。","start":4231.7,"end":4235.7},{"id":270,"text":"This is the class model visualization method.","zh":"这就是类别模型可视化方法。","start":4236.32,"end":4238.32},{"id":271,"text":"By the time we get to the fifth convolutional layer, the features being computed represent abstract concepts.","zh":"当我们到达第五个卷积层时，所计算的特征代表抽象的概念。","start":4239.32,"end":4244.46},{"id":272,"text":"For example, this neuron seems to respond to faces.","zh":"例如，这个神经元似乎对人脸有反应。","start":4246.34,"end":4249.14},{"id":273,"text":"We can further investigate this neuron by showing a few different types of information.","zh":"我们可以通过展示几种不同类型的信息来进一步研究这个神经元。","start":4249.64,"end":4252.76},{"id":274,"text":"First, we can artificially create optimized images using new regularization techniques that are described in our paper.","zh":"首先，我们可以使用我们在论文中描述的新正则化技术，人工创建优化的图像。","start":4253.68,"end":4259.1},{"id":275,"text":"That's the class model visualization.","zh":"这就是类别模型可视化。","start":4259.1,"end":4261.28},{"id":276,"text":"That's the data set search.","zh":"这就是数据集搜索。","start":4263.86,"end":4267.36},{"id":277,"text":"And that's the decon.","zh":"这就是反卷积。","start":4270.46,"end":4272.26},{"id":278,"text":"We can see that it would respond more strongly if we had even darker eyes and rosier lips. We can also confirm that it cares about the head and shoulders, but ignores the arms and torso. We can even see that it fires to some extent for cat faces. Using backcrop or decon, we can see that this unit depends most strongly on a couple units in the previous layer, CONV4, and on about a dozen or so in CONV3. So because of decon, you can trace back the entire layers before.","zh":"我们可以看到，如果我们有更暗的眼睛和更红的嘴唇，它会反应得更强烈。我们还可以确认它关注头部和肩膀，但忽略手臂和躯干。我们甚至可以看到它在一定程度上对猫脸也有反应。通过反卷积或反卷积，我们可以看到这个单元最强烈地依赖于前一层CONV4中的几个单元，以及CONV3中的大约十几个单元。因此，由于反卷积，你可以追溯到前面的所有层。","start":4280.65,"end":4309.14},{"id":279,"text":"The top nine images. Okay, I'm going to leave it to you, but you get the idea. These researchers built a toolkit that essentially reproduces some of the methods we've seen together, although we've seen more methods than what's in the toolkit. And so your kit is now able to answer many questions about convolution, such as, hey, what part of the input is responsible for the output? We now know that we can use occlusion sensitivity or class activation maps.","zh":"前九张图片。好的，我把它留给你，但你应该明白我的意思。这些研究人员构建了一个工具包，基本上重现了我们之前一起看到的一些方法，尽管我们看到的方法比工具包中包含的更多。因此，你现在能够用这个工具包回答许多关于卷积的问题，例如：输入中的哪一部分对输出负责？我们现在知道可以使用遮挡敏感性或类别激活图来实现这一点。","start":4310.01,"end":4335.81},{"id":280,"text":"What is the role of a neuron, filter, layer? We have many methods that can allow us to do that. Can we check what the network focuses on given the input image? We have methods to do that. And how does the neural network see our world? We have the gradient ascent class model visualization method that allow us to maximize.","zh":"神经元、滤波器、层的作用是什么？我们有许多方法可以做到这一点。我们可以检查给定输入图像时网络关注的是什么吗？我们有相应的方法可以做到这一点。神经网络是如何看待我们的世界的？我们有梯度上升类别模型可视化方法，可以实现最大化。","start":4337.24,"end":4356.18}],"notes":["本段讲解了神经网络内部机制的可视化方法，包括通过激活图和合成图像来观察网络中各个神经元的响应。例如，第一层神经元对明暗边缘敏感，而相邻神经元则对相反方向的边缘敏感。通过优化技术，可以生成特定激活的图像，从而揭示每个神经元关注的特征。"],"formulas":[],"uncertainties":[],"diagram":"network","start":4184.2,"end":4356.18,"asr_flags":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":4184.2,"text":"input to the network, which can be a still image or video from a webcam. These black squares in the"},{"start":4189.74,"text":"middle show the activations on a single layer of a network, in this case the popular deep neural"},{"start":4193.96,"text":"network called AlexNet running in CAFE. By interacting with the network, we can see what"},{"start":4198.72,"text":"some of the neurons are doing. For example, on this first layer, the unit in the center"},{"start":4204.44,"text":"responds strongly to light to dark edges."},{"start":4208.48,"text":"Its neighbor, one neuron over, responds"},{"start":4210.84,"text":"to edges in the opposite direction, dark to light."},{"start":4215.38,"text":"Using optimization, we can synthetically"},{"start":4217.58,"text":"produce images that light up each neuron on this layer"},{"start":4219.78,"text":"to see what each neuron is looking for."},{"start":4222.22,"text":"We can scroll through every layer in the network"},{"start":4224.3,"text":"to see what it does, including convolution, pooling,"},{"start":4227.96,"text":"and normalization layers."},{"start":4229.76,"text":"We can switch back and forth between showing"},{"start":4231.7,"text":"showing the actual activations, and showing images synthesized to produce high activation."},{"start":4236.32,"text":"This is the class model visualization method."},{"start":4239.32,"text":"By the time we get to the fifth convolutional layer, the features being computed represent abstract concepts."},{"start":4246.34,"text":"For example, this neuron seems to respond to faces."},{"start":4249.64,"text":"We can further investigate this neuron by showing a few different types of information."},{"start":4253.68,"text":"First, we can artificially create optimized images using new regularization techniques that are described in our paper."},{"start":4259.1,"text":"That's the class model visualization."},{"start":4263.86,"text":"That's the data set search."},{"start":4270.46,"text":"And that's the decon."},{"start":4280.65,"text":"We can see that it would respond more strongly if we had even darker eyes and rosier lips. We can also confirm that it cares about the head and shoulders, but ignores the arms and torso. We can even see that it fires to some extent for cat faces. Using backcrop or decon, we can see that this unit depends most strongly on a couple units in the previous layer, CONV4, and on about a dozen or so in CONV3. So because of decon, you can trace back the entire layers before."},{"start":4310.01,"text":"The top nine images. Okay, I'm going to leave it to you, but you get the idea. These researchers built a toolkit that essentially reproduces some of the methods we've seen together, although we've seen more methods than what's in the toolkit. And so your kit is now able to answer many questions about convolution, such as, hey, what part of the input is responsible for the output? We now know that we can use occlusion sensitivity or class activation maps."},{"start":4337.24,"text":"What is the role of a neuron, filter, layer? We have many methods that can allow us to do that. Can we check what the network focuses on given the input image? We have methods to do that. And how does the neural network see our world? We have the gradient ascent class model visualization method that allow us to maximize."}],"speech_gaps":[{"start":4261.68,"end":4263.46},{"start":4267.76,"end":4270.06},{"start":4274.032,"end":4277.568},{"start":4277.568,"end":4279.92}],"frame":"../frames/v059/026.webp","frame_time":4196.2},{"title":"模型内部发生了什么：CNN与Transformer的对比","segments":[{"id":281,"text":"an input image with respect, sorry, find the input image that maximizes a certain activation. So that was the first part. Um, and then we're going to move toward frontier ideas. Any questions on CNNs? You feel like you have a better idea of how to look inside a CNN? So let me start by comparing CNNs.","zh":"关于输入图像，找到使某一激活值最大化的输入图像。所以这是第一部分。嗯，然后我们将转向前沿思想。关于CNN有任何问题吗？你感觉对如何查看CNN内部有了更好的理解吗？那么让我开始比较CNN。","start":4357.55,"end":4388.74},{"id":282,"text":"Two more modern frontier networks. The core distinction is going to be that CNNs deal with localized information. They visualize edges, textures, and shapes. When in modern, call it LLMs, we visualize relationships and meanings between concepts or between tokens.","zh":"另外两个更现代的前沿网络。核心区别在于，CNN处理的是局部信息。它们可视化边缘、纹理和形状。而在现代，称之为大语言模型（LLMs）中，我们则可视化概念或标记之间的关系和含义。","start":4389.35,"end":4416.61},{"id":283,"text":"And this is because transformers are based on attention.","zh":"这是因为Transformer是基于注意力机制的。","start":4419.53,"end":4423.93},{"id":284,"text":"And that started with the attention is all you need paper,","zh":"这始于《Attention Is All You Need》论文，","start":4425.29,"end":4428.13},{"id":285,"text":"which essentially explained why attention on its own","zh":"该论文基本上解释了为什么仅使用注意力机制","start":4429.11,"end":4433.49},{"id":286,"text":"is highly performant and can allow us","zh":"就能实现高度的性能，并且可以让我们","start":4433.49,"end":4436.81},{"id":287,"text":"to model very complex relationships.","zh":"建模非常复杂的关系。","start":4436.81,"end":4438.77},{"id":288,"text":"So, you know, by the way, this is just the first figure","zh":"顺便说一句，这只是第一张图","start":4440.83,"end":4445.31},{"id":289,"text":"of the attention is all you need paper,","zh":"《attention is all you need》这篇论文","start":4445.31,"end":4447.21},{"id":290,"text":"which you should all be able to read and understand by now in the class.","zh":"你们现在都应该能够阅读并理解这篇论文了。","start":4447.21,"end":4451.23},{"id":291,"text":"And transformers really represent language using two very simple ideas that are visualizable.","zh":"而transformer真的只用两个非常简单的思想来表示语言，而且这些思想是可以可视化的。","start":4452.71,"end":4460.59},{"id":292,"text":"We can interpret them to a certain extent.","zh":"我们可以在一定程度上对其进行解释。","start":4461.05,"end":4463.73},{"id":293,"text":"The first one is the attention patterns.","zh":"第一个是注意力模式。","start":4464.29,"end":4467.83},{"id":294,"text":"Attention looks at the relationship between tokens.","zh":"注意力机制关注的是标记之间的关系。","start":4469.41,"end":4472.89},{"id":295,"text":"So you look at a specific token, which can be a word, a subword, or a syllable.","zh":"所以你会关注一个特定的标记，它可以是一个词、一个子词或一个音节。","start":4472.89,"end":4478.15},{"id":296,"text":"You know, I'm going to simplify by saying it's a word and its relationship with other words in the training set.","zh":"我想通过简化的方式说它是一个词，并且它与其他词在训练集中的关系。","start":4478.53,"end":4484.63},{"id":297,"text":"And that's the attention that the transformer looking at it.","zh":"这就是Transformer在关注的内容。","start":4485.09,"end":4488.59},{"id":298,"text":"Each attention head learns different patterns.","zh":"每个注意力头学习不同的模式。","start":4490.25,"end":4493.03},{"id":299,"text":"So it can learn things like linking pronouns to nouns or tracking structures or enforcing a certain ordering.","zh":"因此它可以学习诸如将代词与名词连接、跟踪结构或强制某种顺序等任务。","start":4493.33,"end":4499.31},{"id":300,"text":"And then I really like this visualization, which is from Jesse Vig in 2019.","zh":"我特别喜欢这个可视化，它来自2019年的Jesse Vig。","start":4499.31,"end":4507.67},{"id":301,"text":"And this visualization essentially shows you there is a very nice blog post that he wrote with a few figures where you can see he presents how attention can be visualized.","zh":"这个可视化实际上向你展示了一篇他写的非常棒的博客文章，其中包含一些图表，你可以看到他展示了注意力如何被可视化。","start":4508.63,"end":4520.85}],"notes":["本段介绍了CNN和Transformer模型在内部机制上的核心区别。CNN处理局部信息，如边缘、纹理和形状，而Transformer通过注意力机制处理概念或标记之间的关系。这种区别源于Transformer基于注意力机制，而CNN则基于卷积操作。","课程提到注意力机制的起源是2017年的论文《Attention Is All You Need》，该论文解释了为什么注意力机制本身具有高性能，并且能够建模复杂的语义关系。","Transformer模型通过两个简单的可视化概念来表示语言：注意力模式和位置编码。注意力模式关注标记之间的关系，而位置编码则用于捕捉序列中的位置信息。","注意力机制允许每个注意力头学习不同的模式，例如将代词与名词连接、跟踪结构或强制某种顺序。这种机制使得Transformer能够处理复杂的语言结构。","课程还提到Jesse Vig在2019年的一篇博客文章中提供了注意力机制的可视化示例，展示了如何通过可视化来理解注意力机制的工作原理。","这些内容帮助学生理解如何通过可视化技术来探索和解释深度学习模型的内部机制，特别是CNN和Transformer之间的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4357.55,"end":4520.85,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":4357.55,"text":"an input image with respect sorry find the input image that maximizes a certain activation super so that was the first part um and then we're going to move toward frontier ideas any questions on cnn's you feel like you have a better idea of how to look inside a cnn so let me start by comparing cnn's"},{"start":4389.35,"text":"two more modern frontier networks. The core distinction is going to be that CNNs deal with localized information. They visualize edges, textures, and shapes. When in modern, call it LLMs, we visualize relationships and meanings between concepts or between tokens."},{"start":4419.53,"text":"And this is because transformers are based on attention."},{"start":4425.29,"text":"And that started with the attention is all you need paper,"},{"start":4429.11,"text":"which essentially explained why attention on its own"},{"start":4433.49,"text":"is highly performant and can allow us"},{"start":4436.81,"text":"to model very complex relationships."},{"start":4440.83,"text":"So, you know, by the way, this is just the first figure"},{"start":4445.31,"text":"of the attention is all you need paper,"},{"start":4447.21,"text":"which you should all be able to read and understand by now in the class."},{"start":4452.71,"text":"And transformers really represent language using two very simple ideas that are visualizable."},{"start":4461.05,"text":"We can interpret them to a certain extent."},{"start":4464.29,"text":"The first one is the attention patterns."},{"start":4469.41,"text":"Attention looks at the relationship between tokens."},{"start":4472.89,"text":"So you look at a specific token, which can be a word, a subword, or a syllable."},{"start":4478.53,"text":"You know, I'm going to simplify by saying it's a word and its relationship with other words in the training set."},{"start":4485.09,"text":"And that's the attention that the transformer looking at it."},{"start":4490.25,"text":"Each attention head learns different patterns."},{"start":4493.33,"text":"So it can learn things like linking pronouns to nouns or tracking structures or enforcing a certain ordering."},{"start":4499.31,"text":"And then I really like this visualization, which is from Jesse Vig in 2019."},{"start":4508.63,"text":"And this visualization essentially shows you there is a very nice blog post that he wrote with a few figures where you can see he presents how attention can be visualized."}],"speech_gaps":[],"frame":"../frames/v059/027.webp","frame_time":4369.55},{"title":"嵌入与注意力机制在语言模型中的作用","segments":[{"id":302,"text":"In simple ways, what is the connection between a fixed token with the surrounding tokens? Let's say, um, so this is essentially the transformer analog to the CNN saliency maps that we looked at. Pretty much, the other things that transformers or more modern language models use embeddings. You know, during the pre-training phase, you're also learning embeddings.","zh":"用简单的方式来说，固定标记与周围标记之间有什么联系？比如说，这基本上是变压器中与我们之前看到的CNN显著性图相对应的概念。基本上，变压器或更现代的语言模型还会使用嵌入。你知道的，在预训练阶段，你也在学习嵌入。","start":4521.5,"end":4552.88},{"id":303,"text":"You are ready to read the birth paper, in fact, now with the baggage you have from the class. And what's interesting about embeddings, and I printed a picture here from Garg in 2021, I also encourage you to see that.","zh":"事实上，你现在已经准备好阅读这篇开创性论文了，这得益于你从课堂上学到的知识。嵌入很有趣，我在这里打印了一张来自2021年Garg的图片，我也鼓励你去查看那张图。","start":4554.39,"end":4570.43},{"id":304,"text":"Short blog post where he uses a visualization method called T-SNE. It's a dimensionality reduction method. We're not going to present it in the class, but it's taught actually a lot in biotech and healthcare. It's used very extensively for those of you who work with the Stanford Hospital. And it allows you to visualize embeddings. And embeddings are sort of how the language model perceives our words. So you would expect tokens that...","zh":"这是一篇简短的博客文章，他使用了一种叫做T-SNE的可视化方法。这是一种降维方法。我们不会在课堂上介绍它，但实际上它在生物科技和医疗领域被广泛教授。对于在斯坦福医院工作的你们来说，它被广泛使用，可以用来可视化嵌入。嵌入基本上是语言模型感知我们词语的方式。因此，你可能会期望那些……","start":4571.59,"end":4598.21},{"id":305,"text":"Should have similar semantic meanings to be next to each other in that space, or tokens that have nothing to do with each other to be far away from each other in distance. And that can be a way to sanity check that your model actually is learning meaningful representations. So together, attention and embeddings are what let large language models track relationships and meanings.","zh":"具有相似语义含义的标记在该空间中彼此靠近，而彼此无关的标记则在距离上相距很远。这可以作为一种方式，来验证你的模型是否真的在学习有意义的表示。因此，注意力和嵌入共同作用，使大型语言模型能够追踪关系和含义。","start":4598.59,"end":4623.25},{"id":306,"text":"And you can visualize your embeddings with dimensionality reduction tool. You can visualize attention relationships as well. Unfortunately, the modern transformers are so complicated that even the cutting-edge research is only able to interpret those relationships with two-layer transformers, pretty much.","zh":"你可以使用降维工具来可视化你的嵌入，你也可以可视化注意力关系。不幸的是，现代的变压器如此复杂，以至于即使是最前沿的研究也只能用两层变压器来解释这些关系，基本上如此。","start":4624.88,"end":4651.46},{"id":307,"text":"The best you find out there is probably Anthropic's work, so I linked two papers. The first one is called The Mathematical Framework for Transformer Circuits, which is essentially explaining how the different components within a transformer interact with each other, and they introduce the concept of a circuit. And then the second one is a follow-up to that paper called...","zh":"目前最好的研究成果可能是Anthropic的工作，所以我链接了两篇论文。第一篇名为《Transformer电路的数学框架》，它基本上解释了变压器内部不同组件如何相互作用，并引入了电路的概念。然后第二篇是该论文的后续文章，名为……","start":4651.97,"end":4673.11},{"id":308,"text":"In-context learning with induction heads. Induction heads are probably the best tool we have to sort of visualize what's happening inside a transformer. It's pretty complex. You should be able to understand it by now, but you'd have to spend quite some time to go deeper into it. I just will link them. We're not going to talk about it for the sake of time. Let's get to...","zh":"通过归纳头进行上下文学习。归纳头可能是我们用来可视化变压器内部情况的最佳工具。它相当复杂。你现在应该能够理解它，但要深入了解则需要花费相当多的时间。我只会链接相关资料。为了节省时间，我们不会深入讨论这个话题。让我们进入……","start":4673.33,"end":4697.53}],"notes":["本段讲解了嵌入（embeddings）在语言模型中的作用，即语言模型如何通过嵌入来感知词语。嵌入是模型对词语的表示，通过可视化方法如T-SNE可以观察这些嵌入在空间中的分布。相似语义的词应彼此接近，而无关词则应远离，这可以作为模型是否学习到有意义表示的检验方法。","嵌入与注意力机制共同作用，使大语言模型能够追踪词语之间的关系和含义。注意力机制允许模型关注输入中的不同部分，而嵌入则提供了词语的向量表示。","现代Transformer模型非常复杂，即使是最前沿的研究也只能通过两层Transformer来解释其内部关系。Anthropic的论文提供了对Transformer内部机制的深入分析，特别是通过“电路”这一概念。","“感应头”（induction heads）是目前可视化Transformer内部机制的最佳工具。它允许研究者观察模型在处理输入时的内部表示和关系，但理解这些机制需要深入研究。","课程鼓励学生阅读相关论文，如Garg 2021年的博客和Anthropic的两篇论文，以进一步理解Transformer的内部机制。","课程提到T-SNE是一种降维方法，常用于生物技术和医疗领域，特别是与斯坦福医院相关的工作中。它被广泛用于可视化嵌入，帮助理解模型如何表示词语。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4521.5,"end":4697.53,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4521.5,"text":"in simple ways what is the connection between a fixed token with the surrounding tokens let's say um so this is essentially the transformer analog to the cnn saliency maps that we looked at pretty much the other things that transformers or more modern language model uses embeddings you know during the pre-training phase you're also learning embeddings"},{"start":4554.39,"text":"you are ready to read the birth paper, in fact, now with the baggage you have from the class. And what's interesting about embeddings, and I printed a picture here from Garg in 2021, I also encourage you to see that."},{"start":4571.59,"text":"short blog post where he uses a visualization method called T-SNE. It's a dimensionally reduction method. We're not going to present it in the class, but it's taught actually a lot in biotech and healthcare. It's used very extensively for those of you who work with the Stanford Hospital. And it allows you to visualize embeddings. And embeddings are sort of how the language model perceives our words. So you would expect tokens that..."},{"start":4598.59,"text":"should have similar semantic meanings to be next to each other in that space, or tokens that have nothing to do with each other to be far away from each other in distance. And that can be a way to sanity check that your model actually is learning meaningful representations. So together, attention and embeddings are what let large language models track relationship and meanings."},{"start":4624.88,"text":"And you can visualize your embeddings with dimensionally reduction tool. You can visualize attention relationships as well. Unfortunately, the modern transformers are so complicated that even the cutting-edge research is only able to interpret those relationships with two-layer transformers, pretty much."},{"start":4651.97,"text":"The best you find out there is probably Anthropic's work, so I linked two papers. The first one is called The Mathematical Framework for Transformer Circuits, which is essentially explaining how the different components within a transformer interact with each other, and they introduce the concept of a circuit. And then the second one is a follow-up to that paper called..."},{"start":4673.33,"text":"in-context learning with induction heads. Induction heads are probably the best tool we have to sort of visualize what's happening inside a transformer. It's pretty complex. You should be able to understand it by now, but you'd have to spend quite some time to go deeper into it. I just will link them. We're not going to talk about it for the sake of time. Let's get to..."}],"speech_gaps":[],"frame":"../frames/v059/028.webp","frame_time":4533.5},{"title":"模型训练与诊断","segments":[{"id":309,"text":"Some fun stuff. Training and scaling diagnostics. So how do labs, frontier labs, check if a model is training well? We've talked about it in the first case study, but one very natural way is to look at our loss curves. You can look at the training loss, at the validation loss, and make sure that they follow sort of a smooth...","zh":"一些有趣的内容。模型训练与扩展诊断。那么，实验室、前沿实验室是如何检查模型是否训练良好呢？我们在第一个案例研究中已经讨论过这个问题，但一种非常自然的方法是观察我们的损失曲线。你可以查看训练损失、验证损失，并确保它们大致遵循一条平滑的轨迹……","start":4698.13,"end":4720.95},{"id":310,"text":"you can look at the training loss, at the validation loss, and make sure that they follow sort of a smooth trajectory and if it's not smooth there's probably something that went wrong you've probably trained your own network where some loss functions look very funky I remember back in the days there was even blogs where people would post their ugliest loss functions and there was a lot on there you might find sudden jumps on the loss that means maybe the the batch that has been processed has been corrupted maybe you're doing extremely well on it when you should actually not","zh":"你可以查看训练损失、验证损失，并确保它们大致遵循一条平滑的轨迹，如果轨迹不平滑，可能意味着出了问题。你可能训练了自己的网络，其中某些损失函数看起来非常奇怪。我记得以前甚至有博客，人们会发布他们最糟糕的损失函数，上面有很多内容。你可能会发现损失函数中出现突然的跳跃，这可能意味着处理过的批次数据被损坏了，或者你在这个批次上表现得非常好，但实际上不应该如此。","start":4721.53,"end":4749.67},{"id":311,"text":"you know, do that well, and it might raise a flag. You might, you know, find bugs in your code because of that. You might find gradients that are exploding, gradients that are vanishing. All of that you could visualize at the loss function level. Now, note that loss functions can be run at a global level or at a, you know, on a specific subset of your data. We're going to talk about it in data diagnostics.","zh":"你知道，做好这一点可能会引发警报。你可能会因为这一点在代码中发现错误。你可能会发现梯度爆炸或梯度消失的问题。所有这些问题都可以在损失函数层面进行可视化。请注意，损失函数可以在全局层面运行，也可以在你数据集的一个特定子集上运行。我们将在数据诊断部分讨论这一点。","start":4750.31,"end":4775.47},{"id":312,"text":"The other things that are interesting to track also sometimes referred to in the community as training telemetry is to watch and track your gradient norms, look at your learning rate schedule, or even look at hardware efficiency metrics to feel if you've underutilized compute, which we talked about again in the first part. So imagine that if you're working at a...","zh":"另外，还有一些有趣的内容也值得关注，有时在社区中被称为训练遥测数据。你可以监控和跟踪你的梯度范数，查看你的学习率调度，甚至查看硬件效率指标，以判断你是否充分利用了计算资源，我们在第一部分已经再次讨论过这一点。想象一下，如果你在一个……","start":4776.27,"end":4803.97},{"id":313,"text":"They don't want to give it out because it will leak, essentially, information about their architecture, about what's going well, what's not going well, et cetera. And that's why you find very few information on these. The one thing that you do find some charts on that are really helpful is scaling laws.","zh":"他们不想公开这些信息，因为这会泄露关于他们架构、哪些方面做得好、哪些方面做得不好的信息，等等。这就是为什么你很少能在这些方面找到信息。你确实能找到一些非常有帮助的图表，那就是扩展定律。","start":4804.34,"end":4821.66},{"id":314,"text":"They don't want to give it out because it will leak, essentially, information about their architecture, about what's going well, what's not going well, et cetera. And that's why you find very few information on these. The one thing that you do find some charts on that are really helpful is scaling laws.","zh":"他们不想公开这些信息，因为这会泄露关于他们架构的信息，关于哪些方面做得好，哪些方面做得不好等等。因此，你很难找到关于这些方面的信息。不过，你会发现一些非常有用的图表，那就是扩展定律。","start":4821.97,"end":4839.31},{"id":315,"text":"Scaling laws, which we've talked about in a previous lecture, is essentially trying to understand the relationship between our model performance and some other","zh":"扩展定律，我们在之前的课程中已经讨论过，其本质是试图理解我们的模型性能与其他因素之间的关系，","start":4840.8,"end":4853.5},{"id":316,"text":"call it hyperparameters, such as the model capacity, so the size of the model, the amount of compute that's being used, or the dataset size. DeepMind has done amazing work, I think it was in 2022, a couple of years ago, with Chinchilla. This chart is...","zh":"比如超参数，如模型容量，即模型的大小，所使用的计算量，或者数据集的大小。DeepMind 在 2022 年，也就是几年前，用 Chinchilla 做了非常出色的工作。这张图表是……","start":4854.26,"end":4873.98}],"notes":["本段主要讲解了模型训练过程中如何通过损失曲线来诊断模型是否训练良好。讲者提到，可以通过观察训练损失和验证损失的平滑性来判断模型是否正常训练，如果出现突然的跳跃，可能意味着数据批次被损坏或模型在某些部分表现异常。","讲者还提到，损失函数可以在全局或特定数据子集上运行，这有助于更细致地分析模型表现。此外，还提到了梯度范数、学习率调度和硬件效率指标等其他训练监控指标，这些可以帮助判断计算资源是否被充分利用。","讲者指出，大型前沿实验室通常会有一个仪表板来跟踪不同数据子集的损失函数、检查点等信息，但由于这些信息涉及知识产权，很少对外公开。然而，一些关于扩展定律（scaling laws）的图表仍然可以找到，这些图表有助于理解模型性能与模型容量、计算量和数据集大小之间的关系。","扩展定律是理解模型性能与模型容量、计算量和数据集大小之间关系的重要工具。讲者提到，DeepMind在2022年左右的Chinchilla研究中对此进行了深入探讨，这些研究结果有助于指导模型的扩展策略。"],"formulas":[],"uncertainties":["call it hyperparameters"],"diagram":"none","start":4698.13,"end":4873.98,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4698.13,"text":"Some fun stuff. Training and scaling diagnostics. So how do labs, frontier labs, check if a model is training well? We've talked about it in the first case study, but one very natural way is to look at our loss curves. You can look at the training loss, at the validation loss, and make sure that they follow sort of a smooth..."},{"start":4721.53,"text":"trajectory and if it's not smooth there's probably something that went wrong you've probably trained your own network where some loss functions look very funky i remember back in the days there was even blogs where people would post their ugliest loss functions and there was a lot on there you might find sudden jumps on the loss that means maybe the the batch that has been processed has been corrupted maybe you're doing extremely well on it when you should actually not"},{"start":4750.31,"text":"you know, do that well, and it might raise a flag. You might, you know, find bugs in your code because of that. You might find gradients that are exploding, gradients that are vanishing. All of that you could visualize at the loss function level. Now, note that loss functions can be run at a global level or at a, you know, on a specific subset of your data. We're going to talk about it in data diagnostics."},{"start":4776.27,"text":"The other things that are interesting to track also sometimes referred to in the community as training telemetry is to watch and track your gradient norms, look at your learning rate schedule, or even look at hardware efficiency metrics to feel if you've underutilized compute, which we talked about again in the first part. So imagine that if you're working at a..."},{"start":4804.34,"text":"major frontier lab, you probably have a dashboard that tracks your different loss function for different subsets of the data, your checkpoints, all of that. You would have all of that. Unfortunately, very few of these are published because they're IP. They can't really..."},{"start":4821.97,"text":"They don't want to give it out because it will leak, essentially, information about their architecture, about what's going well, what's not going well, et cetera. And that's why you find very few information on these. The one thing that you do find some charts on that are really helpful is scaling laws."},{"start":4840.8,"text":"Scaling laws, which we've talked about in a previous lecture, is essentially trying to understand the relationship between our model performance and some other"},{"start":4854.26,"text":"call it hyperparameters, such as the model capacity, so the size of the model, the amount of compute that's being used, or the dataset size. DeepMind has done amazing work, I think it was in 2022, a couple of years ago, with Chinchilla. This chart is..."}],"speech_gaps":[],"frame":"../frames/v059/029.webp","frame_time":4710.13},{"title":"模型规模与训练效果的分析","segments":[{"id":317,"text":"borrowed from the chinchilla paper, where essentially what I want you to look at here is they're comparing the chinchilla model, the green star, to other models, including GPT-3, which came up a little before. And what they're showing is that the scaling law is actually slightly different than what OpenAI thought.","zh":"借用了来自Chinchilla论文的内容，其中我想要你们注意的是，他们将Chinchilla模型（绿色星号）与其他模型进行比较，包括稍早出现的GPT-3。他们展示的是，扩展定律实际上与OpenAI所认为的略有不同。","start":4875.08,"end":4898.2},{"id":318,"text":"they analyzed GPT-3 and they said GPT-3 is actually not performing well enough for the size that it is at and it was found that GPT-3 was not trained for long enough they essentially explained that if you kept training GPT-3 for longer you would have had way better performance and it was not about the model size in fact the model was underutilized","zh":"他们分析了GPT-3，并指出GPT-3在当前规模下表现并不理想，发现GPT-3的训练时间不够长。他们解释说，如果你继续训练GPT-3更长时间，性能会显著提升。实际上，问题并不在于模型规模，而是模型被低估了。","start":4899.88,"end":4922.76},{"id":319,"text":"So they plotted these lines. So the dotted line is what probably we thought in 2020, 21, the scaling law, the power law would be. And they showed that it's actually not exactly that. Where essentially the idea is they plot the full line here and they say, this is our analysis of the scaling law. If your star is above that line, it's probably that your model should be trained longer.","zh":"因此，他们绘制了这些线条。虚线是我们可能在2020、2021年认为的扩展定律，即幂律。他们展示的是，实际上并非完全如此。他们的想法是，这里绘制了完整的线条，并表示，这是他们对扩展定律的分析。如果你的星号在该线上方，说明你的模型应该继续训练更长时间。","start":4923.75,"end":4952.59},{"id":320,"text":"If it's on the line, it's respecting the scaling laws that they're finding. And that's what's interesting about this Chinchilla paper. So that's after the GPT-3 paper. Chinchilla came in 2022 saying you should have trained GPT-3 longer, you would have done better. And here's Chinchilla model that has less parameters than GPT-3, so 70 billion versus 175 billion, and that is performing better. Yes.","zh":"如果它在该线上，则说明你的模型遵循他们发现的扩展定律。这就是Chinchilla论文的有趣之处。这是在GPT-3论文之后发表的。Chinchilla于2022年提出，指出你应该更长时间地训练GPT-3，这样会表现得更好。这里展示的是Chinchilla模型，其参数数量少于GPT-3，即700亿与1750亿，但其表现更好。是的。","start":4953.8,"end":4988.74},{"id":321,"text":"To go deeper, I also pulled a few charts that show you the power laws between the loss function. So on the vertical axis, you have the test loss.","zh":"为了更深入地理解，我还提取了几张图表，展示了损失函数之间的幂律关系。在纵轴上，你有测试损失。","start":4990.67,"end":5004.09},{"id":322,"text":"That shows essentially your performance on the test set. And then on the horizontal axis, on the x-axis, you have compute, data set size, and parameters. So how are those scaling laws established? Essentially, they fix two of them, and they vary the third one, and they see if things are respected. Meaning, let's say you're increasing the, you're keeping the same compute, the same data set size, but you're training a model that is twice as big.","zh":"这表示你在测试集上的表现。在横轴上，即x轴上，你有计算资源、数据集大小和参数数量。这些扩展定律是如何建立的？本质上，他们固定其中两个变量，改变第三个变量，并观察是否符合预期。例如，你增加模型规模，同时保持计算资源和数据集大小不变，训练一个规模是原来的两倍的模型。","start":5005.03,"end":5033.66}],"notes":["本段主要讨论了Chinchilla论文中对模型规模与训练效果之间关系的分析。Chinchilla论文指出，GPT-3模型虽然参数量较大，但训练时间不足，导致其性能未达到预期。论文认为，如果GPT-3继续训练更长时间，其性能会显著提升，而不是单纯依赖模型规模。这表明模型的训练时间对性能有重要影响。","Chinchilla论文还展示了不同模型在不同参数量和训练时间下的表现。通过绘制的曲线，论文指出如果模型的表现点位于曲线之上，说明该模型可能需要更长的训练时间。如果模型的表现点位于曲线上，则说明其符合当前发现的缩放定律。","Chinchilla模型的参数量（700亿）少于GPT-3（1750亿），但其性能却更好，这进一步支持了训练时间对模型性能的重要性。这表明模型的性能不仅取决于参数量，还与训练时间密切相关。","在分析缩放定律时，研究者通过固定两个变量（如计算资源和数据集大小），并改变第三个变量（如模型参数量），来观察模型性能是否符合预期的缩放规律。这种方法有助于理解不同因素对模型性能的影响。","论文还提到，测试损失是衡量模型性能的重要指标，它反映了模型在测试集上的表现。通过分析损失函数与计算资源、数据集大小和参数量之间的关系，可以更全面地理解模型的训练效果。","Chinchilla论文的发现对后续模型设计和训练策略具有重要影响，表明在模型开发过程中，除了增加参数量外，还需要考虑训练时间的优化，以达到更好的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4875.08,"end":5033.66,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4875.08,"text":"borrowed from the chinchilla paper, where essentially what I want you to look at here is they're comparing the chinchilla model, the green star, to other models, including GPT-3, which came up a little before. And what they're showing is that the scaling law is actually slightly different than what OpenAI thought."},{"start":4899.88,"text":"they analyzed GPT-3 and they said GPT-3 is actually not performing well enough for the size that it is at and it was found that GPT-3 was not trained for long enough they essentially explained that if you kept training GPT-3 for longer you would have had way better performance and it was not about the model size in fact the model was underutilized"},{"start":4923.75,"text":"So they plotted these lines. So the dotted line is what probably we thought in 2020, 21, the scaling law, the power law would be. And they showed that it's actually not exactly that. Where essentially the idea is they plot the full line here and they say, this is our analysis of the scaling law. If your star is above that line, it's probably that your model should be trained longer."},{"start":4953.8,"text":"If it's on the line, it's respecting the scaling laws that they're finding. And that's what's interesting about this Chinchilla paper. So that's after the GPT-3 paper. Chinchilla came in 2022 saying you should have trained GPT-3 longer, you would have done better. And here's Chinchilla model that has less parameters than GPT-3, so 70 billion versus 175 billion, and that is performing better. Yes."},{"start":4990.67,"text":"To go deeper, I also pulled a few charts that show you the power laws between the loss function. So on the vertical axis, you have the test loss."},{"start":5005.03,"text":"That shows essentially your performance on the test set. And then on the horizontal axis, on the x-axis, you have compute, data set size, and parameters. So how are those scaling laws established? Essentially, they fix two of them, and they vary the third one, and they see if things are respected. Meaning, let's say you're increasing the, you're keeping the same compute, the same data set size, but you're training a model that is twice as big."}],"speech_gaps":[],"frame":"../frames/v059/030.webp","frame_time":4887.08},{"title":"模型的训练与评估","segments":[{"id":323,"text":"in logarithms, what does it tell you about the performance, essentially? Are those scaling laws respected? And so what's nice now is that we have a precedent for scaling laws. So if you were actually training such big models, you would compare to the scaling laws that are available out there. Remember, another reason these are important is because models' training runs are so expensive.","zh":"在对数中，这告诉你关于性能的什么信息？本质上来说，这些扩展定律是否被遵守了？现在很不错的是一方面我们已经有了扩展定律的先例。因此，如果你实际上在训练如此大的模型，你会将它与现有的扩展定律进行比较。记住，这些定律之所以重要，另一个原因是模型的训练过程非常昂贵。","start":5036.12,"end":5059.63},{"id":324,"text":"It wasn't shared publicly, but we estimate that GPT-5 is probably in the hundreds of millions. And so you want to know, should I train that model twice longer or not? Because that's a big financial decision, right? And the scaling laws allow you to determine, should I invest in compute? Should I invest in growing my data set, so finding more data? Or should I invest in model capacity, making my model bigger? Okay?","zh":"它没有被公开分享，但我们估计GPT-5可能在数亿参数量级。因此，你想要知道，我是否应该将该模型训练时间延长一倍？因为这是一个重大的财务决策，对吧？而扩展定律允许你决定，我是否应该投资计算资源？我是否应该投资于扩大数据集，从而寻找更多数据？或者我是否应该投资于模型容量，使我的模型更大？好的？","start":5060.65,"end":5092.14},{"id":325,"text":"So yeah, together these form sort of a health dashboard for the model.","zh":"所以，这些共同构成了一个模型的健康仪表盘。","start":5096.96,"end":5100.3},{"id":326,"text":"So that's training and scaling diagnostic, loss functions, you know, et cetera, health dashboard, scaling laws.","zh":"这就是训练和扩展诊断，损失函数，诸如此类，健康仪表盘，扩展定律。","start":5104.37,"end":5112.13},{"id":327,"text":"All of that are things that researchers might use to get a broad sense of where to invest more in terms of improving their model.","zh":"所有这些都是研究人员可能会用来了解在改进模型方面应更多投资的方向的广泛信息。","start":5112.33,"end":5120.27},{"id":328,"text":"The other one is something we've already seen to a certain extent is how models, how labs evaluate model capabilities and safety.","zh":"另一个方面是我们已经看到一定程度的是，实验室如何评估模型的能力和安全性。","start":5120.55,"end":5128.45},{"id":329,"text":"And they might do it with benchmarks.","zh":"他们可能会使用基准测试来进行评估。","start":5129.17,"end":5131.27},{"id":330,"text":"So capability benchmark might be evaluating the model in tasks like reasoning or coding or math or multilingual tasks, etc.","zh":"能力基准测试可能是评估模型在推理、编程、数学或多语言任务等任务中的表现。","start":5131.27,"end":5141.13},{"id":331,"text":"It might also be comparing checkpoints that help you understand how your model is improving over time, depending on what you're feeding it or depending on some hyperparameters that you're tweaking.","zh":"它也可能是在比较那些帮助你理解模型随时间如何改进的检查点，这取决于你输入的内容，或者取决于你正在调整的一些超参数。","start":5141.47,"end":5154.65},{"id":332,"text":"And also error clusters.","zh":"此外还有错误聚类。","start":5155.95,"end":5159.77},{"id":333,"text":"So, just to tell you a little more about error clusters, if you actually use benchmarks across a wide variety of tasks, you might see that, oh, the model checkpoint number five is actually doing very poorly at reasoning.","zh":"因此，为了更详细地告诉你关于错误聚类的情况，如果你实际上在多种任务上使用基准测试，你可能会发现，例如，模型检查点编号五在推理方面表现非常糟糕。","start":5159.77,"end":5172.85},{"id":334,"text":"Let's see why is that.","zh":"让我们看看为什么会这样。","start":5173.13,"end":5174.47},{"id":335,"text":"So, here are some examples from a competitive math benchmark, 2025 aim published by OpenAI on GPT-5.","zh":"以下是一些来自竞争数学基准测试的例子，2025目标由OpenAI在GPT-5上发布。","start":5175.79,"end":5187.71},{"id":336,"text":"and actually the bottom one is from today.","zh":"实际上，最下面的那个是今天发布的。","start":5187.71,"end":5189.75},{"id":337,"text":"This morning Mistral announced","zh":"今天早上Mistral宣布了","start":5189.83,"end":5190.99},{"id":338,"text":"their third generation model.","zh":"他们的第三代模型。","start":5190.99,"end":5194.39},{"id":339,"text":"So I thought I'd pull it to show you","zh":"所以我想把它拉出来给你们看看","start":5194.73,"end":5196.43},{"id":340,"text":"how real-time these things are","zh":"这些事情是实时的","start":5196.43,"end":5197.97},{"id":341,"text":"and just publish today.","zh":"并且今天就发布","start":5197.97,"end":5198.87},{"id":342,"text":"And they're comparing across reasoning","zh":"他们正在跨推理","start":5200.83,"end":5202.87},{"id":343,"text":"and math and et cetera against benchmarks.","zh":"和数学等等与基准进行比较","start":5202.87,"end":5205.97},{"id":344,"text":"Now the risk is,","zh":"现在风险是","start":5206.23,"end":5207.37},{"id":345,"text":"are these benchmarks contaminated?","zh":"这些基准是否被污染了？","start":5207.45,"end":5209.45},{"id":346,"text":"How can a benchmark be contaminated?","zh":"基准如何被污染？","start":5210.33,"end":5212.43}],"notes":["本段讨论了模型训练和评估中的关键概念，包括训练和扩展诊断、损失函数、健康仪表盘以及扩展定律。这些工具帮助研究人员了解模型的性能，并决定在哪些方面进行更多投资。","模型的扩展定律是评估模型性能的重要依据，它们允许研究人员决定是否增加计算资源、扩大数据集或提升模型容量。这些决策对模型的开发和优化至关重要。","模型的评估不仅包括基准测试，还涉及检查点的比较和错误聚类的分析。通过这些方法，研究人员可以了解模型在不同任务上的表现，并识别模型改进的路径。","错误聚类分析可以帮助识别模型在特定任务上的弱点，例如推理能力不足。通过分析这些错误，研究人员可以调整训练策略或改进模型设计。","本段还提到，模型的评估是实时进行的，例如Mistral宣布其第三代模型，并与基准测试进行比较。这表明模型的评估和改进是一个持续的过程。","最后，本段提出了一个关键问题：基准测试是否被污染。这涉及基准测试的可靠性和有效性，是模型评估中的一个重要考虑因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5036.12,"end":5212.43,"asr_flags":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":5036.12,"text":"in logarithms, what does it tell you about the performance, essentially? Are those scaling laws respected? And so what's nice now is that we have a precedent for scaling laws. So if you were actually training such big models, you would compare to the scaling laws that are available out there. Remember, another reason these are important is because models' training runs are so expensive."},{"start":5060.65,"text":"It wasn't shared publicly, but we estimate that GPT-5 is probably in the hundreds of millions. And so you want to know, should I train that model twice longer or not? Because that's a big financial decision, right? And the scaling laws allow you to determine, should I invest in compute? Should I invest in growing my data set, so finding more data? Or should I invest in model capacity, making my model bigger? Okay?"},{"start":5096.96,"text":"So yeah, together these form sort of a health dashboard for the model."},{"start":5104.37,"text":"So that's training and scaling diagnostic, loss functions, you know, et cetera, health dashboard, scaling laws."},{"start":5112.33,"text":"All of that are things that researchers might use to get a broad sense of where to invest more in terms of improving their model."},{"start":5120.55,"text":"The other one is something we've already seen to a certain extent is how models, how labs evaluate model capabilities and safety."},{"start":5129.17,"text":"And they might do it with benchmarks."},{"start":5131.27,"text":"So capability benchmark might be evaluating the model in tasks like reasoning or coding or math or multilingual tasks, etc."},{"start":5141.47,"text":"It might also be comparing checkpoints that help you understand how your model is improving over time, depending on what you're feeding it or depending on some hyperparameters that you're tweaking."},{"start":5155.95,"text":"And also error clusters."},{"start":5159.77,"text":"So, just to tell you a little more about error clusters, if you actually use benchmarks across a wide variety of tasks, you might see that, oh, the model checkpoint number five is actually doing very poorly at reasoning."},{"start":5173.13,"text":"Let's see why is that."},{"start":5175.79,"text":"So, here are some examples from a competitive math benchmark, 2025 aim published by OpenAI on GPT-5."},{"start":5187.71,"text":"and actually the bottom one is from today."},{"start":5189.83,"text":"This morning Mistral announced"},{"start":5190.99,"text":"their third generation model."},{"start":5194.73,"text":"So I thought I'd pull it to show you"},{"start":5196.43,"text":"how real-time these things are"},{"start":5197.97,"text":"and just publish today."},{"start":5200.83,"text":"And they're comparing across reasoning"},{"start":5202.87,"text":"and math and et cetera against benchmarks."},{"start":5206.23,"text":"Now the risk is,"},{"start":5207.45,"text":"are these benchmarks contaminated?"},{"start":5210.33,"text":"How can a benchmark be contaminated?"}],"speech_gaps":[],"frame":"../frames/v059/031.webp","frame_time":5048.12},{"title":"测试集污染的检测方法","segments":[{"id":347,"text":"Yeah, if it was in the training data. The problem is these models are trained on so much data online. You don't know. Maybe it was trained on a blog post where someone actually was presenting a benchmark and describing what the benchmark was about. Maybe it was trained on GitHub and there was a text file in a very shady part of the GitHub that was listing some of the test set information. All of those might contaminate benchmarks. How would you identify that a benchmark has been contaminated? Test set has been contaminated.","zh":"是的，如果它在训练数据中。问题是这些模型是在大量在线数据上训练的。你不知道。也许它是在一个博客文章上训练的，而该博客文章中有人实际在展示一个基准并描述了该基准的内容。也许它是在GitHub上训练的，而GitHub的某个非常可疑的部分有一个文本文件，列出了部分测试集的信息。所有这些都可能污染基准。你怎么能识别出一个基准已经被污染了呢？测试集已经被污染了。","start":5215.82,"end":5247.94},{"id":348,"text":"Yeah, LAMA4 you brought up, just to repeat, looked good on benchmark, looked poor in practice after the community tested it. The general consensus, I mean, my opinion is I actually don't look too much at the benchmarks when a foundation model provider publishes them. Or, in other words, I would look at them in relative value between models rather than absolute value.","zh":"是的，你提到的LAMA4，在基准测试中表现良好，但在社区测试后在实践中表现不佳。我的观点是，当基础模型提供者发布基准时，我实际上不会太关注这些基准。换句话说，我会关注模型之间的相对价值，而不是绝对价值。","start":5265.61,"end":5287.87},{"id":349,"text":"And you'll wait for the community to test it on agentic workflows, on their tasks, and then people will sort of get a taste for if it works or not and on what it works. So it took some time, for example, for the community to realize how good Claude was at coding. It was clear from the benchmark, but others were also clearly good. But over time, people felt like, oh, wow, it's actually really good at coding. Yeah, you had a question or no?","zh":"你会等待社区在代理工作流和他们的任务上测试它，然后人们会逐渐了解它是否有效以及在哪些方面有效。例如，社区花了些时间才意识到Claude在编码方面有多出色。从基准测试中可以清楚地看出这一点，但其他模型也明显表现良好。但随着时间的推移，人们觉得，哦，哇，它实际上在编码方面真的很出色。是的，你有问题吗？","start":5288.99,"end":5313.65},{"id":350,"text":"Okay. Cool. So, oh, yeah, contamination. So, you know, how to detect if a test set has been, you know, exposed? A few methods. Some, you know, researchers might do a...","zh":"好的。酷。那么，哦，是的，污染。你知道，如何检测测试集是否被暴露？一些方法。一些研究人员可能会在数据集中进行搜索。例如，假设你有一个训练集和一个保留的测试集，你实际上会寻找嵌入。你取长度为七、八的标记序列，并在训练集中搜索，发现它们的相同嵌入也在测试集中出现。这表明其中一些内容可能已经被污染了。你也可以使用哈希或嵌入来实现这一点。实际上，测试集可能已经被污染，但不是逐字的。","start":5315.15,"end":5331.87},{"id":351,"text":"a search within the data set. So let's say you have a training set and you have a held out test set and you actually look for engrams. So you take sequences of tokens size seven, eight, and you search through the train set and you find that their same engrams is also found in the test set. There's a chance some of it has been contaminated. You can do it also with hashes or with embeddings. Actually, maybe the test set has been contaminated, but not word for word.","zh":"可能是语义上的。因此，你也可以使用嵌入进行同样的操作，并运行搜索，然后说，哦，哇，测试集中的这个具体例子在训练集中语义上是存在的。内容非常相似。","start":5332.36,"end":5360.84},{"id":352,"text":"maybe semantically. And so you might do the same thing with an embedding and run a search and say that, oh, wow, this specific example from the test set is found in the training set semantically. Very similar stuff.","zh":"也许在语义上。因此，你也可以使用嵌入向量进行搜索，并发现测试集中的某个具体例子在训练集中语义上是存在的。非常类似的事情。","start":5361.4,"end":5374.8}],"notes":["本段讨论了如何检测测试集是否被污染，即训练数据是否泄露到测试集中。检测方法包括在训练集和测试集中搜索相同或相似的序列（如engrams），以及使用哈希或嵌入向量进行比较。这些方法可以识别出测试集是否包含训练数据中的内容，无论是逐字还是语义层面的相似。","检测污染的方法之一是通过搜索训练集和测试集中的序列，例如长度为7或8的token序列。如果在训练集中找到相同的序列，则可能表明测试集被污染。这种方法可以识别出测试集是否包含训练数据中的内容。","另一种方法是使用哈希或嵌入向量进行比较。即使测试集中的内容不是逐字相同，但语义上相似的内容也可能表明污染。通过嵌入向量的相似性搜索，可以识别出测试集中是否存在与训练集语义相似的内容。","这些方法的目的是识别测试集是否被训练数据污染，从而确保评估结果的可靠性。污染可能导致模型在测试集上的表现优于实际能力，因此检测污染是评估模型性能的重要步骤。","检测污染的方法需要结合不同的技术，如序列搜索、哈希比较和嵌入向量分析。这些方法可以提高检测的准确性，但可能需要计算资源和时间。","在实际应用中，检测污染可能需要结合多种方法，并且需要考虑数据集的规模和复杂性。因此，检测污染是一个复杂但必要的过程，以确保模型评估的公正性和有效性。"],"formulas":[],"uncertainties":["engrams"],"diagram":"none","start":5215.82,"end":5374.8,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5215.82,"text":"Yeah, if it was in the training data. The problem is these models are trained on so much data online. You don't know. Maybe it was trained on a blog post where someone actually was presenting a benchmark and describing what the benchmark was about. Maybe it was trained on GitHub and there was a text file in a very shady part of the GitHub that was listing some of the test set information. All of those might contaminate benchmarks. How would you identify that a benchmark has been contaminated? Test set has been contaminated."},{"start":5265.61,"text":"Yeah, LAMA4 you brought up, just to repeat, looked good on benchmark, looked poor in practice after the community tested it. The general consensus, I mean, my opinion is I actually don't look too much at the benchmarks when a foundation model provider publishes them. Or, in other words, I would look at them in relative value between models rather than absolute value."},{"start":5288.99,"text":"And you'll wait for the community to test it on agentic workflows, on their tasks, and then people will sort of get a taste for if it works or not and on what it works. So it took some time, for example, for the community to realize how good Claude was at coding. It was clear from the benchmark, but others were also clearly good. But over time, people felt like, oh, wow, it's actually really good at coding. Yeah, you had a question or no?"},{"start":5315.15,"text":"Okay. Cool. So, oh, yeah, contamination. So, you know, how to detect if a test set has been, you know, exposed? A few methods. Some, you know, researchers might do a..."},{"start":5332.36,"text":"a search within the data set. So let's say you have a training set and you have a held out test set and you actually look for engrams. So you take sequences of tokens size seven, eight, and you search through the train set and you find that their same engrams is also found in the test set. There's a chance some of it has been contaminated. You can do it also with hashes or with embeddings. Actually, maybe the test set has been contaminated, but not word for word."},{"start":5361.4,"text":"maybe semantically. And so you might do the same thing with an embedding and run a search and say that, oh, wow, this specific example from the test set is found in the training set semantically. Very similar stuff."}],"speech_gaps":[],"frame":"../frames/v059/032.webp","frame_time":5227.82},{"title":"模型评估与安全测试","segments":[{"id":353,"text":"So you might actually run analysis to figure out if it's contaminated. And if you find that your test set has been exposed or you have a reason to think it's been exposed, what you do, you would usually fix the test set. The test set is smaller. You would remove all those examples that you think are exposed and you would replace them with brand new ones that are completely held offline in a folder that is separate, not available online, etc.","zh":"因此，你可能会实际进行分析，以确定是否受到污染。如果你发现测试集已经被暴露，或者你有理由认为它已经被暴露，你通常会修复测试集。测试集较小。你会移除所有你认为被暴露的例子，并用完全离线保存在单独文件夹中的全新例子来替换，这些文件夹不在线可用等等。","start":5375.53,"end":5403.79},{"id":354,"text":"Then there's the problem of safety evaluations. Not going to spend too much time on it, but safety is important to foundation model providers. They stress test their model under many adversarial attacks, jailbreaking, social engineering, misuses. They also assess harmful content generation, hallucination, privacy leakage, et cetera, et cetera.","zh":"然后还有安全评估的问题。不会花太多时间在上面，但安全对基础模型提供者来说很重要。他们会在许多对抗性攻击、越狱、社会工程和误用情况下对模型进行压力测试。他们还会评估有害内容生成、幻觉、隐私泄露等等。","start":5407.46,"end":5433.56},{"id":355,"text":"And then they also look at how the foundation model behaves in an agentic workflow, as I was saying earlier. So not only evaluating it sort of one shot, but evaluating it in a workflow. Here are some examples of...","zh":"此外，他们还会观察基础模型在代理工作流中的行为，正如我之前所说的。因此，不仅评估它一次性的表现，还会在工作流中进行评估。这里有一些例子……","start":5435.22,"end":5454.86},{"id":356,"text":"actually very nice joint collaboration between OpenAI and Anthropic from last year where they worked together to assess the safety of their models and they tried to jailbreak the model to socially engineer and they published some","zh":"实际上，去年OpenAI和Anthropic之间有一个非常不错的联合合作，他们一起评估了各自模型的安全性，并尝试越狱模型以进行社会工程，他们发布了一些","start":5455.53,"end":5472.25},{"id":357,"text":"findings on password protection or phrase protection. I linked it and I would encourage you to quickly look at it. They wrote prompts to try to extract a password from a model and see if the model was good at not leaking the password.","zh":"关于密码保护或短语保护的发现。我已链接了相关内容，鼓励你快速查看。他们编写提示以尝试从模型中提取密码，并查看模型是否擅长不泄露密码。","start":5474.19,"end":5490.97},{"id":358,"text":"So these dashboards essentially inform the go, no-go decision for releasing or for determining what the RLHF will be based on. So if you're actually going to do supervised fine-tuning or reinforcement learning from human feedback, it's expensive and you want to do it on the stuff that's failing.","zh":"因此，这些仪表盘基本上为发布决策或确定基于人类反馈的强化学习（RLHF）提供信息。因此，如果你实际上要进行监督微调或基于人类反馈的强化学习，这会很昂贵，你希望在那些失败的部分上进行。","start":5495.31,"end":5518.89},{"id":359,"text":"So if you identify exactly which evals are failing, you will then use that information to focus the RLHF on that specific problem and save a lot of money and human time. Lastly, let me see if there's anything else I wanted to mention here. Yeah. Yeah. Let's talk about the data diagnostic and we'll end on that.","zh":"因此，如果你能准确识别出哪些评估失败，你就可以利用这些信息将RLHF集中在特定问题上，从而节省大量金钱和人力时间。最后，让我看看是否还有其他要提到的内容。是的。是的。让我们谈谈数据诊断，我们以这个结束。","start":5519.68,"end":5553.97}],"notes":["本段主要讲解了模型评估中的数据污染问题，以及如何处理被污染的测试集。当发现测试集可能被污染时，通常的做法是移除被污染的数据并用新的数据替换，以确保评估结果的可靠性。","接下来讨论了模型安全评估的重要性，包括对抗攻击、越狱、社会工程和滥用等测试。这些测试帮助模型提供者确保模型在各种情况下都能安全运行。","此外，还提到了模型在代理工作流中的表现，强调了不仅需要单次评估，还需要在实际工作流中进行评估，以更全面地了解模型的行为。","提到OpenAI和Anthropic的合作案例，他们共同评估模型的安全性，并尝试越狱和社交工程，以测试模型的防御能力。","他们还发布了关于密码保护和短语保护的研究结果，鼓励学生查看相关链接。这些研究通过编写提示来测试模型是否能够防止密码泄露。","最后，讨论了评估仪表盘的作用，它们帮助决定是否发布模型或确定基于人类反馈的强化学习（RLHF）策略。如果模型在某些评估中表现不佳，应优先进行相关训练以节省成本和人力时间。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5375.53,"end":5553.97,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5375.53,"text":"So you might actually run analysis to figure out if it's contaminated. And if you find that your test set has been exposed or you have a reason to think it's been exposed, what you do, you would usually fix the test set. The test set is smaller. You would remove all those examples that you think are exposed and you would replace them with brand new ones that are completely held offline in a folder that is separate, not available online, etc."},{"start":5407.46,"text":"Then there's the problem of safety evaluations. Not going to spend too much time on it, but safety is important to foundation model providers. They stress test their model under many adversarial attacks, jailbreaking, social engineering, misuses. They also assess harmful content generation, hallucination, privacy leakage, et cetera, et cetera."},{"start":5435.22,"text":"And then they also look at how the foundation model behaves in an agentic workflow, as I was saying earlier. So not only evaluating it sort of one shot, but evaluating it in a workflow. Here are some examples of..."},{"start":5455.53,"text":"actually very nice joint collaboration between OpenAI and Anthropic from last year where they worked together to assess the safety of their models and they tried to jailbreak the model to socially engineer and they published some"},{"start":5474.19,"text":"findings on password protection or phrase protection. I linked it and I would encourage you to quickly look at it. They wrote prompts to try to extract a password from a model and see if the model was good at not leaking the password."},{"start":5495.31,"text":"So these dashboards essentially inform the go, no-go decision for releasing or for determining what the RLHF will be based on. So if you're actually going to do supervised fine-tuning or reinforcement learning from human feedback, it's expensive and you want to do it on the stuff that's failing."},{"start":5519.68,"text":"So if you identify exactly which evals are failing, you will then use that information to focus the RLHF on that specific problem and save a lot of money and human time. Lastly, let me see if there's anything else I wanted to mention here. Yeah. Yeah. Let's talk about the data diagnostic and we'll end on that."}],"speech_gaps":[],"frame":"../frames/v059/033.webp","frame_time":5387.53},{"title":"数据诊断与领域分布分析","segments":[{"id":360,"text":"So data diagnostics. This is probably the last area that frontier models are very focused on. So how labs detect data issues. There are...","zh":"所以是数据诊断。这可能是前沿模型非常关注的最后一个领域。那么实验室是如何检测数据问题的。有很多事情可以做，但我特别喜欢分布检查。","start":5555.41,"end":5568.35},{"id":361,"text":"Many things you can do, but I really like distribution checks. So I pulled this chart from a paper called Pile, the Pile from 2020, where the Pile is a very large data set, 800 gigabytes, that is made from diverse texts. And they kept the data domain. So they explain using that figure what the data set is made of.","zh":"我从一篇名为《Pile》的论文中拉出了这张图表，该论文发表于2020年，《Pile》是一个非常大的数据集，大小为800吉字节，由多样化的文本组成。他们保留了数据领域。因此，他们使用这张图来解释这个数据集由什么构成。","start":5569.23,"end":5591.21},{"id":362,"text":"So the data set might be made of information from free law, or it might be made of Wikipedia, Stack Exchange, GitHub with coding. And so you have different domains within that data set. And in fact, when you train a model on that, you can plot the loss function across the entire data set, or you can plot the loss function across different domains within that data set, which gives you more intuition for where it might be failing.","zh":"因此，这个数据集可能由自由法律的信息组成，也可能由维基百科、Stack Exchange、GitHub上的代码组成。因此，在这个数据集中存在不同的领域。事实上，当你在该数据集上训练模型时，你可以绘制整个数据集上的损失函数，或者绘制该数据集中不同领域上的损失函数，这能为你提供更直观的信息，了解模型可能在哪方面表现不佳。","start":5591.57,"end":5617.23},{"id":363,"text":"or working and so you might want to track domain proportions in your data set and domain proportions also matter because it is observed that if certain domains are underrepresented in the data the performance of the model on that domain is likely going to drop in comparison to another domain","zh":"或者在工作，因此你可能想要跟踪数据集中各个领域的比例，领域比例也很重要，因为观察到如果某些领域在数据中代表性不足，那么模型在该领域上的表现很可能比其他领域下降。","start":5617.79,"end":5641.35},{"id":364,"text":"So all things are not equal. If you actually have so much, we remember with the speech recognition example where I said you have too many zeros and too few ones, and so the model just doesn't learn the ones. Yeah.","zh":"并非所有事情都是平等的。如果你实际上拥有太多，我们记得在语音识别的例子中，我说过你有太多的零和太少的一，因此模型就无法学习到一。是的。","start":5642.58,"end":5657.74},{"id":365,"text":"This is also a problem with online learning. So imagine those frontier models, they're learning live, right? Like oftentimes they're just being fed data constantly. And maybe the batch from the last month had very little coding data. And so the last portion of the training, the distribution of the coding domain or the frequency was lower than other domains. And so sometimes you might see a drop in performance for a specific.","zh":"这也是在线学习中的一个问题。想象一下这些前沿模型，它们是在实时学习的，对吧？很多时候它们只是不断被输入数据。也许上个月的批次中包含非常少的代码数据。因此，在训练的最后部分，代码领域的分布或频率低于其他领域。因此，有时你可能会看到特定领域的性能下降。","start":5660.81,"end":5688.51},{"id":366,"text":"domain if you're not careful that can be fixed with sampling like smart sampling you remember what we saw in reinforcement learning with the experience replay where we actually kept experiences and we put them in a replay memory and then we sampled from that those are the types of method sampling methods that allow a model provider to make sure they keep the frequency of data domain the same at different portions of the training","zh":"如果你不加注意，领域分布可能会出现问题，但可以通过采样方法来解决，比如智能采样。你记得在强化学习中我们看到的经验回放，我们实际上保存了经验并将它们存储在回放缓存中，然后从中进行采样。这些是允许模型提供者确保在训练的不同阶段保持数据领域频率一致的采样方法。","start":5689.13,"end":5713.87},{"id":367,"text":"Yeah, token statistics, just to mention it a little bit. You know, you want to count the frequency changes for key tokens, which I was mentioning. So let's say, you know, a MAT token is...","zh":"是的，关于标记统计，我稍微提一下。你知道的，你想要统计关键标记的频率变化，这我之前提过。比如说，一个MAT标记是……","start":5717.63,"end":5734.15}],"notes":["本段主要讲解了数据诊断中的领域分布分析，强调了在训练模型时，不同领域数据的分布比例对模型性能的影响。如果某些领域在数据集中代表性不足，模型在这些领域的表现可能会下降。","讲者提到，如果数据集中某些领域的样本数量过少，模型可能无法有效学习这些领域的特征，类似于语音识别中样本不平衡的问题。","在线学习中，如果最近的数据批次中某个领域数据较少，模型在该领域的性能可能会下降，这需要通过采样方法来解决。","讲者提到，采样方法如经验回放（experience replay）可以用于保持不同训练阶段数据分布的一致性，从而避免性能下降。","此外，讲者还提到需要关注关键标记（token）的频率变化，这有助于理解模型在不同领域的表现。","这些方法和分析对于确保模型在不同领域中的公平性和性能稳定性至关重要。"],"formulas":[],"uncertainties":["domain proportions also matter because it is observed that if certain domains are underrepresented in the data the performance of the model on that domain is likely going to drop in comparison to another domain","the distribution of the coding domain or the frequency was lower than other domains","the types of method sampling methods that allow a model provider to make sure they keep the frequency of data domain the same at different portions of the training"],"diagram":"none","start":5555.41,"end":5734.15,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5555.41,"text":"So data diagnostics. This is probably the last area that frontier models are very focused on. So how labs detect data issues. There are..."},{"start":5569.23,"text":"Many things you can do, but I really like distribution checks. So I pulled this chart from a paper called Pile, the Pile from 2020, where the Pile is a very large data set, 800 gigabytes, that is made from diverse texts. And they kept the data domain. So they explain using that figure what the data set is made of."},{"start":5591.57,"text":"So the data set might be made of information from free law, or it might be made of Wikipedia, Stack Exchange, GitHub with coding. And so you have different domains within that data set. And in fact, when you train a model on that, you can plot the loss function across the entire data set, or you can plot the loss function across different domains within that data set, which gives you more intuition for where it might be failing."},{"start":5617.79,"text":"or working and so you might want to track domain proportions in your data set and domain proportions also matter because it is observed that if certain domains are underrepresented in the data the performance of the model on that domain is likely going to drop in comparison to another domain"},{"start":5642.58,"text":"So all things are not equal. If you actually have so much, we remember with the speech recognition example where I said you have too many zeros and too few ones, and so the model just doesn't learn the ones. Yeah."},{"start":5660.81,"text":"This is also a problem with online learning. So imagine those frontier models, they're learning live, right? Like oftentimes they're just being fed data constantly. And maybe the batch from the last month had very little coding data. And so the last portion of the training, the distribution of the coding domain or the frequency was lower than other domains. And so sometimes you might see a drop in performance for a specific."},{"start":5689.13,"text":"domain if you're not careful that can be fixed with sampling like smart sampling you remember what we saw in reinforcement learning with the experience replay where we actually kept experiences and we put them in a replay memory and then we sampled from that those are the types of method sampling methods that allow a model provider to make sure they keep the frequency of data domain the same at different portions of the training"},{"start":5717.63,"text":"Yeah, token statistics, just to mention it a little bit. You know, you want to count the frequency changes for key tokens, which I was mentioning. So let's say, you know, a MAT token is..."}],"speech_gaps":[],"frame":"../frames/v059/034.webp","frame_time":5567.41},{"title":"模型监控与专家混合机制","segments":[{"id":368,"text":"underrepresented, that will be a problem. The derivative symbol is underrepresented. That might actually lead to way worse performance for that specific task where you ask the model to make derivatives.","zh":"在代表性不足的情况下，这将是一个问题。导数符号的代表性不足。这实际上可能导致在要求模型进行导数计算的特定任务中性能严重下降。","start":5734.57,"end":5748.25},{"id":369,"text":"And so labs oftentimes monitor token drift or distribution or the frequency per token, and they use sampling to fix it. And finally, the contamination checks, which we have talked about earlier. I also give you concrete examples. Not going to go through all of them, but, you know, these are examples of token distribution drift reports, tokenizer statistics.","zh":"因此，实验室通常会监控令牌漂移、分布或每个令牌的频率，并使用抽样来解决这些问题。最后是污染检查，这是我们之前讨论过的。我还会给出具体的例子。不会一一讲解，但这些是令牌分布漂移报告和分词器统计信息的例子。","start":5751.79,"end":5774.87},{"id":370,"text":"issues that I raise here, or some anomalies on corrupt data detection. So if I read one of the examples for you, let's pick this one maybe.","zh":"我在这里提到的问题，或是在腐败数据检测中的一些异常。如果我为你读一个例子，也许我们可以选这个。","start":5776.6,"end":5793.06},{"id":371,"text":"non-English tokens increase from 12% to 19% after a new web crawl, where that might mean that the domain of that specific language is increasing relative to others, and that might lead to an increase in performance or a drop in performance for a different language. As simple as that. Okay. To summarize everything, what are examples of things that Frontier Labs monitor?","zh":"非英语令牌的比例在一次新的网络爬取后从12%增加到19%，这可能意味着特定语言的领域相对于其他语言有所增加，这可能导致另一种语言的性能提升或下降。就这么简单。总结一下，Frontier Labs监控哪些例子？","start":5796.6,"end":5829.15},{"id":372,"text":"Global training loss, validation loss, both global and domain-specific on the subset of the data. Scaling curve alignment, comparing your test loss to your compute, to your data set, or to your model capacity. Oh, we didn't talk too much about router, but mixture of experts. Imagine you have a...","zh":"全局训练损失、验证损失，以及在数据子集上的全局和领域特定损失。扩展曲线对齐，将你的测试损失与计算资源、数据集或模型容量进行比较。哦，我们之前没有太多讨论路由器，但专家混合。想象一下，你有一个……","start":5830.54,"end":5851.08},{"id":373,"text":"A lot of the models that are top models right now are mixtures of experts, meaning that in your transformer block for the multi-layer perceptron, there's actually multiple experts that are being trained in parallel. And there's a router that will route that batch of data to the right experts, to top one, top two, top three experts. And it's very common for the router to fail or to always exploit the same.","zh":"目前很多顶级模型都是专家混合模型，这意味着在你的变压器块中，对于多层感知机，实际上有多个专家在并行训练。还有一个路由器会将这批数据路由到合适的专家，即排名前一、前二、前三的专家。路由器失败或总是利用同一个专家是非常常见的。","start":5851.58,"end":5878.88},{"id":374,"text":"mixture of experts you need a mechanism to detect when this happens and so you might have in your health dashboard some sort of a router information or whether the mixture of experts are all used as much as each other sometimes certain experts are going to be so specialized that they're never going to be used almost and you want to avoid that and you might do some load balancing to avoid that you know gradient norms learning rates","zh":"专家混合机制你需要一种机制来检测这种情况的发生，因此你可能在健康仪表板中包含某种路由信息，或者是否专家混合体中的各个专家都被使用得同样多。有时某些专家会如此专业化，以至于几乎永远不会被使用，你想要避免这种情况，你可能会进行一些负载平衡来避免这种情况，比如梯度范数学习率","start":5879.29,"end":5905.21}],"notes":["本段主要讲解了模型监控中的专家混合机制，即模型中包含多个专家（expert）并行训练，通过一个路由器（router）将数据分配给合适的专家。路由器可能失效或总是选择相同的专家，这会导致模型性能下降。因此，需要机制来检测这种情况，并通过负载均衡来避免某些专家未被使用的问题。","讲者提到，专家混合模型中，路由器将数据分配给排名靠前的专家，如top one、top two、top three。然而，路由器可能失效或总是选择相同的专家，这会导致模型性能下降。因此，需要监控路由器的行为，并确保所有专家都被充分利用。","讲者指出，专家混合模型中，某些专家可能过于专业化，导致它们几乎从未被使用。为了避免这种情况，可以采用负载均衡策略，确保所有专家都被合理使用。此外，还可能涉及梯度范数和学习率的调整。","讲者提到，监控路由器信息和专家使用情况是模型健康检查的一部分。这包括检查专家是否被均匀使用，以及是否存在某些专家未被调用的情况。如果发现这种情况，需要采取措施进行调整。","讲者强调，专家混合模型的监控需要关注多个方面，包括路由器行为、专家使用率、负载均衡策略等。这些监控指标有助于确保模型的稳定性和性能。","讲者提到，专家混合模型的监控是模型健康检查的重要组成部分，涉及多个技术细节，如路由器行为、专家使用率、负载均衡等。这些监控指标有助于及时发现和解决模型中的潜在问题。"],"formulas":[],"uncertainties":["mixture of experts you need a mechanism to detect when this happens and so you might have in your health dashboard some sort of a router information or whether the mixture of experts are all used as much as each other sometimes certain experts are going to be so specialized that they're never going to be used almost and you want to avoid that and you might do some load balancing to avoid that you know gradient norms learning rates"],"diagram":"none","start":5734.57,"end":5905.21,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5734.57,"text":"underrepresented, that will be a problem. The derivative symbol is underrepresented. That might actually lead to way worse performance for that specific task where you ask the model to make derivatives."},{"start":5751.79,"text":"And so labs oftentimes monitor token drift or distribution or the frequency per token, and they use sampling to fix it. And finally, the contamination checks, which we have talked about earlier. I also give you concrete examples. Not going to go through all of them, but, you know, these are examples of token distribution drift reports, tokenizer statistics."},{"start":5776.6,"text":"issues that I raise here, or some anomalies on corrupt data detection. So if I read one of the examples for you, let's pick this one maybe."},{"start":5796.6,"text":"non-English tokens increase from 12% to 19% after a new web crawl, where that might mean that the domain of that specific language is increasing relative to others, and that might lead to an increase in performance or a drop in performance for a different language. As simple as that. Okay. To summarize everything, what are examples of things that Frontier Labs monitor?"},{"start":5830.54,"text":"Global training loss, validation loss, both global and domain-specific on the subset of the data. Scaling curve alignment, comparing your test loss to your compute, to your data set, or to your model capacity. Oh, we didn't talk too much about router, but mixture of experts. Imagine you have a..."},{"start":5851.58,"text":"A lot of the models that are top models right now are mixtures of experts, meaning that in your transformer block for the multi-layer perceptron, there's actually multiple experts that are being trained in parallel. And there's a router that will route that batch of data to the right experts, to top one, top two, top three experts. And it's very common for the router to fail or to always exploit the same."},{"start":5879.29,"text":"mixture of experts you need a mechanism to detect when this happens and so you might have in your health dashboard some sort of a router information or whether the mixture of experts are all used as much as each other sometimes certain experts are going to be so specialized that they're never going to be used almost and you want to avoid that and you might do some load balancing to avoid that you know gradient norms learning rates"}],"speech_gaps":[],"frame":"../frames/v059/035.webp","frame_time":5746.57},{"title":"模型训练数据与领域平衡","segments":[{"id":375,"text":"checkpoint-to-checkpoint eval benchmark, token distribution, tokenizer static. We covered all of that at a high level. And as I said earlier, Frontier Labs rarely publish those dashboards because it's IP and because it can leak certain deep information about their IP and how their models are trained. And so you usually learn about these things year after. You might learn about these things on a model that came out three years ago or four years ago, and they're okay now with sharing it.","zh":"检查点到检查点评估基准，标记分布，分词器静态。我们已经从高层次覆盖了这些内容。正如我之前所说，Frontier Labs很少发布这些仪表盘，因为这是知识产权，而且可能会泄露有关其知识产权和模型训练方式的某些深层信息。因此，你通常是在多年后才了解到这些信息。你可能是在三年或四年前发布的模型上了解到这些信息，而现在他们已经可以放心分享了。","start":5906.31,"end":5935.57},{"id":376,"text":"Pretty common. Okay. So closing remarks. Any questions first? Yeah. Yeah, so you're asking if Anthropic is training float code, do they care mostly about coding data or do they also add other data?","zh":"这相当常见。好的。那么最后的总结。有没有问题？有的。是的，你在问Anthropic是否在训练浮点代码，他们是否主要关注编码数据，还是也会添加其他数据？","start":5936.45,"end":5971.79},{"id":377,"text":"Yeah, it's a tough question. I don't have the exact answer. It's been shown that certain domains might improve the performance of other domains. So I imagine that in coding, you know, if you have math data, maybe math data actually helps the performance of coding, especially for functional programming. Let's say coding languages that are more mathematical.","zh":"是的，这是一个棘手的问题。我没有确切的答案。已经证明某些领域可能会提升其他领域的性能。因此，我想象在编码领域，如果你有数学数据，数学数据实际上可能会帮助编码性能，尤其是在函数式编程方面。比如说，那些更偏向数学的编程语言。","start":5972.67,"end":5992.45},{"id":378,"text":"I could clearly see that if they were training cloud code on web crawl and everything, it would not perform well because you would have so much crap data that is not relevant for what you're trying to get the model to do. And so I think there is a balance between those things. I think you could run experiments. So would you include neighboring domains? If I were training cloud code, and I had a lot of money to do that, I would probably, you know...","zh":"我可以清楚地看到，如果他们用网络爬取等所有数据来训练云代码，性能不会很好，因为你会有太多不相关于你试图让模型完成的任务的垃圾数据。因此，我认为在这些方面需要取得平衡。我认为你可以进行实验。因此，你会包含邻近领域吗？如果我正在训练云代码，而且我有足够的资金来做这件事，我可能会……","start":5994.57,"end":6027.92},{"id":379,"text":"maybe you start with the Python language and you get as much, and there's so much data on Python language, so you probably have enough already there. But then you want a model that scales to other programming languages. Well, probably Python is useful for C++. C++ is useful for Java. And then functional programming, if you're going to Elixir, Scala, things like that, they're helping each other probably to a certain extent, but you will need to have representation of those. I could see that...","zh":"也许你从Python语言开始，获取尽可能多的数据，因为Python语言的数据非常多，你可能已经拥有足够的数据了。但你想要一个能够扩展到其他编程语言的模型。很可能Python对C++有用，C++对Java有用，而函数式编程，如果你要使用Elixir、Scala之类的东西，它们在某种程度上可能会互相帮助，但你需要有这些领域的表示。我可以看到……","start":6028.68,"end":6055.94},{"id":380,"text":"I'm pretty sure, and I don't work at Anthropic, so I don't know, but I'm pretty sure, let's say a language like Rust increases in popularity, which is the case, right? And then in the data distribution, you start seeing more frequency of those tokens from Rust. Does that affect the performance on other languages? Probably yes. That's my guess. And how do you track it? This is all what we talked about. Yeah.","zh":"我 pretty sure，而且我并不在 Anthropic 工作，所以我不确定，但我 pretty sure，比如说像 Rust 这样的语言如果变得更流行，这种情况确实存在，对吧？然后在数据分布中，你会开始看到更多来自 Rust 的 token 频率。这是否会影响在其他语言上的表现？可能会影响。这是我猜测的。你是如何追踪这种情况的？这就是我们之前讨论的所有内容。是的。","start":6057.06,"end":6083.8}],"notes":["本段讨论了模型训练中不同领域数据对性能的影响，特别是编程语言之间的相互作用。讲者指出，某些领域（如数学）的数据可能有助于提升其他领域（如编程）的性能，尤其是在功能性编程语言中。同时，讲者强调了在训练模型时需要平衡不同领域的数据，避免引入无关或低质量的数据，这可能会影响模型的表现。","讲者提到，如果模型训练仅依赖于网络爬取等广泛但杂乱的数据，可能会导致性能下降。因此，需要在不同领域之间找到合适的平衡，并通过实验来验证这种平衡是否有效。","讲者进一步指出，编程语言之间可能存在相互促进的关系，例如Python对C++、C++对Java、功能性编程语言对Elixir和Scala等。这种相互促进关系可能有助于模型在不同语言间的泛化能力。","讲者还提到，当某种编程语言（如Rust）的流行度上升时，其在数据分布中的频率也会增加，这可能会影响模型在其他语言上的表现。因此，需要跟踪这种变化，并评估其对模型性能的影响。","讲者最后总结说，这些讨论涵盖了之前提到的关于数据分布、模型训练和领域平衡的内容，强调了在实际训练过程中需要综合考虑多种因素。","讲者强调，虽然他并不在Anthropic工作，但他基于已有知识和逻辑推理，提出了关于模型训练和数据选择的合理推测。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5906.31,"end":6083.8,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5906.31,"text":"checkpoint-to-checkpoint eval benchmark, token distribution, tokenizer static. We covered all of that at a high level. And as I said earlier, Frontier Labs rarely publish those dashboards because it's IP and because it can leak certain deep information about their IP and how their models are trained. And so you usually learn about these things year after. You might learn about these things on a model that came out three years ago or four years ago, and they're okay now with sharing it."},{"start":5936.45,"text":"Pretty common. Okay. So closing remarks. Any questions first? Yeah. Yeah, so you're asking if Anthropic is training float code, do they care mostly about coding data or do they also add other data?"},{"start":5972.67,"text":"Yeah, it's a tough question. I don't have the exact answer. It's been shown that certain domains might improve the performance of other domains. So I imagine that in coding, you know, if you have math data, maybe math data actually helps the performance of coding, especially for functional programming. Let's say coding languages that are more mathematical."},{"start":5994.57,"text":"I could clearly see that if they were training cloud code on web crawl and everything, it would not perform well because you would have so much crap data that is not relevant for what you're trying to get the model to do. And so I think there is a balance between those things. I think you could run experiments. So would you include neighboring domains? If I were training cloud code, and I had a lot of money to do that, I would probably, you know..."},{"start":6028.68,"text":"maybe you start with the Python language and you get as much, and there's so much data on Python language, so you probably have enough already there. But then you want a model that scales to other programming languages. Well, probably Python is useful for C++. C++ is useful for Java. And then functional programming, if you're going to Elixir, Scala, things like that, they're helping each other probably to a certain extent, but you will need to have representation of those. I could see that..."},{"start":6057.06,"text":"I'm pretty sure, and I don't work at Anthropic, so I don't know, but I'm pretty sure, let's say a language like Rust increases in popularity, which is the case, right? And then in the data distribution, you start seeing more frequency of those tokens from Rust. Does that affect the performance on other languages?
