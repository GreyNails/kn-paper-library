Probably yes. That's my guess. And how do you track it? This is all what we talked about. Yeah."}],"speech_gaps":[],"frame":"../frames/v059/036.webp","frame_time":5918.31},{"title":"合成数据的使用与未来趋势","segments":[{"id":381,"text":"Yeah, question is, you know, let's say we trained on everything online and now real data. And now what about synthetic data? Should we use it a lot? Should we use it strategically? What's the future of that? So it depends.","zh":"是的，问题是，比如说我们已经在线上训练了所有数据，现在有了真实数据。那么合成数据呢？我们应该大量使用它吗？还是应该战略性地使用它？它的未来会怎样？这取决于具体情况。","start":6094.57,"end":6110.74},{"id":382,"text":"Are you talking about general purpose models or not, specialized models? In general, it is a good idea to do data augmentation, to use synthetic data, although I would always watch the token frequency, meaning you can't, because synthetic data is way cheaper.","zh":"你是在谈论通用目的模型，还是专门化的模型？一般来说，进行数据增强，使用合成数据是一个好主意，尽管我总是会注意令牌频率，意思是不能因为合成数据成本低廉就过度使用。","start":6111.49,"end":6128.43},{"id":383,"text":"If you actually generate so much synthetic data of a certain data domain, and then it impedes on the rest and lowers the performance on the rest because the model just is always trained on that synthetic data, then that's a problem. In practice, I think also the returns of synthetic data might be plateauing at some point.","zh":"如果你实际上生成了某一数据领域的大量合成数据，然后它影响了其他领域的表现，导致模型在这些领域上的性能下降，因为模型总是只在合成数据上训练，这就会成为一个问题。在实践中，我认为合成数据的回报可能在某个时候会趋于平稳。","start":6129.97,"end":6146.21},{"id":384,"text":"The recent news, I guess, and if you look at the DeepMind paper, it's probably that we're lacking high-quality data more than we're lacking synthetic data for most domains right now. But who knows if it's going to be the case. Some other people would say what we're actually lacking is letting these agents play in RL environments in the wild and generate their own synthetic data or real data but part of a game.","zh":"最近的新闻，我想，如果你看一下DeepMind的论文，大概就是我们现在缺乏高质量数据比缺乏合成数据更为严重，至少在大多数领域是这样。但谁知道会不会是这种情况呢。有些人可能会说，我们真正缺乏的是让这些智能体在现实的强化学习环境中进行游戏，从而生成它们自己的合成数据或真实数据。","start":6147.45,"end":6173.25},{"id":385,"text":"You know, nobody has quite the answer. I would just say the trend has gone from... Actually, you should look at a paper from Epoch AI. Maybe you've seen that already, but Epoch AI has a really nice research report which says by... I forgot the exact numbers, but it's in there. By 2025, the world would have... The frontier labs would have exhausted low-quality data available online in text.","zh":"说实话，没人确切知道答案。我会说趋势已经从……实际上，你应该看一下Epoch AI的一篇论文。也许你已经看过，但Epoch AI有一份非常不错的研究报告，它说……我忘了具体的数字，但里面提到了。到2025年，世界上的前沿实验室将耗尽网络上可获得的低质量文本数据。","start":6173.79,"end":6201.78},{"id":386,"text":"By 2027, low-quality data in audio, image, and video would have been exhausted. By 2030, high-quality data would also have been exhausted. And at that point, it's like, what's next? Probably by that time, data is not going to be the bottleneck anymore, and it's going to be more about model architecture. Are we producing more data than we're using? Probably yes, but it doesn't mean the models are not plateauing.","zh":"到2027年，音频、图像和视频中的低质量数据也将被耗尽。到2030年，高质量数据也将被耗尽。到了那时，接下来会怎样呢？可能到那时，数据将不再是瓶颈，而是更多地取决于模型架构。我们是否生产的数据多于使用的数据？可能如此，但这并不意味着模型不会趋于平稳。","start":6202.65,"end":6238.61},{"id":387,"text":"The data that you go and you code in Python, your Python code is going to be already online somewhere, most likely, or 99% of it. So the model is actually not learning that much from it. It's just more data, not higher quality data. And that's why I think the plateau is there. Maybe the best radiologist in the world is producing a research paper that is so unique that it's high quality.","zh":"你去编写并运行的Python代码，很可能已经在线上某个地方存在了，大概率是99%的内容。因此，模型实际上并没有从这些数据中学习到太多。这只是更多的数据，而不是更高质量的数据。这就是我为什么认为存在一个平台期。也许世界上最好的放射科医生所撰写的论文是如此独特，以至于其质量非常高。","start":6239.13,"end":6263.98}],"notes":["本段讨论了合成数据在模型训练中的使用，强调了合成数据虽然成本较低，但过度使用可能导致模型性能下降。讲者指出，合成数据的回报可能会在某个点趋于平稳，因此需要谨慎使用。","讲者提到当前在大多数领域，我们更缺乏高质量数据，而不是合成数据。他引用了DeepMind的论文，并指出一些人认为真正缺乏的是让智能体在真实环境中进行探索，从而生成自己的合成数据或真实数据。","讲者引用了Epoch AI的一份研究报告，预测到2025年，文本领域的低质量数据将被耗尽，2027年音频、图像和视频领域的低质量数据也将被耗尽，而到2030年，高质量数据也将被耗尽。这表明数据可能不再是模型发展的瓶颈，模型架构的重要性将更加突出。","讲者指出，即使我们生成大量数据，模型可能并不会从中学习到太多，因为这些数据可能只是重复的、低质量的内容。因此，模型的性能可能达到一个平台期，而真正高质量的数据可能来自少数独特且有价值的内容，如顶级专家的研究论文。","讲者强调了数据质量的重要性，指出合成数据和真实数据的使用需要策略性，不能盲目增加数据量。同时，他提到模型的性能平台期可能与数据质量有关，而不是数据量本身。","讲者最后指出，Python代码等常见数据可能已经存在于网络上，因此模型无法从中学习到新知识，这进一步说明了高质量数据的稀缺性和重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6094.57,"end":6263.98,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":6094.57,"text":"Yeah, question is, you know, let's say we trained on everything online and now real data. And now what about synthetic data? Should we use it a lot? Should we use it strategically? What's the future of that? So it depends."},{"start":6111.49,"text":"Are you talking about general purpose models or not, specialized models? In general, it is a good idea to do data augmentation, to use synthetic data, although I would always watch the token frequency, meaning you can't, because synthetic data is way cheaper."},{"start":6129.97,"text":"If you actually generate so much synthetic data of a certain data domain, and then it impedes on the rest and lowers the performance on the rest because the model just is always trained on that synthetic data, then that's a problem. In practice, I think also the returns of synthetic data might be plateauing at some point."},{"start":6147.45,"text":"The recent news, I guess, and if you look at the DeepMind paper, it's probably that we're lacking high-quality data more than we're lacking synthetic data for most domains right now. But who knows if it's going to be the case. Some other people would say what we're actually lacking is letting these agents play in RL environments in the wild and generate their own synthetic data or real data but part of a game."},{"start":6173.79,"text":"You know, nobody has quite the answer. I would just say the trend has gone from... Actually, you should look at a paper from Epoch AI. Maybe you've seen that already, but Epoch AI has a really nice research report which says by... I forgot the exact numbers, but it's in there. By 2025, the world would have... The frontier labs would have exhausted low-quality data available online in text."},{"start":6202.65,"text":"By 2027, low-quality data in audio, image, and video would have been exhausted. By 2030, high-quality data would also have been exhausted. And at that point, it's like, what's next? Probably by that time, data is not going to be the bottleneck anymore, and it's going to be more about model architecture. Are we producing more data than we're using? Probably yes, but it doesn't mean the models are not plateauing."},{"start":6239.13,"text":"The data that you go and you code in Python, your Python code is going to be already online somewhere, most likely, or 99% of it. So the model is actually not learning that much from it. It's just more data, not higher quality data. And that's why I think the plateau is there. Maybe the best radiologist in the world is producing a research paper that is so unique that it's high quality."}],"speech_gaps":[],"frame":"../frames/v059/037.webp","frame_time":6106.57},{"title":"模型内部发生了什么","segments":[{"id":388,"text":"By definition of what the models feel is high quality today, but how much of that can we expect? Yeah, it's risky. Is it risky for the model to... The model, let's say, is online learning, so it's learning from new data being produced by everyone. Is that going to risk the model performance to drop? Essentially, that's what you're asking? Yeah, in that case, yeah.","zh":"根据模型今天认为高质量的标准，但我们可以期望多少呢？是的，这很危险。对于模型来说，这是否危险？假设模型正在进行在线学习，因此它从每个人生成的新数据中学习。这是否会危及模型的性能？本质上，这就是你在问的问题？是的，在这种情况下，是的。","start":6264.86,"end":6307.59},{"id":389,"text":"Yeah, data produced is also coming out of AI, yeah, for sure. More today than before. Like coding data today is increasingly used by, you know, is increasingly generated, and so it's just fed back. So just long story short, it's not that interesting for training. So closing remarks and reminder on what's next.","zh":"是的，产生的数据也来自于AI，毫无疑问。如今比以往任何时候都多。例如，今天的编码数据越来越多地被使用，越来越多地生成，然后又被反馈回来。所以简而言之，这在训练中并不那么有趣。所以结束语和提醒，关于接下来的内容。","start":6308.34,"end":6337.69},{"id":390,"text":"So, by the way, I hope you feel after this lecture that you have a better understanding of the techniques that you can use in order to look inside a model, look outside a model, both for CNNs and for frontier models. Again, it's just a two-hour lecture. We don't have time to go so deep as much as I would like it in each of these domains.","zh":"顺便说一句，我希望你们在听完这节课后，对可以用来查看模型内部和外部的技术有更深入的理解，无论是对于卷积神经网络还是前沿模型。再次强调，这仅仅是一节两小时的课程，我们没有足够的时间像我希望的那样深入探讨每个领域。","start":6338.29,"end":6357.75},{"id":391,"text":"It's my last lecture this quarter. And so thank you for participating. I enjoyed spending time with you all. I hope you spend time on your projects. Projects can be very delightful in CS230. Over the years, I've seen people use their products to get a job, to start a company, to make friends. And so I don't think you will regret putting...","zh":"这是我本季度的最后一节课。因此，感谢你们的参与。我很享受与你们共度的时间。我希望你们花时间在你们的项目上。在CS230中，项目可以非常有趣。多年来，我看到人们利用他们的产品找到工作、创办公司、结交朋友。因此，我认为你们即使在我们剩余时间不多的情况下，投入时间和精力到项目中也不会后悔。","start":6360.33,"end":6384.77},{"id":392,"text":"time and effort into your projects even if we don't have too much time left those are the the last you know milestones for the or or deliverables for the class i hope you enjoyed the class we're always looking for feedback and so i'm eager to hear from you all thank you","zh":"时间与精力投入到你们的项目中，即使我们剩余时间不多，这些是你们最后的里程碑，或者是课程的交付成果。我希望你们喜欢这门课，我们一直在寻找反馈，因此我渴望听到你们所有人的心声。谢谢。","start":6385.13,"end":6402.15}],"notes":["本段讨论了模型在在线学习中可能面临的风险，特别是当新数据由AI生成时，模型性能是否会下降。讲者指出，这种风险是存在的，但具体影响需要进一步分析。","讲者提到当前的数据越来越多是由AI生成的，这使得数据反馈循环更加紧密，但对训练模型的影响并不显著，因此在训练中并不特别有趣。","讲者强调了本节课的目标是帮助学生理解如何从内部和外部分析模型，适用于CNN和前沿模型。但由于时间限制，无法深入每个领域。","讲者表示这是本季度的最后一节课，并感谢学生的参与。他鼓励学生投入时间在项目上，因为项目在CS230中具有重要意义，过去学生通过项目获得了许多机会。","最后，讲者表达了对课程的重视，并希望学生提供反馈，以帮助改进教学。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6264.86,"end":6402.15,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":6264.86,"text":"by definition of what the models feel is high quality today, but how much of that can we expect? Yeah, it's risky. Is it risky for the model to... The model, let's say, is online learning, so it's learning from new data being produced by everyone. Is that going to risk the model performance to drop? Essentially, that's what you're asking? Yeah, in that case, yeah."},{"start":6308.34,"text":"Yeah, data produced is also coming out of AI, yeah, for sure. More today than before. Like coding data today is increasingly used by, you know, is increasingly generated, and so it's just fed back. So just long story short, it's not that interesting for training. So closing remarks and reminder on what's next."},{"start":6338.29,"text":"So, by the way, I hope you feel after this lecture that you have a better understanding of the techniques that you can use in order to look inside a model, look outside a model, both for CNNs and for frontier models. Again, it's just a two-hour lecture. We don't have time to go so deep as much as I would like it in each of these domains."},{"start":6360.33,"text":"It's my last lecture this quarter. And so thank you for participating. I enjoyed spending time with you all. I hope you spend time on your projects. Projects can be very delightful in CS230. Over the years, I've seen people use their products to get a job, to start a company, to make friends. And so I don't think you will regret putting..."},{"start":6385.13,"text":"time and effort into your projects even if we don't have too much time left those are the the last you know milestones for the or or deliverables for the class i hope you enjoyed the class we're always looking for feedback and so i'm eager to hear const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
