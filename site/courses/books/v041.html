 softmax of ut. Is it ut or ut plus 1? ut plus ut, yes, ut, which is the softmax of f theta x0 to xt. Okay? Any questions so far? So I particularly chose it to index at 1, yes. Yes."},{"start":1261.76,"text":"U is just the vector. I think I can just call U, I think it's kind of like, I can just call U after the X0 is the same thing. I'm not, did I answer the question? So, oh, I think maybe that's the, so, so."},{"start":1292.74,"text":"I'm just using offset X0, X1 as a more explicit way to represent UI because I'm trying to express the dependency. So basically, I'm saying like a, basically, I think they are the same thing. Like, there are no difference at all in some sense, just how you view it, right? Like, in one way, you just say, oh, I need a notation for the vector. In the other way, you say, I need to interpret this vector as a function of the inputs. Right, right. Yeah, I mean, that part is..."},{"start":1322.03,"text":"Oh, OK, OK, OK. So maybe I didn't have a question. There's a probability of seeing that. That's the probability of that. So I'm just trying to understand, like, this probability one in there, the . Are you just trying to predict the probability of seeing the ? Yes, yes, yes. So I think maybe I'm trying to figure out what's the question here."}],"speech_gaps":[],"frame":"../frames/v041/008.webp","frame_time":1224.67},{"title":"Transformer 与上下文学习中的概率模型","segments":[{"id":167,"text":"I think maybe what you're asking is the following. So maybe let's take this one. So this is a vector. This is a vector in dimension v. So in a vocabulary size. And you have to take a softmax. It's a sequence of numbers which are all non-negative and they sum to one. And what this really means is that p theta of xt is equals to one."},{"id":168,"text":"given x1 up to xt minus 1. The chance to see the first token under this probabilistic model, parametrized by theta, is equal to, this is the vector, the first entry of this vector. It's equal to softmax f theta x0 up to xt minus 1, indexed by 1. This is the first entry of this vector. And you have many, many other entries. Each entry is like, you have another entry, softmax f theta."},{"id":169,"text":"2, and that is equal to P theta of Xt is equal to 2, the chance of seeing the second token given X1 up to Xt minus 1. And you have so on and so forth. Does that answer the question? Yeah, this V absolute value is the size of the vocabulary. So is this like a mass function? Because the modules are conditional on the previous one. It's not the ones after it, right? Yep."},{"id":170,"text":"Yeah, so this is a causal model so far. But I haven't defined the transformer yet. But I'm insisting that this is only. So guys, this is one of the reasons I'm using this notation. So I'm insisting that ut is only a function of x0 and xt minus 1, but not a function of the later inputs. But that will be guaranteed when we introduce the exact inner working of this transformer."},{"id":171,"text":"Okay, good question. So the second question is easier to answer. So the embeddings is only a property of the..."},{"id":172,"text":"this x, right? You don't have to see any other things, right? It's just actually, it's literally, if this is the first token, then you just read the first row of this matrix. If this is the 10th token, you use the 10th row, and that's your embedding. No any other dependencies. And while we are writing this as functions of the x, but not the embeddings, that's just a, it's just a..."}],"notes":["本段讲解了在Transformer模型中，概率分布如何通过softmax函数进行计算。具体来说，每个token的概率是基于前面的token序列计算的，且所有概率值的和为1。这表明模型是条件概率模型，每个token的生成依赖于前面的token。","讲者提到，每个token的概率对应于softmax函数的输出，其中每个输出项代表该token在给定前面token序列下的条件概率。例如，第一个token的概率是softmax函数的第一个输出项，第二个token的概率是第二个输出项，以此类推。","讲者强调，这种概率分布是条件概率，即每个token的概率依赖于前面的token序列，而不是后面的token。这表明模型具有因果性，即当前token的生成仅依赖于前面的token，而不是后面的。","讲者指出，这种条件概率模型是因果模型的一部分，但尚未定义Transformer的具体结构。他强调，这种因果性将在后续介绍Transformer的内部机制时得到保证。","讲者提到，嵌入（embedding）仅是输入x的属性，即每个token的嵌入对应于其在词汇表中的位置，直接从矩阵中读取对应的行即可。这表明嵌入是独立于其他token的，没有额外的依赖关系。","讲者指出，虽然嵌入是输入x的函数，但嵌入本身并不依赖于其他token，因此可以独立计算。这种设计简化了模型的结构，使得每个token的处理可以独立进行。"],"formulas":[],"uncertainties":["parametrized by theta","the embeddings is only a property of the...","it's just a...","the embeddings, that's just a..."],"diagram":"none","start":1370.38,"end":1535.54,"asr_flags":[],"math_clarifications":["原文中提到的 softmax 函数输出是一个概率分布，但公式中直接将 softmax 函数的输出与概率分布等同，这是不正确的。正确的表达应为 softmax 函数的输出是概率分布，而 p_θ(x_t) 是该分布的某个具体值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1370.38,"text":"I think maybe what you're asking is the following. So maybe let's take this one. So this is a vector. This is a vector in dimension v. So in a vocabulary size. And you have to take a softmax. It's a sequence of numbers which are all non-negative and they sum to one. And what this really means is that p theta of xt is equals to one."},{"start":1400.43,"text":"given x1 up to xt minus 1. The chance to see the first token under this probabilistic model, paramatched by theta, is equal to, this is the vector, the first entry of this vector. It's equal to softmax f theta x0 up to xt minus 1, indexed by 1. This is the first entry of this vector. And you have many, many other entries. Each entry is like, you have another entry, softmax f theta."},{"start":1437.61,"text":"2, and that is equal to P theta of Xt is equal to 2, the chance of seeing the second token given X1 up to Xt minus 1. And you have so on and so forth. Does that answer the question? Yeah, this V absolute value is the size of the vocabulary. So is this like a mass function? Because the modules are conditional on the previous one. It's not the ones after it, right? Yep."},{"start":1469.16,"text":"Yeah, so this is a causal model so far. But I haven't defined the transformer yet. But I'm insisting that this is only. So guys, this is one of the reasons I'm using this notation. So I'm insisting that ut is only a function of x0 and xt minus 1, but not a function of the later inputs. But that will be guaranteed when we introduce the exact inner working of this transformer."},{"start":1508.96,"text":"Okay, good question. So the second question is easier to answer. So the embeddings is only a property of the..."},{"start":1517.04,"text":"this x, right? You don't have to see any other things, right? It's just actually, it's literally, if this is the first token, then you just read the first row of this matrix. If this is the 10th token, you use the 10th row, and that's your embedding. No any other dependencies. And while we are writing this as functions of the x, but not the embeddings, that's just a, it's just a..."}],"speech_gaps":[{"start":1497.328,"end":1502.08},{"start":1502.08,"end":1508.016}],"frame":"../frames/v041/009.webp","frame_time":1382.38},{"title":"Transformer 与上下文学习","segments":[{"id":173,"text":"Sometimes the embeddings are the inner workings to some degree. I'm just trying to give you more. I'm trying to unpack it a little bit. So if you don't have to unpack it, you can work with the text. That's just the representation. It's one-to-one, so in some sense, there's no difference."},{"id":174,"text":"Okay, so this is a full description of the probabilistic model. Once you have this probabilistic model, you can compute the maximum likelihood, given any data. We can say, I have a data distribution, I have a data point, a sequence of data, I can see under this probabilistic model, p theta, what is the chance of seeing this data. So that's what you need for computing, do the training, right? You need to compute the likelihood, and then you maximize the likelihood as a function of theta, right? So, and let's briefly discuss"},{"id":175,"text":"Because for generation, suppose you already have the generational decoding. Suppose you already have the model, then a model theta, then what do you do? So as you can see, the most natural thing is you just keep generating x1, x2, x3, so on and so forth. You just say, I'm going to generate x1 first from this p, say, softmax, f theta."},{"id":176,"text":"x1 up to x0 up to xt. I guess I just did it right generically. So we generate xt minus 1 from f theta x0 up to xt minus 1. You can do this sequentially. Sometimes people draw this in this way. So you say, oh, you have x0. You first go through the transformer. And you get x1. And you feed x1 back to this transformer."},{"id":177,"text":"And then you generate x2 by sampling from the software. And then you feedback. So that's kind of why it's called autoregressive, because you"},{"id":178,"text":"When you are generating, you don't have the sequence, right? When you are computing log likelihood, you already see the whole sequence. You are just trying to figure out what's the chance of seeing this sequence. But when you are generating, you start with nothing. And then you have to generate your sequence yourself. And that's why you start with the beginning of sentence token, and then you generate the first token, and then you give the first token back to the transformer and compute this softmax. And then you generate a second token. You do a sampling to generate a second token, and you give it back."},{"id":179,"text":"You keep doing this. So that's the autoregressive generation. And sometimes, this generation can only start from certain parts because in many cases, you are not generating from nothing. So you are given maybe a few tokens. Maybe you are given, so sometimes it's called prompt. So prompt is like something the models are given. It's maybe like a question, an instruction, so on and so forth. You say you are given x1 up to xk."}],"notes":["本段主要讲解了Transformer模型中的嵌入表示，指出嵌入是模型内部工作的一部分，但也可以直接使用文本进行处理。嵌入是一种一对一的表示，因此在某种程度上没有区别。","接下来，讲者介绍了概率模型的完整描述，强调了在给定数据的情况下，可以通过计算最大似然来训练模型。最大似然的计算需要知道数据分布和数据点，并通过概率模型pθ来计算数据出现的概率。","在生成过程中，讲者讨论了自回归生成的机制，即通过逐步生成序列中的每个元素，并将前一个元素反馈给模型进行下一步的生成。这种机制使得模型能够逐步构建整个序列。","讲者还提到，在生成过程中，模型并不知道整个序列，而是从头开始逐步生成。生成的第一步是使用开始标记，然后通过softmax计算下一个标记的概率，并将结果反馈给模型。","最后，讲者指出，生成过程有时需要从特定的部分开始，而不是从完全空白的状态。这种情况下，模型会接收到一些提示（prompt），如问题或指令，以引导生成过程。","整个讲解强调了自回归生成的基本原理，以及如何通过逐步反馈机制来构建完整的序列。同时，也提到了提示（prompt）在生成过程中的作用。"],"formulas":[],"uncertainties":["software","x1 up to x0 up to xt","xt minus 1 from f theta x0 up to xt minus 1","x1 up to xk"],"diagram":"none","start":1536.76,"end":1714.6,"asr_flags":[],"raw_segments":[{"start":1536.76,"text":"sometimes the embeddings is the inner working to some degree. I'm just trying to give you more. I'm trying to unpack it a little bit. So if you don't have to unpack it, you can work with the text. That's just the representation. It's one-to-one, so in some sense, there's no difference."},{"start":1556.66,"text":"Okay, so this is a full description of the probabilistic model. Once you have this probabilistic model, you can compute the maximum likelihood, given any data. We can say, I have a data distribution, I have a data point, a sequence of data, I can see under this probabilistic model, p theta, what is the chance of seeing this data. So that's what you need for computing, do the training, right? You need to compute the likelihood, and then you maximize the likelihood as a function of theta, right? So, and let's briefly discuss"},{"start":1586.22,"text":"Because for generation, suppose you already have the generational decoding. Suppose you already have the model, then a model theta, then what do you do? So as you can see, the most natural thing is you just keep generating x1, x2, x3, so on and so forth. You just say, I'm going to generate x1 first from this p, say, softmax, f theta."},{"start":1618.19,"text":"x1 up to x0 up to xt. I guess I just did it right generically. So we generate xt minus 1 from f theta x0 up to xt minus 1. You can do this sequentially. Sometimes people draw this in this way. So you say, oh, you have x0. You first go through the transformer. And you get x1. And you feed x1 back to this transformer."},{"start":1647.3,"text":"And then you generate x2 by sampling from the software. And then you feedback. So that's kind of why it's called autoregressive, because you"},{"start":1657.02,"text":"When you are generating, you don't have the sequence, right? When you are computing log likelihood, you already see the whole sequence. You are just trying to figure out what's the chance of seeing this sequence. But when you are generating, you start with nothing. And then you have to generate your sequence yourself. And that's why you start with the beginning of sentence token, and then you generate the first token, and then you give the first token back to the transformer and compute this softmax. And then you generate a second token. You do a sampling to generate a second token, and you give it back."},{"start":1685.78,"text":"you keep doing this. So that's the autoregressive generation. And sometimes, this generation can only start from certain parts because in many cases, you are not generating from nothing. So you are given maybe a few tokens. Maybe you are given, so sometimes it's called prompt. So prompt is like something the models are given. It's maybe like a question, an instruction, so on and so forth. You say you are given x1 up to xk."}],"speech_gaps":[],"frame":"../frames/v041/010.webp","frame_time":1548.76},{"title":"Transformer 与上下文学习中的生成过程","segments":[{"id":180,"text":"The model is supposed to complete the generation. So it starts with xt plus 1. So xt plus 1, so this is given. And then you start with xt plus 1. You first generate xt plus 1 from this softmax of the f theta x1 up to xk. And then you generate xt k plus 2. And then you do the same thing."},{"id":181,"text":"So it doesn't have to be always from the beginning. And then there's another small thing, which is that when you generate, you don't necessarily have to always follow the same model. And there's one thing that you can deviate from it, which is that you can add additional temperature where you"},{"id":182,"text":"say as opposed to generating from the original probabilistic model, I'm going to divide this by a temperature T sometimes. What does this mean is that you change the"},{"id":183,"text":"You don't change the orders between these choices. So this f theta is a vector. It's a V-dimensional vector that describes the logits for each of the tokens in the vocabulary. And when you divide by tau, you don't change their relative orders. The bigger ones are still bigger. The smaller ones are still smaller. But you change the scale. So for example, before, you could have like a..."},{"id":184,"text":"Suppose f theta x0 up to xk is equal to, let's say, maybe like a 2, 1, minus 1, something like this. And if you divide by tau, let's say suppose you divide by tau, which is very, very small. Suppose tau is almost 0. Then after dividing by tau,"},{"id":185,"text":"like if you divide by tau, then what happens is that maybe this becomes 200. This becomes 100. I'm giving a concrete example, which is a little bit unrealistic, but to demonstrate a point. And what's the difference between the softmax of this vector versus the softmax of the readjusted vector? The difference is that the softmax of this is much sharper. So maybe let me just give you an example here. So if you just have, let's say, maybe let's just have three dimensions so that it's easier to demonstrate a point."},{"id":186,"text":"So if you do softmax of this vector of 2, 1, minus 1, what happens is that you get, in some sense, you get exponential 2 over exponential 2 plus exponential 1 plus exponential minus 1. That's after softmax was the probability of the first token. And the second token will be exponential 1, exponential"}],"notes":["本段讲解了Transformer模型在生成过程中如何逐步生成下一个token，从xt+1开始，通过softmax函数对fθ(x1到xk)进行处理，然后生成xt+2，重复这一过程。模型不需要总是从头开始生成，可以灵活调整生成策略。","讲者提到在生成过程中可以引入温度参数（temperature），通过除以温度T来调整softmax的输出分布。温度参数的引入不会改变logits之间的相对顺序，但会改变它们的尺度，从而影响生成结果的确定性。","温度参数T的值会影响softmax的输出分布。当T非常小时，softmax的输出会更加尖锐，即概率分布更加集中，而当T较大时，分布会更加平缓。讲者通过一个具体的例子（logits为2, 1, -1）来说明温度参数对softmax输出的影响。","讲者进一步解释了温度参数对softmax分布的影响，指出当T接近0时，logits的值会被放大，导致softmax输出的概率分布更加集中。例如，logits为2, 1, -1时，经过温度调整后，输出值会变得更大，从而改变概率分布的形状。","讲者通过一个具体的例子来说明温度参数对softmax分布的影响，指出当T非常小时，softmax的输出会更加尖锐，即概率分布更加集中。这有助于模型在生成时更倾向于某些特定的token。","讲者提到在生成过程中，可以使用温度参数来调整softmax的输出分布，从而影响生成结果的确定性。温度参数的引入是生成过程中的一种灵活调整手段，但不会改变logits之间的相对顺序。"],"formulas":[{"latex":"softmax(f_\\theta(x_1 \\text{ to } x_k))","symbols":"softmax函数对logits向量f_θ(x_1到x_k)进行处理，得到概率分布","explanation":"公式正确，softmax函数对logits向量进行处理，得到概率分布，符合上下文描述。","evidence":"The model is supposed to complete the generation. So it starts with xt plus 1. So xt plus 1, so this is given. And then you start with xt plus 1. You first generate xt plus 1 from this softmax of the f theta x1 up to xk. And then you generate xt k plus 2. And then you do the same thing."},{"latex":"softmax(f_\\theta(x_0 \\text{ to } x_k) / \\tau)","symbols":"温度参数τ对logits向量进行缩放，影响softmax输出分布","explanation":"公式正确，温度参数τ对logits向量进行缩放，影响softmax输出分布，符合上下文描述。","evidence":"Suppose f theta x0 up to xk is equal to, let's say, maybe like a 2, 1, minus 1, something like this. And if you divide by tau, let's say suppose you divide by tau, which is very, very small. Suppose tau is almost 0. Then after dividing by tau,"}],"uncertainties":["temperature T 的具体作用和影响范围未完全明确","softmax函数的计算过程和具体实现细节未完全明确","温度参数对logits向量的调整方式未完全明确"],"diagram":"none","start":1716.17,"end":1890.02,"asr_flags":[],"math_clarifications":["公式2中的softmax函数计算方式不正确，正确的softmax计算应为每个元素的指数值除以所有元素指数值的总和，而不是直接使用logits向量的指数值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1716.17,"text":"The model is supposed to complete the generation. So it starts with xt plus 1. So xt plus 1, so this is given. And then you start with xt plus 1. You first generate xt plus 1 from this softmax of the f theta x1 up to xk. And then you generate xt k plus 2. And then you do the same thing."},{"start":1739.42,"text":"So it doesn't have to be always from the beginning. And then there's another small thing, which is that when you generate, you don't necessarily have to always follow the same model. And there's one thing that you can deviate from it, which is that you can add additional temperature where you"},{"start":1759.78,"text":"say as opposed to generating from the original probabilistic model, I'm going to divide this by a temperature T sometimes. What does this mean is that you change the"},{"start":1776.75,"text":"You don't change the orders between these choices. So this f theta is a vector. It's a V-dimensional vector that describes the logits for each of the tokens in the vocabulary. And when you divide by tau, you don't change their relative orders. The bigger ones are still bigger. The smaller ones are still smaller. But you change the scale. So for example, before, you could have like a..."},{"start":1804.5,"text":"Suppose f theta x0 up to xk is equal to, let's say, maybe like a 2, 1, minus 1, something like this. And if you divide by tau, let's say suppose you divide by tau, which is very, very small. Suppose tau is almost 0. Then after dividing by tau,"},{"start":1826.22,"text":"like if you divide by tau, then what happens is that maybe this becomes 200. This becomes 100. I'm giving a concrete example, which is a little bit unrealistic, but to demonstrate a point. And what's the difference between the softmax of this vector versus the softmax of the readjusted vector? The difference is that the softmax of this is much sharper. So maybe let me just give you an example here. So if you just have, let's say, maybe let's just have three dimensions so that it's easier to demonstrate a point."},{"start":1859.88,"text":"So if you do softmax of this vector of 2, 1, minus 1, what happens is that you get, in some sense, you get exponential 2 over exponential 2 plus exponential 1 plus exponential minus 1. That's after softmax was the probability of the first token. And the second token will be exponential 1, exponential"}],"speech_gaps":[],"frame":"../frames/v041/011.webp","frame_time":1728.17},{"title":"Softmax 的性质与温度参数的影响","segments":[{"id":187,"text":"2 plus exponential 1 plus exponential minus 1, right?"},{"id":188,"text":"And the third one will be the same denominator,"},{"id":189,"text":"the different numerator, right?"},{"id":190,"text":"So that's the soft max of this."},{"id":191,"text":"But if you take the soft max of the 100 minus 100,"},{"id":192,"text":"suppose you do that, then this will give you"},{"id":193,"text":"exponential 200 versus exponential 200 plus"},{"id":194,"text":"exponential 100 plus exponential minus 100, blah, blah, blah."},{"id":195,"text":"So what's the difference here?"},{"id":196,"text":"The difference is that in terms of the three numbers,"},{"id":197,"text":"in terms of the order, it's always like this is bigger"},{"id":198,"text":"than this, this is bigger than this, right?"},{"id":199,"text":"Because 2 is bigger than 1, 1 is bigger than minus 1,"},{"id":200,"text":"the order is always maintained."},{"id":201,"text":"But the relative scale is different,"},{"id":202,"text":"because here you can see exponential 200"},{"id":203,"text":"is way, way bigger than exponential 100."},{"id":204,"text":"The difference is so astronomical."},{"id":205,"text":"The difference is too big so that these two numbers"},{"id":206,"text":"are just so small compared to exponential 200."},{"id":207,"text":"So they are even negligible."},{"id":208,"text":"So basically, in this calculation,"},{"id":209,"text":"these two numbers don't even have to show up here."},{"id":210,"text":"It don't even matter."},{"id":211,"text":"So you just get 1."},{"id":212,"text":"1."},{"id":213,"text":"So basically, the first token will just"},{"id":214,"text":"have probably almost exactly 1, maybe 0.9999 something."},{"id":215,"text":"And then if you look at the second entry, which"},{"id":216,"text":"is exponential 100 divided by exponential 200"},{"id":217,"text":"plus exponential 100 plus exponential minus 1."},{"id":218,"text":"Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token."},{"id":219,"text":"And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you"},{"id":220,"text":"you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"}],"notes":["本段讲解了softmax函数在不同温度参数下的行为差异。当温度参数τ较小时，softmax函数会将分布变得更尖锐，使得概率集中在最大值上，而其他值接近于零。这种现象在处理具有极大差异的logits时尤为明显，例如当其中一个logit远大于其他logit时，其他logit的贡献可以忽略不计。"],"formulas":[{"latex":"softmax(x) = \\frac{e^{x_i}}{\\sum_{j} e^{x_j}}","symbols":"softmax函数的定义，其中x_i是输入logits，e^{x_i}是指数函数，\\sum_{j} e^{x_j}是所有logits的指数和。","explanation":"保持原始公式，修正了sum的写法，使其更符合数学标准符号。","evidence":"2 plus exponential 1 plus exponential minus 1, right? exponential 200 versus exponential 200 plus exponential 100 plus exponential minus 100, blah, blah, blah. Because 2 is bigger than 1, 1 is bigger than minus 1, because here you can see exponential 200 is way, way bigger than exponential 100. The difference is too big so that these two numbers are just so small compared to exponential 200. So they are even negligible. So basically, in this calculation, these two numbers don't even have to show up here. It don't even matter. So you just get 1. 1. So basically, the first token will just have probably almost exactly 1, maybe 0.9999 something. And then if you look at the second entry, which is exponential 100 divided by exponential 200 plus exponential 100 plus exponential minus 1. Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token. And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"},{"latex":"p_i = \\frac{e^{x_i / \\tau}}{\\sum_{j} e^{x_j / \\tau}}","symbols":"温度参数τ对softmax函数的影响，其中τ是一个正数，用于控制分布的尖锐程度。","explanation":"保持原始公式，修正了sum的写法，使其更符合数学标准符号。","evidence":"Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token. And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"}],"uncertainties":["expansion 2 and expansion 1"],"diagram":"none","start":1891.24,"end":2070.98,"asr_flags":[192],"math_clarifications":["原始文本中提到的'2 plus exponential 1 plus exponential minus 1'等表述，可能涉及softmax函数的计算，但未明确给出具体的数学公式。因此，仅保留已明确的softmax函数定义及其温度参数τ的版本。"],"raw_segments":[{"start":1891.24,"text":"2 plus exponential 1 plus exponential minus 1, right?"},{"start":1896.44,"text":"And the third one will be the same denominator,"},{"start":1899.48,"text":"the different numerator, right?"},{"start":1900.98,"text":"So that's the soft max of this."},{"start":1904.02,"text":"But if you take the soft max of the 100 minus 100,"},{"start":1907.34,"text":"suppose you do that, then this will give you"},{"start":1916.66,"text":"exponential 200 versus exponential 200 plus"},{"start":1922.98,"text":"exponential 100 plus exponential minus 100, blah, blah, blah."},{"start":1930.5,"text":"So what's the difference here?"},{"start":1931.84,"text":"The difference is that in terms of the three numbers,"},{"start":1934.46,"text":"in terms of the order, it's always like this is bigger"},{"start":1936.36,"text":"than this, this is bigger than this, right?"},{"start":1938.14,"text":"Because 2 is bigger than 1, 1 is bigger than minus 1,"},{"start":1941.02,"text":"the order is always maintained."},{"start":1942.4,"text":"But the relative scale is different,"},{"start":1948.74,"text":"because here you can see exponential 200"},{"start":1950.9,"text":"is way, way bigger than exponential 100."},{"start":1954.04,"text":"The difference is so astronomical."},{"start":1957.1,"text":"The difference is too big so that these two numbers"},{"start":1960.32,"text":"are just so small compared to exponential 200."},{"start":1962.8,"text":"So they are even negligible."},{"start":1964.46,"text":"So basically, in this calculation,"},{"start":1966.82,"text":"these two numbers don't even have to show up here."},{"start":1968.84,"text":"It don't even matter."},{"start":1969.82,"text":"So you just get 1."},{"start":1970.48,"text":"1."},{"start":1970.88,"text":"So basically, the first token will just"},{"start":1972.9,"text":"have probably almost exactly 1, maybe 0.9999 something."},{"start":1976.18,"text":"And then if you look at the second entry, which"},{"start":1979.88,"text":"is exponential 100 divided by exponential 200"},{"start":1984.2,"text":"plus exponential 100 plus exponential minus 1."},{"start":1991.07,"text":"Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token."},{"start":2020.25,"text":"And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you"},{"start":2045.63,"text":"you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"}],"speech_gaps":[],"frame":"../frames/v041/012.webp","frame_time":1903.24},{"title":"温度参数与采样策略","segments":[{"id":221,"text":"In API call, you have the choice to choose the temperature. If you choose a small temperature, it means that you want more deterministic generation. If you choose a temperature to be zero, it means that your generation will just be always deterministic every time you take the largest, most likely token and then keep going on. Of course, you can also change the temperature to be bigger than one, which makes the distribution more softer so that you focus on more the long tail. You can generate more tokens from the tail so you have more stochasticity and uncertainty in your generation. Sometimes that's useful because you want to encourage some diversity in your generation and you do that. Especially in the RL, sometimes you have to do that."},{"id":222,"text":"tokens from the tail so you have more stochasticity and uncertainty in your generation. Sometimes that's useful because you want to encourage some diversity in your generation and you do that. Especially in the RL, sometimes you have to do that. Cool. Okay. Sounds good. Sometimes there are also other ways of sampling which is probably I shouldn't go into details. There are some notes in the lecture notes. So another way to do it is that you"},{"id":223,"text":"This vector right now, I have three dimensions. But actually, it's like a"},{"id":224,"text":"the dimensionality is V, right? Which is like 250 or something. You can take top K and then drop all of the other dimensions. So you only sample from the most likely K tokens and you renormalize the distribution. So basically the first K tokens may not cover all the probabilistic mass. But still, that's probably easier to generate because you don't want to generate two rare tokens. So you just drop everything below top K and then generate. Okay."},{"id":225,"text":"Sounds good. So I think I'm probably. So this is the generation. And then for the training, I think I already described it a little bit. So when you do the training, you just compute the log likelihood, the negative log likelihood."},{"id":226,"text":"the negative log likelihood. And you say this is a log. So if you have example x1 up to xt, so the minus log p theta x1 up to xt, capital T, is just minus log the product of all of this, right? p theta x1, p theta x2 given x1, so on and so forth."},{"id":227,"text":"And this is minus the sum of the log of the p of xt given x1 up to xt minus 1. And then you change this to log of the softmax of p1 of this f theta."}],"notes":["本段主要讲解了温度参数（temperature）在生成模型中的作用。温度参数控制生成过程的随机性：较小的温度值使生成更确定，而较大的温度值则增加随机性，鼓励多样性。在强化学习（RL）中，有时需要这种随机性来探索更多可能性。","讲者提到除了温度参数外，还有其他采样方法，但未深入展开。例如，可以使用top-K采样，即只从最可能的K个标记中进行采样，并重新归一化分布。这种方法在生成时更高效，因为不需要处理罕见标记。","在训练过程中，讲者提到计算负对数似然（negative log likelihood）作为损失函数。负对数似然的计算基于条件概率的乘积，最终转化为对数概率的和。","讲者还提到，负对数似然的计算可以转换为对softmax函数的对数，这与模型的输出分布有关。这表明在训练过程中，模型的输出需要通过softmax函数进行归一化处理。","讲者在讲解过程中，部分句子存在断句和语法不完整的问题，例如“probably I shouldn't go into details”和“this is a log”等，这些可能是语音识别的误差，需要进一步确认。","讲者在讲解温度参数和采样策略时，强调了在生成过程中平衡确定性和随机性的重要性，特别是在需要多样性或探索的场景中，如强化学习。"],"formulas":[],"uncertainties":["probably I shouldn't go into details","this is a log"],"diagram":"none","start":2071.79,"end":2250.54,"asr_flags":[],"math_clarifications":["负对数似然公式需要明确其定义域和归一化条件，例如是否涉及归一化常数Z，以及softmax函数的定义是否与上下文一致。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2071.79,"text":"In API call, you have the choice to choose the temperature. If you choose a small temperature, it means that you want more deterministic generation. If you choose a temperature to be zero, it means that your generation will just be always deterministic every time you take the largest, most likely token and then keep going on. Of course, you can also change the temperature to be bigger than one, which makes the distribution more softer so that you focus on more the long tail. You can generate more"},{"start":2101.07,"text":"tokens from the tail so you have more stochasticity and uncertainty in your generation. Sometimes that's useful because you want to encourage some diversity in your generation and you do that. Especially in the RL, sometimes you have to do that. Cool. Okay. Sounds good. Sometimes there are also other ways of sampling which is probably I shouldn't go into details. There are some notes in the lecture notes. So another way to do it is that you"},{"start":2129.03,"text":"This vector right now, I have three dimensions. But actually, it's like a"},{"start":2132.17,"text":"the dimensionality is V, right? Which is like 250 or something. You can take top K and then drop all of the other dimensions. So you only sample from the most likely K tokens and you renormalize the distribution. So basically the first K tokens may not cover all the probabilistic mass. But still, that's probably easier to generate because you don't want to generate two rare tokens. So you just drop everything below top K and then generate. Okay."},{"start":2162.3,"text":"Sounds good. So I think I'm probably. So this is the generation. And then for the training, I think I already described it a little bit. So when you do the training, you just compute the log likelihood, the negative log likelihood."},{"start":2196.36,"text":"the negative log likelihood. And you say this is a log. So if you have example x1 up to xt, so the minus log p theta x1 up to xt, capital T, is just minus log the product of all of this, right? p theta x1, p theta x2 given x1, so on and so forth."},{"start":2231.14,"text":"And this is minus the sum of the log of the p of xt given x1 up to xt minus 1. And then you change this to log of the softmax of p1 of this f theta."}],"speech_gaps":[],"frame":"../frames/v041/013.webp","frame_time":2083.79},{"title":"Transformer 与上下文学习","segments":[{"id":228,"text":"And here, this Xt is a particular choice of Xt, which is seen in the data. So that means you are looking at the Xt's entry of the softmax. This softmax will give you the probability for every possible tokens, and then you are only interested in the probability to see that particular token Xt. So that's why you're looking at Xt's index of that vector. And that's a single scalar. You take the log, and you take the sum over t, and that's your loss function."},{"id":229,"text":"And then you can optimize this loss function by, for example, some optimizers like SGD or IDEM. We didn't discuss IDEM in this lecture, which is an extension of the SGD optimizer, but mostly you can just call the optimizer as a black box to optimize the loss function. It's actually not a loss one, right? Because this is a sum from t equals 1 to capital T. The little t and larger T."},{"id":230,"text":"Okay, sounds good. Okay, so then in the next 30 minutes, I'm going to tell you what this function f is, right? Or maybe what's hidden in this transformer. What's the operation we have to do to compute the logits here? And it's pretty complicated, so it probably takes more than 30 minutes, but I'll see how much I can do. So, any questions before that? Okay."},{"id":231,"text":"So at a high level, this transformer has multiple layers. And so you start with like EX1 up to EXT. And you first apply a so-called attention layer, which I will define. And then you apply the so-called MLP. So first of all, the attention layer, the attention always takes in a sequence of factors and outputs a sequence of factors."},{"id":232,"text":"So you output a bunch of vectors. At each position, you output one vector. And then each of these vectors will go through an MLP. MLP means like a multi-layer perception, which is just a two or three layer network. And each of these vectors will go through this MLP. And then you apply another attention. This attention will take in many, many vectors and then output a sequence of vectors. And then you do the MLP."}],"notes":["本段主要讲解了如何优化损失函数，提到了使用SGD或IDEM等优化器。IDEM是SGD的扩展，但本节课未详细讨论。优化器通常作为黑盒使用，用于最小化损失函数。注意这里的损失函数是关于时间步t从1到T的求和，其中t是小写，T是大写，表示总时间步数。","讲者提到损失函数是通过取对数并求和得到的，这与softmax输出的概率有关。在计算过程中，关注的是特定token Xt的概率，因此需要取Xt在softmax输出向量中的索引位置。"],"formulas":[],"uncertainties":["IDEM可能为听不清的术语，需确认是否为特定优化器名称。"],"diagram":"none","start":2257.1,"end":2425.35,"asr_flags":[],"raw_segments":[{"start":2257.1,"text":"And here, this Xt is a particular choice of Xt, which is seen in the data. So that means you are looking at the Xt's entry of the softmax. This softmax will give you the probability for every possible tokens, and then you are only interested in the probability to see that particular token Xt. So that's why you're looking at Xt's index of that vector. And that's a single scalar. You take the log, and you take the sum over t, and that's your loss function."},{"start":2286.26,"text":"And then you can optimize this loss function by, for example, some optimizers like SGD or IDEM. We didn't discuss IDEM in this lecture, which is an extension of the SGD optimizer, but mostly you can just call the optimizer as a black box to optimize the loss function. It's actually not a loss one, right? Because this is a sum from t to 1 to capital T. The little t and larger t."},{"start":2333.83,"text":"Okay, sounds good. Okay, so then in the next 30 minutes, I'm going to tell you what this function f is, right? Or maybe what's hidden in this transformer. What's the operation we have to do to compute the logits here? And it's pretty complicated, so it probably takes more than 30 minutes, but I'll see how much I can do. So, any questions before that? Okay."},{"start":2368.17,"text":"So at a high level, this transformer has multiple layers. And so you start with like EX1 up to EXT. And you first apply a so-called attention layer, which I will define. And then you apply the so-called MLP. So first of all, the attention layer, the attention always takes in a sequence of factors and outputs a sequence of factors."},{"start":2394.69,"text":"So you output a bunch of vectors. At each position, you output one vector. And then each of these vectors will go through an MLP. MLP means like a multi-layer perception, which is just a two or three layer network. And each of these vectors will go through this MLP. And then you apply another attention. This attention will take in many, many vectors and then output a sequence of vectors. And then you do the MLP."}],"speech_gaps":[],"frame":"../frames/v041/014.webp","frame_time":2269.1},{"title":"Transformer 与上下文学习","segments":[{"id":233,"text":"So that's the high-level structure of this attention. And eventually, you have to output. Remember, eventually, you have to output a sequence of vectors. So basically, you do enough of these alternations between these two, and eventually, you have this MLP, and you output some vectors u1 up to ut. And you alternate between attention and MLP. That's the high-level idea."},{"id":234,"text":"I think we'll focus most of our energy on defining our attention which is the most new thing because MLP is just a two-layer network with some special gating or some special activation functions. Another small thing is that the MLP are sharing the parameters and they are applying independently. So each of these vectors is"},{"id":235,"text":"processed by the MLP in an independent fashion. There's no dependencies between positions when you apply the MLP. They are just very separate operations. So the only way that you are using, you fuse the input from different positions or different time steps is the attention. So the attention will look at all those vectors and process a little bit and then output a sequence of vectors. And MLP is very parallelized and parallelizable and independent."},{"id":236,"text":"Now, let's define our attention. This entire thing will be trained as a single system. So basically, once you define the architecture, you apply the auto-differentiation. You train this whole thing as a gigantic network end-to-end. But the auto-differentiation still works."},{"id":237,"text":"So the auto-differentiation, I think as we discussed, if you remember, it's kind of fundamentalist claiming that if you have a way to compute your forward path, as long as there are compositions of many different components, like basic components, you can compute a backward path the same way. So here, it's indeed a composition of many small arithmetic operations because"},{"id":238,"text":"As you see, the attention layer has many small matrix modifications, and the MLP has many matrix modifications, and you can automatically differentiate. Okay, so now let's talk about attention. So for attention, one thing to remember first is that the type signature is that you input a sequence of vectors to the attention, and they output a sequence of vectors."}],"notes":["本段主要讲解Transformer模型中注意力机制的定义和训练方式。讲者指出，整个模型将作为一个单一系统进行训练，通过自动微分技术实现端到端的训练。自动微分的关键在于，只要能够计算前向传播路径，就可以通过链式法则计算反向传播路径，即使模型由多个组件组成。"],"formulas":[],"uncertainties":["auto-defrustration"],"diagram":"none","start":2428.17,"end":2604.17,"asr_flags":[],"raw_segments":[{"start":2428.17,"text":"So that's the high-level structure of this attention. And eventually, you have to output. Remember, eventually, you have to output a sequence of vectors. So basically, you do enough of these alternations between these two, and eventually, you have this MLP, and you output some vectors u1 up to ut. And you alternate between attention and MLP. That's the high-level idea."},{"start":2456.82,"text":"I think we'll focus most of our energy on defining our attention which is the most new thing because MLP is just a two-layer network with some special gating or some special activation functions. Another small thing is that the MLP are sharing the parameters and they are applying independently. So each of these vectors is"},{"start":2480.55,"text":"processed by the MLP in an independent fashion. There's no dependencies between positions when you apply the MLP. They are just very separate operations. So the only way that you are using, you fuse the input from different positions or different time steps is the attention. So the attention will look at all those vectors and process a little bit and then output a sequence of vectors. And MLP is very parallelized and parallelizable and independent."},{"start":2510.65,"text":"Now, let's define our tension. This entire thing will be trained as a single system. So basically, once you define the architecture, you apply the auto-differentiation. You train this whole thing as a gigantic network end-to-end. But the auto-differentiation still works."},{"start":2543.22,"text":"So the auto-defrustration, I think as we discussed, if you remember, it's kind of fundamentalist claiming that if you have a way to compute your forward path, as long as there are compositions of many different components, like basic components, you can compute a backward path the same way. So here, it's indeed a composition of many small arithmetic operations because"},{"start":2565.51,"text":"As you see, the attention layer has many small matrix modifications, and the MLP has many matrix modifications, and you can automatically differentiate. Okay, so now let's talk about attention. So for attention, one thing to remember first is that the type signature is that you input a sequence of vectors to the attention, and they output a sequence of vectors."}],"speech_gaps":[],"frame":"../frames/v041/015.webp","frame_time":2440.17},{"title":"Transformer 与上下文学习：注意力机制的构建","segments":[{"id":239,"text":"We're going to start with the so-called single header tension. So the single header tension is like this. So you first have an input as a sequence of vectors. Let's say h1 in up to ht in. And you want to output h. I'm trying to define the type signature. So you output h1 out up to ht out."},{"id":240,"text":"And what you do is the following. So the first thing is that you turn these input vectors into a set of query key and value vectors. So basically, you say h1 in. You multiply it by a matrix, wq. This is a weight matrix. This is a parameter."},{"id":241,"text":"And, by the way, let's treat all of this as row vectors, and then all the multiplications on the right-hand side as opposed to on the left-hand side. So every vector is a row vector, and you multiply on the right-hand side, you get another row vector. So this h in, let's say this is like a dimension d, rd, let's say r1 by d, and this wq is in dimension, so this is r1 by d, and this wq is in rd by dh. dh is a parameter. It's a dimension you choose. And then the resulting thing is called q1, which is in dimension dh, maybe 1 by dh, depending on how you think about it."},{"id":242,"text":"dh. dh is a parameter. It's a dimension you choose. And then the resulting thing is called q1, which is in dimension dh, maybe 1 by dh, depending on how you think about it. And you can do this for every index, every time step. Here, I'm only doing it for time step 1. You can do it for time step t. So you have qt."},{"id":243,"text":"So basically, this gives you a sequence of vectors q1 up to q, capital T. Each of them is in dimension 1 by dh. And these are called queries. And you do the same thing for keys and values. So keys."},{"id":244,"text":"Let me define them first. It's the same thing. You say the HT in multiplied by a so-called key projection matrix, WK, and that's your KT. And the dimensionality, I think, is the same. So this is also in the same dimension, and the KT is in the same dimension. And it's the same thing for value vectors, not value functions. HT in times WV. So in some sense, maybe,"}],"notes":["本段讲解了Transformer模型中注意力机制的基础构建，包括输入序列的向量转换为查询（query）、键（key）和值（value）向量的过程。讲者提到，输入向量通过不同的权重矩阵（wq、wk、wv）进行变换，得到不同类型的向量。这些向量的维度由参数dh决定，且每个向量都是行向量，乘法操作在右侧进行。","讲者强调了向量的维度和矩阵的维度关系，例如输入向量的维度为r1 by d，权重矩阵wq的维度为r1 by d，而输出向量q1的维度为1 by dh。这表明输入向量经过变换后，其维度被调整为dh，这是模型设计中的一个可选参数。","讲者还提到，对于每个时间步（time step），都可以进行类似的变换，得到对应的查询向量qt。这表明Transformer模型在处理序列数据时，每个时间步的输入都会被独立处理，生成对应的查询、键和值向量。","讲者在定义键和值向量时，指出它们的变换方式与查询向量类似，即通过不同的权重矩阵（wk和wv）进行变换。这表明查询、键和值向量的生成过程是统一的，只是使用了不同的权重矩阵。","讲者提到“value vectors, not value functions”，这表明在Transformer模型中，值向量是直接与输入序列相关的，而不是某种函数的输出。这有助于理解注意力机制中值向量的作用。","讲者最后提到“in some sense, maybe”，这表明在定义值向量时，可能存在一些未明确说明的细节，需要进一步澄清。"],"formulas":[],"uncertainties":["dh is a parameter. It's a dimension you choose."],"diagram":"none","start":2606.9,"end":2773.94,"asr_flags":[],"math_clarifications":["原始片段中未明确说明向量和矩阵的维度，可能导致歧义。公式中的乘法符号应使用矩阵乘法符号'\\cdot'或明确说明为矩阵乘法。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2606.9,"text":"We're going to start with the so-called single header tension. So the single header tension is like this. So you first have an input as a sequence of vectors. Let's say h1 in up to ht in. And you want to output h. I'm trying to define the type signature. So you output h1 out up to ht out."},{"start":2643.56,"text":"And what you do is the following. So the first thing is that you turn these input vectors into a set of query key and value vectors. So basically, you say h1 in. You multiply it by a matrix, wq. This is a weight matrix. This is a parameter."},{"start":2670.85,"text":"And, by the way, let's treat all of this as row vectors, and then all the multiplications on the right-hand side as opposed to on the left-hand side. So every vector is a row vector, and you multiply on the right-hand side, you get another row vector. So this h in, let's say this is like a dimension d, rd, let's say r1 by d, and this wq is in dimension, so this is r1 by d, and this wq is in rd by,"},{"start":2701.79,"text":"dh. dh is a parameter. It's a dimension you choose. And then the resulting thing is called q1, which is in dimension dh, maybe 1 by dh, depending on how you think about it. And you can do this for every index, every time step. Here, I'm only doing it for time step 1. You can do it for time step t. So you have qt."},{"start":2726.45,"text":"So basically, this gives you a sequence of vectors q1 up to q, capital T. Each of them is in dimension 1 by dh. And these are called queries. And you do the same thing for keys and values. So keys."},{"start":2745.06,"text":"Let me define them first. It's the same thing. You say the HT in multiplied by a so-called key projection matrix, WK, and that's your KT. And the dimensionality, I think, is the same. So this is also in the same dimension, and the KT is in the same dimension. And it's the same thing for value vectors, not value functions. HT in times WV. So in some sense, maybe,"}],"speech_gaps":[],"frame":"../frames/v041/016.webp","frame_time":2618.9},{"title":"注意力机制的直观理解","segments":[{"id":245,"text":"maybe this is the right time to talk about some of the intuitions for the attention, which is not that obvious because eventually it just works. Nobody really knows exactly how it works. But the rough intuition is that you have to have some interactions between these inputs to make it meaningful. Because if everything is independent, then you're just dealing with all the time steps independently. So that's why you have to have some interactions. Interactions sometimes is about how do you"},{"id":246,"text":"retrieve or pay attention to each other. So that's actually how the word attention come from. So basically, when you are processing maybe this vector, you probably should attend to or pay attention to some other vectors which have relevant information. And which one you pay attention to is what we're going to decide here with this query and key and vectors. So in some sense, intuitively, what attention will do, which I didn't show you yet, is that"},{"id":247,"text":"you try to, for processing each of the vectors, you try to figure out which are the relevant vectors that has relevant information. And then you pay actual attention to those vectors. And then you compute the output depending on those special vectors to some degree."},{"id":248,"text":"So that's what we are trying to do. And to decide which one you pay attention to, you have to prepare these queries and key and value vectors. And how do you use them? So you use the query and keys as a way to decide which one you pay attention to. So basically, let's say, suppose you have the t-th position. I want to decide."},{"id":249,"text":"what the t's position should pay attention to. And the way to do it is you say you compute the query qt. This is the query at t's position. And you multiply the query with the keys at all the other positions. So maybe I will just draw it. So you have queries q1 up to qt. And one of them is."},{"id":250,"text":"q little t. And you ask q k1 up to kt. And you multiply q's with all the k's. So you have q1 times k1 transpose, qt times k2 transpose, and qt times k capital T transpose."},{"id":251,"text":"Sometimes there's a scaling factor here to normalize this in a way that makes it a little bit more well-behaved. But I think for the moment, you probably don't have to pay too much attention to the scaling factor. So the important thing is that you are taking the inner product between q's and each of the other k's. And this qt transpose k transpose is actually the inner product, because q is a row vector, and k transpose is a column vector."}],"notes":["本段讲解了注意力机制的基本概念，即通过交互来获取有意义的信息。讲者指出，如果所有输入都是独立的，那么模型将无法捕捉到时间序列中的依赖关系，因此需要引入交互机制。","讲者解释了注意力机制的来源，即通过查询（query）、键（key）和值（value）向量来决定哪些信息需要关注。查询和键用于计算注意力权重，而值则用于生成最终的输出。","讲者进一步说明了如何计算注意力权重，即通过查询向量与所有键向量的内积来决定每个位置的注意力权重。这一过程是注意力机制的核心。","讲者提到，为了使注意力权重更稳定，有时会引入一个缩放因子，但目前可以暂时忽略这一细节。","讲者强调了内积在注意力机制中的重要性，指出查询向量和键向量的内积是计算注意力权重的关键步骤。","讲者通过具体的例子说明了注意力机制的运作方式，即通过查询向量与所有键向量的内积来决定哪些信息需要关注，并据此生成输出。"],"formulas":[{"latex":"q_t^T k_i","symbols":"查询向量与键向量的内积","explanation":"公式正确表示了查询向量 $ q_t $ 与键向量 $ k_i $ 的内积，符合注意力机制中通过内积计算相似度的原理。","evidence":"Sometimes there's a scaling factor here to normalize this in a way that makes it a little bit more well-behaved. But I think for the moment, you probably don't have to pay too much attention to the scaling factor. So the important thing is that you are taking the inner product between q's and each of the other k's. And this qt transpose k transpose is actually the inner product, because q is a row vector, and k transpose is a column vector."}],"uncertainties":[],"diagram":"none","start":2775.6,"end":2955.36,"asr_flags":[],"math_clarifications":["公式 $ q_t^T k_i $ 正确表示了查询向量与键向量的内积，符合注意力机制中通过内积计算相似度的原理。"],"raw_segments":[{"start":2775.6,"text":"maybe this is the right time to talk about some of the intuitions for the attentions, which is not that obvious because eventually it just works. Nobody really know exactly how it works. But the rough intuition is that you have to have some interactions between these inputs to make it meaningful. Because if everything is independent, then you're just dealing with all the time steps independently. So that's why you have to have some interactions. Interactions sometimes is about how do you"},{"start":2803.87,"text":"retrieve or pay attention to each other. So that's actually how the word attention come from. So basically, when you are processing maybe this vector, you probably should attend to or pay attention to some other vectors which have relevant information. And which one you pay attention to is what we're going to decide here with this query and key and vectors. So in some sense, intuitively, what attention will do, which I didn't show you yet, is that"},{"start":2831.18,"text":"you try to, for processing each of the vectors, you try to figure out which are the relevant vectors that has relevant information. And then you pay actual attention to those vectors. And then you compute the output depending on those special vectors to some degree."},{"start":2849.29,"text":"So that's what we are trying to do. And to decide which one you pay attention to, you have to prepare these queries and key and value vectors. And how do you use them? So you use the query and keys as a way to decide which one you pay attention to. So basically, let's say, suppose you have the t-th position. I want to decide."},{"start":2873.51,"text":"what the t's position should pay attention to. And the way to do it is you say you compute the query qt. This is the query at t's position. And you multiply the query with the keys at all the other positions. So maybe I will just draw it. So you have queries q1 up to qt. And one of them is."},{"start":2899.38,"text":"q little t. And you ask q k1 up to kt. And you multiply q's with all the k's. So you have q1 times k1 transpose, qt times k2 transpose, and qt times k capital T transpose."},{"start":2927.74,"text":"Sometimes there's a scaling factor here to normalize this in a way that makes it a little bit more well-behaved. But I think for the moment, you probably don't have to pay too much attention to the scaling factor. So the important thing is that you are taking the inner product between q's and each of the other k's. And this qt transpose k transpose is actually the inner product, because q is a row vector, and k transpose is a column vector."}],"speech_gaps":[{"start":2925.328,"end":2927.34}],"frame":"../frames/v041/017.webp","frame_time":2787.6},{"title":"Transformer 中的注意力机制与概率向量","segments":[{"id":252,"text":"And you are taking the inner product between these row vectors and the column vectors, and you get one scalar out of it. So all of these numbers are real numbers, right? So this is in RT. So you have T real numbers. And then you take a softmax over these T real numbers to turn it into a probability vector. So then you say, I'm going to do a softmax of this whole thing."},{"id":253,"text":"Now you get what? You get this is a vector, the dimensionality here is rt, and the outcome of the softmax is a sequence of numbers. There are t numbers, and all of these numbers are non-active, and the sum of them is one. So it's a probability vector over t positions. If you see a large number, it means that"},{"id":254,"text":"let's say suppose this number is big, it means that this number is somewhat big compared to other ones. It means that the Qs and Qs have more higher inner product. And it means that you should pay more attention to K, K1. So basically, if any of these entries is big, it means that intuitively,"},{"id":255,"text":"Qt needs to pay more attention to K1. And that will be reflected by the probability vectors because the corresponding probability will also be high. And so I think let's call this, I guess I have a notation here. So let's call this, let's denote this to be Pt1, Pt2, up to Pt capital T. So each of the Pti is"},{"id":256,"text":"each of the Pt i is non-active and the sum of the Pt i over i from one to t is equal to one. So this is a probability vector. If any of these entries is big, it means that we should pay more attention to that particular position when processing the little t's query."},{"id":257,"text":"the output at t's position, which is a vector, is using these probability vectors to weight the values. The values is v's, which we are defining here, vt. So you say it's pt1 times v1 plus pt2 times v2 plus ptt times vt. So basically, if any of this"}],"notes":["本段讲解了Transformer模型中注意力机制的核心思想，即通过计算查询向量（Q）与键向量（K）之间的内积，得到一个标量值，然后通过softmax函数将其转换为概率向量。概率向量中的每个元素表示对应位置的注意力权重，权重越大，表示该位置的信息越重要。","在注意力机制中，概率向量的每个元素都是非负的，并且所有元素的和为1，这使得它成为一个有效的概率分布。当某个元素的值较大时，意味着对应的键向量（K）与查询向量（Q）之间的内积较大，因此需要在处理查询时给予更多的关注。","概率向量用于加权求和值向量（V），从而得到最终的输出。这种加权求和的方式使得模型能够根据注意力权重动态地组合不同的值向量，从而实现对输入序列中不同位置信息的灵活关注。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2957.58,"end":3128.27,"asr_flags":[],"raw_segments":[{"start":2957.58,"text":"And you are taking the inner product between these row vectors and the column vectors, and you get one scalar out of it. So all of these numbers are real numbers, right? So this is in RT. So you have T real numbers. And then you take a softmax over these T real numbers to turn it into a probability vector. So then you say, I'm going to do a softmax of this whole thing."},{"start":2997.43,"text":"Now you get what? You get this is a vector, the dimensionality here is rt, and the outcome of the softmax is a sequence of numbers. There are t numbers, and all of these numbers are non-active, and the sum of them is one. So it's a probability vector over t positions. If you see a large number, it means that"},{"start":3022.08,"text":"let's say suppose this number is big, it means that this number is somewhat big compared to other ones. It means that the Qs and Qs have more higher inner product. And it means that you should pay more attention to K, K1. So basically, if any of these entries is big, it means that intuitively,"},{"start":3043.97,"text":"Qt needs to pay more attention to K1. And that will be reflected by the probability vectors because the corresponding probability will also be high. And so I think let's call this, I guess I have a notation here. So let's call this, let's denote this to be Pt1, Pt2, up to Pt capital T. So each of the Pti is"},{"start":3070.19,"text":"each of the Pt i is non-active and the sum of the Pt i over i from one to t is equal to one. So this is a probability vector. If any of these entries is big, it means that we should pay more attention to that particular position when processing the little t's query. Then how does this relate to the final outcome? So finally, once you have this, then you say,"},{"start":3098.47,"text":"the output at t's position, which is a vector, is using these probability vectors to weight the values. The values is v's, which we are defining here, vt. So you say it's pt1 times v1 plus pt2 times v2 plus ptt times vt. So basically, if any of this"}],"speech_gaps":[],"frame":"../frames/v041/018.webp","frame_time":2969.58},{"title":"Transformer 与上下文学习","segments":[{"id":258,"text":"The probability is much higher than you are multiplying this high probability with the corresponding value at that position. So basically, you are using the v. For example, if this number is very big, then you are using v2 a lot in the output at time t. So you determine them by multiplying the matrices, and the matrices will be trained."},{"id":259,"text":"How do you attend to each other is also trend. So you're only giving a template in some sense. It could be that all of these are zero, then you are not doing anything with it, and then the loss function will be not good, but it's still a valid new at work, it's just the loss is not good. So eventually, you are going to train the model to behave well so basically,"},{"id":260,"text":"The training algorithms will choose the right W so that this mechanism is doing the right thing. So let's try to articulate. I think it's a good question, but let's try to articulate so that we can answer it."},{"id":261,"text":"So I think you are asking why you need such architecture, but not just only using MLP, for example. That's one way to rephrase the question. So if you are only using MLP in this way, suppose you remove all the tensions. You are only using MLP in this way, then there's no interactions between."},{"id":262,"text":"different positions whatsoever. So there's no chance that it's going to work. You are just applying separate networks for each of the tokens. There's no chance you can understand the dependencies, the meanings. There's no chance I can just give you individual words and you can understand the sentence. There's no chance. So you do have to have a model that can read"}],"notes":["本段讨论了Transformer模型中注意力机制的作用，强调了通过乘以高概率值来决定输出中使用哪些向量。例如，当某个值很大时，模型会更多地使用对应的向量v2。这种机制通过矩阵相乘实现，并且矩阵会在训练过程中被优化。","讲者指出，注意力机制的实现方式是提供一个模板，但若所有值都为零，则模型不会进行任何操作，此时损失函数可能不佳，但模型仍能运行。最终，模型会通过训练来表现良好。","讲者提到训练算法会选择合适的权重W，以确保注意力机制能正确工作。他鼓励进一步澄清问题，以便更好地回答。","讲者解释了为何需要使用Transformer架构而非仅使用MLP。如果仅使用MLP，模型将无法捕捉不同位置之间的交互，导致无法理解依赖关系和句子含义。","讲者强调，仅使用单独的网络处理每个标记会导致模型无法理解上下文，因此必须使用能够读取上下文的模型。"],"formulas":[],"uncertainties":["new at work"],"diagram":"none","start":3129.38,"end":3282.19,"asr_flags":[],"raw_segments":[{"start":3129.38,"text":"probability is much higher than you are multiplying this high probability with the corresponding value at that position. So basically, you are using the v. For example, if this number is very big, then you are using v2 a lot in the output at time t. So you determine them by multiplying the matrices, and the matrices will be trained."},{"start":3159.57,"text":"How do you attend to each other is also trend. So you're only giving a template in some sense. It could be that all of these are zero, then you are not doing anything with it, and then the loss function will be not good, but it's still a valid new at work, it's just the loss is not good. So eventually, you are going to train the model to behave well so basically,"},{"start":3185.71,"text":"The training algorithms will choose the right W so that this mechanism is doing the right thing. So let's try to articulate. I think it's a good question, but let's try to articulate so that we can answer it."},{"start":3237.34,"text":"So I think you are asking why you need such architecture, but not just only using MLP, for example. That's one way to rephrase the question. So if you are only using MLP in this way, suppose you remove all the tensions. You are only using MLP in this way, then there's no interactions between."},{"start":3259.65,"text":"different positions whatsoever. So there's no chance that it's going to work. You are just applying separate networks for each of the tokens. There's no chance you can understand the dependencies, the meanings. There's no chance I can just give you individual words and you can understand the sentence. There's no chance. So you do have to have a model that can read"}],"speech_gaps":[{"start":3157.216,"end":3159.17},{"start":3212.79,"end":3214.32},{"start":3215.728,"end":3218.096},{"start":3223.632,"end":3227.44},{"start":3229.008,"end":3230.608},{"start":3231.568,"end":3236.94}],"frame":"../frames/v041/019.webp","frame_time":3141.38},{"title":"Transformer 与上下文学习的结构设计","segments":[{"id":263,"text":"all the tokens and study their correlations and combinations, so on and so forth. But there are other possible ways to deal with that. For example, what if you use a gigantic MLP that takes in all of this, maybe you concatenate all of them and you take in one MLP. So for example, you just concatenate all of these tokens vectors into one long vector and you go through a network."},{"id":264,"text":"So there are several issues with that. One is that, you will have way too many parameters. Because your sequence length may be sometimes even millions. Then if you have a million by million matrices in your MLP, it's going to be way too big. Right now, the MLP is actually very small. It only takes in a vector for one position. It doesn't even depend on t. And another thing is that not only the size of the MLP is big, but also the size of the MLP also changes over."},{"id":265,"text":"as you change the sequence length,"},{"id":266,"text":"which is also very undesirable."},{"id":267,"text":"Because, for example, if you tune with sequence length"},{"id":268,"text":"1,000 and then you test with sequence length 1,001,"},{"id":269,"text":"then you have to change your parameter count,"},{"id":270,"text":"which is not good."},{"id":271,"text":"And here, if you really look into details,"},{"id":272,"text":"you'll find out that the number of parameters"},{"id":273,"text":"doesn't depend on the sequence length."},{"id":274,"text":"You have this gigantic amount here"},{"id":275,"text":"that is too big to compute,"},{"id":276,"text":"but you kind of know that there is some structure"},{"id":277,"text":"because there are words that match other words."},{"id":278,"text":"So this is kind of trying to learn the structure"},{"id":279,"text":"to make it more efficient."},{"id":280,"text":"Exactly."},{"id":281,"text":"So you know that if you have sufficient compute,"},{"id":282,"text":"probably your gigantic MLP will work."},{"id":283,"text":"If you have sufficient data so you don't overfit,"},{"id":284,"text":"and you have sufficient compute, then there"},{"id":285,"text":"is some MLP that can actually solve this problem."},{"id":286,"text":"But that's too expensive, so you need to prescribe"},{"id":287,"text":"structure so that you can reduce the complexity. And this is the prescription we have. But you still have to leave enough flexibilities. You cannot just say, for example, one way to do it is you just say, let's average. Then there's no parameters. You just prescribe too much. You dictate too much. Then that's not good. So it's kind of like you strike a balance between how much structure you introduce and how much flexibility you give the models to figure out. Yeah."},{"id":288,"text":"Yeah, any other questions? By the way, there is actually, in the history, there was actually other ways to deal with this sequence. For example, you can use a convolutional network on this, which is kind of like MLP. So you use MLP, but with a specific receptive field so that each time you only see kind of like a window. I think there are still papers that says that that's not"}],"notes":["本段讨论了使用巨型MLP处理序列数据的问题，指出其参数量过大，且参数数量随序列长度变化，导致模型难以适应不同长度的输入。讲者强调，虽然理论上足够大的MLP可以解决问题，但实际中由于计算和数据量的限制，这种方法并不高效。","讲者进一步指出，为了减少复杂度，需要引入结构化设计，但又不能过度限制模型的灵活性。这类似于在结构和灵活性之间找到平衡，以确保模型既能有效学习数据的结构，又能保持足够的适应能力。","讲者提到，历史上还有其他方法处理序列数据，例如使用卷积网络，这种方法类似于MLP，但通过特定的感受野设计，每次只关注局部窗口。这表明，除了Transformer之外，还有其他方法可以处理序列数据，但可能不如Transformer灵活。","讲者强调，模型设计需要在结构和灵活性之间找到平衡，不能过度限制模型，也不能完全放弃结构化设计。这反映了机器学习模型设计中的一个核心原则，即在复杂性和效率之间进行权衡。","讲者提到，如果模型具有足够的计算资源和数据量，理论上可以使用巨型MLP解决问题，但实际中由于资源限制，这种方法并不现实。这说明了在实际应用中，模型设计需要考虑计算和数据的可行性。","讲者最后提到，卷积网络是一种可能的替代方法，但可能不如Transformer灵活。这表明，虽然Transformer是当前处理序列数据的主流方法，但还有其他方法可以考虑，具体取决于应用场景和需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3284.41,"end":3451.66,"asr_flags":[],"raw_segments":[{"start":3284.41,"text":"all the tokens and study their correlations and combinations, so on and so forth. But there are other possible ways to deal with that. For example, what if you use a gigantic MLP that takes in all of this, maybe you concatenate all of them and you take in one MLP. So for example, you just concatenate all of these tokens vectors into one long vector and you go through a network. So there are several issues with that. One is that,"},{"start":3313.28,"text":"you will have way too many parameters. Because your sequence length may be sometimes even millions. Then if you have a million by million matrices in your MLP, it's going to be way too big. Right now, the MLP is actually very small. It only takes in a vector for one position. It doesn't even depend on t. And another thing is that not only the size of the MLP is big, but also the size of the MLP also changes over."},{"start":3339.17,"text":"as you change the sequence length,"},{"start":3340.77,"text":"which is also very undesirable."},{"start":3342.41,"text":"Because, for example, if you tune with sequence length"},{"start":3344.11,"text":"1,000 and then you test with sequence length 1,001,"},{"start":3347.81,"text":"then you have to change your parameter count,"},{"start":3349.63,"text":"which is not good."},{"start":3351.59,"text":"And here, if you really look into details,"},{"start":3353.73,"text":"you'll find out that the number of parameters"},{"start":3356.57,"text":"doesn't depend on the sequence length."},{"start":3361.07,"text":"You have this gigantic amount here"},{"start":3363.15,"text":"that is too big to compute,"},{"start":3365.13,"text":"but you kind of know that there is some structure"},{"start":3368.89,"text":"because there are words that match other words."},{"start":3371.79,"text":"So this is kind of trying to learn the structure"},{"start":3375.39,"text":"to make it more efficient."},{"start":3377.15,"text":"Exactly."},{"start":3377.81,"text":"So you know that if you have sufficient compute,"},{"start":3382.11,"text":"probably your gigantic MLP will work."},{"start":3384.19,"text":"If you have sufficient data so you don't overfit,"},{"start":3386.23,"text":"and you have sufficient compute, then there"},{"start":3388.77,"text":"is some MLP that can actually solve this problem."},{"start":3391.23,"text":"But that's too expensive, so you need to prescribe"},{"start":3396.33,"text":"structure so that you can reduce the complexity. And this is the prescription we have. But you still have to leave enough flexibilities. You cannot just say, for example, one way to do it is you just say, let's average. Then there's no parameters. You just prescribe too much. You dictate too much. Then that's not good. So it's kind of like you strike a balance between how much structure you introduce and how much flexibility you give the models to figure out. Yeah."},{"start":3426.04,"text":"Yeah, any other questions? By the way, there is actually, in the history, there was actually other ways to deal with this sequence. For example, you can use a convolutional network on this, which is kind of like MLP. So you use MLP, but with a specific receptive field so that each time you only see kind of like a window. I think there are still papers that says that that's not"}],"speech_gaps":[],"frame":"../frames/v041/02 ilities. So after the softmax, this matrix becomes, every row is a probability vector, and then you multiply that with the V to take the linear combination of these."}],"notes":["本段主要讲解Transformer模型中的注意力机制，特别是单头注意力的结构。讲者指出，使用卷积网络虽然可以实现一定程度的功能，但效果不如注意力机制。同时，讲者提到注意力机制有其他变体，这些变体在效率上可能更好。"],"formulas":[],"uncertainties":["t by dh"],"diagram":"none","start":3452.22,"end":3616.47,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的数学定义和上下文信息，无法准确判断公式的数学正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3452.22,"text":"a terrible idea. Actually, if you use a convolutional network, it actually can work to some degree. It's just not as good as this one. And also, you can see there are also other, probably we'll talk about that later. So there are other variants of tensions that does similar stuff but have better efficiency. Anyway, so let's continue. We are not done yet, actually. This is only a so-called single-head tension. Actually, the real thing is a little more complicated."},{"start":3483.91,"text":"But let's see. Before I go into that, let's see. So I think you can see the notation scale is very messy. So let's try to simplify it a little bit so that we don't have to always work with this messy notation. So one typical way that people simplify this is that you try to organize all the queries into a matrix."},{"start":3510.73,"text":"Recall that each of the cores is a row vector. And if you put them all in a matrix, then this is a matrix of dimension t by dh. And you can put all the keys into a matrix. And you can put all the values in your matrix as well. And then you can write this h out, the output signal factors as kind of like a"},{"start":3551.5,"text":"Also, as a matrix, in some sense, you do a softmax of the role of this qk transpose divided by c matrix times v. So here, basically, this qk matrix, qk transpose matrix, is the family of qi times kj transpose divided by c. So every entry is of this form, which is kind of like this, guys."},{"
