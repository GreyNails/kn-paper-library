sed GPT-3."},{"id":20,"text":"It has, it uses this new paradigm"},{"id":21,"text":"them which use auto-regressive large-language models."},{"id":22,"text":"So basically, we're going to focus on that,"},{"id":23,"text":"auto-regressive large-language models."},{"id":24,"text":"We're going to skip some of the earlier versions of"},{"id":25,"text":"transformer which are not auto-regressive."},{"id":26,"text":"Auto-regressive basically means that you generate tokens one by one,"},{"id":27,"text":"and each of the new tokens depends on"},{"id":28,"text":"the previous tokens and you do this,"},{"id":29,"text":"and you model probability in this auto-regressive way."},{"id":30,"text":"I'm going to talk more about details."},{"id":31,"text":"In some sense, you model your language distribution by using a sequential model one by one, in some sense."},{"id":32,"text":"Anyway, so I think the point, our goal is to talk about some details."},{"id":33,"text":"So I'll fill in more high-level stuff as we talk about the details."},{"id":34,"text":"So the first thing we're going to talk about is tokenization."},{"id":35,"text":"This is just to prepare us to talk about the real meat in some sense. So what does tokenization mean? It means that you need to"},{"id":36,"text":"These transformers, they are numerical architecture models. So they take in, in some sense, numerical numbers. But you have text. And how do you turn text into some kind of things that the models can understand? So the first step is to tokenize. Tokenize means that you need to decide what is the smallest unit of the input you give to the large language model. And often it's not a word. The most natural thing you can think of is,"},{"id":37,"text":"maybe a small thing is a character or a word. If you use character level tokenization, then the issue is that often you have so many characters. You need so many tokens, so many steps. If you use word level tokenization, then often the issue is that you don't"}],"notes":["本段介绍了大语言模型（large-language models）的背景，指出其起源于OpenAI发布的GPT-3，并强调了自回归（auto-regressive）模型的重要性。讲者提到，自回归模型是通过逐个生成token，并且每个新token依赖于之前的token来建模语言概率分布。"],"formulas":[],"uncertainties":["them which use auto-regressive large-language models"],"diagram":"none","start":5.23,"end":167.75,"asr_flags":[],"raw_segments":[{"start":5.23,"text":"Today, we are going to move to a sequence of lectures on"},{"start":9.93,"text":"large language models, not many, probably three, four."},{"start":13.73,"text":"In between, we also have to talk"},{"start":15.29,"text":"about reinforcement learning a little bit because otherwise,"},{"start":17.45,"text":"we cannot talk about some of the modern reasoning models"},{"start":20.83,"text":"without understanding a little bit about reinforcement learning."},{"start":23.77,"text":"So that's pretty much the rest of the lecture"},{"start":25.43,"text":"except two guest lectures."},{"start":27.57,"text":"I think the upcoming Monday,"},{"start":30.71,"text":"we'll have Simran to give us a lecture on system ML,"},{"start":34.07,"text":"which is also quite about transformers,"},{"start":37.31,"text":"like how do you optimize the efficiency of transformers"},{"start":39.73,"text":"on a GPU, so on and so forth."},{"start":42.75,"text":"Okay, sounds good."},{"start":43.89,"text":"So, large-language models."},{"start":45.55,"text":"I guess you always, probably all of you"},{"start":47.19,"text":"have heard of this word, large-language models."},{"start":50.59,"text":"This is precisely, I think, in some sense,"},{"start":54.09,"text":"this is all starting from GPT-3"},{"start":55.77,"text":"when OpenAI released GPT-3."},{"start":58.71,"text":"It has, it uses this new paradigm"},{"start":61.29,"text":"them which use auto-regressive large-language models."},{"start":66.05,"text":"So basically, we're going to focus on that,"},{"start":67.85,"text":"auto-regressive large-language models."},{"start":69.79,"text":"We're going to skip some of the earlier versions of"},{"start":71.93,"text":"transformer which are not auto-regressive."},{"start":78.73,"text":"Auto-regressive basically means that you generate tokens one by one,"},{"start":81.69,"text":"and each of the new tokens depends on"},{"start":83.47,"text":"the previous tokens and you do this,"},{"start":85.43,"text":"and you model probability in this auto-regressive way."},{"start":88.79,"text":"I'm going to talk more about details."},{"start":90.07,"text":"In some sense, you model your language distribution by using a sequential model one by one, in some sense."},{"start":99.15,"text":"Anyway, so I think the point, our goal is to talk about some details."},{"start":104.79,"text":"So I'll fill in more high-level stuff as we talk about the details."},{"start":108.21,"text":"So the first thing we're going to talk about is tokenization."},{"start":113.78,"text":"This is just to prepare us to talk about the real meat in some sense. So what does tokenization mean? It means that you need to"},{"start":122.86,"text":"These transformers, they are numerical architecture models. So they take in, in some sense, numerical numbers. But you have text. And how do you turn text into some kind of things that the models can understand? So the first step is to tokenize. Tokenize means that you need to decide what is the smallest unit of the input you give to the large language model. And often it's not a word. The most natural thing you can think of is,"},{"start":151.77,"text":"maybe a small thing is a character or a word. If you use character level tokenization, then the issue is that often you have so many characters. You need so many tokens, so many steps. If you use word level tokenization, then often the issue is that you don't"}],"speech_gaps":[{"start":75.35,"end":78.33}],"frame":"../frames/v041/001.webp","frame_time":17.23},{"title":"子词分词与词汇表构建","segments":[{"id":38,"text":"how do you deal with this long word, which are very rare? For example, you have a word called, say, internationalization. So if you treat this word as a single word, then maybe it's too rare, and you don't leverage your understanding about other words. So if you treat internationalization as one word, then it is different from internationalized. It's different from a nation. And they are all completely different things, and you cannot leverage."},{"id":39,"text":"that for example, if you understand internationalized, then you should probably understand internationalization to some degree without even seeing more data. So that's why people don't use word tokenization. Maybe let me give you another example. For example, if you use this, I guess in my notes, there is this word LM."},{"id":40,"text":"Actually, I don't know whether this is a real word. I think it's a new word that is completely new word. Nobody have used it before 2020, I guess. So even right now, it's not that common. If you have to treat this word as a unit, then you have to see this word enough times to understand what it means. However, if you treat it as subwords, then maybe you have a token called ILM. You have a token which is"},{"id":41,"text":"you have two units, this is a token, this is a token. So IOM is a token, IMPfication is a token. Then in some sense, you have seen IOMs many, many times, you all understand it. Then IMPfication has a special meaning in English, and then you combine these two understanding, you understand the word. So that's much more efficient understanding of the word than just treating this whole thing as a single unit."},{"id":42,"text":"So, and this happens more often in, for example, biology when you have this very long word, or maybe in German you have very long word, but actually they are fundamentally many combinations of many sub-words. Using sub-word tokenization allows you to understand each of the sub-words, and then you can understand the combination of those sub-words as a whole very efficiently. So basically, tokenization just means that you have a predefined vocabulary,"},{"id":43,"text":"vocabulary and this vocabulary is a list of subwords. So for example, you can have many of this, like maybe A is a subword, is one of the token. I think maybe like a dog is a token."},{"id":44,"text":"Pretty much all common words these days is a token. Actually, you can play with the tokenization online. If you search OpenAI tokenizer, OpenAI give you a playground where you can see how the texts are tokenized. You'll find that actually, blank dog is also a token."}],"notes":["本段讨论了子词分词（sub-word tokenization）在处理罕见长词时的优势。例如，像 'internationalization' 这样的长词，如果作为单一词处理，由于出现频率低，难以利用其他相关词的语义信息。而通过子词分词，可以将长词拆分为更常见的子词，如 'international' 和 'ization'，从而更高效地理解和学习该词。","讲者指出，子词分词允许模型利用已有的子词知识，而不是将整个长词视为一个独立单元。例如，'internationalization' 可以被拆分为 'international' 和 'ization'，而 'international' 可能已经出现在大量文本中，因此模型可以利用其语义信息。","讲者以 'LM' 为例，说明这是一个在2020年前未被广泛使用的新词。如果将其作为单一词处理，需要大量数据才能理解其含义；而通过子词分词，可以将其拆分为 'L' 和 'M'，从而利用已有的子词知识。","讲者提到，子词分词在处理像生物学或德语等语言中的长词时特别有用，因为这些词通常由多个子词组成。通过子词分词，模型可以更高效地学习和理解这些长词。","讲者指出，子词分词的词汇表是预定义的，包含一系列子词。例如，'dog' 可能是一个子词，而 'blank dog' 也可能被作为单独的词进行分词。","最后，讲者提到可以在线使用 OpenAI 的 tokenizer 工具来观察文本如何被分词，例如 'blank dog' 也可能被作为单独的词进行处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":168.01,"end":333.19,"asr_flags":[],"raw_segments":[{"start":168.01,"text":"how do you deal with this long word, which are very rare? For example, you have a word called, say, internationalization. So if you treat this word as a single word, then maybe it's too rare, and you don't leverage your understanding about other words. So if you treat internationalization as one word, then it is different from internationalized. It's different from a nation. And they are all completely different things, and you cannot leverage."},{"start":196.41,"text":"that for example, if you understand internationalized, then you should probably understand internationalization to some degree without even seeing more data. So that's why people don't use word tokenization. Maybe let me give you another example. For example, if you use this, I guess in my notes, there is this word LM."},{"start":218.79,"text":"Actually, I don't know whether this is a real word. I think it's a new word that is completely new word. Nobody have used it before 2020, I guess. So even right now, it's not that common. If you have to treat this word as a unit, then you have to see this word enough times to understand what it means. However, if you treat it as subwords, then maybe you have a token called ILM. You have a token which is"},{"start":246.92,"text":"you have two units, this is a token, this is a token. So IOM is a token, IMPfication is a token. Then in some sense, you have seen IOMs many, many times, you all understand it. Then IMPfication has a special meaning in English, and then you combine these two understanding, you understand the word. So that's much more efficient understanding of the word than just treating this whole thing as a single unit."},{"start":272.76,"text":"So, and this happens more often in, for example, biology when you have this very long word, or maybe in German you have very long word, but actually they are fundamentally many combinations of many sub-words. Using sub-word tokenization allows you to understand each of the sub-words, and then you can understand the combination of those sub-words as a whole very efficiently. So basically, tokenization just means that you have a predefined vocabulary,"},{"start":303.35,"text":"vocabulary and this vocabulary is a list of subwords. So for example, you can have many of this, like maybe A is a subword, is one of the token. I think maybe like a dog is a token."},{"start":316.13,"text":"Pretty much all common words these days is a token. Actually, you can play with the tokenization online. If you search OpenAI tokenizer, OpenAI give you a playground where you can see how the texts are tokenized. You'll find that actually, blank dog is also a token."}],"speech_gaps":[],"frame":"../frames/v041/002.webp","frame_time":180.01},{"title":"Transformer 与上下文学习中的分词机制","segments":[{"id":45,"text":"So the blank is actually merged with Doug as a token. And you have so many of this. Typically, this kind of tokenization right now, I think for the open source models, we know the number of tokens they have. I think it's often on the order of 10 to the 5, like 100k at least. I think QN 3.5, this is the newest version of the open source models, which are pretty good. I think they have like 250 tokens."},{"id":46,"text":"I think 250 probably is mostly because I think 250 is somehow you can represent this token with maybe."},{"id":47,"text":"eight bytes in some sense. It also depends on how many bits you can present the tokens. Anyway, so you have this vocabulary and then you just give it a long string of text. You just take all the subwords that are tokens and you turn it into a sequence of segments. For example, if you have a dog runs,"},{"id":48,"text":"Suppose this is the text you see, and then you'll say this is a token, so this is one part. Then I think blank dog is a token, and blank runs is also a token, and comma I think is a token by itself. Every token has an ID. So let's say A is probably the ID number one, dog is maybe the ID number like 356, whatever, and run is some ID."},{"id":49,"text":"Maybe 250. I'm just writing some random numbers. Everything has an ID. So basically, you turn every text into a sequence of IDs. Each ID corresponds to one token. So in this case, most of these words are actually one token. I think I just checked recently, if you have the word happiness, I think the tokenization will be unhappiness, let's say. I think this part is a token. H is a token."},{"id":50,"text":"A-P-I-N-E-S-S is a token for some reason. Maybe another example is this. I already read it that IOM identification. This is another example we come up with. I don't know actually what this word means if you have a blast."},{"id":51,"text":"I think this part is a token, this part is a token, and this part is token. I think this is just because for this biological words, biomedical words, actually every part of the word has some special meaning, and so you tokenize them into tokens. And what is the exact vocabulary? It depends on the model."},{"id":52,"text":"So basically, the algorithm that turns the text into these tokens is called a tokenizer. And every model has a different tokenizer. Not everyone has a different one. Some of them share the same tokenizers. But generally, it's specific to the tokenizer, to the model."},{"id":53,"text":"and different companies have"},{"id":54,"text":"different proprietary tokenization approach."},{"id":55,"text":"You've probably heard of that recently,"},{"id":56,"text":"I think Cloud Code."},{"id":57,"text":"Cloud, they update their tokenizers so that,"}],"notes":["本段讲解了分词（tokenization）的基本概念，即如何将文本转换为一系列的token。每个token都有一个唯一的ID，用于表示不同的词汇或子词。例如，像'blank dog'或'blank runs'这样的组合可能被当作一个token处理，而像逗号这样的标点符号也可能被单独作为一个token。","讲者提到，当前开源模型的token数量通常在10^5量级，即至少10万。例如，QN 3.5版本的模型有约250个token，这可能是因为每个token可以使用8个字节来表示，但具体取决于模型如何编码token。","讲者还举了几个例子，如'hapiness'可能被拆分为'unhappiness'、'H'、'A-P-I-N-E-S-S'等不同的token，这说明某些词汇可能被拆分成多个token，特别是生物医学领域的词汇，每个部分都有特殊含义。","分词器（tokenizer）是将文本转换为token序列的算法，每个模型可能有不同的分词器。虽然有些模型可能共享相同的分词器，但大多数情况下，分词器是特定于模型的。","讲者提到，不同公司可能采用不同的专有分词方法，例如Cloud Code可能更新其分词器以优化性能。","讲者在最后提到，分词器的更新可能与模型的优化有关，但具体细节未展开。"],"formulas":[],"uncertainties":["I think 250 probably is mostly because I think 250 is somehow you can represent this token with maybe.","Maybe 250. I'm just writing some random numbers. Everything has an ID.","I think this part is a token, this part is a token, and this part is token.","and different companies have","different proprietary tokenization approach.","I think Cloud Code."],"diagram":"none","start":335.76,"end":514.37,"asr_flags":[],"raw_segments":[{"start":335.76,"text":"So the blank is actually merged with Doug as a token. And you have so many of this. Typically, this kind of tokenization right now, I think for the open source models, we know the number of tokens they have. I think it's often on the order of 10 to the 5, like 100k at least. I think QN 3.5, this is the newest version of the open source models, which are pretty good. I think they have like 250 tokens."},{"start":361.32,"text":"I think 250 probably is mostly because I think 250 is somehow you can represent this token with maybe."},{"start":369.18,"text":"eight bytes in some sense. It also depends on how many bits you can present the tokens. Anyway, so you have this vocabulary and then you just give it a long string of text. You just take all the subwords that are tokens and you turn it into a sequence of segments. For example, if you have a dog runs,"},{"start":392.11,"text":"Suppose this is the text you see, and then you'll say this is a token, so this is one part. Then I think blank dog is a token, and blank runs is also a token, and comma I think is a token by itself. Every token has an ID. So let's say A is probably the ID number one, dog is maybe the ID number like 356, whatever, and run is some ID."},{"start":419.86,"text":"Maybe 250. I'm just writing some random numbers. Everything has an ID. So basically, you turn every text into a sequence of IDs. Each ID corresponds to one token. So in this case, most of these words are actually one token. I think I just checked recently, if you have the word happiness, I think the tokenization will be unhappiness, let's say. I think this part is a token. H is a token."},{"start":448.91,"text":"A-P-I-N-E-S-S is a token for some reason. Maybe another example is this. I already read it that IOM identification. This is another example we come up with. I don't know actually what this word means if you have a blast."},{"start":467.53,"text":"I think this part is a token, this part is a token, and this part is token. I think this is just because for this biological words, biomedical words, actually every part of the word has some special meaning, and so you tokenize them into tokens. And what is the exact vocabulary? It depends on the model."},{"start":487.12,"text":"So basically, the algorithm that turns the text into these tokens is called a tokenizer. And every model has a different tokenizer. Not everyone has a different one. Some of them share the same tokenizers. But generally, it's specific to the tokenizer, to the model."},{"start":503.73,"text":"and different companies have"},{"start":505.01,"text":"different proprietary tokenization approach."},{"start":508.61,"text":"You've probably heard of that recently,"},{"start":510.49,"text":"I think Cloud Code."},{"start":511.99,"text":"Cloud, they update their tokenizers so that,"}],"speech_gaps":[],"frame":"../frames/v041/003.webp","frame_time":347.76},{"title":"Transformer 与上下文学习","segments":[{"id":58,"text":"I think they make the tokenizers more granular to some degree,"},{"id":59,"text":"so that the same amount of tax will be tokenized into more tokens."},{"id":60,"text":"So before it's just 1,000 tokens,"},{"id":61,"text":"now it's 1.5 thousand tokens."},{"id":62,"text":"I didn't verify it myself,"},{"id":63,"text":"but I read some news about this."},{"id":64,"text":"Assuming they are true, that means that you spend more tokens,"},{"id":65,"text":"because you pay more to Cloud Code with the same amount of tax."},{"id":66,"text":"Anyway, so cool."},{"id":67,"text":"There are some details about how to come up with"},{"id":68,"text":"the vocabulary and how to run this algorithm to tokenize."},{"id":69,"text":"The keyword is called BPE tokenizer byte pair encoding."},{"id":70,"text":"So I'm not going through the details because this is"},{"id":71,"text":"is just a very small, quick setup."},{"id":72,"text":"It's not that important."},{"id":73,"text":"But roughly speaking, the BP tokenization idea is that you try to,"},{"id":74,"text":"in some sense, you just try to find"},{"id":75,"text":"frequent sub-words that are most frequent,"},{"id":76,"text":"and you use them ng is a d-dimensional vector in the Euclidean space."},{"start":890.26,"text":"And this embedding is trained."},{"start":892.12,"text":"So basically, you don't know what the parameters are."},{"start":894.4,"text":"You will just parametrize it as unknown numbers,"},{"start":898.12,"text":"and you train the model to find"},{"start":900.24,"text":"the right numbers for these embeddings."},{"start":903.68,"text":"So every token in"},{"start":908.0,"text":"vocabulary will be will have a corresponding embeddings so basically um you're gonna have"},{"start":915.57,"text":"a sequence of embeddings, E1, E2. This is the embedding for the first token, embedding for the second token, up to the embedding for the last token. And in this lecture, I think we're going to use row vectors because I think when you get into the implementations, you know."},{"start":929.85,"text":"every vector is actually row vectors in the Python code, even though in mathematics people often use column vectors. So I thought about this and I thought just for large English model sections, we'll just always use row vectors, which is more consistent with the practice. It looks a bit weird to me actually from a mathematical perspective, and if you read the papers, many of the papers do use column vectors, but I think we'll just use row vectors to be consistent with the code. So basically, every embedding is a row vector."},{"start":958.49,"text":"And then you have this embedding matrix. So you have v of them, and each of them is of dimension d. So you have this matrix. And to read off which row you are, you just have to multiply. Either you just read off the id. So if you have the fifth token, you just read the fifth row. Or you can multiply this matrix with an indicator vector to gather that row, which is the same thing. Anyway, so we'll just read off from this embedding matrix the corresponding."},{"start":988.74,"text":"embeddings for each of the tokens. So you get E up to E ."},{"start":996.66,"text":"And I think in many cases, often people append, prepend a beginning of sentence token, which is just a fixed token, in the very beginning. This is kind of like not always necessary. In some cases, you just don't do it. In some cases, you do it. But let's probably just introduce that. You have a beginning of sentence token, which is one of the special tokens in this vocabulary. Often, actually, what happens is that your vocabulary is bigger than..."},{"start":1022.78,"text":"what is needed, you always reserve a few tokens, you know, actually maybe a thousand, you know, a few thousand tokens for special tokens that you can introduce for special purposes. And you can introduce this begin of sentence token as X0, which is always the same. And then you turn them into embeddings. And then what you do is that you go through this transformer, which I will discuss in the later half of the lecture. So this is a transformer."}],"speech_gaps":[],"frame":"../frames/v041/006.webp","frame_time":882.38},{"title":"Transformer 与上下文学习中的概率分布","segments":[{"id":158,"text":"For now, you just think of this as a new edge work, which does a lot of computation, machine application, or tensions, which I'm going to discuss. A lot of operations, and then you output some logits at each of the locations. So each of these logits is supposed to describe the conditional distribution before the softmax. So basically, what you do is you say,"},{"id":159,"text":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0."},{"id":160,"text":"So the first distribution, which is not conditional, you just get the output from the x0. You get some logit. So this ui is in dimension v. And you take a softmax, you get a probability vector. So this is a probability vector in this simplex of dimension v. So after taking a softmax, the sum of the entries is 1. And all of the entries are non-active."},{"id":161,"text":"So then this is your probability for x1. This is the distribution. Technically, I think the distribution of this is equal to softmax. And then the same thing, when you have x2 given x1, you say this is equals to softmax of u2, where u2 is the output at the second position. And u2, we'll just call u2 the output."},{"id":162,"text":"of this model given x0 and x1. So each of these ui's is basically the output for the sequence before it. So ut plus 1 is f theta x0 up to xt. So basically, generically, p of xt given x1"}],"notes":["本段讲解了Transformer模型中概率分布的构建过程，其中每个位置的输出通过softmax函数转换为概率分布。讲者提到，每个位置的logit是条件分布的前一步，即在softmax之前的状态。","讲者指出，第一个分布是无条件的，直接由x0生成logit，然后通过softmax得到概率向量。该向量属于一个维度为v的简单形（simplex），其所有元素之和为1，且所有元素非负。","在后续位置（如x2）的分布构建中，讲者强调使用与前一步相同的softmax机制，其中u2是模型在给定x0和x1后的输出。","讲者还提到，每个ui代表序列前一步的输出，ut+1是基于x0到xt的函数fθ的输出。最后，讲者提到p(xt| x1)的泛化形式，但未完整表达。","讲者在讲解过程中多次提到softmax函数的作用，以及如何将logit转换为概率分布，强调了概率分布的归一化性质。","讲者在描述模型结构时，使用了u1、u2等变量来表示不同位置的输出，并指出这些输出是基于前一步的输入生成的。"],"formulas":[{"latex":"p(x_1) = \\text{softmax}(f_\\theta(x_0))","symbols":"p(x_1) 表示 x1 的概率分布，softmax 是将 logit 转换为概率分布的函数，f_θ(x_0) 是输入 x0 经过模型得到的 logit","explanation":"公式正确，softmax 函数将 logit 转换为概率分布，符合概率分布的定义。","evidence":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0."},{"latex":"p(x_1) = \\text{softmax}(u_1), \\text{其中 } u_1 = f_\\theta(x_0)","symbols":"p(x_1) 是 x1 的概率分布，u_1 是由 x0 通过模型 f_θ 得到的 logit，softmax 将其转换为概率分布","explanation":"公式正确，明确说明了 u_1 的定义，符合概率分布的定义。","evidence":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0."}],"uncertainties":["p of xt given x1
