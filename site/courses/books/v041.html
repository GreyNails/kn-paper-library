ill a linear combination or convex combination of the V1 up to VT. So that's pretty much what you do. So you just say if the dependency is not good, you just, in some sense, mask them out."},{"id":299,"text":"And mathematically, what you do, actually also implementation-wise, what you do is through this masking, which means that you add a masking here. Maybe let's use a different color too. So you add a masking here. I need a different, better color. So you add a mask here."},{"id":300,"text":"so that you can mask out the, let me see, you can mask out half of this matrix. So you have like a Q1K1 transpose, Q1K2 transpose, so on and so forth. And Q1K2 transpose is not valid in some sense because you are looking, you are attending to something you shouldn't attend. Q1 shouldn't be able to see K2. So basically you add this masking matrix. What you add is that you add,"}],"notes":["本段讲解了Transformer模型中依赖关系的问题，指出在标准的Transformer架构中，输出不仅依赖于前面的输入，还可能依赖于后面的输入，这与序列生成的因果性要求不符。因此，需要引入掩码机制来消除这种不合理的依赖。","讲者提到，通过引入掩码，可以删除时间t之后的所有依赖项，从而确保输出仅依赖于前面的输入。这涉及到对注意力机制的修改，即在计算注意力权重时，通过掩码矩阵屏蔽掉不合法的依赖项。","在数学实现上，掩码机制通过在注意力矩阵中添加一个掩码矩阵来实现，该矩阵可以屏蔽掉某些位置的注意力权重，从而确保模型不会关注到不应该关注的部分。","讲者还提到，掩码矩阵可以用于屏蔽掉矩阵中的一半内容，例如在计算Q1与K2之间的注意力时，Q1不应该关注K2，因此需要通过掩码来阻止这种不合理的注意力计算。","掩码机制的引入是Transformer模型能够处理序列生成任务的关键，它确保了模型在生成每个输出时，只能依赖于之前已经生成的内容，而不是未来的输入。","讲者强调，掩码机制不仅在数学上是必要的，而且在实现上也是必须的，因为它直接影响了模型的注意力计算方式和输出结果的正确性。"],"formulas":[],"uncertainties":["auto-requestive","HT in","pt vt plus","PT, T, VT, PT, capital T, V, capital T"],"diagram":"none","start":3619.19,"end":3795.3,"asr_flags":[],"raw_segments":[{"start":3619.19,"text":"And there's one thing that we kind of cheat a little bit here, which is that if you look at this architecture, then it's not true that the t-th output only depends on everything before it. There's no this kind of like a auto-requestive kind of like properties yet, right? Because the output at time t depends on everything."},{"start":3646.84,"text":"It depends on V capital T, even the last input. V capital T is a function of the last input. So an output at time T depends on the input, depends on VT and it depends on HT in. So basically, there's no kind of like this dependency. So then what you do is you say, introduce the concept of masking to make sure that there's no,"},{"start":3674.99,"text":"this kind of wrong dependency you want. So basically, what you really want to do is that you just, in some sense, for h little t, you want to delete everything after time t. So basically, let's say, before you have this pt vt plus"},{"start":3699.42,"text":"PT, T, VT, PT, capital T, V, capital T. So basically, you said these dependencies are invalid for me, so I just don't have them. So basically, you just delete all of this. And then you renormalize this piece so that the sum of this piece got normalized to one. So it's still a linear combination or convex combination of the V1 up to VT. So that's pretty much what you do. So you just say if the dependency is not good, you just, in some sense, mask them out."},{"start":3729.01,"text":"And mathematically, what you do, actually also implementation-wise, what you do is through this masking, which means that you add a masking here. Maybe let's use a different color too. So you add a masking here. I need a different, better color. So you add a mask here."},{"start":3766.29,"text":"so that you can mask out the, let me see, you can mask out half of this matrix. So you have like a Q1K1 transpose, Q1K2 transpose, so on and so forth. And Q1K2 transpose is not valid in some sense because you are looking, you are attending to something you shouldn't attend. Q1 shouldn't be able to see K2. So basically you add this masking matrix. What you add is that you add,"}],"speech_gaps":[],"frame":"../frames/v041/022.webp","frame_time":3631.19},{"title":"Transformer 中的注意力掩码机制","segments":[{"id":301,"text":"minus infinity, you add minus infinity here. And for q1k3 transpose, you also add minus infinity, so on and so forth. And then in the next row, you have q2k1 transpose, which is good. You have q2k2 transpose, which is good. And you have q2k3 transpose, which is not good. So you add minus infinity here, so on and so forth. So basically, everything here will be"},{"id":302,"text":"adding additional minus infinity. So basically, this upper triangle part of this matrix will be all minus infinity. By adding minus infinity, it just means that you turn it into minus infinity. Any number added by minus infinity is the minus infinity. And then what happens is that, in other words, it's kind of like you are just trying to add all of minus infinity to all of this part."},{"id":303,"text":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"id":304,"text":"everything after q will become 0, and the sum of the rest will be 1. So that's exactly how you achieve this, because basically the leading combination of the rest of the terms doesn't matter because their coefficients are 0. We are masking this because in this autoregressive model, you don't allow the output at time t to depend on anything that is after t. So you have to respect this kind of like a sequential dependency."},{"id":305,"text":"In generation, you are not able to see the future tokens to generate a current token. So every token can only depends on things before it. So that's why we have to mask it out. We are almost done here. So this is the so-called single-head attention. We have to make it more complicated to even finish the attention part."}],"notes":["本段讲解了Transformer中注意力机制的掩码操作，通过将上三角部分的值设为负无穷，确保在计算注意力权重时，每个位置只能关注其前面的token。这是为了模拟自回归模型中，当前token不能依赖于未来token的特性。","在计算softmax时，所有被设为负无穷的值会变成0，而其余值的总和为1。这种操作确保了注意力权重只考虑当前token之前的上下文信息。","这种掩码机制是自回归模型（如语言模型）中不可或缺的一部分，因为它保证了生成过程中的因果性，即当前token的生成仅依赖于之前生成的token。","在实际实现中，这种掩码通常通过在注意力矩阵中添加负无穷值来实现，从而在softmax计算中忽略这些位置。","单头注意力（single-head attention）是Transformer模型的基础部分，后续会进一步扩展为多头注意力（multi-head attention）以增强模型的表达能力。","通过这种掩码机制，Transformer能够有效地处理序列数据，同时保持模型的因果性，这是其在自然语言处理任务中取得成功的关键原因之一。"],"formulas":[{"latex":"e^{-\\infty} = 0","symbols":"指数函数在负无穷处的值为0","explanation":"该公式正确描述了指数函数在负无穷处的极限行为，符合数学定义。","evidence":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"latex":"softmax(x) = \\frac{e^{x_i}}{\\sum_j e^{x_j}}","symbols":"softmax函数将输入转换为概率分布","explanation":"该公式正确描述了softmax函数的定义，适用于将任意实数向量转换为概率分布。","evidence":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"latex":"\\sum_{i} p_i = 1","symbols":"softmax输出的概率总和为1","explanation":"该公式正确描述了softmax函数输出的概率分布的归一化性质。","evidence":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"}],"uncertainties":[],"diagram":"none","start":3796.4,"end":3957.13,"asr_flags":[],"math_clarifications":["原文中提到的'adding minus infinity'和'everything after t'等描述，虽然没有直接转化为数学公式，但它们与softmax函数的性质和应用相关，因此在数学上是合理的。"],"raw_segments":[{"start":3796.4,"text":"minus infinity, you add minus infinity here. And for q1k3 transpose, you also add minus infinity, so on and so forth. And then in the next row, you have q2k1 transpose, which is good. You have q2k2 transpose, which is good. And you have q2k3 transpose, which is not good. So you add minus infinity here, so on and so forth. So basically, everything here will be"},{"start":3828.21,"text":"adding additional minus infinity. So basically, this upper triangle part of this matrix will be all minus infinity. By adding minus infinity, it just means that you turn it into minus infinity. Any number added by minus infinity is the minus infinity. And then what happens is that, in other words, it's kind of like you are just trying to add all of minus infinity to all of this part."},{"start":3853.79,"text":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"start":3888.29,"text":"everything after q will become 0, and the sum of the rest will be 1. So that's exactly how you achieve this, because basically the leading combination of the rest of the terms doesn't matter because their coefficients are 0. We are masking this because in this autoregressive model, you don't allow the output at time t to depend on anything that is after t. So you have to respect this kind of like a sequential dependency."},{"start":3924.12,"text":"In generation, you are not able to see the future tokens to generate a current token. So every token can only depends on things before it. So that's why we have to mask it out. We are almost done here. So this is the so-called single-head attention. We have to make it more complicated to even finish the attention part."}],"speech_gaps":[{"start":3922.08,"end":3923.72}],"frame":"../frames/v041/023.webp","frame_time":3808.4},{"title":"Transformer 中的多头注意力机制","segments":[{"id":306,"text":"Then, what we do next is that, maybe let's erase here. So, in some sense, what we are doing here is that we have H1 in and HT in, and we go through this single head attention. I guess in the node, I call it attention 1H, and you get this H1 out up to HT out. That's what we defined so far."},{"id":307,"text":"In practice, you have multiple copies of"},{"id":308,"text":"this single-head attention with different weight matrices."},{"id":309,"text":"So you get another copy of the single-head attention."},{"id":310,"text":"Maybe let's call this single-head attention one,"},{"id":311,"text":"this is called single-head attention two,"},{"id":312,"text":"and they have the same input,"},{"id":313,"text":"and then you get another copy of the output."},{"id":314,"text":"But here, by copy, I don't really mean literally copy,"},{"id":315,"text":"because then it's not useful."},{"id":316,"text":"So the difference between this and this"},{"id":317,"text":"is that the weight matrices are different."},{"id":318,"text":"So basically, this WQ, WKWV, for these two copies"},{"id":319,"text":"So that's why they're not really literally copies."},{"id":320,"text":"So that's why they're not really literally copies."},{"id":321,"text":"They are just like you have another version of it."},{"id":322,"text":"So in some sense,"},{"id":323,"text":"you should index this by something else"},{"id":324,"text":"because the output will be different."},{"id":325,"text":"So maybe you should index this by,"},{"id":326,"text":"let's say this is because this is the first attention,"},{"id":327,"text":"you say H11 and HT1 and this is H12, HT2."},{"id":328,"text":"2 and you also have another one and you get H1,"},{"id":329,"text":"3 up to HT, 3."},{"id":330,"text":"So we have so many copies,"},{"id":331,"text":"you have several sequences of vectors,"},{"id":332,"text":"but eventually you only want one sequence of vectors."},{"id":333,"text":"So you have to combine them in some way."},{"id":334,"text":"The way to combine them is that you concatenate these three things."},{"id":335,"text":"things, so you concatenate h11 out, h12 out, h1."},{"id":336,"text":"I think each of these is called one head."},{"id":337,"text":"So you have, let's say, nh head."},{"id":338,"text":"So this is a tension n sub h."},{"id":339,"text":"So you concatenate all of these vectors,"},{"id":340,"text":"vectors and then you multiply that with another projection matrix,"}],"notes":["本段讲解了Transformer模型中多头注意力机制的基本概念。讲者指出，单头注意力机制中，输入H1和HT经过单头注意力处理后得到输出H1和HT。在实际应用中，会使用多个不同的权重矩阵来实现多个单头注意力机制，这些机制虽然结构相似，但权重矩阵不同，因此不能简单地视为复制。","讲者进一步说明，为了区分不同的单头注意力机制，需要对它们进行索引。例如，第一个注意力机制的输出可以表示为H11和HT1，第二个为H12和HT2，以此类推。最终，所有这些注意力机制的输出会被拼接在一起，形成一个单一的向量序列。","讲者提到，拼接后的向量序列需要通过另一个投影矩阵进行处理，以生成最终的输出。每个注意力机制被称为一个“head”，而整个模型中通常包含多个这样的head，即nh个head。","讲者强调，虽然多个单头注意力机制的结构相似，但由于权重矩阵不同，它们的输出结果也会不同。因此，需要通过索引来区分不同的注意力机制，并在最终输出时将它们合并。","讲者还提到，最终的输出是通过将所有注意力机制的输出拼接在一起，然后乘以一个投影矩阵得到的。这一步骤是Transformer模型中实现多头注意力机制的关键部分。","讲者指出，多头注意力机制的设计使得模型能够从不同的表示空间中提取信息，从而提高模型的表达能力。这种机制在自然语言处理任务中被广泛应用。"],"formulas":[],"uncertainties":["tension n sub h"],"diagram":"none","start":3958.83,"end":4137.12,"asr_flags":[334],"raw_segments":[{"start":3958.83,"text":"Then, what we do next is that, maybe let's erase here. So, in some sense, what we are doing here is that we have H1 in and HT in, and we go through this single head attention. I guess in the node, I call it attention 1H, and you get this H1 out up to HT out. That's what we defined so far."},{"start":4000.32,"text":"In practice, you have multiple copies of"},{"start":4002.66,"text":"this single-head attention with different weight matrices."},{"start":4006.84,"text":"So you get another copy of the single-head attention."},{"start":4011.66,"text":"Maybe let's call this single-head attention one,"},{"start":4015.18,"text":"this is called single-head attention two,"},{"start":4017.2,"text":"and they have the same input,"},{"start":4022.24,"text":"and then you get another copy of the output."},{"start":4028.04,"text":"But here, by copy, I don't really mean literally copy,"},{"start":4030.96,"text":"because then it's not useful."},{"start":4032.58,"text":"So the difference between this and this"},{"start":4034.96,"text":"is that the weight matrices are different."},{"start":4039.72,"text":"So basically, this WQ, WKWV, for these two copies"},{"start":4045.68,"text":"of the tension are different."},{"start":4047.42,"text":"So that's why they're not really literally copies."},{"start":4049.78,"text":"They are just like you have another version of it."},{"start":4062.34,"text":"So in some sense,"},{"start":4063.5,"text":"you should index this by something else"},{"start":4064.86,"text":"because the output will be different."},{"start":4066.16,"text":"So maybe you should index this by,"},{"start":4071.36,"text":"let's say this is because this is the first attention,"},{"start":4074.36,"text":"you say H11 and HT1 and this is H12, HT2."},{"start":4078.72,"text":"2 and you also have another one and you get H1,"},{"start":4083.16,"text":"3 up to HT, 3."},{"start":4087.1,"text":"So we have so many copies,"},{"start":4089.54,"text":"you have several sequences of vectors,"},{"start":4091.88,"text":"but eventually you only want one sequence of vectors."},{"start":4094.4,"text":"So you have to combine them in some way."},{"start":4096.56,"text":"The way to combine them is that you concatenate these three things."},{"start":4106.22,"text":"things, so you concatenate h11 out, h12 out, h1."},{"start":4117.86,"text":"I think each of these is called one head."},{"start":4121.36,"text":"So you have, let's say, nh head."},{"start":4125.32,"text":"So this is a tension n sub h."},{"start":4129.88,"text":"So you concatenate all of these vectors,"},{"start":4132.04,"text":"vectors and then you multiply that with another projection matrix,"}],"speech_gaps":[{"start":4055.024,"end":4058.192}],"frame":"../frames/v041/024.webp","frame_time":3970.83},{"title":"Transformer 与多头注意力机制","segments":[{"id":341,"text":"and then this will give you the final h, the output."},{"id":342,"text":"So that's the final output at position one. You do the same thing for position two where you concatenate maybe these guys, and then you do a projection, you get the output at position two. So in some sense, this is just give you more power to compute different kind of tension."},{"id":343,"text":"And the intuition is that maybe each of these single-head attention is doing some special type of job. For example, maybe here it's trying to find out which entity in the past passage"},{"id":344,"text":"matters to me and here this is trying to find out what are the sentiment of the past passages and which part of the sentiment matters to me, so on and so forth. So each of these attention probably pay attention to different type of information and then eventually aggregate the outcome of all of this information into one big vector and you project it into a single output. Cool."},{"id":345,"text":"No, no, they are all parallel, yes. They are parallel, and then you aggregate. And all of this is in one of this. So basically, in one of this, you have multiple parallel heads, and then next round, you have another number of parallel heads. I think the number of heads is maybe on the order of maybe at most 100, I guess. Let me think about this."},{"id":346,"text":"Something on that order, I think. Yeah. One more question. It also depends on the model size, of course, right? I think the biggest one, I don't know. I don't know whether a hundred is for which model size. I think maybe for like a 100 billion parameter model, so you have a hundred heads. Yeah. I mean, you said you have multiple heads because just to have bigger . Yeah. I mean, if you have like a bigger weight matrix, then you can use that bigger weight matrix."}],"notes":["本段讲解了Transformer模型中多头注意力机制的基本概念，指出每个单头注意力可能负责不同的任务，例如识别过去文本中对当前任务重要的实体或情感信息。通过多个注意力头的并行处理，模型能够捕捉更丰富的上下文信息，并将这些信息聚合为一个向量，最终输出结果。","讲者提到多头注意力机制中，每个注意力头可能专注于不同的信息类型，例如实体识别或情感分析。这种设计使得模型能够更全面地理解输入文本，从而提高整体性能。","讲者进一步解释了多头注意力机制的结构，指出多个注意力头是并行处理的，并且在模型中可能有多个这样的并行头。这种设计允许模型在不同的层次上处理信息，从而增强其表达能力。","讲者提到注意力头的数量通常在100左右，但具体数量取决于模型的规模。例如，一个拥有1000亿参数的模型可能会使用100个注意力头。这种设计使得模型能够利用更大的权重矩阵，从而提升性能。","讲者指出，使用多个注意力头的主要目的是为了增加模型的表达能力，通过更大的权重矩阵来捕捉更复杂的模式。这种设计在实践中被广泛采用，以提高模型的泛化能力和准确性。","讲者最后提到，注意力头的数量和模型规模之间存在一定的关系，但具体数值可能因模型而异。这种设计使得模型能够灵活适应不同的任务和数据规模。"],"formulas":[],"uncertainties":["bigger ."],"diagram":"none","start":4137.84,"end":4287.63,"asr_flags":[],"raw_segments":[{"start":4137.84,"text":"and then this will give you the final h, the output."},{"start":4145.13,"text":"So that's the final output at position one. You do the same thing for position two where you concatenate maybe these guys, and then you do a projection, you get the output at position two. So in some sense, this is just give you more power to compute different kind of tension. In some sense, I think actually in practice if you"},{"start":4172.04,"text":"And the intuition is that maybe each of these single-head attention is doing some special type of job. For example, maybe here it's trying to find out which entity in the past passage"},{"start":4187.93,"text":"matters to me and here this is trying to find out what are the sentiment of the past passages and which part of the sentiment matters to me, so on and so forth. So each of these attention probably pay attention to different type of information and then eventually aggregate the outcome of all of this information into one big vector and you project it into a single output. Cool."},{"start":4224.77,"text":"No, no, they are all parallel, yes. They are parallel, and then you aggregate. And all of this is in one of this. So basically, in one of this, you have multiple parallel heads, and then next round, you have another number of parallel heads. I think the number of heads is maybe on the order of maybe at most 100, I guess. Let me think about this."},{"start":4257.1,"text":"Something on that order, I think. Yeah. One more question. It also depends on the model size, of course, right? I think the biggest one, I don't know. I don't know whether a hundred is for which model size. I think maybe for like a 100 billion parameter model, so you have a hundred heads. Yeah. I mean, you said you have multiple heads because just to have bigger . Yeah. I mean, if you have like a bigger weight matrix, then you can use that bigger weight matrix."}],"speech_gaps":[{"start":4222.672,"end":4224.37}],"frame":"../frames/v041/025.webp","frame_time":4149.84},{"title":"Transformer 与上下文学习中的残差连接与归一化","segments":[{"id":347,"text":"Yeah, I think, I don't know exactly what's your proposal, but maybe this sounds like a simplified answer, but many of these proposals have been considered in various ways, and some of them are for, on most of our efficiency perspectives, because eventually you can just have, as we discussed, if you really don't care about efficiency, you can just have a generic."},{"id":348,"text":"very gigantic networks by all of these special structures to try to use your parameters in the right way so that you can use it more efficiently in some sense. So I guess let's just give me two or three minutes to talk about some very quick things."},{"id":349,"text":"One thing is that actually when I draw this, it's actually a bit more complicated than just doing this. So because there's also a residual part in this how to combine MLP with attention. So actually what you really do is that you say you apply. So after you do the attention, you do some normalization here."},{"id":350,"text":"So there's a normalization layer. Often, this is using the RSM norm that we briefly discussed involved in the network section. Then you apply MLP and then you add the residuals back to this. You resume the network that we discussed. Then you go to the next layer. There are different ways to add the residuals. You can add the residuals after you do the attention or before you do the attention. So there's something called"},{"id":351,"text":"pre-norm and post-norm things. So I guess the details, you can check out the lecture notes. So there's some kind of like others on how you, when you apply a normalization with issues and attention, so on and so forth."},{"id":352,"text":"we should try to quickly think about the computational efficiency here and the memory footprint. So how many operations we have to do, especially as a function of t."},{"id":353,"text":"As a function of other things, it's actually relatively easier because as a function of the number of parameters, all of those, it's all multiplicative and linear in some sense. The main important thing is, what is the dependency on T? You can see that for each of the T's position, you have to compute all of these inner products. So for each of the position, you have to compute capital T inner product, and you have capital T of these positions."}],"notes":["本段主要讲解Transformer架构中残差连接（residual connection）和归一化（normalization）的实现方式。讲者指出，Transformer的结构比简单的注意力机制更复杂，因为需要将多层感知机（MLP）与注意力机制结合，并通过残差连接将结果反馈到网络中。归一化层通常使用RMSNorm，这是在课程中提到的网络部分简要讨论过的内容。","讲者提到残差连接可以在注意力机制之后或之前添加，这对应了pre-norm和post-norm两种方式。这些细节建议查阅课程讲义。此外，讲者强调了在后续课程中从系统机器学习（system ML）视角分析Transformer时，需要关注计算效率和内存占用。","在计算效率方面，讲者指出计算量主要取决于序列长度T。对于每个位置，都需要计算T个内积，因此总共有T²个内积操作。这表明Transformer的计算复杂度与序列长度的平方成正比，这在处理长序列时可能带来较大的计算负担。","讲者还提到，计算量与参数数量的关系相对简单，因为参数数量的增加通常会导致乘法和线性增长的计算量。然而，序列长度T的依赖关系更为关键，因为其影响是平方级别的，这在实际应用中需要特别注意。","讲者通过内积操作的计算量来说明Transformer的复杂度，这与注意力机制中计算查询、键和值之间的相似度有关。这种计算方式在处理长序列时可能成为性能瓶颈，因此需要优化策略，如使用稀疏注意力或分块处理。","最后，讲者强调了在分析Transformer时，需要从计算效率和内存占用两个角度出发，这为后续课程中讨论系统层面的优化提供了基础。"],"formulas":[],"uncertainties":["RSM norm的具体实现细节未明确","pre-norm和post-norm的定义和区别未完全澄清","讲者提到的'capital T inner product'是否指T个内积操作，还是T²个内积操作，存在歧义"],"diagram":"none","start":4295.78,"end":4467.4,"asr_flags":[],"math_clarifications":["原文提到计算复杂度与序列长度T的平方成正比，但未明确说明该复杂度是计算操作还是内存开销。因此，无法确定该公式是否准确反映原文内容，需进一步核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4295.78,"text":"Yeah, I think, I don't know exactly what's your proposal, but maybe this sounds like a simplified answer, but many of these proposals have been considered in various ways, and some of them are for, on most of our efficiency perspectives, because eventually you can just have, as we discussed, if you really don't care about efficiency, you can just have a generic."},{"start":4318.57,"text":"very gigantic networks by all of these special structures to try to use your parameters in the right way so that you can use it more efficiently in some sense. So I guess let's just give me two or three minutes to talk about some very quick things."},{"start":4349.69,"text":"One thing is that actually when I draw this, it's actually a bit more complicated than just doing this. So because there's also a residual part in this how to combine MLP with attention. So actually what you really do is that you say you apply. So after you do the attention, you do some normalization here."},{"start":4381.32,"text":"So there's a normalization layer. Often, this is using the RSM norm that we briefly discussed involved in the network section. Then you apply MLP and then you add the residuals back to this. You resume the network that we discussed. Then you go to the next layer. There are different ways to add the residuals. You can add the residuals after you do the attention or before you do the attention. So there's something called"},{"start":4408.07,"text":"pre-norm and post-norm things. So I guess the details, you can check out the lecture notes. So there's some kind of like others on how you, when you apply a normalization with issues and attention, so on and so forth. Finally, I think one important thing, especially for the next lecture about the system ML perspective is that,"},{"start":4429.78,"text":"we should try to quickly think about the computational efficiency here and the memory footprint. So how many operations we have to do, especially as a function of t."},{"start":4442.56,"text":"As a function of other things, it's actually relatively easier because as a function of the number of parameters, all of those, it's all multiplicative and linear in some sense. The main important thing is, what is the dependency on T? You can see that for each of the T's position, you have to compute all of these inner products. So for each of the position, you have to compute capital T inner product, and you have capital T of these positions."}],"speech_gaps":[],"frame":"../frames/v041/026.webp","frame_time":4307.78},{"title":"Transformer 的上下文长度与计算复杂度","segments":[{"id":354,"text":"So that means that you have to basically do a T-square dependency. So in other words, even this matrix itself is a T by T matrix, capital T by capital T matrix, and each of these entry requires some inner product. So I think the dimension, if you still remember the Q is or the QTs are in RdH, and you need to compute T-square of this inner product."},{"id":355,"text":"The number of operations is t squared times dh. Dependence on dh is less relevant, less important to some degree. The dependence on t squared is very important because this means that if you have capital T being a million, it's going to take a million times squared operations which is prohibitive."},{"id":356,"text":"So, and this is one of the issues with the long context issues probably have heard of like, I think we are using chat GPT or Cloud Code, you see the context and after some point they say, let me compact my context. The reason is that you have to shrink the context, otherwise your computational efficiency is too bad. But of course, in the real production system, it's not like all of this capital T is really."},{"id":357,"text":"There are other ways to reduce the dependencies. I think in practice, I don't think necessarily T squared is probably more closer to linear in T because there are other ways, variants of transformers that can reduce the dependency on T. I think after, in the next Wednesday, we're going to discuss a few things that can reduce the dependency on T a little bit. Exactly how we do it."},{"id":358,"text":"We don't really know, in some sense, because there are a lot of open source papers that propose different approach. At least, I don't know exactly which one is used in the open and anthropic. And another thing is that, what is the memory usage here? So the memory usage, at the first side, you have to spend T squared memory, because this matrix itself requires T squared memory."},{"id":359,"text":"But that actually can be reduced because you don't have to actually compute the whole matrix one by one and then do the multiplication with v. So in some sense, to some degree, you can do some part of this matrix and multiply with part of the v first, and then you don't have to save that part of the matrix. You can compute a second part. The idea is called flash retention, probably you have heard of, which is a way to reduce the memory."},{"id":360,"text":"A free footprint in these systems. But some of these ideas do have a trade-off because when you reduce the, for example, if you change your architecture to make the dependency on T squared better, for example, we'll discuss some of this on Wednesday. So if you change the architecture, the dependency on T is better, but your architecture is less expressive, and then you may lose some performance to some degree."},{"id":361,"text":"OK. Sounds good. Thank you."}],"notes":["本段主要讨论Transformer模型中上下文长度对计算复杂度的影响。具体来说，当处理长度为T的上下文时，计算复杂度与T的平方成正比，这导致当T很大时（如百万级别），计算量会变得非常大，从而影响模型的效率。","为了应对这一问题，实际应用中会通过压缩上下文来减少计算量。例如，像Chat GPT或Cloud Code这样的系统会在上下文过长时提示用户压缩上下文。此外，还存在其他方法，如通过改进Transformer的变体来降低对T的依赖。","在实际应用中，虽然T的平方复杂度是主要问题，但通过一些优化方法，如Flash Attention，可以减少内存使用。这些方法通常涉及分阶段计算注意力矩阵，从而避免存储整个矩阵。","然而，这些优化方法通常伴随着一定的权衡。例如，改变模型架构以降低对T的依赖可能会导致模型表达能力下降，从而影响性能。","最后，课程提到将在接下来的课程中进一步讨论这些优化方法的具体实现方式，包括如何在不牺牲模型性能的前提下减少计算复杂度。","总体而言，本段强调了Transformer模型在处理长上下文时面临的计算和内存挑战，并介绍了可能的解决方案及其权衡。"],"formulas":[{"latex":"O(T^2 \\times d_h)","symbols":"计算复杂度与上下文长度T的平方和隐藏层维度d_h成正比","explanation":"该公式正确表达了计算复杂度与上下文长度T的平方和隐藏层维度d_h的正比关系，符合原文中提到的T平方乘以dh的计算复杂度。","evidence":"the number of operations is t squared times dh. Dependence on dh is less relevant, less important to some degree. The dependence on t squared is very important because this means that if you have capital T being a million, it's going to take a million times squared operations which is prohibitive."}],"uncertainties":["T squared"],"diagram":"none","start":4468.39,"end":4644.54,"asr_flags":[],"math_clarifications":["原文中提到的T平方乘以dh的计算复杂度是正确的，但未明确说明这是时间复杂度还是空间复杂度。根据上下文，此处应为时间复杂度，因此公式保持不变。"],"raw_segments":[{"start":4468.39,"text":"So that means that you have to basically do a T-square dependency. So in other words, even this matrix itself is a T by T matrix, capital T by capital T matrix, and each of these entry requires some inner product. So I think the dimension, if you still remember the Qis or the QTs are in RdH, and you need to compute T-square of this inner product."},{"start":4496.44,"text":"the number of operations is t squared times dh. Dependence on dh is less relevant, less important to some degree. The dependence on t squared is very important because this means that if you have capital T being a million, it's going to take a million times squared operations which is prohibitive."},{"start":4515.15,"text":"So, and this is one of the issues with the long context issues probably have heard of like, I think we are using chat GPT or Cloud Code, you see the context and after some point they say, let me compact my context. The reason is that you have to shrink the context, otherwise your computational efficiency is too bad. But of course, in the real production system, it's not like all of this capital T is really."},{"start":4538.06,"text":"There are other ways to reduce the dependencies. I think in practice, I don't think necessarily T squared is probably more closer to linear in T because there are other ways, variants of transformers that can reduce the dependency on T. I think after, in the next Wednesday, we're going to discuss a few things that can reduce the dependency on T a little bit. Exactly how we do it."},{"start":4560.23,"text":"We don't really know, in some sense, because there are a lot of open source papers that propose different approach. At least, I don't know exactly which one is used in the open and anthropic. And another thing is that, what is the memory usage here? So the memory usage, at the first side, you have to spend T squared memory, because this matrix itself requires T squared memory."},{"start":4587.74,"text":"But that actually can be reduced because you don't have to actually compute the whole matrix one by one and then do the multiplication with v. So in some sense, to some degree, you can do some part of this matrix and multiply with part of the v first, and then you don't have to save that part of the matrix. You can compute a second part. The idea is called flash retention, probably you have heard of, which is a way to reduce the memory."},{"start":4613.82,"text":"a free footprint in these systems. But some of these ideas do have a trade-off because when you reduce the, for example, if you change your architecture to make the dependency on T squared better, for example, we'll discuss some of this on Wednesday. So if you change the architecture, the dependency on T is better, but your architecture is less expressive, and then you may lose some performance to some degree."},{"start":4643.08,"text":"OK. Sounds good. Thank you."}],"speech_gaps":[],"frame":"../frames/v041/027.webp","frame_time":4480.39}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
