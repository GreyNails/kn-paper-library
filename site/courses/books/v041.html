e, then it's not true that the t-th output only depends on everything before it. There's no this kind of like a auto-requestive kind of like properties yet, right? Because the output at time t depends on everything."},{"start":3646.84,"text":"It depends on V capital T, even the last input. V capital T is a function of the last input. So an output at time T depends on the input, depends on VT and it depends on HT in. So basically, there's no kind of like this dependency. So then what you do is you say, introduce the concept of masking to make sure that there's no,"},{"start":3674.99,"text":"this kind of wrong dependency you want. So basically, what you really want to do is that you just, in some sense, for h little t, you want to delete everything after time t. So basically, let's say, before you have this pt vt plus"},{"start":3699.42,"text":"PT, T, VT, PT, capital T, V, capital T. So basically, you said these dependencies are invalid for me, so I just don't have them. So basically, you just delete all of this. And then you renormalize this piece so that the sum of this piece got normalized to one. So it's still a linear combination or convex combination of the V1 up to VT. So that's pretty much what you do. So you just say if the dependency is not good, you just, in some sense, mask them out."},{"start":3729.01,"text":"And mathematically, what you do, actually also implementation-wise, what you do is through this masking, which means that you add a masking here. Maybe let's use a different color too. So you add a masking here. I need a different, better color. So you add a mask here."},{"start":3766.29,"text":"so that you can mask out the, let me see, you can mask out half of this matrix. So you have like a Q1K1 transpose, Q1K2 transpose, so on and so forth. And Q1K2 transpose is not valid in some sense because you are looking, you are attending to something you shouldn't attend. Q1 shouldn't be able to see K2. So basically you add this masking matrix. What you add is that you add,"}],"speech_gaps":[],"frame":"../frames/v041/022.webp","frame_time":3631.19},{"title":"Transformer 中的注意力掩码机制","segments":[{"id":301,"text":"minus infinity, you add minus infinity here. And for q1k3 transpose, you also add minus infinity, so on and so forth. And then in the next row, you have q2k1 transpose, which is good. You have q2k2 transpose, which is good. And you have q2k3 transpose, which is not good. So you add minus infinity here, so on and so forth. So basically, everything here will be","zh":"减去无穷大，你在这里加上减去无穷大。对于 q1k3 的转置，你也加上减去无穷大，依此类推。在下一行，你有 q2k1 的转置，这是好的。你有 q2k2 的转置，这也是好的。你有 q2k3 的转置，这是不好的。因此，你在这里加上减去无穷大，依此类推。基本上，这里的所有内容都会","start":3796.4,"end":3827.7},{"id":302,"text":"adding additional minus infinity. So basically, this upper triangle part of this matrix will be all minus infinity. By adding minus infinity, it just means that you turn it into minus infinity. Any number added by minus infinity is the minus infinity. And then what happens is that, in other words, it's kind of like you are just trying to add all of minus infinity to all of this part.","zh":"添加额外的减去无穷大。基本上，这个矩阵的上三角部分都会是减去无穷大。通过添加减去无穷大，意思就是将它变为减去无穷大。任何数加上减去无穷大都是减去无穷大。然后会发生的是，换句话说，这就像你试图将所有这些部分都加上减去无穷大。","start":3828.21,"end":3852.97},{"id":303,"text":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,","zh":"当你将所有这些变为减去无穷大时，在进行 softmax 操作时，这部分就不会改变。这里的“这部分”指的是时间 t 之后的所有内容，对吧？所以时间 t 之后的所有内容，你将其变为减去无穷大。在进行 softmax 操作后，它们会变成 0。这是因为指数函数的减去无穷大次方基本上是 0。因此，在这个 p 中，时间 t 之后的所有内容，","start":3853.79,"end":3884.58},{"id":304,"text":"everything after q will become 0, and the sum of the rest will be 1. So that's exactly how you achieve this, because basically the leading combination of the rest of the terms doesn't matter because their coefficients are 0. We are masking this because in this autoregressive model, you don't allow the output at time t to depend on anything that is after t. So you have to respect this kind of like a sequential dependency.","zh":"时间 q 之后的所有内容都会变成 0，其余部分的总和为 1。这就是你实现这一点的方式，因为其余项的组合基本上不重要，因为它们的系数为 0。我们进行这种掩码是因为在这个自回归模型中，不允许时间 t 的输出依赖于时间 t 之后的内容。因此，你必须尊重这种顺序依赖关系。","start":3888.29,"end":3921.68},{"id":305,"text":"In generation, you are not able to see the future tokens to generate a current token. So every token can only depends on things before it. So that's why we have to mask it out. We are almost done here. So this is the so-called single-head attention. We have to make it more complicated to even finish the attention part.","zh":"在生成过程中，你无法看到未来的 token 来生成当前的 token。因此，每个 token 只能依赖于它之前的内容。因此，我们必须进行这种掩码。我们几乎完成了。这就是所谓的单头注意力。为了完成注意力部分，我们必须让它更加复杂。","start":3924.12,"end":3957.13}],"notes":["本段讲解了Transformer中注意力机制的掩码操作，通过将上三角部分的值设为负无穷，确保在计算注意力权重时，每个位置只能关注其前面的token。这是为了模拟自回归模型中，当前token不能依赖于未来token的特性。","在计算softmax时，所有被设为负无穷的值会变成0，而其余值的总和为1。这种操作确保了注意力权重只考虑当前token之前的上下文信息。","这种掩码机制是自回归模型（如语言模型）中不可或缺的一部分，因为它保证了生成过程中的因果性，即当前token的生成仅依赖于之前生成的token。","在实际实现中，这种掩码通常通过在注意力矩阵中添加负无穷值来实现，从而在softmax计算中忽略这些位置。","单头注意力（single-head attention）是Transformer模型的基础部分，后续会进一步扩展为多头注意力（multi-head attention）以增强模型的表达能力。","通过这种掩码机制，Transformer能够有效地处理序列数据，同时保持模型的因果性，这是其在自然语言处理任务中取得成功的关键原因之一。"],"formulas":[{"latex":"e^{-\\infty} = 0","symbols":"指数函数在负无穷处的值为0","explanation":"该公式正确描述了指数函数在负无穷处的极限行为，符合数学定义。","evidence":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"latex":"softmax(x) = \\frac{e^{x_i}}{\\sum_j e^{x_j}}","symbols":"softmax函数将输入转换为概率分布","explanation":"该公式正确描述了softmax函数的定义，适用于将任意实数向量转换为概率分布。","evidence":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"latex":"\\sum_{i} p_i = 1","symbols":"softmax输出的概率总和为1","explanation":"该公式正确描述了softmax函数输出的概率分布的归一化性质。","evidence":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"}],"uncertainties":[],"diagram":"none","start":3796.4,"end":3957.13,"asr_flags":[],"math_clarifications":["原文中提到的'adding minus infinity'和'everything after t'等描述，虽然没有直接转化为数学公式，但它们与softmax函数的性质和应用相关，因此在数学上是合理的。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3796.4,"text":"minus infinity, you add minus infinity here. And for q1k3 transpose, you also add minus infinity, so on and so forth. And then in the next row, you have q2k1 transpose, which is good. You have q2k2 transpose, which is good. And you have q2k3 transpose, which is not good. So you add minus infinity here, so on and so forth. So basically, everything here will be"},{"start":3828.21,"text":"adding additional minus infinity. So basically, this upper triangle part of this matrix will be all minus infinity. By adding minus infinity, it just means that you turn it into minus infinity. Any number added by minus infinity is the minus infinity. And then what happens is that, in other words, it's kind of like you are just trying to add all of minus infinity to all of this part."},{"start":3853.79,"text":"And then when you turn all of this into minus infinity, when you do the softmax, this part just doesn't change. By this part, I mean everything after t, right? So everything after little t, you turn them into minus infinity. And after you do the softmax, they become 0. So because exponential to the minus infinity becomes basically 0. So that's why in this p, so everything after ptt,"},{"start":3888.29,"text":"everything after q will become 0, and the sum of the rest will be 1. So that's exactly how you achieve this, because basically the leading combination of the rest of the terms doesn't matter because their coefficients are 0. We are masking this because in this autoregressive model, you don't allow the output at time t to depend on anything that is after t. So you have to respect this kind of like a sequential dependency."},{"start":3924.12,"text":"In generation, you are not able to see the future tokens to generate a current token. So every token can only depends on things before it. So that's why we have to mask it out. We are almost done here. So this is the so-called single-head attention. We have to make it more complicated to even finish the attention part."}],"speech_gaps":[{"start":3922.08,"end":3923.72}],"frame":"../frames/v041/023.webp","frame_time":3808.4},{"title":"Transformer 中的多头注意力机制","segments":[{"id":306,"text":"Then, what we do next is that, maybe let's erase here. So, in some sense, what we are doing here is that we have H1 in and HT in, and we go through this single head attention. I guess in the node, I call it attention 1H, and you get this H1 out up to HT out. That's what we defined so far.","zh":"接下来，我们做的事情可能是在这里擦除。从某种意义上说，我们在这里所做的就是，我们有 H1 输入和 HT 输入，并通过这个单头注意力机制。我想在节点中，我称之为注意力 1H，然后你得到 H1 输出到 HT 输出。这就是我们到目前为止所定义的内容。","start":3958.83,"end":3998.18},{"id":307,"text":"In practice, you have multiple copies of","zh":"在实践中，你会有多个这种单头注意力的副本，","start":4000.32,"end":4002.66},{"id":308,"text":"this single-head attention with different weight matrices.","zh":"每个副本使用不同的权重矩阵。","start":4002.66,"end":4006.56},{"id":309,"text":"So you get another copy of the single-head attention.","zh":"因此，你会得到另一个单头注意力的副本。","start":4006.84,"end":4010.1},{"id":310,"text":"Maybe let's call this single-head attention one,","zh":"也许我们可以称这个单头注意力为第一个，","start":4011.66,"end":4015.06},{"id":311,"text":"this is called single-head attention two,","zh":"这个被称为单头注意力第二个，","start":4015.18,"end":4017.02},{"id":312,"text":"and they have the same input,","zh":"它们有相同的输入，","start":4017.2,"end":4021.62},{"id":313,"text":"and then you get another copy of the output.","zh":"然后你会得到另一个输出的副本。","start":4022.24,"end":4026.12},{"id":314,"text":"But here, by copy, I don't really mean literally copy,","zh":"但在这里，我说的复制并不是字面上的复制，","start":4028.04,"end":4030.78},{"id":315,"text":"because then it's not useful.","zh":"因为那样的话就没有用了。","start":4030.96,"end":4031.98},{"id":316,"text":"So the difference between this and this","zh":"所以这个和那个的区别","start":4032.58,"end":4034.96},{"id":317,"text":"is that the weight matrices are different.","zh":"是权重矩阵不同。","start":4034.96,"end":4039.52},{"id":318,"text":"So basically, this WQ, WKWV, for these two copies","zh":"所以基本上，对于这两个复制，WQ、WK、WV","start":4039.72,"end":4045.68},{"id":319,"text":"So that's why they're not really literally copies.","zh":"这就是为什么它们并不是真正意义上的复制。","start":4045.68,"end":4047.18},{"id":320,"text":"So that's why they're not really literally copies.","zh":"这就是为什么它们并不是真正意义上的复制。","start":4047.42,"end":4049.62},{"id":321,"text":"They are just like you have another version of it.","zh":"它们只是你拥有另一个版本。","start":4049.78,"end":4053.88},{"id":322,"text":"So in some sense,","zh":"所以在某种意义上，","start":4062.34,"end":4063.44},{"id":323,"text":"you should index this by something else","zh":"你应该用其他方式来索引它","start":4063.5,"end":4064.86},{"id":324,"text":"because the output will be different.","zh":"因为输出将会不同。","start":4064.86,"end":4066.0},{"id":325,"text":"So maybe you should index this by,","zh":"因此，也许你应该用，","start":4066.16,"end":4067.44},{"id":326,"text":"let's say this is because this is the first attention,","zh":"比如说，这是因为这是第一次注意力，","start":4071.36,"end":4074.24},{"id":327,"text":"you say H11 and HT1 and this is H12, HT2.","zh":"你说 H11 和 HT1，而这是 H12，HT2。","start":4074.36,"end":4078.72},{"id":328,"text":"2 and you also have another one and you get H1,","zh":"2，你还有另一个，你会得到 H1，","start":4078.72,"end":4082.32},{"id":329,"text":"3 up to HT, 3.","zh":"3 直到 HT，3。","start":4083.16,"end":4085.32},{"id":330,"text":"So we have so many copies,","zh":"所以我们有这么多的副本，","start":4087.1,"end":4089.4},{"id":331,"text":"you have several sequences of vectors,","zh":"你有几组向量序列，","start":4089.54,"end":4091.62},{"id":332,"text":"but eventually you only want one sequence of vectors.","zh":"但最终你只想要一个向量序列。","start":4091.88,"end":4094.22},{"id":333,"text":"So you have to combine them in some way.","zh":"因此，你必须以某种方式将它们结合起来。","start":4094.4,"end":4095.94},{"id":334,"text":"The way to combine them is that you concatenate these three things.","zh":"将它们结合起来的方法是将这三个部分连接起来。","start":4096.56,"end":4106.22},{"id":335,"text":"things, so you concatenate h11 out, h12 out, h1.","zh":"这些部分，所以你连接 h11 的输出、h12 的输出和 h1。","start":4106.22,"end":4117.56},{"id":336,"text":"I think each of these is called one head.","zh":"我认为每个这样的部分都被称为一个头。","start":4117.86,"end":4121.12},{"id":337,"text":"So you have, let's say, nh head.","zh":"因此，我们可以说有 nh 个头。","start":4121.36,"end":4124.26},{"id":338,"text":"So this is a tension n sub h.","zh":"所以这是n乘以h。","start":4125.32,"end":4129.02},{"id":339,"text":"So you concatenate all of these vectors,","zh":"所以你将所有这些向量连接起来，","start":4129.88,"end":4132.04},{"id":340,"text":"vectors and then you multiply that with another projection matrix,","zh":"然后将这个结果与另一个投影矩阵相乘，","start":4132.04,"end":4137.12}],"notes":["本段讲解了Transformer模型中多头注意力机制的基本概念。讲者指出，单头注意力机制中，输入H1和HT经过单头注意力处理后得到输出H1和HT。在实际应用中，会使用多个不同的权重矩阵来实现多个单头注意力机制，这些机制虽然结构相似，但权重矩阵不同，因此不能简单地视为复制。","讲者进一步说明，为了区分不同的单头注意力机制，需要对它们进行索引。例如，第一个注意力机制的输出可以表示为H11和HT1，第二个为H12和HT2，以此类推。最终，所有这些注意力机制的输出会被拼接在一起，形成一个单一的向量序列。","讲者提到，拼接后的向量序列需要通过另一个投影矩阵进行处理，以生成最终的输出。每个注意力机制被称为一个“head”，而整个模型中通常包含多个这样的head，即nh个head。","讲者强调，虽然多个单头注意力机制的结构相似，但由于权重矩阵不同，它们的输出结果也会不同。因此，需要通过索引来区分不同的注意力机制，并在最终输出时将它们合并。","讲者还提到，最终的输出是通过将所有注意力机制的输出拼接在一起，然后乘以一个投影矩阵得到的。这一步骤是Transformer模型中实现多头注意力机制的关键部分。","讲者指出，多头注意力机制的设计使得模型能够从不同的表示空间中提取信息，从而提高模型的表达能力。这种机制在自然语言处理任务中被广泛应用。"],"formulas":[],"uncertainties":["tension n sub h"],"diagram":"none","start":3958.83,"end":4137.12,"asr_flags":[334],"boards":[],"translation_complete":true,"translated_segments":35,"raw_segments":[{"start":3958.83,"text":"Then, what we do next is that, maybe let's erase here. So, in some sense, what we are doing here is that we have H1 in and HT in, and we go through this single head attention. I guess in the node, I call it attention 1H, and you get this H1 out up to HT out. That's what we defined so far."},{"start":4000.32,"text":"In practice, you have multiple copies of"},{"start":4002.66,"text":"this single-head attention with different weight matrices."},{"start":4006.84,"text":"So you get another copy of the single-head attention."},{"start":4011.66,"text":"Maybe let's call this single-head attention one,"},{"start":4015.18,"text":"this is called single-head attention two,"},{"start":4017.2,"text":"and they have the same input,"},{"start":4022.24,"text":"and then you get another copy of the output."},{"start":4028.04,"text":"But here, by copy, I don't really mean literally copy,"},{"start":4030.96,"text":"because then it's not useful."},{"start":4032.58,"text":"So the difference between this and this"},{"start":4034.96,"text":"is that the weight matrices are different."},{"start":4039.72,"text":"So basically, this WQ, WKWV, for these two copies"},{"start":4045.68,"text":"of the tension are different."},{"start":4047.42,"text":"So that's why they're not really literally copies."},{"start":4049.78,"text":"They are just like you have another version of it."},{"start":4062.34,"text":"So in some sense,"},{"start":4063.5,"text":"you should index this by something else"},{"start":4064.86,"text":"because the output will be different."},{"start":4066.16,"text":"So maybe you should index this by,"},{"start":4071.36,"text":"let's say this is because this is the first attention,"},{"start":4074.36,"text":"you say H11 and HT1 and this is H12, HT2."},{"start":4078.72,"text":"2 and you also have another one and you get H1,"},{"start":4083.16,"text":"3 up to HT, 3."},{"start":4087.1,"text":"So we have so many copies,"},{"start":4089.54,"text":"you have several sequences of vectors,"},{"start":4091.88,"text":"but eventually you only want one sequence of vectors."},{"start":4094.4,"text":"So you have to combine them in some way."},{"start":4096.56,"text":"The way to combine them is that you concatenate these three things."},{"start":4106.22,"text":"things, so you concatenate h11 out, h12 out, h1."},{"start":4117.86,"text":"I think each of these is called one head."},{"start":4121.36,"text":"So you have, let's say, nh head."},{"start":4125.32,"text":"So this is a tension n sub h."},{"start":4129.88,"text":"So you concatenate all of these vectors,"},{"start":4132.04,"text":"vectors and then you multiply that with another projection matrix,"}],"speech_gaps":[{"start":4055.024,"end":4058.192}],"frame":"../frames/v041/024.webp","frame_time":3970.83},{"title":"Transformer 与多头注意力机制","segments":[{"id":341,"text":"and then this will give you the final h, the output.","zh":"然后这将给你最终的 h，也就是输出。","start":4137.84,"end":4142.44},{"id":342,"text":"So that's the final output at position one. You do the same thing for position two where you concatenate maybe these guys, and then you do a projection, you get the output at position two. So in some sense, this is just give you more power to compute different kind of tension.","zh":"因此，这是位置一的最终输出。你对位置二做同样的事情，也许将这些元素连接起来，然后进行投影，得到位置二的输出。从某种意义上说，这仅仅是你计算不同类型张力的更强能力。","start":4145.13,"end":4171.24},{"id":343,"text":"And the intuition is that maybe each of these single-head attention is doing some special type of job. For example, maybe here it's trying to find out which entity in the past passage","zh":"直觉上，也许每个单头注意力都在执行某种特定类型的任务。例如，也许这里它试图找出过去段落中对我重要的实体，","start":4172.04,"end":4187.28},{"id":344,"text":"matters to me and here this is trying to find out what are the sentiment of the past passages and which part of the sentiment matters to me, so on and so forth. So each of these attention probably pay attention to different type of information and then eventually aggregate the outcome of all of this information into one big vector and you project it into a single output. Cool.","zh":"而这里则试图找出过去段落的情感是什么，以及哪部分情感对我重要，依此类推。因此，每个注意力机制可能关注不同类型的信息，最终将所有这些信息的结果聚合为一个大的向量，然后将其投影到一个单一的输出中。酷。","start":4187.93,"end":4219.23},{"id":345,"text":"No, no, they are all parallel, yes. They are parallel, and then you aggregate. And all of this is in one of this. So basically, in one of this, you have multiple parallel heads, and then next round, you have another number of parallel heads. I think the number of heads is maybe on the order of maybe at most 100, I guess. Let me think about this.","zh":"不，不，它们都是并行的，对吧。它们是并行的，然后进行聚合。所有这些都发生在同一个结构中。因此，基本上，在同一个结构中，你有多个并行的头，然后下一轮你又有另一个数量的并行头。我想头的数量可能在某个数量级上，也许最多是 100，我猜。让我想想这个。","start":4224.77,"end":4255.07},{"id":346,"text":"Something on that order, I think. Yeah. One more question. It also depends on the model size, of course, right? I think the biggest one, I don't know. I don't know whether a hundred is for which model size. I think maybe for like a 100 billion parameter model, so you have a hundred heads. Yeah. I mean, you said you have multiple heads because just to have bigger . Yeah. I mean, if you have like a bigger weight matrix, then you can use that bigger weight matrix.","zh":"大概在那个数量级上，我想。是的。还有一个问题。当然，这也取决于模型的大小，对吧？我想最大的那个，我不知道。我不知道一百是否对应哪种模型规模。我想可能对于一个 1000 亿参数的模型，你有 100 个头。是的。我的意思是，你说你有多个头，仅仅是为了拥有更大的权重矩阵。是的。我的意思是，如果你有一个更大的权重矩阵，那么你就可以使用这个更大的权重矩阵。","start":4257.1,"end":4287.63}],"notes":["本段讲解了Transformer模型中多头注意力机制的基本概念，指出每个单头注意力可能负责不同的任务，例如识别过去文本中对当前任务重要的实体或情感信息。通过多个注意力头的并行处理，模型能够捕捉更丰富的上下文信息，并将这些信息聚合为一个向量，最终输出结果。","讲者提到多头注意力机制中，每个注意力头可能专注于不同的信息类型，例如实体识别或情感分析。这种设计使得模型能够更全面地理解输入文本，从而提高整体性能。","讲者进一步解释了多头注意力机制的结构，指出多个注意力头是并行处理的，并且在模型中可能有多个这样的并行头。这种设计允许模型在不同的层次上处理信息，从而增强其表达能力。","讲者提到注意力头的数量通常在100左右，但具体数量取决于模型的规模。例如，一个拥有1000亿参数的模型可能会使用100个注意力头。这种设计使得模型能够利用更大的权重矩阵，从而提升性能。","讲者指出，使用多个注意力头的主要目的是为了增加模型的表达能力，通过更大的权重矩阵来捕捉更复杂的模式。这种设计在实践中被广泛采用，以提高模型的泛化能力和准确性。","讲者最后提到，注意力头的数量和模型规模之间存在一定的关系，但具体数值可能因模型而异。这种设计使得模型能够灵活适应不同的任务和数据规模。"],"formulas":[],"uncertainties":["bigger ."],"diagram":"none","start":4137.84,"end":4287.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4137.84,"text":"and then this will give you the final h, the output."},{"start":4145.13,"text":"So that's the final output at position one. You do the same thing for position two where you concatenate maybe these guys, and then you do a projection, you get the output at position two. So in some sense, this is just give you more power to compute different kind of tension. In some sense, I think actually in practice if you"},{"start":4172.04,"text":"And the intuition is that maybe each of these single-head attention is doing some special type of job. For example, maybe here it's trying to find out which entity in the past passage"},{"start":4187.93,"text":"matters to me and here this is trying to find out what are the sentiment of the past passages and which part of the sentiment matters to me, so on and so forth. So each of these attention probably pay attention to different type of information and then eventually aggregate the outcome of all of this information into one big vector and you project it into a single output. Cool."},{"start":4224.77,"text":"No, no, they are all parallel, yes. They are parallel, and then you aggregate. And all of this is in one of this. So basically, in one of this, you have multiple parallel heads, and then next round, you have another number of parallel heads. I think the number of heads is maybe on the order of maybe at most 100, I guess. Let me think about this."},{"start":4257.1,"text":"Something on that order, I think. Yeah. One more question. It also depends on the model size, of course, right? I think the biggest one, I don't know. I don't know whether a hundred is for which model size. I think maybe for like a 100 billion parameter model, so you have a hundred heads. Yeah. I mean, you said you have multiple heads because just to have bigger . Yeah. I mean, if you have like a bigger weight matrix, then you can use that bigger weight matrix."}],"speech_gaps":[{"start":4222.672,"end":4224.37}],"frame":"../frames/v041/025.webp","frame_time":4149.84},{"title":"Transformer 与上下文学习中的残差连接与归一化","segments":[{"id":347,"text":"Yeah, I think, I don't know exactly what's your proposal, but maybe this sounds like a simplified answer, but many of these proposals have been considered in various ways, and some of them are for, on most of our efficiency perspectives, because eventually you can just have, as we discussed, if you really don't care about efficiency, you can just have a generic.","zh":"是的，我想，我不知道你的具体建议是什么，但也许这听起来像是一个简化的答案，但很多这样的建议已经被以各种方式考虑过了，其中一些是出于我们大多数效率视角的考虑，因为最终，如果你真的不关心效率，你只需要一个通用的。","start":4295.78,"end":4317.92},{"id":348,"text":"very gigantic networks by all of these special structures to try to use your parameters in the right way so that you can use it more efficiently in some sense. So I guess let's just give me two or three minutes to talk about some very quick things.","zh":"通过所有这些特殊结构来构建非常巨大的网络，试图以正确的方式使用你的参数，以便在某种意义上更高效地使用它们。所以我想让我花两到三分钟谈谈一些非常快速的内容。","start":4318.57,"end":4347.93},{"id":349,"text":"One thing is that actually when I draw this, it's actually a bit more complicated than just doing this. So because there's also a residual part in this how to combine MLP with attention. So actually what you really do is that you say you apply. So after you do the attention, you do some normalization here.","zh":"其中一件事是，当我画这个图时，实际上比仅仅这样做要复杂一些。这是因为在这个如何将MLP与注意力结合的问题中，也存在一个残差部分。实际上，你真正做的是，你应用注意力，然后在这里进行归一化。","start":4349.69,"end":4380.12},{"id":350,"text":"So there's a normalization layer. Often, this is using the RSM norm that we briefly discussed involved in the network section. Then you apply MLP and then you add the residuals back to this. You resume the network that we discussed. Then you go to the next layer. There are different ways to add the residuals. You can add the residuals after you do the attention or before you do the attention. So there's something called","zh":"因此，这里有一个归一化层。通常，这使用的是我们在网络部分简要讨论过的RSM归一化。然后你应用MLP，然后将残差加回到这个结果中。你恢复我们讨论过的网络。然后你进入下一层。添加残差的方式有多种，你可以在进行注意力之后或之前添加残差。因此，有一种叫做","start":4381.32,"end":4407.44},{"id":351,"text":"pre-norm and post-norm things. So I guess the details, you can check out the lecture notes. So there's some kind of like others on how you, when you apply a normalization with issues and attention, so on and so forth.","zh":"前归一化和后归一化的东西。所以我想细节部分，你可以查看讲义。还有一些关于如何在应用归一化和注意力时处理问题的其他方法。","start":4408.07,"end":4429.09},{"id":352,"text":"we should try to quickly think about the computational efficiency here and the memory footprint. So how many operations we have to do, especially as a function of t.","zh":"我们应该快速思考一下这里的计算效率和内存占用。我们需要执行多少操作，特别是作为t的函数。","start":4429.78,"end":4441.58},{"id":353,"text":"As a function of other things, it's actually relatively easier because as a function of the number of parameters, all of those, it's all multiplicative and linear in some sense. The main important thing is, what is the dependency on T? You can see that for each of the T's position, you have to compute all of these inner products. So for each of the position, you have to compute capital T inner product, and you have capital T of these positions.","zh":"作为其他因素的函数，实际上相对更容易，因为作为参数数量的函数，所有这些操作都是乘法和线性的。最重要的问题是，它对T的依赖是什么？你可以看到，对于每个T的位置，你都需要计算所有这些内积。因此，对于每个位置，你都需要计算大写T个内积，并且有大写T个这样的位置。","start":4442.56,"end":4467.4}],"notes":["本段主要讲解Transformer架构中残差连接（residual connection）和归一化（normalization）的实现方式。讲者指出，Transformer的结构比简单的注意力机制更复杂，因为需要将多层感知机（MLP）与注意力机制结合，并通过残差连接将结果反馈到网络中。归一化层通常使用RMSNorm，这是在课程中提到的网络部分简要讨论过的内容。","讲者提到残差连接可以在注意力机制之后或之前添加，这对应了pre-norm和post-norm两种方式。这些细节建议查阅课程讲义。此外，讲者强调了在后续课程中从系统机器学习（system ML）视角分析Transformer时，需要关注计算效率和内存占用。","在计算效率方面，讲者指出计算量主要取决于序列长度T。对于每个位置，都需要计算T个内积，因此总共有T²个内积操作。这表明Transformer的计算复杂度与序列长度的平方成正比，这在处理长序列时可能带来较大的计算负担。","讲者还提到，计算量与参数数量的关系相对简单，因为参数数量的增加通常会导致乘法和线性增长的计算量。然而，序列长度T的依赖关系更为关键，因为其影响是平方级别的，这在实际应用中需要特别注意。","讲者通过内积操作的计算量来说明Transformer的复杂度，这与注意力机制中计算查询、键和值之间的相似度有关。这种计算方式在处理长序列时可能成为性能瓶颈，因此需要优化策略，如使用稀疏注意力或分块处理。","最后，讲者强调了在分析Transformer时，需要从计算效率和内存占用两个角度出发，这为后续课程中讨论系统层面的优化提供了基础。"],"formulas":[],"uncertainties":["RSM norm的具体实现细节未明确","pre-norm和post-norm的定义和区别未完全澄清","讲者提到的'capital T inner product'是否指T个内积操作，还是T²个内积操作，存在歧义"],"diagram":"none","start":4295.78,"end":4467.4,"asr_flags":[],"math_clarifications":["原文提到计算复杂度与序列长度T的平方成正比，但未明确说明该复杂度是计算操作还是内存开销。因此，无法确定该公式是否准确反映原文内容，需进一步核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4295.78,"text":"Yeah, I think, I don't know exactly what's your proposal, but maybe this sounds like a simplified answer, but many of these proposals have been considered in various ways, and some of them are for, on most of our efficiency perspectives, because eventually you can just have, as we discussed, if you really don't care about efficiency, you can just have a generic."},{"start":4318.57,"text":"very gigantic networks by all of these special structures to try to use your parameters in the right way so that you can use it more efficiently in some sense. So I guess let's just give me two or three minutes to talk about some very quick things."},{"start":4349.69,"text":"One thing is that actually when I draw this, it's actually a bit more complicated than just doing this. So because there's also a residual part in this how to combine MLP with attention. So actually what you really do is that you say you apply. So after you do the attention, you do some normalization here."},{"start":4381.32,"text":"So there's a normalization layer. Often, this is using the RSM norm that we briefly discussed involved in the network section. Then you apply MLP and then you add the residuals back to this. You resume the network that we discussed. Then you go to the next layer. There are different ways to add the residuals. You can add the residuals after you do the attention or before you do the attention. So there's something called"},{"start":4408.07,"text":"pre-norm and post-norm things. So I guess the details, you can check out the lecture notes. So there's some kind of like others on how you, when you apply a normalization with issues and attention, so on and so forth. Finally, I think one important thing, especially for the next lecture about the system ML perspective is that,"},{"start":4429.78,"text":"we should try to quickly think about the computational efficiency here and the memory footprint. So how many operations we have to do, especially as a function of t."},{"start":4442.56,"text":"As a function of other things, it's actually relatively easier because as a function of the number of parameters, all of those, it's all multiplicative and linear in some sense. The main important thing is, what is the dependency on T? You can see that for each of the T's position, you have to compute all of these inner products. So for each of the position, you have to compute capital T inner product, and you have capital T of these positions."}],"speech_gaps":[],"frame":"../frames/v041/026.webp","frame_time":4307.78},{"title":"Transformer 的上下文长度与计算复杂度","segments":[{"id":354,"text":"So that means that you have to basically do a T-square dependency. So in other words, even this matrix itself is a T by T matrix, capital T by capital T matrix, and each of these entry requires some inner product. So I think the dimension, if you still remember the Q is or the QTs are in RdH, and you need to compute T-square of this inner product.","zh":"这意味着你基本上必须进行一个与T平方相关的依赖关系。换句话说，即使这个矩阵本身是一个T乘T的矩阵，大写T乘大写T的矩阵，每个元素都需要进行一个内积运算。我认为维度方面，如果你还记得Q或者是QTs是在RdH空间中，你需要计算这个内积的T平方。","start":4468.39,"end":4495.02},{"id":355,"text":"The number of operations is t squared times dh. Dependence on dh is less relevant, less important to some degree. The dependence on t squared is very important because this means that if you have capital T being a million, it's going to take a million times squared operations which is prohibitive.","zh":"操作的数量是t平方乘以dh。对dh的依赖程度相对不那么重要，某种程度上来说不太相关。而对t平方的依赖则非常重要，因为这意味着如果你有大写T等于一百万，那么就需要一百万平方次操作，这显然是不可行的。","start":4496.44,"end":4514.28},{"id":356,"text":"So, and this is one of the issues with the long context issues probably have heard of like, I think we are using chat GPT or Cloud Code, you see the context and after some point they say, let me compact my context. The reason is that you have to shrink the context, otherwise your computational efficiency is too bad. But of course, in the real production system, it's not like all of this capital T is really.","zh":"因此，这也是长上下文问题之一。你可能听说过，比如我们使用Chat GPT或者Cloud Code，你会看到上下文，之后在某个点他们会说，让我压缩我的上下文。原因是你必须缩小上下文，否则计算效率会非常差。当然，在实际的生产系统中，并不是所有的大写T都真的会达到那么大。","start":4515.15,"end":4537.63},{"id":357,"text":"There are other ways to reduce the dependencies. I think in practice, I don't think necessarily T squared is probably more closer to linear in T because there are other ways, variants of transformers that can reduce the dependency on T. I think after, in the next Wednesday, we're going to discuss a few things that can reduce the dependency on T a little bit. Exactly how we do it.","zh":"还有其他方法可以减少这些依赖关系。我认为在实践中，我不认为T平方一定更接近于T的线性关系，因为还有其他方法，一些Transformer的变种可以减少对T的依赖。我认为在下个星期三，我们将讨论一些可以稍微减少对T依赖的方法，具体如何操作。","start":4538.06,"end":4559.76},{"id":358,"text":"We don't really know, in some sense, because there are a lot of open source papers that propose different approach. At least, I don't know exactly which one is used in the open and anthropic. And another thing is that, what is the memory usage here? So the memory usage, at the first side, you have to spend T squared memory, because this matrix itself requires T squared memory.","zh":"在某种意义上，我们并不真正知道，因为有很多开源论文提出了不同的方法。至少，我不清楚具体哪些方法被Open和Anthropic使用。另一个问题是，这里的内存使用情况是怎样的？内存使用方面，首先你必须花费T平方的内存，因为这个矩阵本身需要T平方的内存。","start":4560.23,"end":4586.89},{"id":359,"text":"But that actually can be reduced because you don't have to actually compute the whole matrix one by one and then do the multiplication with v. So in some sense, to some degree, you can do some part of this matrix and multiply with part of the v first, and then you don't have to save that part of the matrix. You can compute a second part. The idea is called flash retention, probably you have heard of, which is a way to reduce the memory.","zh":"但实际上，这可以被减少，因为你不需要逐个计算整个矩阵，然后再与向量 v 相乘。从某种意义上说，在某种程度上，你可以先计算矩阵的一部分，并与向量 v 的一部分相乘，之后你不需要保存该部分矩阵。你可以计算第二部分。这个想法被称为 flash retention，你可能听说过，这是一种减少内存使用的方法。","start":4587.74,"end":4612.18},{"id":360,"text":"A free footprint in these systems. But some of these ideas do have a trade-off because when you reduce the, for example, if you change your architecture to make the dependency on T squared better, for example, we'll discuss some of this on Wednesday. So if you change the architecture, the dependency on T is better, but your architecture is less expressive, and then you may lose some performance to some degree.","zh":"这些系统中存在一些自由空间。但其中一些想法确实存在权衡，例如，当你减少计算复杂度时，比如如果你改变架构以使对 T 平方的依赖更好，例如，我们将在周三讨论其中的一些内容。因此，如果你改变架构，对 T 的依赖会更好，但你的架构表达能力会降低，从而在某种程度上损失一些性能。","start":4613.82,"end":4642.26},{"id":361,"text":"OK. Sounds good. Thank you.","zh":"好的，听起来不错。谢谢。","start":4643.08,"end":4644.54}],"notes":["本段主要讨论Transformer模型中上下文长度对计算复杂度的影响。具体来说，当处理长度为T的上下文时，计算复杂度与T的平方成正比，这导致当T很大时（如百万级别），计算量会变得非常大，从而影响模型的效率。","为了应对这一问题，实际应用中会通过压缩上下文来减少计算量。例如，像Chat GPT或Cloud Code这样的系统会在上下文过长时提示用户压缩上下文。此外，还存在其他方法，如通过改进Transformer的变体来降低对T的依赖。","在实际应用中，虽然T的平方复杂度是主要问题，但通过一些优化方法，如Flash Attention，可以减少内存使用。这些方法通常涉及分阶段计算注意力矩阵，从而避免存储整个矩阵。","然而，这些优化方法通常伴随着一定的权衡。例如，改变模型架构以降低对T的依赖可能会导致模型表达能力下降，从而影响性能。","最后，课程提到将在接下来的课程中进一步讨论这些优化方法的具体实现方式，包括如何在不牺牲模型性能的前提下减少计算复杂度。","总体而言，本段强调了Transformer模型在处理长上下文时面临的计算和内存挑战，并介绍了可能的解决方案及其权衡。"],"formulas":[{"latex":"O(T^2 \\times d_h)","symbols":"计算复杂度与上下文长度T的平方和隐藏层维度d_h成正比","explanation":"该公式正确表达了计算复杂度与上下文长度T的平方和隐藏层维度d_h的正比关系，符合原文中提到的T平方乘以dh的计算复杂度。","evidence":"the number of operations is t squared times dh. Dependence on dh is less relevant, less important to some degree. The dependence on t squared is very important because this means that if you have capital T being a million, it's going to take a million times squared operations which is prohibitive."}],"uncertainties":["T squared"],"diagram":"none","start":4468.39,"end":4644.54,"asr_flags":[],"math_clarifications":["原文中提到的T平方乘以dh的计算复杂度是正确的，但未明确说明这是时间复杂度还是空间复杂度。根据上下文，此处应为时间复杂度，因此公式保持不变。"],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4468.39,"text":"So that means that you have to basically do a T-square dependency. So in other words, even this matrix itself is a T by T matrix, capital T by capital T matrix, and each of these entry requires some inner product. So I think the dimension, if you still remember the Qis or the QTs are in RdH, and you need to compute T-square of this inner product."},{"start":4496.44,"text":"the number of operations is t squared times dh. Dependence on dh is less relevant, less important to some degree. The dependence on t squared is very important because this means that if you have capital T being a million, it's going to take a million times squared operations which is prohibitive."},{"start":4515.15,"text":"So, and this is one of the issues with the long context issues probably have heard of like, I think we are using chat GPT or Cloud Code, you see the context and after some point they say, let me compact my context. The reason is that you have to shrink the context, otherwise your computational efficiency is too bad. But of course, in the real production system, it's not like all of this capital T is really."},{"start":4538.06,"text":"There are other ways to reduce the dependencies. I think in practice, I don't think necessarily T squared is probably more closer to linear in T because there are other ways, variants of transformers that can reduce the dependency on T. I think after, in the next Wednesday, we're going to discuss a few things that can reduce the dependency on T a little bit. Exactly how we do it."},{"start":4560.23,"text":"We don't really know, in some sense, because there are a lot of open source papers that propose different approach. At least, I don't know exactly which one is used in the open and anthropic. And another thing is that, what is the memory usage here? So the memory usage, at the first side, you have to spend T squared memory, because this matrix itself requires T squared memory."},{"start":4587.74,"text":"But that actually can be reduced because you don't have to actually compute the whole matrix one by one and then do the multiplication with v. So in some sense, to some degree, you can do some part of this matrix and multiply with part of the v first, and then you don't have to save that part of the matrix. You can compute a second part. The idea is called flash retention, probably you have heard of, which is a way to reduce the memory."},{"start":4613.82,"text":"a free footprint in these systems. But some of these ideas do have a trade-off because when you reduce the, for example, if you change your architecture to make the dependency on T squared better, for example, we'll discuss some of this on Wednesday. So if you change the architecture, the dependency on T is better, but your architecture is less expressive, and then you may lose some performance to some degree."},{"start":4643.08,"text":"OK. Sounds good. Thank you."}],"speech_gaps":[],"frame":"../frames/v041/027.webp","frame_time":4480.39}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v041.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
