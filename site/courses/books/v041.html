</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】Transformer 与上下文学习 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v041.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v041","title":"【斯坦福CS229】Transformer 与上下文学习","course":"机器学习","pages":[{"title":"Transformer 与上下文学习","segments":[{"id":0,"text":"Today, we are going to move to a sequence of lectures on","zh":"今天，我们将进入一系列关于","start":5.23,"end":9.93},{"id":1,"text":"large language models, not many, probably three, four.","zh":"大语言模型的讲座，大概不会太多，可能三、四个。","start":9.93,"end":13.23},{"id":2,"text":"In between, we also have to talk","zh":"在这些讲座之间，我们还需要稍微谈谈","start":13.73,"end":15.29},{"id":3,"text":"about reinforcement learning a little bit because otherwise,","zh":"强化学习，否则，","start":15.29,"end":17.33},{"id":4,"text":"we cannot talk about some of the modern reasoning models","zh":"我们无法在不理解一些强化学习知识的情况下，","start":17.45,"end":20.83},{"id":5,"text":"without understanding a little bit about reinforcement learning.","zh":"讨论某些现代推理模型。","start":20.83,"end":23.19},{"id":6,"text":"So that's pretty much the rest of the lecture","zh":"因此，这基本上就是接下来的讲座内容","start":23.77,"end":25.43},{"id":7,"text":"except two guest lectures.","zh":"除了两次特邀讲座之外。","start":25.43,"end":27.39},{"id":8,"text":"I think the upcoming Monday,","zh":"我认为下周一会有Simran给我们讲系统机器学习的内容，","start":27.57,"end":30.63},{"id":9,"text":"we'll have Simran to give us a lecture on system ML,","zh":"这也将涉及相当多的Transformer相关内容，","start":30.71,"end":34.07},{"id":10,"text":"which is also quite about transformers,","zh":"比如如何在GPU上优化Transformer的效率等。","start":34.07,"end":37.25},{"id":11,"text":"like how do you optimize the efficiency of transformers","zh":"如何在GPU上优化Transformer的效率等。","start":37.31,"end":39.73},{"id":12,"text":"on a GPU, so on and so forth.","zh":"所以，大语言模型。","start":39.73,"end":40.75},{"id":13,"text":"Okay, sounds good.","zh":"我想你们大概率都会，","start":42.75,"end":43.75},{"id":14,"text":"So, large-language models.","zh":"我猜你们大概率都会，","start":43.89,"end":45.31},{"id":15,"text":"I guess you always, probably all of you","zh":"我想你们大概率一直都是这样","start":45.55,"end":47.19},{"id":16,"text":"have heard of this word, large-language models.","zh":"你们可能听说过这个词，大语言模型。","start":47.19,"end":50.39},{"id":17,"text":"This is precisely, I think, in some sense,","zh":"我认为，从某种意义上说，这就是","start":50.59,"end":54.05},{"id":18,"text":"this is all starting from GPT-3","zh":"这一切都始于 GPT-3","start":54.09,"end":55.77},{"id":19,"text":"when OpenAI released GPT-3.","zh":"当 OpenAI 发布 GPT-3 时。","start":55.77,"end":58.07},{"id":20,"text":"It has, it uses this new paradigm","zh":"它采用了，它使用了这种新的范式","start":58.71,"end":61.29},{"id":21,"text":"them which use auto-regressive large-language models.","zh":"这些使用自回归大语言模型的方法。","start":61.29,"end":64.53},{"id":22,"text":"So basically, we're going to focus on that,","zh":"基本上，我们将专注于这个，","start":66.05,"end":67.77},{"id":23,"text":"auto-regressive large-language models.","zh":"自回归大语言模型。","start":67.85,"end":69.65},{"id":24,"text":"We're going to skip some of the earlier versions of","zh":"我们将跳过一些早期的Transformer版本","start":69.79,"end":71.93},{"id":25,"text":"transformer which are not auto-regressive.","zh":"这些版本不具备自回归特性","start":71.93,"end":74.95},{"id":26,"text":"Auto-regressive basically means that you generate tokens one by one,","zh":"自回归基本上意味着你逐个生成标记","start":78.73,"end":81.63},{"id":27,"text":"and each of the new tokens depends on","zh":"每个新生成的标记都依赖于","start":81.69,"end":83.47},{"id":28,"text":"the previous tokens and you do this,","zh":"之前的标记，并且你这样做","start":83.47,"end":84.87},{"id":29,"text":"and you model probability in this auto-regressive way.","zh":"并以自回归的方式建模概率","start":85.43,"end":88.65},{"id":30,"text":"I'm going to talk more about details.","zh":"我将更详细地讲解这些细节","start":88.79,"end":90.07},{"id":31,"text":"In some sense, you model your language distribution by using a sequential model one by one, in some sense.","zh":"某种意义上，你通过逐个使用序列模型来建模语言分布","start":90.07,"end":98.37},{"id":32,"text":"Anyway, so I think the point, our goal is to talk about some details.","zh":"总之，我认为重点是，我们的目标是讨论一些细节。","start":99.15,"end":104.69},{"id":33,"text":"So I'll fill in more high-level stuff as we talk about the details.","zh":"因此，在讨论细节的过程中，我会补充更多高层次的内容。","start":104.79,"end":107.53},{"id":34,"text":"So the first thing we're going to talk about is tokenization.","zh":"因此，我们首先要讨论的是分词。","start":108.21,"end":110.45},{"id":35,"text":"This is just to prepare us to talk about the real meat in some sense. So what does tokenization mean? It means that you need to","zh":"这仅仅是为了让我们准备好讨论一些真正核心的内容。那么分词是什么意思？这意味着你需要","start":113.78,"end":121.92},{"id":36,"text":"These transformers, they are numerical architecture models. So they take in, in some sense, numerical numbers. But you have text. And how do you turn text into some kind of things that the models can understand? So the first step is to tokenize. Tokenize means that you need to decide what is the smallest unit of the input you give to the large language model. And often it's not a word. The most natural thing you can think of is,","zh":"这些变压器，它们是数值架构模型。因此，它们在某种意义上接受数值输入。但你有文本。你如何将文本转换成模型能够理解的某种形式？因此，第一步是分词。分词意味着你需要决定你给大语言模型的输入的最小单位是什么。通常它不是一个词。你最自然的联想可能是，","start":122.86,"end":151.54},{"id":37,"text":"maybe a small thing is a character or a word. If you use character level tokenization, then the issue is that often you have so many characters. You need so many tokens, so many steps. If you use word level tokenization, then often the issue is that you don't","zh":"也许最小的单位是一个字符或一个词。如果你使用字符级别的分词，那么问题是你经常会有太多字符。你需要太多的标记，太多的步骤。如果你使用词级别的分词，那么通常的问题是你不会","start":151.77,"end":167.75}],"notes":["本段介绍了大语言模型（large-language models）的背景，指出其起源于OpenAI发布的GPT-3，并强调了自回归（auto-regressive）模型的重要性。讲者提到，自回归模型是通过逐个生成token，并且每个新token依赖于之前的token来建模语言概率分布。"],"formulas":[],"uncertainties":["them which use auto-regressive large-language models"],"diagram":"none","start":5.23,"end":167.75,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":38,"raw_segments":[{"start":5.23,"text":"Today, we are going to move to a sequence of lectures on"},{"start":9.93,"text":"large language models, not many, probably three, four."},{"start":13.73,"text":"In between, we also have to talk"},{"start":15.29,"text":"about reinforcement learning a little bit because otherwise,"},{"start":17.45,"text":"we cannot talk about some of the modern reasoning models"},{"start":20.83,"text":"without understanding a little bit about reinforcement learning."},{"start":23.77,"text":"So that's pretty much the rest of the lecture"},{"start":25.43,"text":"except two guest lectures."},{"start":27.57,"text":"I think the upcoming Monday,"},{"start":30.71,"text":"we'll have Simran to give us a lecture on system ML,"},{"start":34.07,"text":"which is also quite about transformers,"},{"start":37.31,"text":"like how do you optimize the efficiency of transformers"},{"start":39.73,"text":"on a GPU, so on and so forth."},{"start":42.75,"text":"Okay, sounds good."},{"start":43.89,"text":"So, large-language models."},{"start":45.55,"text":"I guess you always, probably all of you"},{"start":47.19,"text":"have heard of this word, large-language models."},{"start":50.59,"text":"This is precisely, I think, in some sense,"},{"start":54.09,"text":"this is all starting from GPT-3"},{"start":55.77,"text":"when OpenAI released GPT-3."},{"start":58.71,"text":"It has, it uses this new paradigm"},{"start":61.29,"text":"them which use auto-regressive large-language models."},{"start":66.05,"text":"So basically, we're going to focus on that,"},{"start":67.85,"text":"auto-regressive large-language models."},{"start":69.79,"text":"We're going to skip some of the earlier versions of"},{"start":71.93,"text":"transformer which are not auto-regressive."},{"start":78.73,"text":"Auto-regressive basically means that you generate tokens one by one,"},{"start":81.69,"text":"and each of the new tokens depends on"},{"start":83.47,"text":"the previous tokens and you do this,"},{"start":85.43,"text":"and you model probability in this auto-regressive way."},{"start":88.79,"text":"I'm going to talk more about details."},{"start":90.07,"text":"In some sense, you model your language distribution by using a sequential model one by one, in some sense."},{"start":99.15,"text":"Anyway, so I think the point, our goal is to talk about some details."},{"start":104.79,"text":"So I'll fill in more high-level stuff as we talk about the details."},{"start":108.21,"text":"So the first thing we're going to talk about is tokenization."},{"start":113.78,"text":"This is just to prepare us to talk about the real meat in some sense. So what does tokenization mean? It means that you need to"},{"start":122.86,"text":"These transformers, they are numerical architecture models. So they take in, in some sense, numerical numbers. But you have text. And how do you turn text into some kind of things that the models can understand? So the first step is to tokenize. Tokenize means that you need to decide what is the smallest unit of the input you give to the large language model. And often it's not a word. The most natural thing you can think of is,"},{"start":151.77,"text":"maybe a small thing is a character or a word. If you use character level tokenization, then the issue is that often you have so many characters. You need so many tokens, so many steps. If you use word level tokenization, then often the issue is that you don't"}],"speech_gaps":[{"start":75.35,"end":78.33}],"frame":"../frames/v041/001.webp","frame_time":17.23},{"title":"子词分词与词汇表构建","segments":[{"id":38,"text":"how do you deal with this long word, which are very rare? For example, you have a word called, say, internationalization. So if you treat this word as a single word, then maybe it's too rare, and you don't leverage your understanding about other words. So if you treat internationalization as one word, then it is different from internationalized. It's different from a nation. And they are all completely different things, and you cannot leverage.","zh":"你如何处理这个很长且非常罕见的单词？例如，你有一个叫做国际化的单词，比如说internationalization。如果你把这个单词当作一个单独的单词，那么可能它太罕见了，你无法利用你对其他单词的理解。如果你把internationalization当作一个单词，那么它与internationalized不同，也与nation不同，它们都是完全不同的东西，你无法利用这些信息。","start":168.01,"end":194.55},{"id":39,"text":"that for example, if you understand internationalized, then you should probably understand internationalization to some degree without even seeing more data. So that's why people don't use word tokenization. Maybe let me give you another example. For example, if you use this, I guess in my notes, there is this word LM.","zh":"例如，如果你理解了internationalized，那么你可能在没有看到更多数据的情况下，也能在某种程度上理解internationalization。这就是为什么人们不使用单词标记化。也许我可以再举一个例子。例如，如果你使用这个，我想在我的笔记中有一个叫做LM的单词。","start":196.41,"end":216.65},{"id":40,"text":"Actually, I don't know whether this is a real word. I think it's a new word that is completely new word. Nobody have used it before 2020, I guess. So even right now, it's not that common. If you have to treat this word as a unit, then you have to see this word enough times to understand what it means. However, if you treat it as subwords, then maybe you have a token called ILM. You have a token which is","zh":"实际上，我不确定这个是否是一个真实的单词。我认为这是一个全新的单词，没有人在此之前使用过，大概是在2020年之后才出现的。所以即使现在，它也不是很常见。如果你必须把这个单词当作一个单位，那么你必须看到这个单词足够多次才能理解它的意思。然而，如果你把它当作子词，那么你可能有一个叫做ILM的标记。你有一个叫做","start":218.79,"end":246.35},{"id":41,"text":"you have two units, this is a token, this is a token. So IOM is a token, IMPfication is a token. Then in some sense, you have seen IOMs many, many times, you all understand it. Then IMPfication has a special meaning in English, and then you combine these two understanding, you understand the word. So that's much more efficient understanding of the word than just treating this whole thing as a single unit.","zh":"你有两个单位，这是一个标记，这是一个标记。所以IOM是一个标记，IMPfication是一个标记。在某种意义上，你已经看到了很多次IOM，你都理解它。IMPfication在英语中有特殊的含义，然后你将这两个理解结合起来，你就理解了这个单词。因此，这种理解方式比仅仅把这个整体当作一个单位要高效得多。","start":246.92,"end":271.02},{"id":42,"text":"So, and this happens more often in, for example, biology when you have this very long word, or maybe in German you have very long word, but actually they are fundamentally many combinations of many sub-words. Using sub-word tokenization allows you to understand each of the sub-words, and then you can understand the combination of those sub-words as a whole very efficiently. So basically, tokenization just means that you have a predefined vocabulary,","zh":"因此，这种情况在例如生物学中更为常见，当你有一个非常长的单词，或者在德语中你有非常长的单词，但实际上它们都是许多子词的基本组合。使用子词标记化可以让你理解每个子词，然后你可以非常高效地理解这些子词的组合。因此，基本上，标记化意味着你有一个预定义的词汇表，","start":272.76,"end":300.44},{"id":43,"text":"vocabulary and this vocabulary is a list of subwords. So for example, you can have many of this, like maybe A is a subword, is one of the token. I think maybe like a dog is a token.","zh":"词汇表以及这个词汇表是一个子词列表。因此，例如，你可以拥有许多这样的子词，比如 A 是一个子词，是其中一个标记。我想可能像 a dog 这样的词也是一个标记。","start":303.35,"end":314.86},{"id":44,"text":"Pretty much all common words these days is a token. Actually, you can play with the tokenization online. If you search OpenAI tokenizer, OpenAI give you a playground where you can see how the texts are tokenized. You'll find that actually, blank dog is also a token.","zh":"如今几乎所有常见的单词都是一个标记。实际上，你可以在网上尝试标记化。如果你搜索 OpenAI 的 tokenizer，OpenAI 会给你一个游乐场，你可以看到文本是如何被标记化的。你会发现实际上，空白狗（blank dog）也是一个标记。","start":316.13,"end":333.19}],"notes":["本段讨论了子词分词（sub-word tokenization）在处理罕见长词时的优势。例如，像 'internationalization' 这样的长词，如果作为单一词处理，由于出现频率低，难以利用其他相关词的语义信息。而通过子词分词，可以将长词拆分为更常见的子词，如 'international' 和 'ization'，从而更高效地理解和学习该词。","讲者指出，子词分词允许模型利用已有的子词知识，而不是将整个长词视为一个独立单元。例如，'internationalization' 可以被拆分为 'international' 和 'ization'，而 'international' 可能已经出现在大量文本中，因此模型可以利用其语义信息。","讲者以 'LM' 为例，说明这是一个在2020年前未被广泛使用的新词。如果将其作为单一词处理，需要大量数据才能理解其含义；而通过子词分词，可以将其拆分为 'L' 和 'M'，从而利用已有的子词知识。","讲者提到，子词分词在处理像生物学或德语等语言中的长词时特别有用，因为这些词通常由多个子词组成。通过子词分词，模型可以更高效地学习和理解这些长词。","讲者指出，子词分词的词汇表是预定义的，包含一系列子词。例如，'dog' 可能是一个子词，而 'blank dog' 也可能被作为单独的词进行分词。","最后，讲者提到可以在线使用 OpenAI 的 tokenizer 工具来观察文本如何被分词，例如 'blank dog' 也可能被作为单独的词进行处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":168.01,"end":333.19,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":168.01,"text":"how do you deal with this long word, which are very rare? For example, you have a word called, say, internationalization. So if you treat this word as a single word, then maybe it's too rare, and you don't leverage your understanding about other words. So if you treat internationalization as one word, then it is different from internationalized. It's different from a nation. And they are all completely different things, and you cannot leverage."},{"start":196.41,"text":"that for example, if you understand internationalized, then you should probably understand internationalization to some degree without even seeing more data. So that's why people don't use word tokenization. Maybe let me give you another example. For example, if you use this, I guess in my notes, there is this word LM."},{"start":218.79,"text":"Actually, I don't know whether this is a real word. I think it's a new word that is completely new word. Nobody have used it before 2020, I guess. So even right now, it's not that common. If you have to treat this word as a unit, then you have to see this word enough times to understand what it means. However, if you treat it as subwords, then maybe you have a token called ILM. You have a token which is"},{"start":246.92,"text":"you have two units, this is a token, this is a token. So IOM is a token, IMPfication is a token. Then in some sense, you have seen IOMs many, many times, you all understand it. Then IMPfication has a special meaning in English, and then you combine these two understanding, you understand the word. So that's much more efficient understanding of the word than just treating this whole thing as a single unit."},{"start":272.76,"text":"So, and this happens more often in, for example, biology when you have this very long word, or maybe in German you have very long word, but actually they are fundamentally many combinations of many sub-words. Using sub-word tokenization allows you to understand each of the sub-words, and then you can understand the combination of those sub-words as a whole very efficiently. So basically, tokenization just means that you have a predefined vocabulary,"},{"start":303.35,"text":"vocabulary and this vocabulary is a list of subwords. So for example, you can have many of this, like maybe A is a subword, is one of the token. I think maybe like a dog is a token."},{"start":316.13,"text":"Pretty much all common words these days is a token. Actually, you can play with the tokenization online. If you search OpenAI tokenizer, OpenAI give you a playground where you can see how the texts are tokenized. You'll find that actually, blank dog is also a token."}],"speech_gaps":[],"frame":"../frames/v041/002.webp","frame_time":180.01},{"title":"Transformer 与上下文学习中的分词机制","segments":[{"id":45,"text":"So the blank is actually merged with Doug as a token. And you have so many of this. Typically, this kind of tokenization right now, I think for the open source models, we know the number of tokens they have. I think it's often on the order of 10 to the 5, like 100k at least. I think QN 3.5, this is the newest version of the open source models, which are pretty good. I think they have like 250 tokens.","start":335.76,"end":359.88},{"id":46,"text":"I think 250 probably is mostly because I think 250 is somehow you can represent this token with maybe.","start":361.32,"end":367.82},{"id":47,"text":"eight bytes in some sense. It also depends on how many bits you can present the tokens. Anyway, so you have this vocabulary and then you just give it a long string of text. You just take all the subwords that are tokens and you turn it into a sequence of segments. For example, if you have a dog runs,","start":369.18,"end":391.38},{"id":48,"text":"Suppose this is the text you see, and then you'll say this is a token, so this is one part. Then I think blank dog is a token, and blank runs is also a token, and comma I think is a token by itself. Every token has an ID. So let's say A is probably the ID number one, dog is maybe the ID number like 356, whatever, and run is some ID.","start":392.11,"end":418.05},{"id":49,"text":"Maybe 250. I'm just writing some random numbers. Everything has an ID. So basically, you turn every text into a sequence of IDs. Each ID corresponds to one token. So in this case, most of these words are actually one token. I think I just checked recently, if you have the word happiness, I think the tokenization will be unhappiness, let's say. I think this part is a token. H is a token.","start":419.86,"end":447.83},{"id":50,"text":"A-P-I-N-E-S-S is a token for some reason. Maybe another example is this. I already read it that IOM identification. This is another example we come up with. I don't know actually what this word means if you have a blast.","start":448.91,"end":466.67},{"id":51,"text":"I think this part is a token, this part is a token, and this part is token. I think this is just because for this biological words, biomedical words, actually every part of the word has some special meaning, and so you tokenize them into tokens. And what is the exact vocabulary? It depends on the model.","start":467.53,"end":485.77},{"id":52,"text":"So basically, the algorithm that turns the text into these tokens is called a tokenizer. And every model has a different tokenizer. Not everyone has a different one. Some of them share the same tokenizers. But generally, it's specific to the tokenizer, to the model.","start":487.12,"end":502.86},{"id":53,"text":"and different companies have","start":503.73,"end":505.01},{"id":54,"text":"different proprietary tokenization approach.","start":505.01,"end":508.17},{"id":55,"text":"You've probably heard of that recently,","start":508.61,"end":510.23},{"id":56,"text":"I think Cloud Code.","start":510.49,"end":511.39},{"id":57,"text":"Cloud, they update their tokenizers so that,","start":511.99,"end":514.37}],"notes":["本段讲解了分词（tokenization）的基本概念，即如何将文本转换为一系列的token。每个token都有一个唯一的ID，用于表示不同的词汇或子词。例如，像'blank dog'或'blank runs'这样的组合可能被当作一个token处理，而像逗号这样的标点符号也可能被单独作为一个token。","讲者提到，当前开源模型的token数量通常在10^5量级，即至少10万。例如，QN 3.5版本的模型有约250个token，这可能是因为每个token可以使用8个字节来表示，但具体取决于模型如何编码token。","讲者还举了几个例子，如'hapiness'可能被拆分为'unhappiness'、'H'、'A-P-I-N-E-S-S'等不同的token，这说明某些词汇可能被拆分成多个token，特别是生物医学领域的词汇，每个部分都有特殊含义。","分词器（tokenizer）是将文本转换为token序列的算法，每个模型可能有不同的分词器。虽然有些模型可能共享相同的分词器，但大多数情况下，分词器是特定于模型的。","讲者提到，不同公司可能采用不同的专有分词方法，例如Cloud Code可能更新其分词器以优化性能。","讲者在最后提到，分词器的更新可能与模型的优化有关，但具体细节未展开。"],"formulas":[],"uncertainties":["I think 250 probably is mostly because I think 250 is somehow you can represent this token with maybe.","Maybe 250. I'm just writing some random numbers. Everything has an ID.","I think this part is a token, this part is a token, and this part is token.","and different companies have","different proprietary tokenization approach.","I think Cloud Code."],"diagram":"none","start":335.76,"end":514.37,"asr_flags":[],"boards":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":335.76,"text":"So the blank is actually merged with Doug as a token. And you have so many of this. Typically, this kind of tokenization right now, I think for the open source models, we know the number of tokens they have. I think it's often on the order of 10 to the 5, like 100k at least. I think QN 3.5, this is the newest version of the open source models, which are pretty good. I think they have like 250 tokens."},{"start":361.32,"text":"I think 250 probably is mostly because I think 250 is somehow you can represent this token with maybe."},{"start":369.18,"text":"eight bytes in some sense. It also depends on how many bits you can present the tokens. Anyway, so you have this vocabulary and then you just give it a long string of text. You just take all the subwords that are tokens and you turn it into a sequence of segments. For example, if you have a dog runs,"},{"start":392.11,"text":"Suppose this is the text you see, and then you'll say this is a token, so this is one part. Then I think blank dog is a token, and blank runs is also a token, and comma I think is a token by itself. Every token has an ID. So let's say A is probably the ID number one, dog is maybe the ID number like 356, whatever, and run is some ID."},{"start":419.86,"text":"Maybe 250. I'm just writing some random numbers. Everything has an ID. So basically, you turn every text into a sequence of IDs. Each ID corresponds to one token. So in this case, most of these words are actually one token. I think I just checked recently, if you have the word happiness, I think the tokenization will be unhappiness, let's say. I think this part is a token. H is a token."},{"start":448.91,"text":"A-P-I-N-E-S-S is a token for some reason. Maybe another example is this. I already read it that IOM identification. This is another example we come up with. I don't know actually what this word means if you have a blast."},{"start":467.53,"text":"I think this part is a token, this part is a token, and this part is token. I think this is just because for this biological words, biomedical words, actually every part of the word has some special meaning, and so you tokenize them into tokens. And what is the exact vocabulary? It depends on the model."},{"start":487.12,"text":"So basically, the algorithm that turns the text into these tokens is called a tokenizer. And every model has a different tokenizer. Not everyone has a different one. Some of them share the same tokenizers. But generally, it's specific to the tokenizer, to the model."},{"start":503.73,"text":"and different companies have"},{"start":505.01,"text":"different proprietary tokenization approach."},{"start":508.61,"text":"You've probably heard of that recently,"},{"start":510.49,"text":"I think Cloud Code."},{"start":511.99,"text":"Cloud, they update their tokenizers so that,"}],"speech_gaps":[],"frame":"../frames/v041/003.webp","frame_time":347.76},{"title":"Transformer 与上下文学习","segments":[{"id":58,"text":"I think they make the tokenizers more granular to some degree,","zh":"我认为他们让分词器更加细致一些。","start":514.91,"end":517.97},{"id":59,"text":"so that the same amount of tax will be tokenized into more tokens.","zh":"这样同样的税收会被分词成更多的标记。","start":518.13,"end":521.79},{"id":60,"text":"So before it's just 1,000 tokens,","zh":"以前只是1,000个标记，","start":522.05,"end":523.63},{"id":61,"text":"now it's 1.5 thousand tokens.","zh":"现在则是1.5千个标记。","start":523.73,"end":524.79},{"id":62,"text":"I didn't verify it myself,","zh":"我没有自己验证过，","start":526.03,"end":527.37},{"id":63,"text":"but I read some news about this.","zh":"但我读到过一些关于这个的新闻。","start":527.55,"end":528.65},{"id":64,"text":"Assuming they are true, that means that you spend more tokens,","zh":"假设这些信息是真的，这意味着你花费更多的标记，","start":528.85,"end":532.09},{"id":65,"text":"because you pay more to Cloud Code with the same amount of tax.","zh":"因为你用同样的税收支付给Cloud Code的费用更多了。","start":532.09,"end":536.83},{"id":66,"text":"Anyway, so cool.","zh":"无论如何，这真的很酷。","start":537.51,"end":540.01},{"id":67,"text":"There are some details about how to come up with","zh":"有一些关于如何提出","start":541.17,"end":544.17},{"id":68,"text":"the vocabulary and how to run this algorithm to tokenize.","zh":"词汇以及如何运行这个算法来进行分词的细节。","start":544.17,"end":549.07},{"id":69,"text":"The keyword is called BPE tokenizer byte pair encoding.","zh":"这个关键词叫做BPE分词器，即字节对编码。","start":549.33,"end":558.71},{"id":70,"text":"So I'm not going through the details because this is","zh":"所以我不会深入细节，因为这只是一个","start":559.11,"end":561.29},{"id":71,"text":"is just a very small, quick setup.","zh":"非常小、快速的设置。","start":561.29,"end":563.77},{"id":72,"text":"It's not that important.","zh":"这并不那么重要。","start":564.29,"end":565.45},{"id":73,"text":"But roughly speaking, the BP tokenization idea is that you try to,","zh":"但大致来说，BPE分词的思想是尝试去，","start":565.73,"end":569.79},{"id":74,"text":"in some sense, you just try to find","zh":"在某种意义上，你只是试图找到","start":569.85,"end":571.15},{"id":75,"text":"frequent sub-words that are most frequent,","zh":"最频繁出现的子词，","start":571.15,"end":574.09},{"id":76,"text":"and you use them in the vocabulary.","zh":"并将它们用于词汇表中。","start":574.23,"end":576.71},{"id":77,"text":"But how do you decide which one is more frequent and not?","zh":"但你如何决定哪一个更频繁呢？","start":577.09,"end":579.37},{"id":78,"text":"I think there's a sequential algorithm.","zh":"我想存在一个序列算法。","start":579.51,"end":581.07},{"id":79,"text":"You first go through maybe the smallest combinations of like, you go through all the characters and","zh":"你首先可能从最小的组合开始，比如你遍历所有字符，","start":581.31,"end":588.57},{"id":80,"text":"you go through all the characters and","zh":"你遍历所有字符，","start":588.63,"end":590.21},{"id":81,"text":"I think it's a greedy algorithm. First, you try to find the most frequent one character thing, and you find the most frequent combination of two characters, and you remove. It's a little complicated, which I mean, I'll try to give you a precise version, but it's like a greedy algorithm that decides which one is more frequent, so on and so forth. If you are interested, you can look up the exact algorithm.","zh":"我想这是一个贪心算法。首先，你尝试找到最频繁的单个字符，然后找到最频繁的两个字符组合，并将其移除。这有点复杂，我的意思是，我会尝试给你一个精确的版本，但它是类似于贪心算法，决定哪一个更频繁，依此类推。如果你感兴趣，可以查阅确切的算法。","start":590.21,"end":591.45},{"id":82,"text":"I think it's a greedy algorithm. First, you try to find the most frequent one character thing, and you find the most frequent combination of two characters, and you remove. It's a little complicated, which I mean, I'll try to give you a precise version, but it's like a greedy algorithm that decides which one is more frequent, so on and so forth. If you are interested, you can look up the exact algorithm.","zh":"我认为这可能是一个贪心算法。首先，你尝试找到出现频率最高的单个字符，然后找到出现频率最高的两个字符组合，并将其移除。这有点复杂，我的意思是，我会尝试给出一个精确的版本，但大致上这是一个贪心算法，它决定哪一个更频繁，依此类推。如果你感兴趣，可以查阅确切的算法。","start":592.01,"end":614.05},{"id":83,"text":"Okay. So that's the tokenization. So that means that from now on, we just assume we have a tokenizer. So every piece of text will be turned into a sequence of tokens. So from now on, a text just means a sequence of tokens, and each of this Xi is in a vocabulary. Let's call the vocabulary V.","zh":"好的。所以这就是分词的过程。这意味着从现在开始，我们假设已经有一个分词器。所以每一段文本都会被转换成一个标记序列。从现在开始，文本就表示一个标记序列，而每个Xi都属于一个词汇表。让我们称这个词汇表为V。","start":615.7,"end":635.5},{"id":84,"text":"And the size of the vocabulary could be like 250,000. And each of this is kind of like an index in the vocabulary, like this is the fifth token, this is the 150th token, so on and so forth.","zh":"词汇表的大小可能像250,000这样。而每个标记都类似于词汇表中的一个索引，比如这个是第五个标记，这个是第150个标记，依此类推。","start":636.93,"end":650.65},{"id":85,"text":"So now we go into the next question,","zh":"现在我们进入下一个问题，","start":651.48,"end":656.2},{"id":86,"text":"How do we create a probabilistic model to model it?","zh":"我们如何创建一个概率模型来建模它？","start":656.34,"end":659.72},{"id":87,"text":"How do we create a probabilistic model to model it?","zh":"我们如何创建一个概率模型来建模它？","start":659.96,"end":662.86},{"id":88,"text":"So the number of possible combinations is, you have v choice.","zh":"可能的组合数量是，你有v种选择。","start":663.08,"end":667.78},{"id":89,"text":"like how many possible combinations that are possible here.","zh":"这里有多少种可能的组合。","start":668.0,"end":671.32},{"id":90,"text":"So the number of possible combinations is,","zh":"因此，可能的组合数量是，","start":671.54,"end":673.72},{"id":91,"text":"and v to the power of t is the total number of choices.","zh":"并且 v 的 t 次方是总的选择数量。","start":673.84,"end":675.82},{"id":92,"text":"This is the cardinality of v. You have v choice,","zh":"这是 v 的基数。你有 v 种选择，","start":676.68,"end":679.0},{"id":93,"text":"for each of the tokens and you have a sequence of last t,","zh":"对于每个标记，你有一个长度为 t 的序列，","start":679.0,"end":685.14},{"id":94,"text":"so you take the power to the t, right?","zh":"因此，你取 v 的 t 次方，对吧？","start":685.3,"end":686.88},{"id":95,"text":"So everyone has v choice","zh":"所以每个人都有 v 种选择","start":686.98,"end":689.94},{"id":96,"text":"and v to the power of t is the total number of choices.","zh":"并且 v 的 t 次方是总的选择数量。","start":689.94,"end":692.56}],"notes":["本段主要讲解了tokenization的过程，特别是BPE（Byte Pair Encoding）算法。讲者提到，BPE是一种贪心算法，通过找到最频繁的字符组合来构建词汇表。虽然讲者没有详细展开算法步骤，但指出其核心思想是基于频率选择子词。"],"formulas":[],"uncertainties":["v to the power of t is the total number of choices."],"diagram":"none","start":514.91,"end":692.56,"asr_flags":[69],"math_clarifications":["原文中提到的公式v^t用于计算可能的token序列数量，但原文并未明确数学公式，仅描述了概念，因此该公式无法核对，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":514.91,"text":"I think they make the tokenizers more granular to some degree,"},{"start":518.13,"text":"so that the same amount of tax will be tokenized into more tokens."},{"start":522.05,"text":"So before it's just 1,000 tokens,"},{"start":523.73,"text":"now it's 1.5 thousand tokens."},{"start":526.03,"text":"I didn't verify it myself,"},{"start":527.55,"text":"but I read some news about this."},{"start":528.85,"text":"Assuming they are true, that means that you spend more tokens,"},{"start":532.09,"text":"because you pay more to Cloud Code with the same amount of tax."},{"start":537.51,"text":"Anyway, so cool."},{"start":541.17,"text":"There are some details about how to come up with"},{"start":544.17,"text":"the vocabulary and how to run this algorithm to tokenize."},{"start":549.33,"text":"The keyword is called BPE tokenizer byte pair encoding."},{"start":559.11,"text":"So I'm not going through the details because this is"},{"start":561.29,"text":"is just a very small, quick setup."},{"start":564.29,"text":"It's not that important."},{"start":565.73,"text":"But roughly speaking, the BP tokenization idea is that you try to,"},{"start":569.85,"text":"in some sense, you just try to find"},{"start":571.15,"text":"frequent sub-words that are most frequent,"},{"start":574.23,"text":"and you use them in the vocabulary."},{"start":577.09,"text":"But how do you decide which one is more frequent and not?"},{"start":579.51,"text":"I think there's a sequential algorithm."},{"start":581.31,"text":"You first go through maybe the smallest combinations of like,"},{"start":588.63,"text":"you go through all the characters and"},{"start":590.21,"text":"and you try to find"},{"start":592.01,"text":"I think it's a greedy algorithm. First, you try to find the most frequent one character thing, and you find the most frequent combination of two characters, and you remove. It's a little complicated, which I mean, I'll try to give you a precise version, but it's like a greedy algorithm that decides which one is more frequent, so on and so forth. If you are interested, you can look up the exact algorithm."},{"start":615.7,"text":"Okay. So that's the tokenization. So that means that from now on, we just assume we have a tokenizer. So every piece of text will be turned into a sequence of tokens. So from now on, a text just means a sequence of tokens, and each of this Xi is in a vocabulary. Let's call the vocabulary V."},{"start":636.93,"text":"And the size of the vocabulary could be like 250,000. And each of this is kind of like an index in the vocabulary, like this is the fifth token, this is the 150th token, so on and so forth."},{"start":651.48,"text":"So now we go into the next question,"},{"start":656.34,"text":"which is how do we model this distribution of sequence of tokens?"},{"start":659.96,"text":"How do we create a probabilistic model to model it?"},{"start":663.08,"text":"If you think about the support of this distribution,"},{"start":668.0,"text":"like how many possible combinations that are possible here."},{"start":671.54,"text":"So the number of possible combinations is,"},{"start":673.84,"text":"you have v choice."},{"start":676.68,"text":"This is the cardinality of v. You have v choice,"},{"start":679.0,"text":"for each of the tokens and you have a sequence of last t,"},{"start":685.3,"text":"so you take the power to the t, right?"},{"start":686.98,"text":"So everyone has v choice"},{"start":689.94,"text":"and v to the power of t is the total number of choices."}],"speech_gaps":[],"frame":"../frames/v041/004.webp","frame_time":526.91},{"title":"Transformer 与上下文学习","segments":[{"id":97,"text":"So you cannot assign one probability for each of this sequence,","zh":"因此，你不能为这个序列中的每一个元素分配一个概率，","start":692.9,"end":696.26},{"id":98,"text":"like a discrete categorical tokens,","zh":"比如像离散的类别标记，","start":698.62,"end":702.24},{"id":99,"text":"like categorical distributions, right?","zh":"比如像类别分布，对吧？","start":702.46,"end":704.24},{"id":100,"text":"If you treat this as a categorical distributions,","zh":"如果你把这个视为一个类别分布，","start":704.3,"end":705.86},{"id":101,"text":"distributions, then every choice here will have one probability.","zh":"那么这里的每一个选择都会有一个概率。","start":705.86,"end":709.42},{"id":102,"text":"And that's just way too many parameters to describe it.","zh":"而这需要的参数数量太多了，无法描述它。","start":709.94,"end":712.22},{"id":103,"text":"So that's why what people do is that people decompose","zh":"因此，人们所做的就是利用链式法则来分解","start":712.72,"end":716.06},{"id":104,"text":"this distribution using the chain rule to write it this way.","zh":"这个分布，写成这样的形式。","start":716.06,"end":718.86},{"id":105,"text":"So you say, suppose I have a probability distribution","zh":"所以你说，假设我有一个序列的联合概率分布","start":719.02,"end":721.36},{"id":106,"text":"over the joint of the sequence, then I","zh":"那么我","start":723.66,"end":726.44},{"id":107,"text":"can write it as the following.","zh":"可以将其写成如下形式。","start":726.44,"end":727.68},{"id":108,"text":"So I can say it's equals to p of x1 times p of x2 given x1,","zh":"因此，我可以表示为 p(x₁) 乘以 p(x₂|x₁),","start":727.84,"end":733.52},{"id":109,"text":"p of x3 given x2 and x1, so on and so forth,","zh":"p(x₃|x₂, x₁)，依此类推，","start":733.52,"end":738.64},{"id":110,"text":"and p of xt given x1 up to xt minus 1.","zh":"以及 p(xₜ|x₁ 到 xₜ₋₁)。","start":738.74,"end":742.18},{"id":111,"text":"And this is the so-called conditional probability decomposition. You decompose the joint distribution into a product of conditional probabilities. And you model each of these conditional probabilities. The benefit here is that each of these conditional probabilities is a distribution, is a conditional distribution, but the choice of x2, for example, here is only v.","zh":"这被称为条件概率分解。你将联合分布分解为一系列条件概率的乘积。并且你对每一个条件概率进行建模。这里的优点是，每一个条件概率都是一个分布，是一个条件分布，但例如这里的 x₂ 的选择只有 v 种可能。","start":743.44,"end":767.0},{"id":112,"text":"you'll have v choices here.","zh":"你将有 v 种选择。","start":767.48,"end":768.62},{"id":113,"text":"You only have to have a softmax or logits over v choices for each of this.","zh":"你只需要在每个选项上应用一个softmax或logits即可。","start":768.84,"end":774.88},{"id":114,"text":"So each of this will be eventually you'll see is some kind of like a,","zh":"所以，最终你会看到的是某种类似的东西，","start":775.48,"end":778.5},{"id":115,"text":"you have some logits and you apply some softmax,","zh":"你有一些logits，并应用一些softmax，","start":780.32,"end":782.38},{"id":116,"text":"you get a probability distribution over v choice.","zh":"你就会得到一个在v个选项上的概率分布。","start":782.44,"end":784.92},{"id":117,"text":"So that's what we're going to do.","zh":"这就是我们将要做的事情。","start":785.52,"end":786.88},{"id":118,"text":"So basically, each of this will be parametrized by a new artwork.","zh":"基本上，每个部分都将由一个新的艺术作品参数化。","start":787.72,"end":792.48},{"id":119,"text":"The input will be after the conditioning,","zh":"输入将在条件之后进行，","start":793.36,"end":796.54},{"id":120,"text":"So the input here is the x1 and x2,","zh":"所以这里的输入是x1和x2，","start":796.54,"end":798.44},{"id":121,"text":"and output is the distribution of x3.","zh":"并且输出是 x3 的分布。","start":798.54,"end":800.22},{"id":122,"text":"And this input-output relationship","zh":"这种输入-输出关系","start":800.92,"end":802.34},{"id":123,"text":"is modeled by a neural network, which is a transformer.","zh":"由一个神经网络建模，该神经网络是一个变压器。","start":803.08,"end":807.6},{"id":124,"text":"So that's what we are going towards.","zh":"这就是我们所要走向的方向。","start":809.46,"end":813.22},{"id":125,"text":"How do we model each of these conditional distributions?","zh":"我们如何建模每一个条件分布？","start":813.42,"end":815.34},{"id":126,"text":"So basically, we're going to describe","zh":"基本上，我们将描述","start":819.42,"end":821.18},{"id":127,"text":"a conditional distribution p of p sub theta","zh":"一个条件分布 p 的 p 下标 theta","start":821.18,"end":823.72},{"id":128,"text":"beta Xt given X1 up to Xt minus 1.","zh":"beta Xt 给定 X1 到 Xt 减 1。","start":823.72,"end":827.2},{"id":129,"text":"So before going to details,","zh":"所以在进入细节之前","start":831.8,"end":833.7},{"id":130,"text":"let's treat this as a black box first.","zh":"让我们先把它当作一个黑箱来处理。","start":833.78,"end":836.02},{"id":131,"text":"Let's first discuss a little bit about the boundary in some sense.","zh":"让我们先稍微讨论一下某种意义上的边界问题。","start":836.34,"end":842.48},{"id":132,"text":"It's like there are multiple layers here.","zh":"这里就像是有多个层次一样。","start":842.62,"end":844.56},{"id":133,"text":"So the typical way to parameterize this is the following.","zh":"通常对这种情况的参数化方式如下。","start":844.94,"end":849.24},{"id":134,"text":"So you use a transformer.","zh":"所以你使用一个Transformer模型。","start":849.54,"end":851.38},{"id":135,"text":"So basically, what happens is that you","zh":"基本上，发生的事情是，你","start":851.38,"end":853.08},{"id":136,"text":"have a sequence, x1 up to xt.","zh":"有一个序列，x1到xt。","start":853.08,"end":855.5},{"id":137,"text":"And so first of all, these are discrete IDs, right?","zh":"首先，这些都是离散的ID，对吧？","start":858.08,"end":861.22},{"id":138,"text":"So each of these means an ID for the token.","zh":"每个都代表一个标记的ID。","start":861.28,"end":864.14},{"id":139,"text":"You first have to turn them into some numerical numbers.","zh":"你首先需要将它们转换为一些数值。","start":864.48,"end":867.06},{"id":140,"text":"So the first step is that you say,","zh":"所以第一步是你说，","start":867.68,"end":870.2}],"notes":["本段讨论了如何对序列的概率分布进行建模，指出直接为每个位置分配一个概率会导致参数过多。因此，采用链式法则将联合分布分解为条件概率的乘积，从而减少参数数量。","讲者提到，每个条件概率可以被建模为一个分布，例如通过softmax函数将logits转换为概率分布。这为后续使用Transformer模型建模条件分布奠定了基础。","讲者指出，每个条件分布的输入是前面的序列，输出是当前位置的分布。这种输入-输出关系由Transformer神经网络建模。","讲者提到，序列中的每个元素都是离散的token ID，需要先将其转换为数值形式，这是模型处理序列数据的第一步。","讲者提到，参数化条件分布时，使用了Transformer结构，这表明Transformer模型在处理序列生成任务中的重要性。","讲者提到，模型的参数化过程涉及多个层次，这可能包括Transformer中的多头注意力机制和前馈网络等结构。"],"formulas":[{"latex":"p(x_1, x_2, \\ldots, x_t) = p(x_1) \\times p(x_2 | x_1) \\times p(x_3 | x_1, x_2) \\times \\cdots \\times p(x_t | x_1, \\ldots, x_{t-1})","symbols":"联合分布分解为条件概率的乘积","explanation":"公式正确地使用了链式法则将联合分布分解为条件概率的乘积，每个条件概率项都正确地表示了在给定前面所有变量的情况下当前变量的概率。","evidence":"So you say, suppose I have a probability distribution over the joint of the sequence, then I can write it as the following. So I can say it's equals to p of x1 times p of x2 given x1, p of x3 given x2 and x1, so on and so forth, and p of xt given x1 up to xt minus 1. And this is the so-called conditional probability decomposition. You decompose the joint distribution into a product of conditional probabilities. And you model each of these conditional probabilities. The benefit here is that each of these conditional probabilities is a distribution, is a conditional distribution, but the choice of x2, for example, here is only v."},{"latex":"p(x_t | x_1, \\ldots, x_{t-1})","symbols":"条件分布","explanation":"公式正确地表示了在给定前面所有变量的情况下当前变量的条件分布。","evidence":"How do we model each of these conditional distributions? So basically, we're going to describe a conditional distribution p of p sub theta beta Xt given X1 up to Xt minus 1. So before going to details, let's treat this as a black box first. Let's first discuss a little bit about the boundary in some sense. It's like there are multiple layers here. So the typical way to parameterize this is the following. So you use a transformer. So basically, what happens is that you have a sequence, x1 up to xt. And so first of all, these are discrete IDs, right? So each of these means an ID for the token. You first have to turn them into some numerical numbers. So the first step is that you say,"}],"uncertainties":["parametrized by a new artwork","p of p sub theta beta Xt given X1 up to Xt minus 1"],"diagram":"none","start":692.9,"end":870.2,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均正确，没有发现需要修正的错误。"],"boards":[],"translation_complete":true,"translated_segments":44,"raw_segments":[{"start":692.9,"text":"So you cannot assign one probability for each of this sequence,"},{"start":698.62,"text":"like a discrete categorical tokens,"},{"start":702.46,"text":"like categorical distributions, right?"},{"start":704.3,"text":"If you treat this as a categorical distributions,"},{"start":705.86,"text":"distributions, then every choice here will have one probability."},{"start":709.94,"text":"And that's just way too many parameters to describe it."},{"start":712.72,"text":"So that's why what people do is that people decompose"},{"start":716.06,"text":"this distribution using the chain rule to write it this way."},{"start":719.02,"text":"So you say, suppose I have a probability distribution"},{"start":723.66,"text":"over the joint of the sequence, then I"},{"start":726.44,"text":"can write it as the following."},{"start":727.84,"text":"So I can say it's equals to p of x1 times p of x2 given x1,"},{"start":733.52,"text":"p of x3 given x2 and x1, so on and so forth,"},{"start":738.74,"text":"and p of xt given x1 up to xt minus 1."},{"start":743.44,"text":"And this is the so-called conditional probability decomposition. You decompose the joint distribution into a product of conditional probabilities. And you model each of these conditional probabilities. The benefit here is that each of these conditional probabilities is a distribution, is a conditional distribution, but the choice of x2, for example, here is only v."},{"start":767.48,"text":"you'll have v choices here."},{"start":768.84,"text":"You only have to have a softmax or logits over v choices for each of this."},{"start":775.48,"text":"So each of this will be eventually you'll see is some kind of like a,"},{"start":780.32,"text":"you have some logits and you apply some softmax,"},{"start":782.44,"text":"you get a probability distribution over v choice."},{"start":785.52,"text":"So that's what we're going to do."},{"start":787.72,"text":"So basically, each of this will be parametrized by a new artwork."},{"start":793.36,"text":"The input will be after the conditioning,"},{"start":796.54,"text":"So the input here is the x1 and x2,"},{"start":798.54,"text":"and output is the distribution of x3."},{"start":800.92,"text":"And this input-output relationship"},{"start":803.08,"text":"is modeled by a neural network, which is a transformer."},{"start":809.46,"text":"So that's what we are going towards."},{"start":813.42,"text":"How do we model each of these conditional distributions?"},{"start":819.42,"text":"So basically, we're going to describe"},{"start":821.18,"text":"a conditional distribution p of p sub theta"},{"start":823.72,"text":"beta Xt given X1 up to Xt minus 1."},{"start":831.8,"text":"So before going to details,"},{"start":833.78,"text":"let's treat this as a black box first."},{"start":836.34,"text":"Let's first discuss a little bit about the boundary in some sense."},{"start":842.62,"text":"It's like there are multiple layers here."},{"start":844.94,"text":"So the typical way to parameterize this is the following."},{"start":849.54,"text":"So you use a transformer."},{"start":851.38,"text":"So basically, what happens is that you"},{"start":853.08,"text":"have a sequence, x1 up to xt."},{"start":858.08,"text":"And so first of all, these are discrete IDs, right?"},{"start":861.28,"text":"So each of these means an ID for the token."},{"start":864.48,"text":"You first have to turn them into some numerical numbers."},{"start":867.68,"text":"So the first step is that you say,"}],"speech_gaps":[{"start":696.66,"end":698.22},{"start":816.832,"end":818.8},{"start":827.68,"end":829.904},{"start":856.176,"end":857.68}],"frame":"../frames/v041/005.webp","frame_time":704.9},{"title":"Transformer 与上下文学习中的嵌入表示","segments":[{"id":141,"text":"I'm going to turn this into an embedding E of x1.","zh":"我要把这转换成x1的嵌入E。","start":870.38,"end":874.26},{"id":142,"text":"And so basically, I turn each of the token x into xt","zh":"因此，基本上，我把每个标记x转换成xt。","start":875.02,"end":880.66},{"id":143,"text":"T into embedding of X T. And what is the embedding?","zh":"T转换成X T的嵌入。那么什么是嵌入？","start":880.66,"end":884.2},{"id":144,"text":"Embedding is a d-dimensional vector in the Euclidean space.","zh":"嵌入是在欧几里得空间中的一个d维向量。","start":884.2,"end":889.74},{"id":145,"text":"And this embedding is trained.","zh":"并且这个嵌入是经过训练的。","start":890.26,"end":891.84},{"id":146,"text":"So basically, you don't know what the parameters are.","zh":"所以基本上，你并不知道参数是什么。","start":892.12,"end":893.98},{"id":147,"text":"You will just parametrize it as unknown numbers,","zh":"你只是将其参数化为未知数，","start":894.4,"end":898.02},{"id":148,"text":"and you train the model to find","zh":"然后训练模型来找到","start":898.12,"end":900.24},{"id":149,"text":"the right numbers for these embeddings.","zh":"这些嵌入表示的正确数值。","start":900.24,"end":903.44},{"id":150,"text":"So every token in","zh":"所以词汇表中的每一个标记都","start":903.68,"end":908.0},{"id":151,"text":"vocabulary will be will have a corresponding embeddings so basically um you're gonna have","zh":"会有对应的嵌入表示，基本上，你将会拥有","start":908.0,"end":913.84},{"id":152,"text":"a sequence of embeddings, E1, E2. This is the embedding for the first token, embedding for the second token, up to the embedding for the last token. And in this lecture, I think we're going to use row vectors because I think when you get into the implementations, you know.","zh":"一个嵌入表示序列，E1, E2。这是第一个标记的嵌入表示，第二个标记的嵌入表示，一直到最后一个标记的嵌入表示。在这堂课中，我认为我们会使用行向量，因为当你进入实现时，你会知道。","start":915.57,"end":929.41},{"id":153,"text":"every vector is actually row vectors in the Python code, even though in mathematics people often use column vectors. So I thought about this and I thought just for large English model sections, we'll just always use row vectors, which is more consistent with the practice. It looks a bit weird to me actually from a mathematical perspective, and if you read the papers, many of the papers do use column vectors, but I think we'll just use row vectors to be consistent with the code. So basically, every embedding is a row vector.","zh":"实际上，每个向量在Python代码中都是行向量，尽管在数学中人们经常使用列向量。我考虑过这一点，并认为在大型英文模型部分，我们总是使用行向量，这与实践更为一致。从数学角度来看，这看起来有点奇怪，如果你阅读论文，许多论文确实使用列向量，但我认为我们会使用行向量以与代码保持一致。因此，基本上，每个嵌入表示都是一个行向量。","start":929.85,"end":957.47},{"id":154,"text":"And then you have this embedding matrix. So you have v of them, and each of them is of dimension d. So you have this matrix. And to read off which row you are, you just have to multiply. Either you just read off the id. So if you have the fifth token, you just read the fifth row. Or you can multiply this matrix with an indicator vector to gather that row, which is the same thing. Anyway, so we'll just read off from this embedding matrix the corresponding.","zh":"然后你有这个嵌入矩阵。你有v个这样的嵌入，每个嵌入的维度是d。因此，你有这个矩阵。要读取哪一行，你只需要乘以。或者你只需要读取该标识符。例如，如果你有第五个标记，你只需要读取第五行。或者你可以将这个矩阵与一个指示向量相乘以获取该行，这其实是同样的事情。无论如何，我们只需要从这个嵌入矩阵中读取相应的。","start":958.49,"end":988.0},{"id":155,"text":"embeddings for each of the tokens. So you get E up to E .","zh":"每个标记的嵌入表示。因此，你会得到E到E。","start":988.74,"end":992.9},{"id":156,"text":"And I think in many cases, often people append, prepend a beginning of sentence token, which is just a fixed token, in the very beginning. This is kind of like not always necessary. In some cases, you just don't do it. In some cases, you do it. But let's probably just introduce that. You have a beginning of sentence token, which is one of the special tokens in this vocabulary. Often, actually, what happens is that your vocabulary is bigger than...","zh":"我认为在许多情况下，人们通常会在序列的最前面添加一个开始标记，这只是一个固定的标记。这在某些情况下并不是必须的。在某些情况下，你不会这样做，而在某些情况下，你会这样做。但让我们可能还是引入这个概念。你有一个开始标记，它是这个词汇表中的一个特殊标记。实际上，通常发生的情况是，你的词汇表比...","start":996.66,"end":1022.6},{"id":157,"text":"what is needed, you always reserve a few tokens, you know, actually maybe a thousand, you know, a few thousand tokens for special tokens that you can introduce for special purposes. And you can introduce this begin of sentence token as X0, which is always the same. And then you turn them into embeddings. And then what you do is that you go through this transformer, which I will discuss in the later half of the lecture. So this is a transformer.","zh":"你需要做的，是始终保留一些标记，比如说，实际上可能是一千个，或者几千个标记，用于引入特殊用途的特殊标记。你可以引入一个表示句子开始的标记，比如X0，它总是相同的。然后你将它们转换为嵌入表示。接着你所做的就是将这些嵌入输入到这个变压器中，我将在讲座的后半部分讨论这个变压器。因此，这就是一个变压器。","start":1022.78,"end":1049.38}],"notes":["本段讲解了Transformer模型中嵌入表示的基本概念。嵌入是将每个token转换为一个d维向量，这些向量是通过训练模型找到的参数。嵌入可以是行向量，这在Python代码中更常见，尽管数学上通常使用列向量。嵌入矩阵的每一行对应一个token的嵌入，可以通过索引或乘以指示向量来获取。","在实际应用中，通常会添加特殊token，如句子开始标记（begin of sentence token），这些标记在词汇表中被保留下来用于特定目的。这些特殊token的嵌入也是通过模型训练得到的。","嵌入矩阵的维度是v×d，其中v是词汇表的大小，d是嵌入的维度。通过这种方式，每个token都可以被映射到一个对应的嵌入向量，从而为后续的Transformer处理提供输入。","在实际实现中，行向量的选择是为了与代码实践保持一致，尽管这在数学上可能显得不直观。这种选择有助于简化代码实现，并与大多数深度学习框架的惯例相匹配。","特殊token的处理是构建完整句子表示的重要步骤，它们通常被预定义为固定值，如X0，并在模型中被嵌入以供后续处理使用。","嵌入表示是Transformer模型的基础，它将离散的token转换为连续的向量空间，从而为模型提供有效的输入表示，以便进行后续的注意力机制和序列处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":870.38,"end":1049.38,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":870.38,"text":"I'm going to turn this into an embedding E of x1."},{"start":875.02,"text":"And so basically, I turn each of the token x into xt"},{"start":880.66,"text":"T into embedding of X T. And what is the embedding?"},{"start":884.2,"text":"Embedding is a d-dimensional vector in the Euclidean space."},{"start":890.26,"text":"And this embedding is trained."},{"start":892.12,"text":"So basically, you don't know what the parameters are."},{"start":894.4,"text":"You will just parametrize it as unknown numbers,"},{"start":898.12,"text":"and you train the model to find"},{"start":900.24,"text":"the right numbers for these embeddings."},{"start":903.68,"text":"So every token in"},{"start":908.0,"text":"vocabulary will be will have a corresponding embeddings so basically um you're gonna have"},{"start":915.57,"text":"a sequence of embeddings, E1, E2. This is the embedding for the first token, embedding for the second token, up to the embedding for the last token. And in this lecture, I think we're going to use row vectors because I think when you get into the implementations, you know."},{"start":929.85,"text":"every vector is actually row vectors in the Python code, even though in mathematics people often use column vectors. So I thought about this and I thought just for large English model sections, we'll just always use row vectors, which is more consistent with the practice. It looks a bit weird to me actually from a mathematical perspective, and if you read the papers, many of the papers do use column vectors, but I think we'll just use row vectors to be consistent with the code. So basically, every embedding is a row vector."},{"start":958.49,"text":"And then you have this embedding matrix. So you have v of them, and each of them is of dimension d. So you have this matrix. And to read off which row you are, you just have to multiply. Either you just read off the id. So if you have the fifth token, you just read the fifth row. Or you can multiply this matrix with an indicator vector to gather that row, which is the same thing. Anyway, so we'll just read off from this embedding matrix the corresponding."},{"start":988.74,"text":"embeddings for each of the tokens. So you get E up to E ."},{"start":996.66,"text":"And I think in many cases, often people append, prepend a beginning of sentence token, which is just a fixed token, in the very beginning. This is kind of like not always necessary. In some cases, you just don't do it. In some cases, you do it. But let's probably just introduce that. You have a beginning of sentence token, which is one of the special tokens in this vocabulary. Often, actually, what happens is that your vocabulary is bigger than..."},{"start":1022.78,"text":"what is needed, you always reserve a few tokens, you know, actually maybe a thousand, you know, a few thousand tokens for special tokens that you can introduce for special purposes. And you can introduce this begin of sentence token as X0, which is always the same. And then you turn them into embeddings. And then what you do is that you go through this transformer, which I will discuss in the later half of the lecture. So this is a transformer."}],"speech_gaps":[],"frame":"../frames/v041/006.webp","frame_time":882.38},{"title":"Transformer 与上下文学习中的概率分布","segments":[{"id":158,"text":"For now, you just think of this as a new edge work, which does a lot of computation, machine application, or tensions, which I'm going to discuss. A lot of operations, and then you output some logits at each of the locations. So each of these logits is supposed to describe the conditional distribution before the softmax. So basically, what you do is you say,","zh":"目前，你只需将这视为一种新的边缘工作，它执行大量计算、机器应用或张力，我将在后面讨论。进行大量操作，然后在每个位置输出一些logits。因此，每个logits应该描述softmax之前的条件分布。基本上，你所做的就是你说，","start":1052.21,"end":1086.12},{"id":159,"text":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0.","zh":"概率为，让我们说，每个这个u1是，我们称之为u1，u theta x0，然后p of x1被建模为，你知道的，仅仅是softmax。这个分布p of xi是，x1被建模为f theta x0的softmax。","start":1086.67,"end":1117.25},{"id":160,"text":"So the first distribution, which is not conditional, you just get the output from the x0. You get some logit. So this ui is in dimension v. And you take a softmax, you get a probability vector. So this is a probability vector in this simplex of dimension v. So after taking a softmax, the sum of the entries is 1. And all of the entries are non-active.","zh":"因此，第一个分布，它不是条件分布，你只需从x0得到输出。你得到一些logit。因此，这个ui是维度v。然后你进行softmax，得到一个概率向量。因此，这是这个维度v的单纯形中的一个概率向量。在进行softmax之后，所有条目的和为1。并且所有条目都是非负的。","start":1118.32,"end":1148.32},{"id":161,"text":"So then this is your probability for x1. This is the distribution. Technically, I think the distribution of this is equal to softmax. And then the same thing, when you have x2 given x1, you say this is equals to softmax of u2, where u2 is the output at the second position. And u2, we'll just call u2 the output.","zh":"因此，这是x1的概率。这是分布。技术上，我认为这个分布等于softmax。然后同样的情况，当你有x2给定x1时，你说这等于u2的softmax，其中u2是第二个位置的输出。并且u2，我们称之为u2的输出。","start":1148.91,"end":1179.31},{"id":162,"text":"of this model given x0 and x1. So each of these ui's is basically the output for the sequence before it. So ut plus 1 is f theta x0 up to xt. So basically, generically, p of xt given x1","zh":"这个模型给定x0和x1的输出。因此，每个这些ui的基本上是序列之前的输出。因此，ut plus 1是f theta x0到xt。基本上，一般地，p of xt给定x1","start":1180.49,"end":1212.08}],"notes":["本段讲解了Transformer模型中概率分布的构建过程，其中每个位置的输出通过softmax函数转换为概率分布。讲者提到，每个位置的logit是条件分布的前一步，即在softmax之前的状态。","讲者指出，第一个分布是无条件的，直接由x0生成logit，然后通过softmax得到概率向量。该向量属于一个维度为v的简单形（simplex），其所有元素之和为1，且所有元素非负。","在后续位置（如x2）的分布构建中，讲者强调使用与前一步相同的softmax机制，其中u2是模型在给定x0和x1后的输出。","讲者还提到，每个ui代表序列前一步的输出，ut+1是基于x0到xt的函数fθ的输出。最后，讲者提到p(xt| x1)的泛化形式，但未完整表达。","讲者在讲解过程中多次提到softmax函数的作用，以及如何将logit转换为概率分布，强调了概率分布的归一化性质。","讲者在描述模型结构时，使用了u1、u2等变量来表示不同位置的输出，并指出这些输出是基于前一步的输入生成的。"],"formulas":[{"latex":"p(x_1) = \\text{softmax}(f_\\theta(x_0))","symbols":"p(x_1) 表示 x1 的概率分布，softmax 是将 logit 转换为概率分布的函数，f_θ(x_0) 是输入 x0 经过模型得到的 logit","explanation":"公式正确，softmax 函数将 logit 转换为概率分布，符合概率分布的定义。","evidence":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0."},{"latex":"p(x_1) = \\text{softmax}(u_1), \\text{其中 } u_1 = f_\\theta(x_0)","symbols":"p(x_1) 是 x1 的概率分布，u_1 是由 x0 通过模型 f_θ 得到的 logit，softmax 将其转换为概率分布","explanation":"公式正确，明确说明了 u_1 的定义，符合概率分布的定义。","evidence":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0."}],"uncertainties":["p of xt given x1 的完整表达式未完整呈现，可能缺失条件或变量"],"diagram":"none","start":1052.21,"end":1212.08,"asr_flags":[],"math_clarifications":["公式 1 缺少条件变量的明确说明，且未明确 u_t 的定义，无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1052.21,"text":"For now, you just think of this as a new edge work, which does a lot of computation, machine application, or tensions, which I'm going to discuss. A lot of operations, and then you output some logits at each of the locations. So each of these logits is supposed to describe the conditional distribution before the softmax. So basically, what you do is you say,"},{"start":1086.67,"text":"The probability of, so let's just, you say, each of this u1 is, let's call this u1, u theta x0, and then p of x1 is modeled as, you know, just the soft max. This distribution p of xi is the, x1 is modeled as the soft max of f theta x0."},{"start":1118.32,"text":"So the first distribution, which is not conditional, you just get the output from the x0. You get some logit. So this ui is in dimension v. And you take a softmax, you get a probability vector. So this is a probability vector in this simplex of dimension v. So after taking a softmax, the sum of the entries is 1. And all of the entries are non-active."},{"start":1148.91,"text":"So then this is your probability for x1. This is the distribution. Technically, I think the distribution of this is equal to softmax. And then the same thing, when you have x2 given x1, you say this is equals to softmax of u2, where u2 is the output at the second position. And u2, we'll just call u2 the same as, so you call u2 the output."},{"start":1180.49,"text":"of this model given x0 and x1. So each of these ui's is basically the output for the sequence before it. So ut plus 1 is f theta x0 up to xt. So basically, generically, p of xt given x1"}],"speech_gaps":[],"frame":"../frames/v041/007.webp","frame_time":1064.21},{"title":"Transformer 中的上下文表示与向量索引","segments":[{"id":163,"text":"The output of xt minus 1 is the softmax of ut. Is it ut or ut plus 1? ut, which is the softmax of f theta x0 to xt. Okay? Any questions so far? So I particularly chose it to index at 1, yes. Yes.","zh":"xt-1 的输出是 ut 的 softmax。是 ut 还是 ut+1？ut，它是 fθ(x0 到 xt) 的 softmax。明白了吗？有没有问题？我特别选择用 1 来索引，对吧？对吧。","start":1212.67,"end":1257.49},{"id":164,"text":"U is just the vector. I think I can just call U, I think it's kind of like, I can just call U after the X0 is the same thing. I'm not, did I answer the question? So, oh, I think maybe that's the, so, so.","zh":"U 就是一个向量。我想我可以直接称它为 U，我觉得它和 X0 是一样的东西。我没有回答问题吗？所以，哦，我想也许这就是，所以，所以。","start":1261.76,"end":1292.14},{"id":165,"text":"I'm just using offset X0, X1 as a more explicit way to represent UI because I'm trying to express the dependency. So basically, I'm saying like a, basically, I think they are the same thing. Like, there are no difference at all in some sense, just how you view it, right? Like, in one way, you just say, oh, I need a notation for the vector. In the other way, you say, I need to interpret this vector as a function of the inputs. Right, right. Yeah, I mean, that part is...","zh":"我只是用 X0、X1 这样的偏移量作为更明确的方式来表示 UI，因为我试图表达这种依赖关系。基本上，我是在说，基本上，我认为它们是一样的东西。在某种意义上，它们根本没有区别，只是你如何看待它，对吧？比如，一种方式，你只需要一个向量的记号；另一种方式，你需要把这个向量解释为输入的函数。对，对。是的，我的意思是，这部分是……","start":1292.74,"end":1321.54},{"id":166,"text":"Oh, OK, OK, OK. So maybe I didn't have a question. There's a probability of seeing that. That's the probability of that. So I'm just trying to understand, like, this probability one in there, the . Are you just trying to predict the probability of seeing the ? Yes, yes, yes. So I think maybe I'm trying to figure out what's the question here.","zh":"哦，好的，好的，好的。也许我之前没有问题。看到那个概率的可能性。那就是那个概率。我只是在试图理解，比如，这里面的概率一，那个。你是不是在尝试预测看到那个的概率？是的，是的，是的。我想我可能是在试图弄清楚这里的问题是什么。","start":1322.03,"end":1368.62}],"notes":["本段主要讨论Transformer模型中上下文表示的索引方式，特别是关于向量ut的索引问题。讲者指出xt-1是ut的softmax输出，而ut是fθ(x0到xt)的softmax结果。讲者强调索引方式的选择是为了更清晰地表达依赖关系，但同时也指出不同索引方式在本质上是等价的，只是视角不同。","讲者提到U是一个向量，可以作为X0的表示，但同时也强调需要区分向量作为独立实体和作为输入函数的两种视角。这种区分有助于理解模型中上下文的动态表示。","讲者在讨论中提到概率问题，特别是关于某个特定概率值的预测。这表明在Transformer模型中，上下文表示不仅用于捕捉依赖关系，还用于计算概率分布，从而进行预测。","讲者在最后部分表现出对问题的困惑，这反映了在实际应用中，如何正确理解和使用上下文表示仍然是一个需要深入探讨的问题。"],"formulas":[],"uncertainties":["可能的术语错误：'ut plus ut' 可能是 'ut plus 1' 的误听。","可能的术语错误：'the . Are you just trying to predict the probability of seeing the ?' 中的 '.' 和 '?' 可能是误听或缺失的词。","可能的术语错误：'the probability one in there, the .' 中的 'one' 和 'the' 可能是误听或缺失的词。"],"diagram":"none","start":1212.67,"end":1368.62,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":1212.67,"text":"of xt minus 1 is the softmax of ut. Is it ut or ut plus 1? ut plus ut, yes, ut, which is the softmax of f theta x0 to xt. Okay? Any questions so far? So I particularly chose it to index at 1, yes. Yes."},{"start":1261.76,"text":"U is just the vector. I think I can just call U, I think it's kind of like, I can just call U after the X0 is the same thing. I'm not, did I answer the question? So, oh, I think maybe that's the, so, so."},{"start":1292.74,"text":"I'm just using offset X0, X1 as a more explicit way to represent UI because I'm trying to express the dependency. So basically, I'm saying like a, basically, I think they are the same thing. Like, there are no difference at all in some sense, just how you view it, right? Like, in one way, you just say, oh, I need a notation for the vector. In the other way, you say, I need to interpret this vector as a function of the inputs. Right, right. Yeah, I mean, that part is..."},{"start":1322.03,"text":"Oh, OK, OK, OK. So maybe I didn't have a question. There's a probability of seeing that. That's the probability of that. So I'm just trying to understand, like, this probability one in there, the . Are you just trying to predict the probability of seeing the ? Yes, yes, yes. So I think maybe I'm trying to figure out what's the question here."}],"speech_gaps":[],"frame":"../frames/v041/008.webp","frame_time":1224.67},{"title":"Transformer 与上下文学习中的概率模型","segments":[{"id":167,"text":"I think maybe what you're asking is the following. So maybe let's take this one. So this is a vector. This is a vector in dimension v. So in a vocabulary size. And you have to take a softmax. It's a sequence of numbers which are all non-negative and they sum to one. And what this really means is that p theta of xt is equals to one.","zh":"我想你可能是在问以下这个问题。那么让我们先考虑这个例子。这是一个向量，它是在维度为 v 的空间中的向量。你必须使用 softmax 函数。这是一个所有数值都是非负数且总和为 1 的数列。而这意味着 p_θ(x_t) 等于 1。","start":1370.38,"end":1399.75},{"id":168,"text":"given x1 up to xt minus 1. The chance to see the first token under this probabilistic model, parametrized by theta, is equal to, this is the vector, the first entry of this vector. It's equal to softmax f theta x0 up to xt minus 1, indexed by 1. This is the first entry of this vector. And you have many, many other entries. Each entry is like, you have another entry, softmax f theta.","zh":"给定 x_1 到 x_{t-1}，在这个由 θ 参数化的概率模型下，看到第一个标记的概率等于这个向量的第一个元素。这是这个向量的第一个元素，等于 softmax(f_θ(x_0 到 x_{t-1}))，索引为 1。这个向量还有许多其他元素。每个元素都是类似的，你有另一个元素，softmax(f_θ)。","start":1400.43,"end":1430.92},{"id":169,"text":"2, and that is equal to P theta of Xt is equal to 2, the chance of seeing the second token given X1 up to Xt minus 1. And you have so on and so forth. Does that answer the question? Yeah, this V absolute value is the size of the vocabulary. So is this like a mass function? Because the modules are conditional on the previous one. It's not the ones after it, right? Yep.","zh":"第二个元素等于 P_θ(x_t = 2)，即在给定 x_1 到 x_{t-1} 的情况下看到第二个标记的概率。依此类推。这回答了你的问题吗？是的，这个 V 的绝对值是词汇表的大小。那么这像一个质量函数吗？因为这些模块是基于前面的标记的。不是后面的标记，对吧？没错。","start":1437.61,"end":1468.59},{"id":170,"text":"Yeah, so this is a causal model so far. But I haven't defined the transformer yet. But I'm insisting that this is only. So guys, this is one of the reasons I'm using this notation. So I'm insisting that ut is only a function of x0 and xt minus 1, but not a function of the later inputs. But that will be guaranteed when we introduce the exact inner working of this transformer.","zh":"是的，到目前为止这是一个因果模型。但我还没有定义 Transformer。但我坚持认为这只是一个。各位，我使用这种记号的一个原因就是这个。我坚持认为 u_t 仅仅是 x_0 和 x_{t-1} 的函数，而不是后面输入的函数。当我们引入 Transformer 的具体内部工作机制时，这一点将得到保证。","start":1469.16,"end":1494.64},{"id":171,"text":"Okay, good question. So the second question is easier to answer. So the embeddings is only a property of the...","zh":"好的问题。第二个问题更容易回答。嵌入只是这个……","start":1508.96,"end":1516.21},{"id":172,"text":"this x, right? You don't have to see any other things, right? It's just actually, it's literally, if this is the first token, then you just read the first row of this matrix. If this is the 10th token, you use the 10th row, and that's your embedding. No any other dependencies. And while we are writing this as functions of the x, but not the embeddings, that's just a, it's just a...","zh":"这个 x，对吧？你不需要看到任何其他东西，对吧？实际上，它就是，如果这是第一个标记，你就只需要读取这个矩阵的第一行。如果这是第十个标记，你就使用第十行，这就是你的嵌入。没有任何其他依赖关系。虽然我们将它写成 x 的函数，而不是嵌入的函数，但这只是……","start":1517.04,"end":1535.54}],"notes":["本段讲解了在Transformer模型中，概率分布如何通过softmax函数进行计算。具体来说，每个token的概率是基于前面的token序列计算的，且所有概率值的和为1。这表明模型是条件概率模型，每个token的生成依赖于前面的token。","讲者提到，每个token的概率对应于softmax函数的输出，其中每个输出项代表该token在给定前面token序列下的条件概率。例如，第一个token的概率是softmax函数的第一个输出项，第二个token的概率是第二个输出项，以此类推。","讲者强调，这种概率分布是条件概率，即每个token的概率依赖于前面的token序列，而不是后面的token。这表明模型具有因果性，即当前token的生成仅依赖于前面的token，而不是后面的。","讲者指出，这种条件概率模型是因果模型的一部分，但尚未定义Transformer的具体结构。他强调，这种因果性将在后续介绍Transformer的内部机制时得到保证。","讲者提到，嵌入（embedding）仅是输入x的属性，即每个token的嵌入对应于其在词汇表中的位置，直接从矩阵中读取对应的行即可。这表明嵌入是独立于其他token的，没有额外的依赖关系。","讲者指出，虽然嵌入是输入x的函数，但嵌入本身并不依赖于其他token，因此可以独立计算。这种设计简化了模型的结构，使得每个token的处理可以独立进行。"],"formulas":[],"uncertainties":["parametrized by theta","the embeddings is only a property of the...","it's just a...","the embeddings, that's just a..."],"diagram":"none","start":1370.38,"end":1535.54,"asr_flags":[],"math_clarifications":["原文中提到的 softmax 函数输出是一个概率分布，但公式中直接将 softmax 函数的输出与概率分布等同，这是不正确的。正确的表达应为 softmax 函数的输出是概率分布，而 p_θ(x_t) 是该分布的某个具体值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1370.38,"text":"I think maybe what you're asking is the following. So maybe let's take this one. So this is a vector. This is a vector in dimension v. So in a vocabulary size. And you have to take a softmax. It's a sequence of numbers which are all non-negative and they sum to one. And what this really means is that p theta of xt is equals to one."},{"start":1400.43,"text":"given x1 up to xt minus 1. The chance to see the first token under this probabilistic model, paramatched by theta, is equal to, this is the vector, the first entry of this vector. It's equal to softmax f theta x0 up to xt minus 1, indexed by 1. This is the first entry of this vector. And you have many, many other entries. Each entry is like, you have another entry, softmax f theta."},{"start":1437.61,"text":"2, and that is equal to P theta of Xt is equal to 2, the chance of seeing the second token given X1 up to Xt minus 1. And you have so on and so forth. Does that answer the question? Yeah, this V absolute value is the size of the vocabulary. So is this like a mass function? Because the modules are conditional on the previous one. It's not the ones after it, right? Yep."},{"start":1469.16,"text":"Yeah, so this is a causal model so far. But I haven't defined the transformer yet. But I'm insisting that this is only. So guys, this is one of the reasons I'm using this notation. So I'm insisting that ut is only a function of x0 and xt minus 1, but not a function of the later inputs. But that will be guaranteed when we introduce the exact inner working of this transformer."},{"start":1508.96,"text":"Okay, good question. So the second question is easier to answer. So the embeddings is only a property of the..."},{"start":1517.04,"text":"this x, right? You don't have to see any other things, right? It's just actually, it's literally, if this is the first token, then you just read the first row of this matrix. If this is the 10th token, you use the 10th row, and that's your embedding. No any other dependencies. And while we are writing this as functions of the x, but not the embeddings, that's just a, it's just a..."}],"speech_gaps":[{"start":1497.328,"end":1502.08},{"start":1502.08,"end":1508.016}],"frame":"../frames/v041/009.webp","frame_time":1382.38},{"title":"Transformer 与上下文学习","segments":[{"id":173,"text":"Sometimes the embeddings are the inner workings to some degree. I'm just trying to give you more. I'm trying to unpack it a little bit. So if you don't have to unpack it, you can work with the text. That's just the representation. It's one-to-one, so in some sense, there's no difference.","zh":"有时候，这些嵌入可以某种程度上反映模型的内部运作。我只是想给你们更多的信息。我试图稍微解释一下。所以如果你不需要深入解释，你可以直接处理文本。这只是表示方式。它是一一对应的，所以在某种意义上，两者没有区别。","start":1536.76,"end":1551.88},{"id":174,"text":"Okay, so this is a full description of the probabilistic model. Once you have this probabilistic model, you can compute the maximum likelihood, given any data. We can say, I have a data distribution, I have a data point, a sequence of data, I can see under this probabilistic model, p theta, what is the chance of seeing this data. So that's what you need for computing, do the training, right? You need to compute the likelihood, and then you maximize the likelihood as a function of theta, right? So, and let's briefly discuss","zh":"好的，所以这就是概率模型的完整描述。一旦你有了这个概率模型，你可以根据任何数据计算最大似然。我们可以这样说，我有一个数据分布，我有一个数据点，一个数据序列，我可以在这个概率模型 p_theta 下，看到出现这个数据的概率是多少。这就是你需要进行计算的内容，进行训练，对吧？你需要计算似然，然后将似然作为 theta 的函数进行最大化，对吧？所以，我们简要讨论一下","start":1556.66,"end":1586.12},{"id":175,"text":"Because for generation, suppose you already have the generational decoding. Suppose you already have the model, then a model theta, then what do you do? So as you can see, the most natural thing is you just keep generating x1, x2, x3, so on and so forth. You just say, I'm going to generate x1 first from this p, say, softmax, f theta.","zh":"因为对于生成任务，假设你已经具备了生成解码器。假设你已经拥有模型，那么模型 theta，你接下来该怎么做呢？所以，如你所见，最自然的做法就是依次生成 x1, x2, x3，依此类推。你只需说，我要从这个 p 中生成 x1，比如说，通过 softmax，f_theta。","start":1586.22,"end":1617.34},{"id":176,"text":"x1 up to x0 up to xt. I guess I just did it right generically. So we generate xt minus 1 from f theta x0 up to xt minus 1. You can do this sequentially. Sometimes people draw this in this way. So you say, oh, you have x0. You first go through the transformer. And you get x1. And you feed x1 back to this transformer.","zh":"x1 到 x0 到 xt。我想我只是泛泛地做了这个过程。所以你可以从 f_theta(x0 到 xt-1) 生成 xt-1。你可以依次进行。有时人们会以这种方式绘制这个过程。所以你会说，哦，你已经有了 x0。你首先通过变压器处理它，得到 x1。然后将 x1 反馈回这个变压器。","start":1618.19,"end":1642.41},{"id":177,"text":"And then you generate x2 by sampling from the software. And then you feedback. So that's kind of why it's called autoregressive, because you","zh":"然后你通过软件进行采样生成 x2，然后进行反馈。这就是为什么它被称为自回归模型，因为你在","start":1647.3,"end":1655.62},{"id":178,"text":"When you are generating, you don't have the sequence, right? When you are computing log likelihood, you already see the whole sequence. You are just trying to figure out what's the chance of seeing this sequence. But when you are generating, you start with nothing. And then you have to generate your sequence yourself. And that's why you start with the beginning of sentence token, and then you generate the first token, and then you give the first token back to the transformer and compute this softmax. And then you generate a second token. You do a sampling to generate a second token, and you give it back.","zh":"当你在生成时，你并不拥有这个序列，对吧？当你在计算对数似然时，你已经看到了整个序列。你只是在试图确定看到这个序列的概率。但当你在生成时，你从头开始，然后你必须自己生成这个序列。这就是为什么你从句子的开始标记开始，然后你生成第一个标记，接着你把第一个标记反馈给Transformer并计算这个softmax。然后你生成第二个标记。你通过采样来生成第二个标记，然后你再把它反馈回去。","start":1657.02,"end":1684.84},{"id":179,"text":"You keep doing this. So that's the autoregressive generation. And sometimes, this generation can only start from certain parts because in many cases, you are not generating from nothing. So you are given maybe a few tokens. Maybe you are given, so sometimes it's called prompt. So prompt is like something the models are given. It's maybe like a question, an instruction, so on and so forth. You say you are given x1 up to xk.","zh":"你不断重复这个过程。这就是自回归生成。有时，这种生成只能从序列的某些部分开始，因为在许多情况下，你并不是从完全空白开始生成的。你可能被提供了一些标记。有时，这被称为提示（prompt）。提示就像是模型所接收的内容，可能是问题、指令等等。你可以说你被提供了x1到xk。","start":1685.78,"end":1714.6}],"notes":["本段主要讲解了Transformer模型中的嵌入表示，指出嵌入是模型内部工作的一部分，但也可以直接使用文本进行处理。嵌入是一种一对一的表示，因此在某种程度上没有区别。","接下来，讲者介绍了概率模型的完整描述，强调了在给定数据的情况下，可以通过计算最大似然来训练模型。最大似然的计算需要知道数据分布和数据点，并通过概率模型pθ来计算数据出现的概率。","在生成过程中，讲者讨论了自回归生成的机制，即通过逐步生成序列中的每个元素，并将前一个元素反馈给模型进行下一步的生成。这种机制使得模型能够逐步构建整个序列。","讲者还提到，在生成过程中，模型并不知道整个序列，而是从头开始逐步生成。生成的第一步是使用开始标记，然后通过softmax计算下一个标记的概率，并将结果反馈给模型。","最后，讲者指出，生成过程有时需要从特定的部分开始，而不是从完全空白的状态。这种情况下，模型会接收到一些提示（prompt），如问题或指令，以引导生成过程。","整个讲解强调了自回归生成的基本原理，以及如何通过逐步反馈机制来构建完整的序列。同时，也提到了提示（prompt）在生成过程中的作用。"],"formulas":[],"uncertainties":["software","x1 up to x0 up to xt","xt minus 1 from f theta x0 up to xt minus 1","x1 up to xk"],"diagram":"none","start":1536.76,"end":1714.6,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1536.76,"text":"sometimes the embeddings is the inner working to some degree. I'm just trying to give you more. I'm trying to unpack it a little bit. So if you don't have to unpack it, you can work with the text. That's just the representation. It's one-to-one, so in some sense, there's no difference."},{"start":1556.66,"text":"Okay, so this is a full description of the probabilistic model. Once you have this probabilistic model, you can compute the maximum likelihood, given any data. We can say, I have a data distribution, I have a data point, a sequence of data, I can see under this probabilistic model, p theta, what is the chance of seeing this data. So that's what you need for computing, do the training, right? You need to compute the likelihood, and then you maximize the likelihood as a function of theta, right? So, and let's briefly discuss"},{"start":1586.22,"text":"Because for generation, suppose you already have the generational decoding. Suppose you already have the model, then a model theta, then what do you do? So as you can see, the most natural thing is you just keep generating x1, x2, x3, so on and so forth. You just say, I'm going to generate x1 first from this p, say, softmax, f theta."},{"start":1618.19,"text":"x1 up to x0 up to xt. I guess I just did it right generically. So we generate xt minus 1 from f theta x0 up to xt minus 1. You can do this sequentially. Sometimes people draw this in this way. So you say, oh, you have x0. You first go through the transformer. And you get x1. And you feed x1 back to this transformer."},{"start":1647.3,"text":"And then you generate x2 by sampling from the software. And then you feedback. So that's kind of why it's called autoregressive, because you"},{"start":1657.02,"text":"When you are generating, you don't have the sequence, right? When you are computing log likelihood, you already see the whole sequence. You are just trying to figure out what's the chance of seeing this sequence. But when you are generating, you start with nothing. And then you have to generate your sequence yourself. And that's why you start with the beginning of sentence token, and then you generate the first token, and then you give the first token back to the transformer and compute this softmax. And then you generate a second token. You do a sampling to generate a second token, and you give it back."},{"start":1685.78,"text":"you keep doing this. So that's the autoregressive generation. And sometimes, this generation can only start from certain parts because in many cases, you are not generating from nothing. So you are given maybe a few tokens. Maybe you are given, so sometimes it's called prompt. So prompt is like something the models are given. It's maybe like a question, an instruction, so on and so forth. You say you are given x1 up to xk."}],"speech_gaps":[],"frame":"../frames/v041/010.webp","frame_time":1548.76},{"title":"Transformer 与上下文学习中的生成过程","segments":[{"id":180,"text":"The model is supposed to complete the generation. So it starts with xt plus 1. So xt plus 1, so this is given. And then you start with xt plus 1. You first generate xt plus 1 from this softmax of the f theta x1 up to xk. And then you generate xt k plus 2. And then you do the same thing.","zh":"模型应该完成生成过程。因此，它从 xt+1 开始。所以 xt+1，这是已知的。然后你从 xt+1 开始。你首先从这个 softmax(fθ(x1) 到 xk) 生成 xt+1。然后你生成 xt+k+2。然后你重复同样的过程。","start":1716.17,"end":1739.05},{"id":181,"text":"So it doesn't have to be always from the beginning. And then there's another small thing, which is that when you generate, you don't necessaril
