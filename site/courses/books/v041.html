y have to always follow the same model. And there's one thing that you can deviate from it, which is that you can add additional temperature where you","zh":"因此，它不一定要从头开始。还有一个小细节是，当你生成时，你不一定总是遵循同一个模型。你可以偏离它的一点，即你可以添加额外的温度参数，其中你说，与从原始概率模型生成不同，我有时会将这个除以温度 T。这意味着你改变了","start":1739.42,"end":1758.98},{"id":182,"text":"say as opposed to generating from the original probabilistic model, I'm going to divide this by a temperature T sometimes. What does this mean is that you change the","zh":"你不会改变这些选择之间的顺序。因此，fθ 是一个向量。它是一个 V 维向量，描述了词汇表中每个 token 的 logit。当你除以 tau 时，你不会改变它们的相对顺序。较大的值仍然较大，较小的值仍然较小。但你改变了尺度。例如，之前你可能会有像 2、1、-1 这样的值，","start":1759.78,"end":1775.92},{"id":183,"text":"You don't change the orders between these choices. So this f theta is a vector. It's a V-dimensional vector that describes the logits for each of the tokens in the vocabulary. And when you divide by tau, you don't change their relative orders. The bigger ones are still bigger. The smaller ones are still smaller. But you change the scale. So for example, before, you could have like a...","zh":"假设 fθ(x0) 到 xk 等于，比如说，可能是 2、1、-1，这样的值。如果你除以 tau，假设你除以 tau，而 tau 非常非常小。假设 tau 几乎为 0。那么在除以 tau 之后，","start":1776.75,"end":1801.65},{"id":184,"text":"Suppose f theta x0 up to xk is equal to, let's say, maybe like a 2, 1, minus 1, something like this. And if you divide by tau, let's say suppose you divide by tau, which is very, very small. Suppose tau is almost 0. Then after dividing by tau,","zh":"比如，如果你除以 tau，那么会发生的是，这可能变成 200。这可能变成 100。我给出一个具体的例子，虽然这个例子有点不现实，但只是为了说明一个观点。softmax 这个向量与调整后的向量的 softmax 之间的区别是什么？区别在于，这个向量的 softmax 要尖锐得多。也许我在这里给你一个例子。假设你只有三个维度，这样更容易说明问题。","start":1804.5,"end":1825.38},{"id":185,"text":"like if you divide by tau, then what happens is that maybe this becomes 200. This becomes 100. I'm giving a concrete example, which is a little bit unrealistic, but to demonstrate a point. And what's the difference between the softmax of this vector versus the softmax of the readjusted vector? The difference is that the softmax of this is much sharper. So maybe let me just give you an example here. So if you just have, let's say, maybe let's just have three dimensions so that it's easier to demonstrate a point.","zh":"比如，如果你除以 tau，那么可能发生的情况是，这可能变成 200。这会变成 100。我举了一个具体的例子，虽然这个例子有点不现实，但只是为了说明一个观点。那么，这个向量的 softmax 与重新调整后的向量的 softmax 之间有什么区别呢？区别在于，这个向量的 softmax 要尖锐得多。也许我在这里可以给你一个例子。比如，如果你只是有三个维度，这样更容易说明问题。","start":1826.22,"end":1855.4},{"id":186,"text":"So if you do softmax of this vector of 2, 1, minus 1, what happens is that you get, in some sense, you get exponential 2 over exponential 2 plus exponential 1 plus exponential minus 1. That's after softmax was the probability of the first token. And the second token will be exponential 1, exponential","zh":"如果你对这个向量 [2, 1, -1] 进行 softmax 处理，会发生的是，你会得到某种意义上的指数 2 除以指数 2 加上指数 1 加上指数 -1。这是第一个标记的概率。第二个标记的概率将是指数 1，指数","start":1859.88,"end":1890.02}],"notes":["本段讲解了Transformer模型在生成过程中如何逐步生成下一个token，从xt+1开始，通过softmax函数对fθ(x1到xk)进行处理，然后生成xt+2，重复这一过程。模型不需要总是从头开始生成，可以灵活调整生成策略。","讲者提到在生成过程中可以引入温度参数（temperature），通过除以温度T来调整softmax的输出分布。温度参数的引入不会改变logits之间的相对顺序，但会改变它们的尺度，从而影响生成结果的确定性。","温度参数T的值会影响softmax的输出分布。当T非常小时，softmax的输出会更加尖锐，即概率分布更加集中，而当T较大时，分布会更加平缓。讲者通过一个具体的例子（logits为2, 1, -1）来说明温度参数对softmax输出的影响。","讲者进一步解释了温度参数对softmax分布的影响，指出当T接近0时，logits的值会被放大，导致softmax输出的概率分布更加集中。例如，logits为2, 1, -1时，经过温度调整后，输出值会变得更大，从而改变概率分布的形状。","讲者通过一个具体的例子来说明温度参数对softmax分布的影响，指出当T非常小时，softmax的输出会更加尖锐，即概率分布更加集中。这有助于模型在生成时更倾向于某些特定的token。","讲者提到在生成过程中，可以使用温度参数来调整softmax的输出分布，从而影响生成结果的确定性。温度参数的引入是生成过程中的一种灵活调整手段，但不会改变logits之间的相对顺序。"],"formulas":[{"latex":"softmax(f_\\theta(x_1 \\text{ to } x_k))","symbols":"softmax函数对logits向量f_θ(x_1到x_k)进行处理，得到概率分布","explanation":"公式正确，softmax函数对logits向量进行处理，得到概率分布，符合上下文描述。","evidence":"The model is supposed to complete the generation. So it starts with xt plus 1. So xt plus 1, so this is given. And then you start with xt plus 1. You first generate xt plus 1 from this softmax of the f theta x1 up to xk. And then you generate xt k plus 2. And then you do the same thing."},{"latex":"softmax(f_\\theta(x_0 \\text{ to } x_k) / \\tau)","symbols":"温度参数τ对logits向量进行缩放，影响softmax输出分布","explanation":"公式正确，温度参数τ对logits向量进行缩放，影响softmax输出分布，符合上下文描述。","evidence":"Suppose f theta x0 up to xk is equal to, let's say, maybe like a 2, 1, minus 1, something like this. And if you divide by tau, let's say suppose you divide by tau, which is very, very small. Suppose tau is almost 0. Then after dividing by tau,"}],"uncertainties":["temperature T 的具体作用和影响范围未完全明确","softmax函数的计算过程和具体实现细节未完全明确","温度参数对logits向量的调整方式未完全明确"],"diagram":"none","start":1716.17,"end":1890.02,"asr_flags":[],"math_clarifications":["公式2中的softmax函数计算方式不正确，正确的softmax计算应为每个元素的指数值除以所有元素指数值的总和，而不是直接使用logits向量的指数值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1716.17,"text":"The model is supposed to complete the generation. So it starts with xt plus 1. So xt plus 1, so this is given. And then you start with xt plus 1. You first generate xt plus 1 from this softmax of the f theta x1 up to xk. And then you generate xt k plus 2. And then you do the same thing."},{"start":1739.42,"text":"So it doesn't have to be always from the beginning. And then there's another small thing, which is that when you generate, you don't necessarily have to always follow the same model. And there's one thing that you can deviate from it, which is that you can add additional temperature where you"},{"start":1759.78,"text":"say as opposed to generating from the original probabilistic model, I'm going to divide this by a temperature T sometimes. What does this mean is that you change the"},{"start":1776.75,"text":"You don't change the orders between these choices. So this f theta is a vector. It's a V-dimensional vector that describes the logits for each of the tokens in the vocabulary. And when you divide by tau, you don't change their relative orders. The bigger ones are still bigger. The smaller ones are still smaller. But you change the scale. So for example, before, you could have like a..."},{"start":1804.5,"text":"Suppose f theta x0 up to xk is equal to, let's say, maybe like a 2, 1, minus 1, something like this. And if you divide by tau, let's say suppose you divide by tau, which is very, very small. Suppose tau is almost 0. Then after dividing by tau,"},{"start":1826.22,"text":"like if you divide by tau, then what happens is that maybe this becomes 200. This becomes 100. I'm giving a concrete example, which is a little bit unrealistic, but to demonstrate a point. And what's the difference between the softmax of this vector versus the softmax of the readjusted vector? The difference is that the softmax of this is much sharper. So maybe let me just give you an example here. So if you just have, let's say, maybe let's just have three dimensions so that it's easier to demonstrate a point."},{"start":1859.88,"text":"So if you do softmax of this vector of 2, 1, minus 1, what happens is that you get, in some sense, you get exponential 2 over exponential 2 plus exponential 1 plus exponential minus 1. That's after softmax was the probability of the first token. And the second token will be exponential 1, exponential"}],"speech_gaps":[],"frame":"../frames/v041/011.webp","frame_time":1728.17},{"title":"Softmax 的性质与温度参数的影响","segments":[{"id":187,"text":"2 plus exponential 1 plus exponential minus 1, right?","zh":"2 加上 e 的 1 次方加上 e 的 -1 次方，对吗？","start":1891.24,"end":1896.4},{"id":188,"text":"And the third one will be the same denominator,","zh":"第三个的分母将是一样的，","start":1896.44,"end":1899.3},{"id":189,"text":"the different numerator, right?","zh":"分子不同，对吗？","start":1899.48,"end":1900.7},{"id":190,"text":"So that's the soft max of this.","zh":"这就是这个的 softmax 值。","start":1900.98,"end":1903.66},{"id":191,"text":"But if you take the soft max of the 100 minus 100,","zh":"但如果取 100 和 -100 的 softmax，","start":1904.02,"end":1907.12},{"id":192,"text":"suppose you do that, then this will give you","zh":"假设你这样做，那么这将给出","start":1907.34,"end":1916.66},{"id":193,"text":"exponential 200 versus exponential 200 plus","zh":"e 的 200 次方与 e 的 200 次方加上","start":1916.66,"end":1922.98},{"id":194,"text":"exponential 100 plus exponential minus 100, blah, blah, blah.","zh":"e 的 100 次方加上 e 的 -100 次方，等等。","start":1922.98,"end":1929.94},{"id":195,"text":"So what's the difference here?","zh":"那么这里有什么不同呢？","start":1930.5,"end":1931.72},{"id":196,"text":"The difference is that in terms of the three numbers,","zh":"不同之处在于这三个数字的顺序上，","start":1931.84,"end":1934.34},{"id":197,"text":"in terms of the order, it's always like this is bigger","zh":"在顺序上，它总是像这样更大","start":1934.46,"end":1936.36},{"id":198,"text":"than this, this is bigger than this, right?","zh":" than 这个，这个又比这个大，对吧？","start":1936.36,"end":1937.76},{"id":199,"text":"Because 2 is bigger than 1, 1 is bigger than minus 1,","zh":"因为 2 比 1 大，1 比 -1 大，","start":1938.14,"end":1940.92},{"id":200,"text":"the order is always maintained.","zh":"顺序总是被保持下来。","start":1941.02,"end":1942.4},{"id":201,"text":"But the relative scale is different,","zh":"但是相对的尺度是不同的，","start":1942.4,"end":1948.68},{"id":202,"text":"because here you can see exponential 200","zh":"因为在这里你可以看到指数 200","start":1948.74,"end":1950.9},{"id":203,"text":"is way, way bigger than exponential 100.","zh":"这个数值大得远远超过了指数 100。","start":1950.9,"end":1953.6},{"id":204,"text":"The difference is so astronomical.","zh":"两者的差距大得难以想象。","start":1954.04,"end":1955.94},{"id":205,"text":"The difference is too big so that these two numbers","zh":"这个差距太大，以至于这两个数值","start":1957.1,"end":1960.32},{"id":206,"text":"are just so small compared to exponential 200.","zh":"与指数 200 相比小得可以忽略不计。","start":1960.32,"end":1962.24},{"id":207,"text":"So they are even negligible.","zh":"因此，它们甚至可以被忽略。","start":1962.8,"end":1964.08},{"id":208,"text":"So basically, in this calculation,","zh":"基本上，在这个计算中，","start":1964.46,"end":1966.44},{"id":209,"text":"these two numbers don't even have to show up here.","zh":"这两个数值甚至不需要出现在这里。","start":1966.82,"end":1968.72},{"id":210,"text":"It don't even matter.","zh":"它们甚至不重要。","start":1968.84,"end":1969.72},{"id":211,"text":"So you just get 1.","zh":"所以你得到的只是 1。","start":1969.82,"end":1970.48},{"id":212,"text":"1.","zh":"1.","start":1970.48,"end":1970.56},{"id":213,"text":"So basically, the first token will just","zh":"基本上，第一个标记只会","start":1970.88,"end":1972.9},{"id":214,"text":"have probably almost exactly 1, maybe 0.9999 something.","zh":"大概几乎精确地是 1，可能是 0.9999 左右的数值。","start":1972.9,"end":1975.88},{"id":215,"text":"And then if you look at the second entry, which","zh":"然后如果你看第二个条目，","start":1976.18,"end":1979.88},{"id":216,"text":"is exponential 100 divided by exponential 200","zh":"是指数 100 除以指数 200","start":1979.88,"end":1984.2},{"id":217,"text":"plus exponential 100 plus exponential minus 1.","zh":"加上指数 100 加上指数 -1。","start":1984.2,"end":1989.1},{"id":218,"text":"Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token.","zh":"同样，所有的东西都比指数 200 小很多，所以这并不很有用。这并不很有用。这基本上接近于零。所以基本上，这个条目会是零。所以这就是为什么在你用 tau 做除法来让这个值变大的时候，这个值就大约是 1、0 和 0。这就是我所说的它变得更为尖锐。你通过尖锐分布来让分布的大部分集中在最可能的标记上。","start":1991.07,"end":2019.31},{"id":219,"text":"And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you","zh":"然而，这里，展开式2和展开式1并不是差别很大。如果你计算一下，你可能会得到类似的结果，比如第一个可能是0.7，第二个可能是0.3。我不确定。我们可以用计算器来查看。但结果仍然是第一个比第二个大，第二个比第三个大。但不会所有概率都集中在第一个标记上。基本上，我想说的是，如果tau是一个很小的数，从而放大logits，那么你会使得到的分布更加尖锐，使其更接近一个类似的状态分布。然后，结果就是你只从最可能的标记中进行采样。你取的是最大值，而不是从分布中进行采样。实际上，人们就是这样做的。他们说，基本上，我认为实际上，","start":2020.25,"end":2044.27},{"id":220,"text":"you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,","zh":"如果你放大logits，那么你就会使得到的分布变得更加尖锐，使其更接近一个相似的状态分布。然后结果就是，你只是从最可能的token中进行采样。你是在取最大值，而不是从分布中进行采样。实际上，人们就是这样做的。他们基本上说，我认为实际上，","start":2045.63,"end":2070.98}],"notes":["本段讲解了softmax函数在不同温度参数下的行为差异。当温度参数τ较小时，softmax函数会将分布变得更尖锐，使得概率集中在最大值上，而其他值接近于零。这种现象在处理具有极大差异的logits时尤为明显，例如当其中一个logit远大于其他logit时，其他logit的贡献可以忽略不计。"],"formulas":[{"latex":"softmax(x) = \\frac{e^{x_i}}{\\sum_{j} e^{x_j}}","symbols":"softmax函数的定义，其中x_i是输入logits，e^{x_i}是指数函数，\\sum_{j} e^{x_j}是所有logits的指数和。","explanation":"保持原始公式，修正了sum的写法，使其更符合数学标准符号。","evidence":"2 plus exponential 1 plus exponential minus 1, right? exponential 200 versus exponential 200 plus exponential 100 plus exponential minus 100, blah, blah, blah. Because 2 is bigger than 1, 1 is bigger than minus 1, because here you can see exponential 200 is way, way bigger than exponential 100. The difference is too big so that these two numbers are just so small compared to exponential 200. So they are even negligible. So basically, in this calculation, these two numbers don't even have to show up here. It don't even matter. So you just get 1. 1. So basically, the first token will just have probably almost exactly 1, maybe 0.9999 something. And then if you look at the second entry, which is exponential 100 divided by exponential 200 plus exponential 100 plus exponential minus 1. Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token. And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"},{"latex":"p_i = \\frac{e^{x_i / \\tau}}{\\sum_{j} e^{x_j / \\tau}}","symbols":"温度参数τ对softmax函数的影响，其中τ是一个正数，用于控制分布的尖锐程度。","explanation":"保持原始公式，修正了sum的写法，使其更符合数学标准符号。","evidence":"Again, everything is negligible compared to exponential 200. So this is not very useful. This is not very useful. This is kind of like close to zero. So basically, this entry will be zero. So that's why after you divide by tau to make this bigger, then this is just approximately 1, 0, and 0. So that's what I mean by it's much sharper. So you sharpen the distribution to make it most of the distribution to be the problem has to be on the most likely token. And however, here, expansion 2 and expansion 1 are not that different. If you compute this, you'll get something like maybe the first one will be like maybe 0.7. The second one will be 0.3. I don't know. We can use a calculator to see. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"}],"uncertainties":["expansion 2 and expansion 1"],"diagram":"none","start":1891.24,"end":2070.98,"asr_flags":[192],"math_clarifications":["原始文本中提到的'2 plus exponential 1 plus exponential minus 1'等表述，可能涉及softmax函数的计算，但未明确给出具体的数学公式。因此，仅保留已明确的softmax函数定义及其温度参数τ的版本。"],"boards":[],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":1891.24,"text":"2 plus exponential 1 plus exponential minus 1, right?"},{"start":1896.44,"text":"And the third one will be the same denominator,"},{"start":1899.48,"text":"the different numerator, right?"},{"start":1900.98,"text":"So that's the soft max of this."},{"start":1904.02,"text":"But if you take the soft max of the 100 minus 100,"},{"start":1907.34,"text":"suppose you do that, then this will give you"},{"start":1916.66,"text":"exponential 200 versus exponential 200 plus"},{"start":1922.98,"text":"exponential 100 plus exponential minus 100, blah, blah, blah."},{"start":1930.5,"text":"So what's the difference here?"},{"start":1931.84,"text":"The difference is that in terms of the three numbers,"},{"start":1934.46,"text":"in terms of the order, it's always like this is bigger"},{"start":1936.36,"text":"than this, this is bigger than t e. But it will still be like this one is bigger than this. And the second one is bigger than the third one. But it won't be like all the math is on the first token. So basically, what I'm trying to say is that if tau is a small number so that you"},{"start":2045.63,"text":"you amplify the logits, then you are sharpening the resulting distribution to make it more like a similar state distribution. And then as a result, you are just sampling from the most likely token. You are taking the max as opposed to sampling from it. And that's actually what people actually do. They say, basically, I think actually,"}],"speech_gaps":[],"frame":"../frames/v041/012.webp","frame_time":1903.24},{"title":"温度参数与采样策略","segments":[{"id":221,"text":"In API call, you have the choice to choose the temperature. If you choose a small temperature, it means that you want more deterministic generation. If you choose a temperature to be zero, it means that your generation will just be always deterministic every time you take the largest, most likely token and then keep going on. Of course, you can also change the temperature to be bigger than one, which makes the distribution more softer so that you focus on more the long tail. You can generate more tokens from the tail so you have more stochasticity and uncertainty in your generation. Sometimes that's useful because you want to encourage some diversity in your generation and you do that. Especially in the RL, sometimes you have to do that.","zh":"在API调用中，你可以选择温度参数。如果你选择一个较小的温度值，这意味着你希望生成更加确定性的结果。如果你将温度设为零，这意味着每次生成时你只会选择最可能的标记，然后继续生成。当然，你也可以将温度设为大于一的值，这会使分布更加平滑，从而更关注长尾部分。你可以从长尾部分生成更多的标记，因此你的生成结果会具有更多的随机性和不确定性。有时候这样做是有用的，因为你想鼓励生成结果的多样性，你就会这么做。尤其是在强化学习中，有时候你必须这么做。","start":2071.79,"end":2099.79},{"id":222,"text":"tokens from the tail so you have more stochasticity and uncertainty in your generation. Sometimes that's useful because you want to encourage some diversity in your generation and you do that. Especially in the RL, sometimes you have to do that. Cool. Okay. Sounds good. Sometimes there are also other ways of sampling which is probably I shouldn't go into details. There are some notes in the lecture notes. So another way to do it is that you","zh":"从长尾部分生成标记，因此你的生成结果会具有更多的随机性和不确定性。有时候这样做是有用的，因为你想鼓励生成结果的多样性，你就会这么做。尤其是在强化学习中，有时候你必须这么做。好。好的。听起来不错。有时候还有其他采样方法，这可能是我应该不深入讲解的。在讲义中有相关说明。因此，另一种方法是：","start":2101.07,"end":2127.62},{"id":223,"text":"This vector right now, I have three dimensions. But actually, it's like a","zh":"这个向量现在有三个维度。但实际上，它就像一个","start":2129.03,"end":2131.43},{"id":224,"text":"the dimensionality is V, right? Which is like 250 or something. You can take top K and then drop all of the other dimensions. So you only sample from the most likely K tokens and you renormalize the distribution. So basically the first K tokens may not cover all the probabilistic mass. But still, that's probably easier to generate because you don't want to generate two rare tokens. So you just drop everything below top K and then generate. Okay.","zh":"维度是V，对吧？这大概是250左右。你可以选择前K个标记，然后丢弃其他所有维度。因此，你只会从最可能的K个标记中进行采样，并重新归一化分布。基本上，前K个标记可能不会覆盖所有的概率质量。但无论如何，这样生成可能更容易，因为你不想生成两个罕见的标记。因此，你只需丢弃所有低于前K的标记，然后进行生成。好的。","start":2132.17,"end":2161.73},{"id":225,"text":"Sounds good. So I think I'm probably. So this is the generation. And then for the training, I think I already described it a little bit. So when you do the training, you just compute the log likelihood, the negative log likelihood.","zh":"听起来不错。我想我大概已经讲完了。这就是生成过程。然后对于训练，我想我已经稍微描述过一些了。当你进行训练时，你只需计算对数似然，负对数似然。","start":2162.3,"end":2190.81},{"id":226,"text":"the negative log likelihood. And you say this is a log. So if you have example x1 up to xt, so the minus log p theta x1 up to xt, capital T, is just minus log the product of all of this, right? p theta x1, p theta x2 given x1, so on and so forth.","zh":"负对数似然。你说这是对数。因此，如果你有示例x1到xt，那么负对数pθ(x1到xt)，大写T，就是负对数所有这些的乘积，对吧？pθ(x1)，pθ(x2给x1)，依此类推。","start":2196.36,"end":2223.59},{"id":227,"text":"And this is minus the sum of the log of the p of xt given x1 up to xt minus 1. And then you change this to log of the softmax of p1 of this f theta.","zh":"并且这是负的，从x1到xt-1给定xt的p的对数之和。然后你将其改为softmax的p1的这个f theta的对数。","start":2231.14,"end":2250.54}],"notes":["本段主要讲解了温度参数（temperature）在生成模型中的作用。温度参数控制生成过程的随机性：较小的温度值使生成更确定，而较大的温度值则增加随机性，鼓励多样性。在强化学习（RL）中，有时需要这种随机性来探索更多可能性。","讲者提到除了温度参数外，还有其他采样方法，但未深入展开。例如，可以使用top-K采样，即只从最可能的K个标记中进行采样，并重新归一化分布。这种方法在生成时更高效，因为不需要处理罕见标记。","在训练过程中，讲者提到计算负对数似然（negative log likelihood）作为损失函数。负对数似然的计算基于条件概率的乘积，最终转化为对数概率的和。","讲者还提到，负对数似然的计算可以转换为对softmax函数的对数，这与模型的输出分布有关。这表明在训练过程中，模型的输出需要通过softmax函数进行归一化处理。","讲者在讲解过程中，部分句子存在断句和语法不完整的问题，例如“probably I shouldn't go into details”和“this is a log”等，这些可能是语音识别的误差，需要进一步确认。","讲者在讲解温度参数和采样策略时，强调了在生成过程中平衡确定性和随机性的重要性，特别是在需要多样性或探索的场景中，如强化学习。"],"formulas":[],"uncertainties":["probably I shouldn't go into details","this is a log"],"diagram":"none","start":2071.79,"end":2250.54,"asr_flags":[],"math_clarifications":["负对数似然公式需要明确其定义域和归一化条件，例如是否涉及归一化常数Z，以及softmax函数的定义是否与上下文一致。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2071.79,"text":"In API call, you have the choice to choose the temperature. If you choose a small temperature, it means that you want more deterministic generation. If you choose a temperature to be zero, it means that your generation will just be always deterministic every time you take the largest, most likely token and then keep going on. Of course, you can also change the temperature to be bigger than one, which makes the distribution more softer so that you focus on more the long tail. You can generate more"},{"start":2101.07,"text":"tokens from the tail so you have more stochasticity and uncertainty in your generation. Sometimes that's useful because you want to encourage some diversity in your generation and you do that. Especially in the RL, sometimes you have to do that. Cool. Okay. Sounds good. Sometimes there are also other ways of sampling which is probably I shouldn't go into details. There are some notes in the lecture notes. So another way to do it is that you"},{"start":2129.03,"text":"This vector right now, I have three dimensions. But actually, it's like a"},{"start":2132.17,"text":"the dimensionality is V, right? Which is like 250 or something. You can take top K and then drop all of the other dimensions. So you only sample from the most likely K tokens and you renormalize the distribution. So basically the first K tokens may not cover all the probabilistic mass. But still, that's probably easier to generate because you don't want to generate two rare tokens. So you just drop everything below top K and then generate. Okay."},{"start":2162.3,"text":"Sounds good. So I think I'm probably. So this is the generation. And then for the training, I think I already described it a little bit. So when you do the training, you just compute the log likelihood, the negative log likelihood."},{"start":2196.36,"text":"the negative log likelihood. And you say this is a log. So if you have example x1 up to xt, so the minus log p theta x1 up to xt, capital T, is just minus log the product of all of this, right? p theta x1, p theta x2 given x1, so on and so forth."},{"start":2231.14,"text":"And this is minus the sum of the log of the p of xt given x1 up to xt minus 1. And then you change this to log of the softmax of p1 of this f theta."}],"speech_gaps":[],"frame":"../frames/v041/013.webp","frame_time":2083.79},{"title":"Transformer 与上下文学习","segments":[{"id":228,"text":"And here, this Xt is a particular choice of Xt, which is seen in the data. So that means you are looking at the Xt's entry of the softmax. This softmax will give you the probability for every possible tokens, and then you are only interested in the probability to see that particular token Xt. So that's why you're looking at Xt's index of that vector. And that's a single scalar. You take the log, and you take the sum over t, and that's your loss function.","zh":"在这里，这个 Xt 是 Xt 的一个特定选择，它在数据中可以看到。这意味着你正在查看 softmax 的 Xt 入口。这个 softmax 会为你提供每个可能的 token 的概率，而你只关心看到这个特定 token Xt 的概率。这就是为什么你查看该向量的 Xt 索引。这是一个单一的标量。你取对数，并对 t 进行求和，这就是你的损失函数。","start":2257.1,"end":2283.76},{"id":229,"text":"And then you can optimize this loss function by, for example, some optimizers like SGD or IDEM. We didn't discuss IDEM in this lecture, which is an extension of the SGD optimizer, but mostly you can just call the optimizer as a black box to optimize the loss function. It's actually not a loss one, right? Because this is a sum from t equals 1 to capital T. The little t and larger T.","zh":"然后你可以通过一些优化器，例如 SGD 或 IDEM 来优化这个损失函数。我们在本节课中没有讨论 IDEM，它是 SGD 优化器的一个扩展，但大多数情况下，你可以将优化器当作一个黑箱来优化损失函数。实际上这不是一个损失函数，对吧？因为这是从 t 等于 1 到大写 T 的求和。小写 t 和大写 T。","start":2286.26,"end":2325.4},{"id":230,"text":"Okay, sounds good. Okay, so then in the next 30 minutes, I'm going to tell you what this function f is, right? Or maybe what's hidden in this transformer. What's the operation we have to do to compute the logits here? And it's pretty complicated, so it probably takes more than 30 minutes, but I'll see how much I can do. So, any questions before that? Okay.","zh":"好的，听起来不错。那么接下来的 30 分钟，我将告诉你们这个函数 f 是什么，对吧？或者也许是什么隐藏在 transformer 中的内容。为了计算这里的 logits，我们需要进行什么操作？这相当复杂，所以可能需要超过 30 分钟，但我会看看我能完成多少。那么，在此之前有任何问题吗？好的。","start":2333.83,"end":2367.53},{"id":231,"text":"So at a high level, this transformer has multiple layers. And so you start with like EX1 up to EXT. And you first apply a so-called attention layer, which I will define. And then you apply the so-called MLP. So first of all, the attention layer, the attention always takes in a sequence of factors and outputs a sequence of factors.","zh":"从高层次来看，这个 transformer 有多个层。你从 EX1 到 EXT 开始。你首先应用一个所谓的注意力层，我将对其进行定义。然后你应用所谓的 MLP。首先，注意力层，注意力总是接收一个因子序列并输出一个因子序列。","start":2368.17,"end":2394.14},{"id":232,"text":"So you output a bunch of vectors. At each position, you output one vector. And then each of these vectors will go through an MLP. MLP means like a multi-layer perception, which is just a two or three layer network. And each of these vectors will go through this MLP. And then you apply another attention. This attention will take in many, many vectors and then output a sequence of vectors. And then you do the MLP.","zh":"你输出一堆向量。在每个位置，你输出一个向量。然后每个这些向量都会通过一个 MLP。MLP 指的是多层感知机，它只是一个两层或三层的网络。每个这些向量都会通过这个 MLP。然后你应用另一个注意力。这个注意力将接收许多许多向量，然后输出一个向量序列。然后你进行 MLP。","start":2394.69,"end":2425.35}],"notes":["本段主要讲解了如何优化损失函数，提到了使用SGD或IDEM等优化器。IDEM是SGD的扩展，但本节课未详细讨论。优化器通常作为黑盒使用，用于最小化损失函数。注意这里的损失函数是关于时间步t从1到T的求和，其中t是小写，T是大写，表示总时间步数。","讲者提到损失函数是通过取对数并求和得到的，这与softmax输出的概率有关。在计算过程中，关注的是特定token Xt的概率，因此需要取Xt在softmax输出向量中的索引位置。"],"formulas":[],"uncertainties":["IDEM可能为听不清的术语，需确认是否为特定优化器名称。"],"diagram":"none","start":2257.1,"end":2425.35,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2257.1,"text":"And here, this Xt is a particular choice of Xt, which is seen in the data. So that means you are looking at the Xt's entry of the softmax. This softmax will give you the probability for every possible tokens, and then you are only interested in the probability to see that particular token Xt. So that's why you're looking at Xt's index of that vector. And that's a single scalar. You take the log, and you take the sum over t, and that's your loss function."},{"start":2286.26,"text":"And then you can optimize this loss function by, for example, some optimizers like SGD or IDEM. We didn't discuss IDEM in this lecture, which is an extension of the SGD optimizer, but mostly you can just call the optimizer as a black box to optimize the loss function. It's actually not a loss one, right? Because this is a sum from t to 1 to capital T. The little t and larger t."},{"start":2333.83,"text":"Okay, sounds good. Okay, so then in the next 30 minutes, I'm going to tell you what this function f is, right? Or maybe what's hidden in this transformer. What's the operation we have to do to compute the logits here? And it's pretty complicated, so it probably takes more than 30 minutes, but I'll see how much I can do. So, any questions before that? Okay."},{"start":2368.17,"text":"So at a high level, this transformer has multiple layers. And so you start with like EX1 up to EXT. And you first apply a so-called attention layer, which I will define. And then you apply the so-called MLP. So first of all, the attention layer, the attention always takes in a sequence of factors and outputs a sequence of factors."},{"start":2394.69,"text":"So you output a bunch of vectors. At each position, you output one vector. And then each of these vectors will go through an MLP. MLP means like a multi-layer perception, which is just a two or three layer network. And each of these vectors will go through this MLP. And then you apply another attention. This attention will take in many, many vectors and then output a sequence of vectors. And then you do the MLP."}],"speech_gaps":[],"frame":"../frames/v041/014.webp","frame_time":2269.1},{"title":"Transformer 与上下文学习","segments":[{"id":233,"text":"So that's the high-level structure of this attention. And eventually, you have to output. Remember, eventually, you have to output a sequence of vectors. So basically, you do enough of these alternations between these two, and eventually, you have this MLP, and you output some vectors u1 up to ut. And you alternate between attention and MLP. That's the high-level idea.","zh":"这就是这种注意力机制的高层次结构。最终，你必须输出。记住，最终，你必须输出一个向量序列。基本上，你在这两个操作之间进行足够的交替，最终你会得到一个MLP，并输出一些向量u1到ut。你交替进行注意力和MLP操作。这就是高层次的想法。","start":2428.17,"end":2454.32},{"id":234,"text":"I think we'll focus most of our energy on defining our attention which is the most new thing because MLP is just a two-layer network with some special gating or some special activation functions. Another small thing is that the MLP are sharing the parameters and they are applying independently. So each of these vectors is","zh":"我想我们会把大部分精力放在定义注意力机制上，因为这是最新颖的部分，而MLP只是一个带有特殊门控或特殊激活函数的两层网络。另一个小细节是，这些MLP共享参数，并且是独立应用的。因此，每个向量都会","start":2456.82,"end":2479.3},{"id":235,"text":"processed by the MLP in an independent fashion. There's no dependencies between positions when you apply the MLP. They are just very separate operations. So the only way that you are using, you fuse the input from different positions or different time steps is the attention. So the attention will look at all those vectors and process a little bit and then output a sequence of vectors. And MLP is very parallelized and parallelizable and independent.","zh":"被MLP独立处理。在应用MLP时，各个位置之间没有依赖关系。它们只是非常独立的操作。因此，你唯一使用的方式来融合来自不同位置或不同时间步的输入就是注意力。注意力会查看所有这些向量，进行一些处理，然后输出一个向量序列。而MLP是非常并行化和可并行化的，且是独立的。","start":2480.55,"end":2507.09},{"id":236,"text":"Now, let's define our attention. This entire thing will be trained as a single system. So basically, once you define the architecture, you apply the auto-differentiation. You train this whole thing as a gigantic network end-to-end. But the auto-differentiation still works.","zh":"现在，让我们定义我们的注意力机制。整个系统将作为一个整体进行训练。基本上，一旦你定义了架构，你就会应用自动微分。你将整个系统作为一个巨大的网络进行端到端训练。但自动微分仍然有效。","start":2510.65,"end":2542.61},{"id":237,"text":"So the auto-differentiation, I think as we discussed, if you remember, it's kind of fundamentalist claiming that if you have a way to compute your forward path, as long as there are compositions of many different components, like basic components, you can compute a backward path the same way. So here, it's indeed a composition of many small arithmetic operations because","zh":"自动微分，我想我们已经讨论过，如果你还记得，它是一种基本主义的主张，即如果你有一种计算前向路径的方法，只要有很多不同组件的组合，比如基本组件，你就可以用同样的方式计算反向路径。在这里，确实是由许多小的算术操作组成的","start":2543.22,"end":2564.98},{"id":238,"text":"As you see, the attention layer has many small matrix modifications, and the MLP has many matrix modifications, and you can automatically differentiate. Okay, so now let's talk about attention. So for attention, one thing to remember first is that the type signature is that you input a sequence of vectors to the attention, and they output a sequence of vectors.","zh":"正如你所见，注意力层有许多小的矩阵修改，而MLP也有许多矩阵修改，你可以自动微分。好的，现在让我们谈谈注意力。对于注意力，首先要记住的一点是，类型签名是：你将一个向量序列输入到注意力中，然后它们输出一个向量序列。","start":2565.51,"end":2604.17}],"notes":["本段主要讲解Transformer模型中注意力机制的定义和训练方式。讲者指出，整个模型将作为一个单一系统进行训练，通过自动微分技术实现端到端的训练。自动微分的关键在于，只要能够计算前向传播路径，就可以通过链式法则计算反向传播路径，即使模型由多个组件组成。"],"formulas":[],"uncertainties":["auto-defrustration"],"diagram":"none","start":2428.17,"end":2604.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2428.17,"text":"So that's the high-level structure of this attention. And eventually, you have to output. Remember, eventually, you have to output a sequence of vectors. So basically, you do enough of these alternations between these two, and eventually, you have this MLP, and you output some vectors u1 up to ut. And you alternate between attention and MLP. That's the high-level idea."},{"start":2456.82,"text":"I think we'll focus most of our energy on defining our attention which is the most new thing because MLP is just a two-layer network with some special gating or some special activation functions. Another small thing is that the MLP are sharing the parameters and they are applying independently. So each of these vectors is"},{"start":2480.55,"text":"processed by the MLP in an independent fashion. There's no dependencies between positions when you apply the MLP. They are just very separate operations. So the only way that you are using, you fuse the input from different positions or different time steps is the attention. So the attention will look at all those vectors and process a little bit and then output a sequence of vectors. And MLP is very parallelized and parallelizable and independent."},{"start":2510.65,"text":"Now, let's define our tension. This entire thing will be trained as a single system. So basically, once you define the architecture, you apply the auto-differentiation. You train this whole thing as a gigantic network end-to-end. But the auto-differentiation still works."},{"start":2543.22,"text":"So the auto-defrustration, I think as we discussed, if you remember, it's kind of fundamentalist claiming that if you have a way to compute your forward path, as long as there are compositions of many different components, like basic components, you can compute a backward path the same way. So here, it's indeed a composition of many small arithmetic operations because"},{"start":2565.51,"text":"As you see, the attention layer has many small matrix modifications, and the MLP has many matrix modifications, and you can automatically differentiate. Okay, so now let's talk about attention. So for attention, one thing to remember first is that the type signature is that you input a sequence of vectors to the attention, and they output a sequence of vectors."}],"speech_gaps":[],"frame":"../frames/v041/015.webp","frame_time":2440.17},{"title":"Transformer 与上下文学习：注意力机制的构建","segments":[{"id":239,"text":"We're going to start with the so-called single header tension. So the single header tension is like this. So you first have an input as a sequence of vectors. Let's say h1 in up to ht in. And you want to output h. I'm trying to define the type signature. So you output h1 out up to ht out.","zh":"我们将从所谓的单头张力开始。单头张力是这样的。首先，你有一个输入，它是一个向量序列。比如说，h1_in 到 ht_in。你想要输出 h。我正在尝试定义类型签名。所以你输出 h1_out 到 ht_out。","start":2606.9,"end":2641.52},{"id":240,"text":"And what you do is the following. So the first thing is that you turn these input vectors into a set of query key and value vectors. So basically, you say h1 in. You multiply it by a matrix, wq. This is a weight matrix. This is a parameter.","zh":"你所做的事情如下。首先，你将这些输入向量转换为一组查询、键和值向量。基本上，你可以说 h1_in。你将其乘以一个矩阵 wq。这是一个权重矩阵。这是一个参数。","start":2643.56,"end":2667.86},{"id":241,"text":"And, by the way, let's treat all of this as row vectors, and then all the multiplications on the right-hand side as opposed to on the left-hand side. So every vector is a row vector, and you multiply on the right-hand side, you get another row vector. So this h in, let's say this is like a dimension d, rd, let's say r1 by d, and this wq is in dimension, so this is r1 by d, and this wq is in rd by dh. dh is a parameter. It's a dimension you choose. And then the resulting thing is called q1, which is in dimension dh, maybe 1 by dh, depending on how you think about it.","zh":"顺便说一下，让我们将所有这些都视为行向量，然后所有在右边的乘法，而不是在左边的乘法。所以每个向量都是一个行向量，你在右边进行乘法运算，得到另一个行向量。所以这个 h_in，比如说，它的维度是 d，rd，比如说 r1 by d，而这个 wq 的维度是 rd by dh。dh 是一个参数。它是一个你选择的维度。然后得到的结果称为 q1，其维度是 dh，可能为 1 by dh，具体取决于你怎么考虑。","start":2670.85,"end":2698.77},{"id":242,"text":"dh. dh is a parameter. It's a dimension you choose. And then the resulting thing is called q1, which is in dimension dh, maybe 1 by dh, depending on how you think about it. And you can do this for every index, every time step. Here, I'm only doing it for time step 1. You can do it for time step t. So you have qt.","zh":"dh。dh 是一个参数。它是一个你选择的维度。然后得到的结果称为 q1，其维度是 dh，可能为 1 by dh，具体取决于你怎么考虑。你可以对每个索引、每个时间步都这样做。在这里，我只对时间步 1 进行了操作。你也可以对时间步 t 进行操作。所以你有 qt。","start":2701.79,"end":2725.85},{"id":243,"text":"So basically, this gives you a sequence of vectors q1 up to q, capital T. Each of them is in dimension 1 by dh. And these are called queries. And you do the same thing for keys and values. So keys.","zh":"基本上，这会给你一个向量序列 q1 到 q，大写 T。每个向量的维度是 1 by dh。这些被称为查询。你对键和值做同样的事情。键。","start":2726.45,"end":2743.93},{"id":244,"text":"Let me define them first. It's the same thing. You say the HT in multiplied by a so-called key projection matrix, WK, and that's your KT. And the dimensionality, I think, is the same. So this is also in the same dimension, and the KT is in the same dimension. And it's the same thing for value vectors, not value functions. HT in times WV. So in some sense, maybe,","zh":"让我先定义它们。同样的方法。你说 HT_in 乘以一个所谓的键投影矩阵 WK，这就是你的 KT。维度，我想，是相同的。所以这也是在相同的维度中，KT 也在相同的维度中。对于值向量，同样的事情，不是值函数。HT_in 乘以 WV。从某种意义上说，也许，","start":2745.06,"end":2773.94}],"notes":["本段讲解了Transformer模型中注意力机制的基础构建，包括输入序列的向量转换为查询（query）、键（key）和值（value）向量的过程。讲者提到，输入向量通过不同的权重矩阵（wq、wk、wv）进行变换，得到不同类型的向量。这些向量的维度由参数dh决定，且每个向量都是行向量，乘法操作在右侧进行。","讲者强调了向量的维度和矩阵的维度关系，例如输入向量的维度为r1 by d，权重矩阵wq的维度为r1 by d，而输出向量q1的维度为1 by dh。这表明输入向量经过变换后，其维度被调整为dh，这是模型设计中的一个可选参数。","讲者还提到，对于每个时间步（time step），都可以进行类似的变换，得到对应的查询向量qt。这表明Transformer模型在处理序列数据时，每个时间步的输入都会被独立处理，生成对应的查询、键和值向量。","讲者在定义键和值向量时，指出它们的变换方式与查询向量类似，即通过不同的权重矩阵（wk和wv）进行变换。这表明查询、键和值向量的生成过程是统一的，只是使用了不同的权重矩阵。","讲者提到“value vectors, not value functions”，这表明在Transformer模型中，值向量是直接与输入序列相关的，而不是某种函数的输出。这有助于理解注意力机制中值向量的作用。","讲者最后提到“in some sense, maybe”，这表明在定义值向量时，可能存在一些未明确说明的细节，需要进一步澄清。"],"formulas":[],"uncertainties":["dh is a parameter. It's a dimension you choose."],"diagram":"none","start":2606.9,"end":2773.94,"asr_flags":[],"math_clarifications":["原始片段中未明确说明向量和矩阵的维度，可能导致歧义。公式中的乘法符号应使用矩阵乘法符号'\\cdot'或明确说明为矩阵乘法。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2606.9,"text":"We're going to start with the so-called single header tension. So the single header tension is like this. So you first have an input as a sequence of vectors. Let's say h1 in up to ht in. And you want to output h. I'm trying to define the type signature. So you output h1 out up to ht out."},{"start":2643.56,"text":"And what you do is the following. So the first thing is that you turn these input vectors into a set of query key and value vectors. So basically, you say h1 in. You multiply it by a matrix, wq. This is a weight matrix. This is a parameter."},{"start":2670.85,"text":"And, by the way, let's treat all of this as row vectors, and then all the multiplications on the right-hand side as opposed to on the left-hand side. So every vector is a row vector, and you multiply on the right-hand side, you get another row vector. So this h in, let's say this is like a dimension d, rd, let's say r1 by d, and this wq is in dimension, so this is r1 by d, and this wq is in rd by,"},{"start":2701.79,"text":"dh. dh is a parameter. It's a dimension you choose. And then the resulting thing is called q1, which is in dimension dh, maybe 1 by dh, depending on how you think about it. And you can do this for every index, every time step. Here, I'm only doing it for time step 1. You can do it for time step t. So you have qt."},{"start":2726.45,"text":"So basically, this gives you a sequence of vectors q1 up to q, capital T. Each of them is in dimension 1 by dh. And these are called queries. And you do the same thing for keys and values. So keys."},{"start":2745.06,"text":"Let me define them first. It's the same thing. You say the HT in multiplied by a so-called key projection matrix, WK, and that's your KT. And the dimensionality, I think, is the same. So this is also in the same dimension, and the KT is in the same dimension. And it's the same thing for value vectors, not value functions. HT in times WV. So in some sense, maybe,"}],"speech_gaps":[],"frame":"../frames/v041/016.webp","frame_time":2618.9},{"title":"注意力机制的直观理解","segments":[{"id":245,"text":"maybe this is the right time to talk about some of the intuitions for the attention, which is not that obvious because eventually it just works. Nobody really knows exactly how it works. But the rough intuition is that you have to have some interactions between these inputs to make it meaningful. Because if everything is independent, then you're just dealing with all the time steps independently. So that's why you have to have some interactions. Interactions sometimes is about how do you","zh":"也许现在是谈论注意力机制的一些直观理解的好时机，这并不明显，因为最终它确实有效。没有人确切知道它是如何工作的。但大致的直观理解是，你必须在这些输入之间有一些相互作用，才能使其有意义。因为如果所有内容都是独立的，那么你就是在处理所有时间步独立地。因此，你必须有一些相互作用。相互作用有时指的是如何检索或关注彼此。因此，这就是“注意力”这个词的由来。基本上，当你处理可能这个向量时，你可能应该关注或注意一些包含相关信息的其他向量。你关注哪一个，就是我们在这里通过查询和键向量来决定的。从某种意义上说，直观地讲，注意力将要做的事情，我还没有展示给你，就是：","start":2775.6,"end":2802.05},{"id":246,"text":"retrieve or pay attention to each other. So that's actually how the word attention come from. So basically, when you are processing maybe this vector, you probably should attend to or pay attention to some other vectors which have relevant information. And which one you pay attention to is what we're going to decide here with this query and key and vectors. So in some sense, intuitively, what attention will do, which I didn't show you yet, is that","zh":"检索或相互注意。因此，这个词“attention”（注意力）的来源实际上就是如此。基本上，当你在处理这个向量时，你可能应该注意或关注一些包含相关信息的其他向量。而你究竟注意哪一个，就是我们通过这个查询向量和键向量来决定的。从某种意义上说，直观地讲，注意力将会做到的事情，也就是我还没有展示给你的，是","start":2803.87,"end":2830.43},{"id":247,"text":"you try to, for processing each of the vectors, you try to figure out which are the relevant vectors that has relevant information. And then you pay actual attention to those vectors. And then you compute the output depending on those special vectors to some degree.","zh":"这就是我们试图做的事情。为了决定你关注哪一个，你必须准备这些查询和键和值向量。你如何使用它们？你使用查询和键作为决定你关注什么的方式。基本上，假设你有第t个位置。我想决定：","start":2831.18,"end":2848.58},{"id":248,"text":"So that's what we are trying to do. And to decide which one you pay attention to, you have to prepare these queries and key and value vectors. And how do you use them? So you use the query and keys as a way to decide which one you pay attention to. So basically, let's say, suppose you have the t-th position. I want to decide.","zh":"第t个位置应该关注什么。实现的方法是，你计算查询qt。这是第t个位置的查询。然后你将查询与所有其他位置的键相乘。也许我将画一个图。你有查询q1到qt。其中一个就是：","start":2849.29,"end":2872.58},{"id":249,"text":"what the t's position should pay attention to. And the way to do it is you say you compute the query qt. This is the query at t's position. And you multiply the query with the keys at all the other positions. So maybe I will just draw it. So you have queries q1 up to qt. And one of them is.","zh":"q小t。你询问q k1到kt。然后你将q与所有k相乘。因此，你有q1乘以k1的转置，qt乘以k2的转置，以及qt乘以k大写T的转置。","start":2873.51,"end":2898.81},{"id":250,"text":"q little t. And you ask q k1 up to kt. And you multiply q's with all the k's. So you have q1 times k1 transpose, qt times k2 transpose, and qt times k capital T transpose.","zh":"你有q1乘以k1的转置，qt乘以k2的转置，以及qt乘以k大写T的转置。","start":2899.38,"end":2924.04},{"id":251,"text":"Sometimes there's a scaling factor here to normalize this in a way that makes it a little bit more well-behaved. But I think for the moment, you probably don't have to pay too much attention to the scaling factor. So the important thing is that you are taking the inner product between q's and each of the other k's. And this qt transpose k transpose is actually the inner product, because q is a row vector, and k transpose is a column vector.","zh":"有时候这里会有一个缩放因子，用来以一种使其更加稳定的方式进行归一化。但我想，目前你可能不需要太关注这个缩放因子。重要的是，你是在计算q与每个其他k之间的内积。而qt转置乘以k转置实际上是内积，因为q是一个行向量，而k转置是一个列向量。","start":2927.74,"end":2955.36}],"notes":["本段讲解了注意力机制的基本概念，即通过交互来获取有意义的信息。讲者指出，如果所有输入都是独立的，那么模型将无法捕捉到时间序列中的依赖关系，因此需要引入交互机制。","讲者解释了注意力机制的来源，即通过查询（query）、键（key）和值（value）向量来决定哪些信息需要关注。查询和键用于计算注意力权重，而值则用于生成最终的输出。","讲者进一步说明了如何计算注意力权重，即通过查询向量与所有键向量的内积来决定每个位置的注意力权重。这一过程是注意力机制的核心。","讲者提到，为了使注意力权重更稳定，有时会引入一个缩放因子，但目前可以暂时忽略这一细节。","讲者强调了内积在注意力机制中的重要性，指出查询向量和键向量的内积是计算注意力权重的关键步骤。","讲者通过具体的例子说明了注意力机制的运作方式，即通过查询向量与所有键向量的内积来决定哪些信息需要关注，并据此生成输出。"],"formulas":[{"latex":"q_t^T k_i","symbols":"查询向量与键向量的内积","explanation":"公式正确表示了查询向量 $ q_t $ 与键向量 $ k_i $ 的内积，符合注意力机制中通过内积计算相似度的原理。","evidence":"Sometimes there's a scaling factor here to normalize this in a way that makes it a little bit more well-behaved. But I think for the moment, you probably don't have to pay too much attention to the scaling factor. So the important thing is that you are taking the inner product between q's and each of the other k's. And this qt transpose k transpose is actually the inner product, because q is a row vector, and k transpose is a column vector."}],"uncertainties":[],"diagram":"none","start":2775.6,"end":2955.36,"asr_flags":[],"math_clarifications":["公式 $ q_t^T k_i $ 正确表示了查询向量与键向量的内积，符合注意力机制中通过内积计算相似度的原理。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2775.6,"text":"maybe this is the right time to talk about some of the intuitions for the attentions, which is not that obvious because eventually it just works. Nobody really know exactly how it works. But the rough intuition is that you have to have some interactions between these inputs to make it meaningful. Because if everything is independent, then you're just dealing with all the time steps independently. So that's why you have to have some interactions. Interactions sometimes is about how do you"},{"start":2803.87,"text":"retrieve or pay attention to each other. So that's actually how the word attention come from. So basically, when you are processing maybe this vector, you probably should attend to or pay attention to some other vectors which have relevant information. And which one you pay attention to is what we're going to decide here with this query and key and vectors. So in some sense, intuitively, what attention will do, which I didn't show you yet, is that"},{"start":2831.18,"text":"you try to, for processing each of the vectors, you try to figure out which are the relevant vectors that has relevant information. And then you pay actual attention to those vectors. And then you compute the output depending on those special vectors to some degree."},{"start":2849.29,"text":"So that's what we are trying to do. And to decide which one you pay attention to, you have to prepare these queries and key and value vectors. And how do you use them? So you use the query and keys as a way to decide which one you pay attention to. So basically, let's say, suppose you have the t-th position. I want to decide."},{"start":2873.51,"text":"what the t's position should pay attention to. And the way to do it is you say you compute the query qt. This is the query at t's position. And you multiply the query with the keys at all the other positions. So maybe I will just draw it. So you have queries q1 up to qt. And one of them is."},{"start":2899.38,"text":"q little t. And you ask q k1 up to kt. And you multiply q's with all the k's. So you have q1 times k1 transpose, qt times k2 transpose, and qt times k capital T transpose."},{"start":2927.74,"text":"Sometimes there's a scaling factor here to normalize this in a way that makes it a little bit more well-behaved. But I think for the moment, you probably don't have to pay too much attention to the scaling factor. So the important thing is that you are taking the inner product between q's and each of the other k's. And this qt transpose k transpose is actually the inner product, because q is a row vector, and k transpose is a column vector."}],"speech_gaps":[{"start":2925.328,"end":2927.34}],"frame":"../frames/v041/017.webp","frame_time":2787.6},{"title":"Transformer 中的注意力机制与概率向量","segments":[{"id":252,"text":"And you are taking the inner product between these row vectors and the column vectors, and you get one scalar out of it. So all of these numbers are real numbers, right? So this is in RT. So you have T real numbers. And then you take a softmax over these T real numbers to turn it into a probability vector. So then you say, I'm going to do a softmax of this whole thing.","zh":"你正在将这些行向量与列向量进行内积运算，并从中得到一个标量。因此，所有这些数字都是实数，对吧？因此，这是在实数域 RT 中。你有 T 个实数。然后你对这些 T 个实数进行 softmax 运算，将其转换为一个概率向量。因此，你会说，我要对整个内容进行 softmax 运算。","start":2957.58,"end":2989.1},{"id":253,"text":"Now you get what? You get this is a vector, the dimensionality here is rt, and the outcome of the softmax is a sequence of numbers. There are t numbers, and all of these numbers are non-active, and the sum of them is one. So it's a probability vector over t positions. If you see a large number, it means that","zh":"现在你得到了什么？你得到了一个向量，这里的维度是 rt，softmax 的结果是一个数字序列。有 t 个数字，而且所有这些数字都是非负的，它们的总和为 1。因此，这是一个在 t 个位置上的概率向量。如果你看到一个大的数字，这意味着","start":2997.43,"end":3020.71},{"id":254,"text":"let's say suppose this number is big, it means that this number is somewhat big compared to other ones. It means that the Qs and Qs have more higher inner product. And it means that you should pay more attention to K, K1. So basically, if any of these entries is big, it means that intuitively,","zh":"假设这个数字很大，这意味着这个数字与其他数字相比有些大。这意味着 Q 与 Q 的内积更高。这意味着你应该更加关注 K、K1。基本上，如果这些条目中的任何一个很大，这意味着直观上，","start":3022.08,"end":3041.84},{"id":255,"text":"Qt needs to pay more attention to K1. And that will be reflected by the probability vectors because the corresponding probability will also be high. And so I think let's call this, I guess I have a notation here. So let's call this, let's denote this to be Pt1, Pt2, up to Pt capital T. So each of the Pti is","zh":"Qt 需要更加关注 K1。这将通过概率向量反映出来，因为相应的概率也会很高。因此，我认为我们可以称这个，我想这里有一个记号。所以，我们可以称这个，让我们将它表示为 Pt1、Pt2，一直到 Pt 大写 T。每个 Pti 都是","start":3043.97,"end":3068.99},{"id":256,"text":"each of the Pt i is non-active and the sum of the Pt i over i from one to t is equal to one. So this is a probability vector. If any of these entries is big, it means that we should pay more attention to that particular position when processing the little t's query.","zh":"每个 Pt i 都是非负的，且 Pt i 在 i 从 1 到 t 的总和等于 1。因此，这是一个概率向量。如果这些条目中的任何一个很大，这意味着在处理小 t 的查询时，我们应该更加关注该特定位置。","start":3070.19,"end":3097.72},{"id":257,"text":"the output at t's position, which is a vector, is using these probability vectors to weight the values. The values is v's, which we are defining here, vt. So you say it's pt1 times v1 plus pt2 times v2 plus ptt times vt. So basically, if any of this","zh":"在 t 位置的输出，这是一个向量，它使用这些概率向量来加权值。值是 v 的，我们在这里定义为 vt。因此，你会说它是 pt1 乘以 v1 加上 pt2 乘以 v2 加上 ptt 乘以 vt。基本上，如果其中任何一个","start":3098.47,"end":3128.27}],"notes":["本段讲解了Transformer模型中注意力机制的核心思想，即通过计算查询向量（Q）与键向量（K）之间的内积，得到一个标量值，然后通过softmax函数将其转换为概率向量。概率向量中的每个元素表示对应位置的注意力权重，权重越大，表示该位置的信息越重要。","在注意力机制中，概率向量的每个元素都是非负的，并且所有元素的和为1，这使得它成为一个有效的概率分布。当某个元素的值较大时，意味着对应的键向量（K）与查询向量（Q）之间的内积较大，因此需要在处理查询时给予更多的关注。","概率向量用于加权求和值向量（V），从而得到最终的输出。这种加权求和的方式使得模型能够根据注意力权重动态地组合不同的值向量，从而实现对输入序列中不同位置信息的灵活关注。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2957.58,"end":3128.27,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2957.58,"text":"And you are taking the inner product between these row vectors and the column vectors, and you get one scalar out of it. So all of these numbers are real numbers, right? So this is in RT. So you have T real numbers. And then you take a softmax over these T real numbers to turn it into a probability vector. So then you say, I'm going to do a softmax of this whole thing."},{"start":2997.43,"text":"Now you get what? You get this is a vector, the dimensionality here is rt, and the outcome of the softmax is a sequence of numbers. There are t numbers, and all of these numbers are non-active, and the sum of them is one. So it's a probability vector over t positions. If you see a large number, it means that"},{"start":3022.08,"text":"let's say suppose this number is big, it means that this number is somewhat big compared to other ones. It means that the Qs and Qs have more higher inner product. And it means that you should pay more attention to K, K1. So basically, if any of these entries is big, it means that intuitively,"},{"start":3043.97,"text":"Qt needs to pay more attention to K1. And that will be reflected by the probability vectors because the corresponding probability will also be high. And so I think let's call this, I guess I have a notation here. So let's call this, let's denote this to be Pt1, Pt2, up to Pt capital T. So each of the Pti is"},{"start":3070.19,"text":"each of the Pt i is non-active and the sum of the Pt i over i from one to t is equal to one. So this is a probability vector. If any of these entries is big, it means that we should pay more attention to that particular position when processing the little t's query. Then how does this relate to the final outcome? So finally, once you have this, then you say,"},{"start":3098.47,"text":"the output at t's position, which is a vector, is using these probability vectors to weight the values. The values is v's, which we are defining here, vt. So you say it's pt1 times v1 plus pt2 times v2 plus ptt times vt. So basically, if any of this"}],"speech_gaps":[],"frame":"../frames/v041/018.webp","frame_time":2969.58},{"title":"Transformer 与上下文学习","segments":[{"id":258,"text":"The probability is much higher than you are multiplying this high probability with the corresponding value at that position. So basically, you are using the v. For example, if this number is very big, then you are using v2 a lot in the output at time t. So you determine them by multiplying the matrices, and the matrices will be trained.","zh":"这个概率比你将这个高概率乘以该位置对应的值要高得多。所以基本上，你是在使用v。例如，如果这个数值非常大，那么你在时间t的输出中会大量使用v2。这些值是通过矩阵相乘确定的，而这些矩阵会被训练。","start":3129.38,"end":3156.55},{"id":259,"text":"How do you attend to each other is also trend. So you're only giving a template in some sense. It could be that all of these are zero, then you are not doing anything with it, and then the loss function will be not good, but it's still a valid new at work, it's just the loss is not good. So eventually, you are going to train the model to behave well so basically,","zh":"你们如何相互关注也是一个趋势。所以你只是在某种程度上提供了一个模板。有可能所有这些值都是零，那么你就不会对它做任何事情，此时损失函数表现不好，但它仍然是一个有效的模型，只是损失不好。所以最终，你会训练模型使其表现良好，基本上，","start":3159.57,"end":3184.69},{"id":260,"text":"The training algorithms will choose the right W so that this mechanism is doing the right thing. So let's try to articulate. I think it's a good question, but let's try to articulate so that we can answer it.","zh":"训练算法会选择合适的W，使得这种机制能够正确运作。让我们尝试阐述。我认为这是一个好问题，但让我们尝试阐述，以便能够回答它。","start":3185.71,"end":3212.39},{"id":261,"text":"So I think you are asking why you need such architecture, but not just only using MLP, for example. That's one way to rephrase the question. So if you are only using MLP in this way, suppose you remove all the tensions. You are only using MLP in this way, then there's no interactions between.","zh":"所以我认为你是在问为什么需要这样的架构，而不是仅仅使用MLP，例如。这是对这个问题的一种重新表述方式。如果你仅仅以这种方式使用MLP，假设你移除所有的注意力机制，你只以这种方式使用MLP，那么不同位置之间就没有任何交互。","start":3237.34,"end":3259.15},{"id":262,"text":"different positions whatsoever. So there's no chance that it's going to work. You are just applying separate networks for each of the tokens. There's no chance you can understand the dependencies, the meanings. There's no chance I can just give you individual words and you can understand the sentence. There's no chance. So you do have to have a model that can read","zh":"完全没有可能起作用。你只是对每个标记应用单独的网络。你完全没有机会理解依赖关系和含义。我也不可能仅仅给你一些单独的单词，你就能够理解整个句子。完全没有可能。因此，你必须有一个能够阅读","start":3259.65,"end":3282.19}],"notes":["本段讨论了Transformer模型中注意力机制的作用，强调了通过乘以高概率值来决定输出中使用哪些向量。例如，当某个值很大时，模型会更多地使用对应的向量v2。这种机制通过矩阵相乘实现，并且矩阵会在训练过程中被优化。","讲者指出，注意力机制的实现方式是提供一个模板，但若所有值都为零，则模型不会进行任何操作，此时损失函数可能不佳，但模型仍能运行。最终，模型会通过训练来表现良好。","讲者提到训练算法会选择合适的权重W，以确保注意力机制能正确工作。他鼓励进一步澄清问题，以便更好地回答。","讲者解释了为何需要使用Transformer架构而非仅使用MLP。如果仅使用MLP，模型将无法捕捉不同位置之间的交互，导致无法理解依赖关系和句子含义。","讲者强调，仅使用单独的网络处理每个标记会导致模型无法理解上下文，因此必须使用能够读取上下文的模型。"],"formulas":[],"uncertainties":["new at work"],"diagram":"none","start":3129.38,"end":3282.19,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3129.38,"text":"probability is much higher than you are multiplying this high probability with the corresponding value at that position. So basically, you are using the v. For example, if this number is very big, then you are using v2 a lot in the output at time t. So you determine them by multiplying the matrices, and the matrices will be trained."},{"start":3159.57,"text":"How do you attend to each other is also trend. So you're only giving a template in some sense. It could be that all of these are zero, then you are not doing anything with it, and then the loss function will be not good, but it's still a valid new at work, it's just the loss is not good. So eventually, you are going to train the model to behave well so basically,"},{"start":3185.71,"text":"The training algorithms will choose the right W so that this mechanism is doing the right thing. So let's try to articulate. I think it's a good question, but let's try to articulate so that we can answer it."},{"start":3237.34,"text":"So I think you are asking why you need such architecture, but not just only using MLP, for example. That's one way to rephrase the question. So if you are only using MLP in this way, suppose you remove all the tensions. You are only using MLP in this way, then there's no interactions between."},{"start":3259.65,"text":"different positions whatsoever. So there's no chance that it's going to work. You are just applying separate networks for each of the tokens. There's no chance you can understand the dependencies, the meanings. There's no chance I can just give you individual words and you can understand the sentence. There's no chance. So you do have to have a model that can read"}],"speech_gaps":[{"start":3157.216,"end":3159.17},{"start":3212.79,"end":3214.32},{"start":3215.728,"end":3218.096},{"start":3223.632,"end":3227.44},{"start":3229.008,"end":3230.608},{"start":3231.568,"end":3236.94}],"frame":"../frames/v041/019.webp","frame_time":3141.38},{"title":"Transformer 与上下文学习的结构设计","segments":[{"id":263,"text":"all the tokens and study their correlations and combinations, so on and so forth. But there are other possible ways to deal with that. For example, what if you use a gigantic MLP that takes in all of this, maybe you concatenate all of them and you take in one MLP. So for example, you just concatenate all of these tokens vectors into one long vector and you go through a network.","zh":"所有标记都被处理并研究它们的相关性和组合，如此等等。但还有其他可能的方式来处理这个问题。例如，如果你使用一个巨大的MLP来处理所有这些信息，也许你可以将它们全部连接起来，然后输入一个MLP。例如，你只需将所有这些标记向量连接成一个长向量，然后通过一个网络。","start":3284.41,"end":3312.43},{"id":264,"text":"So there are several issues with that. One is that, you will have way too many parameters. Because your sequence length may be sometimes even millions. Then if you have a million by million matrices in your MLP, it's going to be way too big. Right now, the MLP is actually very small. It only takes in a vector for one position. It doesn't even depend on t. And another thing is that not only the size of the MLP is big, but also the size of the MLP also changes over.","zh":"这种方法存在几个问题。其中之一是，你将拥有过多的参数。因为序列长度有时甚至可能达到数百万。如果你在MLP中使用一个百万乘百万的矩阵，那么它将变得非常庞大。目前，MLP实际上非常小。它只接收一个位置的向量，甚至不依赖于时间t。另一个问题是，不仅MLP的大小很大，而且MLP的大小还会随着序列长度的变化而变化。","start":3313.28,"end":3337.88},{"id":265,"text":"as you change the sequence length,","zh":"随着序列长度的变化，","start":3339.17,"end":3340.61},{"id":266,"text":"which is also very undesirable.","zh":"这也是非常不理想的。","start":3340.77,"end":3342.27},{"id":267,"text":"Because, for example, if you tune with sequence length","zh":"例如，如果你在序列长度为1,000的情况下进行调优，","start":3342.41,"end":3344.11},{"id":268,"text":"1,000 and then you test with sequence length 1,001,","zh":"1,000，然后你测试序列长度为1,001的情况，","start":3344.11,"end":3347.61},{"id":269,"text":"then you have to change your parameter count,","zh":"你就必须改变参数数量，","start":3347.81,"end":3349.33},{"id":270,"text":"which is not good.","zh":"这并不是一个好的做法。","start":3349.63,"end":3351.25},{"id":271,"text":"And here, if you really look into details,","zh":"而且，如果你仔细观察细节，","start":3351.59,"end":3353.59},{"id":272,"text":"you'll find out that the number of parameters","zh":"你会发现参数的数量","start":3353.73,"end":3355.79},{"id":273,"text":"doesn't depend on the sequence length.","zh":"并不依赖于序列长度。","start":3356.57,"end":3358.85},{"id":274,"text":"You have this gigantic amount here","zh":"你在这里看到的是一个巨大的数值","start":3361.07,"end":3363.15},{"id":275,"text":"that is too big to compute,","zh":"这个数值太大以至于无法计算，","start":3363.15,"end":3364.87},{"id":276,"text":"but you kind of know that there is some structure","zh":"但你大概知道其中存在某种结构，","start":3365.13,"end":3368.89},{"id":277,"text":"because there are words that match other words.","zh":"因为有些词与其他词是匹配的。","start":3368.89,"end":3371.63},{"id":278,"text":"So this is kind of trying to learn the structure","zh":"因此，这在某种程度上是在尝试学习这种结构。","start":3371.79,"end":3374.75},{"id":279,"text":"to make it more efficient.","zh":"以提高效率。","start":3375.39,"end":3376.45},{"id":280,"text":"Exactly.","zh":"没错。","start":3377.15,"end":3377.63},{"id":281,"text":"So you know that if you have sufficient compute,","zh":"所以你知道，如果你有充足的计算资源，","start":3377.81,"end":3381.41},{"id":282,"text":"probably your gigantic MLP will work.","zh":"你的巨大MLP可能就会有效。","start":3382.11,"end":3384.09},{"id":283,"text":"If you have sufficient data so you don't overfit,","zh":"如果你有足够的数据以避免过拟合，","start":3384.19,"end":3386.13},{"id":284,"text":"and you have sufficient compute, then there","zh":"并且你有充足的计算资源，那么就存在","start":3386.23,"end":3388.77},{"id":285,"text":"is some MLP that can actually solve this problem.","zh":"一个MLP实际上可以解决这个问题。","start":3388.77,"end":3390.91},{"id":286,"text":"But that's too expensive, so you need to prescribe","zh":"但这样做成本太高，因此你需要规定","start":3391.23,"end":3394.71},{"id":287,"text":"structure so that you can reduce the complexity. And this is the prescription we have. But you still have to leave enough flexibilities. You cannot just say, for example, one way to do it is you just say, let's average. Then there's no parameters. You just prescribe too much. You dictate too much. Then that's not good. So it's kind of like you strike a balance between how much structure you introduce and how much flexibility you give the models to figure out. Yeah.","zh":"设计结构以便你可以降低复杂度。这是我们所采用的方案。但你仍然必须保留足够的灵活性。你不能仅仅说，例如，一种方法就是你直接取平均值。这样就没有参数了。你规定得太多了。你过于直接地决定了。这样是不好的。因此，这有点像在你引入的结构多少和模型用来解决问题的灵活性之间取得平衡。对吧。","start":3396.33,"end":3423.14},{"id":288,"text":"Yeah, any other questions? By the way, there is actually, in the history, there was actually other ways to deal with this sequence. For example, you can use a convolutional network on this, which is kind of like MLP. So you use MLP, but with a specific receptive field so that each time you only see kind of like a window. I think there are still papers that says that that's not","zh":"对吧，还有其他问题吗？顺便说一下，在历史上，确实存在其他处理这种序列的方法。例如，你可以使用卷积网络来处理这个问题，这在某种程度上类似于多层感知机（MLP）。你使用MLP，但具有特定的感受野，使得每次只看到一个窗口。我认为仍然有论文指出这种方法并不好。","start":3426.04,"end":3451.66}],"notes":["本段讨论了使用巨型MLP处理序列数据的问题，指出其参数量过大，且参数数量随序列长度变化，导致模型难以适应不同长度的输入。讲者强调，虽然理论上足够大的MLP可以解决问题，但实际中由于计算和数据量的限制，这种方法并不高效。","讲者进一步指出，为了减少复杂度，需要引入结构化设计，但又不能过度限制模型的灵活性。这类似于在结构和灵活性之间找到平衡，以确保模型既能有效学习数据的结构，又能保持足够的适应能力。","讲者提到，历史上还有其他方法处理序列数据，例如使用卷积网络，这种方法类似于MLP，但通过特定的感受野设计，每次只关注局部窗口。这表明，除了Transformer之外，还有其他方法可以处理序列数据，但可能不如Transformer灵活。","讲者强调，模型设计需要在结构和灵活性之间找到平衡，不能过度限制模型，也不能完全放弃结构化设计。这反映了机器学习模型设计中的一个核心原则，即在复杂性和效率之间进行权衡。","讲者提到，如果模型具有足够的计算资源和数据量，理论上可以使用巨型MLP解决问题，但实际中由于资源限制，这种方法并不现实。这说明了在实际应用中，模型设计需要考虑计算和数据的可行性。","讲者最后提到，卷积网络是一种可能的替代方法，但可能不如Transformer灵活。这表明，虽然Transformer是当前处理序列数据的主流方法，但还有其他方法可以考虑，具体取决于应用场景和需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3284.41,"end":3451.66,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":3284.41,"text":"all the tokens and study their correlations and combinations, so on and so forth. But there are other possible ways to deal with that. For example, what if you use a gigantic MLP that takes in all of this, maybe you concatenate all of them and you take in one MLP. So for example, you just concatenate all of these tokens vectors into one long vector and you go through a network. So there are several issues with that. One is that,"},{"start":3313.28,"text":"you will have way too many parameters. Because your sequence length may be sometimes even millions. Then if you have a million by million matrices in your MLP, it's going to be way too big. Right now, the MLP is actually very small. It only takes in a vector for one position. It doesn't even depend on t. And another thing is that not only the size of the MLP is big, but also the size of the MLP also changes over."},{"start":3339.17,"text":"as you change the sequence length,"},{"start":3340.77,"text":"which is also very undesirable."},{"start":3342.41,"text":"Because, for example, if you tune with sequence length"},{"start":3344.11,"text":"1,000 and then you test with sequence length 1,001,"},{"start":3347.81,"text":"then you have to change your parameter count,"},{"start":3349.63,"text":"which is not good."},{"start":3351.59,"text":"And here, if you really look into details,"},{"start":3353.73,"text":"you'll find out that the number of parameters"},{"start":3356.57,"text":"doesn't depend on the sequence length."},{"start":3361.07,"text":"You have this gigantic amount here"},{"start":3363.15,"text":"that is too big to compute,"},{"start":3365.13,"text":"but you kind of know that there is some structure"},{"start":3368.89,"text":"because there are words that match other words."},{"start":3371.79,"text":"So this is kind of trying to learn the structure"},{"start":3375.39,"text":"to make it more efficient."},{"start":3377.15,"text":"Exactly."},{"start":3377.81,"text":"So you know that if you have sufficient compute,"},{"start":3382.11,"text":"probably your gigantic MLP will work."},{"start":3384.19,"text":"If you have sufficient data so you don't overfit,"},{"start":3386.23,"text":"and you have sufficient compute, then there"},{"start":3388.77,"text":"is some MLP that can actually solve this problem."},{"start":3391.23,"text":"But that's too expensive, so you need to prescribe"},{"start":3396.33,"text":"structure so that you can reduce the complexity. And this is the prescription we have. But you still have to leave enough flexibilities. You cannot just say, for example, one way to do it is you just say, let's average. Then there's no parameters. You just prescribe too much. You dictate too much. Then that's not good. So it's kind of like you strike a balance between how much structure you introduce and how much flexibility you give the models to figure out. Yeah."},{"start":3426.04,"text":"Yeah, any other questions? By the way, there is actually, in the history, there was actually other ways to deal with this sequence. For example, you can use a convolutional network on this, which is kind of like MLP. So you use MLP, but with a specific receptive field so that each time you only see kind of like a window. I think there are still papers that says that that's not"}],"speech_gaps":[],"frame":"../frames/v041/020.webp","frame_time":3296.41},{"title":"Transformer 与上下文学习","segments":[{"id":289,"text":"a terrible idea. Actually, if you use a convolutional network, it actually can work to some degree. It's just not as good as this one. And also, you can see there are also other, probably we'll talk about that later. So there are other variants of attention that do similar stuff but have better efficiency. Anyway, so let's continue. We are not done yet, actually. This is only a so-called single-head attention. Actually, the real thing is a little more complicated.","zh":"这是个糟糕的主意。实际上，如果你使用卷积网络，它在某种程度上是可以工作的。只是不如这个好。此外，你也可以看到还有其他变体，我们之后可能会讨论。因此，还有其他类型的注意力机制，它们执行类似的操作但效率更高。无论如何，我们还没结束。这只是一个所谓的单头注意力。实际上，真正的实现要复杂一些。","start":3452.22,"end":3481.1},{"id":290,"text":"But let's see. Before I go into that, let's see. So I think you can see the notation scale is very messy. So let's try to simplify it a little bit so that we don't have to always work with this messy notation. So one typical way that people simplify this is that you try to organize all the queries into a matrix.","zh":"不过，让我们先看看。在我深入讲解之前，让我们看看。我认为你可以看到这里的符号表示非常混乱。所以让我们尝试简化一下，这样我们就不必一直处理这种混乱的符号。人们通常简化这种表示的一种典型方式是将所有的查询组织成一个矩阵。","start":3483.91,"end":3509.9},{"id":291,"text":"Recall that each of the queries is a row vector. And if you put them all in a matrix, then this is a matrix of dimension t by dh. And you can put all the keys into a matrix. And you can put all the values in your matrix as well. And then you can write this h out, the output signal factors as kind of like a","zh":"回想一下，每个查询都是一个行向量。如果你将它们全部放入一个矩阵中，那么这个矩阵的维度是 t by dh。你也可以将所有的键放入一个矩阵中，同样，你也可以将所有的值放入一个矩阵中。然后你可以写出这个 h，输出信号可以表示为某种形式的","start":3510.73,"end":3548.81},{"id":292,"text":"Also, as a matrix, in some sense, you do a softmax of the role of this qk transpose divided by c matrix times v. So here, basically, this qk matrix, qk transpose matrix, is the family of qi times kj transpose divided by c. So every entry is of this form, which is kind of like this, guys.","zh":"此外，作为矩阵，从某种意义上说，你对这个 qk 转置除以 c 矩阵进行 softmax 操作，再乘以 v。在这里，基本上，这个 qk 矩阵，qk 转置矩阵，是 qi 乘以 kj 转置除以 c。所以每个元素都是这种形式，类似于这样，各位。","start":3551.5,"end":3578.96},{"id":293,"text":"And then if you do a row softmax, that corresponds to this softmax. And then if you multiply by v, it means this linear combination. I think we probably don't have enough time to.","zh":"然后如果你对行进行 softmax，这对应于这个 softmax。然后如果你乘以 v，这意味着这种线性组合。我认为我们可能没有足够的时间","start":3579.51,"end":3591.01},{"id":294,"text":"go into the details, but you can double-check. It's just a very basic linear algebra. It's mostly just notations. So this Qk divided by C matrix is the inner product between the queries and keys, and then you take a row-wide softmax to get the probabilities. So after the softmax, this matrix becomes, every row is a probability vector, and then you multiply that with the V to take the linear combination of these.","zh":"深入细节，但你可以自行检查。这只是一个非常基础的线性代数。主要是符号表示的问题。因此，这个 Qk 除以 C 矩阵是查询和键之间的内积，然后你对行进行 softmax 操作以得到概率。softmax 之后，这个矩阵的每一行都是一个概率向量，然后你将其与 V 相乘，以对这些值进行线性组合。","start":3592.13,"end":3616.47}],"notes":["本段主要讲解Transformer模型中的注意力机制，特别是单头注意力的结构。讲者指出，使用卷积网络虽然可以实现一定程度的功能，但效果不如注意力机制。同时，讲者提到注意力机制有其他变体，这些变体在效率上可能更好。"],"formulas":[],"uncertainties":["t by dh"],"diagram":"none","start":3452.22,"end":3616.47,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的数学定义和上下文信息，无法准确判断公式的数学正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3452.22,"text":"a terrible idea. Actually, if you use a convolutional network, it actually can work to some degree. It's just not as good as this one. And also, you can see there are also other, probably we'll talk about that later. So there are other variants of tensions that does similar stuff but have better efficiency. Anyway, so let's continue. We are not done yet, actually. This is only a so-called single-head tension. Actually, the real thing is a little more complicated."},{"start":3483.91,"text":"But let's see. Before I go into that, let's see. So I think you can see the notation scale is very messy. So let's try to simplify it a little bit so that we don't have to always work with this messy notation. So one typical way that people simplify this is that you try to organize all the queries into a matrix."},{"start":3510.73,"text":"Recall that each of the cores is a row vector. And if you put them all in a matrix, then this is a matrix of dimension t by dh. And you can put all the keys into a matrix. And you can put all the values in your matrix as well. And then you can write this h out, the output signal factors as kind of like a"},{"start":3551.5,"text":"Also, as a matrix, in some sense, you do a softmax of the role of this qk transpose divided by c matrix times v. So here, basically, this qk matrix, qk transpose matrix, is the family of qi times kj transpose divided by c. So every entry is of this form, which is kind of like this, guys."},{"start":3579.51,"text":"And then if you do a row softmax, that corresponds to this softmax. And then if you multiply by v, it means this linear combination. I think we probably don't have enough time to."},{"start":3592.13,"text":"go into the details, but you can double-check. It's just a very basic linear algebra. It's mostly just notations. So this Qk divided by C matrix is the inner product between the queries and keys, and then you take a row-wide softmax to get the probabilities. So after the softmax, this matrix becomes, every row is a probability vector, and then you multiply that with the V to take the linear combination of these."}],"speech_gaps":[],"frame":"../frames/v041/021.webp","frame_time":3464.22},{"title":"Transformer 中的依赖关系与掩码机制","segments":[{"id":295,"text":"And there's one thing that we kind of cheat a little bit here, which is that if you look at this architecture, then it's not true that the t-th output only depends on everything before it. There's no this kind of like a auto-requestive kind of like properties yet, right? Because the output at time t depends on everything.","zh":"这里有一点我们稍微有点作弊，那就是如果你看一下这个架构，那么第t个输出并不只依赖于它之前的所有内容。这里还没有这种自回归的性质，对吧？因为在时间t的输出依赖于所有内容。","start":3619.19,"end":3646.06},{"id":296,"text":"It depends on V capital T, even the last input. V capital T is a function of the last input. So an output at time T depends on the input, depends on VT and it depends on HT in. So basically, there's no kind of like this dependency. So then what you do is you say, introduce the concept of masking to make sure that there's no,","zh":"它依赖于大写的V_T，甚至最后一个输入。大写的V_T是最后一个输入的函数。因此，在时间T的输出依赖于输入，依赖于V_T，并且依赖于H_T。所以基本上，这里没有这种依赖性。因此，你所做的就是引入掩码的概念，以确保不存在你不想有的这种依赖性。","start":3646.84,"end":3673.5},{"id":297,"text":"this kind of wrong dependency you want. So basically, what you really want to do is that you just, in some sense, for h little t, you want to delete everything after time t. So basically, let's say, before you have this pt vt plus","zh":"基本上，你真正想要做的是，在某种意义上，对于h小t，你想要删除时间t之后的所有内容。所以基本上，假设在你拥有这个p_t v_t加上","start":3674.99,"end":3696.56},{"id":298,"text":"PT, T, VT, PT, capital T, V, capital T. So basically, you said these dependencies are invalid for me, so I just don't have them. So basically, you just delete all of this. And then you renormalize this piece so that the sum of this piece got normalized to one. So it's still a linear combination or convex combination of the V1 up to VT. So that's pretty much what you do. So you just say if the dependency is not good, you just, in some sense, mask them out.","zh":"p_t, T, v_t, p_t, 大写T, V, 大写T。所以基本上，你说这些依赖关系对我来说是无效的，所以我就不拥有它们。所以基本上，你只是删除了所有这些内容。然后你重新归一化这一部分，使得这一部分的总和被归一化为1。因此，它仍然是V_1到V_T的线性组合或凸组合。这就是你所做的。所以你只是说，如果依赖关系不好，你就在某种意义上将它们屏蔽掉。","start":3699.42,"end":3728.4},{"id":299,"text":"And mathematically, what you do, actually also implementation-wise, what you do is through this masking, which means that you add a masking here. Maybe let's use a different color too. So you add a masking here. I need a different, better color. So you add a mask here.","zh":"从数学上讲，你所做的，实际上在实现上，你所做的就是通过这种掩码，这意味着你在这里添加了一个掩码。也许我们可以用不同的颜色。所以你在这里添加了一个掩码。我需要一种不同的、更好的颜色。所以你在这里添加了一个掩码。","start":3729.01,"end":3765.31},{"id":300,"text":"so that you can mask out the, let me see, you can mask out half of this matrix. So you have like a Q1K1 transpose, Q1K2 transpose, so on and so forth. And Q1K2 transpose is not valid in some sense because you are looking, you are attending to something you shouldn't attend. Q1 shouldn't be able to see K2. So basically you add this masking matrix. What you add is that you add,","zh":"这样你就可以屏蔽掉这个矩阵的一半。你有像Q1K1转置、Q1K2转置等等。而Q1K2转置在某种意义上是无效的，因为你正在关注你不应该关注的内容。Q1不应该能够看到K2。因此，你添加了这个掩码矩阵。你添加的是，你添加了","start":3766.29,"end":3795.3}],"notes":["本段讲解了Transformer模型中依赖关系的问题，指出在标准的Transformer架构中，输出不仅依赖于前面的输入，还可能依赖于后面的输入，这与序列生成的因果性要求不符。因此，需要引入掩码机制来消除这种不合理的依赖。","讲者提到，通过引入掩码，可以删除时间t之后的所有依赖项，从而确保输出仅依赖于前面的输入。这涉及到对注意力机制的修改，即在计算注意力权重时，通过掩码矩阵屏蔽掉不合法的依赖项。","在数学实现上，掩码机制通过在注意力矩阵中添加一个掩码矩阵来实现，该矩阵可以屏蔽掉某些位置的注意力权重，从而确保模型不会关注到不应该关注的部分。","讲者还提到，掩码矩阵可以用于屏蔽掉矩阵中的一半内容，例如在计算Q1与K2之间的注意力时，Q1不应该关注K2，因此需要通过掩码来阻止这种不合理的注意力计算。","掩码机制的引入是Transformer模型能够处理序列生成任务的关键，它确保了模型在生成每个输出时，只能依赖于之前已经生成的内容，而不是未来的输入。","讲者强调，掩码机制不仅在数学上是必要的，而且在实现上也是必须的，因为它直接影响了模型的注意力计算方式和输出结果的正确性。"],"formulas":[],"uncertainties":["auto-requestive","HT in","pt vt plus","PT, T, VT, PT, capital T, V, capital T"],"diagram":"none","start":3619.19,"end":3795.3,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3619.19,"text":"And there's one thing that we kind of cheat a little bit here, which is that if you look at this architectur
