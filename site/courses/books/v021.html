</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 11 基于模型的强化学习（Model-Based RL） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v021.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v021","title":"Lecture 11 基于模型的强化学习（Model-Based RL）","course":"强化学习","pages":[{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":0,"text":"Great. So we had some feedback in office hours and other times that it might be helpful to have like a high level recap of the algorithms that we've talked about so far to try to understand where some of the pieces fit together. So I put together one slide that is a little bit more high level, but actually captures almost all of the algorithms that we've seen so far.","zh":"很好。我们在办公时间和其他时候收到了一些反馈，认为对到目前为止讨论过的算法进行一个高层次的总结可能会有帮助，以尝试理解其中一些部分是如何相互关联的。因此，我制作了一张更加高层次的幻灯片，实际上涵盖了我们迄今为止看到的几乎所有算法。","start":5.23,"end":24.43},{"id":1,"text":"And in particular, we've talked about both online and offline algorithms, where online refers to scenarios where the policy will be used to collect data. And offline means that we're given a data set and we cannot do any additional data collection in our environment.","zh":"特别是，我们讨论了在线和离线算法。在线指的是策略将被用来收集数据的场景。而离线意味着我们被提供了一组数据，并且不能在环境中进行任何额外的数据收集。","start":26.17,"end":44.25},{"id":2,"text":"In the offline setting, we talked about two different classes of reinforcement learning methods that use on-policy data collection in order to improve. We referred to the first type as on-policy RL, and the second type is off-policy RL, where on-policy RL, you can collect data, but only from the current policy. You can only use data from the current policy, and this means that you are not going to be reusing past data. You can't use offline data and so forth.","zh":"在离线设置中，我们讨论了两种不同的强化学习方法，它们使用在策略数据收集来改进。我们将第一种类型称为在策略强化学习，第二种类型是离策略强化学习。在策略强化学习中，你可以收集数据，但只能从当前策略中收集。你只能使用当前策略的数据，这意味着你不会重用过去的数据。你不能使用离线数据等等。","start":47.1,"end":74.18},{"id":3,"text":"And this include algorithms like reinforce or the vanilla policy gradient method. And then within the realm of off-policy RL, this was where we could start to reuse data from other policies, including data from policies before we took a gradient step on our policy parameters. And this included algorithms like PPO and importance sampling.","zh":"这包括像REINFORCE或原始策略梯度方法这样的算法。而在离策略强化学习的范畴中，我们可以开始重用其他策略的数据，包括在我们对策略参数进行梯度更新之前收集的数据。这包括像PPO和重要性采样这样的算法。","start":75.02,"end":95.99},{"id":4,"text":"And then we talked about algorithms that are more off policy that can reuse data from policies that are even more different and where we use a replay buffer to store the data from those past policies. And that included algorithms like DQN and SAC.","zh":"然后我们讨论了更加离策略的算法，这些算法可以重用甚至更加不同的策略的数据，并且我们使用一个回放缓冲区来存储这些过去策略的数据。这包括像DQN和SAC这样的算法。","start":97.24,"end":113.34},{"id":5,"text":"And then I colored these different algorithms different colors because the blue algorithms only involve training a policy. And so we refer to them as policy gradient methods. PPO and SAC learn both a policy and a critic. And so we refer to them as actor-critic methods. And there's also algorithms that only learn a critic and don't explicitly learn a separate policy. And those are often referred to as Q-learning algorithms, such as DQM.","zh":"然后我把这些不同的算法用不同的颜色标记了，因为蓝色的算法只涉及训练一个策略，因此我们称它们为策略梯度方法。PPO和SAC同时学习一个策略和一个批评家，因此我们称它们为演员-批评家方法。还有一些算法只学习一个批评家，而不显式地学习一个单独的策略。这些通常被称为Q学习算法，例如DQM。","start":115.88,"end":143.22},{"id":6,"text":"I should also mention that PPO is often actually referred to as a policy gradient method, although you do actually learn a value function. And so we typically were referring to it as actor critic in this class to avoid confusion. And then separate from these classes of online methods, we also have offline.","zh":"我应该还要提到，PPO 通常实际上被称为策略梯度方法，尽管你确实会学习一个价值函数。因此在本课程中，我们通常称其为 actor-critic 方法以避免混淆。然后，除了这些在线方法的类别之外，我们还有离线方法。","start":143.91,"end":161.8},{"id":7,"text":"RL methods that we started talking about. And these built upon a lot of the ideas we saw in online RL, but I have to cope with the fact that you're not collecting any data at all. And we looked at two different approaches there. One is to constrain to only considering actions in the data.","zh":"我们之前谈到的强化学习方法。这些方法建立在我们在在线强化学习中看到的许多思想之上，但我必须面对一个事实，就是你根本不收集任何数据。我们在那里考察了两种不同的方法。一种是仅考虑数据中的动作。","start":162.54,"end":177.62}],"notes":["本段主要讲解了强化学习中在线和离线算法的区别，以及在离线设置下，基于策略的数据收集方法。在线算法指的是使用策略收集数据的场景，而离线算法则是给定数据集，不能进行额外的数据收集。在离线设置下，讨论了两种不同的强化学习方法：基于策略的强化学习（on-policy RL）和基于非策略的强化学习（off-policy RL）。on-policy RL只能使用当前策略的数据，不能重用过去的数据，而off-policy RL可以重用其他策略的数据，包括在更新策略参数之前的数据。","本段还介绍了不同类型的算法，如REINFORCE和原始策略梯度方法属于on-policy RL，而PPO和重要性采样属于off-policy RL。此外，还提到了使用回放缓冲区存储过去策略数据的算法，如DQN和SAC。这些算法在离线设置下可以重用更多不同策略的数据。","本段进一步区分了不同类型的强化学习方法，如策略梯度方法（仅训练策略）、actor-critic方法（同时训练策略和价值函数）以及Q-learning方法（仅训练价值函数，如DQM）。同时，提到PPO虽然实际学习了价值函数，但通常在本课程中被归类为actor-critic方法以避免混淆。","本段还提到离线强化学习方法与在线方法的不同之处，即不进行任何数据收集。在离线设置下，讨论了两种不同的方法：一种是仅考虑数据中的动作，另一种是其他方法。这些方法基于在线强化学习的思想，但需要处理没有数据收集的情况。","本段强调了在离线强化学习中，如何处理没有数据收集的问题，以及如何利用已有数据进行学习。这包括对动作空间的约束，以及可能的其他方法。这些方法需要在不进行额外数据收集的情况下，充分利用已有数据进行策略优化。","本段整体上回顾了强化学习中不同算法的分类和特点，包括在线和离线方法、on-policy和off-policy方法，以及不同类型的算法（如策略梯度、actor-critic、Q-learning）。这些分类有助于理解不同算法之间的关系和适用场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":177.62,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.23,"text":"Great. So we had some feedback in office hours and other times that it might be helpful to have like a high level recap of the algorithms that we've talked about so far to try to understand where some of the pieces fit together. So I put together one slide that is a little bit more high level, but actually captures almost all of the algorithms that we've seen so far."},{"start":26.17,"text":"And in particular, we've talked about both online and offline algorithms, where online refers to scenarios where the policy will be used to collect data. And offline means that we're given a data set and we cannot do any additional data collection in our environment."},{"start":47.1,"text":"In the offline setting, we talked about two different classes of reinforcement learning methods that use on-policy data collection in order to improve. We referred to the first type as on-policy RL, and the second type is off-policy RL, where on-policy RL, you can collect data, but only from the current policy. You can only use data from the current policy, and this means that you are not going to be reusing past data. You can't use offline data and so forth."},{"start":75.02,"text":"And this include algorithms like reinforce or the vanilla policy gradient method. And then within the realm of off-policy RL, this was where we could start to reuse data from other policies, including data from policies before we took a gradient step on our policy parameters. And this included algorithms like PPO and importance sampling."},{"start":97.24,"text":"And then we talked about algorithms that are more off policy that can reuse data from policies that are even more different and where we use a replay buffer to store the data from those past policies. And that included algorithms like DQN and SAC."},{"start":115.88,"text":"And then I colored these different algorithms different colors because the blue algorithms only involve training a policy. And so we refer to them as policy gradient methods. PPO and SAC learn both a policy and a critic. And so we refer to them as actor-critic methods. And there's also algorithms that only learn a critic and don't explicitly learn a separate policy. And those are often referred to as Q-learning algorithms, such as DQM."},{"start":143.91,"text":"I should also mention that PPO is often actually referred to as a policy gradient method, although you do actually learn a value function. And so we typically were referring to it as actor critic in this class to avoid confusion. And then separate from these classes of online methods, we also have offline."},{"start":162.54,"text":"RL methods that we started talking about. And these built upon a lot of the ideas we saw in online RL, but I have to cope with the fact that you're not collecting any data at all. And we looked at two different approaches there. One is to constrain to only considering actions in the data."}],"speech_gaps":[],"frame":"../frames/v021/001.webp","frame_time":17.23},{"title":"基于模型的强化学习（Model-Based RL）概述","segments":[{"id":8,"text":"And this includes algorithms like AWAC and IQL, and also an algorithm like CQL that implicitly is constraining you to actions in the data, but not so explicitly. And this is through conservatism.","zh":"这包括像AWAC和IQL这样的算法，还包括像CQL这样的算法，它隐式地限制你只能采取数据中的动作，但并不是非常明确。这是通过保守性实现的。","start":178.46,"end":194.6},{"id":9,"text":"So for these RL algorithms, generally, as you move right, you need more online data.","zh":"因此，对于这些强化学习算法，通常来说，随着你向右移动，你需要更多的在线数据。","start":197.42,"end":203.22},{"id":10,"text":"And so that means that typically they're going to be kind of more expensive","zh":"这意味着它们通常会更昂贵","start":203.8,"end":208.32},{"id":11,"text":"because online data is often more expensive than offline data because you can't.","zh":"因为在线数据通常比离线数据更昂贵，因为你无法","start":208.32,"end":212.66},{"id":12,"text":"It's harder to kind of repeatedly collect a large amount of online data.","zh":"反复收集大量在线数据要困难得多。","start":212.7,"end":217.84},{"id":13,"text":"And then lastly, before we talked about RL, we also talked about imitation learning algorithms.","zh":"最后，在我们讨论强化学习之前，我们也讨论了模仿学习算法。","start":219.52,"end":223.58},{"id":14,"text":"and this can also fall within the bucket of offline and online although there there's a","zh":"这也可能属于离线和在线的范畴，尽管它们有一套略有不同的假设","start":223.58,"end":230.5},{"id":15,"text":"bit different set of assumptions the first imitation learning algorithm we covered was","zh":"我们之前讨论的第一个模仿学习算法是","start":230.5,"end":234.3},{"id":16,"text":"kind of vanilla behavior cloning where we're taking a data set and trying to imitate the","zh":"类似于一种普通的模仿学习，我们是在一个数据集中尝试模仿其中的动作","start":234.3,"end":239.36},{"id":17,"text":"actions in that data set and then we also talked about an online algorithm that is online both in","zh":"然后我们还讨论了一个在线算法，它在策略方面和在查询专家方面都是在线的，比如询问专家在这个我正在收集的新数据中，正确的","start":239.36,"end":245.54},{"id":18,"text":"terms of the policy and in terms of querying an expert like asking an expert what is the right","zh":"动作是什么","start":245.54,"end":251.36},{"id":19,"text":"right action on this new data that I'm collecting.","zh":"我把这些归为一个稍微独立的类别，因为它们有不同的假设","start":251.36,"end":253.62},{"id":20,"text":"I put these in a little bit of","zh":"你不需要一个奖励函数，","start":255.2,"end":257.98},{"id":21,"text":"a separate category because they have different assumptions.","zh":"但你需要相当好的数据，你将无法","start":257.98,"end":260.88},{"id":22,"text":"You don't need a reward function,","zh":"做到","start":261.04,"end":262.0},{"id":23,"text":"but you do need pretty good data and you're not going to be able to","zh":"但你需要相当好的数据，你将无法做到","start":263.32,"end":267.18},{"id":24,"text":"outperform the average behavior in your dataset.","zh":"在你的数据集中表现优于平均行为。","start":267.18,"end":271.32},{"id":25,"text":"Cool. So that's an overview,","zh":"很好。所以这就是一个概述，","start":273.24,"end":274.66},{"id":26,"text":"including a lot of these different terms that we","zh":"包括我们之前提到的许多不同术语，","start":275.34,"end":277.46},{"id":27,"text":"including a lot of these different terms that we","zh":"包括我们之前提到的许多不同术语，","start":277.46,"end":279.66},{"id":28,"text":"off policy, on policy, and so forth, and imitation learning versus reinforcement learning. Cool. So what we're going to talk about today is we're going to talk about model-based reinforcement learning. And model-based reinforcement learning can actually be applied to all of the different classes of reinforcement learning methods on the previous slide.","zh":"如离策略、在策略等，以及模仿学习与强化学习之间的区别。很好。今天我们将讨论的内容是，我们将讨论基于模型的强化学习。基于模型的强化学习实际上可以应用于上一张幻灯片中提到的所有不同类别的强化学习方法。","start":281.05,"end":301.32},{"id":29,"text":"Someone has a special place in my heart because I used to do actually quite a bit of work on model-based RL. I think that there's a lot of really cool things that you can do with model-based reinforcement learning.","zh":"有人在我心中有特殊的位置，因为我过去实际上在基于模型的强化学习方面做过相当多的工作。我认为，基于模型的强化学习可以实现很多非常酷的事情。","start":302.97,"end":312.19},{"id":30,"text":"We'll talk about the key idea behind it, how to learn models, how to use those models, including with planning and data generation. And then we'll also look at one case study in dexterous robot manipulation. And as a teaser for that, the methods that we'll be talking about today is we'll allow a robot to do something like this, which is pretty cool. This hand has more than 20 degrees of freedom, more than 20 different joints that it's controlling.","zh":"我们将讨论其核心思想，如何学习模型，如何使用这些模型，包括规划和数据生成。然后我们还将看一个关于灵巧机器人操作的案例研究。作为今天的预告，我们将讨论的方法将允许机器人执行类似这样的任务，这非常酷。这只手有超过20个自由度，控制着超过20个不同的关节。","start":313.13,"end":338.03}],"notes":["本段主要讲解了基于模型的强化学习（Model-Based RL）与其他强化学习方法（如离线和在线学习）的关系，以及模仿学习（Imitation Learning）在其中的位置。课堂中提到，模仿学习可以归类为离线或在线学习，但其假设条件与强化学习有所不同。","课堂中提到，模仿学习的第一种算法是行为克隆（Behavior Cloning），即通过数据集来模仿其中的动作。此外，还提到了一种在线模仿学习算法，该算法在策略和查询专家方面都是在线的，例如询问专家在新数据上的正确动作。","模仿学习不需要奖励函数，但需要高质量的数据，并且无法超越数据集中平均行为的表现。这表明模仿学习在某些场景下可能不如强化学习灵活，但其数据需求较低。","课堂中还提到，基于模型的强化学习可以应用于所有不同类别的强化学习方法，包括离线、在线、离策略（off-policy）和在策略（on-policy）方法。这表明基于模型的方法具有广泛的适用性。","课堂最后提到，基于模型的强化学习可以用于数据生成和规划，例如在灵巧机器人操作（dexterous robot manipulation）的案例研究中。这表明基于模型的方法在实际应用中具有重要价值。","课堂中还提到，基于模型的强化学习可以允许机器人执行复杂任务，例如具有超过20个自由度的手部操作。这表明基于模型的方法在处理高维、复杂任务时具有潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":178.46,"end":338.03,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":178.46,"text":"And this includes algorithms like AWAC and IQL, and also an algorithm like CQL that implicitly is constraining you to actions in the data, but not so explicitly. And this is through conservatism."},{"start":197.42,"text":"So for these RL algorithms, generally, as you move right, you need more online data."},{"start":203.8,"text":"And so that means that typically they're going to be kind of more expensive"},{"start":208.32,"text":"because online data is often more expensive than offline data because you can't."},{"start":212.7,"text":"It's harder to kind of repeatedly collect a large amount of online data."},{"start":219.52,"text":"And then lastly, before we talked about RL, we also talked about imitation learning algorithms."},{"start":223.58,"text":"and this can also fall within the bucket of offline and online although there there's a"},{"start":230.5,"text":"bit different set of assumptions the first imitation learning algorithm we covered was"},{"start":234.3,"text":"kind of vanilla behavior cloning where we're taking a data set and trying to imitate the"},{"start":239.36,"text":"actions in that data set and then we also talked about an online algorithm that is online both in"},{"start":245.54,"text":"terms of the policy and in terms of querying an expert like asking an expert what is the right"},{"start":251.36,"text":"right action on this new data that I'm collecting."},{"start":255.2,"text":"I put these in a little bit of"},{"start":257.98,"text":"a separate category because they have different assumptions."},{"start":261.04,"text":"You don't need a reward function,"},{"start":263.32,"text":"but you do need pretty good data and you're not going to be able to"},{"start":267.18,"text":"outperform the average behavior in your dataset."},{"start":273.24,"text":"Cool. So that's an overview,"},{"start":275.34,"text":"including a lot of these different terms that we"},{"start":277.46,"text":"see in reinforcement learning like offline, online,"},{"start":281.05,"text":"off policy, on policy, and so forth, and imitation learning versus reinforcement learning. Cool. So what we're going to talk about today is we're going to talk about model-based reinforcement learning. And model-based reinforcement learning can actually be applied to all of the different classes of reinforcement learning methods on the previous slide."},{"start":302.97,"text":"Someone has a special place in my heart because I used to do actually quite a bit of work on model-based RL. I think that there's a lot of really cool things that you can do with model-based reinforcement learning."},{"start":313.13,"text":"We'll talk about the key idea behind it, how to learn models, how to use those models, including with planning and data generation. And then we'll also look at one case study in dexterous robot manipulation. And as a teaser for that, the methods that we'll be talking about today is we'll allow a robot to do something like this, which is pretty cool. This hand has more than 20 degrees of freedom, more than 20 different joints that it's controlling."}],"speech_gaps":[],"frame":"../frames/v021/002.webp","frame_time":190.46},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":31,"text":"Yeah, and then the key outcomes is trying to understand how we can learn and use dynamics models and the different challenges and trade-offs with this whole class of methods. So the key idea behind model-based reinforcement learning is essentially we're going to try to learn a simulator. Can we learn how to predict the future for actions that we might be taking?","zh":"是的，然后关键的成果是试图理解我们如何学习和使用动态模型，以及这一类方法所面临的不同挑战和权衡。因此，基于模型的强化学习的核心思想本质上是尝试学习一个模拟器。我们能否学习如何预测我们可能采取的动作的未来？","start":339.77,"end":365.31},{"id":32,"text":"For robotics and driving and other physical systems, this might be modeling the physics of some particular system. If you can directly observe the underlying kind of physical entities in that system.","zh":"对于机器人、驾驶和其他物理系统来说，这可能是在建模某些特定系统的物理规律。如果你能够直接观察到该系统中的底层物理实体。","start":368.3,"end":382.64},{"id":33,"text":"And alternatively, if you can't directly observe the different entities in that physical system and model them, then this might look something more like video prediction conditioned on actions that the agent wants to take. So for example, I might want to predict if I say something to someone else, how will they react? Or if I, for example, move my legs in a certain way, will I fall down? Will I go that way? Will I go that way? And so forth.","zh":"或者，如果你无法直接观察到该物理系统中的不同实体并对其进行建模，那么这可能看起来更像是基于代理想要采取的动作的视频预测。例如，我可能会想预测，如果我说话给另一个人听，他们会如何反应？或者，例如，如果我以某种方式移动我的腿，我会摔倒吗？我会往那个方向走吗？我会往那个方向走吗？等等。","start":385.18,"end":411.58},{"id":34,"text":"In terms of what this video prediction might actually look like, we've seen pretty cool videos coming out of large models like VO2 and Sora, and these are examples of","zh":"就视频预测实际上可能看起来的样子而言，我们已经看到了一些由大型模型如VO2和Sora生成的非常酷的视频，这些是","start":414.41,"end":426.63},{"id":35,"text":"videos that are generated by a neural network. You can imagine that these kinds of models could be very useful for training systems like cars, robots, quadrotors that are flying through different places in order to learn about how their actions affect the world.","zh":"由神经网络生成的视频。你可以想象，这类模型对于训练像汽车、机器人、四旋翼飞行器等系统可能非常有用，这些系统在不同的地方飞行，以学习它们的动作如何影响世界。","start":429.28,"end":447.48},{"id":36,"text":"Now, models can look something like models of the physical world. They could also look at models of other things. So, for example, if you wanted to learn a policy to make money on the stock market, then one of these simulators would be trying to predict what will happen to the stock market over time and if your actions have any effect on that. And then if you're trying to train an agent to play a game, then this sort of model will underscore the rules of that game.","zh":"现在，模型可能看起来像物理世界的模型。它们也可以关注其他类型的模型。例如，如果你想学习一个在股票市场上赚钱的策略，那么其中一个模拟器将试图预测股票市场随时间的变化以及你的行为是否会对它产生影响。而如果你试图训练一个代理来玩游戏，那么这种模型将突出该游戏的规则。","start":450.31,"end":478.48},{"id":37,"text":"And actually, in a lot of games, you might actually already know the rules of the game. And you may not even need to learn a model in the first place. For example, in chess, if you take a particular action, you know the outcome. You know how the piece will move as a result of that action. And then it comes down to, in two-player games or three-player games or multiplayer games, you might need to model other players.","zh":"实际上，在很多游戏中，你可能已经知道游戏的规则。你甚至可能根本不需要学习一个模型。例如，在国际象棋中，如果你采取一个特定的动作，你知道结果。你知道这个动作会导致棋子如何移动。然后，在两人游戏、三人游戏或多玩家游戏中，你可能需要建模其他玩家。","start":479.45,"end":500.27}],"notes":["本段介绍了基于模型的强化学习（Model-Based RL）的核心思想，即学习一个模拟器，以预测动作对环境的影响。这包括对物理系统的建模，如机器人和自动驾驶，以及对非物理系统的建模，如股票市场和游戏规则。","在物理系统中，如果无法直接观察到系统内部的实体，可以使用视频预测来模拟动作的影响。例如，预测说话后的反应或移动腿后是否会摔倒。","视频预测可以通过神经网络实现，这些模型在训练系统如汽车、机器人和飞行器时非常有用，因为它们可以帮助系统学习动作如何影响环境。","模型不仅可以用于物理世界，还可以用于其他领域，如股票市场和游戏。在某些情况下，如国际象棋，规则已知，因此不需要学习模型。","在多人游戏中，可能需要建模其他玩家的行为，以预测他们的动作和反应。","基于模型的强化学习涉及学习动态模型、预测未来状态以及处理建模过程中的挑战和权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":339.77,"end":500.27,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":339.77,"text":"Yeah, and then the key outcomes is trying to understand how we can learn and use dynamics models and the different challenges and trade-offs with this whole class of methods. So the key idea behind model-based reinforcement learning is essentially we're going to try to learn a simulator. Can we learn how to predict the future for actions that we might be taking?"},{"start":368.3,"text":"For robotics and driving and other physical systems, this might be modeling the physics of some particular system. If you can directly observe the underlying kind of physical entities in that system."},{"start":385.18,"text":"And alternatively, if you can't directly observe the different entities in that physical system and model them, then this might look something more like video prediction conditioned on actions that the agent wants to take. So for example, I might want to predict if I say something to someone else, how will they react? Or if I, for example, move my legs in a certain way, will I fall down? Will I go that way? Will I go that way? And so forth."},{"start":414.41,"text":"In terms of what this video prediction might actually look like, we've seen pretty cool videos coming out of large models like VO2 and Sora, and these are examples of"},{"start":429.28,"text":"videos that are generated by a neural network. You can imagine that these kinds of models could be very useful for training systems like cars, robots, quadrotors that are flying through different places in order to learn about how their actions affect the world."},{"start":450.31,"text":"Now, models can look something like models of the physical world. They could also look at models of other things. So, for example, if you wanted to learn a policy to make money on the stock market, then one of these simulators would be trying to predict what will happen to the stock market over time and if your actions have any effect on that. And then if you're trying to train an agent to play a game, then this sort of model will underscore the rules of that game."},{"start":479.45,"text":"And actually, in a lot of games, you might actually already know the rules of the game. And you may not even need to learn a model in the first place. For example, in chess, if you take a particular action, you know the outcome. You know how the piece will move as a result of that action. And then it comes down to, in two-player games or three-player games or multiplayer games, you might need to model other players."}],"speech_gaps":[],"frame":"../frames/v021/003.webp","frame_time":351.77},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":38,"text":"Modeling other players, you can sometimes consider that as part of the dynamics, but oftentimes it's actually modeled separately. So you don't even necessarily need to consider it as part of this simulator of the world. For example, you might be able to use the model of yourself as a model of another agent. Okay, so if we can learn a simulator, how would we use it? So the sketch of an algorithm would be something like this, where we get some data.","zh":"建模其他玩家，有时可以将其视为动态的一部分，但很多时候实际上是单独建模的。因此，你甚至不一定需要将它视为这个世界模拟器的一部分。例如，你可能能够利用你自己的模型作为另一个智能体的模型。好的，那么如果我们能够学习一个模拟器，我们该如何使用它？算法的草图可能如下，其中我们获取一些数据。","start":502.3,"end":530.88},{"id":39,"text":"Then we learn a simulator on that data that's going to be trying to predict the future for the present and some action that I might take from the present. And then try to run your favorite method inside the simulator. So for example, maybe you have a kind of a simple scenario where you want to get from the green point to the red point. You might collect some data.","zh":"然后我们在这个数据上学习一个模拟器，它将尝试预测当前状态和一些可能采取的动作的未来状态。然后尝试在模拟器中运行你最喜欢的算法。例如，你可能有一个简单的场景，想要从绿色点移动到红色点。你可能会收集一些数据。","start":531.95,"end":561.36},{"id":40,"text":"This is collected from some policy. Then you would train some neural network conditioned on a state and an action. What is the next state? And one way that you could learn this is just by minimizing the L2 loss between your predicted next state and the next state observed in the data.","zh":"这些数据是从某个策略中收集的。然后你会训练一个神经网络，其输入是状态和动作，输出是下一个状态。一种学习方法就是通过最小化预测的下一个状态与数据中观察到的下一个状态之间的L2损失。","start":562.91,"end":583.26},{"id":41,"text":"And then in terms of running your favorite RL method, you could use one of the RL methods that we've covered, or you could use a planning method. And we'll talk about a couple of planning methods today. Cool. So now I have a question for you. So here's a sketch of an algorithm. Does anyone have thoughts on what might go wrong if you follow this sketch?","zh":"在运行你最喜欢的强化学习方法时，你可以使用我们之前讲过的任何强化学习方法，也可以使用规划方法。今天我们将讨论几种规划方法。很好。现在我有一个问题要问大家。这是算法的一个草图。如果按照这个草图进行，大家有没有什么想法认为可能会出什么问题？","start":584.78,"end":606.43},{"id":42,"text":"Yeah. So the idea there was that your simulator might not always be accurate. And so similar to","zh":"是的。这个想法是，你的模拟器可能并不总是准确的。这类似于我们在奖励建模中看到的情况，也可以说是我们在训练Q函数时看到的情况，你可能会利用这些不准确性。这些不准确性可能会累积。然后你在学习的模拟器中所学到的内容可能无法迁移到你试图学习的真实场景中。","start":607.37,"end":613.77},{"id":43,"text":"what we saw in reward modeling, and also arguably what we saw when training Q functions, you might","zh":"我们在奖励建模中看到的，以及可以说在训练Q函数时也看到的，你可能会","start":613.77,"end":619.89},{"id":44,"text":"exploit those inaccuracies. Those inaccuracies might compound. And then what you've learned","zh":"利用这些不准确性。这些不准确性可能会累积。然后你所学到的","start":619.89,"end":624.85},{"id":45,"text":"in your learned simulator might not transfer to the real scenario that you're trying to learn","zh":"在学习的模拟器中的知识可能无法迁移到你试图学习的真实场景中","start":624.85,"end":630.77},{"id":46,"text":"a good policy in. Yeah, so there's also this data coverage issue. So similar to what we've seen","zh":"一个好的策略。是的，所以还存在数据覆盖的问题。这类似于我们在训练Q函数和其他内容时所见到的情况","start":630.77,"end":638.23},{"id":47,"text":"when training Q functions and other things, if this pi zero, if this initial policy is different","zh":"如果这个初始策略pi零与你最终要学习的策略不同","start":638.23,"end":645.69},{"id":48,"text":"from the policy that you're ultimately learning, then you're going to have this mismatch and you","zh":"那么你就会出现这种不匹配，你可能会无法覆盖到，你的模型可能无法准确描述由你正在学习的策略所访问到的状态","start":645.69,"end":649.19},{"id":49,"text":"might not have coverage of, your model might not be accurate for the states that are visited by the","zh":"你正在学习的策略所访问到的状态","start":649.19,"end":655.77},{"id":50,"text":"the policy that you're learning.","zh":"所以这基本上就是幻灯片上所展示的内容","start":655.77,"end":657.89},{"id":51,"text":"So this is mostly basically what's on the slide exactly.","zh":"所以如果你有一个环境","start":658.13,"end":664.65},{"id":52,"text":"So if you have some environment,","zh":"也许你想在迷宫中导航","start":664.91,"end":667.25},{"id":53,"text":"maybe you want to navigate a maze,","zh":"也许你想在迷宫中导航，","start":667.47,"end":669.07},{"id":54,"text":"then you might collect some dataset from some policy.","zh":"然后你可能会从某个策略中收集一些数据集。","start":670.19,"end":673.73},{"id":55,"text":"Maybe the policy does something like this yellow arrow.","zh":"也许这个策略会执行像这个黄色箭头一样的动作。","start":673.87,"end":675.79},{"id":56,"text":"This is your dataset.","zh":"这就是你的数据集。","start":675.93,"end":676.89},{"id":57,"text":"But the dataset doesn't cover the whole maze,","zh":"但是这个数据集并没有覆盖整个迷宫，","start":678.59,"end":681.59}],"notes":["本段讨论了基于模型的强化学习中使用模拟器时可能遇到的问题。讲者指出，模拟器可能不准确，这种不准确性可能会累积，导致在真实环境中学习到的策略效果不佳。此外，还提到了数据覆盖问题，即如果初始策略与最终要学习的策略不同，那么模拟器可能无法准确覆盖那些最终策略会访问到的状态。","讲者通过类比奖励建模和Q函数训练中的问题，强调了模拟器不准确性可能带来的影响。这表明在基于模型的强化学习中，模拟器的准确性对于策略的有效性至关重要。","数据覆盖问题被进一步解释为，如果初始策略与最终策略不同，那么模拟器可能无法准确反映最终策略所访问的状态，从而影响策略的学习效果。","讲者提到，模拟器的不准确性可能会导致策略在真实环境中表现不佳，因此需要确保模拟器的准确性以及数据的充分覆盖。","讲者还指出，模拟器的不准确性可能会被利用，从而导致策略在训练过程中出现偏差，这进一步强调了模拟器准确性和数据覆盖的重要性。","最后，讲者提到这些内容与幻灯片上的内容基本一致，表明这些问题是基于模型的强化学习中常见的挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":502.3,"end":681.59,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":502.3,"text":"Modeling other players, you can sometimes consider that as part of the dynamics, but oftentimes it's actually modeled separately. So you don't even necessarily need to consider it as part of this simulator of the world. For example, you might be able to use the model of yourself as a model of another agent. Okay, so if we can learn a simulator, how would we use it? So the sketch of an algorithm would be something like this, where we get some data."},{"start":531.95,"text":"Then we learn a simulator on that data that's going to be trying to predict the future for the present and some action that I might take from the present. And then try to run your favorite method inside the simulator. So for example, maybe you have a kind of a simple scenario where you want to get from the green point to the red point. You might collect some data."},{"start":562.91,"text":"This is collected from some policy. Then you would train some neural network conditioned on a state and an action. What is the next state? And one way that you could learn this is just by minimizing the L2 loss between your predicted next state and the next state observed in the data."},{"start":584.78,"text":"And then in terms of running your favorite RL method, you could use one of the RL methods that we've covered, or you could use a planning method. And we'll talk about a couple of planning methods today. Cool. So now I have a question for you. So here's a sketch of an algorithm. Does anyone have thoughts on what might go wrong if you follow this sketch?"},{"start":607.37,"text":"Yeah. So the idea there was that your simulator might not always be accurate. And so similar to"},{"start":613.77,"text":"what we saw in reward modeling, and also arguably what we saw when training Q functions, you might"},{"start":619.89,"text":"exploit those inaccuracies. Those inaccuracies might compound. And then what you've learned"},{"start":624.85,"text":"in your learned simulator might not transfer to the real scenario that you're trying to learn"},{"start":630.77,"text":"a good policy in. Yeah, so there's also this data coverage issue. So similar to what we've seen"},{"start":638.23,"text":"when training Q functions and other things, if this pi zero, if this initial policy is different"},{"start":645.69,"text":"from the policy that you're ultimately learning, then you're going to have this mismatch and you"},{"start":649.19,"text":"might not have coverage of, your model might not be accurate for the states that are visited by the"},{"start":655.77,"text":"the policy that you're learning. Cool."},{"start":658.13,"text":"So this is mostly basically what's on the slide exactly."},{"start":664.91,"text":"So if you have some environment,"},{"start":667.47,"text":"maybe you want to navigate a maze,"},{"start":670.19,"text":"then you might collect some dataset from some policy."},{"start":673.87,"text":"Maybe the policy does something like this yellow arrow."},{"start":675.93,"text":"This is your dataset."},{"start":678.59,"text":"But the dataset doesn't cover the whole maze,"}],"speech_gaps":[],"frame":"../frames/v021/004.webp","frame_time":514.3},{"title":"基于模型的强化学习（Model-Based RL）的挑战","segments":[{"id":58,"text":"and so that if you wanted to go to this part of the maze,","zh":"并且如果你想前往迷宫的这一部分，","start":681.79,"end":684.05},{"id":59,"text":"for example, or this part of the maze, then your model probably wouldn't be very accurate about the","zh":"例如，或者迷宫的这一部分，那么你的模型可能对这些区域的迷宫并不准确。","start":684.05,"end":690.23},{"id":60,"text":"mazes in those parts of the environment. And so then you wouldn't be able to learn a policy for","zh":"因此你将无法学习到达这些迷宫区域的策略。","start":690.23,"end":694.95},{"id":61,"text":"reaching those parts of the maze. And then for the second point, you might not always have an","zh":"然后对于第二个要点，你可能并不总是拥有一个精确的模拟器。","start":694.95,"end":701.17},{"id":62,"text":"accurate simulator. So here's an example of a video generated by Sora with the prompt,","zh":"这里有一个由Sora生成的视频示例，提示是，","start":701.17,"end":706.41},{"id":63,"text":"a humanoid robot standing near a table with a red, green, and blue cubes on it,","zh":"一个类人机器人站在一张桌子旁边，桌子上有红色、绿色和蓝色的立方体，","start":706.57,"end":709.89},{"id":64,"text":"performs a cube stacking task with red on the bottom and blue on the top.","zh":"执行一个立方体堆叠任务，红色立方体在底部，蓝色立方体在顶部。","start":709.95,"end":713.33},{"id":65,"text":"And you can see that the video generation does some creative things with physics where it kind of changes the colors of the block and synthesizes blocks out of thin air. I would love for my robot to be able to do something like this. It seems very useful. But this is not kind of modeling what robots can actually do in reality. And to this point, when you're actually trying to develop this kind of model,","zh":"你可以看到视频生成在物理方面做了一些创造性的处理，它改变了立方体的颜色，并从空气中合成立方体。我非常希望我的机器人能够做到这一点。这看起来非常有用。但这一点并不模拟机器人在现实中实际能够做的事情。到目前为止，当你实际尝试开发这种模型时，","start":713.84,"end":741.01},{"id":66,"text":"Oftentimes, you might need to make choices that are dependent on the domain, like if you're trying to train a video prediction model versus training a model of low-level physics with friction or training a model of the stock market. You might have some choices to make in terms of what are the inputs to that model and how are you training it, what's the architecture, and so forth. Some domains are going to be much easier to simulate than others.","zh":"很多时候，你可能需要做出一些依赖于领域的选择，例如，如果你正在训练一个视频预测模型，而不是训练一个包含摩擦力的低级物理模型，或者训练一个股票市场的模型。你可能需要决定该模型的输入是什么，以及如何训练它，其架构是怎样的等等。有些领域将比其他领域更容易进行模拟。","start":741.79,"end":766.67},{"id":67,"text":"And then lastly, for this last part, even if you have a really good simulator, this doesn't mean that it'll be easy to get a good policy or to get actions that are accurate as a result.","zh":"最后，即使你有一个非常好的模拟器，这并不意味着获得一个良好的策略或准确的动作会很容易。","start":768.17,"end":781.53},{"id":68,"text":"You still have to run, you still have to do the RL process using this simulator.","zh":"你仍然需要运行，你仍然需要使用这个模拟器来进行强化学习过程。","start":781.63,"end":786.23},{"id":69,"text":"And you need to account for inaccuracies in the model during this process because usually your model is not perfect.","zh":"在这个过程中，你需要考虑到模型中的不准确性，因为通常你的模型并不是完美的。","start":787.05,"end":795.23},{"id":70,"text":"You don't have a perfect simulator of the world.","zh":"你没有一个完美的世界模拟器。","start":795.35,"end":797.91},{"id":71,"text":"That's the key idea behind model-based RL.","zh":"这就是基于模型的强化学习的核心思想。","start":798.95,"end":801.11},{"id":72,"text":"Now, let's talk briefly about how to learn a dynamics model.","zh":"现在，我们简要地谈谈如何学习一个动力学模型。","start":802.05,"end":805.03},{"id":73,"text":"We don't have too much time to cover this,","zh":"我们没有太多时间来详细讲解这个内容。","start":806.11,"end":807.67},{"id":74,"text":"most of the time on how to use a dynamics model.","zh":"大部分时间都在思考如何使用一个动力学模型。","start":807.75,"end":809.47},{"id":75,"text":"most of the time on how to use a dynamics model.","zh":"大部分时间都在思考如何使用一个动力学模型。","start":809.47,"end":813.07},{"id":76,"text":"In terms of learning a good simulator or a good dynamics model,","zh":"在学习一个良好的模拟器或良好的动力学模型方面，","start":815.11,"end":819.59},{"id":77,"text":"there are some scenarios where you might know it already,","zh":"有一些场景你可能已经知道它，","start":820.23,"end":822.25},{"id":78,"text":"and you're in great shape.","zh":"那时你已经处于非常好的状态。","start":822.47,"end":825.21},{"id":79,"text":"and then you're in great shape.","zh":"那时你已经处于非常好的状态。","start":826.59,"end":828.99},{"id":80,"text":"There's also scenarios where you might actually know most of the model.","zh":"还有一些场景你可能实际上已经知道大部分的模型。","start":830.31,"end":833.43},{"id":81,"text":"If you are in a simplified robotic control setting","zh":"如果你处于一个简化的机器人控制场景中","start":834.23,"end":840.07},{"id":82,"text":"where you're trying to push an object on the table,","zh":"你试图将一个物体推到桌子上，","start":840.07,"end":842.69},{"id":83,"text":"maybe you know most of it, but you don't know the friction coefficient of the table.","zh":"你可能已经知道大部分信息，但不知道桌子的摩擦系数。","start":842.85,"end":846.77},{"id":84,"text":"Or in driving, maybe you have a pretty good model","zh":"或者在驾驶中，你可能对汽车如何加速有一个相当好的模型，","start":846.99,"end":852.67},{"id":85,"text":"of how the car is going to accelerate,","zh":"比如它如何向前移动，","start":852.67,"end":855.79},{"id":86,"text":"like how it will move forward","zh":"比如它将如何前进","start":856.27,"end":857.33}],"notes":["本段讨论了基于模型的强化学习（Model-Based RL）中的几个关键挑战。首先，模型可能在环境的某些部分不够准确，导致无法学习到到达这些区域的策略。其次，实际开发模型时，可能需要根据不同的领域做出不同的选择，例如视频预测模型、低级物理模型或股票市场模型，这些选择涉及输入、训练方式和架构等。最后，即使拥有一个良好的模拟器，也不意味着能够轻松获得好的策略或准确的动作，因为模型通常不完美，需要在训练过程中考虑这些不准确性。","在学习动态模型时，有时可以利用已知的模型，例如在简化机器人控制设置中，可能知道大部分模型，但不知道摩擦系数等细节。在驾驶场景中，可能对车辆的加速有较好的模型，但对其他方面可能了解有限。这些例子说明了在不同领域中，模型的构建和使用需要根据具体情况调整。","本段还提到，即使拥有一个高质量的模拟器，也不意味着能够轻松获得好的策略或准确的动作，因为模型通常不完美，需要在训练过程中考虑这些不准确性。这强调了在实际应用中，模型的准确性和训练过程的重要性。","在学习动态模型时，有时可以利用已知的模型，例如在简化机器人控制设置中，可能知道大部分模型，但不知道摩擦系数等细节。在驾驶场景中，可能对车辆的加速有较好的模型，但对其他方面可能了解有限。这些例子说明了在不同领域中，模型的构建和使用需要根据具体情况调整。","本段还提到，即使拥有一个高质量的模拟器，也不意味着能够轻松获得好的策略或准确的动作，因为模型通常不完美，需要在训练过程中考虑这些不准确性。这强调了在实际应用中，模型的准确性和训练过程的重要性。","最后，本段指出，基于模型的强化学习的核心思想是，即使拥有一个良好的模拟器，也需要在训练过程中考虑模型的不准确性，因为现实世界中的模型通常不完美。这为后续讨论如何使用动态模型奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":681.79,"end":857.33,"asr_flags":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":681.79,"text":"and so that if you wanted to go to this part of the maze,"},{"start":684.05,"text":"for example, or this part of the maze, then your model probably wouldn't be very accurate about the"},{"start":690.23,"text":"mazes in those parts of the environment. And so then you wouldn't be able to learn a policy for"},{"start":694.95,"text":"reaching those parts of the maze. And then for the second point, you might not always have an"},{"start":701.17,"text":"accurate simulator. So here's an example of a video generated by Sora with the prompt,"},{"start":706.57,"text":"a humanoid robot standing near a table with a red, green, and blue cubes on it,"},{"start":709.95,"text":"performs a cube stacking task with red on the bottom and blue on the top."},{"start":713.84,"text":"And you can see that the video generation does some creative things with physics where it kind of changes the colors of the block and synthesizes blocks out of thin air. I would love for my robot to be able to do something like this. It seems very useful. But this is not kind of modeling what robots can actually do in reality. And to this point, when you're actually trying to develop this kind of model,"},{"start":741.79,"text":"Oftentimes, you might need to make choices that are dependent on the domain, like if you're trying to train a video prediction model versus training a model of low-level physics with friction or training a model of the stock market. You might have some choices to make in terms of what are the inputs to that model and how are you training it, what's the architecture, and so forth. Some domains are going to be much easier to simulate than others."},{"start":768.17,"text":"And then lastly, for this last part, even if you have a really good simulator, this doesn't mean that it'll be easy to get a good policy or to get actions that are accurate as a result."},{"start":781.63,"text":"You still have to run, you still have to do the RL process using this simulator."},{"start":787.05,"text":"And you need to account for inaccuracies in the model during this process because usually your model is not perfect."},{"start":795.35,"text":"You don't have a perfect simulator of the world."},{"start":798.95,"text":"That's the key idea behind model-based RL."},{"start":802.05,"text":"Now, let's talk briefly about how to learn a dynamics model."},{"start":806.11,"text":"We don't have too much time to cover this,"},{"start":807.75,"text":"so we'll just talk about it briefly and then we'll spend"},{"start":809.47,"text":"most of the time on how to use a dynamics model."},{"start":815.11,"text":"In terms of learning a good simulator or a good dynamics model,"},{"start":820.23,"text":"there are some scenarios where you might know it already,"},{"start":822.47,"text":"and you could just use it,"},{"start":826.59,"text":"and then you're in great shape."},{"start":830.31,"text":"There's also scenarios where you might actually know most of the model."},{"start":834.23,"text":"If you are in a simplified robotic control setting"},{"start":840.07,"text":"where you're trying to push an object on the table,"},{"start":842.85,"text":"maybe you know most of it, but you don't know the friction coefficient of the table."},{"start":846.99,"text":"Or in driving, maybe you have a pretty good model"},{"start":852.67,"text":"of how the car is going to accelerate,"},{"start":856.27,"text":"like how it will move forward"}],"speech_gaps":[],"frame":"../frames/v021/005.webp","frame_time":693.79},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":87,"text":"with a given steering command and a given thing,","zh":"给定一个转向指令和一个给定的事物，","start":857.33,"end":864.09},{"id":88,"text":"and you just need to model some additional things.","zh":"你只需要对一些额外的事物进行建模。","start":864.17,"end":866.47},{"id":89,"text":"In those cases, you might actually be able","zh":"在这些情况下，你实际上可能能够","start":867.27,"end":869.83},{"id":90,"text":"to leverage knowledge that you know about the world","zh":"利用你对世界已有的知识","start":869.83,"end":872.51},{"id":91,"text":"and then fit those unknown parameters using the data.","zh":"并通过数据拟合这些未知参数。","start":872.51,"end":875.41},{"id":92,"text":"This is actually, I think, one of the cooler ways","zh":"这实际上，我认为，是尝试将领域特定知识","start":875.95,"end":878.91},{"id":93,"text":"to try to incorporate domain-specific knowledge","zh":"纳入强化学习算法的一种更酷的方式。","start":878.91,"end":881.31},{"id":94,"text":"into reinforcement learning algorithms.","zh":"进入强化学习算法。","start":881.31,"end":883.87},{"id":95,"text":"And then in almost all scenarios in practice,","zh":"然后在几乎所有实际场景中，","start":885.37,"end":888.65},{"id":96,"text":"you don't really know the model.","zh":"你实际上并不真正知道模型。","start":888.81,"end":891.05},{"id":97,"text":"And this might be because you can't, for example,","zh":"这可能是因为你无法，例如，","start":892.27,"end":895.21},{"id":98,"text":"if you're trying to manipulate some objects,","zh":"如果你试图操控某些物体，","start":895.21,"end":898.43},{"id":99,"text":"maybe you kind of know roughly the laws of physics,","zh":"你可能大致知道一些物理定律，","start":898.55,"end":900.69},{"id":100,"text":"but you don't know the vast majority","zh":"但你并不知道物体的绝大多数行为方式，","start":900.77,"end":902.71},{"id":101,"text":"of how an object is going to behave","zh":"因为物体具有许多不同的属性。","start":902.71,"end":904.91},{"id":102,"text":"because it has lots of different properties","zh":"因为它具有许多不同的性质","start":904.91,"end":906.59},{"id":103,"text":"and there's many different objects.","zh":"并且有许多不同的对象。","start":906.59,"end":907.75},{"id":104,"text":"Or you don't know how people are going to interact","zh":"或者你不知道人们会如何在世界上互动","start":909.03,"end":910.87},{"id":105,"text":"in the world or other drivers are going to behave in the world and so forth.","zh":"或者其他的驾驶员会在世界上如何行为等等。","start":910.87,"end":913.93},{"id":106,"text":"And in these scenarios, the typical practice is to learn the model from scratch with a neural network or some other function approximator. Now, there are a couple options here as well. So if you are using like image observations, for example, and you're trying to predict like if your state space, for example, is like,","zh":"在这些场景中，通常的做法是使用神经网络或其他函数近似器从头开始学习模型。现在，这里也有一些选项。例如，如果你使用图像观测，比如你试图预测你的状态空间，例如，","start":914.8,"end":944.99},{"id":107,"text":"an image of, I don't know, maybe this is like you have a car and there's other cars here, and you're trying to predict in video where those cars will be moving in the future. And maybe there's, I don't know, some trash on the ground or something like that. One option is to, I'll refer to this image as ST.","zh":"一张图像，比如我不知道，这可能是一辆汽车，这里还有其他汽车，你试图预测视频中这些汽车未来的位置。也许还有，我不知道，地面上的一些垃圾或者其他东西。一种选择是，我将这个图像称为ST。","start":945.33,"end":975.23},{"id":108,"text":"One option is to generate entire future video, like the videos that we saw on the previous slide. This would be conditioned on actions. But this might be fairly expensive to do.","zh":"一种选择是生成整个未来的视频，就像我们在上一张幻灯片中看到的视频一样。这将基于动作进行条件生成。但这样做可能相当昂贵。","start":975.85,"end":995.47},{"id":109,"text":"Because if you have to basically be predicting this entire video over time, that's a pretty large thing. And you have to model all the different details of how all of the pixels are going to change in the future. And so one alternative option that is sometimes used to learn dynamics models is instead of modeling in the image space, you could instead...","zh":"因为如果你必须基本上预测整个视频随时间的变化，这是一件相当大的事情。你必须建模所有像素在未来如何变化的不同细节。因此，有时用于学习动力学模型的一种替代选项是，而不是在图像空间中建模，你可以改而……","start":996.03,"end":1020.0}],"notes":["本段讨论了在基于模型的强化学习中，如何利用已知的领域知识来建模环境，同时通过数据拟合未知参数。这为算法提供了更丰富的信息，有助于提升学习效果。","讲者指出，在实际应用中，我们通常并不知道环境模型。这可能是因为我们无法完全掌握物理规律，或者无法预测对象的行为，以及人类和其他智能体的交互方式。","为了克服这些挑战，通常的做法是使用神经网络或其他函数逼近器从头开始学习模型。这在处理图像观测时尤为常见，例如预测未来视频帧。","讲者提到，一种方法是生成完整的未来视频，这需要根据动作进行条件预测，但这种方法计算成本较高，因为需要预测所有像素的变化。","另一种替代方法是不直接在图像空间建模，而是采用其他方式来学习动态模型，例如使用更抽象的表示形式。","这些讨论展示了基于模型的强化学习中，如何在已知和未知之间进行权衡，以及如何选择合适的建模策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":857.33,"end":1020.0,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":857.33,"text":"with a given steering command and a given thing,"},{"start":864.17,"text":"and you just need to model some additional things."},{"start":867.27,"text":"In those cases, you might actually be able"},{"start":869.83,"text":"to leverage knowledge that you know about the world"},{"start":872.51,"text":"and then fit those unknown parameters using the data."},{"start":875.95,"text":"This is actually, I think, one of the cooler ways"},{"start":878.91,"text":"to try to incorporate domain-specific knowledge"},{"start":881.31,"text":"into reinforcement learning algorithms."},{"start":885.37,"text":"And then in almost all scenarios in practice,"},{"start":888.81,"text":"you don't really know the model."},{"start":892.27,"text":"And this might be because you can't, for example,"},{"start":895.21,"text":"if you're trying to manipulate some objects,"},{"start":898.55,"text":"maybe you kind of know roughly the laws of physics,"},{"start":900.77,"text":"but you don't know the vast majority"},{"start":902.71,"text":"of how an object is going to behave"},{"start":904.91,"text":"because it has lots of different properties"},{"start":906.59,"text":"and there's many different objects."},{"start":909.03,"text":"Or you don't know how people are going to interact"},{"start":910.87,"text":"in the world or other drivers are going to behave in the world and so forth."},{"start":914.8,"text":"And in these scenarios, the typical practice is to learn the model from scratch with a neural network or some other function approximator. Now, there are a couple options here as well. So if you are using like image observations, for example, and you're trying to predict like if your state space, for example, is like,"},{"start":945.33,"text":"an image of, I don't know, maybe this is like you have a car and there's other cars here, and you're trying to predict in video where those cars will be moving in the future. And maybe there's, I don't know, some trash on the ground or something like that. One option is to, I'll refer to this image as ST."},{"start":975.85,"text":"One option is to generate entire future video, like the videos that we saw on the previous slide. This would be conditioned on actions. But this might be fairly expensive to do."},{"start":996.03,"text":"Because if you have to basically be predicting this entire video over time, that's a pretty large thing. And you have to model all the different details of how all of the pixels are going to change in the future. And so one alternative option that is sometimes used to learn dynamics models is instead of modeling in the image space, you could instead..."}],"speech_gaps":[],"frame":"../frames/v021/006.webp","frame_time":869.33},{"title":"基于模型的强化学习中的表示学习与模型构建","segments":[{"id":110,"text":"learn some lower dimensional representation and then model in that representation space. So you, for example, could learn for a given state, you could learn some sort of encoder that maps this to a lower dimensional representation space. Maybe we'll refer to this as ZT. And then instead of learning a model in the original image space, we could then try to learn a model that predicts","zh":"学习一些低维表示，然后在这个表示空间中进行建模。例如，你可以为给定的状态学习一种编码器，将它映射到一个低维表示空间。也许我们会将这个空间称为ZT。然后，而不是在原始图像空间中学习模型，你可以尝试学习一个模型来预测未来的ZT，比如ZT加一。这在学习完整模型似乎非常昂贵的情况下可以是一个很好的替代方案。它也有自己的挑战，因为你需要先确定如何获得这种表示。如果你有一种获得良好表示的好方法，那么这可能是一个不错的选择。","start":1020.59,"end":1049.0},{"id":111,"text":"future ZTs like ZT plus one. This can be a good alternative in scenarios where it seems like it'll be very expensive to learn a full model. It also has its own challenges because you need to figure out how to get this representation in the first place. And if you have a good way to get good representations, it can be a good choice.","zh":"你可能会丢失一些信息。关键的想法是，这个观察中的一些部分并不重要，比如道路的精确纹理，是深黑色还是稍微有些磨损。在许多情况下，这些可能并不重要。因此，如果你能够学习一种丢弃这些无关信息的表示，那么你就无需花费那么多计算资源来建模那些不重要的细节。","start":1050.48,"end":1073.85},{"id":112,"text":"You might be losing information. And the key idea is that there is some parts of this observation that doesn't matter, like perhaps the exact texture of the road, whether it's really dark black or maybe a little bit worn down. In many scenarios, that might not matter. And so if you can learn a representation that discards that information that's irrelevant, then you don't have to spend so much compute modeling all those details that don't matter.","zh":"你可能会丢失一些信息。关键的想法是，这个观察中的一些部分并不重要，比如道路的精确纹理，是深黑色还是稍微有些磨损。在许多情况下，这些可能并不重要。因此，如果你能够学习一种丢弃这些无关信息的表示，那么你就无需花费那么多计算资源来建模那些不重要的细节。","start":1074.79,"end":1089.91},{"id":113,"text":"You might be losing information. And the key idea is that there is some parts of this observation that doesn't matter, like perhaps the exact texture of the road, whether it's really dark black or maybe a little bit worn down. In many scenarios, that might not matter. And so if you can learn a representation that discards that information that's irrelevant, then you don't have to spend so much compute modeling all those details that don't matter.","zh":"你可能会丢失一些信息。关键的想法是，这个观察中的一些部分并不重要，比如道路的精确纹理，是深黑色还是稍微有些磨损。在许多情况下，这些可能并不重要。因此，如果你能够学习一种丢弃这些无关信息的表示，那么你就无需花费那么多计算资源来建模那些不重要的细节。","start":1090.42,"end":1114.54},{"id":114,"text":"The other thing that I'll mention here is that oftentimes when you're trying to learn these models, typically with supervised learning or generative modeling techniques, you often will also need to learn a reward model as well. And the reason for this is that if you want to be using your model to generate data or to kind of see into the future, you need to see into the future not just the states, but also how those predicted states will lead to rewards.","zh":"我要提到的另一点是，当你尝试学习这些模型时，通常会使用监督学习或生成建模技术，你通常也需要学习一个奖励模型。原因在于，如果你想用你的模型来生成数据或展望未来，你需要不仅看到未来的状态，还要看到这些预测的状态如何导致奖励。","start":1115.95,"end":1143.53},{"id":115,"text":"And so we'll talk about what that looks like on the next couple of slides. The question is, does model learning have to happen end-to-end? The way that it works is we are optimizing for our ability to generate future states. And there are actually pros and cons that we'll talk about with regard to that objective. But you can think of it as how well...","zh":"因此，我们将在接下来的几张幻灯片中讨论其具体表现。问题是，模型学习是否必须端到端地进行？其运作方式是，我们优化生成未来状态的能力。关于这一目标，我们将讨论其优缺点。但你可以将其视为……","start":1144.35,"end":1170.58},{"id":116,"text":"One way to think about it is how well can I model the distribution of PST plus 1 given STAT? Another way to think about it, especially if you have more deterministic dynamics, is how well can I minimize the error between my predicted ST plus 1 and the actual","zh":"一种思考方式是，我能否很好地建模在状态ST下，下一状态ST+1的分布？另一种思考方式，尤其是当你有更确定性的动态时，是我在预测的ST+1与实际值之间的误差能否被最小化","start":1171.12,"end":1198.92}],"notes":["本段讨论了在基于模型的强化学习中使用低维表示的优势和挑战。通过学习一个编码器将状态映射到低维空间（如ZT），可以减少计算成本，但会丢失部分信息。关键在于识别并丢弃不重要的信息，如道路的纹理细节，从而避免对不相关细节进行建模。","讲者提到，学习这些模型时通常需要同时学习奖励模型，因为模型不仅要预测未来状态，还要预测这些状态如何导致奖励。这表明模型学习和奖励建模是紧密相关的，且需要结合使用。","讲者还提到模型学习是否必须端到端进行的问题。优化目标是生成未来状态的能力，这涉及权衡利弊。一种思考方式是评估模型对PST+1分布的建模能力，另一种则是评估预测状态与实际状态之间的误差最小化。","在低维表示中，信息丢失是不可避免的，但通过选择合适的表示方法，可以保留对任务关键的信息，从而提高模型效率。","讲者强调了在学习模型时，需要考虑如何获取良好的表示，这可能涉及监督学习或生成建模技术。良好的表示可以显著减少计算成本。","最后，讲者提到模型学习的优化目标是生成未来状态的能力，这可能涉及不同的策略和权衡，如端到端学习与分步学习的比较。"],"formulas":[{"latex":"P(S_{t+1} \\thicksim S_t) \\text{ 或 } P(S_{t+1} | S_t)","symbols":"状态转移概率","explanation":"原文提到的是状态转移概率，但公式中使用了不规范的符号，应更正为P(S_{t+1} | S_t)","evidence":"One way to think about it is how well can I model the distribution of PST plus 1 given STAT? Another way to think about it, especially if you have more deterministic dynamics, is how well can I minimize the error between my predicted ST plus 1 and the actual"}],"uncertainties":["ST plus 1 和 actual 的具体含义不明确，可能是状态转移或实际状态的表示，但未完整识别。"],"diagram":"none","start":1020.59,"end":1198.92,"asr_flags":[],"math_clarifications":["公式中的符号P(S_{t+1} \\thicksim S_t)存在不规范的符号使用，应更正为P(S_{t+1} | S_t)以符合标准概率表示法。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1020.59,"text":"learn some lower dimensional representation and then model in that representation space. So you, for example, could learn for a given state, you could learn some sort of encoder that maps this to a lower dimensional representation space. Maybe we'll refer to this as ZT. And then instead of learning a model in the original image space, we could then try to learn a model that predicts"},{"start":1050.48,"text":"future ZTs like ZT plus one. This can be a good alternative in scenarios where it seems like it'll be very expensive to learn a full model. It also has its own challenges because you need to figure out how to get this representation in the first place. And if you have a good way to get good representations, it can be a good choice."},{"start":1074.79,"text":"Yeah, so the question was, we are going to be losing information by going to a lower dimension, and so is the main reason to do this in terms of cost? Yeah, exactly. So the main reason to do this is to try to reduce some of the computational costs associated with this, because you are losing..."},{"start":1090.42,"text":"You might be losing information. And the key idea is that there is some parts of this observation that doesn't matter, like perhaps the exact texture of the road, whether it's really dark black or maybe a little bit worn down. In many scenarios, that might not matter. And so if you can learn a representation that discards that information that's irrelevant, then you don't have to spend so much compute modeling all those details that don't matter."},{"start":1115.95,"text":"The other thing that I'll mention here is that oftentimes when you're trying to learn these models, typically with supervised learning or generative modeling techniques, you often will also need to learn a reward model as well. And the reason for this is that if you want to be using your model to generate data or to kind of see into the future, you need to see into the future not just the states, but also how those predicted states will lead to rewards."},{"start":1144.35,"text":"And so we'll talk about what that looks like on the next couple of slides. The question is, does model learning have to happen end-to-end? The way that it works is we are optimizing for our ability to generate future states. And there are actually pros and cons that we'll talk about with regard to that objective. But you can think of it as how well..."},{"start":1171.12,"text":"One way to think about it is how well can I model the distribution of PST plus 1 given STAT? Another way to think about it, especially if you have more deterministic dynamics, is how well can I minimize the error between my predicted ST plus 1 and the actual"}],"speech_gaps":[],"frame":"../frames/v021/007.webp","frame_time":1032.5900000000001},{"title":"基于模型的强化学习中的规划与模型使用","segments":[{"id":117,"text":"ST plus 1. So how do we go about using a dynamics model? The first approach that we'll talk about is we'll actually start by talking about planning. And so this is actually going to be a little bit different than simply running reinforcement learning inside your kind of learned simulator. And the way that this could work is you can think about","zh":"ST plus 1。那么我们该如何使用动力学模型呢？我们将要讨论的第一个方法是，我们实际上会从规划开始讨论。这实际上与仅仅在你所学习的模拟器中运行强化学习会有所不同。这种工作方式可以这样想，","start":1199.89,"end":1227.36},{"id":118,"text":"your MDP, where you have your current state that you're in, and then you take some action. And then this affects your next action. And then as a result of that, you'll also get some future reward. And then this process will repeat. You'll take another action.","zh":"你当前所处的MDP状态，然后采取某个动作。这个动作会影响你的下一个动作。作为结果，你也会获得一些未来的奖励。这个过程会重复进行，你再采取另一个动作。","start":1228.38,"end":1253.5},{"id":119,"text":"that influences the state after that, which will yield some additional reward. This reward might also depend on the action that you took as well. Now, in some of the past reinforcement learning works that we talked about, we kind of assumed that we didn't really know this kind of the relationship. We kind of don't know how the actions affect future states.","zh":"这个动作会影响之后的状态，从而产生一些额外的奖励。这个奖励也可能取决于你所采取的动作。在我们之前讨论的一些强化学习工作中，我们基本上假设我们并不真正了解这种关系。我们并不知道动作如何影响未来状态。","start":1254.73,"end":1280.72},{"id":120,"text":"And so we have to figure out how to optimize rewards without using direct gradients. But if we can actually predict what a future state is and what a reward is based off of that, if we train a reward model and a dynamics model, then we could actually just directly back-propagate from rewards into actions.","zh":"因此，我们必须想办法在不使用直接梯度的情况下优化奖励。但如果我们可以预测未来状态和奖励，如果我们训练了一个奖励模型和一个动力学模型，那么我们就可以直接从奖励反向传播到动作。","start":1281.24,"end":1306.87},{"id":121,"text":"We could potentially kind of directly pass gradients from your rewards into your actions. And what this would look like is your objective would be to maximize either just the current action or maybe the kind of next sequence of actions for the sum of future.","zh":"我们有可能直接将梯度从奖励传递到动作。这看起来会是你的目标是最大化当前动作或者可能的下一序列动作的未来奖励总和。","start":1309.08,"end":1338.11},{"id":122,"text":"rewards. Maybe we'll do this t prime for some horizon. So maybe we're optimizing for the rewards from time t to time t plus h. So what this would look like specifically, I guess we can show it on the slides as well. So we're trying to maximize the sum of rewards.","zh":"也许我们会在某个时间范围t prime内这样做。因此，我们可能是在优化从时间t到时间t加h的奖励。具体来说，我们可以在幻灯片上展示这一点。我们试图最大化奖励的总和。","start":1340.11,"end":1363.94}],"notes":["本段讲解了基于模型的强化学习中使用动力学模型的方法，重点在于通过规划来优化奖励。与直接在学习的模拟器中运行强化学习不同，规划方法利用动力学模型预测未来状态和奖励，从而进行更有效的决策。","讲者提到，在过去的强化学习工作中，通常假设我们不知道动作如何影响未来状态，因此需要在不使用直接梯度的情况下优化奖励。如果能够训练奖励模型和动力学模型，就可以直接从奖励反向传播到动作。","讲者进一步说明，目标是最大化未来奖励的总和，可能涉及从时间t到时间t+h的奖励序列。这种优化过程可以通过反向传播实现，从而直接优化动作。","讲者提到，这种规划方法可能涉及对奖励和动作的梯度传递，但具体实现细节可能需要通过幻灯片进一步展示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1199.89,"end":1363.94,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1199.89,"text":"ST plus 1. So how do we go about using a dynamics model? The first approach that we'll talk about is we'll actually start by talking about planning. And so this is actually going to be a little bit different than simply running reinforcement learning inside your kind of learned simulator. And the way that this could work is you can think about"},{"start":1228.38,"text":"your MDP, where you have your current state that you're in, and then you take some action. And then this affects your next action. And then as a result of that, you'll also get some future reward. And then this process will repeat. You'll take another action."},{"start":1254.73,"text":"that influences the state after that, which will yield some additional reward. This reward might also depend on the action that you took as well. Now, in some of the past reinforcement learning works that we talked about, we kind of assumed that we didn't really know this kind of the relationship. We kind of don't know how the actions affect future states."},{"start":1281.24,"text":"And so we have to figure out how to optimize rewards without using direct gradients. But if we can actually predict what a future state is and what a reward is based off of that, if we train a reward model and a dynamics model, then we could actually just directly back-propagate from rewards into actions."},{"start":1309.08,"text":"We could potentially kind of directly pass gradients from your rewards into your actions. And what this would look like is your objective would be to maximize either just the current action or maybe the kind of next sequence of actions for the sum of future."},{"start":1340.11,"text":"rewards. Maybe we'll do this t prime for some horizon. So maybe we're optimizing for the rewards from time t to time t plus h. So what this would look like specifically, I guess we can show it on the slides as well. So we're trying to maximize the sum of rewards."}],"speech_gaps":[],"frame":"../frames/v021/008.webp","frame_time":1211.89},{"title":"基于模型的强化学习中的规划与梯度计算","segments":[{"id":123,"text":"We often refer to this kind of problem as looking into the future as planning a sequence of actions that will maximize rewards. And so if we have some model of how we predict future states and actions and rewards, and if we're modeling that with a neural network, then we can also compute the gradients of that neural network to back-propagate rewards into actions as following. And so then specifically what this would look like,","zh":"我们经常将这类问题称为展望未来，即规划一系列能够最大化奖励的动作序列。因此，如果我们有一些模型来预测未来的状态、动作和奖励，并且我们使用神经网络来建模这些内容，那么我们也可以计算该神经网络的梯度，将奖励反向传播到动作上。因此，具体来说，这会是什么样子","start":1367.33,"end":1397.57},{"id":124,"text":"is, well, first you would collect some data. Then you would train your model. Maybe that's to minimize f of SA minus the, this is your predicted next state, this is your true next state. And then once you have this model, you could then find a set of actions.","zh":"是，首先你将收集一些数据。然后你将训练你的模型。也许这是为了最小化 f(S, A) 减去，这是你预测的下一个状态，这是你真实的下一个状态。然后一旦你有了这个模型，你就可以找到一组动作。","start":1399.25,"end":1434.76},{"id":125,"text":"That is actually, just to be explicit, for this optimization, we're minimizing the parameters of our model. And then the third step is to try to find a set of actions. This would be A hat T to T plus H. This is like, what is the course of actions that will lead to good rewards? And this would be the argmax.","zh":"实际上，为了明确这一点，在这个优化过程中，我们是在最小化我们模型的参数。然后第三步是尝试找到一组动作。这将是 A hat T 到 T 加 H。这类似于，什么是一系列能够带来良好奖励的动作？这将是 argmax。","start":1435.5,"end":1467.91},{"id":126,"text":"of the sum of rewards, sum of t. And this is over. So you might, this is, writing gradient descent on actions is a little bit, like backprop creation to actions is a little bit different from the typical backprop that we look at. So oftentimes when we run backprop, we're doing it with regard to parameters of a neural network. Here we're actually,","zh":"奖励的总和，总和 t。并且这是在某个范围上的。因此，你可能会发现，对动作进行梯度下降的写法，与我们通常看到的反向传播略有不同。因此，通常当我们运行反向传播时，我们是针对神经网络的参数进行的。在这里，我们实际上是","start":1470.71,"end":1510.01},{"id":127,"text":"Here we're actually, back propagating into these actions right here. And so specifically what this kind of third step would look like is you would need to basically like initialize, just like you randomly initialize your neural network parameters, you'll need to initialize your actions. Then you need to compute your gradient. So this would be","zh":"在这里，我们实际上是将反向传播应用到这些动作上。因此，具体来说，这种第三步会是什么样子呢？你基本上需要初始化，就像你随机初始化神经网络参数一样，你需要初始化你的动作。然后你需要计算你的梯度。因此，这将是","start":1510.89,"end":1542.5}],"notes":["本段讲解了基于模型的强化学习中，如何利用模型预测未来状态和奖励，并通过梯度下降优化动作序列。首先需要收集数据并训练模型，通过最小化预测状态与真实状态之间的差异来优化模型参数。","接着，利用训练好的模型寻找最优动作序列，即通过最大化累积奖励来选择动作。这一步需要初始化动作，并计算梯度，与传统的神经网络参数梯度下降不同，这里是将奖励反向传播到动作上。","在反向传播过程中，需要初始化动作，类似于随机初始化神经网络参数，然后计算梯度。这表明在基于模型的强化学习中，动作的优化过程与参数优化过程有相似之处，但目标不同。","此外，本段提到反向传播到动作的过程与传统反向传播不同，强调了在基于模型的强化学习中，梯度计算不仅涉及模型参数，还涉及动作空间的优化。","最后，本段指出，寻找最优动作序列的过程需要明确目标函数，即最大化累积奖励，并通过梯度下降方法进行优化。","整个过程体现了基于模型的强化学习中，模型预测与动作优化的结合，以及梯度计算在不同层次上的应用。"],"formulas":[{"latex":"\\operatorname*{argmax}_{a_t} \\sum_{t=0}^{T} \\text{rewards}_t","symbols":"argmax 表示选择使累积奖励最大的动作序列","explanation":"原公式中的 'sum of rewards from t=0 to T' 被正确转换为数学表达式，但 'sum of rewards' 未明确表示为奖励的总和，因此将其明确为 $\\sum_{t=0}^{T} \\text{rewards}_t$。","evidence":"That is actually, just to be expli ism being encapsulated by the dynamics in the state variable.","zh":"你之前的动作估计值减去 alpha 乘以这里的梯度。我会将这个单独列出。是的，很好的问题。在这一设定中，动作将是连续的。是的。我们还将查看可以使用离散动作的情况。我们假设奖励是确定性的，但事实上我们一直假设奖励是确定性的。你可以将任何类型的非确定性视为状态变量中动态的一部分。","start":1614.95,"end":1649.84},{"id":131,"text":"Correct. Yeah. So here we have a dynamics model. And I guess I didn't explicitly write this, but","zh":"正确。是的。在这里我们有一个动态模型。我想我没有明确写出这一点，但","start":1650.86,"end":1655.94},{"id":132,"text":"you also need to have, you would also be trading some reward function. Maybe this is like R psi,","zh":"你还需要有一个奖励函数。也许这就是像 R psi 这样的形式。","start":1657.46,"end":1665.08},{"id":133,"text":"for example. And this we'd be using like some of the reward learning techniques that we've","zh":"例如。我们将使用我们之前讨论的一些奖励学习技术。","start":1665.3,"end":1670.02},{"id":134,"text":"talked about. There's also some scenarios where you might know the reward. So it might be,","zh":"还有一些场景你可能知道奖励。例如，如果你在学习如何行走，那么前向速度，或者一些距离","start":1670.02,"end":1674.5},{"id":135,"text":"for example, like forward velocity, if you're trying to learn how to walk, or some distance","zh":"可能就是例子。","start":1674.56,"end":1679.9},{"id":136,"text":"instance to some goal, that sort of thing.","zh":"将实例与某些目标联系起来，诸如此类的事情。","start":1679.9,"end":1681.18},{"id":137,"text":"And in those cases, you don't need to learn a reward function.","zh":"在这些情况下，你不需要学习一个奖励函数。","start":1681.36,"end":1683.8},{"id":138,"text":"the question is, if your dynamics model is","zh":"问题是，如果你的动力学模型是","start":1684.7,"end":1687.86},{"id":139,"text":"stochastic, how do you backprop through it?","zh":"随机的，你如何通过它进行反向传播？","start":1687.86,"end":1690.48},{"id":140,"text":"That gets into a lot of the deep.","zh":"这涉及很多深度内容。","start":1692.6,"end":1697.1},{"id":141,"text":"It kind of depends on how you're modeling the stochasticity.","zh":"它在很大程度上取决于你如何建模随机性。","start":1697.2,"end":1700.32},{"id":142,"text":"there are certain tricks for differentiating through samples","zh":"有一些技巧可以用于对样本进行微分","start":1700.7,"end":1703.82},{"id":143,"text":"there are certain tricks for differentiating through samples","zh":"有一些技巧可以用于对样本进行微分","start":1704.04,"end":1706.52},{"id":144,"text":"from that Gaussian.","zh":"从那个高斯分布。","start":1706.52,"end":1707.54},{"id":145,"text":"Whereas if you're using something like a diffusion model, it would look a bit different.","zh":"而如果你使用的是像扩散模型这样的模型，它的形式会有所不同。","start":1708.08,"end":1712.96},{"id":146,"text":"So it is kind of model dependent. And so far, we're talking about deterministic models.","zh":"因此，这在一定程度上是模型相关的。到目前为止，我们讨论的都是确定性模型。","start":1713.28,"end":1722.7}],"notes":["本段讨论了在基于模型的强化学习中，如何通过链式法则计算奖励对动作的梯度。讲者提到，梯度计算需要先计算奖励对状态的梯度，再通过状态对动作的梯度进行链式法则的展开。这表明在模型中，奖励函数和动态模型是关键组成部分。","讲者指出，如果动态模型是随机的，如何通过它进行反向传播是一个重要问题。对于高斯分布模型，存在一些技巧可以进行梯度计算，而扩散模型则需要不同的方法。这说明模型的类型会影响梯度计算的具体实现。","讲者提到，如果奖励函数已知，就不需要学习奖励函数，例如在学习行走时，可以使用前向速度作为奖励。这表明在某些场景中，奖励函数可以是已知的，从而简化了学习过程。","讲者还提到，动态模型可以是确定性的，也可以是随机的，这取决于具体的应用场景。这表明在基于模型的强化学习中，动态模型的类型是影响算法设计的重要因素。","讲者强调，梯度计算需要考虑状态和动作之间的关系，以及奖励函数的结构。这表明在模型中，状态、动作和奖励之间的关系是梯度计算的基础。","讲者提到，对于随机模型，如高斯分布，可以通过特定的技巧进行梯度计算，而扩散模型则需要不同的方法。这表明不同的模型结构会影响梯度计算的具体实现方式。"],"formulas":[{"latex":"a_{\\hat{t}+h} = a_{\\hat{t}} - \\alpha \\cdot \\nabla_{a} R","symbols":"使用梯度下降更新动作","explanation":"该公式正确表达了使用梯度下降更新动作的数学形式，其中 \\alpha 是学习率，\\nabla_{a} R 是奖励对动作的梯度。","evidence":"Then if you apply the chain rule, you could then have a second term that's d states, d actions, to actually get the gradient of the rewards with respect to the action. And then once you have your gradient, then you could use it to update your actions with gradient descent. And so then maybe this is your initial a hat. a hat t to t plus h is going to be"},{"latex":"R_{\\psi}","symbols":"奖励函数的表示","explanation":"该公式正确表示了奖励函数，其中 \\psi 是奖励函数的参数。","evidence":"you also need to have, you would also be trading some reward function. Maybe this is like R psi,"}],"uncertainties":["d states, d actions","R psi"],"diagram":"none","start":1544.4,"end":1722.7,"asr_flags":[],"math_clarifications":["公式 0 的链式法则表达不准确，未明确变量之间的依赖关系，因此需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":1544.4,"text":"the gradient of the sum of rewards with respect to the actions that you take. And to compute this gradient, this would be, you can think of it essentially like if you use the chain rule, the gradient will be the sum of rewards with respect to the states. So that would just be based off of your reward model. And then you'll have"},{"start":1579.5,"text":"Then if you apply the chain rule, you could then have a second term that's d states, d actions, to actually get the gradient of the rewards with respect to the action. And then once you have your gradient, then you could use it to update your actions with gradient descent. And so then maybe this is your initial a hat. a hat t to t plus h is going to be"},{"start":1614.95,"text":"your previous A hat minus alpha times this gradient right here. I'm going to put this separately. Yeah, great question. Actions would be continuous in this setting. Yeah. We'll also look at scenarios where we can do it with the discrete actions as well. We're assuming rewards are deterministic, but we've actually always assumed rewards are deterministic. And you can consider any sort of non-determinism being encapsulated by the dynamics in the state variable."},{"start":1650.86,"text":"Correct. Yeah. So here we have a dynamics model. And I guess I didn't explicitly write this, but"},{"start":1657.46,"text":"you also need to have, you would also be trading some reward function. Maybe this is like R psi,"},{"start":1665.3,"text":"for example. And this we'd be using like some of the reward learning techniques that we've"},{"start":1670.02,"text":"talked about. There's also some scenarios where you might know the reward. So it might be,"},{"start":1674.56,"text":"for example, like forward velocity, if you're trying to learn how to walk, or some distance"},{"start":1679.9,"text":"instance to some goal, that sort of thing."},{"start":1681.36,"text":"And in those cases, you don't need to learn a reward function."},{"start":1684.7,"text":"Yeah, so the question is, if your dynamics model is"},{"start":1687.86,"text":"stochastic, how do you backprop through it?"},{"start":1692.6,"text":"That gets into a lot of the deep."},{"start":1697.2,"text":"It kind of depends on how you're modeling the stochasticity."},{"start":1700.7,"text":"So if you're using a Gaussian, for example,"},{"start":1704.04,"text":"there are certain tricks for differentiating through samples"},{"start":1706.52,"text":"from that Gaussian."},{"start":1708.08,"text":"Whereas if you're using something like a diffusion model, it would look a bit different."},{"start":1713.28,"text":"So it is kind of model dependent. And so far, we're talking about deterministic models."}],"speech_gaps":[],"frame":"../frames/v021/010.webp","frame_time":1556.4},{"title":"基于模型的强化学习中的规划与模型误差","segments":[{"id":147,"text":"Yeah. So the question is, will this start to exploit errors in the reward?","zh":"是的。那么问题是，这会开始利用奖励中的错误吗？","start":1722.9,"end":1727.52},{"id":148,"text":"Yeah. So this will start to exploit both errors in the reward, but also errors in the dynamics model.","zh":"是的。这会开始同时利用奖励中的错误以及动态模型中的错误。","start":1727.82,"end":1731.98},{"id":149,"text":"model. So if your dynamics model is inaccurate or if your reward model is inaccurate, if either one","zh":"模型。所以如果你的动态模型不准确，或者你的奖励模型不准确，如果其中任何一个不准确，","start":1731.98,"end":1738.56},{"id":150,"text":"of them is inaccurate, then you might get actions that aren't actually going to take good actions","zh":"你可能会得到一些实际上在现实中不会产生良好动作的动作。","start":1738.56,"end":1744.58},{"id":151,"text":"in the world. And that's a problem. And so we'll talk about that in a second.","zh":"这是一个问题。我们稍后会讨论这一点。","start":1744.58,"end":1750.72},{"id":152,"text":"Yeah. So this is a good question. So I guess instead of repeating it, I think what would","zh":"是的。这是一个好问题。所以我想与其重复一遍，更有帮助的是，我们实际上并没有在这里学习策略。","start":1751.6,"end":1756.94},{"id":153,"text":"be helpful is we aren't actually learning a policy here. And that's essentially what you're","zh":"而你指出的这一点，基本上就是这个意思，","start":1756.94,"end":1761.14},{"id":154,"text":"you're pointing out uh and and this is essentially um this is now this is like becoming our policy","zh":"而这现在正变得像我们的策略一样。","start":1761.14,"end":1770.72},{"id":155,"text":"uh quote unquote um this is like our behavior and the um do i have a good term for this i guess i","zh":"嗯，引用一下，嗯，这就像我们的行为，嗯，我有没有一个好词来描述这个呢，我想我","start":1770.72,"end":1778.56},{"id":156,"text":"mean yeah this is like sort of the policy uh in quotes uh and this is what we call planning where","zh":"是的，这就像一种策略，嗯，用引号表示，这也就是我们所说的规划，","start":1778.56,"end":1787.96},{"id":157,"text":"where at every single state, we're actually going to be planning forward and thinking ahead,","zh":"在每一个状态，我们实际上都会向前规划并考虑未来的情况，","start":1787.96,"end":1792.22},{"id":158,"text":"like, what are the actions I should consider that I think will lead to good reward?","zh":"比如，我应该考虑哪些动作，我认为这些动作会带来好的奖励？","start":1792.48,"end":1796.32},{"id":159,"text":"And we'll actually be doing this optimization process every single state when we're doing planning.","zh":"我们在进行规划时，实际上会在每一个状态都执行这个优化过程。","start":1798.28,"end":1804.7},{"id":160,"text":"So on the slide, we'll be running some policy to collect data,","zh":"在幻灯片上，我们会运行某种策略来收集数据，","start":1806.72,"end":1811.36},{"id":161,"text":"learning a model to try to be able to accurately model the dynamics,","zh":"学习一个模型，以尽可能准确地建模动态，","start":1812.3,"end":1817.52},{"id":162,"text":"potentially also learning a reward function as well.","zh":"也可能同时学习一个奖励函数。","start":1817.96,"end":1820.52},{"id":163,"text":"And then we'll be back-propagating through the reward and the dynamics","zh":"然后我们将通过奖励和动态进行反向传播，以进行选择。","start":1821.9,"end":1826.98},{"id":164,"text":"in order to choose.","zh":"为了进行选择，我们将这样做。","start":1826.98,"end":1828.4},{"id":165,"text":"And then once we choose those actions, we'll then be executing these actions in the environment. And then after we execute those actions, we'll then be rerunning this planning process again. So in particular, I guess maybe to explicitly write that out, we'll have a step four here that is to actually execute a hat t to t plus h.","zh":"一旦我们选择了这些动作，我们就会在环境中执行这些动作。执行完这些动作后，我们将再次运行这个规划过程。因此，特别地，我想也许可以明确写出，我们在这里的第四步是实际执行从时间 t 到 t 加 h 的动作。","start":1831.37,"end":1859.42},{"id":166,"text":"you will then move on back to step three after you've executed these H actions. Yeah. So the question is, we're only planning over a horizon of H, and what if we have an infinite horizon? In principle, the math, well, it's a good question.","zh":"在执行完这些 H 个动作后，你将回到第三步。是的。问题是，我们只在 H 的时间范围内进行规划，如果我们有无限的时间范围呢？从数学上讲，这是一个很好的问题。","start":1861.7,"end":1890.31}],"notes":["本段讨论了基于模型的强化学习中，模型误差（奖励模型和动态模型）对策略的影响。如果模型不准确，可能会导致执行的行动不是最优的，从而引发问题。","讲者指出，当前讨论的不是直接学习策略，而是通过规划（planning）来生成行为，这种行为被称作“策略”（in quotes），即在每个状态进行前向规划，考虑哪些行动能带来好的奖励。","规划过程涉及在每个状态进行优化，以选择最佳行动。规划过程结束后，会执行这些行动，并再次进行规划，形成一个循环。","讲者提到，规划过程通常在一个有限的时域（horizon）内进行，但如果考虑无限时域，数学上如何处理是一个值得探讨的问题。","讲者强调，规划过程是基于模型的强化学习中的关键步骤，它结合了模型学习和奖励函数学习，通过反向传播来选择行动。","讲者还提到，执行完H个行动后，会回到规划步骤，形成一个循环，这表明规划和执行是交替进行的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1722.9,"end":1890.31,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":1722.9,"text":"Yeah. So the question is, will this start to exploit errors in the reward?"},{"start":1727.82,"text":"Yeah. So this will start to exploit both errors in the reward, but also errors in the dynamics model."},{"start":1731.98,"text":"model. So if your dynamics model is inaccurate or if your reward model is inaccurate, if either one"},{"start":1738.56,"text":"of them is inaccurate, then you might get actions that aren't actually going to take good actions"},{"start":1744.58,"text":"in the world. And that's a problem. And so we'll talk about that in a second."},{"start":1751.6,"text":"Yeah. So this is a good question. So I guess instead of repeating it, I think what would"},{"start":1756.94,"text":"be helpful is we aren't actually learning a policy here. And that's essentially what you're"},{"start":1761.14,"text":"you're pointing out uh and and this is essentially um this is now this is like becoming our policy"},{"start":1770.72,"text":"uh quote unquote um this is like our behavior and the um do i have a good term for this i guess i"},{"start":1778.56,"text":"mean yeah this is like sort of the policy uh in quotes uh and this is what we call planning where"},{"start":1787.96,"text":"where at every single state, we're actually going to be planning forward and thinking ahead,"},{"start":1792.48,"text":"like, what are the actions I should consider that I think will lead to good reward?"},{"start":1798.28,"text":"And we'll actually be doing this optimization process every single state when we're doing planning."},{"start":1806.72,"text":"So on the slide, we'll be running some policy to collect data,"},{"start":1812.3,"text":"learning a model to try to be able to accurately model the dynamics,"},{"start":1817.96,"text":"potentially also learning a reward function as well."},{"start":1821.9,"text":"And then we'll be back-propagating through the reward and the dynamics"},{"start":1826.98,"text":"in order to choose."},{"start":1831.37,"text":"And then once we choose those actions, we'll then be executing these actions in the environment. And then after we execute those actions, we'll then be rerunning this planning process again. So in particular, I guess maybe to explicitly write that out, we'll have a step four here that is to actually execute a hat t to t plus h."},{"start":1861.7,"text":"you will then move on back to step three after you've executed these H actions. Yeah. So the question is, we're only planning over a horizon of H, and what if we have an infinite horizon? In principle, the math, well, it's a good question."}],"speech_gaps":[],"frame":"../frames/
