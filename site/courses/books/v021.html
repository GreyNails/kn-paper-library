v021/011.webp","frame_time":1734.9},{"title":"基于模型的强化学习中的优化方法","segments":[{"id":167,"text":"So we'll talk a little bit about this. For now, we're going to be only considering this short horizon planning. And in eight-ish slides or something, I'll talk a little bit more about what happens if you want to do infinite or very long horizon things. And we'll also talk about some of the shortcomings of it. Now, so far, we've been talking about gradient descent for optimizing actions.","zh":"所以我们会稍微谈谈这个话题。目前，我们将只考虑这种短时间范围的规划。在大约八张幻灯片之后，我会稍微谈谈如果你想要进行无限或非常长的时间范围规划会发生什么。我们还将讨论这种方法的一些不足之处。到目前为止，我们一直在谈论使用梯度下降来优化动作。","start":1893.19,"end":1922.04},{"id":168,"text":"And this is actually not the only way that you can do optimization. So it's probably the optimization technique that you're most familiar with, because we use it all the time for neural networks. But there's other ways that we can optimize a function, specifically when we're trying to optimize the sum of rewards. And if we think about gradient-based optimization,","zh":"实际上，这不是你进行优化的唯一方法。这可能是你最熟悉的优化技术，因为我们经常在神经网络中使用它。但还有其他方法可以优化一个函数，特别是当我们试图优化奖励的总和时。如果我们考虑基于梯度的优化，","start":1923.63,"end":1943.99},{"id":169,"text":"Typically, we have something that we're trying to optimize over. In this case, it would be we're trying to be optimizing over actions. And the thing that we're trying to optimize is the sum of rewards. Maybe, yeah. And so actually also there's a small mistake here. There should be a plus sign because we're maximizing, not minimizing. So the way that gradient descent works is you kind of randomly initialize.","zh":"通常，我们会有一个我们试图优化的对象。在这种情况下，我们试图优化的是动作。我们试图优化的是奖励的总和。也许，是的。实际上这里还有一个小错误。应该有一个加号，因为我们是在最大化，而不是最小化。梯度下降的工作方式是，你随机初始化一些动作，比如在这里，然后你计算该位置的梯度。也许你会发现梯度指向这个方向。然后你说，好吧，我应该移动到这里。然后你可能进行采样。你选择这个动作，因为它离当前动作有一定的步长。你在那里计算梯度，并发现梯度可能看起来像这样。","start":1945.33,"end":1973.57},{"id":170,"text":"some action like right here, and then you evaluate the gradient at that position. So maybe you find that the gradient is like pointed like this way. And then you then say, okay, I should move probably over here. And then maybe you sample this. You choose this action because that's kind of a step size away. You evaluate the gradient there, and you find that the gradient maybe looks something like this.","zh":"然后你说，也许我应该进一步向左移动，但幅度要小一些，因为斜率不太陡。然后你可能会得到一个看起来像这样的结果。你心想，好的，梯度为0了。所以也许我不会再采样其他动作了。在完成梯度下降后，你的最终选择就是这个值。","start":1973.99,"end":1998.85},{"id":171,"text":"And then you say, maybe I should move further to the left, but a little bit less because the slope is less steep. And then you get maybe something that looks like this. And you're like, OK, the gradient is 0. And so maybe I won't be sampling any further actions. And then your final choice after writing gradient descent is this value right here.","zh":"然后你说，也许我应该进一步向左移动，但幅度要小一些，因为斜率不太陡。然后你可能会得到一个看起来像这样的结果。你心想，好的，梯度为0了。所以也许我不会再采样其他动作了。在完成梯度下降后，你的最终选择就是这个值。","start":1999.49,"end":2026.2},{"id":172,"text":"is instead what I'll call sampling-based optimization. This is also called gradient-free optimization. And the way that this works is if you have some set of actions and some sum of rewards, instead of just starting from one place and evaluating the gradient, we're actually not going to use the gradients at all. And we'll just sample a bunch of actions and see what the values are.","zh":"这实际上是我要称之为基于采样的优化方法。这也被称为无梯度优化。其工作方式是，如果你有一些动作集合和一些奖励总和，我们不会像通常那样从一个起点出发并计算梯度，而是完全不使用梯度。我们只是对一系列动作进行采样，并查看它们的值是多少。","start":2026.91,"end":2052.0}],"notes":["本段主要讲解了梯度下降法在强化学习中的应用，强调了梯度下降法在优化动作选择时的步骤，包括随机初始化、评估梯度、根据梯度方向调整动作选择以及最终收敛到最优动作。同时指出在优化过程中，由于是最大化目标，应使用加号而非减号。","讲者提到梯度下降法中，梯度的方向决定了动作选择的调整方向，例如梯度指向某个方向时，应向该方向移动。同时，梯度的大小决定了移动的步长，当梯度变小时，移动的步长也应相应减小。","讲者指出，当梯度为零时，优化过程可能停止，此时选择的动作即为最终的最优动作。这表明梯度下降法在优化过程中会逐步逼近最优解。","讲者还提到，除了梯度下降法，还存在另一种优化方法，即采样优化（sampling-based optimization），也称为无梯度优化（gradient-free optimization）。这种方法不依赖梯度信息，而是通过随机采样动作并评估其对应的奖励总和来寻找最优动作。","采样优化方法适用于无法计算梯度或梯度信息不可用的情况，例如在某些复杂的强化学习问题中，直接计算梯度可能非常困难或不可行。","讲者通过对比梯度下降法和采样优化方法，强调了不同优化方法的适用场景和优缺点，为后续讨论基于模型的强化学习中的优化策略提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1893.19,"end":2052.0,"asr_flags":[],"math_clarifications":["原始文本中未明确提及任何具体的优化目标函数或梯度计算过程，因此无法确认公式\\nabla J(\\theta) = 0的适用性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1893.19,"text":"So we'll talk a little bit about this. For now, we're going to be only considering this short horizon planning. And in eight-ish slides or something, I'll talk a little bit more about what happens if you want to do infinite or very long horizon things. And we'll also talk about some of the shortcomings of it. Now, so far, we've been talking about gradient descent for optimizing actions."},{"start":1923.63,"text":"And this is actually not the only way that you can do optimization. So it's probably the optimization technique that you're most familiar with, because we use it all the time for neural networks. But there's other ways that we can optimize a function, specifically when we're trying to optimize the sum of rewards. And if we think about gradient-based optimization,"},{"start":1945.33,"text":"Typically, we have something that we're trying to optimize over. In this case, it would be we're trying to be optimizing over actions. And the thing that we're trying to optimize is the sum of rewards. Maybe, yeah. And so actually also there's a small mistake here. There should be a plus sign because we're maximizing, not minimizing. So the way that gradient descent works is you kind of randomly initialize."},{"start":1973.99,"text":"some action like right here, and then you evaluate the gradient at that position. So maybe you find that the gradient is like pointed like this way. And then you then say, okay, I should move probably over here. And then maybe you sample this. You choose this action because that's kind of a step size away. You evaluate the gradient there, and you find that the gradient maybe looks something like this."},{"start":1999.49,"text":"And then you say, maybe I should move further to the left, but a little bit less because the slope is less steep. And then you get maybe something that looks like this. And you're like, OK, the gradient is 0. And so maybe I won't be sampling any further actions. And then your final choice after writing gradient descent is this value right here. Now, an alternative way to try to do a kind of optimization"},{"start":2026.91,"text":"is instead what I'll call sampling-based optimization. This is also called gradient-free optimization. And the way that this works is if you have some set of actions and some sum of rewards, instead of just starting from one place and evaluating the gradient, we're actually not going to use the gradients at all. And we'll just sample a bunch of actions and see what the values are."}],"speech_gaps":[],"frame":"../frames/v021/012.webp","frame_time":1905.19},{"title":"基于模型的强化学习中的采样方法","segments":[{"id":173,"text":"So maybe we'll, for example, sample this action, we'll sample this action, maybe sample this one, maybe sample this one, and so forth. And the first version of a sampling-based method could just be to sample a bunch of things in parallel, and then pick the best one. This is basically just called random sampling.","zh":"也许我们会，例如，采样这个动作，我们会采样这个动作，也许采样这个，也许采样这个，依此类推。第一种基于采样的方法可能是同时采样很多东西，然后选择最好的那个。这基本上就是所谓的随机采样。","start":2052.81,"end":2080.68},{"id":174,"text":"Sometimes it actually works better than you think it might do. And if we were to do that, then we would say that, okay, this action has the highest. And so maybe I will kind of return the corresponding action for this value. But you can also do something a bit better than that, even without gradient optimization, which is that you can look at these samples and say, okay, it looks like maybe like...","zh":"有时候它实际上比你想象的要好。如果我们这样做，那么我们会说，这个动作的值最高。因此，也许我会返回对应的动作。但你也可以在不使用梯度优化的情况下做一点更好的事情，即观察这些样本并说，嗯，看起来可能……","start":2081.85,"end":2105.89},{"id":175,"text":"maybe we have one more, one additional sample thing that we've, maybe we've also sampled something like this. And in that case, one thing that we could do is instead of just considering this one and taking the best, is we could say maybe we should sample more over here. Because these are the ones that were the best. And so we could fit","zh":"也许我们还有一个额外的样本，也许我们还采样了类似的东西。在这种情况下，我们可以做的一件事是，而不是只考虑这个并选择最好的，我们可以认为也许我们应该在这里采样更多。因为这些是表现最好的。因此，我们可以拟合","start":2106.35,"end":2127.2},{"id":176,"text":"we could basically try to sample more from the things that were good. So we could take the ones that were the best, fit some kind of distribution over those, like a simple distribution like a Gaussian. Say that, OK, these were the actions that were the best. So maybe we could fit some Gaussian or sample more from the actions here. And then do another round of sampling from that new distribution, where now you're going to be sampling more from this distribution. You find that when you sample for a second round, maybe you get","zh":"我们基本上可以尝试从表现好的那些动作中进行更多采样。因此，我们可以取那些最好的动作，拟合一个分布，比如一个简单的分布，如高斯分布。说，嗯，这些是表现最好的动作。因此，也许我们可以拟合一个高斯分布，或者从这些动作中进行更多采样。然后从这个新分布中进行另一轮采样，现在你将从这个分布中进行更多采样。你会发现，当你进行第二轮采样时，可能会得到","start":2130.05,"end":2157.43},{"id":177,"text":"samples that look like this. And that allows you to hone in on what a good action might be. So on the slides, I did this on the slides instead of with actions and maximizing rewards, I did it with parameters and minimizing some loss function. But all the ideas are the same. So for gradient descent, we...","zh":"看起来像这样的样本。这使你能够更精确地找到一个好动作可能是什么。在幻灯片上，我用参数和最小化某个损失函数来演示了这一点，而不是用动作和最大化奖励。但所有的想法都是相同的。因此，对于梯度下降，我们……","start":2159.67,"end":2185.57},{"id":178,"text":"pick an initial value, evaluate the gradient, move in the direction of the gradient, and repeat that process. There's some underlying function that we don't know, and so we're trying to get to the minimum of that function using these gradients. And likewise with sampling, or another way to call this is a zeroth order optimization, we're instead going to be sampling points.","zh":"选择一个初始值，计算梯度，沿着梯度方向移动，并重复这个过程。存在一个我们不知道的潜在函数，因此我们试图利用这些梯度来找到该函数的最小值。同样地，在采样方面，或者另一种称呼是零阶优化，我们将通过采样点来进行操作。","start":2186.31,"end":2209.26}],"notes":["本段讲解了基于采样的强化学习方法，强调了通过采样来寻找最优动作的策略。讲者提到，虽然随机采样可能不如梯度优化方法高效，但有时也能取得不错的效果。此外，还提到可以通过对表现好的样本进行更多采样，从而改进策略，例如使用高斯分布来建模这些样本。","讲者进一步说明，这种采样方法可以与梯度下降方法进行类比，即通过采样点来逼近目标函数的最小值。这种方法被称为零阶优化，因为它不依赖于梯度信息，而是直接通过采样来寻找最优解。","在讲解过程中，讲者提到在幻灯片上展示了一个例子，用参数和损失函数代替了动作和奖励最大化，但核心思想是相同的。这说明了采样方法的通用性，可以应用于不同的优化问题。","讲者还提到，梯度下降方法的基本步骤包括选择初始值、计算梯度、沿梯度方向移动，并重复这一过程。这种方法依赖于对目标函数的梯度信息，而采样方法则不依赖于梯度，而是通过直接采样来寻找最优解。","讲者强调了采样方法和梯度下降方法之间的区别，指出采样方法属于零阶优化，而梯度下降属于一阶优化。这说明了不同优化方法的适用场景和优缺点。","最后，讲者提到在采样过程中，可以通过对表现好的样本进行更多采样，从而逐步逼近最优解。这种方法类似于在搜索空间中进行探索，通过不断调整采样分布来提高效率。"],"formulas":[{"latex":"x_{t+1} = x_t - \\nabla f(x_t)","symbols":"x_t: 第t次迭代的参数值，\\nabla f(x_t): 在x_t处的目标函数梯度","explanation":"公式正确，表示梯度下降法的迭代更新规则，其中x_{t+1}是第t+1次迭代的参数值，\\nabla f(x_t)是目标函数在x_t处的梯度。","evidence":"pick an initial value, evaluate the gradient, move in the direction of the gradient, and repeat that process. There's some underlying function that we don't know, and so we're trying to get to the minimum of that function using these gradients. And likewise with sampling, or another way to call this is a zeroth order optimization, we're instead going to be sampling points."}],"uncertainties":["maybe we have one more, one additional sample thing that we've, maybe we've also sampled something like this."],"diagram":"none","start":2052.81,"end":2209.26,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2052.81,"text":"So maybe we'll, for example, sample this action, we'll sample this action, maybe sample this one, maybe sample this one, and so forth. And the first version of a sampling-based method could just be to sample a bunch of things in parallel, and then pick the best one. This is basically just called random sampling."},{"start":2081.85,"text":"Sometimes it actually works better than you think it might do. And if we were to do that, then we would say that, okay, this action has the highest. And so maybe I will kind of return the corresponding action for this value. But you can also do something a bit better than that, even without gradient optimization, which is that you can look at these samples and say, okay, it looks like maybe like..."},{"start":2106.35,"text":"maybe we have one more, one additional sample thing that we've, maybe we've also sampled something like this. And in that case, one thing that we could do is instead of just considering this one and taking the best, is we could say maybe we should sample more over here. Because these are the ones that were the best. And so we could fit"},{"start":2130.05,"text":"we could basically try to sample more from the things that were good. So we could take the ones that were the best, fit some kind of distribution over those, like a simple distribution like a Gaussian. Say that, OK, these were the actions that were the best. So maybe we could fit some Gaussian or sample more from the actions here. And then do another round of sampling from that new distribution, where now you're going to be sampling more from this distribution. You find that when you sample for a second round, maybe you get"},{"start":2159.67,"text":"samples that look like this. And that allows you to hone in on what a good action might be. So on the slides, I did this on the slides instead of with actions and maximizing rewards, I did it with parameters and minimizing some loss function. But all the ideas are the same. So for gradient descent, we..."},{"start":2186.31,"text":"pick an initial value, evaluate the gradient, move in the direction of the gradient, and repeat that process. There's some underlying function that we don't know, and so we're trying to get to the minimum of that function using these gradients. And likewise with sampling, or another way to call this is a zeroth order optimization, we're instead going to be sampling points."}],"speech_gaps":[],"frame":"../frames/v021/013.webp","frame_time":2064.81},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":179,"text":"and trying to figure out what a good value is just from sampling. And again, there is some underlying curve here that we don't know. We can only evaluate samples, or in the case of gradient descent, the gradient of those samples. One other nice thing about a sampling-based optimization is that it means that you don't need gradients. So it can apply to discrete variables. It can also apply to scenarios where","zh":"并且试图仅通过采样来确定一个好的值。同样，这里存在一些我们不知道的潜在曲线。我们只能评估样本，或者在梯度下降的情况下，这些样本的梯度。采样优化方法的另一个优点是，这意味着你不需要梯度。因此，它可以应用于离散变量。它也可以应用于以下场景","start":2210.42,"end":2236.16},{"id":180,"text":"You maybe know the reward function. You have reward values, but you don't know what the gradient of the reward function is. If it's a discrete reward function, then getting the gradient might be challenging.","zh":"你可能知道奖励函数。你有奖励值，但你不知道奖励函数的梯度。如果这是一个离散奖励函数，那么获取梯度可能会有挑战性。","start":2236.8,"end":2261.45},{"id":181,"text":"One method for doing this is cross-entropy method. There's also a way to do this with, well, if you have discrete actions, you could also just, well, there's somewhat of a different process, but you could also just use random sampling if your action space is small enough. So what cross-entropy method does, not to be confused with the cross-entropy loss, is you sample from some initial distribution. This could be a uniform distribution.","zh":"实现这一目标的一种方法是交叉熵方法。此外，如果你有离散动作，你也可以直接使用随机采样，只要你的动作空间足够小。交叉熵方法所做的，不要与交叉熵损失混淆，是：从某个初始分布中进行采样。这可以是一个均匀分布。","start":2261.89,"end":2288.29},{"id":182,"text":"Then rank the samples according to their loss to get the, like, this would be the best one, this would be the second best, this third best, fourth best, and so forth. And then take the best ones, like these three ones, and then fit a distribution, like a Gaussian distribution, to those best samples. And then resample from your distribution, re-rank, and repeat this process.","zh":"然后根据它们的损失值对样本进行排序，以得到，比如，这是最好的一个，这是第二好的，这是第三好的，第四好的，依此类推。然后选取最好的样本，比如这三个样本，然后对这些最好的样本拟合一个分布，比如高斯分布。然后从你的分布中重新采样，重新排序，并重复这个过程。","start":2289.61,"end":2318.33},{"id":183,"text":"So it's basically like a very simple sampling-based way to try to get, in this case, good actions. It's kind of a general optimization technique that could be used for any sort of objective. Now, cool. And then after this process, eventually, after you run some number of iterations, you'll return the best sample that you found in the last iteration.","zh":"因此，这基本上是一种非常简单的基于采样的方法，用于尝试在这个情况下获得好的动作。它是一种通用的优化技术，可以用于任何类型的优化目标。现在，很酷。然后经过这个过程，经过一些迭代次数后，你会返回最后一次迭代中找到的最佳样本。","start":2319.61,"end":2345.28},{"id":184,"text":"The question is, can you also use sampling to approximate gradients? Yes. So there's something called finite differences, where if you don't have a way to get gradients, then you could try to sample basically points very close together and then use that to basically look at the difference between this point and this point and use that to estimate the gradient. There's pros and cons to it, but there's definitely a valid approach.","zh":"问题是，你也可以用采样来近似梯度吗？是的。有一种叫做有限差分的方法，如果你没有获取梯度的方式，那么你可以尝试采样非常接近的点，然后利用这些点之间的差异来估计梯度。这种方法有利也有弊，但无疑是一种有效的途径。","start":2346.49,"end":2372.91}],"notes":["本段讲解了基于采样的优化方法，特别是交叉熵方法（cross-entropy method）的应用。该方法通过从初始分布（如均匀分布）中采样，根据损失函数对样本进行排序，选择最优样本并拟合分布（如高斯分布），然后重新采样并重复这一过程。这种方法适用于离散动作空间，且不需要梯度信息。","交叉熵方法与交叉熵损失函数不同，其核心思想是通过迭代优化分布来逼近最优解。在每次迭代中，选择表现最好的样本，拟合新的分布，并在下一轮中使用该分布进行采样。这种方法可以用于任何优化目标，而不仅仅是强化学习问题。","在采样过程中，样本的排序是基于损失函数的值，这通常与目标函数相关。例如，在强化学习中，损失函数可能与奖励函数相关，而最优样本即为在当前分布下表现最好的动作。","在采样后，拟合分布（如高斯分布）是为了生成更接近最优解的样本。通过重复这一过程，可以逐步逼近最优解。这种方法在离散动作空间中特别有用，因为不需要计算梯度。","除了交叉熵方法，还可以使用随机采样来优化目标函数，前提是动作空间足够小。这种方法虽然简单，但可能不如交叉熵方法高效。","最后，讨论了如何利用采样来近似梯度，即有限差分法（finite differences）。该方法通过在目标函数附近采样点，计算其差值来估计梯度。虽然这种方法有其优缺点，但确实是一种有效的替代方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2210.42,"end":2372.91,"asr_flags":[],"math_clarifications":["原文未明确提及有限差分法的具体公式，因此无法核定该公式的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2210.42,"text":"and trying to figure out what a good value is just from sampling. And again, there is some underlying curve here that we don't know. We can only evaluate samples, or in the case of gradient descent, the gradient of those samples. One other nice thing about a sampling-based optimization is that it means that you don't need gradients. So it can apply to discrete variables. It can also apply to scenarios where"},{"start":2236.8,"text":"You maybe know the reward function. You have reward values, but you don't know what the gradient of the reward function is. If it's a discrete reward function, then getting the gradient might be challenging. Okay, and then to formalize this kind of iterative sampling process where we're trying to sample more from..."},{"start":2261.89,"text":"the good actions. One method for doing this is cross-entropy method. There's also a way to do this with, well, if you have discrete actions, you could also just, well, there's somewhat of a different process, but you could also just use random sampling if your action space is small enough. So what cross-entropy method does, not to be confused with the cross-entropy loss, is you sample from some initial distribution. This could be a uniform distribution."},{"start":2289.61,"text":"Then rank the samples according to their loss to get the, like, this would be the best one, this would be the second best, this third best, fourth best, and so forth. And then take the best ones, like these three ones, and then fit a distribution, like a Gaussian distribution, to those best samples. And then resample from your distribution, re-rank, and repeat this process."},{"start":2319.61,"text":"So it's basically like a very simple sampling-based way to try to get, in this case, good actions. It's kind of a general optimization technique that could be used for any sort of objective. Now, cool. And then after this process, eventually, after you run some number of iterations, you'll return the best sample that you found in the last iteration."},{"start":2346.49,"text":"The question is, can you also use sampling to approximate gradients? Yes. So there's something called finite differences, where if you don't have a way to get gradients, then you could try to sample basically points very close together and then use that to basically look at the difference between this point and this point and use that to estimate the gradient. There's pros and cons to it, but there's definitely a valid approach."}],"speech_gaps":[],"frame":"../frames/v021/014.webp","frame_time":2222.42},{"title":"基于模型的强化学习中策略的表示与计算","segments":[{"id":185,"text":"Yeah, the reason is why do I put the quotes around the policy here? The reason is that we're not like learning a parametric policy. We're not like learning a neural network to represent a policy. And there's actually like an optimization process underlying the policy here. And so typically we don't.","zh":"是的，我在这里为什么用引号把策略括起来呢？原因是我们并不是在学习一个参数化的策略。我们也不是在用神经网络来表示策略。实际上，这里有一个底层的优化过程。因此，通常我们不会这样做。","start":2373.96,"end":2394.72},{"id":186,"text":"It's a policy in the sense that it is mapping from a state to an action or a state to actually multiple future actions. But it's often not referred to as a policy because to differentiate it from policies that are like more like neural network like that are like more compact.","zh":"这里的策略是指它从状态映射到动作，或者从状态映射到多个未来的动作。但通常不称其为策略，以区别于那些更像神经网络的、更加紧凑的策略。","start":2396.45,"end":2415.13},{"id":187,"text":"Well, you can also have a linear function that's mapping states and actions. The main thing is that it's a process, it's like an iterative optimization process rather than some closed form like here's an action for a state. The question is, can we talk a little bit about how this policy is stored? The only thing that we have learned at this point is a dynamics model and potentially a reward function.","zh":"你也可以有一个线性函数，它将状态和动作进行映射。关键点在于，它是一个过程，是一个迭代的优化过程，而不是某种闭式解，比如这里有一个状态对应一个动作。问题是，我们能否稍微谈谈这个策略是如何存储的？到目前为止，我们唯一学到的是动力学模型和潜在的奖励函数。","start":2416.38,"end":2442.41},{"id":188,"text":"And so the only thing that we have stored is the parameters of the model and the parameters of your reward model. And then when you're actually trying to figure out what to do and what actions to take, what policy to follow, we don't have a neural network that's telling us what actions to take. Instead, every single time step, you're thinking, okay, what's going to happen if I do this, this, or this? And then choosing actions that you think are good.","zh":"因此，我们唯一存储的是模型的参数和奖励模型的参数。当你实际试图决定要做什么以及采取什么动作、遵循什么策略时，我们并没有一个神经网络在告诉我们该采取什么动作。相反，每次时间步，你都在思考：如果我这样做、这样做或这样做，会发生什么？然后选择你认为好的动作。","start":2443.06,"end":2470.34},{"id":189,"text":"as a result of that kind of thinking process.","zh":"这种思考过程的结果是","start":2470.88,"end":2473.16},{"id":190,"text":"This ends up being like you're using a lot more compute as part of this process.","zh":"这最终会消耗大量的计算资源，作为这个过程的一部分。","start":2473.86,"end":2477.7},{"id":191,"text":"You're doing that like in real time as you're trying to figure out what actions to take.","zh":"你是在实时进行这种思考，当你试图决定采取什么动作时。","start":2477.9,"end":2481.94},{"id":192,"text":"Yeah. So we're not recording what we're doing right now.","zh":"是的。因此，我们并没有记录我们现在正在做什么。","start":2482.72,"end":2488.5},{"id":193,"text":"Yeah. So the question is,","zh":"是的。所以问题是，","start":2488.62,"end":2490.92},{"id":194,"text":"So yeah, when you select the distribution to sample from,","zh":"所以是的，当你选择从哪个分布中进行采样时，","start":2491.02,"end":2495.08},{"id":195,"text":"So yeah, when you select the distribution to sample from,","zh":"所以是的，当你选择从哪个分布中进行采样时，","start":2495.32,"end":2499.0},{"id":196,"text":"your actions might be out of distribution compared to the data that the model was trained on","zh":"你的动作可能与模型训练数据的分布不一致","start":2500.36,"end":2504.92},{"id":197,"text":"and we'll talk a bit we'll talk in like the next slide on how to deal with that yeah yeah so the","zh":"我们会在下一张幻灯片中稍作讨论，讲讲如何处理这种情况，是的，是的，所以问题是","start":2504.92,"end":2510.84},{"id":198,"text":"question is because we're doing so much compute at test time if if you finish computing and by","zh":"因为我们测试时做了大量的计算，如果在你完成计算之后，","start":2510.84,"end":2516.66},{"id":199,"text":"the time you finish computing the state has changed how do you account for that the","zh":"到你完成计算时状态已经发生了变化，你如何对此进行处理呢？","start":2516.66,"end":2521.38},{"id":200,"text":"typically I don't know if I have a great answer for you I think that typically","zh":"通常，我不确定我有没有一个很好的答案给你，我认为通常","start":2524.72,"end":2527.54},{"id":201,"text":"Typically, when people run this in practice, they just try to make that compute process as fast as possible so that they don't have to account for the change.","zh":"通常，当人们在实践中运行这个过程时，他们只是试图尽可能加快计算过程，这样就不必考虑变化。","start":2527.54,"end":2538.4},{"id":202,"text":"I guess one thing you can do is you're kind of planning actually a sequence of actions here.","zh":"我想你可以做的一件事是，实际上你是在计划一系列的动作。","start":2538.76,"end":2546.36},{"id":203,"text":"And so if you know that, if you can estimate how long that computation took,","zh":"因此，如果你知道这一点，如果你能估计出这个计算所花费的时间，","start":2546.36,"end":2553.48}],"notes":["本段讨论了基于模型的强化学习中策略的表示方式。与参数化策略不同，这里的策略不是通过神经网络直接表示，而是一个迭代优化过程。策略的存储仅包括动态模型和奖励函数的参数，而不是一个直接的神经网络。在执行过程中，每个时间步都需要进行推理，选择可能的动作。","在策略执行过程中，由于计算量较大，可能会出现动作分布与训练数据分布不一致的问题。这需要在后续步骤中处理，例如在下一张幻灯片中讨论。此外，由于计算过程耗时，状态可能在计算过程中发生变化，因此需要考虑如何处理这种变化。","在实际应用中，人们通常会尽量优化计算过程，使其足够快，从而避免因状态变化而需要额外的处理。此外，可以考虑规划一系列动作，通过估计计算所需时间来应对状态变化的问题。","这些讨论强调了基于模型的强化学习中策略的动态性和计算复杂性，以及如何处理计算过程中的状态变化问题。"],"formulas":[],"uncertainties":["the time you finish computing the state has changed how do you account for that the","typically I don't know if I have a great answer for you I think that typically"],"diagram":"none","start":2373.96,"end":2553.48,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":2373.96,"text":"Yeah, the reason is why do I put the quotes around the policy here? The reason is that we're not like learning a parametric policy. We're not like learning a neural network to represent a policy. And there's actually like an optimization process underlying the policy here. And so typically we don't."},{"start":2396.45,"text":"It's a policy in the sense that it is mapping from a state to an action or a state to actually multiple future actions. But it's often not referred to a policy because to differentiate it from policies that are like more like neural network like that are like more compact."},{"start":2416.38,"text":"Well, you can also have a linear function that's mapping states and actions. The main thing is that it's a process, it's like an iterative optimization process rather than some closed form like here's an action for a state. The question is, can we talk a little bit about how this policy is stored? The only thing that we have learned at this point is a dynamics model and potentially a reward function."},{"start":2443.06,"text":"And so the only thing that we have stored is the parameters of the model and the parameters of your reward model. And then when you're actually trying to figure out what to do and what actions to take, what policy to follow, we don't have a neural network that's telling us what actions to take. Instead, every single time step, you're thinking, okay, what's going to happen if I do this, this, or this? And then choosing actions that you think are good."},{"start":2470.88,"text":"as a result of that kind of thinking process."},{"start":2473.86,"text":"This ends up being like you're using a lot more compute as part of this process."},{"start":2477.9,"text":"You're doing that like in real time as you're trying to figure out what actions to take."},{"start":2482.72,"text":"Yeah. So we're not recording what we're doing right now."},{"start":2488.62,"text":"Yeah. So the question is,"},{"start":2491.02,"text":"when we sample actions, can some of them be out of distribution?"},{"start":2495.32,"text":"So yeah, when you select the distribution to sample from,"},{"start":2500.36,"text":"your actions might be out of distribution compared to the data that the model was trained on"},{"start":2504.92,"text":"and we'll talk a bit we'll talk in like the next slide on how to deal with that yeah yeah so the"},{"start":2510.84,"text":"question is because we're doing so much compute at test time if if you finish computing and by"},{"start":2516.66,"text":"the time you finish computing the state has changed how do you account for that the"},{"start":2524.72,"text":"typically I don't know if I have a great answer for you I think that typically"},{"start":2527.54,"text":"Typically, when people run this in practice, they just try to make that compute process as fast as possible so that they don't have to account for the change."},{"start":2538.76,"text":"I guess one thing you can do is you're kind of planning actually a sequence of actions here."},{"start":2546.36,"text":"And so if you know that, if you can estimate how long that computation took,"}],"speech_gaps":[],"frame":"../frames/v021/015.webp","frame_time":2385.96},{"title":"基于模型的强化学习中的规划与优化方法","segments":[{"id":204,"text":"if it took like two time steps, for example,","zh":"如果需要大约两个时间步，例如，","start":2553.64,"end":2555.48},{"id":205,"text":"then instead of starting by executing AT, you could actually start by executing AT plus three.","zh":"那么你不需要一开始就执行 AT，实际上可以一开始就执行 AT 加三。","start":2555.66,"end":2559.66},{"id":206,"text":"or AT plus two, depending on how the off by one works. And so that's kind of accounting for the fact that time has moved forward. The downside there is that AT and AT plus one might be different from what was actually executed. And so you might be in a different state from where you thought you ended up in. And so that introduces challenges. And it's actually somewhat of an open research problem on how best to handle that sort of","zh":"或者 AT 加二，这取决于 off by one 的具体实现方式。因此，这在某种程度上考虑了时间已经向前推进的事实。但缺点是，AT 和 AT 加一可能与实际执行的有所不同。因此，你可能处于一个与你认为结束的状态不同的状态。这引入了挑战。实际上，如何最好地处理这种情形仍然是一个相当开放的研究问题，特别是当你基本上是异步运行这个过程，同时世界也在不断演变时。","start":2560.55,"end":2588.59},{"id":207,"text":"that sort of thing, especially if you're basically asynchronously running this process and also the world is evolving as well. Going back to doing this with gradient descent versus with samples, there's pros and cons to gradient-based and sampling-based, and this helps elucidate why sampling-based actually can be a good choice for planning.","zh":"回到使用梯度下降与使用样本进行规划的对比，梯度方法和采样方法各有优劣，这有助于解释为什么采样方法实际上在规划中可以是一个很好的选择。","start":2590.94,"end":2620.04},{"id":208,"text":"So gradient descent is very scalable, even to very high dimensions. And it works well, especially in over-parametrized regimes, like when you have a big neural network that's representing a function that may actually have fewer free parameters.","zh":"梯度下降在可扩展性方面非常出色，甚至可以扩展到非常高维的情况。它在过度参数化的情况下表现良好，例如，当你有一个大的神经网络来表示一个函数，而该函数可能实际上具有更少的自由参数时。","start":2620.91,"end":2635.63},{"id":209,"text":"The downside is that it requires a nice optimization landscape where your gradients are fairly smooth rather than not smooth, I guess. With neural networks, it ends up being, especially because neural networks have high-dimensional parameter spaces and are over-parameterized, the pros end up heavily outweighing the cons here. Some of the upsides with sampling-based approaches is that it's really easy to parallelize because you can actually","zh":"缺点是它需要一个优化景观比较平滑，而不是不平滑的环境。对于神经网络来说，由于它们具有高维参数空间并且是过度参数化的，这里的优点往往远远超过缺点。","start":2637.54,"end":2665.17},{"id":210,"text":"estimate multiple samples in parallel, whereas gradient descent, it inevitably has to be a very sequential process where you compute one gradient and then apply it and then compute the next gradient and so forth. And this parallelization can actually, in some cases, make it faster.","zh":"采样方法的一些优点是它非常容易并行化，因为你实际上可以并行估计多个样本，而梯度下降则不可避免地需要一个非常顺序的过程，即计算一个梯度，然后应用它，再计算下一个梯度，依此类推。这种并行化在某些情况下实际上可以使它更快。","start":2667.17,"end":2680.59},{"id":211,"text":"It doesn't require gradients if you don't have them. The downside is that it scales poorly to high dimensions. Because if you have a really high dimensional space, it's very hard to cover that high dimensional space with lots of different samples. So in one dimensions, something like this can actually work really, really well.","zh":"如果你没有梯度，它就不需要梯度。缺点是它在高维空间中扩展性很差。因为如果你有一个非常高维的空间，用大量的不同样本去覆盖这个高维空间是非常困难的。所以在一维的情况下，这种方法实际上可以表现得非常好。","start":2681.76,"end":2699.44},{"id":212,"text":"But if you could imagine, instead of this being one-dimensional or two-dimensional or ten-dimensional, you have to have your samples cover that space well in order to find a good optimum. Cool. So specifically what the planning approach would look like with a sampling-based optimization is you will still run some policy and train some model.","zh":"但如果你能想象，这个空间不是一维、二维或十维，而是更高维，你必须让样本很好地覆盖这个空间，才能找到一个好的最优解。很好。具体来说，基于采样的优化方法的规划方法会是：你仍然会运行一些策略并训练一些模型。","start":2699.98,"end":2729.24}],"notes":["本段讨论了在基于模型的强化学习中，时间步的处理方式以及由此带来的状态不一致问题。讲者指出，当时间步数增加时，执行的策略可能需要调整，例如从AT变为AT+3或AT+2，这取决于偏移量的处理方式。这种调整可能引入状态不一致的问题，从而带来挑战，尤其是在异步运行和环境动态变化的情况下。","讲者进一步比较了梯度下降和采样方法在规划中的优劣。梯度下降在高维空间中具有良好的可扩展性，尤其在过参数化的情况下表现良好，但需要优化景观平滑。而采样方法虽然在高维空间中扩展性较差，但易于并行化，适合某些场景。","讲者提到，采样方法的一个优势是其并行化能力，可以在多个样本上同时进行估计，而梯度下降则需要按顺序计算和应用梯度。这种并行化在某些情况下可以提高效率。","讲者指出，采样方法在低维空间中表现良好，但在高维空间中需要大量样本覆盖空间以找到最优解。这说明采样方法在高维问题中可能面临挑战。","最后，讲者提到基于采样的规划方法仍然需要运行策略并训练模型，这表明即使在采样方法中，模型的构建和策略的执行仍然是关键步骤。","讲者强调了在规划过程中，如何处理时间步的偏移和状态不一致问题仍然是一个开放的研究问题，尤其是在异步运行和环境动态变化的场景下。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2553.64,"end":2729.24,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":2553.64,"text":"if it took like two time steps, for example,"},{"start":2555.66,"text":"then instead of starting by executing AT, you could actually start by executing AT plus three."},{"start":2560.55,"text":"or AT plus two, depending on how the off by one works. And so that's kind of accounting for the fact that time has moved forward. The downside there is that AT and AT plus one might be different from what was actually executed. And so you might be in a different state from where you thought you ended up in. And so that introduces challenges. And it's actually somewhat of an open research problem on how best to handle that sort of"},{"start":2590.94,"text":"that sort of thing, especially if you're basically asynchronously running this process and also the world is evolving as well. Going back to doing this with gradient descent versus with samples, there's pros and cons to gradient-based and sampling-based, and this helps elucidate why sampling-based actually can be a good choice for planning."},{"start":2620.91,"text":"So gradient descent is very scalable, even to very high dimensions. And it works well, especially in over-parametrized regimes, like when you have a big neural network that's representing a function that may actually have fewer free parameters."},{"start":2637.54,"text":"The downside is that it requires a nice optimization landscape where your gradients are fairly smooth rather than not smooth, I guess. With neural networks, it ends up being, especially because neural networks have high-dimensional parameter spaces and are over-parameterized, the pros end up heavily outweighing the cons here. Some of the upsides with sampling-based approaches is that it's really easy to parallelize because you can actually"},{"start":2667.17,"text":"estimate multiple samples in parallel, whereas gradient descent, it inevitably has to be a very sequential process where you compute one gradient and then apply it and then compute the next gradient and so forth. And this parallelization can actually, in some cases, make it faster."},{"start":2681.76,"text":"It doesn't require gradients if you don't have them. The downside is that it scales poorly to high dimensions. Because if you have a really high dimensional space, it's very hard to cover that high dimensional space with lots of different samples. So in one dimensions, something like this can actually work really, really well."},{"start":2699.98,"text":"But if you could imagine, instead of this being one-dimensional or two-dimensional or ten-dimensional, you have to have your samples cover that space well in order to find a good optimum. Cool. So specifically what the planning approach would look like with a sampling-based optimization is you will still run some policy and train some model."}],"speech_gaps":[],"frame":"../frames/v021/016.webp","frame_time":2565.64},{"title":"基于模型的强化学习中的随机射击方法","segments":[{"id":213,"text":"like we did in the first two steps, and we'll also be choosing actions that are trying to maximize rewards. So essentially, things are the same, except the way that we do this optimization problem is going to change, where instead of writing gradient descent, we could instead sample a bunch of different actions, imagine what will happen in the future, and what rewards we'll get.","zh":"就像我们在前两个步骤中所做的那样，我们也会选择试图最大化奖励的动作。因此，本质上，事情是相同的，只是我们解决这个优化问题的方式将发生变化，而不是编写梯度下降，我们可以通过抽样一系列不同的动作，想象未来会发生什么，以及会得到什么奖励。","start":2729.8,"end":2757.24},{"id":214,"text":"and then potentially refine our selection of actions iteratively to then get a good outcome. And so in terms of what this looks like, if we use capital A as shorthand to denote this kind of AT to AT plus H, then version one is if we just do one round of sampling.","zh":"然后，我们可能会迭代地改进我们的动作选择，以获得一个好的结果。从这个角度来看，如果我们用大写字母 A 作为简写来表示这种从 AT 到 AT 加 H 的情况，那么第一种版本是如果我们只进行一轮抽样。","start":2757.69,"end":2785.83},{"id":215,"text":"then we'll sample a large number of possible action choices we could take from some distribution, then choose the set of actions that had the highest reward, and then run those actions in the environment.","zh":"然后，我们将从某个分布中抽样大量可能的动作选择，然后选择获得最高奖励的动作集合，并在环境中运行这些动作。","start":2786.46,"end":2804.33},{"id":216,"text":"The technical name for this is often called random shooting because you're shooting out different possible samples of what could happen in the future, imagining the future, evaluating the reward, and then just picking the one shot that had the highest reward. Now, the downside and the thing that's unsatisfying about this first algorithm is that this distribution may not be very good.","zh":"这种方法通常被称为随机射击，因为你在抽样未来可能发生的不同情况，想象未来，评估奖励，然后仅仅选择奖励最高的那个样本。然而，这种第一种算法的缺点和令人不满意的地方在于，这个分布可能并不是很好。","start":2807.08,"end":2833.73},{"id":217,"text":"And so what we could do is we could use the cross-entry method where we're iteratively improving that distribution, where we start from some distribution, maybe a uniform distribution, evaluate, rank, and pick the best samples that have the highest rewards.","zh":"因此，我们可以使用交叉熵方法，通过迭代改进这个分布，从某个初始分布（比如均匀分布）开始，评估、排序并选择奖励最高的样本。","start":2834.82,"end":2850.98},{"id":218,"text":"and then refit a new distribution to those best samples and repeat that process, where we're then going to be resampling from that better distribution and then evaluating those samples and repeating. If this is parallelized, this process actually can be quite fast. If you have low-dimensional actions, it's actually also pretty simple to implement.","zh":"然后，我们重新拟合一个新的分布到这些最佳样本上，并重复这个过程，即从这个更好的分布中重新抽样，评估这些样本，并重复这一过程。如果这个过程被并行化，实际上可以非常快速。如果动作是低维的，其实也非常容易实现。","start":2852.11,"end":2879.21},{"id":219,"text":"But like we talked about, it doesn't scale well to high dimensions. And so it's best if you have a somewhat low-dimensional space that you're considering. This includes both H and A, because the optimization that you're considering is over this vector right here. And you need to be, the size of this is the dimensionality of your action space times the horizon. Cool.","zh":"但是，正如我们之前讨论的，这种方法在高维空间中扩展性较差。因此，如果你考虑的空间维度相对较低会更好。这包括H和A，因为你要进行的优化是在这个向量上进行的。你需要考虑到这个向量的大小等于动作空间的维度乘以时间跨度。不错。","start":2879.95,"end":2904.13}],"notes":["本段讲解了基于模型的强化学习中的一种方法，称为随机射击（random shooting）。该方法通过采样不同的动作序列，模拟未来可能发生的场景，并评估其奖励值，从而选择最优的动作序列。这种方法的核心思想是通过多次采样和迭代优化，逐步改进动作分布，以获得更好的结果。","在随机射击方法中，初始分布可以是均匀分布，然后通过评估和排序，选择奖励最高的样本，并重新拟合一个更好的分布。这个过程可以重复进行，直到达到满意的性能。这种方法在低维动作空间中实现起来相对简单，但随着维度的增加，其计算复杂度会显著上升。","随机射击方法的一个主要缺点是其在高维空间中的扩展性较差。因此，该方法更适合于低维的决策空间，包括动作空间和时间步长（horizon）。优化过程涉及对动作空间和时间步长的联合维度进行处理，因此需要考虑其维度的大小。","在实际应用中，如果能够并行化处理，随机射击方法的计算效率可以显著提高。然而，对于高维问题，这种方法可能需要大量的计算资源和时间，因此在实际部署时需要权衡其优缺点。","本段还提到，随机射击方法的迭代过程可以通过重新采样和评估来逐步优化动作分布，从而提高整体性能。这种方法在某些特定场景下可能是一个有效的替代方案，尤其是在动作空间和时间步长相对较小的情况下。","最后，本段强调了随机射击方法的局限性，特别是在高维空间中的扩展性问题。因此，在选择使用该方法时，需要根据具体问题的维度和计算资源进行权衡。"],"formulas":[],"uncertainties":["cross-entry method"],"diagram":"none","start":2729.8,"end":2904.13,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2729.8,"text":"like we did in the first two steps, and we'll also be choosing actions that are trying to maximize rewards. So essentially, things are the same, except the way that we do this optimization problem is going to change, where instead of writing gradient descent, we could instead sample a bunch of different actions, imagine what will happen in the future, and what rewards we'll get."},{"start":2757.69,"text":"and then potentially refine our selection of actions iteratively to then get a good outcome. And so in terms of what this looks like, if we use capital A as shorthand to denote this kind of AT to AT plus H, then version one is if we just do one round of sampling."},{"start":2786.46,"text":"then we'll sample a large number of possible action choices we could take from some distribution, then choose the set of actions that had the highest reward, and then run those actions in the environment."},{"start":2807.08,"text":"The technical name for this is often called random shooting because you're shooting out different possible samples of what could happen in the future, imagining the future, evaluating the reward, and then just picking the one shot that had the highest reward. Now, the downside and the thing that's unsatisfying about this first algorithm is that this distribution may not be very good."},{"start":2834.82,"text":"And so what we could do is we could use the cross-entry method where we're iteratively improving that distribution, where we start from some distribution, maybe a uniform distribution, evaluate, rank, and pick the best samples that have the highest rewards."},{"start":2852.11,"text":"and then refit a new distribution to those best samples and repeat that process, where we're then going to be resampling from that better distribution and then evaluating those samples and repeating. If this is parallelized, this process actually can be quite fast. If you have low-dimensional actions, it's actually also pretty simple to implement."},{"start":2879.95,"text":"But like we talked about, it doesn't scale well to high dimensions. And so it's best if you have a somewhat low-dimensional space that you're considering. This includes both H and A, because the optimization that you're considering is over this vector right here. And you need to be, the size of this is the dimensionality of your action space times the horizon. Cool."}],"speech_gaps":[],"frame":"../frames/v021/017.webp","frame_time":2741.8},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":220,"text":"Let's run through an example for roughly how this would work.","zh":"让我们通过一个例子大致了解这个过程是如何进行的。","start":2912.79,"end":2917.15},{"id":221,"text":"So let's say that we are in this simple, beautiful environment and you are trying to maximize reward.","zh":"假设我们处于这个简单而优美的环境中，你正在试图最大化奖励。","start":2917.27,"end":2926.59},{"id":222,"text":"Maybe you're trying to get to the highest point because the highest point you get the nicest view.","zh":"也许你试图到达最高的点，因为最高的点可以得到最美的景色。","start":2926.79,"end":2931.25},{"id":223,"text":"So your reward is just like the height of where you get to.","zh":"因此，你的奖励就相当于你到达的高度。","start":2932.41,"end":2935.45},{"id":224,"text":"You run some policy, you collect some data like this.","zh":"你运行一些策略，收集类似这样的数据。","start":2936.05,"end":2938.95},{"id":225,"text":"and maybe you learn that when you kind of train a model on this data that when you move right","zh":"也许你学习到，当你在这些数据上训练一个模型时，当你向右移动","start":2938.95,"end":2946.33},{"id":226,"text":"then you go higher because generally when you move right kind of the elevation became higher","zh":"时，你会变得更高，因为通常当你向右移动时，海拔会变得更高。","start":2946.33,"end":2952.07},{"id":227,"text":"and then when you then kind of try to choose actions according to your model then you're","zh":"然后当你根据你的模型选择动作时，你会是","start":2953.57,"end":2961.27},{"id":228,"text":"going to learn that you should go right so you'll learn that when you're actually kind of finding","zh":"你将学到你应该向右走，因此你将学到当你实际上在寻找","start":2961.27,"end":2967.23},{"id":229,"text":"finding actions that maximize reward, your set of actions will be to go right.","zh":"能够最大化奖励的动作时，你的动作集合将是向右走。","start":2967.23,"end":2971.77},{"id":230,"text":"And then you'll actually execute those actions, and you'll go right, which is good for a bit.","zh":"然后你将实际执行这些动作，并向右走，这在一段时间内是好的。","start":2975.19,"end":2981.85},{"id":231,"text":"You'll be maximizing reward for a while, and then at some point, you'll fall off the cliff.","zh":"你将在一段时间内最大化奖励，但随后在某个时候，你会掉下悬崖。","start":2982.21,"end":2987.13},{"id":232,"text":"And that's not so good.","zh":"而这并不好。","start":2987.75,"end":2988.69},{"id":233,"text":"And this is because the thing that we talked about at the very beginning, there's this","zh":"这是因为我们在一开始谈到的那个问题，即存在","start":2991.87,"end":2995.57},{"id":234,"text":"data distribution mismatch where the data that you collected at the beginning doesn't cover the data","zh":"数据分布不匹配的问题，你最初收集的数据并不覆盖你最终策略所采取的数据。","start":2995.57,"end":3002.95},{"id":235,"text":"that you are taking with your final policy. So we have a simple fix to this. The simple fix is that","zh":"所以我们有一个简单的解决方法。这个简单的解决方法是","start":3003.49,"end":3012.57},{"id":236,"text":"when we then execute actions in our environment, we can then add those actions to our data set","zh":"当我们在环境中执行动作时，我们可以将这些动作添加到我们的数据集中","start":3013.17,"end":3020.43},{"id":237,"text":"and refit our model to that dataset,","zh":"并重新拟合我们的模型到该数据集，","start":3020.43,"end":3023.67},{"id":238,"text":"learn a more accurate model,","zh":"学习一个更准确的模型，","start":3023.85,"end":3025.31},{"id":239,"text":"and repeat this process.","zh":"并重复这个过程。","start":3025.41,"end":3026.67},{"id":240,"text":"So then this is starting to look a little bit more like a reinforcement learning algorithm, because we're actually iteratively collecting data, fitting a better model, in this case a dynamics model, sampling actions, choosing actions to execute, and running those actions in the environment. And so then when we do this,","zh":"因此，这开始看起来更像一个强化学习算法，因为我们实际上是在迭代地收集数据，拟合一个更好的模型，这里是动力学模型，采样动作，选择要执行的动作，并在环境中运行这些动作。因此，当我们这样做时，","start":3027.76,"end":3048.62},{"id":241,"text":"We will then execute the actions that we planned. So we'll go off the cliff. Then we'll learn that our model will become more accurate. We'll learn that if we go right past this point, we get a lot of negative rewards. We get a lot of very low elevation, which corresponds to negative rewards. And then we'll be able to learn a model that goes to the top and stops. Cool. Now...","zh":"我们将执行我们计划的动作。因此，我们会掉下悬崖。然后我们会学习到我们的模型会变得更加准确。我们会学习到如果我们越过这个点，我们会获得大量的负奖励。我们会获得大量的非常低的海拔，这对应于负奖励。然后我们将能够学习一个到达顶部并停止的模型。酷。现在...","start":3049.04,"end":3077.97}],"notes":["本段讲解了基于模型的强化学习（Model-Based RL）的基本工作原理，通过一个简单的例子说明了如何利用环境数据训练模型，并根据模型选择动作以最大化奖励。讲者提到，当模型不够准确时，可能会导致错误的行为，例如掉入悬崖。因此，需要不断收集数据、更新模型，并重复这一过程以提高模型的准确性。","讲者强调了数据分布不匹配（data distribution mismatch）的问题，即初始收集的数据可能无法覆盖最终策略所生成的数据。这会导致模型预测与实际环境行为之间的偏差，从而影响决策质量。","为了解决数据分布不匹配的问题，讲者提出了一种简单的修复方法：在执行动作时，将这些动作添加到数据集中，并重新拟合模型。通过不断迭代这一过程，可以逐步提高模型的准确性。","讲者进一步说明了基于模型的强化学习与传统强化学习的相似之处，即通过迭代收集数据、拟合模型、选择动作并执行，从而逐步优化策略。这种方法能够更有效地探索环境并学习到更优的策略。","在例子中，讲者提到当模型不够准确时，可能会导致错误的行为，例如掉入悬崖。这说明了模型的准确性对策略性能的重要性。通过不断更新模型，可以避免这种错误，并最终找到最优策略。","讲者最后提到，当模型足够准确时，可以学习到正确的策略，例如找到最高点并停止。这表明基于模型的强化学习能够有效地解决复杂环境中的决策问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2912.79,"end":3077.97,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":2912.79,"text":"Let's run through an example for roughly how this would work."},{"start":2917.27,"text":"So let's say that we are in this simple, beautiful environment and you are trying to maximize reward."},{"start":2926.79,"text":"Maybe you're trying to get to the highest point because the highest point you get the nicest view."},{"start":2932.41,"text":"So your reward is just like the height of where you get to."},{"start":2936.05,"text":"You run some policy, you collect some data like this."},{"start":2938.95,"text":"and maybe you learn that when you kind of train a model on this data that when you move right"},{"start":2946.33,"text":"then you go higher because generally when you move right kind of the elevation became higher"},{"start":2953.57,"text":"and then when you then kind of try to choose actions according to your model then you're"},{"start":2961.27,"text":"going to learn that you should go right so you'll learn that when you're actually kind of finding"},{"start":2967.23,"text":"finding actions that maximize reward, your set of actions will be to go right."},{"start":2975.19,"text":"And then you'll actually execute those actions, and you'll go right, which is good for a bit."},{"start":2982.21,"text":"You'll be maximizing reward for a while, and then at some point, you'll fall off the cliff."},{"start":2987.75,"text":"And that's not so good."},{"start":2991.87,"text":"And this is because the thing that we talked about at the very beginning, there's this"},{"start":2995.57,"text":"data distribution mismatch where the data that you collected at the beginning doesn't cover the data"},{"start":3003.49,"text":"that you are taking with your final policy. So we have a simple fix to this. The simple fix is that"},{"start":3013.17,"text":"when we then execute actions in our environment, we can then add those actions to our data set"},{"start":3020.43,"text":"and refit our model to that dataset,"},{"start":3023.85,"text":"learn a more accurate model,"},{"start":3025.41,"text":"and repeat this process."},{"start":3027.76,"text":"So then this is starting to look a little bit more like a reinforcement learning algorithm, because we're actually iteratively collecting data, fitting a better model, in this case a dynamics model, sampling actions, choosing actions to execute, and running those actions in the environment. And so then when we do this,"},{"start":3049.04,"text":"We will then execute the actions that we planned. So we'll go off the cliff. Then we'll learn that our model will become more accurate. We'll learn that if we go right past this point, we get a lot of negative rewards. We get a lot of very low elevation, which corresponds to negative rewards. And then we'll be able to learn a model that goes to the top and stops. Cool. Now..."}],"speech_gaps":[],"frame":"../frames/v021/018.webp","frame_time":2924.79},{"title":"基于模型的强化学习中的开环与闭环策略","segments":[{"id":242,"text":"There is a number of things that we could still improve about this algorithm. And let's talk about a few of those. So, so far we've been executing this kind of set of actions right here in the environment. So we've been planning out a sequence of actions, executing them. And so what that looks like is we have our agent.","zh":"我们还可以在这一算法上进行一些改进。让我们来谈谈其中的一些改进点。到目前为止，我们一直在环境中执行这一系列动作。也就是说，我们规划了一连串的动作，然后执行它们。具体来说，就是我们的智能体。","start":3078.92,"end":3109.02},{"id":243,"text":"And our agent is like, we're running H actions in the environment. So action AT, AT plus one, AT plus two, and so forth in some environment. And we're executing those actions without actually having access to the previous, the kind of intermediate states. And one alternative,","zh":"我们的智能体在环境中运行H个动作。例如，动作AT、AT加1、AT加2，依此类推。我们在执行这些动作时，并没有实际访问到之前的中间状态。一种替代方案是：","start":3110.47,"end":3139.76},{"id":244,"text":"that you can consider is something where at each time we're going to be planning T to AT plus H, but we could also have something where we plan AT to T plus H, but we only actually execute AT in the environment. And then we then get another, the next state back in return, and then we replan","zh":"在每个时间步，我们可以计划从T到AT加H的动作，但也可以考虑另一种情况，即我们计划从AT到T加H的动作，但只在环境中实际执行AT。然后我们得到下一个状态作为回报，并重新规划","start":3140.7,"end":3171.6},{"id":245,"text":"At the next time step, a new set of actions. And so the difference between these two things, this is often what's called open loop because you're not actually using the feedback from the环境, the intermediate STs, when you are executing future actions. Whereas this is often called closed loop because you're able to use...","zh":"在下一个时间步，一个新的动作序列。这两种方法之间的区别，通常被称为开环策略，因为在执行未来动作时，你并没有实际使用环境的反馈，即中间状态ST。而另一种方法则通常被称为闭环策略，因为你可以利用...","start":3172.24,"end":3200.55},{"id":246,"text":"You're actually kind of replanning as you get new states. So here's what that looks like. Now, I'm curious, does anyone have thoughts on scenarios in which it might be bad to be open loop like this, where you're only planning based off of ST and not planning based off of all of the future STs?","zh":"你实际上是在获取新状态后重新规划。那么，这看起来是什么样的呢？我现在很好奇，有没有人能想到一些场景，在这种开环策略下（仅基于ST进行规划，而不是所有未来的ST）可能会带来不好的结果？","start":3200.96,"end":3232.61}],"notes":["本段讨论了基于模型的强化学习中开环与闭环策略的区别。开环策略是指在执行未来动作时不使用环境反馈的中间状态，而闭环策略则是在获得新状态后重新规划动作。这种区别对策略的性能和适应性有重要影响。","讲者通过提问引导学生思考开环策略可能存在的问题，例如在动态环境或需要实时调整的场景中，仅基于初始状态进行规划可能导致策略失效。","开环策略通常用于计算效率较高的场景，因为它不需要在执行过程中频繁更新计划，而闭环策略则更适用于需要实时反馈和调整的复杂环境。","在开环策略中，规划的范围是固定的，即从当前时间步到未来H步，而执行时只执行当前动作，后续动作则在下一时间步重新规划。","闭环策略则允许在获得新状态后，根据最新的信息重新规划后续动作，从而提高策略的适应性和鲁棒性。","讲者强调了两种策略在实际应用中的不同适用场景，并通过提问鼓励学生深入思考其优缺点。"],"formulas":[],"uncertainties":["T to AT plus H","AT to T plus H"],"diagram":"none","start":3078.92,"end":3232.61,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3078.92,"text":"There is a number of things that we could still improve about this algorithm. And let's talk about a few of those. So, so far we've been executing this kind of set of actions right here in the environment. So we've been planning out a sequence of actions, executing them. And so what that looks like is we have our agent."},{"start":3110.47,"text":"And our agent is like, we're running H actions in the environment. So action AT, AT plus one, AT plus two, and so forth in some environment. And we're executing those actions without actually having access to the previous, the kind of intermediate states. And one alternative,"},{"start":3140.7,"text":"that you can consider is something where at each time we're going to be planning T to AT plus H, but we could also have something where we plan AT to T plus H, but we only actually execute AT in the environment. And then we then get another, the next state back in return, and then we replan"},{"start":3172.24,"text":"At the next time step, a new set of actions. And so the difference between these two things, this is often what's called open loop because you're not actually using the feedback from the environment, the intermediate STs, when you are executing future actions. Whereas this is often called closed loop because you're able to use..."},{"start":3200.96,"text":"You're actually kind of replanning as you get new states. So here's what that looks like. Now, I'm curious, does anyone have thoughts on scenarios in which it might be bad to be open loop like this, where you're only planning based off of ST and not planning based off of all of the future STs?"}],"speech_gaps":[],"frame":"../frames/v021/019.webp","frame_time":3090.92},{"title":"基于模型的强化学习中的闭环控制与模型预测控制","segments":[{"id":247,"text":"Yeah, so when the environment is changing a lot. So if the environment changed in a way that is different from what you anticipated, because you maybe weren't able to predict everything that would happen, then you won't react to those changes when you act in an open loop way. And instead, if you're closed loop and you're reconsidering based off of the latest states, then you're able to actually react to those changes and potentially in some cases actually","zh":"是的，当环境变化很大时。如果环境以你未曾预料到的方式发生变化，因为你可能无法预测所有可能发生的事情，那么当你以开环方式行动时，你就无法对这些变化做出反应。相反，如果你是闭环控制，并且根据最新的状态重新考虑，那么你实际上能够对这些变化做出反应，并且在某些情况下，可能会有显著更好的策略。","start":3233.26,"end":3261.02},{"id":248,"text":"have a much, much better policy. Whereas in scenarios where the world is a little bit more deterministic, it can be okay to be a little bit open loop at times, but you usually never want to have H be too large. Otherwise, you're executing too open loop. Now, we talked about how we can make planning closed loop, which is instead of...","zh":"而在那些世界稍具确定性的场景中，有时可以稍微采用开环方式，但你通常从不希望H太大。否则，你执行得太开环了。我们之前讨论过如何使规划成为闭环控制，即不是执行整个动作序列，而是只执行第一个计划的动作。","start":3262.23,"end":3286.84},{"id":249,"text":"instead of executing the entire action sequence, you could just execute only the first planned action. So we're still going to plan a sequence of actions because we need to consider not just the first action, but how all of our actions are going to affect future rewards. But then we'll execute only the first one, observe the resulting state, and then we will then replan an action sequence starting at that new next state.","zh":"因此，我们仍然需要规划一系列动作，因为我们不仅需要考虑第一个动作，还需要考虑所有动作如何影响未来的奖励。然后我们只执行第一个动作，观察结果状态，接着再以该新状态为起点重新规划动作序列。","start":3289.83,"end":3315.13},{"id":250,"text":"And then we can also, like before, also add the data to our data set and periodically refit our model based off of the latest data. This algorithm right here is something called model predictive control. It's very, very common in certain robotic systems, very widely used. It's also used in...","zh":"此外，我们也可以像之前一样，将数据添加到我们的数据集中，并定期根据最新数据重新拟合模型。这个算法叫做模型预测控制。它在某些机器人系统中非常常见，被广泛使用。它也用于其他简单的控制系统中，其中可以建模低维系统。","start":3318.38,"end":3345.38},{"id":251,"text":"other simple control systems as well, where you can model lower dimensional systems. It can be quite effective for legged robots as well, where you're trying to learn models and you're able to plan over the next couple of seconds to figure out what will lead to good performance over the next couple of seconds.","zh":"它在腿部机器人中也非常有效，当你试图学习模型并能够规划接下来的几秒钟，以确定什么会导致接下来几秒钟的良好表现。","start":3346.97,"end":3375.19},{"id":252,"text":"And this sort of replanning, when you actually are considering a new plan at the next time step, if something changes or if you made a mistake, you slipped or something, this replanning allows you to actually consider a completely different course of action and, for example, correct for, not just for changing environments, it can also actually correct for model errors.","zh":"这种重新规划，在你实际在下一个时间步考虑新计划时，如果发生了变化或你犯了错误，比如滑倒，这种重新规划使你能够考虑完全不同的行动方案，并且例如，不仅纠正变化的环境，还能纠正模型误差。","start":3378.6,"end":3403.6}],"notes":["本段讲解了在环境变化较大时，闭环控制相较于开环控制的优势。开环控制无法及时应对环境变化，而闭环控制通过不断根据最新状态重新规划策略，能够更有效地应对变化，从而获得更好的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3233.26,"end":3403.6,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3233.26,"text":"Yeah, so when the environment is changing a lot. So if the environment changed in a way that is different from what you anticipated, because you maybe weren't able to predict everything that would happen, then you won't react to those changes when you act in an open loop way. And instead, if you're closed loop and you're reconsidering based off of the latest states, then you're able to actually react to those changes and potentially in some cases actually"},{"start":3262.23,"text":"have a much, much better policy. Whereas in scenarios where the world is a little bit more deterministic, it can be okay to be a little bit open loop at times, but you usually never want to have H be too large. Otherwise, you're executing too open loop. Now, we talked about how we can make planning closed loop, which is instead of..."},{"start":3289.83,"text":"instead of executing the entire action sequence, you could just execute only the first planned action. So we're still going to plan a sequence of actions because we need to consider not just the first action, but how all of our actions are going to affect future rewards. But then we'll execute only the first one, observe the resulting state, and then we will then replan an action sequence starting at that new next state."},{"start":3318.38,"text":"And then we can also, like before, also add the data to our data set and periodically refit our model based off of the latest data. This algorithm right here is something called model predictive control. It's very, very common in certain robotic systems, very widely used. It's also used in..."},{"start":3346.97,"text":"other simple control systems as well, where you can model lower dimensional systems. It can be quite effective for legged robots as well, where you're trying to learn models and you're able to plan over the next couple of seconds to figure out what will lead to good performance over the next couple of seconds."},{"start":3378.6,"text":"And this sort of replanning, when you actually are considering a new plan at the next time step, if something changes or if you made a mistake, you slipped or something, this replanning allows you to actually consider a completely different course of action and, for example, correct for, not just for changing environments, it can also actually correct for model errors."}],"speech_gaps":[],"frame":"../frames/v021/020.webp","frame_time":3245.26},{"title":"基于模型的强化学习中的规划与模型误差处理","segments":[{"id":253,"text":"And so generally this sort of approach, if your model is accurate in a large part of the state space, but in some parts of the state space, it's inaccurate. This sort of approach ends up actually being a lot more robust to those kinds of model errors. Yeah, that's a good question. So if there are multiple correct paths, the question is, will in that sort of kind of multimodality, will that lead to like oscillation between those different?","zh":"因此，这种类型的策略，如果你的模型在状态空间的大部分区域是准确的，但在某些区域不准确，这种策略实际上会更加鲁棒地应对这类模型误差。是的，这是一个好问题。如果有多个正确的路径，问题是，在这种多模态的情况下，是否会像在这些不同路径之间震荡一样？","start":3404.44,"end":3429.8},{"id":254,"text":"It certainly can lead to that if you're replanning all the time and you might kind of start going in one direction and then maybe say, oh, maybe I'll go in a different direction. Sometimes you also won't see that if the state kind of indicates that you've clearly committed to one direction. But so sometimes you see it, sometimes you don't. The other way to accommodate this and also actually address computational challenges is that you can warm start your plan for any given time step.","zh":"如果你一直在重新规划，这种情况确实可能发生，你可能会开始朝一个方向前进，然后又说，哦，也许我应该换一个方向。有时你也不会看到这种情况，如果状态表明你已经明确选择了某个方向。因此，有时你会看到这种情况，有时则不会。另一种应对方法，同时也能解决计算挑战，是你可以在任意时间步对计划进行预热（warm start）。","start":3431.12,"end":3458.9},{"id":255,"text":"to basically the plan from the previous time step. And so if you had planned at to at plus h, and that the next time step you are planning based off of st plus 1, you're planning at plus 1 to t plus 1 plus h, then what you can do is you can actually warm start this using the","zh":"基本上使用前一个时间步的计划。因此，如果你在时间步 t 到 t + h 进行了规划，而下一个时间步你基于状态 s_{t+1} 进行规划，你是在时间步 t + 1 到 t + 1 + h 进行规划，那么你可以使用","start":3459.4,"end":3484.12},{"id":256,"text":"everything but the first time step of this previous plan. Then randomly initialize the last action, then you'll already have some initial plan that is sensible, and so you don't have to run as long of an optimization procedure. It also helps you commit to the previous action and the previous plan. Instead of randomly initializing, for example, in our sampling-based thing, you could either","zh":"这个前一个计划中除第一个时间步以外的所有内容进行预热。然后随机初始化最后一个动作，这样你已经有了一个合理的初始计划，因此不需要运行那么长的优化过程。它也有助于你坚持之前的动作和计划。例如，在我们的采样方法中，你可以选择","start":3485.36,"end":3517.44},{"id":257,"text":"Here or in a sampling-based approach, you could initialize close to the previous plan. You could also add some noise or add some variance to your sampling distribution so that you're not only considering that particular plan. Cool. So replanning helps with non-deterministic environments. It also is really, really useful for model errors.","zh":"在这里或在采样方法中，你可以初始化得接近之前的计划。你也可以在采样分布中添加一些噪声或增加一些方差，这样你不仅仅考虑那个特定的计划。很好。重新规划有助于处理非确定性环境。它对于模型误差也非常有用。","start":3518.54,"end":3537.08},{"id":258,"text":"It is also compute intensive. So the warm starting can be helpful. If you're actually replanning at every single time step, it means that every single time step you're kind of reconsidering what action to take.","zh":"它也会消耗大量计算资源。因此，预热可以有所帮助。如果你实际上在每个时间步都重新规划，这意味着每个时间步你都在重新考虑要采取什么动作。","start":3539.07,"end":3551.43},{"id":259,"text":"And so it also can introduce additional compute challenges as well. Sometimes you have something in the middle where you'll have some planning horizon, but then maybe you'll replan not every one step, but every like three steps or every 10 steps or something like that. Or maybe your horizon is something like 110 steps.","zh":"因此，它也可能引入额外的计算挑战。有时你在中间某个阶段会有一个规划时间范围，但也许你不会每一步都重新规划，而是每隔三步或每隔十步重新规划一次。或者你的规划时间范围可能是110步左右。","start":3551.79,"end":3570.05}],"notes":["本段讨论了基于模型的强化学习中模型误差对规划的影响。当模型在状态空间的某些区域不准确时，这种规划方法实际上对模型误差具有更强的鲁棒性。教师指出，如果存在多个正确的路径，可能会在这些路径之间来回切换，但有时状态会表明已经明确选择了某个方向。","教师进一步解释了如何通过热启动（warm start）来应对计算挑战。热启动利用前一步的规划结果，仅随机初始化最后一步动作，从而减少优化过程的计算量，并帮助保持对先前动作和计划的承诺。","在采样方法中，教师提到可以初始化接近先前的计划，或者在采样分布中添加噪声或方差，以考虑更多可能的路径。这有助于避免局限于单一计划，提高规划的灵活性。","教师指出，重新规划在非确定性环境中非常有用，但也会带来计算上的挑战。如果在每个时间步都进行重新规划，会增加计算负担。因此，有时会采用间隔式重新规划，例如每隔三步或十步进行一次，或者设置一个较长的规划时间范围。","教师强调了规划时间范围（planning horizon）的重要性，指出规划时间范围可以是110步等。这表明在实际应用中，需要根据具体问题调整规划的粒度和时间范围，以平衡计算效率和规划质量。","教师还提到，热启动不仅有助于减少计算量，还能帮助保持对先前计划的承诺，避免在规划过程中频繁改变方向，从而提高规划的稳定性和效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3404.44,"end":3570.05,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3404.44,"text":"And so generally this sort of approach, if your model is accurate in a large part of the state space, but in some parts of the state space, it's inaccurate. This sort of approach ends up actually being a lot more robust to those kinds of model errors. Yeah, that's a good question. So if there are multiple correct paths, the question is, will in that sort of kind of multimodality, will that lead to like oscillation between those different?"},{"start":3431.12,"text":"It certainly can lead to that if you're replanning all the time and you might kind of start going in one direction and then maybe say, oh, maybe I'll go in a different direction. Sometimes you also won't see that if the state kind of indicates that you've clearly committed to one direction. But so sometimes you see it, sometimes you don't. The other way to accommodate this and also actually address computational challenges is that you can warm start your plan for any given time step."},{"start":3459.4,"text":"to basically the plan from the previous time step. And so if you had planned at to at plus h, and that the next time step you are planning based off of st plus 1, you're planning at plus 1 to t plus 1 plus h, then what you can do is you can actually warm start this using the"},{"start":3485.36,"text":"everything but the first time step of this previous plan. Then randomly initialize the last action, then you'll already have some initial plan that is sensible, and so you don't have to run as long of an optimization procedure. It also helps you commit to the previous action and the previous plan. Instead of randomly initializing, for example, in our sampling-based thing, you could either"},{"start":3518.54,"text":"Here or in a sampling-based approach, you could initialize close to the previous plan. You could also add some noise or add some variance to your sampling distribution so that you're not only considering that particular plan. Cool. So replanning helps with non-deterministic environments. It also is really, really useful for model errors."},{"start":3539.07,"text":"It is also compute intensive. So the warm starting can be helpful. If you're actually replanning at every single time step, it means that every single time step you're kind of reconsidering what action to take."},{"start":3551.79,"text":"And so it also can introduce additional compute challenges as well. Sometimes you have something in the middle where you'll have some planning horizon, but then maybe you'll replan not every one step, but every like three steps or every 10 steps or something like that. Or maybe your horizon is something like 110 steps."}],"speech_gaps":[],"frame":"../frames/v021/021.webp","frame_time":3416.44},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":260,"text":"Yeah, it's an interesting question. So the question was, like, as you're learning and getting more data, presumably your model is going to get better and you have more confidence in your model. And so maybe insofar as this is really useful for correcting for model errors, you might be able to replan less frequently when you have a better model. So that is certainly, like, yeah.","zh":"是的，这是一个有趣的问题。问题是，当你在学习并获得更多数据时，你的模型应该会变得更好，你对模型的信心也会增加。因此，就纠正模型误差而言，当你拥有更好的模型时，也许可以减少重新规划的频率。所以，这当然是一个很有趣的观点。","start":3571.08,"end":3592.06},{"id":261,"text":"very viable. And usually at some point you will have some kind of final model that you're using after the learning process. And you could kind of re-optimize. You could use different hyperparameters with regard to like replanning for that final policy versus during the learning process. And during the learning process, it can also be valuable. Like the model errors also help you explore to some extent because you're going to be exploring exactly the regions where the model is inaccurate because you'll be incentivized to exploit any inaccuracies.","zh":"这非常可行。通常在学习过程结束后，你会有一个最终使用的模型。你也可以重新优化。你可以根据重新规划最终策略与学习过程中的策略使用不同的超参数。而且在学习过程中，这也非常有价值。例如，模型误差可以帮助你在一定程度上进行探索，因为你将探索模型不准确的区域，因为你会被激励去利用这些不准确性。","start":3593.24,"end":3620.0},{"id":262,"text":"Yeah, so the question is, it seems like this is an off-policy algorithm, and does it make sense? How do you choose that policy? So yes, this is an off-policy algorithm. We don't need to be using data from our current policy. You can actually use a pretty broad policy, and it makes sense to use a pretty broad policy, because then you'll get a model that's accurate in more places.","zh":"是的，这个问题看起来像是一个离策略算法，这样做有意义吗？如何选择这个策略？是的，这是一个离策略算法。我们不需要使用当前策略的数据。实际上，你可以使用一个相当广泛的策略，这样做是有意义的，因为这样模型在更多地方会更准确。","start":3620.84,"end":3646.34},{"id":263,"text":"assuming that your model is expressive and can fit that broader data distribution. Okay, so far we've covered planning with models. So we plan a sequence of actions we can do either with gradient descent or sampling. We then update the model using data collected through this planning process, and we can replan to help account for mistakes. This is a pretty simple way to use a learned model.","zh":"假设你的模型具有表达能力，可以拟合更广泛的数据分布。到目前为止，我们已经讨论了使用模型进行规划。我们通过梯度下降或采样来规划一系列动作。然后，我们使用通过这一规划过程收集的数据来更新模型，并且可以通过重新规划来帮助弥补错误。这是一种使用学习模型的相当简单的方法。","start":3647.02,"end":3673.73},{"id":264,"text":"One of the things that's really cool about this is if you have a model that's quite good, you can actually plug in different rewards or different goals at test time even.","zh":"这种做法的一个真正酷的地方是，如果你有一个相当好的模型，你实际上可以在测试时插入不同的奖励或不同的目标。","start":3675.21,"end":3685.65},{"id":265,"text":"and get a policy that can follow. For example, if you have a model that's universally good and you have a robot that's trying to walk, then with that same exact model, you can use this process at test time and say, I want you to run forwards, I want you to walk backwards, I want you to crouch, and this model is quite task agnostic.","zh":"并得到一个可以跟随的策略。例如，如果你有一个普遍表现良好的模型，并且有一个试图行走的机器人，那么使用这个模型，在测试时你可以执行这样的过程，比如说，我希望你向前跑，我希望你向后走，我希望你蹲下，而这个模型对任务的适应性很强。","start":3686.12,"end":3709.78},{"id":266,"text":"The downside is that it's compute-intensive at test time, and so you need to account for this. And if you have an expensive model, an expensive planning process, this kind of planning at test time might not be suitable. And the last thing is we've been talking about this for short-horizon problems. This is not applicable to long-horizon problems unless you have a shaped reward function.","zh":"缺点是，在测试时计算量很大，因此你需要考虑到这一点。如果你有一个昂贵的模型和一个昂贵的规划过程，这种在测试时的规划可能并不合适。最后，我们一直在讨论的是短时间跨度的问题。这种做法不适用于长时间跨度的问题，除非你有一个塑造奖励函数。","start":3712.55,"end":3736.22},{"id":267,"text":"If you have a shaped reward function that is telling you a lot about what a good state is versus what a bad state is,","zh":"如果你有一个塑造奖励函数，它能够告诉你什么是好的状态，什么是坏的状态，","start":3738.18,"end":3743.92},{"id":268,"text":"for example, maybe you have an infinite horizon problem in that you want to walk forward forever.","zh":"例如，你可能有一个无限时间跨度的问题，你希望永远向前行走。","start":3744.0,"end":3748.9}],"notes":["本段讨论了基于模型的强化学习中模型改进与规划频率的关系。当模型变得更准确时，可以减少重新规划的频率，因为模型的误差更少，从而减少对模型修正的需求。此外，模型在学习过程中也可以帮助探索，因为模型的不准确区域会激励探索。","在模型学习完成后，可以使用不同的超参数进行重新优化，以适应最终策略和学习过程中的策略。模型的误差有助于探索，因为探索会集中在模型不准确的区域。","本段提到基于模型的强化学习可以使用离策略算法，即不需要使用当前策略的数据。使用较广的策略有助于模型在更多区域准确，前提是模型具有足够的表达能力。","模型的表达能力决定了其能否拟合更广泛的数据分布。规划可以通过梯度下降或采样进行，然后使用收集的数据更新模型，并通过重新规划来修正错误。这是一种简单使用学习模型的方法。","当模型足够好时，可以在测试时使用不同的奖励或目标，从而生成相应的策略。例如，一个通用的模型可以用于机器人行走任务，支持不同的动作目标，如前进、后退、蹲下等。","这种方法的缺点是测试时计算成本高，因此需要考虑计算资源。如果模型和规划过程成本高昂，这种测试时的规划可能不适用。此外，这种方法适用于短时间跨度的问题，对于长时间跨度的问题需要有塑造的奖励函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3571.08,"end":3748.9,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":3571.08,"text":"Yeah, it's an interesting question. So the question was, like, as you're learning and getting more data, presumably your model is going to get better and you have more confidence in your model. And so maybe insofar as this is really useful for correcting for model errors, you might be able to replan less frequently when you have a better model. So that is certainly, like, yeah."},{"start":3593.24,"text":"very viable. And usually at some point you will have some kind of final model that you're using after the learning process. And you could kind of re-optimize. You could use different hyperparameters with regard to like replanning for that final policy versus during the learning process. And during the learning process, it can also be valuable. Like the model errors also help you explore to some extent because you're going to be exploring exactly the regions where the model is inaccurate because you'll be incentivized to exploit any inaccuracies."},{"start":3620.84,"text":"Yeah, so the question is, it seems like this is an off-policy algorithm, and does it make sense? How do you choose that policy? So yes, this is an off-policy algorithm. We don't need to be using data from our current policy. You can actually use a pretty broad policy, and it makes sense to use a pretty broad policy, because then you'll get a model that's accurate in more places."},{"start":3647.02,"text":"assuming that your model is expressive and can fit that broader data distribution. Okay, so far we've covered planning with models. So we plan a sequence of actions we can do either with gradient descent or sampling. We then update the model using data collected through this planning process, and we can replan to help account for mistakes. This is a pretty simple way to use a learned model."},{"start":3675.21,"text":"One of the things that's really cool about this is if you have a model that's quite good, you can actually plug in different rewards or different goals at test time even."},{"start":3686.12,"text":"and get a policy that can follow. For example, if you have a model that's universally good and you have a robot that's trying to walk, then with that same exact model, you can use this process at test time and say, I want you to run forwards, I want you to walk backwards, I want you to crouch, and this model is quite task agnostic."},{"start":3712.55,"text":"The downside is that it's compute-intensive at test time, and so you need to account for this. And if you have an expensive model, an expensive planning process, this kind of planning at test time might not be suitable. And the last thing is we've been talking about this for short-horizon problems. This is not applicable to long-horizon problems unless you have a shaped reward function."},{"start":3738.18,"text":"If you have a shaped reward function that is telling you a lot about what a good state is versus what a bad state is,"},{"start":3744.0,"text":"for example, maybe you have an infinite horizon problem in that you want to walk forward forever."}],"speech_gaps":[],"frame":"../frames/v021/022.webp","frame_time":3583.08},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":269,"text":"You want to learn a policy that can walk forward forever, but you have a very dense reward function that's like forward velocity.","zh":"你想学习一个能够永远向前行走的策略，但你有一个非常密集的奖励函数，类似于向前的速度。","start":3749.1,"end":3754.18},{"id":270,"text":"Then you can plan for a short horizon in a way that approximates the long horizon problem.","zh":"然后你可以以一种近似长期时间范围问题的方式，在较短的时间范围内进行规划。","start":3755.16,"end":3759.54},{"id":271,"text":"But if you have a long horizon problem that doesn't have a very dense reward signal,","zh":"但如果你有一个长期时间范围的问题，而该问题并没有非常密集的奖励信号，","start":3761.74,"end":3766.4},{"id":272,"text":"then this is not a good approach.","zh":"那么这种方法就不是个好选择。","start":3766.4,"end":3768.74},{"id":273,"text":"Cool.","zh":"不错。","start":3771.28,"end":3771.76},{"id":274,"text":"And part of the reason for this is the accuracy of the model.","zh":"其中一部分原因是模型的准确性。","start":3771.92,"end":3776.9},{"id":275,"text":"Another part of this is that it's going to be expensive","zh":"另一部分原因是，规划一个非常长的时间范围的动作序列将会非常昂贵。","start":3777.02,"end":3780.2},{"id":276,"text":"to be planning out a very long horizon sequence of actions","zh":"要规划一个非常长的时间范围的动作序列将会非常昂贵。","start":3780.2,"end":3783.92},{"id":277,"text":"because you're not learning a policy in this case.","zh":"因为在这种情况下，你并不是在学习一个策略。","start":3784.62,"end":3788.48},{"id":278,"text":"Okay.","zh":"好的。","start":3792.4,"end":3792.88},{"id":279,"text":"Okay. Now, the question is, can we train a policy using this model?","zh":"好的。现在问题是，我们能否使用这个模型来训练一个策略？","start":3792.88,"end":3798.84},{"id":280,"text":"And the first option here is you could actually distill a planner's actions into a policy.","zh":"第一个选项是，你可以将规划器的动作提炼成一个策略。","start":3800.98,"end":3806.9},{"id":281,"text":"So you could store these actions and then train a policy to match these actions.","zh":"因此，你可以存储这些动作，然后训练一个策略来匹配这些动作。","start":3807.04,"end":3811.32},{"id":282,"text":"This would address the compute-intensive problem, and this would make it a lot cheaper,","zh":"这将解决计算密集型的问题，并且会使整个过程便宜得多，","start":3813.46,"end":3819.68},{"id":283,"text":"because then you just need to run a forward pass","zh":"因为之后你只需要通过神经网络进行一次前向传播就能得到你的动作。","start":3819.68,"end":3821.5},{"id":284,"text":"through the neural network to get your actions.","zh":"通过神经网络来获取你的动作。","start":3821.5,"end":3823.48},{"id":285,"text":"This doesn't address the horizon problem, though,","zh":"不过，这并没有解决地平线问题，","start":3825.04,"end":3828.08},{"id":286,"text":"because we're still going to be using this procedure","zh":"因为我们仍然会使用这个过程","start":3828.12,"end":3830.86},{"id":287,"text":"to optimize for actions.","zh":"来优化动作。","start":3830.86,"end":3832.78},{"id":288,"text":"And then in terms of handling using models","zh":"然后，在处理较长地平线问题时，","start":3834.7,"end":3837.26},{"id":289,"text":"for longer horizon problems,","zh":"有两个主要的解决方案。","start":3837.26,"end":3838.36},{"id":290,"text":"there's two main solutions.","zh":"第一个解决方案是，目前","start":3839.1,"end":3840.88},{"id":291,"text":"The first solution is that right now","zh":"我们正在优化奖励的总和。","start":3844.1,"end":3847.64},{"id":292,"text":"we're optimizin
