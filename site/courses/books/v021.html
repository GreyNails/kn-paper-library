<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 11 基于模型的强化学习（Model-Based RL）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 11 基于模型的强化学习（Model-Based RL） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v021","title":"Lecture 11 基于模型的强化学习（Model-Based RL）","course":"强化学习","pages":[{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":0,"text":"Great. So we had some feedback in office hours and other times that it might be helpful to have like a high level recap of the algorithms that we've talked about so far to try to understand where some of the pieces fit together. So I put together one slide that is a little bit more high level, but actually captures almost all of the algorithms that we've seen so far.","start":5.23,"end":24.43},{"id":1,"text":"And in particular, we've talked about both online and offline algorithms, where online refers to scenarios where the policy will be used to collect data. And offline means that we're given a data set and we cannot do any additional data collection in our environment.","start":26.17,"end":44.25},{"id":2,"text":"In the offline setting, we talked about two different classes of reinforcement learning methods that use on-policy data collection in order to improve. We referred to the first type as on-policy RL, and the second type is off-policy RL, where on-policy RL, you can collect data, but only from the current policy. You can only use data from the current policy, and this means that you are not going to be reusing past data. You can't use offline data and so forth.","start":47.1,"end":74.18},{"id":3,"text":"And this include algorithms like reinforce or the vanilla policy gradient method. And then within the realm of off-policy RL, this was where we could start to reuse data from other policies, including data from policies before we took a gradient step on our policy parameters. And this included algorithms like PPO and importance sampling.","start":75.02,"end":95.99},{"id":4,"text":"And then we talked about algorithms that are more off policy that can reuse data from policies that are even more different and where we use a replay buffer to store the data from those past policies. And that included algorithms like DQN and SAC.","start":97.24,"end":113.34},{"id":5,"text":"And then I colored these different algorithms different colors because the blue algorithms only involve training a policy. And so we refer to them as policy gradient methods. PPO and SAC learn both a policy and a critic. And so we refer to them as actor-critic methods. And there's also algorithms that only learn a critic and don't explicitly learn a separate policy. And those are often referred to as Q-learning algorithms, such as DQM.","start":115.88,"end":143.22},{"id":6,"text":"I should also mention that PPO is often actually referred to as a policy gradient method, although you do actually learn a value function. And so we typically were referring to it as actor critic in this class to avoid confusion. And then separate from these classes of online methods, we also have offline.","start":143.91,"end":161.8},{"id":7,"text":"RL methods that we started talking about. And these built upon a lot of the ideas we saw in online RL, but I have to cope with the fact that you're not collecting any data at all. And we looked at two different approaches there. One is to constrain to only considering actions in the data.","start":162.54,"end":177.62}],"notes":["本段主要讲解了强化学习中在线和离线算法的区别，以及在离线设置下，基于策略的数据收集方法。在线算法指的是使用策略收集数据的场景，而离线算法则是给定数据集，不能进行额外的数据收集。在离线设置下，讨论了两种不同的强化学习方法：基于策略的强化学习（on-policy RL）和基于非策略的强化学习（off-policy RL）。on-policy RL只能使用当前策略的数据，不能重用过去的数据，而off-policy RL可以重用其他策略的数据，包括在更新策略参数之前的数据。","本段还介绍了不同类型的算法，如REINFORCE和原始策略梯度方法属于on-policy RL，而PPO和重要性采样属于off-policy RL。此外，还提到了使用回放缓冲区存储过去策略数据的算法，如DQN和SAC。这些算法在离线设置下可以重用更多不同策略的数据。","本段进一步区分了不同类型的强化学习方法，如策略梯度方法（仅训练策略）、actor-critic方法（同时训练策略和价值函数）以及Q-learning方法（仅训练价值函数，如DQM）。同时，提到PPO虽然实际学习了价值函数，但通常在本课程中被归类为actor-critic方法以避免混淆。","本段还提到离线强化学习方法与在线方法的不同之处，即不进行任何数据收集。在离线设置下，讨论了两种不同的方法：一种是仅考虑数据中的动作，另一种是其他方法。这些方法基于在线强化学习的思想，但需要处理没有数据收集的情况。","本段强调了在离线强化学习中，如何处理没有数据收集的问题，以及如何利用已有数据进行学习。这包括对动作空间的约束，以及可能的其他方法。这些方法需要在不进行额外数据收集的情况下，充分利用已有数据进行策略优化。","本段整体上回顾了强化学习中不同算法的分类和特点，包括在线和离线方法、on-policy和off-policy方法，以及不同类型的算法（如策略梯度、actor-critic、Q-learning）。这些分类有助于理解不同算法之间的关系和适用场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":177.62,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.23,"text":"Great. So we had some feedback in office hours and other times that it might be helpful to have like a high level recap of the algorithms that we've talked about so far to try to understand where some of the pieces fit together. So I put together one slide that is a little bit more high level, but actually captures almost all of the algorithms that we've seen so far."},{"start":26.17,"text":"And in particular, we've talked about both online and offline algorithms, where online refers to scenarios where the policy will be used to collect data. And offline means that we're given a data set and we cannot do any additional data collection in our environment."},{"start":47.1,"text":"In the offline setting, we talked about two different classes of reinforcement learning methods that use on-policy data collection in order to improve. We referred to the first type as on-policy RL, and the second type is off-policy RL, where on-policy RL, you can collect data, but only from the current policy. You can only use data from the current policy, and this means that you are not going to be reusing past data. You can't use offline data and so forth."},{"start":75.02,"text":"And this include algorithms like reinforce or the vanilla policy gradient method. And then within the realm of off-policy RL, this was where we could start to reuse data from other policies, including data from policies before we took a gradient step on our policy parameters. And this included algorithms like PPO and importance sampling."},{"start":97.24,"text":"And then we talked about algorithms that are more off policy that can reuse data from policies that are even more different and where we use a replay buffer to store the data from those past policies. And that included algorithms like DQN and SAC."},{"start":115.88,"text":"And then I colored these different algorithms different colors because the blue algorithms only involve training a policy. And so we refer to them as policy gradient methods. PPO and SAC learn both a policy and a critic. And so we refer to them as actor-critic methods. And there's also algorithms that only learn a critic and don't explicitly learn a separate policy. And those are often referred to as Q-learning algorithms, such as DQM."},{"start":143.91,"text":"I should also mention that PPO is often actually referred to as a policy gradient method, although you do actually learn a value function. And so we typically were referring to it as actor critic in this class to avoid confusion. And then separate from these classes of online methods, we also have offline."},{"start":162.54,"text":"RL methods that we started talking about. And these built upon a lot of the ideas we saw in online RL, but I have to cope with the fact that you're not collecting any data at all. And we looked at two different approaches there. One is to constrain to only considering actions in the data."}],"speech_gaps":[],"frame":"../frames/v021/001.webp","frame_time":17.23},{"title":"基于模型的强化学习（Model-Based RL）概述","segments":[{"id":8,"text":"And this includes algorithms like AWAC and IQL, and also an algorithm like CQL that implicitly is constraining you to actions in the data, but not so explicitly. And this is through conservatism.","start":178.46,"end":194.6},{"id":9,"text":"So for these RL algorithms, generally, as you move right, you need more online data.","start":197.42,"end":203.22},{"id":10,"text":"And so that means that typically they're going to be kind of more expensive","start":203.8,"end":208.32},{"id":11,"text":"because online data is often more expensive than offline data because you can't.","start":208.32,"end":212.66},{"id":12,"text":"It's harder to kind of repeatedly collect a large amount of online data.","start":212.7,"end":217.84},{"id":13,"text":"And then lastly, before we talked about RL, we also talked about imitation learning algorithms.","start":219.52,"end":223.58},{"id":14,"text":"and this can also fall within the bucket of offline and online although there there's a","start":223.58,"end":230.5},{"id":15,"text":"bit different set of assumptions the first imitation learning algorithm we covered was","start":230.5,"end":234.3},{"id":16,"text":"kind of vanilla behavior cloning where we're taking a data set and trying to imitate the","start":234.3,"end":239.36},{"id":17,"text":"actions in that data set and then we also talked about an online algorithm that is online both in","start":239.36,"end":245.54},{"id":18,"text":"terms of the policy and in terms of querying an expert like asking an expert what is the right","start":245.54,"end":251.36},{"id":19,"text":"right action on this new data that I'm collecting.","start":251.36,"end":253.62},{"id":20,"text":"I put these in a little bit of","start":255.2,"end":257.98},{"id":21,"text":"a separate category because they have different assumptions.","start":257.98,"end":260.88},{"id":22,"text":"You don't need a reward function,","start":261.04,"end":262.0},{"id":23,"text":"but you do need pretty good data and you're not going to be able to","start":263.32,"end":267.18},{"id":24,"text":"outperform the average behavior in your dataset.","start":267.18,"end":271.32},{"id":25,"text":"Cool. So that's an overview,","start":273.24,"end":274.66},{"id":26,"text":"including a lot of these different terms that we","start":275.34,"end":277.46},{"id":27,"text":"including a lot of these different terms that we","start":277.46,"end":279.66},{"id":28,"text":"off policy, on policy, and so forth, and imitation learning versus reinforcement learning. Cool. So what we're going to talk about today is we're going to talk about model-based reinforcement learning. And model-based reinforcement learning can actually be applied to all of the different classes of reinforcement learning methods on the previous slide.","start":281.05,"end":301.32},{"id":29,"text":"Someone has a special place in my heart because I used to do actually quite a bit of work on model-based RL. I think that there's a lot of really cool things that you can do with model-based reinforcement learning.","start":302.97,"end":312.19},{"id":30,"text":"We'll talk about the key idea behind it, how to learn models, how to use those models, including with planning and data generation. And then we'll also look at one case study in dexterous robot manipulation. And as a teaser for that, the methods that we'll be talking about today is we'll allow a robot to do something like this, which is pretty cool. This hand has more than 20 degrees of freedom, more than 20 different joints that it's controlling.","start":313.13,"end":338.03}],"notes":["本段主要讲解了基于模型的强化学习（Model-Based RL）与其他强化学习方法（如离线和在线学习）的关系，以及模仿学习（Imitation Learning）在其中的位置。课堂中提到，模仿学习可以归类为离线或在线学习，但其假设条件与强化学习有所不同。","课堂中提到，模仿学习的第一种算法是行为克隆（Behavior Cloning），即通过数据集来模仿其中的动作。此外，还提到了一种在线模仿学习算法，该算法在策略和查询专家方面都是在线的，例如询问专家在新数据上的正确动作。","模仿学习不需要奖励函数，但需要高质量的数据，并且无法超越数据集中平均行为的表现。这表明模仿学习在某些场景下可能不如强化学习灵活，但其数据需求较低。","课堂中还提到，基于模型的强化学习可以应用于所有不同类别的强化学习方法，包括离线、在线、离策略（off-policy）和在策略（on-policy）方法。这表明基于模型的方法具有广泛的适用性。","课堂最后提到，基于模型的强化学习可以用于数据生成和规划，例如在灵巧机器人操作（dexterous robot manipulation）的案例研究中。这表明基于模型的方法在实际应用中具有重要价值。","课堂中还提到，基于模型的强化学习可以允许机器人执行复杂任务，例如具有超过20个自由度的手部操作。这表明基于模型的方法在处理高维、复杂任务时具有潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":178.46,"end":338.03,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":178.46,"text":"And this includes algorithms like AWAC and IQL, and also an algorithm like CQL that implicitly is constraining you to actions in the data, but not so explicitly. And this is through conservatism."},{"start":197.42,"text":"So for these RL algorithms, generally, as you move right, you need more online data."},{"start":203.8,"text":"And so that means that typically they're going to be kind of more expensive"},{"start":208.32,"text":"because online data is often more expensive than offline data because you can't."},{"start":212.7,"text":"It's harder to kind of repeatedly collect a large amount of online data."},{"start":219.52,"text":"And then lastly, before we talked about RL, we also talked about imitation learning algorithms."},{"start":223.58,"text":"and this can also fall within the bucket of offline and online although there there's a"},{"start":230.5,"text":"bit different set of assumptions the first imitation learning algorithm we covered was"},{"start":234.3,"text":"kind of vanilla behavior cloning where we're taking a data set and trying to imitate the"},{"start":239.36,"text":"actions in that data set and then we also talked about an online algorithm that is online both in"},{"start":245.54,"text":"terms of the policy and in terms of querying an expert like asking an expert what is the right"},{"start":251.36,"text":"right action on this new data that I'm collecting."},{"start":255.2,"text":"I put these in a little bit of"},{"start":257.98,"text":"a separate category because they have different assumptions."},{"start":261.04,"text":"You don't need a reward function,"},{"start":263.32,"text":"but you do need pretty good data and you're not going to be able to"},{"start":267.18,"text":"outperform the average behavior in your dataset."},{"start":273.24,"text":"Cool. So that's an overview,"},{"start":275.34,"text":"including a lot of these different terms that we"},{"start":277.46,"text":"see in reinforcement learning like offline, online,"},{"start":281.05,"text":"off policy, on policy, and so forth, and imitation learning versus reinforcement learning. Cool. So what we're going to talk about today is we're going to talk about model-based reinforcement learning. And model-based reinforcement learning can actually be applied to all of the different classes of reinforcement learning methods on the previous slide."},{"start":302.97,"text":"Someone has a special place in my heart because I used to do actually quite a bit of work on model-based RL. I think that there's a lot of really cool things that you can do with model-based reinforcement learning."},{"start":313.13,"text":"We'll talk about the key idea behind it, how to learn models, how to use those models, including with planning and data generation. And then we'll also look at one case study in dexterous robot manipulation. And as a teaser for that, the methods that we'll be talking about today is we'll allow a robot to do something like this, which is pretty cool. This hand has more than 20 degrees of freedom, more than 20 different joints that it's controlling."}],"speech_gaps":[],"frame":"../frames/v021/002.webp","frame_time":190.46},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":31,"text":"Yeah, and then the key outcomes is trying to understand how we can learn and use dynamics models and the different challenges and trade-offs with this whole class of methods. So the key idea behind model-based reinforcement learning is essentially we're going to try to learn a simulator. Can we learn how to predict the future for actions that we might be taking?","start":339.77,"end":365.31},{"id":32,"text":"For robotics and driving and other physical systems, this might be modeling the physics of some particular system. If you can directly observe the underlying kind of physical entities in that system.","start":368.3,"end":382.64},{"id":33,"text":"And alternatively, if you can't directly observe the different entities in that physical system and model them, then this might look something more like video prediction conditioned on actions that the agent wants to take. So for example, I might want to predict if I say something to someone else, how will they react? Or if I, for example, move my legs in a certain way, will I fall down? Will I go that way? Will I go that way? And so forth.","start":385.18,"end":411.58},{"id":34,"text":"In terms of what this video prediction might actually look like, we've seen pretty cool videos coming out of large models like VO2 and Sora, and these are examples of","start":414.41,"end":426.63},{"id":35,"text":"videos that are generated by a neural network. You can imagine that these kinds of models could be very useful for training systems like cars, robots, quadrotors that are flying through different places in order to learn about how their actions affect the world.","start":429.28,"end":447.48},{"id":36,"text":"Now, models can look something like models of the physical world. They could also look at models of other things. So, for example, if you wanted to learn a policy to make money on the stock market, then one of these simulators would be trying to predict what will happen to the stock market over time and if your actions have any effect on that. And then if you're trying to train an agent to play a game, then this sort of model will underscore the rules of that game.","start":450.31,"end":478.48},{"id":37,"text":"And actually, in a lot of games, you might actually already know the rules of the game. And you may not even need to learn a model in the first place. For example, in chess, if you take a particular action, you know the outcome. You know how the piece will move as a result of that action. And then it comes down to, in two-player games or three-player games or multiplayer games, you might need to model other players.","start":479.45,"end":500.27}],"notes":["本段介绍了基于模型的强化学习（Model-Based RL）的核心思想，即学习一个模拟器，以预测动作对环境的影响。这包括对物理系统的建模，如机器人和自动驾驶，以及对非物理系统的建模，如股票市场和游戏规则。","在物理系统中，如果无法直接观察到系统内部的实体，可以使用视频预测来模拟动作的影响。例如，预测说话后的反应或移动腿后是否会摔倒。","视频预测可以通过神经网络实现，这些模型在训练系统如汽车、机器人和飞行器时非常有用，因为它们可以帮助系统学习动作如何影响环境。","模型不仅可以用于物理世界，还可以用于其他领域，如股票市场和游戏。在某些情况下，如国际象棋，规则已知，因此不需要学习模型。","在多人游戏中，可能需要建模其他玩家的行为，以预测他们的动作和反应。","基于模型的强化学习涉及学习动态模型、预测未来状态以及处理建模过程中的挑战和权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":339.77,"end":500.27,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":339.77,"text":"Yeah, and then the key outcomes is trying to understand how we can learn and use dynamics models and the different challenges and trade-offs with this whole class of methods. So the key idea behind model-based reinforcement learning is essentially we're going to try to learn a simulator. Can we learn how to predict the future for actions that we might be taking?"},{"start":368.3,"text":"For robotics and driving and other physical systems, this might be modeling the physics of some particular system. If you can directly observe the underlying kind of physical entities in that system."},{"start":385.18,"text":"And alternatively, if you can't directly observe the different entities in that physical system and model them, then this might look something more like video prediction conditioned on actions that the agent wants to take. So for example, I might want to predict if I say something to someone else, how will they react? Or if I, for example, move my legs in a certain way, will I fall down? Will I go that way? Will I go that way? And so forth."},{"start":414.41,"text":"In terms of what this video prediction might actually look like, we've seen pretty cool videos coming out of large models like VO2 and Sora, and these are examples of"},{"start":429.28,"text":"videos that are generated by a neural network. You can imagine that these kinds of models could be very useful for training systems like cars, robots, quadrotors that are flying through different places in order to learn about how their actions affect the world."},{"start":450.31,"text":"Now, models can look something like models of the physical world. They could also look at models of other things. So, for example, if you wanted to learn a policy to make money on the stock market, then one of these simulators would be trying to predict what will happen to the stock market over time and if your actions have any effect on that. And then if you're trying to train an agent to play a game, then this sort of model will underscore the rules of that game."},{"start":479.45,"text":"And actually, in a lot of games, you might actually already know the rules of the game. And you may not even need to learn a model in the first place. For example, in chess, if you take a particular action, you know the outcome. You know how the piece will move as a result of that action. And then it comes down to, in two-player games or three-player games or multiplayer games, you might need to model other players."}],"speech_gaps":[],"frame":"../frames/v021/003.webp","frame_time":351.77},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":38,"text":"Modeling other players, you can sometimes consider that as part of the dynamics, but oftentimes it's actually modeled separately. So you don't even necessarily need to consider it as part of this simulator of the world. For example, you might be able to use the model of yourself as a model of another agent. Okay, so if we can learn a simulator, how would we use it? So the sketch of an algorithm would be something like this, where we get some data.","start":502.3,"end":530.88},{"id":39,"text":"Then we learn a simulator on that data that's going to be trying to predict the future for the present and some action that I might take from the present. And then try to run your favorite method inside the simulator. So for example, maybe you have a kind of a simple scenario where you want to get from the green point to the red point. You might collect some data.","start":531.95,"end":561.36},{"id":40,"text":"This is collected from some policy. Then you would train some neural network conditioned on a state and an action. What is the next state? And one way that you could learn this is just by minimizing the L2 loss between your predicted next state and the next state observed in the data.","start":562.91,"end":583.26},{"id":41,"text":"And then in terms of running your favorite RL method, you could use one of the RL methods that we've covered, or you could use a planning method. And we'll talk about a couple of planning methods today. Cool. So now I have a question for you. So here's a sketch of an algorithm. Does anyone have thoughts on what might go wrong if you follow this sketch?","start":584.78,"end":606.43},{"id":42,"text":"Yeah. So the idea there was that your simulator might not always be accurate. And so similar to","start":607.37,"end":613.77},{"id":43,"text":"what we saw in reward modeling, and also arguably what we saw when training Q functions, you might","start":613.77,"end":619.89},{"id":44,"text":"exploit those inaccuracies. Those inaccuracies might compound. And then what you've learned","start":619.89,"end":624.85},{"id":45,"text":"in your learned simulator might not transfer to the real scenario that you're trying to learn","start":624.85,"end":630.77},{"id":46,"text":"a good policy in. Yeah, so there's also this data coverage issue. So similar to what we've seen","start":630.77,"end":638.23},{"id":47,"text":"when training Q functions and other things, if this pi zero, if this initial policy is different","start":638.23,"end":645.69},{"id":48,"text":"from the policy that you're ultimately learning, then you're going to have this mismatch and you","start":645.69,"end":649.19},{"id":49,"text":"might not have coverage of, your model might not be accurate for the states that are visited by the","start":649.19,"end":655.77},{"id":50,"text":"the policy that you're learning.","start":655.77,"end":657.89},{"id":51,"text":"So this is mostly basically what's on the slide exactly.","start":658.13,"end":664.65},{"id":52,"text":"So if you have some environment,","start":664.91,"end":667.25},{"id":53,"text":"maybe you want to navigate a maze,","start":667.47,"end":669.07},{"id":54,"text":"then you might collect some dataset from some policy.","start":670.19,"end":673.73},{"id":55,"text":"Maybe the policy does something like this yellow arrow.","start":673.87,"end":675.79},{"id":56,"text":"This is your dataset.","start":675.93,"end":676.89},{"id":57,"text":"But the dataset doesn't cover the whole maze,","start":678.59,"end":681.59}],"notes":["本段讨论了基于模型的强化学习中使用模拟器时可能遇到的问题。讲者指出，模拟器可能不准确，这种不准确性可能会累积，导致在真实环境中学习到的策略效果不佳。此外，还提到了数据覆盖问题，即如果初始策略与最终要学习的策略不同，那么模拟器可能无法准确覆盖那些最终策略会访问到的状态。","讲者通过类比奖励建模和Q函数训练中的问题，强调了模拟器不准确性可能带来的影响。这表明在基于模型的强化学习中，模拟器的准确性对于策略的有效性至关重要。","数据覆盖问题被进一步解释为，如果初始策略与最终策略不同，那么模拟器可能无法准确反映最终策略所访问的状态，从而影响策略的学习效果。","讲者提到，模拟器的不准确性可能会导致策略在真实环境中表现不佳，因此需要确保模拟器的准确性以及数据的充分覆盖。","讲者还指出，模拟器的不准确性可能会被利用，从而导致策略在训练过程中出现偏差，这进一步强调了模拟器准确性和数据覆盖的重要性。","最后，讲者提到这些内容与幻灯片上的内容基本一致，表明这些问题是基于模型的强化学习中常见的挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":502.3,"end":681.59,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":502.3,"text":"Modeling other players, you can sometimes consider that as part of the dynamics, but oftentimes it's actually modeled separately. So you don't even necessarily need to consider it as part of this simulator of the world. For example, you might be able to use the model of yourself as a model of another agent. Okay, so if we can learn a simulator, how would we use it? So the sketch of an algorithm would be something like this, where we get some data."},{"start":531.95,"text":"Then we learn a simulator on that data that's going to be trying to predict the future for the present and some action that I might take from the present. And then try to run your favorite method inside the simulator. So for example, maybe you have a kind of a simple scenario where you want to get from the green point to the red point. You might collect some data."},{"start":562.91,"text":"This is collected from some policy. Then you would train some neural network conditioned on a state and an action. What is the next state? And one way that you could learn this is just by minimizing the L2 loss between your predicted next state and the next state observed in the data."},{"start":584.78,"text":"And then in terms of running your favorite RL method, you could use one of the RL methods that we've covered, or you could use a planning method. And we'll talk about a couple of planning methods today. Cool. So now I have a question for you. So here's a sketch of an algorithm. Does anyone have thoughts on what might go wrong if you follow this sketch?"},{"start":607.37,"text":"Yeah. So the idea there was that your simulator might not always be accurate. And so similar to"},{"start":613.77,"text":"what we saw in reward modeling, and also arguably what we saw when training Q functions, you might"},{"start":619.89,"text":"exploit those inaccuracies. Those inaccuracies might compound. And then what you've learned"},{"start":624.85,"text":"in your learned simulator might not transfer to the real scenario that you're trying to learn"},{"start":630.77,"text":"a good policy in. Yeah, so there's also this data coverage issue. So similar to what we've seen"},{"start":638.23,"text":"when training Q functions and other things, if this pi zero, if this initial policy is different"},{"start":645.69,"text":"from the policy that you're ultimately learning, then you're going to have this mismatch and you"},{"start":649.19,"text":"might not have coverage of, your model might not be accurate for the states that are visited by the"},{"start":655.77,"text":"the policy that you're learning. Cool."},{"start":658.13,"text":"So this is mostly basically what's on the slide exactly."},{"start":664.91,"text":"So if you have some environment,"},{"start":667.47,"text":"maybe you want to navigate a maze,"},{"start":670.19,"text":"then you might collect some dataset from some policy."},{"start":673.87,"text":"Maybe the policy does something like this yellow arrow."},{"start":675.93,"text":"This is your dataset."},{"start":678.59,"text":"But the dataset doesn't cover the whole maze,"}],"speech_gaps":[],"frame":"../frames/v021/004.webp","frame_time":514.3},{"title":"基于模型的强化学习（Model-Based RL）的挑战","segments":[{"id":58,"text":"and so that if you wanted to go to this part of the maze,","start":681.79,"end":684.05},{"id":59,"text":"for example, or this part of the maze, then your model probably wouldn't be very accurate about the","start":684.05,"end":690.23},{"id":60,"text":"mazes in those parts of the environment. And so then you wouldn't be able to learn a policy for","start":690.23,"end":694.95},{"id":61,"text":"reaching those parts of the maze. And then for the second point, you might not always have an","start":694.95,"end":701.17},{"id":62,"text":"accurate simulator. So here's an example of a video generated by Sora with the prompt,","start":701.17,"end":706.41},{"id":63,"text":"a humanoid robot standing near a table with a red, green, and blue cubes on it,","start":706.57,"end":709.89},{"id":64,"text":"performs a cube stacking task with red on the bottom and blue on the top.","start":709.95,"end":713.33},{"id":65,"text":"And you can see that the video generation does some creative things with physics where it kind of changes the colors of the block and synthesizes blocks out of thin air. I would love for my robot to be able to do something like this. It seems very useful. But this is not kind of modeling what robots can actually do in reality. And to this point, when you're actually trying to develop this kind of model,","start":713.84,"end":741.01},{"id":66,"text":"Oftentimes, you might need to make choices that are dependent on the domain, like if you're trying to train a video prediction model versus training a model of low-level physics with friction or training a model of the stock market. You might have some choices to make in terms of what are the inputs to that model and how are you training it, what's the architecture, and so forth. Some domains are going to be much easier to simulate than others.","start":741.79,"end":766.67},{"id":67,"text":"And then lastly, for this last part, even if you have a really good simulator, this doesn't mean that it'll be easy to get a good policy or to get actions that are accurate as a result.","start":768.17,"end":781.53},{"id":68,"text":"You still have to run, you still have to do the RL process using this simulator.","start":781.63,"end":786.23},{"id":69,"text":"And you need to account for inaccuracies in the model during this process because usually your model is not perfect.","start":787.05,"end":795.23},{"id":70,"text":"You don't have a perfect simulator of the world.","start":795.35,"end":797.91},{"id":71,"text":"That's the key idea behind model-based RL.","start":798.95,"end":801.11},{"id":72,"text":"Now, let's talk briefly about how to learn a dynamics model.","start":802.05,"end":805.03},{"id":73,"text":"We don't have too much time to cover this,","start":806.11,"end":807.67},{"id":74,"text":"most of the time on how to use a dynamics model.","start":807.75,"end":809.47},{"id":75,"text":"most of the time on how to use a dynamics model.","start":809.47,"end":813.07},{"id":76,"text":"In terms of learning a good simulator or a good dynamics model,","start":815.11,"end":819.59},{"id":77,"text":"there are some scenarios where you might know it already,","start":820.23,"end":822.25},{"id":78,"text":"and you're in great shape.","start":822.47,"end":825.21},{"id":79,"text":"and then you're in great shape.","start":826.59,"end":828.99},{"id":80,"text":"There's also scenarios where you might actually know most of the model.","start":830.31,"end":833.43},{"id":81,"text":"If you are in a simplified robotic control setting","start":834.23,"end":840.07},{"id":82,"text":"where you're trying to push an object on the table,","start":840.07,"end":842.69},{"id":83,"text":"maybe you know most of it, but you don't know the friction coefficient of the table.","start":842.85,"end":846.77},{"id":84,"text":"Or in driving, maybe you have a pretty good model","start":846.99,"end":852.67},{"id":85,"text":"of how the car is going to accelerate,","start":852.67,"end":855.79},{"id":86,"text":"like how it will move forward","start":856.27,"end":857.33}],"notes":["本段讨论了基于模型的强化学习（Model-Based RL）中的几个关键挑战。首先，模型可能在环境的某些部分不够准确，导致无法学习到到达这些区域的策略。其次，实际开发模型时，可能需要根据不同的领域做出不同的选择，例如视频预测模型、低级物理模型或股票市场模型，这些选择涉及输入、训练方式和架构等。最后，即使拥有一个良好的模拟器，也不意味着能够轻松获得好的策略或准确的动作，因为模型通常不完美，需要在训练过程中考虑这些不准确性。","在学习动态模型时，有时可以利用已知的模型，例如在简化机器人控制设置中，可能知道大部分模型，但不知道摩擦系数等细节。在驾驶场景中，可能对车辆的加速有较好的模型，但对其他方面可能了解有限。这些例子说明了在不同领域中，模型的构建和使用需要根据具体情况调整。","本段还提到，即使拥有一个高质量的模拟器，也不意味着能够轻松获得好的策略或准确的动作，因为模型通常不完美，需要在训练过程中考虑这些不准确性。这强调了在实际应用中，模型的准确性和训练过程的重要性。","在学习动态模型时，有时可以利用已知的模型，例如在简化机器人控制设置中，可能知道大部分模型，但不知道摩擦系数等细节。在驾驶场景中，可能对车辆的加速有较好的模型，但对其他方面可能了解有限。这些例子说明了在不同领域中，模型的构建和使用需要根据具体情况调整。","本段还提到，即使拥有一个高质量的模拟器，也不意味着能够轻松获得好的策略或准确的动作，因为模型通常不完美，需要在训练过程中考虑这些不准确性。这强调了在实际应用中，模型的准确性和训练过程的重要性。","最后，本段指出，基于模型的强化学习的核心思想是，即使拥有一个良好的模拟器，也需要在训练过程中考虑模型的不准确性，因为现实世界中的模型通常不完美。这为后续讨论如何使用动态模型奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":681.79,"end":857.33,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":681.79,"text":"and so that if you wanted to go to this part of the maze,"},{"start":684.05,"text":"for example, or this part of the maze, then your model probably wouldn't be very accurate about the"},{"start":690.23,"text":"mazes in those parts of the environment. And so then you wouldn't be able to learn a policy for"},{"start":694.95,"text":"reaching those parts of the maze. And then for the second point, you might not always have an"},{"start":701.17,"text":"accurate simulator. So here's an example of a video generated by Sora with the prompt,"},{"start":706.57,"text":"a humanoid robot standing near a table with a red, green, and blue cubes on it,"},{"start":709.95,"text":"performs a cube stacking task with red on the bottom and blue on the top."},{"start":713.84,"text":"And you can see that the video generation does some creative things with physics where it kind of changes the colors of the block and synthesizes blocks out of thin air. I would love for my robot to be able to do something like this. It seems very useful. But this is not kind of modeling what robots can actually do in reality. And to this point, when you're actually trying to develop this kind of model,"},{"start":741.79,"text":"Oftentimes, you might need to make choices that are dependent on the domain, like if you're trying to train a video prediction model versus training a model of low-level physics with friction or training a model of the stock market. You might have some choices to make in terms of what are the inputs to that model and how are you training it, what's the architecture, and so forth. Some domains are going to be much easier to simulate than others."},{"start":768.17,"text":"And then lastly, for this last part, even if you have a really good simulator, this doesn't mean that it'll be easy to get a good policy or to get actions that are accurate as a result."},{"start":781.63,"text":"You still have to run, you still have to do the RL process using this simulator."},{"start":787.05,"text":"And you need to account for inaccuracies in the model during this process because usually your model is not perfect."},{"start":795.35,"text":"You don't have a perfect simulator of the world."},{"start":798.95,"text":"That's the key idea behind model-based RL."},{"start":802.05,"text":"Now, let's talk briefly about how to learn a dynamics model."},{"start":806.11,"text":"We don't have too much time to cover this,"},{"start":807.75,"text":"so we'll just talk about it briefly and then we'll spend"},{"start":809.47,"text":"most of the time on how to use a dynamics model."},{"start":815.11,"text":"In terms of learning a good simulator or a good dynamics model,"},{"start":820.23,"text":"there are some scenarios where you might know it already,"},{"start":822.47,"text":"and you could just use it,"},{"start":826.59,"text":"and then you're in great shape."},{"start":830.31,"text":"There's also scenarios where you might actually know most of the model."},{"start":834.23,"text":"If you are in a simplified robotic control setting"},{"start":840.07,"text":"where you're trying to push an object on the table,"},{"start":842.85,"text":"maybe you know most of it, but you don't know the friction coefficient of the table."},{"start":846.99,"text":"Or in driving, maybe you have a pretty good model"},{"start":852.67,"text":"of how the car is going to accelerate,"},{"start":856.27,"text":"like how it will move forward"}],"speech_gaps":[],"frame":"../frames/v021/005.webp","frame_time":693.79},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":87,"text":"with a given steering command and a given thing,","start":857.33,"end":864.09},{"id":88,"text":"and you just need to model some additional things.","start":864.17,"end":866.47},{"id":89,"text":"In those cases, you might actually be able","start":867.27,"end":869.83},{"id":90,"text":"to leverage knowledge that you know about the world","start":869.83,"end":872.51},{"id":91,"text":"and then fit those unknown parameters using the data.","start":872.51,"end":875.41},{"id":92,"text":"This is actually, I think, one of the cooler ways","start":875.95,"end":878.91},{"id":93,"text":"to try to incorporate domain-specific knowledge","start":878.91,"end":881.31},{"id":94,"text":"into reinforcement learning algorithms.","start":881.31,"end":883.87},{"id":95,"text":"And then in almost all scenarios in practice,","start":885.37,"end":888.65},{"id":96,"text":"you don't really know the model.","start":888.81,"end":891.05},{"id":97,"text":"And this might be because you can't, for example,","start":892.27,"end":895.21},{"id":98,"text":"if you're trying to manipulate some objects,","start":895.21,"end":898.43},{"id":99,"text":"maybe you kind of know roughly the laws of physics,","start":898.55,"end":900.69},{"id":100,"text":"but you don't know the vast majority","start":900.77,"end":902.71},{"id":101,"text":"of how an object is going to behave","start":902.71,"end":904.91},{"id":102,"text":"because it has lots of different properties","start":904.91,"end":906.59},{"id":103,"text":"and there's many different objects.","start":906.59,"end":907.75},{"id":104,"text":"Or you don't know how people are going to interact","start":909.03,"end":910.87},{"id":105,"text":"in the world or other drivers are going to behave in the world and so forth.","start":910.87,"end":913.93},{"id":106,"text":"And in these scenarios, the typical practice is to learn the model from scratch with a neural network or some other function approximator. Now, there are a couple options here as well. So if you are using like image observations, for example, and you're trying to predict like if your state space, for example, is like,","start":914.8,"end":944.99},{"id":107,"text":"an image of, I don't know, maybe this is like you have a car and there's other cars here, and you're trying to predict in video where those cars will be moving in the future. And maybe there's, I don't know, some trash on the ground or something like that. One option is to, I'll refer to this image as ST.","start":945.33,"end":975.23},{"id":108,"text":"One option is to generate entire future video, like the videos that we saw on the previous slide. This would be conditioned on actions. But this might be fairly expensive to do.","start":975.85,"end":995.47},{"id":109,"text":"Because if you have to basically be predicting this entire video over time, that's a pretty large thing. And you have to model all the different details of how all of the pixels are going to change in the future. And so one alternative option that is sometimes used to learn dynamics models is instead of modeling in the image space, you could instead...","start":996.03,"end":1020.0}],"notes":["本段讨论了在基于模型的强化学习中，如何利用已知的领域知识来建模环境，同时通过数据拟合未知参数。这为算法提供了更丰富的信息，有助于提升学习效果。","讲者指出，在实际应用中，我们通常并不知道环境模型。这可能是因为我们无法完全掌握物理规律，或者无法预测对象的行为，以及人类和其他智能体的交互方式。","为了克服这些挑战，通常的做法是使用神经网络或其他函数逼近器从头开始学习模型。这在处理图像观测时尤为常见，例如预测未来视频帧。","讲者提到，一种方法是生成完整的未来视频，这需要根据动作进行条件预测，但这种方法计算成本较高，因为需要预测所有像素的变化。","另一种替代方法是不直接在图像空间建模，而是采用其他方式来学习动态模型，例如使用更抽象的表示形式。","这些讨论展示了基于模型的强化学习中，如何在已知和未知之间进行权衡，以及如何选择合适的建模策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":857.33,"end":1020.0,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":857.33,"text":"with a given steering command and a given thing,"},{"start":864.17,"text":"and you just need to model some additional things."},{"start":867.27,"text":"In those cases, you might actually be able"},{"start":869.83,"text":"to leverage knowledge that you know about the world"},{"start":872.51,"text":"and then fit those unknown parameters using the data."},{"start":875.95,"text":"This is actually, I think, one of the cooler ways"},{"start":878.91,"text":"to try to incorporate domain-specific knowledge"},{"start":881.31,"text":"into reinforcement learning algorithms."},{"start":885.37,"text":"And then in almost all scenarios in practice,"},{"start":888.81,"text":"you don't really know the model."},{"start":892.27,"text":"And this might be because you can't, for example,"},{"start":895.21,"text":"if you're trying to manipulate some objects,"},{"start":898.55,"text":"maybe you kind of know roughly the laws of physics,"},{"start":900.77,"text":"but you don't know the vast majority"},{"start":902.71,"text":"of how an object is going to behave"},{"start":904.91,"text":"because it has lots of different properties"},{"start":906.59,"text":"and there's many different objects."},{"start":909.03,"text":"Or you don't know how people are going to interact"},{"start":910.87,"text":"in the world or other drivers are going to behave in the world and so forth."},{"start":914.8,"text":"And in these scenarios, the typical practice is to learn the model from scratch with a neural network or some other function approximator. Now, there are a couple options here as well. So if you are using like image observations, for example, and you're trying to predict like if your state space, for example, is like,"},{"start":945.33,"text":"an image of, I don't know, maybe this is like you have a car and there's other cars here, and you're trying to predict in video where those cars will be moving in the future. And maybe there's, I don't know, some trash on the ground or something like that. One option is to, I'll refer to this image as ST."},{"start":975.85,"text":"One option is to generate entire future video, like the videos that we saw on the previous slide. This would be conditioned on actions. But this might be fairly expensive to do."},{"start":996.03,"text":"Because if you have to basically be predicting this entire video over time, that's a pretty large thing. And you have to model all the different details of how all of the pixels are going to change in the future. And so one alternative option that is sometimes used to learn dynamics models is instead of modeling in the image space, you could instead..."}],"speech_gaps":[],"frame":"../frames/v021/006.webp","frame_time":869.33},{"title":"基于模型的强化学习中的表示学习与模型构建","segments":[{"id":110,"text":"learn some lower dimensional representation and then model in that representation space. So you, for example, could learn for a given state, you could learn some sort of encoder that maps this to a lower dimensional representation space. Maybe we'll refer to this as ZT. And then instead of learning a model in the original image space, we could then try to learn a model that predicts","start":1020.59,"end":1049.0},{"id":111,"text":"future ZTs like ZT plus one. This can be a good alternative in scenarios where it seems like it'll be very expensive to learn a full model. It also has its own challenges because you need to figure out how to get this representation in the first place. And if you have a good way to get good representations, it can be a good choice.","start":1050.48,"end":1073.85},{"id":112,"text":"You might be losing information. And the key idea is that there is some parts of this observation that doesn't matter, like perhaps the exact texture of the road, whether it's really dark black or maybe a little bit worn down. In many scenarios, that might not matter. And so if you can learn a representation that discards that information that's irrelevant, then you don't have to spend so much compute modeling all those details that don't matter.","start":1074.79,"end":1089.91},{"id":113,"text":"You might be losing information. And the key idea is that there is some parts of this observation that doesn't matter, like perhaps the exact texture of the road, whether it's really dark black or maybe a little bit worn down. In many scenarios, that might not matter. And so if you can learn a representation that discards that information that's irrelevant, then you don't have to spend so much compute modeling all those details that don't matter.","start":1090.42,"end":1114.54},{"id":114,"text":"The other thing that I'll mention here is that oftentimes when you're trying to learn these models, typically with supervised learning or generative modeling techniques, you often will also need to learn a reward model as well. And the reason for this is that if you want to be using your model to generate data or to kind of see into the future, you need to see into the future not just the states, but also how those predicted states will lead to rewards.","start":1115.95,"end":1143.53},{"id":115,"text":"And so we'll talk about what that looks like on the next couple of slides. The question is, does model learning have to happen end-to-end? The way that it works is we are optimizing for our ability to generate future states. And there are actually pros and cons that we'll talk about with regard to that objective. But you can think of it as how well...","start":1144.35,"end":1170.58},{"id":116,"text":"One way to think about it is how well can I model the distribution of PST plus 1 given STAT? Another way to think about it, especially if you have more deterministic dynamics, is how well can I minimize the error between my predicted ST plus 1 and the actual","start":1171.12,"end":1198.92}],"notes":["本段讨论了在基于模型的强化学习中使用低维表示的优势和挑战。通过学习一个编码器将状态映射到低维空间（如ZT），可以减少计算成本，但会丢失部分信息。关键在于识别并丢弃不重要的信息，如道路的纹理细节，从而避免对不相关细节进行建模。","讲者提到，学习这些模型时通常需要同时学习奖励模型，因为模型不仅要预测未来状态，还要预测这些状态如何导致奖励。这表明模型学习和奖励建模是紧密相关的，且需要结合使用。","讲者还提到模型学习是否必须端到端进行的问题。优化目标是生成未来状态的能力，这涉及权衡利弊。一种思考方式是评估模型对PST+1分布的建模能力，另一种则是评估预测状态与实际状态之间的误差最小化。","在低维表示中，信息丢失是不可避免的，但通过选择合适的表示方法，可以保留对任务关键的信息，从而提高模型效率。","讲者强调了在学习模型时，需要考虑如何获取良好的表示，这可能涉及监督学习或生成建模技术。良好的表示可以显著减少计算成本。","最后，讲者提到模型学习的优化目标是生成未来状态的能力，这可能涉及不同的策略和权衡，如端到端学习与分步学习的比较。"],"formulas":[{"latex":"P(S_{t+1} \\thicksim S_t) \\text{ 或 } P(S_{t+1} | S_t)","symbols":"状态转移概率","explanation":"原文提到的是状态转移概率，但公式中使用了不规范的符号，应更正为P(S_{t+1} | S_t)","evidence":"One way to think about it is how well can I model the distribution of PST plus 1 given STAT? Another way to think about it, especially if you have more deterministic dynamics, is how well can I minimize the error between my predicted ST plus 1 and the actual"}],"uncertainties":["ST plus 1 和 actual 的具体含义不明确，可能是状态转移或实际状态的表示，但未完整识别。"],"diagram":"none","start":1020.59,"end":1198.92,"asr_flags":[],"math_clarifications":["公式中的符号P(S_{t+1} \\thicksim S_t)存在不规范的符号使用，应更正为P(S_{t+1} | S_t)以符合标准概率表示法。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1020.59,"text":"learn some lower dimensional representation and then model in that representation space. So you, for example, could learn for a given state, you could learn some sort of encoder that maps this to a lower dimensional representation space. Maybe we'll refer to this as ZT. And then instead of learning a model in the original image space, we could then try to learn a model that predicts"},{"start":1050.48,"text":"future ZTs like ZT plus one. This can be a good alternative in scenarios where it seems like it'll be very expensive to learn a full model. It also has its own challenges because you need to figure out how to get this representation in the first place. And if you have a good way to get good representations, it can be a good choice."},{"start":1074.79,"text":"Yeah, so the question was, we are going to be losing information by going to a lower dimension, and so is the main reason to do this in terms of cost? Yeah, exactly. So the main reason to do this is to try to reduce some of the computational costs associated with this, because you are losing..."},{"start":1090.42,"text":"You might be losing information. And the key idea is that there is some parts of this observation that doesn't matter, like perhaps the exact texture of the road, whether it's really dark black or maybe a little bit worn down. In many scenarios, that might not matter. And so if you can learn a representation that discards that information that's irrelevant, then you don't have to spend so much compute modeling all those details that don't matter."},{"start":1115.95,"text":"The other thing that I'll mention here is that oftentimes when you're trying to learn these models, typically with supervised learning or generative modeling techniques, you often will also need to learn a reward model as well. And the reason for this is that if you want to be using your model to generate data or to kind of see into the future, you need to see into the future not just the states, but also how those predicted states will lead to rewards."},{"start":1144.35,"text":"And so we'll talk about what that looks like on the next couple of slides. The question is, does model learning have to happen end-to-end? The way that it works is we are optimizing for our ability to generate future states. And there are actually pros and cons that we'll talk about with regard to that objective. But you can think of it as how well..."},{"start":1171.12,"text":"One way to think about it is how well can I model the distribution of PST plus 1 given STAT? Another way to think about it, especially if you have more deterministic dynamics, is how well can I minimize the error between my predicted ST plus 1 and the actual"}],"speech_gaps":[],"frame":"../frames/v021/007.webp","frame_time":1032.5900000000001},{"title":"基于模型的强化学习中的规划与模型使用","segments":[{"id":117,"text":"ST plus 1. So how do we go about using a dynamics model? The first approach that we'll talk about is we'll actually start by talking about planning. And so this is actually going to be a little bit different than simply running reinforcement learning inside your kind of learned simulator. And the way that this could work is you can think about","start":1199.89,"end":1227.36},{"id":118,"text":"your MDP, where you have your current state that you're in, and then you take some action. And then this affects your next action. And then as a result of that, you'll also get some future reward. And then this process will repeat. You'll take another action.","start":1228.38,"end":1253.5},{"id":119,"text":"that influences the state after that, which will yield some additional reward. This reward might also depend on the action that you took as well. Now, in some of the past reinforcement learning works that we talked about, we kind of assumed that we didn't really know this kind of the relationship. We kind of don't know how the actions affect future states.","start":1254.73,"end":1280.72},{"id":120,"text":"And so we have to figure out how to optimize rewards without using direct gradients. But if we can actually predict what a future state is and what a reward is based off of that, if we train a reward model and a dynamics model, then we could actually just directly back-propagate from rewards into actions.","start":1281.24,"end":1306.87},{"id":121,"text":"We could potentially kind of directly pass gradients from your rewards into your actions. And what this would look like is your objective would be to maximize either just the current action or maybe the kind of next sequence of actions for the sum of future.","start":1309.08,"end":1338.11},{"id":122,"text":"rewards. Maybe we'll do this t prime for some horizon. So maybe we're optimizing for the rewards from time t to time t plus h. So what this would look like specifically, I guess we can show it on the slides as well. So we're trying to maximize the sum of rewards.","start":1340.11,"end":1363.94}],"notes":["本段讲解了基于模型的强化学习中使用动力学模型的方法，重点在于通过规划来优化奖励。与直接在学习的模拟器中运行强化学习不同，规划方法利用动力学模型预测未来状态和奖励，从而进行更有效的决策。","讲者提到，在过去的强化学习工作中，通常假设我们不知道动作如何影响未来状态，因此需要在不使用直接梯度的情况下优化奖励。如果能够训练奖励模型和动力学模型，就可以直接从奖励反向传播到动作。","讲者进一步说明，目标是最大化未来奖励的总和，可能涉及从时间t到时间t+h的奖励序列。这种优化过程可以通过反向传播实现，从而直接优化动作。","讲者提到，这种规划方法可能涉及对奖励和动作的梯度传递，但具体实现细节可能需要通过幻灯片进一步展示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1199.89,"end":1363.94,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1199.89,"text":"ST plus 1. So how do we go about using a dynamics model? The first approach that we'll talk about is we'll actually start by talking about planning. And so this is actually going to be a little bit different than simply running reinforcement learning inside your kind of learned simulator. And the way that this could work is you can think about"},{"start":1228.38,"text":"your MDP, where you have your current state that you're in, and then you take some action. And then this affects your next action. And then as a result of that, you'll also get some future reward. And then this process will repeat. You'll take another action."},{"start":1254.73,"text":"that influences the state after that, which will yield some additional reward. This reward might also depend on the action that you took as well. Now, in some of the past reinforcement learning works that we talked about, we kind of assumed that we didn't really know this kind of the relationship. We kind of don't know how the actions affect future states."},{"start":1281.24,"text":"And so we have to figure out how to optimize rewards without using direct gradients. But if we can actually predict what a future state is and what a reward is based off of that, if we train a reward model and a dynamics model, then we could actually just directly back-propagate from rewards into actions."},{"start":1309.08,"text":"We could potentially kind of directly pass gradients from your rewards into your actions. And what this would look like is your objective would be to maximize either just the current action or maybe the kind of next sequence of actions for the sum of future."},{"start":1340.11,"text":"rewards. Maybe we'll do this t prime for some horizon. So maybe we're optimizing for the rewards from time t to time t plus h. So what this would look like specifically, I guess we can show it on the slides as well. So we're trying to maximize the sum of rewards."}],"speech_gaps":[],"frame":"../frames/v021/008.webp","frame_time":1211.89},{"title":"基于模型的强化学习中的规划与梯度计算","segments":[{"id":123,"text":"We often refer to this kind of problem as looking into the future as planning a sequence of actions that will maximize rewards. And so if we have some model of how we predict future states and actions and rewards, and if we're modeling that with a neural network, then we can also compute the gradients of that neural network to back-propagate rewards into actions as following. And so then specifically what this would look like,","start":1367.33,"end":1397.57},{"id":124,"text":"is, well, first you would collect some data. Then you would train your model. Maybe that's to minimize f of SA minus the, this is your predicted next state, this is your true next state. And then once you have this model, you could then find a set of actions.","start":1399.25,"end":1434.76},{"id":125,"text":"That is actually, just to be explicit, for this optimization, we're minimizing the parameters of our model. And then the third step is to try to find a set of actions. This would be A hat T to T plus H. This is like, what is the course of actions that will lead to good rewards? And this would be the argmax.","start":1435.5,"end":1467.91},{"id":126,"text":"of the sum of rewards, sum of t. And this is over. So you might, this is, writing gradient descent on actions is a little bit, like backprop creation to actions is a little bit different from the typical backprop that we look at. So oftentimes when we run backprop, we're doing it with regard to parameters of a neural network. Here we're actually,","start":1470.71,"end":1510.01},{"id":127,"text":"Here we're actually, back propagating into these actions right here. And so specifically what this kind of third step would look like is you would need to basically like initialize, just like you randomly initialize your neural network parameters, you'll need to initialize your actions. Then you need to compute your gradient. So this would be","start":1510.89,"end":1542.5}],"notes":["本段讲解了基于模型的强化学习中，如何利用模型预测未来状态和奖励，并通过梯度下降优化动作序列。首先需要收集数据并训练模型，通过最小化预测状态与真实状态之间的差异来优化模型参数。","接着，利用训练好的模型寻找最优动作序列，即通过最大化累积奖励来选择动作。这一步需要初始化动作，并计算梯度，与传统的神经网络参数梯度下降不同，这里是将奖励反向传播到动作上。","在反向传播过程中，需要初始化动作，类似于随机初始化神经网络参数，然后计算梯度。这表明在基于模型的强化学习中，动作的优化过程与参数优化过程有相似之处，但目标不同。","此外，本段提到反向传播到动作的过程与传统反向传播不同，强调了在基于模型的强化学习中，梯度计算不仅涉及模型参数，还涉及动作空间的优化。","最后，本段指出，寻找最优动作序列的过程需要明确目标函数，即最大化累积奖励，并通过梯度下降方法进行优化。","整个过程体现了基于模型的强化学习中，模型预测与动作优化的结合，以及梯度计算在不同层次上的应用。"],"formulas":[{"latex":"\\operatorname*{argmax}_{a_t} \\sum_{t=0}^{T} \\text{rewards}_t","symbols":"argmax 表示选择使累积奖励最大的动作序列","explanation":"原公式中的 'sum of rewards from t=0 to T' 被正确转换为数学表达式，但 'sum of rewards' 未明确表示为奖励的总和，因此将其明确为 $\\sum_{t=0}^{T} \\text{rewards}_t$。","evidence":"That is actually, just to be explicit, for this optimization, we're minimizing the parameters of our model. And then the third step is to try to find a set of actions. This would be A hat T to T plus H. This is like, what is the course of actions that will lead to good rewards? And this would be the argmax."}],"uncertainties":["f of SA 的具体定义可能不明确","backprop creation to actions 的表达可能存在歧义"],"diagram":"none","start":1367.33,"end":1542.5,"asr_flags":[],"math_clarifications":["原公式中 'f(SA) - predicted next state - true next state' 存在数学表达不严谨的问题，'f(SA)' 未定义，且减法操作符连接了三个项，不符合标准数学表达式结构，因此移除该公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1367.33,"text":"We often refer to this kind of problem as looking into the future as planning a sequence of actions that will maximize rewards. And so if we have some model of how we predict future states and actions and rewards, and if we're modeling that with a neural network, then we can also compute the gradients of that neural network to back-propagate rewards into actions as following. And so then specifically what this would look like,"},{"start":1399.25,"text":"is, well, first you would collect some data. Then you would train your model. Maybe that's to minimize f of SA minus the, this is your predicted next state, this is your true next state. And then once you have this model, you could then find a set of actions."},{"start":1435.5,"text":"That is actually, just to be explicit, for this optimization, we're minimizing the parameters of our model. And then the third step is to try to find a set of actions. This would be A hat T to T plus H. This is like, what is the course of actions that will lead to good rewards? And this would be the argmax."},{"start":1470.71,"text":"of the sum of rewards, sum of t. And this is over. So you might, this is, writing gradient descent on actions is a little bit, like backprop creation to actions is a little bit different from the typical backprop that we look at. So oftentimes when we run backprop, we're doing it with regard to parameters of a neural network. Here we're actually,"},{"start":1510.89,"text":"back propagating into these actions right here. And so specifically what this kind of third step would look like is you would need to basically like initialize, just like you randomly initialize your neural network parameters, you'll need to initialize your actions. Then you need to compute your gradient. So this would be"}],"speech_gaps":[],"frame":"../frames/v021/009.webp","frame_time":1379.33},{"title":"基于模型的强化学习中的梯度计算与动态模型","segments":[{"id":128,"text":"the gradient of the sum of rewards with respect to the actions that you take. And to compute this gradient, this would be, you can think of it essentially like if you use the chain rule, the gradient will be the sum of rewards with respect to the states. So that would just be based off of your reward model. And then you'll have","start":1544.4,"end":1577.88},{"id":129,"text":"Then if you apply the chain rule, you could then have a second term that's d states, d actions, to actually get the gradient of the rewards with respect to the action. And then once you have your gradient, then you could use it to update your actions with gradient descent. And so then maybe this is your initial a hat. a hat t to t plus h is going to be","start":1579.5,"end":1614.31},{"id":130,"text":"your previous A hat minus alpha times this gradient right here. I'm going to put this separately. Yeah, great question. Actions would be continuous in this setting. Yeah. We'll also look at scenarios where we can do it with the discrete actions as well. We're assuming rewards are deterministic, but we've actually always assumed rewards are deterministic. And you can consider any sort of non-determinism being encapsulated by the dynamics in the state variable.","start":1614.95,"end":1649.84},{"id":131,"text":"Correct. Yeah. So here we have a dynamics model. And I guess I didn't explicitly write this, but","start":1650.86,"end":1655.94},{"id":132,"text":"you also need to have, you would also be trading some reward function. Maybe this is like R psi,","start":1657.46,"end":1665.08},{"id":133,"text":"for example. And this we'd be using like some of the reward learning techniques that we've","start":1665.3,"end":1670.02},{"id":134,"text":"talked about. There's also some scenarios where you might know the reward. So it might be,","start":1670.02,"end":1674.5},{"id":135,"text":"for example, like forward velocity, if you're trying to learn how to walk, or some distance","start":1674.56,"end":1679.9},{"id":136,"text":"instance to some goal, that sort of thing.","start":1679.9,"end":1681.18},{"id":137,"text":"And in those cases, you don't need to learn a reward function.","start":1681.36,"end":1683.8},{"id":138,"text":"the question is, if your dynamics model is","start":1684.7,"end":1687.86},{"id":139,"text":"stochastic, how do you backprop through it?","start":1687.86,"end":1690.48},{"id":140,"text":"That gets into a lot of the deep.","start":1692.6,"end":1697.1},{"id":141,"text":"It kind of depends on how you're modeling the stochasticity.","start":1697.2,"end":1700.32},{"id":142,"text":"there are certain tricks for differentiating through samples","start":1700.7,"end":1703.82},{"id":143,"text":"there are certain tricks for differentiating through samples","start":1704.04,"end":1706.52},{"id":144,"text":"from that Gaussian.","start":1706.52,"end":1707.54},{"id":145,"text":"Whereas if you're using something like a diffusion model, it would look a bit different.","start":1708.08,"end":1712.96},{"id":146,"text":"So it is kind of model dependent. And so far, we're talking about deterministic models.","start":1713.28,"end":1722.7}],"notes":["本段讨论了在基于模型的强化学习中，如何通过链式法则计算奖励对动作的梯度。讲者提到，梯度计算需要先计算奖励对状态的梯度，再通过状态对动作的梯度进行链式法则的展开。这表明在模型中，奖励函数和动态模型是关键组成部分。","讲者指出，如果动态模型是随机的，如何通过它进行反向传播是一个重要问题。对于高斯分布模型，存在一些技巧可以进行梯度计算，而扩散模型则需要不同的方法。这说明模型的类型会影响梯度计算的具体实现。","讲者提到，如果奖励函数已知，就不需要学习奖励函数，例如在学习行走时，可以使用前向速度作为奖励。这表明在某些场景中，奖励函数可以是已知的，从而简化了学习过程。","讲者还提到，动态模型可以是确定性的，也可以是随机的，这取决于具体的应用场景。这表明在基于模型的强化学习中，动态模型的类型是影响算法设计的重要因素。","讲者强调，梯度计算需要考虑状态和动作之间的关系，以及奖励函数的结构。这表明在模型中，状态、动作和奖励之间的关系是梯度计算的基础。","讲者提到，对于随机模型，如高斯分布，可以通过特定的技巧进行梯度计算，而扩散模型则需要不同的方法。这表明不同的模型结构会影响梯度计算的具体实现方式。"],"formulas":[{"latex":"a_{\\hat{t}+h} = a_{\\hat{t}} - \\alpha \\cdot \\nabla_{a} R","symbols":"使用梯度下降更新动作","explanation":"该公式正确表达了使用梯度下降更新动作的数学形式，其中 \\alpha 是学习率，\\nabla_{a} R 是奖励对动作的梯度。","evidence":"Then if you apply the chain rule, you could then have a second term that's d states, d actions, to actually get the gradient of the rewards with respect to the action. And then once you have your gradient, then you could use it to update your actions with gradient descent. And so then maybe this is your initial a hat. a hat t to t plus h is going to be"},{"latex":"R_{\\psi}","symbols":"奖励函数的表示","explanation":"该公式正确表示了奖励函数，其中 \\psi 是奖励函数的参数。","evidence":"you also need to have, you would also be trading some reward function. Maybe this is like R psi,"}],"uncertainties":["d states, d actions","R psi"],"diagram":"none","start":1544.4,"end":1722.7,"asr_flags":[],"math_clarifications":["公式 0 的链式法则表达不准确，未明确变量之间的依赖关系，因此需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1544.4,"text":"the gradient of the sum of rewards with respect to the actions that you take. And to compute this gradient, this would be, you can think of it essentially like if you use the chain rule, the gradient will be the sum of rewards with respect to the states. So that would just be based off of your reward model. And then you'll have"},{"start":1579.5,"text":"Then if you apply the chain rule, you could then have a second term that's d states, d actions, to actually get the gradient of the rewards with respect to the action. And then once you have your gradient, then you could use it to update your actions with gradient descent. And so then maybe this is your initial a hat. a hat t to t plus h is going to be"},{"start":1614.95,"text":"your previous A hat minus alpha times this gradient right here. I'm going to put this separately. Yeah, great question. Actions would be continuous in this setting. Yeah. We'll also look at scenarios where we can do it with the discrete actions as well. We're assuming rewards are deterministic, but we've actually always assumed rewards are deterministic. And you can consider any sort of non-determinism being encapsulated by the dynamics in the state variable."},{"start":1650.86,"text":"Correct. Yeah. So here we have a dynamics model. And I guess I didn't explicitly write this, but"},{"start":1657.46,"text":"you also need to have, you would also be trading some reward function. Maybe this is like R psi,"},{"start":1665.3,"text":"for example. And this we'd be using like some of the reward learning techniques that we've"},{"start":1670.02,"text":"talked about. There's also some scenarios where you might know the reward. So it might be,"},{"start":1674.56,"text":"for example, like forward velocity, if you're trying to learn how to walk, or some distance"},{"start":1679.9,"text":"instance to some goal, that sort of thing."},{"start":1681.36,"text":"And in those cases, you don't need to learn a reward function."},{"start":1684.7,"text":"Yeah, so the question is, if your dynamics model is"},{"start":1687.86,"text":"stochastic, how do you backprop through it?"},{"start":1692.6,"text":"That gets into a lot of the deep."},{"start":1697.2,"text":"It kind of depends on how you're modeling the stochasticity."},{"start":1700.7,"text":"So if you're using a Gaussian, for example,"},{"start":1704.04,"text":"there are certain tricks for differentiating through samples"},{"start":1706.52,"text":"from that Gaussian."},{"start":1708.08,"text":"Whereas if you're using something like a diffusion model, it would look a bit different."},{"start":1713.28,"text":"So it is kind of model dependent. And so far, we're talking about deterministic models."}],"speech_gaps":[],"frame":"../frames/v021/010.webp","frame_time":1556.4},{"title":"基于模型的强化学习中的规划与模型误差","segments":[{"id":147,"text":"Yeah. So the question is, will this start to exploit errors in the reward?","start":1722.9,"end":1727.52},{"id":148,"text":"Yeah. So this will start to exploit both errors in the reward, but also errors in the dynamics model.","start":1727.82,"end":1731.98},{"id":149,"text":"model. So if your dynamics model is inaccurate or if your reward model is inaccurate, if either one","start":1731.98,"end":1738.56},{"id":150,"text":"of them is inaccurate, then you might get actions that aren't actually going to take good actions","start":1738.56,"end":1744.58},{"id":151,"text":"in the world. And that's a problem. And so we'll talk about that in a second.","start":1744.58,"end":1750.72},{"id":152,"text":"Yeah. So this is a good question. So I guess instead of repeating it, I think what would","start":1751.6,"end":1756.94},{"id":153,"text":"be helpful is we aren't actually learning a policy here. And that's essentially what you're","start":1756.94,"end":1761.14},{"id":154,"text":"you're pointing out uh and and this is essentially um this is now this is like becoming our policy","start":1761.14,"end":1770.72},{"id":155,"text":"uh quote unquote um this is like our behavior and the um do i have a good term for this i guess i","start":1770.72,"end":1778.56},{"id":156,"text":"mean yeah this is like sort of the policy uh in quotes uh and this is what we call planning where","start":1778.56,"end":1787.96},{"id":157,"text":"where at every single state, we're actually going to be planning forward and thinking ahead,","start":1787.96,"end":1792.22},{"id":158,"text":"like, what are the actions I should consider that I think will lead to good reward?","start":1792.48,"end":1796.32},{"id":159,"text":"And we'll actually be doing this optimization process every single state when we're doing planning.","start":1798.28,"end":1804.7},{"id":160,"text":"So on the slide, we'll be running some policy to collect data,","start":1806.72,"end":1811.36},{"id":161,"text":"learning a model to try to be able to accurately model the dynamics,","start":1812.3,"end":1817.52},{"id":162,"text":"potentially also learning a reward function as well.","start":1817.96,"end":1820.52},{"id":163,"text":"And then we'll be back-propagating through the reward and the dynamics","start":1821.9,"end":1826.98},{"id":164,"text":"in order to choose.","start":1826.98,"end":1828.4},{"id":165,"text":"And then once we choose those actions, we'll then be executing these actions in the environment. And then after we execute those actions, we'll then be rerunning this planning process again. So in particular, I guess maybe to explicitly write that out, we'll have a step four here that is to actually execute a hat t to t plus h.","start":1831.37,"end":1859.42},{"id":166,"text":"you will then move on back to step three after you've executed these H actions. Yeah. So the question is, we're only planning over a horizon of H, and what if we have an infinite horizon? In principle, the math, well, it's a good question.","start":1861.7,"end":1890.31}],"notes":["本段讨论了基于模型的强化学习中，模型误差（奖励模型和动态模型）对策略的影响。如果模型不准确，可能会导致执行的行动不是最优的，从而引发问题。","讲者指出，当前讨论的不是直接学习策略，而是通过规划（planning）来生成行为，这种行为被称作“策略”（in quotes），即在每个状态进行前向规划，考虑哪些行动能带来好的奖励。","规划过程涉及在每个状态进行优化，以选择最佳行动。规划过程结束后，会执行这些行动，并再次进行规划，形成一个循环。","讲者提到，规划过程通常在一个有限的时域（horizon）内进行，但如果考虑无限时域，数学上如何处理是一个值得探讨的问题。","讲者强调，规划过程是基于模型的强化学习中的关键步骤，它结合了模型学习和奖励函数学习，通过反向传播来选择行动。","讲者还提到，执行完H个行动后，会回到规划步骤，形成一个循环，这表明规划和执行是交替进行的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1722.9,"end":1890.31,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1722.9,"text":"Yeah. So the question is, will this start to exploit errors in the reward?"},{"start":1727.82,"text":"Yeah. So this will start to exploit both errors in the reward, but also errors in the dynamics model."},{"start":1731.98,"text":"model. So if your dynamics model is inaccurate or if your reward model is inaccurate, if either one"},{"start":1738.56,"text":"of them is inaccurate, then you might get actions that aren't actually going to take good actions"},{"start":1744.58,"text":"in the world. And that's a problem. And so we'll talk about that in a second."},{"start":1751.6,"text":"Yeah. So this is a good question. So I guess instead of repeating it, I think what would"},{"start":1756.94,"text":"be helpful is we aren't actually learning a policy here. And that's essentially what you're"},{"start":1761.14,"text":"you're pointing out uh and and this is essentially um this is now this is like becoming our policy"},{"start":1770.72,"text":"uh quote unquote um this is like our behavior and the um do i have a good term for this i guess i"},{"start":1778.56,"text":"mean yeah this is like sort of the policy uh in quotes uh and this is what we call planning where"},{"start":1787.96,"text":"where at every single state, we're actually going to be planning forward and thinking ahead,"},{"start":1792.48,"text":"like, what are the actions I should consider that I think will lead to good reward?"},{"start":1798.28,"text":"And we'll actually be doing this optimization process every single state when we're doing planning."},{"start":1806.72,"text":"So on the slide, we'll be running some policy to collect data,"},{"start":1812.3,"text":"learning a model to try to be able to accurately model the dynamics,"},{"start":1817.96,"text":"potentially also learning a reward function as well."},{"start":1821.9,"text":"And then we'll be back-propagating through the reward and the dynamics"},{"start":1826.98,"text":"in order to choose."},{"start":1831.37,"text":"And then once we choose those actions, we'll then be executing these actions in the environment. And then after we execute those actions, we'll then be rerunning this planning process again. So in particular, I guess maybe to explicitly write that out, we'll have a step four here that is to actually execute a hat t to t plus h."},{"start":1861.7,"text":"you will then move on back to step three after you've executed these H actions. Yeah. So the question is, we're only planning over a horizon of H, and what if we have an infinite horizon? In principle, the math, well, it's a good question."}],"speech_gaps":[],"frame":"../frames/v021/011.webp","frame_time":1734.9},{"title":"基于模型的强化学习中的优化方法","segments":[{"id":167,"text":"So we'll talk a little bit about this. For now, we're going to be only considering this short horizon planning. And in eight-ish slides or something, I'll talk a little bit more about what happens if you want to do infinite or very long horizon things. And we'll also talk about some of the shortcomings of it. Now, so far, we've been talking about gradient descent for optimizing actions.","start":1893.19,"end":1922.04},{"id":168,"text":"And this is actually not the only way that you can do optimization. So it's probably the optimization technique that you're most familiar with, because we use it all the time for neural networks. But there's other ways that we can optimize a function, specifically when we're trying to optimize the sum of rewards. And if we think about gradient-based optimization,","start":1923.63,"end":1943.99},{"id":169,"text":"Typically, we have something that we're trying to optimize over. In this case, it would be we're trying to be optimizing over actions. And the thing that we're trying to optimize is the sum of rewards. Maybe, yeah. And so actually also there's a small mistake here. There should be a plus sign because we're maximizing, not minimizing. So the way that gradient descent works is you kind of randomly initialize.","start":1945.33,"end":1973.57},{"id":170,"text":"some action like right here, and then you evaluate the gradient at that position. So maybe you find that the gradient is like pointed like this way. And then you then say, okay, I should move probably over here. And then maybe you sample this. You choose this action because that's kind of a step size away. You evaluate the gradient there, and you find that the gradient maybe looks something like this.","start":1973.99,"end":1998.85},{"id":171,"text":"And then you say, maybe I should move further to the left, but a little bit less because the slope is less steep. And then you get maybe something that looks like this. And you're like, OK, the gradient is 0. And so maybe I won't be sampling any further actions. And then your final choice after writing gradient descent is this value right here.","start":1999.49,"end":2026.2},{"id":172,"text":"is instead what I'll call sampling-based optimization. This is also called gradient-free optimization. And the way that this works is if you have some set of actions and some sum of rewards, instead of just starting from one place and evaluating the gradient, we're actually not going to use the gradients at all. And we'll just sample a bunch of actions and see what the values are.","start":2026.91,"end":2052.0}],"notes":["本段主要讲解了梯度下降法在强化学习中的应用，强调了梯度下降法在优化动作选择时的步骤，包括随机初始化、评估梯度、根据梯度方向调整动作选择以及最终收敛到最优动作。同时指出在优化过程中，由于是最大化目标，应使用加号而非减号。","讲者提到梯度下降法中，梯度的方向决定了动作选择的调整方向，例如梯度指向某个方向时，应向该方向移动。同时，梯度的大小决定了移
