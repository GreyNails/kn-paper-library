g for a sum of rewards.","zh":"我们正在优化奖励的总和。","start":3847.64,"end":3849.24},{"id":293,"text":"from T to T plus H.","zh":"从 T 到 T 加 H。","start":3850.62,"end":3852.48},{"id":294,"text":"And if we want to optimize","zh":"如果我们想要优化","start":3854.4,"end":3855.82},{"id":295,"text":"for a longer horizon of reward,","zh":"更长的奖励时间范围，","start":3855.82,"end":3857.38},{"id":296,"text":"So far, the way that we would have to do that is by optimizing over a longer horizon of actions, which gets higher and higher dimensional. But another thing that you could do is that if you have a value function, or like an estimate of a value function, then you could actually use that value function to help this process, where instead of trying to maximize the sum of rewards for the next H time steps, you could optimize for the sum of rewards for the next H time steps.","zh":"到目前为止，我们必须要这样做的是通过优化更长的动作时间范围，这会导致维度越来越高。但你也可以做另一件事，如果你有一个价值函数，或者对价值函数的估计，那么你实际上可以利用这个价值函数来帮助这个过程，而不是尝试最大化接下来 H 步的奖励总和，而是优化接下来 H 步的奖励总和。","start":3858.27,"end":3887.76},{"id":297,"text":"plus your estimate of the value of the state","zh":"加上你对最终状态价值的估计","start":3888.41,"end":3892.23},{"id":298,"text":"that you end up at after taking those H actions.","zh":"你在执行了这些 H 个动作后所处的状态。","start":3892.23,"end":3896.59},{"id":299,"text":"And so this would end up with an algorithm","zh":"因此，这将导致一个算法","start":3898.43,"end":3902.49},{"id":300,"text":"where you're learning both a model and a value function.","zh":"你同时学习一个模型和一个价值函数。","start":3903.01,"end":3905.19},{"id":301,"text":"And then you would be running this planning process.","zh":"然后你就会运行这个规划过程。","start":3905.67,"end":3908.61},{"id":302,"text":"You'd be considering a bunch of different actions","zh":"你会考虑一系列不同的动作","start":3908.85,"end":3910.55},{"id":303,"text":"over some horizon.","zh":"在某个时间范围内。","start":3911.23,"end":3911.81},{"id":304,"text":"And then past that horizon, you're","zh":"而在该时间范围之后，你","start":3912.07,"end":3914.13},{"id":305,"text":"just asking your value function, is that a good state","zh":"只是询问你的价值函数，这个状态是好的状态","start":3914.13,"end":3915.93},{"id":306,"text":"or a bad state?","zh":"还是坏的状态？","start":3915.93,"end":3916.63},{"id":307,"text":"And so this is a valid way to combine planning with value-based RL in order to select actions.","zh":"因此，这是一种将规划与基于价值的强化学习结合的有效方法，以选择动作。","start":3917.43,"end":3928.99}],"notes":["本段讨论了基于模型的强化学习中，如何通过模型和价值函数的结合来处理长时域问题。讲者指出，当奖励信号稀疏时，直接规划长时域的行动序列会非常昂贵，因此需要引入价值函数来辅助决策。","讲者提到，如果拥有价值函数的估计，可以在规划过程中将价值函数的估计值加入到奖励的计算中，从而优化长时域的行动序列。这种方法可以减少对长时域行动序列的直接优化，从而降低计算复杂度。","讲者进一步说明，这种结合模型和价值函数的方法，可以形成一个算法，其中同时学习模型和价值函数，并在规划过程中使用价值函数来评估超出规划时域后的状态是否为好状态。","这种方法允许在规划过程中考虑不同行动序列，并在超出规划时域后，通过价值函数来判断状态的好坏，从而选择最优行动。","讲者强调，这种方法是将规划与基于价值的强化学习相结合的一种有效方式，可以用于选择行动。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3749.1,"end":3928.99,"asr_flags":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":3749.1,"text":"You want to learn a policy that can walk forward forever, but you have a very dense reward function that's like forward velocity."},{"start":3755.16,"text":"Then you can plan for a short horizon in a way that approximates the long horizon problem."},{"start":3761.74,"text":"But if you have a long horizon problem that doesn't have a very dense reward signal,"},{"start":3766.4,"text":"then this is not a good approach."},{"start":3771.28,"text":"Cool."},{"start":3771.92,"text":"And part of the reason for this is the accuracy of the model."},{"start":3777.02,"text":"Another part of this is that it's going to be expensive"},{"start":3780.2,"text":"to be planning out a very long horizon sequence of actions"},{"start":3784.62,"text":"because you're not learning a policy in this case."},{"start":3792.4,"text":"Okay."},{"start":3792.88,"text":"Okay. Now, the question is, can we train a policy using this model?"},{"start":3800.98,"text":"And the first option here is you could actually distill a planner's actions into a policy."},{"start":3807.04,"text":"So you could store these actions and then train a policy to match these actions."},{"start":3813.46,"text":"This would address the compute-intensive problem, and this would make it a lot cheaper,"},{"start":3819.68,"text":"because then you just need to run a forward pass"},{"start":3821.5,"text":"through the neural network to get your actions."},{"start":3825.04,"text":"This doesn't address the horizon problem, though,"},{"start":3828.12,"text":"because we're still going to be using this procedure"},{"start":3830.86,"text":"to optimize for actions."},{"start":3834.7,"text":"And then in terms of handling using models"},{"start":3837.26,"text":"for longer horizon problems,"},{"start":3839.1,"text":"there's two main solutions."},{"start":3844.1,"text":"The first solution is that right now"},{"start":3847.64,"text":"we're optimizing for a sum of rewards."},{"start":3850.62,"text":"from T to T plus H."},{"start":3854.4,"text":"And if we want to optimize"},{"start":3855.82,"text":"for a longer horizon of reward,"},{"start":3858.27,"text":"So far, the way that we would have to do that is by optimizing over a longer horizon of actions, which gets higher and higher dimensional. But another thing that you could do is that if you have a value function, or like an estimate of a value function, then you could actually use that value function to help this process, where instead of trying to maximize the sum of rewards for the next H time steps, you could optimize for the sum of rewards for the next H time steps."},{"start":3888.41,"text":"plus your estimate of the value of the state"},{"start":3892.23,"text":"that you end up at after taking those H actions."},{"start":3898.43,"text":"And so this would end up with an algorithm"},{"start":3903.01,"text":"where you're learning both a model and a value function."},{"start":3905.67,"text":"And then you would be running this planning process."},{"start":3908.85,"text":"You'd be considering a bunch of different actions"},{"start":3911.23,"text":"over some horizon."},{"start":3912.07,"text":"And then past that horizon, you're"},{"start":3914.13,"text":"just asking your value function, is that a good state"},{"start":3915.93,"text":"or a bad state?"},{"start":3917.43,"text":"And so this is a valid way to combine planning with value-based RL in order to select actions."}],"speech_gaps":[],"frame":"../frames/v021/023.webp","frame_time":3761.1},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":308,"text":"Yeah, so the question is, why use the model?","zh":"是的，所以问题是，为什么使用模型？","start":3930.45,"end":3933.99},{"id":309,"text":"Why not just use a Q function, for example?","zh":"为什么不直接使用一个Q函数，例如？","start":3934.11,"end":3937.33},{"id":310,"text":"This is why I didn't want to spend too much time on this method,","zh":"这就是我之所以不想花太多时间在这一方法上的原因，","start":3940.07,"end":3942.93},{"id":311,"text":"is that in this case, you are learning a value function.","zh":"因为在这种情况下，你是在学习一个价值函数。","start":3942.97,"end":3945.39},{"id":312,"text":"You have to learn a value function and a model.","zh":"你必须同时学习一个价值函数和一个模型。","start":3945.39,"end":3947.27},{"id":313,"text":"You're learning a lot of different things,","zh":"你正在学习很多不同的东西，","start":3947.43,"end":3948.81},{"id":314,"text":"and there's a lot of moving pieces.","zh":"并且有很多需要协调的组件。","start":3948.89,"end":3949.89},{"id":315,"text":"There is still some merit to using this.","zh":"使用这种方法仍然有一定的价值。","start":3951.19,"end":3953.53},{"id":316,"text":"And for example, if you know the model,","zh":"例如，如果你知道模型，","start":3953.67,"end":3955.97},{"id":317,"text":"then you're going to get a better estimate of future","zh":"你将能够获得对未来奖励的更好估计","start":3957.73,"end":3960.57},{"id":318,"text":"rewards than your value function.","zh":"相比于你的价值函数。","start":3960.57,"end":3962.47},{"id":319,"text":"And so you can actually use this to plan out future actions.","zh":"因此，你实际上可以利用这一点来规划未来的动作。","start":3962.83,"end":3967.23},{"id":320,"text":"In games, it's actually really common","zh":"在游戏领域，实际上非常常见","start":3967.39,"end":3969.15},{"id":321,"text":"to do these rollouts through your model of the game.","zh":"通过游戏模型进行这些 rollout（ rollout 指模拟轨迹）","start":3969.15,"end":3973.65},{"id":322,"text":"and then to the extent that it's computationally feasible.","zh":"只要计算上是可行的，","start":3974.23,"end":3977.45},{"id":323,"text":"and then use your value function just because it's going to be more accurate. It's going to give you a better estimate of how good your action is. But it's only if you have a really good model or if it's practical and not too difficult to learn a good model. And then the other approach, which I'm thinking we don't have too much time, and so I think I might cover this second approach on Friday.","zh":"然后使用你的价值函数，因为它会更准确。它将为你提供更好的动作效果估计。但前提是你要有一个非常好的模型，或者学习一个好模型是实际可行且不太困难的。而另一种方法，我认为我们没有太多时间，因此我想可能在星期五再讲这个第二方法。","start":3978.25,"end":4008.32},{"id":324,"text":"and then go through the case study. Let's talk about this case study. This case study is actually going to be an example of using planning for dexterous manipulation. The reason why I want to cover this","zh":"然后我们来看这个案例研究。让我们谈谈这个案例研究。这个案例研究实际上是一个使用规划进行灵巧操作的例子。我想涵盖这个案例研究的原因是，在我心中，这仍然是最令人印象深刻的机器人学成果之一，它有一个五指手。此外，它还有一些相当不错的比较，能够阐明在基于模型的强化学习规划中什么对于良好的性能是重要的。其工作方式是，状态包括手的位置和物体的位置。","start":4010.69,"end":4036.87},{"id":325,"text":"case study briefly is that in my mind is actually still one of the most impressive robotics results with a five fingered hand. And it's also has some pretty nice comparisons that are elucidating about what is important for good performance in model based RLN planning. So the way it works is the states are the position of the hand and the position of objects.","zh":"这假设你知道物体的3D位置，这可以通过计算机视觉系统进行估计，或者在物体上放置运动捕捉标记。而手的位置，你可以使用手内部的传感器来测量手的位置。动作空间是控制一个五指手。它有24个不同的关节可以控制。","start":4037.73,"end":4059.55},{"id":326,"text":"This assumes that you know the 3D position of an object, which you can estimate with a computer vision system or put motion capture markers on the objects. Whereas the hand position, you can use sensors in the hand itself in order to measure the hand positions. The action space is to control a five-fingered hand. It has 24 different joints that you can control.","zh":"这假设你知道物体的3D位置，你可以通过计算机视觉系统来估计，或者在物体上放置运动捕捉标记。而对于手的位置，你可以使用手部内部的传感器来测量手的位置。动作空间是控制一个五指手。它有24个不同的关节可供控制。","start":4060.59,"end":4084.74}],"notes":["本段讨论了基于模型的强化学习与直接使用Q函数的对比。讲者指出，使用模型可以提供更准确的未来奖励估计，从而支持更有效的规划。这在游戏等场景中尤为常见，通过模型进行模拟（rollouts）可以生成更精确的行动策略。然而，这种方法需要学习一个准确的模型，这在计算上可能具有挑战性，因此在实际应用中需要权衡模型的准确性与计算可行性。","讲者提到，如果模型足够准确，可以用于规划未来行动，从而提升策略的性能。但模型的学习过程可能涉及多个组件，如价值函数和模型本身，这增加了实现的复杂性。因此，讲者认为在时间有限的情况下，可能需要优先考虑其他方法，例如直接使用价值函数进行策略优化。","案例研究部分介绍了基于模型的强化学习在灵巧操作（dexterous manipulation）中的应用。讲者提到，该案例研究使用了五指手的机械结构，并通过计算机视觉或运动捕捉技术估计物体的位置。手部位置则通过内置传感器进行测量，这为模型的构建提供了必要的输入信息。","动作空间涉及对五指手的24个关节进行控制，这表明模型需要处理高维的输入和输出。讲者强调，这种复杂性使得模型的训练和优化成为关键挑战，同时也突显了模型在提升策略性能方面的潜力。","讲者提到，该案例研究是目前机器人领域中令人印象深刻的成果之一，因为它展示了模型在复杂任务中的有效性。此外，该研究还提供了关于模型基于强化学习规划的重要性的清晰比较，有助于理解模型在实际应用中的价值。","讲者最后提到，由于时间有限，他可能在周五进一步讲解该案例研究，并深入探讨基于模型的强化学习在实际应用中的具体实现和挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3930.45,"end":4084.74,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3930.45,"text":"Yeah, so the question is, why use the model?"},{"start":3934.11,"text":"Why not just use a Q function, for example?"},{"start":3940.07,"text":"This is why I didn't want to spend too much time on this method,"},{"start":3942.97,"text":"is that in this case, you are learning a value function."},{"start":3945.39,"text":"You have to learn a value function and a model."},{"start":3947.43,"text":"You're learning a lot of different things,"},{"start":3948.89,"text":"and there's a lot of moving pieces."},{"start":3951.19,"text":"There is still some merit to using this."},{"start":3953.67,"text":"And for example, if you know the model,"},{"start":3957.73,"text":"then you're going to get a better estimate of future"},{"start":3960.57,"text":"rewards than your value function."},{"start":3962.83,"text":"And so you can actually use this to plan out future actions."},{"start":3967.39,"text":"In games, it's actually really common"},{"start":3969.15,"text":"to do these rollouts through your model of the game."},{"start":3974.23,"text":"and then to the extent that it's computationally feasible."},{"start":3978.25,"text":"and then use your value function just because it's going to be more accurate. It's going to give you a better estimate of how good your action is. But it's only if you have a really good model or if it's practical and not too difficult to learn a good model. And then the other approach, which I'm thinking we don't have too much time, and so I think I might cover this second approach on Friday."},{"start":4010.69,"text":"and then go through the case study. Let's talk about this case study. This case study is actually going to be an example of using planning for dexterous manipulation. The reason why I want to cover this"},{"start":4037.73,"text":"case study briefly is that in my mind is actually still one of the most impressive robotics results with a five fingered hand. And it's also has some pretty nice comparisons that are elucidating about what is important for good performance in model based RLN planning. So the way it works is the states are the position of the hand and the position of objects."},{"start":4060.59,"text":"This assumes that you know the 3D position of an object, which you can estimate with a computer vision system or put motion capture markers on the objects. Whereas the hand position, you can use sensors in the hand itself in order to measure the hand positions. The action space is to control a five-fingered hand. It has 24 different joints that you can control."}],"speech_gaps":[{"start":3937.73,"end":3939.67}],"frame":"../frames/v021/024.webp","frame_time":3942.45},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":327,"text":"And the reward is to target some kind of object trajectory where there's also some penalty for dropping the object. The model is going to be actually pretty simple. The model is going to be a neural network with two hidden layers of size 500, but it's also going to train an ensemble of neural networks. And this is an example that I wanted to look at because this kind of ensembling approach can also help with model errors.","zh":"奖励的目标是使物体轨迹达到某种类型，同时也会对掉落物体施加惩罚。这个模型实际上会非常简单。模型将是一个具有两个500个单元隐藏层的神经网络，但它还将训练一组神经网络的集成。这是一个我想查看的例子，因为这种集成方法也可以帮助处理模型误差。","start":4086.78,"end":4116.05},{"id":328,"text":"And the way this works is instead of just training one neural network, you'll train three neural networks with different random initializations and different kind of mini-batch sampling, just with different random suites.","zh":"这种方法的工作方式是，而不是仅仅训练一个神经网络，你将训练三个具有不同随机初始化和不同种类小批量采样的神经网络，只是使用不同的随机组合。","start":4116.69,"end":4126.99},{"id":329,"text":"And then if one model is very optimistic about what will happen, that can be counterbalanced by errors in other models.","zh":"如果一个模型对将会发生的事情过于乐观，其他模型中的误差可以对此进行抵消。","start":4127.39,"end":4135.57},{"id":330,"text":"And it essentially gives you a way to kind of deal with the fact that models will have different errors in different ways.","zh":"它本质上为你提供了一种处理模型以不同方式产生不同误差的方法。","start":4135.57,"end":4146.79},{"id":331,"text":"So you're not going to exploit the errors in any one model.","zh":"你不会利用任何一个模型中的误差。","start":4147.93,"end":4150.43},{"id":332,"text":"And then the planner, it's a modified version of the cross-interview method.","zh":"然后是规划器，它是交叉面试方法的一种修改版本。","start":4152.07,"end":4155.63},{"id":333,"text":"So it's going to be using iterative resampling of the actions.","zh":"它将使用动作的迭代重采样。","start":4155.75,"end":4159.51},{"id":334,"text":"and the modifications are that it's going to use","zh":"修改之处在于它将使用","start":4159.51,"end":4166.11},{"id":335,"text":"this kind of softer reward-weighted mean","zh":"这种较为柔和的奖励加权平均","start":4166.11,"end":4169.01},{"id":336,"text":"and it does some sort of temporal smoothing on the actions","zh":"并在动作上进行某种时间上的平滑处理","start":4169.01,"end":4171.79},{"id":337,"text":"to encourage and search over actions","zh":"以鼓励并搜索更平滑的动作","start":4171.79,"end":4174.87},{"id":338,"text":"that are taking smoother trajectories.","zh":"这些动作会引导出更平滑的轨迹。","start":4174.87,"end":4178.73},{"id":339,"text":"But you can basically think of it as like cross-entry method","zh":"但你可以基本上把它看作是一种交叉熵方法","start":4181.47,"end":4183.51},{"id":340,"text":"or this kind of iterative sampling-based optimization.","zh":"或者这种类型的迭代采样优化方法。","start":4183.51,"end":4185.67},{"id":341,"text":"optimization. And then they alternate between in step one, collecting 30 trajectories and","zh":"优化。然后他们在第一步中，收集30条轨迹并","start":4185.67,"end":4191.23},{"id":342,"text":"updating the model. Okay. So then in the simulated experiments, we are going to see a comparison","zh":"更新模型。好的。因此在模拟实验中，我们将看到一个比较","start":4192.73,"end":4201.13},{"id":343,"text":"to some model-free methods, methods that are not using a dynamics model. We'll see soft","zh":"与一些无模型方法相比，这些方法不使用动力学模型。我们将看到Soft","start":4201.13,"end":4206.09},{"id":344,"text":"Optector Critic and an algorithm called Natural Policy Gradient, which is a policy gradient.","zh":"Optector Critic以及一种称为自然策略梯度的算法，这是一种策略梯度方法。","start":4206.09,"end":4209.65},{"id":345,"text":"And then we'll also see some model-based methods. So the proposed method is called PDDM. We'll also see an algorithm called MBPO, a different kind of planner called PETS, and then also a method that doesn't use ensembles and doesn't use iterative resampling. And here are some videos of what you're able to do with this method. So we're running planning in the loop of actually execution.","zh":"然后我们还将看到一些基于模型的方法。所提出的这种方法称为PDDM。我们还将看到一种称为MBPO的算法，一种不同类型的规划器称为PETS，以及一种不使用集成且不使用迭代重采样的方法。这里有一些视频展示了使用这种方法能够实现的任务。因此，我们在实际执行的循环中进行规划。","start":4210.62,"end":4239.81},{"id":346,"text":"And we see that it's able to learn how to rotate the bounding balls in the hand and also write digits on this piece of paper.","zh":"我们看到它能够学习如何用手旋转边界球，也能在纸上书写数字。","start":4241.34,"end":4250.86}],"notes":["本段讲解了基于模型的强化学习中使用模型集成（ensembles）的方法，通过训练多个神经网络来减少模型误差的影响。模型集成可以平衡不同模型之间的预测偏差，从而提高整体性能。","讲者提到，模型集成方法可以避免单独依赖某个模型的预测结果，而是通过多个模型的预测结果进行综合，从而更稳健地处理模型误差。","在规划方法上，讲者介绍了修改后的交叉面试法（cross-interview method），该方法通过迭代重采样动作，并使用更柔和的奖励加权均值和时间平滑技术，鼓励探索更平滑的轨迹。","讲者还提到，该方法与传统的交叉面试法或迭代采样优化方法类似，但加入了时间平滑和奖励加权均值的改进。","在实验部分，讲者计划将该方法与一些无模型方法（如Soft Actor-Critic和Natural Policy Gradient）进行比较，同时也会与其他基于模型的方法（如MBPO、PETS）进行对比。","最后，讲者展示了该方法在实际应用中的效果，包括旋转手部的球体和在纸上书写数字等任务。"],"formulas":[],"uncertainties":["Optector Critic 可能是 'Soft Actor-Critic' 的误听，需进一步确认。","cross-entry method 可能是 'cross-interview method' 的误听，需进一步确认。"],"diagram":"none","start":4086.78,"end":4250.86,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":4086.78,"text":"And the reward is to target some kind of object trajectory where there's also some penalty for dropping the object. The model is going to be actually pretty simple. The model is going to be a neural network with two hidden layers of size 500, but it's also going to train an ensemble of neural networks. And this is an example that I wanted to look at because this kind of ensembling approach can also help with model errors."},{"start":4116.69,"text":"And the way this works is instead of just training one neural network, you'll train three neural networks with different random initializations and different kind of mini-batch sampling, just with different random suites."},{"start":4127.39,"text":"And then if one model is very optimistic about what will happen, that can be counterbalanced by errors in other models."},{"start":4135.57,"text":"And it essentially gives you a way to kind of deal with the fact that models will have different errors in different ways."},{"start":4147.93,"text":"So you're not going to exploit the errors in any one model."},{"start":4152.07,"text":"And then the planner, it's a modified version of the cross-interview method."},{"start":4155.75,"text":"So it's going to be using iterative resampling of the actions."},{"start":4159.51,"text":"and the modifications are that it's going to use"},{"start":4166.11,"text":"this kind of softer reward-weighted mean"},{"start":4169.01,"text":"and it does some sort of temporal smoothing on the actions"},{"start":4171.79,"text":"to encourage and search over actions"},{"start":4174.87,"text":"that are taking smoother trajectories."},{"start":4181.47,"text":"But you can basically think of it as like cross-entry method"},{"start":4183.51,"text":"or this kind of iterative sampling-based optimization."},{"start":4185.67,"text":"optimization. And then they alternate between in step one, collecting 30 trajectories and"},{"start":4192.73,"text":"updating the model. Okay. So then in the simulated experiments, we are going to see a comparison"},{"start":4201.13,"text":"to some model-free methods, methods that are not using a dynamics model. We'll see soft"},{"start":4206.09,"text":"Optector Critic and an algorithm called Natural Policy Gradient, which is a policy gradient."},{"start":4210.62,"text":"And then we'll also see some model-based methods. So the proposed method is called PDDM. We'll also see an algorithm called MBPO, a different kind of planner called PETS, and then also a method that doesn't use ensembles and doesn't use iterative resampling. And here are some videos of what you're able to do with this method. So we're running planning in the loop of actually execution."},{"start":4241.34,"text":"And we see that it's able to learn how to rotate the bounding balls in the hand and also write digits on this piece of paper."}],"speech_gaps":[],"frame":"../frames/v021/025.webp","frame_time":4098.780000000001},{"title":"基于模型的强化学习（Model-Based RL）的效率与数据需求","segments":[{"id":347,"text":"And we see that if we plot the kind of reward where higher is better over the number of data points that are collected in order to fit the model or in the policy in the case of model-free methods, we see that first for this really complex task, only the proposed method is able to solve it because it's really challenging.","zh":"我们看到，如果我们绘制出奖励值（越高越好）与用于拟合模型或策略的数据点数量之间的关系，我们会发现，对于这个非常复杂的任务，只有所提出的的方法能够解决它，因为这个任务非常具有挑战性。","start":4251.88,"end":4271.26},{"id":348,"text":"And we also see that some of the methods that, for example, don't do iterative resampling, that, for example, just do random sampling, shown in yellow, get very poor performance because you're not able to get to a good part of the distribution and hone in on good actions.","zh":"我们还看到，一些方法，例如不进行迭代重采样的方法，比如仅仅进行随机采样的方法（如黄色所示），表现非常差，因为无法到达分布中的良好区域，并聚焦于良好的动作。","start":4272.05,"end":4287.39},{"id":349,"text":"And in the case of handwriting, which is a little bit easier, we see that some methods are able to get good performance, like SAC and natural policy gradient get high performance, but they need far, far more data than this model-based method, which is shown in green. And so the model-based method is using maybe on the order of 100,000 time steps of data, whereas the model-free methods are using half a million time steps.","zh":"在手写这种稍微容易一些的情况下，我们可以看到一些方法能够获得良好的性能，例如SAC和自然策略梯度方法表现优异，但它们所需的数据量远远多于这种基于模型的方法，如图中绿色所示。因此，基于模型的方法可能使用大约100,000个时间步的数据，而无模型方法则使用大约500,000个时间步的数据。","start":4288.49,"end":4315.39},{"id":350,"text":"So it's a lot more efficient than model-free methods. It's also more performant than other model-based methods. We also see that the model needs to be sufficiently large. You also need this ensemble for good performance. And there's different trade-offs with regard to the planning horizon. So you don't want to plan for too long into the future because that's too high dimensional. And then they also did it on a real hand using the method that we talked about.","zh":"因此，它比基于模型自由的方法更加高效。它也比其他基于模型的方法表现更好。我们还看到，模型需要足够大。你还需要一个集合来获得良好的表现。此外，关于规划时间范围有不同的权衡。你不希望规划太远的未来，因为这会变得过于高维。然后他们还使用了我们之前讨论的方法在真实的手上进行了实验。","start":4316.95,"end":4343.0},{"id":351,"text":"Data efficiency is really important for fragile hardware. This robot hand is very fragile. There actually is one at Stanford in the Gates Building, and I think all the students are afraid to touch it because they don't want to break it. And then they have to figure out how to fix it because it's also really complicated.","zh":"数据效率对于脆弱的硬件来说非常重要。这个机器人手非常脆弱。实际上，斯坦福大学在Gates大楼里有一个这样的机器人手，我认为所有学生都不敢触碰它，因为他们不想把它弄坏。然后他们必须想办法修复它，因为它也非常复杂。","start":4344.19,"end":4358.59},{"id":352,"text":"And the success rate for 90-degree turns is actually around 100% after just four hours of data. For 180-degree turns, which is a bit harder, the success rate is a bit lower, but you're still able to make significant performance with four hours of data. They also reset the system when it dropped a ball using another robot like this setup.","zh":"90度转弯的成功率实际上在仅仅四小时的数据后就达到了100%。对于稍微困难一些的180度转弯，成功率略低，但你仍然能够用四小时的数据实现显著的性能提升。他们还使用另一个类似的机器人设置在系统掉落球时进行重置。","start":4361.06,"end":4384.16},{"id":353,"text":"That's it for today. Next time, we'll cover the last part about model-based RL and RL with multiple tasks and goals.","zh":"今天的课就到这里。下次我们将讲解关于基于模型的强化学习以及多任务和多目标强化学习的最后一部分内容。","start":4387.43,"end":4393.83}],"notes":["本段讨论了基于模型的强化学习方法在数据效率上的优势，特别是在复杂任务中，相较于无模型方法，基于模型的方法能够以更少的数据获得更好的性能。例如，在手写任务中，基于模型的方法仅需约10万步数据，而无模型方法需要50万步数据。","课堂中提到，某些方法如随机采样（黄色所示）由于无法有效探索分布中的优质区域，导致性能较差。这说明了探索策略对模型性能的重要性。","在实际应用中，基于模型的方法需要足够大的模型和集成（ensemble）以保证性能。此外，规划时间步长的选择也存在权衡，过长的规划会导致高维问题，因此需要合理控制。","课堂中还提到，数据效率对于脆弱硬件（如机器人手）至关重要。由于机器人手结构复杂且易损，因此需要高效的数据利用策略以减少物理实验的次数。","在实际测试中，90度转向的成功率在四小时数据后达到100%，而180度转向的成功率较低，但仍能通过四小时数据实现显著性能。这表明基于模型的方法在不同任务难度下具有一定的适应性。","最后，课堂预告了下一次课程将讨论基于模型的强化学习在多任务和多目标场景下的应用，这表明该课程内容逐步深入，涵盖更复杂的强化学习场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4251.88,"end":4393.83,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4251.88,"text":"And we see that if we plot the kind of reward where higher is better over the number of data points that are collected in order to fit the model or in the policy in the case of model-free methods, we see that first for this really complex task, only the proposed method is able to solve it because it's really challenging."},{"start":4272.05,"text":"And we also see that some of the methods that, for example, don't do iterative resampling, that, for example, just do random sampling, shown in yellow, get very poor performance because you're not able to get to a good part of the distribution and hone in on good actions."},{"start":4288.49,"text":"And in the case of handwriting, which is a little bit easier, we see that some methods are able to get good performance, like SAC and natural policy gradient get high performance, but they need far, far more data than this model-based method, which is shown in green. And so the model-based method is using maybe on the order of 100,000 time steps of data, whereas the model-free methods are using half a million time steps."},{"start":4316.95,"text":"So it's a lot more efficient than model-free methods. It's also more performant than other model-based methods. We also see that the model needs to be sufficiently large. You also need this ensemble for good performance. And there's different trade-offs with regard to the planning horizon. So you don't want to plan for too long into the future because that's too high dimensional. And then they also did it on a real hand using the method that we talked about."},{"start":4344.19,"text":"Data efficiency is really important for fragile hardware. This robot hand is very fragile. There actually is one at Stanford in the Gates Building, and I think all the students are afraid to touch it because they don't want to break it. And then they have to figure out how to fix it because it's also really complicated."},{"start":4361.06,"text":"And the success rate for 90-degree turns is actually around 100% after just four hours of data. For 180-degree turns, which is a bit harder, the success rate is a bit lower, but you're still able to make significant performance with four hours of data. They also reset the system when it dropped a ball using another robot like this setup."},{"start":4387.43,"text":"That's it for today. Next time, we'll cover the last part about model-based RL and RL with multiple tasks and goals."}],"speech_gaps":[],"frame":"../frames/v021/026.webp","frame_time":4263.88}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v021.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
