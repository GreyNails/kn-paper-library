动的步长，当梯度变小时，移动的步长也应相应减小。","讲者指出，当梯度为零时，优化过程可能停止，此时选择的动作即为最终的最优动作。这表明梯度下降法在优化过程中会逐步逼近最优解。","讲者还提到，除了梯度下降法，还存在另一种优化方法，即采样优化（sampling-based optimization），也称为无梯度优化（gradient-free optimization）。这种方法不依赖梯度信息，而是通过随机采样动作并评估其对应的奖励总和来寻找最优动作。","采样优化方法适用于无法计算梯度或梯度信息不可用的情况，例如在某些复杂的强化学习问题中，直接计算梯度可能非常困难或不可行。","讲者通过对比梯度下降法和采样优化方法，强调了不同优化方法的适用场景和优缺点，为后续讨论基于模型的强化学习中的优化策略提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1893.19,"end":2052.0,"asr_flags":[],"math_clarifications":["原始文本中未明确提及任何具体的优化目标函数或梯度计算过程，因此无法确认公式\\nabla J(\\theta) = 0的适用性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1893.19,"text":"So we'll talk a little bit about this. For now, we're going to be only considering this short horizon planning. And in eight-ish slides or something, I'll talk a little bit more about what happens if you want to do infinite or very long horizon things. And we'll also talk about some of the shortcomings of it. Now, so far, we've been talking about gradient descent for optimizing actions."},{"start":1923.63,"text":"And this is actually not the only way that you can do optimization. So it's probably the optimization technique that you're most familiar with, because we use it all the time for neural networks. But there's other ways that we can optimize a function, specifically when we're trying to optimize the sum of rewards. And if we think about gradient-based optimization,"},{"start":1945.33,"text":"Typically, we have something that we're trying to optimize over. In this case, it would be we're trying to be optimizing over actions. And the thing that we're trying to optimize is the sum of rewards. Maybe, yeah. And so actually also there's a small mistake here. There should be a plus sign because we're maximizing, not minimizing. So the way that gradient descent works is you kind of randomly initialize."},{"start":1973.99,"text":"some action like right here, and then you evaluate the gradient at that position. So maybe you find that the gradient is like pointed like this way. And then you then say, okay, I should move probably over here. And then maybe you sample this. You choose this action because that's kind of a step size away. You evaluate the gradient there, and you find that the gradient maybe looks something like this."},{"start":1999.49,"text":"And then you say, maybe I should move further to the left, but a little bit less because the slope is less steep. And then you get maybe something that looks like this. And you're like, OK, the gradient is 0. And so maybe I won't be sampling any further actions. And then your final choice after writing gradient descent is this value right here. Now, an alternative way to try to do a kind of optimization"},{"start":2026.91,"text":"is instead what I'll call sampling-based optimization. This is also called gradient-free optimization. And the way that this works is if you have some set of actions and some sum of rewards, instead of just starting from one place and evaluating the gradient, we're actually not going to use the gradients at all. And we'll just sample a bunch of actions and see what the values are."}],"speech_gaps":[],"frame":"../frames/v021/012.webp","frame_time":1905.19},{"title":"基于模型的强化学习中的采样方法","segments":[{"id":173,"text":"So maybe we'll, for example, sample this action, we'll sample this action, maybe sample this one, maybe sample this one, and so forth. And the first version of a sampling-based method could just be to sample a bunch of things in parallel, and then pick the best one. This is basically just called random sampling.","start":2052.81,"end":2080.68},{"id":174,"text":"Sometimes it actually works better than you think it might do. And if we were to do that, then we would say that, okay, this action has the highest. And so maybe I will kind of return the corresponding action for this value. But you can also do something a bit better than that, even without gradient optimization, which is that you can look at these samples and say, okay, it looks like maybe like...","start":2081.85,"end":2105.89},{"id":175,"text":"maybe we have one more, one additional sample thing that we've, maybe we've also sampled something like this. And in that case, one thing that we could do is instead of just considering this one and taking the best, is we could say maybe we should sample more over here. Because these are the ones that were the best. And so we could fit","start":2106.35,"end":2127.2},{"id":176,"text":"we could basically try to sample more from the things that were good. So we could take the ones that were the best, fit some kind of distribution over those, like a simple distribution like a Gaussian. Say that, OK, these were the actions that were the best. So maybe we could fit some Gaussian or sample more from the actions here. And then do another round of sampling from that new distribution, where now you're going to be sampling more from this distribution. You find that when you sample for a second round, maybe you get","start":2130.05,"end":2157.43},{"id":177,"text":"samples that look like this. And that allows you to hone in on what a good action might be. So on the slides, I did this on the slides instead of with actions and maximizing rewards, I did it with parameters and minimizing some loss function. But all the ideas are the same. So for gradient descent, we...","start":2159.67,"end":2185.57},{"id":178,"text":"pick an initial value, evaluate the gradient, move in the direction of the gradient, and repeat that process. There's some underlying function that we don't know, and so we're trying to get to the minimum of that function using these gradients. And likewise with sampling, or another way to call this is a zeroth order optimization, we're instead going to be sampling points.","start":2186.31,"end":2209.26}],"notes":["本段讲解了基于采样的强化学习方法，强调了通过采样来寻找最优动作的策略。讲者提到，虽然随机采样可能不如梯度优化方法高效，但有时也能取得不错的效果。此外，还提到可以通过对表现好的样本进行更多采样，从而改进策略，例如使用高斯分布来建模这些样本。","讲者进一步说明，这种采样方法可以与梯度下降方法进行类比，即通过采样点来逼近目标函数的最小值。这种方法被称为零阶优化，因为它不依赖于梯度信息，而是直接通过采样来寻找最优解。","在讲解过程中，讲者提到在幻灯片上展示了一个例子，用参数和损失函数代替了动作和奖励最大化，但核心思想是相同的。这说明了采样方法的通用性，可以应用于不同的优化问题。","讲者还提到，梯度下降方法的基本步骤包括选择初始值、计算梯度、沿梯度方向移动，并重复这一过程。这种方法依赖于对目标函数的梯度信息，而采样方法则不依赖于梯度，而是通过直接采样来寻找最优解。","讲者强调了采样方法和梯度下降方法之间的区别，指出采样方法属于零阶优化，而梯度下降属于一阶优化。这说明了不同优化方法的适用场景和优缺点。","最后，讲者提到在采样过程中，可以通过对表现好的样本进行更多采样，从而逐步逼近最优解。这种方法类似于在搜索空间中进行探索，通过不断调整采样分布来提高效率。"],"formulas":[{"latex":"x_{t+1} = x_t - \\nabla f(x_t)","symbols":"x_t: 第t次迭代的参数值，\\nabla f(x_t): 在x_t处的目标函数梯度","explanation":"公式正确，表示梯度下降法的迭代更新规则，其中x_{t+1}是第t+1次迭代的参数值，\\nabla f(x_t)是目标函数在x_t处的梯度。","evidence":"pick an initial value, evaluate the gradient, move in the direction of the gradient, and repeat that process. There's some underlying function that we don't know, and so we're trying to get to the minimum of that function using these gradients. And likewise with sampling, or another way to call this is a zeroth order optimization, we're instead going to be sampling points."}],"uncertainties":["maybe we have one more, one additional sample thing that we've, maybe we've also sampled something like this."],"diagram":"none","start":2052.81,"end":2209.26,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2052.81,"text":"So maybe we'll, for example, sample this action, we'll sample this action, maybe sample this one, maybe sample this one, and so forth. And the first version of a sampling-based method could just be to sample a bunch of things in parallel, and then pick the best one. This is basically just called random sampling."},{"start":2081.85,"text":"Sometimes it actually works better than you think it might do. And if we were to do that, then we would say that, okay, this action has the highest. And so maybe I will kind of return the corresponding action for this value. But you can also do something a bit better than that, even without gradient optimization, which is that you can look at these samples and say, okay, it looks like maybe like..."},{"start":2106.35,"text":"maybe we have one more, one additional sample thing that we've, maybe we've also sampled something like this. And in that case, one thing that we could do is instead of just considering this one and taking the best, is we could say maybe we should sample more over here. Because these are the ones that were the best. And so we could fit"},{"start":2130.05,"text":"we could basically try to sample more from the things that were good. So we could take the ones that were the best, fit some kind of distribution over those, like a simple distribution like a Gaussian. Say that, OK, these were the actions that were the best. So maybe we could fit some Gaussian or sample more from the actions here. And then do another round of sampling from that new distribution, where now you're going to be sampling more from this distribution. You find that when you sample for a second round, maybe you get"},{"start":2159.67,"text":"samples that look like this. And that allows you to hone in on what a good action might be. So on the slides, I did this on the slides instead of with actions and maximizing rewards, I did it with parameters and minimizing some loss function. But all the ideas are the same. So for gradient descent, we..."},{"start":2186.31,"text":"pick an initial value, evaluate the gradient, move in the direction of the gradient, and repeat that process. There's some underlying function that we don't know, and so we're trying to get to the minimum of that function using these gradients. And likewise with sampling, or another way to call this is a zeroth order optimization, we're instead going to be sampling points."}],"speech_gaps":[],"frame":"../frames/v021/013.webp","frame_time":2064.81},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":179,"text":"and trying to figure out what a good value is just from sampling. And again, there is some underlying curve here that we don't know. We can only evaluate samples, or in the case of gradient descent, the gradient of those samples. One other nice thing about a sampling-based optimization is that it means that you don't need gradients. So it can apply to discrete variables. It can also apply to scenarios where","start":2210.42,"end":2236.16},{"id":180,"text":"You maybe know the reward function. You have reward values, but you don't know what the gradient of the reward function is. If it's a discrete reward function, then getting the gradient might be challenging.","start":2236.8,"end":2261.45},{"id":181,"text":"One method for doing this is cross-entropy method. There's also a way to do this with, well, if you have discrete actions, you could also just, well, there's somewhat of a different process, but you could also just use random sampling if your action space is small enough. So what cross-entropy method does, not to be confused with the cross-entropy loss, is you sample from some initial distribution. This could be a uniform distribution.","start":2261.89,"end":2288.29},{"id":182,"text":"Then rank the samples according to their loss to get the, like, this would be the best one, this would be the second best, this third best, fourth best, and so forth. And then take the best ones, like these three ones, and then fit a distribution, like a Gaussian distribution, to those best samples. And then resample from your distribution, re-rank, and repeat this process.","start":2289.61,"end":2318.33},{"id":183,"text":"So it's basically like a very simple sampling-based way to try to get, in this case, good actions. It's kind of a general optimization technique that could be used for any sort of objective. Now, cool. And then after this process, eventually, after you run some number of iterations, you'll return the best sample that you found in the last iteration.","start":2319.61,"end":2345.28},{"id":184,"text":"The question is, can you also use sampling to approximate gradients? Yes. So there's something called finite differences, where if you don't have a way to get gradients, then you could try to sample basically points very close together and then use that to basically look at the difference between this point and this point and use that to estimate the gradient. There's pros and cons to it, but there's definitely a valid approach.","start":2346.49,"end":2372.91}],"notes":["本段讲解了基于采样的优化方法，特别是交叉熵方法（cross-entropy method）的应用。该方法通过从初始分布（如均匀分布）中采样，根据损失函数对样本进行排序，选择最优样本并拟合分布（如高斯分布），然后重新采样并重复这一过程。这种方法适用于离散动作空间，且不需要梯度信息。","交叉熵方法与交叉熵损失函数不同，其核心思想是通过迭代优化分布来逼近最优解。在每次迭代中，选择表现最好的样本，拟合新的分布，并在下一轮中使用该分布进行采样。这种方法可以用于任何优化目标，而不仅仅是强化学习问题。","在采样过程中，样本的排序是基于损失函数的值，这通常与目标函数相关。例如，在强化学习中，损失函数可能与奖励函数相关，而最优样本即为在当前分布下表现最好的动作。","在采样后，拟合分布（如高斯分布）是为了生成更接近最优解的样本。通过重复这一过程，可以逐步逼近最优解。这种方法在离散动作空间中特别有用，因为不需要计算梯度。","除了交叉熵方法，还可以使用随机采样来优化目标函数，前提是动作空间足够小。这种方法虽然简单，但可能不如交叉熵方法高效。","最后，讨论了如何利用采样来近似梯度，即有限差分法（finite differences）。该方法通过在目标函数附近采样点，计算其差值来估计梯度。虽然这种方法有其优缺点，但确实是一种有效的替代方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2210.42,"end":2372.91,"asr_flags":[],"math_clarifications":["原文未明确提及有限差分法的具体公式，因此无法核定该公式的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2210.42,"text":"and trying to figure out what a good value is just from sampling. And again, there is some underlying curve here that we don't know. We can only evaluate samples, or in the case of gradient descent, the gradient of those samples. One other nice thing about a sampling-based optimization is that it means that you don't need gradients. So it can apply to discrete variables. It can also apply to scenarios where"},{"start":2236.8,"text":"You maybe know the reward function. You have reward values, but you don't know what the gradient of the reward function is. If it's a discrete reward function, then getting the gradient might be challenging. Okay, and then to formalize this kind of iterative sampling process where we're trying to sample more from..."},{"start":2261.89,"text":"the good actions. One method for doing this is cross-entropy method. There's also a way to do this with, well, if you have discrete actions, you could also just, well, there's somewhat of a different process, but you could also just use random sampling if your action space is small enough. So what cross-entropy method does, not to be confused with the cross-entropy loss, is you sample from some initial distribution. This could be a uniform distribution."},{"start":2289.61,"text":"Then rank the samples according to their loss to get the, like, this would be the best one, this would be the second best, this third best, fourth best, and so forth. And then take the best ones, like these three ones, and then fit a distribution, like a Gaussian distribution, to those best samples. And then resample from your distribution, re-rank, and repeat this process."},{"start":2319.61,"text":"So it's basically like a very simple sampling-based way to try to get, in this case, good actions. It's kind of a general optimization technique that could be used for any sort of objective. Now, cool. And then after this process, eventually, after you run some number of iterations, you'll return the best sample that you found in the last iteration."},{"start":2346.49,"text":"The question is, can you also use sampling to approximate gradients? Yes. So there's something called finite differences, where if you don't have a way to get gradients, then you could try to sample basically points very close together and then use that to basically look at the difference between this point and this point and use that to estimate the gradient. There's pros and cons to it, but there's definitely a valid approach."}],"speech_gaps":[],"frame":"../frames/v021/014.webp","frame_time":2222.42},{"title":"基于模型的强化学习中策略的表示与计算","segments":[{"id":185,"text":"Yeah, the reason is why do I put the quotes around the policy here? The reason is that we're not like learning a parametric policy. We're not like learning a neural network to represent a policy. And there's actually like an optimization process underlying the policy here. And so typically we don't.","start":2373.96,"end":2394.72},{"id":186,"text":"It's a policy in the sense that it is mapping from a state to an action or a state to actually multiple future actions. But it's often not referred to as a policy because to differentiate it from policies that are like more like neural network like that are like more compact.","start":2396.45,"end":2415.13},{"id":187,"text":"Well, you can also have a linear function that's mapping states and actions. The main thing is that it's a process, it's like an iterative optimization process rather than some closed form like here's an action for a state. The question is, can we talk a little bit about how this policy is stored? The only thing that we have learned at this point is a dynamics model and potentially a reward function.","start":2416.38,"end":2442.41},{"id":188,"text":"And so the only thing that we have stored is the parameters of the model and the parameters of your reward model. And then when you're actually trying to figure out what to do and what actions to take, what policy to follow, we don't have a neural network that's telling us what actions to take. Instead, every single time step, you're thinking, okay, what's going to happen if I do this, this, or this? And then choosing actions that you think are good.","start":2443.06,"end":2470.34},{"id":189,"text":"as a result of that kind of thinking process.","start":2470.88,"end":2473.16},{"id":190,"text":"This ends up being like you're using a lot more compute as part of this process.","start":2473.86,"end":2477.7},{"id":191,"text":"You're doing that like in real time as you're trying to figure out what actions to take.","start":2477.9,"end":2481.94},{"id":192,"text":"Yeah. So we're not recording what we're doing right now.","start":2482.72,"end":2488.5},{"id":193,"text":"Yeah. So the question is,","start":2488.62,"end":2490.92},{"id":194,"text":"So yeah, when you select the distribution to sample from,","start":2491.02,"end":2495.08},{"id":195,"text":"So yeah, when you select the distribution to sample from,","start":2495.32,"end":2499.0},{"id":196,"text":"your actions might be out of distribution compared to the data that the model was trained on","start":2500.36,"end":2504.92},{"id":197,"text":"and we'll talk a bit we'll talk in like the next slide on how to deal with that yeah yeah so the","start":2504.92,"end":2510.84},{"id":198,"text":"question is because we're doing so much compute at test time if if you finish computing and by","start":2510.84,"end":2516.66},{"id":199,"text":"the time you finish computing the state has changed how do you account for that the","start":2516.66,"end":2521.38},{"id":200,"text":"typically I don't know if I have a great answer for you I think that typically","start":2524.72,"end":2527.54},{"id":201,"text":"Typically, when people run this in practice, they just try to make that compute process as fast as possible so that they don't have to account for the change.","start":2527.54,"end":2538.4},{"id":202,"text":"I guess one thing you can do is you're kind of planning actually a sequence of actions here.","start":2538.76,"end":2546.36},{"id":203,"text":"And so if you know that, if you can estimate how long that computation took,","start":2546.36,"end":2553.48}],"notes":["本段讨论了基于模型的强化学习中策略的表示方式。与参数化策略不同，这里的策略不是通过神经网络直接表示，而是一个迭代优化过程。策略的存储仅包括动态模型和奖励函数的参数，而不是一个直接的神经网络。在执行过程中，每个时间步都需要进行推理，选择可能的动作。","在策略执行过程中，由于计算量较大，可能会出现动作分布与训练数据分布不一致的问题。这需要在后续步骤中处理，例如在下一张幻灯片中讨论。此外，由于计算过程耗时，状态可能在计算过程中发生变化，因此需要考虑如何处理这种变化。","在实际应用中，人们通常会尽量优化计算过程，使其足够快，从而避免因状态变化而需要额外的处理。此外，可以考虑规划一系列动作，通过估计计算所需时间来应对状态变化的问题。","这些讨论强调了基于模型的强化学习中策略的动态性和计算复杂性，以及如何处理计算过程中的状态变化问题。"],"formulas":[],"uncertainties":["the time you finish computing the state has changed how do you account for that the","typically I don't know if I have a great answer for you I think that typically"],"diagram":"none","start":2373.96,"end":2553.48,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2373.96,"text":"Yeah, the reason is why do I put the quotes around the policy here? The reason is that we're not like learning a parametric policy. We're not like learning a neural network to represent a policy. And there's actually like an optimization process underlying the policy here. And so typically we don't."},{"start":2396.45,"text":"It's a policy in the sense that it is mapping from a state to an action or a state to actually multiple future actions. But it's often not referred to a policy because to differentiate it from policies that are like more like neural network like that are like more compact."},{"start":2416.38,"text":"Well, you can also have a linear function that's mapping states and actions. The main thing is that it's a process, it's like an iterative optimization process rather than some closed form like here's an action for a state. The question is, can we talk a little bit about how this policy is stored? The only thing that we have learned at this point is a dynamics model and potentially a reward function."},{"start":2443.06,"text":"And so the only thing that we have stored is the parameters of the model and the parameters of your reward model. And then when you're actually trying to figure out what to do and what actions to take, what policy to follow, we don't have a neural network that's telling us what actions to take. Instead, every single time step, you're thinking, okay, what's going to happen if I do this, this, or this? And then choosing actions that you think are good."},{"start":2470.88,"text":"as a result of that kind of thinking process."},{"start":2473.86,"text":"This ends up being like you're using a lot more compute as part of this process."},{"start":2477.9,"text":"You're doing that like in real time as you're trying to figure out what actions to take."},{"start":2482.72,"text":"Yeah. So we're not recording what we're doing right now."},{"start":2488.62,"text":"Yeah. So the question is,"},{"start":2491.02,"text":"when we sample actions, can some of them be out of distribution?"},{"start":2495.32,"text":"So yeah, when you select the distribution to sample from,"},{"start":2500.36,"text":"your actions might be out of distribution compared to the data that the model was trained on"},{"start":2504.92,"text":"and we'll talk a bit we'll talk in like the next slide on how to deal with that yeah yeah so the"},{"start":2510.84,"text":"question is because we're doing so much compute at test time if if you finish computing and by"},{"start":2516.66,"text":"the time you finish computing the state has changed how do you account for that the"},{"start":2524.72,"text":"typically I don't know if I have a great answer for you I think that typically"},{"start":2527.54,"text":"Typically, when people run this in practice, they just try to make that compute process as fast as possible so that they don't have to account for the change."},{"start":2538.76,"text":"I guess one thing you can do is you're kind of planning actually a sequence of actions here."},{"start":2546.36,"text":"And so if you know that, if you can estimate how long that computation took,"}],"speech_gaps":[],"frame":"../frames/v021/015.webp","frame_time":2385.96},{"title":"基于模型的强化学习中的规划与优化方法","segments":[{"id":204,"text":"if it took like two time steps, for example,","start":2553.64,"end":2555.48},{"id":205,"text":"then instead of starting by executing AT, you could actually start by executing AT plus three.","start":2555.66,"end":2559.66},{"id":206,"text":"or AT plus two, depending on how the off by one works. And so that's kind of accounting for the fact that time has moved forward. The downside there is that AT and AT plus one might be different from what was actually executed. And so you might be in a different state from where you thought you ended up in. And so that introduces challenges. And it's actually somewhat of an open research problem on how best to handle that sort of","start":2560.55,"end":2588.59},{"id":207,"text":"that sort of thing, especially if you're basically asynchronously running this process and also the world is evolving as well. Going back to doing this with gradient descent versus with samples, there's pros and cons to gradient-based and sampling-based, and this helps elucidate why sampling-based actually can be a good choice for planning.","start":2590.94,"end":2620.04},{"id":208,"text":"So gradient descent is very scalable, even to very high dimensions. And it works well, especially in over-parametrized regimes, like when you have a big neural network that's representing a function that may actually have fewer free parameters.","start":2620.91,"end":2635.63},{"id":209,"text":"The downside is that it requires a nice optimization landscape where your gradients are fairly smooth rather than not smooth, I guess. With neural networks, it ends up being, especially because neural networks have high-dimensional parameter spaces and are over-parameterized, the pros end up heavily outweighing the cons here. Some of the upsides with sampling-based approaches is that it's really easy to parallelize because you can actually","start":2637.54,"end":2665.17},{"id":210,"text":"estimate multiple samples in parallel, whereas gradient descent, it inevitably has to be a very sequential process where you compute one gradient and then apply it and then compute the next gradient and so forth. And this parallelization can actually, in some cases, make it faster.","start":2667.17,"end":2680.59},{"id":211,"text":"It doesn't require gradients if you don't have them. The downside is that it scales poorly to high dimensions. Because if you have a really high dimensional space, it's very hard to cover that high dimensional space with lots of different samples. So in one dimensions, something like this can actually work really, really well.","start":2681.76,"end":2699.44},{"id":212,"text":"But if you could imagine, instead of this being one-dimensional or two-dimensional or ten-dimensional, you have to have your samples cover that space well in order to find a good optimum. Cool. So specifically what the planning approach would look like with a sampling-based optimization is you will still run some policy and train some model.","start":2699.98,"end":2729.24}],"notes":["本段讨论了在基于模型的强化学习中，时间步的处理方式以及由此带来的状态不一致问题。讲者指出，当时间步数增加时，执行的策略可能需要调整，例如从AT变为AT+3或AT+2，这取决于偏移量的处理方式。这种调整可能引入状态不一致的问题，从而带来挑战，尤其是在异步运行和环境动态变化的情况下。","讲者进一步比较了梯度下降和采样方法在规划中的优劣。梯度下降在高维空间中具有良好的可扩展性，尤其在过参数化的情况下表现良好，但需要优化景观平滑。而采样方法虽然在高维空间中扩展性较差，但易于并行化，适合某些场景。","讲者提到，采样方法的一个优势是其并行化能力，可以在多个样本上同时进行估计，而梯度下降则需要按顺序计算和应用梯度。这种并行化在某些情况下可以提高效率。","讲者指出，采样方法在低维空间中表现良好，但在高维空间中需要大量样本覆盖空间以找到最优解。这说明采样方法在高维问题中可能面临挑战。","最后，讲者提到基于采样的规划方法仍然需要运行策略并训练模型，这表明即使在采样方法中，模型的构建和策略的执行仍然是关键步骤。","讲者强调了在规划过程中，如何处理时间步的偏移和状态不一致问题仍然是一个开放的研究问题，尤其是在异步运行和环境动态变化的场景下。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2553.64,"end":2729.24,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2553.64,"text":"if it took like two time steps, for example,"},{"start":2555.66,"text":"then instead of starting by executing AT, you could actually start by executing AT plus three."},{"start":2560.55,"text":"or AT plus two, depending on how the off by one works. And so that's kind of accounting for the fact that time has moved forward. The downside there is that AT and AT plus one might be different from what was actually executed. And so you might be in a different state from where you thought you ended up in. And so that introduces challenges. And it's actually somewhat of an open research problem on how best to handle that sort of"},{"start":2590.94,"text":"that sort of thing, especially if you're basically asynchronously running this process and also the world is evolving as well. Going back to doing this with gradient descent versus with samples, there's pros and cons to gradient-based and sampling-based, and this helps elucidate why sampling-based actually can be a good choice for planning."},{"start":2620.91,"text":"So gradient descent is very scalable, even to very high dimensions. And it works well, especially in over-parametrized regimes, like when you have a big neural network that's representing a function that may actually have fewer free parameters."},{"start":2637.54,"text":"The downside is that it requires a nice optimization landscape where your gradients are fairly smooth rather than not smooth, I guess. With neural networks, it ends up being, especially because neural networks have high-dimensional parameter spaces and are over-parameterized, the pros end up heavily outweighing the cons here. Some of the upsides with sampling-based approaches is that it's really easy to parallelize because you can actually"},{"start":2667.17,"text":"estimate multiple samples in parallel, whereas gradient descent, it inevitably has to be a very sequential process where you compute one gradient and then apply it and then compute the next gradient and so forth. And this parallelization can actually, in some cases, make it faster."},{"start":2681.76,"text":"It doesn't require gradients if you don't have them. The downside is that it scales poorly to high dimensions. Because if you have a really high dimensional space, it's very hard to cover that high dimensional space with lots of different samples. So in one dimensions, something like this can actually work really, really well."},{"start":2699.98,"text":"But if you could imagine, instead of this being one-dimensional or two-dimensional or ten-dimensional, you have to have your samples cover that space well in order to find a good optimum. Cool. So specifically what the planning approach would look like with a sampling-based optimization is you will still run some policy and train some model."}],"speech_gaps":[],"frame":"../frames/v021/016.webp","frame_time":2565.64},{"title":"基于模型的强化学习中的随机射击方法","segments":[{"id":213,"text":"like we did in the first two steps, and we'll also be choosing actions that are trying to maximize rewards. So essentially, things are the same, except the way that we do this optimization problem is going to change, where instead of writing gradient descent, we could instead sample a bunch of different actions, imagine what will happen in the future, and what rewards we'll get.","start":2729.8,"end":2757.24},{"id":214,"text":"and then potentially refine our selection of actions iteratively to then get a good outcome. And so in terms of what this looks like, if we use capital A as shorthand to denote this kind of AT to AT plus H, then version one is if we just do one round of sampling.","start":2757.69,"end":2785.83},{"id":215,"text":"then we'll sample a large number of possible action choices we could take from some distribution, then choose the set of actions that had the highest reward, and then run those actions in the environment.","start":2786.46,"end":2804.33},{"id":216,"text":"The technical name for this is often called random shooting because you're shooting out different possible samples of what could happen in the future, imagining the future, evaluating the reward, and then just picking the one shot that had the highest reward. Now, the downside and the thing that's unsatisfying about this first algorithm is that this distribution may not be very good.","start":2807.08,"end":2833.73},{"id":217,"text":"And so what we could do is we could use the cross-entry method where we're iteratively improving that distribution, where we start from some distribution, maybe a uniform distribution, evaluate, rank, and pick the best samples that have the highest rewards.","start":2834.82,"end":2850.98},{"id":218,"text":"and then refit a new distribution to those best samples and repeat that process, where we're then going to be resampling from that better distribution and then evaluating those samples and repeating. If this is parallelized, this process actually can be quite fast. If you have low-dimensional actions, it's actually also pretty simple to implement.","start":2852.11,"end":2879.21},{"id":219,"text":"But like we talked about, it doesn't scale well to high dimensions. And so it's best if you have a somewhat low-dimensional space that you're considering. This includes both H and A, because the optimization that you're considering is over this vector right here. And you need to be, the size of this is the dimensionality of your action space times the horizon. Cool.","start":2879.95,"end":2904.13}],"notes":["本段讲解了基于模型的强化学习中的一种方法，称为随机射击（random shooting）。该方法通过采样不同的动作序列，模拟未来可能发生的场景，并评估其奖励值，从而选择最优的动作序列。这种方法的核心思想是通过多次采样和迭代优化，逐步改进动作分布，以获得更好的结果。","在随机射击方法中，初始分布可以是均匀分布，然后通过评估和排序，选择奖励最高的样本，并重新拟合一个更好的分布。这个过程可以重复进行，直到达到满意的性能。这种方法在低维动作空间中实现起来相对简单，但随着维度的增加，其计算复杂度会显著上升。","随机射击方法的一个主要缺点是其在高维空间中的扩展性较差。因此，该方法更适合于低维的决策空间，包括动作空间和时间步长（horizon）。优化过程涉及对动作空间和时间步长的联合维度进行处理，因此需要考虑其维度的大小。","在实际应用中，如果能够并行化处理，随机射击方法的计算效率可以显著提高。然而，对于高维问题，这种方法可能需要大量的计算资源和时间，因此在实际部署时需要权衡其优缺点。","本段还提到，随机射击方法的迭代过程可以通过重新采样和评估来逐步优化动作分布，从而提高整体性能。这种方法在某些特定场景下可能是一个有效的替代方案，尤其是在动作空间和时间步长相对较小的情况下。","最后，本段强调了随机射击方法的局限性，特别是在高维空间中的扩展性问题。因此，在选择使用该方法时，需要根据具体问题的维度和计算资源进行权衡。"],"formulas":[],"uncertainties":["cross-entry method"],"diagram":"none","start":2729.8,"end":2904.13,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2729.8,"text":"like we did in the first two steps, and we'll also be choosing actions that are trying to maximize rewards. So essentially, things are the same, except the way that we do this optimization problem is going to change, where instead of writing gradient descent, we could instead sample a bunch of different actions, imagine what will happen in the future, and what rewards we'll get."},{"start":2757.69,"text":"and then potentially refine our selection of actions iteratively to then get a good outcome. And so in terms of what this looks like, if we use capital A as shorthand to denote this kind of AT to AT plus H, then version one is if we just do one round of sampling."},{"start":2786.46,"text":"then we'll sample a large number of possible action choices we could take from some distribution, then choose the set of actions that had the highest reward, and then run those actions in the environment."},{"start":2807.08,"text":"The technical name for this is often called random shooting because you're shooting out different possible samples of what could happen in the future, imagining the future, evaluating the reward, and then just picking the one shot that had the highest reward. Now, the downside and the thing that's unsatisfying about this first algorithm is that this distribution may not be very good."},{"start":2834.82,"text":"And so what we could do is we could use the cross-entry method where we're iteratively improving that distribution, where we start from some distribution, maybe a uniform distribution, evaluate, rank, and pick the best samples that have the highest rewards."},{"start":2852.11,"text":"and then refit a new distribution to those best samples and repeat that process, where we're then going to be resampling from that better distribution and then evaluating those samples and repeating. If this is parallelized, this process actually can be quite fast. If you have low-dimensional actions, it's actually also pretty simple to implement."},{"start":2879.95,"text":"But like we talked about, it doesn't scale well to high dimensions. And so it's best if you have a somewhat low-dimensional space that you're considering. This includes both H and A, because the optimization that you're considering is over this vector right here. And you need to be, the size of this is the dimensionality of your action space times the horizon. Cool."}],"speech_gaps":[],"frame":"../frames/v021/017.webp","frame_time":2741.8},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":220,"text":"Let's run through an example for roughly how this would work.","start":2912.79,"end":2917.15},{"id":221,"text":"So let's say that we are in this simple, beautiful environment and you are trying to maximize reward.","start":2917.27,"end":2926.59},{"id":222,"text":"Maybe you're trying to get to the highest point because the highest point you get the nicest view.","start":2926.79,"end":2931.25},{"id":223,"text":"So your reward is just like the height of where you get to.","start":2932.41,"end":2935.45},{"id":224,"text":"You run some policy, you collect some data like this.","start":2936.05,"end":2938.95},{"id":225,"text":"and maybe you learn that when you kind of train a model on this data that when you move right","start":2938.95,"end":2946.33},{"id":226,"text":"then you go higher because generally when you move right kind of the elevation became higher","start":2946.33,"end":2952.07},{"id":227,"text":"and then when you then kind of try to choose actions according to your model then you're","start":2953.57,"end":2961.27},{"id":228,"text":"going to learn that you should go right so you'll learn that when you're actually kind of finding","start":2961.27,"end":2967.23},{"id":229,"text":"finding actions that maximize reward, your set of actions will be to go right.","start":2967.23,"end":2971.77},{"id":230,"text":"And then you'll actually execute those actions, and you'll go right, which is good for a bit.","start":2975.19,"end":2981.85},{"id":231,"text":"You'll be maximizing reward for a while, and then at some point, you'll fall off the cliff.","start":2982.21,"end":2987.13},{"id":232,"text":"And that's not so good.","start":2987.75,"end":2988.69},{"id":233,"text":"And this is because the thing that we talked about at the very beginning, there's this","start":2991.87,"end":2995.57},{"id":234,"text":"data distribution mismatch where the data that you collected at the beginning doesn't cover the data","start":2995.57,"end":3002.95},{"id":235,"text":"that you are taking with your final policy. So we have a simple fix to this. The simple fix is that","start":3003.49,"end":3012.57},{"id":236,"text":"when we then execute actions in our environment, we can then add those actions to our data set","start":3013.17,"end":3020.43},{"id":237,"text":"and refit our model to that dataset,","start":3020.43,"end":3023.67},{"id":238,"text":"learn a more accurate model,","start":3023.85,"end":3025.31},{"id":239,"text":"and repeat this process.","start":3025.41,"end":3026.67},{"id":240,"text":"So then this is starting to look a little bit more like a reinforcement learning algorithm, because we're actually iteratively collecting data, fitting a better model, in this case a dynamics model, sampling actions, choosing actions to execute, and running those actions in the environment. And so then when we do this,","start":3027.76,"end":3048.62},{"id":241,"text":"We will then execute the actions that we planned. So we'll go off the cliff. Then we'll learn that our model will become more accurate. We'll learn that if we go right past this point, we get a lot of negative rewards. We get a lot of very low elevation, which corresponds to negative rewards. And then we'll be able to learn a model that goes to the top and stops. Cool. Now...","start":3049.04,"end":3077.97}],"notes":["本段讲解了基于模型的强化学习（Model-Based RL）的基本工作原理，通过一个简单的例子说明了如何利用环境数据训练模型，并根据模型选择动作以最大化奖励。讲者提到，当模型不够准确时，可能会导致错误的行为，例如掉入悬崖。因此，需要不断收集数据、更新模型，并重复这一过程以提高模型的准确性。","讲者强调了数据分布不匹配（data distribution mismatch）的问题，即初始收集的数据可能无法覆盖最终策略所生成的数据。这会导致模型预测与实际环境行为之间的偏差，从而影响决策质量。","为了解决数据分布不匹配的问题，讲者提出了一种简单的修复方法：在执行动作时，将这些动作添加到数据集中，并重新拟合模型。通过不断迭代这一过程，可以逐步提高模型的准确性。","讲者进一步说明了基于模型的强化学习与传统强化学习的相似之处，即通过迭代收集数据、拟合模型、选择动作并执行，从而逐步优化策略。这种方法能够更有效地探索环境并学习到更优的策略。","在例子中，讲者提到当模型不够准确时，可能会导致错误的行为，例如掉入悬崖。这说明了模型的准确性对策略性能的重要性。通过不断更新模型，可以避免这种错误，并最终找到最优策略。","讲者最后提到，当模型足够准确时，可以学习到正确的策略，例如找到最高点并停止。这表明基于模型的强化学习能够有效地解决复杂环境中的决策问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2912.79,"end":3077.97,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2912.79,"text":"Let's run through an example for roughly how this would work."},{"start":2917.27,"text":"So let's say that we are in this simple, beautiful environment and you are trying to maximize reward."},{"start":2926.79,"text":"Maybe you're trying to get to the highest point because the highest point you get the nicest view."},{"start":2932.41,"text":"So your reward is just like the height of where you get to."},{"start":2936.05,"text":"You run some policy, you collect some data like this."},{"start":2938.95,"text":"and maybe you learn that when you kind of train a model on this data that when you move right"},{"start":2946.33,"text":"then you go higher because generally when you move right kind of the elevation became higher"},{"start":2953.57,"text":"and then when you then kind of try to choose actions according to your model then you're"},{"start":2961.27,"text":"going to learn that you should go right so you'll learn that when you're actually kind of finding"},{"start":2967.23,"text":"finding actions that maximize reward, your set of actions will be to go right."},{"start":2975.19,"text":"And then you'll actually execute those actions, and you'll go right, which is good for a bit."},{"start":2982.21,"text":"You'll be maximizing reward for a while, and then at some point, you'll fall off the cliff."},{"start":2987.75,"text":"And that's not so good."},{"start":2991.87,"text":"And this is because the thing that we talked about at the very beginning, there's this"},{"start":2995.57,"text":"data distribution mismatch where the data that you collected at the beginning doesn't cover the data"},{"start":3003.49,"text":"that you are taking with your final policy. So we have a simple fix to this. The simple fix is that"},{"start":3013.17,"text":"when we then execute actions in our environment, we can then add those actions to our data set"},{"start":3020.43,"text":"and refit our model to that dataset,"},{"start":3023.85,"text":"learn a more accurate model,"},{"start":3025.41,"text":"and repeat this process."},{"start":3027.76,"text":"So then this is starting to look a little bit more like a reinforcement learning algorithm, because we're actually iteratively collecting data, fitting a better model, in this case a dynamics model, sampling actions, choosing actions to execute, and running those actions in the environment. And so then when we do this,"},{"start":3049.04,"text":"We will then execute the actions that we planned. So we'll go off the cliff. Then we'll learn that our model will become more accurate. We'll learn that if we go right past this point, we get a lot of negative rewards. We get a lot of very low elevation, which corresponds to negative rewards. And then we'll be able to learn a model that goes to the top and stops. Cool. Now..."}],"speech_gaps":[],"frame":"../frames/v021/018.webp","frame_time":2924.79},{"title":"基于模型的强化学习中的开环与闭环策略","segments":[{"id":242,"text":"There is a number of things that we could still improve about this algorithm. And let's talk about a few of those. So, so far we've been executing this kind of set of actions right here in the environment. So we've been planning out a sequence of actions, executing them. And so what that looks like is we have our agent.","start":3078.92,"end":3109.02},{"id":243,"text":"And our agent is like, we're running H actions in the environment. So action AT, AT plus one, AT plus two, and so forth in some environment. And we're executing those actions without actually having access to the previous, the kind of intermediate states. And one alternative,","start":3110.47,"end":3139.76},{"id":244,"text":"that you can consider is something where at each time we're going to be planning T to AT plus H, but we could also have something where we plan AT to T plus H, but we only actually execute AT in the environment. And then we then get another, the next state back in return, and then we replan","start":3140.7,"end":3171.6},{"id":245,"text":"At the next time step, a new set of actions. And so the difference between these two things, this is often what's called open loop because you're not actually using the feedback from the环境, the intermediate STs, when you are executing future actions. Whereas this is often called closed loop because you're able to use...","start":3172.24,"end":3200.55},{"id":246,"text":"You're actually kind of replanning as you get new states. So here's what that looks like. Now, I'm curious, does anyone have thoughts on scenarios in which it might be bad to be open loop like this, where you're only planning based off of ST and not planning based off of all of the future STs?","start":3200.96,"end":3232.61}],"notes":["本段讨论了基于模型的强化学习中开环与闭环策略的区别。开环策略是指在执行未来动作时不使用环境反馈的中间状态，而闭环策略则是在获得新状态后重新规划动作。这种区别对策略的性能和适应性有重要影响。","讲者通过提问引导学生思考开环策略可能存在的问题，例如在动态环境或需要实时调整的场景中，仅基于初始状态进行规划可能导致策略失效。","开环策略通常用于计算效率较高的场景，因为它不需要在执行过程中频繁更新计划，而闭环策略则更适用于需要实时反馈和调整的复杂环境。","在开环策略中，规划的范围是固定的，即从当前时间步到未来H步，而执行时只执行当前动作，后续动作则在下一时间步重新规划。","闭环策略则允许在获得新状态后，根据最新的信息重新规划后续动作，从而提高策略的适应性和鲁棒性。","讲者强调了两种策略在实际应用中的不同适用场景，并通过提问鼓励学生深入思考其优缺点。"],"formulas":[],"uncertainties":["T to AT plus H","AT to T plus H"],"diagram":"none","start":3078.92,"end":3232.61,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3078.92,"text":"There is a number of things that we could still improve about this algorithm. And let's talk about a few of those. So, so far we've been executing this kind of set of actions right here in the environment. So we've been planning out a sequence of actions, executing them. And so what that looks like is we have our agent."},{"start":3110.47,"text":"And our agent is like, we're running H actions in the environment. So action AT, AT plus one, AT plus two, and so forth in some environment. And we're executing those actions without actually having access to the previous, the kind of intermediate states. And one alternative,"},{"start":3140.7,"text":"that you can consider is something where at each time we're going to be planning T to AT plus H, but we could also have something where we plan AT to T plus H, but we only actually execute AT in the environment. And then we then get another, the next state back in return, and then we replan"},{"start":3172.24,"text":"At the next time step, a new set of actions. And so the difference between these two things, this is often what's called open loop because you're not actually using the feedback from the environment, the intermediate STs, when you are executing future actions. Whereas this is often called closed loop because you're able to use..."},{"start":3200.96,"text":"You're actually kind of replanning as you get new states. So here's what that looks like. Now, I'm curious, does anyone have thoughts on scenarios in which it might be bad to be open loop like this, where you're only planning based off of ST and not planning based off of all of the future STs?"}],"speech_gaps":[],"frame":"../frames/v021/019.webp","frame_time":3090.92},{"title":"基于模型的强化学习中的闭环控制与模型预测控制","segments":[{"id":247,"text":"Yeah, so when the environment is changing a lot. So if the environment changed in a way that is different from what you anticipated, because you maybe weren't able to predict everything that would happen, then you won't react to those changes when you act in an open loop way. And instead, if you're closed loop and you're reconsidering based off of the latest states, then you're able to actually react to those changes and potentially in some cases actually","start":3233.26,"end":3261.02},{"id":248,"text":"have a much, much better policy. Whereas in scenarios where the world is a little bit more deterministic, it can be okay to be a little bit open loop at times, but you usually never want to have H be too large. Otherwise, you're executing too open loop. Now, we talked about how we can make planning closed loop, which is instead of...","start":3262.23,"end":3286.84},{"id":249,"text":"instead of executing the entire action sequence, you could just execute only the first planned action. So we're still going to plan a sequence of actions because we need to consider not just the first action, but how all of our actions are going to affect future rewards. But then we'll execute only the first one, observe the resulting state, and then we will then replan an action sequence starting at that new next state.","start":3289.83,"end":3315.13},{"id":250,"text":"And then we can also, like before, also add the data to our data set and periodically refit our model based off of the latest data. This algorithm right here is something called model predictive control. It's very, very common in certain robotic systems, very widely used. It's also used in...","start":3318.38,"end":3345.38},{"id":251,"text":"other simple control systems as well, where you can model lower dimensional systems. It can be quite effective for legged robots as well, where you're trying to learn models and you're able to plan over the next couple of seconds to figure out what will lead to good performance over the next couple of seconds.","start":3346.97,"end":3375.19},{"id":252,"text":"And this sort of replanning, when you actually are considering a new plan at the next time step, if something changes or if you made a mistake, you slipped or something, this replanning allows you to actually consider a completely different course of action and, for example, correct for, not just for changing environments, it can also actually correct for model errors.","start":3378.6,"end":3403.6}],"notes":["本段讲解了在环境变化较大时，闭环控制相较于开环控制的优势。开环控制无法及时应对环境变化，而闭环控制通过不断根据最新状态重新规划策略，能够更有效地应对变化，从而获得更好的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3233.26,"end":3403.6,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3233.26,"text":"Yeah, so when the environment is changing a lot. So if the environment changed in a way that is different from what you anticipated, because you maybe weren't able to predict everything that would happen, then you won't react to those changes when you act in an open loop way. And instead, if you're closed loop and you're reconsidering based off of the latest states, then you're able to actually react to those changes and potentially in some cases actually"},{"start":3262.23,"text":"have a much, much better policy. Whereas in scenarios where the world is a little bit more deterministic, it can be okay to be a little bit open loop at times, but you usually never want to have H be too large. Otherwise, you're executing too open loop. Now, we talked about how we can make planning closed loop, which is instead of..."},{"start":3289.83,"text":"instead of executing the entire action sequence, you could just execute only the first planned action. So we're still going to plan a sequence of actions because we need to consider not just the first action, but how all of our actions are going to affect future rewards. But then we'll execute only the first one, observe the resulting state, and then we will then replan an action sequence starting at that new next state."},{"start":3318.38,"text":"And then we can also, like before, also add the data to our data set and periodically refit our model based off of the latest data. This algorithm right here is something called model predictive control. It's very, very common in certain robotic systems, very widely used. It's also used in..."},{"start":3346.97,"text":"other simple control systems as well, where you can model lower dimensional systems. It can be quite effective for legged robots as well, where you're trying to learn models and you're able to plan over the next couple of seconds to figure out what will lead to good performance over the next couple of seconds."},{"start":3378.6,"text":"And this sort of replanning, when you actually are considering a new plan at the next time step, if something changes or if you made a mistake, you slipped or something, this replanning allows you to actually consider a completely different course of action and, for example, correct for, not just for changing environments, it can also actually correct for model errors."}],"speech_gaps":[],"frame":"../frames/v021/020.webp","frame_time":3245.26},{"title":"基于模型的强化学习中的规划与模型误差处理","segments":[{"id":253,"text":"And so generally this sort of approach, if your model is accurate in a large part of the state space, but in some parts of the state space, it's inaccurate. This sort of approach ends up actually being a lot more robust to those kinds of model errors. Yeah, that's a good question. So if there are multiple correct paths, the question is, will in that sort of kind of multimodality, will that lead to like oscillation between those different?","start":3404.44,"end":3429.8},{"id":254,"text":"It certainly can lead to that if you're replanning all the time and you might kind of start going in one direction and then maybe say, oh, maybe I'll go in a different direction. Sometimes you also won't see that if the state kind of indicates that you've clearly committed to one direction. But so sometimes you see it, sometimes you don't. The other way to accommodate this and also actually address computational challenges is that you can warm start your plan for any given time step.","start":3431.12,"end":3458.9},{"id":255,"text":"to basically the plan from the previous time step. And so if you had planned at to at plus h, and that the next time step you are planning based off of st plus 1, you're planning at plus 1 to t plus 1 plus h, then what you can do is you can actually warm start this using the","start":3459.4,"end":3484.12},{"id":256,"text":"everything but the first time step of this previous plan. Then randomly initialize the last action, then you'll already have some initial plan that is sensible, and so you don't have to run as long of an optimization procedure. It also helps you commit to the previous action and the previous plan. Instead of randomly initializing, for example, in our sampling-based thing, you could either","start":3485.36,"end":3517.44},{"id":257,"text":"Here or in a sampling-based approach, you could initialize close to the previous plan. You could also add some noise or add some variance to your sampling distribution so that you're not only considering that particular plan. Cool. So replanning helps with non-deterministic environments. It also is really, really useful for model errors.","start":3518.54,"end":3537.08},{"id":258,"text":"It is also compute intensive. So the warm starting can be helpful. If you're actually replanning at every single time step, it means that every single time step you're kind of reconsidering what action to take.","start":3539.07,"end":3551.43},{"id":259,"text":"And so it also can introduce additional compute challenges as well. Sometimes you have something in the middle where you'll have some planning horizon, but then maybe you'll replan not every one step, but every like three steps or every 10 steps or something like that. Or maybe your horizon is something like 110 steps.","start":3551.79,"end":3570.05}],"notes":["本段讨论了基于模型的强化学习中模型误差对规划的影响。当模型在状态空间的某些区域不准确时，这种规划方法实际上对模型误差具有更强的鲁棒性。教师指出，如果存在多个正确的路径，可能会在这些路径之间来回切换，但有时状态会表明已经明确选择了某个方向。","教师进一步解释了如何通过热启动（warm start）来应对计算挑战。热启动利用前一步的规划结果，仅随机初始化最后一步动作，从而减少优化过程的计算量，并帮助保持对先前动作和计划的承诺。","在采样方法中，教师提到可以初始化接近先前的计划，或者在采样分布中添加噪声或方差，以考虑更多可能的路径。这有助于避免局限于单一计划，提高规划的灵活性。","教师指出，重新规划在非确定性环境中非常有用，但也会带来计算上的挑战。如果在每个时间步都进行重新规划，会增加计算负担。因此，有时会采用间隔式重新规划，例如每隔三步或十步进行一次，或者设置一个较长的规划时间范围。","教师强调了规划时间范围（planning horizon）的重要性，指出规划时间范围可以是110步等。这表明在实际应用中，需要根据具体问题调整规划的粒度和时间范围，以平衡计算效率和规划质量。","教师还提到，热启动不仅有助于减少计算量，还能帮助保持对先前计划的承诺，避免在规划过程中频繁改变方向，从而提高规划的稳定性和效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3404.44,"end":3570.05,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3404.44,"text":"And so generally this sort of approach, if your model is accurate in a large part of the state space, but in some parts of the state space, it's inaccurate. This sort of approach ends up actually being a lot more robust to those kinds of model errors. Yeah, that's a good question. So if there are multiple correct paths, the question is, will in that sort of kind of multimodality, will that lead to like oscillation between those different?"},{"start":3431.12,"text":"It certainly can lead to that if you're replanning all the time and you might kind of start going in one direction and then maybe say, oh, maybe I'll go in a different direction. Sometimes you also won't see that if the state kind of indicates that you've clearly committed to one direction. But so sometimes you see it, sometimes you don't. The other way to accommodate this and also actually address computational challenges is that you can warm start your plan for any given time step."},{"start":3459.4,"text":"to basically the plan from the previous time step. And so if you had planned at to at plus h, and that the next time step you are planning based off of st plus 1, you're planning at plus 1 to t plus 1 plus h, then what you can do is you can actually warm start this using the"},{"start":3485.36,"text":"everything but the first time step of this previous plan. Then randomly initialize the last action, then you'll already have some initial plan that is sensible, and so you don't have to run as long of an optimization procedure. It also helps you commit to the previous action and the previous plan. Instead of randomly initializing, for example, in our sampling-based thing, you could either"},{"start":3518.54,"text":"Here or in a sampling-based approach, you could initialize close to the previous plan. You could also add some noise or add some variance to your sampling distribution so that you're not only considering that particular plan. Cool. So replanning helps with non-deterministic environments. It also is really, really useful for model errors."},{"start":3539.07,"text":"It is also compute intensive. So the warm starting can be helpful. If you're actually replanning at every single time step, it means that every single time step you're kind of reconsidering what action to take."},{"start":3551.79,"text":"And so it also can introduce additional compute challenges as well. Sometimes you have something in the middle where you'll have some planning horizon, but then maybe you'll replan not every one step, but every like three steps or every 10 steps or something like that. Or maybe your horizon is something like 110 steps."}],"speech_gaps":[],"frame":"../frames/v021/021.webp","frame_time":3416.44},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":260,"text":"Yeah, it's an interesting question. So the question was, like, as you're learning and getting more data, presumably your model is going to get better and you have more confidence in your model. And so maybe insofar as this is really useful for correcting for model errors, you might be able to replan less frequently when you have a better model. So that is certainly, like, yeah.","start":3571.08,"end":3592.06},{"id":261,"text":"very viable. And usually at some point you will have some kind of final model that you're using after the learning process. And you could kind of re-optimize. You could use different hyperparameters with regard to like replanning for that final policy versus during the learning process. And during the learning process, it can also be valuable. Like the model errors also help you explore to some extent because you're going to be exploring exactly the regions where the model is inaccurate because you'll be incentivized to exploit any inaccuracies.","start":3593.24,"end":3620.0},{"id":262,"text":"Yeah, so the question is, it seems like this is an off-policy algorithm, and does it make sense? How do you choose that policy? So yes, this is an off-policy algorithm. We don't need to be using data from our current policy. You can actually use a pretty broad policy, and it makes sense to use a pretty broad policy, because then you'll get a model that's accurate in more places.","start":3620.84,"end":3646.34},{"id":263,"text":"assuming that your model is expressive and can fit that broader data distribution. Okay, so far we've covered planning with models. So we plan a sequence of actions we can do either with gradient descent or sampling. We then update the model using data collected through this planning process, and we can replan to help account for mistakes. This is a pretty simple way to use a learned model.","start":3647.02,"end":3673.73},{"id":264,"text":"One of the things that's really cool about this is if you have a model that's quite good, you can actually plug in different rewards or different goals at test time even.","start":3675.21,"end":3685.65},{"id":265,"text":"and get a policy that can follow. For example, if you have a model that's universally good and you have a robot that's trying to walk, then with that same exact model, you can use this process at test time and say, I want you to run forwards, I want you to walk backwards, I want you to crouch, and this model is quite task agnostic.","start":3686.12,"end":3709.78},{"id":266,"text":"The downside is that it's compute-intensive at test time, and so you need to account for this. And if you have an expensive model, an expensive planning process, this kind of planning at test time might not be suitable. And the last thing is we've been talking about this for short-horizon problems. This is not applicable to long-horizon problems unless you have a shaped reward function.","start":3712.55,"end":3736.22},{"id":267,"text":"If you have a shaped reward function that is telling you a lot about what a good state is versus what a bad state is,","start":3738.18,"end":3743.92},{"id":268,"text":"for example, maybe you have an infinite horizon problem in that you want to walk forward forever.","start":3744.0,"end":3748.9}],"notes":["本段讨论了基于模型的强化学习中模型改进与规划频率的关系。当模型变得更准确时，可以减少重新规划的频率，因为模型的误差更少，从而减少对模型修正的需求。此外，模型在学习过程中也可以帮助探索，因为模型的不准确区域会激励探索。","在模型学习完成后，可以使用不同的超参数进行重新优化，以适应最终策略和学习过程中的策略。模型的误差有助于探索，因为探索会集中在模型不准确的区域。","本段提到基于模型的强化学习可以使用离策略算法，即不需要使用当前策略的数据。使用较广的策略有助于模型在更多区域准确，前提是模型具有足够的表达能力。","模型的表达能力决定了其能否拟合更广泛的数据分布。规划可以通过梯度下降或采样进行，然后使用收集的数据更新模型，并通过重新规划来修正错误。这是一种简单使用学习模型的方法。","当模型足够好时，可以在测试时使用不同的奖励或目标，从而生成相应的策略。例如，一个通用的模型可以用于机器人行走任务，支持不同的动作目标，如前进、后退、蹲下等。","这种方法的缺点是测试时计算成本高，因此需要考虑计算资源。如果模型和规划过程成本高昂，这种测试时的规划可能不适用。此外，这种方法适用于短时间跨度的问题，对于长时间跨度的问题需要有塑造的奖励函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3571.08,"end":3748.9,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3571.08,"text":"Yeah, it's an interesting question. So the question was, like, as you're learning and getting more data, presumably your model is going to get better and you have more confidence in your model. And so maybe insofar as this is really useful for correcting for model errors, you might be able to replan less frequently when you have a better model. So that is certainly, like, yeah."},{"start":3593.24,"text":"very viable. And usually at some point you will have some kind of final model that you're using after the learning process. And you could kind of re-optimize. You could use different hyperparameters with regard to like replanning for that final policy versus during the learning process. And during the learning process, it can also be valuable. Like the model errors also help you explore to some extent because you're going to be exploring exactly the regions where the model is inaccurate because you'll be incentivized to exploit any inaccuracies."},{"start":3620.84,"text":"Yeah, so the question is, it seems like this is an off-policy algorithm, and does it make sense? How do you choose that policy? So yes, this is an off-policy algorithm. We don't need to be using data from our current policy. You can actually use a pretty broad policy, and it makes sense to use a pretty broad policy, because then you'll get a model that's accurate in more places."},{"start":3647.02,"text":"assuming that your model is expressive and can fit that broader data distribution. Okay, so far we've covered planning with models. So we plan a sequence of actions we can do either with gradient descent or sampling. We then update the model using data collected through this planning process, and we can replan to help account for mistakes. This is a pretty simple way to use a learned model."},{"start":3675.21,"text":"One of the things that's really cool about this is if you have a model that's quite good, you can actually plug in different rewards or different goals at test time even."},{"start":3686.12,"text":"and get a policy that can follow. For example, if you have a model that's universally good and you have a robot that's trying to walk, then with that same exact model, you can use this process at test time and say, I want you to run forwards, I want you to walk backwards, I want you to crouch, and this model is quite task agnostic."},{"start":3712.55,"text":"The downside is that it's compute-intensive at test time, and so you need to account for this. And if you have an expensive model, an expensive planning process, this kind of planning at test time might not be suitable. And the last thing is we've been talking about this for short-horizon problems. This is not applicable to long-horizon problems unless you have a shaped reward function."},{"start":3738.18,"text":"If you have a shaped reward function that is telling you a lot about what a good state is versus what a bad state is,"},{"start":3744.0,"text":"for example, maybe you have an infinite horizon problem in that you want to walk forward forever."}],"speech_gaps":[],"frame":"../frames/v021/022.webp","frame_time":3583.08},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":269,"text":"You want to learn a policy that can walk forward forever, but you have a very dense reward function that's like forward velocity.","start":3749.1,"end":3754.18},{"id":270,"text":"Then you can plan for a short horizon in a way that approximates the long horizon problem.","start":3755.16,"end":3759.54},{"id":271,"text":"But if you have a long horizon problem that doesn't have a very dense reward signal,","start":3761.74,"end":3766.4},{"id":272,"text":"then this is not a good approach.","start":3766.4,"end":3768.74},{"id":273,"text":"Cool.","start":3771.28,"end":3771.76},{"id":274,"text":"And part of the reason for this is the accuracy of the model.","start":3771.92,"end":3776.9},{"id":275,"text":"Another part of this is that it's going to be expensive","start":3777.02,"end":3780.2},{"id":276,"text":"to be planning out a very long horizon sequence of actions","start":3780.2,"end":3783.92},{"id":277,"text":"because you're not learning a policy in this case.","start":3784.62,"end":3788.48},{"id":278,"text":"Okay.","start":3792.4,"end":3792.88},{"id":279,"text":"Okay. Now, the question is, can we train a policy using this model?","start":3792.88,"end":3798.84},{"id":280,"text":"And the first option here is you could actually distill a planner's actions into a policy.","start":3800.98,"end":3806.9},{"id":281,"text":"So you could store these actions and then train a policy to match these actions.","start":3807.04,"end":3811.32},{"id":282,"text":"This would address the compute-intensive problem, and this would make it a lot cheaper,","start":3813.46,"end":3819.68},{"id":283,"text":"because then you just need to run a forward pass","start":3819.68,"end":3821.5},{"id":284,"text":"through the neural network to get your actions.","start":3821.5,"end":3823.48},{"id":285,"text":"This doesn't address the horizon problem, though,","start":3825.04,"end":3828.08},{"id":286,"text":"because we're still going to be using this procedure","start":3828.12,"end":3830.86},{"id":287,"text":"to optimize for actions.","start":3830.86,"end":3832.78},{"id":288,"text":"And then in terms of handling using models","start":3834.7,"end":3837.26},{"id":289,"text":"for longer horizon problems,","start":3837.26,"end":3838.36},{"id":290,"text":"there's two main solutions.","start":3839.1,"end":3840.88},{"id":291,"text":"The first solution is that right now","start":3844.1,"end":3847.64},{"id":292,"text":"we're optimizing for a sum of rewards.","start":3847.64,"end":3849.24},{"id":293,"text":"from T to T plus H.","start":3850.62,"end":3852.48},{"id":294,"text":"And if we want to optimize","start":3854.4,"end":3855.82},{"id":295,"text":"for a longer horizon of reward,","start":3855.82,"end":3857.38},{"id":296,"text":"So far, the way that we would have to do that is by optimizing over a longer horizon of actions, which gets higher and higher dimensional. But another thing that you could do is that if you have a value function, or like an estimate of a value function, then you could actually use that value function to help this process, where instead of trying to maximize the sum of rewards for the next H time steps, you could optimize for the sum of rewards for the next H time steps.","start":3858.27,"end":3887.76},{"id":297,"text":"plus your estimate of the value of the state","start":3888.41,"end":3892.23},{"id":298,"text":"that you end up at after taking those H actions.","start":3892.23,"end":3896.59},{"id":299,"text":"And so this would end up with an algorithm","start":3898.43,"end":3902.49},{"id":300,"text":"where you're learning both a model and a value function.","start":3903.01,"end":3905.19},{"id":301,"text":"And then you would be running this planning process.","start":3905.67,"end":3908.61},{"id":302,"text":"You'd be considering a bunch of different actions","start":3908.85,"end":3910.55},{"id":303,"text":"over some horizon.","start":3911.23,"end":3911.81},{"id":304,"text":"And then past that horizon, you're","start":3912.07,"end":3914.13},{"id":305,"text":"just asking your value function, is that a good state","start":3914.13,"end":3915.93},{"id":306,"text":"or a bad state?","start":3915.93,"end":3916.63},{"id":307,"text":"And so this is a valid way to combine planning with value-based RL in order to select actions.","start":3917.43,"end":3928.99}],"notes":["本段讨论了基于模型的强化学习中，如何通过模型和价值函数的结合来处理长时域问题。讲者指出，当奖励信号稀疏时，直接规划长时域的行动序列会非常昂贵，因此需要引入价值函数来辅助决策。","讲者提到，如果拥有价值函数的估计，可以在规划过程中将价值函数的估计值加入到奖励的计算中，从而优化长时域的行动序列。这种方法可以减少对长时域行动序列的直接优化，从而降低计算复杂度。","讲者进一步说明，这种结合模型和价值函数的方法，可以形成一个算法，其中同时学习模型和价值函数，并在规划过程中使用价值函数来评估超出规划时域后的状态是否为好状态。","这种方法允许在规划过程中考虑不同行动序列，并在超出规划时域后，通过价值函数来判断状态的好坏，从而选择最优行动。","讲者强调，这种方法是将规划与基于价值的强化学习相结合的一种有效方式，可以用于选择行动。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3749.1,"end":3928.99,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3749.1,"text":"You want to learn a policy that can walk forward forever, but you have a very dense reward function that's like forward velocity."},{"start":3755.16,"text":"Then you can plan for a short horizon in a way that approximates the long horizon problem."},{"start":3761.74,"text":"But if you have a long horizon problem that doesn't have a very dense reward signal,"},{"start":3766.4,"text":"then this is not a good approach."},{"start":3771.28,"text":"Cool."},{"start":3771.92,"text":"And part of the reason for this is the accuracy of the model."},{"start":3777.02,"text":"Another part of this is that it's going to be expensive"},{"start":3780.2,"text":"to be planning out a very long horizon sequence of actions"},{"start":3784.62,"text":"because you're not learning a policy in this case."},{"start":3792.4,"text":"Okay."},{"start":3792.88,"text":"Okay. Now, the question is, can we train a policy using this model?"},{"start":3800.98,"text":"And the first option here is you could actually distill a planner's actions into a policy."},{"start":3807.04,"text":"So you could store these actions and then train a policy to match these actions."},{"start":3813.46,"text":"This would address the compute-intensive problem, and this would make it a lot cheaper,"},{"start":3819.68,"text":"because then you just need to run a forward pass"},{"start":3821.5,"text":"through the neural network to get your actions."},{"start":3825.04,"text":"This doesn't address the horizon problem, though,"},{"start":3828.12,"text":"because we're still going to be using this procedure"},{"start":3830.86,"text":"to optimize for actions."},{"start":3834.7,"text":"And then in terms of handling using models"},{"start":3837.26,"text":"for longer horizon problems,"},{"start":3839.1,"text":"there's two main solutions."},{"start":3844.1,"text":"The first solution is that right now"},{"start":3847.64,"text":"we're optimizing for a sum of rewards."},{"start":3850.62,"text":"from T to T plus H."},{"start":3854.4,"text":"And if we want to optimize"},{"start":3855.82,"text":"for a longer horizon of reward,"},{"start":3858.27,"text":"So far, the way that we would have to do that is by optimizing over a longer horizon of actions, which gets higher and higher dimensional. But another thing that you could do is that if you have a value function, or like an estimate of a value function, then you could actually use that value function to help this process, where instead of trying to maximize the sum of rewards for the next H time steps, you could optimize for the sum of rewards for the next H time steps."},{"start":3888.41,"text":"plus your estimate of the value of the state"},{"start":3892.23,"text":"that you end up at after taking those H actions."},{"start":3898.43,"text":"And so this would end up with an algorithm"},{"start":3903.01,"text":"where you're learning both a model and a value function."},{"start":3905.67,"text":"And then you would be running this planning process."},{"start":3908.85,"text":"You'd be considering a bunch of different actions"},{"start":3911.23,"text":"over some horizon."},{"start":3912.07,"text":"And then past that horizon, you're"},{"start":3914.13,"text":"just asking your value function, is that a good state"},{"start":3915.93,"text":"or a bad state?"},{"start":3917.43,"text":"And so this is a valid way to combine planning with value-based RL in order to select actions."}],"speech_gaps":[],"frame":"../frames/v021/023.webp","frame_time":3761.1},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":308,"text":"Yeah, so the question is, why use the model?","start":3930.45,"end":3933.99},{"id":309,"text":"Why not just use a Q function, for example?","start":3934.11,"end":3937.33},{"id":310,"text":"This is why I didn't want to spend too much time on this method,","start":3940.07,"end":3942.93},{"id":311,"text":"is that in this case, you are learning a value function.","start":3942.97,"end":3945.39},{"id":312,"text":"You have to learn a value function and a model.","start":3945.39,"end":3947.27},{"id":313,"text":"You're learning a lot of different things,","start":3947.43,"end":3948.81},{"id":314,"text":"and there's a lot of moving pieces.","start":3948.89,"end":3949.89},{"id":315,"text":"There is still some merit to using this.","start":3951.19,"end":3953.53},{"id":316,"text":"And for example, if you know the model,","start":3953.67,"end":3955.97},{"id":317,"text":"then you're going to get a better estimate of future","start":3957.73,"end":3960.57},{"id":318,"text":"rewards than your value function.","start":3960.57,"end":3962.47},{"id":319,"text":"And so you can actually use this to plan out future actions.","start":3962.83,"end":3967.23},{"id":320,"text":"In games, it's actually really common","start":3967.39,"end":3969.15},{"id":321,"text":"to do these rollouts through your model of the game.","start":3969.15,"end":3973.65},{"id":322,"text":"and then to the extent that it's computationally feasible.","start":3974.23,"end":3977.45},{"id":323,"text":"and then use your value function just because it's going to be more accurate. It's going to give you a better estimate of how good your action is. But it's only if you have a really good model or if it's practical and not too difficult to learn a good model. And then the other approach, which I'm thinking we don't have too much time, and so I think I might cover this second approach on Friday.","start":3978.25,"end":4008.32},{"id":324,"text":"and then go through the case study. Let's talk about this case study. This case study is actually going to be an example of using planning for dexterous manipulation. The reason why I want to cover this","start":4010.69,"end":4036.87},{"id":325,"text":"case study briefly is that in my mind is actually still one of the most impressive robotics results with a five fingered hand. And it's also has some pretty nice comparisons that are elucidating about what is important for good performance in model based RLN planning. So the way it works is the states are the position of the hand and the position of objects.","start":4037.73,"end":4059.55},{"id":326,"text":"This assumes that you know the 3D position of an object, which you can estimate with a computer vision system or put motion capture markers on the objects. Whereas the hand position, you can use sensors in the hand itself in order to measure the hand positions. The action space is to control a five-fingered hand. It has 24 different joints that you can control.","start":4060.59,"end":4084.74}],"notes":["本段讨论了基于模型的强化学习与直接使用Q函数的对比。讲者指出，使用模型可以提供更准确的未来奖励估计，从而支持更有效的规划。这在游戏等场景中尤为常见，通过模型进行模拟（rollouts）可以生成更精确的行动策略。然而，这种方法需要学习一个准确的模型，这在计算上可能具有挑战性，因此在实际应用中需要权衡模型的准确性与计算可行性。","讲者提到，如果模型足够准确，可以用于规划未来行动，从而提升策略的性能。但模型的学习过程可能涉及多个组件，如价值函数和模型本身，这增加了实现的复杂性。因此，讲者认为在时间有限的情况下，可能需要优先考虑其他方法，例如直接使用价值函数进行策略优化。","案例研究部分介绍了基于模型的强化学习在灵巧操作（dexterous manipulation）中的应用。讲者提到，该案例研究使用了五指手的机械结构，并通过计算机视觉或运动捕捉技术估计物体的位置。手部位置则通过内置传感器进行测量，这为模型的构建提供了必要的输入信息。","动作空间涉及对五指手的24个关节进行控制，这表明模型需要处理高维的输入和输出。讲者强调，这种复杂性使得模型的训练和优化成为关键挑战，同时也突显了模型在提升策略性能方面的潜力。","讲者提到，该案例研究是目前机器人领域中令人印象深刻的成果之一，因为它展示了模型在复杂任务中的有效性。此外，该研究还提供了关于模型基于强化学习规划的重要性的清晰比较，有助于理解模型在实际应用中的价值。","讲者最后提到，由于时间有限，他可能在周五进一步讲解该案例研究，并深入探讨基于模型的强化学习在实际应用中的具体实现和挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3930.45,"end":4084.74,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3930.45,"text":"Yeah, so the question is, why use the model?"},{"start":3934.11,"text":"Why not just use a Q function, for example?"},{"start":3940.07,"text":"This is why I didn't want to spend too much time on this method,"},{"start":3942.97,"text":"is that in this case, you are learning a value function."},{"start":3945.39,"text":"You have to learn a value function and a model."},{"start":3947.43,"text":"You're learning a lot of different things,"},{"start":3948.89,"text":"and there's a lot of moving pieces."},{"start":3951.19,"text":"There is still some merit to using this."},{"start":3953.67,"text":"And for example, if you know the model,"},{"start":3957.73,"text":"then you're going to get a better estimate of future"},{"start":3960.57,"text":"rewards than your value function."},{"start":3962.83,"text":"And so you can actually use this to plan out future actions."},{"start":3967.39,"text":"In games, it's actually really common"},{"start":3969.15,"text":"to do these rollouts through your model of the game."},{"start":3974.23,"text":"and then to the extent that it's computationally feasible."},{"start":3978.25,"text":"and then use your value function just because it's going to be more accurate. It's going to give you a better estimate of how good your action is. But it's only if you have a really good model or if it's practical and not too difficult to learn a good model. And then the other approach, which I'm thinking we don't have too much time, and so I think I might cover this second approach on Friday."},{"start":4010.69,"text":"and then go through the case study. Let's talk about this case study. This case study is actually going to be an example of using planning for dexterous manipulation. The reason why I want to cover this"},{"start":4037.73,"text":"case study briefly is that in my mind is actually still one of the most impressive robotics results with a five fingered hand. And it's also has some pretty nice comparisons that are
