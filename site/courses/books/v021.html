 elucidating about what is important for good performance in model based RLN planning. So the way it works is the states are the position of the hand and the position of objects."},{"start":4060.59,"text":"This assumes that you know the 3D position of an object, which you can estimate with a computer vision system or put motion capture markers on the objects. Whereas the hand position, you can use sensors in the hand itself in order to measure the hand positions. The action space is to control a five-fingered hand. It has 24 different joints that you can control."}],"speech_gaps":[{"start":3937.73,"end":3939.67}],"frame":"../frames/v021/024.webp","frame_time":3942.45},{"title":"基于模型的强化学习（Model-Based RL）","segments":[{"id":327,"text":"And the reward is to target some kind of object trajectory where there's also some penalty for dropping the object. The model is going to be actually pretty simple. The model is going to be a neural network with two hidden layers of size 500, but it's also going to train an ensemble of neural networks. And this is an example that I wanted to look at because this kind of ensembling approach can also help with model errors.","start":4086.78,"end":4116.05},{"id":328,"text":"And the way this works is instead of just training one neural network, you'll train three neural networks with different random initializations and different kind of mini-batch sampling, just with different random suites.","start":4116.69,"end":4126.99},{"id":329,"text":"And then if one model is very optimistic about what will happen, that can be counterbalanced by errors in other models.","start":4127.39,"end":4135.57},{"id":330,"text":"And it essentially gives you a way to kind of deal with the fact that models will have different errors in different ways.","start":4135.57,"end":4146.79},{"id":331,"text":"So you're not going to exploit the errors in any one model.","start":4147.93,"end":4150.43},{"id":332,"text":"And then the planner, it's a modified version of the cross-interview method.","start":4152.07,"end":4155.63},{"id":333,"text":"So it's going to be using iterative resampling of the actions.","start":4155.75,"end":4159.51},{"id":334,"text":"and the modifications are that it's going to use","start":4159.51,"end":4166.11},{"id":335,"text":"this kind of softer reward-weighted mean","start":4166.11,"end":4169.01},{"id":336,"text":"and it does some sort of temporal smoothing on the actions","start":4169.01,"end":4171.79},{"id":337,"text":"to encourage and search over actions","start":4171.79,"end":4174.87},{"id":338,"text":"that are taking smoother trajectories.","start":4174.87,"end":4178.73},{"id":339,"text":"But you can basically think of it as like cross-entry method","start":4181.47,"end":4183.51},{"id":340,"text":"or this kind of iterative sampling-based optimization.","start":4183.51,"end":4185.67},{"id":341,"text":"optimization. And then they alternate between in step one, collecting 30 trajectories and","start":4185.67,"end":4191.23},{"id":342,"text":"updating the model. Okay. So then in the simulated experiments, we are going to see a comparison","start":4192.73,"end":4201.13},{"id":343,"text":"to some model-free methods, methods that are not using a dynamics model. We'll see soft","start":4201.13,"end":4206.09},{"id":344,"text":"Optector Critic and an algorithm called Natural Policy Gradient, which is a policy gradient.","start":4206.09,"end":4209.65},{"id":345,"text":"And then we'll also see some model-based methods. So the proposed method is called PDDM. We'll also see an algorithm called MBPO, a different kind of planner called PETS, and then also a method that doesn't use ensembles and doesn't use iterative resampling. And here are some videos of what you're able to do with this method. So we're running planning in the loop of actually execution.","start":4210.62,"end":4239.81},{"id":346,"text":"And we see that it's able to learn how to rotate the bounding balls in the hand and also write digits on this piece of paper.","start":4241.34,"end":4250.86}],"notes":["本段讲解了基于模型的强化学习中使用模型集成（ensembles）的方法，通过训练多个神经网络来减少模型误差的影响。模型集成可以平衡不同模型之间的预测偏差，从而提高整体性能。","讲者提到，模型集成方法可以避免单独依赖某个模型的预测结果，而是通过多个模型的预测结果进行综合，从而更稳健地处理模型误差。","在规划方法上，讲者介绍了修改后的交叉面试法（cross-interview method），该方法通过迭代重采样动作，并使用更柔和的奖励加权均值和时间平滑技术，鼓励探索更平滑的轨迹。","讲者还提到，该方法与传统的交叉面试法或迭代采样优化方法类似，但加入了时间平滑和奖励加权均值的改进。","在实验部分，讲者计划将该方法与一些无模型方法（如Soft Actor-Critic和Natural Policy Gradient）进行比较，同时也会与其他基于模型的方法（如MBPO、PETS）进行对比。","最后，讲者展示了该方法在实际应用中的效果，包括旋转手部的球体和在纸上书写数字等任务。"],"formulas":[],"uncertainties":["Optector Critic 可能是 'Soft Actor-Critic' 的误听，需进一步确认。","cross-entry method 可能是 'cross-interview method' 的误听，需进一步确认。"],"diagram":"none","start":4086.78,"end":4250.86,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4086.78,"text":"And the reward is to target some kind of object trajectory where there's also some penalty for dropping the object. The model is going to be actually pretty simple. The model is going to be a neural network with two hidden layers of size 500, but it's also going to train an ensemble of neural networks. And this is an example that I wanted to look at because this kind of ensembling approach can also help with model errors."},{"start":4116.69,"text":"And the way this works is instead of just training one neural network, you'll train three neural networks with different random initializations and different kind of mini-batch sampling, just with different random suites."},{"start":4127.39,"text":"And then if one model is very optimistic about what will happen, that can be counterbalanced by errors in other models."},{"start":4135.57,"text":"And it essentially gives you a way to kind of deal with the fact that models will have different errors in different ways."},{"start":4147.93,"text":"So you're not going to exploit the errors in any one model."},{"start":4152.07,"text":"And then the planner, it's a modified version of the cross-interview method."},{"start":4155.75,"text":"So it's going to be using iterative resampling of the actions."},{"start":4159.51,"text":"and the modifications are that it's going to use"},{"start":4166.11,"text":"this kind of softer reward-weighted mean"},{"start":4169.01,"text":"and it does some sort of temporal smoothing on the actions"},{"start":4171.79,"text":"to encourage and search over actions"},{"start":4174.87,"text":"that are taking smoother trajectories."},{"start":4181.47,"text":"But you can basically think of it as like cross-entry method"},{"start":4183.51,"text":"or this kind of iterative sampling-based optimization."},{"start":4185.67,"text":"optimization. And then they alternate between in step one, collecting 30 trajectories and"},{"start":4192.73,"text":"updating the model. Okay. So then in the simulated experiments, we are going to see a comparison"},{"start":4201.13,"text":"to some model-free methods, methods that are not using a dynamics model. We'll see soft"},{"start":4206.09,"text":"Optector Critic and an algorithm called Natural Policy Gradient, which is a policy gradient."},{"start":4210.62,"text":"And then we'll also see some model-based methods. So the proposed method is called PDDM. We'll also see an algorithm called MBPO, a different kind of planner called PETS, and then also a method that doesn't use ensembles and doesn't use iterative resampling. And here are some videos of what you're able to do with this method. So we're running planning in the loop of actually execution."},{"start":4241.34,"text":"And we see that it's able to learn how to rotate the bounding balls in the hand and also write digits on this piece of paper."}],"speech_gaps":[],"frame":"../frames/v021/025.webp","frame_time":4098.780000000001},{"title":"基于模型的强化学习（Model-Based RL）的效率与数据需求","segments":[{"id":347,"text":"And we see that if we plot the kind of reward where higher is better over the number of data points that are collected in order to fit the model or in the policy in the case of model-free methods, we see that first for this really complex task, only the proposed method is able to solve it because it's really challenging.","start":4251.88,"end":4271.26},{"id":348,"text":"And we also see that some of the methods that, for example, don't do iterative resampling, that, for example, just do random sampling, shown in yellow, get very poor performance because you're not able to get to a good part of the distribution and hone in on good actions.","start":4272.05,"end":4287.39},{"id":349,"text":"And in the case of handwriting, which is a little bit easier, we see that some methods are able to get good performance, like SAC and natural policy gradient get high performance, but they need far, far more data than this model-based method, which is shown in green. And so the model-based method is using maybe on the order of 100,000 time steps of data, whereas the model-free methods are using half a million time steps.","start":4288.49,"end":4315.39},{"id":350,"text":"So it's a lot more efficient than model-free methods. It's also more performant than other model-based methods. We also see that the model needs to be sufficiently large. You also need this ensemble for good performance. And there's different trade-offs with regard to the planning horizon. So you don't want to plan for too long into the future because that's too high dimensional. And then they also did it on a real hand using the method that we talked about.","start":4316.95,"end":4343.0},{"id":351,"text":"Data efficiency is really important for fragile hardware. This robot hand is very fragile. There actually is one at Stanford in the Gates Building, and I think all the students are afraid to touch it because they don't want to break it. And then they have to figure out how to fix it because it's also really complicated.","start":4344.19,"end":4358.59},{"id":352,"text":"And the success rate for 90-degree turns is actually around 100% after just four hours of data. For 180-degree turns, which is a bit harder, the success rate is a bit lower, but you're still able to make significant performance with four hours of data. They also reset the system when it dropped a ball using another robot like this setup.","start":4361.06,"end":4384.16},{"id":353,"text":"That's it for today. Next time, we'll cover the last part about model-based RL and RL with multiple tasks and goals.","start":4387.43,"end":4393.83}],"notes":["本段讨论了基于模型的强化学习方法在数据效率上的优势，特别是在复杂任务中，相较于无模型方法，基于模型的方法能够以更少的数据获得更好的性能。例如，在手写任务中，基于模型的方法仅需约10万步数据，而无模型方法需要50万步数据。","课堂中提到，某些方法如随机采样（黄色所示）由于无法有效探索分布中的优质区域，导致性能较差。这说明了探索策略对模型性能的重要性。","在实际应用中，基于模型的方法需要足够大的模型和集成（ensemble）以保证性能。此外，规划时间步长的选择也存在权衡，过长的规划会导致高维问题，因此需要合理控制。","课堂中还提到，数据效率对于脆弱硬件（如机器人手）至关重要。由于机器人手结构复杂且易损，因此需要高效的数据利用策略以减少物理实验的次数。","在实际测试中，90度转向的成功率在四小时数据后达到100%，而180度转向的成功率较低，但仍能通过四小时数据实现显著性能。这表明基于模型的方法在不同任务难度下具有一定的适应性。","最后，课堂预告了下一次课程将讨论基于模型的强化学习在多任务和多目标场景下的应用，这表明该课程内容逐步深入，涵盖更复杂的强化学习场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4251.88,"end":4393.83,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4251.88,"text":"And we see that if we plot the kind of reward where higher is better over the number of data points that are collected in order to fit the model or in the policy in the case of model-free methods, we see that first for this really complex task, only the proposed method is able to solve it because it's really challenging."},{"start":4272.05,"text":"And we also see that some of the methods that, for example, don't do iterative resampling, that, for example, just do random sampling, shown in yellow, get very poor performance because you're not able to get to a good part of the distribution and hone in on good actions."},{"start":4288.49,"text":"And in the case of handwriting, which is a little bit easier, we see that some methods are able to get good performance, like SAC and natural policy gradient get high performance, but they need far, far more data than this model-based method, which is shown in green. And so the model-based method is using maybe on the order of 100,000 time steps of data, whereas the model-free methods are using half a million time steps."},{"start":4316.95,"text":"So it's a lot more efficient than model-free methods. It's also more performant than other model-based methods. We also see that the model needs to be sufficiently large. You also need this ensemble for good performance. And there's different trade-offs with regard to the planning horizon. So you don't want to plan for too long into the future because that's too high dimensional. And then they also did it on a real hand using the method that we talked about."},{"start":4344.19,"text":"Data efficiency is really important for fragile hardware. This robot hand is very fragile. There actually is one at Stanford in the Gates Building, and I think all the students are afraid to touch it because they don't want to break it. And then they have to figure out how to fix it because it's also really complicated."},{"start":4361.06,"text":"And the success rate for 90-degree turns is actually around 100% after just four hours of data. For 180-degree turns, which is a bit harder, the success rate is a bit lower, but you're still able to make significant performance with four hours of data. They also reset the system when it dropped a ball using another robot like this setup."},{"start":4387.43,"text":"That's it for today. Next time, we'll cover the last part about model-based RL and RL with multiple tasks and goals."}],"speech_gaps":[],"frame":"../frames/v021/026.webp","frame_time":4263.88}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
