e pairs, one of those case-choose pairs, and then we plug it into this equation right here."}],"speech_gaps":[],"frame":"../frames/v035/022.webp","frame_time":3564.67},{"title":"奖励学习（Reward Learning）","segments":[{"id":308,"text":"So you're asking what is the sigma function? Yeah, so the sigma function here, this is a sigmoid. So it is basically a function that squashes the values between 0 and 1. And so it's just a very simple function that I can't remember. I think it looks something like this, where this is 1. So yeah, I'm just using sigma.","zh":"所以你在问什么是sigma函数？是的，这里的sigma函数，这是一个sigmoid函数。它基本上是一个将值压缩在0到1之间的函数。所以它只是一个非常简单的函数，我记不太起来了。我想它看起来像这样，这里显示的是1。所以是的，我正在使用sigma函数。","start":3708.49,"end":3736.82},{"id":309,"text":"sigma right here. So just this function right here. Okay. One other thing you can do is instead of using human feedback, you could also have an AI model. You could ask a strong model, like, is this better than this? The one thing that I'll note is when you are thinking about what is preferred and dispreferred, there are a variety of different axes in which something might be preferred or dispreferred. And so you could, in some cases, you might be able to ask,","zh":"这里的sigma函数。所以就是这个函数。好的。另一件事是你也可以不用人类反馈，而是使用一个AI模型。你可以询问一个强大的模型，比如，这个比这个更好吗？需要注意的一点是，当你考虑什么是被偏好的和不被偏好的时，存在多种不同的轴，某物可能在这些轴上被偏好或不被偏好。因此，在某些情况下，你可能会问，","start":3737.91,"end":3768.03},{"id":310,"text":"for certain things that you care about from the model. This is often referred to as reinforcement learning with AI feedback. As one example of a use case, people have used this to try to prevent models from producing harmful content. And so they will feed two responses into the model and ask the model which response is less harmful.","zh":"关于模型中你关心的某些事物。这通常被称为使用AI反馈的强化学习。作为一个使用案例的例子，人们已经使用这种方法来尝试防止模型生成有害内容。因此，他们会将两个响应输入模型，并询问模型哪个响应的危害性更小。","start":3768.36,"end":3794.2},{"id":311,"text":"One insight here is that critique is often easier than generation. And so this is one of the reasons why you might be able to get a stronger model with AI feedback than otherwise. And there have been some works that show that if you use this kind of feedback, this AI feedback, you can get an improvement in model performance on different axes.","zh":"这里的一个见解是，批评通常比生成更容易。因此，这也是为什么你可能能够通过AI反馈获得一个更强模型的原因之一。有一些研究显示，如果你使用这种类型的反馈，即AI反馈，你可以在不同轴上获得模型性能的提升。","start":3795.36,"end":3819.32},{"id":312,"text":"Okay, so a summary of reward learning. Rewards cannot be taken for granted. We've talked about learning from goals. We talked about learning from human preferences. For goals, it's quite practical. Adversarial trading can be a little bit tricky to optimize, and it requires examples of desired behavior. With preferences, pairwise preferences are really easy to provide. It doesn't require example goals or example demonstrations.","zh":"好的，关于奖励学习的总结。奖励不能被理所当然地认为。我们已经讨论过从目标中学习，也讨论过从人类偏好中学习。对于目标来说，这相当实用。对抗性交易可能有点难以优化，并且需要示例行为。对于偏好来说，成对偏好非常容易提供。它不需要示例目标或示例演示。","start":3823.16,"end":3849.37},{"id":313,"text":"It has been deployed at really, really large scales with language models. It may require some supervision in the loop of reinforcement learning. One of the things that I encourage everyone to think about is goals and human preferences. Those are some form of feedback, but there's a lot of other ways that we might be able to provide supervision to agents that are trying to learn.","zh":"它已经在语言模型中被部署在非常大的规模上。它可能需要在强化学习过程中进行一些监督。我鼓励大家思考的是目标和人类偏好。这些是某种形式的反馈，但还有许多其他方式可以为正在学习的智能体提供监督。","start":3850.33,"end":3875.86},{"id":314,"text":"You could even verbally tell it some information like, that was good, or that was helpful, or that was helpful but kind of mean, or something like that.","zh":"你甚至可以口头告诉它一些信息，比如，那很好，或者那很有帮助，或者那很有帮助但有点刻薄，或者其他类似的内容。","start":3876.56,"end":3885.1}],"notes":["本段主要讲解了奖励学习中的σ函数，即Sigmoid函数，它将输入值压缩到0到1之间。讲者提到σ函数是一个简单的函数，但记不清具体形式，认为它类似于一个S形曲线，且在某些情况下会使用σ函数。","讲者提到，除了使用人类反馈，还可以使用AI模型进行反馈。例如，可以询问一个强大的模型，某个选项是否更好。同时，指出在判断偏好和不偏好时，存在多种不同的维度，因此在某些情况下可以询问模型。","讲者举了一个使用AI反馈的例子，即防止模型生成有害内容。具体做法是将两个响应输入模型，并询问模型哪个响应更不有害。","讲者指出，批评通常比生成更容易，因此使用AI反馈可以得到更强的模型。已有研究表明，使用这种反馈可以提高模型在不同维度上的性能。","本段总结了奖励学习，指出奖励不能被默认。学习目标和人类偏好是两种主要方式。目标学习较为实用，但对抗性交易优化较为困难，需要示例行为。而偏好学习中，成对偏好更容易提供，不需要目标示例或演示。","讲者提到，奖励学习已在大规模语言模型中部署，可能需要在强化学习过程中进行监督。鼓励大家思考目标和人类偏好，但还有其他方式可以为学习代理提供监督，例如通过口头反馈。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3708.49,"end":3885.1,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3708.49,"text":"So you're asking what is the sigma function? Yeah, so the sigma function here, this is a sigmoid. So it is basically a function that squashes the values between 0 and 1. And so it's just a very simple function that I can't remember. I think it looks something like this, where this is 1. So yeah, I'm just using sigma."},{"start":3737.91,"text":"sigma right here. So just this function right here. Okay. One other thing you can do is instead of using human feedback, you could also have an AI model. You could ask a strong model, like, is this better than this? The one thing that I'll note is when you are thinking about what is preferred and dispreferred, there are a variety of different axes in which something might be preferred or dispreferred. And so you could, in some cases, you might be able to ask,"},{"start":3768.36,"text":"for certain things that you care about from the model. This is often referred to as reinforcement learning with AI feedback. As one example of a use case, people have used this to try to prevent models from producing harmful content. And so they will feed two responses into the model and ask the model which response is less harmful."},{"start":3795.36,"text":"One insight here is that critique is often easier than generation. And so this is one of the reasons why you might be able to get a stronger model with AI feedback than otherwise. And there have been some works that show that if you use this kind of feedback, this AI feedback, you can get an improvement in model performance on different axes."},{"start":3823.16,"text":"Okay, so a summary of reward learning. Rewards cannot be taken for granted. We've talked about learning from goals. We talked about learning from human preferences. For goals, it's quite practical. Adversarial trading can be a little bit tricky to optimize, and it requires examples of desired behavior. With preferences, pairwise preferences are really easy to provide. It doesn't require example goals or example demonstrations."},{"start":3850.33,"text":"It has been deployed at really, really large scales with language models. It may require some supervision in the loop of reinforcement learning. One of the things that I encourage everyone to think about is goals and human preferences. Those are some form of feedback, but there's a lot of other ways that we might be able to provide supervision to agents that are trying to learn."},{"start":3876.56,"text":"You could even verbally tell it some information like, that was good, or that was helpful, or that was helpful but kind of mean, or something like that."}],"speech_gaps":[],"frame":"../frames/v035/023.webp","frame_time":3720.49},{"title":"奖励学习中的自主目标设定","segments":[{"id":315,"text":"And you could think of other ways of providing supervision, and I think that this is an area of research where I think that there's more things that can be done.","zh":"你还可以想到其他提供监督的方式，我认为这是一块研究领域，还有更多事情可以去做。","start":3885.54,"end":3895.0},{"id":316,"text":"One other thing that I'll mention is there's also some cool work in the reinforcement learning research landscape","zh":"我想再提一点，就是在强化学习的研究领域中，也有一些很酷的工作","start":3895.58,"end":3902.84},{"id":317,"text":"where you can potentially have reinforcement learning agents propose their own goals","zh":"其中你有可能让强化学习代理提出自己的目标","start":3902.84,"end":3907.74},{"id":318,"text":"rather than having a human provide a goal.","zh":"而不是由人类提供目标。","start":3907.74,"end":3910.42},{"id":319,"text":"This is often referred to as this area of unsupervised reinforcement learning,","zh":"这通常被称为无监督强化学习的领域，","start":3911.22,"end":3916.38},{"id":320,"text":"where a human is not telling the agent what it should do.","zh":"其中人类不会告诉代理它应该做什么。","start":3916.5,"end":3919.58},{"id":321,"text":"Instead, the agent should have its own sort of curiosity.","zh":"相反，代理应该有自己的好奇心。","start":3919.62,"end":3922.16},{"id":322,"text":"One example of this is you can have one agent setting a goal, another agent trying to reach","zh":"一个例子是你可以让一个代理设定目标，另一个代理尝试达到","start":3924.02,"end":3929.3},{"id":323,"text":"the goal, and you can formulate this as a game between these two different agents.","zh":"目标，你可以将此表述为这两个不同智能体之间的博弈。","start":3929.3,"end":3933.48},{"id":324,"text":"And there's some cool work that shows that you can have that if you have these two different agents","zh":"有一些很酷的研究表明，如果你拥有这两个不同的智能体，","start":3938.18,"end":3943.78},{"id":325,"text":"that are trying to play against each other where one is the goal setter, one is trying to reach","zh":"它们彼此对抗，其中一个负责设定目标，另一个负责达成目标，","start":3944.3,"end":3948.5},{"id":326,"text":"the goals, you can get some kind of cool behavior as a result.","zh":"你能够得到一些很酷的行为结果。","start":3948.5,"end":3952.18}],"notes":["本段讲授了强化学习中自主目标设定的概念，即智能体可以自行设定目标，而不是由人类提供目标。这种设定通常被称为无监督强化学习，强调智能体的内在好奇心。","讲者提到，这种自主目标设定可以通过两个智能体之间的博弈来实现：一个智能体设定目标，另一个智能体尝试达成目标。这种博弈机制可以产生有趣的行为。","讲者指出，这种机制在强化学习研究领域中已有相关工作，表明通过两个智能体之间的对抗，可以实现目标设定和达成的动态过程。","讲者强调，这种自主目标设定是奖励学习的一个重要方向，它减少了对人类监督的依赖，同时激发了智能体的探索行为。","讲者提到，这种机制可以产生一些有趣的智能体行为，但具体实现细节和效果可能需要进一步研究。","讲者没有明确说明这种博弈机制的具体数学模型或公式，因此无法进一步推导相关公式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3885.54,"end":3952.18,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":3885.54,"text":"And you could think of other ways of providing supervision, and I think that this is an area of research where I think that there's more things that can be done."},{"start":3895.58,"text":"One other thing that I'll mention is there's also some cool work in the reinforcement learning research landscape"},{"start":3902.84,"text":"where you can potentially have reinforcement learning agents propose their own goals"},{"start":3907.74,"text":"rather than having a human provide a goal."},{"start":3911.22,"text":"This is often referred to as this area of unsupervised reinforcement learning,"},{"start":3916.5,"text":"where a human is not telling the agent what it should do."},{"start":3919.62,"text":"Instead, the agent should have its own sort of curiosity."},{"start":3924.02,"text":"One example of this is you can have one agent setting a goal, another agent trying to reach"},{"start":3929.3,"text":"the goal, and you can formulate this as a game between these two different agents."},{"start":3938.18,"text":"And there's some cool work that shows that you can have that if you have these two different agents"},{"start":3944.3,"text":"that are trying to play against each other where one is the goal setter, one is trying to reach"},{"start":3948.5,"text":"the goals, you can get some kind of cool behavior as a result."}],"speech_gaps":[{"start":3934.256,"end":3937.78}],"frame":"../frames/v035/024.webp","frame_time":3897.54}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v035.mp4"}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
