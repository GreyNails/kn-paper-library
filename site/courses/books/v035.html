padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 8 奖励学习（Reward Learning） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v035.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v035","title":"Lecture 8 奖励学习（Reward Learning）","course":"强化学习","pages":[{"title":"奖励学习（Reward Learning）","segments":[{"id":0,"text":"Let's get started. Great. So for today, we're planning to finish offline reinforcement learning. And along the reward learning front, the key goals today are to figure out why is task specification hard? Why do naive methods for trying to specify rewards fail? And what are some methods for learning reward functions from human supervision? Cool. So to start off with finishing offline reinforcement learning,","zh":"我们开始吧。很好。今天我们的计划是完成离线强化学习。在奖励学习方面，今天的关键目标是弄清楚为什么任务指定很难？为什么尝试指定奖励的朴素方法会失败？以及有哪些方法可以从人类监督中学习奖励函数？很好。首先，我们来完成离线强化学习，","start":5.71,"end":35.39},{"id":1,"text":"We talked about this problem on Wednesday where our goal is to learn a policy from a batch of existing data without any online data collection. And we assume that the batch of offline data is collected by some unknown policy that we refer to as the behavior policy or pi beta. And our goal is to maximize rewards under pi theta. And so we have this challenge of a distribution shift between this.","zh":"我们在周三讨论过这个问题，我们的目标是从一批现有的数据中学习策略，而没有任何在线数据收集。我们假设这批离线数据是由某个未知策略收集的，我们称之为行为策略或πβ。我们的目标是在πθ下最大化奖励。因此，我们面临的是这种分布转移的挑战。","start":35.87,"end":63.95},{"id":2,"text":"One of the challenges that comes up if you try to use traditional reinforcement learning algorithms in this setting is that if, for example, you're trying to optimize a Q function to then improve your policy, then you might query your Q function on actions that were sampled from your learned policy, and those actions might not be covered in the data.","zh":"如果你尝试在这样的设置中使用传统的强化学习算法，会遇到的一个挑战是，例如，如果你试图优化一个Q函数以改进你的策略，那么你可能会查询你的Q函数在从学习策略中采样的动作上，而这些动作可能并未包含在数据中。","start":64.46,"end":91.02},{"id":3,"text":"And that can cause overestimation, and it can cause your Q function to be inaccurate. We talked about this picture where if we had randomly initialized some Q function and the data only covers actions along this range for this given state, then when we try to actually learn a policy that optimizes the Q function, then it will start to query actions that are over here because they randomly have a higher Q value.","zh":"这会导致高估，也会导致你的Q函数不准确。我们讨论过这张图，如果我们随机初始化了一些Q函数，而数据仅覆盖了该状态下的这个范围内的动作，那么当我们尝试学习一个优化Q函数的策略时，它会开始查询这里动作，因为它们随机具有更高的Q值。","start":91.52,"end":118.56},{"id":4,"text":"And that's one of the key challenges in offline RL. Now, we talked about one algorithm that... Well, I talked about a couple algorithms, but the main algorithm that we talked about last time was this IQL algorithm. And IQL addresses the offline RL problem by actually avoiding any sort of queries, any sort of function queries beyond the dataset actions altogether. And it did this by...","zh":"这是离线强化学习中的一个关键挑战。我们讨论过一种算法……好吧，我讨论过几种算法，但我们上次主要讨论的是这个IQL算法。IQL通过完全避免任何查询，任何超出数据集动作范围的函数查询来解决离线强化学习问题。它通过……","start":120.05,"end":147.57},{"id":5,"text":"And it did this by... by actually just learning a value function and a Q function using the states and actions in the data. Now, if you just do that with the normal updates, then you'll learn V pi and Q pi for the behavior policy. So you'll learn a value function for the behavior policy, and that won't allow you to improve very much over the behavior policy.","zh":"并且它通过……通过实际地利用数据中的状态和动作来学习一个价值函数和一个Q函数。现在，如果你只是用普通的更新方法来做这件事，那么你将学习到行为策略的V pi和Q pi。因此，你将学习到行为策略的价值函数，而这将不会让你在行为策略上做出很大的改进。","start":149.13,"end":170.69},{"id":6,"text":"And so instead, when learning the value function, it uses asymmetric loss to try to learn a value function for a policy that's better than the behavior policy.","zh":"因此，当学习价值函数时，它使用不对称损失函数，试图学习一个比行为策略更好的策略的价值函数。","start":171.82,"end":183.42}],"notes":["本段讨论了离线强化学习中的一个关键挑战，即分布偏移（distribution shift）。当使用传统强化学习算法时，如果尝试优化Q函数以改进策略，可能会查询在数据中未覆盖的动作，从而导致Q函数的高估和不准确。","讲者提到，如果Q函数在数据中未覆盖的动作上被查询，可能会导致Q函数的不准确。例如，如果Q函数被随机初始化，并且数据仅覆盖某个状态下的某些动作范围，那么当学习策略以优化Q函数时，可能会查询那些在该状态中未被覆盖的动作，因为它们的Q值较高。","讲者介绍了IQL算法，该算法通过避免任何超出数据集动作范围的查询来解决离线强化学习问题。IQL通过仅使用数据中的状态和动作来学习价值函数和Q函数。","如果仅使用正常更新来学习价值函数和Q函数，那么会学习到行为策略（behavior policy）的价值函数和Q函数，这将无法显著改进行为策略。","为了解决这一问题，IQL在学习价值函数时使用了不对称损失（asymmetric loss），以学习一个比行为策略更好的策略的价值函数。","这些内容强调了离线强化学习中的分布偏移问题，以及IQL算法如何通过避免超出数据范围的查询来解决这一问题。"],"formulas":[{"latex":"Q^\\pi(s, a)","symbols":"Q函数，表示在状态s下采取动作a时的预期回报","explanation":"公式正确，Q函数的定义符合强化学习标准表示，无需修改。","evidence":"prior policy that collected the data, and the policy that we're optimizing. One of the challenges that comes up if you try to use traditional reinforcement learning algorithms in this setting is that if, for example, you're trying to optimize a Q function to then improve your policy, then you might query your Q function on actions that were sampled from your learned policy, and those actions might not be covered in the data."},{"latex":"V^\\pi(s)","symbols":"价值函数，表示在状态s下遵循策略\\pi的预期回报","explanation":"公式正确，价值函数的定义符合强化学习标准表示，无需修改。","evidence":"by actually just learning a value function and a Q function using the states and actions in the data. Now, if you just do that with the normal updates, then you'll learn V pi and Q pi for the behavior policy. So you'll learn a value function for the behavior policy, and that won't allow you to improve very much over the behavior policy."},{"latex":"V^\\pi_{\\text{behavior}}(s)","symbols":"行为策略的价值函数，表示在状态s下遵循行为策略的预期回报","explanation":"公式正确，行为策略的价值函数的定义符合强化学习标准表示，无需修改。","evidence":"by actually just learning a value function and a Q function using the states and actions in the data. Now, if you just do that with the normal updates, then you'll learn V pi and Q pi for the behavior policy. So you'll learn a value function for the behavior policy, and that won't allow you to improve very much over the behavior policy."}],"uncertainties":[],"diagram":"none","start":5.71,"end":183.42,"asr_flags":[],"math_clarifications":["所有公式均符合强化学习的标准表示，无需进一步修改。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.71,"text":"Let's get started. Great. So for today, we're planning to finish offline reinforcement learning. And along the reward learning front, the key goals today are to figure out why is task specification hard? Why do naive methods for trying to specify rewards fail? And what are some methods for learning reward functions from human supervision? Cool. So to start off with finishing offline reinforcement learning,"},{"start":35.87,"text":"We talked about this problem on Wednesday where our goal is to learn a policy from a batch of existing data without any online data collection. And we assume that the batch of offline data is collected by some unknown policy that we refer to as the behavior policy or pi beta. And our goal is to maximize rewards under pi theta. And so we have this challenge of a distribution shift between this."},{"start":64.46,"text":"prior policy that collected the data, and the policy that we're optimizing. One of the challenges that comes up if you try to use traditional reinforcement learning algorithms in this setting is that if, for example, you're trying to optimize a Q function to then improve your policy, then you might query your Q function on actions that were sampled from your learned policy, and those actions might not be covered in the data."},{"start":91.52,"text":"And that can cause overestimation, and it can cause your Q function to be inaccurate. We talked about this picture where if we had randomly initialized some Q function and the data only covers actions along this range for this given state, then when we try to actually learn a policy that optimizes the Q function, then it will start to query actions that are over here because they randomly have a higher Q value."},{"start":120.05,"text":"And that's one of the key challenges in offline RL. Now, we talked about one algorithm that... Well, I talked about a couple algorithms, but the main algorithm that we talked about last time was this IQL algorithm. And IQL addresses the offline RL problem by actually avoiding any sort of queries, any sort of function queries beyond the dataset actions altogether. And it did this by..."},{"start":149.13,"text":"by actually just learning a value function and a Q function using the states and actions in the data. Now, if you just do that with the normal updates, then you'll learn V pi and Q pi for the behavior policy. So you'll learn a value function for the behavior policy, and that won't allow you to improve very much over the behavior policy."},{"start":171.82,"text":"And so instead, when learning the value function, it uses asymmetric loss to try to learn a value function for a policy that's better than the behavior policy."}],"speech_gaps":[],"frame":"../frames/v035/001.webp","frame_time":17.71},{"title":"奖励学习中的不对称损失函数","segments":[{"id":7,"text":"And then it learns both a value function and a Q function. For the Q function, it uses a standard L2 loss. One thing I didn't quite go over with regard to IQL is why use an asymmetric loss for the value function but not for the Q function. And one way to think about that is","zh":"然后它同时学习一个价值函数和一个Q函数。对于Q函数，它使用标准的L2损失。关于IQL的一个问题我没有详细讲解，就是为什么对价值函数使用不对称损失，而对Q函数却不这样做。一种思考方式是","start":184.33,"end":202.01},{"id":8,"text":"You can think about when you're taking actions, when you're kind of rolling out a policy, there's two sources of variability. One is the different actions that you might take, and one is given an action, the state that you end up in. And if you think about, for example, the Q function after taking an action, and separately the value function of the state that comes after that,","zh":"当你在采取行动时，当你在执行一个策略时，存在两种变量来源。一种是你可能采取的不同动作，另一种是给定一个动作后，你最终所处的状态。例如，考虑在采取一个动作后得到的Q函数，以及该动作后所处状态的价值函数，","start":203.05,"end":229.93},{"id":9,"text":"these might be different.","zh":"这两者可能是不同的。","start":231.17,"end":232.47},{"id":10,"text":"So because there's randomness in the environment,","zh":"由于环境中存在随机性，","start":232.67,"end":236.07},{"id":11,"text":"the value function for the next state,","zh":"下一个状态的价值函数","start":236.29,"end":237.91},{"id":12,"text":"got somewhat unlucky in terms of the next state.","zh":"在某种程度上运气不佳，导致下一个状态的值较低。","start":238.55,"end":241.31},{"id":13,"text":"And it might be less than the Q function","zh":"它可能小于Q函数","start":241.31,"end":243.17},{"id":14,"text":"And it might be less than the Q function","zh":"它可能小于Q函数","start":243.29,"end":247.17},{"id":15,"text":"after taking this action.","zh":"在采取这个动作之后。","start":247.17,"end":248.59},{"id":16,"text":"And likewise, for these other states and actions,","zh":"同样地，对于这些其他的状态和动作，","start":249.67,"end":253.45},{"id":17,"text":"you might have some variability.","zh":"你可能会有一些变化性。","start":254.03,"end":255.31},{"id":18,"text":"So maybe Q of s, a2.","zh":"所以也许 Q of s, a2。","start":255.57,"end":259.97},{"id":19,"text":"A2, maybe that's equal to 5 because this is an action that's","zh":"A2，也许这个值等于 5，因为这个动作","start":259.97,"end":263.35},{"id":20,"text":"worse than A1.","zh":"比 A1 更差。","start":263.35,"end":264.53},{"id":21,"text":"Whereas perhaps when you actually rolled out","zh":"而当你实际上在环境中执行 A2 时，后续的状态","start":266.99,"end":269.21},{"id":22,"text":"A2 in the environment, the subsequent state","zh":"在环境中A2，后续的状态","start":269.21,"end":272.21},{"id":23,"text":"after taking that action has a true value of maybe","zh":"采取该动作后的实际值可能是","start":274.03,"end":279.65},{"id":24,"text":"a true value of 8.","zh":"一个实际值为8。","start":279.65,"end":280.47},{"id":25,"text":"Maybe you got lucky this time.","zh":"也许这次你运气不错。","start":280.53,"end":281.63},{"id":26,"text":"Maybe this action is really bad in that case.","zh":"也许在这种情况下，该动作真的非常糟糕。","start":282.57,"end":285.23},{"id":27,"text":"then Q hat S A3 maybe was a very risky action, so it has a Q value of negative 5. And then maybe","zh":"那么Q hat S A3可能是一个非常冒险的动作，因此其Q值为负5。然后可能","start":285.23,"end":296.57},{"id":28,"text":"when you actually took that risky action in the environment, maybe it wasn't quite as bad as what","zh":"当你实际上在环境中采取了这个冒险动作时，也许它并没有像","start":296.57,"end":301.07},{"id":29,"text":"could have happened. And so in that case, the value for that next state maybe is something like 0,","zh":"可能发生的情况那样糟糕。因此在这种情况下，下一个状态的值可能是0，","start":301.07,"end":308.95},{"id":30,"text":"because it didn't turn out as bad. And the reason why I'm writing out these different numbers is","zh":"因为它并没有那么糟糕。我写出这些不同数值的原因是","start":309.09,"end":313.71},{"id":31,"text":"is that we can think about the asymmetric loss function when","zh":"是我们可以考虑在学习IQL的价值时使用不对称损失函数。","start":313.71,"end":316.83},{"id":32,"text":"learning the value for IQL.","zh":"而在学习价值时的第一个损失函数是尝试回归到不同的Q值。","start":316.83,"end":318.25},{"id":33,"text":"And the first loss function when learning the value","zh":"并且当我们学习价值时，","start":318.91,"end":322.59},{"id":34,"text":"is trying to regress to the different Q values.","zh":"是试图回归到不同的Q值。","start":322.59,"end":325.41},{"id":35,"text":"And we could either learn the average Q value","zh":"我们可以学习平均Q值","start":325.63,"end":327.51},{"id":36,"text":"or try to lean towards the larger Q values.","zh":"或者尝试偏向较大的Q值。","start":328.11,"end":331.99},{"id":37,"text":"And if we lean towards the larger Q values,","zh":"如果我们偏向较大的Q值，","start":332.19,"end":334.11},{"id":38,"text":"that corresponds to actions that are better.","zh":"这对应于更好的动作。","start":334.27,"end":336.73},{"id":39,"text":"And so that corresponds to a policy that's better than the behavior policy. Whereas on the contrary, if we instead use an asymmetric loss function in the Q function, the targets for the Q function correspond to the next value. And if we use this L2 loss, we'll just be optimizing for the average value here.","zh":"因此，这对应于一个比行为策略更好的策略。相反，如果我们改用不对称的损失函数在Q函数中，那么Q函数的目标对应于下一个值。如果我们使用这种L2损失，我们只是在这里优化平均值。","start":337.45,"end":356.57}],"notes":["本段讨论了在IQL（内在强化学习）中使用不对称损失函数的原因。讲者指出，当执行动作时，存在两种随机性来源：动作的选择和执行动作后到达的状态。因此，Q函数和价值函数可能有不同的值，这导致了对价值函数使用不对称损失函数的必要性。"],"formulas":[],"uncertainties":["Q hat S A3 maybe was a very risky action, so it has a Q value of negative 5. And then maybe","when you actually took that risky action in the environment, maybe it wasn't quite as bad as what","could have happened. And so in that case, the value for that next state maybe is something like 0,"],"diagram":"none","start":184.33,"end":356.57,"asr_flags":[],"translation_complete":true,"translated_segments":33,"raw_segments":[{"start":184.33,"text":"And then it learns both a value function and a Q function. For the Q function, it uses a standard L2 loss. One thing I didn't quite go over with regard to IQL is why use an asymmetric loss for the value function but not for the Q function. And one way to think about that is"},{"start":203.05,"text":"You can think about when you're taking actions, when you're kind of rolling out a policy, there's two sources of variability. One is the different actions that you might take, and one is given an action, the state that you end up in. And if you think about, for example, the Q function after taking an action, and separately the value function of the state that comes after that,"},{"start":231.17,"text":"these might be different."},{"start":232.67,"text":"So because there's randomness in the environment,"},{"start":236.29,"text":"the value function for the next state,"},{"start":238.55,"text":"maybe it's something like 8, because maybe you"},{"start":241.31,"text":"got somewhat unlucky in terms of the next state."},{"start":243.29,"text":"And it might be less than the Q function"},{"start":247.17,"text":"after taking this action."},{"start":249.67,"text":"And likewise, for these other states and actions,"},{"start":254.03,"text":"you might have some variability."},{"start":255.57,"text":"So maybe Q of s, a2."},{"start":259.97,"text":"A2, maybe that's equal to 5 because this is an action that's"},{"start":263.35,"text":"worse than A1."},{"start":266.99,"text":"Whereas perhaps when you actually rolled out"},{"start":269.21,"text":"A2 in the environment, the subsequent state"},{"start":274.03,"text":"after taking that action has a true value of maybe"},{"start":279.65,"text":"a true value of 8."},{"start":280.53,"text":"Maybe you got lucky this time."},{"start":282.57,"text":"Maybe this action is really bad in that case."},{"start":285.23,"text":"then Q hat S A3 maybe was a very risky action, so it has a Q value of negative 5. And then maybe"},{"start":296.57,"text":"when you actually took that risky action in the environment, maybe it wasn't quite as bad as what"},{"start":301.07,"text":"could have happened. And so in that case, the value for that next state maybe is something like 0,"},{"start":309.09,"text":"because it didn't turn out as bad. And the reason why I'm writing out these different numbers is"},{"start":313.71,"text":"is that we can think about the asymmetric loss function when"},{"start":316.83,"text":"learning the value for IQL."},{"start":318.91,"text":"And the first loss function when learning the value"},{"start":322.59,"text":"is trying to regress to the different Q values."},{"start":325.63,"text":"And we could either learn the average Q value"},{"start":328.11,"text":"or try to lean towards the larger Q values."},{"start":332.19,"text":"And if we lean towards the larger Q values,"},{"start":334.27,"text":"that corresponds to actions that are better."},{"start":337.45,"text":"And so that corresponds to a policy that's better than the behavior policy. Whereas on the contrary, if we instead use an asymmetric loss function in the Q function, the targets for the Q function correspond to the next value. And if we use this L2 loss, we'll just be optimizing for the average value here."}],"speech_gaps":[],"frame":"../frames/v035/002.webp","frame_time":196.33},{"title":"奖励学习中的价值函数与Q函数学习","segments":[{"id":40,"text":"If we instead use an asymmetric loss, then we'd be trying to regress to the future state values that are higher,","zh":"如果我们使用一个不对称的损失函数，那么我们实际上是在尝试回归到更高的未来状态值，","start":357.21,"end":365.57},{"id":41,"text":"which would actually be optimizing for not a better policy, but a more lucky policy.","zh":"这实际上是在优化一个更幸运的策略，而不是一个更好的策略。","start":365.69,"end":370.93},{"id":42,"text":"And that's something that you can't control with your actions.","zh":"而这并不是你可以通过你的行动来控制的。","start":371.23,"end":374.59},{"id":43,"text":"Yeah, so in the IQL objective, we're actually training both a value function and a Q function.","zh":"是的，所以在IQL目标中，我们实际上是在同时训练一个价值函数和一个Q函数。","start":375.43,"end":380.55},{"id":44,"text":"And the reason for that is because we want to be finding, the goal is to fit v hat pi for a pi that is better than the behavior policy or better than the policy that underlies the data set.","zh":"我们这样做的原因是，我们的目标是拟合一个比行为策略或数据集所基于的策略更好的策略的v hat pi。","start":380.55,"end":399.95},{"id":45,"text":"that.","zh":"那个。","start":399.95,"end":400.07},{"id":46,"text":"And as we see here, if we do that","zh":"正如我们在这里看到的，如果我们这样做","start":401.97,"end":404.59},{"id":47,"text":"by regressing to these key values,","zh":"通过回归到这些关键值，","start":404.59,"end":407.01},{"id":48,"text":"then we will lean towards, instead of the average,","zh":"那么我们会倾向于，而不是平均值，","start":407.23,"end":411.75},{"id":49,"text":"lean towards the key values that correspond to better actions.","zh":"倾向于对应更好动作的关键值。","start":411.85,"end":414.25},{"id":50,"text":"And so that's learning a value function","zh":"因此这就是学习一个价值函数","start":414.55,"end":417.15},{"id":51,"text":"for a policy that's better.","zh":"对于一个更好的策略。","start":417.15,"end":418.23},{"id":52,"text":"This takes better actions than the behavior policy.","zh":"这个策略采取比行为策略更好的动作。","start":418.33,"end":420.09},{"id":53,"text":"Now, we can't just use, it's useful to have a key function","zh":"现在，我们不能仅仅使用，拥有一个关键函数","start":422.15,"end":425.55},{"id":54,"text":"and not just a value function, because the key function is","zh":"而不仅仅是价值函数是有用的，因为关键函数是","start":425.55,"end":428.05},{"id":55,"text":"is what helps us figure out which actions are better when","zh":"帮助我们判断哪些动作更好的东西。","start":428.05,"end":431.49},{"id":56,"text":"we use advantage weighted regression and so forth.","zh":"我们使用优势加权回归等方法。","start":431.49,"end":435.49},{"id":57,"text":"And so we also learn a Q function as well.","zh":"我们同时也学习一个Q函数。","start":435.73,"end":438.21},{"id":58,"text":"But for that, we use a symmetric loss","zh":"但为了做到这一点，我们使用对称损失函数","start":438.45,"end":440.11},{"id":59,"text":"so that we're not optimizing for being lucky.","zh":"以确保我们不是在优化幸运性。","start":440.11,"end":442.67},{"id":60,"text":"OK.","zh":"好的。","start":443.77,"end":443.97},{"id":61,"text":"So IQL was one way to learn a policy from an offline data","zh":"IQL 是一种从离线数据集中学习策略的方法。","start":445.85,"end":449.99},{"id":62,"text":"set.","zh":"数据集。","start":449.99,"end":450.23},{"id":63,"text":"There's also some other ways to do it.","zh":"还有其他一些方法可以做到这一点。","start":452.27,"end":454.55},{"id":64,"text":"And in particular, we'll talk about one more way, one more","zh":"特别是，我们将讨论另一种方法，另一种","start":454.61,"end":457.31},{"id":65,"text":"our algorithm.","zh":"我们的算法。","start":457.31,"end":457.71},{"id":66,"text":"And in this case, we're still going","zh":"在这种情况下，我们仍然会尝试估计价值。","start":458.91,"end":460.75},{"id":67,"text":"to try to estimate the value.","zh":"我们仍然会从我们的策略中实际查询动作。","start":460.75,"end":462.33},{"id":68,"text":"We're still going to actually query actions from our policy.","zh":"我们想考虑如何抑制高估","start":462.79,"end":465.69},{"id":69,"text":"And we want to think about how to discourage overestimation","zh":"并抑制强化学习算法采取你","start":467.57,"end":470.39},{"id":70,"text":"and discourage the RL algorithm from taking actions that you","zh":"认为可能具有高Q值的动作，因为它们的","start":470.39,"end":476.39},{"id":71,"text":"think might have high Q value because they're","zh":"可能具有高Q值，因为它们是","start":476.39,"end":479.51},{"id":72,"text":"out of distribution.","zh":"超出分布。","start":479.51,"end":479.83},{"id":73,"text":"And so one idea is, what if we just, outside of the data support, try to minimize the key values? Can we just basically take this part and try to push down on the key values that are out of distribution? And if we did that, then we would be kind of pessimistic or conservative with regard to everything that's out of distribution, and not as conservative when we're actually in the support of the data.","zh":"因此，一个想法是，如果我们只是在数据支持范围之外，尝试最小化关键值？我们是否可以基本上将这一部分拿出来，尝试压低那些超出分布的关键值？如果我们这样做，那么我们对于所有超出分布的内容都会比较悲观或保守，而在实际处于数据支持范围内时则不会那么保守。","start":481.53,"end":510.05}],"notes":["在IQL中，使用对称损失函数是为了避免优化幸运策略，即避免因数据分布外的高Q值而采取不合理的动作。这种做法使得模型在数据支持范围内更保守，而在分布外则更加悲观。","课程中提到，除了IQL之外，还有其他方法可以用于从离线数据集中学习策略。其中一种方法是通过查询策略中的动作，并考虑如何抑制过估计，避免在分布外采取高Q值的动作。","在分布外的区域，模型会尝试最小化关键值，从而表现出悲观或保守的态度。而在数据支持的区域，模型则不会那么保守，这有助于在实际应用中更稳健地进行决策。","课程强调了在强化学习中，如何通过设计损失函数和回归方法，来避免因数据分布外的高Q值而做出不合理的决策，从而提升策略的鲁棒性。","通过使用对称损失函数和关键函数，模型能够在保持策略性能的同时，避免因数据分布外的高Q值而采取不合理的动作，从而实现更安全和有效的策略学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":357.21,"end":510.05,"asr_flags":[72],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":357.21,"text":"If we instead use an asymmetric loss, then we'd be trying to regress to the future state values that are higher,"},{"start":365.69,"text":"which would actually be optimizing for not a better policy, but a more lucky policy."},{"start":371.23,"text":"And that's something that you can't control with your actions."},{"start":375.43,"text":"Yeah, so in the IQL objective, we're actually training both a value function and a Q function."},{"start":380.55,"text":"And the reason for that is because we want to be finding, the goal is to fit v hat pi for a pi that is better than the behavior policy or better than the policy that underlies the data set."},{"start":399.95,"text":"that."},{"start":401.97,"text":"And as we see here, if we do that"},{"start":404.59,"text":"by regressing to these key values,"},{"start":407.23,"text":"then we will lean towards, instead of the average,"},{"start":411.85,"text":"lean towards the key values that correspond to better actions."},{"start":414.55,"text":"And so that's learning a value function"},{"start":417.15,"text":"for a policy that's better."},{"start":418.33,"text":"This takes better actions than the behavior policy."},{"start":422.15,"text":"Now, we can't just use, it's useful to have a key function"},{"start":425.55,"text":"and not just a value function, because the key function is"},{"start":428.05,"text":"is what helps us figure out which actions are better when"},{"start":431.49,"text":"we use advantage weighted regression and so forth."},{"start":435.73,"text":"And so we also learn a Q function as well."},{"start":438.45,"text":"But for that, we use a symmetric loss"},{"start":440.11,"text":"so that we're not optimizing for being lucky."},{"start":443.77,"text":"OK."},{"start":445.85,"text":"So IQL was one way to learn a policy from an offline data"},{"start":449.99,"text":"set."},{"start":452.27,"text":"There's also some other ways to do it."},{"start":454.61,"text":"And in particular, we'll talk about one more way, one more"},{"start":457.31,"text":"our algorithm."},{"start":458.91,"text":"And in this case, we're still going"},{"start":460.75,"text":"to try to estimate the value."},{"start":462.79,"text":"We're still going to actually query actions from our policy."},{"start":467.57,"text":"And we want to think about how to discourage overestimation"},{"start":470.39,"text":"and discourage the RL algorithm from taking actions that you"},{"start":476.39,"text":"think might have high Q value because they're"},{"start":479.51,"text":"out of distribution."},{"start":481.53,"text":"And so one idea is, what if we just, outside of the data support, try to minimize the key values? Can we just basically take this part and try to push down on the key values that are out of distribution? And if we did that, then we would be kind of pessimistic or conservative with regard to everything that's out of distribution, and not as conservative when we're actually in the support of the data."}],"speech_gaps":[],"frame":"../frames/v035/003.webp","frame_time":369.21},{"title":"奖励学习中的损失函数设计","segments":[{"id":74,"text":"We could formulate some loss function that does this. And what this would look like is you're trying to fit a Q function. And you will have your standard loss for your critic, for your value function. I'll call this L critic. Then we could also add a loss function.","zh":"我们可以设计一个损失函数来实现这一点。具体来说，你是在尝试拟合一个Q函数。你将拥有用于批评者（critic）和价值函数的标准损失函数，我称之为L critic。然后我们还可以添加一个损失函数。","start":513.23,"end":540.3},{"id":75,"text":"We're trying to fit a Q function, so maybe that Q function has parameters 5. Then we could add an additional term that is trying to additionally minimize the key values on actions that are out of distribution. So we would try to be minimizing our key values. And in particular, we want to minimize key values for out-of-distribution actions.","zh":"我们正在尝试拟合一个Q函数，因此这个Q函数可能有参数5。然后我们可以添加一个额外的项，旨在进一步最小化那些不在分布中的动作的关键值。我们将尝试最小化我们的关键值。特别是，我们希望最小化那些不在分布中的动作的关键值。","start":541.64,"end":571.58},{"id":76,"text":"And so this would be an expectation over states sampled from your data set and actions sampled from some other distribution that's not the data set. And ideally, this distribution would cover the added distribution actions that your policy might be considering. This is some other distribution. That distribution would probably be a function of s.","zh":"因此，这将是针对从你的数据集中采样的状态和从某个其他分布（不是数据集）中采样的动作的期望值。理想情况下，这个分布应覆盖你的策略可能考虑的额外分布动作。这是一个其他分布。该分布可能是一个关于s的函数。","start":572.27,"end":604.38},{"id":77,"text":"Now, if you want to think about which out-of-distribution actions your policy might be considering,","zh":"现在，如果你想要考虑你的策略可能考虑的哪些不在分布中的动作，","start":606.69,"end":611.69},{"id":78,"text":"your policy is going to be considering the out-of-distribution actions that have high Q value.","zh":"你的策略将考虑具有高Q值的不在分布中的动作。","start":611.95,"end":617.21},{"id":79,"text":"And so one kind of initial version that we could do here is we could pick a mu,","zh":"因此，我们可以在这里进行的一种初始版本是选择一个mu，","start":617.83,"end":627.55},{"id":80,"text":"pick this distribution such that it has high Q values,","zh":"选择这个分布使得它具有高Q值，","start":627.69,"end":632.41},{"id":81,"text":"because our policy will be trying to take actions that have high Q values.","zh":"因为我们的策略将尝试采取具有高Q值的动作。","start":632.63,"end":635.85},{"id":82,"text":"And so what this would look like is minimizing our critic parameters","zh":"因此，这看起来就像是在最小化我们的批评者参数","start":636.69,"end":642.39},{"id":83,"text":"and choosing a mu such that it's maximizing the key values.","zh":"并选择一个 mu，使得它最大化关键值","start":645.09,"end":651.91},{"id":84,"text":"So what this will do is it will try to optimize a critic","zh":"因此，这将尝试优化一个批评者","start":653.17,"end":655.91},{"id":85,"text":"and then minimize the key values for actions that have high key values.","zh":"然后最小化那些具有高关键值的动作的关键值","start":655.91,"end":664.33},{"id":86,"text":"Now, this is version one. We're going to be pushing down on large Q values. You can show","zh":"现在，这是第一版。我们将对大的 Q 值施加压力。你可以展示","start":666.15,"end":673.87},{"id":87,"text":"with this version that if you have a large enough alpha, you don't necessarily want to have some","zh":"在这一版本中，如果你有一个足够大的 alpha，你不一定想要在主观上加权","start":673.87,"end":682.75},{"id":88,"text":"sort of weight on the subjective. This is going to be a hyperparameter. If you have a large enough","zh":"这将是一个超参数。如果你有一个足够大的 alpha，你可以展示从这一方法学习到的批评者将是一个下界","start":682.75,"end":686.27},{"id":89,"text":"alpha, you can show that the critic that you learn from this is going to be a lower bound","zh":"alpha，你可以证明通过这种方法学习到的批评者（critic）将是一个下界","start":686.27,"end":691.09}],"notes":["本段讨论了在强化学习中设计损失函数以处理分布外动作（out-of-distribution actions）的问题。讲者提到，可以通过添加额外的损失项来最小化这些分布外动作的关键值（key values），从而优化Q函数。这种设计的目标是让策略在考虑分布外动作时，能够更有效地调整其行为。","讲者指出，这种额外的损失项是通过对状态和动作进行采样来计算期望值，其中状态来自数据集，而动作来自另一个分布。理想情况下，这个分布应覆盖策略可能考虑的分布外动作。该分布可能与状态s有关，因此需要根据状态进行调整。","讲者进一步说明，策略倾向于选择具有高Q值的动作，因此在设计损失函数时，可以选取一个分布，使得该分布中的动作具有高Q值。这样，策略在选择动作时会更倾向于这些高Q值的动作。","讲者提到，这种设计会导致对大Q值的压制，即通过调整超参数alpha，可以控制对主观权重的影响。当alpha足够大时，学习到的critic将是一个下界，这表明损失函数的设计需要考虑超参数的选择。","讲者强调，这种损失函数的设计是版本一，即通过最小化关键值来优化critic，同时选择一个最大化关键值的分布。这种设计有助于策略在面对分布外动作时，能够更有效地调整其行为。","讲者最后指出，这种设计需要考虑超参数alpha的大小，以确保学习到的critic能够有效压制大Q值，从而避免策略过度依赖某些特定的动作。"],"formulas":[],"uncertainties":["parameters 5","sort of weight on the subjective"],"diagram":"none","start":513.23,"end":691.09,"asr_flags":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":513.23,"text":"We could formulate some loss function that does this. And what this would look like is you're trying to fit a Q function. And you will have your standard loss for your critic, for your value function. I'll call this L critic. Then we could also add a loss function."},{"start":541.64,"text":"We're trying to fit a Q function, so maybe that Q function has parameters 5. Then we could add an additional term that is trying to additionally minimize the key values on actions that are out of distribution. So we would try to be minimizing our key values. And in particular, we want to minimize key values for out-of-distribution actions."},{"start":572.27,"text":"And so this would be an expectation over states sampled from your data set and actions sampled from some other distribution that's not the data set. And ideally, this distribution would cover the added distribution actions that your policy might be considering. This is some other distribution. That distribution would probably be a function of s."},{"start":606.69,"text":"Now, if you want to think about which out-of-distribution actions your policy might be considering,"},{"start":611.95,"text":"your policy is going to be considering the out-of-distribution actions that have high Q value."},{"start":617.83,"text":"And so one kind of initial version that we could do here is we could pick a mu,"},{"start":627.69,"text":"pick this distribution such that it has high Q values,"},{"start":632.63,"text":"because our policy will be trying to take actions that have high Q values."},{"start":636.69,"text":"And so what this would look like is minimizing our critic parameters"},{"start":645.09,"text":"and choosing a mu such that it's maximizing the key values."},{"start":653.17,"text":"So what this will do is it will try to optimize a critic"},{"start":655.91,"text":"and then minimize the key values for actions that have high key values."},{"start":666.15,"text":"Now, this is version one. We're going to be pushing down on large Q values. You can show"},{"start":673.87,"text":"with this version that if you have a large enough alpha, you don't necessarily want to have some"},{"start":682.75,"text":"sort of weight on the subjective. This is going to be a hyperparameter. If you have a large enough"},{"start":686.27,"text":"alpha, you can show that the critic that you learn from this is going to be a lower bound"}],"speech_gaps":[],"frame":"../frames/v035/004.webp","frame_time":525.23},{"title":"奖励学习中的Q函数优化与泛化","segments":[{"id":90,"text":"on the true Q function. And so then what this would look like is if you have some kind of plot","zh":"在真实的Q函数上。因此，这看起来会是如果你有一些不同动作的Q函数的图示","start":691.09,"end":704.25},{"id":91,"text":"of your Q functions for a different action, and if your data support is maybe something like this,","zh":"你的Q函数的图示，而你的数据支持可能像这样，","start":704.25,"end":710.85},{"id":92,"text":"something that you might learn is kind of a lower bound on the true Q function,","zh":"你可能会学到的是真实Q函数的一个下界，","start":711.01,"end":716.91},{"id":93,"text":"where this latter one is going to be Q-hop.","zh":"其中后者将是Q-hop。","start":716.91,"end":719.95},{"id":94,"text":"Now, one downside with this is that you might be a little bit too pessimistic.","zh":"现在，这种方法的一个缺点是你可能会过于悲观。","start":724.11,"end":730.91},{"id":95,"text":"Because this is actually going to be pushing down on all key values. But we know that for the key values for the actions in the data set, for the part that's in the support of our data set, these actions we have more data for. And so we don't necessarily want to be pushing down on the key values for those actions. And so what we could do is we could add a term that basically cancels out this term for the data sets and the actions.","zh":"因为这实际上会压低所有关键值。但我们知道，对于数据集中动作的关键值，对于数据支持部分的动作，我们有更多的数据。因此，我们并不一定想要压低这些动作的关键值。因此，我们可以添加一个项，基本上抵消这个项在数据集和动作上的影响。","start":731.47,"end":761.19},{"id":96,"text":"And so what that would look like is simply taking this same exact term and subtracting it for states in the data set, but also actions in the data set. So we're going to be minimizing the key values for actions from this distribution and maximizing for actions in the data set. And this will hopefully, kind of the goal of this,","zh":"因此，这看起来就是简单地取这个相同的项，并在数据集中的状态和动作上减去它。因此，我们将最小化来自这个分布的动作的关键值，并最大化数据集中的动作的关键值。这将有望实现这个目标，","start":761.93,"end":790.99},{"id":97,"text":"would be to get a Q function that inside the support of the data is not a very good marker,","zh":"在数据支持内部的Q函数不是一个很好的标记。","start":791.6,"end":798.0},{"id":98,"text":"that's inside the support of the data, is maybe very accurate, and then for the things outside","zh":"那些在数据支持集内部的部分，可能是非常准确的，而对于支持集之外的部分","start":798.16,"end":803.3},{"id":99,"text":"the support of the data has low Q values because we know that outside the support of the data,","zh":"数据的支持集之外的部分会有较低的Q值，因为我们知道在数据支持集之外，","start":803.3,"end":808.56},{"id":100,"text":"we aren't going to be able to learn an accurate Q function. Yeah, so the question is, does this","zh":"我们将无法学习到一个准确的Q函数。是的，所以问题是，这","start":808.66,"end":813.06},{"id":101,"text":"affect your ability to generalize outside the support of the data? So certainly it does. It's","zh":"是否会影响你在数据支持集之外的泛化能力？当然会。它会导致你在数据支持集之外的基本态度更加悲观。","start":813.06,"end":819.32},{"id":102,"text":"going to cause you to be basically more pessimistic outside of the support of the data.","zh":"这个超参数alpha将控制你有多悲观，如果你认为你处于一个可能能够更好地泛化的领域，","start":819.32,"end":824.36},{"id":103,"text":"This hyperparameter alpha is going to control how pessimistic you are, and if you think","zh":"那么你可以选择一个更小的alpha值，这样你就会更多地使用原始的批评者目标函数","start":830.14,"end":834.3},{"id":104,"text":"that you're in a regime where you might be able to generalize better, then you could","zh":"来调整你的策略。","start":834.3,"end":837.02},{"id":105,"text":"choose an alpha that is smaller so that you're using more of the original critic objective","zh":"选择一个更小的alpha值，这样你就会更多地使用原始的批评家目标","start":837.02,"end":841.68},{"id":106,"text":"and less of this regularization term.","zh":"并且更少地使用这个正则化项。","start":842.22,"end":844.32},{"id":107,"text":"Yeah. The question is, should it be Q or Q hat? Right. So it should be Q hat phi. So this is","zh":"对的。问题是，应该用Q还是Q hat呢？对的，应该用Q hat phi。所以这是","start":846.06,"end":857.74},{"id":108,"text":"the Q function that we're learning right here. The notation on the side is slightly different.","zh":"我们现在正在学习的Q函数。边上的符号略有不同。","start":857.74,"end":865.04},{"id":109,"text":"Sorry for the difference there. So on the slides, we're treating Q as the thing that","zh":"对于这个差异，我表示抱歉。在幻灯片中，我们将Q视为","start":865.34,"end":869.86}],"notes":["本段讨论了在奖励学习中，如何通过调整Q函数来避免过于悲观的估计。讲者提到，当数据支持范围有限时，学习到的Q函数可能会低估真实Q函数的值，从而导致对某些动作的评估过于悲观。这种悲观性可能会影响模型在数据支持范围外的泛化能力。","讲者进一步提出了一种解决方案，即通过添加一个项来抵消这种悲观性，使得在数据支持范围内的动作评估更加准确，而在数据支持范围外的动作评估则保持较低的Q值。这种策略旨在平衡模型在数据支持范围内的准确性与在范围外的泛化能力。","讲者还提到，一个超参数α控制着模型的悲观程度。如果认为模型在数据支持范围外的泛化能力较强，可以选择较小的α值，以更多地依赖原始的批评者目标，减少正则化项的影响。","最后，讲者指出，应该使用Q hat phi来表示当前正在学习的Q函数，而不是直接使用Q。这种表示方式在符号上略有不同，但有助于区分不同的Q函数形式。","讲者还提到，这种调整可能会对模型在数据支持范围外的泛化能力产生影响，导致模型在这些区域更加悲观。因此，选择合适的α值对于平衡模型的性能至关重要。","讲者通过讨论Q函数的优化策略，强调了在奖励学习中如何处理数据支持范围内的准确性和范围外的泛化能力之间的权衡。这种权衡是设计有效奖励学习算法的关键因素之一。"],"formulas":[],"uncertainties":["Q-hop"],"diagram":"none","start":691.09,"end":869.86,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":691.09,"text":"on the true Q function. And so then what this would look like is if you have some kind of plot"},{"start":704.25,"text":"of your Q functions for a different action, and if your data support is maybe something like this,"},{"start":711.01,"text":"something that you might learn is kind of a lower bound on the true Q function,"},{"start":716.91,"text":"where this latter one is going to be Q-hop."},{"start":724.11,"text":"Now, one downside with this is that you might be a little bit too pessimistic."},{"start":731.47,"text":"Because this is actually going to be pushing down on all key values. But we know that for the key values for the actions in the data set, for the part that's in the support of our data set, these actions we have more data for. And so we don't necessarily want to be pushing down on the key values for those actions. And so what we could do is we could add a term that basically cancels out this term for the data sets and the actions."},{"start":761.93,"text":"And so what that would look like is simply taking this same exact term and subtracting it for states in the data set, but also actions in the data set. So we're going to be minimizing the key values for actions from this distribution and maximizing for actions in the data set. And this will hopefully, kind of the goal of this,"},{"start":791.6,"text":"would be to get a Q function that inside the support of the data is not a very good marker,"},{"start":798.16,"text":"that's inside the support of the data, is maybe very accurate, and then for the things outside"},{"start":803.3,"text":"the support of the data has low Q values because we know that outside the support of the data,"},{"start":808.66,"text":"we aren't going to be able to learn an accurate Q function. Yeah, so the question is, does this"},{"start":813.06,"text":"affect your ability to generalize outside the support of the data? So certainly it does. It's"},{"start":819.32,"text":"going to cause you to be basically more pessimistic outside of the support of the data."},{"start":830.14,"text":"This hyperparameter alpha is going to control how pessimistic you are, and if you think"},{"start":834.3,"text":"that you're in a regime where you might be able to generalize better, then you could"},{"start":837.02,"text":"choose an alpha that is smaller so that you're using more of the original critic objective"},{"start":842.22,"text":"and less of this regularization term."},{"start":846.06,"text":"Yeah. The question is, should it be Q or Q hat? Right. So it should be Q hat phi. So this is"},{"start":857.74,"text":"the Q function that we're learning right here. The notation on the side is slightly different."},{"start":865.34,"text":"Sorry for the difference there. So on the slides, we're treating Q as the thing that"}],"speech_gaps":[{"start":824.76,"end":826.576}],"frame":"../frames/v035/005.webp","frame_time":703.09},{"title":"奖励学习中的策略与分布关系","segments":[{"id":110,"text":"we're minimizing. And if we view it instead as minimizing these parameters, then this","zh":"我们正在最小化。如果我们将其视为最小化这些参数，那么这就是如何书写的。","start":869.86,"end":876.72},{"id":111,"text":"is how we would write it.","zh":"是的，问题是，mu是什么？它是这个位于支持域之外的假策略吗？你可以将mu视为……","start":876.72,"end":877.48},{"id":112,"text":"Yeah, so the question is, what is mu? Is it this fake policy that's outside the support? You can think of mu as...","zh":"某种程度上像一个策略，它实际上并不是我们要运行的策略，但它基本上会尝试寻找具有高关键值的动作。例如，如果你在这里，你会倾向于最小化那里的关键值。是的，它基本上是在尝试寻找内部或外部分布中的高关键值。一旦它进入分布内部，你就会用这个项来抵消。","start":878.24,"end":885.88},{"id":113,"text":"Sort of as a policy, it's not actually the policy that we're going to be running, but it's essentially going to be something that is trying to seek out the key values that have, the key values that, or the actions that have high key value. So that if, for example, you're over here, you would kind of minimize the key values there. And yeah, it's basically something that's trying to seek out large key values, either in or outside the distribution. Once it gets inside the distribution, you're then going to be canceling out with this term.","zh":"因此，你将得到一个在数据支持域内更准确的估计。问题是，它是否会清除支持域外的动作？是的，这就是它所做的。问题是，最大化mu在分布上意味着什么？基本上意味着我们要选择一个具有高Q值的mu。","start":888.06,"end":915.0},{"id":114,"text":"And so then you'll have a more accurate estimate inside the support of the data. The question is, does it mop out the queue for the actions outside the support? And yeah, that's basically what it's doing. Oh, the question is, what does it mean to maximize mu in terms of the distribution? It basically means that we're going to be picking a mu such that","zh":"实际上，我们稍后会看到，对于某些选择，我们不需要显式地表示mu，但我们会稍后讨论这一点。问题是，如果我们目标是最小化训练分布外的Q值，为什么不直接使用正常的行为克隆？","start":917.33,"end":935.19},{"id":115,"text":"that has high Q values. In practice, we'll actually see in a minute, we can actually not have to explicitly represent mu for some choices, but we'll talk about that in a second. The question is, if our goal is to minimize Q for things outside the training distribution, why not just do normal behavior coding?","zh":"这个算法的一个优点是，它有可能比行为克隆表现得更好。任何类型的强化学习方法都会利用奖励信息来学习一个具有高Q值的策略。因此，你可以使用这种方法来显著优于行为克隆。我们也在周三讨论过一种方法，它仅仅通过排序就可以比行为克隆表现得更好。通常，那些……","start":936.11,"end":953.59},{"id":116,"text":"So one of the things that's nice about this algorithm is it has the potential to do better than behavior cloning. So any sort of RL method will be leveraging the reward information to learn a policy that has high Q values. And so you can actually use this method to do considerably better than behavior cloning. And then we also talked on Wednesday about a method that can also do better by behavior cloning just by ranking things. Generally, methods that...","zh":"所以，这个算法的一个优点是它有可能比行为克隆表现得更好。因此，任何一种强化学习方法都会利用奖励信息来学习一个具有高Q值的策略。因此，你实际上可以使用这种方法在行为克隆的基础上表现得更好。我们在周三还讨论过一种方法，它仅仅通过排序就可以比行为克隆表现得更好。一般来说，那些……","start":955.98,"end":981.36},{"id":117,"text":"try to train the policy on only the actions in the distribution are generally a valid way to do offline rel. This is thinking about an alternative way to do it. Okay. So in terms of when we introduced this last term, we're actually no longer guaranteed to have a lower bound on the Q function for all states and actions, but we're actually guaranteed an expectation to have a lower bound for all the states in our data set.","zh":"尝试仅在分布中的动作上训练策略通常是进行离线强化学习的一种有效方法。这是在考虑一种替代方法。好的。就我们上一节课引入的这个术语而言，我们实际上不再保证对于所有状态和动作，Q函数都有一个下界，但我们实际上保证对于我们数据集中的所有状态，期望值会有下界。","start":981.69,"end":1011.5},{"id":118,"text":"I'm not going to go through the derivation for this, but it's a nice property to have that you will get some sort of lower bound on the true Q function. And it suggests that it's a reasonable objective to use.","zh":"我不会详细推导这个结论，但这是一个很好的性质，即你会得到某种对真实Q函数的下界。这也表明使用这个目标是一个合理的做法。","start":1012.22,"end":1032.13}],"notes":["本段讨论了奖励学习中策略μ的作用，它并不是实际运行的策略，而是用于寻找具有高关键值的动作。μ的目标是最大化关键值，这可能在分布内或分布外进行。当μ进入分布内时，它会与某些项相互抵消，从而在数据支持范围内提供更准确的估计。","课堂中提到，μ的选取是为了最大化Q值，这在实践中可能不需要显式表示μ。此外，讨论了为什么不能仅通过行为克隆来最小化分布外的Q值，而应使用更复杂的算法。","算法的一个优点是它可能比行为克隆表现更好，因为它利用了奖励信息来学习具有高Q值的策略。课堂还提到，通过排名的方法也可以实现更好的效果。","在讨论中，提到当仅在分布内的动作上训练策略时，这是一种有效的离线强化学习方法。但此时我们不再保证对所有状态和动作的Q函数有下界，但可以保证对数据集中所有状态的期望有下界。","最后，指出虽然不进行推导，但获得Q函数的下界是一个有价值的性质，表明这是一个合理的优化目标。","课堂强调了μ在奖励学习中的关键作用，以及如何通过优化μ来提升策略性能，同时讨论了不同方法在处理分布外动作时的局限性。"],"formulas":[],"uncertainties":["mop out the queue for the actions outside the support","offline rel"],"diagram":"none","start":869.86,"end":1032.13,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":869.86,"text":"we're minimizing. And if we view it instead as minimizing these parameters, then this"},{"start":876.72,"text":"is how we would write it."},{"start":878.24,"text":"Yeah, so the question is, what is mu? Is it this fake policy that's outside the support? You can think of mu as..."},{"start":888.06,"text":"Sort of as a policy, it's not actually the policy that we're going to be running, but it's essentially going to be something that is trying to seek out the key values that have, the key values that, or the actions that have high key value. So that if, for example, you're over here, you would kind of minimize the key values there. And yeah, it's basically something that's trying to seek out large key values, either in or outside the distribution. Once it gets inside the distribution, you're then going to be canceling out with this term."},{"start":917.33,"text":"And so then you'll have a more accurate estimate inside the support of the data. The question is, does it mop out the queue for the actions outside the support? And yeah, that's basically what it's doing. Oh, the question is, what does it mean to maximize mu in terms of the distribution? It basically means that we're going to be picking a mu such that"},{"start":936.11,"text":"that has high Q values. In practice, we'll actually see in a minute, we can actually not have to explicitly represent mu for some choices, but we'll talk about that in a second. The question is, if our goal is to minimize Q for things outside the training distribution, why not just do normal behavior coding?"},{"start":955.98,"text":"So one of the things that's nice about this algorithm is it has the potential to do better than behavior cloning. So any sort of RL method will be leveraging the reward information to learn a policy that has high Q values. And so you can actually use this method to do considerably better than behavior cloning. And then we also talked on Wednesday about a method that can also do better by behavior cloning just by ranking things. Generally, methods that..."},{"start":981.69,"text":"try to train the policy on only the actions in the distribution are generally a valid way to do offline rel. This is thinking about an alternative way to do it. Okay. So in terms of when we introduced this last term, we're actually no longer guaranteed to have a lower bound on the Q function for all states and actions, but we're actually guaranteed an expectation to have a lower bound for all the states in our data set."},{"start":1012.22,"text":"I'm not going to go through the derivation for this, but it's a nice property to have that you will get some sort of lower bound on the true Q function. And it suggests that it's a reasonable objective to use."}],"speech_gaps":[],"frame":"../frames/v035/006.webp","frame_time":881.86},{"title":"奖励学习中的保守Q学习与策略优化","segments":[{"id":119,"text":"If alpha is 0, it does not hold. Alpha does need to be large enough. I can't remember the exact conditions on alpha. But you could take a look at the CQL paper for the proof. Cool. So this is an algorithm called conservative Q-learning. In terms of the full algorithm, we will optimize this objective using our data set. And then we'll get a Q function as a result of this.","zh":"如果alpha是0，那么这个条件就不成立。alpha需要足够大。我不记得确切的alpha条件。但你可以查看CQL论文中的证明。好，所以这是一个叫做保守Q学习的算法。在完整的算法中，我们将使用我们的数据集来优化这个目标，然后通过这个过程得到一个Q函数。","start":1033.22,"end":1059.65},{"id":120,"text":"Then after we optimize our Q function, we can then update our policy and then repeat that process. If your actions are discrete, then you can just in some ways read out the actions by picking the actions that have maximum probability.","zh":"在我们优化完Q函数之后，我们可以更新我们的策略，然后重复这个过程。如果你的动作是离散的，那么你可以通过选择具有最大概率的动作来在某种程度上读取动作。","start":1062.67,"end":1085.74},{"id":121,"text":"If they're continuous, then you'll need to use some sort of update to optimize your policy. And you'll be wanting to optimize your policy such that you are picking actions that have high Q value. Cool. And then, so we talked about this new term. And in practice, if we had to construct this new term, that would be kind of annoying. And it would add a moving part to the algorithm.","zh":"如果它们是连续的，那么你需要使用某种更新方法来优化你的策略。你希望优化你的策略，使得你选择的动作具有较高的Q值。好，然后我们讨论了这个新术语。实际上，如果我们需要构造这个新术语，那会有点麻烦。它还会给算法增加一个动态的部分。","start":1087.12,"end":1115.05},{"id":122,"text":"So in terms of thinking what this mu should be, you want to pick a mu that is going to actually have high key values because that would allow it to push down kind of erroneously large key values.","zh":"在考虑这个mu应该是什么的时候，你希望选择一个能够具有高关键值的mu，因为这将允许它降低错误地较大的关键值。","start":1118.48,"end":1134.54},{"id":123,"text":"And when you apply it on things with small key values, it's not really going to have a meaningful effect.","zh":"当你将其应用于关键值较小的事物时，它实际上不会产生有意义的影响。","start":1134.84,"end":1138.96},{"id":124,"text":"effect, but you also don't want to be considering actions that are not just exactly the one","zh":"效果，但你也不希望考虑的不只是恰好具有最大Q值的那个动作","start":1138.96,"end":1150.42},{"id":125,"text":"largest Q value. And as written, this mu term might actually collapse to be very deterministic","zh":"。而按照目前的写法，这个mu项实际上可能会变得非常确定性","start":1151.2,"end":1157.78},{"id":126,"text":"and just pick the one action that has the largest Q value.","zh":"，并仅仅选择具有最大Q值的那个动作。","start":1157.78,"end":1161.5},{"id":127,"text":"And so you can think of, in this case, you can think of, instead of just maximizing mu,","zh":"因此，你可以这样想，在这种情况下，你不再只是最大化 mu，","start":1162.32,"end":1169.66},{"id":128,"text":"you can think of adding a regularizer to mu that encourages it to consider a broader set","zh":"而是可以将一个正则化项添加到 mu 中，鼓励其考虑更广泛的一组动作。","start":1169.76,"end":1176.66},{"id":129,"text":"of actions. And specifically, you can think of that as choosing a mu that's maximizing q,","zh":"具体来说，你可以将其视为选择一个最大化 Q 的 mu，","start":1176.66,"end":1182.64},{"id":130,"text":"Q, but also has some entropy to it.","zh":"同时该 mu 还具有一定的熵。","start":1182.64,"end":1187.12},{"id":131,"text":"And so if you view this as adding a regularizer,","zh":"因此，如果你将这视为添加一个正则化项，","start":1187.7,"end":1191.38},{"id":132,"text":"then you could choose a mu that has high entropy,","zh":"那么你可以选择一个熵较高的 mu，","start":1191.52,"end":1194.84},{"id":133,"text":"meaning that it is a broader distribution.","zh":"这意味着它是一个更广泛的分布。","start":1195.04,"end":1196.7},{"id":134,"text":"And it turns out that if you, for this equation,","zh":"事实上，如果你对这个方程进行处理，","start":1198.36,"end":1203.58},{"id":135,"text":"if you're trying to choose large Qs","zh":"如果你试图选择较大的Q值","start":1203.8,"end":1205.94},{"id":136,"text":"and choose a distribution that has wider, larger entropy,","zh":"并且选择一个具有更宽、更大熵分布","start":1205.94,"end":1210.98}],"notes":["本段讨论了保守Q学习算法中mu参数的选择问题。讲者指出，mu应选择具有高关键值的值，以防止错误地放大关键值。同时，mu不能过于确定性，否则会只选择具有最大Q值的动作。这表明在策略优化过程中，需要在选择高Q值动作和保持策略多样性之间取得平衡。","讲者提到，可以通过在mu中添加正则化项来鼓励策略考虑更广泛的动作集合。这类似于在最大化Q值的同时引入熵正则化，以保持策略的探索性。这种做法在强化学习中常见，用于防止策略过早收敛到局部最优。","在具体实现中，mu的选择需要权衡确定性和多样性。如果mu过于确定性，策略会变得过于保守，只选择最大Q值的动作；如果mu过于随机，策略可能无法有效利用高Q值的动作。因此，需要找到一个合适的平衡点。","讲者还提到，如果mu的熵较高，意味着它是一个更宽泛的分布，这有助于策略在不同动作之间进行探索。这种熵正则化方法在策略梯度算法中被广泛应用，以促进策略的探索能力。","在实际应用中，这种正则化项的引入可能会增加算法的复杂性，因为它需要在优化过程中同时考虑Q值和熵的平衡。这可能会影响算法的收敛速度和稳定性，需要在实现时仔细调整。","最后，讲者指出，选择具有较大熵的分布可以促进策略的多样性，从而避免策略过早收敛到单一动作。这种思想在强化学习中非常重要，因为它有助于提高策略的鲁棒性和适应性。"],"formulas":[],"uncertainties":["mu term might actually collapse to be very deterministic"],"diagram":"none","start":1033.22,"end":1210.98,"asr_flags":[],"math_clarifications":["所有公式均未被明确定义或出现在数学表达式中，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":1033.22,"text":"If alpha is 0, it does not hold. Alpha does need to be large enough. I can't remember the exact conditions on alpha. But you could take a look at the CQL paper for the proof. Cool. So this is an algorithm called conservative Q-learning. In terms of the full algorithm, we will optimize this objective using our data set. And then we'll get a Q function as a result of this."},{"start":1062.67,"text":"Then after we optimize our Q function, we can then update our policy and then repeat that process. If your actions are discrete, then you can just in some ways read out the actions by picking the actions that have maximum probability."},{"start":1087.12,"text":"If they're continuous, then you'll need to use some sort of update to optimize your policy. And you'll be wanting to optimize your policy such that you are picking actions that have high Q value. Cool. And then, so we talked about this new term. And in practice, if we had to construct this new term, that would be kind of annoying. And it would add a moving part to the algorithm."},{"start":1118.48,"text":"So in terms of thinking what this mu should be, you want to pick a mu that is going to actually have high key values because that would allow it to push down kind of erroneously large key values."},{"start":1134.84,"text":"And when you apply it on things with small key values, it's not really going to have a meaningful effect."},{"start":1138.96,"text":"effect, but you also don't want to be considering actions that are not just exactly the one"},{"start":1151.2,"text":"largest Q value. And as written, this mu term might actually collapse to be very deterministic"},{"start":1157.78,"text":"and just pick the one action that has the largest Q value."},{"start":1162.32,"text":"And so you can think of, in this case, you can think of, instead of just maximizing mu,"},{"start":1169.76,"text":"you can think of adding a regularizer to mu that encourages it to consider a broader set"},{"start":1176.66,"text":"of actions. And specifically, you can think of that as choosing a mu that's maximizing q,"},{"start":1182.64,"text":"Q, but also has some entropy to it."},{"start":1187.7,"text":"And so if you view this as adding a regularizer,"},{"start":1191.52,"text":"then you could choose a mu that has high entropy,"},{"start":1195.04,"text":"meaning that it is a broader distribution."},{"start":1198.36,"text":"And it turns out that if you, for this equation,"},{"start":1203.8,"text":"if you're trying to choose large Qs"},{"start":1205.94,"text":"and choose a distribution that has wider, larger entropy,"}],"speech_gaps":[],"frame":"../frames/v035/007.webp","frame_time":1045.22},{"title":"奖励学习中的优化目标与应用示例","segments":[{"id":137,"text":"then you could actually write down","zh":"那么你实际上可以写出","start":1210.98,"end":1213.38},{"id":138,"text":"You can write down what this looks like in closed form. And in particular, for kind of maximizing Q and maximizing entropy, you can show that the optimal mu is proportional to the exponentiated Q values. I won't go into the derivation for this. We possibly will post something on Ed after lecture if you're interested. And then this term turns out to simply come out to","zh":"你可以写出这个在闭式形式下的具体表达式。特别是对于最大化Q值和最大化熵的情况，你可以证明最优的mu与Q值的指数成正比。我不会详细推导这个过程。如果感兴趣的话，我们可能在课后在Ed上发布相关内容。然后这个项实际上会简化为","start":1215.41,"end":1239.81},{"id":139,"text":"a log sum X over your key values without having to construct an explicit mu. And so then the final objective is going to look something like the loss function for the critic plus the log sum X of Q of SA.","zh":"对你的关键值进行对数求和，而无需显式构造mu。因此，最终的目标函数看起来会像批评者的损失函数加上Q值的对数求和项。","start":1241.39,"end":1269.53},{"id":140,"text":"with an alpha term here, minus alpha times the expected key values for states and actions in your data set. And this means that you don't actually need to construct mu directly. This was the only term that depended on mu, and we just replaced this with this term right here.","zh":"这里包含一个alpha项，减去alpha乘以你在数据集中各个状态和动作的期望关键值。这意味着你实际上不需要显式构造mu。这是唯一依赖于mu的项，我们只是用这个项替换了它。","start":1270.8,"end":1297.82},{"id":141,"text":"Yeah. So if there's a continuous action space, then you'll want to sample test images. Okay. Cool. So for this algorithm called CQL or conservative Q-learning,","zh":"是的。如果存在连续动作空间，那么你想要采样测试图像。好的。那么对于这个叫做CQL或保守Q学习的算法，","start":1298.86,"end":1311.98},{"id":142,"text":"I figured I'd show one application of this, just as an example. We've seen a lot of applications in robotics and talked about driving and so forth. It turns out that some folks at LinkedIn use this algorithm to optimize a policy for sending notifications.","zh":"我想展示一个应用实例，作为例子。我们已经看到了很多在机器人学中的应用，并讨论了驾驶等场景。实际上，一些来自LinkedIn的人员使用这个算法来优化发送通知的策略。","start":1313.71,"end":1330.31},{"id":143,"text":"like email notifications, for example. And usually when you send notifications, you want to optimize for things like how much people are clicking on it, because that means that it is something that they're potentially interested in, but also want to minimize the total number of times that you're sending them a notification so that you're not kind of spamming the user. You might also care about weekly active users.","zh":"例如电子邮件通知。通常当你发送通知时，你希望优化人们点击通知的次数，因为这表明他们可能对此感兴趣。但你也希望最小化发送通知的总次数，以避免给用户造成垃圾信息。你可能还关心每周活跃用户数。","start":1331.76,"end":1357.66},{"id":144,"text":"They also had their existing system, which is the baseline here.","zh":"他们也有他们现有的系统，这是这里的基线。","start":1358.4,"end":1361.24},{"id":145,"text":"And they also tried applying the CQL terms to a DQN objective.","zh":"他们还尝试将CQL术语应用于DQN目标。","start":1361.44,"end":1367.56},{"id":146,"text":"And they found that when you added CQL using an offline data set and then ran that policy in an online A-B test,","zh":"他们发现，当你使用离线数据集添加CQL，然后在在线A/B测试中运行该策略时，","start":1368.56,"end":1377.46},{"id":147,"text":"they were able to get a higher click-through rate, a lower number of total notifications,","zh":"他们能够获得更高的点击率、更少的总通知数量，","start":1377.72,"end":1382.2},{"id":148,"text":"and also kind of a slight increase in user usage.","zh":"以及用户使用量的轻微增加。","start":1382.9,"end":1387.16}],"notes":["本段讲解了在最大化Q值和最大化熵的条件下，最优的mu与Q值的指数成正比。这表明在优化过程中，不需要显式构造mu，而是可以通过对数求和的形式直接计算。这种形式简化了计算过程，同时保留了对Q值的依赖。","接着，讲者提到最终的优化目标类似于批评者的损失函数，加上对Q值的对数求和项。这表明在强化学习中，目标函数的设计需要考虑多个因素，如Q值的估计和熵的正则化。","在应用示例中，讲者提到LinkedIn使用CQL算法优化通知策略，以提高点击率并减少通知数量。这说明CQL算法在实际应用中可以有效平衡多个目标，如用户兴趣和通知频率。","讲者还提到，他们将CQL项应用于DQN目标函数，并在离线数据集上进行训练，然后在在线A/B测试中评估效果。这表明CQL算法可以与现有的强化学习算法结合使用，以提升性能。","实验结果显示，使用CQL后，点击率提高，通知数量减少，用户使用率略有上升。这说明CQL算法在实际应用中能够有效优化策略，实现多个目标的平衡。","讲者强调，CQL算法适用于连续动作空间，需要通过采样测试图像来评估策略。这表明在实际应用中，需要考虑动作空间的连续性，并通过采样方法进行策略评估。"],"formulas":[],"uncertainties":["log sum X over your key values"],"diagram":"none","start":1210.98,"end":1387.16,"asr_flags":[],"math_clarifications":["原文中提到的公式缺乏必要的数学定义和上下文，例如 'mu'、'Q'、'L_{critic}'、'L_{DQN}'、'key values' 等符号的含义和条件未明确说明，因此无法核定其数学正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":1210.98,"text":"then you could actually write down"},{"start":1215.41,"text":"You can write down what this looks like in closed form. And in particular, for kind of maximizing Q and maximizing entropy, you can show that the optimal mu is proportional to the exponentiated Q values. I won't go into the derivation for this. We possibly will post something on Ed after lecture if you're interested. And then this term turns out to simply come out to"},{"start":1241.39,"text":"a log sum X over your key values without having to construct an explicit mu. And so then the final objective is going to look something like the loss function for the critic plus the log sum X of Q of SA."},{"start":1270.8,"text":"with an alpha term here, minus alpha times the expected key values for states and actions in your data set. And this means that you don't actually need to construct mu directly. This was the only term that depended on mu, and we just replaced this with this term right here."},{"start":1298.86,"text":"Yeah. So if there's a continuous action space, then you'll want to sample test images. Okay. Cool. So for this algorithm called CQL or conservative Q-learning,"},{"start":1313.71,"text":"I figured I'd show one application of this, just as an example. We've seen a lot of applications in robotics and talked about driving and so forth. It turns out that some folks at LinkedIn use this algorithm to optimize a policy for sending notifications."},{"start":1331.76,"text":"like email notifications, for example. And usually when you send notifications, you want to optimize for things like how much people are clicking on it, because that means that it is something that they're potentially interested in, but also want to minimize the total number of times that you're sending them a notification so that you're not kind of spamming the user. You might also care about weekly active users. And they took the double DQN algorithm."},{"start":1358.4,"text":"They also had their existing system, which is the baseline here."},{"start":1361.44,"text":"And they also tried applying the CQL terms to a DQN objective."},{"start":1368.56,"text":"And they found that when you added CQL using an offline data set and then ran that policy in an online A-B test,"},{"start":1377.72,"text":"they were able to get a higher click-through rate, a lower number of total notifications,"},{"start":1382.9,"text":"and also kind of a slight increase in user usage."}],"speech_gaps":[],"frame":"../frames/v035/008.webp","frame_time":1222.98},{"title":"奖励学习（Reward Learning）","segments":[{"id":149,"text":"So yeah, there's just one example of a scenario where offline RL, and specifically this algorithm, was used in a fairly real-world scenario.","zh":"所以是的，这里有一个例子，说明离线强化学习，特别是这个算法，在一个相当现实的场景中被使用。","start":1388.4,"end":1397.22},{"id":150,"text":"Yeah, so the question is, why do we want to be conservative in the first place?","zh":"是的，所以问题是，为什么我们要一开始保持保守呢？","start":1398.1,"end":1401.86},{"id":151,"text":"So this kind of really comes down to the very initial motivation for offline RL, which is that outside of the support of the data,","zh":"所以这种问题实际上回到了离线强化学习最初的动机，即在数据的支持范围之外，","start":1402.4,"end":1412.12},{"id":152,"text":"when you cannot collect online data, you can't really learn a policy that's far beyond the data.","zh":"当你无法收集在线数据时，你无法真正学习到超出数据范围的策略。","start":1412.12,"end":1422.14},{"id":153,"text":"And one reason to be conservative is specifically trying to be conservative outside the support of","zh":"保持保守的一个原因是，特别是在数据的支持范围之外，","start":1422.5,"end":1429.28},{"id":154,"text":"the data. Because those are the regimes where you don't have the ability to collect more data. And","zh":"因为这些是无法收集更多数据的领域。而且，","start":1429.28,"end":1435.1},{"id":155,"text":"if you try to learn, if you kind of assume that you can go far beyond the data, then you might","zh":"如果你尝试学习，如果你假设你可以远远超出数据范围，那么你可能会","start":1435.1,"end":1441.36},{"id":156,"text":"learn an inaccurate Q function, and as a result, might learn a poor policy.","zh":"学习到一个不准确的Q函数，从而学习到一个较差的策略。","start":1441.36,"end":1445.34},{"id":157,"text":"So to summarize, online data is expensive. Reusing offline data is useful. A key challenge","zh":"因此，总结一下，在线数据成本很高。重复使用离线数据是有用的。一个关键挑战","start":1449.1,"end":1456.96},{"id":158,"text":"that comes up in offline URL is overestimation because of the shift between the policy and the","zh":"是在离线URL中出现的过估计问题，这是由于策略与数据之间的转移导致的。我们讨论了几种不同的方法","start":1456.96,"end":1461.86},{"id":159,"text":"data and the policy that you're learning. And we talked about a few different approaches","zh":"来解决这个问题，今天我们讨论的方法是尝试显式地惩罚Q值。","start":1461.86,"end":1466.58},{"id":160,"text":"for doing this, and the one we talked about today was to try to explicitly penalize Q value.","zh":"离线或 rollout 方法能够改进模仿学习，包括过滤模仿学习，通过组合良好的行为并利用奖励信息。因此，让我们转换话题，讨论奖励学习。","start":1466.58,"end":1471.04},{"id":161,"text":"And offline or rollout methods are able to improve over imitation learning, including filtered imitation learning, by stitching together good behaviors and leveraging reward information. So let's shift gears and talk about reward learning. So in everything that we've talked about so far, well, except for imitation learning, we've been trying to maximize the sum of rewards.","zh":"并且，离线或 rollout 方法能够改进模仿学习，包括过滤模仿学习，通过拼接良好的行为并利用奖励信息来实现。因此，让我们换个话题，谈谈奖励学习。因此，在我们迄今为止所讨论的一切内容中，除了模仿学习之外，我们一直在尝试最大化奖励的总和。","start":1473.64,"end":1501.1},{"id":162,"text":"And there's this question of where do the rewards come from in the first place, and where do we get them? And some of the very initial use cases of reinforcement learning were with computer games, where you can just use the score of the game as your reward function, and then get a player that plays the game very well. But in real-world scenarios, you often don't get...","zh":"那么，最初奖励是从哪里来的，我们又是如何获得它们的呢？一些早期的强化学习应用案例是计算机游戏，其中你可以直接使用游戏得分作为奖励函数，从而得到一个能够很好地玩游戏的玩家。但在现实场景中，你通常不会得到...","start":1502.31,"end":1524.7},{"id":163,"text":"And some of the very initial use cases of reinforcement learning were with computer games, where you can just use the score of the game as your reward function, and then get a player that plays the game very well.","zh":"一些早期的强化学习应用案例是计算机游戏，其中你可以直接使用游戏得分作为奖励函数，从而得到一个能够很好地玩游戏的玩家。","start":1526.33,"end":1536.13},{"id":164,"text":"is fairly complex for a robot to do, although young children are able to do it fairly well. Humans maybe get some kind of reward when they drink the water and some sort of satisfaction from that, but robots do not get that kind of satisfaction. And so if you were to try to get a reward function for this kind of pouring task, then you would need to think about","zh":"对于机器人来说，完成这个任务相当复杂，尽管年幼的儿童能够相对较好地完成。人类在喝水时可能会获得某种奖励，并从中获得满足感，但机器人不会获得这种满足感。因此，如果你要为这种倒水任务设计一个奖励函数，那么你需要考虑","start":1536.54,"end":1558.26}],"notes":["本段讨论了在离线强化学习中保持保守的原因，特别是在数据支持范围之外的区域。由于无法收集更多数据，因此需要避免学习超出数据范围的策略，否则可能导致不准确的Q函数和差的策略。","离线强化学习面临的一个关键挑战是过估计，这是由于学习策略与数据分布之间的差异造成的。课程提到了几种应对方法，包括显式惩罚Q值。","离线或rollout方法能够改进模仿学习，包括过滤后的模仿学习，通过组合良好的行为并利用奖励信息来提升性能。","课程还讨论了奖励的来源问题，指出在现实世界场景中，奖励通常不像在计算机游戏中那样直接可用，因此需要设计合适的奖励函数。","以倒水任务为例，人类在完成任务时会获得内在满足感，而机器人则没有这种体验，因此需要人工设计奖励函数来引导其行为。","课程强调了奖励学习的重要性，特别是在现实世界应用中，如何获取和设计有效的奖励函数是强化学习的关键挑战之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1388.4,"end":1558.26,"asr_flags":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":1388.4,"text":"So yeah, there's just one example of a scenario where offline RL, and specifically this algorithm, was used in a fairly real-world scenario."},{"start":1398.1,"text":"Yeah, so the question is, why do we want to be conservative in the first place?"},{"start":1402.4,"text":"So this kind of really comes down to the very initial motivation for offline RL, which is that outside of the support of the data,"},{"start":1412.12,"text":"when you cannot collect online data, you can't really learn a policy that's far beyond the data."},{"start":1422.5,"text":"And one reason to be conservative is specifically trying to be conservative outside the support of"},{"start":1429.28,"text":"the data. Because those are the regimes where you don't have the ability to collect more data. And"},{"start":1435.1,"text":"if you try to learn, if you kind of assume that you can go far beyond the data, then you might"},{"start":1441.36,"text":"learn an inaccurate Q function, and as a result, might learn a poor policy."},{"start":1449.1,"text":"So to summarize, online data is expensive. Reusing offline data is useful. A key challenge"},{"start":1456.96,"text":"that comes up in offline URL is overestimation because of the shift between the policy and the"},{"start":1461.86,"text":"data and the policy that you're learning. And we talked about a few different approaches"},{"start":1466.58,"text":"for doing this, and the one we talked about today was to try to explicitly penalize Q value."},{"start":1473.64,"text":"And offline or rollout methods are able to improve over imitation learning, including filtered imitation learning, by stitching together good behaviors and leveraging reward information. So let's shift gears and talk about reward learning. So in everything that we've talked about so far, well, except for imitation learning, we've been trying to maximize the sum of rewards."},{"start":1502.31,"text":"And there's this question of where do the rewards come from in the first place, and where do we get them? And some of the very initial use cases of reinforcement learning were with computer games, where you can just use the score of the game as your reward function, and then get a player that plays the game very well. But in real-world scenarios, you often don't get..."},{"start":1526.33,"text":"rewards as directly, especially when we're developing computers to do things. So if you wanted to develop a robot that could pour water from a pitcher into a cup."},{"start":1536.54,"text":"is fairly complex for a robot to do, although young children are able to do it fairly well. Humans maybe get some kind of reward when they drink the water and some sort of satisfaction from that, but robots do not get that kind of satisfaction. And so if you were to try to get a reward function for this kind of pouring task, then you would need to think about"}],"speech_gaps":[],"frame":"../frames/v035/009.webp","frame_time":1400.4},{"title":"奖励学习中的挑战与方法","segments":[{"id":165,"text":"how to represent where the water is, did you spill any water, did the water get into the cup, and so forth. So it's pretty challenging to get a reward function for that. If you have some kind of dialogue situation, if you're trying to develop a chatbot, people don't directly tell you that was a reward of 1, that was a reward of 10. And so you need to think about how to get a reward function that's informative for reinforcement learning. Likewise, in autonomous driving,","zh":"如何表示水在哪里，你有没有洒水，水有没有进入杯子，等等。因此，为这种情况获取一个奖励函数是非常具有挑战性的。如果你处于某种对话情境中，比如你正在开发一个聊天机器人，人们不会直接告诉你那个是奖励1，那个是奖励10。因此，你需要思考如何获得一个对强化学习有信息量的奖励函数。同样，在自动驾驶中","start":1558.95,"end":1584.59},{"id":166,"text":"The real world doesn't just give you reward functions. And you need to think about how a number of different factors like the rules of the road, how comfortable is it for the user, and so forth. So in some cases, we can use a proxy for the true reward.","zh":"现实世界不会直接给你奖励函数。你需要思考诸如道路规则、用户是否感到舒适等因素。因此，在某些情况下，我们可以使用真实奖励的代理。","start":1585.74,"end":1605.2},{"id":167,"text":"And you could have a human giving the rewards, like maybe giving one if that was successful, zero otherwise. You might have some proxy in terms of things like click-through rate. That's a proxy. We don't necessarily care about humans clicking on things inherently, but it's a proxy for what we might care about. But even with proxies, there's a lot of downsides.","zh":"你也可以让人类给出奖励，比如成功时给1，否则给0。你可能会使用诸如点击率这样的代理指标。这是一个代理，我们并不一定关心人类是否点击东西本身，但它是我们可能关心的内容的代理。但即使使用代理，也有很多缺点。","start":1605.77,"end":1630.01},{"id":168,"text":"It's worth thinking about if there's other ways to provide supervision to reinforcement learning algorithms. We've seen one alternative approach so far, which is just to use imitation learning. And you don't need any reward function if you use imitation learning. But when you use imitation learning, you're not really thinking about outcomes and optimizing for a particular outcome. You're just optimizing for mimicking the actions.","zh":"值得思考是否有其他方式为强化学习算法提供监督。到目前为止，我们已经看到一种替代方法，即直接使用模仿学习。如果你使用模仿学习，就不需要任何奖励函数。但当你使用模仿学习时，你并不是真正思考结果或优化特定结果，你只是优化模仿动作。","start":1631.6,"end":1654.34},{"id":169,"text":"You might also have scenarios where it's hard to provide demonstrations or where the expert has different degrees of freedom that might make it hard to get good demonstration data for imitation.","zh":"你可能也会遇到难以提供示范的场景，或者专家拥有不同的自由度，这可能会使获取高质量的示范数据变得困难。","start":1656.05,"end":1665.21},{"id":170,"text":"And so a lot of reward learning is to think about what is the underlying outcome that we want to see?","zh":"因此，很多奖励学习的内容是思考我们想要看到的底层结果是什么？","start":1667.05,"end":1673.03},{"id":171,"text":"Like, what is the expert trying to achieve?","zh":"比如，专家试图实现什么？","start":1673.19,"end":1674.99},{"id":172,"text":"What do humans want?","zh":"人类想要什么？","start":1675.41,"end":1676.59},{"id":173,"text":"So people are able to infer rewards.","zh":"因此，人们能够推断出奖励。","start":1677.51,"end":1679.17},{"id":174,"text":"there's a few other examples, lots of fun videos, where even very small kids are able to figure out","zh":"还有一些其他的例子，很多有趣的视频显示，即使是很小的孩子也能够理解","start":1679.17,"end":1686.49},{"id":175,"text":"what is the reward function, what is the objective, and be able to even optimize that to help the","zh":"什么是奖励函数，什么是目标，并且能够优化它来帮助人。","start":1686.49,"end":1692.99},{"id":176,"text":"person. Okay, so how do we learn rewards? We'll talk about two approaches for doing this. One is","zh":"好的，那么我们如何学习奖励？我们将讨论两种方法来进行这项工作。一种是","start":1692.99,"end":1701.01},{"id":177,"text":"is from examples of goals, and another one is from human preferences. So one of the simplest","zh":"从目标的例子中学习，另一种是从人类偏好中学习。因此，我们可以考虑的最简单","start":1701.01,"end":1711.41},{"id":178,"text":"things we could consider doing is try to give examples of what success looks like, and then","zh":"的事情之一是尝试给出成功的样子的例子，然后","start":1711.41,"end":1719.17},{"id":179,"text":"train a classifier to predict success versus failure. So for example, if we wanted a robot","zh":"训练一个分类器来预测成功与失败。例如，如果我们希望机器人","start":1719.17,"end":1725.57},{"id":180,"text":"to put a pencil case behind a notebook, we give it a few examples of what that looks","zh":"将铅笔盒放在笔记本后面，我们给它一些成功的样子的例子","start":1725.57,"end":1729.37},{"id":181,"text":"looks like, give it a few negative examples of scenarios where it's not behind the notebook,","zh":"看起来，给出几个负面例子，说明它不在笔记本后面的情景，","start":1729.37,"end":1735.35}],"notes":["本段讨论了奖励学习中的挑战，包括如何表示环境状态、如何获取奖励函数以及如何处理代理奖励的问题。讲者指出，在实际应用中，如对话系统和自动驾驶，直接获取奖励函数是困难的，因此需要使用代理奖励。","讲者提到，奖励学习的一个方法是通过示例来学习奖励函数，例如通过提供成功和失败的示例来训练分类器。这种方法可以用于机器人任务，如将铅笔盒放在笔记本后面。","此外，讲者还提到另一种方法是通过人类偏好来学习奖励函数，这可能涉及更复杂的推理过程，但可以更准确地反映人类的目标。","讲者强调，奖励学习需要考虑多个因素，如道路规则、用户舒适度等，并指出代理奖励可能带来一些缺点，如无法完全反映真实奖励。","在讨论中，讲者提到人类能够推断奖励函数，例如通过观察儿童的行为来理解目标和奖励机制。","最后，讲者指出，奖励学习的两个主要方法是基于目标示例和基于人类偏好，这两种方法各有优劣，需要根据具体应用场景进行选择。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1558.95,"end":1735.35,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":1558.95,"text":"how to represent where the water is, did you spill any water, did the water get into the cup, and so forth. So it's pretty challenging to get a reward function for that. If you have some kind of dialogue situation, if you're trying to develop a chatbot, people don't directly tell you that was a reward of 1, that was a reward of 10. And so you need to think about how to get a reward function that's informative for reinforcement learning. Likewise, in autonomous driving,"},{"start":1585.74,"text":"The real world doesn't just give you reward functions. And you need to think about how a number of different factors like the rules of the road, how comfortable is it for the user, and so forth. So in some cases, we can use a proxy for the true reward."},{"start":1605.77,"text":"And you could have a human giving the rewards, like maybe giving one if that was successful, zero otherwise. You might have some proxy in terms of things like click-through rate. That's a proxy. We don't necessarily care about humans clicking on things inherently, but it's a proxy for what we might care about. But even with proxies, there's a lot of downsides."},{"start":1631.6,"text":"It's worth thinking about if there's other ways to provide supervision to reinforcement learning algorithms. We've seen one alternative approach so far, which is just to use imitation learning. And you don't need any reward function if you use imitation learning. But when you use imitation learning, you're not really thinking about outcomes and optimizing for a particular outcome. You're just optimizing for mimicking the actions."},{"start":1656.05,"text":"You might also have scenarios where it's hard to provide demonstrations or where the expert has different degrees of freedom that might make it hard to get good demonstration data for imitation."},{"start":1667.05,"text":"And so a lot of reward learning is to think about what is the underlying outcome that we want to see?"},{"start":1673.19,"text":"Like, what is the expert trying to achieve?"},{"start":1675.41,"text":"What do humans want?"},{"start":1677.51,"text":"So people are able to infer rewards."},{"start":1679.17,"text":"there's a few other examples, lots of fun videos, where even very small kids are able to figure out"},{"start":1686.49,"text":"what is the reward function, what is the objective, and be able to even optimize that to help the"},{"start":1692.99,"text":"person. Okay, so how do we learn rewards? We'll talk about two approaches for doing this. One is"},{"start":1701.01,"text":"is from examples of goals, and another one is from human preferences. So one of the simplest"},{"start":1711.41,"text":"things we could consider doing is try to give examples of what success looks like, and then"},{"start":1719.17,"text":"train a classifier to predict success versus failure. So for example, if we wanted a robot"},{"start":1725.57,"text":"to put a pencil case behind a notebook, we give it a few examples of what that looks"},{"start":1729.37,"text":"looks like, give it a few negative examples of scenarios where it's not behind the notebook,"}],"speech_gaps":[],"frame":"../frames/v035/010.webp","frame_time":1570.95},{"title":"奖励学习中的分类器与潜在问题","segments":[{"id":182,"text":"and then train a binary classifier to be able to predict that the positive examples should","zh":"然后训练一个二分类器，以能够预测正例应该被标记为1，负例应该被标记为0。","start":1735.61,"end":1742.91},{"id":183,"text":"be labeled with 1, the negative examples should be labeled with 0.","zh":"正例应被标记为1，负例应被标记为0。","start":1742.91,"end":1745.39},{"id":184,"text":"And then you can use the output of this binary classifier as
