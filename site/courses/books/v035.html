here. And maybe some of these states are good, but maybe also some of these states are not so good. And if we want to avoid exploiting","start":1929.26,"end":1958.34},{"id":195,"text":"the classifier, one simple thing that we could do is we could take these states that we visited with our policy and we could then label them as additional data points for training our classifier. Now, if we don't have a good reward function and we don't want supervision online, then we don't know exactly what the labels should be. And one thing that we could do is simply to be conservative.","start":1959.24,"end":1989.53},{"id":196,"text":"we could label these as negatives and say that all of these were states that were failures, essentially. And then retrain our classifier. And if we retrain our classifier, we would then get a classifier that maybe looks like this.","start":1990.27,"end":2021.56},{"id":197,"text":"around these states. Let's walk through what this would look like explicitly. We could add states that the RL algorithm visits as negative examples for the classifier. Specifically, we would collect some initial set of success states and unsuccessful states. Then we would update our classifier and train it to classify the success states and the unsuccessful states. Then we would collect some experience using our policy.","start":2022.17,"end":2052.11}],"notes":["本段讲解了在奖励学习中如何利用分类器与策略进行互动。通过将策略访问的状态作为负例，可以训练分类器以区分成功与失败状态，从而帮助策略学习更准确的奖励函数。","讲者提到，当策略访问某些状态时，可以将这些状态标记为负例，并重新训练分类器，以获得更准确的分类边界。这种做法有助于避免策略过度依赖分类器的输出。","在没有明确奖励函数的情况下，讲者建议采用保守策略，将所有访问状态标记为失败，从而确保分类器的训练过程更加稳健。","通过这种方式，策略可以逐步学习到更准确的分类边界，从而在后续的探索中更有效地识别成功状态。","讲者还提到，可以收集初始的成功与失败状态，用于训练分类器，并在策略运行过程中不断更新分类器，以提高其准确性。","这种交互机制体现了奖励学习中分类器与策略之间的动态关系，通过分类器的反馈，策略可以不断优化其行为以达到更高的奖励目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1898.7,"end":2052.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1898.7,"text":"where, I don't know, in the pencil case example, maybe this is where the pencil case should be. You can also just generally think of it as some abstract space. And then you also have negative examples over here. Maybe this is a bad place to go to. And then your classifier, when you train a binary classifier, it will learn some sort of decision boundary like this. And then when you train a policy,"},{"start":1929.26,"text":"when it sees that the stuff over here is positive and the stuff over here is negative, maybe we can also specify the direction of our binary classifier, then your R algorithm, it might learn to kind of go somewhere over here. And maybe some of these states are good, but maybe also some of these states are not so good. And if we want to avoid exploiting"},{"start":1959.24,"text":"the classifier, one simple thing that we could do is we could take these states that we visited with our policy and we could then label them as additional data points for training our classifier. Now, if we don't have a good reward function and we don't want supervision online, then we don't know exactly what the labels should be. And one thing that we could do is simply to be conservative."},{"start":1990.27,"text":"we could label these as negatives and say that all of these were states that were failures, essentially. And then retrain our classifier. And if we retrain our classifier, we would then get a classifier that maybe looks like this. And then maybe our policy kind of visits over here. And then you eventually learn a classifier that is more accurate."},{"start":2022.17,"text":"around these states. Let's walk through what this would look like explicitly. We could add states that the RL algorithm visits as negative examples for the classifier. Specifically, we would collect some initial set of success states and unsuccessful states. Then we would update our classifier and train it to classify the success states and the unsuccessful states. Then we would collect some experience using our policy."}],"speech_gaps":[],"frame":"../frames/v035/012.webp","frame_time":1910.7},{"title":"奖励学习中的分类器与数据平衡","segments":[{"id":198,"text":"update our policy using the classifier-based reward, and then we'd add the visited states to our negative examples, and then re-update our classifier using those negative states. Does anyone have concerns about this algorithm? The concern there was that you might not learn a very robust classifier, and you might overfit to the positives in your data set. And in particular, if you have a small number of positives, then...","start":2054.22,"end":2083.41},{"id":199,"text":"You might learn a decision boundary that only contains each of these positives and doesn't contain the things right around them. One thing that you can do for that is to try to regularize your classifier to try to prevent that overfitting. Even standard regularizers can be helpful for that. You can encourage it to be more smooth. Any other concerns about this algorithm?","start":2085.26,"end":2114.27},{"id":200,"text":"Yeah, so one of the challenges that can come up with this algorithm is that you're going to be adding more and more negatives to your data set. And one really critical thing here is that if you keep on adding negatives to your data set and don't rebalance your data set, then it might just predict negative everywhere.","start":2115.24,"end":2131.65},{"id":201,"text":"And so one critical thing here is to balance the data set 50-50 so that the negatives account for half of the data that you're sampling and the positives account for the other half of the data that you're sampling. Yeah, so the question was that at some point your original negatives will be overwhelmed by the sample negatives. And does it make sense to balance them? Certainly you could do that. It depends on how large your initial negatives are.","start":2132.6,"end":2159.18},{"id":202,"text":"And one of the things that will happen is that your policy will actually start visiting the states here. And it might visit even exactly the same states as the positives. And you're then going to be labeling these as negatives. Now, those labels are incorrect. Those states are actually kind of true positives. And this kind of also alludes to the overfitting comment at the beginning.","start":2160.99,"end":2189.66},{"id":203,"text":"But it actually turns out that if you balance your data set, this might actually be okay. And if you use enough regularization or have a large enough positive and negative data set. And the reason why this might be okay is that when you use balancing, it will ensure that...","start":2190.57,"end":2215.65}],"notes":["本段讨论了在奖励学习中使用分类器时可能出现的过拟合问题，特别是当正样本数量较少时，分类器可能会过度拟合正样本，导致决策边界过于狭窄，无法涵盖周围区域的样本。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2054.22,"end":2215.65,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2054.22,"text":"update our policy using the classifier-based reward, and then we'd add the visited states to our negative examples, and then re-update our classifier using those negative states. Does anyone have concerns about this algorithm? The concern there was that you might not learn a very robust classifier, and you might overfit to the positives in your data set. And in particular, if you have a small number of positives, then..."},{"start":2085.26,"text":"You might learn a decision boundary that only contains each of these positives and doesn't contain the things right around them. One thing that you can do for that is to try to regularize your classifier to try to prevent that overfitting. Even standard regularizers can be helpful for that. You can encourage it to be more smooth. Any other concerns about this algorithm?"},{"start":2115.24,"text":"Yeah, so one of the challenges that can come up with this algorithm is that you're going to be adding more and more negatives to your data set. And one really critical thing here is that if you keep on adding negatives to your data set and don't rebalance your data set, then it might just predict negative everywhere."},{"start":2132.6,"text":"And so one critical thing here is to balance the data set 50-50 so that the negatives account for half of the data that you're sampling and the positives account for the other half of the data that you're sampling. Yeah, so the question was that at some point your original negatives will be overwhelmed by the sample negatives. And does it make sense to balance them? Certainly you could do that. It depends on how large your initial negatives are."},{"start":2160.99,"text":"And so that's something to consider. One of the things that will happen is that your policy will actually start visiting the states here. And it might visit even exactly the same states as the positives. And you're then going to be labeling these as negatives. Now, those labels are incorrect. Those states are actually kind of true positives. And this kind of also alludes to the overfitting comment at the beginning."},{"start":2190.57,"text":"But it actually turns out that if you balance your data set, this might actually be okay. And if you use enough regularization or have a large enough positive and negative data set. And the reason why this might be okay is that when you use balancing, it will ensure that..."}],"speech_gaps":[],"frame":"../frames/v035/013.webp","frame_time":2066.22},{"title":"奖励学习中的概率与阈值处理","segments":[{"id":204,"text":"the half of the data set will be positives. So we know that 50% of the data set is going to be true positives. And then for the other part of the data set, some proportion of it will be false negatives, and some proportion of it will be true negatives. Let's say that we've gotten to the point where","start":2216.85,"end":2244.69},{"id":205,"text":"For the other 50%, 40% is a false negative, meaning that it's labeled as a negative, but it's actually a positive. And 10%, including our original negatives, corresponds to true negatives. Then in this case, as long as we're balancing our data set, for a positive, it will still output... It won't output like...","start":2245.7,"end":2274.22},{"id":206,"text":"Then in this case, as long as we're balancing our data set, for a positive, it will still output... It won't output like... probability one that something is a positive because of all these here, but it's still going to output a probability that something's positive that's higher than 50% and probably that's higher than the probability that it is negative.","start":2274.74,"end":2304.98},{"id":207,"text":"And so, yeah, specifically with balancing, you can always expect that the probability of a true positive under our classifier, this will always be, if the classifier is training properly, this will always be greater than 50%. Because as long as this data set is not like, if it's all the way like 50, like entirely false negatives, then it will be exactly 50%.","start":2305.68,"end":2327.26},{"id":208,"text":"But as long as you have some true negatives around, including your original set of negatives, then it'll be strictly above 0.5. And the probability of a true negative will be less than 0.5. The question is, would this be resolved if we use confidence intervals instead of 0 or 1?","start":2328.07,"end":2353.33},{"id":209,"text":"So you can also use this probability as the reward and not threshold it, and that is also fine. In terms of confidence intervals, that could also potentially be helpful, although I haven't thought too much about it, and you would need probably a slightly more sophisticated RLF.","start":2353.89,"end":2377.67}],"notes":["本段讨论了在数据集平衡的情况下，分类器输出的正类概率会高于50%。讲者指出，如果数据集中存在真正的负类样本，那么正类的概率将严格大于50%，而负类的概率则低于50%。","讲者进一步提出，使用概率作为奖励而非阈值处理是可行的。这可能有助于避免因阈值设定不当而导致的偏差，但需要更复杂的奖励学习框架（RLF）来实现。","讲者提到，使用置信区间代替0或1的二元输出可能有助于解决某些问题，但目前尚未深入探讨其具体应用。","讲者强调了数据集平衡的重要性，指出如果数据集中全是假负类样本，那么正类的概率将等于50%。因此，保持数据集的平衡是确保模型性能的关键。","讲者还提到，使用概率作为奖励可以避免阈值处理带来的问题，但需要更复杂的模型设计来支持这种做法。","讲者最后提到，如果处于一个需要访问特定状态的场景中，可能需要更复杂的奖励学习框架来处理概率输出。"],"formulas":[{"latex":"P(\\text{True Positive}) > 0.5","symbols":"正类概率大于0.5","explanation":"根据原文描述，当数据集平衡且分类器训练良好时，正类的概率应大于50%。此公式正确表达了这一概念。","evidence":"a true positive under our classifier, this will always be, if the classifier is training properly, this will always be greater than 50%. Because as long as this data set is not like, if it's all the way like 50, like entirely false negatives, then it will be exactly 50%."},{"latex":"P(\\text{True Negative}) \u003c 0.5","symbols":"负类概率小于0.5","explanation":"原文提到负类的概率会小于50%，此公式正确表达了这一概念。","evidence":"But as long as you have some true negatives around, including your original set of negatives, then it'll be strictly above 0.5. And the probability of a true negative will be less than 0.5. The question is, would this be resolved if we use confidence intervals instead of 0 or 1?"}],"uncertainties":[],"diagram":"none","start":2216.85,"end":2377.67,"asr_flags":[],"math_clarifications":["原文未提供具体的数学公式，因此公式是基于文本内容的合理推断。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2216.85,"text":"the half of the data set will be positives. So we know that 50% of the data set is going to be true positives. And then for the other part of the data set, some proportion of it will be false negatives, and some proportion of it will be true negatives. Let's say that we've gotten to the point where"},{"start":2245.7,"text":"For the other 50%, 40% is a false negative, meaning that it's labeled as a negative, but it's actually a positive. And 10%, including our original negatives, corresponds to true negatives. Then in this case, as long as we're balancing our data set, for a positive, it will still output... It won't output like..."},{"start":2274.74,"text":"probability one that something is a positive because of all these here, but it's still going to output a probability that something's positive that's higher than 50% and probably that's higher than the probability that it is negative. And so, yeah, specifically with balancing, you can always expect that the probability of"},{"start":2305.68,"text":"a true positive under our classifier, this will always be, if the classifier is training properly, this will always be greater than 50%. Because as long as this data set is not like, if it's all the way like 50, like entirely false negatives, then it will be exactly 50%."},{"start":2328.07,"text":"But as long as you have some true negatives around, including your original set of negatives, then it'll be strictly above 0.5. And the probability of a true negative will be less than 0.5. The question is, would this be resolved if we use confidence intervals instead of 0 or 1?"},{"start":2353.89,"text":"So you can also use this probability as the reward and not threshold it, and that is also fine. In terms of confidence intervals, that could also potentially be helpful, although I haven't thought too much about it, and you would need probably a slightly more sophisticated RLF. Yeah, so if you're in a scenario where you visit a state that's like..."}],"speech_gaps":[],"frame":"../frames/v035/014.webp","frame_time":2228.85},{"title":"奖励学习中的生成对抗网络应用","segments":[{"id":210,"text":"It's very hard to distinguish between them, then if you have regularization, it's likely to label it as a positive because the regularization will encourage the function to be smooth. But it comes down a lot to how different it is. So the question is, would this be solved if we use a generative adversarial network where the classifier is... the reward is the discriminator and the generator is the agent? It turns out that","start":2377.89,"end":2406.78},{"id":211,"text":"This actually, okay, I don't have, this is like two slides from now, but it turns out that this actually is exactly a generative adversarial network. So you can think of this classifier as a discriminator that's trying to discriminate between the positive examples that we gave and everything that the policy is visiting.","start":2408.14,"end":2425.58},{"id":212,"text":"And the kind of generator in a generative adversarial network is the policy. You don't necessarily need to know about exactly what generative adversarial networks or GANs are, but if you do know what they are, this is basically exactly a form of a GAN. Yeah, so the question is, after we run a directory, are we seeing what the true label is? And the answer to that is no. So we're assuming that we don't get any more human supervision other than the initial training data set. Now, one other thing that you can do here that...","start":2426.88,"end":2455.06},{"id":213,"text":"makes this a little bit potentially easier is you could also label some of the data as positives or negatives as well and use that to continue to update your classifier. And so that's also a very valid approach. And there's ways to label only some of the data so that you don't have to label every single trajectory that the policy is doing. And that could also help stabilize the training.","start":2455.32,"end":2477.48},{"id":214,"text":"One example of using this kind of approach in robotics is a paper that took 50 demonstrations. It used the final states as successes for training the classifier. It initializes a replay buffer with the demonstrations.","start":2480.23,"end":2498.35},{"id":215,"text":"And if you directly imitate the demonstrations, the success rate is around 26% because 50 demonstrations is not that much. And even if you collect more, it'd be hard to get to 100% success. And then if instead you use this initialization and run RL with a classifier learned in this way.","start":2499.79,"end":2520.0},{"id":216,"text":"then you get a policy that has, in this case, a 62% success rate. Not awesome yet, but something that's substantially higher than the success rate of imitation learning.","start":2520.52,"end":2533.7}],"notes":["本段讨论了在奖励学习中使用生成对抗网络（GAN）的思路，其中分类器作为判别器，用于区分正样本和策略访问的所有状态。生成器则对应策略，通过对抗训练来优化策略。","讲者指出，即使在没有额外人类监督的情况下，也可以通过部分标记数据来更新分类器，从而提高训练的稳定性。这种方法在机器人领域有实际应用，例如通过50个示范来训练分类器。","在机器人应用中，直接模仿示范的成功率较低（约26%），但通过使用初始化的分类器进行强化学习，可以显著提高成功率（62%），这表明分类器在奖励学习中的重要性。","讲者强调，这种方法虽然有效，但仍有改进空间，例如如何更高效地标记数据和优化分类器的训练过程。","讲者提到，生成对抗网络的结构与奖励学习中的分类器和策略之间的关系，表明了GAN在强化学习中的潜在应用。","最后，讲者指出，虽然这种方法在某些情况下表现良好，但仍然存在挑战，例如如何确保分类器的准确性以及如何进一步提高策略的成功率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2377.89,"end":2533.7,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2377.89,"text":"very hard to distinguish between them, then if you have regularization, it's likely to label it as a positive because the regularization will encourage the function to be smooth. But it comes down a lot to how different it is. So the question is, would this be solved if we use a generative adversarial network where the classifier is... the reward is the discriminator and the generator is the agent? It turns out that"},{"start":2408.14,"text":"This actually, okay, I don't have, this is like two slides from now, but it turns out that this actually is exactly a generative adversarial network. So you can think of this classifier as a discriminator that's trying to discriminate between the positive examples that we gave and everything that the policy is visiting."},{"start":2426.88,"text":"And the kind of generator in a generative adversarial network is the policy. You don't necessarily need to know about exactly what generative adversarial networks or GANs are, but if you do know what they are, this is basically exactly a form of a GAN. Yeah, so the question is, after we run a directory, are we seeing what the true label is? And the answer to that is no. So we're assuming that we don't get any more human supervision other than the initial training data set. Now, one other thing that you can do here that..."},{"start":2455.32,"text":"makes this a little bit potentially easier is you could also label some of the data as positives or negatives as well and use that to continue to update your classifier. And so that's also a very valid approach. And there's ways to label only some of the data so that you don't have to label every single trajectory that the policy is doing. And that could also help stabilize the training."},{"start":2480.23,"text":"One example of using this kind of approach in robotics is a paper that took 50 demonstrations. It used the final states as successes for training the classifier. It initializes a replay buffer with the demonstrations."},{"start":2499.79,"text":"And if you directly imitate the demonstrations, the success rate is around 26% because 50 demonstrations is not that much. And even if you collect more, it'd be hard to get to 100% success. And then if instead you use this initialization and run RL with a classifier learned in this way."},{"start":2520.52,"text":"then you get a policy that has, in this case, a 62% success rate. Not awesome yet, but something that's substantially higher than the success rate of imitation learning."}],"speech_gaps":[],"frame":"../frames/v035/015.webp","frame_time":2389.89},{"title":"奖励学习中的分类器正则化与生成对抗网络","segments":[{"id":217,"text":"And one thing that we found that we talked about that was also we found in this research is that it's actually very important to regularize the classifier to help it not overfit to just the 50 positive examples that were provided at the beginning. Okay. And as a side, this is how GANs work. The generative adversarial networks are a form of generative model. They've often been used for image generation.","start":2536.49,"end":2568.45},{"id":218,"text":"And the key idea is to train a classifier between the real examples, like the real positives, and the generated data, like the states that the policy visits. And you try to train a generator such that it generates things that the classifier thinks is real.","start":2569.15,"end":2589.63},{"id":219,"text":"GANs have been used in a variety of places. Here are some examples of images generated by a GAN. Here is a cool video of an astronaut dancing on Mars and later walking his dog on Mars that also uses a generative adversarial network. Cool. Now, as a recap...","start":2590.38,"end":2618.29},{"id":220,"text":"We talked about training classifiers. These classifiers can be exploited when you optimize against them. And the solution is that during the RL process, if we update the classifier using negatives visited by the policy, then you can avoid it being exploited.","start":2620.14,"end":2637.79},{"id":221,"text":"One other thing that I wanted to skip today because we don't have too much time and need to talk about preferences, but you can also actually learn not just goal classifiers, but you can actually learn full reward functions. If you use all of the states in the demo as positive examples and all of the states in your policy rollouts as negatives, then...","start":2639.69,"end":2662.27},{"id":222,"text":"you can show that we'll be trying to learn a reward function over state distributions","start":2662.92,"end":2668.96},{"id":223,"text":"rather than just goal states.","start":2668.96,"end":2670.74},{"id":224,"text":"Cool.","start":2674.14,"end":2674.7},{"id":225,"text":"On the upside, there's a very practical framework.","start":2674.84,"end":2676.58},{"id":226,"text":"Adversarial training, adding these as negatives, it can be unstable.","start":2677.16,"end":2681.14},{"id":227,"text":"There are a variety of regularization tricks.","start":2681.86,"end":2683.88},{"id":228,"text":"You can actually take them just directly from the GAN literature and apply them.","start":2684.36,"end":2688.2},{"id":229,"text":"And that is quite helpful.","start":2689.1,"end":2690.9},{"id":230,"text":"And then one other big downside here is that this requires examples of what the goal is,","start":2690.9,"end":2696.72},{"id":231,"text":"like what the desired behavior is. And sometimes generating those examples can be challenging or","start":2696.9,"end":2704.3},{"id":232,"text":"time-consuming. Okay, so that's learning from example goals. Now let's talk about learning","start":2704.3,"end":2712.92}],"notes":["本段主要讲解了在强化学习中使用分类器进行正则化的重要性，以防止模型过度拟合于有限的正例数据。同时，提到了生成对抗网络（GANs）的基本原理，即通过训练一个分类器来区分真实数据和生成数据，从而训练生成器生成更接近真实数据的样本。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2536.49,"end":2712.92,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2536.49,"text":"And one thing that we found that we talked about that was also we found in this research is that it's actually very important to regularize the classifier to help it not overfit to just the 50 positive examples that were provided at the beginning. Okay. And as a side, this is how GANs work. The generative adversarial networks are a form of generative model. They've often been used for image generation."},{"start":2569.15,"text":"And the key idea is to train a classifier between the real examples, like the real positives, and the generated data, like the states that the policy visits. And you try to train a generator such that it generates things that the classifier thinks is real."},{"start":2590.38,"text":"GANs have been used in a variety of places. Here are some examples of images generated by a GAN. Here is a cool video of an astronaut dancing on Mars and later walking his dog on Mars that also uses a generative adversarial network. Cool. Now, as a recap..."},{"start":2620.14,"text":"We talked about training classifiers. These classifiers can be exploited when you optimize against them. And the solution is that during the RL process, if we update the classifier using negatives visited by the policy, then you can avoid it being exploited."},{"start":2639.69,"text":"One other thing that I wanted to skip today because we don't have too much time and need to talk about preferences, but you can also actually learn not just goal classifiers, but you can actually learn full reward functions. If you use all of the states in the demo as positive examples and all of the states in your policy rollouts as negatives, then..."},{"start":2662.92,"text":"you can show that we'll be trying to learn a reward function over state distributions"},{"start":2668.96,"text":"rather than just goal states."},{"start":2674.14,"text":"Cool."},{"start":2674.84,"text":"On the upside, there's a very practical framework."},{"start":2677.16,"text":"Adversarial training, adding these as negatives, it can be unstable."},{"start":2681.86,"text":"There are a variety of regularization tricks."},{"start":2684.36,"text":"You can actually take them just directly from the GAN literature and apply them."},{"start":2689.1,"text":"And that is quite helpful."},{"start":2690.9,"text":"And then one other big downside here is that this requires examples of what the goal is,"},{"start":2696.9,"text":"like what the desired behavior is. And sometimes generating those examples can be challenging or"},{"start":2704.3,"text":"time-consuming. Okay, so that's learning from example goals. Now let's talk about learning"}],"speech_gaps":[],"frame":"../frames/v035/016.webp","frame_time":2548.49},{"title":"奖励学习中的相对偏好与奖励函数构建","segments":[{"id":233,"text":"from preferences. So, and this is specifically, we're going to talk less about goal classifiers","start":2712.92,"end":2722.18},{"id":234,"text":"and talk more about scenarios where we don't just want to reach states within some goal set,","start":2722.18,"end":2726.62},{"id":235,"text":"but we actually want to potentially learn good behavior versus bad behavior. And that might","start":2726.8,"end":2732.96},{"id":236,"text":"instead of providing, instead of requiring example demonstrations or example goals, or in addition to that, we might want","start":2732.96,"end":2740.72},{"id":237,"text":"to provide feedback on the full rollout. Now, one option that we could do is we could just","start":2740.72,"end":2746.22},{"id":238,"text":"ask, how good is this trajectory? So say that you wanted to start at this blue dot and you","start":2746.22,"end":2752.84},{"id":239,"text":"want to reach the star as efficiently as possible. So it's actually kind of hard. Now, another","start":2752.84,"end":2761.16},{"id":240,"text":"way to frame this question is, which trajectory is better? So,","start":2761.16,"end":2769.86},{"id":241,"text":"who thinks the blue trajectory is better than the pink trajectory?","start":2769.86,"end":2773.06},{"id":242,"text":"who thinks the blue trajectory is better than the pink trajectory?","start":2773.84,"end":2777.12},{"id":243,"text":"Okay, everyone thinks the blue one. So that's a much easier question to answer, right? So these kind of relative preferences are often easier to provide than evaluating absolute performance of a trajectory. And this is true for lines in 2D, but it's also true in other use cases, many real-world use cases as well. So maybe you can use these kind of preferences to get a reward function.","start":2778.47,"end":2806.27},{"id":244,"text":"Say that a human told us that one trajectory was better than another trajectory, then probably one way to think about what they're saying is that the sum of rewards for the states in that trajectory, so for the states and actions in the better trajectory, this should probably be larger than the sum of rewards.","start":2810.96,"end":2839.51},{"id":245,"text":"for the states and actions in the trajectory that was said to be worse. And I'm using W and L to refer to the winning trajectory and the losing trajectory. And maybe we'll write this as the... When we say that the winning trajectory is better than the losing trajectory, we'll write this with this notation.","start":2840.58,"end":2867.41}],"notes":["本段讨论了在强化学习中，相对于直接提供目标或示范，使用相对偏好来构建奖励函数的优势。讲者指出，评估轨迹的相对性能（如蓝色轨迹优于粉色轨迹）通常比评估绝对性能更容易，这种相对偏好可以用于构建奖励函数。","讲者提到，如果人类指出某条轨迹优于另一条轨迹，可以认为该轨迹中状态和动作的奖励总和更大。这表明奖励函数可以通过比较轨迹的相对表现来推导。","讲者使用了W和L分别表示胜者轨迹和败者轨迹，并提到可以使用特定的符号来表示这种比较关系，但具体符号未明确说明。","讲者强调了相对偏好在实际应用中的重要性，特别是在高维空间或现实世界任务中，这种相对比较比绝对评估更可行。","讲者通过提问的方式引导学生思考相对轨迹性能的判断，这有助于理解如何从人类反馈中提取奖励信息。","讲者指出，相对偏好可以用于构建奖励函数，但需要明确如何将这些偏好转化为具体的奖励值，这可能涉及更复杂的建模过程。"],"formulas":[],"uncertainties":["讲者提到使用W和L表示胜者和败者轨迹，并提到使用特定符号表示比较关系，但未明确说明具体符号，因此无法确定符号的准确形式。"],"diagram":"none","start":2712.92,"end":2867.41,"asr_flags":[],"math_clarifications":["原文未明确说明奖励函数R的具体形式或定义，因此无法确定R(W) > R(L)是否成立。此外，原文强调的是相对偏好而非绝对奖励值的比较，因此该公式可能不适用。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2712.92,"text":"from preferences. So, and this is specifically, we're going to talk less about goal classifiers"},{"start":2722.18,"text":"and talk more about scenarios where we don't just want to reach states within some goal set,"},{"start":2726.8,"text":"but we actually want to potentially learn good behavior versus bad behavior. And that might"},{"start":2732.96,"text":"encapsulate something beyond just reaching a good state. And instead of providing, instead of"},{"start":2740.72,"text":"of requiring example demonstrations or example goals, or in addition to that, we might want"},{"start":2746.22,"text":"to provide feedback on the full rollout. Now, one option that we could do is we could just"},{"start":2752.84,"text":"ask, how good is this trajectory? So say that you wanted to start at this blue dot and you"},{"start":2761.16,"text":"want to reach the star as efficiently as possible. So it's actually kind of hard. Now, another"},{"start":2769.86,"text":"way to frame this question is, which trajectory is better? So,"},{"start":2773.84,"text":"who thinks the blue trajectory is better than the pink trajectory?"},{"start":2778.47,"text":"Okay, everyone thinks the blue one. So that's a much easier question to answer, right? So these kind of relative preferences are often easier to provide than evaluating absolute performance of a trajectory. And this is true for lines in 2D, but it's also true in other use cases, many real-world use cases as well. So maybe you can use these kind of preferences to get a reward function."},{"start":2810.96,"text":"Say that a human told us that one trajectory was better than another trajectory, then probably one way to think about what they're saying is that the sum of rewards for the states in that trajectory, so for the states and actions in the better trajectory, this should probably be larger than the sum of rewards."},{"start":2840.58,"text":"for the states and actions in the trajectory that was said to be worse. And I'm using W and L to refer to the winning trajectory and the losing trajectory. And maybe we'll write this as the... When we say that the winning trajectory is better than the losing trajectory, we'll write this with this notation."}],"speech_gaps":[],"frame":"../frames/v035/017.webp","frame_time":2724.92},{"title":"奖励学习中的偏好标签与奖励函数建模","segments":[{"id":246,"text":"Any individual preference label that's kind of binary saying A is better than B tells us a little bit of information about the reward. And from there, we want to figure out how to aggregate a number of these preference labels to learn a reward function. And so we'll assume that we have some data set of these pairs where","start":2871.55,"end":2897.62},{"id":247,"text":"We kind of have a pair of trajectories. We were told which one is the good one and which one is better than the other one. And we want to be able to use this data set to learn a reward function. And one perhaps simple way to do this is we want to model, we need kind of some way to write down an objective for a reward function. Let's also say that our reward function, let's model it as a neural network. So our reward function will have some parameters.","start":2899.02,"end":2930.15},{"id":248,"text":"And then you can think of it as taking as input a state in action and outputting a scalar reward value. So if you want to write down an objective for this, one thing we could do, let's say that this is kind of used similar shorthand to what we've used before. This is the reward of the trajectory, this expression right here. Then maybe we could say that if we","start":2930.78,"end":2963.44},{"id":249,"text":"took the reward of the better trajectory and subtracted the reward of the trajectory that's worse, then we want this quantity to be positive. So that's one starting point. And from there, we like to think about probabilities and do maximum likelihood training in machine learning in general.","start":2964.7,"end":2990.91},{"id":250,"text":"try to represent the probability that a trajectory is better than, one trajectory is better than","start":2993.13,"end":2999.39},{"id":251,"text":"another trajectory. And so what we could do is we could take this, we could pass this into a","start":2999.39,"end":3003.59},{"id":252,"text":"sigmoid function, which will kind of squash it between zero and one, and then represent that","start":3003.59,"end":3009.33},{"id":253,"text":"as the probability that the winning trajectory is better than the trajectory that was marked","start":3010.63,"end":3022.57},{"id":254,"text":"marked as inferior.","start":3022.57,"end":3023.27},{"id":255,"text":"And then if we did this, then we could","start":3024.85,"end":3027.69},{"id":256,"text":"try to maximize the probability under our reward function.","start":3028.99,"end":3034.25},{"id":257,"text":"So we could try to then optimize the reward function such","start":3034.41,"end":3039.25},{"id":258,"text":"that you're maximizing this probability.","start":3039.25,"end":3046.15}],"notes":["本段讲解了如何利用偏好标签来构建奖励函数。讲者提到，每个偏好标签（如A比B好）提供了关于奖励函数的一些信息，而目标是将这些标签聚合起来学习一个奖励函数。讲者假设我们有一个包含轨迹对的数据集，其中已知哪条轨迹更好。","讲者提出了一种简单的方法，即使用神经网络来建模奖励函数，并将奖励函数视为输入状态和动作，输出标量奖励值的函数。为了构建目标函数，讲者提到可以计算更好轨迹的奖励减去较差轨迹的奖励，并希望这个差值为正。","接下来，讲者讨论了如何将这个差值转化为概率，使用sigmoid函数将其压缩到0到1之间，表示更好轨迹的概率。这为后续的极大似然训练奠定了基础。","讲者进一步提到，如果能够最大化这个概率，就可以优化奖励函数，使得奖励函数能够更好地反映轨迹之间的偏好关系。这体现了强化学习中利用偏好数据进行奖励学习的基本思路。","讲者强调了从偏好标签到奖励函数的建模过程，包括如何将偏好转化为概率，以及如何通过最大化概率来优化奖励函数。这些步骤是奖励学习中的关键环节。","本段内容涉及偏好标签的处理、奖励函数的建模以及概率建模的基本思想，为后续的奖励学习方法提供了理论基础。"],"formulas":[],"uncertainties":["可能存在的断句问题，如 'one trajectory is better than' 可能应为 'one trajectory is better than another trajectory'，但未明确确认。"],"diagram":"none","start":2871.55,"end":3046.15,"asr_flags":[258],"math_clarifications":["原文中提到的奖励差值应作为sigmoid函数的输入，而不是直接作为轨迹的奖励值。因此，公式中的等号使用不严谨，需要修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2871.55,"text":"Any individual preference label that's kind of binary saying A is better than B tells us a little bit of information about the reward. And from there, we want to figure out how to aggregate a number of these preference labels to learn a reward function. And so we'll assume that we have some data set of these pairs where"},{"start":2899.02,"text":"We kind of have a pair of trajectories. We were told which one is the good one and which one is better than the other one. And we want to be able to use this data set to learn a reward function. And one perhaps simple way to do this is we want to model, we need kind of some way to write down an objective for a reward function. Let's also say that our reward function, let's model it as a neural network. So our reward function will have some parameters."},{"start":2930.78,"text":"And then you can think of it as taking as input a state in action and outputting a scalar reward value. So if you want to write down an objective for this, one thing we could do, let's say that this is kind of used similar shorthand to what we've used before. This is the reward of the trajectory, this expression right here. Then maybe we could say that if we"},{"start":2964.7,"text":"took the reward of the better trajectory and subtracted the reward of the trajectory that's worse, then we want this quantity to be positive. So that's one starting point. And from there, we like to think about probabilities and do maximum likelihood training in machine learning in general."},{"start":2993.13,"text":"try to represent the probability that a trajectory is better than, one trajectory is better than"},{"start":2999.39,"text":"another trajectory. And so what we could do is we could take this, we could pass this into a"},{"start":3003.59,"text":"sigmoid function, which will kind of squash it between zero and one, and then represent that"},{"start":3010.63,"text":"as the probability that the winning trajectory is better than the trajectory that was marked"},{"start":3022.57,"text":"marked as inferior."},{"start":3024.85,"text":"And then if we did this, then we could"},{"start":3028.99,"text":"try to maximize the probability under our reward function."},{"start":3034.41,"text":"So we could try to then optimize the reward function such"},{"start":3039.25,"text":"that you're maximizing this probability."}],"speech_gaps":[],"frame":"../frames/v035/018.webp","frame_time":2883.55},{"title":"奖励学习中的轨迹比较与奖励函数优化","segments":[{"id":259,"text":"So this would be then summed over the trajectory pairs","start":3046.43,"end":3052.05},{"id":260,"text":"in our data set.","start":3052.71,"end":3053.67},{"id":261,"text":"So specifically, we would take each of the pairs,","start":3056.61,"end":3059.07},{"id":262,"text":"take the sum of rewards for each of these,","start":3060.47,"end":3064.41},{"id":263,"text":"and then take a sigmoid,","start":3064.49,"end":3066.09},{"id":264,"text":"and then try to maximize that by running gradient.","start":3066.17,"end":3069.43},{"id":265,"text":"It's also worth mentioning these taus, you could do it on a full trajectory. But in some scenarios, if a full trajectory is like driving from like Palo Alto to San Francisco or cleaning a kitchen, then there's many different subcomponents of that. And it might be hard, like there might be some parts of that trajectory that are better and some parts that are worse. And so you could also do this on partial trajectories and saying like this part of this trajectory is better than this part.","start":3074.68,"end":3101.56},{"id":266,"text":"So you don't have to do it on full trajectories. We want a reward such that the sum of rewards for the better trajectory is higher than the sum of the rewards for the worst trajectory. Humans are classifying which trajectory is better. We want the reward to be discriminative of which trajectory is better. And so we define this probability that one trajectory is better than another trajectory.","start":3103.07,"end":3130.52},{"id":267,"text":"And then with this probability, you can try to maximize the reward parameters such that this is true. Yeah, so the question was, the human isn't telling us how much better a trajectory is. And you could have a scenario where maybe one trajectory is like this, one trajectory is like this, and then a third trajectory is like, I don't know, going all the way over here or something. And this objective isn't...","start":3131.18,"end":3160.53},{"id":268,"text":"taking into account the fact that the preference of this over this is a smaller preference than the preference of this over this. When you end up optimizing this objective, oftentimes it will actually turn out that it will assign something. I guess a couple things here. If you have a lot of data,","start":3161.27,"end":3186.8},{"id":269,"text":"then it will also tell you that the solid green one is better than this one. And so you'll actually get lots of pairwise preferences on them. And so because of those pairwise preferences, you'll see a ranking like this is better than this, this is better than this, this is better than this. And when you do that, that'll force the reward function to assign a much higher reward value to this one compared to this one.","start":3187.38,"end":3214.78}],"notes":["本段讨论了在奖励学习中如何通过比较轨迹对来优化奖励函数。具体来说，对于每一对轨迹，计算它们的奖励总和，然后通过sigmoid函数进行转换，最后通过梯度上升来最大化这个转换后的值。这种方法允许模型从人类提供的轨迹偏好中学习到一个能够区分轨迹优劣的奖励函数。","讲者提到，虽然可以使用完整轨迹进行比较，但在某些场景下，如从帕洛阿尔托到旧金山的驾驶或清洁厨房等任务，轨迹可能包含多个子部分，这些子部分可能有好坏之分。因此，也可以在部分轨迹上进行比较，以更精细地捕捉轨迹的优劣。","讲者进一步指出，目标是定义一个奖励函数，使得更好轨迹的奖励总和高于更差轨迹的奖励总和。人类会提供轨迹的偏好，而奖励函数需要具有判别性，能够区分哪些轨迹更好。","讲者提到，通过定义轨迹之间更好的概率，可以尝试最大化奖励参数，使得这一概率成立。然而，人类并不提供轨迹之间差异的具体程度，因此需要通过大量数据来推断这些偏好。","讲者指出，当有大量数据时，系统会发现某些轨迹明显优于其他轨迹，并通过这些成对的偏好来构建一个排序，从而迫使奖励函数为某些轨迹分配更高的奖励值。","最后，讲者强调，这种优化过程可能会导致奖励函数对某些轨迹赋予更高的奖励值，从而实现对轨迹优劣的区分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3046.43,"end":3214.78,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3046.43,"text":"So this would be then summed over the trajectory pairs"},{"start":3052.71,"text":"in our data set."},{"start":3056.61,"text":"So specifically, we would take each of the pairs,"},{"start":3060.47,"text":"take the sum of rewards for each of these,"},{"start":3064.49,"text":"subtract them, take a sigmoid,"},{"start":3066.17,"text":"and then try to maximize that by running gradient."},{"start":3074.68,"text":"It's also worth mentioning these taus, you could do it on a full trajectory. But in some scenarios, if a full trajectory is like driving from like Palo Alto to San Francisco or cleaning a kitchen, then there's many different subcomponents of that. And it might be hard, like there might be some parts of that trajectory that are better and some parts that are worse. And so you could also do this on partial trajectories and saying like this part of this trajectory is better than this part."},{"start":3103.07,"text":"So you don't have to do it on full trajectories. We want a reward such that the sum of rewards for the better trajectory is higher than the sum of the rewards for the worst trajectory. Humans are classifying which trajectory is better. We want the reward to be discriminative of which trajectory is better. And so we define this probability that one trajectory is better than another trajectory."},{"start":3131.18,"text":"And then with this probability, you can try to maximize the reward parameters such that this is true. Yeah, so the question was, the human isn't telling us how much better a trajectory is. And you could have a scenario where maybe one trajectory is like this, one trajectory is like this, and then a third trajectory is like, I don't know, going all the way over here or something. And this objective isn't..."},{"start":3161.27,"text":"taking into account the fact that the preference of this over this is a smaller preference than the preference of this over this. When you end up optimizing this objective, oftentimes it will actually turn out that it will assign something. I guess a couple things here. If you have a lot of data,"},{"start":3187.38,"text":"then it will also tell you that the solid green one is better than this one. And so you'll actually get lots of pairwise preferences on them. And so because of those pairwise preferences, you'll see a ranking like this is better than this, this is better than this, this is better than this. And when you do that, that'll force the reward function to assign a much higher reward value to this one compared to this one."}],"speech_gaps":[],"frame":"../frames/v035/019.webp","frame_time":3058.43},{"title":"奖励学习中的偏好收集与梯度更新","segments":[{"id":270,"text":"So it will already do what you want. You could also, there's a couple other ways to get this information. Sometimes when you actually ask humans for preferences, sometimes you also just give them a batch and tell them their rank as well. And that would make this even more explicit. So the complete algorithm for what this looks like is you have some data set of trajectories.","start":3215.32,"end":3242.85},{"id":271,"text":"you're going to sample batches of k trajectories and then ask a human to rank those k trajectories. For language models, when you do this, so this is actually a very common way to learn reward functions for language models, and you'll often actually use the same prompt and sample k responses and then ask them to rank those k responses. And this is useful because...","start":3243.45,"end":3269.2},{"id":272,"text":"These trajectories all start from some initial point. You can think of this as starting from the same prompt, but you might have other responses that are starting from a different prompt over here. And for a different prompt or from a different starting place, it's a lot harder to talk about, is this black one better than this green one? It got there, maybe it got here faster, but it also was an easier starting point, right?","start":3270.41,"end":3294.73},{"id":273,"text":"And so oftentimes we'll try to sample about destructories that have a similar starting position. Then we will compute the rewards under our current reward model, essentially do a forward pass and sum over the states and actions. And then we can compute the gradient, do a backward pass using our objective where this is for every pair of","start":3295.61,"end":3320.85},{"id":274,"text":"for each pair within the ranking. So there's kind of K-Choose-2 different combinations of pairs. And if you have a ranking, then you'll have a full set of K-Choose-2 labels.","start":3321.91,"end":3335.17},{"id":275,"text":"And then you can update theta using the computed gradient. And then you can also repeat this process. So repeating this just corresponds to doing kind of gradient descent on your objective on a single data set. Now, one thing that you can also do is you can also do this in the loop of reinforcement learning. So you have your samples from your policy, and then you can ask for,","start":3338.13,"end":3369.66}],"notes":["本段讲解了在奖励学习中如何通过人类偏好来训练奖励模型。具体方法是通过采样轨迹并让人类对这些轨迹进行排序，从而获得更明确的偏好信息。这种方法在语言模型中非常常见，通常会使用相同的提示词生成多个响应，再让人类对这些响应进行排序。","在进行梯度更新时，需要确保所有轨迹具有相似的起始点，以减少比较时的偏差。计算奖励时，会进行前向传播并累加状态和动作的奖励值，然后通过反向传播计算梯度，以优化奖励模型的参数。","对于每一对轨迹，都会生成K-Choose-2种组合，从而得到完整的标签集。这有助于更全面地利用人类的偏好信息，提高奖励模型的准确性。","梯度更新过程可以重复进行，相当于在单个数据集上进行梯度下降。此外，这种方法也可以嵌入到强化学习的循环中，利用策略生成的样本进行偏好收集和模型更新。"],"formulas":[],"uncertainties":["destructories"],"diagram":"none","start":3215.32,"end":3369.66,"asr_flags":[],"math_clarifications":["原文中提到的'K-Choose-2'是组合数的表达方式，但未提供完整的数学公式或上下文来明确其定义。因此，无法核定其正确性，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3215.32,"text":"So it will already do what you want. You could also, there's a couple other ways to get this information. Sometimes when you actually ask humans for preferences, sometimes you also just give them a batch and tell them their rank as well. And that would make this even more explicit. So the complete algorithm for what this looks like is you have some data set of trajectories."},{"start":3243.45,"text":"you're going to sample batches of k trajectories and then ask a human to rank those k trajectories. For language models, when you do this, so this is actually a very common way to learn reward functions for language models, and you'll often actually use the same prompt and sample k responses and then ask them to rank those k responses. And this is useful because..."},{"start":3270.41,"text":"These trajectories all start from some initial point. You can think of this as starting from the same prompt, but you might have other responses that are starting from a different prompt over here. And for a different prompt or from a different starting place, it's a lot harder to talk about, is this black one better than this green one? It got there, maybe it got here faster, but it also was an easier starting point, right?"},{"start":3295.61,"text":"And so oftentimes we'll try to sample about destructories that have a similar starting position. Then we will compute the rewards under our current reward model, essentially do a forward pass and sum over the states and actions. And then we can compute the gradient, do a backward pass using our objective where this is for every pair of"},{"start":3321.91,"text":"for each pair within the ranking. So there's kind of K-Choose-2 different combinations of pairs. And if you have a ranking, then you'll have a full set of K-Choose-2 labels."},{"start":3338.13,"text":"And then you can update theta using the computed gradient. And then you can also repeat this process. So repeating this just corresponds to doing kind of gradient descent on your objective on a single data set. Now, one thing that you can also do is you can also do this in the loop of reinforcement learning. So you have your samples from your policy, and then you can ask for,"}],"speech_gaps":[],"frame":"../frames/v035/020.webp","frame_time":3227.32},{"title":"奖励学习中的偏好反馈与奖励函数更新","segments":[{"id":276,"text":"Humans to rank them and then update your rewards. And then after you have your updated reward model, then maybe your reward model is more accurate. And maybe you want to be going like here, for example, instead of going here, then you could then re-update your reward function and then update your policy again, and then get new rollouts for your policy, ask a human to label those rollouts, re-update your reward function and repeat.","start":3370.83,"end":3399.25},{"id":277,"text":"Okay. So that's how we can learn from preferences. There's a few examples of this. So some of the first times people have learned from preferences were in some simulated settings. So in this case, if you want to get this simulated thing to do a backflip, it's very hard to write a reward function for doing a backflip. And so they used 900... queries.","start":3403.31,"end":3427.64},{"id":278,"text":"They asked humans 900 times, like, is this better than this? They actually did it in the loop of reinforcement learning. And they got a policy that is able to learn how to do a backflip and in the process also learn a reward function for a human preferred backflip.","start":3429.06,"end":3446.58},{"id":279,"text":"Also in driving, it's very hard to get reward functions. And so there was work that used this kind of approach to learn things like how much does it matter to stay within your lane, keep a certain speed, collision avoidance, those sorts of things. And you would imagine that collision avoidance is much, much more important than keeping a certain speed, for example. And you can learn a reward function that way.","start":3448.3,"end":3471.48},{"id":280,"text":"Cool. And then there's also language models. So this has been a very popular way to learn rewards for language models. And you can have some prompt, like, how do I cook an omelet? Then you can sample from your language model two different responses for that prompt. Then we ask a person which response is better.","start":3472.33,"end":3490.88},{"id":281,"text":"When we're doing training, we might actually pay people to label our data. You might have also, if you've interacted with ChatGPT, sometimes it might have asked you these sorts of things. You're providing labels to give OpenAI the ability to learn a reward function that is better for your preferences. And then once you have the things that are better, then you can train a reward model that judges how good a response Y is for a given prompt.","start":3491.56,"end":3518.11},{"id":282,"text":"And so then in terms of what the kind of full language model pipeline is, like if you wanted to train something like ChatGPT, first you'll do some large scale pre-training on like very, very large mixed quality data with kind of just predicting the next token. Then you typically have a second stage, which is to fine tune on higher quality data. And in particular, after step one,","start":3521.65,"end":3550.23}],"notes":["本段讲解了如何通过人类的偏好反馈来学习奖励函数。首先，人类对不同的策略进行排序，然后更新奖励模型。更新后的奖励模型可能更准确，之后可以重新更新奖励函数并更新策略，再获取新的策略执行结果，让人类对这些结果进行标注，再次更新奖励函数并重复这一过程。","在模拟环境中，例如让模拟体完成后空翻，直接编写奖励函数非常困难。因此，研究者使用了900次查询，让人类判断两个结果哪个更好，并在强化学习的循环中进行训练，最终得到了能够完成后空翻的策略，并同时学习了人类偏好的奖励函数。","在驾驶任务中，编写奖励函数同样困难。研究者使用了类似的偏好反馈方法，学习了诸如保持车道、保持速度、避障等任务的重要性。例如，避障比保持速度更重要，可以通过这种方式学习奖励函数。","在语言模型中，偏好反馈被广泛用于学习奖励函数。例如，对于“如何做煎蛋”这样的提示，模型会生成两个不同的回答，然后让人类选择更好的回答。通过这种方式，可以训练出更符合人类偏好的奖励模型。","在训练过程中，研究者可能会支付人类标注数据。例如，用户在使用ChatGPT时，有时会被询问对回答的偏好，从而帮助OpenAI学习更符合用户偏好的奖励函数。","语言模型的训练流程通常包括两个阶段：首先进行大规模的预训练，使用大量混合质量的数据进行下一个词的预测；然后进行微调，使用高质量数据进一步优化模型。在预训练之后，会进行奖励函数的学习和优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3370.83,"end":3550.23,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3370.83,"text":"humans to rank them and then update your rewards. And then after you have your updated reward model, then maybe your reward model is more accurate. And maybe you want to be going like here, for example, instead of going here, then you could then re-update your reward function and then update your policy again, and then get new rollouts for your policy, ask a human to label those rollouts, re-update your reward function and repeat."},{"start":3403.31,"text":"Okay. So that's how we can learn from preferences. There's a few examples of this. So some of the first times people have learned from preferences were in some simulated settings. So in this case, if you want to get this simulated thing to do a backflip, it's very hard to write a reward function for doing a backflip. And so they used 900..."},{"start":3429.06,"text":"queries. They asked humans 900 times, like, is this better than this? They actually did it in the loop of reinforcement learning. And they got a policy that is able to learn how to do a backflip and in the process also learn a reward function for a human preferred backflip."},{"start":3448.3,"text":"Also in driving, it's very hard to get reward functions. And so there was work that used this kind of approach to learn things like how much does it matter to stay within your lane, keep a certain speed, collision avoidance, those sorts of things. And you would imagine that collision avoidance is much, much more important than keeping a certain speed, for example. And you can learn a reward function that way."},{"start":3472.33,"text":"Cool. And then there's also language models. So this has been a very popular way to learn rewards for language models. And you can have some prompt, like, how do I cook an omelet? Then you can sample from your language model two different responses for that prompt. Then we ask a person which response is better."},{"start":3491.56,"text":"When we're doing training, we might actually pay people to label our data. You might have also, if you've interacted with ChatGPT, sometimes it might have asked you these sorts of things. You're providing labels to give OpenAI the ability to learn a reward function that is better for your preferences. And then once you have the things that are better, then you can train a reward model that judges how good a response Y is for a given prompt."},{"start":3521.65,"text":"And so then in terms of what the kind of full language model pipeline is, like if you wanted to train something like ChatGPT, first you'll do some large scale pre-training on like very, very large mixed quality data with kind of just predicting the next token. Then you typically have a second stage, which is to fine tune on higher quality data. And in particular, after step one,"}],"speech_gaps":[],"frame":"../frames/v035/021.webp","frame_time":3382.83},{"title":"奖励学习（Reward Learning）","segments":[{"id":283,"text":"Before you do any kind of supervised fine-tuning or reinforcement learning, you'll get a language model that knows a lot of things, but it's not easy to control or to get it to do what you want it to do. And it might not answer questions. It might not do what you requested. It might just predict reasonable next tokens that come after that. Whereas in supervised fine-tuning, we can generate a higher quality data set that has like for a given prompt, this is how you should reply. And so we do some kind of basically imitation learning on that data set.","start":3552.67,"end":3580.61},{"id":284,"text":"And then there's a third step, which is to use the human feedback and then kind of fine-tune the model that you got from supervised fine-tuning on higher quality preference data.","start":3581.74,"end":3592.5},{"id":285,"text":"And what this third step looks like is first you gather the preference data.","start":3593.38,"end":3596.52},{"id":286,"text":"There are also actually existing preference data sets that you can use as well.","start":3596.88,"end":3600.92},{"id":287,"text":"You don't necessarily have to collect it using your model.","start":3601.02,"end":3607.36},{"id":288,"text":"model. Second, you'll train a reward model that is judging how good a response is. And","start":3607.36,"end":3615.58},{"id":289,"text":"then lastly, you'll do reinforcement learning to maximize that reward function.","start":3615.58,"end":3618.44},{"id":290,"text":"We will talk more about preference learning on Wednesday next week, but one somewhat common","start":3619.36,"end":3625.06},{"id":291,"text":"approach is to use PPO to maximize the reward. The question is, is X just the prompt or is","start":3625.06,"end":3633.16},{"id":292,"text":"Is it the whole history?","start":3633.16,"end":3633.82},{"id":293,"text":"Oftentimes, it's the whole history.","start":3634.72,"end":3636.42},{"id":294,"text":"And you can sort of...","start":3637.32,"end":3640.4},{"id":295,"text":"Oftentimes, generally also when you formulate RL problems for language models,","start":3640.92,"end":3644.72},{"id":296,"text":"you will have...","start":3645.28,"end":3646.62},{"id":297,"text":"You can model it as a sequential problem,","start":3647.68,"end":3649.9},{"id":298,"text":"but you can also...","start":3650.1,"end":3651.84},{"id":299,"text":"There's a simpler but more crude way to model it,","start":3653.36,"end":3657.42},{"id":300,"text":"which is to use all the history and just treat the next response","start":3657.5,"end":3659.66},{"id":301,"text":"as the thing that you're optimizing over.","start":3659.66,"end":3661.7},{"id":302,"text":"So the question is how do we go from preference rankings to this probability right here? So in","start":3662.52,"end":3669.44},{"id":303,"text":"our preferences we're saying that we might have a ranking, say like A is better than B which is","start":3669.44,"end":3674.58},{"id":304,"text":"better than C. If we have a ranking of k trajectories then we can formulate k choose","start":3674.58,"end":3681.54},{"id":305,"text":"two pairs where and within each pair we'll have like an A is better than B or B is better than","start":3681.54,"end":3689.3},{"id":306,"text":"And.","start":3689.3,"end":3689.34},{"id":307,"text":"We're using tau w to represent the response or the trajectory that was preferred and tau l to represent the one that was dispreferred. And then we sample one of those pairs, one of those case-choose pairs, and then we plug it into this equation right here.","start":3689.98,"end":3707.68}],"notes":["本段讨论了奖励学习中的一个关键问题，即如何从偏好排序转化为概率分布。讲者提到，当有k条轨迹的偏好排序时，可以生成k选2对，每对中包含一个更优轨迹和一个较差轨迹。这种配对方式为后续的奖励模型训练提供了数据基础。","讲者指出，偏好排序可以转化为概率分布，这需要将偏好信息输入到特定的公式中。例如，使用τ_w表示被偏好轨迹，τ_l表示不被偏好轨迹，然后从这些配对中采样并代入公式进行计算。","在实际操作中，奖励模型的训练依赖于这些偏好数据，而这些数据可以通过收集用户反馈或使用已有的偏好数据集来获得。这一步骤是强化学习流程中的关键环节。","讲者还提到，强化学习问题可以建模为序列问题，也可以采用更简单但粗糙的方法，即使用所有历史信息并将其视为优化目标。这表明在实际应用中，可以根据具体需求选择不同的建模方式。","最后，讲者强调了从偏好排序到概率分布的转换过程，这一步骤是构建奖励模型的基础，也是整个奖励学习流程中的核心部分。","讲者在讨论中提到，奖励函数的优化是通过强化学习算法（如PPO）来实现的，这表明奖励学习与强化学习的结合是实现模型行为优化的重要手段。"],"formulas":[],"uncertainties":["And."],"diagram":"none","start":3552.67,"end":3707.68,"asr_flags":[306],"math_clarifications":["原文中提到使用偏好排名来构建概率，但未提供具体的数学公式或条件来支持该概率表达式。因此，该公式无法核定，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3552.67,"text":"Before you do any kind of supervised fine-tuning or reinforcement learning, you'll get a language model that knows a lot of things, but it's not easy to control or to get it to do what you want it to do. And it might not answer questions. It might not do what you requested. It might just predict reasonable next tokens that come after that. Whereas in supervised fine-tuning, we can generate a higher quality data set that has like for a given prompt, this is how you should reply. And so we do some kind of basically imitation learning on that data set."},{"start":3581.74,"text":"And then there's a third step, which is to use the human feedback and then kind of fine-tune the model that you got from supervised fine-tuning on higher quality preference data."},{"start":3593.38,"text":"And what this third step looks like is first you gather the preference data."},{"start":3596.88,"text":"There are also actually existing preference data sets that you can use as well."},{"start":3601.02,"text":"You don't necessarily have to collect it using your model."},{"start":3607.36,"text":"model. Second, you'll train a reward model that is judging how good a response is. And"},{"start":3615.58,"text":"then lastly, you'll do reinforcement learning to maximize that reward function."},{"start":3619.36,"text":"We will talk more about preference learning on Wednesday next week, but one somewhat common"},{"start":3625.06,"text":"approach is to use PPO to maximize the reward. The question is, is X just the prompt or is"},{"start":3633.16,"text":"Is it the whole history?"},{"start":3634.72,"text":"Oftentimes, it's the whole history."},{"start":3637.32,"text":"And you can sort of..."},{"start":3640.92,"text":"Oftentimes, generally also when you formulate RL problems for language models,"},{"start":3645.28,"text":"you will have..."},{"start":3647.68,"text":"You can model it as a sequential problem,"},{"start":3650.1,"text":"but you can also..."},{"start":3653.36,"text":"There's a simpler but more crude way to model it,"},{"start":3657.5,"text":"which is to use all the history and just treat the next response"},{"start":3659.66,"text":"as the thing that you're optimizing over."},{"start":3662.52,"text":"So the question is how do we go from preference rankings to this probability right here? So in"},{"start":3669.44,"text":"our preferences we're saying that we might have a ranking, say like A is better than B which is"},{"start":3674.58,"text":"better than C. If we have a ranking of k trajectories then we can formulate k choose"},{"start":3681.54,"text":"two pairs where and within each pair we'll have like an A is better than B or B is better than"},{"start":3689.3,"text":"And."},{"start":3689.98,"text":"We're using tau w to represent the response or the trajectory that was preferred and tau l to represent the one that was dispreferred. And then we sample one of those pairs, one of those case-choose pairs, and then we plug it into this equation right here."}],"speech_gaps":[],"frame":"../frames/v035/022.webp","frame_time":3564.67},{"title":"奖励学习（Reward Learning）","segments":[{"id":308,"text":"So you're asking what is the sigma function? Yeah, so the sigma function here, this is a sigmoid. So it is basically a function that squashes the values between 0 and 1. And so it's just a very simple function that I can't remember. I think it looks something like this, where this is 1. So yeah, I'm just using sigma.","start":3708.49,"end":3736.82},{"id":309,"text":"sigma right here. So just this function right here. Okay. One other thing you can do is instead of using human feedback, you could also have an AI model. You could ask a strong model, like, is this better than this? The one thing that I'll note is when you are thinking about what is preferred and dispreferred, there are a variety of different axes in which something might be preferred or dispreferred. And so you could, in some cases, you might be able to ask,","start":3737.91,"end":3768.03},{"id":310,"text":"for certain things that you care about from the model. This is often referred to as reinforcement learning with AI feedback. As one example of a use case, people have used this to try to prevent models from producing harmful content. And so they will feed two responses into the model and ask the model which response is less harmful.","start":3768.36,"end":3794.2},{"id":311,"text":"One insight here is that critique is often easier than generation. And so this is one of the reasons why you might be able to get a stronger model with AI feedback than otherwise. And there have been some works that show that if you use this kind of feedback, this AI feedback, you can get an improvement in model performance on different axes.","start":3795.36,"end":3819.32},{"id":312,"text":"Okay, so a summary of reward learning. Rewards cannot be taken for granted. We've talked about learning from goals. We talked about learning from human preferences. For goals, it's quite practical. Adversarial trading can be a little bit tricky to optimize, and it requires examples of desired behavior. With preferences, pairwise preferences are really easy to provide. It doesn't require example goals or example demonstrations.","start":3823.16,"end":3849.37},{"id":313,"text":"It has been deployed at really, really large scales with language models. It may require some supervision in the loop of reinforcement learning. One of the things that I encourage everyone to think about is goals and human preferences. Those are some form of feedback, but there's a lot of other ways that we might be able to provide supervision to agents that are trying to learn.","start":3850.33,"end":3875.86},{"id":314,"text":"You could even verbally tell it some information like, that was good, or that was helpful, or that was helpful but kind of mean, or something like that.","start":3876.56,"end":3885.1}],"notes":["本段主要讲解了奖励学习中的σ函数，即Sigmoid函数，它将输入值压缩到0到1之间。讲者提到σ函数是一个简单的函数，但记不清具体形式，认为它类似于一个S形曲线，且在某些情况下会使用σ函数。","讲者提到，除了使用人类反馈，还可以使用AI模型进行反馈。例如，可以询问一个强大的模型，某个选项是否更好。同时，指出在判断偏好和不偏好时，存在多种不同的维度，因此在某些情况下可以询问模型。","讲者举了一个使用AI反馈的例子，即防止模型生成有害内容。具体做法是将两个响应输入模型，并询问模型哪个响应更不有害。","讲者指出，批评通常比生成更容易，因此使用AI反馈可以得到更强的模型。已有研究表明，使用这种反馈可以提高模型在不同维度上的性能。","本段总结了奖励学习，指出奖励不能被默认。学习目标和人类偏好是两种主要方式。目标学习较为实用，但对抗性交易优化较为困难，需要示例行为。而偏好学习中，成对偏好更容易提供，不需要目标示例或演示。","讲者提到，奖励学习已在大规模语言模型中部署，可能需要在强化学习过程中进行监督。鼓励大家思考目标和人类偏好，但还有其他方式可以为学习代理提供监督，例如通过口头反馈。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3708.49,"end":3885.1,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3708.49,"text":"So you're asking what is the sigma function? Yeah, so the sigma function here, this is a sigmoid. So it is basically a function that squashes the values between 0 and 1. And so it's just a very simple function that I can't remember. I think it looks something like this, where this is 1. So yeah, I'm just using sigma."},{"start":3737.91,"text":"sigma right here. So just this function right here. Okay. One other thing you can do is instead of using human feedback, you could also have an AI model. You could ask a strong model, like, is this better than this? The one thing that I'll note is when you are thinking about what is preferred and dispreferred, there are a variety of different axes in which something might be preferred or dispreferred. And so you could, in some cases, you might be able to ask,"},{"start":3768.36,"text":"for certain things that you care about from the model. This is often referred to as reinforcement learning with AI feedback. As one example of a use case, people have used this to try to prevent models from producing harmful content. And so they will feed two responses into the model and ask the model which response is less harmful."},{"start":3795.36,"text":"One insight here is that critique is often easier than generation. And so this is one of the reasons why you might be able to get a stronger model with AI feedback than otherwise. And there have been some works that show that if you use this kind of feedback, this AI feedback, you can get an improvement in model performance on different axes."},{"start":3823.16,"text":"Okay, so a summary of reward learning. Rewards cannot be taken for granted. We've talked about learning from goals. We talked about learning from human preferences. For goals, it's quite practical. Adversarial trading can be a little bit tricky to optimize, and it requires examples of desired behavior. With preferences, pairwise preferences are really easy to provide. It doesn't require example goals or example demonstrations."},{"start":3850.33,"text":"It has been deployed at really, really large scales with language models. It may require some supervision in the loop of reinforcement learning. One of the things that I encourage everyone to think about is goals and human preferences. Those are some form of feedback, but there's a lot of other ways that we might be able to provide supervision to agents that are trying to learn."},{"start":3876.56,"text":"You could even verbally tell it some information like, that was good, or that was helpful, or that was helpful but kind of mean, or something like that."}],"speech_gaps":[],"frame":"../frames/v035/023.webp","frame_time":3720.49},{"title":"奖励学习中的自主目标设定","segments":[{"id":315,"text":"And you could think of other ways of providing supervision, and I think that this is an area of research where I think that there's more things that can be done.","start":3885.54,"end":3895.0},{"id":316,"text":"One other thing that I'll mention is there's also some cool work in the reinforcement learning research landscape","start":3895.58,"end":3902.84},{"id":317,"text":"where you can potentially have reinforcement learning agents propose their own goals","start":3902.84,"end":3907.74},{"id":318,"text":"rather than having a human provide a goal.","start":3907.74,"end":3910.42},{"id":319,"text":"This is often referred to as this area of unsupervised reinforcement learning,","start":3911.22,"end":3916.38},{"id":320,"text":"where a human is not telling the agent what it should do.","start":3916.5,"end":3919.58},{"id":321,"text":"Instead, the agent should have its own sort of curiosity.","start":3919.62,"end":3922.16},{"id":322,"text":"One example of this is you can have one agent setting a goal, another agent trying to reach","start":3924.02,"end":3929.3},{"id":323,"text":"the goal, and you can formulate this as a game between these two different agents.","start":3929.3,"end":3933.48},{"id":324,"text":"And there's some cool work that shows that you can have that if you have these two different agents","start":3938.18,"end":3943.78},{"id":325,"text":"that are trying to play against each other where one is the goal setter, one is trying to reach","start":3944.3,"end":3948.5},{"id":326,"text":"the goals, you can get some kind of cool behavior as a result.","start":3948.5,"end":3952.18}],"notes":["本段讲授了强化学习中自主目标设定的概念，即智能体可以自行设定目标，而不是由人类提供目标。这种设定通常被称为无监督强化学习，强调智能体的内在好奇心。","讲者提到，这种自主目标设定可以通过两个智能体之间的博弈来实现：一个智能体设定目标，另一个智能体尝试达成目标。这种博弈机制可以产生有趣的行为。","讲者指出，这种机制在强化学习研究领域中已有相关工作，表明通过两个智能体之间的对抗，可以实现目标设定和达成的动态过程。","讲者强调，这种自主目标设定是奖励学习的一个重要方向，它减少了对人类监督的依赖，同时激发了智能体的探索行为。","讲者提到，这种机制可以产生一些有趣的智能体行为，但具体实现细节和效果可能需要进一步研究。","讲者没有明确说明这种博弈机制的具体数学模型或公式，因此无法进一步推导相关公式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3885.54,"end":3952.18,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3885.54,"text":"And you could think of other ways of providing supervision, and I think that this is an area of research where I think that there's more things that can be done."},{"start":3895.58,"text":"One other thing that I'll mention is there's also some cool work in the reinforcement learning research landscape"},{"start":3902.84,"text":"where you can potentially have reinforcement learning agents propose their own goals"},{"start":3907.74,"text":"rather than having a human provide a goal."},{"start":3911.22,"text":"This is often referred to as this area of unsupervised reinforcement learning,"},{"start":3916.5,"text":"where a human is not telling the agent what it should do."},{"start":3919.62,"text":"Instead, the agent should have its own sort of curiosity."},{"start":3924.02,"text":"One example of this is you can have one agent setting a goal, another agent trying to reach"},{"start":3929.3,"text":"the goal, and you can formulate this as a game between these two different agents."},{"start":3938.18,"text":"And there's some cool work that shows that you can have that if you have these two different agents"},{"start":3944.3,"text":"that are trying to play against each other where one is the goal setter, one is trying to reach"},{"start":3948.5,"text":"the goals, you can get some kind of cool behavior as a result."}],"speech_gaps":[{"start":3934.256,"end":3937.78}],"frame":"../frames/v035/024.webp","frame_time":3897.54}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
