 your reward signal.","zh":"具体来说，这种方法会是：你首先收集成功状态和失败状态的例子。你可以将这些状态视为某种目标集合中的状态和不在该目标集合中的状态，然后尝试进行二分类。","start":1747.37,"end":1751.71},{"id":185,"text":"So specifically what this would look like is you first collect examples of successful","zh":"然后使用这个分类器进行强化学习。如果采用这种方法，大家有没有想到可能会出什么问题？是的。这种方法的一个缺点是它会给你一个非常稀疏的奖励。它只会告诉你，你是否处于这个目标状态集合中，或者是否在集合之外。你需要想办法朝着这个目标前进。还有其他挑战或可能出错的地方吗？","start":1753.93,"end":1757.31},{"id":186,"text":"successful states, unsuccessful states. You can think of this as states within some sort","zh":"是的，可能发生第二件事是，它可能会学会欺骗分类器，但并没有真正完成你感兴趣的任。","start":1757.31,"end":1761.15},{"id":187,"text":"of goal set and states outside of that goal set, and then trying to binary classify.","zh":"特别是当你训练分类器时，它是基于你提供的示例分布进行训练的。但你正在学习的策略有能力访问大量的不同状态，包括与个体数据集不同的状态。","start":1761.15,"end":1766.37},{"id":188,"text":"And then run reinforcement learning with this classifier. Does anyone have thoughts on what could go wrong if you took this approach? Yeah. So one downside with this approach is that it's going to give you a very sparse reward. It's just going to tell you, are you kind of within this kind of set of goal states or are you outside of it? And you would need to figure out how to make progress towards that. Is there any other challenges or any other things that might go wrong?","zh":"然后使用这个分类器运行强化学习。如果采用这种方法，大家有没有想到可能会出什么问题？是的。这种方法的一个缺点是它会给你一个非常稀疏的奖励。它只会告诉你，你是否处于这种目标状态的集合中，还是处于集合之外。你需要想办法如何朝着这个目标前进。还有其他挑战或可能出现的问题吗？","start":1768.66,"end":1797.47},{"id":189,"text":"Yeah, so a second thing that might happen is it might learn to fool the classifier, but not actually do the tasks that you're interested in. And in particular, when you train a classifier, it's trained on some distribution of examples that you provided. But the policy that you're learning has the ability to visit lots of different states, including states that are different from the individual data set.","zh":"是的，可能发生第二件事是它可能会学会欺骗分类器，但并没有真正完成你感兴趣的那些任务。特别是当你训练一个分类器时，它是基于你提供的示例分布进行训练的。但你正在学习的策略有能力访问大量的不同状态，包括与个别数据集不同的状态。","start":1798.29,"end":1823.35},{"id":190,"text":"And in some ways, kind of analogous to some of the challenges we saw in offline RL, when you're optimizing against this classifier, you can kind of hack it or fool it and find states where that classifier is inaccurate. And when it's inaccurate, some of the times it might be optimistic about how to do the task.","zh":"在某些方面，这与我们在离线强化学习中看到的一些挑战有些类似。当你针对这个分类器进行优化时，你可以通过某种方式欺骗它，找到该分类器不准确的状态。当它不准确时，有时它可能会对如何完成任务过于乐观。","start":1823.97,"end":1843.95},{"id":191,"text":"The first answer was absolutely correct. It does provide a sparse signal. But one especially thing that can go extra wrong here is that the RL algorithm will seek out states that the classifier thinks are good. And it might simply find states that the classifier wasn't trained on, and essentially exploiting the classifier's weaknesses. So can we prevent the algorithm from exploiting the weaknesses?","zh":"第一个答案绝对是正确的。它确实提供了一个稀疏的信号。但特别需要注意的是，强化学习算法会寻找分类器认为是好的状态。它可能会简单地找到分类器未训练过的状态，从而实质上利用分类器的弱点。那么，我们能否防止算法利用这些弱点呢？","start":1846.09,"end":1870.62},{"id":192,"text":"In some ways, it's actually kind of nice that we're talking about this at the same time in which we talked about CQL. Because you can actually use an approach that's very similar to CQL for preventing the RL algorithm from exploiting the weaknesses. And in particular, say that you have some kind of positive goal states over here.","zh":"在某些方面，我们同时讨论这一点其实是很不错的，因为我们之前也讨论了CQL。实际上，你可以使用一种与CQL非常相似的方法来防止强化学习算法利用这些弱点。特别是，假设你有一些正面的目标状态在这里。","start":1872.42,"end":1896.84}],"notes":["本段讨论了使用二分类器作为奖励信号的方法，即通过标记正例和负例来生成奖励信号。这种方法虽然直观，但存在奖励稀疏的问题，因为分类器只能提供是否处于目标状态的二元判断。","课堂指出，这种方法可能导致强化学习算法利用分类器的弱点，找到分类器未训练过的状态，从而获得更高的奖励，但这些状态可能并不符合实际任务的目标。","为了防止这种情况，课堂提到可以借鉴CQL（保守Q学习）的方法，通过引入额外的约束来限制算法对分类器弱点的利用。","这种方法类似于离线强化学习中的挑战，即在优化过程中可能找到分类器不准确的状态，从而产生乐观的奖励信号，导致策略偏离实际任务目标。","课堂强调，虽然分类器可以提供奖励信号，但其稀疏性可能导致算法难以有效学习，因此需要额外的机制来防止策略利用分类器的弱点。","最后，课堂提到可以使用与CQL类似的方法来解决这一问题，即通过引入额外的约束或惩罚项，确保算法不会过度依赖分类器的不准确判断。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1735.61,"end":1896.84,"asr_flags":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":1735.61,"text":"and then train a binary classifier to be able to predict that the positive examples should"},{"start":1742.91,"text":"be labeled with 1, the negative examples should be labeled with 0."},{"start":1747.37,"text":"And then you can use the output of this binary classifier as your reward signal."},{"start":1753.93,"text":"So specifically what this would look like is you first collect examples of successful"},{"start":1757.31,"text":"successful states, unsuccessful states. You can think of this as states within some sort"},{"start":1761.15,"text":"of goal set and states outside of that goal set, and then trying to binary classify."},{"start":1768.66,"text":"And then run reinforcement learning with this classifier. Does anyone have thoughts on what could go wrong if you took this approach? Yeah. So one downside with this approach is that it's going to give you a very sparse reward. It's just going to tell you, are you kind of within this kind of set of goal states or are you outside of it? And you would need to figure out how to make progress towards that. Is there any other challenges or any other things that might go wrong?"},{"start":1798.29,"text":"Yeah, so a second thing that might happen is it might learn to fool the classifier, but not actually do the tasks that you're interested in. And in particular, when you train a classifier, it's trained on some distribution of examples that you provided. But the policy that you're learning has the ability to visit lots of different states, including states that are different from the individual data set."},{"start":1823.97,"text":"And in some ways, kind of analogous to some of the challenges we saw in offline RL, when you're optimizing against this classifier, you can kind of hack it or fool it and find states where that classifier is inaccurate. And when it's inaccurate, some of the times it might be optimistic about how to do the task."},{"start":1846.09,"text":"The first answer was absolutely correct. It does provide a sparse signal. But one especially thing that can go extra wrong here is that the RL algorithm will seek out states that the classifier thinks are good. And it might simply find states that the classifier wasn't trained on, and essentially exploiting the classifier's weaknesses. So can we prevent the algorithm from exploiting the weaknesses?"},{"start":1872.42,"text":"In some ways, it's actually kind of nice that we're talking about this at the same time in which we talked about CQL. Because you can actually use an approach that's very similar to CQL for preventing the RL algorithm from exploiting the weaknesses. And in particular, say that you have some kind of positive goal states over here."}],"speech_gaps":[],"frame":"../frames/v035/011.webp","frame_time":1747.61},{"title":"奖励学习中的分类器与策略互动","segments":[{"id":193,"text":"where, I don't know, in the pencil case example, maybe this is where the pencil case should be. You can also just generally think of it as some abstract space. And then you also have negative examples over here. Maybe this is a bad place to go to. And then your classifier, when you train a binary classifier, it will learn some sort of decision boundary like this. And then when you train a policy,","zh":"其中，在铅笔盒的例子中，也许这就是铅笔盒应该所在的位置。你也可以一般地将其视为某种抽象空间。然后你还会在这里有负例。也许这是个不好的去处。然后当你训练一个二分类器时，它会学习某种决策边界，就像这样。然后当你训练策略时，","start":1898.7,"end":1927.12},{"id":194,"text":"when it sees that the stuff over here is positive and the stuff over here is negative, maybe we can also specify the direction of our binary classifier, then your R algorithm, it might learn to kind of go somewhere over here. And maybe some of these states are good, but maybe also some of these states are not so good. And if we want to avoid exploiting","zh":"当它看到这边是正例，这边是负例时，也许我们也可以指定我们二分类器的方向，那么你的R算法可能会学习去往这边。也许其中一些状态是好的，但也许其中一些状态也不是那么好。如果我们想要避免利用分类器，","start":1929.26,"end":1958.34},{"id":195,"text":"the classifier, one simple thing that we could do is we could take these states that we visited with our policy and we could then label them as additional data points for training our classifier. Now, if we don't have a good reward function and we don't want supervision online, then we don't know exactly what the labels should be. And one thing that we could do is simply to be conservative.","zh":"一个简单的方法是我们可以将我们策略访问过的这些状态标记为额外的训练数据点来训练我们的分类器。现在，如果我们没有一个好的奖励函数，并且不想在线进行监督，那么我们就不知道标签应该是什么。我们可以采取的一个方法就是简单地保守一些。","start":1959.24,"end":1989.53},{"id":196,"text":"we could label these as negatives and say that all of these were states that were failures, essentially. And then retrain our classifier. And if we retrain our classifier, we would then get a classifier that maybe looks like this.","zh":"我们可以将这些标记为负例，并说这些状态基本上都是失败的状态。然后重新训练我们的分类器。如果我们重新训练我们的分类器，那么我们就会得到一个可能看起来像这样的分类器。","start":1990.27,"end":2021.56},{"id":197,"text":"around these states. Let's walk through what this would look like explicitly. We could add states that the RL algorithm visits as negative examples for the classifier. Specifically, we would collect some initial set of success states and unsuccessful states. Then we would update our classifier and train it to classify the success states and the unsuccessful states. Then we would collect some experience using our policy.","zh":"围绕这些状态。让我们明确地走一遍这个过程会是什么样子。我们可以将RL算法访问的状态作为分类器的负例。具体来说，我们会收集一些初始的成功状态和失败状态。然后我们会更新我们的分类器，并训练它来分类成功状态和失败状态。然后我们会使用我们的策略收集一些经验。","start":2022.17,"end":2052.11}],"notes":["本段讲解了在奖励学习中如何利用分类器与策略进行互动。通过将策略访问的状态作为负例，可以训练分类器以区分成功与失败状态，从而帮助策略学习更准确的奖励函数。","讲者提到，当策略访问某些状态时，可以将这些状态标记为负例，并重新训练分类器，以获得更准确的分类边界。这种做法有助于避免策略过度依赖分类器的输出。","在没有明确奖励函数的情况下，讲者建议采用保守策略，将所有访问状态标记为失败，从而确保分类器的训练过程更加稳健。","通过这种方式，策略可以逐步学习到更准确的分类边界，从而在后续的探索中更有效地识别成功状态。","讲者还提到，可以收集初始的成功与失败状态，用于训练分类器，并在策略运行过程中不断更新分类器，以提高其准确性。","这种交互机制体现了奖励学习中分类器与策略之间的动态关系，通过分类器的反馈，策略可以不断优化其行为以达到更高的奖励目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1898.7,"end":2052.11,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1898.7,"text":"where, I don't know, in the pencil case example, maybe this is where the pencil case should be. You can also just generally think of it as some abstract space. And then you also have negative examples over here. Maybe this is a bad place to go to. And then your classifier, when you train a binary classifier, it will learn some sort of decision boundary like this. And then when you train a policy,"},{"start":1929.26,"text":"when it sees that the stuff over here is positive and the stuff over here is negative, maybe we can also specify the direction of our binary classifier, then your R algorithm, it might learn to kind of go somewhere over here. And maybe some of these states are good, but maybe also some of these states are not so good. And if we want to avoid exploiting"},{"start":1959.24,"text":"the classifier, one simple thing that we could do is we could take these states that we visited with our policy and we could then label them as additional data points for training our classifier. Now, if we don't have a good reward function and we don't want supervision online, then we don't know exactly what the labels should be. And one thing that we could do is simply to be conservative."},{"start":1990.27,"text":"we could label these as negatives and say that all of these were states that were failures, essentially. And then retrain our classifier. And if we retrain our classifier, we would then get a classifier that maybe looks like this. And then maybe our policy kind of visits over here. And then you eventually learn a classifier that is more accurate."},{"start":2022.17,"text":"around these states. Let's walk through what this would look like explicitly. We could add states that the RL algorithm visits as negative examples for the classifier. Specifically, we would collect some initial set of success states and unsuccessful states. Then we would update our classifier and train it to classify the success states and the unsuccessful states. Then we would collect some experience using our policy."}],"speech_gaps":[],"frame":"../frames/v035/012.webp","frame_time":1910.7},{"title":"奖励学习中的分类器与数据平衡","segments":[{"id":198,"text":"update our policy using the classifier-based reward, and then we'd add the visited states to our negative examples, and then re-update our classifier using those negative states. Does anyone have concerns about this algorithm? The concern there was that you might not learn a very robust classifier, and you might overfit to the positives in your data set. And in particular, if you have a small number of positives, then...","zh":"使用基于分类器的奖励来更新我们的策略，然后我们将访问过的状态添加到我们的负例中，接着再使用这些负例重新更新我们的分类器。有人对这个算法有担忧吗？那里的担忧是，你可能不会学习到一个非常稳健的分类器，而且你可能会在数据集中正例上过拟合。特别是，如果你的正例数量很少的话，……","start":2054.22,"end":2083.41},{"id":199,"text":"You might learn a decision boundary that only contains each of these positives and doesn't contain the things right around them. One thing that you can do for that is to try to regularize your classifier to try to prevent that overfitting. Even standard regularizers can be helpful for that. You can encourage it to be more smooth. Any other concerns about this algorithm?","zh":"你可能会学习到一个只包含这些正例而没有包含它们周围状态的决策边界。针对这一点，你可以尝试对分类器进行正则化，以防止过拟合。甚至标准的正则化方法对这一点也有帮助。你可以鼓励它更加平滑。还有其他关于这个算法的担忧吗？","start":2085.26,"end":2114.27},{"id":200,"text":"Yeah, so one of the challenges that can come up with this algorithm is that you're going to be adding more and more negatives to your data set. And one really critical thing here is that if you keep on adding negatives to your data set and don't rebalance your data set, then it might just predict negative everywhere.","zh":"是的，这个算法可能会出现的一个挑战是，你会不断地将更多的负例添加到你的数据集中。这里一个非常关键的问题是，如果你持续地向数据集中添加负例而不重新平衡数据集，那么它可能会在所有地方都预测为负例。","start":2115.24,"end":2131.65},{"id":201,"text":"And so one critical thing here is to balance the data set 50-50 so that the negatives account for half of the data that you're sampling and the positives account for the other half of the data that you're sampling. Yeah, so the question was that at some point your original negatives will be overwhelmed by the sample negatives. And does it make sense to balance them? Certainly you could do that. It depends on how large your initial negatives are.","zh":"因此，这里一个关键点是将数据集平衡为50-50，使得负例占你采样的数据的一半，正例占另一半。是的，问题是你的原始负例最终会被采样负例所淹没。平衡它们是否合理？当然你可以这么做。这取决于你初始的负例数量有多大。","start":2132.6,"end":2159.18},{"id":202,"text":"And one of the things that will happen is that your policy will actually start visiting the states here. And it might visit even exactly the same states as the positives. And you're then going to be labeling these as negatives. Now, those labels are incorrect. Those states are actually kind of true positives. And this kind of also alludes to the overfitting comment at the beginning.","zh":"会发生的一件事是，你的策略实际上会开始访问这些状态。它甚至可能会访问与正例完全相同的状态。然后你会将这些状态标记为负例。然而，这些标签是错误的。这些状态实际上是真正的正例。这也暗示了前面提到的过拟合问题。","start":2160.99,"end":2189.66},{"id":203,"text":"But it actually turns out that if you balance your data set, this might actually be okay. And if you use enough regularization or have a large enough positive and negative data set. And the reason why this might be okay is that when you use balancing, it will ensure that...","zh":"但实际上，如果你平衡了你的数据集，这可能实际上是可以接受的。并且如果你使用了足够的正则化或者拥有足够大的正样本和负样本数据集。而之所以这可能可以接受的原因是，当你使用平衡时，它将确保...","start":2190.57,"end":2215.65}],"notes":["本段讨论了在奖励学习中使用分类器时可能出现的过拟合问题，特别是当正样本数量较少时，分类器可能会过度拟合正样本，导致决策边界过于狭窄，无法涵盖周围区域的样本。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2054.22,"end":2215.65,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2054.22,"text":"update our policy using the classifier-based reward, and then we'd add the visited states to our negative examples, and then re-update our classifier using those negative states. Does anyone have concerns about this algorithm? The concern there was that you might not learn a very robust classifier, and you might overfit to the positives in your data set. And in particular, if you have a small number of positives, then..."},{"start":2085.26,"text":"You might learn a decision boundary that only contains each of these positives and doesn't contain the things right around them. One thing that you can do for that is to try to regularize your classifier to try to prevent that overfitting. Even standard regularizers can be helpful for that. You can encourage it to be more smooth. Any other concerns about this algorithm?"},{"start":2115.24,"text":"Yeah, so one of the challenges that can come up with this algorithm is that you're going to be adding more and more negatives to your data set. And one really critical thing here is that if you keep on adding negatives to your data set and don't rebalance your data set, then it might just predict negative everywhere."},{"start":2132.6,"text":"And so one critical thing here is to balance the data set 50-50 so that the negatives account for half of the data that you're sampling and the positives account for the other half of the data that you're sampling. Yeah, so the question was that at some point your original negatives will be overwhelmed by the sample negatives. And does it make sense to balance them? Certainly you could do that. It depends on how large your initial negatives are."},{"start":2160.99,"text":"And so that's something to consider. One of the things that will happen is that your policy will actually start visiting the states here. And it might visit even exactly the same states as the positives. And you're then going to be labeling these as negatives. Now, those labels are incorrect. Those states are actually kind of true positives. And this kind of also alludes to the overfitting comment at the beginning."},{"start":2190.57,"text":"But it actually turns out that if you balance your data set, this might actually be okay. And if you use enough regularization or have a large enough positive and negative data set. And the reason why this might be okay is that when you use balancing, it will ensure that..."}],"speech_gaps":[],"frame":"../frames/v035/013.webp","frame_time":2066.22},{"title":"奖励学习中的概率与阈值处理","segments":[{"id":204,"text":"the half of the data set will be positives. So we know that 50% of the data set is going to be true positives. And then for the other part of the data set, some proportion of it will be false negatives, and some proportion of it will be true negatives. Let's say that we've gotten to the point where","zh":"数据集的一半将是正样本。因此我们知道，数据集的50%将是真正的正样本。而对于数据集的另一部分，其中一部分将是假阴性，另一部分将是真阴性。假设我们已经到达了这样一个点，","start":2216.85,"end":2244.69},{"id":205,"text":"For the other 50%, 40% is a false negative, meaning that it's labeled as a negative, but it's actually a positive. And 10%, including our original negatives, corresponds to true negatives. Then in this case, as long as we're balancing our data set, for a positive, it will still output... It won't output like...","zh":"对于剩下的50%，40%是假阴性，这意味着它被标记为负样本，但实际上它是正样本。而10%，包括我们原始的负样本，对应的是真阴性。在这种情况下，只要我们平衡了数据集，对于正样本，它仍然会输出……它不会输出像……某个事物是正样本的概率为1，因为所有这些情况都存在，但它仍然会输出某个事物是正样本的概率，这个概率高于50%，并且很可能高于它为负样本的概率。","start":2245.7,"end":2274.22},{"id":206,"text":"Then in this case, as long as we're balancing our data set, for a positive, it will still output... It won't output like... probability one that something is a positive because of all these here, but it's still going to output a probability that something's positive that's higher than 50% and probably that's higher than the probability that it is negative.","zh":"在这种情况下，只要我们平衡了数据集，对于正样本，它仍然会输出……它不会输出像……某个事物是正样本的概率为1，因为所有这些情况都存在，但它仍然会输出某个事物是正样本的概率，这个概率高于50%，并且很可能高于它为负样本的概率。","start":2274.74,"end":2304.98},{"id":207,"text":"And so, yeah, specifically with balancing, you can always expect that the probability of a true positive under our classifier, this will always be, if the classifier is training properly, this will always be greater than 50%. Because as long as this data set is not like, if it's all the way like 50, like entirely false negatives, then it will be exactly 50%.","zh":"因此，具体来说，通过平衡，我们可以始终期望我们的分类器输出的真正正样本的概率，如果分类器训练得当，这个概率将始终大于50%。只要这个数据集不是像50%那样，完全都是假阴性，那么它将是正好50%。","start":2305.68,"end":2327.26},{"id":208,"text":"But as long as you have some true negatives around, including your original set of negatives, then it'll be strictly above 0.5. And the probability of a true negative will be less than 0.5. The question is, would this be resolved if we use confidence intervals instead of 0 or 1?","zh":"只要你有一些真阴性，包括你原始的负样本集合，那么它将严格大于0.5。而真阴性的概率将小于0.5。问题是，如果我们使用置信区间而不是0或1，这种情况是否会被解决？","start":2328.07,"end":2353.33},{"id":209,"text":"So you can also use this probability as the reward and not threshold it, and that is also fine. In terms of confidence intervals, that could also potentially be helpful, although I haven't thought too much about it, and you would need probably a slightly more sophisticated RLF.","zh":"你也可以将这个概率作为奖励，而不进行阈值处理，这也是可以的。就置信区间而言，这可能也有帮助，尽管我还没有深入思考过，你可能需要一个稍微更复杂的奖励学习函数（RLF）。","start":2353.89,"end":2377.67}],"notes":["本段讨论了在数据集平衡的情况下，分类器输出的正类概率会高于50%。讲者指出，如果数据集中存在真正的负类样本，那么正类的概率将严格大于50%，而负类的概率则低于50%。","讲者进一步提出，使用概率作为奖励而非阈值处理是可行的。这可能有助于避免因阈值设定不当而导致的偏差，但需要更复杂的奖励学习框架（RLF）来实现。","讲者提到，使用置信区间代替0或1的二元输出可能有助于解决某些问题，但目前尚未深入探讨其具体应用。","讲者强调了数据集平衡的重要性，指出如果数据集中全是假负类样本，那么正类的概率将等于50%。因此，保持数据集的平衡是确保模型性能的关键。","讲者还提到，使用概率作为奖励可以避免阈值处理带来的问题，但需要更复杂的模型设计来支持这种做法。","讲者最后提到，如果处于一个需要访问特定状态的场景中，可能需要更复杂的奖励学习框架来处理概率输出。"],"formulas":[{"latex":"P(\\text{True Positive}) > 0.5","symbols":"正类概率大于0.5","explanation":"根据原文描述，当数据集平衡且分类器训练良好时，正类的概率应大于50%。此公式正确表达了这一概念。","evidence":"a true positive under our classifier, this will always be, if the classifier is training properly, this will always be greater than 50%. Because as long as this data set is not like, if it's all the way like 50, like entirely false negatives, then it will be exactly 50%."},{"latex":"P(\\text{True Negative}) \u003c 0.5","symbols":"负类概率小于0.5","explanation":"原文提到负类的概率会小于50%，此公式正确表达了这一概念。","evidence":"But as long as you have some true negatives around, including your original set of negatives, then it'll be strictly above 0.5. And the probability of a true negative will be less than 0.5. The question is, would this be resolved if we use confidence intervals instead of 0 or 1?"}],"uncertainties":[],"diagram":"none","start":2216.85,"end":2377.67,"asr_flags":[],"math_clarifications":["原文未提供具体的数学公式，因此公式是基于文本内容的合理推断。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2216.85,"text":"the half of the data set will be positives. So we know that 50% of the data set is going to be true positives. And then for the other part of the data set, some proportion of it will be false negatives, and some proportion of it will be true negatives. Let's say that we've gotten to the point where"},{"start":2245.7,"text":"For the other 50%, 40% is a false negative, meaning that it's labeled as a negative, but it's actually a positive. And 10%, including our original negatives, corresponds to true negatives. Then in this case, as long as we're balancing our data set, for a positive, it will still output... It won't output like..."},{"start":2274.74,"text":"probability one that something is a positive because of all these here, but it's still going to output a probability that something's positive that's higher than 50% and probably that's higher than the probability that it is negative. And so, yeah, specifically with balancing, you can always expect that the probability of"},{"start":2305.68,"text":"a true positive under our classifier, this will always be, if the classifier is training properly, this will always be greater than 50%. Because as long as this data set is not like, if it's all the way like 50, like entirely false negatives, then it will be exactly 50%."},{"start":2328.07,"text":"But as long as you have some true negatives around, including your original set of negatives, then it'll be strictly above 0.5. And the probability of a true negative will be less than 0.5. The question is, would this be resolved if we use confidence intervals instead of 0 or 1?"},{"start":2353.89,"text":"So you can also use this probability as the reward and not threshold it, and that is also fine. In terms of confidence intervals, that could also potentially be helpful, although I haven't thought too much about it, and you would need probably a slightly more sophisticated RLF. Yeah, so if you're in a scenario where you visit a state that's like..."}],"speech_gaps":[],"frame":"../frames/v035/014.webp","frame_time":2228.85},{"title":"奖励学习中的生成对抗网络应用","segments":[{"id":210,"text":"It's very hard to distinguish between them, then if you have regularization, it's likely to label it as a positive because the regularization will encourage the function to be smooth. But it comes down a lot to how different it is. So the question is, would this be solved if we use a generative adversarial network where the classifier is... the reward is the discriminator and the generator is the agent? It turns out that","zh":"很难区分它们，那么如果你有正则化，它很可能会被标记为正样本，因为正则化会鼓励函数变得平滑。但归根结底，这很大程度上取决于它们之间的差异。因此问题是，如果我们使用一个生成对抗网络，其中分类器是……奖励是判别器，生成器是智能体，这种情况是否会被解决？结果发现","start":2377.89,"end":2406.78},{"id":211,"text":"This actually, okay, I don't have, this is like two slides from now, but it turns out that this actually is exactly a generative adversarial network. So you can think of this classifier as a discriminator that's trying to discriminate between the positive examples that we gave and everything that the policy is visiting.","zh":"实际上，好吧，我这里没有，这是从现在两页幻灯片的内容，但结果发现这实际上正是一个生成对抗网络。你可以将这个分类器视为一个判别器，它试图区分我们提供的正样本和策略访问的所有内容。","start":2408.14,"end":2425.58},{"id":212,"text":"And the kind of generator in a generative adversarial network is the policy. You don't necessarily need to know about exactly what generative adversarial networks or GANs are, but if you do know what they are, this is basically exactly a form of a GAN. Yeah, so the question is, after we run a directory, are we seeing what the true label is? And the answer to that is no. So we're assuming that we don't get any more human supervision other than the initial training data set. Now, one other thing that you can do here that...","zh":"在生成对抗网络中的生成器类型是策略。你不一定需要确切了解生成对抗网络或GANs是什么，但如果你了解它们，这基本上就是一种GAN的形式。是的，因此问题是，我们在运行一个目录后，是否能看到真实的标签？答案是否定的。因此我们假设除了初始训练数据集外，我们不会获得任何更多的监督。现在，你还可以在这里做的一件事是……","start":2426.88,"end":2455.06},{"id":213,"text":"makes this a little bit potentially easier is you could also label some of the data as positives or negatives as well and use that to continue to update your classifier. And so that's also a very valid approach. And there's ways to label only some of the data so that you don't have to label every single trajectory that the policy is doing. And that could also help stabilize the training.","zh":"使这个问题稍微容易一些的是，你也可以将一些数据标记为正样本或负样本，并使用这些数据继续更新你的分类器。因此这也是一个非常有效的方法。而且有办法只标记部分数据，而不需要标记策略执行的每一个轨迹。这也可以帮助稳定训练。","start":2455.32,"end":2477.48},{"id":214,"text":"One example of using this kind of approach in robotics is a paper that took 50 demonstrations. It used the final states as successes for training the classifier. It initializes a replay buffer with the demonstrations.","zh":"在机器人学中使用这种类型方法的一个例子是一篇论文，它使用了50个演示。它将最终状态作为训练分类器的成功状态。它用这些演示初始化了一个回放缓冲区。","start":2480.23,"end":2498.35},{"id":215,"text":"And if you directly imitate the demonstrations, the success rate is around 26% because 50 demonstrations is not that much. And even if you collect more, it'd be hard to get to 100% success. And then if instead you use this initialization and run RL with a classifier learned in this way.","zh":"如果你直接模仿这些演示，成功率大约是26%，因为50个演示并不多。即使你收集更多数据，也很难达到100%的成功率。然后如果你使用这种初始化方法，并运行带有这样学习的分类器的强化学习。","start":2499.79,"end":2520.0},{"id":216,"text":"then you get a policy that has, in this case, a 62% success rate. Not awesome yet, but something that's substantially higher than the success rate of imitation learning.","zh":"然后你得到一个策略，其在这种情况下的成功率为62%。还不是非常出色，但比模仿学习的成功率要高得多。","start":2520.52,"end":2533.7}],"notes":["本段讨论了在奖励学习中使用生成对抗网络（GAN）的思路，其中分类器作为判别器，用于区分正样本和策略访问的所有状态。生成器则对应策略，通过对抗训练来优化策略。","讲者指出，即使在没有额外人类监督的情况下，也可以通过部分标记数据来更新分类器，从而提高训练的稳定性。这种方法在机器人领域有实际应用，例如通过50个示范来训练分类器。","在机器人应用中，直接模仿示范的成功率较低（约26%），但通过使用初始化的分类器进行强化学习，可以显著提高成功率（62%），这表明分类器在奖励学习中的重要性。","讲者强调，这种方法虽然有效，但仍有改进空间，例如如何更高效地标记数据和优化分类器的训练过程。","讲者提到，生成对抗网络的结构与奖励学习中的分类器和策略之间的关系，表明了GAN在强化学习中的潜在应用。","最后，讲者指出，虽然这种方法在某些情况下表现良好，但仍然存在挑战，例如如何确保分类器的准确性以及如何进一步提高策略的成功率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2377.89,"end":2533.7,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2377.89,"text":"very hard to distinguish between them, then if you have regularization, it's likely to label it as a positive because the regularization will encourage the function to be smooth. But it comes down a lot to how different it is. So the question is, would this be solved if we use a generative adversarial network where the classifier is... the reward is the discriminator and the generator is the agent? It turns out that"},{"start":2408.14,"text":"This actually, okay, I don't have, this is like two slides from now, but it turns out that this actually is exactly a generative adversarial network. So you can think of this classifier as a discriminator that's trying to discriminate between the positive examples that we gave and everything that the policy is visiting."},{"start":2426.88,"text":"And the kind of generator in a generative adversarial network is the policy. You don't necessarily need to know about exactly what generative adversarial networks or GANs are, but if you do know what they are, this is basically exactly a form of a GAN. Yeah, so the question is, after we run a directory, are we seeing what the true label is? And the answer to that is no. So we're assuming that we don't get any more human supervision other than the initial training data set. Now, one other thing that you can do here that..."},{"start":2455.32,"text":"makes this a little bit potentially easier is you could also label some of the data as positives or negatives as well and use that to continue to update your classifier. And so that's also a very valid approach. And there's ways to label only some of the data so that you don't have to label every single trajectory that the policy is doing. And that could also help stabilize the training."},{"start":2480.23,"text":"One example of using this kind of approach in robotics is a paper that took 50 demonstrations. It used the final states as successes for training the classifier. It initializes a replay buffer with the demonstrations."},{"start":2499.79,"text":"And if you directly imitate the demonstrations, the success rate is around 26% because 50 demonstrations is not that much. And even if you collect more, it'd be hard to get to 100% success. And then if instead you use this initialization and run RL with a classifier learned in this way."},{"start":2520.52,"text":"then you get a policy that has, in this case, a 62% success rate. Not awesome yet, but something that's substantially higher than the success rate of imitation learning."}],"speech_gaps":[],"frame":"../frames/v035/015.webp","frame_time":2389.89},{"title":"奖励学习中的分类器正则化与生成对抗网络","segments":[{"id":217,"text":"And one thing that we found that we talked about that was also we found in this research is that it's actually very important to regularize the classifier to help it not overfit to just the 50 positive examples that were provided at the beginning. Okay. And as a side, this is how GANs work. The generative adversarial networks are a form of generative model. They've often been used for image generation.","zh":"我们发现的一件事是，在这项研究中我们讨论过，实际上对分类器进行正则化是非常重要的，这有助于它不要仅仅过拟合于开始时提供的50个正例。好的。顺便提一下，这就是GANs的工作原理。生成对抗网络是一种生成模型，它们经常被用于图像生成。","start":2536.49,"end":2568.45},{"id":218,"text":"And the key idea is to train a classifier between the real examples, like the real positives, and the generated data, like the states that the policy visits. And you try to train a generator such that it generates things that the classifier thinks is real.","zh":"关键的想法是在真实示例（如真实正例）和生成数据（如策略访问的状态）之间训练一个分类器。你试图训练一个生成器，使其生成分类器认为是真实的物体。","start":2569.15,"end":2589.63},{"id":219,"text":"GANs have been used in a variety of places. Here are some examples of images generated by a GAN. Here is a cool video of an astronaut dancing on Mars and later walking his dog on Mars that also uses a generative adversarial network. Cool. Now, as a recap...","zh":"GANs已经被应用于各种领域。这里是一些由GAN生成的图像示例。这里有一个酷炫的视频，展示了一位宇航员在火星上跳舞，之后还带着他的狗在火星上行走，这也使用了生成对抗网络。酷毙了。现在，作为回顾……","start":2590.38,"end":2618.29},{"id":220,"text":"We talked about training classifiers. These classifiers can be exploited when you optimize against them. And the solution is that during the RL process, if we update the classifier using negatives visited by the policy, then you can avoid it being exploited.","zh":"我们讨论了训练分类器。当针对这些分类器进行优化时，这些分类器可能会被利用。解决方法是在强化学习过程中，如果我们使用策略访问的负例来更新分类器，就可以避免它被利用。","start":2620.14,"end":2637.79},{"id":221,"text":"One other thing that I wanted to skip today because we don't have too much time and need to talk about preferences, but you can also actually learn not just goal classifiers, but you can actually learn full reward functions. If you use all of the states in the demo as positive examples and all of the states in your policy rollouts as negatives, then...","zh":"今天我想跳过另一件事，因为我们没有太多时间，需要讨论偏好，但你也可以实际学习不仅仅是目标分类器，还可以实际学习完整的奖励函数。如果你将演示中的所有状态作为正例，将策略滚出中的所有状态作为负例，那么……","start":2639.69,"end":2662.27},{"id":222,"text":"you can show that we'll be trying to learn a reward function over state distributions","zh":"你可以展示我们正在尝试在状态分布上学习一个奖励函数","start":2662.92,"end":2668.96},{"id":223,"text":"rather than just goal states.","zh":"而不是仅仅在目标状态上。","start":2668.96,"end":2670.74},{"id":224,"text":"Cool.","zh":"酷毙了。","start":2674.14,"end":2674.7},{"id":225,"text":"On the upside, there's a very practical framework.","zh":"从积极的一面来看，有一个非常实用的框架。","start":2674.84,"end":2676.58},{"id":226,"text":"Adversarial training, adding these as negatives, it can be unstable.","zh":"对抗训练，将这些作为负样本，可能会不稳定。","start":2677.16,"end":2681.14},{"id":227,"text":"There are a variety of regularization tricks.","zh":"存在多种正则化技巧。","start":2681.86,"end":2683.88},{"id":228,"text":"You can actually take them just directly from the GAN literature and apply them.","zh":"你实际上可以直接从生成对抗网络（GAN）文献中获取这些技巧并加以应用。","start":2684.36,"end":2688.2},{"id":229,"text":"And that is quite helpful.","zh":"这非常有帮助。","start":2689.1,"end":2690.9},{"id":230,"text":"And then one other big downside here is that this requires examples of what the goal is,","zh":"另一个主要的缺点是，这需要一些关于目标的例子，","start":2690.9,"end":2696.72},{"id":231,"text":"like what the desired behavior is. And sometimes generating those examples can be challenging or","zh":"比如期望的行为是什么。有时生成这些例子可能会具有挑战性或","start":2696.9,"end":2704.3},{"id":232,"text":"time-consuming. Okay, so that's learning from example goals. Now let's talk about learning","zh":"耗时。好的，所以这就是从示例目标中学习。现在让我们谈谈学习","start":2704.3,"end":2712.92}],"notes":["本段主要讲解了在强化学习中使用分类器进行正则化的重要性，以防止模型过度拟合于有限的正例数据。同时，提到了生成对抗网络（GANs）的基本原理，即通过训练一个分类器来区分真实数据和生成数据，从而训练生成器生成更接近真实数据的样本。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2536.49,"end":2712.92,"asr_flags":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":2536.49,"text":"And one thing that we found that we talked about that was also we found in this research is that it's actually very important to regularize the classifier to help it not overfit to just the 50 positive examples that were provided at the beginning. Okay. And as a side, this is how GANs work. The generative adversarial networks are a form of generative model. They've often been used for image generation."},{"start":2569.15,"text":"And the key idea is to train a classifier between the real examples, like the real positives, and the generated data, like the states that the policy visits. And you try to train a generator such that it generates things that the classifier thinks is real."},{"start":2590.38,"text":"GANs have been used in a variety of places. Here are some examples of images generated by a GAN. Here is a cool video of an astronaut dancing on Mars and later walking his dog on Mars that also uses a generative adversarial network. Cool. Now, as a recap..."},{"start":2620.14,"text":"We talked about training classifiers. These classifiers can be exploited when you optimize against them. And the solution is that during the RL process, if we update the classifier using negatives visited by the policy, then you can avoid it being exploited."},{"start":2639.69,"text":"One other thing that I wanted to skip today because we don't have too much time and need to talk about preferences, but you can also actually learn not just goal classifiers, but you can actually learn full reward functions. If you use all of the states in the demo as positive examples and all of the states in your policy rollouts as negatives, then..."},{"start":2662.92,"text":"you can show that we'll be trying to learn a reward function over state distributions"},{"start":2668.96,"text":"rather than just goal states."},{"start":2674.14,"text":"Cool."},{"start":2674.84,"text":"On the upside, there's a very practical framework."},{"start":2677.16,"text":"Adversarial training, adding these as negatives, it can be unstable."},{"start":2681.86,"text":"There are a variety of regularization tricks."},{"start":2684.36,"text":"You can actually take them just directly from the GAN literature and apply them."},{"start":2689.1,"text":"And that is quite helpful."},{"start":2690.9,"text":"And then one other big downside here is that this requires examples of what the goal is,"},{"start":2696.9,"text":"like what the desired behavior is. And sometimes generating those examples can be challenging or"},{"start":2704.3,"text":"time-consuming. Okay, so that's learning from example goals. Now let's talk about learning"}],"speech_gaps":[],"frame":"../frames/v035/016.webp","frame_time":2548.49},{"title":"奖励学习中的相对偏好与奖励函数构建","segments":[{"id":233,"text":"from preferences. So, and this is specifically, we're going to talk less about goal classifiers","zh":"从偏好中。因此，具体来说，我们将较少地讨论目标分类器","start":2712.92,"end":2722.18},{"id":234,"text":"and talk more about scenarios where we don't just want to reach states within some goal set,","zh":"而更多地讨论那些我们不仅仅希望到达某个目标集合中的状态","start":2722.18,"end":2726.62},{"id":235,"text":"but we actually want to potentially learn good behavior versus bad behavior. And that might","zh":"的情况，而是实际上希望学习良好行为与不良行为的区别。这可能","start":2726.8,"end":2732.96},{"id":236,"text":"instead of providing, instead of requiring example demonstrations or example goals, or in addition to that, we might want","zh":"不需要提供示例演示或示例目标，或者在提供这些之外，我们可能还希望","start":2732.96,"end":2740.72},{"id":237,"text":"to provide feedback on the full rollout. Now, one option that we could do is we could just","zh":"对完整的轨迹提供反馈。现在，我们可以采取的一种方法是，我们只需","start":2740.72,"end":2746.22},{"id":238,"text":"ask, how good is this trajectory? So say that you wanted to start at this blue dot and you","zh":"询问，这条轨迹有多好？例如，你想要从这个蓝色点出发，并且","start":2746.22,"end":2752.84},{"id":239,"text":"want to reach the star as efficiently as possible. So it's actually kind of hard. Now, another","zh":"以尽可能高效的方式到达星号。实际上，这有点困难。现在，另一种","start":2752.84,"end":2761.16},{"id":240,"text":"way to frame this question is, which trajectory is better? So,","zh":"表述这个问题的方式是，哪条轨迹更好？所以，","start":2761.16,"end":2769.86},{"id":241,"text":"who thinks the blue trajectory is better than the pink trajectory?","zh":"谁认为蓝色轨迹比粉色轨迹更好？","start":2769.86,"end":2773.06},{"id":242,"text":"who thinks the blue trajectory is better than the pink trajectory?","zh":"谁认为蓝色轨迹比粉色轨迹更好？","start":2773.84,"end":2777.12},{"id":243,"text":"Okay, everyone thinks the blue one. So that's a much easier question to answer, right? So these kind of relative preferences are often easier to provide than evaluating absolute performance of a trajectory. And this is true for lines in 2D, but it's also true in other use cases, many real-world use cases as well. So maybe you can use these kind of preferences to get a reward function.","zh":"好的，大家都认为蓝色轨迹更好。所以这是一个更容易回答的问题，对吧？这类相对偏好通常比评估轨迹的绝对表现更容易提供。这在二维线中是真实的，但在其他用例中也同样成立，包括许多现实世界的用例。因此，也许你可以利用这些偏好来构建奖励函数。","start":2778.47,"end":2806.27},{"id":244,"text":"Say that a human told us that one trajectory was better than another trajectory, then probably one way to think about what they're saying is that the sum of rewards for the states in that trajectory, so for the states and actions in the better trajectory, this should probably be larger than the sum of rewards.","zh":"假设一个人告诉我们一个轨迹比另一个轨迹更好，那么我们可以这样思考他们所说的内容：在该轨迹中的状态的奖励总和，即在更好轨迹中的状态和动作的奖励总和，应该比在被认为较差轨迹中的状态和动作的奖励总和更大。","start":2810.96,"end":2839.51},{"id":245,"text":"for the states and actions in the trajectory that was said to be worse. And I'm using W and L to refer to the winning trajectory and the losing trajectory. And maybe we'll write this as the... When we say that the winning trajectory is better than the losing trajectory, we'll write this with this notation.","zh":"我用 W 和 L 来指代获胜轨迹和失败轨迹。也许我们可以这样写：当我们说获胜轨迹比失败轨迹更好时，我们可以用这种符号表示。","start":2840.58,"end":2867.41}],"notes":["本段讨论了在强化学习中，相对于直接提供目标或示范，使用相对偏好来构建奖励函数的优势。讲者指出，评估轨迹的相对性能（如蓝色轨迹优于粉色轨迹）通常比评估绝对性能更容易，这种相对偏好可以用于构建奖励函数。","讲者提到，如果人类指出某条轨迹优于另一条轨迹，可以认为该轨迹中状态和动作的奖励总和更大。这表明奖励函数可以通过比较轨迹的相对表现来推导。","讲者使用了W和L分别表示胜者轨迹和败者轨迹，并提到可以使用特定的符号来表示这种比较关系，但具体符号未明确说明。","讲者强调了相对偏好在实际应用中的重要性，特别是在高维空间或现实世界任务中，这种相对比较比绝对评估更可行。","讲者通过提问的方式引导学生思考相对轨迹性能的判断，这有助于理解如何从人类反馈中提取奖励信息。","讲者指出，相对偏好可以用于构建奖励函数，但需要明确如何将这些偏好转化为具体的奖励值，这可能涉及更复杂的建模过程。"],"formulas":[],"uncertainties":["讲者提到使用W和L表示胜者和败者轨迹，并提到使用特定符号表示比较关系，但未明确说明具体符号，因此无法确定符号的准确形式。"],"diagram":"none","start":2712.92,"end":2867.41,"asr_flags":[],"math_clarifications":["原文未明确说明奖励函数R的具体形式或定义，因此无法确定R(W) > R(L)是否成立。此外，原文强调的是相对偏好而非绝对奖励值的比较，因此该公式可能不适用。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":2712.92,"text":"from preferences. So, and this is specifically, we're going to talk less about goal classifiers"},{"start":2722.18,"text":"and talk more about scenarios where we don't just want to reach states within some goal set,"},{"start":2726.8,"text":"but we actually want to potentially learn good behavior versus bad behavior. And that might"},{"start":2732.96,"text":"encapsulate something beyond just reaching a good state. And instead of providing, instead of"},{"start":2740.72,"text":"of requiring example demonstrations or example goals, or in addition to that, we might want"},{"start":2746.22,"text":"to provide feedback on the full rollout. Now, one option that we could do is we could just"},{"start":2752.84,"text":"ask, how good is this trajectory? So say that you wanted to start at this blue dot and you"},{"start":2761.16,"text":"want to reach the star as efficiently as possible. So it's actually kind of hard. Now, another"},{"start":2769.86,"text":"way to frame this question is, which trajectory is better? So,"},{"start":2773.84,"text":"who thinks the blue trajectory is better than the pink trajectory?"},{"start":2778.47,"text":"Okay, everyone thinks the blue one. So that's a much easier question to answer, right? So these kind of relative preferences are often easier to provide than evaluating absolute performance of a trajectory. And this is true for lines in 2D, but it's also true in other use cases, many real-world use cases as well. So maybe you can use these kind of preferences to get a reward function."},{"start":2810.96,"text":"Say that a human told us that one trajectory was better than another trajectory, then probably one way to think about what they're saying is that the sum of rewards for the states in that trajectory, so for the states and actions in the better trajectory, this should probably be larger than the sum of rewards."},{"start":2840.58,"text":"for the states and actions in the trajectory that was said to be worse. And I'm using W and L to refer to the winning trajectory and the losing trajectory. And maybe we'll write this as the... When we say that the winning trajectory is better than the losing trajectory, we'll write this with this notation."}],"speech_gaps":[],"frame":"../frames/v035/017.webp","frame_time":2724.92},{"title":"奖励学习中的偏好标签与奖励函数建模","segments":[{"id":246,"text":"Any individual preference label that's kind of binary saying A is better than B tells us a little bit of information about the reward. And from there, we want to figure out how to aggregate a number of these preference labels to learn a reward function. And so we'll assume that we have some data set of these pairs where","zh":"任何一种大致二元的偏好标签，表示A比B更好，都会告诉我们一些关于奖励的信息。然后，我们希望弄清楚如何将这些偏好标签聚合起来以学习一个奖励函数。因此，我们将假设我们有一些这样的配对数据集，其中","start":2871.55,"end":2897.62},{"id":247,"text":"We kind of have a pair of trajectories. We were told which one is the good one and which one is better than the other one. And we want to be able to use this data set to learn a reward function. And one perhaps simple way to do this is we want to model, we need kind of some way to write down an objective for a reward function. Let's also say that our reward function, let's model it as a neural network. So our reward function will have some parameters.","zh":"我们大致有一对轨迹。我们被告知哪一个是好的，哪一个是比另一个更好的。我们希望利用这个数据集来学习一个奖励函数。也许一个简单的做法是，我们需要某种方式来写出奖励函数的目标。让我们也假设我们的奖励函数可以建模为一个神经网络。因此，我们的奖励函数将具有某些参数。","start":2899.02,"end":2930.15},{"id":248,"text":"And then you can think of it as taking as input a state in action and outputting a scalar reward value. So if you want to write down an objective for this, one thing we could do, let's say that this is kind of used similar shorthand to what we've used before. This is the reward of the trajectory, this expression right here. Then maybe we could say that if we","zh":"然后你可以将其视为输入一个状态和动作，并输出一个标量奖励值。因此，如果你想为这个写出一个目标，我们可以这样做，假设这类似于我们之前使用过的简写方式。这是轨迹的奖励，这里的表达式。然后也许我们可以这样说，如果我们","start":2930.78,"end":2963.44},{"id":249,"text":"took the reward of the better trajectory and subtracted the reward of the trajectory that's worse, then we want this quantity to be positive. So that's one starting point. And from there, we like to think about probabilities and do maximum likelihood training in machine learning in general.","zh":"取了更好轨迹的奖励并减去较差轨迹的奖励，那么我们希望这个量是正的。因此，这是起点之一。然后，我们倾向于考虑概率，并在机器学习中一般进行最大似然训练。","start":2964.7,"end":2990.91},{"id":250,"text":"try to represent the probability that a trajectory is better than, one trajectory is better than","zh":"尝试表示一条轨迹比另一条轨迹更好的概率。因此，我们可以这样做，我们可以将这个输入到一个","start":2993.13,"end":2999.39},{"id":251,"text":"another trajectory. And so what we could do is we could take this, we could pass this into a","zh":"sigmoid函数中，它会将这个值压缩在0和1之间，然后表示为","start":2999.39,"end":3003.59},{"id":252,"text":"sigmoid function, which will kind of squash it between zero and one, and then represent that","zh":"获胜轨迹比标记轨迹更好的概率。","start":3003.59,"end":3009.33},{"id":253,"text":"as the probability that the winning trajectory is better than the trajectory that was marked","zh":"作为获胜轨迹比标记轨迹更好的概率。","start":3010.63,"end":3022.57},{"id":254,"text":"marked as inferior.","zh":"被标记为较差。","start":3022.57,"end":3023.27},{"id":255,"text":"And then if we did this, then we could","zh":"然后如果我们这样做，那么我们就可以","start":3024.85,"end":3027.69},{"id":256,"text":"try to maximize the probability under our reward function.","zh":"尝试在我们的奖励函数下最大化概率。","start":3028.99,"end":3034.25},{"id":257,"text":"So we could try to then optimize the reward function such","zh":"因此我们可以尝试优化奖励函数，使得","start":3034.41,"end":3039.25},{"id":258,"text":"that you're maximizing this probability.","zh":"你最大化这个概率。","start":3039.25,"end":3046.15}],"notes":["本段讲解了如何利用偏好标签来构建奖励函数。讲者提到，每个偏好标签（如A比B好）提供了关于奖励函数的一些信息，而目标是将这些标签聚合起来学习一个奖励函数。讲者假设我们有一个包含轨迹对的数据集，其中已知哪条轨迹更好。","讲者提出了一种简单的方法，即使用神经网络来建模奖励函数，并将奖励函数视为输入状态和动作，输出标量奖励值的函数。为了构建目标函数，讲者提到可以计算更好轨迹的奖励减去较差轨迹的奖励，并希望这个差值为正。","接下来，讲者讨论了如何将这个差值转化为概率，使用sigmoid函数将其压缩到0到1之间，表示更好轨迹的概率。这为后续的极大似然训练奠定了基础。","讲者进一步提到，如果能够最大化这个概率，就可以优化奖励函数，使得奖励函数能够更好地反映轨迹之间的偏好关系。这体现了强化学习中利用偏好数据进行奖励学习的基本思路。","讲者强调了从偏好标签到奖励函数的建模过程，包括如何将偏好转化为概率，以及如何通过最大化概率来优化奖励函数。这些步骤是奖励学习中的关键环节。","本段内容涉及偏好标签的处理、奖励函数的建模以及概率建模的基本思想，为后续的奖励学习方法提供了理论基础。"],"formulas":[],"uncertainties":["可能存在的断句问题，如 'one trajectory is better than' 可能应为 'one trajectory is better than another trajectory'，但未明确确认。"],"diagram":"none","start":2871.55,"end":3046.15,"asr_flags":[258],"math_clarifications":["原文中提到的奖励差值应作为sigmoid函数的输入，而不是直接作为轨迹的奖励值。因此，公式中的等号使用不严谨，需要修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":2871.55,"text":"Any individual preference label that's kind of binary saying A is better than B tells us a little bit of information about the reward. And from there, we want to figure out how to aggregate a number of these preference labels to learn a reward function. And so we'll assume that we have some data set of these pairs where"},{"start":2899.02,"text":"We kind of have a pair of trajectories. We were told which one is the good one and which one is better than the other one. And we want to be able to use this data set to learn a reward function. And one perhaps simple way to do this is we want to model, we need kind of some way to write down an objective for a reward function. Let's also say that our reward function, let's model it as a neural network. So our reward function will have some parameters."},{"start":2930.78,"text":"And then you can think of it as taking as input a state in action and outputting a scalar reward value. So if you want to write down an objective for this, one thing we could do, let's say that this is kind of used similar shorthand to what we've used before. This is the reward of the trajectory, this expression right here. Then maybe we could say that if we"},{"start":2964.7,"text":"took the reward of the better trajectory and subtracted the reward of the trajectory that's worse, then we want this quantity to be positive. So that's one starting point. And from there, we like to think about probabilities and do maximum likelihood training in machine learning in general."},{"start":2993.13,"text":"try to represent the probability that a trajectory is better than, one trajectory is better than"},{"start":2999.39,"text":"another trajectory. And so what we could do is we could take this, we could pass this into a"},{"start":3003.59,"text":"sigmoid function, which will kind of squash it between zero and one, and then represent that"},{"start":3010.63,"text":"as the probability that the winning trajectory is better than the trajectory that was marked"},{"start":3022.57,"text":"marked as inferior."},{"start":3024.85,"text":"And then if we did this, then we could"},{"start":3028.99,"text":"try to maximize the probability under our reward function."},{"start":3034.41,"text":"So we could try to then optimize the reward function such"},{"start":3039.25,"text":"that you're maximizing this probability."}],"speech_gaps":[],"frame":"../frames/v035/018.webp","frame_time":2883.55},{"title":"奖励学习中的轨迹比较与奖励函数优化","segments":[{"id":259,"text":"So this would be then summed over the trajectory pairs","zh":"因此，这将对轨迹对进行求和","start":3046.43,"end":3052.05},{"id":260,"text":"in our data set.","zh":"在我们的数据集中","start":3052.71,"end":3053.67},{"id":261,"text":"So specifically, we would take each of the pairs,","zh":"具体来说，我们将取每一对轨迹","start":3056.61,"end":3059.07},{"id":262,"text":"take the sum of rewards for each of these,","zh":"取这些轨迹的奖励总和","start":3060.47,"end":3064.41},{"id":263,"text":"and then take a sigmoid,","zh":"然后取一个sigmoid函数","start":3064.49,"end":3066.09},{"id":264,"text":"and then try to maximize that by running gradient.","zh":"然后通过运行梯度来最大化这个值","start":3066.17,"end":3069.43},{"id":265,"text":"It's also worth mentioning these taus, you could do it on a full trajectory. But in some scenarios, if a full trajectory is like driving from like Palo Alto to San Francisco or cleaning a kitchen, then there's many different subcomponents of that. And it might be hard, like there might be some parts of that trajectory that are better and some parts that are worse. And so you could also do this on partial trajectories and saying like this part of this trajectory is better than this part.","zh":"值得一提的是这些tau值，你也可以在整个轨迹上进行操作。但在某些情况下，如果一个完整轨迹就像从帕洛阿尔托开车到旧金山，或者打扫厨房，那么这个轨迹有许多不同的子部分。有些部分可能更好，有些部分可能更差。因此，你也可以在部分轨迹上进行操作，并说这个轨迹的某一部分比另一部分更好","start":3074.68,"end":3101.56},{"id":266,"text":"So you don't have to do it on full trajectories. We want a reward such that the sum of rewards for the better trajectory is higher than the sum of the rewards for the worst trajectory. Humans are classifying which trajectory is better. We want the reward to be discriminative of which trajectory is better. And so we define this probability that one trajectory is better than another trajectory.","zh":"因此，你不必在整个轨迹上进行操作。我们希望有一个奖励函数，使得更好轨迹的奖励总和高于最差轨迹的奖励总和。人类会判断哪条轨迹更好。我们希望奖励函数能够区分哪条轨迹更好。因此，我们定义了这样一个概率，即一条轨迹比另一条轨迹更好","start":3103.07,"end":3130.52},{"id":267,"text":"And then with this probability, you can try to maximize the reward parameters such that this is true. Yeah, so the question was, the human isn't telling us how much better a trajectory is. And you could have a scenario where maybe one trajectory is like this, one trajectory is like this, and then a third trajectory is like, I don't know, going all the way over here or something. And this objective isn't...","zh":"然后，有了这个概率，你可以尝试最大化奖励参数，使得这一点成立。是的，所以问题是，人类并没有告诉我们一条轨迹比另一条轨迹好多少。你可能会遇到一种情况，其中一条轨迹是这样的，另一条轨迹是这样的，而第三条轨迹可能是完全走到这边或者其他什么。而这个目标函数并没有……","start":3131.18,"end":3160.53},{"id":268,"text":"taking into account the fact that the preference of this over this is a smaller preference than the preference of this over this. When you end up optimizing this objective, oftentimes it will actually turn out that it will assign something. I guess a couple things here. If you have a lot of data,","zh":"考虑到这条轨迹相对于这条轨迹的偏好程度，比这条轨迹相对于这条轨迹的偏好程度要小。当你最终优化这个目标函数时，通常会发现它会分配某种结果。我想这里有几个要点。如果你有大量的数据，","start":3161.27,"end":3186.8},{"id":269,"text":"then it will also tell you that the solid green one is better than this one. And so you'll actually get lots of pairwise preferences on them. And so because of those pairwise preferences, you'll see a ranking like this is better than this, this is better than this, this is better than this. And when you do that, that'll force the reward function to assign a much higher reward value to this one compared to this one.","zh":"它也会告诉你这条实心绿色的轨迹比这条更好。因此，你实际上会得到很多成对的偏好关系。由于这些成对的偏好关系，你会看到一个排名，比如这条比那条好，那条比这条好，这条比那条好。当你这样做时，这会迫使奖励函数为这条轨迹分配比那条轨迹高得多的奖励值。","start":3187.38,"end":3214.78}],"notes":["本段讨论了在奖励学习中如何通过比较轨迹对来优化奖励函数。具体来说，对于每一对轨迹，计算它们的奖励总和，然后通过sigmoid函数进行转换，最后通过梯度上升来最大化这个转换后的值。这种方法允许模型从人类提供的轨迹偏好中学习到一个能够区分轨迹优劣的奖励函数。","讲者提到，虽然可以使用完整轨迹进行比较，但在某些场景下，如从帕洛阿尔托到旧金山的驾驶或清洁厨房等任务，轨迹可能包含多个子部分，这些子部分可能有好坏之分。因此，也可以在部分轨迹上进行比较，以更精细地捕捉轨迹的优劣。","讲者进一步指出，目标是定义一个奖励函数，使得更好轨迹的奖励总和高于更差轨迹的奖励总和。人类会提供轨迹的偏好，而奖励函数需要具有判别性，能够区分哪些轨迹更好。","讲者提到，通过定义轨迹之间更好的概率，可以尝试最大化奖励参数，使得这一概率成立。然而，人类并不提供轨迹之间差异的具体程度，因此需要通过大量数据来推断这些偏好。","讲者指出，当有大量数据时，系统会发现某些轨迹明显优于其他轨迹，并通过这些成对的偏好来构建一个排序，从而迫使奖励函数为某些轨迹分配更高的奖励值。","最后，讲者强调，这种优化过程可能会导致奖励函数对某些轨迹赋予更高的奖励值，从而实现对轨迹优劣的区分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3046.43,"end":3214.78,"asr_flags":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":3046.43,"text":"So this would be then summed over the trajectory pairs"},{"start":3052.71,"text":"in our data set."},{"start":3056.61,"text":"So specifically, we would take each of the pairs,"},{"start":3060.47,"text":"take the sum of rewards for each of these,"},{"start":3064.49,"text":"subtract them, take a sigmoid,"},{"start":3066.17,"text":"and then try to maximize that by running gradient."},{"start":3074.68,"text":"It's also worth mentioning these taus, you could do it on a full trajectory. But in some scenarios, if a full trajectory is like driving from like Palo Alto to San Francisco or cleaning a kitchen, then there's many different subcomponents of that. And it might be hard, like there might be some parts of that trajectory that are better and some parts that are worse. And so you could also do this on partial trajectories and saying like this part of this trajectory is better than this part."},{"start":3103.07,"text":"So you don't have to do it on full trajectories. We want a reward such that the sum of rewards for the better trajectory is higher than the sum of the rewards for the worst trajectory. Humans are classifying which trajectory is better. We want the reward to be discriminative of which trajectory is better. And so we define this probability that one trajectory is better than another trajectory."},{"start":3131.18,"text":"And then with this probability, you can try to maximize the reward parameters such that this is true. Yeah, so the question was, the human isn't telling us how much better a trajectory is. And you could have a scenario where maybe one trajectory is like this, one trajectory is like this, and then a third trajectory is like, I don't know, going all the way over here or something. And this objective isn't..."},{"start":3161.27,"text":"taking into account the fact that the preference of this over this is a smaller preference than the preference of this over this. When you end up optimizing this objective, oftentimes it will actually turn out that it will assign something. I guess a couple things here. If you have a lot of data,"},{"start":3187.38,"text":"then it will also tell you that the solid green one is better than this one. And so you'll actually get lots of pairwise preferences on them. And so because of those pairwise preferences, you'll see a ranking like this is better than this, this is better than this, this is better than this. And when you do that, that'll force the reward function to assign a much higher reward value to this one compared to this one."}],"speech_gaps":[],"frame":"../frames/v035/019.webp","frame_time":3058.43},{"title":"奖励学习中的偏好收集与梯度更新","segments":[{"id":270,"text":"So it will already do what you want. You could also, there's a couple other ways to get this information. Sometimes when you actually ask humans for preferences, sometimes you also just give them a batch and tell them their rank as well. And that would make this even more explicit. So the complete algorithm for what this looks like is you have some data set of trajectories.","zh":"所以它会已经做你想做的事情。你也可以通过其他几种方式获取这些信息。有时候当你实际向人类询问偏好时，有时你也会给他们一批数据，并告诉他们它们的排名。这会使这个过程更加明确。因此，这个算法的完整形式是，你有一些轨迹的数据集。","start":3215.32,"end":3242.85},{"id":271,"text":"you're going to sample batches of k trajectories and then ask a human to rank those k trajectories. For language models, when you do this, so this is actually a very common way to learn reward functions for language models, and you'll often actually use the same prompt and sample k responses and then ask them to rank those k responses. And this is useful because...","zh":"你将从数据集中采样k个轨迹，然后让人类对这k个轨迹进行排序。对于语言模型来说，当你这样做时，这实际上是学习语言模型奖励函数的一种非常常见的方法，你通常会使用相同的提示，并采样k个响应，然后让人类对这k个响应进行排序。这种方法是有用的，因为...","start":3243.45,"end":3269.2},{"id":272,"text":"These trajectories all start from some initial point. You can think of this as starting from the same prompt, but you might have other responses that are starting from a different prompt over here. And for a different prompt or from a different starting place, it's a lot harder to talk about, is this black one better than this green one? It got there, maybe it got here faster, but it also was an easier starting point, right?","zh":"这些轨迹都从某个初始点开始。你可以将这视为从同一个提示开始，但你可能有其他响应是从不同的提示开始的。对于不同的提示或不同的起始点，很难讨论，这个黑色的轨迹是否比这个绿色的轨迹更好？它可能更快到达那里，但它也从一个更容易的起始点开始，对吧？","start":3270.41,"end":3294.73},{"id":273,"text":"And so oftentimes we'll try to sample about destructories that have a similar starting position. Then we will compute the rewards under our current reward model, essentially do a forward pass and sum over the states and actions. And then we can compute the gradient, do a backward pass using our objective where this is for every pair of","zh":"因此，我们经常尝试采样那些起始位置相似的轨迹。然后我们将在当前的奖励模型下计算奖励，本质上进行一次前向传播，并对状态和动作进行求和。然后我们可以计算梯度，使用我们的目标函数进行反向传播，其中对于每一对","start":3295.61,"end":3320.85},{"id":274,"text":"for each pair within the ranking. So there's kind of K-Choose-2 different combinations of pairs. And if you have a ranking, then you'll have a full set of K-Choose-2 labels.","zh":"在排序中的每一对。因此，总共有K选2种不同的轨迹对组合。如果你有一个排序，那么你将拥有完整的K选2个标签。","start":3321.91,"end":3335.17},{"id":275,"text":"And then you can update theta using the computed gradient. And then you can also repeat this process. So repeating this just corresponds to doing kind of gradient descent on your objective on a single data set. Now, one thing that you can also do is you can also do this in the loop of reinforcement learning. So you have your samples from your policy, and then you can ask for,","zh":"然后你可以使用计算出的梯度来更新θ。你也可以重复这个过程。因此，重复这个过程相当于在你的目标函数上对单个数据集进行梯度下降。现在，你还可以在强化学习的循环中进行这个操作。你有从策略中采样的样本，然后你可以要求，","start":3338.13,"end":3369.66}],"notes":["本段讲解了在奖励学习中如何通过人类偏好来训练奖励模型。具体方法是通过采样轨迹并让人类对这些轨迹进行排序，从而获得更明确的偏好信息。这种方法在语言模型中非常常见，通常会使用相同的提示词生成多个响应，再让人类对这些响应进行排序。","在进行梯度更新时，需要确保所有轨迹具有相似的起始点，以减少比较时的偏差。计算奖励时，会进行前向传播并累加状态和动作的奖励值，然后通过反向传播计算梯度，以优化奖励模型的参数。","对于每一对轨迹，都会生成K-Choose-2种组合，从而得到完整的标签集。这有助于更全面地利用人类的偏好信息，提高奖励模型的准确性。","梯度更新过程可以重复进行，相当于在单个数据集上进行梯度下降。此外，这种方法也可以嵌入到强化学习的循环中，利用策略生成的样本进行偏好收集和模型更新。"],"formulas":[],"uncertainties":["destructories"],"diagram":"none","start":3215.32,"end":3369.66,"asr_flags":[],"math_clarifications":["原文中提到的'K-Choose-2'是组合数的表达方式，但未提供完整的数学公式或上下文来明确其定义。因此，无法核定其正确性，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3215.32,"text":"So it will already do what you want. You could also, there's a couple other ways to get this information. Sometimes when you actually ask humans for preferences, sometimes you also just give them a batch and tell them their rank as well. And that would make this even more explicit. So the complete algorithm for what this looks like is you have some data set of trajectories."},{"start":3243.45,"text":"you're going to sample batches of k trajectories and then ask a human to rank those k trajectories. For language models, when you do this, so this is actually a very common way to learn reward functions for language models, and you'll often actually use the same prompt and sample k responses and then ask them to rank those k responses. And this is useful because..."},{"start":3270.41,"text":"These trajectories all start from some initial point. You can think of this as starting from the same prompt, but you might have other responses that are starting from a different prompt over here. And for a different prompt or from a different starting place, it's a lot harder to talk about, is this black one better than this green one? It got there, maybe it got here faster, but it also was an easier starting point, right?"},{"start":3295.61,"text":"And so oftentimes we'll try to sample about destructories that have a similar starting position. Then we will compute the rewards under our current reward model, essentially do a forward pass and sum over the states and actions. And then we can compute the gradient, do a backward pass using our objective where this is for every pair of"},{"start":3321.91,"text":"for each pair within the ranking. So there's kind of K-Choose-2 different combinations of pairs. And if you have a ranking, then you'll have a full set of K-Choose-2 labels."},{"start":3338.13,"text":"And then you can update theta using the computed gradient. And then you can also repeat this process. So repeating this just corresponds to doing kind of gradient descent on your objective on a single data set. Now, one thing that you can also do is you can also do this in the loop of reinforcement learning. So you have your samples from your policy, and then you can ask for,"}],"speech_gaps":[],"frame":"../frames/v035/020.webp","frame_time":3227.32},{"title":"奖励学习中的偏好反馈与奖励函数更新","segments":[{"id":276,"text":"Humans to rank them and then update your rewards. And then after you have your updated reward model, then maybe your reward model is more accurate. And maybe you want to be going like here, for example, instead of going here, then you could then re-update your reward function and then update your policy again, and then get new rollouts for your policy, ask a human to label those rollouts, re-update your reward function and repeat.","zh":"人类对它们进行排序，然后更新你的奖励。然后在你拥有更新后的奖励模型之后，也许你的奖励模型会更准确。也许你想要像这里这样，例如，而不是去那里，然后你可以重新更新你的奖励函数，再次更新你的策略，并获取你策略的新轨迹，让人类对这些轨迹进行标注，重新更新你的奖励函数并重复这个过程。","start":3370.83,"end":3399.25},{"id":277,"text":"Okay. So that's how we can learn from preferences. There's a few examples of this. So some of the first times people have learned from preferences were in some simulated settings. So in this case, if you want to get this simulated thing to do a backflip, it's very hard to write a reward function for doing a backflip. And so they used 900... queries.","zh":"好的。所以这就是我们如何从偏好中学习的方法。有一些这种例子。一些最早从偏好中学习的案例是在一些模拟环境中进行的。在这种情况下，如果你想让这个模拟体完成一个后空翻，很难写出一个执行后空翻的奖励函数。因此他们使用了900次查询。","start":3403.31,"end":3427.64},{"id":278,"text":"They asked humans 900 times, like, is this better than this? They actually did it in the loop of reinforcement learning. And they got a policy that is able to learn how to do a backflip and in the process also learn a reward function for a human preferred backflip.","zh":"他们让人类900次回答，比如，这个比这个更好吗？他们实际上是在强化学习的循环中进行的。他们得到了一个能够学习如何完成后空翻的策略，并且在这个过程中也学习到了人类偏好的后空翻奖励函数。","start":3429.06,"end":3446.58},{"id":279,"text":"Also in driving, it's very hard to get reward functions. And so there was work that used this kind of approach to learn things like how much does it matter to stay within your lane, keep a certain speed, collision avoidance, those sorts of things. And you would imagine that collision avoidance is much, much more important than keeping a certain speed, for example. And you can learn a reward function that way.","zh":"在驾驶方面，也很难获得奖励函数。因此有一些工作使用了这种方法来学习诸如保持在车道内、保持一定速度、避障等事项的重要性。你可以想象避障比保持一定速度重要得多，例如。你可以通过这种方式学习奖励函数。","start":3448.3,"end":3471.48},{"id":280,"text":"Cool. And then there's also language models. So this has been a very popular way to learn rewards for language models. And you can have some prompt, like, how do I cook an omelet? Then you can sample from your language model two different responses for that prompt. Then we ask a person which response is better.","zh":"很酷。此外还有语言模型。这种方法已经被广泛用于学习语言模型的奖励。你可以有一个提示，比如，如何做煎蛋卷？然后你可以从你的语言模型中对这个提示生成两个不同的回答。然后我们让一个人来判断哪个回答更好。","start":3472.33,"end":3490.88},{"id":281,"text":"When we're doing training, we might actually pay people to label our data. You might have also, if you've interacted with ChatGPT, sometimes it might have asked you these sorts of things. You're providing labels to give OpenAI the ability to learn a reward function that is better for your preferences. And then once you have the things that are better, then you can train a reward model that judges how good a response Y is for a given prompt.","zh":"当我们进行训练时，我们可能会实际支付人们来标注我们的数据。你可能也遇到过，如果你使用过ChatGPT，有时它可能会向你提出类似的问题。你提供标签是为了让OpenAI能够学习一个更符合你偏好的奖励函数。一旦你有了更好的东西，你就可以训练一个奖励模型，用来判断对于给定的提示，响应Y有多好。","start":3491.56,"end":3518.11},{"id":282,"text":"And so then in terms of what the kind of full language model pipeline is, like if you wanted to train something like ChatGPT, first you'll do some large scale pre-training on like very, very large mixed quality data with kind of just predicting the next token. Then you typically have a second stage, which is to fine tune on higher quality data. And in particular, after step one,","zh":"因此，从整个语言模型的流程来看，比如如果你想训练像ChatGPT这样的模型，首先你会在非常大的混合质量数据上进行大规模的预训练，主要任务是预测下一个标记。然后你通常会有一个第二阶段，即在高质量数据上进行微调。特别是第一步之后，","start":3521.65,"end":3550.23}],"notes":["本段讲解了如何通过人类的偏好反馈来学习奖励函数。首先，人类对不同的策略进行排序，然后更新奖励模型。更新后的奖励模型可能更准确，之后可以重新更新奖励函数并更新策略，再获取新的策略执行结果，让人类对这些结果进行标注，再次更新奖励函数并重复这一过程。","在模拟环境中，例如让模拟体完成后空翻，直接编写奖励函数非常困难。因此，研究者使用了900次查询，让人类判断两个结果哪个更好，并在强化学习的循环中进行训练，最终得到了能够完成后空翻的策略，并同时学习了人类偏好的奖励函数。","在驾驶任务中，编写奖励函数同样困难。研究者使用了类似的偏好反馈方法，学习了诸如保持车道、保持速度、避障等任务的重要性。例如，避障比保持速度更重要，可以通过这种方式学习奖励函数。","在语言模型中，偏好反馈被广泛用于学习奖励函数。例如，对于“如何做煎蛋”这样的提示，模型会生成两个不同的回答，然后让人类选择更好的回答。通过这种方式，可以训练出更符合人类偏好的奖励模型。","在训练过程中，研究者可能会支付人类标注数据。例如，用户在使用ChatGPT时，有时会被询问对回答的偏好，从而帮助OpenAI学习更符合用户偏好的奖励函数。","语言模型的训练流程通常包括两个阶段：首先进行大规模的预训练，使用大量混合质量的数据进行下一个词的预测；然后进行微调，使用高质量数据进一步优化模型。在预训练之后，会进行奖励函数的学习和优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3370.83,"end":3550.23,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3370.83,"text":"humans to rank them and then update your rewards. And then after you have your updated reward model, then maybe your reward model is more accurate. And maybe you want to be going like here, for example, instead of going here, then you could then re-update your reward function and then update your policy again, and then get new rollouts for your policy, ask a human to label those rollouts, re-update your reward function and repeat."},{"start":3403.31,"text":"Okay. So that's how we can learn from preferences. There's a few examples of this. So some of the first times people have learned from preferences were in some simulated settings. So in this case, if you want to get this simulated thing to do a backflip, it's very hard to write a reward function for doing a backflip. And so they used 900..."},{"start":3429.06,"text":"queries. They asked humans 900 times, like, is this better than this? They actually did it in the loop of reinforcement learning. And they got a policy that is able to learn how to do a backflip and in the process also learn a reward function for a human preferred backflip."},{"start":3448.3,"text":"Also in driving, it's very hard to get reward functions. And so there was work that used this kind of approach to learn things like how much does it matter to stay within your lane, keep a certain speed, collision avoidance, those sorts of things. And you would imagine that collision avoidance is much, much more important than keeping a certain speed, for example. And you can learn a reward function that way."},{"start":3472.33,"text":"Cool. And then there's also language models. So this has been a very popular way to learn rewards for language models. And you can have some prompt, like, how do I cook an omelet? Then you can sample from your language model two different responses for that prompt. Then we ask a person which response is better."},{"start":3491.56,"text":"When we're doing training, we might actually pay people to label our data. You might have also, if you've interacted with ChatGPT, sometimes it might have asked you these sorts of things. You're providing labels to give OpenAI the ability to learn a reward function that is better for your preferences. And then once you have the things that are better, then you can train a reward model that judges how good a response Y is for a given prompt."},{"start":3521.65,"text":"And so then in terms of what the kind of full language model pipeline is, like if you wanted to train something like ChatGPT, first you'll do some large scale pre-training on like very, very large mixed quality data with kind of just predicting the next token. Then you typically have a second stage, which is to fine tune on higher quality data. And in particular, after step one,"}],"speech_gaps":[],"frame":"../frames/v035/021.webp","frame_time":3382.83},{"title":"奖励学习（Reward Learning）","segments":[{"id":283,"text":"Before you do any kind of supervised fine-tuning or reinforcement learning, you'll get a language model that knows a lot of things, but it's not easy to control or to get it to do what you want it to do. And it might not answer questions. It might not do what you requested. It might just predict reasonable next tokens that come after that. Whereas in supervised fine-tuning, we can generate a higher quality data set that has like for a given prompt, this is how you should reply. And so we do some kind of basically imitation learning on that data set.","zh":"在进行任何类型的监督微调或强化学习之前，你会得到一个知道很多事物的语言模型，但它不容易被控制，也不容易让它做你想让它做的事情。它可能不会回答问题。它可能不会按照你的要求去做。它可能只会预测在该输入之后合理的下一个标记。而在监督微调中，我们可以生成一个高质量的数据集，其中对于给定的提示，会说明应该如何回复。因此，我们基本上是在这个数据集上进行模仿学习。","start":3552.67,"end":3580.61},{"id":284,"text":"And then there's a third step, which is to use the human feedback and then kind of fine-tune the model that you got from supervised fine-tuning on higher quality preference data.","zh":"然后还有第三步，即利用人类反馈，并在从监督微调中获得的模型上，使用更高质量的偏好数据进行微调。","start":3581.74,"end":3592.5},{"id":285,"text":"And what this third step looks like is first you gather the preference data.","zh":"第三步的具体表现是，首先你会收集偏好数据。","start":3593.38,"end":3596.52},{"id":286,"text":"There are also actually existing preference data sets that you can use as well.","zh":"实际上也存在可以使用的现有偏好数据集。","start":3596.88,"end":3600.92},{"id":287,"text":"You don't necessarily have to collect it using your model.","zh":"你不一定非要使用自己的模型来收集这些数据。","start":3601.02,"end":3607.36},{"id":288,"text":"model. Second, you'll train a reward model that is judging how good a response is. And","zh":"模型。第二，你会训练一个奖励模型，用来评估响应的质量。","start":3607.36,"end":3615.58},{"id":289,"text":"then lastly, you'll do reinforcement learning to maximize that reward function.","zh":"最后，你会进行强化学习以最大化这个奖励函数。","start":3615.58,"end":3618.44},{"id":290,"text":"We will talk more about preference learning on Wednesday next week, but one somewhat common","zh":"我们将在下周三更详细地讨论偏好学习，但其中一种较为常见的","start":3619.36,"end":3625.06},{"id":291,"text":"approach is to use PPO to maximize the reward. The question is, is X just the prompt or is","zh":"一种方法是使用PPO来最大化奖励。问题是，X只是提示还是","start":3625.06,"end":3633.16},{"id":292,"text":"Is it the whole history?","zh":"它是整个历史吗？","start":3633.16,"end":3633.82},{"id":293,"text":"Oftentimes, it's the whole history.","zh":"通常情况下，它是整个历史。","start":3634.72,"end":3636.42},{"id":294,"text":"And you can sort of...","zh":"你可以某种程度上...","start":3637.32,"end":3640.4},{"id":295,"text":"Oftentimes, generally also when you formulate RL problems for language models,","zh":"通常情况下，当你为语言模型制定强化学习问题时，","start":3640.92,"end":3644.72},{"id":296,"text":"you will have...","zh":"你将会有...","start":3645.28,"end":3646.62},{"id":297,"text":"You can model it as a sequential problem,","zh":"你可以将其建模为一个序列问题，","start":3647.68,"end":3649.9},{"id":298,"text":"but you can also...","zh":"但你也可以...","start":3650.1,"end":3651.84},{"id":299,"text":"There's a simpler but more crude way to model it,","zh":"有一种更简单但更粗糙的方式来建模它，","start":3653.36,"end":3657.42},{"id":300,"text":"which is to use all the history and just treat the next response","zh":"即使用所有历史数据，并将下一个响应视为你优化的对象。","start":3657.5,"end":3659.66},{"id":301,"text":"as the thing that you're optimizing over.","zh":"因此，问题是：我们如何从偏好排序转换到这里的这个概率？因此，在","start":3659.66,"end":3661.7},{"id":302,"text":"So the question is how do we go from preference rankings to this probability right here? So in","zh":"我们的偏好中，我们可能会有一个排序，例如 A 比 B 好，而 B 比 C 好。如果我们有 k 条轨迹的排序，那么我们可以形成 k 选 2 的配对，","start":3662.52,"end":3669.44},{"id":303,"text":"our preferences we're saying that we might have a ranking, say like A is better than B which is","zh":"并在每对中，我们会有 A 比 B 好，或者 B 比 A 好。","start":3669.44,"end":3674.58},{"id":304,"text":"better than C. If we have a ranking of k trajectories then we can formulate k choose","zh":"以及。","start":3674.58,"end":3681.54},{"id":305,"text":"two pairs where and within each pair we'll have like an A is better than B or B is better than","zh":"两组，其中在每组中我们将有类似A比B好或B比A好的情况","start":3681.54,"end":3689.3},{"id":306,"text":"And.","zh":"并且。","start":3689.3,"end":3689.34},{"id":307,"text":"We're using tau w to represent the response or the trajectory that was preferred and tau l to represent the one that was dispreferred. And then we sample one of those pairs, one of those case-choose pairs, and then we plug it into this equation right here.","zh":"我们用 tau w 来表示被偏好的响应或轨迹，用 tau l 来表示被不偏好的响应或轨迹。然后我们从这些配对中采样一对，即一个案例选择对，然后将其代入此处的方程。","start":3689.98,"end":3707.68}],"notes":["本段讨论了奖励学习中的一个关键问题，即如何从偏好排序转化为概率分布。讲者提到，当有k条轨迹的偏好排序时，可以生成k选2对，每对中包含一个更优轨迹和一个较差轨迹。这种配对方式为后续的奖励模型训练提供了数据基础。","讲者指出，偏好排序可以转化为概率分布，这需要将偏好信息输入到特定的公式中。例如，使用τ_w表示被偏好轨迹，τ_l表示不被偏好轨迹，然后从这些配对中采样并代入公式进行计算。","在实际操作中，奖励模型的训练依赖于这些偏好数据，而这些数据可以通过收集用户反馈或使用已有的偏好数据集来获得。这一步骤是强化学习流程中的关键环节。","讲者还提到，强化学习问题可以建模为序列问题，也可以采用更简单但粗糙的方法，即使用所有历史信息并将其视为优化目标。这表明在实际应用中，可以根据具体需求选择不同的建模方式。","最后，讲者强调了从偏好排序到概率分布的转换过程，这一步骤是构建奖励模型的基础，也是整个奖励学习流程中的核心部分。","讲者在讨论中提到，奖励函数的优化是通过强化学习算法（如PPO）来实现的，这表明奖励学习与强化学习的结合是实现模型行为优化的重要手段。"],"formulas":[],"uncertainties":["And."],"diagram":"none","start":3552.67,"end":3707.68,"asr_flags":[306],"math_clarifications":["原文中提到使用偏好排名来构建概率，但未提供具体的数学公式或条件来支持该概率表达式。因此，该公式无法核定，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":3552.67,"text":"Before you do any kind of supervised fine-tuning or reinforcement learning, you'll get a language model that knows a lot of things, but it's not easy to control or to get it to do what you want it to do. And it might not answer questions. It might not do what you requested. It might just predict reasonable next tokens that come after that. Whereas in supervised fine-tuning, we can generate a higher quality data set that has like for a given prompt, this is how you should reply. And so we do some kind of basically imitation learning on that data set."},{"start":3581.74,"text":"And then there's a third step, which is to use the human feedback and then kind of fine-tune the model that you got from supervised fine-tuning on higher quality preference data."},{"start":3593.38,"text":"And what this third step looks like is first you gather the preference data."},{"start":3596.88,"text":"There are also actually existing preference data sets that you can use as well."},{"start":3601.02,"text":"You don't necessarily have to collect it using your model."},{"start":3607.36,"text":"model. Second, you'll train a reward model that is judging how good a response is. And"},{"start":3615.58,"text":"then lastly, you'll do reinforcement learning to maximize that reward function."},{"start":3619.36,"text":"We will talk more about preference learning on Wednesday next week, but one somewhat common"},{"start":3625.06,"text":"approach is to use PPO to maximize the reward. The question is, is X just the prompt or is"},{"start":3633.16,"text":"Is it the whole history?"},{"start":3634.72,"text":"Oftentimes, it's the whole history."},{"start":3637.32,"text":"And you can sort of..."},{"start":3640.92,"text":"Oftentimes, generally also when you formulate RL problems for language models,"},{"start":3645.28,"text":"you will have..."},{"start":3647.68,"text":"You can model it as a sequential problem,"},{"start":3650.1,"text":"but you can also..."},{"start":3653.36,"text":"There's a simpler but more crude way to model it,"},{"start":3657.5,"text":"which is to use all the history and just treat the next response"},{"start":3659.66,"text":"as the thing that you're optimizing over."},{"start":3662.52,"text":"So the question is how do we go from preference rankings to this probability right here? So in"},{"start":3669.44,"text":"our preferences we're saying that we might have a ranking, say like A is better than B which is"},{"start":3674.58,"text":"better than C. If we have a ranking of k trajectories then we can formulate k choose"},{"start":3681.54,"text":"two pairs where and within each pair we'll have like an A is better than B or B is better than"},{"start":3689.3,"text":"And."},{"start":3689.98,"text":"We're using tau w to represent the response or the trajectory that was preferred and tau l to represent the one that was dispreferred. And then we sample one of thos
