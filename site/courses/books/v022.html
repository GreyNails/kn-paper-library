x;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 12 多任务强化学习（Multi-Task RL） · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v022","title":"Lecture 12 多任务强化学习（Multi-Task RL）","course":"强化学习","pages":[{"title":"模型基础强化学习与多任务强化学习","segments":[{"id":0,"text":"Now let's get started. Today we will be finishing up model-based reinforcement learning, specifically a way to use a learned model with synthetic data generation, and when to use model-based reinforcement learning. And then we're going to be talking about multitask imitation learning and reinforcement learning, including ways to conditions on tasks, different tasks as goal-reaching tasks, and an approach called hindsight relabeling, which you'll be implementing","start":5.2,"end":34.12},{"id":1,"text":"Cool. So let's get back to model-based reinforcement learning. So last time we talked about a scenario where we learn some model. That model could be a deterministic model. It could also be modeling a distribution over next states.","start":35.14,"end":54.16},{"id":2,"text":"And in particular, you could think about it as trying to approximate the distribution over the next state,","start":55.48,"end":65.2},{"id":3,"text":"given the current state of action.","start":65.3,"end":66.8},{"id":4,"text":"And you can use this model to actually kind of predict what will happen in the future.","start":67.34,"end":73.34},{"id":5,"text":"And for example, if you have an action that you think you might take or multiple actions you think you might take,","start":73.46,"end":79.98},{"id":6,"text":"you can use this estimated distribution to generate or imagine what might happen","start":79.98,"end":87.62},{"id":7,"text":"in the future if you were to take those actions. We talked about an approach to","start":87.62,"end":95.54},{"id":8,"text":"behavior that's quite different from learning a policy where we're not","start":95.54,"end":98.88},{"id":9,"text":"actually explicitly learning a mapping from states to actions and","start":98.88,"end":102.98},{"id":10,"text":"instead on the fly we are thinking through for a given state what actions","start":102.98,"end":108.46},{"id":11,"text":"we should take. We called this planning. And we talked about how this sort of planning can be done","start":108.46,"end":113.96},{"id":12,"text":"with gradient-based or sampling-based optimization over your next future horizon. And we also talked","start":113.96,"end":121.62},{"id":13,"text":"about how it's important to update the model using the data collected, because then you'll","start":121.62,"end":127.0},{"id":14,"text":"be able to actually learn a better model in the realms that you want to use that model.","start":127.0,"end":130.9},{"id":15,"text":"And then periodically, we also talked about how you can replan to help account for mistakes,","start":132.84,"end":137.42},{"id":16,"text":"account for errors in the model, and also react to changes in the environment.","start":137.42,"end":143.32},{"id":17,"text":"Cool. The pros of this sort of planning approach is that it's simple, it's easy to plug in different goals or rewards if you have a general enough model, possibly even at test time.","start":145.56,"end":155.3},{"id":18,"text":"And the downside is that it's compute intensive at test time. It requires a lot of test time computed inference time.","start":155.74,"end":161.3},{"id":19,"text":"and this particular instantiation was only practical for short horizon problems where","start":161.3,"end":168.22},{"id":20,"text":"or for very shaped words where you can plan over some shorter horizon rather than considering like","start":168.22,"end":176.06},{"id":21,"text":"an extremely long horizon and the reason why short horizons there's kind of two reasons why","start":176.06,"end":184.24}],"notes":["本段继续讨论模型基础强化学习的规划方法，强调其在短时间范围内的实用性。讲者提到，这种规划方法在测试时计算量较大，因此只适用于短时间范围的问题，或者在某些特定结构的问题中，可以规划较短的时间范围。讲者还提到，短时间范围的原因有两个，但具体原因未明确说明。","讲者指出，模型基础强化学习的规划方法具有简单易用的优点，特别是在模型足够通用的情况下，可以轻松地插入不同的目标或奖励函数，甚至在测试时也能进行调整。然而，这种方法的缺点是测试时计算量大，需要大量的推理时间。","讲者提到，模型基础强化学习的规划方法需要定期重新规划，以应对模型中的错误和环境的变化。这表明，规划方法需要动态调整，以适应新的信息和变化的环境。","讲者强调，模型基础强化学习的规划方法适用于短时间范围的问题，因为长时间范围的规划会带来较大的计算负担。因此，在实际应用中，需要根据问题的特性选择合适的规划时间范围。","讲者提到，模型基础强化学习的规划方法需要使用收集到的数据来更新模型，以提高模型的准确性。这表明，模型的更新是规划方法成功的关键因素之一。","讲者还提到，模型基础强化学习的规划方法可以用于不同的任务，包括目标导向的任务，并且可以使用一种称为‘回顾重贴标签’（hindsight relabeling）的方法来改进学习效果。"],"formulas":[],"uncertainties":["short horizons there's kind of two reasons why"],"diagram":"none","start":5.2,"end":184.24,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.2,"text":"Now let's get started. Today we will be finishing up model-based reinforcement learning, specifically a way to use a learned model with synthetic data generation, and when to use model-based reinforcement learning. And then we're going to be talking about multitask imitation learning and reinforcement learning, including ways to conditions on tasks, different tasks as goal-reaching tasks, and an approach called hindsight relabeling, which you'll be implementing"},{"start":35.14,"text":"Cool. So let's get back to model-based reinforcement learning. So last time we talked about a scenario where we learn some model. That model could be a deterministic model. It could also be modeling a distribution over next states."},{"start":55.48,"text":"And in particular, you could think about it as trying to approximate the distribution over the next state,"},{"start":65.3,"text":"given the current state of action."},{"start":67.34,"text":"And you can use this model to actually kind of predict what will happen in the future."},{"start":73.46,"text":"And for example, if you have an action that you think you might take or multiple actions you think you might take,"},{"start":79.98,"text":"you can use this estimated distribution to generate or imagine what might happen"},{"start":87.62,"text":"in the future if you were to take those actions. We talked about an approach to"},{"start":95.54,"text":"behavior that's quite different from learning a policy where we're not"},{"start":98.88,"text":"actually explicitly learning a mapping from states to actions and"},{"start":102.98,"text":"instead on the fly we are thinking through for a given state what actions"},{"start":108.46,"text":"we should take. We called this planning. And we talked about how this sort of planning can be done"},{"start":113.96,"text":"with gradient-based or sampling-based optimization over your next future horizon. And we also talked"},{"start":121.62,"text":"about how it's important to update the model using the data collected, because then you'll"},{"start":127.0,"text":"be able to actually learn a better model in the realms that you want to use that model."},{"start":132.84,"text":"And then periodically, we also talked about how you can replan to help account for mistakes,"},{"start":137.42,"text":"account for errors in the model, and also react to changes in the environment."},{"start":145.56,"text":"Cool. The pros of this sort of planning approach is that it's simple, it's easy to plug in different goals or rewards if you have a general enough model, possibly even at test time."},{"start":155.74,"text":"And the downside is that it's compute intensive at test time. It requires a lot of test time computed inference time."},{"start":161.3,"text":"and this particular instantiation was only practical for short horizon problems where"},{"start":168.22,"text":"or for very shaped words where you can plan over some shorter horizon rather than considering like"},{"start":176.06,"text":"an extremely long horizon and the reason why short horizons there's kind of two reasons why"}],"speech_gaps":[],"frame":"../frames/v022/001.webp","frame_time":17.2},{"title":"多任务强化学习中的模型使用与数据增强","segments":[{"id":22,"text":"This is only applicable to short horizons. One is that as you increase the horizon it","start":184.24,"end":188.72},{"id":23,"text":"it becomes even more compute intensive.","start":188.72,"end":190.56},{"id":24,"text":"And the second reason is that the model is not very accurate","start":190.9,"end":193.3},{"id":25,"text":"when you try to apply it multiple times","start":193.96,"end":196.68},{"id":26,"text":"to generate a long trajectory.","start":196.68,"end":198.58},{"id":27,"text":"Cool.","start":200.78,"end":201.3},{"id":28,"text":"Now, there's a second way that you can use these kinds of learn","start":201.84,"end":204.36},{"id":29,"text":"models, and that is to learn a policy.","start":204.36,"end":207.08},{"id":30,"text":"And so that's what we'll talk about right now.","start":208.04,"end":210.98},{"id":31,"text":"And the key idea is that we could actually","start":211.58,"end":213.38},{"id":32,"text":"use this model of the future, this kind of learn simulator,","start":213.9,"end":217.54},{"id":33,"text":"later to augment any sort of data that we've collected.","start":217.54,"end":221.2},{"id":34,"text":"So say that in the real world or the real environment,","start":222.38,"end":225.52},{"id":35,"text":"we've collected some data.","start":225.66,"end":226.76},{"id":36,"text":"So we have some trajectories.","start":227.08,"end":230.18},{"id":37,"text":"Some of this data could also have been provided to us","start":230.2,"end":232.72},{"id":38,"text":"And so maybe the data that we have in the real environment","start":232.72,"end":233.74},{"id":39,"text":"And so maybe the data that we have in the real environment","start":235.0,"end":240.1},{"id":40,"text":"looks something like this. Does anyone have thoughts on how we might use our, like ways in which we might want to use our learned model to augment this data set right here? Like how would we go, like procedurally, like what would we do to try to generate synthetic data?","start":240.99,"end":264.22},{"id":41,"text":"Yeah, so the thought there was that you could take the last state and then generate more from there. So you could add on to the last state here. That's one thing you could do. Other thoughts on things you could do? Yeah. So something like Dagger where you take the first part that's run by the policy and then the second part that's kind of from the model. So it's kind of similar to this maybe, but maybe you do it earlier. Is that what you're saying?","start":265.15,"end":291.48},{"id":42,"text":"Yeah, so you don't just have to start at the end. You could also start anywhere in the middle as well. So you could, for example, generate kind of trajectories from really any sort of state in your buffer, your data set. And then if you were to do something like that, then you would kind of be able to generate data that looks like this, where everything that is in red is","start":292.3,"end":321.07},{"id":43,"text":"kind of synthetic data or data that was imagined using your model. And then everything in black is the real data from the environment. Now, one thing that we talked about before is that our model is not very good to be like, you can't really trust it if you're to make a really long rollout. And so one thing that you can do is keep these trajectories very short.","start":321.47,"end":349.18}],"notes":["本段讨论了多任务强化学习中模型应用的局限性，特别是当时间跨度增加时，计算成本会显著上升。这表明模型在长轨迹生成时可能不够准确，因此需要限制轨迹长度。","接下来，讲者介绍了另一种使用学习模型的方法，即学习策略。这表明模型不仅可以用于模拟环境，还可以用于策略优化。","讲者提到可以利用学习到的模型来增强已有的数据集，通过生成合成数据来扩展数据集。这包括从任意状态生成轨迹，从而增加数据的多样性。","讲者还提到，由于模型在长轨迹生成时不可靠，因此建议保持轨迹较短。这表明在实际应用中需要权衡模型的准确性与计算成本。","讲者通过提问引导学生思考如何利用模型生成合成数据，并举例说明了Dagger方法，即结合策略和模型生成数据。这表明模型可以与策略协同工作，以提高数据质量。","最后，讲者强调了模型在生成数据时的局限性，并指出需要在数据增强过程中保持对模型可靠性的关注。这表明在实际应用中需要谨慎使用模型生成的数据。"],"formulas":[],"uncertainties":[],"diagram":"none","start":184.24,"end":349.18,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":184.24,"text":"this is only applicable to short horizons one is that as you increase the horizon it"},{"start":188.72,"text":"it becomes even more compute intensive."},{"start":190.9,"text":"And the second reason is that the model is not very accurate"},{"start":193.96,"text":"when you try to apply it multiple times"},{"start":196.68,"text":"to generate a long trajectory."},{"start":200.78,"text":"Cool."},{"start":201.84,"text":"Now, there's a second way that you can use these kinds of learn"},{"start":204.36,"text":"models, and that is to learn a policy."},{"start":208.04,"text":"And so that's what we'll talk about right now."},{"start":211.58,"text":"And the key idea is that we could actually"},{"start":213.9,"text":"use this model of the future, this kind of learn simulator,"},{"start":217.54,"text":"later to augment any sort of data that we've collected."},{"start":222.38,"text":"So say that in the real world or the real environment,"},{"start":225.66,"text":"we've collected some data."},{"start":227.08,"text":"So we have some trajectories."},{"start":230.2,"text":"Some of this data could also have been provided to us"},{"start":232.72,"text":"in an offline data set."},{"start":235.0,"text":"And so maybe the data that we have in the real environment"},{"start":240.99,"text":"looks something like this. Does anyone have thoughts on how we might use our, like ways in which we might want to use our learned model to augment this data set right here? Like how would we go, like procedurally, like what would we do to try to generate synthetic data?"},{"start":265.15,"text":"Yeah, so the thought there was that you could take the last state and then generate more from there. So you could add on to the last state here. That's one thing you could do. Other thoughts on things you could do? Yeah. So something like Dagger where you take the first part that's run by the policy and then the second part that's kind of from the model. So it's kind of similar to this maybe, but maybe you do it earlier. Is that what you're saying?"},{"start":292.3,"text":"Yeah, so you don't just have to start at the end. You could also start anywhere in the middle as well. So you could, for example, generate kind of trajectories from really any sort of state in your buffer, your data set. And then if you were to do something like that, then you would kind of be able to generate data that looks like this, where everything that is in red is"},{"start":321.47,"text":"kind of synthetic data or data that was imagined using your model. And then everything in black is the real data from the environment. Now, one thing that we talked about before is that our model is not very good to be like, you can't really trust it if you're to make a really long rollout. And so one thing that you can do is keep these trajectories very short."}],"speech_gaps":[],"frame":"../frames/v022/002.webp","frame_time":196.24},{"title":"多任务强化学习中的数据生成与模型更新","segments":[{"id":44,"text":"And so you could actually, instead of having these be almost as long as your original trajectories, you could actually change them to be just little short rollouts that look something like this, and that basically add a little bit more coverage around the trajectory in your data. And so that would look kind of something like this.","start":349.6,"end":375.02},{"id":45,"text":"And that's often kind of something like this picture is often more like what people find works really well in practice because of inaccuracies in your model.","start":376.58,"end":389.56},{"id":46,"text":"And so kind of specifically, say we have some example real trajectory, then maybe the first way that you could think about creating data,","start":391.16,"end":401.28},{"id":47,"text":"maybe it wasn't the first way that you guys thought about it,","start":402.24,"end":404.46},{"id":48,"text":"But one simple thing you could do is just start from initial states and generate full trajectories as if it were the real environment.","start":404.46,"end":410.0},{"id":49,"text":"But the downside there is that the model may not be accurate for long horizons.","start":410.84,"end":416.2},{"id":50,"text":"And so you won't be able to actually get very good state coverage if you only start at the initial state distribution and don't actually end because you only want to use fairly short rollouts.","start":416.54,"end":429.36},{"id":51,"text":"You can also generate partial trajectories from the initial states,","start":429.36,"end":432.84},{"id":52,"text":"but this won't give you good coverage of the later states.","start":433.0,"end":435.08},{"id":53,"text":"And so one thing that kind of gets the best of both worlds,","start":435.4,"end":440.64},{"id":54,"text":"it gives you good coverage and also allows you to use short trajectories","start":440.68,"end":445.02},{"id":55,"text":"to generate these kind of sort of partial trajectories","start":445.02,"end":447.48},{"id":56,"text":"from all of the states in your real data set.","start":447.48,"end":451.76},{"id":57,"text":"So then what the full algorithm looks like","start":454.84,"end":457.86},{"id":58,"text":"is you will first collect real data.","start":457.86,"end":463.52},{"id":59,"text":"We can call this DN, like before.","start":467.4,"end":470.62},{"id":60,"text":"And then we will want to update our model","start":471.2,"end":474.66},{"id":61,"text":"using the real data","start":477.46,"end":478.92},{"id":62,"text":"so that our model is as accurate as it can be.","start":478.92,"end":482.02},{"id":63,"text":"and then we can","start":485.48,"end":488.46},{"id":64,"text":"You can generate data, and the way this generation process will look like is first sample some S from your real data, and then generate a short trajectory starting from S, where you will roll out your policy or whatever exploration policy you have,","start":490.9,"end":527.15}],"notes":["本段主要讲解多任务强化学习中数据生成的策略，强调使用较短的轨迹来增加状态覆盖。讲者指出，传统的长轨迹可能不适用于模型不准确的情况，因此采用短轨迹可以更好地覆盖状态空间。"],"formulas":[],"uncertainties":[],"diagram":"none","start":349.6,"end":527.15,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":349.6,"text":"And so you could actually, instead of having these be almost as long as your original trajectories, you could actually change them to be just little short rollouts that look something like this, and that basically add a little bit more coverage around the trajectory in your data. And so that would look kind of something like this."},{"start":376.58,"text":"And that's often kind of something like this picture is often more like what people find works really well in practice because of inaccuracies in your model."},{"start":391.16,"text":"And so kind of specifically, say we have some example real trajectory, then maybe the first way that you could think about creating data,"},{"start":402.24,"text":"maybe it wasn't the first way that you guys thought about it,"},{"start":404.46,"text":"But one simple thing you could do is just start from initial states and generate full trajectories as if it were the real environment."},{"start":410.84,"text":"But the downside there is that the model may not be accurate for long horizons."},{"start":416.54,"text":"And so you won't be able to actually get very good state coverage if you only start at the initial state distribution and don't actually end because you only want to use fairly short rollouts."},{"start":429.36,"text":"You can also generate partial trajectories from the initial states,"},{"start":433.0,"text":"but this won't give you good coverage of the later states."},{"start":435.4,"text":"And so one thing that kind of gets the best of both worlds,"},{"start":440.68,"text":"it gives you good coverage and also allows you to use short trajectories"},{"start":445.02,"text":"to generate these kind of sort of partial trajectories"},{"start":447.48,"text":"from all of the states in your real data set."},{"start":454.84,"text":"So then what the full algorithm looks like"},{"start":457.86,"text":"is you will first collect real data."},{"start":467.4,"text":"We can call this DN, like before."},{"start":471.2,"text":"And then we will want to update our model"},{"start":477.46,"text":"using the real data"},{"start":478.92,"text":"so that our model is as accurate as it can be."},{"start":485.48,"text":"and then we can"},{"start":490.9,"text":"You can generate data, and the way this generation process will look like is first sample some S from your real data, and then generate a short trajectory starting from S, where you will roll out your policy or whatever exploration policy you have,"}],"speech_gaps":[],"frame":"../frames/v022/003.webp","frame_time":361.6},{"title":"多任务强化学习中的数据生成与策略更新","segments":[{"id":65,"text":"starting from S, but then we'll be doing this rollout inside your learned model. And so this will be inside the world that is instantiated from your learned model and not in the real environment. This data will go into some other data set. Maybe we can...","start":528.17,"end":562.99},{"id":66,"text":"call it dgen for degenerated data.","start":563.47,"end":566.95},{"id":67,"text":"And then at the end, you can simply","start":568.69,"end":570.93},{"id":68,"text":"update your policy using both the real data","s
