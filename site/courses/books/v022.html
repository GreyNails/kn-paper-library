one something good as well. Yeah, and then there's a question of when can we apply relabeling. And in particular, there's actually restrictions on both","start":3904.3,"end":3933.13}],"notes":["本段讨论了在多任务强化学习中如何决定是否对数据进行重贴标签的问题。讲者指出，这是一个启发式过程，因为很难一般性地判断数据是否对学习某个任务有用。一个启发式方法是，如果任务j的奖励rj较高，那么可能对学习该任务有帮助，因为可能在其他任务中已经做了有益的事情。另一个启发式方法是随机采样并均匀地用于所有任务。","讲者提到，重贴标签算法并不假设离散状态，因此适用于连续状态。重贴标签的过程是将原本为任务I收集的数据重新贴上任务J的奖励标签，并存储到回放缓冲区中。这可以使用单一的回放缓冲区，也可以为每个任务使用不同的回放缓冲区。","在选择任务时，可以随机选择或选择奖励较高的任务。此外，讲者指出，可以对轨迹进行重贴标签，而不仅仅是单个转移，因为轨迹中某个位置的高奖励可能意味着其他部分也有价值。","最后，讲者提到重贴标签的应用存在时间上的限制，即在某些情况下不能随意应用重贴标签。这表明重贴标签策略需要考虑任务选择和时间限制的结合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3768.58,"end":3933.13,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3768.58,"text":"policy pi theta and collect some more data. The question is, how do we decide if it's worth relabeling? In particular, we're doing this for task j. Which task j should we pick? Should we do it for all j's? Should we only do it for some j's? Should we only do this some of the time? This ends up being somewhat of a heuristic process because it's a little bit hard to tell generally if"},{"start":3796.3,"text":"data will be useful for learning one task or not, because learning is somewhat of an amorphous process, I guess. The one heuristic is that if rj was high, then it might be good for learning that task, because you actually might have accidentally done something good for a different task. So that's one heuristic. Another heuristic sometimes is just to also sample randomly and use it for all tasks at random and uniformly."},{"start":3824.97,"text":"How does this work for continuous state? There's nothing here that assumes discrete states. How do you reach? So this is actually, what I've written here is like a relabeling algorithm for any sort of multitask system. There's also, we'll talk about what this looks like for goal condition settings in a minute, if that's what you're wondering about. Yeah, so this is a great point."},{"start":3850.3,"text":"There's only a few scenarios. You can't do this universally. And so this is something that's called hindsight relabeling because you kind of look at what you did. If you did something good, then in hindsight, you can kind of then relabel that to be a different task. So in terms of this algorithm on the slides, we collect some data using some policy. We store that data in a replay buffer. We are going to perform hindsight relabeling."},{"start":3877.14,"text":"And what this looks like is this. We originally collected it for task I. We're going to relabel it with the reward for task J. And then we'll store that relabeled data in our replay buffer. The slides have this for like a single combined replay buffer. You could also do this with different replay buffers for each task. Then you'll update your policy with the replay buffer and repeat this process."},{"start":3904.3,"text":"In terms of which tasks to choose, you can choose this randomly, tasks that get high rewards. The note here is also you can actually do it for trajectories that get high rewards, not just transitions that get high rewards, because if there's a high reward somewhere in the trajectory, then other parts of the trajectory might have done something good as well. Yeah, and then there's a question of when can we apply relabeling. And in particular, there's actually restrictions on both"}],"speech_gaps":[],"frame":"../frames/v022/023.webp","frame_time":3780.58},{"title":"多任务强化学习中的共享与差异","segments":[{"id":374,"text":"the set of MVPs, or the MVPs of the different tasks, and also on the algorithm that you're using for reinforcement learning. So does anyone have thoughts on what has to be shared or not shared for this algorithm to make sense? Yeah, so a shared state action space. So you're going to want a shared...","start":3933.75,"end":3962.53},{"id":375,"text":"state and action space. Anything else do you want that's shared and not shared?","start":3964.81,"end":3973.29},{"id":376,"text":"Yeah, so if you only have one replay buffer, then you want the dimensions of your state and actions","start":3974.19,"end":3977.87},{"id":377,"text":"to match, and generally for the state space and action space to be the same. Yeah, so you probably","start":3977.87,"end":3985.33},{"id":378,"text":"want the initial state distribution to be similar. So you want like P of s1 for","start":3985.33,"end":3992.91},{"id":379,"text":"to be like similar for different tasks because if it's like","start":3992.91,"end":4003.99},{"id":380,"text":"drastically different then they're probably like sharing data won't be as","start":4003.99,"end":4007.79},{"id":381,"text":"useful. So if one of them has dense rewards and one of those has sparse","start":4007.79,"end":4012.59},{"id":382,"text":"rewards, that might be a problem. That is true, although that might be a problem generally in","start":4012.59,"end":4021.93},{"id":383,"text":"multitask RL. But actually, in this case, I don't think it's going to be especially an issue in","start":4021.93,"end":4028.81},{"id":384,"text":"this case, because you are going to be using the reward function for the task. But yeah,","start":4028.81,"end":4032.51},{"id":385,"text":"generally for multitask RL, that makes things challenging. Yeah, so it's helpful for the","start":4032.53,"end":4036.95},{"id":386,"text":"the rewards to be the same scale, what about the dynamics?","start":4036.95,"end":4039.43},{"id":387,"text":"Should they be the same or different across tasks?","start":4042.11,"end":4044.31},{"id":388,"text":"Same. Yeah. So you want the dynamics to be the same,","start":4045.15,"end":4048.73},{"id":389,"text":"and it's actually really important because you're not relabeling the dynamics here,","start":4048.77,"end":4052.59},{"id":390,"text":"and because you're not relabeling the dynamics,","start":4053.21,"end":4054.95},{"id":391,"text":"if they're different across tasks,","start" olicy."},{"start":4169.84,"text":"Because you're actually kind of creating synthetic data that is as if you were using ZJ. So yeah, sorry, I misspoke. And so you don't need to store which policy it came from. Okay, so you need the reward function. Oh, the other thing is you need the reward function form here. You need to actually compute the rewards for the new task. That's also important as well. Or you need to have learned the reward function. You need the reward function. The dynamics has to be consistent, and you have to be using an off-policy algorithm."},{"start":4197.69,"text":"And then lastly is the goal condition version. This is basically the same as before, but our reward function is now this negative distance between states. And for continuous states, this could be like mean squared error, could be a distance in embedding space, or it could be a 0-1 loss within some epsilon ball of the goal state."}],"speech_gaps":[],"frame":"../frames/v022/025.webp","frame_time":4121.75}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
