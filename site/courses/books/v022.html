<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 12 多任务强化学习（Multi-Task RL）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 12 多任务强化学习（Multi-Task RL） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v022","title":"Lecture 12 多任务强化学习（Multi-Task RL）","course":"强化学习","pages":[{"title":"模型基础强化学习与多任务强化学习","segments":[{"id":0,"text":"Now let's get started. Today we will be finishing up model-based reinforcement learning, specifically a way to use a learned model with synthetic data generation, and when to use model-based reinforcement learning. And then we're going to be talking about multitask imitation learning and reinforcement learning, including ways to conditions on tasks, different tasks as goal-reaching tasks, and an approach called hindsight relabeling, which you'll be implementing","zh":"现在我们开始吧。今天我们将完成模型基础强化学习的内容，具体讨论如何使用学习到的模型与合成数据生成，以及何时使用模型基础强化学习。然后我们将讨论多任务模仿学习和强化学习，包括如何根据任务进行条件建模，不同任务作为目标达成任务，以及一种称为 hindsight relabeling 的方法，你将进行实现","start":5.2,"end":34.12},{"id":1,"text":"Cool. So let's get back to model-based reinforcement learning. So last time we talked about a scenario where we learn some model. That model could be a deterministic model. It could also be modeling a distribution over next states.","zh":"很好。那么我们回到模型基础强化学习。上次我们讨论了一个场景，即学习某个模型。这个模型可以是确定性的模型，也可以是建模下一状态分布的模型。","start":35.14,"end":54.16},{"id":2,"text":"And in particular, you could think about it as trying to approximate the distribution over the next state,","zh":"特别是，你可以将其视为尝试近似下一状态的分布，","start":55.48,"end":65.2},{"id":3,"text":"given the current state of action.","zh":"给定当前状态和动作。","start":65.3,"end":66.8},{"id":4,"text":"And you can use this model to actually kind of predict what will happen in the future.","zh":"你可以使用这个模型来实际预测未来会发生什么。","start":67.34,"end":73.34},{"id":5,"text":"And for example, if you have an action that you think you might take or multiple actions you think you might take,","zh":"例如，如果你有一个你认为可能会采取的动作或多个你认为可能会采取的动作，","start":73.46,"end":79.98},{"id":6,"text":"you can use this estimated distribution to generate or imagine what might happen","zh":"你可以使用这个估计的分布来生成或想象如果你采取这些动作未来可能发生的情况。我们讨论了一种方法到","start":79.98,"end":87.62},{"id":7,"text":"in the future if you were to take those actions. We talked about an approach to","zh":"如果将来你采取那些行动的话。我们讨论了一种方法","start":87.62,"end":95.54},{"id":8,"text":"behavior that's quite different from learning a policy where we're not","zh":"一种与学习策略截然不同的行为，我们并不是","start":95.54,"end":98.88},{"id":9,"text":"actually explicitly learning a mapping from states to actions and","zh":"显式地学习从状态到动作的映射，而是在需要的时候","start":98.88,"end":102.98},{"id":10,"text":"instead on the fly we are thinking through for a given state what actions","zh":"我们针对给定的状态思考应该采取哪些动作。我们将这种行为称为规划。","start":102.98,"end":108.46},{"id":11,"text":"we should take. We called this planning. And we talked about how this sort of planning can be done","zh":"我们讨论过这种规划可以通过基于梯度或采样的优化方法在未来的预测范围内进行。","start":108.46,"end":113.96},{"id":12,"text":"with gradient-based or sampling-based optimization over your next future horizon. And we also talked","zh":"我们也讨论过，使用收集到的数据来更新模型非常重要，因为这样你就能","start":113.96,"end":121.62},{"id":13,"text":"about how it's important to update the model using the data collected, because then you'll","zh":"在你希望使用该模型的领域中真正学习到一个更好的模型。","start":121.62,"end":127.0},{"id":14,"text":"be able to actually learn a better model in the realms that you want to use that model.","zh":"然后定期地，我们也讨论过你可以重新规划以帮助弥补错误，","start":127.0,"end":130.9},{"id":15,"text":"And then periodically, we also talked about how you can replan to help account for mistakes,","zh":"从而更好地适应环境变化。","start":132.84,"end":137.42},{"id":16,"text":"account for errors in the model, and also react to changes in the environment.","zh":"考虑模型中的误差，并且能够对环境的变化做出反应。","start":137.42,"end":143.32},{"id":17,"text":"Cool. The pros of this sort of planning approach is that it's simple, it's easy to plug in different goals or rewards if you have a general enough model, possibly even at test time.","zh":"很好。这种规划方法的优点在于它很简单，如果你有一个足够通用的模型，就可以很容易地插入不同的目标或奖励，甚至可能在测试时进行调整。","start":145.56,"end":155.3},{"id":18,"text":"And the downside is that it's compute intensive at test time. It requires a lot of test time computed inference time.","zh":"缺点是它在测试时计算量很大。它需要大量的测试时间进行计算推理。","start":155.74,"end":161.3},{"id":19,"text":"and this particular instantiation was only practical for short horizon problems where","zh":"而这种特定的实现方式只适用于短时间跨度的问题，其中","start":161.3,"end":168.22},{"id":20,"text":"or for very shaped words where you can plan over some shorter horizon rather than considering like","zh":"或者对于某些结构化的任务，你可以在较短的时间跨度上进行规划，而不是考虑","start":168.22,"end":176.06},{"id":21,"text":"an extremely long horizon and the reason why short horizons there's kind of two reasons why","zh":"一个极其长的时间跨度，而短时间跨度的原因大致有两个。","start":176.06,"end":184.24}],"notes":["本段继续讨论模型基础强化学习的规划方法，强调其在短时间范围内的实用性。讲者提到，这种规划方法在测试时计算量较大，因此只适用于短时间范围的问题，或者在某些特定结构的问题中，可以规划较短的时间范围。讲者还提到，短时间范围的原因有两个，但具体原因未明确说明。","讲者指出，模型基础强化学习的规划方法具有简单易用的优点，特别是在模型足够通用的情况下，可以轻松地插入不同的目标或奖励函数，甚至在测试时也能进行调整。然而，这种方法的缺点是测试时计算量大，需要大量的推理时间。","讲者提到，模型基础强化学习的规划方法需要定期重新规划，以应对模型中的错误和环境的变化。这表明，规划方法需要动态调整，以适应新的信息和变化的环境。","讲者强调，模型基础强化学习的规划方法适用于短时间范围的问题，因为长时间范围的规划会带来较大的计算负担。因此，在实际应用中，需要根据问题的特性选择合适的规划时间范围。","讲者提到，模型基础强化学习的规划方法需要使用收集到的数据来更新模型，以提高模型的准确性。这表明，模型的更新是规划方法成功的关键因素之一。","讲者还提到，模型基础强化学习的规划方法可以用于不同的任务，包括目标导向的任务，并且可以使用一种称为‘回顾重贴标签’（hindsight relabeling）的方法来改进学习效果。"],"formulas":[],"uncertainties":["short horizons there's kind of two reasons why"],"diagram":"none","start":5.2,"end":184.24,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":5.2,"text":"Now let's get started. Today we will be finishing up model-based reinforcement learning, specifically a way to use a learned model with synthetic data generation, and when to use model-based reinforcement learning. And then we're going to be talking about multitask imitation learning and reinforcement learning, including ways to conditions on tasks, different tasks as goal-reaching tasks, and an approach called hindsight relabeling, which you'll be implementing"},{"start":35.14,"text":"Cool. So let's get back to model-based reinforcement learning. So last time we talked about a scenario where we learn some model. That model could be a deterministic model. It could also be modeling a distribution over next states."},{"start":55.48,"text":"And in particular, you could think about it as trying to approximate the distribution over the next state,"},{"start":65.3,"text":"given the current state of action."},{"start":67.34,"text":"And you can use this model to actually kind of predict what will happen in the future."},{"start":73.46,"text":"And for example, if you have an action that you think you might take or multiple actions you think you might take,"},{"start":79.98,"text":"you can use this estimated distribution to generate or imagine what might happen"},{"start":87.62,"text":"in the future if you were to take those actions. We talked about an approach to"},{"start":95.54,"text":"behavior that's quite different from learning a policy where we're not"},{"start":98.88,"text":"actually explicitly learning a mapping from states to actions and"},{"start":102.98,"text":"instead on the fly we are thinking through for a given state what actions"},{"start":108.46,"text":"we should take. We called this planning. And we talked about how this sort of planning can be done"},{"start":113.96,"text":"with gradient-based or sampling-based optimization over your next future horizon. And we also talked"},{"start":121.62,"text":"about how it's important to update the model using the data collected, because then you'll"},{"start":127.0,"text":"be able to actually learn a better model in the realms that you want to use that model."},{"start":132.84,"text":"And then periodically, we also talked about how you can replan to help account for mistakes,"},{"start":137.42,"text":"account for errors in the model, and also react to changes in the environment."},{"start":145.56,"text":"Cool. The pros of this sort of planning approach is that it's simple, it's easy to plug in different goals or rewards if you have a general enough model, possibly even at test time."},{"start":155.74,"text":"And the downside is that it's compute intensive at test time. It requires a lot of test time computed inference time."},{"start":161.3,"text":"and this particular instantiation was only practical for short horizon problems where"},{"start":168.22,"text":"or for very shaped words where you can plan over some shorter horizon rather than considering like"},{"start":176.06,"text":"an extremely long horizon and the reason why short horizons there's kind of two reasons why"}],"speech_gaps":[],"frame":"../frames/v022/001.webp","frame_time":17.2},{"title":"多任务强化学习中的模型使用与数据增强","segments":[{"id":22,"text":"This is only applicable to short horizons. One is that as you increase the horizon it","zh":"这仅适用于短时间范围。第一个原因是，随着时间范围的增加，","start":184.24,"end":188.72},{"id":23,"text":"it becomes even more compute intensive.","zh":"它会变得更加计算密集。","start":188.72,"end":190.56},{"id":24,"text":"And the second reason is that the model is not very accurate","zh":"第二个原因是，当你尝试多次应用该模型时，","start":190.9,"end":193.3},{"id":25,"text":"when you try to apply it multiple times","zh":"模型的准确性并不高。","start":193.96,"end":196.68},{"id":26,"text":"to generate a long trajectory.","zh":"当你试图生成一条长轨迹时，","start":196.68,"end":198.58},{"id":27,"text":"Cool.","zh":"很酷。","start":200.78,"end":201.3},{"id":28,"text":"Now, there's a second way that you can use these kinds of learn","zh":"现在，你还可以用这些类型的模型的另一种方式，","start":201.84,"end":204.36},{"id":29,"text":"models, and that is to learn a policy.","zh":"那就是学习一个策略。","start":204.36,"end":207.08},{"id":30,"text":"And so that's what we'll talk about right now.","zh":"因此，我们现在将讨论这个话题。","start":208.04,"end":210.98},{"id":31,"text":"And the key idea is that we could actually","zh":"关键的想法是，我们实际上","start":211.58,"end":213.38},{"id":32,"text":"use this model of the future, this kind of learn simulator,","zh":"可以利用这个对未来进行建模的模型，这种学习模拟器，","start":213.9,"end":217.54},{"id":33,"text":"later to augment any sort of data that we've collected.","zh":"之后来增强我们所收集的任何类型的数据。","start":217.54,"end":221.2},{"id":34,"text":"So say that in the real world or the real environment,","zh":"比如说，在现实世界或现实环境中，","start":222.38,"end":225.52},{"id":35,"text":"we've collected some data.","zh":"我们已经收集了一些数据。","start":225.66,"end":226.76},{"id":36,"text":"So we have some trajectories.","zh":"因此，我们有一些轨迹。","start":227.08,"end":230.18},{"id":37,"text":"Some of this data could also have been provided to us","zh":"我们所收集的一些数据也可能被提供给我们","start":230.2,"end":232.72},{"id":38,"text":"And so maybe the data that we have in the real environment","zh":"因此，我们可能在真实环境中拥有的数据","start":232.72,"end":233.74},{"id":39,"text":"And so maybe the data that we have in the real environment","zh":"因此，我们可能在真实环境中拥有的数据","start":235.0,"end":240.1},{"id":40,"text":"looks something like this. Does anyone have thoughts on how we might use our, like ways in which we might want to use our learned model to augment this data set right here? Like how would we go, like procedurally, like what would we do to try to generate synthetic data?","zh":"看起来大概是这样的。有没有人有想法，关于我们如何利用我们学到的模型来增强这个数据集？比如，我们如何以程序化的方式，尝试生成合成数据？","start":240.99,"end":264.22},{"id":41,"text":"Yeah, so the thought there was that you could take the last state and then generate more from there. So you could add on to the last state here. That's one thing you could do. Other thoughts on things you could do? Yeah. So something like Dagger where you take the first part that's run by the policy and then the second part that's kind of from the model. So it's kind of similar to this maybe, but maybe you do it earlier. Is that what you're saying?","zh":"是的，那个想法是说你可以取最后一个状态，然后从那里生成更多数据。因此，你可以在这里添加到最后一个状态。这是你可以做的事情之一。还有其他想法吗？是的。比如像Dagger那样，你先运行一部分由策略生成的部分，然后第二部分则来自模型。这可能有点类似，但也许你更早地进行这样的操作。这是你在说的吗？","start":265.15,"end":291.48},{"id":42,"text":"Yeah, so you don't just have to start at the end. You could also start anywhere in the middle as well. So you could, for example, generate kind of trajectories from really any sort of state in your buffer, your data set. And then if you were to do something like that, then you would kind of be able to generate data that looks like this, where everything that is in red is","zh":"是的，你不需要只从最后开始。你也可以在中间的任何地方开始。例如，你可以从缓冲区或数据集中任何一种状态生成轨迹。如果你这样做，你将能够生成看起来像这样的数据，其中红色部分","start":292.3,"end":321.07},{"id":43,"text":"kind of synthetic data or data that was imagined using your model. And then everything in black is the real data from the environment. Now, one thing that we talked about before is that our model is not very good to be like, you can't really trust it if you're to make a really long rollout. And so one thing that you can do is keep these trajectories very short.","zh":"是合成数据或使用你的模型想象出来的数据。而黑色部分则是真实环境中获得的数据。我们之前讨论过的一点是，我们的模型并不太适合进行很长的 rollout。因此，你可以采取的做法是保持这些轨迹非常短。","start":321.47,"end":349.18}],"notes":["本段讨论了多任务强化学习中模型应用的局限性，特别是当时间跨度增加时，计算成本会显著上升。这表明模型在长轨迹生成时可能不够准确，因此需要限制轨迹长度。","接下来，讲者介绍了另一种使用学习模型的方法，即学习策略。这表明模型不仅可以用于模拟环境，还可以用于策略优化。","讲者提到可以利用学习到的模型来增强已有的数据集，通过生成合成数据来扩展数据集。这包括从任意状态生成轨迹，从而增加数据的多样性。","讲者还提到，由于模型在长轨迹生成时不可靠，因此建议保持轨迹较短。这表明在实际应用中需要权衡模型的准确性与计算成本。","讲者通过提问引导学生思考如何利用模型生成合成数据，并举例说明了Dagger方法，即结合策略和模型生成数据。这表明模型可以与策略协同工作，以提高数据质量。","最后，讲者强调了模型在生成数据时的局限性，并指出需要在数据增强过程中保持对模型可靠性的关注。这表明在实际应用中需要谨慎使用模型生成的数据。"],"formulas":[],"uncertainties":[],"diagram":"none","start":184.24,"end":349.18,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":184.24,"text":"this is only applicable to short horizons one is that as you increase the horizon it"},{"start":188.72,"text":"it becomes even more compute intensive."},{"start":190.9,"text":"And the second reason is that the model is not very accurate"},{"start":193.96,"text":"when you try to apply it multiple times"},{"start":196.68,"text":"to generate a long trajectory."},{"start":200.78,"text":"Cool."},{"start":201.84,"text":"Now, there's a second way that you can use these kinds of learn"},{"start":204.36,"text":"models, and that is to learn a policy."},{"start":208.04,"text":"And so that's what we'll talk about right now."},{"start":211.58,"text":"And the key idea is that we could actually"},{"start":213.9,"text":"use this model of the future, this kind of learn simulator,"},{"start":217.54,"text":"later to augment any sort of data that we've collected."},{"start":222.38,"text":"So say that in the real world or the real environment,"},{"start":225.66,"text":"we've collected some data."},{"start":227.08,"text":"So we have some trajectories."},{"start":230.2,"text":"Some of this data could also have been provided to us"},{"start":232.72,"text":"in an offline data set."},{"start":235.0,"text":"And so maybe the data that we have in the real environment"},{"start":240.99,"text":"looks something like this. Does anyone have thoughts on how we might use our, like ways in which we might want to use our learned model to augment this data set right here? Like how would we go, like procedurally, like what would we do to try to generate synthetic data?"},{"start":265.15,"text":"Yeah, so the thought there was that you could take the last state and then generate more from there. So you could add on to the last state here. That's one thing you could do. Other thoughts on things you could do? Yeah. So something like Dagger where you take the first part that's run by the policy and then the second part that's kind of from the model. So it's kind of similar to this maybe, but maybe you do it earlier. Is that what you're saying?"},{"start":292.3,"text":"Yeah, so you don't just have to start at the end. You could also start anywhere in the middle as well. So you could, for example, generate kind of trajectories from really any sort of state in your buffer, your data set. And then if you were to do something like that, then you would kind of be able to generate data that looks like this, where everything that is in red is"},{"start":321.47,"text":"kind of synthetic data or data that was imagined using your model. And then everything in black is the real data from the environment. Now, one thing that we talked about before is that our model is not very good to be like, you can't really trust it if you're to make a really long rollout. And so one thing that you can do is keep these trajectories very short."}],"speech_gaps":[],"frame":"../frames/v022/002.webp","frame_time":196.24},{"title":"多任务强化学习中的数据生成与模型更新","segments":[{"id":44,"text":"And so you could actually, instead of having these be almost as long as your original trajectories, you could actually change them to be just little short rollouts that look something like this, and that basically add a little bit more coverage around the trajectory in your data. And so that would look kind of something like this.","zh":"因此，你实际上可以将这些轨迹改为更短的 rollout，看起来像这样，它们基本上在你的数据轨迹周围增加了一点更多的覆盖范围。因此，它看起来大致像这样。","start":349.6,"end":375.02},{"id":45,"text":"And that's often kind of something like this picture is often more like what people find works really well in practice because of inaccuracies in your model.","zh":"这种做法通常更像这样一幅图，人们在实践中发现这种方法效果很好，因为你的模型可能存在不准确性。","start":376.58,"end":389.56},{"id":46,"text":"And so kind of specifically, say we have some example real trajectory, then maybe the first way that you could think about creating data,","zh":"因此，具体来说，假设我们有一些示例的真实轨迹，那么你可能考虑创建数据的第一种方法是，","start":391.16,"end":401.28},{"id":47,"text":"maybe it wasn't the first way that you guys thought about it,","zh":"也许这并不是你们最初想到的方法，","start":402.24,"end":404.46},{"id":48,"text":"But one simple thing you could do is just start from initial states and generate full trajectories as if it were the real environment.","zh":"但你可以做的一件简单的事情是从初始状态开始，生成完整的轨迹，就像它确实是真实环境一样。","start":404.46,"end":410.0},{"id":49,"text":"But the downside there is that the model may not be accurate for long horizons.","zh":"但缺点是，模型可能在长时间范围内不够准确。","start":410.84,"end":416.2},{"id":50,"text":"And so you won't be able to actually get very good state coverage if you only start at the initial state distribution and don't actually end because you only want to use fairly short rollouts.","zh":"因此，如果你只从初始状态分布开始，并且不真正结束，因为你只想要使用相对较短的 rollout，你就无法获得很好的状态覆盖。","start":416.54,"end":429.36},{"id":51,"text":"You can also generate partial trajectories from the initial states,","zh":"你也可以从初始状态生成部分轨迹，","start":429.36,"end":432.84},{"id":52,"text":"but this won't give you good coverage of the later states.","zh":"但这种方法不会为你提供后来状态的良好覆盖。","start":433.0,"end":435.08},{"id":53,"text":"And so one thing that kind of gets the best of both worlds,","zh":"因此，有一种方法可以兼顾两者的优点，","start":435.4,"end":440.64},{"id":54,"text":"it gives you good coverage and also allows you to use short trajectories","zh":"它能提供良好的覆盖，同时允许你使用短轨迹","start":440.68,"end":445.02},{"id":55,"text":"to generate these kind of sort of partial trajectories","zh":"来生成这些部分轨迹","start":445.02,"end":447.48},{"id":56,"text":"from all of the states in your real data set.","zh":"涵盖你真实数据集中的所有状态。","start":447.48,"end":451.76},{"id":57,"text":"So then what the full algorithm looks like","zh":"那么完整的算法看起来是怎样的","start":454.84,"end":457.86},{"id":58,"text":"is you will first collect real data.","zh":"是你首先收集真实数据。","start":457.86,"end":463.52},{"id":59,"text":"We can call this DN, like before.","zh":"我们可以称之为 DN，就像之前一样。","start":467.4,"end":470.62},{"id":60,"text":"And then we will want to update our model","zh":"然后我们将想要更新我们的模型","start":471.2,"end":474.66},{"id":61,"text":"using the real data","zh":"使用真实数据","start":477.46,"end":478.92},{"id":62,"text":"so that our model is as accurate as it can be.","zh":"以便我们的模型尽可能准确。","start":478.92,"end":482.02},{"id":63,"text":"and then we can","zh":"然后我们可以","start":485.48,"end":488.46},{"id":64,"text":"You can generate data, and the way this generation process will look like is first sample some S from your real data, and then generate a short trajectory starting from S, where you will roll out your policy or whatever exploration policy you have,","zh":"你可以生成数据，而这种生成过程的外观将是首先从你的真实数据中采样一些状态S，然后从S开始生成一条简短的轨迹，在这条轨迹中你会展开你的策略或者你所拥有的任何探索策略，","start":490.9,"end":527.15}],"notes":["本段主要讲解多任务强化学习中数据生成的策略，强调使用较短的轨迹来增加状态覆盖。讲者指出，传统的长轨迹可能不适用于模型不准确的情况，因此采用短轨迹可以更好地覆盖状态空间。"],"formulas":[],"uncertainties":[],"diagram":"none","start":349.6,"end":527.15,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":349.6,"text":"And so you could actually, instead of having these be almost as long as your original trajectories, you could actually change them to be just little short rollouts that look something like this, and that basically add a little bit more coverage around the trajectory in your data. And so that would look kind of something like this."},{"start":376.58,"text":"And that's often kind of something like this picture is often more like what people find works really well in practice because of inaccuracies in your model."},{"start":391.16,"text":"And so kind of specifically, say we have some example real trajectory, then maybe the first way that you could think about creating data,"},{"start":402.24,"text":"maybe it wasn't the first way that you guys thought about it,"},{"start":404.46,"text":"But one simple thing you could do is just start from initial states and generate full trajectories as if it were the real environment."},{"start":410.84,"text":"But the downside there is that the model may not be accurate for long horizons."},{"start":416.54,"text":"And so you won't be able to actually get very good state coverage if you only start at the initial state distribution and don't actually end because you only want to use fairly short rollouts."},{"start":429.36,"text":"You can also generate partial trajectories from the initial states,"},{"start":433.0,"text":"but this won't give you good coverage of the later states."},{"start":435.4,"text":"And so one thing that kind of gets the best of both worlds,"},{"start":440.68,"text":"it gives you good coverage and also allows you to use short trajectories"},{"start":445.02,"text":"to generate these kind of sort of partial trajectories"},{"start":447.48,"text":"from all of the states in your real data set."},{"start":454.84,"text":"So then what the full algorithm looks like"},{"start":457.86,"text":"is you will first collect real data."},{"start":467.4,"text":"We can call this DN, like before."},{"start":471.2,"text":"And then we will want to update our model"},{"start":477.46,"text":"using the real data"},{"start":478.92,"text":"so that our model is as accurate as it can be."},{"start":485.48,"text":"and then we can"},{"start":490.9,"text":"You can generate data, and the way this generation process will look like is first sample some S from your real data, and then generate a short trajectory starting from S, where you will roll out your policy or whatever exploration policy you have,"}],"speech_gaps":[],"frame":"../frames/v022/003.webp","frame_time":361.6},{"title":"多任务强化学习中的数据生成与策略更新","segments":[{"id":65,"text":"starting from S, but then we'll be doing this rollout inside your learned model. And so this will be inside the world that is instantiated from your learned model and not in the real environment. This data will go into some other data set. Maybe we can...","zh":"从状态S开始，但之后我们将在你学习到的模型内部进行rollout。因此，这将发生在由你学习到的模型实例化出的世界中，而不是真实环境中。这些数据将进入另一个数据集。也许我们可以...","start":528.17,"end":562.99},{"id":66,"text":"call it dgen for degenerated data.","zh":"称之为dgen，即退化数据。","start":563.47,"end":566.95},{"id":67,"text":"And then at the end, you can simply","zh":"然后在最后，你可以简单地","start":568.69,"end":570.93},{"id":68,"text":"update your policy using both the real data","zh":"使用真实数据来更新你的策略","start":572.69,"end":575.65},{"id":69,"text":"and the generated data.","zh":"以及生成的数据。","start":576.35,"end":577.81},{"id":70,"text":"So update pi theta using dn and degenerated.","zh":"因此，使用dn和退化数据来更新pi theta。","start":578.35,"end":591.11},{"id":71,"text":"and then repeat this process.","zh":"然后重复这个过程。","start":593.47,"end":594.63},{"id":72,"text":"Whoops, I misspelled real.","zh":"哎呀，我拼错了real。","start":595.91,"end":597.85},{"id":73,"text":"So the question is, if you're only generating short trajectories,","zh":"那么问题是，如果你只生成短轨迹，","start":602.73,"end":605.65},{"id":74,"text":"does that take longer to converge to some goal?","zh":"是否需要更长的时间才能收敛到某个目标？","start":605.83,"end":610.21},{"id":75,"text":"So you can think of it as kind of supplementing the data","zh":"你可以将其视为一种补充你目前拥有的数据","start":611.93,"end":620.73},{"id":76,"text":"that you have so far.","zh":"的方式。","start":620.73,"end":621.71},{"id":77,"text":"and the things that are like the things in your when you start from states that","zh":"当你从接近目标的状态生成数据时，","start":621.71,"end":626.45},{"id":78,"text":"are closer to the goal from when you generate data there then you'll be close","zh":"你将更接近目标，","start":626.45,"end":634.03},{"id":79,"text":"and you'll be able to update the when you're further this","zh":"并且当你更远离目标时，","start":634.03,"end":638.87},{"id":80,"text":"doesn't mean that you this data won't necessarily reach the goal but you with","zh":"这并不意味着你使用这些数据就一定无法达到目标，但你","start":638.87,"end":642.75},{"id":81,"text":"reinforcement learning algorithms you'll be able to understand like some of this","zh":"你将能够理解像这样的强化学习算法","start":643.29,"end":648.67},{"id":82,"text":"this data might feed into states that are in the data.","zh":"这些数据可能会输入到数据中的状态中。","start":648.67,"end":652.05},{"id":83,"text":"When you use reinforcement learning,","zh":"当你使用强化学习时，","start":652.97,"end":654.91},{"id":84,"text":"you can then learn that, as an example,","zh":"你就可以学习到，例如，","start":655.01,"end":657.71},{"id":85,"text":"maybe you have a real trajectory that takes","zh":"你可能有一个真实的轨迹，它会采取","start":657.79,"end":659.87},{"id":86,"text":"a path that is maybe not the most direct path,","zh":"一条可能不是最直接的路径，","start":660.69,"end":662.99},{"id":87,"text":"and then you start learning a policy that knows,","zh":"然后你开始学习一个策略，该策略知道，","start":663.23,"end":666.45},{"id":88,"text":"maybe I should shortcut this,","zh":"也许我应该走捷径。","start":666.55,"end":668.17},{"id":89,"text":"then your model, when you explore that in your synthetic data,","zh":"那么当你在合成数据中进行探索时，你的模型","start":668.29,"end":671.19},{"id":90,"text":"a better policy by using this kind of data.","zh":"可以通过使用这种数据来获得更好的策略。","start":672.35,"end":674.11},{"id":91,"text":"a better policy by using this kind of data.","zh":"可以通过使用这种数据来获得更好的策略。","start":674.11,"end":676.63},{"id":92,"text":"In terms of convergence speed or kind of speed in which you'll get a good policy,","zh":"就收敛速度或者你获得良好策略的速度而言，","start":677.57,"end":682.43},{"id":93,"text":"the generally this will allow you to, it might require, generally the thing that we're often","zh":"通常这将允许你，通常我们试图最小化的是在这里所需的现实数据量。而这种方法将","start":683.03,"end":691.55},{"id":94,"text":"trying to minimize is the amount of real data that we need right here. And this will allow","zh":"使你能够通过使用这些红色轨迹以更少的现实数据获得良好的策略。是的，因此","start":691.55,"end":696.95},{"id":95,"text":"you to get a good policy with less real data by using these red trajectories. Yeah, so the","zh":"问题是，在这种情况下我们如何获得奖励？","start":696.95,"end":703.73},{"id":96,"text":"The question is, how do we get rewards in this case?","zh":"问题是，在这种情况下我们如何获得奖励？","start":703.73,"end":705.29}],"notes":["本段讨论了在多任务强化学习中，如何通过生成数据来补充真实数据，并利用这些数据来更新策略。讲者提到，生成的数据可以用于训练策略，从而减少对真实数据的依赖。生成的数据可能来自模型内部的模拟环境，而不是真实环境。","讲者指出，生成的数据可能无法保证一定达到目标，但通过强化学习算法，可以理解这些数据并从中学习。生成的数据可能包含一些状态，这些状态在真实数据中可能没有出现，从而帮助策略学习。","讲者举了一个例子，说明生成的数据可能帮助学习更优的策略。例如，真实轨迹可能不是最直接的路径，而生成的数据可能包含更优的路径，从而帮助策略学习。","讲者提到，生成数据的一个优势是减少对真实数据的需求，从而加快策略收敛的速度。这可能意味着在训练过程中，可以使用较少的真实数据来获得较好的策略。","讲者最后提出了一个问题，即如何在生成数据的情况下获得奖励。这可能涉及到如何将生成的数据与奖励机制结合起来，以确保策略学习的有效性。","整个段落强调了生成数据在多任务强化学习中的作用，以及如何通过生成数据来补充真实数据，从而提高策略学习的效率。"],"formulas":[],"uncertainties":["the when you're further this","you this data won't necessarily reach the goal but you with","reinforcement learning algorithms you'll be able to understand like some of this","this data might feed into states that are in the data.","these red trajectories"],"diagram":"none","start":528.17,"end":705.29,"asr_flags":[75],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":528.17,"text":"starting from S, but then we'll be doing this rollout inside your learned model. And so this will be inside the world that is instantiated from your learned model and not in the real environment. This data will go into some other data set. Maybe we can..."},{"start":563.47,"text":"call it dgen for degenerated data."},{"start":568.69,"text":"And then at the end, you can simply"},{"start":572.69,"text":"update your policy using both the real data"},{"start":576.35,"text":"and the generated data."},{"start":578.35,"text":"So update pi theta using dn and degenerated."},{"start":593.47,"text":"and then repeat this process."},{"start":595.91,"text":"Whoops, I misspelled real."},{"start":602.73,"text":"So the question is, if you're only generating short trajectories,"},{"start":605.83,"text":"does that take longer to converge to some goal?"},{"start":611.93,"text":"So you can think of it as kind of supplementing the data"},{"start":620.73,"text":"that you have so far."},{"start":621.71,"text":"and the things that are like the things in your when you start from states that"},{"start":626.45,"text":"are closer to the goal from when you generate data there then you'll be close"},{"start":634.03,"text":"to getting rewards and you'll be able to update the when you're further this"},{"start":638.87,"text":"doesn't mean that you this data won't necessarily reach the goal but you with"},{"start":643.29,"text":"reinforcement learning algorithms you'll be able to understand like some of this"},{"start":648.67,"text":"this data might feed into states that are in the data."},{"start":652.97,"text":"When you use reinforcement learning,"},{"start":655.01,"text":"you can then learn that, as an example,"},{"start":657.79,"text":"maybe you have a real trajectory that takes"},{"start":660.69,"text":"a path that is maybe not the most direct path,"},{"start":663.23,"text":"and then you start learning a policy that knows,"},{"start":666.55,"text":"maybe I should shortcut this,"},{"start":668.29,"text":"then your model, when you explore that in your synthetic data,"},{"start":672.35,"text":"this might actually help you learn"},{"start":674.11,"text":"a better policy by using this kind of data."},{"start":677.57,"text":"In terms of convergence speed or kind of speed in which you'll get a good policy,"},{"start":683.03,"text":"the generally this will allow you to, it might require, generally the thing that we're often"},{"start":691.55,"text":"trying to minimize is the amount of real data that we need right here. And this will allow"},{"start":696.95,"text":"you to get a good policy with less real data by using these red trajectories. Yeah, so the"},{"start":703.73,"text":"The question is, how do we get rewards in this case?"}],"speech_gaps":[],"frame":"../frames/v022/004.webp","frame_time":540.17},{"title":"多任务强化学习中的奖励函数与计算开销","segments":[{"id":97,"text":"I haven't explicitly written out here,","zh":"我在这里没有明确写出","start":707.47,"end":709.19},{"id":98,"text":"because sometimes you might know the form of the reward","zh":"因为有时候你可能已经知道奖励函数的形式","start":709.27,"end":714.31},{"id":99,"text":"function, or you might have learned a reward","zh":"或者你可能已经在原始的强化学习问题中学习到了奖励函数","start":714.31,"end":719.59},{"id":100,"text":"function in the original RL problem, in which case","zh":"在这种情况下","start":719.59,"end":722.97},{"id":101,"text":"you can use that.","zh":"你可以使用那个奖励函数。","start":722.97,"end":723.59},{"id":102,"text":"if you don't","zh":"如果你没有","start":723.59,"end":724.93},{"id":103,"text":"if you don't, if you didn't learn a reward function and the real world just gives you the rewards as part of this data, then when you train this model, you'll need for it to, either this model or a separate model, to also learn a reward function with supervised learning.","zh":"如果你没有，如果你没有学习到奖励函数，而现实世界只是将奖励作为数据的一部分提供给你，那么当你训练这个模型时，你需要让这个模型或者另一个单独的模型，也通过监督学习来学习奖励函数。","start":727.13,"end":742.79},{"id":104,"text":"So the question was about compute. So this is going to be more compute intensive during training than if you were to not use this, especially because sometimes the models that you might be learning, in some cases, the models that you're learning usually rolling out through them takes compute.","zh":"所以这个问题是关于计算开销的。因此，在训练过程中，这会比不使用这种方法更加耗费计算资源，尤其是有时候你所学习的模型，或者在某些情况下，通过这些模型进行的 rollout 会消耗计算资源。","start":743.9,"end":762.84},{"id":105,"text":"you're trading data in the environment for compute. One of the reasons why that trade-off is often favorable is because collecting online data in the real environment might be unsafe, or it might just be really expensive if you have to run experiments on physical equipment.","zh":"你是在用环境中的数据换取计算资源。这种权衡通常是有利的原因之一，是因为在真实环境中收集在线数据可能是不安全的，或者如果你必须在物理设备上运行实验，这可能非常昂贵。","start":763.64,"end":779.6},{"id":106,"text":"The unlike planning, however, this is not more compute intensive at test time because you're using the synthetic data to update a policy. And then at test time, you're running that policy as your final behavior. Cool. So the algorithm on the slides, we collect data, we update our model. This model may also model rewards by trying to mimic the data from the environment.","zh":"然而，与规划不同，这在测试时并不会更加耗费计算资源，因为你在使用合成数据来更新策略。然后在测试时，你运行该策略作为最终的行为。很好。因此，幻灯片上的算法，我们收集数据，更新我们的模型。该模型还可以通过尝试模仿环境中的数据来建模奖励。","start":781.41,"end":809.9},{"id":107,"text":"Then we will collect these short rollouts by kind of using our model, starting from states in the real data, and then we'll update the policy and optionally also update any sort of value function using the aggregated data.","zh":"然后，我们将通过使用我们的模型，从真实数据中的状态开始，收集这些简短的轨迹，并更新策略，可选地也使用聚合数据更新任何类型的价值函数。","start":810.51,"end":836.45},{"id":108,"text":"It is compatible with a variety of reinforcement learning algorithms.","zh":"它与各种强化学习算法兼容。","start":837.1,"end":840.64},{"id":109,"text":"So step four, you can use a variety of algorithms here.","zh":"因此，第四个步骤，你可以在这里使用各种算法。","start":840.96,"end":845.4},{"id":110,"text":"You can even use on-policy reinforcement learning algorithms as well.","zh":"你甚至可以使用在策略的强化学习算法。","start":846.22,"end":850.74},{"id":111,"text":"In particular, if you have an on-policy algorithm that needs data from the exact pi theta that you're taking a gradient step on,","zh":"特别是，如果你有一个需要从确切的πθ（你正在其上进行梯度更新的策略）中获取数据的在策略算法，","start":851.64,"end":860.18},{"id":112,"text":"all that means is that pi theta has to be the policy that was collecting the synthetic data through the model.","zh":"这意味着πθ必须是通过模型收集合成数据的策略。","start":860.8,"end":866.68},{"id":113,"text":"Cool. So with regards to this last update,","zh":"好的。那么关于这个最后的更新，","start":871.52,"end":874.88},{"id":114,"text":"here we're using both the data","zh":"在这里我们同时使用了环境的数据","start":876.58,"end":878.7},{"id":115,"text":"from the environment and the data from the model.","zh":"以及模型的数据。","start":878.7,"end":880.36},{"id":116,"text":"There are actually also some policy updates that only use data","zh":"实际上还有一些策略更新只使用数据","start":880.72,"end":884.62}],"notes":["本段讨论了在多任务强化学习中，是否需要显式地学习奖励函数的问题。如果奖励函数已经通过原始强化学习问题学习得到，可以直接使用；否则，需要通过监督学习来学习奖励函数。这增加了训练时的计算开销。","计算开销的增加是因为模型在训练过程中需要处理合成数据，而合成数据的生成可能需要较多的计算资源。这种计算开销的增加在训练阶段尤为明显，而在测试阶段则不会增加，因为测试时直接运行学习到的策略。","在多任务强化学习中，使用合成数据可以减少对真实环境数据的依赖，从而避免在真实环境中收集数据可能带来的安全风险或高昂成本。这种数据与计算的权衡在实际应用中是常见的。","该方法兼容多种强化学习算法，包括基于策略的算法。如果使用基于策略的算法，需要确保策略在训练过程中使用的是生成合成数据的策略，以保证数据的一致性。","在更新策略时，可以同时使用真实环境的数据和模型生成的数据。这种混合数据的使用有助于提高策略的泛化能力和稳定性。","在某些情况下，策略更新可能仅使用模型生成的数据，这取决于具体的应用场景和算法需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":707.47,"end":884.62,"asr_flags":[102],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":707.47,"text":"I haven't explicitly written out here,"},{"start":709.27,"text":"because sometimes you might know the form of the reward"},{"start":714.31,"text":"function, or you might have learned a reward"},{"start":719.59,"text":"function in the original RL problem, in which case"},{"start":722.97,"text":"you can use that."},{"start":723.59,"text":"if you don't"},{"start":727.13,"text":"if you didn't learn a reward function and the real world just gives you the rewards as part of this data, then when you train this model, you'll need for it to, either this model or a separate model, to also learn a reward function with supervised learning."},{"start":743.9,"text":"So the question was about compute. So this is going to be more compute intensive during training than if you were to not use this, especially because sometimes the models that you might be learning, in some cases, the models that you're learning usually rolling out through them takes compute."},{"start":763.64,"text":"you're trading data in the environment for compute. One of the reasons why that trade-off is often favorable is because collecting online data in the real environment might be unsafe, or it might just be really expensive if you have to run experiments on physical equipment."},{"start":781.41,"text":"The unlike planning, however, this is not more compute intensive at test time because you're using the synthetic data to update a policy. And then at test time, you're running that policy as your final behavior. Cool. So the algorithm on the slides, we collect data, we update our model. This model may also model rewards by trying to mimic the data from the environment."},{"start":810.51,"text":"Then we will collect these short rollouts by kind of using our model, starting from states in the real data, and then we'll update the policy and optionally also update any sort of value function using the aggregated data. One other thing to note about this is that"},{"start":837.1,"text":"It is compatible with a variety of reinforcement learning algorithms."},{"start":840.96,"text":"So step four, you can use a variety of algorithms here."},{"start":846.22,"text":"You can even use on-policy reinforcement learning algorithms as well."},{"start":851.64,"text":"In particular, if you have an on-policy algorithm that needs data from the exact pi theta that you're taking a gradient step on,"},{"start":860.8,"text":"all that means is that pi theta has to be the policy that was collecting the synthetic data through the model."},{"start":871.52,"text":"Cool. So with regards to this last update,"},{"start":876.58,"text":"here we're using both the data"},{"start":878.7,"text":"from the environment and the data from the model."},{"start":880.72,"text":"There are actually also some policy updates that only use data"}],"speech_gaps":[],"frame":"../frames/v022/005.webp","frame_time":719.47},{"title":"合成数据与模型强化学习的稳定性","segments":[{"id":117,"text":"from the model and find that that works fine as well.","zh":"从模型中生成数据，并发现这种方法同样可行。","start":884.62,"end":888.86},{"id":118,"text":"So you can choose to use either both","zh":"因此，你可以选择同时使用这两种方法","start":891.44,"end":893.14},{"id":119,"text":"or just use the data from the model.","zh":"或者只使用模型生成的数据。","start":893.14,"end":895.56},{"id":120,"text":"Yeah, so this only makes sense when you have an estimate of the reward function,","zh":"是的，这只有在你对奖励函数有估计时才有意义，","start":896.34,"end":899.8},{"id":121,"text":"and if you don't, then you won't be able to update your policy on the generated data.","zh":"如果你没有这样的估计，你就无法在生成的数据上更新策略。","start":899.98,"end":905.4},{"id":122,"text":"So the question is, is the learning stable when you use the synthetic data?","zh":"因此，问题是：当你使用合成数据时，学习过程是否稳定？","start":906.34,"end":909.46},{"id":123,"text":"Yeah, yeah. So you may be in a scenario where you're adding a lot of synthetic data,","zh":"是的，是的。你可能处于一个场景中，你添加了大量合成数据，","start":913.4,"end":919.5},{"id":124,"text":"and so how much synthetic data you generate and how you balance that data in this last update","zh":"那么你生成多少合成数据，以及如何在这次最后更新中平衡这些数据","start":919.66,"end":925.04},{"id":125,"text":"is like kind of might depend on like how good you think your model is. In terms of stability,","zh":"这可能取决于你认为自己的模型有多好。就稳定性而言","start":925.04,"end":930.98},{"id":126,"text":"I think that like we'll talk about pros and cons on the next slide, but one downside of","zh":"我认为我们将在下一张幻灯片上讨论优缺点，但这类算法的一个缺点是","start":934.02,"end":939.32},{"id":127,"text":"these kinds of algorithms is they do introduce additional hyperparameters because you have to","zh":"它们会引入额外的超参数，因为你需要训练这个模型。例如，如果你的模型训练由于某种原因表现不佳","start":939.32,"end":944.52},{"id":128,"text":"train this model. And if, for example, your model training like for whatever reason it didn't do","zh":"那么你可能会陷入一个场景","start":944.52,"end":950.56},{"id":129,"text":"do well, then you might end up in a scenario","zh":"使得算法表现更差","start":950.56,"end":952.68},{"id":130,"text":"where the algorithm performs more poorly","zh":"因为这些超参数没有被很好地调优。","start":952.68,"end":957.04},{"id":131,"text":"because those hyperparameters weren't well-tuned.","zh":"因此你可以看到这些问题。","start":957.04,"end":959.48},{"id":132,"text":"And so you can see issues there.","zh":"因此你可以看到那些问题。","start":959.7,"end":961.46},{"id":133,"text":"But otherwise, if you have a fairly accurate model,","start":962.98,"end":972.16},{"id":134,"text":"you usually don't have issues otherwise with stability.","start":972.82,"end":975.6},{"id":135,"text":"So let's talk a little bit about when to use this sort of synthetic data and when to use","start":978.66,"end":984.22},{"id":136,"text":"model-based reinforcement learning. So generally the way to think about it is that there's","start":984.22,"end":989.72},{"id":137,"text":"potentially really big upsides with model-based reinforcement learning and also potentially big","start":989.72,"end":994.36},{"id":138,"text":"downsides. The big upside is that if you can learn a pretty good model, then","start":994.36,"end":1002.16},{"id":139,"text":"it is immensely useful to be able to predict the future. And you can get away with using far, far less real data by using the data that's generated. And so in domains where it's feasible to learn a model, it's really, really useful. You could also do the test time planning as well. And generally, I guess,","start":1003.1,"end":1025.52},{"id":140,"text":"Maybe one other point that's not on the slides with regard to upsides is that it seems like this notion of being able to anticipate future states as an outcome of your actions, that seems like a fairly fundamental thing that our models should at least have some understanding for.","start":1026.12,"end":1040.58}],"notes":["本段讨论了在使用合成数据进行强化学习时的稳定性问题。讲者指出，当模型能够估计奖励函数时，使用合成数据是可行的，但如果无法估计奖励函数，则无法通过生成数据更新策略。此外，讲者提到使用合成数据时，学习的稳定性取决于模型的质量，如果模型训练效果不佳，可能会导致算法性能下降。","讲者进一步指出，模型强化学习具有显著的优势和劣势。优势在于，如果模型足够准确，可以大幅减少对真实数据的依赖，并且可以进行测试时的规划。劣势则包括引入额外的超参数，以及模型训练效果不佳可能导致的性能问题。","讲者还提到，模型强化学习的一个重要优势是能够预测未来状态，这是模型应具备的基本能力之一。这种能力使得模型能够更好地理解行为与未来状态之间的关系，从而提升整体性能。","讲者强调，模型强化学习的使用场景取决于模型的准确性。如果模型足够准确，通常不会出现稳定性问题。但如果模型训练效果不佳，可能会导致算法性能下降，因此需要仔细调整超参数。","讲者还提到，模型强化学习的另一个优势是可以在测试时进行规划，这在某些应用场景中非常有用。此外，模型能够预测未来状态的能力是其核心优势之一。","讲者最后指出，模型强化学习的使用需要权衡其优缺点。虽然模型训练可能引入额外的复杂性，但在某些领域，如模型可以准确学习的情况下，其优势是显著的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":884.62,"end":1040.58,"asr_flags":[133],"translation_complete":false,"translated_segments":16,"raw_segments":[{"start":884.62,"text":"from the model and find that that works fine as well."},{"start":891.44,"text":"So you can choose to use either both"},{"start":893.14,"text":"or just use the data from the model."},{"start":896.34,"text":"Yeah, so this only makes sense when you have an estimate of the reward function,"},{"start":899.98,"text":"and if you don't, then you won't be able to update your policy on the generated data."},{"start":906.34,"text":"So the question is, is the learning stable when you use the synthetic data?"},{"start":913.4,"text":"Yeah, yeah. So you may be in a scenario where you're adding a lot of synthetic data,"},{"start":919.66,"text":"and so how much synthetic data you generate and how you balance that data in this last update"},{"start":925.04,"text":"is like kind of might depend on like how good you think your model is. In terms of stability,"},{"start":934.02,"text":"I think that like we'll talk about pros and cons on the next slide, but one downside of"},{"start":939.32,"text":"these kinds of algorithms is they do introduce additional hyperparameters because you have to"},{"start":944.52,"text":"train this model. And if, for example, your model training like for whatever reason it didn't do"},{"start":950.56,"text":"do well, then you might end up in a scenario"},{"start":952.68,"text":"where the algorithm performs more poorly"},{"start":957.04,"text":"because those hyperparameters weren't well-tuned."},{"start":959.7,"text":"And so you can see issues there."},{"start":962.98,"text":"But otherwise, if you have a fairly accurate model,"},{"start":972.82,"text":"you usually don't have issues otherwise with stability."},{"start":978.66,"text":"So let's talk a little bit about when to use this sort of synthetic data and when to use"},{"start":984.22,"text":"model-based reinforcement learning. So generally the way to think about it is that there's"},{"start":989.72,"text":"potentially really big upsides with model-based reinforcement learning and also potentially big"},{"start":994.36,"text":"downsides. The big upside is that if you can learn a pretty good model, then"},{"start":1003.1,"text":"it is immensely useful to be able to predict the future. And you can get away with using far, far less real data by using the data that's generated. And so in domains where it's feasible to learn a model, it's really, really useful. You could also do the test time planning as well. And generally, I guess,"},{"start":1026.12,"text":"Maybe one other point that's not on the slides with regard to upsides is that it seems like this notion of being able to anticipate future states as an outcome of your actions, that seems like a fairly fundamental thing that our models should at least have some understanding for."}],"speech_gaps":[{"start":889.26,"end":891.04},{"start":931.38,"end":932.928}],"frame":"../frames/v022/006.webp","frame_time":896.62},{"title":"多任务强化学习中的模型训练与挑战","segments":[{"id":141,"text":"One other thing that we actually didn't talk about is there are also scenarios where the model can be trained without reward labels. And for example, if some of your real data has rewards and some of it doesn't have rewards, the part that doesn't have rewards, you can train your model on. And your model can actually leverage potentially more data than what a model-free reinforcement learning method can use.","start":1043.28,"end":1068.36},{"id":142,"text":"That's quite nice. And there are scenarios where you might be able to collect very large amounts of data without rewards and a small amount of data with rewards. And then the other thing is that the model is somewhat task agnostic. And so if it was trained on a broad enough data distribution, sometimes you can transfer this model across different tasks or across different rewards. And so, for example, if your goal isn't just to learn one task, but to learn many different tasks, this sort of transferability is useful.","start":1070.93,"end":1100.81},{"id":143,"text":"So those are the big upsides. What about the big downsides? One downside is that the model doesn't optimize for task performance. And errors, because it's trying to like, for example, if you have image observations or your states are images, then it's trying to get the details in the pixels to line up. And that, for example, the color of the sky is like the correct color, for example. And that, in some ways, oftentimes is...","start":1103.16,"end":1130.78},{"id":144,"text":"not actually what you care about in terms of learning a good policy. So there's this mismatch between what you're optimizing for when you train a model and what you actually might care about in terms of downstream policy performance.","start":1131.24,"end":1142.48},{"id":145,"text":"Sometimes it's really hard to learn a good model. Sometimes it's hard to learn a good model than it is to learn a good policy. In these cases, usually you don't want to learn models because you're kind of then presenting a harder problem than the actual downstream problem you might care about. And then the last thing that I alluded to before is that it's another thing you have to train. And so there's more hyperparameters and it's also more compute intensive.","start":1145.63,"end":1171.5},{"id":146,"text":"Because of these big upsides and big downsides, generally whether to try to learn this kind of predictive model depends a lot on the domain and how hard it is to learn that kind of model. Yeah, so the question was, what are a few examples of the additional hyperparameters? The main thing all comes down to this step two right here, which is that you need to design the architecture of the model.","start":1173.27,"end":1198.33},{"id":147,"text":"of this predictive model, and it might need to be a completely different architecture from the policy if you're going to be generating images or states. The second is that you need a learning rate, you need to know how long to train that for, like how many epochs, any regularization for that model, basically everything that might go into training a model like this.","start":1198.83,"end":1221.25}],"notes":["本段讨论了多任务强化学习中模型训练的优势与劣势。优势包括可以利用无奖励数据进行训练，从而获得更丰富的数据集，并且模型可以跨任务迁移。劣势则包括模型可能不直接优化任务性能，导致与实际策略性能之间的不匹配，以及训练模型可能比直接学习策略更困难，且需要更多计算资源。","讲者提到，当模型训练的目标与实际策略性能不一致时，可能会出现性能不匹配的问题。例如，模型可能过度关注像素细节，而这些细节对策略性能并不重要。","讲者指出，训练模型可能比直接学习策略更困难，因此在某些情况下，不建议使用模型。此外，模型训练需要更多的超参数和计算资源。","讲者提到，模型训练的额外超参数主要涉及模型架构的设计，例如是否需要与策略使用不同的架构，以及学习率、训练时长、正则化等参数。","讲者强调，是否采用这种预测模型取决于具体领域和模型的难易程度。在某些情况下，直接学习策略可能更有效率。","讲者最后提到，模型训练的额外超参数包括学习率、训练时长、正则化等，这些都是训练模型时需要考虑的重要因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1043.28,"end":1221.25,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1043.28,"text":"One other thing that we actually didn't talk about is there are also scenarios where the model can be trained without reward labels. And for example, if some of your real data has rewards and some of it doesn't have rewards, the part that doesn't have rewards, you can train your model on. And your model can actually leverage potentially more data than what a model-free reinforcement learning method can use."},{"start":1070.93,"text":"That's quite nice. And there are scenarios where you might be able to collect very large amounts of data without rewards and a small amount of data with rewards. And then the other thing is that the model is somewhat task agnostic. And so if it was trained on a broad enough data distribution, sometimes you can transfer this model across different tasks or across different rewards. And so, for example, if your goal isn't just to learn one task, but to learn many different tasks, this sort of transferability is useful."},{"start":1103.16,"text":"So those are the big upsides. What about the big downsides? One downside is that the model doesn't optimize for task performance. And errors, because it's trying to like, for example, if you have image observations or your states are images, then it's trying to get the details in the pixels to line up. And that, for example, the color of the sky is like the correct color, for example. And that, in some ways, oftentimes is..."},{"start":1131.24,"text":"not actually what you care about in terms of learning a good policy. So there's this mismatch between what you're optimizing for when you train a model and what you actually might care about in terms of downstream policy performance."},{"start":1145.63,"text":"Sometimes it's really hard to learn a good model. Sometimes it's hard to learn a good model than it is to learn a good policy. In these cases, usually you don't want to learn models because you're kind of then presenting a harder problem than the actual downstream problem you might care about. And then the last thing that I alluded to before is that it's another thing you have to train. And so there's more hyperparameters and it's also more compute intensive."},{"start":1173.27,"text":"Because of these big upsides and big downsides, generally whether to try to learn this kind of predictive model depends a lot on the domain and how hard it is to learn that kind of model. Yeah, so the question was, what are a few examples of the additional hyperparameters? The main thing all comes down to this step two right here, which is that you need to design the architecture of the model."},{"start":1198.83,"text":"of this predictive model, and it might need to be a completely different architecture from the policy if you're going to be generating images or states. The second is that you need a learning rate, you need to know how long to train that for, like how many epochs, any regularization for that model, basically everything that might go into training a model like this."}],"speech_gaps":[],"frame":"../frames/v022/007.webp","frame_time":1055.28},{"title":"多任务强化学习中的模型与策略学习对比","segments":[{"id":148,"text":"One more thing on that previous question.","zh":"关于之前那个问题，还有一点。","start":1222.03,"end":1223.87},{"id":149,"text":"Beyond training this model, there's also hyper-priorities with regard to the length of these rollouts","zh":"除了训练这个模型之外，还涉及到关于这些rollout长度的超优先级","start":1224.87,"end":1229.15},{"id":150,"text":"and how much synthetic data to generate.","zh":"以及生成多少合成数据的问题。","start":1229.15,"end":1231.75},{"id":151,"text":"So the question is, do we keep on collecting data after each policy update?","zh":"因此，问题是，我们在每次策略更新后是否继续收集数据？","start":1232.75,"end":1237.35},{"id":152,"text":"So this is, as written, this is like an online algorithm.","zh":"正如所写，这类似于一个在线算法。","start":1237.71,"end":1242.89},{"id":153,"text":"You can actually also develop completely offline versions, model-based RL versions as well,","zh":"你也可以完全开发离线版本，包括基于模型的强化学习版本，","start":1243.23,"end":1248.73},{"id":154,"text":"where you have a fixed prior data set","zh":"其中你有一个固定的先验数据集","start":1248.73,"end":1251.13},{"id":155,"text":"and you augment that data set with a model","zh":"并且你通过一个模型来扩充这个数据集","start":1251.13,"end":1254.03},{"id":156,"text":"and then you trade a policy and you're done.","start":1254.03,"end":1255.83},{"id":157,"text":"In this case, we have an online algorithm","start":1257.07,"end":1258.99},{"id":158,"text":"where we then continue to kind of collect real data,","start":1258.99,"end":1262.05},{"id":159,"text":"update our model, and so forth.","start":1262.15,"end":1264.13},{"id":160,"text":"This can be done in an off-policy way or an on-policy way.","start":1267.05,"end":1270.01},{"id":161,"text":"So that's going to come down to when you do this update,","start":1270.31,"end":1273.65},{"id":162,"text":"Is it going to only use the DN and the DGEN from this iteration or also from previous iterations?","start":1273.65,"end":1280.91},{"id":163,"text":"And that's going to depend on what algorithm you use to update your policy.","start":1282.51,"end":1285.49},{"id":164,"text":"So generally, models are very flexible. You can use them offline, on policy, off policy, and so forth.","start":1286.57,"end":1292.61},{"id":165,"text":"Yeah, so the question is, how hard is it to learn a model compared to a policy?","start":1293.59,"end":1298.75},{"id":166,"text":"see. Uh, it's extremely domain dependent. So the, um, say for example, you are, say you're in like","start":1298.75,"end":1307.59},{"id":167,"text":"a maze. Uh, so you're trying to learn like how to get from here to here. Maybe there's like some","start":1307.59,"end":1314.81},{"id":168,"text":"some walls, you need to kind of figure out how to.","start":1314.81,"end":1319.13},{"id":169,"text":"kind of get through this sort of environment, and you're not able to go through the walls. In this case, the model might be quite easy to learn. You'll learn that if your action is to go right, then you'll go right unless there's a wall there. If you're going to go up and so forth, that's really easy.","start":1319.95,"end":1336.25},{"id":170,"text":"But the policy is really complicated because the policy is saying that if you're here, maybe you need to go in various different directions. And so this is a case where the policy is a lot more complicated than the model, and learning a model could be a good choice. As another example, say that you're trying to pour some water from one cup into a bowl or something like that.","start":1336.73,"end":1363.11},{"id":171,"text":"the policy might be potentially fairly simple. Maybe you're already even holding the cup in your hand. Then the policy might be as simple as just rotating your wrist.","start":1363.63,"end":1375.41},{"id":172,"text":"But the model in this sort of case might involve the fluid dynamics of how the water will pour","start":1376.59,"end":1382.21},{"id":173,"text":"and what will happen, for example, if it hits the edge of the bowl or the center of the bowl","start":1382.21,"end":1387.33},{"id":174,"text":"or something like that.","start":1387.33,"end":1388.41},{"id":175,"text":"And this is a scenario where the model is a lot more complicated than the policy.","start":1388.61,"end":1392.85},{"id":176,"text":"And it's possible that it would be, yeah, in this scenario,","start":1394.17,"end":1397.97},{"id":177,"text":"it might be a lot easier to just learn the policy without learning the model.","start":1398.05,"end":1400.67}],"notes":["本段讨论了在多任务强化学习中，模型与策略学习的难易程度取决于具体任务领域。在某些情况下，如迷宫导航，模型可能更容易学习，因为其行为规则相对简单，而策略需要处理复杂的路径选择。而在其他情况下，如倒水任务，模型可能更复杂，因为需要建模流体动力学，而策略可能相对简单。","讲者通过两个具体例子说明了模型与策略的复杂性差异。在迷宫中，模型可以学习到简单的移动规则，而策略需要处理复杂的路径规划。而在倒水任务中，模型需要建模流体动力学，而策略可能只需简单的动作。","讲者指出，模型和策略的学习难度是高度依赖于任务的。因此，在设计多任务强化学习系统时，需要根据具体任务选择是否优先学习模型或策略。","讲者提到，模型可以用于离线或在线学习，而策略的学习方式则取决于具体的算法和任务需求。","讲者强调，模型和策略的学习难度并非绝对，而是取决于任务的性质。因此，在实际应用中，需要根据任务的具体情况来决定学习模型还是策略。","讲者通过两个例子说明了模型和策略的复杂性差异，并指出在某些情况下，学习模型可能比学习策略更容易，而在其他情况下则相反。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1222.03,"end":1400.67,"asr_flags":[],"translation_complete":false,"translated_segments":8,"raw_segments":[{"start":1222.03,"text":"One more thing on that previous question."},{"start":1224.87,"text":"Beyond training this model, there's also hyper-priorities with regard to the length of these rollouts"},{"start":1229.15,"text":"and how much synthetic data to generate."},{"start":1232.75,"text":"So the question is, do we keep on collecting data after each policy update?"},{"start":1237.71,"text":"So this is, as written, this is like an online algorithm."},{"start":1243.23,"text":"You can actually also develop completely offline versions, model-based RL versions as well,"},{"start":1248.73,"text":"where you have a fixed prior data set"},{"start":1251.13,"text":"and you augment that data set with a model"},{"start":1254.03,"text":"and then you trade a policy and you're done."},{"start":1257.07,"text":"In this case, we have an online algorithm"},{"start":1258.99,"text":"where we then continue to kind of collect real data,"},{"start":1262.15,"text":"update our model, and so forth."},{"start":1267.05,"text":"This can be done in an off-policy way or an on-policy way."},{"start":1270.31,"text":"So that's going to come down to when you do this update,"},{"start":1273.65,"text":"Is it going to only use the DN and the DGEN from this iteration or also from previous iterations?"},{"start":1282.51,"text":"And that's going to depend on what algorithm you use to update your policy."},{"start":1286.57,"text":"So generally, models are very flexible. You can use them offline, on policy, off policy, and so forth."},{"start":1293.59,"text":"Yeah, so the question is, how hard is it to learn a model compared to a policy?"},{"start":1298.75,"text":"see. Uh, it's extremely domain dependent. So the, um, say for example, you are, say you're in like"},{"start":1307.59,"text":"a maze. Uh, so you're trying to learn like how to get from here to here. Maybe there's like some"},{"start":1314.81,"text":"some walls, you need to kind of figure out how to."},{"start":1319.95,"text":"kind of get through this sort of environment, and you're not able to go through the walls. In this case, the model might be quite easy to learn. You'll learn that if your action is to go right, then you'll go right unless there's a wall there. If you're going to go up and so forth, that's really easy."},{"start":1336.73,"text":"But the policy is really complicated because the policy is saying that if you're here, maybe you need to go in various different directions. And so this is a case where the policy is a lot more complicated than the model, and learning a model could be a good choice. As another example, say that you're trying to pour some water from one cup into a bowl or something like that."},{"start":1363.63,"text":"the policy might be potentially fairly simple. Maybe you're already even holding the cup in your hand. Then the policy might be as simple as just rotating your wrist."},{"start":1376.59,"text":"But the model in this sort of case might involve the fluid dynamics of how the water will pour"},{"start":1382.21,"text":"and what will happen, for example, if it hits the edge of the bowl or the center of the bowl"},{"start":1387.33,"text":"or something like that."},{"start":1388.61,"text":"And this is a scenario where the model is a lot more complicated than the policy."},{"start":1394.17,"text":"And it's possible that it would be, yeah, in this scenario,"},{"start":1398.05,"text":"it might be a lot easier to just learn the policy without learning the model."}],"speech_gaps":[{"start":1264.592,"end":1266.65}],"frame":"../frames/v022/008.webp","frame_time":1234.03},{"title":"模型基础强化学习的适用性与模型类型","segments":[{"id":178,"text":"So it really depends on the domain.","zh":"所以，这真的取决于领域。","start":1400.97,"end":1402.45},{"id":179,"text":"Yeah, so the question is, how successful has model-based RL been?","zh":"是的，所以问题是，基于模型的强化学习是否取得了成功？","start":1403.29,"end":1406.17},{"id":180,"text":"in robotics scenarios, if you're dealing","zh":"在机器人场景中，如果你在处理","start":1406.59,"end":1412.87},{"id":181,"text":"with high-dimensional image observations,","zh":"高维图像观测数据，","start":1412.87,"end":1414.67},{"id":182,"text":"it's arguably been less successful.","zh":"可以说它取得的成功较少。","start":1415.51,"end":1417.57},{"id":183,"text":"If you have a more compact state space,","zh":"如果你有一个更紧凑的状态空间，","start":1417.75,"end":1420.89},{"id":184,"text":"like the positions of joints and positions of objects,","zh":"比如关节的位置和物体的位置，","start":1421.11,"end":1423.83},{"id":185,"text":"then it's been a lot more successful.","zh":"那么它取得的成功就多得多。","start":1424.09,"end":1426.37},{"id":186,"text":"With legged robots, for example,","start":1429.15,"end":1431.49},{"id":187,"text":"you can use model-based RL pretty successfully.","start":1431.65,"end":1435.23},{"id":188,"text":"successfully if you're mostly just trying to learn a blind walking policy. Or if we saw the","start":1435.23,"end":1441.75},{"id":189,"text":"dexterous hand manipulation where you knew the position of the two balls, it was also very","start":1441.75,"end":1447.25},{"id":190,"text":"successful for that. And I haven't tried to do model-free RL for that problem. Or even imitation","start":1447.25,"end":1453.11},{"id":191,"text":"learning would be very, very challenging. And so it's been extremely successful there. In scenarios","start":1453.11,"end":1457.97},{"id":192,"text":"where you have image observations, it gets a lot harder. It doesn't mean that","start":1457.97,"end":1462.47},{"id":193,"text":"video generative models are getting a lot better, and so I can see a future where this sort of approach might also be quite successful in the future, but right now it hasn't been super successful. The last thing that I'll mention on model-based RL is that so far we've been modeling this predictive model of the future, and there's actually a lot of other objects that you could learn.","start":1464.09,"end":1491.79},{"id":194,"text":"You could learn what's called an inverse model. You could learn for two states, what was the action that led to... If I'm currently in state st, what is the action that would lead to state st plus 1? You could learn a multi-step inverse model, which is that if I'm going to end up at state st plus n, what action would lead me there, or what are the sequence of actions that would lead me there? This actually looks...","start":1493.71,"end":1520.34},{"id":195,"text":"Both of these in some ways look closer to a policy, except you're passing as input some future state rather than just the current state. These are also things that can be learned without data with rewards. You're kind of just learning about the environment and not about the particular task at hand.","start":1520.74,"end":1538.48},{"id":196,"text":"You can predict futures without actions, and that kind of can think about what are the affordances in my environment, what are the things that could be possible to happen in the future, irrespective of the actions that I take. You could try to interpolate between two states. You could learn a derivative model of transitions of ST, AT, ST plus 1. There's kind of some cool properties with that sort of model.","start":1540.02,"end":1568.22},{"id":197,"text":"these kind of models can be pretty useful","start":1571.64,"end":1573.66},{"id":198,"text":"too. They have various purposes","start":1573.66,"end":1575.28},{"id":199,"text":"there's lots of research on","start":1576.04,"end":1577.52},{"id":200,"text":"using different kinds of models like these","start":1577.52,"end":1579.08}],"notes":["本段讨论了模型基础强化学习（model-based RL）在不同任务中的成功程度。在机器人学场景中，如果处理的是高维图像观测，模型基础强化学习的效果可能不如在紧凑状态空间中（如关节位置和物体位置）的效果好。例如，腿式机器人可以成功使用模型基础强化学习，而像灵巧手操作这样的任务，如果已知物体位置，也能取得成功。但图像观测会增加难度，目前模型基础强化学习在这些场景中尚未非常成功。","讲者提到，除了预测模型外，还可以学习逆模型（inverse model），即从两个状态推断出导致状态变化的动作。逆模型可以是单步或多步的，用于预测未来状态所需的动作序列。这些模型与策略类似，但输入是未来状态而非当前状态，且可以在没有奖励数据的情况下学习环境特性。","讲者进一步指出，可以预测未来状态而不依赖动作，从而思考环境中可能发生的事件，无论采取什么动作。此外，可以学习状态转移的导数模型，这在某些场景下具有有趣的性质。","这些模型在不同任务中具有多种用途，已有大量研究探讨如何使用这些模型。讲者强调，这些模型可以用于预测未来、理解环境特性，而不仅仅是完成特定任务。","讲者提到，模型基础强化学习的未来可能更加成功，尤其是在视频生成模型进步的情况下。但目前在图像观测场景中，模型基础强化学习尚未达到很高的成功率。","讲者最后指出，除了预测模型外，还有许多其他模型可以学习，如逆模型和导数模型，这些模型在不同任务中具有不同的用途。"],"formulas":[],"uncertainties":["ST, AT, ST plus 1"],"diagram":"none","start":1400.97,"end":1579.08,"asr_flags":[],"translation_complete":false,"translated_segments":8,"raw_segments":[{"start":1400.97,"text":"So it really depends on the domain."},{"start":1403.29,"text":"Yeah, so the question is, how successful has model-based RL been?"},{"start":1406.59,"text":"in robotics scenarios, if you're dealing"},{"start":1412.87,"text":"with high-dimensional image observations,"},{"start":1415.51,"text":"it's arguably been less successful."},{"start":1417.75,"text":"If you have a more compact state space,"},{"start":1421.11,"text":"like the positions of joints and positions of objects,"},{"start":1424.09,"text":"then it's been a lot more successful."},{"start":1429.15,"text":"With legged robots, for example,"},{"start":1431.65,"text":"you can use model-based RL pretty successfully."},{"start":1435.23,"text":"successfully if you're mostly just trying to learn a blind walking policy. Or if we saw the"},{"start":1441.75,"text":"dexterous hand manipulation where you knew the position of the two balls, it was also very"},{"start":1447.25,"text":"successful for that. And I haven't tried to do model-free RL for that problem. Or even imitation"},{"start":1453.11,"text":"learning would be very, very challenging. And so it's been extremely successful there. In scenarios"},{"start":1457.97,"text":"where you have image observations, it gets a lot harder. It doesn't mean that"},{"start":1464.09,"text":"video generative models are getting a lot better, and so I can see a future where this sort of approach might also be quite successful in the future, but right now it hasn't been super successful. The last thing that I'll mention on model-based RL is that so far we've been modeling this predictive model of the future, and there's actually a lot of other objects that you could learn."},{"start":1493.71,"text":"You could learn what's called an inverse model. You could learn for two states, what was the action that led to... If I'm currently in state st, what is the action that would lead to state st plus 1? You could learn a multi-step inverse model, which is that if I'm going to end up at state st plus n, what action would lead me there, or what are the sequence of actions that would lead me there? This actually looks..."},{"start":1520.74,"text":"Both of these in some ways look closer to a policy, except you're passing as input some future state rather than just the current state. These are also things that can be learned without data with rewards. You're kind of just learning about the environment and not about the particular task at hand."},{"start":1540.02,"text":"You can predict futures without actions, and that kind of can think about what are the affordances in my environment, what are the things that could be possible to happen in the future, irrespective of the actions that I take. You could try to interpolate between two states. You could learn a derivative model of transitions of ST, AT, ST plus 1. There's kind of some cool properties with that sort of model."},{"start":1571.64,"text":"these kind of models can be pretty useful"},{"start":1573.66,"text":"too. They have various purposes"},{"start":1576.04,"text":"there's lots of research on"},{"start":1577.52,"text":"using different kinds of models like these"}],"speech_gaps":[{"start":1426.77,"end":1428.75}],"frame":"../frames/v022/009.webp","frame_time":1412.97},{"title":"多任务强化学习（Multi-Task RL）","segments":[{"id":201,"text":"and so it's just something to think","start":1579.08,"end":1581.66},{"id":202,"text":"about in terms of like in some domains","start":1581.66,"end":1583.62},{"id":203,"text":"you could imagine or with some","start":1583.62,"end":1584.94},{"id":204,"text":"data sources you could imagine scenarios","start":1584.94,"end":1587.56},{"id":205,"text":"where these might be useful.","start":1587.56,"end":1589.12},{"id":206,"text":"So the question is","start":1589.94,"end":1591.1},{"id":207,"text":"if you use data that doesn't have rewards","start":1591.1,"end":1593.58},{"id":208,"text":"as part of your model training","start":1593.58,"end":1595.32},{"id":209,"text":"is there going to be a mismatch between the accuracy","start":1595.32,"end":1597.34},{"id":210,"text":"of predicting next states and predicting rewards?","start":1597.34,"end":1599.66},{"id":211,"text":"Uh, the, um, there certainly could be, like, a mismatch like that.","start":1601.04,"end":1604.36},{"id":212,"text":"The, generally, rewards are a bit easier to learn how to predict than future states.","start":1604.64,"end":1612.46},{"id":213,"text":"Uh, and so the, um, even if you have a lot more data for learning the model,","start":1612.76,"end":1619.7},{"id":214,"text":"you could actually end up in a scenario where the model is less accurate than the estimated reward.","start":1619.78,"end":1623.74},{"id":215,"text":"Uh, but you, yeah, you can definitely end up with scenarios where the reward is less accurate","start":1624.58,"end":1628.84},{"id":216,"text":"and where you need to specifically gather data for that.","start":1628.84,"end":1632.8},{"id":217,"text":"Cool. Okay.","start":1636.92,"end":1638.1},{"id":218,"text":"So that's it for model-based RL.","start":1638.3,"end":1640.5},{"id":219,"text":"Now we're going to talk a bit about multitask learning","start":1641.32,"end":1644.3},{"id":220,"text":"and what that looks like,","start":1645.2,"end":1647.18},{"id":221,"text":"and also different techniques that we can do","start":1647.24,"end":1649.04},{"id":222,"text":"beyond a fairly naive and simple technique.","start":1649.04,"end":1651.44},{"id":223,"text":"So what is multitask reinforcement learning?","start":1653.68,"end":1656.82},{"id":224,"text":"The key idea is that we want to be able to generate, we want to be able to learn a generalist policy that isn't just aiming to do one thing, like being able to pour water, for example, but that can do many different things.","start":1658.14,"end":1673.78},{"id":225,"text":"The examples of this, we might want kind of a generalist language model assistant that can book travel for us, that can do online grocery shopping. We might want a legged robot that can walk, that can run, that can dance, that can crouch. Maybe a mobile robot that can hang up a towel, unload a dishwasher, wipe a spill. We want a music recommender system that can personalize recommendations for one person.","start":1676.76,"end":1701.55},{"id":226,"text":"and also be able to personalize recommendations to a different person. Or we might want something that can play lots of different games, like being able to play Pokemon and pinball and Flappy Bird and so forth. And there are scenarios where if you think about each of these tasks as their own reinforcement learning problem, they might have different reward functions from the other tasks. They might, in some cases, have different dynamics, like the dynamics of different games.","start":1702.14,"end":1730.71}],"notes":["本段讨论了在模型训练中使用无奖励数据时可能出现的不匹配问题，即预测下一状态和预测奖励之间的准确性差异。讲者指出，奖励通常比未来状态更容易学习，因此即使有大量数据，模型的准确性可能仍低于奖励估计。","接着，讲者转向多任务强化学习（Multi-Task RL）的概念，强调其目标是学习一个通用策略，能够完成多种任务，而不是仅专注于单一任务。","讲者列举了多个实际例子，如通用语言模型助手、腿部机器人、移动机器人和音乐推荐系统，说明多任务学习在不同应用场景中的价值。","此外，讲者提到，每个任务可能具有不同的奖励函数和动态特性，因此需要考虑这些差异以设计有效的多任务学习方法。","讲者还指出，多任务学习不仅仅是简单技术的扩展，而是需要更复杂的策略来处理不同任务之间的关系。","最后，讲者强调了多任务学习在现实世界中的重要性，特别是在需要处理多种任务和不同环境动态的场景中。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1579.08,"end":1730.71,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1579.08,"text":"and so it's just something to think"},{"start":1581.66,"text":"about in terms of like in some domains"},{"start":1583.62,"text":"you could imagine or with some"},{"start":1584.94,"text":"data sources you could imagine scenarios"},{"start":1587.56,"text":"where these might be useful."},{"start":1589.94,"text":"So the question is"},{"start":1591.1,"text":"if you use data that doesn't have rewards"},{"start":1593.58,"text":"as part of your model training"},{"start":1595.32,"text":"is there going to be a mismatch between the accuracy"},{"start":1597.34,"text":"of predicting next states and predicting rewards?"},{"start":1601.04,"text":"Uh, the, um, there certainly could be, like, a mismatch like that."},{"start":1604.64,"text":"The, generally, rewards are a bit easier to learn how to predict than future states."},{"start":1612.76,"text":"Uh, and so the, um, even if you have a lot more data for learning the model,"},{"start":1619.78,"text":"you could actually end up in a scenario where the model is less accurate than the estimated reward."},{"start":1624.58,"text":"Uh, but you, yeah, you can definitely end up with scenarios where the reward is less accurate"},{"start":1628.84,"text":"and where you need to specifically gather data for that."},{"start":1636.92,"text":"Cool. Okay."},{"start":1638.3,"text":"So that's it for model-based RL."},{"start":1641.32,"text":"Now we're going to talk a bit about multitask learning"},{"start":1645.2,"text":"and what that looks like,"},{"start":1647.24,"text":"and also different techniques that we can do"},{"start":1649.04,"text":"beyond a fairly naive and simple technique."},{"start":1653.68,"text":"So what is multitask reinforcement learning?"},{"start":1658.14,"text":"The key idea is that we want to be able to generate, we want to be able to learn a generalist policy that isn't just aiming to do one thing, like being able to pour water, for example, but that can do many different things."},{"start":1676.76,"text":"The examples of this, we might want kind of a generalist language model assistant that can book travel for us, that can do online grocery shopping. We might want a legged robot that can walk, that can run, that can dance, that can crouch. Maybe a mobile robot that can hang up a towel, unload a dishwasher, wipe a spill. We want a music recommender system that can personalize recommendations for one person."},{"start":1702.14,"text":"and also be able to personalize recommendations to a different person. Or we might want something that can play lots of different games, like being able to play Pokemon and pinball and Flappy Bird and so forth. And there are scenarios where if you think about each of these tasks as their own reinforcement learning problem, they might have different reward functions from the other tasks. They might, in some cases, have different dynamics, like the dynamics of different games."}],"speech_gaps":[],"frame":"../frames/v022/010.webp","frame_time":1591.08},{"title":"多任务强化学习的概念与数据效率","segments":[{"id":227,"text":"or the dynamics of different people. They might have different action spaces even. And so whe
