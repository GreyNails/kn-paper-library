in policies across these different tasks, there's some considerations that come up when you try to do that. Now, the key idea that we'll see is that you can, in many cases, just go about normal reinforcement learning, but condition on the task that you're trying to learn.","zh":"或者不同人的动态。他们甚至可能有不同的动作空间。因此，当你试图在这些不同的任务上训练策略时，会出现一些需要考虑的问题。现在，我们将看到一个关键的想法，即在许多情况下，你只需像平常一样进行强化学习，但要根据你想要学习的任务进行条件化。","start":1731.42,"end":1761.04},{"id":228,"text":"So you're then going to be learning a policy that is not just conditioned on the state, but it's also conditioned on the state and also the tasks that you want it to be performing for that state.","zh":"因此，你将学习一个策略，它不仅根据状态进行条件化，而且也根据状态和你希望它在该状态下执行的任务进行条件化。","start":1761.61,"end":1779.77},{"id":229,"text":"So, if we kind of go back to a lot of the topics that we've talked about in the course so far, like imitation learning, on-policy and off-policy RL, offline RL, model-based RL, reward functions, a big topic that's recurred in many of these lectures is talking about data efficiency. Like, how much data do we need to be able to calculate a gradient that is accurate?","zh":"因此，如果我们回顾到目前为止课程中讨论的许多主题，比如模仿学习、在策略和离策略强化学习、离线强化学习、基于模型的强化学习、奖励函数，一个在许多讲座中反复出现的重要主题是谈论数据效率。例如，我们需要多少数据才能计算出一个准确的梯度？","start":1781.28,"end":1805.4},{"id":230,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios.","zh":"我们的最终目标是训练一个能够同时处理多个任务的模型，通过在不同任务和不同场景上训练该策略，我们可以实际上将学习任何一个任务的复杂性进行 amortization（即摊销）。","start":1809.16,"end":1822.84},{"id":231,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios.","zh":"我们的最终目标是训练一个能够同时处理多个任务的模型，通过在不同任务和不同场景上训练该策略，我们可以实际上将学习任何一个任务的复杂性进行 amortization（即摊销）。","start":1823.98,"end":1842.2},{"id":232,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things.","zh":"例如，如果你试图成为一个语言模型助手，那么在语法或不同网站之间会有共享的结构。如果你学会了如何与一个网站互动，这将教会你如何与其它网站互动。或者像机器人一样，如果你的目标是能够向前走和向后走，那么保持平衡的这一共享概念将在任务之间共享，还有其它方面。","start":1843.08,"end":1868.32},{"id":233,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things.","zh":"比如，如果你试图成为一个语言模型助手，那么在语法或者不同网站之间会有共享的结构。如果你学会了如何与一个网站互动，这可能会教会你如何与其它网站互动。或者像机器人一样，如果你的目标是能够向前和向后行走，那么保持平衡的这一共有概念将在各项任务之间共享，还有其它类似的情况。","start":1870.54,"end":1896.92}],"notes":["本段介绍了多任务强化学习的基本概念，即在不同任务之间训练策略时，需要考虑任务间的差异和共享结构。讲者提到，策略不仅需要依赖状态，还需要依赖任务，这为后续的多任务学习奠定了基础。","讲者强调了数据效率的重要性，指出多任务学习可以提升数据效率，因为任务之间通常存在共享结构。这种共享结构使得在训练多个任务时，可以减少每个任务所需的训练数据。","通过语言模型助手和机器人行走的例子，讲者说明了任务间共享结构的具体表现。例如，语言模型在不同网站上的交互方式可能有相似之处，而机器人在行走和后退任务中需要保持平衡的共性。","讲者还提到，多任务学习可以用于个性化推荐系统，因为不同用户之间可能存在相似性。学习一个用户的推荐策略可以迁移到其他用户，从而提升整体的推荐效果。","最后，讲者指出，多任务学习的深层动机在于构建通用系统，而不是单一任务系统。这种通用系统可以通过共享结构和迁移学习来实现更高效的训练。","讲者通过多个实际例子，如语言模型、机器人和推荐系统，说明了多任务学习在不同领域的应用，强调了其在提升数据效率和泛化能力方面的潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1731.42,"end":1896.92,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1731.42,"text":"or the dynamics of different people. They might have different action spaces even. And so when you're trying to train policies across these different tasks, there's some considerations that come up when you try to do that. Now, the key idea that we'll see is that you can, in many cases, just go about normal reinforcement learning, but condition on the task that you're trying to learn."},{"start":1761.61,"text":"So you're then going to be learning a policy that is not just conditioned on the state, but it's also conditioned on the state and also the tasks that you want it to be performing for that state. Now, why do we care about multitask reinforcement learning?"},{"start":1781.28,"text":"So, if we kind of go back to a lot of the topics that we've talked about in the course so far, like imitation learning, on-policy and off-policy RL, offline RL, model-based RL, reward functions, a big topic that's recurred in many of these lectures is talking about data efficiency. Like, how much data do we need to be able to calculate a gradient that is accurate?"},{"start":1809.16,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios."},{"start":1823.98,"text":"So it could actually be a boost for data efficiency in the sense that the data efficiency for training any one task will be lower when you're actually trying to train everything together. And that's because tasks typically will have some sort of shared structure."},{"start":1843.08,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things."},{"start":1870.54,"text":"If you're trying to develop a recommender system that's personalized to different users, then some users will share a lot of similarities, where if you try to learn to be a great recommender for one person, then you should also, there are other people that you could also probably be a great recommender for. And then there's also a slightly deeper motivation as well, which is that when we actually try to chain these generalist systems rather than systems that do one task,"}],"speech_gaps":[],"frame":"../frames/v022/011.webp","frame_time":1743.42},{"title":"多任务强化学习中的任务定义与示例","segments":[{"id":234,"text":"we often find that generalist systems end up being more reliable and more performant than if we were to just train on one task. And so I think that this is kind of a pretty cool finding that has kind of empirically been true in recent years in AI. And so it's extra motivation for not just training kind of something for one particular task or problem or user. Let's maybe get into what this actually entails. And we actually need to think about what...","zh":"我们经常发现，通用系统最终比只在一个任务上进行训练的系统更加可靠和表现更好。因此，我认为这是一个相当有趣的发现，在近年来的AI研究中，这一现象在实证上已经被证实。因此，这进一步激励我们不要仅仅为一个特定的任务或问题或用户训练模型。也许我们该深入探讨这实际上意味着什么。我们实际上需要思考的是……","start":1897.57,"end":1925.54},{"id":235,"text":"How do we think about what a task is? It's actually not, in some ways, not very well defined, like what makes something a different task versus not a different task. But one way to think about it is having different tasks just be different RL problems, different Markov decision processes. And so each task will have a state space, an action space, an initial state distribution, a transition model, and a reward function.","zh":"我们该如何理解什么是任务？从某种意义上说，这个概念并不是非常明确，比如什么使得一个事物成为不同的任务，而不是不同的任务。但一种思考方式是将不同的任务视为不同的强化学习问题，不同的马尔可夫决策过程。因此，每个任务都会有一个状态空间、一个动作空间、一个初始状态分布、一个转移模型和一个奖励函数。","start":1926.59,"end":1954.16},{"id":236,"text":"And I'm indexing these with index i to denote that this is the state space for task i, this is the action space for task i, the dynamics and reward for task i, and so forth. Now, with this definition, it's worth mentioning that when we think of the notion of a task, there's a meaning under the English word of task.","zh":"我用索引 i 来标记这些内容，表示这是任务 i 的状态空间，这是任务 i 的动作空间，这是任务 i 的动态和奖励函数，等等。现在，根据这个定义，值得一提的是，当我们思考任务的概念时，它在英文单词“任务”中的含义也有其特定的意义。","start":1956.35,"end":1982.37},{"id":237,"text":"And this notion of a task being an MPP is actually potentially quite different from that semantic notion of a task, where you could actually have different tasks that have potentially the same reward function and only have different dynamics. For example, if you're trying to walk forward on grass versus trying to walk forward on flat terrain.","zh":"将任务视为马尔可夫决策过程（MDP）这一概念，实际上可能与语义上“任务”的含义存在相当大的差异。在这种情况下，你可能会有不同任务具有相同的奖励函数，但只有不同的动态。例如，如果你试图在草地上向前行走，与试图在平坦地形上向前行走，这可能会被视为在这个框架下的两个不同任务，尽管它们都是“向前行走”的任务。","start":1983.97,"end":2008.69},{"id":238,"text":"then that potentially could be considered two different tasks under this framework, even though they're both kind of the task of walking forward. Okay, so a few examples of like kind of multitask problems that we might think about. One is this kind of personalized recommendation problem that I mentioned. In this case, different tasks would be different users or different people.","zh":"因此，我们可以考虑一些多任务问题的例子。一个是之前提到的个性化推荐问题。在这种情况下，不同的任务可以是不同的用户或不同的人。","start":2009.8,"end":2033.91},{"id":239,"text":"Different people might have different reward functions. If it's music recommendation, someone might really love rock music, another person really might love hip-hop music. Also, the dynamics with regard to how often they even listen to music and so forth might also change across users.","zh":"不同的人可能会有不同的奖励函数。如果是音乐推荐，有些人可能非常喜爱摇滚音乐，而另一些人则可能非常喜爱嘻哈音乐。此外，他们听音乐的频率等动态因素也可能因用户而异。","start":2035.31,"end":2058.89}],"notes":["本段讨论了多任务强化学习中任务的定义，指出任务可以被视为不同的马尔可夫决策过程（MDP），每个任务包含状态空间、动作空间、初始状态分布、转移模型和奖励函数。讲者强调，任务的定义在语义上可能与形式化定义存在差异，例如，两个任务可能具有相同的奖励函数但不同的动态模型。","讲者通过行走的例子说明，即使两个任务的目标相同（如向前行走），如果它们的动态模型不同（如草地与平坦地形），也可以被视为不同的任务。这表明任务的区分不仅基于目标，还基于环境动态。","讲者进一步举例说明多任务问题，如个性化推荐系统，其中不同用户可能具有不同的奖励函数和动态模型。例如，一个用户可能更喜欢摇滚音乐，而另一个用户则更喜欢嘻哈音乐，这导致推荐系统需要适应不同用户的偏好。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1897.57,"end":2058.89,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1897.57,"text":"we often find that generalist systems end up being more reliable and more performant than if we were to just train on one task. And so I think that this is kind of a pretty cool finding that has kind of empirically been true in recent years in AI. And so it's extra motivation for not just training kind of something for one particular task or problem or user. Let's maybe get into what this actually entails. And we actually need to think about what..."},{"start":1926.59,"text":"How do we think about what a task is? It's actually not, in some ways, not very well defined, like what makes something a different task versus not a different task. But one way to think about it is having different tasks just be different RL problems, different Markov decision processes. And so each task will have a state space, an action space, an initial state distribution, a transition model, and a reward function."},{"start":1956.35,"text":"And I'm indexing these with index i to denote that this is the state space for task i, this is the action space for task i, the dynamics and reward for task i, and so forth. Now, with this definition, it's worth mentioning that when we think of the notion of a task, there's a meaning under the English word of task."},{"start":1983.97,"text":"And this notion of a task being an MPP is actually potentially quite different from that semantic notion of a task, where you could actually have different tasks that have potentially the same reward function and only have different dynamics. For example, if you're trying to walk forward on grass versus trying to walk forward on flat terrain."},{"start":2009.8,"text":"then that potentially could be considered two different tasks under this framework, even though they're both kind of the task of walking forward. Okay, so a few examples of like kind of multitask problems that we might think about. One is this kind of personalized recommendation problem that I mentioned. In this case, different tasks would be different users or different people."},{"start":2035.31,"text":"Different people might have different reward functions. If it's music recommendation, someone might really love rock music, another person really might love hip-hop music. Also, the dynamics with regard to how often they even listen to music and so forth might also change across users."}],"speech_gaps":[],"frame":"../frames/v022/012.webp","frame_time":1909.57},{"title":"多任务强化学习中的任务差异与变化因素","segments":[{"id":240,"text":"Reinforcement learning has often actually, this is an application we haven't really talked about, but it's often used in character animation in order to actually create animations of different kinds of characters, like people or other animated characters that appear in movies.","zh":"强化学习在很多时候实际上，这是一个我们尚未真正讨论过的应用，但它经常用于角色动画中，以实际创建不同种类角色的动画，例如人物或其他出现在电影中的动画角色。","start":2061.67,"end":2079.75},{"id":241,"text":"And you might want to learn, like, allow and be able to animate a character to do lots of different maneuvers. So you might want to be able to have your character be able to do a backflip or to be able to run or be able to do a cartwheel. And each of these would be different tasks. Does anyone have thoughts for these tasks? What is the thing that would vary across tasks versus be fixed across tasks?","zh":"你可能希望学习，比如允许并能够对角色进行各种不同的动作动画。因此，你可能希望你的角色能够完成后空翻、跑步或完成侧手翻等动作。而每一个动作都代表不同的任务。有人对这些任务有什么想法吗？什么会在任务之间变化，而什么会在任务之间保持不变？","start":2080.87,"end":2104.18},{"id":242,"text":"Yeah, so in this scenario, the reward will vary because in one case you want it to run, in another case you want it to do a cartwheel, and the dynamics or the physics of the simulator will stay the same. Cool. There's also been works that's trying to do character animation involving different garments, so a character that can put on a shirt versus a long-sleeve shirt versus a dress.","zh":"是的，在这种情况下，奖励会变化，因为在一种情况下你希望它跑步，在另一种情况下你希望它完成侧手翻，而模拟器的动态或物理特性将保持不变。很好。也有研究尝试进行涉及不同服装的角色动画，例如一个角色能够穿上衬衫、长袖衬衫或连衣裙。","start":2104.94,"end":2133.18},{"id":243,"text":"Does anyone have thoughts on what would vary across these tasks? Yeah, so the policy might vary. The policy will also vary actually in all of these cases for different tasks. Yeah, so the physics of how a long-sleeve shirt versus a short-sleeve shirt will behave, it will vary across tasks. I think I also put the initial state distribution might also vary, whereas in the first example, maybe the initial state is always to start standing up, for example.","zh":"有人对这些任务之间什么会变化有什么想法吗？是的，策略可能会变化。实际上，在所有这些情况下，策略会随着不同任务而变化。是的，长袖衬衫与短袖衬衫在物理行为上的差异会在任务之间变化。我认为初始状态分布也可能变化，而在第一个例子中，初始状态可能始终是站立的，例如。","start":2133.93,"end":2160.5},{"id":244,"text":"Whereas here, you have different garments in the initial state. And then the last example I put is maybe different tasks are controlling different robot arms. And maybe one robot arm looks like this with maybe four degrees of freedom. This one is six degrees of freedom. This one is seven degrees of freedom. Does anyone have thoughts on what would vary across tasks?","zh":"而在这种情况下，初始状态会有不同的服装。我最后举的例子可能是不同的任务控制不同的机器人手臂。也许一个机器人手臂看起来像这样，具有四自由度。这个有六自由度。这个有七自由度。有人对这些任务之间什么会变化有什么想法吗？","start":2161.33,"end":2183.26},{"id":245,"text":"If one task is to control the first robot to grasp an object, the second task is to control the second robot to grasp an object, and so forth. Yeah, so the actions themselves, so you'll have different dimensions of actions. Yeah, so the dynamics will also be different, because when you move one joint, that will affect the other joints differently.","zh":"如果一个任务是控制第一个机器人抓取物体，第二个任务是控制第二个机器人抓取物体，依此类推。是的，所以动作本身就会有不同的维度。是的，动态也会不同，因为当你移动一个关节时，这会以不同的方式影响其他关节。","start":2184.01,"end":2203.1},{"id":246,"text":"Yeah, so the states would also vary as well. So how you represent the arm, that will be a different dimension. What the actions even are will also be different dimensional. And then the dynamics will also vary quite a bit as well because how your actions affect the robot arm are going to change.","zh":"是的，状态也会有所不同。所以你如何表示机械臂，这将是一个不同的维度。动作本身甚至也会有不同的维度。然后动态也会有很大差异，因为你的动作如何影响机械臂将会发生变化。","start":2204.17,"end":2234.47}],"notes":["本段讨论了多任务强化学习中的任务差异，强调了不同任务中奖励函数、策略、初始状态分布、动作空间、状态表示和动力学模型的变化。这些变化是多任务学习中需要考虑的关键因素。","在动画任务中，奖励函数会根据任务目标（如跑步、空翻）而变化，但模拟器的物理动力学保持不变。这表明任务之间的共享部分（如物理模型）可以被复用，而任务特定部分（如奖励）需要单独设计。","在服装任务中，初始状态分布可能因服装类型（如长袖衬衫、短袖衬衫、连衣裙）而变化，这说明初始状态是任务变化的一个因素。同时，策略也会因任务不同而变化，因为不同服装的物理行为不同。","在机器人手臂任务中，不同手臂的自由度（如4、6、7个）导致动作空间和状态表示的维度不同。这表明任务之间的动作空间和状态表示可能完全不同，需要针对每个任务进行适配。","动力学模型的变化是由于不同手臂的结构差异，移动一个关节会影响其他关节的方式不同。这说明动力学模型是任务变化的重要因素，需要针对每个任务进行建模。","这些例子展示了多任务强化学习的典型应用场景，包括动画、服装和机器人控制。每个任务都有其独特的变化因素，需要在设计多任务学习框架时加以考虑。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2061.67,"end":2234.47,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2061.67,"text":"Reinforcement learning has often actually, this is an application we haven't really talked about, but it's often used in character animation in order to actually create animations of different kinds of characters, like people or other animated characters that appear in movies."},{"start":2080.87,"text":"And you might want to learn, like, allow and be able to animate a character to do lots of different maneuvers. So you might want to be able to have your character be able to do a backflip or to be able to run or be able to do a cartwheel. And each of these would be different tasks. Does anyone have thoughts for these tasks? What is the thing that would vary across tasks versus be fixed across tasks?"},{"start":2104.94,"text":"Yeah, so in this scenario, the reward will vary because in one case you want it to run, in another case you want it to do a cartwheel, and the dynamics or the physics of the simulator will stay the same. Cool. There's also been works that's trying to do character animation involving different garments, so a character that can put on a shirt versus a long-sleeve shirt versus a dress."},{"start":2133.93,"text":"Does anyone have thoughts on what would vary across these tasks? Yeah, so the policy might vary. The policy will also vary actually in all of these cases for different tasks. Yeah, so the physics of how a long-sleeve shirt versus a short-sleeve shirt will behave, it will vary across tasks. I think I also put the initial state distribution might also vary, whereas in the first example, maybe the initial state is always to start standing up, for example."},{"start":2161.33,"text":"Whereas here, you have different garments in the initial state. And then the last example I put is maybe different tasks are controlling different robot arms. And maybe one robot arm looks like this with maybe four degrees of freedom. This one is six degrees of freedom. This one is seven degrees of freedom. Does anyone have thoughts on what would vary across tasks?"},{"start":2184.01,"text":"If one task is to control the first robot to grasp an object, the second task is to control the second robot to grasp an object, and so forth. Yeah, so the actions themselves, so you'll have different dimensions of actions. Yeah, so the dynamics will also be different, because when you move one joint, that will affect the other joints differently."},{"start":2204.17,"text":"Yeah, so the states would also vary as well. So how you represent the arm, that will be a different dimension. What the actions even are will also be different dimensional. And then the dynamics will also vary quite a bit as well because how your actions affect the robot arm are going to change. Cool. So those are the examples of different problems where we might want to be kind of training different tasks."}],"speech_gaps":[],"frame":"../frames/v022/013.webp","frame_time":2073.67},{"title":"多任务强化学习中的任务标识与状态扩展","segments":[{"id":247,"text":"The last thing that we're kind of missing here is we need to figure out how to identify one task from another task so that we can tell our policy what task it should be doing at a given point. And one way to do this is to just assign an index. You could say, like, this robot is task zero, this robot is task one, this robot is task two, and so forth.","zh":"我们目前还缺少的最后一项内容是，我们需要弄清楚如何区分不同的任务，以便告诉我们的策略在某个时刻应该执行哪个任务。一种方法就是简单地分配一个索引。你可以这样说，比如，这个机器人是任务零，这个机器人是任务一，这个机器人是任务二，依此类推。","start":2235.92,"end":2260.5},{"id":248,"text":"If you don't have any other kind of better way to identify a task, this is kind of what you resort to. You could also have a language description of the task.","zh":"如果你没有其他更好的方法来标识任务，这就是你通常会采取的方法。你也可以用语言描述来描述任务。","start":2262.27,"end":2272.04},{"id":249,"text":"You could have a video illustration of what the task is. There's actually a number of ways to be creative with how you describe the task to the policy. And we'll refer to each of these as different task identifiers. So the task identifier for the task of... We'll see some examples on the next slide. Now, once you have the task identifier, an alternative view on the multitask RL problem...","zh":"你也可以用视频示例来展示任务是什么。实际上，有很多创意的方式来向策略描述任务。我们将这些不同的描述方式称为不同的任务标识符。因此，对于某个任务的任务标识符，我们将在下一张幻灯片上看到一些例子。现在，一旦你有了任务标识符，对多任务强化学习问题的另一种看法是……","start":2273.56,"end":2302.96},{"id":250,"text":"is simply just having the task identifier be part of the state where we're writing sbar as the original state. And what this means is that before we had a kind of a collection of MDPs, that's kind of what's written at the top. And we can actually construct a single MDP that actually covers,","zh":"仅仅是将任务标识符作为状态的一部分，我们将 sbar 定义为原始状态。这意味着我们之前有一组 MDPs，这就是顶部所写的。实际上，我们可以构造一个单一的 MDP 来覆盖，","start":2303.56,"end":2334.75},{"id":251,"text":"We have, for example, the PI of the initial state, PI of S prime given SA, and RI of SA. And this is the dynamics and the reward for each task.","zh":"例如，我们有初始状态的 PI，给定 SA 的 S prime 的 PI，以及 SA 的 RI。这是每个任务的动力学和奖励。","start":2335.37,"end":2358.5},{"id":252,"text":"We can kind of think of it as like our goal is to solve all of the MDPs for each of the tasks. But we can also think about it as just a single MDP where the state is now defined as like, maybe this is like the original state space of these tasks. And the state is now defined as like the original state space.","zh":"我们可以将其视为我们的目标是解决每个任务的 MDPs。但也可以将其视为一个单一的 MDP，其中状态现在被定义为，也许这是这些任务的原始状态空间。状态现在被定义为原始状态空间。","start":2362.91,"end":2388.92}],"notes":["本段讲解了多任务强化学习中如何通过任务标识符来区分不同任务，并将任务标识符整合到状态空间中，从而构建一个统一的MDP。讲者提到，任务标识符可以是索引、语言描述或视频示例，这些都属于不同的任务标识方式。通过将任务标识符作为状态的一部分，可以将多个任务整合为一个统一的MDP，从而简化问题。","讲者进一步说明，整合后的MDP包含初始状态的转移概率PI、状态转移PI(S' | S, A)和奖励函数RI(S, A)，这些构成了每个任务的动力学和奖励结构。这种统一的MDP框架允许算法同时处理多个任务，而无需为每个任务单独训练策略。","讲者指出，虽然可以将多个任务视为独立的MDP进行求解，但通过整合任务标识符到状态中，可以将问题转化为一个单一的MDP，从而更高效地进行策略优化。这种统一的视角有助于在不同任务之间共享策略知识，提高学习效率。","讲者提到，整合后的状态空间是原始任务状态空间的扩展，其中任务标识符作为状态的一部分。这种设计使得策略能够根据当前任务标识符动态调整行为，从而适应不同的任务需求。","讲者强调，这种统一的MDP框架不仅适用于多任务强化学习，还可以用于其他需要处理多个相关任务的场景。通过将任务标识符整合到状态中，可以更灵活地处理任务间的共性和差异。","讲者最后指出，虽然整合后的MDP框架提供了统一的视角，但实际应用中仍需考虑任务间的差异性和任务标识符的准确性。因此，任务标识符的设计和选择对于多任务强化学习的成功至关重要。"],"formulas":[],"uncertainties":["PI of the initial state"],"diagram":"none","start":2235.92,"end":2388.92,"asr_flags":[],"math_clarifications":["提供的公式与上下文中的内容无直接关联，原始文本中未提及具体的数学公式，因此无法核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2235.92,"text":"The last thing that we're kind of missing here is we need to figure out how to identify one task from another task so that we can tell our policy what task it should be doing at a given point. And one way to do this is to just assign an index. You could say, like, this robot is task zero, this robot is task one, this robot is task two, and so forth."},{"start":2262.27,"text":"If you don't have any other kind of better way to identify a task, this is kind of what you resort to. You could also have a language description of the task."},{"start":2273.56,"text":"You could have a video illustration of what the task is. There's actually a number of ways to be creative with how you describe the task to the policy. And we'll refer to each of these as different task identifiers. So the task identifier for the task of... We'll see some examples on the next slide. Now, once you have the task identifier, an alternative view on the multitask RL problem..."},{"start":2303.56,"text":"is simply just having the task identifier be part of the state where we're writing sbar as the original state. And what this means is that before we had a kind of a collection of MDPs, that's kind of what's written at the top. And we can actually construct a single MDP that actually covers,"},{"start":2335.37,"text":"all of the tasks. So we have, for example, the PI of the initial state, PI of S prime given SA, and RI of SA. And this is the dynamics and the reward for each task."},{"start":2362.91,"text":"We can kind of think of it as like our goal is to solve all of the MDPs for each of the tasks. But we can also think about it as just a single MDP where the state is now defined as like, maybe this is like the original state space of these tasks. And the state is now defined as like the original state space."}],"speech_gaps":[],"frame":"../frames/v022/014.webp","frame_time":2247.92},{"title":"多任务强化学习中的任务标识与奖励函数","segments":[{"id":253,"text":"and the task identifier for that task. And then the reward function, for example, in this modified MDP, that's just a single MDP for all the tasks, is then going to be equal to, let's say, just to be explicit, the reward for this state and this action","zh":"以及该任务的任务标识符。然后奖励函数，例如在这个修改后的马尔可夫决策过程（MDP）中，这只是一个适用于所有任务的单一MDP，那么它将等于，比如说，为了明确起见，该状态和该动作的奖励","start":2390.88,"end":2420.46},{"id":254,"text":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi.","zh":"将等于ri of s bar a。同样，你也可以为动态部分写出类似的内容，其中给定任务的聚合MDP，s prime给定s bar zi。","start":2421.08,"end":2448.69},{"id":255,"text":"comma A is equal to the kind of dynamics for that task. This gets a little bit more complicated if your tasks have different state spaces and action spaces.","zh":"逗号A等于该任务的动力学。如果你的任务具有不同的状态空间和动作空间，情况会变得更加复杂。","start":2449.84,"end":2462.57},{"id":256,"text":"And so you'd have to, if they have, for example, different dimensionalities, then you need to think about how you would represent this state space in the MDP. If they have the same state space and action space, you can basically construct this aggregated Markov decision process with these equations here.","zh":"因此，如果你的任务具有不同的维度，那么你需要考虑如何在MDP中表示这个状态空间。如果它们具有相同的状态空间和动作空间，你基本上可以使用这里的方程构建这个聚合的马尔可夫决策过程。","start":2464.79,"end":2487.4},{"id":257,"text":"kind of what we think of as the single task reinforcement learning setting that we've talked about so far, we can then kind of think about multitask RL, but where the task identifier is part of the state, where the task identifier could be the task, like an index, a language description. It could also be some desired goal state as well that you want to reach. This is often referred to as goal-conditioned RL. But then once you do this, you're basically getting","zh":"我们所认为的单任务强化学习设置，我们之前已经讨论过，那么我们可以将多任务强化学习视为其中任务标识符是状态的一部分，任务标识符可以是任务的索引、语言描述。它也可以是希望达到的某个目标状态。这通常被称为目标条件强化学习。但一旦你这样做，你基本上就得到了","start":2489.81,"end":2515.71},{"id":258,"text":"a modified MVP that covers each of these tasks. Now, in terms of the reward, like we talked about on the board, it's basically going to be the same as before. In this special case of goal-conditioned reinforcement learning, where you're trying to reach a goal, then oftentimes you'll think about the reward as some negative distance between the state that you're currently at and the goal state.","zh":"一个覆盖所有这些任务的修改后的MDP。在奖励方面，就像我们在黑板上讨论的那样，基本上和之前是一样的。在这个目标条件强化学习的特殊情况下，当你试图达到一个目标时，通常会将奖励视为当前状态与目标状态之间某种负距离。","start":2517.41,"end":2546.91}],"notes":["本段讲解了多任务强化学习（Multi-Task RL）中任务标识符与奖励函数的设计。任务标识符可以是任务的索引、语言描述或目标状态，这使得任务可以被整合到一个统一的MDP中。当任务具有不同的状态空间和动作空间时，需要考虑如何表示这些状态空间，这增加了问题的复杂性。","在任务标识符作为状态的一部分的情况下，可以构建一个聚合的马尔可夫决策过程（Aggregated MDP），其中状态和动作的转移概率需要根据任务进行调整。这种设计被称为目标条件强化学习（Goal-conditioned RL），其中奖励函数通常基于当前状态与目标状态之间的距离来定义。","在目标条件强化学习中，奖励函数通常被设计为当前状态与目标状态之间的负距离，这鼓励智能体朝着目标状态移动。这种设计使得多任务学习能够覆盖多个任务，而无需为每个任务单独设计一个MDP。","当任务具有相同的状态空间和动作空间时，可以使用相同的方程构建聚合的MDP，这简化了多任务学习的实现。然而，当任务具有不同的状态空间和动作空间时，需要考虑如何表示这些状态空间，这可能涉及更复杂的表示方法。","在目标条件强化学习中，任务标识符可以是目标状态，这使得智能体能够学习如何达到不同的目标。这种设计允许智能体在多个任务之间进行迁移学习，从而提高学习效率。"],"formulas":[{"latex":"r(s, a) = r_i(s, a)","symbols":"奖励函数","explanation":"奖励函数 $ r(s, a) $ 被定义为任务特定的奖励函数 $ r_i(s, a) $，适用于特定任务 $ i $。","evidence":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi."},{"latex":"s' = T(s, a)","symbols":"状态转移函数","explanation":"状态转移函数 $ T(s, a) $ 表示在状态 $ s $ 执行动作 $ a $ 后转移到的新状态 $ s' $。","evidence":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi."},{"latex":"r(s, a) = -d(s, g)","symbols":"奖励函数","explanation":"在目标条件强化学习中，奖励函数 $ r(s, a) $ 被定义为当前状态 $ s $ 与目标状态 $ g $ 之间的距离的负值，即 $ -d(s, g) $。","evidence":"a modified MVP that covers each of these tasks. Now, in terms of the reward, like we talked about on the board, it's basically going to be the same as before. In this special case of goal-conditioned reinforcement learning, where you're trying to reach a goal, then oftentimes you'll think about the reward as some negative distance between the state that you're currently at and the goal state."}],"uncertainties":["s bar zi"],"diagram":"none","start":2390.88,"end":2546.91,"asr_flags":[],"math_clarifications":["公式 $ r(s, a) = r_i(s, a) $ 表示任务特定的奖励函数，适用于特定任务 $ i $。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2390.88,"text":"and the task identifier for that task. And then the reward function, for example, in this modified MDP, that's just a single MDP for all the tasks, is then going to be equal to, let's say, just to be explicit, the reward for this state and this action"},{"start":2421.08,"text":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi."},{"start":2449.84,"text":"comma A is equal to the kind of dynamics for that task. This gets a little bit more complicated if your tasks have different state spaces and action spaces."},{"start":2464.79,"text":"And so you'd have to, if they have, for example, different dimensionalities, then you need to think about how you would represent this state space in the MDP. If they have the same state space and action space, you can basically construct this aggregated Markov decision process with these equations here. Now, if we go back to kind of..."},{"start":2489.81,"text":"kind of what we think of as the single task reinforcement learning setting that we've talked about so far, we can then kind of think about multitask RL, but where the task identifier is part of the state, where the task identifier could be the task, like an index, a language description. It could also be some desired goal state as well that you want to reach. This is often referred to as goal-conditioned RL. But then once you do this, you're basically getting"},{"start":2517.41,"text":"a modified MVP that covers each of these tasks. Now, in terms of the reward, like we talked about on the board, it's basically going to be the same as before. In this special case of goal-conditioned reinforcement learning, where you're trying to reach a goal, then oftentimes you'll think about the reward as some negative distance between the state that you're currently at and the goal state."}],"speech_gaps":[],"frame":"../frames/v022/015.webp","frame_time":2402.88},{"title":"多任务强化学习中的任务表示与结构利用","segments":[{"id":259,"text":"And distance functions could be Euclidean, it could be a sparse 0, 1, and so forth. So we still get kind of a standard Markov decision process when we aggregate, when we kind of bring these tasks together. And you might ask, if we can get this standard Markov decision process that now has a task identifier, like a task string, as part of the state space, then why not apply kind of standard reinforcement learning algorithms to them? And the answer is you can.","zh":"距离函数可以是欧几里得距离，也可以是稀疏的0, 1，等等。因此，当我们聚合这些任务，或者将它们结合起来时，我们仍然可以得到一种标准的马尔可夫决策过程。你可能会问，如果我们能够得到一个包含任务标识符（例如任务字符串）作为状态空间一部分的标准马尔可夫决策过程，那么为什么不直接应用标准的强化学习算法呢？答案是你可以这样做。","start":2550.95,"end":2579.46},{"id":260,"text":"And in many cases, this is a great way to approach scenarios where you want to learn multiple tasks.","zh":"在许多情况下，这种方法是处理你想要学习多个任务的场景的一种很好的方法。","start":2581.04,"end":2588.9},{"id":261,"text":"But the reason why I'm bringing all this up is that in some cases you can actually do better by leveraging the kind of known structure between different tasks. And goal conditioned RL is one of those cases where you're trying to reach different goals. And in the kind of next few slides, we'll talk about one particular way that you can do a lot better by leveraging this fact that you know that this MDP consists of these different tasks that you're trying to do.","zh":"但我要提出这些内容的原因是，在某些情况下，你可以通过利用不同任务之间的已知结构来实现更好的效果。目标条件强化学习就是这种情况之一，你试图达到不同的目标。在接下来的几张幻灯片中，我们将讨论一种特定的方法，通过利用你已知这个马尔可夫决策过程由你想要完成的不同任务组成这一事实，从而实现显著的提升。","start":2589.99,"end":2618.31},{"id":262,"text":"Yeah, Euclidean L2, that's just mean squared error. Yeah, so the question is, if different people are different tasks, then is there a better way to represent different people than a one-hot? When I say one-hot, by the way, I mean kind of a vector like this, where if you're going to represent the number two, you use a one-hot vector.","zh":"是的，欧几里得L2距离，这其实就是均方误差。所以问题是，如果不同的任务对应不同的人，那么有没有比使用one-hot编码更好的方式来表示不同的人？顺便说一下，我所说的one-hot编码是指像这样的向量，如果你要表示数字2，你会使用一个one-hot向量。","start":2619.26,"end":2641.04},{"id":263,"text":"So yeah, there are definitely better ways than just this. This is actually fairly common in a lot of reinforcement learning methods. But for example, one thing you could do is you could try to get a language description of the person or their preferences. You could also...","zh":"是的，确实存在比这更好的方法。实际上，这种方法在很多强化学习方法中都很常见。例如，你可以尝试获取一个人的语言描述或他们的偏好。你也可以……","start":2642.49,"end":2661.83},{"id":264,"text":"This gets into stuff that we'll talk about next week, but you could also use some examples of things that they like and don't like as part of the task descriptor as well. So you get something more like in-context learning in that case where DI actually might contain some data about the task. So yeah, there are some better examples like that.","zh":"这涉及到我们下周将讨论的内容，但你也可以将他们喜欢和不喜欢的事物的一些例子作为任务描述的一部分。在这种情况下，你会得到类似上下文学习的东西，其中DI实际上可能包含一些关于任务的数据。是的，有一些更好的例子像这样。","start":2662.94,"end":2692.61},{"id":265,"text":"And in the multitask imitation learning setting, we can think of it as if we have different tasks I, if the number of tasks I is like a relatively small number, then you can basically think of it as having some set of demonstrations that are demonstration trajectories for each task.","zh":"在多任务模仿学习的设置中，我们可以将其视为拥有不同的任务I，如果任务的数量I是一个相对较小的数字，那么你可以基本上将其视为每个任务都有一个演示轨迹的演示集合。","start":2693.16,"end":2716.98}],"notes":["本段讨论了多任务强化学习中任务表示的问题，特别是如何用更有效的表示方式替代传统的one-hot编码。讲者提到，虽然one-hot编码是常见做法，但存在更优的表示方法，例如使用语言描述或用户偏好信息，以及利用示例数据来构建任务描述。","讲者指出，使用更丰富的任务描述可以提升模型性能，类似于in-context learning的机制，其中任务描述（DI）可能包含任务相关的数据。这表明任务表示的多样性对于多任务学习的重要性。","讲者提到，这些更优的表示方法将在后续课程中进一步探讨，说明当前内容为引入概念，后续将深入展开。这表明课程内容具有递进性，逐步引导学生理解更复杂的任务表示方法。","讲者强调，虽然one-hot编码是常见做法，但并非最优解，这表明在多任务强化学习中，任务表示的选择对模型性能有直接影响。因此，探索更有效的表示方式是该领域的重要研究方向。","讲者提到，任务描述可以包含用户偏好或示例数据，这表明任务表示不仅仅是静态的编码，还可以是动态的、上下文相关的。这种灵活性有助于模型更好地适应不同任务。","讲者最后提到，将进入多任务模仿学习（multitask imitation learning）的例子，说明课程内容将从理论讨论转向具体案例分析，帮助学生理解如何在实际中应用这些概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2550.95,"end":2716.98,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2550.95,"text":"And distance functions could be Euclidean, it could be a sparse 0, 1, and so forth. So we still get kind of a standard Markov decision process when we aggregate, when we kind of bring these tasks together. And you might ask, if we can get this standard Markov decision process that now has a task identifier, like a task string, as part of the state space, then why not apply kind of standard reinforcement learning algorithms to them? And the answer is you can."},{"start":2581.04,"text":"And in many cases, this is a great way to approach scenarios where you want to learn multiple tasks."},{"start":2589.99,"text":"But the reason why I'm bringing all this up is that in some cases you can actually do better by leveraging the kind of known structure between different tasks. And goal conditioned RL is one of those cases where you're trying to reach different goals. And in the kind of next few slides, we'll talk about one particular way that you can do a lot better by leveraging this fact that you know that this MDP consists of these different tasks that you're trying to do."},{"start":2619.26,"text":"Yeah, Euclidean L2, that's just mean squared error. Yeah, so the question is, if different people are different tasks, then is there a better way to represent different people than a one-hot? When I say one-hot, by the way, I mean kind of a vector like this, where if you're going to represent the number two, you use a one-hot vector."},{"start":2642.49,"text":"So yeah, there are definitely better ways than just this. This is actually fairly common in a lot of reinforcement learning methods. But for example, one thing you could do is you could try to get a language description of the person or their preferences. You could also..."},{"start":2662.94,"text":"This gets into stuff that we'll talk about next week, but you could also use some examples of things that they like and don't like as part of the task descriptor as well. So you get something more like in-context learning in that case where DI actually might contain some data about the task. So yeah, there are some better examples like that. So in terms of this problem setup, let's actually look at an example. So we're going to start with multitask imitation learning."},{"start":2693.16,"text":"And in the multitask imitation learning setting, we can think of it as if we have different tasks I, if the number of tasks I is like a relatively small number, then you can basically think of it as having some set of demonstrations that are demonstration trajectories for each task."}],"speech_gaps":[],"frame":"../frames/v022/016.webp","frame_time":2562.95},{"title":"多任务强化学习中的模仿学习策略","segments":[{"id":266,"text":"where each of these contains expert demonstrations. And then you'll have, so these are demos for task i, and this is for i equals 1 to n, if you have n different tasks. And if we were to think about how to use this data for imitation learning,","zh":"其中每个部分都包含专家演示。然后你将拥有，这些是任务i的演示，这是i等于1到n，如果你有n个不同的任务。如果我们考虑如何利用这些数据进行模仿学习，","start":2717.56,"end":2747.82},{"id":267,"text":"Kind of thinking back to the very first lecture or second lecture, we were doing imitation learning. We had this objective of minimizing the log probability of actions given states. And if we just write this as minimizing the kind of supervised loss function with respect to our policy parameters, then we want to move to the multitask setting.","zh":"回想一下我们最初或第二讲的内容，我们是在进行模仿学习。我们有一个目标，即最小化给定状态下的动作的对数概率。如果我们只是将其写成关于策略参数的监督损失函数的最小化，那么我们希望转向多任务设置。","start":2749.45,"end":2774.67},{"id":268,"text":"What we can do is we can simply try to now minimize a single set of policy parameters over the loss function averaged over all of the tasks. So this is basically like multitask imitation learning. Pretty simple, hopefully. One useful trick for this sort of approach is that if you...","zh":"我们可以做的是，现在尝试在所有任务的损失函数平均值上最小化一组策略参数。因此，这基本上就是多任务模仿学习。希望这很简单。对于这种类型的这种方法，一个有用的技巧是，如果你……","start":2775.24,"end":2805.91},{"id":269,"text":"If tasks are very different, like if one task is telling you to go forward, one task is telling you to go backwards, maybe one task is telling you to lie down, they're telling the policy to do very different things, then if you sampled one mini-batch that's mostly going forward and a different mini-batch of mostly laying down, for example, then from one gradient step to the next, you're actually going to have a lot of variance because the first mini-batch is going to tell you to do something that's pretty different from the second mini-batch.","zh":"如果任务非常不同，例如，一个任务告诉你向前走，一个任务告诉你向后走，也许还有一个任务告诉你躺下，它们告诉策略做非常不同的事情，那么如果你采样了一个主要包含向前移动的mini-batch，以及另一个主要包含躺下的mini-batch，例如，那么从一个梯度步到下一个梯度步，你实际上会有很多方差，因为第一个mini-batch会告诉你做与第二个mini-batch非常不同的事情。","start":2806.71,"end":2833.23},{"id":270,"text":"And hopefully the policy should be able to use the task identifier to differentiate the two. But in some cases, it can be a little bit tricky for the network to do that. And so one thing that's quite useful is that when you sample a mini batch, you can stratify the mini batch and ensure that each mini batch of data has data from each task.","zh":"希望策略能够利用任务标识符来区分这两个任务。但在某些情况下，网络可能有点难以做到这一点。因此，一个非常有用的方法是，当你采样一个mini-batch时，你可以分层采样该mini-batch，并确保每个mini-batch的数据都包含来自每个任务的数据。","start":2833.96,"end":2853.92},{"id":271,"text":"And if you're trying to optimize for kind of a uniform distribution over your tasks, then your minibatch would be like 1 over n of the data would be the first task, 1 over n of the minibatch would be the second task, and so forth. And this will give you gradients that are lower variance. And it can be quite useful in practice to do something like this.","zh":"如果你试图优化一个在任务上均匀分布的目标，那么你的mini-batch将像1/n的数据属于第一个任务，1/n的mini-batch属于第二个任务，依此类推。这将为你提供方差更低的梯度。在实践中，这样做可能非常有用。","start":2855.07,"end":2874.77}],"notes":["本段讨论了多任务模仿学习中如何处理不同任务之间的差异性。当任务之间差异较大时，例如一个任务要求前进，另一个任务要求后退，甚至一个任务要求躺下，这种差异会导致梯度更新过程中出现较大的方差。这是因为不同mini-batch的数据可能来自不同的任务，从而导致梯度方向不一致。","为了减少这种方差，可以采用分层抽样（stratified sampling）的方法，确保每个mini-batch中包含来自所有任务的数据。这样可以使得梯度更新更加稳定，从而提高训练效果。","在优化过程中，如果希望对所有任务进行均匀采样，那么每个任务的数据在mini-batch中的比例应为1/n，其中n是任务的总数。这种方法在实践中被证明是有效的，因为它能够降低梯度的方差，提高模型的收敛速度。","此外，本段还提到，虽然策略网络理论上应该能够通过任务标识符来区分不同任务，但在某些情况下，网络可能难以完成这一任务，因此需要通过分层抽样来辅助训练。","分层抽样是一种常见的数据增强技术，它确保了每个任务的数据在训练过程中被均匀地采样，从而避免了某些任务被过度或不足地表示的问题。","最后，本段强调了在多任务学习中，如何通过合理的数据采样策略来提高模型的泛化能力和训练效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2717.56,"end":2874.77,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2717.56,"text":"where each of these contains expert demonstrations. And then you'll have, so these are demos for task i, and this is for i equals 1 to n, if you have n different tasks. And if we were to think about how to use this data for imitation learning,"},{"start":2749.45,"text":"Kind of thinking back to the very first lecture or second lecture, we were doing imitation learning. We had this objective of minimizing the log probability of actions given states. And if we just write this as minimizing the kind of supervised loss function with respect to our policy parameters, then we want to move to the multitask setting."},{"start":2775.24,"text":"What we can do is we can simply try to now minimize a single set of policy parameters over the loss function averaged over all of the tasks. So this is basically like multitask imitation learning. Pretty simple, hopefully. One useful trick for this sort of approach is that if you..."},{"start":2806.71,"text":"If tasks are very different, like if one task is telling you to go forward, one task is telling you to go backwards, maybe one task is telling you to lie down, they're telling the policy to do very different things, then if you sampled one mini-batch that's mostly going forward and a different mini-batch of mostly laying down, for example, then from one gradient step to the next, you're actually going to have a lot of variance because the first mini-batch is going to tell you to do something that's pretty different from the second mini-batch."},{"start":2833.96,"text":"And hopefully the policy should be able to use the task identifier to differentiate the two. But in some cases, it can be a little bit tricky for the network to do that. And so one thing that's quite useful is that when you sample a mini batch, you can stratify the mini batch and ensure that each mini batch of data has data from each task."},{"start":2855.07,"text":"And if you're trying to optimize for kind of a uniform distribution over your tasks, then your minibatch would be like 1 over n of the data would be the first task, 1 over n of the minibatch would be the second task, and so forth. And this will give you gradients that are lower variance. And it can be quite useful in practice to do something like this."}],"speech_gaps":[],"frame":"../frames/v022/017.webp","frame_time":2729.56},{"title":"多任务强化学习中的输入处理与模型架构","segments":[{"id":272,"text":"Another thing that I didn't put on the slides that can also be useful is making sure that your states and actions are on similar scales across tasks. So kind of per-task normalization can also be quite useful for the learning process. Now, we've talked about training this multitask policy. And when we do that, we're going to have...","zh":"另一个我没有在幻灯片上展示但可能有用的事情是确保你的状态和动作在不同任务中处于相似的尺度上。因此，每任务的归一化也可能对学习过程非常有用。现在，我们已经讨论了训练这种多任务策略。当我们这样做时，我们将会有……","start":2875.59,"end":2901.11},{"id":273,"text":"We're now going to have a policy that takes as input some state and some task descriptor and then needs to output some action. And you might have scenarios where this is like a language string or a one-hot vector, and this is an image. And that's inherently a very multimodal problem. You have different data modalities. These are very different dimensions.","zh":"我们现在将有一个策略，它以一些状态和一些任务描述符作为输入，然后需要输出一些动作。你可能会遇到这样的场景，其中任务描述符像一个语言字符串或一个one-hot向量，而状态则是一张图像。这本质上是一个非常多模态的问题。你有不同种类的数据模态。这些是完全不同维度的。","start":2901.81,"end":2928.23},{"id":274,"text":"And so in practice, there's a question of how do you design architectures that take as input this kind of multimodal data. One example that I'll give that I kind of like because it actually uses multiple different modalities of task descriptors is this paper here where the goal is like a multitasking imitation learning system is training a robot to do some simple manipulation tasks.","zh":"因此，在实践中，有一个问题是如何设计能够接受这种多模态数据的架构。我将举一个例子，我之所以喜欢这个例子是因为它实际上使用了多种任务描述符的模态。这篇论文的目标是像一个多任务模仿学习系统，训练机器人完成一些简单的操作任务。","start":2929.03,"end":2954.03},{"id":275,"text":"And the way the architecture works, this paper is a little bit old, so it's not using a transformer. But here's the current state right here. It actually downsamples the image before passing it into the model. And then it also uses actually two different task descriptors. So it uses a language string as one task descriptor, which is put bottle in the ceramic bowl.","zh":"这篇论文的架构工作方式是这样的，这篇论文有点旧，所以它没有使用transformer。但这里就是当前的状态。它实际上在将图像输入模型之前先进行了下采样。它还使用了两种不同的任务描述符。它使用一个语言字符串作为其中一个任务描述符，例如“把瓶子放入陶瓷碗中”。","start":2955.39,"end":2976.77},{"id":276,"text":"And it also trains the model to be able to, instead of using the language, be able to use a video of how to do the task. In this case, the video is a video of a person placing the bottle in the bowl. And so you can design models that, in this case then, for the language, it would use a language encoder.","zh":"它还训练模型能够不用语言，而是使用一个演示任务如何完成的视频。在这种情况下，视频是某人将瓶子放入碗中的视频。因此，你可以设计模型，在这种情况下，对于语言，它会使用一个语言编码器。","start":2977.69,"end":2997.91},{"id":277,"text":"like kind of things that are typically used in language models. For example, transformers. And actually, I think the language encoder here did actually use a transformer. And then separately for the video, it would be using a different kind of encoder because video data looks very different. And it uses a video encoder for the second part.","zh":"像语言模型中通常使用的那些东西，例如transformer。实际上，我认为这里的语言编码器确实使用了transformer。而对视频部分，它会使用另一种类型的编码器，因为视频数据看起来非常不同。它使用一个视频编码器来处理第二部分。","start":3000.16,"end":3020.1},{"id":278,"text":"And it kind of multiplies these embeddings into different layers of the network, kind of the backbone of the network that processes the state. And then the loss function corresponds to a behavior cloning loss. And it either samples the task descriptor from the video encoder or from the language encoder. And then the whole model is trained, including these encoders, is trained using the behavior cloning loss.","zh":"它将这些嵌入乘以网络的不同层，类似于处理状态的网络骨干部分。然后损失函数对应于行为克隆损失。任务描述符要么从视频编码器中采样，要么从语言编码器中采样。然后整个模型，包括这些编码器，都是使用行为克隆损失进行训练的。","start":3021.1,"end":3052.71}],"notes":["本段主要讲解多任务强化学习中如何处理不同模态的输入数据，如语言描述和视频。讲者提到，为了处理这些不同模态的数据，需要设计能够接受多种输入的模型架构。例如，使用语言编码器和视频编码器分别处理语言和视频输入。","讲者以一个具体的论文案例说明如何设计这样的模型。该论文使用了语言字符串和视频作为任务描述符，分别通过语言编码器和视频编码器进行处理。语言编码器可能使用了Transformer模型，而视频编码器则使用了不同的编码方式。","模型的损失函数是行为克隆损失，即通过模仿专家行为来训练模型。模型在训练过程中会从语言编码器或视频编码器中采样任务描述符，并将这些描述符与状态一起输入到网络中进行处理。","讲者提到，这些嵌入向量会被乘入网络的不同层中，作为网络处理状态的主干部分。这种设计允许模型在处理不同任务时，能够有效地融合不同模态的信息。","整个模型的训练过程包括对编码器的训练，使用行为克隆损失函数进行优化。这表明模型不仅学习任务描述符的表示，还学习如何将这些描述符与状态结合，以生成合适的动作。","讲者强调了多模态输入处理的重要性，指出不同模态的数据需要不同的编码方式，并且需要设计能够融合这些信息的网络结构。这种设计有助于提高模型在多任务学习中的表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2875.59,"end":3052.71,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2875.59,"text":"Another thing that I didn't put on the slides that can also be useful is making sure that your states and actions are on similar scales across tasks. So kind of per-task normalization can also be quite useful for the learning process. Now, we've talked about training this multitask policy. And when we do that, we're going to have..."},{"start":2901.81,"text":"We're now going to have a policy that takes as input some state and some task descriptor and then needs to output some action. And you might have scenarios where this is like a language string or a one-hot vector, and this is an image. And that's inherently a very multimodal problem. You have different data modalities. These are very different dimensions."},{"start":2929.03,"text":"And so in practice, there's a question of how do you design architectures that take as input this kind of multimodal data. One example that I'll give that I kind of like because it actually uses multiple different modalities of task descriptors is this paper here where the goal is like a multitasking imitation learning system is training a robot to do some simple manipulation tasks."},{"start":2955.39,"text":"And the way the architecture works, this paper is a little bit old, so it's not using a transformer. But here's the current state right here. It actually downsamples the image before passing it into the model. And then it also uses actually two different task descriptors. So it uses a language string as one task descriptor, which is put bottle in the ceramic bowl."},{"start":2977.69,"text":"And it also trains the model to be able to, instead of using the language, be able to use a video of how to do the task. In this case, the video is a video of a person placing the bottle in the bowl. And so you can design models that, in this case then, for the language, it would use a language encoder."},{"start":3000.16,"text":"like kind of things that are typically used in language models. For example, transformers. And actually, I think the language encoder here did actually use a transformer. And then separately for the video, it would be using a different kind of encoder because video data looks very different. And it uses a video encoder for the second part. And then it kind of..."},{"start":3021.1,"text":"It kind of multiplies these embeddings into different layers of the network, kind of the backbone of the network that processes the state. And then the loss function corresponds to a behavior cloning loss. And it either samples the task descriptor from the video encoder or from the language encoder. And then the whole model is trained, including these encoders, is trained using the behavior cloning loss."}],"speech_gaps":[],"frame":"../frames/v022/018.webp","frame_time":2887.59},{"title":"多任务强化学习中的任务描述与架构","segments":[{"id":279,"text":"So this is kind of one practical example. Now, we can also look at some more modern architectures. And first off, if you have something like a language model, the task descriptor, it's very natural for it just to be a language string. And you can think of that basically just as the prompt. And so in many ways, one way to think about multitask imitation learning is basically all of the language model imitation learning or supervised fine tuning is with different prompts. You can sort of think of those as different tasks.","zh":"所以这是一个相当实际的例子。现在，我们也可以看看一些更现代的架构。首先，如果你有一个像语言模型这样的系统，任务描述符，它自然地可以只是一个语言字符串。你可以将其基本上视为提示。因此，在许多方面，一种思考多任务模仿学习的方式就是所有语言模型的模仿学习或监督微调都是通过不同的提示来实现的。你可以将这些视为不同的任务。","start":3056.27,"end":3085.05},{"id":280,"text":"And it's very easy to just pass that into a transformer. And in terms of modern policy architectures for using task strings in robotics, it's often common to also use a transformer and find ways to use image encoders, in this case, kind of pre-trained image encoders, project those into the input space of a language model, also use the task descriptor here.","zh":"将这些直接传递给一个变压器是非常容易的。在现代使用任务字符串进行机器人控制的策略架构中，通常也会使用变压器，并找到方法将图像编码器（在这种情况下是预训练的图像编码器）投影到语言模型的输入空间中，同时也在这里使用任务描述符。","start":3085.68,"end":3112.66},{"id":281,"text":"which is what should the robot do to put the eggplant in the bowl,","zh":"即机器人应该如何将茄子放入碗中，","start":3113.46,"end":3116.52},{"id":282,"text":"pass those in as tokens to a language model,","zh":"将这些作为标记传递给语言模型，","start":3116.7,"end":3119.32},{"id":283,"text":"and then output the actions and train the whole model,","zh":"然后输出动作并训练整个模型，","start":3119.52,"end":3123.18},{"id":284,"text":"including the image encoder and the text encoder and pen.","zh":"包括图像编码器、文本编码器和笔（pen）。","start":3123.32,"end":3126.96},{"id":285,"text":"So here you can view the task identifier, ZI,","zh":"在这里，你可以将任务标识符 ZI 视为模型的提示。","start":3128.96,"end":3133.82},{"id":286,"text":"as basically the prompt for the model.","zh":"基本上就是模型的提示。","start":3133.94,"end":3137.06},{"id":287,"text":"The question is, how does this compare to traditional reinforcement learning?","zh":"问题是，这与传统的强化学习相比如何？","start":3137.82,"end":3141.64},{"id":288,"text":"Um, in terms of task performance and success rate. So the, um, so like, I guess there's a","zh":"嗯，在任务表现和成功率方面。所以，嗯，所以像，我想这里有一些不同的地方。","start":3145.56,"end":3153.78},{"id":289,"text":"couple of things that are different here. We'll talk about multitask RL, um, in a bit, like right","zh":"我们稍后会讨论多任务强化学习，嗯，就在接下来的部分。嗯，然后，所以你可以进行类似提示条件的、任务标识条件的，","start":3153.78,"end":3159.14},{"id":290,"text":"after this. Uh, and then, so the, like you can do the sort of like prompt conditioning, task","zh":"无论是通过模仿学习还是强化学习。嗯，","start":3159.14,"end":3167.22},{"id":291,"text":"identifier conditioning, both with imitation learning and with reinforcement learning. Uh,","zh":"总的来说，关于模仿学习与强化学习的考虑与我们之前讨论的内容非常相似，","start":3167.22,"end":3171.04},{"id":292,"text":"Uh, and generally the considerations about imitation learning versus RL is very similar","zh":"其中，在模仿学习中，嗯，你无法使用奖励函数来改进专家数据，嗯，但它非常简单，嗯，","start":3171.04,"end":3176.3},{"id":293,"text":"to what we've discussed so far, where with imitation learning, um, you're not able to","zh":"嗯，但你无法使用奖励函数来改进专家数据，嗯，但它非常简单，嗯，","start":3176.3,"end":3180.62},{"id":294,"text":"use a reward function to improve over the expert data, uh, but it's very simple, uh,","zh":"使用奖励函数来改进专家数据，嗯，但这是非常简单的，嗯，","start":3180.62,"end":3184.54},{"id":295,"text":"and it's very easy to scale simple things to large data sets, uh, whereas RL has a lot","zh":"而且，将简单的方法扩展到大规模数据集是非常容易的，嗯，而强化学习则具有很大的潜力，并且当你有一些奖励信息并且想要优化这些奖励时，它可以提供很大的帮助","start":3184.6,"end":3189.28},{"id":296,"text":"of potential and, and it can help a lot when you have some reward information and you want","zh":"你实际上可以做得比一些提供的数据集更好","start":3189.28,"end":3194.76},{"id":297,"text":"to optimize those, uh, rewards and you can actually do a lot better than, um, than some","zh":"然后我有一些例子","start":3194.76,"end":3199.38},{"id":298,"text":"some provided data set.","zh":"关于多任务模仿学习策略可能是什么样子的","start":3199.38,"end":3201.78},{"id":299,"text":"And then I just have some examples","zh":"这些例子来自之前那两种架构，比如机器人执行的是非常简单的任务。因此，我想选择一个稍微近期的例子。在这里，任务标识符位于左上角。在这段视频中，将只有两个任务。一个是平整毛巾，一个是挂毛巾。因此，在第一部分，任务是平整毛巾。然后在这里，我们实际上是在串联多个任务","start":3202.52,"end":3204.04},{"id":300,"text":"of what kind of multitask imitation","zh":"关于多任务模仿学习策略可能是什么样子的","start":3204.04,"end":3205.92},{"id":301,"text":"learning policies might look like.","zh":"这些例子来自之前那两种架构，比如机器人执行的是非常简单的任务。因此，我想选择一个稍微近期的例子。在这里，任务标识符位于左上角。在这段视频中，将只有两个任务。一个是平整毛巾，一个是挂毛巾。因此，在第一部分，任务是平整毛巾。然后在这里，我们实际上是在串联多个任务","start":3205.92,"end":3207.56},{"id":302,"text":"The examples from those kind of two prior architectures, like the robots are doing very simple things. And so I wanted to pick something that's a bit more recent. So here the task identifier is in the top left. In this video, there'll just be two tasks. One is to flatten the towel and one is to hang the towel. And so for the first part, the task is to flatten the towel. And then here we're actually stringing together multiple tasks.","zh":"这两种先前架构的例子，比如机器人执行非常简单的任务。因此，我想选择一个稍微近期的例子。在这里，任务标识符位于左上角。在这段视频中，将只包含两个任务。一个是平整毛巾，另一个是悬挂毛巾。因此，在第一部分，任务是平整毛巾。然后在这里，我们实际上是在串联多个任务。","start":3208.76,"end":3231.78}],"notes":["本段讨论了多任务强化学习中任务描述的使用，特别是如何将任务描述作为提示传递给语言模型。任务描述可以是自然语言字符串，例如'将茄子放入碗中'，并将其作为输入传递给Transformer模型。模型会输出动作并进行训练，包括图像编码器、文本编码器和笔（可能指笔刷或工具）。","在多任务强化学习中，任务描述可以作为条件输入，用于指导模型执行不同的任务。这种做法与模仿学习和强化学习相结合，允许模型根据任务描述调整行为。","模仿学习与强化学习在任务描述的使用上有相似之处，但模仿学习无法通过奖励函数改进专家数据，而强化学习则可以利用奖励信息进行优化。","在实际应用中，任务描述可以是简单的字符串，例如'平铺毛巾'或'悬挂毛巾'，并用于指导机器人执行多个任务。这种架构允许模型在不同任务之间进行切换。","任务描述的使用使得模型能够灵活适应不同的任务需求，同时保持模型的通用性。这种架构在多任务学习中具有重要的应用价值。","在实际应用中，任务描述的输入形式可以是自然语言字符串，例如'将茄子放入碗中'，并将其作为输入传递给语言模型。模型会输出动作并进行训练，包括图像编码器、文本编码器和笔（可能指笔刷或工具）。"],"formulas":[],"uncertainties":["pen"],"diagram":"none","start":3056.27,"end":3231.78,"asr_flags":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":3056.27,"text":"So this is kind of one practical example. Now, we can also look at some more modern architectures. And first off, if you have something like a language model, the task descriptor, it's very natural for it just to be a language string. And you can think of that basically just as the prompt. And so in many ways, one way to think about multitask imitation learning is basically all of the language model imitation learning or supervised fine tuning is with different prompts. You can sort of think of those as different tasks."},{"start":3085.68,"text":"And it's very easy to just pass that into a transformer. And in terms of modern policy architectures for using task strings in robotics, it's often common to also use a transformer and find ways to use image encoders, in this case, kind of pre-trained image encoders, project those into the input space of a language model, also use the task descriptor here."},{"start":3113.46,"text":"which is what should the robot do to put the eggplant in the bowl,"},{"start":3116.7,"text":"pass those in as tokens to a language model,"},{"start":3119.52,"text":"and then output the actions and train the whole model,"},{"start":3123.32,"text":"including the image encoder and the text encoder and pen."},{"start":3128.96,"text":"So here you can view the task identifier, ZI,"},{"start":3133.94,"text":"as basically the prompt for the model."},{"start":3137.82,"text":"The question is, how does this compare to traditional reinforcement learning?"},{"start":3145.56,"text":"Um, in terms of task performance and success rate. So the, um, so like, I guess there's a"},{"start":3153.78,"text":"couple of things that are different here. We'll talk about multitask RL, um, in a bit, like right"},{"start":3159.14,"text":"after this. Uh, and then, so the, like you can do the sort of like prompt conditioning, task"},{"start":3167.22,"text":"identifier conditioning, both with imitation learning and with reinforcement learning. Uh,"},{"start":3171.04,"text":"Uh, and generally the considerations about imitation learning versus RL is very similar"},{"start":3176.3,"text":"to what we've discussed so far, where with imitation learning, um, you're not able to"},{"start":3180.62,"text":"use a reward function to improve over the expert data, uh, but it's very simple, uh,"},{"start":3184.6,"text":"and it's very easy to scale simple things to large data sets, uh, whereas RL has a lot"},{"start":3189.28,"text":"of potential and, and it can help a lot when you have some reward information and you want"},{"start":3194.76,"text":"to optimize those, uh, rewards and you can actually do a lot better than, um, than some"},{"start":3199.38,"text":"some provided data set."},{"start":3202.52,"text":"And then I just have some examples"},{"start":3204.04,"text":"of what kind of multitask imitation"},{"start":3205.92,"text":"learning policies might look like."},{"start":3208.76,"text":"The examples from those kind of two prior architectures, like the robots are doing very simple things. And so I wanted to pick something that's a bit more recent. So here the task identifier is in the top left. In this video, there'll just be two tasks. One is to flatten the towel and one is to hang the towel. And so for the first part, the task is to flatten the towel. And then here we're actually stringing together multiple tasks."}],"speech_gaps":[],"frame":"../frames/v022/019.webp","frame_time":3068.27},{"title":"多任务强化学习中的任务抽象与策略设计","segments":[{"id":303,"text":"So at the point where the robot is at a point where it's better, it's like the towel is in a more flattened state, the human actually switches the task and then tells the robot, now I want you to hang the towel. And this again is passed into a transformer for the robot to do that task. This is a case where there's two tasks.","zh":"当机器人处于一个更好的状态，比如毛巾被压平的时候，人类实际上会切换任务，并告诉机器人现在要挂毛巾。这个任务再次被传递给机器人执行。这是一个存在两个任务的案例。","start":3232.5,"end":3251.21},{"id":304,"text":"You can also do actually a lot more tasks, potentially. So here's an example where there's, I think, more than 10 tasks, 10 different language strings that the robot follows. So put the plate in the drawer, close the microwave, drive the base backward, rotate the base left. And one of the things that's interesting to note here is that tasks can also have different levels of abstraction. So you might have a level of abstraction of just drive forward or move your right gripper lower. Or you might have something that's much higher, like throw the napkin away.","zh":"你实际上还可以完成更多的任务，潜在地。这里有一个例子，我认为有超过10个任务，机器人遵循10个不同的语言指令。例如，把盘子放进抽屉，关闭微波炉，将底盘向后移动，底盘向左旋转。值得注意的一点是，任务也可以有不同的抽象层次。你可能会有一个抽象层次，比如向前移动或降低右夹爪。或者你可能会有更高层次的抽象，比如把餐巾纸扔掉。","start":3251.8,"end":3280.46},{"id":305,"text":"or something like that. The question is, if you had one policy for each task, would that run similar to this or different? Yeah, so in this case, it's one policy with the prompt as input. You could also have a different policy, one for each task. If you don't do any what I would call weight sharing, if you have basically a completely different set of parameters for every single task, then you can't really make use of...","zh":"或者类似这样的情况。问题是，如果你为每个任务都有一个策略，它会和这个情况类似还是不同？是的，在这种情况下，它是一个策略，输入是提示。你也可以有不同的策略，每个任务一个策略。如果你不做任何我称之为权重共享的事情，如果你基本上为每个任务都有一个完全不同的参数集，那么你实际上无法利用……","start":3281.01,"end":3308.57},{"id":306,"text":"like the weights are only trained on data from that one task and we're going to have a smaller dataset. And so usually in many scenarios that performs worse than training a single policy. Another consideration is that it ends up using a lot more memory to store all those weights and you might actually need to reload the model into memory and so it can take longer to switch between different tasks.","zh":"比如，权重只在来自该任务的数据上进行训练，而我们拥有的数据集会更小。因此，在许多情况下，这通常表现得不如训练一个单一策略。另一个考虑因素是，存储所有这些权重会占用更多的内存，你实际上可能需要重新加载模型到内存中，因此在不同任务之间切换可能会花费更长的时间。","start":3308.78,"end":3328.96},{"id":307,"text":"But sometimes there are also optimization challenges with trying to fit multiple tasks into one model. And so sometimes there are some circumstances where training different policies for different tasks can be useful. Yeah, so the question is, are these systems hierarchical? Like some of these tasks are fairly high level. So the next part of this slide is what about like even more high level tasks? Like what if you wanted to tell the robot clean the kitchen?","zh":"但有时在尝试将多个任务拟合到一个模型中时，也会遇到优化挑战。因此，有时在某些情况下，为不同任务训练不同的策略可能是有用的。是的，问题是，这些系统是否具有层次结构？比如，其中一些任务相当高层次。因此，这张幻灯片的下一部分是关于甚至更高层次的任务？比如，如果你想要告诉机器人打扫厨房会怎样？","start":3330.38,"end":3353.81},{"id":308,"text":"For the videos that I've shown here, this is just one single policy that's doing it. But hierarchy is very useful for higher level tasks. And if you just told this robot to clean the kitchen, it wouldn't be able to do what it did in this video.","zh":"对于我在这里展示的视频来说，这只是一个单一的策略在执行任务。但层次结构对于更高层次的任务非常有用。如果你只是告诉这个机器人打扫厨房，它就无法像视频中那样完成任务。","start":3355.32,"end":3373.0},{"id":309,"text":"And so we'll have a lecture on hierarchy in like, I think, two-ish weeks. And we'll talk about exactly that and scenarios where we could try to do even higher level tasks. But yeah, even with a single policy, a single flat policy without hierarchy, it is able to do kind of reasonable actions for tasks that are somewhat high level.","zh":"因此，我们将在大约两周后的一堂课上讨论层次结构。我们将详细探讨这一点以及可以尝试执行更高层次任务的场景。不过，即使只有一个单一的策略，一个没有层次结构的单一平坦策略，它也能够对某些较高层次的任务执行相对合理的动作。","start":3373.86,"end":3393.42},{"id":310,"text":"What does long-horizon task mean?","zh":"什么是长时域任务？","start":3394.45,"end":3395.93},{"id":311,"text":"By that, I mean a task that takes a long time,","zh":"我的意思是，一个需要很长时间才能完成的任务，","start":3396.25,"end":3399.27},{"id":312,"text":"basically, where you have to take many time steps,","zh":"基本上，你需要经历很多时间步，","start":3399.35,"end":3402.53},{"id":313,"text":"you have to take a lot of different actions in order to do that.","zh":"你需要执行大量的不同动作才能完成这个任务。","start":3402.69,"end":3404.77},{"id":314,"text":"There's generally a number of challenges that can come up with","zh":"在长时域任务中，通常会出现一些挑战，例如，","start":3405.99,"end":3408.45},{"id":315,"text":"long-horizon tasks such as,","zh":"长时域任务可能会遇到的挑战包括，","start":3408.45,"end":3410.55}],"notes":["本段讨论了多任务强化学习中策略设计的两种方式：一种是使用单一策略，通过提示（prompt）来处理多个任务；另一种是为每个任务单独设计策略，但这种方式通常需要更多的参数和计算资源。讲者指出，如果不对参数进行共享，每个任务的权重仅基于该任务的数据进行训练，这可能导致性能下降。","讲者提到，使用多个独立策略会占用更多内存，因为需要存储所有任务的参数，这在任务切换时可能需要重新加载模型，从而增加延迟。因此，在资源有限的情况下，单一策略可能更优。","此外，讲者还提到，有时在尝试将多个任务整合到一个模型中时会遇到优化挑战，因此在某些情况下，为不同任务训练不同的策略可能是有用的。","讲者进一步指出，任务可以有不同的抽象层次，例如从简单的动作（如“向前移动”）到更复杂的任务（如“扔掉餐巾”）。这表明，任务的抽象程度会影响策略的设计和执行。","最后，讲者提到，虽然单一策略可能无法处理非常复杂的任务，但它仍然能够执行一些较高层次的任务，这表明策略的抽象能力在多任务学习中是重要的。","讲者还引入了“长时域任务”（long-horizon task）的概念，指出这类任务需要执行大量动作，并且通常面临挑战，如训练难度和计算资源需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3232.5,"end":3410.55,"asr_flags":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":3232.5,"text":"So at the point where the robot is at a point where it's better, it's like the towel is in a more flattened state, the human actually switches the task and then tells the robot, now I want you to hang the towel. And this again is passed into a transformer for the robot to do that task. This is a case where there's two tasks."},{"start":3251.8,"text":"You can also do actually a lot more tasks, potentially. So here's an example where there's, I think, more than 10 tasks, 10 different language strings that the robot follows. So put the plate in the drawer, close the microwave, drive the base backward, rotate the base left. And one of the things that's interesting to note here is that tasks can also have different levels of abstraction. So you might have a level of abstraction of just drive forward or move your right gripper lower. Or you might have something that's much higher, like throw the napkin away."},{"start":3281.01,"text":"or something like that. The question is, if you had one policy for each task, would that run similar to this or different? Yeah, so in this case, it's one policy with the prompt as input. You could also have a different policy, one for each task. If you don't do any what I would call weight sharing, if you have basically a completely different set of parameters for every single task, then you can't really make use of..."},{"start":3308.78,"text":"like the weights are only trained on data from that one task and we're going to have a smaller dataset. And so usually in many scenarios that performs worse than training a single policy. Another consideration is that it ends up using a lot more memory to store all those weights and you might actually need to reload the model into memory and so it can take longer to switch between different tasks."},{"start":3330.38,"text":"But sometimes there are also optimization challenges with trying to fit multiple tasks into one model. And so sometimes there are some circumstances where training different policies for different tasks can be useful. Yeah, so the question is, are these systems hierarchical? Like some of these tasks are fairly high level. So the next part of this slide is what about like even more high level tasks? Like what if you wanted to tell the robot clean the kitchen?"},{"start":3355.32,"text":"For the videos that I've shown here, this is just one single policy that's doing it. But hierarchy is very useful for higher level tasks. And if you just told this robot to clean the kitchen, it wouldn't be able to do what it did in this video."},{"start":3373.86,"text":"And so we'll have a lecture on hierarchy in like, I think, two-ish weeks. And we'll talk about exactly that and scenarios where we could try to do even higher level tasks. But yeah, even with a single policy, a single flat policy without hierarchy, it is able to do kind of reasonable actions for tasks that are somewhat high level."},{"start":3394.45,"text":"What does long-horizon task mean?"},{"start":3396.25,"text":"By that, I mean a task that takes a long time,"},{"start":3399.35,"text":"basically, where you have to take many time steps,"},{"start":3402.69,"text":"you have to take a lot of different actions in order to do that."},{"start":3405.99,"text":"There's generally a number of challenges that can come up with"},{"start":3408.45,"text":"long-horizon tasks such as,"}],"speech_gaps":[],"frame":"../frames/v022/020.webp","frame_time":3244.5},{"title":"多任务强化学习中的任务描述与数据共享","segments":[{"id":316,"text":"you have to be thinking about what you should be","zh":"你必须思考你应该做什么","start":3413.19,"end":3415.33},{"id":317,"text":"and there's lots of things you could do to complete that,","zh":"并且有很多事情你可以做来完成这个任务，","start":3415.33,"end":3417.33},{"id":318,"text":"and there's lots of things you could do to complete that,","zh":"并且有很多事情你可以做来完成这个任务，","start":3417.53,"end":3419.93},{"id":319,"text":"so there might be multi-modality.","zh":"因此可能存在多模态性。","start":3420.03,"end":3421.23},{"id":320,"text":"In reinforcement learning settings,","zh":"在强化学习的设置中，","start":3421.59,"end":3422.91},{"id":321,"text":"settings, you might also have sparse rewards and you might not get reward feedback for","zh":"设置中，你可能也会遇到稀疏奖励，并且可能在很长一段时间内都不会获得奖励反馈。","start":3422.91,"end":3426.39},{"id":322,"text":"a very long time.","zh":"很长一段时间。","start":3426.39,"end":3427.13},{"id":323,"text":"Yeah, so the question is, a lot of these tasks are pretty similar.","zh":"是的，所以问题是，很多这些任务都非常相似。","start":3428.07,"end":3430.61},{"id":324,"text":"What if you wanted a task that's more vision-based, I think you said?","zh":"如果你想一个更基于视觉的任务，你觉得你之前说过吗？","start":3430.73,"end":3433.07},{"id":325,"text":"Yeah, so this particular model was actually also trained to do certain vision tasks, like","zh":"是的，这个特定的模型实际上也被训练来执行某些视觉任务，比如","start":3435.63,"end":3440.97},{"id":326,"text":"asking questions about the image and captioning an image, that sort of stuff.","zh":"询问关于图像的问题和对图像进行描述，这类事情。","start":3440.97,"end":3447.29},{"id":327,"text":"And if you have a big enough model, it's not too hard to do that.","zh":"如果你有一个足够大的模型，做这些并不太难。","start":3447.73,"end":3451.99},{"id":328,"text":"But generally, you do need larger models to be able to do more things.","zh":"但一般来说，你确实需要更大的模型才能做到更多事情。","start":3451.99,"end":3455.63},{"id":329,"text":"Cool.","zh":"很酷。","start":3458.27,"end":3458.67},{"id":330,"text":"So we've talked a bit about multitask imitation learning.","zh":"我们已经稍微讨论过多任务模仿学习。","start":3459.53,"end":3461.49},{"id":331,"text":"Now, what about multitask RL?","zh":"那么，关于多任务强化学习呢？","start":3461.69,"end":3463.05},{"id":332,"text":"Basically, kind of the story is pretty similar.","zh":"基本上，这个故事大致是相似的。","start":3464.63,"end":3466.97},{"id":333,"text":"We can feed as input a task descriptor into the policy,","zh":"我们可以将任务描述作为输入传递给策略，","start":3467.57,"end":3470.69},{"id":334,"text":"feed as input a task descriptor into a Q function or a value function.","zh":"也可以将任务描述作为输入传递给Q函数或价值函数。","start":3471.09,"end":3474.93},{"id":335,"text":"Like whatever we're learning, we can pass in that sort of that prompt","zh":"无论我们正在学习什么，都可以将这种提示","start":3475.05,"end":3477.89},{"id":336,"text":"prompt, or some other descriptor of the task into the models.","zh":"提示，或任务的其他描述符输入到模型中。","start":3477.89,"end":3482.39},{"id":337,"text":"If you have a discrete number of tasks,","zh":"如果你有离散数量的任务，","start":3485.01,"end":3488.89},{"id":338,"text":"then it can be useful to have a different replay buffer for each task,","zh":"那么为每个任务拥有不同的回放缓冲区可能会很有用，","start":3489.05,"end":3491.79},{"id":339,"text":"especially if you want to try to balance the sampling of each batch.","zh":"特别是如果你想尝试平衡每个批次的采样。","start":3492.05,"end":3495.25},{"id":340,"text":"And now there's this question of sharing data.","zh":"现在出现了一个关于数据共享的问题。","start":3498.69,"end":3502.15},{"id":341,"text":"And this comes up specifically in reinforcement learning,","zh":"这个问题尤其出现在强化学习中，","start":3503.55,"end":3506.39},{"id":342,"text":"not in imitation learning.","zh":"而不是模仿学习中。","start":3506.51,"end":3507.53},{"id":343,"text":"So in particular, if we collected some sort of exploratory data for a task,","zh":"特别是，如果我们收集了某种探索性数据用于一个任务，","start":3507.89,"end":3513.45},{"id":344,"text":"maybe our policy was told to pick up the sponge or something like that,","zh":"比如我们的策略被指示去捡起海绵之类的物品，","start":3514.97,"end":3519.39},{"id":345,"text":"our policy did something, it might not have picked up the sponge","zh":"我们的策略执行了某些操作，但可能没有捡起海绵，","start":3519.87,"end":3523.07},{"id":346,"text":"because it may have made a mistake.","zh":"因为它可能犯了错误。","start":3523.07,"end":3524.09},{"id":347,"text":"That sort of experience might be useful for other task descriptors as well.","zh":"这种经验可能对其他任务描述也有用。","start":3525.07,"end":3530.65},{"id":348,"text":"And if we have a per-task replay buffer, like one for each task,","zh":"如果我们为每个任务都有一个单独的经验回放缓冲区，","start":3530.97,"end":3535.45},{"id":349,"text":"then we're not actually going to be updating the policy for other tasks using that data.","zh":"那么我们实际上不会使用这些数据来更新其他任务的策略。","start":3535.45,"end":3538.87},{"id":350,"text":"And we could actually think about scenarios where we might actually be able to reuse data from one task to actually more explicitly help the model or the policy learn something about another task.","zh":"我们甚至可以考虑一些场景，其中我们可能能够重用一个任务的数据，以更明确地帮助模型或策略学习另一个任务的相关信息。","start":3539.68,"end":3553.92},{"id":351,"text":"And if we were to do this, we actually have to relabel the data.","zh":"如果我们这样做，实际上我们必须重新标记这些数据。","start":3556.74,"end":3559.88},{"id":352,"text":"So, specifically, like, if the tasks have different reward functions, but maybe the same dynamics, then you'd have to actually change the reward label in the data set for it to be the reward label for the other task.","zh":"具体来说，如果任务有不同的奖励函数，但可能有相同的动态特性，那么你必须实际更改数据集中奖励标签，使其成为另一个任务的奖励标签。","start":3559.88,"end":3573.48},{"id":353,"text":"Let's walk through an example.","zh":"让我们通过一个例子来说明。","start":3574.66,"end":3576.1},{"id":354,"text":"So, say that you are trying to learn to play hockey, and there's, like, maybe some teammates in blue.","zh":"假设你正在学习如何打冰球，而且场上可能有一些穿蓝色衣服的队友。","start":3576.4,"end":3587.46},{"id":355,"text":"There is a goalkeeper from the other team.","zh":"对方队伍有一个守门员。","start":3587.62,"end":3589.7}],"notes":["本段讨论了多任务强化学习（Multi-Task RL）中任务描述的输入方式以及数据共享的问题。讲者提到，任务描述可以作为输入传递给策略（policy）、Q函数或价值函数，以指导模型执行特定任务。此外，讲者还提到，如果任务数量是离散的，为每个任务维护独立的回放缓冲区（replay buffer）可能有助于平衡每个批次的采样。","讲者进一步指出，在强化学习中，数据共享是一个重要问题，特别是在不同任务之间。如果一个任务的探索数据（如尝试拾取海绵但失败）可能对其他任务有帮助，但若使用独立的回放缓冲区，则无法利用这些数据。因此，讲者提到需要重新标记数据，以适应不同任务的奖励函数。","讲者通过一个例子说明了数据共享的潜在价值：例如，学习打冰球时，如果一个任务的探索数据（如尝试拾取海绵但失败）可能对其他任务有帮助，但若使用独立的回放缓冲区，则无法利用这些数据。因此，讲者提到需要重新标记数据，以适应不同任务的奖励函数。","讲者还提到，如果任务具有相同的动态（dynamics）但不同的奖励函数，那么需要重新标记数据集中的奖励标签，以使其适用于其他任务。这表明在多任务强化学习中，数据的共享和重用需要考虑任务之间的差异性。","讲者最后提到，通过一个具体的例子（如学习打冰球）来说明多任务强化学习中的数据共享问题，强调了任务描述和数据标记在多任务学习中的重要性。","讲者强调了在多任务强化学习中，任务描述的输入方式、数据共享的挑战以及数据重用的必要性，这些内容为后续讨论多任务强化学习的实现方法提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3413.19,"end":3589.7,"asr_flags":[],"translation_complete":true,"translated_segments":40,"raw_segments":[{"start":3413.19,"text":"you have to be thinking about what you should be"},{"start":3415.33,"text":"doing in order to complete that,"},{"start":3417.53,"text":"and there's lots of things you could do to complete that,"},{"start":3420.03,"text":"so there might be multi-modality."},{"start":3421.59,"text":"In reinforcement learning settings,"},{"start":3422.91,"text":"settings, you might also have sparse rewards and you might not get reward feedback for"},{"start":3426.39,"text":"a very long time."},{"start":3428.07,"text":"Yeah, so the question is, a lot of these tasks are pretty similar."},{"start":3430.73,"text":"What if you wanted a task that's more vision-based, I think you said?"},{"start":3435.63,"text":"Yeah, so this particular model was actually also trained to do certain vision tasks, like"},{"start":3440.97,"text":"asking questions about the image and captioning an image, that sort of stuff."},{"start":3447.73,"text":"And if you have a big enough model, it's not too hard to do that."},{"start":3451.99,"text":"But generally, you do need larger models to be able to do more things."},{"start":3458.27,"text":"Cool."},{"start":3459.53,"text":"So we've talked a bit about multitask imitation learning."},{"start":3461.69,"text":"Now, what about multitask RL?"},{"start":3464.63,"text":"Basically, kind of the story is pretty similar."},{"start":3467.57,"text":"We can feed as input a task descriptor into the policy,"},{"start":3471.09,"text":"feed as input a task descriptor into a Q function or a value function."},{"start":3475.05,"text":"Like whatever we're learning, we can pass in that sort of that prompt"},{"start":3477.89,"text":"prompt, or some other descriptor of the task into the models."},{"start":3485.01,"text":"If you have a discrete number of tasks,"},{"start":3489.05,"text":"then it can be useful to have a different replay buffer for each task,"},{"start":3492.05,"text":"especially if you want to try to balance the sampling of each batch."},{"start":3498.69,"text":"And now there's this question of sharing data."},{"start":3503.55,"text":"And this comes up specifically in reinforcement learning,"},{"start":3506.51,"text":"not in imitation learning."},{"start":3507.89,"text":"So in particular, if we collected some sort of exploratory data for a task,"},{"start":3514.97,"text":"maybe our policy was told to pick up the sponge or something like that,"},{"start":3
