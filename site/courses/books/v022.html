519.87,"text":"our policy did something, it might not have picked up the sponge"},{"start":3523.07,"text":"because it may have made a mistake."},{"start":3525.07,"text":"That sort of experience might be useful for other task descriptors as well."},{"start":3530.97,"text":"And if we have a per-task replay buffer, like one for each task,"},{"start":3535.45,"text":"then we're not actually going to be updating the policy for other tasks using that data."},{"start":3539.68,"text":"And we could actually think about scenarios where we might actually be able to reuse data from one task to actually more explicitly help the model or the policy learn something about another task."},{"start":3556.74,"text":"And if we were to do this, we actually have to relabel the data."},{"start":3559.88,"text":"So, specifically, like, if the tasks have different reward functions, but maybe the same dynamics, then you'd have to actually change the reward label in the data set for it to be the reward label for the other task."},{"start":3574.66,"text":"Let's walk through an example."},{"start":3576.4,"text":"So, say that you are trying to learn to play hockey, and there's, like, maybe some teammates in blue."},{"start":3587.62,"text":"There is a goalkeeper from the other team."}],"speech_gaps":[{"start":3433.47,"end":3435.23}],"frame":"../frames/v022/021.webp","frame_time":3425.19},{"title":"多任务强化学习中的经验重用与任务标识","segments":[{"id":356,"text":"in orange. And maybe one task is passing, another task is shooting a goal.","zh":"用橙色表示。也许一个任务是传球，另一个任务是射门。","start":3589.88,"end":3596.1},{"id":357,"text":"And maybe you were trying to shoot a goal, but you messed up and you accidentally","zh":"也许你原本想射门，但你搞砸了，不小心","start":3598.96,"end":3602.76},{"id":358,"text":"actually making it like a pretty good pass to your teammate. Then that data that you just","zh":"实际上传给了你的队友一个相当不错的传球。那么你刚刚收集到的数据，","start":3603.92,"end":3613.1},{"id":359,"text":"collected, even though you were intending to shoot a goal, that data actually is probably","zh":"即使你原本是想射门，这些数据实际上可能对于学习如何更好地传球也很有用。因此，你可以","start":3613.1,"end":3616.24},{"id":360,"text":"pretty useful for learning how to be better at passing. And so what you could","zh":"做的是将这段经验像平常一样存储在原始任务标识符下，","start":3616.24,"end":3622.1},{"id":361,"text":"do is you could store that experience as normal under the original task identifier,","zh":"但你也可以将这段经验重新标记为任务一的标识符，具体来说是传球的标识符，","start":3622.1,"end":3625.78},{"id":362,"text":"but you could also relabel the experience with the task one ID, specifically the passing ID,","zh":"那里有个拼写错误，然后将这段经验存储在该任务的缓冲区中。","start":3626.04,"end":3635.68},{"id":363,"text":"there's a typo there, and then store that in the repo buffer for that task.","zh":"那里有个拼写错误，然后将它存储在该任务的仓库缓冲区中。","start":3635.8,"end":3639.3},{"id":364,"text":"Specifically, what this algorithm would look like is maybe you pick one of your tasks, and then we pick a corresponding task identifier. Then we're going to collect data, and we'll be collecting data from our policy that's going to be then conditioned on","zh":"具体来说，这个算法可能看起来是这样的：你选择其中一个任务，然后我们选择一个相应的任务标识符。接着我们收集数据，并且这些数据将来自于我们的策略，该策略将根据这个任务标识符进行条件化。","start":3642.82,"end":3674.8},{"id":365,"text":"that task identifier. Then, and maybe let's refer to this data as, like, it'll have ST, AT, ST plus 1, RT, and then it will also have the task identifier. We'll maybe put this into a replay buffer for task I. So we'll store this in the replay buffer.","zh":"然后，也许我们可以将这些数据称为，比如，它将包含ST、AT、ST加1、RT，以及任务标识符。我们可能会将这些数据存储到任务I的回放缓冲区中。","start":3675.49,"end":3705.02},{"id":366,"text":"And then we could actually then potentially use this for another task as well. So that's what I'm calling relabeling. And we could consider this data. So ST, AT, ST plus 1. But we could actually consider it for a different task, maybe task J. And so the reward for task J would be R of J for ST, AT.","zh":"然后我们实际上可以将这些数据用于另一个任务。这就是我所说的重新标记。我们可以考虑这些数据，即ST、AT、ST加1。但我们实际上也可以将其用于不同的任务，比如任务J。因此，任务J的奖励将是R的J对于ST、AT。","start":3707.75,"end":3734.64},{"id":367,"text":"the task identifier for task J. And we could take this data that's been relabeled and add this to either our shared replay buffer or our replay buffer for task J. So then we're actually using experience for one task to learn another task. And then we might do this for multiple tasks. Eventually, we will update our","zh":"任务J的任务标识符。我们可以将这些被重新标记的数据添加到我们的共享回放缓冲区或任务J的回放缓冲区中。因此，我们实际上是在使用一个任务的经验来学习另一个任务。然后我们可能会对多个任务这样做。最终，我们将更新我们的","start":3736.89,"end":3767.84}],"notes":["本段讲解了在多任务强化学习中，一个任务的执行经验可能对另一个任务有帮助。例如，原本意图射门但意外完成了一次高质量传球，这种经验可以被重新标记为传球任务，并存储到相应的经验回放缓冲区中。","讲者提到，算法可以选取一个任务及其对应的任务标识符，收集数据时将策略条件化于该任务标识符。数据包括状态、动作、下一状态、奖励以及任务标识符，并存储到对应任务的回放缓冲区中。","讲者进一步说明，这种经验可以被重新标记为其他任务（如任务J），并用于该任务的学习。此时，奖励函数将基于任务J的当前状态和动作进行计算。","讲者指出，这种经验重用机制可以应用于多个任务，最终通过更新策略来提升多个任务的性能。","讲者强调，这种重新标记经验的方法是多任务强化学习中一种重要的经验重用策略，能够提高学习效率。","讲者提到，经验可以被存储到共享的回放缓冲区或特定任务的回放缓冲区中，从而实现跨任务的知识迁移。"],"formulas":[],"uncertainties":["repo buffer 可能是 'replay buffer' 的误听，需确认是否为回放缓冲区的术语。"],"diagram":"none","start":3589.88,"end":3767.84,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":3589.88,"text":"in orange. And maybe one task is passing, another task is shooting a goal."},{"start":3598.96,"text":"And maybe you were trying to shoot a goal, but you messed up and you accidentally"},{"start":3603.92,"text":"actually making it like a pretty good pass to your teammate. Then that data that you just"},{"start":3613.1,"text":"collected, even though you were intending to shoot a goal, that data actually is probably"},{"start":3616.24,"text":"pretty useful for learning how to be better at passing. And so what you could"},{"start":3622.1,"text":"do is you could store that experience as normal under the original task identifier,"},{"start":3626.04,"text":"but you could also relabel the experience with the task one ID, specifically the passing ID,"},{"start":3635.8,"text":"there's a typo there, and then store that in the repo buffer for that task."},{"start":3642.82,"text":"Specifically, what this algorithm would look like is maybe you pick one of your tasks, and then we pick a corresponding task identifier. Then we're going to collect data, and we'll be collecting data from our policy that's going to be then conditioned on"},{"start":3675.49,"text":"that task identifier. Then, and maybe let's refer to this data as, like, it'll have ST, AT, ST plus 1, RT, and then it will also have the task identifier. We'll maybe put this into a replay buffer for task I. So we'll store this in the replay buffer."},{"start":3707.75,"text":"And then we could actually then potentially use this for another task as well. So that's what I'm calling relabeling. And we could consider this data. So ST, AT, ST plus 1. But we could actually consider it for a different task, maybe task J. And so the reward for task J would be R of J for ST, AT."},{"start":3736.89,"text":"the task identifier for task J. And we could take this data that's been relabeled and add this to either our shared replay buffer or our replay buffer for task J. So then we're actually using experience for one task to learn another task. And then we might do this for multiple tasks. Eventually, we will update our"}],"speech_gaps":[],"frame":"../frames/v022/022.webp","frame_time":3601.88},{"title":"多任务强化学习中的重贴标签策略","segments":[{"id":368,"text":"policy pi theta and collect some more data. The question is, how do we decide if it's worth relabeling? In particular, we're doing this for task j. Which task j should we pick? Should we do it for all j's? Should we only do it for some j's? Should we only do this some of the time? This ends up being somewhat of a heuristic process because it's a little bit hard to tell generally if","zh":"策略 pi theta 并收集一些更多的数据。问题是，我们如何决定是否值得重新贴标签？特别是，我们正在为任务 j 进行这项操作。应该选择哪个任务 j？我们应该对所有 j 进行吗？我们应该只对某些 j 进行吗？我们应该只在某些时候进行吗？这最终成为一个相当启发式的过程，因为一般来说很难判断数据是否对学习某个任务有用，因为学习本身是一个相当模糊的过程。其中一个启发式方法是，如果 rj 很高，那么它可能对学习该任务有帮助，因为你实际上可能无意中为另一个任务做了一些好的事情。这是其中一个启发式方法。另一个启发式方法有时只是随机采样，并将它用于所有任务的随机和均匀采样。","start":3768.58,"end":3795.71},{"id":369,"text":"data will be useful for learning one task or not, because learning is somewhat of an amorphous process, I guess. The one heuristic is that if rj was high, then it might be good for learning that task, because you actually might have accidentally done something good for a different task. So that's one heuristic. Another heuristic sometimes is just to also sample randomly and use it for all tasks at random and uniformly.","zh":"这在连续状态的情况下是如何工作的？这里没有任何内容假设离散状态。你是如何到达那里的？实际上，我在这里所写的是一种适用于任何多任务系统的重新贴标签算法。我们稍后还会讨论在目标条件设置下它看起来是什么样子的，如果你对此感兴趣的话。是的，这是一个很好的观点。","start":3796.3,"end":3823.92},{"id":370,"text":"How does this work for continuous state? There's nothing here that assumes discrete states. How do you reach? So this is actually, what I've written here is like a relabeling algorithm for any sort of multitask system. There's also, we'll talk about what this looks like for goal condition settings in a minute, if that's what you're wondering about. Yeah, so this is a great point.","zh":"只有几种情况。你不能普遍这样做。因此，这被称为 hindsight relabeling，因为你基本上是在回顾你所做的事情。如果你做了一些好的事情，那么在回顾时，你可以将它重新贴标签为不同的任务。就幻灯片上的这个算法而言，我们使用某种策略收集一些数据。我们将这些数据存储在重放缓冲区中。我们将执行 hindsight relabeling。","start":3824.97,"end":3849.25},{"id":371,"text":"There's only a few scenarios. You can't do this universally. And so this is something that's called hindsight relabeling because you kind of look at what you did. If you did something good, then in hindsight, you can kind of then relabel that to be a different task. So in terms of this algorithm on the slides, we collect some data using some policy. We store that data in a replay buffer. We are going to perform hindsight relabeling.","zh":"这看起来是这样的。我们最初是为任务 I 收集的这些数据。我们将它重新贴标签为任务 J 的奖励。然后我们将这个重新贴标签的数据存储在我们的重放缓冲区中。幻灯片上显示的是一个单一的组合重放缓冲区。你也可以为每个任务使用不同的重放缓冲区。然后你将使用重放缓冲区更新你的策略，并重复这个过程。","start":3850.3,"end":3876.45},{"id":372,"text":"And what this looks like is this. We originally collected it for task I. We're going to relabel it with the reward for task J. And then we'll store that relabeled data in our replay buffer. The slides have this for like a single combined replay buffer. You could also do this with different replay buffers for each task. Then you'll update your policy with the replay buffer and repeat this process.","zh":"这看起来是什么样子的呢。我们最初是为任务I收集的数据。我们将用任务J的奖励对它进行重新标记。然后我们将这个重新标记的数据存储在我们的回放缓冲区中。幻灯片中展示的是一个单一的综合回放缓冲区。你也可以为每个任务使用不同的回放缓冲区。然后你将使用回放缓冲区来更新你的策略，并重复这个过程。","start":3877.14,"end":3902.56},{"id":373,"text":"In terms of which tasks to choose, you can choose this randomly, tasks that get high rewards. The note here is also you can actually do it for trajectories that get high rewards, not just transitions that get high rewards, because if there's a high reward somewhere in the trajectory, then other parts of the trajectory might have done something good as well. Yeah, and then there's a question of when can we apply relabeling. And in particular, there's actually restrictions on both","zh":"在选择哪些任务时，你可以随机选择，也可以选择那些获得高奖励的任务。这里需要注意的是，实际上你也可以对获得高奖励的轨迹进行重贴标签，而不仅仅是那些获得高奖励的转移，因为如果轨迹中的某处有高奖励，那么轨迹的其他部分可能也执行了有益的操作。是的，还有一个问题是何时可以应用重贴标签。特别是，实际上对两者都有一定的限制","start":3904.3,"end":3933.13}],"notes":["本段讨论了在多任务强化学习中如何决定是否对数据进行重贴标签的问题。讲者指出，这是一个启发式过程，因为很难一般性地判断数据是否对学习某个任务有用。一个启发式方法是，如果任务j的奖励rj较高，那么可能对学习该任务有帮助，因为可能在其他任务中已经做了有益的事情。另一个启发式方法是随机采样并均匀地用于所有任务。","讲者提到，重贴标签算法并不假设离散状态，因此适用于连续状态。重贴标签的过程是将原本为任务I收集的数据重新贴上任务J的奖励标签，并存储到回放缓冲区中。这可以使用单一的回放缓冲区，也可以为每个任务使用不同的回放缓冲区。","在选择任务时，可以随机选择或选择奖励较高的任务。此外，讲者指出，可以对轨迹进行重贴标签，而不仅仅是单个转移，因为轨迹中某个位置的高奖励可能意味着其他部分也有价值。","最后，讲者提到重贴标签的应用存在时间上的限制，即在某些情况下不能随意应用重贴标签。这表明重贴标签策略需要考虑任务选择和时间限制的结合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3768.58,"end":3933.13,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3768.58,"text":"policy pi theta and collect some more data. The question is, how do we decide if it's worth relabeling? In particular, we're doing this for task j. Which task j should we pick? Should we do it for all j's? Should we only do it for some j's? Should we only do this some of the time? This ends up being somewhat of a heuristic process because it's a little bit hard to tell generally if"},{"start":3796.3,"text":"data will be useful for learning one task or not, because learning is somewhat of an amorphous process, I guess. The one heuristic is that if rj was high, then it might be good for learning that task, because you actually might have accidentally done something good for a different task. So that's one heuristic. Another heuristic sometimes is just to also sample randomly and use it for all tasks at random and uniformly."},{"start":3824.97,"text":"How does this work for continuous state? There's nothing here that assumes discrete states. How do you reach? So this is actually, what I've written here is like a relabeling algorithm for any sort of multitask system. There's also, we'll talk about what this looks like for goal condition settings in a minute, if that's what you're wondering about. Yeah, so this is a great point."},{"start":3850.3,"text":"There's only a few scenarios. You can't do this universally. And so this is something that's called hindsight relabeling because you kind of look at what you did. If you did something good, then in hindsight, you can kind of then relabel that to be a different task. So in terms of this algorithm on the slides, we collect some data using some policy. We store that data in a replay buffer. We are going to perform hindsight relabeling."},{"start":3877.14,"text":"And what this looks like is this. We originally collected it for task I. We're going to relabel it with the reward for task J. And then we'll store that relabeled data in our replay buffer. The slides have this for like a single combined replay buffer. You could also do this with different replay buffers for each task. Then you'll update your policy with the replay buffer and repeat this process."},{"start":3904.3,"text":"In terms of which tasks to choose, you can choose this randomly, tasks that get high rewards. The note here is also you can actually do it for trajectories that get high rewards, not just transitions that get high rewards, because if there's a high reward somewhere in the trajectory, then other parts of the trajectory might have done something good as well. Yeah, and then there's a question of when can we apply relabeling. And in particular, there's actually restrictions on both"}],"speech_gaps":[],"frame":"../frames/v022/023.webp","frame_time":3780.58},{"title":"多任务强化学习中的共享与差异","segments":[{"id":374,"text":"the set of MVPs, or the MVPs of the different tasks, and also on the algorithm that you're using for reinforcement learning. So does anyone have thoughts on what has to be shared or not shared for this algorithm to make sense? Yeah, so a shared state action space. So you're going to want a shared...","zh":"MVP集合，或者不同任务的MVP，以及你用于强化学习的算法。因此，有人对这个算法要共享或不共享什么有想法吗？是的，共享状态和动作空间。因此，你想要一个共享的...","start":3933.75,"end":3962.53},{"id":375,"text":"state and action space. Anything else do you want that's shared and not shared?","zh":"状态和动作空间。还有其他你想要共享或不共享的东西吗？","start":3964.81,"end":3973.29},{"id":376,"text":"Yeah, so if you only have one replay buffer, then you want the dimensions of your state and actions","zh":"是的，如果你只有一个经验回放缓冲区，那么你希望状态和动作的维度相匹配，并且通常状态空间和动作空间要相同。是的，因此你可能","start":3974.19,"end":3977.87},{"id":377,"text":"to match, and generally for the state space and action space to be the same. Yeah, so you probably","zh":"希望初始状态分布相似。因此，你希望不同任务的P(s1)相似，因为如果它们差异很大，那么共享数据可能不会那么有用。因此，如果其中一个任务有密集奖励，而另一个任务有稀疏","start":3977.87,"end":3985.33},{"id":378,"text":"want the initial state distribution to be similar. So you want like P of s1 for","zh":"希望初始状态分布相似。所以你希望像 P of s1 对于","start":3985.33,"end":3992.91},{"id":379,"text":"to be like similar for different tasks because if it's like","zh":"在不同任务中也相似，因为如果它们差异很大，那么共享数据可能就不那么有用。","start":3992.91,"end":4003.99},{"id":380,"text":"drastically different then they're probably like sharing data won't be as","zh":"如果其中一个任务有密集奖励，而另一个任务有稀疏","start":4003.99,"end":4007.79},{"id":381,"text":"useful. So if one of them has dense rewards and one of those has sparse","zh":"奖励，那么共享数据可能就不那么有用。","start":4007.79,"end":4012.59},{"id":382,"text":"rewards, that might be a problem. That is true, although that might be a problem generally in","zh":"奖励，这可能会成为一个问题。这是真的，尽管这通常在多任务强化学习中可能是一个问题","start":4012.59,"end":4021.93},{"id":383,"text":"multitask RL. But actually, in this case, I don't think it's going to be especially an issue in","zh":"但事实上，在这种情况下，我认为这不会成为特别大的问题","start":4021.93,"end":4028.81},{"id":384,"text":"this case, because you are going to be using the reward function for the task. But yeah,","zh":"因为你会使用任务的奖励函数。不过，","start":4028.81,"end":4032.51},{"id":385,"text":"generally for multitask RL, that makes things challenging. Yeah, so it's helpful for the","zh":"在多任务强化学习中，这通常会使事情变得具有挑战性。是的，所以奖励保持相同的尺度是有帮助的，那么动态部分呢？","start":4032.53,"end":4036.95},{"id":386,"text":"the rewards to be the same scale, what about the dynamics?","zh":"它们在不同任务之间应该相同还是不同？","start":4036.95,"end":4039.43},{"id":387,"text":"Should they be the same or different across tasks?","zh":"相同。是的。你希望动态部分是相同的，","start":4042.11,"end":4044.31},{"id":388,"text":"Same. Yeah. So you want the dynamics to be the same,","zh":"实际上这非常重要，因为在这里你并没有重新标记动态部分","start":4045.15,"end":4048.73},{"id":389,"text":"and it's actually really important because you're not relabeling the dynamics here,","zh":"而且这实际上非常重要，因为在这里你并不是在重新标记动态。","start":4048.77,"end":4052.59},{"id":390,"text":"and because you're not relabeling the dynamics,","zh":"而且因为你没有重新标记动力学模型，","start":4053.21,"end":4054.95},{"id":391,"text":"if they're different across tasks,","zh":"如果它们在不同任务中不同，","start":4055.05,"end":4056.25},{"id":392,"text":"then it's going to be a problem.","zh":"那就会成为一个问题。","start":4056.49,"end":4061.17},{"id":393,"text":"So it's only applicable because you're teaching them all and","zh":"因此，只有在你同时教导所有任务并且","start":4061.45,"end":4065.13},{"id":394,"text":"and sharing data with the dynamics from the other task,","zh":"与其它任务的动力学数据共享时，","start":4065.13,"end":4067.73},{"id":395,"text":"it's really important for the dynamics to be the same.","zh":"动力学模型必须保持一致非常重要。","start":4067.83,"end":4070.47},{"id":396,"text":"So the dynamics should be the same.","zh":"因此，动力学模型应该是一致的。","start":4072.23,"end":4075.11},{"id":397,"text":"And then this is also most useful if the reward functions are different, otherwise the data is already in the buffer with the original reward function. My last question is, do you need this to be an off-policy RL algorithm, or is it okay if this is on-policy? Any thoughts on that? We'd like to have coverage. Off-policy is generally good, yeah? Yeah, so when we...","zh":"此外，这在奖励函数不同的情况下最为有用，否则数据已经包含在原始奖励函数的缓冲区中。我的最后一个问题是，是否需要这个方法是一个离策略强化学习算法，还是说使用在策略算法也可以？对此有什么想法吗？我们希望有覆盖性。离策略通常更好，对吧？是的，当我们……","start":4076.45,"end":4107.15}],"notes":["本段讨论了多任务强化学习中需要共享和不共享的要素。首先，共享状态和动作空间是关键，因为如果使用单一经验回放缓冲区，状态和动作的维度必须匹配，且状态空间和动作空间应保持一致。此外，初始状态分布应相似，以确保不同任务间的数据共享有效。如果任务之间的奖励函数差异较大，如密集奖励与稀疏奖励，可能会带来挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3933.75,"end":4107.15,"asr_flags":[379],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":3933.75,"text":"the set of MVPs, or the MVPs of the different tasks, and also on the algorithm that you're using for reinforcement learning. So does anyone have thoughts on what has to be shared or not shared for this algorithm to make sense? Yeah, so a shared state action space. So you're going to want a shared..."},{"start":3964.81,"text":"state and action space. Anything else do you want that's shared and not shared?"},{"start":3974.19,"text":"Yeah, so if you only have one replay buffer, then you want the dimensions of your state and actions"},{"start":3977.87,"text":"to match, and generally for the state space and action space to be the same. Yeah, so you probably"},{"start":3985.33,"text":"want the initial state distribution to be similar. So you want like P of s1 for"},{"start":3992.91,"text":"to be like similar for different tasks because if it's like"},{"start":4003.99,"text":"drastically different then they're probably like sharing data won't be as"},{"start":4007.79,"text":"useful. So if one of them has dense rewards and one of those has sparse"},{"start":4012.59,"text":"rewards, that might be a problem. That is true, although that might be a problem generally in"},{"start":4021.93,"text":"multitask RL. But actually, in this case, I don't think it's going to be especially an issue in"},{"start":4028.81,"text":"this case, because you are going to be using the reward function for the task. But yeah,"},{"start":4032.53,"text":"generally for multitask RL, that makes things challenging. Yeah, so it's helpful for the"},{"start":4036.95,"text":"the rewards to be the same scale, what about the dynamics?"},{"start":4042.11,"text":"Should they be the same or different across tasks?"},{"start":4045.15,"text":"Same. Yeah. So you want the dynamics to be the same,"},{"start":4048.77,"text":"and it's actually really important because you're not relabeling the dynamics here,"},{"start":4053.21,"text":"and because you're not relabeling the dynamics,"},{"start":4055.05,"text":"if they're different across tasks,"},{"start":4056.49,"text":"then it's going to be a problem."},{"start":4061.45,"text":"So it's only applicable because you're teaching them all and"},{"start":4065.13,"text":"and sharing data with the dynamics from the other task,"},{"start":4067.83,"text":"it's really important for the dynamics to be the same."},{"start":4072.23,"text":"So the dynamics should be the same."},{"start":4076.45,"text":"And then this is also most useful if the reward functions are different, otherwise the data is already in the buffer with the original reward function. My last question is, do you need this to be an off-policy RL algorithm, or is it okay if this is on-policy? Any thoughts on that? We'd like to have coverage. Off-policy is generally good, yeah? Yeah, so when we..."}],"speech_gaps":[],"frame":"../frames/v022/024.webp","frame_time":3945.75},{"title":"多任务强化学习中的策略与奖励函数","segments":[{"id":398,"text":"The action here, this was the action that was taken by the policy when conditioned on ZI. And when conditioned on ZJ, the policy might have done something different. And so this data that we're relabeling is going to be off-policy data. And so that means that we should, when we're updating Pytheta, we really need to be using an off-policy algorithm because this data is not following the policy conditioned on ZJ.","zh":"这里的动作，这是策略在条件为ZI时采取的动作。而当条件为ZJ时，策略可能会采取不同的动作。因此，我们重新标记的数据将是离策略数据。因此，当我们更新Pytheta时，我们需要使用离策略算法，因为这些数据并不遵循条件为ZJ的策略。","start":4109.75,"end":4138.15},{"id":399,"text":"Yeah, exactly. So if you're going to be using importance weights, you need to store which policy collected the data in the first place. Well, actually, sorry, let me think about that. This data is actually changed from the original data. And so actually, you'll want to use, for the importance weights, you'll actually want to use zj, not zi, as the old policy.","zh":"是的，没错。如果你要使用重要性权重，你需要存储数据最初是由哪个策略收集的。嗯，实际上，让我再想想。这些数据实际上已经不同于原始数据了。因此，实际上，你在计算重要性权重时，应该使用zj而不是zi作为旧策略。","start":4139.05,"end":4168.59},{"id":400,"text":"Because you're actually kind of creating synthetic data that is as if you were using ZJ. So yeah, sorry, I misspoke. And so you don't need to store which policy it came from. Okay, so you need the reward function. Oh, the other thing is you need the reward function form here. You need to actually compute the rewards for the new task. That's also important as well. Or you need to have learned the reward function. You need the reward function. The dynamics has to be consistent, and you have to be using an off-policy algorithm.","zh":"因为你实际上是在创建合成数据，就像你使用ZJ一样。所以是的，抱歉，我刚才说错了。因此，你不需要存储数据来自哪个策略。好的，所以你需要奖励函数。哦，另外一点是你需要这里的奖励函数形式。你需要实际计算新任务的奖励。这也是很重要的。或者你需要已经学习了奖励函数。你需要奖励函数。动态模型必须保持一致，并且你必须使用离策略算法。","start":4169.84,"end":4196.47},{"id":401,"text":"And then lastly is the goal condition version. This is basically the same as before, but our reward function is now this negative distance between states. And for continuous states, this could be like mean squared error, could be a distance in embedding space, or it could be a 0-1 loss within some epsilon ball of the goal state.","zh":"最后是目标条件版本。这基本上和之前的情况相同，但我们的奖励函数现在是状态之间负距离。对于连续状态，这可以是均方误差，可以是在嵌入空间中的距离，或者是在目标状态的某个epsilon球内的0-1损失。","start":4197.69,"end":4218.25}],"notes":["本段讨论了在多任务强化学习中，当使用重要性权重时，需要考虑数据的来源策略。讲者指出，当数据被重新标记为离策略数据时，应使用离策略算法进行更新，并且需要使用ZJ作为旧策略，而不是ZI。这表明在处理不同任务的数据时，需要明确区分策略的来源。","讲者随后澄清了关于重要性权重的使用，指出由于数据已经被修改，因此不需要存储原始策略的信息。这说明在合成数据的生成过程中，策略的来源信息可能不再必要，但需要确保奖励函数的正确性。","在讨论奖励函数时，讲者强调了奖励函数形式的重要性，指出需要计算新任务的奖励或已学习的奖励函数。同时，动态模型需要保持一致，并且必须使用离策略算法。这表明在多任务设置中，奖励函数和动态模型的一致性是关键。","最后，讲者介绍了目标条件版本，其中奖励函数被定义为状态之间的负距离。对于连续状态，可以使用均方误差、嵌入空间中的距离或在目标状态的ε球内的0-1损失。这说明了在目标导向任务中，奖励函数的设计可以有多种方式，具体取决于任务需求。"],"formulas":[{"latex":"r(s, a) = -d(s, g)","symbols":"奖励函数为状态与目标状态之间的负距离","explanation":"公式正确，奖励函数定义为状态与目标状态之间距离的负数，适用于连续状态空间中的目标导向任务","evidence":"And then lastly is the goal condition version. This is basically the same as before, but our reward function is now this negative distance between states. And for continuous states, this could be like mean squared error, could be a distance in embedding space, or it could be a 0-1 loss within some epsilon ball of the goal state."}],"uncertainties":[],"diagram":"none","start":4109.75,"end":4218.25,"asr_flags":[],"math_clarifications":["公式中的奖励函数定义符合目标导向任务的常见形式，其中负距离表示与目标状态的接近程度。"],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":4109.75,"text":"The action here, this was the action that was taken by the policy when conditioned on ZI. And when conditioned on ZJ, the policy might have done something different. And so this data that we're relabeling is going to be off-policy data. And so that means that we should, when we're updating Pytheta, we really need to be using an off-policy algorithm because this data is not following the policy conditioned on ZJ."},{"start":4139.05,"text":"Yeah, exactly. So if you're going to be using importance weights, you need to store which policy collected the data in the first place. Well, actually, sorry, let me think about that. This data is actually changed from the original data. And so actually, you'll want to use, for the importance weights, you'll actually want to use zj, not zi, as the old policy."},{"start":4169.84,"text":"Because you're actually kind of creating synthetic data that is as if you were using ZJ. So yeah, sorry, I misspoke. And so you don't need to store which policy it came from. Okay, so you need the reward function. Oh, the other thing is you need the reward function form here. You need to actually compute the rewards for the new task. That's also important as well. Or you need to have learned the reward function. You need the reward function. The dynamics has to be consistent, and you have to be using an off-policy algorithm."},{"start":4197.69,"text":"And then lastly is the goal condition version. This is basically the same as before, but our reward function is now this negative distance between states. And for continuous states, this could be like mean squared error, could be a distance in embedding space, or it could be a 0-1 loss within some epsilon ball of the goal state."}],"speech_gaps":[],"frame":"../frames/v022/025.webp","frame_time":4121.75}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v022.mp4"}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
