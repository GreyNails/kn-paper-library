n you explore that in your synthetic data,","start":668.29,"end":671.19},{"id":90,"text":"a better policy by using this kind of data.","start":672.35,"end":674.11},{"id":91,"text":"a better policy by using this kind of data.","start":674.11,"end":676.63},{"id":92,"text":"In terms of convergence speed or kind of speed in which you'll get a good policy,","start":677.57,"end":682.43},{"id":93,"text":"the generally this will allow you to, it might require, generally the thing that we're often","start":683.03,"end":691.55},{"id":94,"text":"trying to minimize is the amount of real data that we need right here. And this will allow","start":691.55,"end":696.95},{"id":95,"text":"you to get a good policy with less real data by using these red trajectories. Yeah, so the","start":696.95,"end":703.73},{"id":96,"text":"The question is, how do we get rewards in this case?","start":703.73,"end":705.29}],"notes":["本段讨论了在多任务强化学习中，如何通过生成数据来补充真实数据，并利用这些数据来更新策略。讲者提到，生成的数据可以用于训练策略，从而减少对真实数据的依赖。生成的数据可能来自模型内部的模拟环境，而不是真实环境。","讲者指出，生成的数据可能无法保证一定达到目标，但通过强化学习算法，可以理解这些数据并从中学习。生成的数据可能包含一些状态，这些状态在真实数据中可能没有出现，从而帮助策略学习。","讲者举了一个例子，说明生成的数据可能帮助学习更优的策略。例如，真实轨迹可能不是最直接的路径，而生成的数据可能包含更优的路径，从而帮助策略学习。","讲者提到，生成数据的一个优势是减少对真实数据的需求，从而加快策略收敛的速度。这可能意味着在训练过程中，可以使用较少的真实数据来获得较好的策略。","讲者最后提出了一个问题，即如何在生成数据的情况下获得奖励。这可能涉及到如何将生成的数据与奖励机制结合起来，以确保策略学习的有效性。","整个段落强调了生成数据在多任务强化学习中的作用，以及如何通过生成数据来补充真实数据，从而提高策略学习的效率。"],"formulas":[],"uncertainties":["the when you're further this","you this data won't necessarily reach the goal but you with","reinforcement learning algorithms you'll be able to understand like some of this","this data might feed into states that are in the data.","these red trajectories"],"diagram":"none","start":528.17,"end":705.29,"asr_flags":[75],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":528.17,"text":"starting from S, but then we'll be doing this rollout inside your learned model. And so this will be inside the world that is instantiated from your learned model and not in the real environment. This data will go into some other data set. Maybe we can..."},{"start":563.47,"text":"call it dgen for degenerated data."},{"start":568.69,"text":"And then at the end, you can simply"},{"start":572.69,"text":"update your policy using both the real data"},{"start":576.35,"text":"and the generated data."},{"start":578.35,"text":"So update pi theta using dn and degenerated."},{"start":593.47,"text":"and then repeat this process."},{"start":595.91,"text":"Whoops, I misspelled real."},{"start":602.73,"text":"So the question is, if you're only generating short trajectories,"},{"start":605.83,"text":"does that take longer to converge to some goal?"},{"start":611.93,"text":"So you can think of it as kind of supplementing the data"},{"start":620.73,"text":"that you have so far."},{"start":621.71,"text":"and the things that are like the things in your when you start from states that"},{"start":626.45,"text":"are closer to the goal from when you generate data there then you'll be close"},{"start":634.03,"text":"to getting rewards and you'll be able to update the when you're further this"},{"start":638.87,"text":"doesn't mean that you this data won't necessarily reach the goal but you with"},{"start":643.29,"text":"reinforcement learning algorithms you'll be able to understand like some of this"},{"start":648.67,"text":"this data might feed into states that are in the data."},{"start":652.97,"text":"When you use reinforcement learning,"},{"start":655.01,"text":"you can then learn that, as an example,"},{"start":657.79,"text":"maybe you have a real trajectory that takes"},{"start":660.69,"text":"a path that is maybe not the most direct path,"},{"start":663.23,"text":"and then you start learning a policy that knows,"},{"start":666.55,"text":"maybe I should shortcut this,"},{"start":668.29,"text":"then your model, when you explore that in your synthetic data,"},{"start":672.35,"text":"this might actually help you learn"},{"start":674.11,"text":"a better policy by using this kind of data."},{"start":677.57,"text":"In terms of convergence speed or kind of speed in which you'll get a good policy,"},{"start":683.03,"text":"the generally this will allow you to, it might require, generally the thing that we're often"},{"start":691.55,"text":"trying to minimize is the amount of real data that we need right here. And this will allow"},{"start":696.95,"text":"you to get a good policy with less real data by using these red trajectories. Yeah, so the"},{"start":703.73,"text":"The question is, how do we get rewards in this case?"}],"speech_gaps":[],"frame":"../frames/v022/004.webp","frame_time":540.17},{"title":"多任务强化学习中的奖励函数与计算开销","segments":[{"id":97,"text":"I haven't explicitly written out here,","start":707.47,"end":709.19},{"id":98,"text":"because sometimes you might know the form of the reward","start":709.27,"end":714.31},{"id":99,"text":"function, or you might have learned a reward","start":714.31,"end":719.59},{"id":100,"text":"function in the original RL problem, in which case","start":719.59,"end":722.97},{"id":101,"text":"you can use that.","start":722.97,"end":723.59},{"id":102,"text":"if you don't","start":723.59,"end":724.93},{"id":103,"text":"if you don't, if you didn't learn a reward function and the real world just gives you the rewards as part of this data, then when you train this model, you'll need for it to, either this model or a separate model, to also learn a reward function with supervised learning.","start":727.13,"end":742.79},{"id":104,"text":"So the question was about compute. So this is going to be more compute intensive during training than if you were to not use this, especially because sometimes the models that you might be learning, in some cases, the models that you're learning usually rolling out through them takes compute.","start":743.9,"end":762.84},{"id":105,"text":"you're trading data in the environment for compute. One of the reasons why that trade-off is often favorable is because collecting online data in the real environment might be unsafe, or it might just be really expensive if you have to run experiments on physical equipment.","start":763.64,"end":779.6},{"id":106,"text":"The unlike planning, however, this is not more compute intensive at test time because you're using the synthetic data to update a policy. And then at test time, you're running that policy as your final behavior. Cool. So the algorithm on the slides, we collect data, we update our model. This model may also model rewards by trying to mimic the data from the environment.","start":781.41,"end":809.9},{"id":107,"text":"Then we will collect these short rollouts by kind of using our model, starting from states in the real data, and then we'll update the policy and optionally also update any sort of value function using the aggregated data.","start":810.51,"end":836.45},{"id":108,"text":"It is compatible with a variety of reinforcement learning algorithms.","start":837.1,"end":840.64},{"id":109,"text":"So step four, you can use a variety of algorithms here.","start":840.96,"end":845.4},{"id":110,"text":"You can even use on-policy reinforcement learning algorithms as well.","start":846.22,"end":850.74},{"id":111,"text":"In particular, if you have an on-policy algorithm that needs data from the exact pi theta that you're taking a gradient step on,","start":851.64,"end":860.18},{"id":112,"text":"all that means is that pi theta has to be the policy that was collecting the synthetic data through the model.","start":860.8,"end":866.68},{"id":113,"text":"Cool. So with regards to this last update,","start":871.52,"end":874.88},{"id":114,"text":"here we're using both the data","start":876.58,"end":878.7},{"id":115,"text":"from the environment and the data from the model.","start":878.7,"end":880.36},{"id":116,"text":"There are actually also some policy updates that only use data","start":880.72,"end":884.62}],"notes":["本段讨论了在多任务强化学习中，是否需要显式地学习奖励函数的问题。如果奖励函数已经通过原始强化学习问题学习得到，可以直接使用；否则，需要通过监督学习来学习奖励函数。这增加了训练时的计算开销。","计算开销的增加是因为模型在训练过程中需要处理合成数据，而合成数据的生成可能需要较多的计算资源。这种计算开销的增加在训练阶段尤为明显，而在测试阶段则不会增加，因为测试时直接运行学习到的策略。","在多任务强化学习中，使用合成数据可以减少对真实环境数据的依赖，从而避免在真实环境中收集数据可能带来的安全风险或高昂成本。这种数据与计算的权衡在实际应用中是常见的。","该方法兼容多种强化学习算法，包括基于策略的算法。如果使用基于策略的算法，需要确保策略在训练过程中使用的是生成合成数据的策略，以保证数据的一致性。","在更新策略时，可以同时使用真实环境的数据和模型生成的数据。这种混合数据的使用有助于提高策略的泛化能力和稳定性。","在某些情况下，策略更新可能仅使用模型生成的数据，这取决于具体的应用场景和算法需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":707.47,"end":884.62,"asr_flags":[102],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":707.47,"text":"I haven't explicitly written out here,"},{"start":709.27,"text":"because sometimes you might know the form of the reward"},{"start":714.31,"text":"function, or you might have learned a reward"},{"start":719.59,"text":"function in the original RL problem, in which case"},{"start":722.97,"text":"you can use that."},{"start":723.59,"text":"if you don't"},{"start":727.13,"text":"if you didn't learn a reward function and the real world just gives you the rewards as part of this data, then when you train this model, you'll need for it to, either this model or a separate model, to also learn a reward function with supervised learning."},{"start":743.9,"text":"So the question was about compute. So this is going to be more compute intensive during training than if you were to not use this, especially because sometimes the models that you might be learning, in some cases, the models that you're learning usually rolling out through them takes compute."},{"start":763.64,"text":"you're trading data in the environment for compute. One of the reasons why that trade-off is often favorable is because collecting online data in the real environment might be unsafe, or it might just be really expensive if you have to run experiments on physical equipment."},{"start":781.41,"text":"The unlike planning, however, this is not more compute intensive at test time because you're using the synthetic data to update a policy. And then at test time, you're running that policy as your final behavior. Cool. So the algorithm on the slides, we collect data, we update our model. This model may also model rewards by trying to mimic the data from the environment."},{"start":810.51,"text":"Then we will collect these short rollouts by kind of using our model, starting from states in the real data, and then we'll update the policy and optionally also update any sort of value function using the aggregated data. One other thing to note about this is that"},{"start":837.1,"text":"It is compatible with a variety of reinforcement learning algorithms."},{"start":840.96,"text":"So step four, you can use a variety of algorithms here."},{"start":846.22,"text":"You can even use on-policy reinforcement learning algorithms as well."},{"start":851.64,"text":"In particular, if you have an on-policy algorithm that needs data from the exact pi theta that you're taking a gradient step on,"},{"start":860.8,"text":"all that means is that pi theta has to be the policy that was collecting the synthetic data through the model."},{"start":871.52,"text":"Cool. So with regards to this last update,"},{"start":876.58,"text":"here we're using both the data"},{"start":878.7,"text":"from the environment and the data from the model."},{"start":880.72,"text":"There are actually also some policy updates that only use data"}],"speech_gaps":[],"frame":"../frames/v022/005.webp","frame_time":719.47},{"title":"合成数据与模型强化学习的稳定性","segments":[{"id":117,"text":"from the model and find that that works fine as well.","start":884.62,"end":888.86},{"id":118,"text":"So you can choose to use either both","start":891.44,"end":893.14},{"id":119,"text":"or just use the data from the model.","start":893.14,"end":895.56},{"id":120,"text":"Yeah, so this only makes sense when you have an estimate of the reward function,","start":896.34,"end":899.8},{"id":121,"text":"and if you don't, then you won't be able to update your policy on the generated data.","start":899.98,"end":905.4},{"id":122,"text":"So the question is, is the learning stable when you use the synthetic data?","start":906.34,"end":909.46},{"id":123,"text":"Yeah, yeah. So you may be in a scenario where you're adding a lot of synthetic data,","start":913.4,"end":919.5},{"id":124,"text":"and so how much synthetic data you generate and how you balance that data in this last update","start":919.66,"end":925.04},{"id":125,"text":"is like kind of might depend on like how good you think your model is. In terms of stability,","start":925.04,"end":930.98},{"id":126,"text":"I think that like we'll talk about pros and cons on the next slide, but one downside of","start":934.02,"end":939.32},{"id":127,"text":"these kinds of algorithms is they do introduce additional hyperparameters because you have to","start":939.32,"end":944.52},{"id":128,"text":"train this model. And if, for example, your model training like for whatever reason it didn't do","start":944.52,"end":950.56},{"id":129,"text":"do well, then you might end up in a scenario","start":950.56,"end":952.68},{"id":130,"text":"where the algorithm performs more poorly","start":952.68,"end":957.04},{"id":131,"text":"because those hyperparameters weren't well-tuned.","start":957.04,"end":959.48},{"id":132,"text":"And so you can see issues there.","start":959.7,"end":961.46},{"id":133,"text":"But otherwise, if you have a fairly accurate model,","start":962.98,"end":972.16},{"id":134,"text":"you usually don't have issues otherwise with stability.","start":972.82,"end":975.6},{"id":135,"text":"So let's talk a little bit about when to use this sort of synthetic data and when to use","start":978.66,"end":984.22},{"id":136,"text":"model-based reinforcement learning. So generally the way to think about it is that there's","start":984.22,"end":989.72},{"id":137,"text":"potentially really big upsides with model-based reinforcement learning and also potentially big","start":989.72,"end":994.36},{"id":138,"text":"downsides. The big upside is that if you can learn a pretty good model, then","start":994.36,"end":1002.16},{"id":139,"text":"it is immensely useful to be able to predict the future. And you can get away with using far, far less real data by using the data that's generated. And so in domains where it's feasible to learn a model, it's really, really useful. You could also do the test time planning as well. And generally, I guess,","start":1003.1,"end":1025.52},{"id":140,"text":"Maybe one other point that's not on the slides with regard to upsides is that it seems like this notion of being able to anticipate future states as an outcome of your actions, that seems like a fairly fundamental thing that our models should at least have some understanding for.","start":1026.12,"end":1040.58}],"notes":["本段讨论了在使用合成数据进行强化学习时的稳定性问题。讲者指出，当模型能够估计奖励函数时，使用合成数据是可行的，但如果无法估计奖励函数，则无法通过生成数据更新策略。此外，讲者提到使用合成数据时，学习的稳定性取决于模型的质量，如果模型训练效果不佳，可能会导致算法性能下降。","讲者进一步指出，模型强化学习具有显著的优势和劣势。优势在于，如果模型足够准确，可以大幅减少对真实数据的依赖，并且可以进行测试时的规划。劣势则包括引入额外的超参数，以及模型训练效果不佳可能导致的性能问题。","讲者还提到，模型强化学习的一个重要优势是能够预测未来状态，这是模型应具备的基本能力之一。这种能力使得模型能够更好地理解行为与未来状态之间的关系，从而提升整体性能。","讲者强调，模型强化学习的使用场景取决于模型的准确性。如果模型足够准确，通常不会出现稳定性问题。但如果模型训练效果不佳，可能会导致算法性能下降，因此需要仔细调整超参数。","讲者还提到，模型强化学习的另一个优势是可以在测试时进行规划，这在某些应用场景中非常有用。此外，模型能够预测未来状态的能力是其核心优势之一。","讲者最后指出，模型强化学习的使用需要权衡其优缺点。虽然模型训练可能引入额外的复杂性，但在某些领域，如模型可以准确学习的情况下，其优势是显著的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":884.62,"end":1040.58,"asr_flags":[133],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":884.62,"text":"from the model and find that that works fine as well."},{"start":891.44,"text":"So you can choose to use either both"},{"start":893.14,"text":"or just use the data from the model."},{"start":896.34,"text":"Yeah, so this only makes sense when you have an estimate of the reward function,"},{"start":899.98,"text":"and if you don't, then you won't be able to update your policy on the generated data."},{"start":906.34,"text":"So the question is, is the learning stable when you use the synthetic data?"},{"start":913.4,"text":"Yeah, yeah. So you may be in a scenario where you're adding a lot of synthetic data,"},{"start":919.66,"text":"and so how much synthetic data you generate and how you balance that data in this last update"},{"start":925.04,"text":"is like kind of might depend on like how good you think your model is. In terms of stability,"},{"start":934.02,"text":"I think that like we'll talk about pros and cons on the next slide, but one downside of"},{"start":939.32,"text":"these kinds of algorithms is they do introduce additional hyperparameters because you have to"},{"start":944.52,"text":"train this model. And if, for example, your model training like for whatever reason it didn't do"},{"start":950.56,"text":"do well, then you might end up in a scenario"},{"start":952.68,"text":"where the algorithm performs more poorly"},{"start":957.04,"text":"because those hyperparameters weren't well-tuned."},{"start":959.7,"text":"And so you can see issues there."},{"start":962.98,"text":"But otherwise, if you have a fairly accurate model,"},{"start":972.82,"text":"you usually don't have issues otherwise with stability."},{"start":978.66,"text":"So let's talk a little bit about when to use this sort of synthetic data and when to use"},{"start":984.22,"text":"model-based reinforcement learning. So generally the way to think about it is that there's"},{"start":989.72,"text":"potentially really big upsides with model-based reinforcement learning and also potentially big"},{"start":994.36,"text":"downsides. The big upside is that if you can learn a pretty good model, then"},{"start":1003.1,"text":"it is immensely useful to be able to predict the future. And you can get away with using far, far less real data by using the data that's generated. And so in domains where it's feasible to learn a model, it's really, really useful. You could also do the test time planning as well. And generally, I guess,"},{"start":1026.12,"text":"Maybe one other point that's not on the slides with regard to upsides is that it seems like this notion of being able to anticipate future states as an outcome of your actions, that seems like a fairly fundamental thing that our models should at least have some understanding for."}],"speech_gaps":[{"start":889.26,"end":891.04},{"start":931.38,"end":932.928}],"frame":"../frames/v022/006.webp","frame_time":896.62},{"title":"多任务强化学习中的模型训练与挑战","segments":[{"id":141,"text":"One other thing that we actually didn't talk about is there are also scenarios where the model can be trained without reward labels. And for example, if some of your real data has rewards and some of it doesn't have rewards, the part that doesn't have rewards, you can train your model on. And your model can actually leverage potentially more data than what a model-free reinforcement learning method can use.","start":1043.28,"end":1068.36},{"id":142,"text":"That's quite nice. And there are scenarios where you might be able to collect very large amounts of data without rewards and a small amount of data with rewards. And then the other thing is that the model is somewhat task agnostic. And so if it was trained on a broad enough data distribution, sometimes you can transfer this model across different tasks or across different rewards. And so, for example, if your goal isn't just to learn one task, but to learn many different tasks, this sort of transferability is useful.","start":1070.93,"end":1100.81},{"id":143,"text":"So those are the big upsides. What about the big downsides? One downside is that the model doesn't optimize for task performance. And errors, because it's trying to like, for example, if you have image observations or your states are images, then it's trying to get the details in the pixels to line up. And that, for example, the color of the sky is like the correct color, for example. And that, in some ways, oftentimes is...","start":1103.16,"end":1130.78},{"id":144,"text":"not actually what you care about in terms of learning a good policy. So there's this mismatch between what you're optimizing for when you train a model and what you actually might care about in terms of downstream policy performance.","start":1131.24,"end":1142.48},{"id":145,"text":"Sometimes it's really hard to learn a good model. Sometimes it's hard to learn a good model than it is to learn a good policy. In these cases, usually you don't want to learn models because you're kind of then presenting a harder problem than the actual downstream problem you might care about. And then the last thing that I alluded to before is that it's another thing you have to train. And so there's more hyperparameters and it's also more compute intensive.","start":1145.63,"end":1171.5},{"id":146,"text":"Because of these big upsides and big downsides, generally whether to try to learn this kind of predictive model depends a lot on the domain and how hard it is to learn that kind of model. Yeah, so the question was, what are a few examples of the additional hyperparameters? The main thing all comes down to this step two right here, which is that you need to design the architecture of the model.","start":1173.27,"end":1198.33},{"id":147,"text":"of this predictive model, and it might need to be a completely different architecture from the policy if you're going to be generating images or states. The second is that you need a learning rate, you need to know how long to train that for, like how many epochs, any regularization for that model, basically everything that might go into training a model like this.","start":1198.83,"end":1221.25}],"notes":["本段讨论了多任务强化学习中模型训练的优势与劣势。优势包括可以利用无奖励数据进行训练，从而获得更丰富的数据集，并且模型可以跨任务迁移。劣势则包括模型可能不直接优化任务性能，导致与实际策略性能之间的不匹配，以及训练模型可能比直接学习策略更困难，且需要更多计算资源。","讲者提到，当模型训练的目标与实际策略性能不一致时，可能会出现性能不匹配的问题。例如，模型可能过度关注像素细节，而这些细节对策略性能并不重要。","讲者指出，训练模型可能比直接学习策略更困难，因此在某些情况下，不建议使用模型。此外，模型训练需要更多的超参数和计算资源。","讲者提到，模型训练的额外超参数主要涉及模型架构的设计，例如是否需要与策略使用不同的架构，以及学习率、训练时长、正则化等参数。","讲者强调，是否采用这种预测模型取决于具体领域和模型的难易程度。在某些情况下，直接学习策略可能更有效率。","讲者最后提到，模型训练的额外超参数包括学习率、训练时长、正则化等，这些都是训练模型时需要考虑的重要因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1043.28,"end":1221.25,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1043.28,"text":"One other thing that we actually didn't talk about is there are also scenarios where the model can be trained without reward labels. And for example, if some of your real data has rewards and some of it doesn't have rewards, the part that doesn't have rewards, you can train your model on. And your model can actually leverage potentially more data than what a model-free reinforcement learning method can use."},{"start":1070.93,"text":"That's quite nice. And there are scenarios where you might be able to collect very large amounts of data without rewards and a small amount of data with rewards. And then the other thing is that the model is somewhat task agnostic. And so if it was trained on a broad enough data distribution, sometimes you can transfer this model across different tasks or across different rewards. And so, for example, if your goal isn't just to learn one task, but to learn many different tasks, this sort of transferability is useful."},{"start":1103.16,"text":"So those are the big upsides. What about the big downsides? One downside is that the model doesn't optimize for task performance. And errors, because it's trying to like, for example, if you have image observations or your states are images, then it's trying to get the details in the pixels to line up. And that, for example, the color of the sky is like the correct color, for example. And that, in some ways, oftentimes is..."},{"start":1131.24,"text":"not actually what you care about in terms of learning a good policy. So there's this mismatch between what you're optimizing for when you train a model and what you actually might care about in terms of downstream policy performance."},{"start":1145.63,"text":"Sometimes it's really hard to learn a good model. Sometimes it's hard to learn a good model than it is to learn a good policy. In these cases, usually you don't want to learn models because you're kind of then presenting a harder problem than the actual downstream problem you might care about. And then the last thing that I alluded to before is that it's another thing you have to train. And so there's more hyperparameters and it's also more compute intensive."},{"start":1173.27,"text":"Because of these big upsides and big downsides, generally whether to try to learn this kind of predictive model depends a lot on the domain and how hard it is to learn that kind of model. Yeah, so the question was, what are a few examples of the additional hyperparameters? The main thing all comes down to this step two right here, which is that you need to design the architecture of the model."},{"start":1198.83,"text":"of this predictive model, and it might need to be a completely different architecture from the policy if you're going to be generating images or states. The second is that you need a learning rate, you need to know how long to train that for, like how many epochs, any regularization for that model, basically everything that might go into training a model like this."}],"speech_gaps":[],"frame":"../frames/v022/007.webp","frame_time":1055.28},{"title":"多任务强化学习中的模型与策略学习对比","segments":[{"id":148,"text":"One more thing on that previous question.","start":1222.03,"end":1223.87},{"id":149,"text":"Beyond training this model, there's also hyper-priorities with regard to the length of these rollouts","start":1224.87,"end":1229.15},{"id":150,"text":"and how much synthetic data to generate.","start":1229.15,"end":1231.75},{"id":151,"text":"So the question is, do we keep on collecting data after each policy update?","start":1232.75,"end":1237.35},{"id":152,"text":"So this is, as written, this is like an online algorithm.","start":1237.71,"end":1242.89},{"id":153,"text":"You can actually also develop completely offline versions, model-based RL versions as well,","start":1243.23,"end":1248.73},{"id":154,"text":"where you have a fixed prior data set","start":1248.73,"end":1251.13},{"id":155,"text":"and you augment that data set with a model","start":1251.13,"end":1254.03},{"id":156,"text":"and then you trade a policy and you're done.","start":1254.03,"end":1255.83},{"id":157,"text":"In this case, we have an online algorithm","start":1257.07,"end":1258.99},{"id":158,"text":"where we then continue to kind of collect real data,","start":1258.99,"end":1262.05},{"id":159,"text":"update our model, and so forth.","start":1262.15,"end":1264.13},{"id":160,"text":"This can be done in an off-policy way or an on-policy way.","start":1267.05,"end":1270.01},{"id":161,"text":"So that's going to come down to when you do this update,","start":1270.31,"end":1273.65},{"id":162,"text":"Is it going to only use the DN and the DGEN from this iteration or also from previous iterations?","start":1273.65,"end":1280.91},{"id":163,"text":"And that's going to depend on what algorithm you use to update your policy.","start":1282.51,"end":1285.49},{"id":164,"text":"So generally, models are very flexible. You can use them offline, on policy, off policy, and so forth.","start":1286.57,"end":1292.61},{"id":165,"text":"Yeah, so the question is, how hard is it to learn a model compared to a policy?","start":1293.59,"end":1298.75},{"id":166,"text":"see. Uh, it's extremely domain dependent. So the, um, say for example, you are, say you're in like","start":1298.75,"end":1307.59},{"id":167,"text":"a maze. Uh, so you're trying to learn like how to get from here to here. Maybe there's like some","start":1307.59,"end":1314.81},{"id":168,"text":"some walls, you need to kind of figure out how to.","start":1314.81,"end":1319.13},{"id":169,"text":"kind of get through this sort of environment, and you're not able to go through the walls. In this case, the model might be quite easy to learn. You'll learn that if your action is to go right, then you'll go right unless there's a wall there. If you're going to go up and so forth, that's really easy.","start":1319.95,"end":1336.25},{"id":170,"text":"But the policy is really complicated because the policy is saying that if you're here, maybe you need to go in various different directions. And so this is a case where the policy is a lot more complicated than the model, and learning a model could be a good choice. As another example, say that you're trying to pour some water from one cup into a bowl or something like that.","start":1336.73,"end":1363.11},{"id":171,"text":"the policy might be potentially fairly simple. Maybe you're already even holding the cup in your hand. Then the policy might be as simple as just rotating your wrist.","start":1363.63,"end":1375.41},{"id":172,"text":"But the model in this sort of case might involve the fluid dynamics of how the water will pour","start":1376.59,"end":1382.21},{"id":173,"text":"and what will happen, for example, if it hits the edge of the bowl or the center of the bowl","start":1382.21,"end":1387.33},{"id":174,"text":"or something like that.","start":1387.33,"end":1388.41},{"id":175,"text":"And this is a scenario where the model is a lot more complicated than the policy.","start":1388.61,"end":1392.85},{"id":176,"text":"And it's possible that it would be, yeah, in this scenario,","start":1394.17,"end":1397.97},{"id":177,"text":"it might be a lot easier to just learn the policy without learning the model.","start":1398.05,"end":1400.67}],"notes":["本段讨论了在多任务强化学习中，模型与策略学习的难易程度取决于具体任务领域。在某些情况下，如迷宫导航，模型可能更容易学习，因为其行为规则相对简单，而策略需要处理复杂的路径选择。而在其他情况下，如倒水任务，模型可能更复杂，因为需要建模流体动力学，而策略可能相对简单。","讲者通过两个具体例子说明了模型与策略的复杂性差异。在迷宫中，模型可以学习到简单的移动规则，而策略需要处理复杂的路径规划。而在倒水任务中，模型需要建模流体动力学，而策略可能只需简单的动作。","讲者指出，模型和策略的学习难度是高度依赖于任务的。因此，在设计多任务强化学习系统时，需要根据具体任务选择是否优先学习模型或策略。","讲者提到，模型可以用于离线或在线学习，而策略的学习方式则取决于具体的算法和任务需求。","讲者强调，模型和策略的学习难度并非绝对，而是取决于任务的性质。因此，在实际应用中，需要根据任务的具体情况来决定学习模型还是策略。","讲者通过两个例子说明了模型和策略的复杂性差异，并指出在某些情况下，学习模型可能比学习策略更容易，而在其他情况下则相反。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1222.03,"end":1400.67,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1222.03,"text":"One more thing on that previous question."},{"start":1224.87,"text":"Beyond training this model, there's also hyper-priorities with regard to the length of these rollouts"},{"start":1229.15,"text":"and how much synthetic data to generate."},{"start":1232.75,"text":"So the question is, do we keep on collecting data after each policy update?"},{"start":1237.71,"text":"So this is, as written, this is like an online algorithm."},{"start":1243.23,"text":"You can actually also develop completely offline versions, model-based RL versions as well,"},{"start":1248.73,"text":"where you have a fixed prior data set"},{"start":1251.13,"text":"and you augment that data set with a model"},{"start":1254.03,"text":"and then you trade a policy and you're done."},{"start":1257.07,"text":"In this case, we have an online algorithm"},{"start":1258.99,"text":"where we then continue to kind of collect real data,"},{"start":1262.15,"text":"update our model, and so forth."},{"start":1267.05,"text":"This can be done in an off-policy way or an on-policy way."},{"start":1270.31,"text":"So that's going to come down to when you do this update,"},{"start":1273.65,"text":"Is it going to only use the DN and the DGEN from this iteration or also from previous iterations?"},{"start":1282.51,"text":"And that's going to depend on what algorithm you use to update your policy."},{"start":1286.57,"text":"So generally, models are very flexible. You can use them offline, on policy, off policy, and so forth."},{"start":1293.59,"text":"Yeah, so the question is, how hard is it to learn a model compared to a policy?"},{"start":1298.75,"text":"see. Uh, it's extremely domain dependent. So the, um, say for example, you are, say you're in like"},{"start":1307.59,"text":"a maze. Uh, so you're trying to learn like how to get from here to here. Maybe there's like some"},{"start":1314.81,"text":"some walls, you need to kind of figure out how to."},{"start":1319.95,"text":"kind of get through this sort of environment, and you're not able to go through the walls. In this case, the model might be quite easy to learn. You'll learn that if your action is to go right, then you'll go right unless there's a wall there. If you're going to go up and so forth, that's really easy."},{"start":1336.73,"text":"But the policy is really complicated because the policy is saying that if you're here, maybe you need to go in various different directions. And so this is a case where the policy is a lot more complicated than the model, and learning a model could be a good choice. As another example, say that you're trying to pour some water from one cup into a bowl or something like that."},{"start":1363.63,"text":"the policy might be potentially fairly simple. Maybe you're already even holding the cup in your hand. Then the policy might be as simple as just rotating your wrist."},{"start":1376.59,"text":"But the model in this sort of case might involve the fluid dynamics of how the water will pour"},{"start":1382.21,"text":"and what will happen, for example, if it hits the edge of the bowl or the center of the bowl"},{"start":1387.33,"text":"or something like that."},{"start":1388.61,"text":"And this is a scenario where the model is a lot more complicated than the policy."},{"start":1394.17,"text":"And it's possible that it would be, yeah, in this scenario,"},{"start":1398.05,"text":"it might be a lot easier to just learn the policy without learning the model."}],"speech_gaps":[{"start":1264.592,"end":1266.65}],"frame":"../frames/v022/008.webp","frame_time":1234.03},{"title":"模型基础强化学习的适用性与模型类型","segments":[{"id":178,"text":"So it really depends on the domain.","start":1400.97,"end":1402.45},{"id":179,"text":"Yeah, so the question is, how successful has model-based RL been?","start":1403.29,"end":1406.17},{"id":180,"text":"in robotics scenarios, if you're dealing","start":1406.59,"end":1412.87},{"id":181,"text":"with high-dimensional image observations,","start":1412.87,"end":1414.67},{"id":182,"text":"it's arguably been less successful.","start":1415.51,"end":1417.57},{"id":183,"text":"If you have a more compact state space,","start":1417.75,"end":1420.89},{"id":184,"text":"like the positions of joints and positions of objects,","start":1421.11,"end":1423.83},{"id":185,"text":"then it's been a lot more successful.","start":1424.09,"end":1426.37},{"id":186,"text":"With legged robots, for example,","start":1429.15,"end":1431.49},{"id":187,"text":"you can use model-based RL pretty successfully.","start":1431.65,"end":1435.23},{"id":188,"text":"successfully if you're mostly just trying to learn a blind walking policy. Or if we saw the","start":1435.23,"end":1441.75},{"id":189,"text":"dexterous hand manipulation where you knew the position of the two balls, it was also very","start":1441.75,"end":1447.25},{"id":190,"text":"successful for that. And I haven't tried to do model-free RL for that problem. Or even imitation","start":1447.25,"end":1453.11},{"id":191,"text":"learning would be very, very challenging. And so it's been extremely successful there. In scenarios","start":1453.11,"end":1457.97},{"id":192,"text":"where you have image observations, it gets a lot harder. It doesn't mean that","start":1457.97,"end":1462.47},{"id":193,"text":"video generative models are getting a lot better, and so I can see a future where this sort of approach might also be quite successful in the future, but right now it hasn't been super successful. The last thing that I'll mention on model-based RL is that so far we've been modeling this predictive model of the future, and there's actually a lot of other objects that you could learn.","start":1464.09,"end":1491.79},{"id":194,"text":"You could learn what's called an inverse model. You could learn for two states, what was the action that led to... If I'm currently in state st, what is the action that would lead to state st plus 1? You could learn a multi-step inverse model, which is that if I'm going to end up at state st plus n, what action would lead me there, or what are the sequence of actions that would lead me there? This actually looks...","start":1493.71,"end":1520.34},{"id":195,"text":"Both of these in some ways look closer to a policy, except you're passing as input some future state rather than just the current state. These are also things that can be learned without data with rewards. You're kind of just learning about the environment and not about the particular task at hand.","start":1520.74,"end":1538.48},{"id":196,"text":"You can predict futures without actions, and that kind of can think about what are the affordances in my environment, what are the things that could be possible to happen in the future, irrespective of the actions that I take. You could try to interpolate between two states. You could learn a derivative model of transitions of ST, AT, ST plus 1. There's kind of some cool properties with that sort of model.","start":1540.02,"end":1568.22},{"id":197,"text":"these kind of models can be pretty useful","start":1571.64,"end":1573.66},{"id":198,"text":"too. They have various purposes","start":1573.66,"end":1575.28},{"id":199,"text":"there's lots of research on","start":1576.04,"end":1577.52},{"id":200,"text":"using different kinds of models like these","start":1577.52,"end":1579.08}],"notes":["本段讨论了模型基础强化学习（model-based RL）在不同任务中的成功程度。在机器人学场景中，如果处理的是高维图像观测，模型基础强化学习的效果可能不如在紧凑状态空间中（如关节位置和物体位置）的效果好。例如，腿式机器人可以成功使用模型基础强化学习，而像灵巧手操作这样的任务，如果已知物体位置，也能取得成功。但图像观测会增加难度，目前模型基础强化学习在这些场景中尚未非常成功。","讲者提到，除了预测模型外，还可以学习逆模型（inverse model），即从两个状态推断出导致状态变化的动作。逆模型可以是单步或多步的，用于预测未来状态所需的动作序列。这些模型与策略类似，但输入是未来状态而非当前状态，且可以在没有奖励数据的情况下学习环境特性。","讲者进一步指出，可以预测未来状态而不依赖动作，从而思考环境中可能发生的事件，无论采取什么动作。此外，可以学习状态转移的导数模型，这在某些场景下具有有趣的性质。","这些模型在不同任务中具有多种用途，已有大量研究探讨如何使用这些模型。讲者强调，这些模型可以用于预测未来、理解环境特性，而不仅仅是完成特定任务。","讲者提到，模型基础强化学习的未来可能更加成功，尤其是在视频生成模型进步的情况下。但目前在图像观测场景中，模型基础强化学习尚未达到很高的成功率。","讲者最后指出，除了预测模型外，还有许多其他模型可以学习，如逆模型和导数模型，这些模型在不同任务中具有不同的用途。"],"formulas":[],"uncertainties":["ST, AT, ST plus 1"],"diagram":"none","start":1400.97,"end":1579.08,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1400.97,"text":"So it really depends on the domain."},{"start":1403.29,"text":"Yeah, so the question is, how successful has model-based RL been?"},{"start":1406.59,"text":"in robotics scenarios, if you're dealing"},{"start":1412.87,"text":"with high-dimensional image observations,"},{"start":1415.51,"text":"it's arguably been less successful."},{"start":1417.75,"text":"If you have a more compact state space,"},{"start":1421.11,"text":"like the positions of joints and positions of objects,"},{"start":1424.09,"text":"then it's been a lot more successful."},{"start":1429.15,"text":"With legged robots, for example,"},{"start":1431.65,"text":"you can use model-based RL pretty successfully."},{"start":1435.23,"text":"successfully if you're mostly just trying to learn a blind walking policy. Or if we saw the"},{"start":1441.75,"text":"dexterous hand manipulation where you knew the position of the two balls, it was also very"},{"start":1447.25,"text":"successful for that. And I haven't tried to do model-free RL for that problem. Or even imitation"},{"start":1453.11,"text":"learning would be very, very challenging. And so it's been extremely successful there. In scenarios"},{"start":1457.97,"text":"where you have image observations, it gets a lot harder. It doesn't mean that"},{"start":1464.09,"text":"video generative models are getting a lot better, and so I can see a future where this sort of approach might also be quite successful in the future, but right now it hasn't been super successful. The last thing that I'll mention on model-based RL is that so far we've been modeling this predictive model of the future, and there's actually a lot of other objects that you could learn."},{"start":1493.71,"text":"You could learn what's called an inverse model. You could learn for two states, what was the action that led to... If I'm currently in state st, what is the action that would lead to state st plus 1? You could learn a multi-step inverse model, which is that if I'm going to end up at state st plus n, what action would lead me there, or what are the sequence of actions that would lead me there? This actually looks..."},{"start":1520.74,"text":"Both of these in some ways look closer to a policy, except you're passing as input some future state rather than just the current state. These are also things that can be learned without data with rewards. You're kind of just learning about the environment and not about the particular task at hand."},{"start":1540.02,"text":"You can predict futures without actions, and that kind of can think about what are the affordances in my environment, what are the things that could be possible to happen in the future, irrespective of the actions that I take. You could try to interpolate between two states. You could learn a derivative model of transitions of ST, AT, ST plus 1. There's kind of some cool properties with that sort of model."},{"start":1571.64,"text":"these kind of models can be pretty useful"},{"start":1573.66,"text":"too. They have various purposes"},{"start":1576.04,"text":"there's lots of research on"},{"start":1577.52,"text":"using different kinds of models like these"}],"speech_gaps":[{"start":1426.77,"end":1428.75}],"frame":"../frames/v022/009.webp","frame_time":1412.97},{"title":"多任务强化学习（Multi-Task RL）","segments":[{"id":201,"text":"and so it's just something to think","start":1579.08,"end":1581.66},{"id":202,"text":"about in terms of like in some domains","start":1581.66,"end":1583.62},{"id":203,"text":"you could imagine or with some","start":1583.62,"end":1584.94},{"id":204,"text":"data sources you could imagine scenarios","start":1584.94,"end":1587.56},{"id":205,"text":"where these might be useful.","start":1587.56,"end":1589.12},{"id":206,"text":"So the question is","start":1589.94,"end":1591.1},{"id":207,"text":"if you use data that doesn't have rewards","start":1591.1,"end":1593.58},{"id":208,"text":"as part of your model training","start":1593.58,"end":1595.32},{"id":209,"text":"is there going to be a mismatch between the accuracy","start":1595.32,"end":1597.34},{"id":210,"text":"of predicting next states and predicting rewards?","start":1597.34,"end":1599.66},{"id":211,"text":"Uh, the, um, there certainly could be, like, a mismatch like that.","start":1601.04,"end":1604.36},{"id":212,"text":"The, generally, rewards are a bit easier to learn how to predict than future states.","start":1604.64,"end":1612.46},{"id":213,"text":"Uh, and so the, um, even if you have a lot more data for learning the model,","start":1612.76,"end":1619.7},{"id":214,"text":"you could actually end up in a scenario where the model is less accurate than the estimated reward.","start":1619.78,"end":1623.74},{"id":215,"text":"Uh, but you, yeah, you can definitely end up with scenarios where the reward is less accurate","start":1624.58,"end":1628.84},{"id":216,"text":"and where you need to specifically gather data for that.","start":1628.84,"end":1632.8},{"id":217,"text":"Cool. Okay.","start":1636.92,"end":1638.1},{"id":218,"text":"So that's it for model-based RL.","start":1638.3,"end":1640.5},{"id":219,"text":"Now we're going to talk a bit about multitask learning","start":1641.32,"end":1644.3},{"id":220,"text":"and what that looks like,","start":1645.2,"end":1647.18},{"id":221,"text":"and also different techniques that we can do","start":1647.24,"end":1649.04},{"id":222,"text":"beyond a fairly naive and simple technique.","start":1649.04,"end":1651.44},{"id":223,"text":"So what is multitask reinforcement learning?","start":1653.68,"end":1656.82},{"id":224,"text":"The key idea is that we want to be able to generate, we want to be able to learn a generalist policy that isn't just aiming to do one thing, like being able to pour water, for example, but that can do many different things.","start":1658.14,"end":1673.78},{"id":225,"text":"The examples of this, we might want kind of a generalist language model assistant that can book travel for us, that can do online grocery shopping. We might want a legged robot that can walk, that can run, that can dance, that can crouch. Maybe a mobile robot that can hang up a towel, unload a dishwasher, wipe a spill. We want a music recommender system that can personalize recommendations for one person.","start":1676.76,"end":1701.55},{"id":226,"text":"and also be able to personalize recommendations to a different person. Or we might want something that can play lots of different games, like being able to play Pokemon and pinball and Flappy Bird and so forth. And there are scenarios where if you think about each of these tasks as their own reinforcement learning problem, they might have different reward functions from the other tasks. They might, in some cases, have different dynamics, like the dynamics of different games.","start":1702.14,"end":1730.71}],"notes":["本段讨论了在模型训练中使用无奖励数据时可能出现的不匹配问题，即预测下一状态和预测奖励之间的准确性差异。讲者指出，奖励通常比未来状态更容易学习，因此即使有大量数据，模型的准确性可能仍低于奖励估计。","接着，讲者转向多任务强化学习（Multi-Task RL）的概念，强调其目标是学习一个通用策略，能够完成多种任务，而不是仅专注于单一任务。","讲者列举了多个实际例子，如通用语言模型助手、腿部机器人、移动机器人和音乐推荐系统，说明多任务学习在不同应用场景中的价值。","此外，讲者提到，每个任务可能具有不同的奖励函数和动态特性，因此需要考虑这些差异以设计有效的多任务学习方法。","讲者还指出，多任务学习不仅仅是简单技术的扩展，而是需要更复杂的策略来处理不同任务之间的关系。","最后，讲者强调了多任务学习在现实世界中的重要性，特别是在需要处理多种任务和不同环境动态的场景中。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1579.08,"end":1730.71,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1579.08,"text":"and so it's just something to think"},{"start":1581.66,"text":"about in terms of like in some domains"},{"start":1583.62,"text":"you could imagine or with some"},{"start":1584.94,"text":"data sources you could imagine scenarios"},{"start":1587.56,"text":"where these might be useful."},{"start":1589.94,"text":"So the question is"},{"start":1591.1,"text":"if you use data that doesn't have rewards"},{"start":1593.58,"text":"as part of your model training"},{"start":1595.32,"text":"is there going to be a mismatch between the accuracy"},{"start":1597.34,"text":"of predicting next states and predicting rewards?"},{"start":1601.04,"text":"Uh, the, um, there certainly could be, like, a mismatch like that."},{"start":1604.64,"text":"The, generally, rewards are a bit easier to learn how to predict than future states."},{"start":1612.76,"text":"Uh, and so the, um, even if you have a lot more data for learning the model,"},{"start":1619.78,"text":"you could actually end up in a scenario where the model is less accurate than the estimated reward."},{"start":1624.58,"text":"Uh, but you, yeah, you can definitely end up with scenarios where the reward is less accurate"},{"start":1628.84,"text":"and where you need to specifically gather data for that."},{"start":1636.92,"text":"Cool. Okay."},{"start":1638.3,"text":"So that's it for model-based RL."},{"start":1641.32,"text":"Now we're going to talk a bit about multitask learning"},{"start":1645.2,"text":"and what that looks like,"},{"start":1647.24,"text":"and also different techniques that we can do"},{"start":1649.04,"text":"beyond a fairly naive and simple technique."},{"start":1653.68,"text":"So what is multitask reinforcement learning?"},{"start":1658.14,"text":"The key idea is that we want to be able to generate, we want to be able to learn a generalist policy that isn't just aiming to do one thing, like being able to pour water, for example, but that can do many different things."},{"start":1676.76,"text":"The examples of this, we might want kind of a generalist language model assistant that can book travel for us, that can do online grocery shopping. We might want a legged robot that can walk, that can run, that can dance, that can crouch. Maybe a mobile robot that can hang up a towel, unload a dishwasher, wipe a spill. We want a music recommender system that can personalize recommendations for one person."},{"start":1702.14,"text":"and also be able to personalize recommendations to a different person. Or we might want something that can play lots of different games, like being able to play Pokemon and pinball and Flappy Bird and so forth. And there are scenarios where if you think about each of these tasks as their own reinforcement learning problem, they might have different reward functions from the other tasks. They might, in some cases, have different dynamics, like the dynamics of different games."}],"speech_gaps":[],"frame":"../frames/v022/010.webp","frame_time":1591.08},{"title":"多任务强化学习的概念与数据效率","segments":[{"id":227,"text":"or the dynamics of different people. They might have different action spaces even. And so when you're trying to train policies across these different tasks, there's some considerations that come up when you try to do that. Now, the key idea that we'll see is that you can, in many cases, just go about normal reinforcement learning, but condition on the task that you're trying to learn.","start":1731.42,"end":1761.04},{"id":228,"text":"So you're then going to be learning a policy that is not just conditioned on the state, but it's also conditioned on the state and also the tasks that you want it to be performing for that state.","start":1761.61,"end":1779.77},{"id":229,"text":"So, if we kind of go back to a lot of the topics that we've talked about in the course so far, like imitation learning, on-policy and off-policy RL, offline RL, model-based RL, reward functions, a big topic that's recurred in many of these lectures is talking about data efficiency. Like, how much data do we need to be able to calculate a gradient that is accurate?","start":1781.28,"end":1805.4},{"id":230,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios.","start":1809.16,"end":1822.84},{"id":231,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios.","start":1823.98,"end":1842.2},{"id":232,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things.","start":1843.08,"end":1868.32},{"id":233,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things.","start":1870.54,"end":1896.92}],"notes":["本段介绍了多任务强化学习的基本概念，即在不同任务之间训练策略时，需要考虑任务间的差异和共享结构。讲者提到，策略不仅需要依赖状态，还需要依赖任务，这为后续的多任务学习奠定了基础。","讲者强调了数据效率的重要性，指出多任务学习可以提升数据效率，因为任务之间通常存在共享结构。这种共享结构使得在训练多个任务时，可以减少每个任务所需的训练数据。","通过语言模型助手和机器人行走的例子，讲者说明了任务间共享结构的具体表现。例如，语言模型在不同网站上的交互方式可能有相似之处，而机器人在行走和后退任务中需要保持平衡的共性。","讲者还提到，多任务学习可以用于个性化推荐系统，因为不同用户之间可能存在相似性。学习一个用户的推荐策略可以迁移到其他用户，从而提升整体的推荐效果。","最后，讲者指出，多任务学习的深层动机在于构建通用系统，而不是单一任务系统。这种通用系统可以通过共享结构和迁移学习来实现更高效的训练。","讲者通过多个实际例子，如语言模型、机器人和推荐系统，说明了多任务学习在不同领域的应用，强调了其在提升数据效率和泛化能力方面的潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1731.42,"end":1896.92,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1731.42,"text":"or the dynamics of different people. They might have different action spaces even. And so when you're trying to train policies across these different tasks, there's some considerations that come up when you try to do that. Now, the key idea that we'll see is that you can, in many cases, just go about normal reinforcement learning, but condition on the task that you're trying to learn."},{"start":1761.61,"text":"So you're then going to be learning a policy that is not just conditioned on the state, but it's also conditioned on the state and also the tasks that you want it to be performing for that state. Now, why do we care about multitask reinforcement learning?"},{"start":1781.28,"text":"So, if we kind of go back to a lot of the topics that we've talked about in the course so far, like imitation learning, on-policy and off-policy RL, offline RL, model-based RL, reward functions, a big topic that's recurred in many of these lectures is talking about data efficiency. Like, how much data do we need to be able to calculate a gradient that is accurate?"},{"start":1809.16,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios."},{"start":1823.98,"text":"So it could actually be a boost for data efficiency in the sense that the data efficiency for training any one task will be lower when you're actually trying to train everything together. And that's because tasks typically will have some sort of shared structure."},{"start":1843.08,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things."},{"start":1870.54,"text":"If you're trying to develop a recommender system that's personalized to different users, then some users will share a lot of similarities, where if you try to learn to be a great recommender for one person, then you should also, there are other people that you could also probably be a great recommender for. And then there's also a slightly deeper motivation as well, which is that when we actually try to chain these generalist systems rather than systems that do one task,"}],"speech_gaps":[],"frame":"../frames/v022/011.webp","frame_time":1743.42},{"title":"多任务强化学习中的任务定义与示例","segments":[{"id":234,"text":"we often find that generalist systems end up being more reliable and more performant than if we were to just train on one task. And so I think that this is kind of a pretty cool finding that has kind of empirically been true in recent years in AI. And so it's extra motivation for not just training kind of something for one particular task or problem or user. Let's maybe get into what this actually entails. And we actually need to think about what...","start":1897.57,"end":1925.54},{"id":235,"text":"How do we think about what a task is? It's actually not, in some ways, not very well defined, like what makes something a different task versus not a different task. But one way to think about it is having different tasks just be different RL problems, different Markov decision processes. And so each task will have a state space, an action space, an initial state distribution, a transition model, and a reward function.","start":1926.59,"end":1954.16},{"id":236,"text":"And I'm indexing these with index i to denote that this is the state space for task i, this is the action space for task i, the dynamics and reward for task i, and so forth. Now, with this definition, it's worth mentioning that when we think of the notion of a task, there's a meaning under the English word of task.","start":1956.35,"end":1982.37},{"id":237,"text":"And this notion of a task being an MPP is actually potentially quite different from that semantic notion of a task, where you could actually have different tasks that have potentially the same reward function and only have different dynamics. For example, if you're trying to walk forward on grass versus trying to walk forward on flat terrain.","start":1983.97,"end":2008.69},{"id":238,"text":"then that potentially could be considered two different tasks under this framework, even though they're both kind of the task of walking forward. Okay, so a few examples of like kind of multitask problems that we might think about. One is this kind of personalized recommendation problem that I mentioned. In this case, different tasks would be different users or different people.","start":2009.8,"end":2033.91},{"id":239,"text":"Different people might have different reward functions. If it's music recommendation, someone might really love rock music, another person really might love hip-hop music. Also, the dynamics with regard to how often they even listen to music and so forth might also change across users.","start":2035.31,"end":2058.89}],"notes":["本段讨论了多任务强化学习中任务的定义，指出任务可以被视为不同的马尔可夫决策过程（MDP），每个任务包含状态空间、动作空间、初始状态分布、转移模型和奖励函数。讲者强调，任务的定义在语义上可能与形式化定义存在差异，例如，两个任务可能具有相同的奖励函数但不同的动态模型。","讲者通过行走的例子说明，即使两个任务的目标相同（如向前行走），如果它们的动态模型不同（如草地与平坦地形），也可以被视为不同的任务。这表明任务的区分不仅基于目标，还基于环境动态。","讲者进一步举例说明多任务问题，如个性化推荐系统，其中不同用户可能具有不同的奖励函数和动态模型。例如，一个用户可能更喜欢摇滚音乐，而另一个用户则更喜欢嘻哈音乐，这导致推荐系统需要适应不同用户的偏好。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1897.57,"end":2058.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1897.57,"text":"we often find that generalist systems end up being more reliable and more performant than if we were to just train on one task. And so I think that this is kind of a pretty cool finding that has kind of empirically been true in recent years in AI. And so it's extra motivation for not just training kind of something for one particular task or problem or user. Let's maybe get into what this actually entails. And we actually need to think about what..."},{"start":1926.59,"text":"How do we think about what a task is? It's actually not, in some ways, not very well defined, like what makes something a different task versus not a different task. But one way to think about it is having different tasks just be different RL problems, different Markov decision processes. And so each task will have a state space, an action space, an initial state distribution, a transition model, and a reward function."},{"start":1956.35,"text":"And I'm indexing these with index i to denote that this is the state space for task i, this is the action space for task i, the dynamics and reward for task i, and so forth. Now, with this definition, it's worth mentioning that when we think of the notion of a task, there's a meaning under the English word of task."},{"start":1983.97,"text":"And this notion of a task being an MPP is actually potentially quite different from that semantic notion of a task, where you could actually have different tasks that have potentially the same reward function and only have different dynamics. For example, if you're trying to walk forward on grass versus trying to walk forward on flat terrain."},{"start":2009.8,"text":"then that potentially could be considered two different tasks under this framework, even though they're both kind of the task of walking forward. Okay, so a few examples of like kind of multitask problems that we might think about. One is this kind of personalized recommendation problem that I mentioned. In this case, different tasks would be different users or different people."},{"start":2035.31,"text":"Different people might have different reward functions. If it's music recommendation, someone might really love rock music, another person really might love hip-hop music. Also, the dynamics with regard to how often they even listen to music and so forth might also change across users."}],"speech_gaps":[],"frame":"../frames/v022/012.webp","frame_time":1909.57}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

ta.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
