n you're trying to train policies across these different tasks, there's some considerations that come up when you try to do that. Now, the key idea that we'll see is that you can, in many cases, just go about normal reinforcement learning, but condition on the task that you're trying to learn.","start":1731.42,"end":1761.04},{"id":228,"text":"So you're then going to be learning a policy that is not just conditioned on the state, but it's also conditioned on the state and also the tasks that you want it to be performing for that state.","start":1761.61,"end":1779.77},{"id":229,"text":"So, if we kind of go back to a lot of the topics that we've talked about in the course so far, like imitation learning, on-policy and off-policy RL, offline RL, model-based RL, reward functions, a big topic that's recurred in many of these lectures is talking about data efficiency. Like, how much data do we need to be able to calculate a gradient that is accurate?","start":1781.28,"end":1805.4},{"id":230,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios.","start":1809.16,"end":1822.84},{"id":231,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios.","start":1823.98,"end":1842.2},{"id":232,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things.","start":1843.08,"end":1868.32},{"id":233,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things.","start":1870.54,"end":1896.92}],"notes":["本段介绍了多任务强化学习的基本概念，即在不同任务之间训练策略时，需要考虑任务间的差异和共享结构。讲者提到，策略不仅需要依赖状态，还需要依赖任务，这为后续的多任务学习奠定了基础。","讲者强调了数据效率的重要性，指出多任务学习可以提升数据效率，因为任务之间通常存在共享结构。这种共享结构使得在训练多个任务时，可以减少每个任务所需的训练数据。","通过语言模型助手和机器人行走的例子，讲者说明了任务间共享结构的具体表现。例如，语言模型在不同网站上的交互方式可能有相似之处，而机器人在行走和后退任务中需要保持平衡的共性。","讲者还提到，多任务学习可以用于个性化推荐系统，因为不同用户之间可能存在相似性。学习一个用户的推荐策略可以迁移到其他用户，从而提升整体的推荐效果。","最后，讲者指出，多任务学习的深层动机在于构建通用系统，而不是单一任务系统。这种通用系统可以通过共享结构和迁移学习来实现更高效的训练。","讲者通过多个实际例子，如语言模型、机器人和推荐系统，说明了多任务学习在不同领域的应用，强调了其在提升数据效率和泛化能力方面的潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1731.42,"end":1896.92,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1731.42,"text":"or the dynamics of different people. They might have different action spaces even. And so when you're trying to train policies across these different tasks, there's some considerations that come up when you try to do that. Now, the key idea that we'll see is that you can, in many cases, just go about normal reinforcement learning, but condition on the task that you're trying to learn."},{"start":1761.61,"text":"So you're then going to be learning a policy that is not just conditioned on the state, but it's also conditioned on the state and also the tasks that you want it to be performing for that state. Now, why do we care about multitask reinforcement learning?"},{"start":1781.28,"text":"So, if we kind of go back to a lot of the topics that we've talked about in the course so far, like imitation learning, on-policy and off-policy RL, offline RL, model-based RL, reward functions, a big topic that's recurred in many of these lectures is talking about data efficiency. Like, how much data do we need to be able to calculate a gradient that is accurate?"},{"start":1809.16,"text":"Our ultimate goal is to train something that can do multiple tasks at once, that we can actually amortize the complexity of learning any one task by actually training that policy across tasks and across scenarios."},{"start":1823.98,"text":"So it could actually be a boost for data efficiency in the sense that the data efficiency for training any one task will be lower when you're actually trying to train everything together. And that's because tasks typically will have some sort of shared structure."},{"start":1843.08,"text":"Like if you're trying to be a language model assistant, there is going to be a shared structure with regard to grammar or maybe with regard to different websites. And if you learn how to interact with one website, that can teach you something about how to interact with other websites. Or like in robots, if your goal is to be able to walk forward and walk backward, then this shared notion of staying balanced will be shared across tasks, among other things."},{"start":1870.54,"text":"If you're trying to develop a recommender system that's personalized to different users, then some users will share a lot of similarities, where if you try to learn to be a great recommender for one person, then you should also, there are other people that you could also probably be a great recommender for. And then there's also a slightly deeper motivation as well, which is that when we actually try to chain these generalist systems rather than systems that do one task,"}],"speech_gaps":[],"frame":"../frames/v022/011.webp","frame_time":1743.42},{"title":"多任务强化学习中的任务定义与示例","segments":[{"id":234,"text":"we often find that generalist systems end up being more reliable and more performant than if we were to just train on one task. And so I think that this is kind of a pretty cool finding that has kind of empirically been true in recent years in AI. And so it's extra motivation for not just training kind of something for one particular task or problem or user. Let's maybe get into what this actually entails. And we actually need to think about what...","start":1897.57,"end":1925.54},{"id":235,"text":"How do we think about what a task is? It's actually not, in some ways, not very well defined, like what makes something a different task versus not a different task. But one way to think about it is having different tasks just be different RL problems, different Markov decision processes. And so each task will have a state space, an action space, an initial state distribution, a transition model, and a reward function.","start":1926.59,"end":1954.16},{"id":236,"text":"And I'm indexing these with index i to denote that this is the state space for task i, this is the action space for task i, the dynamics and reward for task i, and so forth. Now, with this definition, it's worth mentioning that when we think of the notion of a task, there's a meaning under the English word of task.","start":1956.35,"end":1982.37},{"id":237,"text":"And this notion of a task being an MPP is actually potentially quite different from that semantic notion of a task, where you could actually have different tasks that have potentially the same reward function and only have different dynamics. For example, if you're trying to walk forward on grass versus trying to walk forward on flat terrain.","start":1983.97,"end":2008.69},{"id":238,"text":"then that potentially could be considered two different tasks under this framework, even though they're both kind of the task of walking forward. Okay, so a few examples of like kind of multitask problems that we might think about. One is this kind of personalized recommendation problem that I mentioned. In this case, different tasks would be different users or different people.","start":2009.8,"end":2033.91},{"id":239,"text":"Different people might have different reward functions. If it's music recommendation, someone might really love rock music, another person really might love hip-hop music. Also, the dynamics with regard to how often they even listen to music and so forth might also change across users.","start":2035.31,"end":2058.89}],"notes":["本段讨论了多任务强化学习中任务的定义，指出任务可以被视为不同的马尔可夫决策过程（MDP），每个任务包含状态空间、动作空间、初始状态分布、转移模型和奖励函数。讲者强调，任务的定义在语义上可能与形式化定义存在差异，例如，两个任务可能具有相同的奖励函数但不同的动态模型。","讲者通过行走的例子说明，即使两个任务的目标相同（如向前行走），如果它们的动态模型不同（如草地与平坦地形），也可以被视为不同的任务。这表明任务的区分不仅基于目标，还基于环境动态。","讲者进一步举例说明多任务问题，如个性化推荐系统，其中不同用户可能具有不同的奖励函数和动态模型。例如，一个用户可能更喜欢摇滚音乐，而另一个用户则更喜欢嘻哈音乐，这导致推荐系统需要适应不同用户的偏好。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1897.57,"end":2058.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1897.57,"text":"we often find that generalist systems end up being more reliable and more performant than if we were to just train on one task. And so I think that this is kind of a pretty cool finding that has kind of empirically been true in recent years in AI. And so it's extra motivation for not just training kind of something for one particular task or problem or user. Let's maybe get into what this actually entails. And we actually need to think about what..."},{"start":1926.59,"text":"How do we think about what a task is? It's actually not, in some ways, not very well defined, like what makes something a different task versus not a different task. But one way to think about it is having different tasks just be different RL problems, different Markov decision processes. And so each task will have a state space, an action space, an initial state distribution, a transition model, and a reward function."},{"start":1956.35,"text":"And I'm indexing these with index i to denote that this is the state space for task i, this is the action space for task i, the dynamics and reward for task i, and so forth. Now, with this definition, it's worth mentioning that when we think of the notion of a task, there's a meaning under the English word of task."},{"start":1983.97,"text":"And this notion of a task being an MPP is actually potentially quite different from that semantic notion of a task, where you could actually have different tasks that have potentially the same reward function and only have different dynamics. For example, if you're trying to walk forward on grass versus trying to walk forward on flat terrain."},{"start":2009.8,"text":"then that potentially could be considered two different tasks under this framework, even though they're both kind of the task of walking forward. Okay, so a few examples of like kind of multitask problems that we might think about. One is this kind of personalized recommendation problem that I mentioned. In this case, different tasks would be different users or different people."},{"start":2035.31,"text":"Different people might have different reward functions. If it's music recommendation, someone might really love rock music, another person really might love hip-hop music. Also, the dynamics with regard to how often they even listen to music and so forth might also change across users."}],"speech_gaps":[],"frame":"../frames/v022/012.webp","frame_time":1909.57},{"title":"多任务强化学习中的任务差异与变化因素","segments":[{"id":240,"text":"Reinforcement learning has often actually, this is an application we haven't really talked about, but it's often used in character animation in order to actually create animations of different kinds of characters, like people or other animated characters that appear in movies.","start":2061.67,"end":2079.75},{"id":241,"text":"And you might want to learn, like, allow and be able to animate a character to do lots of different maneuvers. So you might want to be able to have your character be able to do a backflip or to be able to run or be able to do a cartwheel. And each of these would be different tasks. Does anyone have thoughts for these tasks? What is the thing that would vary across tasks versus be fixed across tasks?","start":2080.87,"end":2104.18},{"id":242,"text":"Yeah, so in this scenario, the reward will vary because in one case you want it to run, in another case you want it to do a cartwheel, and the dynamics or the physics of the simulator will stay the same. Cool. There's also been works that's trying to do character animation involving different garments, so a character that can put on a shirt versus a long-sleeve shirt versus a dress.","start":2104.94,"end":2133.18},{"id":243,"text":"Does anyone have thoughts on what would vary across these tasks? Yeah, so the policy might vary. The policy will also vary actually in all of these cases for different tasks. Yeah, so the physics of how a long-sleeve shirt versus a short-sleeve shirt will behave, it will vary across tasks. I think I also put the initial state distribution might also vary, whereas in the first example, maybe the initial state is always to start standing up, for example.","start":2133.93,"end":2160.5},{"id":244,"text":"Whereas here, you have different garments in the initial state. And then the last example I put is maybe different tasks are controlling different robot arms. And maybe one robot arm looks like this with maybe four degrees of freedom. This one is six degrees of freedom. This one is seven degrees of freedom. Does anyone have thoughts on what would vary across tasks?","start":2161.33,"end":2183.26},{"id":245,"text":"If one task is to control the first robot to grasp an object, the second task is to control the second robot to grasp an object, and so forth. Yeah, so the actions themselves, so you'll have different dimensions of actions. Yeah, so the dynamics will also be different, because when you move one joint, that will affect the other joints differently.","start":2184.01,"end":2203.1},{"id":246,"text":"Yeah, so the states would also vary as well. So how you represent the arm, that will be a different dimension. What the actions even are will also be different dimensional. And then the dynamics will also vary quite a bit as well because how your actions affect the robot arm are going to change.","start":2204.17,"end":2234.47}],"notes":["本段讨论了多任务强化学习中的任务差异，强调了不同任务中奖励函数、策略、初始状态分布、动作空间、状态表示和动力学模型的变化。这些变化是多任务学习中需要考虑的关键因素。","在动画任务中，奖励函数会根据任务目标（如跑步、空翻）而变化，但模拟器的物理动力学保持不变。这表明任务之间的共享部分（如物理模型）可以被复用，而任务特定部分（如奖励）需要单独设计。","在服装任务中，初始状态分布可能因服装类型（如长袖衬衫、短袖衬衫、连衣裙）而变化，这说明初始状态是任务变化的一个因素。同时，策略也会因任务不同而变化，因为不同服装的物理行为不同。","在机器人手臂任务中，不同手臂的自由度（如4、6、7个）导致动作空间和状态表示的维度不同。这表明任务之间的动作空间和状态表示可能完全不同，需要针对每个任务进行适配。","动力学模型的变化是由于不同手臂的结构差异，移动一个关节会影响其他关节的方式不同。这说明动力学模型是任务变化的重要因素，需要针对每个任务进行建模。","这些例子展示了多任务强化学习的典型应用场景，包括动画、服装和机器人控制。每个任务都有其独特的变化因素，需要在设计多任务学习框架时加以考虑。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2061.67,"end":2234.47,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2061.67,"text":"Reinforcement learning has often actually, this is an application we haven't really talked about, but it's often used in character animation in order to actually create animations of different kinds of characters, like people or other animated characters that appear in movies."},{"start":2080.87,"text":"And you might want to learn, like, allow and be able to animate a character to do lots of different maneuvers. So you might want to be able to have your character be able to do a backflip or to be able to run or be able to do a cartwheel. And each of these would be different tasks. Does anyone have thoughts for these tasks? What is the thing that would vary across tasks versus be fixed across tasks?"},{"start":2104.94,"text":"Yeah, so in this scenario, the reward will vary because in one case you want it to run, in another case you want it to do a cartwheel, and the dynamics or the physics of the simulator will stay the same. Cool. There's also been works that's trying to do character animation involving different garments, so a character that can put on a shirt versus a long-sleeve shirt versus a dress."},{"start":2133.93,"text":"Does anyone have thoughts on what would vary across these tasks? Yeah, so the policy might vary. The policy will also vary actually in all of these cases for different tasks. Yeah, so the physics of how a long-sleeve shirt versus a short-sleeve shirt will behave, it will vary across tasks. I think I also put the initial state distribution might also vary, whereas in the first example, maybe the initial state is always to start standing up, for example."},{"start":2161.33,"text":"Whereas here, you have different garments in the initial state. And then the last example I put is maybe different tasks are controlling different robot arms. And maybe one robot arm looks like this with maybe four degrees of freedom. This one is six degrees of freedom. This one is seven degrees of freedom. Does anyone have thoughts on what would vary across tasks?"},{"start":2184.01,"text":"If one task is to control the first robot to grasp an object, the second task is to control the second robot to grasp an object, and so forth. Yeah, so the actions themselves, so you'll have different dimensions of actions. Yeah, so the dynamics will also be different, because when you move one joint, that will affect the other joints differently."},{"start":2204.17,"text":"Yeah, so the states would also vary as well. So how you represent the arm, that will be a different dimension. What the actions even are will also be different dimensional. And then the dynamics will also vary quite a bit as well because how your actions affect the robot arm are going to change. Cool. So those are the examples of different problems where we might want to be kind of training different tasks."}],"speech_gaps":[],"frame":"../frames/v022/013.webp","frame_time":2073.67},{"title":"多任务强化学习中的任务标识与状态扩展","segments":[{"id":247,"text":"The last thing that we're kind of missing here is we need to figure out how to identify one task from another task so that we can tell our policy what task it should be doing at a given point. And one way to do this is to just assign an index. You could say, like, this robot is task zero, this robot is task one, this robot is task two, and so forth.","start":2235.92,"end":2260.5},{"id":248,"text":"If you don't have any other kind of better way to identify a task, this is kind of what you resort to. You could also have a language description of the task.","start":2262.27,"end":2272.04},{"id":249,"text":"You could have a video illustration of what the task is. There's actually a number of ways to be creative with how you describe the task to the policy. And we'll refer to each of these as different task identifiers. So the task identifier for the task of... We'll see some examples on the next slide. Now, once you have the task identifier, an alternative view on the multitask RL problem...","start":2273.56,"end":2302.96},{"id":250,"text":"is simply just having the task identifier be part of the state where we're writing sbar as the original state. And what this means is that before we had a kind of a collection of MDPs, that's kind of what's written at the top. And we can actually construct a single MDP that actually covers,","start":2303.56,"end":2334.75},{"id":251,"text":"We have, for example, the PI of the initial state, PI of S prime given SA, and RI of SA. And this is the dynamics and the reward for each task.","start":2335.37,"end":2358.5},{"id":252,"text":"We can kind of think of it as like our goal is to solve all of the MDPs for each of the tasks. But we can also think about it as just a single MDP where the state is now defined as like, maybe this is like the original state space of these tasks. And the state is now defined as like the original state space.","start":2362.91,"end":2388.92}],"notes":["本段讲解了多任务强化学习中如何通过任务标识符来区分不同任务，并将任务标识符整合到状态空间中，从而构建一个统一的MDP。讲者提到，任务标识符可以是索引、语言描述或视频示例，这些都属于不同的任务标识方式。通过将任务标识符作为状态的一部分，可以将多个任务整合为一个统一的MDP，从而简化问题。","讲者进一步说明，整合后的MDP包含初始状态的转移概率PI、状态转移PI(S' | S, A)和奖励函数RI(S, A)，这些构成了每个任务的动力学和奖励结构。这种统一的MDP框架允许算法同时处理多个任务，而无需为每个任务单独训练策略。","讲者指出，虽然可以将多个任务视为独立的MDP进行求解，但通过整合任务标识符到状态中，可以将问题转化为一个单一的MDP，从而更高效地进行策略优化。这种统一的视角有助于在不同任务之间共享策略知识，提高学习效率。","讲者提到，整合后的状态空间是原始任务状态空间的扩展，其中任务标识符作为状态的一部分。这种设计使得策略能够根据当前任务标识符动态调整行为，从而适应不同的任务需求。","讲者强调，这种统一的MDP框架不仅适用于多任务强化学习，还可以用于其他需要处理多个相关任务的场景。通过将任务标识符整合到状态中，可以更灵活地处理任务间的共性和差异。","讲者最后指出，虽然整合后的MDP框架提供了统一的视角，但实际应用中仍需考虑任务间的差异性和任务标识符的准确性。因此，任务标识符的设计和选择对于多任务强化学习的成功至关重要。"],"formulas":[],"uncertainties":["PI of the initial state"],"diagram":"none","start":2235.92,"end":2388.92,"asr_flags":[],"math_clarifications":["提供的公式与上下文中的内容无直接关联，原始文本中未提及具体的数学公式，因此无法核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2235.92,"text":"The last thing that we're kind of missing here is we need to figure out how to identify one task from another task so that we can tell our policy what task it should be doing at a given point. And one way to do this is to just assign an index. You could say, like, this robot is task zero, this robot is task one, this robot is task two, and so forth."},{"start":2262.27,"text":"If you don't have any other kind of better way to identify a task, this is kind of what you resort to. You could also have a language description of the task."},{"start":2273.56,"text":"You could have a video illustration of what the task is. There's actually a number of ways to be creative with how you describe the task to the policy. And we'll refer to each of these as different task identifiers. So the task identifier for the task of... We'll see some examples on the next slide. Now, once you have the task identifier, an alternative view on the multitask RL problem..."},{"start":2303.56,"text":"is simply just having the task identifier be part of the state where we're writing sbar as the original state. And what this means is that before we had a kind of a collection of MDPs, that's kind of what's written at the top. And we can actually construct a single MDP that actually covers,"},{"start":2335.37,"text":"all of the tasks. So we have, for example, the PI of the initial state, PI of S prime given SA, and RI of SA. And this is the dynamics and the reward for each task."},{"start":2362.91,"text":"We can kind of think of it as like our goal is to solve all of the MDPs for each of the tasks. But we can also think about it as just a single MDP where the state is now defined as like, maybe this is like the original state space of these tasks. And the state is now defined as like the original state space."}],"speech_gaps":[],"frame":"../frames/v022/014.webp","frame_time":2247.92},{"title":"多任务强化学习中的任务标识与奖励函数","segments":[{"id":253,"text":"and the task identifier for that task. And then the reward function, for example, in this modified MDP, that's just a single MDP for all the tasks, is then going to be equal to, let's say, just to be explicit, the reward for this state and this action","start":2390.88,"end":2420.46},{"id":254,"text":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi.","start":2421.08,"end":2448.69},{"id":255,"text":"comma A is equal to the kind of dynamics for that task. This gets a little bit more complicated if your tasks have different state spaces and action spaces.","start":2449.84,"end":2462.57},{"id":256,"text":"And so you'd have to, if they have, for example, different dimensionalities, then you need to think about how you would represent this state space in the MDP. If they have the same state space and action space, you can basically construct this aggregated Markov decision process with these equations here.","start":2464.79,"end":2487.4},{"id":257,"text":"kind of what we think of as the single task reinforcement learning setting that we've talked about so far, we can then kind of think about multitask RL, but where the task identifier is part of the state, where the task identifier could be the task, like an index, a language description. It could also be some desired goal state as well that you want to reach. This is often referred to as goal-conditioned RL. But then once you do this, you're basically getting","start":2489.81,"end":2515.71},{"id":258,"text":"a modified MVP that covers each of these tasks. Now, in terms of the reward, like we talked about on the board, it's basically going to be the same as before. In this special case of goal-conditioned reinforcement learning, where you're trying to reach a goal, then oftentimes you'll think about the reward as some negative distance between the state that you're currently at and the goal state.","start":2517.41,"end":2546.91}],"notes":["本段讲解了多任务强化学习（Multi-Task RL）中任务标识符与奖励函数的设计。任务标识符可以是任务的索引、语言描述或目标状态，这使得任务可以被整合到一个统一的MDP中。当任务具有不同的状态空间和动作空间时，需要考虑如何表示这些状态空间，这增加了问题的复杂性。","在任务标识符作为状态的一部分的情况下，可以构建一个聚合的马尔可夫决策过程（Aggregated MDP），其中状态和动作的转移概率需要根据任务进行调整。这种设计被称为目标条件强化学习（Goal-conditioned RL），其中奖励函数通常基于当前状态与目标状态之间的距离来定义。","在目标条件强化学习中，奖励函数通常被设计为当前状态与目标状态之间的负距离，这鼓励智能体朝着目标状态移动。这种设计使得多任务学习能够覆盖多个任务，而无需为每个任务单独设计一个MDP。","当任务具有相同的状态空间和动作空间时，可以使用相同的方程构建聚合的MDP，这简化了多任务学习的实现。然而，当任务具有不同的状态空间和动作空间时，需要考虑如何表示这些状态空间，这可能涉及更复杂的表示方法。","在目标条件强化学习中，任务标识符可以是目标状态，这使得智能体能够学习如何达到不同的目标。这种设计允许智能体在多个任务之间进行迁移学习，从而提高学习效率。"],"formulas":[{"latex":"r(s, a) = r_i(s, a)","symbols":"奖励函数","explanation":"奖励函数 $ r(s, a) $ 被定义为任务特定的奖励函数 $ r_i(s, a) $，适用于特定任务 $ i $。","evidence":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi."},{"latex":"s' = T(s, a)","symbols":"状态转移函数","explanation":"状态转移函数 $ T(s, a) $ 表示在状态 $ s $ 执行动作 $ a $ 后转移到的新状态 $ s' $。","evidence":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi."},{"latex":"r(s, a) = -d(s, g)","symbols":"奖励函数","explanation":"在目标条件强化学习中，奖励函数 $ r(s, a) $ 被定义为当前状态 $ s $ 与目标状态 $ g $ 之间的距离的负值，即 $ -d(s, g) $。","evidence":"a modified MVP that covers each of these tasks. Now, in terms of the reward, like we talked about on the board, it's basically going to be the same as before. In this special case of goal-conditioned reinforcement learning, where you're trying to reach a goal, then oftentimes you'll think about the reward as some negative distance between the state that you're currently at and the goal state."}],"uncertainties":["s bar zi"],"diagram":"none","start":2390.88,"end":2546.91,"asr_flags":[],"math_clarifications":["公式 $ r(s, a) = r_i(s, a) $ 表示任务特定的奖励函数，适用于特定任务 $ i $。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2390.88,"text":"and the task identifier for that task. And then the reward function, for example, in this modified MDP, that's just a single MDP for all the tasks, is then going to be equal to, let's say, just to be explicit, the reward for this state and this action"},{"start":2421.08,"text":"would then be equal to ri of s bar a. And similarly, you can write something out for the dynamics as well, where the kind of aggregated MDP for a given task, s prime given s bar zi."},{"start":2449.84,"text":"comma A is equal to the kind of dynamics for that task. This gets a little bit more complicated if your tasks have different state spaces and action spaces."},{"start":2464.79,"text":"And so you'd have to, if they have, for example, different dimensionalities, then you need to think about how you would represent this state space in the MDP. If they have the same state space and action space, you can basically construct this aggregated Markov decision process with these equations here. Now, if we go back to kind of..."},{"start":2489.81,"text":"kind of what we think of as the single task reinforcement learning setting that we've talked about so far, we can then kind of think about multitask RL, but where the task identifier is part of the state, where the task identifier could be the task, like an index, a language description. It could also be some desired goal state as well that you want to reach. This is often referred to as goal-conditioned RL. But then once you do this, you're basically getting"},{"start":2517.41,"text":"a modified MVP that covers each of these tasks. Now, in terms of the reward, like we talked about on the board, it's basically going to be the same as before. In this special case of goal-conditioned reinforcement learning, where you're trying to reach a goal, then oftentimes you'll think about the reward as some negative distance between the state that you're currently at and the goal state."}],"speech_gaps":[],"frame":"../frames/v022/015.webp","frame_time":2402.88},{"title":"多任务强化学习中的任务表示与结构利用","segments":[{"id":259,"text":"And distance functions could be Euclidean, it could be a sparse 0, 1, and so forth. So we still get kind of a standard Markov decision process when we aggregate, when we kind of bring these tasks together. And you might ask, if we can get this standard Markov decision process that now has a task identifier, like a task string, as part of the state space, then why not apply kind of standard reinforcement learning algorithms to them? And the answer is you can.","start":2550.95,"end":2579.46},{"id":260,"text":"And in many cases, this is a great way to approach scenarios where you want to learn multiple tasks.","start":2581.04,"end":2588.9},{"id":261,"text":"But the reason why I'm bringing all this up is that in some cases you can actually do better by leveraging the kind of known structure between different tasks. And goal conditioned RL is one of those cases where you're trying to reach different goals. And in the kind of next few slides, we'll talk about one particular way that you can do a lot better by leveraging this fact that you know that this MDP consists of these different tasks that you're trying to do.","start":2589.99,"end":2618.31},{"id":262,"text":"Yeah, Euclidean L2, that's just mean squared error. Yeah, so the question is, if different people are different tasks, then is there a better way to represent different people than a one-hot? When I say one-hot, by the way, I mean kind of a vector like this, where if you're going to represent the number two, you use a one-hot vector.","start":2619.26,"end":2641.04},{"id":263,"text":"So yeah, there are definitely better ways than just this. This is actually fairly common in a lot of reinforcement learning methods. But for example, one thing you could do is you could try to get a language description of the person or their preferences. You could also...","start":2642.49,"end":2661.83},{"id":264,"text":"This gets into stuff that we'll talk about next week, but you could also use some examples of things that they like and don't like as part of the task descriptor as well. So you get something more like in-context learning in that case where DI actually might contain some data about the task. So yeah, there are some better examples like that.","start":2662.94,"end":2692.61},{"id":265,"text":"And in the multitask imitation learning setting, we can think of it as if we have different tasks I, if the number of tasks I is like a relatively small number, then you can basically think of it as having some set of demonstrations that are demonstration trajectories for each task.","start":2693.16,"end":2716.98}],"notes":["本段讨论了多任务强化学习中任务表示的问题，特别是如何用更有效的表示方式替代传统的one-hot编码。讲者提到，虽然one-hot编码是常见做法，但存在更优的表示方法，例如使用语言描述或用户偏好信息，以及利用示例数据来构建任务描述。","讲者指出，使用更丰富的任务描述可以提升模型性能，类似于in-context learning的机制，其中任务描述（DI）可能包含任务相关的数据。这表明任务表示的多样性对于多任务学习的重要性。","讲者提到，这些更优的表示方法将在后续课程中进一步探讨，说明当前内容为引入概念，后续将深入展开。这表明课程内容具有递进性，逐步引导学生理解更复杂的任务表示方法。","讲者强调，虽然one-hot编码是常见做法，但并非最优解，这表明在多任务强化学习中，任务表示的选择对模型性能有直接影响。因此，探索更有效的表示方式是该领域的重要研究方向。","讲者提到，任务描述可以包含用户偏好或示例数据，这表明任务表示不仅仅是静态的编码，还可以是动态的、上下文相关的。这种灵活性有助于模型更好地适应不同任务。","讲者最后提到，将进入多任务模仿学习（multitask imitation learning）的例子，说明课程内容将从理论讨论转向具体案例分析，帮助学生理解如何在实际中应用这些概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2550.95,"end":2716.98,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2550.95,"text":"And distance functions could be Euclidean, it could be a sparse 0, 1, and so forth. So we still get kind of a standard Markov decision process when we aggregate, when we kind of bring these tasks together. And you might ask, if we can get this standard Markov decision process that now has a task identifier, like a task string, as part of the state space, then why not apply kind of standard reinforcement learning algorithms to them? And the answer is you can."},{"start":2581.04,"text":"And in many cases, this is a great way to approach scenarios where you want to learn multiple tasks."},{"start":2589.99,"text":"But the reason why I'm bringing all this up is that in some cases you can actually do better by leveraging the kind of known structure between different tasks. And goal conditioned RL is one of those cases where you're trying to reach different goals. And in the kind of next few slides, we'll talk about one particular way that you can do a lot better by leveraging this fact that you know that this MDP consists of these different tasks that you're trying to do."},{"start":2619.26,"text":"Yeah, Euclidean L2, that's just mean squared error. Yeah, so the question is, if different people are different tasks, then is there a better way to represent different people than a one-hot? When I say one-hot, by the way, I mean kind of a vector like this, where if you're going to represent the number two, you use a one-hot vector."},{"start":2642.49,"text":"So yeah, there are definitely better ways than just this. This is actually fairly common in a lot of reinforcement learning methods. But for example, one thing you could do is you could try to get a language description of the person or their preferences. You could also..."},{"start":2662.94,"text":"This gets into stuff that we'll talk about next week, but you could also use some examples of things that they like and don't like as part of the task descriptor as well. So you get something more like in-context learning in that case where DI actually might contain some data about the task. So yeah, there are some better examples like that. So in terms of this problem setup, let's actually look at an example. So we're going to start with multitask imitation learning."},{"start":2693.16,"text":"And in the multitask imitation learning setting, we can think of it as if we have different tasks I, if the number of tasks I is like a relatively small number, then you can basically think of it as having some set of demonstrations that are demonstration trajectories for each task."}],"speech_gaps":[],"frame":"../frames/v022/016.webp","frame_time":2562.95},{"title":"多任务强化学习中的模仿学习策略","segments":[{"id":266,"text":"where each of these contains expert demonstrations. And then you'll have, so these are demos for task i, and this is for i equals 1 to n, if you have n different tasks. And if we were to think about how to use this data for imitation learning,","start":2717.56,"end":2747.82},{"id":267,"text":"Kind of thinking back to the very first lecture or second lecture, we were doing imitation learning. We had this objective of minimizing the log probability of actions given states. And if we just write this as minimizing the kind of supervised loss function with respect to our policy parameters, then we want to move to the multitask setting.","start":2749.45,"end":2774.67},{"id":268,"text":"What we can do is we can simply try to now minimize a single set of policy parameters over the loss function averaged over all of the tasks. So this is basically like multitask imitation learning. Pretty simple, hopefully. One useful trick for this sort of approach is that if you...","start":2775.24,"end":2805.91},{"id":269,"text":"If tasks are very different, like if one task is telling you to go forward, one task is telling you to go backwards, maybe one task is telling you to lie down, they're telling the policy to do very different things, then if you sampled one mini-batch that's mostly going forward and a different mini-batch of mostly laying down, for example, then from one gradient step to the next, you're actually going to have a lot of variance because the first mini-batch is going to tell you to do something that's pretty different from the second mini-batch.","start":2806.71,"end":2833.23},{"id":270,"text":"And hopefully the policy should be able to use the task identifier to differentiate the two. But in some cases, it can be a little bit tricky for the network to do that. And so one thing that's quite useful is that when you sample a mini batch, you can stratify the mini batch and ensure that each mini batch of data has data from each task.","start":2833.96,"end":2853.92},{"id":271,"text":"And if you're trying to optimize for kind of a uniform distribution over your tasks, then your minibatch would be like 1 over n of the data would be the first task, 1 over n of the minibatch would be the second task, and so forth. And this will give you gradients that are lower variance. And it can be quite useful in practice to do something like this.","start":2855.07,"end":2874.77}],"notes":["本段讨论了多任务模仿学习中如何处理不同任务之间的差异性。当任务之间差异较大时，例如一个任务要求前进，另一个任务要求后退，甚至一个任务要求躺下，这种差异会导致梯度更新过程中出现较大的方差。这是因为不同mini-batch的数据可能来自不同的任务，从而导致梯度方向不一致。","为了减少这种方差，可以采用分层抽样（stratified sampling）的方法，确保每个mini-batch中包含来自所有任务的数据。这样可以使得梯度更新更加稳定，从而提高训练效果。","在优化过程中，如果希望对所有任务进行均匀采样，那么每个任务的数据在mini-batch中的比例应为1/n，其中n是任务的总数。这种方法在实践中被证明是有效的，因为它能够降低梯度的方差，提高模型的收敛速度。","此外，本段还提到，虽然策略网络理论上应该能够通过任务标识符来区分不同任务，但在某些情况下，网络可能难以完成这一任务，因此需要通过分层抽样来辅助训练。","分层抽样是一种常见的数据增强技术，它确保了每个任务的数据在训练过程中被均匀地采样，从而避免了某些任务被过度或不足地表示的问题。","最后，本段强调了在多任务学习中，如何通过合理的数据采样策略来提高模型的泛化能力和训练效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2717.56,"end":2874.77,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2717.56,"text":"where each of these contains expert demonstrations. And then you'll have, so these are demos for task i, and this is for i equals 1 to n, if you have n different tasks. And if we were to think about how to use this data for imitation learning,"},{"start":2749.45,"text":"Kind of thinking back to the very first lecture or second lecture, we were doing imitation learning. We had this objective of minimizing the log probability of actions given states. And if we just write this as minimizing the kind of supervised loss function with respect to our policy parameters, then we want to move to the multitask setting."},{"start":2775.24,"text":"What we can do is we can simply try to now minimize a single set of policy parameters over the loss function averaged over all of the tasks. So this is basically like multitask imitation learning. Pretty simple, hopefully. One useful trick for this sort of approach is that if you..."},{"start":2806.71,"text":"If tasks are very different, like if one task is telling you to go forward, one task is telling you to go backwards, maybe one task is telling you to lie down, they're telling the policy to do very different things, then if you sampled one mini-batch that's mostly going forward and a different mini-batch of mostly laying down, for example, then from one gradient step to the next, you're actually going to have a lot of variance because the first mini-batch is going to tell you to do something that's pretty different from the second mini-batch."},{"start":2833.96,"text":"And hopefully the policy should be able to use the task identifier to differentiate the two. But in some cases, it can be a little bit tricky for the network to do that. And so one thing that's quite useful is that when you sample a mini batch, you can stratify the mini batch and ensure that each mini batch of data has data from each task."},{"start":2855.07,"text":"And if you're trying to optimize for kind of a uniform distribution over your tasks, then your minibatch would be like 1 over n of the data would be the first task, 1 over n of the minibatch would be the second task, and so forth. And this will give you gradients that are lower variance. And it can be quite useful in practice to do something like this."}],"speech_gaps":[],"frame":"../frames/v022/017.webp","frame_time":2729.56},{"title":"多任务强化学习中的输入处理与模型架构","segments":[{"id":272,"text":"Another thing that I didn't put on the slides that can also be useful is making sure that your states and actions are on similar scales across tasks. So kind of per-task normalization can also be quite useful for the learning process. Now, we've talked about training this multitask policy. And when we do that, we're going to have...","start":2875.59,"end":2901.11},{"id":273,"text":"We're now going to have a policy that takes as input some state and some task descriptor and then needs to output some action. And you might have scenarios where this is like a language string or a one-hot vector, and this is an image. And that's inherently a very multimodal problem. You have different data modalities. These are very different dimensions.","start":2901.81,"end":2928.23},{"id":274,"text":"And so in practice, there's a question of how do you design architectures that take as input this kind of multimodal data. One example that I'll give that I kind of like because it actually uses multiple different modalities of task descriptors is this paper here where the goal is like a multitasking imitation learning system is training a robot to do some simple manipulation tasks.","start":2929.03,"end":2954.03},{"id":275,"text":"And the way the architecture works, this paper is a little bit old, so it's not using a transformer. But here's the current state right here. It actually downsamples the image before passing it into the model. And then it also uses actually two different task descriptors. So it uses a language string as one task descriptor, which is put bottle in the ceramic bowl.","start":2955.39,"end":2976.77},{"id":276,"text":"And it also trains the model to be able to, instead of using the language, be able to use a video of how to do the task. In this case, the video is a video of a person placing the bottle in the bowl. And so you can design models that, in this case then, for the language, it would use a language encoder.","start":2977.69,"end":2997.91},{"id":277,"text":"like kind of things that are typically used in language models. For example, transformers. And actually, I think the language encoder here did actually use a transformer. And then separately for the video, it would be using a different kind of encoder because video data looks very different. And it uses a video encoder for the second part.","start":3000.16,"end":3020.1},{"id":278,"text":"And it kind of multiplies these embeddings into different layers of the network, kind of the backbone of the network that processes the state. And then the loss function corresponds to a behavior cloning loss. And it either samples the task descriptor from the video encoder or from the language encoder. And then the whole model is trained, including these encoders, is trained using the behavior cloning loss.","start":3021.1,"end":3052.71}],"notes":["本段主要讲解多任务强化学习中如何处理不同模态的输入数据，如语言描述和视频。讲者提到，为了处理这些不同模态的数据，需要设计能够接受多种输入的模型架构。例如，使用语言编码器和视频编码器分别处理语言和视频输入。","讲者以一个具体的论文案例说明如何设计这样的模型。该论文使用了语言字符串和视频作为任务描述符，分别通过语言编码器和视频编码器进行处理。语言编码器可能使用了Transformer模型，而视频编码器则使用了不同的编码方式。","模型的损失函数是行为克隆损失，即通过模仿专家行为来训练模型。模型在训练过程中会从语言编码器或视频编码器中采样任务描述符，并将这些描述符与状态一起输入到网络中进行处理。","讲者提到，这些嵌入向量会被乘入网络的不同层中，作为网络处理状态的主干部分。这种设计允许模型在处理不同任务时，能够有效地融合不同模态的信息。","整个模型的训练过程包括对编码器的训练，使用行为克隆损失函数进行优化。这表明模型不仅学习任务描述符的表示，还学习如何将这些描述符与状态结合，以生成合适的动作。","讲者强调了多模态输入处理的重要性，指出不同模态的数据需要不同的编码方式，并且需要设计能够融合这些信息的网络结构。这种设计有助于提高模型在多任务学习中的表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2875.59,"end":3052.71,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2875.59,"text":"Another thing that I didn't put on the slides that can also be useful is making sure that your states and actions are on similar scales across tasks. So kind of per-task normalization can also be quite useful for the learning process. Now, we've talked about training this multitask policy. And when we do that, we're going to have..."},{"start":2901.81,"text":"We're now going to have a policy that takes as input some state and some task descriptor and then needs to output some action. And you might have scenarios where this is like a language string or a one-hot vector, and this is an image. And that's inherently a very multimodal problem. You have different data modalities. These are very different dimensions."},{"start":2929.03,"text":"And so in practice, there's a question of how do you design architectures that take as input this kind of multimodal data. One example that I'll give that I kind of like because it actually uses multiple different modalities of task descriptors is this paper here where the goal is like a multitasking imitation learning system is training a robot to do some simple manipulation tasks."},{"start":2955.39,"text":"And the way the architecture works, this paper is a little bit old, so it's not using a transformer. But here's the current state right here. It actually downsamples the image before passing it into the model. And then it also uses actually two different task descriptors. So it uses a language string as one task descriptor, which is put bottle in the ceramic bowl."},{"start":2977.69,"text":"And it also trains the model to be able to, instead of using the language, be able to use a video of how to do the task. In this case, the video is a video of a person placing the bottle in the bowl. And so you can design models that, in this case then, for the language, it would use a language encoder."},{"start":3000.16,"text":"like kind of things that are typically used in language models. For example, transformers. And actually, I think the language encoder here did actually use a transformer. And then separately for the video, it would be using a different kind of encoder because video data looks very different. And it uses a video encoder for the second part. And then it kind of..."},{"start":3021.1,"text":"It kind of multiplies these embeddings into different layers of the network, kind of the backbone of the network that processes the state. And then the loss function corresponds to a behavior cloning loss. And it either samples the task descriptor from the video encoder or from the language encoder. And then the whole model is trained, including these encoders, is trained using the behavior cloning loss."}],"speech_gaps":[],"frame":"../frames/v022/018.webp","frame_time":2887.59},{"title":"多任务强化学习中的任务描述与架构","segments":[{"id":279,"text":"So this is kind of one practical example. Now, we can also look at some more modern architectures. And first off, if you have something like a language model, the task descriptor, it's very natural for it just to be a language string. And you can think of that basically just as the prompt. And so in many ways, one way to think about multitask imitation learning is basically all of the language model imitation learning or supervised fine tuning is with different prompts. You can sort of think of those as different tasks.","start":3056.27,"end":3085.05},{"id":280,"text":"And it's very easy to just pass that into a transformer. And in terms of modern policy architectures for using task strings in robotics, it's often common to also use a transformer and find ways to use image encoders, in this case, kind of pre-trained image encoders, project those into the input space of a language model, also use the task descriptor here.","start":3085.68,"end":3112.66},{"id":281,"text":"which is what should the robot do to put the eggplant in the bowl,","start":3113.46,"end":3116.52},{"id":282,"text":"pass those in as tokens to a language model,","start":3116.7,"end":3119.32},{"id":283,"text":"and then output the actions and train the whole model,","start":3119.52,"end":3123.18},{"id":284,"text":"including the image encoder and the text encoder and pen.","start":3123.32,"end":3126.96},{"id":285,"text":"So here you can view the task identifier, ZI,","start":3128.96,"end":3133.82},{"id":286,"text":"as basically the prompt for the model.","start":3133.94,"end":3137.06},{"id":287,"text":"The question is, how does this compare to traditional reinforcement learning?","start":3137.82,"end":3141.64},{"id":288,"text":"Um, in terms of task performance and success rate. So the, um, so like, I guess there's a","start":3145.56,"end":3153.78},{"id":289,"text":"couple of things that are different here. We'll talk about multitask RL, um, in a bit, like right","start":3153.78,"end":3159.14},{"id":290,"text":"after this. Uh, and then, so the, like you can do the sort of like prompt conditioning, task","start":3159.14,"end":3167.22},{"id":291,"text":"identifier conditioning, both with imitation learning and with reinforcement learning. Uh,","start":3167.22,"end":3171.04},{"id":292,"text":"Uh, and generally the considerations about imitation learning versus RL is very similar","start":3171.04,"end":3176.3},{"id":293,"text":"to what we've discussed so far, where with imitation learning, um, you're not able to","start":3176.3,"end":3180.62},{"id":294,"text":"use a reward function to improve over the expert data, uh, but it's very simple, uh,","start":3180.62,"end":3184.54},{"id":295,"text":"and it's very easy to scale simple things to large data sets, uh, whereas RL has a lot","start":3184.6,"end":3189.28},{"id":296,"text":"of potential and, and it can help a lot when you have some reward information and you want","start":3189.28,"end":3194.76},{"id":297,"text":"to optimize those, uh, rewards and you can actually do a lot better than, um, than some","start":3194.76,"end":3199.38},{"id":298,"text":"some provided data set.","start":3199.38,"end":3201.78},{"id":299,"text":"And then I just have some examples","start":3202.52,"end":3204.04},{"id":300,"text":"of what kind of multitask imitation","start":3204.04,"end":3205.92},{"id":301,"text":"learning policies might look like.","start":3205.92,"end":3207.56},{"id":302,"text":"The examples from those kind of two prior architectures, like the robots are doing very simple things. And so I wanted to pick something that's a bit more recent. So here the task identifier is in the top left. In this video, there'll just be two tasks. One is to flatten the towel and one is to hang the towel. And so for the first part, the task is to flatten the towel. And then here we're actually stringing together multiple tasks.","start":3208.76,"end":3231.78}],"notes":["本段讨论了多任务强化学习中任务描述的使用，特别是如何将任务描述作为提示传递给语言模型。任务描述可以是自然语言字符串，例如'将茄子放入碗中'，并将其作为输入传递给Transformer模型。模型会输出动作并进行训练，包括图像编码器、文本编码器和笔（可能指笔刷或工具）。","在多任务强化学习中，任务描述可以作为条件输入，用于指导模型执行不同的任务。这种做法与模仿学习和强化学习相结合，允许模型根据任务描述调整行为。","模仿学习与强化学习在任务描述的使用上有相似之处，但模仿学习无法通过奖励函数改进专家数据，而强化学习则可以利用奖励信息进行优化。","在实际应用中，任务描述可以是简单的字符串，例如'平铺毛巾'或'悬挂毛巾'，并用于指导机器人执行多个任务。这种架构允许模型在不同任务之间进行切换。","任务描述的使用使得模型能够灵活适应不同的任务需求，同时保持模型的通用性。这种架构在多任务学习中具有重要的应用价值。","在实际应用中，任务描述的输入形式可以是自然语言字符串，例如'将茄子放入碗中'，并将其作为输入传递给语言模型。模型会输出动作并进行训练，包括图像编码器、文本编码器和笔（可能指笔刷或工具）。"],"formulas":[],"uncertainties":["pen"],"diagram":"none","start":3056.27,"end":3231.78,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3056.27,"text":"So this is kind of one practical example. Now, we can also look at some more modern architectures. And first off, if you have something like a language model, the task descriptor, it's very natural for it just to be a language string. And you can think of that basically just as the prompt. And so in many ways, one way to think about multitask imitation learning is basically all of the language model imitation learning or supervised fine tuning is with different prompts. You can sort of think of those as different tasks."},{"start":3085.68,"text":"And it's very easy to just pass that into a transformer. And in terms of modern policy architectures for using task strings in robotics, it's often common to also use a transformer and find ways to use image encoders, in this case, kind of pre-trained image encoders, project those into the input space of a language model, also use the task descriptor here."},{"start":3113.46,"text":"which is what should the robot do to put the eggplant in the bowl,"},{"start":3116.7,"text":"pass those in as tokens to a language model,"},{"start":3119.52,"text":"and then output the actions and train the whole model,"},{"start":3123.32,"text":"including the image encoder and the text encoder and pen."},{"start":3128.96,"text":"So here you can view the task identifier, ZI,"},{"start":3133.94,"text":"as basically the prompt for the model."},{"start":3137.82,"text":"The question is, how does this compare to traditional reinforcement learning?"},{"start":3145.56,"text":"Um, in terms of task performance and success rate. So the, um, so like, I guess there's a"},{"start":3153.78,"text":"couple of things that are different here. We'll talk about multitask RL, um, in a bit, like right"},{"start":3159.14,"text":"after this. Uh, and then, so the, like you can do the sort of like prompt conditioning, task"},{"start":3167.22,"text":"identifier conditioning, both with imitation learning and with reinforcement learning. Uh,"},{"start":3171.04,"text":"Uh, and generally the considerations about imitation learning versus RL is very similar"},{"start":3176.3,"text":"to what we've discussed so far, where with imitation learning, um, you're not able to"},{"start":3180.62,"text":"use a reward function to improve over the expert data, uh, but it's very simple, uh,"},{"start":3184.6,"text":"and it's very easy to scale simple things to large data sets, uh, whereas RL has a lot"},{"start":3189.28,"text":"of potential and, and it can help a lot when you have some reward information and you want"},{"start":3194.76,"text":"to optimize those, uh, rewards and you can actually do a lot better than, um, than some"},{"start":3199.38,"text":"some provided data set."},{"start":3202.52,"text":"And then I just have some examples"},{"start":3204.04,"text":"of what kind of multitask imitation"},{"start":3205.92,"text":"learning policies might look like."},{"start":3208.76,"text":"The examples from those kind of two prior architectures, like the robots are doing very simple things. And so I wanted to pick something that's a bit more recent. So here the task identifier is in the top left. In this video, there'll just be two tasks. One is to flatten the towel and one is to hang the towel. And so for the first part, the task is to flatten the towel. And then here we're actually stringing together multiple tasks."}],"speech_gaps":[],"frame":"../frames/v022/019.webp","frame_time":3068.27},{"title":"多任务强化学习中的任务抽象与策略设计","segments":[{"id":303,"text":"So at the point where the robot is at a point where it's better, it's like the towel is in a more flattened state, the human actually switches the task and then tells the robot, now I want you to hang the towel. And this again is passed into a transformer for the robot to do that task. This is a case where there's two tasks.","start":3232.5,"end":3251.21},{"id":304,"text":"You can also do actually a lot more tasks, potentially. So here's an example where there's, I think, more than 10 tasks, 10 different language strings that the robot follows. So put the plate in the drawer, close the microwave, drive the base backward, rotate the base left. And one of the things that's interesting to note here is that tasks can also have different levels of abstraction. So you might have a level of abstraction of just drive forward or move your right gripper lower. Or you might have something that's much higher, like throw the napkin away.","start":3251.8,"end":3280.46},{"id":305,"text":"or something like that. The question is, if you had one policy for each task, would that run similar to this or different? Yeah, so in this case, it's one policy with the prompt as input. You could also have a different policy, one for each task. If you don't do any what I would call weight sharing, if you have basically a completely different set of parameters for every single task, then you can't really make use of...","start":3281.01,"end":3308.57},{"id":306,"text":"like the weights are only trained on data from that one task and we're going to have a smaller dataset. And so usually in many scenarios that performs worse than training a single policy. Another consideration is that it ends up using a lot more memory to store all those weights and you might actually need to reload the model into memory and so it can take longer to switch between different tasks.","start":3308.78,"end":3328.96},{"id":307,"text":"But sometimes there are also optimization challenges with trying to fit multiple tasks into one model. And so sometimes there are some circumstances where training different policies for different tasks can be useful. Yeah, so the question is, are these systems hierarchical? Like some of these tasks are fairly high level. So the next part of this slide is what about like even more high level tasks? Like what if you wanted to tell the robot clean the kitchen?","start":3330.38,"end":3353.81},{"id":308,"text":"For the videos that I've shown here, this is just one single policy that's doing it. But hierarchy is very useful for higher level tasks. And if you just told this robot to clean the kitchen, it wouldn't be able to do what it did in this video.","start":3355.32,"end":3373.0},{"id":309,"text":"And so we'll have a lecture on hierarchy in like, I think, two-ish weeks. And we'll talk about exactly that and scenarios where we could try to do even higher level tasks. But yeah, even with a single policy, a single flat policy without hierarchy, it is able to do kind of reasonable actions for tasks that are somewhat high level.","start":3373.86,"end":3393.42},{"id":310,"text":"What does long-horizon task mean?","start":3394.45,"end":3395.93},{"id":311,"text":"By that, I mean a task that takes a long time,","start":3396.25,"end":3399.27},{"id":312,"text":"basically, where you have to take many time steps,","start":3399.35,"end":3402.53},{"id":313,"text":"you have to take a lot of different actions in order to do that.","start":3402.69,"end":3404.77},{"id":314,"text":"There's generally a number of challenges that can come up with","start":3405.99,"end":3408.45},{"id":315,"text":"long-horizon tasks such as,","start":3408.45,"end":3410.55}],"notes":["本段讨论了多任务强化学习中策略设计的两种方式：一种是使用单一策略，通过提示（prompt）来处理多个任务；另一种是为每个任务单独设计策略，但这种方式通常需要更多的参数和计算资源。讲者指出，如果不对参数进行共享，每个任务的权重仅基于该任务的数据进行训练，这可能导致性能下降。","讲者提到，使用多个独立策略会占用更多内存，因为需要存储所有任务的参数，这在任务切换时可能需要重新加载模型，从而增加延迟。因此，在资源有限的情况下，单一策略可能更优。","此外，讲者还提到，有时在尝试将多个任务整合到一个模型中时会遇到优化挑战，因此在某些情况下，为不同任务训练不同的策略可能是有用的。","讲者进一步指出，任务可以有不同的抽象层次，例如从简单的动作（如“向前移动”）到更复杂的任务（如“扔掉餐巾”）。这表明，任务的抽象程度会影响策略的设计和执行。","最后，讲者提到，虽然单一策略可能无法处理非常复杂的任务，但它仍然能够执行一些较高层次的任务，这表明策略的抽象能力在多任务学习中是重要的。","讲者还引入了“长时域任务”（long-horizon task）的概念，指出这类任务需要执行大量动作，并且通常面临挑战，如训练难度和计算资源需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3232.5,"end":3410.55,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3232.5,"text":"So at the point where the robot is at a point where it's better, it's like the towel is in a more flattened state, the human actually switches the task and then tells the robot, now I want you to hang the towel. And this again is passed into a transformer for the robot to do that task. This is a case where there's two tasks."},{"start":3251.8,"text":"You can also do actually a lot more tasks, potentially. So here's an example where there's, I think, more than 10 tasks, 10 different language strings that the robot follows. So put the plate in the drawer, close the microwave, drive the base backward, rotate the base left. And one of the things that's interesting to note here is that tasks can also have different levels of abstraction. So you might have a level of abstraction of just drive forward or move your right gripper lower. Or you might have something that's much higher, like throw the napkin away."},{"start":3281.01,"text":"or something like that. The question is, if you had one policy for each task, would that run similar to this or different? Yeah, so in this case, it's one policy with the prompt as input. You could also have a different policy, one for each task. If you don't do any what I would call weight sharing, if you have basically a completely different set of parameters for every single task, then you can't really make use of..."},{"start":3308.78,"text":"like the weights are only trained on data from that one task and we're going to have a smaller dataset. And so usually in many scenarios that performs worse than training a single policy. Another consideration is that it ends up using a lot more memory to store all those weights and you might actually need to reload the model into memory and so it can take longer to switch between different tasks."},{"start":3330.38,"text":"But sometimes there are also optimization challenges with trying to fit multiple tasks into one model. And so sometimes there are some circumstances where training different policies for different tasks can be useful. Yeah, so the question is, are these systems hierarchical? Like some of these tasks are fairly high level. So the next part of this slide is what about like even more high level tasks? Like what if you wanted to tell the robot clean the kitchen?"},{"start":3355.32,"text":"For the videos that I've shown here, this is just one single policy that's doing it. But hierarchy is very useful for higher level tasks. And if you just told this robot to clean the kitchen, it wouldn't be able to do what it did in this video."},{"start":3373.86,"text":"And so we'll have a lecture on hierarchy in like, I think, two-ish weeks. And we'll talk about exactly that and scenarios where we could try to do even higher level tasks. But yeah, even with a single policy, a single flat policy without hierarchy, it is able to do kind of reasonable actions for tasks that are somewhat high level."},{"start":3394.45,"text":"What does long-horizon task mean?"},{"start":3396.25,"text":"By that, I mean a task that takes a long time,"},{"start":3399.35,"text":"basically, where you have to take many time steps,"},{"start":3402.69,"text":"you have to take a lot of different actions in order to do that."},{"start":3405.99,"text":"There's generally a number of challenges that can come up with"},{"start":3408.45,"text":"long-horizon tasks such as,"}],"speech_gaps":[],"frame":"../frames/v022/020.webp","frame_time":3244.5},{"title":"多任务强化学习中的任务描述与数据共享","segments":[{"id":316,"text":"you have to be thinking about what you should be","start":3413.19,"end":3415.33},{"id":317,"text":"and there's lots of things you could do to complete that,","start":3415.33,"end":3417.33},{"id":318,"text":"and there's lots of things you could do to complete that,","start":3417.53,"end":3419.93},{"id":319,"text":"so there might be multi-modality.","start":3420.03,"end":3421.23},{"id":320,"text":"In reinforcement learning settings,","start":3421.59,"end":3422.91},{"id":321,"text":"settings, you might also have sparse rewards and you might not get reward feedback for","start":3422.91,"end":3426.39},{"id":322,"text":"a very long time.","start":3426.39,"end":3427.13},{"id":323,"text":"Yeah, so the question is, a lot of these tasks are pretty similar.","start":3428.07,"end":3430.61},{"id":324,"text":"What if you wanted a task that's more vision-based, I think you said?","start":3430.73,"end":3433.07},{"id":325,"text":"Yeah, so this particular model was actually also trained to do certain vision tasks, like","start":3435.63,"end":3440.97},{"id":326,"text":"asking questions about the image and captioning an image, that sort of stuff.","start":3440.97,"end":3447.29},{"id":327,"text":"And if you have a big enough model, it's not too hard to do that.","start":3447.73,"end":3451.99},{"id":328,"text":"But generally, you do need larger models to be able to do more things.","start":3451.99,"end":3455.63},{"id":329,"text":"Cool.","start":3458.27,"end":3458.67},{"id":330,"text":"So we've talked a bit about multitask imitation learning.","start":3459.53,"end":3461.49},{"id":331,"text":"Now, what about multitask RL?","start":3461.69,"end":3463.05},{"id":332,"text":"Basically, kind of the story is pretty similar.","start":3464.63,"end":3466.97},{"id":333,"text":"We can feed as input a task descriptor into the policy,","start":3467.57,"end":3470.69},{"id":334,"text":"feed as input a task descriptor into a Q function or a value function.","start":3471.09,"end":3474.93},{"id":335,"text":"Like whatever we're learning, we can pass in that sort of that prompt","start":3475.05,"end":3477.89},{"id":336,"text":"prompt, or some other descriptor of the task into the models.","start":3477.89,"end":3482.39},{"id":337,"text":"If you have a discrete number of tasks,","start":3485.01,"end":3488.89},{"id":338,"text":"then it can be useful to have a different replay buffer for each task,","start":3489.05,"end":3491.79},{"id":339,"text":"especially if you want to try to balance the sampling of each batch.","start":3492.05,"end":3495.25},{"id":340,"text":"And now there's this question of sharing data.","start":3498.69,"end":3502.15},{"id":341,"text":"And this comes up specifically in reinforcement learning,","start":3503.55,"end":3506.39},{"id":342,"text":"not in imitation learning.","start":3506.51,"end":3507.53},{"id":343,"text":"So in particular, if we collected some sort of exploratory data for a task,","start":3507.89,"end":3513.45},{"id":344,"text":"maybe our policy was told to pick up the sponge or something like that,","start":3514.97,"end":3519.39},{"id":345,"text":"our policy did something, it might not have picked up the sponge","start":3519.87,"end":3523.07},{"id":346,"text":"because it may have made a mistake.","start":3523.07,"end":3524.09},{"id":347,"text":"That sort of experience might be useful for other task descriptors as well.","start":3525.07,"end":3530.65},{"id":348,"text":"And if we have a per-task replay buffer, like one for each task,","start":3530.97,"end":3535.45},{"id":349,"text":"then we're not actually going to be updating the policy for other tasks using that data.","start":3535.45,"end":3538.87},{"id":350,"text":"And we could actually think about scenarios where we might actually be able to reuse data from one task to actually more explicitly help the model or the policy learn something about another task.","start":3539.68,"end":3553.92},{"id":351,"text":"And if we were to do this, we actually have to relabel the data.","start":3556.74,"end":3559.88},{"id":352,"text":"So, specifically, like, if the tasks have different reward functions, but maybe the same dynamics, then you'd have to actually change the reward label in the data set for it to be the reward label for the other task.","start":3559.88,"end":3573.48},{"id":353,"text":"Let's walk through an example.","start":3574.66,"end":3576.1},{"id":354,"text":"So, say that you are trying to learn to play hockey, and there's, like, maybe some teammates in blue.","start":3576.4,"end":3587.46},{"id":355,"text":"There is a goalkeeper from the other team.","start":3587.62,"end":3589.7}],"notes":["本段讨论了多任务强化学习（Multi-Task RL）中任务描述的输入方式以及数据共享的问题。讲者提到，任务描述可以作为输入传递给策略（policy）、Q函数或价值函数，以指导模型执行特定任务。此外，讲者还提到，如果任务数量是离散的，为每个任务维护独立的回放缓冲区（replay buffer）可能有助于平衡每个批次的采样。","讲者进一步指出，在强化学习中，数据共享是一个重要问题，特别是在不同任务之间。如果一个任务的探索数据（如尝试拾取海绵但失败）可能对其他任务有帮助，但若使用独立的回放缓冲区，则无法利用这些数据。因此，讲者提到需要重新标记数据，以适应不同任务的奖励函数。","讲者通过一个例子说明了数据共享的潜在价值：例如，学习打冰球时，如果一个任务的探索数据（如尝试拾取海绵但失败）可能对其他任务有帮助，但若使用独立的回放缓冲区，则无法利用这些数据。因此，讲者提到需要重新标记数据，以适应不同任务的奖励函数。","讲者还提到，如果任务具有相同的动态（dynamics）但不同的奖励函数，那么需要重新标记数据集中的奖励标签，以使其适用于其他任务。这表明在多任务强化学习中，数据的共享和重用需要考虑任务之间的差异性。","讲者最后提到，通过一个具体的例子（如学习打冰球）来说明多任务强化学习中的数据共享问题，强调了任务描述和数据标记在多任务学习中的重要性。","讲者强调了在多任务强化学习中，任务描述的输入方式、数据共享的挑战以及数据重用的必要性，这些内容为后续讨论多任务强化学习的实现方法提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3413.19,"end":3589.7,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3413.19,"text":"you have to be thinking about what you should be"},{"start":3415.33,"text":"doing in order to complete that,"},{"start":3417.53,"text":"and there's lots of things you could do to complete that,"},{"start":3420.03,"text":"so there might be multi-modality."},{"start":3421.59,"text":"In reinforcement learning settings,"},{"start":3422.91,"text":"settings, you might also have sparse rewards and you might not get reward feedback for"},{"start":3426.39,"text":"a very long time."},{"start":3428.07,"text":"Yeah, so the question is, a lot of these tasks are pretty similar."},{"start":3430.73,"text":"What if you wanted a task that's more vision-based, I think you said?"},{"start":3435.63,"text":"Yeah, so this particular model was actually also trained to do certain vision tasks, like"},{"start":3440.97,"text":"asking questions about the image and captioning an image, that sort of stuff."},{"start":3447.73,"text":"And if you have a big enough model, it's not too hard to do that."},{"start":3451.99,"text":"But generally, you do need larger models to be able to do more things."},{"start":3458.27,"text":"Cool."},{"start":3459.53,"text":"So we've talked a bit about multitask imitation learning."},{"start":3461.69,"text":"Now, what about multitask RL?"},{"start":3464.63,"text":"Basically, kind of the story is pretty similar."},{"start":3467.57,"text":"We can feed as input a task descriptor into the policy,"},{"start":3471.09,"text":"feed as input a task descriptor into a Q function or a value function."},{"start":3475.05,"text":"Like whatever we're learning, we can pass in that sort of that prompt"},{"start":3477.89,"text":"prompt, or some other descriptor of the task into the models."},{"start":3485.01,"text":"If you have a discrete number of tasks,"},{"start":3489.05,"text":"then it can be useful to have a different replay buffer for each task,"},{"start":3492.05,"text":"especially if you want to try to balance the sampling of each batch."},{"start":3498.69,"text":"And now there's this question of sharing data."},{"start":3503.55,"text":"And this comes up specifically in reinforcement learning,"},{"start":3506.51,"text":"not in imitation learning."},{"start":3507.89,"text":"So in particular, if we collected some sort of exploratory data for a task,"},{"start":3514.97,"text":"maybe our policy was told to pick up the sponge or something like that,"},{"start":3519.87,"text":"our policy did something, it might not have picked up the sponge"},{"start":3523.07,"text":"because it may have made a mistake."},{"start":3525.07,"text":"That sort of experience might be useful for other task descriptors as well."},{"start":3530.97,"text":"And if we have a per-task replay buffer, like one for each task,"},{"start":3535.45,"text":"then we're not actually going to be updating the policy for other tasks using that data."},{"start":3539.68,"text":"And we could actually think about scenarios where we might actually be able to reuse data from one task to actually more explicitly help the model or the policy learn something about another task."},{"start":3556.74,"text":"And if we were to do this, we actually have to relabel the data."},{"start":3559.88,"text":"So, specifically, like, if the tasks have different reward functions, but maybe the same dynamics, then you'd have to actually change the reward label in the data set for it to be the reward label for the other task."},{"start":3574.66,"text":"Let's walk through an example."},{"start":3576.4,"text":"So, say that you are trying to learn to play hockey, and there's, like, maybe some teammates in blue."},{"start":3587.62,"text":"There is a goalkeeper from the other team."}],"speech_gaps":[{"start":3433.47,"end":3435.23}],"frame":"../frames/v022/021.webp","frame_time":3425.19},{"title":"多任务强化学习中的经验重用与任务标识","segments":[{"id":356,"text":"in orange. And maybe one task is passing, another task is shooting a goal.","start":3589.88,"end":3596.1},{"id":357,"text":"And maybe you were trying to shoot a goal, but you messed up and you accidentally","start":3598.96,"end":3602.76},{"id":358,"text":"actually making it like a pretty good pass to your teammate. Then that data that you just","start":3603.92,"end":3613.1},{"id":359,"text":"collected, even though you were intending to shoot a goal, that data actually is probably","start":3613.1,"end":3616.24},{"id":360,"text":"pretty useful for learning how to be better at passing. And so what you could","start":3616.24,"end":3622.1},{"id":361,"text":"do is you could store that experience as normal under the original task identifier,","start":3622.1,"end":3625.78},{"id":362,"text":"but you could also relabel the experience with the task one ID, specifically the passing ID,","start":3626.04,"end":3635.68},{"id":363,"text":"there's a typo there, and then store that in the repo buffer for that task.","start":3635.8,"end":3639.3},{"id":364,"text":"Specifically, what this algorithm would look like is maybe you pick one of your tasks, and then we pick a corresponding task identifier. Then we're going to collect data, and we'll be collecting data from our policy that's going to be then conditioned on","start":3642.82,"end":3674.8},{"id":365,"text":"that task identifier. Then, and maybe let's refer to this data as, like, it'll have ST, AT, ST plus 1, RT, and then it will also have the task identifier. We'll maybe put this into a replay buffer for task I. So we'll store this in the replay buffer.","start":3675.49,"end":3705.02},{"id":366,"text":"And then we could actually then potentially use this for another task as well. So that's what I'm calling relabeling. And we could consider this data. So ST, AT, ST plus 1. But we could actually consider it for a different task, maybe task J. And so the reward for task J would be R of J for ST, AT.","start":3707.75,"end":3734.64},{"id":367,"text":"the task identifier for task J. And we could take this data that's been relabeled and add this to either our shared replay buffer or our replay buffer for task J. So then we're actually using experience for one task to learn another task. And then we might do this for multiple tasks. Eventually, we will update our","start":3736.89,"end":3767.84}],"notes":["本段讲解了在多任务强化学习中，一个任务的执行经验可能对另一个任务有帮助。例如，原本意图射门但意外完成了一次高质量传球，这种经验可以被重新标记为传球任务，并存储到相应的经验回放缓冲区中。","讲者提到，算法可以选取一个任务及其对应的任务标识符，收集数据时将策略条件化于该任务标识符。数据包括状态、动作、下一状态、奖励以及任务标识符，并存储到对应任务的回放缓冲区中。","讲者进一步说明，这种经验可以被重新标记为其他任务（如任务J），并用于该任务的学习。此时，奖励函数将基于任务J的当前状态和动作进行计算。","讲者指出，这种经验重用机制可以应用于多个任务，最终通过更新策略来提升多个任务的性能。","讲者强调，这种重新标记经验的方法是多任务强化学习中一种重要的经验重用策略，能够提高学习效率。","讲者提到，经验可以被存储到共享的回放缓冲区或特定任务的回放缓冲区中，从而实现跨任务的知识迁移。"],"formulas":[],"uncertainties":["repo buffer 可能是 'replay buffer' 的误听，需确认是否为回放缓冲区的术语。"],"diagram":"none","start":3589.88,"end":3767.84,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3589.88,"text":"in orange. And maybe one task is passing, another task is shooting a goal."},{"start":3598.96,"text":"And maybe you were trying to shoot a goal, but you messed up and you accidentally"},{"start":3603.92,"text":"actually making it like a pretty good pass to your teammate. Then that data that you just"},{"start":3613.1,"text":"collected, even though you were intending to shoot a goal, that data actually is probably"},{"start":3616.24,"text":"pretty useful for learning how to be better at passing. And so what you could"},{"start":3622.1,"text":"do is you could store that experience as normal under the original task identifier,"},{"start":3626.04,"text":"but you could also relabel the experience with the task one ID, specifically the passing ID,"},{"start":3635.8,"text":"there's a typo there, and then store that in the repo buffer for that task."},{"start":3642.82,"text":"Specifically, what this algorithm would look like is maybe you pick one of your tasks, and then we pick a corresponding task identifier. Then we're going to collect data, and we'll be collecting data from our policy that's going to be then conditioned on"},{"start":3675.49,"text":"that task identifier. Then, and maybe let's refer to this data as, like, it'll have ST, AT, ST plus 1, RT, and then it will also have the task identifier. We'll maybe put this into a replay buffer for task I. So we'll store this in the replay buffer."},{"start":3707.75,"text":"And then we could actually then potentially use this for another task as well. So that's what I'm calling relabeling. And we could consider this data. So ST, AT, ST plus 1. But we could actually consider it for a different task, maybe task J. And so the reward for task J would be R of J for ST, AT."},{"start":3736.89,"text":"the task identifier for task J. And we could take this data that's been relabeled and add this to either our shared replay buffer or our replay buffer for task J. So then we're actually using experience for one task to learn another task. And then we might do this for multiple tasks. Eventually, we will update our"}],"speech_gaps":[],"frame":"../frames/v022/022.webp","frame_time":3601.88},{"title":"多任务强化学习中的重贴标签策略","segments":[{"id":368,"text":"policy pi theta and collect some more data. The question is, how do we decide if it's worth relabeling? In particular, we're doing this for task j. Which task j should we pick? Should we do it for all j's? Should we only do it for some j's? Should we only do this some of the time? This ends up being somewhat of a heuristic process because it's a little bit hard to tell generally if","start":3768.58,"end":3795.71},{"id":369,"text":"data will be useful for learning one task or not, because learning is somewhat of an amorphous process, I guess. The one heuristic is that if rj was high, then it might be good for learning that task, because you actually might have accidentally done something good for a different task. So that's one heuristic. Another heuristic sometimes is just to also sample randomly and use it for all tasks at random and uniformly.","start":3796.3,"end":3823.92},{"id":370,"text":"How does this work for continuous state? There's nothing here that assumes discrete states. How do you reach? So this is actually, what I've written here is like a relabeling algorithm for any sort of multitask system. There's also, we'll talk about what this looks like for goal condition settings in a minute, if that's what you're wondering about. Yeah, so this is a great point.","start":3824.97,"end":3849.25},{"id":371,"text":"There's only a few scenarios. You can't do this universally. And so this is something that's called hindsight relabeling because you kind of look at what you did. If you did something good, then in hindsight, you can kind of then relabel that to be a different task. So in terms of this algorithm on the slides, we collect some data using some policy. We store that data in a replay buffer. We are going to perform hindsight relabeling.","start":3850.3,"end":3876.45},{"id":372,"text":"And what this looks like is this. We originally collected it for task I. We're going to relabel it with the reward for task J. And then we'll store that relabeled data in our replay buffer. The slides have this for like a single combined replay buffer. You could also do this with different replay buffers for each task. Then you'll update your policy with the replay buffer and repeat this process.","start":3877.14,"end":3902.56},{"id":373,"text":"In terms of which tasks to choose, you can choose this randomly, tasks that get high rewards. The note here is also you can actually do it for trajectories that get high rewards, not just transitions that get high rewards, because if there's a high reward somewhere in the trajectory, then other parts of the trajectory might have d
