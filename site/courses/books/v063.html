<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯坦福CS230：监督、自监督、弱监督学习</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：监督、自监督、弱监督学习 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v063","title":"斯坦福CS230：监督、自监督、弱监督学习","course":"深度学习","pages":[{"title":"课程介绍与学习目标","segments":[{"id":0,"text":"I'm Kian Caton-Fourouche, and I am the co-creator and co-lecturer with Andrew for this class, CS230.","zh":"我是Kian Caton-Fourouche，我是Andrew的合作者和共同讲师，负责这门课程CS230。","start":1.62,"end":9.78},{"id":1,"text":"And I will teach about half of the in-person lectures this quarter.","zh":"我将负责本季度一半的现场讲座。","start":11.76,"end":16.44},{"id":2,"text":"Outside of Stanford, I work in industry.","zh":"在斯坦福大学之外，我在工业界工作。","start":17.26,"end":20.32},{"id":3,"text":"I lead a company called Workera, which uses AI to measure skills.","zh":"我领导一家名为Workera的公司，该公司利用AI来衡量技能。","start":20.56,"end":24.08},{"id":4,"text":"And with the history of CS230 students that have started AI startups and companies,","zh":"考虑到CS230学生中有许多开始AI初创公司和企业，","start":24.98,"end":30.76},{"id":5,"text":"What I try to do usually is to bring a lot of examples from industry.","zh":"我通常会尝试从工业界引入大量实例。","start":30.76,"end":34.6},{"id":6,"text":"So what you should expect from these in-class lectures is not as much of the academic side of things,","zh":"因此，你们在课堂讲座中应该期待的不只是学术方面的内容，","start":34.8,"end":41.44},{"id":7,"text":"which we learn anyway in the online videos, but also the industry specific inputs.","zh":"这些内容我们已经在在线视频中学习过了，还包括行业特定的输入。","start":41.52,"end":49.34},{"id":8,"text":"And some of the topics that we cover this year together include decision making in AI projects,","zh":"我们今年一起涵盖的一些主题包括人工智能项目中的决策制定，","start":50.48,"end":58.66},{"id":9,"text":"which we're going to see today, you know, I want you to come out of today's lecture feeling like you had some fun.","zh":"今天我们将会看到这一点，你知道的，我希望你们今天听课后感觉有所收获，觉得有趣。","start":58.66,"end":65.1},{"id":10,"text":"It was interactive. And also you have a better way to make decisions in AI projects because you've seen how deep learning researchers,","zh":"这堂课是互动的。同时你们也会有更好的方法来在人工智能项目中做决策，因为你们已经看到深度学习研究人员、","start":65.22,"end":74.26},{"id":11,"text":"engineers and scientists make their decisions solving problems in industry.","zh":"工程师和科学家是如何在工业界解决问题的。","start":74.64,"end":78.86},{"id":12,"text":"industry. Other topics later in the quarter for the in-classroom time include things like","zh":"工业界。本季度后期在课堂上还会涉及其他主题，例如","start":78.86,"end":85.7},{"id":13,"text":"adversarial attacks and defenses. We might have some time to cover it today.","zh":"对抗攻击与防御。我们今天可能有时间来讲解这些内容。","start":86.46,"end":90.58},{"id":14,"text":"Deep reinforcement learning, which is really hot in the market right now, and I think it's","zh":"深度强化学习，这在目前市场上非常热门，我认为了解它非常重要。","start":91.26,"end":95.3},{"id":15,"text":"very important to know about it. And then all the stuff that is very practical, like retrieval","zh":"以及所有非常实用的内容，比如检索","start":95.3,"end":101.08},{"id":16,"text":"augmented generation, AI agents, multi-agent system. As we go deeper into the class and you get the baggage of neural networks, we'll be able to cover even more fun topics. Okay, so today's lecture is going to be structured in three parts, maybe four, depending on whether we have time. We'll start with a little recap.","zh":"增强生成，人工智能代理，多智能体系统。随着我们深入课程，当你掌握了神经网络的相关知识后，我们将能够探讨更多有趣的话题。好的，今天的讲座将分为三个部分，可能四个，这取决于我们是否有时间。我们将从一个简短的回顾开始。","start":101.58,"end":125.72},{"id":17,"text":"of the week, what you've learned online about neurons and layers and deep neural networks. Then we get into a set of supervised learning projects, including a day and night simple, you know, vanilla classification, the trigger word detection, which is actually a project you're going to build at the end of the class yourself. And then face verification, which we'll see also variation of how face verification algorithms work.","zh":"本周的内容，你在网上学习的关于神经元、层和深度神经网络的知识。然后我们将进入一系列监督学习项目，包括白天和黑夜的简单分类，也就是所谓的普通分类，触发词检测，这实际上是你在课程结束时自己要完成的项目。还有人脸识别，我们将看到人脸识别算法的不同变体是如何工作的。","start":126.58,"end":154.06}],"notes":["本段介绍了课程讲师Kian Caton-Fourouche的背景，他是CS230课程的联合创建者和讲师，同时在工业界工作，领导一家使用AI评估技能的公司Workera。他强调课程将结合学术内容和行业实例，帮助学生理解AI项目的决策过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.62,"end":154.06,"asr_flags":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":1.62,"text":"I'm Kian Caton-Fourouche, and I am the co-creator and co-lecturer with Andrew for this class, CS230."},{"start":11.76,"text":"And I will teach about half of the in-person lectures this quarter."},{"start":17.26,"text":"Outside of Stanford, I work in industry."},{"start":20.56,"text":"I lead a company called Workera, which uses AI to measure skills."},{"start":24.98,"text":"And with the history of CS230 students that have started AI startups and companies,"},{"start":30.76,"text":"What I try to do usually is to bring a lot of examples from industry."},{"start":34.8,"text":"So what you should expect from these in-class lectures is not as much of the academic side of things,"},{"start":41.52,"text":"which we learn anyway in the online videos, but also the industry specific inputs."},{"start":50.48,"text":"And some of the topics that we cover this year together include decision making in AI projects,"},{"start":58.66,"text":"which we're going to see today, you know, I want you to come out of today's lecture feeling like you had some fun."},{"start":65.22,"text":"It was interactive. And also you have a better way to make decisions in AI projects because you've seen how deep learning researchers,"},{"start":74.64,"text":"engineers and scientists make their decisions solving problems in industry."},{"start":78.86,"text":"industry. Other topics later in the quarter for the in-classroom time include things like"},{"start":86.46,"text":"adversarial attacks and defenses. We might have some time to cover it today."},{"start":91.26,"text":"Deep reinforcement learning, which is really hot in the market right now, and I think it's"},{"start":95.3,"text":"very important to know about it. And then all the stuff that is very practical, like retrieval"},{"start":101.58,"text":"augmented generation, AI agents, multi-agent system. As we go deeper into the class and you get the baggage of neural networks, we'll be able to cover even more fun topics. Okay, so today's lecture is going to be structured in three parts, maybe four, depending on whether we have time. We'll start with a little recap."},{"start":126.58,"text":"of the week, what you've learned online about neurons and layers and deep neural networks. Then we get into a set of supervised learning projects, including a day and night simple, you know, vanilla classification, the trigger word detection, which is actually a project you're going to build at the end of the class yourself. And then face verification, which we'll see also variation of how face verification algorithms work."}],"speech_gaps":[],"frame":"../frames/v063/001.webp","frame_time":13.620000000000001},{"title":"监督、自监督与弱监督学习概述","segments":[{"id":18,"text":"The third section will focus on self-supervised learning and weakly supervised learning. Don't worry if you don't know these terms, we're going to learn them together. And we'll talk a lot about embeddings because embeddings are the connective tissue of many AI systems online today, and it's important to know about them. And finally, if we have time, we'll also talk about adversarial attacks and defenses with more and more AI systems in the wild, knowing how to defend them is very important. And knowing how to attack them can also teach you how to defend them. So we'll cover that as well.","zh":"第三部分将重点介绍自监督学习和弱监督学习。如果你对这些术语不了解，不用担心，我们将一起学习它们。我们还会大量讨论嵌入，因为嵌入是当今许多在线AI系统的核心连接组织，了解它们非常重要。最后，如果时间允许，我们还将讨论对抗性攻击和防御，随着越来越多的AI系统在现实世界中部署，了解如何防御它们非常重要。了解如何攻击它们也能教你如何防御它们。因此，我们也会涵盖这些内容。","start":155.3,"end":184.42},{"id":19,"text":"them is very important. And knowing how to attack them can also teach you how to defend them. So we'll cover that as well. Sounds good. Please interrupt me as we go through the lecture. We want this to be very conversational as much as possible. So recap of the week is the core way that","zh":"了解如何防御它们非常重要。了解如何攻击它们也能教你如何防御它们。因此，我们也会涵盖这些内容。听起来不错。在我们讲解课程的过程中，请随时打断我。我们希望尽可能让这门课显得非常对话化。本周的回顾是传统监督学习设置中AI从数据中学习的核心方式。你可以把它想象成一个输入，比如这张困惑的猫的小图片，以及一个输出，这种情况下是一个介于零和一之间的数字，代表图片中可能有猫的概率，一，或者没有猫，零。","start":184.58,"end":206.91},{"id":20,"text":"AI learns from data in a traditional supervised learning setup. You can think of it as an input, such as this little image of the confused cat, and an output, in this case, a number between zero and one that represents the chance that there might be a cat on the picture, one, or there's no cat on the picture, zero. What the model is, and oftentimes you'll see me refer to the model as two things. There's an architecture.","zh":"模型是什么，通常你会看到我将模型称为两个部分。一个是架构，这基本上是模型的蓝图，骨架，另一个是参数。它可能只有几个参数，也可能有数十亿个参数，比如OpenAI、DeepMind和其他公司所开发的模型。除此之外，","start":208.47,"end":236.17},{"id":21,"text":"which is essentially the blueprints of the model, the skeleton, and parameters. It might be a few parameters. It might be billions of parameters, like the models that OpenAI, DeepMind, and others work on. Outside of that,","zh":"当你思考AI模型在现实世界中部署时，比如当你思考ChatGPT的情况时，你可以归结为在云端的某个地方有两个文件，一个描述模型的架构，另一个描述属于这个架构的参数。你不断调用这两个文件，从而得到你的推理结果或输出。这实际上是幕后发生的事情。显然，这比这要复杂得多，但这两个是关键组成部分。","start":236.88,"end":253.82},{"id":22,"text":"And so when you think about AI models being deployed in the wild, like when you think about what's happening with ChatGPT, you can really come down to there's two files somewhere on the cloud, one that describes the architecture of the model, one that describes the parameters that are part of this architecture. And you keep calling that to those two files and you get your inference or your outputs. That's really what's happening behind the scene. Much more complicated than that, obviously, but those are the two critical components.","zh":"当你思考AI模型在现实世界中部署时，比如当你思考ChatGPT的情况时，你可以归结为在云端的某个地方有两个文件，一个描述模型的架构，另一个描述属于这个架构的参数。你不断调用这两个文件，从而得到你的推理结果或输出。这实际上是幕后发生的事情。显然，这比这要复杂得多，但这两个是关键组成部分。","start":254.72,"end":283.48},{"id":23,"text":"of a neural network architecture and its parameters that are trained. How does the model learn is through a gradient descent optimization, meaning I send the picture of the cat through the model and the model at the beginning is not trained.","zh":"神经网络架构及其参数的训练。模型是如何学习的，是通过梯度下降优化，这意味着我将猫的图片输入模型，而模型在开始时还没有经过训练。","start":283.78,"end":302.08},{"id":24,"text":"probably wrong. It tells me, I think there's no cat, I think it's zero. And then I use something called the loss function to compare the ground truth. There is a cat on the picture with the prediction from the model at this point in time. Those two numbers are far from each other. That should be a penalty, which the loss function describes. And then in order to give feedback to the parameters, we use this gradient descent update.","zh":"可能结果是错误的。它会告诉我，我认为图片中没有猫，我认为结果是零。然后我使用一种称为损失函数的工具来比较真实标签。此时，图片中确实有猫，而模型的预测结果与真实标签相差很远。这应该是一个惩罚，由损失函数来描述。为了给参数提供反馈，我们使用梯度下降更新。","start":303.29,"end":329.91}],"notes":["本段介绍了课程的第三部分，将涵盖自监督学习和弱监督学习，并强调了嵌入（embeddings）在AI系统中的重要性。同时，还提到将讨论对抗攻击与防御，因为随着AI系统在现实世界中的广泛应用，了解如何防御和攻击这些系统变得非常重要。","课程中提到监督学习的基本概念，即输入（如一张困惑的猫的图片）和输出（如一个介于0和1之间的数字，表示图片中存在猫的概率）。模型通常被分为两个部分：架构（architecture）和参数（parameters），其中架构是模型的蓝图，参数可以是少量或数十亿个，如OpenAI、DeepMind等公司开发的模型。","在实际部署AI模型时，如ChatGPT，模型通常由两个文件组成：一个描述模型的架构，另一个描述参数。通过调用这两个文件，可以得到推理或输出结果。虽然实际过程远比这复杂，但这两个组件是关键。","模型的学习过程是通过梯度下降优化实现的。初始时，模型可能给出错误的预测（如认为图片中没有猫），然后通过损失函数比较真实标签和预测结果，计算损失，并通过梯度下降更新参数以改进模型性能。","课程中提到的损失函数用于衡量预测与真实标签之间的差异，并通过梯度下降算法调整模型参数，以最小化损失，从而提高模型的准确性。","课程强调了监督学习的基本框架，包括输入、输出、模型架构、参数、损失函数和梯度下降优化等核心概念，为后续讨论自监督和弱监督学习奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":155.3,"end":329.91,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":155.3,"text":"The third section will focus on self-supervised learning and weekly supervised learning. Don't worry if you don't know these terms, we're going to learn them together. And we'll talk a lot about embeddings because embeddings are the connective tissue of many AI systems online today, and it's important to know about them. And finally, if we have time, we'll also talk about adversarial attacks and defenses with more and more AI systems in the wild, knowing how to defend"},{"start":184.58,"text":"them is very important. And knowing how to attack them can also teach you how to defend them. So we'll cover that as well. Sounds good. Please interrupt me as we go through the lecture. We want this to be very conversational as much as possible. So recap of the week is the core way that"},{"start":208.47,"text":"AI learns from data in a traditional supervised learning setup. You can think of it as an input, such as this little image of the confused cat, and an output, in this case, a number between zero and one that represents the chance that there might be a cat on the picture, one, or there's no cat on the picture, zero. What the model is, and oftentimes you'll see me refer to the model as two things. There's an architecture."},{"start":236.88,"text":"which is essentially the blueprints of the model, the skeleton, and parameters. It might be a few parameters. It might be billions of parameters, like the models that OpenAI, DeepMind, and others work on. Outside of that,"},{"start":254.72,"text":"And so when you think about AI models being deployed in the wild, like when you think about what's happening with ChatGPT, you can really come down to there's two files somewhere on the cloud, one that describes the architecture of the model, one that describes the parameters that are part of this architecture. And you keep calling that to those two files and you get your inference or your outputs. That's really what's happening behind the scene. Much more complicated than that, obviously, but those are the two critical components."},{"start":283.78,"text":"of a neural network architecture and its parameters that are trained. How does the model learn is through a gradient descent optimization, meaning I send the picture of the cat through the model and the model at the beginning is not trained."},{"start":303.29,"text":"probably wrong. It tells me, I think there's no cat, I think it's zero. And then I use something called the loss function to compare the ground truth. There is a cat on the picture with the prediction from the model at this point in time. Those two numbers are far from each other. That should be a penalty, which the loss function describes. And then in order to give feedback to the parameters, we use this gradient descent update."}],"speech_gaps":[],"frame":"../frames/v063/002.webp","frame_time":167.3},{"title":"监督、自监督与弱监督学习的基本概念","segments":[{"id":25,"text":"We do that many, many times. What it means is that we take our parameters and we tell them, hey, you should go a little bit more to the right or a little bit more to the left until that number that is the prediction for the cat is closer to the ground truth. We do that with batches of data, millions of images of cats and images of anything else. And we give that feedback.","zh":"我们多次重复这个过程。这意味着我们调整参数，告诉它们，嘿，你应该再往右一点或者再往左一点，直到预测的猫的数值更接近真实值。我们以数据批次的方式进行，包括数百万张猫的图片和其它任何东西的图片，并给予反馈。","start":330.84,"end":353.58},{"id":26,"text":"repetitively to the model until the parameters are calibrated and the model is in fact finding the cat on this picture. Nothing new here. You've seen it in the videos. Any question on that learning setup? No?","zh":"我们反复地对模型进行训练，直到参数被校准，模型实际上能够在图片中找到猫。这里没有新内容。你们已经在视频中见过。对此学习设置有任何问题吗？没有？","start":355.31,"end":369.15},{"id":27,"text":"Okay, easy so far. There's many things that can change in this setup and you'll see in the class. First thing is the input. The input does not have to be an image. It can be text, like when we chat GPT. It can be audio. It can be video. It can be structured data. It can be spreadsheets and numbers. Those, we'll see a variety of examples in the class and how it influences the architecture.","zh":"好的，到目前为止还很容易。在这个设置中，有许多可以改变的地方，你们会在课堂上看到。首先，输入不一定是图像。它可以是文本，比如当我们使用Chat GPT时；也可以是音频、视频、结构化数据，比如电子表格和数字。在课堂上，我们会看到各种例子，以及它们如何影响架构。","start":370.29,"end":394.11},{"id":28,"text":"The output, again, doesn't have to be zero and one. This is an example of a classification. You could turn this problem into a regression. For example, if I was asking you what's the age of the cat, estimate the age of the cat, that would be a regression task, not a classification task anymore. Later in the class, we'll also see generative tasks. In fact, lecture four is going to focus on diffusion models, generative adversarial networks, where the output actually is much bigger than the input, typically.","zh":"输出也不一定非得是零和一。这是一个分类的例子。你们可以把这个问题转化为回归问题。例如，如果我问你们猫的年龄是多少，估计猫的年龄，这就是一个回归任务，而不是分类任务了。在课堂的后面部分，我们还会看到生成任务。事实上，第四讲将专注于扩散模型和生成对抗网络，其中输出通常比输入大得多。","start":395.15,"end":423.49},{"id":29,"text":"So you can have a low resolution of a cat as input, and the output is a high resolution of the same cat. The output is bigger than the input, which can be counterintuitive to people.","zh":"因此，输入可以是低分辨率的猫，而输出是同一只猫的高分辨率图像。输出比输入大，这可能对一些人来说是反直觉的。","start":424.59,"end":434.23},{"id":30,"text":"Other things that can change include the architecture. You've learned about the vanilla multi-layer perceptron or the fully connected neural network. That's what we're learning right now online together. By the end of the class, you'll have many architectures that you'll be familiar with from RNNs and convolutional neural networks, transformer models. All of these, at the end of the day, use the basis neural network that you're learning right now.","zh":"其他可以改变的内容还包括架构。你们已经学习了普通的多层感知机或多层全连接神经网络。这就是我们现在一起在线学习的内容。到课程结束时，你们将熟悉许多架构，包括循环神经网络、卷积神经网络和变换器模型。所有这些，最终都使用你们现在正在学习的基本神经网络。","start":435.7,"end":463.86},{"id":31,"text":"They're just stacked on top of each other differently. The loss function is actually a big focus of today's class and of the class in general. The loss function, which is what gives the feedback to the model, you were right or you were wrong and what to do about it, is an art. Designing good loss functions, you know, great.","zh":"它们只是以不同的方式堆叠在彼此之上。损失函数实际上是今天课堂以及整个课程的重点。损失函数，也就是给模型提供反馈的东西，告诉你你是对还是错，以及应该怎么做，这是一门艺术。设计良好的损失函数，你知道，非常重要。","start":464.85,"end":485.8}],"notes":["本段介绍了监督学习的基本过程，即通过多次迭代调整模型参数，使预测结果更接近真实值。使用批量数据进行训练，如数百万张猫的图片和其他图片，并通过反馈机制优化模型。","课堂提到监督学习的输入可以是多种类型，如文本、音频、视频、结构化数据等，这些输入类型会影响模型的架构设计。","输出类型也可以是回归任务，例如预测猫的年龄，而不是分类任务。此外，生成任务如扩散模型和生成对抗网络（GAN）的输出通常比输入更大。","模型架构可以是全连接神经网络、循环神经网络（RNN）、卷积神经网络（CNN）或Transformer模型，这些架构都基于基础的神经网络结构。","损失函数是监督学习中的关键部分，它决定了模型如何调整参数以优化预测结果。设计良好的损失函数是模型性能的重要因素。","课堂强调了监督学习与自监督学习、弱监督学习的区别，以及不同任务（如分类、回归、生成）对模型设计和训练方法的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":330.84,"end":485.8,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":330.84,"text":"We do that many, many times. What it means is that we take our parameters and we tell them, hey, you should go a little bit more to the right or a little bit more to the left until that number that is the prediction for the cat is closer to the ground truth. We do that with batches of data, millions of images of cats and images of anything else. And we give that feedback."},{"start":355.31,"text":"repetitively to the model until the parameters are calibrated and the model is in fact finding the cat on this picture. Nothing new here. You've seen it in the videos. Any question on that learning setup? No?"},{"start":370.29,"text":"Okay, easy so far. There's many things that can change in this setup and you'll see in the class. First thing is the input. The input does not have to be an image. It can be text, like when we chat GPT. It can be audio. It can be video. It can be structured data. It can be spreadsheets and numbers. Those, we'll see a variety of examples in the class and how it influences the architecture."},{"start":395.15,"text":"The output, again, doesn't have to be zero and one. This is an example of a classification. You could turn this problem into a regression. For example, if I was asking you what's the age of the cat, estimate the age of the cat, that would be a regression task, not a classification task anymore. Later in the class, we'll also see generative tasks. In fact, lecture four is going to focus on diffusion models, generative adversarial networks, where the output actually is much bigger than the input, typically."},{"start":424.59,"text":"So you can have a low resolution of a cat as input, and the output is a high resolution of the same cat. The output is bigger than the input, which can be counterintuitive to people."},{"start":435.7,"text":"Other things that can change include the architecture. You've learned about the vanilla multi-layer perceptron or the fully connected neural network. That's what we're learning right now online together. By the end of the class, you'll have many architectures that you'll be familiar with from RNNs and convolutional neural networks, transformer models. All of these, at the end of the day, use the basis neural network that you're learning right now."},{"start":464.85,"text":"They're just stacked on top of each other differently. The loss function is actually a big focus of today's class and of the class in general. The loss function, which is what gives the feedback to the model, you were right or you were wrong and what to do about it, is an art. Designing good loss functions, you know, great."}],"speech_gaps":[],"frame":"../frames/v063/003.webp","frame_time":342.84},{"title":"损失函数设计与神经网络基础","segments":[{"id":32,"text":"Deep learning researchers are very creative when it comes to designing loss functions. And in fact, when we built the algorithm called YOLO, it is called YOLO for you only look once, not you only live once. But YOLO has a very difficult to understand at first loss function. And there is a reason why the loss function was designed like that. So by the end of this class, you'll also have a better intuition on how do we design great loss functions.","zh":"深度学习研究者在设计损失函数时非常有创造力。事实上，当我们构建名为YOLO的算法时，它被称为YOLO（你只需看一次），而不是YOLO（你只需活一次）。但YOLO有一个在最初很难理解的损失函数。设计该损失函数有其原因。因此，到本节课结束时，你也会更好地理解如何设计优秀的损失函数。","start":486.48,"end":514.56},{"id":33,"text":"Other things I'm not going to cover right now, the activation functions in your neural network, the optimizer that you use for your gradient descent loop, and then the hyperparameters that might come in when you train your algorithms. Okay, nothing new here.","zh":"我现在不会讲其他内容，比如你在神经网络中使用的激活函数、你在梯度下降循环中使用的优化器，以及在训练算法时可能出现的超参数。好的，这里没有新内容。","start":516.5,"end":530.18},{"id":34,"text":"This is the basic setup. You've also learned this week about neurons. The easiest way to think about a neuron is the classic logistic regression algorithm where I'm taking the image of the cat. So an image in computer science, the way the machine reads it is three channels, RGB for the three colors, red, green, blue. And we take all these numbers, we put them in a vector. The vector is then fed into a neuron and the neuron has","zh":"这是基本的设置。你本周也学习了关于神经元的知识。最简单的方式来思考一个神经元，就是经典的逻辑回归算法，我以猫的图像为例。在计算机科学中，机器读取图像的方式是三个通道，即红、绿、蓝三种颜色的RGB。我们将所有这些数字放入一个向量中。该向量随后被输入到一个神经元中，该神经元包含","start":530.82,"end":560.02},{"id":35,"text":"two components, the linear part, w transpose x plus b, w being the weight and b being the bias, and then an activation function, in this case the sigmoid function, which is very handy because it takes any number and it puts it between 0 and 1 so that the output can look like a probability. Classic setup. And here the probability is 0.73, which is above 0.5, which tells me the model thinks there's a cat on the picture, because 1 is a cat, 0 is no cat.","zh":"两个部分，线性部分，即w的转置乘以x加上b，其中w是权重，b是偏置，然后是一个激活函数，这里使用的是Sigmoid函数，这非常有用，因为它可以将任何数字转换为0到1之间的值，使得输出看起来像一个概率。经典的设置。在这里，概率是0.73，这高于0.5，这表明模型认为图片中有猫，因为1代表有猫，0代表没有猫。","start":560.1,"end":590.08},{"id":36,"text":"So question for you to get started, how would you modify this binary classification that detects cats in an algorithm that would be able to detect multiple animals, such as a cat, a dog, and a giraffe? What do you need to change about this neural network? Yeah. Okay, so you would change the output layer to match to the number of animals you want to detect. Yeah, correct. Anyone wants to add anything else? Yeah.","zh":"那么，一个初步的问题是，你如何修改这个二分类算法，使其能够检测多种动物，例如猫、狗和长颈鹿？你需要如何更改这个神经网络？是的。好的，你将输出层改为与你要检测的动物数量相匹配。是的，正确。有人想补充其他内容吗？是的。","start":591.89,"end":627.46},{"id":37,"text":"The data that goes in there, how would you change the data? Okay, very good. Yeah, you need data from dogs and giraffes and also maybe nature in general. What else do we need not to forget? Yeah, okay. Add one neuron per animal. Those neurons will be independent from each other and each neuron would focus on one animal. Yeah, good point.","zh":"输入的数据，你打算怎么改变这些数据？好的，非常好。是的，你需要包括狗和长颈鹿的数据，也许还要包括大自然的一般情况。还有什么是我们不能忘记的？是的，好的。为每种动物添加一个神经元。这些神经元将彼此独立，每个神经元将专注于一种动物。是的，很好的观点。","start":628.94,"end":658.67}],"notes":["本段介绍了深度学习研究者在设计损失函数时的创造力，并以YOLO算法为例说明其损失函数设计的复杂性。课程强调理解损失函数设计背后的原理，以提升设计能力。","本段提到神经网络中的神经元概念，将其类比为逻辑回归算法。图像被分解为RGB三个通道，每个通道的数值被组合成向量，输入神经元进行处理。","神经元的结构包括线性部分（w^T x + b）和激活函数（如Sigmoid函数），后者将输出限制在0到1之间，使其可以解释为概率。例如，输出0.73表示模型认为图像中有猫的概率为73%。","课程提出问题，引导学生思考如何将二分类模型扩展为多类别检测模型。答案指出需要修改输出层以匹配检测的动物种类数量，并增加每个动物对应的神经元。","课程进一步讨论数据和模型结构的调整，强调需要收集不同动物的数据，并为每个动物分配独立的神经元以实现分类任务。"],"formulas":[{"latex":"w^T x + b","symbols":"线性部分，w为权重，x为输入向量，b为偏置","explanation":"公式正确，表示线性部分，权重w与输入向量x的点积加上偏置b。","evidence":"two components, the linear part, w transpose x plus b, w being the weight and b being the bias, and then an activation function, in this case the sigmoid function, which is very handy because it takes any number and it puts it between 0 and 1 so that the output can look like a probability. Classic setup. And here the probability is 0.73, which is above 0.5, which tells me the model thinks there's a cat on the picture, because 1 is a cat, 0 is no cat."}],"uncertainties":[],"diagram":"none","start":486.48,"end":658.67,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":486.48,"text":"Deep learning researchers are very creative when it comes to designing loss functions. And in fact, when we built the algorithm called YOLO, it is called YOLO for you only look once, not you only live once. But YOLO has a very difficult to understand at first loss function. And there is a reason why the loss function was designed like that. So by the end of this class, you'll also have a better intuition on how do we design great loss functions."},{"start":516.5,"text":"Other things I'm not going to cover right now, the activation functions in your neural network, the optimizer that you use for your gradient descent loop, and then the hyperparameters that might come in when you train your algorithms. Okay, nothing new here."},{"start":530.82,"text":"This is the basic setup. You've also learned this week about neurons. The easiest way to think about a neuron is the classic logistic regression algorithm where I'm taking the image of the cat. So an image in computer science, the way the machine reads it is three channels, RGB for the three colors, red, green, blue. And we take all these numbers, we put them in a vector. The vector is then fed into a neuron and the neuron has"},{"start":560.1,"text":"two components, the linear part, w transpose x plus b, w being the weight and b being the bias, and then an activation function, in this case the sigmoid function, which is very handy because it takes any number and it puts it between 0 and 1 so that the output can look like a probability. Classic setup. And here the probability is 0.73, which is above 0.5, which tells me the model thinks there's a cat on the picture, because 1 is a cat, 0 is no cat."},{"start":591.89,"text":"So question for you to get started, how would you modify this binary classification that detects cats in an algorithm that would be able to detect multiple animals, such as a cat, a dog, and a giraffe? What do you need to change about this neural network? Yeah. Okay, so you would change the output layer to match to the number of animals you want to detect. Yeah, correct. Anyone wants to add anything else? Yeah."},{"start":628.94,"text":"The data that goes in there, how would you change the data? Okay, very good. Yeah, you need data from dogs and giraffes and also maybe nature in general. What else do we need not to forget? Yeah, okay. Add one neuron per animal. Those neurons will be independent from each other and each neuron would focus on one animal. Yeah, good point."}],"speech_gaps":[],"frame":"../frames/v063/004.webp","frame_time":498.48},{"title":"监督学习中的标签调整与网络表示","segments":[{"id":38,"text":"It's actually what we're going to do. So yes, I think your suggestions were the right one. We could multiply this output layer to have three neurons instead of one. All of them, because it's a fully connected neural net, see the entire pixels flattened in the vector. And then each of them will be focused on an animal. The number one mistake that we see in projects is that people add more data.","zh":"实际上，这就是我们要做的事情。所以是的，我认为你的建议是正确的。我们可以将输出层改为三个神经元而不是一个。所有的神经元，因为这是一个全连接神经网络，会将整个像素展平成一个向量。然后每个神经元都会专注于一种动物。我们在项目中看到的第一个错误是人们添加了更多数据。","start":659.26,"end":682.42},{"id":39,"text":"but forget to adjust the labels. So how do the labels need to be adjusted here? It's not anymore zero and one, right? What type of labels do we need to train this? Yeah, yeah, okay. You know how we call that? Okay, so yeah, yeah. Yeah, vectors, yeah. I think you're saying the same thing, but yeah. So here you would use a one-hot vector or a multi-hot.","zh":"但忘记了调整标签。那么这里的标签需要如何调整呢？它不再是零和一，对吧？我们需要什么样的标签来训练这个网络？是的，是的，好的。你知道我们怎么称呼这种标签吗？好的，是的，是的。是的，向量，是的。我认为你在说同一件事，是的。在这里，你会使用一个one-hot向量或多热向量。","start":683.05,"end":723.06},{"id":40,"text":"One hot means you'll have a vector of size 3, and if there is a cat on the picture, the label is going to be 010, because the second neuron is going to be responsible to detect cats. In fact, that would be called the one hot vector. Oftentimes, you'll have multiple animals on the picture, because cats and dogs can appear together.","zh":"One-hot意味着你会有一个大小为3的向量，如果图片中有猫，标签将是010，因为第二个神经元负责检测猫。实际上，这被称为one-hot向量。通常，图片中会有多个动物，因为猫和狗可能会同时出现。","start":723.64,"end":745.14},{"id":41,"text":"Cats and giraffes, less so. And dogs and giraffes, I've never seen one in the same picture. But anyway, you'll have a multi-hot vector. If you have a cat and a dog on the picture, you'll probably label it as 110. And the reason I'm mentioning that, it may sound silly, but in a lot of projects, people change their data, they forget to change their labels, and then they wonder why it doesn't work.","zh":"猫和长颈鹿的情况较少，狗和长颈鹿我从未在同张图片中见过。但无论如何，你会使用多热向量。如果图片中有猫和狗，你可能会将其标记为110。我之所以提到这一点，可能听起来有点傻，但在很多项目中，人们更改了数据，却忘记更改标签，然后他们会疑惑为什么它不起作用。","start":745.68,"end":764.6},{"id":42,"text":"Okay, cool. Now, in the class, we use a specific notation with superscript and subscript. So when you'll see me refer to something like A11, the superscript in square brackets indicates the layer that you're in. So you're in the first layer. The subscript refers to the index of the neuron, okay? And A is for activation.","zh":"好的，现在在课堂上，我们使用一种特定的记号，带有上标和下标。当你看到我提到像A11这样的内容时，方括号中的上标表示你所在的层数。你处于第一层。下标表示神经元的索引，对吧？A代表激活值。","start":766.86,"end":794.66},{"id":43,"text":"So A subscript 3 square bracket 1 is the output of the third neuron of the first layer. Again, if I continue, second layer would be written like that, and then you'll get your probability. The deeper the network is, the more capacity it has. This is the word we use, capacity. What it means is that if you send a million pictures of cats and a million pictures of non-cats to a shallow network,","zh":"因此，A下标3方括号1表示第一层中第三个神经元的输出。同样，如果继续下去，第二层会这样表示，然后你会得到概率。网络越深，它的容量就越大。我们使用的这个词是容量。它的意思是，如果你将一百万张猫的图片和一百万张非猫的图片输入一个浅层网络，","start":795.41,"end":825.06}],"notes":["本段讲解了监督学习中标签调整的重要性，特别是当模型需要识别多个类别时，应使用one-hot或multi-hot向量作为标签。教师指出，许多项目失败的原因是数据更新但标签未同步，导致模型无法正确学习。","教师进一步解释了one-hot向量的结构，即每个类别对应一个神经元，通过向量中对应位置的1表示该类别存在。例如，猫对应第二位为1的向量010。同时，教师提到在实际应用中，图像可能包含多个对象，因此需要使用multi-hot向量。","教师强调了标签调整的必要性，并指出在实际项目中，人们常常忽略这一点，导致模型训练失败。这说明标签与数据的同步是监督学习成功的关键因素之一。","教师介绍了神经网络中激活值的表示方法，使用上标表示层数，下标表示神经元索引。例如，A₃^[1]表示第一层第三神经元的激活值。这种表示方法有助于理解网络结构和激活传播过程。","教师提到网络深度与模型容量的关系，即网络越深，其表示能力越强。这表明深度神经网络能够处理更复杂的模式，但同时也需要更多的数据和计算资源。","教师通过举例说明了浅层网络在处理大量数据时的局限性，暗示深层网络在处理复杂任务时具有优势。这为后续讨论网络结构和训练方法提供了基础。"],"formulas":[{"latex":"A_{3}^{[1]}","symbols":"A下标3上标1","explanation":"公式正确，表示第一层中第三个神经元的激活值。","evidence":"Okay, cool. Now, in the class, we use a specific notation with superscript and subscript. So when you'll see me refer to something like A11, the superscript in square brackets indicates the layer that you're in. So you're in the first layer. The subscript refers to the index of the neuron, okay? And A is for activation."}],"uncertainties":["A subscript 3 square bracket 1"],"diagram":"none","start":659.26,"end":825.06,"asr_flags":[],"math_clarifications":["原始文本中未提及任何数学公式或符号的错误，因此无需进一步澄清。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":659.26,"text":"It's actually what we're going to do. So yes, I think your suggestions were the right one. We could multiply this output layer to have three neurons instead of one. All of them, because it's a fully connected neural net, see the entire pixels flattened in the vector. And then each of them will be focused on an animal. The number one mistake that we see in projects is that people add more data."},{"start":683.05,"text":"but forget to adjust the labels. So how do the labels need to be adjusted here? It's not anymore zero and one, right? What type of labels do we need to train this? Yeah, yeah, okay. You know how we call that? Okay, so yeah, yeah. Yeah, vectors, yeah. I think you're saying the same thing, but yeah. So here you would use a one-hot vector or a multi-hot."},{"start":723.64,"text":"One hot means you'll have a vector of size 3, and if there is a cat on the picture, the label is going to be 010, because the second neuron is going to be responsible to detect cats. In fact, that would be called the one hot vector. Oftentimes, you'll have multiple animals on the picture, because cats and dogs can appear together."},{"start":745.68,"text":"Cats and giraffes, less so. And dogs and giraffes, I've never seen one in the same picture. But anyway, you'll have a multi-hot vector. If you have a cat and a dog on the picture, you'll probably label it as 110. And the reason I'm mentioning that, it may sound silly, but in a lot of projects, people change their data, they forget to change their labels, and then they wonder why it doesn't work."},{"start":766.86,"text":"Okay, cool. Now, in the class, we use a specific notation with superscript and subscript. So when you'll see me refer to something like A11, the superscript in square brackets indicates the layer that you're in. So you're in the first layer. The subscript refers to the index of the neuron, okay? And A is for activation."},{"start":795.41,"text":"So A subscript 3 square bracket 1 is the output of the third neuron of the first layer. Again, if I continue, second layer would be written like that, and then you'll get your probability. The deeper the network is, the more capacity it has. This is the word we use, capacity. What it means is that if you send a million pictures of cats and a million pictures of non-cats to a shallow network,"}],"speech_gaps":[],"frame":"../frames/v063/005.webp","frame_time":671.26},{"title":"神经网络的深度与容量关系","segments":[{"id":44,"text":"It might not have the capacity to learn what's in the data set. It's just not flexible enough. The deeper the network, the more capacity it has. So in fact, a network that is super deep, imagine a billion parameters transformer model with one million pictures of cat and non-cat, it will just overfit to those pictures, meaning it's not going to learn what a cat is. It's just going to learn by heart those million pictures because its capacity is way bigger than the data set it's fed. So it's very important to understand the amount of data you're going to feed and","zh":"它可能没有能力学习数据集中的内容。它不够灵活。网络越深，其容量就越大。事实上，一个超级深的网络，比如一个拥有十亿参数的Transformer模型，如果只用一百万张猫和非猫的图片进行训练，它只会过拟合到这些图片上，这意味着它不会学习到猫是什么。它只会死记硬背那一百万张图片，因为它的容量远远大于它所接收的数据集。因此，理解你要输入的数据量非常重要，","start":825.87,"end":855.13},{"id":45,"text":"the complexity, diversity of that data will probably dictate the capacity of the models we need to use.","zh":"以及这些数据的复杂性和多样性，可能会决定我们需要使用什么样的模型容量。","start":855.24,"end":860.88},{"id":46,"text":"Okay, now just to give you a little bit more intuition on what happens inside those neural networks, we take this relatively shallow network, but call it three layers, and we train it on a data set of facial images. Ignore the task. In face data sets, there's a lot of tasks you could do. You could do a face verification, you could do a face recognition, you could do face...","zh":"好的，现在为了给你一些关于神经网络内部发生情况的直觉，我们拿一个相对较浅的网络，称之为三层网络，然后在一张人脸图像的数据集上对其进行训练。忽略具体任务。在人脸数据集中，你可以进行很多任务。你可以进行人脸验证，你可以进行人脸识别，你还可以进行人脸聚类，诸如此类的事情。我们之后会讨论这些。但假设这个网络已经很好地学习了人脸。如果你现在解剖这个网络，并查询每个神经元，看看里面发生了什么，你会发现第一层网络更适合编码低复杂度的特征。","start":863.82,"end":888.52},{"id":47,"text":"clustering, things like that. We'll talk about that later. But let's say it's been trained really well on understanding faces. If you now unpack this network and you sort of query each neuron and look what's on inside, what you'll notice is that the first layers are going to be better at encoding low complexity features.","zh":"而更深的网络则更适合编码高复杂度的特征。所以事情是这样的。现在不要太复杂。第一层的神经元，它们在查看像素。","start":889.51,"end":911.09},{"id":48,"text":"while the deeper networks are going to be better at encoding higher complexity features. So here's how it goes. Nothing too complicated for now. The neuron in the first layers, they're looking at pixels.","zh":"因为你直接给它们像素。因此，它们擅长将这些像素拼接起来。也许第一个神经元擅长检测对角线边缘，第二个神经元擅长检测垂直边缘，第三个神经元擅长检测水平边缘。因为它们只是在查看像素并试图理解。","start":911.98,"end":925.22},{"id":49,"text":"Because you're giving them directly the pixels. So they're going to be good at stitching those pixels together. And maybe the first neuron will be good at detecting a diagonal edge. The second neuron will be good at vertical edges. And the third one at horizontal edges. Because they're just looking at pixels and trying to make sense.","zh":"因为你直接给他们输入像素。因此，它们擅长将这些像素拼接起来。也许第一个神经元擅长检测对角线边缘，第二个神经元擅长检测垂直边缘，第三个神经元擅长检测水平边缘。因为它们只是观察像素并试图理解。","start":925.93,"end":943.89},{"id":50,"text":"out of them now you go one layer deeper in the middle of the network those are not seeing pixels they're seeing the output of the first layer which is already slightly more complex so what you can expect the layers in the middle of the network to give you or to activate for is higher level features like an eye or a nose or an ear because it turns out if you have a few edges you can start detecting circles and so you would see a neuron that is really good at detecting circles eyes","zh":"其中一些现在你进入网络中间的一层，这些层不再看到像素，而是看到第一层的输出，这已经稍微复杂一些了。因此，你可以期望网络中间的层能够提供或激活更高层次的特征，比如眼睛、鼻子或耳朵。事实上，如果你有几条边，就可以开始检测圆形，因此你会看到一个特别擅长检测圆形或眼睛的神经元","start":944.33,"end":972.81},{"id":51,"text":"The deeper you go in the network, the more you get closer to the task itself, which in this case, facial analysis, let's say, you would see the last few neurons detect larger features of the face. Because again, they're seeing higher complexity information. Does that make sense? This concept, we call it encoding. We'll also talk about embeddings. It's very important because when you train neural networks,","zh":"你越深入网络，就越接近任务本身，比如在这种情况下的面部分析。你会看到最后几层神经元检测面部更大的特征。因为它们看到的是更高复杂度的信息。这是否清楚？这个概念我们称之为编码。我们还会谈到嵌入。这非常重要，因为当你训练神经网络时","start":973.72,"end":999.27}],"notes":["本段主要讲解了神经网络的深度与其容量之间的关系。讲者指出，网络越深，其容量越大，但若数据集的规模和复杂度不足以支撑这种容量，网络可能会过拟合。例如，一个拥有十亿参数的Transformer模型，如果只训练在一百万张猫和非猫的图片上，它会记住这些图片而不是真正理解猫的特征。因此，理解数据集的规模和复杂度对于选择合适的模型至关重要。","讲者进一步解释了神经网络内部的运作机制，以一个三层的浅层网络为例，说明不同层的神经元如何逐步提取特征。第一层神经元处理像素，检测边缘；中间层处理更复杂的特征，如眼睛、鼻子等；而更深层的神经元则负责提取更高层次的特征，如整个面部结构。这种分层特征提取的过程被称为编码。","讲者强调了神经网络中不同层的功能差异，即浅层处理低级特征，深层处理高级特征。这种结构使得网络能够逐步构建对输入数据的理解，最终完成特定任务，如人脸识别。这种分层的特征提取机制是神经网络能够处理复杂任务的关键。","讲者提到，神经网络的编码过程类似于从像素到高级特征的逐步抽象。例如，第一层检测边缘，第二层组合边缘形成形状，第三层识别更复杂的结构，如眼睛或鼻子。这种逐步抽象的过程是神经网络学习能力的基础。","讲者还提到，随着网络深度的增加，神经元能够处理更复杂的特征，从而更接近任务本身。例如，在人脸识别任务中，深层神经元能够检测整个面部的结构，而不仅仅是局部特征。这种深度与任务复杂度之间的关系是设计和训练神经网络时需要考虑的重要因素。","最后，讲者指出，这种编码机制是神经网络学习过程的核心，也是后续讨论嵌入（embeddings）概念的基础。理解这一过程对于掌握神经网络的工作原理至关重要。"],"formulas":[],"uncertainties":["out of them now you go one layer deeper in the middle of the network those are not seeing pixels they're seeing the output of the first layer which is already slightly more complex so what you can expect the layers in the middle of the network to give you or to activate for is higher level features like an eye or a nose or an ear because it turns out if you have a few edges you can start detecting circles and so you would see a neuron that is really good at detecting circles eyes"],"diagram":"none","start":825.87,"end":999.27,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":825.87,"text":"it might not have the capacity to learn what's in the data set. It's just not flexible enough. The deeper the network, the more capacity it has. So in fact, a network that is super deep, imagine a billion parameters transformer model with one million pictures of cat and non-cat, it will just overfit to those pictures, meaning it's not going to learn what a cat is. It's just going to learn by heart those million pictures because its capacity is way bigger than the data set it's fed. So it's very important to understand the amount of data you're going to feed and"},{"start":855.24,"text":"the complexity, diversity of that data will probably dictate the capacity of the models we need to use."},{"start":863.82,"text":"Okay, now just to give you a little bit more intuition on what happens inside those neural networks, we take this relatively shallow network, but call it three layers, and we train it on a data set of facial images. Ignore the task. In face data sets, there's a lot of tasks you could do. You could do a face verification, you could do a face recognition, you could do face..."},{"start":889.51,"text":"clustering, things like that. We'll talk about that later. But let's say it's been trained really well on understanding faces. If you now unpack this network and you sort of query each neuron and look what's going on inside, what you'll notice is that the first layers are going to be better at encoding low complexity features."},{"start":911.98,"text":"while the deeper networks are going to be better at encoding higher complexity features. So here's how it goes. Nothing too complicated for now. The neuron in the first layers, they're looking at pixels."},{"start":925.93,"text":"Because you're giving them directly the pixels. So they're going to be good at stitching those pixels together. And maybe the first neuron will be good at detecting a diagonal edge. The second neuron will be good at vertical edges. And the third one at horizontal edges. Because they're just looking at pixels and trying to make sense."},{"start":944.33,"text":"out of them now you go one layer deeper in the middle of the network those are not seeing pixels they're seeing the output of the first layer which is already slightly more complex so what you can expect the layers in the middle of the network to give you or to activate for is higher level features like an eye or a nose or an ear because it turns out if you have a few edges you can start detecting circles and so you would see a neuron that is really good at detecting circles eyes"},{"start":973.72,"text":"The deeper you go in the network, the more you get closer to the task itself, which in this case, facial analysis, let's say, you would see the last few neurons detect larger features of the face. Because again, they're seeing higher complexity information. Does that make sense? This concept, we call it encoding. We'll also talk about embeddings. It's very important because when you train neural networks,"}],"speech_gaps":[],"frame":"../frames/v063/006.webp","frame_time":837.87},{"title":"监督学习与特征学习的对比","segments":[{"id":52,"text":"You want to make sure first that they're understanding what they're doing, and that's one way to see it. We'll have an entire lecture on interpreting and visualizing neural networks later this quarter. And on top of that...","zh":"你首先要确保他们理解自己在做什么，这是其中一种方式来看待这个问题。我们将在本季度的后续课程中专门讲解如何解释和可视化神经网络。除此之外……","start":1000.08,"end":1011.96},{"id":53,"text":"You probably can make use of some of those encodings and embeddings. We'll see that later, but why in the vector space, the distances between those concepts are important. You can already imagine that for tasks like search, searching in a database, having a neural network able to encode information in a very meaningful way can allow you to find concepts that are close to each other.","zh":"你可能可以利用一些这些编码和嵌入。我们之后会看到这一点，但为什么在向量空间中，这些概念之间的距离是重要的。你已经可以想象，在像搜索、在数据库中进行搜索这样的任务中，拥有一个能够以非常有意义的方式编码信息的神经网络，可以让你找到彼此接近的概念。","start":1013.14,"end":1037.58},{"id":54,"text":"and associate them with each other and concepts that are far from each other and dissociate them from each other. Okay, so this was the warm-up for today.","zh":"并将它们相互关联，同时将彼此远离的概念相互分离。好的，所以这就是我们今天课前的热身内容。","start":1038.56,"end":1047.69},{"id":55,"text":"How much time we spent? Okay. 15 minutes on the warmup. That's good. So we learned a few new words, model, architecture, parameters. I didn't talk about it, but feature engineering versus feature learning. That's the core concept in deep learning is feature engineering is what we used to do before deep learning, which is you might actually build an algorithm that is good at detecting eyes. It's just a good at scanning eyes. You manually build it, you know, and then you build another one that is good at detecting.","zh":"我们花了多少时间？好的。15分钟用于热身。这很好。我们学习了一些新词汇，模型、架构、参数。我没有详细讲解，但特征工程与特征学习的对比。这是深度学习中的核心概念，特征工程是我们深度学习之前所做的事情，即你可能会构建一个算法，它擅长于检测眼睛。它只是擅长于扫描眼睛。你手动构建它，然后你再构建另一个擅长于检测嘴巴的算法，然后将它们组合起来以感知和检测人脸。我们不再这样做。我们现在进行端到端学习，意味着我们让数据自己说话，并训练模型。这被称为特征学习。它是自动的，这就是神经网络实际上在不需要你告诉它眼睛对检测人脸很重要时，如何学习这些特征。你不需要这样做。","start":1048.71,"end":1076.65},{"id":56,"text":"a mouth, and then you put them together to feel and detect faces. We don't do that anymore. We do end-to-end learning, meaning we let the data speak for itself and train the model. This is called feature learning. It's automatic, and that's how the neural network actually learns those features without you needing to tell it eyes are important to detect faces. You don't need to do that.","zh":"编码和嵌入，真正的区别在于编码是任何向量表示。而嵌入是指编码具有意义，即两个编码之间的距离具有意义。它们可能彼此接近或远离，这会告诉你一些信息。其中存在一定的逻辑。然后我们讨论了一次独热编码和多热向量。好的。","start":1077.18,"end":1098.12},{"id":57,"text":"Encoding and embedding, the real difference is encoding is any vector representation. An embedding is when an encoding has meaning, meaning the distance between two encodings has meaning. They might be close or far from each other, and it tells you something. There is a logic to it. And then we talked about one-hot and multi-hot vectors. Okay.","zh":"编码和嵌入，真正的区别在于编码是任何向量表示。而嵌入是指编码具有意义，即两个编码之间的距离具有意义。它们可能彼此接近或远离，这会告诉你一些信息。其中存在一定的逻辑。然后我们讨论了一次独热编码和多热向量。好的。","start":1100.36,"end":1126.35},{"id":58,"text":"So end of the recap. Now let's go into supervised learning projects and we're going to make decisions together and walk through it. The first case study is day and night classification. So here's my problem for you. Given an image that I give you, classify it as whether it's the day or whether it's the night. Okay. Open-ended problem. Ignore that.","zh":"那么回顾就到这里。现在让我们进入监督学习项目，并一起做出决策和逐步分析。第一个案例研究是白天与黑夜分类。所以这是你们的问题。给我一张图片，判断它是白天还是黑夜。好的。这是一个开放性问题。忽略这个。","start":1127.11,"end":1152.31}],"notes":["本段讲解了监督学习与特征学习的核心概念。在传统方法中，特征工程需要人工构建检测眼睛、嘴巴等特征的算法，然后组合起来进行人脸识别。这种方法需要手动设计特征，而深度学习则采用端到端学习，让数据自动学习特征，无需人工指定哪些特征重要。","在特征学习中，神经网络自动学习特征，无需人工干预。这与特征工程形成对比，特征工程是深度学习出现前的方法，而特征学习是深度学习的核心思想。","编码（encoding）和嵌入（embedding）的区别在于，编码是任何向量表示，而嵌入具有语义，即两个编码之间的距离具有意义。例如，一个嵌入空间中，相似的概念会更接近，而不同的概念则更远。","在嵌入空间中，距离的逻辑性意味着可以通过距离来判断概念之间的关系。例如，'猫'和'狗'可能距离较近，而'猫'和'汽车'则距离较远。","课程还提到了one-hot和multi-hot向量，这些是表示数据的常见方式。one-hot向量用于表示离散类别，而multi-hot向量可以表示多个类别。","最后，课程提到将进入监督学习项目，并以白天和黑夜分类作为第一个案例研究。这表明课程将通过实际案例来讲解监督学习的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1000.08,"end":1152.31,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1000.08,"text":"You want to make sure first that they're understanding what they're doing, and that's one way to see it. We'll have an entire lecture on interpreting and visualizing neural networks later this quarter. And on top of that..."},{"start":1013.14,"text":"You probably can make use of some of those encodings and embeddings. We'll see that later, but why in the vector space, the distances between those concepts are important. You can already imagine that for tasks like search, searching in a database, having a neural network able to encode information in a very meaningful way can allow you to find concepts that are close to each other."},{"start":1038.56,"text":"and associate them with each other and concepts that are far from each other and dissociate them from each other. Okay, so this was the warm-up for today."},{"start":1048.71,"text":"How much time we spent? Okay. 15 minutes on the warmup. That's good. So we learned a few new words, model, architecture, parameters. I didn't talk about it, but feature engineering versus feature learning. That's the core concept in deep learning is feature engineering is what we used to do before deep learning, which is you might actually build an algorithm that is good at detecting eyes. It's just a good at scanning eyes. You manually build it, you know, and then you build another one that is good at detecting."},{"start":1077.18,"text":"a mouth, and then you put them together to feel and detect faces. We don't do that anymore. We do end-to-end learning, meaning we let the data speak for itself and train the model. This is called feature learning. It's automatic, and that's how the neural network actually learns those features without you needing to tell it eyes are important to detect faces. You don't need to do that."},{"start":1100.36,"text":"Encoding and embedding, the real difference is encoding is any vector representation. An embedding is when an encoding has meaning, meaning the distance between two encodings has meaning. They might be close or far from each other, and it tells you something. There is a logic to it. And then we talked about one-hot and multi-hot vectors. Okay."},{"start":1127.11,"text":"So end of the recap. Now let's go into supervised learning projects and we're going to make decisions together and walk through it. The first case study is day and night classification. So here's my problem for you. Given an image that I give you, classify it as whether it's the day or whether it's the night. Okay. Open-ended problem. Ignore that."}],"speech_gaps":[],"frame":"../frames/v063/007.webp","frame_time":1012.08},{"title":"监督、自监督与弱监督学习中的数据收集与特征工程","segments":[{"id":59,"text":"Foundation models exist. You don't have access to chat GPT or cloud or whatever. The point is to get under the hood and have those discussions because obviously it's a toy example. So what do you do? What data do you want to collect to solve this problem? Yes. So tell me more. Check how pixels in the same row are. What does it tell you that if you look at the row of pixels and the row next to it, if they're very different, what does it tell you?","zh":"基础模型是存在的。你无法访问Chat GPT或云服务或其他东西。重点是深入了解其内部运作并进行讨论，因为显然这是一个玩具示例。那么你该怎么办？为了解决这个问题，你想收集什么样的数据？是的。告诉我更多。检查同一行中的像素。如果你观察一行像素和它旁边的一行像素，如果它们非常不同，这说明了什么？","start":1153.32,"end":1199.61},{"id":60,"text":"Okay, so you say if the delta between pixels that are close geographically to each other is high, then there's probably colors, color changes, so it's day most likely. Is that it? Okay. So that's an example of feature engineering. It's like you're going for it and great. It's like you're going for it and you're trying to understand what's a pattern that tells me that a picture is day or night. What else can you do in the world of neural networks? Your other ideas.","zh":"好的，你说如果地理上接近的像素之间的差异很大，那么可能有颜色变化，所以这很可能是白天。对吗？好的。这就是一个特征工程的例子。你正在努力寻找并理解一个模式，这个模式能告诉你一张图片是白天还是夜晚。在神经网络的世界中，你还能做些什么？你还有其他想法吗？","start":1203.98,"end":1239.49},{"id":61,"text":"Yeah. Okay, good. Yeah. So yeah, I agree. I said 10,000 images, but how do you even determine how many pictures you need to get started with this project? Feed some data. So you start with like 10 pictures and then you continue to go. Yeah, you could do that. It might take some time. I think the question is how easy is it to collect that data? Like how would you collect that data?","zh":"是的。好的。是的。我同意。我说了10,000张图片，但你如何确定需要收集多少张图片才能开始这个项目？先输入一些数据。你可以从10张图片开始，然后继续增加。是的，你可以这样做。这可能需要一些时间。我认为问题在于收集这些数据有多容易？比如，你会如何收集这些数据？","start":1241.86,"end":1271.34},{"id":62,"text":"OK, yeah, we could put our phone out there and then record the day and the night and have a stream of pictures and add it to the data set. Same location, but different lightings.","zh":"好的，是的。我们可以把手机拿出来，记录白天和夜晚的画面，并持续拍摄图片，然后添加到数据集中。同一地点，但不同的光照条件。","start":1277.17,"end":1287.39}],"notes":["本段讨论了监督学习中数据收集的重要性，以及如何通过观察像素差异来提取特征。讲者提到，通过比较相邻行像素的差异，可以判断图像是否为白天或夜晚，这属于特征工程的一部分。","讲者进一步探讨了数据收集的规模问题，指出从10张图片开始逐步增加数据量是可行的，但需要考虑数据收集的难易程度。","讲者提出了一个实际的数据收集方法，即使用手机记录不同时间段的图像，并将这些图像添加到数据集中，以保持相同地点但不同光照条件的对比。","这些讨论强调了在监督学习中，数据的质量和多样性对模型性能的影响，同时也展示了如何通过简单的特征工程来提升模型的判别能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1153.32,"end":1287.39,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":1153.32,"text":"Foundation models exist. You don't have access to chat GPT or cloud or whatever. The point is to get under the hood and have those discussions because obviously it's a toy example. So what do you do? What data do you want to collect to solve this problem? Yes. So tell me more. Check how pixels in the same row are. What does it tell you that if you look at the row of pixels and the row next to it, if they're very different, what does it tell you?"},{"start":1203.98,"text":"Okay, so you say if the delta between pixels that are close geographically to each other is high, then there's probably colors, color changes, so it's day most likely. Is that it? Okay. So that's an example of feature engineering. It's like you're going for it and great. It's like you're going for it and you're trying to understand what's a pattern that tells me that a picture is day or night. What else can you do in the world of neural networks? Your other ideas."},{"start":1241.86,"text":"Yeah. Okay, good. Yeah. So yeah, I agree. I said 10,000 images, but how do you even determine how many pictures you need to get started with this project? Feed some data. So you start with like 10 pictures and then you continue to go. Yeah, you could do that. It might take some time. I think the question is how easy is it to collect that data? Like how would you collect that data?"},{"start":1277.17,"text":"OK, yeah, we could put our phone out there and then record the day and the night and have a stream of pictures and add it to the data set. Same location, but different lightings."}],"speech_gaps":[],"frame":"../frames/v063/008.webp","frame_time":1165.32},{"title":"定义任务的重要性与复杂性","segments":[{"id":63,"text":"That's a great point. So just to repeat for the people online, you have to define the task first because the task can be easy. You can be in a park in a very specific location and say, just detect if it's day or night, or you can have a problem which is your camera can be anywhere and that makes it more complicated. And also the amount of data you'll need is probably much more for that second problem. That's what you said, right? Now, actually, that's a great thread.","zh":"这是一个很好的观点。所以为了在线的朋友们再重复一遍，你必须首先定义任务，因为任务可能很简单。你可以在一个非常具体的公园位置，说只要检测是否是白天或夜晚，或者你可以有一个问题，即你的相机可以在任何地方，这会让问题更加复杂。此外，你所需的数据显示量可能在第二个问题中要多得多。这就是你所说的，对吧？现在，实际上，这是一个非常好的思路。","start":1329.6,"end":1355.4},{"id":64,"text":"Tell me about cases where this problem would be really hard to solve. Yeah. Yeah. Indoor. Indoor pictures. Actually, how could you tell if you took a picture of me with the screen here, you know, what time it was? You couldn't? You actually can. Yeah. There's a clock here.","zh":"告诉我一些这种问题很难解决的情况。是的。是的。室内。室内照片。实际上，你怎么能知道你是否在这里屏幕前拍了我的照片，你知道，当时是什么时间？你不能吗？你实际上可以。是的。这里有一个钟。","start":1356.21,"end":1378.95},{"id":65,"text":"So that's very interesting because if that was part of the task, then our problem would be hard. And 10,000 images is not going to cut it to understand time. And so it's very important to define the task very well. What else can be hard other than indoor pictures? Also, the clock can be AM or PM. But you can probably take additional information, which is how people are dressed.","zh":"这非常有趣，因为如果任务的一部分是判断时间，那么我们的问题就会变得困难。10,000张图片对于理解时间来说是不够的。因此，定义任务非常重要。除了室内照片之外，还有什么其他情况会很难吗？钟表也可能是上午或下午。但你可能可以利用额外的信息，即人们穿的衣服。","start":1380.16,"end":1407.66},{"id":66,"text":"and think that it might be warmer outside than colder. Again, it can be very complicated at the end of the day. But a human would say, someone is teaching, students are in class, it's probably not 12 a.m. So, I mean, it gets complicated.","zh":"你可能会认为外面可能比里面更温暖。最后，问题可能会变得非常复杂。但人类会说，有人在教学，学生在上课，这可能不是凌晨12点。我的意思是，情况会变得复杂。","start":1408.52,"end":1430.26},{"id":67,"text":"Great point. If you're in the north of Norway right now or Sweden, even the clock can tell you probably if it's day or night. Dawn and dusk. Dawn and dusk. Yeah, exactly. Those are great examples. Actually, this is a good semantic one because you need also to define exactly what's the definition of day and night. So long story short, the problem can seem easy at first. It can be very complicated. And trust me, if you wanted to do this really well, even the foundation models today couldn't do it in certain cases.","zh":"很好的观点。如果你现在在挪威北部或瑞典，即使钟表也能告诉你大概是否是白天或夜晚。黎明和黄昏。黎明和黄昏。是的，正是如此。这些是非常好的例子。实际上，这是一个很好的语义例子，因为你还需要准确地定义什么是白天和夜晚。简而言之，问题一开始可能看起来很简单，但实际上可能非常复杂。相信我，如果你想做得很好，即使今天的基础模型在某些情况下也无法做到。","start":1434.74,"end":1463.9},{"id":68,"text":"Okay, let's say we have 10,000 images, and you talked about the split of images earlier, and I agree with you. You want a mix of different situations in order to be able to cover all of them. And going back to our discussion on model capacity, if it's just a simple problem, you probably need just a small capacity model. If you want to add all these edge cases, you probably are looking for bigger capacity models and more data. What's the input to our model?","zh":"好的，假设我们有10,000张图片，你之前谈到过图片的划分，我同意你的观点。你希望包含不同情况的混合，以便能够覆盖所有情况。回到我们关于模型容量的讨论，如果是简单的问题，你可能只需要一个容量较小的模型。如果你想加入所有这些边缘情况，你可能需要更大容量的模型和更多数据。我们的模型输入是什么？","start":1465.78,"end":1491.27}],"notes":["本段讨论了定义任务的重要性，指出任务的复杂性取决于具体场景和所需信息。例如，判断图片是否为白天或夜晚可能因场景不同而变得复杂，如室内环境或需要考虑时间、天气等因素。","讲者提到，即使有大量数据（如10,000张图片），也可能不足以解决某些复杂问题，如判断时间或天气。这表明任务定义的清晰度对模型性能至关重要。","讲者还指出，人类在判断场景时会利用额外信息，如穿着、环境等，这表明模型需要考虑多种因素来提高准确性。","讲者以北欧地区为例，说明即使有钟表，判断昼夜仍需结合其他信息，强调了任务定义的精确性。","最后，讲者提到即使当前的基础模型在某些情况下也难以完成任务，这表明任务的复杂性可能超出当前技术能力。","讲者强调，模型容量和数据量的增加对于处理复杂任务是必要的，但任务定义的清晰度是成功的关键。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1329.6,"end":1491.27,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1329.6,"text":"That's a great point. So just to repeat for the people online, you have to define the task first because the task can be easy. You can be in a park in a very specific location and say, just detect if it's day or night, or you can have a problem which is your camera can be anywhere and that makes it more complicated. And also the amount of data you'll need is probably much more for that second problem. That's what you said, right? Now, actually, that's a great thread."},{"start":1356.21,"text":"Tell me about cases where this problem would be really hard to solve. Yeah. Yeah. Indoor. Indoor pictures. Actually, how could you tell if you took a picture of me with the screen here, you know, what time it was? You couldn't? You actually can. Yeah. There's a clock here."},{"start":1380.16,"text":"So that's very interesting because if that was part of the task, then our problem would be hard. And 10,000 images is not going to cut it to understand time. And so it's very important to define the task very well. What else can be hard other than indoor pictures? Also, the clock can be AM or PM. But you can probably take additional information, which is how people are dressed."},{"start":1408.52,"text":"and think that it might be warmer outside than colder. Again, it can be very complicated at the end of the day. But a human would say, someone is teaching, students are in class, it's probably not 12 a.m. So, I mean, it gets complicated. What else can be hard? Sunny versus cloudy. Okay, sunny, cloudy, yeah."},{"start":1434.74,"text":"Great point. If you're in the north of Norway right now or Sweden, even the clock can tell you probably if it's day or night. Dawn and dusk. Dawn and dusk. Yeah, exactly. Those are great examples. Actually, this is a good semantic one because you need also to define exactly what's the definition of day and night. So long story short, the problem can seem easy at first. It can be very complicated. And trust me, if you wanted to do this really well, even the foundation models today couldn't do it in certain cases."},{"start":1465.78,"text":"Okay, let's say we have 10,000 images, and you talked about the split of images earlier, and I agree with you. You want a mix of different situations in order to be able to cover all of them. And going back to our discussion on model capacity, if it's just a simple problem, you probably need just a small capacity model. If you want to add all these edge cases, you probably are looking for bigger capacity models and more data. What's the input to our model?"}],"speech_gaps":[],"frame":"../frames/v063/009.webp","frame_time":1341.6},{"title":"图像分辨率选择的重要性","segments":[{"id":69,"text":"I think someone said it already. So let's say a picture of a day or night or whatever. What's the resolution we're going to work with? How do you determine resolution when you build a data set, and why does it matter? Yes. Yeah. Okay, so you want to choose a resolution that's going to be the same across the board. You're going to vectorize everything that's going to fit in the same size matrix. Yeah. Why is it important to have...","zh":"我想有人已经说过这个观点了。那么，假设有一张白天或夜晚或其他时间的照片。我们将会使用什么样的分辨率？在构建数据集时，如何确定分辨率，这又有什么重要性？是的。对的。好的，所以你想要选择一个在所有情况下都一致的分辨率。你将会把所有能放入相同大小矩阵的内容都向量化。对的。为什么要有统一的分辨率是重要的？","start":1492.78,"end":1532.01},{"id":70,"text":"The right resolution, let's say. Okay, so you're saying we want homogeneity in the data set in terms of resolution. I would say that could be a thing, but today you can actually write scripts that downsize high resolution images before it gets in the model. And so it would probably solve upsizing is slightly harder. You would need another algorithm, but it's okay to have different resolutions, but you still want to know what's the target resolution that you're looking for. Exactly.","zh":"比如说正确的分辨率。好的，所以你是在说数据集中在分辨率方面要保持同质性。我认为这可能是一个因素，但今天你实际上可以编写脚本，在图像进入模型之前将其缩小到较低的分辨率。因此，这可能会解决放大图像稍微困难一些的问题。你可能需要另一个算法，但允许不同的分辨率是可以的，但你仍然需要知道你所追求的目标分辨率。没错。","start":1532.66,"end":1569.77},{"id":71,"text":"Exactly. Low resolution, we lack information, so we might get things wrong. For example, the clock might not appear in the picture if it's too low resolution. High resolution means more compute needed. If you have big pictures, it's going to be heavier to train your model, and you're going to pay more, and also your cycles of iterations are going to be longer. In an AI project, that's why resolution matters a lot. So my question is, what resolution do we go for?","zh":"没错。低分辨率意味着信息不足，因此我们可能会犯错误。例如，如果分辨率太低，图片中可能不会出现钟表。高分辨率意味着需要更多的计算资源。如果你有大尺寸的图片，训练模型将会更加耗时，成本也会更高，而且你的迭代周期也会更长。在人工智能项目中，这就是为什么分辨率非常重要。因此，我的问题是，我们应该选择什么样的分辨率？","start":1576.59,"end":1603.89},{"id":72,"text":"Is there a way to just get to a number really quickly in the next 10 minutes, let's say, if we were doing this project? Yeah, exactly. I think that's a great idea. You're saying use the human as a proxy?","zh":"有没有办法在接下来的10分钟内快速得到一个数字，假设我们正在做这个项目？是的，没错。我认为这是一个非常好的想法。你是在说用人类作为代理吗？","start":1607.15,"end":1634.57},{"id":73,"text":"Yeah, so actually this is how we did it. Back in the days, we would print pictures in different resolutions and run it through our friends and say, can you tell if it's the day or the night? And it turns out that below a certain resolution, they can't anymore. It's just like, I don't have the information I need. And where we ended is somewhere around 64 by 64 by three.","zh":"是的，实际上我们就是这样做的。在以前的日子里，我们会打印不同分辨率的图片，然后让我们的朋友看，问他们是否能分辨出是白天还是夜晚。结果发现，当分辨率低于某个阈值时，他们就无法分辨了。这就像是，我没有需要的信息。而我们最终选择的分辨率大约是64乘64乘三。","start":1635.22,"end":1660.2}],"notes":["本段讨论了图像分辨率选择的重要性，指出分辨率不足会导致信息丢失，例如无法识别图像中的钟表。同时，高分辨率会增加计算资源需求，影响模型训练效率和成本。因此，选择合适的分辨率是AI项目中的关键因素。","课堂中提到，通过让人类评估不同分辨率的图像是否能区分白天和黑夜，可以确定最低有效分辨率。实验结果表明，低于某个分辨率时，人类无法准确判断图像内容，这说明分辨率对信息保留至关重要。","最终确定的分辨率是64x64x3，这表明在实际项目中，需要在信息保留和计算成本之间找到平衡。选择合适的分辨率有助于提高模型性能，同时避免不必要的资源浪费。","课堂中还提到，可以通过脚本将高分辨率图像调整为统一尺寸，从而保证数据集的一致性。这说明在实际操作中，可以通过技术手段解决分辨率不一致的问题，但仍然需要明确目标分辨率。","此外，课堂中强调了分辨率对模型训练的影响，包括计算资源消耗和迭代周期延长。因此，在项目初期确定合适的分辨率是优化模型训练过程的重要步骤。","最后，课堂中提出通过快速实验确定分辨率的方法，即使用人类作为代理进行评估，这为实际项目中的分辨率选择提供了可行的策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1492.78,"end":1660.2,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1492.78,"text":"I think someone said it already. So let's say a picture of a day or night or whatever. What's the resolution we're going to work with? How do you determine resolution when you build a data set, and why does it matter? Yes. Yeah. Okay, so you want to choose a resolution that's going to be the same across the board. You're going to vectorize everything that's going to fit in the same size matrix. Yeah. Why is it important to have..."},{"start":1532.66,"text":"The right resolution, let's say. Okay, so you're saying we want homogeneity in the data set in terms of resolution. I would say that could be a thing, but today you can actually write scripts that downsize high resolution images before it gets in the model. And so it would probably solve upsizing is slightly harder. You would need another algorithm, but it's okay to have different resolutions, but you still want to know what's the target resolution that you're looking for. Exactly."},{"start":1576.59,"text":"Exactly. Low resolution, we lack information, so we might get things wrong. For example, the clock might not appear in the picture if it's too low resolution. High resolution means more compute needed. If you have big pictures, it's going to be heavier to train your model, and you're going to pay more, and also your cycles of iterations are going to be longer. In an AI project, that's why resolution matters a lot. So my question is, what resolution do we go for?"},{"start":1607.15,"text":"Is there a way to just get to a number really quickly in the next 10 minutes, let's say, if we were doing this project? Yeah, exactly. I think that's a great idea. You're saying use the human as a proxy?"},{"start":1635.22,"text":"Yeah, so actually this is how we did it. Back in the days, we would print pictures in different resolutions and run it through our friends and say, can you tell if it's the day or the night? And it turns out that below a certain resolution, they can't anymore. It's just like, I don't have the information I need. And where we ended is somewhere around 64 by 64 by three."}],"speech_gaps":[],"frame":"../frames/v063/010.webp","frame_time":1504.78},{"title":"监督、自监督与弱监督学习中的颜色与模型设计","segments":[{"id":74,"text":"And I stress the three, because later this quarter, we'll see that OpenAI and DeepMind, DeepMind as well in reinforcement learning, you know, it turns out for one of the famous algorithms we learned together for reinforcement learning, discovered that you can actually remove colors and the model is not impacted, but your training is way simpler.","zh":"我强调这三点，因为接下来这个季度，我们会看到OpenAI和DeepMind在强化学习中的研究，事实上，对于我们一起学习的一个著名强化学习算法，发现你实际上可以去除颜色，而模型并不会受到影响，但你的训练会简单得多。","start":1660.74,"end":1682.24},{"id":75,"text":"In this case, I think colors matter because of the blue sky, because it does have an inherent information about whether it's day or night. And it turns out the task, if you give it to humans, is much harder without colors than it is with colors.","zh":"在这种情况下，我认为颜色是有意义的，因为蓝天本身就包含有关是白天还是夜晚的固有信息。结果发现，如果你将任务交给人类，没有颜色的情况下任务会比有颜色的情况下更难。","start":1682.97,"end":1696.97},{"id":76,"text":"So those type of insights we could get over the next 10 minutes, literally, by using humans as a proxy. This is a toy example, but I want you to think about that in your AI project. You're going to be at points where you want to validate a hypothesis, and the best proxy you'll have is the human. Okay, what's the output for this model? Yeah, day or night, zero or one?","zh":"我们可以在接下来的10分钟内，通过使用人类作为代理来获得这些类型的见解。这是一个玩具示例，但我希望你在自己的AI项目中思考这一点。你将会遇到需要验证假设的时刻，而你最好的代理就是人类。好的，这个模型的输出是什么？是的，白天或夜晚，0或1？","start":1698.4,"end":1723.32},{"id":77,"text":"Yeah, good question. So does the size of the image impact the input layer, the size of the input layer? Is that it? Yeah, it doesn't. You can make your decisions. You can have three neurons and you send a massive picture inside it. Oftentimes, and that's why I often say deep learning is an engineering field. You have to try it or you have to know the hacks. Typically, the network, if it's a...","zh":"是的，这是一个好问题。那么图像的大小是否会影响输入层的大小？是这样吗？是的，它不会。你可以做出自己的决定。你可以有三个神经元，并将一张巨大的图片输入其中。通常，这就是为什么我常说深度学习是一门工程学科。你必须尝试它，或者你必须知道这些技巧。通常，网络如果是一个……","start":1738.26,"end":1764.34},{"id":78,"text":"In a binary classification, you're going from a high-dimensional input to a very low-dimensional output. So by nature, you'd imagine your network is going to be like this.","zh":"在二元分类中，你从高维输入转换到非常低维的输出。因此，从本质上讲，你可能会想象你的网络会是这样的。","start":1764.69,"end":1775.81},{"id":79,"text":"Probably. Meaning you need more edge detection at the beginning and then higher feature and higher feature until at the end it detects the face. So it's going to be like that. We're going to see examples in week four where the output is bigger than the input and your network is probably like this. So you'll build intuition during the class to know when you want to downsize your input layer or upsize your input layer.","zh":"可能如此。这意味着你需要在开始时进行更多的边缘检测，然后是更高层次的特征，直到最后检测到人脸。因此，它会是这样的。我们在第四周将看到示例，其中输出比输入更大，而你的网络可能就是这样的。因此，在课堂上你会逐渐建立直觉，知道何时要缩小输入层或扩大输入层。","start":1777.04,"end":1799.58},{"id":80,"text":"And by the way, these hacks are valuable. Why does Meta go out and give crazy offers to a few researchers? Because they know that stuff. They know those hacks, literally. Okay, so again, someone said it, the output is zero or one. The last activation is going to be a sigmoid. Yes, question?","zh":"顺便说一下，这些技巧很有价值。为什么Meta会出去给少数研究人员提供疯狂的条件？因为他们了解这些知识。他们真的知道这些技巧。好的，所以再次有人提到，输出是零或一。最后一层激活函数将是一个sigmoid函数。是的，有问题吗？","start":1801.1,"end":1823.32}],"notes":["本段讨论了颜色在图像识别任务中的重要性，特别是在区分白天和黑夜时。讲者指出，颜色信息对人类来说是关键的，但某些模型在去除颜色后仍能保持性能，这表明模型可能依赖其他特征。这为后续的自监督学习和弱监督学习提供了启示。","讲者提到，使用人类作为代理来验证假设是AI项目中的一种常见方法。这表明在缺乏明确标签的情况下，人类的判断可以作为有效的替代方案，帮助验证模型的假设。","讲者强调了深度学习的工程性质，指出模型设计需要尝试和掌握一些技巧。例如，输入层的大小并不直接影响模型的性能，但网络结构的设计需要根据任务进行调整。","在二分类任务中，输入通常是高维的，而输出是低维的。因此，网络结构通常需要从边缘检测开始，逐步提取更高层次的特征，最终进行分类。","讲者提到，某些情况下输出的维度可能大于输入的维度，这表明网络结构的设计需要灵活调整。这种灵活性是深度学习模型的一个重要特点。","讲者最后指出，激活函数的选择（如Sigmoid）对输出结果有直接影响。这表明在模型设计中，选择合适的激活函数是至关重要的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1660.74,"end":1823.32,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1660.74,"text":"And I stress the three, because later this quarter, we'll see that OpenAI and DeepMind, DeepMind as well in reinforcement learning, you know, it turns out for one of the famous algorithms we learned together for reinforcement learning, discovered that you can actually remove colors and the model is not impacted, but your training is way simpler."},{"start":1682.97,"text":"In this case, I think colors matter because of the blue sky, because it does have an inherent information about whether it's day or night. And it turns out the task, if you give it to humans, is much harder without colors than it is with colors."},{"start":1698.4,"text":"So those type of insights we could get over the next 10 minutes, literally, by using humans as a proxy. This is a toy example, but I want you to think about that in your AI project. You're going to be at points where you want to validate a hypothesis, and the best proxy you'll have is the human. Okay, what's the output for this model? Yeah, day or night, zero or one?"},{"start":1738.26,"text":"Yeah, good question. So does the size of the image impact the input layer, the size of the input layer? Is that it? Yeah, it doesn't. You can make your decisions. You can have three neurons and you send a massive picture inside it. Oftentimes, and that's why I often say deep learning is an engineering field. You have to try it or you have to know the hacks. Typically, the network, if it's a..."},{"start":1764.69,"text":"In a binary classification, you're going from a high-dimensional input to a very low-dimensional output. So by nature, you'd imagine your network is going to be like this."},{"start":1777.04,"text":"Probably. Meaning you need more edge detection at the beginning and then higher feature and higher feature until at the end it detects the face. So it's going to be like that. We're going to see examples in week four where the output is bigger than the input and your network is probably like this. So you'll build intuition during the class to know when you want to downsize your input layer or upsize your input layer."},{"start":1801.1,"text":"And by the way, these hacks are valuable. Why does Meta go out and give crazy offers to a few researchers? Because they know that stuff. They know those hacks, literally. Okay, so again, someone said it, the output is zero or one. The last activation is going to be a sigmoid. Yes, question?"}],"speech_gaps":[],"frame":"../frames/v063/011.webp","frame_time":1672.74},{"title":"数据预处理与网络设计","segments":[{"id":81,"text":"Yeah, you can do that. You can probably say in the data set, I don't care of the sizes because I'm scraping data from everywhere. I'm collecting data on my phone. I'm putting it all in a database. I write a script that down samples or up samples everything to the same resolution. And then I send those lower res images in the network because what I care about is the training of my network. I want it to be fast and efficient. You could do that. Yeah, for sure.","zh":"是的，你可以这么做。你可以说在数据集中，我不关心尺寸，因为我是在从各个地方抓取数据。我在手机上收集数据，然后把所有数据都存入数据库。我写了一个脚本，将所有数据下采样或上采样到相同的分辨率。然后我把这些低分辨率的图像输入网络，因为我关心的是网络的训练。我希望它快速且高效。你可以这么做。当然可以。","start":1834.94,"end":1858.52},{"id":82,"text":"And there are networks we're going to see. YOLO is an example of a network where in the later versions of YOLO, it does that automatically. It can take any resolution and it just samples it accordingly.","zh":"我们还会看到一些网络。YOLO就是一个例子，其较新版本可以自动完成这一操作。它可以接受任何分辨率，并相应地进行采样。","start":1859.82,"end":1870.66},{"id":83,"text":"Okay, last activation is going to be sigmoid. We wanted the output to be between 0 and 1. And the architecture, most likely a shallow network. We don't need too much capacity unless the task is highly complex. And a convolution should do the work really well. You don't know what a convolution is yet. You're going to know in a few weeks. But those are known to be good for sequences and for images. And finally, the loss function. What loss function would you use? Which one?","zh":"好的，最后一个激活函数将是Sigmoid。我们希望输出值在0到1之间。网络架构，很可能是一个浅层网络。除非任务非常复杂，否则我们不需要太多容量。卷积应该能很好地完成这项工作。你还不知道什么是卷积。几周后你就会知道了。但这些已经被证明在处理序列和图像时表现良好。最后，损失函数。你会使用哪种损失函数？哪一个？","start":1872.64,"end":1901.8},{"id":84,"text":"sigmoid no sigmoid is the activation what's the loss function","zh":"Sigmoid不用Sigmoid，激活函数是什么，损失函数是什么？","start":1904.45,"end":1907.93},{"id":85,"text":"logistic loss yeah logistic loss also called binary cross entropy loss","zh":"逻辑损失，是的，逻辑损失也称为二元交叉熵损失。","start":1911.89,"end":1915.89},{"id":86,"text":"which is the one you've seen in the videos this week yeah yeah when you're like selecting your","zh":"这就是你在本周视频中见过的那种，当你在选择你的","start":1916.61,"end":1923.01},{"id":87,"text":"images and your resolution how much is like designing that around the hardware like if","zh":"图像和分辨率时，如何围绕硬件进行设计，比如","start":1923.01,"end":1929.55},{"id":88,"text":"So repeating the question, ho
