ivation what's the loss function"},{"start":1911.89,"text":"logistic loss yeah logistic loss also called binary cross entropy loss"},{"start":1916.61,"text":"which is the one you've seen in the videos this week yeah yeah when you're like selecting your"},{"start":1923.01,"text":"images and your resolution how much is like designing that around the hardware like if"},{"start":1937.27,"text":"So repeating the question, how much the amount of hardware and the quality of the hardware"},{"start":1942.95,"text":"you have at your disposal influences those decisions, the answer is a lot."},{"start":1948.85,"text":"But, you know, in fact, I'm assuming you're training it on your laptop right now, which"},{"start":1954.43,"text":"will work, but you need to make those trade-offs."},{"start":1956.93,"text":"And I think that's why those skills matter."},{"start":1958.43,"text":"Now, if the task is more complicated, you look at the hardware you have available,"},{"start":1963.61,"text":"you'll make a quick back-of-the-envelope calculation. The calculation is really"},{"start":1967.81,"text":"about how fast our iteration cycles can be. It's not about necessarily the"},{"start":1972.03,"text":"performance of the model in the end. You want to be able to iterate super quickly"},{"start":1975.83,"text":"and if your model takes one year to train, you're not going to be able to"},{"start":1979.43,"text":"iterate. You know, you need to reduce it."},{"start":1990.56,"text":"Yeah, yeah, for sure. Yeah. What do you mean? So the 64 by 64 by three is like literally you look at a picture and you look at one pixel."}],"speech_gaps":[],"frame":"../frames/v063/012.webp","frame_time":1846.94},{"title":"监督、自监督与弱监督学习概述","segments":[{"id":100,"text":"These have three values that describe the color, right? And then you just flatten it, and then those numbers are given to the input layer of your neural network. Yeah. Okay.","start":2015.15,"end":2026.9},{"id":101,"text":"Let's move on just for the sake of time. This was just the easy warmup. The two things I just want you to remember from that project is we're going to build a lot of proxy projects and it's important to remember them for your own project. So you remember, oh, I remember this experiment we did on humans. Oh, I remember how many images we needed for that project. And then that can help you make decisions faster. And then the other thing that is worth highlighting is the human experiments. We're going to do a lot of human experiments starting with the next example. And those are usually,","start":2028.07,"end":2057.27},{"id":102,"text":"Let's say Siri and things like that that you might have in your kitchen listening to you. Everybody knows. So the way these networks typically work, these models, is it's not a single model. It's a cascade of models for energy and efficiency purposes.","start":2057.55,"end":2073.73},{"id":103,"text":"Let's say Siri and things like that that you might have in your kitchen listening to you. Everybody knows. So the way these networks typically work, these models, is it's not a single model. It's a cascade of models for energy and efficiency purposes. So, for example, if you have virtual assistants in your kitchen, the first model is activity detection. It just detects if there is any volume, you know.","start":2074.35,"end":2101.21},{"id":104,"text":"Because you don't want to listen with the heavy model at all time. It just uses a lot of energy, right? You want a very lightweight model that understands when volume is playing. And so let's say this network detects volume. It calls another network that is focused on the activation word, the trigger word. Alexa, hey Siri, okay Google. That's usually the second layer. And that one is only listening for a specific keyword. If the keyword comes in, it would typically call,","start":2101.83,"end":2130.57},{"id":105,"text":"Better model that's slightly slower, that might be heavier and more energy consumption, and that might understand what you're trying to do. And then I'm not going to go into the details, but you have architectures that get very complicated. Back in the day, some of these companies were doing one model to set up a timer, one model to...","start":2131.63,"end":2153.87}],"notes":["本段主要讲解了监督学习、自监督学习和弱监督学习的基本概念，以及它们在实际应用中的区别。监督学习需要明确的标签数据，而自监督学习则通过数据本身的结构来生成标签。弱监督学习则使用不完全或不准确的标签数据进行训练。","讲者提到，监督学习在实际应用中需要大量的标注数据，这可能带来成本和效率的问题。因此，自监督学习和弱监督学习成为研究的热点，以减少对人工标注数据的依赖。","在实际应用中，如语音助手（如Siri、Alexa等），通常采用多层模型架构，以提高效率和性能。第一层模型用于检测是否有声音，第二层模型用于检测触发词，第三层模型则用于更复杂的任务。","讲者强调，多层模型架构的设计需要考虑能耗和性能之间的平衡。第一层模型通常较为轻量，而后续模型则可能更复杂，但需要在特定条件下激活。","在实际应用中，模型的复杂度和能耗是需要权衡的因素。例如，某些公司过去使用单一模型来完成多个任务，但随着技术的发展，多层模型架构成为更常见的选择。","讲者还提到，弱监督学习在实际应用中可能使用不完全或不准确的标签数据，这需要在模型设计和训练过程中进行调整，以提高模型的鲁棒性和准确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2015.15,"end":2153.87,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2015.15,"text":"These have three values that describe the color, right? And then you just flatten it, and then those numbers are given to the input layer of your neural network. Yeah. Okay."},{"start":2028.07,"text":"Let's move on just for the sake of time. This was just the easy warmup. The two things I just want you to remember from that project is we're going to build a lot of proxy projects and it's important to remember them for your own project. So you remember, oh, I remember this experiment we did on humans. Oh, I remember how many images we needed for that project. And then that can help you make decisions faster. And then the other thing that is worth highlighting is the human experiments. We're going to do a lot of human experiments starting with the next example. And those are usually,"},{"start":2057.55,"text":"helpful to make quick decisions in your project when you're in the industry so second project trigger word detection let me give some context on this the general problem um okay you're familiar with like alexa and all these"} speech_gaps":[],"frame":"../frames/v063/014.webp","frame_time":2166.38},{"title":"数据分布与语音识别挑战","segments":[{"id":111,"text":"And Alexa is not ideal either. It's not bad, but it's not ideal either. Okay, so let me just narrow down the problem. Let's say we've gone around campus and we've collected a bunch of 10-second audio clips. Okay? Do we need to think about the distribution of the data? Like, why does it matter? Like, why campus only might be limited, let's say? Yeah. Okay, accents. Turns out the first version of this model,","start":2307.15,"end":2339.26},{"id":112,"text":"that I built with Andrew, my German friends could not make it work. None of my German friends would make it work. And we had to collect more data from, and I had two German roommates at the time. So we had to collect more data from them because there's just a certain way that people would say words.","start":2340.55,"end":2362.67},{"id":113,"text":"Good point. Average age on campus is probably younger than if you actually cross campus and go to Palo Alto. And in fact, the frequencies are going to be different that younger people use. That's correct. Yeah. How fast some people speak fast, some people, and it has to do with the language of origin. Some people just speak faster. Correct. And look at this.","start":2365.49,"end":2392.51},{"id":114,"text":"When you hear someone who speaks fast versus someone who speaks slow, it doesn't make a big difference to you as a human. But if you actually just had access to the numbers and the frequencies, it would look completely different. So the model actually struggles a lot with that problem. Yeah, for sure. Ratio of male to female, anything that would modify your frequencies. And on average, yes, there are different frequencies or distribution male to female.","start":2393.39,"end":2423.38},{"id":115,"text":"Background noise, very important. Turns out on Stanford campus, you don't hear the metro. So it's very likely that your algorithm will not work for people in New York that are taking the subway all the time because of the background noise behind it. Okay, I think we get a sense of, again, the complexity of the task ahead of us. Let's say the input is a 10-second audio clip I'm going to call X. And this audio clip has a few things that are special to it.","start":2426.35,"end":2455.71},{"id":116,"text":"So one of the things is negative words, which are in purple, positive words, which are in green, and then the background is in orange. Okay, so this is, for example, someone saying, hi, activate yourself, whatever. You see what I mean? Activate is the positive word. What's the resolution we'd want?","start":2456.86,"end":2477.7}],"notes":["本段讨论了语音识别任务中数据分布的重要性，特别是不同人群（如德国人）的发音差异对模型性能的影响。讲者提到，由于发音习惯不同，模型需要更多数据来适应这些差异。","讲者进一步指出，校园内的平均年龄可能比实际的帕洛阿尔托地区更年轻，这会影响语音频率的分布。年轻人的语音频率与年长者不同，这可能影响模型的识别效果。","讲者提到，说话速度与语言起源有关，某些人说话更快。虽然人类在听觉上对此不敏感，但模型在处理语音频率数据时会受到显著影响。","背景噪声是语音识别中的重要挑战。斯坦福校园没有地铁声，而纽约的地铁声可能显著影响模型的性能，因为背景噪声会干扰语音信号。","讲者以10秒的音频片段X为例，说明语音识别任务中需要处理的元素，包括负面词汇、正面词汇和背景噪声。不同词汇被赋予不同的颜色标记，以帮助理解语音内容。","最后，讲者询问了对分辨率的需求，暗示了语音识别任务中对音频质量的考虑。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2307.15,"end":2477.7,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2307.15,"text":"And Alexa is not ideal either. It's not bad, but it's not ideal either. Okay, so let me just narrow down the problem. Let's say we've gone around campus and we've collected a bunch of 10-second audio clips. Okay? Do we need to think about the distribution of the data? Like, why does it matter? Like, why campus only might be limited, let's say? Yeah. Okay, accents. Turns out the first version of this model,"},{"start":2340.55,"text":"that I built with Andrew, my German friends could not make it work. None of my German friends would make it work. And we had to collect more data from, and I had two German roommates at the time. So we had to collect more data from them because there's just a certain way that people would say words. Okay, good insight. What else other than accents? Yes."},{"start":2365.49,"text":"Good point. Average age on campus is probably younger than if you actually cross campus and go to Palo Alto. And in fact, the frequencies are going to be different that younger people use. That's correct. Yeah. How fast some people speak fast, some people, and it has to do with the language of origin. Some people just speak faster. Correct. And look at this."},{"start":2393.39,"text":"When you hear someone who speaks fast versus someone who speaks slow, it doesn't make a big difference to you as a human. But if you actually just had access to the numbers and the frequencies, it would look completely different. So the model actually struggles a lot with that problem. Yeah, for sure. Ratio of male to female, anything that would modify your frequencies. And on average, yes, there are different frequencies or distribution male to female."},{"start":2426.35,"text":"Background noise, very important. Turns out on Stanford campus, you don't hear the metro. So it's very likely that your algorithm will not work for people in New York that are taking the subway all the time because of the background noise behind it. Okay, I think we get a sense of, again, the complexity of the task ahead of us. Let's say the input is a 10-second audio clip I'm going to call X. And this audio clip has a few things that are special to it."},{"start":2456.86,"text":"So one of the things is negative words, which are in purple, positive words, which are in green, and then the background is in orange. Okay, so this is, for example, someone saying, hi, activate yourself, whatever. You see what I mean? Activate is the positive word. What's the resolution we'd want?"}],"speech_gaps":[],"frame":"../frames/v063/015.webp","frame_time":2319.15},{"title":"监督、自监督与弱监督学习的实验方法","segments":[{"id":117,"text":"Okay, I'm not going to ask you this question because we don't have speech expert. A speech expert would know it. What you can do though, without being a speech expert, is to go on GitHub and find another speech project and you actually search for the hyperparameters they're using. And if you're using human audio, you'll find that the same numbers will work for your project. Okay? So you do that little search and you'll find that there is just a certain sample rate that works well with human voice.","start":2479.06,"end":2507.82},{"id":118,"text":"What's the output? Zero or one. Okay, let's try something. So let's say the output is zero or one. Zero meaning there is no positive word. The word activate is not there. One meaning there is a positive word in that 10-second audio clip. So we're going to do a little human experiment. I've selected three. Let me turn the volume on. I've selected three audio samples of around 10 seconds.","start":2509.91,"end":2540.18},{"id":119,"text":"I'm not going to tell you what the language is, okay? Because the model doesn't know language when we start training it. So you're acting like the model. That's the experiment. I'm just telling you that the first and the third sample have the word that we're looking for. And I'm not telling you what the word is, again, because the model doesn't know what the word is at the beginning of training, okay? So now up to you to guess what the word is. And I hope one of you will save us and find the word. Okay, let's try it.","start":2543.05,"end":2570.52},{"id":120,"text":"Too loud? Second sample. Wait, let me see if I can put the microphone here. Anybody has it or no? Impossible. Third one. Okay, who has the word? Mojo?","start":2575.7,"end":2612.62},{"id":121,"text":"Okay, maybe. That's not it, but maybe. Yeah, in the back. You're Italian? Okay. Yeah, it's funny. Nobody finds it usually in the first try, but you did find it. Yeah, that's great. Okay, let's try again and do it with a different labeling scheme this time. Okay, let's try again. I'm going to play it again, but the labeling scheme has changed. Okay.","start":2613.63,"end":2643.91}],"notes":["本段讲解了监督学习中的一种实验方法，即通过设定二分类输出（0或1）来判断音频片段中是否包含特定的正向词汇。输出为0表示没有正向词汇，输出为1表示存在正向词汇。这种设定类似于监督学习中的标签生成过程，但未明确使用传统监督学习的标签，而是通过实验设计来模拟模型的训练过程。","讲者通过实验设计让听众扮演模型的角色，模拟模型在训练初期对语言和词汇的无知状态。这种实验方法强调了监督学习中标签的重要性，同时也展示了模型如何通过训练逐步学习到语言特征。","在实验中，讲者未明确告知听众所寻找的词汇是什么，这模拟了模型在训练初期对词汇的未知状态。这种设计有助于理解监督学习中标签的必要性，以及模型如何通过训练过程逐步学习到词汇的含义。","讲者提到，如果听众在第一次尝试中未能找到目标词汇，这反映了模型在训练初期的局限性。然而，当有听众成功找到目标词汇时，这表明模型在训练过程中能够逐步学习到词汇的特征。","讲者随后提到将使用不同的标签方案进行实验，这表明监督学习中标签方案的设计对模型训练过程有重要影响。不同的标签方案可能会影响模型的学习效果和训练效率。","整个实验过程强调了监督学习中标签的重要性，以及模型如何通过训练逐步学习到语言特征。这种实验方法有助于理解监督学习的基本原理和实际应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2479.06,"end":2643.91,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2479.06,"text":"Okay, I'm not going to ask you this question because we don't have speech expert. A speech expert would know it. What you can do though, without being a speech expert, is to go on GitHub and find another speech project and you actually search for the hyperparameters they're using. And if you're using human audio, you'll find that the same numbers will work for your project. Okay? So you do that little search and you'll find that there is just a certain sample rate that works well with human voice."},{"start":2509.91,"text":"What's the output? Zero or one. Okay, let's try something. So let's say the output is zero or one. Zero meaning there is no positive word. The word activate is not there. One meaning there is a positive word in that 10-second audio clip. So we're going to do a little human experiment. I've selected three. Let me turn the volume on. I've selected three audio samples of around 10 seconds."},{"start":2543.05,"text":"I'm not going to tell you what the language is, okay? Because the model doesn't know language when we start training it. So you're acting like the model. That's the experiment. I'm just telling you that the first and the third sample have the word that we're looking for. And I'm not telling you what the word is, again, because the model doesn't know what the word is at the beginning of training, okay? So now up to you to guess what the word is. And I hope one of you will save us and find the word. Okay, let's try it."},{"start":2575.7,"text":"Too loud? Second sample. Wait, let me see if I can put the microphone here. Anybody has it or no? Impossible. Third one. Okay, who has the word? Mojo?"},{"start":2613.63,"text":"Okay, maybe. That's not it, but maybe. Yeah, in the back. You're Italian? Okay. Yeah, it's funny. Nobody finds it usually in the first try, but you did find it. Yeah, that's great. Okay, let's try again and do it with a different labeling scheme this time. Okay, let's try again. I'm going to play it again, but the labeling scheme has changed. Okay."}],"speech_gaps":[],"frame":"../frames/v063/016.webp","frame_time":2491.06},{"title":"监督、自监督与弱监督学习的标签方案比较","segments":[{"id":122,"text":"It's the first one. Third one. Okay. What's the word? Someone who's not Italian speaker. I'm not sure people heard, so I want to try someone else. Yeah, you've heard it. Okay, not far. Promodigio. It's pomeriggio, but you're close, you know. Was it easier the second time or the first time?","start":2651.14,"end":2691.17},{"id":123,"text":"Way more, way easier. So if it's easier for you, it's easier for the model, basically. And so what is the question I'm posing here is we could go with the first labeling scheme, which is easier for us to label, frankly, right? You don't need to indicate the location of the word. But how much more data do you think we need in order for the model to figure it out? It's probably a thousand X data.","start":2692.18,"end":2719.37},{"id":124,"text":"And so the question is, is the second labeling scheme a thousand times harder for us to label than the first one? And the answer is no. So the answer is very clear. You would rather have the second labeling scheme and your model is going to learn way faster than the first case. So that's the type of human experiment you can do. Now we're going to use that labeling scheme. Yeah, question. Yeah, we'll talk about it.","start":2720.34,"end":2747.31},{"id":125,"text":"Question, is it manual labeling or not? Yes, right now it's manual, but I'll explain some tricks we can use. Yeah, how do you pick the trade-off between the different labeling strategies and not? In fact, today you could have...","start":2747.83,"end":2771.4},{"id":126,"text":"You could have a pre-training and a post-training that have different labeling schemes. The question is, for pre-training, you want the model to get really good, and you want to avoid a cold start problem. The problem of the cold start is, with the first labeling scheme, maybe even with a thousand data points that you collect and label manually, it's not even going to understand anything.","start":2771.99,"end":2795.67},{"id":127,"text":"The second labeling scheme can be a great way to work around the cold starts. You might need less data, but it will start understanding what you mean. And then the rest of the data might be labeled differently, essentially. OK, let me talk a little bit about the labeling scheme. We're actually going to use a slightly different labeling scheme. And the reason is the first, the one with one one and only zeros.","start":2797.45,"end":2819.35}],"notes":["本段通过一个语言实验说明标签方案对模型学习效率的影响。讲者通过让听众猜测一个意大利语单词，展示了不同标签方案的难易程度。第一种标签方案需要标注单词位置，而第二种方案更简单，但需要更多数据。讲者指出，第二种方案虽然标签更难，但模型学习速度更快。","讲者强调了冷启动问题，即在使用第一种标签方案时，即使有大量手动标注的数据，模型也可能无法理解。第二种标签方案可以缓解这一问题，因为它需要更少的数据，但能帮助模型更快地理解内容。","讲者提到在预训练和后训练阶段可以使用不同的标签方案。预训练阶段需要模型快速学习，因此使用第二种标签方案可以避免冷启动问题，而后续阶段可以使用其他标签策略。","讲者指出，第一种标签方案需要标注单词位置，而第二种方案不需要，但需要更多数据。这说明标签方案的选择会影响模型的学习效率和数据需求。","讲者提到标签方案的差异，例如第一种方案是“one one and only zeros”，这可能是指一种特定的标签格式，但具体细节未明确说明。","讲者通过实验和理论分析，说明了标签方案对模型训练效果的影响，强调了标签方案选择的重要性。"],"formulas":[],"uncertainties":["one one and only zeros"],"diagram":"none","start":2651.14,"end":2819.35,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2651.14,"text":"It's the first one. Third one. Okay. What's the word? Someone who's not Italian speaker. I'm not sure people heard, so I want to try someone else. Yeah, you've heard it. Okay, not far. Promodigio. It's pomeriggio, but you're close, you know. Was it easier the second time or the first time?"},{"start":2692.18,"text":"Way more, way easier. So if it's easier for you, it's easier for the model, basically. And so what is the question I'm posing here is we could go with the first labeling scheme, which is easier for us to label, frankly, right? You don't need to indicate the location of the word. But how much more data do you think we need in order for the model to figure it out? It's probably a thousand X data."},{"start":2720.34,"text":"And so the question is, is the second labeling scheme a thousand times harder for us to label than the first one? And the answer is no. So the answer is very clear. You would rather have the second labeling scheme and your model is going to learn way faster than the first case. So that's the type of human experiment you can do. Now we're going to use that labeling scheme. Yeah, question. Yeah, we'll talk about it."},{"start":2747.83,"text":"Question, is it manual labeling or not? Yes, right now it's manual, but I'll explain some tricks we can use. Yeah, how do you pick the trade-off between the different labeling strategies and not? In fact, today you could have..."},{"start":2771.99,"text":"You could have a pre-training and a post-training that have different labeling schemes. The question is, for pre-training, you want the model to get really good, and you want to avoid a cold start problem. The problem of the cold start is, with the first labeling scheme, maybe even with a thousand data points that you collect and label manually, it's not even going to understand anything."},{"start":2797.45,"text":"The second labeling scheme can be a great way to work around the cold starts. You might need less data, but it will start understanding what you mean. And then the rest of the data might be labeled differently, essentially. OK, let me talk a little bit about the labeling scheme. We're actually going to use a slightly different labeling scheme. And the reason is the first, the one with one one and only zeros."}],"speech_gaps":[],"frame":"../frames/v063/017.webp","frame_time":2663.14},{"title":"监督、自监督与弱监督学习中的挑战与策略","segments":[{"id":128,"text":"The risk is you can actually have a model that performs 99.9% accurate. That is all zeros, just predict zero all the time. It's very accurate. But the thing is, there's just one one to find and it's very hard to find it. And so the network is going to lean toward zeros.","start":2820.97,"end":2838.81},{"id":129,"text":"Meaning the labels are so skewed towards zero that it's going to be hard to find any signal in it. And so the trick that deep learning researchers use generally is can we actually do a little more balanced between the positive and the negative labels? Just a pure engineering hack, not much science behind it.","start":2839.67,"end":2858.67},{"id":130,"text":"The last activation, we're going to use a sigmoid, but because it's a sequential problem, we're going to use sigmoid in sequence. At every time step, there's going to be a sigmoid activation. And then the architecture, we're going to learn it later in the class. You don't need to worry. This would be likely an RNN. You'll learn later in the class what that means. And then the loss function, can someone guess what loss function we would be using? Yes. Yeah. Binary cross entropy, but we're going to use it sequentially.","start":2859.49,"end":2888.13},{"id":131,"text":"Meaning at every step, we're going to compute that with the sigmoid output. Correct. You take your input, 10-second input, you look at where the positive word activate is, and you put ones in there when it plays.","start":2888.7,"end":2909.48},{"id":132,"text":"And you force the model to predict, hey, activate has been played. There's a lot of nuances you see because you actually are going to build this project with like, do we want the ones to start exactly when the words start? Do we want to have a delay? There's a lot of technical questions around that. Yeah. You had a question?","start":2910.91,"end":2926.33},{"id":133,"text":"What I mean by steps is audio is a sequence data. And so it's time step by time step. And so what I mean is that at every time step, whatever your sample rate is, you're going to have a prediction at every step. Okay. So what is critical to the success of this project is really the labeling strategy. Here is how we did it.","start":2930.85,"end":2955.87},{"id":134,"text":"You know, you just have to know it or not know it. It actually takes a long time to figure something like that out. And so thankfully, when I was a grad student, one of my senior PhDs helped me with these methods and he was able to guide me and save me probably a month because I would not have figured out myself this probably. So here's what we did. We took three databases. We created three databases. One that's...","start":2958.86,"end":2983.64}],"notes":["本段讨论了监督学习中模型可能陷入过拟合的问题，即模型可能总是预测零值，从而在表面上达到高准确率，但实际上无法真正捕捉到数据中的信号。这说明了在监督学习中，标签的分布对模型性能有重要影响。","讲者提到，为了克服标签分布不均衡的问题，研究人员通常采用一种工程上的技巧，即在正负标签之间实现更平衡的分布。这种做法虽然缺乏理论支持，但能有效提升模型性能。","在处理序列数据时，讲者提到使用sigmoid激活函数，并在每个时间步进行预测。这表明模型的结构可能基于RNN，而具体的架构将在后续课程中学习。","损失函数方面，讲者指出使用的是二元交叉熵，但需要在序列上进行计算。这说明模型在每个时间步都会基于sigmoid输出进行损失计算。","讲者进一步解释了如何在音频数据中进行标签分配，即在每个时间步进行预测，并讨论了标签起始时间与实际语音起始时间之间的延迟问题。这表明在实际项目中需要考虑许多技术细节。","最后，讲者提到标签策略对项目成功至关重要，并提到在实际项目中需要构建多个数据库来实现这一目标。这说明了在实际应用中，标签的生成和管理是一个复杂且关键的步骤。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2820.97,"end":2983.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2820.97,"text":"The risk is you can actually have a model that performs 99.9% accurate. That is all zeros, ju e did it."},{"start":2958.86,"text":"You know, you just have to know it or not know it. It actually takes a long time to figure something like that out. And so thankfully, when I was a grad student, one of my senior PhDs helped me with these methods and he was able to guide me and save me probably a month because I would not have figured out myself this probably. So here's what we did. We took three databases. We created three databases. One that's..."}],"speech_gaps":[],"frame":"../frames/v063/018.webp","frame_time":2832.97},{"title":"数据收集与合成方法","segments":[{"id":135,"text":"would have positive words. So as you were saying earlier, we record people for the word activate. One that would have negative words, other words, including deactivate, but also kitchen and lion and dog and whatever. And then we have background noise. Turns out background noise in audio data is almost free. There's just a ton of background noise online. You can go on many platforms online, video platforms. You can just take the audio. It will be background noise.","start":2983.87,"end":3012.95},{"id":136,"text":"So background noise is free. You don't need to go and collect it, most likely. The other two are harder. Yeah, question. Yeah. So I'll tell you how we do it in a second. But yes, we recorded everything manually.","start":3013.55,"end":3029.38},{"id":137,"text":"What we did is we went online, we scraped free license data. Actually, it's a skill to know the licensing models. You're going to learn that in the project mentorship with the TAs. What licensing allows you to do what with data? It's good to know forever. You learn it once and then you know. What is CC by? What is CC by NA? What is the MIT license? What is the Apache license, et cetera? And so we take 10-second audio clips. We clip the background noise.","start":3030.42,"end":3058.14},{"id":138,"text":"And we went around campus and we literally recorded people saying activate and other words. And we cut it when they said it. So the word was contained exactly to the amount that was needed. Then we created a Python script that randomly inserts words. Randomly, non-overlapping words. So for example, this would be created synthetically. I would have 10 seconds of background noise. I would insert two negative words and I would insert one positive word. Okay.","start":3058.78,"end":3086.54},{"id":139,"text":"The trick is that because the Python script did that, the Python script knows where activate was put. So it can label automatically.","start":3087.28,"end":3095.84},{"id":140,"text":"And so it turns out that we went around campus, we used an app even to get help. So we hired a couple of people to come with us. Each brought their phone and we went all around campus recording people to say activate in other words. And we created those data sets. Within three hours, we had millions of data points. Because think about it. Let's say you have a thousand activates across campus.","start":3097.23,"end":3121.47},{"id":141,"text":"10,000 other words, infinite background noise. Imagine how much data you can create with that. When you actually write the Python script, you can also add some data augmentation. You can reduce some frequencies. You can augment some frequencies. You can accelerate it. You can decelerate it. So you can actually create a pretty meaningful data set for this problem in three hours. Now I'm talking about training sets.","start":3122.83,"end":3147.42},{"id":142,"text":"Because you don't want to use that data for test sets. For test sets, you want data to be as real as possible. You're familiar with the concept of training test set, right, Eva? So for the test set, we had to manually label data, but it was a much smaller set than the training set.","start":3148.16,"end":3161.0}],"notes":["本段讲解了如何通过合成数据来构建训练集。首先，背景噪声是免费的，可以从在线平台获取，无需额外收集。接着，通过人工录制人们说出特定词汇（如activate）以及其它词汇（如deactivate、kitchen、lion、dog等），并剪辑出精确的语音片段。然后，使用Python脚本将这些语音片段随机插入到背景噪声中，生成合成数据。","Python脚本能够记录插入的位置，从而实现自动标注。这种方法可以高效地生成大量数据，例如在校园内录制数千次activate，并结合其他词汇和背景噪声，生成数百万个数据点。","在构建训练集时，可以使用数据增强技术，如调整频率、加速或减速语音，以进一步丰富数据集。而测试集则需要更真实的语音数据，因此需要手动标注，但数据量远小于训练集。","整个过程强调了合成数据在深度学习中的重要性，尤其是在数据获取成本较高的情况下，合成数据可以显著提高训练效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2983.87,"end":3161.0,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2983.87,"text":"would have positive words. So as you were saying earlier, we record people for the word activate. One that would have negative words, other words, including deactivate, but also kitchen and lion and dog and whatever. And then we have background noise. Turns out background noise in audio data is almost free. There's just a ton of background noise online. You can go on many platforms online, video platforms. You can just take the audio. It will be background noise."},{"start":3013.55,"text":"So background noise is free. You don't need to go and collect it, most likely. The other two are harder. Yeah, question. Yeah. So I'll tell you how we do it in a second. But yes, we recorded everything manually."},{"start":3030.42,"text":"What we did is we went online, we scraped free license data. Actually, it's a skill to know the licensing models. You're going to learn that in the project mentorship with the TAs. What licensing allows you to do what with data? It's good to know forever. You learn it once and then you know. What is CC by? What is CC by NA? What is the MIT license? What is the Apache license, et cetera? And so we take 10-second audio clips. We clip the background noise."},{"start":3058.78,"text":"And we went around campus and we literally recorded people saying activate and other words. And we cut it when they said it. So the word was contained exactly to the amount that was needed. Then we created a Python script that randomly inserts words. Randomly, non-overlapping words. So for example, this would be created synthetically. I would have 10 seconds of background noise. I would insert two negative words and I would insert one positive word. Okay."},{"start":3087.28,"text":"The trick is that because the Python script did that, the Python script knows where activate was put. So it can label automatically."},{"start":3097.23,"text":"And so it turns out that we went around campus, we used an app even to get help. So we hired a couple of people to come with us. Each brought their phone and we went all around campus recording people to say activate in other words. And we created those data sets. Within three hours, we had millions of data points. Because think about it. Let's say you have a thousand activates across campus."},{"start":3122.83,"text":"10,000 other words, infinite background noise. Imagine how much data you can create with that. When you actually write the Python script, you can also add some data augmentation. You can reduce some frequencies. You can augment some frequencies. You can accelerate it. You can decelerate it. So you can actually create a pretty meaningful data set for this problem in three hours. Now I'm talking about training sets."},{"start":3148.16,"text":"Because you don't want to use that data for test sets. For test sets, you want data to be as real as possible. You're familiar with the concept of training test set, right, Eva? So for the test set, we had to manually label data, but it was a much smaller set than the training set."}],"speech_gaps":[],"frame":"../frames/v063/019.webp","frame_time":2995.87},{"title":"项目经验与架构搜索","segments":[{"id":143,"text":"Right. So it's much more convenient. OK. The second important part was architecture search. I'm not going to talk about it too much here, but there are architectures that just work better for these types of problems. And this is an example of an architecture on the right that works way better.","start":3162.21,"end":3179.73},{"id":144,"text":"My learning from that project was just go to the expert and ask them what they've tried and try to learn from their mistakes. And in fact, I remember Oni Hanun, which was in the first level at the Gates Computer Science building. And he knew that this architecture was going to fail. And he knew why, because he's done so many speech projects and he just knows what works and what doesn't work. So that's why your TAs are here for, actually, in your project. So you should give them a call and say, hey.","start":3182.03,"end":3210.47},{"id":145,"text":"is what I'm doing good, or give me a pointer for what I might spend my next week doing. Okay, so learnings from this section, this case study. Data collection strategy is extremely important, including the data labeling strategy. Using human experiments matters as well, and then referring to expert advice. That's the type of thing you want to do in a project. Okay? Do you understand conceptually how such project is built now at a high level? Okay, good.","start":3211.17,"end":3241.98},{"id":146,"text":"Yeah, question. So how often do you need to do an architecture search nowadays? Less often than before. But this class is all about understanding what's going on under the hood. So we're going to walk you through that. In practice, it depends on your problem. Like I'll give you in the industry, you might be building a company that requires the model to be running on the browser. And so you have additional constraints that push you to create your own architecture, collect your own data.","start":3242.48,"end":3280.77},{"id":147,"text":"fine-tune the model the way you want. For many startups out there and companies out there, you're going to start from a foundation model. You're going to start from a foundation model and then you might actually quantize it or prune it or modify it to meet your needs in terms of latency, in terms of memory, in terms of hardware capacity. And knowing what's going on like we did is important in those cases.","start":3281.48,"end":3302.68},{"id":148,"text":"OK, super. So we're one hour in. We are about halfway through the class, a little bit ahead. And I have a few more case studies to cover with you. OK, by the end, we'll have a full set of proxy projects to work with. OK, so this one is cool. It's face verification. A school wants to use face verification to validate student IDs in facilities like dining halls, gym and pool.","start":3305.76,"end":3333.3}],"notes":["本段主要讲述在项目中如何通过专家建议来优化模型架构，强调了数据收集策略和专家意见的重要性。讲者提到，通过向专家请教可以避免重复错误，并且在实际项目中，专家的经验对于选择合适的架构至关重要。","讲者提到，项目中的学习经验包括向专家请教、使用人类实验以及参考专家建议。这些方法对于构建一个成功的项目非常关键，尤其是在数据标注和架构选择方面。","在实际应用中，架构搜索的频率可能减少，但理解底层原理仍然是课程的重点。讲者指出，实际项目中需要根据具体问题调整模型，例如在浏览器上运行模型时，需要考虑额外的约束条件。","讲者提到，许多公司会从基础模型出发，然后进行量化、剪枝或修改以满足延迟、内存和硬件容量等需求。这表明在实际应用中，对模型的优化和调整是至关重要的。","讲者还提到，课程中将涵盖多个案例研究，帮助学生理解如何构建和优化项目。这表明课程内容不仅包括理论，还强调实践和应用。","最后，讲者提到一个关于人脸识别的案例，说明项目可以应用于实际场景，如学校使用人脸识别验证学生身份。这表明课程内容与实际应用紧密相关。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3162.21,"end":3333.3,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3162.21,"text":"Right. So it's much more convenient. OK. The second important part was architecture search. I'm not going to talk about it too much here, but there are architectures that just work better for these types of problems. And this is an example of an architecture on the right that works way better."},{"start":3182.03,"text":"My learning from that project was just go to the expert and ask them what they've tried and try to learn from their mistakes. And in fact, I remember Oni Hanun, which was in the first level at the Gates Computer Science building. And he knew that this architecture was going to fail. And he knew why, because he's done so many speech projects and he just knows what works and what doesn't work. So that's why your TAs are here for, actually, in your project. So you should give them a call and say, hey."},{"start":3211.17,"text":"is what I'm doing good, or give me a pointer for what I might spend my next week doing. Okay, so learnings from this section, this case study. Data collection strategy is extremely important, including the data labeling strategy. Using human experiments matters as well, and then referring to expert advice. That's the type of thing you want to do in a project. Okay? Do you understand conceptually how such project is built now at a high level? Okay, good."},{"start":3242.48,"text":"Yeah, question. So how often do you need to do an architecture search nowadays? Less often than before. But this class is all about understanding what's going on under the hood. So we're going to walk you through that. In practice, it depends on your problem. Like I'll give you in the industry, you might be building a company that requires the model to be running on the browser. And so you have additional constraints that push you to create your own architecture, collect your own data."},{"start":3281.48,"text":"fine-tune the model the way you want. For many startups out there and companies out there, you're going to start from a foundation model. You're going to start from a foundation model and then you might actually quantize it or prune it or modify it to meet your needs in terms of latency, in terms of memory, in terms of hardware capacity. And knowing what's going on like we did is important in those cases."},{"start":3305.76,"text":"OK, super. So we're one hour in. We are about halfway through the class, a little bit ahead. And I have a few more case studies to cover with you. OK, by the end, we'll have a full set of proxy projects to work with. OK, so this one is cool. It's face verification. A school wants to use face verification to validate student IDs in facilities like dining halls, gym and pool."}],"speech_gaps":[],"frame":"../frames/v063/020.webp","frame_time":3174.21},{"title":"生物识别与图像验证系统","segments":[{"id":149,"text":"So let me explain what it is. It's like you arrive at the Arriaga gym and instead of just, you know, normally you would swipe your student ID, right? And your picture will show up on the screen and there's someone sitting there. It's going to compare the picture they're seeing on the screen to the picture they're seeing with their eyes. And if it's the same, they're going to say, you can go ahead, right? It's slightly different here.","start":3334.08,"end":3357.96},{"id":150,"text":"you're going to be verified by a camera. So there's actually a camera ahead and you're walking in and you're swiping your card and we're going to compare the picture in the database to the picture that is being taken by the camera to make sure that it's the same person. How do you get started? So everybody who got admitted uploaded pictures, at least one. So we have that already in the database, correct?","start":3359.52,"end":3399.99},{"id":151,"text":"Yeah, what else? You're saying the camera matters? Yeah, for sure. The camera matters. In fact, we talked about resolution. You think the resolution is lower or higher than the day and night project? Probably higher. In fact, it's going to be higher. And again, I would go back to literally doing a human experiment and showing pictures of twins and asking people if they can differentiate the twins. And you'll see that the resolution matters, actually. Okay, yeah. You wanted to add something?","start":3400.72,"end":3434.25},{"id":152,"text":"Okay, also data from outside the university. Which features? Understand the person's human feature, but they're already in the picture, right? So the picture would have the feature, or you would add anything on top of that. So typically, you would not actually want to get the feature level. You would just want to say, we need to make sure it's in the data. If it's in the data, the neural network will learn it.","start":3440.21,"end":3467.67},{"id":153,"text":"Absolutely. Same person multiple times because the angle matters, the time matters, the, you know, et cetera. Yeah. Okay. Same thing. Okay. So you're saying we might do some pre-processing to crop all the images so that it's centered, or at least that the image that we're trained the model with looks like the image that the camera is going to take because the model will run on the camera.","start":3472.42,"end":3496.23}],"notes":["本段讨论了生物识别系统中图像验证的机制，包括摄像头与数据库图像的比对过程。讲者提到，系统会通过摄像头捕捉图像并与数据库中的图像进行比对，以确认是否为同一人。此外，讲者还提到分辨率的重要性，认为摄像头的分辨率通常高于其他项目，如昼夜项目。","讲者进一步讨论了生物识别系统中数据的来源和特征提取问题。他指出，虽然图像中已经包含了人的特征，但通常不需要在特征层面上进行额外处理，而是确保这些特征存在于数据中，这样神经网络就能自动学习这些特征。","讲者强调了图像验证过程中多个因素的重要性，包括角度、时间等。他提到，为了提高验证的准确性，可能会对图像进行预处理，如裁剪，以确保训练模型的图像与摄像头捕捉的图像在视觉上一致，从而提高模型的泛化能力。","讲者通过一个实验性例子来说明分辨率的重要性，即通过展示双胞胎的照片并让人类判断是否能区分他们，来说明分辨率对识别效果的影响。这表明，图像的清晰度是影响生物识别系统性能的关键因素之一。","讲者还提到，生物识别系统需要处理同一人多次出现的情况，因为不同的角度、时间等因素会影响图像的相似度。因此，系统需要具备一定的鲁棒性，以应对这些变化。","最后，讲者指出，为了提高系统的准确性，可能需要对图像进行预处理，如裁剪，以确保训练模型的图像与实际摄像头捕捉的图像在视觉上一致，从而提高模型的泛化能力和识别效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3334.08,"end":3496.23,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3334.08,"text":"So let me explain what it is. It's like you arrive at the Arriaga gym and instead of just, you know, normally you would swipe your student ID, right? And your picture will show up on the screen and there's someone sitting there. It's going to compare the picture they're seeing on the screen to the picture they're seeing with their eyes. And if it's the same, they're going to say, you can go ahead, right? It's slightly different here."},{"start":3359.52,"text":"you're going to be verified by a camera. So there's actually a camera ahead and you're walking in and you're swiping your card and we're going to compare the picture in the database to the picture that is being taken by the camera to make sure that it's the same person. How do you get started? So everybody who got admitted uploaded pictures, at least one. So we have that already in the database, correct?"},{"start":3400.72,"text":"Yeah, what else? You're saying the camera matters? Yeah, for sure. The camera matters. In fact, we talked about resolution. You think the resolution is lower or higher than the day and night project? Probably higher. In fact, it's going to be higher. And again, I would go back to literally doing a human experiment and showing pictures of twins and asking people if they can differentiate the twins. And you'll see that the resolution matters, actually. Okay, yeah. You wanted to add something?"},{"start":3440.21,"text":"Okay, also data from outside the university. Which features? Understand the person's human feature, but they're already in the picture, right? So the picture would have the feature, or you would add anything on top of that. So typically, you would not actually want to get the feature level. You would just want to say, we need to make sure it's in the data. If it's in the data, the neural network will learn it."},{"start":3472.42,"text":"Absolutely. Same person multiple times because the angle matters, the time matters, the, you know, et cetera. Yeah. Okay. Same thing. Okay. Okay. So you're saying we might do some pre-processing to crop all the images so that it's centered, or at least that the image that we're trained the model with looks like the image that the camera is going to take because the model will run on the camera."}],"speech_gaps":[],"frame":"../frames/v063/021.webp","frame_time":3346.08},{"title":"图像识别中的分辨率与特征工程","segments":[{"id":154,"text":"Okay, all these are good. So let's say our data set is a picture of every student labeled with their name. So this is one of my friends, Bertrand, and he has his picture, which is this picture from the student ID. And then the input is, okay, he shows up in front of the building. He's a little bit confused, but he showed up and a picture was taken. The resolution, we talked about it. What we use here is 412, 412 by 3. It's much higher than before.","start":3496.82,"end":3523.58},{"id":155,"text":"OK, as we were expecting, because we need small details, even eye color is identifiable. Right. So these things we cannot find without a higher resolution. In fact, if you actually go to airport security and you use some of these fast tracks which take a picture of you, trust me, the resolution is going to be even higher than that, much higher than that, because they're actually getting into the iris at that level.","start":3524.1,"end":3549.6},{"id":156,"text":"Right? So what's the output? The output is 0 or 1. Yeah, it's Bertrand or it's not Bertrand. Okay? We're, we're good so far. Uh, the architecture, um, let me actually, um, let me actually ask you, uh, how would you, uh, do this comparison without neural networks? Let's say a very basic way. If you had to start with the first method. Yeah.","start":3550.04,"end":3577.28},{"id":157,"text":"So you would feature engineer, you would say like, for example, you would define 10 features that are good for identifying people and you would have a filter for each of them and you would run it on the picture and say, yes, do we have this feature or not? Essentially. Okay. Yeah, it's a good one. Even more basic than that would be a pixel comparison.","start":3584.94,"end":3602.58},{"id":158,"text":"Just compare the two pixels. What's the problem with doing a pixel comparison? So the idea is I take the two pictures, I compare them, and if they're close enough in pixel-wise comparison, then it's the same person. If they're far, it's not the same person. What can go wrong? Difference in what? Lighting, yeah. Actually, what's interesting with the lighting is if you look here, so in this one, you take the top left pixel right here.","start":3603.34,"end":3634.22},{"id":159,"text":"It's bright. You take the top-left pixel on this one, it's dark, or at least dark green. The difference between these two pixels is massive. It's close to 255, yet the pixel doesn't even matter. So why would you use that? It would penalize the comparison without actually mattering at all. So that's a good point, yeah. Yeah, absolutely, background difference.","start":3635.29,"end":3664.29}],"notes":["本段讨论了图像识别中分辨率的重要性，指出高分辨率图像能够捕捉到更细微的特征，如眼睛颜色。课堂中提到机场安检使用的图像分辨率更高，甚至可以识别虹膜，这说明高分辨率对于识别任务至关重要。","课堂中提到，图像识别任务的输出是二分类（0或1），即判断是否为特定人物。这表明任务的目标是进行二元分类，而不是多类别识别。","在没有神经网络的情况下，可以使用特征工程的方法进行图像比较。例如，定义10个特征并使用过滤器来提取这些特征，然后判断是否包含这些特征。这种方法虽然简单，但需要人工设计特征。","课堂中还提到像素级比较的问题，即直接比较两个图像的像素值。这种方法容易受到光照变化的影响，例如同一像素在不同光照条件下可能有显著差异，从而导致误判。","课堂中通过一个具体的例子说明了像素比较的局限性：同一位置的像素在不同光照条件下可能有非常大的差异，但这些差异并不影响最终的识别结果，因此像素比较方法并不可靠。","课堂最后指出，背景差异是像素比较方法的一个主要问题，这说明在实际应用中需要考虑环境因素对图像识别的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3496.82,"end":3664.29,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3496.82,"text":"Okay, all these are good. So let's say our data set is a picture of every student labeled with their name. So this is one of my friends, Bertrand, and he has his picture, which is this picture from the student ID. And then the input is, okay, he shows up in front of the building. He's a little bit confused, but he showed up and a picture was taken. The resolution, we talked about it. What we use here is 412, 412 by 3. It's much higher than before."},{"start":3524.1,"text":"OK, as we were expecting, because we need small details, even eye color is identifiable. Right. So these things we cannot find without a higher resolution. In fact, if you actually go to airport security and you use some of these fast tracks which take a picture of you, trust me, the resolution is going to be even higher than that, much higher than that, because they're actually getting into the iris at that level."},{"start":3550.04,"text":"Right? So what's the output? The output is 0 or 1. Yeah, it's Bertrand or it's not Bertrand. Okay? We're, we're good so far. Uh, the architecture, um, let me actually, um, let me actually ask you, uh, how would you, uh, do this comparison without neural networks? Let's say a very basic way. If you had to start with the first method. Yeah."},{"start":3584.94,"text":"So you would feature engineer, you would say like, for example, you would define 10 features that are good for identifying people and you would have a filter for each of them and you would run it on the picture and say, yes, do we have this feature or not? Essentially. Okay. Yeah, it's a good one. Even more basic than that would be a pixel comparison."},{"start":3603.34,"text":"Just compare the two pixels. What's the problem with doing a pixel comparison? So the idea is I take the two pictures, I compare them, and if they're close enough in pixel-wise comparison, then it's the same person. If they're far, it's not the same person. What can go wrong? Difference in what? Lighting, yeah. Actually, what's interesting with the lighting is if you look here, so in this one, you take the top left pixel right here."},{"start":3635.29,"text":"It's bright. You take the top-left pixel on this one, it's dark, or at least dark green. The difference between these two pixels is massive. It's close to 255, yet the pixel doesn't even matter. So why would you use that? It would penalize the comparison without actually mattering at all. So that's a good point, yeah. Yeah, absolutely, background difference."}],"speech_gaps":[],"frame":"../frames/v063/022.webp","frame_time":3508.82},{"title":"特征编码与相似性比较","segments":[{"id":160,"text":"Translation invariance. Imagine the same picture, but the person is three pixels to the right. The comparison will be completely different because it's a pixel comparison rather than a semantically meaningful comparison. What are other things that can go wrong? Distance from the camera. Again, rotation invariance, translation invariance, scale invariance, all of these matter. What are other things that are not geometric modifications?","start":3665.37,"end":3694.39},{"id":161,"text":"Wearing glasses or hats. What else? Hairstyle, yeah. The beard, you know. And in fact, you look here, he has much more beard than on the picture. And he was much younger, by the way, on the first picture. And oftentimes, we're younger on our student IDs than we actually are in person, and that may make a difference. Okay, so these issues we all talked about, I think people get it.","start":3696.04,"end":3724.78},{"id":162,"text":"Good. So our solution is to use the concept of encoding. You remember what we talked about earlier with the face example? It turns out a network that has been trained to understand faces should have meaningful information in those layers that you can use as comparison, that is more meaningful than a pixel comparison. So this is how it goes. We have Bertrand picture from the student ID. We run it through a deep neural network and we get a vector.","start":3725.98,"end":3752.62},{"id":163,"text":"What is this vector? It's a vector that we grab in the middle of the network somewhere. Remember what I said, if the vector is taken earlier in the network, we're going to get lower level features. If you go deeper, it's going to get more facial features. So you probably go slightly deeper. You go much deeper, actually, for this example. And then same thing, you run the exact same network on the picture from the camera. And normally, if the network was trained well, those two vectors should be close to each other.","start":3754.54,"end":3782.9},{"id":164,"text":"This tends to 0.4. You set the threshold. You might do a little study to see what's the right threshold. And of course, this threshold is going to determine the number of true positives that you're going to get versus false positives versus false negatives. The higher the threshold, the more likely you'll make a mistake, the more relaxed you are. So here, let's say I set a threshold of 0.5. Hey, I'm confident enough that this is Bertrand.","start":3784.64,"end":3809.16},{"id":165,"text":"And again, airport security might have a much higher, lower threshold than the dining hall at Stanford, obviously. Okay, so this is the general idea behind what we want to do, but I still haven't talked to you about how the network is trained. The network right now is not trained. We haven't learned how to train it. Yeah, question.","start":3809.8,"end":3829.02}],"notes":["本段讨论了图像比较中常见的问题，如平移不变性、旋转不变性、缩放不变性等，以及这些不变性对图像识别的影响。讲者指出，像素级别的比较容易受到几何变换的影响，而语义层面的比较则更可靠。","讲者进一步举例说明了其他可能影响图像识别的因素，如佩戴眼镜、帽子、发型、胡须等，以及年龄差异对识别结果的影响。这些因素表明，图像识别需要考虑更多非几何的特征。","讲者介绍了使用编码的概念来解决图像比较问题。通过深度神经网络提取特征向量，可以更有效地进行语义层面的比较，而不是像素级别的比较。","讲者解释了特征向量在不同网络层中的作用。较浅的层提取低级特征，而较深的层提取更高级的特征，如面部特征。因此，选择合适的网络层对于特征提取至关重要。","讲者提到，通过设置阈值可以判断两个图像是否相似。阈值的设置会影响真阳性、假阳性和假阴性的数量，较高的阈值会减少误判，但可能降低识别的灵敏度。","最后，讲者指出，虽然已经介绍了特征编码的基本概念，但尚未讨论如何训练网络。这表明接下来的内容将涉及网络训练的具体方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3665.37,"end":3829.02,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3665.37,"text":"Translation invariance. Imagine the same picture, but the person is three pixels to the right. The comparison will be completely different because it's a pixel comparison rather than a semantically meaningful comparison. What are other things that can go wrong? Distance from the camera. Again, rotation invariance, translation invariance, scale invariance, all of these matter. What are other things that are not geometric modifications?"},{"start":3696.04,"text":"Wearing glasses or hats. What else? Hairstyle, yeah. The beard, you know. And in fact, you look here, he has much more beard than on the picture. And he was much younger, by the way, on the first picture. And oftentimes, we're younger on our student IDs than we actually are in person, and that may make a difference. Okay, so these issues we all talked about, I think people get it."},{"start":3725.98,"text":"Good. So our solution is to use the concept of encoding. You remember what we talked about earlier with the face example? It turns out a network that has been trained to understand faces should have meaningful information in those layers that you can use as comparison, that is more meaningful than a pixel comparison. So this is how it goes. We have Bertrand picture from the student ID. We run it through a deep neural network and we get a vector."},{"start":3754.54,"text":"What is this vector? It's a vector that we grab in the middle of the network somewhere. Remember what I said, if the vector is taken earlier in the network, we're going to get lower level features. If you go deeper, it's going to get more facial features. So you probably go slightly deeper. You go much deeper, actually, for this example. And then same thing, you run the exact same network on the picture from the camera. And normally, if the network was trained well, those two vectors should be close to each other."},{"start":3784.64,"text":"This tends to 0.4. You set the threshold. You might do a little study to see what's the right threshold. And of course, this threshold is going to determine the number of true positives that you're going to get versus false positives versus false negatives. The higher the threshold, the more likely you'll make a mistake, the more relaxed you are. So here, let's say I set a threshold of 0.5. Hey, I'm confident enough that this is Bertrand."},{"start":3809.8,"text":"And again, airport security might have a much higher, lower threshold than the dining hall at Stanford, obviously. Okay, so this is the general idea behind what we want to do, but I still haven't talked to you about how the network is trained. The network right now is not trained. We haven't learned how to train it. Yeah, question."}],"speech_gaps":[],"frame":"../frames/v063/023.webp","frame_time":3677.37},{"title":"构建训练和损失函数","segments":[{"id":166,"text":"What's the network? We learn it, actually. We're going to see it together. Yeah, I'll describe it. But I don't want to get into the architectural nitty-gritty. I want to focus on the general training scheme that we're going to use. And then you're actually going to build that at some point in the quarter. Yeah, other question? Yeah, what are the hidden features in the 128-dimensional vector? We don't know. That's the point of deep learning, is you have to create a loss function.","start":3839.64,"end":3871.66},{"id":167,"text":"that will modify your parameters in a way that forces it to learn features. But I can tell you that dimension number three is for eyes and dimension number six is for ears. I can make a study, we'll study it later this quarter, and tell you that this neuron is actually good at detecting certain types of features. But right now I can't tell you, unless I do that study.","start":3872.64,"end":3896.3},{"id":168,"text":"Okay, so question for you. How would you build a training and a loss function to make that possible, to train that network? You have ideas. It's not an easy question. Try. Where to start? Yes. So mean squared error between what? You're right, actually. Two vectors, mean squared error, because it's a, you know, yeah. So are you saying we would take pairs of pictures?","start":3897.67,"end":3945.57},{"id":169,"text":"We will run it through the network. We will then take the two vectors that we get and apply the loss function, some distance, L1 distance, L2 distance, and then trace it back and say, these were the same people. You should have been closer. That's what you mean? Yeah, that's a good idea. Someone else wanted to say something. Yeah, that's another one, cosine similarity. That could also be our loss function. Okay, like what?","start":3946.56,"end":3977.96},{"id":170,"text":"Great idea. Data augmentation. So you say, I can take the picture of Bertrand and probably mirror it, flip it, rotate it, crop it, and I would use more data that way. Yeah, absolutely. That would help a lot, actually. Okay, so all of these are good ones.","start":3985.6,"end":4002.98}],"notes":["本段主要讨论如何构建训练和损失函数以训练神经网络。讲者指出，网络的结构是通过学习得到的，而不是预先定义的。他强调了损失函数的重要性，因为这是深度学习的核心，通过损失函数可以引导网络学习到有用的特征。","讲者提到，虽然某些维度（如第3维和第6维）可能对应特定的特征（如眼睛和耳朵），但这些信息是通过研究得出的，目前无法直接确定。这说明了深度学习中特征学习的不确定性。","在构建损失函数时，讲者引导学生思考如何设计损失函数，例如使用均方误差（MSE）来比较两个向量。他提到，可以使用L1距离、L2距离或余弦相似度作为损失函数，这些方法都可以用于衡量向量之间的差异。","讲者还提到数据增强（data augmentation）作为提高模型性能的一种方法，例如通过翻转、旋转、裁剪等方式生成更多的训练数据。这有助于模型更好地泛化。","整个讨论强调了损失函数在训练过程中的关键作用，以及如何通过不同的方法（如距离度量和数据增强）来优化模型的训练效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3839.64,"end":4002.98,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3839.64,"text":"What's the network? We learn it, actually. We're going to see it together. Yeah, I'll describe it. But I don't want to get into the architectural nitty-gritty. I want to focus on the general training scheme that we're going to use. And then you're actually going to build that at some point in the quarter. Yeah, other question? Yeah, what are the hidden features in the 128-dimensional vector? We don't know. That's the point of deep learning, is you have to create a loss function."},{"start":3872.64,"text":"that will modify your parameters in a way that forces it to learn features. But I can tell you that dimension number three is for eyes and dimension number six is for ears. I can make a study, we'll study it later this quarter, and tell you that this neuron is actually good at detecting certain types of features. But right now I can't tell you, unless I do that study."},{"start":3897.67,"text":"Okay, so question for you. How would you build a training and a loss function to make that possible, to train that network? You have ideas. It's not an easy question. Try. Where to start? Yes. So mean squared error between what? You're right, actually. Two vectors, mean squared error, because it's a, you know, yeah. So are you saying we would take pairs of pictures?"},{"start":3946.56,"text":"We will run it through the network. We will then take the two vectors that we get and apply the loss function, some distance, L1 distance, L2 distance, and then trace it back and say, these were the same people. You should have been closer. That's what you mean? Yeah, that's a good idea. Someone else wanted to say something. Yeah, that's another one, cosine similarity. That could also be our loss function. Okay, like what?"},{"start":3985.6,"text":"Great idea. Data augmentation. So you say, I can take the picture of Bertrand and probably mirror it, flip it, rotate it, crop it, and I would use more data that way. Yeah, absolutely. That would help a lot, actually. Okay, so all of these are good ones."}],"speech_gaps":[],"frame":"../frames/v063/024.webp","frame_time":3851.64},{"title":"三元组损失函数与编码距离优化","segments":[{"id":171,"text":"If I summarize your point, though, because that's really the key to designing a good loss function, what we really want is that similar picture of the same person end up with similar vectors. And picture of different people end up with different vectors, if we rephrase it in plain English. So what we'll do is that we'll build a data set of triplets. The triplets includes a picture that is the anchor.","start":4004.19,"end":4031.99},{"id":172,"text":"a picture that is the positive the reason it's called positive is because it's the same person","start":4032.61,"end":4037.19},{"id":173,"text":"as the anchor and a picture that is called the negative because it's a different person","start":4037.19,"end":4041.73},{"id":174,"text":"than the anchor and by definition also a different person than the positive","start":4041.73,"end":4045.05},{"id":175,"text":"one picture of a person great question if you have one picture of a person then you can't do that","start":4048.65,"end":4054.59},{"id":176,"text":"we'll actually see another method that would allow us to do it even with one","start":4055.75,"end":4059.59},{"id":177,"text":"picture of a person. You can rotate it, that's true. You could actually do some","start":4059.59,"end":4065.89},{"id":178,"text":"data augmentation, as he was mentioning, and build a data set starting with one","start":4065.89,"end":4070.37},{"id":179,"text":"picture, but this approach will not be the best one. We'll see another approach","start":4070.37,"end":4074.01},{"id":180,"text":"right after that would work better.","start":4074.01,"end":4075.61},{"id":181,"text":"Why are we comparing a vector from the model with a vector from the model instead of just comparing the output?","start":4075.61,"end":4084.97},{"id":182,"text":"so you probably want to have a vector that is big enough where you believe it has enough","start":4105.99,"end":4111.83},{"id":183,"text":"flexibility to hold information that can allow to us to verify if the same person is on the picture","start":4111.83,"end":4118.01},{"id":184,"text":"yeah essentially okay i'm going to move on and if there's so what we want is to minimize the","start":4118.65,"end":4123.17},{"id":185,"text":"encoding distance between the anchor and the positive and we want to maximize the encoding","start":4123.17,"end":4127.85},{"id":186,"text":"distance between the anchor and the negative so question for you what i'm going to ask you","start":4127.85,"end":4133.71},{"id":187,"text":"is to take 10-15 seconds","start":4133.71,"end":4135.83},{"id":188,"text":"look at the slide","start":4135.83,"end":4136.91},{"id":189,"text":"and you're going to start voting","start":4136.91,"end":4139.75},{"id":190,"text":"for A, B or C","start":4140.73,"end":4142.21},{"id":191,"text":"by the way","start":4144.31,"end":4145.23},{"id":192,"text":"ANC is encoding","start":4145.23,"end":4147.55},{"id":193,"text":"it's just","start":4147.55,"end":4148.35}],"notes":["本段讲解了三元组损失函数的设计原理，即通过构建包含锚点、正样本和负样本的三元组数据集，使模型学习到能够区分不同个体的特征向量。锚点是输入图像，正样本是与锚点同一个人的图像，负样本是与锚点不同人的图像。通过最小化锚点与正样本之间的编码距离，最大化锚点与负样本之间的编码距离，可以优化模型的表示能力。","讲者提到，虽然使用单张图像进行训练存在局限性，但可以通过数据增强（如旋转）来生成更多的训练样本。然而，这种方法并不是最优的，后续会介绍更有效的策略。","讲者进一步解释了为何要比较模型输出的向量而不是直接比较输出本身。这是因为向量需要足够大且具有足够的灵活性，以承载足够的信息来判断图像中是否包含同一个人。","讲者提出一个具体的问题，要求学生在10-15秒内观察幻灯片并投票选择A、B或C选项，这可能是在测试学生对当前讲解内容的理解。","讲者提到“ANC is encoding”，但未完整表达，可能是“ANC”代表“Anchor encoding”的缩写，但未明确说明。这可能是一个术语或缩写的误识别。","讲者最后提到“it's just”，但未完成句子，可能是对某个概念的简略说明，但未明确表达。"],"formulas":[],"uncertainties":["ANC is encoding","it's just"],"diagram":"none","start":4004.19,"end":4148.35,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4004.19,"text":"If I summarize your point, though, because that's really the key to designing a good loss function, what we really want is that similar picture of the same person end up with similar vectors. And picture of different people end up with different vectors, if we rephrase it in plain English. So what we'll do is that we'll build a data set of triplets. The triplets includes a picture that is the anchor."},{"start":4032.61,"text":"a picture that is the positive the reason it's called positive is because it's the same person"},{"start":4037.19,"text":"as the anchor and a picture that is called the negative because it's a different person"},{"start":4041.73,"text":"than the anchor and by definition also a different person than the positive"},{"start":4048.65,"text":"one picture of a person great question if you have one picture of a person then you can't do that"},{"start":4055.75,"text":"we'll actually see another method that would allow us to do it even with one"},{"start":4059.59,"text":"picture of a person. You can rotate it, that's true. You could actually do some"},{"start":4065.89,"text":"data augmentation, as he was mentioning, and build a data set starting with one"},{"start":4070.37,"text":"picture, but this approach will not be the best one. We'll see another approach"},{"start":4074.01,"text":"right after that would work better."},{"start":4075.61,"text":"Why are we comparing a vector from the model with a vector from the model instead of just comparing the output?"},{"start":4105.99,"text":"so you probably want to have a vector that is big enough where you believe it has enough"},{"start":4111.83,"text":"flexibility to hold information that can allow to us to verify if the same person is on the picture"},{"start":4118.65,"text":"yeah essentially okay i'm going to move on and if there's so what we want is to minimize the"},{"start":4123.17,"text":"encoding distance between the anchor and the positive and we want to maximize the encoding"},{"start":4127.85,"text":"distance between the anchor and the negative so question for you what i'm going to ask you"},{"start":4133.71,"text":"is to take 10-15 seconds"},{"start":4135.83,"text":"look at the slide"},{"start":4136.91,"text":"and you're going to start voting"},{"start":4140.73,"text":"for A, B or C"},{"start":4144.31,"text":"by the way"},{"start":4145.23,"text":"ANC is encoding"},{"start":4147.55,"text":"it's just"}],"speech_gaps":[{"start":4087.632,"end":4093.712},{"start":4093.744,"end":4104.16}],"frame":"../frames/v063/025.webp","frame_time":4016.19},{"title":"三元组损失函数与对比学习","segments":[{"id":194,"text":"how I call the vector that we get out of the network. A is the anchor, N is the negative, and P is the positive. So A is the anchor picture, N is the negative picture, which is different from the anchor, the different person, and P is the positive picture, which is the same as the anchor. And Anc of A is when you run A through the network, you get the vector Anc of A.","start":4148.91,"end":4199.31},{"id":195,"text":"Okay, let's look at the results. A, 47 for A, 23 for B, 3 for C. So someone who said good job first, that is correct. Someone who selected A wants to tell us why.","start":4203.44,"end":4226.66},{"id":196,"text":"Correct, correct. Great. So actually the key word here is minimize. If I had said maximize, the answer indeed, as you say, would have been different because here we're looking at minimizing the distance between the anchor and the positive and in fact minimizing this or maximizing the opposite of it. That's why the answer is A. Okay, good stuff. Let's keep going. So going back to the initial setup, we had a cat.","start":4240.81,"end":4271.22},{"id":197,"text":"And we were predicting a binary number. Here instead, we have three pictures going through the network in parallel. So you can imagine it's batch processing. It's like the three are going in the same network at the same time. And then you're getting three vectors. You're computing the loss function. You're doing this loss function we talked about. I'm not going to talk here about the alpha number, but you're going to learn when you build it why the alpha number matters.","start":4271.8,"end":4296.39},{"id":198,"text":"Hint is maybe zero would have been a correct answer if you didn't have the alpha number. So it would have...","start":4298.23,"end":4303.49}],"notes":["本段讲解了三元组损失函数的基本概念，其中A代表锚点样本，N代表负样本，P代表正样本。锚点样本与正样本应具有相似性，而锚点样本与负样本应具有差异性。通过网络处理后，锚点样本会得到一个向量表示，用于计算损失函数。","在讲解过程中，教师通过一个投票结果的例子（A得47票，B得23票，C得3票）说明了为什么选择A作为正确答案。这与损失函数中最小化锚点与正样本距离的目标一致。","教师强调了损失函数中“最小化”这一关键词的重要性，并指出如果目标是“最大化”，则答案会不同。这说明了损失函数的设计对模型训练结果有直接影响。","教师提到在三元组损失函数中，通常会引入一个超参数α（alpha），用于调整损失函数的权重。虽然本段未详细讨论α的作用，但指出在构建模型时会学习到α的重要性。","教师提到如果不存在α参数，零可能是一个正确的答案。这说明了α参数在调整损失函数行为中的关键作用，可能用于控制正样本与锚点样本之间的距离。","最后，教师提到一个提示，暗示在没有α参数的情况下，零可能是一个正确的答案。这表明α参数在调整损失函数行为中的关键作用，可能用于控制正样本与锚点样本之间的距离。"],"formulas":[],"uncertainties":["alpha number"],"diagram":"none","start":4148.91,"end":4303.49,"asr_flags":[],"math_clarifications":["原公式中的损失函数形式存在错误，α被错误地加在了max函数的外部，且重复了α的使用。正确的对比损失函数应为 L = \\max(0, d(A, P) - d(A, N) + \\alpha)，其中α是超参数，用于控制正样本和负样本之间的距离差的阈值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4148.91,"text":"how I call the vector that we get out of the network. A is the anchor, N is the negative, and P is the positive. So A is the anchor picture, N is the negative picture, which is different from the anchor, the different person, and P is the positive picture, which is the same as the anchor. And Anc of A is when you run A through the network, you get the vector Anc of A."},{"start":4203.44,"text":"Okay, let's look at the results. A, 47 for A, 23 for B, 3 for C. So someone who said good job first, that is correct. Someone who selected A wants to tell us why."},{"start":4240.81,"text":"Correct, correct. Great. So actually the key word here is minimize. If I had said maximize, the answer indeed, as you say, would have been different because here we're looking at minimizing the distance between the anchor and the positive and in fact minimizing this or maximizing the opposite of it. That's why the answer is A. Okay, good stuff. Let's keep going. So going back to the initial setup, we had a cat."},{"start":4271.8,"text":"And we were predicting a binary number. Here instead, we have three pictures going through the network in parallel. So you can imagine it's batch processing. It's like the three are going in the same network at the same time. And then you're getting three vectors. You're computing the loss function. You're doing this loss function we talked about. I'm not going to talk here about the alpha number, but you're going to learn when you build it why the alpha number matters."},{"start":4298.23,"text":"Hint is maybe zero would have been a correct answer if you didn't have the alpha number. So it would have..."}],"speech_gaps":[],"frame":"../frames/v063/026.webp","frame_time":4160.91},{"title":"监督、自监督与弱监督学习中的损失函数设计","segments":[{"id":199,"text":"created instability in the model but you do that many many times you push the parameters to the right or the left and because of the way you created your loss function and your data labeling the way you structured your data and the loss function essentially the model is going to learn by itself to create similar encoding for pictures that are of the same person and separate encodings for pictures that are not from the same person and you didn't need to do feature engineering you didn't need to talk about eyes and ears and","start":4304.1,"end":4333.56},{"id":200,"text":"whatever because it will figure it out you know that you created the learning environment to allow that to happen so congratulations you designed your first loss function and we're going to design many more in this course","start":4333.64,"end":4348.1},{"id":201,"text":"This, by the way, is from FaceNet. It's a paper from 2015 from Schott et al. And you'll see in the slides I used, I always put the reference to the papers in case you want to go back and study the actual paper. Many students do it for their projects. This is a great one, great, great paper to look. A lot of citations as well. Let me make it slightly more complicated. We learned face verification, and now we want to do face identification.","start":4349.4,"end":4376.06},{"id":202,"text":"How is that different? Identification is a school wants to recognize students in facilities. So imagine face verification is you swipe your card and then that picture was compared to the picture of the camera. That's verification. The two, are they the same or not? Identification is you have this picture in the database somewhere. The person enters, immediately you can identify them.","start":4377.12,"end":4404.16},{"id":203,"text":"So the difference, for those of you who fly in the US, is when you go through global entry, many people don't even need to put their passport or anything. They just look at the camera and they move on. That's identification. But actually, when you're in Europe, for example, you put your passport in, then you walk in, then it takes a picture, that's verification. You see the difference or no? The negative, how do you create those triplets?","start":4405.16,"end":4440.13},{"id":204,"text":"No, in real time, that's a great question. I didn't talk about it. So at train time, you have databases and you create the triplets automatically. Like you pick pictures from the same person or you use data augmentation and you add a random picture from someone else. You create millions of triplets like that or billions of triplets. At test time, you only take the picture from the camera.","start":4443.33,"end":4464.45}],"notes":["本段讲解了损失函数设计在FaceNet中的应用，通过构建损失函数和数据标签，模型能够自动学习对同一人照片进行相似编码，对不同人照片进行不同编码，无需人工特征工程。","讲者提到FaceNet论文来自2015年Schott等人，强调了在课程中引用论文的重要性，许多学生会参考这些论文进行项目研究。","讲者进一步区分了人脸识别（face identification）和人脸验证（face verification）的概念，前者是直接从数据库中识别身份，后者是将输入图像与数据库中的图像进行比对以确认是否为同一人。","通过美国和欧洲的机场安检流程举例，讲者说明了两种任务的区别，并指出在实际应用中，人脸识别通常用于快速通行，而人脸验证则需要更多身份验证步骤。","讲者提到在训练阶段，通过数据库自动创建三元组（triplets），包括同一人照片和不同人照片，以训练模型。在测试阶段，仅使用摄像头拍摄的图像进行识别。","讲者强调了损失函数设计的重要性，并指出在后续课程中将设计更多类型的损失函数，以解决不同的学习任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4304.1,"end":4464.45,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4304.1,"text":"created instability in the model but you do that many many times you push the parameters to the right or the left and because of the way you created your loss function and your data labeling the way you structured your data and the loss function essentially the model is going to learn by itself to create similar encoding for pictures that are of the same person and separate encodings for pictures that are not from the same person and you didn't need to do feature engineering you didn't need to talk about eyes and ears and"},{"start":4333.64,"text":"whatever because it will figure it out you know that you created the learning environment to allow that to happen so congratulations you designed your first loss function and we're going to design many more in this course"},{"start":4349.4,"text":"This, by the way, is from FaceNet. It's a paper from 2015 from Schott et al. And you'll see in the slides I used, I always put the reference to the papers in case you want to go back and study the actual paper. Many students do it for their projects. This is a great one, great, great paper to look. A lot of citations as well. Let me make it slightly more complicated. We learned face verification, and now we want to do face identification."},{"start":4377.12,"text":"How is that different? Identification is a school wants to recognize students in facilities. So imagine face verification is you swipe your card and then that picture was compared to the picture of the camera. That's verification. The two, are they the same or not? Identification is you have this picture in the database somewhere. The person enters, immediately you can identify them."},{"start":4405.16,"text":"So the difference, for those of you who fly in the US, is when you go through global entry, many people don't even need to put their passport or anything. They just look at the camera and they move on. That's identification. But actually, when you're in Europe, for example, you put your passport in, then you walk in, then it takes a picture, that's verification. You see the difference or no? The negative, how do you create those triplets?"},{"start":4443.33,"text":"No, in real time, that's a great question. I didn't talk about it. So at train time, you have databases and you create the triplets automatically. Like you pick pictures from the same person or you use data augmentation and you add a random picture from someone else. You create millions of triplets like that or billions of triplets. At test time, you only take the picture from the camera."}],"speech_gaps":[],"frame":"../frames/v063/027.webp","frame_time":4316.1},{"title":"人脸识别与K近邻算法","segments":[{"id":205,"text":"run it, you don't use the negative. You just take the picture from the camera, you run it through the network, the person swipes, you take the picture from the swipe, run it through the network, you do the comparison, you let them in or not. So there's no more negative at test time in practice. It's just a trick to train the model. Okay, so how would you do face identification using what we learned for face verification? Is there any small tweak you can make that would make this network work for identification?","start":4465.24,"end":4493.84},{"id":206,"text":"Yes. Correct. Correct. What is it called in machine learning? There's a machine learning algorithm that we can stack on top of what we
