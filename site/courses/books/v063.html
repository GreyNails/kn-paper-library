 just did. He said you can compare. So because we don't have two pictures anymore, we just have one from the camera. You just compare the vector of the you run this by the network. You get the vector and then you compare it to the database.","start":4500.92,"end":4532.58},{"id":207,"text":"No. Good try. You have a database of all the student pictures. You run everything through the network. Instead of storing the image, you store the vectors. And then someone shows up and you're looking in the database. Is there any vector that is super close to this one? That's identification. What is this algorithm called in machine learning? It's a pretty simple algorithm. No.","start":4534.5,"end":4561.07},{"id":208,"text":"Okay, I'm going to make it easier. What if instead of having one picture of a student in the database, you had three of each student, you have three vectors for each person, and then you're trying to find the nearest vectors in the database from the one that the camera takes? I used the keyword. No? Yeah. K nearest neighbors. That's a K nearest neighbor algorithm. It's essentially, you want to explain what you meant?","start":4564.59,"end":4595.72},{"id":209,"text":"Why is it k-nearest neighbor? Yeah. Yeah. It's k-nearest neighbor for high dimensional vectors. So here is a simple example of k-nearest neighbor for two dimensions. In practice, it's 128 dimensions, so I can't put it on a slide, of course. But let's say in green, you have the query point. The query point is the camera picture. Okay? And then you run a nearest neighbor algorithm and you say, are there three vectors in the database","start":4596.35,"end":4630.28},{"id":210,"text":"are close to this vector, and you can add additional checks. Are these three vectors from the same person?","start":4632.23,"end":4637.87}],"notes":["本段讲解了人脸识别与验证的区别。在人脸识别中，系统仅使用一张图片进行比对，而不是像人脸验证那样使用两张图片进行比较。因此，人脸识别需要将图片转换为特征向量，并在数据库中寻找最接近的向量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4465.24,"end":4637.87,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4465.24,"text":"run it, you don't use the negative. You just take the picture from the camera, you run it through the network, the person swipes, you take the picture from the swipe, run it through the network, you do the comparison, you let them in or not. So there's no more negative at test time in practice. It's just a trick to train the model. Okay, so how would you do face identification using what we learned for face verification? Is there any small tweak you can make that would make this network work for identification?"},{"start":4500.92,"text":"Yes. Correct. Correct. What is it called in machine learning? There's a machine learning algorithm that we can stack on top of what we just did. He said you can compare. So because we don't have two pictures anymore, we just have one from the camera. You just compare the vector of the you run this by the network. You get the vector and then you compare it to the database."},{"start":4534.5,"text":"No. Good try. You have a database of all the student pictures. You run everything through the network. Instead of storing the image, you store the vectors. And then someone shows up and you're looking in the database. Is there any vector that is super close to this one? That's identification. What is this algorithm called in machine learning? It's a pretty simple algorithm. No."},{"start":4564.59,"text":"Okay, I'm going to make it easier. What if instead of having one picture of a student in the database, you had three of each student, you have three vectors for each person, and then you're trying to find the nearest vectors in the database from the one that the camera takes? I used the keyword. No? Yeah. K nearest neighbors. That's a K nearest neighbor algorithm. It's essentially, you want to explain what you meant?"},{"start":4596.35,"text":"Why is it k-nearest neighbor? Yeah. Yeah. It's k-nearest neighbor for high dimensional vectors. So here is a simple example of k-nearest neighbor for two dimensions. In practice, it's 128 dimensions, so I can't put it on a slide, of course. But let's say in green, you have the query point. The query point is the camera picture. Okay? And then you run a nearest neighbor algorithm and you say, are there three vectors in the database"},{"start":4632.23,"text":"are close to this vector, and you can add additional checks. Are these three vectors from the same person?"}],"speech_gaps":[],"frame":"../frames/v063/028.webp","frame_time":4477.24},{"title":"人脸识别与聚类算法","segments":[{"id":211,"text":"If they are, then it's very likely the person is correct because you just proved that the three closest vectors in the database are from the same person three times. So it's higher likelihood. You could even do it for 10 nearest neighbor if you want to be really secure. Let's say you go to the airport every time, and every time they take a picture of you, and now they can do a 10 nearest neighbor on that search. Does that make sense?","start":4638.87,"end":4661.73},{"id":212,"text":"Now it's slightly more complicated. You want to do face clustering. So you know in your phone sometimes it says it puts automatically all the pictures from your mom in one folder and from your dad in another folder, right? How does it do it? How could you make a tweak to again what we created or encoding network? How can you use that to create that?","start":4662.89,"end":4682.95},{"id":213,"text":"K-means, yeah, exactly. K-means algorithm, which is an unsupervised learning algorithm clustering. So you have a bunch of pictures. You have vectorized all of them with the network you trained. And normally the vectors that are from the same person should be clustered around the same place. And that's very simply how big companies do it on your phone. Yes.","start":4685.99,"end":4709.71},{"id":214,"text":"Yeah, so if the person is not in the database, then you shouldn't find any vector that is close to the vector you're taking picture of. The closest vector might be above your threshold in terms of distance, and you wouldn't let that person in. Yeah, for sure. Yeah, they make you sign up. So it's interesting because companies know that they need to build these algorithms, and then the admission process, the sign-up process might include certain data points, and now you're starting to understand how it's used in the background, right?","start":4712.24,"end":4745.4},{"id":215,"text":"Okay, let's move on. Yeah, one question. Oh, good question. So are you comparing each new picture? So I take a picture of my mom with my phone. What's going to happen? This picture is going to likely, if you're doing clustering, is going to be compared to the centroid of my mom. So the phone keeps probably a centroid of my mom. And if it's close enough to the centroid over another centroid, it's going to probably put it in that folder, essentially.","start":4747.31,"end":4779.51},{"id":216,"text":"Yeah, one more question and then we move on. Ah, yeah, there is, okay, how do you figure out how many centroids you want? There is an algorithm. You'll study it in CS229, not in CS230. But, you know. Okay. Okay, what we learned here is what an encoder network is. We learned about positive, anchor, negative for the triplet loss. The loss I showed you is called the triplet loss.","start":4780.96,"end":4810.23}],"notes":["本段讲解了人脸识别系统中如何利用最近邻算法进行身份验证。通过比较新输入的图像向量与数据库中最近的向量，可以判断是否为同一人。如果多个最近邻都来自同一人，则验证通过的可能性更高。此外，还提到在机场等场景中，可以使用10个最近邻进行更安全的验证。","本段讨论了如何利用聚类算法（如K-means）对人脸图像进行分类。手机中的相册自动分类功能就是基于这种技术，通过将图像向量化并聚类到同一中心点，实现自动归类。这展示了编码网络在实际应用中的作用。","本段详细解释了K-means算法作为无监督学习方法在人脸识别中的应用。通过将图像向量化并聚类到同一中心点，可以实现对同一人的图像进行分组。这种方法被大型公司广泛应用于手机相册的自动分类。","本段提到，如果一个人不在数据库中，系统将不会找到与其输入图像向量相近的向量。如果最近的向量距离超过设定的阈值，则系统不会允许该人进入。这说明了系统在验证过程中的安全机制。","本段回答了关于新图像如何与已知中心点进行比较的问题。手机会将新图像与已知人物的中心点进行比较，如果距离足够近，则将其归类到该人物的文件夹中。这展示了聚类算法在实际应用中的具体操作。","本段讨论了如何确定聚类中心的数量。虽然这一问题在CS230课程中未深入讲解，但会涉及CS229课程中的相关算法。同时，本段总结了编码网络、三元组损失（triplet loss）中的正样本、锚点和负样本的概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4638.87,"end":4810.23,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4638.87,"text":"If they are, then it's very likely the person is correct because you just proved that the three closest vectors in the database are from the same person three times. So it's higher likelihood. You could even do it for 10 nearest neighbor if you want to be really secure. Let's say you go to the airport every time, and every time they take a picture of you, and now they can do a 10 nearest neighbor on that search. Does that make sense?"},{"start":4662.89,"text":"Now it's slightly more complicated. You want to do face clustering. So you know in your phone sometimes it says it puts automatically all the pictures from your mom in one folder and from your dad in another folder, right? How does it do it? How could you make a tweak to again what we created or encoding network? How can you use that to create that?"},{"start":4685.99,"text":"K-means, yeah, exactly. K-means algorithm, which is an unsupervised learning algorithm clustering. So you have a bunch of pictures. You have vectorized all of them with the network you trained. And normally the vectors that are from the same person should be clustered around the same place. And that's very simply how big companies do it on your phone. Yes."},{"start":4712.24,"text":"Yeah, so if the person is not in the database, then you shouldn't find any vector that is close to the vector you're taking picture of. The closest vector might be above your threshold in terms of distance, and you wouldn't let that person in. Yeah, for sure. Yeah, they make you sign up. So it's interesting because companies know that they need to build these algorithms, and then the admission process, the sign-up process might include certain data points, and now you're starting to understand how it's used in the background, right?"},{"start":4747.31,"text":"Okay, let's move on. Yeah, one question. Oh, good question. So are you comparing each new picture? So I take a picture of my mom with my phone. What's going to happen? This picture is going to likely, if you're doing clustering, is going to be compared to the centroid of my mom. So the phone keeps probably a centroid of my mom. And if it's close enough to the centroid over another centroid, it's going to probably put it in that folder, essentially."},{"start":4780.96,"text":"Yeah, one more question and then we move on. Ah, yeah, there is, okay, how do you figure out how many centroids you want? There is an algorithm. You'll study it in CS229, not in CS230. But, you know. Okay. Okay, what we learned here is what an encoder network is. We learned about positive, anchor, negative for the triplet loss. The loss I showed you is called the triplet loss."}],"speech_gaps":[],"frame":"../frames/v063/029.webp","frame_time":4650.87},{"title":"自监督学习的引入与挑战","segments":[{"id":217,"text":"because of the triplets. And then we learned the different variations of face verification, identification, and clustering. Now we're going to get to an interesting section, which is brand new, around self-supervised learning. So note that everything we did so far, the day and night classification, the trigger word detection, and the triplet loss were supervised learning. We had labels.","start":4811.08,"end":4836.28},{"id":218,"text":"Essentially, day and night is very classic supervised learning. You label data with zero and one. Same for trigger word detection, face verification. You can debate. It can be different. But anyway, we focused on supervised learning. Now we're going to talk about self-supervised learning. And my question for you is the following. Labeling is expensive. We know that. So how would you redo what we did?","start":4837.05,"end":4863.77},{"id":219,"text":"with a different approach that does not require labels. Meaning, you remember, even in face verification, we sort of had the name of the students in the database with their face, and we might have multiple pictures of them. Let's say you don't even have that. You just have faces in the wild, unlabeled. How would you do things differently? Any idea? Yeah. Okay.","start":4864.55,"end":4898.1},{"id":220,"text":"Let the neural network find the pictures that are close to each other. But how would you train that network? Like you're starting with a network that doesn't do anything. And you give it an image, it gives you a random vector at first. So how would you train it? Do some clustering offline. But again, my question is the clustering algorithm, how is it trained? How do you cluster if you don't have any encoder network?","start":4898.9,"end":4925.52},{"id":221,"text":"Because the clustering came after we trained the encoder network. The clustering only worked because we had a good encoder network. But you don't know if it's the same person. That's what I'm saying. No, because that's the network you're training. The vectors are not similar because that's the network we want to train. Right now, I gave you a network. It's completely random. You give it my picture on Saturday and on Sunday, the vectors are completely off.","start":4926.89,"end":4958.7}],"notes":["本段讨论了自监督学习与监督学习的区别，强调了在没有标签的情况下如何训练神经网络。讲者指出，传统的监督学习如人脸识别、触发词检测等都需要标签，而自监督学习的目标是通过其他方式（如图像之间的相似性）来训练模型。","讲者提出了一个关键问题：如何在没有标签的情况下训练神经网络。他提到，可以尝试让神经网络自己找到相似的图像，但如何训练这个网络仍然是一个挑战。他进一步指出，聚类算法通常依赖于一个已经训练好的编码器网络，而如果没有编码器网络，聚类就无法进行。","讲者强调了编码器网络的重要性，指出在没有标签的情况下，聚类算法无法有效工作，因为编码器网络本身尚未训练。他举了一个例子，说明如果网络是随机的，那么输入同一张图片在不同时间得到的向量可能是完全不同的。","讲者通过这个例子说明了自监督学习的难点：如何在没有标签的情况下训练模型，使得网络能够学习到有意义的特征表示。这需要设计一种机制，让网络能够通过自身生成的信号（如图像之间的相似性）来学习。","讲者还指出，传统的监督学习依赖于标签，而自监督学习则试图通过其他方式（如对比学习）来替代标签，从而降低标注成本。这为后续讨论自监督学习的方法（如对比学习）奠定了基础。","讲者通过提问引导学生思考如何在没有标签的情况下训练模型，这体现了教学中常见的启发式教学方法，即通过问题引导学生思考和探索解决方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4811.08,"end":4958.7,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4811.08,"text":"because of the triplets. And then we learned the different variations of face verification, identification, and clustering. Now we're going to get to an interesting section, which is brand new, around self-supervised learning. So note that everything we did so far, the day and night classification, the trigger word detection, and the triplet loss were supervised learning. We had labels."},{"start":4837.05,"text":"Essentially, day and night is very classic supervised learning. You label data with zero and one. Same for trigger word detection, face verification. You can debate. It can be different. But anyway, we focused on supervised learning. Now we're going to talk about self-supervised learning. And my question for you is the following. Labeling is expensive. We know that. So how would you redo what we did?"},{"start":4864.55,"text":"with a different approach that does not require labels. Meaning, you remember, even in face verification, we sort of had the name of the students in the database with their face, and we might have multiple pictures of them. Let's say you don't even have that. You just have faces in the wild, unlabeled. How would you do things differently? Any idea? Yeah. Okay."},{"start":4898.9,"text":"Let the neural network find the pictures that are close to each other. But how would you train that network? Like you're starting with a network that doesn't do anything. And you give it an image, it gives you a random vector at first. So how would you train it? Do some clustering offline. But again, my question is the clustering algorithm, how is it trained? How do you cluster if you don't have any encoder network?"},{"start":4926.89,"text":"Because the clustering came after we trained the encoder network. The clustering only worked because we had a good encoder network. But you don't know if it's the same person. That's what I'm saying. No, because that's the network you're training. The vectors are not similar because that's the network we want to train. Right now, I gave you a network. It's completely random. You give it my picture on Saturday and on Sunday, the vectors are completely off."}],"speech_gaps":[],"frame":"../frames/v063/030.webp","frame_time":4823.08},{"title":"自监督学习的基本概念与示例","segments":[{"id":222,"text":"So how do you start? Yeah, yeah. Okay, tell me more. Okay, okay. Yeah, you're ahead, but we'll study that in two weeks, actually. So we'll do auto-encoders two weeks from now in class. Anyone else has an idea? Yeah.","start":4959.43,"end":4992.5},{"id":223,"text":"Okay, it's actually similar to what he was saying to reconstruct the original image. Yeah, that's what we learned. There's a lot of methods. Diffusion models work like that, autoencoders. We'll learn about that in two weeks when we focus on generative AI, generative modeling. Here, I want to present...","start":5005.21,"end":5023.99},{"id":224,"text":"also sort of a generative method, but it's really interesting because it will be your foray into self-supervised learning. Here is the idea. If we have pictures in the wild, going with the methods you had mentioned around data augmentation, you can actually force the network to learn from the data itself. So let me give you an example. You look at the picture of this dog, and you rotate it by 90 degrees. It's still the same dog.","start":5024.34,"end":5052.82},{"id":225,"text":"Right? A human would say, it's the same dog. What are we using in our brain? We're using the ability to understand rotation in variance and to understand the semantics of the dog. And so technically, if you gave those two images to the network, you could create a loss function that compares those two pairs and has to have vectors that are close to each other. Does that make sense? Other thing you could do, you can do a patch. You can literally take an image of a face and put a patch on half,","start":5053.38,"end":5082.96},{"id":226,"text":"of the image. And then you do the same thing on the other image. You put the other patch, the other half. And now you tell the network these two should have the same vector, pretty much. So you use your data augmentation scheme on massive data sets online to force the network to learn from the data itself.","start":5083.45,"end":5106.55},{"id":227,"text":"Okay? No need to forge triplets per se. You just take a picture, you make a variance of it with noise, with rotation, with cropping, with translation, with whatever you want, and then you put these two in the dataset and you said these are two the same person, it should have the same vector. Does that make sense? That's why it's called self-supervised learning.","start":5109.65,"end":5129.86}],"notes":["本段讲解了自监督学习的基本概念，即通过数据增强技术让网络从数据本身学习特征。讲者以狗的图片旋转为例，说明人类如何通过旋转不变性理解图像内容，并指出网络可以通过设计损失函数，使不同增强版本的图像具有相似的向量表示。","讲者进一步举例说明了如何通过图像补丁（patch）进行自监督学习，即对图像的不同部分进行增强处理，并要求网络将这些增强后的图像映射到相似的向量空间中。这种方法不需要人工标注，而是利用数据本身的结构进行学习。","讲者强调了自监督学习的核心思想是利用数据增强生成伪标签，从而让网络在没有显式标注的情况下学习到有用的特征表示。这种方法可以应用于大规模数据集，并且不需要额外的人工标注。","讲者提到，自监督学习不需要像三元组（triplet）那样复杂的结构，只需要对图像进行各种增强操作（如噪声、旋转、裁剪、平移等），然后将增强后的图像对视为同一类，要求网络学习到相似的向量表示。","讲者最后总结说，这种学习方式之所以被称为自监督学习，是因为它利用了数据本身的结构和变换不变性，而不是依赖外部的标签信息。这种方法在生成模型和大规模数据处理中具有重要应用价值。","讲者通过多个例子（如旋转、补丁、增强操作）说明了自监督学习的实现方式，并指出其与监督学习的不同之处在于不需要人工标注，而是通过数据增强生成伪标签。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4959.43,"end":5129.86,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4959.43,"text":"So how do you start? Yeah, yeah. Okay, tell me more. Okay, okay. Yeah, you're ahead, but we'll study that in two weeks, actually. So we'll do auto-encoders two weeks from now in class. Anyone else has an idea? Yeah."},{"start":5005.21,"text":"Okay, it's actually similar to what he was saying to reconstruct the original image. Yeah, that's what we learned. There's a lot of methods. Diffusion models work like that, autoencoders. We'll learn about that in two weeks when we focus on generative AI, generative modeling. Here, I want to present..."},{"start":5024.34,"text":"also sort of a generative method, but it's really interesting because it will be your foray into self-supervised learning. Here is the idea. If we have pictures in the wild, going with the methods you had mentioned around data augmentation, you can actually force the network to learn from the data itself. So let me give you an example. You look at the picture of this dog, and you rotate it by 90 degrees. It's still the same dog."},{"start":5053.38,"text":"Right? A human would say, it's the same dog. What are we using in our brain? We're using the ability to understand rotation in variance and to understand the semantics of the dog. And so technically, if you gave those two images to the network, you could create a loss function that compares those two pairs and has to have vectors that are close to each other. Does that make sense? Other thing you could do, you can do a patch. You can literally take an image of a face and put a patch on half,"},{"start":5083.45,"text":"of the image. And then you do the same thing on the other image. You put the other patch, the other half. And now you tell the network these two should have the same vector, pretty much. So you use your data augmentation scheme on massive data sets online to force the network to learn from the data itself."},{"start":5109.65,"text":"Okay? No need to forge triplets per se. You just take a picture, you make a variance of it with noise, with rotation, with cropping, with translation, with whatever you want, and then you put these two in the dataset and you said these are two the same person, it should have the same vector. Does that make sense? That's why it's called self-supervised learning."}],"speech_gaps":[],"frame":"../frames/v063/031.webp","frame_time":4971.43},{"title":"自监督学习与对比学习","segments":[{"id":228,"text":"Because you don't have labels, you just create a learning environment that makes the network learn from the patterns of the data directly itself. Okay, so this is an example called SinCo. Again, the paper is right there. And this shifts from...","start":5130.77,"end":5152.9},{"id":229,"text":"supervised triplets, FaceNet, which was a paper from 2015, to self-supervised pairs, that is why modern models are trained on billions of unlabeled images. Okay? That's how we create. It's much simpler when you think about it. You can literally write a script and scrape, and it will auto-label the images and put them in pairs, do variations, and then you'll end up with a very powerful pre-trained model.","start":5153.25,"end":5182.35},{"id":230,"text":"Much simpler than people think. It's not that hard, you know, at the end of the day. Most of the complexities are going to come from compute, right? Okay, so this method is called contrastive learning. Okay, we're going to talk about it a little more in two weeks.","start":5183.52,"end":5198.65},{"id":231,"text":"Self-supervision is not only an image thing. It's also used in other modalities. For example, in text, the principle is the same. You predict what belongs together and you push away what doesn't. That's for images. And here, what the core of GPT, some of you probably have heard of that, is a method called next token prediction.","start":5200.91,"end":5224.07},{"id":232,"text":"We're going to learn later about tokens in the class, but today, forget about tokens, just think the words. We're trying to look at a sentence and predict the next word. Why is this self-supervised learning? Because you don't label data. You just literally grab data from online and you create a scheme that forces the model to learn from the patterns of the data using self-supervised learning. But the self comes from the fact that you didn't label it manually yourself.","start":5224.74,"end":5250.66},{"id":233,"text":"So let's do a few examples. And the reason I want to do the examples is because we want to talk about emerging behaviors that stem from the tasks we defined. So give me the word you're thinking of. I poured myself a cup of, some people said tea, coffee. Anybody said anything else?","start":5252.53,"end":5274.1},{"id":234,"text":"Water, a cup of water.","start":5275.6,"end":5276.62},{"id":235,"text":"Healthy people said water.","start":5276.88,"end":5278.24},{"id":236,"text":"Yeah, so what's the emergent behavior that you can expect the model is going to learn based on just that example?","start":5279.66,"end":5287.9},{"id":237,"text":"Yeah, good point.","start":5293.92,"end":5295.12},{"id":238,"text":"Because you know that whatever is here first fits in a cup.","start":5295.18,"end":5299.16},{"id":239,"text":"So it understands that.","start":5299.46,"end":5300.68},{"id":240,"text":"The second reason is poured.","start":5301.44,"end":5303.04},{"id":241,"text":"So it's a liquid.","start":5303.22,"end":5303.94}],"notes":["本段讲解了自监督学习的基本概念，即在没有标签的情况下，通过构建学习环境让网络直接从数据中学习模式。以SinCo为例，说明了从监督学习（如FaceNet）向自监督学习（如对比学习）的转变，强调了自监督学习在大规模无标签数据上的应用。","自监督学习不仅适用于图像，也适用于文本等其他模态。在文本中，通过预测词语之间的关系（如下一个词）来实现学习。GPT的核心方法是next token prediction，即通过预测下一个词来训练模型。","在讲解自监督学习时，强调了其核心在于不依赖人工标注，而是通过构建数据的内在结构来实现学习。例如，通过预测句子中的下一个词，模型可以学习语言的模式。","通过一个例子说明了自监督学习的潜在行为。例如，当给出“我给自己倒了一杯...”时，模型可以推断出“水”作为可能的答案，这反映了模型对上下文和语义的理解。","在例子中，模型通过学习“倒”和“杯子”之间的关系，推断出“水”作为液体的属性，这展示了自监督学习如何从简单的任务中学习复杂的模式。","整个段落强调了自监督学习的简单性和实用性，指出其复杂性主要来自于计算资源，而不是算法本身。同时，提到对比学习将在后续课程中进一步讨论。"],"formulas":[],"uncertainties":["SinCo"],"diagram":"none","start":5130.77,"end":5303.94,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5130.77,"text":"Because you don't have labels, you just create a learning environment that makes the network learn from the patterns of the data directly itself. Okay, so this is an example called Sinclair. Again, the paper is right there. And this shifts from..."},{"start":5153.25,"text":"supervised triplets, FaceNet, which was a paper from 2015, to self-supervised pairs, that is why modern models are trained on billions of unlabeled images. Okay? That's how we create. It's much simpler when you think about it. You can literally write a script and scrape, and it will auto-label the images and put them in pairs, do variations, and then you'll end up with a very powerful pre-trained model."},{"start":5183.52,"text":"Much simpler than people think. It's not that hard, you know, at the end of the day. Most of the complexities are going to come from compute, right? Okay, so this method is called contrastive learning. Okay, we're going to talk about it a little more in two weeks."},{"start":5200.91,"text":"Self-supervision is not only an image thing. It's also used in other modalities. For example, in text, the principle is the same. You predict what belongs together and you push away what doesn't. That's for images. And here, what the core of GPT, some of you probably have heard of that, is a method called next token prediction."},{"start":5224.74,"text":"We're going to learn later about tokens in the class, but today, forget about tokens, just think the words. We're trying to look at a sentence and predict the next word. Why is this self-supervised learning? Because you don't label data. You just literally grab data from online and you create a scheme that forces the model to learn from the patterns of the data using self-supervised learning. But the self comes from the fact that you didn't label it manually yourself."},{"start":5252.53,"text":"So let's do a few examples. And the reason I want to do the examples is because we want to talk about emerging behaviors that stem from the tasks we defined. So give me the word you're thinking of. I poured myself a cup of, some people said tea, coffee. Anybody said anything else?"},{"start":5275.6,"text":"Water, a cup of water."},{"start":5276.88,"text":"Healthy people said water."},{"start":5279.66,"text":"Yeah, so what's the emergent behavior that you can expect the model is going to learn based on just that example?"},{"start":5293.92,"text":"Yeah, good point."},{"start":5295.18,"text":"Because you know that whatever is here first fits in a cup."},{"start":5299.46,"text":"So it understands that."},{"start":5301.44,"text":"The second reason is poured."},{"start":5303.22,"text":"So it's a liquid."}],"speech_gaps":[],"frame":"../frames/v063/032.webp","frame_time":5142.77},{"title":"无监督与弱监督学习的新兴行为","segments":[{"id":242,"text":"So just this sentence without even labeling is going to generate emergent behaviors that we've never trained the model for.","start":5303.94,"end":5310.86},{"id":243,"text":"That's what's interesting about modern AI, if you will.","start":5311.48,"end":5316.0},{"id":244,"text":"You don't need to define the tasks.","start":5316.28,"end":5318.44},{"id":245,"text":"Frankly, the same way, think about face verification.","start":5321.34,"end":5324.98},{"id":246,"text":"Back in the days, we used to do what I showed you where we would create triplets and we would be very specific about this is for face verification.","start":5325.52,"end":5332.3},{"id":247,"text":"application you could actually scrape all the images online and do the contrastive learning","start":5332.3,"end":5337.42},{"id":248,"text":"that i showed you next and it will still be good at detecting faces without you having even defined","start":5337.42,"end":5342.14},{"id":249,"text":"that task in the first place just by doing the contrastive prediction second okay first example","start":5342.14,"end":5348.2},{"id":250,"text":"also again i was trying to predict but people usually say different things i think the majority","start":5348.2,"end":5352.6},{"id":251,"text":"of people think coffee it's very cultural you go in another country it's going to be tea for sure","start":5352.6,"end":5357.34},{"id":252,"text":"and that forces the model to really think about everyday co-occurrence pattern like them you know","start":5357.34,"end":5366.9},{"id":253,"text":"being liquid being of a certain size occurring together so for example there's probably a lot","start":5367.54,"end":5372.88},{"id":254,"text":"of sentences online that says pouring a cup of tea and there's a lot saying pouring a cup of coffee","start":5372.88,"end":5378.48},{"id":255,"text":"because of that the model should understand that these two things are probably close to each other","start":5378.48,"end":5382.64},{"id":256,"text":"because their context is similar.","start":5382.64,"end":5384.02},{"id":257,"text":"Second example, the capital of France is Paris.","start":5384.48,"end":5391.72},{"id":258,"text":"Okay, what's the emergent behavior you can expect the model to learn?","start":5395.54,"end":5399.92},{"id":259,"text":"Yeah, learn about facts, exactly.","start":5402.54,"end":5404.44},{"id":260,"text":"So this is really predicting the next token forces the model to encode real-world facts,","start":5404.52,"end":5409.22},{"id":261,"text":"such as Paris being the capital of France.","start":5409.34,"end":5411.0},{"id":262,"text":"Oops, sorry.","start":5411.2,"end":5412.08},{"id":263,"text":"Uh, what about the third example? She unlocked her phone using her body parts. I don't know what","start":5412.64,"end":5422.16},{"id":264,"text":"your phone type of phone you have, but, uh, wait, what would you say? Face, password, fingerprint.","start":5422.16,"end":5431.9},{"id":265,"text":"Yeah. All of them are possible. So again, the network we'd learn probably that password,","start":5432.82,"end":5437.62},{"id":266,"text":"password, fingerprint, and face can be used to unlock stuff.","start":5437.62,"end":5439.86},{"id":267,"text":"And in fact here, probably fingerprint or face","start":5441.58,"end":5445.42},{"id":268,"text":"might nowadays be the more common,","start":5445.42,"end":5446.96},{"id":269,"text":"because of how the world has evolved. But back in the days, it would be password for sure. And so this forces a semantic understanding that these things are probably all meant to unlock information. The next one, the cat chased the dog or mouth or ball. And again, the model will learn probabilistic reasoning, meaning...","start":5447.78,"end":5473.12}],"notes":["本段讨论了现代AI在没有明确任务定义的情况下，通过对比学习等方法可以生成新兴行为。例如，通过对比学习，模型可以学会检测人脸，而无需显式定义任务。","讲者提到，通过预测下一个词，模型可以学习现实世界中的事实，如法国的首都是巴黎。这种学习方式迫使模型编码真实世界的知识。","在第三个例子中，讲者讨论了使用身体部位解锁手机的情况，如指纹、面部识别和密码。模型通过学习这些不同的解锁方式，可以理解它们的共同目的，即解锁信息。","讲者指出，随着技术的发展，指纹或面部识别可能比密码更常见，但过去密码是主要的解锁方式。这展示了模型如何通过学习不同场景下的行为，理解其语义。","最后，讲者提到模型会学习概率推理，例如猫追逐狗、嘴或球等场景，这表明模型能够理解不同事件之间的概率关系。","这些例子说明了无监督和弱监督学习如何让模型在没有明确任务定义的情况下，通过数据中的模式和上下文，学习到有用的知识和行为。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5303.94,"end":5473.12,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5303.94,"text":"So just this sentence without even labeling is going to generate emergent behaviors that we've never trained the model for."},{"start":5311.48,"text":"That's what's interesting about modern AI, if you will."},{"start":5316.28,"text":"You don't need to define the tasks."},{"start":5321.34,"text":"Frankly, the same way, think about face verification."},{"start":5325.52,"text":"Back in the days, we used to do what I showed you where we would create triplets and we would be very specific about this is for face verification."},{"start":5332.3,"text":"application you could actually scrape all the images online and do the contrastive learning"},{"start":5337.42,"text":"that i showed you next and it will still be good at detecting faces without you having even defined"},{"start":5342.14,"text":"that task in the first place just by doing the contrastive prediction second okay first example"},{"start":5348.2,"text":"also again i was trying to predict but people usually say different things i think the majority"},{"start":5352.6,"text":"of people think coffee it's very cultural you go in another country it's going to be tea for sure"},{"start":5357.34,"text":"and that forces the model to really think about everyday co-occurrence pattern like them you know"},{"start":5367.54,"text":"being liquid being of a certain size occurring together so for example there's probably a lot"},{"start":5372.88,"text":"of sentences online that says pouring a cup of tea and there's a lot saying pouring a cup of coffee"},{"start":5378.48,"text":"because of that the model should understand that these two things are probably close to each other"},{"start":5382.64,"text":"because their context is similar."},{"start":5384.48,"text":"Second example, the capital of France is Paris."},{"start":5395.54,"text":"Okay, what's the emergent behavior you can expect the model to learn?"},{"start":5402.54,"text":"Yeah, learn about facts, exactly."},{"start":5404.52,"text":"So this is really predicting the next token forces the model to encode real-world facts,"},{"start":5409.34,"text":"such as Paris being the capital of France."},{"start":5411.2,"text":"Oops, sorry."},{"start":5412.64,"text":"Uh, what about the third example? She unlocked her phone using her body parts. I don't know what"},{"start":5422.16,"text":"your phone type of phone you have, but, uh, wait, what would you say? Face, password, fingerprint."},{"start":5432.82,"text":"Yeah. All of them are possible. So again, the network we'd learn probably that password,"},{"start":5437.62,"text":"password, fingerprint, and face can be used to unlock stuff."},{"start":5441.58,"text":"And in fact here, probably fingerprint or face"},{"start":5445.42,"text":"might nowadays be the more common,"},{"start":5447.78,"text":"because of how the world has evolved. But back in the days, it would be password for sure. And so this forces a semantic understanding that these things are probably all meant to unlock information. The next one, the cat chased the dog or mouth or ball. And again, the model will learn probabilistic reasoning, meaning..."}],"speech_gaps":[{"start":5319.088,"end":5320.94}],"frame":"../frames/v063/033.webp","frame_time":5315.94},{"title":"自监督学习与模态示例","segments":[{"id":270,"text":"Because in the data set, it will find variations of the sentence with different, actually, conclusion. It would say that there's a lot of things that the cat can chase. And so that's probabilistic reasoning. What about the last one? If it's raining, I should bring an umbrella.","start":5473.76,"end":5490.4},{"id":271,"text":"What's the emergent behavior? It's reasoning and inference. It's the model we learn to connect conditions. So for example, raining requires you to be protecting yourself from the rain with an umbrella. That's reasoning. So long story short, emergent behaviors are unexpected capabilities that arise from simple training objectives at scale without being explicitly taught or labeled.","start":5492.38,"end":5518.55},{"id":272,"text":"Later in this class, we're going to have a full lecture on deep reinforcement learning where we're going to talk about emergent behaviors in robotics or in gaming where it turns out the agent you're training learns to do certain strategies that you didn't expect they would do. AlphaGo is a good example if you've watched the documentary. Okay.","start":5520.74,"end":5543.43},{"id":273,"text":"Self-supervision is not just about text and images. We've seen the next token prediction for GPT, and we've also seen constructive learning for images. My question here is the following. What other examples of modalities can you think of? And tell me the task that you would define. Audio. So for audio, what would you do? Audio. How would you do a self-supervision in audio?","start":5546.92,"end":5576.39},{"id":274,"text":"Exactly. Mask out portion. So mask out 20 time steps. And because you know what the data was, you have a label. You knew what the truth was. You can do a self-supervision task. It would work great. Again, the only limitation is compute and scale. What other modalities? So self-driving is a good example. It's very multimodal. There's a lot of different things happening in self-driving. We'll talk about it in a future lecture. What else? What other modalities can you think of?","start":5580.05,"end":5614.84},{"id":275,"text":"Videos. What would you do? Video. Take frames out. You can take some frames out. Same principle as audio. Biology. Some people work in healthcare biology here. Yeah, a couple. Well, you know about amino acids and protein structure. You can actually mask a portion of the inputs, such as a protein structure or DNA, and then complete it.","start":5615.61,"end":5643.94}],"notes":["本段主要讲解自监督学习不仅限于文本和图像，还涉及其他模态，如音频、视频和生物学数据。在音频中，可以通过遮蔽部分时间步并利用已知数据作为标签进行自监督任务。视频中则通过遮蔽部分帧进行类似操作。生物学领域中，可以遮蔽蛋白质结构或DNA的部分输入并完成其结构。","自监督学习的核心思想是利用数据本身的结构或上下文信息作为监督信号，而不是依赖人工标注。例如，在音频中遮蔽部分时间步并预测被遮蔽的内容，可以训练模型理解音频的上下文关系。","遮蔽任务是自监督学习中常见的策略，通过遮蔽数据的一部分并利用已知的完整数据作为标签，模型可以学习到数据的内在结构和模式。这种策略在音频、视频和生物学数据中都有应用。","在视频中，遮蔽部分帧并预测被遮蔽的内容，可以训练模型理解视频的时序关系和内容连贯性。这种任务与音频中的遮蔽任务有相似之处，都是利用数据的上下文信息进行学习。","生物学数据中的自监督学习可以通过遮蔽蛋白质结构或DNA的部分输入，并预测被遮蔽的内容。这种方法可以帮助模型学习到生物分子的结构特征和功能关系。","自监督学习的一个重要优势是不需要大量人工标注的数据，而是利用数据本身的结构和上下文信息进行训练。这种方法在处理多模态数据时尤其有用，因为它可以整合不同模态的信息进行学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5473.76,"end":5643.94,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5473.76,"text":"Because in the data set, it will find variations of the sentence with different, actually, conclusion. It would say that there's a lot of things that the cat can chase. And so that's probabilistic reasoning. What about the last one? If it's raining, I should bring an umbrella."},{"start":5492.38,"text":"What's the emergent behavior? It's reasoning and inference. It's the model we learn to connect conditions. So for example, raining requires you to be protecting yourself from the rain with an umbrella. That's reasoning. So long story short, emergent behaviors are unexpected capabilities that arise from simple training objectives at scale without being explicitly taught or labeled."},{"start":5520.74,"text":"Later in this class, we're going to have a full lecture on deep reinforcement learning where we're going to talk about emergent behaviors in robotics or in gaming where it turns out the agent you're training learns to do certain strategies that you didn't expect they would do. AlphaGo is a good example if you've watched the documentary. Okay."},{"start":5546.92,"text":"Self-supervision is not just about text and images. We've seen the next token prediction for GPT, and we've also seen constructive learning for images. My question here is the following. What other examples of modalities can you think of? And tell me the task that you would define. Audio. So for audio, what would you do? Audio. How would you do a self-supervision in audio?"},{"start":5580.05,"text":"Exactly. Mask out portion. So mask out 20 time steps. And because you know what the data was, you have a label. You knew what the truth was. You can do a self-supervision task. It would work great. Again, the only limitation is compute and scale. What other modalities? So self-driving is a good example. It's very multimodal. There's a lot of different things happening in self-driving. We'll talk about it in a future lecture. What else? What other modalities can you think of?"},{"start":5615.61,"text":"Videos. What would you do? Video. Take frames out. You can take some frames out. Same principle as audio. Biology. Some people work in healthcare biology here. Yeah, a couple. Well, you know about amino acids and protein structure. You can actually mask a portion of the inputs, such as a protein structure or DNA, and then complete it."}],"speech_gaps":[],"frame":"../frames/v063/034.webp","frame_time":5485.76},{"title":"多模态学习与弱监督学习","segments":[{"id":276,"text":"And it will force the model to understand those patterns. So great stuff in there. But the world is very multimodal. We experience words, images, sounds, and actions together. How can we connect them? When you think about multimodality, you want to connect texts and images, let's say. What do you need to do those? You actually need labeled data. You need image captioned.","start":5644.71,"end":5671.51},{"id":277,"text":"So for example, you have a bunch of picture online of the cat is looking at the camera. So there's a picture and there's a label underneath, just like on Instagram. Let's say people put captions, right? And the reason you can connect those modalities is because of that data set.","start":5671.9,"end":5688.08},{"id":278,"text":"Because you have a lot of that. Now, this is not typically called supervised learning. It will be called weakly supervised learning because you're not actually labeling images with captions. You are benefiting from naturally occurring pairings in the world. There is naturally occurring pairings of images and texts.","start":5688.7,"end":5707.9},{"id":279,"text":"So now what I want you to do is to find other examples that are not just images captioned, but naturally occurring examples of different modalities that appear in the wild together that we could use to connect modalities. The whole point of connecting modalities is that our vectors now can represent different modalities close to each other in space. So think about that.","start":5708.49,"end":5736.6},{"id":280,"text":"So now what I want you to do is to find other examples that are not just images captioned, but naturally occurring examples of different modalities that appear in the wild together that we could use to connect modalities. The whole point of connecting modalities is that our vectors now can represent different modalities close to each other in space. So think about that.","start":5746.97,"end":5778.87},{"id":281,"text":"You have the audio of the dog barking and the video of the dog barking. And so you can create a pairing between those two modalities. Transcription. So a lot of movies have subtitles. And so by definition, a video stream or stream of images will be naturally connected to text, which would also be naturally connected to audio. Music and song title. Again, that's a great one. Audio and text are connected. Genotype and phenotype. Good one as well.","start":5780.06,"end":5820.87}],"notes":["本段讲解了多模态学习的基本概念，强调了通过自然存在的模态配对（如图像与文本）来连接不同模态的重要性。这种配对不需要人工标注，而是利用现实世界中自然存在的关联，例如社交媒体上的图片配文。","讲者指出，这种学习方式通常不被称为监督学习，而是弱监督学习。弱监督学习的核心在于利用自然配对的数据，而不是完全人工标注的数据，从而减少对大量标注数据的依赖。","讲者进一步说明，连接不同模态的目的是让模型的向量空间中，不同模态的数据能够彼此接近。这有助于模型更好地理解和表示多模态信息。","讲者举例说明了多种自然存在的模态配对，如音频与视频、电影字幕与视频、音乐与歌曲标题、基因型与表型等。这些例子展示了不同模态之间自然的关联性。","讲者还提到，弱监督学习的一个关键优势是能够利用大量未标注的数据，通过自然配对来训练模型，从而提升模型对多模态数据的理解能力。","讲者鼓励学生思考更多自然存在的模态配对，并强调了多模态学习在现实世界中的广泛应用和重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5644.71,"end":5820.87,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5644.71,"text":"And it will force the model to understand those patterns. So great stuff in there. But the world is very multimodal. We experience words, images, sounds, and actions together. How can we connect them? When you think about multimodality, you want to connect texts and images, let's say. What do you need to do those? You actually need labeled data. You need image captioned."},{"start":5671.9,"text":"So for example, you have a bunch of picture online of the cat is looking at the camera. So there's a picture and there's a label underneath, just like on Instagram. Let's say people put captions, right? And the reason you can connect those modalities is because of that data set."},{"start":5688.7,"text":"Because you have a lot of that. Now, this is not typically called supervised learning. It will be called weekly supervised learning because you're not actually labeling images with captions. You are benefiting from naturally occurring pairings in the world. There is naturally occurring pairings of images and texts."},{"start":5708.49,"text":"So now what I want you to do is to find other examples that are not just images captioned, but naturally occurring examples of different modalities that appear in the wild together that we could use to connect modalities. The whole point of connecting modalities is that our vectors now can represent different modalities close to each other in space. So think about that."},{"start":5746.97,"text":"Please continue. I'm going to read some of the answers, but we keep going. Stock price sequence is a single modality. You would look at stock price and you can mask and then predict. But I think maybe what you mean is you would put additional data points in there as well. Let me see if I have something. Audio paired with video. Audio and video is a great one. Audio and video is naturally paired. You take a YouTube video, it has the audio and the video. And so when a dog is barking,"},{"start":5780.06,"text":"You have the audio of the dog barking and the video of the dog barking. And so you can create a pairing between those two modalities. Transcription. So a lot of movies have subtitles. And so by definition, a video stream or stream of images will be naturally connected to text, which would also be naturally connected to audio. Music and song title. Again, that's a great one. Audio and text are connected. Genotype and phenotype. Good one as well."}],"speech_gaps":[],"frame":"../frames/v063/035.webp","frame_time":5656.71},{"title":"多模态学习与共享嵌入空间","segments":[{"id":282,"text":"Medical imaging with ultrasound. That's a great one. Naturally occurring. Usually, if you go do an ultrasound, you'll have the different types of images that occur together naturally. Game footage and keyboard action. Again, another great one. So, you know, price scenario code. Good one. Yeah, great examples. Facial expression. So, TLDR is we have ways to connect modalities.","start":5825.34,"end":5854.86},{"id":283,"text":"Oftentimes, some modalities are going to connect very naturally. Most things connect to text. So that's what you want to use as your shared space, typically. But here, it is an example of a paper called ImageBind. And the interesting thing about ImageBind is it says that most things connect through a single modality. So, for example, thermal data connects to imaging.","start":5856.41,"end":5883.87},{"id":284,"text":"Imaging connects to text. So text is going to connect through images with thermal data. And what's the consequence of that? If I may show you a little example, is that you can, this is a demo from Meta called ImageBind. It's a cool one. You can actually see things occurring together. So for example, you put a text, drums, and of course you can get an audio of a drum.","start":5884.8,"end":5907.82},{"id":285,"text":"But you can also see what the closest image in the vector space is to that concept. So all the spaces are now bound together. You can also do audio and image. So you give it a dog barking and a picture. What can you expect? A dog on the beach.","start":5909.58,"end":5928.56},{"id":286,"text":"That's the multimodal embedding, the connecting tissue between those different modalities. And that's probably one of the biggest innovations of the last few years, connecting those shared spaces. I'm not going to cover the full paper, but the core insight is that there are shared spaces. There are spaces like text and image that connect to most modalities that can allow us to connect those modalities together.","start":5929.45,"end":5952.31},{"id":287,"text":"Okay, we learned a lot of things here. Embeddings, self-supervised learning, contrastive learning, data augmentation, next-token prediction, weekly supervised learning, and then the shared embedding stays with the central pivot usually being text. Okay, that's all for today. We're not going to have time to cover the adversarial example, but we're going to cover it in two weeks together. You're going to have more neural network baggage.","start":5953.63,"end":5977.29}],"notes":["本段主要讲解多模态学习的概念，强调不同模态（如图像、文本、音频）之间的连接方式。通过ImageBind的例子，说明多模态数据如何通过共享嵌入空间进行关联。例如，热成像数据与图像数据之间存在自然连接，而文本可以通过图像与热成像数据进行关联。","课堂中提到，大多数模态都可以通过单一模态进行连接，例如文本作为共享空间的中心枢纽。ImageBind的实验表明，通过将不同模态映射到统一的向量空间，可以实现跨模态的检索和生成。例如，输入文本“drums”可以生成对应的音频和图像。","多模态嵌入（multimodal embedding）是连接不同模态的关键技术，它允许模型在统一的向量空间中处理多种类型的数据。这种技术被认为是近年来多模态学习领域的重要创新。","课堂还简要回顾了本节课涉及的主要概念，包括嵌入（embeddings）、自监督学习（self-supervised learning）、对比学习（contrastive learning）、数据增强（data augmentation）、下一个词预测（next-token prediction）以及弱监督学习（weakly supervised learning）。","共享嵌入空间通常以文本作为中心枢纽，因为文本可以作为其他模态的桥梁。例如，文本可以通过图像或热成像数据进行关联，从而实现跨模态的表示学习。","最后，课程提到将不会深入讲解对抗样本（adversarial examples），但将在两周后进行详细讲解。同时，学生将需要掌握更多关于神经网络的知识。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5825.34,"end":5977.29,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5825.34,"text":"Medical imaging with ultrasound. That's a great one. Naturally occurring. Usually, if you go do an ultrasound, you'll have the different types of images that occur together naturally. Game footage and keyboard action. Again, another great one. So, you know, price scenario code. Good one. Yeah, great examples. Facial expression. So, TLDR is we have ways to connect modalities."},{"start":5856.41,"text":"Oftentimes, some modalities are going to connect very naturally. Most things connect to text. So that's what you want to use as your shared space, typically. But here, it is an example of a paper called ImageBind. And the interesting thing about ImageBind is it says that most things connect through a single modality. So, for example, thermal data connects to imaging."},{"start":5884.8,"text":"Imaging connects to text. So text is going to connect through images with thermal data. And what's the consequence of that? If I may show you a little example, is that you can, this is a demo from Meta called ImageBind. It's a cool one. You can actually see things occurring together. So for example, you put a text, drums, and of course you can get an audio of a drum."},{"start":5909.58,"text":"But you can also see what the closest image in the vector space is to that concept. So all the spaces are now bound together. You can also do audio and image. So you give it a dog barking and a picture. What can you expect? A dog on the beach."},{"start":5929.45,"text":"That's the multimodal embedding, the connecting tissue between those different modalities. And that's probably one of the biggest innovations of the last few years, connecting those shared spaces. I'm not going to cover the full paper, but the core insight is that there are shared spaces. There are spaces like text and image that connect to most modalities that can allow us to connect those modalities together."},{"start":5953.63,"text":"Okay, we learned a lot of things here. Embeddings, self-supervised learning, contrastive learning, data augmentation, next-token prediction, weekly supervised learning, and then the shared embedding stays with the central pivot usually being text. Okay, that's all for today. We're not going to have time to cover the adversarial example, but we're going to cover it in two weeks together. You're going to have more neural network baggage."}],"speech_gaps":[],"frame":"../frames/v063/036.webp","frame_time":5837.34}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
