to predict needs to be higher. So the state is lossy. If you remove the previous action, my guess is that the performance will drop compared to having the action as input."},{"start":1669.78,"text":"The question is what happens if we use two or three or more time steps of the state history that's related to the other question where what if we train the full system end-to-end directly phased to using reinforcement learning? You can do that. You just need to be a bit careful with same-to-real transfer because now it has more context and information to potentially exploit the simulation or your environment or your reward structure in ways which might not be desirable."}],"speech_gaps":[],"frame":"../frames/v027/010.webp","frame_time":1555.04},{"title":"提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":116,"text":"The question is what, to just quickly explain Dagger, it's a very standard algorithm where what we do here, the way we apply it here is to run the phase two policy. So we initialize the adaptation module, which is random weights. We run the phase two policy, collect the data. Initially, it's just going to be bad data because it hasn't learned to do anything meaningful. And then we'll use the teacher encoder.","zh":"问题是，为了快速解释Dagger，它是一个非常标准的算法，我们在这里应用它的方式是运行第二阶段策略。因此，我们初始化适应模块，其初始权重是随机的。我们运行第二阶段策略，收集数据。最初，这些数据将只是糟糕的数据，因为该策略尚未学会执行任何有意义的操作。然后我们将使用教师编码器。","start":1696.75,"end":1723.81},{"id":117,"text":"To supervise at every time step, what should the prediction have been? And then we will just use supervised learning to update the adaptation module. We will take it back in simulation. We will roll it again. It will hopefully be better than what it did before, but still not optimal. And then we will again supervise it with the teacher module, get the data set, run supervised learning, and then repeat. So switching to adding vision.","zh":"为了在每个时间步进行监督，预测应该是什么？然后我们只需使用监督学习来更新适应模块。我们将它重新带回仿真环境中，再次运行。它应该会比之前更好，但仍然不是最优的。然后我们再次使用教师模块进行监督，获取数据集，运行监督学习，然后重复。因此，切换到添加视觉信息。","start":1724.25,"end":1750.82},{"id":118,"text":"So the most common approach to add vision is to decouple it entirely from control and then build an explicit map that you can then feed into your controller to use that to walk. And the reason this there's a fundamental flaw in this approach, which is you first of all, you're solving a very hard problem, which is building an explicit map. So your map will always be noisy. So if you have non-rigid objects or if you have drift in your estimate of your pose or any of these, it will end up.","zh":"添加视觉信息最常见的方法是将其完全与控制解耦，然后构建一个显式的地图，将其输入控制器以利用该地图进行行走。然而，这种方法存在根本性的缺陷，即你首先解决了一个非常困难的问题，即构建一个显式地图。因此，你的地图将始终是嘈杂的。如果你处理的是非刚性物体，或者你的姿态估计存在漂移，或者任何这些情况，它最终会收敛到非常嘈杂的地图。","start":1751.82,"end":1781.88},{"id":119,"text":"converging to very noisy maps. So that is a phase where you have already lost information and there is no way you can recover that information. And then you feed that into the controller. So since we are solving a harder problem, we are losing information that we in other scenarios would not have lost if we were to directly use the perception input in the policy.","zh":"因此，在这一阶段，你已经丢失了信息，并且无法恢复这些信息。然后你将这些信息输入控制器。由于我们正在解决一个更困难的问题，我们丢失了在其他情况下如果我们直接使用感知输入到策略中时不会丢失的信息。","start":1782.15,"end":1802.56},{"id":120,"text":"So here's an example of how people add noise to the real terrain. Maybe the edges were enough to tell you how to take that step, but the moment you convert it to a metric map and then try to give that into the policy, now you need to train your policy to be robust to all of these different kinds of noises, which is okay for simple scenarios, but becomes very challenging the moment you need to precisely estimate where the gap is and avoid stepping on that.","zh":"这是一个例子，说明人们如何向真实地形添加噪声。也许边缘信息足以告诉你如何迈出这一步，但一旦你将其转换为度量地图，并尝试将其输入策略，现在你需要训练策略以对所有这些不同类型的噪声具有鲁棒性。这在简单场景中是可以接受的，但一旦你需要精确估计间隙的位置并避免踩上去，就会变得非常具有挑战性。","start":1804.69,"end":1833.61},{"id":121,"text":"So what we do in this work is we ask this question, do we need terrain maps? Do we need to explicitly build them? The answer that we hypothesize that we don't. And instead, we directly couple vision and control in the final system. So here is what that system looks like in deployment. And I'll get to how do we train it. So in the top right is the depth egocentric that the bot can see.","zh":"因此，在这项工作中，我们提出的问题是：我们是否需要地形地图？是否需要显式地构建它们？我们假设答案是否定的。相反，我们直接在最终系统中将视觉与控制耦合起来。这就是该系统在部署时的外观。我将解释我们是如何训练它的。在右上方是机器人能够看到的深度第一视角图像。","start":1836.29,"end":1861.44}],"notes":["本段讨论了在机器人系统中添加视觉信息的常见方法及其潜在问题。通常的做法是将视觉信息与控制模块完全解耦，并构建一个显式的地图，然后将其输入控制器以实现行走。然而，这种方法存在根本性缺陷，因为构建显式地图是一个非常困难的问题，且地图本身会包含噪声。","当存在非刚性物体或姿态估计漂移时，地图的噪声会进一步加剧，导致信息丢失，且无法恢复。这种信息丢失在后续的控制过程中会带来负面影响，因为控制模块依赖于这些地图进行决策。","在实际应用中，人们可能会将地形信息转换为度量地图，但这样做会引入额外的噪声，使得策略需要具备更强的鲁棒性。对于简单场景，这可能是可以接受的，但在需要精确估计地形间隙以避免踩踏的情况下，这种方法变得非常具有挑战性。","本段提出了一种替代方案，即不依赖显式地图，而是直接将视觉信息与控制模块耦合。这种方法可以避免因构建地图而带来的信息丢失问题，从而提高系统的整体性能。","在部署系统中，机器人可以直接利用视觉输入进行控制，而无需经过显式地图的转换。这种直接耦合的方法在训练过程中需要特别设计，以确保策略能够有效利用视觉信息进行决策。","本段强调了在机器人智能提升过程中，如何通过改进视觉与控制的耦合方式，来克服传统方法中的信息丢失问题，从而实现更鲁棒和精确的控制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1696.75,"end":1861.44,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1696.75,"text":"The question is what, to just quickly explain Dagger, it's a very standard algorithm where what we do here, the way we apply it here is to run the phase two policy. So we initialize the adaptation module, which is random weights. We run the phase two policy, collect the data. Initially, it's just going to be bad data because it hasn't learned to do anything meaningful. And then we'll use the teacher encoder."},{"start":1724.25,"text":"To supervise at every time step, what should the prediction have been? And then we will just use supervised learning to update the adaptation module. We will take it back in simulation. We will roll it again. It will hopefully be better than what it did before, but still not optimal. And then we will again supervise it with the teacher module, get the data set, run supervised learning, and then repeat. So switching to adding vision."},{"start":1751.82,"text":"So the most common approach to add vision is to decouple it entirely from control and then build an explicit map that you can then feed into your controller to use that to walk. And the reason this there's a fundamental flaw in this approach, which is you first of all, you're solving a very hard problem, which is building an explicit map. So your map will always be noisy. So if you have non-rigid objects or if you have drift in your estimate of your pose or any of these, it will end up."},{"start":1782.15,"text":"converging to very noisy maps. So that is a phase where you have already lost information and there is no way you can recover that information. And then you feed that into the controller. So since we are solving a harder problem, we are losing information that we in other scenarios would not have lost if we were to directly use the perception input in the policy."},{"start":1804.69,"text":"So here's an example of how people add noise to the real terrain. Maybe the edges were enough to tell you how to take that step, but the moment you convert it to a metric map and then try to give that into the policy, now you need to train your policy to be robust to all of these different kinds of noises, which is okay for simple scenarios, but becomes very challenging the moment you need to precisely estimate where the gap is and avoid stepping on that."},{"start":1836.29,"text":"So what we do in this work is we ask this question, do we need terrain maps? Do we need to explicitly build them? The answer that we hypothesize that we don't. And instead, we directly couple vision and control in the final system. So here is what that system looks like in deployment. And I'll get to how do we train it. So in the top right is the depth egocentric that the bot can see."}],"speech_gaps":[],"frame":"../frames/v027/011.webp","frame_time":1708.75},{"title":"强化学习中的机器人智能提升","segments":[{"id":122,"text":"I've taped the cameras and compute and everything on the bots. Everything is running on board in real time. And it's trying to cross over these stepping stones. This is my living room and these just got 20 stools and then just got it to walk on it. And it's like repeated runs with different levels of gaps and variations so that you can test that's actually using perception to handle all of these.","zh":"我已经把摄像头、计算设备和其他所有东西都安装在机器人上了。所有的东西都在实时地在机器人上运行。它正在尝试跨过这些踏脚石。这是我的客厅，这些只是20个凳子，然后让它在上面行走。它通过不同间隙和变化的重复运行来测试，以确认它实际上是在使用感知来处理所有这些情况。","start":1861.85,"end":1892.71},{"id":123,"text":"And here it's some hiking path where the stairs are uneven. And the robot is actually quite small. So if you give it a second here, if you see the height of the step is almost as high as the robot. And it struggles a bit, but it manages to climb it at the end. Similarly for stairs, we tested it on even, uneven stairs, up, down, all of that across and was relatively robust. And if you see how much it has to get down once it is up.","zh":"在这里，它是一条徒步路径，台阶是不平整的。机器人实际上非常小。如果你再看一会儿，你会看到台阶的高度几乎和机器人一样高。它有点挣扎，但最终还是爬了上去。同样地，对于台阶，我们测试了平坦和不平坦的台阶，上坡、下坡，所有这些情况，它表现得相对稳健。如果你看到它在爬上去之后需要如何下来。","start":1894.91,"end":1924.36},{"id":124,"text":"It is actually quite sharp for a robot of this size. And here the ground is extremely slippery. It's just like there's barely a stable foothold for the bot, but it keeps trying and eventually makes it. Again, here the step is very high. It tries a few times and then it gets it. One thing, this is like a debris, I think, around CMU.","zh":"对于这个尺寸的机器人来说，它实际上表现得相当敏捷。在这里，地面极其滑。就像机器人几乎没有任何稳定的立足点，但它仍在不断尝试，最终还是成功了。同样地，这里的台阶非常高。它尝试了几次，然后最终成功了。有一点，这可能是卡内基梅隆大学周围的废墟。","start":1924.89,"end":1952.29},{"id":125,"text":"And one thing to note here is that it doesn't always get everything in one shot. It sometimes needs to try and retry. And the retries make more sense than the previous try. That is an example of learning within the context of what is fed into the model. In this one change we make and I'll get to that is. So in the first phase of training, it's the same as before with this additional.","zh":"有一点需要注意的是，它并不总是能在一次尝试中完成所有事情。它有时需要尝试和重试。而重试比之前的尝试更有意义。这是在模型输入上下文中学习的一个例子。在这个改变中，我将要讲到这一点。因此，在训练的第一阶段，它和之前一样，只是增加了这个。","start":1953.1,"end":1975.06},{"id":126,"text":"terrain height information. We don't add any noise to it. This is perfect terrain height that we feed into the model. And then we encode all of that, give it to an MLP, and then train this whole system with reinforcement learning. It is much faster to train because you don't need to render any perception inputs. The recipe is the same as before. We use PPO in simulation. This time we use Isaac Gym. And the rewards are to track a target velocity and then minimize energy.","zh":"地形高度信息。我们没有对它添加任何噪声。这是完美地形高度，我们将其输入到模型中。然后我们对所有这些信息进行编码，将其输入到一个MLP中，并使用强化学习训练整个系统。训练速度更快，因为不需要渲染任何感知输入。配方和之前一样。我们在仿真中使用PPO。这次我们使用Isaac Gym。奖励是跟踪目标速度并最小化能量。","start":1975.99,"end":2003.85},{"id":127,"text":"These are the different training terrains we use and we then get a single policy that can walk on all of these different terrains in simulation. The problem is same as before. How do we get these dots in the real world? And most approaches try to construct a map and feed that as input. But instead, what we try to do is directly integrate depth. So we render depth in simulation and then we directly try to supervise that.","zh":"这些是我们使用的不同训练地形，然后我们得到一个可以在这些不同地形上行走的单一策略。问题与之前相同。我们如何在现实世界中获得这些点？大多数方法尝试构建地图并将该地图作为输入。但相反，我们尝试直接整合深度信息。我们在模拟中渲染深度信息，然后我们直接尝试对其进行监督。","start":2005.11,"end":2032.32}],"notes":["本段讲授了机器人在复杂地形中行走的实验，包括不同地形的测试，如台阶、滑腻地面和高台阶。机器人通过多次尝试和重试来适应环境，这体现了强化学习中策略的逐步优化。","在训练过程中，使用了地形高度信息作为输入，且未添加噪声，这有助于模型学习更精确的地形特征。通过将这些信息编码并输入到多层感知机（MLP）中，再结合强化学习进行训练，提高了训练效率。","训练过程中使用了PPO算法，并在Isaac Gym仿真环境中进行，奖励机制包括跟踪目标速度和最小化能量消耗。这表明课程强调了仿真环境在强化学习中的重要性。","课程提到，训练得到的策略可以在不同地形中行走，但如何将仿真中的结果迁移到真实世界仍是挑战。大多数方法尝试构建地图作为输入，但课程提出直接整合深度信息的方法，通过在仿真中渲染深度并进行监督学习。","这些内容展示了强化学习在机器人控制中的应用，强调了环境感知、策略优化和迁移学习的重要性。","课程通过具体例子说明了如何在复杂环境中训练机器人，突出了强化学习在实际应用中的潜力和挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1861.85,"end":2032.32,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1861.85,"text":"I've taped the cameras and compute and everything on the bots. Everything is running on board in real time. And it's trying to cross over these stepping stones. This is my living room and these just got 20 stools and then just got it to walk on it. And it's like repeated runs with different levels of gaps and variations so that you can test that's actually using perception to handle all of these."},{"start":1894.91,"text":"And here it's some hiking path where the stairs are uneven. And the robot is actually quite small. So if you give it a second here, if you see the height of the step is almost as high as the robot. And it struggles a bit, but it manages to climb it at the end. Similarly for stairs, we tested it on even, uneven stairs, up, down, all of that across and was relatively robust. And if you see how much it has to get down once it is up."},{"start":1924.89,"text":"It is actually quite sharp for a robot of this size. And here the ground is extremely slippery. It's just like there's barely a stable foothold for the bot, but it keeps trying and eventually makes it. Again, here the step is very high. It tries a few times and then it gets it. One thing, this is like a debris, I think, around CMU."},{"start":1953.1,"text":"And one thing to note here is that it doesn't always get everything in one shot. It sometimes needs to try and retry. And the retries make more sense than the previous try. That is an example of learning within the context of what is fed into the model. In this one change we make and I'll get to that is. So in the first phase of training, it's the same as before with this additional."},{"start":1975.99,"text":"terrain height information. We don't add any noise to it. This is perfect terrain height that we feed into the model. And then we encode all of that, give it to an MLP, and then train this whole system with reinforcement learning. It is much faster to train because you don't need to render any perception inputs. The recipe is the same as before. We use PPO in simulation. This time we use Isaac Gym. And the rewards are to track a target velocity and then minimize energy."},{"start":2005.11,"text":"These are the different training terrains we use and we then get a single policy that can walk on all of these different terrains in simulation. The problem is same as before. How do we get these dots in the real world? And most approaches try to construct a map and feed that as input. But instead, what we try to do is directly integrate depth. So we render depth in simulation and then we directly try to supervise that."}],"speech_gaps":[],"frame":"../frames/v027/012.webp","frame_time":1873.85},{"title":"提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":128,"text":"with the depth encoder that was trained in the first phase using the same approach as Dagger, where we roll out the student policy and then we supervise it with the teacher. And same for the extrinsic vector. So here, if you try training the second phase directly,","zh":"使用在第一阶段通过与Dagger相同的策略训练的深度编码器，我们展开学生策略，然后用教师对其进行监督。外在向量也是如此。因此，如果你尝试直接训练第二阶段，","start":2032.79,"end":2050.07},{"id":129,"text":"it would be an order of magnitude slower because rendering depth takes a lot of time. This gives you a significant speed up over how to train it and lets you deploy it in the real world as well, very robustly from what I just showed you. This is the final deployment policy. It takes the egocentric depth from the camera that's on the robot and the full proprioceptive history. The one change that we've made here is the use of RNNs.","zh":"速度会慢一个数量级，因为渲染深度需要大量时间。这为你提供了显著的速度提升，使你能够以非常稳健的方式在真实世界中部署该策略，正如我刚刚展示的那样。这是最终的部署策略。它使用安装在机器人上的摄像头获取的以自我为中心的深度信息以及完整的本体感觉历史。我们在这里所做的唯一更改是使用了RNN。","start":2050.75,"end":2079.45},{"id":130,"text":"So we use RNN, so they can give you a slightly longer context. So RNNs are recurrent neural networks which integrate information over time, but they're not known to preserve very long horizon information, which is why most of the community moved to transformers when they wanted to do very long sequence modeling. We used RNN, which gives a good enough context to the model, but we did not ablate using a transformer instead for the stars to see if that improves performance or not.","zh":"因此，我们使用RNN，以便它们可以提供稍微更长的上下文。RNN是递归神经网络，它们在时间上整合信息，但它们并不以保留非常长的时间范围信息而闻名，这就是为什么当社区想要进行非常长序列建模时，大多数都转向了Transformer。我们使用RNN，这足以为模型提供良好的上下文，但我们没有进行消融实验，用Transformer替代RNN来观察是否能提升性能。","start":2079.87,"end":2108.81},{"id":131,"text":"So now when we deploy this policy, to point this out again, I think stairs are designed for humans and this robot is extremely short. So relative to the height of the robot, these stairs are tall. So there isn't enough clearance under the robot to just raise its leg and then take the step.","zh":"因此，当我们部署这个策略时，再次指出，我认为台阶是为人类设计的，而这个机器人非常矮小。相对于机器人的高度，这些台阶非常高。因此，机器人下方的通过空间不足以让它仅仅抬起腿然后跨过台阶。","start":2110.6,"end":2130.09},{"id":132,"text":"Also, when it is going down, if it just does it in a way which everyone else would, the amount of tilt you would see in a sport robot would be much smaller because it's a much taller robot while going down. Whereas for a small robot, it needs to use majority of its leg and the discrepancy will be much higher just because the legs are smaller. So what it learns is it learns to move the leg out sideways to climb all of these stairs.","zh":"此外，当它向下移动时，如果它以其他人通常的方式进行，那么在运动机器人中你会看到的倾斜程度会小很多，因为这是一个更高的机器人在向下移动。而对于小型机器人来说，它需要使用大部分腿部，由于腿部更小，差异会更大。因此，它学到的是如何将腿横向移动以攀爬所有这些台阶。","start":2131.25,"end":2155.39},{"id":133,"text":"And this is possible because we don't use any predefined gate or foot motions or any of that. And we let it be learned using reinforcement learning through search. And this footstep planning is also emergent. So it only takes a step when it needs to. It doesn't constantly move its feet to if we had a predefined gate of any sort. And we see that it's actually quite smooth and seems to work with intention and precision. And it can handle these kinds of scenarios very easily.","zh":"而且这是可能的，因为我们没有使用任何预定义的腿部动作或脚部运动，或者其他类似的东西。我们让它通过搜索来学习强化学习。而且这种脚步规划也是涌现出来的。因此，它只在需要的时候才迈出一步。如果存在任何预定义的门框，它不会持续移动脚部。我们看到它实际上非常流畅，似乎是以意图和精确性进行工作的。它能够非常轻松地处理这些场景。","start":2156.09,"end":2188.3}],"notes":["本段主要讲解了在机器人智能提升过程中，使用RNN（循环神经网络）来处理时间序列数据的优势与局限性。RNN能够提供比传统方法更长的上下文信息，但其在处理非常长的序列时存在信息丢失的问题，因此社区转向了Transformer模型。然而，在本研究中，作者选择使用RNN，因为它已经能够为模型提供足够的上下文信息，且未进行替换Transformer的实验以验证性能提升。","在机器人部署过程中，作者指出楼梯设计适合人类，而机器人身高较矮，因此楼梯相对于机器人来说非常高。这导致机器人在上下楼梯时需要特别处理，因为其腿部空间不足以直接抬腿跨步。","当机器人向下移动时，由于其身高较高，倾斜角度会比小型机器人小。而小型机器人由于腿部较短，需要使用大部分腿部进行移动，导致较大的倾斜差异。因此，机器人学习到的策略是将腿部向外移动以适应这些楼梯。","作者强调，这种腿部移动策略是通过强化学习自动学习得到的，而不是依赖预定义的门控或腿部运动模式。这种策略是涌现的，即机器人仅在需要时才采取行动，而不是持续移动腿部。","最终，作者指出这种策略在实际应用中表现得非常平滑且精确，能够有效处理复杂的楼梯场景。","本段还提到，作者没有进行替换Transformer模型的实验，因此无法确定是否使用Transformer会进一步提升性能。这表明当前的模型选择是基于实际效果和计算效率的权衡。"],"formulas":[],"uncertainties":["ablate using a transformer instead for the stars"],"diagram":"none","start":2032.79,"end":2188.3,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2032.79,"text":"with the depth encoder that was trained in the first phase using the same approach as Dagger, where we roll out the student policy and then we supervise it with the teacher. And same for the extrinsic vector. So here, if you try training the second phase directly,"},{"start":2050.75,"text":"it would be an order of magnitude slower because rendering depth takes a lot of time. This gives you a significant speed up over how to train it and lets you deploy it in the real world as well, very robustly from what I just showed you. This is the final deployment policy. It takes the egocentric depth from the camera that's on the robot and the full proprioceptive history. The one change that we've made here is the use of RNNs."},{"start":2079.87,"text":"So we use RNN, so they can give you a slightly longer context. So RNNs are recurrent neural networks which integrate information over time, but they're not known to preserve very long horizon information, which is why most of the community moved to transformers when they wanted to do very long sequence modeling. We used RNN, which gives a good enough context to the model, but we did not ablate using a transformer instead for the stars to see if that improves performance or not."},{"start":2110.6,"text":"So now when we deploy this policy, to point this out again, I think stairs are designed for humans and this robot is extremely short. So relative to the height of the robot, these stairs are tall. So there isn't enough clearance under the robot to just raise its leg and then take the step."},{"start":2131.25,"text":"Also, when it is going down, if it just does it in a way which everyone else would, the amount of tilt you would see in a sport robot would be much smaller because it's a much taller robot while going down. Whereas for a small robot, it needs to use majority of its leg and the discrepancy will be much higher just because the legs are smaller. So what it learns is it learns to move the leg out sideways to climb all of these stairs."},{"start":2156.09,"text":"And this is possible because we don't use any predefined gate or foot motions or any of that. And we let it be learned using reinforcement learning through search. And this footstep planning is also emergent. So it only takes a step when it needs to. It doesn't constantly move its feet to if we had a predefined gate of any sort. And we see that it's actually quite smooth and seems to work with intention and precision. And it can handle these kinds of scenarios very easily."}],"speech_gaps":[],"frame":"../frames/v027/013.webp","frame_time":2044.79},{"title":"无需地图的策略在复杂环境中的表现","segments":[{"id":134,"text":"And then again, the same policy can control for all of these different variations of environments. We don't use any explicit maps, no explicit gates, and that is critical to get the results we do in this scenario. We also gave a live demo at multiple places to...","zh":"然后，同样的策略可以控制这些不同环境的变种。我们没有使用任何显式的地图，也没有使用任何显式的门控机制，这对于我们在这种场景中取得的结果至关重要。我们还在多个地方进行了现场演示，以……","start":2197.65,"end":2214.23},{"id":135,"text":"And it was quite robust in a lot of these scenarios. In some of these demos, I think at the bottom one, the right foot padding just got out and started limping, but it continued to do the full demo.","zh":"在这些场景中，它表现得相当稳健。在一些演示中，我认为最下面的那个，右脚垫子刚刚脱出并开始跛行，但它仍然继续完成了整个演示。","start":2215.32,"end":2227.44},{"id":136,"text":"So let's quickly compare this with baseline. I have three key baselines. The first is just having a blind policy. So the same as what we had before. The second one uses a map and then feeds a slightly noisy version of the map to see how it works. It's also trained with that noise. And then the last is what I just demonstrated directly going from depth. So we see that the gap is not that much for simple terrains like a slope. But the moment we get to more challenging terrains,","zh":"那么，让我们快速将这种方法与基线进行比较。我有三个关键的基线。第一个是仅仅使用盲策略，也就是我们之前所使用的。第二个方法使用地图，然后将地图的一个略微嘈杂的版本输入，以观察其效果。它也是在该噪声下进行训练的。第三个方法则是直接从深度图像进行处理。我们看到，在简单的地形如斜坡上，差距并不大。但是一旦我们进入更具挑战性的地形，","start":2230.77,"end":2260.34},{"id":137,"text":"A map-based method is almost as bad as blind, because if we sample from the same distribution that other works have done, we see that the same performance goes down significantly.","zh":"基于地图的方法几乎和盲策略一样差，因为如果我们从其他工作所使用的相同分布中进行采样，我们会发现其性能显著下降。","start":2260.97,"end":2269.31},{"id":138,"text":"So you need the final action head to know whatever it needs to from perception directly without adding any noise or any bottlenecks for it to work well in this scenario.","zh":"因此，你需要最终的动作头（action head）能够直接从感知中获取它所需的信息，而无需添加任何噪声或任何瓶颈，以便在这种场景中良好地工作。","start":2269.77,"end":2280.55},{"id":139,"text":"Similarly, for stairs and discrete obstacles, we see that the performance is better than","zh":"同样地，在楼梯和离散障碍物的情况下，我们看到其性能优于","start":2282.21,"end":2286.83},{"id":140,"text":"the other two methods, but the other methods still fall behind the performance of this","zh":"另外两种方法，但另外两种方法的性能仍然落后于这种方法","start":2286.83,"end":2293.53},{"id":141,"text":"method.","zh":"的性能。","start":2293.53,"end":2293.81},{"id":142,"text":"One interesting thing is for stairs, it's better to be blind and just learn to put your","zh":"一个有趣的现象是，在楼梯上，盲目行动并学习如何放置脚步比使用一个嘈杂且提供不准确估计的地图更好。","start":2294.05,"end":2300.33},{"id":143,"text":"steps blindly than to use a map which is noisy and which gives you an inaccurate estimate","zh":"使用这样的地图会给出你可能需要放置脚的位置的不准确估计。","start":2300.33,"end":2305.69},{"id":144,"text":"estimate of where you might have to place your foot.","zh":"估计你可能需要放置脚的位置。","start":2305.69,"end":2307.37},{"id":145,"text":"Up until now I've developed it for locomotion and then the same thing is applicable also","zh":"到目前为止，我已经将其应用于移动任务，同样的方法也适用于灵巧操作的一个场景。","start":2310.53,"end":2314.53},{"id":146,"text":"to one scenario in dexterous manipulation.","zh":"所以这是仅仅旋转手中物体的任务。","start":2314.53,"end":2317.33},{"id":147,"text":"So this is the task of just rotating objects in hand.","zh":"这是相同的策略，它能够处理这些不同物体的各种变化。","start":2318.13,"end":2322.49},{"id":148,"text":"It's the same policy and it's capable of handling all of these different variations of objects.","zh":"这里有纸巾，还有羽毛球拍，所有这些都在这个场景中。","start":2322.63,"end":2328.03},{"id":149,"text":"There's a paper towel and then there's a badminton shuttle and all of these things in this.","zh":"这里有一张纸巾，还有一个羽毛球 shuttle，以及所有这些东西。","start":2328.13,"end":2333.09},{"id":150,"text":"it is capable of generalizing to objects","zh":"它能够推广到物体上","start":2334.41,"end":2336.97},{"id":151,"text":"with very different physical properties","zh":"这些物体具有非常不同的物理特性","start":2336.97,"end":2338.31},{"id":152,"text":"so the weight variation can be huge","zh":"因此重量的变化可以很大","start":2338.31,"end":2340.89},{"id":153,"text":"it's like from 5 grams to almost 200 grams","zh":"就像从5克到几乎200克","start":2340.89,"end":2343.33},{"id":154,"text":"the coefficient of friction","zh":"摩擦系数","start":2344.83,"end":2346.79},{"id":155,"text":"so this is an ice ball","zh":"所以这是一个冰球","start":2346.79,"end":2347.81},{"id":156,"text":"and on the right is a kiwi","zh":"而右边是猕猴桃","start":2347.81,"end":2349.37},{"id":157,"text":"which has a slightly rough surface","zh":"它的表面稍微粗糙一些","start":2349.37,"end":2350.95},{"id":158,"text":"the center of Masud","zh":"Masud的中心","start":2353.03,"end":2354.33},{"id":159,"text":"on the right is below the finger","zh":"右边的物体位于手指下方","start":2354.33,"end":2357.17},{"id":160,"text":"because of the weight that hangs from it","zh":"因为有一个物体悬挂在下面","start":2357.17,"end":2358.83},{"id":161,"text":"and on the left it's slightly above the finger","zh":"而左边的物体则略微位于手指上方","start":2358.83,"end":2361.71},{"id":162,"text":"and it seems to do fine. And here the shape is also very different. It could be a cube or a cup","zh":"看起来它仍然表现良好。而且这里的形状也完全不同。它可能是一个立方体或一个杯子","start":2361.71,"end":2367.33},{"id":163,"text":"and performs fine still. And this was also trained in simulation deployed in the real world zero shot.","zh":"它仍然表现良好。这也是在模拟器中训练并在现实世界中零样本部署的","start":2367.33,"end":2372.75},{"id":164,"text":"And the key idea is the same here. We use proprioceptive history","zh":"并且这里的思路是相同的。我们使用本体感觉历史","start":2374.67,"end":2377.53}],"notes":["本段讨论了无需地图的策略在复杂环境中的表现，强调了直接从感知中获取信息的重要性。讲者指出，使用地图的方法在简单地形上表现尚可，但在复杂地形上几乎与盲策略相当，因为地图的噪声和不准确性会显著降低性能。","在楼梯和离散障碍物的场景中，直接感知策略的表现优于使用地图的两种方法，但后两者仍然落后于直接感知策略。这表明，直接感知策略在处理复杂环境时具有优势。","讲者提到，在楼梯场景中，盲策略可能比使用噪声地图更有效，因为地图提供的位置估计不准确，而盲策略可以通过学习直接放置脚步来适应环境。","此外，讲者还展示了该策略在灵活操作任务中的应用，如旋转物体。该策略能够处理不同物理特性的物体，包括重量差异大、摩擦系数不同、形状各异的物体。","讲者指出，该策略在模拟中训练后，可以直接部署到现实世界中，实现零样本迁移。这表明策略具有良好的泛化能力。","最后，讲者提到该策略的关键思想是使用本体感觉历史，这可能意味着策略利用了机器人自身的感知信息来做出决策，而不需要外部地图或环境模型。"],"formulas":[],"uncertainties":["the center of Masud"],"diagram":"none","start":2197.65,"end":2377.53,"asr_flags":[],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":2197.65,"text":"And then again, the same policy can control for all of these different variations of environments. We don't use any explicit maps, no explicit gates, and that is critical to get the results we do in this scenario. We also gave a live demo at multiple places to..."},{"start":2215.32,"text":"And it was quite robust in a lot of these scenarios. In some of these demos, I think at the bottom one, the right foot padding just got out and started limping, but it continued to do the full demo."},{"start":2230.77,"text":"So let's quickly compare this with baseline. I have three key baselines. The first is just having a blind policy. So the same as what we had before. The second one uses a map and then feeds a slightly noisy version of the map to see how it works. It's also trained with that noise. And then the last is what I just demonstrated directly going from depth. So we see that the gap is not that much for simple terrains like a slope. But the moment we get to more challenging terrains,"},{"start":2260.97,"text":"A map-based method is almost as bad as blind, because if we sample from the same distribution that other works have done, we see that the same performance goes down significantly."},{"start":2269.77,"text":"So you need the final action head to know whatever it needs to from perception directly without adding any noise or any bottlenecks for it to work well in this scenario."},{"start":2282.21,"text":"Similarly, for stairs and discrete obstacles, we see that the performance is better than"},{"start":2286.83,"text":"the other two methods, but the other methods still fall behind the performance of this"},{"start":2293.53,"text":"method."},{"start":2294.05,"text":"One interesting thing is for stairs, it's better to be blind and just learn to put your"},{"start":2300.33,"text":"steps blindly than to use a map which is noisy and which gives you an inaccurate estimate"},{"start":2305.69,"text":"estimate of where you might have to place your foot."},{"start":2310.53,"text":"Up until now I've developed it for locomotion and then the same thing is applicable also"},{"start":2314.53,"text":"to one scenario in dexterous manipulation."},{"start":2318.13,"text":"So this is the task of just rotating objects in hand."},{"start":2322.63,"text":"It's the same policy and it's capable of handling all of these different variations of objects."},{"start":2328.13,"text":"There's a paper towel and then there's a badminton shuttle and all of these things in this."},{"start":2334.41,"text":"and it is capable of generalizing to objects"},{"start":2336.97,"text":"with very different physical properties"},{"start":2338.31,"text":"so the weight variation can be huge"},{"start":2340.89,"text":"it's like from 5 grams to almost 200 grams"},{"start":2344.83,"text":"the coefficient of friction"},{"start":2346.79,"text":"so this is an ice ball"},{"start":2347.81,"text":"and on the right is a kiwi"},{"start":2349.37,"text":"which has a slightly rough surface"},{"start":2353.03,"text":"the center of Masud"},{"start":2354.33,"text":"on the right is below the finger"},{"start":2357.17,"text":"because of the weight that hangs from it"},{"start":2358.83,"text":"and on the left it's slightly above the finger"},{"start":2361.71,"text":"and it seems to do fine. And here the shape is also very different. It could be a cube or a cup"},{"start":2367.33,"text":"and performs fine still. And this was also trained in simulation deployed in the real world zero shot."},{"start":2374.67,"text":"And the key idea is the same here. We use proprioceptive history"}],"speech_gaps":[],"frame":"../frames/v027/014.webp","frame_time":2209.65},{"title":"通过接触检测提升机器人智能","segments":[{"id":165,"text":"to give the model as an input and then it uses that to figure out how to learn a general model.","zh":"将模型作为输入，然后它利用该输入来学习一个通用模型。","start":2378.51,"end":2383.39},{"id":166,"text":"One hypothesis, since we don't know exactly what the model is doing, is it uses proprioceptive history for contact detection. So if you look at this, and if you look at the bottom joint, that's what we have plotted. So we have the actions, and then we have the joint position, which is actually achieved. And if you look at the time when it makes the contact or not,","zh":"一个假设是，由于我们不知道模型具体在做什么，它可能使用本体感觉历史来进行接触检测。所以如果你看一下这个，以及看一下底部的关节，这就是我们所绘制的。我们有动作，然后有实际达到的关节位置。如果你看一下它是否接触的时间点，","start":2385.23,"end":2403.21},{"id":167,"text":"It turns out that the time when it is not in contact correlates with the bottom part of the graph where they do overlap with each other. And the time when it does make contact is at the top of the graph where it's in contact and then it's not able to achieve the desired joint position that it is commanding. And this is enough signal for the network to estimate it. And if you can estimate contacts, you can figure out.","zh":"结果发现，它不接触的时间点与图中底部部分重叠的地方相关联。而它确实接触的时间点则在图的顶部，此时它处于接触状态，但无法达到它所命令的期望关节位置。这已经足够让网络进行估计。如果你能够估计接触情况，你就能推断出。","start":2403.81,"end":2426.43},{"id":168,"text":"the shape and size of the object that helps you in adapting to all of these different variations. We did the same, gave live demos for these as well. So in the center one, this is an orange peel. So if you apply a slightly larger force than necessary, it will completely deform. And on the right is an adapter. This has not been seen in training data and simulation. We don't simulate objects to this level of granularity.","zh":"物体的形状和大小，这有助于你适应所有这些不同的变化。我们同样做了同样的事情，也为这些情况进行了现场演示。中间的那个是橙皮。如果你施加比必要稍大的力，它会完全变形。右边的是一个适配器。这个在训练数据和仿真中都没有出现。我们没有对物体进行如此细致的仿真。","start":2427.44,"end":2453.94},{"id":169,"text":"Okay, and again the same thing can be applied to drone flight as well.","zh":"好的，同样的事情也可以应用于无人机飞行。","start":2456.38,"end":2459.28},{"id":170,"text":"So we have the same policy controlling the drone at the top and the bottom. So the same weights, which tries to estimate the mass and arm length and all of these of the drones. The top drone is four times heavier than the one at the bottom. And the arm length is also three times. And the same weights is able to estimate what morphology it's operating in. And it's able to adapt and fly the drones. It's directly controlling the motor velocity of each of the propellers.","zh":"我们有相同的策略控制顶部和底部的无人机。相同的权重，尝试估计无人机的质量、臂长等所有这些参数。顶部的无人机比底部的无人机重四倍。臂长也长三倍。相同的权重能够估计它所操作的形态，并能够适应并飞行无人机。它直接控制每个螺旋桨的电机转速。","start":2460.33,"end":2487.09},{"id":171,"text":"So it's not abstracting away to a level where this becomes an easy problem. And it's also very robust. So this is another drone with a higher mass. Initially, it wobbles a bit. I think it's still trying to estimate what drone it is flying. And then we'll take a tennis ball and shoot it at the fins. So these are the propellers of the drone. And then we'll shoot it at one of the propellers. And it's still quite robust to it.","zh":"因此，它并没有抽象到一个让这个问题变得容易的层次。而且它也非常稳健。所以这是另一架质量更大的无人机。起初，它会稍微有些晃动。我想它仍在尝试估计自己正在飞行的是哪架无人机。然后我们会用网球拍击打它的尾翼。这些是无人机的螺旋桨。然后我们会用网球拍击打其中一个螺旋桨。而且它对这种干扰仍然相当稳健。","start":2487.93,"end":2517.67},{"id":172,"text":"Okay, so I have shown all of these results and then the next natural question is what is there left to solve? Well, I think almost everything. We still don't have a general purpose robot model that can control a general purpose hardware to achieve the tasks that humans can.","zh":"好的，我已经展示了所有这些结果，那么接下来自然的问题就是还有什么问题需要解决呢？嗯，我想几乎一切问题都还有待解决。我们仍然没有一个通用的机器人模型，能够控制通用的硬件来完成人类所能完成的任务。","start":2520.97,"end":2539.52}],"notes":["本段主要讲解机器人通过接触检测来估计环境信息，从而实现对不同物体和机械结构的适应。讲者提到，通过分析关节位置和动作数据，可以判断机器人是否与物体接触，这种信号足够网络进行估计。接触检测对于机器人理解物体形状和大小至关重要，从而帮助其适应不同变化。","讲者进一步展示了机器人在不同物理参数下的适应能力，例如无人机的重量和臂长变化。通过相同的策略和权重，机器人能够估计其操作环境的形态，并进行适应性飞行。这表明机器人能够直接控制推进器的转速，实现对不同无人机的控制。","讲者提到，尽管机器人能够适应不同的物理参数，但仍然存在挑战，例如对未知物体的适应能力。讲者指出，目前还没有一个通用的机器人模型能够控制通用硬件完成人类能完成的任务，这表明强化学习在机器人智能方面仍有大量未解决的问题。","讲者通过实验展示了机器人在面对外部干扰（如击打推进器）时的鲁棒性。即使在受到干扰的情况下，机器人仍然能够保持稳定飞行，这表明其控制策略具有较强的适应性和鲁棒性。","讲者强调，机器人并没有抽象到一个容易处理的层次，而是直接处理物理参数和环境变化，这使得问题更加复杂，但也更接近现实场景。","最后，讲者指出，尽管已经取得了一些进展，但仍然有很多问题需要解决，例如如何构建一个通用的机器人模型，使其能够控制各种硬件完成复杂任务。这表明强化学习在机器人智能领域仍有广阔的研究空间。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2378.51,"end":2539.52,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2378.51,"text":"to give the model as an input and then it uses that to figure out how to learn a general model."},{"start":2385.23,"text":"One hypothesis, since we don't know exactly what the model is doing, is it uses proprioceptive history for contact detection. So if you look at this, and if you look at the bottom joint, that's what we have plotted. So we have the actions, and then we have the joint position, which is actually achieved. And if you look at the time when it makes the contact or not,"},{"start":2403.81,"text":"It turns out that the time when it is not in contact correlates with the bottom part of the graph where they do overlap with each other. And the time when it does make contact is at the top of the graph where it's in contact and then it's not able to achieve the desired joint position that it is commanding. And this is enough signal for the network to estimate it. And if you can estimate contacts, you can figure out."},{"start":2427.44,"text":"the shape and size of the object that helps you in adapting to all of these different variations. We did the same, gave live demos for these as well. So in the center one, this is an orange peel. So if you apply a slightly larger force than necessary, it will completely deform. And on the right is an adapter. This has not been seen in training data and simulation. We don't simulate objects to this level of granularity."},{"start":2456.38,"text":"Okay, and again the same thing can be applied to drone flight as well."},{"start":2460.33,"text":"So we have the same policy controlling the drone at the top and the bottom. So the same weights, which tries to estimate the mass and arm length and all of these of the drones. The top drone is four times heavier than the one at the bottom. And the arm length is also three times. And the same weights is able to estimate what morphology it's operating in. And it's able to adapt and fly the drones. It's directly controlling the motor velocity of each of the propellers."},{"start":2487.93,"text":"So it's not abstracting away to a level where this becomes an easy problem. And it's also very robust. So this is another drone with a higher mass. Initially, it wobbles a bit. I think it's still trying to estimate what drone it is flying. And then we'll take a tennis ball and shoot it at the fins. So these are the propellers of the drone. And then we'll shoot it at one of the propellers. And it's still quite robust to it."},{"start":2520.97,"text":"Okay, so I have shown all of these results and then the next natural question is what is there left to solve? Well, I think almost everything. We still don't have a general purpose robot model that can control a general purpose hardware to achieve the tasks that humans can."}],"speech_gaps":[],"frame":"../frames/v027/015.webp","frame_time":2390.51},{"title":"提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":173,"text":"So I'll focus on humanoids as the general form factor, which we know can achieve every single thing that humans can, and show you the progress that we have made at Tesla on this. So you might have seen some of these videos. On the left is a biped walking on hill. I've showed similar results with a quadruped, but a biped is much less forgiving because it's a much more unstable system, and you need to be more reactive. All of these results are also trained in simulation deployed zero-shot on hardware.","zh":"因此，我将重点放在人形机器人上，这种形态我们已知可以实现人类所能完成的一切任务，并向你们展示我们在特斯拉在这方面取得的进展。你们可能已经看过一些这样的视频。左边是双足机器人在山坡上行走。我曾用四足机器人展示了类似的结果，但双足机器人更加难以驾驭，因为它是一个更加不稳定的系统，需要更快速的反应。所有这些结果都是在模拟中训练，然后零样本部署到硬件上。","start":2541.14,"end":2570.54},{"id":174,"text":"And then a more recent video of the bot dancing. All real-time, on-board, autonomous. Getting the first thing to work and the tenth thing to work does not take very long because the pipeline is very simple. Once you get one thing to work, you can actually pump out a lot more results very easily. And then this is the progress we have made on manipulation. So this is the same neural network that takes language as input.","zh":"然后是一段更近期的机器人跳舞视频。所有都是实时、 onboard、自主完成的。让第一个功能正常运作，让第十个功能正常运作并不需要很长的时间，因为整个流程非常简单。一旦你让一个功能正常运作，你实际上可以很容易地产生更多的结果。这就是我们在操作方面取得的进展。这是同一个神经网络，它以语言作为输入。","start":2571.07,"end":2597.21},{"id":175,"text":"and then can execute whatever the language command is. Here, the key ingredient is the use of videos. We learned this from videos and a little bit of robot data, and we're able to get this. This is the progress that we have up until now in manipulation. Again, this is the same policy, doing all of these things conditioned on language. And we can get decent performance on these tasks, but they're not very reliable.","zh":"然后它可以执行任何语言指令。在这里，关键因素是使用视频。我们从视频和少量的机器人数据中学习到了这一点，并能够实现这些功能。这就是我们目前在操作方面取得的进展。同样，这是同一个策略，在语言条件下完成所有这些任务。我们可以在这些任务上获得相当好的性能，但它们并不非常可靠。","start":2597.79,"end":2625.27},{"id":176,"text":"This was learned using egocentric videos of humans doing things. And then we translated that somehow to the robot results that I've shown you. So these results are not very reliable. And where we eventually want to get to is reliability and dexterity to the level of what humans have. This is the eventual goal where we want to get to. So we want consistency, dexterity, agility, and reliability in the final system that we have. So if we take a step back,","zh":"这些结果是通过人类进行操作的视角视频学习得到的。然后我们以某种方式将这些结果转化为我向你们展示的机器人结果。因此，这些结果并不非常可靠。而我们最终想要达到的是与人类相当的可靠性和灵活性。这是我们的最终目标。因此，我们希望最终系统具备一致性、灵活性、敏捷性和可靠性。如果我们后退一步，","start":2626.04,"end":2656.35},{"id":177,"text":"In all the results that I presented for locomotion, the results that we got were very agile, dexterous, and very reliable in the real world. And those results, like I mentioned, were three to four years ago. So why do we not already have some or most of these results for manipulation in the real world to the same level of dexterity and reliability? And if you go back to the two things which got...","zh":"在我展示的所有运动结果中，我们得到的结果都非常敏捷、灵活，并且在现实世界中非常可靠。正如我之前提到的，这些结果是大约三到四年前取得的。那么，为什么我们到现在还没有在现实世界中实现与操作任务相同水平的灵活性和可靠性的结果呢？如果你回到那两个导致……","start":2656.71,"end":2679.74},{"id":178,"text":"locomotion to work well. One was the simulation technology was ready. Rigid body contact was good enough to get very robust locomotion. But when it comes to manipulation and if you have to chop vegetables, we need to simulate that. We need to simulate that and then we need to simulate deformable objects, dough and everything in simulation to get the same material transfer to work for this. And then the second comparison are rewards, which are much easier to specify for locomotion. So if you","zh":"运动表现良好。其中一个原因是仿真技术已经准备就绪。刚体接触已经足够好，可以实现非常稳健的运动。但当我们涉及到操作任务，比如需要切菜时，我们就需要模拟这些操作。我们需要模拟这些操作，并且还需要模拟可变形物体，比如面团，以及在仿真中的一切事物，以实现相同的材料转移效果。而第二个比较因素是奖励函数，对于运动任务来说，奖励函数要容易指定得多。所以如果你","start":2680.41,"end":2708.67}],"notes":["本段讨论了机器人在执行语言指令时的进展，强调了视频数据在训练中的关键作用。虽然已经实现了基本的执行能力，但这些结果在可靠性和灵活性方面仍有不足。","讲者指出，目前的机器人在执行任务时虽然表现良好，但尚未达到人类的水平，特别是在可靠性和灵活性方面。这表明当前的系统仍需进一步优化。","讲者对比了行走和操作任务的挑战，指出行走任务在模拟技术上已经成熟，而操作任务则需要更复杂的模拟，包括可变形物体的处理。","奖励函数的定义在行走任务中相对简单，但在操作任务中则更加复杂，这可能是操作任务进展缓慢的一个原因。","讲者提到，目前的系统在执行任务时虽然表现尚可，但尚未达到一致性和可靠性，这表明需要进一步的研究和改进。","讲者强调了最终目标是实现与人类相当的可靠性和灵活性，这需要在模拟技术和奖励函数设计方面进行更多探索。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2541.14,"end":2708.67,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2541.14,"text":"So I'll focus on humanoids as the general form factor, which we know can achieve every single thing that humans can, and show you the progress that we have made at Tesla on this. So you might have seen some of these videos. On the left is a biped walking on hill. I've showed similar results with a quadruped, but a biped is much less forgiving because it's a much more unstable system, and you need to be more reactive. All of these results are also trained in simulation deployed zero-shot on hardware."},{"start":2571.07,"text":"And then a more recent video of the bot dancing. All real-time, on-board, autonomous. Getting the first thing to work and the tenth thing to work does not take very long because the pipeline is very simple. Once you get one thing to work, you can actually pump out a lot more results very easily. And then this is the progress we have made on manipulation. So this is the same neural network that takes language as input."},{"start":2597.79,"text":"and then can execute whatever the language command is. Here, the key ingredient is the use of videos. We learned this from videos and a little bit of robot data, and we're able to get this. This is the progress that we have up until now in manipulation. Again, this is the same policy, doing all of these things conditioned on language. And we can get decent performance on these tasks, but they're not very reliable."},{"start":2626.04,"text":"This was learned using egocentric videos of humans doing things. And then we translated that somehow to the robot results that I've shown you. So these results are not very reliable. And where we eventually want to get to is reliability and dexterity to the level of what humans have. This is the eventual goal where we want to get to. So we want consistency, dexterity, agility, and reliability in the final system that we have. So if we take a step back,"},{"start":2656.71,"text":"In all the results that I presented for locomotion, the results that we got were very agile, dexterous, and very reliable in the real world. And those results, like I mentioned, were three to four years ago. So why do we not already have some or most of these results for manipulation in the real world to the same level of dexterity and reliability? And if you go back to the two things which got..."},{"start":2680.41,"text":"locomotion to work well. One was the simulation technology was ready. Rigid body contact was good enough to get very robust locomotion. But when it comes to manipulation and if you have to chop vegetables, we need to simulate that. We need to simulate that and then we need to simulate deformable objects, dough and everything in simulation to get the same material transfer to work for this. And then the second comparison are rewards, which are much easier to specify for locomotion. So if you"}],"speech_gaps":[],"frame":"../frames/v027/016.webp","frame_time":2553.14},{"title":"强化学习中奖励函数设计与模拟计算的挑战","segments":[{"id":179,"text":"programmatically write out a reward which asks you to track a certain velocity, it's complete. This is the full task specification and now you can just randomize the terrain and then you can get a general policy out of it. But that's not true for manipulation. So for manipulation, if you see, depending on, if you want to chop a vegetable and even if you had this simulated in full state of simulation,","zh":"程序化地写出一个要求你跟踪特定速度的奖励函数，这是完整的。这是完整的任务规范，现在你只需随机化地形，然后就可以从中得到一个通用策略。但这种情况并不适用于操作任务。因此，在操作任务中，如果你想要切蔬菜，即使你已经完整地模拟了所有状态，","start":2709.59,"end":2731.27},{"id":180,"text":"You would still need to come up with a reward which measures the size of each of the slices that are cut and so on. And that itself will depend on what exactly is it that you're trying to cook eventually. So that's one reward. And let's say you put in the work to write that reward. That only gets you one task. It doesn't get you the full generality of manipulation. So for example, if you want to stretch the dough or put flour on the dough, you need to come up with another reward. It's a very manual process. And even if you get one of this right, it will not scale to anything else.","zh":"你仍然需要设计一个奖励函数来衡量被切出的每一片的大小等等。而这个奖励函数本身将取决于你最终想要烹饪的具体内容。因此，这就是一个奖励函数。假设你投入了精力来编写这个奖励函数。它只能让你完成一个任务。它无法让你获得操作任务的全部通用性。例如，如果你想拉伸面团或在面团上撒面粉，你需要设计另一个奖励函数。这是一个非常手动的过程。即使你正确地设计了一个这样的奖励函数，它也无法扩展到其他任务。","start":2733.34,"end":2762.24},{"id":181,"text":"So everything I'll present from now on is speculative. So let's start talking about simulation. For some scenarios like deformable objects, it is true that we can simulate it, except that we cannot simulate it very fast. And then there are some other more complex interactions that we cannot simulate at all. But there's no obvious fundamental reason why we cannot simulate more complex scenarios as we get more compute.","zh":"因此，从现在开始我所呈现的一切都是推测性的。让我们开始谈论模拟。对于一些场景，例如可变形物体，我们确实可以进行模拟，只是我们无法快速地进行模拟。还有一些更复杂的交互，我们根本无法模拟。但没有明显的根本原因表明我们不能随着计算能力的提升而模拟更复杂的场景。","start":2763.69,"end":2791.43},{"id":182,"text":"If we bet on compute, then the hope is as compute progresses, simulation can progress and can give you progressively better results in the real world as we expand the scope of what simulation can do.","zh":"如果我们押注计算能力，那么希望是随着计算能力的进步，模拟能力也会进步，并且随着我们扩展模拟所能处理的范围，它会在现实世界中给出越来越好的结果。","start":2794.62,"end":2805.34},{"id":183,"text":"If we are to learn from the bitter lesson, then compute would be the right bet to take here, which is you just hope that simulation can improve over time. For those of you not familiar with the bitter lesson, it's a very short piece by Rich Sutton. I highly recommend everyone to read it. I just have the first line from it, which says that general methods that leverage compute are ultimately the most effective and by a large margin.","zh":"如果我们从苦涩的教训中学习，那么在这里采取计算能力的赌注是正确的选择，即你只是希望模拟能力能够随着时间推移而不断改进。对于那些不熟悉苦涩教训的人，它是一篇由Rich Sutton撰写的非常简短的文章。我强烈推荐每个人阅读它。我只引用了其中的第一句话，它说：利用计算能力的通用方法最终是最有效的，而且效果显著。","start":2806.88,"end":2832.02},{"id":184,"text":"Switching to the other topic of having a very general reward model, the most obvious thing that comes to mind is can we train a general large big model for general understanding of the world and somehow use that to define the rewards that we want to improve our policies. This could work, but RL as we know","zh":"转向另一个话题，即拥有一个非常通用的奖励模型，最明显的想法是，我们能否训练一个通用的大模型，以获得对世界的广泛理解，并以某种方式利用它来定义我们希望改进策略的奖励。这可能有效，但正如我们所知，强化学习","start":2834.47,"end":2856.67},{"id":185,"text":"has exploited weaknesses in the model if they exist. So when we do RLHF, if we continue tuning with RLHF, we see that the model goes completely out of distribution from what you would like it to do. Same with the DeepSeq paper. They find that if you don't use verifiable rewards or rule-based rewards like they do, at some point RL can start exploiting the rewards that you have defined for them.","zh":"会利用模型中可能存在的弱点。因此，当我们进行RLHF（基于人类反馈的强化学习）时，如果我们继续使用RLHF进行微调，我们会发现模型的行为完全偏离了我们希望它执行的任务。同样的情况也出现在DeepSeq论文中。他们发现，如果你不使用可验证的奖励或基于规则的奖励，如他们所做的那样，强化学习在某个时候可能会开始利用你为它们定义的奖励。","start":2857.19,"end":2880.17}],"notes":["本段讨论了在强化学习中设计奖励函数的挑战，特别是在操作任务中，需要为不同的子任务设计不同的奖励函数，这使得任务的通用性难以实现。例如，切菜和揉面需要不同的奖励函数，这表明手动设计奖励函数是一个繁琐且难以扩展的过程。","讲者提到，如果依赖计算能力（compute）来提升模拟效果，随着计算资源的增加，模拟的精度和范围可以逐步提升，从而在现实世界中获得更好的结果。这表明计算能力是推动模拟进步的关键因素。","讲者引用了Rich Sutton的‘苦涩教训’（bitter lesson），强调利用计算能力的通用方法是最有效的。这表明在强化学习中，计算资源的投入可以带来显著的性能提升。","讲者讨论了构建通用奖励模型的可能性，即通过训练一个具有世界理解能力的大型模型来定义奖励函数。然而，这种方法存在风险，因为强化学习可能会利用模型中的弱点，导致奖励函数被滥用。","讲者提到RLHF（强化学习与人类反馈）和DeepSeq论文中的研究，指出如果不使用可验证或基于规则的奖励函数，强化学习可能会偏离预期的行为，这表明奖励函数的设计需要谨慎。","讲者强调，奖励函数的设计和模拟计算的进展是强化学习中需要解决的关键问题，而计算能力的提升可能是解决这些问题的重要途径。"],"formulas":[],"uncertainties":["large big model"],"diagram":"none","start":2709.59,"end":2880.17,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2709.59,"text":"programmatically write out a reward which asks you to track a certain velocity, it's complete. This is the full task specification and now you can just randomize the terrain and then you can get a general policy out of it. But that's not true for manipulation. So for manipulation, if you see, depending on, if you want to chop a vegetable and even if you had this simulated in full state of simulation,"},{"start":2733.34,"text":"You would still need to come up with a reward which measures the size of each of the slices that are cut and so on. And that itself will depend on what exactly is it that you're trying to cook eventually. So that's one reward. And let's say you put in the work to write that reward. That only gets you one task. It doesn't get you the full generality of manipulation. So for example, if you want to stretch the dough or put flour on the dough, you need to come up with another reward. It's a very manual process. And even if you get one of this right, it will not scale to anything else."},{"start":2763.69,"text":"So everything I'll present from now on is speculative. So let's start talking about simulation. For some scenarios like deformable objects, it is true that we can simulate it, except that we cannot simulate it very fast. And then there are some other more complex interactions that we cannot simulate at all. But there's no obvious fundamental reason why we cannot simulate more complex scenarios as we get more compute."},{"start":2794.62,"text":"If we bet on compute, then the hope is as compute progresses, simulation can progress and can give you progressively better results in the real world as we expand the scope of what simulation can do."},{"start":2806.88,"text":"If we are to learn from the bitter lesson, then compute would be the right bet to take here, which is you just hope that simulation can improve over time. For those of you not familiar with the bitter lesson, it's a very short piece by Rich Sutton. I highly recommend everyone to read it. I just have the first line from it, which says that general methods that leverage compute are ultimately the most effective and by a large margin."},{"start":2834.47,"text":"Switching to the other topic of having a very general reward model, the most obvious thing that comes to mind is can we train a general large big model for general understanding of the world and somehow use that to define the rewards that we want to improve our policies. This could work, but RL as we know"},{"start":2857.19,"text":"has exploited weaknesses in the model if they exist. So when we do RLHF, if we continue tuning with RLHF, we see that the model goes completely out of distribution from what you would like it to do. Same with the DeepSeq paper. They find that if you don't use verifiable rewards or rule-based rewards like they do, at some point RL can start exploiting the rewards that you have defined for them."}],"speech_gaps":[],"frame":"../frames/v027/017.webp","frame_time":2721.59},{"title":"提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":186,"text":"So I was optimistic about simulation. Why am I optimistic about this general reward model, which also seems to be a very hard problem to solve? The reason I'm optimistic is because the absolute worst case is we get humans to label all the rewards for us. And humans are very scalable because we have billions of them. And then before I end this talk, I would like to just...","zh":"因此，我对模拟（simulation）持乐观态度。为什么我对这个看起来非常难以解决的一般奖励模型持乐观态度呢？我之所以乐观，是因为最坏的情况是我们可以让人类为我们标记所有的奖励。而人类是非常可扩展的，因为我们有数十亿的人。在我结束这次演讲之前，我想再……","start":2881.74,"end":2909.53},{"id":187,"text":"revisit how we approach the idea of robotics. So most of the definition that I've used during the course of the talk and most work in robot learning tries to approach robotics as achieving parity with human. The day we achieve that, it will be a civilization changing event. However, that will just be the first step in everything that we can achieve from robotics because the actuators that we make driven by electrical torque and","zh":"重新审视我们如何对待机器人这一概念。在本次演讲过程中，我所使用的大多数定义以及机器人学习领域的大多数工作，都试图将机器人视为与人类能力相媲美。一旦我们实现这一点，这将是一个改变文明的事件。然而，这仅仅是机器人所能实现的一切中的第一步，因为我们制造的执行器由电信号驱动，而不是碳基的，这使得它们有可能利用这些特性实现人类未曾设想或无法解决的能力。","start":2910.08,"end":2938.01},{"id":188,"text":"The computers which are based on silicon as opposed to carbon than what we have, it is possible that they can exploit all of that to achieve capabilities which humans have not thought of or cannot figure out how to do. So they could do things much faster, more efficiently or better or can be much more agile and extra than what humans are. And then one system that we know which has already done it is AlphaGo, where the key was to use a sparse reward.","zh":"基于硅而非碳的计算机，它们有可能利用这些特性实现人类未曾设想或无法完成的能力。因此，它们可以更快、更高效或更好地完成任务，或者比人类更加敏捷和出色。我们已经知道的一个系统是AlphaGo，其中关键在于使用稀疏奖励（sparse reward）。然后通过大量的搜索或强化学习来让系统发现人类无法想象的新行为。因此，这提出了一个更普遍或后续的问题：我们能否让机器人不仅匹配人类的能力，还能超越人类的能力？","start":2939.48,"end":2964.36},{"id":189,"text":"and then lots and lots of search or reinforcement learning to get it to discover new behaviors, which are beyond what humans could think. So this is, I think, a more general or a follow-up question. Can we get robots to not just match human capability, but exceed what humans can do?","zh":"因此，这提出了一个更普遍或后续的问题：我们能否让机器人不仅匹配人类的能力，还能超越人类的能力？","start":2964.89,"end":2982.47}],"notes":["本段讨论了机器人学习中对人类能力的匹配与超越。讲者指出，当前机器人学习的目标是实现与人类能力的对等，这将是一个文明变革的事件。然而，这只是机器人所能实现的众多可能性中的第一步，因为未来的机器人可能具备超越人类的能力。","讲者提到，机器人系统可以通过使用稀疏奖励和大量搜索或强化学习来发现人类无法想象的新行为。这表明，机器人学习不仅关注于模仿人类，还致力于探索新的行为模式。","讲者强调，机器人系统可能利用硅基计算机而非碳基生物的特性，实现人类未曾设想或无法完成的任务。这暗示了机器人在速度、效率、敏捷性等方面可能超越人类。","讲者以AlphaGo为例，说明稀疏奖励机制在机器人学习中的重要性。AlphaGo的成功表明，通过结合稀疏奖励和强化学习，可以实现超越人类水平的性能。","讲者最后提出一个更广泛的问题：是否可以让机器人不仅匹配人类能力，还能超越人类？这表明，机器人学习的目标不仅是模仿，而是探索新的可能性。","讲者认为，人类的可扩展性（如拥有数十亿人）使得通过人类标注奖励成为一种可行的方案，这为机器人学习提供了潜在的解决方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2881.74,"end":2982.47,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":2881.74,"text":"So I was optimistic about simulation. Why am I optimistic about this general reward model, which also seems to be a very hard problem to solve? The reason I'm optimistic is because the absolute worst case is we get humans to label all the rewards for us. And humans are very scalable because we have billions of them. And then before I end this talk, I would like to just..."},{"start":2910.08,"text":"revisit how we approach the idea of robotics. So most of the definition that I've used during the course of the talk and most work in robot learning tries to approach robotics as achieving parity with human. The day we achieve that, it will be a civilization changing event. However, that will just be the first step in everything that we can achieve from robotics because the actuators that we make driven by electrical torque and"},{"start":2939.48,"text":"The computers which are based on silicon as opposed to carbon than what we have, it is possible that they can exploit all of that to achieve capabilities which humans have not thought of or cannot figure out how to do. So they could do things much faster, more efficiently or better or can be much more agile and extra than what humans are. And then one system that we know which has already done it is AlphaGo, where the key was to use a sparse reward."},{"start":2964.89,"text":"and then lots and lots of search or reinforcement learning to get it to discover new behaviors, which are beyond what humans could think. So this is, I think, a more general or a follow-up question. Can we get robots to not just match human capability, but exceed what humans can do?"}],"speech_gaps":[],"frame":"../frames/v027/018.webp","frame_time":2893.74}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v027.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
