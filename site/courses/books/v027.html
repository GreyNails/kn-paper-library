</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 17 提升机器人智能（Advancing Robot Intelligence） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v027.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v027","title":"Lecture 17 提升机器人智能（Advancing Robot Intelligence）","course":"强化学习","pages":[{"title":"强化学习在机器人智能中的应用","segments":[{"id":0,"text":"Today, I'll talk about advancing robot intelligence with reinforcement learning. And before I zoom into robotics or reinforcement learning, I'll take a step back. And I first contrast reinforcement learning with imitation learning. So one thing to note here is that","zh":"今天，我将谈论如何利用强化学习来提升机器人智能。在深入探讨机器人或强化学习之前，我先退一步。首先，我将对比强化学习与模仿学习。需要注意的一点是","start":5.2,"end":26.95},{"id":1,"text":"I'm going to compare imitation learning that actually works with reinforcement learning that actually works. That doesn't mean that there don't exist reinforcement learning algorithms which don't follow these characteristics, but these are the characteristics of the ones that have been the most successful at actually solving extremely hard problems.","zh":"我将比较那些真正有效的模仿学习与那些真正有效的强化学习。这并不意味着不存在不具有这些特征的强化学习算法，但这些是那些在实际解决极其困难的问题上取得最大成功的特点。","start":27.68,"end":44.28},{"id":2,"text":"So for imitation learning, it is widely used for pre-training vision language models. It's also used for video generation, image segmentation. So the first two are probably more popular. For image segmentation, you get an image and it will segment out different parts of the image. The best models that we have today for these are trained using some form of imitation learning. And reinforcement learning, the places where it has delivered the best results, one is game playing. So for example, the game of Go.","zh":"对于模仿学习，它被广泛用于预训练视觉语言模型。它也被用于视频生成、图像分割。前两者可能更受欢迎。对于图像分割，你输入一张图像，它会分割出图像的不同部分。我们目前在这些领域最好的模型是通过某种形式的模仿学习训练得到的。而强化学习在取得最佳成果的领域之一是游戏。例如，围棋游戏。","start":45.58,"end":73.78},{"id":3,"text":"also games in simulation. It has also delivered results in reasoning for large language models, which is significantly beyond what the imitation learning pre-training could achieve. And the last one is robotics, which I will get into the rest of the talk.","zh":"还有在模拟环境中的游戏。它还在大型语言模型的推理方面取得了成果，这远远超出了模仿学习预训练所能达到的水平。最后一个领域是机器人学，我将在接下来的演讲中深入探讨。","start":74.62,"end":89.24},{"id":4,"text":"In imitation learning, you take your data set, you clean it up, you get the good data set, and then you use that to train your model. But in reinforcement learning, every data point that is generated during the policy rollout is fair game. So you can use all of that to improve and update your policy. And that actually is one of the things that makes reinforcement learning quite powerful. So you learn from not just the positive, but also the negative data, which kind of gives you very precise behaviors that you want.","zh":"在模仿学习中，你获取你的数据集，清理它，得到一个好的数据集，然后用它来训练你的模型。但在强化学习中，政策展开过程中生成的每一个数据点都可以被使用。因此，你可以利用所有这些数据来改进和更新你的策略。而这实际上是使强化学习非常强大的原因之一。因此，你不仅从正面数据中学习，还从负面数据中学习，这让你获得非常精确的行为。","start":90.6,"end":116.24},{"id":5,"text":"And typically imitation learning has given us generalists. So it gives you this one single model that can do a bunch of things. Reinforcement learning either gives you specialists or it helps you specialize pre-trained general models. So this contrast is just to give you a sense of the difference between the two. That is not to say that one is strictly better than the other. So even for the game of Go, there were...","zh":"通常，模仿学习为我们提供了通用型模型。因此，它会给你一个单一的模型，能够完成许多任务。强化学习要么给你专门化的模型，要么帮助你对预先训练好的通用模型进行专门化。这种对比只是为了让你了解两者之间的差异。这并不是说其中一个严格优于另一个。例如，即使是围棋这样的游戏，也存在...","start":117.66,"end":146.56},{"id":6,"text":"And typically imitation learning has given us generalists. So it gives you this one single model that can do a bunch of things. Reinforcement learning either gives you specialists or it helps you specialize pre-trained general models. So this contrast is just to give you a sense of the difference between the two. That is not to say that one is strictly better than the other. So even for the game of Go, there were...","zh":"通常，模仿学习为我们提供了通用型模型。因此，它会给你一个单一的模型，能够完成许多任务。强化学习要么给你专门化的模型，要么帮助你对预先训练好的通用模型进行专门化。这种对比只是为了让你了解两者之间的差异。这并不是说其中一个严格优于另一个。例如，即使是围棋这样的游戏，也存在...","start":148.21,"end":172.7}],"notes":["本段讲解了模仿学习与强化学习在数据使用上的关键区别。模仿学习依赖于由人类或其他非最终策略来源收集的策略数据，而强化学习则利用策略执行过程中生成的所有数据点来改进策略。这种差异使得强化学习能够从正负数据中学习，从而获得更精确的行为。","模仿学习通常产生通用模型，能够执行多种任务，而强化学习则倾向于生成专家模型或帮助对预训练通用模型进行专业化。这种对比并非意味着一种方法优于另一种，而是为了说明两者之间的差异。","强化学习的这种能力使其在解决复杂问题时表现出色，例如在游戏如围棋中取得显著成果。然而，模仿学习在视觉语言模型预训练和图像分割等任务中仍然具有重要地位。","在强化学习中，策略执行过程中生成的所有数据点都可以用于改进策略，这使得强化学习在训练过程中能够充分利用所有信息，从而提升模型性能。","模仿学习的数据集需要经过清理以获得高质量的数据，而强化学习则不需要这一过程，因为它可以利用所有数据点进行训练。","强化学习的这种特性使其在处理复杂任务时具有优势，因为它能够从正负数据中学习，从而获得更精确的行为。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":172.7,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.2,"text":"Today, I'll talk about advancing robot intelligence with reinforcement learning. And before I zoom into robotics or reinforcement learning, I'll take a step back. And I first contrast reinforcement learning with imitation learning. So one thing to note here is that"},{"start":27.68,"text":"I'm going to compare imitation learning that actually works with reinforcement learning that actually works. That doesn't mean that there don't exist reinforcement learning algorithms which don't follow these characteristics, but these are the characteristics of the ones that have been the most successful at actually solving extremely hard problems."},{"start":45.58,"text":"So for imitation learning, it is widely used for pre-training vision language models. It's also used for video generation, image segmentation. So the first two are probably more popular. For image segmentation, you get an image and it will segment out different parts of the image. The best models that we have today for these are trained using some form of imitation learning. And reinforcement learning, the places where it has delivered the best results, one is game playing. So for example, the game of Go."},{"start":74.62,"text":"also games in simulation. It has also delivered results in reasoning for large language models, which is significantly beyond what the imitation learning pre-training could achieve. And the last one is robotics, which I will get into the rest of the talk."},{"start":90.6,"text":"So the key characteristics that successful imitation learning has used is that it relies on policy data. So this data is collected or generated by humans or collected in sources which have nothing to do with the final policy that you're improving. In contrast, the reinforcement learning that has succeeded is typically on policy. So the policy that you want to improve is the one you roll out to generate the distribution of the data set and then you somehow use to improve your policy."},{"start":117.66,"text":"In imitation learning, you take your data set, you clean it up, you get the good data set, and then you use that to train your model. But in reinforcement learning, every data point that is generated during the policy rollout is fair game. So you can use all of that to improve and update your policy. And that actually is one of the things that makes reinforcement learning quite powerful. So you learn from not just the positive, but also the negative data, which kind of gives you very precise behaviors that you want."},{"start":148.21,"text":"And typically imitation learning has given us generalists. So it gives you this one single model that can do a bunch of things. Reinforcement learning either gives you specialists or it helps you specialize pre-trained general models. So this contrast is just to give you a sense of the difference between the two. That is not to say that one is strictly better than the other. So even for the game of Go, there were..."}],"speech_gaps":[],"frame":"../frames/v027/001.webp","frame_time":17.2},{"title":"强化学习在机器人智能中的应用","segments":[{"id":7,"text":"We use imitation learning for warm starting the reinforcement learning self-play or search. And same with language models. You use imitation learning to warm start your whole model and then you can get reasoning or whatever it is that you want to improve the performance on top of that. So now let's zoom into reinforcement learning.","zh":"我们使用模仿学习来对强化学习的自我对弈或搜索进行预热。同样适用于语言模型。你使用模仿学习来预热整个模型，然后可以在其基础上获得推理或其他你想要改进的性能。现在让我们深入探讨强化学习。","start":173.74,"end":194.9},{"id":8,"text":"And the first question is, what has it actually achieved? Qualitatively, what behaviors has it achieved, which is the only way to do those things? So for AlphaGo, it learned to... AlphaGo, it's a game of Go, and we have a system called AlphaGo, which can defeat the best Go player in the world. And what it has learned to do is to exceed what humans can do by figuring out innovative or new behaviors that humans have not seen before.","zh":"第一个问题是，它实际上取得了什么成果？定性地说，它实现了哪些行为，这是完成这些事情的唯一途径？例如，AlphaGo学会了……AlphaGo是一个围棋游戏，我们有一个名为AlphaGo的系统，它可以击败世界上最优秀的围棋选手。它学会做到的是，通过找出人类未曾见过的创新或新行为，超越人类的能力。","start":196.09,"end":223.67},{"id":9,"text":"Similarly, for reasoning in LLMs, it can go significantly beyond what you can achieve with just imitation learning. And it can give you results just significantly better than what you would get otherwise. And the key thing that it shows here is very coherent and precise reasoning over very long horizon tasks. So this is another characteristic that we know that reinforcement learning can give us. And the last thing is dexterity in robotics, which I'll get to soon. So if you look at all three of these,","zh":"同样，在LLMs中的推理方面，它能够显著超越仅通过模仿学习所能实现的水平。它可以给出的结果显著优于其他方式所能得到的结果。这里展示的关键点是非常连贯且精确的长周期任务推理。因此，这是我们知道强化学习可以赋予我们的另一个特性。最后一点是机器人中的灵巧性，我很快就会谈到。因此，如果你观察这三个方面，","start":225.34,"end":255.23},{"id":10,"text":"There's one question that what is common between all three of these, which lets us achieve the scale of results we do with reinforcement learning. So I would like to point out two things which let on-policy reinforcement learning shine in all three of these domains. The first is well-specified rewards. So for AlphaGo, the reward was a very sparse one. It was very clear if you won the game or not. You can look at the state of the word and you can define if you won the game or not.","zh":"有一个问题是，这三个方面之间有什么共同点，这使我们能够实现通过强化学习所取得的成果规模。因此，我想指出两个因素，使在策略强化学习在所有这三个领域中表现出色。第一个是明确的奖励。例如，对于AlphaGo，奖励是非常稀疏的。你赢了游戏与否非常明确。你可以查看游戏的状态，并可以定义你是否赢了游戏。","start":255.83,"end":284.55},{"id":11,"text":"Similarly, for reasoning and LLMs, if we look at this deep seek R and paper, they say that we use a rule based reward function, which is very clear to evaluate. And now, since it is rule based, you can automate it and you can get it very cleanly and clearly at scale.","zh":"同样，在推理和LLMs方面，如果我们查看DeepSeek R和论文，他们表示我们使用基于规则的奖励函数，这非常明确地进行评估。现在，由于它是基于规则的，你可以自动化处理，并且可以在大规模上非常清晰地实现。","start":285.68,"end":306.02},{"id":12,"text":"So with AlphaGo, since we know the rules of the games, we can put that game in simulation and now it scales beautifully with compute. So we can just throw compute at it. We can evaluate the policies and we can convert that compute to data, which we will then use reinforcement learning to improve the model.","zh":"因此，以AlphaGo为例，因为我们知道游戏的规则，我们可以将该游戏放入模拟环境中，现在它随着计算资源的增加而优雅地扩展。因此，我们只需投入更多的计算资源。我们可以评估策略，并将这些计算资源转化为数据，然后使用强化学习来改进模型。","start":306.72,"end":322.62},{"id":13,"text":"Similarly for reasoning and LLMs, you can just roll them out in a cluster and you can evaluate them using some form of an automatic reward function, making this an extremely scalable way of collecting data for reinforcement learning and also evaluating it and then improving it.","zh":"同样地，在推理和大语言模型（LLMs）中，你也可以在集群中运行它们，并通过某种形式的自动奖励函数来评估它们，这使得数据收集、评估和改进强化学习模型成为一种极其可扩展的方式。","start":323.89,"end":349.68}],"notes":["本段讨论了强化学习在多个领域中的应用，包括AlphaGo、语言模型推理和机器人灵巧性。强化学习通过明确的奖励机制和可扩展的计算能力，实现了这些领域的突破。","在AlphaGo的例子中，奖励机制非常明确，仅在游戏胜利时给予奖励，这种稀疏奖励机制使得模型能够专注于关键行为。对于语言模型，规则基础的奖励函数使得评估和自动化成为可能。","强化学习的可扩展性是其成功的关键因素之一。通过在模拟环境中运行策略，并将计算资源转化为数据，可以显著提升模型性能。","在语言模型推理中，通过集群部署和自动奖励函数，可以高效地收集和评估数据，从而实现大规模的强化学习训练。","这些成果的实现依赖于两个关键因素：明确的奖励机制和可扩展的计算能力。这两个因素共同作用，使得强化学习能够在不同领域取得显著进展。","这些成果的出现间隔大约为七到八年，表明强化学习在不同领域的应用具有持续的发展潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":173.74,"end":349.68,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":173.74,"text":"We use imitation learning for warm starting the reinforcement learning self-play or search. And same with language models. You use imitation learning to warm start your whole model and then you can get reasoning or whatever it is that you want to improve the performance on top of that. So now let's zoom into reinforcement learning."},{"start":196.09,"text":"And the first question is, what has it actually achieved? Qualitatively, what behaviors has it achieved, which is the only way to do those things? So for AlphaGo, it learned to... AlphaGo, it's a game of Go, and we have a system called AlphaGo, which can defeat the best Go player in the world. And what it has learned to do is to exceed what humans can do by figuring out innovative or new behaviors that humans have not seen before."},{"start":225.34,"text":"Similarly, for reasoning in LLMs, it can go significantly beyond what you can achieve with just imitation learning. And it can give you results just significantly better than what you would get otherwise. And the key thing that it shows here is very coherent and precise reasoning over very long horizon tasks. So this is another characteristic that we know that reinforcement learning can give us. And the last thing is dexterity in robotics, which I'll get to soon. So if you look at all three of these,"},{"start":255.83,"text":"There's one question that what is common between all three of these, which lets us achieve the scale of results we do with reinforcement learning. So I would like to point out two things which let on-policy reinforcement learning shine in all three of these domains. The first is well-specified rewards. So for AlphaGo, the reward was a very sparse one. It was very clear if you won the game or not. You can look at the state of the word and you can define if you won the game or not."},{"start":285.68,"text":"Similarly, for reasoning and LLMs, if we look at this deep seek R and paper, they say that we use a rule based reward function, which is very clear to evaluate. And now, since it is rule based, you can automate it and you can get it very cleanly and clearly at scale. And the second critical component is can we run these policies at scale?"},{"start":306.72,"text":"So with AlphaGo, since we know the rules of the games, we can put that game in simulation and now it scales beautifully with compute. So we can just throw compute at it. We can evaluate the policies and we can convert that compute to data, which we will then use reinforcement learning to improve the model."},{"start":323.89,"text":"Similarly for reasoning and LLMs, you can just roll them out in a cluster and you can evaluate them using some form of an automatic reward function, making this an extremely scalable way of collecting data for reinforcement learning and also evaluating it and then improving it. So I would argue that these two things are, all of these results happened seven to eight years, spaced out by seven to eight years."}],"speech_gaps":[],"frame":"../frames/v027/002.webp","frame_time":185.74},{"title":"强化学习中的模拟到现实迁移","segments":[{"id":14,"text":"And all of these successes still have these very two key ingredients which lets it succeed. So now I'll get into zoom into robotics with a focus on what these ingredients are. So if you zoom into robotics, the results I present are from three, four years ago. And the question is, what let us succeed in robotics with the same algorithm? So the closest approximation to getting these ingredients is to use simulation.","zh":"所有这些成功仍然具有这两个非常关键的要素，使它们能够取得成功。现在我将聚焦于机器人领域，深入探讨这些要素是什么。如果你深入机器人领域，我展示的结果来自三到四年前。问题是，是什么让我们能够用同样的算法在机器人领域取得成功？最接近获得这些要素的方法是使用模拟。","start":350.12,"end":380.1},{"id":15,"text":"So if we use simulation, we can programmatically calculate rewards because we have full state of the world. And we can also evaluate policies in scale because we have converted a physical problem to a digital problem, which now just will scale with compute. So this gets us to solving robotics in simulation. But that is not the same as solving robotics in the real world. So how do we get robotics in the real world? By just tackling the sim to real challenge. So how do we train policies in simulation?","zh":"如果我们使用模拟，我们可以程序化地计算奖励，因为我们拥有世界状态的完整信息。我们还可以在大规模上评估策略，因为我们把物理问题转换成了数字问题，现在只需依靠计算能力即可扩展。这使我们能够在模拟中解决机器人问题。但这并不等同于在现实世界中解决机器人问题。那么我们如何将机器人问题带到现实世界？只需解决模拟到现实的挑战。那么我们如何在模拟中训练策略？","start":380.8,"end":409.36},{"id":16,"text":"and then how do we move them to the real world? And that will be the focus of this talk.","zh":"然后我们如何将这些策略转移到现实世界？这将是本次演讲的重点。","start":409.94,"end":414.14},{"id":17,"text":"Before I get into how we solve the sim2real problem, let me convince you first that","zh":"在我深入讲解如何解决sim2real问题之前，首先我要说服你，这种方法实际上是可行的。","start":417.34,"end":424.18},{"id":18,"text":"this actually works. So I'll start with the results, real world results of robots","zh":"我将从机器人在现实世界中的实际结果开始。","start":424.18,"end":428.38},{"id":19,"text":"in the wild. So this is in Berkeley and the robot is, everything is real time on board.","zh":"这些结果是在伯克利取得的，机器人上的所有操作都是实时进行的。","start":429.9,"end":436.52},{"id":20,"text":"The robot is blind and is trying to get over these rocks and the feet get stuck.","zh":"机器人是盲目的，正在尝试越过这些岩石，但脚会被卡住。","start":436.52,"end":441.52},{"id":21,"text":"It keeps trying and then figures out that there's something and then continues to walk.","zh":"它不断尝试，然后发现有什么东西，然后继续行走。","start":441.64,"end":445.78},{"id":22,"text":"Here it has these staircases that it cannot see.","zh":"这里有一些台阶，它看不到。","start":447.8,"end":451.68},{"id":23,"text":"So it's a bit fumbly in these staircases, but it can still get them and doesn't fall.","zh":"所以在这些台阶上它有点笨拙，但它仍然可以走下并不会跌倒。","start":451.82,"end":456.1},{"id":24,"text":"We also tried this on this grass patch. Even if you had vision in this scenario, you would not see the ground underneath.","zh":"我们也在这个草地上尝试了这个场景。即使在这个场景中有视觉，你也不会看到地面上的情况。","start":459.54,"end":464.84},{"id":25,"text":"so you need like a certain level of robustness just to get through some of these and um here","zh":"所以你需要一定水平的鲁棒性才能通过这些地方，嗯，这里","start":464.84,"end":470.6},{"id":26,"text":"the ground is sloping to the left i think there's a big ditch on the left still manages to not just","zh":"地面向左倾斜，我想左边有一个大沟，仍然能够避免","start":470.6,"end":476.78},{"id":27,"text":"drift all the way and counter that this is a construction site in front of my house when i","zh":"完全漂移并抵消这个影响，这是在我家前面的一个建筑工地，当我","start":476.78,"end":482.14},{"id":28,"text":"was in berkeley and we were able to repeat this and it can reliably get down this very","zh":"在伯克利的时候，我们能够重复这个实验，并且它能够可靠地走下这个非常","start":482.14,"end":487.28},{"id":29,"text":"unstable ground and here it's slightly muddy so the feet get stuck once in a while but it","zh":"不稳定的地面，这里有点泥泞，所以脚偶尔会被卡住。","start":488.04,"end":493.24},{"id":30,"text":"knows how to like correct for it by applying more force and then just like getting out of it","zh":"知道如何通过施加更多力量来纠正它，然后就像摆脱它一样","start":493.24,"end":496.9},{"id":31,"text":"and uh this is just walking on uh sand","zh":"而这只是在沙子上行走","start":498.48,"end":502.68},{"id":32,"text":"so the important point here is that all of these results are from the exact exact same policy so","zh":"所以这里的重要观点是，所有这些结果都来自于完全相同的策略","start":504.7,"end":510.26},{"id":33,"text":"the exact same weights um deployed zero shot in the real world without any tuning or specific","zh":"完全相同的权重，直接在现实世界中零样本部署，没有任何调优或与这些地形相关的任何改进","start":510.26,"end":516.42},{"id":34,"text":"improvement related to any of these terrains and the question is how do we get it","zh":"问题是，我们如何做到这一点","start":517.64,"end":522.88},{"id":35,"text":"So, that is the focus of this work, this was published in RSS in 2020.","zh":"因此，这就是这项工作的重点，这项工作发表于2020年的RSS会议","start":523.78,"end":527.82}],"notes":["本段主要讨论了如何将模拟环境中训练的策略迁移到现实世界中的机器人任务。讲者强调，尽管模拟环境和现实世界存在差异，但通过使用相同的策略，机器人仍然能够在多种复杂地形中可靠地完成任务。"],"formulas":[],"uncertainties":["the ground is sloping to the left i think there's a big ditch on the left still manages to not just","drift all the way and counter that this is a construction site in front of my house when i","was in berkeley and we were able to repeat this and it can reliably get down this very","unstable ground and here it's slightly muddy so the feet get stuck once in a while but it","knows how to like correct for it by applying more force and then just like getting out of it","and uh this is just walking on uh sand","so the important point here is that all of these results are from the exact exact same policy so","the exact same weights um deployed zero shot in the real world without any tuning or specific","improvement related to any of these terrains and the question is how do we get it"],"diagram":"none","start":350.12,"end":527.82,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":350.12,"text":"And all of these successes still have these very two key ingredients which lets it succeed. So now I'll get into zoom into robotics with a focus on what these ingredients are. So if you zoom into robotics, the results I present are from three, four years ago. And the question is, what let us succeed in robotics with the same algorithm? So the closest approximation to getting these ingredients is to use simulation."},{"start":380.8,"text":"So if we use simulation, we can programmatically calculate rewards because we have full state of the world. And we can also evaluate policies in scale because we have converted a physical problem to a digital problem, which now just will scale with compute. So this gets us to solving robotics in simulation. But that is not the same as solving robotics in the real world. So how do we get robotics in the real world? By just tackling the sim to real challenge. So how do we train policies in simulation?"},{"start":409.94,"text":"and then how do we move them to the real world? And that will be the focus of this talk."},{"start":417.34,"text":"Before I get into how we solve the sim2real problem, let me convince you first that"},{"start":424.18,"text":"this actually works. So I'll start with the results, real world results of robots"},{"start":429.9,"text":"in the wild. So this is in Berkeley and the robot is, everything is real time on board."},{"start":436.52,"text":"The robot is blind and is trying to get over these rocks and the feet get stuck."},{"start":441.64,"text":"It keeps trying and then figures out that there's something and then continues to walk."},{"start":447.8,"text":"Here it has these staircases that it cannot see."},{"start":451.82,"text":"So it's a bit fumbly in these staircases, but it can still get them and doesn't fall."},{"start":459.54,"text":"We also tried this on this grass patch. Even if you had vision in this scenario, you would not see the ground underneath."},{"start":464.84,"text":"so you need like a certain level of robustness just to get through some of these and um here"},{"start":470.6,"text":"the ground is sloping to the left i think there's a big ditch on the left still manages to not just"},{"start":476.78,"text":"drift all the way and counter that this is a construction site in front of my house when i"},{"start":482.14,"text":"was in berkeley and we were able to repeat this and it can reliably get down this very"},{"start":488.04,"text":"unstable ground and here it's slightly muddy so the feet get stuck once in a while but it"},{"start":493.24,"text":"knows how to like correct for it by applying more force and then just like getting out of it"},{"start":498.48,"text":"and uh this is just walking on uh sand"},{"start":504.7,"text":"so the important point here is that all of these results are from the exact exact same policy so"},{"start":510.26,"text":"the exact same weights um deployed zero shot in the real world without any tuning or specific"},{"start":517.64,"text":"improvement related to any of these terrains and the question is how do we get it"},{"start":523.78,"text":"So, that is the focus of this work, this was published in RSS in 2020."}],"speech_gaps":[],"frame":"../frames/v027/003.webp","frame_time":362.12},{"title":"模拟中训练机器人行走","segments":[{"id":36,"text":"So let's start by learning to walk in simulation. So the idea is simple. Let's just pretend that this simulation is the real world and everything we can access is fair game. So we want to train a neural network. That's your base policy. It will take an action in simulation. Simulation will simulate one tick of the real world. And then it will give you the updated state of the simulation, which the policy can consume and then it can walk.","zh":"那么，我们首先从在模拟中学习行走开始。想法很简单。我们只需假设这个模拟就是真实世界，我们能够访问的一切都是可行的。因此，我们想要训练一个神经网络。这是你的基础策略。它会在模拟中采取一个动作。模拟会模拟真实世界的一个时间步，并给出更新后的模拟状态，策略可以利用这个状态，然后开始行走。","start":529.84,"end":552.42},{"id":37,"text":"So this would be a very narrow policy that can walk in one scenario and maybe we can deploy it in the real world by tuning some parameters of the physics. But this is not good enough because we actually don't want a single policy. We want a generalist policy that can walk in all of these scenarios. So we will randomize all of these parameters in simulation. And the important part is we will let the policy have access to all of these parameters.","zh":"因此，这将是一个非常狭窄的策略，只能在一个场景中行走，也许我们可以通过调整物理参数来在真实世界中部署它。但这还不够好，因为我们实际上不希望只有一个策略。我们想要一个通用的策略，能够在所有这些场景中行走。因此，我们在模拟中会随机化所有这些参数，并且重要的部分是，我们会让策略能够访问所有这些参数。","start":553.81,"end":582.37},{"id":38,"text":"So now when we train this policy, it can walk not just for any specific value of mass or friction. It would have seen a huge range of it and it will know how to walk accordingly. So it's not oblivious or blind to the environment. It's actually aware of what it's dealing with. And for the purposes of this talk, we'll call this compressed vector extrinsics.","zh":"现在，当我们训练这个策略时，它不仅可以在质量或摩擦力的任何特定值下行走，它还会看到一个巨大的范围，并且知道如何相应地行走。因此，它并不是对环境无知或盲目的，它实际上了解自己所面对的环境。为了本次演讲的目的，我们将称这个压缩向量为外在参数。","start":583.52,"end":601.04},{"id":39,"text":"And then the reward function we use is to track a certain target velocity and then certain other set of reward functions which minimize work and ground impact. We'll train this whole system end-to-end with PPO. It takes about a billion samples to train it in this simulation. This is Razem. And once we have this, now we can think about how to deploy it. But before that, let's maybe zoom into the reward function that we have. So we have 10 different reward functions. This is not very elegant.","zh":"然后，我们使用的奖励函数是跟踪某个目标速度，以及某些其他一组奖励函数，这些函数最小化工作量和地面冲击。我们将使用PPO对整个系统进行端到端训练。在该模拟中训练它大约需要十亿个样本。这是Razem。一旦我们有了这个，现在我们可以思考如何部署它。但在那之前，也许我们先仔细看一下我们使用的奖励函数。我们有10个不同的奖励函数。这并不十分优雅。","start":602.7,"end":631.64},{"id":40,"text":"But we try to be as principled as we can.","zh":"但我们尽量做到尽可能有原则性。","start":632.12,"end":634.0},{"id":41,"text":"So the forward and the latter.","zh":"所以是前向和后者。","start":634.08,"end":635.42},{"id":42,"text":"So the first reward function is just specify the task.","zh":"所以第一个奖励函数只是指定任务。","start":635.56,"end":637.78},{"id":43,"text":"So what is the task that we're trying to solve?","zh":"那么我们试图解决的任务是什么？","start":637.88,"end":639.54},{"id":44,"text":"And then there are a bunch of reward functions which minimize energetics.","zh":"然后还有一系列奖励函数，它们最小化能耗。","start":639.96,"end":643.04},{"id":45,"text":"And then the last one is like stability and minimizing hardware damage.","zh":"然后最后一个因素是稳定性和最小化硬件损坏。","start":643.96,"end":647.32},{"id":46,"text":"Because in simulation, there's no concept of hardware damage.","zh":"因为在模拟中，没有硬件损坏的概念。","start":647.42,"end":650.02},{"id":47,"text":"So we need to inject all of those biases so that it can learn something which can actually transfer to the real world.","zh":"因此我们需要注入这些偏差，以便它能够学习到可以真正转移到现实世界的东西。","start":650.18,"end":655.68},{"id":48,"text":"So coming back to how can we deploy it?","zh":"所以回到问题，我们如何部署它？","start":658.84,"end":660.88},{"id":49,"text":"well this is this vector is unknown in the real world and even if i estimated that in my living","zh":"嗯，这个向量在现实世界中是未知的，即使我在我的客厅里估计了它","start":660.88,"end":667.14},{"id":50,"text":"room uh it would still um not be enough because the moment i get to something which is not my","zh":"它仍然可能不够，因为一旦我到了不是我的","start":667.14,"end":673.86},{"id":51,"text":"living room let's say sand or mulch or any of those it would fail to work and i have to retune","zh":"客厅的地方，比如沙子或木屑之类的，它就会失效，我必须重新调整","start":673.86,"end":677.76},{"id":52,"text":"it again so the key idea that we will use here is we will estimate this online in fractions of a","zh":"它再次，因此我们在这里将使用的关键思想是我们将在运行时以几分之一秒的时间估计它","start":677.76,"end":686.7},{"id":53,"text":"second at runtime and the reason why we can estimate it at all in the first place is by so","zh":"我们之所以能够首先估计它，是因为我们采用了一种特定的方式","start":686.7,"end":696.18},{"id":54,"text":"the way we will estimate the signal that will be used to estimate it is the observation history so","zh":"我们将用来估计该信号的是观察历史，即执行的一系列命令以及实际发出的命令，我们将使用","start":696.18,"end":702.22},{"id":55,"text":"the series of commands that are executed and the commands that were actually issued we will use","zh":"这些命令序列来估计它","start":702.22,"end":707.36}],"notes":["本段讲授了如何在模拟环境中训练机器人行走，并强调了在真实世界部署时面临的挑战。讲者指出，虽然在模拟中可以训练一个能够适应多种参数的通用策略，但在真实世界中，由于环境参数未知，需要在线估计这些参数以实现有效部署。","讲者提到，为了使策略在真实世界中有效，必须在模拟中引入各种偏置，以确保策略能够泛化到不同的环境。这些偏置包括能量最小化、稳定性以及硬件损伤的最小化。","在部署策略时，讲者强调了在线估计环境参数的重要性。通过观察历史和实际执行的命令，可以在运行时实时估计这些参数，从而避免重新调参。","讲者指出，即使在模拟中估计了这些参数，当机器人进入新的环境（如沙地或木屑）时，仍然可能失败，因此需要在线估计以适应变化。","讲者提到，这种在线估计方法能够在运行时以毫秒级的速度进行，这使得策略能够动态适应不同的环境条件。","讲者强调，这种策略的泛化能力依赖于在模拟中训练时对各种环境参数的广泛暴露，从而使得策略能够感知并适应不同的环境条件。"],"formulas":[],"uncertainties":[],"diagram":"none","start":529.84,"end":707.36,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":529.84,"text":"So let's start by learning to walk in simulation. So the idea is simple. Let's just pretend that this simulation is the real world and everything we can access is fair game. So we want to train a neural network. That's your base policy. It will take an action in simulation. Simulation will simulate one tick of the real world. And then it will give you the updated state of the simulation, which the policy can consume and then it can walk."},{"start":553.81,"text":"So this would be a very narrow policy that can walk in one scenario and maybe we can deploy it in the real world by tuning some parameters of the physics. But this is not good enough because we actually don't want a single policy. We want a generalist policy that can walk in all of these scenarios. So we will randomize all of these parameters in simulation. And the important part is we will let the policy have access to all of these parameters."},{"start":583.52,"text":"So now when we train this policy, it can walk not just for any specific value of mass or friction. It would have seen a huge range of it and it will know how to walk accordingly. So it's not oblivious or blind to the environment. It's actually aware of what it's dealing with. And for the purposes of this talk, we'll call this compressed vector extrinsics."},{"start":602.7,"text":"And then the reward function we use is to track a certain target velocity and then certain other set of reward functions which minimize work and ground impact. We'll train this whole system end-to-end with PPO. It takes about a billion samples to train it in this simulation. This is Razem. And once we have this, now we can think about how to deploy it. But before that, let's maybe zoom into the reward function that we have. So we have 10 different reward functions. This is not very elegant."},{"start":632.12,"text":"But we try to be as principled as we can."},{"start":634.08,"text":"So the forward and the latter."},{"start":635.56,"text":"So the first reward function is just specify the task."},{"start":637.88,"text":"So what is the task that we're trying to solve?"},{"start":639.96,"text":"And then there are a bunch of reward functions which minimize energetics."},{"start":643.96,"text":"And then the last one is like stability and minimizing hardware damage."},{"start":647.42,"text":"Because in simulation, there's no concept of hardware damage."},{"start":650.18,"text":"So we need to inject all of those biases so that it can learn something which can actually transfer to the real world."},{"start":658.84,"text":"So coming back to how can we deploy it?"},{"start":660.88,"text":"well this is this vector is unknown in the real world and even if i estimated that in my living"},{"start":667.14,"text":"room uh it would still um not be enough because the moment i get to something which is not my"},{"start":673.86,"text":"living room let's say sand or mulch or any of those it would fail to work and i have to retune"},{"start":677.76,"text":"it again so the key idea that we will use here is we will estimate this online in fractions of a"},{"start":686.7,"text":"second at runtime and the reason why we can estimate it at all in the first place is by so"},{"start":696.18,"text":"the way we will estimate the signal that will be used to estimate it is the observation history so"},{"start":702.22,"text":"the series of commands that are executed and the commands that were actually issued we will use"}],"speech_gaps":[],"frame":"../frames/v027/004.webp","frame_time":541.84},{"title":"利用历史信号估计外在因素","segments":[{"id":56,"text":"that as our input into the system to estimate this online and the reason this signal has the right","zh":"将这个信号作为系统输入，以在线估计这些外在因素，这种信号具有我们关心的正确性","start":707.36,"end":715.3},{"id":57,"text":"thing that we care about is let's say that you give a command to walk and then one of your leg","zh":"比如说，当你发出行走的指令后，其中一条腿比预期的滑动得更多。你发出的信号与实际执行的指令之间的差异会告诉你你实际上滑动了","start":715.3,"end":719.16},{"id":58,"text":"slips more than what you expected it to. The discrepancy between your signal and what you","zh":"这种差异会告诉你你实际上滑动了。这不是有意为之，而是向前滑动了。因此，想法是利用这个信号的历史来估计这些外在因素","start":719.16,"end":724.9},{"id":59,"text":"actually commanded will tell you that you actually slipped. This was not intentional, you slipped","zh":"然后，实际运动与测量运动之间的差异就是让我们在运行时以几分之一秒的时间在线估计这些外在因素的关键","start":724.9,"end":728.44},{"id":60,"text":"forward. So the idea is to use the history of this signal to estimate what these extrinsics are.","zh":"因此，下一个问题是，我们如何训练这个模型，以便将其部署到现实世界中？","start":728.44,"end":734.22},{"id":61,"text":"And then this discrepancy between the actual movement and the measured movement is what will","zh":"然后，实际运动与测量运动之间的差异就是让我们在运行时以几分之一秒的时间在线估计这些外在因素的关键","start":734.62,"end":739.9},{"id":62,"text":"what will let us estimate this online at runtime in fractions of a second.","zh":"然后，实际运动与测量运动之间的差异就是让我们在运行时以几分之一秒的时间在线估计这些外在因素的关键","start":739.9,"end":743.82},{"id":63,"text":"So the next question is, how do we train this model so that we can deploy it in the real world?","zh":"因此，下一个问题是，我们如何训练这个模型，以便将其部署到现实世界中？","start":745.24,"end":749.86},{"id":64,"text":"The idea is simple. We'll just go back to simulation. And in simulation, we have the ground truth and we also have the history. So we will use Dagger in which you roll out the student policy to generate the data distribution. And then you use the teacher to supervise every single point of the student policy. We will use that to train the student model, which is now using this history of observations.","zh":"这个想法很简单。我们将回到仿真中。在仿真中，我们有真实值，也有历史数据。因此，我们将使用Dagger方法，通过学生策略展开生成数据分布。然后，使用教师策略监督学生策略的每一个点。我们将利用这些数据来训练学生模型，该模型现在使用了这些观测历史。","start":752.09,"end":776.09},{"id":65,"text":"to continuously estimate what this extrinsic Z is, which will then be fed into the base policy, which is trained with reinforcement learning and we copied over the weights. And then we can now deploy this online. So one thing to note here is...","zh":"为了持续估计这个外在因素Z，然后将其输入到基础策略中，该策略是通过强化学习训练的，并且我们已经复制了权重。然后，我们现在可以在线部署这个系统。需要注意的一点是……","start":777.21,"end":792.48},{"id":66,"text":"The base policy runs at 100 hertz and the adaptation module, which is the one that estimates this extrinsics, that only runs at 10 hertz. And this is not by choice. It's because of whatever compute was available on board. And we see that the performance doesn't drop. So this was not accounted for during training. So in training, we train everything at 100 hertz in lockstep. And once we deploy it, we see that this can only run at 10 hertz and this runs at 100 hertz. And that is good enough to get the results that we want.","zh":"基础策略以100赫兹运行，而用于估计这些外在因素的适应模块，仅以10赫兹运行。这并不是出于选择，而是因为板载计算资源的限制。我们发现性能并没有下降。因此，在训练过程中并未考虑到这一点。在训练时，我们以100赫兹同步训练所有内容。一旦部署，我们发现该模块只能以10赫兹运行，而基础策略以100赫兹运行。这已经足够实现我们想要的结果。","start":792.92,"end":819.84},{"id":67,"text":"Let's start with evaluating at indoors. This is my living room and I'll pour some oil in it. This is a plastic tarp. I think that is olive oil. This is a while ago. So this is a plastic tarp on which I'll evaluate it. And then the robot's feet also have plastic covered on top of it, partially to make it challenging, but also to protect the feet of the robot. And it slips a bit here.","zh":"我们首先在室内环境中进行评估。这是我的客厅，我将在其中倒入一些油。这是一个塑料防水布。我认为这是橄榄油。这是很久以前的事情了。因此，我将在该塑料防水布上进行评估。同时，机器人的脚部也覆盖了塑料，部分是为了增加挑战性，但也为了保护机器人的脚部。这里会有一些打滑。","start":821.87,"end":849.27},{"id":68,"text":"But it continues to march forward without an issue. You can slow it down and see. This is where it starts slipping. And it seems to maintain balance and not flip over. Similarly here, I'm throwing a 5 kg payload on the robot. And it seems to be doing fine. Just to be clear, this robot is 12 kg. 5 kg is roughly half the weight of the robot. I can make this a bit slower.","zh":"但它仍然能够继续前进而没有问题。你可以放慢速度观察。这是它开始打滑的地方。它似乎能够保持平衡，不会翻倒。同样在这里，我向机器人上放置了一个5公斤的负载。它似乎表现良好。为了明确说明，这个机器人重12公斤，5公斤大约是它重量的一半。我可以将速度放慢一些。","start":850.41,"end":878.68}],"notes":["本段讲解了如何利用系统信号的历史数据来估计外在因素（extrinsics），并指出信号与实际命令之间的差异可以用来检测机器人是否发生滑动。这种差异在实时运行中可以用于估计外在因素，从而提升机器人的适应能力。","接下来讨论了如何训练模型以部署到现实世界中，提出使用模拟环境进行训练，并结合Dagger算法，通过教师监督学生策略的每个点来训练模型。训练过程中使用历史观测数据，以提高模型的适应性。","在部署时，基础策略以100赫兹运行，而适应模块以10赫兹运行，这是由于计算资源的限制。尽管如此，性能并未下降，说明这种运行频率的差异在实际应用中是可行的。","最后，通过在室内环境中进行测试，展示了机器人在滑动和负载增加情况下的表现。测试环境包括塑料油布和塑料覆盖的脚部，以增加挑战性，同时保护机器人。测试结果表明机器人能够保持平衡并继续前进。","整个过程强调了在实际部署中，如何利用历史信号和实时反馈来调整模型，以适应不同的环境条件，从而提升机器人的智能水平。","通过这些测试，验证了模型在不同条件下的鲁棒性，为实际应用提供了支持。"],"formulas":[],"uncertainties":[],"diagram":"none","start":707.36,"end":878.68,"asr_flags":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":707.36,"text":"that as our input into the system to estimate this online and the reason this signal has the right"},{"start":715.3,"text":"thing that we care about is let's say that you give a command to walk and then one of your leg"},{"start":719.16,"text":"slips more than what you expected it to. The discrepancy between your signal and what you"},{"start":724.9,"text":"actually commanded will tell you that you actually slipped. This was not intentional, you slipped"},{"start":728.44,"text":"forward. So the idea is to use the history of this signal to estimate what these extrinsics are."},{"start":734.62,"text":"And then this discrepancy between the actual movement and the measured movement is what will"},{"start":739.9,"text":"what will let us estimate this online at runtime in fractions of a second."},{"start":745.24,"text":"So the next question is, how do we train this model so that we can deploy it in the real world?"},{"start":752.09,"text":"The idea is simple. We'll just go back to simulation. And in simulation, we have the ground truth and we also have the history. So we will use Dagger in which you roll out the student policy to generate the data distribution. And then you use the teacher to supervise every single point of the student policy. We will use that to train the student model, which is now using this history of observations."},{"start":777.21,"text":"to continuously estimate what this extrinsic Z is, which will then be fed into the base policy, which is trained with reinforcement learning and we copied over the weights. And then we can now deploy this online. So one thing to note here is..."},{"start":792.92,"text":"The base policy runs at 100 hertz and the adaptation module, which is the one that estimates this extrinsics, that only runs at 10 hertz. And this is not by choice. It's because of whatever compute was available on board. And we see that the performance doesn't drop. So this was not accounted for during training. So in training, we train everything at 100 hertz in lockstep. And once we deploy it, we see that this can only run at 10 hertz and this runs at 100 hertz. And that is good enough to get the results that we want."},{"start":821.87,"text":"Let's start with evaluating at indoors. This is my living room and I'll pour some oil in it. This is a plastic tarp. I think that is olive oil. This is a while ago. So this is a plastic tarp on which I'll evaluate it. And then the robot's feet also have plastic covered on top of it, partially to make it challenging, but also to protect the feet of the robot. And it slips a bit here."},{"start":850.41,"text":"But it continues to march forward without an issue. You can slow it down and see. This is where it starts slipping. And it seems to maintain balance and not flip over. Similarly here, I'm throwing a 5 kg payload on the robot. And it seems to be doing fine. Just to be clear, this robot is 12 kg. 5 kg is roughly half the weight of the robot. I can make this a bit slower."}],"speech_gaps":[],"frame":"../frames/v027/005.webp","frame_time":719.36},{"title":"强化学习：提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":69,"text":"And you see that the bot actually goes down. If you focus on the green dots in a few steps, it tries to go back up and recover the regular motion style that it is working with. Similarly here, it's like the foothold is not even stable. So this plank just moves with the foot. So there's no clear estimate of the ground that you can get. And it's still walking. All of these results are blind, by the way. There's no vision. All of these just use proprioception history.","zh":"你可以看到机器人实际上向下移动了。如果你关注几步后的绿色点，它试图回到上来的方向，以恢复它正在使用的常规运动模式。同样地，这里就像脚部的支撑点并不稳定。所以这块木板只是随着脚移动。因此，你无法获得清晰的地面估计。但它仍在行走。顺便说一下，所有这些结果都是盲目的，没有视觉。所有这些都只使用本体感觉的历史数据。","start":879.59,"end":905.03},{"id":70,"text":"And I evaluated it on a bunch of places, including my mattress on foam, taking a step down, step up, and all of these. And it was relatively robust in all of these scenarios. So let's see what happens if we switch off this adaptation module. So what this means is we estimate the extrinsics at the first time step, and then we freeze that update, and then we don't update the extrinsics for the rest of the run. And it looks like it is 8 kg. This is like a 12 kg robot, and 8 kg is very high. And you can see the bot is struggling a bit.","zh":"我评估了它在许多地方的表现，包括我的泡沫床垫上，包括下台阶、上台阶等所有这些情况。它在所有这些场景中表现得相对稳健。那么让我们看看如果我们关闭这个适应模块会发生什么。这意味着我们在第一个时间步估计外参，然后冻结这个更新，并且在运行的其余时间不再更新外参。看起来它的重量是8公斤。这是一个12公斤的机器人，8公斤是非常高的。你可以看到机器人有点挣扎。","start":907.07,"end":937.18},{"id":71,"text":"So the rated payload for this robot when I bought it was around three kilograms. So I'm maxing this out. It heats the motors much faster, but it can still manage to walk. If you switch off this adaptation module. So the way it actually tilts the bot forward and it doesn't know to correct for it by applying more force or torque in the front legs or get back to a higher clearance and just ends up tilting forward when it doesn't have enough torque to clear for the next step.","zh":"当我购买这个机器人时，它的额定负载大约是三公斤。所以我正在将它推到极限。它会使电机更快发热，但它仍然能够行走。如果你关闭这个适应模块。它实际上会向前倾斜机器人，但它不知道通过在前腿施加更多力或扭矩来纠正，或者回到更高的间隙，最终在没有足够扭矩来清除下一步时向前倾斜。","start":937.77,"end":967.42},{"id":72,"text":"Same thing with the foam. Even if it is getting stuck, it seems to manage that fine. But here it doesn't know to again apply more force to get higher clearance to continue walking because it hasn't detected that event or that change. So let's zoom into what is this adaptation module doing exactly. So this is the plastic surface that I showed you before. It's flipped.","zh":"泡沫的情况也是一样的。即使它卡住了，它似乎也能很好地应对。但在这里，它不知道再次施加更多力以获得更高的间隙来继续行走，因为它没有检测到这个事件或这个变化。那么让我们仔细看看这个适应模块到底在做什么。这就是我之前展示的塑料表面，它被翻转了。","start":968.85,"end":994.34},{"id":73,"text":"And there are three plots that I have here. So the top plot is what is called a gate plot. So these are the four feet of the robot. And any time a line is solid, it means that the feet is in contact. There are feet sensors in the hardware which let us plot this. The second plot is the amount of torque being requested in the front right knee of the robot.","zh":"这里我有三个图表。顶部的图表被称为门图（gate plot）。这些是机器人的四个脚。每当一条线是实线时，表示脚处于接触状态。硬件中装有脚传感器，使我们能够绘制这些图表。第二个图表是机器人前右膝关节所请求的扭矩量。","start":996.21,"end":1018.99},{"id":74,"text":"And Z1 and Z2, Z5 are two values that we have taken from the adaptation module. And we've just plotted them. I chose these two because they show the most variation in the course of this run. So if you see that the moment it slips, there's some shuffling in the gate. We also see a variation in the torque profile.","zh":"Z1 和 Z2、Z5 是我们从自适应模块中获取的两个值。我们刚刚绘制了它们。我选择这两个值是因为它们在本次运行过程中表现出最大的变化。如果你注意到当机器人打滑时，门图中会出现一些变化。我们还观察到扭矩曲线的变化。","start":1020.21,"end":1040.9}],"notes":["本段讨论了机器人在不同地形上的表现，特别是当关闭自适应模块时的稳定性问题。讲者提到机器人在泡沫垫上行走时，虽然能够应对一些挑战，但缺乏对变化的检测，导致无法调整以维持行走。这说明自适应模块在动态环境中对机器人行为的重要性。","讲者通过实验评估了机器人在多种场景下的鲁棒性，包括泡沫垫、上下台阶等。关闭自适应模块后，机器人表现出明显的性能下降，如倾斜和无法及时调整。这表明自适应模块在维持机器人稳定性和适应性方面起着关键作用。","讲者展示了自适应模块中的两个关键变量Z1、Z2和Z5，并指出它们在运行过程中表现出显著的变化。这些变量的变化反映了机器人在不同地形和动作中的动态调整过程，有助于理解自适应机制的工作原理。","讲者提到机器人在泡沫垫上虽然能够应对一些挑战，但无法检测到某些事件或变化，导致无法调整以维持行走。这说明自适应模块在检测和响应环境变化方面的重要性，尤其是在复杂或不稳定的地形中。","讲者通过展示门图（gate plot）和扭矩曲线，说明了机器人在不同地形下的接触状态和动力学行为。这些数据有助于分析机器人在不同条件下的运动模式和控制策略。","讲者强调了自适应模块在机器人控制中的关键作用，特别是在动态和不确定环境中。关闭该模块会导致机器人性能显著下降，这表明自适应机制对于实现稳定和高效的机器人运动至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":879.59,"end":1040.9,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":879.59,"text":"And you see that the bot actually goes down. If you focus on the green dots in a few steps, it tries to go back up and recover the regular motion style that it is working with. Similarly here, it's like the foothold is not even stable. So this plank just moves with the foot. So there's no clear estimate of the ground that you can get. And it's still walking. All of these results are blind, by the way. There's no vision. All of these just use proprioception history."},{"start":907.07,"text":"And I evaluated it on a bunch of places, including my mattress on foam, taking a step down, step up, and all of these. And it was relatively robust in all of these scenarios. So let's see what happens if we switch off this adaptation module. So what this means is we estimate the extrinsics at the first time step, and then we freeze that update, and then we don't update the extrinsics for the rest of the run. And it looks like it is 8 kg. This is like a 12 kg robot, and 8 kg is very high. And you can see the bot is struggling a bit."},{"start":937.77,"text":"So the rated payload for this robot when I bought it was around three kilograms. So I'm maxing this out. It heats the motors much faster, but it can still manage to walk. If you switch off this adaptation module. So the way it actually tilts the bot forward and it doesn't know to correct for it by applying more force or torque in the front legs or get back to a higher clearance and just ends up tilting forward when it doesn't have enough torque to clear for the next step."},{"start":968.85,"text":"Same thing with the foam. Even if it is getting stuck, it seems to manage that fine. But here it doesn't know to again apply more force to get higher clearance to continue walking because it hasn't detected that event or that change. So let's zoom into what is this adaptation module doing exactly. So this is the plastic surface that I showed you before. It's flipped."},{"start":996.21,"text":"And there are three plots that I have here. So the top plot is what is called a gate plot. So these are the four feet of the robot. And any time a line is solid, it means that the feet is in contact. There are feet sensors in the hardware which let us plot this. The second plot is the amount of torque being requested in the front right knee of the robot."},{"start":1020.21,"text":"And Z1 and Z2, Z5 are two values that we have taken from the adaptation module. And we've just plotted them. I chose these two because they show the most variation in the course of this run. So if you see that the moment it slips, there's some shuffling in the gate. We also see a variation in the torque profile."}],"speech_gaps":[],"frame":"../frames/v027/006.webp","frame_time":891.59},{"title":"强化学习：提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":75,"text":"And we see that the adaptation module changes its value to capture that something has happened. Since these are learned extrinsics, we cannot interpret them very easily. But we see that some change has happened. And after that, it seems to have recovered to the same gate pattern and a similar talk profile as before. Once the event is detected in the bottom graph. Similarly, for this example, there's a 5 kg payload which has dropped, which means that at the time of impact, the force is probably even more.","zh":"我们看到适应模块会改变其值以捕捉到某些事情已经发生。由于这些是学习到的外在参数，我们很难对其进行解释。但我们可以看到发生了某种变化。之后，它似乎恢复到了之前相同的门模式和相似的对话模式。一旦在底部图中检测到该事件。同样，在这个例子中，有一个5公斤的负载掉落了，这意味着在撞击时刻，施加的力可能更大。","start":1041.47,"end":1071.06},{"id":76,"text":"And we can do the same test. And we see that there's again the shuffling of this gate and the torque is very high at the moment when this drops. But it comes back to a regular gate. But the torque that it saturates to after it is done with adapting to this event, the torque it saturates to is higher than before because it needs more torque to balance the weight that it is carrying. So let's get into some quantitative comparison.","zh":"我们也可以进行同样的测试。我们看到这个门再次发生混洗，而在负载掉落的瞬间扭矩非常高。但它最终恢复到了正常的门模式。但完成对这一事件的适应后，它达到的扭矩值比之前更高，因为需要更大的扭矩来平衡它所携带的重量。因此，让我们进行一些定量比较。","start":1071.71,"end":1097.22},{"id":77,"text":"The first baseline is a very simple change over this. It's just train a policy without the knowledge of changing environments. You just trained a policy which is blind and robust to every single thing it can potentially encounter. This is a very common technique which is used, which is just domain randomization without necessarily caring about if you are giving this input to the policy or not.","zh":"第一个基线是在这个基础上进行一个非常简单的变化。它只是在不知道环境变化的情况下训练策略。你只是训练了一个盲目的策略，使其对可能遇到的任何事物都具有鲁棒性。这是一种非常常见的技术，即领域随机化，而不一定关心是否将这些输入提供给策略。","start":1098.92,"end":1121.1},{"id":78,"text":"This is one of the baselines. Last before in the row above expert is the RMA baseline. That's the method that I just presented. Stands for rapid motor adaptation. And if you compare that with robust, we see that it is a bit conservative, but it also has a weaker success rate. And the amount of torque it's exerting is also higher. The amount of jerk that it experiences is higher because it has no idea of the environment around it. It is just trying to be as aggressive as possible to make sure that it does not fall.","zh":"这是其中一个基线。在上一行专家之前的基线是RMA基线。这就是我刚刚介绍的方法，代表快速运动适应。如果我们将其与鲁棒性进行比较，我们会发现它稍微保守一些，但它的成功率也较弱。它施加的扭矩量也更高。它所经历的加速度也更高，因为它对周围环境一无所知，只是尽可能地采取激进的策略以确保不会摔倒。","start":1121.7,"end":1150.86},{"id":79,"text":"The second baseline we have is for system identification. The goal for system identification is to estimate things like friction and mass and all of these other parameters explicitly and then use them downstream. So in this instantiation of system identification, what we try to do is instead of trying to predict the extrinsics, which is a compressed version of these environment parameters, we directly go for these SISID parameters. So we directly try to predict friction and all of these other parameters.","zh":"我们第二个基线是用于系统辨识的。系统辨识的目标是显式地估计诸如摩擦力、质量以及所有这些其他参数，然后在后续步骤中使用这些参数。因此，在这个系统辨识的实例中，我们尝试做的事情是，而不是尝试预测外在参数（这些外在参数是环境参数的压缩版本），我们直接去预测这些SISID参数。因此，我们直接尝试预测摩擦力以及所有这些其他参数。","start":1151.98,"end":1181.24},{"id":80,"text":"And so this is a hard problem to predict exactly what the friction is because you might not even detect the full scope of the slip or you might not even know exactly how much the mass is. But it's also not necessary to solve for the final downstream task of working robustly.","zh":"因此，要精确预测摩擦力是一个困难的问题，因为你可能甚至无法检测到滑动的全部范围，或者你可能甚至不知道质量的确切数值。但这也并不需要为在后续步骤中实现稳健工作而解决最终的下游任务。","start":1182.38,"end":1198.82}],"notes":["本段讲授了机器人适应模块在检测到环境变化时的行为，例如负载掉落时的力变化。通过观察适应模块的值变化，可以判断环境是否发生了变化。在检测到事件后，系统会恢复到之前的门模式和谈话特征，但此时的扭矩可能更高，因为需要更多的力来平衡负载。","在比较不同基线方法时，RMA（快速运动适应）方法被提出，它与鲁棒方法相比更为保守，成功率较低，但施加的扭矩更大，导致加速度更大。这是因为RMA方法对环境缺乏了解，因此采取了更为激进的策略以防止摔倒。","系统识别的第二个基线方法旨在估计摩擦力、质量等参数，并直接预测这些参数，而不是预测压缩的环境参数。这使得系统能够更精确地建模环境，从而提高控制性能。","预测摩擦力等参数是一个困难的问题，因为可能无法完全检测到滑动范围或质量的精确值。然而，这并不一定需要精确解决，因为最终的目标是实现鲁棒的控制。","在比较不同方法时，强调了鲁棒方法和RMA方法在适应性和成功率上的差异。鲁棒方法更保守，而RMA方法则更激进，但成功率较低。","系统识别方法直接预测摩擦力等参数，而不是压缩的环境参数，这使得系统能够更精确地建模环境，从而提高控制性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1041.47,"end":1198.82,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1041.47,"text":"And we see that the adaptation module changes its value to capture that something has happened. Since these are learned extrinsics, we cannot interpret them very easily. But we see that some change has happened. And after that, it seems to have recovered to the same gate pattern and a similar talk profile as before. Once the event is detected in the bottom graph. Similarly, for this example, there's a 5 kg payload which has dropped, which means that at the time of impact, the force is probably even more."},{"start":1071.71,"text":"And we can do the same test. And we see that there's again the shuffling of this gate and the torque is very high at the moment when this drops. But it comes back to a regular gate. But the torque that it saturates to after it is done with adapting to this event, the torque it saturates to is higher than before because it needs more torque to balance the weight that it is carrying. So let's get into some quantitative comparison."},{"start":1098.92,"text":"The first baseline is a very simple change over this. It's just train a policy without the knowledge of changing environments. You just trained a policy which is blind and robust to every single thing it can potentially encounter. This is a very common technique which is used, which is just domain randomization without necessarily caring about if you are giving this input to the policy or not."},{"start":1121.7,"text":"This is one of the baselines. Last before in the row above expert is the RMA baseline. That's the method that I just presented. Stands for rapid motor adaptation. And if you compare that with robust, we see that it is a bit conservative, but it also has a weaker success rate. And the amount of torque it's exerting is also higher. The amount of jerk that it experiences is higher because it has no idea of the environment around it. It is just trying to be as aggressive as possible to make sure that it does not fall."},{"start":1151.98,"text":"The second baseline we have is for system identification. The goal for system identification is to estimate things like friction and mass and all of these other parameters explicitly and then use them downstream. So in this instantiation of system identification, what we try to do is instead of trying to predict the extrinsics, which is a compressed version of these environment parameters, we directly go for these SISID parameters. So we directly try to predict friction and all of these other parameters."},{"start":1182.38,"text":"And so this is a hard problem to predict exactly what the friction is because you might not even detect the full scope of the slip or you might not even know exactly how much the mass is. But it's also not necessary to solve for the final downstream task of working robustly."}],"speech_gaps":[],"frame":"../frames/v027/007.webp","frame_time":1053.47},{"title":"提升机器人智能（Advancing Robot Intelligence）","segments":[{"id":81,"text":"And we see the gap in performance if we try to do explicitly estimate these parameters. And interestingly, it's lower than having a robust policy, which is just agnostic to it and just learns a gate, which is robust to all of these changes to begin with. The third baseline is one that tries to fine tune at inference time. So you take a policy from simulation and to bridge the sim to real gap, you roll it out in the real world and then you improve the policy.","zh":"我们看到，如果我们试图显式地估计这些参数，性能会有差距。有趣的是，这种差距比拥有一个鲁棒策略还要低，而这种策略对这些变化是无所谓的，只是学习一个门控机制，从一开始就能应对所有这些变化。第三个基线方法是在推理时尝试微调。因此，你从仿真中获取一个策略，为了弥合仿真与现实之间的差距，你将其部署到现实世界中，然后改进该策略。","start":1199.46,"end":1225.44},{"id":82,"text":"This is one way of achieving that. The RMA style is closer to in-context learning, where you take the history of everything, and then the learning happens in the feedforward pass itself. So you see all of these parameters, and then you estimate how the network should behave, which lets it do it in fractions of a second, instead of trying to estimate that at inference time by rolling out policies.","zh":"这是实现这一目标的一种方式。RMA风格的方法更接近于上下文学习，你利用所有历史信息，然后在前向传播过程中直接进行学习。因此，你会看到所有这些参数，然后估计网络应该如何行为，这使得它能在几分之一秒内完成，而不是在推理时通过部署策略来估计。","start":1226.23,"end":1249.35},{"id":83,"text":"And then the last baseline is one with adaptation. So if we switch off adaptation, the performance falls. We did this quantitatively, qualitatively, and we have numbers in the real world as well. We see that the performance is lower than just using RMA. There's a small amount of gap between what we get from the export and from distilling it into an RMA method, which can actually be deployed. Okay, so everything that I've shown up until now is blind.","zh":"然后最后一个基线方法是带有适应性的方法。如果我们关闭适应性，性能会下降。我们从定量和定性两个方面进行了验证，并且在现实世界中也有具体的数据。我们看到，性能低于仅仅使用RMA。从导出结果与将其蒸馏为RMA方法之间存在一个小的差距，而后者实际上可以部署。好的，我迄今为止所展示的所有内容都是盲目的。","start":1250.86,"end":1279.4},{"id":84,"text":"The next thing that I'll do, so if you want to strive towards having some form of a general robot model, it needs to have perception or vision. And I will try to add vision to what I just showed for walking. But we already saw all of these results without vision. So the first question is, do we even need vision for walking? Is it a good test? Do we even need vision for walking? Can we not just do without any vision altogether, given the results we have already seen?","zh":"接下来，如果想要朝着拥有某种通用机器人模型的方向努力，它需要具备感知或视觉。我将尝试为之前展示的行走任务添加视觉信息。但我们已经看到了在没有视觉的情况下所有这些结果。因此，第一个问题是，我们是否真的需要视觉来进行行走？这是否是一个好的测试？我们是否真的需要视觉来进行行走？鉴于我们已经看到的结果，我们是否可以完全不使用任何视觉？","start":1281.49,"end":1310.15},{"id":85,"text":"And the answer is that the two scenarios in one case, vision is critical. Like if you are to cross these gaps or stepping stones or make a jump, you need vision to estimate how to make that jump. And the second argument is more of an efficiency and elegance and longevity argument. So if you have to collide with a staircase every single time that you climb it, it's not it's a very.","zh":"答案是，在某些情况下，视觉是至关重要的。例如，如果你要跨越这些间隙或台阶或进行跳跃，你需要视觉来估计如何完成跳跃。第二个论点则更多是关于效率、优雅性和持久性的。如果你每次爬楼梯都要与楼梯发生碰撞，这显然不是一种理想的方式。","start":1311.57,"end":1334.23},{"id":86,"text":"in elegant policy and the hardware will probably not survive for long. So for both of these reasons, if you have a vision in the loop, you can potentially get to results which are much better than what we can achieve without vision. And that will be the focus of this work. This was published in Coral 2022. So to repeat the question, your question is, has there been follow-up work done to use the rollouts in the real world to improve the policy?","zh":"优雅的策略和硬件可能不会持续很长时间。因此，出于这两个原因，如果你在循环中使用视觉，你有可能得到比没有视觉时所能实现的结果好得多的结果。而这将是本工作的重点。这项工作发表于Coral 2022。那么再次重复问题，你的问题是，是否已有后续工作利用现实世界中的rollouts来改进策略？","start":1335.6,"end":1363.06}],"notes":["本段讨论了强化学习中不同基线方法的比较，包括显式估计参数、在推理时微调策略以及使用RMA（Robust Model Aggregation）方法。RMA方法更接近于上下文学习，通过在前向传播过程中直接估计网络行为，从而在极短时间内完成任务，而不是通过策略展开进行估计。","在没有视觉的情况下，机器人行走的性能仍然可以达到一定水平，但视觉在某些场景下是至关重要的，例如跨越障碍或跳跃。此外，视觉还能提高策略的效率和优雅性，避免硬件因频繁碰撞而损坏。","作者指出，视觉在机器人控制中具有双重作用：一方面，它能帮助机器人更精确地估计动作；另一方面，它能提升策略的长期稳定性和硬件的耐用性。因此，将视觉纳入控制循环中，可以实现比无视觉策略更优的结果。","作者提到，这项工作发表于Coral 2022，并重申了关于是否在真实世界中使用策略展开来改进策略的问题，这表明后续研究可能关注如何将模拟策略迁移到真实环境。","在讨论视觉的重要性时，作者提到两个主要论点：一是视觉在特定任务中的必要性，二是视觉对策略效率和硬件寿命的积极影响。这些论点支持了将视觉纳入机器人控制系统的合理性。","作者强调，虽然当前的实验结果表明在没有视觉的情况下机器人仍能完成行走任务，但视觉的引入可以显著提升性能和鲁棒性。这表明视觉在复杂任务中的重要性，尤其是在需要精确动作和长期稳定性的场景中。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1199.46,"end":1363.06,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1199.46,"text":"And we see the gap in performance if we try to do explicitly estimate these parameters. And interestingly, it's lower than having a robust policy, which is just agnostic to it and just learns a gate, which is robust to all of these changes to begin with. The third baseline is one that tries to fine tune at inference time. So you take a policy from simulation and to bridge the sim to real gap, you roll it out in the real world and then you improve the policy."},{"start":1226.23,"text":"This is one way of achieving that. The RMA style is closer to in-context learning, where you take the history of everything, and then the learning happens in the feedforward pass itself. So you see all of these parameters, and then you estimate how the network should behave, which lets it do it in fractions of a second, instead of trying to estimate that at inference time by rolling out policies."},{"start":1250.86,"text":"And then the last baseline is one with adaptation. So if we switch off adaptation, the performance falls. We did this quantitatively, qualitatively, and we have numbers in the real world as well. We see that the performance is lower than just using RMA. There's a small amount of gap between what we get from the export and from distilling it into an RMA method, which can actually be deployed. Okay, so everything that I've shown up until now is blind."},{"start":1281.49,"text":"The next thing that I'll do, so if you want to strive towards having some form of a general robot model, it needs to have perception or vision. And I will try to add vision to what I just showed for walking. But we already saw all of these results without vision. So the first question is, do we even need vision for walking? Is it a good test? Do we even need vision for walking? Can we not just do without any vision altogether, given the results we have already seen?"},{"start":1311.57,"text":"And the answer is that the two scenarios in one case, vision is critical. Like if you are to cross these gaps or stepping stones or make a jump, you need vision to estimate how to make that jump. And the second argument is more of an efficiency and elegance and longevity argument. So if you have to collide with a staircase every single time that you climb it, it's not it's a very."},{"start":1335.6,"text":"in elegant policy and the hardware will probably not survive for long. So for both of these reasons, if you have a vision in the loop, you can potentially get to results which are much better than what we can achieve without vision. And that will be the focus of this work. This was published in Coral 2022. So to repeat the question, your question is, has there been follow-up work done to use the rollouts in the real world to improve the policy?"}],"speech_gaps":[],"frame":"../frames/v027/008.webp","frame_time":1211.46},{"title":"强化学习中策略记忆与模拟到现实的迁移","segments":[{"id":87,"text":"So there are two parts to this question. The one part is the sheer power of using a general learning algorithm, which is like if you use reinforcement learning in the limit, you can learn whatever behavior it is that you want to learn. And then there is this argument of if the policy makes a mistake and figures out in a few tries how to fix it, will it remember it in the future?","zh":"这个问题有两个部分。第一部分是使用通用学习算法的纯粹力量，就像如果你在极限情况下使用强化学习，你可以学习到你想要学习的任何行为。第二部分则是这样的论点：如果策略犯了错误，并在几次尝试中弄清楚如何修复，它会在未来记住这一点吗？","start":1364.1,"end":1384.94},{"id":88,"text":"The first part, I think, is an open problem, and we still don't have a method which can continuously improve perpetually online. The second part of your question is a simpler problem, which is where the simpler answer might be to just increase the context that you give to the policy. So if you figure out a way to compress the context of one day into the policy or two days into the policy, you can imagine the in-context learning to be sufficient.","zh":"我认为第一部分仍然是一个开放性问题，我们仍然没有一种方法可以持续不断地在线改进。你问题的第二部分是一个更简单的问题，其更简单的答案可能是增加提供给策略的上下文。因此，如果你找到一种方法将一天的上下文压缩到策略中，或者将两天的上下文压缩到策略中，你可以想象上下文学习是足够的。","start":1387.05,"end":1413.79},{"id":89,"text":"to let it remember how it fixed it the last time and get it right in one shot in the future. So there are two ways to get to what you said. One of them is more powerful, but also very slow to learn. And the other thing lets you learn much faster in a much simpler way. It's not obvious which one is more complete. I can see a system which has infinite context.","zh":"让它记住它上次是如何修复的，并在未来一次尝试中就正确执行。因此，有两条路可以达到你所说的。其中一条更为强大，但学习速度非常慢。另一条则可以通过更简单的方式实现更快的学习。目前还不清楚哪一种更完整。我可以想象一个具有无限上下文的系统，","start":1414.36,"end":1443.81},{"id":90,"text":"like what humans have, and is capable of maintaining a memory which lets us continuously","zh":"就像人类所拥有的，能够维持一种记忆，使我们可以在前馈传递本身中不断改进，而无需进行强化学习梯度的更新。这种情形没有理由不能发生。但关键在于，这种转变的负担在于如何训练这个模型。因此，你需要在模拟中进行某种训练，以使模型表现出这种行为。","start":1444.46,"end":1449.6},{"id":91,"text":"improve in the feedforward pass itself without needing to take, without having to take reinforcement","zh":"是的，你可以直接使用第二阶段并投入更多计算资源进行训练。我之前使用的是","start":1449.6,"end":1454.84},{"id":92,"text":"learning gradients. There's no reason that cannot happen. But the key, but then the burden of that","zh":"强化学习梯度。","start":1454.84,"end":1460.8},{"id":93,"text":"shifts to how do you train this model. So you need to do something in simulation to get that","zh":"这种转变的负担在于如何训练这个模型。因此，你需要在模拟中进行某种训练，以使模型表现出这种行为。","start":1460.8,"end":1464.78},{"id":94,"text":"behavior out of it. Yes, you can train directly with phase two with more compute. I was using a","zh":"是的，你可以直接使用第二阶段并投入更多计算资源进行训练。我之前使用的是","start":1464.78,"end":1470.94},{"id":95,"text":"cpu-based simulation if a gpu-based simulation with more gpus that is possible uh most successful","zh":"基于CPU的模拟如果使用更多GPU的基于GPU的模拟是可能的，这可能是最成功的","start":1470.94,"end":1476.64},{"id":96,"text":"sim to real policies are actually the ones which don't have a history they usually just use the","zh":"从模拟到现实的策略实际上是没有历史记录的，它们通常只是使用当前状态来部署","start":1476.64,"end":1484.32},{"id":97,"text":"current state to deploy and my guess for why that is the case is because the moment you have only","zh":"我的猜测是为什么会出现这种情况，是因为一旦你只使用当前状态来部署，它就变成了一个基于状态索引的策略，而不是基于状态和时间索引的策略","start":1484.32,"end":1491.92},{"id":98,"text":"the current state that you're using to deploy it becomes a state indexed policy as opposed to a","zh":"所以如果你要使用历史记录，你需要确保在历史记录中看到的分布足够随机化，","start":1491.92,"end":1499.42},{"id":99,"text":"state and time index policy so if you were to have a history you need to make sure that","zh":"当你进入现实世界时，训练过程中没有发生利用行为","start":1499.42,"end":1507.24},{"id":100,"text":"the distribution you see in your history and you randomize it sufficiently enough that","zh":"这也会阻止它转移到现实世界","start":1507.24,"end":1513.0},{"id":101,"text":"when you go into the real world there's no exploitation that happened during training","zh":"抱歉重复问题","start":1514.24,"end":1518.2},{"id":102,"text":"which is preventing it from transferring as well to the real world sorry to repeat the question","zh":"这也在阻止它向现实世界进行迁移，抱歉重复问题","start":1518.2,"end":1523.4},{"id":103,"text":"the question was can we just directly train phase two and the answer is yes you can with","zh":"问题是，我们能否直接训练第二阶段，答案是的，你可以这样做，","start":1523.4,"end":1527.8},{"id":104,"text":"with more compute, but you need to be careful with sim2real because the more information","zh":"但需要更多的计算资源，但在sim2real中需要小心，因为你在sim中提供的信息越多，","start":1527.8,"end":1531.72},{"id":105,"text":"you give it in sim, which is possible if you have a very, very long and dense history,","zh":"如果拥有非常长且密集的历史记录，这是可能的，","start":1531.72,"end":1535.18},{"id":106,"text":"it might learn to exploit things of either your environment or physics and simulation","zh":"它可能会学会利用你环境或物理模拟中的某些东西，","start":1535.36,"end":1540.12},{"id":107,"text":"or your reward structure.","zh":"或者你的奖励结构。","start":1540.12,"end":1541.0},{"id":108,"text":"And we do see this.","zh":"我们确实看到了这种情况。","start":1541.62,"end":1542.86}],"notes":["本段讨论了强化学习中策略记忆与模拟到现实迁移的问题。讲者指出，策略是否能记住过去的错误并加以修正，是强化学习中的一个关键问题。有两种方法可以实现这一目标：一种是通过持续在线学习，但这种方法效率较低；另一种是通过增加上下文信息，使策略能够记住过去的经历。讲者认为，人类具有无限的上下文记忆，这使得他们可以在不需要强化学习梯度的情况下持续改进。然而，这种方法的训练需要在模拟环境中进行，并且需要足够的计算资源。","讲者提到，模拟到现实（sim2real）的迁移中，如果策略具有历史信息，可能会导致过拟合，从而影响其在现实世界中的表现。因此，策略通常只使用当前状态进行部署，而不是结合历史信息。讲者认为，这种做法的原因是，如果策略使用历史信息，就需要确保历史数据的分布足够随机，以避免在训练过程中出现过拟合现象。","讲者进一步指出，直接训练第二阶段（phase two）是可能的，但需要更多的计算资源。同时，模拟环境中的信息越多，策略可能会越容易利用环境或奖励结构中的漏洞，从而影响其在现实世界中的表现。因此，在模拟训练中需要谨慎处理信息的提供方式。","讲者最后提到，他们确实观察到了这种现象，即策略在模拟环境中可能会学习到一些在现实世界中无法应用的技巧。这表明，在模拟到现实的迁移过程中，需要仔细设计训练策略，以避免过拟合和性能下降的问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1364.1,"end":1542.86,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":1364.1,"text":"So there are two parts to this question. The one part is the sheer power of using a general learning algorithm, which is like if you use reinforcement learning in the limit, you can learn whatever behavior it is that you want to learn. And then there is this argument of if the policy makes a mistake and figures out in a few tries how to fix it, will it remember it in the future?"},{"start":1387.05,"text":"The first part, I think, is an open problem, and we still don't have a method which can continuously improve perpetually online. The second part of your question is a simpler problem, which is where the simpler answer might be to just increase the context that you give to the policy. So if you figure out a way to compress the context of one day into the policy or two days into the policy, you can imagine the in-context learning to be sufficient."},{"start":1414.36,"text":"to let it remember how it fixed it the last time and get it right in one shot in the future. So there are two ways to get to what you said. One of them is more powerful, but also very slow to learn. And the other thing lets you learn much faster in a much simpler way. It's not obvious which one is more complete. I can see a system which has infinite context."},{"start":1444.46,"text":"like what humans have, and is capable of maintaining a memory which lets us continuously"},{"start":1449.6,"text":"improve in the feedforward pass itself without needing to take, without having to take reinforcement"},{"start":1454.84,"text":"learning gradients. There's no reason that cannot happen. But the key, but then the burden of that"},{"start":1460.8,"text":"shifts to how do you train this model. So you need to do something in simulation to get that"},{"start":1464.78,"text":"behavior out of it. Yes, you can train directly with phase two with more compute. I was using a"},{"start":1470.94,"text":"cpu-based simulation if a gpu-based simulation with more gpus that is possible uh most successful"},{"start":1476.64,"text":"sim to real policies are actually the ones which don't have a history they usually just use the"},{"start":1484.32,"text":"current state to deploy and my guess for why that is the case is because the moment you have only"},{"start":1491.92,"text":"the current state that you're using to deploy it becomes a state indexed policy as opposed to a"},{"start":1499.42,"text":"state and time index policy so if you were to have a history you need to make sure that"},{"start":1507.24,"text":"the distribution you see in your history and you randomize it sufficiently enough that"},{"start":1514.24,"text":"when you go into the real world there's no exploitation that happened during training"},{"start":1518.2,"text":"which is preventing it from transferring as well to the real world sorry to repeat the question"},{"start":1523.4,"text":"the question was can we just directly train phase two and the answer is yes you can with"},{"start":1527.8,"text":"with more compute, but you need to be careful with sim2real because the more information"},{"start":1531.72,"text":"you give it in sim, which is possible if you have a very, very long and dense history,"},{"start":1535.36,"text":"it might learn to exploit things of either your environment or physics and simulation"},{"start":1540.12,"text":"or your reward structure."},{"start":1541.62,"text":"And we do see this."}],"speech_gaps":[],"frame":"../frames/v027/009.webp","frame_time":1376.1},{"title":"强化学习中策略优化与奖励平衡","segments":[{"id":109,"text":"If you give a periodic push to the robot, it is very common for the robot to just learn","zh":"如果你给机器人一个周期性的推力，机器人通常只会学习","start":1543.04,"end":1552.62},{"id":110,"text":"to be very robust when it expects the push.","zh":"在它预期到推力时变得非常鲁棒。","start":1552.62,"end":1554.36},{"id":111,"text":"when it has a long enough context or it has a notion of time. But when you randomize that as well, then you can get around it. So it is possible. You just need to be more careful with how you train your policy. So the physical parameters in this is maybe there's a 2x compression here, like half of what the relative is. The extrinsics are around 8. I think the full physical parameters are maybe 17 or 18. In this version of vision, there'll be a much more aggressive compression.","zh":"当它拥有足够长的上下文或它有时间的概念时。但当你也对这些进行随机化时，你就可以绕过这个问题。所以这是可能的。你只需要在训练策略时更加小心。在这个物理参数中，可能这里有一个2倍的压缩，比如相对值的一半。外在参数大约是8。我认为完整的物理参数可能是17或18。在这个版本的视觉中，会有更激进的压缩。","start":1555.1,"end":1583.59},{"id":112,"text":"where it goes from the full image to a much smaller encoder. The question is, in the series of rewards that we have, how do we balance between all of these different rewards? There's no good way to do it. That is the real answer. I think it's a very hard problem. The practical way to do it is to add one reward at a time and then try to see what is lacking in the current set of rewards.","zh":"它从完整的图像转换到一个更小的编码器。问题是，在我们拥有的奖励序列中，我们如何在这些不同的奖励之间进行平衡？没有好的方法来做这件事。这就是真正的答案。我认为这是一个非常困难的问题。实际的做法是每次添加一个奖励，然后尝试看看当前奖励集合中缺少什么。","start":1584.16,"end":1613.77},{"id":113,"text":"add a new reward, and then tune only that reward relative to every other reward. So instead of this exponential complexity, you can kind of reduce it somewhat to just adding one at a time. But the coefficients we get are probably not the most optimal you can get. So the question is, in input to the policy, we use the current state and the previous action. What if we don't use the previous action? So previous action has a very important signal.","zh":"添加一个新的奖励，然后只调整该奖励与其他奖励之间的相对值。这样，而不是指数级的复杂性，你可以将其减少到某种程度，即每次只添加一个。但我们得到的系数可能并不是最优的。问题是，在输入策略时，我们使用当前状态和之前的动作。如果我们不使用之前的动作呢？之前的动作具有非常重要的信号。","start":1614.33,"end":1643.45},{"id":114,"text":"which is what is the command that I gave in the last time step. This lets you be smooth, consistent, and it also lets you show some amount of correction behavior. So if this action didn't work and you're conditioned on that action, you know that the next action that you have to predict needs to be higher. So the state is lossy. If you remove the previous action, my guess is that the performance will drop compared to having the action as input.","zh":"这就是上一个时间步我给出的指令是什么。这让你的行为变得平滑、一致，同时也让你能够表现出一定程度的修正行为。如果这个动作没有起作用，并且你基于这个动作进行条件判断，你就知道下一个需要预测的动作需要更高。状态是损失性的。如果你移除之前的动作，我的猜测是，性能将比将动作作为输入时下降。","start":1644.18,"end":1668.84},{"id":115,"text":"The question is what happens if we use two or three or more time steps of the state history that's related to the other question where what if we train the full system end-to-end directly phased to using reinforcement learning? You can do that. You just need to be a bit careful with same-to-real transfer because now it has more context and information to potentially exploit the simulation or your environment or your reward structure in ways which might not be desirable.","zh":"问题是，如果我们使用两个或三个或更多时间步的状态历史，会发生什么？这与另一个问题相关，即如果我们直接以强化学习的方式对整个系统进行端到端训练，又会怎样？你可以这样做。你只需要在相同到现实的迁移过程中稍加小心，因为现在它拥有更多的上下文和信息，可能会以一些可能不理想的方式利用模拟环境或你的环境或奖励结构。","start":1669.78,"end":1695.82}],"notes":["本段讨论了在强化学习中，如何处理物理参数的压缩问题。讲者提到，当前的物理参数可能有2倍的压缩，例如相对值的一半，而外在参数大约为8。完整的物理参数可能在17或18左右。在这一版本的视觉系统中，图像会被压缩到更小的编码器中，这可能影响系统的性能。","讲者指出，在奖励设计中，如何平衡多个奖励是一个非常困难的问题。没有一种好的方法可以解决这个问题。实际操作中，可以逐步添加奖励，并观察当前奖励集合的不足之处。","讲者提到，通过逐步添加奖励并调整其与其他奖励的关系，可以减少指数级的复杂性。但得到的系数可能并不是最优的。此外，讲者还讨论了在策略输入中是否需要使用前一个动作的问题。","前一个动作具有重要的信号作用，它可以帮助系统保持平滑和一致性，并展示一定的修正行为。如果前一个动作没有被使用，系统可能无法正确预测下一个动作，从而导致性能下降。","最后，讲者探讨了使用多个时间步的状态历史对系统的影响。如果直接使用强化学习训练整个系统，可能会因为更多的上下文信息而影响模拟到现实的迁移效果，从而导致不期望的行为。"],"formulas":[],"uncertainties":["The physical parameters in this is maybe there's a 2x compression here, like half of what the relative is."],"diagram":"none","start":1543.04,"end":1695.82,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1543.04,"text":"If you give a periodic push to the robot, it is very common for the robot to just learn"},{"start":1552.62,"text":"to be very robust when it expects the push."},{"start":1555.1,"text":"when it has a long enough context or it has a notion of time. But when you randomize that as well, then you can get around it. So it is possible. You just need to be more careful with how you train your policy. So the physical parameters in this is maybe there's a 2x compression here, like half of what the relative is. The extrinsics are around 8. I think the full physical parameters are maybe 17 or 18. In this version of vision, there'll be a much more aggressive compression."},{"start":1584.16,"text":"where it goes from the full image to a much smaller encoder. The question is, in the series of rewards that we have, how do we balance between all of these different rewards? There's no good way to do it. That is the real answer. I think it's a very hard problem. The practical way to do it is to add one reward at a time and then try to see what is lacking in the current set of rewards."},{"start":1614.33,"text":"add a new reward, and then tune only that reward relative to every other reward. So instead of this exponential complexity, you can kind of reduce it somewhat to just adding one at a time. But the coefficients we get are probably not the most optimal you can get. So the question is, in input to the policy, we use the current state and the previous action. What if we don't use the previous action? So previous action has a very important signal."},{"start":1644.18,"text":"which is what is the command that I gave in the last time step. This lets you be smooth, consistent, and it also lets you show some amount of correction behavior. So if this action didn't work and you're conditioned on that action, you know that the next action that you have
