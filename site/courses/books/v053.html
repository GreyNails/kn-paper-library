637.19},{"id":185,"text":"and it doesn't respond in the right way. And different models. These days, probably all the models are pretty responsive to instructions. But two years ago, not every model actually responds to your instructions. And it also depends on how you instruct them. And the reason of the change is just that these frontier labs, OpenAI and Tropic, they train the models to be more responsive to your instructions. So they follow your order.","zh":"它就不会以正确的方式回应。不同的模型。如今，可能所有模型都对指令相当敏感。但两年前，并不是每个模型都能真正响应你的指令。这也取决于你如何指导它们。变化的原因仅仅是这些前沿实验室，如OpenAI和Tropic，他们训练模型使其对你的指令更加敏感。因此，它们遵循你的指令。","start":1637.38,"end":1660.96},{"id":186,"text":"And we're going to cover a little bit about image generation. So this is about how to generate a realistic image from noise or from instructions. So this is the diffusion model. We're going to have one lecture on this. So this is also unsurprising because you don't have labels for these images. You just have a lot of realistic.","zh":"我们将简要介绍图像生成。这涉及如何从噪声或指令中生成逼真的图像。这就是扩散模型。我们将安排一节课来讲解这个主题。这也是意料之中的，因为这些图像没有标签，你只是拥有很多逼真的图像。","start":1662.96,"end":1679.9},{"id":187,"text":"image and then you can come up with a model such that you can generate more realistic images. So I think some of these data sets are actually celebrity data sets. I don't know why they use celebrity but apparently you can get a lot of celebrity data sets and you can generate more images which look like celebrities to some degree with the right makeup and the right style and so forth. Very realistic. Anyway, so we have one lecture on this.","zh":"图片，然后你可以建立一个模型，从而生成更逼真的图片。因此，我认为其中一些数据集实际上是名人数据集。我不知道为什么他们使用名人，但显然你可以获得很多名人数据集，并且通过合适的化妆和风格等，可以生成看起来像名人的图片。非常逼真。总之，我们有一个讲座会讲这个。","start":1680.39,"end":1705.03},{"id":188,"text":"So and then we're going to move on to reinforcement learning. So this bullet is what I had three years ago and I just add another bullet. Actually, I didn't make the...","zh":"然后我们将进入强化学习。这个项目符号是我三年前写的，我刚刚添加了一个新的项目符号。实际上，我并没有制作……","start":1706.96,"end":1719.48},{"id":189,"text":"form consistent, I probably should use training. So anyway, so I guess I think the typical way to","zh":"为了保持一致性，我应该使用训练。总之，我想，通常思考强化学习的方式是，这是一个任务，对吧？","start":1719.86,"end":1725.9},{"id":190,"text":"think about reinforcement learning is that you are trying to use, this is a task, right? The","zh":"任务是你要做出一系列决策，对吧？你想要做出决策","start":1725.9,"end":1730.86},{"id":191,"text":"task is that you want to make sequential decisions, right? You want to make decisions","zh":"并进行一系列决策。而典型的应用比如AlphaGo，你知道的，","start":1730.86,"end":1734.24},{"id":192,"text":"and sequential decisions. And the typical applications are like AlphaGo, you know,","zh":"比如学习机器人，你知道的，也许实际上玩这个还挺有趣的，对吧？","start":1734.24,"end":1738.36},{"id":193,"text":"like learning robots, you know, maybe actually it's kind of interesting to play this, right?","zh":"比如学习机器人，你知道的，也许实际上玩这个游戏还挺有趣的，对吧？","start":1738.36,"end":1743.46}],"notes":["本段介绍了机器学习中通用模型的概念，强调这些模型可以处理大规模数据集，并且适用于多种任务，如理解词语之间的关系和文档之间的关系。"],"formulas":[],"uncertainties":["unlabeled（可能应为unlabel）","artworks（可能为artworks的误听，实际应为artworks或artworks的误听）","form consistent（可能为form consistent的误听，实际应为form consistent或form consistent的误听）"],"diagram":"none","start":1564.3,"end":1743.46,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":1564.3,"text":"So basically, the general idea is that it's a general purpose model. Learn how to unlabel a massive data set. And it's general purpose because it's not only for example, before here, what's the purpose here? You are trying to understand which words are similar to the other words. You understand the relationship. So here you are trying to understand the relationship between documents, the relationship between words, and so forth. So that's one task in some sense, or maybe two tasks. But here..."},{"start":1590.41,"text":"When you have large-language models, we have chat GPT. It says, what's the agenda? What's on the agenda today? You can ask anything. I guess that's what they have here. Ask anything. You can ask anything about anything. So it's not only one task or two tasks."},{"start":1608.43,"text":"general purpose models. And we'll cover something about the architecture, what new artworks you're going to use for this kind of like pre-trained large-language models and what are the loss functions people use to train these models. And then we're going to talk about some of the more advanced things like how do you prompt these models or how do you train the models to be more responsive to prompting. So I guess when you use large-language models, you probably have seen that it does depend on how you ask the question. So if you ask the wrong question,"},{"start":1637.38,"text":"and it doesn't respond in the right way. And different models. These days, probably all the models are pretty responsive to instructions. But two years ago, not every model actually responds to your instructions. And it also depends on how you instruct them. And the reason of the change is just that these frontier labs, OpenAI and Tropic, they train the models to be more responsive to your instructions. So they follow your order."},{"start":1662.96,"text":"And we're going to cover a little bit about image generation. So this is about how to generate a realistic image from noise or from instructions. So this is the diffusion model. We're going to have one lecture on this. So this is also unsurprising because you don't have labels for these images. You just have a lot of realistic."},{"start":1680.39,"text":"image and then you can come up with a model such that you can generate more realistic images. So I think some of these data sets are actually celebrity data sets. I don't know why they use celebrity but apparently you can get a lot of celebrity data sets and you can generate more images which look like celebrities to some degree with the right makeup and the right style and so forth. Very realistic. Anyway, so we have one lecture on this."},{"start":1706.96,"text":"So and then we're going to move on to reinforcement learning. So this bullet is what I had three years ago and I just add another bullet. Actually, I didn't make the..."},{"start":1719.86,"text":"form consistent, I probably should use training. So anyway, so I guess I think the typical way to"},{"start":1725.9,"text":"think about reinforcement learning is that you are trying to use, this is a task, right? The"},{"start":1730.86,"text":"task is that you want to make sequential decisions, right? You want to make decisions"},{"start":1734.24,"text":"and sequential decisions. And the typical applications are like AlphaGo, you know,"},{"start":1738.36,"text":"like learning robots, you know, maybe actually it's kind of interesting to play this, right?"}],"speech_gaps":[],"frame":"../frames/v053/010.webp","frame_time":1576.3},{"title":"强化学习与生成模型中的应用","segments":[{"id":194,"text":"So this is at iteration 10, the robots cannot really walk that much. And then eventually,","zh":"所以在第10次迭代时，机器人还不能很好地行走。然后最终，","start":1743.54,"end":1748.7},{"id":195,"text":"you can um oh it i think iteration 20 it doesn't do anything yet and then","zh":"你可以说，在第20次迭代时它仍然没有做出任何动作，然后","start":1749.86,"end":1756.52},{"id":196,"text":"at 80 i think it's walking a little bit","zh":"在第80次迭代时，我想它已经开始稍微行走了一些","start":1757.3,"end":1759.32},{"id":197,"text":"and let me see and i i i remember for this example now it's doing pretty well and okay","zh":"让我看看，我现在记得在这个例子中，它已经表现得相当不错了，好吧","start":1763.8,"end":1772.12},{"id":198,"text":"i know the point here is that this is the sequential decision task because at any moment","zh":"我知道这里的关键点是，这是一个序列决策任务，因为在任何时刻","start":1772.12,"end":1776.2},{"id":199,"text":"You have to decide what actions you take, right?","zh":"你都必须决定采取什么动作，对吧？","start":1776.2,"end":1778.86},{"id":200,"text":"So how do you move your arm?","zh":"那么你是如何移动你的手臂的？","start":1778.92,"end":1780.26},{"id":201,"text":"How do you move the legs?","zh":"你是如何移动你的腿的？","start":1780.34,"end":1782.0},{"id":202,"text":"So and so forth.","zh":"所以等等。","start":1782.02,"end":1782.56},{"id":203,"text":"So every time you have to take an action.","zh":"所以每次你都必须采取一个动作。","start":1782.86,"end":1784.74},{"id":204,"text":"And it's sequential because what actions you take right now does affect your future, right?","zh":"而且它是顺序的，因为你现在采取的动作会影响你的未来，对吧？","start":1784.94,"end":1790.08},{"id":205,"text":"If you take the wrong move, then maybe you cannot recover.","zh":"如果你采取了错误的行动，那么也许你就无法恢复了。","start":1790.14,"end":1792.38},{"id":206,"text":"You're going to fall down and then you can never move again.","zh":"你会摔倒，然后你就再也无法移动了。","start":1792.48,"end":1794.78},{"id":207,"text":"So there's a sequential dependency and there is action aspect.","zh":"因此存在顺序依赖性，也存在动作方面的问题。","start":1795.06,"end":1799.06},{"id":208,"text":"So that's the relatively traditional way to think about reinforcement learning.","zh":"所以这是相对传统的强化学习思维方式。","start":1800.06,"end":1804.4},{"id":209,"text":"But I think these days people also use this as a tool to tune models,","zh":"但我认为现在人们也使用这种方法来调整模型。","start":1804.4,"end":1809.22},{"id":210,"text":"especially when the model have stochastic decisions or stochastic outputs.","zh":"尤其是当模型具有随机决策或随机输出时。","start":1809.42,"end":1813.44},{"id":211,"text":"Probably you know a little bit. You have probably played with ChatGPT or Cloud. So if you ask a question, it will generate a lot of tokens, a lot of text. And some of the text actually not revealed to you because they're saying, I'm thinking. But actually, it does.","zh":"你可能已经知道一些。你可能已经使用过ChatGPT或云服务。所以当你提出一个问题时，它会生成大量的标记，大量的文本。而其中一些文本实际上并没有展示给你，因为它们会说，我在思考。但实际上，它确实如此。","start":1816.41,"end":1829.93},{"id":212,"text":"During the thinking process, it's generating a lot of tokens. And all of these generations are stochastic sampling. So each time you generate a probability distribution, and you sample from the probability distribution one of the words. And then you condition that word, or you give the word back to the model, and then you generate the next word, and you generate the next word, so on and so forth. And each time is a stochastic sampling process. It's not a differentiable operation.","zh":"在思考过程中，它会生成大量的标记。而所有的这些生成过程都是随机采样。每次你生成一个概率分布，并从该概率分布中采样一个词。然后你将该词作为条件，或者将该词反馈给模型，生成下一个词，再生成下一个词，如此循环。每次都是一个随机采样过程。这不是一个可微分的操作。","start":1830.51,"end":1853.45},{"id":213,"text":"So that's why to deal with this kind of generation, you cannot really back prop through it easily. In some cases you can, but in some other cases you cannot. And you have to use reinforced learning, which is a way, is a technique to deal with this kind of stochastic sampling steps in the models. And I think that's, and you can interpret each of the generation step as a decision. And it's a sequential decision because what you generate in the first,","zh":"因此，处理这种生成过程时，你很难直接通过它进行反向传播。在某些情况下可以，但在其他情况下则不行。你必须使用强化学习，这是一种处理模型中随机采样步骤的技术。我认为，你可以将每个生成步骤解释为一个决策。而且这是一个序列决策，因为你在第一个词中生成的内容会影响你在第二个词中生成的内容，依此类推。我认为第一个要点是原始强化学习的方式，第二个则是我们如何用强化学习来处理语言模型，这似乎就是如此。是的，差不多是这样。是的，完全正确。它们并不是根本不同的，也不像彼此矛盾。更准确地说，它们在某种程度上只是略有不同的视角。是的，好的。","start":1855.35,"end":1883.59},{"id":214,"text":"word affects what you generate in the second word, so on and so forth. I think that the first bullet point is how original RL was, and the second is how we're using RL for LL, it seems to me. Yeah, more or less, yes. Yeah, exactly, exactly. They are not fundamentally different. It's not like they are contradictory to each other. It's more like a slightly different kind of viewpoint in some sense. So yeah, OK.","zh":"第一个要点是原始的强化学习方式，第二个则是我们如何将强化学习应用于语言模型，至少对我来说是这样。是的，差不多就是这样。是的，完全正确。它们本质上并不不同。它们之间并不是相互矛盾的。更准确地说，它们只是在某种程度上代表了不同的视角。是的，好的。","start":1883.79,"end":1910.32},{"id":215,"text":"I think another aspect of reinforcement learning is... I guess my automation is broken. So another aspect of the reinforcement learning is that","zh":"我认为强化学习的另一个方面是……我猜我的自动化功能出现了问题。所以强化学习的另一个方面是","start":1911.05,"end":1919.69}],"notes":["本段讲解了强化学习在生成模型中的应用，特别是像ChatGPT这样的模型在生成文本时的随机采样过程。讲者指出，生成过程中的每个步骤都是随机采样，因此无法直接进行反向传播，需要使用强化学习来处理这种随机性。","讲者提到，生成模型中的每个生成步骤都可以视为一个决策过程，这些决策是顺序相关的，即前面的生成结果会影响后续的生成。这种顺序依赖性使得强化学习成为处理这类生成任务的一种有效方法。","讲者强调，强化学习在传统任务和生成模型中的应用并不是根本不同的，而是视角上的差异。传统强化学习关注的是序列决策任务，而生成模型中的应用则是将生成过程视为一系列决策步骤。","讲者指出，生成模型中的随机采样过程使得反向传播变得困难，因此需要使用强化学习来处理这些随机步骤。强化学习提供了一种处理这种随机性的技术手段。","讲者提到，生成模型中的每个生成步骤都涉及概率分布的采样，这与强化学习中的决策过程有相似之处。因此，强化学习可以被用来优化生成模型的输出。","讲者最后总结说，强化学习在生成模型中的应用并不是与传统强化学习相矛盾，而是提供了一种不同的视角，使得生成过程可以被建模为一系列决策步骤。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1743.54,"end":1919.69,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":1743.54,"text":"So this is at iteration 10, the robots cannot really walk that much. And then eventually,"},{"start":1749.86,"text":"you can um oh it i think iteration 20 it doesn't do anything yet and then"},{"start":1757.3,"text":"at 80 i think it's walking a little bit"},{"start":1763.8,"text":"and let me see and i i i remember for this example now it's doing pretty well and okay"},{"start":1772.12,"text":"i know the point here is that this is the sequential decision task because at any moment"},{"start":1776.2,"text":"You have to decide what actions you take, right?"},{"start":1778.92,"text":"So how do you move your arm?"},{"start":1780.34,"text":"How do you move the legs?"},{"start":1782.02,"text":"So and so forth."},{"start":1782.86,"text":"So every time you have to take an action."},{"start":1784.94,"text":"And it's sequential because what actions you take right now does affect your future, right?"},{"start":1790.14,"text":"If you take the wrong move, then maybe you cannot recover."},{"start":1792.48,"text":"You're going to fall down and then you can never move again."},{"start":1795.06,"text":"So there's a sequential dependency and there is action aspect."},{"start":1800.06,"text":"So that's the relatively traditional way to think about reinforcement learning."},{"start":1804.4,"text":"But I think these days people also use this as a tool to tune models,"},{"start":1809.42,"text":"especially when the model have stochastic decisions or stochastic outputs."},{"start":1816.41,"text":"Probably you know a little bit. You have probably played with ChatGPT or Cloud. So if you ask a question, it will generate a lot of tokens, a lot of text. And some of the text actually not revealed to you because they're saying, I'm thinking. But actually, it does."},{"start":1830.51,"text":"During the thinking process, it's generating a lot of tokens. And all of these generations are stochastic sampling. So each time you generate a probability distribution, and you sample from the probability distribution one of the words. And then you condition that word, or you give the word back to the model, and then you generate the next word, and you generate the next word, so on and so forth. And each time is a stochastic sampling process. It's not a differentiable operation."},{"start":1855.35,"text":"So that's why to deal with this kind of generation, you cannot really back prop through it easily. In some cases you can, but in some other cases you cannot. And you have to use reinforced learning, which is a way, is a technique to deal with this kind of stochastic sampling steps in the models. And I think that's, and you can interpret each of the generation step as a decision. And it's a sequential decision because what you generate in the first,"},{"start":1883.79,"text":"word affects what you generate in the second word, so on and so forth. I think that the first bullet point is how original RL was, and the second is how we're using RL for LL, it seems to me. Yeah, more or less, yes. Yeah, exactly, exactly. They are not fundamentally different. It's not like they are contradictory to each other. It's more like a slightly different kind of viewpoint in some sense. So yeah, OK."},{"start":1911.05,"text":"I think another aspect of reinforcement learning is... I guess my automation is broken. So another aspect of the reinforcement learning is that"}],"speech_gaps":[{"start":1813.84,"end":1816.01}],"frame":"../frames/v053/011.webp","frame_time":1755.54},{"title":"强化学习与自生成数据的训练过程","segments":[{"id":216,"text":"It also allows you to collect data interactively. This is also very different from suprathreaded and antiprathreaded. I'm not sure whether you're focused on... I didn't really emphasize those. In all of the suprathreaded and antiprathreaded sections, at least traditionally, you are given a large dataset. And then this is the dataset you work with. And if you're given a bigger one, you're going to work with the bigger one. But your model doesn't generate more data.","zh":"它还允许你交互式地收集数据。这与超线程和反线程也有所不同。我不确定你是否关注……我并没有特别强调这些。在所有关于超线程和反线程的章节中，至少传统上，你会被提供一个大型数据集。然后你使用这个数据集进行工作。如果你被提供更大的数据集，你就会使用更大的那个。但你的模型不会生成更多的数据。","start":1920.22,"end":1944.32},{"id":217,"text":"So the dataset is given. So you can probably try to collect more and more, so on and so forth. That's a different layer. But once you have the data, your model only sees those data. But for reinforcement learning, it's kind of like a trial and error type of algorithm, where you iterate between data collection and training. So you try some strategy and collect feedbacks. For example, you can try how to walk, and you fall down. And even if it falls down, there's still some data you collected. You collect some trajectory.","zh":"因此，数据集是给定的。因此，你可能可以尝试收集越来越多的数据，如此类推。这是不同的一个层次。但一旦你有了数据，你的模型只能看到这些数据。但对于强化学习来说，它更像是一个试错类型的算法，你在数据收集和训练之间进行迭代。你尝试某种策略并收集反馈。例如，你可以尝试如何行走，然后摔倒。即使摔倒了，你仍然收集到了一些数据。你收集了一些轨迹。","start":1945.12,"end":1973.46},{"id":218,"text":"of data, a sequence of actions and observations for the trials. And those are new data for your training for the next round. So you can improve your performance based on the data you collected yourself as opposed to just a given data. Another example is that you can say automatic theorem proving. This is something that I work on quite a bit these days. So you're given some statements. You don't have the proofs.","zh":"这些数据是一系列动作和观察结果的序列，用于试验。这些是用于你下一轮训练的新数据。因此，你可以基于你自己收集的数据来提升性能，而不是仅仅依赖给定的数据。另一个例子是自动定理证明。这是我最近一直在研究的领域。你会被给出一些陈述，但你没有证明。","start":1973.96,"end":2001.26},{"id":219,"text":"But you don't have the proofs.","zh":"但你没有证明。","start":2001.53,"end":2002.71},{"id":220,"text":"But first, you generate some proofs yourself.","zh":"但首先，你自己生成一些证明。","start":2002.71,"end":2004.69},{"id":221,"text":"And you try to verify.","zh":"然后你尝试验证。","start":2005.13,"end":2006.11},{"id":222,"text":"And you select the correct ones.","zh":"然后你选择正确的那些。","start":2006.29,"end":2007.25},{"id":223,"text":"And those are the new training data.","zh":"这些就是新的训练数据。","start":2007.43,"end":2009.01},{"id":224,"text":"And now you have some more training data","zh":"现在你有一些更多的训练数据","start":2009.39,"end":2010.87},{"id":225,"text":"because you generate some of them.","zh":"因为你是生成其中的一部分。","start":2010.87,"end":2012.33},{"id":226,"text":"And then you can tune or reinforce the large language","zh":"然后你可以利用这些正确的证明来调整或增强大型语言模型","start":2012.55,"end":2014.99},{"id":227,"text":"model on the correct proofs with the hope","zh":"希望在增强之后，","start":2014.99,"end":2017.79},{"id":228,"text":"that after you reinforce, then you","zh":"你能够在下一轮生成更多的正确证明。","start":2017.79,"end":2019.25},{"id":229,"text":"can generate more correct proofs in the next round.","zh":"你将获得更多的数据。","start":2019.25,"end":2020.89},{"id":230,"text":"And you get more data.","zh":"下一次，你将在更多的数据上进行调整。","start":2020.99,"end":2021.75},{"id":231,"text":"And the next time, you're going to tune on more data.","zh":"下一次，你将基于更多的数据进行调优。","start":2021.87,"end":2023.59},{"id":232,"text":"And then you keep going.","zh":"然后你继续进行下去。","start":2023.73,"end":2024.77},{"id":233,"text":"And you have a bootstrapping kind of effect.","zh":"你就会产生一种自举效应。","start":2024.91,"end":2026.69},{"id":234,"text":"And the same thing happens for robotics as well,","zh":"同样的情况也适用于机器人学，","start":2027.59,"end":2029.95},{"id":235,"text":"where you can collect more kind of trajectories and then you turn on the good trajectories.","zh":"你可以在其中收集更多的轨迹，然后开启那些好的轨迹。","start":2029.95,"end":2033.83},{"id":236,"text":"And you can also use this for training large language models. And the rough idea is that you","zh":"你也可以将这种方法用于训练大型语言模型。其大致思路是，你有一些输入，例如用户提示，","start":2036.11,"end":2043.61},{"id":237,"text":"have some inputs, which is, for example, user prompt. And the large language model will generate","zh":"大型语言模型会生成大量的文本。然后你可以使用另一个模块，这个模块可以是人类奖励模型或人类奖励模型，","start":2043.61,"end":2047.51},{"id":238,"text":"a lot of text. And then you can have another module, either it's human reward or human reward","zh":"或者是类似于另一个大型语言模型。","start":2047.51,"end":2054.99},{"id":239,"text":"reward model or kind of like another large-language model.","zh":"奖励模型或者类似另一种大型语言模型。","start":2054.99,"end":2058.27},{"id":240,"text":"That's a separate discussion.","zh":"这是另一个讨论话题。","start":2058.47,"end":2059.99},{"id":241,"text":"But there's another module which, given a tax,","zh":"但还有一个模块，给定一个税，","start":2060.15,"end":2062.39},{"id":242,"text":"you generate something called a reward.","zh":"你可以生成一个称为奖励的东西。","start":2062.61,"end":2064.77},{"id":243,"text":"So basically, it's indicating whether this is a good tax or not.","zh":"基本上，它是在指示这个税是否好。","start":2065.03,"end":2067.49},{"id":244,"text":"And you can use this reward as a guidance","zh":"你可以使用这个奖励作为指导","start":2068.03,"end":2070.15},{"id":245,"text":"for updating the large-language model","zh":"来更新大型语言模型","start":2070.15,"end":2071.47},{"id":246,"text":"to generate better tax in the next round.","zh":"以生成下一个回合更好的税。","start":2071.47,"end":2073.15},{"id":247,"text":"And the reason why we use reinforcement here is that","zh":"我们在这里使用强化学习的原因是","start":2073.67,"end":2079.01}],"notes":["本段讲解了强化学习与自生成数据训练过程的核心思想，即模型通过试错机制在数据收集和训练之间迭代。例如，在机器人学习中，模型通过尝试不同的动作并收集反馈数据，逐步改进性能。这种机制与传统监督学习不同，后者通常依赖于给定的静态数据集。","在自动定理证明的例子中，模型首先生成可能的证明，然后通过验证选择正确的证明作为新的训练数据。这种自生成数据的方式使得模型能够不断优化自身，提高生成正确证明的能力。","对于大型语言模型的训练，模型通过用户提示生成大量文本，然后通过奖励模块（如人类奖励模型）对生成的文本进行评估，从而指导模型生成更高质量的输出。这种机制类似于强化学习中的奖励机制。","在训练过程中，模型通过不断收集和利用自生成的数据，实现一种“自举”效应，即通过自身生成的数据不断优化自身性能。这种机制在机器人学习和语言模型训练中都有广泛应用。","课程中提到的“奖励”模块，用于评估模型生成的输出是否符合预期，从而指导模型进行更新。这种机制是强化学习的核心组成部分，通过奖励信号引导模型向更优的方向发展。","整个过程强调了数据收集与模型训练之间的动态交互，模型通过不断尝试、收集反馈、生成新数据并优化自身，实现性能的逐步提升。这种机制在多个领域（如机器人、语言模型）中都有实际应用。"],"formulas":[],"uncertainties":["suprathreaded","antiprathreaded","tax"],"diagram":"none","start":1920.22,"end":2079.01,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":1920.22,"text":"It also allows you to collect data interactively. This is also very different from supra-threaded and antipra-threaded. I'm not sure whether you're focused on... I didn't really emphasize those. In all of the supra-threaded and antipra-threaded sections, at least traditionally, you are given a large dataset. And then this is the dataset you work with. And if you're given a bigger one, you're going to work with the bigger one. But your model doesn't generate more data."},{"start":1945.12,"text":"So the data set is given. So you can probably try to collect more and more, so on and so forth. That's a different layer. But once you have the data, your model only sees those data. But for reinforcement learning, it's kind of like a trial and error type of algorithm, where you iterate between data collection and training. So you try some strategy and collect feedbacks. For example, you can try how to walk, and you fall down. And even if it falls down, there's still some data you collected. You collect some trajectory."},{"start":1973.96,"text":"of data, a sequence of actions and observations for the trials. And those are new data for your training for the next round. So you can improve your performance based on the data you collected yourself as opposed to just a given data. Another example is that you can say automatic theorem proving. This is something that I work on quite a bit these days. So you're given some statements. You don't have the proofs."},{"start":2001.53,"text":"But you don't have the proofs."},{"start":2002.71,"text":"But first, you generate some proofs yourself."},{"start":2005.13,"text":"And you try to verify."},{"start":2006.29,"text":"And you select the correct ones."},{"start":2007.43,"text":"And those are the new training data."},{"start":2009.39,"text":"And now you have some more training data"},{"start":2010.87,"text":"because you generate some of them."},{"start":2012.55,"text":"And then you can tune or reinforce the large language"},{"start":2014.99,"text":"model on the correct proofs with the hope"},{"start":2017.79,"text":"that after you reinforce, then you"},{"start":2019.25,"text":"can generate more correct proofs in the next round."},{"start":2020.99,"text":"And you get more data."},{"start":2021.87,"text":"And the next time, you're going to tune on more data."},{"start":2023.73,"text":"And then you keep going."},{"start":2024.91,"text":"And you have a bootstrapping kind of effect."},{"start":2027.59,"text":"And the same thing happens for robotics as well,"},{"start":2029.95,"text":"where you can collect more kind of trajectories and then you turn on the good trajectories."},{"start":2036.11,"text":"And you can also use this for training large language models. And the rough idea is that you"},{"start":2043.61,"text":"have some inputs, which is, for example, user prompt. And the large language model will generate"},{"start":2047.51,"text":"a lot of text. And then you can have another module, either it's human reward or human reward"},{"start":2054.99,"text":"reward model or kind of like another large-language model."},{"start":2058.47,"text":"That's a separate discussion."},{"start":2060.15,"text":"But there's another module which, given a tax,"},{"start":2062.61,"text":"you generate something called a reward."},{"start":2065.03,"text":"So basically, it's indicating whether this is a good tax or not."},{"start":2068.03,"text":"And you can use this reward as a guidance"},{"start":2070.15,"text":"for updating the large-language model"},{"start":2071.47,"text":"to generate better tax in the next round."},{"start":2073.67,"text":"And the reason why we use reinforcement here is that"}],"speech_gaps":[],"frame":"../frames/v053/012.webp","frame_time":1932.22},{"title":"课程介绍与内容概览","segments":[{"id":248,"text":"It's needed because this whole process is not untrained differentiable in the most traditional sense because the generation requires stochastic sampling. And that's why we're going to talk about how to deal with this case. I think the technique is called policy gradient, and you can use this and extend it. And some of the buzzwords is like ROVR, RO with verified reward, RO with human in the loop, ROHF human.","zh":"这是必要的，因为整个过程在最传统的意义上并不是未经训练的可微分的，因为生成过程需要随机采样。这就是我们接下来要讨论如何处理这种情况的原因。我认为这种技术被称为策略梯度，你可以使用它并进行扩展。一些相关的术语比如ROVR（带验证奖励的强化学习）、带人类参与的强化学习（RO with human in the loop）、ROHF（人类反馈强化学习）。","start":2080.73,"end":2106.37},{"id":249,"text":"Wait, human feedback, yes. And you can use this to train the long chain of thought. These are just buzzwords you don't have to understand. Anyway, so that's probably most of the lectures we're going to cover. And I think on the website, we have a link to the syllabus. This is my internal version. I just take a screenshot. I'm hoping that cloud code can make it more pretty, but it didn't really do the work. So I just have the ugly version. So yeah, anyways.","zh":"对，是人类反馈。你可以使用这种方法来训练长提示链。这些都是你不需要理解的术语。总之，这可能就是我们接下来要讲的大部分内容。我认为在网站上，我们有一个链接到课程大纲。这是我的内部版本。我只是截了张图。我希望云代码能让它更美观一些，但它并没有真正做到这一点。所以我只是保留了丑陋的版本。总之，就这样。","start":2107.02,"end":2136.22},{"id":250,"text":"So this is just summarizing what I have talked about. Yeah, I think we are going to have probably, what I didn't do is that there is another lecture we planned for ML system. So this is about how do you make the software and hardware more compatible. Actually, this is very important because if you can make your algorithm run 2x faster, you're going to save like billions of dollars for OpenAI.","zh":"这仅仅是对我已经讲过的内容进行总结。是的，我想我们可能会有另一堂关于机器学习系统的课程。这讲的是如何让软件和硬件更加兼容。实际上，这非常重要，因为如果你能让算法运行速度快两倍，你就能为OpenAI节省数十亿美元。","start":2136.43,"end":2160.47},{"id":251,"text":"You don't even have to do it 2x faster. You can just do 20% faster. Because everything is so expensive. And even if it's not like saving billions of dollars, it's actually...","zh":"你甚至不需要让它快两倍。你只需要让它快20%就可以了。因为一切都很昂贵。即使它不能节省数十亿美元，实际上……","start":2160.99,"end":2171.21},{"id":252,"text":"Think about it. If I have an algorithm that is 2x faster than you, then it's one year for me and two years for you. And one year versus two years, that's just day and night for these days. So that's why it's very important. And we're going to talk a little bit about... We're trying to find a guest lecturer who can cover fairness and the social impact aspect of AI, which I think will be very important as well. Just because AI is replacing so many jobs.","zh":"想一想。如果我有一个比你快两倍的算法，那么对我来说是一年，对你来说是两年。一年和两年的差距，对于现在来说就是天壤之别。这就是为什么它非常重要。我们接下来会稍微讲一点……我们正在寻找一位客座讲师来讲解公平性和人工智能的社会影响，我认为这也是非常重要的一部分。仅仅因为人工智能正在取代许多工作。","start":2171.85,"end":2200.15},{"id":253,"text":"We have to think about the social impact of them. Yeah, I guess that's the overview for the course.","zh":"我们必须考虑它们的社会影响。是的，我想这就是这门课程的概览。","start":2201.23,"end":2211.65}],"notes":["本段介绍了课程中涉及的强化学习技术，特别是策略梯度方法，以及与之相关的术语如ROVR、RO with human in the loop等。这些术语是课程中提到的关键词汇，但不需要深入理解。","课程内容还包括关于机器学习系统的内容，重点是如何使软件和硬件更加兼容。这部分内容强调了算法效率的重要性，因为提高算法速度可以显著降低计算成本。","课程还提到，即使算法速度提升20%，也能带来显著的效益，因为计算资源昂贵。此外，课程计划邀请嘉宾讲师讨论AI的公平性和社会影响，这是AI技术发展的重要方面。","课程概述中提到，AI正在取代许多工作，因此必须考虑其社会影响。这表明课程不仅关注技术本身，还关注其对社会的潜在影响。","课程内容涵盖了从技术实现到社会影响的广泛主题，体现了机器学习课程的全面性。","课程中提到的术语和概念，如策略梯度、ROVR、RO with human in the loop等，都是强化学习领域的重要概念，需要进一步学习和理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2080.73,"end":2211.65,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2080.73,"text":"It's needed because this whole process is not untrained differentiable in the most traditional sense because the generation requires stochastic sampling. And that's why we're going to talk about how to deal with this case. I think the technique is called policy gradient, and you can use this and extend it. And some of the buzzwords is like ROVR, RO with verified reward, RO with human in the loop, ROHF human."},{"start":2107.02,"text":"wait, human feedback, yes. And you can use this to train the long chain of thought. These are just buzzwords you don't have to understand. Anyway, so that's probably most of the lectures we're going to cover. And I think on the website, we have a link to the syllabus. This is my internal version. I just take a screenshot. I'm hoping that cloud code can make it more pretty, but it didn't really do the work. So I just have the ugly version. So yeah, anyways."},{"start":2136.43,"text":"So this is just summarizing what I have talked about. Yeah, I think we are going to have probably, what I didn't do is that there is another lecture we planned for ML system. So this is about how do you make the software and hardware more compatible. Actually, this is very important because if you can make your algorithm run 2x faster, you're going to save like billions of dollars for OpenAI."},{"start":2160.99,"text":"You don't even have to do it 2x faster. You can just do 20% faster. Because everything is so expensive. And even if it's not like saving billions of dollars, it's actually..."},{"start":2171.85,"text":"Think about it. If I have an algorithm that is 2x faster than you, then it's one year for me and two years for you. And one year versus two years, that's just day and night for these days. So that's why it's very important. And we're going to talk a little bit about... We're trying to find a guest lecturer who can cover fairness and the social impact aspect of AI, which I think will be very important as well. Just because AI is replacing so many jobs."},{"start":2201.23,"text":"We have to think about the social impact of them. Yeah, I guess that's the overview for the course."}],"speech_gaps":[],"frame":"../frames/v053/013.webp","frame_time":2092.73}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v053.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>${point.visual_source?.verified?'原PPT提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p>${point.visual_source?.verified?`<section class="ppt-source"><h3>原PPT对照 · ${esc(point.visual_source.slide_number)}</h3><a href="${esc(point.visual_source.slide_image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.visual_source.slide_image)}" style="width:100%;border:1px solid #ccd9dd;border-radius:8px" alt="原PPT第${esc(point.visual_source.slide_number)}页"></a><p class="muted">已对照本讲视频 ${stamp(point.visual_source.video_time)} 的画面。<a href="${esc(point.visual_source.source_url)}" target="_blank" rel="noopener">原始讲义 PDF</a> · PDF 第 ${point.visual_source.pdf_page} 页</p><p><b>从原页提取：</b>${point.visual_source.items.map(esc).join('；')}</p></section>`:''}<div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(f=>'<p class="muted">'+esc(f.origin||'讲者讲述与既有整理')+'</p>'+formula(f)).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
