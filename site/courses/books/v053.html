</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】课程介绍 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v053.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v053","title":"【斯坦福CS229】课程介绍","course":"机器学习","pages":[{"title":"课程介绍","segments":[{"id":0,"text":"This is a very chill, low-key first lecture as usual. I'm not going to talk about anything deep,","zh":"这是一场非常轻松、低调的第一节课，和往常一样。我不会谈论任何深奥的内容，","start":5.14,"end":10.66},{"id":1,"text":"it's mostly just an introduction about this course and some of the materials that we're","zh":"主要是介绍这门课程以及我们将要涵盖的一些材料，一些我们将要讨论的主题，","start":10.72,"end":16.7},{"id":2,"text":"going to cover, some of the topics we're going to cover, and a very high level introduction","zh":"以及仍然从某种传统视角对机器学习的非常高层次的介绍。所以授课教师，","start":16.7,"end":20.5},{"id":3,"text":"of machine learning still from a somewhat traditional viewpoint. So the teaching staff,","zh":"这就是我和克里斯。我想克里斯今天不在这里，但从下一节课开始他会开始授课。","start":20.5,"end":27.82},{"id":4,"text":"this is me and Chris. I guess Chris is not here today but he will start to teach from the next","zh":"基本上，要么是我，要么是克里斯会来上课授课。","start":27.9,"end":32.7},{"id":5,"text":"lecture. So basically, either me or Chris will come to the lecture to give the lecture.","zh":"我想你可以去找他。我并不一定需要介绍他","start":32.7,"end":38.14},{"id":6,"text":"And I guess you can look him up. I don't necessarily have to introduce him","zh":"他可能自己会做自我介绍，但他致力于各种人工智能大语言模型、效率、数据库，一切事物。","start":39.32,"end":45.72},{"id":7,"text":"He probably has an introduction for himself, but he works a lot on all kinds of AI large language models, efficiency, database, everything.","zh":"他可能自己有一个介绍，但他花了很多时间研究各种AI大语言模型、效率、数据库，以及其他所有内容。","start":46.62,"end":52.44},{"id":8,"text":"of AI large language models, efficiency, database, everything. And in my PhD,","zh":"人工智能大语言模型、效率、数据库，一切。在我的博士期间，","start":52.44,"end":60.54},{"id":9,"text":"I worked a lot on theory for deep learning and over the years I started to work on more empirical stuff.","zh":"我花了很多时间在深度学习的理论方面，多年来我开始更多地从事实证性的工作。","start":60.54,"end":66.36},{"id":10,"text":"So these days I'm working on AI for sciences, AI for math, self-improvement algorithms, and so on and so forth.","zh":"如今，我主要在科学领域、数学领域、自我改进算法等方面从事人工智能的研究，等等。","start":67.34,"end":75.48},{"id":11,"text":"Basically, like training large language models. So prerequisites, right? So I think, as usual, we require some background in probability and linear algebra. And these are some of the CS109 or CS116.","zh":"基本上，就像训练大语言模型一样。那么先决条件呢？所以我认为，和往常一样，我们需要一些概率论和线性代数的背景知识。这些是像CS109或CS116之类的课程。","start":76.03,"end":89.45},{"id":12,"text":"um um this list of like courses might be a little out of date you know there are maybe equivalent courses you know on on campus which i'm not aware of but generally speaking you need to understand some of these buzzwords a little bit you know if you don't know them you can go to the um there's some kind of like uh there's a something called section or there's something called um","zh":"嗯嗯，这个课程列表可能有点过时了，你知道的，校园里可能有类似的课程，我可能不太清楚，但总的来说，你需要对一些术语有一定的了解，你知道的，如果你不知道这些术语，你可以去，嗯，有一种叫做辅导课或者叫做，嗯，","start":90.53,"end":109.37},{"id":13,"text":"Friday TA lectures. So those are for some of the backgrounds that you can learn there. But generally speaking, if you don't know anything about this, you probably should take this course later. But if you are just missing some aspects, then you can come to some of these Friday lectures to catch up with some of the basics.","zh":"周五的助教讲座。这些讲座可以帮助你学习一些背景知识。但总的来说，如果你对这些内容一无所知，你可能应该稍后再选这门课。但如果你只是缺少某些方面，那么你可以参加一些周五的讲座来补上一些基础知识。","start":110.78,"end":132.76},{"id":14,"text":"Yeah, and I think one highlight I would say is that it's still a pretty mathematically intense course. We are trying to teach the basics, in some sense, the foundation of machine learning, not necessarily proving theorems, but just there are derivations, mathematical derivations, mathematical modeling formulations. We focus more on those as opposed to programming. So we try to understand the basics behind the algorithms and the code.","zh":"是的，我认为一个亮点是，这仍然是一门数学要求很高的课程。我们在某种程度上试图教授机器学习的基础知识，而不是证明定理，但这里有一些推导，数学推导和数学建模的表述。我们更侧重于这些内容，而不是编程。因此，我们试图理解算法和代码背后的原理。","start":133.63,"end":162.15},{"id":15,"text":"So probability and linear algebra are pretty important.","zh":"因此，概率论和线性代数非常重要。","start":163.54,"end":166.24}],"notes":["本段主要介绍了课程的背景和教学安排，包括授课教师的介绍以及课程的数学强度。课程由两位教师轮流授课，其中一位教师专注于人工智能领域，包括大语言模型、效率、数据库等，另一位教师则专注于深度学习理论和经验研究。课程要求学生具备概率和线性代数的基础知识，并提到可以通过周五的辅导讲座来补充相关背景知识。","本段强调了课程的数学强度，指出课程重点在于机器学习的基础知识和数学推导，而不是编程。课程旨在帮助学生理解算法背后的数学原理和建模方法，而不是仅仅关注代码实现。","本段提到课程的先修知识要求，包括概率和线性代数，以及相关的课程如CS109或CS116。同时，课程提供周五的辅导讲座，帮助学生补充基础知识，但建议没有相关背景的学生先修读相关课程。","本段还提到课程的数学内容较为深入，涉及数学推导和建模，但不强调定理证明。课程的目标是让学生理解算法背后的数学原理，而不是仅仅关注编程实现。","本段提到课程的数学强度较高，但强调课程的重点在于理解算法背后的数学原理，而不是编程。课程内容包括概率和线性代数，这些是课程的重要基础。","本段还提到课程的辅导讲座安排，学生可以通过这些讲座来补充相关背景知识，但建议没有相关背景的学生先修读相关课程。"],"formulas":[],"uncertainties":["um um this list of like courses might be a little out of date you know there are maybe equivalent courses you know on on campus which i'm not aware of but generally speaking you need to understand some of these buzzwords a little bit you know if you don't know them you can go to the um there's some kind of like uh there's a something called section or there's something called um"],"diagram":"none","start":5.14,"end":166.24,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":5.14,"text":"This is a very chill, low-key first lecture as usual. I'm not going to talk about anything deep,"},{"start":10.72,"text":"it's mostly just an introduction about this course and some of the materials that we're"},{"start":16.7,"text":"going to cover, some of the topics we're going to cover, and a very high level introduction"},{"start":20.5,"text":"of machine learning still from a somewhat traditional viewpoint. So the teaching staff,"},{"start":27.9,"text":"this is me and Chris. I guess Chris is not here today but he will start to teach from the next"},{"start":32.7,"text":"lecture. So basically, either me or Chris will come to the lecture to give the lecture."},{"start":39.32,"text":"And I guess you can look him up. I don't necessarily have to introduce him"},{"start":46.62,"text":"that much. He probably have an introduction for himself, but he works a lot on all kind"},{"start":52.44,"text":"of AI large language models, efficiency, database, everything. And in my PhD,"},{"start":60.54,"text":"I worked a lot on theory for deep learning and over the years I started to work on more empirical stuff."},{"start":67.34,"text":"So these days I'm working on AI for sciences, AI for math, self-improvement algorithms, and so on and so forth."},{"start":76.03,"text":"Basically, like training large language models. So prerequisites, right? So I think, as usual, we require some background in probability and linear algebra. And these are some of the CS109 or CS116."},{"start":90.53,"text":"um um this list of like courses might be a little out of date you know there are maybe equivalent courses you know on on campus which i'm not aware of but generally speaking you need to understand some of these buzzwords a little bit you know if you don't know them you can go to the um there's some kind of like uh there's a something called section or there's something called um"},{"start":110.78,"text":"Friday TA lectures. So those are for some of the backgrounds that you can learn there. But generally speaking, if you don't know anything about this, you probably should take this course later. But if you are just missing some aspects, then you can come to some of these Friday lectures to catch up with some of the basics."},{"start":133.63,"text":"Yeah, and I think one highlight I would say is that it's still a pretty mathematically intense course. We are trying to teach the basics, in some sense, the foundation of machine learning, not necessarily proving theorems, but just there are derivations, mathematical derivations, mathematical modeling formulations. We focus more on those as opposed to programming. So we try to understand the basics behind the algorithms and the code."},{"start":163.54,"text":"So probability and linear algebra are pretty important."}],"speech_gaps":[],"frame":"../frames/v053/001.webp","frame_time":17.14},{"title":"课程介绍与学习目标","segments":[{"id":16,"text":"for understanding some of this. So AI tools policy which is increasingly important these days. I use AI tools every day. So we do allow you to use tools but there are some restrictions. For example, you cannot copy the results from the tools to your submission. So in some sense, you can just only use them as a human collaborator. As if they are human collaborator or maybe superhuman collaborator but not like let them","zh":"为了理解其中的一些内容。因此，AI工具策略，这在当今越来越重要。我每天都会使用AI工具。因此，我们允许你们使用工具，但有一些限制。例如，你们不能将工具的结果复制到你们的提交中。因此，在某种意义上，你们只能将它们当作一个人类合作者来使用。就像它们是人类合作者，或者可能是超人类合作者，但不能让它们","start":167.99,"end":197.05},{"id":17,"text":"generate codes that directly go into your questions. So there are a lot more details on the website, and we're happy to clarify if there are any questions. So this rule probably sounds a little bit restrictive to some degree, but I think this is to, in some sense...","zh":"直接生成代码，这些代码可以直接用于你们的问题。因此，网站上有很多更多细节，如果有任何问题，我们很乐意澄清。因此，这个规则听起来可能对某些人来说有点限制性，但我认为这是为了，在某种意义上……","start":197.29,"end":216.41},{"id":18,"text":"what's the right word like to encourage you or to enforce the learning like the updates of your brain where you're if you're just training like if you're building an agent that the agents understands the materials then you probably don't have to take this course right so this is more about not about training your own agent it's about training yourself like your synopsis so","zh":"什么是正确的词，比如鼓励你们或加强学习，就像你们大脑的更新，如果你们只是训练，就像你们在构建一个代理，如果代理理解了材料，那么你们可能就不需要上这门课了，所以这更多是关于训练你们自己，而不是训练你们自己的代理，而是训练你们自己，比如你们的摘要，所以","start":218.25,"end":238.21},{"id":19,"text":"at least that's my interpretation so far. But we are still taking a somewhat kind of like relatively traditional approach to think about machine learning which I think still applies because you know I think in terms of in my probably biased view I think the","zh":"至少这是我目前的理解。但我们在思考机器学习时，仍然采取了一种相对传统的思路，我认为这仍然适用，因为我知道，在我可能有偏见的观点中，我认为训练模型的方法论仍然与过去非常相似。但我们现在使用模型的方式却非常不同。例如，在过去，如果你们在公司中使用机器学习，你们必须","start":239.75,"end":254.37},{"id":20,"text":"the methodology of training the models are still very similar to the old days. But the way we are using the models are very different. So for example, in the old days, I think if you use the machine learning in a company, you have to","zh":"建立复杂的流水线，获取数据，训练模型，等等。但现在，你们只需提示。你们只需直接提问。你们在云代码中建立一些技能，如此等等。因此，我认为我们可能不会过多地关注使用这些模型。我们不会教太多关于如何使用云代码来编写代码的内容。但我们更关注如何训练，什么是训练这些模型的基本技术。","start":255.77,"end":271.93},{"id":21,"text":"get complicated pipelines, get the data, train the models, and so forth. But now, you just prompt. You just ask questions directly. You build some skills in cloud code, so on and so forth. So I think we are probably not going to focus too much on using these models. We are not going to teach that much about how to use cloud code to write code. But we are more focusing on how to train, what's the fundamental technology to train these models.","zh":"得到复杂的流水线，获取数据，训练模型，等等。但现在，你只需提示。你只需直接提问。你构建一些云代码的技能，如此等等。因此，我认为我们可能不会过多地关注使用这些模型。我们不会教太多关于如何使用云代码来编写代码的内容。但我们更关注如何训练，什么是训练这些模型的基本技术。","start":272.35,"end":299.77},{"id":22,"text":"So that's why I think most of the existing content still apply. We did drop some of the outdated stuff. And when I was reviewing some of these lectures just last week, I found surprisingly some of these definitions still kind of host. This is 1959. It's basically like ages ago for machine learning. But somehow the definition still seems to be pretty much","zh":"所以这就是为什么我认为大部分现有内容仍然适用。我们删除了一些过时的内容。上周当我回顾一些这些讲座时，我发现令人惊讶的是，其中一些定义仍然大致适用。这是1959年，对于机器学习来说基本上已经是很久以前的事了。但不知为何，这些定义似乎仍然基本适用","start":300.52,"end":329.28}],"notes":["本段主要介绍了课程中关于AI工具使用的政策，强调学生可以使用AI工具，但不能直接复制工具生成的结果到提交内容中，而是应将其视为人类协作伙伴。这体现了课程对学术诚信的重视。","讲者提到课程内容虽然采用相对传统的机器学习方法，但实际应用方式已发生巨大变化，例如从复杂的流水线到直接提问和使用云代码。这表明课程内容在保持基础理论的同时，也关注实际应用的最新趋势。","课程目标是训练学生自身，而非训练自己的代理模型。这表明课程更注重学生的理解与学习过程，而非单纯的技术实现。","讲者指出尽管机器学习已有几十年历史，但某些定义和方法仍然适用，这说明基础理论在机器学习领域具有持久性。","课程内容虽有所更新，但大部分仍适用，这表明课程在保持核心概念的同时，也进行了适当的调整。","讲者提到课程不会过多关注如何使用云代码编写代码，而是更关注如何训练模型，这表明课程的重点在于理解训练模型的基本技术，而非具体实现工具的使用。"],"formulas":[],"uncertainties":["host"],"diagram":"none","start":167.99,"end":329.28,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":167.99,"text":"for understanding some of this. So AI tools policy which is increasingly important these days. I use AI tools every day. So we do allow you to use tools but there are some restrictions. For example, you cannot copy the results from the tools to your submission. So in some sense, you can just only use them as a human collaborator. As if they are human collaborator or maybe superhuman collaborator but not like let them"},{"start":197.29,"text":"generate codes that directly go into your questions. So there are a lot more details on the website, and we're happy to clarify if there are any questions. So this rule probably sounds a little bit restrictive to some degree, but I think this is to, in some sense..."},{"start":218.25,"text":"what's the right word like to encourage you or to enforce the learning like the updates of your brain where you're if you're just training like if you're building an agent that the agents understands the materials then you probably don't have to take this course right so this is more about not about training your own agent it's about training yourself like your synopsis so"},{"start":239.75,"text":"at least that's my interpretation so far. But we are still taking a somewhat kind of like relatively traditional approach to think about machine learning which I think still applies because you know I think in terms of in my probably biased view I think the"},{"start":255.77,"text":"the methodology of training the models are still very similar to the old days. But the way we are using the models are very different. So for example, in the old days, I think if you use the machine learning in a company, you have to"},{"start":272.35,"text":"get complicated pipelines, get the data, train the models, and so forth. But now, you just prompt. You just ask questions directly. You build some skills in cloud code, so on and so forth. So I think we are probably not going to focus too much on using these models. We are not going to teach that much about how to use cloud code to write code. But we are more focusing on how to train, what's the fundamental technology to train these models."},{"start":300.52,"text":"So that's why I think most of the existing content still apply. We did drop some of the outdated stuff. And when I was reviewing some of these lectures just last week, I found surprisingly some of these definitions still kind of host. This is 1959. It's basically like ages ago for machine learning. But somehow the definition still seems to be pretty much"}],"speech_gaps":[],"frame":"../frames/v053/002.webp","frame_time":179.99},{"title":"课程介绍与机器学习定义","segments":[{"id":23,"text":"the right thing. Machine learning is a field of study that gives computers the ability to learn without being explicitly programmed. I think at that time, I think explicit programming means that you program some kind of code to play chess. And that's what explicit programming means. And learning means that you somehow use some data and you train some model to predict or to make the decisions on what moves you should make.","zh":"正确的做法。机器学习是一个研究领域，它赋予计算机在没有明确编程的情况下学习的能力。我想在那个时候，我认为明确的编程意味着编写某种代码来下棋。这就是明确编程的含义。而学习意味着你通过某种方式使用一些数据，并训练一个模型来预测或做出你应该采取的移动决策。","start":329.71,"end":355.61},{"id":24,"text":"And then in 1998, that's like 28 years ago, so Tom Mitchell, he's a professor at CMU, he said that computer programming starts to learn from experiences E with respect to some class of tasks T and performance measure P. If it's performance at tasks T, at tasks...","zh":"然后在1998年，这已经是在28年前的事了，所以Tom Mitchell，他是卡内基梅隆大学的教授，他说计算机编程开始从经验E中学习，以完成某个任务类别T和性能度量P。如果它在任务T上的表现，以P来衡量，随着经验E而提升。","start":357.0,"end":379.43},{"id":25,"text":"T as measured by P improves with the experience E.","zh":"T 以 P 为标准的性能随着经验 E 而提升。","start":379.84,"end":382.92},{"id":26,"text":"I think there's probably a small typo there.","zh":"我想那里可能有一个小的拼写错误。","start":383.12,"end":385.52},{"id":27,"text":"Anyway, so I think this definition is very interesting","zh":"无论如何，我认为这个定义非常有趣。","start":385.96,"end":389.52},{"id":28,"text":"because it mentions a few important components here,","zh":"因为它提到了这里的一些重要组成部分，","start":389.52,"end":392.04},{"id":29,"text":"or concepts here.","zh":"或者说是概念。","start":392.74,"end":394.04},{"id":30,"text":"One is experiences.","zh":"其中一个就是经验。","start":394.18,"end":394.94},{"id":31,"text":"This is kind of like a different way to say data.","zh":"这有点像另一种说法，即数据。","start":395.26,"end":397.14},{"id":32,"text":"And these days, experiences is even more broad","zh":"如今，经验的范围甚至更广。","start":397.58,"end":400.28},{"id":33,"text":"because they are synthetic data you generate in the thinking","zh":"因为它们是你在思考中生成的合成数据。","start":400.28,"end":403.96},{"id":34,"text":"tokens.","zh":"标记。","start":403.96,"end":404.34},{"id":35,"text":"I'm not sure whether you're all familiar with that,","zh":"我不确定你们是否都熟悉这一点，","start":404.68,"end":406.36},{"id":36,"text":"but like the thinking tokens generated by the models. There are data from the web,","zh":"比如模型生成的思考标记。","start":406.36,"end":411.94},{"id":37,"text":"there are data from the real world, there are human label data. All of these are experiences.","zh":"有来自网络的数据，有来自现实世界的数据，还有人工标注的数据。所有这些都是经验。","start":412.06,"end":415.84},{"id":38,"text":"And tasks. In the old days, the tasks are very specific. You have an image classification,","zh":"还有任务。过去，任务非常具体。你有一个图像分类，","start":417.16,"end":421.86},{"id":39,"text":"you have some kind of price prediction problem, so on and so forth. Each of them is a task.","zh":"你有一些价格预测的问题，诸如此类。每一个都是一个任务。","start":422.38,"end":428.22},{"id":40,"text":"These days, you still have tasks, the concept of tasks, but it's more general purpose. You","zh":"如今，你仍然有任务，任务的概念，但它是更通用的。你","start":428.5,"end":433.2},{"id":41,"text":"you can solve like you have one model that can solve a million tasks and there's performance","zh":"你可以解决，就像你有一个模型可以解决一百万个任务，并且有性能","start":433.2,"end":437.34},{"id":42,"text":"measure p which is also very important because this is the accuracy you know so and so forth","zh":"度量 p，这也是非常重要的，因为这就是你所知道的准确性，诸如此类","start":437.34,"end":441.9},{"id":43,"text":"because you need we do need a goal in some sense to drive the learning of these models and I think","zh":"因为你需要在某种意义上有一个目标来驱动这些模型的学习，我认为","start":441.9,"end":448.92},{"id":44,"text":"I think also what after","zh":"我认为还有什么是之后","start":448.92,"end":451.7},{"id":45,"text":"In the if clause, I think it's trying to emphasize that this model seems to be better and better if you train for longer and longer with more and more data. And that's a very important thing for learning. So if you have more data, it's not improving, then it's not learning. So I guess for games, experience is data. The performance metrics, the winning rate, and the task is just the game.","zh":"在 if 条件中，我认为它试图强调，这个模型似乎在你用更长的时间和更多的数据进行训练时会变得越来越好。这是学习中非常重要的事情。所以如果你有更多的数据，它并没有改进，那么它就没有在学习。因此，我想在游戏里，经验就是数据。性能指标，比如获胜率，以及任务就是游戏本身。","start":452.32,"end":477.58},{"id":46,"text":"So these are the broad definition. Let's try to kind of like break down a little bit. So if you have a taxonomy, I don't think there's a consensus on what's the right taxonomy. I think the field is moving so far so that there's no really consensus on anything because there's no even time to reach a consensus in some sense.","zh":"因此，这些是广义的定义。让我们尝试稍微分解一下。如果你有一个分类学，我认为还没有关于什么是正确分类学的共识。我认为这个领域发展得太快了，以至于在某种程度上，没有任何共识，甚至连达成共识的时间都没有。","start":479.76,"end":497.98}],"notes":["本段主要讲解机器学习的基本定义，强调学习与传统编程的区别。讲者指出，机器学习是让计算机通过经验来学习，而不是显式编程。传统编程如下棋需要编写代码，而机器学习则是通过数据训练模型进行决策。","讲者提到Tom Mitchell在1998年提出的机器学习定义，其中包含三个关键要素：任务T、经验E和性能度量P。讲者指出，经验E可以是真实数据、合成数据或模型生成的token，而任务T可以是图像分类、价格预测等具体任务，也可以是更通用的多任务。","讲者强调性能度量P的重要性，认为它是驱动模型学习的目标。例如，在游戏中，性能度量可以是胜率，而任务就是游戏本身。","讲者指出，随着机器学习的发展，任务的概念变得更加通用，一个模型可以解决多种任务。同时，经验E的范围也扩大，包括从网络、现实世界和人类标注数据中获取的信息。","讲者提到，机器学习的定义中强调了经验对性能的提升作用，即随着数据量的增加，模型的性能应有所提高。如果模型在获得更多数据后没有改善，则说明它没有真正学习。","最后，讲者指出机器学习领域尚无统一的分类体系，因为该领域发展迅速，尚未有足够的时间形成共识。"],"formulas":[],"uncertainties":["measure p which is also very important because this is the accuracy you know so and so forth"],"diagram":"none","start":329.71,"end":497.98,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":329.71,"text":"the right thing. Machine learning is a field of study that gives computers the ability to learn without being explicitly programmed. I think at that time, I think explicit programming means that you program some kind of code to play chess. And that's what explicit programming means. And learning means that you somehow use some data and you train some model to predict or to make the decisions on what moves you should make."},{"start":357.0,"text":"And then in 1998, that's like 28 years ago, so Tom Mitchell, he's a professor at CMU, he said that computer programming starts to learn from experiences E with respect to some class of tasks T and performance measure P. If it's performance at tasks T, at tasks..."},{"start":379.84,"text":"T as measured by P improves with the experience E."},{"start":383.12,"text":"I think there's probably a small typo there."},{"start":385.96,"text":"Anyway, so I think this definition is very interesting"},{"start":389.52,"text":"because it mentions a few important components here,"},{"start":392.74,"text":"or concepts here."},{"start":394.18,"text":"One is experiences."},{"start":395.26,"text":"This is kind of like a different way to say data."},{"start":397.58,"text":"And these days, experiences is even more broad"},{"start":400.28,"text":"because they are synthetic data you generate in the thinking"},{"start":403.96,"text":"tokens."},{"start":404.68,"text":"I'm not sure whether you're all familiar with that,"},{"start":406.36,"text":"but like the thinking tokens generated by the models. There are data from the web,"},{"start":412.06,"text":"there are data from the real world, there are human label data. All of these are experiences."},{"start":417.16,"text":"And tasks. In the old days, the tasks are very specific. You have an image classification,"},{"start":422.38,"text":"you have some kind of price prediction problem, so on and so forth. Each of them is a task."},{"start":428.5,"text":"These days, you still have tasks, the concept of tasks, but it's more general purpose. You"},{"start":433.2,"text":"you can solve like you have one model that can solve a million tasks and there's performance"},{"start":437.34,"text":"measure p which is also very important because this is the accuracy you know so and so forth"},{"start":441.9,"text":"because you need we do need a goal in some sense to drive the learning of these models and I think"},{"start":448.92,"text":"I think also what after"},{"start":452.32,"text":"In the if clause, I think it's trying to emphasize that this model seems to be better and better if you train for longer and longer with more and more data. And that's a very important thing for learning. So if you have more data, it's not improving, then it's not learning. So I guess for games, experience is data. The performance metrics, the winning rate, and the task is just the game."},{"start":479.76,"text":"So these are the broad definition. Let's try to kind of like break down a little bit. So if you have a taxonomy, I don't think there's a consensus on what's the right taxonomy. I think the field is moving so far so that there's no really consensus on anything because there's no even time to reach a consensus in some sense."}],"speech_gaps":[],"frame":"../frames/v053/003.webp","frame_time":341.71},{"title":"机器学习课程介绍与监督学习基础","segments":[{"id":47,"text":"At the moment you reach a consensus, the thing you are trying to have a consensus on is no longer important. So it's because people have moved to different techniques. But these kind of things, at least if you quote me on how do I classify machine learning techniques, nobody will find crazy. So I'm not saying this is a universal ground truth, but this is a reasonable view. So I think you have supervised learning, unsupervised learning, and reinforcement learning.","zh":"当你达成共识的那一刻，你正在试图达成共识的事情已经不再重要了。所以这是因为人们转向了不同的技术。但这些事情，至少如果你引用我来分类机器学习技术，没有人会觉得疯狂。因此，我并不是说这是普遍的真理，但这是一个合理的观点。因此，我认为你有监督学习、无监督学习和强化学习。","start":499.93,"end":526.19},{"id":48,"text":"And of course, there are a lot of intersections and even more intersections these days. And also, you can think of this as tasks. You can also think of this as tools or methods. So especially these days, I think the tasks...","zh":"当然，还存在很多交叉点，甚至现在更多。你也可以将这些视为任务，也可以将它们视为工具或方法。因此，我认为现在更多的是任务","start":527.65,"end":544.31},{"id":49,"text":"I think people mostly think of these as problem methods or paradigms as opposed to the end goal. Because in some sense, nobody has the end goal of just doing supervised learning for one task. So the end goal is always having general purpose, automatic learning kind of agents, so on and so forth. But supervised learning is still used in building these agents. So you probably heard of the word SFT, that's called supervised.","zh":"我认为人们大多将这些视为问题的方法或范式，而不是最终目标。因为在某种意义上，没有人仅仅为了一个任务做监督学习的最终目标。因此，最终目标总是拥有通用的、自动学习的智能体，等等。但监督学习仍然被用于构建这些智能体。因此，你可能听说过SFT这个词，这被称为监督学习。","start":544.96,"end":569.86},{"id":50,"text":"fine-tuning, which is one form of supervised learning. But they are more like tools but not end goals. Anyway, I'm going to introduce all of this a little bit on a high level. So I guess, you know, supervised learning, maybe let's think about this, you know,","zh":"微调，这是监督学习的一种形式。但它们更像是工具而不是最终目标。无论如何，我将在一个较高的层面上介绍所有这些内容。因此，我想，你可能知道，监督学习，也许让我们思考一下，你知道，","start":570.49,"end":586.21},{"id":51,"text":"15 years ago, if you study machine learning, this is probably one of the interesting applications, house price prediction. So given that I said it contains some examples and you want to predict what's the price for the house. So basically, it's kind of like each example is one property and you have like x axis is the square feet and y axis is the price. So given the square feet, you want to predict the price.","zh":"15年前，如果你学习机器学习，这可能是其中一个有趣的应用，即房价预测。因此，给定我说过它包含一些例子，你想预测房子的价格。因此，基本上，每个例子是一个属性，你有x轴是平方英尺，y轴是价格。因此，给定平方英尺，你想预测价格。","start":587.14,"end":608.92},{"id":52,"text":"And if this is the only thing you are given, then I'm going to introduce some mathematical notation which we're going to use throughout the lecture. Of course, we're going to remind you about the notation. So often x is used to denote inputs, y is used to denote output. So here square feet is the input and price is the output. And you have many","zh":"如果你只被给予这些，那么我将介绍一些我们将贯穿整个课程使用的数学符号。当然，我们会提醒你关于符号的使用。通常，x用于表示输入，y用于表示输出。因此，平方英尺是输入，价格是输出。你有多个","start":609.61,"end":630.13},{"id":53,"text":"And when you test it, you just say I have an x and I want to know what is the corresponding y. And as you can imagine, the simplest way is that you just fit some line and then when you predict, you just say you read off the value of the line at the position of x is equal to 800.","zh":"当你测试它时，你只需说：我有一个x，我想知道对应的y是什么。正如你可以想象的那样，最简单的方法是拟合一条直线，然后当你进行预测时，你只需读取x等于800时直线上对应值。","start":631.07,"end":658.47},{"id":54,"text":"And in this case, probably fitting a square,","zh":"在这种情况下，可能更适合拟合一个平方","start":659.64,"end":662.2},{"id":55,"text":"quadratic functions are better, then","zh":"二次函数会更好，然后","start":662.36,"end":664.28},{"id":56,"text":"you get a different prediction.","zh":"你会得到不同的预测结果。","start":664.28,"end":665.1},{"id":57,"text":"And in lecture two and three, I think","zh":"在第二讲和第三讲中，我想","start":666.74,"end":668.62},{"id":58,"text":"we're going to cover some of this,","zh":"我们会涵盖一些相关内容，","start":668.62,"end":669.58},{"id":59,"text":"how to fit a linear or quadratic functions to a data","zh":"如何将线性或二次函数拟合到数据集上，以及训练算法是什么。","start":669.66,"end":672.02},{"id":60,"text":"set, and what are the training algorithms,","zh":"以及训练算法是什么。","start":672.02,"end":673.82},{"id":61,"text":"what's the optimizers, what's the loss functions,","zh":"什么是优化器，什么是损失函数，","start":674.06,"end":676.04}],"notes":["本段主要介绍了监督学习的基本概念，以房屋价格预测为例，说明监督学习中输入和输出的对应关系。输入是房屋的面积（平方英尺），输出是价格。通过拟合一条直线或二次函数，可以预测给定面积的房屋价格。","讲者提到监督学习是构建通用学习代理的重要工具之一，但不是最终目标。最终目标是实现具有通用性和自动学习能力的智能体。","在监督学习中，输入和输出通常用x和y表示，每个数据点是一个输入-输出对。测试时，给定输入x，需要预测对应的输出y。","讲者提到在监督学习中，拟合线性或二次函数是常见的方法，不同的函数形式会导致不同的预测结果。","接下来的课程内容将涉及如何拟合线性或二次函数到数据集，以及训练算法、优化器和损失函数等内容。","讲者强调监督学习是机器学习的一个重要分支，但并非唯一的方法，还有无监督学习和强化学习等其他类型。"],"formulas":[],"uncertainties":["fit some line"],"diagram":"none","start":499.93,"end":676.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":499.93,"text":"At the moment you reach a consensus, the thing you are trying to have a consensus on is no longer important. So it's because people have moved to different techniques. But these kind of things, at least if you quote me on how do I classify machine learning techniques, nobody will find crazy. So I'm not saying this is a universal ground truth, but this is a reasonable view. So I think you have supervised learning, unsupervised learning, and reinforcement learning."},{"start":527.65,"text":"And of course, there are a lot of intersections and even more intersections these days. And also, you can think of this as tasks. You can also think of this as tools or methods. So especially these days, I think the tasks..."},{"start":544.96,"text":"I think people mostly think of these as problem methods or paradigms as opposed to the end goal. Because in some sense, nobody has the end goal of just doing supervised learning for one task. So the end goal is always having general purpose, automatic learning kind of agents, so on and so forth. But supervised learning is still used in building these agents. So you probably heard of the word SFT, that's called supervised."},{"start":570.49,"text":"fine-tuning, which is one form of supervised learning. But they are more like tools but not end goals. Anyway, I'm going to introduce all of this a little bit on a high level. So I guess, you know, supervised learning, maybe let's think about this, you know,"},{"start":587.14,"text":"15 years ago, if you study machine learning, this is probably one of the interesting applications, house price prediction. So given that I said it contains some examples and you want to predict what's the price for the house. So basically, it's kind of like each example is one property and you have like x axis is the square feet and y axis is the price. So given the square feet, you want to predict the price."},{"start":609.61,"text":"And if this is the only thing you are given, then I'm going to introduce some mathematical notation which we're going to use throughout the lecture. Of course, we're going to remind you about the notation. So often x is used to denote inputs, y is used to denote output. So here square feet is the input and price is the output. And you have many"},{"start":631.07,"text":"pairs of this because you have many properties and each property is a point and the question is just that if it has x square feet, what's the price? And when you test it, you just say I have an x and I want to know what is the corresponding y. And as you can imagine, the simplest way is that you just fade some line and then when you predict, you just say you read off the value of the line at the position of x is equal to 800."},{"start":659.64,"text":"And in this case, probably fitting a square,"},{"start":662.36,"text":"quadratic functions are better, then"},{"start":664.28,"text":"you get a different prediction."},{"start":666.74,"text":"And in lecture two and three, I think"},{"start":668.62,"text":"we're going to cover some of this,"},{"start":669.66,"text":"how to fit a linear or quadratic functions to a data"},{"start":672.02,"text":"set, and what are the training algorithms,"},{"start":674.06,"text":"what's the optimizers, what's the loss functions,"}],"speech_gaps":[],"frame":"../frames/v053/004.webp","frame_time":511.93},{"title":"机器学习课程介绍：概念与分类问题","segments":[{"id":62,"text":"and what's the algorithms, so on and so forth.","zh":"还有各种算法，诸如此类的问题。","start":677.02,"end":681.54},{"id":63,"text":"So of course, this is very simplistic","zh":"当然，这非常简单化","start":681.98,"end":684.9},{"id":64,"text":"because it's not only about the square feet.","zh":"因为它不仅仅关于平方英尺。","start":684.9,"end":686.74},{"id":65,"text":"you know, you probably also need to know the load size. Then you have a two-dimensional problem.","zh":"你知道的，你可能还需要知道负载大小。然后你就有了一个二维问题。","start":686.74,"end":691.06},{"id":66,"text":"Now we have x1, x2 as inputs and you have y. And now if you visualize you are in 3D settings.","zh":"现在我们有x1, x2作为输入，你有y。现在如果你可视化，你就在三维环境中。","start":691.28,"end":696.24},{"id":67,"text":"And just to clarify some of the notations or the complex, sorry, the wording. So in machine","zh":"为了澄清一些符号或复杂，抱歉，是措辞。所以在机器","start":697.5,"end":709.58},{"id":68,"text":"learning, every concept has probably more than one name. There's so much confusions in the past.","zh":"学习中，每个概念可能都有不止一个名称。过去存在很多混淆。","start":709.58,"end":717.84},{"id":69,"text":"Now actually, there are fewer confusions because some of these words are no longer used.","zh":"现在实际上混淆更少了，因为其中一些词汇不再被使用。","start":718.16,"end":721.88},{"id":70,"text":"In the old days, I think features and inputs are both referring to the values you are given.","zh":"以前，我认为特征和输入都指的是你被给出的值。","start":722.1,"end":728.06},{"id":71,"text":"And the price is the output you want to predict. And also sometimes people call it labels.","zh":"而价格是你想要预测的输出。有时人们也称其为标签。","start":728.44,"end":733.74},{"id":72,"text":"I think I just tend to use input and output these days to avoid kind of like the confusion.","zh":"我觉得我现在更倾向于使用输入和输出这两个词，以避免一些混淆。","start":733.74,"end":740.46},{"id":73,"text":"But sometimes people still use the word labeling, which means that you give a label or give","zh":"但有时人们仍然使用‘标签’这个词，这意味着你给出一个标签或设计一个输出，你知道的，为特定的输入提供输出，对吧？","start":740.74,"end":746.1},{"id":74,"text":"a design output, you know, to you provide the output for certain input, right?","zh":"你可以有由人类提供的标签，也可以有由机器提供的标签，等等。","start":746.1,"end":753.48},{"id":75,"text":"You can have human labels, you can have machine labels and so on and so forth.","zh":"好的。还有一个关于输出类型的概念，称为回归与分类。如果输出是一个连续变量，例如价格，那么它被称为回归。如果输出是一个离散变量，例如标签，比如火烈鸟，例如你可以用某种文本对图像进行标签化。如果输出是文本，那么它就是一个离散的概念。","start":753.5,"end":755.78},{"id":76,"text":"Okay. And there's a concept about the output type. And it's called regression versus classification. So if the output is a continuous variable, for example, price, then it's called regression. So if the output is a discrete variable, for example, a label, something like flamingo, for example, you can label the image with some kind of text. So if the output is a text, then it's a discrete concept.","zh":"它被称为标签。将标签分配给输入的问题称为分类。例如，如果你试图判断它是房子还是联排别墅，那么这就是两个离散变量。然后它就是一个有两个选项的离散变量，这被称为分类。","start":756.8,"end":785.04},{"id":77,"text":"It's called labels. And the problem to assign labels to the input is called classification. So for example, if you are trying to know whether it's a house or townhouse, then that's two discrete variables. Then it's one discrete variable with two options, then that's called classification.","zh":"它被称为标签。将标签分配给输入的问题称为分类。例如，如果你试图判断它是房屋还是联排别墅，那么这就是两个离散变量。然后它是一个有两个选项的离散变量，这被称为分类。","start":786.16,"end":803.8},{"id":78,"text":"And if you have a classification problem, then you cannot visualize in the same way. So I think this is one of the ways to visualize. You have two-dimensional inputs, so loss size and square feet. And then you can label.","zh":"如果你有一个分类问题，那么你就不能以同样的方式可视化。因此，我认为这是可视化的一种方式。你有两个维度的输入，比如损失大小和平方英尺，然后你可以进行标记。","start":804.96,"end":818.32},{"id":79,"text":"with like a triangle or circle and you can see like the way to classify whether this is a","zh":"用三角形或圆圈来标记，你可以看到如何分类，比如这个是","start":820.36,"end":825.96},{"id":80,"text":"house or townhouse is probably by building some kind of classifier that separates the","zh":"房子还是联排别墅，这可能是通过构建某种分类器来将平面分成两部分，然后你说一切在直线以上的都是房子，一切在直线以下的都是联排别墅，类似这样的方式。","start":825.96,"end":830.32},{"id":81,"text":"plane into two parts and you say everything above the line is a house and everything below the line","zh":"在第3到第5讲中，我们将讨论分类问题，这在当今也是非常重要的，因为所有这些大型语言模型本质上都是一个分类问题。","start":830.32,"end":834.92},{"id":82,"text":"is a townhouse, something like that. And in lecture 3-5, we are talking about classification","zh":"是一个联排别墅，类似那样的东西。在第3到第5讲中，我们讨论的是分类问题","start":834.92,"end":839.06},{"id":83,"text":"and this is actually very important even for these days because all of these large language","zh":"在第3到第5讲中，我们将讨论分类问题，这在当今也是非常重要的，因为所有这些大型语言模型本质上都是一个分类问题。","start":839.06,"end":843.92},{"id":84,"text":"models fundamentally is a classification problem. When you're predicting the next tax,","zh":"当你预测下一个词或下一个单词时，这个单词是一个离散的标签。","start":843.92,"end":847.32},{"id":85,"text":"the next token or the next word, the word is a discrete label.","zh":"当你预测下一个词或下一个单词时，这个单词是一个离散的标签。","start":847.32,"end":851.04},{"id":86,"text":"So it's just you have a lot of labels. You have like 50k.","zh":"所以你有很多标签。你有比如50k。","start":851.24,"end":853.6}],"notes":["本段主要讲解机器学习中的基本概念，包括输入、输出、特征、标签等术语的定义和区别。讲者指出，输入通常指的是给定的值，而输出是需要预测的结果，有时也被称为标签。同时，讲者提到在过去的术语使用中存在很多混淆，但现在这些术语的使用已经更加统一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":677.02,"end":853.6,"asr_flags":[67],"boards":[],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":677.02,"text":"and what's the algorithms, so on and so forth."},{"start":681.98,"text":"So of course, this is very simplistic"},{"start":684.9,"text":"because it's not only about the square feet."},{"start":686.74,"text":"you know, you probably also need to know the load size. Then you have a two-dimensional problem."},{"start":691.28,"text":"Now we have x1, x2 as inputs and you have y. And now if you visualize you are in 3D settings."},{"start":697.5,"text":"And just to clarify some of the notations or the complex, sorry, the wording. So in machine"},{"start":709.58,"text":"learning, every concept has probably more than one name. There's so much confusions in the past."},{"start":718.16,"text":"Now actually, there are fewer confusions because some of these words are no longer used."},{"start":722.1,"text":"In the old days, I think features and inputs are both referring to the values you are given."},{"start":728.44,"text":"And the price is the output you want to predict. And also sometimes people call it labels."},{"start":733.74,"text":"I think I just tend to use input and output these days to avoid kind of like the confusion."},{"start":740.74,"text":"But sometimes people still use the word labeling, which means that you give a label or give"},{"start":746.1,"text":"a design output, you know, to you provide the output for certain input, right?"},{"start":753.5,"text":"You can have human labels, you can have machine labels and so on and so forth."},{"start":756.8,"text":"Okay. And there's a concept about the output type. And it's called regression versus classification. So if the output is a continuous variable, for example, price, then it's called regression. So if the output is a discrete variable, for example, a label, something like flamingo, for example, you can label the image with some kind of text. So if the output is a text, then it's a discrete concept."},{"start":786.16,"text":"It's called labels. And the problem to assign labels to the input is called classification. So for example, if you are trying to know whether it's a house or townhouse, then that's two discrete variables. Then it's one discrete variable with two options, then that's called classification."},{"start":804.96,"text":"And if you have a classification problem, then you cannot visualize in the same way. So I think this is one of the ways to visualize. You have two-dimensional inputs, so loss size and square feet. And then you can label."},{"start":820.36,"text":"with like a triangle or circle and you can see like the way to classify whether this is a"},{"start":825.96,"text":"house or townhouse is probably by building some kind of classifier that separates the"},{"start":830.32,"text":"plane into two parts and you say everything above the line is a house and everything below the line"},{"start":834.92,"text":"is a townhouse, something like that. And in lecture 3-5, we are talking about classification"},{"start":839.06,"text":"and this is actually very important even for these days because all of these large language"},{"start":843.92,"text":"models fundamentally is a classification problem. When you're predicting the next tax,"},{"start":847.32,"text":"the next token or the next word, the word is a discrete label."},{"start":851.24,"text":"So it's just you have a lot of labels. You have like 50k."}],"speech_gaps":[],"frame":"../frames/v053/005.webp","frame_time":689.02},{"title":"课程介绍与机器学习应用","segments":[{"id":87,"text":"This is probably 250k different words or tokens.","zh":"这可能包含大约250,000个不同的单词或标记。","start":853.72,"end":858.76},{"id":88,"text":"And you are classifying into all of those discrete choices.","zh":"你还需要对所有这些离散选项进行分类。","start":859.38,"end":864.02},{"id":89,"text":"Like you have to choose one next word among 50k possible options.","zh":"你必须在50,000个可能的选项中选择下一个单词。","start":864.34,"end":869.82},{"id":90,"text":"And then you can talk about even high-dimensional inputs.","zh":"然后你还可以讨论高维输入的问题。","start":873.38,"end":876.22},{"id":91,"text":"So like the inputs, eventually you want to know everything about this property to be able to predict the price.","zh":"比如，输入最终你想要了解关于这个属性的一切，以便能够预测价格。","start":876.22,"end":883.18},{"id":92,"text":"So you can have living size, loss size, floors, conditions, zip codes, so on and so forth.","zh":"因此，你可以有房屋大小、损失大小、楼层、状况、邮政编码等等。","start":883.42,"end":887.32},{"id":93,"text":"So eventually everything is a high dimensional problem.","zh":"因此，最终所有问题都是高维问题。","start":888.12,"end":890.14},{"id":94,"text":"And also the outputs can be also high dimensional as well.","zh":"输出也可以是高维的。","start":890.96,"end":893.64},{"id":95,"text":"Here I'm only having the price, but you can have even much more complicated outputs.","zh":"在这里我只提到了价格，但你还可以得到甚至更加复杂的输出。","start":893.76,"end":898.3},{"id":96,"text":"So, as you can imagine, there are some kind of applications, you know, image classification.","zh":"因此，正如你所能想象的，有一些应用，比如说图像分类。","start":900.6,"end":906.4},{"id":97,"text":"So this is a classification problem because each image has a label like, you know,","zh":"因此这是一个分类问题，因为每张图像都有一个标签，比如说，","start":906.9,"end":912.48},{"id":98,"text":"which is the main object in the image, flamingo, quark, you know, quail, you know, so and so forth,","zh":"图像中的主要物体，比如火烈鸟、夸克、鹌鹑等等，还有像埃及猫之类的。","start":913.02,"end":920.54},{"id":99,"text":"Egyptian cat. And this is actually at the beginning of this AI era, right? So like basically","zh":"这实际上就是这个AI时代开始的时候，对吧？基本上","start":920.64,"end":927.54},{"id":100,"text":"I think Fei-Fei, she's a professor at Stanford, so she and her team collected this one million, this data set called ImageNet, which has one million image and label pairs, and one million pairs at that time is really big.","zh":"我认为Fei-Fei是斯坦福大学的教授，她和她的团队收集了这个名为ImageNet的数据集，包含一百万张图像和标签对，当时一百万对数据真的非常庞大。","start":928.3,"end":942.66},{"id":101,"text":"The second largest data set was like 50K.","zh":"第二大数据集大约有50K。","start":942.74,"end":944.76},{"id":102,"text":"electronic acts bigger than the second biggest one. And then Jeff Hinton and Alex Krajewski and Leah Seskever, they published the famous AlexNet paper, which was trained on this dataset with Neurite Works and gets fantastic performance. And that's pretty much the beginning of this era of AI. Of course, there are several waves in the last 10 years, right? There was like the vision innovation and then","zh":"电子行为比第二大数据集还要大。然后Jeff Hinton和Alex Krajewski以及Leah Seskever发表了著名的AlexNet论文，该论文是在这个数据集上使用Neurite Works训练的，并取得了非常出色的表现。这基本上就是这个AI时代的开端。当然，在过去的十年里，也经历了几次浪潮，对吧？比如视觉创新，然后","start":945.19,"end":974.33},{"id":103,"text":"Then people move to language and then at the beginning, the language model is of one form.","zh":"然后人们转向语言，最初的语言模型是一种形式。","start":974.41,"end":979.07},{"id":104,"text":"And then later on, we have the large language models and that goes to...","zh":"之后，我们有了大型语言模型，这发展到了……","start":979.21,"end":982.77},{"id":105,"text":"So basically, that's how this last 10 years has evolved.","zh":"基本上，这就是过去十年的发展历程。","start":982.77,"end":987.05},{"id":106,"text":"But everything started with this.","zh":"但一切始于这一点。","start":988.07,"end":989.47},{"id":107,"text":"And this is a very, very big data set so that you can do this very simple classification","zh":"这是一个非常大的数据集，因此你可以在此时解决这个非常简单的分类问题。","start":989.53,"end":993.53},{"id":108,"text":"problem at this point.","zh":"在这一点上，这个问题就出现了。","start":993.53,"end":994.45},{"id":109,"text":"In 2026, this is a problem that's supposed to be...","zh":"在2026年，这个问题应该被认为是……","start":995.77,"end":998.07},{"id":110,"text":"It's one task, first of all.","zh":"首先，这是一个任务。","start":998.55,"end":999.95},{"id":111,"text":"So the only thing you can do with this is you can label it.","zh":"你只能用这个来给它打标签。","start":1000.15,"end":1003.49},{"id":112,"text":"You cannot ask any questions about these images. So it's only one million pairs.","zh":"你不能对这些图像提出任何问题。因此，它只有百万对数据。","start":1004.41,"end":1007.79},{"id":113,"text":"And the accuracy is only at that point. The first paper, I think I remember the accuracy","zh":"准确率只在那个点上。我记得第一篇论文的准确率","start":1008.57,"end":1012.23},{"id":114,"text":"was only 50%. And now it's like 95%, maybe 97%. Anyway, so the X is the raw pixels of the image.","zh":"只有50%。而现在可能达到95%，甚至97%。总之，X是图像的原始像素。","start":1012.23,"end":1020.21},{"id":115,"text":"And Y is the main object, which is a discrete object. And they envision there was a few years","zh":"Y是主要对象，这是一个离散对象。他们设想在那几年","start":1020.31,"end":1027.21},{"id":116,"text":"people study. People actually still use these kind of tools to do bounding box, localization.","zh":"人们进行了研究。人们实际上仍然使用这些工具来进行边界框和定位。","start":1027.21,"end":1032.45}],"notes":["本段介绍了机器学习在图像分类中的应用，特别是ImageNet数据集的创建及其对AI发展的影响。讲者提到Fei-Fei Li教授及其团队收集了包含一百万张图像和标签对的数据集，这是当时非常庞大的数据集。第二大的数据集只有50,000个样本，而ImageNet的数据量远超后者。随后，Jeff Hinton、Alex Krajewski和Leah Seskever发表了著名的AlexNet论文，该论文在ImageNet数据集上训练并取得了优异的性能，标志着AI时代的开始。","讲者还提到，在过去的十年中，AI经历了多个发展阶段，首先是视觉领域的创新，然后转向语言处理领域。早期的语言模型形式较为单一，后来发展出大型语言模型。这些模型的发展推动了AI技术的演进。","在ImageNet数据集的背景下，讲者指出，该数据集的规模非常庞大，使得简单的分类任务成为可能。2026年，该任务被认为是一个单一任务，只能通过标签进行处理，不能对图像提出其他问题。数据集的准确率从最初的50%提升到了现在的95%或97%。","讲者提到，X代表图像的原始像素，Y代表图像中的主要对象，这是一个离散的对象。研究者们在几年内对这一领域进行了研究，并且至今仍在使用这些工具进行边界框和定位任务。","讲者强调了数据集的规模和其对AI发展的重要性，同时指出，尽管数据集的准确率有所提高，但该任务仍然仅限于标签处理，不能进行更复杂的分析。","讲者还提到，AlexNet论文的发表标志着AI时代的开始，并且在过去的十年中，AI经历了多个发展阶段，包括视觉创新和语言模型的发展。"],"formulas":[],"uncertainties":["electronic acts"],"diagram":"none","start":853.72,"end":1032.45,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":853.72,"text":"This is probably 250k different words or tokens."},{"start":859.38,"text":"And you are classifying into all of those discrete choices."},{"start":864.34,"text":"Like you have to choose one next word among 50k possible options."},{"start":873.38,"text":"And then you can talk about even high-dimensional inputs."},{"start":876.22,"text":"So like the inputs, eventually you want to know everything about this property to be able to predict the price."},{"start":883.42,"text":"So you can have living size, loss size, floors, conditions, zip codes, so on and so forth."},{"start":888.12,"text":"So eventually everything is a high dimensional problem."},{"start":890.96,"text":"And also the outputs can be also high dimensional as well."},{"start":893.76,"text":"Here I'm only having the price, but you can have even much more complicated outputs."},{"start":900.6,"text":"So, as you can imagine, there are some kind of applications, you know, image classification."},{"start":906.9,"text":"So this is a classification problem because each image has a label like, you know,"},{"start":913.02,"text":"which is the main object in the image, flamingo, quark, you know, quail, you know, so and so forth,"},{"start":920.64,"text":"Egyptian cat. And this is actually at the beginning of this AI era, right? So like basically"},{"start":928.3,"text":"I think Fei-Fei, she's a professor at Stanford, so she and her team collected this one million, this data set called ImageNet, which has one million image and label pairs, and one million pairs at that time is really big."},{"start":942.74,"text":"The second largest data set was like 50K."},{"start":945.19,"text":"electronic acts bigger than the second biggest one. And then Jeff Hinton and Alex Krajewski and Leah Seskever, they published the famous AlexNet paper, which was trained on this dataset with Neurite Works and gets fantastic performance. And that's pretty much the beginning of this era of AI. Of course, there are several waves in the last 10 years, right? There was like the vision innovation and then"},{"start":974.41,"text":"Then people move to language and then at the beginning, the language model is of one form."},{"start":979.21,"text":"And then later on, we have the large language models and that goes to..."},{"start":982.77,"text":"So basically, that's how this last 10 years has evolved."},{"start":988.07,"text":"But everything started with this."},{"start":989.53,"text":"And this is a very, very big data set so that you can do this very simple classification"},{"start":993.53,"text":"problem at this point."},{"start":995.77,"text":"In 2026, this is a problem that's supposed to be..."},{"start":998.55,"text":"It's one task, first of all."},{"start":1000.15,"text":"So the only thing you can do with this is you can label it."},{"start":1004.41,"text":"You cannot ask any questions about these images. So it's only one million pairs."},{"start":1008.57,"text":"And the accuracy is only at that point. The first paper, I think I remember the accuracy"},{"start":1012.23,"text":"was only 50%. And now it's like 95%, maybe 97%. Anyway, so the X is the raw pixels of the image."},{"start":1020.31,"text":"And Y is the main object, which is a discrete object. And they envision there was a few years"},{"start":1027.21,"text":"people study. People actually still use these kind of tools to do bounding box, localization."}],"speech_gaps":[{"start":870.22,"end":872.98}],"frame":"../frames/v053/006.webp","frame_time":865.72},{"title":"目标检测与机器翻译的介绍","segments":[{"id":117,"text":"you can, because each image is not only one object, you can locate every object and have","zh":"你可以，因为每张图像不仅仅包含一个物体，你可以定位每一个物体并拥有","start":1032.45,"end":1039.31},{"id":118,"text":"bounding boxes for them. And in this case, the Y is the bounding boxes. The output is","zh":"它们的边界框。在这种情况下，Y 是边界框。输出是","start":1039.31,"end":1044.41},{"id":119,"text":"the bounding boxes. How do you describe the bounding boxes? You describe it by","zh":"边界框。如何描述边界框？你可以用","start":1044.41,"end":1047.67},{"id":120,"text":"You describe it by four numbers. One number for the left bottom corner and two numbers for the left bottom corner. That's like x or y coordinates for the bottom left corner and the two numbers for the top right corner. And with these two corners, you uniquely identify the bounding box. So basically outputs are four numerical numbers and input is still the raw pixels.","zh":"四个数字来描述。一个数字用于左下角坐标，两个数字用于右上角坐标。这类似于左下角的x或y坐标，以及右上角的两个数字。通过这两个角，你可以唯一地确定边界框。因此，输出基本上是四个数值，而输入仍然是原始像素。","start":1049.31,"end":1067.13},{"id":121,"text":"And machine translation is one of the superstring problems. So basically, you just have the input, which is English. The output, it could be Chinese or any other languages or vice versa. And so this is x to y. By the way, in this course, we're not going to cover too much about applications.","zh":"机器翻译是超字符串问题之一。因此，你只需要输入，即英语。输出可以是中文或其他任何语言，或者反过来。因此，这是x到y的映射。顺便说一句，在本课程中，我们不会过多涉及应用。","start":1069.17,"end":1086.23},{"id":122,"text":"trying to teach a little bit about the fundamental techniques behind these applications and use more toy examples to demonstrate the techniques. If you really cover the applications, I think there are other lectures, other courses on campus that are more useful. And deep learning, as I said, is the technique that enables all of this. So basically, it's a network, which is very complicated. I'm showing a...","zh":"我们试图教一些这些应用背后的基本技术，并使用更多的玩具示例来演示这些技术。如果你真的要覆盖应用，我认为有其他讲座，其他课程在校园里更有用。深度学习，正如我所说的，是使这一切成为可能的技术。因此，它基本上是一个网络，非常复杂。我正在展示一个...","start":1087.79,"end":1114.67},{"id":123,"text":"uh small examples but actually there are like millions of neurons or billions of neurons in it and uh okay maybe not billions of neurons but like there are there are billions of parameters each parameter is actually like some kind of like","zh":"小例子，但实际上其中包含数百万个神经元或数十亿个神经元，嗯，也许不是数十亿个神经元，但确实有数十亿个参数，每个参数实际上都是某种类型的","start":1114.88,"end":1127.06},{"id":124,"text":"edge. We're not into details today but in some sense this is kind of like simulating to some degree simulating the human brains. So the neurons are the nodes and the edges are the synapses. And you give this image to it and then it also pulls the labels.","zh":"边缘。我们今天不深入细节，但某种意义上说，这在某种程度上类似于模拟大脑。因此，神经元是节点，边缘是突触。你将这张图像输入其中，然后它也会拉取标签。","start":1127.36,"end":1145.32},{"id":125,"text":"And we're going to talk about the basics about this.","zh":"我们将谈论这个主题的一些基础知识。","start":1146.19,"end":1147.85},{"id":126,"text":"How do you define the networks?","zh":"你如何定义这些网络？","start":1148.93,"end":1150.33},{"id":127,"text":"What are some of the basics on how you define them?","zh":"在定义它们时，有哪些基本要点？","start":1150.61,"end":1155.01},{"id":128,"text":"What are the important things to pay attention to?","zh":"有哪些重要的事情需要注意？","start":1155.05,"end":1157.07},{"id":129,"text":"And then most importantly, how do you train the models","zh":"最重要的是，你如何通过计算梯度来训练模型？","start":1157.15,"end":1159.99},{"id":130,"text":"by computing the gradient?","zh":"因为你会定义损失函数，","start":1159.99,"end":1161.03},{"id":131,"text":"Because you're going to define loss functions,","zh":"然后你会进行所谓的反向传播。","start":1161.47,"end":1162.83},{"id":132,"text":"and then you do the so-called backpropagation.","zh":"然后你进行所谓的反向传播。","start":1162.93,"end":1164.35},{"id":133,"text":"And this backpropagation is how you automatically","zh":"并且这种反向传播就是你如何自动","start":1164.67,"end":1167.49},{"id":134,"text":"compute the gradient of such a complex model or function.","zh":"计算如此复杂模型或函数的梯度。","start":1167.49,"end":1171.39},{"id":135,"text":"function, and that's lecture seven and eight.","zh":"这个函数，这就是第七和第八讲。","start":1171.39,"end":1174.51},{"id":136,"text":"So OK, so that's two-part learning.","zh":"所以，好的，这就是两部分学习。","start":1176.51,"end":1178.19},{"id":137,"text":"Let me see how much time I'm spending.","zh":"让我看看我花了多少时间。","start":1179.09,"end":1180.65},{"id":138,"text":"Any questions?","zh":"有任何问题吗？","start":1183.41,"end":1184.21},{"id":139,"text":"Feel free to interrupt me at any point.","zh":"随时可以打断我。","start":1184.57,"end":1186.07},{"id":140,"text":"This is a very low-key lecture.","zh":"这是一场非常低调的讲座。","start":1186.25,"end":1187.63},{"id":141,"text":"I think I'm going to only spend probably 15 minutes","zh":"我想我只会花大概15分钟的时间","start":1187.83,"end":1190.25},{"id":142,"text":"if there's no question.","zh":"如果没有问题的话。","start":1190.25,"end":1191.49},{"id":143,"text":"Yeah.","zh":"嗯。","start":1193.51,"end":1193.91},{"id":144,"text":"OK, anyway, so let's move on to unsupervised learning.","zh":"好的，不管怎样，我们接下来讲无监督学习。","start":1194.73,"end":1197.23},{"id":145,"text":"So what does that mean?","zh":"那这到底是什么意思？","start":1198.07,"end":1199.31},{"id":146,"text":"So it means that you only have a data set with only inputs,","zh":"这意味着你只有一组只有输入的数据集，","start":1199.31,"end":1204.49},{"id":147,"text":"but there's no outputs.","zh":"但没有输出。","start":1204.69,"end":1205.47},{"id":148,"text":"So there's no clear tasks, because you don't know","zh":"因此没有明确的任务，因为你不知道","start":1205.71,"end":1208.23},{"id":149,"text":"what they are trying to predict.","zh":"他们试图预测的内容。","start":1208.23,"end":1209.05},{"id":150,"text":"You just only have inputs.","zh":"你只拥有输入。","start":1209.29,"end":1210.47}],"notes":["本段介绍了目标检测任务中如何用边界框表示对象。讲者提到边界框由四个数值组成，分别表示左下角和右上角的坐标，通过这两个角可以唯一确定边界框。输入仍然是原始像素，输出是这些数值。","讲者提到机器翻译是超字符串问题之一，输入是英文，输出可以是中文或其他语言。但本课程不会深入讨论具体应用，而是侧重于基本技术的讲解。","讲者强调深度学习是实现这些应用的关键技术，它是一种非常复杂的网络，包含数百万甚至数十亿个参数。虽然讲者用小例子说明，但实际网络结构复杂，模拟了人脑的神经元和突触。","讲者提到训练模型需要计算梯度，这是通过反向传播实现的。反向传播是自动计算复杂模型或函数梯度的方法，属于课程第七和第八讲的内容。","讲者提到无监督学习的定义，即只有输入数据而没有输出。这意味着没有明确的任务，因为不知道要预测什么。这种情况下，模型需要从数据中自行发现结构。","讲者在课程中强调了教学节奏，表示如果没有人提问，课程将只持续大约15分钟。这表明课程内容较为紧凑，注重基础概念的讲解。"],"formulas":[],"uncertainties":["edge. We're not into details today but in some sense this is kind of like simulating to some degree simulating the human brains. So the neurons are the nodes and the edges are the synapses. And you give this image to it and then it also pulls the labels."],"diagram":"none","start":1032.45,"end":1210.47,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":1032.45,"text":"you can, because each image is not only one object, you can locate every object and have"},{"start":1039.31,"text":"bounding boxes for them. And in this case, the Y is the bounding boxes. The output is"},{"start":1044.41,"text":"the bounding boxes. How do you describe the bounding boxes? You describe it by"},{"start":1049.31,"text":"four numbers. One number for the left bottom corner and two numbers for the left bottom corner. That's like x or y coordinates for the bottom left corner and the two numbers for the top right corner. And with these two corners, you uniquely identify the bounding box. So basically outputs are four numerical numbers and input is still the raw pixels."},{"start":1069.17,"text":"And machine translation is one of the superstring problems. So basically, you just have the input, which is English. The output, it could be Chinese or any other languages or vice versa. And so this is x to y. By the way, in this course, we're not going to cover too much about applications."},{"start":1087.79,"text":"trying to teach a little bit about the fundamental techniques behind these applications and use more toy examples to demonstrate the techniques. If you really cover the applications, I think there are other lectures, other courses on campus that are more useful. And deep learning, as I said, is the technique that enables all of this. So basically, it's a network, which is very complicated. I'm showing a..."},{"start":1114.88,"text":"uh small examples but actually there are like millions of neurons or billions of neurons in it and uh okay maybe not billions of neurons but like there are there are billions of parameters each parameter is actually like some kind of like"},{"start":1127.36,"text":"edge. We're not going into details today but in some sense this is kind of like simulating to some degree simulating the human brains. So the neurons are the nodes and the edges are the synapses. And you give this image to it and then it also pulls the labels."},{"start":1146.19,"text":"And we're going to talk about the basics about this."},{"start":1148.93,"text":"How do you define the networks?"},{"start":1150.61,"text":"What are some of the basics on how you define them?"},{"start":1155.05,"text":"What are the important things to pay attention to?"},{"start":1157.15,"text":"And then most importantly, how do you train the models"},{"start":1159.99,"text":"by computing the gradient?"},{"start":1161.47,"text":"Because you're going to define loss functions,"},{"start":1162.93,"text":"and then you do the so-called backpropagation."},{"start":1164.67,"text":"And this backpropagation is how you automatically"},{"start":1167.49,"text":"compute the gradient of such a complex model or function."},{"start":1171.39,"text":"function, and that's lecture seven and eight."},{"start":1176.51,"text":"So OK, so that's two-part learning."},{"start":1179.09,"text":"Let me see how much time I'm spending."},{"start":1183.41,"text":"Any questions?"},{"start":1184.57,"text":"Feel free to interrupt me at any point."},{"start":1186.25,"text":"This is a very low-key lecture."},{"start":1187.83,"text":"I think I'm going to only spend probably 15 minutes"},{"start":1190.25,"text":"if there's no question."},{"start":1193.51,"text":"Yeah."},{"start":1194.73,"text":"OK, anyway, so let's move on to unsupervised learning."},{"start":1198.07,"text":"So what does that mean?"},{"start":1199.31,"text":"So it means that you only have a data set with only inputs,"},{"start":1204.69,"text":"but there's no outputs."},{"start":1205.71,"text":"So there's no clear tasks, because you don't know"},{"start":1208.23,"text":"what they are trying to predict."},{"start":1209.29,"text":"You just only have inputs."}],"speech_gaps":[],"frame":"../frames/v053/007.webp","frame_time":1044.45},{"title":"无标签数据的结构发现","segments":[{"id":151,"text":"So for example, for a surprise case,","zh":"例如，在一个意外的情况下，","start":1211.69,"end":1215.41},{"id":152,"text":"you have the label, which is like horse versus town horse.","zh":"你拥有标签，比如马与城镇马。","start":1215.53,"end":1217.79},{"id":153,"text":"So you have this triangle versus circle in the plot.","zh":"因此，在图中你有三角形与圆形的对比。","start":1217.99,"end":1220.73},{"id":154,"text":"But if you are unsurprised, then you","zh":"但如果你并不感到意外，那么你","start":1221.05,"end":1222.97},{"id":155,"text":"don't have that information.","zh":"就没有这样的信息。","start":1222.97,"end":1223.75},{"id":156,"text":"You just have a bunch of data.","zh":"你只有一堆数据。","start":1224.13,"end":1226.65},{"id":157,"text":"And you don't know what the type of the house it is.","zh":"而你不知道这些数据的类型是什么。","start":1228.05,"end":1231.33},{"id":158,"text":"So just a bunch of points on the","zh":"因此，你只有一堆点在","start":1231.71,"end":1234.89},{"id":159,"text":"plot and you still want to understand something about it. So there's still some patterns on the right hand side figure you can clearly see if you're human. So in some sense, we are trying to get as much as possible from the data without labels. That's pretty much what enterprise learning is doing. It's a very vaguely defined goal because what does interesting structure mean in data? What does that mean?","zh":"绘制图表后，你仍然想了解一些关于它的信息。因此，在右边的图中，如果你是人类，仍然可以清楚地看到一些模式。从某种意义上说，我们试图在没有标签的情况下尽可能多地从数据中获取信息。这基本上就是企业学习所做的。这是一个非常模糊的目标，因为数据中的有趣结构是什么意思？这又意味着什么？","start":1236.12,"end":1260.04},{"id":160,"text":"In some sense, it actually depends on your methodology. Different methods will give you different structures in some sense. So for example, for this data point, there's a technique called clustering, which just means that you find out","zh":"从某种意义上说，这实际上取决于你的方法。不同的方法会在某种程度上给出不同的结构。例如，对于这个数据点，有一种技术叫做聚类，它仅仅意味着你发现","start":1261.45,"end":1276.25},{"id":161,"text":"data points are somewhat similar. And in 2D, it's actually pretty obvious. I think if you ask humans","zh":"数据点在某种程度上是相似的。在二维情况下，这实际上非常明显。我想如果你让人类进行聚类，你可能会得到类似的结果。或者你也可以用这种方式进行聚类。","start":1277.04,"end":1284.4},{"id":162,"text":"to cluster, you probably get similar results. Or maybe you can cluster in this way as well.","zh":"我想这可能是更好的聚类，因为存在更清晰的模式。","start":1284.4,"end":1288.9},{"id":163,"text":"I guess this is probably better clustering because there's a clearer pattern.","zh":"在第9讲和第10讲中，我们将讨论一些这些聚类算法。","start":1289.42,"end":1293.44},{"id":164,"text":"And in the lecture 9 and 10, we're going to talk about some of these clustering algorithms.","zh":"在第9讲和第10讲中，我们将讨论一些这些聚类算法。","start":1295.0,"end":1298.76},{"id":165,"text":"Like what's the way to design these algorithms? What's the loss function? Or what's the objectives","zh":"从应用的角度来看，我想这些是一些经典的应用，对吧？","start":1299.34,"end":1305.16},{"id":166,"text":"So, and in terms of applications, I guess these are some of the classical applications, right?","zh":"因此，在应用方面，我想这些是一些经典的应用，对吧？","start":1305.16,"end":1313.76},{"id":167,"text":"So, for example, this is about classroom genes, right?","zh":"所以，举个例子，这就是关于课堂基因的问题，对吧？","start":1313.84,"end":1316.84},{"id":168,"text":"So every column is the gene expression, the genes for one individual.","zh":"所以每一列是基因表达，代表一个个体的基因。","start":1316.92,"end":1322.96},{"id":169,"text":"And you have so many individuals that have different genes and you put them into a table and you can see if you sort them in the right way.","zh":"你有这么多个体，他们的基因各不相同，你把这些个体放到一个表格中，然后如果你以正确的方式对它们进行排序，就可以看到一些模式。","start":1323.14,"end":1330.58},{"id":170,"text":"This is actually somewhat sorted. So you can see clearly patterns.","zh":"实际上，这个表格已经有些排序了。你可以清楚地看到一些模式。","start":1330.66,"end":1334.32},{"id":171,"text":"So there are a bunch of individuals which have those.","zh":"有一些个体具有这些基因。","start":1334.32,"end":1336.6},{"id":172,"text":"of genes and there's a bunch of individuals which has these kind of genes. And then you can classify them into different types and then what genes can cause what kind of disease or symptoms and so forth. And these are the clusters probably. And you can also cluster words or documents. So I think this example is like you have on the...","zh":"有一些个体具有这些类型的基因。然后你可以将它们分类为不同类型，进而确定哪些基因会导致什么样的疾病或症状等等。这些可能是聚类。你也可以对词语或文档进行聚类。因此，我认为这个例子是说，你有在……","start":1336.78,"end":1363.26},{"id":173,"text":"Horizontal dimension is documents. So each document contains a number of words and you count how many words. For example, this means that pollution show up in document D0 for a lot of times. And that's why it's darker. And you see this. So basically you count how many times each word shows up in the document. That's it. That's how you build this table. And you don't see much pattern here, right? But if you...","zh":"水平方向是文档。每个文档包含若干词语，你统计每个词语出现的次数。例如，这表示污染这个词在文档 D0 中出现了很多次，因此颜色更深。你可以看到这一点。基本上，你统计每个词语在文档中出现的次数，这就是如何构建这个表格的方法。你在这里看不到太多模式，对吧？但如果你……","start":1364.26,"end":1388.6}],"notes":["本段讨论了无标签数据的结构发现，即在没有明确标签的情况下，如何从数据中提取有意义的模式。讲者提到，当数据中存在标签时，可以明确区分不同类别，如马与城镇马，或三角形与圆形。但当没有标签时，数据仅由点组成，需要通过算法发现潜在的结构。","讲者指出，无标签学习的目标是尽可能从数据中提取信息，这被称为无监督学习。由于数据的结构可能因方法不同而不同，因此需要设计不同的算法来发现不同的模式。","讲者以聚类（clustering）为例，说明了如何通过算法将相似的数据点分组。在二维空间中，聚类结果对人类来说是直观的，但需要算法来自动化这一过程。","讲者提到，聚类方法在实际应用中非常广泛，例如基因表达数据的分析和文档的分类。在基因数据中，每个列代表一个个体的基因表达，通过排序可以发现不同的基因类型。","在文档分类的例子中，讲者说明了如何通过统计每个单词在文档中的出现频率来构建文档-单词矩阵。这种方法可以揭示文档之间的相似性，但原始数据中可能没有明显的模式。","讲者强调，无监督学习的目标是发现数据中的潜在结构，但这一目标的定义较为模糊，因为“有趣的结构”可能因方法和应用场景的不同而有所变化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1211.69,"end":1388.6,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":1211.69,"text":"So for example, for a surprise case,"},{"start":1215.53,"text":"you have the label, which is like horse versus town horse."},{"start":1217.99,"text":"So you have this triangle versus circle in the plot."},{"start":1221.05,"text":"But if you are unsurprised, then you"},{"start":1222.97,"text":"don't have that information."},{"start":1224.13,"text":"You just have a bunch of data."},{"start":1228.05,"text":"And you don't know what the type of the house it is."},{"start":1231.71,"text":"So just a bunch of points on the"},{"start":1236.12,"text":"plot and you still want to understand something about it. So there's still some patterns on the right hand side figure you can clearly see if you're human. So in some sense, we are trying to get as much as possible from the data without labels. That's pretty much what enterprise learning is doing. It's a very vaguely defined goal because what does interesting structure mean in data? What does that mean?"},{"start":1261.45,"text":"In some sense, it actually depends on your methodology. Different methods will give you different structures in some sense. So for example, for this data point, there's a technique called clustering, which just means that you find out"},{"start":1277.04,"text":"data points are somewhat similar. And in 2D, it's actually pretty obvious. I think if you ask humans"},{"start":1284.4,"text":"to cluster, you probably get similar results. Or maybe you can cluster in this way as well."},{"start":1289.42,"text":"I guess this is probably better clustering because there's a clearer pattern."},{"start":1295.0,"text":"And in the lecture 9 and 10, we're going to talk about some of these clustering algorithms."},{"start":1299.34,"text":"Like what's the way to design these algorithms? What's the loss function? Or what's the objectives"},{"start":1305.16,"text":"So, and in terms of applications, I guess these are some of the classical applications, right?"},{"start":1313.84,"text":"So, for example, this is about classroom genes, right?"},{"start":1316.92,"text":"So every column is the gene expression, the genes for one individual."},{"start":1323.14,"text":"And you have so many individuals that have different genes and you put them into a table and you can see if you sort them in the right way."},{"start":1330.66,"text":"This is actually somewhat sorted. So you can see clearly patterns."},{"start":1334.32,"text":"So there are a bunch of individuals which have those."},{"start":1336.78,"text":"of genes and there's a bunch of individuals which has these kind of genes. And then you can classify them into different types and then what genes can cause what kind of disease or symptoms and so forth. And these are the clusters probably. And you can also cluster words or documents. So I think this example is like you have on the..."},{"start":1364.26,"text":"Horizontal dimension is documents. So each document contains a number of words and you count how many words. For example, this means that pollution show up in document D0 for a lot of times. And that's why it's darker. And you see this. So basically you count how many times each word shows up in the document. That's it. That's how you build this table. And you don't see much pattern here, right? But if you..."}],"speech_gaps":[],"frame":"../frames/v053/008.webp","frame_time":1223.69},{"title":"自然语言处理与词向量表示","segments":[{"id":174,"text":"regroup, reorder them, and let me see whether you can see, oh, sorry. Let's wait for the animation. Okay, yeah, so after you...","zh":"重新分组，重新排列它们，让我看看你是否能发现，哦，抱歉。让我们等待动画。好的，是的，所以在你……","start":1391.93,"end":1400.53},{"id":175,"text":"sort in the right way, you can find groups of documents which have similar patterns. For example, these three documents all have a lot of mentions of shuttle space launch and booster that seems to be about maybe SpaceX or something like that. And the top left corner is about air pollution. Environmental is about environments. So you can figure out similar words and also similar documents because these documents are similar and these documents are similar, so on and so forth.","zh":"以正确的方式排序后，你可以找到具有相似模式的文档组。例如，这三个文档都大量提到了穿梭航天发射和助推器，似乎与SpaceX或其他类似的东西有关。而左上角是关于空气污染的。环境是关于环境的。因此你可以找出相似的词语，也可以找出相似的文档，因为这些文档相似，这些文档也相似，依此类推。","start":1400.9,"end":1429.34},{"id":176,"text":"And this proper technique is called LSA. And we're going to talk about how to do some of this in Actron 9. And then this is like a post-deep learning techniques. You can also represent words by vectors. So basically, every word you can encode it into a numerical vector, which is like sometimes a thousand dimensional vectors, or sometimes even longer.","zh":"这种正确的技术被称为LSA。我们将在Actron 9中讨论如何进行其中的一些操作。这类似于深度学习之后的技术。你也可以用向量表示词语。基本上，每个词语都可以编码成一个数值向量，这可能是有时一千维的向量，有时甚至更长。","start":1430.96,"end":1457.86},{"id":177,"text":"And it turns out that actually these vectors not only have a lot of semantical meanings. First of all, similar words can have similar vectors. So Rome, Paris, and Berlin, they have vectors in Heidelberg space that are very close. And also sometimes the directions can correspond to relationship. And for example, this direction from left to right corresponds to a relationship between the capital and the country. So basically, if you","zh":"实际上，这些向量不仅具有大量的语义含义。首先，相似的词语可以具有相似的向量。例如，罗马、巴黎和柏林在海德堡空间中的向量非常接近。此外，有时方向可以对应关系。例如，从左到右的方向对应于首都和国家之间的关系。因此，如果你","start":1459.78,"end":1485.38},{"id":178,"text":"find Italy and you don't know what's the capital of it, you just go in this direction and find which point you hit and that word you hit will likely be the capital of Italy. And the same thing for France and Germany. So you have one direction where you can use to search for the capital of the country.","zh":"找到意大利，而不知道它的首都是什么，你只需沿着这个方向移动，找到你碰到的点，你碰到的词语很可能是意大利的首都。法国和德国也是如此。因此，你有一个方向可以用来搜索国家的首都。","start":1485.75,"end":1504.63},{"id":179,"text":"And there are many relationships like this people have found. And we're going to talk about how to learn these embeddings or encodings of the natural language. And all of these are learned by training in those states.","zh":"人们已经发现了许多这样的关系。我们将讨论如何学习这些自然语言的嵌入或编码。所有这些都是通过在这些状态中进行训练来学习的。","start":1506.12,"end":1519.54},{"id":180,"text":"2014, 2015. So they're training on unlabeled data sets, basically Wikipedia. I think actually I got this image from the web. So I think this becomes a free corpus because people are using this to train models. Of course, these days, Wiki is a very small corpus. It's probably like 1% or 0.1% of the total corpus.","zh":"2014年、2015年。因此，他们基本上是在维基百科等无标签数据集上进行训练。我想这张图片其实是从网上找到的。因此，这成为了一个免费语料库，因为人们使用它来训练模型。当然，如今维基百科已经是一个非常小的语料库了。它可能只占总语料库的1%或0.1%。","start":1520.38,"end":1545.94},{"id":181,"text":"these days. And then we'll talk about large-language models. I think large-language models also have different kind of nuances. We're going to talk about the","zh":"如今。然后我们将讨论大型语言模型。我想大型语言模型也有不同的细微差别。我们将讨论","start":1547.82,"end":1563.62}],"notes":["本段介绍了LSA（潜在语义分析）技术，通过重新排序和分组文档，可以发现具有相似模式的文档集合。例如，三个文档都提到了航天发射和助推器，可能与SpaceX有关，而左上角的文档则涉及空气污染。LSA是一种在Actron 9中讨论的预深度学习技术。","接下来，课程提到词向量表示，即每个词可以被编码为数值向量，通常是数千维甚至更长。这些向量不仅包含语义信息，相似的词在向量空间中也更接近。例如，罗马、巴黎和柏林在Heidelberg空间中的向量非常接近。","此外，向量的方向可以表示词语之间的关系。例如，从左到右的方向可能对应国家与其首都之间的关系。如果知道意大利，但不知道其首都，可以通过这个方向找到首都。这种关系在自然语言处理中被广泛研究。","课程还提到，这些词向量表示是通过训练数据集（如维基百科）学习得到的。虽然维基百科在2014-2015年是一个重要的语料库，但如今它仅占总语料库的1%或0.1%。","最后，课程提到将讨论大型语言模型（large-language models），这些模型具有不同的细微差别，包括如何学习自然语言的嵌入或编码。"],"formulas":[],"uncertainties":["Actron 9可能为拼写错误，实际应为TensorFlow或PyTorch等深度学习框架。","Heidelberg space可能为Heidelberg space的误听，实际可能为Word2Vec或GloVe等词向量空间。","training in those states可能为training on those datasets的误听，实际应为训练在这些数据集上。"],"diagram":"none","start":1391.93,"end":1563.62,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1391.93,"text":"regroup, reorder them, and let me see whether you can see, oh, sorry. Let's wait for the animation. Okay, yeah, so after you..."},{"start":1400.9,"text":"sort in the right way, you can find groups of documents which have similar patterns. For example, these three documents all have a lot of mentions of shuttle space launch and booster that seems to be about maybe SpaceX or something like that. And the top left corner is about air pollution. Environmental is about environments. So you can figure out similar words and also similar documents because these documents are similar and these documents are similar, so on and so forth."},{"start":1430.96,"text":"And this proper technique is called LSA. And we're going to talk about how to do some of this in Actron 9. And then this is like a post-deep learning techniques. You can also represent words by vectors. So basically, every word you can encode it into a numerical vector, which is like sometimes a thousand dimensional vectors, or sometimes even longer."},{"start":1459.78,"text":"And it turns out that actually these vectors not only have a lot of semantical meanings. First of all, similar words can have similar vectors. So Rome, Paris, and Berlin, they have vectors in Heidelberg space that are very close. And also sometimes the directions can correspond to relationship. And for example, this direction from left to right corresponds to a relationship between the capital and the country. So basically, if you"},{"start":1485.75,"text":"find Italy and you don't know what's the capital of it, you just go in this direction and find which point you hit and that word you hit will likely be the capital of Italy. And the same thing for France and Germany. So you have one direction where you can use to search for the capital of the country."},{"start":1506.12,"text":"And there are many relationships like this people have found. And we're going to talk about how to learn these embeddings or encodings of the natural language. And all of these are learned by training in those states."},{"start":1520.38,"text":"2014, 2015. So they're training on unlabeled data sets, basically Wikipedia. I think actually I got this image from the web. So I think this becomes a free corpus because people are using this to train models. Of course, these days, Wiki is a very small corpus. It's probably like 1% or 0.1% of the total corpus."},{"start":1547.82,"text":"these days. And then we'll talk about large-language models. I think large-language models also have different kind of nuances. We're going to talk about the"}],"speech_gaps":[],"frame":"../frames/v053/009.webp","frame_time":1403.93},{"title":"课程介绍与机器学习模型概述","segments":[{"id":182,"text":"So basically, the general idea is that it's a general purpose model. Learn how to unlabeled a massive data set. And it's general purpose because it's not only for example, before here, what's the purpose here? You are trying to understand which words are similar to the other words. You understand the relationship. So here you are trying to understand the relationship between documents, the relationship between words, and so forth. So that's one task in some sense, or maybe two tasks. But here...","zh":"基本上，总体的想法是这是一个通用模型。学习如何对大量无标签的数据集进行处理。它之所以是通用的，是因为它不仅限于例如之前提到的例子，这里的目的是什么？你试图理解哪些词与其他词相似。你理解它们之间的关系。因此，你在这里试图理解文档之间的关系、词语之间的关系，等等。因此，这在某种意义上是一个任务，或者可能是两个任务。但在这里……","start":1564.3,"end":1589.98},{"id":183,"text":"When you have large-language models, we have chat GPT. It says, what's the agenda? What's on the agenda today? You can ask anything. I guess that's what they have here. Ask anything. You can ask anything about anything. So it's not only one task or two tasks.","zh":"当你拥有大型语言模型时，我们有Chat GPT。它会说，今天的议程是什么？今天有什么安排？你可以问任何问题。我想这就是他们在这里所拥有的。你可以问任何关于任何事物的问题。因此，它不仅仅是一个任务或两个任务。","start":1590.41,"end":1606.69},{"id":184,"text":"general purpose models. And we'll cover something about the architecture, what new artworks you're going to use for this kind of like pre-trained large-language models and what are the loss functions people use to train these models. And then we're going to talk about some of the more advanced things like how do you prompt these models or how do you train the models to be more responsive to prompting. So I guess when you use large-language models, you probably have seen that it does depend on how you ask the question. So if you ask the wrong question,","zh":"通用模型。我们将介绍一些关于架构的内容，你将使用哪些新的艺术作品来构建这种类型的预训练大型语言模型，以及人们使用哪些损失函数来训练这些模型。然后我们将讨论一些更高级的内容，例如如何提示这些模型，或者如何训练模型使其对提示更加敏感。因此，当你使用大型语言模型时，你可能已经注意到它依赖于你提问的方式。如果你提出错误的问题，","start":1608.43,"end":1
