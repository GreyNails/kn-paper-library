}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">09 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 9 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v009","title":"09 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 9","course":"凸优化","pages":[{"title":"课程公告与编程注意事项","segments":[{"id":0,"text":"Before we get started today, I just did want to make a couple of announcements about homework, because just a bunch of things came up that I thought it's probably better for me to say something about. So the first is we had a couple of people inquire about our solutions, right?"},{"id":1,"text":"Our solutions to the homework are generally much more involved than we would expect from you. In fact, we wouldn't even want you to do that because it's not the point, right? In this class, we don't care about little corner cases and things like that. We don't care. But we write solutions usually that are a bit more involved."},{"id":2,"text":"A lot of the solutions are for things where we initially didn't even ask for justification, right? So we're just writing. So our solutions we're writing, they might not quite pass muster in the math department, but they'd be awfully close. And we are absolutely not expecting that of you. So for people who look at the solutions and go like, whoa, that's a long solution. And what are all these corner cases? You don't have to do that. So that's the first thing, just to reassure you."},{"id":3,"text":"CVXPy had some questions, and I just want to say, make one announcement about this. Whatever you do, do not treat the coding assignments where you do CVXPy as kind of at a monkey at a typewriter thing, like type stuff in and say, oh, it doesn't work. And then conceptualize it as, I have to find out a way for CVXPy to accept what I'm saying."},{"id":4,"text":"This is exactly the opposite we want. And if we detect that at any time, it's going to piss us off. And bad things happen when we get pissed off. So anyway, it's not the point. So the main point is this. In discipline convex programming,"},{"id":5,"text":"you know what you're doing, right? So if you type in, if you type in something that's non-convex and then like post something saying, I don't know, CVX pi doesn't accept my, you know, my something squared equals three."},{"id":6,"text":"constraint, that is uncool. That's all I'm going to say, at least in this class, very uncool. So I'm just saying that, you know, it's not the right way to do a programming class and it's definitely not the right way to approach these problems. So, I mean, it's perfectly okay if you have some syntax thing or something. I mean, everyone at some point in their life is going to declare a variable x."},{"id":7,"text":"So, I mean, it's perfectly okay if you have some syntax thing or something. I mean, everyone at some point in their life is going to declare a variable x. Later, think that x is actually the numerical vector after you've solved it. Plug in x somewhere and it's going to say, what are you doing? Python will, because, well, x is an object and x.value is what you want. Everybody understand what I'm saying? Everyone will confuse an equals with equals equals, right? Equals is actually an assignment in Python, right? Equals equals."}],"notes":["本段主要讲解了课程中关于编程作业的注意事项，特别是关于使用CVXPy工具时的常见错误。讲者强调，学生不应将编程作业视为随机输入代码并期望其工作的过程，而应理解所使用的工具和方法。","讲者指出，如果学生提交的代码包含非凸问题，或者在使用CVXPy时没有正确理解其限制，这会被视为不专业。这种行为不仅不符合编程课程的要求，也不利于正确解决实际问题。","此外，讲者还提到Python中变量赋值和比较操作符的常见混淆问题，例如将等号（=）与双等号（==）混淆。这可能导致代码错误，学生需要理解Python中赋值和比较操作符的区别。","讲者强调，编程作业的目标是理解问题和工具的使用，而不是盲目尝试代码。学生应避免将编程视为“猴子打字机”式的随机尝试，而是应有意识地构建和验证代码。","最后，讲者提醒学生，即使在编程过程中出现语法错误，这也是正常的，但关键在于理解错误的原因并进行修正，而不是简单地重复输入代码。","这些内容帮助学生理解如何正确使用CVXPy工具，避免常见的编程错误，并培养良好的编程习惯。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":176.79,"asr_flags":[],"raw_segments":[{"start":5.23,"text":"Before we get started today, I just did want to make a couple of announcements about homework, because just a bunch of things came up that I thought it's probably better for me to say something about. So the first is we had a couple of people inquire about our solutions, right?"},{"start":25.46,"text":"Our solutions to the homework are generally much more involved than we would expect from you. In fact, we wouldn't even want you to do that because it's not the point, right? In this class, we don't care about little corner cases and things like that. We don't care. But we write solutions usually that are a bit more involved."},{"start":44.34,"text":"A lot of the solutions are for things where we initially didn't even ask for justification, right? So we're just writing. So our solutions we're writing, they might not quite pass muster in the math department, but they'd be awfully close. And we are absolutely not expecting that of you. So for people who look at the solutions and go like, whoa, that's a long solution. And what are all these corner cases? You don't have to do that. So that's the first thing, just to reassure you."},{"start":75.23,"text":"CVXPy had some questions, and I just want to say, make one announcement about this. Whatever you do, do not treat the coding assignments where you do CVXPy as kind of at a monkey at a typewriter thing, like type stuff in and say, oh, it doesn't work. And then conceptualize it as, I have to find out a way for CVXPy to accept what I'm saying."}, ight, that was weird, but I needed to say it."},{"id":10,"text":"Oh, the other question was about, you know, we start doing some of these kind of practical-ish problems. Actually, some of them are quite, are actually quite real. I mean, real versions of them would be not much more complicated, frankly. So instead of writing a 10-line script, you might write an 80-line script and have more stuff in there. But nevertheless, they start getting real. And a couple people have asked, how do you, you know, when you work on those problems,"},{"id":11,"text":"how do you know you actually did it right or something like that and so here i'm going to be hint we design those problems and we design them typically in a way where you can check at least intuitively that something good happened right sometimes we ask you to compare it to some kind of simple solution right and then if the simple solution is worse than yours"},{"id":12,"text":"something's not right right if if you're doing let's say a problem on optimizing operation of some energy storage devices or something like that if you add just so here even if you're in statistics or you know biology doesn't matter it should be clear that you know if we give you energy storage the cost should go down I mean this is just completely you know simple reasoning right the cost should go down so what you should do at that point is"},{"id":13,"text":"is check that that happens. If it doesn't go down, by the way, of course, in some real problems, you set up a problem and what you end up with is not better than some simple solution, right? That actually does happen. It doesn't happen here because it kind of undermines our message here. Also, it doesn't allow you to check that what you're doing. So don't just do the problem, even if it's a field outside the one you're in, don't do it and then mindlessly say, okay, there isn't plot something. Just sit and think, just give yourself five minutes afterwards to think and go."},{"id":14,"text":" and sides are affine. Everybody see what I'm saying? So I'm just saying, please..."},{"start":204.6,"text":"I know most of you are, but please just make sure you're kind of present, thinking about what you're doing and not just typing stuff in, right? Because that's not the spirit of it. All right, that was weird, but I needed to say it."},{"start":219.42,"text":"Oh, the other question was about, you know, we start doing some of these kind of practical-ish problems. Actually, some of them are quite, are actually quite real. I mean, real versions of them would be not much more complicated, frankly. So instead of writing a 10-line script, you might write an 80-line script and have more stuff in there. But nevertheless, they start getting real. And a couple people have asked, how do you, you know, when you work on those problems,"},{"start":247.68,"text":"how do you know you actually did it right or something like that and so here i'm going to be hint we design those problems and we design them typically in a way where you can check at least intuitively that something good happened right sometimes we ask you to compare it to some kind of simple solution right and then if the simple solution is worse than yours"},{"start":270.06,"text":"something's not right right if if you're doing let's say a problem on optimizing operation of some energy storage devices or something like that if you add just so here even if you're in statistics or you know biology doesn't matter it should be clear that you know if we give you energy storage the cost should go down I mean this is just completely you know simple reasoning right the cost should go down so what you should do at that point is"},{"start":297.67,"text":"is check that that happens. If it doesn't go down, by the way, of course, in some real problems, you set up a problem and what you end up with is not better than some simple solution, right? That actually does happen. It doesn't happen here because it kind of undermines our message here. Also, it doesn't allow you to check that what you're doing. So don't just do the problem, even if it's a field outside the one you're in, don't do it and then mindlessly say, okay, there isn't plot something. Just sit and think, just give yourself five minutes afterwards to think and go."},{"start":326.9,"text":"Okay, that's cool. I saved money by storing energy when it was cheap and dumping it back in when it was expensive or something like that, right? Everybody see what I'm saying? So this would be, so I just, I'm just saying, please, please do that for those things. Okay. Oh, and the last thing is I had a bunch of questions and I'm not even sure I know how to answer them, but people have just said, I don't know how to approach these. And I just want to say a little bit about that. So first I should tell you the design."}],"speech_gaps":[],"frame":"../frames/v009/002.webp","frame_time":189.71},{"title":"课程设计与实际应用","segments":[{"id":15,"text":"but the design side what we do on our side here's what we do"},{"id":16,"text":"So we don't do silly things like teach you duality and then say, find the dual of this. Because that's basically high school like, here's integration by parts. What's the integral of t squared sine t? Come on, this is ridiculous. I mean, not only could, anyway, that's just, we don't do that here. So the way we do it is we actually, you'll end up doing problems related to the material we cover."},{"id":17,"text":"sometimes impractical problems, and we won't use the words that appear. We won't give you a hint. Sometimes we have to, but sometimes we don't. So here would be an example. We have many stealth problems that actually will rely on duality, and we don't use the D word."},{"id":18,"text":"Okay, because the truth is that's the way it's really going to go down. If you're at an internship, if you are at a startup or something like that, no one's going to come up to you and say, oh, help me, help me. I think we can use like a theorem of the alternatives just to solve this problem. That's not going to happen. What's going to happen is they're going to come to you and say, oh my God, this is so complicated. It's unbelievable. We have this estimator and that thing and these estimates and that we need to combine. And it'll go on and this is, you know, and it'll be some long, complicated thing."},{"id":19,"text":"Your job will be to go somewhere quiet, think for a while, and go like, whoa, we can solve that, right? And it'll be through duality. So just to let you know, what we call that, that's using the ideas in the wild. And that's what we're interested in. We might give you a warm-up or two that's in a little sandbox or something. But after that, it's going to be in the wild. So watch out. Anyway, I just want to say that's the design of a lot of the practical problems."},{"id":20,"text":"What else was I going to say? Maybe that's it. Any questions about that? Yeah. Why in reality, we can get a solution that is not as good as a reasonable one? Oh, yeah. Okay. If it's solving exactly the same problem, then of course that can't happen."},{"id":21,"text":"So that, yeah, I shouldn't have said that. It could be that you get no improvement. That would be one, right? And that certainly is a thing, right? You say, oh my God, this is so, I got a great idea and I have the storage device and it just doesn't help you at all, right? So yeah, I misspoke when I said that. Oh, and I forgot to, I did want to announce on the midterm, how did chat GPT do? Like seven."},{"id":22,"text":"No, come on. Actually, I can open it up right now. Okay. Well, I think the executive summary is terribly. I'm happy to announce. So, anyway. Anyway, well, anyway, I just wanted to mention that."}],"notes":["本段主要讲解了课程设计的思路，强调实际应用而非单纯理论教学。讲者指出，课程不会像高中那样直接教学生如何求对偶问题，而是通过实际问题让学生理解对偶性。这种设计是为了让学生在实际工作中能够运用所学知识，而不是机械地应用公式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":356.11,"end":533.02,"asr_flags":[],"raw_segments":[{"start":356.11,"text":"but the design side what we do on our side here's what we do"},{"start":360.47,"text":"So we don't do silly things like teach you duality and then say, find the dual of this. Because that's basically high school like, here's integration by parts. What's the integral of t squared sine t? Come on, this is ridiculous. I mean, not only could, anyway, that's just, we don't do that here. So the way we do it is we actually, you'll end up doing problems related to the material we cover."},{"start":388.07,"text":"sometimes impractical problems, and we won't use the words that appear. We won't give you a hint. Sometimes we have to, but sometimes we don't. So here would be an example. We have many stealth problems that actually will rely on duality, and we don't use the D word."},{"start":405.91,"text":"Okay, because the truth is that's the way it's really going to go down. If you're at an internship, if you are at a startup or something like that, no one's going to come up to you and say, oh, help me, help me. I think we can use like a theorem of the alternatives just to solve this problem. That's not going to happen. What's going to happen is they're going to come to you and say, oh my God, this is so complicated. It's unbelievable. We have this estimator and that thing and these estimates and that we need to combine. And it'll go on and this is, you know, and it'll be some long, complicated thing."},{"start":433.73,"text":"Your job will be to go somewhere quiet, think for a while, and go like, whoa, we can solve that, right? And it'll be through duality. So just to let you know, what we call that, that's using the ideas in the wild. And that's what we're interested in. We might give you a warm-up or two that's in a little sandbox or something. But after that, it's going to be in the wild. So watch out. Anyway, I just want to say that's the design of a lot of the practical problems."},{"start":462.49,"text":"What else was I going to say? Maybe that's it. Any questions about that? Yeah. Why in reality, we can get a solution that is not as good as a reasonable one? Oh, yeah. Okay. If it's solving exactly the same problem, then of course that can't happen."},{"start":486.98,"text":"So that, yeah, I shouldn't have said that. It could be that you get no improvement. That would be one, right? And that certainly is a thing, right? You say, oh my God, this is so, I got a great idea and I have the storage device and it just doesn't help you at all, right? So yeah, I misspoke when I said that. Oh, and I forgot to, I did want to announce on the midterm, how did chat GPT do? Like seven."},{"start":516.59,"text":"No, come on. Actually, I can open it up right now. Okay. Well, I think the executive summary is terribly. I'm happy to announce. So, anyway. Anyway, well, anyway, I just wanted to mention that."}],"speech_gaps":[],"frame":"../frames/v009/003.webp","frame_time":368.11},{"title":"对偶性与问题重述","segments":[{"id":23,"text":"Okay. 12 out of 43. 12 out of 43. 12 out of 43? Yeah. That's not very good, okay? So that's fine. But I'm sure it was beautifully written, right? It was articulate and sounded like it was right, right?"},{"id":24,"text":"Okay, so we'll get back. Today we're going to finish off what is essentially the theory, actually in about 20 minutes, we're going to finish off what is essentially the first section of the course, which is basically all the theory. I mean, as you can see, we've already segued into real stuff as well. Then we'll start the second part of the course, which is just all applications, right? So that's kind of the idea. And then the whole idea, by the way, as I've said many, many times, we don't expect you to have a total mastery of all the theory we've covered, which is actually a lot."},{"id":25,"text":"What will happen is as you do other practical problems in the next three, four weeks, hopefully there, that will be your excuse to go back and review something in the theory or learn it better. And ight?"},{"start":992.1,"text":"So, but in fact, people would allow you this license and you get something."},{"start":997.12,"text":"And by the way, by now you should be starting to see patterns, which should be, you know,"},{"start":1002.74,"text":"when you see a function appear in what's called the primal problem,"},{"start":1007.28,"text":"then in the dual, you should kind of expect to see conjugates, okay?"},{"start":1010.9,"text":"So if your original function, for example, had like Kullback-Leibler divergence or relative entropy,"},{"start":1017.5,"text":"then you should, even before you start doing any calculation,"},{"start":1021.28,"text":"you should expect to see exponentials and log some exp in the dual."},{"start":1026.82,"text":"And if it doesn't show up that way, then that's kind of a, you should maybe double check what you did."},{"start":1031.52,"text":"Everybody see what I'm saying?"},{"start":1034.36,"text":"So here, the other thing is there's some other obvious things you should know."},{"start":1037.86,"text":"know, I mean, you should, you should expect to see the adjoint or the transpose. If you see an A"},{"start":1042.72,"text":"here, you should not at all be surprised to see an A transpose appear in the dual. Okay. So I won't,"}],"speech_gaps":[],"frame":"../frames/v009/006.webp","frame_time":882.16},{"title":"对偶问题与部分对偶化","segments":[{"id":56,"text":"I mean, some people make, you know, tables of this about, you know, what you expect to see in one or"},{"id":57,"text":"the other and all that kind of stuff. I think it's better just to think of it as patterns that you"},{"id":58,"text":"should expect and you should, you should, so you should just be preloading. There should be things"},{"id":59,"text":"you should expect all of us if you you know if your problem is involves L"},{"id":60,"text":"infinity norms the dual should probably involve conjugate of an L infinity norm"},{"id":61,"text":"or not conjugate what you you should get an L you should expect an L1 norm"},{"id":62,"text":"exactly right so it's just it's stuff like that these are things that you'll"},{"id":63,"text":"just you will see patterns okay this is what people refer to as something called"},{"id":64,"text":"partial dualization or partial Lagrangian. What you do is, you know, here's an original problem. And if you work out, you know, this is an LP. And when you work out the LP, you get something that looks like that."},{"id":65,"text":"Okay, the dual of that LP, right? So another way to do it is to say, you know what? I am not going to dualize over this. People call that a box constraint, right? It's the constraint that all your variables are between plus and minus one. You see, I'm not going to dualize over it. Instead, I'm going to take this thing."},{"id":66,"text":"and I'm going to make an indicator function of it and plug it into the objective, right? So obviously it's equivalent, right? So this problem is clearly equivalent to this one, right? The difference is here you would say that the box constraints are explicit. Here, the box constraints are implicit because they're embedded in the objective, and it just makes the objective return plus infinity if you're not feasible, right? Make sense? So, all right, well, we can actually work out..."},{"id":67,"text":"Lagrange dual of this so here here remember what happens is you form you form a Lagrangian the Lagrangian is actually an affine function of X then you minimize but when you minimize an affine function you just either get minus infinity or you get or you get the constant part but only when the linear part is zero right um here it's different because here I have to minimize here an affine function of X"},{"id":68,"text":"subject to all the entries between minus 1 and 1. That we can do analytically, right? Because the constant part, that's nu transpose minus b, that pops out. And then here, you end up with a linear thing, a linear function of x. It is, in fact, a transpose nu plus c quantity transpose x. And we want to minimize that."},{"id":69,"text":"over all x's between minus one and one. And this is, you know, like Koshy Schwartz, I guess it's called the Holder Inequality. And the Holder, that says the best choice is to take"}],"notes":["本段讲授了凸优化中对偶问题的构建方法，特别是部分对偶化（partial dualization）或部分拉格朗日（partial Lagrangian）的概念。讲者指出，当处理带有盒约束（box constraints）的问题时，可以将这些约束隐式地嵌入目标函数中，通过引入指示函数（indicator function）来实现。这种方法使得约束条件不再显式地出现在问题中，而是通过目标函数的值（如无穷大）来体现约束的可行性。","讲者进一步说明了如何构建拉格朗日对偶问题。当目标函数是关于变量X的仿射函数时，最小化该函数的结果取决于线性部分是否为零。如果线性部分不为零，则最小值为负无穷；如果线性部分为零，则最小值为常数项。这种分析方法适用于具有盒约束的优化问题。","在处理盒约束时，讲者提到可以通过分析目标函数的结构来找到最优解。例如，当约束条件为所有变量在-1到1之间时，可以通过分析目标函数的线性部分和常数项来找到最小值。这种方法利用了Hölder不等式，该不等式在处理不同范数之间的关系时非常有用。","讲者还提到，当处理涉及L∞范数的问题时，其对偶问题通常会涉及L1范数。这是因为L∞范数的共轭函数是L1范数，而L1范数的共轭函数是L∞范数。这种对偶关系在凸优化中非常重要，可以帮助理解不同范数之间的转换关系。","在构建拉格朗日对偶问题时，讲者强调了显式约束和隐式约束的区别。显式约束直接出现在问题中，而隐式约束则通过目标函数的结构来体现。这种方法在处理复杂约束时非常有用，因为它可以简化问题的表达形式。","最后，讲者提到Hölder不等式在处理不同范数之间的关系时的应用。Hölder不等式是凸优化中的一个重要工具，它可以帮助理解不同范数之间的对偶关系，并在优化问题中找到最优解。"],"formulas":[],"uncertainties":["Koshy Schwartz"],"diagram":"none","start":1047.9,"end":1215.29,"asr_flags":[60],"math_clarifications":["原始文本中提到的拉格朗日函数未完整表达，缺少关键项，因此无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1047.9,"text":"I mean, some people make, you know, tables of this about, you know, what you expect to see in one or"},{"start":1052.4,"text":"the other and all that kind of stuff. I think it's better just to think of it as patterns that you"},{"start":1058.14,"text":"should expect and you should, you should, so you should just be preloading. There should be things"},{"start":1063.6,"text":"you should expect all of us if you you know if your problem is involves L"},{"start":1067.38,"text":"infinity norms the dual should probably involve conjugate of an L infinity norm"},{"start":1076.58,"text":"or not conjugate what you you should get an L you should expect an L1 norm"},{"start":1080.58,"text":"exactly right so it's just it's stuff like that these are things that you'll"},{"start":1085.54,"text":"just you will see patterns okay this is what people refer to as something called"},{"start":1097.21,"text":"partial dualization or partial Lagrangian. What you do is, you know, here's an original problem. And if you work out, you know, this is an LP. And when you work out the LP, you get something that looks like that."},{"start":1111.38,"text":"Okay, the dual of that LP, right? So another way to do it is to say, you know what? I am not going to dualize over this. People call that a box constraint, right? It's the constraint that all your variables are between plus and minus one. You see, I'm not going to dualize over it. Instead, I'm going to take this thing."},{"start":1127.49,"text":"and I'm going to make an indicator function of it and plug it into the objective, right? So obviously it's equivalent, right? So this problem is clearly equivalent to this one, right? The difference is here you would say that the box constraints are explicit. Here, the box constraints are implicit because they're embedded in the objective, and it just makes the objective return plus infinity if you're not feasible, right? Make sense? So, all right, well, we can actually work out..."},{"start":1156.75,"text":"Lagrange dual of this so here here remember what happens is you form you form a Lagrangian the Lagrangian is actually an affine function of X then you minimize but when you minimize an affine function you just either get minus infinity or you get or you get the constant part but only when the linear part is zero right um here it's different because here I have to minimize here an affine function of X"},{"start":1185.38,"text":"subject to all the entries between minus 1 and 1. That we can do analytically, right? Because the constant part, that's nu transpose minus b, that pops out. And then here, you end up with a linear thing, a linear function of x. It is, in fact, a transpose nu plus c quantity transpose x. And ere it is."},{"id":81,"text":"Here's a semi-definite program. You're minimizing a linear function. I get that maybe this is an inequality form, right? Subject to, this is called an LMI, a linear matrix inequality. It's supposed to look like a linear inequality, except these are symmetric matrices, the Fs and the G. And that inequality there is with respect to the positive semi-definite cone. Okay? Then the Lagrangian looks like this. So here I have to take the inner product of what I would call lambda. Here I'm going to, instead of lambda, I'm going to call it capital Z."},{"id":82,"text":"It's going to be a symmetric matrix. And you should read trace of z times that's the error or this minus that. You should read that as the inner product. So this is basically what lambda transpose fi or f1 of x would be. That's how you should read this part. And here's the Lagrangian. And the dual says I should minimize this over x."},{"id":83,"text":"It's complicated because there's symmetric matrices flying all over the place. But it turns out this is simply an affine function of x, and the same story holds. If you minimize an affine function, it's going to be minus infinity unless the linear part vanishes. And so if it does, it says, if I look at how does this depend on x1? And the answer is it's c1, x1. That's from here."}],"notes":["本段讲解了对偶问题中非负性条件的使用，以及如何通过内积来构建对偶函数。讲者指出，当向量在对偶锥中非负，且与另一个锥中的非正向量内积时，结果会小于等于零。这是构建对偶函数的关键步骤。","讲者提到半正定规划（SDP）的结构，其中目标是最小化一个线性函数，约束条件是线性矩阵不等式（LMI）。LMI中的矩阵是关于正半定锥的，这与一般的线性不等式不同。","在构建Lagrangian时，讲者使用了对称矩阵Z来代替标量λ，并指出其与目标函数的内积关系。这种内积的计算方式类似于标量情况下的λ^T f_i，但需要考虑矩阵的对称性。","讲者强调，尽管半正定规划中涉及对称矩阵，但Lagrangian实际上仍然是关于x的仿射函数。这种结构使得对偶问题的分析与标量情况类似，但需要处理矩阵的对称性和内积计算。","讲者指出，当最小化一个仿射函数时，结果可能趋向于负无穷，除非线性部分消失。这种分析方法适用于半正定规划中的对偶问题，帮助确定对偶问题的可行性。","讲者提到，这种对偶问题的构建和分析在25到30年前是前沿研究，现在已成为标准内容，说明该领域的发展和理论的成熟。"],"formulas":[{"latex":"L(x, z) = c^T x - z^T (A - B x)","symbols":"Lagrangian 函数 L(x, z) 是关于 x 和 z 的函数，其中 z 是对称矩阵","explanation":"该公式正确表达了Lagrangian函数的形式，其中z是对称矩阵，且内积形式正确。","evidence":"It's going to be a symmetric matrix. And you should read trace of z times that's the error or this minus that. You should read that as the inner product. So this is basically what lambda transpose fi or f1 of x would be. That's how you should read this part. And here's the Lagrangian. And the dual says I should minimize this over x."},{"latex":"L(x, z) = \\text{affine function of } x","symbols":"Lagrangian 是关于 x 的仿射函数","explanation":"该公式正确描述了Lagrangian函数关于x的性质，即为仿射函数。","evidence":"I mean, it's complicated because there's symmetric matrices flying all over the place. But it turns out this is simply an affine function of x, and the same story holds. If you minimize an affine function, it's going to be minus infinity unless the linear part vanishes. And so if it does, it says, if I look at how does this depend on x1? And the answer is it's c1, x1. That's from here."}],"uncertainties":["trace of z times that's the error or this minus that"],"diagram":"none","start":1388.44,"end":1567.32,"asr_flags":[],"math_clarifications":["在半正定规划中，内积应使用迹运算（trace）来表示，而不是简单的矩阵乘法。因此，公式0中的内积表示不准确，需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1388.44,"text":"Actually, lambda i is going to have to be non-negative in the dual cone, which again kind of makes sense here. So here's the Lagrangian, and then here's the dual function."},{"start":1406.33,"text":"And then the lower bound property is the same, right? Because what happens is if these vectors are bigger than or equal to zero in this generalized inequality, right? Then it turns out that dual function is a lower bound on p star, right? And the way you do that is it's identical to the other one. In the other one, there's no transpose. Lambda i is a scalar, f i is a scalar. And we use the deep fact."},{"start":1433.28,"text":"In that case, that the product of a non-negative number and a non-positive number is non-positive. Here, it is a little bit more, right? We're using the fact that if I give you a vector that's non-negative in the dual cone, and the inner product of that with a vector that is, did I get that right? Yes, non-positive in another cone, in the cone, then the inner product is actually less than or equal to zero."},{"start":1460.58,"text":"Right. So it's not much more complicated, but that's it. Right. And then you get a dual problem and everything works later. Everything, everything just works. And we'll look at just the last example of this. But it's kind of cool because this is stuff that I don't know, 25 years ago, 30 years ago, no one knew this. Right. Would have been just stunning. But here it is."},{"start":1482.7,"text":"Here's a semi-definite program. You're minimizing a linear function. I get that maybe this is an inequality form, right? Subject to, this is called an LMI, a linear matrix inequality. It's supposed to look like a linear inequality, except these are symmetric matrices, the Fs and the G. And that inequality there is with respect to the positive semi-definite cone. Okay? Then the Lagrangian looks like this. So here I have to take the inner product of what I would call lambda. Here I'm going to, instead of lambda, I'm going to call it capital Z."},{"start":1512.04,"text":"It's going to be a symmetric matrix. And you should read trace of z times that's the error or this minus that. You should read that as the inner product. So this is basically what lambda transpose fi or f1 of x would be. That's how you should read this part. And here's the Lagrangian. And the dual says I should minimize this over x."},{"start":1538.76,"text":"I mean, it's complicated because there's symmetric matrices flying all over the place. But it turns out this is simply an affine function of x, and the same story holds. If you minimize an affine function, it's going to be minus infinity unless the linear part vanishes. And so if it does, it says, if I look at how does this depend on x1? And the answer is it's c1, x1. That's from here."}],"speech_gaps":[],"frame":"../frames/v009/009.webp","frame_time":1400.44},{"title":"对偶性与可行性问题","segments":[{"id":84,"text":"plus, and then trace Z F1 times X1. And so those two added together have to be zero. Otherwise, if I take X1 going off to plus infinity or minus infinity, I can make this thing minus infinity, right? So you get this. And then you end up with this dual semi-definite program, and it looks like that, right? So it says, you know, to minimize, you know, so linear function over this LMI, this problem"},{"id":85,"text":"This is now what, it's dual. And I don't think it's obvious. Like you wouldn't, I mean, it's not difficult to show parts of it. Weak duality is completely straightforward. Strong duality is not obvious, but that's it. So, okay. So that covers that. And again, you probably get some chances to do some of this on homework."},{"id":86,"text":"Okay. Actually, before I go on to this, I just want to mention one more topic, which we didn't cover in the lecture, but we're expecting you to know. It is actually duality for feasibility problems. That's what it is. And the name for that is called theorems of the alternative. And the way that works is pretty simple. And I'll just say a little bit about it, but you will encounter it."},{"id":87,"text":"You may, I think you're encountering, you may be encountering it now on the current homework. Is that, yes, is there an option pricing thing? Yes, sorry, you will be encountering it now. Of course, I just gave that away, but that's fine, sorry. So, but that's okay, right? So the basic idea."},{"id":88,"text":"is you write a feasibility problem as minimize zero subject to, you know, fi of x is less than zero, and let's make it convex, so, well, it doesn't matter, and hi of x equals zero, right? So there's your feasibility problem. This thing has optimal value zero if these constraints are feasible. Otherwise, the optimal value is plus infinity."},{"id":89,"text":"Because if it's not feasible, there's no x that satisfies this. And by completely standard assumption or definition, the infimum of the empty set is plus infinity. So this has either p star equals zero or infinity. And you can work out what the dual is. It's not complicated at all. And it's going to turn out you're going to get d star. And then interesting things are going to happen. This always holds."}],"notes":["本段讲授了对偶性在半定规划中的应用，强调了弱对偶性是显然的，而强对偶性则需要进一步证明。讲者提到，学生可能在作业中遇到相关问题，这表明对偶性是课程的重要内容之一。","讲者提到可行性问题的对偶性，即所谓的替代定理（theorems of the alternative）。这种对偶性将可行性问题转化为最小化零的目标函数，并通过约束条件来判断问题是否可行。","讲者指出，当约束条件不可行时，最优值为正无穷大，这是基于空集的下确界定义。这表明在处理可行性问题时，需要考虑问题是否可行，以及如何通过对偶性来判断。","讲者提到，通过将可行性问题转化为对偶问题，可以得到对偶最优值d*，并指出这种对偶性在处理可行性问题时具有普遍性，即总是成立。","讲者提到当前的作业中可能涉及这种对偶性，这表明课程内容与实际应用相结合，学生需要通过练习来掌握相关概念。","讲者强调了对偶性在优化问题中的重要性，特别是在处理可行性问题时，通过对偶性可以更有效地分析和解决实际问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1567.98,"end":1725.14,"asr_flags":[],"math_clarifications":["原文未提供足够的上下文来确认p*和d*的定义，因此无法核定这些符号的数学含义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1567.98,"text":"plus, and then trace Z F1 times X1. And so those two added together have to be zero. Otherwise, if I take X1 going off to plus infinity or minus infinity, I can make this thing minus infinity, right? So you get this. And then you end up with this dual semi-definite program, and it looks like that, right? So it says, you know, to minimize, you know, so linear function over this LMI, this problem,"},{"start":1595.56,"text":"This is now what, it's dual. And I don't think it's obvious. Like you wouldn't, I mean, it's not difficult to show parts of it. Weak duality is completely straightforward. Strong duality is not obvious, but that's it. So, okay. So that covers that. And again, you probably get some chances to do some of this on homework."},{"start":1619.08,"text":"Okay. Actually, before I go on to this, I just want to mention one more topic, which we didn't cover in the lecture, but we're expecting you to know. It is actually duality for feasibility problems. That's what it is. And the name for that is called theorems of the alternative. And the way that works is pretty simple. And I'll just say a little bit about it, but you will encounter it."},{"start":1649.96,"text":"You may, I think you're encountering, you may be encountering it now on the current homework. Is that, yes, is there an option pricing thing? Yes, sorry, you will be encountering it now. Of course, I just gave that away, but that's fine, sorry. So, but that's okay, right? So the basic idea."},{"start":1668.72,"text":"is you write a feasibility problem as minimize zero subject to, you know, fi of x is less than zero, and let's make it convex, so, well, it doesn't matter, and hi of x equals zero, right? So there's your feasibility problem. This thing has optimal value zero if these constraints are feasible. Otherwise, the optimal value is plus infinity."},{"start":1696.06,"text":"Because if it's not feasible, there's no x that satisfies this. And by completely standard assumption or definition, the infimum of the empty set is plus infinity. So this has either p star equals zero or infinity. And you can work out what the dual is. It's not complicated at all. And it's going to turn out you're going to get d star. And then interesting things are going to happen. This always holds."}],"speech_gaps":[],"frame":"../frames/v009/010.webp","frame_time":1579.98},{"title":"对偶问题与可行性分析","segments":[{"id":90,"text":"that always holds convex non-convex doesn't make any difference at all it always holds right and this would tell you some cool things like for example if this was let's say this is a set of non-convex inequalities right but if i form the dual and the dual if i find the dual is unbounded above meaning d stars plus infinity what can you say"},{"id":91,"text":"Yeah, the original one is not feasible. I would say, well, how could you say that? I'm sorry, that problem is like NP-hard to determine if these inequalities are feasible, right? What would you respond then when I said that? Yeah, you just say, yeah, sorry, but it's completely elementary that this is a lower bound on the optimal value. And in fact, it would be good enough if I worked out the dual of this. If I found a point..."},{"id":92,"text":"you know, some lambda and nu's for the dual, and I evaluated it, and d star was equal to 1, what could you conclude? What do you conclude? It's invisible. And the argument would go like this, which is actually kind of interesting, right? That number is either 0 or plus infinity. Okay? If I tell you 1 is a lower bound on it, well, hello, but now the only possible value for this is plus infinity. And that means precisely that your problem is infeasible. Everybody,"},{"id":93,"text":"Got this? Okay. So, I mean, that was just a whirlwind tour. You'll find, and these are generally called theorem of the alternatives because they basically say this set of, when it's, okay, in the convex case, it says this set of inequalities has a solution if and only if these, this other set does not. Everybody."},{"id":94,"text":"Got that? I'm just giving you the big, high, you know, big, broad strokes description of the topic. Everybody? And there's some famous ones, like for linear inequalities, it's called the Farkas Lemma or something like that, right? And this comes up in lots of different things. One is, it's kind of the basis of most, of a lot of classical economics and finance, right?"},{"id":95,"text":"Because there, everything would be based on the idea. I'd say, here's a bunch of stuff you can invest in. If you can invest in these things and never lose money in all cases, and under some circumstance make money, that's called an arbitrage. And then a lot of finance says, or a lot of classical finance says, that can't happen."}],"notes":["本段讨论了凸优化中对偶问题的性质，特别是当对偶问题无界时，原问题的可行性。讲者指出，如果对偶问题的上界是正无穷，那么原问题可能是不可行的。这涉及到对偶问题与原问题之间的关系，以及如何通过对偶问题的性质来判断原问题的可行性。","讲者提到，判断一组不等式是否可行在一般情况下是NP难的，但通过构造对偶问题并分析其性质，可以得到原问题的下界。如果对偶问题的最优值为1，而原问题的下界为1，那么原问题的最优值只能是正无穷，从而说明原问题不可行。","讲者进一步指出，这种关系被称为替代定理（theorems of the alternatives），它在凸优化中非常重要。在凸情况下，一组不等式有解当且仅当另一组不等式无解。","讲者还提到，这种替代定理在经济学和金融学中有广泛应用，特别是在分析套利（arbitrage）时。套利指的是在所有情况下都不会亏损，而在某些情况下还能盈利的投资策略，而经典金融理论认为这种策略是不可能存在的。","讲者通过举例说明，如果存在一种投资组合，可以在所有情况下不亏损，并在某些情况下盈利，那么这将违反金融市场的基本假设，即不存在套利机会。","讲者强调，这些概念和定理是凸优化理论中的核心内容，为理解更复杂的优化问题和实际应用提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1725.75,"end":1877.65,"asr_flags":[],"raw_segments":[{"start":1725.75,"text":"that always holds convex non-convex doesn't make any difference at all it always holds right and this would tell you some cool things like for example if this was let's say this is a set of non-convex inequalities right but if i form the dual and the dual if i find the dual is unbounded above meaning d stars plus infinity what can you say"},{"start":1753.69,"text":"Yeah, the original one is not feasible. I would say, well, how could you say that? I'm sorry, that problem is like NP-hard to determine if these inequalities are feasible, right? What would you respond then when I said that? Yeah, you just say, yeah, sorry, but it's completely elementary that this is a lower bound on the optimal value. And in fact, it would be good enough if I worked out the dual of this. If I found a point..."},{"start":1780.18,"text":"you know, some lambda and nu's for the dual, and I evaluated it, and d star was equal to 1, what could you conclude? What do you conclude? It's invisible. And the argument would go like this, which is actually kind of interesting, right? That number is either 0 or plus infinity. Okay? If I tell you 1 is a lower bound on it, well, hello, but now the only possible value for this is plus infinity. And that means precisely that your problem is infeasible. Everybody,"},{"start":1811.26,"text":"Got this? Okay. So, I mean, that was just a whirlwind tour. You'll find, and these are generally called theorem of the alternatives because they basically say this set of, when it's, okay, in the convex case, it says this set of inequalities has a solution if and only if these, this other set does not. Everybody."},{"start":1830.04,"text":"Got that? I'm just giving you the big, high, you know, big, broad strokes description of the topic. Everybody? And there's some famous ones, like for linear inequalities, it's called the Farkas Lemma or something like that, right? And this comes up in lots of different things. One is, it's kind of the basis of most, of a lot of classical economics and finance, right?"},{"start":1855.09,"text":"Because there, everything would be based on the idea. I'd say, here's a bunch of stuff you can invest in. If you can invest in these things and never lose money in all cases, and under some circumstance make money, that's called an arbitrage. And then a lot of finance says, or a lot of classical finance says, that can't happen."}],"speech_gaps":[],"frame":"../frames/v009/011.webp","frame_time":1737.75},{"title":"凸优化课程中的应用与范例","segments":[{"id":96,"text":"Right. Because if that happens, the prices would readjust in such a way that it can't, you know, somebody would go in and exploit it and blah, blah, blah, all that kind of stuff. So actually, my friends at hedge funds will assure you it can happen. So, yeah, which is why actually I know some of my friends there said there was one department in a back in a person in a candidate's background that they would just instantly throw it away. Economics."},{"id":97,"text":"I was like, why? They said, oh, we'll take, oh, people in EE, we love it. Applied physics, oh, fantastic. Math, great. I was like, why not economics? And they said, why? They looked at me and they said, why would we hire someone who's, you know, who comes from a field where the most deeply held belief, that where the entire thing is constructed."},{"id":98,"text":"on absence of arbitrage, he said, which is precisely what we do. So that kind of, anyway, we all laughed. It was mostly a joke, but not entirely, I have to s
