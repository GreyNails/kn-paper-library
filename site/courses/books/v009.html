}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">09 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 9 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v009","title":"09 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 9","course":"凸优化","pages":[{"title":"课程公告与编程注意事项","segments":[{"id":0,"text":"Before we get started today, I just did want to make a couple of announcements about homework, because just a bunch of things came up that I thought it's probably better for me to say something about. So the first is we had a couple of people inquire about our solutions, right?","zh":"在我们开始今天的课程之前，我想先宣布一些关于作业的事情，因为有一些事情我觉得最好由我说出来。首先，有一些人询问了我们的作业解答，对吧？","start":5.23,"end":24.31},{"id":1,"text":"Our solutions to the homework are generally much more involved than we would expect from you. In fact, we wouldn't even want you to do that because it's not the point, right? In this class, we don't care about little corner cases and things like that. We don't care. But we write solutions usually that are a bit more involved.","zh":"我们对作业的解答通常比我们期望的要复杂得多。事实上，我们甚至不希望你们这么做，因为这不是重点，对吧？在这门课中，我们不关心那些小的边界情况和类似的事情。我们不关心。但我们的解答通常会写得稍微复杂一些。","start":25.46,"end":43.28},{"id":2,"text":"A lot of the solutions are for things where we initially didn't even ask for justification, right? So we're just writing. So our solutions we're writing, they might not quite pass muster in the math department, but they'd be awfully close. And we are absolutely not expecting that of you. So for people who look at the solutions and go like, whoa, that's a long solution. And what are all these corner cases? You don't have to do that. So that's the first thing, just to reassure you.","zh":"很多解答是针对那些我们最初甚至没有要求证明的问题，对吧？所以我们只是在写。因此，我们写的解答可能在数学系的标准下并不完全符合，但它们会非常接近。我们绝对不期望你们做到这一点。所以对于那些看到解答后觉得，哇，这个解答好长，还有这么多边界情况的人，你们不需要这么做。这就是第一点，只是为了让大家放心。","start":44.34,"end":72.38},{"id":3,"text":"CVXPy had some questions, and I just want to say, make one announcement about this. Whatever you do, do not treat the coding assignments where you do CVXPy as kind of at a monkey at a typewriter thing, like type stuff in and say, oh, it doesn't work. And then conceptualize it as, I have to find out a way for CVXPy to accept what I'm saying.","zh":"CVXPy有一些问题，我想就这一点做一个公告。无论你们做什么，千万不要把使用CVXPy的编程作业当作一个猴子在打字机前那样，随便输入一些内容然后说，哦，它不工作。然后把问题概念化为，我必须找到一种方法让CVXPy接受我所说的。","start":75.23,"end":97.67},{"id":4,"text":"This is exactly the opposite we want. And if we detect that at any time, it's going to piss us off. And bad things happen when we get pissed off. So anyway, it's not the point. So the main point is this. In discipline convex programming,","zh":"这正是我们所不希望看到的。如果我们发现这种情况，我们会很生气。当我们生气时，会发生不好的事情。所以不管怎样，这不是重点。重点在于，学科凸规划中，","start":98.37,"end":114.72},{"id":5,"text":"you know what you're doing, right? So if you type in, if you type in something that's non-convex and then like post something saying, I don't know, CVX pi doesn't accept my, you know, my something squared equals three.","zh":"你们知道自己在做什么，对吧？所以如果你们输入了某些非凸的内容，然后发帖说，我不知道，CVX pi 不接受我的，比如我的某个东西的平方等于三。","start":115.52,"end":128.76},{"id":6,"text":"constraint, that is uncool. That's all I'm going to say, at least in this class, very uncool. So I'm just saying that, you know, it's not the right way to do a programming class and it's definitely not the right way to approach these problems. So, I mean, it's perfectly okay if you have some syntax thing or something. I mean, everyone at some point in their life is going to declare a variable x.","zh":"约束，这很不酷。这是我在这门课上要说的全部，非常不酷。我只是在说，这样做编程课是不对的，而且绝对不是解决这些问题的正确方法。我的意思是，如果你有一些语法问题或者类似的问题，这完全是可以接受的。我的意思是，每个人在他们的一生中都会声明一个变量x。","start":130.16,"end":150.44},{"id":7,"text":"So, I mean, it's perfectly okay if you have some syntax thing or something. I mean, everyone at some point in their life is going to declare a variable x. Later, think that x is actually the numerical vector after you've solved it. Plug in x somewhere and it's going to say, what are you doing? Python will, because, well, x is an object and x.value is what you want. Everybody understand what I'm saying? Everyone will confuse an equals with equals equals, right? Equals is actually an assignment in Python, right? Equals equals.","zh":"我的意思是，如果你有一些语法问题或者类似的问题，这完全是可以接受的。我的意思是，每个人在他们的一生中都会声明一个变量x。之后，你可能会认为x实际上是求解后的数值向量。然后你在某个地方插入x，它会说，你在做什么？Python会这样做，因为x是一个对象，而x.value才是你想要的。大家明白我在说什么吗？每个人都会把等于号和等于等于号搞混，对吧？等于号在Python中实际上是赋值操作，对吧？等于等于号。","start":151.53,"end":176.79}],"notes":["本段主要讲解了课程中关于编程作业的注意事项，特别是关于使用CVXPy工具时的常见错误。讲者强调，学生不应将编程作业视为随机输入代码并期望其工作的过程，而应理解所使用的工具和方法。","讲者指出，如果学生提交的代码包含非凸问题，或者在使用CVXPy时没有正确理解其限制，这会被视为不专业。这种行为不仅不符合编程课程的要求，也不利于正确解决实际问题。","此外，讲者还提到Python中变量赋值和比较操作符的常见混淆问题，例如将等号（=）与双等号（==）混淆。这可能导致代码错误，学生需要理解Python中赋值和比较操作符的区别。","讲者强调，编程作业的目标是理解问题和工具的使用，而不是盲目尝试代码。学生应避免将编程视为“猴子打字机”式的随机尝试，而是应有意识地构建和验证代码。","最后，讲者提醒学生，即使在编程过程中出现语法错误，这也是正常的，但关键在于理解错误的原因并进行修正，而不是简单地重复输入代码。","这些内容帮助学生理解如何正确使用CVXPy工具，避免常见的编程错误，并培养良好的编程习惯。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":176.79,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.23,"text":"Before we get started today, I just did want to make a couple of announcements about homework, because just a bunch of things came up that I thought it's probably better for me to say something about. So the first is we had a couple of people inquire about our solutions, right?"},{"start":25.46,"text":"Our solutions to the homework are generally much more involved than we would expect from you. In fact, we wouldn't even want you to do that because it's not the point, right? In this class, we don't care about little corner cases and things like that. We don't care. But we write solutions usually that are a bit more involved."},{"start":44.34,"text":"A lot of the solutions are for things where we initially didn't even ask for justification, right? So we're just writing. So our solutions we're writing, they might not quite pass muster in the math department, but they'd be awfully close. And we are absolutely not expecting that of you. So for people who look at the solutions and go like, whoa, that's a long solution. And what are all these corner cases? You don't have to do that. So that's the first thing, just to reassure you."},{"start":75.23,"text":"CVXPy had some questions, and I just want to say, make one announcement about this. Whatever you do, do not treat the coding assignments where you do CVXPy as kind of at a monkey at a typewriter thing, like type stuff in and say, oh, it doesn't work. And then conceptualize it as, I have to find out a way for CVXPy to accept what I'm saying."},{"start":98.37,"text":"This is exactly the opposite we want. And if we detect that at any time, it's going to piss us off. And bad things happen when we get pissed off. So anyway, it's not the point. So the main point is this. In discipline convex programming,"},{"start":115.52,"text":"you know what you're doing, right? So if you type in, if you type in something that's non-convex and then like post something saying, I don't know, CVX pi doesn't accept my, you know, my something squared equals three."},{"start":130.16,"text":"constraint, that is uncool. That's all I'm going to say, at least in this class, very uncool. So I'm just saying that, you know, it's not the right way to do a programming class and it's definitely not the right way to approach these problems. So, I mean, it's perfectly okay if you have some syntax thing or something. I mean, everyone at some point in their life is going to declare a variable x."},{"start":151.53,"text":"Later, think that x is actually the numerical vector after you've solved it. Plug in x somewhere and it's going to say, what are you doing? Python will, because, well, x is an object and x.value is what you want. Everybody understand what I'm saying? Everyone will confuse an equals with equals equals, right? Equals is actually an assignment in Python, right? Equals equals."}],"speech_gaps":[],"frame":"../frames/v009/001.webp","frame_time":17.23},{"title":"CVXPy中的约束表达与实际问题验证","segments":[{"id":8,"text":"is actually a special thing in Python. Sorry, in CVXPy. If it occurs between two CVXPy expressions, that is over... So expression equals equals expression is overloaded to be a constraint. And it is only a... You can form it all you like, but you can't solve a problem with it unless both the left and right-hand sides are affine.","zh":"这在Python中实际上是一个特殊的情况。抱歉，在CVXPy中。如果它出现在两个CVXPy表达式之间，那就是过度使用了。所以表达式等于等于表达式被重载为一个约束。而且它只是一个……你可以随意构造，但除非左右两边都是仿射的，否则你无法用它来解决问题。","start":177.71,"end":204.09},{"id":9,"text":"I know most of you are, but please just make sure you're kind of present, thinking about what you're doing and not just typing stuff in, right? Because that's not the spirit of it. All right, that was weird, but I needed to say it.","zh":"我知道你们大多数人都是，但请确保你们在思考你们正在做的事情，而不是只是输入一些代码，对吧？因为那样就违背了它的精神。好了，这有点奇怪，但我需要这么说。","start":204.6,"end":217.42},{"id":10,"text":"Oh, the other question was about, you know, we start doing some of these kind of practical-ish problems. Actually, some of them are quite, are actually quite real. I mean, real versions of them would be not much more complicated, frankly. So instead of writing a 10-line script, you might write an 80-line script and have more stuff in there. But nevertheless, they start getting real. And a couple people have asked, how do you, you know, when you work on those problems,","zh":"哦，另一个问题是关于，你们开始做一些实际的问题。实际上，其中一些问题相当真实。我的意思是，真实版本的问题不会复杂得多，坦白说。所以，与其写一个10行的脚本，你可能会写一个80行的脚本，并包含更多的内容。但无论如何，它们开始变得真实了。而且有几个人问，当你处理这些问题时，","start":219.42,"end":247.08},{"id":11,"text":"how do you know you actually did it right or something like that and so here i'm going to be hint we design those problems and we design them typically in a way where you can check at least intuitively that something good happened right sometimes we ask you to compare it to some kind of simple solution right and then if the simple solution is worse than yours","zh":"你是如何知道你确实做对了或者类似的事情。在这里，我将给出提示：我们设计这些问题，通常以一种你可以至少直观地检查到某些事情发生的方式。有时我们会让你将它与某种简单的解决方案进行比较，然后如果简单的解决方案比你的方案更差，","start":247.68,"end":268.96},{"id":12,"text":"something's not right right if if you're doing let's say a problem on optimizing operation of some energy storage devices or something like that if you add just so here even if you're in statistics or you know biology doesn't matter it should be clear that you know if we give you energy storage the cost should go down I mean this is just completely you know simple reasoning right the cost should go down so what you should do at that point is","zh":"那就说明有些地方不对。例如，如果你在解决一个关于优化某些能源存储设备运行的问题，或者类似的问题，如果你添加了这么一点，即使你是在统计学或生物学领域，这也不重要，你应该清楚地知道，如果我们给你能源存储，成本应该会下降。我的意思是，这只是一个完全简单的推理，对吧？成本应该会下降，所以在这种情况下，你应该做的事情是","start":270.06,"end":296.42},{"id":13,"text":"is check that that happens. If it doesn't go down, by the way, of course, in some real problems, you set up a problem and what you end up with is not better than some simple solution, right? That actually does happen. It doesn't happen here because it kind of undermines our message here. Also, it doesn't allow you to check that what you're doing. So don't just do the problem, even if it's a field outside the one you're in, don't do it and then mindlessly say, okay, there isn't plot something. Just sit and think, just give yourself five minutes afterwards to think and go.","zh":"检查一下这种情况是否发生。顺便说一句，有些实际问题中，你设置了一个问题，最后得到的结果并不比一些简单的解更好，对吧？这种情况确实会发生。在这里它不会发生，因为它会削弱我们在这里要传达的信息。此外，它也不允许你检查你所做的工作。所以不要仅仅做这个问题，即使它属于你所不熟悉的领域，不要做完了就盲目地说，‘哦，没有出现什么问题’。请坐下来好好想想，至少在做完之后花五分钟时间思考一下。","start":297.67,"end":326.15},{"id":14,"text":"Okay, that's cool. I saved money by storing energy when it was cheap and dumping it back in when it was expensive or something like that, right? Everybody see what I'm saying? So this would be, so I just, I'm just saying, please, please do that for those things. Okay. Oh, and the last thing is I had a bunch of questions and I'm not even sure I know how to answer them, but people have just said, I don't know how to approach these. And I just want to say a little bit about that. So first I should tell you the design.","zh":"好的，这很有趣。我在电价便宜的时候储存能量，电价贵的时候再放回去，这样就能省钱，对吧？大家明白我的意思吗？所以，我只是想说，请大家对这些事情这么做。好的。另外，最后一点是我有一堆问题，我自己甚至不确定如何回答，但人们只是说他们不知道如何处理这些问题。我想稍微提一下这一点。首先，我应该告诉你们设计的思路。","start":326.9,"end":355.38}],"notes":["本段主要讲解了在CVXPy中如何使用表达式之间的等号来创建约束，强调了只有当左右两边都是仿射表达式时，才能形成有效的约束。这说明了CVXPy中对等号的重载机制，以及其在优化问题建模中的具体应用。","讲者提到在设计实际问题时，通常会设计成可以直观检查结果是否合理的类型，例如通过与简单解进行比较。这表明在实际建模过程中，验证结果的合理性是至关重要的，尤其是在涉及能源存储等实际应用时。","讲者指出，如果在优化问题中，结果没有比简单解更好，那么可能存在问题。这说明了在建模过程中，需要对结果进行验证，以确保模型的正确性和有效性。","讲者强调，即使在非本专业领域，也需要对问题进行深入思考，而不是机械地执行代码。这表明在实际建模过程中，需要结合领域知识和逻辑推理，以确保结果的正确性。","讲者提到，有时在实际问题中，即使模型设计得当，也可能无法得到比简单解更好的结果。这说明了在实际应用中，模型的性能可能受到多种因素的影响，需要综合考虑。","最后，讲者提到对于如何解决某些问题，他并不确定如何回答，但鼓励学生思考和验证自己的结果。这表明在实际建模过程中，需要不断反思和验证，以确保模型的正确性和有效性。"],"formulas":[],"uncertainties":["expression equals equals expression is overloaded to be a constraint","something's not right right if if you're doing let's say a problem on optimizing operation of some energy storage devices or something like that if you add just so here even if you're in statistics or you know biology doesn't matter it should be clear that you know if we give you energy storage the cost should go down I mean this is just completely you know simple reasoning right the cost should go down so what you should do at that point is"],"diagram":"none","start":177.71,"end":355.38,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":177.71,"text":"is actually a special thing in Python. Sorry, in CVXPy. If it occurs between two CVXPy expressions, that is over... So expression equals equals expression is overloaded to be a constraint. And it is only a... You can form it all you like, but you can't solve a problem with it unless both the left and right-hand sides are affine. Everybody see what I'm saying? So I'm just saying, please..."},{"start":204.6,"text":"I know most of you are, but please just make sure you're kind of present, thinking about what you're doing and not just typing stuff in, right? Because that's not the spirit of it. All right, that was weird, but I needed to say it."},{"start":219.42,"text":"Oh, the other question was about, you know, we start doing some of these kind of practical-ish problems. Actually, some of them are quite, are actually quite real. I mean, real versions of them would be not much more complicated, frankly. So instead of writing a 10-line script, you might write an 80-line script and have more stuff in there. But nevertheless, they start getting real. And a couple people have asked, how do you, you know, when you work on those problems,"},{"start":247.68,"text":"how do you know you actually did it right or something like that and so here i'm going to be hint we design those problems and we design them typically in a way where you can check at least intuitively that something good happened right sometimes we ask you to compare it to some kind of simple solution right and then if the simple solution is worse than yours"},{"start":270.06,"text":"something's not right right if if you're doing let's say a problem on optimizing operation of some energy storage devices or something like that if you add just so here even if you're in statistics or you know biology doesn't matter it should be clear that you know if we give you energy storage the cost should go down I mean this is just completely you know simple reasoning right the cost should go down so what you should do at that point is"},{"start":297.67,"text":"is check that that happens. If it doesn't go down, by the way, of course, in some real problems, you set up a problem and what you end up with is not better than some simple solution, right? That actually does happen. It doesn't happen here because it kind of undermines our message here. Also, it doesn't allow you to check that what you're doing. So don't just do the problem, even if it's a field outside the one you're in, don't do it and then mindlessly say, okay, there isn't plot something. Just sit and think, just give yourself five minutes afterwards to think and go."},{"start":326.9,"text":"Okay, that's cool. I saved money by storing energy when it was cheap and dumping it back in when it was expensive or something like that, right? Everybody see what I'm saying? So this would be, so I just, I'm just saying, please, please do that for those things. Okay. Oh, and the last thing is I had a bunch of questions and I'm not even sure I know how to answer them, but people have just said, I don't know how to approach these. And I just want to say a little bit about that. So first I should tell you the design."}],"speech_gaps":[],"frame":"../frames/v009/002.webp","frame_time":189.71},{"title":"课程设计与实际应用","segments":[{"id":15,"text":"but the design side what we do on our side here's what we do","zh":"但是设计方面，我们这边所做的是，这就是我们所做的","start":356.11,"end":359.07},{"id":16,"text":"So we don't do silly things like teach you duality and then say, find the dual of this. Because that's basically high school like, here's integration by parts. What's the integral of t squared sine t? Come on, this is ridiculous. I mean, not only could, anyway, that's just, we don't do that here. So the way we do it is we actually, you'll end up doing problems related to the material we cover.","zh":"所以我们不会做像教你们对偶性然后说，找出这个的对偶问题这样的傻事。因为这基本上就是高中水平，比如这里给出分部积分法。那么，t平方乘以 sine t 的积分是什么？哎呀，这太荒谬了。我的意思是，不管怎样，这只是一个，我们在这里不做这样的事情。所以我们所做的实际上是，你们最终会做与我们所讲内容相关的题目。","start":360.47,"end":386.59},{"id":17,"text":"sometimes impractical problems, and we won't use the words that appear. We won't give you a hint. Sometimes we have to, but sometimes we don't. So here would be an example. We have many stealth problems that actually will rely on duality, and we don't use the D word.","zh":"有时是不切实际的问题，而且我们不会使用那些出现的词语。我们不会给你们提示。有时我们必须这样做，但有时我们不会。举个例子，我们有许多隐藏的问题实际上会依赖于对偶性，而我们不会使用“对偶”这个词。","start":388.07,"end":404.77},{"id":18,"text":"Okay, because the truth is that's the way it's really going to go down. If you're at an internship, if you are at a startup or something like that, no one's going to come up to you and say, oh, help me, help me. I think we can use like a theorem of the alternatives just to solve this problem. That's not going to happen. What's going to happen is they're going to come to you and say, oh my God, this is so complicated. It's unbelievable. We have this estimator and that thing and these estimates and that we need to combine. And it'll go on and this is, you know, and it'll be some long, complicated thing.","zh":"好的，因为事实是，事情就是这样发展的。如果你在实习，如果你在一家初创公司之类的地方，没有人会走到你面前说，哦，帮帮我，帮帮我。我想我们可以用一个替代定理来解决这个问题。这不会发生。真正会发生的是他们会走到你面前说，天啊，这太复杂了。难以置信。我们有这个估计量和那个东西，以及这些估计和那个，我们需要把它们结合起来。这会继续下去，这是一些很长、很复杂的东西。","start":405.91,"end":432.27},{"id":19,"text":"Your job will be to go somewhere quiet, think for a while, and go like, whoa, we can solve that, right? And it'll be through duality. So just to let you know, what we call that, that's using the ideas in the wild. And that's what we're interested in. We might give you a warm-up or two that's in a little sandbox or something. But after that, it's going to be in the wild. So watch out. Anyway, I just want to say that's the design of a lot of the practical problems.","zh":"你的任务是去一个安静的地方，思考一会儿，然后说，哇，我们能解决这个问题，对吧？而这将通过对偶性来实现。所以只是让你知道，我们称之为这种做法，那就是在实际中使用这些想法。这就是我们感兴趣的内容。我们可能会给你一两个热身题，这些题可能在一个小沙盒环境中。但之后，它就会在实际中出现。所以要小心。总之，我想说的是，这就是很多实际问题的设计。","start":433.73,"end":460.47},{"id":20,"text":"What else was I going to say? Maybe that's it. Any questions about that? Yeah. Why in reality, we can get a solution that is not as good as a reasonable one? Oh, yeah. Okay. If it's solving exactly the same problem, then of course that can't happen.","zh":"我原本还想说什么？也许这就是全部了。关于这一点有什么问题吗？是的。为什么在现实中，我们能得到一个不如合理解好的解？哦，对了。好的。如果是在解决完全相同的问题，当然这种情况不会发生。","start":462.49,"end":486.32},{"id":21,"text":"So that, yeah, I shouldn't have said that. It could be that you get no improvement. That would be one, right? And that certainly is a thing, right? You say, oh my God, this is so, I got a great idea and I have the storage device and it just doesn't help you at all, right? So yeah, I misspoke when I said that. Oh, and I forgot to, I did want to announce on the midterm, how did chat GPT do? Like seven.","zh":"所以，是的，我刚才说的不对。有可能你得不到任何改进。那就是一种情况，对吧？而且这确实可能发生，对吧？你说，天啊，这太糟糕了，我有一个绝妙的想法，我有存储设备，但它对你完全没帮助，对吧？所以是的，我刚才说错了。哦，而且我忘记宣布了，在期中考试中，Chat GPT的表现如何？像七分那样。","start":486.98,"end":515.38},{"id":22,"text":"No, come on. Actually, I can open it up right now. Okay. Well, I think the executive summary is terribly. I'm happy to announce. So, anyway. Anyway, well, anyway, I just wanted to mention that.","zh":"不，别这么说了。实际上，我现在就可以打开它。好的，我觉得执行摘要非常糟糕。我很高兴地宣布。总之，总之，总之，我只是想提一下。","start":516.59,"end":533.02}],"notes":["本段主要讲解了课程设计的思路，强调实际应用而非单纯理论教学。讲者指出，课程不会像高中那样直接教学生如何求对偶问题，而是通过实际问题让学生理解对偶性。这种设计是为了让学生在实际工作中能够运用所学知识，而不是机械地应用公式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":356.11,"end":533.02,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":356.11,"text":"but the design side what we do on our side here's what we do"},{"start":360.47,"text":"So we don't do silly things like teach you duality and then say, find the dual of this. Because that's basically high school like, here's integration by parts. What's the integral of t squared sine t? Come on, this is ridiculous. I mean, not only could, anyway, that's just, we don't do that here. So the way we do it is we actually, you'll end up doing problems related to the material we cover."},{"start":388.07,"text":"sometimes impractical problems, and we won't use the words that appear. We won't give you a hint. Sometimes we have to, but sometimes we don't. So here would be an example. We have many stealth problems that actually will rely on duality, and we don't use the D word."},{"start":405.91,"text":"Okay, because the truth is that's the way it's really going to go down. If you're at an internship, if you are at a startup or something like that, no one's going to come up to you and say, oh, help me, help me. I think we can use like a theorem of the alternatives just to solve this problem. That's not going to happen. What's going to happen is they're going to come to you and say, oh my God, this is so complicated. It's unbelievable. We have this estimator and that thing and these estimates and that we need to combine. And it'll go on and this is, you know, and it'll be some long, complicated thing."},{"start":433.73,"text":"Your job will be to go somewhere quiet, think for a while, and go like, whoa, we can solve that, right? And it'll be through duality. So just to let you know, what we call that, that's using the ideas in the wild. And that's what we're interested in. We might give you a warm-up or two that's in a little sandbox or something. But after that, it's going to be in the wild. So watch out. Anyway, I just want to say that's the design of a lot of the practical problems."},{"start":462.49,"text":"What else was I going to say? Maybe that's it. Any questions about that? Yeah. Why in reality, we can get a solution that is not as good as a reasonable one? Oh, yeah. Okay. If it's solving exactly the same problem, then of course that can't happen."},{"start":486.98,"text":"So that, yeah, I shouldn't have said that. It could be that you get no improvement. That would be one, right? And that certainly is a thing, right? You say, oh my God, this is so, I got a great idea and I have the storage device and it just doesn't help you at all, right? So yeah, I misspoke when I said that. Oh, and I forgot to, I did want to announce on the midterm, how did chat GPT do? Like seven."},{"start":516.59,"text":"No, come on. Actually, I can open it up right now. Okay. Well, I think the executive summary is terribly. I'm happy to announce. So, anyway. Anyway, well, anyway, I just wanted to mention that."}],"speech_gaps":[],"frame":"../frames/v009/003.webp","frame_time":368.11},{"title":"对偶性与问题重述","segments":[{"id":23,"text":"Okay. 12 out of 43. 12 out of 43. 12 out of 43? Yeah. That's not very good, okay? So that's fine. But I'm sure it was beautifully written, right? It was articulate and sounded like it was right, right?","zh":"好的。43分中得了12分。43分中得了12分。43分中得了12分？是的。这不是很理想，对吧？所以这没关系。但我确定它写得非常漂亮，对吧？它表达清晰，听起来是对的，对吧？","start":533.59,"end":551.52},{"id":24,"text":"Okay, so we'll get back. Today we're going to finish off what is essentially the theory, actually in about 20 minutes, we're going to finish off what is essentially the first section of the course, which is basically all the theory. I mean, as you can see, we've already segued into real stuff as well. Then we'll start the second part of the course, which is just all applications, right? So that's kind of the idea. And then the whole idea, by the way, as I've said many, many times, we don't expect you to have a total mastery of all the theory we've covered, which is actually a lot.","zh":"好的，我们稍后再谈。今天我们将完成课程中基本上所有的理论内容，大约在20分钟内，我们将完成课程第一部分的基本理论内容。我的意思是，正如你们所见，我们已经进入了实际内容。然后我们将开始课程的第二部分，也就是所有应用内容，对吧？这就是大致的想法。顺便说一句，正如我多次说过，我们不期望你们完全掌握我们所讲的所有理论内容，实际上这些内容非常多。","start":559.71,"end":587.15},{"id":25,"text":"What will happen is as you do other practical problems in the next three, four weeks, hopefully there, that will be your excuse to go back and review something in the theory or learn it better. And in fact, I know a lot of people say that after the, very weirdly, they say somewhere around the seventh week of the class, it turns out at that point, they really, they go back and they look at the third week and they're like, yeah, this is all obvious. Like, how could I not have known all this or something like that? So anyway, okay.","zh":"接下来会发生的是，在接下来的三到四周中，当你解决其他实际问题时，希望这会成为你回顾理论内容或更好地理解它的借口。事实上，我知道很多人说，在课程的第七周左右，他们发现，到那时，他们回去看第三周的内容，然后觉得，哦，这都很明显。比如，我怎么会不知道这些呢，或者类似这样的话。总之，好的。","start":588.48,"end":616.92},{"id":26,"text":"So, okay, one of our last topics is this question of duality and problem reformulations. And we looked at this last time, right? I think I drew a diagram and I said, here you have a problem and then I convert it to a new problem. So these are like equivalent. And of course, you can sort of take, you can take a dual, right? And this would be a Lagrange dual of this one. Oh, and I should be careful what I'm saying there.","zh":"所以，好的，我们最后一个主题是关于对偶性和问题重述的问题。我们上次已经讨论过这个问题了，对吧？我想我画了一个图，并说，你有一个问题，然后我将其转换为一个新问题。这些问题是等价的。当然，你可以进行对偶转换，对吧？这将是这个原问题的拉格朗日对偶问题。哦，我在这里要小心我的说法。","start":618.83,"end":645.05},{"id":27,"text":"People say the Lagrange duel, but the truth is when people talk about duels, you have license to make a few small transformations of your problem. And actually, sometimes you can do different ones, and then you get different duals, and they have people's names. Like you could talk about the Clark duel of a QP, or the Frank duel, and they're slightly different. And that has to do with people doing small...","zh":"人们说拉格朗日对偶，但事实上，当人们谈论对偶时，你有权对问题进行一些小的变换。实际上，有时你可以进行不同的变换，从而得到不同的对偶问题，这些对偶问题以人们的名字命名。比如，你可以谈论二次规划的克拉克对偶或弗兰克对偶，它们略有不同。这与人们进行一些小的变换有关。","start":647.01,"end":672.87},{"id":28,"text":"making small changes, making an equivalence transformation, then taking a dual or afterwards. And then this one would have a dual right here, like that. I'll just write it this way. Like that, tilde. And so the question is, how are these related?","zh":"通过进行小的改动，进行等价变换，然后取对偶或之后。然后这个就会在这里有一个对偶，就像这样。我这样写下来。就像这样，用波浪号表示。那么问题是，这些之间有什么关系？","start":673.34,"end":694.65}],"notes":["本段主要讲解了对偶性与问题重述的概念，这是课程中最后一个主题之一。讲者提到，对偶性涉及将原问题转换为新问题，并且这些问题是等价的。讲者还指出，对偶问题可以是拉格朗日对偶，但需要注意术语的准确性。","讲者提到，对偶问题有时会根据不同的变换方式而有所不同，例如克拉克对偶或弗兰克对偶，这些名称来源于不同的变换方法。这表明对偶性不仅仅是单一的转换过程，而是可以有多种实现方式。","讲者强调，对偶性涉及对原问题进行小的变换，然后进行对偶转换。这种变换可能包括等价变换，从而得到不同的对偶问题。这说明对偶性不仅是一个数学概念，还涉及实际操作中的变换技巧。","讲者最后提到，如何将原问题与对偶问题联系起来，这表明课程中将深入探讨对偶问题与原问题之间的关系，以及如何利用对偶性来解决优化问题。","讲者还提到，学生在后续的实践中会回顾理论知识，这表明对偶性不仅是理论上的概念，也是实际应用中的重要工具。","讲者指出，学生不需要完全掌握所有理论，而是通过实践来加深理解，这表明课程设计注重理论与实践的结合。"],"formulas":[],"uncertainties":["duality","problem reformulations","Lagrange duel","Clark duel","Frank duel"],"diagram":"none","start":533.59,"end":694.65,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":533.59,"text":"Okay. 12 out of 43. 12 out of 43. 12 out of 43? Yeah. That's not very good, okay? So that's fine. But I'm sure it was beautifully written, right? It was articulate and sounded like it was right, right?"},{"start":559.71,"text":"Okay, so we'll get back. Today we're going to finish off what is essentially the theory, actually in about 20 minutes, we're going to finish off what is essentially the first section of the course, which is basically all the theory. I mean, as you can see, we've already segued into real stuff as well. Then we'll start the second part of the course, which is just all applications, right? So that's kind of the idea. And then the whole idea, by the way, as I've said many, many times, we don't expect you to have a total mastery of all the theory we've covered, which is actually a lot."},{"start":588.48,"text":"What will happen is as you do other practical problems in the next three, four weeks, hopefully there, that will be your excuse to go back and review something in the theory or learn it better. And in fact, I know a lot of people say that after the, very weirdly, they say somewhere around the seventh week of the class, it turns out at that point, they really, they go back and they look at the third week and they're like, yeah, this is all obvious. Like, how could I not have known all this or something like that? So anyway, okay."},{"start":618.83,"text":"So, okay, one of our last topics is this question of duality and problem reformulations. And we looked at this last time, right? I think I drew a diagram and I said, here you have a problem and then I convert it to a new problem. So these are like equivalent. And of course, you can sort of take, you can take a dual, right? And this would be a Lagrange dual of this one. Oh, and I should be careful what I'm saying there."},{"start":647.01,"text":"People say the Lagrange duel, but the truth is when people talk about duels, you have license to make a few small transformations of your problem. And actually, sometimes you can do different ones, and then you get different duels, and they have people's names. Like you could talk about the Clark duel of a QP, or the Frank duel, and they're slightly different. And that has to do with people doing small..."},{"start":673.34,"text":"making small changes, making an equivalence transformation, then taking a dual or afterwards. And then this one would have a dual right here, like that. I'll just write it this way. Like that, tilde. And so the question is, how are these related?"}],"speech_gaps":[],"frame":"../frames/v009/004.webp","frame_time":545.59},{"title":"对偶性与变换后的对偶问题","segments":[{"id":29,"text":"You know, I said that if you're trained in math, you will have an overwhelming urge to draw an arrow here and say that these are related in some way or something like that. I mean, they're obviously related because these two, they are, each one is the dual of two problems that are equivalent, right? So assuming strong duality holds, which we will simply assume from now on without, I won't say anything else, right?","zh":"你知道吗，我说过如果你受过数学训练，你就会有一种强烈的冲动想要在这里画一个箭头，并说这些是某种方式相关联的，对吧？我的意思是，它们显然是相关的，因为这两个问题，每一个都是两个等价问题的对偶问题，对吧？所以假设强对偶性成立，从现在开始我们将直接假设这一点，我不会再做其他说明，对吧？","start":696.51,"end":719.9},{"id":30,"text":"Because this isn't a math class. I would say, then you'd say, look, they have the same optimal value and all that sort of stuff, right? So, okay. It turns out this is just not the case. And we'll see incredibly simple examples where transformations give you radically different duals. Okay, so that's, which is actually kind of interesting. All right, so let's start with the following problem. So here's one. Let's minimize a function.","zh":"因为这不是一堂数学课。我会说，然后你会说，看，它们有相同的最优值，诸如此类的东西，对吧？所以，好吧。结果发现这并不是情况。我们会看到一些极其简单的例子，其中变换会给出截然不同的对偶问题。好吧，这其实相当有趣。好的，那么让我们从以下问题开始。这里有一个问题。让我们最小化一个函数。","start":720.45,"end":748.94},{"id":31,"text":"of an affine function, right? And F0 is convex, right? So then, oh yeah, by the way, we didn't get to talk about that. We didn't get to, let's cover the theory of Lagrange duality for problems with no constraints, right? So, okay, so what's the Lagrangian? Well, there are no constraints, so there's nothing to add to the objective. So the Lagrangian is nothing but the objective, okay? Then it says, okay, that's fine. And now let's find the dual function.","zh":"这是一个仿射函数，对吧？并且F0是凸的，对吧？那么，哦对了，顺便提一下，我们还没讨论过这一点。我们还没谈到，让我们来覆盖没有约束问题的拉格朗日对偶性理论，对吧？所以，好吧，那么拉格朗日函数是什么？因为没有约束，所以没有东西可以加到目标函数上。因此，拉格朗日函数就是目标函数本身，对吧？然后它说，好吧，这样就可以了。现在让我们找到对偶函数。","start":749.68,"end":777.38},{"id":32,"text":"Well, the dual function of the no, there are no dual variables because there's no constraints, but it's a dual function. And it says you should minimize the subjective. Anyway, when you do that, you get P star. Okay. And then this is, okay. By the way, that is, it's correct, right? Number one, let's observe. It's a lower bound on P star.","zh":"嗯，没有约束，所以没有对偶变量，但这是一个对偶函数。它说你应该最小化目标函数。不管怎样，当你这么做时，你会得到P星。好吧。然后这就是，好吧。顺便说一句，这是正确的，对吧？第一点，让我们观察一下。这是一个P星的下界。","start":778.27,"end":797.93},{"id":33,"text":"And you have to admit that, right? It's also completely and utterly useless, right? Because someone says to me, says, help me solve this problem. Actually, what I really need is a lower bound on the optimal value. And you go, I got a great lower bound for you. And you go, what? The optimal value, right? And it's like, you know, it's like, there's several jokes where the punchline is like that. Those people had to have been mathematicians. And some people say, why? And they say, oh, because the answer was precisely correct and totally useless.","zh":"你必须承认这一点，对吧？它也是完全无用的，对吧？因为有人对我说，帮我解决这个问题。实际上，我真正需要的是最优值的下界。然后你会说，我有一个很好的下界给你。然后你会说，什么？最优值，对吧？这就像有几个笑话，它们的笑点就是这样的。这些人一定是数学家。有些人会问，为什么？他们会说，哦，因为答案完全正确，但完全无用。","start":798.38,"end":826.08},{"id":34,"text":"Right, so has anyone heard these? I'm not going to reproduce, you've heard them. I'm not going to reproduce because they're all terrible. Anyway, but that's the idea. So that's what this is, right? Okay, so now let's make an innocent, we're going to make an innocent transformation from p to p tilde. And the way we're going to do that is we're going to introduce new variables. So we're going to give this a name, that's going to be called y, and we're going to write this problem.","zh":"对，那么有没有人听说过这些？我不会重复，你们都听过。我不会重复是因为它们都很糟糕。不管怎样，这就是这个想法。所以这就是这个，对吧？好的，现在让我们做一个无辜的变换，从p变换到p tilde。我们将这样做，就是引入新的变量。我们将给这个起个名字，叫做y，然后我们将写出这个问题。","start":826.78,"end":852.42},{"id":35,"text":"Which is, this is obviously equivalent to that, right? So that's, that's our P and our P tilde. This is P tilde. And now when I work out the dual of this, I get something that looks like that. And it's highly, it's, it's not useless. It's interesting, you know, it's actually an interesting dual, right?","zh":"这显然等价于那个，对吧？所以这就是我们的P和我们的P tilde。这是P tilde。现在当我求解这个的对偶问题时，我得到一个看起来像那样的结果。它非常有用，它不是无用的。它很有趣，你知道，它实际上是一个有趣的对偶问题，对吧？","start":853.1,"end":869.26}],"notes":["本段讲授了拉格朗日对偶性的基本概念，特别是当问题没有约束时的情况。在没有约束的情况下，拉格朗日函数就是目标函数本身，而对偶函数则为最小化目标函数，得到的对偶问题是一个下界，但这个下界是完全无用的，因为它等于原问题的最优值。","讲者通过幽默的方式强调了对偶问题的无用性，指出即使得到了精确的下界，如果这个下界等于原问题的最优值，那么它对求解问题没有帮助。这种幽默方式帮助听众理解对偶问题的实际意义。","接下来，讲者引入了一个简单的变换，将原问题转换为一个新的问题，通过引入新变量，使得对偶问题变得有用。这说明了变换对对偶问题的影响，以及如何通过变换得到更有用的对偶问题。","讲者强调了对偶问题的构造过程，指出在没有约束的情况下，对偶函数的构造是直接的，但其结果却可能没有实际意义。这为后续讨论更复杂的对偶问题奠定了基础。","通过引入新变量，讲者展示了如何通过变换得到一个更有用的对偶问题，这说明了对偶问题的构造和变换对问题求解的重要性。","讲者通过对比原问题和变换后的问题，强调了对偶问题的构造和变换对问题求解的影响，这为后续讨论更复杂的对偶问题和变换方法提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":696.51,"end":869.26,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":696.51,"text":"You know, I said that if you're trained in math, you will have an overwhelming urge to draw an arrow here and say that these are related in some way or something like that. I mean, they're obviously related because these two, they are, each one is the dual of two problems that are equivalent, right? So assuming strong duality holds, which we will simply assume from now on without, I won't say anything else, right?"},{"start":720.45,"text":"Because this isn't a math class. I would say, then you'd say, look, they have the same optimal value and all that sort of stuff, right? So, okay. It turns out this is just not the case. And we'll see incredibly simple examples where transformations give you radically different duals. Okay, so that's, which is actually kind of interesting. All right, so let's start with the following problem. So here's one. Let's minimize a function."},{"start":749.68,"text":"of an affine function, right? And F0 is convex, right? So then, oh yeah, by the way, we didn't get to talk about that. We didn't get to, let's cover the theory of Lagrange duality for problems with no constraints, right? So, okay, so what's the Lagrangian? Well, there are no constraints, so there's nothing to add to the objective. So the Lagrangian is nothing but the objective, okay? Then it says, okay, that's fine. And now let's find the dual function."},{"start":778.27,"text":"Well, the dual function of the no, there are no dual variables because there's no constraints, but it's a dual function. And it says you should minimize the subjective. Anyway, when you do that, you get P star. Okay. And then this is, okay. By the way, that is, it's correct, right? Number one, let's observe. It's a lower bound on P star."},{"start":798.38,"text":"And you have to admit that, right? It's also completely and utterly useless, right? Because someone says to me, says, help me solve this problem. Actually, what I really need is a lower bound on the optimal value. And you go, I got a great lower bound for you. And you go, what? The optimal value, right? And it's like, you know, it's like, there's several jokes where the punchline is like that. Those people had to have been mathematicians. And some people say, why? And they say, oh, because the answer was precisely correct and totally useless."},{"start":826.78,"text":"Right, so has anyone heard these? I'm not going to reproduce, you've heard them. I'm not going to reproduce because they're all terrible. Anyway, but that's the idea. So that's what this is, right? Okay, so now let's make an innocent, we're going to make an innocent transformation from p to p tilde. And the way we're going to do that is we're going to introduce new variables. So we're going to give this a name, that's going to be called y, and we're going to write this problem."},{"start":853.1,"text":"Which is, this is obviously equivalent to that, right? So that's, that's our P and our P tilde. This is P tilde. And now when I work out the dual of this, I get something that looks like that. And it's highly, it's, it's not useless. It's interesting, you know, it's actually an interesting dual, right?"}],"speech_gaps":[],"frame":"../frames/v009/005.webp","frame_time":708.51},{"title":"对偶问题的构造与示例","segments":[{"id":36,"text":"And I won't, you know, this is a quick calculation to show that the dual of this is if I minimize f0 plus nu transpose times this thing, I can express that in terms of the conjugate of the function, right? So, okay. So this is kind of a dramatic example saying that even the most simple, innocent-looking","zh":"而且我不会，你知道的，这是一个快速计算，用来展示这个的对偶问题是，如果我最小化 f0 加上 nu 转置乘以这个东西，我可以将其用函数的共轭来表达，对吧？所以，好的。所以这是一个戏剧性的例子，说明即使是最简单、看起来无害的问题，","start":870.16,"end":891.96},{"id":37,"text":"transform trans if you apply an innocent transformation ahead of time you get a radically different dual including in the first case you get one that's just utterly and completely useless in the second case you actually get something that's interesting that actually tells you something right so okay um we can look at another one just for fun um is we'll look at the norm approximation problem which we're going to look at later today so that's that's choosing x to minimize norm ax minus b and again you know it's kind of silly to talk about the","zh":"如果你事先应用一个无害的变换，你就会得到一个截然不同的对偶问题，在第一种情况下，你会得到一个完全无用的对偶问题，在第二种情况下，你实际上会得到一个有趣的东西，它实际上告诉你一些信息。所以，好的，我们再来看一个例子，只是为了好玩，我们将看一下范数逼近问题，我们今天稍后会讨论这个问题，这就是选择 x 来最小化范数 ax 减去 b，再次，谈论一个没有任何约束的问题的拉格朗日对偶问题有点愚蠢，对吧？","start":892.6,"end":922.83},{"id":38,"text":"Lagrange dual of a problem with no constraints right so in this case we introduce constraints and the constraints we introduce or we give a name for ax minus b and you get this kind of thing and you end up with a very interesting thing right the the this is the norm by the way i could take the norm squared and i would get a different dual right so i'd get a completely different dual if i if i took the square i'm not going to do it but you might check into that","zh":"所以在这种情况下，我们引入约束，并给这些约束命名，即 ax 减去 b，然后你会得到这种东西，最终你会得到一个非常有趣的东西，对吧？顺便说一句，这就是范数，我也可以取范数平方，我会得到一个不同的对偶问题，对吧？如果我取平方，我会得到一个完全不同的对偶问题，我不会这么做，但你可能会去检查一下。","start":923.51,"end":950.07},{"id":39,"text":"And the dual, when you work this out, is this is the norm plus, then there's a constant over here, that's irrelevant, and then this whole thing here is a linear function of x and y, and if I look at y over here, and I minimize this over y, what I get is the indicator function of the dual norm, right? So you end up with something that looks like this, right?","zh":"而对偶问题，当你计算出来时，是这个范数加上，然后这里有一个常数，无关紧要，而这里的整个部分是一个关于 x 和 y 的线性函数，如果我在这里看 y，并且在 y 上最小化这个，我会得到对偶范数的指示函数，对吧？所以你会得到一个看起来像这样的东西，对吧？","start":951.85,"end":975.33},{"id":40,"text":"And so the dual, or I should say like, you know, a dual of, in fact, some people would even say a dual of that problem is this.","zh":"因此，对偶问题，或者说，你知道的，事实上，有些人甚至会说这个问题的对偶问题是这个。","start":976.43,"end":983.45},{"id":41,"text":"And then someone would say, no, the dual of that problem is just silly.","zh":"然后有人会说，不，这个问题的对偶问题只是愚蠢的。","start":984.06,"end":987.22},{"id":42,"text":"It's maximize P star over no dual variables, right?","zh":"它是最大化 P 星，没有对偶变量，对吧？","start":987.36,"end":990.64},{"id":43,"text":"Which is kind of goofy, right?","zh":"这有点傻，对吧？","start":990.7,"end":991.98},{"id":44,"text":"So, but in fact, people would allow you this license and you get something.","zh":"所以，实际上，人们会允许你这种许可，你就会得到一些东西。","start":992.1,"end":997.0},{"id":45,"text":"And by the way, by now you should be starting to see patterns, which should be, you know,","zh":"顺便说一句，到目前为止，你应该开始看到一些模式，这些模式应该是，你知道的，","start":997.12,"end":1002.74},{"id":46,"text":"when you see a function appear in what's called the primal problem,","zh":"当你在所谓的对偶问题中看到一个函数出现时，","start":1002.74,"end":1007.12},{"id":47,"text":"then in the dual, you should kind of expect to see conjugates, okay?","zh":"那么在对偶问题中，你应该大致预期看到共轭函数，好吗？","start":1007.28,"end":1010.9},{"id":48,"text":"So if your original function, for example, had like Kullback-Leibler divergence or relative entropy,","zh":"例如，如果你的原始函数包含Kullback-Leibler散度或相对熵，","start":1010.9,"end":1016.48},{"id":49,"text":"then you should, even before you start doing any calculation,","zh":"那么在你开始做任何计算之前，","start":1017.5,"end":1021.06},{"id":50,"text":"you should expect to see exponentials and log some exp in the dual.","zh":"你应该预期在对偶问题中看到指数函数和对数函数，或者一些指数项。","start":1021.28,"end":1026.36},{"id":51,"text":"And if it doesn't show up that way, then that's kind of a, you should maybe double check what you did.","zh":"如果它没有以这种方式出现，那么这可能是一个问题，你应该可能检查一下自己做了什么。","start":1026.82,"end":1031.28},{"id":52,"text":"Everybody see what I'm saying?","zh":"大家明白我在说什么吗？","start":1031.52,"end":1032.2},{"id":53,"text":"So here, the other thing is there's some other obvious things you should know.","zh":"所以这里，另一件事是有一些其他显而易见的事情你应该知道。","start":1034.36,"end":1037.86},{"id":54,"text":"know, I mean, you should, you should expect to see the adjoint or the transpose. If you see an A","zh":"知道，我的意思是，你应该，你应该预期看到伴随矩阵或转置矩阵。如果你看到一个 A","start":1037.86,"end":1042.72},{"id":55,"text":"here, you should not at all be surprised to see an A transpose appear in the dual. Okay. So I won't,","zh":"在这里，你完全不应该对在对偶问题中出现 A 的转置感到惊讶。好的，所以我不会，","start":1042.72,"end":1047.9}],"notes":["本段主要讲解了对偶问题的构造过程，通过一个简单的例子说明了如何将原问题转换为对偶问题，并指出对偶问题可能具有不同的性质，如无用或有用。同时，强调了对偶问题中可能涉及共轭函数的概念。","讲者提到，当原问题中出现某种函数（如Kullback-Leibler散度）时，对偶问题中可能会出现指数函数或对数函数。这表明了原问题和对偶问题之间的函数关系，以及共轭函数在对偶问题中的作用。","讲者还指出，如果原问题中出现矩阵A，那么在对偶问题中可能会出现矩阵A的转置。这说明了对偶问题中矩阵的转置与原问题中的矩阵之间的关系。","讲者通过一个例子说明了如何通过最小化原问题的对偶形式来得到对偶问题，并指出对偶问题可能包含一些与原问题不同的结构，如指示函数。","讲者强调了在对偶问题中，共轭函数的重要性，并指出如果对偶问题中没有出现预期的共轭函数，可能需要重新检查计算过程。","讲者还提到，通过观察原问题中的函数，可以预测对偶问题中可能出现的函数形式，这有助于理解对偶问题的结构和性质。"],"formulas":[],"uncertainties":["transform trans","the the this is the norm","some exp in the dual"],"diagram":"none","start":870.16,"end":1047.9,"asr_flags":[],"math_clarifications":["原始片段中未提供完整的数学公式，因此无法核定其正确性。所有公式均未明确表示数学表达式，无法进行有效的数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":870.16,"text":"And I won't, you know, this is a quick calculation to show that the dual of this is if I minimize f0 plus nu transpose times this thing, I can express that in terms of the conjugate of the function, right? So, okay. So this is kind of a dramatic example saying that even the most simple, innocent-looking"},{"start":892.6,"text":"transform trans if you apply an innocent transformation ahead of time you get a radically different dual including in the first case you get one that's just utterly and completely useless in the second case you actually get something that's interesting that actually tells you something right so okay um we can look at another one just for fun um is we'll look at the norm approximation problem which we're going to look at later today so that's that's choosing x to minimize norm ax minus b and again you know it's kind of silly to talk about the"},{"start":923.51,"text":"Lagrange dual of a problem with no constraints right so in this case we introduce constraints and the constraints we introduce or we give a name for ax minus b and you get this kind of thing and you end up with a very interesting thing right the the this is the norm by the way i could take the norm squared and i would get a different dual right so i'd get a completely different dual if i if i took the square i'm not going to do it but you might check into that"},{"start":951.85,"text":"And the dual, when you work this out, is this is the norm plus, then there's a constant over here, that's irrelevant, and then this whole thing here is a linear function of x and y, and if I look at y over here, and I minimize this over y, what I get is the indicator function of the dual norm, right? So you end up with something that looks like this, right?"},{"start":976.43,"text":"And so the dual, or I should say like, you know, a dual of, in fact, some people would even say a dual of that problem is this."},{"start":984.06,"text":"And then someone would say, no, the dual of that problem is just silly."},{"start":987.36,"text":"It's maximize P star over no dual variables, right?"},{"start":990.7,"text":"Which is kind of goofy, right?"},{"start":992.1,"text":"So, but in fact, people would allow you this license and you get something."},{"start":997.12,"text":"And by the way, by now you should be starting to see patterns, which should be, you know,"},{"start":1002.74,"text":"when you see a function appear in what's called the primal problem,"},{"start":1007.28,"text":"then in the dual, you should kind of expect to see conjugates, okay?"},{"start":1010.9,"text":"So if your original function, for example, had like Kullback-Leibler divergence or relative entropy,"},{"start":1017.5,"text":"then you should, even before you start doing any calculation,"},{"start":1021.28,"text":"you should expect to see exponentials and log some exp in the dual."},{"start":1026.82,"text":"And if it doesn't show up that way, then that's kind of a, you should maybe double check what you did."},{"start":1031.52,"text":"Everybody see what I'm saying?"},{"start":1034.36,"text":"So here, the other thing is there's some other obvious things you should know."},{"start":1037.86,"text":"know, I mean, you should, you should expect to see the adjoint or the transpose. If you see an A"},{"start":1042.72,"text":"here, you should not at all be surprised to see an A transpose appear in the dual. Okay. So I won't,"}],"speech_gaps":[],"frame":"../frames/v009/006.webp","frame_time":882.16},{"title":"对偶问题与部分对偶化","segments":[{"id":56,"text":"I mean, some people make, you know, tables of this about, you know, what you expect to see in one or","zh":"我的意思是，有些人会制作这样的表格，你知道的，关于你期望在其中一个或另一个中看到的内容，以及所有那种东西。我认为直接把它看作你应该期望的模式更好，你应该，你应该，所以你应该预先加载。你应该期望一些所有人都会遇到的东西，如果你的问题涉及L无穷范数，那么对偶问题应该涉及L无穷范数的共轭，或者不共轭，你应该得到一个L1范数，","start":1047.9,"end":1052.4},{"id":57,"text":"the other and all that kind of stuff. I think it's better just to think of it as patterns that you","zh":"正好正确，所以这只是这类事情，这些都是你会看到的模式，好吧，这就是人们所说的某种称为","start":1052.4,"end":1058.14},{"id":58,"text":"should expect and you should, you should, so you should just be preloading. There should be things","zh":"你应该期望的东西，你应该，你应该，所以你应该预先加载。你应该期望一些所有人都会遇到的东西，如果你的问题涉及L","start":1058.14,"end":1063.6},{"id":59,"text":"you should expect all of us if you you know if your problem is involves L","zh":"无穷范数，那么对偶问题应该涉及L无穷范数的共轭，或者不共轭，你应该得到一个L你应该期望一个L1范数","start":1063.6,"end":1067.38},{"id":60,"text":"infinity norms the dual should probably involve conjugate of an L infinity norm","zh":"正好正确，所以这只是这类事情，这些都是你会看到的模式，好吧，这就是人们所说的某种称为","start":1067.38,"end":1076.58},{"id":61,"text":"or not conjugate what you you should get an L you should expect an L1 norm","zh":"你应该期望的东西，你应该，你应该，所以你应该预先加载。你应该期望一些所有人都会遇到的东西，如果你的问题涉及L","start":1076.58,"end":1080.58},{"id":62,"text":"exactly right so it's just it's stuff like that these are things that you'll","zh":"无穷范数，那么对偶问题应该涉及L无穷范数的共轭，或者不共轭，你应该得到一个L你应该期望一个L1范数","start":1080.58,"end":1085.54},{"id":63,"text":"just you will see patterns okay this is what people refer to as something called","zh":"正好正确，所以这只是这类事情，这些都是你会看到的模式，好吧，这就是人们所说的某种称为","start":1085.54,"end":1094.24},{"id":64,"text":"partial dualization or partial Lagrangian. What you do is, you know, here's an original problem. And if you work out, you know, this is an LP. And when you work out the LP, you get something that looks like that.","zh":"部分对偶化或部分拉格朗日对偶。你所做的就是，这里有一个原始问题。当你计算时，你知道，这是一个线性规划问题。当你计算这个线性规划问题时，你会得到一个看起来像那样的结果。","start":1097.21,"end":1110.71},{"id":65,"text":"Okay, the dual of that LP, right? So another way to do it is to say, you know what? I am not going to dualize over this. People call that a box constraint, right? It's the constraint that all your variables are between plus and minus one. You see, I'm not going to dualize over it. Instead, I'm going to take this thing.","zh":"好的，这个线性规划问题的对偶问题，对吧？所以另一种做法是，你知道吗？我不想对这个进行对偶化。人们称之为一个盒子约束，对吧？这是所有变量都在正负一之间的约束。你看，我不想对这个进行对偶化。相反，我会把这个东西。","start":1111.38,"end":1127.06},{"id":66,"text":"and I'm going to make an indicator function of it and plug it into the objective, right? So obviously it's equivalent, right? So this problem is clearly equivalent to this one, right? The difference is here you would say that the box constraints are explicit. Here, the box constraints are implicit because they're embedded in the objective, and it just makes the objective return plus infinity if you're not feasible, right? Make sense? So, all right, well, we can actually work out...","zh":"制作成一个指示函数，并将其插入目标函数中，对吧？显然，这是等价的，对吧？所以这个问题显然等价于这个问题，对吧？区别在于这里你会说盒子约束是显式的。在这里，盒子约束是隐式的，因为它们嵌入在目标函数中，并且只要你不满足可行性，目标函数就会返回正无穷大，对吧？明白吗？所以，好吧，我们实际上可以计算……","start":1127.49,"end":1156.51},{"id":67,"text":"Lagrange dual of this so here here remember what happens is you form you form a Lagrangian the Lagrangian is actually an affine function of X then you minimize but when you minimize an affine function you just either get minus infinity or you get or you get the constant part but only when the linear part is zero right um here it's different because here I have to minimize here an affine function of X","zh":"这个的拉格朗日对偶问题。这里记住会发生什么，你会形成一个拉格朗日函数，这个拉格朗日函数实际上是关于X的仿射函数。然后你最小化，但当你最小化一个仿射函数时，你只会得到负无穷大，或者你会得到常数部分，但只有当线性部分为零时，对吧？在这里，情况不同，因为这里我需要最小化一个关于X的仿射函数。","start":1156.75,"end":1184.89},{"id":68,"text":"subject to all the entries between minus 1 and 1. That we can do analytically, right? Because the constant part, that's nu transpose minus b, that pops out. And then here, you end up with a linear thing, a linear function of x. It is, in fact, a transpose nu plus c quantity transpose x. And we want to minimize that.","zh":"所有元素都在-1和1之间。这可以解析地完成，对吧？因为常数部分，那是ν的转置减去b，会弹出。然后这里，你会得到一个线性项，一个关于x的线性函数。实际上，它是ν的转置加上c的转置乘以x。我们想要最小化这个。","start":1185.38,"end":1205.64},{"id":69,"text":"over all x's between minus one and one. And this is, you know, like Koshy Schwartz, I guess it's called the Holder Inequality. And the Holder, that says the best choice is to take","zh":"所有x在-1和1之间。这就像柯西-施瓦茨不等式，我想这被称为赫尔德不等式。赫尔德不等式说明最佳选择是取","start":1206.25,"end":1215.29}],"notes":["本段讲授了凸优化中对偶问题的构建方法，特别是部分对偶化（partial dualization）或部分拉格朗日（partial Lagrangian）的概念。讲者指出，当处理带有盒约束（box constraints）的问题时，可以将这些约束隐式地嵌入目标函数中，通过引入指示函数（indicator function）来实现。这种方法使得约束条件不再显式地出现在问题中，而是通过目标函数的值（如无穷大）来体现约束的可行性。","讲者进一步说明了如何构建拉格朗日对偶问题。当目标函数是关于变量X的仿射函数时，最小化该函数的结果取决于线性部分是否为零。如果线性部分不为零，则最小值为负无穷；如果线性部分为零，则最小值为常数项。这种分析方法适用于具有盒约束的优化问题。","在处理盒约束时，讲者提到可以通过分析目标函数的结构来找到最优解。例如，当约束条件为所有变量在-1到1之间时，可以通过分析目标函数的线性部分和常数项来找到最小值。这种方法利用了Hölder不等式，该不等式在处理不同范数之间的关系时非常有用。","讲者还提到，当处理涉及L∞范数的问题时，其对偶问题通常会涉及L1范数。这是因为L∞范数的共轭函数是L1范数，而L1范数的共轭函数是L∞范数。这种对偶关系在凸优化中非常重要，可以帮助理解不同范数之间的转换关系。","在构建拉格朗日对偶问题时，讲者强调了显式约束和隐式约束的区别。显式约束直接出现在问题中，而隐式约束则通过目标函数的结构来体现。这种方法在处理复杂约束时非常有用，因为它可以简化问题的表达形式。","最后，讲者提到Hölder不等式在处理不同范数之间的关系时的应用。Hölder不等式是凸优化中的一个重要工具，它可以帮助理解不同范数之间的对偶关系，并在优化问题中找到最优解。"],"formulas":[],"uncertainties":["Koshy Schwartz"],"diagram":"none","start":1047.9,"end":1215.29,"asr_flags":[60],"math_clarifications":["原始文本中提到的拉格朗日函数未完整表达，缺少关键项，因此无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":1047.9,"text":"I mean, some people make, you know, tables of this about, you know, what you expect to see in one or"},{"start":1052.4,"text":"the other and all that kind of stuff. I think it's better just to think of it as patterns that you"},{"start":1058.14,"text":"should expect and you should, you should, so you should just be preloading. There should be things"},{"start":1063.6,"text":"you should expect all of us if you you know if your problem is involves L"},{"start":1067.38,"text":"infinity norms the dual should probably involve conjugate of an L infinity norm"},{"start":1076.58,"text":"or not conjugate what you you should get an L you should expect an L1 norm"},{"start":1080.58,"text":"exactly right so it's just it's stuff like that these are things that you'll"},{"start":1085.54,"text":"just you will see patterns okay this is what people refer to as something called"},{"start":1097.21,"text":"partial dualization or partial Lagrangian. What you do is, you know, here's an original problem. And if you work out, you know, this is an LP. And when you work out the LP, you get something that looks like that."},{"start":1111.38,"text":"Okay, the dual of that LP, right? So another way to do it is to say, you know what? I am not going to dualize over this. People call that a box constraint, right? It's the constraint that all your variables are between plus and minus one. You see, I'm not going to dualize over it. Instead, I'm going to take this thing."},{"start":1127.49,"text":"and I'm going to make an indicator function of it and plug it into the objective, right? So obviously it's equivalent, right? So this problem is clearly equivalent to this one, right? The difference is here you would say that the box constraints are explicit. Here, the box constraints are implicit because they're embedded in the objective, and it just makes the objective return plus infinity if you're not feasible, right? Make sense? So, all right, well, we can actually work out..."},{"start":1156.75,"text":"Lagrange dual of this so here here remember what happens is you form you form a Lagrangian the Lagrangian is actually an affine function of X then you minimize but when you minimize an affine function you just either get minus infinity or you get or you get the constant part but only when the linear part is zero right um here it's different because here I have to minimize here an affine function of X"},{"start":1185.38,"text":"subject to all the entries between minus 1 and 1. That we can do analytically, right? Because the constant part, that's nu transpose minus b, that pops out. And then here, you end up with a linear thing, a linear function of x. It is, in fact, a transpose nu plus c quantity transpose x. And we want to minimize that."},{"start":1206.25,"text":"over all x's between minus one and one. And this is, you know, like Koshy Schwartz, I guess it's called the Holder Inequality. And the Holder, that says the best choice is to take"}],"speech_gaps":[],"frame":"../frames/v009/007.webp","frame_time":1059.9},{"title":"凸优化中的对偶问题与广义不等式","segments":[{"id":70,"text":"You look at the entries of this vector. Whenever it is positive, you take x as minus 1, xi as minus 1. And whenever an entry is negative, you take xi equals plus 1. That will minimize. And the minimum value is going to be the sum of the absolute values with a negative sign. And so you get this. And, you know, it's kind of cool. And so you could even say this box. So other people would say this box constraint problem has this simple dual here.","zh":"你查看这个向量的各个分量。每当它为正时，你取x为-1，xi为-1。而每当一个分量为负时，你取xi等于+1。这样会最小化。最小值将是绝对值的和，并带有负号。因此你会得到这个结果。而且，你知道，这有点酷。因此你甚至可以说这个盒子。所以其他人会说这个盒子约束问题具有这个简单的对偶形式。","start":1215.69,"end":1242.76},{"id":71,"text":"And it kind of, everything's matching up, right? That, you know, you can think of this, you could have thought of this as the L infinity norm of x is less than 1. So then, using those weird, vague rules I said before, you see an L infinity norm, you should hardly be surprised if in the dual an L1 norm comes up. And sure enough, it did. Okay? So, does this make sense?","zh":"当你仔细观察并盯着它时，你会意识到你确切知道这是什么。这个东西的最优值就是这个。事实上，如果你将其表示为一个线性规划问题，它就是这个样子。因此，这是一个D和D tilde非常密切相关的例子，对吧？所以，这样理解得通吗？","start":1243.24,"end":1266.52},{"id":72,"text":"When you look at that closely and stare at it, you'll realize you know precisely what that is. The optimal value of this thing is exactly that. And in fact, if you were to express this as an LP, it would be that. So this is a case where D and D tilde happen to be extremely closely related, right? So, okay, make sense?","zh":"当你仔细观察并盯着它时，你会意识到你确切知道这是什么。这个东西的最优值就是这个。事实上，如果你将其表示为一个线性规划问题，它就是这个样子。因此，这是一个D和D tilde非常密切相关的例子，对吧？所以，这样理解得通吗？","start":1267.07,"end":1291.57},{"id":73,"text":"When you look at that closely and stare at it, you'll realize you know precisely what that is. The optimal value of this thing is exactly that. And in fact, if you were to express this as an LP, it would be that. So this is a case where D and D tilde happen to be extremely closely related, right? So, okay, make sense?","zh":"当你仔细观察并盯着它时，你会意识到你确切知道这是什么。这个东西的最优值就是这个。事实上，如果你将其表示为一个线性规划问题，它就是这个样子。因此，这是一个D和D tilde非常密切相关的例子，对吧？所以，这样理解得通吗？","start":1292.28,"end":1314.42},{"id":74,"text":"Last topic, and then I'm going to mention one more thing, is problems with generalized inequality. So remember what this means, that what we're going to do is we're going to have an inequality constraint where that's a vector. And the constraint is now that instead of being less than or equal to zero as a scalar, it's actually like a vector. So, I mean, it could be, for example, this could be a matrix, and this could mean that the matrix is negative semi-definite.","zh":"最后一个主题，然后我会提到另一件事，就是涉及广义不等式的问题。请记住这意味着什么，我们将要做的就是有一个不等式约束，其中这个约束是一个向量。并且这个约束现在不再是标量小于等于零，而是一个向量。也就是说，它可能是矩阵，这意味着该矩阵是负半定的。","start":1319.02,"end":1343.06},{"id":75,"text":"for example, right? I mean, more often it would be a matrix is positive semi-definite, but it was something like that. So here it turns out everything just kind of works, which means that all the notation was good. So here's what you do is you form a Lagrangian.","zh":"例如，对吧？我的意思是，更常见的是矩阵是正半定的，但大致是这样的。在这里，结果发现一切都很顺利，这意味着所有的符号都是合理的。所以你所做的就是形成一个拉格朗日函数。","start":1343.47,"end":1362.39},{"id":76,"text":"by, you know, the equality constraints don't change. But for the inequality constraints, we do the same thing. Remember, if this was scalar, you would just say lambda i times fi. Lambda i is bigger than or equal to zero. And remember, the constraint is fi is less than or equal to zero. But now they're vectors, right? So it turns out what you want is to form this inner product. And what it's going to turn out is that lambda i should be","zh":"通过，你知道的，等式约束不会改变。但对于不等式约束，我们做同样的事情。记住，如果这是标量，你只会说lambda i乘以fi。Lambda i大于等于零。并且记住，约束是fi小于等于零。但现在它们是向量，对吧？结果你想要的是形成这个内积。结果会发现lambda i应该","start":1363.13,"end":1387.98}],"notes":["本段讨论了对偶问题中的拉格朗日乘数法，指出在处理不等式约束时，需要形成内积，并且拉格朗日乘数应满足非负条件。这与标量情况下的处理方式类似，但需要考虑向量形式的约束。","在处理广义不等式约束时，约束条件从标量变为向量，例如矩阵的半正定性。这种情况下，所有符号和定义仍然保持一致，因此可以使用相同的拉格朗日乘数方法。","在对偶问题中，D 和 D tilde 之间的关系非常紧密，这表明原问题和对偶问题在结构上具有高度一致性，这在凸优化中是一个重要的性质。","在处理向量不等式约束时，需要将标量的乘法扩展为内积，这反映了向量空间中约束条件的扩展。","拉格朗日乘数法在处理不等式约束时，要求乘数非负，这是为了确保对偶问题的可行性。","在处理广义不等式约束时，所有符号和定义仍然保持一致，因此可以使用相同的拉格朗日乘数方法，这表明凸优化的理论在向量空间中仍然适用。"],"formulas":[],"uncertainties":["lambda i should be"],"diagram":"none","start":1215.69,"end":1387.98,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学信息以核定公式中的具体数学关系和符号定义，因此所有公式均被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1215.69,"text":"You look at the entries of this vector. Whenever it is positive, you take x as minus 1, xi as minus 1. And whenever an entry is negative, you take xi equals plus 1. That will minimize. And the minimum value is going to be the sum of the absolute values with a negative sign. And so you get this. And, you know, it's kind of cool. And so you could even say this box. So other people would say this box constraint problem has this simple dual here."},{"start":1243.24,"text":"And it kind of, everything's matching up, right? That, you know, you can think of this, you could have thought of this as the L infinity norm of x is less than 1. So then, using those weird, vague rules I said before, you see an L infinity norm, you should hardly be surprised if in the dual an L1 norm comes up. And sure enough, it did. Okay? So, does this make sense?"},{"start":1267.07,"text":"Then an interesting thing is, it turns out this is a case where there is a nice bar here. Because in fact, if you stare at this long enough, you will see something really interesting. Lambda 1 and lambda 2 are both non-negative. Their difference is equal to C plus A transpose nu. And you're asked to maximize the negative sum of the lambda 1 minus the lambda 2."},{"start":1292.28,"text":"When you look at that closely and stare at it, you'll realize you know precisely what that is. The optimal value of this thing is exactly that. And in fact, if you were to express this as an LP, it would be that. So this is a case where D and D tilde happen to be extremely closely related, right? So, okay, make sense?"},{"start":1319.02,"text":"Last topic, and then I'm going to mention one more thing, is problems with generalized inequality. So remember what this means, that what we're going to do is we're going to have an inequality constraint where that's a vector. And the constraint is now that instead of being less than or equal to zero as a scalar, it's actually like a vector. So, I mean, it could be, for example, this could be a matrix, and this could mean that the matrix is negative semi-definite."},{"start":1343.47,"text":"for example, right? I mean, more often it would be a matrix is positive semi-definite, but it was something like that. So here it turns out everything just kind of works, which means that all the notation was good. So here's what you do is you form a Lagrangian."},{"start":1363.13,"text":"by, you know, the equality constraints don't change. But for the inequality constraints, we do the same thing. Remember, if this was scalar, you would just say lambda i times fi. Lambda i is bigger than or equal to zero. And remember, the constraint is fi is less than or equal to zero. But now they're vectors, right? So it turns out what you want is to form this inner product. And what it's going to turn out is that lambda i should be"}],"speech_gaps":[],"frame":"../frames/v009/008.webp","frame_time":1227.69},{"title":"对偶问题与半正定规划","segments":[{"id":77,"text":"Actually, lambda i is going to have to be non-negative in the dual cone, which again kind of makes sense here. So here's the Lagrangian, and then here's the dual function.","zh":"实际上，lambda i 必须在对偶锥中是非负的，这在这里也大致合乎逻辑。这里是拉格朗日函数，这里是双重函数。","start":1388.44,"end":1404.11},{"id":78,"text":"And then the lower bound property is the same, right? Because what happens is if these vectors are bigger than or equal to zero in this generalized inequality, right? Then it turns out that dual function is a lower bound on p star, right? And the way you do that is it's identical to the other one. In the other one, there's no transpose. Lambda i is a scalar, f i is a scalar. And we use the deep fact.","zh":"然后下界性质是相同的，对吧？因为当这些向量在这个广义不等式中大于或等于零时，双重函数实际上是 p 星的下界，对吧？实现这一点的方式与之前相同。在之前的情况中，没有转置。lambda i 是一个标量，f i 也是一个标量。我们使用了这个深刻的定理。","start":1406.33,"end":1432.67},{"id":79,"text":"We're using the fact that if I give you a vector that's non-negative in the dual cone, and the inner product of that with a vector that is, did I get that right? Yes, non-positive in another cone, in the cone, then the inner product is actually less than or equal to zero.","zh":"我们使用的是这样一个事实：如果你给我一个在对偶锥中非负的向量，且该向量与另一个锥中非正的向量的内积，那么这个内积实际上是小于或等于零的。","start":1433.28,"end":1459.97},{"id":80,"text":"Right. So it's not much more complicated, but that's it. Right. And then you get a dual problem and everything works later. Everything, everything just works. And we'll look at just the last example of this. But it's kind of cool because this is stuff that I don't know, 25 years ago, 30 years ago, no one knew this. Right. Would have been just stunning. But here it is.","zh":"对的。所以它并不复杂得多，但就是这样。对的。然后你得到一个双重问题，之后一切都会正常运作。一切，一切都会正常运作。我们将只看一下这个例子的最后部分。但这是很酷的，因为这些内容在我25年前、30年前都不知道。对的。那时会让人感到震惊。但这里就是如此。","start":1460.58,"end":1480.66},{"id":81,"text":"Here's a semi-definite program. You're minimizing a linear function. I get that maybe this is an inequality form, right? Subject to, this is called an LMI, a linear matrix inequality. It's supposed to look like a linear inequality, except these are symmetric matrices, the Fs and the G. And that inequality there is with respect to the positive semi-definite cone. Okay? Then the Lagrangian looks like this. So here I have to take the inner product of what I would call lambda. Here I'm going to, instead of lambda, I'm going to call it capital Z.","zh":"这里是一个半正定规划。你是在最小化一个线性函数。我猜这可能是一个不等式形式，对吧？受约束于，这被称为LMI，即线性矩阵不等式。它看起来像一个线性不等式，只是这里的F和G是对称矩阵。这个不等式是相对于正半定锥的。明白吗？然后拉格朗日函数看起来像这样。这里我需要取lambda的内积。在这里，我将不再使用lambda，而是用大写的Z来表示。","start":1482.7,"end":1511.5},{"id":82,"text":"It's going to be a symmetric matrix. And you should read trace of z times that's the error or this minus that. You should read that as the inner product. So this is basically what lambda transpose fi or f1 of x would be. That's how you should read this part. And here's the Lagrangian. And the dual says I should minimize this over x.","zh":"它将是一个对称矩阵。你应该将迹的z乘以这个误差或这个减去那个读作内积。你应该将这部分读作lambda转置乘以fi或f1 of x。这就是你应该如何理解这一部分。这里是拉格朗日函数。而双重问题说我要在x上最小化这个。","start":1512.04,"end":1538.22},{"id":83,"text":"It's complicated because there's symmetric matrices flying all over the place. But it turns out this is simply an affine function of x, and the same story holds. If you minimize an affine function, it's going to be minus infinity unless the linear part vanishes. And so if it does, it says, if I look at how does this depend on x1? And the answer is it's c1, x1. That's from here.","zh":"这很复杂，因为对称矩阵到处都是。但事实上，这仅仅是x的一个仿射函数，同样的情况也适用。如果你最小化一个仿射函数，除非线性部分消失，否则结果会是负无穷。因此，如果线性部分消失，它会说，如果我观察这个值如何依赖于x1？答案是c1乘以x1。这是从这里得出的。","start":1538.76,"end":1567.32}],"notes":["本段讲解了对偶问题中非负性条件的使用，以及如何通过内积来构建对偶函数。讲者指出，当向量在对偶锥中非负，且与另一个锥中的非正向量内积时，结果会小于等于零。这是构建对偶函数的关键步骤。","讲者提到半正定规划（SDP）的结构，其中目标是最小化一个线性函数，约束条件是线性矩阵不等式（LMI）。LMI中的矩阵是关于正半定锥的，这与一般的线性不等式不同。","在构建Lagrangian时，讲者使用了对称矩阵Z来代替标量λ，并指出其与目标函数的内积关系。这种内积的计算方式类似于标量情况下的λ^T f_i，但需要考虑矩阵的对称性。","讲者强调，尽管半正定规划中涉及对称矩阵，但Lagrangian实际上仍然是关于x的仿射函数。这种结构使得对偶问题的分析与标量情况类似，但需要处理矩阵的对称性和内积计算。","讲者指出，当最小化一个仿射函数时，结果可能趋向于负无穷，除非线性部分消失。这种分析方法适用于半正定规划中的对偶问题，帮助确定对偶问题的可行性。","讲者提到，这种对偶问题的构建和分析在25到30年前是前沿研究，现在已成为标准内容，说明该领域的发展和理论的成熟。"],"formulas":[{"latex":"L(x, z) = c^T x - z^T (A - B x)","symbols":"Lagrangian 函数 L(x, z) 是关于 x 和 z 的函数，其中 z 是对称矩阵","explanation":"该公式正确表达了Lagrangian函数的形式，其中z是对称矩阵，且内积形式正确。","evidence":"It's going to be a symmetric matrix. And you should read trace of z times that's the error or this minus that. You should read that as the inner product. So this is basically what lambda transpose fi or f1 of x would be. That's how you should read this part. And here's the Lagrangian. And the dual says I should minimize this over x."},{"latex":"L(x, z) = \\text{affine function of } x","symbols":"Lagrangian 是关于 x 的仿射函数","explanation":"该公式正确描述了Lagrangian函数关于x的性质，即为仿射函数。","evidence":"I mean, it's complicated because there's symmetric matrices flying all over the place. But it turns out this is simply an affine function of x, and the same story holds. If you minimize an affine function, it's going to be minus infinity unless the linear part vanishes. And so if it does, it says, if I look at how does this depend on x1? And the answer is it's c1, x1. That's from here."}],"uncertainties":["trace of z times that's the error or this minus that"],"diagram":"none","start":1388.44,"end":1567.32,"asr_flags":[],"math_clarifications":["在半正定规划中，内积应使用迹运算（trace）来表示，而不是简单的矩阵乘法。因此，公式0中的内积表示不准确，需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1388.44,"text":"Actually, lambda i is going to have to be non-negative in the dual cone, which again kind of makes sense here. So here's the Lagrangian, and then here's the dual function."},{"start":1406.33,"text":"And then the lower bound property is the same, right? Because what happens is if these vectors are bigger than or equal to zero in this generalized inequality, right? Then it turns out that dual function is a lower bound on p star, right? And the way you do that is it's identical to the other one. In the other one, there's no transpose. Lambda i is a scalar, f i is a scalar. And we use the deep fact."},{"start":1433.28,"text":"In that case, that the product of a non-negative number and a non-positive number is non-positive. Here, it is a little bit more, right? We're using the fact that if I give you a vector that's non-negative in the dual cone, and the inner product of that with a vector that is, did I get that right? Yes, non-positive in another cone, in the cone, then the inner product is actually less than or equal to zero."},{"start":1460.58,"text":"Right. So it's not much more complicated, but that's it. Right. And then you get a dual problem and everything works later. Everything, everything just works. And we'll look at just the last example of this. But it's kind of cool because this is stuff that I don't know, 25 years ago, 30 years ago, no one knew this. Right. Would have been just stunning. But here it is."},{"start":1482.7,"text":"Here's a semi-definite program. You're minimizing a linear function. I get that maybe this is an inequality form, right? Subject to, this is called an LMI, a linear matrix inequality. It's supposed to look like a linear inequality, except these are symmetric matrices, the Fs and the G. And that inequality there is with respect to the positive semi-definite cone. Okay? Then the Lagrangian looks like this. So here I have to take the inner product of what I would call lambda. Here I'm going to, instead of lambda, I'm going to call it capital Z."},{"start":1512.04,"text":"It's going to be a symmetric matrix. And you should read trace of z times that's the error or this minus that. You should read that as the inner product. So this is basically what lambda transpose fi or f1 of x would be. That's how you should read this part. And here's the Lagrangian. And the dual says I should minimize this over x."},{"start":1538.76,"text":"I mean, it's complicated because there's symmetric matrices flying all over the place. But it turns out this is simply an affine function of x, and the same story holds. If you minimize an affine function, it's going to be minus infinity unless the linear part vanishes. And so if it does, it says, if I look at how does this depend on x1? And the answer is it's c1, x1. That's from here."}],"speech_gaps":[],"frame":"../frames/v009/009.webp","frame_time":1400.44},{"title":"对偶性与可行性问题","segments":[{"id":84,"text":"plus, and then trace Z F1 times X1. And so those two added together have to be zero. Otherwise, if I take X1 going off to plus infinity or minus infinity, I can make this thing minus infinity, right? So you get this. And then you end up with this dual semi-definite program, and it looks like that, right? So it says, you know, to minimize, you know, so linear function over this LMI, this problem","zh":"加上，然后计算Z乘以F1再乘以X1的迹。这两者相加必须等于零。否则，如果我让X1趋向正无穷或负无穷，我可以使这个表达式趋向负无穷，对吧？所以你会得到这个结果。然后你最终会得到这个对偶半正定规划问题，看起来像这样，对吧？所以它说，你要最小化，你知道的，这个线性函数在这个LMI（线性矩阵不等式）上的问题。","start":1567.98,"end":1594.9},{"id":85,"text":"This is now what, it's dual. And I don't think it's obvious. Like you wouldn't, I mean, it's not difficult to show parts of it. Weak duality is completely straightforward. Strong duality is not obvious, but that's it. So, okay. So that covers that. And again, you probably get some chances to do some of this on homework.","zh":"现在这是它的对偶问题。我不认为这很明显。比如，你不会，我的意思是，证明其中一部分并不困难。弱对偶性完全直观。强对偶性则不明显，但就是这样。所以，好的。这样就讲完了。而且再次强调，你可能在作业中有一些机会来做这些内容。","start":1595.56,"end":1617.42},{"id":86,"text":"Okay. Actually, before I go on to this, I just want to mention one more topic, which we didn't cover in the lecture, but we're expecting you to know. It is actually duality for feasibility problems. That's what it is. And the name for that is called theorems of the alternative. And the way that works is pretty simple. And I'll just say a little bit about it, but you will encounter it.","zh":"好的。实际上，在继续之前，我想再提一个话题，这个话题我们在课堂上没有讲到，但期望你们已经了解。它实际上是可行性问题的对偶性。这就是它的名称。这种对偶性被称为替代定理。它的运作方式相当简单。我只会说一点，但你们会遇到它。","start":1619.08,"end":1646.22},{"id":87,"text":"You may, I think you're encountering, you may be encountering it now on the current homework. Is that, yes, is there an option pricing thing? Yes, sorry, you will be encountering it now. Of course, I just gave that away, but that's fine, sorry. So, but that's okay, right? So the basic idea.","zh":"你们可能正在当前的作业中遇到它。这是不是，是的，有没有期权定价的问题？是的，抱歉，你们现在会遇到它。当然，我刚刚已经透露了，但没关系，抱歉。所以，但这样也无妨，对吧？所以基本思想是。","start":1649.96,"end":1668.1},{"id":88,"text":"is you write a feasibility problem as minimize zero subject to, you know, fi of x is less than zero, and let's make it convex, so, well, it doesn't matter, and hi of x equals zero, right? So there's your feasibility problem. This thing has optimal value zero if these constraints are feasible. Otherwise, the optimal value is plus infinity.","zh":"是将一个可行性问题写成最小化零，受约束于，你知道的，fi(x)小于零，让我们让它凸，所以，好吧，这并不重要，和hi(x)等于零，对吧？这就是你的可行性问题。如果这些约束是可行的，这个问题的最优值为零。否则，最优值为正无穷大。","start":1668.72,"end":1695.41},{"id":89,"text":"Because if it's not feasible, there's no x that satisfies this. And by completely standard assumption or definition, the infimum of the empty set is plus infinity. So this has either p star equals zero or infinity. And you can work out what the dual is. It's not complicated at all. And it's going to turn out you're going to get d star. And then interesting things are going to happen. This always holds.","zh":"因为如果不可行，就没有x能满足这个条件。根据完全标准的假设或定义，空集的下确界是正无穷大。因此，这个最优值要么是p星等于零，要么是正无穷大。你可以推导出对偶问题是什么。这并不复杂。结果你会得到d星。然后会发生一些有趣的事情。这总是成立的。","start":1696.06,"end":1725.14}],"notes":["本段讲授了对偶性在半定规划中的应用，强调了弱对偶性是显然的，而强对偶性则需要进一步证明。讲者提到，学生可能在作业中遇到相关问题，这表明对偶性是课程的重要内容之一。","讲者提到可行性问题的对偶性，即所谓的替代定理（theorems of the alternative）。这种对偶性将可行性问题转化为最小化零的目标函数，并通过约束条件来判断问题是否可行。","讲者指出，当约束条件不可行时，最优值为正无穷大，这是基于空集的下确界定义。这表明在处理可行性问题时，需要考虑问题是否可行，以及如何通过对偶性来判断。","讲者提到，通过将可行性问题转化为对偶问题，可以得到对偶最优值d*，并指出这种对偶性在处理可行性问题时具有普遍性，即总是成立。","讲者提到当前的作业中可能涉及这种对偶性，这表明课程内容与实际应用相结合，学生需要通过练习来掌握相关概念。","讲者强调了对偶性在优化问题中的重要性，特别是在处理可行性问题时，通过对偶性可以更有效地分析和解决实际问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1567.98,"end":1725.14,"asr_flags":[],"math_clarifications":["原文未提供足够的上下文来确认p*和d*的定义，因此无法核定这些符号的数学含义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1567.98,"text":"plus, and then trace Z F1 times X1. And so those two added together have to be zero. Otherwise, if I take X1 going off to plus infinity or minus infinity, I can make this thing minus infinity, right? So you get this. And then you end up with this dual semi-definite program, and it looks like that, right? So it says, you know, to minimize, you know, so linear function over this LMI, this problem,"},{"start":1595.56,"text":"This is now what, it's dual. And I don't think it's obvious. Like you wouldn't, I mean, it's not difficult to show parts of it. Weak duality is completely straightforward. Strong duality is not obvious, but that's it. So, okay. So that covers that. And again, you probably get some chances to do some of this on homework."},{"start":1619.08,"text":"Okay. Actually, before I go on to this, I just want to mention one more topic, which we didn't cover in the lecture, but we're expecting you to know. It is actually duality for feasibility problems. That's what it is. And the name for that is called theorems of the alternative. And the way that works is pretty simple. And I'll just say a little bit about it, but you will encounter it."},{"start":1649.96,"text":"You may, I think you're encountering, you may be encountering it now on the current homework. Is that, yes, is there an option pricing thing? Yes, sorry, you will be encountering it now. Of course, I just gave that away, but that's fine, sorry. So, but that's okay, right? So the basic idea."},{"start":1668.72,"text":"is you write a feasibility problem as minimize zero subject to, you know, fi of x is less than zero, and let's make it convex, so, well, it doesn't matter, and hi of x equals zero, right? So there's your feasibility problem. This thing has optimal value zero if these constraints are feasible. Otherwise, the optimal value is plus in
