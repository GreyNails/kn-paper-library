lief, that where the entire thing is constructed."},{"start":1927.02,"text":"on absence of arbitrage, he said, which is precisely what we do. So that kind of, anyway, we all laughed. It was mostly a joke, but not entirely, I have to say. Sorry. Okay. No. Okay. All right. This actually finishes up like part one of the class, which is all the theory. I mean, it's already obvious that it's useful. And what we're going to do now for the next like three weeks, I think, is we're going to look at applications, you know, broadly,"},{"start":1957.13,"text":"grouped in and what you'll see is after a while they start all looking the same because guess what they are all the same so so but instead of doing it that way we'll have some organization and actually what you should be figuring out is just you're going to sort of just get the idea of things you can do and then you'll be doing practical problems on them and all that sort of stuff so we'll start with just approximation and fitting so we'll start with some very simple ones norm approximation says"},{"start":1986.21,"text":"You know, I have a matrix A and B, that's data in the problem. And you would like to choose X to minimize the norm of AX minus B, right? And I don't know, lots of ways you can think of this, right? So you could say that, for example, X star."},{"start":2007.3,"text":"is the point for which A x star, that's the point in the range of A that's closest to B as measured by this norm. I haven't said what the norm is. It's any norm, right? So that would be that. So you could do, you know, L1 approximation, L infinity approximation, right? In estimation, this would come up this way."},{"start":2026.79,"text":"it would you'd come up and this is not yet with a statistical interpretation so at first it's just"},{"start":2033.99,"text":"uh just a common sense interpretation and it would go like this you'd say i have a a linear"},{"start":2039.79,"text":"measurement model and it looks like this x are the parameters you want to estimate right like"},{"start":2044.41,"text":"i don't know they could be uh things you can't directly measure like i could set off explosives"},{"start":2049.53,"text":"have some uh geophones or whatever that would that would look at the tray or i could i could"}],"speech_gaps":[],"frame":"../frames/v009/012.webp","frame_time":1890.69},{"title":"模型与残差的概念","segments":[{"id":107,"text":"I could fly a magnetic anomaly detector over some region,"},{"id":108,"text":"which would detect incredibly small changes"},{"id":109,"text":"in the magnetic field."},{"id":110,"text":"And this would have something to do"},{"id":111,"text":"with what's a kilometer underground, which I don't know."},{"id":112,"text":"And that's what X would be."},{"id":113,"text":"So A, people refer to as,"},{"id":114,"text":"actually there's very interesting names for it."},{"id":115,"text":"One is called the model."},{"id":116,"text":"It's also called the forward model."},{"id":117,"text":"That's very interesting name for it, right?"},{"id":118,"text":"And anyway, so that's the, so the forward model usually comes from, let's say, physics, and it tells you, well, yeah, if there were these point sources here, then, and they diffused according to this model in physics, then these are the concentrations of carbon dioxide we would measure at various places."},{"id":119,"text":"Everybody following this? I mean, this is just kind of the basic idea of this. So that's typically called the model or the forward model or something like that."},{"id":120,"text":"and then of course no one would believe y equals ax for many reasons right because there's stuff at"},{"id":121,"text":"the very least you might have just sensor error like how well did you measure how well do you"},{"id":122,"text":"measure carbon dioxide and you go is plus minus you know whatever you know three parts per million"},{"id":123,"text":"or something like that I mean the minimum right you're gonna have that they could be other stuff"},{"id":124,"text":"so that's this model and the point here is you know why you don't know X and you don't know"},{"id":125,"text":"But someone asks you to please guess x, right? And so what this does is actually interesting. Oh, by the way, because I haven't said anything about v, like any possible value of x, any value of x is possible, right? Because then I would just change v, so to v would be y minus ax."},{"id":126,"text":"which is the residual. Actually, some people call that, it's a beautiful name. They call it the physics residual. It's a beautiful name. That's when this is kind of very, when it's a physics real thing, right? Or something like the physics residual. And then they, so you could explain everything by physics residual. So I could say, well, I took my carbon dioxide measurements and you go, cool. Where do you think the sources are? And you go, oh yeah, I think I decided there aren't any."},{"id":127,"text":"And you go, excuse me, we took all these measurements and we're getting all these carbon dioxide, you know, things. Like, what are you talking about? And you go, no, no, no, I'm pretty sure it's just zero. And you say, but what are all those measurements? And you go, oh, that's just measurement error. Anyway, so you see what I'm saying? So you can say anything you like. So, all right. So you need some idea of how, it means you can say, you actually kind of like weirdly legal, although it is weird, you could actually announce that it's anything you like."}],"notes":["本段讲解了模型（forward model）和残差（residual）的概念。模型通常来源于物理，用于描述如何从源点扩散到测量点的物理过程，例如二氧化碳浓度的测量。残差则表示测量值与模型预测值之间的差异，也被称为物理残差，用于解释测量中的误差。","讲者指出，直接使用y = ax这样的模型是不可信的，因为存在传感器误差和其他因素。例如，测量误差可能达到百万分之三的水平，这表明模型需要考虑误差项v，即v = y - ax。","讲者通过一个例子说明，即使不知道X（源点分布），也可以通过残差来解释测量数据。例如，可以假设所有测量数据都是误差，从而得出X为零的结论。","讲者强调，残差的名称来源于其在物理过程中的意义，即物理残差，这有助于理解测量数据与模型预测之间的关系。","讲者指出，残差可以用来解释所有测量数据，包括误差和实际物理现象，这表明模型和残差在实际应用中具有重要的解释作用。","最后，讲者指出，虽然可以随意假设X的值，但需要有某种合理的解释，否则模型将失去意义。"],"formulas":[],"uncertainties":["the very least you might have just sensor error like how well did you measure how well do you","measure carbon dioxide and you go is plus minus you know whatever you know three parts per million","or something like that I mean the minimum right you're gonna have that they could be other stuff","so that's this model and the point here is you know why you don't know X and you don't know","But someone asks you to please guess x, right? And so what this does is actually interesting. Oh, by the way, because I haven't said anything about v, like any possible value of x, any value of x is possible, right? Because then I would just change v, so to v would be y minus ax."],"diagram":"none","start":2055.05,"end":2208.78,"asr_flags":[],"raw_segments":[{"start":2055.05,"text":"I could fly a magnetic anomaly detector over some region,"},{"start":2060.35,"text":"which would detect incredibly small changes"},{"start":2063.79,"text":"in the magnetic field."},{"start":2066.49,"text":"And this would have something to do"},{"start":2069.49,"text":"with what's a kilometer underground, which I don't know."},{"start":2072.67,"text":"And that's what X would be."},{"start":2074.45,"text":"So A, people refer to as,"},{"start":2076.41,"text":"actually there's very interesting names for it."},{"start":2078.71,"text":"One is called the model."},{"start":2080.41,"text":"It's also called the forward model."},{"start":2081.87,"text":"That's very interesting name for it, right?"},{"start":2085.13,"text":"And anyway, so that's the, so the forward model usually comes from, let's say, physics, and it tells you, well, yeah, if there were these point sources here, then, and they diffused according to this model in physics, then these are the concentrations of carbon dioxide we would measure at various places."},{"start":2103.07,"text":"Everybody following this? I mean, this is just kind of the basic idea of this. So that's typically called the model or the forward model or something like that."},{"start":2109.97,"text":"and then of course no one would believe y equals ax for many reasons right because there's stuff at"},{"start":2116.91,"text":"the very least you might have just sensor error like how well did you measure how well do you"},{"start":2121.89,"text":"measure carbon dioxide and you go is plus minus you know whatever you know three parts per million"},{"start":2126.49,"text":"or something like that I mean the minimum right you're gonna have that they could be other stuff"},{"start":2130.21,"text":"so that's this model and the point here is you know why you don't know X and you don't know"},{"start":2139.2,"text":"But someone asks you to please guess x, right? And so what this does is actually interesting. Oh, by the way, because I haven't said anything about v, like any possible value of x, any value of x is possible, right? Because then I would just change v, so to v would be y minus ax."},{"start":2158.62,"text":"which is the residual. Actually, some people call that, it's a beautiful name. They call it the physics residual. It's a beautiful name. That's when this is kind of very, when it's a physics real thing, right? Or something like the physics residual. And then they, so you could explain everything by physics residual. So I could say, well, I took my carbon dioxide measurements and you go, cool. Where do you think the sources are? And you go, oh yeah, I think I decided there aren't any."},{"start":2181.16,"text":"And you go, excuse me, we took all these measurements and we're getting all these carbon dioxide, you know, things. Like, what are you talking about? And you go, no, no, no, I'm pretty sure it's just zero. And you say, but what are all those measurements? And you go, oh, that's just measurement error. Anyway, so you see what I'm saying? So you can say anything you like. So, all right. So you need some idea of how, it means you can say, you actually kind of like weirdly legal, although it is weird, you could actually announce that it's anything you like."}],"speech_gaps":[],"frame":"../frames/v009/013.webp","frame_time":2067.05},{"title":"范数在优化问题中的应用","segments":[{"id":128,"text":"and cover it up by presumed measurement error, right? So what you need is, you know, you need to talk about plausibility of the value V. Now, later, we'll be doing this in a statistical framework. V will have a distribution, and we'll look at something like the maximum, we'll look at maximum likelihood or something like that. But for now, we're just saying, I need some measure of plausibility of V, and the measure here is this norm."},{"id":129,"text":"So you simply say, I don't know what the measurement error is, but my basic assumption is that this norm expresses implausibility for my measurement errors. Everybody got that? So if it's like L1, that means something. If it's L2, that means something, and so on. And that's this problem. Another one is another broad area where you get norm is optimal design. So x are design variables here."},{"id":130,"text":"AX is a result, and then X star is the design that best approximates the desired result, but that's in this particular norm. And so the norm there says how much it irritates you to miss the target B by a certain amount."},{"id":131,"text":"Right. So so, for example, you know, here would be get me a sequence. Find me a bunch of thruster firings on a satellite. That would be X. It's a long sequence. Right. That moves you to some target place. You can't get there. And then the question is, well, if you can get there, that's great. That's kind of the solution. Right. Because norms don't get smaller than zero. But if you can't, this says, you know, what what what would make you happiest?"},{"id":132,"text":"about missing, right? And you'd say, okay, it'll be the two norm. And that just means get me as close as possible to the point that's moving along your target trajectory. If you can't get there, minimize the number of meters from that track. Okay, everybody got that? Anyway, it's just to give you some rough ideas of where these come up. Okay, so..."},{"id":133,"text":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"},{"id":134,"text":"Yeah, you can have sum of absolute residuals. That's even got a name in certain fields. And again, that's also can be converted to an LP. By the way, people don't really need to know that now because in things like CVXPy, you just type, you literally, you just type these in. You write norm, you know, AX minus B comma one."}],"notes":["本段讲解了范数在优化问题中的应用，特别是如何通过范数来衡量测量误差的合理性。讲者提到，范数可以用来表达测量误差的不可信程度，例如L1范数和L2范数分别代表不同的误差处理方式。此外，还提到范数在最优设计问题中的应用，其中设计变量X需要在特定范数下逼近目标结果。","讲者通过卫星推进器点火序列的例子，说明了范数在实际问题中的应用。当无法精确到达目标点时，范数可以帮助确定最接近目标的解。例如，使用L2范数意味着尽可能接近目标轨迹，而使用无穷范数则意味着最小化与轨迹的距离。","讲者进一步解释了最小二乘法和切比雪夫逼近的区别。最小二乘法通过平方范数得到可微凸函数，从而得到正常方程。而切比雪夫逼近使用无穷范数，可以转化为线性规划问题。","讲者提到在实际编程中，如CVXPy，用户可以直接使用范数函数来实现这些优化问题，无需手动进行转换。这表明范数在实际应用中的便捷性。","讲者强调了范数在优化问题中的核心作用，即通过不同的范数选择来表达不同的优化目标。例如，L2范数适用于最小化误差平方，而L1范数适用于最小化误差绝对值。","讲者还提到，范数的选择会影响优化问题的性质，例如可微性、凸性等。这表明在实际应用中，范数的选择需要根据具体问题的需求进行调整。"],"formulas":[{"latex":"\\|AX - B\\|_2","symbols":"L2范数","explanation":"L2范数表示向量AX - B的欧几里得范数，适用于最小二乘问题，其平方可转化为凸函数，便于求解梯度。","evidence":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"},{"latex":"\\|AX - B\\|_1","symbols":"L1范数","explanation":"L1范数表示向量AX - B的绝对值之和，适用于稀疏性约束问题，其优化问题可转化为线性规划问题。","evidence":"Yeah, you can have sum of absolute residuals. That's even got a name in certain fields. And again, that's also can be converted to an LP. By the way, people don't really need to know that now because in things like CVXPy, you just type, you literally, you just type these in. You write norm, you know, AX minus B comma one."},{"latex":"\\|AX - B\\|_\\infty","symbols":"无穷范数","explanation":"无穷范数表示向量AX - B的最大绝对值分量，适用于Chebyshev逼近问题，其优化问题也可转化为线性规划问题。","evidence":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"}],"uncertainties":["在讲者提到'what what what would make you happiest?'时，可能存在重复或断句错误，但根据上下文可以理解为询问在无法到达目标时，什么情况会让用户最满意。"],"diagram":"none","start":2209.19,"end":2387.22,"asr_flags":[],"math_clarifications":["所有范数均适用于向量AX - B，且在不同范数下对应不同的优化问题，如最小二乘、L1正则化和Chebyshev逼近。"],"raw_segments":[{"start":2209.19,"text":"and cover it up by presumed measurement error, right? So what you need is, you know, you need to talk about plausibility of the value V. Now, later, we'll be doing this in a statistical framework. V will have a distribution, and we'll look at something like the maximum, we'll look at maximum likelihood or something like that. But for now, we're just saying, I need some measure of plausibility of V, and the measure here is this norm."},{"start":2238.43,"text":"So you simply say, I don't know what the measurement error is, but my basic assumption is that this norm expresses implausibility for my measurement errors. Everybody got that? So if it's like L1, that means something. If it's L2, that means something, and so on. And that's this problem. Another one is another broad area where you get norm is optimal design. So x are design variables here."},{"start":2267.61,"text":"AX is a result, and then X star is the design that best approximates the desired result, but that's in this particular norm. And so the norm there says how much it irritates you to miss the target B by a certain amount."},{"start":2284.25,"text":"Right. So so, for example, you know, here would be get me a sequence. Find me a bunch of thruster firings on a satellite. That would be X. It's a long sequence. Right. That moves you to some target place. You can't get there. And then the question is, well, if you can get there, that's great. That's kind of the solution. Right. Because norms don't get smaller than zero. But if you can't, this says, you know, what what what would make you happiest?"},{"start":2312.62,"text":"about missing, right? And you'd say, okay, it'll be the two norm. And that just means get me as close as possible to the point that's moving along your target trajectory. If you can't get there, minimize the number of meters from that track. Okay, everybody got that? Anyway, it's just to give you some rough ideas of where these come up. Okay, so..."},{"start":2334.54,"text":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"},{"start":2364.96,"text":"Yeah, you can have sum of absolute residuals. That's even got a name in certain fields. And again, that's also can be converted to an LP. By the way, people don't really need to know that now because in things like CVXPy, you just type, you literally, you just type these in. You write norm, you know, AX minus B comma one."}],"speech_gaps":[],"frame":"../frames/v009/014.webp","frame_time":2221.19},{"title":"凸优化中的惩罚函数与分离性","segments":[{"id":135,"text":"That's it, right? You can just do one line solve, right? So it would be something like problem of minimize A times that norm, A times X minus B comma one. Then you have the correct number of right parentheses, right? Then you go dot solve. And I just constructed a problem and solved it in one line. Hopefully by now everybody gets what I just said. Okay?"},{"id":136,"text":"So you don't actually need to know this, but it's not bad to know. Okay. Now we're talking about something. This is super interesting. It is super important. And don't over-interpret it. It is as simple and dumb as it sounds. Okay? So that's the... And also, it is unbelievably useful. So here's what it is. I want AX to be equal to B."},{"id":137,"text":"Instead of a norm, though, I'm going to have this penalty function, and it's going to be separable. Separable means it's a function is a sum of functions of the individual components. That's separable. So here it is. And then these are just functions from R to R, right? And if it's quadratic, this becomes least squares, right? If phi of u is the absolute value of u, this is L1 approximation. But now we can do cool things like, let's see, here's quadratic right here, this one. Here's a crazy one, dead zone linear."},{"id":138,"text":"So these are not standard names, but anyone would get it. Dead zone means there is a zone here where you don't care, right? And then outside that zone, the penalty grows linearly, right? And here's another one, log barrier. That's this function here. It agrees really closely with a quadratic."},{"id":139,"text":"for small values. But for large values, it actually starts going up and it goes all the way to infinity and outside some band, plus minus A, it's just plus infinity. So one way, the way I actually think about these is you anthropomorphize all this. And it's actually kind of correct. So what phi is telling you is phi of R tells you how irritated you are for a residual of that size."},{"id":140,"text":"It's really that simple and dumb. And so, for example, if someone says, I'm doing this approximation with this penalty function, what it means is, for some reason, errors that are between plus minus A, how much do you care about them? None. Zero. You couldn't care less, right? Somebody want to give me a case where that would be completely justifiable? I mean, with a, I guess, a small A or something. Yeah."}],"notes":["本段主要讲解了凸优化中惩罚函数的概念，以及如何通过惩罚函数来构造优化问题。惩罚函数可以是分离的，即可以表示为各个分量函数的和。这种分离性使得问题更容易处理，例如，当惩罚函数是二次函数时，问题转化为最小二乘问题；当惩罚函数是绝对值函数时，问题转化为L1逼近问题。","讲者提到，惩罚函数可以是各种形式，如死区线性函数和对数障碍函数。死区线性函数在某个区间内不产生惩罚，而在该区间外线性增长；对数障碍函数在小值时接近二次函数，但在大值时趋向于无穷大。","惩罚函数的直观理解是，它表示对残差的“不满程度”。例如，当残差在某个区间内时，惩罚为零，表示不关心；当残差超出该区间时，惩罚线性增长，表示对误差的重视程度增加。","讲者通过一个例子说明了惩罚函数的应用场景，即当误差在某个区间内时，可以完全忽略这些误差。这种情况下，选择一个合适的惩罚函数可以有效优化问题。","讲者强调，虽然惩罚函数的概念看似简单，但其应用非常广泛且重要，特别是在实际问题中，通过选择合适的惩罚函数可以实现更优的优化结果。","讲者还提到，惩罚函数的构造需要考虑问题的具体需求，例如，选择一个合适的死区范围A，以确保在不关心的误差范围内不产生惩罚，而在需要关注的误差范围内产生适当的惩罚。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2387.93,"end":2563.16,"asr_flags":[],"raw_segments":[{"start":2387.93,"text":"That's it, right? You can just do one line solve, right? So it would be something like problem of minimize A times that norm, A times X minus B comma one. Then you have the correct number of right parentheses, right? Then you go dot solve. And I just constructed a problem and solved it in one line. Hopefully by now everybody gets what I just said. Okay?"},{"start":2418.85,"text":"So you don't actually need to know this, but it's not bad to know. Okay. Now we're talking about something. This is super interesting. It is super important. And don't over-interpret it. It is as simple and dumb as it sounds. Okay? So that's the... And also, it is unbelievably useful. So here's what it is. I want AX to be equal to B."},{"start":2447.39,"text":"Instead of a norm, though, I'm going to have this penalty function, and it's going to be separable. Separable means it's a function is a sum of functions of the individual components. That's separable. So here it is. And then these are just functions from R to R, right? And if it's quadratic, this becomes least squares, right? If phi of u is the absolute value of u, this is L1 approximation. But now we can do cool things like, let's see, here's quadratic right here, this one. Here's a crazy one, dead zone linear."},{"start":2477.39,"text":"So these are not standard names, but anyone would get it. Dead zone means there is a zone here where you don't care, right? And then outside that zone, the penalty grows linearly, right? And here's another one, log barrier. That's this function here. It agrees really closely with a quadratic."},{"start":2502.4,"text":"for small values. But for large values, it actually starts going up and it goes all the way to infinity and outside some band, plus minus A, it's just plus infinity. So one way, the way I actually think about these is you anthropomorphize all this. And it's actually kind of correct. So what phi is telling you is phi of R tells you how irritated you are for a residual of that size."},{"start":2531.69,"text":"It's really that simple and dumb. And so, for example, if someone says, I'm doing this approximation with this penalty function, what it means is, for some reason, errors that are between plus minus A, how much do you care about them? None. Zero. You couldn't care less, right? Somebody want to give me a case where that would be completely justifiable? I mean, with a, I guess, a small A or something. Yeah."}],"speech_gaps":[],"frame":"../frames/v009/015.webp","frame_time":2399.93},{"title":"测量误差与残差分析","segments":[{"id":141,"text":"What's that? You're trying to optimize for what? Okay. Yeah, let me... I didn't quite get it. I mean, here's a very simple example. You measure something, and the measurements are basically done with a 5-bit converter."},{"id":142,"text":"And so what you get is only, there's only 32 possible values."},{"id":143,"text":"So when you get a measurement, here's what you don't, what you get."},{"id":144,"text":"I mean, sure, I tell you the number in there."},{"id":145,"text":"I pretend that's the number."},{"id":146,"text":"But in fact, any measurement in this little interval would have mapped to that."},{"id":147,"text":"So what that says here is for the penalty."},{"id":148,"text":"If I represent that here, someone says, why?"},{"id":149,"text":"And you go, hello, it's a six bit A to D converter."},{"id":150,"text":"So if I interpret any number smaller than that, or here, I'll go into dialect, smaller than my LSB of my converter, that was the least significant bit, then you say it's completely fictitious and means nothing."},{"id":151,"text":"Right?"},{"id":152,"text":"So that would be that."},{"id":153,"text":"Okay."},{"id":154,"text":"Yes?"},{"id":155,"text":"Up here?"},{"id":156,"text":"Yeah."},{"id":157,"text":"Yeah."},{"id":158,"text":"Actually, there is here."},{"id":159,"text":"Yeah."},{"id":160,"text":"Because I want to measure the residuals."},{"id":161,"text":"We could do the same thing with an inequality constraint here."},{"id":162,"text":"If you were, I mean, it's a bit stranger, but you could do that."},{"id":163,"text":"You can certainly do it with an inequality constraint as well, right?"},{"id":164,"text":"If you'd say, I'd like these inequalities to hold,"},{"id":165,"text":"and then you'd say, yeah, but I have weird personal opinions"},{"id":166,"text":"about how much it irritates me to violate inequalities,"},{"id":167,"text":"then it would be exactly an inequality."},{"id":168,"text":"And everything would work the same."},{"id":169,"text":"Okay."},{"id":170,"text":"Okay."},{"id":171,"text":"Okay, so we'll just look at a little example."},{"id":172,"text":"Here, this is just like, this is a matrix,"},{"id":173,"text":"which is 100 high, 30 wide, so you have 30 Xs"},{"id":174,"text":"and 100, basically, equations, right?"},{"id":175,"text":"Generate completely randomly, so this is just, yeah."},{"id":176,"text":"But this'll tell you a lot."},{"id":177,"text":"So let's start with least squares. That's here. So if you do least squares, and then you look at the residual, the distribution of residuals, right? Then, you know, you see something reasonable, right? This shows you the penalty. This shows you how much it irritated you to have a residual at that level. And what you can see is, you know, this is obvious for a quadratic, you know, around in here, it's really small. Why? Because if, well, for a quadratic,"}],"notes":["本段讨论了测量误差与残差分析，特别是使用有限精度的A/D转换器时的量化误差。讲者通过一个5位转换器的例子说明，测量值只能取32个可能的值，因此任何落在最小有效位（LSB）范围内的测量值都会被当作虚构值处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2563.76,"end":2715.91,"asr_flags":[151],"raw_segments":[{"start":2563.76,"text":"What's that? You're trying to optimize for what? Okay. Yeah, let me... I didn't quite get it. I mean, here's a very simple example. You measure something, and the measurements are basically done with a 5-bit converter."},{"start":2588.53,"text":"And so what you get is only, there's only 32 possible values."},{"start":2592.59,"text":"So when you get a measurement, here's what you don't, what you get."},{"start":2595.95,"text":"I mean, sure, I tell you the number in there."},{"start":2597.49,"text":"I pretend that's the number."},{"start":2598.55,"text":"But in fact, any measurement in this little interval would have mapped to that."},{"start":2603.21,"text":"So what that says here is for the penalty."},{"start":2605.47,"text":"If I represent that here, someone says, why?"},{"start":2609.35,"text":"And you go, hello, it's a six bit A to D converter."},{"start":2612.37,"text":"So if I interpret any number smaller than that, or here, I'll go into dialect, smaller than my LSB of my converter, that was the least significant bit, then you say it's completely fictitious and means nothing."},{"start":2628.41,"text":"Right?"},{"start":2628.53,"text":"So that would be that."},{"start":2629.83,"text":"Okay."},{"start":2631.19,"text":"Yes?"},{"start":2634.67,"text":"Up here?"},{"start":2636.39,"text":"Yeah."},{"start":2636.99,"text":"Yeah."},{"start":2637.99,"text":"Actually, there is here."},{"start":2640.95,"text":"Yeah."},{"start":2641.33,"text":"Because I want to measure the residuals."},{"start":2643.79,"text":"We could do the same thing with an inequality constraint here."},{"start":2646.55,"text":"If you were, I mean, it's a bit stranger, but you could do that."},{"start":2650.19,"text":"You can certainly do it with an inequality constraint as well, right?"},{"start":2652.77,"text":"If you'd say, I'd like these inequalities to hold,"},{"start":2655.43,"text":"and then you'd say, yeah, but I have weird personal opinions"},{"start":2660.33,"text":"about how much it irritates me to violate inequalities,"},{"start":2663.93,"text":"then it would be exactly an inequality."},{"start":2666.35,"text":"And everything would work the same."},{"start":2668.65,"text":"Okay."},{"start":2670.25,"text":"Okay."},{"start":2670.65,"text":"Okay, so we'll just look at a little example."},{"start":2673.97,"text":"Here, this is just like, this is a matrix,"},{"start":2676.83,"text":"which is 100 high, 30 wide, so you have 30 Xs"},{"start":2679.83,"text":"and 100, basically, equations, right?"},{"start":2684.01,"text":"Generate completely randomly, so this is just, yeah."},{"start":2686.51,"text":"But this'll tell you a lot."},{"start":2689.13,"text":"So let's start with least squares. That's here. So if you do least squares, and then you look at the residual, the distribution of residuals, right? Then, you know, you see something reasonable, right? This shows you the penalty. This shows you how much it irritated you to have a residual at that level. And what you can see is, you know, this is obvious for a quadratic, you know, around in here, it's really small. Why? Because if, well, for a quadratic,"}],"speech_gaps":[],"frame":"../frames/v009/016.webp","frame_time":2575.76},{"title":"残差与优化方法的类比","segments":[{"id":178,"text":"If an error, if a residual is small, the quadratic charges you small squared. And small squared is like very small. In fact, some people even use the language where very small means, actually literally means small squared. Very, very small means small cubed and whatever, you know, something like that. And incredibly small indeed means something like the fourth power or something. That would be the analog of like jerk. And what's one up from jerk?"},{"id":179,"text":"What is that? Snap. There you go. Okay, fine. So, okay. And you can see what happens. And, you know, you can even go back and say, like, ooh, you had some big residuals here. Right? In fact, we can even anthropomorphize it and say, like, ooh, that one really hurt because look at the height of this thing compared to, like, over here. Right? Okay. So, this is least squares traditional thing. For fun, let's see. Oh, let's look at log barrier next. For log barrier,"},{"id":180,"text":"This thing actually matches that almost exactly for small residuals. But what happens with log barrier is as your residuals get bigger and bigger, unlike least squares, you start getting, you get more and more upset compared to least squares."},{"id":181,"text":"because the log barrier is bigger than the square function, right? And so what happens is you can see it, by the way, all residuals were between plus and minus one. It had to be, otherwise you'd get infinity. Actually, the problem would be infeasible at that point, right? But the points are all between there and there. And you can almost say something like, well, this is least squares, but I put a big old, I put a clamp on it and tighten the clamp so that all the residuals have to be between plus and minus one. Everybody."},{"id":182,"text":"But there's nothing deep here, so don't over-interpret. Dead zone linear is really cool. Let's take a look at that. So dead zone linear is kind of interesting because, first of all, what you did is you told the, let's say the solver or whatever, that once a residual is between plus and minus a half, yeah, plus and minus a half, you couldn't care less at all. If you're outside, you care."},{"id":183,"text":"But in fact, it's going up linearly. And we'll talk about that in a minute. And so, not surprisingly, look at the residuals you get. And somebody give me some English to explain, to anthropomorphize this and say, why do you get a whole bunch of things shoved right up against these two boundaries? Somebody want to... I mean, you can't be wrong. We're just talking and anthropomorphizing it, right? So, what would you say?"},{"id":184,"text":"Why is it? What's that? There's no benefits. Yeah, that's right. He'd say, well, you know, what it did was it shoved, it shoved a whole bunch of residuals down to the boundary of where you don't care. And why should it expend any effort to make it smaller? That's perfect. Perfect. Everybody got that?"}],"notes":["本段讨论了残差在优化问题中的作用，特别是最小二乘法和对数障碍法的对比。讲者用类比的方式解释了残差的大小如何影响优化过程，例如将残差的平方、立方等与物理中的加速度、急动度等概念进行类比。","讲者提到，当残差较大时，对数障碍法会比最小二乘法更加敏感，因为对数障碍函数的增长速度比平方函数更快。这导致在残差较大时，对数障碍法会更强烈地惩罚残差，从而影响优化结果。","讲者还提到，当所有残差都被限制在±1之间时，对数障碍法实际上相当于对最小二乘法施加了一个限制，使得残差不能超过这个范围。这种限制类似于在优化过程中加入一个“钳位”机制。","在讨论“死区线性”方法时，讲者指出，当残差在±0.5范围内时，优化器不会对残差进行任何处理，只有当残差超出这个范围时，才会进行调整。这种机制类似于在优化过程中设置一个“死区”，即对残差的某些范围不进行惩罚。","讲者进一步解释了为什么残差会被“推”到边界上，即当残差在死区范围内时，优化器不会对其进行任何调整，因此残差会停留在边界上。这种现象是由于优化器在死区范围内不进行任何操作，从而导致残差无法进一步减小。","讲者强调，这些概念虽然有趣，但并不涉及深层次的理论，因此不应过度解读。他鼓励学生通过类比和直观理解来掌握这些优化方法的基本思想。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2716.74,"end":2891.4,"asr_flags":[],"raw_segments":[{"start":2716.74,"text":"If an error, if a residual is small, the quadratic charges you small squared. And small squared is like very small. In fact, some people even use the language where very small means, actually literally means small squared. Very, very small means small cubed and whatever, you know, something like that. And incredibly small indeed means something like the fourth power or something. That would be the analog of like jerk. And what's one up from jerk?"},{"start":2746.23,"text":"What is that? Snap. There you go. Okay, fine. So, okay. And you can see what happens. And, you know, you can even go back and say, like, ooh, you had some big residuals here. Right? In fact, we can even anthropomorphize it and say, like, ooh, that one really hurt because look at the height of this thing compared to, like, over here. Right? Okay. So, this is least squares traditional thing. For fun, let's see. Oh, let's look at log barrier next. For log barrier,"},{"start":2774.94,"text":"This thing actually matches that almost exactly for small residuals. But what happens with log barrier is as your residuals get bigger and bigger, unlike least squares, you start getting, you get more and more upset compared to least squares."},{"start":2791.02,"text":"because the log barrier is bigger than the square function, right? And so what happens is you can see it, by the way, all residuals were between plus and minus one. It had to be, otherwise you'd get infinity. Actually, the problem would be infeasible at that point, right? But the points are all between there and there. And you can almost say something like, well, this is least squares, but I put a big old, I put a clamp on it and tighten the clamp so that all the residuals have to be between plus and minus one. Everybody."},{"start":2817.0,"text":"But there's nothing deep here, so don't over-interpret. Dead zone linear is really cool. Let's take a look at that. So dead zone linear is kind of interesting because, first of all, what you did is you told the, let's say the solver or whatever, that once a residual is between plus and minus a half, yeah, plus and minus a half, you couldn't care less at all. If you're outside, you care."},{"start":2846.25,"text":"But in fact, it's going up linearly. And we'll talk about that in a minute. And so, not surprisingly, look at the residuals you get. And somebody give me some English to explain, to anthropomorphize this and say, why do you get a whole bunch of things shoved right up against these two boundaries? Somebody want to... I mean, you can't be wrong. We're just talking and anthropomorphizing it, right? So, what would you say?"},{"start":2875.22,"text":"Why is it? What's that? There's no benefits. Yeah, that's right. He'd say, well, you know, what it did was it shoved, it shoved a whole bunch of residuals down to the boundary of where you don't care. And why should it expend any effort to make it smaller? That's perfect. Perfect. Everybody got that?"}],"speech_gaps":[],"frame":"../frames/v009/017.webp","frame_time":2728.74},{"title":"惩罚函数的性质与L1和L2范数的对比","segments":[{"id":185,"text":"So, okay, it's kind of cool. Oh, and I'd say, hey, look at this. You've got a bigger, you have a couple of bigger residuals than the square. I mean, this is hard to see on the scale, but we'll get to that. Let's go to the L1 one. This is L1. Anybody notice anything on the L1 thing? I mean, this is kind of an obvious thing. A whole bunch of the residuals are zero. Not a whole bunch, like 35 or something, 30 or something like that. Okay, everybody got it?"},{"id":186,"text":"To anthropomorphize that, we would go like this. Let's consider the square function, the square penalty and the absolute value penalty for small residuals, right? When you have a square penalty and a residual becomes small, you start caring about it a lot less because the amount you care about it is small squared. Everybody got it? Okay. For an absolute value,"},{"id":187,"text":"what happens is the marginal amount by which you care about reducing a residual keeps up until you hit zero. So in least squares, the difference between having a residual of 9 and a residual of 10 is big. And the difference between having a residual of 1 and 2 is a lot less. Everybody got it? You just square those numbers and you figure it out, right? For an absolute value,"},{"id":188,"text":"the difference between having a residual of 9 and a residual of 10 is identical to the difference between having a residual of 1 and 2. Everybody got that? So I'm just, this is completely just, I'm just saying that it, and so, so that's actually one interesting thing you'll see about a penalty function. If a penalty function has a sharp point, then you're actually, you will expect"},{"id":189,"text":"actually, the solution to have lots of zeros. And someone would say, why? There's lots of ways to see this, right? And in other contexts, like in compressed sensing and all this kind of stuff, people can construct incredibly complicated theories about this. But the point is, it's just because the marginal improvement of making a residual smaller, if we anthropomorphize the whole thing, basically keeps up until it's zero."},{"id":190,"text":"By the way, the opposite is like a square is kind of chill. It's like once it gets small, it's small squared. You still care, but you care a lot less. Everybody got that? And then dead zone linear, extreme. It's like, nope, actually, once you get in this band, couldn't care less. Everybody got that? So that's what the qualities of a penalty function near zero matter, right? At the other end, we look at the qualities of a penalty function for large things, because that tells you..."}],"notes":["本段讨论了惩罚函数在零点附近的性质，特别是L1和L2范数在处理残差时的不同行为。L1惩罚函数在残差接近零时，其边际改善保持不变，直到残差为零，这导致了大量残差为零的解。而L2惩罚函数在残差较小时，其边际改善迅速下降，因此对小残差的敏感度较低。","讲者通过拟人化的方式解释了惩罚函数的行为，将残差的处理比作对残差的关心程度。对于L2惩罚函数，当残差变小时，关心程度迅速下降，因为其平方值的增加幅度较小。而对于L1惩罚函数，关心程度在残差接近零时保持不变，直到残差为零。","讲者指出，L1惩罚函数的这种特性使得其解中出现大量零残差，这是其在压缩感知等应用中的重要特性。这种行为源于L1惩罚函数在零点附近具有尖点，导致其对残差的边际改善保持不变。","讲者还提到，L2惩罚函数在残差较大时的行为，即其对残差的敏感度随着残差的增大而增加。这种行为与L1惩罚函数形成对比，L1惩罚函数在残差较大时对残差的敏感度保持不变，直到残差进入某个区间后变得不敏感。","讲者强调，惩罚函数在零点附近的性质和在大残差时的性质都对优化问题的解有重要影响。零点附近的性质决定了解中零残差的数量，而大残差时的性质决定了惩罚函数对残差的敏感度。","讲者通过拟人化的比喻，帮助学生理解惩罚函数的行为，这种教学方式有助于学生直观地理解不同惩罚函数的特性及其对优化问题的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2892.22,"end":3055.13,"asr_flags":[],"raw_segments":[{"start":2892.22,"text":"So, okay, it's kind of cool. Oh, and I'd say, hey, look at this. You've got a bigger, you have a couple of bigger residuals than the square. I mean, this is hard to see on the scale, but we'll get to that. Let's go to the L1 one. This is L1. Anybody notice anything on the L1 thing? I mean, this is kind of an obvious thing. A whole bunch of the residuals are zero. Not a whole bunch, like 35 or something, 30 or something like that. Okay, everybody got it?"},{"start":2922.95,"text":"To anthropomorphize that, we would go like this. Let's consider the square function, the square penalty and the absolute value penalty for small residuals, right? When you have a square penalty and a residual becomes small, you start caring about it a lot less because the amount you care about it is small squared. Everybody got it? Okay. For an absolute value,"},{"start":2947.53,"text":"what happens is the marginal amount by which you care about reducing a residual keeps up until you hit zero. So in least squares, the difference between having a residual of 9 and a residual of 10 is big. And the difference between having a residual of 1 and 2 is a lot less. Everybody got it? You just square those numbers and you figure it out, right? For an absolute value,"},{"start":2977.64,"text":"the difference between having a residual of 9 and a residual of 10 is identical to the difference between having a residual of 1 and 2. Everybody got that? So I'm just, this is completely just, I'm just saying that it, and so, so that's actually one interesting thing you'll see about a penalty
