finity."},{"start":1696.06,"text":"Because if it's not feasible, there's no x that satisfies this. And by completely standard assumption or definition, the infimum of the empty set is plus infinity. So this has either p star equals zero or infinity. And you can work out what the dual is. It's not complicated at all. And it's going to turn out you're going to get d star. And then interesting things are going to happen. This always holds."}],"speech_gaps":[],"frame":"../frames/v009/010.webp","frame_time":1579.98},{"title":"对偶问题与可行性分析","segments":[{"id":90,"text":"that always holds convex non-convex doesn't make any difference at all it always holds right and this would tell you some cool things like for example if this was let's say this is a set of non-convex inequalities right but if i form the dual and the dual if i find the dual is unbounded above meaning d stars plus infinity what can you say","zh":"这个总是成立，凸的和非凸的没有任何区别，它总是成立，对吧？这会告诉你一些很酷的事情，比如，如果这是非凸不等式的一组，但如果你形成对偶问题，如果发现对偶问题是无界的，即d星等于正无穷大，你能说什么？","start":1725.75,"end":1748.01},{"id":91,"text":"Yeah, the original one is not feasible. I would say, well, how could you say that? I'm sorry, that problem is like NP-hard to determine if these inequalities are feasible, right? What would you respond then when I said that? Yeah, you just say, yeah, sorry, but it's completely elementary that this is a lower bound on the optimal value. And in fact, it would be good enough if I worked out the dual of this. If I found a point...","zh":"是的，原始问题不可行。我会说，好吧，你怎么能这么说呢？抱歉，这个问题判断这些不等式是否可行就像NP难的问题一样，对吧？当我说这个的时候，你会怎么回应呢？是的，你只能说，是的，抱歉，但这完全是基本的，这个是对最优值的一个下界。事实上，如果你计算这个对偶问题，找到一个点……","start":1753.69,"end":1779.46},{"id":92,"text":"you know, some lambda and nu's for the dual, and I evaluated it, and d star was equal to 1, what could you conclude? What do you conclude? It's invisible. And the argument would go like this, which is actually kind of interesting, right? That number is either 0 or plus infinity. Okay? If I tell you 1 is a lower bound on it, well, hello, but now the only possible value for this is plus infinity. And that means precisely that your problem is infeasible. Everybody,","zh":"你知道的，找到一些对偶问题的λ和ν，然后你计算它，发现d星等于1，你能得出什么结论？你会得出什么结论？这很隐晦。论证过程会是这样的，这其实很有趣，对吧？这个数字要么是0，要么是正无穷大。对吧？如果我告诉你1是对它的一个下界，那么，你好，但现在这个值只能是正无穷大。这意味着你的问题不可行。大家，","start":1780.18,"end":1810.54},{"id":93,"text":"Got this? Okay. So, I mean, that was just a whirlwind tour. You'll find, and these are generally called theorem of the alternatives because they basically say this set of, when it's, okay, in the convex case, it says this set of inequalities has a solution if and only if these, this other set does not. Everybody.","zh":"明白了吗？好的。所以，我刚才只是快速地浏览了一下。你会发现，这些通常被称为替代定理，因为它们基本上说明，当它是凸的情况时，它说这组不等式有解当且仅当另一组不等式没有解。大家，","start":1811.26,"end":1829.4},{"id":94,"text":"Got that? I'm just giving you the big, high, you know, big, broad strokes description of the topic. Everybody? And there's some famous ones, like for linear inequalities, it's called the Farkas Lemma or something like that, right? And this comes up in lots of different things. One is, it's kind of the basis of most, of a lot of classical economics and finance, right?","zh":"明白了吗？我只是给你们一个大体的、宏观的描述。大家？还有一些著名的定理，比如对于线性不等式，它被称为Farkas引理，对吧？这在很多不同的领域都会出现。其中一个方面，它是大多数经典经济学和金融的基础，对吧？","start":1830.04,"end":1854.45},{"id":95,"text":"Because there, everything would be based on the idea. I'd say, here's a bunch of stuff you can invest in. If you can invest in these things and never lose money in all cases, and under some circumstance make money, that's called an arbitrage. And then a lot of finance says, or a lot of classical finance says, that can't happen.","zh":"因为在那种情况下，一切都将基于这个想法。我会说，这里有一系列你可以投资的东西。如果你可以投资这些东西，并且在所有情况下都不会亏钱，而在某些情况下还能赚钱，这就被称为套利。然后很多金融学，或者说很多古典金融学认为，这种情况不可能发生。","start":1855.09,"end":1877.65}],"notes":["本段讨论了凸优化中对偶问题的性质，特别是当对偶问题无界时，原问题的可行性。讲者指出，如果对偶问题的上界是正无穷，那么原问题可能是不可行的。这涉及到对偶问题与原问题之间的关系，以及如何通过对偶问题的性质来判断原问题的可行性。","讲者提到，判断一组不等式是否可行在一般情况下是NP难的，但通过构造对偶问题并分析其性质，可以得到原问题的下界。如果对偶问题的最优值为1，而原问题的下界为1，那么原问题的最优值只能是正无穷，从而说明原问题不可行。","讲者进一步指出，这种关系被称为替代定理（theorems of the alternatives），它在凸优化中非常重要。在凸情况下，一组不等式有解当且仅当另一组不等式无解。","讲者还提到，这种替代定理在经济学和金融学中有广泛应用，特别是在分析套利（arbitrage）时。套利指的是在所有情况下都不会亏损，而在某些情况下还能盈利的投资策略，而经典金融理论认为这种策略是不可能存在的。","讲者通过举例说明，如果存在一种投资组合，可以在所有情况下不亏损，并在某些情况下盈利，那么这将违反金融市场的基本假设，即不存在套利机会。","讲者强调，这些概念和定理是凸优化理论中的核心内容，为理解更复杂的优化问题和实际应用提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1725.75,"end":1877.65,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1725.75,"text":"that always holds convex non-convex doesn't make any difference at all it always holds right and this would tell you some cool things like for example if this was let's say this is a set of non-convex inequalities right but if i form the dual and the dual if i find the dual is unbounded above meaning d stars plus infinity what can you say"},{"start":1753.69,"text":"Yeah, the original one is not feasible. I would say, well, how could you say that? I'm sorry, that problem is like NP-hard to determine if these inequalities are feasible, right? What would you respond then when I said that? Yeah, you just say, yeah, sorry, but it's completely elementary that this is a lower bound on the optimal value. And in fact, it would be good enough if I worked out the dual of this. If I found a point..."},{"start":1780.18,"text":"you know, some lambda and nu's for the dual, and I evaluated it, and d star was equal to 1, what could you conclude? What do you conclude? It's invisible. And the argument would go like this, which is actually kind of interesting, right? That number is either 0 or plus infinity. Okay? If I tell you 1 is a lower bound on it, well, hello, but now the only possible value for this is plus infinity. And that means precisely that your problem is infeasible. Everybody,"},{"start":1811.26,"text":"Got this? Okay. So, I mean, that was just a whirlwind tour. You'll find, and these are generally called theorem of the alternatives because they basically say this set of, when it's, okay, in the convex case, it says this set of inequalities has a solution if and only if these, this other set does not. Everybody."},{"start":1830.04,"text":"Got that? I'm just giving you the big, high, you know, big, broad strokes description of the topic. Everybody? And there's some famous ones, like for linear inequalities, it's called the Farkas Lemma or something like that, right? And this comes up in lots of different things. One is, it's kind of the basis of most, of a lot of classical economics and finance, right?"},{"start":1855.09,"text":"Because there, everything would be based on the idea. I'd say, here's a bunch of stuff you can invest in. If you can invest in these things and never lose money in all cases, and under some circumstance make money, that's called an arbitrage. And then a lot of finance says, or a lot of classical finance says, that can't happen."}],"speech_gaps":[],"frame":"../frames/v009/011.webp","frame_time":1737.75},{"title":"凸优化课程中的应用与范例","segments":[{"id":96,"text":"Right. Because if that happens, the prices would readjust in such a way that it can't, you know, somebody would go in and exploit it and blah, blah, blah, all that kind of stuff. So actually, my friends at hedge funds will assure you it can happen. So, yeah, which is why actually I know some of my friends there said there was one department in a back in a person in a candidate's background that they would just instantly throw it away. Economics.","zh":"对的。因为如果发生这种情况，价格会以一种方式重新调整，使得它不能，你知道的，有人会进去利用它， blah, blah, blah，所有这些事情。实际上，我的对冲基金朋友会告诉你这种情况可能发生。所以，是的，这就是为什么实际上我知道一些朋友说，在一个候选人背景中有一个部门，他们会立刻把它扔掉。经济学。","start":1878.69,"end":1906.31},{"id":97,"text":"I was like, why? They said, oh, we'll take, oh, people in EE, we love it. Applied physics, oh, fantastic. Math, great. I was like, why not economics? And they said, why? They looked at me and they said, why would we hire someone who's, you know, who comes from a field where the most deeply held belief, that where the entire thing is constructed.","zh":"我当时问，为什么？他们说，哦，我们会录取，哦，电子工程的人，我们喜欢。应用物理，哦，太棒了。数学，很好。我当时问，为什么不录取经济学的？他们说，为什么？他们看着我说，为什么我们要雇佣一个来自一个领域的人，那个领域最深信不疑的信念，整个体系都是建立在那个信念上的。","start":1907.25,"end":1926.45},{"id":98,"text":"on absence of arbitrage, he said, which is precisely what we do. So that kind of, anyway, we all laughed. It was mostly a joke, but not entirely, I have to say. Sorry. Okay. No. Okay. All right. This actually finishes up like part one of the class, which is all the theory. I mean, it's already obvious that it's useful. And what we're going to do now for the next like three weeks, I think, is we're going to look at applications, you know, broadly,","zh":"在无套利的情况下，他说，这正是我们所做的。所以，这种情况下，我们大家都笑了。这主要是个玩笑，但不完全是，我必须说。抱歉。好的。不。好的。好吧，这实际上结束了课程的第一部分，也就是所有的理论。我的意思是，很明显它很有用。接下来的三周左右，我们将看看应用，你知道的，广泛地，","start":1927.02,"end":1955.8},{"id":99,"text":"grouped in and what you'll see is after a while they start all looking the same because guess what they are all the same so so but instead of doing it that way we'll have some organization and actually what you should be figuring out is just you're going to sort of just get the idea of things you can do and then you'll be doing practical problems on them and all that sort of stuff so we'll start with just approximation and fitting so we'll start with some very simple ones norm approximation says","zh":"分组在一起，你将会看到，过一会儿它们开始看起来都一样，猜猜看它们其实都是一样的，所以，而不是那样做，我们会有一些组织，实际上你应该弄清楚的是，你将大致了解你可以做的事情，然后你将在这些事情上做实际的问题，所有这些事情。我们将从近似和拟合开始，我们将从一些非常简单的开始，范数近似说","start":1957.13,"end":1985.49},{"id":100,"text":"You know, I have a matrix A and B, that's data in the problem. And you would like to choose X to minimize the norm of AX minus B, right? And I don't know, lots of ways you can think of this, right? So you could say that, for example, X star.","zh":"你知道，我有一个矩阵 A 和 B，这是问题中的数据。你想选择 X 来最小化 AX 减去 B 的范数，对吧？我不知道，你可以想出很多种方法，对吧？所以你可以比如说，X 星。","start":1986.21,"end":2005.87},{"id":101,"t detect incredibly small changes","zh":"它能够检测出磁场上极其微小的变化，","start":2060.35,"end":2063.79},{"id":109,"text":"in the magnetic field.","zh":"这些变化可能发生在地下一公里的地方，而我并不知道具体是什么。","start":2063.79,"end":2065.97},{"id":110,"text":"And this would have something to do","zh":"而这正是 X 所代表的内容。","start":2066.49,"end":2068.75},{"id":111,"text":"with what's a kilometer underground, which I don't know.","zh":"所以 A，人们称之为，","start":2069.49,"end":2072.53},{"id":112,"text":"And that's what X would be.","zh":"实际上它有非常有趣的名字。","start":2072.67,"end":2073.89},{"id":113,"text":"So A, people refer to as,","zh":"所以A，人们称之为,","start":2074.45,"end":2076.29},{"id":114,"text":"actually there's very interesting names for it.","zh":"实际上它有一个非常有趣的名称。","start":2076.41,"end":2078.69},{"id":115,"text":"One is called the model.","zh":"其中一个被称为模型。","start":2078.71,"end":2079.73},{"id":116,"text":"It's also called the forward model.","zh":"它也被称为前向模型。","start":2080.41,"end":2081.67},{"id":117,"text":"That's very interesting name for it, right?","zh":"这个名字很有趣，对吧？","start":2081.87,"end":2084.13},{"id":118,"text":"And anyway, so that's the, so the forward model usually comes from, let's say, physics, and it tells you, well, yeah, if there were these point sources here, then, and they diffused according to this model in physics, then these are the concentrations of carbon dioxide we would measure at various places.","zh":"无论如何，前向模型通常来自于，比如说，物理学，它告诉你，如果这里存在这些点源，并且它们按照物理学的这个模型进行扩散，那么我们在不同位置测得的二氧化碳浓度就是这些。","start":2085.13,"end":2102.85},{"id":119,"text":"Everybody following this? I mean, this is just kind of the basic idea of this. So that's typically called the model or the forward model or something like that.","zh":"大家都能跟上这个思路吗？我意思是，这只是一个基本的概念。所以通常称之为模型或前向模型，或者其他类似的说法。","start":2103.07,"end":2109.97},{"id":120,"text":"and then of course no one would believe y equals ax for many reasons right because there's stuff at","zh":"当然，没有人会相信 y 等于 a x，有很多原因，因为存在一些因素","start":2109.97,"end":2116.91},{"id":121,"text":"the very least you might have just sensor error like how well did you measure how well do you","zh":"至少你可能会有传感器误差，比如你测量得有多好，你测量二氧化碳有多准确","start":2116.91,"end":2121.89},{"id":122,"text":"measure carbon dioxide and you go is plus minus you know whatever you know three parts per million","zh":"你测得的二氧化碳是加上减去，你知道，比如说三百万分之一左右","start":2121.89,"end":2126.49},{"id":123,"text":"or something like that I mean the minimum right you're gonna have that they could be other stuff","zh":"或者类似的东西，我的意思是，最小值，你将会拥有这些，它们可能是其他的东西","start":2126.49,"end":2130.21},{"id":124,"text":"so that's this model and the point here is you know why you don't know X and you don't know","zh":"所以这就是这个模型，这里的要点是你知道你不知道X，你也不知道","start":2130.21,"end":2138.19},{"id":125,"text":"But someone asks you to please guess x, right? And so what this does is actually interesting. Oh, by the way, because I haven't said anything about v, like any possible value of x, any value of x is possible, right? Because then I would just change v, so to v would be y minus ax.","zh":"但有人请你猜一下x的值，对吧？而这实际上是很有趣的。顺便说一下，因为我还没有提到v，任何可能的x值，任何x值都是可能的，对吧？因为如果这样的话，我只需要改变v，所以v就是y减去ax。","start":2139.2,"end":2157.93},{"id":126,"text":"which is the residual. Actually, some people call that, it's a beautiful name. They call it the physics residual. It's a beautiful name. That's when this is kind of very, when it's a physics real thing, right? Or something like the physics residual. And then they, so you could explain everything by physics residual. So I could say, well, I took my carbon dioxide measurements and you go, cool. Where do you think the sources are? And you go, oh yeah, I think I decided there aren't any.","zh":"这就是残差。实际上，有些人称之为，它有一个美妙的名字。他们称之为物理残差。这是一个美妙的名字。当它是一种非常物理的真实事物时，对吧？或者类似物理残差的东西。然后他们，所以你可以用物理残差来解释一切。所以我可以说，好吧，我做了二氧化碳的测量，你就会说，很酷。你认为来源在哪里？你就会说，哦，是的，我想我决定没有来源。","start":2158.62,"end":2180.36},{"id":127,"text":"And you go, excuse me, we took all these measurements and we're getting all these carbon dioxide, you know, things. Like, what are you talking about? And you go, no, no, no, I'm pretty sure it's just zero. And you say, but what are all those measurements? And you go, oh, that's just measurement error. Anyway, so you see what I'm saying? So you can say anything you like. So, all right. So you need some idea of how, it means you can say, you actually kind of like weirdly legal, although it is weird, you could actually announce that it's anything you like.","zh":"然后你会说，打扰一下，我们做了所有这些测量，我们得到了所有这些二氧化碳，你知道，东西。比如，你在说什么？然后你会说，不，不，不，我相当确定它就是零。然后你会说，但是那些测量数据是什么呢？然后你会说，哦，那只是测量误差。总之，你能明白我的意思吗？所以你可以随意说任何东西。所以，好吧。所以你需要一些关于如何，这意味着你可以随意说，你实际上有点奇怪地合法，尽管它很奇怪，你实际上可以宣布它是任何你喜欢的东西。","start":2181.16,"end":2208.78}],"notes":["本段讲解了模型（forward model）和残差（residual）的概念。模型通常来源于物理，用于描述如何从源点扩散到测量点的物理过程，例如二氧化碳浓度的测量。残差则表示测量值与模型预测值之间的差异，也被称为物理残差，用于解释测量中的误差。","讲者指出，直接使用y = ax这样的模型是不可信的，因为存在传感器误差和其他因素。例如，测量误差可能达到百万分之三的水平，这表明模型需要考虑误差项v，即v = y - ax。","讲者通过一个例子说明，即使不知道X（源点分布），也可以通过残差来解释测量数据。例如，可以假设所有测量数据都是误差，从而得出X为零的结论。","讲者强调，残差的名称来源于其在物理过程中的意义，即物理残差，这有助于理解测量数据与模型预测之间的关系。","讲者指出，残差可以用来解释所有测量数据，包括误差和实际物理现象，这表明模型和残差在实际应用中具有重要的解释作用。","最后，讲者指出，虽然可以随意假设X的值，但需要有某种合理的解释，否则模型将失去意义。"],"formulas":[],"uncertainties":["the very least you might have just sensor error like how well did you measure how well do you","measure carbon dioxide and you go is plus minus you know whatever you know three parts per million","or something like that I mean the minimum right you're gonna have that they could be other stuff","so that's this model and the point here is you know why you don't know X and you don't know","But someone asks you to please guess x, right? And so what this does is actually interesting. Oh, by the way, because I haven't said anything about v, like any possible value of x, any value of x is possible, right? Because then I would just change v, so to v would be y minus ax."],"diagram":"none","start":2055.05,"end":2208.78,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":2055.05,"text":"I could fly a magnetic anomaly detector over some region,"},{"start":2060.35,"text":"which would detect incredibly small changes"},{"start":2063.79,"text":"in the magnetic field."},{"start":2066.49,"text":"And this would have something to do"},{"start":2069.49,"text":"with what's a kilometer underground, which I don't know."},{"start":2072.67,"text":"And that's what X would be."},{"start":2074.45,"text":"So A, people refer to as,"},{"start":2076.41,"text":"actually there's very interesting names for it."},{"start":2078.71,"text":"One is called the model."},{"start":2080.41,"text":"It's also called the forward model."},{"start":2081.87,"text":"That's very interesting name for it, right?"},{"start":2085.13,"text":"And anyway, so that's the, so the forward model usually comes from, let's say, physics, and it tells you, well, yeah, if there were these point sources here, then, and they diffused according to this model in physics, then these are the concentrations of carbon dioxide we would measure at various places."},{"start":2103.07,"text":"Everybody following this? I mean, this is just kind of the basic idea of this. So that's typically called the model or the forward model or something like that."},{"start":2109.97,"text":"and then of course no one would believe y equals ax for many reasons right because there's stuff at"},{"start":2116.91,"text":"the very least you might have just sensor error like how well did you measure how well do you"},{"start":2121.89,"text":"measure carbon dioxide and you go is plus minus you know whatever you know three parts per million"},{"start":2126.49,"text":"or something like that I mean the minimum right you're gonna have that they could be other stuff"},{"start":2130.21,"text":"so that's this model and the point here is you know why you don't know X and you don't know"},{"start":2139.2,"text":"But someone asks you to please guess x, right? And so what this does is actually interesting. Oh, by the way, because I haven't said anything about v, like any possible value of x, any value of x is possible, right? Because then I would just change v, so to v would be y minus ax."},{"start":2158.62,"text":"which is the residual. Actually, some people call that, it's a beautiful name. They call it the physics residual. It's a beautiful name. That's when this is kind of very, when it's a physics real thing, right? Or something like the physics residual. And then they, so you could explain everything by physics residual. So I could say, well, I took my carbon dioxide measurements and you go, cool. Where do you think the sources are? And you go, oh yeah, I think I decided there aren't any."},{"start":2181.16,"text":"And you go, excuse me, we took all these measurements and we're getting all these carbon dioxide, you know, things. Like, what are you talking about? And you go, no, no, no, I'm pretty sure it's just zero. And you say, but what are all those measurements? And you go, oh, that's just measurement error. Anyway, so you see what I'm saying? So you can say anything you like. So, all right. So you need some idea of how, it means you can say, you actually kind of like weirdly legal, although it is weird, you could actually announce that it's anything you like."}],"speech_gaps":[],"frame":"../frames/v009/013.webp","frame_time":2067.05},{"title":"范数在优化问题中的应用","segments":[{"id":128,"text":"and cover it up by presumed measurement error, right? So what you need is, you know, you need to talk about plausibility of the value V. Now, later, we'll be doing this in a statistical framework. V will have a distribution, and we'll look at something like the maximum, we'll look at maximum likelihood or something like that. But for now, we're just saying, I need some measure of plausibility of V, and the measure here is this norm.","zh":"并且通过假设的测量误差来掩盖它，对吧？所以你需要讨论的是值V的合理性。稍后，我们将在统计框架中进行这一讨论。V将具有一个分布，我们将查看类似最大值的东西，比如最大似然或其他类似的东西。但目前，我们只是说，我需要一个衡量V合理性的指标，而这里的指标就是这个范数。","start":2209.19,"end":2237.98},{"id":129,"text":"So you simply say, I don't know what the measurement error is, but my basic assumption is that this norm expresses implausibility for my measurement errors. Everybody got that? So if it's like L1, that means something. If it's L2, that means something, and so on. And that's this problem. Another one is another broad area where you get norm is optimal design. So x are design variables here.","zh":"因此，你只需说，我不知道测量误差是多少，但我的基本假设是这个范数表达了我对测量误差的不合理性。大家明白了吗？如果是L1范数，这意味着某种东西；如果是L2范数，这意味着另一种东西，依此类推。这就是这个问题。另一个例子是另一个广泛领域，你会用范数来进行最优设计。这里的x是设计变量。","start":2238.43,"end":2266.17},{"id":130,"text":"AX is a result, and then X star is the design that best approximates the desired result, but that's in this particular norm. And so the norm there says how much it irritates you to miss the target B by a certain amount.","zh":"AX是一个结果，然后X星号是最佳近似于期望结果的设计，但这是在特定的范数下。因此，这里的范数表示你偏离目标B一定量时的不愉快程度。","start":2267.61,"end":2283.77},{"id":131,"text":"Right. So so, for example, you know, here would be get me a sequence. Find me a bunch of thruster firings on a satellite. That would be X. It's a long sequence. Right. That moves you to some target place. You can't get there. And then the question is, well, if you can get there, that's great. That's kind of the solution. Right. Because norms don't get smaller than zero. But if you can't, this says, you know, what what what would make you happiest?","zh":"对。所以，例如，你知道，这里会是获取一个序列。找到一组卫星上的推进器点火。这就是X。这是一个很长的序列。对。这会将你移动到某个目标位置。你无法到达那里。然后问题是，如果你能到达那里，那就太好了。这就是一种解决方案。对。因为范数不会小于零。但如果你不能到达那里，这就意味着，你知道，什么会让你最开心？","start":2284.25,"end":2310.61},{"id":132,"text":"about missing, right? And you'd say, okay, it'll be the two norm. And that just means get me as close as possible to the point that's moving along your target trajectory. If you can't get there, minimize the number of meters from that track. Okay, everybody got that? Anyway, it's just to give you some rough ideas of where these come up. Okay, so...","zh":"关于偏离，对吧？你会说，好吧，这将是二范数。这仅仅意味着让我尽可能接近沿着目标轨迹移动的点。如果你无法到达那里，就最小化与该轨迹的距离。好的，大家明白了吗？不管怎样，这只是为了给你一些这些范数出现的粗略想法。好的，所以...","start":2312.62,"end":2333.86},{"id":133,"text":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?","zh":"我的意思是，最小二乘法，这里在座的大家应该都知道。在最小二乘法中，它是一个正态近似问题，但你通常会反射性地对范数进行平方，从而得到一个可微凸函数。你取梯度，就会得到像这样的正规方程，对吧？然后你得到一个解。这已经很古老了。当你使用无穷范数时，它被称为切比雪夫近似，这属于一个线性规划问题，或者说，人们可以把这个问题转换为一个线性规划问题，对吧？","start":2334.54,"end":2363.48},{"id":134,"text":"Yeah, you can have sum of absolute residuals. That's even got a name in certain fields. And again, that's also can be converted to an LP. By the way, people don't really need to know that now because in things like CVXPy, you just type, you literally, you just type these in. You write norm, you know, AX minus B comma one.","zh":"是的，你可以有绝对残差之和。这在某些领域甚至有一个特定的名称。同样，这也可以转换为一个线性规划问题。顺便说一句，现在人们其实不需要知道这些转换过程，因为在像CVXPy这样的工具中，你只需直接输入这些内容。你只需写下norm，比如AX减B，使用1范数。","start":2364.96,"end":2387.22}],"notes":["本段讲解了范数在优化问题中的应用，特别是如何通过范数来衡量测量误差的合理性。讲者提到，范数可以用来表达测量误差的不可信程度，例如L1范数和L2范数分别代表不同的误差处理方式。此外，还提到范数在最优设计问题中的应用，其中设计变量X需要在特定范数下逼近目标结果。","讲者通过卫星推进器点火序列的例子，说明了范数在实际问题中的应用。当无法精确到达目标点时，范数可以帮助确定最接近目标的解。例如，使用L2范数意味着尽可能接近目标轨迹，而使用无穷范数则意味着最小化与轨迹的距离。","讲者进一步解释了最小二乘法和切比雪夫逼近的区别。最小二乘法通过平方范数得到可微凸函数，从而得到正常方程。而切比雪夫逼近使用无穷范数，可以转化为线性规划问题。","讲者提到在实际编程中，如CVXPy，用户可以直接使用范数函数来实现这些优化问题，无需手动进行转换。这表明范数在实际应用中的便捷性。","讲者强调了范数在优化问题中的核心作用，即通过不同的范数选择来表达不同的优化目标。例如，L2范数适用于最小化误差平方，而L1范数适用于最小化误差绝对值。","讲者还提到，范数的选择会影响优化问题的性质，例如可微性、凸性等。这表明在实际应用中，范数的选择需要根据具体问题的需求进行调整。"],"formulas":[{"latex":"\\|AX - B\\|_2","symbols":"L2范数","explanation":"L2范数表示向量AX - B的欧几里得范数，适用于最小二乘问题，其平方可转化为凸函数，便于求解梯度。","evidence":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"},{"latex":"\\|AX - B\\|_1","symbols":"L1范数","explanation":"L1范数表示向量AX - B的绝对值之和，适用于稀疏性约束问题，其优化问题可转化为线性规划问题。","evidence":"Yeah, you can have sum of absolute residuals. That's even got a name in certain fields. And again, that's also can be converted to an LP. By the way, people don't really need to know that now because in things like CVXPy, you just type, you literally, you just type these in. You write norm, you know, AX minus B comma one."},{"latex":"\\|AX - B\\|_\\infty","symbols":"无穷范数","explanation":"无穷范数表示向量AX - B的最大绝对值分量，适用于Chebyshev逼近问题，其优化问题也可转化为线性规划问题。","evidence":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"}],"uncertainties":["在讲者提到'what what what would make you happiest?'时，可能存在重复或断句错误，但根据上下文可以理解为询问在无法到达目标时，什么情况会让用户最满意。"],"diagram":"none","start":2209.19,"end":2387.22,"asr_flags":[],"math_clarifications":["所有范数均适用于向量AX - B，且在不同范数下对应不同的优化问题，如最小二乘、L1正则化和Chebyshev逼近。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2209.19,"text":"and cover it up by presumed measurement error, right? So what you need is, you know, you need to talk about plausibility of the value V. Now, later, we'll be doing this in a statistical framework. V will have a distribution, and we'll look at something like the maximum, we'll look at maximum likelihood or something like that. But for now, we're just saying, I need some measure of plausibility of V, and the measure here is this norm."},{"start":2238.43,"text":"So you simply say, I don't know what the measurement error is, but my basic assumption is that this norm expresses implausibility for my measurement errors. Everybody got that? So if it's like L1, that means something. If it's L2, that means something, and so on. And that's this problem. Another one is another broad area where you get norm is optimal design. So x are design variables here."},{"start":2267.61,"text":"AX is a result, and then X star is the design that best approximates the desired result, but that's in this particular norm. And so the norm there says how much it irritates you to miss the target B by a certain amount."},{"start":2284.25,"text":"Right. So so, for example, you know, here would be get me a sequence. Find me a bunch of thruster firings on a satellite. That would be X. It's a long sequence. Right. That moves you to some target place. You can't get there. And then the question is, well, if you can get there, that's great. That's kind of the solution. Right. Because norms don't get smaller than zero. But if you can't, this says, you know, what what what would make you happiest?"},{"start":2312.62,"text":"about missing, right? And you'd say, okay, it'll be the two norm. And that just means get me as close as possible to the point that's moving along your target trajectory. If you can't get there, minimize the number of meters from that track. Okay, everybody got that? Anyway, it's just to give you some rough ideas of where these come up. Okay, so..."},{"start":2334.54,"text":"I mean, least squares, everybody here would know. So in least squares, it's a normal approximation problem, but then you reflexively, you square the norm, and then you get something that's differentiable convex. You take gradient, you get the normal equations like this, right? And then you get some solution. So that's quite old. When you use infinity norm, it's called Chebyshev approximation, and that's an LP, or I would say people, you can convert it to an LP, right?"},{"start":2364.96,"text":"Yeah, you can have sum of absolute residuals. That's even got a name in certain fields. And again, that's also can be converted to an LP. By the way, people don't really need to know that now because in things like CVXPy, you just type, you literally, you just type these in. You write norm, you know, AX minus B comma one."}],"speech_gaps":[],"frame":"../frames/v009/014.webp","frame_time":2221.19},{"title":"凸优化中的惩罚函数与分离性","segments":[{"id":135,"text":"That's it, right? You can just do one line solve, right? So it would be something like problem of minimize A times that norm, A times X minus B comma one. Then you have the correct number of right parentheses, right? Then you go dot solve. And I just constructed a problem and solved it in one line. Hopefully by now everybody gets what I just said. Okay?","zh":"就是这样，对吧？你只需要一行代码就能解决，对吧？所以它会像这样的问题：最小化 A 乘以这个范数，A 乘以 X 减去 B，对吧？然后你有正确数量的右括号，对吧？然后你就可以点解。我刚刚构造了一个问题并用一行代码解决了它。希望到目前为止大家都能明白我刚才说的内容。好的？","start":2387.93,"end":2417.11},{"id":136,"text":"So you don't actually need to know this, but it's not bad to know. Okay. Now we're talking about something. This is super interesting. It is super important. And don't over-interpret it. It is as simple and dumb as it sounds. Okay? So that's the... And also, it is unbelievably useful. So here's what it is. I want AX to be equal to B.","zh":"你实际上并不需要知道这些，但知道它也不坏。好的。现在我们正在谈论一些东西。这非常有趣。它非常重要。不要过度解读。它听起来简单和傻，但就是这样。好的？这也是极其有用的。所以这是什么？我想让 A X 等于 B。","start":2418.85,"end":2446.64},{"id":137,"text":"Instead of a norm, though, I'm going to have this penalty function, and it's going to be separable. Separable means it's a function is a sum of functions of the individual components. That's separable. So here it is. And then these are just functions from R to R, right? And if it's quadratic, this becomes least squares, right? If phi of u is the absolute value of u, this is L1 approximation. But now we can do cool things like, let's see, here's quadratic right here, this one. Here's a crazy one, dead zone linear.","zh":"不过，我将使用一个惩罚函数，而不是范数，而且它是可分离的。可分离意味着这是一个由各个分量的函数之和构成的函数。这就是可分离的。所以这里就是。这些只是从实数到实数的函数，对吧？如果是二次的，这就变成了最小二乘法，对吧？如果 phi(u) 是 u 的绝对值，这就是 L1 逼近。但现在我们可以做一些酷的事情，比如，这里有一个二次的，这个。这里还有一个疯狂的，死区线性。","start":2447.39,"end":2476.85},{"id":138,"text":"So these are not standard names, but anyone would get it. Dead zone means there is a zone here where you don't care, right? And then outside that zone, the penalty grows linearly, right? And here's another one, log barrier. That's this function here. It agrees really closely with a quadratic.","zh":"这些不是标准名称，但任何人都能理解。死区意味着有一个区域，你不在意，对吧？然后在该区域之外，惩罚线性增长，对吧？这里还有一个，对数障碍。这是这个函数。它在小值时与二次函数非常接近。","start":2477.39,"end":2501.41},{"id":139,"text":"for small values. But for large values, it actually starts going up and it goes all the way to infinity and outside some band, plus minus A, it's just plus infinity. So one way, the way I actually think about these is you anthropomorphize all this. And it's actually kind of correct. So what phi is telling you is phi of R tells you how irritated you are for a residual of that size.","zh":"但在大值时，它实际上开始上升，并一直趋向于无穷大，在某个带状区域外，即正负 A 之外，它就是正无穷大。所以一种思考这些函数的方式是将它们拟人化。实际上，这种方式是正确的。所以 phi 告诉你的就是 phi(R) 告诉你，对于这个大小的残差，你有多恼火。","start":2502.4,"end":2529.93},{"id":140,"text":"It's really that simple and dumb. And so, for example, if someone says, I'm doing this approximation with this penalty function, what it means is, for some reason, errors that are between plus minus A, how much do you care about them? None. Zero. You couldn't care less, right? Somebody want to give me a case where that would be completely justifiable? I mean, with a, I guess, a small A or something. Yeah.","zh":"这真的非常简单和愚蠢。例如，如果有人说，我正在用这个惩罚函数来做这个近似，这意味着，出于某种原因，误差在正负A之间时，你有多在意？一点都不在意。零。你根本不在乎，对吧？有人能给我举一个这完全合理的例子吗？我是说，可能是一个很小的A之类的。对的。","start":2531.69,"end":2563.16}],"notes":["本段主要讲解了凸优化中惩罚函数的概念，以及如何通过惩罚函数来构造优化问题。惩罚函数可以是分离的，即可以表示为各个分量函数的和。这种分离性使得问题更容易处理，例如，当惩罚函数是二次函数时，问题转化为最小二乘问题；当惩罚函数是绝对值函数时，问题转化为L1逼近问题。","讲者提到，惩罚函数可以是各种形式，如死区线性函数和对数障碍函数。死区线性函数在某个区间内不产生惩罚，而在该区间外线性增长；对数障碍函数在小值时接近二次函数，但在大值时趋向于无穷大。","惩罚函数的直观理解是，它表示对残差的“不满程度”。例如，当残差在某个区间内时，惩罚为零，表示不关心；当残差超出该区间时，惩罚线性增长，表示对误差的重视程度增加。","讲者通过一个例子说明了惩罚函数的应用场景，即当误差在某个区间内时，可以完全忽略这些误差。这种情况下，选择一个合适的惩罚函数可以有效优化问题。","讲者强调，虽然惩罚函数的概念看似简单，但其应用非常广泛且重要，特别是在实际问题中，通过选择合适的惩罚函数可以实现更优的优化结果。","讲者还提到，惩罚函数的构造需要考虑问题的具体需求，例如，选择一个合适的死区范围A，以确保在不关心的误差范围内不产生惩罚，而在需要关注的误差范围内产生适当的惩罚。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2387.93,"end":2563.16,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2387.93,"text":"That's it, right? You can just do one line solve, right? So it would be something like problem of minimize A times that norm, A times X minus B comma one. Then you have the correct number of right parentheses, right? Then you go dot solve. And I just constructed a problem and solved it in one line. Hopefully by now everybody gets what I just said. Okay?"},{"start":2418.85,"text":"So you don't actually need to know this, but it's not bad to know. Okay. Now we're talking about something. This is super interesting. It is super important. And don't over-interpret it. It is as simple and dumb as it sounds. Okay? So that's the... And also, it is unbelievably useful. So here's what it is. I want AX to be equal to B."},{"start":2447.39,"text":"Instead of a norm, though, I'm going to have this penalty function, and it's going to be separable. Separable means it's a function is a sum of functions of the individual components. That's separable. So here it is. And then these are just functions from R to R, right? And if it's quadratic, this becomes least squares, right? If phi of u is the absolute value of u, this is L1 approximation. But now we can do cool things like, let's see, here's quadratic right here, this one. Here's a crazy one, dead zone linear."},{"start":2477.39,"text":"So these are not standard names, but anyone would get it. Dead zone means there is a zone here where you don't care, right? And then outside that zone, the penalty grows linearly, right? And here's another one, log barrier. That's this function here. It agrees really closely with a quadratic."},{"start":2502.4,"text":"for small values. But for large values, it actually starts going up and it goes all the way to infinity and outside some band, plus minus A, it's just plus infinity. So one way, the way I actually think about these is you anthropomorphize all this. And it's actually kind of correct. So what phi is telling you is phi of R tells you how irritated you are for a residual of that size."},{"start":2531.69,"text":"It's really that simple and dumb. And so, for example, if someone says, I'm doing this approximation with this penalty function, what it means is, for some reason, errors that are between plus minus A, how much do you care about them? None. Zero. You couldn't care less, right? Somebody want to give me a case where that would be completely justifiable? I mean, with a, I guess, a small A or something. Yeah."}],"speech_gaps":[],"frame":"../frames/v009/015.webp","frame_time":2399.93},{"title":"测量误差与残差分析","segments":[{"id":141,"text":"What's that? You're trying to optimize for what? Okay. Yeah, let me... I didn't quite get it. I mean, here's a very simple example. You measure something, and the measurements are basically done with a 5-bit converter.","zh":"什么？你在优化什么？好吧。是的，让我……我还没完全明白。我的意思是，这里有一个非常简单的例子。你测量某个东西，而这些测量基本上是用一个5位的转换器完成的。","start":2563.76,"end":2587.72},{"id":142,"text":"And so what you get is only, there's only 32 possible values.","zh":"因此，你得到的只有32个可能的值。","start":2588.53,"end":2592.45},{"id":143,"text":"So when you get a measurement, here's what you don't, what you get.","zh":"当你得到一个测量值时，这里是你不会得到的，或者说你得到的。","start":2592.59,"end":2595.81},{"id":144,"text":"I mean, sure, I tell you the number in there.","zh":"我的意思是，当然，我会告诉你里面的数值。","start":2595.95,"end":2597.41},{"id":145,"text":"I pretend that's the number.","zh":"我假装那是数值。","start":2597.49,"end":2598.47},{"id":146,"text":"But in fact, any measurement in this little interval would have mapped to that.","zh":"但实际上，这个小区间内的任何测量值都会映射到那个数值。","start":2598.55,"end":2602.75},{"id":147,"text":"So what that says here is for the penalty.","zh":"这说明了这里的惩罚项。","start":2603.21,"end":2605.25},{"id":148,"text":"If I represent that here, someone says, why?","zh":"如果我在这里表示出来，有人会问，为什么？","start":2605.47,"end":2609.13},{"id":149,"text":"And you go, hello, it's a six bit A to D converter.","zh":"然后你就会说，你好，这是一个六位的模数转换器。","start":2609.35,"end":2612.37},{"id":150,"text":"So if I interpret any number smaller than that, or here, I'll go into dialect, smaller than my LSB of my converter, that was the least significant bit, then you say it's completely fictitious and means nothing.","zh":"所以如果我解释任何小于这个数值的数，或者在这里，我会进入方言，小于我的转换器的最低有效位，那么你就会说这是完全虚构的，没有任何意义。","start":2612.37,"end":2626.83},{"id":151,"text":"Right?","zh":"对吗？","start":2628.41,"end":2628.45},{"id":152,"text":"So that would be that.","zh":"那么这就是那个意思。","start":2628.53,"end":2629.59},{"id":153,"text":"Okay.","zh":"好的。","start":2629.83,"end":2630.09},{"id":154,"text":"Yes?","zh":"是吗？","start":2631.19,"end":2631.75},{"id":155,"text":"Up here?","zh":"在这里？","start":2634.67,"end":2635.79},{"id":156,"text":"Yeah.","zh":"是的。","start":2636.39,"end":2636.95},{"id":157,"text":"Yeah.","zh":"是的。","start":2636.99,"end":2637.49},{"id":158,"text":"Actually, there is here.","zh":"实际上，这里是有这样的情况。","start":2637.99,"end":2640.83},{"id":159,"text":"Yeah.","zh":"是的。","start":2640.95,"end":2641.33},{"id":160,"text":"Because I want to measure the residuals.","zh":"因为我想要测量残差。","start":2641.33,"end":2643.79},{"id":161,"text":"We could do the same thing with an inequality constraint here.","zh":"我们也可以在这里使用不等式约束做同样的事情。","start":2643.79,"end":2646.11},{"id":162,"text":"If you were, I mean, it's a bit stranger, but you could do that.","zh":"如果你想要这么做，虽然有点奇怪，但你也可以这样做。","start":2646.55,"end":2650.13},{"id":163,"text":"You can certainly do it with an inequality constraint as well, right?","zh":"你当然也可以使用不等式约束来做，对吧？","start":2650.19,"end":2652.71},{"id":164,"text":"If you'd say, I'd like these inequalities to hold,","zh":"如果你说，我希望这些不等式成立，","start":2652.77,"end":2654.85},{"id":165,"text":"and then you'd say, yeah, but I have weird personal opinions","zh":"然后你会说，是的，但我有一些奇怪的个人看法","start":2655.43,"end":2660.33},{"id":166,"text":"about how much it irritates me to violate inequalities,","zh":"关于违反不等式会让我多烦躁","start":2660.33,"end":2663.19},{"id":167,"text":"then it would be exactly an inequality.","zh":"那么它就会恰好成为一个不等式。","start":2663.93,"end":2665.49},{"id":168,"text":"And everything would work the same.","zh":"一切都会和之前一样运作。","start":2666.35,"end":2668.09},{"id":169,"text":"Okay.","zh":"好的。","start":2668.65,"end":2669.05},{"id":170,"text":"Okay.","zh":"好的。","start":2670.25,"end":2670.65},{"id":171,"text":"Okay, so we'll just look at a little example.","zh":"好的，我们来看一个小例子。","start":2670.65,"end":2672.77},{"id":172,"text":"Here, this is just like, this is a matrix,","zh":"这里，这只是一个矩阵，","start":2673.97,"end":2676.73},{"id":173,"text":"which is 100 high, 30 wide, so you have 30 Xs","zh":"这高度是100，宽度是30，因此你有30个X","start":2676.83,"end":2679.83},{"id":174,"text":"and 100, basically, equations, right?","zh":"并且基本上有100个方程，对吧？","start":2679.83,"end":2683.05},{"id":175,"text":"Generate completely randomly, so this is just, yeah.","zh":"完全随机生成，所以这就是，没错。","start":2684.01,"end":2686.41},{"id":176,"text":"But this'll tell you a lot.","zh":"但这会告诉你很多信息。","start":2686.51,"end":2688.05},{"id":177,"text":"So let's start with least squares. That's here. So if you do least squares, and then you look at the residual, the distribution of residuals, right? Then, you know, you see something reasonable, right? This shows you the penalty. This shows you how much it irritated you to have a residual at that level. And what you can see is, you know, this is obvious for a quadratic, you know, around in here, it's really small. Why? Because if, well, for a quadratic,","zh":"那么我们从最小二乘法开始。这就是这里。如果你进行最小二乘法，然后观察残差，残差的分布，对吧？然后，你会看到一些合理的结果，对吧？这展示了惩罚。这展示了你拥有这样一个残差水平时有多困扰。你可以看到，对于二次函数来说，这显然是很明显的，你知道，在这里附近，残差真的很小。为什么？因为，如果，对于二次函数来说，","start":2689.13,"end":2715.91}],"notes":["本段讨论了测量误差与残差分析，特别是使用有限精度的A/D转换器时的量化误差。讲者通过一个5位转换器的例子说明，测量值只能取32个可能的值，因此任何落在最小有效位（LSB）范围内的测量值都会被当作虚构值处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2563.76,"end":2715.91,"asr_flags":[151],"translation_complete":true,"translated_segments":37,"raw_segments":[{"start":2563.76,"text":"What's that? You're trying to optimize for what? Okay. Yeah, let me... I didn't quite get it. I mean, here's a very simple example. You measure something, and the measurements are basically done with a 5-bit converter."},{"start":2588.53,"text":"And so what you get is only, there's only 32 possible values."},{"start":2592.59,"text":"So when you get a measurement, here's what you don't, what you get."},{"start":2595.95,"text":"I mean, sure, I tell you the number in there."},{"start":2597.49,"text":"I pretend that's the number."},{"start":2598.55,"text":"But in fact, any measurement in this little interval would have mapped to that."},{"start":2603.21,"text":"So what that says here is for the penalty."},{"start":2605.47,"text":"If I represent that here, someone says, why?"},{"start":2609.35,"text":"And you go, hello, it's a six bit A to D converter."},{"start":2612.37,"text":"So if I interpret any number smaller than that, or here, I'll go into dialect, smaller than my LSB of my converter, that was the least significant bit, then you say it's completely fictitious and means nothing."},{"start":2628.41,"text":"Right?"},{"start":2628.53,"text":"So that would be that."},{"start":2629.83,"text":"Okay."},{"start":2631.19,"text":"Yes?"},{"start":2634.67,"text":"Up here?"},{"start":2636.39,"text":"Yeah."},{"start":2636.99,"text":"Yeah."},{"start":2637.99,"text":"Actually, there is here."},{"start":2640.95,"text":"Yeah."},{"start":2641.33,"text":"Because I want to measure the residuals."},{"start":2643.79,"text":"We could do the same thing with an inequality constraint here."},{"start":2646.55,"text":"If you were, I mean, it's a bit stranger, but you could do that."},{"start":2650.19,"text":"You can certainly do it with an inequality constraint as well, right?"},{"start":2652.77,"text":"If you'd say, I'd like these inequalities to hold,"},{"start":2655.43,"text":"and then you'd say, yeah, but I have weird personal opinions"},{"start":2660.33,"text":"about how much it irritates me to violate inequalities,"},{"start":2663.93,"text":"then it would be exactly an inequality."},{"start":2666.35,"text":"And everything would work the same."},{"start":2668.65,"text":"Okay."},{"start":2670.25,"text":"Okay."},{"start":2670.65,"text":"Okay, so we'll just look at a little example."},{"start":2673.97,"text":"Here, this is just like, this is a matrix,"},{"start":2676.83,"text":"which is 100 high, 30 wide, so you have 30 Xs"},{"start":2679.83,"text":"and 100, basically, equations, right?"},{"start":2684.01,"text":"Generate completely randomly, so this is just, yeah."},{"start":2686.51,"text":"But this'll tell you a lot."},{"start":2689.13,"text":"So let's start with least squares. That's here. So if you do least squares, and then you look at the residual, the distribution of residuals, right? Then, you know, you see something reasonable, right? This shows you the penalty. This shows you how much it irritated you to have a residual at that level. And what you can see is, you know, this is obvious for a quadratic, you know, around in here, it's really small. Why? Because if, well, for a quadratic,"}],"speech_gaps":[],"frame":"../frames/v009/016.webp","frame_time":2575.76},{"title":"残差与优化方法的类比","segments":[{"id":178,"text":"If an error, if a residual is small, the quadratic charges you small squared. And small squared is like very small. In fact, some people even use the language where very small means, actually literally means small squared. Very, very small means small cubed and whatever, you know, something like that. And incredibly small indeed means something like the fourth power or something. That would be the analog of like jerk. And what's one up from jerk?","zh":"如果存在误差，如果残差很小，二次项会对你收取很小的平方值。而小平方值就像是非常小。事实上，有些人甚至会用这样的语言，其中非常小实际上字面意思就是小平方值。非常、非常小意味着小立方值，或者类似的东西，你知道的，像这样。而极其小确实意味着像四次方这样的东西。这相当于类似加速度的概念。那么，加速度之上是什么呢？","start":2716.74,"end":2744.91},{"id":179,"text":"What is that? Snap. There you go. Okay, fine. So, okay. And you can see what happens. And, you know, you can even go back and say, like, ooh, you had some big residuals here. Right? In fact, we can even anthropomorphize it and say, like, ooh, that one really hurt because look at the height of this thing compared to, like, over here. Right? Okay. So, this is least squares traditional thing. For fun, let's see. Oh, let's look at log barrier next. For log barrier,","zh":"这是什么？抖动。就是这样。好的，明白了。那么，你可以看到会发生什么。你知道的，你甚至可以回过头来说，哦，这里有一些大的残差。对吧？事实上，我们甚至可以拟人化地说，哦，那个真的很痛，你看这个东西的高度和这里相比。对吧？好的。所以，这就是传统最小二乘法的东西。为了好玩，让我们看看。哦，让我们看看对数障碍函数。对于对数障碍函数，","start":2746.23,"end":2773.49},{"id":180,"text":"This thing actually matches that almost exactly for small residuals. But what happens with log barrier is as your residuals get bigger and bigger, unlike least squares, you start getting, you get more and more upset compared to least squares.","zh":"这个函数实际上在残差很小的时候几乎完全匹配。但是，当残差变得越来越大时，与最小二乘法不同，你会开始变得越来越不满，相对于最小二乘法来说。","start":2774.94,"end":2790.31},{"id":181,"text":"because the log barrier is bigger than the square function, right? And so what happens is you can see it, by the way, all residuals were between plus and minus one. It had to be, otherwise you'd get infinity. Actually, the problem would be infeasible at that point, right? But the points are all between there and there. And you can almost say something like, well, this is least squares, but I put a big old, I put a clamp on it and tighten the clamp so that all the residuals have to be between plus and minus one. Everybody.","zh":"因为对数障碍函数比平方函数更大，对吧？所以会发生的是，你可以看到，所有残差都在正负一之间。否则你会得到无穷大。实际上，在那个点上，问题将是不可行的，对吧？但这些点都在那里和那里之间。你可以几乎说，好吧，这是最小二乘法，但我给它加了一个很大的钳制，收紧这个钳制，使得所有残差都必须在正负一之间。每个人。","start":2791.02,"end":2815.62},{"id":182,"text":"But there's nothing deep here, so don't over-interpret. Dead zone linear is really cool. Let's take a look at that. So dead zone linear is kind of interesting because, first of all, what you did is you told the, let's say the solver or whatever, that once a residual is between plus and minus a half, yeah, plus and minus a half, you couldn't care less at all. If you're outside, you care.","zh":"但这里并没有什么深奥的东西，所以不要过度解读。死区线性函数真的很酷。让我们看看这个。死区线性函数有点有趣，因为首先，你所做的就是告诉求解器或者其他什么，一旦残差在正负一半之间，是的，正负一半，你完全不关心。如果在外部，你就会关心。","start":2817.0,"end":2845.49},{"id":183,"text":"But in fact, it's going up linearly. And we'll talk about that in a minute. And so, not surprisingly, look at the residuals you get. And somebody give me some English to explain, to anthropomorphize this and say, why do you get a whole bunch of things shoved right up against these two boundaries? Somebody want to... I mean, you can't be wrong. We're just talking and anthropomorphizing it, right? So, what would you say?","zh":"但实际上，它是在线性上升的。我们稍后会详细讨论这一点。因此，不出所料，看看你得到的残差。有人能用英语来解释一下，把这种情况拟人化地说，为什么你会得到一堆东西紧挨着这两个边界？有人想……我是说，你不可能错。我们只是在进行拟人化的讨论，对吧？那么，你会怎么解释呢？","start":2846.25,"end":2873.57},{"id":184,"text":"Why is it? What's that? There's no benefits. Yeah, that's right. He'd say, well, you know, what it did was it shoved, it shoved a whole bunch of residuals down to the boundary of where you don't care. And why should it expend any effort to make it smaller? That's perfect. Perfect. Everybody got that?","zh":"为什么会这样？这是什么？没有任何好处。没错，他会说，你知道吗，它所做的就是把一堆残差推到了你不关心的边界上。为什么还要费力让它们变得更小呢？这已经完美了。完美了。大家明白了吗？","start":2875.22,"end":2891.4}],"notes":["本段讨论了残差在优化问题中的作用，特别是最小二乘法和对数障碍法的对比。讲者用类比的方式解释了残差的大小如何影响优化过程，例如将残差的平方、立方等与物理中的加速度、急动度等概念进行类比。","讲者提到，当残差较大时，对数障碍法会比最小二乘法更加敏感，因为对数障碍函数的增长速度比平方函数更快。这导致在残差较大时，对数障碍法会更强烈地惩罚残差，从而影响优化结果。","讲者还提到，当所有残差都被限制在±1之间时，对数障碍法实际上相当于对最小二乘法施加了一个限制，使得残差不能超过这个范围。这种限制类似于在优化过程中加入一个“钳位”机制。","在讨论“死区线性”方法时，讲者指出，当残差在±0.5范围内时，优化器不会对残差进行任何处理，只有当残差超出这个范围时，才会进行调整。这种机制类似于在优化过程中设置一个“死区”，即对残差的某些范围不进行惩罚。","讲者进一步解释了为什么残差会被“推”到边界上，即当残差在死区范围内时，优化器不会对其进行任何调整，因此残差会停留在边界上。这种现象是由于优化器在死区范围内不进行任何操作，从而导致残差无法进一步减小。","讲者强调，这些概念虽然有趣，但并不涉及深层次的理论，因此不应过度解读。他鼓励学生通过类比和直观理解来掌握这些优化方法的基本思想。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2716.74,"end":2891.4,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2716.74,"text":"If an error, if a residual is small, the quadratic charges you small squared. And small squared is like very small. In fact, some people even use the language where very small means, actually literally means small squared. Very, very small means small cubed and whatever, you know, something like that. And incredibly small indeed means something like the fourth power or something. That would be the analog of like jerk. And what's one up from jerk?"},{"start":2746.23,"text":"What is that? Snap. There you go. Okay, fine. So, okay. And you can see what happens. And, you know, you can even go back and say, like, ooh, you had some big residuals here. Right? In fact, we can even anthropomorphize it and say, like, ooh, that one really hurt because look at the height of this thing compared to, like, over here. Right? Okay. So, this is least squares traditional thing. For fun, let's see. Oh, let's look at log barrier next. For log barrier,"},{"start":2774.94,"text":"This thing actually matches that almost exactly for small residuals. But what happens with log barrier is as your residuals get bigger and bigger, unlike least squares, you start getting, you get more and more upset compared to least squares."},{"start":2791.02,"text":"because the log barrier is bigger than the square function, right? And so what happens is you can see it, by the way, all residuals were between plus and minus one. It had to be, otherwise you'd get infinity. Actually, the problem would be infeasible at that point, right? But the points are all between there and there. And you can almost say something like, well, this is least squares, but I put a big old, I put a clamp on it and tighten the clamp so that all the residuals have to be between plus and minus one. Everybody."},{"start":2817.0,"text":"But there's nothing deep here, so don't over-interpret. Dead zone linear is really cool. Let's take a look at that. So dead zone linear is kind of interesting because, first of all, what you did is you told the, let's say the solver or whatever, that once a residual is between plus and minus a half, yeah, plus and minus a half, you couldn't care less at all. If you're outside, you care."},{"start":2846.25,"text":"But in fact, it's going up linearly. And we'll talk about that in a minute. And so, not surprisingly, look at the residuals you get. And somebody give me some English to explain, to anthropomorphize this and say, why do you get a whole bunch of things shoved right up against these two boundaries? Somebody want to... I mean, you can't be wrong. We're just talking and anthropomorphizing it, right? So, what would you say?"},{"start":2875.22,"text":"Why is it? What's that? There's no benefits. Yeah, that's right. He'd say, well, you know, what it did was it shoved, it shoved a whole bunch of residuals down to the boundary of where you don't care. And why should it expend any effort to make it smaller? That's perfect. Perfect. Everybody got that?"}],"speech_gaps":[],"frame":"../frames/v009/017.webp","frame_time":2728.74},{"title":"惩罚函数的性质与L1和L2范数的对比","segments":[{"id":185,"text":"So, okay, it's kind of cool. Oh, and I'd say, hey, look at this. You've got a bigger, you have a couple of bigger residuals than the square. I mean, this is hard to see on the scale, but we'll get to that. Let's go to the L1 one. This is L1. Anybody notice anything on the L1 thing? I mean, this is kind of an obvious thing. A whole bunch of the residuals are zero. Not a whole bunch, like 35 or something, 30 or something like that. Okay, everybody got it?","zh":"所以，好吧，这有点酷。哦，还有，我想说，嘿，看看这个。你有一些比平方更大的残差，我意思是，这在比例上很难看出来，但我们会说到这一点。让我们看看L1的情况。这是L1。有人注意到L1有什么特别的地方吗？我意思是，这有点显而易见。有很多残差是零。不是很多，比如35或者30左右。好吧，大家明白了吗？","start":2892.22,"end":2920.97},{"id":186,"text":"To anthropomorphize that, we would go like this. Let's consider the square function, the square penalty and the absolute value penalty for small residuals, right? When you have a square penalty and a residual becomes small, you start caring about it a lot less because the amount you care about it is small squared. Everybody got it? Okay. For an absolute value,","zh":"如果我们拟人化这一点，我们会这样想。让我们考虑平方函数、平方惩罚和绝对值惩罚在小残差的情况，对吧？当你有一个平方惩罚，而残差变得很小时，你会开始不太在意它，因为你在意的程度是这个残差的平方。大家明白了吗？好吧。对于绝对值惩罚，","start":2922.95,"end":2946.84},{"id":187,"text":"what happens is the marginal amount by which you care about reducing a residual keeps up until you hit zero. So in least squares, the difference between having a residual of 9 and a residual of 10 is big. And the difference between having a residual of 1 and 2 is a lot less. Everybody got it? You just square those numbers and you figure it out, right? For an absolute value,","zh":"情况是，你减少残差的边际改善程度会一直保持，直到残差变为零。所以在最小二乘法中，残差为9和残差为10之间的差异很大，而残差为1和2之间的差异则小得多。大家明白了吗？你只需要将这些数字平方然后计算，对吧？对于绝对值惩罚，","start":2947.53,"end":2976.51},{"id":188,"text":"the difference between having a residual of 9 and a residual of 10 is identical to the difference between having a residual of 1 and 2. Everybody got that? So I'm just, this is completely just, I'm just saying that it, and so, so that's actually one interesting thing you'll see about a penalty function. If a penalty function has a sharp point, then you're actually, you will expect","zh":"残差为9和残差为10之间的差异与残差为1和2之间的差异是相同的。大家明白了吗？所以，我只是在说，这完全是一个有趣的现象，你会在惩罚函数中看到。如果一个惩罚函数有一个尖点，那么你实际上会期望","start":2977.64,"end":2999.66},{"id":189,"text":"actually, the solution to have lots of zeros. And someone would say, why? There's lots of ways to see this, right? And in other contexts, like in compressed sensing and all this kind of stuff, people can construct incredibly complicated theories about this. But the point is, it's just because the marginal improvement of making a residual smaller, if we anthropomorphize the whole thing, basically keeps up until it's zero.","zh":"解决方案中有很多零。有人会问，为什么？有很多方法可以解释这一点，对吧？在其他情境中，比如压缩感知之类的内容，人们可以构建极其复杂的理论来解释这一点。但重点是，这仅仅是因为，如果我们拟人化整个过程，减少残差的边际改善程度会一直保持，直到残差变为零。","start":3000.57,"end":3025.41},{"id":190,"text":"By the way, the opposite is like a square is kind of chill. It's like once it gets small, it's small squared. You still care, but you care a lot less. Everybody got that? And then dead zone linear, extreme. It's like, nope, actually, once you get in this band, couldn't care less. Everybody got that? So that's what the qualities of a penalty function near zero matter, right? At the other end, we look at the qualities of a penalty function for large things, because that tells you...","zh":"顺便说一下，相反的情况就像一个正方形，它有点随和。一旦它变得很小，它就是平方后的很小。你仍然在意，但在意的程度要少很多。大家明白吗？然后是死区线性，极端的情况。就像，不，实际上，一旦你进入这个区间，就完全不在意了。大家明白吗？所以这就是惩罚函数在零附近性质的重要性，对吧？在另一端，我们则关注惩罚函数在大值时的性质，因为这能告诉你……","start":3026.8,"end":3055.13}],"notes":["本段讨论了惩罚函数在零点附近的性质，特别是L1和L2范数在处理残差时的不同行为。L1惩罚函数在残差接近零时，其边际改善保持不变，直到残差为零，这导致了大量残差为零的解。而L2惩罚函数在残差较小时，其边际改善迅速下降，因此对小残差的敏感度较低。","讲者通过拟人化的方式解释了惩罚函数的行为，将残差的处理比作对残差的关心程度。对于L2惩罚函数，当残差变小时，关心程度迅速下降，因为其平方值的增加幅度较小。而对于L1惩罚函数，关心程度在残差接近零时保持不变，直到残差为零。","讲者指出，L1惩罚函数的这种特性使得其解中出现大量零残差，这是其在压缩感知等应用中的重要特性。这种行为源于L1惩罚函数在零点附近具有尖点，导致其对残差的边际改善保持不变。","讲者还提到，L2惩罚函数在残差较大时的行为，即其对残差的敏感度随着残差的增大而增加。这种行为与L1惩罚函数形成对比，L1惩罚函数在残差较大时对残差的敏感度保持不变，直到残差进入某个区间后变得不敏感。","讲者强调，惩罚函数在零点附近的性质和在大残差时的性质都对优化问题的解有重要影响。零点附近的性质决定了解中零残差的数量，而大残差时的性质决定了惩罚函数对残差的敏感度。","讲者通过拟人化的比喻，帮助学生理解惩罚函数的行为，这种教学方式有助于学生直观地理解不同惩罚函数的特性及其对优化问题的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2892.22,"end":3055.13,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2892.22,"text":"So, okay, it's kind of cool. Oh, and I'd say, hey, look at this. You've got a bigger, you have a couple of bigger residuals than the square. I mean, this is hard to see on the scale, but we'll get to that. Let's go to the L1 one. This is L1. Anybody notice anything on the L1 thing? I mean, this is kind of an obvious thing. A whole bunch of the residuals are zero. Not a whole bunch, like 35 or something, 30 or something like that. Okay, everybody got it?"},{"start":2922.95,"text":"To anthropomorphize that, we would go like this. Let's consider the square function, the square penalty and the absolute value penalty for small residuals, right? When you have a square penalty and a residual becomes small, you start caring about it a lot less because the amount you care about it is small squared. Everybody got it? Okay. For an absolute value,"},{"start":2947.53,"text":"what happens is the marginal amount by which you care about reducing a residual keeps up until you hit zero. So in least squares, the difference between having a residual of 9 and a residual of 10 is big. And the difference between having a residual of 1 and 2 is a lot less. Everybody got it? You just square those numbers and you figure it out, right? For an absolute value,"},{"start":2977.64,"text":"the difference between having a residual of 9 and a residual of 10 is identical to the difference between having a residual of 1 and 2. Everybody got that? So I'm just, this is completely just, I'm just saying that it, and so, so that's actually one interesting thing you'll see about a penalty function. If a penalty function has a sharp point, then you're actually, you will expect"},{"start":3000.57,"text":"actually, the solution to have lots of zeros. And someone would say, why? There's lots of ways to see this, right? And in other contexts, like in compressed sensing and all this kind of stuff, people can construct incredibly complicated theories about this. But the point is, it's just because the marginal improvement of making a residual smaller, if we anthropomorphize the whole thing, basically keeps up until it's zero."},{"start":3026.8,"text":"By the way, the opposite is like a square is kind of chill. It's like once it gets small, it's small squared. You still care, but you care a lot less. Everybody got that? And then dead zone linear, extreme. It's like, nope, actually, once you get in this band, couldn't care less. Everybody got that? So that's what the qualities of a penalty function near zero matter, right? At the other end, we look at the qualities of a penalty function for large things, because that tells you..."}],"speech_gaps":[],"frame":"../frames/v009/018.webp","frame_time":2904.22},{"title":"残差惩罚函数与鲁棒估计","segments":[{"id":191,"text":"Again, to anthropomorphize this. Well, okay, this is not it. I was anthropomorphizing the solution method, but here. What that tells you is this. When things grow linearly, that says you're more chill about having a couple of big residuals. Right, because if I had a residual of like 10 and I'm doing square, that's like, it's a big thing. If you have a residual.","zh":"再次，为了拟人化这一点。嗯，好吧，这并不是这样。我是在拟人化求解方法，但在这里。这告诉你的意思是，当事物以线性方式增长时，这意味着你对有几个较大的残差更加宽容。对吧，因为如果我有一个残差为10，而我使用的是平方，那就会是一个大问题。如果你有一个残差。","start":3055.47,"end":3083.51},{"id":192,"text":"that, you know, but for an absolute value, that doesn't bother you as much. Everybody got this, right? So, okay. So that's going to shape, and that's going to come up as a theme. We'll see it's going to end up with what's so-called robust estimators that we'll see. Yeah.","zh":"那，你知道的，但对于绝对值来说，这不会让你太困扰。大家都明白这一点，对吧？所以，这将形成一种形状，并且这将成为一个主题。我们会看到，最终会得到所谓的鲁棒估计器，我们会看到。是的。","start":3084.35,"end":3098.17},{"id":193,"text":"for p equals 2 and log barriers still be a little more concentrated around 0 because there's still some increasing penalty as you go away from 0, right? Yeah. Yeah, so the question is, why didn't these concentrate closer? Yeah. It's an interesting question. I can assure you that these are the solutions, right? And this is just literally randomly chosen data. Actually, what it tells you is this is the best it can do.","zh":"对于p等于2和对数障碍，仍然会更集中在0附近，因为即使远离0，仍然存在一些增加的惩罚，对吧？是的。是的，问题是，为什么这些没有更集中？是的。这是一个有趣的问题。我可以向你保证，这些就是解，对吧？而且这仅仅是随机选择的数据。实际上，这告诉你的就是它能做到的最好结果。","start":3099.87,"end":3128.93},{"id":194,"text":"That would be my best answer to that. But certainly, I can tell you this, if it could have concentrated them closer together, it would have. How about that? Yeah, it's a good question. Okay, so let me ask a couple of questions just for, and then you tell me what would happen if I told you that my penalty function is this. Here's my penalty function. There it is. Everybody got it?","zh":"这就是我对这个问题的最佳回答。但当然，我可以告诉你，如果它能够将它们更集中，它就会这么做。怎么样？是的，这是一个好问题。好的，让我问几个问题，然后你告诉我，如果我告诉你我的惩罚函数是这个，会发生什么。这是我的惩罚函数。就是这样。大家都明白了吗？","start":3129.56,"end":3159.16},{"id":195,"text":"And I want you to tell me in words what it means. What do you care about? What bothers you about residuals? Right? So somebody explain it. What does it mean? Yeah, go ahead. Bias towards underestimating? Exactly, right? So what this says is that this says...","zh":"我想让你用语言告诉我这意味着什么。你关心什么？什么会困扰你？对吧？有人来解释一下。这意味着什么？是的，继续。偏向于低估？正是如此，对吧？所以这说明的是，这说明的是……","start":3159.69,"end":3180.46},{"id":196,"text":"That you Yeah, that that it's gonna irritate you positive residuals irritate you. I don't know I'm gonna eyeball it four times more than negative residuals Right. So by the way, you won't be surprised this function is going to make an appearance when you do quantile estimation But nevertheless, you might some of you but maybe already know that but that's it. Okay, cool Let me let's go the other way around. What have I told you that? Look residuals between plus and minus a half","zh":"你会被正的残差所困扰。我不知道，我会粗略地估计，正的残差会比负的残差困扰你四倍。对吧。顺便说一句，你不会对这个函数在进行分位数估计时出现感到惊讶。但无论如何，你们中的一些人可能已经知道这一点，但这就是全部。好的，很酷。让我换个方向。我告诉过你什么？看看残差在正负0.5之间","start":3181.33,"end":3210.35},{"id":197,"text":"I couldn't care less. It's like our measurements are not even that good. That's fine. And then you say, do you have a preference between being less than minus a half and more than a half? And they go, yeah, I really don't want my residuals to be more than a half. Somebody suggest a penalty function. Go ahead, suggest a penalty function for that.","zh":"我一点都不在乎。我们的测量结果甚至都不那么好。这也没关系。然后你问，你是否更倾向于残差小于负半还是大于半？他们回答，是的，我真的不希望我的残差超过半。有人建议一个惩罚函数。请继续，为这种情况建议一个惩罚函数。","start":3211.08,"end":3234.14}],"notes":["本段讨论了残差惩罚函数在不同范数下的表现，特别是平方损失和绝对值损失对残差的敏感性差异。当残差线性增长时，对较大的残差容忍度更高，这说明在某些情况下，模型对残差的惩罚较弱。这种差异导致了不同估计方法的鲁棒性差异，例如鲁棒估计器的出现。","讲者提到，当残差在±0.5之间时，对残差的容忍度较高，但超过这个范围则会引发更大的惩罚。这表明惩罚函数的设计需要根据实际问题的容忍度进行调整，以达到最佳的估计效果。","讲者通过提问引导学生思考惩罚函数的设计，强调了惩罚函数在优化问题中的核心作用。不同的惩罚函数会导致不同的优化结果，因此选择合适的惩罚函数是构建鲁棒估计器的关键。","讲者通过类比和提问的方式，帮助学生理解惩罚函数的含义和作用，强调了在优化问题中，惩罚函数的选择对最终结果的影响。"],"formulas":[],"uncertainties":["I'm gonna eyeball it four times more than negative residuals"],"diagram":"none","start":3055.47,"end":3234.14,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3055.47,"text":"Again, to anthropomorphize this. Well, okay, this is not it. I was anthropomorphizing the solution method, but here. What that tells you is this. When things grow linearly, that says you're more chill about having a couple of big residuals. Right, because if I had a residual of like 10 and I'm doing square, that's like, it's a big thing. If you have a residual."},{"start":3084.35,"text":"that, you know, but for an absolute value, that doesn't bother you as much. Everybody got this, right? So, okay. So that's going to shape, and that's going to come up as a theme. We'll see it's going to end up with what's so-called robust estimators that we'll see. Yeah."},{"start":3099.87,"text":"for p equals 2 and log barriers still be a little more concentrated around 0 because there's still some increasing penalty as you go away from 0, right? Yeah. Yeah, so the question is, why didn't these concentrate closer? Yeah. It's an interesting question. I can assure you that these are the solutions, right? And this is just literally randomly chosen data. Actually, what it tells you is this is the best it can do."},{"start":3129.56,"text":"That would be my best answer to that. But certainly, I can tell you this, if it could have concentrated them closer together, it would have. How about that? Yeah, it's a good question. Okay, so let me ask a couple of questions just for, and then you tell me what would happen if I told you that my penalty function is this. Here's my penalty function. There it is. Everybody got it?"},{"start":3159.69,"text":"And I want you to tell me in words what it means. What do you care about? What bothers you about residuals? Right? So somebody explain it. What does it mean? Yeah, go ahead. Bias towards underestimating? Exactly, right? So what this says is that this says..."},{"start":3181.33,"text":"That you Yeah, that that it's gonna irritate you positive residuals irritate you. I don't know I'm gonna eyeball it four times more than negative residuals Right. So by the way, you won't be surprised this function is going to make an appearance when you do quantile estimation But nevertheless, you might some of you but maybe already know that but that's it. Okay, cool Let me let's go the other way around. What have I told you that? Look residuals between plus and minus a half"},{"start":3211.08,"text":"I couldn't care less. It's like our measurements are not even that good. That's fine. And then you say, do you have a preference between being less than minus a half and more than a half? And they go, yeah, I really don't want my residuals to be more than a half. Somebody suggest a penalty function. Go ahead, suggest a penalty function for that."}],"speech_gaps":[],"frame":"../frames/v009/019.webp","frame_time":3067.47},{"title":"凸优化中的分段线性惩罚函数与Huber惩罚","segments":[{"id":198,"text":"Same thing, but with a dead zone? Yeah, so we put, we say, it's just flat zero in here. And then this grows steeply, and this grows like that. There you go. Okay? So, all right, and that's, so if you encountered a problem where that was your preference, now you know what to do. And you just literally, you type that in, that's two lines. I could make it one, but the point is it doesn't matter. Right? Everybody got this? So, and what if you said, you know what?","zh":"同样的情况，但有一个死区？是的，所以我们说，在这个区域内，它就是零。然后，这部分会陡峭地增长，就像这样。明白了？好的，那么，如果你遇到一个问题，其中你有这样的偏好，现在你知道该怎么做。你只需要直接输入，这就是两行。我可以把它合并成一行，但重点是这并不重要。对吧？大家都明白了吗？那么，如果有人说，你知道吗？","start":3236.62,"end":3265.11},{"id":199,"text":"Suppose I said, you know what? It's okay. I care less if the residuals are less than minus half. But actually, when they start getting really negative, that irritates me more. What would you do then? Yeah, you just put some curvature on this guy. You just have it go like that. At some point, these are getting weird. But anyway. Everybody got this? Yeah.","zh":"假设我说，你知道吗？如果残差小于负半值，我不太在意。但实际上，当它们变得非常负时，这让我更恼火。那么你会怎么做呢？是的，你只需要在这个函数上添加一些曲率。你只需要让它像这样增长。在某个时候，这些值会变得奇怪。但不管怎样。大家都明白了吗？是的。","start":3267.32,"end":3294.25},{"id":200,"text":"You can absolutely have a piecewise linear penalty function. Absolutely. That's not at all uncommon. Actually, that's a very common model of fuel usage. So it comes up right there. This brings us to an interesting one. It's something everyone should know about. Because this is like...","zh":"你完全可以有一个分段线性惩罚函数。当然可以。这并不罕见。实际上，这在燃料使用模型中非常常见。所以它就在这里出现。这引出了一个有趣的问题。这是每个人都应该知道的。因为这就像……","start":3296.0,"end":3322.38},{"id":201,"text":"I'd even put something like this in the top 10 for the things you should walk away from this class from, is the so-called Huber penalty. So here it is. It's quadratic up to a threshold m. Above that, it grows linearly. And so what happens is here's a...","zh":"我甚至会把这个放在你从这门课中应该带走的前10个内容中，这就是所谓的Huber惩罚。所以这里它就是。在阈值m以下它是二次的，超过这个阈值后，它线性增长。因此，这里会发生的是，这里有一个……","start":3322.86,"end":3346.23},{"id":202,"text":"Here's Huber and right here one it transitions to linear. So it's got linear tails here now the quadratic would keep going up here and it would be start getting really like at 1.5 It'd be 2.25. It'd be up here, right? So so quadrat and then What does it mean? So somebody you know? Anthropomorphize this if some someone says what are you doing? You say I'm doing regression. What penalty you're using Huber","zh":"这里是Huber惩罚，这里它过渡到线性。现在它有线性尾部，而二次项会继续增长，这里会变得非常大。例如，在1.5时，它会是2.25，会在这里。对吧？所以二次项和……这有什么意义呢？有人知道吗？你可以把这人性化一点。如果有人问你在做什么，你说我在做回归。你在使用什么惩罚？Huber","start":3347.02,"end":3371.57},{"id":203,"text":"Somebody explain what it means about how you feel about residuals in your regression model What does it mean? Like just just just in words. I don't want no math What would you say? Yeah, you say look I want to do least squares, you know I kind of want to do least squares But you know what if if there has to be a big residual I'm way more chill than if I was doing","zh":"有人解释一下这对你回归模型中的残差意味着什么。这有什么意义？用简单的语言说说。我不想要数学公式。你会怎么说？是的，你会说，我想做最小二乘法，你知道的，我某种程度上想做最小二乘法。但你知道吗，如果必须存在一个大的残差，我比做……","start":3372.56,"end":3404.6}],"notes":["本段讲解了分段线性惩罚函数的概念，特别是Huber惩罚函数。Huber惩罚函数在阈值以下采用二次形式，以上采用线性形式，这种设计使得它在处理异常值时比标准的最小二乘法更鲁棒。","讲者通过类比的方式解释了Huber惩罚函数的意义，即在回归模型中，对于较大的残差，惩罚函数的敏感度降低，从而使得模型对异常值的反应更温和。","讲者强调了Huber惩罚函数在实际应用中的重要性，特别是在处理具有异常值的数据集时，它是一种非常常见的模型。","讲者提到，Huber惩罚函数是本课程中应该掌握的重要概念之一，甚至可以排进前10名的课程重点。","讲者通过提问的方式引导学生思考如何解释Huber惩罚函数在回归模型中的意义，强调了理解惩罚函数背后直觉的重要性。","讲者指出，Huber惩罚函数的结构使得它在处理残差较大时，不会像最小二乘法那样对异常值过于敏感，从而提高了模型的鲁棒性。"],"formulas":[],"uncertainties":["quadrat and then What does it mean? So somebody you know? Anthropomorphize this if some someone says what are you doing? You say I'm doing regression. What penalty you're using Huber","Somebody explain what it means about how you feel about residuals in your regression model What does it mean? Like just just just in words. I don't want no math What would you say? Yeah, you say look I want to do least squares, you know I kind of want to do least squares But you know what if if there has to be a big residual I'm way more chill than if I was doing"],"diagram":"none","start":3236.62,"end":3404.6,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3236.62,"text":"Same thing, but with a dead zone? Yeah, so we put, we say, it's just flat zero in here. And then this grows steeply, and this grows like that. There you go. Okay? So, all right, and that's, so if you encountered a problem where that was your preference, now you know what to do. And you just literally, you type that in, that's two lines. I could make it one, but the point is it doesn't matter. Right? Everybody got this? So, and what if you said, you know what?"},{"start":3267.32,"text":"Suppose I said, you know what? It's okay. I care less if the residuals are less than minus half. But actually, when they start getting really negative, that irritates me more. What would you do then? Yeah, you just put some curvature on this guy. You just have it go like that. At some point, these are getting weird. But anyway. Everybody got this? Yeah."},{"start":3296.0,"text":"You can absolutely have a piecewise linear penalty function. Absolutely. That's not at all uncommon. Actually, that's a very common model of fuel usage. So it comes up right there. This brings us to an interesting one. It's something everyone should know about. Because this is like..."},{"start":3322.86,"text":"I'd even put something like this in the top 10 for the things you should walk away from this class from, is the so-called Huber penalty. So here it is. It's quadratic up to a threshold m. Above that, it grows linearly. And so what happens is here's a..."},{"start":3347.02,"text":"Here's Huber and right here one it transitions to linear So it's got linear tails here now the quadratic would keep going up here and it would be start getting really like at 1.5 It'd be 2.25. It'd be up here, right? So so quadrat and then What does it mean? So somebody you know? Anthropomorphize this if some someone says what are you doing? You say I'm doing regression. What penalty you're using Huber"},{"start":3372.56,"text":"Somebody explain what it means about how you feel about residuals in your regression model What does it mean? Like just just just in words. I don't want no math What would you say? Yeah, you say look I want to do least squares, you know I kind of want to do least squares But you know what if if there has to be a big residual I'm way more chill than if I was doing"}],"speech_gaps":[],"frame":"../frames/v009/020.webp","frame_time":3248.62},{"title":"最小二乘与鲁棒估计","segments":[{"id":204,"text":"least squares. And so this is kind of, so these, the fact that these tails here grow linearly means, in fact, in statistics it's called a robust, it's a robust penalty, right? So it's a robust estimator, right? So, okay, everybody, okay. So it's very innocent. It's just, it works, you know, I guess.","zh":"最小二乘。所以，这些尾部线性增长的事实，在统计学中被称为一种鲁棒性惩罚，对吧？因此，它是一种鲁棒估计量，对吧？好的，大家，好的。所以它非常简单。它只是有效，你知道的，我想是这样。","start":3405.31,"end":3424.73},{"id":205,"text":"We'll look at an example, and this is a baby example just to understand it, but so here We're literally doing what you know regression from high school, so here's a bunch of points here What you might not see us as a point there, and there's a point there Okay And if you do the least squares fit you get this dashed line Okay, and actually somebody explained that to me. Why would that be the the regression fit?","zh":"我们将看一个例子，这是一个简单的例子，只是为了理解。但在这里，我们实际上是在做你们高中时学过的回归分析，所以这里有一堆点。你可能不会把这些点看作一个点，还有一个点在那里。好的，如果你做最小二乘拟合，你会得到这条虚线。好的，实际上有人向我解释过，为什么这会是回归拟合？","start":3425.55,"end":3454.29},{"id":206,"text":"to those 42 points. These 40 points and these two weird ones out here. Like, what happened? The squared residual is very large for those two points, so it tries to minimize them. Right, so what it did was, for these two points, the squared residual was way big, and that, we can anthropomorphize it, and said that that put very strong incentive to change the fit.","zh":"对于这42个点。这些40个点和这两个奇怪的点在这里。比如，发生了什么？这两个点的平方残差非常大，因此它试图最小化它们。对吧？所以它所做的，就是对于这两个点，平方残差非常大，我们可以拟人化地说，这给了很强的激励去改变拟合。","start":3454.76,"end":3478.81},{"id":207,"text":"to reduce those two gigantic residuals, okay? And the result is it got torqued this way. Actually, we can give a beautiful mechanical interpretation, right? So again, if you don't mind, I'll, if you don't, anyone could know this kind of mechanical engineering, very simple. What you do is you make your penalty the potential of a spring.","zh":"为了减少这两个巨大的残差，对吧？结果是它被扭曲成这样。实际上，我们可以给出一个优美的机械解释，对吧？所以再次，如果你不介意，我会，如果你不介意，任何人都可能知道这种机械工程，非常简单。你所做的就是让惩罚成为弹簧的势能。","start":3479.37,"end":3499.63},{"id":208,"text":"So a quadratic is what's called a hook spring. So you pull it out some amount of distance. Actually, it's a symmetric spring. You can pull it to the left, pull it to the right, and the potential energy is going to be the square of the displacement. Everybody got that? So what you should do is imagine this thing with wires on it and vertical springs that attach to it, and it's in mechanical equilibrium.","zh":"所以二次函数被称为钩形弹簧。你把它拉出一定的距离。实际上，这是一个对称的弹簧。你可以把它向左拉，也可以向右拉，势能将是位移的平方。大家明白了吗？所以你应该想象这个东西上有电线，垂直的弹簧连接到它，它处于机械平衡状态。","start":3500.24,"end":3523.28},{"id":209,"text":"in least squares, that would be this. And someone would say, whoa, how did it get torqued out there? And you go, you just said it. That's exactly what happened. There's a giant torque on that thing. Why? Because this is a spring. You imagine a spring here pulling this, and it's pulling it up. And there's a spring over here, and it's pulling it down. Everybody got it? Right? And you say, yeah, there's a bunch of stuff in here, but those are just little displacements. They're putting a few newtons here and there on it. Okay? Now let's talk about Huber.","zh":"在最小二乘法中，这就是这种情况。有人会说，哇，怎么会有那么大的扭矩？你会回答，你刚刚就是这么说的。这就是发生的情况。这个物体上有一个巨大的扭矩。为什么？因为这是一个弹簧。你可以想象这里有一个弹簧在拉这个物体，把它向上拉。而另一边还有一个弹簧，它在向下拉。大家明白了吗？对吧？你说，是的，这里面有很多东西，但那些只是微小的位移。它们只是在物体上施加了几牛顿的力。明白了吗？现在我们来谈谈Huber。","start":3524.24,"end":3552.78},{"id":210,"text":"And let's do the mechanical interpretation. Mechanical interpretation is a super interesting spring. It's a spring where you expand it and the energy goes up quadratically. But then you hit a point. And after that, the energy grows linearly. And what that means is a constant force. Everybody got that? And so what happens here is that these springs are putting a force on this. But once you hit the boundary, it's a constant force.","zh":"现在我们来进行机械解释。机械解释是一个非常有趣的弹簧。这是一个当你拉伸它时，能量以二次方增长的弹簧。但之后你达到一个临界点，之后能量以线性方式增长。这意味着一个恒定的力。大家明白了吗？因此，这里的情况是这些弹簧对这个物体施加力。但一旦你达到边界，施加的力就变成恒定的。","start":3553.28,"end":3580.96}],"notes":["本段讲解了最小二乘法的基本概念，并通过一个简单的例子来说明其工作原理。讲者提到，最小二乘法在统计学中被称为鲁棒惩罚，因为它对异常值具有一定的鲁棒性。讲者还通过一个机械模型来解释最小二乘法的原理，将残差视为弹簧的势能，从而形象地展示了最小二乘法如何通过最小化残差来找到最佳拟合线。","讲者通过一个具体的例子来说明最小二乘法如何处理异常值。他提到，当存在两个异常点时，这些点的残差会非常大，从而对拟合线产生强烈的拉力，导致拟合线发生扭曲。这种扭曲可以通过机械模型来解释，即弹簧的势能随着位移的增加而增加，从而产生力矩。","讲者进一步解释了最小二乘法的机械模型，将残差视为弹簧的势能，并指出在最小二乘法中，弹簧的势能是位移的平方。这种模型帮助理解最小二乘法如何通过平衡各个点的力来找到最佳拟合线。","讲者提到，当存在异常值时，最小二乘法可能会受到较大影响，因此需要考虑其他方法，如Huber损失函数。他通过一个机械模型来解释Huber损失函数，指出在某个阈值之后，损失函数的增长速度会变慢，从而减少异常值对拟合结果的影响。","讲者强调了最小二乘法的直观性和实用性，并指出其在处理异常值时的局限性。他通过机械模型和实际例子来说明最小二乘法的工作原理，并指出在实际应用中可能需要考虑其他方法来提高鲁棒性。","讲者通过机械模型和实际例子，帮助学生理解最小二乘法的基本原理和局限性。他指出，最小二乘法在处理异常值时可能会受到较大影响，因此需要考虑其他方法，如Huber损失函数，以提高模型的鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3405.31,"end":3580.96,"asr_flags":[],"math_clarifications":["所有公式均未提供完整数学表达式，仅提供了符号名称，因此无法进行数学核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3405.31,"text":"least squares. And so this is kind of, so these, the fact that these tails here grow linearly means, in fact, in statistics it's called a robust, it's a robust penalty, right? So it's a robust estimator, right? So, okay, everybody, okay. So it's very innocent. It's just, it works, you know, I guess."},{"start":3425.55,"text":"We'll look at an example, and this is a baby example just to understand it, but so here We're literally doing what you know regression from high school, so here's a bunch of points here What you might not see us as a point there, and there's a point there Okay And if you do the least squares fit you get this dashed line Okay, and actually somebody explained that to me. Why would that be the the regression fit?"},{"start":3454.76,"text":"to those 42 points. These 40 points and these two weird ones out here. Like, what happened? The squared residual is very large for those two points, so it tries to minimize them. Right, so what it did was, for these two points, the squared residual was way big, and that, we can anthropomorphize it, and said that that put very strong incentive to change the fit."},{"start":3479.37,"text":"to reduce those two gigantic residuals, okay? And the result is it got torqued this way. Actually, we can give a beautiful mechanical interpretation, right? So again, if you don't mind, I'll, if you don't, anyone could know this kind of mechanical engineering, very simple. What you do is you make your penalty the potential of a spring."},{"start":3500.24,"text":"So a quadratic is what's called a hook spring. So you pull it out some amount of distance. Actually, it's a symmetric spring. You can pull it to the left, pull it to the right, and the potential energy is going to be the square of the displacement. Everybody got that? So what you should do is imagine this thing with wires on it and vertical springs that attach to it, and it's in mechanical equilibrium."},{"start":3524.24,"text":"in least squares, that would be this. And someone would say, whoa, how did it get torqued out there? And you
