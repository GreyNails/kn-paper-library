 go, you just said it. That's exactly what happened. There's a giant torque on that thing. Why? Because this is a spring. You imagine a spring here pulling this, and it's pulling it up. And there's a spring over here, and it's pulling it down. Everybody got it? Right? And you say, yeah, there's a bunch of stuff in here, but those are just little displacements. They're putting a few newtons here and there on it. Okay? Now let's talk about Huber."},{"start":3553.28,"text":"And let's do the mechanical interpretation. Mechanical interpretation is a super interesting spring. It's a spring where you expand it and the energy goes up quadratically. But then you hit a point. And after that, the energy grows linearly. And what that means is a constant force. Everybody got that? And so what happens here is that these springs are putting a force on this. But once you hit the boundary, it's a constant force."}],"speech_gaps":[],"frame":"../frames/v009/021.webp","frame_time":3417.31},{"title":"Huber 函数与凸优化应用","segments":[{"id":211,"text":"not one that continues to increase. So again, if that helped you, fine. If it didn't, just completely ignore it, that interpretation. Everybody got this? So what's obvious here, I mean, this is like idiotic with points in R, you just plot things and whatever. In fact, for these things, you just draw a line through it. It doesn't matter, right? What I can tell you is this works, you get the same thing in cases where it's not remotely obvious.","zh":"这不是一个持续增加的函数。所以再次，如果这对你有帮助，那很好。如果没有帮助，就完全忽略这个解释。大家明白了吗？所以这里很明显，我指的是在实数空间中的点，你只需要画图，不管怎样。事实上，对于这些情况，你只需要画一条线穿过它。这并不重要，对吧？我可以告诉你们的是，这种方法有效，在那些看起来根本不明显的案例中，你也会得到同样的结果。","start":3581.87,"end":3609.03},{"id":212,"text":"Pretty much most times people are fitting data. It should probably be done with Huber, not least squares. So just pretty much, okay? In fact, there are stunning examples of how well it just powers through outliers, right? So there's examples where 20, 30% of your data points are just crazy outliers. And this thing just works. Everybody got this? So it's very cool. Okay, so.","zh":"基本上，大多数时候人们是在拟合数据。这应该用Huber函数来做，而不仅仅是最小二乘法。所以基本上，好吧？事实上，有很多令人惊叹的例子说明它如何有效地处理异常值，对吧？例如，你的数据点中有20%、30%都是异常值，但这个方法依然有效。大家明白了吗？所以这非常酷。好的，那么。","start":3610.72,"end":3639.5},{"id":213,"text":"And it's named after Peter Huber, a statistician who came up with the function, but reasoning from first principles about unknown distributions and blah, blah, blah. But anyway, so our amateur interpretation is simply that he's using a penalty that matches least squares for small things, but then grows much more gently for large.","zh":"它以Peter Huber命名，他是一位统计学家，提出了这个函数，但他的推理是从第一性原理出发，针对未知分布等等。不过不管怎样，我们业余的解释是，他使用了一个惩罚函数，对于小的值与最小二乘法一致，但对于大的值则增长得更加平缓。","start":3640.11,"end":3665.32},{"id":214,"text":"residuals and another way to say it is it's cooler it's let it doesn't go crazy if there's a large residual trying to reduce it and then you get that kind of arrow this sorry this torque on on this thing okay everybody got that okay um we'll look at least norm problems so least norm problems are are similar right uh oh i should mention every time i we look at these things we look at simple versions but here are some things you know now um we could do","zh":"残差，另一种说法是，它更冷静，它不会因为存在大的残差而变得疯狂，试图减少它，然后你就会得到这种箭头，这种扭矩作用在这个东西上，好的，大家明白了吗？好的，那么我们将看一下最小范数问题。最小范数问题与这些类似，对吧？哦，我应该每次提到这些内容时都提到，我们总是看简单版本，但这里有一些事情你们现在应该知道，嗯，我们可以在这些地方做。","start":3666.04,"end":3694.27},{"id":215,"text":"You know, we could do here. Go back to this and do norm approximation. We can add convex constraints and everything is cool. So, for example, you could do, you know, Huber monotonic regression. How about that? It's probably five papers on that. OK, so someone tell me what is Huber monotonic regression?","zh":"你们知道，我们可以在这些地方做。回到这里，进行范数逼近。我们可以添加凸约束，一切都很棒。例如，你们可以做Huber单调回归。怎么样？这可能已经有五篇论文了。好的，那么有人告诉我什么是Huber单调回归？","start":3695.04,"end":3713.2},{"id":216,"text":"What would it mean? You just do regression. You use a Huber penalty, number one. And then the other thing is you add the constraints, which is x1 is less than x2 is less than x3 is less. Everybody got that? Okay. That is almost certainly super useful in some application. Everybody got it? And so we would, you can anthropomorphize that and everything. So what would, we would, well, yeah. How would we say it?","zh":"这意味着什么？你只需要做回归。你使用一个Huber惩罚项，这是第一点。然后另一件事是你添加约束条件，即x1小于x2小于x3小于……大家明白了吗？好的。这在某些应用中几乎肯定非常有用。大家明白了吗？所以我们可以把它人性化地理解。那么，我们会怎么说呢？","start":3717.38,"end":3742.58},{"id":217,"text":"You just say, it's nothing. It's a cute piece or something, right? It's just nothing. We know how to solve that, right? And then they would say, oh, I know a very fancy algorithm for solving. You just say, stop. Stop right there. Just don't say anything else because you're just embarrassing yourself, right?","zh":"你只需要说，这没什么。这只是一个可爱的小片段，对吧？这没什么。我们知道如何解决这个问题，对吧？然后他们会说，哦，我知道一个非常复杂的算法来解决。你只需要说，停。立刻停下来。不要再说了，因为你在让自己丢脸，对吧？","start":3743.72,"end":3761.0}],"notes":["本段主要讲解了Huber函数的特性，即它在处理异常值时比最小二乘法更稳健。Huber函数在小残差时与最小二乘法一致，而在大残差时增长更平缓，从而避免了异常值对模型的影响。课堂中提到，即使在数据中存在20%到30%的异常值时，Huber函数也能有效工作。","接着，课程介绍了Huber单调回归的概念，这是一种结合Huber惩罚和单调性约束的回归方法。这种技术在实际应用中非常有用，尤其是在需要保证输出变量单调递增或递减的场景中。","课堂中还提到，虽然Huber单调回归可能涉及复杂的算法，但其核心思想是通过添加约束条件来实现单调性，而这些约束条件可以被看作是对模型行为的一种自然描述。","最后，讲者强调了在讨论这类优化问题时，应避免过度复杂化，保持问题的简洁性。这表明在实际应用中，应优先考虑简单且有效的解决方案，而不是追求复杂的算法。"],"formulas":[],"uncertainties":["residuals and another way to say it is it's cooler it's let it doesn't go crazy if there's a large residual trying to reduce it and then you get that kind of arrow this sorry this torque on on this thing"],"diagram":"none","start":3581.87,"end":3761.0,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3581.87,"text":"not one that continues to increase. So again, if that helped you, fine. If it didn't, just completely ignore it, that interpretation. Everybody got this? So what's obvious here, I mean, this is like idiotic with points in R, you just plot things and whatever. In fact, for these things, you just draw a line through it. It doesn't matter, right? What I can tell you is this works, you get the same thing in cases where it's not remotely obvious."},{"start":3610.72,"text":"Pretty much most times people are fitting data. It should probably be done with Huber, not least squares. So just pretty much, okay? In fact, there are stunning examples of how well it just powers through outliers, right? So there's examples where 20, 30% of your data points are just crazy outliers. And this thing just works. Everybody got this? So it's very cool. Okay, so."},{"start":3640.11,"text":"And it's named after Peter Huber, a statistician who came up with the function, but reasoning from first principles about unknown distributions and blah, blah, blah. But anyway, so our amateur interpretation is simply that he's using a penalty that matches least squares for small things, but then grows much more gently for large."},{"start":3666.04,"text":"residuals and another way to say it is it it's cooler it's let it doesn't go crazy if there's a large residual trying to reduce it and then you get that kind of arrow this sorry this torque on on this thing okay everybody got that okay um we'll look at least norm problems so least norm problems are are similar right uh oh i should mention every time i we look at these things we look at simple versions but here are some things you know now um we could do"},{"start":3695.04,"text":"You know, we could do here. Go back to this and do norm approximation. We can add convex constraints and everything is cool. So, for example, you could do, you know, Huber monotonic regression. How about that? It's probably five papers on that. OK, so someone tell me what is Huber monotonic regression?"},{"start":3717.38,"text":"What would it mean? You just do regression. You use a Huber penalty, number one. And then the other thing is you add the constraints, which is x1 is less than x2 is less than x3 is less. Everybody got that? Okay. That is almost certainly super useful in some application. Everybody got it? And so we would, you can anthropomorphize that and everything. So what would, we would, well, yeah. How would we say it?"},{"start":3743.72,"text":"You just say, it's nothing. It's a cute piece or something, right? It's just nothing. We know how to solve that, right? And then they would say, oh, I know a very fancy algorithm for solving. You just say, stop. Stop right there. Just don't say anything else because you're just embarrassing yourself, right?"}],"speech_gaps":[],"frame":"../frames/v009/022.webp","frame_time":3593.87},{"title":"最小范数问题与最小二乘法","segments":[{"id":218,"text":"We know 50 ways to solve it, and all of them are better than yours. So anyway, just leave it that way. Okay. All right. So I'm not saying stuff like that. So you can complicate these things as much as you like, or you could add non-negative. Okay, blah, blah, blah. Okay, fine. So let's go here. Least norm problems. Here, you're minimizing a norm subject to AX equals B. I mean, you know, it's the projection of the solution set of AX equals B onto the origin.","zh":"我们知道有50种方法可以解决这个问题，而且所有这些方法都比你的更好。所以不管怎样，就这样吧。好的。那么我不会说这样的话。你可以尽可能复杂地处理这些问题，或者你可以添加非负性。好的，啰嗦，啰嗦。好的，行吧。那么我们来看最小范数问题。在这里，你是在约束条件AX等于B的情况下最小化一个范数。我的意思是，你知道的，这是将AX等于B的解集投影到原点上。","start":3761.47,"end":3789.47},{"id":219,"text":"Right, and if you want to project it onto some other thing, yeah, go ahead and put an x minus and then some target. Right, in estimation this says I have perfect measurements or really really good measurements but I don't have enough of them and so in that case you'd say well yeah no I I actually I have temperature sensors on on on that you know on that chip and you say and what's your you know how good are they and you go oh they're fine more than we need","zh":"对的，如果你想将其投影到其他某个东西上，是的，你可以继续，然后加上一个x减去某个目标。对的，在估计中，这意味着我有完美的测量值或者非常非常好的测量值，但我没有足够的测量值，所以在这种情况下，你会说，嗯，其实我实际上在芯片上安装了温度传感器，你会问，你的传感器怎么样，你会说，它们很好，比我们需要的还要好。","start":3789.96,"end":3819.34},{"id":220,"text":"And you'd say, well, then what's the problem? And you'd say, well, the problem is I'd like to know what is the temperature at other points on the chip where I'm not measuring it. Everybody following this? That's the problem. And that's the case where A is, X is going to be the temperature at all the points. AX equals B is going to be telling you that these are the measurements you would get at those points. This agrees with your measurements, but you don't have enough to determine X. And so the question is, what's X?","zh":"你会说，那么问题是什么呢？你会说，问题是我想知道芯片上其他未测量点的温度是多少。大家明白这一点吗？这就是问题。这就是A的情况，X将是芯片上所有点的温度。AX等于B将告诉你在这些点上你会得到什么样的测量值。这与你的测量值一致，但你没有足够的测量值来确定X。因此，问题是，X是什么？","start":3819.77,"end":3848.29},{"id":221,"text":"And so then you'd say, well, I need a measure of plausibility. And the measure of plausibility here is that the norm of x is small, right? Then that's estimation. And in design, this would be, these would, you'd think of these as disconstraints, right, or requirements. And then you want to minimize the norm of this. So classic one is, for example,","zh":"因此，你会说，我需要一个可信度的度量。在这里，可信度的度量是x的范数较小，对吧？这就是估计。在设计中，这将被视为这些是约束条件，对吧，或者要求。然后你想要最小化这个范数的值。一个经典的例子是，例如，","start":3848.92,"end":3870.68},{"id":222,"text":"minimum fuel uh you know motion from one from one one place to another right so move my satellite backwards supposed to be minimize the fuel that perfect example right um or i don't know could be all sorts of other stuff anyway that's it everybody got this so that these are the these are examples of just you know high level least norm problems and","zh":"最小燃料，你知道的，从一个地方移动到另一个地方，对吧，所以把我的卫星向后移动，应该最小化燃料，这是完美的例子，对吧，或者我不知道还可能有各种其他东西，不管怎样，就是这样，大家明白这一点吗？这些都是高层面的最小范数问题的例子。","start":3871.3,"end":3893.78},{"id":223,"text":"Least squares, again, it's something you know. You can do sum of absolute values. As I've mentioned several times, that's an elementary model of fuel use in some cases. You can also do a least penalty problem like this, which is really cool. So you'd say, here's my penalty. That would actually be super useful because you'd actually go and ask somebody, tell me about your thrusters. And they would say, oh, whoa, they're super sophisticated. And they'd give you a.","zh":"最小二乘法，再次强调，这你已经知道了。你可以进行绝对值之和的计算。正如我多次提到的，这在某些情况下是燃料使用的基本模型。你也可以进行这样的最小惩罚问题，这真的很棒。所以你会说，这是我的惩罚函数。这实际上会非常有用，因为你会去问别人，告诉我你的推进器的情况。他们可能会说，哦，天哪，它们非常复杂。然后他们会给你一个。","start":3894.63,"end":3922.55}],"notes":["本段讲授了最小范数问题的基本概念，即在满足约束条件 AX = B 的前提下，最小化向量 x 的范数。这相当于将解集投影到原点，用于估计未知变量。例如，当温度传感器无法覆盖整个芯片时，通过最小化范数来估计未测量点的温度。","讲者通过温度传感器的例子说明了最小范数问题的实际应用场景。当测量数据不足时，需要通过最小化范数来推断未知变量，这体现了最小范数问题在估计和设计中的应用。","讲者提到最小范数问题在设计中的应用，如最小化燃料消耗，这表明最小范数问题可以用于优化设计，通过引入约束条件来满足特定要求。","讲者还提到最小二乘法和绝对值求和作为不同的范数模型，说明了不同范数在实际问题中的应用，如燃料使用建模。","讲者提到最小惩罚问题，强调了在实际应用中，根据系统特性（如推进器的复杂性）选择合适的惩罚函数的重要性，这体现了最小范数问题的灵活性。","讲者通过多个例子说明了最小范数问题的广泛适用性，包括温度估计、卫星运动控制等，展示了其在不同领域的应用价值。"],"formulas":[{"latex":"\\|x\\|","symbols":"向量x的范数","explanation":"保持原样，范数符号正确，无需修改。","evidence":"And you'd say, well, then what's the problem? And you'd say, well, the problem is I'd like to know what is the temperature at other points on the chip where I'm not measuring it. Everybody following this? That's the problem. And that's the case where A is, X is going to be the temperature at all the points. AX equals B is going to be telling you that these are the measurements you would get at those points. This agrees with your measurements, but you don't have enough to determine X. And so the question is, what's X?"},{"latex":"AX = B","symbols":"约束条件","explanation":"保持原样，约束条件正确，无需修改。","evidence":"And you'd say, well, then what's the problem? And you'd say, well, the problem is I'd like to know what is the temperature at other points on the chip where I'm not measuring it. Everybody following this? That's the problem. And that's the case where A is, X is going to be the temperature at all the points. AX equals B is going to be telling you that these are the measurements you would get at those poin nd what's your you know how good are they and you go oh they're fine more than we need"},{"start":3819.77,"text":"And you'd say, well, then what's the problem? And you'd say, well, the problem is I'd like to know what is the temperature at other points on the chip where I'm not measuring it. Everybody following this? That's the problem. And that's the case where A is, X is going to be the temperature at all the points. AX equals B is going to be telling you that these are the measurements you would get at those points. This agrees with your measurements, but you don't have enough to determine X. And so the question is, what's X?"},{"start":3848.92,"text":"And so then you'd say, well, I need a measure of plausibility. And the measure of plausibility here is that the norm of x is small, right? Then that's estimation. And in design, this would be, these would, you'd think of these as disconstraints, right, or requirements. And then you want to minimize the norm of this. So classic one is, for example,"},{"start":3871.3,"text":"minimum fuel uh you know motion from one from one one place to another right so move my satellite backwards supposed to be minimize the fuel that perfect example right um or i don't know could be all sorts of other stuff anyway that's it everybody got this so that these are the these are examples of just you know high level least norm problems and"},{"start":3894.63,"text":"Least squares, again, it's something you know. You can do sum of absolute values. As I've mentioned several times, that's an elementary model of fuel use in some cases. You can also do a least penalty problem like this, which is really cool. So you'd say, here's my penalty. That would actually be super useful because you'd actually go and ask somebody, tell me about your thrusters. And they would say, oh, whoa, they're super sophisticated. And they'd give you a."}],"speech_gaps":[],"frame":"../frames/v009/023.webp","frame_time":3773.47},{"title":"凸优化中的多目标问题与正则化","segments":[{"id":224,"text":"booklet this thing. You can just read this and you'll understand it. It depends on the fuel and blah, blah. I go on and on. Very sophisticated, right? And then you'd say, well, to produce a certain number of newtons, what's your fuel use, right? And then they would say, oh, yeah, no, there's a whole sequence of papers on that. It'd be unbelievably complicated. I wouldn't understand any of it, I think. But at the end of the day, you'd say, can you draw me a picture, right? And it would almost certainly be convex, right? And that would be your penalty. And then you'd say,","zh":"这本小册子，你可以直接读，就能理解。它取决于燃料和 blah, blah。我喋喋不休地说个不停。非常复杂，对吧？然后你会说，为了产生一定数量的新顿，你的燃料消耗是多少，对吧？然后他们会说，哦，是的，不，关于这个问题有一系列论文。这会令人难以置信地复杂。我想我不会理解任何内容。但最后你会说，你能给我画个图吗，对吧？它几乎肯定是一个凸函数，对吧？这就是你的惩罚项。然后你会说，","start":3922.97,"end":3949.53},{"id":225,"text":"Then when you do this, you're actually literally doing, you're doing something very close to actual minimum fuel trajectory design or something like that. Everybody got this? So that's the picture. Okay. Now you can do regularized approximation. And these are ideas we're going to see in lots of other contexts, like statistical and others, right? But for now...","zh":"当你这样做时，你实际上是在做非常接近实际最小燃料轨迹设计的事情，或者类似的事情。大家明白了吗？这就是这张图。好的。现在你可以进行正则化近似。这些是我们将在许多其他情境中看到的想法，比如统计学和其他领域，对吧？但目前……","start":3950.03,"end":3974.79},{"id":226,"text":"So here you have a bi-criterion problem. So if you like, it's a vector optimization problem. If you want to be pedantic about it, you could say with over the cone r plus squared or something, right? And so that looks like this. You'd say, you know, I really want ax minus b to be small, but I also want x to be small. So that's what this says. And, you know, and...","zh":"所以这里你有一个双目标问题。如果你喜欢，它是一个向量优化问题。如果你要严格一点，可以说是在锥 r 加上平方的域上，对吧？所以看起来像这样。你会说，你知道的，我真的很希望 ax 减 b 很小，但我也希望 x 很小。这就是这个说法。而且，你知道的，而且……","start":3975.48,"end":3998.34},{"id":227,"text":"So estimation is, I mean, we'll get into a lot of this later. But that could be you have a linear measurement model, y equals ax plus v. And you could say, yeah, the noise here, I mean, my prior is that it's small. So it's small in this norm. These could even be different norms, by the way. In fact, they often are in applications, right? Then you'd say, oh, yeah, but I also have a prior that x is small. And then that would be this part here.","zh":"估计，我的意思是，我们之后会深入讨论很多内容。但这也可能是你有一个线性测量模型，y 等于 ax 加上 v。你可以说，是的，这里的噪声，我的先验是它很小。它在这个范数下很小。顺便说一句，这些甚至可以是不同的范数。事实上，在应用中它们经常是不同的，对吧？然后你会说，哦，是的，但我还有一个先验，x 很小。然后这就是这部分内容。","start":3999.87,"end":4026.37},{"id":228,"text":"Yeah, so here, for example, if we were going to, not socially non-positive, but suppose I was going to, you know, work on, control a missile heading towards a target. And someone would say, well, what do you, what this thing is going to be at the end.","zh":"是的，例如，如果我们打算，不社会上非积极的，但假设我要，你知道的，控制一枚导弹飞向目标。有人会说，好吧，你，这个东西最后会是什么样子。","start":4029.34,"end":4047.77},{"id":229,"text":"how close you are to the target right and so i'd say how does that work and they go well uh okay it wouldn't you know depends right now they're shape charges and things get like insane but let's ignore that and you just say well my kill probability this would be the things they would say depends on the inverse square of the distance from the target and blah blah blah this would be old school non-shaped charges right and that would tell you that this should be a two norm in r3 right it it's how how close do you get","zh":"你离目标有多近，所以我想问这怎么运作，他们说嗯，好吧，这取决于现在，它们是形状装药，事情会变得非常疯狂，但让我们忽略这一点，你只需说，我的杀伤概率，这会是他们所说的，取决于与目标的距离的倒数平方，等等，这会是旧式的非形状装药，这会告诉你，这应该是在R³中的二范数，对吧，它是如何接近目标的","start":4048.33,"end":4076.85},{"id":230,"text":"And then the norm here could be something else. By the way, that would be a really good use for a penalty right there. As long as we're on a socially non-positive topic. So here's one. Ready? You'd say...","zh":"这里的范数可以是其他东西。顺便说一句，这在惩罚方面是一个非常好的用例。只要我们还处于社会上非正向的话题上。所以这里有一个例子。准备好了吗？你会说……","start":4078.25,"end":4094.57}],"notes":["本段讨论了凸优化在实际问题中的应用，例如导弹控制问题。讲者提到，当需要最小化燃料使用时，问题可能非常复杂，但可以通过凸性来简化。凸性在这里作为惩罚项，帮助找到最优解。","讲者进一步说明了多目标优化问题，即同时最小化多个目标函数。这可以视为向量优化问题，其中需要在多个目标之间进行权衡。讲者提到，可以通过在优化问题中引入正则化项来处理这种多目标问题。","在正则化问题中，讲者提到线性测量模型 y = ax + v，并指出噪声的先验假设是其在某种范数下较小。这表明在优化问题中，可以将先验知识作为约束条件，从而改进估计结果。","讲者以导弹控制为例，说明了如何通过距离的平方反比关系来选择合适的范数。这表明在实际问题中，选择合适的范数对于优化问题的求解至关重要。","讲者还提到，范数的选择可以根据具体问题进行调整，这为实际应用提供了灵活性。同时，讲者指出，正则化项在优化问题中可以起到惩罚作用，帮助找到更优的解。","最后，讲者提到，这些概念将在后续课程中进一步展开，特别是在统计学和其他领域中。这表明凸优化的多目标问题和正则化方法具有广泛的应用前景。"],"formulas":[{"latex":"y = a x + v","symbols":"y 是测量值，a 是系数，x 是未知变量，v 是噪声","explanation":"公式正确，符合线性测量模型的描述，其中 y 是测量值，a 是系数，x 是未知变量，v 是噪声。","evidence":"So estimation is, I mean, we'll get into a lot of this later. But that could be you have a linear measurement model, y equals ax plus v. And you could say, yeah, the noise here, I mean, my prior is that it's small. So it's small in this norm. These could even be different norms, by the way. In fact, they often are in applications, right? Then you'd say, oh, yeah, but I also have a prior that x is small. And then that would be this part here."}],"uncertainties":["cone r plus squared","how how close do you get"],"diagram":"none","start":3922.97,"end":4094.57,"asr_flags":[],"math_clarifications":["公式 y = ax + v 是一个标准的线性测量模型，其中 a 是系数，x 是未知变量，v 是噪声。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3922.97,"text":"booklet this thing. You can just read this and you'll understand it. It depends on the fuel and blah, blah. I go on and on. Very sophisticated, right? And then you'd say, well, to produce a certain number of newtons, what's your fuel use, right? And then they would say, oh, yeah, no, there's a whole sequence of papers on that. It'd be unbelievably complicated. I wouldn't understand any of it, I think. But at the end of the day, you'd say, can you draw me a picture, right? And it would almost certainly be convex, right? And that would be your penalty. And then you'd say,"},{"start":3950.03,"text":"Then when you do this, you're actually literally doing, you're doing something very close to actual minimum fuel trajectory design or something like that. Everybody got this? So that's the picture. Okay. Now you can do regularized approximation. And these are ideas we're going to see in lots of other contexts, like statistical and others, right? But for now..."},{"start":3975.48,"text":"So here you have a bi-criterion problem. So if you like, it's a vector optimization problem. If you want to be pedantic about it, you could say with over the cone r plus squared or something, right? And so that looks like this. You'd say, you know, I really want ax minus b to be small, but I also want x to be small. So that's what this says. And, you know, and..."},{"start":3999.87,"text":"So estimation is, I mean, we'll get into a lot of this later. But that could be you have a linear measurement model, y equals ax plus v. And you could say, yeah, the noise here, I mean, my prior is that it's small. So it's small in this norm. These could even be different norms, by the way. In fact, they often are in applications, right? Then you'd say, oh, yeah, but I also have a prior that x is small. And then that would be this part here."},{"start":4029.34,"text":"Yeah, so here, for example, if we were going to, not socially non-positive, but suppose I was going to, you know, work on, control a missile heading towards a target. And someone would say, well, what do you, what this thing is going to be at the end."},{"start":4048.33,"text":"how close you are to the target right and so i'd say how does that work and they go well uh okay it wouldn't you know depends right now they're shape charges and things get like insane but let's ignore that and you just say well my kill probability this would be the things they would say depends on the inverse square of the distance from the target and blah blah blah this would be old school non-shaped charges right and that would tell you that this should be a two norm in r3 right it it's how how close do you get"},{"start":4078.25,"text":"And then the norm here could be something else. By the way, that would be a really good use for a penalty right there. As long as we're on a socially non-positive topic. So here's one. Ready? You'd say..."}],"speech_gaps":[],"frame":"../frames/v009/024.webp","frame_time":3934.97},{"title":"惩罚函数与模型敏感性","segments":[{"id":231,"text":"Well, you know, what's your penalty? And you say, oh, if you get within 10 meters, that's fine. Thank you. And you go, how about two meters? And you go, it's not going to matter. You get within 10, then that's good enough. Thank you very much. OK, so that's anyway. And by the way, if you translate that into a penalty, what does that sound like to you? What is it?","zh":"嗯，你知道吗，你的惩罚是什么？你说，哦，如果你在10米以内，那就没问题。谢谢。然后你问，两米怎么样？你说，这不会有什么影响。你进入10米以内，那就足够好了。谢谢。好的，就这样。顺便问一句，如果你把这个转化为惩罚，你觉得听起来像什么？这是什么？","start":4095.1,"end":4117.9},{"id":232,"text":"It says, in that case, it is a dead zone. Literally. Thank you. Yeah, okay, good. Okay, sorry about this. Sorry, I don't know how we got onto this, but it just happened, right? Okay. And what if I tell you that if you're more than, you know, 50 meters, you know, 100 meters away, then you might as well have not even fired the missile. What does that sound like?","zh":"在这种情况下，它就是一个死区。字面意思。谢谢。嗯，好的。抱歉，我也不清楚我们怎么就谈到这个话题了，但就是这样发生的，对吧？好的。如果我告诉你，如果你离得超过50米，或者100米远，那么你几乎可以认为你根本没有发射导弹。这听起来像什么？","start":4119.16,"end":4136.98},{"id":233,"text":"What's that? Yeah, it could be some kind of... It just means basically, like, don't even... You could actually literally put it... Yeah, some kind of barrier. Say, if you don't think according to your model you can get within 100 meters, you know what? Don't even waste it. They're expensive or something like that. This is just an example of where these kinds of discussions come up. Okay? So, okay.","zh":"这是什么？嗯，这可能是一种……它基本上意味着，不要……你实际上可以把它……嗯，某种屏障。比如说，如果你不认为根据你的模型你能进入100米以内，你知道吗？那就别浪费了。它们很贵，或者类似的东西。这只是这种讨论出现的一个例子。好的，好的。","start":4139.34,"end":4161.42},{"id":234,"text":"A very interesting interpretation of this that we're going to come back to later is super cool. It's basically this. Someone says, when you make this estimate, why do you want x small? Do you have a prior that x is small? And you're like, no, I don't. Then you go, but why do you want x small? The reason would be this. Here's another very good reason. You say, I don't really know a that well. You go, okay, cool. I mean, that's actually true in almost any application, right? I don't know a that well. And you'd say, so what's this thing about?","zh":"我们稍后会回到的一个非常有趣的解释是超级酷的。基本上是这样。有人说，当你做出这个估计时，为什么你想要x小？你有没有先验地认为x是小的？你回答，没有，我没有。然后你说，但为什么你想要x小？原因就是这个。这里还有一个非常好的原因。你说，我对a了解不多。你说，好的，明白了。实际上，在几乎任何应用中，这都是真的，对吧？我对a了解不多。你说，那这个事情又是什么？","start":4164.36,"end":4192.73},{"id":235,"text":"x being small and you go well if you don't know if a can vary right if a can wiggle around and you don't know it that much let me ask you a question how much would that matter if you chose x equals zero not at all if you made x really big and you have ax and then a varies what's going to happen to ax","zh":"x小，你说，如果你不知道a是否可以变化，如果a可以波动，而你对其了解不多，让我问你一个问题，如果你选择x等于零，那完全不会有什么影响。如果你让x变得非常大，然后有ax，而a发生变化，ax会发生什么变化？","start":4193.37,"end":4216.26},{"id":236,"text":"What's that? It's big. Okay, so what it says is the following. You might want x small, and someone would say, why? And you'd say, because look, in my model, x multiplies a. And you go, so? And you go, well, look at this. This, if a varies, since it multiplies x, right, the smaller x is, the less effect a varying has on ax.","zh":"这是什么？这很大。好的，它说的是以下内容。你可能希望x很小，有人会问为什么？你会回答，因为在我的模型中，x乘以a。然后你会说，那又怎样？然后你会说，看这里。如果a变化，由于它乘以x，对吧，x越小，a的变化对ax的影响就越小。","start":4217.91,"end":4240.92},{"id":237,"text":"Again, this is unbelievable. Don't make this sophisticated what I'm saying. It's as dumb as what I'm saying. Everybody got this? So that's another very good reason why you might want x to be small. Because ax becomes less sensitive. We will see lots about this later.","zh":"同样，这不可信。不要把我说的话说得那么复杂。我说的话和我之前说的一样傻。大家明白了吗？所以这是另一个非常好的理由，你可能希望x很小。因为ax变得不那么敏感。我们之后会看到很多相关内容。","start":4241.58,"end":4261.9}],"notes":["本段讨论了惩罚函数的设计与模型敏感性之间的关系。讲者通过一个例子说明，当参数a可能变化时，如果x的值较大，那么ax的值会受到a变化的影响较大，因此希望x尽可能小以降低这种敏感性。","讲者进一步解释，如果x为零，那么无论a如何变化，ax的值都不会改变，因此x的值越小，ax对a变化的敏感性越低。这种敏感性的降低在模型设计中是一个重要的考虑因素。","讲者提到，这种对敏感性的关注在实际应用中非常常见，因为通常我们并不完全了解参数a的精确值，因此希望模型对参数变化不那么敏感。","讲者通过一个假设性的问题引导听众思考，如果x的值很大，那么当a变化时，ax的值会显著变化，这说明x的大小直接影响模型对参数变化的敏感性。","讲者强调，这种对敏感性的关注是模型设计中的一个重要原则，即希望模型对参数变化不那么敏感，从而提高模型的鲁棒性。","讲者最后指出，这种对敏感性的关注将在后续课程中进一步讨论，说明这是一个重要的概念，将在后续内容中深入探讨。"],"formulas":[],"uncertainties":["x being small and you go well if you don't know if a can vary right if a can wiggle around and you don't know it that much let me ask you a question how much would that matter if you chose x equals zero not at all if you made x really big and you have ax and then a varies what's going to happen to ax"],"diagram":"none","start":4095.1,"end":4261.9,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4095.1,"text":"Well, you know, what's your penalty? And you say, oh, if you get within 10 meters, that's fine. Thank you. And you go, how about two meters? And you go, it's not going to matter. You get within 10, then that's good enough. Thank you very much. OK, so that's anyway. And by the way, if you translate that into a penalty, what does that sound like to you? What is it?"},{"start":4119.16,"text":"It says, in that case, it is a dead zone. Literally. Thank you. Yeah, okay, good. Okay, sorry about this. Sorry, I don't know how we got onto this, but it just happened, right? Okay. And what if I tell you that if you're more than, you know, 50 meters, you know, 100 meters away, then you might as well have not even fired the missile. What does that sound like?"},{"start":4139.34,"text":"What's that? Yeah, it could be some kind of... It just means basically, like, don't even... You could actually literally put it... Yeah, some kind of barrier. Say, if you don't think according to your model you can get within 100 meters, you know what? Don't even waste it. They're expensive or something like that. This is just an example of where these kinds of discussions come up. Okay? So, okay."},{"start":4164.36,"text":"A very interesting interpretation of this that we're going to come back to later is super cool. It's basically this. Someone says, when you make this estimate, why do you want x small? Do you have a prior that x is small? And you're like, no, I don't. Then you go, but why do you want x small? The reason would be this. Here's another very good reason. You say, I don't really know a that well. You go, okay, cool. I mean, that's actually true in almost any application, right? I don't know a that well. And you'd say, so what's this thing about?"},{"start":4193.37,"text":"x being small and you go well if you don't know if a can vary right if a can wiggle around and you don't know it that much let me ask you a question how much would that matter if you chose x equals zero not at all if you made x really big and you have ax and then a varies what's going to happen to ax"},{"start":4217.91,"text":"What's that? It's big. Okay, so what it says is the following. You might want x small, and someone would say, why? And you'd say, because look, in my model, x multiplies a. And you go, so? And you go, well, look at this. This, if a varies, since it multiplies x, right, the smaller x is, the less effect a varying has on ax."},{"start":4241.58,"text":"Again, this is unbelievable. Don't make this sophisticated what I'm saying. It's as dumb as what I'm saying. Everybody got this? So that's another very good reason why you might want x to be small. Because ax becomes less sensitive. We will see lots about this later."}],"speech_gaps":[],"frame":"../frames/v009/025.webp","frame_time":4107.1},{"title":"凸优化中的标量化解法与正则化","segments":[{"id":238,"text":"So how do you solve these kinds of problems? Well, again, we've seen this before in the general context. You scalarize the problem, right? And many ways to do this is, you know, if you just apply the most direct way, you do this. You refer to this as your primary objective. And gamma is, this is your secondary objective. And gamma weights the primary, actually, it literally weights the secondary objective relative to the first.","zh":"那么你如何解决这类问题呢？嗯，我们之前在一般背景下已经见过这种情况。你将问题标量化解，对吧？有很多方法可以做到这一点，你知道的，如果你只是应用最直接的方法，你就会这样做。你将这个称为你的主要目标。而伽马是，这是你的次要目标。而伽马实际上是对主要目标进行加权，它字面上是将次要目标相对于第一个目标进行加权。","start":4267.12,"end":4293.7},{"id":239,"text":"That's what gamma is here. People actually typically don't solve this. Instead, they would do something like that. And this has lots of names, depending on who you hang out with, but it's ticking off regularization. I guess in Western statistics, it's called ridge regression, I think. And it's got, it probably has other names. Like, I don't know. Okay, so, and it basically, it says, yeah, I want AX minus B.","zh":"这就是这里的伽马。实际上，人们通常不会解决这个问题。相反，他们会这样做。这有很多名字，取决于你和谁在一起，但这是剔除正则化。我想在西方统计学中，它被称为岭回归，我想。它可能还有其他名称。比如，我不知道。好吧，它基本上是说，是的，我想要AX减去B。","start":4294.24,"end":4318.76},{"id":240,"text":"Small and two norm squared. I mean this has a immediate solution. It's like this thing, right? So But that that would be it and we'll look at some interpretations of what that is and all that sort of stuff later. Okay All right, so our next example also it's just going to show you this a baby example of how you would How you fiddle with the weights, right? So actually if you're doing statistical stuff, how do you how do you someone tell me how do you choose the weights? How do you choose?","zh":"小的和二范数平方。我的意思是，这有一个直接的解。它就是这个东西，对吧？所以但这就是全部，我们稍后会看一下这种解的解释以及所有这些内容。好的，那么我们的下一个例子也只是一个简单的例子，展示你如何调整权重，对吧？实际上，如果你在做统计工作，你是如何告诉别人如何选择权重的？你是如何选择的？","start":4319.28,"end":4347.73},{"id":241,"text":"like, let's say, delta here, if you're fitting a statistical model. I mean, we'll talk about this later, but how do you actually do it? There are wrong answers. Let's see. What is that? Ah, beautiful. That was the right answer. Good. Yeah. The wrong answer was to launch into some long theory about Gaussian and asymptotic this and that and blabber on and on. That was the wrong answer, even though those are interesting observations, and that's the right answer. Okay, so...","zh":"比如，假设在这里是德尔塔，如果你在拟合一个统计模型。我的意思是，我们稍后会谈到这一点，但你是如何实际操作的？有一些错误的答案。让我们看看。这是什么？啊，漂亮。那是正确的答案。好。错误的答案是开始讲述一些关于高斯分布和渐近性的长篇大论，以及各种各样的内容，喋喋不休地讲个没完。那是错误的答案，尽管这些观察是有趣的，而那是正确的答案。好的，那么...","start":4348.65,"end":4376.93},{"id":242,"text":"It was cross-validation, by the way, or just out of sample validation. Okay, we'll get to that later. Okay, so this is another example. By the way, a lot of times the scalarization is actually done by people, and it's completely intuitive, right? Like you'd say, I want efficiency but also ride quality.","zh":"顺便说一句，这是交叉验证，或者只是使用样本外验证。好的，我们稍后再讲这个。好的，这是另一个例子。顺便说一句，很多时候标量化解实际上是人们直观地进行的，对吧？比如你会说，我想要效率，但也想要乘坐的舒适性。","start":4377.21,"end":4397.61},{"id":243,"text":"And you're like, well, how do they trade off? And you go, I don't know, show me some choices. And then somebody just makes a decision, right? So you don't have something as simple and obvious and defensible as cross-validation there, right? So, I mean, I guess you could do weird experiments. You could put people in the car and they could finish a trip and go, whoa, oh, my back really hurts, but wow, it didn't cost very much the energy for that trip. Anyway.","zh":"你会想，好吧，他们是如何权衡的？然后你可能会说，我不知道，给我一些选择。然后有人就做出一个决定，对吧？所以在那里你没有像交叉验证那样简单、明显且有说服力的方法，对吧？我的意思是，我想你也可以做一些奇怪的实验。你可以让人坐进车里，完成一次旅行，然后说，哇，哦，我的背部真的疼，但哇，这次旅行消耗的能量却很少。不管怎样。","start":4398.52,"end":4422.0},{"id":244,"text":"You can't do that. I don't think. Right. So that's not how it works. Right. OK. But this will be an example in a lot of areas like that. Unfortunately, in some areas like image processing, it's endemic where people just turn knobs until they like what they see. So it's fine. I'm not making fun of it. Right. So, OK. Control is another one. Right. Where.","zh":"你不能这么做。我想不是这样的。对吧？所以这不是它的运作方式。对吧？好的。但这个例子会出现在很多类似的领域中。不幸的是，在一些领域，比如图像处理，人们只是转动旋钮直到他们喜欢看到的结果。所以这没问题。我不是在嘲笑它。对吧？好的。控制也是一个例子。对吧？在那里。","start":4422.78,"end":4445.32}],"notes":["本段主要讲解了凸优化问题中如何通过标量化解法来处理多目标优化问题。讲者提到，通常会将问题转化为单一目标，其中主要目标和次要目标通过权重进行平衡，例如gamma参数用于调整次要目标相对于主要目标的权重。这种做法在统计学中被称为岭回归（ridge regression），但也有其他名称。","讲者指出，选择权重的方法并不总是明确的，有时需要依赖经验或实验。例如，在统计建模中，选择权重可能涉及交叉验证或样本外验证，而不是依赖复杂的理论。此外，讲者提到在某些领域，如图像处理，人们可能通过调整参数直到满意为止，这种方法虽然不严谨，但有时是可行的。","讲者还提到，在实际应用中，权重的选择可能涉及权衡不同目标，例如效率和舒适性。这种权衡通常需要人为决策，而不是通过数学公式严格定义。讲者强调，这种做法虽然直观，但缺乏严格的理论支持。","在讨论权重选择时，讲者指出，错误的做法是过度依赖理论，如高斯分布和渐近理论，而正确的做法是使用验证方法，如交叉验证。这表明在实际应用中，验证方法比理论分析更为重要。","讲者还提到，在某些情况下，权重的选择可能涉及实验，例如通过让人类用户在驾驶过程中体验不同参数设置的效果。这种方法虽然不科学，但在某些领域可能被采用。","最后，讲者指出，权重的选择在不同领域可能有不同的方法，例如在控制理论中，权重的选择可能涉及复杂的系统分析，而在图像处理中，可能更依赖于直观的调整。这表明权重的选择是一个跨学科的问题，需要根据具体应用场景进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4267.12,"end":4445.32,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4267.12,"text":"So how do you solve these kinds of problems? Well, again, we've seen this before in the general context. You scalarize the problem, right? And many ways to do this is, you know, if you just apply the most direct way, you do this. You refer to this as your primary objective. And gamma is, this is your secondary objective. And gamma weights the primary, actually, it literally weights the secondary objective relative to the first."},{"start":4294.24,"text":"That's what gamma is here. People actually typically don't solve this. Instead, they would do something like that. And this has lots of names, depending on who you hang out with, but it's ticking off regularization. I guess in Western statistics, it's called ridge regression, I think. And it's got, it probably has other names. Like, I don't know. Okay, so, and it basically, it says, yeah, I want AX minus B."},{"start":4319.28,"text":"Small and two norm squared. I mean this has a immediate solution. It's like this thing, right? So But that that would be it and we'll look at some interpretations of what that is and all that sort of stuff later. Okay All right, so our next example also it's just going to show you this a baby example of how you would How you fiddle with the weights, right? So actually if you're doing statistical stuff, how do you how do you someone tell me how do you choose the weights? How do you choose?"},{"start":4348.65,"text":"like, let's say, delta here, if you're fitting a statistical model. I mean, we'll talk about this later, but how do you actually do it? There are wrong answers. Let's see. What is that? Ah, beautiful. That was the right answer. Good. Yeah. The wrong answer was to launch into some long theory about Gaussian and asymptotic this and that and blabber on and on. That was the wrong answer, even though those are interesting observations, and that's the right answer. Okay, so..."},{"start":4377.21,"text":"It was cross-validation, by the way, or just out of sample validation. Okay, we'll get to that later. Okay, so this is another example. By the way, a lot of times the scalarization is actually done by people, and it's completely intuitive, right? Like you'd say, I want efficiency but also ride quality."},{"start":4398.52,"text":"And you're like, well, how do they trade off? And you go, I don't know, show me some choices. And then somebody just makes a decision, right? So you don't have something as simple and obvious and defensible as cross-validation there, right? So, I mean, I guess you could do weird experiments. You could put people in the car and they could finish a trip and go, whoa, oh, my back really hurts, but wow, it didn't cost very much the energy for that trip. Anyway."},{"start":4422.78,"text":"You can't do that. I don't think. Right. So that's not how it works. Right. OK. But this will be an example in a lot of areas like that. Unfortunately, in some areas like image processing, it's endemic where people just turn knobs until they like what they see. So it's fine. I'm not making fun of it. Right. So, OK. Control is another one. Right. Where."}],"speech_gaps":[],"frame":"../frames/v009/026.webp","frame_time":4279.12},{"title":"输入设计与优化问题","segments":[{"id":245,"text":"They just make stuff up and it's fine. They turn knobs and then they like what they see. So anyway, all right. So we'll do, this is kind of a classic problem. It's like optimal input design. So I have an input, which is, in this case, it's a time sequence, U. And what comes out is another time sequence, Y. And they're just related by convolution. So this would be called in dialect, a linear in, you know, EE or something, ME dialect. It's a linear dynamical system or something like that, right? It's a linear system.","zh":"他们只是随便编造一些东西，这也没关系。他们转动旋钮，然后喜欢他们看到的结果。总之，好的。所以我们将处理，这是一个经典的问题。它类似于最优输入设计。我有一个输入，这种情况下是一个时间序列，U。输出的是另一个时间序列，Y。它们仅仅通过卷积相关联。在电气工程或机械工程的术语中，这被称为线性输入，它是一个线性动态系统，对吧？这是一个线性系统。","start":4445.93,"end":4475.25},{"id":246,"text":"And I think in math, you would say it's a convolution kernel. H is the convolution kernel, and this is just the convolution, right? So here's your job.","zh":"我认为在数学中，你会说这是一个卷积核。H 是卷积核，这就是简单的卷积，对吧？所以你的任务是：","start":4475.67,"end":4486.11},{"id":247,"text":"You got a couple of objectives. The first one is you care about the tracking error. So there's some desired trajectory. You want the output to do something. I don't know what it is. Maybe it's just being constant or go to a certain value, or maybe it follows some pattern. That's this one. And this would be called your tracking error. At the same time, you want the input magnitude to be small. And I'm just using...","zh":"你有几个目标。第一个是你关心跟踪误差。有一些期望的轨迹。你希望输出做某件事。我不知道具体是什么。可能是保持恒定或达到某个值，或者可能遵循某种模式。这就是所谓的跟踪误差。同时，你希望输入的幅度尽可能小。我正在使用……","start":4488.87,"end":4514.64},{"id":248,"text":"the L2 norm squared because Y naught is traditional and so on, right? And you also might want the input that you're going to apply to be smooth. And so you take the sum of the squares of the differences, right? Something like that. Okay. And you'd end up, then you form a regularized least squares problem, and it would look like this. So you'd say my tracking error is my primary objective, right?","zh":"L2 范数平方，因为 Y 零是传统的，对吧？你可能还想让你要施加的输入是平滑的。因此你计算差值的平方和，对吧？类似这样的。好的。然后你最终会形成一个正则化的最小二乘问题，看起来像这样。所以你会说我的跟踪误差是我的主要目标，对吧？","start":4515.13,"end":4543.16},{"id":249,"text":"Secondary and tertiary objectives are maybe I want the input small and I want it not too wiggly. There you go. And then the numbers delta and eta here are the ones that tell you how much you care about the input being small and or wiggly compared to your tracking error, right? By the way, hilariously, the same problem comes up not just in control and mechanical engineering. You get exactly the same thing like in finance. Like your primary one might be...","zh":"次要和第三目标可能是我希望输入尽可能小，并且不要太波动。就是这样。这里的数值 delta 和 eta 是告诉你你对输入的大小和波动程度与跟踪误差相比有多在意的参数，对吧？顺便说一句，有趣的是，同样的问题不仅出现在控制和机械工程中。在金融中也会出现完全相同的情况。你的主要目标可能是……","start":4545.02,"end":4573.8},{"id":250,"text":"Need to track this bond portfolio, you know plus or minus 30 basis points or something like that And this would be like I want this would be like in fact instead of the derivative You'd literally have what's you literally have the what they'd call the turnover, which would be the the amount of trading you do, right? This would have the magnitude would mean something else entirely But the point is this problem is repeated in 50 different fields or problems very like this, right? Okay","zh":"需要跟踪这个债券组合，你知道，上下浮动30个基点左右。这就像，实际上，你不需要用衍生品，你真正拥有的是所谓的换手率，也就是你进行的交易量，对吧？这个指标的大小意味着完全不同的东西。但关键是，这类问题在50个不同的领域或问题中反复出现，对吧？好的","start":4574.14,"end":4600.88}],"notes":["本段讲授了输入设计问题，即如何设计输入信号以使输出跟踪期望轨迹，同时最小化输入的大小和波动性。问题被建模为一个线性系统，输入和输出通过卷积关系连接。","跟踪误差是主要目标，而输入的大小和波动性是次要目标。通过引入正则化项，可以将问题转化为一个带有权重的最小二乘问题，权重由参数delta和eta控制。","该问题在多个领域都有应用，如控制工程和金融。在金融中，跟踪误差可能对应于债券组合的跟踪误差，而输入的波动性可能对应于交易量（turnover）。","问题的结构具有普遍性，适用于多种场景，如控制、机械工程和金融等。这种结构化的优化问题在不同领域中被反复使用。","输入设计问题的核心是平衡跟踪误差和输入的平滑性，这通常通过引入正则化项来实现。正则化项的权重决定了对输入大小和波动性的重视程度。","该问题的数学建模基于线性系统和卷积关系，通过最小化目标函数来实现最优输入设计。"],"formulas":[],"uncertainties":["the L2 norm squared because Y naught is traditional and so on, right?","the amount of trading you do, right? This would have the magnitude would mean something else entirely"],"diagram":"none","start":4445.93,"end":4600.88,"asr_flags":[],"math_clarifications":["原始文本中未明确说明卷积的具体形式和变量定义，因此无法确定公式的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4445.93,"text":"They just make stuff up and it's fine. They turn knobs and then they like what they see. So anyway, all right. So we'll do, this is kind of a classic problem. It's like optimal input design. So I have an input, which is, in this case, it's a time sequence, U. And what comes out is another time sequence, Y. And they're just related by convolution. So this would be called in dialect, a linear in, you know, EE or something, ME dialect. It's a linear dynamical system or something like that, right? It's a linear system."},{"start":4475.67,"text":"And I think in math, you would say it's a convolution kernel. H is the convolution kernel, and this is just the convolution, right? So here's your job."},{"start":4488.87,"text":"You got a couple of objectives. The first one is you care about the tracking error. So there's some desired trajectory. You want the output to do something. I don't know what it is. Maybe it's just being constant or go to a certain value, or maybe it follows some pattern. That's this one. And this would be called your tracking error. At the same time, you want the input magnitude to be small. And I'm just using..."},{"start":4515.13,"text":"the L2 norm squared because Y naught is traditional and so on, right? And you also might want the input that you're going to apply to be smooth. And so you take the sum of the squares of the differences, right? Something like that. Okay. And you'd end up, then you form a regularized least squares problem, and it would look like this. So you'd say my tracking error is my primary objective, right?"},{"start":4545.02,"text":"Secondary and tertiary objectives are maybe I want the input small and I want it not too wiggly. There you go. And then the numbers delta and eta here are the ones that tell you how much you care about the input being small and or wiggly compared to your tracking error, right? By the way, hilariously, the same problem comes up not just in control and mechanical engineering. You get exactly the same thing like in finance. Like your primary one might be..."},{"start":4574.14,"text":"Need to track this bond portfolio, you know plus or minus 30 basis points or something like that And this would be like I want this would be like in fact instead of the derivative You'd literally have what's you literally have the what they'd call the turnover, which would be the the amount of trading you do, right? This would have the magnitude would mean something else entirely But the point is this problem is repeated in 50 different fields or problems very like this, right? Okay"}],"speech_gaps":[],"frame":"../frames/v009/027.webp","frame_time":4457.93},{"title":"凸优化中的控制与跟踪问题","segments":[{"id":251,"text":"All right, so this is the idea. And it's just a least squares problem. I mean, later we're going to come back and I'm going to swap these for other penalties. And I'm going to ask you, like, what do you think is going to happen? Okay, but for now they're not. So, and this is what it might look like. And it's just, this is just silly to, but just to see how this looks. So at the top, delta is zero, but I totally forgot. Delta penalizes the derivative, okay? Okay, so in the top, delta is small, right?","zh":"好的，这就是这个想法。这只是一个最小二乘问题。我的意思是，稍后我们会回来，并将这些替换为其他惩罚项。我会问你们，你们认为会发生什么？好吧，但现在它们还不是。所以，这就是它可能的样子。而且这看起来有点傻，但只是为了看看它是什么样子。在顶部，delta是零，但我完全忘记了。delta惩罚导数，对吧？好的，所以在顶部，delta很小，对吧？","start":4601.37,"end":4631.23},{"id":252,"text":"And, oh, by the way, what I want to track is, I'll tell you some, here, that thing. Here's the dialect for that. That would be like a square wave, right? And I think I've heard it in control called something else. It's like a, it's a specific maneuver. Like I want this thing to go here, right? And then later go there and then go back. So it's, anyway, there's even a name for that, which I forget, but it doesn't matter. Okay. So.","zh":"哦，顺便说一句，我想跟踪的是，我会告诉你们一些，这里的东西。这里是它的方言。那就是一个方波，对吧？我想我在控制中听过它被称作其他名字。它像是一种特定的机动。比如，我想让这个东西移动到这里，对吧？然后稍后移动到那里，再回来。所以，不管怎样，它有一个名字，但我忘记了，但这没关系。好的，所以。","start":4631.69,"end":4655.65},{"id":253,"text":"So that's what you want it to do. And here's what's cool. Here's an input you create. It looks like this, right? And, you know, look at that. It actually tracks it like really well.","zh":"这就是你希望它做的事情。而且这里有一个很酷的地方。这里是你创建的输入。它看起来像这样，对吧？而且，你看，它实际上跟踪得非常好。","start":4657.4,"end":4666.28},{"id":254,"text":"I mean, you know, that's what this math is for, right?","zh":"我的意思是，这就是这门数学的用途，对吧？","start":4666.75,"end":4669.13},{"id":255,"text":"So it does that.","zh":"它就是这样做的。","start":4669.19,"end":4670.31},{"id":256,"text":"And you could give all sorts of,","zh":"你可以提供各种各样的，","start":4671.51,"end":4672.77},{"id":257,"text":"obviously the system here has some oscillatory stuff in it, right?","zh":"显然，这个系统中有一些振荡的东西，对吧？","start":4672.79,"end":4677.01},{"id":258,"text":"To make this interesting, right?","zh":"为了使这变得有趣，对吧？","start":4677.41,"end":4678.99},{"id":259,"text":"And you could, people would give all sorts of crazy stories","zh":"人们会编出各种荒谬的故事","start":4679.29,"end":4683.11},{"id":260,"text":"about what's happening here.","zh":"来讲述这里发生了什么。","start":4683.11,"end":4684.21},{"id":261,"text":"Like I have friends in mechanical engineering who would say,","zh":"比如我有朋友是机械工程专业的，他们会说，","start":4684.41,"end":4686.63},{"id":262,"text":"oh, that's very clever.","zh":"哦，这非常聪明。","start":4686.73,"end":4687.73},{"id":263,"text":"And you go, what is this?","zh":"然后你就会问，这是什么？","start":4687.91,"end":4689.19},{"id":264,"text":"And you say, well, you're exciting these high frequency modes","zh":"你会说，好吧，你是在以正确的方式激发这个系统中的高频模态，","start":4689.29,"end":4693.17},{"id":265,"text":"in this thing in just the right way","zh":"这样当实际系统运行时，你就不会激发这些模态，从而避免出血。","start":4693.17,"end":4695.57},{"id":266,"text":"So that when the real thing goes down it you won't excite those modes and blood","zh":"这样当实际系统运行时，你就不会激发那些模式和血","start":4695.57,"end":4700.13},{"id":267,"text":"I don't they go on and on and I mean it kind of makes I mean they and they appear to know what they're talking","zh":"我不认为他们一直在说个没完，我是说这有点让人觉得他们知道自己在说什么","start":4700.13,"end":4703.99},{"id":268,"text":"About amongst each other right so it's fine, but but that I'm just saying they could they they would look at that and explain it right so","zh":"他们在彼此之间讨论，这没问题，但我说的是他们可能会看到这一点并加以解释，对吧","start":4703.99,"end":4710.61},{"id":269,"text":"Okay, so what happens is you say no no this input is too wiggly","zh":"好的，所以发生的情况是你说不不，这个输入太抖了","start":4711.99,"end":4715.85},{"id":270,"text":"so","zh":"所以","start":4717.03,"end":4717.43},{"id":271,"text":"Right so what we're gonna do actually it's too big right because look it goes down to minus nine and plus five and you'd say","zh":"对，我们实际上要做的事情是，这太大了，对吧，因为你看它从负九降到正五，你会说","start":4718.93,"end":4724.85},{"id":272,"text":"say, so what I'm going to do in the middle is I'm going to put, I'm still, I don't care about","zh":"说，我打算在中间这么做，我仍然，我不关心抖动，但我将调高eta","start":4724.85,"end":4728.95},{"id":273,"text":"wiggliness, but I'm going to turn up eta. What eta will do is it's going to increase your tracking","zh":"eta的作用是增加你的跟踪误差。你可以在这里看到，对吧？你跟踪得不好了。但现在你有","start":4728.95,"end":4733.95},{"id":274,"text":"error. You can see that over here, right? That you're not tracking as well. But now you have","zh":"错误。你可以在这里看到，对吧？你跟踪得并不好。但现在你有了","start":4733.95,"end":4738.55},{"id":275,"text":"an input that's a lot, you know, whatever, it's like three times smaller, roughly, right? Or","zh":"一个输入量很大，你知道的，不管怎样，它大概小三倍左右，对吧？","start":4738.55,"end":4742.45},{"id":276,"text":"order of magnitude, right? So that'd be the idea. And then finally, you would say, let's crank up","zh":"数量级，对吧？所以这就是想法。最后，你会说，让我们增加平滑度，你会得到一个看起来像那样的东西，","start":4742.85,"end":4750.13},{"id":277,"text":"the smoothness and you would get something that looks like that and","zh":"并且这是一个不错的平滑输入，而这就是你会得到的跟踪误差，好的","start":4750.13,"end":4753.65},{"id":278,"text":"that's a nice smooth input and and this is the the tracking error you'd get okay","zh":"然后，如果你实际这样做，人们可能会看着它并说这里的跟踪误差太大了，你会退一步","start":4753.65,"end":4757.57},{"id":279,"text":"and then how would this actually work if you were doing this probably people","zh":"你知道的，选择其他的其中一个，你会说，不行，它太抖了，不行，太大了，太小了，","start":4757.57,"end":4761.57},{"id":280,"text":"would look at it and go no tracking errors too big here and you'd back off","zh":"你会来回调整，直到你感到无聊或满意为止","start":4761.57,"end":4765.63},{"id":281,"text":"you know one of the others and you say no it's too wiggly no it's too big too","zh":"你知道其中一个其他的，你说不，它太摇晃了，不，它太大了，太小了，你来回切换，直到你感到无聊或满意","start":4765.63,"end":4768.45},{"id":282,"text":"small and you go back and forth until you were either bored or satisfied","zh":"你来回切换，直到你感到无聊或满意","start":4768.45,"end":4772.05}],"notes":["本段讨论了在控制问题中如何通过调整输入信号的平滑度和跟踪误差来优化系统性能。讲者提到，输入信号过于波动会导致系统激发高频模式，从而影响跟踪效果。通过调整参数eta，可以增加跟踪误差，但同时减少输入信号的波动性。"],"formulas":[],"uncertainties":["blood","they and they appear to know what they're talking","About amongst each other right so it's fine, but but that I'm just saying they could they they would look at that and explain it right so","it kind of makes I mean they and they appear to know what they're talking","About amongst each other right so it's fine, but but that I'm just saying they could they they would look at that and explain it right so"],"diagram":"none","start":4601.37,"end":4772.05,"asr_flags":[],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":4601.37,"text":"All right, so this is the idea. And it's just a least squares problem. I mean, later we're going to come back and I'm going to swap these for other penalties. And I'm going to ask you, like, what do you think is going to happen? Okay, but for now they're not. So, and this is what it might look like. And it's just, this is just silly to, but just to see how this looks. So at the top, delta is zero, but I totally forgot. Delta penalizes the derivative, okay? Okay, so in the top, delta is small, right?"},{"start":4631.69,"text":"And, oh, by the way, what I want to track is, I'll tell you some, here, that thing. Here's the dialect for that. That would be like a square wave, right? And I think I've heard it in control called something else. It's like a, it's a specific maneuver. Like I want this thing to go here, right? And then later go there and then go back. So it's, anyway, there's even a name for that, which I forget, but it doesn't matter. Okay. So."},{"start":4657.4,"text":"So that's what you want it to do. And here's what's cool. Here's an input you create. It looks like this, right? And, you know, look at that. It actually tracks it like really well."},{"start":4666.75,"text":"I mean, you know, that's what this math is for, right?"},{"start":4669.19,"text":"So it does that."},{"start":4671.51,"text":"And you could give all sorts of,"},{"start":4672.79,"text":"obviously the system here has some oscillatory stuff in it, right?"},{"start":4677.41,"text":"To make this interesting, right?"},{"start":4679.29,"text":"And you could, people would give all sorts of crazy stories"},{"start":4683.11,"text":"about what's happening here."},{"start":4684.41,"text":"Like I have friends in mechanical engineering who would say,"},{"start":4686.73,"text":"oh, that's very clever."},{"start":4687.91,"text":"And you go, what is this?"},{"start":4689.29,"text":"And you say, well, you're exciting these high frequency modes"},{"start":4693.17,"text":"in this thing in just the right way"},{"start":4695.57,"text":"So that when the real thing goes down it you won't excite those modes and blood"},{"start":4700.13,"text":"I don't they go on and on and I mean it kind of makes I mean they and they appear to know what they're talking"},{"start":4703.99,"text":"About amongst each other right so it's fine, but but that I'm just saying they could they they would look at that and explain it right so"},{"start":4711.99,"text":"Okay, so what happens is you say no no this input is too wiggly"},{"start":4717.03,"text":"so"},{"start":4718.93,"text":"Right so what we're gonna do actually it's too big right because look it goes down to minus nine and plus five and you'd say"},{"start":4724.85,"text":"say, so what I'm going to do in the middle is I'm going to put, I'm still, I don't care about"},{"start":4728.95,"text":"wiggliness, but I'm going to turn up eta. What eta will do is it's going to increase your tracking"},{"start":4733.95,"text":"error. You can see that over here, right? That you're not tracking as well. But now you have"},{"start":4738.55,"text":"an input that's a lot, you know, whatever, it's like three times smaller, roughly, right? Or"},{"start":4742.85,"text":"order of magnitude, right? So that'd be the idea. And then finally, you would say, let's crank up"},{"start":4750.13,"text":"the smoothness and you would get something that looks like that and"},{"start":4753.65,"text":"that's a nice smooth input and and this is the the tracking error you'd get okay"},{"start":4757.57,"text":"and then how would this actually work if you were doing this probably people"},{"start":4761.57,"text":"would look at it and go no tracking errors too big here and you'd back off"},{"start":4765.63,"text":"you know one of the others and you say no it's too wiggly no it's too big too"},{"start":4768.45,"text":"small and you go back and forth until you were either bored or satisfied"}],"speech_gaps":[],"frame":"../frames/v009/028.webp","frame_time":4613.37},{"title":"超参数调整与课程安排","segments":[{"id":283,"text":"So that's called hyperparameter tweaking. And if you think it's bad in machine learning, it's really bad in control. But that's fine. Okay, everybody got this? I mean, it's all kind of obvious, right, I think. So I think what we'll do is, actually, I think we're going to quit here, and we'll continue on Thursday.","zh":"这就是所谓的超参数调整。如果你觉得在机器学习中这已经很糟糕了，那么在控制领域那就更糟糕了。不过没关系。好吧，大家都明白了吗？我是说，这其实都很明显，对吧？我认为我们接下来就到这里，然后在星期四继续上课。","start":4773.72,"end":4798.33}],"notes":["本段主要讲解了超参数调整（hyperparameter tweaking）在机器学习和控制领域的应用，指出其在控制领域更为糟糕。讲者认为这一概念较为明显，因此决定结束本次课程，继续在周四进行。","讲者强调了超参数调整在机器学习中的常见性，并指出其在控制领域的问题更为严重，这表明该概念在不同领域中的影响和重要性存在差异。","讲者在结束课程前确认学生是否理解了相关内容，并表示内容较为明显，因此无需进一步深入讲解。","课程安排上，讲者决定在周四继续授课，这表明课程内容是分阶段进行的，且有明确的时间安排。","讲者在结尾处提到“it's all kind of obvious”，表明他认为该部分内容较为基础，学生应能自行理解。","整体上，本段内容为课程的收尾部分，涉及教学内容的总结和后续安排，强调了超参数调整的重要性及课程的阶段性安排。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4773.72,"end":4798.33,"asr_flags":[],"translation_complete":true,"translated_segments":1,"raw_segments":[{"start":4773.72,"text":"So that's called hyperparameter tweaking. And if you think it's bad in machine learning, it's really bad in control. But that's fine. Okay, everybody got this? I mean, it's all kind of obvious, right, I think. So I think what we'll do is, actually, I think we're going to quit here, and we'll continue on Thursday."}],"speech_gaps":[],"frame":"../frames/v009/029.webp","frame_time":4785.72}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
