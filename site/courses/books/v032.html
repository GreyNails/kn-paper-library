ghts is actually one of the"},{"start":1899.87,"text":"key ideas behind PPO, which is a popular RL algorithm."},{"start":1904.73,"text":"And so, let's see."},{"start":1909.23,"text":"If we were to then put this clipping into practice, we could take our surrogate objective"},{"start":1915.07,"text":"and then replace the importance weights by the clipped importance weights right here"},{"start":1919.89,"text":"in order to get a modified surrogate objective."},{"start":1926.95,"text":"Now, there's a couple more tricks that PPO introduces"},{"start":1931.31,"text":"to try to get stable reinforcement learning improvement."},{"start":1938.67,"text":"So in this first trick, it's no longer incentivized to deviate significantly."},{"start":1943.43,"text":"Now, one thing that's a little bit funky about these importance weights"},{"start":1948.99,"text":"is that there is actually a possibility that it might actually"},{"start":1957.98,"text":"Clipping in some rare cases might actually make the objective better. If, for example, the policy ended up assigning a very low probability to a negative advantage and it went below the advantages, then you're clipping it to a higher weight."},{"start":1977.31,"text":"One thing that PPO does is, and kind of the final objective of PPO, is to take this clipped objective, but take the minimum with respect to the original objective."},{"start":1987.23,"text":"And this minimum is just making sure that the clipping will never make the objective better."},{"start":1992.93,"text":"And it formulates a lower bound, it ensures that this is a lower bound on the original surrogate objective."},{"start":2003.15,"text":"And this means that we're going to be maximizing a lower bound on our objective."},{"start":2007.59,"text":"And usually, if you're ever going to be maximizing something that's different from your original"},{"start":2015.15,"text":"objective, it's good if it's lower bound, because it means that you're actually going"},{"start":2018.87,"text":"to be... you're not going to be maximizing something that you could maximize beyond the"},{"start":2024.31,"text":"original objective."},{"start":2027.75,"text":"Cool."},{"start":2028.35,"text":"So this is the final PPO surrogate objective."},{"start":2030.23,"text":"characters. The motivation behind trick one or trick two? Trick two. So the motivation"},{"start":2035.15,"text":"behind trick two, I'm not actually sure how often this happens in practice, like how critical"},{"start":2043.07,"text":"of cool this is, but the motivation is that if you are in a scenario"}],"speech_gaps":[],"frame":"../frames/v032/012.webp","frame_time":1889.21},{"title":"Off-Policy Actor Critic算法中的策略剪切","segments":[{"id":133,"text":"You might actually be in a scenario where maybe it increased the probability on a lot of the good stuff, it decreased the probability on a lot of the bad stuff, but in some of the rare circumstances where maybe increasing the probability on a good stuff led it, there was another advantage that had a similar state that was actually really bad, and maybe it increased the probability on both of those.","start":2047.65,"end":2068.99},{"id":134,"text":"In that case, clipping it at 1.2 for that second one is actually making it better. It's actually making the objective better because you're then saying, okay, maybe it assigned a really high probability to this bad action. We're then going to clip that at 1.2 or something like that. And so if we take the minimum with respect to the original objective, this is at the state action level, at the data point level. This is going to ensure that those situations aren't happening.","start":2070.61,"end":2097.75},{"id":135,"text":"I guess explicitly say you have say you have a particular state and action pair where the advantage is like, I don't know, negative a thousand or something like that. So something really large then and say that your your new your new policy for this state in action.","start":2099.59,"end":2130.06},{"id":136,"text":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2.","start":2131.85,"end":2159.75},{"id":137,"text":"And then once we clip it to 1.2, we'll multiply 1.2 by negative 1,000. And so that's actually going to be making the objective better than if we hadn't clipped the objective. And so what this trick number two does is it means that it actually doesn't get to do the clipping for this particular data point. And this will disincentivize it from making these kinds of accidents, which is a good thing to do.","start":2160.67,"end":2186.13},{"id":138,"text":"So you're asking, why don't we just clip above and not clip below? So there is actually an analogous version of this. If you just make this negative and flip these, where the clipping could also make the objective better. Like, for example, if A hat for a given state and action pair is positive 1000, and the new policy...","start":2187.12,"end":2213.02}],"notes":["本段讲解了在策略梯度方法中使用策略剪切（clipping）来防止策略更新过程中出现极端概率分配的问题。讲者通过一个具体例子说明，当新策略对某个动作赋予很高的概率，而原始策略赋予很低的概率时，两者的比值可能非常大，此时通过剪切可以避免目标函数的剧烈波动。","讲者进一步指出，剪切操作可以防止策略在某些罕见情况下做出错误的决策，例如将一个原本不好的动作赋予过高的概率。通过将比值限制在某个范围内（如1.2），可以确保目标函数的稳定性。","讲者还提到，剪切操作不仅适用于对高概率的限制，也可以对低概率进行剪切。例如，当优势函数为正时，如果新策略对某个动作赋予过低的概率，也可以通过剪切来避免目标函数的异常。","讲者通过一个具体的数值例子说明了剪切操作的计算过程：当优势函数为-1000，新策略的概率为0.9，原始策略的概率为0.1时，两者的比值为9，剪切后变为1.2，再乘以优势函数的值，得到-1200，这比未剪切时的-900更优。","讲者强调，剪切操作的目的是防止策略在某些罕见情况下做出错误的决策，从而提高算法的稳定性和性能。","最后，讲者指出，剪切操作可以同时应用于高概率和低概率的情况，通过调整剪切的上下限，可以更全面地控制策略更新的幅度。"],"formulas":[{"latex":"r = \\frac{\\text{new policy probability}}{\\text{original policy probability}}","symbols":"r 表示新策略与原始策略的概率比","explanation":"公式正确，表示新策略与原始策略的概率比，符合上下文描述。","evidence":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2."},{"latex":"r_{\\text{clipped}} = \\text{min}(r, \\text{clip value})","symbols":"r_clipped 表示剪切后的概率比","explanation":"公式正确，表示剪切后的概率比，使用min函数确保不超过clip value，符合上下文描述。","evidence":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2."},{"latex":"objective = r_{\\text{clipped}} \\times A","symbols":"objective 表示目标函数，A 表示优势函数","explanation":"公式正确，表示目标函数为剪切后的概率比乘以优势函数，符合上下文描述。","evidence":"And then once we clip it to 1.2, we'll multiply 1.2 by negative 1,000. And so that's actually going to be making the objective better than if we hadn't clipped the objective. And so what this trick number two does is it means that it actually doesn't get to do the clipping for this particular data point. And this will disincentivize it from making these kinds of accidents, which is a good thing to do."}],"uncertainties":["your your new your new policy for this state in action"],"diagram":"none","start":2047.65,"end":2213.02,"asr_flags":[],"math_clarifications":["公式中的剪切操作是为了防止策略更新时出现极端值，从而稳定训练过程。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2047.65,"text":"You might actually be in a scenario where maybe it increased the probability on a lot of the good stuff, it decreased the probability on a lot of the bad stuff, but in some of the rare circumstances where maybe increasing the probability on a good stuff led it, there was another advantage that had a similar state that was actually really bad, and maybe it increased the probability on both of those."},{"start":2070.61,"text":"In that case, clipping it at 1.2 for that second one is actually making it better. It's actually making the objective better because you're then saying, okay, maybe it assigned a really high probability to this bad action. We're then going to clip that at 1.2 or something like that. And so if we take the minimum with respect to the original objective, this is at the state action level, at the data point level. This is going to ensure that those situations aren't happening."},{"start":2099.59,"text":"I guess explicitly say you have say you have a particular state and action pair where the advantage is like, I don't know, negative a thousand or something like that. So something really large then and say that your your new your new policy for this state in action."},{"start":2131.85,"text":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2."},{"start":2160.67,"text":"And then once we clip it to 1.2, we'll multiply 1.2 by negative 1,000. And so that's actually going to be making the objective better than if we hadn't clipped the objective. And so what this trick number two does is it means that it actually doesn't get to do the clipping for this particular data point. And this will disincentivize it from making these kinds of accidents, which is a good thing to do."},{"start":2187.12,"text":"So you're asking, why don't we just clip above and not clip below? So there is actually an analogous version of this. If you just make this negative and flip these, where the clipping could also make the objective better. Like, for example, if A hat for a given state and action pair is positive 1000, and the new policy..."}],"speech_gaps":[],"frame":"../frames/v032/013.webp","frame_time":2059.65},{"title":"PPO算法中的优势估计与截断技巧","segments":[{"id":139,"text":"assigns 0.1 and the old policy assigns 0.9, then now if you do this by accident, or if it happened to do this as part of optimizing other data points, then now the ratio is going to be 1 over 9, which is very small.","start":2214.18,"end":2237.98},{"id":140,"text":"you multiply that by a thousand. If you clip the 1 over 9 by 0.8, that's actually making the objective better. And so generally clipping on both sides and then taking the lower bound prevents both of these kinds of scenarios from being encouraged through clipping. Okay, so this is the final PPO surrogate objective.","start":2238.46,"end":2267.6},{"id":141,"text":"The last thing, the last trick that PPO does is on estimating the advantage. So to estimate the advantage, there's a third trick that's used. This is actually a trick where I'm not sure how necessary it is myself. I haven't done a ton of comparisons. And the way that it works is you still could be fitting a value function, v pi, in the normal way.","start":2269.5,"end":2298.6},{"id":142,"text":"either with Monte Carlo or bootstrapping. But then once you fit that value function, previously the equation for our value function was the reward plus the next value minus the current value. And instead of just using kind of a horizon of one, it's actually going to use a varying horizon. So you can think of, before we were estimating the advantage,","start":2299.03,"end":2328.53},{"id":143,"text":"of a given state in action. We're using the reward at that state plus the value at the next state minus the value at the current state. These were all for pi. And then we had hats on each of these. But you can also estimate the advantage using something that kind of looks like n-step.","start":2329.38,"end":2355.41},{"id":144,"text":"returns where you're actually going to be summing over multiple reward functions, multiple of the rewards into the future and subtracting that future reward or adding that future value instead of adding just one step into the future. You can sort of think of this as like, we were talking about bias and variance before. If you use, if you calculate these different advantages with varying horizons and then weight them accordingly, then you can get","start":2356.45,"end":2385.24}],"notes":["本段主要讲解PPO算法中截断技巧的应用。当新策略与旧策略的比率非常小时，通过截断可以防止目标函数被极端值破坏。截断操作通常在两个方向上进行，并取下界，以避免鼓励极端情况的发生。这是PPO代理目标函数的最终形式。","PPO算法的最后一个技巧是优势估计。优势估计通常通过拟合价值函数来实现，可以使用蒙特卡洛方法或自举方法。在拟合价值函数后，优势估计不再仅限于一步的未来奖励，而是使用可变的未来时间范围。","优势估计可以使用类似于n步回报的方法，通过累加多个未来奖励或未来价值来计算。这种方法可以平衡偏差和方差，通过不同时间范围的优势估计并加权，可以得到更稳定的结果。","在优势估计中，使用不同时间范围的回报并加权，可以减少偏差和方差的影响。这种方法在PPO中被提及，但其必要性尚未被广泛验证。","PPO算法通过截断和优势估计的改进，提高了策略优化的稳定性。截断防止了极端比率对目标函数的影响，而优势估计的改进则通过不同时间范围的回报加权来平衡偏差和方差。","本段内容涉及PPO算法的两个关键技巧：截断和优势估计的改进。这些技巧共同作用，提高了策略优化的稳定性和效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2214.18,"end":2385.24,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2214.18,"text":"assigns 0.1 and the old policy assigns 0.9, then now if you do this by accident, or if it happened to do this as part of optimizing other data points, then now the ratio is going to be 1 over 9, which is very small."},{"start":2238.46,"text":"you multiply that by a thousand. If you clip the 1 over 9 by 0.8, that's actually making the objective better. And so generally clipping on both sides and then taking the lower bound prevents both of these kinds of scenarios from being encouraged through clipping. Okay, so this is the final PPO surrogate objective."},{"start":2269.5,"text":"The last thing, the last trick that PPO does is on estimating the advantage. So to estimate the advantage, there's a third trick that's used. This is actually a trick where I'm not sure how necessary it is myself. I haven't done a ton of comparisons. And the way that it works is you still could be fitting a value function, v pi, in the normal way."},{"start":2299.03,"text":"either with Monte Carlo or bootstrapping. But then once you fit that value function, previously the equation for our value function was the reward plus the next value minus the current value. And instead of just using kind of a horizon of one, it's actually going to use a varying horizon. So you can think of, before we were estimating the advantage,"},{"start":2329.38,"text":"of a given state in action. We're using the reward at that state plus the value at the next state minus the value at the current state. These were all for pi. And then we had hats on each of these. But you can also estimate the advantage using something that kind of looks like n-step."},{"start":2356.45,"text":"returns where you're actually going to be summing over multiple reward functions, multiple of the rewards into the future and subtracting that future reward or adding that future value instead of adding just one step into the future. You can sort of think of this as like, we were talking about bias and variance before. If you use, if you calculate these different advantages with varying horizons and then weight them accordingly, then you can get"}],"speech_gaps":[],"frame":"../frames/v032/014.webp","frame_time":2226.18},{"title":"优势估计的方差与偏差权衡","segments":[{"id":145,"text":"Advantage estimates that have varying variance and maybe have less bias than if you just use the one-step estimate right here. I think that there's some argument in terms of bias and variance that can be made, but it's also not 100% clear if it's necessary, in my opinion.","start":2385.95,"end":2410.15},{"id":146,"text":"Right, yeah. So there's now going to be a hyperparameter here with regard to how do you choose these weights with regard to the different end step returns. Generally, you'll mostly use the earlier ones so that you have less variance. And usually, you will choose it to kind of decay very quickly as the horizon increases. You're mostly still going to be using the t equals 1 or n equals 1.","start":2410.99,"end":2440.15},{"id":147,"text":"Right. So if you're using these weights, do you set gamma to one or do you use them together? You'll actually use them together. And if you write this out, you'll get a term that multiplies gamma and lambda here.","start":2441.08,"end":2452.92},{"id":148,"text":"So the question was, this is the same as taking a weighted average of different end step returns for different ends. So the one thing that's different is we're still going to be fitting the value function in the normal way. And then this is in terms of how we estimate the advantage. But otherwise, it's very kind of, you can think of it as end step returns, but averaging the different ends in order to get an estimate. What's the benefit of using GAE? I think I'm not...","start":2453.91,"end":2482.3},{"id":149,"text":"I think it's a little bit hard to motivate. I think one way to view it is that if you just use this one step return, especially if the time steps are very close together, then this might be, if this estimate is like, if your v's are not completely accurate, then this estimate might be a bit off. And if you increase this horizon, then you'll get potentially a better estimate.","start":2483.78,"end":2507.58},{"id":150,"text":"Now, why not just use one value of n versus a mixture? Perhaps it helps you hedge a little bit if you're not sure which value of n is correct. But I don't have a great motivation myself for it. If you use it in Dart, use it. I'm not 100% sure what the performance is like. OK, cool. So the final PPO algorithm, we sample a batch of data. We fit a value function to that data.","start":2508.06,"end":2536.55}],"notes":["本段讨论了优势估计的方差和偏差之间的权衡。讲者指出，使用不同步长的估计方法可能会带来不同的方差和偏差，但具体是否必要尚不明确。这表明在强化学习中，选择合适的估计方法需要权衡偏差和方差。","讲者提到，通常会使用较早的步长来减少方差，并且随着时间步长的增加，权重会迅速衰减。这表明在实际应用中，选择合适的权重策略对于降低估计的方差至关重要。","讲者进一步解释了如何将权重与gamma和lambda结合使用，以得到一个乘以gamma和lambda的项。这表明在实现GAE（广义优势估计）时，需要考虑这些参数的组合。","讲者提到，GAE可以看作是不同终点回报的加权平均，但其优势在于如何估计优势函数。这表明GAE的核心思想是通过加权平均不同时间步长的回报来提高估计的准确性。","讲者指出，使用单一步长的回报可能会导致估计偏差，尤其是在时间步长较小时。而增加时间步长可能会带来更准确的估计，但需要权衡计算复杂性和估计偏差。","最后，讲者提到使用不同n值的混合方法可能有助于在不确定最佳n值时进行权衡，但缺乏明确的理论支持。这表明在实际应用中，选择合适的n值可能需要经验或实验验证。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2385.95,"end":2536.55,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2385.95,"text":"advantage estimates that have varying variance and maybe have less bias than if you just use the one-step estimate right here. I think that there's some argument in terms of bias and variance that can be made, but it's also not 100% clear if it's necessary, in my opinion."},{"start":2410.99,"text":"Right, yeah. So there's now going to be a hyperparameter here with regard to how do you choose these weights with regard to the different end step returns. Generally, you'll mostly use the earlier ones so that you have less variance. And usually, you will choose it to kind of decay very quickly as the horizon increases. You're mostly still going to be using the t equals 1 or n equals 1."},{"start":2441.08,"text":"Right. So if you're using these weights, do you set gamma to one or do you use them together? You'll actually use them together. And if you write this out, you'll get a term that multiplies gamma and lambda here."},{"start":2453.91,"text":"So the question was, this is the same as taking a weighted average of different end step returns for different ends. So the one thing that's different is we're still going to be fitting the value function in the normal way. And then this is in terms of how we estimate the advantage. But otherwise, it's very kind of, you can think of it as end step returns, but averaging the different ends in order to get an estimate. What's the benefit of using GAE? I think I'm not..."},{"start":2483.78,"text":"I think it's a little bit hard to motivate. I think one way to view it is that if you just use this one step return, especially if the time steps are very close together, then this might be, if this estimate is like, if your v's are not completely accurate, then this estimate might be a bit off. And if you increase this horizon, then you'll get potentially a better estimate."},{"start":2508.06,"text":"Now, why not just use one value of n versus a mixture? Perhaps it helps you hedge a little bit if you're not sure which value of n is correct. But I don't have a great motivation myself for it. If you use it in Dart, use it. I'm not 100% sure what the performance is like. OK, cool. So the final PPO algorithm, we sample a batch of data. We fit a value function to that data."}],"speech_gaps":[],"frame":"../frames/v032/015.webp","frame_time":2397.95},{"title":"PPO算法中的超参数与训练过程","segments":[{"id":151,"text":"And then we evaluate this generalized advantage estimate that we just talked about. And then we will update the policy by taking M gradient steps on your surrogate objective, where the surrogate objective uses these clipped importance weights using the GAE estimate of the advantage function. And then you can repeat this process after taking M gradient steps, then kind of sample a new batch of data, fit a new value function to that, and repeat the process.","start":2537.12,"end":2567.11},{"id":152,"text":"In order to get a rough sense for what this looks like, here are some example hyperparameters. Now, generally hyperparameters are something that you would tune per domain, so this is not my recommended hyperparameter necessarily, but just to give a rough sense for what this looks like. The batch of data might have around 2,000 timesteps in it.","start":2570.64,"end":2588.66},{"id":153,"text":"So if you have a long horizon problem that has like a thousand time steps, this might actually be only a couple trajectories. If you have a shorter horizon problem, this might be more trajectories. When you update the policy on step four, a common hyperparameter is something around 10 epochs on the data set that was collected in step one. And so this would be, if your batch size is 64, this might be around 300 gradient steps.","start":2589.02,"end":2617.29},{"id":154,"text":"And so this means that in comparison to before, we're actually, because we introduced this clipping, we're actually able to take 300 gradient steps without having really unstable improvement. So that's good.","start":2617.98,"end":2631.9},{"id":155,"text":"Clipping range, I mentioned 0.2 is something that might be reasonable. And then you might run this around 500 times, this full outer loop 500 times, in order to get around a million total time steps of experience.","start":2634.04,"end":2648.4},{"id":156,"text":"If you run this algorithm, if you run PPO, we'll see some other examples, actually some cooler examples at the end of the lecture, but if you run PPO on this very simple simulated half cheetah, like the right half of a cheetah or something, and you look at as you collect more time steps of data, what does the reward look like? There are a number of algorithms here. This beige one is vanilla policy gradient.","start":2650.66,"end":2677.5},{"id":157,"text":"It's a slightly smarter version of Vanilla Policy Gradient, but it's basically Vanilla Policy Gradient, where you're not fitting the advantage function and you're not doing the clipping. And then PPO is up here. And you can see that it's able to, with less experience, able to improve much faster because it's fitting the advantage function and because it's doing the clipping on the gradient in order to take many more gradient steps on a single data point.","start":2678.0,"end":2704.78}],"notes":["本段主要讲解PPO算法中的超参数设置和训练过程。讲者提到，超参数通常是根据具体任务进行调整的，例如批量数据的大小、梯度步数、训练轮次等。在PPO中，通过引入梯度裁剪，可以在不导致不稳定改进的情况下进行更多的梯度更新，从而提高训练效率。","讲者还提到，超参数如裁剪范围（0.2）和训练轮次（500次）是常见的选择，这些参数的设置会影响总的时间步数。例如，一个包含2000个时间步的批量数据，结合64的批量大小和300个梯度步，可以生成大约100万的时间步。","在实际应用中，PPO算法通过拟合优势函数和进行梯度裁剪，相较于传统的策略梯度方法（如Vanilla Policy Gradient），能够更快地提升性能。讲者通过一个模拟的半猎豹环境展示了这一效果，说明PPO在较少经验下也能实现更快的改进。","讲者还提到，PPO算法的训练过程包括重复采样数据、拟合价值函数、更新策略等步骤，这些步骤构成了PPO的完整训练循环。通过多次迭代，算法能够积累更多的经验数据，从而优化策略。","在比较不同算法时，讲者指出Vanilla Policy Gradient和PPO之间的差异在于是否拟合优势函数和是否进行梯度裁剪。PPO通过这些改进，能够在单个数据点上进行更多的梯度更新，从而提升训练效率。","最后，讲者提到PPO算法在实际应用中表现良好，特别是在处理复杂任务时，能够通过裁剪梯度和拟合优势函数，实现更稳定的策略更新。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2537.12,"end":2704.78,"asr_flags":[],"math_clarifications":["所有公式均未提供明确的数学表达式，仅以自然语言描述概念，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2537.12,"text":"And then we evaluate this generalized advantage estimate that we just talked about. And then we will update the policy by taking M gradient steps on your surrogate objective, where the surrogate objective uses these clipped importance weights using the GAE estimate of the advantage function. And then you can repeat this process after taking M gradient steps, then kind of sample a new batch of data, fit a new value function to that, and repeat the process."},{"start":2570.64,"text":"In order to get a rough sense for what this looks like, here are some example hyperparameters. Now, generally hyperparameters are something that you would tune per domain, so this is not my recommended hyperparameter necessarily, but just to give a rough sense for what this looks like. The batch of data might have around 2,000 timesteps in it."},{"start":2589.02,"text":"So if you have a long horizon problem that has like a thousand time steps, this might actually be only a couple trajectories. If you have a shorter horizon problem, this might be more trajectories. When you update the policy on step four, a common hyperparameter is something around 10 epochs on the data set that was collected in step one. And so this would be, if your batch size is 64, this might be around 300 gradient steps."},{"start":2617.98,"text":"And so this means that in comparison to before, we're actually, because we introduced this clipping, we're actually able to take 300 gradient steps without having really unstable improvement. So that's good."},{"start":2634.04,"text":"Clipping range, I mentioned 0.2 is something that might be reasonable. And then you might run this around 500 times, this full outer loop 500 times, in order to get around a million total time steps of experience."},{"start":2650.66,"text":"If you run this algorithm, if you run PPO, we'll see some other examples, actually some cooler examples at the end of the lecture, but if you run PPO on this very simple simulated half cheetah, like the right half of a cheetah or something, and you look at as you collect more time steps of data, what does the reward look like? There are a number of algorithms here. This beige one is vanilla policy gradient."},{"start":2678.0,"text":"It's a slightly smarter version of Vanilla Policy Gradient, but it's basically Vanilla Policy Gradient, where you're not fitting the advantage function and you're not doing the clipping. And then PPO is up here. And you can see that it's able to, with less experience, able to improve much faster because it's fitting the advantage function and because it's doing the clipping on the gradient in order to take many more gradient steps on a single data point."}],"speech_gaps":[],"frame":"../frames/v032/016.webp","frame_time":2549.12},{"title":"离策略Actor-Critic算法的参数更新与超参数调整","segments":[{"id":158,"text":"Yeah, so can I explain the error from 4 to 1 and how are the parameters being updated? So this error is just saying that after we finish step 4, then we're going to go back to step 1 and collect a new batch of data. When we do that, we're going to keep our policy as it was at the current time step and keep on iterating. And so at this point, actually, theta will become the previous theta prime.","start":2705.74,"end":2732.18},{"id":159,"text":"and you'll be sampling a batch of data from your latest policy. And then the other thing here is that for this value function, you could warm start it at the previous value function, or you could train it from scratch. It depends a little bit on the domain. So in terms of these plots, the question is, do you fit the best set of hyperparameters and then run it?","start":2732.86,"end":2753.0},{"id":160,"text":"Yeah, so each of them will have its own set of hyperparameters, and the best practice is to figure out good hyperparameters on one environment or maybe two environments, and then apply those hyperparameters to the remaining environments in your experiments. There are scenarios where you might need a new set of hyperparameters for a different domain. For example, if you are controlling something at 1 Hz versus 50 Hz,","start":2753.81,"end":2778.03},{"id":161,"text":"or optimizing a language model versus a half cheetah, the hyperparameters will be different. So there is some variability there. One good practice is to not tune your hyperparameters per environment, because then you're essentially using more data, more samples, in order to get those hyperparameters in the first place, and that wouldn't be reflected on this curve right here. We should move on, but happy to answer it after class. So far we've talked about...","start":2778.48,"end":2809.17},{"id":162,"text":"using one batch of data for one gradient step. That's the fully on policy version. And we've looked at using one batch of policy data for multiple gradient steps. And this is off policy. What I'd like to talk about for the rest of the lecture is can we be even more off policy? So can we reuse previous batches of data rather than recollecting a new batch each time? Like all of the past trial and error experience. And there's two ideas for doing this. One is that we actually need to...","start":2809.55,"end":2838.88},{"id":163,"text":"retain all of our past data. We'll use a term called a replay buffer that you actually saw in homework one, where we will have a data set of past data. We'll keep on adding to it. And at some point, we might also remove some very old data from it. This is called a replay buffer because you're sort of replaying your past experiences.","start":2839.38,"end":2860.72}],"notes":["本段讲解了离策略Actor-Critic算法中参数更新的机制，即在完成一个步骤后，回到初始步骤并收集新的数据批次，同时保持当前策略不变，继续迭代。这表明在离策略方法中，策略不会随着每次更新而改变，而是基于当前策略进行数据收集。","在调整超参数时，建议在少数环境中进行调优，然后将这些超参数应用到其他环境中。然而，不同领域可能需要不同的超参数设置，例如控制频率或优化目标不同，超参数可能需要重新调整。","本段还提到，使用一个批次的数据进行一次梯度更新是完全的策略内方法，而使用一个批次的数据进行多次梯度更新则是策略外方法。进一步的讨论集中在是否可以更彻底地利用过去的批次数据，而不是每次重新收集新的数据。","为了实现这一点，提出了两个想法：一是保留所有过去的数据，使用称为回放缓冲区（replay buffer）的机制，该机制在作业一中已经介绍过。回放缓冲区允许不断添加新的数据，并在适当的时候移除较旧的数据，从而实现对过去经验的重放。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2705.74,"end":2860.72,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2705.74,"text":"Yeah, so can I explain the error from 4 to 1 and how are the parameters being updated? So this error is just saying that after we finish step 4, then we're going to go back to step 1 and collect a new batch of data. When we do that, we're going to keep our policy as it was at the current time step and keep on iterating. And so at this point, actually, theta will become the previous theta prime."},{"start":2732.86,"text":"and you'll be sampling a batch of data from your latest policy. And then the other thing here is that for this value function, you could warm start it at the previous value function, or you could train it from scratch. It depends a little bit on the domain. So in terms of these plots, the question is, do you fit the best set of hyperparameters and then run it?"},{"start":2753.81,"text":"Yeah, so each of them will have its own set of hyperparameters, and the best practice is to figure out good hyperparameters on one environment or maybe two environments, and then apply those hyperparameters to the remaining environments in your experiments. There are scenarios where you might need a new set of hyperparameters for a different domain. For example, if you are controlling something at 1 Hz versus 50 Hz,"},{"start":2778.48,"text":"or optimizing a language model versus a half cheetah, the hyperparameters will be different. So there is some variability there. One good practice is to not tune your hyperparameters per environment, because then you're essentially using more data, more samples, in order to get those hyperparameters in the first place, and that wouldn't be reflected on this curve right here. We should move on, but happy to answer it after class. So far we've talked about..."},{"start":2809.55,"text":"using one batch of data for one gradient step. That's the fully on policy version. And we've looked at using one batch of policy data for multiple gradient steps. And this is off policy. What I'd like to talk about for the rest of the lecture is can we be even more off policy? So can we reuse previous batches of data rather than recollecting a new batch each time? Like all of the past trial and error experience. And there's two ideas for doing this. One is that we actually need to..."},{"start":2839.38,"text":"retain all of our past data. We'll use a term called a replay buffer that you actually saw in homework one, where we will have a data set of past data. We'll keep on adding to it. And at some point, we might also remove some very old data from it. This is called a replay buffer because you're sort of replaying your past experiences."}],"speech_gaps":[],"frame":"../frames/v032/017.webp","frame_time":2717.74},{"title":"使用经验回放缓冲区的离策略Actor-Critic算法","segments":[{"id":164,"text":"And then the second idea is we actually need to adjust some of the equations to remove some of the on-policy assumptions in order to be able to actually use all of our past data. Okay, so what this looks like is we'll take our actor-critic algorithm, but to make it off-policy, we can think of it as getting one timestep of data, then updating our policy, getting another timestep, updating our policy, and so forth. So rather than getting one batch and then doing updates, we can actually do this much more online.","start":2862.59,"end":2891.19},{"id":165,"text":"And when we update our policy, this will actually be coming from a replay buffer. We'll be actually doing gradient steps using all of our past experiences rather than just our immediate past experience. And so in particular, when we collect experience, we'll want to then add this to our replay buffer. And when we then update our policy, we want to use a mini batch sampled from all previous data rather than just our last batch of data.","start":2892.73,"end":2922.56},{"id":166,"text":"So that's kind of like the modifications we need to make in order to use a replay buffer. So walking through this, we start with an empty replay buffer. We then collect experience from our policy. We add that to the replay buffer. And then we sample a batch, a transition state action reward and next state from the replay buffer.","start":2923.43,"end":2946.78},{"id":167,"text":"There's a small probability this could be exactly what we just sampled, but otherwise it'll be something randomly sampled from our previous experience. Then we'll update our value function using the batch of data that we just sampled from the buffer. We can update our value function with the same objective before, but now we're going to be averaging over our mini-batch. And then we can evaluate the advantage and then take a gradient step on our policy.","start":2947.64,"end":2977.37},{"id":168,"text":"So that's kind of the mechanics of replay buffers. Now, and yeah, finally update the policy and then kind of repeat this process. Unfortunately, this algorithm right now is currently broken. It is broken in two different ways. The first way that it's broken is right here. So say that we're using bootstrapping to update our value function. Then our target would be the reward at the current time step plus our value estimate.","start":2979.15,"end":3011.11}],"notes":["本段讲解了使用经验回放缓冲区（replay buffer）来实现离策略（off-policy）Actor-Critic算法的关键修改。教师指出，传统的策略更新依赖于即时经验，而使用回放缓冲区可以利用所有过去的经验数据，从而提高算法的效率和稳定性。教师还提到，当更新策略时，应从回放缓冲区中采样一个mini-batch，而不是仅使用最近的数据。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2862.59,"end":3011.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2862.59,"text":"And then the second idea is we actually need to adjust some of the equations to remove some of the on-policy assumptions in order to be able to actually use all of our past data. Okay, so what this looks like is we'll take our actor-critic algorithm, but to make it off-policy, we can think of it as getting one timestep of data, then updating our policy, getting another timestep, updating our policy, and so forth. So rather than getting one batch and then doing updates, we can actually do this much more online."},{"start":2892.73,"text":"And when we update our policy, this will actually be coming from a replay buffer. We'll be actually doing gradient steps using all of our past experiences rather than just our immediate past experience. And so in particular, when we collect experience, we'll want to then add this to our replay buffer. And when we then update our policy, we want to use a mini batch sampled from all previous data rather than just our last batch of data."},{"start":2923.43,"text":"So that's kind of like the modifications we need to make in order to use a replay buffer. So walking through this, we start with an empty replay buffer. We then collect experience from our policy. We add that to the replay buffer. And then we sample a batch, a transition state action reward and next state from the replay buffer."},{"start":2947.64,"text":"There's a small probability this could be exactly what we just sampled, but otherwise it'll be something randomly sampled from our previous experience. Then we'll update our value function using the batch of data that we just sampled from the buffer. We can update our value function with the same objective before, but now we're going to be averaging over our mini-batch. And then we can evaluate the advantage and then take a gradient step on our policy."},{"start":2979.15,"text":"So that's kind of the mechanics of replay buffers. Now, and yeah, finally update the policy and then kind of repeat this process. Unfortunately, this algorithm right now is currently broken. It is broken in two different ways. The first way that it's broken is right here. So say that we're using bootstrapping to update our value function. Then our target would be the reward at the current time step plus our value estimate."}],"speech_gaps":[],"frame":"../frames/v032/018.webp","frame_time":2874.59},{"title":"Off-Policy Actor Critic算法中价值函数的策略归属问题","segments":[{"id":169,"text":"for the next state. And so I have a question for you. And the question is, when we're fitting a value function on all of the data in the replay buffer, so this is the data from all of our previous policies, the question is, what policy are we learning a value function for when we fit the value function this way from data in our replay buffer? And so I'll give you kind of two minutes to discuss that, and then we'll come back. Okay, let's come back.","start":3011.79,"end":3042.76},{"id":170,"text":"I also should have maybe mentioned that this question is the answer is not as clean as some other questions. So the response there was that the so for our latest policy, we actually don't have any. Well, we have.","start":3043.65,"end":3057.89},{"id":171,"text":"we have maybe one data point from that policy, but most of the buffer is not, like the rest of the buffer is not from that policy, right? And so we don't actually have any really much data at all from our current policy. So it's not our current policy. And that's why this is incorrect. And in particular, when we collect kind of trajectories from previous policies, the actions will be different. And that means that the next state will also be different when you took that action, as well as the reward.","start":3058.56,"end":3085.88},{"id":172,"text":"Yeah, so the policy that you're going to be learning a value function for, I'll phrase it slightly differently. The policy that you'll be learning a value function for is sort of some sort of mixture of all of your past policies. It's actually not trivial to write it down. If things were collected in a particular way, the policy might look something like an average.","start":3086.73,"end":3114.09},{"id":173,"text":"over like your previous policies. If you had n previous policies. Now it's actually a little bit different than this because in some states you might like one policy might have kind of gone over here and another policy might have gone over here. And so then in this state it's going to be a mixture of policies but in this state it's going to be more of this policy and this state it's going to be a different policy. So it's actually a little bit messy but","start":3115.08,"end":3140.28},{"id":174,"text":"The thing that's definitive is that it's not going to be a value function for your current policy. And we would like to get a value function for our current policy using data from previous policies so that we can actually estimate this advantage for our current policy and get an accurate gradient for our current policy. It's a little bit messy, but it's a policy that is kind of a conglomeration of your previous policies.","start":3140.68,"end":3167.86}],"notes":["本段讨论了在使用经验回放缓冲区中的数据拟合价值函数时，所学习的价值函数对应的策略问题。讲者指出，由于缓冲区中的数据来自多个不同的策略，因此价值函数并不是针对当前策略的，而是某种过去策略的混合。","讲者强调，当前策略的数据在缓冲区中非常有限，因此无法直接使用这些数据来估计当前策略的优势函数和梯度。这表明，使用过去策略的数据来估计当前策略的性能存在一定的挑战。","讲者进一步说明，不同策略在不同状态下的行为可能不同，因此价值函数的混合形式会根据状态而变化。这种混合形式并不是简单的平均，而是根据状态的不同而有所变化。","讲者指出，尽管这种混合形式较为复杂，但其核心结论是：价值函数并不是针对当前策略的。因此，需要找到一种方法，利用过去策略的数据来估计当前策略的价值函数。","讲者提到，这种混合策略的复杂性使得在实际应用中需要特别注意如何处理不同策略之间的差异，以确保价值函数的估计能够准确反映当前策略的性能。","最后，讲者总结了这一问题的核心：使用过去策略的数据来估计当前策略的价值函数，虽然存在挑战，但这是实现Off-Policy Actor-Critic算法的关键步骤之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3011.79,"end":3167.86,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3011.79,"text":"for the next state. And so I have a question for you. And the question is, when we're fitting a value function on all of the data in the replay buffer, so this is the data from all of our previous policies, the question is, what policy are we learning a value function for when we fit the value function this way from data in our replay buffer? And so I'll give you kind of two minutes to discuss that, and then we'll come back. Okay, let's come back."},{"start":3043.65,"text":"I also should have maybe mentioned that this question is the answer is not as clean as some other questions. So the response there was that the so for our latest policy, we actually don't have any. Well, we have."},{"start":3058.56,"text":"we have maybe one data point from that policy, but most of the buffer is not, like the rest of the buffer is not from that policy, right? And so we don't actually have any really much data at all from our current policy. So it's not our current policy. And that's why this is incorrect. And in particular, when we collect kind of trajectories from previous policies, the actions will be different. And that means that the next state will also be different when you took that action, as well as the reward."},{"start":3086.73,"text":"Yeah, so the policy that you're going to be learning a value function for, I'll phrase it slightly differently. The policy that you'll be learning a value function for is sort of some sort of mixture of all of your past policies. It's actually not trivial to write it down. If things were collected in a particular way, the policy might look something like an average."},{"start":3115.08,"text":"over like your previous policies. If you had n previous policies. Now it's actually a little bit different than this because in some states you might like one policy might have kind of gone over here and another policy might have gone over here. And so then in this state it's going to be a mixture of policies but in this state it's going to be more of this policy and this state it's going to be a different policy. So it's actually a little bit messy but"},{"start":3140.68,"text":"The thing that's definitive is that it's not going to be a value function for your current policy. And we would like to get a value function for our current policy using data from previous policies so that we can actually estimate this advantage for our current policy and get an accurate gradient for our current policy. It's a little bit messy, but it's a policy that is kind of a conglomeration of your previous policies."}],"speech_gaps":[],"frame":"../frames/v032/019.webp","frame_time":3023.79},{"title":"Off-Policy Actor Critic算法中的价值函数与Q函数","segments":[{"id":175,"text":"or some kind of mixture of your previous policies. It's not something that you can very cleanly write down, but it's a mixture of your past policies. The other thing that's a bit wrong about this is that here, this is also not the action that the policy would have taken. Likewise, when you pass the action into the advantage, that's also not the action that the policy would have taken. And so we'll also see how we can fix that part.","start":3169.21,"end":3197.02},{"id":176,"text":"But first, let's talk about the value function. And we have this key question of how do we fit a value function for our current policy using a replay buffer of data from past policies? So one idea here is instead of trying to fit v, what if we try to fit q instead of v? So we can remember that q","start":3197.92,"end":3226.72},{"id":177,"text":"The Q function is very similar to the value function, but it's the sum of rewards if we start at S and take action A.","start":3229.14,"end":3236.68},{"id":178,"text":"So you can think of it as the sum over, say this is S, T, and A, T.","start":3237.2,"end":3244.04},{"id":179,"text":"This is the sum of time steps starting at T, maybe the end of the trajectory of the reward.","start":3244.52,"end":3252.76},{"id":180,"text":"board, r of s t prime a t prime, under the expe r the next action for our policy.","start":3504.38,"end":3535.3},{"id":205,"text":"For this data, we have this action, and for the Q function, it takes its input and action, but the rest of the trajectory was still following a different policy. And the Q needs to be summing the rewards for our current policy, not the other policy. And the thing that we've done here is that if we represent this Q in terms of Q for our current policy,","start":3537.4,"end":3564.27},{"id":206,"text":"This second term right here is actually not using the future data at all. It's using, well, the S prime, we will be using the data, but it's not using anything after S prime. And in particular, we're using our kind of bootstrapped estimate of Q at the next time step.","start":3564.84,"end":3588.48},{"id":207,"text":"for the next action, instead of using the action that was taken in our data, we can use the action sampled from our current policy. So we're recursively defining the Q function here, and the only things that we'll... Maybe we could actually just kind of go through the next part. So what we'll do here is we'll sample an SAS' from the buffer. This A was from an old policy, but the dynamics are constant, right?","start":3590.72,"end":3619.11},{"id":208,"text":"And then we'll sample an A' from our current policy.","start":3620.14,"end":3624.32},{"id":209,"text":"This is a sample from our current policy conditioned on S'.","start":3624.66,"end":3629.58},{"id":210,"text":"And then we can estimate the Q function as the reward at the current time step","start":3631.22,"end":3636.44},{"id":211,"text":"plus the Q function for the next state in the buffer","start":3636.44,"end":3642.18},{"id":212,"text":"and an action sampled from our policy here.","start":3642.18,"end":3645.6},{"id":213,"text":"And because this action is sampled from our policy,","start":3645.76,"end":3647.8},{"id":214,"text":"rather than from the data set,","start":3647.8,"end":3651.54},{"id":215,"text":"then we're actually getting an estimate","start":3651.72,"end":3653.34},{"id":216,"text":"for our current policy's Q function.","start":3653.82,"end":3655.92},{"id":217,"text":"So yeah, good question.","start":3656.82,"end":3657.78},{"id":218,"text":"So the question was,","start":3657.84,"end":3658.38},{"id":219,"text":"does this require that we see data","start":3658.48,"end":3659.9},{"id":220,"text":"from all possible state action pairs?","start":3659.9,"end":3661.66},{"id":221,"text":"There is a very good insight there.","start":3664.14,"end":3667.04},{"id":222,"text":"We don't actually need to see data","start":3667.18,"end":3669.18},{"id":223,"text":"from all state action pairs,","start":3669.18,"end":3670.4},{"id":224,"text":"but it means that for this target to be accurate,","start":3670.54,"end":3672.86},{"id":225,"text":"we do need to have data that covers actions","start":3673.08,"end":3676.48},{"id":226,"text":"that are similar to what our policy would be taking and if we haven't seen that data this","start":3676.48,"end":3681.28}],"notes":["本段讲解了在Off-Policy Actor-Critic算法中，Q函数的定义和更新方式。Q函数表示在某个状态和动作下，未来奖励的期望值。在更新过程中，使用了当前策略采样的动作，而不是数据集中记录的动作，从而确保Q函数的估计是基于当前策略的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3504.38,"end":3681.28,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3504.38,"text":"to a target that looks like this. And so we have our definition of the Q function of the future rewards condition on the state in action. And for any state in action, we have this equivalence where Q for pi theta of SA is the reward at the current time step plus the Q function at the next time step where the next time you have an expectation over the next time step and an expectation over the next action for our policy. Yeah, good question. So the question was,"},{"start":3537.4,"text":"For this data, we have this action, and for the Q function, it takes its input and action, but the rest of the trajectory was still following 235,"text":"if you don't have any data from that state, that's a problem. And then if you have data from that state but only for very different actions, it's also a problem. Some of this is also going to be relying on... neural networks can generalize, can interpolate reasonably well, and so that helps this. But you do need sufficient coverage for this to be accurate. Yeah, so the question... we actually didn't quite get to this equation on the board. We have this expectation here over the next state and an action sample from our policy.","start":3757.31,"end":3786.52},{"id":236,"text":"And this equation estimates this with a single sample where we have ST and AT. And then we're going to use the ST plus 1 from our data set, which is just one example to estimate this part. And then in this equation, we'll use one sample, AT plus 1, in order to estimate this.","start":3787.0,"end":3812.08},{"id":237,"text":"And then if you have data from that state but only for very different actions, it's also a problem.","start":3812.55,"end":3816.93},{"id":238,"text":"Some of this is also going to be relying on... neural networks can generalize, can interpolate reasonably well, and so that helps this.","start":3816.93,"end":3822.79},{"id":239,"text":"in a batch, you'll be sampling from your current policy. And so if you sample,","start":3824.45,"end":3828.05},{"id":240,"text":"We have this expectation here over the next state and an action sample from our policy.","start":3828.17,"end":3834.29},{"id":241,"text":"And this equation estimates this with a single sample where we have ST and AT.","start":3834.49,"end":3838.09},{"id":242,"text":"And then we're going to use the ST plus 1 from our data set, which is just one example to estimate this part.","start":3838.85,"end":3844.41},{"id":243,"text":"And then in this equation, we'll use one sample, AT plus 1, in order to estimate this.","start":3844.41,"end":3848.67},{"id":244,"text":"There are actually methods that you can use multiple samples to estimate this to get a better estimate of this expectation.","start":3848.67,"end":3856.07}],"notes":["本段主要讨论在使用Off-Policy Actor Critic算法时，Q函数的估计需要依赖当前策略的数据收集。即使使用旧数据，也需要足够的覆盖，以确保估计的准确性。"],"formulas":[{"latex":"E_{s_{t+1}, a_{t+1}}[...]","symbols":"期望值计算基于下一个状态和动作样本","explanation":"该公式正确表达了期望值的计算，基于下一个状态和动作样本。","evidence":"each data point will get a different sample. So you also get multiple samples in that way."}],"uncertainties":["在讲者提到的KL约束问题中，未明确说明具体算法名称或实现方式，因此无法确定是否需要引入此类约束。"],"diagram":"none","start":3681.28,"end":3856.07,"asr_flags":[],"math_clarifications":["公式中的符号ρ应为γ（gamma），以符合强化学习的标准符号惯例。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3681.28,"text":"Q function is going to be inaccurate and you'll need to kind of collect data from your current"},{"start":3688.42,"text":"policy in order to get that. So this isn't like... we're not getting a really good estimate of our"},{"start":3695.42,"text":"Q function for free based on past policies. We still need decent coverage of what our policy"},{"start":3699.88,"text":"would have done but it means that the... this does actually provide somewhat of a means to use old"},{"start":3705.7,"text":"data. And so I guess just to finish this slide and then come back to that point,"},{"start":3710.56,"text":"we'll be using r plus gamma times q as our"},{"start":3716.99,"text":"And then we can use supervised learning to pass as input the state in action to a neural network and then try to output this label right here. And again, we can use kind of a similar L2 error between our prediction and the target, just like with the value function."},{"start":3734.67,"text":"And to be accurate, these targets need to have sufficient action coverage. The action taken from your policy can't be wildly out of distribution. Otherwise, these targets will be inaccurate. Yeah, so we'll need to have taken that action from that state. And so this does make it like you need to have..."},{"start":3757.31,"text":"if you don't have any data from that state, that's a problem. And then if you have data from that state but only for very different actions, it's also a problem. Some of this is also going to be relying on... neural networks can generalize, can interpolate reasonably well, and so that helps this. But you do need sufficient coverage for this to be accurate. Yeah, so the question... we actually didn't quite get to this equation on the board. We have this expectation here over the next state and an action sample from our policy."},{"start":3787.0,"text":"And this equation estimates this with a single sample where we have ST and AT. And then we're going to use the ST plus 1 from our data set, which is just one example to estimate this part. And then in this equation, we'll use one sample, AT plus 1, in order to estimate this."},{"start":3812.55,"text":"there are actually methods that you can use multiple samples to estimate this to get"},{"start":3816.93,"text":"a better estimate of this expectation. You could also, as you're taking, if you take"},{"start":3824.45,"text":"in a batch, you'll be sampling from your current policy. And so if you sample,"},{"start":3828.17,"text":"each data point will get a different sample. So you also get multiple samples in that way."},{"start":3834.49,"text":"But yeah, even for a single state, next state, you could also sample multiple actions here."},{"start":3838.85,"text":"Yeah, yeah. So we mentioned that we need sufficient action coverage here. The question"},{"start":3844.41,"text":"was if we use a KL constraint or something similar to encourage it to stay close to the"},{"start":3848.67,"text":"previous policy, would that be helpful here? And I think that one of the algorithms that we'll see"}],"speech_gaps":[],"frame":"../frames/v032/023.webp","frame_time":3693.28},{"title":"Off-Policy Actor Critic算法中的策略更新与状态分布问题","segments":[{"id":245,"text":"doesn't do that, but it's a good idea. And in general, we'll see that those kinds of KL","start":3856.07,"end":3864.09},{"id":246,"text":"constraints come up quite frequently in reinforcement learning because we'll often","start":3864.09,"end":3867.37},{"id":247,"text":"be assuming that we're not deviating too far from our previous policy. And yeah, it's","start":3867.37,"end":3875.83},{"id":248,"text":"possible that for the algorithm that we'll see, that could make it better in some circumstances,","start":3876.89,"end":3880.39},{"id":249,"text":"too. Okay, so to walk through... Okay, well, so I guess what we talked about is we'll be updating","start":3880.49,"end":3890.35},{"id":250,"text":"Q hat with our target Y, where the target is R plus the Q. And critically, the state SI will","start":3890.35,"end":3899.13},{"id":251,"text":"be sampled from the replay buffer, but the next action will not be from the replay buffer. It'll","start":3899.13,"end":3905.09},{"id":252,"text":"be sampled from our policy conditioned on that next state from the buffer.","start":3905.09,"end":3909.13},{"id":253,"text":"Cool. So that'll be our revised step three for the algorithm.","start":3911.75,"end":3915.29},{"id":254,"text":"them. The last thing is what we want to do here. So we have","start":3915.29,"end":3920.29},{"id":255,"text":"Instead of estimating the value function, we estimated the Q function. There's a couple things that we'll do here for this update. The first is that it'll be convenient to use Q instead of A, and this means that we're not going to use a baseline. This is going to be higher variance, but that's going to be okay because we're going to be using a lot more data, like all the data from our buffer, not just the data from our current policy.","start":3921.58,"end":3950.63},{"id":256,"text":"And then the second is that the current policies actions are likely better than the past policies actions. And so for this update right here, we'll be sampling an A from our current policy instead of from the action taken in the buffer. And then this will be the gradient update on our policy where...","start":3951.92,"end":3972.46},{"id":257,"text":"We'll be looking at log pi of a given s times q of sa. These a's will be sampled from our policy, but essentially using the same trick as what we did with the q function, except now for the current state instead of the next state. So here's our full algorithm. There's sort of one remaining problem, which is that the states in our buffer didn't come from our current policy.","start":3973.24,"end":3997.0},{"id":258,"text":"There isn't really anything that we can do here, but it's actually not necessarily a bad thing. It means that we're going to be getting a policy on a broader state distribution rather than just on the state distribution that our policy would visit. Okay, so this is essentially the soft actor critic algorithm. There are other ways to estimate this gradient that we don't have time to get into today, but we might go over in future lectures.","start":3997.93,"end":4024.77}],"notes":["本段主要讨论在强化学习中使用KL约束的常见性，以及在策略更新过程中如何处理状态分布的问题。讲者指出，KL约束常用于确保策略不会偏离之前的策略太远，这在算法设计中是一个重要的考虑因素。","在算法更新过程中，Q函数被用来替代价值函数，这使得不需要使用基线，虽然会增加方差，但可以通过使用更多数据来弥补。讲者提到，当前策略的动作通常比过去策略的动作更好，因此在更新时会从当前策略中采样动作。","讲者还指出，缓冲区中的状态可能并非来自当前策略，这会导致策略在更广泛的状态分布上进行学习，而不是仅限于当前策略访问的状态分布。这种设计虽然无法直接解决状态分布的问题，但有助于提升策略的泛化能力。","最后，讲者提到这是软演员评论算法（Soft Actor-Critic）的核心思想，并指出还有其他方法可以估计梯度，但这些内容将在未来的课程中进一步探讨。","讲者强调了在策略更新过程中，使用当前策略采样动作的重要性，以及如何通过Q函数和策略梯度的结合来实现策略的优化。","整个段落围绕策略更新的实现细节展开，包括如何处理状态分布的问题，以及如何通过使用更多数据来提高算法的稳定性。"],"formulas":[{"latex":"\\log \\pi(a|s) \\times q(s,a)","symbols":"对数策略概率乘以Q函数","explanation":"公式正确，表示对数策略概率与Q函数的乘积，适用于策略梯度方法中的梯度更新。","evidence":"We'll be looking at log pi of a given s times q of sa. These a's will be sampled from our policy, but essentially using the same trick as what we did with the q function, except now for the current state instead of the next state. So here's our full algorithm. There's sort of one remaining problem, which is that the states in our buffer didn't come from our current policy."}],"uncertainties":["SI"],"diagram":"none","start":3856.07,"end":4024.77,"asr_flags":[],"math_clarifications":["公式中的符号和数学表达正确，无需进一步修正。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3856.07,"text":"doesn't do that, but it's a good idea. And in general, we'll see that those kinds of KL"},{"start":3864.09,"text":"constraints come up quite frequently in reinforcement learning because we'll often"},{"start":3867.37,"text":"be assuming that we're not deviating too far from our previous policy. And yeah, it's"},{"start":3876.89,"text":"possible that for the algorithm that we'll see, that could make it better in some circumstances,"},{"start":3880.49,"text":"too. Okay, so to walk through... Okay, well, so I guess what we talked about is we'll be updating"},{"start":3890.35,"text":"Q hat with our target Y, where the target is R plus the Q. And critically, the state SI will"},{"start":3899.13,"text":"be sampled from the replay buffer, but the next action will not be from the replay buffer. It'll"},{"start":3905.09,"text":"be sampled from our policy conditioned on that next state from the buffer."},{"start":3911.75,"text":"Cool. So that'll be our revised step three for the algorithm."},{"start":3915.29,"text":"them. The last thing is what we want to do here. So we have"},{"start":3921.58,"text":"Instead of estimating the value function, we estimated the Q function. There's a couple things that we'll do here for this update. The first is that it'll be convenient to use Q instead of A, and this means that we're not going to use a baseline. This is going to be higher variance, but that's going to be okay because we're going to be using a lot more data, like all the data from our buffer, not just the data from our current policy."},{"start":3951.92,"text":"And then the second is that the current policies actions are likely better than the past policies actions. And so for this update right here, we'll be sampling an A from our current policy instead of from the action taken in the buffer. And then this will be the gradient update on our policy where..."},{"start":3973.24,"text":"We'll be looking at log pi of a given s times q of sa. These a's will be sampled from our policy, but essentially using the same trick as what we did with the q function, except now for the current state instead of the next state. So here's our full algorithm. There's sort of one remaining problem, which is that the states in our buffer didn't come from our current policy."},{"start":3997.93,"text":"There isn't really anything that we can do here, but it's actually not necessarily a bad thing. It means that we're going to be getting a policy on a broader state distribution rather than just on the state distribution that our policy would visit. Okay, so this is essentially the soft actor critic algorithm. There are other ways to estimate this gradient that we don't have time to get into today, but we might go over in future lectures."}],"speech_gaps":[],"frame":"../frames/v032/024.webp","frame_time":3868.07},{"title":"SAC与PPO的对比及强化学习在真实机器人上的应用","segments":[{"id":259,"text":"There are also some fancier ways to fit this Q function that we'll see in the next lecture. But the algorithm here that this is very, very close to is called Soft-Tactor Critic or SAC. And if we compare SAC and PPO, the more off-policy version that uses a replay buffer is shown in orange and the less off-policy is shown in brown.","start":4025.41,"end":4047.31},{"id":260,"text":"And so we see that we're able to get much more data-efficient learning with something like SAC than with something that's less off-policy. So you can be far, far more data-efficient when you use this replay buffer. The downside is that it can be a lot harder to tune hyperparameters, and generally it can be a bit less stable when you're using these few functions than compared to PPO.","start":4047.89,"end":4078.22},{"id":261,"text":"In about two hours, the policy learns how to walk forward just with the algorithm that we talked about. You can also learn some kind of cool manipulation tasks with reinforcement learning. This was seeded with demonstrations. It's a very precise task. And you can see that actually if you compare the performance of this RL method, it actually gets 100% on all the tasks that they tested, whereas if you use imitation learning, you'll get a much lower success rate.","start":4078.88,"end":4104.64},{"id":262,"text":"And reinforcement learning also leads to a faster policy than with imitation learning. And then PPO is a common algorithm that's used if you want really stable learning, but less data efficient learning. And so if you're in simulation, for example, data is not a problem. You can collect tons and tons of data in simulation and you can learn a policy in simulation. And then if you carefully tune your simulator, that policy might be able to transfer to the real world.","start":4105.34,"end":4131.38},{"id":263,"text":"And then there was also an example of, in general, for manipulation, sim-to-real transfer is a lot harder. We're learning how to do a Rubik's Cube that was trained in simulation. And after about five minutes of this rollout, you get a Rubik's Cube that has been completed. And that was with PPO. PPO is also a common choice for language models. We'll start to discuss them next week.","start":4131.89,"end":4155.64}],"notes":["本段主要讲解了SAC（Soft Actor-Critic）算法相较于PPO（Proximal Policy Optimization）在数据效率上的优势，以及使用经验回放缓冲区（replay buffer）带来的挑战。SAC在数据效率上更高，但参数调优更困难，且稳定性略差。同时，强调了在真实机器人上使用完全离策略（fully off-policy）方法的可行性，例如在两小时内通过算法学习行走任务。","本段通过具体例子说明了强化学习在精细任务中的表现，如使用演示数据（seeded with demonstrations）进行的机器人操作任务。与模仿学习（imitation learning）相比，强化学习在测试任务中达到了100%的成功率，而模仿学习的成功率较低。这表明强化学习在任务精度和泛化能力上具有优势。","本段讨论了PPO算法在稳定学习方面的优势，但数据效率较低。在仿真环境中，数据获取相对容易，因此可以训练出在仿真中表现良好的策略，并通过精细调整仿真器（simulator）实现策略在真实世界中的迁移（sim-to-real transfer）。","本段以魔方（Rubik's Cube）任务为例，说明了仿真到现实的迁移在操作任务中尤为困难。通过PPO算法，仅需五分钟的仿真运行即可完成魔方任务，展示了强化学习在复杂任务中的潜力。此外，PPO也被广泛应用于语言模型的训练中，将在下节课中进一步讨论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4025.41,"end":4155.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4025.41,"text":"There are also some fancier ways to fit this Q function that we'll see in the next lecture. But the algorithm here that this is very, very close to is called Soft-Tactor Critic or SAC. And if we compare SAC and PPO, the more off-policy version that uses a replay buffer is shown in orange and the less off-policy is shown in brown."},{"start":4047.89,"text":"And so we see that we're able to get much more data-efficient learning with something like SAC than with something that's less off-policy. So you can be far, far more data-efficient when you use this replay buffer. The downside is that it can be a lot harder to tune hyperparameters, and generally it can be a bit less stable when you're using these few functions than compared to PPO. Cool. And then lastly, when you're fully off-policy, you can actually be efficient enough to run reinforcement learning on real robots. So in this example,"},{"start":4078.88,"text":"In about two hours, the policy learns how to walk forward just with the algorithm that we talked about. You can also learn some kind of cool manipulation tasks with reinforcement learning. This was seeded with demonstrations. It's a very precise task. And you can see that actually if you compare the performance of this RL method, it actually gets 100% on all the tasks that they tested, whereas if you use imitation learning, you'll get a much lower success rate."},{"start":4105.34,"text":"And reinforcement learning also leads to a faster policy than with imitation learning. And then PPO is a common algorithm that's used if you want really stable learning, but less data efficient learning. And so if you're in simulation, for example, data is not a problem. You can collect tons and tons of data in simulation and you can learn a policy in simulation. And then if you carefully tune your simulator, that policy might be able to transfer to the real world."},{"start":4131.89,"text":"And then there was also an example of, in general, for manipulation, sim-to-real transfer is a lot harder. We're learning how to do a Rubik's Cube that was trained in simulation. And after about five minutes of this rollout, you get a Rubik's Cube that has been completed. And that was with PPO. PPO is also a common choice for language models. We'll start to discuss them next week."}],"speech_gaps":[],"frame":"../frames/v032/025.webp","frame_time":4037.41}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
