"text":"This is a sample from our current policy conditioned on S'."},{"start":3631.22,"text":"And then we can estimate the Q function as the reward at the current time step"},{"start":3636.44,"text":"plus the Q function for the next state in the buffer"},{"start":3642.18,"text":"and an action sampled from our policy here."},{"start":3645.76,"text":"And because this action is sampled from our policy,"},{"start":3647.8,"text":"rather than from the data set,"},{"start":3651.72,"text":"then we're actually getting an estimate"},{"start":3653.82,"text":"for our current policy's Q function."},{"start":3656.82,"text":"So yeah, good question."},{"start":3657.84,"text":"So the question was,"},{"start":3658.48,"text":"does this require that we see data"},{"start":3659.9,"text":"from all possible state action pairs?"},{"start":3664.14,"text":"There is a very good insight there."},{"start":3667.18,"text":"We don't actually need to see data"},{"start":3669.18,"text":"from all state action pairs,"},{"start":3670.54,"text":"but it means that for this target to be accurate,"},{"start":3673.08,"text":"we do need to have data that covers actions"},{"start":3676.48,"text":"that are similar to what our policy would be taking and if we haven't seen that data this"}],"speech_gaps":[],"frame":"../frames/v032/022.webp","frame_time":3516.38},{"title":"Off-Policy Actor Critic算法中的目标函数与数据覆盖","segments":[{"id":227,"text":"Q function is going to be inaccurate and you'll need to kind of collect data from your current policy in order to get that.","zh":"Q函数将会不准确，你需要从当前策略中收集数据，才能获得该值。","start":3681.28,"end":3688.42},{"id":228,"text":"So this isn't like... we're not getting a really good estimate of our Q function for free based on past policies.","zh":"因此，这不是像……我们不是基于过去的策略，就能免费获得一个很好的Q函数估计值。","start":3688.42,"end":3695.42},{"id":229,"text":"Q function for free based on past policies. We still need decent coverage of what our policy","zh":"基于过去策略的Q函数。我们仍然需要对当前策略的哪些状态有良好的数据覆盖","start":3695.42,"end":3699.88},{"id":230,"text":"And so I guess just to finish this slide and then come back to that point, we'll be using r plus gamma times q as our target.","zh":"因此，我想只是为了完成这张幻灯片并回到那个观点，我们将使用r加上gamma乘以q作为我们的目标。","start":3699.88,"end":3705.7},{"id":231,"text":"data. And so I guess just to finish this slide and then come back to that point,","zh":"数据。因此，我想只是为了完成这张幻灯片并回到那个观点，","start":3705.7,"end":3710.44},{"id":232,"text":"we'll be using r plus gamma times q as our","zh":"我们将使用r加上gamma乘以q作为我们的","start":3710.56,"end":3715.46},{"id":233,"text":"And then we can use supervised learning to pass as input the state in action to a neural network and then try to output this label right here. And again, we can use kind of a similar L2 error between our prediction and the target, just like with the value function.","zh":"然后我们可以使用监督学习，将状态和动作作为输入传递给神经网络，然后尝试输出这个标签。同样，我们也可以使用类似于价值函数的L2误差，来衡量我们的预测值和目标值之间的差异。","start":3716.99,"end":3733.44},{"id":234,"text":"And to be accurate, these targets need to have sufficient action coverage. The action taken from your policy can't be wildly out of distribution. Otherwise, these targets will be inaccurate. Yeah, so we'll need to have taken that action from that state. And so this does make it like you need to have...","zh":"为了准确起见，这些目标值需要有足够的动作覆盖。从你的策略中采取的动作不能与分布相差太大，否则这些目标值将会不准确。是的，因此我们需要在该状态下采取过该动作。因此，这就意味着你需要……","start":3734.67,"end":3755.31},{"id":235,"text":"if you don't have any data from that state, that's a problem. And then if you have data from that state but only for very different actions, it's also a problem. Some of this is also going to be relying on... neural networks can generalize, can interpolate reasonably well, and so that helps this. But you do need sufficient coverage for this to be accurate. Yeah, so the question... we actually didn't quite get to this equation on the board. We have this expectation here over the next state and an action sample from our policy.","zh":"如果你没有任何来自该状态的数据，这就会出现问题。如果你有来自该状态的数据，但只针对非常不同的动作，这也是一个问题。其中一些问题也会依赖于……神经网络可以进行泛化，可以合理地进行插值，因此这有助于解决这些问题。但你确实需要足够的覆盖范围才能保证准确性。是的，所以问题是……我们实际上在黑板上并没有完全推导出这个方程。我们这里有一个关于下一个状态和一个来自我们策略的动作样本的期望。","start":3757.31,"end":3786.52},{"id":236,"text":"And this equation estimates this with a single sample where we have ST and AT. And then we're going to use the ST plus 1 from our data set, which is just one example to estimate this part. And then in this equation, we'll use one sample, AT plus 1, in order to estimate this.","zh":"这个方程使用一个样本来估计这个期望，其中我们有ST和AT。然后我们将使用数据集中的ST加1来估计这一部分，这只是一个例子。在该方程中，我们将使用一个样本AT加1来估计这一部分。","start":3787.0,"end":3812.08},{"id":237,"text":"And then if you have data from that state but only for very different actions, it's also a problem.","zh":"如果你有来自该状态的数据，但只针对非常不同的动作，这也是一个问题。","start":3812.55,"end":3816.93},{"id":238,"text":"Some of this is also going to be relying on... neural networks can generalize, can interpolate reasonably well, and so that helps this.","zh":"其中一些问题也会依赖于……神经网络可以进行泛化，可以合理地进行插值，因此这有助于解决这些问题。","start":3816.93,"end":3822.79},{"id":239,"text":"in a batch, you'll be sampling from your current policy. And so if you sample,","zh":"在一个批次中，你将从当前策略中进行采样。因此，如果你进行采样，","start":3824.45,"end":3828.05},{"id":240,"text":"We have this expectation here over the next state and an action sample from our policy.","zh":"我们这里有一个关于下一个状态和一个来自我们策略的动作样本的期望。","start":3828.17,"end":3834.29},{"id":241,"text":"And this equation estimates this with a single sample where we have ST and AT.","zh":"这个方程使用一个样本来估计这个期望，其中我们有ST和AT。","start":3834.49,"end":3838.09},{"id":242,"text":"And then we're going to use the ST plus 1 from our data set, which is just one example to estimate this part.","zh":"然后我们将使用数据集中的ST加1来估计这一部分，这只是一个例子。","start":3838.85,"end":3844.41},{"id":243,"text":"And then in this equation, we'll use one sample, AT plus 1, in order to estimate this.","zh":"然后在这个等式中，我们将使用一个样本AT加1，来估计这个值。","start":3844.41,"end":3848.67},{"id":244,"text":"There are actually methods that you can use multiple samples to estimate this to get a better estimate of this expectation.","zh":"实际上有一些方法，你可以使用多个样本来估计这个值，以获得这个期望值更好的估计。","start":3848.67,"end":3856.07}],"notes":["本段主要讨论在使用Off-Policy Actor Critic算法时，Q函数的估计需要依赖当前策略的数据收集。即使使用旧数据，也需要足够的覆盖，以确保估计的准确性。"],"formulas":[{"latex":"E_{s_{t+1}, a_{t+1}}[...]","symbols":"期望值计算基于下一个状态和动作样本","explanation":"该公式正确表达了期望值的计算，基于下一个状态和动作样本。","evidence":"each data point will get a different sample. So you also get multiple samples in that way."}],"uncertainties":["在讲者提到的KL约束问题中，未明确说明具体算法名称或实现方式，因此无法确定是否需要引入此类约束。"],"diagram":"none","start":3681.28,"end":3856.07,"asr_flags":[],"math_clarifications":["公式中的符号ρ应为γ（gamma），以符合强化学习的标准符号惯例。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":3681.28,"text":"Q function is going to be inaccurate and you'll need to kind of collect data from your current"},{"start":3688.42,"text":"policy in order to get that. So this isn't like... we're not getting a really good estimate of our"},{"start":3695.42,"text":"Q function for free based on past policies. We still need decent coverage of what our policy"},{"start":3699.88,"text":"would have done but it means that the... this does actually provide somewhat of a means to use old"},{"start":3705.7,"text":"data. And so I guess just to finish this slide and then come back to that point,"},{"start":3710.56,"text":"we'll be using r plus gamma times q as our"},{"start":3716.99,"text":"And then we can use supervised learning to pass as input the state in action to a neural network and then try to output this label right here. And again, we can use kind of a similar L2 error between our prediction and the target, just like with the value function."},{"start":3734.67,"text":"And to be accurate, these targets need to have sufficient action coverage. The action taken from your policy can't be wildly out of distribution. Otherwise, these targets will be inaccurate. Yeah, so we'll need to have taken that action from that state. And so this does make it like you need to have..."},{"start":3757.31,"text":"if you don't have any data from that state, that's a problem. And then if you have data from that state but only for very different actions, it's also a problem. Some of this is also going to be relying on... neural networks can generalize, can interpolate reasonably well, and so that helps this. But you do need sufficient coverage for this to be accurate. Yeah, so the question... we actually didn't quite get to this equation on the board. We have this expectation here over the next state and an action sample from our policy."},{"start":3787.0,"text":"And this equation estimates this with a single sample where we have ST and AT. And then we're going to use the ST plus 1 from our data set, which is just one example to estimate this part. And then in this equation, we'll use one sample, AT plus 1, in order to estimate this."},{"start":3812.55,"text":"there are actually methods that you can use multiple samples to estimate this to get"},{"start":3816.93,"text":"a better estimate of this expectation. You could also, as you're taking, if you take"},{"start":3824.45,"text":"in a batch, you'll be sampling from your current policy. And so if you sample,"},{"start":3828.17,"text":"each data point will get a different sample. So you also get multiple samples in that way."},{"start":3834.49,"text":"But yeah, even for a single state, next state, you could also sample multiple actions here."},{"start":3838.85,"text":"Yeah, yeah. So we mentioned that we need sufficient action coverage here. The question"},{"start":3844.41,"text":"was if we use a KL constraint or something similar to encourage it to stay close to the"},{"start":3848.67,"text":"previous policy, would that be helpful here? And I think that one of the algorithms that we'll see"}],"speech_gaps":[],"frame":"../frames/v032/023.webp","frame_time":3693.28},{"title":"Off-Policy Actor Critic算法中的策略更新与状态分布问题","segments":[{"id":245,"text":"doesn't do that, but it's a good idea. And in general, we'll see that those kinds of KL","zh":"它没有这样做，但这是一个好主意。一般来说，我们会看到这类KL约束在强化学习中出现得相当频繁，因为我们通常会假设我们不会偏离之前的策略太远。","start":3856.07,"end":3864.09},{"id":246,"text":"constraints come up quite frequently in reinforcement learning because we'll often","zh":"并且，我们经常会遇到这些约束，因为我们通常会假设我们不会偏离之前的策略太远。","start":3864.09,"end":3867.37},{"id":247,"text":"be assuming that we're not deviating too far from our previous policy. And yeah, it's","zh":"而且，是的，对于我们将要看到的算法，这在某些情况下可能会使其表现更好。","start":3867.37,"end":3875.83},{"id":248,"text":"possible that for the algorithm that we'll see, that could make it better in some circumstances,","zh":"太好了，那么让我们来逐步讲解……好吧，我想我们讨论的是，我们将使用目标Y来更新Q hat，其中目标是R加上Q。关键的是，状态SI将","start":3876.89,"end":3880.39},{"id":249,"text":"too. Okay, so to walk through... Okay, well, so I guess what we talked about is we'll be updating","zh":"从经验回放缓冲区中采样，但下一个动作将不会从经验回放缓冲区中采样。它将根据缓冲区中下一个状态从我们的策略中采样。","start":3880.49,"end":3890.35},{"id":250,"text":"Q hat with our target Y, where the target is R plus the Q. And critically, the state SI will","zh":"Q hat 与我们的目标 Y，其中目标是 R 加上 Q。关键的是，状态 SI 将","start":3890.35,"end":3899.13},{"id":251,"text":"be sampled from the replay buffer, but the next action will not be from the replay buffer. It'll","zh":"从经验回放缓冲区中进行采样，但下一个动作将不会从经验回放缓冲区中进行采样。","start":3899.13,"end":3905.09},{"id":252,"text":"be sampled from our policy conditioned on that next state from the buffer.","zh":"它将从我们的策略中进行采样，该策略基于缓冲区中下一个状态进行条件化。","start":3905.09,"end":3909.13},{"id":253,"text":"Cool. So that'll be our revised step three for the algorithm.","zh":"好。所以这将是我们算法修订后的第三步。","start":3911.75,"end":3915.29},{"id":254,"text":"them. The last thing is what we want to do here. So we have","zh":"它们。最后我们要在这里做的事情是，所以我们有","start":3915.29,"end":3920.29},{"id":255,"text":"Instead of estimating the value function, we estimated the Q function. There's a couple things that we'll do here for this update. The first is that it'll be convenient to use Q instead of A, and this means that we're not going to use a baseline. This is going to be higher variance, but that's going to be okay because we're going to be using a lot more data, like all the data from our buffer, not just the data from our current policy.","zh":"我们不是估计价值函数，而是估计Q函数。在这里我们将做几件事情来进行这个更新。第一点是使用Q而不是A会更方便，这意味着我们将不再使用基线。这会导致更高的方差，但没关系，因为我们将会使用更多的数据，比如缓冲区中的所有数据，而不仅仅是当前策略产生的数据。","start":3921.58,"end":3950.63},{"id":256,"text":"And then the second is that the current policies actions are likely better than the past policies actions. And so for this update right here, we'll be sampling an A from our current policy instead of from the action taken in the buffer. And then this will be the gradient update on our policy where...","zh":"然后第二点是当前策略的动作很可能比过去策略的动作更好。因此，在这个更新中，我们将从当前策略中采样一个A，而不是从缓冲区中采取的动作。然后这将是我们在策略上的梯度更新，其中...","start":3951.92,"end":3972.46},{"id":257,"text":"We'll be looking at log pi of a given s times q of sa. These a's will be sampled from our policy, but essentially using the same trick as what we did with the q function, except now for the current state instead of the next state. So here's our full algorithm. There's sort of one remaining problem, which is that the states in our buffer didn't come from our current policy.","zh":"我们将查看给定状态s下的log π(a)乘以q(sa)。这些a将从我们的策略中采样，但本质上使用了与我们对Q函数所做的相同技巧，只是现在是针对当前状态而不是下一个状态。所以这是我们的完整算法。这里还有一个剩余的问题，即缓冲区中的状态并不是来自当前策略。","start":3973.24,"end":3997.0},{"id":258,"text":"There isn't really anything that we can do here, but it's actually not necessarily a bad thing. It means that we're going to be getting a policy on a broader state distribution rather than just on the state distribution that our policy would visit. Okay, so this is essentially the soft actor critic algorithm. There are other ways to estimate this gradient that we don't have time to get into today, but we might go over in future lectures.","zh":"在这里我们其实没有什么可以做的，但这并不一定是坏事。这意味着我们将在一个更广泛的状态分布上获得策略，而不仅仅是我们的策略会访问的状态分布。好的，所以这基本上就是软演员评论家算法。今天我们没有时间深入讨论其他估计这个梯度的方法，但可能在未来的课程中会讲到。","start":3997.93,"end":4024.77}],"notes":["本段主要讨论在强化学习中使用KL约束的常见性，以及在策略更新过程中如何处理状态分布的问题。讲者指出，KL约束常用于确保策略不会偏离之前的策略太远，这在算法设计中是一个重要的考虑因素。","在算法更新过程中，Q函数被用来替代价值函数，这使得不需要使用基线，虽然会增加方差，但可以通过使用更多数据来弥补。讲者提到，当前策略的动作通常比过去策略的动作更好，因此在更新时会从当前策略中采样动作。","讲者还指出，缓冲区中的状态可能并非来自当前策略，这会导致策略在更广泛的状态分布上进行学习，而不是仅限于当前策略访问的状态分布。这种设计虽然无法直接解决状态分布的问题，但有助于提升策略的泛化能力。","最后，讲者提到这是软演员评论算法（Soft Actor-Critic）的核心思想，并指出还有其他方法可以估计梯度，但这些内容将在未来的课程中进一步探讨。","讲者强调了在策略更新过程中，使用当前策略采样动作的重要性，以及如何通过Q函数和策略梯度的结合来实现策略的优化。","整个段落围绕策略更新的实现细节展开，包括如何处理状态分布的问题，以及如何通过使用更多数据来提高算法的稳定性。"],"formulas":[{"latex":"\\log \\pi(a|s) \\times q(s,a)","symbols":"对数策略概率乘以Q函数","explanation":"公式正确，表示对数策略概率与Q函数的乘积，适用于策略梯度方法中的梯度更新。","evidence":"We'll be looking at log pi of a given s times q of sa. These a's will be sampled from our policy, but essentially using the same trick as what we did with the q function, except now for the current state instead of the next state. So here's our full algorithm. There's sort of one remaining problem, which is that the states in our buffer didn't come from our current policy."}],"uncertainties":["SI"],"diagram":"none","start":3856.07,"end":4024.77,"asr_flags":[],"math_clarifications":["公式中的符号和数学表达正确，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":3856.07,"text":"doesn't do that, but it's a good idea. And in general, we'll see that those kinds of KL"},{"start":3864.09,"text":"constraints come up quite frequently in reinforcement learning because we'll often"},{"start":3867.37,"text":"be assuming that we're not deviating too far from our previous policy. And yeah, it's"},{"start":3876.89,"text":"possible that for the algorithm that we'll see, that could make it better in some circumstances,"},{"start":3880.49,"text":"too. Okay, so to walk through... Okay, well, so I guess what we talked about is we'll be updating"},{"start":3890.35,"text":"Q hat with our target Y, where the target is R plus the Q. And critically, the state SI will"},{"start":3899.13,"text":"be sampled from the replay buffer, but the next action will not be from the replay buffer. It'll"},{"start":3905.09,"text":"be sampled from our policy conditioned on that next state from the buffer."},{"start":3911.75,"text":"Cool. So that'll be our revised step three for the algorithm."},{"start":3915.29,"text":"them. The last thing is what we want to do here. So we have"},{"start":3921.58,"text":"Instead of estimating the value function, we estimated the Q function. There's a couple things that we'll do here for this update. The first is that it'll be convenient to use Q instead of A, and this means that we're not going to use a baseline. This is going to be higher variance, but that's going to be okay because we're going to be using a lot more data, like all the data from our buffer, not just the data from our current policy."},{"start":3951.92,"text":"And then the second is that the current policies actions are likely better than the past policies actions. And so for this update right here, we'll be sampling an A from our current policy instead of from the action taken in the buffer. And then this will be the gradient update on our policy where..."},{"start":3973.24,"text":"We'll be looking at log pi of a given s times q of sa. These a's will be sampled from our policy, but essentially using the same trick as what we did with the q function, except now for the current state instead of the next state. So here's our full algorithm. There's sort of one remaining problem, which is that the states in our buffer didn't come from our current policy."},{"start":3997.93,"text":"There isn't really anything that we can do here, but it's actually not necessarily a bad thing. It means that we're going to be getting a policy on a broader state distribution rather than just on the state distribution that our policy would visit. Okay, so this is essentially the soft actor critic algorithm. There are other ways to estimate this gradient that we don't have time to get into today, but we might go over in future lectures."}],"speech_gaps":[],"frame":"../frames/v032/024.webp","frame_time":3868.07},{"title":"SAC与PPO的对比及强化学习在真实机器人上的应用","segments":[{"id":259,"text":"There are also some fancier ways to fit this Q function that we'll see in the next lecture. But the algorithm here that this is very, very close to is called Soft-Tactor Critic or SAC. And if we compare SAC and PPO, the more off-policy version that uses a replay buffer is shown in orange and the less off-policy is shown in brown.","zh":"还有一些更高级的方法可以拟合这个Q函数，我们将在下节课中看到。但这里的算法非常接近的被称为Soft-Tactor Critic或SAC。如果我们比较SAC和PPO，使用重放缓冲区的更离策略版本以橙色显示，而较少离策略的则以棕色显示。","start":4025.41,"end":4047.31},{"id":260,"text":"And so we see that we're able to get much more data-efficient learning with something like SAC than with something that's less off-policy. So you can be far, far more data-efficient when you use this replay buffer. The downside is that it can be a lot harder to tune hyperparameters, and generally it can be a bit less stable when you're using these few functions than compared to PPO.","zh":"因此，我们可以看到，使用类似SAC的算法可以实现比使用较少离策略方法更高效的数据学习。因此，当你使用这个重放缓冲区时，可以远更高效地利用数据。缺点是它可能更难调整超参数，而且通常在使用这些函数时，学习的稳定性会比PPO稍差一些。","start":4047.89,"end":4078.22},{"id":261,"text":"In about two hours, the policy learns how to walk forward just with the algorithm that we talked about. You can also learn some kind of cool manipulation tasks with reinforcement learning. This was seeded with demonstrations. It's a very precise task. And you can see that actually if you compare the performance of this RL method, it actually gets 100% on all the tasks that they tested, whereas if you use imitation learning, you'll get a much lower success rate.","zh":"大约两小时内，策略就能学会如何向前行走，仅使用我们讨论过的算法。你也可以用强化学习来学习一些有趣的操控任务。这是通过示范进行初始化的，这是一个非常精确的任务。你可以看到，实际上如果比较这种强化学习方法的性能，它在所有测试任务中都能达到100%，而如果使用模仿学习，成功率会低得多。","start":4078.88,"end":4104.64},{"id":262,"text":"And reinforcement learning also leads to a faster policy than with imitation learning. And then PPO is a common algorithm that's used if you want really stable learning, but less data efficient learning. And so if you're in simulation, for example, data is not a problem. You can collect tons and tons of data in simulation and you can learn a policy in simulation. And then if you carefully tune your simulator, that policy might be able to transfer to the real world.","zh":"强化学习还导致比模仿学习更快的策略。然后，PPO是一种常用的算法，如果你想要非常稳定的训练，但数据效率较低。因此，如果你在模拟环境中，数据就不是问题。你可以在模拟中收集大量数据，并在模拟中学习策略。然后，如果你仔细调整你的模拟器，这个策略可能能够迁移到现实世界中。","start":4105.34,"end":4131.38},{"id":263,"text":"And then there was also an example of, in general, for manipulation, sim-to-real transfer is a lot harder. We're learning how to do a Rubik's Cube that was trained in simulation. And after about five minutes of this rollout, you get a Rubik's Cube that has been completed. And that was with PPO. PPO is also a common choice for language models. We'll start to discuss them next week.","zh":"此外，还有一个例子，总体而言，对于操控任务，从模拟到现实的迁移要困难得多。我们正在学习如何做一个在模拟中训练的魔方。大约五分钟的 rollout 后，你会得到一个完成的魔方。这是使用PPO实现的。PPO也是语言模型中常见的选择。我们将在下周开始讨论它们。","start":4131.89,"end":4155.64}],"notes":["本段主要讲解了SAC（Soft Actor-Critic）算法相较于PPO（Proximal Policy Optimization）在数据效率上的优势，以及使用经验回放缓冲区（replay buffer）带来的挑战。SAC在数据效率上更高，但参数调优更困难，且稳定性略差。同时，强调了在真实机器人上使用完全离策略（fully off-policy）方法的可行性，例如在两小时内通过算法学习行走任务。","本段通过具体例子说明了强化学习在精细任务中的表现，如使用演示数据（seeded with demonstrations）进行的机器人操作任务。与模仿学习（imitation learning）相比，强化学习在测试任务中达到了100%的成功率，而模仿学习的成功率较低。这表明强化学习在任务精度和泛化能力上具有优势。","本段讨论了PPO算法在稳定学习方面的优势，但数据效率较低。在仿真环境中，数据获取相对容易，因此可以训练出在仿真中表现良好的策略，并通过精细调整仿真器（simulator）实现策略在真实世界中的迁移（sim-to-real transfer）。","本段以魔方（Rubik's Cube）任务为例，说明了仿真到现实的迁移在操作任务中尤为困难。通过PPO算法，仅需五分钟的仿真运行即可完成魔方任务，展示了强化学习在复杂任务中的潜力。此外，PPO也被广泛应用于语言模型的训练中，将在下节课中进一步讨论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4025.41,"end":4155.64,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":4025.41,"text":"There are also some fancier ways to fit this Q function that we'll see in the next lecture. But the algorithm here that this is very, very close to is called Soft-Tactor Critic or SAC. And if we compare SAC and PPO, the more off-policy version that uses a replay buffer is shown in orange and the less off-policy is shown in brown."},{"start":4047.89,"text":"And so we see that we're able to get much more data-efficient learning with something like SAC than with something that's less off-policy. So you can be far, far more data-efficient when you use this replay buffer. The downside is that it can be a lot harder to tune hyperparameters, and generally it can be a bit less stable when you're using these few functions than compared to PPO. Cool. And then lastly, when you're fully off-policy, you can actually be efficient enough to run reinforcement learning on real robots. So in this example,"},{"start":4078.88,"text":"In about two hours, the policy learns how to walk forward just with the algorithm that we talked about. You can also learn some kind of cool manipulation tasks with reinforcement learning. This was seeded with demonstrations. It's a very precise task. And you can see that actually if you compare the performance of this RL method, it actually gets 100% on all the tasks that they tested, whereas if you use imitation learning, you'll get a much lower success rate."},{"start":4105.34,"text":"And reinforcement learning also leads to a faster policy than with imitation learning. And then PPO is a common algorithm that's used if you want really stable learning, but less data efficient learning. And so if you're in simulation, for example, data is not a problem. You can collect tons and tons of data in simulation and you can learn a policy in simulation. And then if you carefully tune your simulator, that policy might be able to transfer to the real world."},{"start":4131.89,"text":"And then there was also an example of, in general, for manipulation, sim-to-real transfer is a lot harder. We're learning how to do a Rubik's Cube that was trained in simulation. And after about five minutes of this rollout, you get a Rubik's Cube that has been completed. And that was with PPO. PPO is also a common choice for language models. We'll start to discuss them next week."}],"speech_gaps":[],"frame":"../frames/v032/025.webp","frame_time":4037.41}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v032.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
