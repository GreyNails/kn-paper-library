the policy changes the ratio to be like above 1.2 it's no longer going to be","zh":"在这里，一旦策略改变使得比率超过1.2，它就不再会是","start":1839.95,"end":1851.19},{"id":98,"text":"it's no longer going to be able to like increasing the probability any further isn't going to help it it's no longer","zh":"因为目标函数将保持为1.2倍的优势值，因此实际上并没有显式地约束策略不发生变化，但","start":1851.19,"end":1856.05},{"id":99,"text":"going to be incentivized to increase the probability further because the objective","zh":"它去除了从旧策略显著改变的激励","start":1856.05,"end":1859.31},{"id":100,"text":"will just stay as 1.2 times the advantage and so it isn't actually explicitly constraining the","zh":"目标函数将保持为1.2倍的优势值，因此实际上并没有显式地约束策略不发生变化，但","start":1859.31,"end":1865.69},{"id":101,"text":"policy not to change, but it's removing the incentive to change significantly from the","zh":"它去除了从旧策略显著改变的激励","start":1865.69,"end":1870.79},{"id":102,"text":"old policy.","zh":"它去除了从旧策略显著改变的激励","start":1870.79,"end":1871.39},{"id":103,"text":"Yes, so it cannot be below 1 minus epsilon, and it cannot be above 1 plus epsilon.","zh":"是的，因此它不能低于1减去epsilon，也不能高于1加上epsilon。","start":1872.25,"end":1876.83}],"notes":["本段讲解了PPO算法中使用裁剪策略来限制策略更新幅度的思路。讲者提到，通过将重要性权重裁剪在1-ε和1+ε之间，可以防止策略对旧策略的更新产生过大的变化。这种做法虽然不直接约束策略，但通过移除更新的激励，使得策略更新不会偏离太多。","讲者进一步解释了裁剪策略的数学表达方式，即对重要性权重w进行两次操作：首先取w和1-ε的最大值，然后取该结果与1+ε的最小值。这样可以确保重要性权重不会超出指定的范围。","讲者指出，这种裁剪策略在实践中被广泛使用，尤其是在偏好优化中。它虽然不是PPO最常见的版本，但仍然是一个重要的变体。","讲者强调，裁剪策略并不是直接限制策略的更新，而是通过移除更新的激励，使得策略不会对旧策略产生显著的改变。这种做法在实际应用中非常有效。","讲者提到，裁剪策略的实施方式是相对非正式的，但其数学表达方式是明确的。通过这种方式，可以确保策略更新的稳定性。","讲者最后总结了裁剪策略的核心思想，即通过限制重要性权重的范围，防止策略对旧策略的更新产生过大的变化。这种做法在PPO算法中是一个重要的技术点。"],"formulas":[{"latex":"w_{\\text{clipped}} = \\text{min}(\\text{max}(w, 1 - \\epsilon), 1 + \\epsilon)","symbols":"w: 重要性权重；\\epsilon: 裁剪范围；w_{\\text{clipped}}: 裁剪后的重要性权重","explanation":"公式正确表达了重要性权重的裁剪操作，通过先取最大值确保不小于1 - \\epsilon，再取最小值确保不大于1 + \\epsilon。","evidence":"let's call this w, this weight right here, then if we wanted to clip it below by 1 minus epsilon, epsilon, then we would be taking the max between w and one minus epsilon. And if we wanted to then clip this above by one plus epsilon, then we'd be taking the min between this and one plus epsilon. And now, if we use this clipped importance weight in our objective"}],"uncertainties":["it's no longer going to be able to like increasing the probability any further isn't going to help it it's no longer"],"diagram":"none","start":1698.21,"end":1876.83,"asr_flags":[],"math_clarifications":["公式中的裁剪操作是正确的，但需要确认\\epsilon的具体取值范围是否合理，以及裁剪后的权重是否会影响策略更新的稳定性。"],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":1698.21,"text":"Okay, so the first idea is use a KL constraint. This is actually very common to do. We will leave it at this for now. We actually won't use KL constraints. There is actually a version of PPO that uses KL constraints, but it's not the most common version. But it's also used a lot in preference optimization, so we'll probably see it again in a couple weeks. And then there's actually a second idea. So we could add this constraint in the objective."},{"start":1726.0,"text":"The other thing that we could do is we could, for this ratio right here, we could simply remove the incentive for the policy to change this ratio a lot. And the way that we would do that is we could actually just clip this ratio so that the ratio never exceeds some value and never goes below some value. And so what that would look like is, this is like, I guess,"},{"start":1756.36,"text":"This is version 1. What version 2 would look like is we would be taking these importance weights and we would be clipping them. So we have the importance weights pi theta prime divided by pi theta. And we'd be clipping these to be between some lower value 1 minus epsilon and some higher value 1 plus epsilon. Epsilon could be something like 0.2."},{"start":1787.39,"text":"So you're saying that if it goes below 0.8, then it'll just be 0.8, and if this goes above"},{"start":1795.15,"text":"1.2, we're just going to leave it as 1.2. Now this clipping, this is a little bit informal."},{"start":1802.21,"text":"If I were to write this out mathematically, what this would look like, let's say that,"},{"start":1807.67,"text":"let's call this w, this weight right here, then if we wanted to clip it below by 1 minus epsilon,"},{"start":1815.33,"text":"epsilon, then we would be taking the max between w and one minus epsilon. And if we wanted"},{"start":1824.27,"text":"to then clip this above by one plus epsilon, then we'd be taking the min between this and"},{"start":1831.25,"text":"one plus epsilon. And now, if we use this clipped importance weight in our objective"},{"start":1839.95,"text":"right here then once the policy changes the ratio to be like above 1.2 it's no longer going to be"},{"start":1851.19,"text":"able to like increasing the probability any further isn't going to help it it's no longer"},{"start":1856.05,"text":"going to be incentivized to increase the probability further because the objective"},{"start":1859.31,"text":"will just stay as 1.2 times the advantage and so it isn't actually explicitly constraining the"},{"start":1865.69,"text":"policy not to change, but it's removing the incentive to change significantly from the"},{"start":1870.79,"text":"old policy."},{"start":1872.25,"text":"Yes, so it cannot be below 1 minus epsilon, and it cannot be above 1 plus epsilon."}],"speech_gaps":[],"frame":"../frames/v032/011.webp","frame_time":1710.21},{"title":"PPO算法中的重要性权重裁剪","segments":[{"id":104,"text":"A value of epsilon that's used in practice is something like 0.2.","zh":"在实践中使用的 epsilon 值大概是 0.2 左右。","start":1877.21,"end":1883.71},{"id":105,"text":"So it's not tiny.","zh":"因此，它并不是一个非常小的数。","start":1884.01,"end":1885.11},{"id":106,"text":"Sometimes we refer to epsilon as tiny numbers.","zh":"有时我们会将 epsilon 称为非常小的数。","start":1885.45,"end":1887.47},{"id":107,"text":"In this case, it's going to be constrained to be between 0.8 and 1.2.","zh":"在这种情况下，它会被限制在 0.8 到 1.2 之间。","start":1888.47,"end":1892.51},{"id":108,"text":"Okay, so this sort of idea of bounding the importance weights is actually one of the","zh":"好的，这种对重要性权重进行限制的想法实际上是 PPO 算法背后的关键思想之一，","start":1892.51,"end":1899.87},{"id":109,"text":"key ideas behind PPO, which is a popular RL algorithm.","zh":"而 PPO 是一种流行的强化学习算法。","start":1899.87,"end":1903.53},{"id":110,"text":"And so, let's see.","zh":"那么，让我们看看。","start":1904.73,"end":1908.07},{"id":111,"text":"If we were to then put this clipping into practice, we could take our surrogate objective","zh":"如果我们现在将这种裁剪应用到实践中，我们可以采用我们的替代目标函数","start":1909.23,"end":1914.27},{"id":112,"text":"and then replace the importance weights by the clipped importance weights right here","zh":"然后在这里将重要性权重替换为裁剪后的重要性和权重","start":1915.07,"end":1919.89},{"id":113,"text":"in order to get a modified surrogate objective.","zh":"以便获得一个修改后的替代目标函数","start":1919.89,"end":1923.17},{"id":114,"text":"Now, there's a couple more tricks that PPO introduces","zh":"现在，PPO还引入了几个额外的技巧","start":1926.95,"end":1930.13},{"id":115,"text":"to try to get stable reinforcement learning improvement.","zh":"以尝试获得稳定的强化学习改进","start":1931.31,"end":1936.19},{"id":116,"text":"So in this first trick, it's no longer incentivized to deviate significantly.","zh":"因此，在这个第一个技巧中，不再鼓励显著偏离","start":1938.67,"end":1942.35},{"id":117,"text":"Now, one thing that's a little bit funky about these importance weights","zh":"这些重要性权重有一点奇怪的地方","start":1943.43,"end":1948.99},{"id":118,"text":"is that there is actually a possibility that it might actually","zh":"是实际上有可能发生的情况","start":1948.99,"end":1955.23},{"id":119,"text":"Clipping in some rare cases might actually make the objective better. If, for example, the policy ended up assigning a very low probability to a negative advantage and it went below the advantages, then you're clipping it to a higher weight.","zh":"在某些罕见情况下，裁剪实际上可能会使目标函数更好。例如，如果策略最终给一个负优势分配了非常低的概率，并且低于优势值，那么就会将其裁剪到一个更高的权重","start":1957.98,"end":1973.48},{"id":120,"text":"One thing that PPO does is, and kind of the final objective of PPO, is to take this clipped objective, but take the minimum with respect to the original objective.","zh":"PPO所做的其中一件事，也是其最终目标之一，是采用这个裁剪后的目标，但相对于原始目标取最小值。","start":1977.31,"end":1986.23},{"id":121,"text":"And this minimum is just making sure that the clipping will never make the objective better.","zh":"这个最小值的作用是确保裁剪不会使目标变得更好。","start":1987.23,"end":1992.63},{"id":122,"text":"And it formulates a lower bound, it ensures that this is a lower bound on the original surrogate objective.","zh":"它制定了一个下界，确保这是原始替代目标的一个下界。","start":1992.93,"end":2001.55},{"id":123,"text":"And this means that we're going to be maximizing a lower bound on our objective.","zh":"这意味着我们将最大化我们目标的一个下界。","start":2003.15,"end":2007.41},{"id":124,"text":"And usually, if you're ever going to be maximizing something that's different from your original","zh":"通常，如果你要最大化与原始目标不同的某个量，它是一个下界是好的，因为这意味着你实际上会","start":2007.59,"end":2015.15},{"id":125,"text":"objective, it's good if it's lower bound, because it means that you're actually going","zh":"最大化的是不会超过原始目标的某个量。","start":2015.15,"end":2018.87},{"id":126,"text":"to be... you're not going to be maximizing something that you could maximize beyond the","zh":"你不会最大化一个可以超过原始目标的量。","start":2018.87,"end":2024.31},{"id":127,"text":"original objective.","zh":"你不会最大化一个可以超过原始目标的量。","start":2024.31,"end":2024.95},{"id":128,"text":"Cool.","zh":"不错。","start":2027.75,"end":2028.23},{"id":129,"text":"So this is the final PPO surrogate objective.","zh":"所以这就是最终的PPO替代目标函数。","start":2028.35,"end":2030.23},{"id":130,"text":"characters. The motivation behind trick one or trick two? Trick two. So the motivation","zh":"字符。技巧一或技巧二的动机是什么？技巧二。所以技巧二的动机","start":2030.23,"end":2035.15},{"id":131,"text":"behind trick two, I'm not actually sure how often this happens in practice, like how critical","zh":"背后，我其实不太确定这种现象在实践中发生的频率，比如这种现象有多关键","start":2035.15,"end":2043.07},{"id":132,"text":"of cool this is, but the motivation is that if you are in a scenario","zh":"程度，但动机是如果你处于一个场景","start":2043.07,"end":2046.83}],"notes":["本段主要讲解PPO算法中重要性权重裁剪的机制及其目的。讲者指出，裁剪在某些罕见情况下可能会使目标函数更好，例如当策略分配给负优势的概率非常低时，裁剪可以将权重提升到更高的值。此外，PPO通过取裁剪目标和原始目标的最小值，确保裁剪不会使目标函数变好，从而形成原始目标函数的下界。","讲者强调，最大化目标函数的下界是PPO算法的一个关键设计，这样可以避免策略更新超出原始目标函数的范围，从而保证训练的稳定性。","讲者提到，虽然裁剪在实践中可能并不常见，但其动机是确保策略更新不会偏离原始目标函数太远，从而避免训练过程中的不稳定性。","讲者还指出，PPO的最终目标是通过裁剪和取最小值的方式，确保目标函数的下界，从而在优化过程中保持策略的稳定性。","讲者提到，如果目标函数与原始目标函数不同，最大化其下界是更有利的，因为这样可以避免策略更新超出原始目标函数的范围。","讲者最后提到，PPO的最终目标函数是裁剪目标和原始目标的最小值，这确保了目标函数的下界，从而在优化过程中保持策略的稳定性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1877.21,"end":2046.83,"asr_flags":[124],"boards":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":1877.21,"text":"A value of epsilon that's used in practice is something like 0.2."},{"start":1884.01,"text":"So it's not tiny."},{"start":1885.45,"text":"Sometimes we refer to epsilon as tiny numbers."},{"start":1888.47,"text":"In this case, it's going to be constrained to be between 0.8 and 1.2."},{"start":1892.51,"text":"Okay, so this sort of idea of bounding the importance weights is actually one of the"},{"start":1899.87,"text":"key ideas behind PPO, which is a popular RL algorithm."},{"start":1904.73,"text":"And so, let's see."},{"start":1909.23,"text":"If we were to then put this clipping into practice, we could take our surrogate objective"},{"start":1915.07,"text":"and then replace the importance weights by the clipped importance weights right here"},{"start":1919.89,"text":"in order to get a modified surrogate objective."},{"start":1926.95,"text":"Now, there's a couple more tricks that PPO introduces"},{"start":1931.31,"text":"to try to get stable reinforcement learning improvement."},{"start":1938.67,"text":"So in this first trick, it's no longer incentivized to deviate significantly."},{"start":1943.43,"text":"Now, one thing that's a little bit funky about these importance weights"},{"start":1948.99,"text":"is that there is actually a possibility that it might actually"},{"start":1957.98,"text":"Clipping in some rare cases might actually make the objective better. If, for example, the policy ended up assigning a very low probability to a negative advantage and it went below the advantages, then you're clipping it to a higher weight."},{"start":1977.31,"text":"One thing that PPO does is, and kind of the final objective of PPO, is to take this clipped objective, but take the minimum with respect to the original objective."},{"start":1987.23,"text":"And this minimum is just making sure that the clipping will never make the objective better."},{"start":1992.93,"text":"And it formulates a lower bound, it ensures that this is a lower bound on the original surrogate objective."},{"start":2003.15,"text":"And this means that we're going to be maximizing a lower bound on our objective."},{"start":2007.59,"text":"And usually, if you're ever going to be maximizing something that's different from your original"},{"start":2015.15,"text":"objective, it's good if it's lower bound, because it means that you're actually going"},{"start":2018.87,"text":"to be... you're not going to be maximizing something that you could maximize beyond the"},{"start":2024.31,"text":"original objective."},{"start":2027.75,"text":"Cool."},{"start":2028.35,"text":"So this is the final PPO surrogate objective."},{"start":2030.23,"text":"characters. The motivation behind trick one or trick two? Trick two. So the motivation"},{"start":2035.15,"text":"behind trick two, I'm not actually sure how often this happens in practice, like how critical"},{"start":2043.07,"text":"of cool this is, but the motivation is that if you are in a scenario"}],"speech_gaps":[],"frame":"../frames/v032/012.webp","frame_time":1889.21},{"title":"Off-Policy Actor Critic算法中的策略剪切","segments":[{"id":133,"text":"You might actually be in a scenario where maybe it increased the probability on a lot of the good stuff, it decreased the probability on a lot of the bad stuff, but in some of the rare circumstances where maybe increasing the probability on a good stuff led it, there was another advantage that had a similar state that was actually really bad, and maybe it increased the probability on both of those.","zh":"你可能实际上处于一个场景中，其中它可能在很多好的情况上增加了概率，在很多坏的情况上减少了概率，但在一些罕见的情况下，如果增加好的情况的概率导致了另一个实际上非常糟糕的状态，它可能同时增加了这两个情况的概率。","start":2047.65,"end":2068.99},{"id":134,"text":"In that case, clipping it at 1.2 for that second one is actually making it better. It's actually making the objective better because you're then saying, okay, maybe it assigned a really high probability to this bad action. We're then going to clip that at 1.2 or something like that. And so if we take the minimum with respect to the original objective, this is at the state action level, at the data point level. This is going to ensure that those situations aren't happening.","zh":"在这种情况下，对第二个情况进行1.2的裁剪实际上会更好。它实际上会改善目标函数，因为你会说，好吧，也许它给这个坏动作分配了非常高的概率。我们随后会将其裁剪到1.2或类似数值。因此，如果我们以原始目标函数为基准进行最小化，这在状态-动作层面、数据点层面进行，这将确保这些情况不会发生。","start":2070.61,"end":2097.75},{"id":135,"text":"I guess explicitly say you have say you have a particular state and action pair where the advantage is like, I don't know, negative a thousand or something like that. So something really large then and say that your your new your new policy for this state in action.","zh":"我想明确地说，你有一个特定的状态-动作对，其中优势值大概是负一千或类似数值。因此，这是一个非常大的数值，然后你说你的新策略对于这个状态-动作对。","start":2099.59,"end":2130.06},{"id":136,"text":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2.","zh":"决定给它分配一个概率，比如0.9或非常高的数值，而原始策略可能给它分配了0.1的概率。在这种情况下，这两个概率的比率是9，当我们将它裁剪时，它会被裁剪到1.2。","start":2131.85,"end":2159.75},{"id":137,"text":"And then once we clip it to 1.2, we'll multiply 1.2 by negative 1,000. And so that's actually going to be making the objective better than if we hadn't clipped the objective. And so what this trick number two does is it means that it actually doesn't get to do the clipping for this particular data point. And this will disincentivize it from making these kinds of accidents, which is a good thing to do.","zh":"一旦我们将它裁剪到1.2，我们就会将1.2乘以负一千。因此，这实际上会使目标函数比未裁剪目标函数更好。这个技巧二的作用是，它意味着对于这个特定的数据点，它实际上不会进行裁剪。这将抑制它产生这种事故的可能性，这是件好事。","start":2160.67,"end":2186.13},{"id":138,"text":"So you're asking, why don't we just clip above and not clip below? So there is actually an analogous version of this. If you just make this negative and flip these, where the clipping could also make the objective better. Like, for example, if A hat for a given state and action pair is positive 1000, and the new policy...","zh":"你可能会问，为什么我们不只在上方进行裁剪而不进行下方裁剪？实际上存在一个类似的版本。如果你将这个数值取负并翻转这些数值，裁剪也可能使目标函数更好。例如，对于某个状态-动作对，A帽是正一千，而新策略...","start":2187.12,"end":2213.02}],"notes":["本段讲解了在策略梯度方法中使用策略剪切（clipping）来防止策略更新过程中出现极端概率分配的问题。讲者通过一个具体例子说明，当新策略对某个动作赋予很高的概率，而原始策略赋予很低的概率时，两者的比值可能非常大，此时通过剪切可以避免目标函数的剧烈波动。","讲者进一步指出，剪切操作可以防止策略在某些罕见情况下做出错误的决策，例如将一个原本不好的动作赋予过高的概率。通过将比值限制在某个范围内（如1.2），可以确保目标函数的稳定性。","讲者还提到，剪切操作不仅适用于对高概率的限制，也可以对低概率进行剪切。例如，当优势函数为正时，如果新策略对某个动作赋予过低的概率，也可以通过剪切来避免目标函数的异常。","讲者通过一个具体的数值例子说明了剪切操作的计算过程：当优势函数为-1000，新策略的概率为0.9，原始策略的概率为0.1时，两者的比值为9，剪切后变为1.2，再乘以优势函数的值，得到-1200，这比未剪切时的-900更优。","讲者强调，剪切操作的目的是防止策略在某些罕见情况下做出错误的决策，从而提高算法的稳定性和性能。","最后，讲者指出，剪切操作可以同时应用于高概率和低概率的情况，通过调整剪切的上下限，可以更全面地控制策略更新的幅度。"],"formulas":[{"latex":"r = \\frac{\\text{new policy probability}}{\\text{original policy probability}}","symbols":"r 表示新策略与原始策略的概率比","explanation":"公式正确，表示新策略与原始策略的概率比，符合上下文描述。","evidence":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2."},{"latex":"r_{\\text{clipped}} = \\text{min}(r, \\text{clip value})","symbols":"r_clipped 表示剪切后的概率比","explanation":"公式正确，表示剪切后的概率比，使用min函数确保不超过clip value，符合上下文描述。","evidence":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2."},{"latex":"objective = r_{\\text{clipped}} \\times A","symbols":"objective 表示目标函数，A 表示优势函数","explanation":"公式正确，表示目标函数为剪切后的概率比乘以优势函数，符合上下文描述。","evidence":"And then once we clip it to 1.2, we'll multiply 1.2 by negative 1,000. And so that's actually going to be making the objective better than if we hadn't clipped the objective. And so what this trick number two does is it means that it actually doesn't get to do the clipping for this particular data point. And this will disincentivize it from making these kinds of accidents, which is a good thing to do."}],"uncertainties":["your your new your new policy for this state in action"],"diagram":"none","start":2047.65,"end":2213.02,"asr_flags":[],"math_clarifications":["公式中的剪切操作是为了防止策略更新时出现极端值，从而稳定训练过程。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2047.65,"text":"You might actually be in a scenario where maybe it increased the probability on a lot of the good stuff, it decreased the probability on a lot of the bad stuff, but in some of the rare circumstances where maybe increasing the probability on a good stuff led it, there was another advantage that had a similar state that was actually really bad, and maybe it increased the probability on both of those."},{"start":2070.61,"text":"In that case, clipping it at 1.2 for that second one is actually making it better. It's actually making the objective better because you're then saying, okay, maybe it assigned a really high probability to this bad action. We're then going to clip that at 1.2 or something like that. And so if we take the minimum with respect to the original objective, this is at the state action level, at the data point level. This is going to ensure that those situations aren't happening."},{"start":2099.59,"text":"I guess explicitly say you have say you have a particular state and action pair where the advantage is like, I don't know, negative a thousand or something like that. So something really large then and say that your your new your new policy for this state in action."},{"start":2131.85,"text":"decided to give it like a probability of like 0.9 or something very high, and the original policy maybe gave it a probability of, whoops, if the original policy gave it a probability of like 0.1, then in this case the ratio between these two is 9, and then when we clip it, it then would be clipped to 1.2."},{"start":2160.67,"text":"And then once we clip it to 1.2, we'll multiply 1.2 by negative 1,000. And so that's actually going to be making the objective better than if we hadn't clipped the objective. And so what this trick number two does is it means that it actually doesn't get to do the clipping for this particular data point. And this will disincentivize it from making these kinds of accidents, which is a good thing to do."},{"start":2187.12,"text":"So you're asking, why don't we just clip above and not clip below? So there is actually an analogous version of this. If you just make this negative and flip these, where the clipping could also make the objective better. Like, for example, if A hat for a given state and action pair is positive 1000, and the new policy..."}],"speech_gaps":[],"frame":"../frames/v032/013.webp","frame_time":2059.65},{"title":"PPO算法中的优势估计与截断技巧","segments":[{"id":139,"text":"assigns 0.1 and the old policy assigns 0.9, then now if you do this by accident, or if it happened to do this as part of optimizing other data points, then now the ratio is going to be 1 over 9, which is very small.","zh":"如果新策略分配的是0.1，而旧策略分配的是0.9，那么如果你不小心这样做，或者在优化其他数据点时偶然这样做，那么这个比率就会变成1除以9，这非常小。","start":2214.18,"end":2237.98},{"id":140,"text":"you multiply that by a thousand. If you clip the 1 over 9 by 0.8, that's actually making the objective better. And so generally clipping on both sides and then taking the lower bound prevents both of these kinds of scenarios from being encouraged through clipping. Okay, so this is the final PPO surrogate objective.","zh":"如果你将这个比率乘以1000。如果将1除以9截断为0.8，实际上会使目标函数更好。因此，通常在两侧进行截断，然后取下界，可以防止这两种情况通过截断被鼓励。好的，这就是最终的PPO替代目标函数。","start":2238.46,"end":2267.6},{"id":141,"text":"The last thing, the last trick that PPO does is on estimating the advantage. So to estimate the advantage, there's a third trick that's used. This is actually a trick where I'm not sure how necessary it is myself. I haven't done a ton of comparisons. And the way that it works is you still could be fitting a value function, v pi, in the normal way.","zh":"最后，PPO做的最后一个技巧是在估计优势时。为了估计优势，会使用一个第三种技巧。实际上，我自己也不确定这个技巧有多必要。我没有做过大量的比较。它的运作方式是，你仍然可以像平常一样拟合价值函数v_pi。","start":2269.5,"end":2298.6},{"id":142,"text":"either with Monte Carlo or bootstrapping. But then once you fit that value function, previously the equation for our value function was the reward plus the next value minus the current value. And instead of just using kind of a horizon of one, it's actually going to use a varying horizon. So you can think of, before we were estimating the advantage,","zh":"无论是使用蒙特卡洛方法还是抽样方法。但一旦拟合了这个价值函数，我们之前的价值函数方程是奖励加上下一个价值减去当前价值。而不仅仅是使用一个时间步长的范围，实际上会使用一个变化的时间范围。你可以这样想，之前我们是在估计某个状态在动作下的优势，","start":2299.03,"end":2328.53},{"id":143,"text":"of a given state in action. We're using the reward at that state plus the value at the next state minus the value at the current state. These were all for pi. And then we had hats on each of these. But you can also estimate the advantage using something that kind of looks like n-step.","zh":"我们使用的是该状态的奖励加上下一个状态的价值减去当前状态的价值。这些都适用于策略π。然后我们给每个项都加上了帽子。但你也可以使用一种看起来像n步的方法来估计优势。","start":2329.38,"end":2355.41},{"id":144,"text":"returns where you're actually going to be summing over multiple reward functions, multiple of the rewards into the future and subtracting that future reward or adding that future value instead of adding just one step into the future. You can sort of think of this as like, we were talking about bias and variance before. If you use, if you calculate these different advantages with varying horizons and then weight them accordingly, then you can get","zh":"回报，你实际上会将多个奖励函数相加，将多个未来的奖励纳入计算，并减去未来的奖励或加上未来的价值，而不是仅仅加上一步未来的奖励。你可以这样想，我们之前讨论过偏差和方差的问题。如果你计算不同时间范围的优势，并相应地加权，那么你就可以得到","start":2356.45,"end":2385.24}],"notes":["本段主要讲解PPO算法中截断技巧的应用。当新策略与旧策略的比率非常小时，通过截断可以防止目标函数被极端值破坏。截断操作通常在两个方向上进行，并取下界，以避免鼓励极端情况的发生。这是PPO代理目标函数的最终形式。","PPO算法的最后一个技巧是优势估计。优势估计通常通过拟合价值函数来实现，可以使用蒙特卡洛方法或自举方法。在拟合价值函数后，优势估计不再仅限于一步的未来奖励，而是使用可变的未来时间范围。","优势估计可以使用类似于n步回报的方法，通过累加多个未来奖励或未来价值来计算。这种方法可以平衡偏差和方差，通过不同时间范围的优势估计并加权，可以得到更稳定的结果。","在优势估计中，使用不同时间范围的回报并加权，可以减少偏差和方差的影响。这种方法在PPO中被提及，但其必要性尚未被广泛验证。","PPO算法通过截断和优势估计的改进，提高了策略优化的稳定性。截断防止了极端比率对目标函数的影响，而优势估计的改进则通过不同时间范围的回报加权来平衡偏差和方差。","本段内容涉及PPO算法的两个关键技巧：截断和优势估计的改进。这些技巧共同作用，提高了策略优化的稳定性和效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2214.18,"end":2385.24,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2214.18,"text":"assigns 0.1 and the old policy assigns 0.9, then now if you do this by accident, or if it happened to do this as part of optimizing other data points, then now the ratio is going to be 1 over 9, which is very small."},{"start":2238.46,"text":"you multiply that by a thousand. If you clip the 1 over 9 by 0.8, that's actually making the objective better. And so generally clipping on both sides and then taking the lower bound prevents both of these kinds of scenarios from being encouraged through clipping. Okay, so this is the final PPO surrogate objective."},{"start":2269.5,"text":"The last thing, the last trick that PPO does is on estimating the advantage. So to estimate the advantage, there's a third trick that's used. This is actually a trick where I'm not sure how necessary it is myself. I haven't done a ton of comparisons. And the way that it works is you still could be fitting a value function, v pi, in the normal way."},{"start":2299.03,"text":"either with Monte Carlo or bootstrapping. But then once you fit that value function, previously the equation for our value function was the reward plus the next value minus the current value. And instead of just using kind of a horizon of one, it's actually going to use a varying horizon. So you can think of, before we were estimating the advantage,"},{"start":2329.38,"text":"of a given state in action. We're using the reward at that state plus the value at the next state minus the value at the current state. These were all for pi. And then we had hats on each of these. But you can also estimate the advantage using something that kind of looks like n-step."},{"start":2356.45,"text":"returns where you're actually going to be summing over multiple reward functions, multiple of the rewards into the future and subtracting that future reward or adding that future value instead of adding just one step into the future. You can sort of think of this as like, we were talking about bias and variance before. If you use, if you calculate these different advantages with varying horizons and then weight them accordingly, then you can get"}],"speech_gaps":[],"frame":"../frames/v032/014.webp","frame_time":2226.18},{"title":"优势估计的方差与偏差权衡","segments":[{"id":145,"text":"Advantage estimates that have varying variance and maybe have less bias than if you just use the one-step estimate right here. I think that there's some argument in terms of bias and variance that can be made, but it's also not 100% clear if it's necessary, in my opinion.","zh":"优势估计的方差可能各不相同，也许其偏差比直接使用此处的一步估计要小。我认为在偏差和方差之间可以做出一些论点，但在我的看法中，它是否必要仍然不是百分之百明确。","start":2385.95,"end":2410.15},{"id":146,"text":"Right, yeah. So there's now going to be a hyperparameter here with regard to how do you choose these weights with regard to the different end step returns. Generally, you'll mostly use the earlier ones so that you have less variance. And usually, you will choose it to kind of decay very quickly as the horizon increases. You're mostly still going to be using the t equals 1 or n equals 1.","zh":"对的，是的。现在这里将有一个超参数，用于决定如何选择这些权重，以考虑不同的终端步回报。通常，你会主要使用较早的那些，以便减少方差。通常，你会选择它随着时间范围的增加而迅速衰减。你仍然主要会使用 t 等于 1 或 n 等于 1。","start":2410.99,"end":2440.15},{"id":147,"text":"Right. So if you're using these weights, do you set gamma to one or do you use them together? You'll actually use them together. And if you write this out, you'll get a term that multiplies gamma and lambda here.","zh":"对的。如果你使用这些权重，你是将 gamma 设置为 1，还是将它们一起使用？实际上你会将它们一起使用。如果你将其写出来，你会得到一个乘以 gamma 和 lambda 的项。","start":2441.08,"end":2452.92},{"id":148,"text":"So the question was, this is the same as taking a weighted average of different end step returns for different ends. So the one thing that's different is we're still going to be fitting the value function in the normal way. And then this is in terms of how we estimate the advantage. But otherwise, it's very kind of, you can think of it as end step returns, but averaging the different ends in order to get an estimate. What's the benefit of using GAE? I think I'm not...","zh":"问题是，这等同于对不同终端步的回报进行加权平均。唯一不同的是，我们仍然会以常规方式拟合价值函数。而这是关于如何估计优势的。否则，你可以将其视为终端步回报，但通过平均不同的终端来获得估计。使用 GAE 的好处是什么？我想我不是很清楚……","start":2453.91,"end":2482.3},{"id":149,"text":"I think it's a little bit hard to motivate. I think one way to view it is that if you just use this one step return, especially if the time steps are very close together, then this might be, if this estimate is like, if your v's are not completely accurate, then this estimate might be a bit off. And if you increase this horizon, then you'll get potentially a better estimate.","zh":"我认为很难找到一个动机。我认为一种看待它的方式是，如果你仅仅使用这个一步回报，特别是当时间步非常接近时，这可能会有问题。如果这个估计不准确，那么这个估计可能会有偏差。如果你增加这个时间范围，你可能会得到一个更好的估计。","start":2483.78,"end":2507.58},{"id":150,"text":"Now, why not just use one value of n versus a mixture? Perhaps it helps you hedge a little bit if you're not sure which value of n is correct. But I don't have a great motivation myself for it. If you use it in Dart, use it. I'm not 100% sure what the performance is like. OK, cool. So the final PPO algorithm, we sample a batch of data. We fit a value function to that data.","zh":"那么，为什么不只使用一个n值，而使用混合值呢？也许如果你不确定哪个n值是正确的，使用混合值可以帮你稍微降低一些风险。但我自己并没有很强的动机支持这一点。如果你在Dart中使用它，就使用吧。我不百分之百确定它的性能如何。好的，明白了。因此最终的PPO算法，我们采样一批数据。我们拟合一个价值函数到这些数据上。","start":2508.06,"end":2536.55}],"notes":["本段讨论了优势估计的方差和偏差之间的权衡。讲者指出，使用不同步长的估计方法可能会带来不同的方差和偏差，但具体是否必要尚不明确。这表明在强化学习中，选择合适的估计方法需要权衡偏差和方差。","讲者提到，通常会使用较早的步长来减少方差，并且随着时间步长的增加，权重会迅速衰减。这表明在实际应用中，选择合适的权重策略对于降低估计的方差至关重要。","讲者进一步解释了如何将权重与gamma和lambda结合使用，以得到一个乘以gamma和lambda的项。这表明在实现GAE（广义优势估计）时，需要考虑这些参数的组合。","讲者提到，GAE可以看作是不同终点回报的加权平均，但其优势在于如何估计优势函数。这表明GAE的核心思想是通过加权平均不同时间步长的回报来提高估计的准确性。","讲者指出，使用单一步长的回报可能会导致估计偏差，尤其是在时间步长较小时。而增加时间步长可能会带来更准确的估计，但需要权衡计算复杂性和估计偏差。","最后，讲者提到使用不同n值的混合方法可能有助于在不确定最佳n值时进行权衡，但缺乏明确的理论支持。这表明在实际应用中，选择合适的n值可能需要经验或实验验证。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2385.95,"end":2536.55,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2385.95,"text":"advantage estimates that have varying variance and maybe have less bias than if you just use the one-step estimate right here. I think that there's some argument in terms of bias and variance that can be made, but it's also not 100% clear if it's necessary, in my opinion."},{"start":2410.99,"text":"Right, yeah. So there's now going to be a hyperparameter here with regard to how do you choose these weights with regard to the different end step returns. Generally, you'll mostly use the earlier ones so that you have less variance. And usually, you will choose it to kind of decay very quickly as the horizon increases. You're mostly still going to be using the t equals 1 or n equals 1."},{"start":2441.08,"text":"Right. So if you're using these weights, do you set gamma to one or do you use them together? You'll actually use them together. And if you write this out, you'll get a term that multiplies gamma and lambda here."},{"start":2453.91,"text":"So the question was, this is the same as taking a weighted average of different end step returns for different ends. So the one thing that's different is we're still going to be fitting the value function in the normal way. And then this is in terms of how we estimate the advantage. But otherwise, it's very kind of, you can think of it as end step returns, but averaging the different ends in order to get an estimate. What's the benefit of using GAE? I think I'm not..."},{"start":2483.78,"text":"I think it's a little bit hard to motivate. I think one way to view it is that if you just use this one step return, especially if the time steps are very close together, then this might be, if this estimate is like, if your v's are not completely accurate, then this estimate might be a bit off. And if you increase this horizon, then you'll get potentially a better estimate."},{"start":2508.06,"text":"Now, why not just use one value of n versus a mixture? Perhaps it helps you hedge a little bit if you're not sure which value of n is correct. But I don't have a great motivation myself for it. If you use it in Dart, use it. I'm not 100% sure what the performance is like. OK, cool. So the final PPO algorithm, we sample a batch of data. We fit a value function to that data."}],"speech_gaps":[],"frame":"../frames/v032/015.webp","frame_time":2397.95},{"title":"PPO算法中的超参数与训练过程","segments":[{"id":151,"text":"And then we evaluate this generalized advantage estimate that we just talked about. And then we will update the policy by taking M gradient steps on your surrogate objective, where the surrogate objective uses these clipped importance weights using the GAE estimate of the advantage function. And then you can repeat this process after taking M gradient steps, then kind of sample a new batch of data, fit a new value function to that, and repeat the process.","zh":"然后我们评估刚刚讨论的广义优势估计。接着，我们通过在代理目标上进行M次梯度更新来更新策略，其中代理目标使用了这些被截断的重要性权重，这些权重是基于GAE估计的优势函数。然后，在进行M次梯度更新后，你可以重复这个过程，采样一个新的数据批次，拟合一个新的值函数，然后重复这个过程。","start":2537.12,"end":2567.11},{"id":152,"text":"In order to get a rough sense for what this looks like, here are some example hyperparameters. Now, generally hyperparameters are something that you would tune per domain, so this is not my recommended hyperparameter necessarily, but just to give a rough sense for what this looks like. The batch of data might have around 2,000 timesteps in it.","zh":"为了大致了解这看起来是什么样子，这里有一些示例超参数。通常，超参数是根据不同的领域进行调整的，因此这不一定是我推荐的超参数，但只是为了大致了解它的样子。数据批次中可能包含大约2000个时间步。","start":2570.64,"end":2588.66},{"id":153,"text":"So if you have a long horizon problem that has like a thousand time steps, this might actually be only a couple trajectories. If you have a shorter horizon problem, this might be more trajectories. When you update the policy on step four, a common hyperparameter is something around 10 epochs on the data set that was collected in step one. And so this would be, if your batch size is 64, this might be around 300 gradient steps.","zh":"如果你有一个长时间跨度的问题，包含大约一千个时间步，这实际上可能只包含几条轨迹。如果你有一个较短时间跨度的问题，这可能包含更多的轨迹。在第四步更新策略时，一个常见的超参数是在第一步收集的数据集上进行大约10个周期的训练。因此，如果你的批次大小是64，这可能大约需要300次梯度更新。","start":2589.02,"end":2617.29},{"id":154,"text":"And so this means that in comparison to before, we're actually, because we introduced this clipping, we're actually able to take 300 gradient steps without having really unstable improvement. So that's good.","zh":"这意味着，与之前相比，由于我们引入了截断，我们实际上能够在不产生明显不稳定改进的情况下进行300次梯度更新。这很好。","start":2617.98,"end":2631.9},{"id":155,"text":"Clipping range, I mentioned 0.2 is something that might be reasonable. And then you might run this around 500 times, this full outer loop 500 times, in order to get around a million total time steps of experience.","zh":"截断范围，我提到的0.2可能是合理的。然后你可能会运行这个完整的外层循环大约500次，以获得大约一百万次时间步的经验。","start":2634.04,"end":2648.4},{"id":156,"text":"If you run this algorithm, if you run PPO, we'll see some other examples, actually some cooler examples at the end of the lecture, but if you run PPO on this very simple simulated half cheetah, like the right half of a cheetah or something, and you look at as you collect more time steps of data, what does the reward look like? There are a number of algorithms here. This beige one is vanilla policy gradient.","zh":"如果你运行这个算法，如果你运行PPO，我们将在讲座的最后看到一些其他例子，实际上是一些更酷的例子。但如果你在这个非常简单的模拟半猎豹（比如猎豹的右半部分）上运行PPO，并观察随着你收集更多时间步的数据，奖励会是什么样子？这里有很多算法。这个米色的是普通策略梯度。","start":2650.66,"end":2677.5},{"id":157,"text":"It's a slightly smarter version of Vanilla Policy Gradient, but it's basically Vanilla Policy Gradient, where you're not fitting the advantage function and you're not doing the clipping. And then PPO is up here. And you can see that it's able to, with less experience, able to improve much faster because it's fitting the advantage function and because it's doing the clipping on the gradient in order to take many more gradient steps on a single data point.","zh":"它是一个稍微更聪明的Vanilla Policy Gradient版本，但基本上还是Vanilla Policy Gradient，你并不拟合优势函数，也不进行裁剪。然后PPO在这里。你可以看到，它能够用更少的经验，在更短的时间内显著提升性能，因为它拟合了优势函数，并且对梯度进行裁剪，从而在单个数据点上执行更多的梯度步骤。","start":2678.0,"end":2704.78}],"notes":["本段主要讲解PPO算法中的超参数设置和训练过程。讲者提到，超参数通常是根据具体任务进行调整的，例如批量数据的大小、梯度步数、训练轮次等。在PPO中，通过引入梯度裁剪，可以在不导致不稳定改进的情况下进行更多的梯度更新，从而提高训练效率。","讲者还提到，超参数如裁剪范围（0.2）和训练轮次（500次）是常见的选择，这些参数的设置会影响总的时间步数。例如，一个包含2000个时间步的批量数据，结合64的批量大小和300个梯度步，可以生成大约100万的时间步。","在实际应用中，PPO算法通过拟合优势函数和进行梯度裁剪，相较于传统的策略梯度方法（如Vanilla Policy Gradient），能够更快地提升性能。讲者通过一个模拟的半猎豹环境展示了这一效果，说明PPO在较少经验下也能实现更快的改进。","讲者还提到，PPO算法的训练过程包括重复采样数据、拟合价值函数、更新策略等步骤，这些步骤构成了PPO的完整训练循环。通过多次迭代，算法能够积累更多的经验数据，从而优化策略。","在比较不同算法时，讲者指出Vanilla Policy Gradient和PPO之间的差异在于是否拟合优势函数和是否进行梯度裁剪。PPO通过这些改进，能够在单个数据点上进行更多的梯度更新，从而提升训练效率。","最后，讲者提到PPO算法在实际应用中表现良好，特别是在处理复杂任务时，能够通过裁剪梯度和拟合优势函数，实现更稳定的策略更新。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2537.12,"end":2704.78,"asr_flags":[],"math_clarifications":["所有公式均未提供明确的数学表达式，仅以自然语言描述概念，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2537.12,"text":"And then we evaluate this generalized advantage estimate that we just talked about. And then we will update the policy by taking M gradient steps on your surrogate objective, where the surrogate objective uses these clipped importance weights using the GAE estimate of the advantage function. And then you can repeat this process after taking M gradient steps, then kind of sample a new batch of data, fit a new value function to that, and repeat the process."},{"start":2570.64,"text":"In order to get a rough sense for what this looks like, here are some example hyperparameters. Now, generally hyperparameters are something that you would tune per domain, so this is not my recommended hyperparameter necessarily, but just to give a rough sense for what this looks like. The batch of data might have around 2,000 timesteps in it."},{"start":2589.02,"text":"So if you have a long horizon problem that has like a thousand time steps, this might actually be only a couple trajectories. If you have a shorter horizon problem, this might be more trajectories. When you update the policy on step four, a common hyperparameter is something around 10 epochs on the data set that was collected in step one. And so this would be, if your batch size is 64, this might be around 300 gradient steps."},{"start":2617.98,"text":"And so this means that in comparison to before, we're actually, because we introduced this clipping, we're actually able to take 300 gradient steps without having really unstable improvement. So that's good."},{"start":2634.04,"text":"Clipping range, I mentioned 0.2 is something that might be reasonable. And then you might run this around 500 times, this full outer loop 500 times, in order to get around a million total time steps of experience."},{"start":2650.66,"text":"If you run this algorithm, if you run PPO, we'll see some other examples, actually some cooler examples at the end of the lecture, but if you run PPO on this very simple simulated half cheetah, like the right half of a cheetah or something, and you look at as you collect more time steps of data, what does the reward look like? There are a number of algorithms here. This beige one is vanilla policy gradient."},{"start":2678.0,"text":"It's a slightly smarter version of Vanilla Policy Gradient, but it's basically Vanilla Policy Gradient, where you're not fitting the advantage function and you're not doing the clipping. And then PPO is up here. And you can see that it's able to, with less experience, able to improve much faster because it's fitting the advantage function and because it's doing the clipping on the gradient in order to take many more gradient steps on a single data point."}],"speech_gaps":[],"frame":"../frames/v032/016.webp","frame_time":2549.12},{"title":"离策略Actor-Critic算法的参数更新与超参数调整","segments":[{"id":158,"text":"Yeah, so can I explain the error from 4 to 1 and how are the parameters being updated? So this error is just saying that after we finish step 4, then we're going to go back to step 1 and collect a new batch of data. When we do that, we're going to keep our policy as it was at the current time step and keep on iterating. And so at this point, actually, theta will become the previous theta prime.","zh":"是的，那么我可以解释从步骤4到步骤1的误差以及参数是如何更新的。这个误差只是说，在我们完成步骤4之后，我们会回到步骤1并收集一个新的数据批次。当我们这样做时，我们会保持当前时间步的策略不变并继续迭代。因此，在这一点上，实际上，θ会变成之前的θ'。","start":2705.74,"end":2732.18},{"id":159,"text":"and you'll be sampling a batch of data from your latest policy. And then the other thing here is that for this value function, you could warm start it at the previous value function, or you could train it from scratch. It depends a little bit on the domain. So in terms of these plots, the question is, do you fit the best set of hyperparameters and then run it?","zh":"你将从你最新的策略中采样一批数据。另外一点是，对于这个价值函数，你可以在之前的值函数上进行预热启动，或者从头开始训练。这取决于领域。就这些图表而言，问题是：你是否先拟合最佳的一组超参数，然后运行它？","start":2732.86,"end":2753.0},{"id":160,"text":"Yeah, so each of them will have its own set of hyperparameters, and the best practice is to figure out good hyperparameters on one environment or maybe two environments, and then apply those hyperparameters to the remaining environments in your experiments. There are scenarios where you might need a new set of hyperparameters for a different domain. For example, if you are controlling something at 1 Hz versus 50 Hz,","zh":"是的，每个环境都会有自己的一组超参数，最佳实践是在一个或两个环境中确定良好的超参数，然后将这些超参数应用到实验中的其余环境中。在某些情况下，你可能需要为不同的领域使用一组新的超参数。例如，如果你在1 Hz和50 Hz的频率下控制某个系统，","start":2753.81,"end":2778.03},{"id":161,"text":"or optimizing a language model versus a half cheetah, the hyperparameters will be different. So there is some variability there. One good practice is to not tune your hyperparameters per environment, because then you're essentially using more data, more samples, in order to get those hyperparameters in the first place, and that wouldn't be reflected on this curve right here. We should move on, but happy to answer it after class. So far we've talked about...","zh":"或者优化语言模型与半猎豹的性能，超参数会有所不同。因此，这里存在一些变化性。一个良好的实践是不要为每个环境单独调整超参数，因为这样你实际上是在使用更多的数据、更多的样本，以获得这些超参数，而这不会反映在这条曲线中。我们该继续了，但课后很乐意回答这个问题。到目前为止，我们已经讨论了……","start":2778.48,"end":2809.17},{"id":162,"text":"using one batch of data for one gradient step. That's the fully on policy version. And we've looked at using one batch of policy data for multiple gradient steps. And this is off policy. What I'd like to talk about for the rest of the lecture is can we be even more off policy? So can we reuse previous batches of data rather than recollecting a new batch each time? Like all of the past trial and error experience. And there's two ideas for doing this. One is that we actually need to...","zh":"使用一批数据进行一次梯度更新。这是完全在策略的版本。我们还查看了使用一批策略数据进行多次梯度更新。这是离策略的版本。接下来我想在本节课中讨论的是，我们是否可以更加离策略？也就是说，我们是否可以重用之前的批次数据，而不是每次重新收集一个新的批次？比如所有过去的试错经验。实现这一点有两种想法。其中一种是，我们实际上需要……","start":2809.55,"end":2838.88},{"id":163,"text":"retain all of our past data. We'll use a term called a replay buffer that you actually saw in homework one, where we will have a data set of past data. We'll keep on adding to it. And at some point, we might also remove some very old data from it. This is called a replay buffer because you're sort of replaying your past experiences.","zh":"保留我们所有的过去数据。我们将使用一个称为经验回放缓冲区（replay buffer）的术语，这个术语你实际上在第一次作业中已经见过，我们将有一个过去数据的数据库。我们会不断向其中添加数据。在某个时候，我们可能也会从中移除一些非常旧的数据。这种方法被称为经验回放缓冲区，因为你在某种程度上是在重放你的过去经历。","start":2839.38,"end":2860.72}],"notes":["本段讲解了离策略Actor-Critic算法中参数更新的机制，即在完成一个步骤后，回到初始步骤并收集新的数据批次，同时保持当前策略不变，继续迭代。这表明在离策略方法中，策略不会随着每次更新而改变，而是基于当前策略进行数据收集。","在调整超参数时，建议在少数环境中进行调优，然后将这些超参数应用到其他环境中。然而，不同领域可能需要不同的超参数设置，例如控制频率或优化目标不同，超参数可能需要重新调整。","本段还提到，使用一个批次的数据进行一次梯度更新是完全的策略内方法，而使用一个批次的数据进行多次梯度更新则是策略外方法。进一步的讨论集中在是否可以更彻底地利用过去的批次数据，而不是每次重新收集新的数据。","为了实现这一点，提出了两个想法：一是保留所有过去的数据，使用称为回放缓冲区（replay buffer）的机制，该机制在作业一中已经介绍过。回放缓冲区允许不断添加新的数据，并在适当的时候移除较旧的数据，从而实现对过去经验的重放。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2705.74,"end":2860.72,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2705.74,"text":"Yeah, so can I explain the error from 4 to 1 and how are the parameters being updated? So this error is just saying that after we finish step 4, then we're going to go back to step 1 and collect a new batch of data. When we do that, we're going to keep our policy as it was at the current time step and keep on iterating. And so at this point, actually, theta will become the previous theta prime."},{"start":2732.86,"text":"and you'll be sampling a batch of data from your latest policy. And then the other thing here is that for this value function, you could warm start it at the previous value function, or you could train it from scratch. It depends a little bit on the domain. So in terms of these plots, the question is, do you fit the best set of hyperparameters and then run it?"},{"start":2753.81,"text":"Yeah, so each of them will have its own set of hyperparameters, and the best practice is to figure out good hyperparameters on one environment or maybe two environments, and then apply those hyperparameters to the remaining environments in your experiments. There are scenarios where you might need a new set of hyperparameters for a different domain. For example, if you are controlling something at 1 Hz versus 50 Hz,"},{"start":2778.48,"text":"or optimizing a language model versus a half cheetah, the hyperparameters will be different. So there is some variability there. One good practice is to not tune your hyperparameters per environment, because then you're essentially using more data, more samples, in order to get those hyperparameters in the first place, and that wouldn't be reflected on this curve right here. We should move on, but happy to answer it after class. So far we've talked about..."},{"start":2809.55,"text":"using one batch of data for one gradient step. That's the fully on policy version. And we've looked at using one batch of policy data for multiple gradient steps. And this is off policy. What I'd like to talk about for the rest of the lecture is can we be even more off policy? So can we reuse previous batches of data rather than recollecting a new batch each time? Like all of the past trial and error experience. And there's two ideas for doing this. One is that we actually need to..."},{"start":2839.38,"text":"retain all of our past data. We'll use a term called a replay buffer that you actually saw in homework one, where we will have a data set of past data. We'll keep on adding to it. And at some point, we might also remove some very old data from it. This is called a replay buffer because you're sort of replaying your past experiences."}],"speech_gaps":[],"frame":"../frames/v032/017.webp","frame_time":2717.74},{"title":"使用经验回放缓冲区的离策略Actor-Critic算法","segments":[{"id":164,"text":"And then the second idea is we actually need to adjust some of the equations to remove some of the on-policy assumptions in order to be able to actually use all of our past data. Okay, so what this looks like is we'll take our actor-critic algorithm, but to make it off-policy, we can think of it as getting one timestep of data, then updating our policy, getting another timestep, updating our policy, and so forth. So rather than getting one batch and then doing updates, we can actually do this much more online.","zh":"然后第二个想法是我们实际上需要调整一些方程，以去除一些在策略的假设，从而能够真正使用我们所有的过去数据。好的，那么这看起来像什么？我们可以将我们的actor-critic算法视为获取一个时间步的数据，然后更新我们的策略，获取另一个时间步，更新我们的策略，依此类推。因此，而不是获取一个批次然后进行更新，我们实际上可以更加在线地进行这个过程。","start":2862.59,"end":2891.19},{"id":165,"text":"And when we update our policy, this will actually be coming from a replay buffer. We'll be actually doing gradient steps using all of our past experiences rather than just our immediate past experience. And so in particular, when we collect experience, we'll want to then add this to our replay buffer. And when we then update our policy, we want to use a mini batch sampled from all previous data rather than just our last batch of data.","zh":"当我们更新我们的策略时，这实际上将来自于经验回放缓冲区。我们将实际使用我们所有的过去经验，而不是仅仅使用我们最近的经验来进行梯度步骤。因此，特别是在我们收集经验时，我们想要将这些经验添加到我们的回放缓冲区中。然后当我们更新我们的策略时，我们想要使用从所有先前数据中采样的一个迷你批次，而不是仅仅使用我们最后一批数据。","start":2892.73,"end":2922.56},{"id":166,"text":"So that's kind of like the modifications we need to make in order to use a replay buffer. So walking through this, we start with an empty replay buffer. We then collect experience from our policy. We add that to the replay buffer. And then we sample a batch, a transition state action reward and next state from the replay buffer.","zh":"因此，这就是我们需要进行的修改，以便使用回放缓冲区。让我们来逐步说明这一点，我们从一个空的回放缓冲区开始。然后我们从我们的策略中收集经验。我们将这些经验添加到回放缓冲区中。然后我们从回放缓冲区中采样一个批次，即状态、动作、奖励和下一个状态的转移。","start":2923.43,"end":2946.78},{"id":167,"text":"There's a small probability this could be exactly what we just sampled, but otherwise it'll be something randomly sampled from our previous experience. Then we'll update our value function using the batch of data that we just sampled from the buffer. We can update our value function with the same objective before, but now we're going to be averaging over our mini-batch. And then we can evaluate the advantage and then take a gradient step on our policy.","zh":"这有很小的概率会和我们刚刚采样的数据完全相同，否则它将是从我们之前经验中随机采样的。然后我们将使用从缓冲区中采样的这批数据来更新我们的价值函数。我们可以使用之前相同的优化目标来更新我们的价值函数，但现在我们将对我们的迷你批次进行平均。然后我们可以评估优势，并对我们的策略进行梯度步骤。","start":2947.64,"end":2977.37},{"id":168,"text":"So that's kind of the mechanics of replay buffers. Now, and yeah, finally update the policy and then kind of repeat this process. Unfortunately, this algorithm right now is currently broken. It is broken in two different ways. The first way that it's broken is right here. So say that we're using bootstrapping to update our value function. Then our target would be the reward at the current time step plus our value estimate.","zh":"因此，这就是回放缓冲区的运作机制。现在，是的，最后更新策略，然后重复这个过程。不幸的是，这个算法目前是不正确的。它以两种不同的方式存在错误。第一种错误就在这里。例如，如果我们使用自举来更新我们的价值函数，那么我们的目标将是当前时间步的奖励加上我们的价值估计。","start":2979.15,"end":3011.11}],"notes":["本段讲解了使用经验回放缓冲区（replay buffer）来实现离策略（off-policy）Actor-Critic算法的关键修改。教师指出，传统的策略更新依赖于即时经验，而使用回放缓冲区可以利用所有过去的经验数据，从而提高算法的效率和稳定性。教师还提到，当更新策略时，应从回放缓冲区中采样一个mini-batch，而不是仅使用最近的数据。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2862.59,"end":3011.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2862.59,"text":"And then the second idea is we actually need to adjust some of the equations to remove some of the on-policy assumptions in order to be able to actually use all of our past data. Okay, so what this looks like is we'll take our actor-critic algorithm, but to make it off-policy, we can think of it as getting one timestep of data, then updating our policy, getting another timestep, updating our policy, and so forth. So rather than getting one batch and then doing updates, we can actually do this much more online."},{"start":2892.73,"text":"And when we update our policy, this will actually be coming from a replay buffer. We'll be actually doing gradient steps using all of our past experiences rather than just our immediate past experience. And so in particular, when we collect experience, we'll want to then add this to our replay buffer. And when we then update our policy, we want to use a mini batch sampled from all previous data rather than just our last batch of data."},{"start":2923.43,"text":"So that's kind of like the modifications we need to make in order to use a replay buffer. So walking through this, we start with an empty replay buffer. We then collect experience from our policy. We add that to the replay buffer. And then we sample a batch, a transition state action reward and next state from the replay buffer."},{"start":2947.64,"text":"There's a small probability this could be exactly what we just sampled, but otherwise it'll be something randomly sampled from our previous experience. Then we'll update our value function using the batch of data that we just sampled from the buffer. We can update our value function with the same objective before, but now we're going to be averaging over our mini-batch. And then we can evaluate the advantage and then take a gradient step on our policy."},{"start":2979.15,"text":"So that's kind of the mechanics of replay buffers. Now, and yeah, finally update the policy and then kind of repeat this process. Unfortunately, this algorithm right now is currently broken. It is broken in two different ways. The first way that it's broken is right here. So say that we're using bootstrapping to update our value function. Then our target would be the reward at the current time step plus our value estimate."}],"speech_gaps":[],"frame":"../frames/v032/018.webp","frame_time":2874.59},{"title":"Off-Policy Actor Critic算法中价值函数的策略归属问题","segments":[{"id":169,"text":"for the next state. And so I have a question for you. And the question is, when we're fitting a value function on all of the data in the replay buffer, so this is the data from all of our previous policies, the question is, what policy are we learning a value function for when we fit the value function this way from data in our replay buffer? And so I'll give you kind of two minutes to discuss that, and then we'll come back. Okay, let's come back.","zh":"对于下一个状态。因此，我有一个问题要问你们。问题是，当我们使用回放缓冲区中的所有数据来拟合价值函数时，也就是这些数据来自我们之前的所有策略，问题是，当我们从回放缓冲区中的数据拟合价值函数时，我们实际上是在为哪种策略学习价值函数？我给你们两分钟时间讨论这个问题，然后我们再回来。好的，我们回来了。","start":3011.79,"end":3042.76},{"id":170,"text":"I also should have maybe mentioned that this question is the answer is not as clean as some other questions. So the response there was that the so for our latest policy, we actually don't have any. Well, we have.","zh":"我可能应该提到，这个问题的答案并不像其他问题那样清晰。因此，回答是，对于我们最新的策略，我们实际上并没有。或者说，我们有。","start":3043.65,"end":3057.89},{"id":171,"text":"we have maybe one data point from that policy, but most of the buffer is not, like the rest of the buffer is not from that policy, right? And so we don't actually have any really much data at all from our current policy. So it's not our current policy. And that's why this is incorrect. And in particular, when we collect kind of trajectories from previous policies, the actions will be different. And that means that the next state will also be different when you took that action, as well as the reward.","zh":"我们可能有一个来自该策略的数据点，但缓冲区中的大部分数据并不是来自该策略，对吧？因此，我们实际上从当前策略中并没有太多数据。因此，这并不是当前策略。这就是为什么这是错误的。具体来说，当我们收集来自之前策略的轨迹时，采取的动作会不同。这意味着，当你采取那个动作时，下一个状态以及奖励也会不同。","start":3058.56,"end":3085.88},{"id":172,"text":"Yeah, so the policy that you're going to be learning a value function for, I'll phrase it slightly differently. The policy that you'll be learning a value function for is sort of some sort of mixture of all of your past policies. It's actually not trivial to write it down. If things were collected in a particular way, the policy might look something like an average.","zh":"是的，你所要学习价值函数的策略，我可以稍作不同的表述。你所要学习价值函数的策略实际上是所有过去策略的一种混合。实际上，很难将其写出来。如果数据是以某种特定方式收集的，该策略可能看起来像一个平均值。","start":3086.73,"end":3114.09},{"id":173,"text":"over like your previous policies. If you had n previous policies. Now it's actually a little bit different than this because in some states you might like one policy might have kind of gone over here and another policy might have gone over here. And so then in this state it's going to be a mixture of policies but in this state it's going to be more of this policy and this state it's going to be a different policy. So it's actually a little bit messy but","zh":"类似于你之前的策略。如果你有n个之前的策略。现在，这实际上与这种情况略有不同，因为在某些状态下，一个策略可能倾向于去这里，而另一个策略可能倾向于去那里。因此，在这个状态下，它将是策略的混合，但在这个状态下，它将更多地偏向于这个策略，而在另一个状态下，它将偏向于另一个策略。因此，实际上这有点复杂，但","start":3115.08,"end":3140.28},{"id":174,"text":"The thing that's definitive is that it's not going to be a value function for your current policy. And we would like to get a value function for our current policy using data from previous policies so that we can actually estimate this advantage for our current policy and get an accurate gradient for our current policy. It's a little bit messy, but it's a policy that is kind of a conglomeration of your previous policies.","zh":"可以确定的是，它不会是当前策略的价值函数。我们希望利用之前策略的数据来获得当前策略的价值函数，这样我们才能为当前策略估计优势，并得到准确的梯度。这有点复杂，但这是一个融合了你之前策略的策略。","start":3140.68,"end":3167.86}],"notes":["本段讨论了在使用经验回放缓冲区中的数据拟合价值函数时，所学习的价值函数对应的策略问题。讲者指出，由于缓冲区中的数据来自多个不同的策略，因此价值函数并不是针对当前策略的，而是某种过去策略的混合。","讲者强调，当前策略的数据在缓冲区中非常有限，因此无法直接使用这些数据来估计当前策略的优势函数和梯度。这表明，使用过去策略的数据来估计当前策略的性能存在一定的挑战。","讲者进一步说明，不同策略在不同状态下的行为可能不同，因此价值函数的混合形式会根据状态而变化。这种混合形式并不是简单的平均，而是根据状态的不同而有所变化。","讲者指出，尽管这种混合形式较为复杂，但其核心结论是：价值函数并不是针对当前策略的。因此，需要找到一种方法，利用过去策略的数据来估计当前策略的价值函数。","讲者提到，这种混合策略的复杂性使得在实际应用中需要特别注意如何处理不同策略之间的差异，以确保价值函数的估计能够准确反映当前策略的性能。","最后，讲者总结了这一问题的核心：使用过去策略的数据来估计当前策略的价值函数，虽然存在挑战，但这是实现Off-Policy Actor-Critic算法的关键步骤之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3011.79,"end":3167.86,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3011.79,"text":"for the next state. And so I have a question for you. And the question is, when we're fitting a value function on all of the data in the replay buffer, so this is the data from all of our previous policies, the question is, what policy are we learning a value function for when we fit the value function this way from data in our replay buffer? And so I'll give you kind of two minutes to discuss that, and then we'll come back. Okay, let's come back."},{"start":3043.65,"text":"I also should have maybe mentioned that this question is the answer is not as clean as some other questions. So the response there was that the so for our latest policy, we actually don't have any. Well, we have."},{"start":3058.56,"text":"we have maybe one data point from that policy, but most of the buffer is not, like the rest of the buffer is not from that policy, right? And so we don't actually have any really much data at all from our current policy. So it's not our current policy. And that's why this is incorrect. And in particular, when we collect kind of trajectories from previous policies, the actions will be different. And that means that the next state will also be different when you took that action, as well as the reward."},{"start":3086.73,"text":"Yeah, so the policy that you're going to be learning a value function for, I'll phrase it slightly differently. The policy that you'll be learning a value function for is sort of some sort of mixture of all of your past policies. It's actually not trivial to write it down. If things were collected in a particular way, the policy might look something like an average."},{"start":3115.08,"text":"over like your previous policies. If you had n previous policies. Now it's actually a little bit different than this because in some states you might like one policy might have kind of gone over here and another policy might have gone over here. And so then in this state it's going to be a mixture of policies but in this state it's going to be more of this policy and this state it's going to be a different policy. So it's actually a little bit messy but"},{"start":3140.68,"text":"The thing that's definitive is that it's not going to be a value function for your current policy. And we would like to get a value function for our current policy using data from previous policies so that we can actually estimate this advantage for our current policy and get an accurate gradient for our current policy. It's a little bit messy, but it's a policy that is kind of a conglomeration of your previous policies."}],"speech_gaps":[],"frame":"../frames/v032/019.webp","frame_time":3023.79},{"title":"Off-Policy Actor Critic算法中的价值函数与Q函数","segments":[{"id":175,"text":"or some kind of mixture of your previous policies. It's not something that you can very cleanly write down, but it's a mixture of your past policies. The other thing that's a bit wrong about this is that here, this is also not the action that the policy would have taken. Likewise, when you pass the action into the advantage, that's also not the action that the policy would have taken. And so we'll also see how we can fix that part.","zh":"或者是一些你之前策略的混合。这不是一个你可以非常清晰地写出的东西，但它确实是过去策略的混合。另一个问题在于，这里也不是策略会采取的动作。同样地，当你将动作传递给优势函数时，也不是策略会采取的动作。因此，我们也会看到如何修复这一部分。","start":3169.21,"end":3197.02},{"id":176,"text":"But first, let's talk about the value function. And we have this key question of how do we fit a value function for our current policy using a replay buffer of data from past policies? So one idea here is instead of trying to fit v, what if we try to fit q instead of v? So we can remember that q","zh":"但首先，让我们谈谈价值函数。我们有一个关键的问题：如何利用来自过去策略的数据回放缓冲区来拟合当前策略的价值函数？因此，一个想法是，与其尝试拟合 v，不如尝试拟合 q 代替 v。因此，我们可以记住 q","start":3197.92,"end":3226.72},{"id":177,"text":"The Q function is very similar to the value function, but it's the sum of rewards if we start at S and take action A.","zh":"Q 函数与价值函数非常相似，但它是在状态 S 并采取动作 A 时的奖励总和。","start":3229.14,"end":3236.68},{"id":178,"text":"So you can think of it as the sum over, say this is S, T, and A, T.","zh":"你可以把它看作是对时间步的求和，比如说，这是 S、T 和 A、T。","start":3237.2,"end":3244.04},{"id":179,"text":"This is the sum of time steps starting at T, maybe the end of the trajectory of the reward.","zh":"这是从时间步 T 开始的奖励总和，可能是轨迹的结束。","start":3244.52,"end":3252.76},{"id":180,"text":"board, r of s t prime a t prime, under the expectation","zh":"板，r of s t prime a t prime，在期望下","start":3252.76,"end":3262.36},{"id":181,"text":"that we're running our policies after taking","zh":"在采取了","start":3262.36,"end":3265.14},{"id":182,"text":"state s t and action a t.","zh":"状态 s t 和动作 a t 之后运行我们的策略","start":3265.14,"end":3268.14},{"id":183,"text":"And so it is under the expectation of pi theta","zh":"因此，这是在策略πθ的期望下","start":3268.38,"end":3272.5},{"id":184,"text":"conditioned on s t a t.","zh":"条件在状态s_t和动作a_t上。","start":3273.36,"end":3277.04},{"id":185,"text":"So this is just the definition of the Q function.","zh":"因此，这就是Q函数的定义。","start":3278.82,"end":3282.22},{"id":186,"text":"So we have the summation over future timesteps.","zh":"因此，我们可以开始写出未来时间步的求和项。","start":3288.18,"end":3291.1},{"id":187,"text":"We can actually start to write out the summation.","zh":"我们实际上可以开始写出求和项。","start":3291.54,"end":3295.76},{"id":188,"text":"And in particular, if we write out the first timestep, the first state in action is actually","zh":"特别是，如果我们写出第一个时间步，第一个状态和动作实际上是","start":3296.1,"end":3303.2},{"id":189,"text":"just STAT because that's what we're passing into the Q function. So we can write this as","zh":"仅仅STAT，因为这就是我们传入Q函数的内容。因此，我们可以写成","start":3303.2,"end":3308.14},{"id":190,"text":"we know the reward of the first state in action that we took and then we could have a summation","zh":"我们知道采取的第一个状态和动作的奖励，然后我们可以有一个求和项","start":3308.78,"end":3315.9},{"id":191,"text":"over things starting at t plus one of the sum of future rewards.","zh":"从t加一之后开始的未来奖励的总和。","start":3317.54,"end":3324.06},{"id":192,"text":"Now for this sum of future rewards this would now need to be an expectation","zh":"现在，对于这个未来奖励的总和，它现在需要成为一个期望值。","start":3326.94,"end":3331.16},{"id":193,"text":"expectation after STAT. And so for this one, we would need an expectation if we were starting","zh":"期望值是在STAT之后。因此，如果我们从那里开始，我们需要一个期望值。","start":3331.16,"end":3341.36}],"notes":["本段讨论了在Off-Policy Actor Critic算法中，如何使用过去策略的数据来拟合当前策略的价值函数。讲者指出，直接拟合价值函数可能存在问题，因此提出拟合Q函数作为替代方案。Q函数与价值函数类似，但它是从状态S和动作A开始的累积奖励。"],"formulas":[],"uncertainties":["board, r of s t prime a t prime, under the expectation"],"diagram":"none","start":3169.21,"end":3341.36,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3169.21,"text":"or some kind of mixture of your previous policies. It's not something that you can very cleanly write down, but it's a mixture of your past policies. The other thing that's a bit wrong about this is that here, this is also not the action that the policy would have taken. Likewise, when you pass the action into the advantage, that's also not the action that the policy would have taken. And so we'll also see how we can fix that part."},{"start":3197.92,"text":"But first, let's talk about the value function. And we have this key question of how do we fit a value function for our current policy using a replay buffer of data from past policies? So one idea here is instead of trying to fit v, what if we try to fit q instead of v? So we can remember that q"},{"start":3229.14,"text":"The Q function is very similar to the value function, but it's the sum of rewards if we start at S and take action A."},{"start":3237.2,"text":"So you can think of it as the sum over, say this is S, T, and A, T."},{"start":3244.52,"text":"This is the sum of time steps starting at T, maybe the end of the trajectory of the reward."},{"start":3252.76,"text":"board, r of s t prime a t prime, under the expectation"},{"start":3262.36,"text":"that we're running our policies after taking"},{"start":3265.14,"text":"state s t and action a t."},{"start":3268.38,"text":"And so it is under the expectation of pi theta"},{"start":3273.36,"text":"conditioned on s t a t."},{"start":3278.82,"text":"So this is just the definition of the Q function."},{"start":3288.18,"text":"So we have the summation over future timesteps."},{"start":3291.54,"text":"We can actually start to write out the summation."},{"start":3296.1,"text":"And in particular, if we write out the first timestep, the first state in action is actually"},{"start":3303.2,"text":"just STAT because that's what we're passing into the Q function. So we can write this as"},{"start":3308.78,"text":"we know the reward of the first state in action that we took and then we could have a summation"},{"start":3317.54,"text":"over things starting at t plus one of the sum of future rewards."},{"start":3326.94,"text":"Now for this sum of future rewards this would now need to be an expectation"},{"start":3331.16,"text":"expectation after STAT. And so for this one, we would need an expectation if we were starting"}],"speech_gaps":[{"start":3284.32,"end":3285.872}],"frame":"../frames/v032/020.webp","frame_time":3181.21},{"title":"Off-Policy Actor-Critic 算法中的Q函数递归定义","segments":[{"id":194,"text":"from ST plus 1 under the dynamics and remaining actions and end state sampled from pi theta.","zh":"从 ST 加 1，在动态和剩余动作以及结束状态从 pi theta 中采样而来。","start":3341.36,"end":3359.22},{"id":195,"text":"theta. This is for pi theta. Now, this is starting to look also a lot like a value function,","zh":"theta。这是针对 pi theta 的。现在，这开始看起来也像一个价值函数，","start":3359.22,"end":3368.92},{"id":196,"text":"but for the st plus 1. And so you can actually also write this in terms of q. And in particular,","zh":"但针对的是 st 加 1。因此，你实际上也可以用 q 来表达这个。特别是，","start":3369.28,"end":3382.4},{"id":197,"text":"particular, you can write this. This is equivalent to the reward at the current time step, plus","zh":"特别是，你可以这样写。这等价于当前时间步的奖励，加上","start":3382.4,"end":3390.34},{"id":198,"text":"if we then kind of try to take this one step further, then we'll have s t plus one sampled","zh":"如果我们再进一步尝试这一步，那么我们将有 s t 加 1 从动态中采样，a t 加 1 从我们的策略中采样。因此，如果我们对 ST 加 1 和 AT 加 1 从我们的策略中采样进行期望","start":3391.78,"end":3396.86},{"id":199,"text":"from the dynamics and a t plus one sampled from our policy. So if we have the expectation","zh":"那么当前时间步的 Q 就是奖励加上下一个 Q 的期望。因此，我们可以本质上这样递归地定义 Q，即当前时间步的奖励加上下一个时间步的未来 Q。这个方程的美妙之处在于，这个方程对于任何状态和动作都成立。我们没有对特定的状态和动作做出任何假设","start":3396.86,"end":3404.78},{"id":200,"text":"over ST plus one and AT plus one sampled from our policy.","zh":"zh","start":3404.78,"end":3410.96},{"id":201,"text":"then the Q at the current time step is the reward plus this expectation of the next Q. And so we can essentially define Q recursively like this as the reward at the current time step plus the future Q at the next time step. And the thing that's really nice about this equation is that this equation holds for any state in action. We haven't made any assumption about which state in action","zh":"那么当前时间步的Q值就是当前时间步的奖励加上下一个Q值的期望。因此，我们可以像这样递归地定义Q值，即当前时间步的奖励加上下一个时间步的未来Q值。这个方程的美妙之处在于，这个方程对于任何状态和动作都成立。我们并没有对具体的状态和动作做出任何假设","start":3413.55,"end":3445.3},{"id":202,"text":"this data was collected for. And so if we walk through that on the slides again, so we have data points that are state action reward next state. This is sampled from some other policy. And we also have the future reward. This is kind of a trajectory collected from an old policy. This action was taken from the past policy. And this future reward depends on the past policy's actions.","zh":"这些数据是为其他策略收集的。如果我们再次回顾幻灯片中的内容，我们有数据点，包括状态、动作、奖励和下一个状态。这些数据是从某个其他策略中采样的。我们还拥有未来的奖励。这类似于从旧策略中收集的轨迹。这个动作是根据过去策略采取的。而这个未来的奖励依赖于过去策略的动作。","start":3446.75,"end":3472.46},{"id":203,"text":"We don't want to use the future reward part because this is going to depend on the past policy actions in a pretty complicated way. But if we're fitting Q of SA, then we're actually passing the action as input, and it's actually okay if that action is a bit different from what our policy would have taken. And so because that's okay, and because we have this equation that represents this recursion, then we can actually try to fit QA","zh":"我们不希望使用未来的奖励部分，因为这会以一种相当复杂的方式依赖于过去策略的动作。但如果我们是在拟合Q(S,A)，那么实际上我们将动作作为输入，而如果这个动作与我们策略所采取的动作略有不同，这也是可以接受的。因此，由于这一点是可以接受的，并且我们有表示这种递归关系的方程，我们实际上可以尝试拟合Q_A。","start":3473.64,"end":3503.76}],"notes":["本段讲解了Q函数的递归定义，即当前时间步的奖励加上下一时间步Q值的期望。这种递归关系适用于任何状态和动作对，而无需假设数据是通过当前策略收集的。","讲者提到，数据点是通过其他策略收集的，因此未来奖励依赖于旧策略的动作。这使得直接使用未来奖励变得复杂，但通过Q函数的递归定义，可以避免这种依赖。","在拟合Q函数时，即使输入的动作与当前策略的动作略有不同，也是可以接受的，因为Q函数的定义允许这种灵活性。","讲者强调，这种递归关系使得我们可以尝试拟合Q函数，从而在Off-Policy Actor-Critic算法中实现策略优化。","讲者还提到，数据点包括状态、动作、奖励和下一个状态，这些数据点来自旧策略的轨迹，因此需要特别注意如何处理未来奖励的依赖性。","最后，讲者指出，由于Q函数的递归定义，我们可以尝试拟合Q函数，从而在算法中实现策略的更新。"],"formulas":[],"uncertainties":["QA 的完整表达式未明确给出，可能为 Q of SA 的缩写，但具体含义需进一步确认。","ST plus 1 和 AT plus one 的表达式可能存在断句问题，但整体语义清晰。"],"diagram":"none","start":3341.36,"end":3503.76,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":3341.36,"text":"from ST plus 1 under the dynamics and remaining actions and end state sampled from pi theta."},{"start":3359.22,"text":"theta. This is for pi theta. Now, this is starting to look also a lot like a value function,"},{"start":3369.28,"text":"but for the st plus 1. And so you can actually also write this in terms of q. And in particular,"},{"start":3382.4,"text":"particular, you can write this. This is equivalent to the reward at the current time step, plus"},{"start":3391.78,"text":"if we then kind of try to take this one step further, then we'll have s t plus one sampled"},{"start":3396.86,"text":"from the dynamics and a t plus one sampled from our policy. So if we have the expectation"},{"start":3404.78,"text":"over ST plus one and AT plus one sampled from our policy."},{"start":3413.55,"text":"then the Q at the current time step is the reward plus this expectation of the next Q. And so we can essentially define Q recursively like this as the reward at the current time step plus the future Q at the next time step. And the thing that's really nice about this equation is that this equation holds for any state in action. We haven't made any assumption about which state in action"},{"start":3446.75,"text":"this data was collected for. And so if we walk through that on the slides again, so we have data points that are state action reward next state. This is sampled from some other policy. And we also have the future reward. This is kind of a trajectory collected from an old policy. This action was taken from the past policy. And this future reward depends on the past policy's actions."},{"start":3473.64,"text":"We don't want to use the future reward part because this is going to depend on the past policy actions in a pretty complicated way. But if we're fitting Q of SA, then we're actually passing the action as input, and it's actually okay if that action is a bit different from what our policy would have taken. And so because that's okay, and because we have this equation that represents this recursion, then we can actually try to fit QA"}],"speech_gaps":[],"frame":"../frames/v032/021.webp","frame_time":3353.36},{"title":"Off-Policy Actor Critic算法中的Q函数定义与更新","segments":[{"id":204,"text":"to a target that looks like this. And so we have our definition of the Q function of the future rewards condition on the state in action. And for any state in action, we have this equivalence where Q for pi theta of SA is the reward at the current time step plus the Q function at the next time step where the next time you have an expectation over the next time step and an expectation over the next action for our policy.","zh":"目标看起来像这样。因此，我们定义了在状态和动作条件下未来奖励的Q函数。对于任何状态和动作，我们有这个等价关系，其中Q对于策略πθ的SA是当前时间步的奖励加上下一个时间步的Q函数，其中下一个时间步的期望是针对下一个时间步和下一个动作的策略的期望。","start":3504.38,"end":3535.3},{"id":205,"text":"For this data, we have this action, and for the Q function, it takes its input and action, but the rest of the trajectory was still following a different policy. And the Q needs to be summing the rewards for our current policy, not the other policy. And the thing that we've done here is that if we represent this Q in terms of Q for our current policy,","zh":"对于这些数据，我们有这个动作，对于Q函数，它接受输入和动作，但其余的轨迹仍然遵循不同的策略。而Q需要对当前策略的奖励进行求和，而不是其他策略。我们在这里所做的就是，如果我们将这个Q用当前策略的Q来表示，","start":3537.4,"end":3564.27},{"id":206,"text":"This second term right here is actually not using the future data at all. It's using, well, the S prime, we will be using the data, but it's not using anything after S prime. And in particular, we're using our kind of bootstrapped estimate of Q at the next time step.","zh":"这里的第二项实际上并没有使用未来的数据。它使用的是S prime，我们会使用数据，但并没有使用S prime之后的内容。特别是，我们使用的是对下一个时间步Q的某种自举估计。","start":3564.84,"end":3588.48},{"id":207,"text":"for the next action, instead of using the action that was taken in our data, we can use the action sampled from our current policy. So we're recursively defining the Q function here, and the only things that we'll... Maybe we could actually just kind of go through the next part. So what we'll do here is we'll sample an SAS' from the buffer. This A was from an old policy, but the dynamics are constant, right?","zh":"对于下一个动作，我们不需要使用数据中采取的动作，而是可以使用从当前策略中采样的动作。因此，我们在这里递归地定义了Q函数，而我们将会……也许我们直接进入下一步。我们将从缓冲区中采样一个SAS'。这个A来自旧策略，但动态是恒定的，对吧？","start":3590.72,"end":3619.11},{"id":208,"text":"And then we'll sample an A' from our current policy.","zh":"然后我们将从当前策略中采样一个A'。","start":3620.14,"end":3624.32},{"id":209,"text":"This is a sample from our current policy conditioned on S'.","zh":"这是从当前策略中对S'的条件采样。","start":3624.66,"end":3629.58},{"id":210,"text":"And then we can estimate the Q function as the reward at the current time step","zh":"然后我们可以将Q函数估计为当前时间步的奖励","start":3631.22,"end":3636.44},{"id":211,"text":"plus the Q function for the next state in the buffer","zh":"加上缓冲区中下一个状态的Q函数","start":3636.44,"end":3642.18},{"id":212,"text":"and an action sampled from our policy here.","zh":"并且这里是从我们的策略中采样的一个动作。","start":3642.18,"end":3645.6},{"id":213,"text":"And because this action is sampled from our policy,","zh":"而且因为这个动作是从我们的策略中采样的，","start":3645.76,"end":3647.8},{"id":214,"text":"rather than from the data set,","zh":"而不是从数据集中采样的，","start":3647.8,"end":3651.54},{"id":215,"text":"then we're actually getting an estimate","zh":"那么我们实际上得到了我们当前策略的Q函数的一个估计。","start":3651.72,"end":3653.34},{"id":216,"text":"for our current policy's Q function.","zh":"所以是的，这是一个好问题。","start":3653.82,"end":3655.92},{"id":217,"text":"So yeah, good question.","zh":"所以问题是，","start":3656.82,"end":3657.78},{"id":218,"text":"So the question was,","zh":"这是否要求我们必须看到数据","start":3657.84,"end":3658.38},{"id":219,"text":"does this require that we see data","zh":"这是否要求我们看到数据","start":3658.48,"end":3659.9},{"id":220,"text":"from all possible state action pairs?","zh":"从所有可能的状态-动作对中？","start":3659.9,"end":3661.66},{"id":221,"text":"There is a very good insight there.","zh":"那里有一个非常好的见解。","start":3664.14,"end":3667.04},{"id":222,"text":"We don't actually need to see data","zh":"我们实际上并不需要看到所有状态-动作对的数据","start":3667.18,"end":3669.18},{"id":223,"text":"from all state action pairs,","zh":"，但这意味着为了这个目标的准确性，","start":3669.18,"end":3670.4},{"id":224,"text":"but it means that for this target to be accurate,","zh":"我们需要有覆盖与我们的策略所采取的动作相似的动作的数据","start":3670.54,"end":3672.86},{"id":225,"text":"we do need to have data that covers actions","zh":"，如果我们没有看到这些数据，","start":3673.08,"end":3676.48},{"id":226,"text":"that are similar to what our policy would be taking and if we haven't seen that data this","zh":"那么这个目标就无法准确实现","start":3676.48,"end":3681.28}],"notes":["本段讲解了在Off-Policy Actor-Critic算法中，Q函数的定义和更新方式。Q函数表示在某个状态和动作下，未来奖励的期望值。在更新过程中，使用了当前策略采样的动作，而不是数据集中记录的动作，从而确保Q函数的估计是基于当前策略的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3504.38,"end":3681.28,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":3504.38,"text":"to a target that looks like this. And so we have our definition of the Q function of the future rewards condition on the state in action. And for any state in action, we have this equivalence where Q for pi theta of SA is the reward at the current time step plus the Q function at the next time step where the next time you have an expectation over the next time step and an expectation over the next action for our policy. Yeah, good question. So the question was,"},{"start":3537.4,"text":"For this data, we have this action, and for the Q function, it takes its input and action, but the rest of the trajectory was still following a different policy. And the Q needs to be summing the rewards for our current policy, not the other policy. And the thing that we've done here is that if we represent this Q in terms of Q for our current policy,"},{"start":3564.84,"text":"This second term right here is actually not using the future data at all. It's using, well, the S prime, we will be using the data, but it's not using anything after S prime. And in particular, we're using our kind of bootstrapped estimate of Q at the next time step."},{"start":3590.72,"text":"for the next action, instead of using the action that was taken in our data, we can use the action sampled from our current policy. So we're recursively defining the Q function here, and the only things that we'll... Maybe we could actually just kind of go through the next part. So what we'll do here is we'll sample an SAS' from the buffer. This A was from an old policy, but the dynamics are constant, right?"},{"start":3620.14,"text":"And then we'll sample an A' from our current policy."},{"start":3624.66,
