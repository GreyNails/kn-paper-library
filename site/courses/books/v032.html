</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 5 Off-Policy Actor Critic算法 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v032.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v032","title":"Lecture 5 Off-Policy Actor Critic算法","course":"强化学习","pages":[{"title":"强化学习课程第5讲：Off-Policy Actor-Critic算法","segments":[{"id":0,"text":"Let's recap what we've talked about the last couple lectures to lead into today. So for policy gradients, we started with our first reinforcement learning algorithm, where our goal was to run a policy to collect a batch of data and improve the policy using that batch of data and then repeat this process so that your approach can get better and better with experience. And the way that we actually improve the policy using this data","zh":"让我们回顾一下我们最近几节课讨论的内容，以引出今天的主题。对于策略梯度，我们从第一个强化学习算法开始，我们的目标是运行一个策略来收集一批数据，然后利用这批数据来改进策略，并重复这个过程，使我们的方法随着经验的积累变得越来越好。而我们实际上利用这些数据改进策略的方法","start":5.17,"end":34.13},{"id":1,"text":"is this equation that we've looked at where we collect samples from the policy. We then try to increase the probability for actions in the data that have a high reward in the future. And then we found that if we subtracted a baseline that's the average reward, that encourages us to have the policy do more of the above average things and less of the below average things.","zh":"是我们在之前讨论过的这个方程，我们从策略中收集样本，然后尝试增加那些在未来有高奖励的动作的概率。接着我们发现，如果我们减去一个基线，也就是平均奖励，这会鼓励我们让策略更多地执行高于平均的动作，而减少执行低于平均的动作。","start":34.59,"end":58.77},{"id":2,"text":"And we also talked about a way, right now, everything here requires that the data be sampled from the exact policy that you're going to be taking a gradient step on. And we talked about how we can use importance weights, this term right here, in order to do multiple gradient steps so that we don't have to collect a new batch of data every single time we want to take one gradient step. We also talked about value functions.","zh":"我们还讨论了一种方法，目前这里的所有内容都要求数据是从你将要进行梯度更新的精确策略中采样的。我们还讨论了如何使用重要性权重，也就是这里的这个术语，来进行多次梯度更新，这样就不需要每次想要进行一次梯度更新时都收集一个新的数据批次。我们还讨论了价值函数。","start":59.86,"end":86.94},{"id":3,"text":"We talked about how a value for a policy of a state is the future expected rewards starting at state S and following pi thereafter. And we talked about a Q function, which is very similar to a value function, except instead of starting at state S, you're going to start at state S and then take action A and then follow the policy.","zh":"我们讨论了策略在某个状态下的价值，即从状态 S 开始并随后遵循策略 π 的未来期望奖励。我们还讨论了 Q 函数，它与价值函数非常相似，只是不同之处在于，Q 函数不是从状态 S 开始，而是从状态 S 开始，然后执行动作 A，再遵循策略。","start":89.04,"end":110.47},{"id":4,"text":"And we can kind of think about these as follows. So if we have a given state that we want to estimate the value of for a policy, then we can run that policy, and the value is capturing the expected sum of rewards. So basically, the sum of rewards of each of these trajectories averaged over these trajectories for that state and that policy. And we can write this as the summation over future timesteps.","zh":"我们可以这样理解这些概念。如果我们有一个给定的状态，想要估计该状态在策略下的价值，那么我们可以运行该策略，而价值则捕捉了奖励的期望总和。基本上，这是这些轨迹中每个轨迹的奖励总和，在该状态和该策略下平均后的结果。我们可以将这个表示为对未来时间步的求和。","start":112.43,"end":140.61},{"id":5,"text":"of our reward if we're starting at ST and following our policy pi. And then for the Q function, instead of starting at S and running the policy, we'll start at S, take A, and then run the policy. And so we will then be averaging over the trajectories that, averaging the sum of rewards over the trajectories that were kind of a result of running the policy after taking action A at state S.","zh":"如果我们从状态ST开始并遵循策略pi，那么这就是我们的奖励。对于Q函数，我们不再从状态S开始并运行策略，而是从状态S开始，采取动作A，然后运行策略。因此，我们将平均所有轨迹的奖励总和，这些轨迹是由于在状态S采取动作A后运行策略而产生的。","start":141.08,"end":169.88}],"notes":["本段主要讲解了策略梯度方法的基本思想，即通过收集数据并利用这些数据来改进策略，同时强调了策略梯度方法需要数据来自当前正在优化的策略。此外，还提到了重要性权重的应用，允许在不重新收集数据的情况下进行多次梯度更新。","课程中进一步介绍了价值函数和Q函数的概念，价值函数衡量的是在某个状态下遵循策略所能获得的未来期望奖励，而Q函数则是在某个状态下采取某个动作后继续遵循策略所能获得的未来期望奖励。","价值函数和Q函数的计算方式是通过轨迹的平均奖励来估计的，即对所有未来时间步的奖励进行求和，并对这些轨迹进行平均。这为后续的策略优化提供了理论基础。","在讲解Q函数时，特别强调了其与价值函数的区别，即Q函数需要在某个状态下采取一个动作，然后继续遵循策略，而价值函数则不需要明确的动作选择。","课程还提到，这些价值函数和Q函数的计算可以通过对所有未来时间步的奖励进行求和，并对轨迹进行平均来实现，这为后续的算法设计提供了数学基础。","最后，课程指出，这些概念为后续的Off-Policy Actor-Critic算法奠定了理论基础，特别是在如何利用重要性权重和价值函数进行策略优化方面。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.17,"end":169.88,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5.17,"text":"Let's recap what we've talked about the last couple lectures to lead into today. So for policy gradients, we started with our first reinforcement learning algorithm, where our goal was to run a policy to collect a batch of data and improve the policy using that batch of data and then repeat this process so that your approach can get better and better with experience. And the way that we actually improve the policy using this data"},{"start":34.59,"text":"is this equation that we've looked at where we collect samples from the policy. We then try to increase the probability for actions in the data that have a high reward in the future. And then we found that if we subtracted a baseline that's the average reward, that encourages us to have the policy do more of the above average things and less of the below average things."},{"start":59.86,"text":"And we also talked about a way, right now, everything here requires that the data be sampled from the exact policy that you're going to be taking a gradient step on. And we talked about how we can use importance weights, this term right here, in order to do multiple gradient steps so that we don't have to collect a new batch of data every single time we want to take one gradient step. We also talked about value functions."},{"start":89.04,"text":"We talked about how a value for a policy of a state is the future expected rewards starting at state S and following pi thereafter. And we talked about a Q function, which is very similar to a value function, except instead of starting at state S, you're going to start at state S and then take action A and then follow the policy."},{"start":112.43,"text":"And we can kind of think about these as follows. So if we have a given state that we want to estimate the value of for a policy, then we can run that policy, and the value is capturing the expected sum of rewards. So basically, the sum of rewards of each of these trajectories averaged over these trajectories for that state and that policy. And we can write this as the summation over future timesteps."},{"start":141.08,"text":"of our reward if we're starting at ST and following our policy pi. And then for the Q function, instead of starting at S and running the policy, we'll start at S, take A, and then run the policy. And so we will then be averaging over the trajectories that, averaging the sum of rewards over the trajectories that were kind of a result of running the policy after taking action A at state S."}],"speech_gaps":[],"frame":"../frames/v032/001.webp","frame_time":17.17},{"title":"Off-Policy Actor-Critic算法中的价值函数与优势函数","segments":[{"id":6,"text":"We can write this as this. Again, the sum over the future of the future rewards, conditioning on starting in state s, taking action a, and then running up the policy in the future. Great. Then we also talked about the advantage function. And this is essentially how much better is it to take one action than to follow the policy. And we can think of this as the Q function for that state in action minus the value function at that state.","zh":"我们可以将这个表达式写成这样。再次，这是对未来奖励的求和，条件是在状态s中采取动作a，并且之后按照策略运行。很好。我们还讨论了优势函数。这基本上是衡量采取某个动作比遵循策略更好多少。我们可以将这个视为该状态下该动作的Q函数减去该状态的价值函数。","start":170.68,"end":198.09},{"id":7,"text":"These are all for a particular policy pi. Now to think a little bit more about kind of intuitively what value functions and Q functions mean, we can take a look at just one quick example. So I think I mentioned in lecture one this example of how DeepMind developed an AI system that could outperform and beat the champion at Go. And this system was called AlphaGo, and they used reinforcement learning to do this.","zh":"这些内容都是针对特定策略π的。现在，为了更直观地理解价值函数和Q函数的含义，我们可以看一下一个简单的例子。我认为我在第一讲中提到了这个例子，即DeepMind开发了一个AI系统，能够超越并击败围棋冠军。这个系统被称为AlphaGo，他们使用强化学习来实现这一目标。","start":199.18,"end":229.68},{"id":8,"text":"And if you were to think about this example, say the reward is the outcome of the game. So it's whether or not AlphaGo won or lost. And then the value function you can think of as the expected outcome given the state of the board and the policy that's being run. And so if you have a better policy, the value function is going to be higher.","zh":"如果你考虑这个例子，奖励可以视为游戏的结果。也就是说，AlphaGo是赢还是输。然后，价值函数可以理解为给定棋盘状态和正在运行的策略的预期结果。因此，如果你有一个更好的策略，价值函数就会更高。","start":230.2,"end":253.13},{"id":9,"text":"And likewise, if you're in a board state where things are looking good for that policy, then you're also going to have a higher value function. So the value function is influenced both by the policy and by the state. So that's kind of an example of what a value function looks like. And likewise, a Q function would be similar, except instead of running the policy from the state, you'd be considering a particular action first before running the policy.","zh":"同样地，如果你处于一个对当前策略有利的棋盘状态，你也会有更高的价值函数。因此，价值函数既受到策略的影响，也受到状态的影响。这就是价值函数的一个例子。同样地，Q函数也是类似的，只是不是从状态运行策略，而是在运行策略之前先考虑一个特定的动作。","start":253.87,"end":279.71},{"id":10,"text":"So we talked about actor-critic methods on Friday last week, and we introduced this equation, which looks a lot like policy gradients, where we're summing over examples, except now instead of using the sum of rewards in a given trajectory, we're using...","zh":"我们在上周五讨论了actor-critic方法，并引入了这个方程，它看起来很像策略梯度，我们对示例进行求和，但现在不是使用给定轨迹中的奖励总和，而是使用……","start":282.08,"end":301.8},{"id":11,"text":"our estimate of how good an action is, or the advantage. And this comes from the sum of awards, which is the Q function, minus the average sum of awards, which is the value. And you can think of this as being different from policy gradients in that we're estimating which actions are good and bad, and then encouraging the policy to do more of the stuff that we think is good. And then we talked about how to actually estimate this, like what's good and bad. This is referred to as policy evaluation, and we can...","zh":"我们对某个动作的好坏，或者优势的估计。这来自于奖励的总和，也就是Q函数，减去奖励的平均总和，也就是价值函数。你可以将这种区别看作与策略梯度方法的不同之处，即我们估计哪些动作是好的，哪些是坏的，然后鼓励策略多做我们认为好的事情。然后我们讨论了如何实际估计这一点，即什么是好和坏。这被称为策略评估，我们可以说...","start":302.12,"end":332.1}],"notes":["本段讲解了价值函数和Q函数的基本概念，强调了它们在强化学习中的作用。价值函数衡量的是在特定状态和策略下，预期的奖励值，而Q函数则是在特定状态和动作下，预期的奖励值。两者都受到策略和状态的影响。","通过AlphaGo的例子，说明了价值函数和Q函数的实际应用。AlphaGo通过强化学习在围棋中击败了人类冠军，其价值函数反映了当前棋盘状态和策略下的预期结果。","优势函数（Advantage Function）被定义为Q函数减去价值函数，用于衡量特定动作相对于策略的优劣。这有助于策略优化，鼓励策略执行更优的动作。","在Actor-Critic方法中，优势函数被用来替代策略梯度中的奖励总和，从而估计动作的好坏。这种方法通过策略评估（Policy Evaluation）来估计这些值。","策略评估是Actor-Critic方法中的关键步骤，用于估计动作的价值，从而指导策略的更新。这与策略梯度方法不同，后者直接使用轨迹中的奖励总和。","本段强调了价值函数和Q函数在强化学习中的核心地位，以及它们如何通过策略和状态的变化而变化。优势函数作为它们的差值，为策略优化提供了依据。"],"formulas":[{"latex":"A(s, a) = Q(s, a) - V(s)","symbols":"优势函数 = Q函数 - 价值函数","explanation":"公式正确表达了优势函数A(s, a)为Q函数Q(s, a)减去价值函数V(s)。","evidence":"We can write this as this. Again, the sum over the future of the future rewards, conditioning on starting in state s, taking action a, and then running up the policy in the future. Great. Then we also talked about the advantage function. And this is essentially how much better is it to take one action than to follow the policy. And we can think of this as the Q function for that state in action minus the value function at that state. And likewise, if you're in a board state where things are looking good for that policy, then you're also going to have a higher value function. So the value function is influenced both by the policy and by the state. So that's kind of an example of what a value function looks like. And likewise, a Q function would be similar, except instead of running the policy from the state, you'd be considering a particular action first before running the policy."}],"uncertainties":["sum of awards"],"diagram":"none","start":170.68,"end":332.1,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复。"],"boards":[{"title":"价值函数与Q函数的基本概念","summary":"价值函数衡量特定状态和策略下的预期奖励，Q函数衡量特定状态和动作下的预期奖励。两者均受策略和状态影响，是强化学习中的核心概念。","relation":"概念关系","conditions":"适用于所有强化学习场景","pitfall":"需区分价值函数与Q函数的定义差异","note_indices":[0,1,2,3,4,5],"formula_indices":[0],"source_ids":[6,7,8,9,10,11],"steps":["价值函数V(s)表示在状态s下遵循策略π的预期奖励。","Q函数Q(s, a)表示在状态s下采取动作a后遵循策略π的预期奖励。","优势函数A(s, a)衡量动作a相对于策略π的优劣，即Q(s, a) - V(s)。"],"nodes":[{"title":"价值函数定义","text":"衡量特定状态和策略下的预期奖励"},{"title":"Q函数定义","text":"衡量特定状态和动作下的预期奖励"},{"title":"优势函数定义","text":"衡量特定动作相对于策略的优劣"},{"title":"策略影响","text":"价值函数和Q函数均受策略影响"},{"title":"状态影响","text":"价值函数和Q函数均受状态影响"}],"id":"v032-002-1","start":170.68,"end":332.1,"formulas":[{"latex":"A(s, a) = Q(s, a) - V(s)","symbols":"优势函数 = Q函数 - 价值函数","explanation":"公式正确表达了优势函数A(s, a)为Q函数Q(s, a)减去价值函数V(s)。","evidence":"We can write this as this. Again, the sum over the future of the future rewards, conditioning on starting in state s, taking action a, and then running up the policy in the future. Great. Then we also talked about the advantage function. And this is essentially how much better is it to take one action than to follow the policy. And we can think of this as the Q function for that state in action minus the value function at that state. And likewise, if you're in a board state where things are looking good for that policy, then you're also going to have a higher value function. So the value function is influenced both by the policy and by the state. So that's kind of an example of what a value function looks like. And likewise, a Q function would be similar, except instead of running the policy from the state, you'd be considering a particular action first before running the policy.","evidence_ids":[6,9]}],"formula_candidates_removed":0,"frame":"../board-frames/v032/002-1.webp","frame_time":183.18}],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":170.68,"text":"We can write this as this. Again, the sum over the future of the future rewards, conditioning on starting in state s, taking action a, and then running up the policy in the future. Great. Then we also talked about the advantage function. And this is essentially how much better is it to take one action than to follow the policy. And we can think of this as the Q function for that state in action minus the value function at that state."},{"start":199.18,"text":"These are all for a particular policy pi. Now to think a little bit more about kind of intuitively what value functions and Q functions mean, we can take a look at just one quick example. So I think I mentioned in lecture one this example of how DeepMind developed an AI system that could outperform and beat the champion at Go. And this system was called AlphaGo, and they used reinforcement learning to do this."},{"start":230.2,"text":"And if you were to think about this example, say the reward is the outcome of the game. So it's whether or not AlphaGo won or lost. And then the value function you can think of as the expected outcome given the state of the board and the policy that's being run. And so if you have a better policy, the value function is going to be higher."},{"start":253.87,"text":"And likewise, if you're in a board state where things are looking good for that policy, then you're also going to have a higher value function. So the value function is influenced both by the policy and by the state. So that's kind of an example of what a value function looks like. And likewise, a Q function would be similar, except instead of running the policy from the state, you'd be considering a particular action first before running the policy."},{"start":282.08,"text":"So we talked about actor-critic methods on Friday last week, and we introduced this equation, which looks a lot like policy gradients, where we're summing over examples, except now instead of using the sum of rewards in a given trajectory, we're using..."},{"start":302.12,"text":"our estimate of how good an action is, or the advantage. And this comes from the sum of awards, which is the Q function, minus the average sum of awards, which is the value. And you can think of this as being different from policy gradients in that we're estimating which actions are good and bad, and then encouraging the policy to do more of the stuff that we think is good. And then we talked about how to actually estimate this, like what's good and bad. This is referred to as policy evaluation, and we can..."}],"speech_gaps":[],"frame":"../frames/v032/002.webp","frame_time":182.68},{"title":"强化学习：Off-Policy Actor Critic算法","segments":[{"id":12,"text":"fit a value function, a neural network that takes as input the state and outputs a scalar value. And we fit this as trying to predict either just the sum of rewards or the next reward plus the value function, where we're bootstrapping off of our own estimates, or the sum of a short set of a short trajectory of rewards plus the value function after that.","zh":"拟合一个价值函数，这是一个神经网络，输入是状态，输出是一个标量值。我们拟合这个函数的目标是预测奖励的总和，或者下一个奖励加上价值函数，其中我们通过自己的估计进行抽样，或者一个短轨迹的奖励总和加上该轨迹之后的价值函数。","start":332.36,"end":355.85},{"id":13,"text":"And then this advantage function is equal to the reward plus the next value function minus the current value. OK, so let's get into the main topic of today, which is that we talked about actor critic methods last week. We're primarily considering on policy actor critic methods. And today we're going to get into two real algorithms that people use, PPO and SAC. And we will start from the actor critic formulation and see how we can make them off policy.","zh":"然后这个优势函数等于奖励加上下一个价值函数减去当前价值。好的，那么我们今天要讨论的主要内容是，我们上周讨论了演员评论家方法。我们主要考虑的是在策略的演员评论家方法。今天我们将介绍两个人们实际使用的算法，PPO和SAC。我们将从演员评论家的框架出发，看看如何使它们成为离策略方法。","start":357.74,"end":388.37},{"id":14,"text":"to be more efficient. And then at the end we'll talk about how PPO, SAC, and imitation learning compare to each other. So the key learning goals is really the key concepts behind practical algorithms like PPO and SAC.","zh":"以提高效率。最后，我们将讨论PPO、SAC和模仿学习之间的比较。因此，关键的学习目标是理解像PPO和SAC这样的实用算法背后的关键概念。","start":388.91,"end":405.58},{"id":15,"text":"Okay, so we have our actor critic method. These are the steps that we go through for an on-policy actor critic method where we sample data, fit rewards with our value function, then we estimate the advantage with this equation here for all of our states and actions in this set of data. Then we estimate what the gradient of our policy is and update our gradient.","zh":"好的，我们有我们的演员评论家方法。这些是我们进行在策略演员评论家方法的步骤，我们采样数据，用价值函数拟合奖励，然后用这里的方程估计所有数据集中状态和动作的优势。接着我们估计策略的梯度并更新梯度。","start":408.04,"end":432.48},{"id":16,"text":"Now, if we want to be able to take multiple gradient steps, we need to be able to evaluate our gradient, not just at the current policy that collected the data, but after we've taken a gradient step, for example, after we take step five, we're now going to have a new set of parameters that were different from what was collected the data in step one. And so what we're going to do is we're going to use importance weights, which we saw in the policy gradient lecture.","zh":"如果我们想要进行多次梯度步骤，我们需要能够评估梯度，而不仅仅是当前策略收集数据时的梯度。例如，在我们进行第五步梯度更新后，我们将有一个新的参数集，与第一步收集数据时的参数不同。因此，我们将使用重要性权重，这我们在策略梯度讲座中已经见过。","start":434.35,"end":463.87},{"id":17,"text":"And so our new objective is going to, or our new gradient is going to look a little bit different. So say that we collected data with pi theta. Now we've taken a gradient step and we have pi theta prime. So we want to be able to evaluate the gradient of the objective at theta prime. And to do this, we will reuse the data that we collected from pi theta in step one.","zh":"因此，我们的新目标函数或者新梯度将会看起来略有不同。假设我们使用策略π_θ收集了数据。现在我们已经进行了梯度更新，得到了新的策略π_θ'。因此，我们希望能够在θ'处评估目标函数的梯度。为了做到这一点，我们将重用在第一步中从π_θ收集的数据。","start":464.4,"end":493.46}],"notes":["本段介绍了Actor-Critic方法的基本框架，其中价值函数是一个神经网络，输入状态并输出标量值。价值函数的训练目标是预测奖励的总和，或者下一个奖励加上价值函数，其中使用了自举方法。此外，优势函数被定义为奖励加上下一个价值函数减去当前价值。","本段讨论了Actor-Critic方法的扩展，特别是Off-Policy方法。课程重点介绍了PPO和SAC两种实际使用的算法，并提到从Actor-Critic框架出发，如何将其转换为Off-Policy方法。","本段强调了课程的学习目标，即理解PPO和SAC等实际算法背后的关键概念。课程还提到，最后会比较PPO、SAC和模仿学习之间的差异。","本段详细描述了On-Policy Actor-Critic方法的步骤，包括数据采样、价值函数拟合、优势函数估计、策略梯度估计和更新策略。这些步骤构成了On-Policy方法的核心流程。","本段讨论了如何在多个梯度步骤中评估梯度，而不仅仅是当前策略的梯度。课程提到，当策略参数更新后，需要使用重要性权重来重新评估梯度，这在策略梯度课程中已经介绍过。","本段进一步说明了如何在策略更新后重新评估梯度，即使用之前收集的数据来计算新的梯度。这涉及到策略参数的变化以及如何利用旧数据进行更新。"],"formulas":[],"uncertainties":[],"diagram":"none","start":332.36,"end":493.46,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":332.36,"text":"fit a value function, a neural network that takes as input the state and outputs a scalar value. And we fit this as trying to predict either just the sum of rewards or the next reward plus the value function, where we're bootstrapping off of our own estimates, or the sum of a short set of a short trajectory of rewards plus the value function after that."},{"start":357.74,"text":"And then this advantage function is equal to the reward plus the next value function minus the current value. OK, so let's get into the main topic of today, which is that we talked about actor critic methods last week. We're primarily considering on policy actor critic methods. And today we're going to get into two real algorithms that people use, PPO and SAC. And we will start from the actor critic formulation and see how we can make them off policy."},{"start":388.91,"text":"to be more efficient. And then at the end we'll talk about how PPO, SAC, and imitation learning compare to each other. So the key learning goals is really the key concepts behind practical algorithms like PPO and SAC."},{"start":408.04,"text":"Okay, so we have our actor critic method. These are the steps that we go through for an on-policy actor critic method where we sample data, fit rewards with our value function, then we estimate the advantage with this equation here for all of our states and actions in this set of data. Then we estimate what the gradient of our policy is and update our gradient."},{"start":434.35,"text":"Now, if we want to be able to take multiple gradient steps, we need to be able to evaluate our gradient, not just at the current policy that collected the data, but after we've taken a gradient step, for example, after we take step five, we're now going to have a new set of parameters that were different from what was collected the data in step one. And so what we're going to do is we're going to use importance weights, which we saw in the policy gradient lecture."},{"start":464.4,"text":"And so our new objective is going to, or our new gradient is going to look a little bit different. So say that we collected data with pi theta. Now we've taken a gradient step and we have pi theta prime. So we want to be able to evaluate the gradient of the objective at theta prime. And to do this, we will reuse the data that we collected from pi theta in step one."}],"speech_gaps":[],"frame":"../frames/v032/003.webp","frame_time":344.36},{"title":"Off-Policy Actor-Critic 算法中的重要性权重","segments":[{"id":18,"text":"And we're then going to use the same gradient step as before, but we're going to weight the gradient term with an importance ratio that is a ratio between our new policy, pi theta prime, and the policy that was used to collect the data, which is pi theta. So this is our importance weight term right here, and the rest will look the same as before, where we'll be...","zh":"然后我们将使用与之前相同的梯度步长，但我们将用一个重要性比率来加权梯度项，这个比率是我们的新策略 pi theta prime 与用于收集数据的策略 pi theta 之间的比率。这就是我们的重要性权重项，其余部分将与之前相同，我们将……","start":494.9,"end":528.14},{"id":19,"text":"evaluating the gradient of log pi times the advantage estimate. This advantage estimate will still be for the policy before taking a gradient step, pi theta. And this will be for a given S and A pair, for the S-A pair here. Okay, so this is our new gradient. So that's here.","zh":"评估 log pi 的梯度乘以优势估计值。这个优势估计值仍将针对在进行梯度步长之前的策略 pi theta。并且这将针对给定的 S 和 A 对，即此处的 S-A 对。好的，因此这就是我们的新梯度。这就是这里。","start":530.15,"end":561.77},{"id":20,"text":"Now, in principle, once we've done this, this means that we can take multiple gradient steps. So we can sample a batch of data once and then fit our advantage estimates and then compute our gradient, take a gradient step, and then recompute our gradient, take a gradient step, and so forth. And the only thing that's going to change as we take more gradient steps is this importance weight here.","zh":"现在，原则上，一旦我们完成了这些操作，这意味着我们可以进行多次梯度步长。因此，我们可以一次采样一批数据，然后拟合我们的优势估计值，计算梯度，进行一次梯度步长，然后重新计算梯度，进行一次梯度步长，依此类推。随着我们进行更多的梯度步长，唯一会改变的就是这里的这个重要性权重。","start":563.45,"end":589.15},{"id":21,"text":"And of course, we'll be doing backpropagation on our new parameters rather than our old parameters. And our advantage estimates will still be based off of the old policy. Now, there's something that can go wrong here. And to see what can go wrong, it's helpful to actually look at the surrogate objective. Right now, we're looking at the gradient that we're going to be applying.","zh":"当然，我们将对新的参数进行反向传播，而不是旧的参数。我们的优势估计值仍将基于旧策略。现在，这里可能会出现问题。为了看到可能发生什么问题，实际查看替代目标函数是有帮助的。目前，我们正在查看将要应用的梯度。","start":589.73,"end":614.34},{"id":22,"text":"But when we actually implement this in practice, we'll be having some surrogate objective that we construct in order to use auto-differentiation to get the gradients for free from PyTorch. And so if we were to write down the surrogate objective for this, we need to formulate some objective such that the gradient of our surrogate objective is equal to this right here.","zh":"但当我们实际在实践中实现这一点时，我们将构造一个替代目标函数，以便利用自动微分从 PyTorch 中免费获取梯度。因此，如果我们写出这个替代目标函数，我们需要制定一个目标函数，使得该目标函数的梯度等于这里的内容。","start":615.03,"end":641.32},{"id":23,"text":"To do that, we can remember that we have this kind of convenient identity where a probability times the grad log of a probability is equal to the gradient of the original probability. This is kind of the same kind of log trick that we've been seeing we use to formulate the original policy gradient objective. And the way this comes in handy is that we actually see this like pi grad log pi right here.","zh":"要做到这一点，我们可以记住我们有一个方便的恒等式，即概率乘以概率的梯度 log 等于原始概率的梯度。这与我们一直在使用的用于制定原始策略梯度目标函数的对数技巧类似。这种技巧的用处在于，我们实际上会看到这里的 pi grad log pi。","start":645.42,"end":673.47}],"notes":["本段讲解了在Off-Policy Actor-Critic算法中，如何使用重要性权重来调整梯度更新。重要性权重是新策略πθ'与数据收集策略πθ之间的比值，用于修正策略梯度的偏差。梯度计算仍然基于旧策略πθ的策略梯度和优势估计。","在进行多次梯度更新时，重要性权重会随着策略的更新而变化，但优势估计仍然基于旧策略。这表明，虽然策略在更新，但优势估计的计算仍然依赖于旧策略的数据。","在实现中，需要构造一个代理目标函数，以便利用PyTorch的自动微分功能来计算梯度。代理目标函数的梯度应等于实际需要的梯度，这需要利用概率与对数概率的梯度关系。","概率乘以对数概率的梯度等于原概率的梯度，这是策略梯度方法中的一个关键恒等式。这一恒等式帮助将策略梯度的计算转化为更易处理的形式，从而实现梯度的计算。","在实际应用中，需要注意重要性权重可能带来的方差问题，以及如何通过代理目标函数来稳定梯度计算。这涉及到对策略梯度方法的进一步优化和调整。","本段强调了重要性权重在策略更新中的作用，以及如何通过代理目标函数来实现梯度的自动计算。这些内容是理解Off-Policy Actor-Critic算法的关键部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":494.9,"end":673.47,"asr_flags":[],"math_clarifications":["该公式描述了概率分布对参数的梯度与对数概率梯度之间的关系，是正确的数学表达式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":494.9,"text":"And we're then going to use the same gradient step as before, but we're going to weight the gradient term with an importance ratio that is a ratio between our new policy, pi theta prime, and the policy that was used to collect the data, which is pi theta. So this is our importance weight term right here, and the rest will look the same as before, where we'll be..."},{"start":530.15,"text":"evaluating the gradient of log pi times the advantage estimate. This advantage estimate will still be for the policy before taking a gradient step, pi theta. And this will be for a given S and A pair, for the S-A pair here. Okay, so this is our new gradient. So that's here."},{"start":563.45,"text":"Now, in principle, once we've done this, this means that we can take multiple gradient steps. So we can sample a batch of data once and then fit our advantage estimates and then compute our gradient, take a gradient step, and then recompute our gradient, take a gradient step, and so forth. And the only thing that's going to change as we take more gradient steps is this importance weight here."},{"start":589.73,"text":"And of course, we'll be doing backpropagation on our new parameters rather than our old parameters. And our advantage estimates will still be based off of the old policy. Now, there's something that can go wrong here. And to see what can go wrong, it's helpful to actually look at the surrogate objective. Right now, we're looking at the gradient that we're going to be applying."},{"start":615.03,"text":"But when we actually implement this in practice, we'll be having some surrogate objective that we construct in order to use auto-differentiation to get the gradients for free from PyTorch. And so if we were to write down the surrogate objective for this, we need to formulate some objective such that the gradient of our surrogate objective is equal to this right here."},{"start":645.42,"text":"To do that, we can remember that we have this kind of convenient identity where a probability times the grad log of a probability is equal to the gradient of the original probability. This is kind of the same kind of log trick that we've been seeing we use to formulate the original policy gradient objective. And the way this comes in handy is that we actually see this like pi grad log pi right here."}],"speech_gaps":[],"frame":"../frames/v032/004.webp","frame_time":506.9},{"title":"Off-Policy Actor-Critic算法中的策略梯度与优势函数","segments":[{"id":24,"text":"And so this means that this is equal to the gradient of pi theta prime. And if we want to then construct a surrogate objective such that its gradient is this, then the surrogate objective is simply going to be, we can replace this with pi theta of A given S. And then we'll still have the other terms pi theta.","zh":"因此这意味着这等于策略πθ'的梯度。如果我们想要构造一个替代目标函数，使得其梯度为这个值，那么替代目标函数就是简单的将此处替换为πθ在状态S下动作A的条件概率。然后我们仍然保留其他项πθ。","start":674.14,"end":703.69},{"id":25,"text":"and the advantage right here. Let's just say this is just over i, all the examples in our batch. And so the way that I formulated this is the surrogate objective is the gradient of this surrogate objective is equal to this right here. And we see that if we take the gradient of this with respect to theta prime, we get grad theta prime right here.","zh":"这里的优点。让我们假设这是针对所有批次中的示例i的。因此，我这样构建替代目标函数的方式是，替代目标函数的梯度等于此处的值。我们可以看到，如果我们对这个目标函数关于θ'求梯度，就会得到此处的grad θ'。","start":705.88,"end":735.72},{"id":26,"text":"And the gradient of theta prime of pi is equal to pi theta prime times grad log pi theta prime. So you can see this on the slides. So here's our surrogate objective right here. Now, if we look at the surrogate objective, so the policy is going to be trying to maximize this when we take gradient steps on our policy. And if we look at this, if we're trying to maximize this objective,","zh":"并且θ'对策略π的梯度等于πθ'乘以log πθ'的梯度。你可以在幻灯片上看到这一点。这里就是我们的替代目标函数。现在，如果我们观察替代目标函数，当我们在策略上进行梯度更新时，策略将试图最大化这个目标函数。如果我们观察这一点，如果我们试图最大化这个目标函数，","start":736.18,"end":767.97},{"id":27,"text":"We have our advantage estimates, and so the thing that the policy will want to do is it will probably want to take the advantage estimates that are positive and increase the probability of our actions for those. Especially if there are actions that had very low probability, then we want to increase this a lot so that we can get a very high ratio here, such that we kind of increase the likelihood of actions for high advantages, and then for negative advantages, we'll want to decrease the probability.","zh":"我们有我们的优点估计值，因此策略想要做的事情就是，它可能会想要采用正的优点估计值，并增加这些动作的概率。特别是当某些动作的概率非常低时，我们想要大幅增加这个概率，以便获得一个非常高的比率，从而增加高优点动作的可能性，而对于负优点，我们则想要降低概率。","start":769.1,"end":796.98},{"id":28,"text":"Now, this all seems reasonable here.","zh":"所有这些在这里看起来都是合理的。","start":798.03,"end":799.67},{"id":29,"text":"The thing that's a little bit tricky is that these advantages are still based off of the old policy.","zh":"有一点棘手的是，这些优点仍然是基于旧策略的。","start":800.47,"end":805.33},{"id":30,"text":"And they were estimated based on kind of a single batch of data.","zh":"并且它们是基于一个单一数据批次估计的。","start":805.69,"end":810.03},{"id":31,"text":"And so if you take too many gradient steps on the surrogate objective,","zh":"因此，如果你在替代目标函数上进行过多的梯度更新，","start":811.27,"end":815.05},{"id":32,"text":"it means that you might actually kind of in some ways overfit.","zh":"这意味着你实际上可能在某些方面过拟合。","start":815.53,"end":820.25},{"id":33,"text":"You might be using these advantages at some point when they become out of date","zh":"你可能会在它们过时的时候使用这些优势值","start":820.29,"end":824.73},{"id":34,"text":"no longer be applicable to your new policy. And so basically the","zh":"这些优势值将不再适用于你的新策略。因此，基本上","start":824.73,"end":830.85},{"id":35,"text":"challenge that can come up is you might get really unstable learning. As a rough","zh":"可能出现的挑战是你可能会得到非常不稳定的训练。作为一个粗略的","start":830.85,"end":838.73},{"id":36,"text":"visual for what this might look like is if you were to plot the... let's say this","zh":"视觉示例，如果你要绘制……比如说这个","start":838.73,"end":846.83},{"id":37,"text":"This is the number of examples of state actions","zh":"这是状态动作示例的数量","start":846.83,"end":854.01}],"notes":["本段主要讲解了在Off-Policy Actor-Critic算法中，如何通过构造一个替代目标函数（surrogate objective）来优化策略梯度。替代目标函数的梯度等于原始目标函数的梯度，因此可以通过对替代目标函数进行梯度上升来更新策略。替代目标函数的构造方式是将策略πθ替换为πθ'，并保留其他项。"],"formulas":[{"latex":"\\nabla_{\\theta'} \\pi_{\\theta'} = \\pi_{\\theta'} \\nabla_{\\theta'} \\log \\pi_{\\theta'}","symbols":"策略梯度等于策略乘以对数策略的梯度","explanation":"公式正确，符合策略梯度定理，即策略的梯度等于策略本身乘以对数策略的梯度。","evidence":"And the gradient of theta prime of pi is equal to pi theta prime times grad log pi theta prime. So you can see this on the slides. So here's our surrogate objective right here. Now, if we look at the surrogate objective, so the policy is going to be trying to maximize this when we take gradient steps on our policy. And if we look at this, if we're trying to maximize this objective,"}],"uncertainties":["the advantage right here","the number of examples of state actions"],"diagram":"none","start":674.14,"end":854.01,"asr_flags":[],"math_clarifications":["原文未提供其他公式，因此无需进一步核对。"],"boards":[{"title":"构造替代目标函数","summary":"在Off-Policy Actor-Critic算法中，通过构造替代目标函数来优化策略梯度。替代目标函数的梯度等于原始目标函数的梯度，因此可以通过对替代目标函数进行梯度上升来更新策略。替代目标函数的构造方式是将策略πθ替换为πθ'，并保留其他项。","relation":"推导顺序","conditions":"适用于Off-Policy Actor-Critic算法","pitfall":"需注意替代目标函数的梯度与原始目标函数的梯度一致","note_indices":[0],"formula_indices":[],"source_ids":[24,25,26],"steps":["构造替代目标函数，将策略πθ替换为πθ'。","保留其他项，确保梯度与原始目标函数一致。","通过梯度上升对替代目标函数进行优化，更新策略πθ'。"],"nodes":[{"title":"替代目标函数构造","text":"将策略πθ替换为πθ'，保留其他项以确保梯度一致"},{"title":"梯度计算","text":"计算替代目标函数的梯度，确保与原始目标函数梯度一致"},{"title":"策略更新","text":"通过梯度上升对替代目标函数进行优化，更新策略πθ'"},{"title":"目标函数优化","text":"最大化替代目标函数以提升策略性能"}],"id":"v032-005-1","start":674.14,"end":767.97,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v032/005-1.webp","frame_time":686.64},{"title":"策略梯度与优势函数的关系","summary":"策略梯度的计算涉及优势函数，优势函数用于衡量动作相对于策略的优劣。策略会倾向于增加高优势动作的概率，减少低优势动作的概率，从而优化策略。","relation":"概念关系","conditions":"适用于Off-Policy Actor-Critic算法","pitfall":"需注意优势函数基于旧策略，可能导致过时","note_indices":[],"formula_indices":[0],"source_ids":[27,29,30,31,32,33,34,35,36,37],"steps":["计算优势函数，衡量动作相对于策略的优劣。","策略会增加高优势动作的概率，减少低优势动作的概率。","通过梯度上升更新策略，使策略更倾向于高优势动作。"],"nodes":[{"title":"优势函数计算","text":"计算每个动作的优势值，衡量其相对于策略的优劣"},{"title":"策略更新方向","text":"根据优势函数调整策略，增加高优势动作的概率"},{"title":"梯度上升优化","text":"通过梯度上升更新策略，使策略更倾向于高优势动作"},{"title":"策略稳定性","text":"需注意优势函数可能基于旧策略，导致策略更新不稳定"}],"id":"v032-005-2","start":769.1,"end":854.01,"formulas":[{"latex":"\\nabla_{\\theta'} \\pi_{\\theta'} = \\pi_{\\theta'} \\nabla_{\\theta'} \\log \\pi_{\\theta'}","symbols":"策略梯度等于策略乘以对数策略的梯度","evidence":"And the gradient of theta prime of pi is equal to pi theta prime times grad log pi theta prime. So you can see this on the slides. So here's our surrogate objective right here. Now, if we look at the surrogate objective, so the policy is going to be trying to maximize this when we take gradient steps on our policy. And if we look at this, if we're trying to maximize this objective,","explanation":"公式正确，符合策略梯度定理，即策略的梯度等于策略本身乘以对数策略的梯度。"}],"formula_candidates_removed":0,"frame":"../board-frames/v032/005-2.webp","frame_time":748.68}],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":674.14,"text":"And so this means that this is equal to the gradient of pi theta prime. And if we want to then construct a surrogate objective such that its gradient is this, then the surrogate objective is simply going to be, we can replace this with pi theta of A given S. And then we'll still have the other terms pi theta."},{"start":705.88,"text":"and the advantage right here. Let's just say this is just over i, all the examples in our batch. And so the way that I formulated this is the surrogate objective is the gradient of this surrogate objective is equal to this right here. And we see that if we take the gradient of this with respect to theta prime, we get grad theta prime right here."},{"start":736.18,"text":"And the gradient of theta prime of pi is equal to pi theta prime times grad log pi theta prime. So you can see this on the slides. So here's our surrogate objective right here. Now, if we look at the surrogate objective, so the policy is going to be trying to maximize this when we take gradient steps on our policy. And if we look at this, if we're trying to maximize this objective,"},{"start":769.1,"text":"We have our advantage estimates, and so the thing that the policy will want to do is it will probably want to take the advantage estimates that are positive and increase the probability of our actions for those. Especially if there are actions that had very low probability, then we want to increase this a lot so that we can get a very high ratio here, such that we kind of increase the likelihood of actions for high advantages, and then for negative advantages, we'll want to decrease the probability."},{"start":798.03,"text":"Now, this all seems reasonable here."},{"start":800.47,"text":"The thing that's a little bit tricky is that these advantages are still based off of the old policy."},{"start":805.69,"text":"And they were estimated based on kind of a single batch of data."},{"start":811.27,"text":"And so if you take too many gradient steps on the surrogate objective,"},{"start":815.53,"text":"it means that you might actually kind of in some ways overfit."},{"start":820.29,"text":"You might be using these advantages at some point when they become out of date"},{"start":824.73,"text":"no longer be applicable to your new policy. And so basically the"},{"start":830.85,"text":"challenge that can come up is you might get really unstable learning. As a rough"},{"start":838.73,"text":"visual for what this might look like is if you were to plot the... let's say this"},{"start":846.83,"text":"This is the number of examples of state actions"}],"speech_gaps":[],"frame":"../frames/v032/005.webp","frame_time":686.14},{"title":"过拟合策略的行为表现","segments":[{"id":38,"text":"that you've collected.","zh":"你所收集的数据。","start":854.01,"end":855.03},{"id":39,"text":"And then the y-axis is the rewards","zh":"然后 y 轴是你的策略在学习过程中所看到的奖励","start":856.33,"end":860.79},{"id":40,"text":"that your policy is seeing over the course of learning","zh":"随着你收集更多数据而变化。","start":860.79,"end":864.41},{"id":41,"text":"as it collects more data.","zh":"如果你对每一批数据只进行一次梯度更新","start":864.41,"end":865.69},{"id":42,"text":"If you take only one gradient step for every batch of data","zh":"那么你的学习过程可能看起来像这样，其中学习速度非常缓慢","start":867.43,"end":871.87},{"id":43,"text":"that you collect, then your learning might look something like this, where it learns very slowly","zh":"因为你只能对每一批数据进行一次梯度更新，这意味着你需要大量的数据点才能学习。因此这是对于一次梯度更新的情况。","start":871.87,"end":881.77},{"id":44,"text":"because you can only take one gradient step for each batch of data and that means that it's going","zh":"因为你只能对每个数据批次进行一次梯度更新，这意味着你需要大量的数据点才能学习。因此，这是针对一次梯度更新的情况。","start":881.77,"end":886.77},{"id":45,"text":"to take many many data points in order to learn. So this is for one gradient step.","zh":"为了学习，需要采取大量的数据点。因此，这是针对一次梯度步长的情况。","start":886.77,"end":893.17},{"id":46,"text":"up. Now, say you maybe increase this a little bit, so you take like five gradient steps,","zh":"现在，假设你可能稍微增加一点，所以你像这样进行五次梯度步骤，","start":893.17,"end":902.85},{"id":47,"text":"then you should learn a little bit faster. So maybe you'll learn","zh":"那么你应该会稍微学得更快一些。所以你可能会学到","start":904.43,"end":907.37},{"id":48,"text":"something like this, because you're taking more gradient steps.","zh":"类似这样的东西，因为你进行了更多的梯度步骤。","start":907.37,"end":911.69},{"id":49,"text":"If you try to get a little bit greedy and do a lot more gradient steps on this objective, you might start to overfit your advantages and you'll get something where maybe you'll actually start to increase reward very quickly, but then learning might be unstable and at some point it might even collapse.","zh":"如果你尝试变得有点贪婪，并在这个目标上进行很多更多的梯度步骤，你可能会开始过拟合你的优势值，并且你会得到一些情况，其中你实际上可能会非常快速地增加奖励，但随后学习可能会变得不稳定，并且在某个时候甚至可能崩溃。","start":912.3,"end":937.38},{"id":50,"text":"Because your policy will overfit those advantages. You'll get some kind of really bad policy or a policy that has increased the probability to one for some advantage, but done so in a way that makes the policy performance poor. And so this would be like, I don't know exactly how many gradient steps this would be, but this would be kind of more gradient steps than the others. This would be too many gradient steps, essentially.","zh":"因为你的策略会过拟合这些优势值。你可能会得到某种非常糟糕的策略，或者一个策略，它对某些优势值的概率增加到1，但这样做方式使得策略表现很差。因此，这可能类似于，我不知道确切需要多少次梯度步骤，但这会是比其他情况更多的梯度步骤。这基本上就是太多梯度步骤。","start":938.32,"end":963.44},{"id":51,"text":"And so this would be like, I don't know exactly how many gradient steps this would be, but this would be kind of more gradient steps than the others. This would be too many gradient steps, essentially.","zh":"因此，这可能类似于，我不知道确切需要多少次梯度步骤，但这会是比其他情况更多的梯度步骤。这基本上就是太多梯度步骤。","start":964.17,"end":987.41},{"id":52,"text":"So the question is, what does the behavior of an overfit policy look like in practice? It really depends on the problem. As one example, if it's overfitting quite a bit, it might try to be assigning a very, very high probability to one particular action that has a high advantage in the data.","zh":"因此，问题是，过拟合策略在实践中表现会是什么样子？这真的取决于问题。举一个例子，如果它过拟合得相当严重，它可能会尝试将一个特定动作的概率分配得非常高，而该动作在数据中具有较高的优势值。","start":987.85,"end":1014.84}],"notes":["本段讨论了在强化学习中，当策略过度拟合优势函数时可能表现出的行为。讲者指出，当进行过多梯度步数时，策略可能会快速提升奖励，但随后学习过程变得不稳定，甚至崩溃。","讲者进一步解释了过拟合策略的表现，即策略可能将某些动作的概率提升至1，从而导致策略性能变差。这种现象通常发生在策略对训练数据中的优势函数过度拟合的情况下。","讲者提到，过拟合策略的行为取决于具体问题。例如，策略可能会将极高概率分配给某个具有高优势的动作，同时由于神经网络的平滑性，邻近动作的概率也会增加。","这种行为可能导致策略变得过于确定性，不再进行探索，从而影响整体性能。讲者指出，这种现象在实践中难以准确预测，但可以通过观察策略的行为来识别。","讲者强调，过拟合策略的表现可能因问题而异，因此需要在实际应用中仔细监控和调整训练过程。","最后，讲者提到，过拟合策略可能导致学习过程不稳定，甚至崩溃，因此在设计强化学习算法时需要平衡梯度步数和探索策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":854.01,"end":1014.84,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":854.01,"text":"that you've collected."},{"start":856.33,"text":"And then the y-axis is the rewards"},{"start":860.79,"text":"that your policy is seeing over the course of learning"},{"start":864.41,"text":"as it collects more data."},{"start":867.43,"text":"If you take only one gradient step for every batch of data"},{"start":871.87,"text":"that you collect, then your learning might look something like this, where it learns very slowly"},{"start":881.77,"text":"because you can only take one gradient step for each batch of data and that means that it's going"},{"start":886.77,"text":"to take many many data points in order to learn. So this is for one gradient step."},{"start":893.17,"text":"up. Now, say you maybe increase this a little bit, so you take like five gradient steps,"},{"start":904.43,"text":"then you should learn a little bit faster. So maybe you'll learn"},{"start":907.37,"text":"something like this, because you're taking more gradient steps."},{"start":912.3,"text":"per data point. So with respect to the amount of data that you're collecting, your reward should increase more. But then if you try to get a little bit greedy and do a lot more gradient steps on this objective, you might start to overfit your advantages and you'll get something where maybe you'll actually start to increase reward very quickly, but then learning might be unstable and at some point it might even collapse."},{"start":938.32,"text":"Because your policy will overfit those advantages. You'll get some kind of really bad policy or a policy that has increased the probability to one for some advantage, but done so in a way that makes the policy performance poor. And so this would be like, I don't know exactly how many gradient steps this would be, but this would be kind of more gradient steps than the others. This would be too many gradient steps, essentially."},{"start":964.17,"text":"So the question is, what does the behavior of an overfit policy look like in practice? It really depends on the problem. As one example, if it's overfitting quite a bit, it might try to be assigning a very, very high probability to one particular action that has a high advantage in the data."},{"start":987.85,"text":"And when it does that, it might actually also increase the probability of other actions around it, just because neural networks are somewhat smooth. And when you do that, it might be a very deterministic policy that no longer explores. And also, it might kind of like... Well, maybe it's like a... It's a little bit hard to... I don't know exactly what would happen, but the..."}],"speech_gaps":[],"frame":"../frames/v032/006.webp","frame_time":866.01},{"title":"过拟合策略与重要性权重的作用","segments":[{"id":53,"text":"if you had a 2D agent that's moving around in a grid, and maybe your goal is to get here, then a good policy would go here. And a policy that's overfit, I would expect to potentially... Maybe, for example, it learns that going right is good, but doesn't figure out that you need to stop here.","zh":"如果你有一个在网格中移动的二维智能体，也许你的目标是到达这里，那么一个好的策略会到达这里。而一个过拟合的策略，我预计可能会……例如，它可能学会了向右移动是好的，但没有意识到你需要在这里停下来。","start":1015.5,"end":1035.72},{"id":54,"text":"and doesn't figure out that you need to go up, then what the overfit policy might do is it might take a straight line here and then keep on trying to go roughly in this direction and then end up in the corner because it's kind of overfit to one batch of data that told it to go this way but didn't figure out that it needs to stop.","zh":"并且没有意识到你需要向上移动，那么过拟合的策略可能会采取一条直线路径，然后继续大致朝这个方向移动，最终到达角落，因为它过度拟合了一组数据，这些数据告诉它要朝这个方向移动，但没有意识到它需要停下来。","start":1036.3,"end":1054.38},{"id":55,"text":"Yeah, exactly. So this is five gradient steps on kind of five loops of this before you then collect a new batch of data and then refit your value function. Currently, it's refit only on the current batch of data. Later this lecture, we'll see how we can potentially reuse previous batches. So the question is, what is the importance of using the surrogate objective versus the original formulation? This is the same formulation.","zh":"是的，完全正确。所以这是五次梯度步骤，在这五次循环之后，你再收集一个新的数据批次，然后重新拟合你的价值函数。目前，它只基于当前的数据批次进行重新拟合。在本节课的后面，我们将看到如何潜在地重用之前的批次。问题是，使用替代目标函数与原始公式相比，重要性权重的作用是什么？这是相同的公式。","start":1055.28,"end":1084.85},{"id":56,"text":"I found it helpful. I think it's a little bit more intuitive if you look at the surrogate objective to understand that it's like these importance weights are really trying to like make it like it's very easy to increase the probability. You can also see that with the gradient as well where it's going to be like trying to increase the probability. But I think it's just a little bit easier to see with the surrogate objective. We'll also in a minute see how we can change the surrogate objective and it gets a little bit more complicated.","zh":"我觉得这很有帮助。我认为如果你看一下替代目标函数，会更直观地理解重要性权重实际上是在尝试让策略更容易增加概率。你也可以通过梯度看到这一点，即它试图增加概率。但我觉得通过替代目标函数更容易看到这一点。稍后我们还将看到如何改变替代目标函数，这会变得更复杂一些。","start":1086.96,"end":1109.7},{"id":57,"text":"PPO looks a little bit more complicated if you look at the gradient versus if you look at the surrogate objective. So the question is, why are we using the importance weights to evaluate the gradient? So this importance weight term is what is allowing us to do more than one gradient step in the first place. It's what's allowing this blue curve to do better in some ways. If you don't have the importance weights, then it's essentially...","zh":"如果你比较梯度和替代目标函数，PPO看起来会更复杂一些。问题是，为什么我们要使用重要性权重来评估梯度？这个重要性权重项正是让我们能够进行不止一次梯度步骤的原因。它也是让蓝色曲线在某些方面表现更好的原因。如果没有重要性权重，那么它基本上就是……","start":1110.76,"end":1136.38},{"id":58,"text":"It's not allowing you to actually accurately estimate the gradient on the old batch of data. So what happens when the A network is too old? The advantage estimates are going to be based off of some batch of data. It's not infinite. It's going to be a batch of data that might be, I don't know, around a few thousand time steps of data.","zh":"它不允许你准确地对旧批次数据进行梯度估计。那么当A网络过于老旧时会发生什么？优势估计将基于某个数据批次。它并不是无限的，它可能基于几千个时间步的数据。","start":1141.34,"end":1167.16},{"id":59,"text":"And those advantage estimates will be, they're also kind of under the old policy before we took any gradient steps. And so if you take a lot of gradient steps on this objective, those advantages are not like, they're only true for the old policy. And they're also only based off of...","zh":"这些优势估计也处于我们进行任何梯度更新之前的旧策略下。因此，如果你在这个目标上进行大量梯度更新，这些优势估计只适用于旧策略，并且仅基于……","start":1167.63,"end":1183.07}],"notes":["本段讨论了过拟合策略在强化学习中的表现，以二维网格中的智能体为例，说明了过拟合策略可能只关注单一方向而忽略其他必要动作。这表明策略在训练数据上表现良好，但在新环境中可能无法有效适应。","讲者进一步解释了过拟合策略的后果，即智能体可能沿着错误的方向持续行动，最终导致性能下降。这强调了在强化学习中，策略需要在训练数据和新环境之间找到平衡。","随后，讲者引入了代理目标（surrogate objective）与原始公式（original formulation）的概念，指出代理目标在理解重要性权重（importance weights）的作用上更具直观性。","讲者提到代理目标能够更清晰地展示重要性权重如何帮助提升策略的概率，同时指出梯度方法在理解这一概念上可能不如代理目标直观。","讲者进一步探讨了PPO（Proximal Policy Optimization）算法中重要性权重的作用，指出其允许在多个梯度步骤中进行优化，从而提升策略性能。","最后，讲者指出，当优势估计（advantage estimates）基于旧策略时，如果进行过多梯度步骤，这些估计将不再准确，这强调了在强化学习中更新策略和数据的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1015.5,"end":1183.07,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1015.5,"text":"if you had a 2D agent that's moving around in a grid, and maybe your goal is to get here, then a good policy would go here. And a policy that's overfit, I would expect to potentially... Maybe, for example, it learns that going right is good, but doesn't figure out that you need to stop here."},{"start":1036.3,"text":"and doesn't figure out that you need to go up, then what the overfit policy might do is it might take a straight line here and then keep on trying to go roughly in this direction and then end up in the corner because it's kind of overfit to one batch of data that told it to go this way but didn't figure out that it needs to stop."},{"start":1055.28,"text":"Yeah, exactly. So this is five gradient steps on kind of five loops of this before you then collect a new batch of data and then refit your value function. Currently, it's refit only on the current batch of data. Later this lecture, we'll see how we can potentially reuse previous batches. So the question is, what is the importance of using the surrogate objective versus the original formulation? This is the same formulation."},{"start":1086.96,"text":"I found it helpful. I think it's a little bit more intuitive if you look at the surrogate objective to understand that it's like these importance weights are really trying to like make it like it's very easy to increase the probability. You can also see that with the gradient as well where it's going to be like trying to increase the probability. But I think it's just a little bit easier to see with the surrogate objective. We'll also in a minute see how we can change the surrogate objective and it gets a little bit more complicated."},{"start":1110.76,"text":"PPO looks a little bit more complicated if you look at the gradient versus if you look at the surrogate objective. So the question is, why are we using the importance weights to evaluate the gradient? So this importance weight term is what is allowing us to do more than one gradient step in the first place. It's what's allowing this blue curve to do better in some ways. If you don't have the importance weights, then it's essentially..."},{"start":1141.34,"text":"It's not allowing you to actually accurately estimate the gradient on the old batch of data. So what happens when the A network is too old? The advantage estimates are going to be based off of some batch of data. It's not infinite. It's going to be a batch of data that might be, I don't know, around a few thousand time steps of data."},{"start":1167.63,"text":"And those advantage estimates will be, they're also kind of under the old policy before we took any gradient steps. And so if you take a lot of gradient steps on this objective, those advantages are not like, they're only true for the old policy. And they're also only based off of..."}],"speech_gaps":[],"frame":"../frames/v032/007.webp","frame_time":1027.5},{"title":"策略更新与优势估计的不一致性","segments":[{"id":60,"text":"a limited batch of data. And primarily because they were based off of the old policy, after you've taken 50 gradient steps or 100 gradient steps, they become out of date. For example, maybe your old policy... In this example, it's possible that your old policy right here, maybe it did actually decide to go up, for example. So then you learn that if you're over here, you should go this way because later you will go up.","zh":"一个有限的数据批次。主要原因是它们基于旧策略，当你进行了50次或100次梯度更新后，它们就会过时。例如，也许你的旧策略……在这个例子中，有可能你的旧策略在这里确实决定向上走，例如。因此你学习到，如果你在这里，你应该朝这个方向走，因为之后你会向上走。","start":1184.23,"end":1213.49},{"id":61,"text":"because that's what your advantages are telling you. But then in practice, once you have your new policy, in the future, you'll be doing something different. And so those advantages over here are no longer accurate, no longer valid. And you need to collect a new batch of data under your new policy in order to have accurate advantages. Okay, so the policy is going to increase probability on actions with high advantages. These advantages are based on the old policy, and so they'll get out of date.","zh":"因为这就是你的优势值在告诉你的。但在实践中，一旦你有了新的策略，将来你将会做不同的事情。因此，这些优势值在这里不再准确，不再有效。你需要在新的策略下收集新的数据批次，以获得准确的优势值。好的，所以策略会增加具有高优势值动作的概率。这些优势值是基于旧策略的，因此它们会过时。","start":1215.29,"end":1245.25},{"id":62,"text":"And so if you take a lot of gradient steps, the policy is really... I guess the other thing that I didn't mention is that when it's increasing the probability, it's also inherently trying to differ significantly from the old policy. It's not only encouraged to increase probability on advantages, but that is going to cause it to change drastically from the old policy. And this means that because you're also changing a lot, these advantages are even less likely to be up to date with your current policy.","zh":"因此，如果你进行大量的梯度更新，策略会变得……我想我没有提到的另一点是，当它增加概率时，它也在本质上试图与旧策略有显著的不同。它不仅被鼓励增加优势值动作的概率，这会导致它与旧策略发生剧烈变化。这意味着因为你也在发生很大的变化，这些优势值更不可能与你当前的策略保持同步。","start":1245.66,"end":1273.95},{"id":63,"text":"And so there's a question of like, how do we address this?","zh":"因此，我们如何解决这个问题就成为一个问题。","start":1276.52,"end":1280.6},{"id":64,"text":"And there's actually a couple of things that we can do in order to actually be able to stably take more gradient steps.","zh":"实际上，我们可以做几件事情，以便能够稳定地进行更多的梯度更新。","start":1280.8,"end":1286.72},{"id":65,"text":"And the key idea is if we keep the new policy to be a little bit more close to the original policy, then those advantage estimates are more likely to be valid.","zh":"关键的想法是，如果我们让新策略与原始策略保持得更接近，那么这些优势值的估计就更有可能是有效的。","start":1287.84,"end":1296.8},{"id":66,"text":"And there's two ways in which we might be able to encourage the new policy to be similar to the old one.","zh":"我们可能有几种方法可以鼓励新策略与旧策略相似。","start":1298.64,"end":1307.5},{"id":67,"text":"One would be to add a term to our surrogate objective that explicitly is going to try to encourage the policies to be similar.","zh":"一种方法是在我们的替代目标函数中添加一个项，明确地试图鼓励策略之间的相似性。","start":1307.78,"end":1314.64},{"id":68,"text":"And these policies are representing distributions over actions.","zh":"这些策略代表了对动作的分布。","start":1315.46,"end":1318.34},{"id":69,"text":"And so one way that we could do that is to add a term to our objective.","zh":"因此，我们可以通过在目标函数中添加一项来实现这一点。","start":1318.5,"end":1323.0},{"id":70,"text":"So we'll have, like, we have j, we have our surrogate objective right here.","zh":"因此，我们有 j，我们在这里有我们的替代目标函数。","start":1323.0,"end":1331.74},{"id":71,"text":"If we have it be equal to the same thing as what's written up there, maybe I'll call this, like, some, let's call this, I don't know, c-o-n for constrained.","zh":"如果我们让它等于上面所写的相同内容，也许我会称这个为某种约束，比如 c-o-n。","start":1332.64,"end":1350.5},{"id":72,"text":"this is going to be equal to the original surrogate objective that we're trying to","zh":"这将等于我们正在尝试","start":1350.5,"end":1357.1},{"id":73,"text":"maximize and then we can add a penalty that discourages you from changing too","zh":"最大化原始替代目标函数，然后我们可以添加一个惩罚项，以阻止你做出太大的改变","start":1357.1,"end":1363.18}],"notes":["本段讨论了策略更新过程中优势估计的不一致性问题。当策略经过多次梯度更新后，基于旧策略的优势估计会变得过时，因为新策略的行为与旧策略不同，导致优势估计不再准确。因此，需要在新策略下重新收集数据以获得准确的优势估计。","为了稳定地进行更多梯度更新，关键思想是保持新策略与旧策略的相似性。这样，基于旧策略的优势估计更有可能与当前策略保持一致。","实现这一目标的两种方法之一是在代理目标中添加一个项，以显式鼓励策略之间的相似性。由于策略代表了动作的分布，可以通过在目标函数中添加惩罚项来实现这一点。","添加的惩罚项会阻止策略发生剧烈变化，从而减少优势估计与当前策略之间的不一致性。这种方法有助于在策略更新过程中保持优势估计的有效性。","在实际操作中，需要权衡策略更新的幅度与优势估计的准确性。如果更新幅度过大，优势估计可能变得完全无效，从而影响学习效果。","因此，设计一个既能有效更新策略，又能保持优势估计准确性的目标函数是强化学习算法设计中的关键挑战。"],"formulas":[],"uncertainties":["maximize and then we can add a penalty that discourages you from changing too"],"diagram":"none","start":1184.23,"end":1363.18,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":1184.23,"text":"a limited batch of data. And primarily because they were based off of the old policy, after you've taken 50 gradient steps or 100 gradient steps, they become out of date. For example, maybe your old policy... In this example, it's possible that your old policy right here, maybe it did actually decide to go up, for example. So then you learn that if you're over here, you should go this way because later you will go up."},{"start":1215.29,"text":"because that's what your advantages are telling you. But then in practice, once you have your new policy, in the future, you'll be doing something different. And so those advantages over here are no longer accurate, no longer valid. And you need to collect a new batch of data under your new policy in order to have accurate advantages. Okay, so the policy is going to increase probability on actions with high advantages. These advantages are based on the old policy, and so they'll get out of date."},{"start":1245.66,"text":"And so if you take a lot of gradient steps, the policy is really... I guess the other thing that I didn't mention is that when it's increasing the probability, it's also inherently trying to differ significantly from the old policy. It's not only encouraged to increase probability on advantages, but that is going to cause it to change drastically from the old policy. And this means that because you're also changing a lot, these advantages are even less likely to be up to date with your current policy."},{"start":1276.52,"text":"And so there's a question of like, how do we address this?"},{"start":1280.8,"text":"And there's actually a couple of things that we can do in order to actually be able to stably take more gradient steps."},{"start":1287.84,"text":"And the key idea is if we keep the new policy to be a little bit more close to the original policy, then those advantage estimates are more likely to be valid."},{"start":1298.64,"text":"And there's two ways in which we might be able to encourage the new policy to be similar to the old one."},{"start":1307.78,"text":"One would be to add a term to our surrogate objective that explicitly is going to try to encourage the policies to be similar."},{"start":1315.46,"text":"And these policies are representing distributions over actions."},{"start":1318.5,"text":"And so one way that we could do that is to add a term to our objective."},{"start":1323.0,"text":"So we'll have, like, we have j, we have our surrogate objective right here."},{"start":1332.64,"text":"If we have it be equal to the same thing as what's written up there, maybe I'll call this, like, some, let's call this, I don't know, c-o-n for constrained."},{"start":1350.5,"text":"this is going to be equal to the original surrogate objective that we're trying to"},{"start":1357.1,"text":"maximize and then we can add a penalty that discourages you from changing too"}],"speech_gaps":[],"frame":"../frames/v032/008.webp","frame_time":1196.23},{"title":"策略更新中的KL散度惩罚","segments":[{"id":74,"text":"much from the previous policy. And that penalty could take the form","zh":"与之前的策略相差很多。这种惩罚可以表现为","start":1363.18,"end":1367.32},{"id":75,"text":"the KL divergence between two distributions. So this could be the KL divergence between the new policy distribution and the old policy distribution. And so if we add this to our surrogate objective, what this will do is it will encourage the policies to stay close to one another while you take more gradient steps, and so your advantage functions will be more accurate.","zh":"两个分布之间的KL散度。因此，这可以是新策略分布与旧策略分布之间的KL散度。如果我们把这个加到我们的替代目标函数中，这样做会鼓励策略在进行更多梯度步时保持接近，从而使优势函数更加准确。","start":1370.22,"end":1399.32},{"id":76,"text":"And this will allow you to more stably take more gradient steps. Now, it will still be constraining your step size, and so it's a little bit of a balance. But essentially, the result of something like this in principle should look, I'm out of colors, maybe should look kind of something like this if you do more gradient steps, but with this KL penalty.","zh":"这将允许你更稳定地进行更多梯度步。不过，它仍然会限制你的步长，因此这是一个平衡的问题。但本质上，这种做法的结果在原则上应该看起来，我用完了颜色，也许应该看起来像这样，如果你进行更多梯度步，但带有这种KL惩罚。","start":1399.9,"end":1428.23},{"id":77,"text":"So the comment was, it's incentivizing because of this ratio right here. And it can make this, it's controlling the upper part. The lower part is fixed. This is the old policy. It's controlling this new one. And so it can make this very large or very small. And that will cause these weights to either go to zero or become, or potentially be infinite depending on how small the old policy probability was.","zh":"所以评论中提到，这是由于这里的比率所激励的。它可以控制上部分。下部分是固定的。这是旧策略。它在控制新的策略。因此，它可以使得这个值变得非常大或非常小。这将导致这些权重要么趋近于零，要么变得很大，或者潜在地趋于无穷大，这取决于旧策略概率有多小。","start":1429.29,"end":1458.05},{"id":78,"text":"And when we constrain how different these are, then we're encouraging this to be closer to one. So you can't just push this to infinity or you can't just push it to zero. Yeah, so a couple comments were here. So the first was that to do this KL constraint, we actually need to keep around our old parameters in memory.","zh":"当我们限制这些差异时，我们就在鼓励这个值更接近于一。因此，你不能随意把这个值推到无穷大，也不能随意把它推到零。是的，所以这里有几个评论。第一个评论是，为了实现这种KL约束，我们实际上需要保留旧参数在内存中。","start":1459.59,"end":1481.61},{"id":79,"text":"This can actually be kind of annoying to do. It increases your memory costs. This is actually not uncommon to do with large language models, and you'll have to keep around the full set of weights for your old language model in order to do this. That said, there are ways to potentially cache this. So you potentially could just keep around the probabilities that were assigned to different states for a given batch of data.","zh":"这实际上可能会有点烦人。它会增加你的内存成本。实际上，这在大型语言模型中并不罕见，你将不得不保留旧语言模型的全部权重集，以便进行这种操作。不过，也存在潜在的缓存方法。因此，你可能只需要保留分配给不同状态的概率，针对给定的一批数据。","start":1482.51,"end":1510.29},{"id":80,"text":"And then the second note was that for this surrogate objective, this ratio is initially going to be one. And then once you take one gradient step, that's where this starts to potentially diverge. The goal is to basically constrain how much you're changing the policy, and only to change the policy a little bit rather than a ton.","zh":"然后第二个注释是，对于这个替代目标函数，这个比率最初会是1。一旦你进行一次梯度更新，这就可能开始发散。目标基本上是限制你对策略的更改程度，只进行一点小的更改，而不是大量的更改。","start":1511.39,"end":1537.24}],"notes":["本段讨论了在策略更新中引入KL散度惩罚的作用，即通过在代理目标中加入KL散度项，鼓励新旧策略保持接近，从而提高优势函数的准确性。KL散度用于衡量两个分布之间的差异，这里具体是新旧策略分布之间的差异。","KL惩罚项的引入使得策略更新更加稳定，但同时也限制了更新的步长，因此需要在稳定性和更新幅度之间进行权衡。这种平衡是通过控制策略变化的幅度来实现的。","在策略更新过程中，如果旧策略的概率非常小，可能会导致权重变得非常大或非常小，甚至趋于无穷大或零。因此，需要对策略变化进行约束，以防止这种极端情况的发生。","为了实现KL约束，必须保留旧策略的参数，这会增加内存成本。在大型语言模型中，这种做法并不罕见，但可以通过缓存特定状态的概率来减少内存负担。","代理目标中的比率在初始时为1，但在进行梯度更新后可能会发散。因此，目标是限制策略的变化幅度，仅进行小幅度的更新，以避免策略的剧烈变化。","KL散度惩罚项的引入是强化学习中一种常见的策略更新方法，它通过控制策略变化的幅度，提高策略更新的稳定性和准确性。"],"formulas":[{"latex":"D_{\\text{KL}}(p_{\\text{new}} \\| p_{\\text{old}})","symbols":"KL散度用于衡量新旧策略分布之间的差异","explanation":"KL散度的符号和定义正确，但未明确说明其作为惩罚项的作用。","evidence":"the KL divergence between two distributions. So this could be the KL divergence between the new policy distribution and the old policy distribution. And so if we add this to our surrogate objective, what this will do is it will encourage the policies to stay close to one another while you take more gradient steps, and so your advantage functions will be more accurate."},{"latex":"D_{\\text{KL}}(p_{\\text{new}} \\| p_{\\text{old}}) = \\mathbb{E}_{p_{\\text{new}}} \\left[ \\log \\frac{p_{\\text{new}}}{p_{\\text{old}}} \\right]","symbols":"KL散度的数学定义","explanation":"公式正确，但未明确说明其在策略优化中的应用，如作为正则化项。","evidence":"the KL divergence between two distributions. So this could be the KL divergence between the new policy distribution and the old policy distribution. And so if we add this to our surrogate objective, what this will do is it will encourage the policies to stay close to one another while you take more gradient steps, and so your advantage functions will be more accurate."}],"uncertainties":["可能无法准确判断KL散度项在代理目标中的具体形式"],"diagram":"none","start":1363.18,"end":1537.24,"asr_flags":[],"math_clarifications":["KL散度的符号应使用双竖线（\\|）而非单竖线（||），以符合标准数学符号规范。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1363.18,"text":"much from the previous policy. And that penalty could take the form"},{"start":1370.22,"text":"the KL divergence between two distributions. So this could be the KL divergence between the new policy distribution and the old policy distribution. And so if we add this to our surrogate objective, what this will do is it will encourage the policies to stay close to one another while you take more gradient steps, and so your advantage functions will be more accurate."},{"start":1399.9,"text":"And this will allow you to more stably take more gradient steps. Now, it will still be constraining your step size, and so it's a little bit of a balance. But essentially, the result of something like this in principle should look, I'm out of colors, maybe should look kind of something like this if you do more gradient steps, but with this KL penalty."},{"start":1429.29,"text":"So the comment was, it's incentivizing because of this ratio right here. And it can make this, it's controlling the upper part. The lower part is fixed. This is the old policy. It's controlling this new one. And so it can make this very large or very small. And that will cause these weights to either go to zero or become, or potentially be infinite depending on how small the old policy probability was."},{"start":1459.59,"text":"And when we constrain how different these are, then we're encouraging this to be closer to one. So you can't just push this to infinity or you can't just push it to zero. Yeah, so a couple comments were here. So the first was that to do this KL constraint, we actually need to keep around our old parameters in memory."},{"start":1482.51,"text":"This can actually be kind of annoying to do. It increases your memory costs. This is actually not uncommon to do with large language models, and you'll have to keep around the full set of weights for your old language model in order to do this. That said, there are ways to potentially cache this. So you potentially could just keep around the probabilities that were assigned to different states for a given batch of data."},{"start":1511.39,"text":"And then the second note was that for this surrogate objective, this ratio is initially going to be one. And then once you take one gradient step, that's where this starts to potentially diverge. The goal is to basically constrain how much you're changing the policy, and only to change the policy a little bit rather than a ton."}],"speech_gaps":[],"frame":"../frames/v032/009.webp","frame_time":1375.18},{"title":"策略微调与KL散度约束","segments":[{"id":81,"text":"One other way to think about this is if your policy is a neural network that's taking as input images, for example, you're going to need a lot of gradient steps in order to change the features of those images. And so you want to be able to take a lot of gradient steps, but without substantially changing the action distribution that the policy is going to take so that you can still refine your features without causing the policy to overfit too much.","zh":"另一种思考方式是，如果你的策略是一个神经网络，输入是图像，例如，你将需要大量的梯度步骤来改变这些图像的特征。因此，你希望能够进行大量的梯度步骤，但又不至于显著改变策略所采取的动作分布，这样你仍然可以优化特征，而不会导致策略过度拟合。","start":1538.2,"end":1564.96},{"id":82,"text":"Yeah, so the question was, how do we encourage it to change a little bit but not too much? Oftentimes, you'll have some hyperparameter that is in front of this KL divergence that needs to be tuned.","zh":"是的，问题是，我们如何鼓励它进行一定程度的改变，但又不至于太多？通常，你会有一个在KL散度前面的超参数，需要进行调优。","start":1565.8,"end":1579.83},{"id":83,"text":"And so this beta is like a hyperparameter, and this will control how much you're allowing it to shift. This ends up being oftentimes a fairly important hyperparameter when you use KL constraints. At the same time, you don't need to tune it. Usually people tune it within an order of magnitude rather than very carefully finding 0.423 whatever.","zh":"因此，这个beta就像一个超参数，它将控制你允许其改变的程度。这通常是在使用KL约束时一个相当重要的超参数。同时，你并不需要仔细调优它。通常人们会在一个数量级的范围内进行调优，而不是非常仔细地找到像0.423这样的具体数值。","start":1581.54,"end":1607.2},{"id":84,"text":"Yeah, so the question was, how does this look like for the kind of original gradient and not quite understanding the surrogate? So the surrogate objective is kind of what we're plugging into PyTorch in order. And then PyTorch or TensorFlow or JAX will then compute the gradients for us. And when they compute the gradients for us, they will get the first line. And so the gradient of the second line is equal to the first line.","zh":"是的，问题是，这种情形下原始梯度和尚未完全理解的替代目标之间是什么样子的？替代目标基本上就是我们输入到PyTorch中的内容。然后PyTorch或TensorFlow或JAX会为我们计算梯度。当它们为我们计算梯度时，它们会得到第一行。因此，第二行的梯度等于第一行。","start":1608.17,"end":1637.43},{"id":85,"text":"And then for this, if you were to implement this, you have your original surrogate objective, and then you just plug in this term as well. You can look up the expression for KL divergence between two categorical distributions or two Gaussians, which in the Gaussian case will be a function of the means and variances. And then just add that to your surrogate objective and then have PyTorch give you the gradients. You could also, if you write down the equation for a particular distribution. You could also get the gradients yourself if you want to take a look at that.","zh":"然后，如果你要实现这一点，你有你的原始替代目标，然后你只需将这一项也代入进去。你可以查阅两个分类分布或两个高斯分布之间的KL散度表达式，在高斯情况下，它将是一个均值和方差的函数。然后只需将它加到你的替代目标中，让PyTorch为你计算梯度。你也可以，如果你写下特定分布的方程，你也可以自己计算梯度，如果你想看看的话。","start":1639.63,"end":1665.81},{"id":86,"text":"What's the difference between j theta and j tilde theta? I'm using j tilde to refer to the surrogate objective because it's technically not the true objective. The original j theta objective was equal to the expected sum of rewards. So it was the sum of rewards here. So this is an estimation of that.","zh":"什么是j theta和j tilde theta之间的区别？我用j tilde来指代替代目标，因为它在技术上并不是真实的目标。原始的j theta目标等于奖励的期望总和。因此，这里指的是奖励的总和。所以这是一个对该总和的估计。","start":1666.37,"end":1696.13}],"notes":["本段讨论了在策略梯度方法中如何通过KL散度约束来控制策略的微调程度。讲者指出，当策略是一个神经网络时，需要大量梯度步骤来调整输入特征，但又不希望显著改变动作分布，以避免策略过拟合。因此，引入了一个超参数β来控制KL散度的权重，从而平衡策略的更新幅度。","讲者提到，β是一个需要调整的超参数，通常在数量级范围内进行调整，而不是精确地找到某个特定值。这表明在实际应用中，KL散度约束的超参数调整是一个相对粗略的过程。","讲者进一步解释了代理目标（surrogate objective）的概念，即在PyTorch、TensorFlow或JAX等框架中使用的替代目标函数。通过将KL散度项加入代理目标，可以利用自动微分工具计算梯度，从而实现策略的优化。","讲者还提到，KL散度的计算可以针对不同的分布类型（如分类分布或高斯分布）进行，其中高斯分布的KL散度依赖于均值和方差。这表明在实现时需要根据具体分布类型选择相应的公式。","最后，讲者区分了原始目标函数jθ和代理目标函数j̃θ，指出后者是代理目标，不是真实目标。原始目标函数是期望奖励的总和，而代理目标函数是对该期望的估计。","讲者强调了在策略优化中，KL散度约束的作用是控制策略更新的幅度，从而在探索和利用之间取得平衡。这在实际应用中是一个重要的设计选择。"],"formulas":[{"latex":"KL(q||p) = \\text{E}_{q}\\left[\\text{log}\\left(\\frac{q(x)}{p(x)}\\right)\\right]","symbols":"KL散度是两个分布之间的差异度量，计算为q分布相对于p分布的期望对数比值","explanation":"公式正确，KL散度的定义符合数学规范","evidence":"And then for this, if you were to implement this, you have your original surrogate objective, and then you just plug in this term as well. You can look up the expression for KL divergence between two categorical distributions or two Gaussians, which in the Gaussian case will be a function of the means and variances. And then just add that to your surrogate objective and then have PyTorch give you the gradients. You could also, if you write down the equation for a particular..."}],"uncertainties":["j tilde theta","the first line","the second line"],"diagram":"none","start":1538.2,"end":1696.13,"asr_flags":[],"math_clarifications":["公式中的KL散度定义正确，无需修改。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1538.2,"text":"One other way to think about this is if your policy is a neural network that's taking as input images, for example, you're going to need a lot of gradient steps in order to change the features of those images. And so you want to be able to take a lot of gradient steps, but without substantially changing the action distribution that the policy is going to take so that you can still refine your features without causing the subjective to overfit too much."},{"start":1565.8,"text":"Yeah, so the question was, how do we encourage it to change a little bit but not too much? Oftentimes, you'll have some hyperparameter that is in front of this KL divergence that needs to be tuned."},{"start":1581.54,"text":"And so this beta is like a hyperparameter, and this will control how much you're allowing it to shift. This ends up being oftentimes a fairly important hyperparameter when you use KL constraints. At the same time, you don't need to tune it. Usually people tune it within an order of magnitude rather than very carefully finding 0.423 whatever."},{"start":1608.17,"text":"Yeah, so the question was, how does this look like for the kind of original gradient and not quite understanding the surrogate? So the surrogate objective is kind of what we're plugging into PyTorch in order. And then PyTorch or TensorFlow or JAX will then compute the gradients for us. And when they compute the gradients for us, they will get the first line. And so the gradient of the second line is equal to the first line."},{"start":1639.63,"text":"And then for this, if you were to implement this, you have your original surrogate objective, and then you just plug in this term as well. You can look up the expression for KL divergence between two categorical distributions or two Gaussians, which in the Gaussian case will be a function of the means and variances. And then just add that to your surrogate objective and then have PyTorch give you the gradients. You could also, if you write down the equation for a particular..."},{"start":1666.37,"text":"distribution. You could also get the gradients yourself if you want to take a look at that. What's the difference between j theta and j tilde theta? I'm using j tilde to refer to the Sorgeant objective because it's technically not the true objective. The original j theta objective was equal to the expected sum of rewards. So it was the sum of rewards here. So this is an estimation of that."}],"speech_gaps":[],"frame":"../frames/v032/010.webp","frame_time":1550.2},{"title":"PPO算法中的约束与裁剪策略","segments":[{"id":87,"text":"Okay, so the first idea is use a KL constraint. This is actually very common to do. We will leave it at this for now. We actually won't use KL constraints. There is actually a version of PPO that uses KL constraints, but it's not the most common version. But it's also used a lot in preference optimization, so we'll probably see it again in a couple weeks. And then there's actually a second idea. So we could add this constraint in the objective.","zh":"好的，第一个想法是使用KL约束。实际上，这非常常见。我们暂时先留着这个想法。我们实际上不会使用KL约束。实际上，有一种PPO版本使用KL约束，但它不是最常见的版本。但这种约束也被大量用于偏好优化，因此我们可能在几周后再次看到它。然后还有一个第二个想法。因此，我们可以在目标函数中添加这个约束。","start":1698.21,"end":1725.18},{"id":88,"text":"The other thing that we could do is we could, for this ratio right here, we could simply remove the incentive for the policy to change this ratio a lot. And the way that we would do that is we could actually just clip this ratio so that the ratio never exceeds some value and never goes below some value. And so what that would look like is, this is like, I guess,","zh":"我们还可以做的一件事是，对于这里的这个比率，我们可以简单地去除策略大幅改变这个比率的激励。我们实现这一点的方法是，实际上只是将这个比率裁剪，使其永远不会超过某个值，也不会低于某个值。这看起来会像这样，我想，","start":1726.0,"end":1755.95},{"id":89,"text":"This is version 1. What version 2 would look like is we would be taking these importance weights and we would be clipping them. So we have the importance weights pi theta prime divided by pi theta. And we'd be clipping these to be between some lower value 1 minus epsilon and some higher value 1 plus epsilon. Epsilon could be something like 0.2.","zh":"这是版本1。版本2看起来会是这样的：我们将这些重要性权重进行裁剪。因此，我们有重要性权重πθ'除以πθ。我们将这些权重裁剪到某个下限值1−ε和某个上限值1+ε之间。ε可以是像0.2这样的值。","start":1756.36,"end":1786.97},{"id":90,"text":"So you're saying that if it goes below 0.8, then it'll just be 0.8, and if this goes above","zh":"你是在说，如果它低于0.8，那么它就会被设为0.8，如果这个值高于","start":1787.39,"end":1794.57},{"id":91,"text":"1.2, we're just going to leave it as 1.2. Now this clipping, this is a little bit informal.","zh":"1.2，我们就会将其设为1.2。这种裁剪方法，有点不正式。","start":1795.15,"end":1801.63},{"id":92,"text":"If I were to write this out mathematically, what this would look like, let's say that,","zh":"如果我要用数学方式写出这一点，它看起来会像这样，假设，","start":1802.21,"end":1807.63},{"id":93,"text":"let's call this w, this weight right here, then if we wanted to clip it below by 1 minus epsilon,","zh":"我们称这个权重为w，那么如果我们想要将它裁剪到低于1−ε，","start":1807.67,"end":1815.33},{"id":94,"text":"epsilon, then we would be taking the max between w and one minus epsilon. And if we wanted","zh":"ε，那么我们将取w和1−ε之间的最大值。如果我们想要","start":1815.33,"end":1824.27},{"id":95,"text":"to then clip this above by one plus epsilon, then we'd be taking the min between this and","zh":"然后我们再将这个值上限裁剪为1加上epsilon，那么我们就会在这两者之间取最小值","start":1824.27,"end":1831.25},{"id":96,"text":"one plus epsilon. And now, if we use this clipped importance weight in our objective","zh":"如果我们在这里使用这个裁剪后的重要性权重，那么一旦策略改变使得比率超过1.2，它就不再","start":1831.25,"end":1839.95},{"id":97,"text":"right here then once
