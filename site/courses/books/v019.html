<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 1 课程介绍（Class Intro）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 1 课程介绍（Class Intro） · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v019","title":"Lecture 1 课程介绍（Class Intro）","course":"强化学习","pages":[{"title":"课程介绍与强化学习概述","segments":[{"id":0,"text":"Welcome to Deep Reinforcement Learning or CS224R.","zh":"欢迎来到深度强化学习或CS224R课程。","start":5.2,"end":8.78},{"id":1,"text":"I'm really excited to be teaching it again this quarter. My name is Chelsea. I am the instructor of the course. I'm an assistant professor here at Stanford. I do research on reinforcement learning, robotics, and language models, and a variety of other topics. So the plan for today. So we're going to be covering the course goals and some logistics. Hopefully this will be fairly short because all this information is available online. After that, we'll be talking about why study deep reinforcement learning and actually get into some technical content.","zh":"我非常兴奋能再次教授这门课。我叫切尔西。我是这门课的讲师。我在斯坦福大学担任助理教授。我的研究领域包括强化学习、机器人学和语言模型，以及许多其他主题。那么今天我们的计划。我们将介绍课程目标和一些教学安排。希望这会比较简短，因为所有这些信息都可以在线获取。之后，我们将讨论为什么学习深度强化学习，并实际进入一些技术内容。","start":10.7,"end":38.08},{"id":2,"text":"on modeling behavior and reinforcement learning. The key learning goals for today is what even is deep reinforcement learning? How do we go about actually representing behavior in a way that we can optimize behavior? And how do we formulate a reinforcement learning problem? So what do we mean by deep reinforcement learning? So first, for reinforcement learning, we mean decision-making problems.","zh":"关于行为建模和强化学习。今天的关键学习目标是：什么是深度强化学习？我们如何以一种可以优化行为的方式表示行为？以及我们如何将强化学习问题进行建模？那么，我们所说的深度强化学习是什么意思？首先，对于强化学习，我们指的是决策问题。","start":38.54,"end":61.38},{"id":3,"text":"And these are problems where a system needs to make multiple decisions based on a stream of information. So it'll observe and then take an action based on that observation and then observe again and take another action.","zh":"这些问题需要系统根据信息流做出多个决策。因此，系统会观察，然后根据观察结果采取行动，接着再次观察并采取另一个行动。","start":62.12,"end":72.8},{"id":4,"text":"and we'll be studying those kinds of problems as well as the solutions to those kinds of problems.","zh":"我们将研究这类问题以及解决这类问题的方法。","start":74.12,"end":78.78},{"id":5,"text":"And that includes things like imitation learning, model-free and model-based reinforcement learning,","zh":"这包括模仿学习、无模型和基于模型的强化学习，","start":79.0,"end":83.46},{"id":6,"text":"offline and online reinforcement learning, multitask and meta-reinforcement learning,","zh":"离线和在线强化学习、多任务和元强化学习，","start":83.8,"end":88.22},{"id":7,"text":"as well as a little bit of an extra focus on reinforcement learning for large language models","zh":"以及对大型语言模型的强化学习稍作额外关注","start":88.48,"end":93.72},{"id":8,"text":"and reinforcement learning for robots. So that's kind of the crux of the reinforcement learning","start":93.72,"end":98.72},{"id":9,"text":"learning aspect of the course. And we'll be emphasizing solutions that scale to deep neural","start":98.72,"end":104.78},{"id":10,"text":"networks. And we'll be spending a lot less time on solutions that don't pertain to deep","start":104.78,"end":109.06},{"id":11,"text":"neural networks. Now, how does deep RL differ from other machine learning topics? So, hopefully","start":109.06,"end":117.56},{"id":12,"text":"a lot of you have some experience with machine learning. And oftentimes in machine learning,","start":117.56,"end":122.34},{"id":13,"text":"learning, you'll have some kind of input-output pair, x, y, and you'll have a bunch of these","start":122.34,"end":128.0},{"id":14,"text":"in some data set. And then your goal is to learn something that can map from x to y.","start":128.62,"end":135.62},{"id":15,"text":"And another thing is that we kind of typically assume in these data sets is that these data","start":137.28,"end":142.9},{"id":16,"text":"points are sampled from some distribution and are sampled in an independent and identical","start":142.9,"end":148.94},{"id":17,"text":"And we typically assume in these data sets is that these data points are sampled from some distribution and are sampled in an independent and identical way from that distribution.","start":148.94,"end":151.18},{"id":18,"text":"And this is actually where reinforcement learning differs quite a bit.","start":152.66,"end":156.28},{"id":19,"text":"So in supervised learning, we have labeled data, we learn the function, we're directly","start":156.4,"end":159.9},{"id":20,"text":"told what to output, we're kind of told what the answer is for that given input.","start":159.9,"end":164.7}],"notes":["本段介绍了强化学习的基本概念，强调了它与监督学习的不同之处。强化学习涉及决策过程，系统需要根据信息流做出多个决策，观察后采取行动，再观察并再次行动。课程目标包括理解深度强化学习的定义、如何表示行为以优化行为，以及如何构建强化学习问题。","课程内容涵盖模仿学习、无模型和有模型强化学习、离线和在线强化学习、多任务和元强化学习，以及针对大型语言模型和机器人的强化学习。课程重点放在能够扩展到深度神经网络的解决方案上，而减少对非深度神经网络解决方案的讨论。","深度强化学习与传统机器学习的不同之处在于数据的获取方式。在监督学习中，数据是输入-输出对，且数据点通常是从某个分布中独立且同等地采样。而在强化学习中，数据是通过与环境的交互动态生成的，没有明确的标签，而是通过奖励信号进行学习。","课程还提到，强化学习与监督学习在目标和方法上有显著差异。监督学习的目标是学习一个映射函数，将输入映射到输出，而强化学习的目标是学习一个策略，以最大化累积奖励。","在监督学习中，数据点通常假设是从某个分布中独立且同等地采样，而在强化学习中，数据是通过与环境的交互动态生成的，这使得强化学习的训练过程更加复杂。","课程强调了深度强化学习在处理复杂任务中的重要性，特别是在涉及大型语言模型和机器人应用的场景中，深度神经网络的使用是关键。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":164.7,"asr_flags":[],"translation_complete":false,"translated_segments":8,"raw_segments":[{"start":5.2,"text":"Welcome to Deep Reinforcement Learning or CS224R."},{"start":10.7,"text":"I'm really excited to be teaching it again this quarter. My name is Chelsea. I am the instructor of the course. I'm an assistant professor here at Stanford. I do research on reinforcement learning, robotics, and language models, and a variety of other topics. So the plan for today. So we're going to be covering the course goals and some logistics. Hopefully this will be fairly short because all this information is available online. After that, we'll be talking about why study deep reinforcement learning and actually get into some technical content."},{"start":38.54,"text":"on modeling behavior and reinforcement learning. The key learning goals for today is what even is deep reinforcement learning? How do we go about actually representing behavior in a way that we can optimize behavior? And how do we formulate a reinforcement learning problem? So what do we mean by deep reinforcement learning? So first, for reinforcement learning, we mean decision-making problems."},{"start":62.12,"text":"And these are problems where a system needs to make multiple decisions based on a stream of information. So it'll observe and then take an action based on that observation and then observe again and take another action."},{"start":74.12,"text":"and we'll be studying those kinds of problems as well as the solutions to those kinds of problems."},{"start":79.0,"text":"And that includes things like imitation learning, model-free and model-based reinforcement learning,"},{"start":83.8,"text":"offline and online reinforcement learning, multitask and meta-reinforcement learning,"},{"start":88.48,"text":"as well as a little bit of an extra focus on reinforcement learning for large language models"},{"start":93.72,"text":"and reinforcement learning for robots. So that's kind of the crux of the reinforcement learning"},{"start":98.72,"text":"learning aspect of the course. And we'll be emphasizing solutions that scale to deep neural"},{"start":104.78,"text":"networks. And we'll be spending a lot less time on solutions that don't pertain to deep"},{"start":109.06,"text":"neural networks. Now, how does deep RL differ from other machine learning topics? So, hopefully"},{"start":117.56,"text":"a lot of you have some experience with machine learning. And oftentimes in machine learning,"},{"start":122.34,"text":"learning, you'll have some kind of input-output pair, x, y, and you'll have a bunch of these"},{"start":128.62,"text":"in some data set. And then your goal is to learn something that can map from x to y."},{"start":137.28,"text":"And another thing is that we kind of typically assume in these data sets is that these data"},{"start":142.9,"text":"points are sampled from some distribution and are sampled in an independent and identical"},{"start":148.94,"text":"identical way from that to speed."},{"start":152.66,"text":"And this is actually where reinforcement learning differs quite a bit."},{"start":156.4,"text":"So in supervised learning, we have labeled data, we learn the function, we're directly"},{"start":159.9,"text":"told what to output, we're kind of told what the answer is for that given input."}],"speech_gaps":[],"frame":"../frames/v019/001.webp","frame_time":17.2},{"title":"强化学习课程介绍","segments":[{"id":21,"text":"and the inputs are iid sampled. Now in reinforcement learning the picture is a little bit different. So ultimately our goal is to learn behavior and we'll actually use different kind of notations to refer to inputs and outputs. So specifically our goal will be to map from states to actions and we'll refer to the function that we do that mapping as pi.","start":165.88,"end":192.83},{"id":22,"text":"Unlike in supervised learning, we're not going to be directly told what the answer is. Our goal will actually be to learn this behavior from much more indirect feedback. And so in reinforcement learning, the goal is to learn this behavior, pi of a given s, and this will be from experience, and actually experience often drawn from the policy that you're learning or this function that you're learning.","start":195.52,"end":217.01},{"id":23,"text":"And the data is not going to be sampled from a single distribution. It's actually going to be sampled in a way that actually depends on the policy or the function that you're currently learning. So these are the two big differences. And what I mean by behavior is this could include motor control, like controlling a robot. It could include a chatbot that is interacting with a person. It could be playing a game. It could be driving a car. It could be an agent that's interacting with the web and a wide range of other.","start":218.24,"end":247.73},{"id":24,"text":"domain. So that's how reinforcement differs from typical machine learning. We don't have the ability to cover everything in deep reinforcement learning and so we're going to try to focus on the core concept behind deep reinforcement learning methods so that you can then use those core concepts to understand more advanced methods should you choose to dive deeper into the topic. We'll also focus on implementation of algorithms to get to the point where you feel comfortable implementing algorithms yourself.","start":248.3,"end":277.44},{"id":25,"text":"And we'll give examples in robotics, control, and language models, especially in lecture and in projects, but a lot of the techniques we'll generalize more broadly. And also just to focus on topics that we think are the most useful and the most exciting to cover. If you're interested in more theory and other applications that are kind of beyond some of these, CS234 can also be an excellent point.","start":278.09,"end":302.94},{"id":26,"text":"Yeah, and then the core goal is really to be able to understand and implement existing and emerging methods in deep reinforcement learning. Cool. So why study deep reinforcement learning? I'll list out a number of things here, and then we'll dive into each one a little bit more. So one we already talked about is going beyond supervised example. And there's a lot of scenarios where AI model predictions have consequences.","start":305.13,"end":329.09}],"notes":["本段讲解了强化学习与监督学习的主要区别，强调了强化学习中数据的采样方式依赖于当前正在学习的策略或函数，而不是从单一分布中采样。这与监督学习中数据通常来自固定分布不同，强化学习的数据是动态生成的，反映了学习过程本身。","课程目标是帮助学生理解并实现现有的和新兴的深度强化学习方法。这包括掌握核心概念，以便能够理解更高级的方法，并通过算法实现来加深理解。","课程内容将涵盖多个应用领域，如机器人、控制和语言模型，并通过讲座和项目进行具体示例。同时，课程会强调通用技术的广泛适用性，而不仅仅是特定领域的应用。","课程还提到，对于希望深入理论或探索其他应用的学生，CS234课程是一个很好的补充资源。这表明课程设计考虑到了不同学习者的需求和兴趣方向。","课程强调了深度强化学习的重要性，特别是在AI模型预测具有实际后果的场景中。这表明课程不仅关注技术实现，还关注其实际应用价值。","课程结构清晰，从介绍核心概念开始，逐步引导学生深入理解深度强化学习的原理和实现方法，为后续学习打下坚实基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":165.88,"end":329.09,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":165.88,"text":"and the inputs are iid sampled. Now in reinforcement learning the picture is a little bit different. So ultimately our goal is to learn behavior and we'll actually use different kind of notations to refer to inputs and outputs. So specifically our goal will be to map from states to actions and we'll refer to the function that we do that mapping as pi."},{"start":195.52,"text":"Unlike in supervised learning, we're not going to be directly told what the answer is. Our goal will actually be to learn this behavior from much more indirect feedback. And so in reinforcement learning, the goal is to learn this behavior, pi of a given s, and this will be from experience, and actually experience often drawn from the policy that you're learning or this function that you're learning."},{"start":218.24,"text":"And the data is not going to be sampled from a single distribution. It's actually going to be sampled in a way that actually depends on the policy or the function that you're currently learning. So these are the two big differences. And what I mean by behavior is this could include motor control, like controlling a robot. It could include a chatbot that is interacting with a person. It could be playing a game. It could be driving a car. It could be an agent that's interacting with the web and a wide range of other."},{"start":248.3,"text":"domain. So that's how reinforcement differs from typical machine learning. We don't have the ability to cover everything in deep reinforcement learning and so we're going to try to focus on the core concept behind deep reinforcement learning methods so that you can then use those core concepts to understand more advanced methods should you choose to dive deeper into the topic. We'll also focus on implementation of algorithms to get to the point where you feel comfortable implementing algorithms yourself."},{"start":278.09,"text":"And we'll give examples in robotics, control, and language models, especially in lecture and in projects, but a lot of the techniques we'll generalize more broadly. And also just to focus on topics that we think are the most useful and the most exciting to cover. If you're interested in more theory and other applications that are kind of beyond some of these, CS234 can also be an excellent point."},{"start":305.13,"text":"Yeah, and then the core goal is really to be able to understand and implement existing and emerging methods in deep reinforcement learning. Cool. So why study deep reinforcement learning? I'll list out a number of things here, and then we'll dive into each one a little bit more. So one we already talked about is going beyond supervised example. And there's a lot of scenarios where AI model predictions have consequences."}],"speech_gaps":[],"frame":"../frames/v019/002.webp","frame_time":177.88},{"title":"强化学习课程介绍","segments":[{"id":27,"text":"If we want to take into account those consequences, then we need a framework for thinking about those consequences and how to optimize the behavior with respect to those consequences. So, for example, if you listen to music on Spotify, for example, and the Spotify algorithm is recommending a song for you to play, that recommendation, or even actually just playing it directly for you, that recommendation has consequences such that the next time it recommends a song, it probably shouldn't recommend the same song or it might want to also stay within the same genre and so forth.","start":332.27,"end":361.05},{"id":28,"text":"And so if we want to think about developing AI systems that can take into account those consequences, that's what deep reinforcement learning allows us to do. There's also scenarios where direct supervision isn't available. So for example, if you have a coding assistant like Cursor or Copilot","start":361.53,"end":379.98},{"id":29,"text":"and you want to give it feedback saying, like, that did a great job there or did a poor job there, that supervision is not the output. It's a more indirect supervision. And learning from that sort of indirect supervision or really any sort of objective can be formulated as a reinforcement learning problem. So it's a lot more flexible than supervised learning. Reinforcement learning is also widely used and deployed in a number of performant AI systems.","start":380.42,"end":406.51},{"id":30,"text":"Also, learning from experience, in my opinion, seems kind of fundamental to intelligence. And so just from a kind of a philosophical level in terms of building intelligent machines, figuring out how to actually develop algorithms that can learn from their own experience seems pretty fundamental to that. And it's fundamental to be able to actually make discoveries of new things rather than just mimicking the data.","start":408.94,"end":431.06},{"id":31,"text":"And then lastly, there's also some pretty exciting open research problems as well. And so it makes it a pretty exciting area to do research on. And then lastly, I was also actually last weekend, I was telling a friend that I was making slides on why study deep reinforcement learning and how I was making several slides on it. And they were like, well, why do you this? This question doesn't seem very hard. The answer is just one million in total compensation from OpenAI.","start":433.24,"end":459.77},{"id":32,"text":"So maybe if you're not motivated by one through four, this can be some motivation. Okay. So diving into beyond supervised learning, decision-making problems are everywhere and can't be directly formulated as supervised learning. Any sort of AI agent is captured by this. Also, if you want your AI system to interact with people, like chatbots or recommenders, or scenarios where decisions will affect future outcomes or observations, these kind of feedback loops, these are reinforcement learning problems.","start":460.3,"end":490.11}],"notes":["本段介绍了强化学习的基本概念，即通过考虑行为的后果来优化决策过程。课程中提到，强化学习可以用于开发能够考虑后果的AI系统，例如Spotify推荐系统，其中推荐的歌曲会影响后续的推荐结果。此外，强化学习适用于没有直接监督的情况，如代码助手Cursor或Copilot，它们通过间接反馈进行学习。","强化学习比监督学习更灵活，因为它可以处理各种间接监督或目标。课程中提到，强化学习被广泛应用于高性能AI系统中，例如推荐系统和聊天机器人。此外，学习从经验中获取知识被认为是智能的核心，这使得强化学习在构建智能机器方面具有重要地位。","课程还提到，强化学习是一个充满研究机会的领域，存在许多开放性问题。例如，课程中提到作者在周末制作了关于学习深度强化学习的幻灯片，并提到OpenAI提供的高额报酬作为学习动机。这表明强化学习不仅在理论上有价值，在实际应用中也具有重要性。","强化学习适用于任何需要决策并影响未来结果的场景，例如与人类互动的AI系统（如聊天机器人或推荐系统）。这些系统通过反馈循环进行学习，而强化学习正是处理这类问题的合适方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":332.27,"end":490.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":332.27,"text":"If we want to take into account those consequences, then we need a framework for thinking about those consequences and how to optimize the behavior with respect to those consequences. So, for example, if you listen to music on Spotify, for example, and the Spotify algorithm is recommending a song for you to play, that recommendation, or even actually just playing it directly for you, that recommendation has consequences such that the next time it recommends a song, it probably shouldn't recommend the same song or it might want to also stay within the same genre and so forth."},{"start":361.53,"text":"And so if we want to think about developing AI systems that can take into account those consequences, that's what deep reinforcement learning allows us to do. There's also scenarios where direct supervision isn't available. So for example, if you have a coding assistant like Cursor or Copilot,"},{"start":380.42,"text":"and you want to give it feedback saying, like, that did a great job there or did a poor job there, that supervision is not the output. It's a more indirect supervision. And learning from that sort of indirect supervision or really any sort of objective can be formulated as a reinforcement learning problem. So it's a lot more flexible than supervised learning. Reinforcement learning is also widely used and deployed in a number of performant AI systems."},{"start":408.94,"text":"Also, learning from experience, in my opinion, seems kind of fundamental to intelligence. And so just from a kind of a philosophical level in terms of building intelligent machines, figuring out how to actually develop algorithms that can learn from their own experience seems pretty fundamental to that. And it's fundamental to be able to actually make discoveries of new things rather than just mimicking the data."},{"start":433.24,"text":"And then lastly, there's also some pretty exciting open research problems as well. And so it makes it a pretty exciting area to do research on. And then lastly, I was also actually last weekend, I was telling a friend that I was making slides on why study deep reinforcement learning and how I was making several slides on it. And they were like, well, why do you this? This question doesn't seem very hard. The answer is just one million in total compensation from OpenAI."},{"start":460.3,"text":"So maybe if you're not motivated by one through four, this can be some motivation. Okay. So diving into beyond supervised learning, decision-making problems are everywhere and can't be directly formulated as supervised learning. Any sort of AI agent is captured by this. Also, if you want your AI system to interact with people, like chatbots or recommenders, or scenarios where decisions will affect future outcomes or observations, these kind of feedback loops, these are reinforcement learning problems."}],"speech_gaps":[],"frame":"../frames/v019/003.webp","frame_time":344.27},{"title":"强化学习的应用与实例","segments":[{"id":33,"text":"And then, yeah, like I mentioned before, if you don't have labels and your objective isn't just accuracy or it's non-differentiable, these are scenarios where reinforcement learning is useful. Now, I mentioned that DeepRL is used in a variety of different performance systems. What am I talking about there? Two examples of legged robots that have learned behavior with reinforcement learning. In this case, reinforcement learning in simulation and then transferred to the real world.","start":491.19,"end":517.83},{"id":34,"text":"So you can get some cool stuff like puppy robots and dancing humanoids. And these are actually like real robots in the real world, policies that were trained with deep reinforcement learning. Beyond legged robots and dancing, you can also get robots that can manipulate with arms to do taps using, in this case, imitation learning, but still within the scope of this course.","start":518.29,"end":541.26},{"id":35,"text":"So the left is a robot that is unloading laundry and folding the laundry. On the right is a robot that can fold some simple origami. So some pretty cool stuff you can do with these kinds of methods. You can also learn to play complex games. So several years ago, DeepMind used deep reinforcement learning to train a system to play the game of Go.","start":541.79,"end":569.63},{"id":36,"text":"And it actually defeated the champion of Go, defeated Lee Sedol, which was really impressive in its own right. And another really cool thing about it was kind of coming back to this discovery talent of AI systems. There was this move that surprised everyone that was an expert in Go. It was called Move 37. And it kind of discovered a strategy that humans previously hadn't thought of before.","start":570.26,"end":595.42},{"id":37,"text":"And so this is an example of how reinforcement learning can be a tool to discover new solutions. And this might be useful beyond games, but if we want to, for example, discover curious diseases or discover things that require experimentation, it provides a tool for doing those kinds of things. And it's not just robots and games. So nearly all modern language models use some form of RL for post-training, especially for more advanced reasoning as well.","start":595.95,"end":624.01},{"id":38,"text":"There's also research on traffic control using reinforcement learning and finding ways to insert cars into human-driven cars in order to increase the throughput on different roads. Research on training generative models with reinforcement learning. In this case, for example, trying to make the generations adhere to a particular prompt. So what these are showing is on the left, if you ask the base generative model,","start":625.66,"end":652.85}],"notes":["本段介绍了强化学习在没有标签数据或目标函数不可微的情况下适用的场景，并提到深度强化学习（DeepRL）在多种性能系统中的应用，如腿部机器人和舞蹈人形机器人。这些机器人通过仿真环境训练后，再转移到现实世界中。","课堂中提到，强化学习不仅用于机器人控制，还用于复杂游戏如围棋的训练。DeepMind使用深度强化学习训练系统击败了围棋冠军李世石，展示了AI在发现新策略方面的潜力。","强化学习还可以用于发现新解决方案，例如在医学研究或需要实验的领域。此外，现代语言模型在训练后也使用强化学习，特别是在高级推理任务中。","课堂还提到强化学习在交通控制和生成模型训练中的应用，例如通过强化学习优化交通流量，以及训练生成模型使其符合特定提示。","这些例子说明了强化学习的广泛应用，从机器人控制到游戏、语言模型和交通优化，展示了其作为发现新策略和优化系统的重要工具。","课堂强调了强化学习在不同领域的潜力，包括发现新策略、优化系统性能以及在复杂任务中的应用，如语言模型的训练和交通控制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":491.19,"end":652.85,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":491.19,"text":"And then, yeah, like I mentioned before, if you don't have labels and your objective isn't just accuracy or it's non-differentiable, these are scenarios where reinforcement learning is useful. Now, I mentioned that DeepRL is used in a variety of different performance systems. What am I talking about there? Two examples of legged robots that have learned behavior with reinforcement learning. In this case, reinforcement learning in simulation and then transferred to the real world."},{"start":518.29,"text":"So you can get some cool stuff like puppy robots and dancing humanoids. And these are actually like real robots in the real world, policies that were trained with deep reinforcement learning. Beyond legged robots and dancing, you can also get robots that can manipulate with arms to do taps using, in this case, imitation learning, but still within the scope of this course."},{"start":541.79,"text":"So the left is a robot that is unloading laundry and folding the laundry. On the right is a robot that can fold some simple origami. So some pretty cool stuff you can do with these kinds of methods. You can also learn to play complex games. So several years ago, DeepMind used deep reinforcement learning to train a system to play the game of Go."},{"start":570.26,"text":"And it actually defeated the champion of Go, defeated Lee Sedol, which was really impressive in its own right. And another really cool thing about it was kind of coming back to this discovery talent of AI systems. There was this move that surprised everyone that was an expert in Go. It was called Move 37. And it kind of discovered a strategy that humans previously hadn't thought of before."},{"start":595.95,"text":"And so this is an example of how reinforcement learning can be a tool to discover new solutions. And this might be useful beyond games, but if we want to, for example, discover curious diseases or discover things that require experimentation, it provides a tool for doing those kinds of things. And it's not just robots and games. So nearly all modern language models use some form of RL for post-training, especially for more advanced reasoning as well."},{"start":625.66,"text":"There's also research on traffic control using reinforcement learning and finding ways to insert cars into human-driven cars in order to increase the throughput on different roads. Research on training generative models with reinforcement learning. In this case, for example, trying to make the generations adhere to a particular prompt. So what these are showing is on the left, if you ask the base generative model,"}],"speech_gaps":[],"frame":"../frames/v019/004.webp","frame_time":503.19},{"title":"强化学习的课程介绍与示例","segments":[{"id":39,"text":"to make a picture of a dolphin riding a bike, it'll give you this, which is not a very good picture, and then you can optimize with reinforcement learning to get a picture that is actually following the prompt more effectively, and likewise for other prompts as well. And this also is being used for chip design. This is a paper that designed chips that are used in Google's production TPU, which is also pretty useful.","start":653.4,"end":680.06},{"id":40,"text":"Great. So those are a few examples. There's a number of others I didn't cover as well. The next thing that I mentioned in terms of studying deep RLs, it kind of seems somewhat fundamental to intelligence. And for this, I want to tell a little bit of a story, which is that when I was starting my PhD, right after I graduated undergrad, I joined a lab that was looking at reinforcement learning for robots. And right next to where I was sitting was this robot here.","start":682.52,"end":711.29},{"id":41,"text":"Oftentimes there was a postdoc in the lab who was running experiments with reinforcement learning, and so I would look over at the robot and it would be doing things like this. And the thing that really kind of fascinated me about watching this robot is you can actually see it learning over time. And at the beginning it knew nothing about how to, for example, insert and kind of assemble these two parts of a toy airplane, and at the end it's actually able to do it quite performantly. This is like really, really cool. You can actually see it learning from its own experience.","start":713.5,"end":742.21},{"id":42,"text":"in the real world. So essentially, reinforcement learning enables this kind of ability to get better with practice that isn't present in other machine learning systems. Now, there is one caveat to this, which is that this particular robot had its eyes closed. It wasn't using a camera, essentially.","start":743.08,"end":758.85},{"id":43,"text":"And that seemed like a really fundamental limitation to me. And so I actually kind of then worked with the postdoc on a follow-up project with vision, with cameras, and I was able to, in this case, then learn in the real world how to insert the red block into the shapefording cube. And again here, with experience, it's able to get better and better as it practices the task over and over again. And then after the learning process, it's...","start":760.09,"end":790.76},{"id":44,"text":"So it's still learning, still improving. It ends up getting a success rate, I think, around 95 or 100% success at the end. And then I can hold the block out, or at least a young version of me can hold the block out for the robot, and the robot can then put the right block into the same currency. Now, these are very simple tasks. This was, in some ways, a long time ago. And now we have robots that can fold laundry and do dancing and so forth.","start":791.2,"end":820.21}],"notes":["本段介绍了强化学习在实际应用中的例子，如生成符合提示的图像和芯片设计。强化学习通过优化过程使系统能够更好地遵循指令，这在图像生成和芯片设计中都有体现。","讲者提到自己在博士期间参与了一个关于机器人强化学习的实验室项目，观察到机器人通过经验学习完成任务的过程，这展示了强化学习在实际环境中的学习能力。","讲者指出，机器人在没有视觉输入的情况下也能学习，但这种能力存在局限性，因此后续项目引入了视觉系统以提升学习效果。","机器人通过反复练习任务，逐渐提高成功率，最终达到95%或100%的成功率，这说明强化学习在实际任务中的有效性和可扩展性。","讲者提到这些任务虽然简单，但展示了强化学习的潜力，现在机器人已经能够完成更复杂的任务，如叠衣服和跳舞。","这些例子说明了强化学习在现实世界中的应用价值，以及其在智能系统发展中的重要性。"],"formulas":[],"uncertainties":["shapefording cube"],"diagram":"none","start":653.4,"end":820.21,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":653.4,"text":"to make a picture of a dolphin riding a bike, it'll give you this, which is not a very good picture, and then you can optimize with reinforcement learning to get a picture that is actually following the prompt more effectively, and likewise for other prompts as well. And this also is being used for chip design. This is a paper that designed chips that are used in Google's production TPU, which is also pretty useful."},{"start":682.52,"text":"Great. So those are a few examples. There's a number of others I didn't cover as well. The next thing that I mentioned in terms of studying deep RLs, it kind of seems somewhat fundamental to intelligence. And for this, I want to tell a little bit of a story, which is that when I was starting my PhD, right after I graduated undergrad, I joined a lab that was looking at reinforcement learning for robots. And right next to where I was sitting was this robot here."},{"start":713.5,"text":"Oftentimes there was a postdoc in the lab who was running experiments with reinforcement learning, and so I would look over at the robot and it would be doing things like this. And the thing that really kind of fascinated me about watching this robot is you can actually see it learning over time. And at the beginning it knew nothing about how to, for example, insert and kind of assemble these two parts of a toy airplane, and at the end it's actually able to do it quite performantly. This is like really, really cool. You can actually see it learning from its own experience."},{"start":743.08,"text":"in the real world. So essentially, reinforcement learning enables this kind of ability to get better with practice that isn't present in other machine learning systems. Now, there is one caveat to this, which is that this particular robot had its eyes closed. It wasn't using a camera, essentially."},{"start":760.09,"text":"And that seemed like a really fundamental limitation to me. And so I actually kind of then worked with the postdoc on a follow-up project with vision, with cameras, and I was able to, in this case, then learn in the real world how to insert the red block into the shapefording cube. And again here, with experience, it's able to get better and better as it practices the task over and over again. And then after the learning process, it's..."},{"start":791.2,"text":"So it's still learning, still improving. It ends up getting a success rate, I think, around 95 or 100% success at the end. And then I can hold the block out, or at least a young version of me can hold the block out for the robot, and the robot can then put the right block into the same currency. Now, these are very simple tasks. This was, in some ways, a long time ago. And now we have robots that can fold laundry and do dancing and so forth."}],"speech_gaps":[],"frame":"../frames/v019/005.webp","frame_time":665.4},{"title":"强化学习课程介绍与研究挑战","segments":[{"id":45,"text":"But one of the reasons why I like showing these videos is they really show the reinforcement learning process in the real world and the ability to improve with practice. At the same time, there's also a ton of exciting research problems that are open. And so if you're someone who's excited about doing research, there's challenges like, how does this robot learn to represent what is good for the task?","start":823.23,"end":842.71},{"id":46,"text":"Or how does an agent generalize its behavior not just to one scenario, but to many different scenarios? And can we apply such a system at scale with large diverse data sets and transfer from other paths and other goals? And can we use reinforcement learning to learn long horizon paths, like cooking a meal or solving a really hard math problem?","start":844.18,"end":861.24},{"id":47,"text":"Or can robots practice fully autonomously? And for this last point, I showed you some videos of","start":862.41,"end":867.33},{"id":48,"text":"reinforcement learning. That's not actually always what it looks like.","start":867.33,"end":870.83},{"id":49,"text":"So sometimes if you run reinforcement learning on a robot, it looks more like this, where the robot is trying to hit the","start":870.83,"end":875.09},{"id":50,"text":"hockey puck into the goal. And every time the robot attempts the task, it then kind of needs","start":875.09,"end":881.39},{"id":51,"text":"to start over and reattempt it. And the robot doesn't actually know how to undo the task.","start":881.39,"end":885.51},{"id":52,"text":"And this is my friend Yevgen. You might notice that Yevgen is actually doing more work than what the","start":885.51,"end":889.97},{"id":53,"text":"robot is doing, which doesn't quite seem like the right way of doing things.","start":889.97,"end":894.27},{"id":54,"text":"And it's not practical to collect a lot of data this way.","start":894.29,"end":896.27},{"id":55,"text":"And along all these topics, these are some of the topics that we'll be covering in this","start":899.75,"end":903.59},{"id":56,"text":"course as well.","start":903.59,"end":904.07},{"id":57,"text":"So we'll be talking about reward learning and how to represent different rewards.","start":904.17,"end":907.51},{"id":58,"text":"We'll be talking about offline RL, multitask RL and meta RL, hierarchy and reasoning, and","start":907.71,"end":913.59},{"id":59,"text":"reset-free RL as well.","start":913.59,"end":915.51},{"id":60,"text":"Cool.","start":917.87,"end":918.27},{"id":61,"text":"Cool. So, any questions on why Deep RL is interesting to study? Yeah. So, the question","start":918.27,"end":926.73},{"id":62,"text":"was how do you learn a reward when the robot is learning in the real world? And in that","start":926.73,"end":930.63},{"id":63,"text":"the negative distance between the position of the object and the goal position of the object.","start":930.63,"end":938.59},{"id":64,"text":"And you might have noticed that in the case with the shapefaring cube, the robot was actually holding the cube","start":938.59,"end":944.21},{"id":65,"text":"And so that meant that we could actually measure using the robot arm's position where the cube was as well.","start":944.21,"end":948.17},{"id":66,"text":"Now, you can't do this in practice in many scenarios. It's kind of specific to that task.","start":948.17,"end":954.33},{"id":67,"text":"Now, you can't do this in practice in many scenarios. It's kind of specific to that task. And in the hockey example, there was actually a mocap marker on the hockey puck that measured where it is in the room. In general, it's very hard, and that's why reward learning is kind of necessary in order to solve the problem in a more general way. Good question. Okay.","start":955.14,"end":983.14},{"id":68,"text":"So, now let's dive into modeling behavior and reinforcement learning. So,","start":983.55,"end":990.47},{"id":69,"text":"we need to figure out how to represent experience as data. So, as the robot was practicing,","start":991.93,"end":996.61},{"id":70,"text":"we need to think about how we could actually represent what was captured in that video as","start":996.95,"end":1002.11}],"notes":["本段介绍了强化学习在现实世界中的应用和研究挑战，强调了机器人学习任务表示、泛化能力、大规模数据集应用以及长期路径学习的重要性。讲者提到，机器人在学习过程中可能需要重新开始任务，且无法撤销操作，这表明了强化学习在实际应用中的局限性。","讲者通过机器人学习击球任务的例子，说明了如何通过奖励函数（如物体与目标位置的距离）来引导学习过程。同时指出，这种表示方式在某些任务中是特定的，例如使用运动捕捉标记来测量物体位置，这在一般情况下是困难的。","讲者提到，奖励学习对于解决更广泛的问题是必要的，因为它允许系统在没有直接测量的情况下学习任务目标。这表明了奖励函数设计在强化学习中的核心地位。","讲者还提到课程将涵盖奖励学习、离线强化学习、多任务学习、元学习、层次结构与推理以及无需重置的强化学习等主题，这些内容反映了强化学习的多个研究方向。","在回答关于如何在现实世界中学习奖励的问题时，讲者指出，奖励函数的设计需要根据具体任务进行调整，例如在形状立方体任务中，通过机械臂的位置来测量物体位置，这在实际应用中可能不适用。","讲者强调了奖励学习的必要性，因为它允许系统在没有直接测量的情况下学习任务目标，这表明了奖励函数设计在强化学习中的核心地位。"],"formulas":[],"uncertainties":["shapefaring cube"],"diagram":"none","start":823.23,"end":1002.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":823.23,"text":"But one of the reasons why I like showing these videos is they really show the reinforcement learning process in the real world and the ability to improve with practice. At the same time, there's also a ton of exciting research problems that are open. And so if you're someone who's excited about doing research, there's challenges like, how does this robot learn to represent what is good for the task?"},{"start":844.18,"text":"Or how does an agent generalize its behavior not just to one scenario, but to many different scenarios? And can we apply such a system at scale with large diverse data sets and transfer from other paths and other goals? And can we use reinforcement learning to learn long horizon paths, like cooking a meal or solving a really hard math problem?"},{"start":862.41,"text":"Or can robots practice fully autonomously? And for this last point, I showed you some videos of"},{"start":867.33,"text":"reinforcement learning. That's not actually always what it looks like. So sometimes if you run"},{"start":870.83,"text":"reinforcement learning on a robot, it looks more like this, where the robot is trying to hit the"},{"start":875.09,"text":"hockey puck into the goal. And every time the robot attempts the task, it then kind of needs"},{"start":881.39,"text":"to start over and reattempt it. And the robot doesn't actually know how to undo the task. And"},{"start":885.51,"text":"this is my friend Yevgen. You might notice that Yevgen is actually doing more work than what the"},{"start":889.97,"text":"robot is doing, which doesn't quite seem like the right way of doing things."},{"start":894.29,"text":"And it's not practical to collect a lot of data this way."},{"start":899.75,"text":"And along all these topics, these are some of the topics that we'll be covering in this"},{"start":903.59,"text":"course as well."},{"start":904.17,"text":"So we'll be talking about reward learning and how to represent different rewards."},{"start":907.71,"text":"We'll be talking about offline RL, multitask RL and meta RL, hierarchy and reasoning, and"},{"start":913.59,"text":"reset-free RL as well."},{"start":917.87,"text":"Cool."},{"start":918.27,"text":"Cool. So, any questions on why Deep RL is interesting to study? Yeah. So, the question"},{"start":926.73,"text":"was how do you learn a reward when the robot is learning in the real world? And in that"},{"start":930.63,"text":"particular example, we represented the reward as the distance between, or the negative distance"},{"start":938.59,"text":"between the position of the object and the goal position of the object. And you might"},{"start":944.21,"text":"have noticed that in the case with the shapefaring cube, the robot was actually holding the cube"},{"start":948.17,"text":"And so that meant that we could actually measure using the robot arm's position where the cube was as well."},{"start":955.14,"text":"Now, you can't do this in practice in many scenarios. It's kind of specific to that task. And in the hockey example, there was actually a mocap marker on the hockey puck that measured where it is in the room. In general, it's very hard, and that's why reward learning is kind of necessary in order to solve the problem in a more general way. Good question. Okay."},{"start":983.55,"text":"So, now let's dive into modeling behavior and reinforcement learning. So,"},{"start":991.93,"text":"we need to figure out how to represent experience as data. So, as the robot was practicing,"},{"start":996.95,"text":"we need to think about how we could actually represent what was captured in that video as"}],"speech_gaps":[{"start":897.104,"end":899.328}],"frame":"../frames/v019/006.webp","frame_time":835.23},{"title":"状态与观察的区别","segments":[{"id":71,"text":"data to learn from. And so, here's another example of a robot learning in the real world.","start":1002.11,"end":1007.35},{"id":72,"text":"We might also want to think about how to represent text from a chatbot, for example.","start":1007.65,"end":1012.53},{"id":73,"text":"we need to in either of these cases we need to think about experience that the agent collects.","start":1012.53,"end":1016.73},{"id":74,"text":"How do we actually write that down as data? So the way that we do that typically in reinforcement","start":1016.97,"end":1024.15},{"id":75,"text":"learning is first we'll think about the state of the world and we'll use s to denote the current","start":1024.15,"end":1028.97},{"id":76,"text":"state of the world. And for example in in the case of the robot the state of the world might be","start":1028.97,"end":1037.53},{"id":77,"text":"like the position of the arm and the position of the towel and the position of the hook.","start":1038.13,"end":1042.21},{"id":78,"text":"Or, if you don't have access to information about the towel directly, it might just be","start":1042.77,"end":1047.51},{"id":79,"text":"an image captured from the robot's camera and the position of the joints of the arm","start":1047.51,"end":1053.45},{"id":80,"text":"if you have access to that.","start":1053.45,"end":1054.35},{"id":81,"text":"Now you can't always represent, you can't always have direct access to the state of","start":1055.53,"end":1061.41},{"id":82,"text":"the world, and so sometimes we'll use, sometimes we'll refer to an observation O and use observations","start":1061.41,"end":1069.95},{"id":83,"text":"instead of states.","start":1069.95,"end":1070.83},{"id":84,"text":"and the difference between observations and states is that with observations it may not capture","start":1071.49,"end":1076.37},{"id":85,"text":"all of the information you need to make a decision and you might actually need to think about","start":1076.97,"end":1081.19},{"id":86,"text":"past observations that you've seen before. So for example for a chatbot if you're interacting with","start":1081.19,"end":1086.75},{"id":87,"text":"it you can think of the observation at a given time step as the most recent message that you","start":1086.75,"end":1091.65},{"id":88,"text":"sent to that chat.","start":1091.65,"end":1092.27},{"id":89,"text":"And then that most recent message doesn't tell the chatbot everything it needs to know about what the next response should be. And so what you need is you actually need to give it the history of past observations, not just the current observation, in order to make a decision. And we'll talk a little bit more about this state observation distinction in a couple slides. So this is kind of capturing what...","start":1093.97,"end":1117.98},{"id":90,"text":"the agent is observing. Now we also need to capture how it's taking actions, how it's actually making decisions. And we'll refer to those decisions as actions. And we'll use the letter A to denote actions. And then in terms of a given interaction with the environment, we will think of that as a trajectory. So that will be a sequence of states and actions or a sequence of observations and actions. This is kind of","start":1118.24,"end":1149.53},{"id":91,"text":"one way to represent behavior. And this will then kind of result in a data set of trajectories rather than a data set of x5 pairs. And then we need to think about what is actually the goal of the tau. And that's where reward functions come in. And reward functions are essentially telling us how good is a given state in action. In many cases, the reward function will only depend on the state.","start":1150.81,"end":1180.83}],"notes":["本段主要讲解了强化学习中状态（state）和观察（observation）的区别。状态是环境的完整描述，而观察可能不包含所有必要的信息。在某些情况下，比如机器人或聊天机器人，观察可能只是当前的输入，而决策需要依赖历史观察。","在机器人示例中，状态可能包括机械臂的位置、毛巾和钩子的位置，或者如果无法直接获取毛巾信息，则可能使用摄像头图像和机械臂关节位置。这说明状态可以是直接的物理信息或间接的感知信息。","对于聊天机器人，观察可能只是当前的输入消息，但决策需要历史消息，这说明观察可能不足以做出完整决策，需要结合历史信息。","状态和观察的区别在于，状态是环境的完整描述，而观察可能不完整。因此，在某些情况下，需要使用观察的历史信息来辅助决策。","轨迹（trajectory）是强化学习中表示行为的一种方式，它由状态和动作的序列组成，或者由观察和动作的序列组成。轨迹数据集用于训练智能体。","奖励函数（reward function）用于衡量状态和动作的优劣，通常只依赖于状态。奖励函数是强化学习中定义目标的核心部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1002.11,"end":1180.83,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1002.11,"text":"data to learn from. And so, here's another example of a robot learning in the real world."},{"start":1007.65,"text":"We might also want to think about how to represent text from a chatbot, for example."},{"start":1012.53,"text":"we need to in either of these cases we need to think about experience that the agent collects."},{"start":1016.97,"text":"How do we actually write that down as data? So the way that we do that typically in reinforcement"},{"start":1024.15,"text":"learning is first we'll think about the state of the world and we'll use s to denote the current"},{"start":1028.97,"text":"state of the world. And for example in in the case of the robot the state of the world might be"},{"start":1038.13,"text":"like the position of the arm and the position of the towel and the position of the hook."},{"start":1042.77,"text":"Or, if you don't have access to information about the towel directly, it might just be"},{"start":1047.51,"text":"an image captured from the robot's camera and the position of the joints of the arm"},{"start":1053.45,"text":"if you have access to that."},{"start":1055.53,"text":"Now you can't always represent, you can't always have direct access to the state of"},{"start":1061.41,"text":"the world, and so sometimes we'll use, sometimes we'll refer to an observation O and use observations"},{"start":1069.95,"text":"instead of states."},{"start":1071.49,"text":"and the difference between observations and states is that with observations it may not capture"},{"start":1076.97,"text":"all of the information you need to make a decision and you might actually need to think about"},{"start":1081.19,"text":"past observations that you've seen before. So for example for a chatbot if you're interacting with"},{"start":1086.75,"text":"it you can think of the observation at a given time step as the most recent message that you"},{"start":1091.65,"text":"sent to that chat."},{"start":1093.97,"text":"And then that most recent message doesn't tell the chatbot everything it needs to know about what the next response should be. And so what you need is you actually need to give it the history of past observations, not just the current observation, in order to make a decision. And we'll talk a little bit more about this state observation distinction in a couple slides. So this is kind of capturing what..."},{"start":1118.24,"text":"the agent is observing. Now we also need to capture how it's taking actions, how it's actually making decisions. And we'll refer to those decisions as actions. And we'll use the letter A to denote actions. And then in terms of a given interaction with the environment, we will think of that as a trajectory. So that will be a sequence of states and actions or a sequence of observations and actions. This is kind of"},{"start":1150.81,"text":"one way to represent behavior. And this will then kind of result in a data set of trajectories rather than a data set of x5 pairs. And then we need to think about what is actually the goal of the tau. And that's where reward functions come in. And reward functions are essentially telling us how good is a given state in action. In many cases, the reward function will only depend on the state."}],"speech_gaps":[],"frame":"../frames/v019/007.webp","frame_time":1014.11},{"title":"状态、动作与马尔可夫性质","segments":[{"id":92,"text":"And for example, it might tell you how close is the towel to being hung or is the towel hung or not. Or in the case of a tap out, it might be like how happy is the user or did they give me a thumbs up or a thumbs down. And then this experience is kind of the trajectory and that trajectory might be augmented with the rewards. So this is kind of each time you kind of roll out the policy, you'll get some sort of data in this form.","start":1181.32,"end":1211.37},{"id":93,"text":"Let's talk a little bit more about states and observations first. So the way that we can then think about states and actions is it's always a lot like a Markov chain. So we'll have the first state of the world. This is, for example, in the robot case, let's say the towel is on the table and there's a hook and the goal is to put the towel on the hook. This first state is like the robot in some neutral position and the towel on the table.","start":1213.67,"end":1241.97},{"id":94,"text":"And then the robot will take some action. This is like moving its arm to a particular location. And that action and the current state will inform what the next state is. And then from there, maybe the towel is in the same position if the robot was just moving in free space, or maybe the towel was moved. And then the robot will then take another action. It will move its arm again. And the...","start":1243.18,"end":1272.83},{"id":95,"text":"states and actions will then inform the next state. Now one crucial thing here is that we can think of how the environment is changing under what's called a dynamics function. So you have P given S and A .","start":1274.28,"end":1295.52},{"id":96,"text":"This is kind of the dynamics of the world. This is how does the arm actually move in space and how does the towel move in space as a function of where it was before and what the robot did. And the crucial thing to notice here is that S3 only depends on S2 and A2, and it doesn't depend on F1. And so there's no S1 in this probability distribution. And essentially, S3 is going to be...","start":1296.08,"end":1326.03},{"id":97,"text":"independent of S1 if you condition on S2. And this sort of independence property is called the Markov property. And it's one of the things that actually ends up being very useful in reinforced learning. So it allows you to break up the problem into these scenarios where you don't have to worry about all the dependencies that come before it.","start":1329.03,"end":1353.29}],"notes":["本段讲解了状态和动作如何共同决定下一个状态，并引入了动态函数的概念。动态函数描述了环境如何随状态和动作变化，强调了状态转移的概率分布仅依赖于当前状态和动作，而不依赖于更早的状态。这种独立性被称为马尔可夫性质，是强化学习中的关键概念。","马尔可夫性质意味着当前状态和动作足以决定下一个状态，而无需考虑更早的历史状态。这种性质使得问题可以被分解为一系列独立的决策步骤，从而简化了建模和计算。","在机器人毛巾悬挂的例子中，状态包括毛巾的位置和机器人的位置，动作是机器人手臂的移动。状态转移的概率分布仅依赖于当前状态和动作，而不是之前的状态，这体现了马尔可夫性质。","马尔可夫性质在强化学习中非常重要，因为它允许我们忽略历史状态，只需关注当前状态和动作，从而减少计算复杂度并提高算法效率。","动态函数P(S', A)描述了状态和动作如何影响下一个状态，这种函数是强化学习中建模环境的核心部分。","马尔可夫性质是强化学习中许多算法（如Q-learning和策略梯度方法）的基础，因为它允许我们使用当前状态和动作来预测未来状态，而无需考虑所有历史信息。"],"formulas":[{"latex":"P(S_3 | S_2, A_2)","symbols":"P(S3 | S2, A2)","explanation":"公式正确，表示在状态S2和动作A2的条件下，状态S3的概率分布，符合马尔可夫性质，即下一状态仅依赖于当前状态和动作，不依赖于更早的状态。","evidence":"This is kind of the dynamics of the world. This is how does the arm actually move in space and how does the towel move in space as a function of where it was before and what the robot did. And the crucial thing to notice here is that S3 only depends on S2 and A2, and it doesn't depend on F1. And so there's no S1 in this probability distribution. And essentially, S3 is going to be..."}],"uncertainties":[],"diagram":"none","start":1181.32,"end":1353.29,"asr_flags":[],"math_clarifications":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1181.32,"text":"And for example, it might tell you how close is the towel to being hung or is the towel hung or not. Or in the case of a tap out, it might be like how happy is the user or did they give me a thumbs up or a thumbs down. And then this experience is kind of the trajectory and that trajectory might be augmented with the rewards. So this is kind of each time you kind of roll out the policy, you'll get some sort of data in this form."},{"start":1213.67,"text":"Let's talk a little bit more about states and observations first. So the way that we can then think about states and actions is it's always a lot like a Markov chain. So we'll have the first state of the world. This is, for example, in the robot case, let's say the towel is on the table and there's a hook and the goal is to put the towel on the hook. This first state is like the robot in some neutral position and the towel on the table."},{"start":1243.18,"text":"And then the robot will take some action. This is like moving its arm to a particular location. And that action and the current state will inform what the next state is. And then from there, maybe the towel is in the same position if the robot was just moving in free space, or maybe the towel was moved. And then the robot will then take another action. It will move its arm again. And the..."},{"start":1274.28,"text":"states and actions will then inform the next state. Now one crucial thing here is that we can think of how the environment is changing under what's called a dynamics function. So you have P given S and A ."},{"start":1296.08,"text":"This is kind of the dynamics of the world. This is how does the arm actually move in space and how does the towel move in space as a function of where it was before and what the robot did. And the crucial thing to notice here is that S3 only depends on S2 and A2, and it doesn't depend on F1. And so there's no S1 in this probability distribution. And essentially, S3 is going to be..."},{"start":1329.03,"text":"independent of S1 if you condition on S2. And this sort of independence property is called the Markov property. And it's one of the things that actually ends up being very useful in reinforced learning. So it allows you to break up the problem into these scenarios where you don't have to worry about all the dependencies that come before it."}],"speech_gaps":[],"frame":"../frames/v019/008.webp","frame_time":1193.32},{"title":"观测与状态的关系","segments":[{"id":98,"text":"Now, if you have observations instead of states, then things look a little bit different. And the way that we can think about observations is the observation is a function of this current state, and it may not contain all the information that's in the state. And so the observation at any given point in time for completeness, we'll draw each of them here. And then if you don't have access, if you can't observe the states,","start":1356.4,"end":1386.13},{"id":99,"text":"That means now that O2, or sorry, O3, it's not just a function of O2 and A2,","start":1386.86,"end":1393.72},{"id":100,"text":"it's actually also a function of O1 if you cannot observe the state.","start":1393.84,"end":1398.78},{"id":101,"text":"Cool. So on the slide, we can think about this model where we have these dynamics. We don't know","start":1402.54,"end":1409.68},{"id":102,"text":"how the world is going to evolve. We can't directly observe, like how the power, we can't","start":1409.68,"end":1413.64},{"id":103,"text":"predict the future. So these dynamics are unknown, and these dynamics are independent","start":1413.64,"end":1419.92},{"id":104,"text":"of st-1 in this case, and that's known as the Markov property. Any questions on that?","start":1419.92,"end":1427.6},{"id":105,"text":"Yeah, so the question is, in practice, how many path observations do we need to infer","start":1428.3,"end":1432.06},{"id":106,"text":"the state? It is heavily domain-dependent. In a lot of robotics examples, you can often","start":1432.06,"end":1443.32},{"id":107,"text":"get away with just using the current sensor observations, but it depends a lot on what the","start":1443.32,"end":1448.76},{"id":108,"text":"sensors are. If you have tactile sensors, for example, those oftentimes don't contain","start":1448.76,"end":1454.34},{"id":109,"text":"as much information as vision observation, for example. And so how close you are to a table,","start":1454.34,"end":1459.62},{"id":110,"text":"you have no idea when you're not making contact. And then once you make contact, you know.","start":1459.76,"end":1463.62},{"id":111,"text":"So that's a lot more partially observable than an image, for example. But then if you have the","start":1463.78,"end":1469.96},{"id":112,"text":"images in addition to that, then that gives you a more complete representation.","start":1469.96,"end":1472.7},{"id":113,"text":"Yeah, so why is the reward function a function of both the state and the action and not just","start":1473.8,"end":1477.62},{"id":114,"text":"the state?","start":1477.62,"end":1477.96},{"id":115,"text":"One example of this is, we can go back to a robotics example.","start":1478.66,"end":1482.48},{"id":116,"text":"So say that you are a humanoid robot and you're trying to learn how to walk.","start":1482.7,"end":1486.24},{"id":117,"text":"And maybe one natural reward function is just how much forward progress have you made?","start":1487.8,"end":1492.44},{"id":118,"text":"So where is your body?","start":1492.5,"end":1493.8},{"id":119,"text":"and that would be kind of dependent on the state.","start":1493.8,"end":1495.36},{"id":120,"text":"One scenario where you might want the action is that scenario where if you don't want to be using too much energy, because you don't want to be, like, tensing up all the motors, for example, or I guess...","start":1496.51,"end":1507.51},{"id":121,"text":"it makes more sense. But if you don't want to be exerting too much, pushing too much energy into your motors, then you'll want to depend on the actions as well. And you could basically have some penalty on how much torque you're putting through the motors. So that's one example. In many cases, you can just depend on the state. But there are some examples where you want to kind of penalize taking too much action. Yeah, so the question is...","start":1507.88,"end":1529.86}],"notes":["本段讲解了观测与状态之间的关系，指出观测可能不包含状态的全部信息。当无法直接观察状态时，观测可能依赖于之前的观测和动作。例如，如果无法观察状态，那么当前观测O3不仅依赖于前一个观测O2和动作A2，还可能依赖于更早的观测O1。这种关系体现了部分可观测性（partially observable）的概念。","在强化学习中，观测（observation）通常被建模为状态（state）的函数，但观测可能不完全反映状态。因此，当状态不可观测时，需要通过观测序列来推断状态。这种情况下，观测序列可能包含历史信息，从而帮助恢复状态信息。","讲者通过机器人示例说明了观测与状态的关系。例如，在机器人行走任务中，观测可能仅包含当前传感器数据，而状态可能包含更多细节。如果传感器信息不完整，如触觉传感器，那么观测可能无法完全反映状态，从而导致部分可观测性。","讲者还提到，奖励函数可能依赖于状态和动作，而不仅仅是状态。例如，在机器人行走任务中，奖励函数可能不仅取决于机器人的位置（状态），还取决于其动作（如施加的扭矩）。这种设计可以用于惩罚不必要的动作，从而优化能量消耗。","讲者指出，奖励函数的设计取决于具体任务和环境。在某些情况下，仅依赖状态可能足够，但在其他情况下，需要考虑动作的影响。这种设计灵活性是强化学习模型的重要特征。","讲者通过机器人行走的例子说明了奖励函数的设计，强调了动作在奖励计算中的作用。这种设计可以用于优化能量效率，避免不必要的动作，从而提高系统的整体性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1356.4,"end":1529.86,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1356.4,"text":"Now, if you have observations instead of states, then things look a little bit different. And the way that we can think about observations is the observation is a function of this current state, and it may not contain all the information that's in the state. And so the observation at any given point in time for completeness, we'll draw each of them here. And then if you don't have access, if you can't observe the states,"},{"start":1386.86,"text":"That means now that O2, or sorry, O3, it's not just a function of O2 and A2,"},{"start":1393.84,"text":"it's actually also a function of O1 if you cannot observe the state."},{"start":1402.54,"text":"Cool. So on the slide, we can think about this model where we have these dynamics. We don't know"},{"start":1409.68,"text":"how the world is going to evolve. We can't directly observe, like how the power, we can't"},{"start":1413.64,"text":"predict the future. So these dynamics are unknown, and these dynamics are independent"},{"start":1419.92,"text":"of st-1 in this case, and that's known as the Markov property. Any questions on that?"},{"start":1428.3,"text":"Yeah, so the question is, in practice, how many path observations do we need to infer"},{"start":1432.06,"text":"the state? It is heavily domain-dependent. In a lot of robotics examples, you can often"},{"start":1443.32,"text":"get away with just using the current sensor observations, but it depends a lot on what the"},{"start":1448.76,"text":"sensors are. If you have tactile sensors, for example, those oftentimes don't contain"},{"start":1454.34,"text":"as much information as vision observation, for example. And so how close you are to a table,"},{"start":1459.76,"text":"you have no idea when you're not making contact. And then once you make contact, you know."},{"start":1463.78,"text":"So that's a lot more partially observable than an image, for example. But then if you have the"},{"start":1469.96,"text":"images in addition to that, then that gives you a more complete representation."},{"start":1473.8,"text":"Yeah, so why is the reward function a function of both the state and the action and not just"},{"start":1477.62,"text":"the state?"},{"start":1478.66,"text":"One example of this is, we can go back to a robotics example."},{"start":1482.7,"text":"So say that you are a humanoid robot and you're trying to learn how to walk."},{"start":1487.8,"text":"And maybe one natural reward function is just how much forward progress have you made?"},{"start":1492.5,"text":"So where is your body?"},{"start":1493.8,"text":"and that would be kind of dependent on the state."},{"start":1496.51,"text":"One scenario where you might want the action is that scenario where if you don't want to be using too much energy, because you don't want to be, like, tensing up all the motors, for example, or I guess..."},{"start":1507.88,"text":"it makes more sense. But if you don't want to be exerting too much, pushing too much energy into your motors, then you'll want to depend on the actions as well. And you could basically have some penalty on how much torque you're putting through the motors. So that's one example. In many cases, you can just depend on the state. But there are some examples where you want to kind of penalize taking too much action. Yeah, so the question is..."}],"speech_gaps":[],"frame":"../frames/v019/009.webp","frame_time":1368.4},{"title":"状态表示与观察的处理","segments":[{"id":135,"text":"Now, you could potentially try to include a history of LiDAR information to get that velocity information, and then represent your state as a three-second history, for example. This will represent a theme, which is that typically to handle observations, we'll use a little bit of history, and then that can form your state representation. It's a little bit ambiguous in this particular case, and it comes down to the details.","start":1863.62,"end":1891.5},{"id":136,"text":"Yeah, so the question is, in the robot example, if the reward is 1 if it's on the hook and 0 otherwise, how do you actually learn? Because if you don't actually ever do that at any point, then you'll have very little supervision signal. You'll just have 0 reward all the time.","start":1892.71,"end":1908.49},{"id":137,"text":"And so in that particular video, we actually showed the robot how to do it a couple times as initialization, and that helped it with what we'll call exploration. And if you have very sparse rewards, rewards that have very little signal and are not kind of nicely shaped towards the goal, then usually that kind of data might be important for jump-starting the reinforcement learning process.","start":1909.14,"end":1935.98},{"id":138,"text":"Cool, cool. Yeah, so if folks couldn't hear that, you'd have this state being something like the HTML and the URL, information about the web page and where you're at. The action would be interacting with it, and the reward would be whether or not some task was completed. Yeah, so the question is, is basically everything an observation because sensors may not be perfect? So you could always choose to model something as an observation if you're worried about sensor noise or something like that.","start":1937.07,"end":1964.06},{"id":139,"text":"there are large, in some ways potentially large downsides to it if you need to add a lot of history. And so sometimes we will kind of approximately approximate something as the state, even if it might be lacking information. Like maybe, I don't know, once every 10,000 times the sensor fails and gives you a black image or something like that. Even though that would technically be...","start":1964.95,"end":1990.89},{"id":140,"text":"like an observation case, you might still use it as a state representation because of how it affects the algorithms. Yeah, so if I understand correctly, you're asking for observations it could either be like everything currently or it could be a delta from the previous observation. Yeah, it would come out down to different trade-offs oftentimes.","start":1991.95,"end":2010.85},{"id":141,"text":"If you are going to be including a lot of history, then compressing it by using deltas could potentially make a lot of sense. But once we get into policies, maybe it'll also become more clear. Okay, so now that we've talked about formulating the reinforcement learning problem, let's talk about actually representing behavior. So we want to map typically from states or observations to action.","start":2012.7,"end":2036.2}],"notes":["本段讨论了在强化学习中使用历史信息作为状态表示的利弊。讲者指出，虽然使用历史信息可以提供更丰富的状态表示，但需要考虑存储和计算成本。在某些情况下，即使传感器出现故障导致信息缺失，也可能仍然将其视为状态表示，因为这会影响算法的表现。","讲者提到，观察可以是当前所有信息，也可以是与前一观察的差异（delta）。这种选择取决于具体任务和算法需求，通常需要在信息完整性和计算效率之间进行权衡。","在机器人示例中，讲者强调了稀疏奖励的问题。如果奖励信号非常稀疏，那么在训练初期可能需要通过人工初始化来提供一些监督信号，以帮助算法更快地探索和学习。","讲者还提到，当传感器出现故障时，即使信息不完整，也可能将其视为状态表示。这表明在实际应用中，需要考虑传感器噪声和数据可靠性对状态表示的影响。","讲者指出，使用历史信息时，可以通过压缩（如使用delta）来减少计算负担。这种压缩方法在处理长期依赖或高维状态时可能特别有用。","最后，讲者提到，状态表示的选择通常取决于具体任务和算法需求，需要在信息完整性和计算效率之间进行权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1863.62,"end":2036.2,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1863.62,"text":"Now, you could potentially try to include a history of LiDAR information to get that velocity information, and then represent your state as a three-second history, for example. This will represent a theme, which is that typically to handle observations, we'll use a little bit of history, and then that can form your state representation. It's a little bit ambiguous in this particular case, and it comes down to the details."},{"start":1892.71,"text":"Yeah, so the question is, in the robot example, if the reward is 1 if it's on the hook and 0 otherwise, how do you actually learn? Because if you don't actually ever do that at any point, then you'll have very little supervision signal. You'll just have 0 reward all the time."},{"start":1909.14,"text":"And so in that particular video, we actually showed the robot how to do it a couple times as initialization, and that helped it with what we'll call exploration. And if you have very sparse rewards, rewards that have very little signal and are not kind of nicely shaped towards the goal, then usually that kind of data might be important for jump-starting the reinforcement learning process."},{"start":1937.07,"text":"Cool, cool. Yeah, so if folks couldn't hear that, you'd have this state being something like the HTML and the URL, information about the web page and where you're at. The action would be interacting with it, and the reward would be whether or not some task was completed. Yeah, so the question is, is basically everything an observation because sensors may not be perfect? So you could always choose to model something as an observation if you're worried about sensor noise or something like that."},{"start":1964.95,"text":"there are large, in some ways potentially large downsides to it if you need to add a lot of history. And so sometimes we will kind of approximately approximate something as the state, even if it might be lacking information. Like maybe, I don't know, once every 10,000 times the sensor fails and gives you a black image or something like that. Even though that would technically be..."},{"start":1991.95,"text":"like an observation case, you might still use it as a state representation because of how it affects the algorithms. Yeah, so if I understand correctly, you're asking for observations it could either be like everything currently or it could be a delta from the previous observation. Yeah, it would come out down to different trade-offs oftentimes."},{"start":2012.7,"text":"If you are going to be including a lot of history, then compressing it by using deltas could potentially make a lot of sense. But once we get into policies, maybe it'll also become more clear. Okay, so now that we've talked about formulating the reinforcement learning problem, let's talk about actually representing behavior. So we want to map typically from states or observations to action."}],"speech_gaps":[],"frame":"../frames/v019/012.webp","frame_time":1875.62}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
