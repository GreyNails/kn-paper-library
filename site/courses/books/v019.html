</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 1 课程介绍（Class Intro） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v019.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v019","title":"Lecture 1 课程介绍（Class Intro）","course":"强化学习","pages":[{"title":"课程介绍与强化学习概述","segments":[{"id":0,"text":"Welcome to Deep Reinforcement Learning or CS224R.","zh":"欢迎来到深度强化学习或CS224R课程。","start":5.2,"end":8.78},{"id":1,"text":"I'm really excited to be teaching it again this quarter. My name is Chelsea. I am the instructor of the course. I'm an assistant professor here at Stanford. I do research on reinforcement learning, robotics, and language models, and a variety of other topics. So the plan for today. So we're going to be covering the course goals and some logistics. Hopefully this will be fairly short because all this information is available online. After that, we'll be talking about why study deep reinforcement learning and actually get into some technical content.","zh":"我非常兴奋能再次教授这门课。我叫切尔西。我是这门课的讲师。我在斯坦福大学担任助理教授。我的研究领域包括强化学习、机器人学和语言模型，以及许多其他主题。那么今天我们的计划。我们将介绍课程目标和一些教学安排。希望这会比较简短，因为所有这些信息都可以在线获取。之后，我们将讨论为什么学习深度强化学习，并实际进入一些技术内容。","start":10.7,"end":38.08},{"id":2,"text":"on modeling behavior and reinforcement learning. The key learning goals for today is what even is deep reinforcement learning? How do we go about actually representing behavior in a way that we can optimize behavior? And how do we formulate a reinforcement learning problem? So what do we mean by deep reinforcement learning? So first, for reinforcement learning, we mean decision-making problems.","zh":"关于行为建模和强化学习。今天的关键学习目标是：什么是深度强化学习？我们如何以一种可以优化行为的方式表示行为？以及我们如何将强化学习问题进行建模？那么，我们所说的深度强化学习是什么意思？首先，对于强化学习，我们指的是决策问题。","start":38.54,"end":61.38},{"id":3,"text":"And these are problems where a system needs to make multiple decisions based on a stream of information. So it'll observe and then take an action based on that observation and then observe again and take another action.","zh":"这些问题需要系统根据信息流做出多个决策。因此，系统会观察，然后根据观察结果采取行动，接着再次观察并采取另一个行动。","start":62.12,"end":72.8},{"id":4,"text":"and we'll be studying those kinds of problems as well as the solutions to those kinds of problems.","zh":"我们将研究这类问题以及解决这类问题的方法。","start":74.12,"end":78.78},{"id":5,"text":"And that includes things like imitation learning, model-free and model-based reinforcement learning,","zh":"这包括模仿学习、无模型和基于模型的强化学习，","start":79.0,"end":83.46},{"id":6,"text":"offline and online reinforcement learning, multitask and meta-reinforcement learning,","zh":"离线和在线强化学习、多任务和元强化学习，","start":83.8,"end":88.22},{"id":7,"text":"as well as a little bit of an extra focus on reinforcement learning for large language models","zh":"以及对大型语言模型的强化学习稍作额外关注","start":88.48,"end":93.72},{"id":8,"text":"and reinforcement learning for robots. So that's kind of the crux of the reinforcement learning","zh":"以及机器人领域的强化学习。这就是强化学习的核心部分","start":93.72,"end":98.72},{"id":9,"text":"learning aspect of the course. And we'll be emphasizing solutions that scale to deep neural","zh":"课程中我们将强调适用于深度神经网络的解决方案","start":98.72,"end":104.78},{"id":10,"text":"networks. And we'll be spending a lot less time on solutions that don't pertain to deep","zh":"我们将花较少的时间在不涉及深度神经网络的解决方案上","start":104.78,"end":109.06},{"id":11,"text":"neural networks. Now, how does deep RL differ from other machine learning topics? So, hopefully","zh":"那么深度强化学习与其他机器学习主题有什么不同呢？希望","start":109.06,"end":117.56},{"id":12,"text":"a lot of you have some experience with machine learning. And oftentimes in machine learning,","zh":"你们中有很多人已经有一些机器学习的经验","start":117.56,"end":122.34},{"id":13,"text":"learning, you'll have some kind of input-output pair, x, y, and you'll have a bunch of these","zh":"在机器学习中，你通常会有一些输入输出对，x，y，并且你会有一些这样的数据集","start":122.34,"end":128.0},{"id":14,"text":"in some data set. And then your goal is to learn something that can map from x to y.","zh":"然后你的目标是学习一个能够从x映射到y的模型","start":128.62,"end":135.62},{"id":15,"text":"And another thing is that we kind of typically assume in these data sets is that these data","zh":"在这些数据集中，我们通常假设的是这些数据","start":137.28,"end":142.9},{"id":16,"text":"points are sampled from some distribution and are sampled in an independent and identical","zh":"点是从某个分布中采样的，并且是以独立且同分布的方式进行采样的","start":142.9,"end":148.94},{"id":17,"text":"And we typically assume in these data sets is that these data points are sampled from some distribution and are sampled in an independent and identical way from that distribution.","zh":"在这些数据集中，我们通常假设这些数据点是从某个分布中独立且同分布地采样的","start":148.94,"end":151.18},{"id":18,"text":"And this is actually where reinforcement learning differs quite a bit.","zh":"实际上，强化学习在这一点上与监督学习有很大的不同","start":152.66,"end":156.28},{"id":19,"text":"So in supervised learning, we have labeled data, we learn the function, we're directly","zh":"所以在监督学习中，我们有带标签的数据，我们学习函数，我们被告知要输出什么，我们基本上被告诉了给定输入的答案","start":156.4,"end":159.9},{"id":20,"text":"told what to output, we're kind of told what the answer is for that given input.","zh":"我们被告知要输出什么，我们基本上被告诉了给定输入的答案","start":159.9,"end":164.7}],"notes":["本段介绍了强化学习的基本概念，强调了它与监督学习的不同之处。强化学习涉及决策过程，系统需要根据信息流做出多个决策，观察后采取行动，再观察并再次行动。课程目标包括理解深度强化学习的定义、如何表示行为以优化行为，以及如何构建强化学习问题。","课程内容涵盖模仿学习、无模型和有模型强化学习、离线和在线强化学习、多任务和元强化学习，以及针对大型语言模型和机器人的强化学习。课程重点放在能够扩展到深度神经网络的解决方案上，而减少对非深度神经网络解决方案的讨论。","深度强化学习与传统机器学习的不同之处在于数据的获取方式。在监督学习中，数据是输入-输出对，且数据点通常是从某个分布中独立且同等地采样。而在强化学习中，数据是通过与环境的交互动态生成的，没有明确的标签，而是通过奖励信号进行学习。","课程还提到，强化学习与监督学习在目标和方法上有显著差异。监督学习的目标是学习一个映射函数，将输入映射到输出，而强化学习的目标是学习一个策略，以最大化累积奖励。","在监督学习中，数据点通常假设是从某个分布中独立且同等地采样，而在强化学习中，数据是通过与环境的交互动态生成的，这使得强化学习的训练过程更加复杂。","课程强调了深度强化学习在处理复杂任务中的重要性，特别是在涉及大型语言模型和机器人应用的场景中，深度神经网络的使用是关键。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":164.7,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":5.2,"text":"Welcome to Deep Reinforcement Learning or CS224R."},{"start":10.7,"text":"I'm really excited to be teaching it again this quarter. My name is Chelsea. I am the instructor of the course. I'm an assistant professor here at Stanford. I do research on reinforcement learning, robotics, and language models, and a variety of other topics. So the plan for today. So we're going to be covering the course goals and some logistics. Hopefully this will be fairly short because all this information is available online. After that, we'll be talking about why study deep reinforcement learning and actually get into some technical content."},{"start":38.54,"text":"on modeling behavior and reinforcement learning. The key learning goals for today is what even is deep reinforcement learning? How do we go about actually representing behavior in a way that we can optimize behavior? And how do we formulate a reinforcement learning problem? So what do we mean by deep reinforcement learning? So first, for reinforcement learning, we mean decision-making problems."},{"start":62.12,"text":"And these are problems where a system needs to make multiple decisions based on a stream of information. So it'll observe and then take an action based on that observation and then observe again and take another action."},{"start":74.12,"text":"and we'll be studying those kinds of problems as well as the solutions to those kinds of problems."},{"start":79.0,"text":"And that includes things like imitation learning, model-free and model-based reinforcement learning,"},{"start":83.8,"text":"offline and online reinforcement learning, multitask and meta-reinforcement learning,"},{"start":88.48,"text":"as well as a little bit of an extra focus on reinforcement learning for large language models"},{"start":93.72,"text":"and reinforcement learning for robots. So that's kind of the crux of the reinforcement learning"},{"start":98.72,"text":"learning aspect of the course. And we'll be emphasizing solutions that scale to deep neural"},{"start":104.78,"text":"networks. And we'll be spending a lot less time on solutions that don't pertain to deep"},{"start":109.06,"text":"neural networks. Now, how does deep RL differ from other machine learning topics? So, hopefully"},{"start":117.56,"text":"a lot of you have some experience with machine learning. And oftentimes in machine learning,"},{"start":122.34,"text":"learning, you'll have some kind of input-output pair, x, y, and you'll have a bunch of these"},{"start":128.62,"text":"in some data set. And then your goal is to learn something that can map from x to y."},{"start":137.28,"text":"And another thing is that we kind of typically assume in these data sets is that these data"},{"start":142.9,"text":"points are sampled from some distribution and are sampled in an independent and identical"},{"start":148.94,"text":"identical way from that to speed."},{"start":152.66,"text":"And this is actually where reinforcement learning differs quite a bit."},{"start":156.4,"text":"So in supervised learning, we have labeled data, we learn the function, we're directly"},{"start":159.9,"text":"told what to output, we're kind of told what the answer is for that given input."}],"speech_gaps":[],"frame":"../frames/v019/001.webp","frame_time":17.2},{"title":"强化学习课程介绍","segments":[{"id":21,"text":"and the inputs are iid sampled. Now in reinforcement learning the picture is a little bit different. So ultimately our goal is to learn behavior and we'll actually use different kind of notations to refer to inputs and outputs. So specifically our goal will be to map from states to actions and we'll refer to the function that we do that mapping as pi.","zh":"并且输入是独立同分布采样的。现在在强化学习中，情况略有不同。因此，我们的最终目标是学习行为，我们将使用不同种类的符号来表示输入和输出。具体来说，我们的目标是从状态映射到动作，并将执行这种映射的函数称为π。","start":165.88,"end":192.83},{"id":22,"text":"Unlike in supervised learning, we're not going to be directly told what the answer is. Our goal will actually be to learn this behavior from much more indirect feedback. And so in reinforcement learning, the goal is to learn this behavior, pi of a given s, and this will be from experience, and actually experience often drawn from the policy that you're learning or this function that you're learning.","zh":"与监督学习不同，我们不会直接被告知答案是什么。我们的目标实际上是通过更加间接的反馈来学习这种行为。因此，在强化学习中，目标是学习这种行为，即给定状态s的π，而这将来自于经验，并且经验通常是从你正在学习的策略或函数中获得的。","start":195.52,"end":217.01},{"id":23,"text":"And the data is not going to be sampled from a single distribution. It's actually going to be sampled in a way that actually depends on the policy or the function that you're currently learning. So these are the two big differences. And what I mean by behavior is this could include motor control, like controlling a robot. It could include a chatbot that is interacting with a person. It could be playing a game. It could be driving a car. It could be an agent that's interacting with the web and a wide range of other.","zh":"数据不会从单一分布中采样。实际上，数据的采样方式取决于你正在学习的策略或函数。因此，这是两个主要的不同之处。我所说的“行为”可以包括运动控制，例如控制机器人。它也可以包括与人交互的聊天机器人。它可以是玩游戏、驾驶汽车，也可以是与网络和其他广泛领域交互的代理。","start":218.24,"end":247.73},{"id":24,"text":"domain. So that's how reinforcement differs from typical machine learning. We don't have the ability to cover everything in deep reinforcement learning and so we're going to try to focus on the core concept behind deep reinforcement learning methods so that you can then use those core concepts to understand more advanced methods should you choose to dive deeper into the topic. We'll also focus on implementation of algorithms to get to the point where you feel comfortable implementing algorithms yourself.","zh":"领域。因此，强化学习与典型的机器学习有所不同。我们无法在深度强化学习中涵盖所有内容，因此我们将尝试专注于深度强化学习方法背后的核心概念，这样你就可以使用这些核心概念来理解更高级的方法，如果你选择深入研究该主题。我们还将专注于算法的实现，以达到你感到舒适地自己实现算法的程度。","start":248.3,"end":277.44},{"id":25,"text":"And we'll give examples in robotics, control, and language models, especially in lecture and in projects, but a lot of the techniques we'll generalize more broadly. And also just to focus on topics that we think are the most useful and the most exciting to cover. If you're interested in more theory and other applications that are kind of beyond some of these, CS234 can also be an excellent point.","zh":"我们将通过机器人、控制和语言模型的例子来说明，特别是在讲座和项目中，但我们将更广泛地概括许多技术。此外，我们还将专注于我们认为最有用且最令人兴奋的主题。如果你对更多理论和其他应用感兴趣，这些可能超出了上述内容，CS234也可以是一个很好的选择。","start":278.09,"end":302.94},{"id":26,"text":"Yeah, and then the core goal is really to be able to understand and implement existing and emerging methods in deep reinforcement learning. Cool. So why study deep reinforcement learning? I'll list out a number of things here, and then we'll dive into each one a little bit more. So one we already talked about is going beyond supervised example. And there's a lot of scenarios where AI model predictions have consequences.","zh":"是的，然后核心目标是真正能够理解和实现深度强化学习中的现有和新兴方法。很好。那么为什么要学习深度强化学习呢？我会列出一些内容，然后我们再逐一深入探讨。我们已经谈到的一个是超越监督学习的例子。在很多场景中，人工智能模型的预测会产生后果。","start":305.13,"end":329.09}],"notes":["本段讲解了强化学习与监督学习的主要区别，强调了强化学习中数据的采样方式依赖于当前正在学习的策略或函数，而不是从单一分布中采样。这与监督学习中数据通常来自固定分布不同，强化学习的数据是动态生成的，反映了学习过程本身。","课程目标是帮助学生理解并实现现有的和新兴的深度强化学习方法。这包括掌握核心概念，以便能够理解更高级的方法，并通过算法实现来加深理解。","课程内容将涵盖多个应用领域，如机器人、控制和语言模型，并通过讲座和项目进行具体示例。同时，课程会强调通用技术的广泛适用性，而不仅仅是特定领域的应用。","课程还提到，对于希望深入理论或探索其他应用的学生，CS234课程是一个很好的补充资源。这表明课程设计考虑到了不同学习者的需求和兴趣方向。","课程强调了深度强化学习的重要性，特别是在AI模型预测具有实际后果的场景中。这表明课程不仅关注技术实现，还关注其实际应用价值。","课程结构清晰，从介绍核心概念开始，逐步引导学生深入理解深度强化学习的原理和实现方法，为后续学习打下坚实基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":165.88,"end":329.09,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":165.88,"text":"and the inputs are iid sampled. Now in reinforcement learning the picture is a little bit different. So ultimately our goal is to learn behavior and we'll actually use different kind of notations to refer to inputs and outputs. So specifically our goal will be to map from states to actions and we'll refer to the function that we do that mapping as pi."},{"start":195.52,"text":"Unlike in supervised learning, we're not going to be directly told what the answer is. Our goal will actually be to learn this behavior from much more indirect feedback. And so in reinforcement learning, the goal is to learn this behavior, pi of a given s, and this will be from experience, and actually experience often drawn from the policy that you're learning or this function that you're learning."},{"start":218.24,"text":"And the data is not going to be sampled from a single distribution. It's actually going to be sampled in a way that actually depends on the policy or the function that you're currently learning. So these are the two big differences. And what I mean by behavior is this could include motor control, like controlling a robot. It could include a chatbot that is interacting with a person. It could be playing a game. It could be driving a car. It could be an agent that's interacting with the web and a wide range of other."},{"start":248.3,"text":"domain. So that's how reinforcement differs from typical machine learning. We don't have the ability to cover everything in deep reinforcement learning and so we're going to try to focus on the core concept behind deep reinforcement learning methods so that you can then use those core concepts to understand more advanced methods should you choose to dive deeper into the topic. We'll also focus on implementation of algorithms to get to the point where you feel comfortable implementing algorithms yourself."},{"start":278.09,"text":"And we'll give examples in robotics, control, and language models, especially in lecture and in projects, but a lot of the techniques we'll generalize more broadly. And also just to focus on topics that we think are the most useful and the most exciting to cover. If you're interested in more theory and other applications that are kind of beyond some of these, CS234 can also be an excellent point."},{"start":305.13,"text":"Yeah, and then the core goal is really to be able to understand and implement existing and emerging methods in deep reinforcement learning. Cool. So why study deep reinforcement learning? I'll list out a number of things here, and then we'll dive into each one a little bit more. So one we already talked about is going beyond supervised example. And there's a lot of scenarios where AI model predictions have consequences."}],"speech_gaps":[],"frame":"../frames/v019/002.webp","frame_time":177.88},{"title":"强化学习课程介绍","segments":[{"id":27,"text":"If we want to take into account those consequences, then we need a framework for thinking about those consequences and how to optimize the behavior with respect to those consequences. So, for example, if you listen to music on Spotify, for example, and the Spotify algorithm is recommending a song for you to play, that recommendation, or even actually just playing it directly for you, that recommendation has consequences such that the next time it recommends a song, it probably shouldn't recommend the same song or it might want to also stay within the same genre and so forth.","zh":"如果我们想要考虑这些后果，那么我们需要一个框架来思考这些后果以及如何根据这些后果来优化行为。例如，如果你在Spotify上听音乐，比如Spotify的算法为你推荐一首歌曲，这个推荐，甚至直接为你播放这首歌，这个推荐都有后果，使得下一次它推荐歌曲时，可能不应该推荐同样的歌曲，或者它可能希望也保持在相同的流派等等。","start":332.27,"end":361.05},{"id":28,"text":"And so if we want to think about developing AI systems that can take into account those consequences, that's what deep reinforcement learning allows us to do. There's also scenarios where direct supervision isn't available. So for example, if you have a coding assistant like Cursor or Copilot","zh":"因此，如果我们想要思考开发能够考虑这些后果的AI系统，这就是深度强化学习允许我们做的事情。还有其他场景中直接监督不可用。例如，如果你有一个代码助手，如Cursor或Copilot，","start":361.53,"end":379.98},{"id":29,"text":"and you want to give it feedback saying, like, that did a great job there or did a poor job there, that supervision is not the output. It's a more indirect supervision. And learning from that sort of indirect supervision or really any sort of objective can be formulated as a reinforcement learning problem. So it's a lot more flexible than supervised learning. Reinforcement learning is also widely used and deployed in a number of performant AI systems.","zh":"你想要给它反馈，比如它在那里做得很好，或者做得不好，这种监督并不是输出结果。它是一种更间接的监督。从这种间接监督或任何其他目标中学习都可以被表述为一个强化学习问题。因此，它比监督学习更加灵活。强化学习也被广泛应用于许多高性能的AI系统中。","start":380.42,"end":406.51},{"id":30,"text":"Also, learning from experience, in my opinion, seems kind of fundamental to intelligence. And so just from a kind of a philosophical level in terms of building intelligent machines, figuring out how to actually develop algorithms that can learn from their own experience seems pretty fundamental to that. And it's fundamental to be able to actually make discoveries of new things rather than just mimicking the data.","zh":"此外，我认为从经验中学习似乎对智能来说是相当根本的。因此，从构建智能机器的哲学角度来看，弄清楚如何开发能够从自身经验中学习的算法似乎是非常根本的。而且，要真正发现新事物，而不是仅仅模仿数据，这一点也是根本的。","start":408.94,"end":431.06},{"id":31,"text":"And then lastly, there's also some pretty exciting open research problems as well. And so it makes it a pretty exciting area to do research on. And then lastly, I was also actually last weekend, I was telling a friend that I was making slides on why study deep reinforcement learning and how I was making several slides on it. And they were like, well, why do you this? This question doesn't seem very hard. The answer is just one million in total compensation from OpenAI.","zh":"最后，还有一些非常令人兴奋的开放研究问题。因此，这使得研究这个领域变得相当令人兴奋。此外，我上周六还告诉一个朋友，我正在制作幻灯片来解释为什么学习深度强化学习，以及我制作了多张关于这个主题的幻灯片。他们问，你为什么这么做？这个问题看起来并不难。答案是，从OpenAI获得的总报酬是一百万。","start":433.24,"end":459.77},{"id":32,"text":"So maybe if you're not motivated by one through four, this can be some motivation. Okay. So diving into beyond supervised learning, decision-making problems are everywhere and can't be directly formulated as supervised learning. Any sort of AI agent is captured by this. Also, if you want your AI system to interact with people, like chatbots or recommenders, or scenarios where decisions will affect future outcomes or observations, these kind of feedback loops, these are reinforcement learning problems.","zh":"也许如果你不是被前面的1到4点所激励，这可以成为一些激励。好的，深入探讨超越监督学习的领域，决策问题无处不在，无法直接表述为监督学习问题。任何类型的AI代理都受到这一概念的涵盖。此外，如果你希望你的AI系统能够与人互动，比如聊天机器人或推荐系统，或者在决策会影响未来结果或观察的场景中，这些反馈循环，都是强化学习问题。","start":460.3,"end":490.11}],"notes":["本段介绍了强化学习的基本概念，即通过考虑行为的后果来优化决策过程。课程中提到，强化学习可以用于开发能够考虑后果的AI系统，例如Spotify推荐系统，其中推荐的歌曲会影响后续的推荐结果。此外，强化学习适用于没有直接监督的情况，如代码助手Cursor或Copilot，它们通过间接反馈进行学习。","强化学习比监督学习更灵活，因为它可以处理各种间接监督或目标。课程中提到，强化学习被广泛应用于高性能AI系统中，例如推荐系统和聊天机器人。此外，学习从经验中获取知识被认为是智能的核心，这使得强化学习在构建智能机器方面具有重要地位。","课程还提到，强化学习是一个充满研究机会的领域，存在许多开放性问题。例如，课程中提到作者在周末制作了关于学习深度强化学习的幻灯片，并提到OpenAI提供的高额报酬作为学习动机。这表明强化学习不仅在理论上有价值，在实际应用中也具有重要性。","强化学习适用于任何需要决策并影响未来结果的场景，例如与人类互动的AI系统（如聊天机器人或推荐系统）。这些系统通过反馈循环进行学习，而强化学习正是处理这类问题的合适方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":332.27,"end":490.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":332.27,"text":"If we want to take into account those consequences, then we need a framework for thinking about those consequences and how to optimize the behavior with respect to those consequences. So, for example, if you listen to music on Spotify, for example, and the Spotify algorithm is recommending a song for you to play, that recommendation, or even actually just playing it directly for you, that recommendation has consequences such that the next time it recommends a song, it probably shouldn't recommend the same song or it might want to also stay within the same genre and so forth."},{"start":361.53,"text":"And so if we want to think about developing AI systems that can take into account those consequences, that's what deep reinforcement learning allows us to do. There's also scenarios where direct supervision isn't available. So for example, if you have a coding assistant like Cursor or Copilot,"},{"start":380.42,"text":"and you want to give it feedback saying, like, that did a great job there or did a poor job there, that supervision is not the output. It's a more indirect supervision. And learning from that sort of indirect supervision or really any sort of objective can be formulated as a reinforcement learning problem. So it's a lot more flexible than supervised learning. Reinforcement learning is also widely used and deployed in a number of performant AI systems."},{"start":408.94,"text":"Also, learning from experience, in my opinion, seems kind of fundamental to intelligence. And so just from a kind of a philosophical level in terms of building intelligent machines, figuring out how to actually develop algorithms that can learn from their own experience seems pretty fundamental to that. And it's fundamental to be able to actually make discoveries of new things rather than just mimicking the data."},{"start":433.24,"text":"And then lastly, there's also some pretty exciting open research problems as well. And so it makes it a pretty exciting area to do research on. And then lastly, I was also actually last weekend, I was telling a friend that I was making slides on why study deep reinforcement learning and how I was making several slides on it. And they were like, well, why do you this? This question doesn't seem very hard. The answer is just one million in total compensation from OpenAI."},{"start":460.3,"text":"So maybe if you're not motivated by one through four, this can be some motivation. Okay. So diving into beyond supervised learning, decision-making problems are everywhere and can't be directly formulated as supervised learning. Any sort of AI agent is captured by this. Also, if you want your AI system to interact with people, like chatbots or recommenders, or scenarios where decisions will affect future outcomes or observations, these kind of feedback loops, these are reinforcement learning problems."}],"speech_gaps":[],"frame":"../frames/v019/003.webp","frame_time":344.27},{"title":"强化学习的应用与实例","segments":[{"id":33,"text":"And then, yeah, like I mentioned before, if you don't have labels and your objective isn't just accuracy or it's non-differentiable, these are scenarios where reinforcement learning is useful. Now, I mentioned that DeepRL is used in a variety of different performance systems. What am I talking about there? Two examples of legged robots that have learned behavior with reinforcement learning. In this case, reinforcement learning in simulation and then transferred to the real world.","zh":"然后，正如我之前提到的，如果你没有标签，而且你的目标不仅仅是准确率，或者目标是非可微的，这些就是强化学习有用的情景。我提到过深度强化学习被用于各种不同的性能系统中。我指的是什么？这里有两个例子，是使用强化学习学习行为的腿式机器人。在这种情况下，强化学习是在模拟环境中进行的，然后转移到现实世界中。","start":491.19,"end":517.83},{"id":34,"text":"So you can get some cool stuff like puppy robots and dancing humanoids. And these are actually like real robots in the real world, policies that were trained with deep reinforcement learning. Beyond legged robots and dancing, you can also get robots that can manipulate with arms to do taps using, in this case, imitation learning, but still within the scope of this course.","zh":"因此，你可以得到一些很酷的东西，比如小狗机器人和跳舞的人形机器人。实际上，这些都是现实世界中的真实机器人，其策略是通过深度强化学习训练得到的。除了腿式机器人和跳舞之外，你还可以得到能够使用手臂进行操作的机器人，例如用手指敲击，这种情况使用的是模仿学习，但仍然在本课程的范围内。","start":518.29,"end":541.26},{"id":35,"text":"So the left is a robot that is unloading laundry and folding the laundry. On the right is a robot that can fold some simple origami. So some pretty cool stuff you can do with these kinds of methods. You can also learn to play complex games. So several years ago, DeepMind used deep reinforcement learning to train a system to play the game of Go.","zh":"左边是一个正在卸下衣物并折叠衣物的机器人，右边是一个能够折叠简单折纸的机器人。因此，你可以用这些方法做一些相当酷的事情。你还可以学习玩复杂的电子游戏。几年前，DeepMind 使用深度强化学习训练了一个系统来玩围棋游戏。","start":541.79,"end":569.63},{"id":36,"text":"And it actually defeated the champion of Go, defeated Lee Sedol, which was really impressive in its own right. And another really cool thing about it was kind of coming back to this discovery talent of AI systems. There was this move that surprised everyone that was an expert in Go. It was called Move 37. And it kind of discovered a strategy that humans previously hadn't thought of before.","zh":"它实际上击败了围棋冠军，击败了李世石，这本身就很令人印象深刻。另一个很酷的地方是，这再次体现了人工智能系统发现才能的能力。有一个棋步让所有围棋专家都感到惊讶，被称为第37步。它发现了一种人类之前未曾想到的策略。","start":570.26,"end":595.42},{"id":37,"text":"And so this is an example of how reinforcement learning can be a tool to discover new solutions. And this might be useful beyond games, but if we want to, for example, discover curious diseases or discover things that require experimentation, it provides a tool for doing those kinds of things. And it's not just robots and games. So nearly all modern language models use some form of RL for post-training, especially for more advanced reasoning as well.","zh":"因此，这是一个强化学习如何作为发现新解决方案的工具的例子。这可能不仅限于游戏，如果我们想要发现好奇的疾病或需要实验的东西，它提供了一种进行这些工作的工具。而不仅仅是机器人和游戏。几乎所有现代语言模型在微调阶段都会使用某种形式的强化学习，尤其是在更高级的推理方面。","start":595.95,"end":624.01},{"id":38,"text":"There's also research on traffic control using reinforcement learning and finding ways to insert cars into human-driven cars in order to increase the throughput on different roads. Research on training generative models with reinforcement learning. In this case, for example, trying to make the generations adhere to a particular prompt. So what these are showing is on the left, if you ask the base generative model,","zh":"也有研究使用强化学习进行交通控制，并寻找方法将车辆插入人类驾驶的车辆中，以提高不同道路上的通行量。关于使用强化学习训练生成模型的研究。在这种情况下，例如，尝试使生成的内容符合特定的提示。因此，这些研究展示的是在左边，如果你询问基础生成模型，","start":625.66,"end":652.85}],"notes":["本段介绍了强化学习在没有标签数据或目标函数不可微的情况下适用的场景，并提到深度强化学习（DeepRL）在多种性能系统中的应用，如腿部机器人和舞蹈人形机器人。这些机器人通过仿真环境训练后，再转移到现实世界中。","课堂中提到，强化学习不仅用于机器人控制，还用于复杂游戏如围棋的训练。DeepMind使用深度强化学习训练系统击败了围棋冠军李世石，展示了AI在发现新策略方面的潜力。","强化学习还可以用于发现新解决方案，例如在医学研究或需要实验的领域。此外，现代语言模型在训练后也使用强化学习，特别是在高级推理任务中。","课堂还提到强化学习在交通控制和生成模型训练中的应用，例如通过强化学习优化交通流量，以及训练生成模型使其符合特定提示。","这些例子说明了强化学习的广泛应用，从机器人控制到游戏、语言模型和交通优化，展示了其作为发现新策略和优化系统的重要工具。","课堂强调了强化学习在不同领域的潜力，包括发现新策略、优化系统性能以及在复杂任务中的应用，如语言模型的训练和交通控制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":491.19,"end":652.85,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":491.19,"text":"And then, yeah, like I mentioned before, if you don't have labels and your objective isn't just accuracy or it's non-differentiable, these are scenarios where reinforcement learning is useful. Now, I mentioned that DeepRL is used in a variety of different performance systems. What am I talking about there? Two examples of legged robots that have learned behavior with reinforcement learning. In this case, reinforcement learning in simulation and then transferred to the real world."},{"start":518.29,"text":"So you can get some cool stuff like puppy robots and dancing humanoids. And these are actually like real robots in the real world, policies that were trained with deep reinforcement learning. Beyond legged robots and dancing, you can also get robots that can manipulate with arms to do taps using, in this case, imitation learning, but still within the scope of this course."},{"start":541.79,"text":"So the left is a robot that is unloading laundry and folding the laundry. On the right is a robot that can fold some simple origami. So some pretty cool stuff you can do with these kinds of methods. You can also learn to play complex games. So several years ago, DeepMind used deep reinforcement learning to train a system to play the game of Go."},{"start":570.26,"text":"And it actually defeated the champion of Go, defeated Lee Sedol, which was really impressive in its own right. And another really cool thing about it was kind of coming back to this discovery talent of AI systems. There was this move that surprised everyone that was an expert in Go. It was called Move 37. And it kind of discovered a strategy that humans previously hadn't thought of before."},{"start":595.95,"text":"And so this is an example of how reinforcement learning can be a tool to discover new solutions. And this might be useful beyond games, but if we want to, for example, discover curious diseases or discover things that require experimentation, it provides a tool for doing those kinds of things. And it's not just robots and games. So nearly all modern language models use some form of RL for post-training, especially for more advanced reasoning as well."},{"start":625.66,"text":"There's also research on traffic control using reinforcement learning and finding ways to insert cars into human-driven cars in order to increase the throughput on different roads. Research on training generative models with reinforcement learning. In this case, for example, trying to make the generations adhere to a particular prompt. So what these are showing is on the left, if you ask the base generative model,"}],"speech_gaps":[],"frame":"../frames/v019/004.webp","frame_time":503.19},{"title":"强化学习的课程介绍与示例","segments":[{"id":39,"text":"to make a picture of a dolphin riding a bike, it'll give you this, which is not a very good picture, and then you can optimize with reinforcement learning to get a picture that is actually following the prompt more effectively, and likewise for other prompts as well. And this also is being used for chip design. This is a paper that designed chips that are used in Google's production TPU, which is also pretty useful.","zh":"要生成一张海豚骑自行车的图片，它会给你这样的结果，这并不是一个非常好的图片，然后你可以使用强化学习进行优化，从而得到一个更有效地遵循提示的图片，同样适用于其他提示。这种方法也被用于芯片设计。这是一篇设计用于谷歌生产TPU的芯片的论文，这同样非常有用。","start":653.4,"end":680.06},{"id":40,"text":"Great. So those are a few examples. There's a number of others I didn't cover as well. The next thing that I mentioned in terms of studying deep RLs, it kind of seems somewhat fundamental to intelligence. And for this, I want to tell a little bit of a story, which is that when I was starting my PhD, right after I graduated undergrad, I joined a lab that was looking at reinforcement learning for robots. And right next to where I was sitting was this robot here.","zh":"很好。这些是几个例子。还有一些我没有提到的其他例子。在研究深度强化学习方面，我提到的这一点似乎在智能方面具有某种根本性。为此，我想讲一个小故事，那就是在我刚毕业之后，我加入了一个实验室，该实验室正在研究用于机器人的强化学习。而我坐的位置旁边就是这个机器人。","start":682.52,"end":711.29},{"id":41,"text":"Oftentimes there was a postdoc in the lab who was running experiments with reinforcement learning, and so I would look over at the robot and it would be doing things like this. And the thing that really kind of fascinated me about watching this robot is you can actually see it learning over time. And at the beginning it knew nothing about how to, for example, insert and kind of assemble these two parts of a toy airplane, and at the end it's actually able to do it quite performantly. This is like really, really cool. You can actually see it learning from its own experience.","zh":"实验室里经常有博士后在运行强化学习的实验，所以我经常看着这个机器人，它会做一些这样的事情。真正让我着迷的是，你可以看到它随着时间的推移在学习。一开始它对如何例如插入和组装玩具飞机的两个部分一无所知，但到了最后，它实际上能够非常高效地完成这些任务。这真的很酷。你可以真正看到它从自己的经验中学习。","start":713.5,"end":742.21},{"id":42,"text":"in the real world. So essentially, reinforcement learning enables this kind of ability to get better with practice that isn't present in other machine learning systems. Now, there is one caveat to this, which is that this particular robot had its eyes closed. It wasn't using a camera, essentially.","zh":"在现实世界中。因此，强化学习使得这种通过练习而不断进步的能力成为可能，而这种能力在其他机器学习系统中并不存在。不过，这里有一个需要注意的地方，就是这个机器人当时是闭着眼睛的，它并没有使用摄像头。","start":743.08,"end":758.85},{"id":43,"text":"And that seemed like a really fundamental limitation to me. And so I actually kind of then worked with the postdoc on a follow-up project with vision, with cameras, and I was able to, in this case, then learn in the real world how to insert the red block into the shapefording cube. And again here, with experience, it's able to get better and better as it practices the task over and over again. And then after the learning process, it's...","zh":"这对我来说似乎是一个非常根本的限制。因此，我实际上与博士后合作进行了一项后续项目，涉及视觉和摄像头，并且我能够在这个案例中，在现实世界中学习如何将红色积木插入形状匹配的立方体中。同样地，随着经验的积累，它在反复练习任务的过程中能够变得越来越好。然后在学习过程结束后，它……","start":760.09,"end":790.76},{"id":44,"text":"So it's still learning, still improving. It ends up getting a success rate, I think, around 95 or 100% success at the end. And then I can hold the block out, or at least a young version of me can hold the block out for the robot, and the robot can then put the right block into the same currency. Now, these are very simple tasks. This was, in some ways, a long time ago. And now we have robots that can fold laundry and do dancing and so forth.","zh":"它仍然在学习，仍然在改进。最终，它取得了大约95%或100%的成功率。然后我可以将积木拿出来，或者至少是我年轻时的我可以为机器人拿出发块，机器人随后就能将正确的积木放入相同的立方体中。这些是非常简单的任务。从某种意义上说，这已经很久以前的事情了。而现在我们已经有机器人能够叠衣服、跳舞等等。","start":791.2,"end":820.21}],"notes":["本段介绍了强化学习在实际应用中的例子，如生成符合提示的图像和芯片设计。强化学习通过优化过程使系统能够更好地遵循指令，这在图像生成和芯片设计中都有体现。","讲者提到自己在博士期间参与了一个关于机器人强化学习的实验室项目，观察到机器人通过经验学习完成任务的过程，这展示了强化学习在实际环境中的学习能力。","讲者指出，机器人在没有视觉输入的情况下也能学习，但这种能力存在局限性，因此后续项目引入了视觉系统以提升学习效果。","机器人通过反复练习任务，逐渐提高成功率，最终达到95%或100%的成功率，这说明强化学习在实际任务中的有效性和可扩展性。","讲者提到这些任务虽然简单，但展示了强化学习的潜力，现在机器人已经能够完成更复杂的任务，如叠衣服和跳舞。","这些例子说明了强化学习在现实世界中的应用价值，以及其在智能系统发展中的重要性。"],"formulas":[],"uncertainties":["shapefording cube"],"diagram":"none","start":653.4,"end":820.21,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":653.4,"text":"to make a picture of a dolphin riding a bike, it'll give you this, which is not a very good picture, and then you can optimize with reinforcement learning to get a picture that is actually following the prompt more effectively, and likewise for other prompts as well. And this also is being used for chip design. This is a paper that designed chips that are used in Google's production TPU, which is also pretty useful."},{"start":682.52,"text":"Great. So those are a few examples. There's a number of others I didn't cover as well. The next thing that I mentioned in terms of studying deep RLs, it kind of seems somewhat fundamental to intelligence. And for this, I want to tell a little bit of a story, which is that when I was starting my PhD, right after I graduated undergrad, I joined a lab that was looking at reinforcement learning for robots. And right next to where I was sitting was this robot here."},{"start":713.5,"text":"Oftentimes there was a postdoc in the lab who was running experiments with reinforcement learning, and so I would look over at the robot and it would be doing things like this. And the thing that really kind of fascinated me about watching this robot is you can actually see it learning over time. And at the beginning it knew nothing about how to, for example, insert and kind of assemble these two parts of a toy airplane, and at the end it's actually able to do it quite performantly. This is like really, really cool. You can actually see it learning from its own experience."},{"start":743.08,"text":"in the real world. So essentially, reinforcement learning enables this kind of ability to get better with practice that isn't present in other machine learning systems. Now, there is one caveat to this, which is that this particular robot had its eyes closed. It wasn't using a camera, essentially."},{"start":760.09,"text":"And that seemed like a really fundamental limitation to me. And so I actually kind of then worked with the postdoc on a follow-up project with vision, with cameras, and I was able to, in this case, then learn in the real world how to insert the red block into the shapefording cube. And again here, with experience, it's able to get better and better as it practices the task over and over again. And then after the learning process, it's..."},{"start":791.2,"text":"So it's still learning, still improving. It ends up getting a success rate, I think, around 95 or 100% success at the end. And then I can hold the block out, or at least a young version of me can hold the block out for the robot, and the robot can then put the right block into the same currency. Now, these are very simple tasks. This was, in some ways, a long time ago. And now we have robots that can fold laundry and do dancing and so forth."}],"speech_gaps":[],"frame":"../frames/v019/005.webp","frame_time":665.4},{"title":"强化学习课程介绍与研究挑战","segments":[{"id":45,"text":"But one of the reasons why I like showing these videos is they really show the reinforcement learning process in the real world and the ability to improve with practice. At the same time, there's also a ton of exciting research problems that are open. And so if you're someone who's excited about doing research, there's challenges like, how does this robot learn to represent what is good for the task?","zh":"但其中一个我喜欢展示这些视频的原因是，它们真的展示了强化学习在现实世界中的过程以及通过练习改进的能力。同时，也存在大量令人兴奋的研究问题尚未解决。因此，如果你对从事研究感到兴奋，就会面临诸如‘这个机器人如何学习表示对任务有益的内容？’这样的挑战。","start":823.23,"end":842.71},{"id":46,"text":"Or how does an agent generalize its behavior not just to one scenario, but to many different scenarios? And can we apply such a system at scale with large diverse data sets and transfer from other paths and other goals? And can we use reinforcement learning to learn long horizon paths, like cooking a meal or solving a really hard math problem?","zh":"或者，智能体如何将其行为泛化，不仅适用于一个场景，还能适用于许多不同的场景？我们能否在大规模、多样化的数据集上应用这样的系统，并从其他路径和目标中进行迁移？我们能否利用强化学习来学习长期路径，例如烹饪一顿饭或解决一个非常困难的数学问题？","start":844.18,"end":861.24},{"id":47,"text":"Or can robots practice fully autonomously? And for this last point, I showed you some videos of","zh":"或者，机器人是否能够完全自主地进行练习？对于这个最后的要点，我向你们展示了一些强化学习的视频。","start":862.41,"end":867.33},{"id":48,"text":"reinforcement learning. That's not actually always what it looks like.","zh":"强化学习并不总是看起来像这样。","start":867.33,"end":870.83},{"id":49,"text":"So sometimes if you run reinforcement learning on a robot, it looks more like this, where the robot is trying to hit the","zh":"有时如果你在机器人上运行强化学习，它看起来更像是这样，其中机器人试图将曲棍球盘击入球门。","start":870.83,"end":875.09},{"id":50,"text":"hockey puck into the goal. And every time the robot attempts the task, it then kind of needs","zh":"每次机器人尝试执行任务时，它都需要重新开始并再次尝试。而机器人实际上并不知道如何撤销任务。","start":875.09,"end":881.39},{"id":51,"text":"to start over and reattempt it. And the robot doesn't actually know how to undo the task.","zh":"这就是我的朋友叶夫根。你可能会注意到，叶夫根实际上比机器人做了更多的工作。","start":881.39,"end":885.51},{"id":52,"text":"And this is my friend Yevgen. You might notice that Yevgen is actually doing more work than what the","zh":"而且这位是我的朋友叶夫根。你可能会注意到，叶夫根实际上比他所做的事情要付出更多的努力","start":885.51,"end":889.97},{"id":53,"text":"robot is doing, which doesn't quite seem like the right way of doing things.","zh":"机器人所做的事，看起来并不是做事情的正确方式。","start":889.97,"end":894.27},{"id":54,"text":"And it's not practical to collect a lot of data this way.","zh":"以这种方式收集大量数据并不实际。","start":894.29,"end":896.27},{"id":55,"text":"And along all these topics, these are some of the topics that we'll be covering in this","zh":"在这些话题中，这些是我们将在本课程中也将涉及的一些主题。","start":899.75,"end":903.59},{"id":56,"text":"course as well.","zh":"我们将在这门课程中讨论奖励学习以及如何表示不同的奖励。","start":903.59,"end":904.07},{"id":57,"text":"So we'll be talking about reward learning and how to represent different rewards.","zh":"我们将讨论离线强化学习、多任务强化学习和元强化学习、层次结构与推理，以及无重置强化学习。","start":904.17,"end":907.51},{"id":58,"text":"We'll be talking about offline RL, multitask RL and meta RL, hierarchy and reasoning, and","zh":"很酷。","start":907.71,"end":913.59},{"id":59,"text":"reset-free RL as well.","zh":"无需重置的强化学习。","start":913.59,"end":915.51},{"id":60,"text":"Cool.","zh":"不错。","start":917.87,"end":918.27},{"id":61,"text":"Cool. So, any questions on why Deep RL is interesting to study? Yeah. So, the question","zh":"好。那么，关于为什么深度强化学习值得研究，大家有什么问题吗？是的。那么，问题是","start":918.27,"end":926.73},{"id":62,"text":"was how do you learn a reward when the robot is learning in the real world? And in that","zh":"如何在机器人在现实世界中学习时学习奖励？在那个","start":926.73,"end":930.63},{"id":63,"text":"the negative distance between the position of the object and the goal position of the object.","zh":"情况下，物体的位置与目标位置之间的负距离。","start":930.63,"end":938.59},{"id":64,"text":"And you might have noticed that in the case with the shapefaring cube, the robot was actually holding the cube","zh":"你可能已经注意到，在形状适配的立方体案例中，机器人实际上是在拿着立方体","start":938.59,"end":944.21},{"id":65,"text":"And so that meant that we could actually measure using the robot arm's position where the cube was as well.","zh":"因此，这意味着我们可以利用机器人手臂的位置来测量立方体的位置。","start":944.21,"end":948.17},{"id":66,"text":"Now, you can't do this in practice in many scenarios. It's kind of specific to that task.","zh":"现在，在许多场景中，你实际上无法做到这一点。这在某种程度上是特定于该任务的。","start":948.17,"end":954.33},{"id":67,"text":"Now, you can't do this in practice in many scenarios. It's kind of specific to that task. And in the hockey example, there was actually a mocap marker on the hockey puck that measured where it is in the room. In general, it's very hard, and that's why reward learning is kind of necessary in order to solve the problem in a more general way. Good question. Okay.","zh":"现在，在许多场景中，你实际上无法做到这一点。这在某种程度上是特定于该任务的。在曲棍球的例子中，实际上在曲棍球上有一个运动捕捉标记，用于测量它在房间中的位置。一般来说，这非常困难，这就是为什么奖励学习在以更一般的方式解决问题时是必要的。好问题。好的。","start":955.14,"end":983.14},{"id":68,"text":"So, now let's dive into modeling behavior and reinforcement learning. So,","zh":"现在，让我们深入探讨行为建模和强化学习。所以，","start":983.55,"end":990.47},{"id":69,"text":"we need to figure out how to represent experience as data. So, as the robot was practicing,","zh":"我们需要弄清楚如何将经验表示为数据。因此，当机器人在练习时，","start":991.93,"end":996.61},{"id":70,"text":"we need to think about how we could actually represent what was captured in that video as","zh":"我们需要思考如何将视频中捕捉到的内容实际表示为","start":996.95,"end":1002.11}],"notes":["本段介绍了强化学习在现实世界中的应用和研究挑战，强调了机器人学习任务表示、泛化能力、大规模数据集应用以及长期路径学习的重要性。讲者提到，机器人在学习过程中可能需要重新开始任务，且无法撤销操作，这表明了强化学习在实际应用中的局限性。","讲者通过机器人学习击球任务的例子，说明了如何通过奖励函数（如物体与目标位置的距离）来引导学习过程。同时指出，这种表示方式在某些任务中是特定的，例如使用运动捕捉标记来测量物体位置，这在一般情况下是困难的。","讲者提到，奖励学习对于解决更广泛的问题是必要的，因为它允许系统在没有直接测量的情况下学习任务目标。这表明了奖励函数设计在强化学习中的核心地位。","讲者还提到课程将涵盖奖励学习、离线强化学习、多任务学习、元学习、层次结构与推理以及无需重置的强化学习等主题，这些内容反映了强化学习的多个研究方向。","在回答关于如何在现实世界中学习奖励的问题时，讲者指出，奖励函数的设计需要根据具体任务进行调整，例如在形状立方体任务中，通过机械臂的位置来测量物体位置，这在实际应用中可能不适用。","讲者强调了奖励学习的必要性，因为它允许系统在没有直接测量的情况下学习任务目标，这表明了奖励函数设计在强化学习中的核心地位。"],"formulas":[],"uncertainties":["shapefaring cube"],"diagram":"none","start":823.23,"end":1002.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":823.23,"text":"But one of the reasons why I like showing these videos is they really show the reinforcement learning process in the real world and the ability to improve with practice. At the same time, there's also a ton of exciting research problems that are open. And so if you're someone who's excited about doing research, there's challenges like, how does this robot learn to represent what is good for the task?"},{"start":844.18,"text":"Or how does an agent generalize its behavior not just to one scenario, but to many different scenarios? And can we apply such a system at scale with large diverse data sets and transfer from other paths and other goals? And can we use reinforcement learning to learn long horizon paths, like cooking a meal or solving a really hard math problem?"},{"start":862.41,"text":"Or can robots practice fully autonomously? And for this last point, I showed you some videos of"},{"start":867.33,"text":"reinforcement learning. That's not actually always what it looks like. So sometimes if you run"},{"start":870.83,"text":"reinforcement learning on a robot, it looks more like this, where the robot is trying to hit the"},{"start":875.09,"text":"hockey puck into the goal. And every time the robot attempts the task, it then kind of needs"},{"start":881.39,"text":"to start over and reattempt it. And the robot doesn't actually know how to undo the task. And"},{"start":885.51,"text":"this is my friend Yevgen. You might notice that Yevgen is actually doing more work than what the"},{"start":889.97,"text":"robot is doing, which doesn't quite seem like the right way of doing things."},{"start":894.29,"text":"And it's not practical to collect a lot of data this way."},{"start":899.75,"text":"And along all these topics, these are some of the topics that we'll be covering in this"},{"start":903.59,"text":"course as well."},{"start":904.17,"text":"So we'll be talking about reward learning and how to represent different rewards."},{"start":907.71,"text":"We'll be talking about offline RL, multitask RL and meta RL, hierarchy and reasoning, and"},{"start":913.59,"text":"reset-free RL as well."},{"start":917.87,"text":"Cool."},{"start":918.27,"text":"Cool. So, any questions on why Deep RL is interesting to study? Yeah. So, the question"},{"start":926.73,"text":"was how do you learn a reward when the robot is learning in the real world? And in that"},{"start":930.63,"text":"particular example, we represented the reward as the distance between, or the negative distance"},{"start":938.59,"text":"between the position of the object and the goal position of the object. And you might"},{"start":944.21,"text":"have noticed that in the case with the shapefaring cube, the robot was actually holding the cube"},{"start":948.17,"text":"And so that meant that we could actually measure using the robot arm's position where the cube was as well."},{"start":955.14,"text":"Now, you can't do this in practice in many scenarios. It's kind of specific to that task. And in the hockey example, there was actually a mocap marker on the hockey puck that measured where it is in the room. In general, it's very hard, and that's why reward learning is kind of necessary in order to solve the problem in a more general way. Good question. Okay."},{"start":983.55,"text":"So, now let's dive into modeling behavior and reinforcement learning. So,"},{"start":991.93,"text":"we need to figure out how to represent experience as data. So, as the robot was practicing,"},{"start":996.95,"text":"we need to think about how we could actually represent what was captured in that video as"}],"speech_gaps":[{"start":897.104,"end":899.328}],"frame":"../frames/v019/006.webp","frame_time":835.23},{"title":"状态与观察的区别","segments":[{"id":71,"text":"data to learn from. And so, here's another example of a robot learning in the real world.","zh":"用于学习的数据。因此，这里还有一个机器人在现实世界中学习的例子。","start":1002.11,"end":1007.35},{"id":72,"text":"We might also want to think about how to represent text from a chatbot, for example.","zh":"我们可能还想考虑如何表示聊天机器人的文本，例如。","start":1007.65,"end":1012.53},{"id":73,"text":"we need to in either of these cases we need to think about experience that the agent collects.","zh":"在这两种情况下，我们需要考虑智能体所收集的经验。","start":1012.53,"end":1016.73},{"id":74,"text":"How do we actually write that down as data? So the way that we do that typically in reinforcement","zh":"我们如何将这些经验实际写成数据？在强化学习中，我们通常首先考虑世界的当前状态，并用 s 表示当前状态。","start":1016.97,"end":1024.15},{"id":75,"text":"learning is first we'll think about the state of the world and we'll use s to denote the current","zh":"例如，在机器人的案例中，世界的当前状态可能是手臂的位置、毛巾的位置和钩子的位置。","start":1024.15,"end":1028.97},{"id":76,"text":"state of the world. And for example in in the case of the robot the state of the world might be","zh":"或者，如果你无法直接获取毛巾的信息，它可能只是","start":1028.97,"end":1037.53},{"id":77,"text":"like the position of the arm and the position of the towel and the position of the hook.","zh":"像手臂的位置、毛巾的位置和钩子的位置这样的状态。","start":1038.13,"end":1042.21},{"id":78,"text":"Or, if you don't have access to information about the towel directly, it might just be","zh":"或者，如果你无法直接获取毛巾的信息，它可能只是","start":1042.77,"end":1047.51},{"id":79,"text":"an image captured from the robot's camera and the position of the joints of the arm","zh":"从机器人摄像头捕捉到的图像和手臂关节的位置","start":1047.51,"end":1053.45},{"id":80,"text":"if you have access to that.","zh":"如果你有访问权限的话。","start":1053.45,"end":1054.35},{"id":81,"text":"Now you can't always represent, you can't always have direct access to the state of","zh":"现在你不能总是表示，你不能总是直接访问世界的状态，","start":1055.53,"end":1061.41},{"id":82,"text":"the world, and so sometimes we'll use, sometimes we'll refer to an observation O and use observations","zh":"因此有时我们会使用，有时我们会提到一个观察值 O 并使用观察值","start":1061.41,"end":1069.95},{"id":83,"text":"instead of states.","zh":"来代替状态。","start":1069.95,"end":1070.83},{"id":84,"text":"and the difference between observations and states is that with observations it may not capture","zh":"观察值和状态之间的区别在于，观察值可能无法捕捉","start":1071.49,"end":1076.37},{"id":85,"text":"all of the information you need to make a decision and you might actually need to think about","zh":"你做出决策所需的所有信息，你实际上可能需要考虑","start":1076.97,"end":1081.19},{"id":86,"text":"past observations that you've seen before. So for example for a chatbot if you're interacting with","zh":"之前见过的观察值。例如，对于一个聊天机器人，如果你正在与","start":1081.19,"end":1086.75},{"id":87,"text":"it you can think of the observation at a given time step as the most recent message that you","zh":"你可以将某一时间步的观察视为你发送给该聊天的最新消息。","start":1086.75,"end":1091.65},{"id":88,"text":"sent to that chat.","zh":"然后，这个最新消息并不能告诉聊天机器人它需要了解的所有信息，以决定下一步的回应。因此，你需要给它过去观察的历史，而不仅仅是当前的观察，以便做出决策。我们将在几页幻灯片后更详细地讨论状态与观察的区别。所以这在某种程度上捕捉了……","start":1091.65,"end":1092.27},{"id":89,"text":"And then that most recent message doesn't tell the chatbot everything it needs to know about what the next response should be. And so what you need is you actually need to give it the history of past observations, not just the current observation, in order to make a decision. And we'll talk a little bit more about this state observation distinction in a couple slides. So this is kind of capturing what...","zh":"代理所观察到的内容。我们还需要捕捉它如何采取行动，如何实际做出决策。我们将这些决策称为动作。我们将用字母 A 来表示动作。就与环境的某一交互而言，我们将将其视为一个轨迹。因此，这将是一系列状态和动作，或一系列观察和动作的序列。这是一种……","start":1093.97,"end":1117.98},{"id":90,"text":"the agent is observing. Now we also need to capture how it's taking actions, how it's actually making decisions. And we'll refer to those decisions as actions. And we'll use the letter A to denote actions. And then in terms of a given interaction with the environment, we will think of that as a trajectory. So that will be a sequence of states and actions or a sequence of observations and actions. This is kind of","zh":"表示行为的方式。这将导致一个轨迹的数据集，而不是一个由 x5 对组成的数据集。然后我们需要思考 tau 的实际目标是什么。这就是奖励函数的作用。奖励函数本质上是在告诉我们某个状态和动作组合的好坏。在许多情况下，奖励函数只会依赖于状态。","start":1118.24,"end":1149.53},{"id":91,"text":"one way to represent behavior. And this will then kind of result in a data set of trajectories rather than a data set of x5 pairs. And then we need to think about what is actually the goal of the tau. And that's where reward functions come in. And reward functions are essentially telling us how good is a given state in action. In many cases, the reward function will only depend on the state.","zh":"表示行为的一种方式。然后这将导致我们得到一个轨迹的数据集，而不是一个x5对的数据集。然后我们需要思考tau的目标到底是什么。这就是奖励函数的作用。奖励函数本质上是在告诉我们某个状态在执行动作时的好坏。在许多情况下，奖励函数只会依赖于状态。","start":1150.81,"end":1180.83}],"notes":["本段主要讲解了强化学习中状态（state）和观察（observation）的区别。状态是环境的完整描述，而观察可能不包含所有必要的信息。在某些情况下，比如机器人或聊天机器人，观察可能只是当前的输入，而决策需要依赖历史观察。","在机器人示例中，状态可能包括机械臂的位置、毛巾和钩子的位置，或者如果无法直接获取毛巾信息，则可能使用摄像头图像和机械臂关节位置。这说明状态可以是直接的物理信息或间接的感知信息。","对于聊天机器人，观察可能只是当前的输入消息，但决策需要历史消息，这说明观察可能不足以做出完整决策，需要结合历史信息。","状态和观察的区别在于，状态是环境的完整描述，而观察可能不完整。因此，在某些情况下，需要使用观察的历史信息来辅助决策。","轨迹（trajectory）是强化学习中表示行为的一种方式，它由状态和动作的序列组成，或者由观察和动作的序列组成。轨迹数据集用于训练智能体。","奖励函数（reward function）用于衡量状态和动作的优劣，通常只依赖于状态。奖励函数是强化学习中定义目标的核心部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1002.11,"end":1180.83,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":1002.11,"text":"data to learn from. And so, here's another example of a robot learning in the real world."},{"start":1007.65,"text":"We might also want to think about how to represent text from a chatbot, for example."},{"start":1012.53,"text":"we need to in either of these cases we need to think about experience that the agent collects."},{"start":1016.97,"text":"How do we actually write that down as data? So the way that we do that typically in reinforcement"},{"start":1024.15,"text":"learning is first we'll think about the state of the world and we'll use s to denote the current"},{"start":1028.97,"text":"state of the world. And for example in in the case of the robot the state of the world might be"},{"start":1038.13,"text":"like the position of the arm and the position of the towel and the position of the hook."},{"start":1042.77,"text":"Or, if you don't have access to information about the towel directly, it might just be"},{"start":1047.51,"text":"an image captured from the robot's camera and the position of the joints of the arm"},{"start":1053.45,"text":"if you have access to that."},{"start":1055.53,"text":"Now you can't always represent, you can't always have direct access to the state of"},{"start":1061.41,"text":"the world, and so sometimes we'll use, sometimes we'll refer to an observation O and use observations"},{"start":1069.95,"text":"instead of states."},{"start":1071.49,"text":"and the difference between observations and states is that with observations it may not capture"},{"start":1076.97,"text":"all of the information you need to make a decision and you might actually need to think about"},{"start":1081.19,"text":"past observations that you've seen before. So for example for a chatbot if you're interacting with"},{"start":1086.75,"text":"it you can think of the observation at a given time step as the most recent message that you"},{"start":1091.65,"text":"sent to that chat."},{"start":1093.97,"text":"And then that most recent message doesn't tell the chatbot everything it needs to know about what the next response should be. And so what you need is you actually need to give it the history of past observations, not just the current observation, in order to make a decision. And we'll talk a little bit more about this state observation distinction in a couple slides. So this is kind of capturing what..."},{"start":1118.24,"text":"the agent is observing. Now we also need to capture how it's taking actions, how it's actually making decisions. And we'll refer to those decisions as actions. And we'll use the letter A to denote actions. And then in terms of a given interaction with the environment, we will think of that as a trajectory. So that will be a sequence of states and actions or a sequence of observations and actions. This is kind of"},{"start":1150.81,"text":"one way to represent behavior. And this will then kind of result in a data set of trajectories rather than a data set of x5 pairs. And then we need to think about what is actually the goal of the tau. And that's where reward functions come in. And reward functions are essentially telling us how good is a given state in action. In many cases, the reward function will only depend on the state."}],"speech_gaps":[],"frame":"../frames/v019/007.webp","frame_time":1014.11},{"title":"状态、动作与马尔可夫性质","segments":[{"id":92,"text":"And for example, it might tell you how close is the towel to being hung or is the towel hung or not. Or in the case of a tap out, it might be like how happy is the user or did they give me a thumbs up or a thumbs down. And then this experience is kind of the trajectory and that trajectory might be augmented with the rewards. So this is kind of each time you kind of roll out the policy, you'll get some sort of data in this form.","zh":"例如，它可能会告诉你毛巾离挂好有多近，或者毛巾是否已经挂好了。或者在水龙头外的情况中，它可能会像用户有多开心，或者他们是否给了我一个大拇指或小拇指。然后这种体验就类似于轨迹，而这条轨迹可能会被奖励所增强。因此，每次你执行策略时，你都会得到这种形式的数据。","start":1181.32,"end":1211.37},{"id":93,"text":"Let's talk a little bit more about states and observations first. So the way that we can then think about states and actions is it's always a lot like a Markov chain. So we'll have the first state of the world. This is, for example, in the robot case, let's say the towel is on the table and there's a hook and the goal is to put the towel on the hook. This first state is like the robot in some neutral position and the towel on the table.","zh":"让我们再稍微谈谈状态和观察。因此，我们可以这样思考状态和动作，它总是类似于马尔可夫链。我们将有世界的第一状态。例如，在机器人案例中，假设毛巾在桌子上，有一个挂钩，目标是将毛巾挂在挂钩上。这个第一状态类似于机器人处于某个中性位置，而毛巾在桌子上。","start":1213.67,"end":1241.97},{"id":94,"text":"And then the robot will take some action. This is like moving its arm to a particular location. And that action and the current state will inform what the next state is. And then from there, maybe the towel is in the same position if the robot was just moving in free space, or maybe the towel was moved. And then the robot will then take another action. It will move its arm again. And the...","zh":"然后机器人会采取一些动作。这类似于将它的手臂移动到特定位置。这个动作和当前状态会告知下一个状态是什么。然后，从那里，如果机器人只是在自由空间中移动，毛巾可能处于相同的位置，或者毛巾可能被移动了。然后机器人会再次采取另一个动作，再次移动它的手臂。","start":1243.18,"end":1272.83},{"id":95,"text":"states and actions will then inform the next state. Now one crucial thing here is that we can think of how the environment is changing under what's called a dynamics function. So you have P given S and A .","zh":"状态和动作会告知下一个状态。现在这里一个关键点是，我们可以思考环境如何在所谓的动态函数下发生变化。因此，你有 P 给定 S 和 A 。","start":1274.28,"end":1295.52},{"id":96,"text":"This is kind of the dynamics of the world. This is how does the arm actually move in space and how does the towel move in space as a function of where it was before and what the robot did. And the crucial thing to notice here is that S3 only depends on S2 and A2, and it doesn't depend on F1. And so there's no S1 in this probability distribution. And essentially, S3 is going to be...","zh":"这类似于世界的动态。这说明手臂如何在空间中实际移动，以及毛巾如何在空间中移动，作为其之前位置和机器人所采取动作的函数。需要注意的关键点是，S3 仅依赖于 S2 和 A2，而不依赖于 F1。因此，在这个概率分布中没有 S1。并且本质上，如果以 S2 为条件，S3 将会独立于 S1。这种独立性属性被称为马尔可夫性质。而它实际上是强化学习中非常有用的一个特性。因此，它允许你将问题分解为这些场景，你不需要担心之前所有依赖关系。","start":1296.08,"end":1326.03},{"id":97,"text":"independent of S1 if you condition on S2. And this sort of independence property is called the Markov property. And it's one of the things that actually ends up being very useful in reinforced learning. So it allows you to break up the problem into these scenarios where you don't have to worry about all the dependencies that come before it.","zh":"如果条件在 S2 上，那么它与 S1 独立。这种独立性性质被称为马尔可夫性质。它实际上是强化学习中非常有用的一种特性。因此，它允许你将问题分解成这些场景，在这些场景中你无需考虑其之前的所有依赖关系。","start":1329.03,"end":1353.29}],"notes":["本段讲解了状态和动作如何共同决定下一个状态，并引入了动态函数的概念。动态函数描述了环境如何随状态和动作变化，强调了状态转移的概率分布仅依赖于当前状态和动作，而不依赖于更早的状态。这种独立性被称为马尔可夫性质，是强化学习中的关键概念。","马尔可夫性质意味着当前状态和动作足以决定下一个状态，而无需考虑更早的历史状态。这种性质使得问题可以被分解为一系列独立的决策步骤，从而简化了建模和计算。","在机器人毛巾悬挂的例子中，状态包括毛巾的位置和机器人的位置，动作是机器人手臂的移动。状态转移的概率分布仅依赖于当前状态和动作，而不是之前的状态，这体现了马尔可夫性质。","马尔可夫性质在强化学习中非常重要，因为它允许我们忽略历史状态，只需关注当前状态和动作，从而减少计算复杂度并提高算法效率。","动态函数P(S', A)描述了状态和动作如何影响下一个状态，这种函数是强化学习中建模环境的核心部分。","马尔可夫性质是强化学习中许多算法（如Q-learning和策略梯度方法）的基础，因为它允许我们使用当前状态和动作来预测未来状态，而无需考虑所有历史信息。"],"formulas":[{"latex":"P(S_3 | S_2, A_2)","symbols":"P(S3 | S2, A2)","explanation":"公式正确，表示在状态S2和动作A2的条件下，状态S3的概率分布，符合马尔可夫性质，即下一状态仅依赖于当前状态和动作，不依赖于更早的状态。","evidence":"This is kind of the dynamics of the world. This is how does the arm actually move in space and how does the towel move in space as a function of where it was before and what the robot did. And the crucial thing to notice here is that S3 only depends on S2 and A2, and it doesn't depend on F1. And so there's no S1 in this probability distribution. And essentially, S3 is going to be..."}],"uncertainties":[],"diagram":"none","start":1181.32,"end":1353.29,"asr_flags":[],"math_clarifications":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1181.32,"text":"And for example, it might tell you how close is the towel to being hung or is the towel hung or not. Or in the case of a tap out, it might be like how happy is the user or did they give me a thumbs up or a thumbs down. And then this experience is kind of the trajectory and that trajectory might be augmented with the rewards. So this is kind of each time you kind of roll out the policy, you'll get some sort of data in this form."},{"start":1213.67,"text":"Let's talk a little bit more about states and observations first. So the way that we can then think about states and actions is it's always a lot like a Markov chain. So we'll have the first state of the world. This is, for example, in the robot case, let's say the towel is on the table and there's a hook and the goal is to put the towel on the hook. This first state is like the robot in some neutral position and the towel on the table."},{"start":1243.18,"text":"And then the robot will take some action. This is like moving its arm to a particular location. And that action and the current state will inform what the next state is. And then from there, maybe the towel is in the same position if the robot was just moving in free space, or maybe the towel was moved. And then the robot will then take another action. It will move its arm again. And the..."},{"start":1274.28,"text":"states and actions will then inform the next state. Now one crucial thing here is that we can think of how the environment is changing under what's called a dynamics function. So you have P given S and A ."},{"start":1296.08,"text":"This is kind of the dynamics of the world. This is how does the arm actually move in space and how does the towel move in space as a function of where it was before and what the robot did. And the crucial thing to notice here is that S3 only depends on S2 and A2, and it doesn't depend on F1. And so there's no S1 in this probability distribution. And essentially, S3 is going to be..."},{"start":1329.03,"text":"independent of S1 if you condition on S2. And this sort of independence property is called the Markov property. And it's one of the things that actually ends up being very useful in reinforced learning. So it allows you to break up the problem into these scenarios where you don't have to worry about all the dependencies that come before it."}],"speech_gaps":[],"frame":"../frames/v019/008.webp","frame_time":1193.32},{"title":"观测与状态的关系","segments":[{"id":98,"text":"Now, if you have observations instead of states, then things look a little bit different. And the way that we can think about observations is the observation is a function of this current state, and it may not contain all the information that's in the state. And so the observation at any given point in time for completeness, we'll draw each of them here. And then if you don't have access, if you can't observe the states,","zh":"现在，如果你有观测值而不是状态，那么情况看起来会有些不同。我们可以这样思考观测值：观测值是当前状态的一个函数，它可能并不包含状态中的所有信息。因此，在每一个时间点，为了完整性，我们将它们都画在这里。如果你无法获取，如果你无法观察到状态，","start":1356.4,"end":1386.13},{"id":99,"text":"That means now that O2, or sorry, O3, it's not just a function of O2 and A2,","zh":"这意味着现在O2，或者抱歉，O3，它不仅仅是一个关于O2和A2的函数，","start":1386.86,"end":1393.72},{"id":100,"text":"it's actually also a function of O1 if you cannot observe the state.","zh":"如果你无法观察到状态，它实际上也是O1的一个函数。","start":1393.84,"end":1398.78},{"id":101,"text":"Cool. So on the slide, we can think about this model where we have these dynamics. We don't know","zh":"好。在幻灯片上，我们可以思考这个模型，其中包含这些动态。我们不知道","start":1402.54,"end":1409.68},{"id":102,"text":"how the world is going to evolve. We can't directly observe, like how the power, we can't","zh":"世界将如何演变。我们不能直接观察，比如功率，我们不能","start":1409.68,"end":1413.64},{"id":103,"text":"predict the future. So these dynamics are unknown, and these dynamics are independent","zh":"预测未来。因此，这些动态是未知的，而且这些动态与st-1无关，在这种情况下，这被称为马尔可夫性质。对此有任何问题吗？","start":1413.64,"end":1419.92},{"id":104,"text":"of st-1 in this case, and that's known as the Markov property. Any questions on that?","zh":"在这种情况下，我们只依赖于st-1，这被称为马尔可夫性质。对此有任何问题吗？","start":1419.92,"end":1427.6},{"id":105,"text":"Yeah, so the question is, in practice, how many path observations do we need to infer","zh":"路径观测值的数量。","start":1428.3,"end":1432.06},{"id":106,"text":"the state? It is heavily domain-dependent. In a lot of robotics examples, you can often","zh":"状态？这在很大程度上取决于领域。在很多机器人示例中，你通常可以仅使用当前的传感器观测值，但这也取决于传感器的类型。","start":1432.06,"end":1443.32},{"id":107,"text":"get away with just using the current sensor observations, but it depends a lot on what the","zh":"如果你有触觉传感器，例如，这些传感器通常包含的信息量不如视觉观测值。","start":1443.32,"end":1448.76},{"id":108,"text":"sensors are. If you have tactile sensors, for example, those oftentimes don't contain","zh":"例如，当你没有接触物体时，你无法知道你离桌子有多近。一旦你接触到了，你就会知道。","start":1448.76,"end":1454.34},{"id":109,"text":"as much information as vision observation, for example. And so how close you are to a table,","zh":"因此，与图像相比，这在很大程度上是部分可观测的。但如果你在这些传感器之外还使用图像，那么这将提供一个更完整的表示。","start":1454.34,"end":1459.62},{"id":110,"text":"you have no idea when you're not making contact. And then once you make contact, you know.","zh":"是的，那么为什么奖励函数是状态和动作的函数，而不是仅仅是状态的函数呢？","start":1459.76,"end":1463.62},{"id":111,"text":"So that's a lot more partially observable than an image, for example. But then if you have the","zh":"所以，这比图像要更部分可观测得多，例如。但如果你还有图像，那么这就会给你一个更完整的表示。","start":1463.78,"end":1469.96},{"id":112,"text":"images in addition to that, then that gives you a more complete representation.","zh":"是的，所以奖励函数为什么是状态和动作的函数，而不是仅仅","start":1469.96,"end":1472.7},{"id":113,"text":"Yeah, so why is the reward function a function of both the state and the action and not just","zh":"状态的函数呢？","start":1473.8,"end":1477.62},{"id":114,"text":"the state?","zh":"状态是什么？","start":1477.62,"end":1477.96},{"id":115,"text":"One example of this is, we can go back to a robotics example.","zh":"一个这样的例子是，我们可以回到一个机器人学的例子。","start":1478.66,"end":1482.48},{"id":116,"text":"So say that you are a humanoid robot and you're trying to learn how to walk.","zh":"假设你是一个类人机器人，你正在尝试学习如何行走。","start":1482.7,"end":1486.24},{"id":117,"text":"And maybe one natural reward function is just how much forward progress have you made?","zh":"也许一个自然的奖励函数就是你向前进展了多少。","start":1487.8,"end":1492.44},{"id":118,"text":"So where is your body?","zh":"你的身体在哪里？","start":1492.5,"end":1493.8},{"id":119,"text":"and that would be kind of dependent on the state.","zh":"这将取决于状态。","start":1493.8,"end":1495.36},{"id":120,"text":"One scenario where you might want the action is that scenario where if you don't want to be using too much energy, because you don't want to be, like, tensing up all the motors, for example, or I guess...","zh":"你可能想要采取动作的一个场景是，当你不想使用太多能量的时候，比如你不想让所有的电机都紧张起来，例如，或者我想……","start":1496.51,"end":1507.51},{"id":121,"text":"it makes more sense. But if you don't want to be exerting too much, pushing too much energy into your motors, then you'll want to depend on the actions as well. And you could basically have some penalty on how much torque you're putting through the motors. So that's one example. In many cases, you can just depend on the state. But there are some examples where you want to kind of penalize taking too much action. Yeah, so the question is...","zh":"这样更有意义。但如果你不想耗费太多能量，把太多能量输入到电机中，那么你也会希望依赖动作。你可以基本上对施加在电机上的力矩施加一些惩罚。这是一个例子。在许多情况下，你只需依赖状态。但有一些例子中，你希望惩罚采取过多的动作。是的，所以问题是……","start":1507.88,"end":1529.86}],"notes":["本段讲解了观测与状态之间的关系，指出观测可能不包含状态的全部信息。当无法直接观察状态时，观测可能依赖于之前的观测和动作。例如，如果无法观察状态，那么当前观测O3不仅依赖于前一个观测O2和动作A2，还可能依赖于更早的观测O1。这种关系体现了部分可观测性（partially observable）的概念。","在强化学习中，观测（observation）通常被建模为状态（state）的函数，但观测可能不完全反映状态。因此，当状态不可观测时，需要通过观测序列来推断状态。这种情况下，观测序列可能包含历史信息，从而帮助恢复状态信息。","讲者通过机器人示例说明了观测与状态的关系。例如，在机器人行走任务中，观测可能仅包含当前传感器数据，而状态可能包含更多细节。如果传感器信息不完整，如触觉传感器，那么观测可能无法完全反映状态，从而导致部分可观测性。","讲者还提到，奖励函数可能依赖于状态和动作，而不仅仅是状态。例如，在机器人行走任务中，奖励函数可能不仅取决于机器人的位置（状态），还取决于其动作（如施加的扭矩）。这种设计可以用于惩罚不必要的动作，从而优化能量消耗。","讲者指出，奖励函数的设计取决于具体任务和环境。在某些情况下，仅依赖状态可能足够，但在其他情况下，需要考虑动作的影响。这种设计灵活性是强化学习模型的重要特征。","讲者通过机器人行走的例子说明了奖励函数的设计，强调了动作在奖励计算中的作用。这种设计可以用于优化能量效率，避免不必要的动作，从而提高系统的整体性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1356.4,"end":1529.86,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":1356.4,"text":"Now, if you have observations instead of states, then things look a little bit different. And the way that we can think about observations is the observation is a function of this current state, and it may not contain all the information that's in the state. And so the observation at any given point in time for completeness, we'll draw each of them here. And then if you don't have access, if you can't observe the states,"},{"start":1386.86,"text":"That means now that O2, or sorry, O3, it's not just a function of O2 and A2,"},{"start":1393.84,"text":"it's actually also a function of O1 if you cannot observe the state."},{"start":1402.54,"text":"Cool. So on the slide, we can think about this model where we have these dynamics. We don't know"},{"start":1409.68,"text":"how the world is going to evolve. We can't directly observe, like how the power, we can't"},{"start":1413.64,"text":"predict the future. So these dynamics are unknown, and these dynamics are independent"},{"start":1419.92,"text":"of st-1 in this case, and that's known as the Markov property. Any questions on that?"},{"start":1428.3,"text":"Yeah, so the question is, in practice, how many path observations do we need to infer"},{"start":1432.06,"text":"the state? It is heavily domain-dependent. In a lot of robotics examples, you can often"},{"start":1443.32,"text":"get away with just using the current sensor observations, but it depends a lot on what the"},{"start":1448.76,"text":"sensors are. If you have tactile sensors, for example, those oftentimes don't contain"},{"start":1454.34,"text":"as much information as vision observation, for example. And so how close you are to a table,"},{"start":1459.76,"text":"you have no idea when you're not making contact. And then once you make contact, you know."},{"start":1463.78,"text":"So that's a lot more partially observable than an image, for example. But then if you have the"},{"start":1469.96,"text":"images in addition to that, then that gives you a more complete representation."},{"start":1473.8,"text":"Yeah, so why is the reward function a function of both the state and the action and not just"},{"start":1477.62,"text":"the state?"},{"start":1478.66,"text":"One example of this is, we can go back to a robotics example."},{"start":1482.7,"text":"So say that you are a humanoid robot and you're trying to learn how to walk."},{"start":1487.8,"text":"And maybe one natural reward function is just how much forward progress have you made?"},{"start":1492.5,"text":"So where is your body?"},{"start":1493.8,"text":"and that would be kind of dependent on the state."},{"start":1496.51,"text":"One scenario where you might want the action is that scenario where if you don't want to be using too much energy, because you don't want to be, like, tensing up all the motors, for example, or I guess..."},{"start":1507.88,"text":"it makes more sense. But if you don't want to be exerting too much, pushing too much energy into your motors, then you'll want to depend on the actions as well. And you could basically have some penalty on how much torque you're putting through the motors. So that's one example. In many cases, you can just depend on the state. But there are some examples where you want to kind of penalize taking too much action. Yeah, so the question is..."}],"speech_gaps":[],"frame":"../frames/v019/009.webp","frame_time":1368.4},{"title":"状态观测与时间序列依赖性","segments":[{"id":122,"text":"if the observation is only part of the state, then why is a future observation not independent of past observations? And the reason for that is that we can actually go back to the tactile example. So say that you make contact, and then you stop making contact, and then you make contact again. In that case, the most immediate past observation doesn't actually tell you that much information about the current state.","zh":"如果观测只是状态的一部分，那么为什么未来的观测不独立于过去的观测？原因在于我们可以回到触觉的例子。比如说，你接触到了，然后停止接触，之后又再次接触。在这种情况下，最直接的过去观测实际上并不能提供太多关于当前状态的信息。","start":1530.78,"end":1556.24},{"id":123,"text":"And whereas this observation actually tells you a lot more information about the state. And so the, that O3, you actually can learn more about, you can actually figure out more about O3 when you don't just condition on O2, but also condition on O1. And there's also a way.","zh":"而这个观测实际上能提供关于状态的更多信息。因此，O3，当你不仅仅基于O2进行条件，还基于O1进行条件时，你实际上可以更深入地了解O3。还有一种方式。","start":1556.83,"end":1575.45},{"id":124,"text":"For folks familiar with graphical models to actually think about if you kind of marginalize out these variables, you'll actually see that in the graphical model. I don't want to go into that today, but that's another way that you can see this. Correct. Yeah, yeah, yeah. So yeah, if you were to estimate and predict O3, then you would need to use past observations. But the actual observation in this graphical model is kind of dependent on the state, which might be unobserved or unknown.","zh":"对于熟悉图模型的人来说，可以考虑如果把这些变量进行边缘化，你实际上会在图模型中看到这一点。我不打算今天深入讲解，但这是一种你可以看到这种依赖关系的方式。正确。是的，是的，是的。所以是的，如果你要估计和预测O3，你将需要使用过去的观测。但在这个图模型中，实际的观测在某种程度上依赖于状态，而该状态可能是未观测或未知的。","start":1576.3,"end":1604.94},{"id":125,"text":"Cool. So let's walk through a couple examples of what this might look like. So in the robotics case, the state could include three different things. One would be the RGB images from any cameras on the robot, the positions of all the joints of the robot, and the velocities of the joints. And so this is kind of a fairly common state representation for a robot system. And the images would be like...","zh":"好，让我们通过几个例子来说明这可能是什么样子的。在机器人案例中，状态可能包括三个不同的内容。一个是机器人上任何摄像头的RGB图像，二是机器人所有关节的位置，三是关节的速度。因此，这在机器人系统中是一种相当常见的状态表示方式。而图像的维度会与位置不同，你可能需要实际配置你的神经网络，使其能够接受这些不同的维度。","start":1607.19,"end":1634.44},{"id":126,"text":"would be actually a different dimensionality than the positions, and you might need to actually configure your neural network in a way that can accept those different dimensionalities. The action would then be the commanded next joint position. So how are you going to kind of move your joint? If your joint's currently like at 90 degrees, maybe you'll try to move it to 92 degrees.","zh":"实际上，这会是一个与位置不同的维度，你可能需要以一种能够接受这些不同维度的方式配置你的神经网络。然后，动作就是命令的下一个关节位置。那么你如何移动关节呢？如果关节当前处于90度，你可能会尝试将其移动到92度。","start":1635.3,"end":1652.67},{"id":127,"text":"The trajectory then would be a sequence of states in action, so a sequence of images, which is essentially a video, a sequence of joint positions, and a sequence of commanded joint positions. Now, what does that sequence actually entail? Typically, what we do is we'll discretize time, and this sequence will then, for example, be at 20 hertz. So your video will be 20 frames per second.","zh":"那么，轨迹就是一系列在执行动作中的状态，因此是一系列图像，本质上是一段视频，一系列关节位置，以及一系列指令关节位置。现在，这样的序列到底意味着什么？通常，我们会对时间进行离散化处理，例如，这个序列将以20赫兹的频率进行采样。因此，你的视频将是每秒20帧。","start":1654.38,"end":1681.87},{"id":128,"text":"and you'll have joint observations 20 times per second, and you'll also have commanded actions 20 times per second. I always found this a little bit unintuitive when I first learned it because as a person I don't really think about making a decision 20 times every second, but it is oftentimes the most practical way to represent data and behavior on physical systems like robots.","zh":"你每秒也会获得20次关节观测，以及每秒20次的指令动作。我第一次学习时总是觉得这一点有点难以理解，因为作为一个人，我并不真的会考虑每秒做20次决策，但这种方法通常是表示物理系统如机器人上的数据和行为的最实用方式。","start":1682.3,"end":1706.54}],"notes":["本段讨论了状态观测与时间序列依赖性的问题，指出当观测仅是状态的一部分时，未来的观测并非独立于过去的观测。这是因为观测序列中包含的信息可能与状态相关，而状态可能未被完全观测到。例如，在触觉示例中，接触和非接触的交替变化表明，仅凭最近的观测可能无法充分了解当前状态，而需要结合更早的观测信息。","讲者提到，对于熟悉图模型的听众，可以通过对变量进行边缘化来理解这种依赖性。在图模型中，观测序列与状态之间存在依赖关系，而状态可能是未观测或未知的。这表明，预测未来的观测需要考虑过去的所有观测信息，而不仅仅是最近的观测。","在机器人示例中，状态包括RGB图像、关节位置和速度。这些观测具有不同的维度，因此需要配置神经网络以接受不同维度的输入。动作是下一个关节位置的命令，例如从90度移动到92度。","轨迹是状态和动作的序列，通常以离散时间表示，例如20赫兹。这意味着视频以20帧每秒播放，关节观测和动作命令也以20次每秒的频率进行。虽然这种高频决策对人类来说可能难以直观理解，但它是表示物理系统（如机器人）行为的实用方式。","讲者强调了时间序列数据的离散化处理，以及在实际应用中如何将连续的物理行为转化为离散的决策序列。这种处理方式虽然对人类来说可能不直观，但却是实现机器人控制等任务的必要步骤。","本段通过触觉示例和机器人状态表示，说明了观测序列与状态之间的依赖关系，并指出在强化学习中，理解这种依赖性对于建模和预测至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1530.78,"end":1706.54,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1530.78,"text":"if the observation is only part of the state, then why is a future observation not independent of past observations? And the reason for that is that we can actually go back to the tactile example. So say that you make contact, and then you stop making contact, and then you make contact again. In that case, the most immediate past observation doesn't actually tell you that much information about the current state."},{"start":1556.83,"text":"And whereas this observation actually tells you a lot more information about the state. And so the, that O3, you actually can learn more about, you can actually figure out more about O3 when you don't just condition on O2, but also condition on O1. And there's also a way."},{"start":1576.3,"text":"For folks familiar with graphical models to actually think about if you kind of marginalize out these variables, you'll actually see that in the graphical model. I don't want to go into that today, but that's another way that you can see this. Correct. Yeah, yeah, yeah. So yeah, if you were to estimate and predict O3, then you would need to use past observations. But the actual observation in this graphical model is kind of dependent on the state, which might be unobserved or unknown."},{"start":1607.19,"text":"Cool. So let's walk through a couple examples of what this might look like. So in the robotics case, the state could include three different things. One would be the RGB images from any cameras on the robot, the positions of all the joints of the robot, and the velocities of the joints. And so this is kind of a fairly common state representation for a robot system. And the images would be like..."},{"start":1635.3,"text":"would be actually a di
