fferent dimensionality than the positions, and you might need to actually configure your neural network in a way that can accept those different dimensionalities. The action would then be the commanded next joint position. So how are you going to kind of move your joint? If your joint's currently like at 90 degrees, maybe you'll try to move it to 92 degrees."},{"start":1654.38,"text":"The trajectory then would be a sequence of states in action, so a sequence of images, which is essentially a video, a sequence of joint positions, and a sequence of commanded joint positions. Now, what does that sequence actually entail? Typically, what we do is we'll discretize time, and this sequence will then, for example, be at 20 hertz. So your video will be 20 frames per second."},{"start":1682.3,"text":"and you'll have joint observations 20 times per second, and you'll also have commanded actions 20 times per second. I always found this a little bit unintuitive when I first learned it because as a person I don't really think about making a decision 20 times every second, but it is oftentimes the most practical way to represent data and behavior on physical systems like robots."}],"speech_gaps":[],"frame":"../frames/v019/010.webp","frame_time":1542.78},{"title":"强化学习中的状态、动作与奖励函数设计","segments":[{"id":129,"text":"And then for the reward function, there's a few things you could use here. One could be one if the towel is on the hook in state s and zero otherwise. You could also have some sort of penalty on the torques that you're applying on the actions or something like that. So that's a robot example. Now let's go to a chatbot example. So here are the observation. We likely wouldn't have a compact state representation, so we'd be using observations. And the observation could be the user's most recent message.","zh":"然后对于奖励函数，这里有一些你可以使用的方法。一种可能是，如果在状态s中毛巾挂在钩子上则为1，否则为0。你也可以对所施加的动作扭矩施加某种惩罚，或者其他类似的方法。这就是一个机器人示例。现在让我们转到聊天机器人的示例。这里有一些观察结果。我们很可能不会有一个紧凑的状态表示，因此我们会使用观察结果。观察结果可以是用户的最新消息。","start":1708.73,"end":1738.84},{"id":130,"text":"The action would be the chatbot's next message. So this would be potentially a sentence or a paragraph. It potentially can actually be very large. And then you can think of the trajectory as the conversation trace. So like the kind of history of the current conversations. And unlike in the robotics example,","zh":"动作将是聊天机器人的下一条消息。这可能是一句话或一段文字。它实际上可能非常长。然后你可以将轨迹视为对话记录。例如，当前对话的历史。与机器人示例不同，","start":1740.55,"end":1759.91},{"id":131,"text":"This won't necessarily be at a fixed 20 hertz frequency. It might take longer for a user to respond or something like that. So this is an example of how trajectories might vary in terms of how time is represented. So in the first case, time is represented as a 20th of a second. Whereas in the second case, time is represented as when the user responds next.","zh":"这不一定以固定的20赫兹频率进行。用户可能需要更长时间来回应，或者其他类似的情况。因此，这是一个轨迹在时间表示上可能变化的示例。在第一种情况下，时间表示为0.05秒（即1/20秒）。而在第二种情况下，时间表示为用户下一次回应的时间。","start":1760.71,"end":1781.57},{"id":132,"text":"And then as an example reward, maybe it's 1 if the user gives an upvote, negative 10 if the user gives a downvote, and 0 if there's no user feedback. Okay, so these are examples of how we can set up reinforcement learning. Now I would like to ask you to formulate a reinforcement learning problem. And in particular, I'd like you to define the state or observation, the action, trajectory, and reward for either one of these three examples or choose your own example.","zh":"然后作为奖励函数的一个示例，可能是用户点赞则为1，用户点踩则为-10，如果没有用户反馈则为0。好的，这些是设置强化学习问题的示例。现在我想要你们来构建一个强化学习问题。特别是，我想要你们为这三个示例中的一个或你们自己选择的示例定义状态或观察、动作、轨迹和奖励。","start":1784.68,"end":1816.6},{"id":133,"text":"Yeah, so in this example, there's a question of, basically the question is like, why would this be an observation versus a state? It could actually be formulated both ways, potentially. It kind of depends on the details of the sensor measurement.","zh":"是的，在这个示例中，存在一个问题，即这个问题类似于：为什么这会是一个观察而不是状态？实际上，它可能以两种方式来表述。这取决于传感器测量的细节。","start":1817.62,"end":1832.96},{"id":134,"text":"As one example, if your sensors are just looking at a lidar of the current depth around you and a picture of what's in front of you, maybe something along those lines, one thing that that would be missing is how fast the cars are moving around you, the velocity of the cars. That's probably quite important for what's going to happen in the future, if it stopped versus moving at 60 miles per hour.","zh":"举一个例子，如果你的传感器只是观察你周围当前深度的激光雷达数据以及你前方的图像，大概类似这样的情况，那么就会缺少一些信息，比如你周围车辆的移动速度，即车辆的速率。这可能对于未来会发生什么非常重要，比如如果车辆停止不动，还是以每小时60英里的速度行驶。","start":1834.97,"end":1861.79}],"notes":["本段讲解了强化学习中状态、动作和奖励函数的设计，以聊天机器人为例，说明了状态可能由观察值构成，如用户的最新消息。动作是聊天机器人的回复，可能是一个句子或段落，而轨迹则是对话的历史记录。时间表示方式可能不同，如机器人示例中时间以20赫兹频率表示，而聊天机器人示例中时间由用户响应时间决定。","奖励函数的设计示例包括用户点赞、点踩和无反馈三种情况，分别对应1、-10和0。这说明了奖励函数需要根据具体任务进行设计，以引导智能体学习最优策略。","在状态与观察值的区分上，讲者指出这取决于传感器测量的细节。例如，如果传感器仅提供深度和图像信息，可能无法获取车辆的速度信息，而速度对于预测未来状态非常重要。","讲者强调了强化学习问题的建模需要明确状态、动作、轨迹和奖励函数，鼓励学生根据给定示例或自选场景进行建模。","在聊天机器人示例中，轨迹的表示方式与机器人示例不同，这说明了强化学习中时间表示的灵活性，以及不同任务对时间建模的不同需求。","讲者通过聊天机器人和机器人两个示例，展示了强化学习在不同应用场景中的多样性，强调了状态、动作和奖励函数设计的灵活性和重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1708.73,"end":1861.79,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1708.73,"text":"And then for the reward function, there's a few things you could use here. One could be one if the towel is on the hook in state s and zero otherwise. You could also have some sort of penalty on the torques that you're applying on the actions or something like that. So that's a robot example. Now let's go to a chatbot example. So here are the observation. We likely wouldn't have a compact state representation, so we'd be using observations. And the observation could be the user's most recent message."},{"start":1740.55,"text":"The action would be the chatbot's next message. So this would be potentially a sentence or a paragraph. It potentially can actually be very large. And then you can think of the trajectory as the conversation trace. So like the kind of history of the current conversations. And unlike in the robotics example,"},{"start":1760.71,"text":"This won't necessarily be at a fixed 20 hertz frequency. It might take longer for a user to respond or something like that. So this is an example of how trajectories might vary in terms of how time is represented. So in the first case, time is represented as a 20th of a second. Whereas in the second case, time is represented as when the user responds next."},{"start":1784.68,"text":"And then as an example reward, maybe it's 1 if the user gives an upvote, negative 10 if the user gives a downvote, and 0 if there's no user feedback. Okay, so these are examples of how we can set up reinforcement learning. Now I would like to ask you to formulate a reinforcement learning problem. And in particular, I'd like you to define the state or observation, the action, trajectory, and reward for either one of these three examples or choose your own example."},{"start":1817.62,"text":"Yeah, so in this example, there's a question of, basically the question is like, why would this be an observation versus a state? It could actually be formulated both ways, potentially. It kind of depends on the details of the sensor measurement."},{"start":1834.97,"text":"As one example, if your sensors are just looking at a lidar of the current depth around you and a picture of what's in front of you, maybe something along those lines, one thing that that would be missing is how fast the cars are moving around you, the velocity of the cars. That's probably quite important for what's going to happen in the future, if it stopped versus moving at 60 miles per hour."}],"speech_gaps":[],"frame":"../frames/v019/011.webp","frame_time":1720.73},{"title":"状态表示与观察的处理","segments":[{"id":135,"text":"Now, you could potentially try to include a history of LiDAR information to get that velocity information, and then represent your state as a three-second history, for example. This will represent a theme, which is that typically to handle observations, we'll use a little bit of history, and then that can form your state representation. It's a little bit ambiguous in this particular case, and it comes down to the details.","zh":"现在，你可能会尝试包含LiDAR信息的历史数据以获取速度信息，然后将状态表示为三秒的历史数据，例如。这体现了这样一个主题，即通常为了处理观测数据，我们会使用一小段历史数据，而这可以形成你的状态表示。在这种情况下的表述有些模糊，最终取决于具体细节。","start":1863.62,"end":1891.5},{"id":136,"text":"Yeah, so the question is, in the robot example, if the reward is 1 if it's on the hook and 0 otherwise, how do you actually learn? Because if you don't actually ever do that at any point, then you'll have very little supervision signal. You'll just have 0 reward all the time.","zh":"是的，问题是，在机器人示例中，如果奖励是当它处于钩子上时为1，否则为0，那么你实际上是如何学习的？因为如果你在任何时刻都没有真正执行过这个动作，那么你将获得非常少的监督信号。你将一直得到0奖励。","start":1892.71,"end":1908.49},{"id":137,"text":"And so in that particular video, we actually showed the robot how to do it a couple times as initialization, and that helped it with what we'll call exploration. And if you have very sparse rewards, rewards that have very little signal and are not kind of nicely shaped towards the goal, then usually that kind of data might be important for jump-starting the reinforcement learning process.","zh":"因此，在那个视频中，我们实际上在初始化时向机器人演示了几次如何操作，这有助于我们所说的探索过程。如果你有非常稀疏的奖励，即奖励信号非常弱且没有很好地引导向目标，那么这种类型的数据通常对于启动强化学习过程可能是重要的。","start":1909.14,"end":1935.98},{"id":138,"text":"Cool, cool. Yeah, so if folks couldn't hear that, you'd have this state being something like the HTML and the URL, information about the web page and where you're at. The action would be interacting with it, and the reward would be whether or not some task was completed. Yeah, so the question is, is basically everything an observation because sensors may not be perfect? So you could always choose to model something as an observation if you're worried about sensor noise or something like that.","zh":"很好，很好。是的，如果人们听不到那个部分，那么状态可能类似于HTML和URL，关于网页的信息以及你所处的位置。动作就是与之交互，奖励则是任务是否完成。是的，问题基本上是：是否所有内容都是观测数据，因为传感器可能并不完美？因此，如果你担心传感器噪声等问题，你总是可以选择将某些内容建模为观测数据。","start":1937.07,"end":1964.06},{"id":139,"text":"there are large, in some ways potentially large downsides to it if you need to add a lot of history. And so sometimes we will kind of approximately approximate something as the state, even if it might be lacking information. Like maybe, I don't know, once every 10,000 times the sensor fails and gives you a black image or something like that. Even though that would technically be...","zh":"如果你需要添加大量历史数据，这在某些方面可能会带来巨大的负面影响。因此，有时我们会将近似地将某些内容建模为状态，即使它可能缺乏信息。例如，可能每10,000次中有一次传感器失效并给出一个黑色图像之类的。即使这在技术上是……","start":1964.95,"end":1990.89},{"id":140,"text":"like an observation case, you might still use it as a state representation because of how it affects the algorithms. Yeah, so if I understand correctly, you're asking for observations it could either be like everything currently or it could be a delta from the previous observation. Yeah, it would come out down to different trade-offs oftentimes.","zh":"比如一个观察案例，你仍然可能将其用作状态表示，因为这会影响算法。是的，所以如果我理解正确的话，你问的是观察，它可能是当前所有内容，也可能是与前一个观察的差异。是的，这通常会涉及到不同的权衡取舍。","start":1991.95,"end":2010.85},{"id":141,"text":"If you are going to be including a lot of history, then compressing it by using deltas could potentially make a lot of sense. But once we get into policies, maybe it'll also become more clear. Okay, so now that we've talked about formulating the reinforcement learning problem, let's talk about actually representing behavior. So we want to map typically from states or observations to action.","zh":"如果你要包含大量历史信息，那么通过使用差异来压缩这些信息可能在很多情况下都有很大意义。但一旦我们进入策略部分，这可能也会变得更加清晰。好的，既然我们已经讨论了强化学习问题的建模，现在让我们谈谈如何实际表示行为。我们通常希望将状态或观察映射到动作。","start":2012.7,"end":2036.2}],"notes":["本段讨论了在强化学习中使用历史信息作为状态表示的利弊。讲者指出，虽然使用历史信息可以提供更丰富的状态表示，但需要考虑存储和计算成本。在某些情况下，即使传感器出现故障导致信息缺失，也可能仍然将其视为状态表示，因为这会影响算法的表现。","讲者提到，观察可以是当前所有信息，也可以是与前一观察的差异（delta）。这种选择取决于具体任务和算法需求，通常需要在信息完整性和计算效率之间进行权衡。","在机器人示例中，讲者强调了稀疏奖励的问题。如果奖励信号非常稀疏，那么在训练初期可能需要通过人工初始化来提供一些监督信号，以帮助算法更快地探索和学习。","讲者还提到，当传感器出现故障时，即使信息不完整，也可能将其视为状态表示。这表明在实际应用中，需要考虑传感器噪声和数据可靠性对状态表示的影响。","讲者指出，使用历史信息时，可以通过压缩（如使用delta）来减少计算负担。这种压缩方法在处理长期依赖或高维状态时可能特别有用。","最后，讲者提到，状态表示的选择通常取决于具体任务和算法需求，需要在信息完整性和计算效率之间进行权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1863.62,"end":2036.2,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1863.62,"text":"Now, you could potentially try to include a history of LiDAR information to get that velocity information, and then represent your state as a three-second history, for example. This will represent a theme, which is that typically to handle observations, we'll use a little bit of history, and then that can form your state representation. It's a little bit ambiguous in this particular case, and it comes down to the details."},{"start":1892.71,"text":"Yeah, so the question is, in the robot example, if the reward is 1 if it's on the hook and 0 otherwise, how do you actually learn? Because if you don't actually ever do that at any point, then you'll have very little supervision signal. You'll just have 0 reward all the time."},{"start":1909.14,"text":"And so in that particular video, we actually showed the robot how to do it a couple times as initialization, and that helped it with what we'll call exploration. And if you have very sparse rewards, rewards that have very little signal and are not kind of nicely shaped towards the goal, then usually that kind of data might be important for jump-starting the reinforcement learning process."},{"start":1937.07,"text":"Cool, cool. Yeah, so if folks couldn't hear that, you'd have this state being something like the HTML and the URL, information about the web page and where you're at. The action would be interacting with it, and the reward would be whether or not some task was completed. Yeah, so the question is, is basically everything an observation because sensors may not be perfect? So you could always choose to model something as an observation if you're worried about sensor noise or something like that."},{"start":1964.95,"text":"there are large, in some ways potentially large downsides to it if you need to add a lot of history. And so sometimes we will kind of approximately approximate something as the state, even if it might be lacking information. Like maybe, I don't know, once every 10,000 times the sensor fails and gives you a black image or something like that. Even though that would technically be..."},{"start":1991.95,"text":"like an observation case, you might still use it as a state representation because of how it affects the algorithms. Yeah, so if I understand correctly, you're asking for observations it could either be like everything currently or it could be a delta from the previous observation. Yeah, it would come out down to different trade-offs oftentimes."},{"start":2012.7,"text":"If you are going to be including a lot of history, then compressing it by using deltas could potentially make a lot of sense. But once we get into policies, maybe it'll also become more clear. Okay, so now that we've talked about formulating the reinforcement learning problem, let's talk about actually representing behavior. So we want to map typically from states or observations to action."}],"speech_gaps":[],"frame":"../frames/v019/012.webp","frame_time":1875.62},{"title":"强化学习中的策略与轨迹生成","segments":[{"id":142,"text":"And to do that, we'll use what's called a policy. And this policy will often use pi to denote a policy, or basically almost always use pi. And this can just be a neural network. In this case, it's a convolutional neural network. It could be a transformer. It could be like a simple, fully connected neural network. It could be a linear function. And this is going to be mapping from the states or observations or the sequence of observations to actions. We'll use...","zh":"为了做到这一点，我们将使用所谓的策略。这种策略通常用π来表示，几乎总是用π来表示。这可以只是一个神经网络。在这种情况下，它是一个卷积神经网络。它也可以是一个变压器。它也可以是一个简单的全连接神经网络。它也可以是一个线性函数。这将是从状态或观察值或观察值序列映射到动作的过程。我们将使用……","start":2037.15,"end":2065.24},{"id":143,"text":"typically theta to refer to the parameters of that neural network that you're trying to learn. And so then when you're actually using a policy to take actions, we'll then observe a state, take an action and observe a next state. And when we take actions, we're actually going to be sampling from our neural network. So we'll actually be running a forward pass to the neural network to select an action and then execute that action in the real world and observe the next state. Cool.","zh":"通常用θ来表示你试图学习的神经网络的参数。因此，当你实际使用策略来采取行动时，你将观察到一个状态，采取一个动作并观察到下一个状态。当你采取行动时，实际上是从我们的神经网络中进行采样。因此，我们将实际运行一次神经网络的前向传播来选择一个动作，然后在现实世界中执行该动作并观察到下一个状态。不错。","start":2065.57,"end":2096.01},{"id":144,"text":"And so the result of this process is a trajectory. And when we're using a policy to generate this trajectory, we often refer to it as a rollout or an episode. You can think of it as like kind of one episode of learning is like one attempt and then trying it again and again. And I guess the terminology rollout is in the sense that you're kind of sequentially going policy dynamics, policy dynamics. And so you're kind of rolling out this process to create a trajectory.","zh":"因此，这个过程的结果是一个轨迹。当我们使用策略来生成这个轨迹时，我们通常称之为一个rollout或一个episode。你可以把它想象成类似于一次学习尝试，然后反复尝试。我想术语rollout的含义是，你依次进行策略动态，策略动态。因此，你实际上是在滚动这个过程以创建一个轨迹。","start":2097.4,"end":2124.98},{"id":145,"text":"Great. And then if you only have observations and you don't have states, the solution is to give your policy memory. And so you can pass in multiple observations. Whereas if you only give it a state, you actually don't have to give it any memory and you can just give it as input state. This is very convenient because if you have a large amount of memory, it will take up a lot of memory on your computer or on your GPU. But if you...","zh":"很好。如果你只有观察值而没有状态，解决方案是给你的策略提供记忆。因此，你可以输入多个观察值。而如果你只提供一个状态，实际上你不需要提供任何记忆，只需将状态作为输入即可。这非常方便，因为如果你有大量记忆，它会占用你电脑或GPU上的大量内存。但如果你……","start":2128.52,"end":2156.22},{"id":146,"text":"only have observations, then you have in some ways no choice but to provide that memory to the policy. And for this, you may use sequence models, for example. In language models, you're going to be using sequence models that use the previous observations. Yeah, so the question is, is t the current time step or is it kind of...","zh":"只有观察值，那么在某种程度上你别无选择，只能将该记忆提供给策略。为此，你可能会使用序列模型，例如。在语言模型中，你将使用利用先前观察值的序列模型。是的，所以问题是，t是当前时间步还是……","start":2156.62,"end":2173.7},{"id":147,"text":"general from the beginning to the end. So this capital T I'm using to denote kind of the end of the trajectory, so the length, the number of states and actions in a trajectory. And then T I'm kind of referring to a given time step and this and kind of generalizing it so that you can think about this as happening at all time steps from lowercase t equals one to lowercase t equals capital T. Is it ever useful to condition it on both the observation and the state? So in this case,","zh":"从开始到结束的总体情况。所以我用大写的T来表示轨迹的结束，也就是轨迹的长度，即轨迹中状态和动作的数量。然后，我用T来指代一个特定的时间步，并对其进行一般化，使得你可以认为这种情况发生在所有时间步，从小写t等于一到小写t等于大写T。在这种情况中，将条件建立在观察和状态上是否有用？","start":2173.98,"end":2203.08}],"notes":["本段讲解了强化学习中策略的实现方式，包括使用神经网络（如卷积神经网络、Transformer、全连接网络或线性函数）来表示策略。策略将状态或观测序列映射到动作，并通过参数θ进行学习。在执行策略时，会通过前向传播从神经网络中采样动作，并在真实环境中执行以观察下一个状态。","课程提到轨迹（trajectory）的生成过程，通常称为rollout或episode，表示一次完整的尝试。rollout的术语来源于策略与环境动态的连续交互过程，即逐步展开策略以生成轨迹。","当只有观测而没有状态时，需要为策略提供记忆，即输入多个观测。这可以通过序列模型实现，例如语言模型会利用之前的观测信息。课程还讨论了时间步t的定义，区分了当前时间步和轨迹的总长度T。","课程进一步探讨了是否需要同时对观测和状态进行条件建模的问题，这涉及到策略设计中的状态表示与记忆机制的选择。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2037.15,"end":2203.08,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2037.15,"text":"And to do that, we'll use what's called a policy. And this policy will often use pi to denote a policy, or basically almost always use pi. And this can just be a neural network. In this case, it's a convolutional neural network. It could be a transformer. It could be like a simple, fully connected neural network. It could be a linear function. And this is going to be mapping from the states or observations or the sequence of observations to actions. We'll use..."},{"start":2065.57,"text":"typically theta to refer to the parameters of that neural network that you're trying to learn. And so then when you're actually using a policy to take actions, we'll then observe a state, take an action and observe a next state. And when we take actions, we're actually going to be sampling from our neural network. So we'll actually be running a forward pass to the neural network to select an action and then execute that action in the real world and observe the next state. Cool."},{"start":2097.4,"text":"And so the result of this process is a trajectory. And when we're using a policy to generate this trajectory, we often refer to it as a rollout or an episode. You can think of it as like kind of one episode of learning is like one attempt and then trying it again and again. And I guess the terminology rollout is in the sense that you're kind of sequentially going policy dynamics, policy dynamics. And so you're kind of rolling out this process to create a trajectory."},{"start":2128.52,"text":"Great. And then if you only have observations and you don't have states, the solution is to give your policy memory. And so you can pass in multiple observations. Whereas if you only give it a state, you actually don't have to give it any memory and you can just give it as input state. This is very convenient because if you have a large amount of memory, it will take up a lot of memory on your computer or on your GPU. But if you..."},{"start":2156.62,"text":"only have observations, then you have in some ways no choice but to provide that memory to the policy. And for this, you may use sequence models, for example. In language models, you're going to be using sequence models that use the previous observations. Yeah, so the question is, is t the current time step or is it kind of..."},{"start":2173.98,"text":"general from the beginning to the end. So this capital T I'm using to denote kind of the end of the trajectory, so the length, the number of states and actions in a trajectory. And then T I'm kind of referring to a given time step and this and kind of generalizing it so that you can think about this as happening at all time steps from lowercase t equals one to lowercase t equals capital T. Is it ever useful to condition it on both the observation and the state? So in this case,"}],"speech_gaps":[],"frame":"../frames/v019/013.webp","frame_time":2049.15},{"title":"状态与观测的区别","segments":[{"id":148,"text":"The state has strictly more information than the current observation, and so it isn't useful to add the observation if the state is truly the state that captures everything. So if we go back to this diagram, if we have states, then we only need to provide the current state, whereas if we have observations, that's where adding history is helpful. So it's a distinction between states and observations. Why is having history of observations helpful? Yeah.","zh":"状态包含的信息比当前观测要多得多，因此如果状态真正捕捉了所有信息，就不需要再添加观测。因此，如果我们回到这个图示，如果我们有状态，那么只需要提供当前状态；而如果我们有观测，那么添加历史信息是有帮助的。因此，这是状态和观测之间的区别。为什么拥有观测的历史信息是有帮助的？是的。","start":2204.04,"end":2233.26},{"id":149,"text":"Yeah, so basically the past observations will help give you more information about what f1 is. And so if you only have observations and you don't know what the underlying state of the world is, so as another example in language modeling, if you are having a conversation with a user, each thing that the user says is a different observation. And the past observations will actually tell you a lot about what the current state of the world is. So if their first question was like, can you write this piece of code to me? And then you maybe wrote some piece of code and they gave you some feedback.","zh":"是的，基本上，过去的观测可以帮助你获得关于f1的更多信息。因此，如果你只有观测，而不知道世界的真实状态，那么在语言建模中，例如，当你和用户进行对话时，用户说的每一句话都是不同的观测。而过去的观测实际上可以告诉你很多关于当前世界状态的信息。例如，如果他们第一次的问题是，你能给我写一段代码吗？然后你可能写了一段代码，他们给你了一些反馈。","start":2235.4,"end":2264.6},{"id":150,"text":"It's actually very important to include all those past observations to actually capture the full state of the world. I mean, that might not be true in all cases, but in many, many cases, the previous observations will also be useful for the current state.","zh":"实际上，包含所有这些过去的观测是非常重要的，这样才能真正捕捉世界的完整状态。我的意思是，这在所有情况下可能并不成立，但在许多情况下，之前的观测对于当前状态也是有用的。","start":2265.04,"end":2281.04},{"id":151,"text":"Yeah, so there also could be scenarios where you might want kind of a two-stage process, one where you first infer the state, and then a second process where you then predict the action from that state. If you have some idea for a good representation for the underlying state, then that sort of information could be useful in trying to model the underlying state. In other cases, it's simplest just to go straight from observation stack. Okay, moving on a little bit.","zh":"是的，也有可能存在一些场景，你可能想要一个两阶段的过程，第一阶段是推断状态，第二阶段是从该状态预测动作。如果你对底层状态有一个好的表示方法，那么这种信息在尝试建模底层状态时可能是有用的。在其他情况下，直接从观测堆栈进行处理是最简单的。好的，我们继续前进一点。","start":2281.93,"end":2310.84},{"id":152,"text":"We've talked about states, actions, policies. What is actually the goal of reinforcement learning? So our goal is to maximize reward. And so if we have a trajectory, we don't want to just optimize for the reward at one time step, but we want to optimize for having reward across the entire trajectory. And so we can represent this as maximizing the sum of rewards. Now, one thing that came up is that this is actually not a deterministic quantity.","zh":"我们已经讨论了状态、动作、策略。强化学习的实际目标是什么？我们的目标是最大化奖励。因此，如果我们有一个轨迹，我们不希望仅仅优化某一时间步的奖励，而是希望在整个轨迹中获得奖励。因此，我们可以将这一目标表示为最大化奖励的总和。现在，出现了一个问题，即这实际上并不是一个确定性的量。","start":2311.96,"end":2341.82},{"id":153,"text":"So if you have a policy and you're then executing that policy in the world, the reward that you get isn't always going to be the same every time you run your policy. And so a question for you, why is this not a deterministic quantity and what are the sources of variability that might cause the sum of rewards to differ from one trajectory to another trajectory?","zh":"如果你有一个策略，并在世界中执行该策略，你所获得的奖励并不总是每次运行策略时都相同。因此，一个问题是：为什么这不是一个确定性的量？可能导致不同轨迹之间奖励总和不同的变异性来源是什么？","start":2342.35,"end":2369.18}],"notes":["本段讨论了状态与观测之间的区别，指出状态包含比当前观测更多的信息，因此在状态已知的情况下，不需要额外添加观测。然而，当状态未知时，观测的历史信息对于理解当前状态非常重要。例如，在语言建模中，用户的对话历史可以提供关于当前世界状态的重要信息。","在某些情况下，可以采用两阶段过程：首先推断状态，然后根据该状态预测动作。如果对底层状态有良好的表示方法，这种信息可以用于建模底层状态。在其他情况下，直接从观测序列进行建模可能更简单。","强化学习的目标是最大化奖励，这不仅涉及单个时间步的奖励，还涉及整个轨迹的奖励总和。然而，由于策略执行过程中存在不确定性，奖励总和并不是一个确定性量。","奖励总和的非确定性来源于策略执行过程中的随机性，例如环境的随机性或动作的随机性。因此，不同轨迹的奖励总和可能会有所不同，这需要在设计强化学习算法时加以考虑。","在讨论中，讲者强调了观测历史的重要性，特别是在状态未知的情况下。同时，也提到在某些情况下，直接使用观测序列可能更有效，而不需要显式地建模状态。","最后，讲者提出了一个开放性问题，即为什么奖励总和不是一个确定性量，以及导致奖励总和差异的可能来源。这引导学生思考强化学习中的随机性和不确定性问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2204.04,"end":2369.18,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2204.04,"text":"the state has strictly more information than the current observation and so it isn't useful to add the observation if the state is truly the state that captures everything. So if we go back to this diagram, if we have states then we only need to provide the current state whereas if we have observations that's where adding history is helpful. So it's a distinction between states and observations. Why is having history of observations helpful? Yeah."},{"start":2235.4,"text":"Yeah, so basically the past observations will help give you more information about what f1 is. And so if you only have observations and you don't know what the underlying state of the world is, so as another example in language modeling, if you are having a conversation with a user, each thing that the user says is a different observation. And the past observations will actually tell you a lot about what the current state of the world is. So if their first question was like, can you write this piece of code to me? And then you maybe wrote some piece of code and they gave you some feedback."},{"start":2265.04,"text":"it's actually very important to include all those past observations to actually capture the full state of the world. I mean, that might not be true in all cases, but in many, many cases, the previous observations will also be useful for the current state."},{"start":2281.93,"text":"Yeah, so there also could be scenarios where you might want kind of a two-stage process, one where you first infer the state, and then a second process where you then predict the action from that state. If you have some idea for a good representation for the underlying state, then that sort of information could be useful in trying to model the underlying state. In other cases, it's simplest just to go straight from observation stack. Okay, moving on a little bit."},{"start":2311.96,"text":"We've talked about states, actions, policies. What is actually the goal of reinforcement learning? So our goal is to maximize reward. And so if we have a trajectory, we don't want to just optimize for the reward at one time step, but we want to optimize for having reward across the entire trajectory. And so we can represent this as maximizing the sum of rewards. Now, one thing that came up is that this is actually not a deterministic quantity."},{"start":2342.35,"text":"So if you have a policy and you're then executing that policy in the world, the reward that you get isn't always going to be the same every time you run your policy. And so a question for you, why is this not a deterministic quantity and what are the sources of variability that might cause the sum of rewards to differ from one trajectory to another trajectory?"}],"speech_gaps":[],"frame":"../frames/v019/014.webp","frame_time":2216.04},{"title":"强化学习中的随机性来源","segments":[{"id":154,"text":"Yeah, so one source of variability is that the state doesn't just depend on the action in the state, but there's also kind of randomness that can affect the next state. Other sources of variability, yeah. So your policy may not be deterministic either. So there's kind of two really key sources.","zh":"是的，所以一种变异性来源是，状态不仅仅取决于状态中的动作，还有一种随机性可能会影响下一个状态。其他变异性来源，是的。因此，你的策略也不一定是确定性的。所以，总的来说有两个非常关键的来源。","start":2370.32,"end":2386.19},{"id":155,"text":"Here's a good question. You might have a stochastic reward function. So typically we actually model the reward. There's a very interesting point. We often typically model it as deterministic, as a function, and kind of have the source of randomness come from states and actions. Now, if you don't know the state, then it could actually be viewed as stochastic if you only have the observations.","zh":"这里有一个好问题。你可能会有一个随机的奖励函数。通常我们实际上会建模奖励。有一个非常有趣的观点。我们通常将其建模为确定性的函数，并且将随机性的来源归因于状态和动作。现在，如果你不知道状态，那么它实际上可以被视为随机的，如果你只有观察结果的话。","start":2387.0,"end":2407.46},{"id":156,"text":"Right. So if you're doing reward learning, the question is, is there stochasticity there? Typically, you'll still model it as a reward function. So you might not have full certainty over exactly what the reward is. And perhaps you might want to leverage that uncertainty in some ways in the learning process. That's maybe something to take offline. There's some considerations there.","zh":"对的。所以在进行奖励学习时，问题是，那里是否存在随机性？通常，你仍然会将其建模为一个奖励函数。因此，你可能并不完全确定奖励的确切值。也许你希望在学习过程中利用这种不确定性。这可能是需要离线考虑的事情。有一些考虑因素。","start":2408.68,"end":2436.26},{"id":157,"text":"Yeah, so the other thing is your goals might change over time. And in that case, the reward function will change. We'll actually often model that as a whole different decision process at that point if the rewards change, rather than kind of having it being within the same one. Yeah, there are scenarios where you might want a non-stationary decision process, I guess.","zh":"是的，另一个问题是你的目标可能会随时间变化。在这种情况下，奖励函数也会变化。如果奖励发生变化，我们通常会将其建模为一个完全不同的决策过程，而不是将其包含在同一个过程中。是的，有一些场景你可能希望使用非平稳的决策过程，我想。","start":2437.08,"end":2459.76},{"id":158,"text":"And you can actually often put that randomness into the state instead of putting it in the reward function. Like maybe there's some underlying goal that you can't observe that's in the state. And then the reward function remains deterministic. And so, yeah, generally without losing generality, you can push that into the state if needed. Cool.","zh":"你实际上经常可以把这种随机性放到状态中，而不是放到奖励函数中。例如，可能存在一些你无法观察到的潜在目标，它存在于状态中。然后奖励函数保持确定性。因此，总的来说，如果不失去一般性，如果需要的话，你可以将这种随机性放到状态中。不错。","start":2461.7,"end":2481.34},{"id":159,"text":"The two main sources of variability that you have to worry about are the world is stochastic. So the environment, this is dynamic. This is a distribution. It's not a deterministic function. And the second is that the policy is also not deterministic. And so in driving, for example, other cars are going to behave in ways that are random. And your car might not make the same decision every time. Cool. And so if we actually want to think about maximizing rewards,","zh":"你需要注意的两个主要的变异性来源是世界具有随机性。因此，环境是动态的。这是一个分布。它不是一个确定性的函数。第二个原因是策略本身也不是确定性的。例如，在驾驶时，其他车辆的行为是随机的。你的车辆可能每次做出的决策也不相同。很好。因此，如果我们想要真正考虑最大化奖励，","start":2483.5,"end":2515.02},{"id":160,"text":"We can then add in the policy into this diagram where there's essentially, if you have access to state, there would be an error from here to here that is modeling this distribution and likewise from here to here. Now, if we then wanted to actually write down what rewards look like, we need to think about a probability distribution over trajectory. You need to think about like, what is...","zh":"我们就可以将策略加入到这个图示中。如果能够访问状态，那么从这里到这里的误差是在建模这个分布，同样地，从这里到这里也是如此。现在，如果我们想要实际写出奖励的表达形式，就需要考虑轨迹上的概率分布。你需要考虑的是，什么是……","start":2516.05,"end":2545.19}],"notes":["本段讨论了强化学习中随机性的两个主要来源：环境的随机性和策略的非确定性。环境的随机性意味着状态转移不是完全确定的，而是由某种概率分布决定的。策略的非确定性则意味着智能体在执行动作时可能不会每次都做出相同的决策。","讲者提到，通常将奖励函数建模为确定性函数，而随机性则来源于状态和动作。如果状态未知，那么奖励函数可能被视为随机的。此外，讲者还指出，在奖励学习中，即使奖励函数被建模为确定性，也可能存在不确定性，这种不确定性可以被利用来改进学习过程。","讲者进一步指出，目标可能会随时间变化，这会导致奖励函数的变化。在这种情况下，通常会将这种情况建模为一个不同的决策过程，而不是在同一个过程中处理。这表明强化学习需要处理非平稳环境的问题。","讲者还提到，随机性可以被归因于状态而不是奖励函数。例如，可能存在一些无法观测的潜在目标，这些目标会影响状态，但奖励函数仍然可以保持确定性。这种归因方式在不损失一般性的情况下是可行的。","讲者最后指出，环境的随机性意味着它是一个分布，而不是一个确定性函数。策略的非确定性意味着智能体的行为可能具有随机性，例如在驾驶场景中，其他车辆的行为可能是随机的，而智能体的决策也可能不一致。","讲者提到，为了最大化奖励，需要考虑策略和环境的随机性，并将这些随机性建模为概率分布。此外，还需要考虑轨迹的概率分布，这涉及到对整个学习过程的建模。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2370.32,"end":2545.19,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2370.32,"text":"Yeah, so one source of variability is that the state doesn't just depend on the action in the state, but there's also kind of randomness that can affect the next state. Other sources of variability, yeah. So your policy may not be deterministic either. So there's kind of two really key sources."},{"start":2387.0,"text":"Here's a good question. You might have a stochastic reward function. So typically we actually model the reward. There's a very interesting point. We often typically model it as deterministic, as a function, and kind of have the source of randomness come from states and actions. Now, if you don't know the state, then it could actually be viewed as stochastic if you only have the observations."},{"start":2408.68,"text":"Right. So if you're doing reward learning, the question is, is there stochasticity there? Typically, you'll still model it as a reward function. So you might not have full certainty over exactly what the reward is. And perhaps you might want to leverage that uncertainty in some ways in the learning process. That's maybe something to take offline. There's some considerations there."},{"start":2437.08,"text":"Yeah, so the other thing is your goals might change over time. And in that case, the reward function will change. We'll actually often model that as a whole different decision process at that point if the rewards change, rather than kind of having it being within the same one. Yeah, there are scenarios where you might want a non-stationary decision process, I guess."},{"start":2461.7,"text":"And you can actually often put that randomness into the state instead of putting it in the reward function. Like maybe there's some underlying goal that you can't observe that's in the state. And then the reward function remains deterministic. And so, yeah, generally without losing generality, you can push that into the state if needed. Cool."},{"start":2483.5,"text":"The two main sources of variability that you have to worry about are the world is stochastic. So the environment, this is dynamic. This is a distribution. It's not a deterministic function. And the second is that the policy is also not deterministic. And so in driving, for example, other cars are going to behave in ways that are random. And your car might not make the same decision every time. Cool. And so if we actually want to think about maximizing rewards,"},{"start":2516.05,"text":"We can then add in the policy into this diagram where there's essentially, if you have access to state, there would be an error from here to here that is modeling this distribution and likewise from here to here. Now, if we then wanted to actually write down what rewards look like, we need to think about a probability distribution over trajectory. You need to think about like, what is..."}],"speech_gaps":[],"frame":"../frames/v019/015.webp","frame_time":2382.32},{"title":"轨迹概率与目标最大化","segments":[{"id":161,"text":"Yeah, what is actually the kind of distribution over futures that we'll see? And the way that we can think about that is we'll have some initial state. There may actually also be randomness here that we haven't talked about, like the initial conditions of the world might change. And if you're like playing a game, for example, like how the cards are dealt out will vary. And then after the state, there is, you're going to be making a decision with your policy.","zh":"是的，我们实际上会看到什么样的未来分布呢？我们可以这样思考：我们会有一些初始状态。这里实际上可能还有我们尚未讨论的随机性，比如世界的初始条件可能会变化。例如，在玩游戏时，牌的发牌方式会有所不同。然后，在状态之后，你会根据你的策略做出决策。","start":2546.73,"end":2574.59},{"id":162,"text":"And then once you make that decision, there is randomness that arises from the dynamic. And then if we want to think about the probability of a given trajectory, it's going to be the probability of the first state, then the probability of taking the next action, then the probability of observing the next state, then the probability of taking the action after that, and then the next state, and so on. And so then we can think about...","zh":"一旦你做出这个决策，就会从动态中产生随机性。如果我们想要考虑给定轨迹的概率，那就是初始状态的概率，然后是采取下一个动作的概率，然后是观察到下一个状态的概率，接着是采取之后的动作的概率，以及下一个状态的概率，依此类推。因此，我们可以思考……","start":2576.04,"end":2604.29},{"id":163,"text":"the probability of a given trajectory as being the initial state probability plus the product of the probabilities from the policy and the dynamic, where here t equals 1 to capital T. And then once we formulate this probability distribution over trajectories, then we can think about maximizing reward.","zh":"给定轨迹的概率可以视为初始状态的概率加上从策略和动态中概率的乘积，其中 t 从 1 到大写 T。一旦我们制定了这个轨迹的概率分布，我们就可以考虑最大化奖励。","start":2605.06,"end":2631.43},{"id":164,"text":"as actually maximizing our expected rewards under this probability distribution. So we'll kind of think about the expectation of trajectories sampled from this distribution of the sum of like state and actions in this trajectory of the reward of that state.","zh":"实际上，这是在该概率分布下最大化我们的预期奖励。因此，我们会考虑从该分布中采样的轨迹的期望值，即该轨迹中状态和动作的奖励总和。","start":2632.09,"end":2662.86},{"id":165,"text":"And then this is our goal. Our goal is to maximize this. And our goal is to find a policy pie that maximizes these expected sum of awards. And so that is written right here. Now, note that unlike in supervised learning, we this doesn't look like something that you can like very like, well.","zh":"这就是我们的目标。我们的目标是最大化这个值。我们的目标是找到一个策略 π，以最大化这些预期奖励的总和。因此，这里写明了。请注意，与监督学习不同，我们这个并不像你能够非常像，很好。","start":2665.03,"end":2695.83},{"id":166,"text":"Pi actually doesn't even appear in this equation, but the way that it comes in is how it's affecting the trajectory. So this distribution of trajectories is a function of pi right here. And you actually want to find the policy that will lead to the highest reward. And a lot of this class will be figuring out how do we actually optimize behavior under this particular objective.","zh":"π 实际上甚至没有出现在这个方程中，但它是如何影响轨迹的，这就是它出现的方式。因此，这个轨迹的分布是 π 的函数。你实际上想要找到会导致最高奖励的策略。并且，这门课的很大一部分将是弄清楚我们如何在这一特定目标下优化行为。","start":2696.35,"end":2721.95}],"notes":["本段讲解了轨迹概率的计算方式，即初始状态概率乘以策略和动态的联合概率乘积，其中t从1到T。这表明轨迹的概率分布依赖于策略和环境动态的随机性。","接下来，课程指出强化学习的目标是最大化预期奖励，这需要在轨迹分布下计算所有状态和动作的奖励总和的期望值。这与监督学习不同，因为强化学习的目标是通过策略优化来最大化累积奖励。","课程提到，虽然方程中没有直接出现策略π，但策略通过影响轨迹分布来间接参与目标函数。因此，优化策略是寻找能够最大化预期奖励的策略。","课程强调，本课程将重点探讨如何在给定目标下优化行为，这涉及策略搜索、价值函数估计和环境建模等多个方面。","在讲解过程中，讲者提到“sum of awards”可能是指“sum of rewards”，但未明确确认，因此需注意术语的准确性。","讲者在描述目标函数时，使用了“pie”来指代“policy”，这可能是语音识别错误，需确认是否为“π”或“policy”的误听。"],"formulas":[{"latex":"P(trajectory) = P(initial state) \\times \\prod_{t=1}^{T} P(action_t | state_t) \\times P(state_{t+1} | action_t, state_t)","symbols":"轨迹概率由初始状态概率和策略与动态的联合概率乘积构成","explanation":"公式中的乘积符号已修正为标准数学符号，且明确表示了轨迹概率的构成，符合概率论中轨迹概率的定义。","evidence":"the probability of a given trajectory as being the initial state probability plus the product of the probabilities from the policy and the dynamic, where here t equals 1 to capital T. And then once we formulate this probability distribution over trajectories, then we can think about maximizing reward."},{"latex":"E[R] = \\mathbb{E}\\left[ \\sum_{t=1}^{T} R(state_t, action_t) \\right]","symbols":"预期奖励是轨迹中所有状态和动作的奖励总和的期望值","explanation":"公式中的期望符号已修正为标准数学符号，且明确表示了预期奖励的计算方式，符合强化学习中预期奖励的定义。","evidence":"as actually maximizing our expected rewards under this probability distribution. So we'll kind of think about the expectation of trajectories sampled from this distribution of the sum of like state and actions in this trajectory of the reward of that state."}],"uncertainties":["sum of awards 可能是 sum of rewards 的误听","pie 可能是 policy 的误听"],"diagram":"none","start":2546.73,"end":2721.95,"asr_flags":[],"math_clarifications":["公式中的乘积符号已修正为标准数学符号，且明确表示了轨迹概率的构成，符合概率论中轨迹概率的定义。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2546.73,"text":"Yeah, what is actually the kind of distribution over futures that we'll see? And the way that we can think about that is we'll have some initial state. There may actually also be randomness here that we haven't talked about, like the initial conditions of the world might change. And if you're like playing a game, for example, like how the cards are dealt out will vary. And then after the state, there is, you're going to be making a decision with your policy."},{"start":2576.04,"text":"And then once you make that decision, there is randomness that arises from the dynamic. And then if we want to think about the probability of a given trajectory, it's going to be the probability of the first state, then the probability of taking the next action, then the probability of observing the next state, then the probability of taking the action after that, and then the next state, and so on. And so then we can think about..."},{"start":2605.06,"text":"the probability of a given trajectory as being the initial state probability plus the product of the probabilities from the policy and the dynamic, where here t equals 1 to capital T. And then once we formulate this probability distribution over trajectories, then we can think about maximizing reward."},{"start":2632.09,"text":"as actually maximizing our expected rewards under this probability distribution. So we'll kind of think about the expectation of trajectories sampled from this distribution of the sum of like state and actions in this trajectory of the reward of that state."},{"start":2665.03,"text":"And then this is our goal. Our goal is to maximize this. And our goal is to find a policy pie that maximizes these expected sum of awards. And so that is written right here. Now, note that unlike in supervised learning, we this doesn't look like something that you can like very like, well."},{"start":2696.35,"text":"Pi actually doesn't even appear in this equation, but the way that it comes in is how it's affecting the trajectory. So this distribution of trajectories is a function of pi right here. And you actually want to find the policy that will lead to the highest reward. And a lot of this class will be figuring out how do we actually optimize behavior under this particular objective."}],"speech_gaps":[],"frame":"../frames/v019/016.webp","frame_time":2558.73},{"title":"强化学习中的奖励加权与策略随机性","segments":[{"id":167,"text":"The question is, does capital T have to be fixed? It does not have to be fixed. It can be variable. It's a little bit easier to write down if it's fixed. But you can also think about it as basically the length of the expression. Yeah, so one other topic that will come up in depth a lot more is...","zh":"问题是，资本T必须固定吗？它不必固定。它可以是变量。如果它是固定的，写起来会稍微容易一些。但你也可以把它看作是表达式的长度。是的，所以另一个将在以后深入讨论的主题是……","start":2722.96,"end":2744.1},{"id":168,"text":"When you think about rewards, this is weighting the rewards over the entire trajectory equally. And it's saying that you care about immediate reward just as much as you care about future rewards. And in some cases, you might care about immediate reward more than future reward. So, for example, if this T is like a thousand years, maybe you don't care so much about your rewards a thousand years from now than you care about your rewards today.","zh":"当你考虑奖励时，这是对整个轨迹上的奖励进行等权重的加权。它表示你对即时奖励和未来奖励同样重视。在某些情况下，你可能更重视即时奖励而不是未来奖励。例如，如果这个T是一千年后，你可能不太关心一千年后获得的奖励，而更关心今天获得的奖励。","start":2745.2,"end":2771.92},{"id":169,"text":"So another way that you can actually formulate the reinforcement learning objective is not just this kind of vanilla sum of rewards, but you can actually weight your rewards by what's called a discount factor, where that discount factor actually depends on t. So you actually, one of the ways we often do that is adding a discount factor that's raised to the power of t. And this means that if a discount factor, usually this is some value that's kind of","zh":"另一种可以实际表述强化学习目标的方式，不仅仅是这种普通的奖励总和，而是可以将奖励加权，这种加权被称为折扣因子，其中这个折扣因子实际上依赖于t。因此，我们经常采用的一种方法是添加一个被t次方的折扣因子。这意味着如果折扣因子，通常这是一个介于零和一之间的值。如果这个值是1，就和原始公式相同。而当你让它越来越小的时候，你会更加贪婪，更加重视近期的奖励而不是远期的奖励。","start":2773.98,"end":2800.88},{"id":170,"text":"greater than zero and less than or equal to one. If this is one, it's the same as the original formulation. And as you make it lower and lower, you're being more greedy. You're caring a lot more about near-term rewards than about far rewards. Yeah, we'll talk a little bit more about discount factors in a couple lectures. Cool. As an aside, we've talked about how our policy","zh":"是的，我们将在几节课后更详细地讨论折扣因子。顺便提一下，我们已经讨论过我们的策略是一个分布，因此它不是确定性的，而是随机的。为什么我们想要这样做呢？有几个原因让我们希望策略不是确定性的。第一个原因是，如果你想学习，你可能必须尝试不同的方法。例如，如果你想学习如何打网球，你可能不应该一遍又一遍地使用完全相同的技巧。你需要实际探索并尝试不同的策略才能做到这一点。","start":2803.64,"end":2833.68},{"id":171,"text":"is a distribution and so it's not deterministic, it's stochastic. Why might we want to do that? There's a couple reasons why we might want our policy to not be deterministic. The first is that if you want to learn, you probably have to try different things. Like if you're learning how to play tennis, you probably shouldn't try the same exact technique over and over again. You need to actually explore and try different strategies in order to do it.","zh":"是的，我们将在几节课后更详细地讨论折扣因子。顺便提一下，我们已经讨论过我们的策略是一个分布，因此它不是确定性的，而是随机的。为什么我们想要这样做呢？有几个原因让我们希望策略不是确定性的。第一个原因是，如果你想学习，你可能必须尝试不同的方法。例如，如果你想学习如何打网球，你可能不应该一遍又一遍地使用完全相同的技巧。你需要实际探索并尝试不同的策略才能做到这一点。","start":2834.38,"end":2861.96},{"id":172,"text":"That can be represented as a stochastic policy that's trying a few different strategies and trying to figure out which strategy is best. And then another case is there's scenarios where you collect data from people or from different systems, and those people are taking different strategies. And if you want to model the way that they're approaching a problem, you may need your policy to be stochastic as well.","zh":"这可以表示为一种随机策略，该策略尝试几种不同的策略，并试图找出哪种策略最好。另一种情况是，当你从人们或不同的系统中收集数据时，这些人们采取了不同的策略。如果你想建模他们解决问题的方式，你可能也需要你的策略是随机的。","start":2862.96,"end":2886.29}],"notes":["本段讨论了强化学习中奖励加权的问题，指出传统的奖励总和形式是将所有轨迹上的奖励等权重，而通过引入折扣因子可以调整对不同时间点奖励的重视程度。折扣因子通常是一个介于0和1之间的值，当其等于1时，等同于原始的无折扣形式；当其减小时，模型会更加关注近期奖励，表现出更贪心的行为。","讲者提到折扣因子依赖于时间步t，并且通过将折扣因子提升到t次方来实现对奖励的加权。这种机制允许模型在不同时间点上对奖励进行不同的重视程度，从而影响策略的长期规划能力。","在讨论策略的随机性时，讲者指出策略可以是随机的（stochastic），而非确定性的（deterministic）。随机策略有助于探索，避免重复相同的动作，从而在学习过程中发现更优的策略。","讲者还提到，当从人类或其他系统中收集数据时，这些数据可能来自不同的策略，因此需要使用随机策略来建模这些行为模式。","讲者强调，随机策略在强化学习中具有实际意义，特别是在需要探索和适应不同策略的场景中，随机性有助于模型更好地理解和优化其行为。","本段内容涉及强化学习中的核心概念，包括奖励加权、折扣因子、策略的随机性及其在实际应用中的重要性。"],"formulas":[],"uncertainties":["discount factor, usually this is some value that's kind of"],"diagram":"none","start":2722.96,"end":2886.29,"asr_flags":[],"math_clarifications":["公式中的总奖励表达式不完整，缺少了求和符号的上下限和正确的数学符号。此外，公式中未明确说明折扣因子ρ的取值范围（0 \u003c ρ ≤ 1）以及其对奖励的加权方式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2722.96,"text":"The question is, does capital T have to be fixed? It does not have to be fixed. It can be variable. It's a little bit easier to write down if it's fixed. But you can also think about it as basically the length of the expression. Yeah, so one other topic that will come up in depth a lot more is..."},{"start":2745.2,"text":"When you think about rewards, this is weighting the rewards over the entire trajectory equally. And it's saying that you care about immediate reward just as much as you care about future rewards. And in some cases, you might care about immediate reward more than future reward. So, for example, if this T is like a thousand years, maybe you don't care so much about your rewards a thousand years from now than you care about your rewards today."},{"start":2773.98,"text":"So another way that you can actually formulate the reinforcement learning objective is not just this kind of vanilla sum of rewards, but you can actually weight your rewards by what's called a discount factor, where that discount factor actually depends on t. So you actually, one of the ways we often do that is adding a discount factor that's raised to the power of t. And this means that if a discount factor, usually this is some value that's kind of"},{"start":2803.64,"text":"greater than zero and less than or equal to one. If this is one, it's the same as the original formulation. And as you make it lower and lower, you're being more greedy. You're caring a lot more about near-term rewards than about far rewards. Yeah, we'll talk a little bit more about discount factors in a couple lectures. Cool. As an aside, we've talked about how our policy"},{"start":2834.38,"text":"is a distribution and so it's not deterministic, it's stochastic. Why might we want to do that? There's a couple reasons why we might want our policy to not be deterministic. The first is that if you want to learn, you probably have to try different things. Like if you're learning how to play tennis, you probably shouldn't try the same exact technique over and over again. You need to actually explore and try different strategies in order to do it."},{"start":2862.96,"text":"That can be represented as a stochastic policy that's trying a few different strategies and trying to figure out which strategy is best. And then another case is there's scenarios where you collect data from people or from different systems, and those people are taking different strategies. And if you want to model the way that they're approaching a problem, you may need your policy to be stochastic as well."}],"speech_gaps":[],"frame":"../frames/v019/017.webp","frame_time":2734.96},{"title":"强化学习中的价值函数与策略优化方法","segments":[{"id":173,"text":"Okay, and for this, we can also leverage tools from generative models where you're actually thinking about not just a neural network that maps from A to B, but actually a generative model over action given state and observation. I think this is the last thing we'll touch on and introduce, which is how do we decide how good... Well, okay, second to last thing. How do we decide how good a policy is?","zh":"好的，对于这一点，我们也可以利用生成模型中的工具，其中你不仅仅是在考虑一个从A映射到B的神经网络，而是在考虑一个基于状态和观测的生成模型来生成动作。我认为这是我们最后要讨论并引入的内容，即如何决定一个策略有多好……好吧，是倒数第二个内容。如何决定一个策略有多好？","start":2888.75,"end":2911.73},{"id":174,"text":"And this is really useful to think about because if you don't know how good your policy is, then you're not going to be able to make your policy better. And the terminology that we use to think about this is referred to as a value function. So we often think about the value function for a policy of a given state, and we denote it typically as v pi of s. And essentially what this means is it's the","zh":"思考这一点是非常有用的，因为如果你不知道自己的策略有多好，你就无法改进你的策略。我们用来思考这个问题的术语被称为价值函数。我们通常会考虑一个策略在给定状态下的价值函数，并通常将其表示为vπ(s)。其本质含义是，如果你从状态s开始，然后按照策略π继续执行，那么未来期望的奖励。因此，这基本上就是这个方程，只不过是从当前策略下的状态s开始。类似地，我们接下来也会讨论另一种函数，不过不是在周五的课程中，而是在下周开始，即Q值函数。","start":2912.64,"end":2941.18},{"id":175,"text":"future expected reward if you start at s and then follow pi from then onward. And so it's basically this equation except starting at s under your current policy. And similarly to this, another thing that we'll start talking about, not in Friday's lecture but starting next week, is Q-value functions as well.","zh":"这与价值函数非常相似，但不同之处在于，你不是从状态s开始，而是从状态s开始，采取动作a，然后按照策略π继续执行，其中动作a可能与策略π所采取的动作不同。今天我不会深入讲解这两种函数，但我希望介绍它们，因为我们将在未来的课程中大量使用它们。因此，开始理解它们的含义是有益的。","start":2942.0,"end":2966.94},{"id":176,"text":"And this is very similar to the value function, but instead of starting at s, you're actually starting from s, then taking action a, and then following pi, where action a might be different from what policy pi might have taken. I'm not going to go into depth on what these two functions are today, but I wanted to introduce them because we'll be using them quite a lot. And so it's good to start wrapping your head around what they are as we start to use them more in future lectures.","zh":"好的，然后我们将会讨论的算法类型。模仿学习的核心思想是模仿一个能够获得高奖励的策略。下周我们将开始讨论策略梯度方法，这些方法试图直接对这个目标进行微分，并从实践和经验中进行学习。从那里开始，我们将讨论实际的批评者算法，这些算法估计当前策略的价值，并利用这些信息来改进策略。","start":2967.42,"end":2997.02},{"id":177,"text":"Okay, and then the types of algorithms we'll cover. The idea behind imitation learning is to mimic a policy that achieves high reward. We'll then next week start talking about policy gradients that try to directly differentiate this objective and actually learn from practice and experience. From there, we'll talk about actual critic algorithms that estimate the value of the current policy and use that to make the policy better.","zh":"好的，然后我们将会讨论的算法类型。模仿学习的核心思想是模仿一个能够获得高奖励的策略。下周我们将开始讨论策略梯度方法，这些方法试图直接对这个目标进行微分，并从实践和经验中进行学习。从那里开始，我们将讨论实际的批评者算法，这些算法估计当前策略的价值，并利用这些信息来改进策略。","start":2999.47,"end":3022.87},{"id":178,"text":"We'll talk about value-based methods that try to estimate the value of the optimal policy and then use that to back out a good policy. And then lastly, we'll talk about model-based methods that actually learn how to model the dynamics of the world, like try to predict the future and then use that to improve the policy or for planning. Now, you might be wondering, why do we have so many different algorithms for optimizing this objective? In supervised learning, we just have gradient descent. It works. It's great. It's simple.","zh":"我们将讨论基于价值的方法，这些方法试图估计最优策略的价值，然后利用这些信息推导出一个良好的策略。最后，我们将讨论基于模型的方法，这些方法实际上学习如何建模世界的动态，例如尝试预测未来状态，然后利用这些信息来改进策略或进行规划。现在，你可能会想，为什么我们有这么多不同的算法来优化这个目标？在监督学习中，我们只需要梯度下降。它有效，很好，也很简单。","start":3025.02,"end":3053.46}],"notes":["本段介绍了强化学习中价值函数的概念，即用于评估策略好坏的函数。价值函数表示在给定状态下，按照当前策略执行所能获得的未来期望奖励。这是强化学习中非常核心的概念，用于指导策略的优化。","Q值函数与价值函数类似，但Q值函数考虑了在特定状态下采取特定动作后的期望奖励。这为策略优化提供了更细粒度的信息，帮助选择更优的动作。","课程中提到了多种强化学习算法，包括模仿学习、策略梯度、批评家算法、基于价值的方法和基于模型的方法。这些方法各有特点，适用于不同的任务和场景。","课程还解释了为何存在多种优化策略，这与监督学习中仅使用梯度下降不同。强化学习问题的复杂性要求不同的方法来处理不同的挑战。","在介绍这些方法时，讲者强调了它们在实际应用中的重要性，并指出这些方法将在后续课程中详细展开。","讲者提到，理解这些概念对于后续课程的学习至关重要，因此鼓励学生提前思考这些概念的含义和应用场景。"],"formulas":[{"latex":"v_{\\pi}(s)","symbols":"价值函数","explanation":"表示在状态 $ s $ 下，遵循策略 $ \\\\_pi $ 的未来期望奖励。","evidence":"And this is really useful to think about because if you don't know how good your policy is, then you're not going to be able to make your policy better. And the terminology that we use to think about this is referred to as a value function. So we often think about the value function for a policy of a given state, and we denote it typically as v pi of f. And essentially what this means is it's the"},{"latex":"Q_{\\pi}(s, a)","symbols":"Q值函数","explanation":"表示在状态 $ s $ 下采取动作 $ a $，然后遵循策略 $ \\\\_pi $ 的未来期望奖励。","evidence":"future expected reward if you start at s and then follow pi from then onward. And so it's basically this equation except starting at s under your current policy. And similarly to this, another thing that we'll start talking about, not in Friday's lecture but starting next week, is Q-value functions as well."}],"uncertainties":[],"diagram":"none","start":2888.75,"end":3053.46,"asr_flags":[],"math_clarifications":["原文中未提供完整的数学公式，仅提及了价值函数和Q值函数的符号表示。因此，这些符号的定义和公式需要根据上下文进行补充，但根据常规强化学习定义，价值函数 $ v_{\\pi}(s) $ 和Q值函数 $ Q_{\\pi}(s, a) $ 是标准的表示方式。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2888.75,"text":"Okay, and for this, we can also leverage tools from generative models where you're actually thinking about not just a neural network that maps from A to B, but actually a generative model over action given state and observation. I think this is the last thing we'll touch on and introduce, which is how do we decide how good... Well, okay, second to last thing. How do we decide how good a policy is?"},{"start":2912.64,"text":"And this is really useful to think about because if you don't know how good your policy is, then you're not going to be able to make your policy better. And the terminology that we use to think about this is referred to as a value function. So we often think about the value function for a policy of a given state, and we denote it typically as v pi of f. And essentially what this means is it's the"},{"start":2942.0,"text":"future expected reward if you start at s and then follow pi from then onward. And so it's basically this equation except starting at s under your current policy. And similarly to this, another thing that we'll start talking about, not in Friday's lecture but starting next week, is Q-value functions as well."},{"start":2967.42,"text":"And this is very similar to the value function, but instead of starting at s, you're actually starting from s, then taking action a, and then following pi, where action a might be different from what policy pi might have taken. I'm not going to go into depth on what these two functions are today, but I wanted to introduce them because we'll be using them quite a lot. And so it's good to start wrapping your head around what they are as we start to use them more in future lectures."},{"start":2999.47,"text":"Okay, and then the types of algorithms we'll cover. The idea behind imitation learning is to mimic a policy that achieves high reward. We'll then next week start talking about policy gradients that try to directly differentiate this objective and actually learn from practice and experience. From there, we'll talk about actual critic algorithms that estimate the value of the current policy and use that to make the policy better."},{"start":3025.02,"text":"We'll talk about value-based methods that try to estimate the value of the optimal policy and then use that to back out a good policy. And then lastly, we'll talk about model-based methods that actually learn how to model the dynamics of the world, like try to predict the future and then use that to improve the policy or for planning. Now, you might be wondering, why do we have so many different algorithms for optimizing this objective? In supervised learning, we just have gradient descent. It works. It's great. It's simple."}],"speech_gaps":[],"frame":"../frames/v019/018.webp","frame_time":2900.75},{"title":"强化学习算法选择与基本概念介绍","segments":[{"id":179,"text":"In reinforcement learning, things are less simple. Algorithms make different trade-offs and thrive under different assumptions. And so it's going to depend on, for example, how easy or cheap is it to collect data. And if you're in a simulator, for example, it's really, really cheap to collect lots of data versus if you're handwriting kind of responses or handwriting, like actually interacting with a person that's writing things, that's going to be more expensive.","zh":"在强化学习中，情况并不简单。算法在不同方面做出不同的权衡，并在不同的假设下表现良好。因此，它将取决于，例如，收集数据是容易还是便宜。例如，在模拟器中，收集大量数据是非常便宜的，而如果你是在手写响应或实际与一个正在书写内容的人互动，这将会更加昂贵。","start":3055.21,"end":3079.49},{"id":180,"text":"Also, how cheap and easy are different forms of supervision? Do you have demonstrations? Do you have detailed rewards? How important is stability and ease of use versus data efficiency? Maybe you have more time to change some of the hyperparameters if it doesn't need massive amounts of data. There's also some considerations with regard to what your actions look like. How high dimensional are they? Are they continuous or discrete? Is it easy to learn the dynamics model?","zh":"此外，不同形式的监督便宜且容易吗？你是否有演示？你是否有详细的奖励？稳定性与易用性与数据效率哪个更重要？也许如果你不需要大量的数据，你就有更多的时间去调整一些超参数。还有一些关于你的动作形式的考虑。它们的维度有多高？是连续的还是离散的？学习动力学模型是否容易？","start":3081.33,"end":3107.83},{"id":181,"text":"So yeah, these are some of the reasons why we have a lot of different algorithms, and we'll be talking about different algorithms and where they're applied in the later parts of this course. Okay, so to recap, there's a lot of terminology and a lot of notation in reinforcement learning, and I wanted to start introducing them today because we'll be starting to use them quite a bit in the following lectures. So we talked about states, we talked about observations, we talked about actions, reward functions, and also initial state distribution and dynamics.","zh":"所以，这些就是我们拥有许多不同算法的一些原因，我们将在本课程的后半部分讨论不同的算法及其应用场景。好的，那么为了回顾，强化学习中有很多术语和符号，我想今天开始介绍它们，因为我们在接下来的讲座中会大量使用它们。我们讨论了状态、观察、动作、奖励函数，以及初始状态分布和动力学。","start":3109.18,"end":3136.77},{"id":182,"text":"These form what's called a Markov decision process, or if you only have observations, it's called a partially observed Markov decision process, or an MDP or a POMDP. I didn't want to bring in this notation until the very end because it doesn't actually really matter what it's called, but it's useful in the long term if people are referring to MDPs. Now you know what they're referring to. They're referring to this formulation of a reinforcement learning problem.","zh":"这些构成了所谓的马尔可夫决策过程，或者如果你只有观察，它被称为部分可观测马尔可夫决策过程，或简称MDP或POMDP。我不想在最后才引入这种符号，因为实际上它叫什么并不重要，但如果人们在长期中提到MDP，这种符号是有用的。现在你知道他们在说什么了。他们指的是这种强化学习问题的表述。","start":3137.66,"end":3162.72},{"id":183,"text":"And then we also talked about trajectories, policies, the objective of reinforcement learning, value functions, and Q functions briefly.","zh":"我们还讨论了轨迹、策略、强化学习的目标、价值函数和Q函数。","start":3164.82,"end":3171.84}],"notes":["本段主要讲解了强化学习算法选择时需要考虑的多个因素，包括数据收集成本、监督形式（如演示和奖励）、稳定性与数据效率之间的权衡，以及动作的维度和类型。这些因素决定了不同算法的适用场景。","讲者提到，强化学习中存在多种算法，因为不同的问题需要不同的假设和权衡。例如，在模拟器中收集数据成本低，而在实际交互中成本较高。此外，动作的高维性、连续性或离散性也会影响算法的选择。","在介绍基本概念时，讲者提到了状态、观察、动作、奖励函数、初始状态分布和动态模型等术语，并指出这些构成了马尔可夫决策过程（MDP）或部分可观测马尔可夫决策过程（POMDP）。","讲者强调了术语和符号的重要性，并指出在后续课程中会频繁使用这些概念。同时，讲者提到MDP的命名虽然不重要，但有助于后续讨论。","最后，讲者简要提到了轨迹、策略、强化学习的目标、价值函数和Q函数等概念，为后续课程内容做了铺垫。","这些内容为理解强化学习的基本框架和算法选择提供了基础，帮助学习者在后续学习中更好地理解不同算法的适用条件和设计思路。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3055.21,"end":3171.84,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3055.21,"text":"In reinforcement learning, things are less simple. Algorithms make different trade-offs and thrive under different assumptions. And so it's going to depend on, for example, how easy or cheap is it to collect data. And if you're in a simulator, for example, it's really, really cheap to collect lots of data versus if you're handwriting kind of responses or handwriting, like actually interacting with a person that's writing things, that's going to be more expensive."},{"start":3081.33,"text":"Also, how cheap and easy are different forms of supervision? Do you have demonstrations? Do you have detailed rewards? How important is stability and ease of use versus data efficiency? Maybe you have more time to change some of the hyperparameters if it doesn't need massive amounts of data. There's also some considerations with regard to what your actions look like. How high dimensional are they? Are they continuous or discrete? Is it easy to learn the dynamics model?"},{"start":3109.18,"text":"So yeah, these are some of the reasons why we have a lot of different algorithms, and we'll be talking about different algorithms and where they're applied in the later parts of this course. Okay, so to recap, there's a lot of terminology and a lot of notation in reinforcement learning, and I wanted to start introducing them today because we'll be starting to use them quite a bit in the following lectures. So we talked about states, we talked about observations, we talked about actions, reward functions, and also initial state distribution and dynamics."},{"start":3137.66,"text":"These form what's called a Markov decision process, or if you only have observations, it's called a partially observed Markov decision process, or an MDP or a POMDP. I didn't want to bring in this notation until the very end because it doesn't actually really matter what it's called, but it's useful in the long term if people are referring to MDPs. Now you know what they're referring to. They're referring to this formulation of a reinforcement learning problem."},{"start":3164.82,"text":"And then we also talked about trajectories, policies, the objective of reinforcement learning, value functions, and Q functions briefly."}],"speech_gaps":[],"frame":"../frames/v019/019.webp","frame_time":3067.21}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v019.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}

oint.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
