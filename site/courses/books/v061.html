in getting a lot more of, that's really important to being efficient in how you improve the system performance. That make sense? All right. Well, we'll talk more about error analysis in this later. Any other questions? Cool.","zh":"是的。我觉得更多的数据更好。这绝对是正确的，但这也过于简单化了。数据并不是单一的。存在数据的子类别，拥有对哪些数据进行大量投资的清晰观点，对于如何高效地提升系统性能非常重要。这有道理吗？好的。我们之后会更多地讨论错误分析。还有其他问题吗？很好。","start":1812.75,"end":1843.63},{"id":185,"text":"All right, yeah, go for it. Yeah, right. So as you collect data, the quality of data matters a lot too, which is why, and I think data quality is...","zh":"好的，是的，去吧。是的，对的。所以在你收集数据时，数据的质量也很重要，这就是为什么，我认为数据质量是……","start":1845.64,"end":1868.23},{"id":186,"text":"It's tricky, I think. When building an application for the first time, I would still focus on speed and collecting some data quickly. But as you then analyze where your system is going well and what it's doing poorly, you often find that the quality of data really matters. So I'm trying to decide if I should talk about this now or later.","zh":"我觉得这有点棘手。第一次构建应用程序时，我仍然会关注速度并快速收集一些数据。但当你分析你的系统在哪些方面表现良好、哪些方面表现不佳时，你经常会发现数据的质量真的很重要。因此，我正在考虑是现在讨论这个问题还是稍后再讨论。","start":1869.07,"end":1890.82},{"id":187,"text":"I'll come back, so let's see, let's go to that.","zh":"我之后会再回来，所以让我们看看，我们先去那里。","start":1895.69,"end":1898.17},{"id":188,"text":"All right, let me talk about LLM1.","zh":"好的，让我谈谈LLM1。","start":1898.35,"end":1899.91}],"notes":["本段主要讨论在深度学习项目中，数据质量与数据子类别的选择对系统性能提升的重要性。讲者指出，单纯增加数据量并不是最有效的方式，而是需要识别出对系统性能提升有价值的子类别数据。例如，在大型语言模型（LLMs）中，有两个主要的价值领域：一是回答一般性问题，二是用于编程的AI系统。讲者强调，高质量的数据是提升模型性能的关键，而不是盲目地收集各种类型的数据。","讲者提到，数据并不是单一的，而是有多个子类别，因此需要明确哪些子类别的数据值得投资。例如，在编程相关的AI系统中，高质量的编程数据比社交媒体或随机网络聊天数据更有价值。讲者还指出，数据质量在系统性能提升中起着至关重要的作用，尤其是在分析系统表现时，数据质量的差异会直接影响模型的性能。","讲者提到，在构建应用的初期，可能会优先考虑速度和快速收集数据，但随着系统分析的深入，数据质量的重要性会逐渐显现。因此，讲者决定在后续内容中进一步讨论数据质量的问题。","讲者还提到，数据子类别的选择和数据质量的重视是提升系统性能的关键因素。例如，在编程相关的AI系统中，高质量的编程数据是提升模型能力的核心，而不是盲目地收集各种类型的数据。","讲者强调，数据的子类别和质量是深度学习项目中需要重点关注的问题。在实际应用中，需要根据系统的具体需求，选择合适的子类别数据，并确保数据的质量，以提高模型的性能。","讲者最后提到，他将回到数据质量的问题，并继续讨论相关内容。这表明，数据质量是深度学习项目中一个重要的主题，需要在后续内容中进一步展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1722.57,"end":1899.91,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":1722.57,"text":"yes, of course I want more data, but just grabbing more data of all types of data is a very inefficient, very expensive way to improve my system. And even if you look at the way that frontier models are trained right now, it's not a game of just grabbing more data of anything under the sun. It is identifying the subcategories where it's valuable to invest to get high quality data, which is why if you look at..."},{"start":1747.82,"text":"It turns out in AI, there are two clear buckets of value in LLMs, right? There's the general answering people's questions. I think, you know, OpenAI Chakri is doing really well there. Gemini, Anthropic have momentum, but there's the answering general questions. And then one of the verticals that's really valuable is AI for coding a system. So I think, you know, Claude has been ahead for a while, but OpenAI..."},{"start":1771.8,"text":"Gemini 2.5 Pro, some of the models are making really good progress in coding as well. And if you look at the work that the frontier teams are doing to improve coding, building iterative agentic workflows is part of it, but also finding clever ways to come up with coding-related data is also part of it. And if you want your alum to do better in coding, you don't grab data willingly with low-quality random internet chat."},{"start":1798.7,"text":"social media or whatever data, right? But instead, having high quality coding related data is how you can have a focus effort to improve your own ability to code. So a lot of these things are actually..."},{"start":1812.75,"text":"Yeah. I feel like more data is better. That is absolutely true, but it's also overly simplistic. Data is not monolithic. There are subcategories of data, and having a view on what piece of data to really invest in getting a lot more of, that's really important to being efficient in how you improve the system performance. That make sense? All right. Well, we'll talk more about error analysis in this later. Any other questions? Cool."},{"start":1845.64,"text":"All right, yeah, go for it. Yeah, right. So as you collect data, the quality of data matters a lot too, which is why, and I think data quality is..."},{"start":1869.07,"text":"It's tricky, I think. When building an application for the first time, I would still focus on speed and collecting some data quickly. But as you then analyze where your system is going well and what it's doing poorly, you often find that the quality of data really matters. So I'm trying to decide if I should talk about this now or later."},{"start":1895.69,"text":"I'll come back, so let's see, let's go to that."},{"start":1898.35,"text":"All right, let me talk about LLM1."}],"speech_gaps":[],"frame":"../frames/v061/011.webp","frame_time":1734.57},{"title":"数据质量与分布匹配的重要性","segments":[{"id":189,"text":"There's a lot of low-quality random chat on the internet","zh":"互联网上有很多低质量的随机聊天内容","start":1900.63,"end":1904.33},{"id":190,"text":"that's not that useful for training LLMs.","zh":"这对训练大语言模型并不是特别有用。","start":1904.33,"end":1906.65},{"id":191,"text":"But I think, you know, this is actually now well-known","zh":"但我认为，你知道的，这其实现在已经众所周知","start":1906.89,"end":1910.07},{"id":192,"text":"that if you can legally access very high-quality","zh":"如果你能够合法访问非常高质量的","start":1910.07,"end":1913.21},{"id":193,"text":"written, authored articles or books,","zh":"撰写、作者撰写的文章或书籍，","start":1914.45,"end":1916.63},{"id":194,"text":"they're highly edited, very insightful,","zh":"它们经过高度编辑，非常有洞察力，","start":1916.83,"end":1918.53},{"id":195,"text":"that's very high-quality data for training LLMs.","zh":"这对训练大语言模型来说是非常高质量的数据。","start":1918.77,"end":1920.97},{"id":196,"text":"And I'll give an example later as well for face recognition.","zh":"我稍后也会举一个面部识别的例子。","start":1921.53,"end":1924.43},{"id":197,"text":"It turns out that blurry images would be a lower quality than sharp and focused images,","zh":"事实证明，模糊的图像质量会比清晰且聚焦的图像更低。","start":1924.43,"end":1932.85},{"id":198,"text":"assuming that's representative of how you want to recognize people's faces.","zh":"假设这能代表你希望如何识别人们的面孔。","start":1932.97,"end":1936.61},{"id":199,"text":"So that really matters as well.","zh":"因此，这也非常重要。","start":1936.93,"end":1938.85},{"id":200,"text":"All right, anything else?","zh":"好了，还有其他问题吗？","start":1939.79,"end":1941.27},{"id":201,"text":"Cool.","zh":"酷。","start":1943.99,"end":1944.59},{"id":202,"text":"All right, oh yeah, go for it.","zh":"好了，哦对了，去吧。","start":1947.03,"end":1948.39},{"id":203,"text":"Yeah, so right, just repeat for Mike.","zh":"是的，所以对，再重复一遍给Mike。","start":1967.49,"end":1977.51},{"id":204,"text":"Mike, how important is it that the data you collect is similar to the distribution of","zh":"Mike，你收集的数据与分布相似性有多重要？","start":1977.51,"end":1982.21},{"id":205,"text":"things you want to work on?","zh":"你想先做什么？","start":1982.21,"end":1983.39},{"id":206,"text":"I think it's important, but not as important as most people might think.","zh":"我认为这很重要，但可能没有大多数人想象的那么重要。","start":1984.61,"end":1989.21},{"id":207,"text":"So it turns out that one of the reasons neural networks have been so effective is because","zh":"结果发现，神经网络之所以如此有效的一个原因是","start":1990.43,"end":1998.45},{"id":208,"text":"when you build a very large neural network, you can throw all sorts of data into it, including","zh":"当你构建一个非常大的神经网络时，你可以将各种各样的数据输入其中，包括","start":1998.45,"end":2003.37},{"id":209,"text":"including data that is not perfectly tuned to your test set distribution,","zh":"包括那些没有完全匹配你测试集分布的数据，","start":2003.37,"end":2009.69},{"id":210,"text":"and it often doesn't hurt,","zh":"而这通常不会造成伤害，","start":2010.01,"end":2012.19},{"id":211,"text":"so lots of network is bigger.","zh":"所以网络越大越好。","start":2012.31,"end":2013.51},{"id":212,"text":"So you raise the example, what if we haven't identified two identical objects? If it's generic objects like water bottles and markers, maybe that's too far afield. But if we were to use, let's say, simulated cartoonish characters that look really different than real humans, my guess is it probably won't hurt.","zh":"因此你提出了一个例子，如果我们没有识别出两个完全相同的物体呢？如果是像水瓶和记号笔这样的通用物体，也许这离得太远了。但如果使用像模拟的卡通人物这样的对象，它们看起来与真实人类差别很大，我的猜测是这可能不会造成伤害。","start":2014.07,"end":2034.99},{"id":213,"text":"at all, and it may even help a little bit. And so throwing in a lot of data, if we train a large neural network with a lot of capacity to absorb even some slightly irrelevant data, it usually doesn't hurt and might even help a little bit. But how much it helps is another empirical question that will be problem dependent, and we often just have to try it out. But I think...","zh":"总的来说，这并不会造成伤害，甚至可能有一点帮助。因此，如果我们训练一个具有大量容量的大型神经网络，使其能够吸收甚至一些略微不相关的数据，通常不会造成伤害，甚至可能有一点帮助。但这种帮助有多大，是另一个需要实证研究的问题，具体取决于问题本身，我们通常只能通过尝试来确定。但我想...","start":2035.56,"end":2058.22},{"id":214,"text":"Maybe, you know, like in the past, people used to have an obsession that the data you train on has to come from exactly the same distribution as the distribution you test on. That used to be how machine learning was done, I don't know, like 10, 15 years ago. That's really not true today anymore. I think we're very comfortable. And I think when your networks were much smaller, when you could train very small models,","zh":"也许，就像过去一样，人们曾经有一种执念，认为用于训练的数据必须来自与测试数据完全相同的分布。这在过去，比如10到15年前，是机器学习的常规做法。但如今这已经不再真实了。我认为我们现在已经非常适应了。而且我认为当你的网络还很小，当你只能训练非常小的模型时，","start":2058.43,"end":2080.47}],"notes":["本段讨论了数据质量对训练大型神经网络的影响。讲者指出，虽然数据与测试分布的匹配性重要，但并非像过去那样严格要求。大型神经网络可以处理不完全匹配的数据，且通常不会造成伤害，甚至可能有所帮助。","讲者提到，过去人们认为训练数据必须与测试数据来自完全相同的分布，但这种观点在现代机器学习中已经不再适用。现在更倾向于使用大量数据，即使这些数据与目标分布不完全匹配。","讲者通过举例说明，即使数据与目标分布存在差异，如使用卡通角色训练人脸识别模型，也可能不会造成伤害，甚至可能带来一定帮助。这表明数据的多样性可能对模型性能有积极影响。","讲者强调，虽然数据与目标分布的匹配性重要，但其重要性可能被高估。大型神经网络的容量使其能够吸收一些不相关数据，从而在训练过程中不会受到显著影响。","讲者指出，数据与目标分布的匹配程度对模型性能的影响是一个经验性问题，取决于具体任务。因此，通常需要通过实验来确定最佳的数据选择策略。","讲者提到，过去人们过于强调数据分布的严格匹配，但现代机器学习已经不再如此。这表明数据分布匹配的重要性在不同阶段的机器学习发展中有所变化。"],"formulas":[],"uncertainties":["lots of network is bigger"],"diagram":"none","start":1900.63,"end":2080.47,"asr_flags":[203],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":1900.63,"text":"There's a lot of low-quality random chat on the internet"},{"start":1904.33,"text":"that's not that useful for training LLMs."},{"start":1906.89,"text":"But I think, you know, this is actually now well-known"},{"start":1910.07,"text":"that if you can legally access very high-quality"},{"start":1914.45,"text":"written, authored articles or books,"},{"start":1916.83,"text":"they're highly edited, very insightful,"},{"start":1918.77,"text":"that's very high-quality data for training LLMs."},{"start":1921.53,"text":"And I'll give an example later as well for face recognition."},{"start":1924.43,"text":"It turns out that blurry images would be a lower quality than sharp and focused images,"},{"start":1932.97,"text":"assuming that's representative of how you want to recognize people's faces."},{"start":1936.93,"text":"So that really matters as well."},{"start":1939.79,"text":"All right, anything else?"},{"start":1943.99,"text":"Cool."},{"start":1947.03,"text":"All right, oh yeah, go for it."},{"start":1967.49,"text":"Yeah, so right, just repeat for Mike."},{"start":1977.51,"text":"Mike, how important is it that the data you collect is similar to the distribution of"},{"start":1982.21,"text":"things you want to work on?"},{"start":1984.61,"text":"I think it's important, but not as important as most people might think."},{"start":1990.43,"text":"So it turns out that one of the reasons neural networks have been so effective is because"},{"start":1998.45,"text":"when you build a very large neural network, you can throw all sorts of data into it, including"},{"start":2003.37,"text":"including data that is not perfectly tuned to your test set distribution,"},{"start":2010.01,"text":"and it often doesn't hurt,"},{"start":2012.31,"text":"so lots of network is bigger."},{"start":2014.07,"text":"So you raise the example, what if we haven't identified two identical objects? If it's generic objects like water bottles and markers, maybe that's too far afield. But if we were to use, let's say, simulated cartoonish characters that look really different than real humans, my guess is it probably won't hurt."},{"start":2035.56,"text":"at all, and it may even help a little bit. And so throwing in a lot of data, if we train a large neural network with a lot of capacity to absorb even some slightly irrelevant data, it usually doesn't hurt and might even help a little bit. But how much it helps is another empirical question that will be problem dependent, and we often just have to try it out. But I think..."},{"start":2058.43,"text":"Maybe, you know, like in the past, people used to have an obsession that the data you train on has to come from exactly the same distribution as the distribution you test on. That used to be how machine learning was done, I don't know, like 10, 15 years ago. That's really not true today anymore. I think we're very comfortable. And I think when your networks were much smaller, when you could train very small models,"}],"speech_gaps":[],"frame":"../frames/v061/012.webp","frame_time":1912.63},{"title":"数据设计与模型部署","segments":[{"id":215,"text":"There was a sense that you didn't want to distract the neural network with irrelevant data, right? Because computers were expensive, with few parameters, and you're distracted on irrelevant stuff, maybe it gets less good at the core tasks you really care about. But if you can train a bigger neural network, which is getting easier and easier these days, then it's become much more okay to toss in some data.","zh":"有一种感觉是，你不希望用无关数据来分散神经网络的注意力，对吧？因为计算机价格昂贵，参数数量有限，如果你被无关的内容分散了注意力，可能会变得不那么擅长你真正关心的核心任务。但如果你能训练一个更大的神经网络，而如今训练更大的神经网络变得越来越容易，那么加入一些数据就变得更为可以接受了。","start":2081.43,"end":2104.37},{"id":216,"text":"That hopefully isn't incorrect data. I think incorrect data is a problem, but just irrelevant examples hurts much less because big neural networks is like a human brain, right? You know, I don't know. The fact that, whatever, the fact that I learned to play the piano, you know, probably doesn't make me worse at it.","zh":"希望这并不是错误的数据。我认为错误的数据是个问题，但仅仅是无关的例子伤害要小得多，因为大的神经网络就像人脑一样，对吧？你知道的，我不确定。比如说，我学会了弹钢琴的事实，可能并不会让我变得更差。","start":2104.89,"end":2122.53},{"id":217,"text":"AI, right? Because hopefully my brain is big enough to learn to play the piano and learn some self-able AI. And I think as neural networks get big enough, they can learn some other irrelevant things and also do well the core tasks you really care about. But this is less true when, you know, if my brain was really small, then...","zh":"AI，对吧？因为希望我的大脑足够大，能够学会弹钢琴并学会一些自我能力的AI。我认为当神经网络足够大时，它们可以学习一些其他无关的事情，同时也能很好地完成你真正关心的核心任务。但当你的大脑非常小的时候，这一点就不那么成立了。","start":2123.5,"end":2140.82},{"id":218,"text":"I don't think any of you are fans of Sherlock Holmes, but I think Sherlock Holmes had an attic theory that your brain has only so much capacity, so you've got to forget some stuff to learn new stuff. But when you train very large neural networks, that's much less true. Cool. All right, thank you for all the questions. So what I want to do is just keep going through this flow, right? So we talked about your data design model.","zh":"我不认为你们中有谁是夏洛克·福尔摩斯的粉丝，但我认为夏洛克·福尔摩斯有一个阁楼理论，即你的大脑容量是有限的，所以你必须忘记一些东西才能学习新东西。但当你训练非常大的神经网络时，这一点就不太成立了。很好，好了，谢谢大家的问题。那么我想继续这个流程，对吧？我们已经讨论了数据设计模型。","start":2142.5,"end":2165.84},{"id":219,"text":"Train the model. We'll talk a lot more about error analysis later this quarter of how to figure out where your algorithm is still subpar and where to focus efforts to improve it. But what I want to do is give you a sense of deployment. So when you have trained the model, it's often a bunch of software engineering work to then","zh":"训练模型。我们将在本学期的后面部分详细讨论如何进行错误分析，以找出你的算法仍然存在不足的地方，并确定应该集中精力改进的地方。但我想让大家对部署有一个大致的了解。当你训练好模型后，通常需要进行大量的软件工程工作来","start":2166.52,"end":2200.32},{"id":220,"text":"maybe take your model hosted in the Cloud,","zh":"也许将你的模型托管在云端，","start":2200.84,"end":2202.84},{"id":221,"text":"the local server, and have it run inference.","zh":"在本地服务器上，并让它进行推理。","start":2202.94,"end":2205.18},{"id":222,"text":"It's a very common architecture for","zh":"这是一种非常常见的架构","start":2205.62,"end":2207.54},{"id":223,"text":"deploying machine learning model will be that,","zh":"部署机器学习模型将会是，","start":2207.54,"end":2209.2},{"id":224,"text":"given your network as a piece of software,","zh":"给定你的网络作为一个软件，","start":2209.22,"end":2211.16},{"id":225,"text":"you deploy it maybe on the Cloud hosted service so that","zh":"你可能会将其部署在云端托管服务上，以便","start":2211.38,"end":2215.16},{"id":226,"text":"your software can accept a picture or","zh":"你的软件可以接受一张图片或","start":2215.16,"end":2218.14},{"id":227,"text":"accept two pictures and will reply back,","zh":"接受两张图片，并会回复，","start":2218.14,"end":2220.18},{"id":228,"text":"do I unlock the door or not?","zh":"我是否可以解锁门？","start":2220.92,"end":2222.7},{"id":229,"text":"Or is this the same person or not?","zh":"或者这是同一个人吗？","start":2222.8,"end":2224.0},{"id":230,"text":"So there's a bunch of software engineering work that needs to be done.","zh":"因此，需要完成一系列的软件工程工作。","start":2224.12,"end":2226.8},{"id":231,"text":"But in practical deployment settings,","start":2227.12,"end":2229.24},{"id":232,"text":"I should tell you, it turns out that if you're building a practical face recognition system,","start":2230.44,"end":2234.48},{"id":233,"text":"you probably find that if you are trying to unlock a door to a corporate campus, it's","start":2234.8,"end":2242.98},{"id":234,"text":"too expensive or too slow to stream video 24-7 to cloud to classify every frame at 30","start":2242.98,"end":2251.0},{"id":235,"text":"frames per second to see if there's a person that you should unlock the door for.","start":2251.0,"end":2255.24},{"id":236,"text":"floor. So in practical face recognition systems,","start":2255.24,"end":2258.36},{"id":237,"text":"what we end up doing,","start":2259.04,"end":2261.1}],"notes":["本段讨论了在训练神经网络时，如何处理无关数据的问题。讲者指出，当计算资源有限时，无关数据可能会影响模型在核心任务上的表现。但随着神经网络规模的增大，这种影响会减小，因为大模型具有更强的泛化能力。讲者用人类大脑学习钢琴的例子来类比，说明大模型可以同时学习多个任务而不影响核心能力。","讲者提到，当神经网络足够大时，其学习能力类似于人类大脑，可以同时处理多个任务。但小模型则需要通过遗忘旧知识来学习新知识，这类似于福尔摩斯的“阁楼理论”。讲者强调，随着模型规模的增加，这种限制会减弱。","讲者随后转向模型部署的讨论，指出训练模型后需要进行大量的软件工程工作，包括将模型部署到云端或本地服务器，并进行推理。讲者提到，部署时需要考虑实际应用场景，例如在企业门禁系统中，实时视频流处理可能过于昂贵或缓慢。","讲者以人脸识别系统为例，说明在实际部署中，需要权衡计算成本和实时性。例如，24小时不间断地将视频流上传到云端进行实时分类可能不现实，因此需要寻找更高效的解决方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2081.43,"end":2261.1,"asr_flags":[],"translation_complete":false,"translated_segments":16,"raw_segments":[{"start":2081.43,"text":"there was a sense that you didn't want to distract the neural network with irrelevant data, right? Because computer was expensive, with few parameters, and you're distracted on irrelevant stuff, maybe it gets less good at the core tasks you really care about. But if you can train a bigger neural network, which is getting easier and easier these days, then it's become much more okay to toss in some data"},{"start":2104.89,"text":"That hopefully isn't incorrect data. I think incorrect data is a problem, but just irrelevant examples hurts much less because big neural networks is like a human brain, right? You know, I don't know. The fact that, whatever, the fact that I learned to play the piano, you know, probably doesn't make me worse at it."},{"start":2123.5,"text":"AI, right? Because hopefully my brain is big enough to learn to play the piano and learn some self-able AI. And I think as neural networks get big enough, they can learn some other irrelevant things and also do well the core tasks you really care about. But this is less true when, you know, if my brain was really small, then..."},{"start":2142.5,"text":"I don't think any of you are fans of Sherlock Holmes, but I think Sherlock Holmes had an attic theory that your brain has only so much capacity, so you've got to forget some stuff to learn new stuff. But when you train very large neural networks, that's much less true. Cool. All right, thank you for all the questions. So what I want to do is just keep going through this flow, right? So we talked about your data design model."},{"start":2166.52,"text":"train the model. We'll talk a lot more about error analysis later this quarter of how to figure out where your algorithm is still subpar and where to focus efforts to improve it. But what I want to do is give you a sense of deployment. So when you have trained the model, it's often a bunch of software engineering work to then"},{"start":2200.84,"text":"maybe take your model hosted in the Cloud,"},{"start":2202.94,"text":"the local server, and have it run inference."},{"start":2205.62,"text":"It's a very common architecture for"},{"start":2207.54,"text":"deploying machine learning model will be that,"},{"start":2209.22,"text":"given your network as a piece of software,"},{"start":2211.38,"text":"you deploy it maybe on the Cloud hosted service so that"},{"start":2215.16,"text":"your software can accept a picture or"},{"start":2218.14,"text":"accept two pictures and will reply back,"},{"start":2220.92,"text":"do I unlock the door or not?"},{"start":2222.8,"text":"Or is this the same person or not?"},{"start":2224.12,"text":"So there's a bunch of software engine work that needs to be done."},{"start":2227.12,"text":"But in practical deployment settings,"},{"start":2230.44,"text":"I should tell you, it turns out that if you're building a practical face recognition system,"},{"start":2234.8,"text":"you probably find that if you are trying to unlock a door to a corporate campus, it's"},{"start":2242.98,"text":"too expensive or too slow to stream video 24-7 to cloud to classify every frame at 30"},{"start":2251.0,"text":"frames per second to see if there's a person that you should unlock the door for."},{"start":2255.24,"text":"floor. So in practical face recognition systems,"},{"start":2259.04,"text":"what we end up doing,"}],"speech_gaps":[],"frame":"../frames/v061/013.webp","frame_time":2093.43},{"title":"视觉活动检测（VAD）在门禁系统中的应用","segments":[{"id":238,"text":"actually, let's take the example of someone walking up to the door,","zh":"实际上，让我们以有人走近门的例子来说明，","start":2261.32,"end":2266.46},{"id":239,"text":"to your door at home,","zh":"走到你家的门前，","start":2266.5,"end":2267.8},{"id":240,"text":"and you want to see if there's someone there,","zh":"你想要知道那里有没有人，","start":2268.48,"end":2270.62},{"id":241,"text":"they should unlock the door floor.","zh":"他们应该解锁门禁。","start":2270.66,"end":2271.78},{"id":242,"text":"So a lot of systems will actually have image from the camera,","zh":"因此，很多系统实际上会使用摄像头拍摄的图像，","start":2273.16,"end":2278.18},{"id":243,"text":"and then try to build a system.","zh":"然后尝试构建一个系统。","start":2278.26,"end":2281.18},{"id":244,"text":"So what we have so far is a system that takes us in from an image and maybe a reference","zh":"到目前为止，我们有一个系统，它从图像和可能的参考图像中获取输入，","start":2284.1,"end":2290.54},{"id":245,"text":"image.","zh":"并进行处理。","start":2290.54,"end":2290.86},{"id":246,"text":"Neural network says, do I unlock the door or not?","zh":"神经网络会说，我是否要解锁门？","start":2291.48,"end":2295.4},{"id":247,"text":"But it turns out that if streaming video is too expensive, classifying every frame is","zh":"但事实上，如果流媒体视频成本太高，对每一帧进行分类","start":2295.96,"end":2301.62},{"id":248,"text":"too expensive, will often end up with a system like this, where VAD stands for visual activity","zh":"也会太昂贵，通常会采用这样的系统，其中VAD代表视觉活动","start":2301.62,"end":2317.12},{"id":249,"text":"And what this does is a usually low-cost, low-power, inexpensive compute job to run to just very quickly maybe try to figure out, is there a human face there? Because it turns out, actually, if you're building something, unlock your front door to you and your friends. If you look out my front door in my house, it's pretty boring. There's a wall, we see a little bit of street, but nothing moves most of the time. So it's very obviously.","zh":"这种系统通常执行一项低成本、低功耗、价格低廉的计算任务，仅快速判断一下，那里有没有人脸？因为事实上，如果你在构建一个系统，比如为你和你的朋友解锁前门。如果你看看我房子的前门，那非常无聊。有一面墙，我们能看到一点街道，但大部分时间都没有东西在动。所以很明显。","start":2323.27,"end":2348.91},{"id":250,"text":"almost all of the time it's very obvious that there's no one outside my front door trying to be let in and it'd be very wasteful to stream all that video to the internet for classification. So visual activity detection is usually a low-cost, low-power system to just very quickly decide, should I do the work of sending this to the larger face recognition system neural network that may be hosted on the cloud to have it do the much more computationally expensive work to decide.","zh":"几乎所有的时间都很明显，外面没有人试图进入我的前门，将所有这些视频流到互联网进行分类是非常浪费的。因此，视觉活动检测通常是一种低成本、低功耗的系统，仅快速决定，是否要将视频发送到云端的更大人脸识别系统神经网络，让其执行更耗费计算资源的工作来决定。","start":2349.66,"end":2379.02},{"id":251,"text":"0 or 1, do I unlock the door or not? So this type of optimization in order to make the system computationally feasible to deploy is fairly common. I'm going to give you two options for how to implement VAD, and I'm going to ask you to reflect on them and then tell me which one you would pick to get started. So option 1,","zh":"0或1，我是否要解锁门？因此，为了使系统在计算上可行，这种类型的优化相当常见。我将给你们两种实现VAD的方法，我会让你们思考一下，然后告诉我你们会选择哪一种来开始。所以选项1，","start":2379.5,"end":2406.88},{"id":252,"text":"is a non-machine learning based method, which is see if the number of pixels changed is greater than some threshold epsilon, right? So if the camera is stationary, maybe looking at the wall, most of the time the pixels barely change because it's just a wall. And so you can write a little bit of code using","zh":"是一种非机器学习的方法，即判断像素变化的数量是否大于某个阈值ε，对吧？所以如果摄像头是静止的，比如看向墙，大部分时间像素变化很小，因为只是墙。因此，你可以编写一小段代码使用","start":2409.2,"end":2436.67}],"notes":["本段介绍了视觉活动检测（VAD）在门禁系统中的应用，通过一个实际例子说明了为什么需要VAD。讲者提到，如果直接对视频流进行分类，计算成本太高，因此需要一个低功耗、低成本的系统来快速判断是否有活动发生。VAD的作用是决定是否将视频发送到更复杂的面部识别系统进行处理。","讲者进一步解释了VAD的工作原理，即通过检测像素变化来判断是否有活动。如果摄像头静止，比如对着墙壁，像素变化很少，因此可以快速判断是否需要进一步处理。这种优化使得系统在计算上更加可行。","讲者提出了两种实现VAD的方法，并要求学生思考并选择其中一种开始实现。第一种是非机器学习方法，即通过检测像素变化是否超过某个阈值来判断是否有活动。","这种方法适用于静态场景，如家庭门禁系统，因为大多数时间没有活动发生，因此可以避免不必要的计算资源消耗。这种方法简单且高效，适合部署在低功耗设备上。","讲者提到，如果直接对视频流进行分类，计算成本太高，因此需要VAD来减少不必要的计算。VAD的作用是快速判断是否有活动，从而决定是否将视频发送到更复杂的系统进行处理。","讲者强调了VAD在实际应用中的重要性，特别是在资源受限的场景中。通过VAD，可以显著降低计算成本，提高系统的效率和可行性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2261.32,"end":2436.67,"asr_flags":[248],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":2261.32,"text":"actually, let's take the example of someone walk up to the door,"},{"start":2266.5,"text":"to your door at home,"},{"start":2268.48,"text":"and you want to see if there's someone there,"},{"start":2270.66,"text":"they should unlock the door floor."},{"start":2273.16,"text":"So a lot of systems will actually have image from the camera,"},{"start":2278.26,"text":"and then try to build a system."},{"start":2284.1,"text":"So what we have so far is a system that takes us in from an image and maybe a reference"},{"start":2290.54,"text":"image."},{"start":2291.48,"text":"Neural network says, do I unlock the door or not?"},{"start":2295.96,"text":"But it turns out that if streaming video is too expensive, classifying every frame is"},{"start":2301.62,"text":"too expensive, will often end up with a system like this, where VAD stands for visual activity"},{"start":2323.27,"text":"And what this does is a usually low-cost, low-power, inexpensive compute job to run to just very quickly maybe try to figure out, is there a human face there? Because it turns out, actually, if you're building something, unlock your front door to you and your friends. If you look out my front door in my house, it's pretty boring. There's a wall, we see a little bit of street, but nothing moves most of the time. So it's very obviously."},{"start":2349.66,"text":"almost all of the time it's very obvious that there's no one outside my front door trying to be let in and it'd be very wasteful to stream all that video to the internet for classification. So visual activity detection is usually a low-cost, low-power system to just very quickly decide, should I do the work of sending this to the larger face recognition system neural network that may be hosted on the cloud to have it do the much more computationally expensive work to decide."},{"start":2379.5,"text":"0 or 1, do I unlock the door or not? So this type of optimization in order to make the system computationally feasible to deploy is fairly common. I'm going to give you two options for how to implement VAD, and I'm going to ask you to reflect on them and then tell me which one you would pick to get started. So option 1,"},{"start":2409.2,"text":"is a non-machine learning based method, which is see if the number of pixels changed is greater than some threshold epsilon, right? So if the camera is stationary, maybe looking at the wall, most of the time the pixels barely change because it's just a wall. And so you can write a little bit of code using"}],"speech_gaps":[{"start":2281.808,"end":2283.552}],"frame":"../frames/v061/014.webp","frame_time":2273.32},{"title":"项目设计：轻量级模型与复杂任务的权衡","segments":[{"id":253,"text":"some image library like PIL, Python imaging library or some simple read a few lines ago to just say, has a number of pixels whose RGB values that change more than some threshold has more than 10 percent of the pixels change compared to what it looked like a second ago in order to see if there's anything in front of your camera to even decide to pass this to a more high part neural network. Option 2.","zh":"像PIL这样的图像库，或者一些简单的读取方式，比如几秒前就有一部分像素的RGB值变化超过某个阈值，如果超过10%的像素与几秒前的图像相比发生了变化，就可以判断是否有物体在相机前方，从而决定是否将数据传递给更高级的神经网络。选项二。","start":2437.41,"end":2464.84},{"id":254,"text":"would be to train a small neural network, right?","zh":"第二种方法是训练一个小型的神经网络，对吧？","start":2469.87,"end":2495.77},{"id":255,"text":"So face recognition is a pretty complex task.","zh":"人脸识别是一项相当复杂的任务。","start":2495.93,"end":2498.67},{"id":256,"text":"You have to look at multiple cues on the face, look at the eyes, look at the mouth, look at the,","zh":"你需要观察人脸上的多个线索，比如眼睛、嘴巴，以及其他的面部特征。","start":2498.67,"end":2502.05},{"id":257,"text":"you know, so that is a relatively large neural network. But just taking a quick glance to see,","zh":"你明白，这需要一个相对较大的神经网络。但只需快速看一下，","start":2502.05,"end":2507.37},{"id":258,"text":"is there even a human in front of my door? That's a much simpler task. So option two would be","zh":"是否有一个人站在我的门前？这是一项更简单的任务。因此，选项二就是","start":2507.45,"end":2512.29},{"id":259,"text":"training a very small, very low power, very lightweight neural network to just very quickly","zh":"训练一个非常小、功耗非常低、非常轻量级的神经网络，只需非常快速地","start":2512.29,"end":2519.27},{"id":260,"text":"tell you, do you think there's a human there? And then use this trained model to decide,","zh":"告诉你，你认为那里有一个人吗？然后使用这个训练好的模型来决定，","start":2519.27,"end":2525.67},{"id":261,"text":"side, is it worth passing on to a much more powerful neural network running in the cloud","zh":"这边，是否值得将任务传递给在云端运行的更强大的神经网络？","start":2525.67,"end":2531.65},{"id":262,"text":"with a lot more resources to make the final determination?","zh":"拥有更多资源来做出最终决定？","start":2531.65,"end":2533.77},{"id":263,"text":"So if you are the, again, CTO or a third person started building this, how would you start?","zh":"所以，如果你是CTO或者第三个人开始构建这个系统，你会如何开始？","start":2536.07,"end":2542.93},{"id":264,"text":"We'll give everyone a few seconds to reflect on this and get people's thoughts.","zh":"我们给大家几秒钟时间思考这个问题，并收集大家的想法。","start":2543.11,"end":2547.67},{"id":265,"text":"All right, go for it.","zh":"好的，开始吧。","start":2558.33,"end":2559.39},{"id":266,"text":"Yeah, right. Cool, just repeating my mic.","zh":"是的，对的。好的，我重复一下我的麦克风。","start":2593.47,"end":2595.81},{"id":267,"text":"So problem-dependent depends on whether you're on the street,","zh":"所以，问题的解决方式取决于你是否在街头，","start":2595.99,"end":2598.45},{"id":268,"text":"where a lot of people walking past,","zh":"有很多人经过的地方，","start":2598.55,"end":2599.57},{"id":269,"text":"maybe consider other algorithms that are even cheaper.","zh":"也许可以考虑其他甚至更便宜的算法。","start":2599.75,"end":2602.03},{"id":270,"text":"That's more on that. Cool.","zh":"这更多是关于那个方面。不错。","start":2602.13,"end":2603.59},{"id":271,"text":"Cool, let's just do that.","zh":"不错，我们就这么做吧。","start":2603.59,"end":2604.65},{"id":272,"text":"Just to frame the model,","zh":"只是为了构建模型，","start":2605.39,"end":2606.65},{"id":273,"text":"this is not the main class,","zh":"这并不是主要的类别，","start":2606.81,"end":2609.53},{"id":274,"text":"the main class is just the framework","zh":"主要的类别只是框架","start":2609.53,"end":2610.81},{"id":275,"text":"for that. We can probably just use","zh":"用于那个目的。我们可能在短期内只需使用","start":2610.81,"end":2613.79},{"id":276,"text":"option one in the short term","zh":"选项一","start":2613.79,"end":2615.45}],"notes":["本段讨论了在深度学习项目中，如何根据任务的复杂性选择合适的模型。讲者提到，对于复杂的任务如人脸识别，需要较大的神经网络，而简单的任务如检测是否有行人，则可以使用轻量级模型。这体现了模型设计中对计算资源和任务复杂度的权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2437.41,"end":2615.45,"asr_flags":[254],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":2437.41,"text":"some image library like pill, Python imaging library or some simple read a few lines ago to just say, has a number of pixels whose RGB values that change more than some threshold has more than 10 percent of the pixels change compared to what it looked like a second ago in order to see if there's anything in front of your camera to even decide to pass this to a more high part neural network. Option 2."},{"start":2469.87,"text":"would be to train a small neural network, right?"},{"start":2495.93,"text":"So face recognition is a pretty complex task."},{"start":2498.67,"text":"You have to look at multiple cues on the face, look at the eyes, look at the mouth, look at the,"},{"start":2502.05,"text":"you know, so that is a relatively large neural network. But just taking a quick glance
