text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：深度学习项目全流程 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v061","title":"斯坦福CS230：深度学习项目全流程","course":"深度学习","pages":[{"title":"深度学习项目的全流程","segments":[{"id":0,"text":"So what I'd like to do today is chat with you about the full cycle of a deep learning project. And as I promised in the first lecture, rather than me talking at you for an hour and 20 minutes or whatever, we'd love for this to be much more interactive. And so what I'm going to do is illustrate this as an example, but also ask you a bunch of questions along the way about what you would do.","start":1.55,"end":27.61},{"id":1,"text":"if you are the one working on the project, I'm going to use as an illustrative example, okay? So, plan for this to be quite interactive and please interrupt anytime and ask questions since I think that's why, uh, you know, I want to do this in person here at Stanford. Um, so,","start":28.07,"end":43.87},{"id":2,"text":"One of the reasons why developing machine learning or deep learning or other types of AI projects, including AI projects using large language models or agentic AI workflows or whatever, is that AI projects are different than traditional software engineering projects. So one of the biggest differences between AI projects of the many different flavors, supervised learning, LLM-based, generative AI-based, is that","start":44.62,"end":71.16},{"id":3,"text":"In traditional software projects, you write code and you control your code, right? Write whatever code you want, compile it, your code does what you tell it to. But AI projects involve both code as well as data that you train your algorithm on, and you almost never know what strange and wonderful things there are in your data.","start":72.02,"end":98.3},{"id":4,"text":"For example, if you're working on a face recognition application, that's the running example I'm going to use today, then as you're just getting started on the project, it's really difficult to know in advance what you find in the data. Is the lighting of the faces good? Do you struggle with people with very long hair or people with short hair? Do people making facial expressions make your system struggle? Do people wearing glasses make your system struggle? So data is so rich.","start":99.37,"end":127.23},{"id":5,"text":"that a lot of time you can't predict in advance what your AI system is going to do, not because you don't control the code. You can write whatever neural network or whatever code you want, but you don't know what's in the data.","start":127.77,"end":143.39},{"id":6,"text":"Machine learning development is a much more iterative process where you just have to build something, see how it works, and then through a process discover, almost discover what is in the data and therefore what you should be doing to change your code to make your overall system perform.","start":145.1,"end":160.9},{"id":7,"text":"And this is also true not just for deep learning-based systems. This is also true for modern large language models. There's been a lot of hype buzz about how LLMs, large language models are hard to control. I think there's a lot of excessive hype about that.","start":161.93,"end":177.53}],"notes":["本段说明了在深度学习项目中，数据的不可预测性是AI项目与传统软件工程项目的主要区别之一。讲者指出，虽然开发者可以自由编写代码，但数据中可能包含难以预料的复杂情况，这使得AI系统的开发过程更加迭代和探索性。","讲者以人脸识别应用为例，说明了数据中可能存在的各种挑战，如光照条件、发型、表情和眼镜等，这些因素都可能影响模型的性能。这表明数据的多样性和复杂性是AI项目开发中的关键问题。","讲者强调，AI项目的开发过程是迭代的，开发者需要不断构建模型、观察其表现，并通过这一过程发现数据中的问题，从而调整代码以提升系统性能。这种开发方式与传统软件工程的线性开发流程有显著不同。","讲者还提到，这种迭代开发方式不仅适用于深度学习系统，也适用于现代大型语言模型（LLMs）。尽管存在关于LLMs难以控制的过度宣传，但讲者认为这种说法并不准确，暗示LLMs的开发同样需要通过迭代和探索来优化模型表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.55,"end":177.53,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1.55,"text":"So what I'd like to do today is chat with you about the full cycle of a deep learning project. And as I promised in the first lecture, rather than me talking at you for an hour and 20 minutes or whatever, we'd love for this to be much more interactive. And so what I'm going to do is illustrate this as an example, but also ask you a bunch of questions along the way about what you would do."},{"start":28.07,"text":"if you are the one working on the project, I'm going to use as an illustrative example, okay? So, plan for this to be quite interactive and please interrupt anytime and ask questions since I think that's why, uh, you know, I want to do this in person here at Stanford. Um, so,"},{"start":44.62,"text":"One of the reasons why developing machine learning or deep learning or other types of AI projects, including AI projects using large language models or agentic AI workflows or whatever, is that AI projects are different than traditional software engineering projects. So one of the biggest differences between AI projects of the many different flavors, supervised learning, LLM-based, generative AI-based, is that"},{"start":72.02,"text":"In traditional software projects, you write code and you control your code, right? Write whatever code you want, compile it, your code does what you tell it to. But AI projects involve both code as well as data that you train your algorithm on, and you almost never know what strange and wonderful things there are in your data."},{"start":99.37,"text":"For example, if you're working on a face recognition application, that's the running example I'm going to use today, then as you're just getting started on the project, it's really difficult to know in advance what you find in the data. Is the lighting of the faces good? Do you struggle with people with very long hair or people with short hair? Do people making facial expressions make your system struggle? Do people wearing glasses make your system struggle? So data is so rich."},{"start":127.77,"text":"that a lot of time you can't predict in advance what your AI system is going to do, not because you don't control the code. You can write whatever neural network or whatever code you want, but you don't know what's in the data. And this is why, unlike traditional software engineering,"},{"start":145.1,"text":"Machine learning development is a much more iterative process where you just have to build something, see how it works, and then through a process discover, almost discover what is in the data and therefore what you should be doing to change your code to make your overall system perform."},{"start":161.93,"text":"And this is also true not just for deep learning-based systems. This is also true for modern large language models. There's been a lot of hype buzz about how LLMs, large language models are hard to control. I think there's a lot of excessive hype about that."}],"speech_gaps":[],"frame":"../frames/v061/001.webp","frame_time":13.55},{"title":"深度学习项目中的数据与模型构建挑战","segments":[{"id":8,"text":"fear-mongering, there's a little bit of that. But one of the reasons why none of us know in advance what LLMs do is because it was trained on a lot of data, more data than any human could possibly look at. And we just don't know, you know, with precision, what is in all that data that the LLM was trained on. And so because we don't know the data, we can't really look at all the massive tens of trillions of tokens of data it was trained on. It's hard to know exactly how a large language model will perform.","start":178.77,"end":206.47},{"id":9,"text":"Which is why building agentic AI applications or building large language models based applications is also very empirical or very experimental. Meaning you just have to build something, then see where it goes well, see where it goes poorly, and then use that to fix problems, and that's how you drive progress.","start":207.13,"end":223.71},{"id":10,"text":"Does that make sense? So because you control your code, but you don't really know, it's hard to control the data. And this is true, both for the data you have stored in your hard disk, you can have terabytes of data stored in a hard disk, and I don't really know what's in my hard disk. And the thing you really don't control is what data the world will give you in the future. So we deploy a system in the world.","start":224.38,"end":245.22},{"id":11,"text":"Say face recognition, which we should talk about. Will people wear a thick, heavy scarf that covers part of their face when it's winter? You just don't know. There are all these things in data that will surprise you. And if you don't even control your past data, there's already a hard disk. You certainly can't control your future data. So it turns out that a lot of machine learning classes talk about building models.","start":245.82,"end":270.82},{"id":12,"text":"And you learn a lot from the online videos about how to build powerful deep learning models. But it turns out that building the overall machine learning system or deep learning system","start":271.94,"end":285.92},{"id":13,"text":"has a lot more work than just training models.","start":287.85,"end":290.19},{"id":14,"text":"But if you look at a lot of causes,","start":291.25,"end":293.07},{"id":15,"text":"there's actually a very strong focus on modeling","start":293.31,"end":296.05},{"id":16,"text":"because I think that's what academia has focused on, right?","start":296.05,"end":299.07},{"id":17,"text":"We can train models, evaluate models,","start":299.15,"end":301.05},{"id":18,"text":"publish papers on models.","start":301.29,"end":302.31},{"id":19,"text":"And so you find that a lot of causes focus on,","start":302.55,"end":305.73},{"id":20,"text":"you know, training a good deep learning model.","start":305.75,"end":307.67},{"id":21,"text":"And that is absolutely important.","start":307.83,"end":308.91},{"id":22,"text":"But because we know how to evaluate models,","start":309.79,"end":312.47},{"id":23,"text":"different research groups can benchmark different models.","start":312.65,"end":314.89},{"id":24,"text":"There's a lot of academic research work on that","start":315.03,"end":316.75},{"id":25,"text":"that's reflective of our causes, but this is just a small part of what you need to do if","start":316.75,"end":320.91},{"id":26,"text":"you want to build an effective deep learning system. What I want to do today is go outside","start":320.91,"end":327.41},{"id":27,"text":"the small box of models to give you a broader view of what it feels like to develop a deep learning","start":327.41,"end":333.49},{"id":28,"text":"or AI or machine learning system. This is what building a deep learning system would be like,","start":333.49,"end":344.95},{"id":29,"text":"which is first, specify the problem,","start":345.61,"end":356.99},{"id":30,"text":"figure out what we're actually working on.","start":357.15,"end":358.37}],"notes":["本段讨论了在构建深度学习系统时，数据控制的困难。讲者指出，虽然我们控制代码，但无法完全控制数据，尤其是未来数据。这导致了构建AI应用时需要大量实验和调整。","讲者以人脸识别为例，说明数据中可能包含意想不到的情况，如人们在冬天戴厚围巾遮住面部。这表明数据的不可预测性是构建系统时的重要挑战。","讲者提到，许多机器学习课程专注于模型构建，但实际构建系统需要更多工作，包括数据处理、系统设计等。","讲者指出，学术界对模型的建模和评估有很强的聚焦，这导致了大量关于模型的论文发表，但这是构建有效系统的一个小部分。","讲者强调，构建深度学习系统不仅仅是训练模型，还需要明确问题、设计系统架构等步骤。"],"formulas":[],"uncertainties":[],"diagram":"none","start":178.77,"end":358.37,"asr_flags":[29],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":178.77,"text":"fear-mongering, there's a little bit of that. But one of the reasons why none of us know in advance what LLMs do is because it was trained on a lot of data, more data than any human could possibly look at. And we just don't know, you know, with precision, what is in all that data that the LLM was trained on. And so because we don't know the data, we can't really look at all the massive tens of trillions of tokens of data it was trained on. It's hard to know exactly how a large language model will perform."},{"start":207.13,"text":"Which is why building agentic AI applications or building large language models based applications is also very empirical or very experimental. Meaning you just have to build something, then see where it goes well, see where it goes poorly, and then use that to fix problems, and that's how you drive progress."},{"start":224.38,"text":"Does that make sense? So because you control your code, but you don't really know, it's hard to control the data. And this is true, both for the data you have stored in your hard disk, you can have terabytes of data stored in a hard disk, and I don't really know what's in my hard disk. And the thing you really don't control is what data the world will give you in the future. So we deploy a system in the world."},{"start":245.82,"text":"Say face recognition, which we should talk about. Will people wear a thick, heavy scarf that covers part of their face when it's winter? You just don't know. There are all these things in data that will surprise you. And if you don't even control your past data, there's already a hard disk. You certainly can't control your future data. So it turns out that a lot of machine learning classes talk about building models."},{"start":271.94,"text":"And you learn a lot from the online videos about how to build powerful deep learning models. But it turns out that building the overall machine learning system or deep learning system"},{"start":287.85,"text":"has a lot more work than just training models."},{"start":291.25,"text":"But if you look at a lot of causes,"},{"start":293.31,"text":"there's actually a very strong focus on modeling"},{"start":296.05,"text":"because I think that's what academia has focused on, right?"},{"start":299.15,"text":"We can train models, evaluate models,"},{"start":301.29,"text":"publish papers on models."},{"start":302.55,"text":"And so you find that a lot of causes focus on,"},{"start":305.75,"text":"you know, training a good deep learning model."},{"start":307.83,"text":"And that is absolutely important."},{"start":309.79,"text":"But because we know how to evaluate models,"},{"start":312.65,"text":"different research groups can benchmark different models."},{"start":315.03,"text":"There's a lot of academic research work on that"},{"start":316.75,"text":"that's reflective of our causes, but this is just a small part of what you need to do if"},{"start":320.91,"text":"you want to build an effective deep learning system. What I want to do today is go outside"},{"start":327.41,"text":"the small box of models to give you a broader view of what it feels like to develop a deep learning"},{"start":333.49,"text":"or AI or machine learning system. This is what building a deep learning system would be like,"},{"start":345.61,"text":"which is first, specify the problem,"},{"start":357.15,"text":"figure out what we're actually working on."}],"speech_gaps":[],"frame":"../frames/v061/002.webp","frame_time":190.77},{"title":"深度学习项目全流程：以人脸识别为例","segments":[{"id":31,"text":"The running example I want to use today will be to build","start":359.45,"end":362.49},{"id":32,"text":"a face recognition system or a face rec system for security,","start":362.49,"end":366.89},{"id":33,"text":"for deciding when to unlock a door,","start":367.23,"end":368.73},{"id":34,"text":"and then you can talk about some face recognition,","start":368.89,"end":370.83},{"id":35,"text":"definition, which I believe is face rec, face rec architectures last week as well.","start":370.83,"end":374.79},{"id":36,"text":"But specific application I want to talk about is something I've worked on, actually I built","start":375.07,"end":380.05},{"id":37,"text":"one of the commercial systems for this is, if this is a door, and this is, well, you","start":380.05,"end":391.77},{"id":38,"text":"or a friend or maybe someone that you don't want to let in approaching, if a little camera,","start":391.77,"end":397.19},{"id":39,"text":"sorry, bad drawing, take a picture of whoever's approaching the door","start":397.19,"end":401.25},{"id":40,"text":"and decide whether or not to unlock the door, right?","start":401.25,"end":403.91},{"id":41,"text":"So face recognition to decide who's authorized to enter,","start":403.99,"end":406.97},{"id":42,"text":"like a restricted location, like a corporate office building","start":407.07,"end":410.35},{"id":43,"text":"or your house or whatever.","start":410.35,"end":411.53},{"id":44,"text":"And actually, one common use case that one of my teams built","start":412.25,"end":416.67},{"id":45,"text":"was swipe keycards.","start":416.67,"end":418.79},{"id":46,"text":"So sometimes keycards get stolen.","start":419.03,"end":421.09},{"id":47,"text":"And so one of the systems we deployed, you know,","start":421.63,"end":423.91},{"id":48,"text":"fairly large office complexes, was if you swipe a keycard, we also just take a picture,","start":423.91,"end":429.69},{"id":49,"text":"the student is called in to make sure that the keycard is held by the person whose face is shown on the keycard.","start":429.83,"end":435.69},{"id":50,"text":"is shown on the keycard.","start":435.69,"end":436.81},{"id":51,"text":"So it makes it harder for someone to steal a keycard to gain unauthorized access to an","start":436.93,"end":441.53},{"id":52,"text":"office complex.","start":441.53,"end":442.29},{"id":53,"text":"So I'm going to use this as the motivating example for today. And after specifying a problem, typical process is then, sometimes the open source model you can download, but let's say for today that the open source models aren't good enough, you want to train your own model. The simple process will be get data, design a model, train a model,","start":443.78,"end":481.84},{"id":54,"text":"Um, and then we will iterate through these steps a bunch of times until the model looks like it's performing well enough. Um, and then after that, we have to deploy it, um, and, uh, monosend maintain the model, okay? So I'm actually gonna talk a bunch about, uh,","start":482.7,"end":516.4}],"notes":["本段具体说明了人脸识别系统在安全领域的实际应用场景，即通过摄像头捕捉接近门的人脸图像，并判断是否允许进入。系统设计中，还提到一种常见的用例是结合刷卡和人脸识别，以防止他人盗用门禁卡非法进入办公区域。"],"formulas":[],"uncertainties":[],"diagram":"none","start":359.45,"end":516.4,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":359.45,"text":"The running example I want to use today will be to build"},{"start":362.49,"text":"a face recognition system or a face rec system for security,"},{"start":367.23,"text":"for deciding when to unlock a door,"},{"start":368.89,"text":"and then you can talk about some face recognition,"},{"start":370.83,"text":"definition, which I believe is face rec, face rec architectures last week as well."},{"start":375.07,"text":"But specific application I want to talk about is something I've worked on, actually I built"},{"start":380.05,"text":"one of the commercial systems for this is, if this is a door, and this is, well, you"},{"start":391.77,"text":"or a friend or maybe someone that you don't want to let in approaching, if a little camera,"},{"start":397.19,"text":"sorry, bad drawing, take a picture of whoever's approaching the door"},{"start":401.25,"text":"and decide whether or not to unlock the door, right?"},{"start":403.99,"text":"So face recognition to decide who's authorized to enter,"},{"start":407.07,"text":"like a restricted location, like a corporate office building"},{"start":410.35,"text":"or your house or whatever."},{"start":412.25,"text":"And actually, one common use case that one of my teams built"},{"start":416.67,"text":"was swipe keycards."},{"start":419.03,"text":"So sometimes keycards get stolen."},{"start":421.63,"text":"And so one of the systems we deployed, you know,"},{"start":423.91,"text":"fairly large office complexes, was if you swipe a keycard, we also just take a picture,"},{"start":429.83,"text":"the student is called in to make sure that the keycard is held by the person whose face"},{"start":435.69,"text":"is shown on the keycard."},{"start":436.93,"text":"So it makes it harder for someone to steal a keycard to gain unauthorized access to an"},{"start":441.53,"text":"office complex."},{"start":443.78,"text":"So I'm going to use this as the motivating example for today. And after specifying a problem, typical process is then, sometimes the open source model you can download, but let's say for today that the open source models aren't good enough, you want to train your own model. The simple process will be get data, design a model, train a model,"},{"start":482.7,"text":"Um, and then we will iterate through these steps a bunch of times until the model looks like it's performing well enough. Um, and then after that, we have to deploy it, um, and, uh, monosend maintain the model, okay? So I'm actually gonna talk a bunch about, uh,"}],"speech_gaps":[],"frame":"../frames/v061/003.webp","frame_time":371.45},{"title":"深度学习项目全流程中的关键步骤","segments":[{"id":55,"text":"multiple of these steps today because I want you to come away with a feel for when you're working on a real machine learning application, what the important steps you will face are. So as I alluded, machine learning development is a very iterative process. So for these three steps, we often drive a rapid development loop where we","start":516.84,"end":544.83},{"id":56,"text":"Design the model, train it, analyze the results, and then maybe design or update the model or the data or something, and iterate around this loop many times before you are satisfied. Just one more detail.","start":556.7,"end":578.54},{"id":57,"text":"It turns out that for face recognition, the very common architecture, which you'll learn in detail about later in the online videos, is a neural network called a Siamese network. And what that does is a neural network that takes as input two pictures, and two pictures get fed to a neural network or a deep learning algorithm. And it's the job of the deep learning algorithm to tell us","start":579.38,"end":604.77},{"id":58,"text":"are these two pictures the same person or different persons, right? Because if you're trying to set this system, say, for your house, and maybe you have, I don't know, a few family members or roommates you want to let in, then it's, I don't know, it'd be quite annoying if they retrain a neural network for every single home. So the most common way to do face recognition is of a neural network that inputs two pictures, and the job of the neural network is to tell me","start":605.15,"end":630.37},{"id":59,"text":"are these two pictures of the same person? And then the way you set up the system is to input a few registration pictures. So take a picture of yourself, take a picture of your roommate, take a picture of any family members you want to have access. So then when someone comes, you can quickly check if the person that just showed up is one of the people that's authorized and then let them in.","start":630.84,"end":651.8},{"id":60,"text":"And in the corporate key card swipe example, if someone swipes a card and my card says, this is Andrew's card, then I'll quickly pull up my registration picture to double check if I seem to be the same person as the Andrew that was registered. So this is a typical neural network architecture.","start":652.38,"end":675.47},{"id":61,"text":"One thing I'd like to do today is walk you through a number of scenarios and invite you to think about what decision you would make if you are the CTO of a startup building these technologies. So my question for you is,","start":676.16,"end":692.54}],"notes":["本段讲解了深度学习项目开发中的关键步骤，强调了机器学习开发是一个迭代的过程，包括设计模型、训练模型、分析结果、更新模型或数据等步骤。通过反复迭代，最终达到满意的结果。","在讲解人脸识别时，提到了一种常见的神经网络架构——孪生网络（Siamese network），它通过输入两张图片来判断是否为同一个人。这种架构在实际应用中非常常见，例如家庭安全系统和公司门禁系统。","在家庭安全系统的例子中，用户需要注册自己的照片以及室友或家庭成员的照片，当有人来访时，系统会通过比对照片来判断是否为授权人员。这种设计避免了每次都需要重新训练神经网络的麻烦。","在公司门禁系统的例子中，当员工刷卡时，系统会调取注册的照片进行比对，以确认是否为注册的人员。这种机制提高了系统的安全性和效率。","本段还提到，作为初创公司的首席技术官，需要考虑如何设计和实现这些系统，包括选择合适的神经网络架构、处理数据以及优化模型性能。","通过这些例子，课程强调了在实际应用中，如何将理论知识转化为具体的解决方案，并通过迭代优化来提升系统的性能和用户体验。"],"formulas":[],"uncertainties":[],"diagram":"none","start":516.84,"end":692.54,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":516.84,"text":"multiple of these steps today because I want you to come away with a feel for when you're working on a real machine learning application, what the important steps you will face are. So as I alluded, machine learning development is a very iterative process. So for these three steps, we often drive a rapid development loop where we"},{"start":556.7,"text":"Design the model, train it, analyze the results, and then maybe design or update the model or the data or something, and iterate around this loop many times before you are satisfied. Just one more detail."},{"start":579.38,"text":"It turns out that for face recognition, the very common architecture, which you'll learn in detail about later in the online videos, is a neural network called a Siamese network. And what that does is a neural network that takes as input two pictures, and two pictures get fed to a neural network or a deep learning algorithm. And it's the job of the deep learning algorithm to tell us"},{"start":605.15,"text":"are these two pictures the same person or different persons, right? Because if you're trying to set this system, say, for your house, and maybe you have, I don't know, a few family members or roommates you want to let in, then it's, I don't know, it'd be quite annoying if they retrain a neural network for every single home. So the most common way to do face recognition is of a neural network that inputs two pictures, and the job of the neural network is to tell me"},{"start":630.84,"text":"are these two pictures of the same person? And then the way you set up the system is to input a few registration pictures. So take a picture of yourself, take a picture of your roommate, take a picture of any family members you want to have access. So then when someone comes, you can quickly check if the person that just showed up is one of the people that's authorized and then let them in."},{"start":652.38,"text":"And in the corporate key card swipe example, if someone swipes a card and my card says, this is Andrew's card, then I'll quickly pull up my registration picture to double check if I seem to be the same person as the Andrew that was registered. So this is a typical neural network architecture. All right. So I have a question for you."},{"start":676.16,"text":"One thing I'd like to do today is walk you through a number of scenarios and invite you to think about what decision you would make if you are the CTO of a startup building these technologies. So my question for you is,"}],"speech_gaps":[],"frame":"../frames/v061/004.webp","frame_time":528.84},{"title":"数据收集与模型训练的时间规划","segments":[{"id":62,"text":"If you're the CTO of a startup building the next phase recognition system, and if your lawyers have said you aren't allowed to download data from the internet, so let's not download data from the internet for this application. How would you go about getting data to train the system? So what you need is a bunch of pictures of people to train the neural network to say, are they the same person or not?","start":694.21,"end":721.85},{"id":63,"text":"So maybe take a few minutes to think about it","start":722.38,"end":725.44},{"id":64,"text":"and then I'll see if people raise hands","start":725.44,"end":727.62},{"id":65,"text":"and give some answers.","start":727.62,"end":728.92},{"id":66,"text":"And one specific question I have as well is","start":729.28,"end":732.5},{"id":67,"text":"how long would you take to collect data","start":732.5,"end":735.04},{"id":68,"text":"before you start training a model, right?","start":735.88,"end":738.52},{"id":69,"text":"So I think, well, you need to get data,","start":738.62,"end":743.76},{"id":70,"text":"we've designed a model, I guess,","start":744.26,"end":745.78},{"id":71,"text":"and then you need to train a model.","start":745.94,"end":747.36},{"id":72,"text":"So what does the timeline look for you?","start":747.48,"end":749.5},{"id":73,"text":"We specify the problem, you know,","start":749.56,"end":751.4},{"id":74,"text":"we'll design the model, how many hours or days or weeks we just spent to get data and how","start":751.4,"end":756.44},{"id":75,"text":"before you start running gradient descent. I see a handout. Oh, sure, go ahead.","start":756.44,"end":764.1},{"id":76,"text":"Are we doing this everywhere around the world or are we specifically thinking of the Bay Area,","start":764.6,"end":771.3},{"id":77,"text":"America, the scenario that we spoke of, or is this why we did it in the past?","start":771.88,"end":777.62},{"id":78,"text":"Let me leave it a bit more open-ended.","start":778.9,"end":780.98},{"id":79,"text":"Say you just graduated from Stanford, and you're a CTO of a three-person startup building","start":781.22,"end":787.5},{"id":80,"text":"this thing that eventually, hopefully, you'll sell all around the world, but your goal is","start":787.5,"end":792.62},{"id":81,"text":"to just get started with the three of you working out of Palo Alto, California.","start":792.62,"end":796.98},{"id":82,"text":"And do it as your real self, right?","start":798.32,"end":800.8},{"id":83,"text":"With the resources that you have.","start":800.9,"end":802.42},{"id":84,"text":"All right. Anyone want to venture an answer?","start":807.68,"end":809.52},{"id":85,"text":"So how did you get data to train the neural network?","start":809.8,"end":811.94},{"id":86,"text":"Go for it.","start":814.24,"end":814.92},{"id":87,"text":"yeah cool video streaming service by video streaming service you're thinking like you know","start":837.76,"end":841.86},{"id":88,"text":"Now, Netflix and Hulu, are you thinking like security videos?","start":841.86,"end":845.6},{"id":89,"text":"Not like Zoom.","start":845.92,"end":846.46},{"id":90,"text":"Oh, like Zoom.","start":847.06,"end":847.74},{"id":91,"text":"Oh, I see.","start":847.82,"end":848.14},{"id":92,"text":"That's cool.","start":848.22,"end":848.5},{"id":93,"text":"Like video.","start":848.72,"end":849.06},{"id":94,"text":"People will help you with video.","start":849.84,"end":851.08},{"id":95,"text":"I see.","start":851.38,"end":851.9},{"id":96,"text":"Cool, cool.","start":851.96,"end":852.36},{"id":97,"text":"Right, cool.","start":852.44,"end":852.94},{"id":98,"text":"All right.","start":853.04,"end":853.4},{"id":99,"text":"Video streaming service.","start":853.4,"end":853.98},{"id":100,"text":"How long do you think it'll take to do that?","start":854.28,"end":856.16},{"id":101,"text":"For a couple of months.","start":857.44,"end":858.46},{"id":102,"text":"But very soon, we'll be ready to do it.","start":858.7,"end":861.28},{"id":103,"text":"I assume that I may be able to find a way to make it available to people like that.","start":861.68,"end":867.18},{"id":104,"text":"It's a great question.","start":867.22,"end":868.16},{"id":105,"text":"It's a great question.","start":868.34,"end":869.02},{"id":106,"text":"Yeah, cool.","start":869.62,"end":870.3},{"id":107,"text":"All right.","start":870.42,"end":870.64},{"id":108,"text":"Cool.","start":870.64,"end":870.88},{"id":109,"text":"Cool.","start":870.98,"end":871.32},{"id":110,"text":"Cool. Thank you. All right. Creative idea.","start":871.32,"end":872.56}],"notes":["本段讨论了在无法从互联网下载数据的情况下，如何获取训练数据以构建人脸识别系统。讲师提出了一个假设情境，即作为初创公司的CTO，需要收集大量的人脸图像来训练神经网络，以判断是否为同一个人。讲师还询问了数据收集所需的时间，以及在开始训练模型之前需要完成哪些步骤。","讲师进一步引导学生思考数据收集的具体方法，例如是否可以利用视频流服务（如Netflix和Hulu）或安全视频等来源。这表明数据收集可能涉及与现有视频资源的合作或利用用户生成的内容。","讲师还提到，数据收集的时间可能需要几个月，但随着技术的发展，这一过程可能会加快。这说明数据收集是模型训练流程中的关键环节，且需要合理的时间规划。","此外，讲师强调了在实际操作中，数据收集需要考虑资源限制和实际可行性，例如初创公司可能只能在有限的预算和时间内完成数据收集。这表明数据收集不仅是技术问题，也是资源管理的问题。","讲师还提到，数据收集的时间可能影响模型训练的开始时间，因此需要在项目规划中合理安排时间线。这表明数据收集是模型训练流程中的一个关键步骤，需要提前规划。","最后，讲师鼓励学生提出创意性的解决方案，例如利用视频流服务或用户生成内容来获取数据。这表明在实际应用中，数据收集可能需要创新的方法和策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":694.21,"end":872.56,"asr_flags":[87],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":694.21,"text":"If you're the CTO of a startup building the next phase recognition system, and if your lawyers have said you aren't allowed to download data from the internet, so let's not download data from the internet for this application. How would you go about getting data to train the system? So what you need is a bunch of pictures of people to train the neural network to say, are they the same person or not?"},{"start":722.38,"text":"So maybe take a few minutes to think about it"},{"start":725.44,"text":"and then I'll see if people raise hands"},{"start":727.62,"text":"and give some answers."},{"start":729.28,"text":"And one specific question I have as well is"},{"start":732.5,"text":"how long would you take to collect data"},{"start":735.88,"text":"before you start training a model, right?"},{"start":738.62,"text":"So I think, well, you need to get data,"},{"start":744.26,"text":"we've designed a model, I guess,"},{"start":745.94,"text":"and then you need to train a model."},{"start":747.48,"text":"So what does the timeline look for you?"},{"start":749.56,"text":"We specify the problem, you know,"},{"start":751.4,"text":"we'll design the model, how many hours or days or weeks we just spent to get data and how"},{"start":756.44,"text":"before you start running gradient descent. I see a handout. Oh, sure, go ahead."},{"start":764.6,"text":"Are we doing this everywhere around the world or are we specifically thinking of the Bay Area,"},{"start":771.88,"text":"America, the scenario that we spoke of, or is this why we did it in the past?"},{"start":778.9,"text":"Let me leave it a bit more open-ended."},{"start":781.22,"text":"Say you just graduated from Stanford, and you're a CTO of a three-person startup building"},{"start":787.5,"text":"this thing that eventually, hopefully, you'll sell all around the world, but your goal is"},{"start":792.62,"text":"to just get started with the three of you working out of Palo Alto, California."},{"start":798.32,"text":"And do it as your real self, right?"},{"start":800.9,"text":"With the resources that you have."},{"start":807.68,"text":"All right. Anyone want to venture an answer?"},{"start":809.8,"text":"So how did you get data to train the neural network?"},{"start":814.24,"text":"Go for it."},{"start":837.76,"text":"yeah cool video streaming service by video streaming service you're thinking like you know"},{"start":841.86,"text":"Now, Netflix and Hulu, are you thinking like security videos?"},{"start":845.92,"text":"Not like Zoom."},{"start":847.06,"text":"Oh, like Zoom."},{"start":847.82,"text":"Oh, I see."},{"start":848.22,"text":"That's cool."},{"start":848.72,"text":"Like video."},{"start":849.84,"text":"People will help you with video."},{"start":851.38,"text":"I see."},{"start":851.96,"text":"Cool, cool."},{"start":852.44,"text":"Right, cool."},{"start":853.04,"text":"All right."},{"start":853.4,"text":"Video streaming service."},{"start":854.28,"text":"How long do you think it'll take to do that?"},{"start":857.44,"text":"For a couple of months."},{"start":858.7,"text":"But very soon, we'll be ready to do it."},{"start":861.68,"text":"I assume that I may be able to find a way to make it available to people like that."},{"start":867.22,"text":"It's a great question."},{"start":868.34,"text":"It's a great question."},{"start":869.62,"text":"Yeah, cool."},{"start":870.42,"text":"All right."},{"start":870.64,"text":"Cool."},{"start":870.98,"text":"Cool."},{"start":871.32,"text":"Cool. Thank you. All right. Creative idea."}],"speech_gaps":[{"start":830.576,"end":832.352},{"start":834.352,"end":836.656}],"frame":"../frames/v061/005.webp","frame_time":706.21},{"title":"数据收集策略与执行速度的重要性","segments":[{"id":111,"text":"Any other ideas? How would you go about and get data? Yes, go ahead.","start":873.2,"end":876.04},{"id":112,"text":"Yeah, cool. Awesome. Right. Stick a camera there.","start":901.94,"end":904.04},{"id":113,"text":"I'll let people opt-in to get the picture taken.","start":904.04,"end":907.28},{"id":114,"text":"Cool. I think I saw a handout. Go for it.","start":907.82,"end":911.24},{"id":115,"text":"I see. Cool. How would you get users?","start":915.32,"end":924.62},{"id":116,"text":"That's it.","start":934.04,"end":934.74},{"id":117,"text":"By your own people, you can grab some friends in Austin. They'll give you their LinkedIn photo, give you some pictures with your camera roll. Yeah, cool. I like that. That's fast. I like that. Any other ideas? Oh, good. I see. Interesting. Yeah, ask Stanford to send an email. Cool. But I love Stanford. Stanford's a wonderful institution. That's going to take a while.","start":935.82,"end":968.2},{"id":118,"text":"The creative idea. I like the creative ideas. So let me share with you one guiding principle for how I would encourage you to approach this problem of data collection. I appreciate all the creative ideas, actually. One of the frameworks I often use to decide how I collect data is speed. Because I find that, especially building a startup,","start":971.38,"end":996.62},{"id":119,"text":"In my opinion, one of the strongest predictors for whether a startup will succeed and also whether a small innovative project in a large corporation, it could be a giant corporation, but if it's a team of three working on a small innovative project in a big company, I find that one of the biggest predictors for the chance of success is just the speed of execution, the speed of getting stuff done.","start":998.13,"end":1021.05},{"id":120,"text":"And so when I'm sitting with a team and brainstorming different tactics, I will gravitate toward the tactics that let me get the data set very quickly. And quickly usually means, you know, like one or two days, even if it ends up with inferior, smaller, lower quality data sets or whatever. Because I don't really know.","start":1021.72,"end":1044.1}],"notes":["本段主要讨论了数据收集的创意方法以及执行速度在项目成功中的重要性。讲者提到通过朋友、LinkedIn照片、相机相册等方式快速获取数据，并强调了执行速度对初创公司和企业内部创新项目成功的关键作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":873.2,"end":1044.1,"asr_flags":[112,116],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":873.2,"text":"Any other ideas? How would you go about and get data? Yes, go ahead."},{"start":901.94,"text":"Yeah, cool. Awesome. Right. Stick a camera there."},{"start":904.04,"text":"I'll let people opt-in to get the picture taken."},{"start":907.82,"text":"Cool. I think I saw a handout. Go for it."},{"start":915.32,"text":"I see. Cool. How would you get users?"},{"start":934.04,"text":"That's it."},{"start":935.82,"text":"By your own people, you can grab some friends in Austin. They'll give you their LinkedIn photo, give you some pictures with your camera roll. Yeah, cool. I like that. That's fast. I like that. Any other ideas? Oh, good. I see. Interesting. Yeah, ask Stanford to send an email. Cool. But I love Stanford. Stanford's a wonderful institution. That's going to take a while."},{"start":971.38,"text":"The creative idea. I like the creative ideas. So let me share with you one guiding principle for how I would encourage you to approach this problem of data collection. I appreciate all the creative ideas, actually. One of the frameworks I often use to decide how I collect data is speed. Because I find that, especially building a startup,"},{"start":998.13,"text":"In my opinion, one of the strongest predictors for whether a startup will succeed and also whether a small innovative project in a large corporation, it could be a giant corporation, but if it's a team of three working on a small innovative project in a big company, I find that one of the biggest predictors for the chance of success is just the speed of execution, the speed of getting stuff done."},{"start":1021.72,"text":"And so when I'm sitting with a team and brainstorming different tactics, I will gravitate toward the tactics that let me get the data set very quickly. And quickly usually means, you know, like one or two days, even if it ends up with inferior, smaller, lower quality data sets or whatever. Because I don't really know."}],"speech_gaps":[],"frame":"../frames/v061/006.webp","frame_time":885.2},{"title":"数据收集与隐私问题","segments":[{"id":121,"text":"what problems I'll see in my data, and the quicker I can get the dataset, create a model, see where it goes wrong, the quicker I can then discover what's wrong with my data and fix it.","start":1044.91,"end":1057.13},{"id":122,"text":"True story, chatting with a CEO that told me he actually had spent, I think it was over $100 million, definitely more than tens of million dollars, spent a lot of money buying a company for his data.","start":1058.46,"end":1074.4},{"id":123,"text":"And then he actually said, hey, Andrew, I spent all this money to get all this data.","start":1076.09,"end":1079.83},{"id":124,"text":"You know, can you help me figure out how to monetize this, how to make money off of this?","start":1080.27,"end":1083.93},{"id":125,"text":"Right. And I kind of look at him and go, boy, I kind of wish I hadn't done that.","start":1084.07,"end":1087.43},{"id":126,"text":"Right. And what I find is that the value of data is just so difficult to know in advance.","start":1087.55,"end":1094.99},{"id":127,"text":"Right. What's important and what's not important about data.","start":1095.27,"end":1098.11},{"id":128,"text":"So for a lot of these tactics, for example, I think student ID is an interesting one.","start":1098.49,"end":1104.03},{"id":129,"text":"but, you know, are student ID photos weird in some way, right?","start":1104.03,"end":1108.87},{"id":130,"text":"Or are they too expressionist?","start":1109.01,"end":1110.39},{"id":131,"text":"Or are people smiling too much in student IDs?","start":1110.41,"end":1112.71},{"id":132,"text":"I actually have no idea.","start":1112.77,"end":1113.45},{"id":133,"text":"Actually, my Stanford ID, I look really weird in my Stanford ID.","start":1114.07,"end":1117.57},{"id":134,"text":"And I actually like the idea of sticking a camera","start":1122.09,"end":1127.29},{"id":135,"text":"and just letting people come up and opt in and take a picture","start":1127.29,"end":1130.73},{"id":136,"text":"if you can do it quickly.","start":1130.73,"end":1131.97},{"id":137,"text":"And I think in a big company or even in a small startup, it's important to respect user","start":1132.93,"end":1137.93},{"id":138,"text":"privacy or individual privacy, but if you can stick a camera in some place, you know,","start":1137.93,"end":1143.29},{"id":139,"text":"that doesn't kind of, what's the word, invade people's privacy, they don't want to be any","start":1143.29,"end":1149.39},{"id":140,"text":"part of this, but let people opt in, take the pictures of permission, if you can do","start":1149.39,"end":1153.07},{"id":141,"text":"that in days, I find that to be valuable.","start":1153.07,"end":1155.77},{"id":142,"text":"One of the things I found","start":1156.35,"end":1157.33},{"id":143,"text":"For quite a few of my projects, I found that Stanford students, our community here is pretty cosmopolitan with people from all around the world. We're not fully representative of the world's distribution of people, but we actually do have people from all around the world. A lot of Stanford people are actually very nice. So one thing I've done multiple times is when I need to collect data, we'll go to...","start":1157.93,"end":1178.85},{"id":144,"text":"places on campus with high foot traffic. It turns out cafeteria is a very high foot traffic. And we just ask people, hey, we're working on a project. Can I get a sample of your voice? Can I take a picture of you? Kind of with really informed concern, tell people, is it okay if I do this? I've been delighted at how collaborative Stanford students are. And I find that one thing I've often done is gone to my teams and said, we have two days to collect data.","start":1179.03,"end":1205.33}],"notes":["本段讨论了数据收集过程中隐私问题的重要性，强调了在数据收集时应尊重用户隐私，同时允许用户自愿参与。讲者提到，即使在某些地方放置摄像头，也应避免侵犯隐私，而是让用户主动选择是否参与。这种做法在数据收集过程中具有实际价值。","讲者提到，通过在校园高流量区域（如食堂）进行数据收集，可以有效获取样本。这种做法依赖于斯坦福学生的合作态度，表明在数据收集过程中，与目标群体建立良好的关系是关键。","讲者提到，数据的价值在前期难以准确评估，因此快速迭代和发现问题至关重要。这包括对数据质量的评估，如学生照片是否过于表情化或微笑过多，这些细节可能影响模型性能。","讲者提到，数据收集过程中需要权衡数据的重要性与隐私保护。例如，虽然学生ID照片可能包含有用信息，但其是否适合用于训练模型仍需进一步分析。","讲者提到，数据收集的效率和质量直接影响项目的成功。因此，快速获取数据、构建模型并发现潜在问题，是项目推进的关键步骤。","讲者提到，数据收集过程中应注重用户隐私保护，同时鼓励用户自愿参与。这种做法不仅符合伦理规范，也有助于提高数据质量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1044.91,"end":1205.33,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1044.91,"text":"what problems I'll see in my data, and the quicker I can get the dataset, create a model, see where it goes wrong, the quicker I can then discover what's wrong with my data and fix it."},{"start":1058.46,"text":"True story, chatting with a CEO that told me he actually had spent, I think it was over $100 million, definitely more than tens of million dollars, spent a lot of money buying a company for his data."},{"start":1076.09,"text":"And then he actually said, hey, Andrew, I spent all this money to get all this data."},{"start":1080.27,"text":"You know, can you help me figure out how to monetize this, how to make money off of this?"},{"start":1084.07,"text":"Right. And I kind of look at him and go, boy, I kind of wish I hadn't done that."},{"start":1087.55,"text":"Right. And what I find is that the value of data is just so difficult to know in advance."},{"start":1095.27,"text":"Right. What's important and what's not important about data."},{"start":1098.49,"text":"So for a lot of these tactics, for example, I think student ID is an interesting one."},{"start":1104.03,"text":"but, you know, are student ID photos weird in some way, right?"},{"start":1109.01,"text":"Or are they too expressionist?"},{"start":1110.41,"text":"Or are people smiling too much in student IDs?"},{"start":1112.77,"text":"I actually have no idea."},{"start":1114.07,"text":"Actually, my Stanford ID, I look really weird in my Stanford ID."},{"start":1122.09,"text":"And I actually like the idea of sticking a camera"},{"start":1127.29,"text":"and just letting people come up and opt in and take a picture"},{"start":1130.73,"text":"if you can do it quickly."},{"start":1132.93,"text":"And I think in a big company or even in a small startup, it's important to respect user"},{"start":1137.93,"text":"privacy or individual privacy, but if you can stick a camera in some place, you know,"},{"start":1143.29,"text":"that doesn't kind of, what's the word, invade people's privacy, they don't want to be any"},{"start":1149.39,"text":"part of this, but let people opt in, take the pictures of permission, if you can do"},{"start":1153.07,"text":"that in days, I find that to be valuable."},{"start":1156.35,"text":"One of the things I found"},{"start":1157.93,"text":"For quite a few of my projects, I found that Stanford students, our community here is pretty cosmopolitan with people from all around the world. We're not fully representative of the world's distribution of people, but we actually do have people from all around the world. A lot of Stanford people are actually very nice. So one thing I've done multiple times is when I need to collect data, we'll go to..."},{"start":1179.03,"text":"places on campus with high foot traffic. It turns out cafeteria is a very high foot traffic. And we just ask people, hey, we're working on a project. Can I get a sample of your voice? Can I take a picture of you? Kind of with really informed concern, tell people, is it okay if I do this? I've been delighted at how collaborative Stanford students are. And I find that one thing I've often done is gone to my teams and said, we have two days to collect data."}],"speech_gaps":[{"start":1118.016,"end":1121.69}],"frame":"../frames/v061/007.webp","frame_time":1056.91},{"title":"数据收集与模型训练的时间管理","segments":[{"id":145,"text":"It's like, whatever, it's 11.52 a.m. now, let's figure out what we can do by, what day is it? Tuesday. Let's figure out what we can do by Thursday 11.52 a.m. So let's give us the 48 hours and let's brainstorm. How can we collect data? And it's fine that the data isn't all there, fine that the data is low quality, but that velocity lets us more quickly trade a model, figure out what's wrong with the data, and then jigger or retweak how we collect data.","start":1205.96,"end":1234.8},{"id":146,"text":"So I find that there's some teams that will ask, how can we collect the data we need, and then ask, how long will that take? That usually leads to a much slower execution. I instead tend to go to my teams and say, well, two days, or one day, or maybe a week, some short time span like that, and say, what's the most creative, respectful, responsible, but creative way you can use to collect data in this short time span? And one of the ways to think about that too is,","start":1235.82,"end":1264.32},{"id":147,"text":"If training a model takes, I don't know, let's say it takes two days. Maybe I should take more like one day, right? If you can train a model in a couple of days, then I would not spend, you know, like whatever, right? Two months to find data to train a model because then this becomes a huge bottleneck. Because you can train a model relatively quickly, let's take a commensurate amount of time to design a model.","start":1264.9,"end":1290.9},{"id":148,"text":"or design the data as training model. And depending on how long it takes to train a model, sometimes training model","start":1291.46,"end":1298.62},{"id":149,"text":"needs to run overnight. I actually see teams sometimes take one-day iteration loops around this. The fast-moving teams I work with, we often go around this loop once per day for the smaller models. And we're training a large air foundation model. Sometimes training a model takes weeks or even months. Then the process can be different. If your model run is going to be two months, then yeah, maybe it makes sense to spend a couple months to get the data really right. But for face recognition, you could train","start":1299.05,"end":1328.35},{"id":150,"text":"that overnight or actually in a couple hours quite easily. So it makes sense not to spend","start":1328.36,"end":1333.46},{"id":151,"text":"massive amounts of time before you go in to train the model. Does that make sense?","start":1333.46,"end":1337.22},{"id":152,"text":"The word empirical means experimental, right? Sorry, I've used the word a few times today.","start":1342.04,"end":1345.9},{"id":153,"text":"And I think we say that machine learning is a very empirical process, meaning it's a very","start":1346.5,"end":1354.62},{"id":154,"text":"you have to do it see what happens inside what to do next i know that","start":1354.62,"end":1359.78},{"id":155,"text":"sometimes others criticize our field as like we never know what we're doing we just try stuff and","start":1359.78,"end":1364.5},{"id":156,"text":"see what works and then you know there's a little bit of proof to that um uh i think understanding","start":1364.5,"end":1370.42},{"id":157,"text":"neural networks hyperparameters architecture that is really valuable so we don't just try","start":1370.42,"end":1375.22},{"id":158,"text":"stuff at random but because we don't know what's in the data we do try a lot of things and then","start":1375.22,"end":1380.24},{"id":159,"text":"drive a disparate process, understand what works and what doesn't, and then use that to navigate","start":1380.24,"end":1385.66}],"notes":["本段主要讨论数据收集与模型训练的时间管理策略。讲者强调在短时间内快速迭代数据收集方法的重要性，指出如果模型训练时间较短，就不应花费过多时间在数据收集上，因为这会成为瓶颈。同时，讲者提到不同模型训练时间差异很大，如小型模型可能只需几小时，而大型模型可能需要数周甚至数月，因此时间管理策略也应相应调整。","讲者指出，机器学习是一个高度实验性的过程，即所谓的“经验性”过程。这意味着需要不断尝试不同的方法，观察结果，并据此调整策略。虽然有人批评该领域缺乏明确的理论指导，但讲者认为这种实验性是必要的，因为数据的复杂性使得随机尝试是不可避免的。","讲者提到，虽然尝试各种方法是必要的，但并非完全随机。在不了解数据内容的情况下，需要进行大量尝试，以找到有效的方法。这种过程涉及对不同方法的评估，从而指导后续的决策。","讲者强调，对于快速迭代的团队，通常每天进行一次模型训练和数据收集的循环，而对于大型模型，可能需要更长的时间周期。这种时间安排的灵活性是项目成功的关键。","讲者提到，数据质量可能不高，但快速迭代可以加快模型调整和数据收集方法的优化。这种策略允许团队在短时间内快速验证假设，并根据反馈进行调整。","讲者最后提到，机器学习的实验性本质意味着需要不断尝试和调整，而不是依赖单一的理论框架。这种过程虽然可能显得混乱，但却是有效的方法。"],"formulas":[],"uncertainties":["training model","you have to do it see what happens inside what to do next i know that","um uh i think understanding","stuff at random but because we don't know what's in the data we do try a lot of things and then"],"diagram":"none","start":1205.96,"end":1385.66,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1205.96,"text":"It's like, whatever, it's 11.52 a.m. now, let's figure out what we can do by, what day is it? Tuesday. Let's figure out what we can do by Thursday 11.52 a.m. So let's give us the 48 hours and let's brainstorm. How can we collect data? And it's fine that the data isn't all there, fine that the data is low quality, but that velocity lets us more quickly trade a model, figure out what's wrong with the data, and then jigger or retweak how we collect data."},{"start":1235.82,"text":"So I find that there's some teams that will ask, how can we collect the data we need, and then ask, how long will that take? That usually leads to a much slower execution. I instead tend to go to my teams and say, well, two days, or one day, or maybe a week, some short time span like that, and say, what's the most creative, respectful, responsible, but creative way you can use to collect data in this short time span? And one of the ways to think about that too is,"},{"start":1264.9,"text":"If training a model takes, I don't know, let's say it takes two days. Maybe I should take more like one day, right? If you can train a model in a couple of days, then I would not spend, you know, like whatever, right? Two months to find data to train a model because then this becomes a huge bottleneck. Because you can train a model relatively quickly, let's take a commensurate amount of time to design a model."},{"start":1291.46,"text":"or design the data as training model. And depending on how long it takes to train a model, sometimes training model"},{"start":1299.05,"text":"needs to run overnight. I actually see teams sometimes take one-day iteration loops around this. The fast-moving teams I work with, we often go around this loop once per day for the smaller models. And we're training a large air foundation model. Sometimes training a model takes weeks or even months. Then the process can be different. If your model run is going to be two months, then yeah, maybe it makes sense to spend a couple months to get the data really right. But for face recognition, you could train"},{"start":1328.36,"text":"that overnight or actually in a couple hours quite easily. So it makes sense not to spend"},{"start":1333.46,"text":"massive amounts of time before you go in to train the model. Does that make sense?"},{"start":1342.04,"text":"The word empirical means experimental, right? Sorry, I've used the word a few times today."},{"start":1346.5,"text":"And I think we say that machine learning is a very empirical process, meaning it's a very"},{"start":1354.62,"text":"experimental process you have to do it see what happens inside what to do next i know that"},{"start":1359.78,"text":"sometimes others criticize our field as like we never know what we're doing we just try stuff and"},{"start":1364.5,"text":"see what works and then you know there's a little bit of proof to that um uh i think understanding"},{"start":1370.42,"text":"neural networks hyperparameters architecture that is really valuable so we don't just try"},{"start":1375.22,"text":"stuff at random but because we don't know what's in the data we do try a lot of things and then"},{"start":1380.24,"text":"drive a disparate process, understand what works and what doesn't, and then use that to navigate"}],"speech_gaps":[{"start":1339.36,"end":1341.64}],"frame":"../frames/v061/008.webp","frame_time":1217.96},{"title":"项目经验与迭代开发","segments":[{"id":160,"text":"forward. Does that make sense? And then I'll just say there's one exception to the advice I'm giving","start":1385.66,"end":1392.9},{"id":161,"text":"here, which is if you're working on a project that you have worked on many times before,","start":1392.9,"end":1399.24},{"id":162,"text":"so whatever, I've built a bunch of face recognition systems. So I kind of have a sense from previous","start":1399.5,"end":1406.38},{"id":163,"text":"experience and for reading research papers that certain things I know it's","start":1406.38,"end":1410.28},{"id":164,"text":"just not going to work if I have you know a hundred images right so there's","start":1410.28,"end":1413.76},{"id":165,"text":"some face recognition systems I know I probably need at least 50,000 images","start":1413.76,"end":1417.56},{"id":166,"text":"before it will have any hope of working. So because of that prior experience, having gone through that loop a lot, I now have a basis to say, okay, I do need 50,000 images, then I might invest upfront and put more effort upfront to get those 50,000 images.","start":1418.65,"end":1438.95},{"id":167,"text":"But I think for most applications you work on for the first time, if you don't have a... academic literature to justify certain larger data investments, or if you don't have the prior experience yourself, then, um, I would focus on the speed of iterating around this loop. Make sense? Um, all right. And to relate this to, uh, large language models based applications as well.","start":1439.37,"end":1462.01},{"id":168,"text":"A lot of us, a lot of you are probably, well, you may be building applications that are prompting LLMs and calling an API, right? Like OpenAI or Anthropic or Gemini or Metalama or whatever API to get things back from LLM.","start":1462.7,"end":1477.26},{"id":169,"text":"One of the reasons that too is a very experimental, a very iterative empirical process is because when you write an LLM prompt, you don't really know in advance how well it's going to do because it was trained on data that none of us have really looked at. And that too is why instead of theorizing for a long time about what prompt to use in LLM, you know, just try it out. And then it's by doing that, you then see the problems and then your focus can be on fixing the problems.","start":1477.87,"end":1507.09},{"id":170,"text":"And in fact, there's a lot of discussion on responsible AI, how to make sure AI systems are safe or they don't have kind of unforeseen circumstances. And because a lot of the theorizing, you know, you can only theorize so much. I find that if you want to build safe, responsible AI systems, one of the best ways to do that is to just build it.","start":1508.44,"end":1530.78},{"id":171,"text":"And then experiment with it in a sandbox environment. Just don't let it out into the world until you've tested it rigorously. But just go build something and then test it, probe it in the safety of your own laptop. Don't let it enter innocent users and have some weird impact on innocent third parties.","start":1531.3,"end":1548.82}],"notes":["本段主要讨论在项目开发中如何利用过往经验来指导数据需求和迭代策略。讲者提到，对于熟悉的问题（如人脸识别），可以根据经验确定需要的数据量（如至少50,000张图像），从而提前投入更多资源。而对于首次接触的应用，应优先考虑快速迭代，而不是过度规划。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1385.66,"end":1548.82,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1385.66,"text":"forward. Does that make sense? And then I'll just say there's one exception to the advice I'm giving"},{"start":1392.9,"text":"here, which is if you're working on a project that you have worked on many times before,"},{"start":1399.5,"text":"so whatever, I've built a bunch of face recognition systems. So I kind of have a sense from previous"},{"start":1406.38,"text":"experience and for reading research papers that certain things I know it's"},{"start":1410.28,"text":"just not going to work if I have you know a hundred images right so there's"},{"start":1413.76,"text":"some face recognition systems I know I probably need at least 50,000 images"},{"start":1418.65,"text":"before it will have any hope of working. So because of that prior experience, having gone through that loop a lot, I now have a basis to say, okay, I do need 50,000 images, then I might invest upfront and put more effort upfront to get those 50,000 images. But I think for most applications you work on for the first time, if you don't have a..."},{"start":1439.37,"text":"academic literature to justify certain larger data investments, or if you don't have the prior experience yourself, then, um, I would focus on the speed of iterating around this loop. Make sense? Um, all right. And to relate this to, uh, large language models based applications as well."},{"start":1462.7,"text":"A lot of us, a lot of you are probably, well, you may be building applications that are prompting LLMs and calling an API, right? Like OpenAI or Anthropic or Gemini or Metalama or whatever API to get things back from LLM."},{"start":1477.87,"text":"One of the reasons that too is a very experimental, a very iterative empirical process is because when you write an LLM prompt, you don't really know in advance how well it's going to do because it was trained on data that none of us have really looked at. And that too is why instead of theorizing for a long time about what prompt to use in LLM, you know, just try it out. And then it's by doing that, you then see the problems and then your focus can be on fixing the problems."},{"start":1508.44,"text":"And in fact, there's a lot of discussion on responsible AI, how to make sure AI systems are safe or they don't have kind of unforeseen circumstances. And because a lot of the theorizing, you know, you can only theorize so much. I find that if you want to build safe, responsible AI systems, one of the best ways to do that is to just build it."},{"start":1531.3,"text":"And then experiment with it in a sandbox environment. Just don't let it out into the world until you've tested it rigorously. But just go build something and then test it, probe it in the safety of your own laptop. Don't let it enter innocent users and have some weird impact on innocent third parties."}],"speech_gaps":[],"frame":"../frames/v061/009.webp","frame_time":1397.66},{"title":"数据驱动的模型改进","segments":[{"id":172,"text":"But it's only by building and then improving it that you can figure out where can it go wrong, where will it say inappropriate things, where will it respond inappropriately to certain user queries, and then that tells you where the problems are that you can work on that. Okay? Yeah, question? Oh, sorry. Yeah, right.","start":1549.47,"end":1586.82},{"id":173,"text":"Great question. So when you analyze something is wrong with your model, how do you use that to take the next step forward? That's a big topic that we'll talk at length multiple times in some of the videos and also in some future lessons. But maybe long story short, one of the things you could do is change your neural network architecture. You may realize that maybe the sign means that work isn't working or read the literature to change your architecture. The other thing you can often do is change your data.","start":1590.97,"end":1617.21},{"id":174,"text":"So data-centric AI is the discipline of systematic engineering of data to build a successful AI system.","start":1618.87,"end":1623.49},{"id":175,"text":"And it turns out that you build a face recognition system. Let's say, I like your hat, snap hat, that's cool. But let's say hypothetically that you find that the system really struggles recognizing people that are wearing hats. Then you may say, all right, I need to get more data with people wearing hats. And so it's often that looking at what goes wrong, which we call error analysis, that then gives you the insight to say, oh, it works well on these types of data or these types of users.","start":1624.01,"end":1650.47},{"id":176,"text":"but the struggles of these type of users in terms of data. So can I fix my data or get more data just on the subset of cases it struggles with? And that's a very common motion. That's a very common process, but then driving the performance of the system.","start":1650.92,"end":1666.54},{"id":177,"text":"blindly going out to grab more data willy-nilly. That's often not a good strategy because it's just too much data you get. Do I want more data with people with long hair or short hair or people with facial hair? Sorry, too much hair. Too many hair examples. Or do I want people with...","start":1668.44,"end":1685.32},{"id":178,"text":"wearing a scarf, covering part of the face, or people that wear glasses, people that don't wear glasses, or people that are slightly turned away. There's just so many different types of data you could invest effort to get more of that until you build a system, see where it goes well, see where it goes poorly, it's really difficult to decide where to get more data. And just get more data of everything under the sun, that's very slow and expensive. And I think...","start":1686.74,"end":1714.06},{"id":179,"text":"Part of the hype about the value of data has led people to have sometimes overly simplistic view of data.","start":1714.74,"end":1721.7}],"notes":["本段讨论了在深度学习项目中，通过分析模型错误来改进模型的方法。讲者指出，当模型在某些特定情况下表现不佳时，可以通过增加相关数据来提升性能，而不是盲目地获取大量数据。这种策略被称为数据驱动的模型改进。","讲者强调了数据集的重要性，指出在模型表现不佳的情况下，应专注于获取特定类型的数据，而不是泛泛地收集所有数据。这有助于提高模型的准确性和效率。","讲者提到，数据集的构建需要系统性的工程方法，即数据为中心的AI（data-centric AI），这涉及对数据的深入分析和针对性改进。","讲者指出，盲目地获取大量数据并不是一个有效的策略，因为这可能导致资源浪费和效率低下。相反，应通过错误分析（error analysis）来识别模型的弱点，并针对性地改进数据。","讲者还提到，数据的重要性被高估了，人们有时对数据的价值有过于简单的看法，忽视了数据质量与针对性的重要性。","讲者通过一个具体的例子说明了如何通过分析模型在特定情况下的表现来决定需要获取哪些类型的数据，例如识别戴帽子的人脸时，应增加戴帽子的数据。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1549.47,"end":1721.7,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1549.47,"text":"But it's only by building and then improving it that you can figure out where can it go wrong, where will it say inappropriate things, where will it respond inappropriately to certain user queries, and then that tells you where the problems are that you can work on that. Okay? Yeah, question? Oh, sorry. Yeah, right."},{"start":1590.97,"text":"Great question. So when you analyze something is wrong with your model, how do you use that to take the next step forward? That's a big topic that we'll talk at length multiple times in some of the videos and also in some future lessons. But maybe long story short, one of the things you could do is change your neural network architecture. You may realize that maybe the sign means that work isn't working or read the literature to change your architecture. The other thing you can often do is change your data."},{"start":1618.87,"text":"So data-centric AI is the discipline of systematic engineering of data to build a successful AI system."},{"start":1624.01,"text":"And it turns out that you build a face recognition system. Let's say, I like your hat, snap hat, that's cool. But let's say hypothetically that you find that the system really struggles recognizing people that are wearing hats. Then you may say, all right, I need to get more data with people wearing hats. And so it's often that looking at what goes wrong, which we call error analysis, that then gives you the insight to say, oh, it works well on these types of data or these types of users."},{"start":1650.92,"text":"but the struggles of these type of users in terms of data. So can I fix my data or get more data just on the subset of cases it struggles with? And that's a very common motion. That's a very common process, but then driving the performance of the system. And this is also why"},{"start":1668.44,"text":"blindly going out to grab more data willy-nilly. That's often not a good strategy because it's just too much data you get. Do I want more data with people with long hair or short hair or people with facial hair? Sorry, too much hair. Too many hair examples. Or do I want people with..."},{"start":1686.74,"text":"wearing a scarf, covering part of the face, or people that wear glasses, people that don't wear glasses, or people that are slightly turned away. There's just so many different types of data you could invest effort to get more of that until you build a system, see where it goes well, see where it goes poorly, it's really difficult to decide where to get more data. And just get more data of everything under the sun, that's very slow and expensive. And I think..."},{"start":1714.74,"text":"Part of the hype about the value of data has led people to have sometimes overly simplistic view of data."}],"speech_gaps":[],"frame":"../frames/v061/010.webp","frame_time":1561.47},{"title":"数据质量与数据子类别的重要性","segments":[{"id":180,"text":"Yes, of course I want more data, but just grabbing more data of all types of data is a very inefficient, very expensive way to improve my system. And even if you look at the way that frontier models are trained right now, it's not a game of just grabbing more data of anything under the sun. It is identifying the subcategories where it's valuable to invest to get high quality data, which is why if you look at...","start":1722.57,"end":1747.19},{"id":181,"text":"It turns out in AI, there are two clear buckets of value in LLMs, right? There's the general answering people's questions. I think, you know, OpenAI Chakri is doing really well there. Gemini, Anthropic have momentum, but there's the answering general questions. And then one of the verticals that's really valuable is AI for coding a system. So I think, you know, Claude has been ahead for a while, but OpenAI...","start":1747.82,"end":1770.4},{"id":182,"text":"Gemini 2.5 Pro, some of the models are making really good progress in coding as well. And if you look at the work that the frontier teams are doing to improve coding, building iterative agentic workflows is part of it, but also finding clever ways to come up with coding-related data is also part of it. And if you want your alum to do better in coding, you don't grab data willingly with low-quality random internet chat.","start":1771.8,"end":1798.26},{"id":183,"text":"social media or whatever data, right? But instead, having high quality coding related data is how you can have a focus effort to improve your own ability to code. So a lot of these things are actually...","start":1798.7,"end":1810.4},{"id":184,"text":"Yeah. I feel like more data is better. That is absolutely true, but it's also overly simplistic. Data is not monolithic. There are subcategories of data, and having a view on what piece of data to really invest in getting a lot more of, that's really important to being efficient in how you improve the system performance. That make sense? All right. Well, we'll talk more about error analysis in this later. Any other questions? Cool.","start":1812.75,"end":1843.63},{"id":185,"text":"All right, yeah, go for it. Yeah, right. So as you collect data, the quality of data matters a lot too, which is why, and I think data quality is...","start":1845.64,"end":1868.23},{"id":186,"text":"It's tricky, I think. When building an application for the first time, I would still focus on speed and collecting some data quickly. But as you then analyze where your system is going well and what it's doing poorly, you often find that the quality of data really matters. So I'm trying to decide if I should talk about this now or later.","start":1869.07,"end":1890.82},{"id":187,"text":"I'll come back, so let's see, let's go to that.","start":1895.69,"end":1898.17},{"id":188,"text":"All right, let me talk about LLM1.","start":1898.35,"end":1899.91}],"notes":["本段主要讨论在深度学习项目中，数据质量与数据子类别的选择对系统性能提升的重要性。讲者指出，单纯增加数据量并不是最有效的方式，而是需要识别出对系统性能提升有价值的子类别数据。例如，在大型语言模型（LLMs）中，有两个主要的价值领域：一是回答一般性问题，二是用于编程的AI系统。讲者强调，高质量的数据是提升模型性能的关键，而不是盲目地收集各种类型的数据。","讲者提到，数据并不是单一的，而是有多个子类别，因此需要明确哪些子类别的数据值得投资。例如，在编程相关的AI系统中，高质量的编程数据比社交媒体或随机网络聊天数据更有价值。讲者还指出，数据质量在系统性能提升中起着至关重要的作用，尤其是在分析系统表现时，数据质量的差异会直接影响模型的性能。","讲者提到，在构建应用的初期，可能会优先考虑速度和快速收集数据，但随着系统分析的深入，数据质量的重要性会逐渐显现。因此，讲者决定在后续内容中进一步讨论数据质量的问题。","讲者还提到，数据子类别的选择和数据质量的重视是提升系统性能的关键因素。例如，在编程相关的AI系统中，高质量的编程数据是提升模型能力的核心，而不是盲目地收集各种类型的数据。","讲者强调，数据的子类别和质量是深度学习项目中需要重点关注的问题。在实际应用中，需要根据系统的具体需求，选择合适的子类别数据，并确保数据的质量，以提高模型的性能。","讲者最后提到，他将回到数据质量的问题，并继续讨论相关内容。这表明，数据质量是深度学习项目中一个重要的主题，需要在后续内容中进一步展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1722.57,"end":1899.91,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1722.57,"text":"yes, of course I want more data, but just grabbing more data of all types of data is a very inefficient, very expensive way to improve my system. And even if you look at the way that frontier models are trained right now, it's not a game of just grabbing more data of anything under the sun. It is identifying the subcategories where it's valuable to invest to get high quality data, which is why if you look at..."},{"start":1747.82,"text":"It turns out in AI, there are two clear buckets of value in LLMs, right? There's the general answering people's questions. I think, you know, OpenAI Chakri is doing really well there. Gemini, Anthropic have momentum, but there's the answering general questions. And then one of the verticals that's really valuable is AI for coding a system. So I think, you know, Claude has been ahead for a while, but OpenAI..."},{"start":1771.8,"text":"Gemini 2.5 Pro, some of the models are making really good progress in coding as well. And if you look at the work that the frontier teams are doing to improve coding, building iterative agentic workflows is part of it, but also finding clever ways to come up with coding-related data is also part of it. And if you want your alum to do better in coding, you don't grab data willingly with low-quality random internet chat."},{"start":1798.7,"text":"social media or whatever data, right? But instead, having high quality coding related data is how you can have a focus effort to improve your own ability to code. So a lot of these things are actually..."},{"start":1812.75,"text":"Yeah. I feel like more data is better. That is absolutely true, but it's also overly simplistic. Data is not monolithic. There are subcategories of data, and having a view on what piece of data to really invest in getting a lot more of, that's really important to being efficient in how you improve the system performance. That make sense? All right. Well, we'll talk more about error analysis in this later. Any other questions? Cool."},{"start":1845.64,"text":"All right, yeah, go for it. Yeah, right. So as you collect data, the quality of data matters a lot too, which is why, and I think data quality is..."},{"start":1869.07,"text":"It's tricky, I think. When building an application for the first time, I would still focus on speed and collecting some data quickly. But as you then analyze where your system is going well and what it's doing poorly, you often find that the quality of data really matters. So I'm trying to decide if I should talk about this now or later."},{"start":1895.69,"text":"I'll come back, so let's see, let's go to that."},{"start":1898.35,"text":"All right, let me talk about LLM1."}],"speech_gaps":[],"frame":"../frames/v061/011.webp","frame_time":1734.57},{"title":"数据质量与分布匹配的重要性","segments":[{"id":189,"text":"There's a lot of low-quality random chat on the internet","start":1900.63,"end":1904.33},{"id":190,"text":"that's not that useful for training LLMs.","start":1904.33,"end":1906.65},{"id":191,"text":"But I think, you know, this is actually now well-known","start":1906.89,"end":1910.07},{"id":192,"text":"that if you can legally access very high-quality","start":1910.07,"end":1913.21},{"id":193,"text":"written, authored articles or books,","start":1914.45,"end":1916.63},{"id":194,"text":"they're highly edited, very insightful,","start":1916.83,"end":1918.53},{"id":195,"text":"that's very high-quality data for training LLMs.","start":1918.77,"end":1920.97},{"id":196,"text":"And I'll give an example later as well for face recognition.","start":1921.53,"end":1924.43},{"id":197,"text":"It turns out that blurry images would be a lower quality than sharp and focused images,","start":1924.43,"end":1932.85},{"id":198,"text":"assuming that's representative of how you want to recognize people's faces.","start":1932.97,"end":1936.61},{"id":199,"text":"So that really matters as well.","start":1936.93,"end":1938.85},{"id":200,"text":"All right, anything else?","start":1939.79,"end":1941.27},{"id":201,"text":"Cool.","start":1943.99,"end":1944.59},{"id":202,"text":"All right, oh yeah, go for it.","start":1947.03,"end":1948.39},{"id":203,"text":"Yeah, so right, just repeat for Mike.","start":1967.49,"end":1977.51},{"id":204,"text":"Mike, how important is it that the data you collect is similar to the distribution of","start":1977.51,"end":1982.21},{"id":205,"text":"things you want to work on?","start":1982.21,"end":1983.39},{"id":206,"text":"I think it's important, but not as important as most people might think.","start":1984.61,"end":1989.21},{"id":207,"text":"So it turns out that one of the reasons neural networks have been so effective is because","start":1990.43,"end":1998.45},{"id":208,"text":"when you build a very large neural network, you can throw all sorts of data into it, including","start":1998.45,"end":2003.37},{"id":209,"text":"including data that is not perfectly tuned to your test set distribution,","start":2003.37,"end":2009.69},{"id":210,"text":"and it often doesn't hurt,","start":2010.01,"end":2012.19},{"id":211,"text":"so lots of network is bigger.","start":2012.31,"end":2013.51},{"id":212,"text":"So you raise the example, what if we haven't identified two identical objects? If it's generic objects like water bottles and markers, maybe that's too far afield. But if we were to use, let's say, simulated cartoonish characters that look really different than real humans, my guess is it probably won't hurt.","start":2014.07,"end":2034.99},{"id":213,"text":"at all, and it may even help a little bit. And so throwing in a lot of data, if we train a large neural network with a lot of capacity to absorb even some slightly irrelevant data, it usually doesn't hurt and might even help a little bit. But how much it helps is another empirical question that will be problem dependent, and we often just have to try it out. But I think...","start":2035.56,"end":2058.22},{"id":214,"text":"Maybe, you know, like in the past, people used to have an obsession that the data you train on has to come from exactly the same distribution as the distribution you test on. That used to be how machine learning was done, I don't know, like 10, 15 years ago. That's really not true today anymore. I think we're very comfortable. And I think when your networks were much smaller, when you could train very small models,","start":2058.43,"end":2080.47}],"notes":["本段讨论了数据质量对训练大型神经网络的影响。讲者指出，虽然数据与测试分布的匹配性重要，但并非像过去那样严格要求。大型神经网络可以处理不完全匹配的数据，且通常不会造成伤害，甚至可能有所帮助。","讲者提到，过去人们认为训练数据必须与测试数据来自完全相同的分布，但这种观点在现代机器学习中已经不再适用。现在更倾向于使用大量数据，即使这些数据与目标分布不完全匹配。","讲者通过举例说明，即使数据与目标分布存在差异，如使用卡通角色训练人脸识
