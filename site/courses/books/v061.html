别模型，也可能不会造成伤害，甚至可能带来一定帮助。这表明数据的多样性可能对模型性能有积极影响。","讲者强调，虽然数据与目标分布的匹配性重要，但其重要性可能被高估。大型神经网络的容量使其能够吸收一些不相关数据，从而在训练过程中不会受到显著影响。","讲者指出，数据与目标分布的匹配程度对模型性能的影响是一个经验性问题，取决于具体任务。因此，通常需要通过实验来确定最佳的数据选择策略。","讲者提到，过去人们过于强调数据分布的严格匹配，但现代机器学习已经不再如此。这表明数据分布匹配的重要性在不同阶段的机器学习发展中有所变化。"],"formulas":[],"uncertainties":["lots of network is bigger"],"diagram":"none","start":1900.63,"end":2080.47,"asr_flags":[203],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1900.63,"text":"There's a lot of low-quality random chat on the internet"},{"start":1904.33,"text":"that's not that useful for training LLMs."},{"start":1906.89,"text":"But I think, you know, this is actually now well-known"},{"start":1910.07,"text":"that if you can legally access very high-quality"},{"start":1914.45,"text":"written, authored articles or books,"},{"start":1916.83,"text":"they're highly edited, very insightful,"},{"start":1918.77,"text":"that's very high-quality data for training LLMs."},{"start":1921.53,"text":"And I'll give an example later as well for face recognition."},{"start":1924.43,"text":"It turns out that blurry images would be a lower quality than sharp and focused images,"},{"start":1932.97,"text":"assuming that's representative of how you want to recognize people's faces."},{"start":1936.93,"text":"So that really matters as well."},{"start":1939.79,"text":"All right, anything else?"},{"start":1943.99,"text":"Cool."},{"start":1947.03,"text":"All right, oh yeah, go for it."},{"start":1967.49,"text":"Yeah, so right, just repeat for Mike."},{"start":1977.51,"text":"Mike, how important is it that the data you collect is similar to the distribution of"},{"start":1982.21,"text":"things you want to work on?"},{"start":1984.61,"text":"I think it's important, but not as important as most people might think."},{"start":1990.43,"text":"So it turns out that one of the reasons neural networks have been so effective is because"},{"start":1998.45,"text":"when you build a very large neural network, you can throw all sorts of data into it, including"},{"start":2003.37,"text":"including data that is not perfectly tuned to your test set distribution,"},{"start":2010.01,"text":"and it often doesn't hurt,"},{"start":2012.31,"text":"so lots of network is bigger."},{"start":2014.07,"text":"So you raise the example, what if we haven't identified two identical objects? If it's generic objects like water bottles and markers, maybe that's too far afield. But if we were to use, let's say, simulated cartoonish characters that look really different than real humans, my guess is it probably won't hurt."},{"start":2035.56,"text":"at all, and it may even help a little bit. And so throwing in a lot of data, if we train a large neural network with a lot of capacity to absorb even some slightly irrelevant data, it usually doesn't hurt and might even help a little bit. But how much it helps is another empirical question that will be problem dependent, and we often just have to try it out. But I think..."},{"start":2058.43,"text":"Maybe, you know, like in the past, people used to have an obsession that the data you train on has to come from exactly the same distribution as the distribution you test on. That used to be how machine learning was done, I don't know, like 10, 15 years ago. That's really not true today anymore. I think we're very comfortable. And I think when your networks were much smaller, when you could train very small models,"}],"speech_gaps":[],"frame":"../frames/v061/012.webp","frame_time":1912.63},{"title":"数据设计与模型部署","segments":[{"id":215,"text":"There was a sense that you didn't want to distract the neural network with irrelevant data, right? Because computers were expensive, with few parameters, and you're distracted on irrelevant stuff, maybe it gets less good at the core tasks you really care about. But if you can train a bigger neural network, which is getting easier and easier these days, then it's become much more okay to toss in some data.","start":2081.43,"end":2104.37},{"id":216,"text":"That hopefully isn't incorrect data. I think incorrect data is a problem, but just irrelevant examples hurts much less because big neural networks is like a human brain, right? You know, I don't know. The fact that, whatever, the fact that I learned to play the piano, you know, probably doesn't make me worse at it.","start":2104.89,"end":2122.53},{"id":217,"text":"AI, right? Because hopefully my brain is big enough to learn to play the piano and learn some self-able AI. And I think as neural networks get big enough, they can learn some other irrelevant things and also do well the core tasks you really care about. But this is less true when, you know, if my brain was really small, then...","start":2123.5,"end":2140.82},{"id":218,"text":"I don't think any of you are fans of Sherlock Holmes, but I think Sherlock Holmes had an attic theory that your brain has only so much capacity, so you've got to forget some stuff to learn new stuff. But when you train very large neural networks, that's much less true. Cool. All right, thank you for all the questions. So what I want to do is just keep going through this flow, right? So we talked about your data design model.","start":2142.5,"end":2165.84},{"id":219,"text":"Train the model. We'll talk a lot more about error analysis later this quarter of how to figure out where your algorithm is still subpar and where to focus efforts to improve it. But what I want to do is give you a sense of deployment. So when you have trained the model, it's often a bunch of software engineering work to then","start":2166.52,"end":2200.32},{"id":220,"text":"maybe take your model hosted in the Cloud,","start":2200.84,"end":2202.84},{"id":221,"text":"the local server, and have it run inference.","start":2202.94,"end":2205.18},{"id":222,"text":"It's a very common architecture for","start":2205.62,"end":2207.54},{"id":223,"text":"deploying machine learning model will be that,","start":2207.54,"end":2209.2},{"id":224,"text":"given your network as a piece of software,","start":2209.22,"end":2211.16},{"id":225,"text":"you deploy it maybe on the Cloud hosted service so that","start":2211.38,"end":2215.16},{"id":226,"text":"your software can accept a picture or","start":2215.16,"end":2218.14},{"id":227,"text":"accept two pictures and will reply back,","start":2218.14,"end":2220.18},{"id":228,"text":"do I unlock the door or not?","start":2220.92,"end":2222.7},{"id":229,"text":"Or is this the same person or not?","start":2222.8,"end":2224.0},{"id":230,"text":"So there's a bunch of software engineering work that needs to be done.","start":2224.12,"end":2226.8},{"id":231,"text":"But in practical deployment settings,","start":2227.12,"end":2229.24},{"id":232,"text":"I should tell you, it turns out that if you're building a practical face recognition system,","start":2230.44,"end":2234.48},{"id":233,"text":"you probably find that if you are trying to unlock a door to a corporate campus, it's","start":2234.8,"end":2242.98},{"id":234,"text":"too expensive or too slow to stream video 24-7 to cloud to classify every frame at 30","start":2242.98,"end":2251.0},{"id":235,"text":"frames per second to see if there's a person that you should unlock the door for.","start":2251.0,"end":2255.24},{"id":236,"text":"floor. So in practical face recognition systems,","start":2255.24,"end":2258.36},{"id":237,"text":"what we end up doing,","start":2259.04,"end":2261.1}],"notes":["本段讨论了在训练神经网络时，如何处理无关数据的问题。讲者指出，当计算资源有限时，无关数据可能会影响模型在核心任务上的表现。但随着神经网络规模的增大，这种影响会减小，因为大模型具有更强的泛化能力。讲者用人类大脑学习钢琴的例子来类比，说明大模型可以同时学习多个任务而不影响核心能力。","讲者提到，当神经网络足够大时，其学习能力类似于人类大脑，可以同时处理多个任务。但小模型则需要通过遗忘旧知识来学习新知识，这类似于福尔摩斯的“阁楼理论”。讲者强调，随着模型规模的增加，这种限制会减弱。","讲者随后转向模型部署的讨论，指出训练模型后需要进行大量的软件工程工作，包括将模型部署到云端或本地服务器，并进行推理。讲者提到，部署时需要考虑实际应用场景，例如在企业门禁系统中，实时视频流处理可能过于昂贵或缓慢。","讲者以人脸识别系统为例，说明在实际部署中，需要权衡计算成本和实时性。例如，24小时不间断地将视频流上传到云端进行实时分类可能不现实，因此需要寻找更高效的解决方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2081.43,"end":2261.1,"asr_flags":[],"tr o then"},{"start":2200.84,"text":"maybe take your model hosted in the Cloud,"},{"start":2202.94,"text":"the local server, and have it run inference."},{"start":2205.62,"text":"It's a very common architecture for"},{"start":2207.54,"text":"deploying machine learning model will be that,"},{"start":2209.22,"text":"given your network as a piece of software,"},{"start":2211.38,"text":"you deploy it maybe on the Cloud hosted service so that"},{"start":2215.16,"text":"your software can accept a picture or"},{"start":2218.14,"text":"accept two pictures and will reply back,"},{"start":2220.92,"text":"do I unlock the door or not?"},{"start":2222.8,"text":"Or is this the same person or not?"},{"start":2224.12,"text":"So there's a bunch of software engine work that needs to be done."},{"start":2227.12,"text":"But in practical deployment settings,"},{"start":2230.44,"text":"I should tell you, it turns out that if you're building a practical face recognition system,"},{"start":2234.8,"text":"you probably find that if you are trying to unlock a door to a corporate campus, it's"},{"start":2242.98,"text":"too expensive or too slow to stream video 24-7 to cloud to classify every frame at 30"},{"start":2251.0,"text":"frames per second to see if there's a person that you should unlock the door for."},{"start":2255.24,"text":"floor. So in practical face recognition systems,"},{"start":2259.04,"text":"what we end up doing,"}],"speech_gaps":[],"frame":"../frames/v061/013.webp","frame_time":2093.43},{"title":"视觉活动检测（VAD）在门禁系统中的应用","segments":[{"id":238,"text":"actually, let's take the example of someone walking up to the door,","start":2261.32,"end":2266.46},{"id":239,"text":"to your door at home,","start":2266.5,"end":2267.8},{"id":240,"text":"and you want to see if there's someone there,","start":2268.48,"end":2270.62},{"id":241,"text":"they should unlock the door floor.","start":2270.66,"end":2271.78},{"id":242,"text":"So a lot of systems will actually have image from the camera,","start":2273.16,"end":2278.18},{"id":243,"text":"and then try to build a system.","start":2278.26,"end":2281.18},{"id":244,"text":"So what we have so far is a system that takes us in from an image and maybe a reference","start":2284.1,"end":2290.54},{"id":245,"text":"image.","start":2290.54,"end":2290.86},{"id":246,"text":"Neural network says, do I unlock the door or not?","start":2291.48,"end":2295.4},{"id":247,"text":"But it turns out that if streaming video is too expensive, classifying every frame is","start":2295.96,"end":2301.62},{"id":248,"text":"too expensive, will often end up with a system like this, where VAD stands for visual activity","start":2301.62,"end":2317.12},{"id":249,"text":"And what this does is a usually low-cost, low-power, inexpensive compute job to run to just very quickly maybe try to figure out, is there a human face there? Because it turns out, actually, if you're building something, unlock your front door to you and your friends. If you look out my front door in my house, it's pretty boring. There's a wall, we see a little bit of street, but nothing moves most of the time. So it's very obviously.","start":2323.27,"end":2348.91},{"id":250,"text":"almost all of the time it's very obvious that there's no one outside my front door trying to be let in and it'd be very wasteful to stream all that video to the internet for classification. So visual activity detection is usually a low-cost, low-power system to just very quickly decide, should I do the work of sending this to the larger face recognition system neural network that may be hosted on the cloud to have it do the much more computationally expensive work to decide.","start":2349.66,"end":2379.02},{"id":251,"text":"0 or 1, do I unlock the door or not? So this type of optimization in order to make the system computationally feasible to deploy is fairly common. I'm going to give you two options for how to implement VAD, and I'm going to ask you to reflect on them and then tell me which one you would pick to get started. So option 1,","start":2379.5,"end":2406.88},{"id":252,"text":"is a non-machine learning based method, which is see if the number of pixels changed is greater than some threshold epsilon, right? So if the camera is stationary, maybe looking at the wall, most of the time the pixels barely change because it's just a wall. And so you can write a little bit of code using","start":2409.2,"end":2436.67}],"notes":["本段介绍了视觉活动检测（VAD）在门禁系统中的应用，通过一个实际例子说明了为什么需要VAD。讲者提到，如果直接对视频流进行分类，计算成本太高，因此需要一个低功耗、低成本的系统来快速判断是否有活动发生。VAD的作用是决定是否将视频发送到更复杂的面部识别系统进行处理。","讲者进一步解释了VAD的工作原理，即通过检测像素变化来判断是否有活动。如果摄像头静止，比如对着墙壁，像素变化很少，因此可以快速判断是否需要进一步处理。这种优化使得系统在计算上更加可行。","讲者提出了两种实现VAD的方法，并要求学生思考并选择其中一种开始实现。第一种是非机器学习方法，即通过检测像素变化是否超过某个阈值来判断是否有活动。","这种方法适用于静态场景，如家庭门禁系统，因为大多数时间没有活动发生，因此可以避免不必要的计算资源消耗。这种方法简单且高效，适合部署在低功耗设备上。","讲者提到，如果直接对视频流进行分类，计算成本太高，因此需要VAD来减少不必要的计算。VAD的作用是快速判断是否有活动，从而决定是否将视频发送到更复杂的系统进行处理。","讲者强调了VAD在实际应用中的重要性，特别是在资源受限的场景中。通过VAD，可以显著降低计算成本，提高系统的效率和可行性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2261.32,"end":2436.67,"asr_flags":[248],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2261.32,"text":"actually, let's take the example of someone walk up to the door,"},{"start":2266.5,"text":"to your door at home,"},{"start":2268.48,"text":"and you want to see if there's someone there,"},{"start":2270.66,"text":"they should unlock the door floor."},{"start":2273.16,"text":"So a lot of systems will actually have image from the camera,"},{"start":2278.26,"text":"and then try to build a system."},{"start":2284.1,"text":"So what we have so far is a system that takes us in from an image and maybe a reference"},{"start":2290.54,"text":"image."},{"start":2291.48,"text":"Neural network says, do I unlock the door or not?"},{"start":2295.96,"text":"But it turns out that if streaming video is too expensive, classifying every frame is"},{"start":2301.62,"text":"too expensive, will often end up with a system like this, where VAD stands fo 延迟之间的平衡，以确保系统的实时性和有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2616.27,"end":2791.19,"asr_flags":[292,310],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2616.27,"text":"while we collect more data"},{"start":2617.61,"text":"and then replace that"},{"start":2619.61,"text":"one with the second one."},{"start":2621.63,"text":"Yeah, cool, great. So use option"},{"start":2623.53,"text":"one in the short term, and"},{"start":2625.61,"text":"then maybe replace that with option two"},{"start":2627.33,"text":"where we have more data. Yeah, cool, that's very"},{"start":2629.27,"text":"sane approach. Go ahead."},{"start":2630.61,"text":"I'm thinking about why not using two options, like, you know, because, you know, for me,"},{"start":2635.31,"text":"if, like, for all three rounds, it's fine, it's very simple. Only if that is clear, then"},{"start":2640.59,"text":"we have, like, we can say, oh, we can do that or not. And then, after that, that's what"},{"start":2644.75,"text":"we can do or not."},{"start":2647.27,"text":"Oh, oh, sorry. So use, oh, use both options. No, put both in the pipeline. Oh, that's interesting."},{"start":2651.81,"text":"I see."},{"start":2653.03,"text":"All right, so see if option one, let option one see if anything changed. If something"},{"start":2656.59,"text":"change then passes from your network yeah cool yeah that could work so the"},{"start":2670.13,"text":"cascaded multiple steps"},{"start":2686.59,"text":"If it's more expensive, then I would probably invest more into options."},{"start":2690.47,"text":"Okay, that's cool."},{"start":2691.61,"text":"So if I take care of it, I'm wasting a bunch of money."},{"start":2694.93,"text":"That's cool."},{"start":2695.61,"text":"Yeah, right."},{"start":2696.03,"text":"Yeah, so how expensive is it to run this new network in the cloud?"},{"start":2698.41,"text":"So actually, so I would usually want to design both of these to run at the edge, meaning"},{"start":2704.41,"text":"on the device."},{"start":2705.77,"text":"Or the other, you're going to overpass it."},{"start":2708.07,"text":"Oh, this one?"},{"start":2709.01,"text":"Yeah."},{"start":2710.99,"text":"So it turns out that streaming video is fairly expensive."},{"start":2717.09,"text":"So I think, yeah, I feel like, boy, I don't have numbers at tip of my fingertips, but"},{"start":2726.39,"text":"I think running this 24-7 is not feasible."},{"start":2730.59,"text":"So we definitely need something to filter it down."},{"start":2733.83,"text":"but sending, you know, I don't know, a few images every minute is probably not a problem."},{"start":2745.91,"text":"All right, sample certain frames of the video in order to get all of them."},{"start":2762.25,"text":"Yes, I guess so, yes, although I think if you have a video of my front door, you need"},{"start":2772.27,"text":"a way to sample other than random, I guess, right?"},{"start":2775.03,"text":"Because a lot of times nothing happens, unless you take one frame per minute, I guess, which"},{"start":2782.27,"text":"would be okay, but then we don't want someone waiting there for a full minute before we"},{"start":2786.91,"text":"finally get around to sampling and then sending it, so yeah, go ahead."}],"speech_gaps":[{"start":2671.968,"end":2673.728},{"start":2743.76,"end":2745.264}],"frame":"../frames/v061/016.webp","frame_time":2628.27},{"title":"使用相同图像训练网络的可行性","segments":[{"id":316,"text":"Yeah, could we use the same images for training this network to train this option","start":2803.87,"end":2809.77},{"id":317,"text":"two network?","start":2809.77,"end":2810.37},{"id":318,"text":"Maybe.","start":2811.31,"end":2811.71},{"id":319,"text":"It's actually one of those things, I would say we have to try it before we know if it","start":2812.95,"end":2816.69},{"id":320,"text":"works.","start":2816.69,"end":2816.93},{"id":321,"text":"It might be doable.","start":2817.13,"end":2817.79},{"id":322,"text":"It depends a lot on what data we collected to train the brain neural network.","start":2817.79,"end":2820.99},{"id":323,"text":"Yeah.","start":2821.63,"end":2821.97},{"id":324,"text":"Cool.","start":2823.37,"end":2823.73},{"id":325,"text":"Anything else?","start":2823.95,"end":2824.51},{"id":326,"text":"All right.","start":2824.59,"end":2824.73},{"id":327,"text":"Let's take a call .","start":2824.75,"end":2825.79},{"id":328,"text":"Go ahead.","start":2825.79,"end":2826.21},{"id":329,"text":".","start":2827.63,"end":2827.99},{"id":330,"text":"Cool.","start":2835.63,"end":2835.99},{"id":331,"text":"Right.","start":2836.09,"end":2836.23},{"id":332,"text":"Yeah.","start":2836.29,"end":2836.39},{"id":333,"text":"How about use option one, keep a really low threshold, so we send very few images.","start":2836.45,"end":2840.79},{"id":334,"text":"Is that what you mean?","start":2841.01,"end":2841.45},{"id":335,"text":"Yeah.","start":2842.61,"end":2842.97},{"id":336,"text":"I think that'd be reasonable to try.","start":2843.09,"end":2845.79},{"id":337,"text":"Well, so that we don't miss too many people, but yeah. Let's take one last comment, I'll share a perspective on how . Yes. So one of the weaknesses of option 1 is if there's a tree swaying in the background, or if you see a road and there's a car that drives by, or if there's a busy street, the car's driving by all the time, or the neighbor's cat comes and visits, those will trigger this. So those are the downsides.","start":2847.67,"end":2880.47},{"id":338,"text":"So let me show you a perspective of how I would approach this and what we actually do. So if you're the CTO of a startup implementing this, to me, it again comes down to speed, right? And so what I would ask is, how long does it take to implement option one? And how long does it take to implement option two? And I think everyone made good points about the pros and cons of these two options.","start":2881.48,"end":2908.18},{"id":339,"text":"And if you're actually doing this, the approach I would take is, you know, just ask, what can I do really quickly so I can then deploy it and see whether it works? And I'll fix it if it doesn't work. Because I think these insights, like, would she swing in the background affect it? You know, it turns out that she does probably, but...","start":2909.07,"end":2930.63},{"id":340,"text":"Maybe not, if the wind isn't that strong. But it's very difficult to know answers to questions like these because you don't really know until you stick on a bunch of cameras in front of doors and see the data, then you can get more confident in how well option 1","start":2930.87,"end":2947.05},{"id":341,"text":"works, how often does the neighbor's cat actually come by? If there's a car that drives past, are the cars usually so far away that it doesn't matter because the number of pixels per car is small? All of these are very empirical questions, it's really difficult to answer. The fastest way to get answers is just implement something quick and dirty, and then run it, see what goes wrong, and then fix it.","start":2947.62,"end":2968.94}],"notes":["本段讨论了在训练神经网络时是否可以使用相同的图像进行训练的问题。讲者指出，这取决于所收集的数据，因此需要尝试才能确定是否可行。","讲者提到，使用选项一（保持低阈值）可以发送较少的图像，但可能会触发一些不必要的事件，如背景中的树摇晃、汽车经过等，这些是选项一的缺点。","讲者进一步说明，作为初创公司的CTO，他更关注速度，因此会优先考虑快速实现方案，并通过实际部署和运行来发现问题并进行修复。","讲者强调，许多关于系统性能的问题（如邻居的猫是否经常出现、汽车是否距离足够远等）很难在理论上回答，必须通过实际数据来验证。","讲者建议采用快速且粗糙的实现方法，以尽快获得反馈并进行调整，这是处理这类问题的常见做法。","整个讨论围绕如何在实际部署中权衡不同选项的优缺点，并通过实验来验证假设，体现了工程实践中常见的试错方法。"],"formulas":[],"uncertainties":["tree swaying in the background","neighbor's cat comes and visits","car's driving by all the time","number of pixels per car","how often does the neighbor's cat actually come by"],"diagram":"none","start":2803.87,"end":2968.94,"asr_flags":[326,332],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2803.87,"text":"Yeah, could we use the same images for training this network to train this option"},{"start":2809.77,"text":"two network?"},{"start":2811.31,"text":"Maybe."},{"start":2812.95,"text":"It's actually one of those things, I would say we have to try it before we know if it"},{"start":2816.69,"text":"works."},{"start":2817.13,"text":"It might be doable."},{"start":2817.79,"text":"It depends a lot on what data we collected to train the brain neural network."},{"start":2821.63,"text":"Yeah."},{"start":2823.37,"text":"Cool."},{"start":2823.95,"text":"Anything else?"},{"start":2824.59,"text":"All right."},{"start":2824.75,"text":"Let's take a call ."},{"start":2825.79,"text":"Go ahead."},{"start":2827.63,"text":"."},{"start":2835.63,"text":"Cool."},{"start":2836.09,"text":"Right."},{"start":2836.29,"text":"Yeah."},{"start":2836.45,"text":"How about use option one, keep a really low threshold, so we send very few images."},{"start":2841.01,"text":"Is that what you mean?"},{"start":2842.61,"text":"Yeah."},{"start":2843.09,"text":"I think that'd be reasonable to try."},{"start":2847.67,"text":"Well, so that we don't miss too many people, but yeah. Let's take one last comment, I'll share a perspective on how . Yes. So one of the weaknesses of option 1 is if there's a tree swaying in the background, or if you see a road and there's a car that drives by, or if there's a busy street, the car's driving by all the time, or the neighbor's cat comes and visits, those will trigger this. So those are the downsides."},{"start":2881.48,"text":"So let me show you a perspective of how I would approach this and what we actually do. So if you're the CTO of a startup implementing this, to me, it again comes down to speed, right? And so what I would ask is, how long does it take to implement option one? And how long does it take to implement option two? And I think everyone made good points about the pros and cons of these two options."},{"start":2909.07,"text":"And if you're actually doing this, the approach I would take is, you know, just ask, what can I do really quickly so I can then deploy it and see whether it works? And I'll fix it if it doesn't work. Because I think these insights, like, would she swing in the background affect it? You know, it turns out that she does probably, but..."},{"start":2930.87,"text":"Maybe not, if the wind isn't that strong. But it's very difficult to know answers to questions like these because you don't really know until you stick on a bunch of cameras in front of doors and see the data, then you can get more confident in how well option 1"},{"start":2947.62,"text":"works, how often does the neighbor's cat actually come by? If there's a car that drives past, are the cars usually so far away that it doesn't matter because the number of pixels per car is small? All of these are very empirical questions, it's really difficult to answer. The fastest way to get answers is just implement something quick and dirty, and then run it, see what goes wrong, and then fix it."}],"speech_gaps":[],"frame":"../frames/v061/017.webp","frame_time":2815.87},{"title":"实现深度学习项目的实际经验","segments":[{"id":342,"text":"What the experience of a lot of face recognition teams is, because option 1 is so quick to implement, this is like, I don't know, five lines of Python or something. I don't want to write it for you. I just want to write the five lines of Python for you. You can implement this in","start":2970.93,"end":2989.87},{"id":343,"text":"you know, 20 minutes, maybe even less. Whereas this, I think will take you at least many hours, maybe longer to implement. So my instinct would be the start of this. And it turns out having built many face recognition systems, I'll tell you, this actually doesn't work well enough for all the problems people raise. And so we wind up going to this, but implementing this also gives you insights into where it's going wrong.","start":2990.39,"end":3015.91},{"id":344,"text":"And I'll give you one example of one insight that we and many other face recognition teams have, which is it turns out that when you're approaching a camera that's trying to recognize your face,","start":3016.42,"end":3032.06},{"id":345,"text":"there are some frames that are going to be really clear and in focus, and a lot of frames are really blurry, right? If you just look at a video of someone walking toward the camera, sometimes, just, you know, when I'm stepping, sometimes the velocity of my face is higher and sometimes it's lower, right? That's just what it is. And so sometimes my face is in focus, sometimes it's more blurry.","start":3032.84,"end":3053.16},{"id":346,"text":"And it turns out that if you can select out the high resolution frames and feed that to face recognition, you get much higher quality results, right? So this is the kind of stuff that I assume most people would not know about until you work on a system like this. But it turns out that when I was working on a system like that, having a system to not just do VAD, but also capture the video and then deliberately select","start":3054.09,"end":3082.41},{"id":347,"text":"not just one, but maybe five frames to the high resolution and in focus of the person, that actually gave a significant boost to the accuracy of our face recognition system.","start":3082.79,"end":3092.71},{"id":348,"text":"And I mentioned this as an example of the sort of discovery that you have only when you implement one of these systems, maybe even implement this system. But you implement this system, you see, boy, we're trying to recognize a lot of pictures from very faces. Maybe we need to do something about that, right? And this is driving the empirical process that may then lead you to train in your network, both to see if there's a face, but also to see if the picture of the face is in focus to select out that frame for downstream processing.","start":3093.46,"end":3121.02},{"id":349,"text":"Does that make sense? And this is why you find that for some meaningful fraction of questions I ask in class, the thing that's the speediest to do is often the right answer because that obsession with speed really lets you go in and figure out what's in your data and improve your system more efficiently.","start":3121.53,"end":3141.27}],"notes":["本段主要讲述在实现深度学习项目时，快速实现的方案虽然容易，但可能无法满足所有需求，而深入实现则能带来更高质量的结果。讲者提到，通过选择高分辨率的帧来提升人脸识别的准确性，这是在实际项目中发现的洞察。","讲者以一个具体例子说明，当一个人走向摄像头时，有些帧是清晰的，有些则是模糊的。这种现象是由于运动速度不同导致的，因此选择清晰的帧可以显著提升识别效果。","讲者进一步指出，通过系统地选择高分辨率且对焦的帧，可以显著提升人脸识别系统的准确性。这表明在实际项目中，对数据的深入分析和处理是提升模型性能的关键。","讲者强调，只有在实际实现系统的过程中，才能发现这些关键的洞察。这种经验驱动的方法有助于优化模型，使其更有效地处理数据。","最后，讲者提到，快速实现方案往往能更快地揭示数据中的问题，从而更高效地改进系统。这说明在深度学习项目中，速度和效率是发现和解决问题的重要因素。","整个段落强调了在实际项目中，通过深入分析和处理数据，可以发现并解决模型性能问题，从而提升整体效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2970.93,"end":3141.27,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2970.93,"text":"What the experience of a lot of face recognition teams is, because option 1 is so quick to implement, this is like, I don't know, five lines of Python or something. I don't want to write it for you. I just want to write the five lines of Python for you. You can implement this in"},{"start":2990.39,"text":"you know, 20 minutes, maybe even less. Whereas this, I think will take you at least many hours, maybe longer to implement. So my instinct would be the start of this. And it turns out having built many face recognition systems, I'll tell you, this actually doesn't work well enough for all the problems people raise. And so we wind up going to this, but implementing this also gives you insights into where it's going wrong."},{"start":3016.42,"text":"And I'll give you one example of one insight that we and many other face recognition teams have, which is it turns out that when you're approaching a camera that's trying to recognize your face,"},{"start":3032.84,"text":"there are some frames that are going to be really clear and in focus, and a lot of frames are really blurry, right? If you just look at a video of someone walking toward the camera, sometimes, just, you know, when I'm stepping, sometimes the velocity of my face is higher and sometimes it's lower, right? That's just what it is. And so sometimes my face is in focus, sometimes it's more blurry."},{"start":3054.09,"text":"And it turns out that if you can select out the high resolution frames and feed that to face recognition, you get much higher quality results, right? So this is the kind of stuff that I assume most people would not know about until you work on a system like this. But it turns out that when I was working on a system like that, having a system to not just do VAD, but also capture the video and then deliberately select"},{"start":3082.79,"text":"not just one, but maybe five frames to the high resolution and in focus of the person, that actually gave a significant boost to the accuracy of our face recognition system."},{"start":3093.46,"text":"And I mentioned this as an example of the sort of discovery that you have only when you implement one of these systems, maybe even implement this system. But you implement this system, you see, boy, we're trying to recognize a lot of pictures from very faces. Maybe we need to do something about that, right? And this is driving the empirical process that may then lead you to train in your network, both to see if there's a face, but also to see if the picture of the face is in focus to select out that frame for downstream processing."},{"start":3121.53,"text":"Does that make sense? And this is why you find that for some meaningful fraction of questions I ask in class, the thing that's the speediest to do is often the right answer because that obsession with speed really lets you go in and figure out what's in your data and improve your system more efficiently."}],"speech_gaps":[],"frame":"../frames/v061/018.webp","frame_time":2982.93},{"title":"模型部署与维护中的挑战","segments":[{"id":350,"text":"So what happens in the practice? Start with this, discover how it doesn't work because it doesn't actually work, I can tell you that, and then figure out, but use those learnings to do this. So is there a sense of what is a good classification accuracy for all these ideas? It's actually really difficult. One of the common benchmarks, you learn more about this in the third module on the online videos as well, is","start":3150.91,"end":3185.48},{"id":351,"text":"Building machine learning systems is easier if we have a reference level of performance, like an aspirational target accuracy, which is often human-level performance. And so it turns out that the way you diagnose bias and variance, which we'll talk about later in this course, is easier if you know what's an achievable level of accuracy. And very often, we'll use what a human expert could do as the achievable level of accuracy.","start":3186.4,"end":3212.58},{"id":352,"text":"In the case of face recognition, definitely under-controlled environments were better than humans. So definitely, actually, the AI systems we built, they're way better than I am at recognizing human faces. And I think AI systems are better than, I want to say, probably the vast majority of humans, maybe all humans at this point, at really distinguishing of two pictures or the same. And then it gets really difficult. Then it actually gets more difficult once you're even better than humans. But those are...","start":3215.64,"end":3242.96},{"id":353,"text":"Yeah, but at least, but until you're as good as humans on a certain task, using a human level performance is often a good benchmark. And then if you're doing something that even humans can't do well, like it turns out you're recommending online books or movies or whatever, humans aren't actually that good at that. I think most of us have a hard time recommending good movies, even to our closest friends. AI actually probably does it even better than many of us do as humans. Then those things, it's harder to establish a baseline.","start":3243.44,"end":3271.34},{"id":354,"text":"Cool. All right. Now, one final aspect I want to touch on is after deploying a model to monitor and to maintain the model. One thing that often happens is you create a machine learning model,","start":3274.35,"end":3296.82},{"id":355,"text":"Cool. All right. Now, one final aspect I want to touch on is after deploying a model to monitor and to maintain the model. One thing that often happens is you create a machine learning model, works great, does well in your training set, does well in your test set, works great, and then you deploy it, and then annoyingly, the world changes and your system no longer works. So we sometimes call this data drift or concept drift, where the distribution of data the world gives you is different than what you have in your training set, or concept drift, which is the input-output mapping, your X and Y changes in the world compared to your training set.","start":3297.58,"end":3324.22}],"notes":["本段讨论了在模型部署后维护模型的重要性，指出即使模型在训练集和测试集上表现良好，但在实际部署后，由于世界变化，模型可能不再有效。这涉及数据漂移（data drift）和概念漂移（concept drift）的概念，即数据分布或输入-输出映射发生变化。","讲者提到，当模型性能达到或超过人类水平时，建立基准线会更加困难。例如，在推荐系统中，人类可能并不擅长推荐书籍或电影，而AI系统可能表现得更好。这说明在某些任务中，人类水平的基准可能并不适用。","在人脸识别任务中，AI系统在受控环境下表现优于人类，这表明在某些特定任务中，AI可以超越人类表现。然而，当模型性能超过人类时，评估其性能的基准线变得更加复杂。","讲者强调，使用人类水平的性能作为基准线在某些任务中是合理的，但并非所有任务都适用。例如，在推荐系统中，人类可能无法提供高质量的推荐，因此需要寻找其他基准。","模型部署后，由于数据分布或输入-输出映射的变化，模型可能不再有效。这种变化被称为数据漂移或概念漂移，是模型维护中的关键挑战。","讲者指出，模型在训练集和测试集上表现良好并不保证其在实际部署中的表现，因此需要持续监控和维护模型，以应对世界的变化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3150.91,"end":3324.22,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3150.91,"text":"So what happens in the practice? Start with this, discover how it doesn't work because it doesn't actually work, I can tell you that, and then figure out, but use those learnings to do this. So is there a sense of what is a good classification accuracy for all these ideas? It's actually really difficult. One of the common benchmarks, you learn more about this in the third module on the online videos as well, is"},{"start":3186.4,"text":"Building machine learning systems is easier if we have a reference level of performance, like an aspirational target accuracy, which is often human-level performance. And so it turns out that the way you diagnose bias and variance, which we'll talk about later in this course, is easier if you know what's an achievable level of accuracy. And very often, we'll use what a human expert could do as the achievable level of accuracy."},{"start":3215.64,"text":"In the case of face recognition, definitely under-controlled environments were better than humans. So definitely, actually, the AI systems we built, they're way better than I am at recognizing human faces. And I think AI systems are better than, I want to say, probably the vast majority of humans, maybe all humans at this point, at really distinguishing of two pictures or the same. And then it gets really difficult. Then it actually gets more difficult once you're even better than humans. But those are..."},{"start":3243.44,"text":"Yeah, but at least, but until you're as good as humans on a certain task, using a human level performance is often a good benchmark. And then if you're doing something that even humans can't do well, like it turns out you're recommending online books or movies or whatever, humans aren't actually that good at that. I think most of us have a hard time recommending good movies, even to our closest friends. AI actually probably does it even better than many of us do as humans. Then those things, it's harder to establish a baseline."},{"start":3274.35,"text":"Cool. All right. Now, one final aspect I want to touch on is after deploying a model to monitor and to maintain the model. One thing that often happens is you create a machine learning model,"},{"start":3297.58,"text":"works great, does well in your training set, does well in your test set, works great, and then you deploy it, and then annoyingly, the world changes and your system no longer works. So we sometimes call this data drift or concept drift, where the distribution of data the world gives you is different than what you have in your training set, or concept drift, which is the input-output mapping, your X and Y changes in the world compared to your training set."}],"speech_gaps":[],"frame":"../frames/v061/019.webp","frame_time":3162.91},{"title":"数据漂移与实际应用的挑战","segments":[{"id":356,"text":"But to ground this, if you are creating a face recognition system now in, you know,","start":3324.88,"end":3331.34},{"id":357,"text":"I don't know, when it's not too cold here in California, you get faces of a certain distribution.","start":3331.36,"end":3337.9},{"id":358,"text":"But as we approach winter, if it starts to rain more, people are wearing scarves, rain jackets,","start":3338.36,"end":3344.3},{"id":359,"text":"you know, people look different, right?","start":3344.86,"end":3347.14},{"id":360,"text":"Or maybe we approach the summer, more people are wearing sunglasses,","start":3347.24,"end":3352.08},{"id":361,"text":"losses then the data distribution changes or if you train the system based on data here in","start":3352.08,"end":3360.02},{"id":362,"text":"California but we then decide to deploy it you know in a different country where people","start":3360.02,"end":3364.56},{"id":363,"text":"dress differently or where their appearance is different the world keeps on giving us different","start":3364.56,"end":3370.82},{"id":364,"text":"data and so one of the jobs of I think us as machine learning engineers is to put in place","start":3370.82,"end":3380.32},{"id":365,"text":"systems that monitor this type of concept drift or data drift and fix problems as they arise.","start":3380.32,"end":3385.68},{"id":366,"text":"When you're out building machine learning systems, I have seen a segment of AI engineers","start":3386.78,"end":3391.78},{"id":367,"text":"that think their job is to do well on a test set. And so I've been in a bunch of these conversations","start":3391.78,"end":3397.3},{"id":368,"text":"where the machine learning person will say, look, I did well on the test set. My job is done.","start":3397.3,"end":3402.68},{"id":369,"text":"But then a product owner or business owner will say, no, your system doesn't work. Look at all","start":3403.26,"end":3408.24},{"id":370,"text":"the ways it does not work. And then if the machine learning person says, well, that's","start":3408.24,"end":3412.98},{"id":371,"text":"not my problem, I do it on the test set, I think that's not a constructive way.","start":3412.98,"end":3416.92},{"id":372,"text":"to move it forward. So I encourage you to think of yourselves, if you're building machine learning system, I think of my job as building something that works and that can be different than building something that works on the test set. So if ever you're working on a product and someone says, you know, I know you did well on the test set, but your system doesn't work, I would encourage you not to respond.","start":3417.47,"end":3439.13},{"id":373,"text":"But my job is to do on the test set. I encourage you to think about why doing well on the test set doesn't translate to doing well on the application that people actually care about, and then they'll lean in and go and fix that. And one of the common problems for why doing well on the test set doesn't translate to doing well in real life is if the data distribution changes, in which case you may need to update the distribution of data you're training on in order to capture what has changed in the world.","start":3439.84,"end":3467.14},{"id":374,"text":"And just a few other examples. I feel like the world gives us new data all the time. So if you're building a web search engine, sometimes the new politician is elected, or there's a new movement, or some new video goes viral, or I don't know, Taylor Swift releases a new album, I don't know, whatever.","start":3469.23,"end":3490.77}],"notes":["本段讲授了数据漂移（data drift）和概念漂移（concept drift）的概念，指出当数据分布发生变化时，机器学习系统可能无法正常工作。例如，当天气变化导致人们穿着不同，或者部署地点不同导致人群外貌差异时，系统需要监测这些变化并进行调整。","讲者强调了机器学习工程师的职责不仅是让模型在测试集上表现良好，还要确保系统在实际应用中有效。这涉及到对数据分布变化的监控和应对，以及对模型的持续更新。","讲者举了多个例子，如天气变化、不同国家的穿着差异、政治人物选举、网络流行趋势等，说明世界不断产生新的数据，机器学习系统需要适应这些变化。","讲者批评了某些AI工程师只关注测试集表现而忽视实际应用的错误观念，指出这种做法可能导致系统在现实场景中失效。","讲者鼓励学习者思考为什么在测试集上表现良好的模型可能在实际应用中表现不佳，并强调需要关注数据分布的变化，及时调整训练数据。","讲者指出，数据漂移是导致模型在实际应用中失效的常见原因之一，因此需要建立系统来监测和应对这种变化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3324.88,"end":3490.77,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3324.88,"text":"But to ground this, if you are creating a face recognition system now in, you know,"},{"start":3331.36,"text":"I don't know, when it's not too cold here in California, you get faces of a certain distribution."},{"start":3338.36,"text":"But as we approach winter, if it starts to rain more, people are wearing scarves, rain jackets,"},{"start":3344.86,"text":"you know, people look different, right?"},{"start":3347.24,"text":"Or maybe we approach the summer, more people are wearing sunglasses,"},{"start":3352.08,"text":"losses then the data distribution changes or if you train the system based on data here in"},{"start":3360.02,"text":"California but we then decide to deploy it you know in a different country where people"},{"start":3364.56,"text":"dress differently or where their appearance is different the world keeps on giving us different"},{"start":3370.82,"text":"data and so one of the jobs of I think us as machine learning engineers is to put in place"},{"start":3380.32,"text":"systems that monitor this type of concept drift or data drift and fix problems as they arise."},{"start":3386.78,"text":"When you're out building machine learning systems, I have seen a segment of AI engineers"},{"start":3391.78,"text":"that think their job is to do well on a test set. And so I've been in a bunch of these conversations"},{"start":3397.3,"text":"where the machine learning person will say, look, I did well on the test set. My job is done."},{"start":3403.26,"text":"But then a product owner or business owner will say, no, your system doesn't work. Look at all"},{"start":3408.24,"text":"the ways it does not work. And then if the machine learning person says, well, that's"},{"start":3412.98,"text":"not my problem, I do it on the test set, I think that's not a constructive way."},{"start":3417.47,"text":"to move it forward. So I encourage you to think of yourselves, if you're building machine learning system, I think of my job as building something that works and that can be different than building something that works on the test set. So if ever you're working on a product and someone says, you know, I know you did well on the test set, but your system doesn't work, I would encourage you not to respond."},{"start":3439.84,"text":"But my job is to do on the test set. I encourage you to think about why doing well on the test set doesn't translate to doing well on the application that people actually care about, and then they'll lean in and go and fix that. And one of the common problems for why doing well on the test set doesn't translate to doing well in real life is if the data distribution changes, in which case you may need to update the distribution of data you're training on in order to capture what has changed in the world."},{"start":3469.23,"text":"And just a few other examples. I feel like the world gives us new data all the time. So if you're building a web search engine, sometimes the new politician is elected, or there's a new movement, or some new video goes viral, or I don't know, Taylor Swift releases a new album, I don't know, whatever."}],"speech_gaps":[],"frame":"../frames/v061/020.webp","frame_time":3336.88},{"title":"数据分布变化与模型鲁棒性","segments":[{"id":375,"text":"And then people are suddenly searching for a brand. I thought I got a lot from that. No, all right. No Swifties here. All right. But then suddenly, a lot of people are searching for a brand new thing. And so the distribution of data you get is different because the world has changed.","start":3491.34,"end":3510.78},{"id":376,"text":"I've done a lot of work in factories. There's actually a reasonable chance that a cell phone you have in your pocket may have been inspected by software that my teams wrote. But sometimes the materials change, or there's a new machine installed in the manufacturing line, and this machine makes a new type of scratch on the cell phone. So data changes in inspection lines as well. Or one thing that actually surprised me, when I work on self-driving cars, one of the teams I was working with, we trained a lot on data in California.","start":3513.31,"end":3539.87},{"id":377,"text":"And then when we took the cars to Texas, you and I as people, we can drive just fine in California or in Texas. But it turns out that traffic lights look really different in Texas than in California, right? So there's traffic lights, horizontal, vertical. I think part of it is there are very high winds in some parts of Texas. So a lot of traffic lights tend to be strung out differently to be robust to high winds, right? And so traffic lights actually look pretty different in Texas. So the models we train in California, they don't work in Texas because we get new data.","start":3540.89,"end":3568.79},{"id":378,"text":"refresh the data. So a lot of that is a process of monitoring and maintaining the model even when something in the world changes. And before going on to monitoring the model performance and maintaining it, one interesting difference in performance between this and this is option one is a very simple model.","start":3569.4,"end":3596.55},{"id":379,"text":"It basically has one parameter, which is epsilon, the fraction of pixels that change. And so this, because it's so simple, is actually very robust to changes in distribution. For example, say it's a hot summer and a lot of people are wearing sunglasses. Well, the fraction of pixels that change, even when people are wearing sunglasses, doesn't change that much.","start":3597.14,"end":3621.6},{"id":380,"text":"Maybe if it's Halloween and people are wearing crazy large costumes,","start":3622.86,"end":3626.06},{"id":381,"text":"maybe that would change.","start":3626.22,"end":3627.0},{"id":382,"text":"But this is actually a very robust algorithm because it's so simple.","start":3627.2,"end":3630.62},{"id":383,"text":"In contrast, if you train on data with no one wearing sunglasses,","start":3630.9,"end":3634.9},{"id":384,"text":"because, you know, the sun's not that hot these days, right?","start":3635.7,"end":3639.24},{"id":385,"text":"Then if everyone starts to wear sunglasses, this is actually less robust.","start":3639.46,"end":3643.98},{"id":386,"text":"So one of the advantages of very simple non-machine learning-based systems","start":3644.3,"end":3647.82},{"id":387,"text":"is they may be less susceptible to data drift.","start":3647.82,"end":3651.96},{"id":388,"text":"because maybe I tuned this parameter epsilon to a limited data set,","start":3653.04,"end":3657.86},{"id":389,"text":"but even when the data changes,","start":3658.02,"end":3659.52},{"id":390,"text":"this tuning is quite robust.","start":3659.58,"end":3661.1},{"id":391,"text":"But if I train a neural network with,","start":3661.44,"end":3663.92},{"id":392,"text":"say, thousands or tens of thousands of parameters,","start":3664.02,"end":3666.28},{"id":393,"text":"then I'm more likely to have overfit to people without sunglasses.","start":3666.72,"end":3670.34}],"notes":["本段讨论了数据分布变化对模型性能的影响，特别是简单模型与复杂模型在面对数据分布变化时的鲁棒性差异。讲者通过一个例子说明，当数据分布发生变化时，简单模型由于参数较少，可能更不容易受到分布变化的影响。","讲者提到，当数据中出现新的变化，如人们开始佩戴墨镜时，简单模型由于其参数较少，可能仍然保持较好的性能，而复杂模型如神经网络则可能因为过度拟合训练数据而表现较差。","讲者指出，简单模型可能在数据漂移（data drift）的情况下表现更稳定，因为它们的参数调整可能对数据变化具有一定的鲁棒性。","讲者还提到，如果模型训练时的数据没有包含某些变化（如墨镜的使用），那么当这些变化出现时，复杂模型可能无法很好地适应，从而导致性能下降。","讲者强调了模型的鲁棒性在实际应用中的重要性，特别是在数据分布可能发生变化的场景中，如自动驾驶汽车在不同地区运行时面临的挑战。","讲者通过对比简单模型和复杂模型在面对数据分布变化时的表现，说明了模型设计和训练数据选择的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3491.34,"end":3670.34,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3491.34,"text":"And then people are suddenly searching for a brand. I thought I got a lot from that. No, all right. No Swifties here. All right. But then suddenly, a lot of people are searching for a brand new thing. And so the distribution of data you get is different because the world has changed."},{"start":3513.31,"text":"I've done a lot of work in factories. There's actually a reasonable chance that a cell phone you have in your pocket may have been inspected by software that my teams wrote. But sometimes the materials change, or there's a new machine installed in the manufacturing line, and this machine makes a new type of scratch on the cell phone. So data changes in inspection lines as well. Or one thing that actually surprised me, when I work on self-driving cars, one of the teams I was working with, we trained a lot on data in California."},{"start":3540.89,"text":"And then when we took the cars to Texas, you and I as people, we can drive just fine in California or in Texas. But it turns out that traffic lights look really different in Texas than in California, right? So there's traffic lights, horizontal, vertical. I think part of it is there are very high winds in some parts of Texas. So a lot of traffic lights tend to be strung out differently to be robust to high winds, right? And so traffic lights actually look pretty different in Texas. So the models we train in California, they don't work in Texas because we get new data."},{"start":3569.4,"text":"refresh the data. So a lot of that is a process of monitoring and maintaining the model even when something in the world changes. And before going on to monitoring the model performance and maintaining it, one interesting difference in performance between this and this is option one is a very simple model."},{"start":3597.14,"text":"It basically has one parameter, which is epsilon, the fraction of pixels that change. And so this, because it's so simple, is actually very robust to changes in distribution. For example, say it's a hot summer and a lot of people are wearing sunglasses. Well, the fraction of pixels that change, even when people are wearing sunglasses, doesn't change that much."},{"start":3622.86,"text":"Maybe if it's Halloween and people are wearing crazy large costumes,"},{"start":3626.22,"text":"maybe that would change."},{"start":3627.2,"text":"But this is actually a very robust algorithm because it's so simple."},{"start":3630.9,"text":"In contrast, if you train on data with no one wearing sunglasses,"},{"start":3635.7,"text":"because, you know, the sun's not that hot these days, right?"},{"start":3639.46,"text":"Then if everyone starts to wear sunglasses, this is actually less robust."},{"start":3644.3,"text":"So one of the advantages of very simple non-machine learning-based systems"},{"start":3647.82,"text":"is they may be less susceptible to data drift."},{"start":3653.04,"text":"because maybe I tuned this parameter epsilon to a limited data set,"},{"start":3658.02,"text":"but even when the data changes,"},{"start":3659.58,"text":"this tuning is quite robust."},{"start":3661.44,"text":"But if I train a neural network with,"},{"start":3664.02,"text":"say, thousands or tens of thousands of parameters,"},{"start":3666.72,"text":"then I'm more likely to have overfit to people without sunglasses."}],"speech_gaps":[],"frame":"../frames/v061/021.webp","frame_time":3503.34},{"title":"隐私与系统设计中的数据监控","segments":[{"id":394,"text":"So if people start wearing sunglasses,","start":3670.68,"end":3672.04},{"id":395,"text":"you're more likely to have to update this model.","start":3673.3,"end":3676.14},{"id":396,"text":"And, um, if you are building a, um, sorry.","start":3677.36,"end":3686.88},{"id":397,"text":"Right, cool.","start":3689.98,"end":3691.04},{"id":398,"text":"Uh, boy.","start":3698.0,"end":3699.72},{"id":399,"text":"If you're building a system, it turns out to be incredibly helpful if you can get user","start":3702.98,"end":3716.36},{"id":400,"text":"permission to stream a little bit of data back to your cloud-hosted service so that","start":3716.36,"end":3721.1},{"id":401,"text":"respecting user privacy, being careful of opt-in, transparent privacy practices.","start":3721.1,"end":3725.04},{"id":402,"text":"I think that privacy is really important, right?","start":3725.38,"end":3727.36},{"id":403,"text":"So, do be transparent, do the right thing for users.","start":3727.36,"end":3729.3},{"id":404,"text":"And if you're able to do that and get a little bit of data","start":3730.48,"end":3733.0},{"id":405,"text":"back to your cloud to plot dashboards.","start":3733.0,"end":3735.92},{"id":406,"text":"And maybe one practice that I've seen is","start":3740.1,"end":3742.76},{"id":407,"text":"when building a high-stakes application,","start":3742.76,"end":3744.94},{"id":408,"text":"One good practice would be to gather your team together and get a diverse set of opinions on all the things that could change and all the things that could go wrong. And I've built quite a few machine learning systems, and I found that when we sit down and brainstorm all the things that could go wrong, including the data distribution changes, I don't think I have ever seen something go wrong in real life that we did not identify as a possible problem.","start":3746.9,"end":3775.04},{"id":409,"text":"I might be wrong, but at least right now, when we sat down, we really brainstormed all things that go wrong. I think I have yet to see something go wrong that was not on the list of stuff that we brainstormed. And so if you brainstorm, and this is true for safety-critical applications as well, it turns out in creative teams, you can actually think of all sorts of things that could change the data or things that go wrong. And that then lets you try to design a set of dashboards or metrics.","start":3775.69,"end":3802.05},{"id":410,"text":"to put in place to monitor whether or not any of these things that you think might go wrong actually do go wrong.","start":3802.7,"end":3808.24},{"id":411,"text":"So we may put in place dashboards like how often,","start":3809.27,"end":3814.39},{"id":412,"text":"it turns out re-authentication is a common thing.","start":3814.59,"end":3817.45},{"id":413,"text":"How often does a user need to authenticate twice","start":3817.57,"end":3819.85},{"id":414,"text":"before they let through?","start":3819.85,"end":3820.81},{"id":415,"text":"That's actually a sign of user frustration, right?","start":3821.03,"end":3823.01},{"id":416,"text":"So let's build a dashboard to do that.","start":3823.09,"end":3824.63},{"id":417,"text":"How often does a user have to try twice?","start":3824.79,"end":3826.87},{"id":418,"text":"It probably means something went wrong the first time.","start":3827.03,"end":3828.69},{"id":419,"text":"How often do you accept versus reject the user?","start":3829.33,"end":3832.35},{"id":420,"text":"And what is the latency of the system?","start":3833.15,"end":3835.49},{"id":421,"text":"And I find that just as it's difficult to know","start":3835.89,"end":3839.01},{"id":422,"text":"in advance what's in your data. It's actually difficult to know in advance what dashboard","start":3839.01,"end":3843.61},{"id":423,"text":"will be the most useful. And so the best practice I tend to recommend is brainstorm a lot of things","start":3843.61,"end":3850.63}],"notes":["本段主要讨论在构建高风险应用时，通过团队协作和头脑风暴来识别潜在问题的重要性。讲者提到，通过系统性地思考所有可能出错的情况，包括数据分布变化，可以提前设计监控指标和仪表盘，从而预防问题发生。","讲者强调，即使在实际应用中，很少有未被识别的问题出现，这表明头脑风暴是一种有效的预防措施。这种做法不仅适用于安全关键型应用，也适用于创意团队。","讲者还提到，设计监控仪表盘时，需要考虑多个维度，如用户重新认证的频率、系统延迟等，这些指标可以帮助识别系统中的潜在问题。","此外，讲者指出，提前确定哪些监控指标最有用是困难的，因此建议团队进行大量头脑风暴，以生成尽可能多的监控指标，从而覆盖更多可能的问题。","讲者提到，通过这种方式，团队可以设计出更全面的监控系统，从而提高系统的可靠性和用户体验。","最后，讲者强调了透明和用户隐私的重要性，认为这是构建可信系统的基石。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3670.68,"end":3850.63,"asr_flags":[399],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3670.68,"text":"So if people start wearing sunglasses,"},{"start":3673.3,"text":"you're more likely to have to update this model."},{"start":3677.36,"text":"And, um, if you are building a, um, sorry."},{"start":3689.98,"text":"Right, cool."},{"start":3698.0,"text":"Uh, boy."},{"start":3702.98,"text":"If you're building a system, it turns out to be incredibly helpful if you can get user"},{"start":3716.36,"text":"permission to stream a little bit of data back to your cloud-hosted service so that"},{"start":3721.1,"text":"respecting user privacy, being careful of opt-in, transparent privacy practices."},{"start":3725.38,"text":"I think that privacy is really important, right?"},{"start":3727.36,"text":"So, do be transparent, do the right thing for users."},{"start":3730.48,"text":"And if you're able to do that and get a little bit of data"},{"start":3733.0,"text":"back to your cloud to plot dashboards."},{"start":3740.1,"text":"And maybe one practice that I've seen is"},{"start":3742.76,"text":"when building a high-stakes application,"},{"start":3746.9,"text":"One good practice would be to gather your team together and get a diverse set of opinions on all the things that could change and all the things that could go wrong. And I've built quite a few machine learning systems, and I found that when we sit down and brainstorm all the things that could go wrong, including the data distribution changes, I don't think I have ever seen something go wrong in real life that we did not identify as a possible problem."},{"start":3775.69,"text":"I might be wrong, but at least right now, when we sat down, we really brainstormed all things that go wrong. I think I have yet to see something go wrong that was not on the list of stuff that we brainstormed. And so if you brainstorm, and this is true for safety-critical applications as well, it turns out in creative teams, you can actually think of all sorts of things that could change the data or things that go wrong. And that then lets you try to design a set of dashboards or metrics."},{"start":3802.7,"text":"to put in place to monitor whether or not any of these things that you think might go wrong actually do go wrong."},{"start":3809.27,"text":"So we may put in place dashboards like how often,"},{"start":3814.59,"text":"it turns out re-authentication is a common thing."},{"start":3817.57,"text":"How often does a user need to authenticate twice"},{"start":3819.85,"text":"before they let through?"},{"start":3821.03,"text":"That's actually a sign of user frustration, right?"},{"start":3823.09,"text":"So let's build a dashboard to do that."},{"start":3824.79,"text":"How often does a user have to try twice?"},{"start":3827.03,"text":"It probably means something went wrong the first time."},{"start":3829.33,"text":"How often do you accept versus reject the user?"},{"start":3833.15,"text":"And what is the latency of the system?"},{"start":3835.89,"text":"And I find that just as it's difficult to know"},{"start":3839.01,"text":"in advance what's in your data. It's actually difficult to know in advance what dashboard"},{"start":3843.61,"text":"will be the most useful. And so the best practice I tend to recommend is brainstorm a lot of things"}],"speech_gaps":[],"frame":"../frames/v061/022.webp","frame_time":3682.68},{"title":"监控与数据可视化在深度学习项目中的应用","segments":[{"id":424,"text":"to go around, brainstorm a lot of metrics, and then just, you know, create very rich dashboards","start":3850.63,"end":3856.85},{"id":425,"text":"where this is time, latency, time, re-authentication,","start":3856.85,"end":3863.43},{"id":426,"text":"time, the number of zeros versus ones,","start":3865.35,"end":3870.13},{"id":427,"text":"and then draw plots over time","start":3870.31,"end":3874.05},{"id":428,"text":"to see how these rates trend over time.","start":3875.39,"end":3879.35},{"id":429,"text":"And if you're able to have a lot of dashboards and sample","start":3879.75,"end":3883.53},{"id":430,"text":"and just, you know, look at some of the data for where you suspect it may be making a mistake,","start":3883.53,"end":3887.95},{"id":431,"text":"that often is then a good way for you to have a higher chance of spotting when there might","start":3888.23,"end":3895.27},{"id":432,"text":"be a problem.","start":3895.27,"end":3895.83},{"id":433,"text":"And in the times that I've built large dashboards with, you know, 20, 30 metrics, I found that","start":3896.77,"end":3903.91},{"id":434,"text":"it's surprisingly difficult to know in advance which dashboards would turn out to be useful.","start":3903.91,"end":3908.75},{"id":435,"text":"I think in export to data analysis and data science,","start":3908.75,"end":3912.59},{"id":436,"text":"Again, because we often don't know what's in the data or what the data will give us in the future, we just, frankly, plot a lot of stuff and then go and figure out from there what is interesting. So the cost of plotting something in a Jupyter notebook is fairly low. So let's just plot a lot of stuff, have a lot of dashboards, and if you end up with 30, 50, 100...","start":3913.68,"end":3933.68},{"id":437,"text":"dashboards tracking these metrics over time, then hopefully in a few days or a few weeks, you figure out that a lot of them are really boring. So we figure out that, well, latency is just not a thing because with cloud-hosted deployment, it's just very constant. So, well, let's get rid of that because that's just a very boring part. I'm just not worried about that. And so often, plot a lot of things and then prune back to then have a smaller number of metrics that we track and monitor for the long term.","start":3934.45,"end":3960.67},{"id":438,"text":"And then eventually, when you get a sense of this being the normal range for some metric, you can then also put in place upper and lower alarms so that if it ever goes above or below certain bounds, they'll trigger an alarm, like go page someone to take a look to figure out if something's gone wrong.","start":3961.32,"end":3982.83},{"id":439,"text":"Does that make sense? And so unfortunately, just because you train a model a lot of time in a real-world production setting, it doesn't mean you're done because you deploy it and then the world will give you surprising data and having a plan to monitor what happens as well as to maintain the model, meaning get new data, update the system to fix problems as they arise, that is often an important part of...","start":3983.41,"end":4010.35},{"id":440,"text":"the practicalities of deploying machine learning system as well.","start":4011.09,"end":4014.75}],"notes":["本段讲授了在深度学习项目中如何通过创建丰富的仪表盘来监控模型性能。讲者提到需要头脑风暴大量指标，如延迟、重新认证时间、零与一的数量等，并绘制随时间变化的图表，以观察这些指标的趋势。","讲者强调，即使创建了大量仪表盘，也很难提前知道哪些会真正有用。因此，建议在Jupyter笔记本中绘制大量数据，并通过观察来筛选出真正有意义的指标。","讲者指出，当对某个指标的正常范围有了一定了解后，可以设置上下限警报，以便在指标超出范围时及时通知相关人员。","讲者还提到，即使在现实生产环境中训练了模型，也不能保证模型完全正确，因为实际数据可能带来意外情况。因此，需要有计划地监控模型表现，并在发现问题时及时更新系统。","讲者强调了在部署机器学习系统时，维护和监控模型的重要性，包括获取新数据、修复问题等。","讲者通过实际经验说明，创建大量仪表盘并逐步筛选出有用的指标，是深度学习项目中不可或缺的一部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3850.63,"end":4014.75,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3850.63,"text":"to go around, brainstorm a lot of metrics, and then just, you know, create very rich dashboards"},{"start":3856.85,"text":"where this is time, latency, time, re-authentication,"},{"start":3865.35,"text":"time, the number of zeros versus ones,"},{"start":3870.31,"text":"and then draw plots over time"},{"start":3875.39,"text":"to see how these rates trend over time."},{"start":3879.75,"text":"And if you're able to have a lot of dashboards and sample"},{"start":3883.53,"text":"and just, you know, look at some of the data for where you suspect it may be making a mistake,"},{"start":3888.23,"text":"that often is then a good way for you to have a higher chance of spotting when there might"},{"start":3895.27,"text":"be a problem."},{"start":3896.77,"text":"And in the times that I've built large dashboards with, you know, 20, 30 metrics, I found that"},{"start":3903.91,"text":"it's surprisingly difficult to know in advance which dashboards would turn out to be useful."},{"start":3908.75,"text":"I think in export to data analysis and data science,"},{"start":3913.68,"text":"Again, because we often don't know what's in the data or what the data will give us in the future, we just, frankly, plot a lot of stuff and then go and figure out from there what is interesting. So the cost of plotting something in a Jupyter notebook is fairly low. So let's just plot a lot of stuff, have a lot of dashboards, and if you end up with 30, 50, 100..."},{"start":3934.45,"text":"dashboards tracking these metrics over time, then hopefully in a few days or a few weeks, you figure out that a lot of them are really boring. So we figure out that, well, latency is just not a thing because with cloud-hosted deployment, it's just very constant. So, well, let's get rid of that because that's just a very boring part. I'm just not worried about that. And so often, plot a lot of things and then prune back to then have a smaller number of metrics that we track and monitor for the long term."},{"start":3961.32,"text":"And then eventually, when you get a sense of this being the normal range for some metric, you can then also put in place upper and lower alarms so that if it ever goes above or below certain bounds, they'll trigger an alarm, like go page someone to take a look to figure out if something's gone wrong."},{"start":3983.41,"text":"Does that make sense? And so unfortunately, just because you train a model a lot of time in a real-world production setting, it doesn't mean you're done because you deploy it and then the world will give you surprising data and having a plan to monitor what happens as well as to maintain the model, meaning get new data, update the system to fix problems as they arise, that is often an important part of..."},{"start":4011.09,"text":"the practicalities of deploying machine learning system as well."}],"speech_gaps":[],"frame":"../frames/v061/023.webp","frame_time":3862.63}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
