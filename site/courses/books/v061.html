 times nothing happens, unless you take one frame per minute, I guess, which","start":2775.03,"end":2782.27},{"id":314,"text":"would be okay, but then we don't want someone waiting there for a full minute before we","start":2782.27,"end":2786.91},{"id":315,"text":"finally get around to sampling and then sending it, so yeah, go ahead.","start":2786.91,"end":2791.19}],"notes":["本段讨论了在项目实施过程中如何选择和替换不同的选项。讲者提到在短期内使用选项一，之后可能用选项二，因为选项二有更多数据支持。这表明在项目初期使用较简单的方案，随着数据的积累逐步优化。","讲者还提到，如果使用两个选项，可以同时进行，但需要考虑成本问题。这说明在实际操作中，需要权衡不同方案的成本和效果，以确保资源的合理利用。","讲者进一步讨论了在云上运行新网络的成本问题，并提到通常希望将这些方案部署在边缘设备上，以减少计算资源的消耗。这表明在实际部署中，需要考虑计算资源的限制和优化策略。","讲者提到视频流处理的成本较高，因此需要一种过滤机制，以减少不必要的数据传输。这说明在实际应用中，需要设计有效的数据筛选策略，以降低计算和传输成本。","讲者还讨论了如何选择视频帧进行采样，以平衡数据的完整性和处理效率。这表明在实际应用中，需要根据具体需求设计合理的采样策略，以确保数据的有效性和处理效率。","最后，讲者提到如果每分钟只采样一帧，可能会导致延迟，因此需要更高效的采样方法。这说明在实际应用中，需要考虑采样频率和延迟之间的平衡，以确保系统的实时性和有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2616.27,"end":2791.19,"asr_flags":[292,310],"translation_complete":false,"translated_segments":24,"raw_segments":[{"start":2616.27,"text":"while we collect more data"},{"start":2617.61,"text":"and then replace that"},{"start":2619.61,"text":"one with the second one."},{"start":2621.63,"text":"Yeah, cool, great. So use option"},{"start":2623.53,"text":"one in the short term, and"},{"start":2625.61,"text":"then maybe replace that with option two"},{"start":2627.33,"text":"where we have more data. Yeah, cool, that's very"},{"start":2629.27,"text":"sane approach. Go ahead."},{"start":2630.61,"text":"I'm thinking about why not using two options, like, you know, because, you know, for me,"},{"start":2635.31,"text":"if, like, for all three rounds, it's fine, it's very simple. Only if that is clear, then"},{"start":2640.59,"text":"we have, like, we can say, oh, we can do that or not. And then, after that, that's what"},{"start":2644.75,"text":"we can do or not."},{"start":2647.27,"text":"Oh, oh, sorry. So use, oh, use both options. No, put both in the pipeline. Oh, that's interesting."},{"start":2651.81,"text":"I see."},{"start":2653.03,"text":"All right, so see if option one, let option one see if anything changed. If something"},{"start":2656.59,"text":"change then passes from your network yeah cool yeah that could work so the"},{"start":2670.13,"text":"cascaded multiple steps"},{"start":2686.59,"text":"If it's more expensive, then I would probably invest more into options."},{"start":2690.47,"text":"Okay, that's cool."},{"start":2691.61,"text":"So if I take care of it, I'm wasting a bunch of money."},{"start":2694.93,"text":"That's cool."},{"start":2695.61,"text":"Yeah, right."},{"start":2696.03,"text":"Yeah, so how expensive is it to run this new network in the cloud?"},{"start":2698.41,"text":"So actually, so I would usually want to design both of these to run at the edge, meaning"},{"start":2704.41,"text":"on the device."},{"start":2705.77,"text":"Or the other, you're going to overpass it."},{"start":2708.07,"text":"Oh, this one?"},{"start":2709.01,"text":"Yeah."},{"start":2710.99,"text":"So it turns out that streaming video is fairly expensive."},{"start":2717.09,"text":"So I think, yeah, I feel like, boy, I don't have numbers at tip of my fingertips, but"},{"start":2726.39,"text":"I think running this 24-7 is not feasible."},{"start":2730.59,"text":"So we definitely need something to filter it down."},{"start":2733.83,"text":"but sending, you know, I don't know, a few images every minute is probably not a problem."},{"start":2745.91,"text":"All right, sample certain frames of the video in order to get all of them."},{"start":2762.25,"text":"Yes, I guess so, yes, although I think if you have a video of my front door, you need"},{"start":2772.27,"text":"a way to sample other than random, I guess, right?"},{"start":2775.03,"text":"Because a lot of times nothing happens, unless you take one frame per minute, I guess, which"},{"start":2782.27,"text":"would be okay, but then we don't want someone waiting there for a full minute before we"},{"start":2786.91,"text":"finally get around to sampling and then sending it, so yeah, go ahead."}],"speech_gaps":[{"start":2671.968,"end":2673.728},{"start":2743.76,"end":2745.264}],"frame":"../frames/v061/016.webp","frame_time":2628.27},{"title":"使用相同图像训练网络的可行性","segments":[{"id":316,"text":"Yeah, could we use the same images for training this network to train this option","zh":"是的，我们能否用相同的图像来训练这个网络以训练这个选项？","start":2803.87,"end":2809.77},{"id":317,"text":"two network?","zh":"两个网络？","start":2809.77,"end":2810.37},{"id":318,"text":"Maybe.","zh":"也许。","start":2811.31,"end":2811.71},{"id":319,"text":"It's actually one of those things, I would say we have to try it before we know if it","zh":"实际上，这是那种事情，我认为在我们知道它是否有效之前，我们必须尝试一下。","start":2812.95,"end":2816.69},{"id":320,"text":"works.","zh":"它可能可行。","start":2816.69,"end":2816.93},{"id":321,"text":"It might be doable.","zh":"它可能可以实现。","start":2817.13,"end":2817.79},{"id":322,"text":"It depends a lot on what data we collected to train the brain neural network.","zh":"这在很大程度上取决于我们收集的数据来训练大脑神经网络。","start":2817.79,"end":2820.99},{"id":323,"text":"Yeah.","zh":"是的。","start":2821.63,"end":2821.97},{"id":324,"text":"Cool.","start":2823.37,"end":2823.73},{"id":325,"text":"Anything else?","start":2823.95,"end":2824.51},{"id":326,"text":"All right.","start":2824.59,"end":2824.73},{"id":327,"text":"Let's take a call .","start":2824.75,"end":2825.79},{"id":328,"text":"Go ahead.","start":2825.79,"end":2826.21},{"id":329,"text":".","start":2827.63,"end":2827.99},{"id":330,"text":"Cool.","start":2835.63,"end":2835.99},{"id":331,"text":"Right.","start":2836.09,"end":2836.23},{"id":332,"text":"Yeah.","start":2836.29,"end":2836.39},{"id":333,"text":"How about use option one, keep a really low threshold, so we send very few images.","start":2836.45,"end":2840.79},{"id":334,"text":"Is that what you mean?","start":2841.01,"end":2841.45},{"id":335,"text":"Yeah.","start":2842.61,"end":2842.97},{"id":336,"text":"I think that'd be reasonable to try.","start":2843.09,"end":2845.79},{"id":337,"text":"Well, so that we don't miss too many people, but yeah. Let's take one last comment, I'll share a perspective on how . Yes. So one of the weaknesses of option 1 is if there's a tree swaying in the background, or if you see a road and there's a car that drives by, or if there's a busy street, the car's driving by all the time, or the neighbor's cat comes and visits, those will trigger this. So those are the downsides.","start":2847.67,"end":2880.47},{"id":338,"text":"So let me show you a perspective of how I would approach this and what we actually do. So if you're the CTO of a startup implementing this, to me, it again comes down to speed, right? And so what I would ask is, how long does it take to implement option one? And how long does it take to implement option two? And I think everyone made good points about the pros and cons of these two options.","start":2881.48,"end":2908.18},{"id":339,"text":"And if you're actually doing this, the approach I would take is, you know, just ask, what can I do really quickly so I can then deploy it and see whether it works? And I'll fix it if it doesn't work. Because I think these insights, like, would she swing in the background affect it? You know, it turns out that she does probably, but...","start":2909.07,"end":2930.63},{"id":340,"text":"Maybe not, if the wind isn't that strong. But it's very difficult to know answers to questions like these because you don't really know until you stick on a bunch of cameras in front of doors and see the data, then you can get more confident in how well option 1","start":2930.87,"end":2947.05},{"id":341,"text":"works, how often does the neighbor's cat actually come by? If there's a car that drives past, are the cars usually so far away that it doesn't matter because the number of pixels per car is small? All of these are very empirical questions, it's really difficult to answer. The fastest way to get answers is just implement something quick and dirty, and then run it, see what goes wrong, and then fix it.","start":2947.62,"end":2968.94}],"notes":["本段讨论了在训练神经网络时是否可以使用相同的图像进行训练的问题。讲者指出，这取决于所收集的数据，因此需要尝试才能确定是否可行。","讲者提到，使用选项一（保持低阈值）可以发送较少的图像，但可能会触发一些不必要的事件，如背景中的树摇晃、汽车经过等，这些是选项一的缺点。","讲者进一步说明，作为初创公司的CTO，他更关注速度，因此会优先考虑快速实现方案，并通过实际部署和运行来发现问题并进行修复。","讲者强调，许多关于系统性能的问题（如邻居的猫是否经常出现、汽车是否距离足够远等）很难在理论上回答，必须通过实际数据来验证。","讲者建议采用快速且粗糙的实现方法，以尽快获得反馈并进行调整，这是处理这类问题的常见做法。","整个讨论围绕如何在实际部署中权衡不同选项的优缺点，并通过实验来验证假设，体现了工程实践中常见的试错方法。"],"formulas":[],"uncertainties":["tree swaying in the background","neighbor's cat comes and visits","car's driving by all the time","number of pixels per car","how often does the neighbor's cat actually come by"],"diagram":"none","start":2803.87,"end":2968.94,"asr_flags":[326,332],"translation_complete":false,"translated_segments":8,"raw_segments":[{"start":2803.87,"text":"Yeah, could we use the same images for training this network to train this option"},{"start":2809.77,"text":"two network?"},{"start":2811.31,"text":"Maybe."},{"start":2812.95,"text":"It's actually one of those things, I would say we have to try it before we know if it"},{"start":2816.69,"text":"works."},{"start":2817.13,"text":"It might be doable."},{"start":2817.79,"text":"It depends a lot on what data we collected to train the brain neural network."},{"start":2821.63,"text":"Yeah."},{"start":2823.37,"text":"Cool."},{"start":2823.95,"text":"Anything else?"},{"start":2824.59,"text":"All right."},{"start":2824.75,"text":"Let's take a call ."},{"start":2825.79,"text":"Go ahead."},{"start":2827.63,"text":"."},{"start":2835.63,"text":"Cool."},{"start":2836.09,"text":"Right."},{"start":2836.29,"text":"Yeah."},{"start":2836.45,"text":"How about use option one, keep a really low threshold, so we send very few images."},{"start":2841.01,"text":"Is that what you mean?"},{"start":2842.61,"text":"Yeah."},{"start":2843.09,"text":"I think that'd be reasonable to try."},{"start":2847.67,"text":"Well, so that we don't miss too many people, but yeah. Let's take one last comment, I'll share a perspective on how . Yes. So one of the weaknesses of option 1 is if there's a tree swaying in the background, or if you see a road and there's a car that drives by, or if there's a busy street, the car's driving by all the time, or the neighbor's cat comes and visits, those will trigger this. So those are the downsides."},{"start":2881.48,"text":"So let me show you a perspective of how I would approach this and what we actually do. So if you're the CTO of a startup implementing this, to me, it again comes down to speed, right? And so what I would ask is, how long does it take to implement option one? And how long does it take to implement option two? And I think everyone made good points about the pros and cons of these two options."},{"start":2909.07,"text":"And if you're actually doing this, the approach I would take is, you know, just ask, what can I do really quickly so I can then deploy it and see whether it works? And I'll fix it if it doesn't work. Because I think these insights, like, would she swing in the background affect it? You know, it turns out that she does probably, but..."},{"start":2930.87,"text":"Maybe not, if the wind isn't that strong. But it's very difficult to know answers to questions like these because you don't really know until you stick on a bunch of cameras in front of doors and see the data, then you can get more confident in how well option 1"},{"start":2947.62,"text":"works, how often does the neighbor's cat actually come by? If there's a car that drives past, are the cars usually so far away that it doesn't matter because the number of pixels per car is small? All of these are very empirical questions, it's really difficult to answer. The fastest way to get answers is just implement something quick and dirty, and then run it, see what goes wrong, and then fix it."}],"speech_gaps":[],"frame":"../frames/v061/017.webp","frame_time":2815.87},{"title":"实现深度学习项目的实际经验","segments":[{"id":342,"text":"What the experience of a lot of face recognition teams is, because option 1 is so quick to implement, this is like, I don't know, five lines of Python or something. I don't want to write it for you. I just want to write the five lines of Python for you. You can implement this in","zh":"很多人脸识别团队的经验是，因为选项1非常容易实现，这就像，我不知道，五行Python代码而已。我不想为你写代码。我只是想为你写出这五行Python代码。你可以在","start":2970.93,"end":2989.87},{"id":343,"text":"you know, 20 minutes, maybe even less. Whereas this, I think will take you at least many hours, maybe longer to implement. So my instinct would be the start of this. And it turns out having built many face recognition systems, I'll tell you, this actually doesn't work well enough for all the problems people raise. And so we wind up going to this, but implementing this also gives you insights into where it's going wrong.","zh":"你知道的，20分钟内，甚至更少的时间完成。而这个，我认为至少需要你花好几个小时，也许更长的时间才能实现。因此我的直觉是先从这个开始。事实上，经过构建了许多人脸识别系统，我可以告诉你，这种方法对于人们提出的所有问题实际上并不足够好。因此我们最终会转向这个方法，但实现这个方法也能让你了解到它哪里出了问题。","start":2990.39,"end":3015.91},{"id":344,"text":"And I'll give you one example of one insight that we and many other face recognition teams have, which is it turns out that when you're approaching a camera that's trying to recognize your face,","zh":"我会给你一个我们和许多其他人脸识别团队都有的一个洞察的例子，即当你接近一个试图识别你面部的摄像头时，","start":3016.42,"end":3032.06},{"id":345,"text":"there are some frames that are going to be really clear and in focus, and a lot of frames are really blurry, right? If you just look at a video of someone walking toward the camera, sometimes, just, you know, when I'm stepping, sometimes the velocity of my face is higher and sometimes it's lower, right? That's just what it is. And so sometimes my face is in focus, sometimes it's more blurry.","zh":"有些帧会非常清晰且对焦，而很多帧则非常模糊，对吧？如果你看一下某人走向摄像头的视频，有时候，比如说，当我迈步的时候，我的面部速度有时较高，有时较低，对吧？这仅仅是实际情况。因此有时候我的面部是清晰对焦的，有时候则更模糊。","start":3032.84,"end":3053.16},{"id":346,"text":"And it turns out that if you can select out the high resolution frames and feed that to face recognition, you get much higher quality results, right? So this is the kind of stuff that I assume most people would not know about until you work on a system like this. But it turns out that when I was working on a system like that, having a system to not just do VAD, but also capture the video and then deliberately select","zh":"结果发现，如果你能够选出高分辨率的帧并将其输入人脸识别系统，你将得到更高质量的结果，对吧？因此，这种知识是我假设大多数人直到你实际构建一个这样的系统之前都不会知道的。但事实上，当我正在构建这样的系统时，拥有一个系统不仅做VAD，还能捕捉视频并刻意选择","start":3054.09,"end":3082.41},{"id":347,"text":"not just one, but maybe five frames to the high resolution and in focus of the person, that actually gave a significant boost to the accuracy of our face recognition system.","zh":"不止一帧，而是可能五帧的高分辨率且对焦的人脸，实际上显著提升了我们人脸识别系统的准确性。","start":3082.79,"end":3092.71},{"id":348,"text":"And I mentioned this as an example of the sort of discovery that you have only when you implement one of these systems, maybe even implement this system. But you implement this system, you see, boy, we're trying to recognize a lot of pictures from very faces. Maybe we need to do something about that, right? And this is driving the empirical process that may then lead you to train in your network, both to see if there's a face, but also to see if the picture of the face is in focus to select out that frame for downstream processing.","zh":"我举这个例子，是为了说明当你实现这些系统之一时，甚至实现这个系统时，你才能发现这类问题。但当你实现这个系统时，你会发现，我们试图从很多照片中识别出人脸。也许我们需要做些事情来解决这个问题，对吧？而这会推动一个实证过程，进而引导你训练网络，不仅识别是否有脸，还要判断人脸照片是否清晰，从而选择合适的帧用于后续处理。","start":3093.46,"end":3121.02},{"id":349,"text":"Does that make sense? And this is why you find that for some meaningful fraction of questions I ask in class, the thing that's the speediest to do is often the right answer because that obsession with speed really lets you go in and figure out what's in your data and improve your system more efficiently.","zh":"这有没有道理？这也是为什么你会发现，在我课堂上提出的一些有意义的问题中，最快的做法往往就是正确的答案，因为对速度的执着让你能够深入数据，更高效地改进系统。","start":3121.53,"end":3141.27}],"notes":["本段主要讲述在实现深度学习项目时，快速实现的方案虽然容易，但可能无法满足所有需求，而深入实现则能带来更高质量的结果。讲者提到，通过选择高分辨率的帧来提升人脸识别的准确性，这是在实际项目中发现的洞察。","讲者以一个具体例子说明，当一个人走向摄像头时，有些帧是清晰的，有些则是模糊的。这种现象是由于运动速度不同导致的，因此选择清晰的帧可以显著提升识别效果。","讲者进一步指出，通过系统地选择高分辨率且对焦的帧，可以显著提升人脸识别系统的准确性。这表明在实际项目中，对数据的深入分析和处理是提升模型性能的关键。","讲者强调，只有在实际实现系统的过程中，才能发现这些关键的洞察。这种经验驱动的方法有助于优化模型，使其更有效地处理数据。","最后，讲者提到，快速实现方案往往能更快地揭示数据中的问题，从而更高效地改进系统。这说明在深度学习项目中，速度和效率是发现和解决问题的重要因素。","整个段落强调了在实际项目中，通过深入分析和处理数据，可以发现并解决模型性能问题，从而提升整体效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2970.93,"end":3141.27,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2970.93,"text":"What the experience of a lot of face recognition teams is, because option 1 is so quick to implement, this is like, I don't know, five lines of Python or something. I don't want to write it for you. I just want to write the five lines of Python for you. You can implement this in"},{"start":2990.39,"text":"you know, 20 minutes, maybe even less. Whereas this, I think will take you at least many hours, maybe longer to implement. So my instinct would be the start of this. And it turns out having built many face recognition systems, I'll tell you, this actually doesn't work well enough for all the problems people raise. And so we wind up going to this, but implementing this also gives you insights into where it's going wrong."},{"start":3016.42,"text":"And I'll give you one example of one insight that we and many other face recognition teams have, which is it turns out that when you're approaching a camera that's trying to recognize your face,"},{"start":3032.84,"text":"there are some frames that are going to be really clear and in focus, and a lot of frames are really blurry, right? If you just look at a video of someone walking toward the camera, sometimes, just, you know, when I'm stepping, sometimes the velocity of my face is higher and sometimes it's lower, right? That's just what it is. And so sometimes my face is in focus, sometimes it's more blurry."},{"start":3054.09,"text":"And it turns out that if you can select out the high resolution frames and feed that to face recognition, you get much higher quality results, right? So this is the kind of stuff that I assume most people would not know about until you work on a system like this. But it turns out that when I was working on a system like that, having a system to not just do VAD, but also capture the video and then deliberately select"},{"start":3082.79,"text":"not just one, but maybe five frames to the high resolution and in focus of the person, that actually gave a significant boost to the accuracy of our face recognition system."},{"start":3093.46,"text":"And I mentioned this as an example of the sort of discovery that you have only when you implement one of these systems, maybe even implement this system. But you implement this system, you see, boy, we're trying to recognize a lot of pictures from very faces. Maybe we need to do something about that, right? And this is driving the empirical process that may then lead you to train in your network, both to see if there's a face, but also to see if the picture of the face is in focus to select out that frame for downstream processing."},{"start":3121.53,"text":"Does that make sense? And this is why you find that for some meaningful fraction of questions I ask in class, the thing that's the speediest to do is often the right answer because that obsession with speed really lets you go in and figure out what's in your data and improve your system more efficiently."}],"speech_gaps":[],"frame":"../frames/v061/018.webp","frame_time":2982.93},{"title":"模型部署与维护中的挑战","segments":[{"id":350,"text":"So what happens in the practice? Start with this, discover how it doesn't work because it doesn't actually work, I can tell you that, and then figure out, but use those learnings to do this. So is there a sense of what is a good classification accuracy for all these ideas? It's actually really difficult. One of the common benchmarks, you learn more about this in the third module on the online videos as well, is","zh":"那么在实际中会发生什么呢？首先，你开始尝试，然后发现它并不奏效，因为它实际上并不起作用，我可以告诉你这一点，然后想办法，但利用这些经验来做这件事。那么，对于所有这些想法，有没有一个良好的分类准确率的概念呢？实际上这非常困难。其中一个常见的基准，你也会在在线视频的第三模块中了解更多，是","start":3150.91,"end":3185.48},{"id":351,"text":"Building machine learning systems is easier if we have a reference level of performance, like an aspirational target accuracy, which is often human-level performance. And so it turns out that the way you diagnose bias and variance, which we'll talk about later in this course, is easier if you know what's an achievable level of accuracy. And very often, we'll use what a human expert could do as the achievable level of accuracy.","zh":"如果我们有一个性能参考水平，比如一个理想的准确率目标，那么构建机器学习系统会更容易。因此，事实证明，如果你知道一个可实现的准确率水平，那么诊断偏差和方差（我们将在本课程后面讨论）会更容易。而且，我们经常使用人类专家所能达到的水平作为可实现的准确率水平。","start":3186.4,"end":3212.58},{"id":352,"text":"In the case of face recognition, definitely under-controlled environments were better than humans. So definitely, actually, the AI systems we built, they're way better than I am at recognizing human faces. And I think AI systems are better than, I want to say, probably the vast majority of humans, maybe all humans at this point, at really distinguishing of two pictures or the same. And then it gets really difficult. Then it actually gets more difficult once you're even better than humans. But those are...","zh":"在人脸识别的情况下，显然在受控环境中表现优于人类。因此，实际上，我们构建的AI系统在识别人类面孔方面远远优于我。我认为AI系统在区分两张相同图片方面，可能优于绝大多数人类，甚至可能是所有人类。然后它变得非常困难。一旦你甚至比人类表现得更好，它实际上会变得更加困难。但这些是……","start":3215.64,"end":3242.96},{"id":353,"text":"Yeah, but at least, but until you're as good as humans on a certain task, using a human level performance is often a good benchmark. And then if you're doing something that even humans can't do well, like it turns out you're recommending online books or movies or whatever, humans aren't actually that good at that. I think most of us have a hard time recommending good movies, even to our closest friends. AI actually probably does it even better than many of us do as humans. Then those things, it's harder to establish a baseline.","zh":"是的，但至少，在你在一个任务上达到人类水平之前，使用人类水平的性能通常是一个良好的基准。然后，如果你在做一些人类也难以做好事情，比如推荐在线书籍或电影等，实际上人类并不擅长这一点。我认为我们大多数人推荐好电影给最亲近的朋友时都会遇到困难。AI实际上可能比我们大多数人做得更好。对于这些事情，建立基准会更加困难。","start":3243.44,"end":3271.34},{"id":354,"text":"Cool. All right. Now, one final aspect I want to touch on is after deploying a model to monitor and to maintain the model. One thing that often happens is you create a machine learning model,","zh":"很好。好了，我想最后提到的一个方面是在部署模型之后，用于监控和维护模型。经常发生的一件事是你创建了一个机器学习模型，","start":3274.35,"end":3296.82},{"id":355,"text":"Cool. All right. Now, one final aspect I want to touch on is after deploying a model to monitor and to maintain the model. One thing that often happens is you create a machine learning model, works great, does well in your training set, does well in your test set, works great, and then you deploy it, and then annoyingly, the world changes and your system no longer works. So we sometimes call this data drift or concept drift, where the distribution of data the world gives you is different than what you have in your training set, or concept drift, which is the input-output mapping, your X and Y changes in the world compared to your training set.","zh":"好的。那么，我想最后谈谈在部署模型之后，用于监控和维护模型的一个方面。常常会发生的情况是，你创建了一个机器学习模型，它在训练集上表现很好，在测试集上也表现很好，一切都很顺利，然后你将其部署出去，结果令人烦恼的是，世界发生了变化，你的系统就不再有效了。因此，我们有时会称这种情况为数据漂移（data drift）或概念漂移（concept drift），其中世界给你的数据分布与你在训练集中的数据分布不同，或者概念漂移，即输入输出的映射关系，你的X和Y在现实世界中与训练集中的X和Y发生了变化。","start":3297.58,"end":3324.22}],"notes":["本段讨论了在模型部署后维护模型的重要性，指出即使模型在训练集和测试集上表现良好，但在实际部署后，由于世界变化，模型可能不再有效。这涉及数据漂移（data drift）和概念漂移（concept drift）的概念，即数据分布或输入-输出映射发生变化。","讲者提到，当模型性能达到或超过人类水平时，建立基准线会更加困难。例如，在推荐系统中，人类可能并不擅长推荐书籍或电影，而AI系统可能表现得更好。这说明在某些任务中，人类水平的基准可能并不适用。","在人脸识别任务中，AI系统在受控环境下表现优于人类，这表明在某些特定任务中，AI可以超越人类表现。然而，当模型性能超过人类时，评估其性能的基准线变得更加复杂。","讲者强调，使用人类水平的性能作为基准线在某些任务中是合理的，但并非所有任务都适用。例如，在推荐系统中，人类可能无法提供高质量的推荐，因此需要寻找其他基准。","模型部署后，由于数据分布或输入-输出映射的变化，模型可能不再有效。这种变化被称为数据漂移或概念漂移，是模型维护中的关键挑战。","讲者指出，模型在训练集和测试集上表现良好并不保证其在实际部署中的表现，因此需要持续监控和维护模型，以应对世界的变化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3150.91,"end":3324.22,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3150.91,"text":"So what happens in the practice? Start with this, discover how it doesn't work because it doesn't actually work, I can tell you that, and then figure out, but use those learnings to do this. So is there a sense of what is a good classification accuracy for all these ideas? It's actually really difficult. One of the common benchmarks, you learn more about this in the third module on the online videos as well, is"},{"start":3186.4,"text":"Building machine learning systems is easier if we have a reference level of performance, like an aspirational target accuracy, which is often human-level performance. And so it turns out that the way you diagnose bias and variance, which we'll talk about later in this course, is easier if you know what's an achievable level of accuracy. And very often, we'll use what a human expert could do as the achievable level of accuracy."},{"start":3215.64,"text":"In the case of face recognition, definitely under-controlled environments were better than humans. So definitely, actually, the AI systems we built, they're way better than I am at recognizing human faces. And I think AI systems are better than, I want to say, probably the vast majority of humans, maybe all humans at this point, at really distinguishing of two pictures or the same. And then it gets really difficult. Then it actually gets more difficult once you're even better than humans. But those are..."},{"start":3243.44,"text":"Yeah, but at least, but until you're as good as humans on a certain task, using a human level performance is often a good benchmark. And then if you're doing something that even humans can't do well, like it turns out you're recommending online books or movies or whatever, humans aren't actually that good at that. I think most of us have a hard time recommending good movies, even to our closest friends. AI actually probably does it even better than many of us do as humans. Then those things, it's harder to establish a baseline."},{"start":3274.35,"text":"Cool. All right. Now, one final aspect I want to touch on is after deploying a model to monitor and to maintain the model. One thing that often happens is you create a machine learning model,"},{"start":3297.58,"text":"works great, does well in your training set, does well in your test set, works great, and then you deploy it, and then annoyingly, the world changes and your system no longer works. So we sometimes call this data drift or concept drift, where the distribution of data the world gives you is different than what you have in your training set, or concept drift, which is the input-output mapping, your X and Y changes in the world compared to your training set."}],"speech_gaps":[],"frame":"../frames/v061/019.webp","frame_time":3162.91},{"title":"数据漂移与实际应用的挑战","segments":[{"id":356,"text":"But to ground this, if you are creating a face recognition system now in, you know,","zh":"但为了具体说明这一点，如果你现在正在创建一个人脸识别系统，你知道，","start":3324.88,"end":3331.34},{"id":357,"text":"I don't know, when it's not too cold here in California, you get faces of a certain distribution.","zh":"在加州这里不太冷的时候，你得到的人脸分布是某种特定的分布。","start":3331.36,"end":3337.9},{"id":358,"text":"But as we approach winter, if it starts to rain more, people are wearing scarves, rain jackets,","zh":"但当我们接近冬季，如果开始下雨更多，人们开始戴围巾、雨衣，","start":3338.36,"end":3344.3},{"id":359,"text":"you know, people look different, right?","zh":"你知道，人们看起来会不同，对吧？","start":3344.86,"end":3347.14},{"id":360,"text":"Or maybe we approach the summer, more people are wearing sunglasses,","zh":"或者也许我们进入夏天，更多的人戴太阳镜，","start":3347.24,"end":3352.08},{"id":361,"text":"losses then the data distribution changes or if you train the system based on data here in","zh":"这时数据分布就会发生变化，或者如果你基于加州的数据训练系统，","start":3352.08,"end":3360.02},{"id":362,"text":"California but we then decide to deploy it you know in a different country where people","zh":"但随后我们决定在另一个国家部署它，那里的人穿着不同，","start":3360.02,"end":3364.56},{"id":363,"text":"dress differently or where their appearance is different the world keeps on giving us different","zh":"或者他们的外貌不同，世界会不断给我们不同的数据。","start":3364.56,"end":3370.82},{"id":364,"text":"data and so one of the jobs of I think us as machine learning engineers is to put in place","zh":"数据，因此我认为作为机器学习工程师，我们的一个任务是建立系统","start":3370.82,"end":3380.32},{"id":365,"text":"systems that monitor this type of concept drift or data drift and fix problems as they arise.","zh":"来监控这种概念漂移或数据漂移，并在问题出现时加以解决。","start":3380.32,"end":3385.68},{"id":366,"text":"When you're out building machine learning systems, I have seen a segment of AI engineers","zh":"当你在构建机器学习系统时，我见过一些人工智能工程师","start":3386.78,"end":3391.78},{"id":367,"text":"that think their job is to do well on a test set. And so I've been in a bunch of these conversations","zh":"认为他们的工作是在测试集上表现良好。因此，我参与过很多这样的对话","start":3391.78,"end":3397.3},{"id":368,"text":"where the machine learning person will say, look, I did well on the test set. My job is done.","zh":"其中机器学习人员会说，看，我在测试集上表现很好，我的任务完成了。","start":3397.3,"end":3402.68},{"id":369,"text":"But then a product owner or business owner will say, no, your system doesn't work. Look at all","zh":"但随后产品负责人或业务负责人会说，不，你的系统不起作用。看看","start":3403.26,"end":3408.24},{"id":370,"text":"the ways it does not work. And then if the machine learning person says, well, that's","zh":"它在哪些方面不起作用。然后如果机器学习人员说，嗯，这不是我的问题，我在测试集上做","start":3408.24,"end":3412.98},{"id":371,"text":"not my problem, I do it on the test set, I think that's not a constructive way.","zh":"了，我认为这不是一种建设性的方式。","start":3412.98,"end":3416.92},{"id":372,"text":"to move it forward. So I encourage you to think of yourselves, if you're building machine learning system, I think of my job as building something that works and that can be different than building something that works on the test set. So if ever you're working on a product and someone says, you know, I know you did well on the test set, but your system doesn't work, I would encourage you not to respond.","zh":"要推动它向前发展。因此，我鼓励你们思考，如果你们在构建机器学习系统，我认为我的工作是构建一个能够运作的系统，这与构建一个在测试集上表现良好的系统是不同的。因此，如果你们在开发一个产品，而有人告诉你们，\"我知道你们在测试集上表现很好，但你们的系统并不工作\"，我鼓励你们不要回应。","start":3417.47,"end":3439.13},{"id":373,"text":"But my job is to do on the test set. I encourage you to think about why doing well on the test set doesn't translate to doing well on the application that people actually care about, and then they'll lean in and go and fix that. And one of the common problems for why doing well on the test set doesn't translate to doing well in real life is if the data distribution changes, in which case you may need to update the distribution of data you're training on in order to capture what has changed in the world.","zh":"我的工作是在测试集上进行。我鼓励你们思考为什么在测试集上表现良好并不能转化为在人们真正关心的应用中表现良好，然后他们会深入探究并去修复这个问题。其中一个常见的问题就是为什么在测试集上表现良好并不能转化为在现实生活中表现良好，那就是如果数据分布发生了变化，此时你们可能需要更新你们训练所用的数据分布，以捕捉世界中已经发生的变化。","start":3439.84,"end":3467.14},{"id":374,"text":"And just a few other examples. I feel like the world gives us new data all the time. So if you're building a web search engine, sometimes the new politician is elected, or there's a new movement, or some new video goes viral, or I don't know, Taylor Swift releases a new album, I don't know, whatever.","zh":"还有一些其他的例子。我觉得世界一直在给我们新的数据。因此，如果你在构建一个网络搜索引擎，有时会有新的政治人物当选，或者出现新的运动，或者某些新的视频病毒式传播，或者我不知道，泰勒·斯威夫特发行了一张新专辑，或者其他什么情况。","start":3469.23,"end":3490.77}],"notes":["本段讲授了数据漂移（data drift）和概念漂移（concept drift）的概念，指出当数据分布发生变化时，机器学习系统可能无法正常工作。例如，当天气变化导致人们穿着不同，或者部署地点不同导致人群外貌差异时，系统需要监测这些变化并进行调整。","讲者强调了机器学习工程师的职责不仅是让模型在测试集上表现良好，还要确保系统在实际应用中有效。这涉及到对数据分布变化的监控和应对，以及对模型的持续更新。","讲者举了多个例子，如天气变化、不同国家的穿着差异、政治人物选举、网络流行趋势等，说明世界不断产生新的数据，机器学习系统需要适应这些变化。","讲者批评了某些AI工程师只关注测试集表现而忽视实际应用的错误观念，指出这种做法可能导致系统在现实场景中失效。","讲者鼓励学习者思考为什么在测试集上表现良好的模型可能在实际应用中表现不佳，并强调需要关注数据分布的变化，及时调整训练数据。","讲者指出，数据漂移是导致模型在实际应用中失效的常见原因之一，因此需要建立系统来监测和应对这种变化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3324.88,"end":3490.77,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3324.88,"text":"But to ground this, if you are creating a face recognition system now in, you know,"},{"start":3331.36,"text":"I don't know, when it's not too cold here in California, you get faces of a certain distribution."},{"start":3338.36,"text":"But as we approach winter, if it starts to rain more, people are wearing scarves, rain jackets,"},{"start":3344.86,"text":"you know, people look different, right?"},{"start":3347.24,"text":"Or maybe we approach the summer, more people are wearing sunglasses,"},{"start":3352.08,"text":"losses then the data distribution changes or if you train the system based on data here in"},{"start":3360.02,"text":"California but we then decide to deploy it you know in a different country where people"},{"start":3364.56,"text":"dress differently or where their appearance is different the world keeps on giving us different"},{"start":3370.82,"text":"data and so one of the jobs of I think us as machine learning engineers is to put in place"},{"start":3380.32,"text":"systems that monitor this type of concept drift or data drift and fix problems as they arise."},{"start":3386.78,"text":"When you're out building machine learning systems, I have seen a segment of AI engineers"},{"start":3391.78,"text":"that think their job is to do well on a test set. And so I've been in a bunch of these conversations"},{"start":3397.3,"text":"where the machine learning person will say, look, I did well on the test set. My job is done."},{"start":3403.26,"text":"But then a product owner or business owner will say, no, your system doesn't work. Look at all"},{"start":3408.24,"text":"the ways it does not work. And then if the machine learning person says, well, that's"},{"start":3412.98,"text":"not my problem, I do it on the test set, I think that's not a constructive way."},{"start":3417.47,"text":"to move it forward. So I encourage you to think of yourselves, if you're building machine learning system, I think of my job as building something that works and that can be different than building something that works on the test set. So if ever you're working on a product and someone says, you know, I know you did well on the test set, but your system doesn't work, I would encourage you not to respond."},{"start":3439.84,"text":"But my job is to do on the test set. I encourage you to think about why doing well on the test set doesn't translate to doing well on the application that people actually care about, and then they'll lean in and go and fix that. And one of the common problems for why doing well on the test set doesn't translate to doing well in real life is if the data distribution changes, in which case you may need to update the distribution of data you're training on in order to capture what has changed in the world."},{"start":3469.23,"text":"And just a few other examples. I feel like the world gives us new data all the time. So if you're building a web search engine, sometimes the new politician is elected, or there's a new movement, or some new video goes viral, or I don't know, Taylor Swift releases a new album, I don't know, whatever."}],"speech_gaps":[],"frame":"../frames/v061/020.webp","frame_time":3336.88},{"title":"数据分布变化与模型鲁棒性","segments":[{"id":375,"text":"And then people are suddenly searching for a brand. I thought I got a lot from that. No, all right. No Swifties here. All right. But then suddenly, a lot of people are searching for a brand new thing. And so the distribution of data you get is different because the world has changed.","zh":"然后人们突然开始搜索某个品牌。我以为我从中学到了很多。不，好吧。这里没有Swifties。好吧。但突然之间，很多人开始搜索一个全新的东西。因此，你所获得的数据分布会不同，因为世界已经发生了变化。","start":3491.34,"end":3510.78},{"id":376,"text":"I've done a lot of work in factories. There's actually a reasonable chance that a cell phone you have in your pocket may have been inspected by software that my teams wrote. But sometimes the materials change, or there's a new machine installed in the manufacturing line, and this machine makes a new type of scratch on the cell phone. So data changes in inspection lines as well. Or one thing that actually surprised me, when I work on self-driving cars, one of the teams I was working with, we trained a lot on data in California.","zh":"我曾在工厂做过很多工作。实际上，你口袋里的手机很可能已经被我们团队编写的软件进行了检查。但有时材料会变化，或者制造线上安装了新的机器，而这台机器会在手机上留下一种新的划痕。因此，检查线上的数据也会发生变化。或者有一件事让我感到惊讶，当我从事自动驾驶汽车的工作时，我所参与的一个团队，我们在加利福尼亚州的数据上进行了大量训练。","start":3513.31,"end":3539.87},{"id":377,"text":"And then when we took the cars to Texas, you and I as people, we can drive just fine in California or in Texas. But it turns out that traffic lights look really different in Texas than in California, right? So there's traffic lights, horizontal, vertical. I think part of it is there are very high winds in some parts of Texas. So a lot of traffic lights tend to be strung out differently to be robust to high winds, right? And so traffic lights actually look pretty different in Texas. So the models we train in California, they don't work in Texas because we get new data.","zh":"然后当我们把车开到德克萨斯州时，你和我作为人，可以在加利福尼亚州或德克萨斯州正常驾驶。但事实上，德克萨斯州的交通灯与加利福尼亚州的交通灯看起来差别很大，对吧？交通灯有水平和垂直的。我想其中一部分原因是德克萨斯州某些地方风很大。因此，很多交通灯被安装得更分散，以增强对强风的鲁棒性。因此，德克萨斯州的交通灯看起来差别很大。因此，我们在加利福尼亚州训练的模型在德克萨斯州无法正常工作，因为我们得到了新的数据。","start":3540.89,"end":3568.79},{"id":378,"text":"refresh the data. So a lot of that is a process of monitoring and maintaining the model even when something in the world changes. And before going on to monitoring the model performance and maintaining it, one interesting difference in performance between this and this is option one is a very simple model.","zh":"刷新数据。因此，很多情况下，这是一个监控和维护模型的过程，即使世界发生了变化。在继续监控模型性能和维护它之前，一个有趣的性能差异是选项一是一个非常简单的模型。","start":3569.4,"end":3596.55},{"id":379,"text":"It basically has one parameter, which is epsilon, the fraction of pixels that change. And so this, because it's so simple, is actually very robust to changes in distribution. For example, say it's a hot summer and a lot of people are wearing sunglasses. Well, the fraction of pixels that change, even when people are wearing sunglasses, doesn't change that much.","zh":"它基本上只有一个参数，即epsilon，表示像素变化的比例。因此，由于它非常简单，实际上对分布的变化具有很强的鲁棒性。例如，假设是炎热的夏天，很多人戴太阳镜。那么，即使人们戴太阳镜，像素变化的比例也不会改变太多。","start":3597.14,"end":3621.6},{"id":380,"text":"Maybe if it's Halloween and people are wearing crazy large costumes,","zh":"也许如果是在万圣节，人们穿着夸张的大服装，","start":3622.86,"end":3626.06},{"id":381,"text":"maybe that would change.","zh":"也许这就会发生变化。","start":3626.22,"end":3627.0},{"id":382,"text":"But this is actually a very robust algorithm because it's so simple.","zh":"但事实上这是一个非常鲁棒的算法，因为它非常简单。","start":3627.2,"end":3630.62},{"id":383,"text":"In contrast, if you train on data with no one wearing sunglasses,","zh":"相比之下，如果你在没有戴太阳镜的人的数据上进行训练，","start":3630.9,"end":3634.9},{"id":384,"text":"because, you know, the sun's not that hot these days, right?","zh":"因为，你知道的，这些天太阳并不那么热，对吧？","start":3635.7,"end":3639.24},{"id":385,"text":"Then if everyone starts to wear sunglasses, this is actually less robust.","zh":"那么如果每个人都开始戴太阳镜，这实际上会更不鲁棒。","start":3639.46,"end":3643.98},{"id":386,"text":"So one of the advantages of very simple non-machine learning-based systems","zh":"非常简单且不基于机器学习的系统的其中一个优势是","start":3644.3,"end":3647.82},{"id":387,"text":"is they may be less susceptible to data drift.","zh":"它们可能对数据漂移更不敏感。","start":3647.82,"end":3651.96},{"id":388,"text":"because maybe I tuned this parameter epsilon to a limited data set,","zh":"因为也许我将这个参数 epsilon 调整到一个有限的数据集上，","start":3653.04,"end":3657.86},{"id":389,"text":"but even when the data changes,","zh":"但即使数据发生变化，","start":3658.02,"end":3659.52},{"id":390,"text":"this tuning is quite robust.","zh":"这种调整相当稳健。","start":3659.58,"end":3661.1},{"id":391,"text":"But if I train a neural network with,","zh":"但如果我训练一个神经网络，","start":3661.44,"end":3663.92},{"id":392,"text":"say, thousands or tens of thousands of parameters,","zh":"比如说，有数千或数万个参数，","start":3664.02,"end":3666.28},{"id":393,"text":"then I'm more likely to have overfit to people without sunglasses.","zh":"那么我更有可能过拟合那些没有戴墨镜的人。","start":3666.72,"end":3670.34}],"notes":["本段讨论了数据分布变化对模型性能的影响，特别是简单模型与复杂模型在面对数据分布变化时的鲁棒性差异。讲者通过一个例子说明，当数据分布发生变化时，简单模型由于参数较少，可能更不容易受到分布变化的影响。","讲者提到，当数据中出现新的变化，如人们开始佩戴墨镜时，简单模型由于其参数较少，可能仍然保持较好的性能，而复杂模型如神经网络则可能因为过度拟合训练数据而表现较差。","讲者指出，简单模型可能在数据漂移（data drift）的情况下表现更稳定，因为它们的参数调整可能对数据变化具有一定的鲁棒性。","讲者还提到，如果模型训练时的数据没有包含某些变化（如墨镜的使用），那么当这些变化出现时，复杂模型可能无法很好地适应，从而导致性能下降。","讲者强调了模型的鲁棒性在实际应用中的重要性，特别是在数据分布可能发生变化的场景中，如自动驾驶汽车在不同地区运行时面临的挑战。","讲者通过对比简单模型和复杂模型在面对数据分布变化时的表现，说明了模型设计和训练数据选择的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3491.34,"end":3670.34,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3491.34,"text":"And then people are suddenly searching for a brand. I thought I got a lot from that. No, all right. No Swifties here. All right. But then suddenly, a lot of people are searching for a brand new thing. And so the distribution of data you get is different because the world has changed."},{"start":3513.31,"text":"I've done a lot of work in factories. There's actually a reasonable chance that a cell phone you have in your pocket may have been inspected by software that my teams wrote. But sometimes the materials change, or there's a new machine installed in the manufacturing line, and this machine makes a new type of scratch on the cell phone. So data changes in inspection lines as well. Or one thing that actually surprised me, when I work on self-driving cars, one of the teams I was working with, we trained a lot on data in California."},{"start":3540.89,"text":"And then when we took the cars to Texas, you and I as people, we can drive just fine in California or in Texas. But it turns out that traffic lights look really different in Texas than in California, right? So there's traffic lights, horizontal, vertical. I think part of it is there are very high winds in some parts of Texas. So a lot of traffic lights tend to be strung out differently to be robust to high winds, right? And so traffic lights actually look pretty different in Texas. So the models we train in California, they don't work in Texas because we get new data."},{"start":3569.4,"text":"refresh the data. So a lot of that is a process of monitoring and maintaining the model even when something in the world changes. And before going on to monitoring the model performance and maintaining it, one interesting difference in performance between this and this is option one is a very simple model."},{"start":3597.14,"text":"It basically has one parameter, which is epsilon, the fraction of pixels that change. And so this, because it's so simple, is actually very robust to changes in distribution. For example, say it's a hot summer and a lot of people are wearing sunglasses. Well, the fraction of pixels that change, even when people are wearing sunglasses, doesn't change that much."},{"start":3622.86,"text":"Maybe if it's Halloween and people are wearing crazy large costumes,"},{"start":3626.22,"text":"maybe that would change."},{"start":3627.2,"text":"But this is actually a very robust algorithm because it's so simple."},{"start":3630.9,"text":"In contrast, if you train on data with no one wearing sunglasses,"},{"start":3635.7,"text":"because, you know, the sun's not that hot these days, right?"},{"start":3639.46,"text":"Then if everyone starts to wear sunglasses, this is actually less robust."},{"start":3644.3,"text":"So one of the advantages of very simple non-machine learning-based systems"},{"start":3647.82,"text":"is they may be less susceptible to data drift."},{"start":3653.04,"text":"because maybe I tuned this parameter epsilon to a limited data set,"},{"start":3658.02,"text":"but even when the data changes,"},{"start":3659.58,"text":"this tuning is quite robust."},{"start":3661.44,"text":"But if I train a neural network with,"},{"start":3664.02,"text":"say, thousands or tens of thousands of parameters,"},{"start":3666.72,"text":"then I'm more likely to have overfit to people without sunglasses."}],"speech_gaps":[],"frame":"../frames/v061/021.webp","frame_time":3503.34},{"title":"隐私与系统设计中的数据监控","segments":[{"id":394,"text":"So if people start wearing sunglasses,","zh":"所以如果人们开始戴太阳镜，","start":3670.68,"end":3672.04},{"id":395,"text":"you're more likely to have to update this model.","zh":"你就更有可能需要更新这个模型。","start":3673.3,"end":3676.14},{"id":396,"text":"And, um, if you are building a, um, sorry.","zh":"嗯，如果你正在构建一个，嗯，抱歉。","start":3677.36,"end":3686.88},{"id":397,"text":"Right, cool.","zh":"对，很好。","start":3689.98,"end":3691.04},{"id":398,"text":"Uh, boy.","zh":"嗯，伙计。","start":3698.0,"end":3699.72},{"id":399,"text":"If you're building a system, it turns out to be incredibly helpful if you can get user","zh":"如果你在构建一个系统，你会发现如果能够获得用户","start":3702.98,"end":3716.36},{"id":400,"text":"permission to stream a little bit of data back to your cloud-hosted service so that","zh":"同意将一小部分数据流回你的云托管服务，这会非常有帮助，","start":3716.36,"end":3721.1},{"id":401,"text":"respecting user privacy, being careful of opt-in, transparent privacy practices.","zh":"这样就能尊重用户隐私，注意用户的选择，保持透明的隐私实践。","start":3721.1,"end":3725.04},{"id":402,"text":"I think that privacy is really important, right?","zh":"我认为隐私真的很重要，对吧？","start":3725.38,"end":3727.36},{"id":403,"text":"So, do be transparent, do the right thing for users.","zh":"所以，要保持透明，为用户做正确的事情。","start":3727.36,"end":3729.3},{"id":404,"text":"And if you're able to do that and get a little bit of data","zh":"并且如果你能做到这一点，并且能够将一些数据返回到你的云中，用来绘制仪表盘。","start":3730.48,"end":3733.0},{"id":405,"text":"back to your cloud to plot dashboards.","zh":"也许我见过的一个做法是","start":3733.0,"end":3735.92},{"id":406,"text":"And maybe one practice that I've seen is","zh":"在构建高风险应用时，","start":3740.1,"end":3742.76},{"id":407,"text":"when building a high-stakes application,","zh":"一个良好的做法是召集你的团队，收集各种可能发生变化和可能出现问题的意见。我构建过很多机器学习系统，我发现当我们坐下来讨论所有可能出现的问题，包括数据分布的变化时，我从未见过现实中出现的问题是我们没有提前识别为潜在问题的。","start":3742.76,"end":3744.94},{"id":408,"text":"One good practice would be to gather your team together and get a diverse set of opinions on all the things that could change and all the things that could go wrong. And I've built quite a few machine learning systems, and I found that when we sit down and brainstorm all the things that could go wrong, including the data distribution changes, I don't think I have ever seen something go wrong in real life that we did not identify as a possible problem.","zh":"我可能错了，但至少目前，当我们坐下来认真讨论所有可能出现的问题时，我认为我还没有见过任何实际发生的问题不在我们讨论的潜在问题列表中。因此，如果你进行头脑风暴，这在安全关键型应用中也同样适用，你会发现，在有创造力的团队中，你实际上可以想到各种可能改变数据或导致问题的情况。这让你能够尝试设计一套仪表盘或指标。","start":3746.9,"end":3775.04},{"id":409,"text":"I might be wrong, but at least right now, when we sat down, we really brainstormed all things that go wrong. I think I have yet to see something go wrong that was not on the list of stuff that we brainstormed. And so if you brainstorm, and this is true for safety-critical applications as well, it turns out in creative teams, you can actually think of all sorts of things that could change the data or things that go wrong. And that then lets you try to design a set of dashboards or metrics.","zh":"我可能错了，但至少在我们坐下来讨论的时候，我们真的脑力激荡了所有可能发生的问题。我认为我还没有看到任何发生的问题不在我们之前脑力激荡出的列表中。因此，如果你进行脑力激荡，这在安全关键型应用中也同样适用，你会发现，在有创造力的团队中，实际上可以想到各种可能改变数据或导致问题的情况。这之后，你就可以尝试设计一组仪表板或指标。","start":3775.69,"end":3802.05},{"id":410,"text":"to put in place to monitor whether or not any of these things that you think might go wrong actually do go wrong.","zh":"为了监控你认为可能会出错的事情是否真的出错，我们需要建立相应的机制。","start":3802.7,"end":3808.24},{"id":411,"text":"So we may put in place dashboards like how often,","zh":"因此，我们可能会设置仪表盘来监控诸如","start":3809.27,"end":3814.39},{"id":412,"text":"it turns out re-authentication is a common thing.","zh":"重新认证实际上是一个常见的情况。","start":3814.59,"end":3817.45},{"id":413,"text":"How often does a user need to authenticate twice","zh":"用户需要进行两次认证的频率是怎样的？","start":3817.57,"end":3819.85},{"id":414,"text":"before they let through?","zh":"在被允许通过之前，用户需要尝试两次的频率是多少？","start":3819.85,"end":3820.81},{"id":415,"text":"That's actually a sign of user frustration, right?","zh":"这实际上反映了用户的挫败感，对吧？","start":3821.03,"end":3823.01},{"id":416,"text":"So let's build a dashboard to do that.","zh":"因此，让我们建立一个仪表盘来监控这一点。","start":3823.09,"end":3824.63},{"id":417,"text":"How often does a user have to try twice?","zh":"用户需要尝试两次的频率是多少？","start":3824.79,"end":3826.87},{"id":418,"text":"It probably means something went wrong the first time.","zh":"这可能意味着第一次尝试时出了什么问题。","start":3827.03,"end":3828.69},{"id":419,"text":"How often do you accept versus reject the user?","zh":"你接受和拒绝用户的频率是多少？","start":3829.33,"end":3832.35},{"id":420,"text":"And what is the latency of the system?","zh":"系统的延迟是多少？","start":3833.15,"end":3835.49},{"id":421,"text":"And I find that just as it's difficult to know","zh":"我发现，就像很难提前知道你的数据中包含什么内容一样，","start":3835.89,"end":3839.01},{"id":422,"text":"in advance what's in your data. It's actually difficult to know in advance what dashboard","zh":"很难提前知道哪个仪表盘会最有用。因此，我通常建议的做法是想很多种可能性","start":3839.01,"end":3843.61},{"id":423,"text":"will be the most useful. And so the best practice I tend to recommend is brainstorm a lot of things","zh":"并进行头脑风暴。","start":3843.61,"end":3850.63}],"notes":["本段主要讨论在构建高风险应用时，通过团队协作和头脑风暴来识别潜在问题的重要性。讲者提到，通过系统性地思考所有可能出错的情况，包括数据分布变化，可以提前设计监控指标和仪表盘，从而预防问题发生。","讲者强调，即使在实际应用中，很少有未被识别的问题出现，这表明头脑风暴是一种有效的预防措施。这种做法不仅适用于安全关键型应用，也适用于创意团队。","讲者还提到，设计监控仪表盘时，需要考虑多个维度，如用户重新认证的频率、系统延迟等，这些指标可以帮助识别系统中的潜在问题。","此外，讲者指出，提前确定哪些监控指标最有用是困难的，因此建议团队进行大量头脑风暴，以生成尽可能多的监控指标，从而覆盖更多可能的问题。","讲者提到，通过这种方式，团队可以设计出更全面的监控系统，从而提高系统的可靠性和用户体验。","最后，讲者强调了透明和用户隐私的重要性，认为这是构建可信系统的基石。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3670.68,"end":3850.63,"asr_flags":[399],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":3670.68,"text":"So if people start wearing sunglasses,"},{"start":3673.3,"text":"you're more likely to have to update this model."},{"start":3677.36,"text":"And, um, if you are building a, um, sorry."},{"start":3689.98,"text":"Right, cool."},{"start":3698.0,"text":"Uh, boy."},{"start":3702.98,"text":"If you're building a system, it turns out to be incredibly helpful if you can get user"},{"start":3716.36,"text":"permission to stream a little bit of data back to your cloud-hosted service so that"},{"start":3721.1,"text":"respecting user privacy, being careful of opt-in, transparent privacy practices."},{"start":3725.38,"text":"I think that privacy is really important, right?"},{"start":3727.36,"text":"So, do be transparent, do the right thing for users."},{"start":3730.48,"text":"And if you're able to do that and get a little bit of data"},{"start":3733.0,"text":"back to your cloud to plot dashboards."},{"start":3740.1,"text":"And maybe one practice that I've seen is"},{"start":3742.76,"text":"when building a high-stakes application,"},{"start":3746.9,"text":"One good practice would be to gather your team together and get a diverse set of opinions on all the things that could change and all the things that could go wrong. And I've built quite a few machine learning systems, and I found that when we sit down and brainstorm all the things that could go wrong, including the data distribution changes, I don't think I have ever seen something go wrong in real life that we did not identify as a possible problem."},{"start":3775.69,"text":"I might be wrong, but at least right now, when we sat down, we really brainstormed all things that go wrong. I think I have yet to see something go wrong that was not on the list of stuff that we brainstormed. And so if you brainstorm, and this is true for safety-critical applications as well, it turns out in creative teams, you can actually think of all sorts of things that could change the data or things that go wrong. And that then lets you try to design a set of dashboards or metrics."},{"start":3802.7,"text":"to put in place to monitor whether or not any of these things that you think might go wrong actually do go wrong."},{"start":3809.27,"text":"So we may put in place dashboards like how often,"},{"start":3814.59,"text":"it turns out re-authentication is a common thing."},{"start":3817.57,"text":"How often does a user need to authenticate twice"},{"start":3819.85,"text":"before they let through?"},{"start":3821.03,"text":"That's actually a sign of user frustration, right?"},{"start":3823.09,"text":"So let's build a dashboard to do that."},{"start":3824.79,"text":"How often does a user have to try twice?"},{"start":3827.03,"text":"It probably means something went wrong the first time."},{"start":3829.33,"text":"How often do you accept versus reject the user?"},{"start":3833.15,"text":"And what is the latency of the system?"},{"start":3835.89,"text":"And I find that just as it's difficult to know"},{"start":3839.01,"text":"in advance what's in your data. It's actually difficult to know in advance what dashboard"},{"start":3843.61,"text":"will be the most useful. And so the best practice I tend to recommend is brainstorm a lot of things"}],"speech_gaps":[],"frame":"../frames/v061/022.webp","frame_time":3682.68},{"title":"监控与数据可视化在深度学习项目中的应用","segments":[{"id":424,"text":"to go around, brainstorm a lot of metrics, and then just, you know, create very rich dashboards","zh":"绕开这些，想出很多指标，然后你就会创建出非常丰富的仪表盘","start":3850.63,"end":3856.85},{"id":425,"text":"where this is time, latency, time, re-authentication,","zh":"其中包含时间、延迟、时间、重新认证，","start":3856.85,"end":3863.43},{"id":426,"text":"time, the number of zeros versus ones,","zh":"时间、零的数量与一的数量，","start":3865.35,"end":3870.13},{"id":427,"text":"and then draw plots over time","zh":"然后在时间上绘制图表","start":3870.31,"end":3874.05},{"id":428,"text":"to see how these rates trend over time.","zh":"以观察这些比率随时间的变化趋势。","start":3875.39,"end":3879.35},{"id":429,"text":"And if you're able to have a lot of dashboards and sample","zh":"如果你能够创建很多仪表盘并进行采样","start":3879.75,"end":3883.53},{"id":430,"text":"and just, you know, look at some of the data for where you suspect it may be making a mistake,","zh":"然后你就可以查看一些数据，以发现你怀疑可能出错的地方，","start":3883.53,"end":3887.95},{"id":431,"text":"that often is then a good way for you to have a higher chance of spotting when there might","zh":"这通常是你提高发现可能出错时机的机会的好方法","start":3888.23,"end":3895.27},{"id":432,"text":"be a problem.","zh":"会成为一个问题。","start":3895.27,"end":3895.83},{"id":433,"text":"And in the times that I've built large dashboards with, you know, 20, 30 metrics, I found that","zh":"在我构建大型仪表盘的时候，比如有20、30个指标，我发现","start":3896.77,"end":3903.91},{"id":434,"text":"it's surprisingly difficult to know in advance which dashboards would turn out to be useful.","zh":"提前知道哪些仪表盘会变得有用是一件出人意料的困难的事情。","start":3903.91,"end":3908.75},{"id":435,"text":"I think in export to data analysis and data science,","zh":"我认为在数据导出到数据分析和数据科学领域，","start":3908.75,"end":3912.59},{"id":436,"text":"Again, because we often don't know what's in the data or what the data will give us in the future, we just, frankly, plot a lot of stuff and then go and figure out from there what is interesting. So the cost of plotting something in a Jupyter notebook is fairly low. So let's just plot a lot of stuff, have a lot of dashboards, and if you end up with 30, 50, 100...","zh":"再次，因为我们经常不知道数据中有什么，或者数据未来会给我们什么，我们坦白地说，只是绘制很多内容，然后从那里找出什么是有意思的。因此，在Jupyter笔记本中绘制某物的成本相当低。所以，让我们绘制很多内容，拥有很多仪表盘，如果你最终有30、50、100……","start":3913.68,"end":3933.68},{"id":437,"text":"dashboards tracking these metrics over time, then hopefully in a few days or a few weeks, you figure out that a lot of them are really boring. So we figure out that, well, latency is just not a thing because with cloud-hosted deployment, it's just very constant. So, well, let's get rid of that because that's just a very boring part. I'm just not worried about that. And so often, plot a lot of things and then prune back to then have a smaller number of metrics that we track and monitor for the long term.","zh":"仪表盘来跟踪这些指标随时间的变化，那么希望在几天或几周后，你会发现其中很多都是很无聊的。因此，我们发现，延迟其实并不是一个问题，因为云托管部署中它只是非常恒定的。所以，好吧，让我们去掉这个，因为这只是一个非常无聊的部分。我并不担心这个。因此，经常绘制很多内容，然后修剪回一个较小数量的指标，以长期跟踪和监控。","start":3934.45,"end":3960.67},{"id":438,"text":"And then eventually, when you get a sense of this being the normal range for some metric, you can then also put in place upper and lower alarms so that if it ever goes above or below certain bounds, they'll trigger an alarm, like go page someone to take a look to figure out if something's gone wrong.","zh":"然后，当你对某个指标的正常范围有所了解后，你也可以设置上下限警报，这样如果它超出或低于某些界限，就会触发警报，比如通知某人查看，以确定是否出了什么问题。","start":3961.32,"end":3982.83},{"id":439,"text":"Does that make sense? And so unfortunately, just because you train a model a lot of time in a real-world production setting, it doesn't mean you're done because you deploy it and then the world will give you surprising data and having a plan to monitor what happens as well as to maintain the model, meaning get new data, update the system to fix problems as they arise, that is often an important part of...","zh":"这听起来合理吗？不幸的是，仅仅因为在现实生产环境中训练模型花费了很多时间，并不意味着你就完成了，因为你部署了它，然后世界会给你出人意料的数据，而且有一个计划来监控发生的事情以及维护模型，意味着获取新数据，更新系统以解决出现的问题，这通常是……的重要部分。","start":3983.41,"end":4010.35},{"id":440,"text":"the practicalities of deploying machine learning system as well.","zh":"部署机器学习系统的实际问题。","start":4011.09,"end":4014.75}],"notes":["本段讲授了在深度学习项目中如何通过创建丰富的仪表盘来监控模型性能。讲者提到需要头脑风暴大量指标，如延迟、重新认证时间、零与一的数量等，并绘制随时间变化的图表，以观察这些指标的趋势。","讲者强调，即使创建了大量仪表盘，也很难提前知道哪些会真正有用。因此，建议在Jupyter笔记本中绘制大量数据，并通过观察来筛选出真正有意义的指标。","讲者指出，当对某个指标的正常范围有了一定了解后，可以设置上下限警报，以便在指标超出范围时及时通知相关人员。","讲者还提到，即使在现实生产环境中训练了模型，也不能保证模型完全正确，因为实际数据可能带来意外情况。因此，需要有计划地监控模型表现，并在发现问题时及时更新系统。","讲者强调了在部署机器学习系统时，维护和监控模型的重要性，包括获取新数据、修复问题等。","讲者通过实际经验说明，创建大量仪表盘并逐步筛选出有用的指标，是深度学习项目中不可或缺的一部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3850.63,"end":4014.75,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":3850.63,"text":"to go around, brainstorm a lot of metrics, and then just, you know, create very rich dashboards"},{"start":3856.85,"text":"where this is time, latency, time, re-authentication,"},{"start":3865.35,"text":"time, the number of zeros versus ones,"},{"start":3870.31,"text":"and then draw plots over time"},{"start":3875.39,"text":"to see how these rates trend over time."},{"start":3879.75,"text":"And if you're able to have a lot of dashboards and sample"},{"start":3883.53,"text":"and just, you know, look at some of the data for where you suspect it may be making a mistake,"},{"start":3888.23,"text":"that often is then a good way for you to have a higher chance of spotting when there might"},{"start":3895.27,"text":"be a problem."},{"start":3896.77,"text":"And in the times that I've built large dashboards with, you know, 20, 30 metrics, I found that"},{"start":3903.91,"text":"it's surprisingly difficult to know in advance which dashboards would turn out to be useful."},{"start":3908.75,"text":"I think in export to data analysis and data science,"},{"start":3913.68,"text":"Again, because we often don't know what's in the data or what the data will give us in the future, we just, frankly, plot a lot of stuff and then go and figure out from there what is interesting. So the cost of plotting something in a Jupyter notebook is fairly low. So let's just plot a lot of stuff, have a lot of dashboards, and if you end up with 30, 50, 100..."},{"start":3934.45,"text":"dashboards tracking these metrics over time, then hopefully in a few days or a few weeks, you figure out that a lot of them are really boring. So we figure out that, well, latency is just not a thing because with cloud-hosted deployment, it's just very constant. So, well, let's get rid of that because that's just a very boring part. I'm just not worried about that. And so often, plot a lot of things and then prune back to then have a smaller number of metrics that we track and monitor for the long term."},{"start":3961.32,"text":"And then eventually, when you get a sense of this being the normal range for some metric, you can then also put in place upper and lower alarms so that if it ever goes above or below certain bounds, they'll trigger an alarm, like go page someone to take a look to figure out if something's gone wrong."},{"start":3983.41,"text":"Does that make sense? And so unfortunately, just because you train a model a lot of time in a real-world production setting, it doesn't mean you're done because you deploy it and then the world will give you surprising data and having a plan to monitor what happens as well as to maintain the model, meaning get new data, update the system to fix problems as they arise, that is often an important part of..."},{"start":4011.09,"text":"the practicalities of deploying machine learning system as well."}],"speech_gaps":[],"frame":"../frames/v061/023.webp","frame_time":3862.63}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v061.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
