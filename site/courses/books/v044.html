29.9},{"id":10,"text":"Actually, there's a lot of co-design of","zh":"实际上，有很多关于","start":30.1,"end":32.28},{"id":11,"text":"of the architecture with some of the properties of the GPUs.","zh":"架构与GPU的一些特性的协同设计。","start":32.28,"end":36.4},{"id":12,"text":"We cannot really go into all the details but I'm going to","zh":"我们不能深入所有细节，但我将","start":37.42,"end":39.32},{"id":13,"text":"give you some feeling about what people can optimize for the architecture. Then after that, we're going to move on to","zh":"给你一些关于人们可以优化架构的方面的感受。然后，在那之后，我们将继续","start":39.77,"end":46.25},{"id":14,"text":"Um, a few other kind of like, uh, things related to transformers. You know, one thing is that how do you do the few-shot learning with in-context learning? Um, another one is like, uh, the zero-shot, uh, uh, so basically these are about how to use large-language models, you know, with, you know, few-shot learning, zero-shot learning, um, and, uh, and one thing is like the SFT, how do you fine-tune a large-language model, uh, so and so forth. You know, the rest of the lectures are","zh":"讨论一些其他相关的内容，比如，如何使用上下文学习进行少样本学习？另一个是零样本学习，基本上这些都是关于如何使用大语言模型，你知道的，进行少样本学习、零样本学习，还有，如何微调一个大语言模型，诸如此类的问题。你知道的，其余的讲座内容是","start":47.24,"end":70.78},{"id":15,"text":"a bunch of small topics which are pretty kind of almost trivial, but I have to mention all of them in some sense to clarify the concept. But they are relatively easy stuff after I talk about architecture.","zh":"一系列相对较小的话题，这些话题几乎可以说是微不足道的，但我在某种程度上必须提到所有这些内容以澄清概念。但在我讲完架构之后，这些内容相对容易一些。","start":71.16,"end":80.86},{"id":16,"text":"I think I'll review the architecture a little bit quickly for five minutes just to remind you what is the transformer very quickly because what I'm going to talk about depends on those. Let me read you all this figure. Last week, we talked about this queries, keys, and values. These are the core of the attention in the transformer. Recall that if you have a single head in the transformer, you have this q1 up to qt.","zh":"我想快速回顾一下架构，大概五分钟，只是为了提醒大家什么是Transformer，因为接下来我要讲的内容依赖于这些内容。让我给大家看一下这个图。上周，我们讨论了查询、键和值。这些是Transformer中注意力机制的核心。请回忆一下，如果你在Transformer中有一个单头，你就会有q1到qt。","start":83.14,"end":107.26},{"id":17,"text":"this in time dimension for each time step you have a query vector,","zh":"在时间维度上，每个时间步都有一个查询向量，","start":107.91,"end":111.41},{"id":18,"text":"for each time step you have a key vector,","zh":"每个时间步都有一个键向量，","start":111.83,"end":114.87},{"id":19,"text":"and you also have a value vectors for each time step up to vt.","zh":"你也会有每个时间步对应的价值向量，直到vt。","start":117.99,"end":123.53},{"id":20,"text":"This is only for a single head.","zh":"这仅适用于一个单头的情况。","start":124.07,"end":125.55},{"id":21,"text":"The tension means I could take some inner products between this,","zh":"张力意味着我可以在这之间计算一些内积，","start":127.03,"end":129.99},{"id":22,"text":"and you compute some softmax.","zh":"然后你计算一些softmax。","start":130.15,"end":131.55},{"id":23,"text":"That means that you would say,","zh":"这意味着你会说，","start":132.11,"end":133.37},{"id":24,"text":"and also we have the autoregressive model,","zh":"并且我们还有自回归模型，","start":133.57,"end":136.13},{"id":25,"text":"which means that you never attend to things","zh":"这意味着你不会关注发生在你之后的事情，","start":136.13,"end":137.85},{"id":26,"text":"that happens after you,","zh":"所以你总是关注过去的事情，","start":137.85,"end":139.89},{"id":27,"text":"so you always attend to the past","zh":"以便你能够具有自回归的特性。","start":140.03,"end":141.57},{"id":28,"text":"so that you can have the autoregressive nature.","zh":"基本上，Q1关注K1，","start":141.57,"end":144.07},{"id":29,"text":"So basically Q1 attends to K1,","zh":"而Q2会关注K1和K2，对吧？","start":144.37,"end":146.39},{"id":30,"text":"and Q2 will attend to K1 and K2, right?","zh":"Q2会关注K1和K2，对吗？","start":147.17,"end":151.59},{"id":31,"text":"And Q2 will attend to all of the things before time T,","zh":"Q2会关注时间T之前的所有事物，","start":151.71,"end":157.47},{"id":32,"text":"something like this.","zh":"差不多是这样的。","start":157.59,"end":158.37},{"id":33,"text":"So basically the connections here are pretty much like,","zh":"所以基本上这里的连接方式基本上就像，","start":158.91,"end":162.73},{"id":34,"text":"it's kind of like if you visualize it as a matrix,","zh":"如果你把它可视化为一个矩阵，","start":162.83,"end":164.93},{"id":35,"text":"is the upper triangular matrix.","zh":"就是上三角矩阵。","start":164.93,"end":167.49},{"id":36,"text":"So, you only have like a tensions on the left,","zh":"所以，你只在左边有连接，","start":167.85,"end":170.23},{"id":37,"text":"but roughly speaking, you have half of the edges, right?","zh":"但粗略地说，你有一半的边，对吧？","start":170.31,"end":172.49},{"id":38,"text":"Then, once you get the attention score,","zh":"然后，一旦你得到注意力得分，","start":172.77,"end":174.43},{"id":39,"text":"you multiply them with the v's to get the final outputs.","zh":"你就用它们乘以 v 来得到最终的输出。","start":174.57,"end":179.29},{"id":40,"text":"But something like you have a matrix Q,","zh":"但是比如说你有一个矩阵Q，","start":179.53,"end":182.09}],"notes":["本段主要介绍了课程内容的安排，包括对注意力机制的变体、细节改进以及与Transformer相关的其他主题，如少样本学习、零样本学习和SFT（监督微调）。讲者提到这些内容较为基础，但需要提及以澄清概念。","讲者提到Transformer的架构，包括查询（queries）、键（keys）和值（values）的概念，并指出这些是注意力机制的核心。对于单个注意力头，每个时间步都有对应的查询向量、键向量和值向量。","讲者解释了Transformer的自回归性质，即在生成序列时，模型只能关注到当前时间步之前的内容，不能关注到之后的内容。这确保了模型的自回归特性。","讲者提到注意力机制的连接方式类似于上三角矩阵，表示每个查询向量只能关注到之前的时间步的键向量，从而形成一种因果关系。","讲者提到在获得注意力分数后，会将这些分数与值向量相乘，以得到最终的输出。这一步是注意力机制的核心计算过程。","讲者提到在讲解完架构后，会继续讨论其他与Transformer相关的主题，包括少样本学习、零样本学习和SFT等，这些内容相对简单，但需要提及以帮助理解整体概念。"],"formulas":[],"uncertainties":["tension","tensions"],"diagram":"none","start":5.42,"end":182.09,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":5.42,"text":"So, I think last, maybe I may redraw this again."},{"start":8.1,"text":"So, last week we talked about,"},{"start":10.58,"text":"last Wednesday we talked about attention,"},{"start":13.28,"text":"and today we're going to talk about some variants of attention,"},{"start":16.58,"text":"some of the details,"},{"start":17.94,"text":"how to improve it a little bit here and there."},{"start":20.2,"text":"We are not going to go into all the details because it's"},{"start":22.48,"text":"a very actually complicated field."},{"start":24.84,"text":"You probably have seen Samurai's talk,"},{"start":27.64,"text":"and that's also just the overview of this area."},{"start":30.1,"text":"Actually, there's a lot of co-design of"},{"start":32.28,"text":"of the architecture with some of the properties of the GPUs."},{"start":37.42,"text":"We cannot really go into all the details but I'm going to"},{"start":39.77,"text":"give you some feeling about what people can optimize for the architecture. Then after that, we're going to move on to"},{"start":47.24,"text":"Um, a few other kind of like, uh, things related to transformers. You know, one thing is that how do you do the few-shot learning with in-context learning? Um, another one is like, uh, the zero-shot, uh, uh, so basically these are about how to use large-language models, you know, with, you know, few-shot learning, zero-shot learning, um, and, uh, and one thing is like the SFT, how do you fine-tune a large-language model, uh, so and so forth. You know, the rest of the lectures are"},{"start":71.16,"text":"a bunch of small topics which are pretty kind of almost trivial, but I have to mention all of them in some sense to clarify the concept. But they are relatively easy stuff after I talk about architecture."},{"start":83.14,"text":"I think I'll review the architecture a little bit quickly for five minutes just to remind you what is the transformer very quickly because what I'm going to talk about depends on those. Let me read you all this figure. Last week, we talked about this queries, keys, and values. These are the core of the attention in the transformer. Recall that if you have a single head in the transformer, you have this q1 up to qt."},{"start":107.91,"text":"this in time dimension for each time step you have a query vector,"},{"start":111.83,"text":"for each time step you have a key vector,"},{"start":117.99,"text":"and you also have a value vectors for each time step up to vt."},{"start":124.07,"text":"This is only for a single head."},{"start":127.03,"text":"The tension means I could take some inner products between this,"},{"start":130.15,"text":"and you compute some softmax."},{"start":132.11,"text":"That means that you would say,"},{"start":133.57,"text":"and also we have the autoregressive model,"},{"start":136.13,"text":"which means that you never attend to things"},{"start":137.85,"text":"that happens after you,"},{"start":140.03,"text":"so you always attend to the past"},{"start":141.57,"text":"so that you can have the autoregressive nature."},{"start":144.37,"text":"So basically Q1 attends to K1,"},{"start":147.17,"text":"and Q2 will attend to K1 and K2, right?"},{"start":151.71,"text":"And Q2 will attend to all of the things before time T,"},{"start":157.59,"text":"something like this."},{"start":158.91,"text":"So basically the connections here are pretty much like,"},{"start":162.83,"text":"it's kind of like if you visualize it as a matrix,"},{"start":164.93,"text":"is the upper triangular matrix."},{"start":167.85,"text":"So, you only have like a tensions on the left,"},{"start":170.31,"text":"but roughly speaking, you have half of the edges, right?"},{"start":172.77,"text":"Then, once you get the attention score,"},{"start":174.57,"text":"you multiply them with the v's to get the final outputs."},{"start":179.53,"text":"But something like you have a matrix Q,"}],"speech_gaps":[],"frame":"../frames/v044/001.webp","frame_time":17.42},{"title":"注意力机制与KV缓存","segments":[{"id":41,"text":"which is like you have Q1 up to Qt,","zh":"这就像你有 Q1 到 Qt，","start":182.29,"end":186.15},{"id":42,"text":"and you have a matrix K,","zh":"并且你有一个矩阵 K，","start":186.67,"end":187.85},{"id":43,"text":"which is K1 up to Kt,","zh":"其中包含 K1 到 Kt，","start":188.45,"end":190.97},{"id":44,"text":"and you also have a matrix V,","zh":"你还有一个矩阵 V，","start":191.73,"end":194.05},{"id":45,"text":"v, which is v1 up to vt, and the formula was something like","zh":"v，即 v1 到 vt，而公式大概是","start":194.05,"end":200.19},{"id":46,"text":"The formula is something like Q times K transpose, which is the inner product between this and this, and you add a mask to make those invalid attentions minus infinity, so you don't really use them. Then you do a softmax, and this is a row-wise softmax.","zh":"公式大概是 Q 乘以 K 的转置，这是这两个之间的内积，然后你加上一个掩码，使那些无效的注意力变成负无穷，这样你就不会真正使用它们。然后你进行 softmax 操作，这是按行进行的 softmax。","start":202.09,"end":220.05},{"id":47,"text":"and then you multiply by the matrix V, something like this. That was what we discussed for one single head. Then when you have multiple heads, what do you do? When you have multiple heads, what happens is that you have many replicas of this kind of things. So you say, as opposed to just only one couplet here, this is one head, you have another head.","zh":"然后你将结果乘以矩阵 V，大概是这样的。这是我们讨论的一个单头的情况。当你有多个头时，你会怎么做？当你有多个头时，会发生的是你有这种结构的许多副本。因此，你可以说，与这里只有一个配对不同，这是一个头，你还有另一个头。","start":221.01,"end":245.01},{"id":48,"text":"which is not a replication but it's","zh":"这并不是复制，而是","start":245.82,"end":248.02},{"id":49,"text":"the same architecture with different weights.","zh":"相同的架构，但不同的权重。","start":248.02,"end":249.6},{"id":50,"text":"So you have a Q1, say, 2.","zh":"因此，你有一个 Q1，比如说，2。","start":249.82,"end":252.42},{"id":51,"text":"Let's use 2 to indicate the second hat,","zh":"让我们用 2 来表示第二个帽子，","start":252.6,"end":255.66},{"id":52,"text":"and you have Qt2 and K12 up to Kt2 and V12 up to Vt2.","zh":"并且你有 Qt2 和 K12 直到 Kt2，以及 V12 直到 Vt2。","start":256.38,"end":267.02},{"id":53,"text":"Then you can have 3 and 4, so on and so forth.","zh":"然后你可以有 3 和 4，依此类推。","start":267.26,"end":269.7},{"id":54,"text":"You have a number of these hats.","zh":"你有多个这样的帽子。","start":269.8,"end":271.04},{"id":55,"text":"And this is maybe Q1 1,","zh":"并且这可能是 Q1 1，","start":271.04,"end":273.26},{"id":56,"text":"Q2 1, so on and so forth.","zh":"Q2 1，依此类推。","start":273.44,"end":275.76},{"id":57,"text":"And you have many of this attention ahead.","zh":"你还有许多这样的注意力需要处理。","start":280.78,"end":283.08},{"id":58,"text":"So I think in the last five minutes of the last lecture,","zh":"所以我想在上一节课的最后五分钟里，","start":284.26,"end":289.36},{"id":59,"text":"so we also discussed some of this efficiency perspective here.","zh":"我们也讨论了一些关于效率的观点。","start":290.22,"end":295.32},{"id":60,"text":"So I guess the computation here is T by T.","zh":"所以我认为这里的计算是 T 乘以 T。","start":295.6,"end":299.88},{"id":61,"text":"T. So you have T squared,","zh":"T。因此你有 T 平方，","start":299.88,"end":300.86},{"id":62,"text":"at least scales in T squared in terms of the computation.","zh":"至少在计算量上是与 T 平方成比例的。","start":301.8,"end":304.4},{"id":63,"text":"In terms of storage or memory,","zh":"从存储或内存的角度来看，","start":305.14,"end":307.9},{"id":64,"text":"you have to need a scale in T because the larger the T is,","zh":"你需要一个与 T 成比例的规模，因为 T 越大，","start":308.08,"end":312.14},{"id":65,"text":"you have to store more things like all the Q, K, V in your memory.","zh":"你必须在内存中存储更多的内容，比如所有的Q、K、V。","start":312.24,"end":315.68},{"id":66,"text":"So actually, you only have to store the K and V,","zh":"实际上，你只需要存储K和V，","start":317.26,"end":319.38},{"id":67,"text":"you don't have to store Q because as you are generating more and more,","zh":"你不需要存储Q，因为在生成越来越多的内容时，","start":319.52,"end":322.56},{"id":68,"text":"you can drop some of these Qs in the generation process.","zh":"你可以在生成过程中丢弃一些Q。","start":322.62,"end":325.14},{"id":69,"text":"Because only the Qs for the last step is needed,","zh":"因为只有最后一步的Q是需要的，","start":325.42,"end":328.12},{"id":70,"text":"needed but the case for all the previous steps","zh":"而所有先前步骤的Q在生成越来越多的内容时是需要的。","start":328.12,"end":329.96},{"id":71,"text":"is needed when you generate more and more.","zh":"但无论如何，只需要存储K和V就需要线性内存。","start":329.96,"end":331.88},{"id":72,"text":"But in any case, just the K and V requires linear int memory,","zh":"但无论如何，仅仅K和V就需要线性内存。","start":332.22,"end":337.06},{"id":73,"text":"and that's why it's called KV cache.","zh":"这就是为什么它被称为KV缓存。","start":337.4,"end":339.0},{"id":74,"text":"I guess you probably have heard of this word.","zh":"我想你可能已经听说过这个词。","start":339.2,"end":340.54},{"id":75,"text":"So basically, you have to save all the Ks and","zh":"所以基本上，你需要在内存中保存每个头的所有K值和","start":340.68,"end":342.6},{"id":76,"text":"Vs for every head in the memory.","zh":"V值。","start":342.6,"end":344.72},{"id":77,"text":"And this is a huge storage space.","zh":"而这需要巨大的存储空间。","start":345.82,"end":349.68},{"id":78,"text":"Basically this restricts, from a system perspective,","zh":"从系统角度来看，这基本上限制了","start":349.84,"end":353.18},{"id":79,"text":"the details are complicated,","zh":"细节是复杂的，","start":353.92,"end":355.4},{"id":80,"text":"but let me give you the high-level thing.","zh":"但让我给你一个高层次的解释。","start":355.58,"end":356.9},{"id":81,"text":"So because you have to save all of this,","zh":"所以因为你必须保存所有这些内容，","start":357.48,"end":359.86}],"notes":["本段讲解了注意力机制中的计算过程，包括Q、K、V矩阵的使用，以及如何通过掩码处理无效注意力。接着讨论了多头注意力机制，每个头都有独立的Q、K、V矩阵，但结构相同，权重不同。最后提到计算复杂度和存储需求，特别是KV缓存的概念，即只存储K和V矩阵，以减少内存使用。"],"formulas":[{"latex":"QK^T","symbols":"Q乘以K的转置","explanation":"公式正确，表示Q矩阵与K矩阵的转置的乘积，符合注意力机制中的内积计算。","evidence":"The formula is something like Q times K transpose, which is the inner product between this and this, and you add a mask to make those invalid attentions minus infinity, so you don't really use them. Then you do a softmax, and this is a row-wise softmax."},{"latex":"KV","symbols":"K乘以V","explanation":"公式正确，表示K矩阵与V矩阵的乘积，符合注意力机制中的后续操作。","evidence":"and then you multiply by the matrix V, something like this. That was what we discussed for one single head. Then when you have multiple heads, what do you do? When you have multiple heads, what happens is that you have many replicas of this kind of things. So you say, as opposed to just only one couplet here, this is one head, you have another head."},{"latex":"T^2","symbols":"时间复杂度为T的平方","explanation":"公式正确，表示注意力机制的时间复杂度为T的平方，符合计算复杂度的描 xt":"Then you can have 3 and 4, so on and so forth."},{"start":269.8,"text":"You have a number of these hats."},{"start":271.04,"text":"And this is maybe Q1 1,"},{"start":273.44,"text":"Q2 1, so on and so forth."},{"start":280.78,"text":"And you have many of this attention ahead."},{"start":284.26,"text":"So I think in the last five minutes of the last lecture,"},{"start":290.22,"text":"so we also discussed some of this efficiency perspective here."},{"start":295.6,"text":"So I guess the computation here is T by T."},{"start":299.88,"text":"T. So you have T squared,"},{"start":301.8,"text":"at least scales in T squared in terms of the computation."},{"start":305.14,"text":"In terms of storage or memory,"},{"start":308.08,"text":"you have to need a scale in T because the larger the T is,"},{"start":312.24,"text":"you have to store more things like all the Q, K, V in your memory."},{"start":317.26,"text":"So actually, you only have to store the K and V,"},{"start":319.52,"text":"you don't have to store Q because as you are generating more and more,"},{"start":322.62,"text":"you can drop some of these Qs in the generation process."},{"start":325.42,"text":"Because only the Qs for the last step is needed,"},{"start":328.12,"text":"needed but the case for all the previous steps"},{"start":329.96,"text":"is needed when you generate more and more."},{"start":332.22,"text":"But in any case, just the K and V requires linear int memory,"},{"start":337.4,"text":"and that's why it's called KV cache."},{"start":339.2,"text":"I guess you probably have heard of this word."},{"start":340.68,"text":"So basically, you have to save all the Ks and"},{"start":342.6,"text":"Vs for every head in the memory."},{"start":345.82,"text":"And this is a huge storage space."},{"start":349.84,"text":"Basically this restricts, from a system perspective,"},{"start":353.92,"text":"the details are complicated,"},{"start":355.58,"text":"but let me give you the high-level thing."},{"start":357.48,"text":"So because you have to save all of this,"}],"speech_gaps":[],"frame":"../frames/v044/002.webp","frame_time":194.29},{"title":"KV缓存与内存限制对批量大小的影响","segments":[{"id":82,"text":"you cannot, they take a lot of memory, GPU memory,","zh":"你不能，它们占用大量内存，GPU内存，","start":361.1,"end":364.4},{"id":83,"text":"and that makes it very hard for you to have","zh":"这使得你很难在你的批次中包含大量示例，","start":364.68,"end":367.24},{"id":84,"text":"a lot of examples in your batch,","zh":"在你的批次中包含大量序列。","start":367.24,"end":369.68},{"id":85,"text":"a lot of sequences in your batch.","zh":"因此，在某些情况下，仅仅保存一个单一序列的KV缓存","start":369.78,"end":370.82},{"id":86,"text":"So in some cases, even just saving the KV cache","zh":"就会消耗掉你大部分的内存。","start":371.04,"end":374.1},{"id":87,"text":"for the one single sequence will use up most of your memory.","zh":"或者也许你可以保存像10个序列，","start":374.1,"end":377.86},{"id":88,"text":"Or maybe you can save like 10 sequences,","zh":"或者也许可以保存100个序列，类似这样的数量。","start":378.14,"end":381.4},{"id":89,"text":"or maybe 100 sequences, something like that.","zh":"或者可能是100个序列，类似这样的情况。","start":381.46,"end":382.98},{"id":90,"text":"But there's a limit on how many sequences you can save in your","zh":"但是你无法在你的内存中保存太多序列","start":383.2,"end":389.94},{"id":91,"text":"memory.","zh":"的限制。","start":389.94,"end":390.16},{"id":92,"text":"So basically, you cannot have a large batch size when you","zh":"所以基本上，当你进行推理时，你不能有大的批量大小","start":390.28,"end":392.78},{"id":93,"text":"do the inference, because there's not enough memory","zh":"，因为内存不足以保存所有序列的kbcache。","start":392.78,"end":395.88},{"id":94,"text":"to save all of the kbcache for all of the sequences.","zh":"当你没有足够的大批量大小时，","start":395.88,"end":398.58},{"id":95,"text":"And when you don't have enough large batch size,","zh":"就会出现Samarin上次提到的一些算术强度问题。","start":399.16,"end":401.06},{"id":96,"text":"then you have this issue with the arithmetic intensity","zh":"并且当你没有足够的大批量大小时，","start":401.06,"end":405.28},{"id":97,"text":"that Samarin talked about a little bit last time.","zh":"就会出现Samarin上次提到的一些算术强度问题。","start":405.28,"end":408.98},{"id":98,"text":"So basically, you cannot leverage enough parallelism","zh":"所以基本上，你无法充分利用不同示例之间的并行性","start":409.08,"end":411.12},{"id":99,"text":"across different examples to utilize your GPU compute.","zh":"来利用你的GPU计算能力。","start":411.12,"end":414.54},{"id":100,"text":"So basically, you are bounded by the memory,","zh":"所以基本上，你受到内存的限制，","start":414.92,"end":416.68},{"id":101,"text":"and you cannot use up all the GPUs compute.","zh":"无法充分利用所有GPU的计算能力。","start":416.82,"end":419.1},{"id":102,"text":"So if you measure the throughput,","zh":"所以如果你测量吞吐量，","start":420.02,"end":422.9},{"id":103,"text":"there's some point called MFU, I think Samarin introduced last time.","zh":"会有一个叫做MFU的临界点，我想上次Samarin提到了。","start":423.54,"end":428.24},{"id":104,"text":"so so basically your your your GPU is","zh":"所以基本上你的GPU","start":428.24,"end":431.14},{"id":105,"text":"and it's waiting for work for the compute side. So that's the dependency here. That's why people thought it's very useful to reduce the amount of KV cache you have to save here. We are saving too much KV cache in the memory. That's why there is so-called group query attention, which is introduced by the Kuhn models and deep-seq models.","zh":"正在等待计算部分的工作。这就是这里的依赖关系。这就是为什么人们认为减少需要保存的KV缓存量非常有用。我们在内存中保存了太多的KV缓存。这就是所谓的分组查询注意力，这是Kuhn模型和deep-seq模型中引入的。","start":431.73,"end":459.37},{"id":106,"text":"Query attention and the way to do it is that you say I'm not gonna have all the","zh":"查询注意力及其实现方式是，你可以说我不会拥有所有的","start":461.29,"end":466.83},{"id":107,"text":"Different kind of like a I don't have that many keys. I'm gonna reduce number of keys","zh":"不同种类的，比如我并不拥有那么多的键。我要减少键的数量","start":468.75,"end":474.05},{"id":108,"text":"but","zh":"但是","start":474.63,"end":475.11},{"id":109,"text":"But but keep the same number quarries","zh":"但但保持相同的查询数量","start":476.21,"end":478.59},{"id":110,"text":"So so basically this is the head ID by had one had two so and so forth","zh":"所以所以基本上这是头部ID，一个头部有两个，依此类推","start":478.59,"end":483.57},{"id":111,"text":"I have like so before I have like a for every head. I have different keys and","zh":"我之前对于每个头部都有不同的键，","start":483.57,"end":488.29},{"id":112,"text":"and values and now I'm going to have","zh":"和值，现在我要拥有","start":488.29,"end":491.43},{"id":113,"text":"some shared keys and values across all the heads.","zh":"在所有头部之间共享的键和值。","start":491.43,"end":495.07},{"id":114,"text":"So what happens is that you have,","zh":"那么发生的情况是，你有,","start":495.83,"end":497.45},{"id":115,"text":"in the time dimension, we cannot save much.","zh":"在时间维度上，我们无法保存很多。","start":499.21,"end":501.23},{"id":116,"text":"So that's another question.","zh":"所以这是另一个问题。","start":501.39,"end":504.29},{"id":117,"text":"It's more like in a key and query dimension.","zh":"更像是在键和查询维度上。","start":504.47,"end":506.41},{"id":118,"text":"So basically, you say you have q11 up to q1t,","zh":"基本上，你说你有 q11 到 q1t,","start":506.69,"end":512.13},{"id":119,"text":"and then you have q12 up to q2t.","zh":"然后你有 q12 到 q2t。","start":512.31,"end":516.05},{"id":120,"text":"this is the first hat, this is the second hat,","zh":"这是第一个帽子，这是第二个帽子，","start":516.05,"end":519.13},{"id":121,"text":"you know, maybe you have the third hat, so on and so forth.","zh":"你知道的，也许你有第三个帽子，依此类推。","start":519.37,"end":521.47},{"id":122,"text":"But on the key side,","zh":"但在键的一侧，","start":521.95,"end":523.15},{"id":123,"text":"you have much fewer groups of the keys.","zh":"你拥有的键组要少得多。","start":523.39,"end":526.33},{"id":124,"text":"So you say, I have like a- so maybe here is a 1,","zh":"所以你可能会说，我有像这样的一个，","start":526.55,"end":529.37},{"id":125,"text":"2, 3 up to an H,","zh":"2、3一直到H，","start":529.41,"end":531.77},{"id":126,"text":"this is the number of hats.","zh":"这是帽子的数量。","start":532.23,"end":533.31},{"id":127,"text":"But, you know, the number of keys is much smaller.","zh":"但你知道，键的数量要小得多。","start":534.21,"end":537.23},{"id":128,"text":"So you say, I'm gonna have a fe 49,"text":"Okay. Anyway, let's keep going and see."},{"start":836.55,"text":"So, so tau is the,"},{"start":839.63,"text":"the, the difference between these two, right?"},{"start":841.63,"text":"So basically, J minus one divided by tau is kind of like which group you,"},{"start":844.85,"text":"which kind of like key- set of keys you are matching to,"},{"start":848.01,"text":"and floor plus one."},{"start":849.39,"text":"So this is a number between one and NG, right?"},{"start":854.73,"text":"So basically, you're saying which group I'm in for this query J."},{"start":859.33,"text":"J is in one to NH."},{"start":862.95,"text":"So, and then once you know which group you belong to,"},{"start":865.97,"text":"and then you can do the- in a product."},{"start":870.43,"text":"So, Qj will be multiplied in a product with Gj transpose,"},{"start":877.05,"text":"where this is the index for the group,"},{"start":879.59,"text":"for the keys you have to attend to,"},{"start":882.85,"text":"and then you divide by C,"},{"start":886.29,"text":"this is the normalization constant,"},{"start":887.77,"text":"constant and you multiply by n and you take a softmax."}],"speech_gaps":[],"frame":"../frames/v044/005.webp","frame_time":725.25},{"title":"Softmax归一化常数C的选择","segments":[{"id":162,"text":"And then you multiply by vgj,","zh":"然后你乘以 vgj，","start":894.29,"end":896.69},{"id":163,"text":"use the same ID for the set of values,","zh":"对值集合使用相同的 ID，","start":896.89,"end":900.85},{"id":164,"text":"and this is the output for the j's hat.","zh":"这就是 j 的帽子的输出。","start":901.23,"end":904.41},{"id":165,"text":"So, you still have the same number has similar outputs,","zh":"因此，你仍然有相同数量的相似输出，","start":905.25,"end":907.61},{"id":166,"text":"it's just like some of these outputs are using the same k.","zh":"就像其中一些输出使用了相同的 k。","start":908.03,"end":911.13},{"id":167,"text":"So, that's the only difference.","zh":"因此，这就是唯一的区别。","start":913.99,"end":915.45},{"id":168,"text":"Did I explain the C last time?","zh":"我之前解释过 C 吗？","start":917.83,"end":920.05},{"id":169,"text":"The reason why we have a C is because we want to make","zh":"我们之所以有 C，是因为我们想要让","start":920.15,"end":922.43},{"id":170,"text":"sure the input to the softmax is more normalized.","zh":"确保输入到softmax的值更加规范化。","start":922.43,"end":926.29},{"id":171,"text":"So C is often chosen to be something like,","zh":"因此，C通常被选择为类似这样的值，","start":926.93,"end":929.93},{"id":172,"text":"this is a matrix like this inner product,","zh":"这是一个类似于内积的矩阵，","start":930.41,"end":933.67},{"id":173,"text":"no matter whether you have the GJ,","zh":"无论你是否有GJ，","start":933.81,"end":935.01},{"id":174,"text":"or whether you have the group cores,","zh":"或者是否有群核心，","start":935.19,"end":937.61},{"id":175,"text":"or the standard multi-hydro tension,","zh":"或者是否有标准的多氢张力，","start":937.81,"end":940.05},{"id":176,"text":"this inner product is always something like it's a T by DA.","zh":"这个内积总是类似于它是一个T乘以DA的矩阵。","start":940.33,"end":943.71},{"id":177,"text":"and dh by t matrix. So basically,","zh":"以及一个dh乘以t的矩阵。因此，基本上，","start":947.04,"end":950.66},{"id":178,"text":"each entry is in a part of two vectors of dimension dH. Typically, C is chosen to be something like square root dH, and that's because if you have, suppose these two matrices are on the order of plus one minus one, then the inner product between two vectors, so you have two vectors, they're all dimension dH, and you take the inner product, most likely if they are random, then they're all on the order of square root dH.","zh":"每个元素都属于两个维度为dH的向量的一部分。通常，C被选择为类似于平方根dH的值，这是因为如果你假设有这两个矩阵的值大约在加一减一之间，那么两个向量之间的内积，即你有两个维度为dH的向量，它们的内积，如果这些向量是随机的，那么它们的值大约在平方根dH的量级上。","start":951.66,"end":977.76},{"id":179,"text":"So suppose you have two vectors, maybe say A, which is on the order of dimension dH, and B is on the dimension dH, and they are somewhat random, and each of the entries of A is on the order of plus 1, minus 1. Let's say each of the A sub i is on the order of plus 1, minus 1. Then the inner product between A and B, this is on the order of square root dH.","zh":"假设你有两个向量，比如说A，其维度大约为dH，B的维度也是dH，它们是某种程度上的随机向量，且A的每个元素大约在加一减一之间。比如说，每个A的第i个元素大约在加一减一之间。那么A和B之间的内积，大约在平方根dH的量级上。","start":978.28,"end":1004.52},{"id":180,"text":"And if you divide, if you choose C to be dH, then you will cancel out with this scale so that it comes back to the scale of one, so that it doesn't depend on the dimension as much. So ideally you want to make sure that even you change dimension dH, you don't have to change your architecture too much. Everything is on the right scale. So that's why typically people choose C because dH, square root dH, so that you can cancel with this scale.","zh":"如果你选择C为dH，那么你会抵消这个量级，使得结果回到一的量级，从而减少对维度的依赖。因此，理想情况下，你希望确保即使你改变维度dH，也不需要大幅改变你的架构。所有内容都在合适的量级上。这就是为什么人们通常选择C为dH或平方根dH，以便抵消这个量级。","start":1005.55,"end":1030.6},{"id":181,"text":"Of course, this is a very heuristic calculation.","zh":"当然，这只是一个非常启发式的计算。","start":1032.01,"end":1034.01},{"id":182,"text":"There are, for many cases of this normalizing constant,","zh":"对于许多这种归一化常数的情况，","start":1035.19,"end":1039.03},{"id":183,"text":"there are different theories which can give you","zh":"存在不同的理论可以给出","start":1039.37,"end":1041.17},{"id":184,"text":"slightly different predictions on what's the right way to do it.","zh":"略微不同的预测，关于如何正确进行归一化。","start":1041.17,"end":1044.75},{"id":185,"text":"For example, depending on how you think about the A and B,","zh":"例如，根据你如何思考A和B，","start":1045.25,"end":1048.81},{"id":186,"text":"why A and B should be random like.","zh":"为什么A和B应该像这样随机？","start":1048.87,"end":1051.55},{"id":187,"text":"Maybe A and B should be all already in one direction in some sense,","zh":"也许在某种意义上，A和B应该已经在一个方向上","start":1053.21,"end":1057.01},{"id":188,"text":"then you should choose a different normalizing constant.","zh":"那么你应该选择一个不同的归一化常数","start":1057.15,"end":1059.83},{"id":189,"text":"Empirically, it sounds like this normalizing constant at least is one of the working choice, you know, other people probably use that other choices","zh":"从经验上看，这种归一化常数至少是一个可行的选择，你知道，其他人可能使用其他的选择","start":1060.73,"end":1066.73},{"id":190,"text":"So but generally speaking, you know","zh":"所以总的来说，你知道","start":1067.55,"end":1069.35}],"notes":["本段主要讲解在Softmax函数中引入归一化常数C的原因和选择方法。C的作用是确保输入到Softmax函数的值更加规范化，避免数值过大或过小导致计算不稳定。","归一化常数C通常被选择为√dH，其中dH是向量的维度。这是因为当两个随机向量的维度为dH时，它们的内积通常在√dH的量级上，通过选择C为dH可以将内积的量级归一化为1，从而减少维度对结果的影响。","虽然这种选择是基于启发式的计算，但不同理论可能会给出不同的预测，关于如何选择合适的归一化常数。例如，如果A和B已经被定向在某个方向上，可能需要不同的归一化常数。","在实践中，选择√dH作为归一化常数是一种常见的做法，但其他选择也可能被使用。归一化常数的选择会影响模型的性能和稳定性。","归一化常数的选择需要考虑向量的分布特性，如果向量是随机的，通常选择√dH；如果向量已经具有某种方向性，则可能需要不同的归一化策略。","归一化常数的选择是模型设计中的一个重要考虑因素，它影响着模型的可解释性和计算效率。"],"formulas":[{"latex":"C = \\sqrt{dH}","symbols":"C是归一化常数，dH是向量的维度","explanation":"公式正确，C被选择为dH的平方根以确保尺度合理。","evidence":"each entry is in a part of two vectors of dimension dH. Typically, C is chosen to be something like square root dH, and that's because if you have, suppose these two matrices are on the order of plus one minus one, then the inner product between two vectors, so you have two vectors, they're all dimension dH, and you take the inner product, most likely if they are random, then they're all on the order of square root dH."},{"latex":"A \\text{ and } B \\text{ are random vectors of dimension } dH","symbols":"A和B是维度为dH的随机向量","explanation":"公式正确，描述了A和B作为维度为dH的随机向量。","evidence":"So suppose you have two vectors, maybe say A, which is on the order of dimension dH, and B is on the dimension dH, and they are somewhat random, and each of the entries of A is on the order of plus 1, minus 1. Let's say each of the A sub i is on the order of plus 1, minus 1. Then the inner product between A and B, this is on the order of square root dH."},{"latex":"A \\text{ and } B \\text{ are in the same direction}","symbols":"A和B在同一个方向上","explanation":"公式正确，描述了A和B可能在同一个方向上的情况。","evidence":"Maybe A and B should be all already in one direction in some sense,"}],"uncertainties":["multi-hydro tension","group cores","GJ"],"diagram":"none","start":894.29,"end":1069.35,"asr_flags":[],"math_clarifications":["C的选取是基于向量A和B的随机性，以确保内积的尺度合理。"],"boards":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":894.29,"text":"And then you multiply by vgj,"},{"start":896.89,"text":"use the same ID for the set of values,"},{"start":901.23,"text":"and this is the output for the j's hat."},{"start":905.25,"text":"So, you still have the same number has similar outputs,"},{"start":908.03,"text":"it's just like some of these outputs are using the same k."},{"start":913.99,"text":"So, that's the only difference."},{"start":917.83,"text":"Did I explain the C last time?"},{"start":920.15,"text":"The reason why we have a C is because we want to make"},{"start":922.43,"text":"sure the input to the softmax is more normalized."},{"start":926.93,"text":"So C is often chosen to be something like,"},{"start":930.41,"text":"so this is a matrix like this inner product,"},{"start":933.81,"text":"no matter whether you have the GJ,"},{"start":935.19,"text":"or whether you have the group cores,"},{"start":937.81,"text":"or the standard multi-hydro tension,"},{"start":940.33,"text":"this inner product is always something like it's a T by DA."},{"start":947.04,"text":"and dh by t matrix. So basically,"},{"start":951.66,"text":"each entry is in a part of two vectors of dimension dH. Typically, C is chosen to be something like square root dH, and that's because if you have, suppose these two matrices are on the order of plus one minus one, then the inner product between two vectors, so you have two vectors, they're all dimension dH, and you take the inner product, most likely if they are random, then they're all on the order of square root dH."},{"start":978.28,"text":"So suppose you have two vectors, maybe say A, which is on the order of dimension dH, and B is on the dimension dH, and they are somewhat random, and each of the entries of A is on the order of plus 1, minus 1. Let's say each of the A sub i is on the order of plus 1, minus 1. Then the inner product between A and B, this is on the order of square root dH."},{"start":1005.55,"text":"And if you divide, if you choose C to be dH, then you will cancel out with this scale so that it comes back to the scale of one, so that it doesn't depend on the dimension as much. So ideally you want to make sure that even you change dimension dH, you don't have to change your architecture too much. Everything is on the right scale. So that's why typically people choose C because dH, square root dH, so that you can cancel with this scale."},{"start":1032.01,"text":"Of course, this is a very heuristic calculation."},{"start":1035.19,"text":"There are, for many cases of this normalizing constant,"},{"start":1039.37,"text":"there are different theories which can give you"},{"start":1041.17,"text":"slightly different predictions on what's the right way to do it."},{"start":1045.25,"text":"For example, depending on how you think about the A and B,"},{"start":1048.87,"text":"why A and B should be random like."},{"start":1053.21,"text":"Maybe A and B should be all already in one direction in some sense,"},{"start":1057.15,"text":"then you should choose a different normalizing constant."},{"start":1060.73,"text":"Empirically, it sounds like this normalizing constant at least is one of the working choice, you know, other people probably use that other choices"},{"start":1067.55,"text":"So but generally speaking, you know"}],"speech_gaps":[{"start":911.53,"end":913.59},{"start":944.11,"end":945.808}],"frame":"../frames/v044/006.webp","frame_time":906.29},{"title":"强化学习基础与策略梯度","segments":[{"id":191,"text":"The choice here is kind of like it's you can only have some heuristics to justify it, but it's not like","zh":"这里的抉择有点像是，你只能有一些启发式方法来证明它，但并不是像","start":1070.87,"end":1076.23},{"id":192,"text":"It's not like you can really","zh":"你真的能够","start":1079.01,"end":1080.07},{"id":193,"text":"Rigorously predict what's the right thing?","zh":"严格预测什么是正确的事情吗？","start":1080.49,"end":1081.95},{"id":194,"text":"So like you have some intuitions you have some heuristics and then you try it and empirically it works then that's your choice","zh":"所以，你有一些直觉，有一些启发式方法，然后你尝试一下，如果在实践中有效，那这就是你的选择","start":1082.07,"end":1087.67},{"id":195,"text":"Okay. Sounds good. Any questions so far?","zh":"好的。听起来不错。到目前为止有问题吗？","start":1089.27,"end":1093.77},{"id":196,"text":"Is this the reason why we chose to grow it?","zh":"这是为什么我们选择这样增长的原因吗？","start":1094.31,"end":1096.97},{"id":197,"text":"Yeah. That reason is pretty clear because the queries that have to be stored in your generation.","zh":"是的。这个原因相当清楚，因为需要存储在你生成中的查询。","start":1099.19,"end":1107.55},{"id":198,"text":"So basically, if you are at time t,","zh":"基本上，如果你在时间 t 时，","start":1107.77,"end":1109.27},{"id":199,"text":"you only have to store the query at time t.","zh":"你只需要在时间 t 存储查询。","start":1109.51,"end":1112.15},{"id":200,"text":"In the prefilling or training,","zh":"在预填充或训练过程中，","start":1112.51,"end":1114.87},{"id":201,"text":"you have to have all of them.","zh":"你需要拥有所有的查询。","start":1114.95,"end":1116.05},{"id":202,"text":"but I think we're mostly thinking about the generation time.","zh":"但我认为我们主要考虑的是生成时间。","start":1116.05,"end":1118.63},{"id":203,"text":"So in the generation time, at the particular time t,","zh":"因此，在生成时间的特定时间 t，","start":1118.85,"end":1122.31},{"id":204,"text":"you don't have to use any of the previous queries","zh":"你不需要使用任何之前的查询，","start":1122.43,"end":1124.05},{"id":205,"text":"because you already computed the query","zh":"因为你已经为这些查询计算了查询到键的注意力。","start":1124.05,"end":1125.61},{"id":206,"text":"to the key attention for those queries already.","zh":"对那些查询已经给予关键关注。","start":1126.15,"end":1127.83},{"id":207,"text":"So you don't have to save the last...","zh":"所以你不需要保存最后一个...","start":1128.25,"end":1130.07},{"id":208,"text":"So that means that the memory cost for query is much smaller than the memory cost for keys and values because you have to save the whole sequence. So that's why you have much more incentive to reduce the number of keys and values. Of course, you can universally reduce all of them, but then you are just trying to reduce the number of heads in some sense.","zh":"这意味着查询的内存成本比键和值的内存成本要小得多，因为你需要保存整个序列。这就是为什么你更有动力减少键和值的数量。当然，你可以普遍地减少所有内容，但这样你只是在某种程度上试图减少头的数量。","start":1133.21,"end":1161.45},{"id":209,"text":"This is just trying to formalize how to compute a query as a key attention. So like in matrix form, so sometimes the high level overview is that figure. So basically you do this q, j, and k. The g parenthesis j is what you are, which group you are attending to. So for this,","zh":"这只是在尝试形式化如何计算查询作为键注意力。例如在矩阵形式中，有时高层次的概述就是这个图。基本上你执行这个 q、j 和 k。g 括号 j 是你在关注的组，也就是 G 的索引。对于这个，","start":1173.3,"end":1198.58},{"id":210,"text":"For both this set of queries and this set of queries, you are attending to this set of keys, so that's the index for G, this index. And then the Q and K inner products are the inner products between the keys and queries, and then you mask it, as we discussed last time, and you take the softmax and you do the normal attention. Yes, we have fewer number of keys, fewer sets of keys.","zh":"对于这两组查询，你都在关注这组键，这就是 G 的索引。然后 Q 和 K 的内积是键和查询之间的内积，然后你像我们上次讨论的那样进行掩码处理，再取 softmax 并执行正常的注意力。是的，我们有更少的键，更少的键组。","start":1199.37,"end":1231.36}],"notes":["本段讨论了在强化学习中，如何通过启发式方法和经验验证来选择策略，而不是严格预测最优解。讲者指出，虽然不能完全严谨地预测正确做法，但通过直觉和经验验证可以做出选择。","讲者进一步解释了在生成过程中，查询（query）的存储需求比键（key）和值（value）小，因为只需要存储当前时间点的查询，而键和值需要保存整个序列。这导致了对键和值数量的优化需求。","讲者提到，计算查询与键的注意力时，使用矩阵形式进行操作，并通过掩码和softmax进行标准化处理。这与之前讨论的注意力机制一致。","讲者强调，由于键的数量较少，因此在注意力机制中，可以减少键的数量，从而减少计算量，这类似于减少注意力头的数量。"],"formulas":[],"uncertainties":["The g parenthesis j is what you are, which group you are attending to."],"diagram":"none","start":1070.87,"end":1231.36,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":1070.87,"text":"The choice here is kind of like it's you can only have some heuristics to justify it, but it's not like"},{"start":1079.01,"text":"It's not like you can really"},{"start":1080.49,"text":"Rigorously predict what's the right thing?"},{"start":1082.07,"text":"So like you have some intuitions you have some heuristics and then you try it and empirically it works then that's your choice"},{"start":1089.27,"text":"Okay. Sounds good. Any questions so far?"},{"start":1094.31,"text":"Is this the reason why we chose to grow it?"},{"start":1099.19,"text":"Yeah. That reason is pretty clear because the queries that have to be stored in your generation."},{"start":1107.77,"text":"So basically, if you are at time t,"},{"start":1109.51,"text":"you only have to store the query at time t."},{"start":1112.51,"text":"In the prefilling or training,"},{"start":1114.95,"text":"you have to have all of them."},{"start":1116.05,"text":"but I think we're mostly thinking about the generation time."},{"start":1118.85,"text":"So in the generation time, at the particular time t,"},{"start":1122.43,"text":"you don't have to use any of the previous queries"},{"start":1124.05,"text":"because you already computed the query"},{"start":1126.15,"text":"to the key attention for those queries already."},{"start":1128.25,"text":"So you don't have to save the last..."},{"start":1133.21,"text":"So that means that the memory cost for query is much smaller than the memory cost for keys and values because you have to save the whole sequence. So that's why you have much more incentive to reduce the number of keys and values. Of course, you can universally reduce all of them, but then you are just trying to reduce the number of heads in some sense."},{"start":1173.3,"text":"This is just trying to formalize how to compute a query as a key attention. So like in matrix form, so sometimes the high level overview is that figure. So basically you do this q, j, and k. The g parenthesis j is what you are, which group you are attending to. So for this,"},{"start":1199.37,"text":"For both this set of queries and this set of queries, you are attending to this set of keys, so that's the index for G, this index. And then the Q and K inner products are the inner products between the keys and queries, and then you mask it, as we discussed last time, and you take the softmax and you do the normal attention. Yes, we have fewer number of keys, fewer sets of keys."}],"speech_gaps":[{"start":1076.63,"end":1078.61},{"start":1130.688,"end":1132.81}],"frame":"../frames/v044/007.webp","frame_time":1082.87},{"title":"注意力机制与多查询注意力","segments":[{"id":211,"text":"and different set of cores are kinda attached to the same set of keys. Yes, so basically you have so many different keys here. The value of, where is tau? Oh, tau is here. This is just a parameter, I think. So, you know, you can, there are three numbers here, right, so.","zh":"并且不同的核心集合似乎连接到相同的键集合。是的，所以基本上你有这么多不同的键。这里的值，tau在哪里？哦，tau在这里。这只是一个参数，我想。所以，你知道的，这里有三个数字，对吧，所以。","start":1233.19,"end":1269.78},{"id":212,"text":"I guess you just, you know, you have to respect this equation. Other than that, you just choose something that works empirically. Of course, you know, if you make tau too big, so for example, tau can be equal to nh. Then you just have only one set of cores, sorry, one set of keys and values, then you have the smallest possible memory cost.","zh":"我想你只需要尊重这个等式。除此之外，你只需选择一个在经验上有效的方案。当然，你知道，如果你让tau太大，例如，tau可以等于nh。那么你只有一组核心，抱歉，一组键和值，这样你就能获得最小的内存开销。","start":1270.79,"end":1292.63},{"id":213,"text":"But the problem is that you store too little in some sense. If you just only have one set of keys, then maybe you don't have enough information stored so that you lose some of the information of the past. Because in some sense, how much you store depends a little bit on...","zh":"但问题在于，从某种意义上说，你存储的信息太少。如果你只有一组键，那么你可能存储的信息不够，从而丢失了过去的一些信息。因为在某种意义上，你存储多少取决于……","start":1293.32,"end":1307.98},{"id":214,"text":"like the storage is needed in some sense because the memory is needed because you have to remember what happened in the history, right? It's more like how much you have to remember is something you need to kind of tune in some sense. So I think actually this is a good question in the sense that I think if you choose tau to be the same as NH,","zh":"存储是必要的，因为在某种意义上，内存是必要的，因为你必须记住历史发生了什么，对吧？你必须记住多少信息，某种程度上是你需要调整的。因此，我认为这个问题本身就很有趣，我想如果你选择tau等于NH，","start":1308.92,"end":1331.0},{"id":215,"text":"So, the NG is one.","zh":"所以，NG是1。","start":1331.61,"end":1333.21},{"id":216,"text":"I think this is called multi-query attention.","zh":"我想这被称为多查询注意力。","start":1333.41,"end":1336.05},{"id":217,"text":"Um, so, so, so, you know,","zh":"嗯，所以，所以，所以，你知道的，","start":1336.85,"end":1338.71},{"id":218,"text":"so, so basically the history is that,","zh":"所以，基本上历史是这样的，","start":1338.71,"end":1340.23},{"id":219,"text":"and there was one paper that actually choose this,","zh":"并且有一篇论文实际上选择了这个方法，","start":1340.29,"end":1342.39},{"id":220,"text":"and that paper pro- is the first paper to along this line.","zh":"而这篇论文是沿着这个方向发表的第一篇论文。","start":1342.51,"end":1345.47},{"id":221,"text":"And then, uh, later on people say,","zh":"然后，后来人们说，","start":1345.79,"end":1347.77},{"id":222,"text":"oh, this is too aggressive,","zh":"哦，这个方法太激进了，","start":1347.85,"end":1348.85},{"id":223,"text":"like you have to actually do have some number of keys,","zh":"比如你实际上需要有一些数量的键，","start":1349.03,"end":1351.55},{"id":224,"text":"and, uh, uh, uh, don't be that aggressive to have only one key.","zh":"而且，呃，呃，呃，不要那么激进地只使用一个键。","start":1351.69,"end":1355.33},{"id":225,"text":"So, that's why they start to use bigger NG.","zh":"因此，他们开始使用更大的 NG。","start":1355.47,"end":1358.05},{"id":226,"text":"I actually, I don't know off the top of my head how big the NG is,","zh":"我实际上不知道，凭记忆，NG有多大。","start":1358.27,"end":1361.53},{"id":227,"text":"This may be like 100 or something, maybe.","zh":"这可能像100或者别的什么，也许。","start":1361.53,"end":1362.83},{"id":228,"text":"Actually, I don't know exactly,","zh":"实际上，我并不确切知道，","start":1363.49,"end":1364.49},{"id":229,"text":"we need to check the code.","zh":"我们需要检查代码。","start":1364.51,"end":1365.99},{"id":230,"text":"The way we're defining which queue goes","zh":"我们定义哪个队列进入案件的哪个层级的方式，","start":1367.27,"end":1369.93},{"id":231,"text":"to which level of the case is kind of more the terms","zh":"某种程度上更偏向于术语","start":1369.93,"end":1373.07},{"id":232,"text":"that like the lesson at the first,","zh":"比如第一课的内容，","start":1373.07,"end":1374.63},{"id":233,"text":"how do the queues go to the next one?","zh":"队列是如何进入下一个层级的？","start":1374.77,"end":1378.57},{"id":234,"text":"Is that like ground loss, or like is there any meaning","zh":"这像是地面损失，还是有其他含义？","start":1379.11,"end":1382.17},{"id":235,"text":"to the order of the case, or?","zh":"至于顺序，或者问的是这个顺序吗？","start":1382.17,"end":1386.25},{"id":236,"text":"The order doesn't really matter because,","zh":"顺序其实并不重要，因为","start":1386.49,"end":1388.61},{"id":237,"text":"anyway, all of these are learned.","zh":"无论如何，所有这些都是通过学习得到的。","start":1388.63,"end":1390.17},{"id":238,"text":"right? So whatever order you do, I guess they're kind of like a topological equivalent to each","zh":"对吧？所以无论你以什么顺序进行，我想它们在拓扑上是等价的，","start":1390.17,"end":1397.85},{"id":239,"text":"other because anyway, these keys are not something you design yourself. You actually have to learn","zh":"因为无论如何，这些键并不是你自己设计的。你实际上必须学习到正确的键，对吧？","start":1397.85,"end":1402.53},{"id":240,"text":"the right keys, right? Suppose I permute this dependency thing, then the learning,","zh":"假设我重新排列这个依赖关系，那么学习过程，","start":1402.53,"end":1407.17}],"notes":["本段讨论了注意力机制中键（keys）和值（values）的存储问题，以及参数tau（tau）的作用。tau被用来控制存储的键值对数量，当tau较大时，存储的键值对数量减少，从而降低内存成本。但这也可能导致信息丢失，因为存储的信息量减少。"],"formulas":[],"uncertainties":["NG的具体含义不明确，可能是键的数量（number of keys）或其他术语。","tau的定义和使用方式在片段中没有明确说明，可能需要进一步澄清。","队列（queues）和案例（case）的定义不明确，可能需要更多上下文。","ground loss的含义不明确，可能是某种损失函数或术语的误听。"],"diagram":"none","start":1233.19,"end":1407.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":1233.19,"text":"and different set of cores are kinda attached to the same set of keys. Yes, so basically you have so many different keys here. The value of, where is tau? Oh, tau is here. This is just a parameter, I think. So, you know, you can, there are three numbers here, right, so."},{"start":1270.79,"text":"I guess you just, you know, you have to respect this equation. Other than that, you just choose something that works empirically. Of course, you know, if you make tau too big, so for example, tau can be equal to nh. Then you just have only one set of cores, sorry, one set of keys and values, then you have the smallest possible memory cost."},{"start":1293.32,"text":"But the problem is that you store too little in some sense. If you just only have one set of keys, then maybe you don't have enough information stored so that you lose some of the information of the past. Because in some sense, how much you store depends a little bit on..."},{"start":1308.92,"text":"like the storage is needed in some sense because the memory is needed because you have to remember what happened in the history, right? It's more like how much you have to remember is something you need to kind of tune in some sense. So I think actually this is a good question in the sense that I think if you choose tau to be the same as NH,"},{"start":1331.61,"text":"So, the NG is one."},{"start":1333.41,"text":"I think this is called multi-query attention."},{"start":1336.85,"text":"Um, so, so, so, you know,"},{"start":1338.71,"text":"so, so basically the history is that,"},{"start":1340.29,"text":"and there was one paper that actually choose this,"},{"start":1342.51,"text":"and that paper pro- is the first paper to along this line."},{"start":1345.79,"text":"And then, uh, later on people say,"},{"start":1347.85,"text":"oh, this is too aggressive,"},{"start":1349.03,"text":"like you have to actually do have some number of keys,"},{"start":1351.69,"text":"and, uh, uh, uh, don't be that aggressive to have only one key."},{"start":1355.47,"text":"So, that's why they start to use bigger NG."},{"start":1358.27,"text":"I actually, I don't know off the top of my head how big the NG is,"},{"start":1361.53,"text":"This may be like 100 or something, maybe."},{"start":1363.49,"text":"Actually, I don't know exactly,"},{"start":1364.51,"text":"we need to check the code."},{"start":1367.27,"text":"The way we're defining which queue goes"},{"start":1369.93,"text":"to which level of the case is kind of more the terms"},{"start":1373.07,"text":"that like the lesson at the first,"},{"start":1374.77,"text":"how do the queues go to the next one?"},{"start":1379.11,"text":"Is that like ground loss, or like is there any meaning"},{"start":1382.17,"text":"to the order of the case, or?"},{"start":1386.49,"text":"The order doesn't really matter because,"},{"start":1388.63,"text":"anyway, all of these are learned."},{"start":1390.17,"text":"right? So whatever order you do, I guess they're kind of like a topological equivalent to each"},{"start":1397.85,"text":"other because anyway, these keys are not something you design yourself. You actually have to learn"},{"start":1402.53,"text":"the right keys, right? Suppose I permute this dependency thing, then the learning,"}],"speech_gaps":[],"frame":"../frames/v044/008.webp","frame_time":1245.19},{"title":"注意力机制与GPU并行化策略","segments":[{"id":241,"text":"the training code will permute that as well to accommodate. So of course, you can ask whether","zh":"训练代码也会对其进行排列以适应。因此，当然，你可以问是否","start":1407.35,"end":1413.97},{"id":242,"text":"whether you should do something like two cores matched to,","zh":"是否应该做像两个核心与","start":1413.97,"end":1416.95},{"id":243,"text":"like three cores matched to two keys,","zh":"比如三个核心与两个键匹配，","start":1417.97,"end":1419.69},{"id":244,"text":"do you have to make it like a tree structure,","zh":"你是否必须将其构造成树状结构，","start":1419.75,"end":1422.05},{"id":245,"text":"like a one key for many, many,","zh":"比如一个键对应许多，许多，","start":1422.23,"end":1423.53},{"id":246,"text":"is that like a one key for many cores,","zh":"是否是像一个键对应多个核心，","start":1423.53,"end":1425.53},{"id":247,"text":"or like it could be like one core also get to two keys?","zh":"还是像一个核心也可以对应两个键？","start":1425.71,"end":1431.65},{"id":248,"text":"I don't think people have tried that yet.","zh":"我认为人们还没有尝试过这种做法。","start":1432.21,"end":1434.17},{"id":249,"text":"And another thing is that this structure,","zh":"还有另一件事是，这种结构，","start":1434.49,"end":1437.53},{"id":250,"text":"to some degree, cannot be too dynamic","zh":"在某种程度上，不能太动态","start":1438.37,"end":1440.41},{"id":251,"text":"because you have to, in some sense,","zh":"因为你必须，从某种意义上说，","start":1441.53,"end":1443.25},{"id":252,"text":"you have to hard-code it on the GPU so that you can really run it very, very fast.","zh":"你必须在GPU上硬编码它，这样才能真正非常快速地运行。","start":1443.25,"end":1446.41},{"id":253,"text":"Right? So, you have to exactly know which one you compute in some sense,","zh":"对吧？所以，你必须确切知道你要计算的是哪一个，从某种意义上说，","start":1446.85,"end":1450.03},{"id":254,"text":"so that, um, um, you know,","zh":"所以，嗯，嗯，你知道，","start":1450.17,"end":1452.97},{"id":255,"text":"you can compile it so that you can run on GPU.","zh":"你可以编译它，以便在GPU上运行。","start":1452.97,"end":1455.27},{"id":256,"text":"So, um, so I think empirical actually people just really do literally what I'm doing here,","zh":"所以，嗯，所以我想实际上人们只是真的像我在这里所做的那样去做。","start":1455.43,"end":1460.01},{"id":257,"text":"like so that actually you'll also have some locality stuff,","zh":"比如，实际上你也会有一些局部性的问题，","start":1460.07,"end":1462.81},{"id":258,"text":"like for example, you probably should put this kind of things closer to this in some sense.","zh":"比如，你可能应该在某种意义上把这类东西放得更靠近这里。","start":1462.95,"end":1466.65},{"id":259,"text":"Um, so, um, uh, and also empirically,","zh":"嗯，所以，嗯，呃，还有实证上，","start":1466.83,"end":1470.89},{"id":260,"text":"I guess you actually could, very likely you could, depending on the situations,","zh":"我想你实际上可以，很可能可以，这取决于具体情况，","start":1470.89,"end":1477.23},{"id":261,"text":"you could put this key and the corresponding queries into one GPU card,","zh":"你可以把这种键和对应的查询放在同一块GPU卡上，","start":1477.45,"end":1482.03},{"id":262,"text":"and then this key with the corresponding other queries into another GPU card,","zh":"然后把这种键和对应的其他查询放在另一块GPU卡上，","start":1482.65,"end":1486.03},{"id":263,"text":"so they can reduce the communication, all of those.","zh":"这样可以减少所有的通信量。","start":1486.19,"end":1488.13},{"id":264,"text":"I don't know about the last lecture, but I was a little bit confused on the queries and the keys.","zh":"我不确定上一节课的内容，但我在查询和键方面有点困惑。","start":1490.91,"end":1496.33},{"id":265,"text":"In Twitter, it seems like what they're doing is trying to figure out if I have a current word, how related is it to another word?","zh":"在推特上，看起来他们是在试图弄清楚，如果我有一个当前的词，它与另一个词的相关性如何？","start":1496.77,"end":1503.89},{"id":266,"text":"So would that mean that the Q and the K, they're both morally dependent on their own word and not really on the other words?","zh":"这意味着Q和K是否都只依赖于它们自己的词，而不是其他词？","start":1504.13,"end":1512.65},{"id":267,"text":"I think that's, you know,","zh":"我想这可能是，你明白的，","start":1515.23,"end":1517.47},{"id":268,"text":"I think on the word level it's probably too granular.","zh":"我认为在词的层面，可能过于细致了。","start":1517.47,"end":1519.75},{"id":269,"text":"I think, you know,","zh":"我想，你明白的，","start":1519.83,"end":1521.81},{"id":270,"text":"at least it depends on the nearby words as well.","zh":"至少它也依赖于附近的词。","start":1523.69,"end":1526.85},{"id":271,"text":"But the intuition doesn't, you know,","zh":"但这种直觉并不，你明白的，","start":1528.27,"end":1530.11},{"id":272,"text":"I know it's kind of like intuition.","zh":"我知道这有点像直觉。","start":1530.69,"end":1531.99},{"id":273,"text":"I think it's about right, yeah.","zh":"我认为这大概是正确的，对吧。","start":1532.07,"end":1533.93},{"id":274,"text":"Any other questions?","zh":"还有其他问题吗？","start":1539.79,"end":1540.71},{"id":275,"text":"Okay. So now,","zh":"好的。现在，","start":1558.45,"end":1559.85},{"id":276,"text":"let's talk about another variant of attention,","zh":"让我们谈谈注意力机制的另一种变体，","start":1560.47,"end":1563.09},{"id":277,"text":"which is trying to deal with a different type of issues.","zh":"它试图处理不同类型的问题。","start":1563.43,"end":1566.21},{"id":278,"text":"Sorry, I need to cut. Okay. I don't need it.","zh":"抱歉，我需要剪掉。好的。我不需要它。","start":1567.83,"end":1570.91},{"id":279,"text":"So another variant is so-called sliding window attention.","zh":"另一种变体被称为滑动窗口注意力。","start":1570.91,"end":1577.13},{"id":280,"text":"So this is for a different issue with attention,","zh":"这是针对注意力机制的不同问题而设计的。","start":1578.31,"end":1581.41},{"id":281,"text":"also with some system perspective in mind.","zh":"也考虑到一些系统视角。","start":1581.69,"end":1584.41}],"notes":["本段讨论了注意力机制中键（key）和查询（query）的分配策略，以及如何在GPU上进行并行化处理。讲者提到，是否需要将多个核心与键进行匹配，或者是否需要构建树状结构，以实现更高效的计算。同时，讲者指出，这种结构不能过于动态，因为需要在GPU上硬编码，以便实现高速运行。","讲者进一步说明，为了实现高效的并行计算，需要明确知道哪些计算步骤需要执行，以便进行编译和优化。此外，讲者提到，实际应用中人们通常会将键和查询分配到不同的GPU卡上，以减少通信开销。","讲者还提到，对于注意力机制中的查询和键，可能存在一些混淆。例如，在Twitter等应用中，查询和键可能依赖于当前词与另一个词的相关性，而不是其他词。但讲者认为，在词级别上过于细化可能不太合适，因为还需要考虑附近词的影响。","讲者指出，这种依赖关系可能更多是基于直觉，而不是严格的数学定义。因此，对于注意力机制的具体实现细节，还需要进一步的实验和验证。","最后，讲者提到，注意力机制还有其他变种，如滑动窗口注意力，用于处理不同的问题，并从系统角度进行优化。"],"formulas":[],"uncertainties":["one core also get to two keys"],"diagram":"none","start":1407.35,"end":1584.41,"asr_flags":[264,265,266],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":1407.35,"text":"the training code will permute that as well to accommodate. So of course, you can ask whether"},{"start":1413.97,"text":"whether you should do something like two cores matched to,"},{"start":1417.97,"text":"like three cores matched to two keys,"},{"start":1419.75,"text":"do you have to make it like a tree structure,"},{"start":1422.23,"text":"like a one key for many, many,"},{"start":1423.53,"text":"is that like a one key for many cores,"},{"start":1425.71,"text":"or like it could be like one cores also get to two keys?"},{"start":1432.21,"text":"I don't think people have tried that yet."},{"start":1434.49,"text":"And another thing is that this structure,"},{"start":1438.37,"text":"to some degree, cannot be too dynamic"},{"start":1441.53,"text":"because you have to, in some sense,"},{"start":1443.25,"text":"you have to hard-code it on the GPU so that you can really run it very, very fast."},{"start":1446.85,"text":"Right? So, you have to exactly know which one you compute in some sense,"},{"start":1450.17,"text":"so that, um, um, you know,"},{"start":1452.97,"text":"you can compile it so that you can run on GPU."},{"start":1455.43,"text":"So, um, so I think empirical actually people just really do literally what I'm doing here,"},{"start":1460.07,"text":"like so that actually you'll also have some locality stuff,"},{"start":1462.95,"text":"like for example, you probably should put this kind of things closer to this in some sense."},{"start":1466.83,"text":"Um, so, um, uh, and also empirically,"},{"start":1470.89,"text":"I guess you actually could, very likely you could, depending on the situations,"},{"start":1477.45,"text":"you could put this key and the corresponding queries into one GPU card,"},{"start":1482.65,"text":"and then this key with the corresponding other queries into another GPU card,"},{"start":1486.19,"text":"so they can reduce the communication, all of those."},{"start":1490.91,"text":"I don't know about the last lecture, but I was a little bit confused on the queries and the keys."},{"start":1496.77,"text":"In Twitter, it seems like what they're doing is trying to figure out if I have a current word, how related is it to another word?"},{"start":1504.13,"text":"So would that mean that the Q and the K, they're both morally dependent on their own word and not really on the other words?"},{"start":1515.23,"text":"I think that's, you know,"},{"start":1517.47,"text":"I think on the word level it's probably too granular."},{"start":1519.83,"text":"I think, you know,"},{"start":1523.69,"text":"at least it depends on the nearby words as well."},{"start":1528.27,"text":"But the intuition doesn't, you know,"},{"start":1530.69,"text":"I know it's kind of like intuition."},{"start":1532.07,"text":"I think it's about right, yeah."},{"start":1539.79,"text":"Any other questions?"},{"start":1558.45,"text":"Okay. So now,"},{"start":1560.47,"text":"let's talk about another variant of attention,"},{"start":1563.43,"text":"which is trying to deal with a different type of issues."},{"start":1567.83,"text":"Sorry, I need to cut. Okay. I don't need it."},{"start":1570.91,"text":"So another variant is so-called sliding window attention."},{"start":1578.31,"text":"So this is for a different issue with attention,"},{"start":1581.69,"text":"also with some system perspective in mind."}],"speech_gaps":[],"frame":"../frames/v044/009.webp","frame_time":1419.35},{"title":"注意力机制中的计算复杂度与滑动窗口","segments":[{"id":282,"text":"If you think about this, we talk about the memory a lot. But if you think about the compute, it's also an issue because you have to compute this pairwise inner product between t and t sequence of vectors. So that's t squared computation. And when t is big, that is quadratic, and you can really get into trouble. For example, if t is a million, then a million squared is really a big number. So you have to find some ways to make it not.","zh":"如果你仔细想想，我们经常谈论记忆。但如果你考虑计算的话，这也是一个问题，因为你必须计算这个序列中t个向量之间的成对内积。因此，这需要t平方的计算量。当t很大时，这就是二次的，你真的会遇到麻烦。例如，如果t是一百万，那么一百万的平方就是一个非常大的数字。因此，你必须找到一些方法来避免这种情况。","start":1586.41,"end":1612.21},{"id":283,"text":"quadratic dependencies. We don't know exactly how the frontier labs are doing this, but at least one way people have done in the open source community is that you just don't compute all of these attentions. What you do is you just say, you have a sliding window so that you only have to attend to some amount like a sum.","zh":"二次依赖关系。我们不知道前沿实验室是如何做到这一点的，但至少有一种方法在开源社区中被采用，那就是你并不计算所有的注意力。你所做的就是，你使用一个滑动窗口，使得你只需要关注一定数量的总和。","start":1612.81,"end":1635.51},{"id":284,"text":"recent history. So, suppose you have q1 up to qt, and if you have k1 up to kt, and you say qt only attends to the last w positions. So, and w is the window size. And then qt minus 1 attends to this one, and, you know,","zh":"最近的历史。因此，假设你有q1到qt，如果你有k1到kt，并且你说qt只关注最后w个位置。因此，w是窗口大小。然后qt-1也关注这个位置，你知道的，","start":1636.29,"end":1660.86},{"id":285,"text":"attend to the last w as well, and qt minus two attends to the last w. So basically there's a sliding window that depends on where your query is at. And you can see the limitation here is that your attention is very limited to only the recent tokens. Of course, it's not like these recent tokens just only about, sorry, it's not exactly true that the, let's say this is like a kt minus w, right? So it's not exactly true that","zh":"也关注最后w个位置，而qt-2也关注最后w个位置。基本上，有一个滑动窗口，它取决于你的查询位置。你可以看到这里的限制是，你的注意力非常局限于最近的标记。当然，这并不意味着这些最近的标记只与最近的标记有关，抱歉，这并不是完全正确的说法，比如说，这类似于一个kt-w，对吧？因此，这些w个位置并不完全只与最后的w个标记有关。","start":1661.62,"end":1690.82},{"id":286,"text":"these W positions are only about the last W tokens. That's not entirely true, because this key also depends on what happens in the layer below. And the layer below can attend to even earlier tokens, and the layer below can attend to even earlier tokens. So if you think about there are multiple layers, then if this is the top layer, then the top layer attends to the last W positions, and then this key depends on","zh":"这些w个位置并不完全只与最后的w个标记有关。这并不完全正确，因为这个键还取决于下一层发生的事情。而下一层可以关注更早的标记，下一层也可以关注更早的标记。因此，如果你考虑有多个层，那么如果这是顶层，顶层关注最后的w个位置，而这个键最终取决于","start":1691.39,"end":1720.55},{"id":287,"text":"This key eventually depends on some hidden vectors, which we discussed. It's a projection matrix of the hidden vectors. And that hidden vector probably depends on the previous W, will depend on previous W tokens in the layer below. And then you have this kind of dependencies like this. So basically, depending on how many layers you have, you can look back in theory for quite a...","zh":"这个键最终取决于一些隐藏向量，我们已经讨论过。它是一个隐藏向量的投影矩阵。而这个隐藏向量可能取决于下一层的前w个标记，然后你有这种依赖关系。因此，基本上，根据你有多少层，理论上你可以回溯相当多的标记。","start":1720.94,"end":1742.72}],"notes":["本段讨论了注意力机制中的计算复杂度问题，特别是当序列长度t很大时，计算所有注意力权重会导致O(t²)的复杂度，这在实际应用中可能带来严重问题。例如，当t为一百万时，计算量会变得非常巨大，因此需要寻找优化方法。","为了减少计算量，一种常见的方法是使用滑动窗口机制，即每个查询只关注最近的w个位置，而不是整个序列。这种方法可以显著降低计算复杂度，但同时也限制了注意力的范围。","滑动窗口的大小w决定了注意力机制能够关注的历史长度。例如，如果当前查询是qt，它只关注最近的w个位置，而qt-1也会关注最近的w个位置，以此类推。这种机制使得注意力机制在处理长序列时更加高效。","然而，这种滑动窗口机制也存在局限性，因为它只能关注最近的token，而无法捕捉更早的信息。不过，这种限制可以通过多层结构来缓解，因为下一层可能关注更早的token，从而形成一种层次化的依赖关系。","在多层结构中，每一层的注意力机制都依赖于下一层的隐藏向量，而这些隐藏向量又可能依赖于更早的token。因此，通过多层结构，可以实现对更长历史信息的捕捉，尽管这种捕捉是有限的。","最后，本段提到，随着层数的增加，理论上可以回溯更长的历史信息，但实际效果取决于具体的模型设计和参数设置。这种依赖关系在注意力机制中是关键的，因为它影响了模型对序列信息的处理能力。"],"formulas":[],"uncertainties":[],"diagram":"attention","start":1586.41,"end":1742.72,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1586.41,"text":"If you think about this, we talk about the memory a lot. But if you think about the compute, it's also an issue because you have to compute this pairwise inner product between t and t sequence of vectors. So that's t squared computation. And when t is big, that is quadratic, and you can really get into trouble. For example, if t is a million, then a million squared is really a big number. So you have to find some ways to make it not."},{"start":1612.81,"text":"quadratic dependencies. We don't know exactly how the frontier labs are doing this, but at least one way people have done in the open source community is that you just don't compute all of these attentions. What you do is you just say, you have a sliding window so that you only have to attend to some amount like a sum."},{"start":1636.29,"text":"recent history. So, suppose you have q1 up to qt, and if you have k1 up to kt, and you say qt only attends to the last w positions. So, and w is the window size. And then qt minus 1 attends to this one, and, you know,"},{"start":1661.62,"text":"attend to the last w as well, and qt minus two attends to the last w. So basically there's a sliding window that depends on where your query is at. And you can see the limitation here is that your attention is very limited to only the recent tokens. Of course, it's not like these recent tokens just only about, sorry, it's not exactly true that the, let's say this is like a kt minus w, right? So it's not exactly true that"},{"start":1691.39,"text":"these W positions are only about the last W tokens. That's not entirely true, because this key also depends on what happens in the layer below. And the layer below can attend to even earlier tokens, and the layer below can attend to even earlier tokens. So if you think about there are multiple layers, then if this is the top layer, then the top layer attends to the last W positions, and then this key depends on"},{"start":1720.94,"text":"This key eventually depends on some hidden vectors, which we discussed. It's a projection matrix of the hidden vectors. And that hidden vector probably depends on the previous W, will depend on previous W tokens in the layer below. And then you have this kind of dependencies like this. So basically, depending on how many layers you have, you can look back in theory for quite a..."}],"speech_gaps":[],"frame":"../frames/v044/010.webp","frame_time":1598.41},{"title":"注意力机制与稀疏注意力的局限性","segments":[{"id":288,"text":"a number of tokens. So let's say suppose you have IO layers, then you can look back for IO times W tokens, and that's the limit. After that, you have no dependencies on the previous tokens. So that's the limitation. You can at most look back for IO times W tokens, and in some sense, you're going to forget about some of the past if the T is big enough. So that's an issue.","zh":"许多标记。所以，假设你有IO层，那么你可以回溯IO乘以W个标记，这就是限制。在此之后，你不再依赖于之前的标记。因此这就是局限性。你最多只能回溯IO乘以W个标记，在某种意义上，如果T足够大，你就会忘记一些过去的信息。因此这是一个问题。","start":1743.24,"end":1769.76},{"id":289,"text":"are doing this then you can save the compute because it's no longer T by T attention, it's going to be T by W because each of the cores only have to attend to W vectors. So it's T by W and it's linear in T as opposed to quadratic in T. Yeah, but I don't think this is the only.","zh":"如果你这样做，你就可以节省计算资源，因为它不再是T乘以T的注意力，而是T乘以W，因为每个核心只需要关注W个向量。因此是T乘以W，其复杂度是线性的，而不是二次的。是的，但我不认为这是唯一的解决方案。","start":1770.99,"end":1790.97},{"id":290,"text":"You cannot just do only this. If you only do this, you're going to have some issues with the forgetting of the long context. Eventually, you're going to forget about the past. And there are many papers that discuss how to have other ways of this sparse attention that don't forget about the past. We don't exactly know which one is the best yet. And I think in the lecture notes, I did set some papers. If you are interested, you can read them.","zh":"你不能只这样做。如果你只这样做，你就会在遗忘长上下文方面遇到一些问题。最终，你会忘记过去的信息。有许多论文讨论如何通过其他方式实现这种稀疏注意力，而不会忘记过去的信息。我们还不确定哪种方法是最好的。我认为在讲义中，我提到了一些论文。如果你感兴趣，可以阅读它们。","start":1791.47,"end":1820.45},{"id":291,"text":"Okay, and maybe one more small component, just, you know, there are many, many more details here I can discuss, you know, just in the interest of time, I can only select a few that I feel somewhat interesting. So another small detail here is relating to this thing that I talk about, about the C, the normalization. So here,","zh":"好的，也许还有一个小细节，就是，你知道的，这里有很多、很多细节可以讨论，但为了节省时间，我只能选择一些我觉得比较有趣的内容。另一个小细节与我之前提到的C，即归一化有关。在这里，","start":1821.82,"end":1840.02},{"id":292,"text":"If you think about it, so this assumption that each of the AIs are all of one is not quite guaranteed because if you tune it, then eventually sometimes maybe A and B becomes bigger or smaller. So one way people do is that people actually normalize this A before taking inner product as well. So for example, you can say as opposed to taking, so before you are taking Qj times,","zh":"如果你仔细想想，这个假设，即每个AI都是单一的，是不能完全保证的，因为如果你进行调整，有时A和B可能会变得更大或更小。因此，人们通常的做法是在进行内积之前对A进行归一化。例如，你可以这样说，与之前取Qj乘以kT转置不同，你可以先对Q和J进行归一化。你可以这样说，你可以对Q和J进行RMS归一化，或者对kT进行某种归一化。","start":1841.05,"end":1868.65},{"id":293,"text":"say kT transpose, right? Divide by C. What you can do is you can also normalize Q and J before that. You can say you can do RMS norm of Q, J times, you know, some normalization of kT.","zh":"你可以说，在进行Qj乘以kT转置之前，对Q和J进行归一化。你可以对Q和J进行RMS归一化，或者对kT进行某种归一化。","start":1869.92,"end":1890.51},{"id":294,"text":"transpose divided by C. So that before you go into this inner product, you are somewhat normalized, and then you can stay on the same scale for most of the cases. Again, this is a heuristic, but people do use this in some of the open source models. Okay, so the next part about architecture is mixture of experts, which, but before that, any other questions? Yeah. Yes. Yeah.","zh":"转置除以C。因此，在进行内积之前，你已经进行了一定程度的归一化，这样在大多数情况下，你可以在同一尺度上进行计算。再次强调，这只是一个启发式方法，但人们在一些开源模型中确实会使用这种方法。好的，接下来关于架构的部分是专家混合，不过在那之前，还有其他问题吗？是的。是的。是的。","start":1891.22,"end":1922.33}],"notes":["本段讨论了注意力机制中稀疏注意力的局限性，即模型在处理长序列时可能会遗忘过去的信息。讲者指出，当序列长度T足够大时，模型无法记住所有历史信息，因此需要引入其他方法来避免遗忘。"],"formulas":[],"uncertainties":["IO layers","AIs are all of one","RMS norm of Q, J times, you know, some normalization of kT"],"diagram":"none","start":1743.24,"end":1922.33,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1743.24,"text":"a number of tokens. So let's say suppose you have IO layers, then you can look back for IO times W tokens, and that's the limit. After that, you have no dependencies on the previous tokens. So that's the limitation. You can at most look back for IO times W tokens, and in some sense, you're going to forget about some of the past if the T is big enough. So that's an issue."},{"start":1770.99,"text":"are doing this then you can save the compute because it's no longer T by T attention, it's going to be T by W because each of the cores only have to attend to W vectors. So it's T by W and it's linear in T as opposed to quadratic in T. Yeah, but I don't think this is the only."},{"start":1791.47,"text":"You cannot just do only this. If you only do this, you're going to have some issues with the forgetting of the long context. Eventually, you're going to forget about the past. And there are many papers that discuss how to have other ways of this sparse attention that don't forget about the past. We don't exactly know which one is the best yet. And I think in the lecture notes, I did set some papers. If you are interested, you can read them."},{"start":1821.82,"text":"Okay, and maybe one more small component, just, you know, there are many, many more details here I can discuss, you know, just in the interest of time, I can only select a few that I feel somewhat interesting. So another small detail here is relating to this thing that I talk about, about the C, the normalization. So here,"},{"start":1841.05,"text":"If you think about it, so this assumption that each of the AIs are all of one is not quite guaranteed because if you tune it, then eventually sometimes maybe A and B becomes bigger or smaller. So one way people do is that people actually normalize this A before taking inner product as well. So for example, you can say as opposed to taking, so before you are taking Qj times,"},{"start":1869.92,"text":"say kT transpose, right? Divide by C. What you can do is you can also normalize Q and J before that. You can say you can do RMS norm of Q, J times, you know, some normalization of kT."},{"start":1891.22,"text":"transpose divided by C. So that before you go into this inner product, you are somewhat normalized, and then you can stay on the same scale for most of the cases. Again, this is a heuristic, but people do use this in some of the open source models. Okay, so the next part about architecture is mixture of experts, which, but before that, any other questions? Yeah. Yes. Yeah."}],"speech_gaps":[],"frame":"../frames/v044/011.webp","frame_time":1755.24},{"title":"Transformer架构中的注意力机制与MLP部分","segments":[{"id":295,"text":"T and W, yes. But W is often much smaller than T. It's kind of like a constant to some degree. It's not exactly right, but so basically your computation is T times W now as opposed to versus T squared before. And W is a small number often. The length of the window you choose in this option is a new parameter you choose. And you choose the window to be, for example, 1,000 tokens, then no matter how large T is, you pay T times 1,000.","zh":"T和W，是的。但W通常比T小得多。它在某种程度上像一个常数。这并不是完全正确，但基本上你的计算现在是T乘以W，而不是之前T的平方。而W通常是一个小数字。你在这种选项中选择的窗口长度是一个你选择的新参数。例如，如果你选择窗口为1,000个标记，那么无论T有多大，你都要支付T乘以1,000的计算量。","start":1925.94,"end":1956.29},{"id":296,"text":"Any other questions? Great. So these are all about attentions. There's another part which we discussed, but we didn't discuss in detail, which is the MLP, the fully connected networks part. I recall that transformer is actually a combination of attentions.","zh":"还有其他问题吗？很好。这些都是关于注意力机制的内容。我们还讨论了另一个部分，但没有详细讨论，那就是MLP（全连接网络）部分。我记得Transformer实际上是由注意力机制组成的。","start":1959.02,"end":1981.73},{"id":297,"text":"and some MLP, multilayer perception, which is the same thing as fully connecting artworks. I guess MLP is the same as FFN. It's just that they are inter-exchangeable. You have this independent MLPs, and then you do attentions. This is the general architecture of the transformer. So now let's talk about MLP part.","zh":"以及一些MLP（多层感知机），它与全连接网络是同一个概念。我想MLP和FFN是一样的。它们只是可以互换使用的。你有独立的MLP，然后进行注意力计算。这就是Transformer的一般架构。现在让我们谈谈MLP部分。","start":1982.96,"end":2006.77},{"id":298,"text":"So, for the MLP part, you could also try to scale it. So, the MLP, as we know, you have some kind of application, right? So, if you just scale the dimension,","zh":"因此，在MLP部分，你也可以尝试进行扩展。正如我们所知道的，你有一些应用，对吧？所以，如果你只是扩展维度，","start":2007.78,"end":2020.6},{"id":299,"text":"it's fun, but you're just going to increase your compute time and your memory time.","zh":"这很有趣，但你只会增加计算时间和内存使用时间。","start":2024.57,"end":2031.99},{"id":300,"text":"you have a D by D matrix and if you'd say you double it,","zh":"你有一个D乘D的矩阵，如果你说你将其翻倍，","start":2032.19,"end":2035.35},{"id":301,"text":"you're going to make your compute 4x and you're going to make your memory 2x.","zh":"你的计算量会增加四倍，而你的内存使用量会增加两倍。","start":2035.45,"end":2038.79},{"id":302,"text":"So, and that's one of the ways to scale.","zh":"因此，这就是一种扩展方式。","start":2039.93,"end":2042.09},{"id":303,"text":"However, I think what people found out is that you can actually scale","zh":"然而，我认为人们发现的是，实际上你可以以一种更类似于并行的方式进行扩展。","start":2043.23,"end":2047.83},{"id":304,"text":"in a more kind of like parallel way in some cases.","zh":"所以在某些情况下，你可以以一种更类似于并行的方式进行扩展。","start":2047.83,"end":2051.39},{"id":305,"text":"So the idea is that instead of computing a big gigantic matrix so you can, the","zh":"所以这个想法是，而不是计算一个巨大的矩阵，你可以在其中，","start":2051.39,"end":2057.69},{"id":306,"text":"default is to have some vector v and you multiply a big matrix, a d by d matrix,","zh":"默认的做法是拥有一个向量 v，并将其乘以一个大矩阵，一个 d by d 的矩阵，","start":2057.69,"end":2061.53},{"id":307,"text":"and you output a vector v, or maybe you output a vector o. And for this","zh":"然后输出一个向量 v，或者也许输出一个向量 o。而对于这种专家混合的想法，你所做的就是你说你不这样做，但你实际上","start":2061.81,"end":2071.71},{"id":308,"text":"mix of expert ideas, what you do is you say you don't do this, but you actually","zh":"你有一个输入 V，并且你决定你拥有一系列所谓的专家，E1, E2，依此类推，","start":2071.71,"end":2075.93},{"id":309,"text":"you have input V, and you decide you have a bunch of so-called experts, E1, E2, so on and so forth,","zh":"你有一个输入V，并且你决定你拥有一系列所谓的专家，E1、E2，依此类推。","start":2075.93,"end":2085.25},{"id":310,"text":"say EK. And you decide which subnetworks you send to, and then each of these EI is MLP.","zh":"比如说EK。然后你决定将哪些子网络发送到这些专家那里，而每个这些EI都是MLP。","start":2086.01,"end":2094.15},{"id":311,"text":"And then you aggregate. Actually, the aggregation is just some average. You get a vector,","zh":"然后你进行聚合。实际上，聚合只是某种平均。你会得到一个向量，","start":2095.09,"end":2102.09},{"id":312,"text":"you get the output.","zh":"你会得到输出。","start":2102.09,"end":2102.83}],"notes":["本段主要讲解了在Transformer架构中，注意力机制和MLP部分的结构。讲者提到，W通常比T小得多，因此计算复杂度从T²降低到T×W，这在处理长序列时尤为重要。此外，讲者还提到，MLP部分可以通过调整参数进行扩展，例如通过增加矩阵的维度来提升模型能力，但会带来计算和内存的开销。"],"formulas":[],"uncertainties":["artworks","mix of expert ideas","the aggregation is just some average","you get a vector, you get the output"],"diagram":"none","start":1925.94,"end":2102.83,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":1925.94,"text":"T and W, yes. But W is often much smaller than T. It's kind of like a constant to some degree. It's not exactly right, but so basically your computation is T times W now as opposed to versus T squared before. And W is a small number often. The length of the window you choose in this option is a new parameter you choose. And you choose the window to be, for example, 1,000 tokens, then no matter how large T is, you pay T times 1,000."},{"start":1959.02,"text":"Any other questions? Great. So these are all about attentions. There's another part which we discussed, but we didn't discuss in detail, which is the MLP, the fully connected networks part. I recall that transformer is actually a combination of attentions."},{"start":1982.96,"text":"and some MLP, multilayer perception, which is the same thing as fully connecting artworks. I guess MLP is the same as FFN. It's just that they are inter-exchangeable. You have this independent MLPs, and then you do attentions. This is the general architecture of the transformer. So now let's talk about MLP part."},{"start":2007.78,"text":"So, for the MLP part, you could also try to scale it. So, the MLP, as we know, you have some kind of application, right? So, if you just scale the dimension,"},{"start":2024.57,"text":"it's fun, but you're just going to increase your compute time and your memory time."},{"start":2032.19,"text":"So suppose you have a D by D matrix and if you'd say you double it,"},{"start":2035.45,"text":"you're going to make your compute 4x and you're going to
