make your memory 2x."},{"start":2039.93,"text":"So, and that's one of the ways to scale."},{"start":2043.23,"text":"However, I think what people found out is that you can actually scale"},{"start":2047.83,"text":"in a more kind of like parallel way in some cases."},{"start":2051.39,"text":"So the idea is that instead of computing a big gigantic matrix so you can, the"},{"start":2057.69,"text":"default is to have some vector v and you multiply a big matrix, a d by d matrix,"},{"start":2061.81,"text":"and you output a vector v, or maybe you output a vector o. And for this"},{"start":2071.71,"text":"mix of expert ideas, what you do is you say you don't do this, but you actually"},{"start":2075.93,"text":"you have input V, and you decide you have a bunch of so-called experts, E1, E2, so on and so forth,"},{"start":2086.01,"text":"say EK. And you decide which subnetworks you send to, and then each of these EI is MLP."},{"start":2095.09,"text":"And then you aggregate. Actually, the aggregation is just some average. You get a vector,"},{"start":2102.09,"text":"you get the output."}],"speech_gaps":[{"start":2021.84,"end":2024.17}],"frame":"../frames/v044/012.webp","frame_time":1937.94},{"title":"专家混合与参数效率","segments":[{"id":313,"text":"And what happens here is that you have so many experts,","zh":"在这里发生的情况是，你拥有如此多的专家，","start":2104.57,"end":2107.23},{"id":314,"text":"you don't choose all of them all the time.","zh":"你并不是一直选择所有的专家。","start":2107.41,"end":2109.15},{"id":315,"text":"For different input, you can choose for different tokens, you choose different experts.","zh":"对于不同的输入，你可以为不同的标记选择不同的专家。","start":2109.35,"end":2113.29},{"id":316,"text":"you choose different experts.","zh":"你选择不同的专家。","start":2113.49,"end":2115.79},{"id":317,"text":"So actually, what really happens is","zh":"实际上，真正发生的情况是","start":2116.11,"end":2117.91},{"id":318,"text":"that you have input vector v, you have a routing model.","zh":"你有一个输入向量 v，你有一个路由模型。","start":2117.91,"end":2121.45},{"id":319,"text":"to decide which one it rows to. And you only row to a subset of them. You row to, for example, this one, and maybe this one, let's see. And for the other ones, they just exist there, but you don't use them. So what happens is that now you can disentangle the memory and the compute in the sense that you have a big memory, or you have a big number of parameters, because you have a lot of these component EIs, but that number of active","zh":"用来决定它路由到哪一个。你只路由到其中一部分。例如，你可能会路由到这个，以及可能这个，我们来看看。而对于其他的专家，它们只是存在于那里，但你并不使用它们。因此，现在你可以将记忆和计算解耦，也就是说，你拥有一个大的记忆，或者你拥有大量的参数，因为拥有大量的这些组件 EIs，但每次实际计算中激活的专家数量可能是一个较小的数字。例如，激活的数量可能是 8，但总的专家数量可能是 128。基本上，你有 128 个专家，它们全部存储在记忆的某个地方，而每次进行计算时，你只使用其中的一小部分。","start":2122.88,"end":2152.42},{"id":320,"text":"ones in each of the actual compute is probably a smaller number. For example, the number of actives, so it can be eight, but the number of total experts maybe is 128. So basically, you have 128 experts which are all sitting in the memory somewhere, and each time when you compute, you only take a subset of them.","zh":"每个实际计算中使用的ones可能是一个较小的数字。例如，活跃的数量，所以可能是八，但总的专家数量可能为128。基本上，你有128个专家，它们全部存储在内存中的某个地方，每次进行计算时，你只使用其中的一小部分。","start":2153.0,"end":2185.48},{"id":321,"text":"So that's why in this case, if you read some of these open source models, the way that people do it is they don't say it's a 70B model. They say it's a 30B A3B. I'm not sure you have seen this kind of things like A3B. I think that's A3B. So what this means is that,","zh":"所以这就是为什么在这种情况下，如果你阅读一些开源模型，人们做这件事的方式是他们不说这是一个700亿参数的模型。他们说这是一个300亿参数的A3B模型。我不确定你是否见过这种东西，比如A3B。我想这就是A3B。这意味着，","start":2186.03,"end":2198.61},{"id":322,"text":"There are 30B total parameters. If you count all the parameters in the experts, you have 30B. And A3B means active 3B. It means that when you actually do the inference, do the computation, only 3B of the parameters will be activated, and all of the other ones are not used.","zh":"总共有300亿个参数。如果你统计所有专家中的参数，总共有300亿个。A3B意味着活跃的30亿。这意味着当你实际进行推理、进行计算时，只有30亿个参数会被激活，其余的参数都不会被使用。","start":2199.2,"end":2216.14},{"id":323,"text":"There are 30B total parameters. If you count all the parameters in the experts, you have 30B. And A3B means active 3B. It means that when you actually do the inference, do the computation, only 3B of the parameters will be activated, and all of the other ones are not used.","zh":"总共有300亿个参数。如果你统计所有专家中的参数，总共有300亿个。A3B意味着活跃的30亿。这意味着当你实际进行推理、进行计算时，只有30亿个参数会被激活，其余的参数都不会被使用。","start":2217.82,"end":2232.4},{"id":324,"text":"Of course, those modules can be used for other tokens as well,","zh":"当然，这些模块也可以用于其他标记，","start":2233.5,"end":2237.04},{"id":325,"text":"but for this particular token or particular position,","zh":"但对于这个特定的标记或特定的位置，","start":2237.22,"end":2239.76},{"id":326,"text":"you don't use all of them.","zh":"你不会使用所有的参数。","start":2240.04,"end":2240.92},{"id":327,"text":"Another original motivation for mix of","zh":"混合专家的另一个原始动机是","start":2242.52,"end":2245.6},{"id":328,"text":"expert without a system perspective is that you somehow","zh":"在没有系统视角的情况下进行专家混合，是因为你某种方式","start":2245.6,"end":2248.74},{"id":329,"text":"believe that each of these experts are having different specializations.","zh":"认为这些专家各自有不同的专长。","start":2248.74,"end":2252.94},{"id":330,"text":"For example, maybe expert one is about math and expert two is about physics,","zh":"例如，也许专家一是关于数学，专家二是关于物理，","start":2253.3,"end":2258.4},{"id":331,"text":"and expert three is about the common English language.","zh":"专家三是关于通用的英语语言。","start":2258.52,"end":2261.18},{"id":332,"text":"expert for is about coding so and so forth and so then for each of the tokens you execute","zh":"专家四是关于编程等等，然后对于每个标记，你执行不同的专家进行专业化处理。","start":2262.02,"end":2267.02},{"id":333,"text":"different experts for specialization so in some sense you specialize two different things and","zh":"在某种意义上，你专门处理两件不同的事情，","start":2267.02,"end":2274.64},{"id":334,"text":"that's problem better for efficiency because you know specialized networks can be smaller","zh":"这在效率方面更有优势，因为你知道专门化的网络可以更小。","start":2274.64,"end":2279.4}],"notes":["本段讲解了专家混合（expert mixture）的概念，即在不同输入情况下选择不同的专家模型进行处理。这种机制允许模型在保持大量参数的同时，仅在实际计算时激活部分专家，从而提高计算效率。"],"formulas":[],"uncertainties":["expert for is about coding so and so forth and so then for each of the tokens you execute"],"diagram":"none","start":2104.57,"end":2279.4,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":2104.57,"text":"And what happens here is that you have so many experts,"},{"start":2107.41,"text":"you don't choose all of them all the time."},{"start":2109.35,"text":"For different input, you can choose for different tokens,"},{"start":2113.49,"text":"you choose different experts."},{"start":2116.11,"text":"So actually, what really happens is"},{"start":2117.91,"text":"that you have input vector v, you have a routing model."},{"start":2122.88,"text":"to decide which one it rows to. And you only row to a subset of them. You row to, for example, this one, and maybe this one, let's see. And for the other ones, they just exist there, but you don't use them. So what happens is that now you can disentangle the memory and the compute in the sense that you have a big memory, or you have a big number of parameters, because you have a lot of these component EIs, but that number of active"},{"start":2153.0,"text":"ones in each of the actual compute is probably a smaller number. For example, the number of actives, so it can be eight, but the number of total experts maybe is 128. So basically, you have 128 experts which are all sitting in the memory somewhere, and each time when you compute, you only take a subset of them. So there are several intuitions on why this is useful. One intuition is like what I said. So this way, you can"},{"start":2186.03,"text":"add more and more experts without, you can get more parameters without changing the computation much. You can have like a trillion parameter model with a lot of experts in it, but the active number of parameters is smaller."},{"start":2199.2,"text":"So that's why in this case, if you read some of these open source models, the way that people do it is they don't say it's a 70B model. They say it's a 30B A3B. I'm not sure you have seen this kind of things like A3B. I think that's A3B. So what this means is that,"},{"start":2217.82,"text":"There are 30B total parameters. If you count all the parameters in the experts, you have 30B. And A3B means active 3B. It means that when you actually do the inference, do the computation, only 3B of the parameters will be activated, and all of the other ones are not used."},{"start":2233.5,"text":"Of course, those modules can be used for other tokens as well,"},{"start":2237.22,"text":"but for this particular token or particular position,"},{"start":2240.04,"text":"you don't use all of them."},{"start":2242.52,"text":"Another original motivation for mix of"},{"start":2245.6,"text":"expert without a system perspective is that you somehow"},{"start":2248.74,"text":"believe that each of these experts are having different specializations."},{"start":2253.3,"text":"For example, maybe expert one is about math and expert two is about physics,"},{"start":2258.52,"text":"and expert three is about the common English language."},{"start":2262.02,"text":"expert for is about coding so and so forth and so then for each of the tokens you execute"},{"start":2267.02,"text":"different experts for specialization so in some sense you specialize two different things and"},{"start":2274.64,"text":"that's problem better for efficiency because you know specialized networks can be smaller"}],"speech_gaps":[],"frame":"../frames/v044/013.webp","frame_time":2116.57},{"title":"强化学习中的策略梯度与专家系统","segments":[{"id":335,"text":"and you still get the same performance game you know mention them to be specialized","zh":"并且你仍然可以获得相同的表现，你知道，提及它们被专门化","start":2279.4,"end":2290.86},{"id":336,"text":"specialized explicitly, but they could possibly","zh":"明确专门化，但它们有可能","start":2290.86,"end":2293.84},{"id":337,"text":"naturally become specialized,","zh":"自然地变得专门化，","start":2294.7,"end":2296.1},{"id":338,"text":"because that's the most efficient way to do it.","zh":"因为那是完成任务的最有效方式。","start":2296.4,"end":2298.32},{"id":339,"text":"So if they are all general purpose,","zh":"所以如果它们都是通用的，","start":2298.48,"end":2300.1},{"id":340,"text":"then maybe that's not the best way","zh":"那么这可能不是最小化损失函数的最佳方式。","start":2300.32,"end":2302.22},{"id":341,"text":"to minimize the loss function.","zh":"我认为有一些论文研究了它们的专门化程度。","start":2302.22,"end":2303.18},{"id":342,"text":"I think there are papers that study how specialized they are.","zh":"我认为有一些论文研究它们有多专业化。","start":2303.8,"end":2306.58},{"id":343,"text":"I think how specialized they are depends a little bit","zh":"我认为它们有多专业化取决于你对专业化的定义","start":2306.98,"end":2309.82},{"id":344,"text":"on your definition of specialization","zh":"以及你如何解释结果。","start":2309.82,"end":2312.14},{"id":345,"text":"and how do you interpret the results.","zh":"但我想至少我读过几篇论文","start":2312.84,"end":2314.12},{"id":346,"text":"But I think at least I've read a few papers","zh":"声称这些网络中的专业化相当强","start":2314.76,"end":2316.84},{"id":347,"text":"which claim that the specialization is pretty strong","zh":"但另一方面，如果你仔细想想，","start":2316.84,"end":2319.12},{"id":348,"text":"wrong in the networks.","zh":"对于相同的序列，你仍然会发送到，","start":2319.12,"end":2321.06},{"id":349,"text":"But on the other hand, if you really think about it,","zh":"但另一方面，如果你仔细想想，","start":2321.44,"end":2324.1},{"id":350,"text":"for the same sequence, you still send to,","zh":"对于同一个序列，你仍然发送到，","start":2324.2,"end":2326.52},{"id":351,"text":"so this thing is not, okay,","zh":"所以这个情况并不是，好的，","start":2327.16,"end":2328.78},{"id":352,"text":"maybe one important clarification is that it's not true","zh":"也许一个重要的澄清是，这并不正确","start":2328.84,"end":2331.9},{"id":353,"text":"that","zh":"即","start":2331.9,"end":2332.04},{"id":354,"text":"you decide experts for each sequence.","zh":"你为每个序列选择专家。","start":2332.56,"end":2334.22},{"id":355,"text":"You decide experts for each token and each layer.","zh":"你为每个标记和每个层选择专家。","start":2334.52,"end":2337.02},{"id":356,"text":"So each position, each layer.","zh":"因此，每个位置，每个层。","start":2337.66,"end":2338.92},{"id":357,"text":"So for each layer, you have like a sequence.","zh":"因此，对于每个层，你都有一个序列。","start":2339.06,"end":2342.22},{"id":358,"text":"You have a lot of MLPs and this is like a time dimension,","zh":"你有很多MLP，这类似于一个时间维度，","start":2343.02,"end":2346.98},{"id":359,"text":"like one, two, three, four, up to t.","zh":"比如像一、二、三、四，一直到t。","start":2347.22,"end":2348.66},{"id":360,"text":"And for each of these MLP,","zh":"对于每一个这些MLP，","start":2349.0,"end":2350.44},{"id":361,"text":"you decide which expert you use.","zh":"你决定使用哪一个专家。","start":2350.5,"end":2352.06},{"id":362,"text":"For each layer, you have to decide again.","zh":"对于每一层，你都需要再次决定。","start":2353.98,"end":2356.02},{"id":363,"text":"It's not like even specific to only the positions,","zh":"它不仅仅特定于某些位置，","start":2356.22,"end":2359.64},{"id":364,"text":"but also specific to positions and layers.","zh":"而且也特定于位置和层。","start":2359.8,"end":2361.52},{"id":365,"text":"So in some sense, it's not entirely clear how much specialization you can do here, because","zh":"所以从某种意义上说，这里你能够进行多少专业化是不完全明确的，因为","start":2361.52,"end":2368.44},{"id":366,"text":"in some sense, for one sequence, maybe it's always about math, right?","zh":"从某种意义上说，对于一个序列，也许它总是关于数学的，对吧？","start":2368.96,"end":2377.04},{"id":367,"text":"So empirically, you do see that the number of experts you are running is smaller than","zh":"从经验上来看，你运行的专家数量会比每个序列的总专家数量要少。","start":2377.18,"end":2381.42},{"id":368,"text":"the total number of experts for each of the sequences.","zh":"但我觉得这个数量并不是非常精确。","start":2381.42,"end":2383.16},{"id":369,"text":"But I think the number is not very sharp.","zh":"并不是对于这个数学序列来说，所有的专家都是相同的数学专家，不是完全这样的情况。","start":2383.6,"end":2387.06},{"id":370,"text":"It's not like for this, for one sequence about math, all the experts are the same, the math experts, not exactly like that.","zh":"有没有问题，就是专门地对每个单元进行特定事物的训练？","start":2387.06,"end":2395.0},{"id":371,"text":"Is there a problem with specifically training each of those units on specific things?","zh":"因为你提到你并没有显式地训练它们。","start":2395.54,"end":2400.18},{"id":372,"text":"Because you said that you don't explicitly train them.","zh":"所以你想显式地训练它吗？","start":2400.28,"end":2402.48},{"id":373,"text":"So you want to explicitly train it?","zh":"我想有些人已经尝试过这种方法了。","start":2402.72,"end":2404.06},{"id":374,"text":"I think some people have tried it.","zh":"我想有些人已经尝试过了。","start":2404.88,"end":2407.16},{"id":375,"text":"It doesn't seem to work as well as end-to-end training.","zh":"它似乎不如端到端训练有效。","start":2407.26,"end":2410.76},{"id":376,"text":"And also, you don't really know how to train them specifically,","zh":"此外，你真的不知道如何具体地训练它们，","start":2410.76,"end":2413.58},{"id":377,"text":"because how do you train each of these experts?","zh":"因为如何训练每一个专家呢？","start":2414.14,"end":2416.72},{"id":378,"text":"So are you training them on different data?","zh":"所以你是用不同的数据来训练它们吗？","start":2416.9,"end":2420.54},{"id":379,"text":"And then you have not enough data.","zh":"然后你就会缺乏足够的数据。","start":2421.04,"end":2422.72},{"id":380,"text":"Sometimes you don't have enough data for math.","zh":"有时候你并没有足够的数据来进行数学计算。","start":2423.06,"end":2424.54},{"id":381,"text":"So it's much more cumbersome to force the specialization","zh":"因此，强制进行一定程度的专门化要繁琐得多。","start":2424.8,"end":2428.86},{"id":382,"text":"to some degree.","zh":"在某种程度上。","start":2429.68,"end":2430.58},{"id":383,"text":"But we don't know.","zh":"但我们不知道。","start":2434.66,"end":2435.92},{"id":384,"text":"I think it's possible that some people are training that.","zh":"我认为有可能一些人在训练这个。","start":2436.04,"end":2438.36},{"id":385,"text":"but it also depends on what's the granularity of this, right?","zh":"但这也取决于这个的粒度是什么，对吧？","start":2438.36,"end":2441.4},{"id":386,"text":"So for example, if you just only have eight experts","zh":"例如，如果你只有八个专家","start":2441.5,"end":2443.36},{"id":387,"text":"and each time you choose one,","zh":"并且每次你选择一个，","start":2443.36,"end":2444.56},{"id":388,"text":"I think maybe there's a good reason to,","zh":"我认为可能有很好的理由去，","start":2445.3,"end":2447.58},{"id":389,"text":"at least it sounds more plausible","zh":"至少听起来更合理","start":2448.86,"end":2450.44},{"id":390,"text":"to eight of them separately and then try to aggregate.","zh":"分别对这八个进行处理，然后尝试聚合。","start":2450.44,"end":2454.02},{"id":391,"text":"I'm not saying people have done,","zh":"我不是说人们已经做过，","start":2455.0,"end":2456.34},{"id":392,"text":"people, I don't see public papers","zh":"人们，我看不到公开的论文","start":2456.42,"end":2458.76}],"notes":["本段讨论了强化学习中专家系统的设计与训练问题。讲者指出，虽然专家系统可能自然地变得专业化，但这种专业化程度取决于定义和结果的解释。讲者提到，有些论文声称网络中的专业化程度较强，但实际应用中，专家的选择是针对每个token和每个层，而不是仅针对序列。这表明专家系统的设计需要考虑位置和层的粒度。"],"formulas":[],"uncertainties":["wrong in the networks"],"diagram":"none","start":2279.4,"end":2458.76,"asr_flags":[335],"boards":[],"translation_complete":true,"translated_segments":58,"raw_segments":[{"start":2279.4,"text":"and you still get the same performance game you know mention them to be specialized"},{"start":2290.86,"text":"specialized explicitly, but they could possibly"},{"start":2294.7,"text":"naturally become specialized,"},{"start":2296.4,"text":"because that's the most efficient way to do it."},{"start":2298.48,"text":"So if they are all general purpose,"},{"start":2300.32,"text":"then maybe that's not the best way"},{"start":2302.22,"text":"to minimize the loss function."},{"start":2303.8,"text":"I think there are papers that study how specialized they are."},{"start":2306.98,"text":"I think how specialized they are depends a little bit"},{"start":2309.82,"text":"on your definition of specialization"},{"start":2312.84,"text":"and how do you interpret the results."},{"start":2314.76,"text":"But I think at least I've read a few papers"},{"start":2316.84,"text":"which claim that the specialization is pretty strong"},{"start":2319.12,"text":"wrong in the networks."},{"start":2321.44,"text":"But on the other hand, if you really think about it,"},{"start":2324.2,"text":"for the same sequence, you still send to,"},{"start":2327.16,"text":"so this thing is not, okay,"},{"start":2328.84,"text":"maybe one important clarification is that it's not true"},{"start":2331.9,"text":"that"},{"start":2332.56,"text":"you decide experts for each sequence."},{"start":2334.52,"text":"You decide experts for each token and each layer."},{"start":2337.66,"text":"So each position, each layer."},{"start":2339.06,"text":"So for each layer, you have like a sequence."},{"start":2343.02,"text":"You have a lot of MLPs and this is like a time dimension,"},{"start":2347.22,"text":"like one, two, three, four, up to t."},{"start":2349.0,"text":"And for each of these MLP,"},{"start":2350.5,"text":"you decide which expert you use."},{"start":2353.98,"text":"For each layer, you have to decide again."},{"start":2356.22,"text":"It's not like even specific to only the positions,"},{"start":2359.8,"text":"but also specific to positions and layers."},{"start":2361.52,"text":"So in some sense, it's not entirely clear how much specialization you can do here, because"},{"start":2368.96,"text":"in some sense, for one sequence, maybe it's always about math, right?"},{"start":2377.18,"text":"So empirically, you do see that the number of experts you are running is smaller than"},{"start":2381.42,"text":"the total number of experts for each of the sequences."},{"start":2383.6,"text":"But I think the number is not very sharp."},{"start":2387.06,"text":"It's not like for this, for one sequence about math, all the experts are the same, the math experts, not exactly like that."},{"start":2395.54,"text":"Is there a problem with specifically training each of those units on specific things?"},{"start":2400.28,"text":"Because you said that you don't explicitly train them."},{"start":2402.72,"text":"So you want to explicitly train it?"},{"start":2404.88,"text":"I think some people have tried it."},{"start":2407.26,"text":"It doesn't seem to work as well as end-to-end training."},{"start":2410.76,"text":"And also, you don't really know how to train them specifically,"},{"start":2414.14,"text":"because how do you train each of these experts?"},{"start":2416.9,"text":"So are you training them on different data?"},{"start":2421.04,"text":"And then you have not enough data."},{"start":2423.06,"text":"Sometimes you don't have enough data for math."},{"start":2424.8,"text":"So it's much more cumbersome to force the specialization"},{"start":2429.68,"text":"to some degree."},{"start":2434.66,"text":"But we don't know."},{"start":2436.04,"text":"I think it's possible that some people are training that."},{"start":2438.36,"text":"but it also depends on what's the granularity of this, right?"},{"start":2441.5,"text":"So for example, if you just only have eight experts"},{"start":2443.36,"text":"and each time you choose one,"},{"start":2445.3,"text":"I think maybe there's a good reason to,"},{"start":2448.86,"text":"at least it sounds more plausible"},{"start":2450.44,"text":"to eight of them separately and then try to aggregate."},{"start":2455.0,"text":"I'm not saying people have done,"},{"start":2456.42,"text":"people, I don't see public papers"}],"speech_gaps":[{"start":2430.98,"end":2432.496},{"start":2432.72,"end":2434.26}],"frame":"../frames/v044/014.webp","frame_time":2291.4},{"title":"专家选择与路由机制","segments":[{"id":393,"text":"people have done this successfully very well,","zh":"人们已经非常成功地完成了这一点。","start":2458.76,"end":2460.5},{"id":394,"text":"but it sounds at least plausible.","zh":"但这至少听起来是合理的。","start":2460.64,"end":2462.16},{"id":395,"text":"But if you have like 258 experts, right,","zh":"但如果你有258个专家，对吧，","start":2462.52,"end":2467.08},{"id":396,"text":"and each time you choose eight of them,","zh":"每次你选择其中八个，","start":2467.08,"end":2468.68},{"id":397,"text":"it becomes much harder to decide a priori,","zh":"就很难事先决定","start":2469.3,"end":2473.44},{"id":398,"text":"how do you choose that 256 experts one by one in some sense.","zh":"如何在某种意义上依次选择那256个专家。","start":2473.44,"end":2477.12},{"id":399,"text":"Okay. So.","zh":"好的。","start":2480.58,"end":2481.5},{"id":400,"text":".","zh":".","start":2486.42,"end":2486.9},{"id":401,"text":"Yeah. I haven't talked about that.","zh":"是的。我还没谈到这个。","start":2490.92,"end":2494.88},{"id":402,"text":"Yeah. That's a great question. Yes.","zh":"是的。这是个很好的问题。是的。","start":2494.9,"end":2495.78},{"id":403,"text":"Let me talk about that.","zh":"让我谈谈这个。","start":2495.78,"end":2496.7},{"id":404,"text":"So how do we choose?","zh":"那么我们如何选择？","start":2497.12,"end":2498.64},{"id":405,"text":"So the choice, the routing, is decided by the network as well.","zh":"所以这个选择，这个路由，也是由网络决定的。","start":2499.34,"end":2504.16},{"id":406,"text":"And so the routing is decided by, often,","zh":"因此，路由通常是由","start":2505.62,"end":2510.98},{"id":407,"text":"a relatively small routing module.","zh":"一个相对较小的路由模块决定的。","start":2511.08,"end":2512.9},{"id":408,"text":"There are different design choices here,","zh":"这里有不同的设计选择，","start":2514.96,"end":2516.94},{"id":409,"text":"but let me just show you one particular one.","zh":"但让我只给你展示一个特定的例子。","start":2517.1,"end":2520.84},{"id":410,"text":"ones. So let's say we have an input, and even more mathematically, this is the","zh":"这些。所以假设我们有一个输入，更数学化地说，这就是","start":2520.84,"end":2529.92},{"id":411,"text":"input, it's the vector v I'm talking about here. So the input of this is some","zh":"输入，我在这里指的是向量 v。所以这个输入是一些","start":2529.92,"end":2534.98},{"id":412,"text":"hidden vectors in the transformer, and then you first do a","zh":"transformer 中的隐藏向量，然后你首先进行","start":2534.98,"end":2540.7},{"id":413,"text":"routing. You say, you compute something like this, sigma ht times","zh":"路由。你计算类似这样的东西，sigma ht 乘以","start":2540.7,"end":2547.04},{"id":414,"text":"a routing matrix and you make it the output is equal to is a vector of dimension m and say m","zh":"一个路由矩阵，使得输出是一个维度为 m 的向量，假设 m","start":2548.14,"end":2554.16},{"id":415,"text":"is equal to the number of total experts","zh":"等于专家的总数","start":2554.76,"end":2556.64},{"id":416,"text":"so you you you project your inputs to some m dimensional vector and you apply some sigma it","zh":"所以你将输入投影到一个 m 维向量，并应用一些 sigma it","start":2561.12,"end":2568.08},{"id":417,"text":"can be soft max can be soft max or um sorry the sigma can be soft max or sigmoid or something","zh":"可以是soft max，也可以是soft max或者嗯，抱歉，sigma可以是soft max或者sigmoid或者其他什么","start":2568.08,"end":2572.94},{"id":418,"text":"something like that, so that you get an m-dimensional vector,","zh":"类似这样的，这样你就能得到一个m维向量，","start":2572.94,"end":2575.56},{"id":419,"text":"which is the relative importance between all the m","zh":"这个向量表示所有m个选项之间的相对重要性，","start":2575.72,"end":2579.94},{"id":420,"text":"choice of experts.","zh":"专家的选择。","start":2579.94,"end":2581.34},{"id":421,"text":"And then you take, often you choose a subset, right?","zh":"然后你通常会选择一个子集，对吧？","start":2582.24,"end":2585.58},{"id":422,"text":"You choose St to be the largest indices of Rt.","zh":"你选择St为Rt中最大的索引。","start":2585.62,"end":2598.28},{"id":423,"text":"So among these m dimensions, you choose","zh":"在这些m个维度中，你选择","start":2598.44,"end":2600.6},{"id":424,"text":"a subset of, I think maybe I should just remove the T","zh":"一个子集，我想也许我应该直接去掉T","start":2600.6,"end":2604.6},{"id":425,"text":"because the T is irrelevant here.","zh":"因为这里的 T 是无关的。","start":2604.6,"end":2606.2},{"id":426,"text":"That's my bad.","zh":"这是我的错。","start":2606.66,"end":2608.5},{"id":427,"text":"So basically, R is a vector of dimension N","zh":"所以基本上，R 是一个维度为 N 的向量","start":2608.78,"end":2611.62},{"id":428,"text":"and you choose the largest entries of R","zh":"然后你选择 R 中最大的元素","start":2611.62,"end":2614.78},{"id":429,"text":"and that's the set S.","zh":"这就是集合 S。","start":2615.58,"end":2617.08},{"id":430,"text":"And how large it is, how large S is,","zh":"而 S 的大小，也就是 S 包含多少个元素，","start":2617.48,"end":2620.3},{"id":431,"text":"this S is the number of active experts.","zh":"这个 S 就是活跃专家的数量。","start":2620.36,"end":2623.64},{"id":432,"text":"So for example, S could be eight and M could be 128, something like that.","zh":"例如，S 可以是 8，而 M 可以是 128，类似这样的数值。","start":2627.5,"end":2632.02},{"id":433,"text":"Then once you choose the largest set of indices of R,","zh":"然后一旦你选择了R中最大的索引集合，","start":2632.98,"end":2637.72}],"notes":["本段讨论了在专家系统中如何选择专家的问题，特别是当专家数量较多时，如何通过路由机制动态选择活跃的专家。讲者提到，当专家数量达到258时，手动选择变得困难，因此需要一种自动化的路由机制。","讲者指出，路由机制通常由一个相对较小的路由模块决定，该模块会计算一个向量，表示每个专家的重要性。这个向量的维度等于专家总数，通过softmax或sigmoid等函数生成。","接着，讲者解释了如何从这个向量中选择活跃的专家。通常会选择该向量中最大的几个元素，对应的索引即为活跃的专家集合。这个集合的大小决定了同时激活的专家数量。","讲者提到，这个过程类似于在Transformer模型中处理隐藏向量，将输入投影到一个特定维度的向量，然后通过路由机制选择专家。这种机制在实际应用中非常常见，例如在模型压缩或分布式计算中。","讲者还指出，选择的专家数量（S）和总专家数量（M）之间可能存在差异，例如S可以是8，而M可以是128，这表明并非所有专家都会同时被激活。","最后，讲者提到在选择过程中，T（可能指时间或索引）是无关的，因此可以忽略。这表明在实际实现中，某些参数或索引可能不需要被保留。"],"formulas":[{"latex":"R \\text{ 是一个维度为 } N \\text{ 的向量}","symbols":"R 是一个维度为 N 的向量","explanation":"公式描述正确，R 是一个维度为 N 的向量，符合上下文中的定义。","evidence":"So basically, R is a vector of dimension N"},{"latex":"S \\text{ 是 } R \\text{ 中最大元素对应的索引集合}","symbols":"S 是 R 中最大元素对应的索引集合","explanation":"公式描述正确，S 是 R 中最大元素对应的索引集合，符合上下文中的定义。","evidence":"and you choose the largest entries of R and that's the set S."},{"latex":"S \\text{ 可以是 } 8 \\text{，} M \\text{ 可以是 } 128","symbols":"S 可以是 8，M 可以是 128","explanation":"公式描述正确，S 和 M 的具体数值符合上下文中的例子。","evidence":"So for example, S could be eight and M could be 128, something like that."}],"uncertainties":["you you you project your inputs to some m dimensional vector and you apply some sigma it","can be soft max can be soft max or um sorry the sigma can be soft max or sigmoid or something","something like that, so that you get an m-dimensional vector,"],"diagram":"none","start":2458.76,"end":2637.72,"asr_flags":[422],"math_clarifications":["公式 2 中的 S 被定义为索引集合，而非数量，因此该公式与上下文不一致，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":2458.76,"text":"people have done this successfully very well,"},{"start":2460.64,"text":"but it sounds at least plausible."},{"start":2462.52,"text":"But if you have like 258 experts, right,"},{"start":2467.08,"text":"and each time you choose eight of them,"},{"start":2469.3,"text":"it becomes much harder to decide a priori,"},{"start":2473.44,"text":"how do you choose that 256 experts one by one in some sense."},{"start":2480.58,"text":"Okay. So."},{"start":2486.42,"text":"."},{"start":2490.92,"text":"Yeah. I haven't talked about that."},{"start":2494.9,"text":"Yeah. That's a great question. Yes."},{"start":2495.78,"text":"Let me talk about that."},{"start":2497.12,"text":"So how do we choose?"},{"start":2499.34,"text":"So the choice, the routing, is decided by the network as well."},{"start":2505.62,"text":"And so the routing is decided by, often,"},{"start":2511.08,"text":"a relatively small routing module."},{"start":2514.96,"text":"There are different design choices here,"},{"start":2517.1,"text":"but let me just show you one particular one."},{"start":2520.84,"text":"ones. So let's say we have an input, and even more mathematically, this is the"},{"start":2529.92,"text":"input, it's the vector v I'm talking about here. So the input of this is some"},{"start":2534.98,"text":"hidden vectors in the transformer, and then you first do a"},{"start":2540.7,"text":"routing. You say, you compute something like this, sigma ht times"},{"start":2548.14,"text":"a routing matrix and you make it the output is equal to is a vector of dimension m and say m"},{"start":2554.76,"text":"is equal to the number of total experts"},{"start":2561.12,"text":"so you you you project your inputs to some m dimensional vector and you apply some sigma it"},{"start":2568.08,"text":"can be soft max can be soft max or um sorry the sigma can be soft max or sigmoid or something"},{"start":2572.94,"text":"something like that, so that you get an m-dimensional vector,"},{"start":2575.72,"text":"which is the relative importance between all the m"},{"start":2579.94,"text":"choice of experts."},{"start":2582.24,"text":"And then you take, often you choose a subset, right?"},{"start":2585.62,"text":"You choose St to be the largest indices of Rt."},{"start":2598.44,"text":"So among these m dimensions, you choose"},{"start":2600.6,"text":"a subset of, I think maybe I should just remove the T"},{"start":2604.6,"text":"because the T is irrelevant here."},{"start":2606.66,"text":"That's my bad."},{"start":2608.78,"text":"So basically, R is a vector of dimension N"},{"start":2611.62,"text":"and you choose the largest entries of R"},{"start":2615.58,"text":"and that's the set S."},{"start":2617.48,"text":"And how large it is, how large S is,"},{"start":2620.36,"text":"this S is the number of active experts."},{"start":2627.5,"text":"So for example, S could be eight and M could be 128, something like that."},{"start":2632.98,"text":"Then once you choose the largest set of indices of R,"}],"speech_gaps":[{"start":2481.9,"end":2483.664},{"start":2488.752,"end":2490.52}],"frame":"../frames/v044/015.webp","frame_time":2470.76},{"title":"策略梯度与专家系统设计","segments":[{"id":434,"text":"let's say this is like the K largest,","zh":"比如说，这类似于最大的K个","start":2637.88,"end":2642.9},{"id":435,"text":"so this is equal to K.","zh":"因此，这等于K。","start":2643.1,"end":2644.64},{"id":436,"text":"Then you say I'm going to run","zh":"然后你说我要运行","start":2646.7,"end":2649.74},{"id":437,"text":"this input. So I'm gonna run E on the input h for s in capital S.","zh":"这个输入。因此，我要在输入h上运行E，对于所有大写的S中的s。","start":2655.42,"end":2667.2},{"id":438,"text":"So capital S is my indices of the k largest and I'm gonna run for each of","zh":"大写的S是我选取的最大的K个索引，我要对每个","start":2667.42,"end":2672.76},{"id":439,"text":"the s in the k largest, I'm gonna run the expert to get some output and then","zh":"在最大的K个s中，我要运行专家系统以获得一些输出，然后","start":2672.76,"end":2676.92},{"id":440,"text":"I'm gonna weight all of these outputs. So I compute this and then I'm","zh":"我要对所有这些输出进行加权。因此，我计算这些之后，","start":2676.92,"end":2681.2},{"id":441,"text":"the final output of this module is going to be a weighted sum where s is in this.","zh":"这个模块的最终输出将是一个加权和，其中s属于这个集合。","start":2681.2,"end":2696.36},{"id":442,"text":"And what's the weight? The weight needs to be sum to one and the weight is often","zh":"那么权重是多少？权重需要总和为一，权重通常是","start":2696.64,"end":2701.88},{"id":443,"text":"just a renormalization of the r. So the weight rs is just renormalization","zh":"r 的简单归一化。因此，权重 rs 就是 r 的归一化","start":2703.06,"end":2709.64},{"id":444,"text":"of r. The alpha is renormalization of the r's. So you sum up all the r's and you renormalize it so","zh":"。alpha 是 r 的归一化。因此，你将所有 r 相加，然后进行归一化，使其成为标准的归一化形式。哦，实际上这是","start":2709.64,"end":2721.94},{"id":445,"text":"that it becomes a normal one. Oh, actually this is, you sum up, yeah, my bad, this is actually small","zh":"一些细微的差别。这并不太重要，但让我纠正一下。因此，你是在所选子集的所有权重上进行求和，使得在集合 S 中，","start":2721.94,"end":2727.24},{"id":446,"text":"nuances. Not that important, but let me correct it. So you are summing up all the weights in the","zh":"alpha 的和的范数等于一。","start":2727.24,"end":2737.0},{"id":447,"text":"the selected subset, so that among the set S,","zh":"这样就不会改变太多尺度，对吧？","start":2737.0,"end":2741.78},{"id":448,"text":"the norm of the sum of the alpha is equal to one.","zh":"所有α的和的范数等于一。","start":2742.02,"end":2745.5},{"id":449,"text":"So this way you don't change the scale too much, right?","zh":"这样就不会改变尺度太多，对吧？","start":2747.02,"end":2749.32},{"id":450,"text":"Like you are taking a combination of these outputs,","zh":"就像你在组合这些输出一样，","start":2749.38,"end":2752.94},{"id":451,"text":"you know, with this coefficient summing up to one,","zh":"你知道，这些系数加起来等于一，","start":2753.18,"end":2756.08},{"id":452,"text":"so you don't change the scale too much.","zh":"因此你不会改变太多尺度。","start":2756.14,"end":2757.9},{"id":453,"text":"And one more small thing is that sometimes,","zh":"还有一个小细节是，有时候，","start":2768.88,"end":2771.4},{"id":454,"text":"people also have so-called shared experts,","zh":"人们也会使用所谓的共享专家，","start":2771.68,"end":2774.04},{"id":455,"text":"meaning that among all of this,","zh":"意思是，在所有这些之中，","start":2774.56,"end":2776.32},{"id":456,"text":"like for every position, every layer. So you say you reserve one that is always used, and then the rest of them are selected like this way. At least that's one of the, I think in DeepSeq v3, that's the design choice.","zh":"比如对于每个位置，每个层，你可以说你保留一个始终被使用的专家，其余的则是这样被选择的。至少在 DeepSeq v3 中，这是设计选择之一。","start":2776.42,"end":2777.88},{"id":457,"text":"So among the M experts,","zh":"在 M 个专家中，","start":2777.98,"end":2779.18},{"id":458,"text":"some of them is always used.","zh":"其中一些总是被使用。","start":2779.82,"end":2781.48},{"id":459,"text":"like for every position, every layer. So you say you reserve one that is always used, and then the rest of them are selected like this way. At least that's one of the, I think in DeepSeq v3, that's the design choice. And I think the...","zh":"比如对于每个位置，每个层来说都是如此。因此你说你保留一个总是被使用的，其余的则以这种方式被选择。至少在DeepSeq v3中，这就是设计选择。我认为……","start":2783.09,"end":2799.45}],"notes":["本段讲解了专家系统设计中权重归一化的过程，其中提到权重rs是r的归一化结果，alpha是r的归一化。归一化过程是将所有r相加后进行归一化，使得总和为1，从而避免尺度变化过大。","讲者指出，归一化过程中的细节可能较为微妙，但并非关键。归一化确保了在选定的子集S中，alpha的和为1，从而保持输出的尺度稳定。","讲者进一步说明，归一化是为了在组合多个专家输出时，保持整体输出的尺度不变，通过系数总和为1来实现。","讲者提到，有时会使用共享专家系统，即在所有专家中保留一个始终被使用的专家，其余专家则根据某种方式选择。","讲者指出，这种设计选择在DeepSeq v3中被采用，即在每个位置或层中保留一个始终使用的专家，其余专家则通过特定方式选择。"],"formulas":[],"uncertainties":["可能存在的术语识别错误，如'nuances'是否应为'normalization'或其他术语","关于'alpha'和'r'的具体数学关系未明确表达，需进一步确认"],"diagram":"none","start":2637.88,"end":2799.45,"asr_flags":[441,444],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":2637.88,"text":"let's say this is like the K largest,"},{"start":2643.1,"text":"so this is equal to K."},{"start":2646.7,"text":"Then you say I'm going to run"},{"start":2655.42,"text":"this input. So I'm gonna run E on the input h for s in capital S."},{"start":2667.42,"text":"So capital S is my indices of the k largest and I'm gonna run for each of"},{"start":2672.76,"text":"the s in the k largest, I'm gonna run the expert to get some output and then"},{"start":2676.92,"text":"I'm gonna weight all of these outputs. So I compute this and then I'm"},{"start":2681.2,"text":"the final output of this module is going to be a weighted sum where s is in this."},{"start":2696.64,"text":"And what's the weight? The weight needs to be sum to one and the weight is often"},{"start":2703.06,"text":"just a renormalization of the r. So the weight rs is just renormalization"},{"start":2709.64,"text":"of r. The alpha is renormalization of the r's. So you sum up all the r's and you renormalize it so"},{"start":2721.94,"text":"that it becomes a normal one. Oh, actually this is, you sum up, yeah, my bad, this is actually small"},{"start":2727.24,"text":"nuances. Not that important, but let me correct it. So you are summing up all the weights in the"},{"start":2737.0,"text":"the selected subset, so that among the set S,"},{"start":2742.02,"text":"the norm of the sum of the alpha is equal to one."},{"start":2747.02,"text":"So this way you don't change the scale too much, right?"},{"start":2749.38,"text":"Like you are taking a combination of these outputs,"},{"start":2753.18,"text":"you know, with this coefficient summing up to one,"},{"start":2756.14,"text":"so you don't change the scale too much."},{"start":2768.88,"text":"And one more small thing is that sometimes,"},{"start":2771.68,"text":"people also have so-called shared experts,"},{"start":2774.56,"text":"meaning that among all of this,"},{"start":2776.42,"text":"maybe I should use M here."},{"start":2777.98,"text":"So among the M experts,"},{"start":2779.82,"text":"some of them is always used."},{"start":2783.09,"text":"like for every position, every layer. So you say you reserve one that is always used, and then the rest of them are selected like this way. At least that's one of the, I think in DeepSeq v3, that's the design choice. And I think the..."}],"speech_gaps":[{"start":2650.14,"end":2652.208}],"frame":"../frames/v044/016.webp","frame_time":2649.88},{"title":"混合专家模型（MOE）的训练与效率优化","segments":[{"id":460,"text":"The rationale comes to the paper was that the shared expert is kind of like something about common knowledge about English, for example, or the language. And every token is to use that. Every position, every token is to use that. And then the rest of them are about specialization. I don't, for sure, they use it for a reason, right? But I think there are also other models which don't use this design as well. So, yeah.","zh":"作者提出这个想法的依据是，共享专家类似于关于英语的常识，例如语言方面的知识。每个位置、每个标记都会使用这些共享专家。然后剩下的部分则是关于专业化的。我确定他们使用这种设计是有原因的，对吧？但我想也有其他模型并不采用这种设计。所以，是的。","start":2801.03,"end":2827.92},{"id":461,"text":"Generally, people try to make sure all the experts are used equally.","zh":"通常，人们会尝试确保所有专家都被同样使用。","start":2829.26,"end":2833.32},{"id":462,"text":"In some sense. So this is actually, I didn't discuss the training, which is actually very complicated for, at least it's very subtle for MOE. One of the challenges to how to make the MOE training work. And in the training, often there are some regularizations on how the routing is done. So basically you want the routing to be as uniformly distributed as possible. And part of the reason is that, for example, in a training case, suppose the routing is always routing to some","zh":"从某种意义上说，这实际上是我没有讨论的训练过程，而训练过程对于MOE来说是非常复杂的，至少是非常微妙的。其中一个挑战是如何让MOE训练有效运作。在训练过程中，通常会对路由方式施加一些正则化。基本上，你希望路由尽可能均匀分布。部分原因是，例如，在训练案例中，假设路由总是指向某些两个专家，而没有指向其他任何专家。那么你就会浪费内存来存储所有其他专家。你的有效模型规模不够大，因为如果你只使用前两个专家，而其他专家都没有被使用，那么实际上你的模型规模比参数成本要小，这就不高效了。因此人们尝试添加正则化来使路由更加均匀。","start":2834.0,"end":2862.1},{"id":463,"text":"two experts but not any of the other experts. Then you are wasting your memory to store all the other experts. Your effective model size is not big enough because if you only use the first two and all the others are not used, then effectively your model is actually smaller than the parameter cost and that shouldn't be efficient. So people try to add regularizations to make the routing more uniform. Another thing is that if the routing is not more","zh":"如果路由不够均匀，那么在设计基础设施来处理它时也会有些困难。基本上，每个专家对应不同的汽车，假设其中存在太多异质性，那么某些汽车的使用率就会比其他汽车低。因此你的效率和推理效果就不足以达到预期。当然，还有其他方法可以处理这种情况。例如，你可以为某个专家分配更多的GPU资源，而不是其他专家。我想实际上，","start":2862.7,"end":2890.4},{"id":464,"text":"not uniform enough, then it's also a little bit hard to design your infrastructure to deal with it. So basically, each of these experts on different cars, suppose there's too much heterogeneity there, then some cars are not used enough compared to the other cars. So then your efficiency and inference is not good enough. Of course, there are other ways to deal with that. For example, you can provision more GPUs for one of the experts than the other experts. I think actually,","zh":"不够均匀，那么设计基础设施来处理这种情况也会有点困难。因此，基本上，每个专家在不同的车上，假设那里存在太多的异质性，那么一些车的使用率就比其他车低。因此，你的效率和推理效果就不是很好。当然，还有其他方法可以处理这种情况。例如，你可以为其中一个专家配置更多的GPU，而不是其他专家。我想实际上，","start":2890.75,"end":2914.97},{"id":465,"text":"I think in a wealth deep-seek paper, they even say that they have a dynamical way to change how many GPUs are used for each of the experts. For example, in the US daytime, some of the experts becomes more often used and then they provision more GPUs for them. Then the China time, I think most likely because of the language, one of the use cases shifted and some of the other experts becomes more activated and more used and then","zh":"我认为在一篇关于DeepSeek的论文中，他们甚至提到他们有一种动态的方法来改变每个专家使用的GPU数量。例如，在美国白天，一些专家会被更频繁地使用，然后他们就会为这些专家分配更多的GPU。在中国时间，我想很可能由于语言的原因，某个用例发生了变化，一些其他的专家变得更为活跃和被使用，然后","start":2916.65,"end":2945.87},{"id":466,"text":"they provision more GPUs for those kind of experts.","zh":"他们就会为这些类型的专家分配更多的GPU。","start":2946.27,"end":2948.25},{"id":467,"text":"I don't know whether that's exactly the case","zh":"我不知道这是否在所有模型中都是如此","start":2950.65,"end":2952.29},{"id":468,"text":"in all of the models, but that was reported","zh":"但这一点在一些论文和博客文章中被报道过。","start":2952.29,"end":2955.51},{"id":469,"text":"in some of the papers and blog posts.","zh":"是的，因为我想最终这一切都是关于","start":2955.51,"end":2958.15},{"id":470,"text":"Yeah, because I think eventually it's all about,","zh":"某种意义上，最终这一切都是关于效率的。","start":2970.43,"end":2973.37},{"id":471,"text":"In some sense, eventually it's all about efficiency.","zh":"至少其中一个原因是，你这样做，","start":2973.37,"end":2975.51},{"id":472,"text":"At least one of the reason is that you do this,","zh":"至少有一个原因是你这样做，","start":2976.37,"end":2980.21}],"notes":["本段讨论了混合专家模型（MOE）中共享专家和专业化专家的设计，以及训练过程中如何确保专家的均匀使用。讲者提到，共享专家类似于通用知识，如语言，而每个位置或标记都使用该知识。专业化部分则涉及模型的其他设计。","讲者指出，MOE的训练非常复杂，其中一个挑战是如何使路由（routing）尽可能均匀分布。均匀分布的路由可以避免浪费内存和参数成本，提高模型效率。","讲者提到，如果路由不均匀，会导致基础设施设计困难，影响推理效率。因此，人们会通过正则化手段来优化路由分布。","讲者还提到，某些模型会根据使用情况动态调整GPU资源分配，例如在不同时间段根据语言使用情况调整专家的GPU数量，以提高效率。","讲者指出，虽然这种动态调整在某些论文和博客中被报道，但并非所有模型都采用这种方式。最终，MOE的设计目标之一是提高效率。","讲者强调，MOE的效率优化不仅涉及模型结构，还涉及硬件资源的动态分配，以适应不同场景下的需求。"],"formulas":[],"uncertainties":["wealth deep-seek paper","becomes more often used","becomes more activated","those kind of experts"],"diagram":"none","start":2801.03,"end":2980.21,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":2801.03,"text":"the rationale comes to the paper was that the shared expert is kind of like something about common knowledge about English, for example, or the language. And every token is to use that. Every position, every token is to use that. And then the rest of them are about specialization. I don't, for sure, they use it for a reason, right? But I think there are also other models which don't use this design as well. So, yeah."},{"start":2829.26,"text":"Generally, people try to make sure all the experts are used equally."},{"start":2834.0,"text":"in some sense. So this is actually, I didn't discuss the training, which is actually very complicated for, at least it's very subtle for MOE. One of the challenges to how to make the MOE training work. And in the training, often there are some regularizations on how the routing is done. So basically you want the routing to be as uniformly distributed as possible. And part of the reason is that, for example, in a training case, suppose the routing is always routing to some"},{"start":2862.7,"text":"two experts but not any of the other experts. Then you are wasting your memory to store all the other experts. Your effective model size is not big enough because if you only use the first two and all the others are not used, then effectively your model is actually smaller than the parameter cost and that shouldn't be efficient. So people try to add regularizations to make the routing more uniform. Another thing is that if the routing is not more"},{"start":2890.75,"text":"not uniform enough, then it's also a little bit hard to design your infrastructure to deal with it. So basically, each of these experts on different cars, suppose there's too much heterogeneity there, then some cars are not used enough compared to the other cars. So then your efficiency and inference is not good enough. Of course, there are other ways to deal with that. For example, you can provision more GPUs for one of the experts than the other experts. I think actually,"},{"start":2916.65,"text":"I think in a wealth deep-seek paper, they even say that they have a dynamical way to change how many GPUs are used for each of the experts. For example, in the US daytime, some of the experts becomes more often used and then they provision more GPUs for them. Then the China time, I think most likely because of the language, one of the use cases shifted and some of the other experts becomes more activated and more used and then"},{"start":2946.27,"text":"they provision more GPUs for those kind of experts."},{"start":2950.65,"text":"I don't know whether that's exactly the case"},{"start":2952.29,"text":"in all of the models, but that was reported"},{"start":2955.51,"text":"in some of the papers and blog posts."},{"start":2970.43,"text":"Yeah, because I think eventually it's all about,"},{"start":2973.37,"text":"In some sense, eventually it's all about efficiency."},{"start":2976.37,"text":"At least one of the reason is that you do this,"}],"speech_gaps":[{"start":2948.65,"end":2950.25},{"start":2959.632,"end":2961.36}],"frame":"../frames/v044/017.webp","frame_time":2813.03},{"title":"参数数量与计算资源的权衡","segments":[{"id":473,"text":"then you can have a lot more total number of parameters,","zh":"那么你就可以拥有更多的总参数数量，","start":2980.27,"end":2983.37},{"id":474,"text":"but your compute at the inference time","zh":"但你在推理时的计算量","start":2983.91,"end":2986.97},{"id":475,"text":"or the training time is still somewhat small controlled.","zh":"或训练时的计算量仍然可以被较好地控制。","start":2986.97,"end":2989.43},{"id":476,"text":"For example, if you have 30B active 3B,","zh":"例如，如果你有300亿个活跃的30亿参数模型，","start":2989.73,"end":2993.43},{"id":477,"text":"even though you have 30B parameters,","zh":"即使你有300亿个参数，","start":2993.63,"end":2995.13},{"id":478,"text":"but your computation is only 3B for each of the sequence.","zh":"但你每个序列的计算量仅为30亿。","start":2995.39,"end":2998.85},{"id":479,"text":"So you can have like smaller compute,","zh":"因此你可以拥有更小的计算量，","start":2999.75,"end":3002.05},{"id":480,"text":"but still a lot more parameters.","zh":"但仍然拥有更多的参数。","start":3002.05,"end":3003.65},{"id":481,"text":"Yeah, but that's only memory, right?","zh":"是的，但那只是内存的问题，对吧？","start":3011.29,"end":3015.19},{"id":482,"text":"So you only load them in the memory,","zh":"所以你只需要将它们加载到内存中，","start":3015.23,"end":3016.39},{"id":483,"text":"but you don't have to do the actual compute.","zh":"但你不需要实际进行计算。","start":3016.55,"end":3018.25},{"id":484,"text":"So if you have compute bounded in the test time,","zh":"因此，如果你在测试时计算资源有限，","start":3018.53,"end":3021.81},{"id":485,"text":"then this is a benefit.","zh":"那么这就是一个优势。","start":3021.89,"end":3023.65},{"id":486,"text":"For example, if you do a full dense,","zh":"例如，如果你进行完整的密集计算，","start":3023.89,"end":3026.53},{"id":487,"text":"like the standard kind of like,","zh":"就像标准的那种方式，","start":3027.03,"end":3028.63},{"id":488,"text":"suppose your parameter is one trillion, let's say.","zh":"假设你的参数数量是一万亿，比如说。","start":3028.67,"end":3030.53},{"id":489,"text":"I think this and this is not a mix of expert just one trillion literally","zh":"我认为这和这并不是一个专家混合模型，而是字面意义上的一万亿","start":3030.53,"end":3034.27},{"id":490,"text":"I think it's almost no chance to serve it in real life because your latency for","zh":"我认为在现实生活中几乎不可能使用它，因为你的延迟","start":3034.27,"end":3039.27},{"id":491,"text":"for serving the model will just be too way way too too long and and also the","zh":"用于服务模型的延迟将过于漫长，而且","start":3039.79,"end":3044.69},{"id":492,"text":"Cost of serving the model will be too expensive and your model","zh":"服务模型的成本也会过于昂贵，你的模型","start":3044.69,"end":3048.69},{"id":493,"text":"the price on your website becomes really too high so that nobody use it. So that's why a $1 trillion non-MOE model is almost impossible. But if you do $1 trillion parameters, but you have active maybe 30B, then that's more like a 30B model. But you still enjoy the increase of the number of parameters. OK.","zh":"在你网站上的价格变得非常高，以至于没有人会使用它。这就是为什么一个一万亿参数的非MOE模型几乎不可能。但如果是一万亿参数，但你只激活了大约300亿参数，那么这就更像是一个300亿参数的模型。但你仍然享受参数数量的增加。好的。","start":3049.75,"end":3076.67},{"id":494,"text":"So, we have 20 minutes.","zh":"所以我们有20分钟。","start":3077.23,"end":3078.23},{"id":495,"text":"I think that's probably enough for the rest of","zh":"我认为这可能足以应对剩下的","start":3078.35,"end":3079.77},{"id":496,"text":"the things which are somewhat easier.","zh":"那些相对更容易的事情。","start":3079.77,"end":3082.79},{"id":497,"text":"So, now I'm going to move on to a few ways to kind of like","zh":"所以，现在我要继续介绍几种类似的方法","start":3085.01,"end":3089.45},{"id":498,"text":"adapt or use the large-language models","zh":"来适应或使用大型语言模型","start":3090.13,"end":3093.47},{"id":499,"text":"for different use cases like downstream.","zh":"用于不同的应用场景，比如下游任务。","start":3095.15,"end":3097.49},{"id":500,"text":"So, let's say you have already","zh":"假设你已经","start":3098.97,"end":3100.63},{"id":501,"text":"pre-trained your large-language model and now you want to use it","zh":"预训练了你的大型语言模型，现在你想用它","start":3100.63,"end":3102.83},{"id":502,"text":"for a downstream dataset, maybe sentiment analysis,","zh":"处理一个下游数据集，比如情感分析，","start":3102.83,"end":3105.47},{"id":503,"text":"Maybe computing some kind of like doing some of your tasks, right? So what are the ways to do that? So","zh":"或者执行一些任务，对吧？那么有哪些方法可以做到这一点？所以","start":3105.47,"end":3112.19},{"id":504,"text":"Some of this, you know may sound kind of like out of date, you know, but","zh":"其中一些方法听起来可能有点过时，你知道的，但","start":3113.93,"end":3117.11},{"id":505,"text":"They are still useful in various cases. So one of the ways to do it is so called in context learning","zh":"它们在各种情况下仍然很有用。因此，一种方法被称为上下文学习","start":3118.37,"end":3123.55},{"id":506,"text":"So let's say suppose you have a new","zh":"所以假设你有一个新的","start":3129.01,"end":3131.07},{"id":507,"text":"Downstream task. Let's say you have some examples like X","zh":"下游任务。假设你有一些例子像 X","start":3132.05,"end":3134.87},{"id":508,"text":"x1, y1 up to xn, yn.","zh":"x1, y1 到 xn, yn。","start":3138.81,"end":3145.05},{"id":509,"text":"This is a downstream task.","zh":"这是一个下游任务。","start":3145.27,"end":3146.65},{"id":510,"text":"You have already trained your large English model.","zh":"你已经训练好了你的大型英文模型。","start":3146.81,"end":3148.13},{"id":511,"text":"How do you try to make sure your models can predict y given x?","zh":"你如何确保你的模型可以根据 x 预测 y？","start":3148.55,"end":3152.13},{"id":512,"text":"That's my question. The way people do it within","zh":"这就是我的问题。人们在","start":3152.73,"end":3156.51},{"id":513,"text":"context learning is that you literally just","zh":"上下文学习的要点是你 literally 只是","start":3156.51,"end":3158.81}],"notes":["本段讨论了参数数量与计算资源之间的权衡。讲者指出，虽然模型可以拥有大量参数，但实际计算资源（如内存和推理时间）可能仍然有限。例如，即使模型有300亿个参数，但实际计算可能只需要30亿次操作，因此可以实现较小的计算开销，同时保持较大的参数数量。","讲者进一步指出，如果模型参数数量达到万亿级别，那么在实际应用中可能难以部署，因为延迟和成本过高，导致模型无法被用户使用。因此，虽然参数数量增加可以提升模型能力，但计算资源的限制使得这种模型在实际中难以应用。","讲者提到，如果模型采用混合专家（MOE）结构，可以只激活部分参数，从而减少计算开销，同时保持较大的参数数量。这种结构在实际部署中更具可行性。","接下来，讲者转向讨论如何利用预训练的大语言模型进行下游任务。讲者提到，一种方法是上下文学习（in-context learning），即通过提供示例数据（如输入-输出对）来让模型进行推理。","讲者给出一个具体的例子，假设有一个下游任务，包含多个输入-输出对（x1, y1）到（xn, yn）。讲者询问如何确保模型能够根据输入x预测输出y。这表明，上下文学习是一种通过示例数据来引导模型进行推理的方法。","讲者强调，虽然某些方法可能听起来过时，但它们在实际应用中仍然有用。这表明，上下文学习等方法在特定场景下仍然具有价值。"],"formulas":[],"uncertainties":["30B active 3B","way way too too long","Cost of serving the model will be too expensive and your model","the price on your website becomes really too high so that nobody use it"],"diagram":"none","start":2980.27,"end":3158.81,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":2980.27,"text":"then you can have a lot more total number of parameters,"},{"start":2983.91,"text":"but your compute at the inference time"},{"start":2986.97,"text":"or the training time is still somewhat small controlled."},{"start":2989.73,"text":"For example, if you have 30B active 3B,"},{"start":2993.63,"text":"even though you have 30B parameters,"},{"start":2995.39,"text":"but your computation is only 3B for each of the sequence."},{"start":2999.75,"text":"So you can have like smaller compute,"},{"start":3002.05,"text":"but still a lot more parameters."},{"start":3011.29,"text":"Yeah, but that's only memory, right?"},{"start":3015.23,"text":"So you only load them in the memory,"},{"start":3016.55,"text":"but you don't have to do the actual compute."},{"start":3018.53,"text":"So if you have compute bounded in the test time,"},{"start":3021.89,"text":"then this is a benefit."},{"start":3023.89,"text":"For example, if you do a full dense,"},{"start":3027.03,"text":"like the standard kind of like,"},{"start":3028.67,"text":"suppose your parameter is one trillion, let's say."},{"start":3030.53,"text":"I think this and this is not a mix of expert just one trillion literally"},{"start":3034.27,"text":"I think it's almost no chance to serve it in real life because your latency for"},{"start":3039.79,"text":"for serving the model will just be too way way too too long and and also the"},{"start":3044.69,"text":"Cost of serving the model will be too expensive and your model"},{"start":3049.75,"text":"the price on your website becomes really too high so that nobody use it. So that's why a $1 trillion non-MOE model is almost impossible. But if you do $1 trillion parameters, but you have active maybe 30B, then that's more like a 30B model. But you still enjoy the increase of the number of parameters. OK."},{"start":3077.23,"text":"So, we have 20 minutes."},{"start":3078.35,"text":"I think that's probably enough for the rest of"},{"start":3079.77,"text":"the things which are somewhat easier."},{"start":3085.01,"text":"So, now I'm going to move on to a few ways to kind of like"},{"start":3090.13,"text":"adapt or use the large-language models"},{"start":3095.15,"text":"for different use cases like downstream."},{"start":3098.97,"text":"So, let's say you have already"},{"start":3100.63,"text":"pre-trained your large-language model and now you want to use it"},{"start":3102.83,"text":"for a downstream dataset, maybe sentiment analysis,"},{"start":3105.47,"text":"Maybe computing some kind of like doing some of your tasks, right? So what are the ways to do that? So"},{"start":3113.93,"text":"Some of this, you know may sound kind of like out of date, you know, but"},{"start":3118.37,"text":"They are still useful in various cases. So one of the ways to do it is so called in context learning"},{"start":3129.01,"text":"So let's say suppose you have a new"},{"start":3132.05,"text":"Downstream task. Let's say you have some examples like X"},{"start":3138.81,"text":"x1, y1 up to xn, yn."},{"start":3145.27,"text":"This is a downstream task."},{"start":3146.81,"text":"You have already trained your large English model."},{"start":3148.55,"text":"How do you try to make sure your models can predict y given x?"},{"start":3152.73,"text":"That's my question. The way people do it within"},{"start":3156.51,"text":"context learning is that you literally just"}],"speech_gaps":[],"frame":"../frames/v044/018.webp","frame_time":2992.27},{"title":"使用序列格式进行文本生成的示例","segments":[{"id":514,"text":"concatenate all of this into a sequence of text.","zh":"将所有这些内容连接成一个文本序列。","start":3158.81,"end":3162.25},{"id":515,"text":"So, you just concatenate and sometimes with some kind of like","zh":"所以，你只需要连接起来，有时会带有一些类似","start":3162.25,"end":3170.45},{"id":516,"text":"Actually, concatenate is a little bit complex. Maybe let me just be explicit. You concatenate with some format. For example, you can say a question Q. This is literally the string you send to the large English model. You say a question Q and your X task, sorry, X1. And then you say A semicolon Y1. And you just keep doing this. So, for example, in the...","zh":"实际上，连接是一个有点复杂的过程。也许让我更明确一点。你以某种格式进行连接。例如，你可以这样说一个问题 Q。这实际上是你要发送给大型英文模型的字符串。你说一个问题 Q 和你的 X 任务，抱歉，X1。然后你说 A 分号 Y1。然后你继续这样做。例如，在……","start":3171.43,"end":3197.06},{"id":517,"text":"You can do this, for example. This is an example that is kind of interesting. So you can say Q 2 3 is equal to question mark A 5 Q 6. And you write this down, and you can see. OK, so now you have a few of these kind of cases. And then you have Q 15 2. And this is your test example. This is X test.","zh":"你可以这样做，例如。这是一个有点有趣的例子。你可以这样说 Q 2 3 等于问号 A 5 Q 6。然后你写下这个，你可以看到。好的，现在你有几个这样的例子。然后你有 Q 15 2。这是你的测试例子。这是 X 测试。","start":3198.91,"end":3227.93},{"id":518,"text":"Everything above it is training. This is training, so-called training, or in-context training. Okay, abstractly speaking, you just write an X test at the end, and then you have A, and you hope it will fill in the numbers you want. So in this example, I think you are all humans, you can probably guess what this should be, right?","zh":"它上面的所有内容都是训练。这是所谓的训练，或者上下文训练。抽象地说，你只需在最后写出一个 X 测试，然后你有 A，你希望它能填入你想要的数字。在这个例子中，我想你们所有人都是人类，你们可能可以猜出这个应该是什么，对吧？","start":3229.06,"end":3253.96},{"id":519,"text":"tilde 3, 5, 6, tilde 7, 13. I think most people will guess 17, right? Because this seems to be, you should interpret this as plus. So that's the learning part, right? You are learning what the symbol means. And most people can, humans can somewhat guess, not exactly, but somewhat guess that this is.","zh":"大约 3，5，6，大约 7，13。我想大多数人会猜 17，对吧？因为这看起来像是加法。这就是学习的部分，对吧？你在学习符号的含义。大多数人可以，人类可以大致猜测，不完全准确，但大致猜测这是。","start":3255.55,"end":3279.33},{"id":520,"text":"plus, you learn plus from two examples, and then you can, in a test time, you guess it's actually plus, you guess 17. And it turns out that the models can do that as well.","zh":"加法，你从两个例子中学习加法，然后在测试时，你猜测它实际上是加法，你猜测 17。结果发现模型也可以做到这一点。","start":3280.07,"end":3291.13},{"id":521,"text":"from showing a few examples. So, of course, these days, doing this is kind of like, you should just tell it, you don't have to actually learn this kind of simple class. But some of the other use cases could be like, for example, if you want to do sentiment classification, or maybe you want to classify your messages into...","zh":"通过展示几个例子。所以，当然，现在这样做有点像，你应该直接告诉它，你不需要实际学习这种简单的类别。但其他的一些用例可能是，例如，如果你想进行情感分类，或者也许你想将你的消息分类到……","start":3291.97,"end":3310.31}],"notes":["本段讲解了如何通过将问题和任务格式化为序列，输入到大型语言模型中进行推理。例如，将问题Q、任务X1、答案A和标签Y1以特定格式串联，形成输入字符串。这种格式化方式允许模型在训练和测试时进行推理。","讲者通过一个具体的例子说明了这种格式化方法。例如，输入Q 2 3 = ? A 5 Q 6，模型需要根据已有的例子推断出正确的答案。这种例子展示了模型如何通过学习符号的含义来进行推理。","讲者指出，人类在面对类似问题时，可以大致猜测出答案，例如将Q 15 2视为加法运算，得出结果17。这表明模型在学习符号含义后，可以像人类一样进行推理。","讲者提到，虽然对于简单的任务，如加法，模型可能不需要学习，但其他更复杂的任务，如情感分类，可能需要通过这种方式进行训练。","讲者强调了这种格式化方法的灵活性，可以应用于不同的任务，如分类、推理等，而不仅仅是简单的数学运算。","讲者指出，这种格式化方法的核心在于将问题和任务以特定的序列形式输入模型，使模型能够根据已有的例子进行推理和预测。"],"formulas":[],"uncertainties":["tilde 3, 5, 6, tilde 7, 13"],"diagram":"none","start":3158.81,"end":3310.31,"asr_flags":[515],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3158.81,"text":"concatenate all of this into a sequence of text."},{"start":3162.25,"text":"So, you just concatenate and sometimes with some kind of like"},{"start":3171.43,"text":"Actually, concatenate is a little bit complex. Maybe let me just be explicit. You concatenate with some format. For example, you can say a question Q. This is literally the string you send to the large English model. You say a question Q and your X task, sorry, X1. And then you say A semicolon Y1. And you just keep doing this. So, for example, in the..."},{"start":3198.91,"text":"You can do this, for example. This is an example that is kind of interesting. So you can say Q 2 3 is equal to question mark A 5 Q 6. And you write this down, and you can see. OK, so now you have a few of these kind of cases. And then you have Q 15 2. And this is your test example. This is X test."},{"start":3229.06,"text":"Everything above it is training. This is training, so-called training, or in-context training. Okay, abstractly speaking, you just write an X test at the end, and then you have A, and you hope it will fill in the numbers you want. So in this example, I think you are all humans, you can probably guess what this should be, right?"},{"start":3255.55,"text":"tilde 3, 5, 6, tilde 7, 13. I think most people will guess 17, right? Because this seems to be, you should interpret this as plus. So that's the learning part, right? You are learning what the symbol means. And most people can, humans can somewhat guess, not exactly, but somewhat guess that this is."},{"start":3280.07,"text":"plus, you learn plus from two examples, and then you can, in a test time, you guess it's actually plus, you guess 17. And it turns out that the models can do that as well."},{"start":3291.97,"text":"from showing a few examples. So, of course, these days, doing this is kind of like, you should just tell it, you don't have to actually learn this kind of simple class. But some of the other use cases could be like, for example, if you want to do sentiment classification, or maybe you want to classify your messages into..."}],"speech_gaps":[],"frame":"../frames/v044/019.webp","frame_time":3170.81},{"title":"使用示例进行分类任务的说明","segments":[{"id":522,"text":"Suppose you have an email, you want to classify it into billing, technical, and accounting, something like that. You want to classify your emails into different things. And what we can do is you can say, this is another way to write your future learning prompt. So you can say, classify my messages into, maybe I say, A, B, C.","zh":"假设你有一封电子邮件，你想将其分类为账单、技术类和会计类，类似这样的类别。你想将你的电子邮件分类到不同的类别中。而我们可以这样做，你可以将这种方式视为你未来学习提示的另一种写法。因此，你可以这样说，将我的消息分类为，也许我说，A、B、C。","start":3310.78,"end":3340.17},{"id":523,"text":"I mean, I'm even making it harder. I say I have three classes, class A, class B, and class C. I didn't even tell it what class means. And then, I have example one, which is like a message, which is like a message one, and then you say the output is A. And you have another message, and then you say the output is B, so on and so forth. And you give a few of these examples. And then, in the test time, you just prepend,","zh":"我的意思是，我甚至让它变得更难了。我说我有三个类别，类别A、类别B和类别C。我甚至没有告诉它类别意味着什么。然后，我有一个例子，即一条消息，类似于消息一，然后你说输出是A。你还有另一条消息，然后你说输出是B，依此类推。你给出几个这样的例子。然后，在测试时，你只需在前面加上一些更多的消息，然后有一个输出，然后你让大型语言模型来填空，生成下一个标记。所有这些都是预填充，这是为了生成。而语言模型可以做到的是，它可以从这些例子中推断出A和B意味着什么。它会推断出A似乎意味着这是一封账单邮件，而B似乎意味着……","start":3340.73,"end":3372.13},{"id":524,"text":"some more message, and then you have an output, and then you ask the large language model to fill the blank, to generate the next token. So all of these are pre-filling, and this is to generate. And what the language model can do is it can figure out what A and B means from these examples. It figures out A seems to mean that it's a bidding email, and B seems to...","zh":"这意味着这是一封技术类的邮件，也许是一封客户服务邮件，对吧？然后最终，它会给你正确的标签。当然，在大多数情况下，人们并不会真正隐藏这些信息。即使你隐藏了，它也能工作。但更昂贵的方式是，你直接告诉它。你可以说，这是账单类，这是技术类。你让语言模型更容易理解。然后，语言模型会……","start":3372.78,"end":3397.54},{"id":525,"text":"means that it's a technical, maybe like a customer service email, right? And then eventually, it will give you the right label. Of course, in most cases, people don't actually hide this. Even if you hide it, it can work. But the more expensive way is that you just actually tell it. You just have, say, this is billing. And this is technical. You make it even easier for the language model. And then the language model will...","zh":"这意味着它是一个技术性的，可能像客户邮件这样的内容，对吧？然后最终它会给你正确的标签。当然，在大多数情况下，人们并不会真正隐藏这些信息。即使你隐藏了，它也能起作用。但更昂贵的方式是，你直接告诉它。比如说，你直接说明这是账单类，这是技术类。你让语言模型更容易处理。然后语言模型就会...","start":3398.11,"end":3424.57},{"id":526,"text":"learn it even easier and it will probably ask,","zh":"实际上，有时它也是微妙的，意思是你可能需要某种程度的……","start":3425.52,"end":3427.86},{"id":527,"text":"actually sometimes it's also subtle in the sense that maybe you have to kind of","zh":"比如，什么是账单的定义，这种微妙性有点像……","start":3427.92,"end":3430.58},{"id":528,"text":"like what's the definition of billing is kind of like a level of subtle,","zh":"然后，模型可以从这些例子中学习……","start":3430.58,"end":3434.88},{"id":529,"text":"then the models can learn from these examples,","zh":"然后模型可以从这些例子中学习，","start":3435.08,"end":3438.78},{"id":530,"text":"you know, what are the definition of billing emails?","zh":"你知道，什么是账单邮件的定义？","start":3438.94,"end":3441.64},{"id":531,"text":"Because I've seen a few examples of billing emails and then you see,","zh":"因为我见过一些账单邮件的例子，然后你就会看到，","start":3441.84,"end":3445.2},{"id":532,"text":"oh, this is like an average email like with this kind of format or with this type,","zh":"哦，这就像一封普通的邮件，具有这种格式或这种类型，","start":3445.28,"end":3451.36},{"id":533,"text":"I will classify them as billing emails.","zh":"我会将它们归类为账单邮件。","start":3451.52,"end":3453.28},{"id":534,"text":"those. So in some sense, it's kind of like a very similar to teaching people through","zh":"这些。所以在某种意义上，这有点像通过例子来教人，","start":3453.9,"end":3459.1},{"id":535,"text":"examples, right? If you want to teach somebody what's the definition of billing, what's","zh":"对吧？如果你想教别人什么是账单，什么是账单邮件，什么是客户服务邮件，你给他们看例子，他们就会","start":3459.54,"end":3462.36},{"id":536,"text":"a billing email, what's a customer service email, you show them examples and they will","zh":"明白，你知道，之后如何去做。","start":3462.36,"end":3467.46},{"id":537,"text":"figure out, you know, how to do it afterwards.","zh":"弄清楚，你知道，之后怎么做。","start":3467.46,"end":3469.14},{"id":538,"text":"afterwards.","zh":"之后。","start":3469.14,"end":3469.26},{"id":539,"text":"If you can teach with examples, yes.","zh":"如果你能用例子来教学，是的。","start":3481.08,"end":3483.0},{"id":540,"text":"Yeah, thank you.","zh":"是的，谢谢。","start":3483.3,"end":3484.0},{"id":541,"text":"you'll see even in the next part,","zh":"你将会在下一部分看到，","start":3484.14,"end":3486.5},{"id":542,"text":"it might be even easier than this.","zh":"它可能比这更容易。","start":3486.6,"end":3488.14}],"notes":["本段讲解了如何通过示例来训练语言模型进行分类任务。讲者以邮件分类为例，说明了如何通过提供带有标签的示例，让模型学习如何对新消息进行分类。","讲者提到，模型可以通过这些示例推断出类别A、B、C的含义，例如A可能代表账单邮件，B可能代表技术类邮件。模型会根据示例中的模式进行推理，从而生成正确的标签。","讲者指出，虽然模型可以基于示例进行学习，但有时需要更明确的定义，例如明确说明什么是账单邮件，这样模型可以更容易地理解任务。","讲者还提到，通过示例教学类似于人类的学习方式，即通过展示例子来帮助理解概念。例如，通过展示多个账单邮件的示例，模型可以学习到账单邮件的特征。","讲者强调，使用示例进行教学是一种有效的方法，但有时可能需要更直接的指导，例如明确告诉模型每个类别的定义，以提高学习效率。","最后，讲者提到，接下来的内容可能会展示更简单的方法，说明在实际应用中，可能有更高效的分类策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3310.78,"end":3488.14,"asr_flags":[538],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":3310.78,"text":"Suppose you have an email, you want to classify it into billing, technical, and accounting, something like that. You want to classify your emails into different things. And what we can do is you can say, this is another way to write your future learning prompt. So you can say, classify my messages into, maybe I say, A, B, C."},{"start":3340.73,"text":"I mean, I'm even making it harder. I say I have three classes, class A, class B, and class C. I didn't even tell it what class means. And then, I have example one, which is like a message, which is like a message one, and then you say the output is A. And you have another message, and then you say the output is B, so on and so forth. And you give a few of these examples. And then, in the test time, you just prepend,"},{"start":3372.78,"text":"some more message, and then you have an output, and then you ask the large language model to fill the blank, to generate the next token. So all of these are pre-filling, and this is to generate. And what the language model can do is it can figure out what A and B means from these examples. It figures out A seems to mean that it's a bidding email, and B seems to..."},{"start":3398.11,"text":"means that it's a technical, maybe like a customer service email, right? And then eventually, it will give you the right label. Of course, in most cases, people don't actually hide this. Even if you hide it, it can work. But the more expensive way is that you just actually tell it. You just have, say, this is billing. And this is technical. You make it even easier for the language model. And then the language model will..."},{"start":3425.52,"text":"learn it even easier and it will probably ask,"},{"start":3427.92,"text":"actually sometimes it's also subtle in the sense that maybe you have to kind of"},{"start":3430.58,"text":"like what's the definition of billing is kind of like a level of subtle,"},{"start":3435.08,"text":"then the models can learn from these examples,"},{"start":3438.94,"text":"you know, what are the definition of billing emails?"},{"start":3441.84,"text":"Because I've seen a few examples of billing emails and then you see,"},{"start":3445.28,"text":"oh, this is like an average email like with this kind of format or with this type,"},{"start":3451.52,"text":"I will classify them as billing emails."},{"start":3453.9,"text":"those. So in some sense, it's kind of like a very similar to teaching people through"},{"start":3459.54,"text":"examples, right? If you want to teach somebody what's the definition of billing, what's"},{"start":3462.36,"text":"a billing email, what's a customer service email, you show them examples and they will"},{"start":3467.46,"text":"figure out, you know, how to do it afterwards."},{"start":3469.14,"text":"afterwards."},{"start":3481.08,"text":"If you can teach with examples, yes."},{"start":3483.3,"text":"Yeah, thank you."},{"start":3484.14,"text":"But actually, you'll see even in the next part,"},{"start":3486.6,"text":"it might be even easier than this."}],"speech_gaps":[{"start":3477.232,"end":3479.76}],"frame":"../frames/v044/020.webp","frame_time":3322.78},{"title":"强化学习基础与策略梯度","segments":[{"id":543,"text":"Like, yeah, but yes, you know,","zh":"像，是的，但没错，你知道，","start":3489.2,"end":3490.86},{"id":544,"text":"in theory, you can teach everything like this.","zh":"从理论上讲，你可以用这种方式来教所有东西。","start":3490.86,"end":3492.64},{"id":545,"text":"You don't have to even.","zh":"你甚至不需要这样做。","start":3492.74,"end":3493.36},{"id":546,"text":"So, and here, okay, one very important thing","zh":"所以，这里，好的，一个非常重要的点是","start":3493.58,"end":3495.86},{"id":547,"text":"is that you are not updating the parameters of the model.","zh":"你并不是在更新模型的参数。","start":3496.3,"end":3498.68},{"id":548,"text":"You are only giving the examples in the context as a string to the model.","zh":"你只是将上下文中的例子作为字符串提供给模型。","start":3498.68,"end":3504.62},{"id":549,"text":"The model is not updated at all, so there's no...","zh":"模型根本没有被更新，因此没有...","start":3504.74,"end":3507.22},{"id":550,"text":"Sometimes the fundamental intelligence is probably not...","zh":"有时候，根本的智能可能并不是...","start":3512.36,"end":3515.14},{"id":551,"text":"If you believe that the intelligence comes from the model parameters, then the model parameters are not updated.","zh":"如果你认为智能来自于模型参数，那么模型参数就不会被更新。","start":3515.14,"end":3520.16},{"id":552,"text":"So in some sense,","zh":"所以在某种意义上，","start":3520.34,"end":3520.94},{"id":553,"text":"if you believe that's the case, then it shouldn't really improve the fundamental capabilities that much.","zh":"如果你相信这种情况，那么它不应该在很大程度上提升基本能力。","start":3522.16,"end":3527.76},{"id":554,"text":"much, it's more like you are learning the styles or some simple definitions to some degree.","zh":"很大程度上，它更像是你在学习风格或某种程度上的简单定义。","start":3527.76,"end":3533.68},{"id":555,"text":"Of course, you can also learn some of the hard ones, but how hard it is,","zh":"当然，你也可以学习一些较难的内容，但有多难，","start":3534.8,"end":3538.94},{"id":556,"text":"for example, suppose this message is like, let's say, it's about medical images,","zh":"例如，假设这条信息像这样，比如说，它是关于医学图像的，","start":3539.04,"end":3548.34},{"id":557,"text":"like something like you have a scan and you want to classify whether it's a cancer or not,","zh":"比如你有一个扫描图像，想要分类它是否是癌症，","start":3548.58,"end":3552.74},{"id":558,"text":"something like that. I don't think showing a few examples can work. You still have to do some","zh":"类似这样的情况。我认为仅仅展示几个例子是无法奏效的。你仍然需要进行一些","start":3552.82,"end":3556.72},{"id":559,"text":"In this case, like always in this case,","zh":"在这种情况下，就像在所有这种情况下一样，","start":3556.72,"end":3559.38},{"id":560,"text":"are we not training anything?","zh":"我们不是在训练任何东西吗？","start":3559.46,"end":3560.58},{"id":561,"text":"We're not training anything, right?","zh":"我们根本没有在训练任何东西，对吧？","start":3561.0,"end":3563.5},{"id":562,"text":"We are just prompting it.","zh":"我们只是在提示它。","start":3563.56,"end":3564.78},{"id":563,"text":"So a more extreme version is that you can","zh":"更极端的情况是，你可以","start":3566.44,"end":3568.66},{"id":564,"text":"prompt it without even seeing examples.","zh":"在没有看到任何示例的情况下进行提示。","start":3568.66,"end":3570.4},{"id":565,"text":"You can just tell it what is the task.","zh":"你只需告诉它任务是什么。","start":3570.68,"end":3572.9},{"id":566,"text":"So you can just say,","zh":"所以你只需说，","start":3573.28,"end":3574.44},{"id":567,"text":"you just erase all of these.","zh":"你只需要擦除所有这些内容。","start":3574.54,"end":3575.96},{"id":568,"text":"You just say classified messages into","zh":"你只需要将分类信息分为","start":3576.02,"end":3577.94},{"id":569,"text":"billing and technical service so and so forth.","zh":"账单和技术服务等等。","start":3577.94,"end":3582.4},{"id":570,"text":"And then you probably define text.","zh":"然后你可能定义文本。","start":3582.64,"end":3583.94},{"id":571,"text":"text and you just describe what each of","zh":"文本，并且你只需尽可能详细地描述每个","start":3583.94,"end":3586.68},{"id":572,"text":"these labels mean in text as much as possible,","zh":"这些标签在文本中的含义，","start":3586.68,"end":3589.08},{"id":573,"text":"but you don't show any examples at all,","zh":"但你根本不展示任何例子，","start":3589.3,"end":3591.36},{"id":574,"text":"and that's called zero-shot.","zh":"这被称为零样本。","start":3591.52,"end":3592.92},{"id":575,"text":"So zero-shot.","zh":"所以是零样本。","start":3596.02,"end":3596.46},{"id":576,"text":"means that you just have a task description.","zh":"这意味着你只需要一个任务描述。","start":3608.26,"end":3610.18},{"id":577,"text":"Sometimes the cost can be long,","zh":"有时候成本可能很高，","start":3611.72,"end":3613.42},{"id":578,"text":"and then you just let the model generate the answer. That's it.","zh":"然后你只需让模型生成答案。这就完了。","start":3614.42,"end":3617.44},{"id":579,"text":"So just give the task solution and then the model would keep generating.","zh":"所以只需提供任务的解决方案，然后模型就会继续生成。","start":3617.86,"end":3621.04},{"id":580,"text":"That's it. Sometimes you can tell the models what's the output format you want.","zh":"这就完了。有时候你可以告诉模型你想要的输出格式是怎样的。","start":3622.78,"end":3626.78},{"id":581,"text":"Maybe you want some JSON output,","zh":"也许你想要某种JSON输出，","start":3626.88,"end":3628.2},{"id":582,"text":"you want some structure of output.","zh":"你想要某种输出结构。","start":3628.46,"end":3629.58},{"id":583,"text":"You just say, please generate in this format,","zh":"你只需要说，请以这种格式生成，","start":3629.76,"end":3631.88},{"id":584,"text":"and then it will generate.","zh":"然后它就会生成。","start":3632.12,"end":3634.56},{"id":585,"text":"That's probably our experiences with using ChatGPT.","zh":"这可能就是我们使用ChatGPT的经验。","start":3635.4,"end":3637.6},{"id":586,"text":"I feel like nobody really give them few-shot examples these days anymore,","zh":"我觉得现在没有人再给它们提供少样本示例了，","start":3637.6,"end":3640.94},{"id":587,"text":"except very special cases,","zh":"除非是非常特殊的情况，","start":3641.14,"end":3642.78},{"id":588,"text":"and you can just do zero-shot.","zh":"你甚至可以直接进行零样本生成。","start":3644.02,"end":3645.88},{"id":589,"text":"I think this is one of the biggest findings that from","zh":"我认为这是从少样本和零样本能力中得出的一个最大发现，","start":3649.36,"end":3652.16},{"id":590,"text":"the few-shot and zero-shot capabilities,","zh":"这些能力","start":3652.16,"end":3655.32},{"id":591,"text":"one of the biggest findings from the GPT-3 paper,","zh":"GPT-3论文中的一项最大发现，","start":3655.54,"end":3658.56},{"id":592,"text":"because this is","zh":"因为这一点","start":3661.36,"end":3663.7},{"id":593,"text":"kind of surprising because you never update the metal parameters.","zh":"有点令人惊讶，因为你从未更新金属参数。","start":3663.7,"end":3666.1},{"id":594,"text":"So for people who didn't see the GPT-3 paper,","zh":"对于没有看过GPT-3论文的人来说，","start":3666.1,"end":3669.14}],"notes":["本段讨论了模型在没有更新参数的情况下，仅通过提示（prompting）来完成任务的可能性。讲者指出，如果模型的智能来源于参数，那么不更新参数就不会显著提升其基本能力，而更多是学习风格或简单定义。","讲者以医疗图像分类为例，说明仅展示少量示例可能不足以让模型准确完成任务，强调了零样本（zero-shot）学习的局限性。","讲者提到零样本学习是指仅提供任务描述，不展示任何示例，让模型直接生成答案。这种做法在实际应用中可能需要更长的推理过程。","讲者指出，用户现在很少使用少样本（few-shot）示例，而是直接使用零样本方法，这可能是GPT-3论文中的一项重要发现。","讲者强调，零样本学习的实现并不涉及更新模型参数，这在某种程度上是令人惊讶的，因为模型的智能似乎并未通过参数更新来体现。","讲者最后提到，对于未阅读GPT-3论文的人来说，这种零样本学习的能力可能是一个重要的发现。"],"formulas":[],"uncertainties":["metal parameters"],"diagram":"none","start":3489.2,"end":3669.14,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":52,"raw_segments":[{"start":3489.2,"text":"Like, yeah, but yes, you know,"},{"start":3490.86,"text":"in theory, you can teach everything like this."},{"start":3492.74,"text":"You don't have to even."},{"start":3493.58,"text":"So, and here, okay, one very important thing"},{"start":3496.3,"text":"is that you are not updating the parameters of the model."},{"start":3498.68,"text":"You are only giving the examples in the context as a string to the model."},{"start":3504.74,"text":"The model is not updated at all, so there's no..."},{"start":3512.36,"text":"Sometimes the fundamental intelligence is probably not..."},{"start":3515.14,"text":"If you believe that the intelligence comes from the model parameters, then the model parameters are not updated."},{"start":3520.34,"text":"So in some sense,"},{"start":3522.16,"text":"if you believe that's the case, then it shouldn't really improve the fundamental capabilities that much."},{"start":3527.76,"text":"much, it's more like you are learning the styles or some simple definitions to some degree."},{"start":3534.8,"text":"Of course, you can also learn some of the hard ones, but how hard it is,"},{"start":3539.04,"text":"for example, suppose this message is like, let's say, it's about medical images,"},{"start":3548.58,"text":"like something like you have a scan and you want to classify whether it's a cancer or not,"},{"start":3552.82,"text":"something like that. I don't think showing a few examples can work. You still have to do some"},{"start":3556.72,"text":"In this case, like always in this case,"},{"start":3559.46,"text":"are we not training anything?"},{"start":3561.0,"text":"We're not training anything, right?"},{"start":3563.56,"text":"We are just prompting it."},{"start":3566.44,"text":"So a more extreme version is that you can"},{"start":3568.66,"text":"prompt it without even seeing examples."},{"start":3570.68,"text":"You can just tell it what is the task."},{"start":3573.28,"text":"So you can just say,"},{"start":3574.54,"text":"you just erase all of these."},{"start":3576.02,"text":"You just say classified messages into"},{"start":3577.94,"text":"billing and technical service so and so forth."},{"start":3582.64,"text":"And then you probably define text."},{"start":3583.94,"text":"text and you just describ
