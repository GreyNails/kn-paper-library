":317.26,"text":"So actually, you only have to store the K and V,"},{"start":319.52,"text":"you don't have to store Q because as you are generating more and more,"},{"start":322.62,"text":"you can drop some of these Qs in the generation process."},{"start":325.42,"text":"Because only the Qs for the last step is needed,"},{"start":328.12,"text":"needed but the case for all the previous steps"},{"start":329.96,"text":"is needed when you generate more and more."},{"start":332.22,"text":"But in any case, just the K and V requires linear int memory,"},{"start":337.4,"text":"and that's why it's called KV cache."},{"start":339.2,"text":"I guess you probably have heard of this word."},{"start":340.68,"text":"So basically, you have to save all the Ks and"},{"start":342.6,"text":"Vs for every head in the memory."},{"start":345.82,"text":"And this is a huge storage space."},{"start":349.84,"text":"Basically this restricts, from a system perspective,"},{"start":353.92,"text":"the details are complicated,"},{"start":355.58,"text":"but let me give you the high-level thing."},{"start":357.48,"text":"So because you have to save all of this,"}],"speech_gaps":[],"frame":"../frames/v044/002.webp","frame_time":194.29},{"title":"KV缓存与内存限制对批量大小的影响","segments":[{"id":82,"text":"you cannot, they take a lot of memory, GPU memory,"},{"id":83,"text":"and that makes it very hard for you to have"},{"id":84,"text":"a lot of examples in your batch,"},{"id":85,"text":"a lot of sequences in your batch."},{"id":86,"text":"So in some cases, even just saving the KV cache"},{"id":87,"text":"for the one single sequence will use up most of your memory."},{"id":88,"text":"Or maybe you can save like 10 sequences,"},{"id":89,"text":"or maybe 100 sequences, something like that."},{"id":90,"text":"But there's a limit on how many sequences you can save in your"},{"id":91,"text":"memory."},{"id":92,"text":"So basically, you cannot have a large batch size when you"},{"id":93,"text":"do the inference, because the r this queries, you're gonna use the same set of keys when you do the softmax. And the same thing for the values. So basically, once you have the attention matrix and then you apply to the values. So basically, the number of values is also the same as number of keys. So that's how you do it. So basically, in some sense, if I have to draw the inner product, I'm gonna do this."},{"id":140,"text":"And this one will also attend to this, and these queries will attend to all of this. Does conceptually make sense? Yes, so tau will be equal to two. Tau will be equal to nh divided by two. So if ng is two, as I draw here, I have only two groups, so then... Then tau is also two. But if nh is like 100, then tau would be 50. Right."}],"notes":["本段讲解了注意力机制中键（keys）、查询（queries）和值（values）之间的配对关系。讲者提到，通常情况下，查询的数量（NH）会比键的数量（NG）多，因此需要将查询分组，使得每个组的查询可以与一组键进行匹配。这种分组方式有助于在计算注意力权重时，使用相同的键集合进行softmax操作。","讲者进一步解释了如何通过引入一个比例因子τ（tau）来实现这种配对。τ表示每个键组对应的查询组的数量，即NH = τ × NG。这意味着每个键组可以被多个查询组所关注，从而实现更复杂的注意力机制。","在实际操作中，查询和值的数量通常与键的数量相同，这样可以确保注意力矩阵的维度匹配。讲者还提到，当计算内积时，每个查询都会与所有键进行交互，从而生成注意力权重。","讲者通过一个具体的例子来说明这种机制：当NG为2时，τ也为2，意味着每个键组对应两个查询组；当NH为100时，τ为50，意味着每个键组对应50个查询组。这种比例关系确保了查询和键之间的匹配性。","讲者强调，这种注意力机制的设计使得模型能够更有效地捕捉输入数据中的相关性，同时保持计算的效率。通过这种方式，模型可以动态地调整不同部分之间的注意力权重，从而提高整体性能。"],"formulas":[],"uncertainties":["NH is bigger than NG","NG divide NH","tau sequences of the queries will match to one sequence of the keys","tau multiplier, tau factors of more keys","the number of values is also the same as number of keys"],"diagram":"none","start":541.45,"end":705.95,"asr_flags":[],"raw_segments":[{"start":541.45,"text":"So this is like, maybe let me draw this."},{"start":543.39,"text":"So I have key 1, 1 up to key 1,"},{"start":548.55,"text":"T1. This is the first key and sequence of keys,"},{"start":553.77,"text":"and maybe let's just say I have two sequence of keys."},{"start":558.59,"text":"How do I- okay, maybe let's use a generic."},{"start":560.65,"text":"So let's say K1, say,"},{"start":566.07,"text":" y by n and you take a softmax."}],"notes":["本段讲解了注意力机制中分组查询的数学表示，包括查询矩阵、键矩阵和值矩阵的定义，以及如何通过分组索引将查询与对应的键进行匹配。","讲者提到通过将查询索引J减去1后除以tau，可以确定查询属于哪一个键组，这类似于一种分组机制。","在计算注意力权重时，需要将查询矩阵Qj与对应的组索引Gj进行转置相乘，然后除以归一化常数C，并乘以n后进行softmax操作。","讲者提到的“floor plus one”可能是指通过某种方式确定分组索引，但具体实现细节未明确。","讲者提到的“I-coin”可能是误听，实际可能是指某种分组或索引机制，但无法确定。","整个过程涉及矩阵运算和归一化操作，是注意力机制中的关键步骤。"],"formulas":[],"uncertainties":["I-coin","floor plus one"],"diagram":"none","start":713.25,"end":892.87,"asr_flags":[],"math_clarifications":["原始内容中提到的 Q_j 与 G_j 的关系、归一化常数 C 以及标量 n 的作用未明确，导致公式无法准确表达。需要更多上下文信息来正确推导公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":713.25,"text":"Yes, exactly, exactly. So mathematically, I think I can write them, but I don't think necessarily mathematically it really makes things easier. I think visually it's probably the easiest. But anyway, let me try to just quickly write down the mathematical equations. So just in case this is helpful for some other people. So I think one way to write it is that you say you have"},{"start":740.81,"text":"a sequence of like a query matrix. So this is like you, for each of these query matrix is kind of like one sequence here, and you group them into a matrix. So you say q1 j up to qt j. In this dimension is the time, and j is indexing which set of queries you have. And so j is from 1 to nh. And for keys,"},{"start":772.17,"text":"you have much fewer keys. So you say you have K1s up to Kts, but S is from 1 to Ng. And the same thing for V. You have V1s up to Vts, and S is from 1 to Ng. And then you define"},{"start":801.13,"text":"some mapping, you know, between how to use the more queries with the keys, right? So you say, for the J's query, you say this is mapped to GJ, which is defined to be this. Is this some I-coin? Okay, plus one. Did you hear it? Yes. Okay, I guess..."},{"start":834.49,"text":"Okay. Anyway, let's keep going and see."},{"start":836.55,"text":"So, so tau is the,"},{"start":839.63,"text":"the, the difference between these two, right?"},{"start":841.63,"text":"So basically, J minus one divided by tau is kind of like which group you,"},{"start":844.85,"text":"which kind of like key- set of keys you are matching to,"},{"start":848.01,"text":"and floor plus one."},{"start":849.39,"text":"So this is a number between one and NG, right?"},{"start":854.73,"text":"So basically, you're saying which group I'm in for this query J."},{"start":859.33,"text":"J is in one to NH."},{"start":862.95,"text":"So, and then once you know which group you belong to,"},{"start":865.97,"text":"and then you can do the- in a product."},{"start":870.43,"text":"So, Qj will be multiplied in a product with Gj transpose,"},{"start":877.05,"text":"where this is the index for the group,"},{"start":879.59,"text":"for the keys you have to attend to,"},{"start":882.85,"text":"and then you divide by C,"},{"start":886.29,"text":"this is the normalization constant,"},{"start":887.77,"text":"constant and you multiply by n and you take a softmax."}],"speech_gaps":[],"frame":"../frames/v044/005.webp","frame_time":725.25},{"title":"Softmax归一化常数C的选择","segments":[{"id":162,"text":"And then you multiply by vgj,"},{"id":163,"text":"use the same ID for the set of values,"},{"id":164,"text":"and this is the output for the j's hat."},{"id":165,"text":"So, you still have the same number has similar outputs,"},{"id":166,"text":"it's just like some of these outputs are using the same k."},{"id":167,"text":"So, that's the only difference."},{"id":168,"text":"Did I explain the C last time?"},{"id":169,"text":"The reason why we have a C is because we want to make"},{"id":170,"text":"sure the input to the softmax is more normalized."},{"id":171,"text":"So C is often chosen to be something like,"},{"id":172,"text":"this is a matrix like this inner product,"},{"id":173,"text":"no matter whether you have the GJ,"},{"id":174,"text":"or whether you have the group cores,"},{"id":175,"text":"or the standard multi-hydro tension,"},{"id":176,"text":"this inner product is always something like it's a T by DA."},{"id":177,"text":"and dh by t matrix. So basically,"},{"id":178,"text":"each entry is in a part of two vectors of dimension dH. Typically, C is chosen to be something like square root dH, and that's because if you have, suppose these two matrices are on the order of plus one minus one, then the inner product between two vectors, so you have two vectors, they're all dimension dH, and you take the inner product, most likely if they are random, then they're all on the order of square root dH."},{"id":179,"text":"So suppose you have two vectors, maybe say A, which is on the order of dimension dH, and B is on the dimension dH, and they are somewhat random, and each of the entries of A is on the order of plus 1, minus 1. Let's say each of the A sub i is on the order of plus 1, minus 1. Then the inner product between A and B, this is on the order of square root dH."},{"id":180,"text":"And if you divide, if you choose C to be dH, then you will cancel out with this scale so that it comes back to the scale of one, so that it doesn't depend on the dimension as much. So ideally you want to make sure that even you change dimension dH, you don't have to change your architecture too much. Everything is on the right scale. So that's why typically people choose C because dH, square root dH, so that you can cancel with this scale."},{"id":181,"text":"Of course, this is a very heuristic calculation."},{"id":182,"text":"There are, for many cases of this normalizing constant,"},{"id":183,"text":"there are different theories which can give you"},{"id":184,"text":"slightly different predictions on what's the right way to do it."},{"id":185,"text":"For example, depending on how you think about the A and B,"},{"id":186,"text":"why A and B should be random like."},{"id":187,"text":"Maybe A and B should be all already in one direction in some sense,"},{"id":188,"text":"then you should choose a different normalizing constant."},{"id":189,"text":"Empirically, it sounds like this normalizing constant at least is one of the working choice, you know, other people probably use that other choices"},{"id":190,"text":"So but generally speaking, you know"}],"notes":["本段主要讲解在Softmax函数中引入归一化常数C的原因和选择方法。C的作用是确保输入到Softmax函数的值更加规范化，避免数值过大或过小导致计算不稳定。","归一化常数C通常被选择为√dH，其中dH是向量的维度。这是因为当两个随机向量的维度为dH时，它们的内积通常在√dH的量级上，通过选择C为dH可以将内积的量级归一化为1，从而减少维度对结果的影响。","虽然这种选择是基于启发式的计算，但不同理论可能会给出不同的预测，关于如何选择合适的归一化常数。例如，如果A和B已经被定向在某个方向上，可能需要不同的归一化常数。","在实践中，选择√dH作为归一化常数是一种常见的做法，但其他选择也可能被使用。归一化常数的选择会影响模型的性能和稳定性。","归一化常数的选择需要考虑向量的分布特性，如果向量是随机的，通常选择√dH；如果向量已经具有某种方向性，则可能需要不同的归一化策略。","归一化常数的选择是模型设计中的一个重要考虑因素，它影响着模型的可解释性和计算效率。"],"formulas":[{"latex":"C = \\sqrt{dH}","symbols":"C是归一化常数，dH是向量的维度","explanation":"公式正确，C被选择为dH的平方根以确保尺度合理。","evidence":"each entry is in a part of two vectors of dimension dH. Typically, C is chosen to be something like square root dH, and that's because if you have, suppose these two matrices are on the order of plus one minus one, then the inner product between two vectors, so you have two vectors, they're all dimension dH, and you take the inner product, most likely if they are random, then they're all on the order of square root dH."},{"latex":"A \\text{ and } B \\text{ are random vectors of dimension } dH","symbols":"A和B是维度为dH的随机向量","explanation":"公式正确，描述了A和B作为维度为dH的随机向量。","evidence":"So suppose you have two vectors, maybe say A, which is on the order of dimension dH, and B is on the dimension dH, and they are somewhat random, and each of the entries of A is on the order of plus 1, minus 1. Let's say each of the A sub i is on the order of plus 1, minus 1. Then the inner product between A and B, this is on the order of square root dH."},{"latex":"A \\text{ and } B \\text{ are in the same direction}","symbols":"A和B在同一个方向上","explanation":"公式正确，描述了A和B可能在同一个方向上的情况。","evidence":"Maybe A and B should be all already in one direction in some sense,"}],"uncertainties":["multi-hydro tension","group cores","GJ"],"diagram":"none","start":894.29,"end":1069.35,"asr_flags":[],"math_clarifications":["C的选取是基于向量A和B的随机性，以确保内积的尺度合理。"],"raw_segments":[{"start":894.29,"text":"And then you multiply by vgj,"},{"start":896.89,"text":"use the same ID for the set of values,"},{"start":901.23,"text":"and this is the output for the j's hat."},{"start":905.25,"text":"So, you still have the same number has similar outputs,"},{"start":908.03,"text":"it's just like some of these outputs are using the same k."},{"start":913.99,"text":"So, that's the only difference."},{"start":917.83,"text":"Did I explain the C last time?"},{"start":920.15,"text":"The reason why we have a C is because we want to make"},{"start":922.43,"text":"sure the input to the softmax is more normalized."},{"start":926.93,"text":"So C is often chosen to be something like,"},{"start":930.41,"text":"so this is a matrix like this inner product,"},{"start":933.81,"text":"no matter whether you have the GJ,"},{"start":935.19,"text":"or whether you have the group cores,"},{"start":937.81,"text":"or the standard multi-hydro tension,"},{"start":940.33,"text":"this inner product is always something like it's a T by DA."},{"start":947.04,"text":"and dh by t matrix. So basically,"},{"start":951.66,"text":"each entry is in a part of two vectors of dimension dH. Typically, C is chosen to be something like square root dH, and that's because if you have, suppose these two matrices are on the order of plus one minus one, then the inner product between two vectors, so you have two vectors, they're all dimension dH, and you take the inner product, most likely if they are random, then they're all on the order of square root dH."},{"start":978.28,"text":"So suppose you have two vectors, maybe say A, which is on the order of dimension dH, and B is on the dimension dH, and they are somewhat random, and each of the entries of A is on the order of plus 1, minus 1. Let's say each of the A sub i is on the order of plus 1, minus 1. Then the inner product between A and B, this is on the order of square root dH."},{"start":1005.55,"text":"And if you divide, if you choose C to be dH, then you will cancel out with this scale so that it comes back to the scale of one, so that it doesn't depend on the dimension as much. So ideally you want to make sure that even you change dimension dH, you don't have to change your architecture too much. Everything is on the right scale. So that's why typically people choose C because dH, square root dH, so that you can cancel with this scale."},{"start":1032.01,"text":"Of course, this is a very heuristic calculation."},{"start":1035.19,"text":"There are, for many cases of this normalizing constant,"},{"start":1039.37,"text":"there are different theories which can give you"},{"start":1041.17,"text":"slightly different predictions on what's the right way to do it."},{"start":1045.25,"text":"For example, depending on how you think about the A and B,"},{"start":1048.87,"text":"why A and B should be random like."},{"start":1053.21,"text":"Maybe A and B should be all already in one direction in some sense,"},{"start":1057.15,"text":"then you should choose a different normalizing constant."},{"start":1060.73,"text":"Empirically, it sounds like this normalizing constant at least is one of the working choice, you know, other people probably use that other choices"},{"start":1067.55,"text":"So but generally speaking, you know"}],"speech_gaps":[{"start":911.53,"end":913.59},{"start":944.11,"end":945.808}],"frame":"../frames/v044/006.webp","frame_time":906.29},{"title":"强化学习基础与策略梯度","segments":[{"id":191,"text":"The choice here is kind of like it's you can only have some heuristics to justify it, but it's not like"},{"id":192,"text":"It's not like you can really"},{"id":193,"text":"Rigorously predict what's the right thing?"},{"id":194,"text":"So like you have some intuitions you have some heuristics and then you try it and empirically it works then that's your choice"},{"id":195,"text":"Okay. Sounds good. Any questions so far?"},{"id":196,"text":"Is this the reason why we chose to grow it?"},{"id":197,"text":"Yeah. That reason is pretty clear because the queries that have to be stored in your generation."},{"id":198,"text":"So basically, if you are at time t,"},{"id":199,"text":"you only have to store the query at time t."},{"id":200,"text":"In the prefilling or training,"},{"id":201,"text":"you have to have all of them."},{"id":202,"text":"but I think we're mostly thinking about the generation time."},{"id":203,"text":"So in the generation time, at the particular time t,"},{"id":204,"text":"you don't have to use any of the previous queries"},{"id":205,"text":"because you already computed the query"},{"id":206,"text":"to the key attention for those queries already."},{"id":207,"text":"So you don't have to save the last..."},{"id":208,"text":"So that means that the memory cost for query is much smaller than the memory cost for keys and values because you have to save the whole sequence. So that's why you have much more incentive to reduce the number of keys and values. Of course, you can universally reduce all of them, but then you are just trying to reduce the number of heads in some sense."},{"id":209,"text":"This is just trying to formalize how to compute a query as a key attention. So like in matrix form, so sometimes the high level overview is that figure. So basically you do this q, j, and k. The g parenthesis j is what you are, which group you are attending to. So for this,"},{"id":210,"text":"For both this set of queries and this set of queries, you are attending to this set of keys, so that's the index for G, this index. And then the Q and K inner products are the inner products between the keys and queries, and then you mask it, as we discussed last time, and you take the softmax and you do the normal attention. Yes, we have fewer number of keys, fewer sets of keys."}],"notes":["本段讨论了在强化学习中，如何通过启发式方法和经验验证来选择策略，而不是严格预测最优解。讲者指出，虽然不能完全严谨地预测正确做法，但通过直觉和经验验证可以做出选择。","讲者进一步解释了在生成过程中，查询（query）的存储需求比键（key）和值（value）小，因为只需要存储当前时间点的查询，而键和值需要保存整个序列。这导致了对键和值数量的优化需求。","讲者提到，计算查询与键的注意力时，使用矩阵形式进行操作，并通过掩码和softmax进行标准化处理。这与之前讨论的注意力机制一致。","讲者强调，由于键的数量较少，因此在注意力机制中，可以减少键的数量，从而减少计算量，这类似于减少注意力头的数量。"],"formulas":[],"uncertainties":["The g parenthesis j is what you are, which group you are attending to."],"diagram":"none","start":1070.87,"end":1231.36,"asr_flags":[],"raw_segments":[{"start":1070.87,"text":"The choice here is kind of like it's you can only have some heuristics to justify it, but it's not like"},{"start":1079.01,"text":"It's not like you can really"},{"start":1080.49,"text":"Rigorously predict what's the right thing?"},{"start":1082.07,"text":"So like you have some intuitions you have some heuristics and then you try it and empirically it works then that's your choice"},{"start":1089.27,"text":"Okay. Sounds good. Any questions so far?"},{"start":1094.31,"text":"Is this the reason why we chose to grow it?"},{"start":1099.19,"text":"Yeah. That reason is pretty clear because the queries that have to be stored in your generation."},{"start":1107.77,"text":"So basically, if you are at time t,"},{"start":1109.51,"text":"you only have to store the query at time t."},{"start":1112.51,"text":"In the prefilling or training,"},{"start":1114.95,"text":"you have to have all of them."},{"start":1116.05,"text":"but I think we're mostly thinking about the generation time."},{"start":1118.85,"text":"So in the generation time, at the particular time t,"},{"start":1122.43,"text":"you don't have to use any of the previous queries"},{"start":1124.05,"text":"because you already computed the query"},{"start":1126.15,"text":"to the key attention for those queries already."},{"start":1128.25,"text":"So you don't have to save the last..."},{"start":1133.21,"text":"So that means that the memory cost for query is much smaller than the memory cost for keys and values because you have to save the whole sequence. So that's why you have much more incentive to reduce the number of keys and values. Of course, you can universally reduce all of them, but then you are just trying to reduce the number of heads in some sense."},{"start":1173.3,"text":"This is just trying to formalize how to compute a query as a key attention. So like in matrix form, so sometimes the high level overview is that figure. So basically you do this q, j, and k. The g parenthesis j is what you are, which group you are attending to. So for this,"},{"start":1199.37,"text":"For both this set of queries and this set of queries, you are attending to this set of keys, so that's the index for G, this index. And then the Q and K inner products are the inner products between the keys and queries, and then you mask it, as we discussed last time, and you take the softmax and you do the normal attention. Yes, we have fewer number of keys, fewer sets of keys."}],"speech_gaps":[{"start":1076.63,"end":1078.61},{"start":1130.688,"end":1132.81}],"frame":"../frames/v044/007.webp","frame_time":1082.87},{"title":"注意力机制与多查询注意力","segments":[{"id":211,"text":"and different set of cores are kinda attached to the same set of keys. Yes, so basically you have so many different keys here. The value of, where is tau? Oh, tau is here. This is just a parameter, I think. So, you know, you can, there are three numbers here, right, so."},{"id":212,"text":"I guess you just, you know, you have to respect this equation. Other than that, you just choose something that works empirically. Of course, you know, if you make tau too big, so for example, tau can be equal to nh. Then you just have only one set of cores, sorry, one set of keys and values, then you have the smallest possible memory cost."},{"id":213,"text":"But the problem is that you store too little in some sense. If you just only have one set of keys, then maybe you don't have enough information stored so that you lose some of the information of the past. Because in some sense, how much you store depends a little b ou actually have to learn"},{"id":240,"text":"the right keys, right? Suppose I permute this dependency thing, then the learning,"}],"notes":["本段讨论了注意力机制中键（keys）和值（values）的存储问题，以及参数tau（tau）的作用。tau被用来控制存储的键值对数量，当tau较大时，存储的键值对数量减少，从而降低内存成本。但这也可能导致信息丢失，因为存储的信息量减少。"],"formulas":[],"uncertainties":["NG的具体含义不明确，可能是键的数量（number of keys）或其他术语。","tau的定义和使用方式在片段中没有明确说明，可能需要进一步澄清。","队列（queues）和案例（case）的定义不明确，可能需要更多上下文。","ground loss的含义不明确，可能是某种损失函数或术语的误听。"],"diagram":"none","start":1233.19,"end":1407.17,"asr_flags":[],"raw_segments":[{"start":1233.19,"text":"and different set of cores are kinda attached to the same set of keys. Yes, so basically you have so many different keys here. The value of, where is tau? Oh, tau is here. This is just a parameter, I think. So, you know, you can, there are three numbers here, right, so."},{"start":1270.79,"text":"I guess you just, you know, you have to respect this equation. Other than that, you just choose something that works empirically. Of course, you know, if you make tau too big, so for example, tau can be equal to nh. Then you just have only one set of cores, sorry, one set of keys and values, then you have the smallest possible memory cost."},{"start":1293.32,"text":"But the problem is that you store too little in some sense. If you just only have one set of keys, then maybe you don't have enough information stored so that you lose some of the information of the past. Because in some sense, how much you store depends a little bit on..."},{"start":1308.92,"text":"like the storage is needed in some sense because the memory is needed because you have to remember what happened in the history, right? It's more like how much you have to remember is something you need to kind of tune in some sense. So I think actually this is a good question in the sense that I think if you choose tau to be the same as NH,"},{"start":1331.61,"text":"So, the NG is one."},{"start":1333.41,"text":"I think this is called multi-query attention."},{"start":1336.8 the Q and the K, they're both morally dependent on their own word and not really on the other words?"},{"id":267,"text":"I think that's, you know,"},{"id":268,"text":"I think on the word level it's probably too granular."},{"id":269,"text":"I think, you know,"},{"id":270,"text":"at least it depends on the nearby words as well."},{"id":271,"text":"But the intuition doesn't, you know,"},{"id":272,"text":"I know it's kind of like intuition."},{"id":273,"text":"I think it's about right, yeah."},{"id":274,"text":"Any other questions?"},{"id":275,"text":"Okay. So now,"},{"id":276,"text":"let's talk about another variant of attention,"},{"id":277,"text":"which is trying to deal with a different type of issues."},{"id":278,"text":"Sorry, I need to cut. Okay. I don't need it."},{"id":279,"text":"So another variant is so-called sliding window attention."},{"id":280,"text":"So this is for a different issue with attention,"},{"id":281,"text":"also with some system perspective in mind."}],"notes":["本段讨论了注意力机制中键（key）和查询（query）的分配策略，以及如何在GPU上进行并行化处理。讲者提到，是否需要将多个核心与键进行匹配，或者是否需要构建树状结构，以实现更高效的计算。同时，讲者指出，这种结构不能过于动态，因为需要在GPU上硬编码，以便实现高速运行。","讲者进一步说明，为了实现高效的并行计算，需要明确知道哪些计算步骤需要执行，以便进行编译和优化。此外，讲者提到，实际应用中人们通常会将键和查询分配到不同的GPU卡上，以减少通信开销。","讲者还提到，对于注意力机制中的查询和键，可能存在一些混淆。例如，在Twitter等应用中，查询和键可能依赖于当前词与另一个词的相关性，而不是其他词。但讲者认为，在词级别上过于细化可能不太合适，因为还需要考虑附近词的影响。","讲者指出，这种依赖关系可能更多是基于直觉，而不是严格的数学定义。因此，对于注意力机制的具体实现细节，还需要进一步的实验和验证。","最后，讲者提到，注意力机制还有其他变种，如滑动窗口注意力，用于处理不同的问题，并从系统角度进行优化。"],"formulas":[],"uncertainties":["one core also get to two keys"],"diagram":"none","start":1407.35,"end":1584.41,"asr_flags":[264,265,266],"raw_segments":[{"start":1407.35,"text":"the training code will permute that as well to accommodate. So of course, you can ask whether"},{"start":1413.97,"text":"whether you should do something like two cores matched to,"},{"start":1417.97,"text":"like three cores matched to two keys,"},{"start":1419.75,"text":"do you have to make it like a tree structure,"},{"start":1422.23,"text":"like a one key for many, many,"},{"start":1423.53,"text":"is that like a one key for many cores,"},{"start":1425.71,"text":"or like it could be like one cores also get to two keys?"},{"start":1432.21,"text":"I don't think people have tried that yet."},{"start":1434.49,"text":"And another thing is that this structure,"},{"start":1438.37,"text":"to some degree, cannot be too dynamic"},{"start":1441.53,"text":"because you have to, in some sense,"},{"start":1443.25,"text":"you have to hard-code it on the GPU so that you can really run it very, very fast."},{"start":1446.85,"text":"Right? So, you have to exactly know which one you compute in some sense,"},{"start":1450.17,"text":"so that, um, um, you know,"},{"start":1452.97,"text":"you can compile it so that you can run on GPU."},{"start":1455.43,"text":"So, um, so I think empirical actually people just really do literally what I'm doing here,"},{"start":1460.07,"text":"like so that actually you'll also have some locality stuff,"},{"start":1462.95,"text":"like for example, you probably should put this kind of things closer to this in some sense."},{"start":1466.83,"text":"Um, so, um, uh, and also empirically,"},{"start":1470.89,"text":"I guess you actually could, very likely you could, depending on the situations,"},{"start":1477.45,"text":"you could put this key and the corresponding queries into one GPU card,"},{"start":1482.65,"text":"and then this key with the corresponding other queries into another GPU card,"},{"start":1486.19,"text":"so they can reduce the communication, all of those."},{"start":1490.91,"text":"I don't know about the last lecture, but I was a little bit confused on the queries and the keys."},{"start":1496.77,"text":"In Twitter, it seems like what they're doing is trying to figure out if I have a current word, how related is it to another word?"},{"start":1504.13,"text":"So would that mean that the Q and the K, they're both morally dependent on their own word and not really on the other words?"},{"start":1515.23,"text":"I think that's, you know,"},{"start":1517.47,"text":"I think on the word level it's probably too granular."},{"start":1519.83,"text":"I think, you know,"},{"start":1523.69,"text":"at least it depends on the nearby words as well."},{"start":1528.27,"text":"But the intuition doesn't, you know,"},{"start":1530.69,"text":"I know it's kind of like intuition."},{"start":1532.07,"text":"I think it's about right, yeah."},{"start":1539.79,"text":"Any other questions?"},{"start":1558.45,"text":"Okay. So now,"},{"start":1560.47,"text":"let's talk about another variant of attention,"},{"start":1563.43,"text":"which is trying to deal with a different type of issues."},{"start":1567.83,"text":"Sorry, I need to cut. Okay. I don't need it."},{"start":1570.91,"text":"So another variant is so-called sliding window attention."},{"start":1578.31,"text":"So this is for a different issue with attention,"},{"start":1581.69,"text":"also with some system perspective in mind."}],"speech_gaps":[],"frame":"../frames/v044/009.webp","frame_time":1419.35},{"title":"注意力机制中的计算复杂度与滑动窗口","segments":[{"id":282,"text":"If you think about this, we talk about the memory a lot. But if you think about the compute, it's also an issue because you have to compute this pairwise inner product between t and t sequence of vectors. So that's t squared computation. And when t is big, that is quadratic, and you can really get into trouble. For example, if t is a million, then a million squared is really a big number. So you have to find some ways to make it not."},{"id":283,"text":"quadratic dependencies. We don't know exactly how the frontier labs are doing this, but at least one way people have done in the open source community is that you just don't compute all of these attentions. What you do is you just say, you have a sliding window so that you only have to attend to some amount like a sum."},{"id":284,"text":"recent history. So, suppose you have q1 up to qt, and if you have k1 up to kt, and you say qt only attends to the last w positions. So, and w is the window size. And then qt minus 1 attends to this one, and, you know,"},{"id":285,"text":"attend to the last w as well, and qt minus two attends to the last w. So basically there's a sliding window that depends on where your query is at. And you can see the limitation here is that your attention is very limited to only the recent tokens. Of course, it's not like these recent tokens just only about, sorry, it's not exactly true that the, let's say this is like a kt minus w, right? So it's not exactly true that"},{"id":286,"text":"these W positions are only about the last W tokens. That's not entirely true, because this key also depends on what happens in the layer below. And the layer below can attend to even earlier tokens, and the layer below can attend to even earlier tokens. So if you think about there are multiple layers, then if this is the top layer, then the top layer attends to the last W positions, and then this key depends on"},{"id":287,"text":"This key eventually depends on some hidden vectors, which we discussed. It's a projection matrix of the hidden vectors. And that hidden vector probably depends on the previous W, will depend on previous W tokens in the layer below. And then you have this kind of dependencies like this. So basically, depending on how many layers you have, you can look back in theory for quite a..."}],"notes":["本段讨论了注意力机制中的计算复杂度问题，特别是当序列长度t很大时，计算所有注意力权重会导致O(t²)的复杂度，这在实际应用中可能带来严重问题。例如，当t为一百万时，计算量会变得非常巨大，因此需要寻找优化方法。","为了减少计算量，一种常见的方法是使用滑动窗口机制，即每个查询只关注最近的w个位置，而不是整个序列。这种方法可以显著降低计算复杂度，但同时也限制了注意力的范围。","滑动窗口的大小w决定了注意力机制能够关注的历史长度。例如，如果当前查询是qt，它只关注最近的w个位置，而qt-1也会关注最近的w个位置，以此类推。这种机制使得注意力机制在处理长序列时更加高效。","然而，这种滑动窗口机制也存在局限性，因为它只能关注最近的token，而无法捕捉更早的信息。不过，这种限制可以通过多层结构来缓解，因为下一层可能关注更早的token，从而形成一种层次化的依赖关系。","在多层结构中，每一层的注意力机制都依赖于下一层的隐藏向量，而这些隐藏向量又可能依赖于更早的token。因此，通过多层结构，可以实现对更长历史信息的捕捉，尽管这种捕捉是有限的。","最后，本段提到，随着层数的增加，理论上可以回溯更长的历史信息，但实际效果取决于具体的模型设计和参数设置。这种依赖关系在注意力机制中是关键的，因为它影响了模型对序列信息的处理能力。"],"formulas":[],"uncertainties":[],"diagram":"attention","start":1586.41,"end":1742.72,"asr_flags":[],"raw_segments":[{"start":1586.41,"text":"If you think about this, we talk about the memory a lot. But if you think about the compute, it's also an issue because you have to compute this pairwise inner product between t and t sequence of vectors. So that's t squared computation. And when t is big, that is quadratic, and you can really get into trouble. For example, if t is a million, then a million squared is really a big number. So you have to find some ways to make it not."},{"start":1612.81,"text":"quadratic dependencies. We don't know exactly how the frontier labs are doing this, but at least one way people have done in the open source community is that you just don't compute all of these attentions. What you do is you just say, you have a sliding window so that you only have to attend to some amount like a sum."},{"start":1636.29,"text":"recent history. So, suppose you have q1 up to qt, and if you have k1 up to kt, and you say qt only attends to the last w positions. So, and w is the window size. And then qt minus 1 attends to this one, and, you know,"},{"start":1661.62,"text":"attend to the last w as well, and qt minus two attends to the last w. So basically there's a sliding window that depends on where your query is at. And you can see the limitation here is that your attention is very limited to only the recent tokens. Of course, it's not like these recent tokens just only about, sorry, it's not exactly true that the, let's say this is like a kt minus w, right? So it's not exactly true that"},{"start":1691.39,"text":"these W positions are only about the last W tokens. That's not entirely true, because this key also depends on what happens in the layer below. And the layer below can attend to even earlier tokens, and the layer below can attend to even earlier tokens. So if you think about there are multiple layers, then if this is the top layer, then the top layer attends to the last W positions, and then this key depends on"},{"start":1720.94,"text":"This key eventually depends on some hidden vectors, which we discussed. It's a projection matrix of the hidden vectors. And that hidden vector probably depends on the previous W, will depend on previous W tokens in the layer below. And then you have this kind of dependencies like this. So basically, depending on how many layers you have, you can look back in theory for quite a..."}],"speech_gaps":[],"frame":"../frames/v044/010.webp","frame_time":1598.41},{"title":"注意力机制与稀疏注意力的局限性","segments":[{"id":288,"text":"a number of tokens. So let's say suppose you have IO layers, then you can look back for IO times W tokens, and that's the limit. After that, you have no dependencies on the previous tokens. So that's the limitation. You can at most look back for IO times W tokens, and in some sense, you're going to forget about some of the past if the T is big enough. So that's an issue."},{"id":289,"text":"are doing this then you can save the compute because it's no longer T by T attention, it's going to be T by W because each of the cores only have to attend to W vectors. So it's T by W and it's linear in T as opposed to quadratic in T. Yeah, but I don't think this is the only."},{"id":290,"text":"You cannot just do only this. If you only do this, you're going to have some issues with the forgetting of the long context. Eventually, you're going to forget about the past. And there are many papers that discuss how to have other ways of this sparse attention that don't forget about the past. We don't exactly know which one is the best yet. And I think in the lecture notes, I did set some papers. If you are interested, you can read them."},{"id":291,"text":"Okay, and maybe one more small component, just, you know, there are many, many more details here I can discuss, you know, just in the interest of time, I can only select a few that I feel somewhat interesting. So another small detail here is relating to this thing that I talk about, about the C, the normalization. So here,"},{"id":292,"text":"If you think about it, so this assumption that each of the AIs are all of one is not quite guaranteed because if you tune it, then eventually sometimes maybe A and B becomes bigger or smaller. So one way people do is that people actually normalize this A before taking inner product as well. So for example, you can say as opposed to taking, so before you are taking Qj times,"},{"id":293,"text":"say kT transpose, right? Divide by C. What you can do is you can also normalize Q and J before that. You can say you can do RMS norm of Q, J times, you know, some normalization of kT."},{"id":294,"text":"transpose divided by C. So that before you go into this inner product, you are somewhat normalized, and then you can stay on the same scale for most of the cases. Again, this is a heuristic, but people do use this in some of the open source models. Okay, so the next part about architecture is mixture of experts, which, but before that, any other questions? Yeah. Yes. Yeah."}],"notes":["本段讨论了注意力机制中稀疏注意力的局限性，即模型在处理长序列时可能会遗忘过去的信息。讲者指出，当序列长度T足够大时，模型无法记住所有历史信息，因此需要引入其他方法来避免遗忘。"],"formulas":[],"uncertainties":["IO layers","AIs are all of one","RMS norm of Q, J times, you know, some normalization of kT"],"diagram":"none","start":1743.24,"end":1922.33,"asr_flags":[],"raw_segments":[{"start":1743.24,"text":"a number of tokens. So let's say suppose you have IO layers, then you can look back for IO times W tokens, and that's the limit. After that, you have no dependencies on the previous tokens. So that's the limitation. You can at most look back for IO times W tokens, and in some sense, you're going to forget about some of the past if the T is big enough. So that's an issue."},{"start":1770.99,"text":"are doing this then you can save the compute because it's no longer T by T attention, it's going to be T by W because each of the cores only have to attend to W vectors. So it's T by W and it's linear in T as opposed to quadratic in T. Yeah, but I don't think this is the only."},{"start":1791.47,"text":"You cannot just do only this. If you only do this, you're going to have some issues with the forgetting of the long context. Eventually, you're going to forget about the past. And there are many papers that discuss how to have other ways of this sparse attention that don't forget about the past. We don't exactly know which one is the best yet. And I think in the lecture notes, I did set some papers. If you are interested, you can read them."},{"start":1821.82,"text":"Okay, and maybe one more small component, just, you know, there are many, many more details here I can discuss, you know, just in the interest of time, I can only select a few that I feel somewhat interesting. So another small detail here is relating to this thing that I talk about, about the C, the normalization. So here,"},{"start":1841.05,"text":"If you think about it, so this assumption that each of the AIs are all of one is not quite guaranteed because if you tune it, then eventually sometimes maybe A and B becomes bigger or smaller. So one way people do is that people actually normalize this A before taking inner product as well. So for example, you can say as opposed to taking, so before you are taking Qj times,"},{"start":1869.92,"text":"say kT transpose, right? Divide by C. What you can do is you can also normalize Q and J before that. You can say you can do RMS norm of Q, J times, you know, some normalization of kT."},{"start":1891.22,"text":"transpose divided by C. So that before you go into this inner product, you are somewhat normalized, and then you can stay on the same scale for most of the cases. Again, this is a heuristic, but people do use this in some of the open source models. Okay, so the next part about architecture is mixture of experts, which, but before that, any other questions? Yeah. Yes. Yeah."}],"speech_gaps":[],"frame":"../frames/v044/011.webp","frame_time":1755.24},{"title":"Transformer架构中的注意力机制与MLP部分","segments":[{"id":295,"text":"T and W, yes. But W is often much smaller than T. It's kind of like a constant to some degree. It's not exactly right, but so basically your computation is T times W now as opposed to versus T squared before. And W is a small number often. The length of the window you choose in this option is a new parameter you choose. And you choose the window to be, for example, 1,000 tokens, then no matter how large T is, you pay T times 1,000."},{"id":296,"text":"Any other questions? Great. So these are all about attentions. There's another part which we discussed, but we didn't discuss in detail, which is the MLP, the fully connected networks part. I recall that transformer is actually a combination of attentions."},{"id":297,"text":"and some MLP, multilayer perception, which is the same thing as fully connecting artworks. I guess MLP is the same as FFN. It's just that they are inter-exchangeable. You have this independent MLPs, and then you do attentions. This is the general architecture of the transformer. So now let's talk about MLP part."},{"id":298,"text":"So, for the MLP part, you could also try to scale it. So, the MLP, as we know, you have some kind of application, right? So, if you just scale the dimension,"},{"id":299,"text":"it's fun, but you're just going to increase your compute time and your memory time."},{"id":300,"text":"you have a D by D matrix and if you'd say you double it,"},{"id":301,"text":"you're going to make your compute 4x and you're going to make your memory 2x."},{"id":302,"text":"So, and that's one of the ways to scale."},{"id":303,"text":"However, I think what people found out is that you can actually scale"},{"id":304,"text":"in a more kind of like parallel way in some cases."},{"id":305,"text":"So the idea is that instead of computing a big gigantic matrix so you can, the"},{"id":306,"text":"default is to have some vector v and you multiply a big matrix, a d by d matrix,"},{"id":307,"text":"and you output a vector v, or maybe you output a vector o. And for this"},{"id":308,"text":"mix of expert ideas, what you do is you say you don't do this, but you actually"},{"id":309,"text":"you have input V, and you decide you have a bunch of so-called experts, E1, E2, so on and so forth,"},{"id":310,"text":"say EK. And you decide which subnetworks you send to, and then each of these EI is MLP."},{"id":311,"text":"And then you aggregate. Actually, the aggregation is just some average. You get a vector,"},{"id":312,"text":"you get the output."}],"notes":["本段主要讲解了在Transformer架构中，注意力机制和MLP部分的结构。讲者提到，W通常比T小得多，因此计算复杂度从T²降低到T×W，这在处理长序列时尤为重要。此外，讲者还提到，MLP部分可以通过调整参数进行扩展，例如通过增加矩阵的维度来提升模型能力，但会带来计算和内存的开销。"],"formulas":[],"uncertainties":["artworks","mix of expert ideas","the aggregation is just some average","you get a vector, you get the output"],"diagram":"none","start":1925.94,"end":2102.83,"asr_flags":[],"raw_segments":[{"start":1925.94,"text":"T and W, yes. But W is often much smaller than T. It's kind of like a constant to some degree. It's not exactly right, but so basically your computation is T times W now as opposed to versus T squared before. And W is a small number often. The length of the window you choose in this option is a new parameter you choose. And you choose the window to be, for example, 1,000 tokens, then no matter how large T is, you pay T times 1,000."},{"start":1959.02,"text":"Any other questions? Great. So these are all about attentions. There's another part which we discussed, but we didn't discuss in detail, which is the MLP, the fully connected networks part. I recall that transformer is actually a combination of attentions."},{"start":1982.96,"text":"and some MLP, multilayer perception, which is the same thing as fully connecting artworks. I guess MLP is the same as FFN. It's just that they are inter-exchangeable. You have this independent MLPs, and then you do attentions. This is the general architecture of the transformer. So now let's talk about MLP part."},{"start":2007.78,"text":"So, for the MLP part, you could also try to scale it. So, the MLP, as we know, you have some kind of application, right? So, if you just scale the dimension,"},{"start":2024.57,"text":"it's fun, but you're just going to increase your compute time and your memory time."},{"start":2032.19,"text":"So suppose you have a D by D matrix and if you'd say you double it,"},{"start":2035.45,"text":"you're going to make your compute 4x and you're going to make your memory 2x."},{"start":2039.93,"text":"So, and that's one of the ways to scale."},{"start":2043.23,"text":"However, I think what people found out is that you can actually scale"},{"start":2047.83,"text":"in a more kind of like parallel way in some cases."},{"start":2051.39,"text":"So the idea is that instead of computing a big gigantic matrix so you can, the"},{"start":2057.69,"text":"default is to have some vector v and you multiply a big matrix, a d by d matrix,"},{"start":2061.81,"text":"and you output a vector v, or maybe you output a vector o. And for this"},{"start":2071.71,"text":"mix of expert ideas, what you do is you say you don't do this, but you actually"},{"start":2075.93,"text":"you have input V, and you decide you have a bunch of so-called experts, E1, E2, so on and so forth,"},{"start":2086.01,"text":"say EK. And you decide which subnetworks you send to, and then each of these EI is MLP."},{"start":2095.09,"text":"And then you aggregate. Actually, the aggregation is just some average. You get a vector,"},{"start":2102.09,"text":"you get the output."}],"speech_gaps":[{"start":2021.84,"end":2024.17}],"frame":"../frames/v044/012.webp","frame_time":1937.94},{"title":"专家混合与参数效率","segments":[{"id":313,"text":"And what happens here is that you have so many experts,"},{"id":314,"text":"you don't choose all of them all the time."},{"id":315,"text":"For different input, you can choose for different tokens, you choose different experts."},{"id":316,"text":"you choose different experts."},{"id":317,"text":"So actually, what really happens is"},{"id":318,"text":"that you have input vector v, you have a routing model."},{"id":319,"text":"to decide which one it rows to. And you only row to a subset of them. You row to, for example, this one, and maybe this one, let's see. And for the other ones, they just exist there, but you don't use them. So what happens is that now you can disentangle the memory and the compute in the sense that you have a big memory, or you have a big number of parameters, because you have a lot of these component EIs, but that number of active"},{"id":320,"text":"ones in each of the actual compute is probably a smaller number. For example, the number of actives, so it can be eight, but the number of total experts maybe is 128. So basically, you have 128 experts which are all sitting in the memory somewhere, and each time when you compute, you only take a subset of them."},{"id":321,"text":"So that's why in this case, if you read some of these open source models, the way that people do it is they don't say it's a 70B model. They say it's a 30B A3B. I'm not sure you have seen this kind of things like A3B. I think that's A3B. So what this means is that,"},{"id":322,"text":"There are 30B total parameters. If you count all the parameters in the experts, you have 30B. And A3B means active 3B. It means that when you actually do the inference, do the computation, only 3B of the parameters will be activated, and all of the other ones are not used."},{"id":323,"text":"There are 30B total parameters. If you count all the parameters in the experts, you have 30B. And A3B means active 3B. It means that when you actually do the inference, do the computation, only 3B of the parameters will be activated, and all of the other ones are not used."},{"id":324,"text":"Of course, those modules can be used for other tokens as well,"},{"id":325,"text":"but for this particular token or particular position,"},{"id":326,"text":"you don't use all of them."},{"id":327,"text":"Another original motivation for mix of"},{"id":328,"text":"expert without a system perspective is that you somehow"},{"id":329,"text":"believe that each of these experts are having different specializations."},{"id":330,"text":"For example, maybe expert one is about math and expert two is about physics,"},{"id":331,"text":"and expert three is about the common English language."},{"id":332,"text":"expert for is about coding so and so forth and so then for each of the tokens you execute"},{"id":333,"text":"different experts for specialization so in some sense you specialize two different things and"},{"id":334,"text":"that's problem better for efficiency because you know specialized networks can be smaller"}],"notes":["本段讲解了专家混合（expert mixture）的概念，即在不同输入情况下选择不同的专家模型进行处理。这种机制允许模型在保持大量参数的同时，仅在实际计算时激活部分专家，从而提高计算效率。"],"formulas":[],"uncertainties":["expert for is about coding so and so forth and so then for each of the tokens you execute"],"diagram":"none","start":2104.57,"end":2279.4,"asr_flags":[],"raw_segments":[{"start":2104.57,"text":"And what happens here is that you have so many experts,"},{"start":2107.41,"text":"you don't choose all of them all the time."},{"start":2109.35,"text":"For different input, you can choose for different tokens,"},{"start":2113.49,"text":"you choose different experts."},{"start":2116.11,"text":"So actually, what really happens is"},{"start":2117.91,"text":"that you have input vector v, you have a routing model."},{"start":2122.88,"text":"to decide which one it rows to. And you only row to a subset of them. You row to, for example, this one, and maybe this one, let's see. And for the other ones, they just exist there, but you don't use them. So what happens is that now you can disentangle the memory and the compute in the sense that you have a big memory, or you have a big number of parameters, because you have a lot of these component EIs, but that number of active"},{"start":215  forth and so then for each of the tokens you execute"},{"start":2267.02,"text":"different experts for specialization so in some sense you specialize two different things and"},{"start":2274.64,"text":"that's problem better for efficiency because you know specialized networks can be smaller"}],"speech_gaps":[],"frame":"../frames/v044/013.webp","frame_time":2116.57},{"title":"强化学习中的策略梯度与专家系统","segments":[{"id":335,"text":"and you still get the same performance game you know mention them to be specialized"},{"id":336,"text":"specialized explicitly, but they could possibly"},{"id":337,"text":"naturally become specialized,"},{"id":338,"text":"because that's the most efficient way to do it."},{"id":339,"text":"So if they are all general purpose,"},{"id":340,"text":"then maybe that's not the best way"},{"id":341,"text":"to minimize the loss function."},{"id":342,"text":"I think there are papers that study how specialized they are."},{"id":343,"text":"I think how specialized they are depends a little bit"},{"id":344,"text":"on your definition of specialization"},{"id":345,"text":"and how do you interpret the results."},{"id":346,"text":"But I think at least I've read a few papers"},{"id":347,"text":"which claim that the specialization is pretty strong"},{"id":348,"text":"wrong in the networks."},{"id":349,"text":"But on the other hand, if you really think about it,"},{"id":350,"text":"for the same sequence, you still send to,"},{"id":351,"text":"so this thing is not, okay,"},{"id":352,"text":"maybe one important clarification is that it's not true"},{"id":353,"text":"that"},{"id":354,"text":"you decide experts for each sequence."},{"id":355,"text":"You decide experts for each token and each layer."},{"id":356,"text":"So each position, each layer."},{"id":357,"text":"So for each layer, you have like a sequence."},{"id":358,"text":"You have a lot of MLPs and this is like a time dimension,"},{"id":359,"text":"like one, two, three, four, up to t."},{"id":360,"text":"And for ea  know, with this coefficient summing up to one,"},{"id":452,"text":"so you don't change the scale too much."},{"id":453,"text":"And one more small thing is that sometimes,"},{"id":454,"text":"people also have so-called shared experts,"},{"id":455,"text":"meaning that among all of this,"},{"id":456,"text":"like for every position, every layer. So you say you reserve one that is always used, and then the rest of them are selected like this way. At least that's one of the, I think in DeepSeq v3, that's the design choice."},{"id":457,"text":"So among the M experts,"},{"id":458,"text":"some of them is always used."},{"id":459,"text":"like for every position, every layer. So you say you reserve one that is always used, and then the rest of them are selected like this way. At least that's one of the, I think in DeepSeq v3, that's the design choice. And I think the..."}],"notes":["本段讲解了专家系统设计中权重归一化的过程，其中提到权重rs是r的归一化结果，alpha是r的归一化。归一化过程是将所有r相加后进行归一化，使得总和为1，从而避免尺度变化过大。","讲者指出，归一化过程中的细节可能较为微妙，但并非关键。归一化确保了在选定的子集S中，alpha的和为1，从而保持输出的尺度稳定。","讲者进一步说明，归一化是为了在组合多个专家输出时，保持整体输出的尺度不变，通过系数总和为1来实现。","讲者提到，有时会使用共享专家系统，即在所有专家中保留一个始终被使用的专家，其余专家则根据某种方式选择。","讲者指出，这种设计选择在DeepSeq v3中被采用，即在每个位置或层中保留一个始终使用的专家，其余专家则通过特定方式选择。"],"formulas":[],"uncertainties":["可能存在的术语识别错误，如'nuances'是否应为'normalization'或其他术语","关于'alpha'和'r'的具体数学关系未明确表达，需进一步确认"],"diagram":"none","start":2637.88,"end":2799.45,"asr_flags":[441,444],"raw_segments":[{"start":2637.88,"text":"let's say this is like the K largest,"},{"start":2643.1,"text":"so this is equal to K."},{"start":2646.7,"text":"Then you say I'm going to run"},{"start":2655.42,"text":"this input. So I'm gonna run E on the input h for s in capital S."},{"start":2667.42,"text":"So capital S is my indices of the k largest and I'm gonna run for each of"},{"start":2672.76,"text":"the s in the k largest, I'm gonna run the expert to get some output and then"},{"start":2676.92,"text":"I'm gonna weight all of these outputs. So I compute this and then I'm"},{"start":2681.2,"text":"the final output of this module is going to be a weighted sum where s is in this."},{"start":2696.64,"text":"And what's the weight? The weight needs to be sum to one and the weight is often"},{"start":2703.06,"text":"just a renormalization of the r. So the weight rs is just renormalization"},{"start":2709.64,"text":"of r. The alpha is renormalization of the r's. So you sum up all the r's and you renormalize it so"},{"start":2721.94,"text":"that it becomes a normal one. Oh, actually this is, you sum up, yeah, my bad, this is actually small"},{"start":2727.24,"text":"nuances. Not that important, but let me correct it. So you are summing up all the weights in the"},{"start":2737.0,"text":"the selected subset, so that among the set S,"},{"start":2742.02,"text":"the norm of the sum of the alpha is equal to one."},{"start":2747.02,"text":"So this way you don't change the scale too much, right?"},{"start":2749.38,"text":"Like you are taking a combination of these outputs,"},{"start":2753.18,"text":"you know, with this coefficient summing up to one,"},{"start":2756.14,"text":"so you don't change the scale too much."},{"start":2768.88,"text":"And one more small thing is that sometimes,"},{"start":2771.68,"text":"people also have so-called shared experts,"},{"start":2774.56,"text":"meaning that among all of this,"},{"start":2776.42,"text":"maybe I should use M here."},{"start":2777.98,"text":"So among the M experts,"},{"start":2779.82,"text":"some of them is always used."},{"start":2783.09,"text":"like for every position, every layer. So you say you reserve one that is always used, and then the rest of them are selected like this way. At least that's one of the, I think in DeepSeq v3, that's the design choice. And I think the..."}],"speech_gaps":[{"start":2650.14,"end":2652.208}],"frame":"../frames/v044/016.webp","frame_time":2649.88},{"title":"混合专家模型（MOE）的训练与效率优化","segments":[{"id":460,"text":"The rationale comes to the paper was that the shared expert is kind of like something about common knowledge about English, for example, or the language. And every token is to use that. Every position, every token is to use that. And then the rest of them are about specialization. I don't, for sure, they use it for a reason, right? But I think there are also other models which don't use this design as well. So, yeah."},{"id":461,"text":"Generally, people try to make sure all the experts are used equally."},{"id":462,"text":"In some sense. So this is actually, I didn't discuss the training, which is actually very complicated for, at least it's very subtle for MOE. One of the challenges to how to make the MOE training work. And in the training, often there are some regularizations on how the routing is done. So basically you want the routing to be as uniformly distributed as possible. And part of the reason is that, for example, in a training case, suppose the routing is always routing to some"},{"id":463,"text":"two experts but not any of the other experts. Then you are wasting your memory to store all the other experts. Your effective model size is not big enough because if you only use the first two and all the others are not used, then effectively your model is actually smaller than the parameter cost and that shouldn't be efficient. So people try to add regularizations to make the routing more uniform. Another thing is that if the routing is not more"},{"id":464,"text":"not uniform enough, then it's also a little bit hard to design your infrastructure to deal with it. So basically, each of these experts on different cars, suppose there's too much heterogeneity there, then some cars are not used enough compared to the other cars. So then your efficiency and inference is not good enough. Of course, there are other ways to deal with that. For example, you can provision more GPUs for one of the experts than the other experts. I think actually,"},{"id":465,"text":"I think in a wealth deep-seek paper, they even say that they have a dynamical way to change how many GPUs are used for each of the experts. For example, in the US daytime, some of the experts becomes more often used and then they provision more GPUs for them. Then the China time, I think most likely because of the language, one of the use cases shifted and some of the other experts becomes more activated and more used and then"},{"id":466,"text":"they provision more GPUs for those kind of experts."},{"id":467,"text":"I don't know whether that's exactly the case"},{"id":468,"text":"in all of the models, but that was reported"},{"id":469,"text":"in some of the papers and blog posts."},{"id":470,"text":"Yeah, because I think eventually it's all about,"},{"id":471,"text":"In some sense, eventually it's all about efficiency."},{"id":472,"text":"At least one of the reason is that you do this,"}],"notes":["本段讨论了混合专家模型（MOE）中共享专家和专业化专家的设计，以及训练过程中如何确保专家的均匀使用。讲者提到，共享专家类似于通用知识，如语言，而每个位置或标记都使用该知识。专业化部分则涉及模型的其他设计。","讲者指出，MOE的训练非常复杂，其中一个挑战是如何使路由（routing）尽可能均匀分布。均匀分布的路由可以避免浪费内存和参数成本，提高模型效率。","讲者提到，如果路由不均匀，会导致基础设施设计困难，影响推理效率。因此，人们会通过正则化手段来优化路由分布。","讲者还提到，某些模型会根据使用情况动态调整GPU资源分配，例如在不同时间段根据语言使用情况调整专家的GPU数量，以提高效率。","讲者指出，虽然这种动态调整在某些论文和博客中被报道，但并非所有模型都采用这种方式。最终，MOE的设计目标之一是提高效率。","讲者强调，MOE的效率优化不仅涉及模型结构，还涉及硬件资源的动态分配，以适应不同场景下的需求。"],"formulas":[],"uncertainties":["wealth deep-seek paper","becomes more often used","becomes more activated","those kind of experts"],"diagram":"none","start":2801.03,"end":2980.21,"asr_flags":[],"raw_segments":[{"start":2801.03,"text":"the rationale comes to the paper was that the shared expert is kind of like something about common knowledge about English, for example, or the language. And every token is to use that. Every position, every token is to use that. And then the rest of them are about specialization. I don't, for sure, they use it for a reason, right? But I think there are also other models which don't use this design as well. So, yeah."},{"start":2829.26,"text":"Generally, people try to make sure all the experts are used equally."},{"start":2834.0,"text":"in some sense. So this is actually, I didn't discuss the training, which is actually very complicated for, at least it's very subtle for MOE. One of the challenges to how to make the MOE training work. And in the training, often there are some regularizations on how the routing is done. So basically you want the routing to be as uniformly distributed as possible. And part of the reason is that, for example, in a training case, suppose the routing is always routing to some"},{"start":2862.7,"text":"two experts but not any of the other experts. Then you are wasting your memory to store all the other experts. Your effective model size is not big enough because if you only use the first two and all the others are not used, then effectively your model is actually smaller than the parameter cost and that shouldn't be efficient. So people try to add regularizations to make the routing more uniform. Another thing is that if the routing is not more"},{"start":2890.75,"text":"not uniform enough, then it's also a little bit hard to design your infrastructure to deal with it. So basically, each of these experts on different cars, suppose there's too much heterogeneity there, then some cars are not used enough compared to the other cars. So then your efficiency and inference is not good enough. Of course, there are other ways to deal with that. For example, you can provision more GPUs for one of the experts than the other experts. I think actually,"},{"start":2916.65,"text":"I think in a wealth deep-seek paper, they even say that they have a dynamical way to change how many GPUs are used for each of the experts. For example, in the US daytime, some of the experts becomes more often used and then they provision more GPUs for them. Then the China time, I think most likely because of the language, one of the use cases shifted and some of the other experts becomes more activated and more used and then"},{"start":2946.27,"text":"they provision more GPUs for those kind of experts."},{"start":2950.65,"text":"I don't know whether that's exactly the case"},{"start":2952.29,"text":"in all of the models, but that was reported"},{"start":2955.51,"text":"in some of the papers and blog posts."},{"start":2970.43,"text":"Yeah, because I think eventually it's all about,"},{"start":2973.37,"text":"In some sense, eventually it's all about efficiency."},{"start":2976.37,"text":"At least one of the reason is that you do this,"}],"speech_gaps":[{"start":2948.65,"end":2950.25},{"start":2959.632,"end":2961.36}],"frame":"../frames/v044/017.webp","frame_time":2813.03},{"title":"参数数量与计算资源的权衡","segments":[{"id":473,"text":"then you can have a lot more total number of parameters,"},{"id":474,"text":"but your compute at the inference time"},{"id":475,"text":"or the training time is still somewhat small controlled."},{"id":476,"text":"For example, if you have 30B active 3B,"},{"id":477,"text":"even though you have 30B parameters,"},{"id":478,"text":"but your computation is only 3B for each of the sequence."},{"id":479,"text":"So you can have like smaller compute,"},{"id":480,"text":"but still a lot more parameters."},{"id":481,"text":"Yeah, but that's only memory, right?"},{"id":482,"text":"So you only load them in the memory,"},{"id":483,"text":"but you don't have to do the actual compute."},{"id":484,"text":"So if you have compute bounded in the test time,"},{"id":485,"text":"then this is a benefit."},{"id":486,"text":"For example, if you do a full dense,"},{"id":487,"text":"like the standard kind of like,"},{"id":488,"text":"suppose your parameter is one trillion, let's say."},{"id":489,"text":"I think this and this is not a mix of expert just one trillion literally"},{"id":490,"text":"I think it's almost no chance to serve it in real life because your latency for"},{"id":491,"text":"for serving the model will just be too way way too too long and and also the"},{"id":492,"text":"Cost of serving the model will be too expensive and your model"}  too long and and also the"},{"start":3044.69,"text":"Cost of serving the model will be too expensive and your model"},{"start":3049.75,"text":"the price on your website becomes really too high so that nobody use it. So that's why a $1 trillion non-MOE model is almost impossible. But if you do $1 trillion parameters, but you have active maybe 30B, then that's more like a 30B model. But you still enjoy the increase of the number of parameters. OK."},{"start":3077.23,"text":"So, we have 20 minutes."},{"start":3078.35,"text":"I think that's probably enough for the rest of"},{"start":3079.77,"text":"the things which are somewhat easier."},{"start":3085.01,"text":"So, now I'm going to move on to a few ways to kind of like"},{"start":3090.13,"text":"adapt or use the large-language models"},{"start":3095.15,"text":"for different use cases like downstream."},{"start":3098.97,"text":"So, let's say you have already"},{"start":3100.63,"text":"pre-trained your large-language model and now you want to use it"},{"start":3102.83,"text":"for a downstream dataset, maybe sentiment analysis,"},{"start":3105.47,"text":"Maybe computing some kind of like doing some of your tasks, right? So what are the ways to do that? So"},{"start":3113.93,"text":"Some of this, you know may sound kind of like out of date, you know, but"},{"start":3118.37,"text":"They are still useful in various cases. So one of the ways to do it is so called in context learning"},{"start":3129.01,"text":"So let's say suppose you have a new"},{"start":3132.05,"text":"Downstream task. Let's say you have some examples like X"},{"start":3138.81,"text":"x1, y1 up to xn, yn."},{"start":3145.27,"text":"This is a downstream task."},{"start":3146.81,"text":"You have already trained your large English model."},{"start":3148.55,"text":"How do you try to make sure your models can predict y given x?"},{"start":3152.73,"text":"That's my question. The way people do it within"},{"start":3156.51,"text":"context learning is that you lite t":"Basically, just minimize this loss function."},{"id":653,"text":"Here, you're minimizing over i from 1 to n,"},{"id":654,"text":"you have all these examples,"}],"notes":["本段主要讲解如何通过指令微调（instruction tuning）来增强模型的零样本学习和上下文学习能力。讲者提到，这种能力在训练初期自然出现，但并未经过专门训练，因此需要通过某种方式来强化。具体方法是收集格式化的数据集，其中X代表指令或任务描述，Y代表答案，然后基于已有模型检查点进行训练，使模型学习这种行为。","讲者提到，训练过程中，X被视为输入，而Y是需要预测的输出。目标是通过最小化对数似然损失函数来优化模型，即最小化负似然，从而提高模型在给定输入X时预测Y的准确性。","在讲者提到的损失函数中，涉及对所有示例进行最小化，其中i从1到n。这表明模型在训练过程中会考虑多个示例，以优化其预测能力。","讲者提到的X和Y的结构，以及如何通过训练来增强模型的预测能力，是强化学习和策略梯度方法中的关键概念。这些方法通常涉及对模型行为的优化，以提高其在特定任务上的表现。","讲者提到的“instruction tuning”是一种常见的微调方法，用于增强模型的零样本和上下文学习能力。这种方法通过收集格式化的数据集，并基于已有模型进行训练，使模型能够更好地理解和执行指令。","讲者提到的损失函数和训练过程，是强化学习和策略梯度方法中的核心部分。通过最小化损失函数，模型可以学习如何更好地预测输出，从而提高其在特定任务上的表现。"],"formulas":[],"uncertainties":["X is 1 to T, 1 to IOI."],"diagram":"none","start":3826.75,"end":4005.43,"asr_flags":[],"math_clarifications":["原始公式缺少求和符号，且未明确表示损失函数为平均负对数似然。根据上下文，应使用求和符号表示所有样本的损失，并除以样本数量n。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3826.75,"text":"distill the capability to the small model. Also, these days, the pre-training and mid-training data becomes much more complicated. Actually, this relates to another thing I'm going to discuss next. So in the training data, actually, they are this kind of data already now. So in the old days, the pre-training is just a bunch of texts on a web. But now, at least in some stage of the training, maybe not exactly pre-training, you have data like this. So you can get these capabilities with even smaller models."},{"start":3856.75,"text":"So maybe actually that's a good segue to talk very quickly about how to at least reinforce or how to strengthen the capability of this kind of zero-shot learning and in-context learning. So at the very beginning, they arise naturally and it's kind of like a surprise. Somehow nobody actually trained for this kind of capabilities, but it actually works. And then people try to strengthen or reinforce this kind of"},{"start": s a sequence, you know."},{"id":657,"text":"So you can decompose this into a sum over the time step, t from 1 to T, and log of the p theta y_t given x_i and y less than t."},{"id":658,"text":"So, you say given the instruction and given the first T minus one token,"},{"id":659,"text":"you want to predict the Tth token,"},{"id":660,"text":"and you just sum up the loss functions, and that's it."},{"id":661,"text":"I think there's some normalization here like you need to"},{"id":662,"text":"normalize in together which you can see in the notes,"},{"id":663,"text":"but that's a small matter."},{"id":664,"text":"So that's pretty much what you do."},{"id":665,"text":"So you just collect a lot of data set,"},{"id":666,"text":"data like this with the task description and the answer,"},{"id":667,"text":"and you do the SF, do the,"},{"id":668,"text":"generally this technique is called supervised fine-tuning."},{"id":669,"text":"So anything that looks like this"},{"id":670,"text":"is called supervised fine-tuning"},{"id":671,"text":"because you are giving some supervisions,"},{"id":672,"text":"which are the Ys,"},{"id":673,"text":"and you are fine-tuning"},{"id":674,"text":"because you are taking initial checkpoints and fine-tune."},{"id":675,"text":"And instruction tuning is the type of supervised fine-tuning"},{"id":676,"text":"where the data set is exactly"},{"id":677,"text":"exactly this kind of instruction type of data set."},{"id":678,"text":"In some of the other cases, you can do superfine tuning"},{"id":679,"text":"with other kind of data sets as well,"},{"id":680,"text":"of the same form of the loss function,"},{"id":681,"text":"but your data set could be a little bit different."},{"id":682,"text":"Yeah, isn't this like a loss function,"},{"id":683,"text":"like encourage the model to just follow"},{"id":684,"text":"the direction that the human goes?"},{"id":685,"text":"What if like the model finds a different method"},{"id":686,"text":"of the answer, then the model can 个token，并将这些预测的损失函数相加，从而得到整体的损失。","讲者提到，这种分解方式需要进行归一化处理，但认为这是一个小问题。这表明在实际应用中，归一化可能是一个需要注意的细节，但并非核心问题。","讲者随后介绍了监督微调（supervised fine-tuning）的概念，指出这种技术是通过给定监督信号（即Ys）来对模型进行微调。这表明监督微调是一种常见的训练方法，通过使用带有标签的数据集来优化模型。","讲者进一步区分了指令调整（instruction tuning）和一般的监督微调。指令调整是指使用特定类型的指令数据集进行微调，而监督微调可以使用其他形式的数据集。这表明指令调整是监督微调的一种具体形式，强调了任务描述和答案的结合。","讲者还提到，指令调整的数据集通常包含任务描述和答案，而其他形式的监督微调可能使用不同的数据集。这表明监督微调的灵活性，可以根据不同的任务需求选择不同的数据集形式。"],"formulas":[],"uncertainties":["log of the p theta y_t given x_i and y less than t"],"diagram":"none","start":4006.05,"end":4184.06,"asr_flags":[],"raw_segments":[{"start":4006.05,"text":"and you normalize by 1 over n, let's say."},{"start":4008.41,"text":"And this log, as we discussed, you can decompose it into per step loss functions because this is a sequence, you know."},{"start":4017.05,"text":"So you can decompose this into a sum over the time step, t from 1 to ti, and log of the p theta yti given xi and y less than ti."},{"start":4033.23,"text":"So, you say given the instruction and given the first T minus one token,"},{"start":4037.43,"text":"you want to predict the Tth token,"},{"start":4039.71,"text":"and you just sum up the loss functions, and that's it."},{"start":4042.47,"text":"I think there's some normalization here like you need to"},{"start":4045.17,"text":"normalize in together which you can see in the notes,"},{"start":4048.27,"text":"but that's a small matter."},{"start":4052.33,"text":"So that's pretty much what you do."},{"start":4053.73,"text":"So you just collect a lot of data set,"},{"start":4055.75,"text":"data like this with the task description and the answer,"},{"start":4059.55,"text":"and you do the SF, do the,"},{"start":4062.79,"text":"generally this technique is called supervised fine-tuning."},{"start":4065.55,"text":"So anything that looks like this"},{"start":4066.63,"text":"is called supervised fine-tuning"},{"start":4067.81,"text":"because you are giving some supervisions,"},{"start":4070.75,"text":"which are the Ys,"},{"st ut how to solve the model is not part of the"},{"start":4151.24,"text":"sorry, how to solve the problem in the math problem,"},{"start":4154.04,"text":"is not part of the instruction in this, right?"},{"start":4157.64,"text":"The instruction is mostly specifying what's the task."},{"start":4159.94,"text":"And sometimes the humans have some preferences."},{"start":4162.2,"text":"For example, they say,"},{"start":4163.82,"text":"I want to solve this task in this fashion,"},{"start":4167.52,"text":"or I want my answer to be presented in this fashion, right?"},{"start":4171.36,"text":"So, so those kind of like a requirement are typically the instructions."},{"start":4175.8,"text":"But not, the instructions are typically not something like you should solve"},{"start":4178.96,"text":"of your math problem with this equation or something like that."},{"start":4183.44,"text":"Does it make sense?"}],"speech_gaps":[],"frame":"../frames/v044/024.webp","frame_time":4018.05},{"title":"链式思维与强化学习的对比","segments":[{"id":713,"text":"What if you do like a chain of thought,"},{"id":714,"text":"like say the model,"},{"id":715,"text":"that's the working out of the math,"},{"id":716,"text":"that's in the y, right?"},{"id":717,"text":"Does that make sense?"},{"id":718,"text":"No, but it would be like pressure on the y that the legal was, right?"},{"id":719,"text":"Yeah. So that's why actually it's not going to work really,"},{"id":720,"text":"you know, if you just,"},{"id":721,"text":"depending on how you get a chain of thought, right?"},{"id":722,"text":"Suppose this y has chain of thought, you know,"},{"id":723,"text":"I guess we haven't discussed it,"},{"id":724,"text":"But suppose I have chain of thought, it depends on..."},{"id":725,"text":"I think typically these days people are saying"},{"id":726,"text":"that this chain of thought cannot be..."},{"id":727,"text":"like ideally it should be also generated by model itself."},{"id":728,"text":"But if human write a chain of thought,"},{"id":729,"text":"then you could have this situation"},{"id":730,"text":"that the models want to solve the problem"},{"id":731,"text":"in some different ways, but humans is kind of like..."},{"id":732,"text":"too much micromanagement in some sense. And I think it can still help that nothing, like some micromanagement could be better than nothing, but it wouldn't probably be as good as doing the RL stuff like so that you can, yeah. We still have one, we still have one million and thirty seconds, right? Any other questions?"},{"id":733,"text":"In here? Yes, we are, yes. Definitely we are, yes. No, this is in the training phase. So basically, the model that ChaiGP delivers to you already had this instruction tuning there. So they collect a lot of instruction data, instruction answer pair data, and they tune all of those, and then they give it to you. And when you use it, they don't actually use your data to train, at least not immediately."},{"id":734,"text":"I think that's for another phase which we will discuss maybe two or three weeks later after we have some RL set up."}],"notes":["本段讨论了链式思维（chain of thought）在模型中的应用，以及其与人类干预之间的对比。讲者指出，如果模型本身生成链式思维，那么它应该由模型自身完成，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致过度干预（micromanagement），从而影响模型的自主性。讲者还提到，虽然某些微管理可能比没有好，但强化学习（RL）方法可能更有效。","讲者提到，链式思维的生成方式会影响模型的表现。如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者还提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者还提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。"],"formulas":[],"uncertainties":["pressure on the y that the legal was"],"diagram":"none","start":4184.82,"end":4 then they give it to you. And when you use it, they don't actually use your data to train, at least not immediately."},{"start":4311.28,"text":"I think that's for another phase which we will discuss maybe two or three weeks later after we have some RL set up."}],"speech_gaps":[{"start":4306.032,"end":4307.856}],"frame":"../frames/v044/025.webp","frame_time":4196.82},{"title":"策略梯度与微调方法","segments":[{"id":735,"text":"I think typical is the second phase, even though I cannot be really sure how it's really done in the frontier labs these days, because you can also mix some of this into the pertinient phase to some degree, and some of this becomes more complicated these days. If you don't have a lot of the fine-tuning data, is it possible to only fine-tune some of the experts or some layers, or do you usually have to fine-tune the whole thing?"},{"id":736,"text":"I haven't heard of fine-tuning a subset of experts. Maybe there are papers that does that, but generally speaking, I don't know. I think it might still be better to fine-tune all the experts, but with probably a smaller number of parameters, like you can do the lower stuff if you don't have enough data. Okay, now we are over time. Okay, thanks."}],"notes":["本段讨论了在强化学习中，策略梯度方法的微调过程。讲者提到，通常在第二阶段进行微调，但不确定前沿实验室是否采用混合方法。此外，讲者询问在缺乏大量微调数据的情况下，是否可以仅微调部分专家或层，还是必须微调整个模型。","讲者表示没有听说过对专家子集进行微调，但认为通常还是需要微调所有专家，但参数数量可能较少。讲者还提到，如果数据不足，可以只微调较低层次的模型。最后，讲者提到时间已到，表示感谢。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4338.27,"end":4392.57,"asr_flags":[],"raw_segments":[{"start":4338.27,"text":"I think typical is the second phase, even though I cannot be really sure how it's really done in the frontier labs these days, because you can also mix some of this into the pertinient phase to some degree, and some of this becomes more complicated these days. If you don't have a lot of the fine-tuning data, is it possible to only fine-tune some of the experts or some layers, or do you usually have to fine-tune the whole thing?"},{"start":4367.88,"text":"I haven't heard of fine-tuning a subset of experts. Maybe there are papers that does that, but generally speaking, I don't know. I think it might still be better to fine-tune all the experts, but with probably a smaller number of parameters, like you can do the lower stuff if you don't have enough data. Okay, now we are over time. Okay, thanks."}],"speech_gaps":[],"frame":"../frames/v044/026.webp","frame_time":4350.27}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
