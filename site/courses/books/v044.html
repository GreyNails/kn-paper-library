e what each of"},{"start":3586.68,"text":"these labels mean in text as much as possible,"},{"start":3589.3,"text":"but you don't show any examples at all,"},{"start":3591.52,"text":"and that's called zero-shot."},{"start":3596.02,"text":"So zero-shot."},{"start":3608.26,"text":"means that you just have a task description."},{"start":3611.72,"text":"Sometimes the cost can be long,"},{"start":3614.42,"text":"and then you just let the model generate the answer. That's it."},{"start":3617.86,"text":"So just give the task solution and then the model would keep generating."},{"start":3622.78,"text":"That's it. Sometimes you can tell the models what's the output format you want."},{"start":3626.88,"text":"Maybe you want some JSON output,"},{"start":3628.46,"text":"you want some structure of output."},{"start":3629.76,"text":"You just say, please generate in this format,"},{"start":3632.12,"text":"and then it will generate."},{"start":3635.4,"text":"That's probably our experiences with using ChatGPT."},{"start":3637.6,"text":"I feel like nobody really give them few-shot examples these days anymore,"},{"start":3641.14,"text":"except very special cases,"},{"start":3644.02,"text":"and you can just do zero-shot."},{"start":3649.36,"text":"I think this is one of the biggest findings that from"},{"start":3652.16,"text":"the few-shot and zero-shot capabilities,"},{"start":3655.54,"text":"one of the biggest findings from the GPT-3 paper,"},{"start":3661.36,"text":"because this is"},{"start":3663.7,"text":"kind of surprising because you never update the metal parameters."},{"start":3666.1,"text":"So for people who didn't see the GPT-3 paper,"}],"speech_gaps":[{"start":3509.36,"end":3511.96},{"start":3605.936,"end":3607.664},{"start":3647.152,"end":3648.96},{"start":3658.96,"end":3660.528}],"frame":"../frames/v044/021.webp","frame_time":3501.2},{"title":"提示工程与模型能力的新兴特性","segments":[{"id":595,"text":"when I was working on it,","zh":"当我正在处理这个问题时，","start":3669.26,"end":3670.34},{"id":596,"text":"it's very shocking because we thought that you have to","zh":"这非常令人震惊，因为我们原本认为你必须","start":3670.4,"end":3672.96},{"id":597,"text":"actually train your models on the new tasks a little bit at least.","zh":"至少在新任务上对模型进行一定程度的训练。","start":3672.96,"end":3675.42},{"id":598,"text":"But now, you don't have to train it in a standard way,","zh":"但现在，你不需要以标准方式训练它，","start":3675.64,"end":3677.78},{"id":599,"text":"you just have to prompt it.","zh":"你只需要通过提示来引导它。","start":3677.96,"end":3679.46},{"id":600,"text":"And this is sometimes fundamentally change","zh":"这有时会根本性地改变","start":3681.36,"end":3683.4},{"id":601,"text":"the convenience or the ease of applying these models in industry.","zh":"这些模型在工业界应用的便利性或简易性。","start":3683.4,"end":3690.36},{"id":602,"text":"So in the old days, if you want to solve","zh":"所以在过去，如果你想解决","start":3690.82,"end":3693.5},{"id":603,"text":"some problems in insurance companies. What you do is you say, oh, I'm going to collect a lot of data","zh":"一些保险公司的相关问题。你所做的就是，哦，我要收集大量该领域的数据","start":3693.5,"end":3698.8},{"id":604,"text":"from this domain, and I label them. I build a dev set, I build a train set,","zh":"然后进行标注。我构建一个开发集，我构建一个训练集，","start":3698.8,"end":3704.54},{"id":605,"text":"I try to train my models on the dev set. Maybe you start from initial checkpoints,","zh":"我尝试在开发集上训练我的模型。也许你从初始检查点开始，","start":3704.68,"end":3708.58},{"id":606,"text":"you don't have to really start from scratch, but still you have to train on the","zh":"你不必真的从头开始，但你仍然需要在该领域数据上训练一段时间，并更新你的参数，然后你提供一个专用模型，因为你的","start":3708.64,"end":3711.88},{"id":607,"text":"domain data for a bit and update your parameters and you serve a specialized model because your","zh":"模型参数已经更新，你在该企业或该公司中提供一个专用模型","start":3712.3,"end":3718.9},{"id":608,"text":"model parameters are already updated you serve a special model in that enterprise in that company","zh":"然后你在另一家公司有一个新的模型，你有整个流程，你有数据集","start":3718.9,"end":3723.44},{"id":609,"text":"and then you have a new model in another company you have the whole process you have the data set","zh":"你知道训练方面和测试方面，并且你稍微调整一下，你调整超参数","start":3723.44,"end":3728.0},{"id":610,"text":"you know that the training side test that and you tune a little bit you tune the hyper parameters","zh":"你进行一些调优","start":3728.0,"end":3732.18},{"id":611,"text":"and then you deploy a separate model in the other company so every model has their own","zh":"然后你在另一家公司部署一个单独的模型，因此每个模型都有自己的","start":3732.18,"end":3736.02},{"id":612,"text":"uh every company has their own model and and it's much complicated deploying deployment process","zh":"嗯，每个公司都有自己的模型，而且部署过程要复杂得多","start":3736.02,"end":3740.84},{"id":613,"text":"But now, you don't have to do any of this.","zh":"但现在，你不需要做任何这些事情。","start":3740.84,"end":3743.56},{"id":614,"text":"You just have one off-the-shelf model,","zh":"你只需要一个现成的模型，","start":3743.7,"end":3745.36},{"id":615,"text":"and each company just write some of their own prompt.","zh":"每个公司只需编写一些自己的提示。","start":3745.5,"end":3748.3},{"id":616,"text":"Sometimes, there is some scaffolding these days","zh":"有时，现在有一些框架","start":3749.5,"end":3751.5},{"id":617,"text":"if you do the agentic task.","zh":"如果你执行代理任务的话。","start":3751.98,"end":3753.2},{"id":618,"text":"But basically, they just do very lightweight customization","zh":"但基本上，他们只是进行非常轻量级的定制","start":3753.42,"end":3755.34},{"id":619,"text":"by writing the task's description,","zh":"通过编写任务的描述，","start":3755.9,"end":3757.66},{"id":620,"text":"and sometimes giving a few examples.","zh":"有时还会给出几个例子。","start":3757.92,"end":3759.44},{"id":621,"text":"Sometimes, you define a complicated workflow,","zh":"有时，你会定义一个复杂的流程，","start":3759.92,"end":3761.62},{"id":622,"text":"like you have a manual.","zh":"就像你有一本手册。","start":3761.8,"end":3763.76},{"id":623,"text":"We have a kind of like, what is it called?","zh":"我们有一种类似的东西，叫什么？","start":3764.02,"end":3766.82},{"id":624,"text":"or like if some employees join a company","zh":"或者比如一些员工加入公司","start":3766.82,"end":3772.1},{"id":625,"text":"and they sometimes have an onboarding doc","zh":"他们有时会有一份入职文档，","start":3772.1,"end":3774.38},{"id":626,"text":"on what's the right workflow they should follow,","zh":"说明他们应该遵循的正确流程。","start":3774.94,"end":3776.88},{"id":627,"text":"and you just down those onboarding docs to the model,","zh":"你只需将这些入门文档输入模型中，","start":3777.04,"end":3780.62},{"id":628,"text":"and the model will follow instructions","zh":"模型就会遵循指示","start":3780.72,"end":3781.84},{"id":629,"text":"and do some of those.","zh":"并执行其中的一些操作。","start":3781.84,"end":3783.36},{"id":630,"text":"This was a very hot topic at some point.","zh":"这在某个时期曾是一个非常热门的话题。","start":3794.86,"end":3796.86},{"id":631,"text":"We call these emerging properties of the models.","zh":"我们将这些称为模型的新兴特性。","start":3796.9,"end":3800.32},{"id":632,"text":"So if you go back three years, four years ago,","zh":"所以如果你回溯到三到四年前，","start":3800.64,"end":3803.82},{"id":633,"text":"I think when people started this,","zh":"我认为当人们开始这样做时，","start":3803.92,"end":3805.14},{"id":634,"text":"they say, oh, this capabilities start to","zh":"他们说，哦，这些能力开始","start":3805.3,"end":3809.36},{"id":635,"text":"emerge after certain scale and certain amount of data.","zh":"在一定的规模和一定的数据量之后才会出现。","start":3809.36,"end":3811.82},{"id":636,"text":"I think that's still true but these days you can get these capabilities with even","zh":"我认为这一点仍然成立，但如今你甚至可以用一些小型模型通过某种方式从大型模型中辨别出这些能力，因此一旦你","start":3813.12,"end":3819.4},{"id":637,"text":"small models by in some sense discerning from the large models right so once you","zh":"需要看到大型模型所具备的能力，它们总是可以尝试去","start":3819.4,"end":3823.28},{"id":638,"text":"have to see the capabilities with a large model they can always try to","zh":"获取这些能力。","start":3823.28,"end":3826.04}],"notes":["本段讨论了提示工程如何改变模型在工业中的应用方式。过去，每个公司都需要训练专门的模型，收集和标注数据，进行参数更新，并部署专用模型。而现在，只需使用一个现成的模型，通过编写提示即可完成任务，大大简化了流程。","讲者提到，过去在保险行业等场景中，需要构建开发集和训练集，从初始检查点开始训练模型，但仍然需要在领域数据上进行训练。而现在，只需通过提示即可实现模型的轻量化定制。","提示工程允许用户通过编写任务描述或提供少量示例，使模型执行复杂的流程，如员工入职文档的处理。这种做法被称为模型的新兴特性。","讲者指出，这些新兴特性在几年前开始显现，当时认为需要大规模数据和模型才能实现。但如今，即使是小型模型也能通过某种方式从大型模型中获得这些能力。"],"formulas":[],"uncertainties":["discerning from the large models right so once you"],"diagram":"none","start":3669.26,"end":3826.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":44,"raw_segments":[{"start":3669.26,"text":"when I was working on it,"},{"start":3670.4,"text":"it's very shocking because we thought that you have to"},{"start":3672.96,"text":"actually train your models on the new tasks a little bit at least."},{"start":3675.64,"text":"But now, you don't have to train it in a standard way,"},{"start":3677.96,"text":"you just have to prompt it."},{"start":3681.36,"text":"And this is sometimes fundamentally change"},{"start":3683.4,"text":"the convenience or the ease of applying these models in industry."},{"start":3690.82,"text":"So in the old days, if you want to solve"},{"start":3693.5,"text":"some problems in insurance companies. What you do is you say, oh, I'm going to collect a lot of data"},{"start":3698.8,"text":"from this domain, and I label them. I build a dev set, I build a train set,"},{"start":3704.68,"text":"I try to train my models on the dev set. Maybe you start from initial checkpoints,"},{"start":3708.64,"text":"you don't have to really start from scratch, but still you have to train on the"},{"start":3712.3,"text":"domain data for a bit and update your parameters and you serve a specialized model because your"},{"start":3718.9,"text":"model parameters are already updated you serve a special model in that enterprise in that company"},{"start":3723.44,"text":"and then you have a new model in another company you have the whole process you have the data set"},{"start":3728.0,"text":"you know that the training side test that and you tune a little bit you tune the hyper parameters"},{"start":3732.18,"text":"and then you deploy a separate model in the other company so every model has their own"},{"start":3736.02,"text":"uh every company has their own model and and it's much complicated deploying deployment process"},{"start":3740.84,"text":"But now, you don't have to do any of this."},{"start":3743.7,"text":"You just have one off-the-shelf model,"},{"start":3745.5,"text":"and each company just write some of their own prompt."},{"start":3749.5,"text":"Sometimes, there is some scaffolding these days"},{"start":3751.98,"text":"if you do the agentic task."},{"start":3753.42,"text":"But basically, they just do very lightweight customization"},{"start":3755.9,"text":"by writing the task's description,"},{"start":3757.92,"text":"and sometimes giving a few examples."},{"start":3759.92,"text":"Sometimes, you define a complicated workflow,"},{"start":3761.8,"text":"like you have a manual."},{"start":3764.02,"text":"We have a kind of like, what is it called?"},{"start":3766.82,"text":"or like if some employees join a company"},{"start":3772.1,"text":"and they sometimes have an onboarding doc"},{"start":3774.94,"text":"on what's the right workflow they should follow,"},{"start":3777.04,"text":"and you just down those onboarding docs to the model,"},{"start":3780.72,"text":"and the model will follow instructions"},{"start":3781.84,"text":"and do some of those."},{"start":3794.86,"text":"This was a very hot topic at some point."},{"start":3796.9,"text":"We call these emerging properties of the models."},{"start":3800.64,"text":"So if you go back three years, four years ago,"},{"start":3803.92,"text":"I think when people started this,"},{"start":3805.3,"text":"they say, oh, this capabilities start to"},{"start":3809.36,"text":"emerge after certain scale and certain amount of data."},{"start":3813.12,"text":"I think that's still true but these days you can get these capabilities with even"},{"start":3819.4,"text":"small models by in some sense discerning from the large models right so once you"},{"start":3823.28,"text":"have to see the capabilities with a large model they can always try to"}],"speech_gaps":[{"start":3790.288,"end":3792.304}],"frame":"../frames/v044/022.webp","frame_time":3681.26},{"title":"强化学习与策略梯度基础","segments":[{"id":639,"text":"distill the capability to the small model. Also, these days, the pre-training and mid-training data becomes much more complicated. Actually, this relates to another thing I'm going to discuss next. So in the training data, actually, they are this kind of data already now. So in the old days, the pre-training is just a bunch of texts on a web. But now, at least in some stage of the training, maybe not exactly pre-training, you have data like this. So you can get these capabilities with even smaller models.","zh":"将能力提炼到小模型中。此外，如今的预训练和中间训练数据变得更为复杂。实际上，这与我接下来要讨论的另一个话题有关。因此，在训练数据中，实际上现在已经是这种类型的数据了。在以前，预训练只是网络上的一堆文本。但现在，至少在训练的某个阶段，可能不完全是预训练，你拥有的数据就类似这样。因此，你甚至可以用更小的模型获得这些能力。","start":3826.75,"end":3855.25},{"id":640,"text":"So maybe actually that's a good segue to talk very quickly about how to at least reinforce or how to strengthen the capability of this kind of zero-shot learning and in-context learning. So at the very beginning, they arise naturally and it's kind of like a surprise. Somehow nobody actually trained for this kind of capabilities, but it actually works. And then people try to strengthen or reinforce this kind of","zh":"因此，也许这可以自然地引出我们快速讨论如何至少强化或增强这种零样本学习和上下文学习能力的方式。在最开始，它们自然地出现，有点像一种惊喜。某种意义上，没有人真正训练过这种能力，但它实际上却有效。然后人们尝试去强化或增强这种","start":3856.75,"end":3881.05},{"id":641,"text":"and the way to do it is kind of like a relatively easy, so you just do some kind of like a SFT, and people call it instruction tuning. So what you do is you say you just have, you collect a lot of data sets with this kind of format. So you have a data set, you know, let's call it, you know, maybe like a, I guess let's still call it X IYI, and where X is this instruction, or task description, they are the same thing.","zh":"实现方式相对容易，因此你只需进行某种形式的SFT（监督微调），人们称之为指令调优。你所做的就是收集大量这种格式的数据集。例如，你有一个数据集，我们可以称之为X IYI，其中X是这个指令或任务描述，它们其实是相同的东西。","start":3881.86,"end":3914.98},{"id":642,"text":"And y is your answer. And then you get a lot of this. And then you just continue to train your model from the existing checkpoint. You take the existing checkpoint and you train your model to have this behavior. So basically you just say, I'm going to have a loss function where I want to, so maybe let me see, how do I, let's say x is from one to, say,","zh":"Y是你给出的答案。然后你收集大量这样的数据。接着你继续从现有的检查点训练你的模型。你拿现有的检查点，训练你的模型以表现出这种行为。基本上，你只是说，我要定义一个损失函数，我希望，让我想想，如何做，假设x是从1到，比如说，","start":3918.06,"end":3951.9},{"id":643,"text":"What's my notation here? Sorry, just give me one second.","zh":"这里的符号是什么？抱歉，让我想一下。","start":3954.59,"end":3956.75},{"id":644,"text":"X is 1 to T, 1 to IOI.","zh":"X是从1到T，1到IOI。","start":3957.35,"end":3962.59},{"id":645,"text":"There are IOI tokens in X, and there are, say, TI tokens in Y.","zh":"X中包含IOI标记，Y中包含TI标记。","start":3963.41,"end":3968.15},{"id":646,"text":"Your X is viewed as sin, right?","zh":"你的X被视为sin，对吧？","start":3968.51,"end":3971.11},{"id":647,"text":"So you don't have to actually predict X. X is the instruction.","zh":"所以你不需要实际预测X。X是指示。","start":3971.13,"end":3973.25},{"id":648,"text":"But Y is what you want to predict.","zh":"但Y是你想要预测的内容。","start":3973.75,"end":3975.19},{"id":649,"text":"So basically, just say I want to minimize the log likelihood,","zh":"基本上，只需说我想最小化对数似然，","start":3975.37,"end":3977.97},{"id":650,"text":"minimize the negative likelihood of seeing P,","zh":"最小化看到P的负似然，","start":3979.03,"end":3981.63},{"id":651,"text":"the chance to see y from 1 to t i given x i.","zh":"从1到t i给定x i看到y的概率。","start":3981.63,"end":3991.63},{"id":652,"text":"Basically, just minimize this loss function.","zh":"基本上，只需最小化这个损失函数。","start":3998.95,"end":4001.43},{"id":653,"text":"Here, you're minimizing over i from 1 to n,","zh":"在这里，你是在从1到n的i上进行最小化，","start":4001.67,"end":4004.51},{"id":654,"text":"you have all these examples,","zh":"你拥有所有这些示例，","start":4004.59,"end":4005.43}],"notes":["本段主要讲解如何通过指令微调（instruction tuning）来增强模型的零样本学习和上下文学习能力。讲者提到，这种能力在训练初期自然出现，但并未经过专门训练，因此需要通过某种方式来强化。具体方法是收集格式化的数据集，其中X代表指令或任务描述，Y代表答案，然后基于已有模型检查点进行训练，使模型学习这种行为。","讲者提到，训练过程中，X被视为输入，而Y是需要预测的输出。目标是通过最小化对数似然损失函数来优化模型，即最小化负似然，从而提高模型在给定输入X时预测Y的准确性。","在讲者提到的损失函数中，涉及对所有示例进行最小化，其中i从1到n。这表明模型在训练过程中会考虑多个示例，以优化其预测能力。","讲者提到的X和Y的结构，以及如何通过训练来增强模型的预测能力，是强化学习和策略梯度方法中的关键概念。这些方法通常涉及对模型行为的优化，以提高其在特定任务上的表现。","讲者提到的“instruction tuning”是一种常见的微调方法，用于增强模型的零样本和上下文学习能力。这种方法通过收集格式化的数据集，并基于已有模型进行训练，使模型能够更好地理解和执行指令。","讲者提到的损失函数和训练过程，是强化学习和策略梯度方法中的核心部分。通过最小化损失函数，模型可以学习如何更好地预测输出，从而提高其在特定任务上的表现。"],"formulas":[],"uncertainties":["X is 1 to T, 1 to IOI."],"diagram":"none","start":3826.75,"end":4005.43,"asr_flags":[],"math_clarifications":["原始公式缺少求和符号，且未明确表示损失函数为平均负对数似然。根据上下文，应使用求和符号表示所有样本的损失，并除以样本数量n。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":3826.75,"text":"distill the capability to the small model. Also, these days, the pre-training and mid-training data becomes much more complicated. Actually, this relates to another thing I'm going to discuss next. So in the training data, actually, they are this kind of data already now. So in the old days, the pre-training is just a bunch of texts on a web. But now, at least in some stage of the training, maybe not exactly pre-training, you have data like this. So you can get these capabilities with even smaller models."},{"start":3856.75,"text":"So maybe actually that's a good segue to talk very quickly about how to at least reinforce or how to strengthen the capability of this kind of zero-shot learning and in-context learning. So at the very beginning, they arise naturally and it's kind of like a surprise. Somehow nobody actually trained for this kind of capabilities, but it actually works. And then people try to strengthen or reinforce this kind of"},{"start":3881.86,"text":"and the way to do it is kind of like a relatively easy, so you just do some kind of like a SFT, and people call it instruction tuning. So what you do is you say you just have, you collect a lot of data sets with this kind of format. So you have a data set, you know, let's call it, you know, maybe like a, I guess let's still call it X IYI, and where X is this instruction, or task description, they are the same thing."},{"start":3918.06,"text":"And y is your answer. And then you get a lot of this. And then you just continue to train your model from the existing checkpoint. You take the existing checkpoint and you train your model to have this behavior. So basically you just say, I'm going to have a loss function where I want to, so maybe let me see, how do I, let's say x is from one to, say,"},{"start":3954.59,"text":"What's my notation here? Sorry, just give me one second."},{"start":3957.35,"text":"X is 1 to T, 1 to IOI."},{"start":3963.41,"text":"There are IOI tokens in X, and there are, say, TI tokens in Y."},{"start":3968.51,"text":"Your X is viewed as sin, right?"},{"start":3971.13,"text":"So you don't have to actually predict X. X is the instruction."},{"start":3973.75,"text":"But Y is what you want to predict."},{"start":3975.37,"text":"So basically, just say I want to minimize the log likelihood,"},{"start":3979.03,"text":"minimize the negative likelihood of seeing P,"},{"start":3981.63,"text":"the chance to see y from 1 to t i given x i."},{"start":3998.95,"text":"Basically, just minimize this loss function."},{"start":4001.67,"text":"Here, you're minimizing over i from 1 to n,"},{"start":4004.59,"text":"you have all these examples,"}],"speech_gaps":[{"start":3997.04,"end":3998.55}],"frame":"../frames/v044/023.webp","frame_time":3838.75},{"title":"监督微调与指令调整","segments":[{"id":655,"text":"and you normalize by 1 over n, let's say.","zh":"并且你用 1 除以 n 来进行归一化，比如说。","start":4006.05,"end":4008.41},{"id":656,"text":"And this log, as we discussed, you can decompose it into per step loss functions because this is a sequence, you know.","zh":"正如我们讨论的，这个对数可以分解成每一步的损失函数，因为这是一个序列，你知道的。","start":4008.41,"end":4016.97},{"id":657,"text":"So you can decompose this into a sum over the time step, t from 1 to T, and log of the p theta y_t given x_i and y less than t.","zh":"因此，你可以将其分解为对时间步 t 从 1 到 T 的求和，以及 log(p_θ(y_t | x_i 和 y_{\u003ct}))。","start":4017.05,"end":4031.51},{"id":658,"text":"So, you say given the instruction and given the first T minus one token,","zh":"所以，你可以说，在给定指令和前 T 减一的 token 的情况下，","start":4033.23,"end":4037.19},{"id":659,"text":"you want to predict the Tth token,","zh":"你想要预测第 T 个 token，","start":4037.43,"end":4038.67},{"id":660,"text":"and you just sum up the loss functions, and that's it.","zh":"然后你只需将损失函数相加，就可以了。","start":4039.71,"end":4042.35},{"id":661,"text":"I think there's some normalization here like you need to","zh":"我想这里有一些归一化操作，你需要","start":4042.47,"end":4045.17},{"id":662,"text":"normalize in together which you can see in the notes,","zh":"在整体上进行归一化，这在笔记中可以看到。","start":4045.17,"end":4048.15},{"id":663,"text":"but that's a small matter.","zh":"但这是个小问题。","start":4048.27,"end":4050.37},{"id":664,"text":"So that's pretty much what you do.","zh":"所以这就是你基本上要做的事情。","start":4052.33,"end":4053.65},{"id":665,"text":"So you just collect a lot of data set,","zh":"所以你只需要收集一个大量的数据集，","start":4053.73,"end":4055.65},{"id":666,"text":"data like this with the task description and the answer,","zh":"像这样的数据，包含任务描述和答案，","start":4055.75,"end":4059.31},{"id":667,"text":"and you do the SF, do the,","zh":"然后你进行监督微调，进行","start":4059.55,"end":4061.53},{"id":668,"text":"generally this technique is called supervised fine-tuning.","zh":"通常这种技术被称为监督微调。","start":4062.79,"end":4065.43},{"id":669,"text":"So anything that looks like this","zh":"所以任何看起来像这样的","start":4065.55,"end":4066.63},{"id":670,"text":"is called supervised fine-tuning","zh":"都被称为监督微调","start":4066.63,"end":4067.81},{"id":671,"text":"because you are giving some supervisions,","zh":"因为你正在提供一些监督，","start":4067.81,"end":4070.61},{"id":672,"text":"which are the Ys,","zh":"也就是Y值，","start":4070.75,"end":4071.49},{"id":673,"text":"and you are fine-tuning","zh":"并且你正在微调，","start":4071.55,"end":4072.57},{"id":674,"text":"because you are taking initial checkpoints and fine-tune.","zh":"因为你正在使用初始检查点并进行微调。","start":4072.57,"end":4076.19},{"id":675,"text":"And instruction tuning is the type of supervised fine-tuning","zh":"而指令调整是一种监督微调","start":4076.31,"end":4079.51},{"id":676,"text":"where the data set is exactly","zh":"其中数据集是","start":4079.51,"end":4081.25},{"id":677,"text":"exactly this kind of instruction type of data set.","zh":"确切地说，是这种指令类型的数据集。","start":4081.25,"end":4082.77},{"id":678,"text":"In some of the other cases, you can do superfine tuning","zh":"在某些其他情况下，你可以进行超级微调","start":4083.07,"end":4085.25},{"id":679,"text":"with other kind of data sets as well,","zh":"与其他类型的数据集也类似，","start":4085.25,"end":4087.05},{"id":680,"text":"of the same form of the loss function,","zh":"具有相同形式的损失函数，","start":4087.19,"end":4089.15},{"id":681,"text":"but your data set could be a little bit different.","zh":"但你的数据集可能略有不同。","start":4089.31,"end":4090.99},{"id":682,"text":"Yeah, isn't this like a loss function,","zh":"是的，这不就像是一个损失函数，","start":4091.71,"end":4093.29},{"id":683,"text":"like encourage the model to just follow","zh":"鼓励模型仅仅跟随","start":4093.39,"end":4095.03},{"id":684,"text":"the direction that the human goes?","zh":"人类的方向吗？","start":4095.03,"end":4096.89},{"id":685,"text":"What if like the model finds a different method","zh":"如果模型找到了不同的回答方法，","start":4097.17,"end":4100.19},{"id":686,"text":"of the answer, then the model can discourage","zh":"那么模型可以抑制","start":4100.19,"end":4103.07},{"id":687,"text":"from trying different methods, right,","zh":"从尝试不同的方法，对吧，","start":4103.07,"end":4104.15},{"id":688,"text":"since it would follow like this maybe, right?","zh":"因为它可能会像这样跟随，对吧？","start":4104.15,"end":4106.15},{"id":689,"text":"That's exactly right, so, but you know,","zh":"没错，所以，但你知道，","start":4106.57,"end":4109.81},{"id":690,"text":"But you know, in some sense, you probably don't have,","zh":"但你知道，在某种意义上，你可能并没有，","start":4109.81,"end":4115.87},{"id":691,"text":"this data set is mostly designed for","zh":"这个数据集主要是设计用来","start":4118.29,"end":4120.49},{"id":692,"text":"letting the model to follow the instructions","zh":"让模型遵循人类特别提到的指令","start":4121.19,"end":4123.77},{"id":693,"text":"that the human specifically mentioned.","zh":"的。","start":4123.77,"end":4125.67},{"id":694,"text":"So you are, so I think we need to specify","zh":"所以，我认为我们需要明确说明","start":4126.35,"end":4128.99},{"id":695,"text":"what is the so-called instruction,","zh":"所谓的指令是什么？","start":4130.03,"end":4131.71},{"id":696,"text":"like when you say the model,","zh":"比如当你告诉模型，","start":4131.93,"end":4132.99},{"id":697,"text":"find out the different ways to solve the problem.","zh":"找出解决问题的不同方法。","start":4133.03,"end":4134.53},{"id":698,"text":"Yeah, but let's say the human's instructions","zh":"是的，但假设人类的指令","start":4136.03,"end":4139.41},{"id":699,"text":"to solve the math problem for me, right?","zh":"让我解决这个数学问题，对吧？","start":4139.41,"end":4141.25},{"id":700,"text":"So no matter how the model solve it, it's kind of fun, right?","zh":"不管模型如何解决问题，这都挺有趣的，对吧？","start":4141.49,"end":4145.09},{"id":701,"text":"So, but how to solve the model is not part of the","zh":"所以，但如何解决问题并不是模型的一部分，","start":4147.19,"end":4150.25},{"id":702,"text":"sorry, how to solve the problem in the math problem,","zh":"抱歉，如何解决数学问题中的问题","start":4151.24,"end":4153.86},{"id":703,"text":"is not part of the instruction in this, right?","zh":"这并不是这个中的指令，对吧？","start":4154.04,"end":4157.58},{"id":704,"text":"The instruction is mostly specifying what's the task.","zh":"指令主要是说明任务是什么。","start":4157.64,"end":4159.56},{"id":705,"text":"And sometimes the humans have some preferences.","zh":"有时人类会有一些偏好。","start":4159.94,"end":4162.06},{"id":706,"text":"For example, they say,","zh":"例如，他们会说，","start":4162.2,"end":4163.1},{"id":707,"text":"I want to solve this task in this fashion,","zh":"我想以这种方式解决这个任务，","start":4163.82,"end":4167.3},{"id":708,"text":"or I want my answer to be presented in this fashion, right?","zh":"或者我希望我的答案以这种方式呈现，对吧？","start":4167.52,"end":4171.26},{"id":709,"text":"So, so those kind of like a requirement are typically the instructions.","zh":"因此，这种类似的要求通常是指令。","start":4171.36,"end":4175.28},{"id":710,"text":"But not, the instructions are typically not something like you should solve","zh":"但指令通常不是像你应该解决","start":4175.8,"end":4178.96},{"id":711,"text":"of your math problem with this equation or something like that.","zh":"用这个方程或类似的东西来描述你的数学问题。","start":4178.96,"end":4183.28},{"id":712,"text":"Does it make sense?","zh":"这有意义吗？","start":4183.44,"end":4184.06}],"notes":["本段讲解了如何将对序列的对数概率分解为每个时间步的损失函数之和。讲者提到，对于一个序列，可以将其分解为从时间步1到T的求和，每个时间步的对数概率为p(theta)在给定输入x_i和之前输出y小于t的情况下，预测当前输出y_t的概率。这表明在序列建模中，可以通过逐个时间步的损失函数来构建整体的损失函数。","讲者进一步说明，当给定前T-1个token时，模型需要预测第T个token。这种逐个预测的方式可以通过对每个时间步的损失函数求和来实现。这表明在序列生成任务中，模型通过逐步预测每个token，并将这些预测的损失函数相加，从而得到整体的损失。","讲者提到，这种分解方式需要进行归一化处理，但认为这是一个小问题。这表明在实际应用中，归一化可能是一个需要注意的细节，但并非核心问题。","讲者随后介绍了监督微调（supervised fine-tuning）的概念，指出这种技术是通过给定监督信号（即Ys）来对模型进行微调。这表明监督微调是一种常见的训练方法，通过使用带有标签的数据集来优化模型。","讲者进一步区分了指令调整（instruction tuning）和一般的监督微调。指令调整是指使用特定类型的指令数据集进行微调，而监督微调可以使用其他形式的数据集。这表明指令调整是监督微调的一种具体形式，强调了任务描述和答案的结合。","讲者还提到，指令调整的数据集通常包含任务描述和答案，而其他形式的监督微调可能使用不同的数据集。这表明监督微调的灵活性，可以根据不同的任务需求选择不同的数据集形式。"],"formulas":[],"uncertainties":["log of the p theta y_t given x_i and y less than t"],"diagram":"none","start":4006.05,"end":4184.06,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":58,"raw_segments":[{"start":4006.05,"text":"and you normalize by 1 over n, let's say."},{"start":4008.41,"text":"And this log, as we discussed, you can decompose it into per step loss functions because this is a sequence, you know."},{"start":4017.05,"text":"So you can decompose this into a sum over the time step, t from 1 to ti, and log of the p theta yti given xi and y less than ti."},{"start":4033.23,"text":"So, you say given the instruction and given the first T minus one token,"},{"start":4037.43,"text":"you want to predict the Tth token,"},{"start":4039.71,"text":"and you just sum up the loss functions, and that's it."},{"start":4042.47,"text":"I think there's some normalization here like you need to"},{"start":4045.17,"text":"normalize in together which you can see in the notes,"},{"start":4048.27,"text":"but that's a small matter."},{"start":4052.33,"text":"So that's pretty much what you do."},{"start":4053.73,"text":"So you just collect a lot of data set,"},{"start":4055.75,"text":"data like this with the task description and the answer,"},{"start":4059.55,"text":"and you do the SF, do the,"},{"start":4062.79,"text":"generally this technique is called supervised fine-tuning."},{"start":4065.55,"text":"So anything that looks like this"},{"start":4066.63,"text":"is called supervised fine-tuning"},{"start":4067.81,"text":"because you are giving some supervisions,"},{"start":4070.75,"text":"which are the Ys,"},{"start":4071.55,"text":"and you are fine-tuning"},{"start":4072.57,"text":"because you are taking initial checkpoints and fine-tune."},{"start":4076.31,"text":"And instruction tuning is the type of supervised fine-tuning"},{"start":4079.51,"text":"where the data set is exactly"},{"start":4081.25,"text":"exactly this kind of instruction type of data set."},{"start":4083.07,"text":"In some of the other cases, you can do superfine tuning"},{"start":4085.25,"text":"with other kind of data sets as well,"},{"start":4087.19,"text":"of the same form of the loss function,"},{"start":4089.31,"text":"but your data set could be a little bit different."},{"start":4091.71,"text":"Yeah, isn't this like a loss function,"},{"start":4093.39,"text":"like encourage the model to just follow"},{"start":4095.03,"text":"the direction that the human goes?"},{"start":4097.17,"text":"What if like the model finds a different method"},{"start":4100.19,"text":"of the answer, then the model can discourage"},{"start":4103.07,"text":"from trying different methods, right,"},{"start":4104.15,"text":"since it would follow like this maybe, right?"},{"start":4106.57,"text":"That's exactly right, so, but you know,"},{"start":4109.81,"text":"But you know, in some sense, you probably don't have,"},{"start":4118.29,"text":"this data set is mostly designed for"},{"start":4121.19,"text":"letting the model to follow the instructions"},{"start":4123.77,"text":"that the human specifically mentioned."},{"start":4126.35,"text":"So you are, so I think we need to specify"},{"start":4130.03,"text":"what is the so-called instruction,"},{"start":4131.93,"text":"like when you say the model,"},{"start":4133.03,"text":"find out the different ways to solve the problem."},{"start":4136.03,"text":"Yeah, but let's say the human's instructions"},{"start":4139.41,"text":"to solve the math problem for me, right?"},{"start":4141.49,"text":"So no matter how the model solve it, it's kind of fun, right?"},{"start":4147.19,"text":"So, but how to solve the model is not part of the"},{"start":4151.24,"text":"sorry, how to solve the problem in the math problem,"},{"start":4154.04,"text":"is not part of the instruction in this, right?"},{"start":4157.64,"text":"The instruction is mostly specifying what's the task."},{"start":4159.94,"text":"And sometimes the humans have some preferences."},{"start":4162.2,"text":"For example, they say,"},{"start":4163.82,"text":"I want to solve this task in this fashion,"},{"start":4167.52,"text":"or I want my answer to be presented in this fashion, right?"},{"start":4171.36,"text":"So, so those kind of like a requirement are typically the instructions."},{"start":4175.8,"text":"But not, the instructions are typically not something like you should solve"},{"start":4178.96,"text":"of your math problem with this equation or something like that."},{"start":4183.44,"text":"Does it make sense?"}],"speech_gaps":[],"frame":"../frames/v044/024.webp","frame_time":4018.05},{"title":"链式思维与强化学习的对比","segments":[{"id":713,"text":"What if you do like a chain of thought,","zh":"如果你像进行链式思维那样做，","start":4184.82,"end":4186.34},{"id":714,"text":"like say the model,","zh":"比如说这个模型，","start":4186.46,"end":4187.68},{"id":715,"text":"that's the working out of the math,","zh":"那就是数学的推导过程，","start":4188.08,"end":4190.28},{"id":716,"text":"that's in the y, right?","zh":"那就是在y中的内容，对吧？","start":4190.5,"end":4191.98},{"id":717,"text":"Does that make sense?","zh":"这样理解对吗？","start":4192.64,"end":4193.38},{"id":718,"text":"No, but it would be like pressure on the y that the legal was, right?","zh":"不对，但那会像对y施加压力，就像法律那样，对吧？","start":4193.48,"end":4196.72},{"id":719,"text":"Yeah. So that's why actually it's not going to work really,","zh":"是的。所以实际上这样是行不通的，","start":4196.84,"end":4199.88},{"id":720,"text":"you know, if you just,","zh":"你知道的，如果你只是这样做的话。","start":4200.02,"end":4201.14},{"id":721,"text":"depending on how you get a chain of thought, right?","zh":"这取决于你是如何获得一个链式思维的，对吧？","start":4202.7,"end":4204.1},{"id":722,"text":"Suppose this y has chain of thought, you know,","zh":"假设这个 y 有一个链式思维，你知道的，","start":4204.14,"end":4206.2},{"id":723,"text":"I guess we haven't discussed it,","zh":"我想我们还没有讨论过这个，","start":4206.22,"end":4207.36},{"id":724,"text":"But suppose I have chain of thought, it depends on...","zh":"但如果我有一个链式思维，它取决于……","start":4207.36,"end":4210.12},{"id":725,"text":"I think typically these days people are saying","zh":"我认为现在人们通常会说","start":4211.18,"end":4213.04},{"id":726,"text":"that this chain of thought cannot be...","zh":"这种链式思维不能是……","start":4213.04,"end":4215.58},{"id":727,"text":"like ideally it should be also generated by model itself.","zh":"理想情况下，它也应该由模型自身生成。","start":4216.64,"end":4219.68},{"id":728,"text":"But if human write a chain of thought,","zh":"但如果人类写了一个链式思维，","start":4220.02,"end":4221.48},{"id":729,"text":"then you could have this situation","zh":"那么你可能会遇到这种情况","start":4221.52,"end":4223.0},{"id":730,"text":"that the models want to solve the problem","zh":"模型想要以一些不同的方式解决问题","start":4223.0,"end":4224.9},{"id":731,"text":"in some different ways, but humans is kind of like...","zh":"但人类在某种程度上就像是……","start":4224.9,"end":4227.32},{"id":732,"text":"too much micromanagement in some sense. And I think it can still help that nothing, like some micromanagement could be better than nothing, but it wouldn't probably be as good as doing the RL stuff like so that you can, yeah. We still have one, we still have one million and thirty seconds, right? Any other questions?","zh":"过于微观管理。我认为，有些微观管理可能比没有好，但可能不如做强化学习那样的事情好，这样你就可以，是的。我们仍然有一个，我们仍然有1,030,000秒，对吧？还有其他问题吗？","start":4228.35,"end":4266.54},{"id":733,"text":"In here? Yes, we are, yes. Definitely we are, yes. No, this is in the training phase. So basically, the model that ChaiGP delivers to you already had this instruction tuning there. So they collect a lot of instruction data, instruction answer pair data, and they tune all of those, and then they give it to you. And when you use it, they don't actually use your data to train, at least not immediately.","zh":"在这里吗？是的，我们是的，是的。肯定是我们，是的。不，这是在训练阶段。所以基本上，ChaiGP给你提供的模型已经包含了这种指令调优。他们收集了大量的指令数据、指令-回答配对数据，并对这些数据进行了调优，然后将其提供给你。当你使用它时，他们并不会立即使用你的数据进行训练。","start":4275.58,"end":4304.63},{"id":734,"text":"I think that's for another phase which we will discuss maybe two or three weeks later after we have some RL set up.","zh":"我认为这是另一个阶段，我们可能在两到三周后讨论，等我们有一些强化学习的设置之后。","start":4311.28,"end":4318.76}],"notes":["本段讨论了链式思维（chain of thought）在模型中的应用，以及其与人类干预之间的对比。讲者指出，如果模型本身生成链式思维，那么它应该由模型自身完成，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致过度干预（micromanagement），从而影响模型的自主性。讲者还提到，虽然某些微管理可能比没有好，但强化学习（RL）方法可能更有效。","讲者提到，链式思维的生成方式会影响模型的表现。如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者还提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者还提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。","讲者提到，链式思维的生成方式可能会影响模型的训练过程。例如，如果模型自己生成链式思维，那么它应该与模型的推理过程一致，而不是由人类手动编写。这表明链式思维可以作为模型推理的一部分，但若由人类编写，可能会导致模型无法完全自主地解决问题。"],"formulas":[],"uncertainties":["pressure on the y that the legal was"],"diagram":"none","start":4184.82,"end":4318.76,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":4184.82,"text":"What if you do like a chain of thought,"},{"start":4186.46,"text":"like say the model,"},{"start":4188.08,"text":"that's the working out of the math,"},{"start":4190.5,"text":"that's in the y, right?"},{"start":4192.64,"text":"Does that make sense?"},{"start":4193.48,"text":"No, but it would be like pressure on the y that the legal was, right?"},{"start":4196.84,"text":"Yeah. So that's why actually it's not going to work really,"},{"start":4200.02,"text":"you know, if you just,"},{"start":4202.7,"text":"depending on how you get a chain of thought, right?"},{"start":4204.14,"text":"Suppose this y has chain of thought, you know,"},{"start":4206.22,"text":"I guess we haven't discussed it,"},{"start":4207.36,"text":"But suppose I have chain of thought, it depends on..."},{"start":4211.18,"text":"I think typically these days people are saying"},{"start":4213.04,"text":"that this chain of thought cannot be..."},{"start":4216.64,"text":"like ideally it should be also generated by model itself."},{"start":4220.02,"text":"But if human write a chain of thought,"},{"start":4221.52,"text":"then you could have this situation"},{"start":4223.0,"text":"that the models want to solve the problem"},{"start":4224.9,"text":"in some different ways, but humans is kind of like..."},{"start":4228.35,"text":"too much micromanagement in some sense. And I think it can still help that nothing, like some micromanagement could be better than nothing, but it wouldn't probably be as good as doing the RL stuff like so that you can, yeah. We still have one, we still have one million and thirty seconds, right? Any other questions?"},{"start":4275.58,"text":"In here? Yes, we are, yes. Definitely we are, yes. No, this is in the training phase. So basically, the model that ChaiGP delivers to you already had this instruction tuning there. So they collect a lot of instruction data, instruction answer pair data, and they tune all of those, and then they give it to you. And when you use it, they don't actually use your data to train, at least not immediately."},{"start":4311.28,"text":"I think that's for another phase which we will discuss maybe two or three weeks later after we have some RL set up."}],"speech_gaps":[{"start":4306.032,"end":4307.856}],"frame":"../frames/v044/025.webp","frame_time":4196.82},{"title":"策略梯度与微调方法","segments":[{"id":735,"text":"I think typical is the second phase, even though I cannot be really sure how it's really done in the frontier labs these days, because you can also mix some of this into the pertinient phase to some degree, and some of this becomes more complicated these days. If you don't have a lot of the fine-tuning data, is it possible to only fine-tune some of the experts or some layers, or do you usually have to fine-tune the whole thing?","zh":"我认为典型的阶段是第二阶段，尽管我不能确定目前前沿实验室是如何实际操作的，因为你也可以在相关阶段中一定程度地混合一些内容，而且现在有些情况变得更复杂了。如果你没有大量的微调数据，是否可以只微调一些专家或一些层，还是通常必须微调整个模型？","start":4338.27,"end":4366.74},{"id":736,"text":"I haven't heard of fine-tuning a subset of experts. Maybe there are papers that does that, but generally speaking, I don't know. I think it might still be better to fine-tune all the experts, but with probably a smaller number of parameters, like you can do the lower stuff if you don't have enough data. Okay, now we are over time. Okay, thanks.","zh":"我没有听说过对专家子集进行微调。也许有论文做过这件事，但总的来说，我不确定。我认为可能还是微调所有专家更好，但参数数量可能更少，比如如果你数据不足，可以只微调较低层次的部分。好的，我们现在超时了。好的，谢谢。","start":4367.88,"end":4392.57}],"notes":["本段讨论了在强化学习中，策略梯度方法的微调过程。讲者提到，通常在第二阶段进行微调，但不确定前沿实验室是否采用混合方法。此外，讲者询问在缺乏大量微调数据的情况下，是否可以仅微调部分专家或层，还是必须微调整个模型。","讲者表示没有听说过对专家子集进行微调，但认为通常还是需要微调所有专家，但参数数量可能较少。讲者还提到，如果数据不足，可以只微调较低层次的模型。最后，讲者提到时间已到，表示感谢。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4338.27,"end":4392.57,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":2,"raw_segments":[{"start":4338.27,"text":"I think typical is the second phase, even though I cannot be really sure how it's really done in the frontier labs these days, because you can also mix some of this into the pertinient phase to some degree, and some of this becomes more complicated these days. If you don't have a lot of the fine-tuning data, is it possible to only fine-tune some of the experts or some layers, or do you usually have to fine-tune the whole thing?"},{"start":4367.88,"text":"I haven't heard of fine-tuning a subset of experts. Maybe there are papers that does that, but generally speaking, I don't know. I think it might still be better to fine-tune all the experts, but with probably a smaller number of parameters, like you can do the lower stuff if you don't have enough data. Okay, now we are over time. Okay, thanks."}],"speech_gaps":[],"frame":"../frames/v044/026.webp","frame_time":4350.27}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v044.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
