</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 4 Actor-Critic算法（Actor-Critic Methods） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v031.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v031","title":"Lecture 4 Actor-Critic算法（Actor-Critic Methods）","course":"强化学习","pages":[{"title":"Actor-Critic算法的引入与在线强化学习回顾","segments":[{"id":0,"text":"Okay, let's get started for today. Let's start with a recap of what we covered last time, because we're going to be building very heavily on Wednesday's concepts. So we talked about online reinforcement learning, where we collect a batch of data with some policy by running that policy in the environment. And then we try to use that data to improve our policy. And then we repeat this process in order to continue to improve from practice.","zh":"好的，我们今天开始吧。让我们先回顾一下上次我们讲的内容，因为我们将非常依赖周三的概念。我们讨论了在线强化学习，其中我们通过在环境中运行该策略来收集一批数据，然后尝试使用这些数据来改进我们的策略。然后我们重复这个过程，以便继续从实践中改进。","start":5.2,"end":34.48},{"id":1,"text":"We talked about an online reinforcement learning algorithm called policy gradients. And the update for our policy looks something like this, where we first take samples from our policy. This will give us n different trajectories sampled from our policy. We will...","zh":"我们讨论了一种在线强化学习算法，称为策略梯度。我们的策略更新看起来像这样，首先我们从我们的策略中采样。这将给我们n条不同的轨迹，这些轨迹是从我们的策略中采样的。我们将会...","start":35.79,"end":54.53},{"id":2,"text":"evaluate the log likelihood of the policy. And so this pie here is representing a distribution over actions given states. And so this is looking like the gradient of the log probability of the actions under the policy. And this log likelihood is weighted by the reward that","zh":"评估策略的对数似然。这里的饼图代表了在给定状态下的动作分布。因此，这看起来像是在策略下动作的对数概率的梯度。并且这个对数似然被奖励所加权","start":54.83,"end":73.58},{"id":3,"text":"the agent got. And so if you have higher rewards as an outcome of your actions in the future, then you're going to be encouraging the policy to increase the likelihood of those actions. And then lastly, we introduced a baseline which we could define to be the average reward, such that we're increasing the likelihood on futures that were above average reward and decreasing the likelihood","zh":"的代理所获得的。因此，如果你的未来动作导致了更高的奖励，那么你就会鼓励策略增加这些动作的可能性。最后，我们引入了一个基线，我们可以将其定义为平均奖励，这样我们就在高于平均奖励的未来上增加可能性，在导致低于平均奖励的未来上减少可能性","start":74.05,"end":99.5},{"id":4,"text":"on actions that led to futures that were below average reward. So you can think of this sort of as encouraging the policy to do more of the above average stuff, less of the below average stuff, and then repeating that process to get better and better. Cool. We also talked about how this algorithm is fully on policy. So in order to evaluate this, we actually need to have samples from","zh":"。你可以这样想，这类似于鼓励策略多做高于平均的事情，少做低于平均的事情，然后重复这个过程以获得更好的结果。很好。我们还讨论了这个算法是完全在策略上的。因此，为了评估这个算法，我们实际上需要从","start":100.14,"end":129.84},{"id":5,"text":"pi theta from our current policy, and this meant that we could only take one gradient step per batch of data, which is disappointing because then we'd have to collect a ton and ton of data in order to improve. This kind of brings up this notion of having on-policy versus off-policy algorithms that can reuse data from other past policies. And we started to look at ways to make an algorithm off-policy, and in particular we talked about using importance weights.","zh":"我们当前策略的pi theta，这意味着我们只能对每个数据批次进行一次梯度更新，这令人失望，因为那样的话我们就必须收集大量的数据才能进行改进。这种情况下就引出了在策略与离策略算法的概念，即可以重用其他过去策略的数据。我们开始寻找使算法变为离策略的方法，特别是我们讨论了使用重要性权重。","start":130.51,"end":156.94},{"id":6,"text":"where if we weight the objective by the probability of the actions of the new policy divided by the probability of the actions under the old policy, this is a way to get an estimate of the gradient for the new policy.","zh":"如果我们用新策略下动作的概率除以旧策略下动作的概率来加权目标函数，这就是一种获取新策略梯度估计的方法。","start":157.45,"end":173.67}],"notes":["本段讲解了在线强化学习中策略梯度方法的核心思想，即通过计算策略的对数似然梯度来更新策略。策略的分布表示为状态下的动作分布，梯度计算中使用了奖励加权，以鼓励高奖励的动作。引入了基线（baseline）作为平均奖励，用于调整策略更新的方向，使得策略更倾向于执行高于平均奖励的动作，减少低于平均奖励的动作。","在策略梯度方法中，算法是完全基于策略的（on-policy），这意味着需要从当前策略中收集样本进行评估。这导致每次只能对一个批次的数据进行一次梯度更新，因此需要大量数据才能有效改进策略。这引出了对策略的讨论，即在线强化学习中存在on-policy和off-policy算法的区别，off-policy算法可以重用其他策略的数据。","为了实现off-policy算法，课程中提到了使用重要性权重（importance weights）的方法。通过将新策略的动作概率除以旧策略的动作概率，可以对目标函数进行加权，从而估计新策略的梯度。这种方法允许算法在不依赖当前策略数据的情况下进行更新。","课程中强调了策略梯度方法的局限性，即其对数据的依赖性较高，而off-policy方法通过重要性权重可以缓解这一问题。这为后续引入Actor-Critic算法奠定了基础，即结合策略评估（critic）和策略优化（actor）的框架，以减少对数据的依赖并提高学习效率。","在讲解过程中，课程还提到策略梯度方法的更新过程需要重复进行，以逐步改进策略。这种迭代过程是强化学习的核心机制，通过不断收集数据、评估策略、更新策略，最终实现策略的优化。","课程中提到的基线（baseline）和重要性权重（importance weights）是策略梯度方法中的关键概念，它们分别用于减少方差和实现off-policy学习。这些概念为后续Actor-Critic算法的设计提供了理论基础。"],"formulas":[],"uncertainties":["可能未完整识别出奖励的加权方式，例如是否包含折扣因子γ或其他形式的加权"],"diagram":"none","start":5.2,"end":173.67,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.2,"text":"Okay, let's get started for today. Let's start with a recap of what we covered last time, because we're going to be building very heavily on Wednesday's concepts. So we talked about online reinforcement learning, where we collect a batch of data with some policy by running that policy in the environment. And then we try to use that data to improve our policy. And then we repeat this process in order to continue to improve from practice."},{"start":35.79,"text":"We talked about an online reinforcement learning algorithm called policy gradients. And the update for our policy looks something like this, where we first take samples from our policy. This will give us n different trajectories sampled from our policy. We will..."},{"start":54.83,"text":"evaluate the log likelihood of the policy. And so this pie here is representing a distribution over actions given states. And so this is looking like the gradient of the log probability of the actions under the policy. And this log likelihood is weighted by the reward that"},{"start":74.05,"text":"the agent got. And so if you have higher rewards as an outcome of your actions in the future, then you're going to be encouraging the policy to increase the likelihood of those actions. And then lastly, we introduced a baseline which we could define to be the average reward, such that we're increasing the likelihood on futures that were above average reward and decreasing the likelihood"},{"start":100.14,"text":"on actions that led to futures that were below average reward. So you can think of this sort of as encouraging the policy to do more of the above average stuff, less of the below average stuff, and then repeating that process to get better and better. Cool. We also talked about how this algorithm is fully on policy. So in order to evaluate this, we actually need to have samples from"},{"start":130.51,"text":"pi theta from our current policy, and this meant that we could only take one gradient step per batch of data, which is disappointing because then we'd have to collect a ton and ton of data in order to improve. This kind of brings up this notion of having on-policy versus off-policy algorithms that can reuse data from other past policies. And we started to look at ways to make an algorithm off-policy, and in particular we talked about using importance weights."},{"start":157.45,"text":"where if we weight the objective by the probability of the actions of the new policy divided by the probability of the actions under the old policy, this is a way to get an estimate of the gradient for the new policy."}],"speech_gaps":[],"frame":"../frames/v031/001.webp","frame_time":17.2},{"title":"Actor-Critic算法中的价值函数与策略评估","segments":[{"id":7,"text":"I should also mention that importance weights, the math behind it is very simple and very nice. But it's important to remember that this isn't a silver bullet. This sort of approach is only suitable when the policies are very similar to one another. And if the policies are very different, then this ratio will get very large or very small. And you'll also just have a worse estimate of your gradient.","zh":"我还需要提到重要性权重，其背后的数学非常简单且非常优美。但重要的是要记住，这并不是万能的。这种方法仅适用于策略之间非常相似的情况。如果策略差异很大，那么这个比率将会变得非常大或非常小，你对梯度的估计也会变得更差。","start":176.33,"end":199.43},{"id":8,"text":"Okay, so today we're going to be talking about a form of algorithms called actor-critic methods that build on policy gradients. And we'll talk about, as part of this, we'll be talking about how to estimate the value of a policy. And then we'll introduce an off-policy variant of the algorithm.","zh":"好的，今天我们将讨论一种称为Actor-Critic方法的算法形式，这些方法建立在策略梯度之上。在讨论过程中，我们将涉及如何估计策略的价值。然后我们将介绍该算法的离策略变体。","start":202.36,"end":220.04},{"id":9,"text":"And these actor critic methods are the basis for algorithms like PPO, which are used to train language models and that are used to train like humanoids and simulation and so forth. Very, very useful RL algorithms. And then the key learning goals for today is how to estimate how good a state in action is for a policy. This is called policy evaluation. It's very...","zh":"这些Actor-Critic方法是诸如PPO等算法的基础，这些算法被用于训练语言模型，以及训练类人机器人和模拟环境等。是非常有用的强化学习算法。今天的关键学习目标是如何估计某个状态和动作对于策略的优劣。这被称为策略评估。这是Actor-Critic方法的一个关键方面，但也更广泛地有用。然后我们还将讨论如何利用这些估计来构建更好的强化学习算法。","start":220.64,"end":250.34},{"id":10,"text":"a critical aspect of actor critic methods, but also useful more broadly. And then also talk about how to use those estimates to form a better reinforcement learning algorithm. Cool. So let's get started. And to talk about these algorithms, we need to revisit some very useful objects that we talked about in the first lecture. And specifically, this is value functions. And so a value function is representing how good","zh":"让我们开始吧。为了讨论这些算法，我们需要回顾一下我们在第一讲中提到的一些非常有用的对象，特别是价值函数。因此，价值函数表示如果你从某个状态开始遵循策略，该状态有多好。你可以将其视为从某个状态开始的奖励总和。我们将这表示为vπ(s)。这意味着我们将从状态s开始，然后运行策略π。对于给定的状态，这等于","start":250.72,"end":281.77},{"id":11,"text":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this as v pi of s. This means that we're going to be starting at state s and then running pi. And for a given state, this is equal to","zh":"从状态t开始到轨迹结束的奖励总和。这里就是奖励的总和。现在这个奖励总和会根据我们从哪个状态开始以及运行哪个策略而有所不同。因此，这将是","start":282.46,"end":311.2},{"id":12,"text":"the sum of rewards if we were to start at state t and go to the end of the trajectory. And here's the sum of rewards. Now this sum of rewards is going to differ depending on what state we start at and depending on what policy that we're running. And so this is going to be","zh":"从状态t开始到轨迹结束的奖励总和。这里就是奖励的总和。现在这个奖励总和会根据我们从哪个状态开始以及运行哪个策略而有所不同。因此，这将是","start":311.95,"end":340.6}],"notes":["本段介绍了重要性权重的概念，强调其数学基础简单但并非万能解决方案。只有当策略非常相似时，这种方法才适用，否则重要性权重会变得非常大或非常小，导致梯度估计变差。","课堂重点讲解了Actor-Critic方法，这是PPO等算法的基础，广泛应用于语言模型、人形机器人和模拟环境的训练。今天的学习目标是理解如何评估策略中某个状态和动作的好坏，即策略评估。","策略评估是Actor-Critic方法中的关键部分，同时也具有更广泛的应用价值。接下来将讨论如何利用这些评估结果来构建更优的强化学习算法。","为了讨论这些算法，需要回顾第一讲中提到的一些重要概念，特别是价值函数。价值函数表示在遵循某个策略的情况下，某个状态的优劣程度。","价值函数可以理解为从某个状态开始执行策略所获得的奖励总和。我们将其表示为vπ(s)，表示从状态s开始执行策略π。对于给定的状态，这个值等于从该状态开始到轨迹结束所获得的奖励总和。","奖励总和会根据起始状态和所使用的策略而有所不同，因此价值函数的计算需要考虑这些因素。"],"formulas":[{"latex":"v_{\\pi}(s)","symbols":"价值函数","explanation":"该公式表示在状态 $ s $ 下遵循策略 $ \\\\_pi $ 的价值函数，适用于强化学习中的策略评估部分。","evidence":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this a  s $ 开始执行策略 $ \\\\_pi $ 所获得的奖励总和。","价值函数的计算依赖于起始状态和所使用的策略。","价值函数是策略评估的核心概念。","价值函数用于指导策略优化和更新。"],"nodes":[{"title":"价值函数定义","text":"表示从状态 $ s $ 开始执行策略 $ \\\\_pi $ 的奖励总和。"},{"title":"计算依赖","text":"依赖起始状态和所使用的策略，计算结果不同。"},{"title":"策略评估","text":"价值函数是策略评估的核心，用于优化策略。"},{"title":"公式表示","text":"用 $ v_{\\pi}(s) $ 表示价值函数，适用于策略评估。"}],"id":"v031-002-3","start":250.72,"end":340.6,"formulas":[{"latex":"v_{\\pi}(s)","symbols":"价值函数","explanation":"该公式表示在状态 $ s $ 下遵循策略 $ \\\\_pi $ 的价值函数，适用于强化学习中的策略评估部分。","evidence":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this as v pi of s. This means that we're going to be starting at state s and then running pi. And for a given state, this is equal to"}],"formula_candidates_removed":0,"frame":"../board-frames/v031/002-3.webp","frame_time":263.22}],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":176.33,"text":"I should also mention that importance weights, the math behind it is very simple and very nice. But it's important to remember that this isn't a silver bullet. This sort of approach is only suitable when the policies are very similar to one another. And if the policies are very different, then this ratio will get very large or very small. And you'll also just have a worse estimate of your gradient."},{"start":202.36,"text":"Okay, so today we're going to be talking about a form of algorithms called actor-critic methods that build on policy gradients. And we'll talk about, as part of this, we'll be talking about how to estimate the value of a policy. And then we'll introduce an off-policy variant of the algorithm."},{"start":220.64,"text":"And these actor critic methods are the basis for algorithms like PPO, which are used to train language models and that are used to train like humanoids and simulation and so forth. Very, very useful RL algorithms. And then the key learning goals for today is how to estimate how good a state in action is for a policy. This is called policy evaluation. It's very..."},{"start":250.72,"text":"a critical aspect of actor critic methods, but also useful more broadly. And then also talk about how to use those estimates to form a better reinforcement learning algorithm. Cool. So let's get started. And to talk about these algorithms, we need to revisit some very useful objects that we talked about in the first lecture. And specifically, this is value functions. And so a value function is representing how good"},{"start":282.46,"text":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this as v pi of s. This means that we're going to be starting at state s and then running pi. And for a given state, this is equal to"},{"start":311.95,"text":"the sum of rewards if we were to start at state t and go to the end of the trajectory. And here's the sum of rewards. Now this sum of rewards is going to differ depending on what state we start at and depending on what policy that we're running. And so this is going to be"}],"speech_gaps":[],"frame":"../frames/v031/002.webp","frame_time":188.33},{"title":"Actor-Critic算法中的价值函数与Q函数","segments":[{"id":13,"text":"an expectation under our policy. Actually, maybe it's easier to write this as expectation on the inside. So this is an expectation over the state's ST prime and actions AT prime that will be visited under our policy and conditioned on the fact that we're starting at state ST.","zh":"在我们策略下的期望。实际上，也许更容易将这个表达式写成内部的期望。因此，这是在我们策略下将被访问的状态 ST' 和动作 AT' 的期望，并且是在从状态 ST 开始的条件下进行的。","start":342.23,"end":369.91},{"id":14,"text":"So we can think about the value function as this. Just in terms of math, what you can think about this as is, or just in terms of conceptually or in terms of intuition, if you have some trajectory and you're thinking about the value of this state, you can think of it as if we were to collect a lot of different trajectories starting from that state from our policy, and then we just summed up the rewards.","zh":"我们可以将价值函数理解为这样。从数学上讲，你可以这样想，或者从概念上或直觉上，如果你有一些轨迹，并且你考虑某个状态的价值，你可以想象如果我们从该状态开始收集大量轨迹，然后将这些轨迹中的奖励进行求和。","start":373.8,"end":398.91},{"id":15,"text":"from this time step to the end and then averaged over these trajectories, that would define the value of the state or how good the state is for the policy. Another useful quantity that we'll be making use of is called the Q function. And this is slightly different from the value function, but very closely related. And the difference is that instead of just thinking about the value of a given state, we're going to be thinking about a value of a given state and action.","zh":"从这个时间步到结束，然后对这些轨迹进行平均，这将定义状态的价值或该状态对策略的好坏。我们将要使用的另一个有用量称为 Q 函数。它与价值函数略有不同，但非常密切相关。区别在于，我们不是仅仅考虑某个状态的价值，而是考虑某个状态和动作的价值。","start":399.61,"end":428.47},{"id":16,"text":"And what this is referring to is if you were to, instead of starting at S and then running pi from there, if instead we were to start at S, take a particular action A and then run the policy, what is our expected sum of rewards? And so then you can think of this as instead of a picture like this, say we had some state S that we considered.","zh":"这指的是，如果你不是从状态 S 开始然后运行策略 pi，而是从状态 S 开始，采取一个特定的动作 A，然后运行策略，那么我们的预期奖励总和是多少？因此，你可以将这个理解为，比如我们考虑某个状态 S 的情况。","start":429.61,"end":456.88},{"id":17,"text":"And first we're going to take some given action. This may or may not have been what the policy would have been likely to choose. This action could actually also lead to different states because the environment is stochastic. And then it's the sum of these rewards on average. So this is what V looks like. This is what...","zh":"我们首先采取某个给定的动作。这个动作可能或可能不被策略所倾向于选择。由于环境是随机的，这个动作也可能导致不同的状态。然后，这就是这些奖励的平均总和。因此，这就是 V 的样子。这就是……","start":457.52,"end":487.14},{"id":18,"text":"Q look like for a given action. So here are some pictures on the slide. So if we start from state S, run our policy, we compute the expected sum of the rewards along these trajectories, then that gets us the value of a state. And then if instead we take action A first and then run pi, then we get the Q values and it's just the sum of the rewards if we had started with action A.","zh":"Q 的样子，对于给定的动作。因此，幻灯片上有一些示意图。如果我们从状态 S 开始，运行我们的策略，计算这些轨迹中的奖励总和的期望，那么这将得到状态的价值。然后，如果我们首先采取动作 A，然后运行策略 pi，那么我们将得到 Q 值，这仅仅是如果我们从动作 A 开始的奖励总和。","start":487.58,"end":518.22}],"notes":["本段讲解了价值函数（V函数）和Q函数的基本概念。价值函数衡量的是在某个状态下，按照策略执行所能获得的期望累积奖励。而Q函数则进一步考虑了在某个状态下采取特定动作后的期望累积奖励。两者的核心区别在于Q函数引入了动作这一维度。","在讲解价值函数时，讲者通过轨迹的平均奖励来定义状态的价值，这体现了强化学习中对长期奖励的期望计算。Q函数则是在状态和动作的联合空间中进行定义，强调了动作选择对后续奖励的影响。","讲者提到，Q函数的计算需要先执行特定动作，再按照策略运行，这说明了Q函数的计算过程与价值函数的计算过程存在差异。这种差异在Actor-Critic算法中尤为重要，因为Actor负责选择动作，而Critic负责评估动作的价值。","讲者还提到环境的随机性可能导致动作执行后进入不同的状态，这说明了在计算期望奖励时需要考虑环境的不确定性。这种不确定性是强化学习中常见的挑战，也是Q函数和价值函数计算中必须考虑的因素。","在讲解Q函数时，讲者通过示意图说明了状态和动作的联合空间，这有助于理解Q函数的定义和计算方式。这种图示方法是强化学习教学中常用的工具，有助于直观理解抽象概念。","讲者强调了Q函数和价值函数之间的关系，指出Q函数是价值函数的扩展，增加了动作维度。这种关系在Actor-Critic算法中具有重要意义，因为Critic部分通常使用Q函数来评估策略的优劣。"],"formulas":[],"uncertainties":[],"diagram":"none","start":342.23,"end":518.22,"asr_flags":[],"math_clarifications":["公式中的求和符号应使用标准的数学符号 \\sum 而不是文本形式的 \\text{sum}。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":342.23,"text":"an expectation under our policy. Actually, maybe it's easier to write this as expectation on the inside. So this is an expectation over the state's ST prime and actions AT prime that will be visited under our policy and conditioned on the fact that we're starting at state ST."},{"start":373.8,"text":"So we can think about the value function as this. Just in terms of math, what you can think about this as is, or just in terms of conceptually or in terms of intuition, if you have some trajectory and you're thinking about the value of this state, you can think of it as if we were to collect a lot of different trajectories starting from that state from our policy, and then we just summed up the rewards."},{"start":399.61,"text":"from this time step to the end and then averaged over these trajectories, that would define the value of the state or how good the state is for the policy. Another useful quantity that we'll be making use of is called the Q function. And this is slightly different from the value function, but very closely related. And the difference is that instead of just thinking about the value of a given state, we're going to be thinking about a value of a given state and action."},{"start":429.61,"text":"And what this is referring to is if you were to, instead of starting at S and then running pi from there, if instead we were to start at S, take a particular action A and then run the policy, what is our expected sum of rewards? And so then you can think of this as instead of a picture like this, say we had some state S that we considered."},{"start":457.52,"text":"And first we're going to take some given action. This may or may not have been what the policy would have been likely to choose. This action could actually also lead to different states because the environment is stochastic. And then it's the sum of these rewards on average. So this is what V looks like. This is what..."},{"start":487.58,"text":"Q look like for a given action. So here are some pictures on the slide. So if we start from state S, run our policy, we compute the expected sum of the rewards along these trajectories, then that gets us the value of a state. And then if instead we take action A first and then run pi, then we get the Q values and it's just the sum of the rewards if we had started with action A."}],"speech_gaps":[],"frame":"../frames/v031/003.webp","frame_time":354.23},{"title":"Actor-Critic算法中的价值函数与优势函数关系","segments":[{"id":19,"text":"Now, one thing that's useful to think about in terms of how these two relate to each other is you can think of the value of a state as if you take an expectation over the actions that the policy would have taken, you can think of it as the average or the expectation of the Q values over all the actions that the policy would have taken. And then one last object that we'll use today is thinking about","zh":"现在，在思考这两个概念如何相互关联时，一个有用的想法是，你可以将状态的价值视为对策略可能采取的所有动作的期望值，你可以将其视为策略可能采取的所有动作的Q值的平均值或期望值。今天我们将使用的最后一个对象是思考","start":522.13,"end":549.94},{"id":20,"text":"how good is a particular action relative to other actions that we might take?","zh":"某个特定动作相对于我们可能采取的其他动作有多好？","start":550.77,"end":555.95},{"id":21,"text":"And for this, we can think about, like, what is, if you consider the Q value minus the value","zh":"对于这一点，我们可以思考，如果你考虑Q值减去价值函数，这将告诉你，在给定状态下采取动作A相对于遵循策略有多好？","start":558.39,"end":567.87},{"id":22,"text":"function, that's going to tell you, like, how good is it to take action A versus following the policy","zh":"这有点像，采取一个动作相对于遵循策略的优势是什么。好问题。所以问题是，V和Q之间是否存在归一化？你可以将期望视为平均值，因此","start":567.87,"end":573.37},{"id":23,"text":"at a given state? And this is kind of like, what is the advantage of taking one action versus","zh":"从这个意义上说，存在归一化。因为如果你是","start":573.37,"end":580.27},{"id":24,"text":"following the policy. Good question. So the question was, is there a normalization","zh":"这样做的","start":580.27,"end":585.01},{"id":25,"text":"between V and Q? You can think of an expectation as an average, and so in","zh":"那么你可以将期望视为平均值，因此","start":587.77,"end":596.53},{"id":26,"text":"that sense there is going to be a normalization. Because if you were","zh":"从这个意义上说，存在归一化。因为如果你是","start":596.53,"end":600.65},{"id":27,"text":"to, for example, try to estimate this expectation with samples, you would","zh":"例如，如果你想用样本估计这个期望值，你会","start":600.65,"end":604.39},{"id":28,"text":"take some number of examples. If you only use these two samples to estimate Q,","zh":"选取一些示例。如果你只用这两个样本来估计Q值，","start":604.39,"end":608.41},{"id":29,"text":"then you would divide by two versus here if you're using five samples you would divide by five.","zh":"那么你会除以二，而在这里如果你使用五个样本，你会除以五。","start":608.41,"end":612.61},{"id":30,"text":"Is there a way that you can get from this equation to the useful relation on the slide?","zh":"有没有办法从这个等式推导出幻灯片上有用的关联关系？","start":613.57,"end":617.79},{"id":31,"text":"Is that what you're asking? Yeah, so if you write out","zh":"这是你在问的吗？是的，所以如果你写出","start":618.05,"end":623.49},{"id":32,"text":"the... so if you write out... we can write out first what q pi looks like. So q pi of a given","zh":"……所以如果你写出……我们可以先写出q pi的表达式。对于给定的","start":623.49,"end":636.15},{"id":33,"text":"state and action. We're going to assume that we","zh":"状态和动作，我们将假设我们","start":636.73,"end":640.15},{"id":34,"text":"are going to condition on STAT because that's","zh":"将条件设定在STAT上，因为那是","start":640.15,"end":644.75},{"id":35,"text":"where we're starting. And then this is the expected sum of rewards.","zh":"我们从这里开始。然后这是预期的奖励总和。","start":644.75,"end":647.91},{"id":36,"text":"So a sum over t prime equals t to t. And then we're going to have an expectation of running the policy here. And then a sum of rewards. And then in terms of seeing how to get between these two things, this is a...","zh":"所以这是从 t' 等于 t 到 t 的总和。然后我们将在这里对策略进行期望运算。然后是奖励的总和。在理解如何在这两者之间转换时，这是一些……","start":651.85,"end":682.9}],"notes":["本段讨论了价值函数V和Q函数之间的关系，特别是如何通过Q值减去V值来衡量特定动作相对于遵循策略的优劣。这被称为优势函数，用于评估在给定状态下采取某个动作相对于遵循策略的优劣。","讲者提到，期望值可以视为平均值，因此在计算期望值时，需要根据样本数量进行归一化处理。例如，使用两个样本时除以2，使用五个样本时除以5。","讲者进一步询问是否可以通过当前的公式推导出幻灯片上提到的有用关系，并指出需要写出Q值的表达式，以展示如何从期望值推导出优势函数。","讲者提到，假设我们以状态STAT为条件，因为这是开始的地方，并指出Q值是预期奖励的总和，涉及从时间t到t的求和，以及在策略下运行的期望值。","讲者最后提到，需要进一步探讨如何在这些概念之间建立联系，这可能涉及更深入的数学推导。","整个段落强调了在Actor-Critic算法中，优势函数的计算和归一化处理的重要性，以及如何通过期望值和Q值之间的关系来实现策略优化。"],"formulas":[{"latex":"Q(s, a) - V(s)","symbols":"Q值减去价值函数","explanation":"公式正确，表示某个状态-动作对的Q值与对应状态的价值函数之差，用于衡量采取特定动作相对于遵循策略的优劣。","evidence":"And for this, we can think about, like, what is, if you consider the Q value minus the value function, that's going to tell you, like, how good is it to take action A versus following the policy"},{"latex":"E\\left[\\sum_{t'=t}^{\\infty} R_{t'}\\right]","symbols":"期望的奖励总和","explanation":"公式正确，表示从时间步t开始的未来奖励的期望总和，这是价值函数和Q值的定义基础。","evidence":"where we're starting. And then this is the expected sum of rewards."}],"uncertainties":["STAT可能为状态的缩写，但具体含义未明确。","t prime equals t to t的表达可能不完整，需进一步确认上下文。","sum over t prime equals t to t的表达可能不完整，需进一步确认上下文。"],"diagram":"none","start":522.13,"end":682.9,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均符合强化学习中价值函数和Q值的定义，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":522.13,"text":"Now, one thing that's useful to think about in terms of how these two relate to each other is you can think of the value of a state as if you take an expectation over the actions that the policy would have taken, you can think of it as the average or the expectation of the Q values over all the actions that the policy would have taken. And then one last object that we'll use today is thinking about"},{"start":550.77,"text":"how good is a particular action relative to other actions that we might take?"},{"start":558.39,"text":"And for this, we can think about, like, what is, if you consider the Q value minus the value"},{"start":567.87,"text":"function, that's going to tell you, like, how good is it to take action A versus following the policy"},{"start":573.37,"text":"at a given state? And this is kind of like, what is the advantage of taking one action versus"},{"start":580.27,"text":"following the policy. Good question. So the question was, is there a normalization"},{"start":587.77,"text":"between V and Q? You can think of an expectation as an average, and so in"},{"start":596.53,"text":"that sense there is going to be a normalization. Because if you were"},{"start":600.65,"text":"to, for example, try to estimate this expectation with samples, you would"},{"start":604.39,"text":"take some number of examples. If you only use these two samples to estimate Q,"},{"start":608.41,"text":"then you would divide by two versus here if you're using five samples you would divide by five."},{"start":613.57,"text":"Is there a way that you can get from this equation to the useful relation on the slide?"},{"start":618.05,"text":"Is that what you're asking? Yeah, so if you write out"},{"start":623.49,"text":"the... so if you write out... we can write out first what q pi looks like. So q pi of a given"},{"start":636.73,"text":"state and action. We're going to assume that we"},{"start":640.15,"text":"are going to condition on STAT because that's"},{"start":644.75,"text":"where we're starting. And then this is the expected sum of rewards."},{"start":651.85,"text":"So a sum over t prime equals t to t. And then we're going to have an expectation of running the policy here. And then a sum of rewards. And then in terms of seeing how to get between these two things, this is a..."}],"speech_gaps":[],"frame":"../frames/v031/004.webp","frame_time":534.13},{"title":"Actor-Critic算法中的价值函数与优势函数","segments":[{"id":37,"text":"You can think of this as a sum over words of under AT sampled from, or kind of future actions sampled from pi. Whereas this one, AT, is not sampled from pi, but all future actions are sampled from pi. In this case, we're kind of conditioning on the action that's kind of provided as input. In this case, we're sampling from the policy. And so if instead you sample the... ","zh":"你可以将这视为对从π中采样的未来动作的求和，或者说是从π中采样的未来动作的某种形式。而这里的AT并不是从π中采样的，但所有未来的动作都是从π中采样的。在这种情况下，我们是在条件概率下，基于输入的动作进行计算。在这种情况下，我们是从策略中进行采样。因此，如果你从策略中采样动作，然后将其输入到这里，你就会得到这里的结果。","start":684.65,"end":712.99},{"id":38,"text":"the action from the policy and then feed that in to here, then you'll get this right here. Okay, so to help you start thinking about some of these quantities, let's look at an example. And so say that you are this person right here. You really want to learn how to play the drums.","zh":"为了帮助你开始思考这些量，让我们看一个例子。假设你就是这里这个人。你非常想学习如何打鼓。","start":714.62,"end":738.13},{"id":39,"text":"And your reward is one if you can play the music in a month and zero otherwise. So capital T is a month from now. And your action space, you have three different possible actions in your action space. One action is to like sit on the beach. Another action is to watch TV. And another action is to practice playing the drums.","zh":"你的奖励是：如果你能在一个月内演奏音乐则为1，否则为0。大写T代表一个月后的时间。你的动作空间中有三个可能的动作。一个动作是坐在海滩上，另一个动作是看电视，第三个动作是练习打鼓。","start":739.27,"end":763.97},{"id":40,"text":"And say that your current policy right now is just to sit on the beach, and you do that for all states. Now, my question for you to think about is, what are each of these quantities for the action of A1, for the action of A2, and for the action of A3? And so specifically, you want to think about what is the value function of your current state for this policy.","zh":"假设你当前的策略就是一直坐在海滩上，并且在所有状态下都这样做。现在，我让你思考的问题是，对于动作A1、A2和A3，这些量分别是多少？具体来说，你想要思考的是，对于当前状态，这个策略的价值函数是多少。","start":765.34,"end":793.24},{"id":41,"text":"What is your Q function for if you were to follow each of these actions once and then follow this policy? And then what is your advantage function for the current state that you're in and for each of these actions? And you can assume that in the current state that you're in, you do not know how to play the drums.","zh":"如果你依次执行这些动作，然后遵循这个策略，那么你的Q函数是多少？此外，对于你当前所处的状态和每个动作，你的优势函数是多少？你可以假设，在你当前所处的状态下，你并不知道如何演奏鼓乐。","start":794.8,"end":818.88},{"id":42,"text":"What was described is for the value function, for this particular policy that's always sitting on the beach, the value is zero because the person would not learn to play the drum. So that's the sum of expected rewards for this policy for VPI. For the Q function, if you sit on the beach at the current time step or watch TV, the Q function will be zero for those actions. Whereas if...","zh":"所描述的是价值函数的情况，对于这个总是坐在海滩上的特定策略，其价值为零，因为这个人不会学会演奏鼓乐。这是该策略下VPI的预期奖励总和。对于Q函数，如果你在当前时间步坐在海滩上或看电视，那么这些动作的Q函数值为零。而如果……","start":819.76,"end":846.16}],"notes":["本段讲解了Actor-Critic算法中价值函数和优势函数的概念，通过一个学习打鼓的例子来说明。价值函数是当前状态在特定策略下的期望回报，而优势函数衡量了采取某个动作相对于策略平均表现的优劣。"],"formulas":[],"uncertainties":["VPI在原文中可能指的是Value of Policy Improvement，但未明确说明，需进一步确认。"],"diagram":"none","start":684.65,"end":846.16,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":684.65,"text":"You can think of this as a sum over words of under AT sampled from, or kind of future actions sampled from pi. Whereas this one, AT, is not sampled from pi, but all future actions are sampled from pi. In this case, we're kind of conditioning on the action that's kind of provided as input. In this case, we're sampling from the policy. And so if instead you sample the..."},{"start":714.62,"text":"the action from the policy and then feed that in to here, then you'll get this right here. Okay, so to help you start thinking about some of these quantities, let's look at an example. And so say that you are this person right here. You really want to learn how to play the drums."},{"start":739.27,"text":"And your reward is one if you can play the music in a month and zero otherwise. So capital T is a month from now. And your action space, you have three different possible actions in your action space. One action is to like sit on the beach. Another action is to watch TV. And another action is to practice playing the drums."},{"start":765.34,"text":"And say that your current policy right now is just to sit on the beach, and you do that for all states. Now, my question for you to think about is, what are each of these quantities for the action of A1, for the action of A2, and for the action of A3? And so specifically, you want to think about what is the value function of your current state for this policy."},{"start":794.8,"text":"What is your Q function for if you were to follow each of these actions once and then follow this policy? And then what is your advantage function for the current state that you're in and for each of these actions? And you can assume that in the current state that you're in, you do not know how to play the drums."},{"start":819.76,"text":"What was described is for the value function, for this particular policy that's always sitting on the beach, the value is zero because the person would not learn to play the drum. So that's the sum of expected rewards for this policy for VPI. For the Q function, if you sit on the beach at the current time step or watch TV, the Q function will be zero for those actions. Whereas for if..."}],"speech_gaps":[],"frame":"../frames/v031/005.webp","frame_time":696.65},{"title":"Actor-Critic算法中的价值函数与优势函数","segments":[{"id":43,"text":"The cue function for playing the drums at the current time step would be one if that amount of practicing is sufficient. It's also possible that it would be a bit lower than one if you, for example, practice for like an hour and then sit on the beach by following the policy afterwards. It kind of depends a little bit on what the time kind of...","zh":"在当前时间步演奏鼓的提示函数将会是1，如果该程度的练习已经足够。也有可能，如果你例如练习一小时，然后按照策略坐在海滩上，它会比1稍低一些。这在一定程度上取决于时间的长短……","start":846.76,"end":866.9},{"id":44,"text":"how long a given time step is. And then the advantage function is going to be q minus v, and so it's going to be a positive number for the action of practicing, and it'll be zero for the other two actions. So the question is, if practicing is not enough to actually learn, would it be one? Would it be between zero and one? Would it be zero?","zh":"时间步的长度。然后优势函数将是q减去v，因此对于练习这个动作，它将是一个正数，而对于另外两个动作则为零。问题是，如果练习不足以真正学习，它会是1吗？会是在0和1之间吗？会是0吗？","start":867.18,"end":888.66},{"id":45,"text":"It basically actually represents the probability in which you would be able to play this, given that you had practiced for that amount of time. And that probability...","zh":"它基本上代表了在你练习了该时间段后，你能够演奏这个的概率。而这个概率……","start":890.28,"end":898.7},{"id":46,"text":"It could be zero, like maybe this is really hard after just practicing once. It could also be maybe for someone who's extremely talented, they only need to practice once. That could be a bit higher for someone that's a bit more talented. It depends on various factors like that. Kind of along those lines, if you think about the value function, if you're playing a game of chess, for example, the value function is the probability that you're going to win.","zh":"可能是0，比如在仅仅练习一次后，这可能非常困难。也可能是对于极其有天赋的人，他们只需要练习一次。对于稍微有天赋的人，这个概率可能稍高一些。这取决于各种因素。类似地，如果你考虑价值函数，比如在下棋的游戏中，价值函数是赢得比赛的概率。","start":900.27,"end":928.77},{"id":47,"text":"for a given person and for a given game state. So it's kind of evaluating how good is the state for a particular person. That's another way to think about it. Okay, cool. So those are the objects that we're going to be using quite a bit today. Now let's go back to policy gradients and see how we can use value functions to make this algorithm better.","zh":"对于特定的人和特定的游戏状态。因此，它在某种程度上评估了该状态对特定人的优劣程度。这是另一种思考方式。好的，明白了。因此，这些是我们今天将要大量使用的目标。现在让我们回到策略梯度，并看看我们如何利用价值函数来改进这个算法。","start":929.57,"end":955.24},{"id":48,"text":"We talked about a couple examples on Wednesday of some scenarios that were dissatisfying about policy gradients. And the first was that if we are trying to learn how to walk and we have a policy that takes a small step forwards and then falls backwards, we will push down the likelihood of taking a step forwards because we don't necessarily know that that might have led it to fall backwards. Now, if we actually...","zh":"我们在周三讨论了一些关于策略梯度令人不满的场景的例子。第一个例子是，如果我们试图学习如何行走，并且有一个策略采取一小步向前然后向后摔倒，我们会降低采取向前一步的可能性，因为我们并不确定这是否导致了向后摔倒。现在，如果我们实际上……","start":957.85,"end":984.91},{"id":49,"text":"had some understanding that taking a small step forward was making progress, was actually good, was advantageous, then we might be able to actually increase the likelihood of that. And so this is starting to hint at some of the intuition behind actor critic methods. And likewise, we talked about this example of trying to fold a jacket.","zh":"如果有人有一些理解，认为向前迈出一小步是在取得进展，实际上是有好处的，那么我们可能能够真正增加这种情况发生的可能性。因此，这开始暗示了actor-critic方法背后的一些直觉。同样，我们讨论了尝试折叠外套这个例子。","start":985.18,"end":1004.71}],"notes":["本段主要讲解了在强化学习中，价值函数和优势函数的概念。价值函数表示在给定状态和策略下，能够成功完成任务的概率，而优势函数则是价值函数与状态价值函数的差值，用于衡量某个动作相对于平均动作的优劣。例如，在打鼓的例子中，价值函数表示在练习一定时间后能够成功演奏的概率，而优势函数则表示练习动作相对于其他动作的优劣。","在价值函数的讨论中，作者以国际象棋为例，说明价值函数是给定玩家和游戏状态下的获胜概率，用于评估当前状态对特定玩家的有利程度。这表明价值函数不仅与状态有关，还与玩家的策略和能力有关。","在讨论策略梯度方法的局限性时，作者提到一个例子：如果策略导致小步前进后却后退，那么策略梯度方法会降低前进动作的概率，因为无法确定前进是否导致了后退。这说明策略梯度方法在处理长期依赖和因果关系时存在困难。","作者进一步指出，如果能够理解某个动作（如小步前进）是积极的，那么可以增加该动作的概率，这为Actor-Critic方法提供了直观的动机。Actor-Critic方法通过引入价值函数来评估动作的优劣，从而改进策略梯度方法。","最后，作者提到另一个例子：尝试折叠夹克，这可能涉及复杂的动作序列，需要价值函数来评估不同动作的优劣。这表明价值函数在处理复杂任务时的重要性。","整体来看，本段通过多个例子说明了价值函数和优势函数在强化学习中的作用，并指出策略梯度方法的局限性，为后续介绍Actor-Critic方法奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":846.76,"end":1004.71,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":846.76,"text":"The cue function for playing the drums at the current time step would be one if that amount of practicing is sufficient. It's also possible that it would be a bit lower than one if you, for example, practice for like an hour and then sit on the beach by following the policy afterwards. It kind of depends a little bit on what the time kind of..."},{"start":867.18,"text":"how long a given time step is. And then the advantage function is going to be q minus v, and so it's going to be a positive number for the action of practicing, and it'll be zero for the other two actions. So the question is, if practicing is not enough to actually learn, would it be one? Would it be between zero and one? Would it be zero?"},{"start":890.28,"text":"It basically actually represents the probability in which you would be able to play this, given that you had practiced for that amount of time. And that probability..."},{"start":900.27,"text":"It could be zero, like maybe this is really hard after just practicing once. It could also be maybe for someone who's extremely talented, they only need to practice once. That could be a bit higher for someone that's a bit more talented. It depends on various factors like that. Kind of along those lines, if you think about the value function, if you're playing a game of chess, for example, the value function is the probability that you're going to win."},{"start":929.57,"text":"for a given person and for a given game state. So it's kind of evaluating how good is the state for a particular person. That's another way to think about it. Okay, cool. So those are the objects that we're going to be using quite a bit today. Now let's go back to policy gradients and see how we can use value functions to make this algorithm better."},{"start":957.85,"text":"We talked about a couple examples on Wednesday of some scenarios that were dissatisfying about policy gradients. And the first was that if we are trying to learn how to walk and we have a policy that takes a small step forwards and then falls backwards, we will push down the likelihood of taking a step forwards because we don't necessarily know that that might have led it to fall backwards. Now, if we actually..."},{"start":985.18,"text":"had some understanding that taking a small step forward was making progress, was actually good, was advantageous, then we might be able to actually increase the likelihood of that. And so this is starting to hint at some of the intuition behind actor critic methods. And likewise, we talked about this example of trying to fold a jacket."}],"speech_gaps":[],"frame":"../frames/v031/006.webp","frame_time":858.76},{"title":"Actor-Critic算法中的轨迹利用与Q函数","segments":[{"id":50,"text":"And we found that if you have a sparse reward and you only do part of the task, like folding only the sleeves or flattening the jacket but not folding it, you aren't really utilizing the trajectories that are getting zero reward. And kind of similar to this case, if we instead kind of understood that these actions are advantageous for making progress on the task, then we might actually be able to figure out how to use these trajectories in a positive way.","zh":"我们发现，如果你有一个稀疏奖励的情况，并且只完成了任务的一部分，比如只折袖子或压平外套但没有折叠，那么你实际上并没有真正利用那些获得零奖励的轨迹。类似地，如果我们理解这些动作对于任务进展是有利的，那么我们实际上可能能够找出如何以积极的方式使用这些轨迹。","start":1005.29,"end":1034.47},{"id":51,"text":"And so to summarize here, policy gradients don't always make an efficient use of data that we've collected. And if we can try to figure out what actions are advantageous versus not advantageous, we might be able to make better use of that data. So the question was, if it's not clear if a positive step, if a step forward is helpful or not, is that going to be negative or neutral? In the case of the policy gradient, in case of this policy gradient algorithm,","zh":"因此，总结一下，策略梯度方法并不总是高效地利用我们收集到的数据。如果我们能够区分哪些动作是有利的，哪些是没有利的，那么我们可能能够更好地利用这些数据。问题是，如果不清楚一个正向步骤是有帮助的还是没有帮助的，那么这会是负面的还是中性的？在策略梯度的情况下，在这个策略梯度算法中，","start":1035.13,"end":1062.7},{"id":52,"text":"The trajectory that we considered here in the context of the batch of trajectories was kind of net negative, was below average, because the reward to go is quite negative. It's actually making backwards progress in this trajectory. And so it actually is going to be pushing down the likelihood of taking a step forward because the future reward to go is negative.","zh":"我们在这里考虑的轨迹，在批量轨迹的背景下，总体上是负的，低于平均水平，因为未来奖励的总和相当负面。实际上，这个轨迹是在向后进展。因此，它实际上会降低采取正向步骤的可能性，因为未来奖励的总和是负的。","start":1064.97,"end":1088.85},{"id":53,"text":"And what we'll talk about today is algorithms that in principle could actually increase the likelihood for taking the step forward and decrease the likelihood for falling backwards. Okay. So how do we do that? A lot of what we'll focus on today is this piece right here. This is what's actually telling us that we should push down the likelihood if we have negative rewards in the future. And this quantity, it's estimating the future rewards.","zh":"今天我们将讨论的算法，原则上可以增加采取正向步骤的可能性，同时降低向后倒退的可能性。好的。那么我们如何做到这一点？今天我们将重点讨论的大部分内容就是这个部分。这是告诉我们，如果我们有未来的负奖励，我们就应该降低可能性。这个量，它是在估计未来的奖励。","start":1089.38,"end":1121.83},{"id":54,"text":"if we take action A in state S. And so we can kind of think about it as, in this picture right here, it looks a lot like what is the sum of rewards if we started right here with state S and action A. And then if we think about this picture, we were looking at this quantity in terms of like what we observed in trajectories, but","zh":"如果我们采取动作A在状态S中。因此，我们可以这样想，在这张图中，看起来像是从状态S和动作A开始，奖励的总和是多少。然后，如果我们考虑这张图，我们是在用轨迹中观察到的量来考虑这个量，但","start":1122.52,"end":1151.04},{"id":55,"text":"what would be an even better version of this quantity would be to actually use the Q function. And if we could replace this with the Q function, then we would be able to get a much better estimate of whether or not we should push up the likelihood or push down the likelihood. And so looking at the slides right now, what we do is we, for like a single trajectory, we sum together the rewards that we saw.","zh":"如果我们能够用Q函数来替代这个量，那么我们将能够更准确地估计是否应该提高或降低似然值。现在看幻灯片，我们对于一条轨迹，会把所观察到的奖励进行求和。","start":1151.56,"end":1175.47}],"notes":["本段讨论了策略梯度方法在利用轨迹数据时的局限性，特别是当轨迹的奖励为负时，策略梯度方法会降低采取正向动作的可能性。讲者指出，如果无法明确判断某个动作是否有助于任务进展，那么该动作可能对策略更新产生负面影响或中性影响。","讲者进一步说明，轨迹的奖励总和（reward to go）可能为负，这会导致策略梯度方法降低采取正向动作的概率。这是因为负的未来奖励会降低动作的似然性，从而影响策略的更新。","接下来，讲者提出了一种改进方法，即使用Q函数来替代当前的奖励估计。Q函数能够更准确地估计未来奖励，从而帮助策略梯度方法更有效地调整动作的似然性。","讲者提到，Q函数可以提供更精确的未来奖励估计，从而帮助判断是否应该增加或减少某个动作的似然性。这为后续的Actor-Critic算法奠定了基础，即通过Q函数来指导策略的更新。","在实际操作中，讲者指出，对于单个轨迹，我们通常会将观察到的奖励进行求和，以估计动作的总体效果。然而，这种方法可能不够准确，因此需要引入Q函数来改进估计。","最后，讲者强调，使用Q函数可以更有效地利用轨迹数据，从而提高策略梯度方法的效率。这为后续讨论Actor-Critic算法提供了理论依据。"],"formulas":[{"latex":"Q(s, a) = \\text{expected cumulative reward from state } s \\text{ and action } a","symbols":"Q(s, a) 表示从状态 s 和动作 a 开始的预期累积奖励","explanation":"公式表达清晰，符合强化学习中Q函数的标准定义，无需修改。","evidence":"what would be an even better version of this quantity would be to actually use the Q function. And if we could replace this with the Q function, then we would be able to get a much better estimate of whether or not we should push up the likelihood or push down the likelihood. And so looking at the slides right now, what we do is we, for like a single trajectory, we sum together the rewards that we saw."}],"uncertainties":[],"diagram":"none","start":1005.29,"end":1175.47,"asr_flags":[],"math_clarifications":["原始片段中未明确提及Q函数的具体数学形式，如是否包含折扣因子或期望值，因此无法核定其完整定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1005.29,"text":"And we found that if you have a sparse reward and you only do part of the task, like folding only the sleeves or flattening the jacket but not folding it, you aren't really utilizing the trajectories that are getting zero reward. And kind of similar to this case, if we instead kind of understood that these actions are advantageous for making progress on the task, then we might actually be able to figure out how to use these trajectories in a positive way."},{"start":1035.13,"text":"And so to summarize here, policy gradients don't always make an efficient use of data that we've collected. And if we can try to figure out what actions are advantageous versus not advantageous, we might be able to make better use of that data. So the question was, if it's not clear if a positive step, if a step forward is helpful or not, is that going to be negative or neutral? In the case of the policy gradient, in case of this policy gradient algorithm,"},{"start":1064.97,"text":"The trajectory that we considered here in the context of the batch of trajectories was kind of net negative, was below average, because the reward to go is quite negative. It's actually making backwards progress in this trajectory. And so it actually is going to be pushing down the likelihood of taking a step forward because the future reward to go is negative."},{"start":1089.38,"text":"And what we'll talk about today is algorithms that in principle could actually increase the likelihood for taking the step forward and decrease the likelihood for falling backwards. Okay. So how do we do that? A lot of what we'll focus on today is this piece right here. This is what's actually telling us that we should push down the likelihood if we have negative rewards in the future. And this quantity, it's estimating the future rewards."},{"start":1122.52,"text":"if we take action A in state S. And so we can kind of think about it as, in this picture right here, it looks a lot like what is the sum of rewards if we started right here with state S and action A. And then if we think about this picture, we were looking at this quantity in terms of like what we observed in trajectories, but"},{"start":1151.56,"text":"what would be an even better version of this quantity would be to actually use the Q function. And if we could replace this with the Q function, then we would be able to get a much better estimate of whether or not we should push up the likelihood or push down the likelihood. And so looking at the slides right now, what we do is we, for like a single trajectory, we sum together the rewards that we saw."}],"speech_gaps":[],"frame":"../frames/v031/007.webp","frame_time":1017.29},{"title":"Actor-Critic算法中的梯度与基线","segments":[{"id":56,"text":"which was in the case, the example before, the rewards were negative because we took a small step forwards and then fell backwards. But if instead what we could do is actually run the policy many, many times and get a Q function for the state, that would be the true expected rewards to go under the expectation of our policy. And this would be way better. We'd be able to get a much better sense for how good","zh":"在之前的例子中，奖励是负的，因为我们向前迈出了一小步，然后又向后跌落。但如果我们可以实际运行策略很多次，并为状态获得一个Q函数，那么这将是根据我们策略的期望的真实奖励。这会更好。我们将能够更准确地了解在该状态下采取该动作有多好。","start":1175.98,"end":1204.26},{"id":57,"text":"how good it was to take that action in that state.","zh":"在该状态下采取该动作有多好。","start":1205.86,"end":1208.82},{"id":58,"text":"So essentially, the form of the gradient","zh":"因此，梯度的形式","start":1214.14,"end":1216.24},{"id":59,"text":"would be able to get a much better gradient","zh":"将能够获得一个更好的梯度","start":1216.24,"end":1219.12},{"id":60,"text":"if the form of the gradient looked like this, where","zh":"如果梯度的形式像这样，其中","start":1219.12,"end":1221.74},{"id":61,"text":"we increase the likelihood of the actions for things","zh":"我们增加那些具有高Q值的动作的概率","start":1221.74,"end":1225.02},{"id":62,"text":"that have high Q values, and we decrease","zh":"并减少","start":1225.02,"end":1227.06},{"id":63,"text":"the likelihood of the actions for things","zh":"那些具有低Q值的动作的概率","start":1227.06,"end":1228.76},{"id":64,"text":"that have low Q values.","zh":"那些具有低Q值的情况。","start":1228.76,"end":1230.46},{"id":65,"text":"So that's kind of a first step. Now, taking things one step further, we also talked about","zh":"所以这基本上是一个初步的步骤。现在，进一步推进，我们还讨论了上一节课中的基线，其中基线是平均奖励。我们应该在这里使用基线吗？之前，基线是平均奖励。因此，在这种情况下，如果我们引入基线，我们可以思考使用什么。如果我们使用之前使用过的相同方法，我们可以使用这里的平均Q值。因此，我们可以使用一个平均值，比如我们采样一些SI和AI，然后对它们进行平均。","start":1233.32,"end":1240.92},{"id":66,"text":"baselines in the previous lecture, where the baseline was the average reward. Should we use","zh":"我们之前讨论过的内容实际上看起来非常相似。","start":1240.92,"end":1247.28},{"id":67,"text":"a baseline here? So before, the baselines were the average reward. And so in this case, if we","zh":"所以之前，基线是平均奖励。因此，在这种情况下，如果我们引入基线，我们可以思考使用什么。","start":1247.28,"end":1254.18},{"id":68,"text":"were to introduce baselines, we could think about what we might use. And if we use the","zh":"如果我们使用之前使用过的相同方法，我们可以使用这里的平均Q值。","start":1254.18,"end":1262.0},{"id":69,"text":"same thing that we used before, we could use the average Q value in this case. So we could","zh":"因此，我们可以使用一个平均值，比如我们采样一些SI和AI，然后对它们进行平均。","start":1262.0,"end":1269.02},{"id":70,"text":"use an average, like maybe we sample some SI and AI, and we average over those. And","zh":"我们之前讨论过的内容实际上看起来非常相似。","start":1269.02,"end":1283.5},{"id":71,"text":"what we had talked about a few slides ago is actually, this is actually looking a lot","zh":"我们之前几页谈到的内容实际上，这实际上看起来非常多","start":1284.88,"end":1290.36},{"id":72,"text":"like the value function. So we talked about the value of a given state is an expectation","zh":"就像价值函数一样。因此我们讨论了给定状态的价值是一个期望","start":1290.36,"end":1297.42},{"id":73,"text":"over actions sampled from the policy for that given state of the Q function for those actions.","zh":"在该给定状态下，根据策略采样的动作的Q函数的期望值。","start":1297.42,"end":1312.6},{"id":74,"text":"This is V pi. And so a natural baseline would actually be to use the value function. And so","zh":"这就是V pi。因此，一个自然的基线实际上是使用价值函数。因此","start":1312.7,"end":1321.04},{"id":75,"text":"So we could have, instead of having this be Q values, we could actually use Q minus V.","zh":"我们也可以不用这个Q值，而是使用Q减去V。","start":1321.04,"end":1327.26},{"id":76,"text":"And Q minus V is what the advantage function is.","zh":"Q减去V就是优势函数。","start":1328.42,"end":1331.4}],"notes":["本段讲解了在强化学习中，通过运行策略多次来估计状态的Q函数，从而获得更准确的预期奖励。这比仅依赖单次步骤的奖励更可靠，因为Q函数考虑了策略的长期影响。接着，讨论了梯度的形式，即通过增加高Q值动作的似然性，降低低Q值动作的似然性，从而优化策略。"],"formulas":[{"latex":"A(s, a) = Q(s, a) - V(s)","symbols":"优势函数A(s, a)是Q值与状态值函数V(s)的差","explanation":"该公式正确表达了优势函数的定义，即Q值与状态值函数的差，符合强化学习中的标准定义。","evidence":"So we could have, instead of having this be Q values, we could actually use Q minus V. And Q minus V is what the advantage function is."}],"uncertainties":["SI and AI"],"diagram":"none","start":1175.98,"end":1331.4,"asr_flags":[],"math_clarifications":["公式0是重复定义，没有提供新的数学信息，应移除。公式1正确表达了优势函数的定义，符合强化学习中的标准定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":1175.98,"text":"which was in the case, the example before, the rewards were negative because we took a small step forwards and then fell backwards. But if instead what we could do is actually run the policy many, many times and get a Q function for the state, that would be the true expected rewards to go under the expectation of our policy. And this would be way better. We'd be able to get a much better sense for how good"},{"start":1205.86,"text":"how good it was to take that action in that state."},{"start":1214.14,"text":"So essentially, the form of the gradient"},{"start":1216.24,"text":"would be able to get a much better gradient"},{"start":1219.12,"text":"if the form of the gradient looked like this, where"},{"start":1221.74,"text":"we increase the likelihood of the actions for things"},{"start":1225.02,"text":"that have high Q values, and we decrease"},{"start":1227.06,"text":"the likelihood of the actions for things"},{"start":1228.76,"text":"that have low Q values."},{"start":1233.32,"text":"So that's kind of a first step. Now, taking things one step further, we also talked about"},{"start":1240.92,"text":"baselines in the previous lecture, where the baseline was the average reward. Should we use"},{"start":1247.28,"text":"a baseline here? So before, the baselines were the average reward. And so in this case, if we"},{"start":1254.18,"text":"were to introduce baselines, we could think about what we might use. And if we use the"},{"start":1262.0,"text":"same thing that we used before, we could use the average Q value in this case. So we could"},{"start":1269.02,"text":"use an average, like maybe we sample some SI and AI, and we average over those. And"},{"start":1284.88,"text":"what we had talked about a few slides ago is actually, this is actually looking a lot"},{"start":1290.36,"text":"like the value function. So we talked about the value of a given state is an expectation"},{"start":1297.42,"text":"over actions sampled from the policy for that given state of the Q function for those actions."},{"start":1312.7,"text":"This is V pi. And so a natural baseline would actually be to use the value function. And so"},{"start":1321.04,"text":"So we could have, instead of having this be Q values, we could actually use Q minus V."},{"start":1328.42,"text":"And Q minus V is what the advantage function is."}],"speech_gaps":[],"frame":"../frames/v031/008.webp","frame_time":1187.98},{"title":"Actor-Critic算法中的优势函数与梯度估计","segments":[{"id":77,"text":"putting this together, we would be increasing the likelihood for actions that have a high advantage and decreasing the likelihood for actions that have a low advantage. And so then if you think back to the example of learning to practice playing the drums, the action of practicing had a high advantage relative to the current policy. And so then we would choose to increase the likelihood for practicing.","zh":"将这些内容综合起来，我们会增加那些具有高优势的动作的概率，同时降低那些具有低优势的动作的概率。因此，如果你回想一下学习打鼓的例子，练习这个动作相对于当前策略具有较高的优势。因此，我们会选择增加练习这个动作的概率。","start":1334.51,"end":1363.6},{"id":78,"text":"and decrease the likelihood for the other actions. Cool. And another way to think about this is that better estimates of this advantage function will lead to less noisy gradient. And if we knew the true advantage function, then we would be able to get a very, very good gradient. Unfortunately, we don't know the true advantage function. And so the next question that we'll talk about over the next several slides is, how can we estimate?","zh":"并减少其他动作的概率。很好。另一种思考方式是，更好的优势函数估计将导致更少噪声的梯度。如果我们知道真实的优势函数，那么我们就能得到非常、非常好的梯度。不幸的是，我们并不知道真实的优势函数。因此，接下来我们将讨论的问题是，如何进行估计？","start":1364.25,"end":1394.61},{"id":79,"text":"the advantage function. So the question was, how is this different from how we're sampling in the original policy gradient? And so what we're using before is we were doing this, we would take one sample and then for a given state and action in that trajectory, we would sum the rewards just for that individual thing.","zh":"优势函数。问题是，这与我们在原始策略梯度中采样的方式有什么不同？之前我们使用的是，我们进行一次采样，然后对于轨迹中的某个状态和动作，我们只对该个体的情况求和奖励。","start":1395.26,"end":1422.3},{"id":80,"text":"And now what we're saying is that instead of... And this is going to be a very noisy estimate because we just have one trajectory here. We just have one data point to estimate these rewards. And now what we're saying here is that we're going to try to get a sense for what the advantage of this action is. Now, one way... We'll actually start to talk about how we do that in a minute. But if you want to think about what is the true advantage of this action, conceptually, if you were to...","zh":"现在我们说的是，我们不再这样做……而且这将是一个非常嘈杂的估计，因为我们只有一个轨迹。我们只有一个数据点来估计这些奖励。现在我们说的是，我们要尝试了解这个动作的优势。现在，一种方法……我们稍后会开始讨论如何做到这一点。但如果你想思考这个动作的真实优势是什么，从概念上讲，如果你能够……","start":1423.61,"end":1450.76},{"id":81,"text":"take this state in action and then roll out the policy an infinite number of times for this action versus for following the policy in other scenarios, that's what would give us the advantage. Yeah, so the question is...","zh":"现在我们说的是，我们不再这样做……而且这将是一个非常嘈杂的估计，因为我们只有一个轨迹。我们只有一个数据点来估计这些奖励。现在我们说的是，我们要尝试了解这个动作的优势。现在，一种方法……我们稍后会开始讨论如何做到这一点。但如果你想思考这个动作的真实优势是什么，从概念上讲，如果你能够……","start":1452.64,"end":1466.64},{"id":82,"text":"In policy gradient, we got to where we were by optimizing the expected sum of rewards. Does this also optimize some objective? So this is also optimizing the expected sum of rewards. It's actually optimizing the same exact function. We haven't talked about how to get A yet, but if you had a perfect A, this would be giving you the correct gradient for that objective.","zh":"在策略梯度中，我们通过优化预期奖励总和到达了当前的状态。这也会优化某个目标吗？因此，这也是在优化预期奖励总和。实际上，它是在优化完全相同的函数。我们还没有讨论如何得到A，但如果有一个完美的A，这将为你提供该目标的正确梯度。","start":1467.53,"end":1494.17}],"notes":["本段讲解了Actor-Critic算法中如何利用优势函数来调整策略，通过增加高优势动作的概率和降低低优势动作的概率，从而优化策略。优势函数的估计对于减少梯度噪声至关重要，但实际中我们无法直接获得真实的优势函数，因此需要估计。","在原始策略梯度方法中，我们通过单个轨迹来估计奖励，这会导致估计结果非常嘈杂。而Actor-Critic方法通过引入优势函数，试图更准确地估计动作的价值，从而提高梯度估计的准确性。","优势函数的估计可以通过比较当前策略在特定动作下的表现与遵循其他策略的表现来实现。这需要对策略进行无限次的模拟，以获得更准确的估计。","策略梯度方法通过优化期望奖励总和来更新策略，而Actor-Critic方法同样优化相同的期望奖励总和。优势函数的引入使得梯度估计更加精确，但需要准确估计优势函数才能实现这一点。","在实际应用中，优势函数的估计是通过经验数据进行的，而不是通过理论上的无限次模拟。因此，需要设计有效的估计方法来近似优势函数。","本段强调了优势函数在策略优化中的核心作用，以及其估计对梯度噪声的影响。同时，也指出了在实际应用中如何通过经验数据来估计优势函数的问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1334.51,"end":1494.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1334.51,"text":"putting this together, we would be increasing the likelihood for actions that have a high advantage and decreasing the likelihood for actions that have a low advantage. And so then if you think back to the example of learning to practice playing the drums, the action of practicing had a high advantage relative to the current policy. And so then we would choose to increase the likelihood for practicing."},{"start":1364.25,"text":"and decrease the likelihood for the other actions. Cool. And another way to think about this is that better estimates of this advantage function will lead to less noisy gradient. And if we knew the true advantage function, then we would be able to get a very, very good gradient. Unfortunately, we don't know the true advantage function. And so the next question that we'll talk about over the next several slides is, how can we estimate?"},{"start":1395.26,"text":"the advantage function. So the question was, how is this different from how we're sampling in the original policy gradient? And so what we're using before is we were doing this, we would take one sample and then for a given state and action in that trajectory, we would sum the rewards just for that individual thing."},{"start":1423.61,"text":"And now what we're saying is that instead of... And this is going to be a very noisy estimate because we just have one trajectory here. We just have one data point to estimate these rewards. And now what we're saying here is that we're going to try to get a sense for what the advantage of this action is. Now, one way... We'll actually start to talk about how we do that in a minute. But if you want to think about what is the true advantage of this action, conceptually, if you were to..."},{"start":1452.64,"text":"take this state in action and then roll out the policy an infinite number of times for this action versus for following the policy in other scenarios, that's what would give us the advantage. Yeah, so the question is..."},{"start":1467.53,"text":"In policy gradient, we got to where we were by optimizing the expected sum of rewards. Does this also optimize some objective? So this is also optimizing the expected sum of rewards. It's actually optimizing the same exact function. We haven't talked about how to get A yet, but if you had a perfect A, this would be giving you the correct gradient for that objective."}],"speech_gaps":[],"frame":"../frames/v031/009.webp","frame_time":1346.51},{"title":"Actor-Critic算法中的基线与价值估计","segments":[{"id":83,"text":"modulo the sampling here being used to sample states and actions. Is the baseline an average over the current trajectory or an average over all trajectories? Yeah. So if we set it to be the value function v, that would be an infinite number of samples. We haven't yet talked about how we're actually going to estimate a or estimate q versus v.","zh":"这里采样用于采样状态和动作。基线是当前轨迹的平均值，还是所有轨迹的平均值？是的。如果我们将其设置为价值函数 v，那么这就相当于无限数量的样本。我们尚未讨论如何实际估计 a 或估计 q 与 v。","start":1496.16,"end":1524.46},{"id":84,"text":"So we'll talk about that in a minute. But yeah, 4v, conceptually that would be over an infinite number. But I'm talking about this is the true value so far. We haven't talked about how to estimate the value yet. Yeah, so the question is, is this unbiased?","zh":"我们稍后会讨论这一点。但概念上，4v 是在无限数量上进行的。但我要说的是，这是到目前为止的真实价值。我们尚未讨论如何估计价值。是的，问题是，这个估计是否无偏？","start":1524.99,"end":1541.54},{"id":85,"text":"It is unbiased. You can go through the math. I won't go through that today for the sake of time. But yeah, this is an unbiased estimate of the gradient if you have the true advantage. Now, we will see things that are biased later today. Okay, so let's actually talk about how do we use this. And actually, just as a quick overview of what the algorithm will look like for this form of algorithm.","zh":"它是无偏的。你可以通过数学推导来验证。为了节省时间，我今天不会详细讲解。但是的，如果你有真实的优势，这就是梯度的无偏估计。我们稍后会看到一些有偏的估计。好的，那么我们实际上来谈谈如何使用它。并且，作为一个快速概述，这种算法形式的算法会是什么样子。","start":1542.64,"end":1568.44},{"id":86,"text":"before we had this loop between running the policy and improving the policy. Now we're going to have an additional step where we're going to fit a model that's going to estimate the expected return. Essentially, it's going to try to estimate this A right here. Our new algorithm will have a few different steps. One is to run the policy, one is to try to estimate","zh":"之前我们有在运行策略和改进策略之间的循环。现在我们将增加一个额外的步骤，即拟合一个模型来估计预期回报。本质上，它将尝试估计这里的 A。我们的新算法将包含几个不同的步骤。一个是运行策略，一个是尝试估计","start":1569.52,"end":1591.44},{"id":87,"text":"estimate values. And then the last will be then to use that estimate and the data that was collected to improve the policy. And so this step will involve estimating either V pi, Q pi, or A pi. And this step will be kind of similar to before, except it's going to use these estimates right here. Okay, so how do we actually estimate these values?","zh":"估计值。然后最后一步是使用这个估计值和收集到的数据来改进策略。因此，这一步将涉及估计 V π、Q π 或 A π。这一步将与之前类似，只是它将使用这些估计值。好的，那么我们实际上如何估计这些值？","start":1592.28,"end":1621.86},{"id":88,"text":"So we want to estimate this, this quantity right here. And to start out, we need to think about how we want to get to A pi. And we could try to directly fit A pi, although it's actually a little bit challenging to get direct supervision for the advantages.","zh":"我们想要估计这个，这里的量。为了开始，我们需要考虑如何得到 A π。我们可以尝试直接拟合 A π，尽管实际上直接监督优势是有一定挑战的。","start":1622.8,"end":1645.48},{"id":89,"text":"And so we're actually going to try to fit v pi.","zh":"因此，我们实际上会尝试拟合 v π。","start":1646.6,"end":1650.3},{"id":90,"text":"And the way that we're going to get there is we, let's see,","zh":"我们到达那里的方式是，让我们看看，","start":1650.48,"end":1657.04},{"id":91,"text":"where do we want to go?","zh":"我们想要去哪里？","start":1657.12,"end":1657.88}],"notes":["本段讨论了Actor-Critic算法中基线的定义，即是否是对当前轨迹或所有轨迹的平均。教师指出，如果基线是价值函数v，则需要无限多的样本。同时，教师提到尚未讨论如何估计a或q与v，以及是否无偏的问题。","教师确认了该估计是无偏的，但指出今天不会详细推导数学证明。随后，教师提到后续会看到有偏的估计，并开始讨论如何使用该估计。","教师介绍了Actor-Critic算法的结构，包括运行策略、估计值和改进策略三个步骤。与之前的策略改进循环不同，现在增加了估计期望回报的步骤，用于估计优势函数A。","教师提到估计这些值（Vπ、Qπ或Aπ）的步骤与之前类似，但会使用这些估计值。随后，教师讨论了如何估计这些值，指出直接拟合优势函数Aπ可能具有挑战性，因此选择拟合价值函数Vπ。","教师提到拟合Vπ的方法，但未具体说明，而是询问了下一步的方向，即如何从当前状态到达目标状态。这表明教师正在引导学生思考如何实现价值函数的估计。","教师的讲解涵盖了Actor-Critic算法的基本结构，包括基线的定义、无偏性、价值函数的估计以及算法的步骤。这些内容为后续讨论如何具体实现价值函数的估计奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1496.16,"end":1657.88,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":1496.16,"text":"modulo the sampling here being used to sample states and actions. Is the baseline an average over the current trajectory or an average over all trajectories? Yeah. So if we set it to be the value function v, that would be an infinite number of samples. We haven't yet talked about how we're actually going to estimate a or estimate q versus v."},{"start":1524.99,"text":"So we'll talk about that in a minute. But yeah, 4v, conceptually that would be over an infinite number. But I'm talking about this is the true value so far. We haven't talked about how to estimate the value yet. Yeah, so the question is, is this unbiased?"},{"start":1542.64,"text":"It is unbiased. You can go through the math. I won't go through that today for the sake of time. But yeah, this is an unbiased estimate of the gradient if you have the true advantage. Now, we will see things that are biased later today. Okay, so let's actually talk about how do we use this. And actually, just as a quick overview of what the algorithm will look like for this form of algorithm."},{"start":1569.52,"text":"before we had this loop between running the policy and improving the policy. Now we're going to have an additional step where we're going to fit a model that's going to estimate the expected return. Essentially, it's going to try to estimate this A right here. Our new algorithm will have a few different steps. One is to run the policy, one is to try to estimate"},{"start":1592.28,"text":"estimate values. And then the last will be then to use that estimate and the data that was collected to improve the policy. And so this step will involve estimating either V pi, Q pi, or A pi. And this step will be kind of similar to before, except it's going to use these estimates right here. Okay, so how do we actually estimate these values?"},{"start":1622.8,"text":"So we want to estimate this, this quantity right here. And to start out, we need to think about how we want to get to A pi. And we could try to directly fit A pi, although it's actually a little bit challenging to get direct supervision for the advantages."},{"start":1646.6,"text":"And so we're actually going to try to fit v pi."},{"start":1650.48,"text":"And the way that we're going to get there is we, let's see,"},{"start":1657.12,"text":"where do we want to go?"}],"speech_gaps":[],"frame":"../frames/v031/010.webp","frame_time":1508.16},{"title":"Actor-Critic算法中的Q值与价值函数关系","segments":[{"id":92,"text":"So we know that a pi of s, t, a, t is equal to the Q-value minus the value.","zh":"因此我们知道，策略π在状态s、时间t、动作a、时间t的值等于Q值减去价值。","start":1657.88,"end":1679.58},{"id":93,"text":"And so one option is we could try to estimate these two.","zh":"因此，一种选择是我们可以尝试估计这两个量。","start":1681.62,"end":1686.64},{"id":94,"text":"although then we'd still have to estimate two objects.","zh":"不过，我们仍然需要估计两个对象。","start":1686.64,"end":1688.74},{"id":95,"text":"And there's actually a way to turn this","zh":"实际上，有一种方法可以将这个","start":1690.62,"end":1692.68},{"id":96,"text":"into an equation that actually only depends on v pi.","zh":"转化为仅依赖于v π的方程。","start":1692.68,"end":1696.0},{"id":97,"text":"And that would be nice, because then we could just only fit v pi","zh":"这会很理想，因为这样我们只需要拟合v π","start":1696.64,"end":1699.82},{"id":98,"text":"and then derive a pi from there to get the gradient.","zh":"然后从那里推导出π来获取梯度。","start":1699.82,"end":1703.7},{"id":99,"text":"And so to do this, we can think about q pi right here.","zh":"因此，为了做到这一点，我们可以考虑这里的q π。","start":1705.14,"end":1711.7},{"id":100,"text":"here. And this Q function, this is the value of starting at s, taking a, and then summing","zh":"这里。这个Q函数，指的是从状态s出发，采取动作a，然后累加奖励的值","start":1711.7,"end":1721.76},{"id":101,"text":"the rewards. And so you can think of it as the reward at the current time step that you","zh":"你可以把它看作是当前时间步获得的奖励，","start":1721.76,"end":1730.94},{"id":102,"text":"got plus the rewards that would come after that. And in terms of the rewards that would","zh":"加上之后会获得的奖励。就之后会获得的奖励而言，","start":1730.94,"end":1737.96},{"id":103,"text":"come after that, you'll have some next state st plus one. And so you can think of it as","zh":"你将会有下一个状态s_{t+1}。因此，你可以把它看作是","start":1737.96,"end":1745.4},{"id":104,"text":"there's some next state, you don't, there's actually some, this next state could be a few","zh":"存在某个下一个状态，你不会，实际上这个下一个状态可能有几种不同的情况，","start":1748.18,"end":1752.78},{"id":105,"text":"different things depending on your environment. So this would be sampled from the dynamics of","zh":"这取决于你的环境。因此，这个状态将从环境的动力学中进行采样。","start":1752.78,"end":1759.9},{"id":106,"text":"the environment. And then after this state, it's essentially going to be the sum of rewards","zh":"在该状态之后，它基本上就是从s_{t+1}开始，按照你的策略继续执行所获得的奖励总和。","start":1759.9,"end":1769.4},{"id":107,"text":"starting at st plus 1 and following your policy. And the sum of rewards starting at... sorry,","zh":"从st+1开始并遵循你的策略。并且从...开始的奖励总和，抱歉，","start":1769.88,"end":1777.74},{"id":108,"text":"this should be st plus 1. The sum of rewards starting at st plus 1,","zh":"这应该是 st 加 1。从 st 加 1 开始的奖励总和，","start":1777.9,"end":1781.16},{"id":109,"text":"that's equal to the value, right? The value of st plus 1. So we can","zh":"这就是价值，对吧？st 加 1 的价值。因此我们可","start":1782.54,"end":1787.24},{"id":110,"text":"Write this Q value as the reward at the current time step plus the value at the time step after that.","zh":"将这个 Q 值写成当前时间步的奖励加上下一个时间步的价值。","start":1793.2,"end":1799.56},{"id":111,"text":"Now, we can't sample from these dynamics, but when we ran our policy to collect data, we did actually see one outcome, 1st plus 1. And so we can approximate this as the reward at the current time step plus the value at the next time step. And then if we want to estimate the advantage, we can...","zh":"现在，我们无法从这些动态中进行采样，但当我们运行策略来收集数据时，我们确实观察到了一个结果，即 st 加 1。因此我们可以将这个近似为当前时间步的奖励加上下一个时间步的价值。如果我们想要估计优势，我们可以...","start":1801.71,"end":1827.92},{"id":112,"text":"Write it as the reward at the current time step plus the value at the next time step minus the value at the current time step.","zh":"将其写成当前时间步的奖励加上下一个时间步的价值减去当前时间步的价值。","start":1828.43,"end":1835.77}],"notes":["本段讲解了在Actor-Critic算法中，如何将Q值与价值函数联系起来。讲者指出，Q值可以表示为当前时间步的奖励加上下一个时间步的价值，从而将Q值转化为仅依赖于价值函数vπ的表达式。这一步是Actor-Critic算法中关键的推导，因为它允许我们仅估计价值函数vπ，然后通过它来推导策略π。"],"formulas":[],"uncertainties":["1st plus 1"],"diagram":"none","start":1657.88,"end":1835.77,"asr_flags":[92],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":1657.88,"text":"So we know that a pi of s, t, a, t is equal to the Q-value minus the value."},{"start":1681.62,"text":"And so one option is we could try to estimate these two."},{"start":1686.64,"text":"although then we'd still have to estimate two objects."},{"start":1690.62,"text":"And there's actually a way to turn this"},{"start":1692.68,"text":"into an equation that actually only depends on v pi."},{"start":1696.64,"text":"And that would be nice, because then we could just only fit v pi"},{"start":1699.82,"text":"and then derive a pi from there to get the gradient."},{"start":1705.14,"text":"And so to do this, we can think about q pi right here."},{"start":1711.7,"text":"here. And this Q function, this is the value of starting at s, taking a, and then summing"},{"start":1721.76,"text":"the rewards. And so you can think of it as the reward at the current time step that you"},{"start":1730.94,"text":"got plus the rewards that would come after that. And in terms of the rewards that would"},{"start":1737.96,"text":"come after that, you'll have some next state st plus one. And so you can think of it as"},{"start":1748.18,"text":"there's some next state, you don't, there's actually some, this next state could be a few"},{"start":1752.78,"text":"different things depending on your environment. So this would be sampled from the dynamics of"},{"start":1759.9,"text":"the environment. And then after this state, it's essentially going to be the sum of rewards"},{"start":1769.88,"text":"starting at st plus 1 and following your policy. And the sum of rewards starting at... sorry,"},{"start":1777.9,"text":"this should be st plus 1. The sum of rewards starting at st plus 1,"},{"start":1782.54,"text":"that's equal to the value, right? The value of st plus 1. So we can"},{"start":1793.2,"text":"Write this Q value as the reward at the current time step plus the value at the time step after that."},{"start":1801.71,"text":"Now, we can't sample from these dynamics, but when we ran our policy to collect data, we did actually see one outcome, 1st plus 1. And so we can approximate this as the reward at the current time step plus the value at the next time step. And then if we want to estimate the advantage, we can..."},{"start":1828.43,"text":"Write it as the reward at the current time step plus the value at the next time step minus the value at the current time step."}],"speech_gaps":[{"start":1790.032,"end":1791.936}],"frame":"../frames/v031/011.webp","frame_time":1669.88},{"title":"Actor-Critic算法中的价值函数与优势函数","segments":[{"id":113,"text":"And so maybe I'll do this in a different color to differentiate it.","zh":"因此，我可能会用不同的颜色来区分它。","start":1837.37,"end":1842.95},{"id":114,"text":"So now a pi can be written as, of s, t, a, t, can be approximated as the reward that you saw plus the value at the next time step minus the value at the current time step.","zh":"现在，一个π可以写成关于s、t、a、t的形式，可以近似为你所看到的奖励加上下一个时间步的价值减去当前时间步的价值。","start":1842.95,"end":1863.45},{"id":115,"text":"step. And so if we then have an estimate of v for our policy, then we can estimate the","zh":"步。因此，如果我们对策略的v有一个估计，那么我们就可以估计优势函数，并且只需直接拟合v。","start":1863.45,"end":1874.03},{"id":116,"text":"advantage and we can just try to directly fit v. And so on the slides, what this looks","zh":"在幻灯片上，这看起来像什么，我们有q。q可以写成预期的未来奖励，即当前时间步的奖励加上未来的奖励。","start":1874.03,"end":1880.23},{"id":117,"text":"like, we have q. q can be written as the expected future rewards, which is the reward at the","zh":"这些未来的奖励可以写成价值，因此我们可以将q视为当前时间步的奖励加上下一个时间步的价值。","start":1880.23,"end":1888.01},{"id":118,"text":"current time step plus the future rewards. These future rewards can be written as the","zh":"当前时间步的奖励加上未来的奖励。这些未来的奖励可以写成价值，","start":1888.01,"end":1892.89},{"id":119,"text":"value, and so we can think of q as the reward at the current time step plus the value at","zh":"因此我们可以将q视为当前时间步的奖励加上下一个时间步的价值。","start":1892.89,"end":1898.29},{"id":120,"text":"the next time step.","zh":"下一个时间步的价值。","start":1898.29,"end":1899.09},{"id":121,"text":"So why is the second-to-last line, why is this an approximation?","zh":"那么为什么倒数第二行是近似值呢？","start":1902.87,"end":1906.71},{"id":122,"text":"The reason for this is that the next state, there's actually multiple possible next states,","zh":"这是因为下一个状态实际上有多个可能的状态，","start":1908.73,"end":1913.79},{"id":123,"text":"and we're just going to use one sample from this expectation, which is the sample that","zh":"我们只是使用了这个期望的一个样本，也就是我们在数据中 rollout 轨迹时所看到的那个样本。","start":1913.97,"end":1920.09},{"id":124,"text":"we saw when we rolled out the trajectory in our data. And if you wanted an exact thing,","zh":"如果你想得到一个精确的结果，","start":1920.09,"end":1925.93},{"id":125,"text":"you would need to estimate this expectation with infinite samples.","zh":"你需要用无限多个样本来估计这个期望值。","start":1926.01,"end":1928.89},{"id":126,"text":"How good of an approximation is this? So it is going to be a single sample approximation.","zh":"这种近似有多好呢？它实际上是一个单样本近似。","start":1929.67,"end":1934.15},{"id":127,"text":"The good news is that later on we'll see ways to use lots of data to do this.","zh":"好消息是，稍后我们会看到如何利用大量数据来进行这种估计。","start":1936.37,"end":1942.71},{"id":128,"text":"and so it's in general well so I guess the first thing is if you're if this is very deterministic","zh":"因此，总的来说，这应该是一个很好的近似。我想首先，如果你认为这个过程是非常确定性的","start":1943.81,"end":1950.39},{"id":129,"text":"it's going to be at first it's going to be a good estimate because there aren't that many futures","zh":"它一开始会是一个不错的估计，因为未来的情况并不多","start":1950.39,"end":1954.05},{"id":130,"text":"if it's more stochastic then it's going to be a worse estimate and then we'll see ways in which","zh":"如果它更加随机，那么估计就会更差，然后我们会看到一些方法","start":1954.89,"end":1959.73},{"id":131,"text":"we can use data and take lots of gradient steps in a way that makes it not too bad so the question","zh":"我们可以利用数据并进行大量的梯度更新，以使得结果不至于太差，所以问题是","start":1959.73,"end":1965.43},{"id":132,"text":"is is there any new interaction with the environment so I guess we haven't yet talked","zh":"是否有与环境的新交互，我想我们还没有讨论过如何拟合vpy。因此，我们将在下一张幻灯片中讨论这个问题。因此，如果你有一些轨迹，","start":1965.43,"end":1971.35},{"id":133,"text":"about how to fit vpy. So we will talk about that in the next slide. So if you have some trajectory,","zh":"这将类似于你轨迹中的st、at和st plus one。","start":1971.35,"end":1978.01},{"id":134,"text":"this will be like the st, at, and st plus one in your trajectory.","zh":"从同一条轨迹中，是的。因此，你需要使用同一条轨迹来进行这个操作。","start":1980.13,"end":1983.85},{"id":135,"text":"From the same trajectory, yeah. So you need to use the same trajectory for this.","zh":"有时候我会忘记在这里加上pi，这里有很多","start":1984.07,"end":1987.69},{"id":136,"text":"Sometimes I forget to put the pi on here, and there is a lot of","zh":"内容","start":1989.55,"end":1993.57}],"notes":["本段主要讲解Actor-Critic算法中价值函数和优势函数的定义与关系。教师指出，价值函数可以表示为当前奖励加上下一个时间步的价值，减去当前时间步的价值。这种表示方式是基于对期望未来奖励的近似，因为实际中只能使用一个样本进行估计。","教师进一步解释了为什么这种近似是必要的，因为下一个状态可能有多个可能的值，而我们只能使用一个样本进行估计。如果想要精确的估计，需要无限多的样本，这在实际中是不可能的。","教师还讨论了这种近似的好坏，指出在确定性环境中，这种近似可能较好，而在随机性较强的环境中，近似效果较差。但随后会介绍如何利用大量数据和梯度下降方法来改善
