er-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 4 Actor-Critic算法（Actor-Critic Methods） · 生成中：以下为已同步部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v031","title":"Lecture 4 Actor-Critic算法（Actor-Critic Methods）","course":"强化学习","pages":[{"title":"Actor-Critic算法的引入与在线强化学习回顾","segments":[{"id":0,"text":"Okay, let's get started for today. Let's start with a recap of what we covered last time, because we're going to be building very heavily on Wednesday's concepts. So we talked about online reinforcement learning, where we collect a batch of data with some policy by running that policy in the environment. And then we try to use that data to improve our policy. And then we repeat this process in order to continue to improve from practice.","start":5.2,"end":34.48},{"id":1,"text":"We talked about an online reinforcement learning algorithm called policy gradients. And the update for our policy looks something like this, where we first take samples from our policy. This will give us n different trajectories sampled from our policy. We will...","start":35.79,"end":54.53},{"id":2,"text":"evaluate the log likelihood of the policy. And so this pie here is representing a distribution over actions given states. And so this is looking like the gradient of the log probability of the actions under the policy. And this log likelihood is weighted by the reward that","start":54.83,"end":73.58},{"id":3,"text":"the agent got. And so if you have higher rewards as an outcome of your actions in the future, then you're going to be encouraging the policy to increase the likelihood of those actions. And then lastly, we introduced a baseline which we could define to be the average reward, such that we're increasing the likelihood on futures that were above average reward and decreasing the likelihood","start":74.05,"end":99.5},{"id":4,"text":"on actions that led to futures that were below average reward. So you can think of this sort of as encouraging the policy to do more of the above average stuff, less of the below average stuff, and then repeating that process to get better and better. Cool. We also talked about how this algorithm is fully on policy. So in order to evaluate this, we actually need to have samples from","start":100.14,"end":129.84},{"id":5,"text":"pi theta from our current policy, and this meant that we could only take one gradient step per batch of data, which is disappointing because then we'd have to collect a ton and ton of data in order to improve. This kind of brings up this notion of having on-policy versus off-policy algorithms that can reuse data from other past policies. And we started to look at ways to make an algorithm off-policy, and in particular we talked about using importance weights.","start":130.51,"end":156.94},{"id":6,"text":"where if we weight the objective by the probability of the actions of the new policy divided by the probability of the actions under the old policy, this is a way to get an estimate of the gradient for the new policy.","start":157.45,"end":173.67}],"notes":["本段讲解了在线强化学习中策略梯度方法的核心思想，即通过计算策略的对数似然梯度来更新策略。策略的分布表示为状态下的动作分布，梯度计算中使用了奖励加权，以鼓励高奖励的动作。引入了基线（baseline）作为平均奖励，用于调整策略更新的方向，使得策略更倾向于执行高于平均奖励的动作，减少低于平均奖励的动作。","在策略梯度方法中，算法是完全基于策略的（on-policy），这意味着需要从当前策略中收集样本进行评估。这导致每次只能对一个批次的数据进行一次梯度更新，因此需要大量数据才能有效改进策略。这引出了对策略的讨论，即在线强化学习中存在on-policy和off-policy算法的区别，off-policy算法可以重用其他策略的数据。","为了实现off-policy算法，课程中提到了使用重要性权重（importance weights）的方法。通过将新策略的动作概率除以旧策略的动作概率，可以对目标函数进行加权，从而估计新策略的梯度。这种方法允许算法在不依赖当前策略数据的情况下进行更新。","课程中强调了策略梯度方法的局限性，即其对数据的依赖性较高，而off-policy方法通过重要性权重可以缓解这一问题。这为后续引入Actor-Critic算法奠定了基础，即结合策略评估（critic）和策略优化（actor）的框架，以减少对数据的依赖并提高学习效率。","在讲解过程中，课程还提到策略梯度方法的更新过程需要重复进行，以逐步改进策略。这种迭代过程是强化学习的核心机制，通过不断收集数据、评估策略、更新策略，最终实现策略的优化。","课程中提到的基线（baseline）和重要性权重（importance weights）是策略梯度方法中的关键概念，它们分别用于减少方差和实现off-policy学习。这些概念为后续Actor-Critic算法的设计提供了理论基础。"],"formulas":[],"uncertainties":["可能未完整识别出奖励的加权方式，例如是否包含折扣因子γ或其他形式的加权"],"diagram":"none","start":5.2,"end":173.67,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.2,"text":"Okay, let's get started for today. Let's start with a recap of what we covered last time, because we're going to be building very heavily on Wednesday's concepts. So we talked about online reinforcement learning, where we collect a batch of data with some policy by running that policy in the environment. And then we try to use that data to improve our policy. And then we repeat this process in order to continue to improve from practice."},{"start":35.79,"text":"We talked about an online reinforcement learning algorithm called policy gradients. And the update for our policy looks something like this, where we first take samples from our policy. This will give us n different trajectories sampled from our policy. We will..."},{"start":54.83,"text":"evaluate the log likelihood of the policy. And so this pie here is representing a distribution over actions given states. And so this is looking like the gradient of the log probability of the actions under the policy. And this log likelihood is weighted by the reward that"},{"start":74.05,"text":"the agent got. And so if you have higher rewards as an outcome of your actions in the future, then you're going to be encouraging the policy to increase the likelihood of those actions. And then lastly, we introduced a baseline which we could define to be the average reward, such that we're increasing the likelihood on futures that were above average reward and decreasing the likelihood"},{"start":100.14,"text":"on actions that led to futures that were below average reward. So you can think of this sort of as encouraging the policy to do more of the above average stuff, less of the below average stuff, and then repeating that process to get better and better. Cool. We also talked about how this algorithm is fully on policy. So in order to evaluate this, we actually need to have samples from"},{"start":130.51,"text":"pi theta from our current policy, and this meant that we could only take one gradient step per batch of data, which is disappointing because then we'd have to collect a ton and ton of data in order to improve. This kind of brings up this notion of having on-policy versus off-policy algorithms that can reuse data from other past policies. And we started to look at ways to make an algorithm off-policy, and in particular we talked about using importance weights."},{"start":157.45,"text":"where if we weight the objective by the probability of the actions of the new policy divided by the probability of the actions under the old policy, this is a way to get an estimate of the gradient for the new policy."}],"speech_gaps":[],"frame":"../frames/v031/001.webp","frame_time":17.2},{"title":"Actor-Critic算法中的价值函数与策略评估","segments":[{"id":7,"text":"I should also mention that importance weights, the math behind it is very simple and very nice. But it's important to remember that this isn't a silver bullet. This sort of approach is only suitable when the policies are very similar to one another. And if the policies are very different, then this ratio will get very large or very small. And you'll also just have a worse estimate of your gradient.","start":176.33,"end":199.43},{"id":8,"text":"Okay, so today we're going to be talking about a form of algorithms called actor-critic methods that build on policy gradients. And we'll talk about, as part of this, we'll be talking about how to estimate the value of a policy. And then we'll introduce an off-policy variant of the algorithm.","start":202.36,"end":220.04},{"id":9,"text":"And these actor critic methods are the basis for algorithms like PPO, which are used to train language models and that are used to train like humanoids and simulation and so forth. Very, very useful RL algorithms. And then the key learning goals for today is how to estimate how good a state in action is for a policy. This is called policy evaluation. It's very...","start":220.64,"end":250.34},{"id":10,"text":"a critical aspect of actor critic methods, but also useful more broadly. And then also talk about how to use those estimates to form a better reinforcement learning algorithm. Cool. So let's get started. And to talk about these algorithms, we need to revisit some very useful objects that we talked about in the first lecture. And specifically, this is value functions. And so a value function is representing how good","start":250.72,"end":281.77},{"id":11,"text":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this as v pi of s. This means that we're going to be starting at state s and then running pi. And for a given state, this is equal to","start":282.46,"end":311.2},{"id":12,"text":"the sum of rewards if we were to start at state t and go to the end of the trajectory. And here's the sum of rewards. Now this sum of rewards is going to differ depending on what state we start at and depending on what policy that we're running. And so this is going to be","start":311.95,"end":340.6}],"notes":["本段介绍了重要性权重的概念，强调其数学基础简单但并非万能解决方案。只有当策略非常相似时，这种方法才适用，否则重要性权重会变得非常大或非常小，导致梯度估计变差。","课堂重点讲解了Actor-Critic方法，这是PPO等算法的基础，广泛应用于语言模型、人形机器人和模拟环境的训练。今天的学习目标是理解如何评估策略中某个状态和动作的好坏，即策略评估。","策略评估是Actor-Critic方法中的关键部分，同时也具有更广泛的应用价值。接下来将讨论如何利用这些评估结果来构建更优的强化学习算法。","为了讨论这些算法，需要回顾第一讲中提到的一些重要概念，特别是价值函数。价值函数表示在遵循某个策略的情况下，某个状态的优劣程度。","价值函数可以理解为从某个状态开始执行策略所获得的奖励总和。我们将其表示为vπ(s)，表示从状态s开始执行策略π。对于给定的状态，这个值等于从该状态开始到轨迹结束所获得的奖励总和。","奖励总和会根据起始状态和所使用的策略而有所不同，因此价值函数的计算需要考虑这些因素。"],"formulas":[{"latex":"v_{\\pi}(s)","symbols":"价值函数","explanation":"该公式表示在状态 $ s $ 下遵循策略 $ \\\\_pi $ 的价值函数，适用于强化学习中的策略评估部分。","evidence":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this as v pi of s. This means that we're going to be starting at state s and then running pi. And for a given state, this is equal to"}],"uncertainties":[],"diagram":"none","start":176.33,"end":340.6,"asr_flags":[],"math_clarifications":["未发现需要修正的数学公式，所有公式均符合上下文描述。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":176.33,"text":"I should also mention that importance weights, the math behind it is very simple and very nice. But it's important to remember that this isn't a silver bullet. This sort of approach is only suitable when the policies are very similar to one another. And if the policies are very different, then this ratio will get very large or very small. And you'll also just have a worse estimate of your gradient."},{"start":202.36,"text":"Okay, so today we're going to be talking about a form of algorithms called actor-critic methods that build on policy gradients. And we'll talk about, as part of this, we'll be talking about how to estimate the value of a policy. And then we'll introduce an off-policy variant of the algorithm."},{"start":220.64,"text":"And these actor critic methods are the basis for algorithms like PPO, which are used to train language models and that are used to train like humanoids and simulation and so forth. Very, very useful RL algorithms. And then the key learning goals for today is how to estimate how good a state in action is for a policy. This is called policy evaluation. It's very..."},{"start":250.72,"text":"a critical aspect of actor critic methods, but also useful more broadly. And then also talk about how to use those estimates to form a better reinforcement learning algorithm. Cool. So let's get started. And to talk about these algorithms, we need to revisit some very useful objects that we talked about in the first lecture. And specifically, this is value functions. And so a value function is representing how good"},{"start":282.46,"text":"a state is if you're going to follow a policy starting from that state. And you can think of it as the sum of rewards starting from some state. So we'll write this as v pi of s. This means that we're going to be starting at state s and then running pi. And for a given state, this is equal to"},{"start":311.95,"text":"the sum of rewards if we were to start at state t and go to the end of the trajectory. And here's the sum of rewards. Now this sum of rewards is going to differ depending on what state we start at and depending on what policy that we're running. And so this is going to be"}],"speech_gaps":[],"frame":"../frames/v031/002.webp","frame_time":188.33},{"title":"Actor-Critic算法中的价值函数与Q函数","segments":[{"id":13,"text":"an expectation under our policy. Actually, maybe it's easier to write this as expectation on the inside. So this is an expectation over the state's ST prime and actions AT prime that will be visited under our policy and conditioned on the fact that we're starting at state ST.","start":342.23,"end":369.91},{"id":14,"text":"So we can think about the value function as this. Just in terms of math, what you can think about this as is, or just in terms of conceptually or in terms of intuition, if you have some trajectory and you're thinking about the value of this state, you can think of it as if we were to collect a lot of different trajectories starting from that state from our policy, and then we just summed up the rewards.","start":373.8,"end":398.91},{"id":15,"text":"from this time step to the end and then averaged over these trajectories, that would define the value of the state or how good the state is for the policy. Another useful quantity that we'll be making use of is called the Q function. And this is slightly different from the value function, but very closely related. And the difference is that instead of just thinking about the value of a given state, we're going to be thinking about a value of a given state and action.","start":399.61,"end":428.47},{"id":16,"text":"And what this is referring to is if you were to, instead of starting at S and then running pi from there, if instead we were to start at S, take a particular action A and then run the policy, what is our expected sum of rewards? And so then you can think of this as instead of a picture like this, say we had some state S that we considered.","start":429.61,"end":456.88},{"id":17,"text":"And first we're going to take some given action. This may or may not have been what the policy would have been likely to choose. This action could actually also lead to different states because the environment is stochastic. And then it's the sum of these rewards on average. So this is what V looks like. This is what...","start":457.52,"end":487.14},{"id":18,"text":"Q look like for a given action. So here are some pictures on the slide. So if we start from state S, run our policy, we compute the expected sum of the rewards along these trajectories, then that gets us the value of a state. And then if instead we take action A first and then run pi, then we get the Q values and it's just the sum of the rewards if we had started with action A.","start":487.58,"end":518.22}],"notes":["本段讲解了价值函数（V函数）和Q函数的基本概念。价值函数衡量的是在某个状态下，按照策略执行所能获得的期望累积奖励。而Q函数则进一步考虑了在某个状态下采取特定动作后的期望累积奖励。两者的核心区别在于Q函数引入了动作这一维度。","在讲解价值函数时，讲者通过轨迹的平均奖励来定义状态的价值，这体现了强化学习中对长期奖励的期望计算。Q函数则是在状态和动作的联合空间中进行定义，强调了动作选择对后续奖励的影响。","讲者提到，Q函数的计算需要先执行特定动作，再按照策略运行，这说明了Q函数的计算过程与价值函数的计算过程存在差异。这种差异在Actor-Critic算法中尤为重要，因为Actor负责选择动作，而Critic负责评估动作的价值。","讲者还提到环境的随机性可能导致动作执行后进入不同的状态，这说明了在计算期望奖励时需要考虑环境的不确定性。这种不确定性是强化学习中常见的挑战，也是Q函数和价值函数计算中必须考虑的因素。","在讲解Q函数时，讲者通过示意图说明了状态和动作的联合空间，这有助于理解Q函数的定义和计算方式。这种图示方法是强化学习教学中常用的工具，有助于直观理解抽象概念。","讲者强调了Q函数和价值函数之间的关系，指出Q函数是价值函数的扩展，增加了动作维度。这种关系在Actor-Critic算法中具有重要意义，因为Critic部分通常使用Q函数来评估策略的优劣。"],"formulas":[],"uncertainties":[],"diagram":"none","start":342.23,"end":518.22,"asr_flags":[],"math_clarifications":["公式中的求和符号应使用标准的数学符号 \\sum 而不是文本形式的 \\text{sum}。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":342.23,"text":"an expectation under our policy. Actually, maybe it's easier to write this as expectation on the inside. So this is an expectation over the state's ST prime and actions AT prime that will be visited under our policy and conditioned on the fact that we're starting at state ST."},{"start":373.8,"text":"So we can think about the value function as this. Just in terms of math, what you can think about this as is, or just in terms of conceptually or in terms of intuition, if you have some trajectory and you're thinking about the value of this state, you can think of it as if we were to collect a lot of different trajectories starting from that state from our policy, and then we just summed up the rewards."},{"start":399.61,"text":"from this time step to the end and then averaged over these trajectories, that would define the value of the state or how good the state is for the policy. Another useful quantity that we'll be making use of is called the Q function. And this is slightly different from the value function, but very closely related. And the difference is that instead of just thinking about the value of a given state, we're going to be thinking about a value of a given state and action."},{"start":429.61,"text":"And what this is referring to is if you were to, instead of starting at S and then running pi from there, if instead we were to start at S, take a particular action A and then run the policy, what is our expected sum of rewards? And so then you can think of this as instead of a picture like this, say we had some state S that we considered."},{"start":457.52,"text":"And first we're going to take some given action. This may or may not have been what the policy would have been likely to choose. This action could actually also lead to different states because the environment is stochastic. And then it's the sum of these rewards on average. So this is what V looks like. This is what..."},{"start":487.58,"text":"Q look like for a given action. So here are some pictures on the slide. So if we start from state S, run our policy, we compute the expected sum of the rewards along these trajectories, then that gets us the value of a state. And then if instead we take action A first and then run pi, then we get the Q values and it's just the sum of the rewards if we had started with action A."}],"speech_gaps":[],"frame":"../frames/v031/003.webp","frame_time":354.23},{"title":"Actor-Critic算法中的价值函数与优势函数关系","segments":[{"id":19,"text":"Now, one thing that's useful to think about in terms of how these two relate to each other is you can think of the value of a state as if you take an expectation over the actions that the policy would have taken, you can think of it as the average or the expectation of the Q values over all the actions that the policy would have taken. And then one last object that we'll use today is thinking about","start":522.13,"end":549.94},{"id":20,"text":"how good is a particular action relative to other actions that we might take?","start":550.77,"end":555.95},{"id":21,"text":"And for this, we can think about, like, what is, if you consider the Q value minus the value","start":558.39,"end":567.87},{"id":22,"text":"function, that's going to tell you, like, how good is it to take action A versus following the policy","start":567.87,"end":573.37},{"id":23,"text":"at a given state? And this is kind of like, what is the advantage of taking one action versus","start":573.37,"end":580.27},{"id":24,"text":"following the policy. Good question. So the question was, is there a normalization","start":580.27,"end":585.01},{"id":25,"text":"between V and Q? You can think of an expectation as an average, and so in","start":587.77,"end":596.53},{"id":26,"text":"that sense there is going to be a normalization. Because if you were","start":596.53,"end":600.65},{"id":27,"text":"to, for example, try to estimate this expectation with samples, you would","start":600.65,"end":604.39},{"id":28,"text":"take some number of examples. If you only use these two samples to estimate Q,","start":604.39,"end":608.41},{"id":29,"text":"then you would divide by two versus here if you're using five samples you would divide by five.","start":608.41,"end":612.61},{"id":30,"text":"Is there a way that you can get from this equation to the useful relation on the slide?","start":613.57,"end":617.79},{"id":31,"text":"Is that what you're asking? Yeah, so if you write out","start":618.05,"end":623.49},{"id":32,"text":"the... so if you write out... we can write out first what q pi looks like. So q pi of a given","start":623.49,"end":636.15},{"id":33,"text":"state and action. We're going to assume that we","start":636.73,"end":640.15},{"id":34,"text":"are going to condition on STAT because that's","start":640.15,"end":644.75},{"id":35,"text":"where we're starting. And then this is the expected sum of rewards.","start":644.75,"end":647.91},{"id":36,"text":"So a sum over t prime equals t to t. And then we're going to have an expectation of running the policy here. And then a sum of rewards. And then in terms of seeing how to get between these two things, this is a...","start":651.85,"end":682.9}],"notes":["本段讨论了价值函数V和Q函数之间的关系，特别是如何通过Q值减去V值来衡量特定动作相对于遵循策略的优劣。这被称为优势函数，用于评估在给定状态下采取某个动作相对于遵循策略的优劣。","讲者提到，期望值可以视为平均值，因此在计算期望值时，需要根据样本数量进行归一化处理。例如，使用两个样本时除以2，使用五个样本时除以5。","讲者进一步询问是否可以通过当前的公式推导出幻灯片上提到的有用关系，并指出需要写出Q值的表达式，以展示如何从期望值推导出优势函数。","讲者提到，假设我们以状态STAT为条件，因为这是开始的地方，并指出Q值是预期奖励的总和，涉及从时间t到t的求和，以及在策略下运行的期望值。","讲者最后提到，需要进一步探讨如何在这些概念之间建立联系，这可能涉及更深入的数学推导。","整个段落强调了在Actor-Critic算法中，优势函数的计算和归一化处理的重要性，以及如何通过期望值和Q值之间的关系来实现策略优化。"],"formulas":[{"latex":"Q(s, a) - V(s)","symbols":"Q值减去价值函数","explanation":"公式正确，表示某个状态-动作对的Q值与对应状态的价值函数之差，用于衡量采取特定动作相对于遵循策略的优劣。","evidence":"And for this, we can think about, like, what is, if you consider the Q value minus the value function, that's going to tell you, like, how good is it to take action A versus following the policy"},{"latex":"E\\left[\\sum_{t'=t}^{\\infty} R_{t'}\\right]","symbols":"期望的奖励总和","explanation":"公式正确，表示从时间步t开始的未来奖励的期望总和，这是价值函数和Q值的定义基础。","evidence":"where we're starting. And then this is the expected sum of rewards."}],"uncertainties":["STAT可能为状态的缩写，但具体含义未明确。","t prime equals t to t的表达可能不完整，需进一步确认上下文。","sum over t prime equals t to t的表达可能不完整，需进一步确认上下文。"],"diagram":"none","start":522.13,"end":682.9,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均符合强化学习中价值函数和Q值的定义，无需进一步修正。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":522.13,"text":"Now, one thing that's useful to think about in terms of how these two relate to each other is you can think of the value of a state as if you take an expectation over the actions that the policy would have taken, you can think of it as the average or the expectation of the Q values over all the actions that the policy would have taken. And then one last object that we'll use today is thinking about"},{"start":550.77,"text":"how good is a particular action relative to other actions that we might take?"},{"start":558.39,"text":"And for this, we can think about, like, what is, if you consider the Q value minus the value"},{"start":567.87,"text":"function, that's going to tell you, like, how good is it to take action A versus following the policy"},{"start":573.37,"text":"at a given state? And this is kind of like, what is the advantage of taking one action versus"},{"start":580.27,"text":"following the policy. Good question. So the question was, is there a normalization"},{"start":587.77,"text":"between V and Q? You can think of an expectation as an average, and so in"},{"start":596.53,"text":"that sense there is going to be a normalization. Because if you were"},{"start":600.65,"text":"to, for example, try to estimate this expectation with samples, you would"},{"start":604.39,"text":"take some number of examples. If you only use these two samples to estimate Q,"},{"start":608.41,"text":"then you would divide by two versus here if you're using five samples you would divide by five."},{"start":613.57,"text":"Is there a way that you can get from this equation to the useful relation on the slide?"},{"start":618.05,"text":"Is that what you're asking? Yeah, so if you write out"},{"start":623.49,"text":"the... so if you write out... we can write out first what q pi looks like. So q pi of a given"},{"start":636.73,"text":"state and action. We're going to assume that we"},{"start":640.15,"text":"are going to condition on STAT because that's"},{"start":644.75,"text":"where we're starting. And then this is the expected sum of rewards."},{"start":651.85,"text":"So a sum over t prime equals t to t. And then we're going to have an expectation of running the policy here. And then a sum of rewards. And then in terms of seeing how to get between these two things, this is a..."}],"speech_gaps":[],"frame":"../frames/v031/004.webp","frame_time":534.13},{"title":"Actor-Critic算法中的价值函数与优势函数","segments":[{"id":37,"text":"You can think of this as a sum over words of under AT sampled from, or kind of future actions sampled from pi. Whereas this one, AT, is not sampled from pi, but all future actions are sampled from pi. In this case, we're kind of conditioning on the action that's kind of provided as input. In this case, we're sampling from the policy. And so if instead you sample the... ","start":684.65,"end":712.99},{"id":38,"text":"the action from the policy and then feed that in to here, then you'll get this right here. Okay, so to help you start thinking about some of these quantities, let's look at an example. And so say that you are this person right here. You really want to learn how to play the drums.","start":714.62,"end":738.13},{"id":39,"text":"And your reward is one if you can play the music in a month and zero otherwise. So capital T is a month from now. And your action space, you have three different possible actions in your action space. One action is to like sit on the beach. Another action is to watch TV. And another action is to practice playing the drums.","start":739.27,"end":763.97},{"id":40,"text":"And say that your current policy right now is just to sit on the beach, and you do that for all states. Now, my question for you to think about is, what are each of these quantities for the action of A1, for the action of A2, and for the action of A3? And so specifically, you want to think about what is the value function of your current state for this policy.","start":765.34,"end":793.24},{"id":41,"text":"What is your Q function for if you were to follow each of these actions once and then follow this policy? And then what is your advantage function for the current state that you're in and for each of these actions? And you can assume that in the current state that you're in, you do not know how to play the drums.","start":794.8,"end":818.88},{"id":42,"text":"What was described is for the value function, for this particular policy that's always sitting on the beach, the value is zero because the person would not learn to play the drum. So that's the sum of expected rewards for this policy for VPI. For the Q function, if you sit on the beach at the current time step or watch TV, the Q function will be zero for those actions. Whereas if...","start":819.76,"end":846.16}],"notes":["本段讲解了Actor-Critic算法中价值函数和优势函数的概念，通过一个学习打鼓的例子来说明。价值函数是当前状态在特定策略下的期望回报，而优势函数衡量了采取某个动作相对于策略平均表现的优劣。"],"formulas":[],"uncertainties":["VPI在原文中可能指的是Value of Policy Improvement，但未明确说明，需进一步确认。"],"diagram":"none","start":684.65,"end":846.16,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":684.65,"text":"You can think of this as a sum over words of under AT sampled from, or kind of future actions sampled from pi. Whereas this one, AT, is not sampled from pi, but all future actions are sampled from pi. In this case, we're kind of conditioning on the action that's kind of provided as input. In this case, we're sampling from the policy. And so if instead you sample the..."},{"start":714.62,"text":"the action from the policy and then feed that in to here, then you'll get this right here. Okay, so to help you start thinking about some of these quantities, let's look at an example. And so say that you are this person right here. You really want to learn how to play the drums."},{"start":739.27,"text":"And your reward is one if you can play the music in a month and zero otherwise. So capital T is a month from now. And your action space, you have three different possible actions in your action space. One action is to like sit on the beach. Another action is to watch TV. And another action is to practice playing the drums."},{"start":765.34,"text":"And say that your current policy right now is just to sit on the beach, and you do that for all states. Now, my question for you to think about is, what are each of these quantities for the action of A1, for the action of A2, and for the action of A3? And so specifically, you want to think about what is the value function of your current state for this policy."},{"start":794.8,"text":"What is your Q function for if you were to follow each of these actions once and then follow this policy? And then what is your advantage function for the current state that you're in and for each of these actions? And you can assume that in the current state that you're in, you do not know how to play the drums."},{"start":819.76,"text":"What was described is for the value function, for this particular policy that's always sitting on the beach, the value is zero because the person would not learn to play the drum. So that's the sum of expected rewards for this policy for VPI. For the Q function, if you sit on the beach at the current time step or watch TV, the Q function will be zero for those actions. Whereas for if..."}],"speech_gaps":[],"frame":"../frames/v031/005.webp","frame_time":696.65},{"title":"Actor-Critic算法中的价值函数与优势函数","segments":[{"id":43,"text":"The cue function for playing the drums at the current time step would be one if that amount of practicing is sufficient. It's also possible that it would be a bit lower than one if you, for example, practice for like an hour and then sit on the beach by following the policy afterwards. It kind of depends a little bit on what the time kind of...","start":846.76,"end":866.9},{"id":44,"text":"how long a given time step is. And then the advantage function is going to be q minus v, and so it's going to be a positive number for the action of practicing, and it'll be zero for the other two actions. So the question is, if practicing is not enough to actually learn, would it be one? Would it be between zero and one? Would it be zero?","start":867.18,"end":888.66},{"id":45,"text":"It basically actually represents the probability in which you would be able to play this, given that you had practiced for that amount of time. And that probability...","start":890.28,"end":898.7},{"id":46,"text":"It could be zero, like maybe this is really hard after just practicing once. It could also be maybe for someone who's extremely talented, they only need to practice once. That could be a bit higher for someone that's a bit more talented. It depends on various factors like that. Kind of along those lines, if you think about the value function, if you're playing a game of chess, for example, the value function is the probability that you're going to win.","start":900.27,"end":928.77},{"id":47,"text":"for a given person and for a given game state. So it's kind of evaluating how good is the state for a particular person. That's another way to think about it. Okay, cool. So those are the objects that we're going to be using quite a bit today. Now let's go back to policy gradients and see how we can use value functions to make this algorithm better.","start":929.57,"end":955.24},{"id":48,"text":"We talked about a couple examples on Wednesday of some scenarios that were dissatisfying about policy gradients. And the first was that if we are trying to learn how to walk and we have a policy that takes a small step forwards and then falls backwards, we will push down the likelihood of taking a step forwards because we don't necessarily know that that might have led it to fall backwards. Now, if we actually...","start":957.85,"end":984.91},{"id":49,"text":"had some understanding that taking a small step forward was making progress, was actually good, was advantageous, then we might be able to actually increase the likelihood of that. And so this is starting to hint at some of the intuition behind actor critic methods. And likewise, we talked about this example of trying to fold a jacket.","start":985.18,"end":1004.71}],"notes":["本段主要讲解了在强化学习中，价值函数和优势函数的概念。价值函数表示在给定状态和策略下，能够成功完成任务的概率，而优势函数则是价值函数与状态价值函数的差值，用于衡量某个动作相对于平均动作的优劣。例如，在打鼓的例子中，价值函数表示在练习一定时间后能够成功演奏的概率，而优势函数则表示练习动作相对于其他动作的优劣。","在价值函数的讨论中，作者以国际象棋为例，说明价值函数是给定玩家和游戏状态下的获胜概率，用于评估当前状态对特定玩家的有利程度。这表明价值函数不仅与状态有关，还与玩家的策略和能力有关。","在讨论策略梯度方法的局限性时，作者提到一个例子：如果策略导致小步前进后却后退，那么策略梯度方法会降低前进动作的概率，因为无法确定前进是否导致了后退。这说明策略梯度方法在处理长期依赖和因果关系时存在困难。","作者进一步指出，如果能够理解某个动作（如小步前进）是积极的，那么可以增加该动作的概率，这为Actor-Critic方法提供了直观的动机。Actor-Critic方法通过引入价值函数来评估动作的优劣，从而改进策略梯度方法。","最后，作者提到另一个例子：尝试折叠夹克，这可能涉及复杂的动作序列，需要价值函数来评估不同动作的优劣。这表明价值函数在处理复杂任务时的重要性。","整体来看，本段通过多个例子说明了价值函数和优势函数在强化学习中的作用，并指出策略梯度方法的局限性，为后续介绍Actor-Critic方法奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":846.76,"end":1004.71,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":846.76,"text":"The cue function for playing the drums at the current time step would be one if that amount of practicing is sufficient. It's also possible that it would be a bit lower than one if you, for example, practice for like an hour and then sit on the beach by following the policy afterwards. It kind of depends a little bit on what the time kind of..."},{"start":867.18,"text":"how long a given time step is. And then the advantage function is going to be q minus v, and so it's going to be a positive number for the action of practicing, and it'll be zero for the other two actions. So the question is, if practicing is not enough to actually learn, would it be one? Would it be between zero and one? Would it be zero?"},{"start":890.28,"text":"It basically actually represents the probability in which you would be able to play this, given that you had practiced for that amount of time. And that probability..."},{"start":900.27,"text":"It could be zero, like maybe this is really hard after just practicing once. It could also be maybe for someone who's extremely talented, they only need to practice once. That could be a bit higher for someone that's a bit more talented. It depends on various factors like that. Kind of along those lines, if you think about the value function, if you're playing a game of chess, for example, the value function is the probability that you're going to win."},{"start":929.57,"text":"for a given person and for a given game state. So it's kind of evaluating how good is the state for a particular person. That's another way to think about it. Okay, cool. So those are the objects that we're going to be using quite a bit today. Now let's go back to policy gradients and see how we can use value functions to make this algorithm better."},{"start":957.85,"text":"We talked about a couple examples on Wednesday of some scenarios that were dissatisfying about policy gradients. And the first was that if we are trying to learn how to walk and we have a policy that takes a small step forwards and then falls backwards, we will push down the likelihood of taking a step forwards because we don't necessarily know that that might have led it to fall backwards. Now, if we actually..."},{"start":985.18,"text":"had some understanding that taking a small step forward was making progress, was actually good, was advantageous, then we might be able to actually increase the likelihood of that. And so this is starting to hint at some of the intuition behind actor critic methods. And likewise, we talked about this example of trying to fold a jacket."}],"speech_gaps":[],"frame":"../frames/v031/006.webp","frame_time":858.76},{"title":"Actor-Critic算法中的轨迹利用与Q函数","segments":[{"id":50,"text":"And we found that if you have a sparse reward and you only do part of the task, like folding only the sleeves or flattening the jacket but not folding it, you aren't really utilizing the trajectories that are getting zero reward. And kind of similar to this case, if we instead kind of understood that these actions are advantageous for making progress on the task, then we might actually be able to figure out how to use these trajectories in a positive way.","start":1005.29,"end":1034.47},{"id":51,"text":"And so to summarize here, policy gradients don't always make an efficient use of data that we've collected. And if we can try to figure out what actions are advantageous versus not advantageous, we might be able to make better use of that data. So the question was, if it's not clear if a positive step, if a step forward is helpful or not, is that going to be negative or neutral? In the case of the policy gradient, in case of this policy gradient algorithm,","start":1035.13,"end":1062.7},{"id":52,"text":"The trajectory that we considered here in the context of the batch of trajectories was kind of net negative, was below average, because the reward to go is quite negative. It's actually making backwards progress in this trajectory. And so it actually is going to be pushing down the likelihood of taking a step forward because the future reward to go is negative.","start":1064.97,"end":1088.85},{"id":53,"text":"And what we'll talk about today is algorithms that in principle could actually increase the likelihood for taking the step forward and decrease the likelihood for falling backwards. Okay. So how do we do that? A lot of what we'll focus on today is this piece right here. This is what's actually telling us that we should push down the likelihood if we have negative rewards in the future. And this quantity, it's estimating the future rewards.","start":1089.38,"end":1121.83},{"id":54,"text":"if we take action A in state S. And so we can kind of think about it as, in this picture right here, it looks a lot like what is the sum of rewards if we started right here with state S and action A. And then if we think about this picture, we were looking at this quantity in terms of like what we observed in trajectories, but","start":1122.52,"end":1151.04},{"id":55,"text":"what would be an even better version of this quantity would be to actually use the Q function. And if we could replace this with the Q function, then we would be able to get a much better estimate of whether or not we should push up the likelihood or push down the likelihood. And so looking at the slides right now, what we do is we, for like a single trajectory, we sum together the rewards that we saw.","start":1151.56,"end":1175.47}],"notes":["本段讨论了策略梯度方法在利用轨迹数据时的局限性，特别是当轨迹的奖励为负时，策略梯度方法会降低采取正向动作的可能性。讲者指出，如果无法明确判断某个动作是否有助于任务进展，那么该动作可能对策略更新产生负面影响或中性影响。","讲者进一步说明，轨迹的奖励总和（reward to go）可能为负，这会导致策略梯度方法降低采取正向动作的概率。这是因为负的未来奖励会降低动作的似然性，从而影响策略的更新。","接下来，讲者提出了一种改进方法，即使用Q函数来替代当前的奖励估计。Q函数能够更准确地估计未来奖励，从而帮助策略梯度方法更有效地调整动作的似然性。","讲者提到，Q函数可以提供更精确的未来奖励估计，从而帮助判断是否应该增加或减少某个动作的似然性。这为后续的Actor-Critic算法奠定了基础，即通过Q函数来指导策略的更新。","在实际操作中，讲者指出，对于单个轨迹，我们通常会将观察到的奖励进行求和，以估计动作的总体效果。然而，这种方法可能不够准确，因此需要引入Q函数来改进估计。","最后，讲者强调，使用Q函数可以更有效地利用轨迹数据，从而提高策略梯度方法的效率。这为后续讨论Actor-Critic算法提供了理论依据。"],"formulas":[{"latex":"Q(s, a) = \\text{expected cumulative reward from state } s \\text{ and action } a","symbols":"Q(s, a) 表示从状态 s 和动作 a 开始的预期累积奖励","explanation":"公式表达清晰，符合强化学习中Q函数的标准定义，无需修改。","evidence":"what would be an even better version of this quantity would be to actually use the Q function. And if we could replace this with the Q function, then we would be able to get a much better estimate of whether or not we should push up the likelihood or push down the likelihood. And so looking at the slides right now, what we do is we, for like a single trajectory, we sum together the rewards that we saw."}],"uncertainties":[],"diagram":"none","start":1005.29,"end":1175.47,"asr_flags":[],"math_clarifications":["原始片段中未明确提及Q函数的具体数学形式，如是否包含折扣因子或期望值，因此无法核定其完整定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1005.29,"text":"And we found that if you have a sparse reward and you only do part of the task, like folding only the sleeves or flattening the jacket but not folding it, you aren't really utilizing the trajectories that are getting zero reward. And kind of similar to this case, if we instead kind of understood that these actions are advantageous for making progress on the task, then we might actually be able to figure out how to use these trajectories in a positive way."},{"start":1035.13,"text":"And so to summarize here, policy gradients don't always make an efficient use of data that we've collected. And if we can try to figure out what actions are advantageous versus not advantageous, we might be able to make better use of that data. So the question was, if it's not clear if a positive step, if a step forward is helpful or not, is that going to be negative or neutral? In the case of the policy gradient, in case of this policy gradient algorithm,"},{"start":1064.97,"text":"The trajectory that we considered here in the context of the batch of trajectories was kind of net negative, was below average, because the reward to go is quite negative. It's actually making backwards progress in this trajectory. And so it actually is going to be pushing down the likelihood of taking a step forward because the future reward to go is negative."},{"start":1089.38,"text":"And what we'll talk about today is algorithms that in principle could actually increase the likelihood for taking the step forward and decrease the likelihood for falling backwards. Okay. So how do we do that? A lot of what we'll focus on today is this piece right here. This is what's actually telling us that we should push down the likelihood if we have negative rewards in the future. And this quantity, it's estimating the future rewards."},{"start":1122.52,"text":"if we take action A in state S. And so we can kind of think about it as, in this picture right here, it looks a lot like what is the sum of rewards if we started right here with state S and action A. And then if we think about this picture, we were looking at this quantity in terms of like what we observed in trajectories, but"},{"start":1151.56,"text":"what would be an even better version of this quantity would be to actually use the Q function. And if we could replace this with the Q function, then we would be able to get a much better estimate of whether or not we should push up the likelihood or push down the likelihood. And so looking at the slides right now, what we do is we, for like a single trajectory, we sum together the rewards that we saw."}],"speech_gaps":[],"frame":"../frames/v031/007.webp","frame_time":1017.29},{"title":"Actor-Critic算法中的梯度与基线","segments":[{"id":56,"text":"which was in the case, the example before, the rewards were negative because we took a small step forwards and then fell backwards. But if instead what we could do is actually run the policy many, many times and get a Q function for the state, that would be the true expected rewards to go under the expectation of our policy. And this would be way better. We'd be able to get a much better sense for how good","start":1175.98,"end":1204.26},{"id":57,"text":"how good it was to take that action in that state.","start":1205.86,"end":1208.82},{"id":58,"text":"So essentially, the form of the gradient","start":1214.14,"end":1216.24},{"id":59,"text":"would be able to get a much better gradient","start":1216.24,"end":1219.12},{"id":60,"text":"if the form of the gradient looked like this, where","start":1219.12,"end":1221.74},{"id":61,"text":"we increase the likelihood of the actions for things","start":1221.74,"end":1225.02},{"id":62,"text":"that have high Q values, and we decrease","start":1225.02,"end":1227.06},{"id":63,"text":"the likelihood of the actions for things","start":1227.06,"end":1228.76},{"id":64,"text":"that have low Q values.","start":1228.76,"end":1230.46},{"id":65,"text":"So that's kind of a first step. Now, taking things one step further, we also talked about","start":1233.32,"end":1240.92},{"id":66,"text":"baselines in the previous lecture, where the baseline was the average reward. Should we use","start":1240.92,"end":1247.28},{"id":67,"text":"a baseline here? So before, the baselines were the average reward. And so in this case, if we","start":1247.28,"end":1254.18},{"id":68,"text":"were to introduce baselines, we could think about what we might use. And if we use the","start":1254.18,"end":1262.0},{"id":69,"text":"same thing that we used before, we could use the average Q value in this case. So we could","start":1262.0,"end":1269.02},{"id":70,"text":"use an average, like maybe we sample some SI and AI, and we average over those. And","start":1269.02,"end":1283.5},{"id":71,"text":"what we had talked about a few slides ago is actually, this is actually looking a lot","start":1284.88,"end":1290.36},{"id":72,"text":"like the value function. So we talked about the value of a given state is an expectation","start":1290.36,"end":1297.42},{"id":73,"text":"over actions sampled from the policy for that given state of the Q function for those actions.","start":1297.42,"end":1312.6},{"id":74,"text":"This is V pi. And so a natural baseline would actually be to use the value function. And so","start":1312.7,"end":1321.04},{"id":75,"text":"So we could have, instead of having this be Q values, we could actually use Q minus V.","start":1321.04,"end":1327.26},{"id":76,"text":"And Q minus V is what the advantage function is.","start":1328.42,"end":1331.4}],"notes":["本段讲解了在强化学习中，通过运行策略多次来估计状态的Q函数，从而获得更准确的预期奖励。这比仅依赖单次步骤的奖励更可靠，因为Q函数考虑了策略的长期影响。接着，讨论了梯度的形式，即通过增加高Q值动作的似然性，降低低Q值动作的似然性，从而优化策略。"],"formulas":[{"latex":"A(s, a) = Q(s, a) - V(s)","symbols":"优势函数A(s, a)是Q值与状态值函数V(s)的差","explanation":"该公式正确表达了优势函数的定义，即Q值与状态值函数的差，符合强化学习中的标准定义。","evidence":"So we could have, instead of having this be Q values, we could actually use Q minus V. And Q minus V is what the advantage function is."}],"uncertainties":["SI and AI"],"diagram":"none","start":1175.98,"end":1331.4,"asr_flags":[],"math_clarifications":["公式0是重复定义，没有提供新的数学信息，应移除。公式1正确表达了优势函数的定义，符合强化学习中的标准定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1175.98,"text":"which was in the case, the example before, the rewards were negative because we took a small step forwards and then fell backwards. But if instead what we could do is actually run the policy many, many times and get a Q function for the state, that would be the true expected rewards to go under the expectation of our policy. And this would be way better. We'd be able to get a much better sense for how good"},{"start":1205.86,"text":"how good it was to take that action in that state."},{"start":1214.14,"text":"So essentially, the form of the gradient"},{"start":1216.24,"text":"would be able to get a much better gradient"},{"start":1219.12,"text":"if the form of the gradient looked like this, where"},{"start":1221.74,"text":"we increase the likelihood of the actions for things"},{"start":1225.02,"text":"that have high Q values, and we decrease"},{"start":1227.06,"text":"the likelihood of the actions for things"},{"start":1228.76,"text":"that have low Q values."},{"start":1233.32,"text":"So that's kind of a first step. Now, taking things one step further, we also talked about"},{"start":1240.92,"text":"baselines in the previous lecture, where the baseline was the average reward. Should we use"},{"start":1247.28,"text":"a baseline here? So before, the baselines were the average reward. And so in this case, if we"},{"start":1254.18,"text":"were to introduce baselines, we could think about what we might use. And if we use the"},{"start":1262.0,"text":"same thing that we used before, we could use the average Q value in this case. So we could"},{"start":1269.02,"text":"use an average, like maybe we sample some SI and AI, and we average over those. And"},{"start":1284.88,"text":"what we had talked about a few slides ago is actually, this is actually looking a lot"},{"start":1290.36,"text":"like the value function. So we talked about the value of a given state is an expectation"},{"start":1297.42,"text":"over actions sampled from the policy for that given state of the Q function for those actions."},{"start":1312.7,"text":"This is V pi. And so a natural baseline would actually be to use the value function. And so"},{"start":1321.04,"text":"So we could have, instead of having this be Q values, we could actually use Q minus V."},{"start":1328.42,"text":"And Q minus V is what the advantage function is."}],"speech_gaps":[],"frame":"../frames/v031/008.webp","frame_time":1187.98},{"title":"Actor-Critic算法中的优势函数与梯度估计","segments":[{"id":77,"text":"putting this together, we would be increasing the likelihood for actions that have a high advantage and decreasing the likelihood for actions that have a low advantage. And so then if you think back to the example of learning to practice playing the drums, the action of practicing had a high advantage relative to the current policy. And so then we would choose to increase the likelihood for practicing.","start":1334.51,"end":1363.6},{"id":78,"text":"and decrease the likelihood for the other actions. Cool. And another way to think about this is that better estimates of this advantage function will lead to less noisy gradient. And if we knew the true advantage function, then we would be able to get a very, very good gradient. Unfortunately, we don't know the true advantage function. And so the next question that we'll talk about over the next several slides is, how can we estimate?","start":1364.25,"end":1394.61},{"id":79,"text":"the advantage function. So the question was, how is this different from how we're sampling in the original policy gradient? And so what we're using before is we were doing this, we would take one sample and then for a given state and action in that trajectory, we would sum the rewards just for that individual thing.","start":1395.26,"end":1422.3},{"id":80,"text":"And now what we're saying is that instead of... And this is going to be a very noisy estimate because we just have one trajectory here. We just have one data point to estimate these rewards. And now what we're saying here is that we're going to try to get a sense for what the advantage of this action is. Now, one way... We'll actually start to talk about how we do that in a minute. But if you want to think about what is the true advantage of this action, conceptually, if you were to...","start":1423.61,"end":1450.76},{"id":81,"text":"take this state in action and then roll out the policy an infinite number of times for this action versus for following the policy in other scenarios, that's what would give us the advantage. Yeah, so the question is...","start":1452.64,"end":1466.64},{"id":82,"text":"In policy gradient, we got to where we were by optimizing the expected sum of rewards. Does this also optimize some objective? So this is also optimizing the expected sum of rewards. It's actually optimizing the same exact function. We haven't talked about how to get A yet, but if you had a perfect A, this would be giving you the correct gradient for that objective.","start":1467.53,"end":1494.17}],"notes":["本段讲解了Actor-Critic算法中如何利用优势函数来调整策略，通过增加高优势动作的概率和降低低优势动作的概率，从而优化策略。优势函数的估计对于减少梯度噪声至关重要，但实际中我们无法直接获得真实的优势函数，因此需要估计。","在原始策略梯度方法中，我们通过单个轨迹来估计奖励，这会导致估计结果非常嘈杂。而Actor-Critic方法通过引入优势函数，试图更准确地估计动作的价值，从而提高梯度估计的准确性。","优势函数的估计可以通过比较当前策略在特定动作下的表现与遵循其他策略的表现来实现。这需要对策略进行无限次的模拟，以获得更准确的估计。","策略梯度方法通过优化期望奖励总和来更新策略，而Actor-Critic方法同样优化相同的期望奖励总和。优势函数的引入使得梯度估计更加精确，但需要准确估计优势函数才能实现这一点。","在实际应用中，优势函数的估计是通过经验数据进行的，而不是通过理论上的无限次模拟。因此，需要设计有效的估计方法来近似优势函数。","本段强调了优势函数在策略优化中的核心作用，以及其估计对梯度噪声的影响。同时，也指出了在实际应用中如何通过经验数据来估计优势函数的问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1334.51,"end":1494.17,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1334.51,"text":"putting this together, we would be increasing the likelihood for actions that have a high advantage and decreasing the likelihood for actions that have a low advantage. And so then if you think back to the example of learning to practice playing the drums, the action of practicing had a high advantage relative to the current policy. And so then we would choose to increase the likelihood for practicing."},{"start":1364.25,"text":"and decrease the likelihood for the other actions. Cool. And another way to think about this is that better estimates of this advantage function will lead to less noisy gradient. And if we knew the true advantage function, then we would be able to get a very, very good gradient. Unfortunately, we don't know the true advantage function. And so the next question that we'll talk about over the next several slides is, how can we estimate?"},{"start":1395.26,"text":"the advantage function. So the question was, how is this different from how we're sampling in the original policy gradient? And so what we're using before is we were doing this, we would take one sample and then for a given state and action in that trajectory, we would sum the rewards just for that individual thing."},{"start":1423.61,"text":"And now what we're saying is that instead of... And this is going to be a very noisy estimate because we just have one trajectory here. We just have one data point to estimate these rewards. And now what we're saying here is that we're going to try to get a sense for what the advantage of this action is. Now, one way... We'll actually start to talk about how we do that in a minute. But if you want to think about what is the true advantage of this action, conceptually, if you were to..."},{"start":1452.64,"text":"take this state in action and then roll out the policy an infinite number of times for this action versus for following the policy in other scenarios, that's what would give us the advantage. Yeah, so the question is..."},{"start":1467.53,"text":"In policy gradient, we got to where we were by optimizing the expected sum of rewards. Does this also optimize some objective? So this is also optimizing the expected sum of rewards. It's actually optimizing the same exact function. We haven't talked about how to get A yet, but if you had a perfect A, this would be giving you the correct gradient for that objective."}],"speech_gaps":[],"frame":"../frames/v031/009.webp","frame_time":1346.51},{"title":"Actor-Critic算法中的基线与价值估计","segments":[{"id":83,"text":"modulo the sampling here being used to sample states and actions. Is the baseline an average over the current trajectory or an average over all trajectories? Yeah. So if we set it to be the value function v, that would be an infinite number of samples. We haven't yet talked about how we're actually going to estimate a or estimate q versus v.","start":1496.16,"end":1524.46},{"id":84,"text":"So we'll talk about that in a minute. But yeah, 4v, conceptually that would be over an infinite number. But I'm talking about this is the true value so far. We haven't talked about how to estimate the value yet. Yeah, so the question is, is this unbiased?","start":1524.99,"end":1541.54},{"id":85,"text":"It is unbiased. You can go through the math. I won't go through that today for the sake of time. But yeah, this is an unbiased estimate of the gradient if you have the true advantage. Now, we will see things that are biased later today. Okay, so let's actually talk about how do we use this. And actually, just as a quick overview of what the algorithm will look like for this form of algorithm.","start":1542.64,"end":1568.44},{"id":86,"text":"before we had this loop between running the policy and improving the policy. Now we're going to have an additional step where we're going to fit a model that's going to estimate the expected return. Essentially, it's going to try to estimate this A right here. Our new algorithm will have a few different steps. One is to run the policy, one is to try to estimate","start":1569.52,"end":1591.44},{"id":87,"text":"estimate values. And then the last will be then to use that estimate and the data that was collected to improve the policy. And so this step will involve estimating either V pi, Q pi, or A pi. And this step will be kind of similar to before, except it's going to use these estimates right here. Okay, so how do we actually estimate these values?","start":1592.28,"end":1621.86},{"id":88,"text":"So we want to estimate this, this quantity right here. And to start out, we need to think about how we want to get to A pi. And we could try to directly fit A pi, although it's actually a little bit challenging to get direct supervision for the advantages.","start":1622.8,"end":1645.48},{"id":89,"text":"And so we're actually going to try to fit v pi.","start":1646.6,"end":1650.3},{"id":90,"text":"And the way that we're going to get there is we, let's see,","start":1650.48,"end":1657.04},{"id":91,"text":"where do we want to go?","start":1657.12,"end":1657.88}],"notes":["本段讨论了Actor-Critic算法中基线的定义，即是否是对当前轨迹或所有轨迹的平均。教师指出，如果基线是价值函数v，则需要无限多的样本。同时，教师提到尚未讨论如何估计a或q与v，以及是否无偏的问题。","教师确认了该估计是无偏的，但指出今天不会详细推导数学证明。随后，教师提到后续会看到有偏的估计，并开始讨论如何使用该估计。","教师介绍了Actor-Critic算法的结构，包括运行策略、估计值和改进策略三个步骤。与之前的策略改进循环不同，现在增加了估计期望回报的步骤，用于估计优势函数A。","教师提到估计这些值（Vπ、Qπ或Aπ）的步骤与之前类似，但会使用这些估计值。随后，教师讨论了如何估计这些值，指出直接拟合优势函数Aπ可能具有挑战性，因此选择拟合价值函数Vπ。","教师提到拟合Vπ的方法，但未具体说明，而是询问了下一步的方向，即如何从当前状态到达目标状态。这表明教师正在引导学生思考如何实现价值函数的估计。","教师的讲解涵盖了Actor-Critic算法的基本结构，包括基线的定义、无偏性、价值函数的估计以及算法的步骤。这些内容为后续讨论如何具体实现价值函数的估计奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1496.16,"end":1657.88,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1496.16,"text":"modulo the sampling here being used to sample states and actions. Is the baseline an average over the current trajectory or an average over all trajectories? Yeah. So if we set it to be the value function v, that would be an infinite number of samples. We haven't yet talked about how we're actually going to estimate a or estimate q versus v."},{"start":1524.99,"text":"So we'll talk about that in a minute. But yeah, 4v, conceptually that would be over an infinite number. But I'm talking about this is the true value so far. We haven't talked about how to estimate the value yet. Yeah, so the question is, is this unbiased?"},{"start":1542.64,"text":"It is unbiased. You can go through the math. I won't go through that today for the sake of time. But yeah, this is an unbiased estimate of the gradient if you have the true advantage. Now, we will see things that are biased later today. Okay, so let's actually talk about how do we use this. And actually, just as a quick overview of what the algorithm will look like for this form of  environment. And then after this state, it's essentially going to be the sum of rewards"},{"start":1769.88,"text":"starting at st plus 1 and following your policy. And the sum of rewards starting at... sorry,"},{"start":1777.9,"text":"this should be st plus 1. The sum of rewards starting at st plus 1,"},{"start":1782.54,"text":"that's equal to the value, right? The value of st plus 1. So we can"},{"start":1793.2,"text":"Write this Q value as the reward at the current time step plus the value at the time step after that."},{"start":1801.71,"text":"Now, we can't sample from these dynamics, but when we ran our policy to collect data, we did actually see one outcome, 1st plus 1. And so we can approximate this as the reward at the current time step plus the value at the next time step. And then if we want to estimate the advantage, we can..."},{"start":1828.43,"text":"Write it as the reward at the current time step plus the value at the next time step minus the value at the current time step."}],"speech_gaps":[{"start":1790.032,"end":1791.936}],"frame":"../frames/v031/011.webp","frame_time":1669.88},{"title":"Actor-Critic算法中的价值函数与优势函数","segments":[{"id":113,"text":"And so maybe I'll do this in a different color to differentiate it.","start":1837.37,"end":1842.95},{"id":114,"text":"So now a pi can be written as, of s, t, a, t, can be approximated as the reward that you saw plus the value at the next time step minus the value at the current time step.","start":1842.95,"end":1863.45},{"id":115,"text":"step. And so if we then have an estimate of v for our policy, then we can estimate the","start":1863.45,"end":1874.03},{"id":116,"text":"advantage and we can just try to directly fit v. And so on the slides, what this looks","start":1874.03,"end":1880.23},{"id":117,"text":"like, we have q. q can be written as the expected future rewards, which is the reward at the","start":1880.23,"end":1888.01},{"id":118,"text":"current time step plus the future rewards. These future rewards
