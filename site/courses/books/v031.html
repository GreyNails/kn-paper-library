e current time step."},{"start":1863.45,"text":"step. And so if we then have an estimate of v for our policy, then we can estimate the"},{"start":1874.03,"text":"advantage and we can just try to directly fit v. And so on the slides, what this looks"},{"start":1880.23,"text":"like, we have q. q can be written as the expected future rewards, which is the reward at the"},{"start":1888.01,"text":"current time step plus the future rewards. These future rewards can be written as the"},{"start":1892.89,"text":"value, and so we can think of q as the reward at the current time step plus the value at"},{"start":1898.29,"text":"the next time step."},{"start":1902.87,"text":"So why is the second-to-last line, why is this an approximation?"},{"start":1908.73,"text":"The reason for this is that the next state, there's actually multiple possible next states,"},{"start":1913.97,"text":"and we're just going to use one sample from this expectation, which is the sample that"},{"start":1920.09,"text":"we saw when we rolled out the trajectory in our data. And if you wanted an exact thing,"},{"start":1926.01,"text":"you would need to estimate this expectation with infinite samples."},{"start":1929.67,"text":"How good of an approximation is this? So it is going to be a single sample approximation."},{"start":1936.37,"text":"The good news is that later on we'll see ways to use lots of data to do this."},{"start":1943.81,"text":"and so it's in general well so I guess the first thing is if you're if this is very deterministic"},{"start":1950.39,"text":"it's going to be at first it's going to be a good estimate because there aren't that many futures"},{"start":1954.89,"text":"if it's more stochastic then it's going to be a worse estimate and then we'll see ways in which"},{"start":1959.73,"text":"we can use data and take lots of gradient steps in a way that makes it not too bad so the question"},{"start":1965.43,"text":"is is there any new interaction with the environment so I guess we haven't yet talked"},{"start":1971.35,"text":"about how to fit vpy. So we will talk about that in the next slide. So if you have some trajectory,"},{"start":1980.13,"text":"this will be like the st, at, and st plus one in your trajectory."},{"start":1984.07,"text":"From the same trajectory, yeah. So you need to use the same trajectory for this."},{"start":1989.55,"text":"Sometimes I forget to put the pi on here, and there is a lot of"}],"speech_gaps":[],"frame":"../frames/v031/012.webp","frame_time":1849.37},{"title":"Actor-Critic算法中的价值函数估计","segments":[{"id":137,"text":"Reinforcement learning work that drops the pi is just for simplicity, but it is actually in some ways very important to have a pi there because it is estimating a value for a particular policy, not for any policy. So the question is, why are we choosing to estimate V versus Q versus A? It's just a little bit simpler in practice, but you can also... There are also ways to directly estimate Q, and actually we'll talk about some of those ways next week as well. Okay.","start":1994.0,"end":2026.0},{"id":138,"text":"Cool. So we're just going to fit V pi. And then once we fit V pi, we can get the advantage and then plug that into our gradient for our policy. We can represent V pi as a neural network. And what this will look like is we'll pass as input a state. And then it will output a single scalar value, not as pictured here, a single scalar value that represents the value of that state for that policy. This neural network will have some parameters.","start":2028.4,"end":2056.25},{"id":139,"text":"The first version... So in the very, very initial version of vanilla policy gradients, we just used a single trajectory, a single sample. And we kind of... Instead of actually learning a model, we just used that sample. In principle, we could also...","start":2058.22,"end":2088.09},{"id":140,"text":"use many samples and then, yeah, use many samples. Unfortunately, if you were to try to go to a particular state and then take many samples from that state, that means that you would have to be able to kind of reset the world to that state and kind of see what happens if you took many different rollouts from that same state. And unfortunately, in many scenarios, it's very hard to reset the state.","start":2089.58,"end":2115.16},{"id":141,"text":"If you are in simulated settings, sometimes you can actually reset the simulator. So there is sometimes scenarios where you can do this, but in practice, we typically don't do this. So since we can't directly reset and take lots of samples, what we can do is we can use multiple trajectories that we had sampled and just train a single model on the original single sample estimate.","start":2115.8,"end":2143.89},{"id":142,"text":"And because of the trajectories that we have, they will have some states in them that are similar. You'll be able to essentially learn how to amortize the data. So you'll see some examples in the environment that have very similar states and have corresponding future rewards in them. And with that repetition in your data,","start":2144.59,"end":2173.52}],"notes":["本段讲解了在强化学习中，为什么选择估计价值函数V而不是Q或A。虽然估计V在实践中更简单，但也可以直接估计Q，这将在下周讨论。","接下来的讲解说明了如何估计策略π的价值函数Vπ。Vπ可以表示为神经网络，输入是状态，输出是该状态在策略π下的价值，是一个标量值。","在最初的策略梯度方法中，使用单个轨迹或样本进行估计。然而，直接重置状态并从该状态进行多次采样在许多场景中是困难的。","在模拟环境中，有时可以重置模拟器，但在实践中通常不这样做。因此，使用多个轨迹并训练单个模型来估计Vπ成为一种替代方法。","由于轨迹中包含相似的状态，可以利用这些重复的数据进行数据的泛化，从而更有效地学习价值函数。","通过重复的数据，模型可以学习如何对相似状态进行泛化，从而提高估计的准确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1994.0,"end":2173.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1994.0,"text":"Reinforcement learning work that drops the pi is just for simplicity, but it is actually in some ways very important to have a pi there because it is estimating a value for a particular policy, not for any policy. So the question is, why are we choosing to estimate V versus Q versus A? It's just a little bit simpler in practice, but you can also... There are also ways to directly estimate Q, and actually we'll talk about some of those ways next week as well. Okay."},{"start":2028.4,"text":"Cool. So we're just going to fit V pi. And then once we fit V pi, we can get the advantage and then plug that into our gradient for our policy. We can represent V pi as a neural network. And what this will look like is we'll pass as input a state. And then it will output a single scalar value, not as pictured here, a single scalar value that represents the value of that state for that policy. This neural network will have some parameters."},{"start":2058.22,"text":"So how do we do this? So there's a few different ways to estimate b-pi. The first version... So in the very, very initial version of vanilla policy gradients, we just used a single trajectory, a single sample. And we kind of... Instead of actually learning a model, we just used that sample. In principle, we could also..."},{"start":2089.58,"text":"use many samples and then, yeah, use many samples. Unfortunately, if you were to try to go to a particular state and then take many samples from that state, that means that you would have to be able to kind of reset the world to that state and kind of see what happens if you took many different rollouts from that same state. And unfortunately, in many scenarios, it's very hard to reset the state."},{"start":2115.8,"text":"If you are in simulated settings, sometimes you can actually reset the simulator. So there is sometimes scenarios where you can do this, but in practice, we typically don't do this. So since we can't directly reset and take lots of samples, what we can do is we can use multiple trajectories that we had sampled and just train a single model on the original single sample estimate."},{"start":2144.59,"text":"And because of the trajectories that we have, they will have some states in them that are similar. You'll be able to essentially learn how to amortize the data. So you'll see some examples in the environment that have very similar states and have corresponding future rewards in them. And with that repetition in your data,"}],"speech_gaps":[],"frame":"../frames/v031/013.webp","frame_time":2006.0},{"title":"Actor-Critic算法中的监督学习方法","segments":[{"id":143,"text":"a neural network can actually learn, kind of have a little bit more density in terms of the rewards that you'll see for a given state. And so what this is going to look like is you can take your data set and for all of the... you'll have i equals one to n trajectories, and each trajectory will have time steps in it.","start":2174.06,"end":2203.3},{"id":144,"text":"And for all of those trajectories and time steps, you'll also have some sum of rewards that you observe for that. So you'll have some sum of rewards that start at T to the end of the rewards of the states and actions that you visited. And if you aggregate kind of all the trajectories in your data set,","start":2204.36,"end":2236.69},{"id":145,"text":"And you can train a model to go from the state that you saw to the sum of rewards that was observed when you ran the policy. And with this, you can kind of form a supervised learning data set where this is the label in the data set. And you can train with supervised learning a model to take as input this and output this quantity right here.","start":2237.1,"end":2264.86},{"id":146,"text":"And the number of data points in your data set will be the number of trajectories times the average number of timestamps.","start":2265.41,"end":2270.69},{"id":147,"text":"Yeah, so the question is, each time your policy changes, do you have to kind of recollect the data and refit this?","start":2271.45,"end":2276.99},{"id":148,"text":"With this approach, yes.","start":2278.15,"end":2279.85},{"id":149,"text":"We will see approaches later.","start":2280.27,"end":2281.91},{"id":150,"text":"This is like the simplest and kind of dumbest approach you can use to fit a value function.","start":2282.39,"end":2286.95},{"id":151,"text":"And we will see approaches where you can kind of reuse other data.","start":2288.61,"end":2291.81},{"id":152,"text":"Yeah, so the question was, if we're going to be running a lot of simulations or rollouts of our policy, is it unreasonable to try to learn some estimate of future states given the current state in action?","start":2292.55,"end":2303.05},{"id":153,"text":"The two things here, if you have a very simple state space, a very small state space, you might be able to store some things and form an estimate just from storing things.","start":2305.47,"end":2318.83},{"id":154,"text":"things.","start":2318.83,"end":2318.97},{"id":155,"text":"You could also in principle train a neural network to predict what future states would","start":2319.29,"end":2323.19},{"id":156,"text":"be given current states and actions.","start":2323.19,"end":2324.75},{"id":157,"text":"There are a set of approaches that use those, that do that, and they're called model-based","start":2325.85,"end":2330.45},{"id":158,"text":"approaches in that they're learning a model of the world, and we will talk about those","start":2330.45,"end":2334.87},{"id":159,"text":"approaches in a few weeks.","start":2334.87,"end":2336.59},{"id":160,"text":"Okay, so this first approach is just to aggregate, kind of run a bunch of samples, aggregate","start":2340.69,"end":2348.05}],"notes":["本段讲授了在Actor-Critic算法中，如何通过监督学习方法来估计价值函数。具体来说，通过收集多个轨迹的数据，每个轨迹包含时间步和对应的奖励总和，可以构建一个监督学习的数据集，其中状态作为输入，奖励总和作为标签。这样，可以训练一个模型来预测给定状态下的奖励总和。","课堂中提到，数据集中的数据点数量等于轨迹数量乘以平均时间步数。这表明，随着轨迹数量和时间步数的增加，数据集的规模也会相应扩大。","教师指出，每次策略变化时，是否需要重新收集数据并重新拟合模型，这是一个需要考虑的问题。当前的方法需要重新收集数据，但后续会介绍可以复用数据的方法。","教师提到，如果状态空间非常简单，可以存储一些信息并直接形成估计。这适用于状态空间较小的情况，但不适用于复杂的状态空间。","教师还提到，可以训练神经网络来预测未来状态，基于当前状态和动作。这种方法属于模型驱动的方法，即学习世界的模型，将在几周后进一步讨论。","最后，教师指出，这种方法是拟合价值函数的最简单和最原始的方法，但后续会介绍更高效的方法，如复用数据的方法。"],"formulas":[],"uncertainties":["be given current states and actions."],"diagram":"none","start":2174.06,"end":2348.05,"asr_flags":[154],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2174.06,"text":"a neural network can actually learn, kind of have a little bit more density in terms of the rewards that you'll see for a given state. And so what this is going to look like is you can take your data set and for all of the... you'll have i equals one to n trajectories, and each trajectory will have time steps in it."},{"start":2204.36,"text":"And for all of those trajectories and time steps, you'll also have some sum of rewards that you observe for that. So you'll have some sum of rewards that start at T to the end of the rewards of the states and actions that you visited. And if you aggregate kind of all the trajectories in your data set,"},{"start":2237.1,"text":"you can train a model to go from the state that you saw to the sum of rewards that was observed when you ran the policy. And with this, you can kind of form a supervised learning data set where this is the label in the data set. And you can train with supervised learning a model to take as input this and output this quantity right here."},{"start":2265.41,"text":"And the number of data points in your data set will be the number of trajectories times the average number of timestamps."},{"start":2271.45,"text":"Yeah, so the question is, each time your policy changes, do you have to kind of recollect the data and refit this?"},{"start":2278.15,"text":"With this approach, yes."},{"start":2280.27,"text":"We will see approaches later."},{"start":2282.39,"text":"This is like the simplest and kind of dumbest approach you can use to fit a value function."},{"start":2288.61,"text":"And we will see approaches where you can kind of reuse other data."},{"start":2292.55,"text":"Yeah, so the question was, if we're going to be running a lot of simulations or rollouts of our policy, is it unreasonable to try to learn some estimate of future states given the current state in action?"},{"start":2305.47,"text":"The two things here, if you have a very simple state space, a very small state space, you might be able to store some things and form an estimate just from storing things."},{"start":2318.83,"text":"things."},{"start":2319.29,"text":"You could also in principle train a neural network to predict what future states would"},{"start":2323.19,"text":"be given current states and actions."},{"start":2325.85,"text":"There are a set of approaches that use those, that do that, and they're called model-based"},{"start":2330.45,"text":"approaches in that they're learning a model of the world, and we will talk about those"},{"start":2334.87,"text":"approaches in a few weeks."},{"start":2340.69,"text":"Okay, so this first approach is just to aggregate, kind of run a bunch of samples, aggregate"}],"speech_gaps":[],"frame":"../frames/v031/014.webp","frame_time":2186.06},{"title":"监督学习拟合价值函数","segments":[{"id":161,"text":"a data set of our future rewards and then run supervised learning to fit an estimated value function","start":2348.05,"end":2355.91},{"id":162,"text":"where you can form a kind of an L2 error between your predicted value and the observed sum of rewards","start":2355.91,"end":2363.95},{"id":163,"text":"and the observed sum of rewards and then minimize that with respect to","start":2364.61,"end":2369.71},{"id":164,"text":"the gradient steps here that we take are going to be trying to fit a value function, and the value function isn't changing the policy. And so you can actually take many gradient steps on this objective to learn a value function without having to recollect your data.","start":2370.44,"end":2404.19},{"id":165,"text":"data points in your data set. And so this actually can also be a sum over int, just for completeness. So that will be kind of the objective, and you can run gradient descent on this objective to fit a value function on your data point. Do we need to train a neural network for every gradient step in this case? So this is actually different from policy gradient, where we...","start":2404.98,"end":2430.6},{"id":166,"text":"the gradient steps here that we take are going to be trying to fit a value function, and the value function isn't changing the policy. And so you can actually take many gradient steps on this objective to learn a value function without having to recollect your data.","start":2432.75,"end":2448.61},{"id":167,"text":"Cool. So this is the simplest approach for training a value function.","start":2451.5,"end":2454.22},{"id":168,"text":"It's called Monte Carlo estimation, where essentially you're just running lots of simulations,","start":2454.46,"end":2461.54},{"id":169,"text":"running lots of rollouts, and then trying to learn how to predict the outcome of the future rewards.","start":2461.74,"end":2468.5},{"id":170,"text":"Now, there's actually an approach that's better than this.","start":2472.54,"end":2476.32},{"id":171,"text":"And in particular, when we think about these sum of rewards, maybe it's helpful to draw a picture in this case.","start":2477.96,"end":2485.28},{"id":172,"text":"So we have a bunch of trajectories that we have sampled.","start":2485.46,"end":2493.72},{"id":173,"text":"and in this case what we're doing is when we have a kind of a state right here we are summing the","start":2496.6,"end":2508.04},{"id":174,"text":"rewards here as the value and as we're learning this we're kind of starting to learn what the","start":2508.04,"end":2517.6},{"id":175,"text":"value is, what the value of a given state is. And this means that maybe halfway through training,","start":2517.6,"end":2526.5}],"notes":["本段讲解了如何通过监督学习拟合价值函数。讲者提到，可以使用一个包含未来奖励的数据集，并通过监督学习来估计价值函数。具体来说，可以通过计算预测值与观测到的奖励总和之间的L2误差，然后对价值函数的参数进行最小化。这种目标函数可以表示为对所有数据点的误差求和，从而进行梯度下降以拟合价值函数。","讲者进一步指出，这种方法与策略梯度方法不同，因为这里的梯度步骤是用于拟合价值函数，而不是直接更新策略。因此，可以在不重新收集数据的情况下，对这个目标函数进行多次梯度步骤，从而学习价值函数。","讲者提到，这种方法被称为蒙特卡洛估计，即通过运行大量模拟和rollouts来学习如何预测未来奖励的结果。这种方法虽然简单，但存在改进的空间。","讲者指出，当考虑奖励总和时，可能需要绘制示意图来帮助理解。例如，可以将采样的轨迹可视化，并在特定状态处计算奖励总和，从而学习该状态的价值。这种方法在训练过程中可能需要多次迭代，以逐步学习每个状态的价值。","讲者强调，这种方法虽然简单，但可能不是最优的。因此，需要考虑更优的算法，例如结合策略梯度和价值函数估计的Actor-Critic方法。","讲者提到，价值函数的学习过程可能需要多次迭代，并且在训练过程中，价值函数会逐步收敛到更准确的估计值。这种方法在强化学习中是基础性的，但需要进一步优化以提高效率。"],"formulas":[],"uncertainties":["sum over int"],"diagram":"none","start":2348.05,"end":2526.5,"asr_flags":[],"math_clarifications":["原文未明确说明使用均方误差作为损失函数，因此无法确定公式中的目标函数是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2348.05,"text":"a data set of our future rewards and then run supervised learning to fit an estimated"},{"start":2355.91,"text":"value function where you can form a kind of a an L2 error between your predicted value"},{"start":2364.61,"text":"and the observed sum of rewards and then minimize that with respect to"},{"start":2370.44,"text":"the parameters of your value function. And so what this objective looks like is minimizing, with respect to your parameters, the difference between your predicted value and the example or the sum of words that you saw in your dataset for a given i. And you'll do this for all of the"},{"start":2404.98,"text":"data points in your data set. And so this actually can also be a sum over int, just for completeness. So that will be kind of the objective, and you can run gradient descent on this objective to fit a value function on your data point. Do we need to train a neural network for every gradient step in this case? So this is actually different from policy gradient, where we..."},{"start":2432.75,"text":"the gradient steps here that we take are going to be trying to fit a value function, and the value function isn't changing the policy. And so you can actually take many gradient steps on this objective to learn a value function without having to recollect your data."},{"start":2451.5,"text":"Cool. So this is the simplest approach for training a value function."},{"start":2454.46,"text":"It's called Monte Carlo estimation, where essentially you're just running lots of simulations,"},{"start":2461.74,"text":"running lots of rollouts, and then trying to learn how to predict the outcome of the future rewards."},{"start":2472.54,"text":"Now, there's actually an approach that's better than this."},{"start":2477.96,"text":"And in particular, when we think about these sum of rewards, maybe it's helpful to draw a picture in this case."},{"start":2485.46,"text":"So we have a bunch of trajectories that we have sampled."},{"start":2496.6,"text":"and in this case what we're doing is when we have a kind of a state right here we are summing the"},{"start":2508.04,"text":"rewards here as the value and as we're learning this we're kind of starting to learn what the"},{"start":2517.6,"text":"value is, what the value of a given state is. And this means that maybe halfway through training,"}],"speech_gaps":[],"frame":"../frames/v031/015.webp","frame_time":2360.05},{"title":"Actor-Critic算法中的监督信号与价值函数估计","segments":[{"id":176,"text":"when we're regressing to future rewards, and if we start to get what is a good value of this state","start":2526.66,"end":2533.88},{"id":177,"text":"right here, then we can actually try to use our own estimate of this value as the supervision","start":2533.88,"end":2540.14},{"id":178,"text":"And in particular, if we know that the reward we got a reward at this time step right here to then get to here,","start":2540.14,"end":2549.12},{"id":179,"text":"then we could actually use that reward plus our estimate as the supervision target rather than just using the sum of future reward.","start":2549.78,"end":2560.74},{"id":180,"text":"And so in particular, the ideal target is the sum of like the true sum of expected","start":2562.36,"end":2570.64},{"id":181,"text":"This is equal to the reward at the current time step plus the expected rewards at the next time step. And this is equal to the sum of rewards at the next time step is equal to the value of the next state. And so in principle, what we could do is instead of trying to regress to future rewards, we could regress to the reward.","start":2571.82,"end":2602.56},{"id":182,"text":"at the current time step plus the value at the next time step. And so we're actually going to be, in this case, using our estimate of the value at the next time step as part of the supervision target. So this would be, these are all for a given trajectory, and this would be your new label for your data set for a given date.","start":2603.49,"end":2633.55},{"id":183,"text":"Yeah, so the question is, how often do you update these VPIs? In practice, you can update them every single iteration. If it's really expensive to update them, you could update them less frequently, like if you have a really huge neural network. But in practice, typically, we update them every single gradient.","start":2636.55,"end":2655.69},{"id":184,"text":"We have these kind of bootstrapped estimates. We refer to this as bootstrapping because we're actually kind of bootstrapping off of our own estimate of the value function as part of the learning process. We formulate our training data. We're then going to use the same exact objective to fit a value function. Just regressing to these targets, we just have different labels in our data set now. And these labels are changing as we...","start":2658.35,"end":2682.64}],"notes":["本段讲解了在Actor-Critic算法中，如何利用当前状态的估计值作为监督信号。讲者指出，传统的监督信号是未来奖励的总和，但可以将当前奖励与下一个状态的估计值结合，作为新的监督目标。这种做法减少了对未来奖励的依赖，提高了估计的稳定性。","讲者提到，这种监督信号的构建方式类似于回归问题，但标签是动态变化的，因为每个时间步的估计值会随着训练过程而更新。这种动态性使得算法能够逐步改进对价值函数的估计。","在监督信号的构建中，讲者强调了当前奖励和下一个状态价值的结合，即监督目标为当前奖励加上下一个状态的估计值。这种做法避免了对所有未来奖励的直接回归，从而减少了计算复杂度。","讲者还讨论了VPI（Value Prediction Interval）的更新频率问题。在实践中，可以每一步都更新VPI，但如果计算成本很高，也可以减少更新频率，例如在使用大型神经网络时。","讲者提到，这种基于自身估计值的监督方式被称为“bootstrapping”，即利用当前估计值来改进后续的估计。这种方法在强化学习中是常见的，因为它允许算法在训练过程中逐步优化价值函数。","最后，讲者指出，这种监督信号的构建方式与传统的价值函数拟合方法类似，只是标签发生了变化。这种变化使得算法能够更灵活地适应不同的任务和环境。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2526.66,"end":2682.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2526.66,"text":"when we're regressing to future rewards, and if we start to get what is a good value of this state"},{"start":2533.88,"text":"right here, then we can actually try to use our own estimate of this value as the supervision"},{"start":2540.14,"text":"And in particular, if we know that the reward we got a reward at this time step right here to then get to here,"},{"start":2549.78,"text":"then we could actually use that reward plus our estimate as the supervision target rather than just using the sum of future reward."},{"start":2562.36,"text":"And so in particular, the ideal target is the sum of like the true sum of expected"},{"start":2571.82,"text":"This is equal to the reward at the current time step plus the expected rewards at the next time step. And this is equal to the sum of rewards at the next time step is equal to the value of the next state. And so in principle, what we could do is instead of trying to regress to future rewards, we could regress to the reward."},{"start":2603.49,"text":"at the current time step plus the value at the next time step. And so we're actually going to be, in this case, using our estimate of the value at the next time step as part of the supervision target. So this would be, these are all for a given trajectory, and this would be your new label for your data set for a given date."},{"start":2636.55,"text":"Yeah, so the question is, how often do you update these VPIs? In practice, you can update them every single iteration. If it's really expensive to update them, you could update them less frequently, like if you have a really huge neural network. But in practice, typically, we update them every single gradient."},{"start":2658.35,"text":"We have these kind of bootstrapped estimates. We refer to this as bootstrapping because we're actually kind of bootstrapping off of our own estimate of the value function as part of the learning process. We formulate our training data. We're then going to use the same exact objective to fit a value function. Just regressing to these targets, we just have different labels in our data set now. And these labels are changing as we..."}],"speech_gaps":[],"frame":"../frames/v031/016.webp","frame_time":2538.66},{"title":"Actor-Critic算法中的目标函数与初始化","segments":[{"id":185,"text":"are changing as we run gradient descent on our objective. And so you often will update your labels every single gradient update. The question is, is this based on one trajectory or is this based on multiple trajectories where things are close together? So this data set will be over multiple trajectories where i is indexing over trajectories and t is indexing over time inside those trajectories.","start":2683.34,"end":2709.55},{"id":186,"text":"In terms of this label, this will be for a given data point. You're not going to be running multiple simulations from that data point, but you're going to be estimating what would have happened from your future state rather than a single sample of what happened in that trajectory.","start":2710.07,"end":2731.7},{"id":187,"text":"And so with this, you're actually able to get a better estimate of all of the possible outcomes that might have happened at the next state rather than just one outcome. So you're asking, why is the input to the value function just s and not including previous time steps? Oh, so in this expectation, this is representing...","start":2732.46,"end":2755.61},{"id":188,"text":"The ideal target for our value function is the sum of future rewards. And you can think about this sum of future rewards as the reward at the current time step, which is a deterministic quantity, plus the future rewards conditioned on our current state.","start":2758.27,"end":2777.65},{"id":189,"text":"And so this is conditioned on the current state because the future rewards is a function of where we are right now. And it's actually only a function of where we are right now and not anything else. Yeah, so the question is, does this require that you have a good initial value estimate? Because if it's really bad at the beginning, then your targets will be really bad.","start":2778.34,"end":2800.66},{"id":190,"text":"There are some considerations when initializing it, although oftentimes you don't need to do anything super fancy to initialize it, and you can just get started training on this directly. You probably don't want to initialize your neural network such that the values are negative 1,000 or something. That would be bad. But usually we don't initialize our neural networks that way anyway. I don't know if I've in practice seen any issues.","start":2802.35,"end":2829.69},{"id":191,"text":"with this. But in principle, you could also start with a Monte Carlo objective just to get it in the right ballpark and then continue with this update after that. So is this part of backpropagation and is there a better way than updating the labels every step? So we'll be using backpropagation to optimize that objective right there. You could also think about this as like propagating information backwards in time.","start":2830.27,"end":2855.43}],"notes":["本段讨论了Actor-Critic算法中价值函数的目标，即未来奖励的总和。价值函数的输入仅是当前状态，而不是之前的时间步，这是因为未来奖励是当前状态的函数，而不是过去状态的函数。","在初始化价值函数时，需要考虑初始估计值的质量。如果初始估计值非常差，那么目标值也会非常差，从而影响训练效果。但通常不需要复杂的初始化方法，直接开始训练即可。","在初始化神经网络时，避免将值初始化为负数，如-1000，这会导致训练困难。虽然在实践中可能没有遇到此类问题，但仍然需要注意。","可以考虑使用蒙特卡洛目标来初始化，以获得一个合理的初始估计，然后再继续使用当前的更新方法。","在优化目标函数时，使用反向传播算法，这可以视为在时间上反向传播信息。这种方法比每次更新标签更有效。","价值函数的估计依赖于当前状态，而不是过去的状态，因此在设计算法时需要确保这一点。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2683.34,"end":2855.43,"asr_flags":[],"math_clarifications":["原文中未提及价值函数的定义或公式，因此无法确认该公式是否正确或适用。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2683.34,"text":"are changing as we run gradient descent on our objective. And so you often will update your labels every single gradient update. The question is, is this based on one trajectory or is this based on multiple trajectories where things are close together? So this data set will be over multiple trajectories where i is indexing over trajectories and t is indexing over time inside those trajectories."},{"start":2710.07,"text":"In terms of this label, this will be for a given data point. You're not going to be running multiple simulations from that data point, but you're going to be estimating what would have happened from your future state rather than a single sample of what happened in that trajectory."},{"start":2732.46,"text":"And so with this, you're actually able to get a better estimate of all of the possible outcomes that might have happened at the next state rather than just one outcome. So you're asking, why is the input to the value function just s and not including previous time steps? Oh, so in this expectation, this is representing..."},{"start":2758.27,"text":"The ideal target for our value function is the sum of future rewards. And you can think about this sum of future rewards as the reward at the current time step, which is a deterministic quantity, plus the future rewards conditioned on our current state."},{"start":2778.34,"text":"And so this is conditioned on the current state because the future rewards is a function of where we are right now. And it's actually only a function of where we are right now and not anything else. Yeah, so the question is, does this require that you have a good initial value estimate? Because if it's really bad at the beginning, then your targets will be really bad."},{"start":2802.35,"text":"There are some considerations when initializing it, although oftentimes you don't need to do anything super fancy to initialize it, and you can just get started training on this directly. You probably don't want to initialize your neural network such that the values are negative 1,000 or something. That would be bad. But usually we don't initialize our neural networks that way anyway. I don't know if I've in practice seen any issues."},{"start":2830.27,"text":"with this. But in principle, you could also start with a Monte Carlo objective just to get it in the right ballpark and then continue with this update after that. So is this part of backpropagation and is there a better way than updating the labels every step? So we'll be using backpropagation to optimize that objective right there. You could also think about this as like propagating information backwards in time."}],"speech_gaps":[],"frame":"../frames/v031/017.webp","frame_time":2695.34},{"title":"Actor-Critic算法中的蒙特卡洛与时间差分学习","segments":[{"id":192,"text":"which is distinct from propagating gradients through the network. One other name for this is called temporal difference learning, where we're looking at the difference between the future time step and the current time step. But generally, propagating information through time is fairly distinct from backpropagation.","start":2855.99,"end":2878.75},{"id":193,"text":"To summarize what we've talked about so far, Monte Carlo, we're supervising with the rollout sum rewards, whereas bootstrapping, we're supervising using the reward plus the current value estimate of the next state.","start":2881.8,"end":2902.5},{"id":194,"text":"And if we look at an example, and actually, yeah, I'll give another kind of... exercise for you to figure out. So let's look at an example. So we run the policy. Maybe we just have two trajectories. In practice, we'll have more than this. But say we have two trajectories. One of these trajectories, the final reward was negative one. The other trajectory, the final reward was one. And along this directory, before the final state, the reward is zero. My question for you is...","start":2902.78,"end":2927.74},{"id":195,"text":"what estimate would we get for two different states for the value function? And in particular, if we were training on just these two trajectories and we use Monte Carlo versus using temporal difference or bootstrap learning, what would we estimate the value to be for the blue state for these two? And what would we estimate the value to be for the pink state for these two?","start":2930.28,"end":2956.68},{"id":196,"text":"Yeah, so for Monte Carlo in the blue state, It's going to average out the minus one and the plus one. And so this prediction will be zero. Does anyone want to share another one? Yeah. So for the Monte Carlo for this one, this will be negative one because it will be kind of supervised to predict the sum of rewards for the future for this trajectory. Anyone want to share? Maybe before we do that, let's talk about, do you want to do this one?","start":2957.36,"end":2985.25},{"id":197,"text":"It's a little bit more intuitive to go this way. Okay, yeah, so this will also be zero. And then does anyone want to do the back right? Yeah, so for this one, it'll see this kind of blue one in the future. This will have a zero, and then this will also be assigned the hat of zero. And so this is an example of where Monte Carlo and the bootstrap estimate are going to be different.","start":2985.95,"end":3012.31},{"id":198,"text":"And arguably, we get a more accurate estimate from the kind of bootstrap value because it's able to kind of look at its estimate of the value and actually aggregate information across trajectories more effectively.","start":3012.78,"end":3026.04}],"notes":["本段讲解了蒙特卡洛方法和时间差分学习（bootstrapping）在强化学习中的区别。蒙特卡洛方法通过整个轨迹的总奖励进行监督，而时间差分学习则利用当前状态的估计值和奖励来更新值函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2855.99,"end":3026.04,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2855.99,"text":"which is distinct from propagating gradients through the network. One other name for this is called temporal difference learning, where we're looking at the difference between the future time step and the current time step. But generally, propagating information through time is fairly distinct from backpropagation."},{"start":288 o be different."},{"start":3012.78,"text":"And arguably, we get a more accurate estimate from the kind of bootstrap value because it's able to kind of look at its estimate of the value and actually aggregate information across trajectories more effectively."}],"speech_gaps":[],"frame":"../frames/v031/018.webp","frame_time":2867.99},{"title":"蒙特卡洛与时间差分方法的比较","segments":[{"id":199,"text":"why the Monte Carlo is minus one by the top right. Yeah. So the value for this one is going to be minus one because the Monte Carlo objective is supervising to the sum of future rewards that are observed for each trajectory. And so for this trajectory, which is black, it only sees the sum of future rewards along this trajectory. So it only sees negative one.","start":3028.01,"end":3048.95},{"id":200,"text":"And anything over here along this trajectory for Monte Carlo would have a target of one because it only sees the future trajectories here and it doesn't bootstrap off of its estimate that was using all of the trajectories.","start":3049.47,"end":3063.29},{"id":201,"text":"Yeah, so the Monte Carlo blue state, it's going to be that exact state is in the buffer or is in your data set for both trajectories. And so it's going to average the reward for them. But this is like the only scenario where Monte Carlo is going to get information from both trajectories because you have the same exact state in your data sets with two different labels.","start":3064.01,"end":3088.45},{"id":202,"text":"Why is the bootstrapped blue state zero? So this is also going to be averaging the future rewards. It doesn't have anything necessarily special to bootstrap off of. And so kind of for the same reason that Monte Carlo is zero, this will also be zero. So basically, everything after the blue state will have a value estimate of negative one here. And everything after the blue state on the black trajectory is going to have an estimate of negative ones.","start":3089.42,"end":3117.94},{"id":203,"text":"Okay, we should move on. So kind of one question you might ask kind of looking at this is there might also be a middle ground. So Monte Carlo is going to have high variance, but it is completely unbiased, whereas the bootstrap estimate has much lower variance.","start":3119.95,"end":3141.55},{"id":204,"text":"But it actually can be incorrect because your current estimate of the value function is going to have inevitably at least a small amount of error in it. And so maybe there's a way, there might be a way to potentially balance this bias invariance a bit more. And one way that we can think about this is if we have our trajectories, we can think of the Monte Carlo version as using the sum of rewards averaged over those trajectories.","start":3142.13,"end":3171.59},{"id":205,"text":"Whereas the TD version is going to be looking at the first reward plus the value right after that. So it's kind of R plus V for just a temporal difference of just one time step. And you can actually sort of interpolate between these two estimates. And instead of using just one time step, you could use n time steps. So you could look at the reward for n time steps, some of the rewards for n time steps in the future before the variance has increased substantially.","start":3172.67,"end":3202.86}],"notes":["本段讨论了蒙特卡洛方法和时间差分方法在估计价值函数时的不同特性。蒙特卡洛方法基于完整轨迹的未来奖励总和，因此其估计值为负一，而时间差分方法则基于当前奖励和下一个状态的价值估计，因此其估计值为零。蒙特卡洛方法具有高方差但无偏，而时间差分方法具有低方差但可能有偏。"],"formulas":[],"uncertainties":["supervising to the sum of future rewards"],"diagram":"none","start":3028.01,"end":3202.86,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3028.01,"text":"why the Monte Carlo is minus one by the top right. Yeah. So the value for this one is going to be minus one because the Monte Carlo objective is supervising to the sum of future rewards that are observed for each trajectory. And so for this trajectory, which is black, it only sees the sum of future rewards along this trajectory. So it only sees negative one."},{"start":3049.47,"text":"And anything over here along this trajectory for Monte Carlo would have a target of one because it only sees the future trajectories here and it doesn't bootstrap off of its estimate that was using all of the trajectories."},{"start":3064.01,"text":"Yeah, so the Monte Carlo blue state, it's going to be that exact state is in the buffer or is in your data set for both trajectories. And so it's going to average the reward for them. But this is like the only scenario where Monte Carlo is going to get information from both trajectories because you have the same exact state in your data sets with two different labels."},{"start":3089.42,"text":"Why is the bootstrapped blue state zero? So this is also going to be averaging the future rewards. It doesn't have anything necessarily special to bootstrap off of. And so kind of for the same reason that Monte Carlo is zero, this will also be zero. So basically, everything after the blue state will have a value estimate of negative one here. And everything after the blue state on the black trajectory is going to have an estimate of negative ones."},{"start":3119.95,"text":"Okay, we should move on. So kind of one question you might ask kind of looking at this is there might also be a middle ground. So Monte Carlo is going to have high variance, but it is completely unbiased, whereas the bootstrap estimate has much lower variance."},{"start":3142.13,"text":"But it actually can be incorrect because your current estimate of the value function is going to have inevitably at least a small amount of error in it. And so maybe there's a way, there might be a way to potentially balance this bias invariance a bit more. And one way that we can think about this is if we have our trajectories, we can think of the Monte Carlo version as using the sum of rewards averaged over those trajectories."},{"start":3172.67,"text":"Whereas the TD version is going to be looking at the first reward plus the value right after that. So it's kind of R plus V for just a temporal difference of just one time step. And you can actually sort of interpolate between these two estimates. And instead of using just one time step, you could use n time steps. So you could look at the reward for n time steps, some of the rewards for n time steps in the future before the variance has increased substantially."}],"speech_gaps":[],"frame":"../frames/v031/019.webp","frame_time":3040.01},{"title":"折扣因子与价值估计的稳定性","segments":[{"id":213,"text":"One aside here, so far we've been summing rewards, and we actually talked in the first lecture about how in some cases we might not want to just blindly sum all rewards in the future. And in particular, if you think about scenarios where the length of the episode is infinite, or very, very long, then your estimate of the value can get very large in those cases.","start":3382.83,"end":3411.77},{"id":214,"text":"And so you might not want to just be summing over all of the rewards in the future.","start":3412.46,"end":3417.42},{"id":215,"text":"And so a simple trick to handle the fact that your estimates of the value can get very big","start":3418.36,"end":3424.12},{"id":216,"text":"is to weight your objective, weight the sum of rewards to be biased towards the earlier rewards.","start":3424.12,"end":3432.18},{"id":217,"text":"V, you can add a coefficient right here. If this coefficient is 1, it's the same as before.","start":3433.98,"end":3439.44},{"id":218,"text":"But you can set it to something like 0.9 or 0.99. And what this is going to do is it's","start":3439.44,"end":3447.82},{"id":219,"text":"going to say that I care more about the rewards at the current time step and less about the","start":3448.36,"end":3453.72},{"id":220,"text":"going to say that I care more about the rewards at the current time step and less about the","start":3453.72,"end":3458.46},{"id":221,"text":"Adding this discount factor that's discounting future rewards actually can be viewed as changing","start":3458.46,"end":3460.72},{"id":222,"text":"Adding this discount factor that's discounting future rewards actually can be viewed as changing","start":3466.36,"end":3473.34},{"id":223,"text":"So it's actually equivalent to saying that there is some probability that the agent will","start":3473.9,"end":3475.1},{"id":224,"text":"So it's actually equivalent to saying that there is some probability that the agent will","start":3476.1,"end":3484.96},{"id":225,"text":"kind of die at any given point in time.","start":3484.96,"end":3487.04},{"id":226,"text":"In this case, using this form is equivalent to saying that there's a 1% chance that the agent will enter some state that has zero reward and stay there forever.","start":3487.04,"end":3496.38},{"id":227,"text":"In this case, using this form is equivalent to saying that there's a 1% chance that the agent will enter some state that has zero reward and stay there forever.","start":3497.12,"end":3508.52},{"id":228,"text":"And so if you have some original MDP right here, the way that this discount factor would","start":3508.52,"end":3508.6},{"id":229,"text":"change the MDP is it would say that with some probability, with a probability 1 minus gamma,","start":3511.12,"end":3518.24},{"id":230,"text":"you enter this kind of death state where you can't do anything else after that.","start":3518.24,"end":3524.36},{"id":231,"text":"and the original probabilities in the rest of the MDP are all multiplied by gamma.","start":3524.64,"end":3531.36},{"id":232,"text":"The question is, is there any relationship between gamma and these n-step things?","start":3532.14,"end":3539.9},{"id":233,"text":"The question is, is there any relationship between gamma and these n-step things?","start":3541.28,"end":3545.02},{"id":234,"text":"If that gamma is small, would that change what you do?","start":3545.4,"end":3548.64},{"id":235,"text":"A way that you would modify this objective would be gamma to the n.","start":3551.82,"end":3555.26}],"notes":["本段讨论了在强化学习中使用折扣因子（gamma）来处理无限或非常长的回合（episode）时价值估计可能变得非常大的问题。讲者指出，通过引入折扣因子，可以将未来奖励的权重降低，从而避免价值估计的爆炸性增长。"],"formulas":[],"uncertainties":["typesets"],"diagram":"none","start":3382.83,"end":3555.26,"asr_flags":[228],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3382.83,"text":"One aside here, so far we've been summing rewards, and we actually talked in the first lecture about how in some cases we might not want to just blindly sum all rewards in the future. And in particular, if you think about scenarios where the length of the episode is infinite, or very, very long, then your estimate of the value can get very large in those cases."},{"start":3412.46,"text":"And so you might not want to just be summing over all of the rewards in the future."},{"start":3418.36,"text":"And so a simple trick to handle the fact that your estimates of the value can get very big"},{"start":3424.12,"text":"is to weight your objective, weight the sum of rewards to be biased towards the earlier rewards."},{"start":3433.98,"text":"And the way that you can write this is instead of having R plus V,"},{"start":3439.44,"text":"V, you can add a coefficient right here. If this coefficient is 1, it's the same as before."},{"start":3448.36,"text":"But you can set it to something like 0.9 or 0.99. And what this is going to do is it's"},{"start":3453.72,"text":"going to say that I care more about the rewards at the current time step and less about the"},{"start":3458.46,"text":"rewards at the future typesets."},{"start":3466.36,"text":"Adding this discount factor that's discounting future rewards actually can be viewed as changing"},{"start":3473.9,"text":"the decision process slightly."},{"start":3476.1,"text":"So it's actually equivalent to saying that there is some probability that the agent will"},{"start":3484.96,"text":"kind of die at any given point in time."},{"start":3487.04,"text":"And so this is equivalent to saying that with some probability, so say like, say gamma is like 0.99."},{"start":3497.12,"text":"In this case, using this form is equivalent to saying that there's a 1% chance that the agent will enter some state that has zero reward and stay there forever."},{"start":3508.52,"text":"forever."},{"start":3511.12,"text":"And so if you have some original MDP right here, the way that this discount factor would"},{"start":3518.24,"text":"change the MDP is it would say that with some probability, with a probability 1 minus gamma,"},{"start":3524.64,"text":"you enter this kind of death state where you can't do anything else after that."},{"start":3532.14,"text":"and the original probabilities in the rest of the MDP are all multiplied by gamma."},{"start":3541.28,"text":"The question is, is there any relationship between gamma and these n-step things?"},{"start":3545.4,"text":"If that gamma is small, would that change what you do?"},{"start":3551.82,"text":"A way that you would modify this objective would be gamma to the n."}],"speech_gaps":[{"start":3464.304,"end":3465.96}],"frame":"../frames/v031/021.webp","frame_time":3394.83},{"title":"Actor-Critic算法中的价值函数与策略更新","segments":[{"id":236,"text":"Possibly. I mean, I think that they're all interconnected in the sense that the choice","start":3560.0,"end":3563.78},{"id":237,"text":"of gamma might depend on the environment. And generally, if you're going to be looking","start":3563.78,"end":3569.58},{"id":238,"text":"further into the future, maybe that's because you're going to be in an environment that's","start":3569.58,"end":3572.82},{"id":239,"text":"more deterministic or has smaller time steps, and that would also affect the choice of gamma.","start":3572.82,"end":3576.88},{"id":240,"text":"So the question was, in terms of choosing how far you look ahead, does that affect whether","start":3577.92,"end":3582.62},{"id":241,"text":"you're prioritizing short versus long term. In this case, it doesn't actually affect","start":3582.62,"end":3590.9},{"id":242,"text":"how greedy you are because the value function is representing the sum of","start":3590.9,"end":3596.52},{"id":243,"text":"rewards and so these are still estimating the same exact quantity.","start":3596.52,"end":3600.68},{"id":244,"text":"It's more a factor of how far in the future are you looking ahead in terms of the rewards. And it's more a factor of how much is the variance increasing. And if the variance increases somewhat slowly, then you can look further ahead into the future. If it increases very, very quickly, then you might want to use a smaller n.","start":3602.35,"end":3632.68},{"id":245,"text":"What we can do is we can sample a batch of data from our policy. Then we will fit our value estimate to the summed rewards in the data. And we can do this by looking at the rewards for a short period of time and then the value. So this would be the equation for n-step returns. And then when we fit this, we'll run multiple gradient steps on this objective that's trying to minimize the difference between our estimates and the observed future reward.","start":3633.77,"end":3661.97},{"id":246,"text":"Then once we have our estimate of the value, then we can use that to estimate the advantage of a particular action by looking at the reward plus the value at the next time step minus the value at the current time step. This is telling us how, according to our value function and the reward we saw, how good is the action that was taken in the dataset.","start":3664.41,"end":3685.63},{"id":247,"text":"And then we can use this to get a gradient for our policy, where we will be increasing the likelihood of actions that are estimated to be advantageous and decreasing the likelihood for actions that are not advantageous. And then lastly, we'll update our policy by applying this gradient step to our policy parameters, and then we can repeat this process to then sample a new batch of data for our policy.","start":3686.99,"end":3712.72},{"id":248,"text":"Now, note here we have two neural networks. One is for the policy and one is for the value function. This is called an actor-critic algorithm because one of the networks is the actor, one of the networks is the value function, which can also be called a critic because it's criticizing how good a state and policy is. Yeah, and that's our algorithm.","start":3715.28,"end":3735.39}],"notes":["本段讲解了在Actor-Critic算法中，选择gamma值与环境特性之间的关系，以及如何通过n步回报来估计价值函数。教师指出，gamma的选择会影响对未来奖励的估计范围，但不会直接影响策略的贪婪程度，因为价值函数仍然估计的是相同的奖励总和。","教师进一步说明了如何通过采样数据并拟合价值函数来实现策略更新。具体来说，通过计算n步回报，可以最小化估计值与实际未来奖励之间的差异，从而优化策略。","在策略更新过程中，教师提到利用价值函数估计动作的优势，即通过当前奖励与下一时刻价值的差值来判断动作的好坏。这一步是策略梯度更新的关键。","最后，教师强调了Actor-Critic算法的结构，即包含两个神经网络：一个用于策略（actor），一个用于价值函数（critic）。价值函数的作用是评估状态和策略的好坏，从而指导策略的更新。","教师还提到，通过多次梯度更新和数据采样，可以不断优化策略，使策略更倾向于选择优势动作，从而提升整体性能。"],"formulas":[],"uncertainties":["n-step returns的具体形式可能因上下文而异，但此处未明确给出完整的公式。"],"diagram":"none","start":3560.0,"end":3735.39,"asr_flags":[],"math_clarifications":["公式中未明确说明\\rho的定义，且未提及n步回报的通用形式，因此无法核定。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3560.0,"text":"Possibly. I mean, I think that they're all interconnected in the sense that the choice"},{"start":3563.78,"text":"of gamma might depend on the environment. And generally, if you're going to be looking"},{"start":3569.58,"text":"further into the future, maybe that's because you're going to be in an environment that's"},{"start":3572.82,"text":"more deterministic or has smaller time steps, and that would also affect the choice of gamma."},{"start":3577.92,"text":"So the question was, in terms of choosing how far you look ahead, does that affect whether"},{"start":3582.62,"text":"you're prioritizing short versus long term. In this case, it doesn't actually affect"},{"start":3590.9,"text":"how greedy you are because the value function is representing the sum of"},{"start":3596.52,"text":"rewards and so these are still estimating the same exact quantity."},{"start":3602.35,"text":"it's more a factor of how far in the future are you looking ahead in terms of the rewards. And it's more a factor of how much is the variance increasing. And if the variance increases somewhat slowly, then you can look further ahead into the future. If it increases very, very quickly, then you might want to use a smaller n. So let's walk through the full algorithm now. So we talked about estimating value functions. Now let's actually put this into practice."},{"start":3633.77,"text":"What we can do is we can sample a batch of data from our policy. Then we will fit our value estimate to the summed rewards in the data. And we can do this by looking at the rewards for a short period of time and then the value. So this would be the equation for n-step returns. And then when we fit this, we'll run multiple gradient steps on this objective that's trying to minimize the difference between our estimates and the observed future reward."},{"start":3664.41,"text":"Then once we have our estimate of the value, then we can use that to estimate the advantage of a particular action by looking at the reward plus the value at the next time step minus the value at the current time step. This is telling us how, according to our value function and the reward we saw, how good is the action that was taken in the dataset."},{"start":3686.99,"text":"And then we can use this to get a gradient for our policy, where we will be increasing the likelihood of actions that are estimated to be advantageous and decreasing the likelihood for actions that are not advantageous. And then lastly, we'll update our policy by applying this gradient step to our policy parameters, and then we can repeat this process to then sample a new batch of data for our policy."},{"start":3715.28,"text":"Now, note here we have two neural networks. One is for the policy and one is for the value function. This is called an actor-critic algorithm because one of the networks is the actor, one of the networks is the value function, which can also be called a critic because it's criticizing how good a state and policy is. Yeah, and that's our algorithm."}],"speech_gaps":[],"frame":"../frames/v031/022.webp","frame_time":3572.0},{"title":"Actor-Critic算法中的价值估计与策略改进","segments":[{"id":249,"text":"Coming back to the examples that we saw before, this is something that's able to actually make use of data, for example, that takes a step forward and then falls backwards, because you can actually learn from the data, especially when you use bootstrapped estimates, that taking a step forward is advantageous and has a positive advantage compared to other actions that you might take. And this is going to be making much more efficient use of the data that we've collected.","start":3737.47,"end":3761.27},{"id":250,"text":"Cool. So review so far, we've talked about policy gradients, which is trying to do more of the good stuff, less of the bad stuff based on what you observe. After critic are learning to estimate what's good and bad and then doing more of the good stuff according to your estimate. And we can get a better estimate by using a neural network to try to explicitly estimate the value function. And then we introduced kind of this third step where we are fitting this model as part of the improvement process.","start":3764.6,"end":3791.73},{"id":251,"text":"We talked about three different ways to estimate value, either directly looking at summed rewards, bootstrapping off the value function, and this hybrid. And this is often referred to as policy evaluation.","start":3793.11,"end":3803.85}],"notes":["本段回顾了策略梯度方法，强调其通过观察来增加有益行为、减少有害行为。随后介绍了评论家（critic）学习估计好坏，从而根据估计结果进行策略改进。使用神经网络显式估计价值函数可以得到更准确的估计，同时引入了第三步，即在改进过程中拟合模型。","在价值估计方面，我们讨论了三种方法：直接计算累积奖励、基于价值函数的自举估计，以及这两种方法的混合。这种混合方法通常被称为策略评估（policy evaluation）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3737.47,"end":3803.85,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3737.47,"text":"Coming back to the examples that we saw before, this is something that's able to actually make use of data, for example, that takes a step forward and then falls backwards, because you can actually learn from the data, especially when you use bootstrapped estimates, that taking a step forward is advantageous and has a positive advantage compared to other actions that you might take. And this is going to be making much more efficient use of the data that we've collected."},{"start":3764.6,"text":"Cool. So review so far, we've talked about policy gradients, which is trying to do more of the good stuff, less of the bad stuff based on what you observe. After critic are learning to estimate what's good and bad and then doing more of the good stuff according to your estimate. And we can get a better estimate by using a neural network to try to explicitly estimate the value function. And then we introduced kind of this third step where we are fitting this model as part of the improvement process."},{"start":3793.11,"text":"We talked about three different ways to estimate value, either directly looking at summed rewards, bootstrapping off the value function, and this hybrid. And this is often referred to as policy evaluation."}],"speech_gaps":[],"frame":"../frames/v031/023.webp","frame_time":3749.47}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

ta.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
